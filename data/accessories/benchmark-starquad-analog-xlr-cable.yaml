details: |-
  The Benchmark Studio&Stage Analog XLR Cables combine premium cable, connectors, and construction for performance that meets the demands of world-class studios while providing the strength and reliability required for stage applications. These cables are also well suited for hi-fi applications because they meet or exceed the electrical performance of the best high-end hi-fi cables.

  The cables use Canare Star Quad L-4E6S microphone and audio line cable, which features a 4-conductor star quad construction that provides excellent immunity to hum-inducing magnetic fields. The high-density braided copper shield blocks RF interference, while 40-strand conductors deliver excellent flexibility and breakage resistance. Tests show that Canare L-4E6S reduces magnetic interference by as much as 25 dB compared to traditional 2-wire cables, and is 10 dB more effective than Mogami Neglex 2534 star-quad cables.

  Each cable is handcrafted in the USA with true silver solder and terminated with premium gold-contact Neutrik XLR connectors with black housings. Benchmark-branded strain relief sleeves at each end provide a controlled bend radius to extend service life at the most common point of failure.
specs: |-
  - Cable: Canare Star Quad L-4E6S
  - Construction: 4-conductor star quad
  - Conductors: 40-strand copper
  - Shield: High-density braided copper
  - Connectors: Neutrik gold-contact XLR, black housings
  - Assembly: Hand-assembled in USA with silver solder
  - Strain relief: Benchmark-branded sleeves at each connector
  - Lengths available: 1, 2, 3, 6, 10, 15, 25 feet
  - Magnetic interference rejection: up to 25 dB vs. 2-wire cables
  - Magnetic interference rejection: 10 dB better than Mogami Neglex 2534
