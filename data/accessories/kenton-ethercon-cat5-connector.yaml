details: |-
  etherCON connectors for assembling etherCON CAT5 cables. The housing adds a locking metal shell around a standard RJ45 so an ethernet run can be used in a live or touring context.

  Two variants are offered. One is for pre-assembled CAT5 cables that already have the RJ45 fitted, and the other is for use when making an ethernet cable from bulk cable and a loose plug.

  The RJ45 plug itself is not included with the connector.
specs: |-
