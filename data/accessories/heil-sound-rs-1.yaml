details: |-
  Overview Features

  The Heil RS-1 is a 12-inch riser mount designed specifically for Heil microphone boom arms. By elevating your boom arm, the RS-1 provides extra vertical clearance to easily extend over mixing consoles, computer monitors, and studio audio equipment. Other manufacturer stem sizes may not fit this mount. It can also be tightened to lock the boom in place. See Specs for installation requirements.

  Ceiling-Mount Your Heil Microphone Boom

  Need to mount your microphone overhead? The Heil RS-1 can be installed on a suitable ceiling surface to support a compatible Heil PL2T or SB-2 microphone boom arm.

  A ceiling-mounted RS-1 is an ideal solution for broadcast studios, podcast rooms, amateur-radio stations, and other workspaces where desk space is limited or overhead microphone positioning is preferred.

  Compatible boom arms: Heil PL2T and SB-2.

  Ceiling installation requires suitable structural support and appropriate mounting hardware for the installation surface.
specs: |-
  - - Silent Rotation: Fitted with a high-quality brass insert to ensure smooth, noiseless boom swivel during live broadcasts and recordings.
  - Locking Mechanism: Includes a tightening knob to securely lock the boom arm at your desired angle.
  - Surface Mount: Mounts directly to a desk or tabletop surface using the three supplied screws for maximum stability.
  - Ceiling Mount: Can be mounted to the ceiling to allow a microphone boom arm ceiling mount for a Heil SB-2 or PL2T boom arm.
  - Boom Compatibility: For Heil PL2T and SB-2 booms.
  - Dimensions: 11 7/8" H x 3" W.
  - Mounting Method: Mounts to desk or table top with three supplied screws.
  - Stem Size Compatibility: Accepts a 1/2" boom stem.
