description: Rackmount power conditioner/surge protector
details: |-
  The PG-X Type F is the European Schuko market variant of the PG-X, built for budget-conscious professionals who need best-in-class power conditioning without premium pricing. It features eight switched, filtered, and surge-protected outlets on the back panel, plus one switched convenience outlet and a USB Type A charging port on the front.

  PG-90 Filtering Technology delivers an average of 90% noise filtering — significantly ahead of the typical 76% average found in competing units at the same price point — protecting your gear from power surges and high-frequency noise.
specs: |-
  - PG-90 Filtering Technology — 90% average noise filtering
  - 8 rear switched, filtered, surge-protected outlets
  - 1 front switched convenience outlet
  - USB charging port (front panel)
  - Plug type: Type F (Schuko)
  - Form factor: 1U rackmount
