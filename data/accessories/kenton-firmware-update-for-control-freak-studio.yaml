description: A replacement EPROM chip carrying the latest firmware for the
  Control Freak Studio Edition. The unit cannot be re-flashed, so the chip has
  to be swapped to upgrade it.
details: |-
  A firmware upgrade for the Control Freak Studio Edition, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip.

  The installed firmware revision is briefly displayed whenever the unit is powered on. Holding the shift button while powering up keeps the revision number on the display until the button is released, after which the unit enters analyser mode.

  The firmware history runs from KC164501.250 in June 1999 to KC164501.440 in October 2014. Additions over that span include controller 65 to 119-000 in the factory set with a settling time after program change, VST, Pro Tools and Sonar 2 profiles, soft thru on-off select, a control channel for remote control of programs and button presses, scene memory, erase program and delete to end of line, improved handling of large SysEx dumps so units can be chained, fixes for MTC merging and dump requests, an option to turn off data limiting in the sliders for smooth output, commands to increment and decrement the real-time bytes, and controller hi/lo.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: KC164501.440, dated 24/10/2014
  - Firmware revision is shown briefly at power on, held by keeping shift pressed
