description: Illustrated book that teaches drum sequencer design.
details: |-
  This illustrated guide walks a reader through designing a shift register based drum sequencer circuit from scratch, starting with a simple single button tap looper and building up to a fully featured rhythm composer.

  Each chapter introduces a new functional block, moving from a clear button and a metronome LED through to accent and pitch CV outputs. Every step includes detailed schematics and a breadboard layout, so each addition can be tested as it is added and the circuit can be watched as it evolves.

  The book is based on the original manual for the Erica Synths EDU DIY Drum Sequencer kit and takes it further with hands-on design challenges that encourage experimentation, patch examples, a structured troubleshooting guide, notes on production-ready module design, and post-assembly modifications. It is a tool for understanding, refining and extending the circuit rather than only building it.

  Patch examples cover beat programming, LFO based accents and melodic sequences, and three simple post-assembly modifications tailor the tempo range, the accent feel and sequence to melody conversion.

  The guide can be followed on LABOR, the Erica Synths circuit prototyping board, or on a standard breadboard with a dual power supply or two 9V batteries. Components can be bought as part of the EDU DIY Drum Sequencer kit or sourced individually. The printed breadboard layouts are drawn for LABOR, so a standard breadboard calls for adapting the layouts and using breadboard-friendly pushbuttons and switches.
specs: |-
  - Circuit design walkthrough with schematics, breadboard layouts and browser-based circuit simulations
  - Design challenges for experimenting with component values
  - Notes on turning the breadboarded circuit into a production-ready module
  - Detailed assembly guide for the EDU DIY Drum Sequencer module
  - Step-by-step troubleshooting guide using on-board test points
  - Patch examples for beat programming, LFO-based accents and melodic sequences
  - Three post-assembly modifications for tempo range, accent feel and sequence-to-melody conversion
  - Requires LABOR or a standard breadboard with a dual power supply or two 9V batteries
