description: A set of five stackable Eurorack patch cables with a shorter
  connector design for more stable patching. One end has a male and female jack
  while the other end has just a male connector.
details: |-
  Save space in your rack with stackable cables. These are our newer shorter stackable Eurorack Patch Cables. See the comparison photo with our old red cables. Patching is more stable and makes it easier to get a lid on that performance case. One end of the cable has a male and female jack, the other end as just a male connector. They come in sets of 5 cables. Available in 6in (15cm), 12in (30cm), 18in (45cm), and 24in (60cm).
