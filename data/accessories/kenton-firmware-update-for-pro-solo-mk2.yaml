description: A replacement EPROM chip carrying the latest firmware for the Pro
  Solo mkII MIDI to CV converter. The unit cannot be re-flashed, so the chip has
  to be swapped to upgrade it.
details: |-
  A firmware upgrade for the Pro Solo mkII, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip. A mk1 unit cannot be upgraded to a mk2, and the mkII was itself replaced by the mk3 in November 2018 without an upgrade path between them.

  To read the installed revision, both the Inc and Dec buttons are held while the unit is turned on. The display then cycles through two groups of two numbers followed by two dashes, so K1CV5146 reads as 51 46 and then a pair of dashes.

  The firmware history runs from K1CV5130, the first issued version in March 2005, to K1CV5149 in September 2017. Additions and fixes over that span include a 1.2V per octave mode with SysEx control of it, fixes to the MIDI analyser and to portamento, control of auxiliaries 2 and 3 by aftertouch, velocity and pitchbend, a fix in the System Common handler where MIDI time code could interfere with MIDI notes, a changed default of continue equals start to on, a fix allowing both of auxiliaries 2 and 3 to be assigned to the same aftertouch, velocity or pitchbend source, and a fix for setting the LFO to CV minimum and maximum.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: K1CV5149, dated 29/09/2017
  - First issued version: K1CV5130, dated 22/03/2005
  - Firmware revision reported by holding Inc and Dec at power on, as two groups of two digits then two dashes
  - A mk1 unit cannot be upgraded to a mk2, and a mkII cannot be upgraded to a mk3
