description: Studio-grade power conditioner and surge protector
details: |-
  The PG-1 mkII is a rackmount power conditioner and surge protector designed for professional studio environments. It provides clean, stable power to all connected audio equipment through eight rear switched outlets organized into four groups: Digital Audio (x2), Analog Audio, and High Current.

  At the heart of the PG-1 mkII is Black Lion Audio's PG-99 Filtering Technology, which achieves 99.7% noise filtering using premium Panasonic and Wima capacitors. This ensures that sensitive audio equipment receives the cleanest possible power, free from AC noise that can degrade audio signal quality.

  Protection features include 2775 joules of power absorption for surge protection, time-delayed High Current outlets to prevent inrush current issues on startup, and an audio alarm that alerts users to unsafe voltage conditions. Status LED indicators and a voltage meter provide continuous monitoring of grounding, polarity, noise filtering, and surge protection.

  Two front-panel unswitched convenience outlets provide easy access for temporary connections, and a front USB charging port allows charging of mobile devices. An XLR lamp connection on the front panel offers practical studio lighting support.
specs: |-
  - PG-99 Filtering Technology — 99.7% noise filtering
  - Premium Panasonic and Wima capacitors
  - 8 rear switched, filtered, surge-protected outlets (4 groups: Digital Audio x2, Analog Audio, High Current)
  - 2 front unswitched filtered convenience outlets
  - 1 front USB charging port
  - 1 front XLR lamp connection
  - Time-delayed High Current outlets
  - 2775 joules power absorption (surge protection)
  - Audio alarm for unsafe voltage conditions
  - Voltage meter with LED status indicators
  - Output current: 15A
  - Power: 90-130V AC, fixed AC cable
  - Form factor: 1U rackmount
  - Dimensions: 19" W x 1.7" H x 9.8" D
  - Weight: 10.6 lbs
