details: |-
  The Darkglass Bag is a specialized carrying solution designed for the Microtubes 900 amplifier head. This compact, light, and comfortable bag combines portability with practical functionality, and its sleek design is not only beautiful but also functional, with pockets that let you keep cables, the amp footswitch, and even a pack of strings all in one accessory.

  Made from water-resistant nylon, it uses internal pads to protect the Microtubes 900. A large exterior pocket holds strings, cables, and accessories, while a small exterior pocket is sized for the Intelligent Footswitch. Adjustable backpack straps and a heavy-duty carry handle make it easy to transport a rig to rehearsals, gigs, or the studio.
specs: |-
  - Nylon, water resistant
  - Big exterior pocket perfect for strings, cables, etc.
  - Small exterior pocket perfect for your Intelligent Footswitch
  - Internal pads to protect your Microtubes 900
  - Adjustable backpack straps
  - Heavy-duty carry handle
