description: Using the Switcher Interface it is possible to remotely toggle the
  active Channel, Bypass state, Mid Engage, and Blend Override functions of the
  RevivalDRIVE, allowing instant recall of presets with different combinations
  of Channels, Mid Boosts, Blended Overdrive, or bypass.
details: |-
  The Switcher Interface allows the four functions to be remotely switched via the single TRS footswitch connection on the RevivalDRIVE. The unit works by converting the four latching control switches from a remote switcher, such as GigRig G2 or Boss ES-8, to the proprietary control signals used by the RevivalDRIVE.
