details: |-
  Canvas Power Supplies bring simplicity and modularity to powering your pedalboard. Delivering up to 500mA of silent, isolated, and clean 9V power to each output, these power supplies are perfect for the modern pedalboard. The Canvas Power series is built using modern switch mode supply architectures. This means each output is isolated, highly efficient, and heavily filtered ensuring they supply plenty of power with incredibly low noise. Each model is available for purchase as a standalone power supply or as a linkable unit to another supply via 24v power link, allowing Canvas Power to grow with your power needs without adding another cable you need to plug into the wall. Note: to purchase a Canvas Power 5 Link, select the Link option under Power Supply Type AND 24v Link Cable option under the Power Source option before adding to your cart. The super slim design allows Canvas Power Supplies to fit under nearly any pedalboard, and the included universal mounting brackets mean you don’t have to worry about your power supply staying put when you’re hustling to your next gig. The onboard LED power meter lets you clearly see how much power consumption is remaining, and each output has its own LED indicator letting you know when it’s sending power. We’ve also developed custom 2.1mm barrel cables with a 90-degree plug on one end, and our all-new super short straight plug on the other, giving you the maximum flexibility for fitting these power supplies into tight spaces. Of course, they all accept standard 2.1mm barrel cables as well, but they won’t be nearly as cool. Canvas Power 5 Details The Canvas Power 5 has 5 isolated power outputs delivering up to 500mA of clean power at 9v. One of the outlets is variable voltage, letting you switch between 9v, 12v, and 18v for powering high-voltage pedals. What’s in the Box? If you purchase Canvas Power 5 Power Supply: - 1 x Canvas Power Supply - 18” Straight to right angle DC Cable – Qty. 5 - 48W, 24V DC 2A power brick and country specific IEC cable - C style mounting bracket set - M3 Hex Key If you purchase Canvas Power 5 Link: - 1 x Canvas Power Supply - 18” Straight to right angle DC Cable – Qty. 5 - 12” EIAJ Link cable - C style mounting bracket set - M3 Hex Key
