details: |-
  Harmony Fretboard Conditioner is specially formulated to remove dirt and grease quickly and effectively. It cleans, conditions and restores moisture to fretboards, leaving them smooth to the touch. Use it once every three months or as necessary. Made in USA. Remove all strings. Apply a small amount of product onto a clean microfiber cloth and gently wipe the fretboard in a circular motion.
