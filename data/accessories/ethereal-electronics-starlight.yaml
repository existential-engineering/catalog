description: Starlight is a Eurorack blank panel with a slowly pulsing night-sky
  LED display that fills unused HP space in a modular case.
details: |-
  Blanks don't have to be filled with plain aluminium panels. Starlight turns unused space into a calm night sky. The stars gently pulse, adding a calm, cosmic presence to your modular. Perfect for long sessions after midnight. Use it to fill unused HP, to break up large sections of modules, or simply to give your case a moment of darkness and light between instruments.
