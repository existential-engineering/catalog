details: |-
  Now we've gone and done it. Dean Markley's cutting edge Blackhawk Coated Acoustic strings deliver gorgeous, sparkling tone with a warm, rich sound that simply soars. Constructed with a high-carbon nickel-plated steel wire core, they are covered with an advanced, micro-thin coating that keeps them in tune and singing for up to four times longer than uncoated strings. Built to keep you playing non-stop, they're break-resistant, too. Want the most transparent, inspiring playing experience every time? Blackhawk Coated Acoustic strings will take you there.
