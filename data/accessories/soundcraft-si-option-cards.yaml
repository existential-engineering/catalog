description: Flexible and rich in expansion
details: |-
  By adding option cards to the Si range of digital consoles, you can interface your desk with a multitude of analogue and digital systems, whilst expanding I/O count beyond that of the standard console configuration. Routing to and from the option cards is achieved via the 'Patching' functionality on the console. Further cards are always in development and will provide various solutions for interfacing onto emerging networks or devices. The number of option cards that may be fitted varies by product model, as follows:

  USB Interface Compatibility: PC: Supports Windows 7, Windows 8 and Windows 10. Mac: Supports Mac OS 10.7.x Lion through 10.11.x El Capitan
