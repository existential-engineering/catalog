description: DIN 5 to TRS MIDI adapter cables for connecting standard MIDI
  devices to stereo mini-jack ports found on Eurorack modules. Available in male
  (150 cm) and female (20 cm) variants, each sold in packs of three cables — one
  Type A (red) and one Type B (grey) included — covering the two common TRS MIDI
  wiring standards.
details: |-
  Comes in two configurations: DIN 5/TRS Male (150 cm, 3.5mm stereo jack to 5-pin DIN male connector, 3-cable pack) and DIN 5/TRS Female (20 cm, 3.5mm stereo jack to 5-pin DIN female connector, 3-cable pack). Each pack contains both Type A and Type B wiring.

  Type A (red) is compatible with Akai, Korg, Make Noise, ADDAC, Critter & Guitari, Dreadbox, Intellijel, Teenage Engineering, and Twisted Electrons. Type B (grey) is compatible with 1010Music, Arturia, Elektron, Erica Synths, Faderfox, Malekko, Novation, Polyend, and others.
