description: Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content. The M- Style pickups re-create the classic Stingray tone while adding the characteristics that Aguilar pickups are known for – excellent string-to-string balance and consistency of tone.
details: |-
  Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content. The M- Style pickups re-create the classic Stingray tone while adding the characteristics that Aguilar pickups are known for – excellent string-to-string balance and consistency of tone. Wired in parallel, these pickups give players crisp treble, articulate midrange and thunderous lows. The AG 5M is for basses using 18 to 19mm string spacing. Musicman style basses from Lakland and many others use this spacing. Please refer to the AG 5M dimensions for pickup size specifications. The AG 5M will not retrofit into Ernie Ball Musicman five string basses.
specs: |-
  - Wire: 42-gauge Formvar wire
  - Magnets: Alnico V
  - Leads: Single conductor, heat resistant Teflon coated
