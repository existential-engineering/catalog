id: D-ZK67r7xtrGaaFJVCvlC
name: DPS-2
manufacturer: rme
primaryCategory: power-conditioner
url: https://rme-audio.de/dps-2.html
description: Linear Super Low Noise Dual Audio Power Supply with µFilter and
  Sensor Technology. Compact half-rack linear power supply featuring two
  separately filtered DC outputs (Linear and µFilter), Sensor technology that
  measures voltage at the DC connector, a 30,000 µF capacitor bank with ferrite
  choke, HF and DC filters on the AC mains side, GND lift switch, multicolor
  status LEDs with AutoDark mode, and a 60 VA audio toroidal transformer with
  isolation winding.
details: |-
  features:
  - Two separately filtered outputs (Linear and µFilter)
  - Sensor technology measuring voltage at the DC connector
  - 30,000 µF capacitor bank with ferrite choke
  - HF and DC filters on AC mains side
  - GND lift switch for ground loop elimination
  - Multicolor status LEDs with AutoDark mode
  - 60 VA audio toroidal transformer with isolation winding
  - User-selectable 115V or 230V AC mains operation

  includedInBox:
  - DPS-2 unit
  - Two DC Sensor cables (1m each, lockable and standard, 2.1×5.5mm plugs)
  - Manual
  - IEC power cable (1.5m)
specs: |-
  - AC mains: 115V or 230V (user-selectable)
  - AC mains input range: 95–130V or 200–260V
  - Power consumption (idle): 1.6W
  - Fuses: 230V (2×250V/0.63A) or 115V (2×250V/1.2A)
  - DC Linear output: max 12.2V @ 0A, min 11.5V @ 3A
  - DC Linear continuous current: 2.5A (30W)
  - DC Linear noise @ 1A: 30µV (AES17), 3µV A-weighted
  - DC Linear output impedance: 0.22Ω
  - DC Linear load regulation: 3.63%
  - DC µFilter output: 12.0V fixed
  - DC µFilter continuous current: 2.5A (30W)
  - DC µFilter noise @ 0–3A: <2µV (AES17), <1µV A-weighted
  - DC µFilter output impedance: 0.012Ω
  - DC µFilter load regulation: 0.20%
  - Dimensions: 130 × 44 × 205 mm (5.1" × 1.7" × 8.1")
  - Weight: 1.89 kg (4.17 lbs)
  - Operating temperature: +5°C to +40°C
versions:
