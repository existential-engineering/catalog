description: 3.5mm mono jack to Cinch Jones 2 pin plug lead in a choice of
  lengths, for connecting Kenton MIDI to CV converters to vintage Moog
  synthesisers.
details: |-
  A lead with a 3.5mm mono jack plug at one end and a two pin Cinch Jones plug at the other, offered in a choice of lengths.

  The Cinch Jones connector is the S-trigger arrangement used on vintage Moog instruments, so the lead carries the trigger signal from a Kenton MIDI to CV converter to a Moog's S-trig input.
specs: |-
  - Connector A: 3.5mm mono jack plug
  - Connector B: 2 pin Cinch Jones plug
  - For vintage Moog synthesisers
  - Sold in a choice of lengths
