description: Rack-mounting solutions that join two half-width 1U Benchmark
  components or mount a single unit alongside a blank plate in a standard
  19-inch rack. Available as a coupler kit or as a premium blank plate in silver
  or black.
details: |-
  The Benchmark Rack Mount Coupler Block is precision machined from solid aluminum with a black anodized finish. It rigidly joins two half-width (1/2-wide), 1U Benchmark components to fill a standard 19-inch rack space, and includes 8 rack-mount screws (10-32 x 3/4 inch). Made in the USA.

  The Premium Blank Plate option is machined from 1/4-inch thick aluminum and features an engraved Benchmark logo. Available in silver or black anodized finish, it fills the unused half of a 1U rack space when only one half-width unit is installed.

  Compatible with the following Benchmark products (requiring rack ears): DAC1, DAC1 USB, MPA1, ADC1, ADC1 USB, DAC2 DX, DAC3 DX, and DAC3 B.
specs: |-
  - Form factor: 1U, joins two 1/2-width products
  - Coupler block material: solid aluminum, precision machined
  - Coupler block finish: black anodized
  - Includes: 8 x rack-mount screws (10-32 x 3/4 inch)
  - Blank plate thickness: 1/4-inch aluminum
  - Blank plate finishes: silver anodized, black anodized
  - Blank plate: engraved Benchmark logo
  - Compatible products (with rack ears): DAC1, DAC1 USB, MPA1, ADC1, ADC1 USB, DAC2 DX, DAC3 DX, DAC3 B
  - Made in USA
