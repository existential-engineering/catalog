details: |-
  Hosa Microphone Cables are designed to provide years of dependable service. High-quality components and world-class manufacturing combine to deliver products of exceptional value.

  The MCL-100 is a two-conductor balanced microphone cable with Hosa connectors, offered with XLR3F to XLR3M or XLR3F to TS terminations in lengths from 3 ft to 100 ft.
specs: |-
  - Connectors: Hosa XLR3F to XLR3M or XLR3F to TS
  - Conductors: 22 AWG x 2 OFC
  - Shield: 88% OFC Braid
  - XLR connectors with internal strain relief for rugged reliability
  - Oxygen-Free Copper (OFC) conductors for enhanced signal clarity
  - Hi-density OFC braided shield for superior EMI and RFI rejection
  - Available lengths: 3 ft, 5 ft, 10 ft, 15 ft, 20 ft, 25 ft, 30 ft, 50 ft, 100 ft
