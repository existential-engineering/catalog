description: Audeze’s custom-built travel case is the perfect way to protect
  your headphone investment, even if you drop it, spill liquids on it, bring it
  to a Head-Fi meet or the recording studio. As long as your headphones are in
  this case (and it’s closed), it’ll keep them safe.
details: |-
  The ultimate case! Audeze’s LCD-5 custom-built premium aluminum case features a weatherproof and durable design. This case fits many other headphones, including our other LCD-series headphones. With the Maxwell, it’s a little tight, but it does fit. We have tested the fit with the Sennheiser HD600 series, HIFIMAN HE-6 SE, and Dan Clark Audio Ether C. Other comparably sized models from those brands should fit as well.
specs: |-
  - All aluminum construction with easy open dual latches
  - Foam cutouts offer great shock absorption and protection during travel, and can be cut to fit.
  - Outer Dimensions: 14.2in x 10.in x 7.in
  - Internal Dimensions: 13.25in x 10in x 4in (to bottom of pre-cut foam)
  - Weight: 3.94 lbs
  - Depending on the headphone model, minor deformation of the inner foam may occur.
