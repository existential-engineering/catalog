name: "Voodoo Lab Power Supply Mounting Kit for Novo, Classic, XD and Terra
  Series (PT-VDL-MK)"
manufacturer: pedaltrain
primaryCategory: other
url: https://pedaltrain.com/products/pt-vdl-mk
description: "Mounting kit for attaching a Voodoo Lab power supply underneath a
  Pedaltrain Novo, Classic, XD, or Terra series board."
details: |-
  About Voodoo Lab Mounting Brackets Model: PT-VDL-MK PT-VDL-MK can also be substituted for the BRKT-2, and will be able to mount onto any boards that originally shipped with BRKT-2 (PT-3, PT-Pro) Note: This bracket is not compatible with vintage Pedaltrain Jr/1/2 models (those with "port holes"). These Pedaltrain models shipped with the correct bracket in the kit, called the BRKT-1. We carried extra BRKT-1 for a number of years, but it is now sold out and discontinued. Written Instructions Video Instructions: Please be advised that our black PT-PRO models with the silver badge on the front are not compatible with any brackets. They were designed before power supplies were mounted underneath the board, and before we invented the bracket mounting system. The silver version of PT-PRO is compatible with all Pedaltrain brackets. Need help deciding which Mounting Bracket you need? Check out this article from our Help Center: Which Bracket is Right for Me?
specs: |-
  - Mounts the following Voodoo Lab Power Supplies underneath the Classic, Novo, XD and Terra series boards:
  - Pedal Power 3
  - Pedal Power 3 PLUS
  - Pedal Power ISO-5
  - Pedal Power 2
  - Pedal Power 2 PLUS
  - Pedal Power 4x4
  - Pedal Power MONDO
  - PT-VDL-MK can also be substituted for the BRKT-2, and will be able to mount onto any boards that originally shipped with BRKT-2 (PT-3, PT-Pro)
