description: Kit to add CV / Gate / Filter sockets to the SX-1000, available
  with either Hz/Volt or Volt per Octave CV input, so the synth can be played
  from a MIDI keyboard or sequencer through a MIDI to CV converter.
details: |-
  A three-socket upgrade kit for the SX-1000, adding CV, Gate and Filter control voltage inputs to the synthesiser. It is sold in two versions that differ only in the scaling of the CV input: Hz/Volt, which suits all current Kenton converters and costs a little less, and Volt per Octave. A Pro-4, a Pro-2 or a converter from another maker needs checking for Hz/V output scaling before the Hz/V kit is chosen.

  Used with a MIDI to CV converter such as the Pro-Solo mk3, USB-Solo or Pro-2000 mkII, the added sockets let the synth be played from a MIDI keyboard or MIDI sequencer. The inputs are 3.5mm mono jacks: CV controls oscillator frequency, Gate decides when notes play, and Filter takes the converter's aux output to drive low pass filter cutoff.

  With a Pro-Solo mk3 or Pro-2000 mkII the available control covers notes over at least five octaves (bounded by the synth rather than the kit), pitchbend with a range set in the converter, modulation from the converter's own LFO with speed and waveshape changeable in real time, portamento with a rate changeable in real time, and filter cutoff from any continuous controller message, aftertouch or velocity. Note priority and single or multiple trigger modes are set in the converter.

  The kit contains a circuit board along with the components and diagrams for wiring them and mounting the three 3.5mm mono jack sockets and the switch. Each kit is built to order. Installation is a skilled job for a synth service engineer, or the kit can be fitted at Kenton's premises.
specs: |-
  - Adds three 3.5mm mono jack input sockets: CV, Gate and Filter
  - Two versions: Hz/Volt CV input, or Volt per Octave CV input
  - Hz/V version suits all current Kenton converters and costs less than the V/Oct version
  - Gate input controls when notes play (0 volts = note off, greater than 3 volts = note on)
  - Filter input controls low pass filter cutoff, driven from the aux output of a converter
  - Note range at least 5 octaves, limited by the synthesiser rather than the kit
  - Kit includes a circuit board, all necessary components, a switch and wiring diagrams
  - No power connection of its own: the added sockets are wired into the host synthesiser
