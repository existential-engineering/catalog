details: |-
  The FS-805 D4 is a premium loudspeaker stand from Bowers & Wilkins, designed specifically to pair with the 805 D4 standmount speakers from the 800 Series Diamond range. As a dedicated stand, it positions the speakers at the optimal listening height while providing a stable, resonance-controlling platform.

  Sold as a pair, the stands are offered in two finishes — Silver and Black — to complement the 805 D4 cabinet colorways. The matched aesthetic and engineering ensure the speakers integrate visually and acoustically into a high-end listening environment.

  Bowers & Wilkins provides assembly instructions as a downloadable PDF, reflecting the stand's modular construction. The product is positioned within the brand's accessories lineup, alongside companion stands such as the FS-HTM D4 and FS-700 S3 for other speakers in the range.
