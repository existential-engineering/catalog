details: |-
  FS-805 D4 is a dedicated floor stand for the Bowers & Wilkins 805 D4 stand-mount loudspeaker. Bowers & Wilkins presents it as the way to achieve the best possible performance from a pair of 805 D4s, and describes it as a premium 805 D4 loudspeaker stand.

  The stand is offered in two finishes, Silver and Black, so it can be matched to the 805 D4 it carries. It is sold and priced as a pair, and Bowers & Wilkins publishes a downloadable assembly instructions document for it.
