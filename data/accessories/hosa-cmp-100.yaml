description: Mono interconnects perfect for connecting a mixing console to
  portable media devices.
details: >-
  This cable is designed to apply a mono signal equally to a mini stereo phone
  input. It may be used to connect a mixing console to a portable media player,
  laptop, or similar device.


  The Mono Interconnect terminates in a 1/4 in TS plug on one end and a 3.5 mm
  TRS plug on the other, and is offered in 3 ft, 5 ft and 10 ft lengths. It is
  listed under Hosa's Specialty Interconnects category and carries the Essential
  Hosa tag.
specs: |-
  - Connectors: 1/4 in TS to 3.5 mm TRS
  - Nickel-plated plugs for rugged durability and efficient signal transfer
  - Oxygen-Free Copper (OFC) conductors for enhanced signal clarity
  - OFC spiral shield for effective EMI and RFI rejection and flexibility
  - Available lengths: 3 ft, 5 ft, 10 ft
