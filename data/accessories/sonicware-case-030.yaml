details: |-
  A perfect fit for the CyDrums, Lofi-12 XT, and SmplTrek, this rigid molded case provides excellent protection with a 1680D nylon exterior. A separate compartment (including a movable divider) holds accessories such as the PSU and cables, and the case is compact and lightweight.

  Exterior dimensions: W 11.02 inches (28 cm) x D 8.27 inches (21 cm) x H 2.36 inches (6 cm). Weight: 0.73lbs (330g).

  This product is a case only. The SmplTrek unit, PSU, and earphones in the photo are not included.
