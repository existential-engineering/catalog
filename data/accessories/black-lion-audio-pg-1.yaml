description: Studio-grade power conditioner and surge protector
details: |-
  The PG-1 is a rackmount power conditioner built to deliver clean, stable power to studio equipment while protecting against surges and high-frequency noise. Black Lion Audio's proprietary PG-99 filtering technology uses premium Panasonic and Wima capacitors to achieve an average of 99.7% noise filtering, far exceeding the 85% typical of competing units. Eight switched rear outlets are organized into four isolated groups (two Digital Audio, one Analog Audio, one High Current), while two unswitched filtered convenience outlets and an XLR lamp connector sit on the front panel. Time-delayed High Current outlets prevent speaker pop on power-up. A front-panel LED voltage meter and status indicators monitor grounding, polarity, noise filtering, and surge protection, with an audio alarm for unsafe voltage conditions.
specs: |-
  - Type: Rackmount
  - Front Outlets: 2 (unswitched, filtered)
  - Rear Outlets: 8 (switched, filtered)
  - Output Current: 15A
  - Surge Protection: 2775 joules
  - Power Input: Fixed AC cable, 90-130V AC
  - Display: LED voltage meter with status indicators
  - Sequencer: Yes
  - Filter Groups: Digital Audio x2, Analog Audio, High Current
  - Height: 1.7"
  - Width: 19"
  - Depth: 9.8"
  - Weight: 10.6 lbs
