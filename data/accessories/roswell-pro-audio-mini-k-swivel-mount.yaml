details: |-
  We designed this heavy-duty swivel mount to fit our Mini K series microphones. It provides a secure, stable mount with the minimum possible footprint -- meaning, it won't get in the way of adjacent microphones, stands, or instruments the way a shockmount might. Compatibility

  This swivel mount fits the Mini K47, Mini K47x, Mini K67x, Mini K87, KD, and Cab Mic. This mount is not compatible with the original Delphos, Delphos II, Colares, or Aztec.
