details: |-
  The ATS1, ATS1LX, and ATS1LP are the industry's only programmable, shock-absorbent table stands with LED indicators that do not require external power supplies, eliminating the added expense and complication associated with installation and wiring. The LED indicator and audio switching circuitry operate on the same phantom power source supplied to the microphone. The result is a simplified installation and reliable operation. The base has programmable functions that are changed with a simple, intuitive dip switch which can be set to operate in Toggle On, Toggle Off, Momentary Talk, and Momentary Mute modes. Also supplied within the base is a Low Cut Filter offering additional protection from bass frequencies that may cause rumble or hum. The ATS1LX and ATS1LP can be further programmed to operate seamlessly with automated teleconferencing and switch systems in external logic control mode.

  The ATS is manufactured with a precision die-cast zinc alloy base, durable black E-coat finish, LED indicators, and a noise-free mechanical switch.

  Designed, assembled, and tested by AUDIX in the USA.
specs: |-
  - Shock-absorbent gooseneck table stand (ATS family)
  - LED indicator and switching operate on the microphone's phantom power (no external supply)
  - Die-cast zinc alloy base, black E-coat finish
