description: Headshell for the PLX-1000, PLX-500 and other analogue turntables
details: |-
  Designed for the PLX-1000 and PLX-500 , the PC-HS01 headshell comes in black, silver and gold so you can choose the colour that complements your set-up best. Or use the colours to differentiate between your weight, cartridge and stylus preferences; for example, black for scratching, silver for recording, and gold for listening. The PC-HS01 comes with a 4 gram shell weight, but the headshell also allows you to attach different weights (cartridge and stylus are not included).
