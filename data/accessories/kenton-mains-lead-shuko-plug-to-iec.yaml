description: European schuko plug to IEC socket - moulded plugs - 1.8 metres
details: |-
  A mains power lead terminated with a European Schuko plug at one end and an IEC socket at the other, for powering equipment fitted with an IEC mains inlet from a continental European wall outlet.

  Both ends use moulded plugs rather than rewireable shells, so the lead is supplied ready to use and cannot be re-terminated.

  The lead is 1.8 metres long. It is listed under the Power Leads section of the Leads range.
