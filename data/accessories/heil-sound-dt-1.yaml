details: |-
  Overview & Features

  The Heil DT-1 is a low-profile mount that installs directly through a desktop or tabletop surface, offering a sleek, flush-mounted anchoring point for Heil microphone boom arms. Perfect for clean, professional broadcast desks, podcast studios, and commercial installations, the DT-1 eliminates bulky clamps while providing rock-solid stability.

  Key Features
specs: |-
  - Flush-Mount Design: Mounts through a hole in the desk or table to create a permanent, low-profile anchor for your microphone boom arm.
  - Silent Swivel Movement: Fitted with a precision brass insert that ensures a smooth, secure fit and noiseless 360-degree rotation during live recording or broadcasting.
  - Heavy-Duty Construction: Accommodates desktops up to 2 inches thick, securing from underneath with a large threaded washer and locking ring.
  - Compatible booms: Heil PL2T and SB-2.
  - Dimensions: 3″ H x 2″ W.
  - Mounting requirement: requires a 1.5″ drilled hole.
  - Surface thickness compatibility: mounts to surfaces 1/2″ to 2″ thick.
  - Stem acceptance: accepts 1/2″ boom stem.
