description: Portable Studio-Grade Power Conditioner & Surge Protector
details: |-
  There's no doubt that when it comes to power, musicians have it bad. Whether it's modern modeling amplifiers, or vintage synthesizers, bad power is gonna be heard throughout your signal. And it's everywhere — in homes, on stages, and especially in many rehearsal rooms. Black Lion Audio has been trusted for years for modifying the best gear and making it even better, and that's what it took to create the PG-P: taking industry-standard designs, and improving them to the point of peak performance.

  After creating an entire lineup of industry-best power conditioners, Black Lion Audio felt it was time to give the world proper portable power. The PG-P might look like a run-of-the-mill surge protector, but in reality it's a studio-class power conditioner — PG-P doesn't just provide more noise filtering than other portable conditioners, it provides the same noise filtering found in the majority of the world's rack-mount power conditioners.

  The PG-P is built using premium Panasonic capacitors, due to their superior execution in eliminating high frequency noise that robs equipment of its peak performance. In testing, this has provided an average of 3x the noise filtering of other portable power conditioners at the same price point. Six wall-wart spaced outlets provide studio-grade power on the go; perfect for any musician's rig.
specs: |-
  - PG-P Filtering Technology with premium Panasonic capacitors
  - 3x the noise filtering of other portable power conditioners at the same price point
  - Six wall-wart spaced outlets
  - Surge protection
  - Voltage: 120V 60Hz
