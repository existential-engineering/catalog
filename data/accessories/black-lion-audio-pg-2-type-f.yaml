description: Rackmount (3U) 12-output power conditioner featuring PG-99
  Filtering Technology with premium Panasonic and Wima capacitors, designed for
  the European/Type F (Schuko) market.
details: |-
  The PG-2 Type F features twelve switched, filtered, and surge-protected outlets on the back panel, combined into four groups: Digital Audio (x2), Analog Audio, and High Current. Time-delayed High Current outlets ensure speakers and power amplifiers power on last and off first, preventing audio pop. Also features two filtered convenience outlets and a USB charger on the front panel, plus XLR lamp connectors on both front and back panels.

  Built using premium Panasonic and Wima capacitors via PG-99 Filtering Technology, it delivers an average of 99.7% noise filtering — compared to the typical 85% at the same price point. A voltage meter and amperage meter enable real-time power analysis; LED status indicators cover grounding, polarity, noise filtering, abnormal voltage, and surge protection; an audio alarm activates on unsafe voltage conditions.
specs: |-
  - PG-99 Filtering Technology — 99.7% average noise filtering
  - Premium Panasonic and Wima capacitors
  - 12 rear switched, filtered, surge-protected outlets (4 groups: Digital Audio x2, Analog Audio, High Current)
  - 2 front filtered convenience outlets
  - Front USB charger
  - XLR lamp connectors on front and back panels
  - Time-delayed High Current outlets
  - 2775 joules power absorption (surge protection)
  - Voltage meter and amperage meter
  - LED status indicators: grounding, polarity, noise filtering, abnormal voltage, surge protection
  - Audio alarm for unsafe voltage conditions
  - Plug type: Type F (Schuko)
  - Form factor: 3U rackmount
