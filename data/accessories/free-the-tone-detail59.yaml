description: MIDI cable terminated with an L-shape 3.5 mm stereo miniature plug
  at one end and a 360-degree accessible DIN plug at the other. Two-core
  shielded wire protects the MIDI signal from external noise.
details: |-
  The CM-3510-TRS is a variation on Free The Tone's CM-3510 MIDI cable, adding an L-shape 3.5 mm stereo miniature plug to the family. The CM-3510's own feature, a Free-Angle Cap structure that allows 360-degree access at the DIN end, carries over unchanged.

  A growing number of devices use stereo miniature plugs as their MIDI input and output terminals, and this cable exists to reach them: one end is the L-shape 3.5 mm stereo miniature plug, the other the 360-degree accessible DIN plug. As with the CM-3510, a two-core shielded wire is used to protect the MIDI signal from extraneous noise and keep transmission stable.

  The Free-Angle Cap is fitted after the cable is connected. The cable goes into the equipment's MIDI terminal first, then it is bent in the direction it needs to run and the cap is replaced. The maker warns that changing the cable direction while the cap is on may disconnect the cable, so the cap should be removed first.

  The original L-plug design is what allows the 360-degree access, and the reduced plug size takes up less pedalboard space than a conventional MIDI plug. The cable is sold in four lengths, 30 cm, 50 cm, 80 cm and 100 cm.
specs: |-
  - One end L-shape 3.5 mm stereo miniature (TRS) plug, other end 360-degree accessible DIN plug
  - Original Free The Tone design L-plug allows 360-degree access
  - Two-core shielded cable blocks external noise and provides a stable MIDI signal
  - Reduced plug size takes up less pedalboard space
  - Available lengths: 30cm, 50cm, 80cm, 100cm
  - Free-Angle Cap must be removed before changing the cable direction, or the cable may become disconnected
