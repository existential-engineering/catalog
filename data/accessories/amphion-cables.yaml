details: |-
  Amphion speaker cables were designed originally for seamless integration between Amphion studio monitors and power amplifiers. They are made using the same cable as found in the internal wiring of Amphion speakers, ensuring consistent signal quality throughout the signal chain.

  The cables are specially braided using four strands of silver-coated copper conductor. This construction is chosen to provide crystal clear transmission with minimal coloration or signal degradation.

  Each cable is terminated with durable Chord™ banana connectors, providing a secure and reliable connection to amplifier and speaker binding posts.

  The cables are sold individually (per piece) and are available in three lengths: 2.5 meters, 3.5 meters, and 5 meters.
specs: |-
  - Conductor: Four strands of silver-coated copper, specially braided
  - Connectors: Chord™ banana connectors
  - Available lengths: 2.5 m, 3.5 m, 5 m
  - Sold per piece
