description: 3.5mm jack to 1/4" (6.35mm) jack mono leads in various lengths,
  ideal for connecting Kenton MIDI to CV converters to a synthesiser's CV
  sockets.
details: |-
  A mono lead with a 3.5mm jack plug at one end and a 1/4" (6.35mm) jack plug at the other, sold in a choice of lengths.

  The pairing matches a Kenton MIDI to CV converter, whose control voltage and gate outputs are on 3.5mm minijacks, to a synthesiser whose CV and trigger sockets are full-size 1/4" jacks.

  Product photographs on the page show the 1.2 metre, 2.5 metre and 5 metre versions.
specs: |-
  - Connector A: 3.5mm mono jack plug
  - Connector B: 1/4" (6.35mm) mono jack plug
  - Available lengths shown include 1.2 metre, 2.5 metre and 5 metre
