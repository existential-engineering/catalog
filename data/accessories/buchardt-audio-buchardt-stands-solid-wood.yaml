description: Solid wood speaker stands with a hollow design for cable management
  and optional weight filling for stability, sold as a pair.
details: |-
  Delivery: Start October

  (price is for a pair)

  While our Tripod stands have been a great success and still are, we have also been getting feedback from our customers, to bring back a bit more conventional design. And with our own solid wood workshop, we now have the option to offer something we think is a very attractive product, to our customers. A beautiful stand, made out of solid wood, right here in Denmark. Let's go over the key features:

  - Made out of solid european oak. - Designed, produced and shipped from Denmark. - Hollow design, with cut-outs for convenient cable management. - Space for adding weight inside the stand for extra stability. - Customizable colors options, mix Black and Oak as you wish. These are the perfect match for our A10 speakers, but they can of course be used with all of our speakers, as well as other brands. *Please note that bags are required for filling the stands with materials like sand. Bags are not provided. It is imperative that the material used to fill the stands is completely dry.
specs: |-
  - Handmade in Denmark
  - Multiple color options
  - 2 x Solid wood Legs
  - 2 x Solid wood top plates
  - 2 x Solid wood bottom plates
  - 8 x M6 soft rubber spikes. (thread is M6 x 17 mm for possible 3. party solution)
  - 8 x rubber pads
  - 16 x assembly bolts
