description: A pull-back bracket for the TRx3900F/TRx3903 column array,
  providing an attachment point to angle and aim the speaker system.
details: |-
  The 3900PB Pull Back Bracket gives the TRx3900F an attachment point at which to "pull back" the TRx3900F column array to aim the speaker system. The 3900PB features two 11.7mm holes to secure the bracket to the column array and one 20.2 mm mounting hole to connect the pullback hardware. Hardware shown in photos may be purchased separately from a hardware supplier. The 3900PB also fits the TRx3903 column array.
