description: An adapter board that lets the DB25MKII output expander be used
  with the original WMD Performance Mixer. It adds 8mm of depth behind the
  panel.
details: |-
  For use with original WMD Performance Mixer, this adapter board can be added onto the DB25MKII . Please note that width behind panel is increased by 8mm when adapter board is added on. This may require some clever position in your case. The original Performance Mixer still only offers Pre Fader Outputs. DB25MKII is not included and must be purchased separately.
