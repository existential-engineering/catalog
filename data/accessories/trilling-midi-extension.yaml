description: A MIDI extension for Passaggio that enables playing it via MIDI
  note input, using a channel selected by DIP switches on the host module.
details: |-
  MIDI extension for Passaggio . Enables playing Passaggio via MIDI, using the channel selected with the DIP switches on the rear of the Passaggio module. The current implementation supports MIDI note input only. Future Passaggio firmware updates may add support for MIDI control messages and MIDI output for daisy-chaining multiple modules.
specs: |-
  - Width 3hp (15mm)
  - Depth 40mm (including connector+cable)
  - 4 pin rear connector to connect to Passaggio (cable included)
  - Standard 3.5mm TRS jacks for MIDI (Type A)
  - Power: draws an additional 5 mA from the +12 V rail of the host module
