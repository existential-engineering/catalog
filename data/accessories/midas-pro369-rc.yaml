description: Touring grade road case for the Midas PRO3, PRO6, PRO9 and PRO X
  Live Digital Console control centres, designed to withstand the rigours of
  live concert tours. Constructed from 12 mm thick rigid marine grade plywood
  with 40 x 40 mm durable aluminium edging extrusions. Dual load-bearing spigots
  couple the weight of the console chassis directly into the road case, and
  composite density foam provides internal support and superior protection in
  transit. Features premium Penn-Elcom castors and RK handles, and ships with a
  removable protective pallet that allows the road case to be stored and shipped
  on its side.
details: |-
  Touring-grade road case accessory designed specifically for the Midas PRO3, PRO6, PRO9, and PRO X Live Digital Console control centres. Passive transport/storage accessory with no audio I/O.
specs: |-
  - 12 mm thick rigid marine grade plywood construction
  - 40 x 40 mm aluminium edging extrusions
  - Dual load-bearing spigots
  - Composite density foam internal support
  - Penn-Elcom castors
  - RK handles
  - Removable protective pallet for side storage/shipping
  - Dimensions: 616 mm length x 1516 mm width x 1395 mm height (24.2" x 59.7" x 54.9")
  - Nominal weight: 130.0 kg (286.0 lbs)
  - Compatible with Midas PRO3, PRO6, PRO9, and PRO X Live Digital Console control centres
