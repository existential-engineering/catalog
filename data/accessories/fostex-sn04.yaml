description: SN04 is a speaker grille designed specifically for use with the
  NF04R active speaker. It protects the speaker unit placed in front. Uses a
  high-precision molded plastic frame with a high-strength steel perforated
  grille, internal cushioning to prevent rattling, and tool-free (screwless)
  attachment and detachment. Suitable for relay sites, halls, and other audio
  equipment applications.
details: |-
  Features:
  - High-precision molded plastic frame and high-strength steel perforated grille
  - Inside of the grille is cushioned in various places to prevent rattling
  - Grille can be attached and detached without the use of screws
  - Can be used for relay sites, halls, and other audio equipment applications

  Dimensions: 126(W) × 195(H) × 27(D) mm

  Weight: Approx. 80 g

  Compatibility: NF04R active speaker
