name: A Series Mounting Plate
manufacturer: adam-audio
primaryCategory: other
url: https://www.adam-audio.com/en/a-series/mounting-plate/
description: The A Series is compatible with a comprehensive range of
  third-party mounting solutions by using the A Series Mounting Plate.
details: |-
  The A Series was designed with mounting in mind. All models in the series (A4V, A44H, A7V, A77H and A8H) feature an underside mounting interface that allows for professional mounting solutions in any environment.

  This mounting interface is compatible with a comprehensive range of third-party mounting solutions by using the A Series Mounting Plate, which forms a secure bridge between speaker and mounting solution.

  The A Series Mounting Plate was designed and made in Germany in conjunction with our colleagues at Koenig & Meyer. It complements Koenig & Meyer's high-quality range of wall, ceiling, and speaker pole mounts, but is also compatible with solutions from other manufacturers.

  Heavy-duty metal plate designed to attach A Series monitors to third-party mounting solutions

  Compatible with A4V, A44H, A7V, A77H and A8H models

  Third-party mounting solutions should be purchased separately from your local dealer

  In every case, the Mounting Plate should be connected to the third-party mounting solution before the speaker is secured.
specs: |-
  - Weight: 0.825 kg (1 lbs 13 oz)
  - Dimensions (Height x Width x Depth): 150 x 150 x 5 mm (5 7/8" x 5 7/8" x 3/16")
  - Max. load: 40 kg (88 lbs 2 oz)
  - Delivery Contents: Mounting plate, screws, washers, spacers, user manual
  - Made in Germany
