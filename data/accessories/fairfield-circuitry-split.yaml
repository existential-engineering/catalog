description: A passive dual TRS-to-TS 1/8" breakout cable adapter that gives
  modular and semi-modular gear access to TRS CV jacks, and allows hijacking the
  expression inputs of pedals with a 5V ring reference.
details: |-
  Split! breaks out two TRS stereo 1/8" jacks into their tip (T1, T2) and ring
  (R1, R2) components as four separate TS 1/8" jacks. This enables connection to
  TRS CV jacks on pedals such as Randy's Revenge, where tip and ring carry separate
  CV signals.

  When used with wiper-to-tip expression inputs, ring carries 5V and tip carries
  CV in. Passive, no power required. Dimensions: 3.6" x 1.5".
specs: |-
  - Passive, no power required
  - 2 x TRS 1/8" jacks (T1+R1, T2+R2)
  - 4 x TS 1/8" jacks (T1, R1, T2, R2)
  - Enclosure dimensions: 3.6" x 1.5"
  - Made in Hull, Québec
