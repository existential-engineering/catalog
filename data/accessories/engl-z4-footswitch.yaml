description: The Z4 is a stainless steel dual footswitch for ENGL amplifiers,
  switching two functions such as channel and reverb, with an LED indicator per
  switch and a fixed 8 metre cable.
details: |-
  The Z-4 is a robust dual footswitch housed in stainless steel, suitable for every ENGL amplifier that offers a dual footswitch jack. It switches two functions, for example channel and reverb.

  The selected channel or feature is shown by an LED on the footswitch, so the active state is visible on stage. Both switches are solid mechanical footswitches.

  The unit comes with an 8 metre ENGL premium cable attached and measures 14 x 14 x 4 cm.
specs: |-
  - Dual footswitch for ENGL amplifiers, switching two functions
  - Stainless steel housing
  - Solid footswitches with LED indicators
  - 8 m ENGL premium cable
  - Dimensions: 14 x 14 x 4 cm
