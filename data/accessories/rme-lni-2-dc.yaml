name: LNI-2 DC
manufacturer: rme
primaryCategory: power-conditioner
url: https://rme-audio.de/lni-2-dc.html
description: "Low Noise Isolating DC Filter, 12 Volt 2 Ampere, DC Input and
  Output. The LNI-2 DC provides isolation, regulation and filtering of output
  signals from any 12 volt DC power source, enabling a remarkable improvement in
  DC voltage stability while providing an ultra-clean 12V power source. The
  LNI-2 DC is based on two key features: galvanic isolation and RME's exclusive
  µFilter. Galvanic isolation is an advanced technique to prevent any noise,
  from hum over high frequency noise to leakage currents from reaching the
  filtered DC output. The µFilter (micron filter) of the LNI-2 DC consists of a
  discrete Ultra Low Noise linear regulator with extremely low noise output of
  only a few µV (micro-volt), soft start, thermal overload, short circuit
  protection and sensor technology. The LNI-2 DC handles power sources from
  9–18V DC (input) and provides a fixed, perfect voltage of 12.0 V at 2 A at the
  lockable output socket."
details: |-
  features:
  - Galvanic isolation prevents hum, high frequency noise and leakage currents from reaching the filtered DC output
  - µFilter (micron filter) with discrete Ultra Low Noise linear regulator
  - Soft start, thermal overload and short circuit protection
  - Sensor technology for voltage measurement at the DC connector
  - Wide input voltage range 9–18V DC
  - Fixed 12.0V / 2A output via lockable DC socket

  includedInBox:
  - LNI-2 DC unit
  - DC Sensor connection cable with lockable DC plug 2.1×5.5 mm, 1 m
  - DC Sensor connection cable with DC plug 2.1×5.5 mm, 1 m
  - Manual
specs: |-
  - DC Input voltage range: 9–18 V DC
  - DC Input polarity: Center +, Outside −
  - DC Input connector: 2.1×5.5 mm, lockable or normal
  - Power consumption idle: 0.7 W
  - Power consumption typical (12V input, 2A load): 31 W
  - DC µFilter output voltage: 12.0 V
  - DC µFilter continuous output current: 2.0 A
  - DC µFilter continuous output power: 24 W
  - DC µFilter maximum output current: 3.0 A
  - DC µFilter noise @ 0–3 A (AES17): <2 µV, <1 µV A-weighted
  - DC µFilter noise @ 0–3 A (100 kHz bandwidth): <3 µV, <2 µV A-weighted
  - DC µFilter output impedance including cable: 0.012 Ω
  - DC µFilter load regulation (0/1/2 A): 0.20%
  - Overload protection: >3.0 A
  - Overheating protection: >80 °C (176 °F)
  - Undervoltage detection: <9.0 V
  - Short circuit current (LED red): <0.1 A
  - Filter (decoupling) efficiency 10 Hz – 1 kHz: >110 dB
  - Filter (decoupling) efficiency 1 kHz – 200 kHz: >70 dB
  - Dimensions (WxHxD): 80 × 30 × 123 mm (3.15" × 1.18" × 4.84")
  - Weight: 605 g (1.33 lbs)
  - Operating temperature: +5 °C to +40 °C (41 °F to 104 °F)
  - Relative humidity: <75%, not condensing
