description: Features a 14″ tractor top with a combination of foam for stability and comfort.
details: |-
  The 9120 has an oversized tractor seat top filled with a special combination of foam for stability and comfort. This throne features DW's newly designed double locking clamp, vise lock seat clamp, and an oversized 1″ base for added stability.

  The Double Locking Clamp ensures your seat height stays consistent, and the Vise Lock Seat Clamp keeps the seat married to its legs. Minimum and maximum height is 20″ to 27″.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
