details: |-
  Overview & Features

  The Heil WM-1 is a specialized mounting accessory designed to secure Heil microphone boom arms directly to vertical surfaces. Ideal for broadcast booths, podcast setups, and recording environments with limited desk space, the WM-1 allows boom arms to be installed in small, tight, or unconventional wall locations.
specs: |-
  - Vertical Surface Mount: Mounts securely to walls or vertical surfaces, freeing up valuable desk and tabletop real estate.
  - Noiseless Rotation: Fitted with a high-quality brass insert that ensures a precise fit and completely quiet swivel movement during live broadcasting or recording.
  - Compact Footprint: Compact dimensions allow mounting in tight or unconventional studio layouts.
  - Compatible Booms: Heil PL2T and SB-2 booms.
  - Dimensions: 3 1/8″ H x 2 9/16″ W.
  - Stem Acceptance: Accepts 1/2″ boom stem.
