details: |-
  6c Stand

  Designed specifically for the Dutch & Dutch 6c, the dedicated 6c Stand provides a stable and acoustically optimized foundation for your loudspeakers. Its height positions the 6c at the ideal listening level, while the open design ensures unrestricted airflow around the loudspeaker and allows the 6c's acoustic design to perform as intended. Built from steel and engineered around the dimensions and weight of the 6c, the stand provides secure support while maintaining a clean, minimal footprint that naturally complements the loudspeaker. Available in 106 cm height to accommodate different listening environments and applications.
