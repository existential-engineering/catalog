description: Black TRS patch cables with the 1010music logo printed on male
  3.5mm minijack ends, used to connect 1010music eurorack modules to other
  modules with stereo minijack connections. Available in 30cm/11.75" and
  60cm/23.5" lengths, and in single or 5-pack sizes.
details: |-
  Use these black cables with the 1010music logo on either end of the jack to connect 1010music eurorack modules to other modules that also use stereo minijack connections. This is a TRS cable with male 3.5mm minijacks on either end, available in two lengths: 30cm/11.75" and 60cm/23.5". These cables can be used for connections between any two 1010music modules, and to any other modules that use a compatible mapping of MIDI signals to stereo minijack connectors.

  For more information on stereo minijack compatibility, see the [Mini TRS Compatibility Guide](https://1010music.com/stereo-minijacks-midi-connections-compatibility-guide).
specs: |-
  - Connector: male 3.5mm TRS minijacks on both ends
  - Length options: 30 cm / 11.75", 60 cm / 23.5"
  - Pack size options: Single, 5 Pack
  - Weight: 0.25 lbs
  - Dimensions: 5 x 5 x 0.3 in
  - Base SKU: 006-1
  - Only variant with confirmed live pricing: 30 cm / 5 Pack, SKU 012, $29.95 regular price
