  I've had an RE-201 for several years now, but it began to develop excess wow and flutter, and the tape would jam on occasion. I found EchoFix's website and purchased the RE-201 service kit, which comes with a new pinch roller, bearings, felts and two new tapes. The RE-201 used different sized bearings and felts in different revisions, but all sizes are provided to make sure you get the correct size for your machine. The install instructions were very easily to follow and the whole process didn't take long, and my machine now sounds better than ever. The quality of the tape supplied with the kit is far superior to what I had been using – the tape really makes a difference. The machine's original pinch roller was worn and uneven (as can be expected with many years of use), which was causing a lot of the problems. The new roller feeds the tape smoothly, keeping a consistent speed over the tape heads. Finally, the new bearing and felts keep everything running smoothly and cleanly. Everything is now running perfectly. For those who have an RE-201, I highly recommend purchasing this kit to restore your machine – it really is worth it. Eddie A (USA)

  -----------------------------------------------------------------------------------------------------------------------------------------------------------

  I would recommend EchoFix unreservedly as perhaps the only company in the world now selling high quality replacement parts for the Roland series of Space Echo tape delay units. I had sourced various tapes and pinch rollers from EBAY sellers more conveniently located to the UK, only to waste my money. Any web search will show EchoFix as presenting the most professional looking web site with the most comprehensive selection of parts, most of which are not NOS but new parts manufactured to the exact requirements of the old Roland machines. After a frustrating experience of fitting odd parts from other sellers, only to have the performance of the machines I was working on get worse, I contacted Shane at EchoFix. He was extremely helpful and gave me solid advice on what was needed to get these machines working again. I ordered and fitted two EchoFix maintenance kits for the two machines I was working on and soon had them working perfectly. My experience is that the Space Echo mechanisms do seem to be very sensitive to the type of tape being used and other tape loops, which may look similar, simply don't perform as well as the loops from EchoFix. Terry Relph-Knight

  -----------------------------------------------------------------------------------------------------------------------------------------------------------

  I have a Roland RE 201 Space Echo unit that I bought from the original owner, the guy took really good care of the unit as it's like NOS perfect! I used it for a couple of years and then I noticed the tape sound had lots of worlble and hiss. So I purchased a replacement tape from a guy here in the Los Angeles area. I replaced the tape with the new one and it sounded way better but not perfect like it did when I bought the unit. I cleaned the heads and pinch roller and even demagnetized it but really didn't do that much? I went online and found Echo Fix "Bingo" this guy has everything to fix or rebuild your Roland Space Echo. I ordered the 6 pack of his Tape for the Roland Space Echo and I noticed right away the the fidelity and clarity came back to my unit. The Tape that Shane uses is the real deal!! I'm still on the first tape and it been six months and the unit still sounds like the day I installed it. Thanks Shane, you're the guy that I will aways go to for my Roland Space Echo needs! Cheers mate,

  Robby F. - Santa Barbara California.
