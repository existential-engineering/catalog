details: |-
  This service kit for the Roland Space Echo has all the parts you need to carry out a service on your Space Echo RE-501 or SRE-555. The Kit has the following:

  2 x New Tape Loops (Made with superior quality lubricated tape)
  1 x Tape Tension Spring
  1 x Original Style Green Felt Set (Tape path & Tension Felts)
  2 x Tape Feed Bearings
  1 x Improved GREEN Pinch Roller – Looks great and better quality than the original black type. 1 x Black Roller Cap. The improved roller will increase the life of your motor and reduces wow and flutter. Note: Original black rubber roller cap that sat on top of the old roller will not fit with this new improved roller. DOWNLOAD - Service Kit Installation Guide

  Note: Our tape is NOT BASF LGR-50 or Mastering tape which is not suitable for these units. Incorrect tape can cause low echo output, tape jamming, distorted echo output, little or no self oscillation, incorrect tone and excessive head wear. Over 90% of the repairs that come in to our workshop are due to faulty tape loops that were made with incorrect tape. Reviews

  I bought an RE-201 Space Echo second hand around ten years ago. It had not been well cared for by the previous owner and had excessive pitch variation in the echo. Not just a slight movement - at points it would vary by more than a semitone or sometimes even lock up completely. I tried everything to get it fixed, and spent a lot of money. Cleaned everything, bought new tapes - tried several tape varieties to no avail. I had it serviced by a space echo expert in the UK, who rebuilt the motor with new bearings, fitted new felts, adjusted and calibrated everything. He gave me very specific advice about which tapes to use and where to source them. After that, the machine worked just enough to be useable, but still with a fair bit of wow, especially at slower settings. I would put a new tape in, it would run OK for a couple of hours, but then soon start sticking and making sudden big pitch swings. I tried rubber restore on the pinch roller, and applying silicon lubricant to the heads to help the tape slip past. This made it useable for short delays where the pitch issues were less obvious. But as a result of these limitations, and the unpredictability of the thing, I stopped using it much. I recently decided to have one last try at fixing it. I searched online, found Echofix, and emailed for advice. Shane suggested the RE-201 full service kit. It arrived a few days later, and I cleaned everything and fitted all the new parts: leaf spring and tape feed bearing, new green pinch roller with sealed bearing in it, new felts and a new tape. After ten years of this thing not really working to varying degrees, I was sceptical, and beginning to think the unit was beyond saving. But to my astonishment and delight, the new parts have completely revitalised the unit. It will now do delay with good pitch stability even on the slowest settings. In fact it has been a revelation hearing this classic unit properly for the first time, with all its warm, organic qualities. Its status as a classic is well deserved. It is a week since the new parts were installed, and the Space Echo been in use almost daily, and no sign of the previous issues at all. I've been putting everything through it and it sounds fantastic. I am enormously grateful to Echofix for helping me to fix my RE-201, and for such a reasonable amount of money/time/effort as well. Michael G (UK)

