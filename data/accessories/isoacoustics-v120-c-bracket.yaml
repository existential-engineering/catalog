name: V120 C-Bracket
manufacturer: isoacoustics
primaryCategory: acoustic-treatment
url: https://isoacoustics.com/products/v120-c-bracket
description: An IsoAcoustics V120 C-Bracket for downward-firing ceiling or wall
  mounting of HEDD TYPE 05 and TYPE 07 monitors, connecting to the patented V120
  isolation mount system.
details: |-
  The C-Bracket is a downward bracket for TYPE 05 and TYPE 07 monitors, developed collaboratively between IsoAcoustics and HEDD to allow ceiling or wall installation with speakers facing downward.

  It connects to the IsoAcoustics patented V120 mounting system and provides 45 degrees of adjustment and height, with a quick and easy slide-in connection. Its isolation technology reduces vibration transfer into the supporting structure.

  Compatible with all TYPE 05 and TYPE 07 models; a corresponding adapter is required for different monitor models.
specs: |-
  - Function: downward bracket for TYPE 05 and TYPE 07 monitors
  - 45 degrees of adjustment and height
  - Quick and easy slide-in connection
  - Weight: 0.7kg (1.54lbs)
  - Dimensions: 255mm x 25.5mm x 105mm (10" x 1" x 4.1")
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with all TYPE 05 and TYPE 07 models (corresponding adapter required)
