details: |-
  The PH-nc is a powerful, high output neck pickup that features a tight and clear low end with a well defined and focused upper mid-range, featuring rich harmonics, and long natural sustain. The note separation is exemplary with excellent volume control dynamics. This pickup is available in two types: 2S attaches with two screws, standard for most guitars. 3S attaches with three screws, replacement type for Caparison guitars. 2S Version Dimensions PDF - 3S Version Dimensions PDF
