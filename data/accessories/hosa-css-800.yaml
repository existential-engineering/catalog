description: Balanced snakes come with connectors designed to join pro audio
  equipment with balanced phone jacks.
details: >-
  This snake is designed to interconnect pro audio gear with balanced phone
  jacks. It is ideal for use with mixing consoles and patch bays.


  Features include nickel-plated plugs for rugged durability and efficient
  signal transfer, Oxygen-Free Copper (OFC) conductors for enhanced signal
  clarity, and OFC spiral shields for effective EMI and RFI rejection and
  flexibility.


  Connectors are 1/4 in TRS to Same, and the snake is offered in 1 m, 2 m, 3 m,
  4 m, 5 m and 7 m lengths under the SKUs CSS-801, CSS-802, CSS-803, CSS-804,
  CSS-805 and CSS-807.
specs: |-
  - Nickel-plated plugs for rugged durability and efficient signal transfer
  - Oxygen-Free Copper (OFC) conductors for enhanced signal clarity
  - OFC spiral shields for effective EMI and RFI rejection and flexibility
  - Connectors: 1/4 in TRS to Same
  - SKU: CSS-800
  - Available lengths: 1 m, 2 m, 3 m, 4 m, 5 m, 7 m
  - Lifetime warranty
