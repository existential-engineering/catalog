description: A USB interface board designed for installation in the expansion
  slot of products belonging to the Zoom MRS series, allowing project data to be
  backed up and restored and audio track data to be converted for use on a
  computer.
details: |-
  The UIB-02 is a USB interface board that fits the expansion slot of Zoom's MRS series multitrack recorders. Once fitted, the host recorder can be started in USB mode and connected to a computer with a USB cable, at which point the recorder's internal hard disk mounts on the computer as an ordinary local disk volume.

  Compatible models listed in the manual are the MRS-1044, MRS-1044CD, MRS-1266 and MRS-1266CD, current as of December 2002, and the MRS-4 is explicitly not supported. The manual also points owners of later MRS models to their own documentation for how to enter USB mode, and the MRS-802's own specification table lists the UIB-01/UIB-02 among its optional accessories.

  Operating system support depends on the host. Windows 98, 98SE, Me, 2000 and XP work with both the MRS-1044 and MRS-1266 families, with a Zoom-supplied driver needed on Windows 98 and 98SE and the standard OS driver used from Windows Me onward. MacOS 9.1, 9.2 and X are supported with the MRS-1266 and MRS-1266CD only: an MRS-1044 fitted with a UIB-02 does not support MacOS at all. Under Windows the board runs at USB 2.0 speed if the computer's port is also USB 2.0, otherwise at USB 1.1, and on Macintosh it conforms to USB 1.1.

  Two jobs are covered. Project backup and restore works by copying PROJxxx folders between the mounted recorder volume and the computer in the file manager, and the supplied Audio File Manager application converts any V-take on the recorder into a WAV file or imports an existing WAV or AIFF file onto a V-take. The bundled CD-ROM carries the Windows 98 drivers, the Windows Audio File Manager executable and MacOS 9 and MacOS X installers.

  The connection must be taken offline before the cable is unplugged or the recorder is switched off, using the Windows remove-hardware tray program or by dragging the mounted volume to the trash on MacOS, or files on the recorder's disk can be damaged. Under MacOS X an MRS-1266 mounts as two volumes, MRS-USR and MRS-FAC, and the MRS-FAC volume belongs to the recorder's own system and must not be altered.
specs: |-
  - Function: USB interface board for the expansion slot of Zoom MRS series multitrack recorders
  - Compatible hosts (as of December 2002): MRS-1044, MRS-1044CD, MRS-1266, MRS-1266CD. Cannot be used in the MRS-4
  - Also listed as an optional accessory in the MRS-802 specification table, as UIB-01/UIB-02
  - Windows support: 98 and 98SE via a Zoom-supplied driver, Me, 2000 and XP via the standard OS driver
  - MacOS support: 9.1, 9.2 and X with the MRS-1266 and MRS-1266CD only. An MRS-1044 with a UIB-02 does not support MacOS
  - USB speed: USB 2.0 under Windows when the computer's port is USB 2.0, otherwise USB 1.1. USB 1.1 under MacOS
  - Computer requirements: Windows PC (166 MHz Pentium or higher recommended) or Apple Macintosh with a USB connector. NEC PC-9800 series not supported
  - Free hard disk space: 100 MB or more, RAM: 32 MB or more
  - Other requirements: 1 CD-ROM drive, 1 USB cable
  - Functions: project backup and restore by file copy of PROJxxx folders, V-take to WAV export and WAV/AIFF to V-take import through the supplied Audio File Manager
  - Supplied CD-ROM contents: Windows 98/98SE drivers, Windows Audio File Manager (TakeWave.exe), MacOS 9 and MacOS X installers, English and Japanese online manuals
