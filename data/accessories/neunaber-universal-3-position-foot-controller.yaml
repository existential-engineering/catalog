details: |-
  You'll have complete control over your Quilter amplifier with the Universal 3 Position Foot Controller! Unlock the potential of your Quilter amplifier by choosing from any of 6 controls. Easily expand your controller by daisy chaining a second controller via the redundant rear mounted RJ 45 jacks and a common Cat 5 cable. Quilter Universal Foot Controller features at a glance. Quilter Universal Foot Controller features at a glance. -Rugged-ized construction featuring thick walled steel outer shell
  -Heavy duty switches
  -Vintage style cream selector switches
  -Hands free control of your Quilter amplifier! Important Note:

  Compatible with the Mach 3, OverDrive 202, Steelaire, MicroPro Mach 2, MicroPro Gen 1, Aviator Gen 1 and Aviator Gold amplifiers.
