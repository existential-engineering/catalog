details: |-
  Dekoni Audio Ensemble grell OAE1/2 Plugs Braided PCUHD Y-Split

  Unlock the full spatial presentation of multi-driver and open-acoustic headphones with the Dekoni Audio Ensemble grell OAE1/2 Y-Split Cable. Custom-engineered for the unique pin geometry of the grell OAE1 and Crosszone OAE2 models, this upper cable section bridges your headphones directly into the modular Ensemble ecosystem. Key Features

  Utilizing high-purity PCUHD copper conductors in a flexible braided construction, this Y-split delivers a warm, rich, and organic sound signature with deep bass extension. The lightweight, ergonomic Y-split housing sits comfortably against your chest without dragging on the headphone jacks. Featuring Dekoni's quick-locking modular connector, it effortlessly pairs with any Ensemble lower base cable or extension for a secure, low-resistance connection.
