details: |-
  The Formation Wedge Wall Bracket is a dedicated wall mount for the Formation Wedge wireless speaker, offered in a black finish.

  The Formation Wedge manual notes that a Formation Wedge can be placed on a shelf, table or furniture unit and can also be wall-mounted on a dedicated wall bracket, and that the bracket should be installed in line with its included instructions. Stud-work and plasterboard walls are unlikely to provide adequate strength or rigidity to support a Formation Wedge speaker and bracket, so specialist help should be engaged if the suitability of a wall is in doubt.

  The supplied installation instructions are a diagram-only sheet covering the bracket, its wall plate and the fixings, and specify 4mm x 37mm (No.8 x 1 1/4in) screws for the wall fixing.
specs: |-
  - Part number: FP41009
  - Finish: Black
  - Wall fixing screws specified in the installation instructions: 4mm x 37mm (No.8 x 1 1/4in)
