description: Built with period correct components, the AG 4J-60 set offers warm, punchy, and articulate jazz bass tones akin to those of the 1960s. The 60's J-style pickups are designed with period-correct parts and deliver all the warmth and punch of the iconic 60's Jazz Bass pickup.
details: |-
  Built with period correct components, the AG 4J-60 set offers warm, punchy, and articulate jazz bass tones akin to those of the 1960s. The 60's J-style pickups are designed with period-correct parts and deliver all the warmth and punch of the iconic 60's Jazz Bass pickup. Utilizing Alnico V magnets and the proprietary winding pattern, these pickups have improved string-to-string consistency, clarity, and articulation. The AG 4J-60 Pickups are direct replacements for Jazz Bass style basses.
specs: |-
  - Wire: Heavy Formvar, 42 gauge
  - Magnets: Alnico V
  - Leads: Single conductor, Teflon coated
