description: Instant generative wind sounds
details: |-
  The WIND AND STARS (NOISE) voice card makes internal connections in the Bullfrog so that the instrument automatically emulates randomly evolving wind sounds.

  The blinking stars that go with those sounds are controlled by the divider, so the patch runs generatively once the card is inserted and needs no playing. Erica Synths notes that toddlers fall asleep better when they hear sounds like these.
