description: The Canvas Power USB allows your rig to be powered by most USB
  Power Delivery (PD) supplies like laptop chargers, high power phone chargers,
  and even 30 Watt minimum USB PD battery packs! With the Power USB, you can now
  take your rig to even more places.
details: "The Canvas Power USB allows your rig to be powered by most USB Power
  Delivery (PD) supplies like laptop chargers, high power phone chargers, and
  even 30 Watt minimum USB PD battery packs! With the Power USB, you can now
  take your rig to even more places. Got an outdoor festival this weekend and
  the dive bar with only one outlet for the whole band the next? Grab a USB PD
  battery pack and you’ve got a wireless rig! Battery pack not included. When
  selecting a battery pack make sure it is a 30 Watt minimum PD (Power Delivery)
  battery, similar to this one. Here’s how it works: • Power USB works as a
  bridge that goes between your Canvas Power unit (or other power supplies with
  a 24V EIAJ input) and its power brick or USB battery pack. • Place the Power
  USB before your current power supply and connect them from the Power USB’s 24V
  Thru to your main supply’s 24V In with the included EIAJ cable. • Your pedals
  can now be powered by a USB PD supply such as an adapter (like the one
  connected to your MacBook), battery pack, OR your canvas power brick! • Power
  USB will prioritize the normal DC brick supply if present or use the USB PD
  input if no power brick input is detected. Power USB’s included variable
  voltage 500mA output is great way to add an extra pedal power output to your
  rig, or have a handy single pedal power supply option on your desktop. Canvas
  Power Supplies bring simplicity and modularity to powering your pedalboard.
  The Power USB’s variable voltage, 500mA output brings silent, isolated, and
  clean 9V (or 12/18V*) power to your pedals. The Canvas Power series is built
  using modern switch-mode supply architectures. This means each output is
  isolated, highly efficient, and heavily filtered, ensuring they supply plenty
  of power with incredibly low noise. *With the voltage switch in the 12V
  setting, it will deliver up to 375mA. In the 18V setting, it will deliver up
  to 250mA. The super slim design allows Canvas Power Supplies to fit under
  nearly any pedalboard, and the included universal mounting brackets mean you
  don’t have to worry about your power supply staying put when you’re hustling
  to your next gig. The onboard LED power meter lets you clearly see how much
  power consumption is remaining, plus an LED indicator above the output jack
  letting you know when it’s sending power. We’ve also developed custom 2.1mm
  barrel cables with a 90-degree plug on one end, and our all-new super short
  straight plug on the other, giving you the maximum flexibility for fitting
  these power supplies into tight spaces. Of course, they all accept standard
  2.1mm barrel cables as well, but they won’t be nearly as cool. What’s in the
  Box? - 1 x Canvas USB Power Supply - 18” Straight to right angle DC Cable –
  Qty. 1 - 12” EIAJ Link Cable - Qty. 1 - 3’ USB-C to USB-C Cable - Qty. 1 - C
  style mounting bracket set w/screws - M3 Hex Key"
