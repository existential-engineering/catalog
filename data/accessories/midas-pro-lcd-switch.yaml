description: "PRO LCD SWITCH enables dynamic and context-sensitive user
  interfaces, providing clear visual feedback of assigned functions and
  user-created labelling of mixing console channel, bus and group selections.
  The high contrast FSTN LCD glass with 36 x 24 pixel resolution allows
  immediate at-a-glance indication over a very wide viewing angle, and the
  tactile response of the momentary switch action provides confidence that the
  switch has been pressed, essential when the mix engineer's eyes are on the
  stage, not the console. PRO LCD SWITCH provides the key user interface
  functionality for the Midas console VCA and POPulation group navigation
  system, which mirrors the natural workflows used by mix engineers. The RGB LED
  backlight offers high visibility in all lighting conditions, and the colour
  coding offered by the 8 distinct displayable LED colours encourages the
  development of a mental picture, or “Mind Map”, of the whole console system.
  The flexibility of PRO LCD SWITCH ensures only the required control elements
  and associated visual feedback are presented, allowing users to adopt
  structured task-based workflows. PRO LCD SWITCH is suitable for use in all
  Midas XL8 and PRO SERIES digital consoles and control centres, including as a
  replacement for the Screenkeys RGB24T LCD switch."
