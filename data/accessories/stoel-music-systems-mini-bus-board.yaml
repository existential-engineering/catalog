description: A power distribution board for Eurorack cases that supplies power
  connectors for up to ten modules along with screw terminals for connecting an
  external power supply and LED voltage indicators.
details: |-
  The Stoel Music Systems Mini Bus Board is an excellent way to distribute power to your Eurorack modules in smaller cases. It has power connectors for powering up to 10 modules and a set of screw terminals for connecting the power supply. Each voltage has an LED indicator. The board uses a ground plane design to improve performance and reduce noise, and each voltage has a filter capacitor. A jumper enables the onboard +5V supply. If you have a power supply with a +5V output, do not install the jumper. If your power supply does not have a +5V output, install the jumper. The bus board's built-in +5V regulator will then draw from the +12V input to generate +5V. When using the onboard +5V supply, the +5V screw terminal is left unconnected, reducing the wiring required. Eight mounting holes are provided. Mounting screws or standoffs are not included. The hardware used to mount the bus board will depend on the type of case you are using. Pan-head wood screws and a nylon spacer are recommended in a wood case. In a metal case, nylon screws and nylon threaded standoffs are recommended. Dimensions are 6.5"" (166mm) by 0.9"" (23mm).
specs: |-
  - Great way to distribute power in small cases
  - Has 10 power connects
  - Durable screw terminal to easily hook up to a power supply
  - On-board +5V supply
  - The board uses a ground plane design to improve performance and reduce noise, and each voltage has a filter capacitor
