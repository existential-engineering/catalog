details: |-
  The 3900SB swivel bracket is designed to mount a single TRx3900F column array to a wall and give the installer 27 degrees of vertical tilt in both directions as well as 67 degrees of side to side adjustment in both directions to properly aim the speaker system. The TRx3900F comes with the hardware screws to mount the 3900SB to the TRx3900F. Additional hardware to mount the bracket to the wall is not included.
