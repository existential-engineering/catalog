description: A replacement drum pad surface for the DrumKAT featuring power dot
  material for improved sensitivity and reduced hand fatigue.
details: |-
  The NuBounce pad with power dot material (patented product from Aquarian Drumheads that adds strength and firmness to the drumKAT NuBounce pads), has great low end sensitivity and wider dynamics. It is a softer playing surface, whereby you can dig in and not experience hand fatigue. Please be aware before installing this pad, once you put it on, in a short time it will permanently adhere to the FSR surface. If your FSR sensor is more than 3 years old, we recommend replacing the sensor BEFORE installing the NuBounce surface. Please note, once you have installed your NuBounce surface it is no longer returnable.
