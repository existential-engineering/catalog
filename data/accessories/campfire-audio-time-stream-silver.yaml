  Campfire Audio's new Time Stream: Silver features four, high-purity, pure silver conductors. This premium audio cable will expand and brighten your audio signal, bringing more brilliance and clarity to your upper-frequencies and adding speed and refinement to the low-end, relative to copper or SPC cables. High-definition pure silver IEM cable

  Four Pure Silver 24 AWG conductors

  Durable aluminum termination housings

  Gold-plated terminations

  Custom-matrix MMCX connectors

  Tangle resistant ribbon-style, smoky gray jacket
