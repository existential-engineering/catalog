details: |-
  The USB ISP is a USB firmware uploader for use with the official Intellijel Firmware Updater app. It's required to update firmware on the following Intellijel products: Plog, Metropolis, Mutamix, µScale, µStep.

  All other firmware updatable modules only require a standard mini or micro USB cable.

  The USB ISP includes a 6-pin ribbon cable for connecting to the programming header on the rear of the module. It connects to your Mac or PC using a standard USB A to USB Mini B cable.
specs: |-
  - Includes 6-pin ribbon cable for module programming header
  - Connects to computer via USB A to USB Mini B cable
  - Required for firmware updates on Plog, Metropolis, Mutamix, µScale, µStep
