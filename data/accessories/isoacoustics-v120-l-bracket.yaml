name: V120 L-Bracket
manufacturer: isoacoustics
primaryCategory: acoustic-treatment
url: https://isoacoustics.com/products/v120-l-bracket
description: An IsoAcoustics V120 L-Bracket for front-facing ceiling or wall
  mounting of HEDD TYPE 05 and TYPE 07 monitors, connecting to the patented V120
  isolation mount system.
details: |-
  The L-Bracket is a front-facing bracket for TYPE 05 and TYPE 07 monitors, part of the IsoAcoustics x HEDD Mounting Solutions line developed collaboratively between the two companies. It connects to IsoAcoustics' patented V120 isolation mount system for ceiling or wall installations.

  It offers up to 45 degrees of adjustable tilt and a quick and easy slide-in connection. Its patented isolation technology mitigates the transfer of vibration into the supporting structure.

  Compatible with all TYPE 05 and TYPE 07 HEDD monitor models and the V120 isolation mount system; corresponding adapters are required for different speaker models.
specs: |-
  - Function: front-facing bracket for TYPE 05 and TYPE 07 monitors
  - Up to 45° of adjustable tilt
  - Quick and easy slide-in connection
  - Weight: 1.1kg (2.43lbs)
  - Dimensions: 360mm x 25.5mm x 165 or 305mm
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with all TYPE 05 and TYPE 07 models (corresponding adapter required)
