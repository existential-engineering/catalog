description: Advanced Remote Control USB for TotalMix FX — a wired USB 1.1
  (UAC1) MIDI remote control natively compatible with Windows and Mac OS X,
  providing direct access to the most frequently used TotalMix FX actions and
  commands.
details: |-
  The ARC USB is a wired remote designed for direct access to the most frequently used actions and commands of TotalMix FX, being an indispensable tool in the studio's daily applications. Its extremely flexible configuration through TotalMix FX simplifies workflow and greatly increases the usability of the RME interface in most real world situations.

  The ARC USB is a USB 1.1 (UAC1) MIDI remote control, natively compatible with Windows and Mac OS X. As soon as it is present in the operating system it communicates with TotalMix FX (via USB) and is therefore compatible with all RME audio interfaces that are detected and supported by TotalMix FX — going back to RME interfaces released in 2001. Any button press or wheel turn causes the respective action to be performed by TotalMix FX, and therefore also by the RME audio interface.

  The ARC USB can also be connected directly to RME's latest devices, featuring an internal USB 1.1 host with matching connector. This way of connecting is handy in stand-alone mode, where the ARC USB is supported by the UFX Series, 802 FS, UCX II and MADIface XT II.

  The ARC USB is bus powered but draws only little current. It uses USB 1.1 as bus standard, which is uncritical due to its lower frequency and speed demands. USB 2 cables with 5 to 10 meter length, and cheap USB 2 cable extensions that usually make a bus-powered interface fail, will work perfectly for the ARC USB. At higher lengths RME recommends active USB 2 cables (also called extension or repeater cables), which work over lengths of more than 20 meters.

  The ARC USB can control several interfaces simultaneously, which happens automatically as the Key Commands dialog in TotalMix FX is specific to the currently selected audio interface. Just assign only the functions desired for each respective interface; after that the ARC USB keys and the encoder wheel control the respective interface where they have been assigned to, without the need to further switch or select anything in normal operation. A stand-alone mode with a fixed function set is also available, with included stickers for the stand-alone layout.
specs: |-
  - USB Standard: USB 1.1 (UAC1) MIDI
  - Power: Bus-powered (low current draw)
  - Compatibility: Windows and Mac OS X
  - Cable Length: 5–10 m standard USB 2 cables; 20+ m with active USB 2 cables
  - Stand-Alone Mode: Fixed function set with safety options
  - Host Compatibility: All RME interfaces supported by TotalMix FX (since 2001); direct USB 1.1 host connection on UFX Series, 802 FS, UCX II, MADIface XT II
