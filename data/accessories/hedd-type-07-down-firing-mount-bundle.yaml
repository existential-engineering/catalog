  isolation mount with patented IsoAcoustics isolation.
details: |-
  This bundle is a ceiling mounting solution designed for down-firing installation of TYPE 07 monitors, specifically designed and made by industry-leading specialist IsoAcoustics for HEDD. It consists of an M07 mounting adapter, a V120 C-Bracket, and a V120 isolator, with all necessary hardware for installation included.

  It provides up to 45° of adjustable tilt and uses patented IsoAcoustics isolation technology to reduce vibration transfer through supporting structures.

  Compatible with TYPE 07, TYPE 07 MK2, and A-CORE models. Monitor sold separately; the monitor needs to be prepared with mounting screw holes by HEDD or a certified service partner.
specs: |-
  - Contents: 1x M07 mounting adapter, 1x V120 C-Bracket, 1x V120 isolator
  - Up to 45° of adjustable tilt
  - Patented IsoAcoustics isolation technology
  - Weight: 1.71kg
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with TYPE 07, TYPE 07 MK2, and A-CORE models
  - Monitor sold separately; requires mounting screw holes prepared by HEDD or a certified service partner
