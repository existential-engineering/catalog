description: Voltage Regulator and Power Conditioner
details: |-
  The PG-2R is Black Lion Audio's flagship voltage-regulating power conditioner — a step up from the PG-2 that actively maintains a steady 120V output within ±2V tolerance, regardless of incoming voltage fluctuations. This makes it ideal for studios in areas with unstable power grids or for touring applications where wall power quality varies dramatically.

  Like the PG-2, it features 12 switched, filtered, and surge-protected outlets on the rear panel organized into four groups: Digital Audio (x2), Analog Audio, and High Current. Time-delayed Analog Audio and High Current outlets ensure speakers power on last and off first, preventing audio pops. Two front-panel convenience outlets, two USB chargers (capable of charging most laptops), and XLR lamp connectors on front and rear round out the connectivity.

  At its core is Black Lion Audio's PG-99 Filtering Technology, achieving 99.7% average noise filtering using premium Panasonic and Wima capacitors. A voltage meter and amperage meter provide real-time power analysis, with LED status indicators for grounding, polarity, noise filtering, abnormal voltage, and surge protection. An audio alarm alerts users to unsafe voltage conditions.
specs: |-
  - Voltage regulation: 120V ±2V output
  - PG-99 Filtering Technology — 99.7% average noise filtering
  - Premium Panasonic and Wima capacitors
  - 12 rear switched, filtered, surge-protected outlets (4 groups: Digital Audio x2, Analog Audio, High Current)
  - 2 front unswitched filtered convenience outlets
  - 2 front USB chargers (capable of charging most laptops)
  - XLR lamp connectors on front and rear panels
  - Time-delayed Analog Audio and High Current outlets
  - 2775 joules power absorption (surge protection)
  - Voltage meter and amperage meter
  - LED status indicators: grounding, polarity, noise filtering, abnormal voltage, surge protection
  - Audio alarm for unsafe voltage conditions
