description: Hand-assembled speaker cable with heavy-duty locking banana plugs
  on both ends, built on Canare 4S11 star-quad cable for effective 11 AWG
  performance. Sold individually.
details: |-
  Benchmark Speaker Cable uses Canare 4S11 star-quad cable with an effective 11 AWG gauge (achieved through a pair of 14 AWG conductors) and a polyethylene dielectric for low capacitance and improved frequency response. The Star-Quad configuration reduces interference and noise compared to standard twisted-pair designs.

  Both ends are terminated with heavy-duty locking banana plugs, compatible with standard speaker binding posts on amplifiers and loudspeakers. DC resistance is rated at less than 2.6 ohms per 1000 feet, and capacitance is 45 pF/ft.

  Cables are hand-assembled in the USA. Available in five lengths: 3, 6, 10, 15, and 25 feet. Sold individually; order two for a stereo pair.
specs: |-
  - Connectors: Heavy-duty locking banana plugs, both ends
  - Cable: Canare 4S11 star-quad
  - Effective gauge: 11 AWG (pair of 14 AWG conductors)
  - DC resistance: <2.6 Ohms/1000 ft
  - Capacitance: 45 pF/ft
  - Dielectric: Polyethylene
  - Cable diameter: 0.421 inches
  - Jacket: Super-flexible heavy-duty
  - Lengths available: 3 ft, 6 ft, 10 ft, 15 ft, 25 ft
  - Assembly: Hand-assembled in USA
  - Sold individually (order 2 for stereo pair)
