details: |-
  Round Stand - White - Gravity SSP WB SET 1

  This rugged speaker stand has a much smaller footprint than tripods and a 35 mm rod with a high-strength steel sleeve, ergonomic locking screw and safety stud for secure height adjustment. This stand is adjustable from 1.05 to 1.8 m in 7.5 cm increments, this means that it will work for a person who is up to 2m in height since ISOVOX 2 adds to the total height. It comes with an additional weight disc from our patented VARI-WEIGHT stability system, ensuring both a more secure footing and more convenient transport of the system as a whole. The flat round base and the additional disc weigh 17.1 kg in total, thereby ensuring excellent stability.
