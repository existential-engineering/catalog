description: Dashboard Official Serato DJ Accessory.
details: |-
  Stop staring at your laptop and focus on the music with the Numark Dashboard. The Dashboard is an official Serato DJ accessory that is compatible with dozens of control solutions on the market today. Whether you use turntables or a DJ controller, the Dashboard enables you to tuck away your laptop and focus on the crowd.

  Dashboard's 4.3-inch full color display gives you access to your playlists/crates and lets you monitor your music's waveforms on either the center or side screens. You can browse through your music by Song, Artist, Time, BPM, and Key. Dashboard works across multiple brands that are compatible with Serato DJ.

  Using a compatible Serato DJ controller with mouse-less navigation (browse button), you have complete control to go in and out of your prepared crates/playlists without looking at your laptop. Once Dashboard is in front of your controller you can place the laptop to the side or under the table and freestyle-dig through your crates.

  For Digital Vinyl System (DVS) setups, place Dashboard in the center of your decks and watch the enlarged waveform as a reference point while blending or scratching. Dashboard fits with any Serato DVS enabled mixer.
specs: |-
  - Serato Hi-Resolution DJ Display for any Serato hardware
  - 3-screen display incorporates low-profile Serato Displays with your existing hardware
  - Stacked parallel waveform option on central screen for simple, direct visual beat matching
  - Screens provide 1:1 real time feedback of Serato DJ, enabling DJ to close or move the source laptop and focus on the music
  - Dedicated track library screen with corresponding navigation controls
  - 3 height adjustments with full tilt control for DVS or controller height setup
  - 5 column options to show Song, Artist, Time, BPM, and Key
  - Gridlines on screen enable perfect beat matching
  - Compatible with over 40 existing Serato DJ control systems including DVS
  - 4.3-inch full color central screen
  - Includes: USB Cable, Power Adapter, User Guide, Warranty and Safety Information
