details: |-
  An extended version of our standard yoke rods for the LCD-5 AND MM-500. These rods offer an additional 1 inch of extension over the standard yoke rods.

  Please note these rods are for use on LCD-5 and MM-500s only. They are not compatible with any other models. These rods do not come with the knurled black thumb screws.

  Audeze yoke rods are fabricated in limited runs by a computer-controlled lathe. The rods are tumble-finished to smooth and polish any rough surfaces, then a finishing process called passivation strengthens the rods and protects them from corrosion.
