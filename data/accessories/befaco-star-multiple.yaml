description: The Star Multiple is a passive 1-to-5 signal multiplier in a
  compact star-shaped adapter form factor. It uses six 3.5mm TS mono jacks to
  split a single input signal across five outputs with no active circuitry or
  power required. Designed for Eurorack and modular synthesizer use, it enables
  straightforward signal distribution for audio, CV, or gate signals.
details: |-
  The Befaco Star Multiple is a passive signal distribution adapter purpose-built for modular synthesizer environments. Its star-shaped physical form factor places one input jack at the center hub and five output jacks radiating outward, making cable management intuitive and the signal flow visually obvious at a glance.

  Because the design is entirely passive — no power rail connections, no active buffering — the Star Multiple is transparent by nature. The input signal is split resistively across all five outputs, which means there is a slight impedance load increase per added connection. In practice this is negligible for most modular CV and gate signals as well as line-level audio, but users routing high-frequency audio or precision 1V/oct pitch CV through many outputs may prefer an active buffered multiple for critical applications.

  The adapter uses six 3.5mm TS (tip-sleeve) mono jacks, consistent with the Eurorack patch cable standard. Any of the six jacks can serve as the input, with the remaining five acting as outputs — or alternatively two separate 1-to-4 splits can be achieved by treating two jacks as inputs and three each as outputs, though signal interaction should be considered in that configuration.

  The Star Multiple ships in sets and is sold as an accessory rather than a panel-mounted Eurorack module, making it a flexible solution for both in-case patching and desktop/tabletop modular setups. Its compact size and passive nature mean it can live anywhere in the signal chain without consuming rack space or HP.
