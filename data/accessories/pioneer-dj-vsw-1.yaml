description: Video switcher
details: |-
  The VSW-1 is simple in its design and extremely easy to use, ensuring that DVJs are able to mix audio/video content from separate sources without relying upon multiple independent devices or needing another artist in the DVJ booth.

  This Video Switcher gives performers more freedom in the mix because they can automatically switch video sources (by pressing the red "Auto" button) when using the familiar Fader Start capability found in all of Pioneer's Pro DJ mixers.

  The VSW-1 video switcher gives top DVJs the flexibility they need to take full advantage of Pioneer's revolutionary DVJ-X1.
