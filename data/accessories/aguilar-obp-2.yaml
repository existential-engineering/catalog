description: The OBP-2 SK is a two-band boost and cut bass and treble preamps, that has high headroom, low distortion, and the ability to reproduce the full dynamic range of your instrument. The OBP-2 was designed to give bassists fat tone, while being small enough to fit into tight control cavities.
details: |-
  The OBP-2 SK is a two-band boost and cut bass and treble preamps, that has high headroom, low distortion, and the ability to reproduce the full dynamic range of your instrument. The OBP-2 was designed to give bassists fat tone, while being small enough to fit into tight control cavities. OBP-2 SK kit includes stacked Treble/Bass pot. Wire this preamp with one 9 volt battery and it will fit into just about any instrument. With +/-18dB of boost and cut at 40Hz and +/- 16dB of treble boost and cut at 6.5 kHz you have can emphasize just the right frequencies to make your bass sound great in any mix.

  The OBP-2 TK is a two-band boost and cut bass and treble preamps, that has high headroom, low distortion, and the ability to reproduce the full dynamic range of your instrument. The OBP-2 was designed to give bassists fat tone, while being small enough to fit into tight control cavities. OBP-2 TK kit includes separate Treble and Bass pots. Wire this preamp with one 9 volt battery and it will fit into just about any instrument. With +/-18dB of boost and cut at 40Hz and +/- 16dB of treble boost and cut at 6.5 kHz you have can emphasize just the right frequencies to make your bass sound great in any mix.
