details: |-
  Product Overview

  The Heil PRSM is a rugged, professional-quality flexible suspension shock mount specifically engineered for home, broadcast, and recording studio applications. Designed to suspend Heil Sound's large-diameter dynamic microphones, the PRSM decoupling system isolates the microphone body from mechanical vibrations, table bumps, floor thuds, and low-frequency handling noise that can degrade broadcast or voiceover recordings.

  Crafted with a durable metal skeleton structure and high-tension elastic suspension bands, the PRSM securely grips compatible large-body Heil dynamic microphones, including the PR 30 and PR 40. Featuring an industry-standard 5/8″-27 threaded base, the PRSM threads directly onto Heil broadcast boom arms (such as the PL2T and SB-2) and standard floor stands, offering professional visual aesthetic and uncompromised audio isolation.
specs: |-
  - Superior Vibration Isolation: Flexible suspension design decouples the microphone body to eliminate contact noise, desk bumps, floor vibrations, and low-frequency mechanical rumble.
  - Tailored for Large-Body Heil Microphones: Engineered specifically to fit Heil dynamic microphones including the PR 30, PR 30B, PR 40, PR 40B.
  - Heavy-Duty Metal Construction: Built with a rugged, studio-grade metal frame and durable suspension elastic bands designed for long-term broadcast reliability.
  - Universal 5/8″-27 Threading: Integrated mounting base fits all standard microphone stands, floor booms, and desk mounting hardware.
  - Seamless Boom Arm Compatibility: Perfectly integrates with the Heil PL2T Professional Quality Boom Arm and SB-2 mini boom arms.
  - Professional Broadcast Aesthetic: Adds a sleek, high-end studio look to podcasting setups, radio broadcast desks, and streaming video channels.
  - Product Type: Flexible Suspension Microphone Shock Mount.
  - Thread Mount: industry-standard 5/8″-27 threads.
  - Weight: 16.2 oz (459.3 g).
