details: |-
  The LEHLE mains adapter can be used with all LEHLE products. It supplies 12V and 270mA, enough to power even the LEHLE D.LOOP SGoS. The connector on the 12V side conforms to the DIN 45 323 standard, and engages positively with its trademark lug in the power-supply socket of all Lehle units.

  The adapter can operate from 100 to 240V AC mains supplies, and is also sustained short-circuit-proof, at last assuring you of safe and dependable power.
specs: |-
  - Supplies 12V and 270mA
  - Powers all LEHLE products, including the LEHLE D.LOOP SGoS
  - Connector on the 12V side conforms to the DIN 45 323 standard, with a trademark lug that engages in the power-supply socket of all Lehle units
  - Operates from 100 to 240V AC mains supplies
  - Sustained short-circuit-proof
