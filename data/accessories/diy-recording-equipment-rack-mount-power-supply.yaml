description: A universal switch-mode external power supply that provides +/-16v
  and 48v phantom power for DIYRE rack-mount kits like the PR502, Colour Duo,
  and G Bus. A companion THRU cable allows daisy-chaining power to up to four
  units.
details: |-
  All of our rack-mount kits use the same external power supply and THRU cable. The External PSU is a universal, switch-mode power supply that provides +/-16v and 48v phantom power. It provides up to 2 amps of current on the 16v rails, which can power up to four PR502, Colour Duo, or G Bus units. The THRU Cable can be used to daisy-chain power from one unit to another. The THRU Cable comes as a kit that you must solder together yourself. To use the THRU Cable, you must have an External PSU connected to your first unit. You can then connect the THRU cable from the THRU jack of the first unit to the POWER INPUT jack of the second. You can power up to four units this way. Yes, you can mix-and-match different units. All of our rack-mount units are compatible with all the others. External PSU Features

  THRU Cable Features

  Resources

  The External PSU does not come with 3-prong IEC power cable. If you plan to use it for a different project, we recommend filtering the power supply's output for lowest noise. Please see our Power Supply Filtering Schematic (PDF) for a recommended filter circuit.
specs: |-
  - Compatible with the PR502 500-series rack , Colour Duo , and G Bus
  - Built-in filtering and over-current protection
  - Power indicator LED
  - Universal AC input, 100-240VAC
