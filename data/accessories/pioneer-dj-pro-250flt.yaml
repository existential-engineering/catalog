description: Flight case for the DJM-250 and two CDJ-350s
details: |-
  Lightweight, durable and custom-made for 2 CDJ-350 s and a DJM-250, the PRO-250FLT flight case is a convenient way to get your kit to gigs – and helps pro-long its life over frequent use. The PRO-250FLT is custom-made in the UK using high-quality materials to maximise protection and comfort when carrying. You can even perform straight out of the flight case thanks to handy cable access. High grade aluminium profiles protect all exposed edges Bright plated fittings including recessed butterfly catches Soft-feel handle Die cut polyethylene/polyurethane foam insert for maximum protection and support Built-in covered cable management area External cable access via a rubber membrane to the rear of case
