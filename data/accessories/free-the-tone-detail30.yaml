description: An instrument link cable built around an uncommon 5 mm diameter for
  connecting effects units together, with the soldered section protected against
  the load that cable tension places on it.
details: |-
  FREE THE TONE succeeded in development of a cable with an uncommon 5 mm diameter. To establish both the sound quality necessary to connect effects units together and good usability, all of the maker's accumulated know-how was applied. A cable that is too thick is difficult to use for connection between two effects units, and the cable's own tension can apply force to the soldered portion and lead to breakage. The CU-5050 Link Cable is durable and long life due to various inventions implemented to reduce the load on the soldered section.

  This is a warm sounding cable for instrument use with clarity that transmits the nuances of the vibration of the strings. The basic concept in developing it was a sound that makes you want to keep on playing, as close to the raw sound of the guitar or bass as possible. All of the characteristics of the instrument are maintained, while harsh electrical noise picked up by the pickups is eliminated.

  The plug used in the CU-5050 has unique wave shape grooves in its body to provide proper hold for plugging and unplugging. The inside of the plug also has a special shape unique to the FREE THE TONE product. The tip (hot) inside the plug has a tongue shape connection terminal, and a large ground contact area is provided for connecting the core and ground wires, so sound quality and intensity are improved compared with other plugs. The sleeve to which the shield is connected has a blade that clamps the cable firmly and reduces the possibility of breakage.

  Since effects units have many different jack placements and orientations, four plug configurations are available to handle various cases: Straight/Straight (S/S), Straight/L-angle (S/L), L-angle/L-angle (L/L) and a crank type L-angle/L-angle (CRANK). Each configuration is sold in 15 cm, 20 cm, 30 cm, 50 cm, 75 cm and 100 cm lengths.
specs: |-
  - Conductor size: 0.25 mm2
  - Construction: 50/0.08A OFC (No/mm)
  - Insulation thickness: 0.93 mm (plus or minus 0.05)
  - Inner jacket thickness: 0.25 mm
  - Shield diameter: 3.50 mm
  - Jacket thickness: 0.75 mm (plus or minus 0.10)
  - Diameter: 5.00 mm
  - Maximum conductor resistance (20 degrees C): 100 ohm/km or less
  - Capacitance (1 kHz): approx. 80 pF/m
  - Plug types: Straight/Straight (S/S), Straight/L-angle (S/L), L-angle/L-angle (L/L), crank type L-angle/L-angle (CRANK)
  - Lengths: 15 cm, 20 cm, 30 cm, 50 cm, 75 cm, 100 cm
