details: |-
  Eurorack Bus Board PCB

  The Eurorack Bus Board PCB is a compact, chainable power distribution board designed for Eurorack modular synthesizer systems. This PCB-only version allows builders to distribute power and control signals efficiently while customizing component selection to suit their system requirements. Key Features

  Power Distribution & Expansion

  This Eurorack bus board PCB provides reliable distribution of power and control signals to your modular system. The chainable design allows multiple boards to be connected together, making it easy to expand your system as it grows. Optional decoupling capacitors can be added to improve power stability, especially in larger or more demanding setups. DIY Build Notes

  This DIY Eurorack bus board PCB does not include components. Builders can populate the board with components of their choice, including optional decoupling capacitors and LED indicators. Optional components (not included):

  Technical Specifications

  This bus board PCB is ideal for custom Eurorack case builds and power distribution projects where flexibility and compact design are essential.
specs: |-
  - PCB-only Eurorack bus board
  - Distributes +12V, -12V, +5V, GND, Gate, and CV
  - 8 16 pin IDC connector power slots for Eurorack modules
  - Optional decoupling capacitors for improved power stability
  - Optional LED indicators with adjustable brightness
  - Chainable design for expanding the number of power slots
  - Compact footprint for flexible case layouts
  - Decoupling capacitors: 3 × 100nF, 2 × 22µF
  - LED indicators (requires 10K resistors; brightness adjustable)
  - Format: Eurorack
  - Board Type: PCB only
  - Power Slots: 8
  - Distributed Signals: +12V, -12V, +5V, GND, Gate, CV
  - Dimensions: 165mm × 35mm
  - Expandability: Chainable with additional boards
