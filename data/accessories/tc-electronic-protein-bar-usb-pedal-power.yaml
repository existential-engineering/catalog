details: |-
  The TC Electronic PROTEIN BAR USB PEDAL POWER is the USB-C powered pedalboard power supply for the working guitarist's rig.

  Multiple isolated 9V DC outputs allow simultaneous powering of pedalboard-class effects without ground-loop noise. Standard-size variant for compact-to-medium pedalboards. The USB-C input lets you power the unit from any modern laptop charger, USB-C wall plug, or compatible portable power bank, eliminating the dedicated wall-wart cable most pedalboards still need. Heavy-duty metal housing fits standard pedalboard underside mounting.
