details: |-
  A plug-top (wall wart) switch-mode power supply rated at efficiency level VI, supplying 15 volts DC at 400mA, regulated, on a centre-negative 2.1mm DC plug.

  The mains input accepts 90 to 264 volts AC at 50 or 60Hz, and four interchangeable heads are included for UK, EU, US and Australia or New Zealand outlets, so one unit covers most regions.

  It is intended for the first-generation Pro-SOLO mk1, Pro-DCB mk1 and Pro-KADI mk1 converters. The later mk2 and mk3 revisions of those units take a different supply.

  The product photograph is generic and may not show the voltage, current or polarity of this particular item, though it does show the plug-top style, the four interchangeable heads and the DC plug type.
specs: |-
  - Output: 15V DC, 400mA, regulated
  - DC plug: 2.1mm, centre negative
  - Input: 90-264V AC, 50/60Hz
  - Efficiency level VI
  - Supplied with four interchangeable heads: UK, EU, US, Australia/New Zealand
  - Intended for Pro-SOLO mk1, Pro-DCB mk1 and Pro-KADI mk1 (not mk2 or mk3)
