  For use with the following applications: Hot Hand 3 Sensor Out to Sensor In or Multi-Function In on all Soundblox and Hot Hand effects pedals; Soundblox Hub v1 Multi-Function Out to Multi-Function In Soundblox 2 pedals; daisy-chain connections for sharing of Hot Hand or expression signals between multiple pedals; and Dual Expression Sensor Out to Soundblox pedals.
