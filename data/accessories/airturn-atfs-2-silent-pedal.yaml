description: A silent, non-mechanical momentary footswitch part designed to work
  with the AirTurn DIGIT500. It uses reed switch technology for durability and
  has no Bluetooth capability.
details: |-
  Silent non-mechanical momentary footswitch. Works well with the AirTurn DIGIT500. AirTurn has designed its own footswitch, the ATFS-2, with ground-breaking proprietary "mechanism-free" momentary switch technologies for completely silent operation. Perfect for musicians who need to eliminate the sounds of page turns, the ATFS-2 is crafted from high strength plastics and features no squeaky hinges or switch "clicks" to trigger page turns. Its low profile makes it easy and discrete to tap. The reed switch technology is designed to outlast any mechanical switch by millions of uses. Using rare earth elements, this switch should be product you can pass on to your grand children. *This is just a footswitch/part and does not have Bluetooth capability. Weighs .38 lbs (172 gms)
