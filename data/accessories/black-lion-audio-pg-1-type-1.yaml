description: Rackmount power conditioner for Australian/Chinese (Type I) 230V connections
details: |-
  The PG-1 Type 1 is a 1U rackmount power conditioner designed for Australian Type I 230V connections. It features six switched rear-panel outlets organized into three filtered groups (Digital Audio, Analog Audio, High Current) with time-delayed sequencing to prevent speaker pop. Two unswitched convenience outlets sit on the front panel. Filtering uses premium Panasonic and Wima capacitors across multi-stage digital, analog audio, and high current filter circuits, achieving 99.7% noise filtering versus an industry average of ~85%. The unit offers 2775 joules of surge protection, a front-panel LED voltmeter, and status indicators for grounding, polarity, noise filtering, abnormal voltage, and surge protection. An audio alarm sounds for unsafe voltage conditions.
specs: |-
  - Form Factor: 1U Rackmount
  - Power Input: Fixed Type I cable, 230V AC
  - Rear Outlets: 6 × Type I (switched, filtered, surge protected)
  - Front Outlets: 2 × Type I (unswitched convenience)
  - Outlet Groups: Digital Audio (x2), Analog Audio (x2), High Current (x2)
  - Sequencer: Yes (time-delayed High Current outlets)
  - Surge Protection: 2775 joules
  - Noise Filtering: 99.7%
  - Display: LED voltmeter and status indicators
  - Height: 1.7"
  - Width: 19"
  - Depth: 9.8"
  - Weight: 10.6 lbs
