details: |-
  Knurlies are purpose-built Eurorack mounting screws designed by Befaco to simplify module installation and re-arrangement. Unlike standard screws, Knurlies feature a knurled grip that allows finger-tightening without tools, while also accepting Phillips, slot, and Allen drivers for those who prefer them.

  They are available in two thread sizes: M3 (the most common Eurorack standard) and M2.5 (used by some manufacturers). Both variants are 7mm in length, appropriate for standard Eurorack rails.

  The M3 version is made from brass with a black nickel plated finish, while the M2.5 version uses brass with a standard nickel plated finish. Each screw includes a flat-tight washer to protect rack rails and module faceplates from damage during installation.

  Knurlies are sold in packs of 50 or 100 screws per size, making them practical for outfitting a full Eurorack case or multiple smaller cases.
