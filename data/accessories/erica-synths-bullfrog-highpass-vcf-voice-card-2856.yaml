description: Add a Highpass filter to your Bullfrog
details: |-
  The HIGHPASS VCF voicecard expands the sound treatment capabilities of the Bullfrog by bringing a highpass filter into the game, which opens up both highpass and bandpass filtering.

  The card carries the typical VCF controls, CUTOFF frequency, RESONANCE and CV LEVEL. A CV source switch selects between envelope generator 2 and the Sample and Hold LFO, the pulsewave generator in the Sample and Hold section.

  Audio connections are made internally. The output of the MIXER is patched into the highpass VCF and the output of the highpass VCF goes into the input of the onboard lowpass VCF, which is then connected to the VCA. For more flexibility no CV connections for the Bullfrog are present on the voice card, so that patching is left to the player.
specs: |-
  - Highpass filter functionality
  - Control over Cutoff, Resonance and CV amount
  - CV source switch for envelope generator 2 or the Sample and Hold LFO
  - Internal audio connections from the mixer through the highpass VCF into the lowpass VCF and VCA
