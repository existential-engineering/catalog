details: |-
  The eRim is an FSR trigger that attaches securely to the rim of any size drum. It does not attach to the tension rods on the drum, so it is easily removable and avoids any tuning issues. The advantage with FSR is that there is zero crosstalk interaction and superior dynamic range. This is a great addition to any acoustic drumset. This product requires a single 1/4" input on the DITI OR FTB for both power and to send MIDI data to your favorite drum module or DAW!
