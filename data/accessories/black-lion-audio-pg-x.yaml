description: Rackmount power conditioner with PG-90 Filtering Technology and
  surge protection
details: |-
  Black Lion Audio developed the PG-X to provide quality power conditioning for budget-conscious users without sacrificing essential features. The PG-X features 8 switched, filtered, and surge-protected outlets on the rear panel, 1 switched convenience outlet on the front panel, and 1 USB Type A port for device charging.

  Its proprietary PG-90 Filtering Technology provides approximately 90% noise filtering, compared to the typical 76% found in competing units. The unit also includes a high-frequency noise filter and is designed for standard 1U rackmount installation.
specs: |-
  - PG-90 Filtering Technology — approximately 90% noise filtering
  - 8 rear switched, filtered, surge-protected outlets
  - 1 front switched convenience outlet
  - 1 USB Type A charging port
  - Output Current: 15A
  - Power: Fixed AC cable
  - Form factor: 1U rackmount
  - Dimensions: 19" W x 1.7" H x 9.8" D
  - Weight: 3 lbs
