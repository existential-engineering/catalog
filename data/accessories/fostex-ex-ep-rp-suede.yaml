description: Optional replacement ear pads for Fostex RP-series headphones (such
  as the T50RPmk4) designed to improve wearing comfort and deliver smooth,
  high-quality sound across the bass-to-treble range. The exterior uses
  Ultrasuede (a registered trademark of Toray Industries, Inc.) for a soft,
  high-quality texture with excellent durability. Low-rebound cushions of
  optimized thickness help prevent steaming and fatigue during extended
  listening sessions, providing premium, fatigue-free wear.
details: |-
  Material: Ultrasuede (registered trademark of Toray Industries, Inc.)

  Format: Pair

  Compatible Models:
  - T60RP
  - T60RPmk2
  - T60RPmk2CL
  - T50RPmk4
  - T50RPmk4CL
  - T50RPmk4g
  - T50RPmk4g+

  Features:
  - Ultrasuede exterior for soft touch and high-quality texture with excellent durability
  - Low-rebound cushions with optimized thickness for fatigue-free extended listening
  - Helps prevent steaming during long sessions
  - Tuned to deliver smooth, high-quality sound from bass to treble
