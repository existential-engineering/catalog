description: Optional replacement ear pads for Fostex RP-series headphones (such as the T50RPmk4) designed to improve wearing comfort and deliver smooth, high-quality sound across the bass-to-treble range. The exterior uses Ultrasuede (a registered trademark of Toray Industries, Inc.) for a soft, high-quality texture with excellent durability. Low-rebound cushions of optimized thickness help prevent steaming and fatigue during extended listening sessions, providing premium, fatigue-free wear.
details: |-
  Optional ear pads for RP headphones such as T50RPmk4, for improved wearing comfort and smooth, high-quality sound quality. Premium ear pads that provide fatigue-free listening for extended periods of time.

  Ultrasuede provides high-quality listening with a soft feel and comfortable fit. The suede-like material is made of Toray's Ultrasuede, which is soft to the touch and has a high quality texture with excellent durability and moderate breathability and moisture permeability. It provides smooth, high-quality sound quality from the bass to treble range that does not tire easily even after long hours of listening, and a good tactile feel that prevents steaming.

  Combined with low rebounding cushions with optimized thickness around the ears, they provide a comfortable wearing comfort with moderate side pressure that does not cause fatigue. Ultrasuede is a registered trademark of Toray Industries, Inc.
specs: |-
  - Ultrasuede suede-like covering material
  - Low rebound cushions with optimized thickness around the ears
  - Weight: 15.5 g per piece
  - Supported models: T60RP / T60RPmk2 / T60RPmk2CL / T50RPmk4 / T50RPmk4CL / T50RPmk4g / T50RPmk4g+
