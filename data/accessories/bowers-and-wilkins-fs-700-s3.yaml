details: |-
  FS-700 S3 is a dedicated floor stand for the stand-mount loudspeakers in the Bowers & Wilkins 700 Series S3 range. Bowers & Wilkins describes it as a high-performance 700 Series S3 loudspeaker stand, and says the stand-mount models in that series work best on it.

  The stand is offered in two finishes, Gloss Black and Silver, so it can be matched to the 700 Series speaker placed on it. It is sold and priced as a pair, and Bowers & Wilkins publishes a downloadable assembly instructions document for it.
