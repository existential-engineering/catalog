details: |-
  The 8c stand is designed in house to safely support your 8c speakers in a domestic environment. Special care has been taken to ensure the right acoustical properties and sand filling the stand is possible for minimum resonances. The 8c loudspeaker is bolted to the stand so that a sturdy and stable platform is created. The 8c stand is available in matt black finish only. 8c. stand dimensions (HxWxD) 600 x 230 x 360 MM (24 x 9 x 14 IN)
