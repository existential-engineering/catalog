details: |-
  A three socket upgrade kit for early Octave Cat synthesisers that were built without the link socket. It adds CV, Gate and filter control sockets so the synthesiser can be played from a MIDI keyboard or MIDI sequencer through a MIDI to CV converter. An Octave Cat that already has the link socket does not need this kit, only the special stereo jack to two 3.5mm jack cable that connects it to a converter.

  The three inputs are on 3.5mm mono jack sockets. CV gives volt per octave control over the oscillator frequency, Gate decides when notes play (0 volts for note off, above 3 volts for note on), and the filter input sets the cutoff frequency of the low pass filter from the auxiliary output of the converter.

  Used with a converter such as the Pro-Solo mkII, USB-Solo or Pro-2000 mkII, the kit passes notes across around five octaves, pitchbend with the range set in the converter, modulation from the converter's own LFO with speed and waveshape adjustable in real time, and portamento with the rate adjustable in real time. Filter cutoff can be driven from any continuous controller, aftertouch or velocity.

  Low, high or recent note priority and single or multiple note trigger modes are set in the converter rather than in the kit. The note range is limited by the synthesiser itself rather than by the kit or the converter.

  The kit contains the components, the three 3.5mm mono jack sockets and diagrams for connecting the wires and components. Fitting is a job for a competent synthesiser service engineer.
specs: |-
  - Adds three sockets: CV, Gate and filter
  - For early Octave Cat synthesisers without the link socket
  - Inputs are on 3.5mm mono jack sockets
  - CV: volt per octave control over oscillator frequency
  - Gate: 0 volts is note off, above 3 volts is note on
  - Filter input is driven from the auxiliary output of the converter
  - Note range around 5 octaves, limited by the synthesiser rather than the kit
  - The kit adds sockets only and has no power input of its own
