details: |-
  • Barefoot musicians love the footswitch+ for its new, more comfortable switch design. • Use the Footswitch+ to get the most out of your BeatBuddy or BeatBuddy MINI. • Included premium 1/4 stereo TRS right angle cable give you everything you need out of the box. This multipurpose, 2 button Footswitch+ is built like a tank. Momentary footswitches provide quieter operation and increased functionality over latching switches present in other pedals. In addition, it lets you add accent hits, pause/unpause the beat, and choose song, genre and BPM, and more when used with the BeatBuddy or BeatBuddy MINI. Product Description

  When you pair the Footswitch+ with the BeatBuddy or BeatBuddy MINI it gives you even more control over the beat. Right out of the box you get the ability to trigger accent hits, pause/unpause the beat, and navigate songs, genre, and tempo. However, when used with the BeatBuddy, you can do even more with the Footswitch+ like setting it to act as the main pedal. But, it doesn't stop there! The Footswitch+ is hands down the best multipurpose 2 button footswitch on the market. It's built like a tank, is more comfortable than a footswitch has any right to be, and offers quiet, momentary switches. Footswitch+ Features

