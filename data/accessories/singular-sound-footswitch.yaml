  FAQ

  Does the switch just do a cymbal crash when you tap it or does it do a drum fill? The switch's functions are able to be changed through the BeatBuddy, giving it the possibility to perform many functions. You can set it up to do an accent hit using a .wav file of your choosing, pause the beat, and more. Currently, it cannot be used to trigger a fill. Does this need its own power cable? No power cable is needed. The only cable you need to use is a 1/4″ stereo cable. (IMPORTANT: If you opt to use a cable other than the included one, ensure it is a stereo cable. Otherwise your right switch won't function. You can check that it's a stereo TRS cable by looking for 2 black bands on the jack.)

  Can this be used with the BeatBuddy MINI? Yes, it can do an accent hit, pause/unpause, as well as select genre, tempo, and song. Does it work with other equipment or only the BeatBuddy? The Footswitch+ will work with any device that can utilize a dual footswitch. How long is the included TRS cable? 1 foot. From the date of delivery, you have a full 60 days to try out any of our products. Once received, we will issue you a full refund on your purchase to the original payment source used. This covers any innate manufacturing defects and any other issue that seems to have been caused by a factor outside your control. If there is any issue, we will either repair or replace your unit (at our option) free of charge, as long as the issue being dealt with is within the terms of the warranty and the relevant time span. Technical issues that aren't covered are ones that are due to obvious negligence, such as connecting the BeatBuddy to too high a voltage of a power supply, dropping it in water, etc. (basically anything that someone with common sense wouldn't do). We do not cover import VAT.
specs: |-
  - It lets you add accent hits, pause/unpause the beat, and choose song, genre and BPM, and more when used with the BeatBuddy or BeatBuddy MINI
  - Ergonomically designed buttons and a slim, angled housing make it the world's most comfortable footswitch
  - Built to last with sturdy metal switch components and an all metal housing
  - Momentary switches result in quiet, smooth operation and the ability to both press and hold the button for separate commands
  - Use the included 1/4" low profile right-angle TRS stereo cable or substitute it for your own stereo cable
  - Keep the BeatBuddy at eye level while using one of the buttons on the Footswitch+ to do everything the BeatBuddy's onboard switch could do. (Start/stop the beat, control fills and transitions)
  - Press the left switch during a song to trigger an accent hit. (Can be any sound and different for each song part.)
  - Pause/unpause the beat during a song with the right switch.
  - During song selection, hold the right switch to enter/exit folders.
  - During song selection tap the right switch to advance to the next song/folder.
  - Switch to half time and or double time during a song.
  - All metal design
  - 5 x 3.5 x 1.5 in.
  - 1 pound
  - Footswitch+
  - 1/4″ low profile right-angle TRS stereo cable
