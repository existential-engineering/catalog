name: TYPE 05 Front-Firing Mount Bundle
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/t05-front-firing-mount-bundle
description: A HEDD ceiling-mount bundle for forward-facing installation of a
  TYPE 05 monitor, pairing an M05 mounting adapter, a V120 L-Bracket, and a V120
  isolator for 360° rotation and up to 45° of adjustable tilt.
details: |-
  This forward-facing ceiling mount bundle offers everything you need to connect a TYPE 05 monitor to the ceiling. It consists of an M05 mounting adapter, a V120 L-Bracket, and a V120 isolator, with all necessary hardware included.

  The system offers 360° rotation and up to 45° of adjustable tilt; the L-Bracket tilts from forwards to 45° downwards. For steeper angles, HEDD recommends its Down-Firing bundle instead. Patented IsoAcoustics isolation technology reduces vibration transfer.

  Compatible with TYPE 05, TYPE 05 MK2, and A-CORE models. Monitor sold separately; the monitor needs to be prepared with mounting screw holes by HEDD or a certified service partner. For wall applications, the IsoAcoustics Wall Mount must be added separately.
specs: |-
  - Contents: 1x M05 mounting adapter, 1x V120 L-Bracket, 1x V120 isolator
  - 360° rotation and up to 45° of adjustable tilt
  - Patented IsoAcoustics isolation technology
  - Weight: 2.15kg
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with TYPE 05, TYPE 05 MK2, and A-CORE models
  - Monitor sold separately; requires mounting screw holes prepared by HEDD or a certified service partner
