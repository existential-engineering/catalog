description: Socket upgrade kit that fits CV, Gate and Filter input sockets to
  the Roland TB-303 or RE-303, so the synthesiser can be played from a Kenton
  MIDI to CV converter. A five socket version adds Accent and Slide inputs.
details: |-
  This kit adds CV, Gate and Filter sockets to the Roland TB-303, and suits the RE-303 as well. Used with a MIDI to CV converter such as the Pro-Solo mk3, the three extra sockets let the synthesiser be played from a MIDI keyboard or MIDI sequencer. The TB-303 does carry CV and Gate sockets already, but they are outputs and are of no use for driving the instrument from a converter.

  The inputs sit on 3.5mm mono jack sockets. CV provides volt per octave control over oscillator frequency, Gate controls when notes play with 0 volts as note off and above 3 volts as note on, and Filter controls the cutoff frequency of the low pass filter from the aux output of the converter.

  A five socket version of the kit is also offered, adding Accent and Slide inputs on the same style of jack. Each switches the instrument's own feature on above 3 volts and off at 0 volts, so accent and slide become MIDI controllable. The five socket version works in a different way internally, so a three socket upgrade cannot later be extended to five without replacing the entire kit.

  Paired with a Pro-Solo mk3, the kit gives control over notes across at least five octaves on the three socket version and around four and a half octaves on the five socket version, pitchbend with a range set in the converter, modulation from the converter's own LFO with speed and waveshape adjustable in real time, portamento with a rate adjustable in real time, filter cutoff from any continuous controller or from aftertouch or velocity, selectable low, high or recent note priority, and single or multiple note trigger modes.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the 3.5mm mono jack sockets. The TB-303 also carries a 5 pin sync input socket, which can be driven from the sync 24 output of a Kenton converter to run its internal patterns in time with a sequencer. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Three socket version adds CV, Gate and Filter inputs on 3.5mm mono jacks
  - Five socket version adds Accent and Slide inputs as well
  - CV input is volt per octave over oscillator frequency
  - Gate threshold is 0 volts for note off and above 3 volts for note on
  - Filter input controls low pass filter cutoff from the converter aux output
  - Accent and Slide inputs switch on above 3 volts and off at 0 volts
  - Note range of at least five octaves on the three socket version and around four and a half on the five socket version
  - Also suitable for the RE-303
  - The existing TB-303 CV and Gate sockets are outputs and cannot drive the instrument
  - A three socket upgrade cannot later be converted to the five socket version
  - Sync 24 from a converter uses the TB-303 existing 5 pin socket and a fully wired 5 pin DIN lead
  - The TB-303 does not recognise song position pointers, so a synced sequence must start from the top
  - Passive socket kit, so it has no power connection of its own
