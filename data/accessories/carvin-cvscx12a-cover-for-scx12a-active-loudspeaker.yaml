details: |-
  Protective cover for SCx12A. The CVSCx12A is designed to protect the SCx12A loudspeaker while in transit and storage. The CVSCx12A features a removable front and rear panel allowing the speaker to operate with the cover installed. Top, bottom and side velcro flaps allow access to all handles and speaker stand mount. The cover will fit a loudspeaker that is 14"W x 14"D x 22"H in size.
