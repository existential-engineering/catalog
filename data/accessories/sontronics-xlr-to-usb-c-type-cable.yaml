details: |-
  Sontronics XLR to USB-C Type Cable

  The Sontronics XLR-USB-C is a premium-quality cable that allows you to connect any dynamic microphone directly to your computer, making it perfect for recording and broadcasting on the go. It includes Smartphone and USB-A adapters, enabling you to plug your microphone directly into a phone or tablet. This XLR-USB C cable is ideal for podcasting, video calls, gaming, live streaming, and guarantees professional-quality results for vocal or instrument recordings. Pair the XLR-USB C with our PODCAST PRO , SOLO , or CORONA dynamic microphones and ELEVATE stand for a seamless, high-quality setup perfect for recording, streaming, or broadcasting. FEATURES

