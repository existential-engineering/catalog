description: AirLift thrones are the next evolution in DW throne technology.
details: |-
  AirLift Thrones are the next evolution in DW throne technology. Combining the workhorse features of DW's 9000 line of thrones, AirLift thrones also include a sturdier quad-leg folding base, and effortless pneumatic height adjustment (U.S. Patent No. 7,718,878).

  The 9120AL design includes an optional backrest (sold separately, and exclusive to the AirLift model) for those players who desire more support, while the 9100AL incorporates a more traditional seat top.

  Full-Size Comfort: a supportive, molded tractor seat for balance, comfort and longevity.

  Four-Leg Footprint: solid 1-1/8" double-braced foundation with ample no-slip feet.

  Height adjusts from a 20″ minimum to a 27.5″ maximum.
specs: |-
  - The Pneumatic Height Adjustment allows quick and easy adjustment in seconds. (U.S. Patent No. 7,718,878)
  - The Sturdy 4-leg Base keeps you planted.
  - The Special Foam Combination provides superior stability and comfort.
  - The Backrest (optional) works with all AirLift thrones.
