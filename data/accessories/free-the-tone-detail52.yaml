description: Solderless plug that lets a custom shielded cable be built from any
  single-core shielded cable of 5 to 7 mm diameter without soldering, using
  separate contact points for the core wire and the shield. Offered as a
  standard-length cap for guitar and bass cables and a short cap for pedalboard
  link cables.
details: |-
  Free The Tone released its ultra miniature solderless plugs, the SL-8 Series, in 2012, and they were widely accepted because they allowed cable making without soldering. The SL-8 plugs required the maker's dedicated CU-416 cable, so while building pedalboards and rack systems for customers a project began to commercialise a solderless plug that could take general shielded cable, including the maker's own CUI-6550 and CU-5050.

  A wide variety of structures was examined to cover shielded cables of differing diameter and construction. The idea that produced the SL-F Series was a structure with individual contact points for the core wire and for the shield, and the plug reached completion after many prototypes. The plug structure is patent pending.

  With an SL-F plug a custom shielded cable can be made from any single core wire shielded cable of 5 to 7 mm diameter with multiple strands, without soldering. A new cable can be built with the optional CUI-6550 or CU-5050, and a cable that has broken at its plug or lost contact at a soldered joint can be revived the same way.

  The contact that meets the braid shield has a gentle arc so it slides between the braid and the jacket, and an opening in the body lets the contact point be confirmed by eye as it is pressed into the core wire. A screw secures the cable so it cannot pull out, and plastic spacers are supplied so the plug takes cables of differing diameter, including the 5 mm CU-5050.

  Two cap lengths cover the two uses. SL-F-SHRT has a 24 mm cap and is recommended for link cables inside a board, and SL-F-STD has a 33 mm cap and is recommended for guitar and bass cables. Each comes as a straight or an L-angle plug.
specs: |-
  - Fits any single core wire shielded cable of 5 to 7 mm diameter with multiple strands
  - Separate contact points for core wire and braid shield, no soldering required
  - SL-F-SHRT cap length 24 mm, recommended for link cables
  - SL-F-STD cap length 33 mm, recommended for guitar and bass cables
  - Supplied with cap, plug, plastic spacer and screw; fit the spacer for a 5 mm cable such as CU-5050
  - Optional CUI-6550 cable: conductor size 0.5mm sq, 50/0.12A OFC, diameter 6.50mm (+/-0.20), capacitance approx. 80 pF/m, max conductor resistance 32.6 or less ohm/km
  - Optional CU-5050 cable: conductor size 0.25mm sq, 50/0.08A OFC, diameter 5.00mm, capacitance approx. 80 pF/m, max conductor resistance 100 or less ohm/km
  - JP. PAT. NO. 6587243 / DES. PAT. JP. 1645382 / DES. PAT. JP. 1645383
