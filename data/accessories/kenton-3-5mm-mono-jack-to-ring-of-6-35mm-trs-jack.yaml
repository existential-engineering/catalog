  Moog Rogue and Moog Source.
details: |-
  A lead with a 3.5mm mono jack plug at one end and a 6.35mm TRS jack plug at the other, wired to the ring contact only. The tip is deliberately left unconnected.

  That wiring suits the combined CV and trigger sockets of the Moog Rogue and Moog Source, where the two signals share one stereo jack and the ring carries the one this lead is for.

  Further wiring detail for both instruments is covered on their Find My Synth pages. A companion lead wired to the tip instead is sold separately.
specs: |-
  - Connector A: 3.5mm mono jack plug
  - Connector B: 6.35mm TRS jack plug, ring connected, tip not connected
  - For the CV and trigger sockets of the Moog Rogue and Moog Source
  - Sold in a choice of lengths
