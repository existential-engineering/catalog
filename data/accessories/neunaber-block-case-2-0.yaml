details: |-
  You got the best amp on earth, so why wouldn't you want the best protection too? This Block is compatible with the all Block Series amplifiers and features rugged styrofoam inserts for maximum protection. The outside dual layered cording helps keep your case in shape and maintains an attractive appearance while defending against the rigors of the road. The Block Case 2.0 will fit any block style amplifier. (101 Mini Head, 101 Reverb, Tone Block 200, 201, and 202, Pro Block 200, OverDrive 200 and 202, Bass Block 800, 802 and V803)

  Important Note:

  This is the correct fitment case for the Bass Block V803 and Tone Block 202. The original Block Deluxe case will fit, but is not recommended.
