details: |-
  A plug-top (wall wart) switch-mode power supply rated at efficiency level VI, delivering a regulated 5 volts at 1000mA over a USB socket.

  The mains input accepts 100 to 240 volts at 50 or 60Hz. Four interchangeable heads for UK, EU, US and Australia or New Zealand outlets clip onto the body of the supply as needed, so one unit covers most regions.

  It is intended for the D-Sync, the MIDI USB Host mkII and mk3, and the USB Solo mk2. The first-generation MIDI USB Host takes a different supply.

  A USB cable is not included.
specs: |-
  - Output: 5V DC, 1000mA, regulated, on a USB socket
  - Input: 100-240V AC, 50/60Hz
  - Efficiency level VI
  - Supplied with four interchangeable heads: UK, EU, US, Australia/New Zealand
  - Intended for D-Sync, MIDI USB Host mkII and mk3, and USB Solo mk2
  - Not for the MIDI USB Host mk1
  - USB cable not included
