details: |-
  HOOK LOOP LOVE 10’ of Bright Blue Hook-and-Loop When you buy a HOOK LOOP LOVE product, Pedaltrain donates a large portion of profits directly to good charitable causes. Since founding HOOK LOOP LOVE, Pedaltrain has donated almost $250,000 to such causes. Philosophically, we donate as close to the need as possible. A sampling of our donations include emergency financial relief paid directly to victims of arson, direct emergency payments to victims of the 2020 Nashville tornado, legal fees paid on behalf of a homeless family, purchase of reliable transportation for an out-of-work tradesman, purchase of reliable transportation for a fixed-income widow, fully paid-for travel expenses for specialized out-of-state cancer treatment, and funding of health care and health insurance for individuals below the poverty level. We share this not to toot our own horn, but to remind you that you are making a difference with each HOOK LOOP LOVE product you purchase. Thank you for adding to the LOVE we have the honor of sharing with with the world. Note: This product is packaged as two 10 foot long rolls (one roll of hook side, one roll of loop side). When you open the box, the rolls will appear to be different sizes. This is because the the hook (crunchy) material is thicker. When unrolled the two strips will each be 10 feet long. Model: HLL-HM080-10
specs: |-
  - Add a splash of color to your rig
  - Mix and match colors to express yourself and make a statement
  - Spread love with each purchase - a generous portion of sales goes to charitable organizations and directly to people in need
  - This bright blue color is best described as a cross between a blue ribbon award and denim blue jeans.
  - Use hook-and-loop fastener for attaching pedals to your Pedaltrain pedal board
  - 10' of both sides in one box
  - Strong adhesive
