name: Hardtailer
manufacturer: engl
primaryCategory: other
url: https://www.engl-amps.com/shop/accessories/engl-hardtailer/
description: CNC-milled brass and aluminium quick-release block that converts a
  floating guitar tremolo to dive-only in seconds, with no modification to the
  existing tremolo block.
details: |-
  Convert your tremolo from full floating to dive-only in a matter of seconds with the precision engineered quick release system in the ENGL Hardtailer. Easy to install without any modification to your existing tremolo block, and milled from high precision aluminum and brass.

  The Hardtailer blocks and releases a free-floating tremolo in one movement, with no rattling noises or change in sound, and no modification or adjustment of the tremolo required. Handling it during a gig is straightforward, with no risk of the lock coming loose.

  With the tremolo blocked, changing strings on a floating bridge is as easy and convenient as on a hardtail. It also works as a rescue system for a broken string and as an easy fix for drop tuning with a floating bridge.

  It is made in Germany from high grade brass and aluminum for extra stability at low weight, machined to high precision by state-of-the-art CNC milling.
specs: |-
  - Converts a tremolo from floating to dive-only (down only) in a matter of seconds and releases it again just as quickly
  - No rattling noises or change in sound
  - Easy handling during a gig without the risk of the lock coming loose
  - Blocks and releases free-floating tremolos in one movement
  - No modification or adjustment of the tremolo required
  - Easy installation
  - High grade brass and aluminum for extra stability and light weight
  - Highest precision through state-of-the-art CNC milling
  - Changing strings on floating tremolos is as easy and convenient as on a hardtail
  - Rescue system for broken strings
  - Easy fix for drop tuning with a floating bridge
  - Made in Germany
  - Dimensions: 1.5 x 4.6 x 2.5 cm
