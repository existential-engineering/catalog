details: |-
  The Carvin Audio SS7 is a high quality solid aluminum connecting pole set used to connect the TRx3900 or TRx3903 Column Array Loudspeakers to the TRx3118A subwoofer. The SS7 set comes with two pieces, one piece to connect two columns together and other piece to connect the columns to the subwoofer. SS7 Specifications:

  Diameter: 1.4-Inches (35.6mm)
  Net Wt: 1.8lbs
  Material: Solid Aluminum
  Finish: Gloss Black Anodize

  Short Connector:
  Length: 4.46-Inches (including M20 thread). 3.87-Inches (installed length)
  Thread Size: M20

  Long Connector:
  Length: 7.6-Inches
