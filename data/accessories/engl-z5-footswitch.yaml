description: Custom footswitch for ENGL amplifiers fitted with the 9-pin Custom
  Footswitch Port, selecting four channels and remote-controlling two further
  amp functions over a captive 7 m cable.
details: |-
  The ENGL Custom Footswitch Z-5 is designed for ENGL amps that are equipped with the 9-pin Custom Footswitch Port.

  It enables four channels to be selected directly by combining the Clean/Lead channel switching and the Gain Lo/Hi switching. Two other functions can also be remote-controlled, for example Reverb and V.L.S. on the Screamer 50 models, or Contour and Master A/B on the Ritchie Blackmore Signature amp.

  Power is supplied to the footswitch via the special connector cable, so the unit needs no supply of its own. The housing is stainless steel with solid footswitches and LED indicators.
specs: |-
  - For ENGL amplifiers fitted with the 9-pin Custom Footswitch Port
  - Selects four channels by combining Clean/Lead and Gain Lo/Hi switching
  - Remote-controls two further amp functions, which vary by amp model
  - Stainless steel housing
  - Solid footswitches with LED indicators
  - Captive 7 m connector cable
  - Powered from the amplifier over the connector cable, no supply of its own
  - Dimensions: 50 x 12 x 5 cm
