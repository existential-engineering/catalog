details: |-
  The ISOVOX Tripod Stand is a premium, height-adjustable PA-style support stand , co-developed with Gravity , a trusted leader in professional music hardware. Constructed from lightweight yet exceptionally strong aluminum , this stand provides the perfect mounting platform for both the ISOVOX WorkSpace and the ISOVOX Vocal Booth . Its robust build and smooth adjustment mechanism ensure rock-solid stability while keeping weight low — ideal for portable setups. Finished in black or white with subtle ISOVOX branding , the Tripod Stand complements the WorkSpace system visually and functionally, creating a cohesive, professional-looking setup. Whether you're recording vocals, voice-overs, or audiobooks, the ISOVOX Tripod Stand delivers dependable support, portability, and perfect fit — purpose-built for the ISOVOX ecosystem.
