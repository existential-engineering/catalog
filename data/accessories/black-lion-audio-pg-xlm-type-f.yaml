description: Rackmount power conditioner/surge protector with light module and voltage meter
details: |-
  The PG-XLM Type F is the European Schuko market variant of the PG-XLM, built for professionals on a budget who still demand best-in-class power conditioning. It features six switched, filtered, and surge-protected outlets on the back panel, plus one unswitched convenience outlet and a USB Type A charging port on the front.

  A real-time LED voltage meter shows incoming mains voltage at a glance. The retractable downward-facing LED lamp can be rotated ~45 degrees left or right and set to low, high, or off via a 3-way switch. At its core is PG-90 Filtering Technology, providing up to 90% noise filtering — significantly ahead of the typical 76% average found in competing units at the same price point.
specs: |-
  - PG-90 Filtering Technology — up to 90% noise filtering
  - 6 rear switched, filtered, surge-protected outlets
  - 1 front unswitched convenience outlet
  - 1 USB Type A charging port
  - LED voltage meter (real-time mains voltage display)
  - Retractable dimmable LED lamp (3-way switch: low/high/off)
  - Voltage: 230V AC, 10A max
  - Plug type: Type F (Schuko)
  - Form factor: 1U rackmount
  - Dimensions: 483mm W x 44mm H x 167mm D
  - Weight: 1.3 kg
