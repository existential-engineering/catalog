description: The Power Your Pedals Crave Let's cut the noise—literally.
  Introducing Raw Power, the power supply built for the musicians who demand
  only the best for their pedalboard. It's cleaner. It's tougher. It's got
  enough juice to fuel a pedal army, and it works anywhere in the world. No
  compromises.
details: |-
  Raw Power is a power supply built for musicians who demand the best for their pedalboard. It runs so quiet it silences noise stacking up and killing your tone, making it well suited to recording, rehearsing, or playing on stage. With enough current for 30 or more pedals, it keeps the energy flowing no matter how sprawling the board.

  It works with any international power specification, so it can travel wherever your music takes you, and as a Death By Audio product it is built like a tank to survive touring and abuse. Note that it does not include a daisy chain.
specs: |-
  - Input Voltage: 100-240VAC
  - Output Voltage: 9 VDC, Center-Negative
  - Maximum Output Current: 3 A
  - AC Connector: American Type-A Plug (Universal Adapter-Compatible)
  - DC Connector: 2.1mm Barrel
  - Dimensions: 2.88" x 1.19" x 2.57" (includes plug prongs)
  - Cable Length: 120"
  - Weight: 7.7 oz.
