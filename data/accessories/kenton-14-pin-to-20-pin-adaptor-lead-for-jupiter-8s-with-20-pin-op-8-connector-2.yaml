description: 14 pin to 20 pin adapter for older Jupiter-8s that have had the 20
  pin DCB adapter fitted. It converts the 20 pin connector to a standard 14 pin
  DCB connector.
details: |-
  An adaptor lead that converts the 20 pin OP-8 connector found on older Roland Jupiter-8 synthesisers to a standard 14 pin IEEE DCB connector.

  Early Jupiter-8s were fitted with the 20 pin DCB arrangement rather than the 14 pin socket that later Roland DCB equipment uses. This lead sits between the synthesiser and a standard DCB cable or converter so the instrument presents the usual 14 pin connection.

  It is a passive adaptor and carries the DCB signal unchanged.
specs: |-
  - Converts a 20 pin OP-8 connector to a standard 14 pin IEEE DCB connector
  - For older Roland Jupiter-8 synthesisers fitted with the 20 pin DCB adaptor
