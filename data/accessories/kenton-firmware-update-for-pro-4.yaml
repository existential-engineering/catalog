details: |-
  A firmware upgrade for the Pro 4 MIDI to CV converter, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip.

  The installed firmware revision is briefly displayed on the bottom line of the LCD whenever the unit is powered on.

  The firmware history runs from K4CV4210 in May 1994 to K4CV4302.324 in November 1998. Additions over that span include auto sync, polyphonic mode, improved Sync-24 and arpeggio clock handling of uneven MIDI timing clocks, a MIDI analyser mode, loading the last program stored or loaded at power on, a fast scroll mode, controllers that loop from maximum to minimum, a portamento controller select, and the ability to store that portamento controller selection in the program SysEx dump.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: K4CV4302.324, dated 12/11/1998
  - Firmware revision shown on the bottom line of the LCD at power on
