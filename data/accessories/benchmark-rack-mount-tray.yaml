name: Rack Mount Tray for System 1 and System 2
manufacturer: benchmark
primaryCategory: other
url: https://benchmarkmedia.com/products/rack-mount-tray-for-system-1-and-system-2
description: Rack mounting tray that accommodates two half-wide 1U Benchmark
  units in a single rack space. Compatible with all half-wide DAC1, DAC2, DAC3,
  ADC1, and MPA1 units, with or without rack ears.
details: |-
  The Benchmark Rack Mount Tray allows two half-wide 1U Benchmark units to be installed side by side in a single 1U rack space. It accommodates any combination of units with or without rack ears, compatible with all half-wide DAC1, DAC2, DAC3, ADC1, and MPA1 units across System 1, System 2, and System 3.

  The tray ships with all necessary mounting hardware: 8 rack screws (10-32 x 3/4"), 8 product mounting screws (6-32), and 4 trim plates. An optional blank plate is available for single-unit installations. For installations where both units have rack ears, the Benchmark Rack-Mount Coupler is an alternative solution.

  Made in the USA.
specs: |-
  - Height: 1U
  - Mounts two half-wide 1U Benchmark units side by side
  - Compatible with: DAC1, DAC2, DAC3, ADC1, and MPA1 half-wide units (System 1, 2, and 3)
  - Accommodates units with or without rack ears in any combination
  - Includes: 8 rack screws (10-32 x 3/4"), 8 product mounting screws (6-32), 4 trim plates
  - Optional blank plate available for single-unit installations
  - Made in USA
