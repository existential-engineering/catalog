details: |-
  Professional protection for your NS7II or NS7.

  This coffin-style, heavy duty flight case was designed specifically for NS7II and NS7, the Numark performance controller for Serato ITCH software.

  Constructed with metal reinforcement, it has two heavy duty casters and a handle for easy rolling transport. It features removable front and back panels so you can perform with NS7II in the case for added convenience.
specs: |-
