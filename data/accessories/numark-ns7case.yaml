  - Wheels and handle for easy, rolling transport
  - Removable front and back panels allow quick set up and breakdown
  - Accommodates laptop computer stand
  - Extra space for accessories
  - Dimensions: 34.4" x 21.3" x 9.6" (DxWxH)
