description: Replacement low-latency 2.4GHz USB-C wireless dongle for the
  Audeze Maxwell 2 wireless gaming headset. Sold in Xbox and PlayStation
  versions; not compatible with the original Maxwell.
details: |-
  Replacement low-latency 2.4GHz USB-C wireless dongle for the Audeze Maxwell 2 wireless gaming headset. Only one dongle can be active at any one time.

  Pairing multiple dongles to one headset is not possible. Not compatible with Maxwell 1. When pairing, please ensure both the dongle and headset are on the latest firmware version.

  For pairing instructions, see our support article. Please do not pair Xbox dongles to a PlayStation version Maxwell 2 or vice versa! This can cause irreparable firmware incompatibilities to your headphones and is not covered by warranty.
