description: Isolated 12-output pedalboard power supply with ten 9 V outputs,
  one high-current 12 V output and one 18 V output, short-circuit protection and
  per-output LED indicators.
details: |-
  Bigger boards need bigger power. The Power Tap Pro 12 was built for exactly that, a professional power supply delivering clean, stable current to even the most complex pedalboard setups, so every pedal gets exactly what it needs.

  Its ultra-low noise circuitry is aimed at studio-quality performance, keeping the signal free from hum and interference in both recording and live environments. All outputs are fully isolated to prevent ground loops and noise transfer between pedals.

  A dedicated 12 V / 2 A high-current output handles modeling processors and other power-hungry digital devices, ten high-current 500 mA 9 V outputs cover modern digital and analog pedals, and an additional 18 V output is on hand for pedals that need extra headroom. Built-in short-circuit and overload protection, backed by individual LED indicators on every output, keep a rig running as it should.

  Compact and pedalboard-friendly, the Power Tap Pro 12 carries the same engineering and reliability ENGL Amplifiers has built its reputation on for over four decades, whether in the studio, at rehearsal, or on the road.
specs: |-
  - Ultra-low noise design for clean, studio-quality tone
  - Fully isolated outputs to eliminate ground loops and interference
  - 1 x 12 V / 2 A high-current output for modeling processors and digital units
  - 10 x 9 V / 500 mA outputs
  - 1 x 18 V / 100 mA output
  - Twelve DC outputs in total
  - Short-circuit and overload protection
  - Individual LED indicator per output, lit when a pedal is connected and off automatically on fault or overload
  - Compact, pedalboard-friendly enclosure
  - Mains powered; the page does not state the mains connector
