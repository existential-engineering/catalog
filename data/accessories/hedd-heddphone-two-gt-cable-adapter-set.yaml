name: HEDDphone TWO GT Cable & Adapter Set
manufacturer: hedd
primaryCategory: cable
url: https://hedd.audio/products/heddphone-two-gt-cable-adapter-set
description: Official cable and adapter set for the HEDDphone TWO GT, bundling
  single-ended and balanced audio cables (both terminating in 3.5mm on the
  headphone side) together with 6.35mm-to-3.5mm and 4.4mm-to-XLR adapters.
details: |-
  Official audio cable set for the HEDDphone TWO GT. Choose between balanced and unbalanced options for both the audio adapter and the audio cable.

  Cables: a TRS single-ended unbalanced cable (6.35mm to 3.5mm) and a TRRRS balanced cable (4.4mm to 3.5mm). Adapters: an unbalanced 3-pin audio adapter (6.35mm to 3.5mm) and a balanced 4-pin audio adapter (4.4mm to XLR). Each cable is 1 meter and 60cm long.

  Compatible with the HEDDphone D1, HEDDphone TWO and HEDDphone TWO GT.
specs: |-
  - Cable: TRS single-ended unbalanced, 6.35mm to 3.5mm
  - Cable: TRRRS balanced, 4.4mm to 3.5mm
  - Adapter: unbalanced 3-pin, 6.35mm to 3.5mm
  - Adapter: balanced 4-pin, 4.4mm to XLR
  - Cable length: 1 meter and 60cm
  - Compatible with HEDDphone D1, HEDDphone TWO and HEDDphone TWO GT
