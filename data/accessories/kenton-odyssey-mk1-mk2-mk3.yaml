description: Socket upgrade kit adding CV, Gate, Trig and filter jack sockets to
  the ARP Odyssey, so the synth can be driven from a MIDI to CV converter.
details: |-
  A socket upgrade kit for the ARP Odyssey, supplied in two forms because the four versions of the synth differ in which sockets they already carry. The Mk1 is black with a grey face and has no CV and Gate input sockets, the early Mk2 is black with gold lettering and has no CV, Gate or Trig sockets, the later Mk2 is black with gold lettering and does have CV, Gate and Trig sockets, and the Mk3 is black with orange lettering and always has them.

  For the Mk1 and early Mk2, the kit adds CV, Gate, Trig and filter sockets as four 3.5 mm mono jacks. CV gives volt per octave control over oscillator frequency, Gate controls when a note plays, Trig triggers the ADSR envelope (for which Kenton converters have a special mode), and Filter controls the cutoff frequency of the low pass filter. This lets the synth be controlled from a MIDI to CV converter such as the Pro-Solo mk3, USB-Solo or Pro-2000 mkII, with the Pro-2000 recommended for this model because the Solo has only three outputs.

  For the later Mk2 and the Mk3, which already carry suitable CV, Gate and Trig sockets, the kit adds only the filter socket. That socket lets the low pass filter cutoff frequency be voltage controlled from an aux output of a MIDI to CV converter, so cutoff can then be driven by any continuous controller or by other MIDI messages such as aftertouch or velocity.

  Each kit contains all the necessary components plus diagrams for connecting the wires and components and for mounting the 3.5 mm mono jack sockets. Installing a socket upgrade kit is a skilled job for a competent synth service engineer, or the kit can be fitted at Kenton's own premises.
specs: |-
  - Mk1 and early Mk2 kit adds four 3.5 mm mono jack sockets: CV, Gate, Trig and Filter
  - Later Mk2 and Mk3 kit adds one 3.5 mm mono jack socket: Filter
  - CV socket gives volt per octave control of oscillator frequency
  - Gate socket controls when the note plays
  - Trig socket triggers the ADSR envelope
  - Filter socket voltage controls low pass filter cutoff frequency
  - Includes all components plus wiring and mounting diagrams
  - Intended for use with Kenton MIDI to CV converters such as Pro-Solo mk3, USB-Solo and Pro-2000 mkII
