details: |-
  The Canvas Power HP allows you to power the thirstiest of modelers and pedals with a massive 3A (three Amp, or 3,000mA) output. The HP also has 3 isolated power outputs delivering up to 500mA of clean power at 9v. The 3A output can also switch between 9V and 12V for powering high-voltage pedals. Canvas Power HP Supply brings simplicity and modularity to powering your modeler, multi-effect unit, or high powered pedals. Delivering up to 3A in one port and up to 500mA in three ports of silent, isolated, and clean 9V power, the Power HP is perfect for hybrid rigs using pedals and modelers like the Quad Cortex, HX Series, and many more. The Canvas Power series is built using modern switch mode supply architectures. This means each output is isolated, highly efficient, and heavily filtered ensuring they supply plenty of power with incredibly low noise. The Power HP is available for purchase as a standalone power supply or as a linkable unit to another supply via 24V power link, allowing Canvas Power to grow with your power needs without adding another cable you need to plug into the wall. Note: to purchase a Canvas Power HP Link, select the Link option under Power Supply Type AND 24v Link Cable option under the Power Source option before adding to your cart. The super slim 1.2 inch design allows Canvas Power Supplies to fit under nearly any pedalboard, and the included universal mounting brackets mean you don’t have to worry about your power supply staying put when you’re hustling to your next gig. The onboard LED power meter lets you clearly see how much power consumption is remaining, and each output has its own LED indicator letting you know when it’s sending power. We’ve also developed custom 2.1mm barrel cables with a 90-degree plug on one end, and our all-new super short straight plug on the other, giving you the maximum flexibility for fitting these power supplies into tight spaces. Of course, they all accept standard 2.1mm barrel cables as well, but they won’t be nearly as cool. Canvas Power HP Details The Canvas Power HP has 3 isolated power outputs delivering up to 500mA of clean power at 9v, and one 3A isolated output with selectable 9 or 12V. Assorted 2.1mm and 2.5mm reverse and standard polarity cables are also included. See below for specifics. What’s in the Box? If you purchase Canvas Power HP Power Supply: - 1 x Canvas Power Supply - 18” Straight to right angle DC Cable – Qty. 3 - 2.1mm Standard Polarity DC Cable (Yellow) - Qty. 1 - 2.1mm Reverse Polarity DC Cable (White) - Qty. 1 - 2.5mm Reverse Polarity DC Cable (Red) - Qty. 1 - 2.5mm Standard Polarity DC Cable (Blue) - Qty. 1 - 48 W, 24V DC 2A power brick and country specific IEC cable - C style mounting bracket set - M3 Hex Key If you purchase Canvas Power HP Link: - 1 x Canvas Power Supply - 18” Straight to right angle DC Cable – Qty. 3 - 2.1mm Standard Polarity DC Cable (Yellow) - Qty. 1 - 2.1mm Reverse Polarity DC Cable (White) - Qty. 1 - 2.5mm Reverse Polarity DC Cable (Red) - Qty. 1 - 2.5mm Standard Polarity DC Cable (Blue) - Qty. 1 - 12” EIAJ Link cable - C style mounting bracket set - M3 Hex Key
