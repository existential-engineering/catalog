details: |-
  The Benchmark USB Cable Type A to Type B is a 6-foot cable with gold-plated contacts designed to connect a host computer (Type-A end) to a DAC or audio interface (Type-B end). It is the standard cable included with current Benchmark products.

  Benchmark notes that due to the jitter attenuation provided by their UltraLock systems, special premium USB cables are not necessary for optimal performance with their equipment — the standard cable performs on par with audiophile alternatives when used with UltraLock-equipped devices.
specs: |-
  - Connector A: USB Type-A male (host/computer end)
  - Connector B: USB Type-B male (device/DAC end)
  - Length: 6 ft
  - Contacts: Gold-plated
