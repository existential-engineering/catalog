details: |-
  A firmware upgrade for the Pro 2 MIDI to CV converter, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip.

  On firmware 4031.071 and later the version can be read by holding the Inc and Dec buttons while powering the unit on, after which the display shows four sets of two digits continuously, so version 4031.071 reads as 40-31-00-71. On earlier versions the only way to identify the firmware is to remove the cover and read the label on the EPROM, with the unit unplugged from the mains first and the cover and screws replaced before reconnecting.

  The firmware history runs from K2CV4012 in April 1992 to K3CV4032.0042 in November 1996. Changes over that span include auto repeat, a range setting, an EEPROM self test, an arpeggio clock and sync socket test, improved ARP 2600 triggering, new-note-takes-precedence behaviour, a quick test mode, an optional Wasp port on a separate channel, factory-set inclusion of Wasp support, zipper noise work, more even high and low pulses on the arpeggio clock, TR-606 and later TR-808 routines, a panel display of the software revision with MIDI monitor mode, changes to Sync-24 handling including 24 clocks per quarter note on the arpeggio clock, a pitch bend centre facility, and an off position for controllers that returns them to their reset value.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: K3CV4032.0042, dated 01/11/1996
  - Firmware 4031.071 and later report their version by holding Inc and Dec at power on
  - Earlier firmware versions can only be identified from the label on the EPROM
