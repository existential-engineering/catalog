details: |-
  Built around the legendary Belden 8402 microphone cable, GroooveLINE offers an open, natural presentation with exceptional clarity, greater air and an effortless sense of musicality. Whether connecting to your DJ mixer or hi fi system, GroooveLINE preserves every detail of your music whilst maintaining the warmth and character that analogue audio lovers appreciate. Each cable is individually hand assembled in England by skilled technicians using genuine Belden 8402 cable and premium Switchcraft or Neutrik connectors. Every cable is finished with our signature forest green braided sleeving, complemented by gold MasterSounds GroooveLINE branding, making it as beautiful as it is durable. We have trusted this cable combination to voice every MasterSounds product for more than a decade, and we are proud to offer the very same cables to the MasterSounds family. 0.5m RCA-RCA GroooveLINE Audio Cables shipped by end of August. Technical Specifications

  Cable: Belden 8402
  Characteristic Impedance: 52 Ω
  Capacitance, Conductor to Conductor: 98.4 pF/m
  Capacitance, Conductor to Shield: 180.5 pF/m
  Conductor DC Resistance: 33.5 Ω/km
  Shield DC Resistance: 9.8 Ω/km
  Voltage Rating: 600 V RMS
