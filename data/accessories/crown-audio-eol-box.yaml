name: EOL Box
manufacturer: crown-audio
primaryCategory: other
url: https://www.crownaudio.com/en-US/products/eol-box
description: The EOL Box is used as an End of Line (EOL) termination in audio
  systems that use a 20kHz pilot tone to detect open and short conditions in
  loudspeaker circuits.
details:
  - The EOL Box is placed at the farthest end of a loudspeaker circuit so that a
    20kHz pilot tone injected by a compatible amplifier reaches the terminator
    and produces a measurable current. Changes in that current indicate opens or
    shorts along the line, providing remote integrity monitoring of the speaker
    run.
  - An external switch selects between 10Ω and 5Ω termination impedance at
    20kHz, allowing the unit to be matched to the impedance and topology of the
    loudspeaker system being supervised.
  - Current draw at 20kHz is read back through HiQnet Audio Architect software,
    which interprets the values to flag fault conditions. Internal speaker DSP
    in compatible amplifiers passes the 20kHz pilot tone through to the line so
    terminator measurements remain valid even when processing is active.
  - The EOL Box is compatible with Crown DCi Network amplifiers, the Dante
    family of amplifiers, and USP4 CT-equipped amplifiers.
specs: |-
  - Function: End-of-line terminator for 20kHz pilot-tone speaker line monitoring
  - Selectable termination impedance: 10Ω or 5Ω at 20kHz (external switch)
  - Monitoring via HiQnet Audio Architect software
  - Compatible with Crown DCi Network, Dante-family, and USP4 CT amplifiers
  - Passes 20kHz pilot tone through internal speaker DSP
