name: GTC HEDDphone TWO Cable
manufacturer: hedd
primaryCategory: cable
url: https://hedd.audio/products/gtc-heddphone-two-cable
description: A premium GTC upgrade cable for the HEDDphone TWO and TWO GT, with
  a high-purity 8-braid LC-OFC conductor and 4.4 mm balanced termination for
  lower impedance and greater detail.
details: |-
  The GTC premium upgrade cable for the HEDDphone TWO and HEDDphone TWO GT delivers enhanced audio performance through superior construction, offering lower impedance and greater detail. It is a high-purity 8-braid, 40-core LC-OFC balanced cable featuring 760 strands and a transparent sheathing.

  HEDD notes the cable requires high-quality amplifiers to perform at its best. The standard length is 1.6 m with a 4.4 mm balanced termination, and it is compatible with the HEDDphone D1, HEDDphone TWO, and HEDDphone TWO GT. Offered in Normal and Long lengths, and backed by a 5-year warranty.
specs: |-
  - Conductor: 8-braid, 40-core LC-OFC (760 strands)
  - Length: 1.6 m standard (Normal), Long option available
  - Connector: 4.4 mm balanced termination
  - Sheathing: transparent
  - Compatibility: HEDDphone D1, TWO, TWO GT
  - Warranty: 5 years
