details: |-
  Sontronics ST-POP

  The Sontronics ST-POP is a professional-grade pop filter, essential for anyone recording vocals, whether sung or spoken. Featuring a dual-layer nylon mesh, it offers smoother, less harsh results than traditional metal pop shields, making it a must-have tool for achieving clean and clear vocal recordings. The ST-POP's fine nylon mesh effectively reduces the popping sounds caused by plosive consonants like 'p' and 'b' while softening the harshness from sibilant sounds such as 's', 'z', 'sh', and 'ch'. It's also incredibly useful for limiting sound pressure on wind and brass instruments, drums, or guitar amps, ensuring more accurate and balanced recordings. The filter's nylon mesh cartridge, measuring 188mm in diameter, is housed in a sturdy plastic frame and attached to a flexible gooseneck arm for easy positioning at any angle. The strong screw clamp securely attaches the pop filter to any mic stand or even the edge of a desk. Maintenance is simple: the cartridge can be removed and cleaned with warm, soapy water, and the filter comes with a spare cartridge to ensure you're always prepared. FEATURES

