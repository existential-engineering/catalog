description: "Use this cable to connect your bluebox to a data source and a
  power source at the same time. This will allow you to stream audio over USB.
  The cable has a USB B male connection on one end and two USB B female
  connections on the other end: red for power and black for data."
details: |-
  If you bought a bluebox for desktop before September 2023, this handy adapter will make it easier to connect your device to a computer. New firmware allows you to send audio from the bluebox to the computer and back. The adapter splits the power from the USB signal to help avoid noise from your computer, and it also enables you to power the device separately in case your computer or hub is not suitable for the demanding power requirements of the bluebox.

  Connect the male end to the USB Power port on your bluebox. Then connect your bluebox USB B power cable to the red female jack, and a USB B data cable to the black female jack and you are ready to stream audio.
