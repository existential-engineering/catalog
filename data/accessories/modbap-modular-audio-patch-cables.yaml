details: |-
  Our 1/4″ Straight to 1/8″ Right Angle Audio Patch Cables come in sets of 2 per package. Measuring in at 150cm (approx. 5 feet) long, these cables are made with the intention to eliminate the need for adapters when connecting your samplers, drum machines, and groove boxes to eurorack devices. Simply run the 1/4″ end from your groove box and the 3.5mm end directly into your eurorack modules that accept line-level signals. That's it! No need for weird and hard-to-find (and keep up with) adapters. Just cop a set of our audio patch cables, connect and dig in. These modbap brand molded cables are perfect for those looking for an easy way to connect their Drum Machines to the Per4mer for some glitchy lofi performance effects fun. Features
specs: |-
  - Pack of 2 cables
  - Right-angled 1/8" TS to straight-barrelled 1/4" TS
  - Long cables measuring 150cm/5ft
