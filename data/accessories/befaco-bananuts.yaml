description: Anodized aluminum nuts designed for minijack connectors, following
  the Buchla/Serge color-coding standard. These accessories enable users to
  color-code their audio inputs and outputs or enhance the aesthetic appearance
  of their synthesizer equipment.
details: |-
  Bananuts are custom anodized aluminum nuts designed as replacements for the standard nuts that come with minijack connectors used in Eurorack and other modular synthesizer formats.

  They follow the Buchla/Serge color-coding convention, allowing users to visually differentiate inputs from outputs or categorize patch points by function using color.

  Eight colors are available: Blue, Purple, Red, Orange, Yellow, White, Green, and Black, enabling a high degree of customization on any synthesizer panel.

  They are compatible with a wide range of common minijack connector models including PJ301M-12 (Thonkiconn), PJ398SM (Thonkiconn), PJ366ST (Green Stereo Thonkiconn), PJ301BM, PJ398S-BM, PJ301CM, PJ302M, and 161-3502L-E (Kobiconn).
