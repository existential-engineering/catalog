description: Speaker cable with a 2-pole Neutrik NL2 SpeakON connector on one
  end and locking banana plugs on the other, built on Canare 4S11 star-quad.
  Hand-assembled in the USA. Compatible with NL2 and NL4 jacks.
details: |-
  The Benchmark NL2-to-Banana Speaker Cable uses a 4-wire Star-Quad configuration that reduces magnetic radiation and interference by approximately 20 dB compared to standard two-conductor cable. The polyethylene dielectric keeps capacitance low at 45 pF/ft, and the effective 11 AWG rating (via a pair of 14 AWG conductors) keeps DC resistance under 2.6 ohms per 1000 feet.

  One end terminates in a heavy-duty Neutrik NL2FXX locking SpeakON connector (2-pole), compatible with both NL2 and NL4 jacks. The other end terminates in locking banana plugs, compatible with standard amplifier and loudspeaker binding posts. Available in lengths of 3, 6, 10, 15, and 25 feet. Hand-assembled in the USA.
specs: |-
  - Connectors: Neutrik NL2FXX SpeakON 2-pole to locking banana plugs
  - Cable: Canare 4S11 star-quad
  - Effective gauge: 11 AWG (pair of 14 AWG conductors)
  - DC resistance: <2.6 Ohms/1000 ft
  - Capacitance: 45 pF/ft
  - Dielectric: Polyethylene
  - Cable diameter: 0.421 inches
  - Lengths available: 3 ft, 6 ft, 10 ft, 15 ft, 25 ft
  - Assembly: Hand-assembled in USA
  - Compatible with: NL2 and NL4 SpeakON jacks
