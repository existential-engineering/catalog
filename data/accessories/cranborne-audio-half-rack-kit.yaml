description: Rackmount kit for all Cranborne Audio half-rack products.
details: |-
  The Half Rack Kit is perfect for rack mounting any Cranborne Audio half-rack product (such as Camden EC1) into 19" or half-width racks in a variety of different configurations. The Half Rack Kit can be used to mount a single unit into a 19" 1U rackspace, double-rack two units into a single 19" 1U rack space, or mount a single unit into a half-width, 1U rack space.
specs: |-
  - 19" Half Rack Mount configuration
  - Half Rack Mount configuration
  - Dual Rack-Mount configuration
  - Compatible with Cranborne Audio half-rack products (e.g. Camden EC1)
