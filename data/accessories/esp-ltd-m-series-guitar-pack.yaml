details: |-
  The LTD M Series Guitar Pack from ESP is everything you need to get started on electric guitar! Inside the box, you get an LTD M Series guitar with two great-sounding ESP humbucking pickups. You get a 10W guitar amplifier with 3-band EQ and a headphone output for practice. There’s an electronic tuner to make it easy to keep your new guitar in tune and sounding great. As if that wasn’t enough, you also get a 10’ guitar cable, a nylon gig bag to carry your guitar to lessons or jams with friends, a guitar strap, and even some picks. For beginning guitarists, the LTD M Series Guitar Pack is your affordable entry point into the world of becoming a serious musician, with the quality and tone you need for inspiration and fun!
