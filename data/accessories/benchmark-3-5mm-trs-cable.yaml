description: "A multipurpose 3.5mm TRS cable serving dual functions: 12-volt
  trigger signaling for linking Benchmark audio equipment with sequenced power
  control, and standard stereo analog audio connections between 3.5mm ports."
details: |-
  This 3.5mm TRS (Tip-Ring-Sleeve) cable is designed primarily as a remote trigger cable for Benchmark audio equipment, enabling sequenced power control between components that support 12V trigger I/O. The same cable can also be used for standard stereo analog audio patching between any devices equipped with 3.5mm stereo jacks.

  The cable is available in five length options — 1 foot, 3 feet, 6 feet, 10 feet, and 15 feet — making it suitable for both rack-adjacent trigger runs and longer audio patch scenarios.

  Designed to integrate with Benchmark's LA4, HPA4, AHB2, and DAC series products that include 12V trigger I/O ports.
specs: |-
  - Connectors: 3.5mm TRS (Tip-Ring-Sleeve) on both ends
  - Applications: 12V trigger signaling between compatible Benchmark components; stereo analog audio
  - Length options: 1 ft, 3 ft, 6 ft, 10 ft, 15 ft
