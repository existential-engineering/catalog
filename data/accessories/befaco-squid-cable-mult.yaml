description: The Squid Cable Mult is a passive 1-to-6 multiple in patch cable
  format, allowing a single Eurorack signal to be distributed to up to six
  destinations simultaneously. It requires no power and features a plug-and-go
  design with a single 3.5mm TS minijack plug on one end and six 3.5mm TS
  minijack sockets on the other. Its durable construction and compact form
  factor make it a practical utility accessory for any Eurorack system.
details: |-
  The Befaco Squid Cable Mult is a passive 1×6 multiple taking a single signal and splitting it into six identical copies without any signal degradation or power requirement.

  The design consists of a single 3.5mm TS minijack plug (the input end) that connects into any Eurorack jack, and six 3.5mm TS minijack sockets (the output end) into which up to six patch cables can be inserted. This makes it ideal for distributing a single CV, gate, audio, or clock signal to multiple destinations in a patch.

  As a passive device, the Squid Cable Mult introduces no active buffering, meaning there may be slight signal loading when all six outputs are used simultaneously with low-impedance destinations. For most Eurorack use cases — distributing CV, clocks, or gates — this is entirely transparent. For critical audio or precision pitch CV splitting, a buffered multiple module may be preferred.

  Befaco sells the Squid Cable Mult in packs of two units, making it easy to keep spares on hand. Its no-HP, cable-format design means it takes no rack space whatsoever and can be used both inside and outside the case as needed.
