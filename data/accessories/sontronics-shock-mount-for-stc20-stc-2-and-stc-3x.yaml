details: |-
  This complete shock mount is designed specifically for the Sontronics STC-20 , STC-2 and STC-3X microphones, offering secure and stable attachment to any boom stand. The adjustable locking mechanism allows for precise positioning, ensuring optimal microphone placement during recordings sessions and comes complete with a pop-filter attachment, allowing you to place your pop filter at the ideal distance from the capsule diaphragm. The shock mount provides superior isolation from vibrations and background noise, enhancing the clarity of your recordings. Microphone and pop filter not included.
