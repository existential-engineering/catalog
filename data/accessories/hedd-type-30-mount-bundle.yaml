name: TYPE 30 Mount Bundle
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/t30-mount-bundle
description: "Everything needed to connect a HEDD TYPE 30 monitor to a ceiling:
  an M30 U-Bracket paired with two IsoAcoustics V120 isolation mounts for
  vibration-decoupled, tiltable immersive installation."
details: |-
  The TYPE 30 Mount Bundle is a HEDD-branded ceiling-mount package engineered specifically for the TYPE 30 monitor, combining precision mounting hardware with acoustic isolation to reduce vibration transmission and internal reflections.

  The bundle uses IsoAcoustics' isolation technology, tested by the National Research Council of Canada, to minimize vibrations traveling through supporting structures for improved stereo imaging and clearer spatial representation. It provides comprehensive directional control with 360-degree horizontal rotation and up to 90-degree vertical tilt.

  Installation is straightforward, with all necessary hardware included. The steel U-Bracket bolts directly to the speaker mount. For wall-mounted configurations, the separate IsoAcoustics Wall Mounting Bracket is required. TYPE 30 MK2 speakers must be prepared with inserts by HEDD or a certified service partner before mounting.
specs: |-
  - Includes: 1x M30 U-Bracket (steel) and 2x V120 isolation mounts
  - Adjustment: 360 degrees horizontal rotation, up to 90 degrees vertical tilt
  - Compatibility: HEDD TYPE 30 MK2 (with speaker preparation)
  - Material: steel U-bracket
  - Weight: 5.84 kg
  - Warranty: 2 years (IsoAcoustics)
