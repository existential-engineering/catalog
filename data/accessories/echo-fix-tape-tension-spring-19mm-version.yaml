details: |-
  Note: This Tape Tension Spring is for Space Echos with a 19mm Tape Feed Bearing. See other listing for the 22mm version. 1 x Tape Tension spring (19mm version) for Roland Space Echo RE-201, RE-301, RE-501, RE-101, RE-150 & SRE-555

  These tape tension springs should be replaced at least every 300 hours of use to ensure correct tape tension. Incorrect tape tension can lead to low echo output and tape transport problems. We have researched and manufactured new Tape Tension Springs to Rolands original specifications as they are no longer available. As these units are over 30 years old the Tape Tension springs are now wearing out and not applying the correct tape tension. This is an essential service item. Make sure that you are familiar with your country's customs, taxes and importing laws.
