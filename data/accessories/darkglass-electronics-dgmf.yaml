details: |-
  The Darkglass MIDI Footswitch is a configurable foot controller that connects to Darkglass amplifiers or pedals with a MIDI IN connection, and also connects to a computer for configuration using the Darkglass Suite. It offers five switches with freely configurable MIDI commands, or ready-made configurations for Darkglass products, and provides five banks with five presets each in bank mode. It supports any generic MIDI device and is USB MIDI compatible. The unit can be powered from 9V DC, USB, MIDI OUT/THRU, or the Darkglass Amplifier connector.
specs: |-
  - Connects to Darkglass amplifiers or pedals that have a MIDI IN connection
  - Connects to a computer for configuration using Darkglass Suite
  - Freely configurable or ready configurations are available for Darkglass products
  - 5 banks with 5 presets each in bank mode available
  - Supports any generic MIDI device
  - USB MIDI compatible
  - Can be powered from 9V DC, USB, MIDI OUT/THRU or Darkglass Amplifier connector
