description: Studio-grade power conditioner and surge protector
details: |-
  The PG-1 Type UK mkII is the UK market variant of the PG-1 mkII, using a Type G (BS1363) plug for 230V UK power grids. It provides eight switched, filtered, and surge-protected outlets organized into three groups: Digital Audio, Analog Audio, and High Current. Time-delayed High Current outlets ensure speakers and power amplifiers power on last and off first, preventing audio pop.

  At its core is PG-99 Filtering Technology with premium Panasonic and Wima capacitors, achieving 99.7% average noise filtering — compared to the typical 85% found in competing units. Features include a voltage meter, LED status indicators for grounding, polarity, noise filtering, abnormal voltage, and surge protection, an audio alarm for unsafe voltage, and an XLR lamp connection on the front panel. Power absorption: 2775 joules.
specs: |-
  - PG-99 Filtering Technology — 99.7% average noise filtering
  - Premium Panasonic and Wima capacitors
  - 8 rear switched, filtered, surge-protected outlets (3 groups: Digital Audio, Analog Audio, High Current)
  - 1 front filtered convenience outlet
  - USB port for device charging (front panel)
  - XLR lamp connection (front panel)
  - Time-delayed High Current outlets
  - 2775 joules power absorption (surge protection)
  - Voltage meter
  - LED status indicators: grounding, polarity, noise filtering, abnormal voltage, surge protection
  - Audio alarm for unsafe voltage conditions
  - Plug type: Type UK (BS1363)
  - Form factor: 1U rackmount
