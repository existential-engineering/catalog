details: |-
  Product Overview

  The Heil C-Clamp is a heavy-duty replacement desk mounting clamp engineered to secure microphone boom arms directly to the edge of tables, studio desks, and workstation surfaces. Built to provide rock-solid stability in broadcast, podcasting, live streaming, and ham radio environments, the C-Clamp is the standard mounting hardware included with Heil's popular articulated boom arms, offered separately as a direct replacement part or secondary mounting location.

  Designed with a durable steel body and a high-grade brass-lined sleeve insert , the C-Clamp accepts all 1/2-inch diameter boom stems—including the Heil PL2T, HB-1 (discontinued) and SB-2 . The brass lining ensures silent, low-friction, 360-degree rotation of the boom arm without binding or wearing down the stem. Capable of mounting securely onto table edges up to 1.5 inches (38.1 mm) thick, the Heil C-Clamp delivers an efficient, space-saving desktop footprint for cramped studio quarters.

  Key Features
specs: |-
  - Direct Factory Replacement: Serves as the official replacement C-clamp for Heil PL2T and SB-2 microphone boom arms.
  - Brass-Lined Sleeve Insert: Features a smooth brass insert that holds standard 1/2-inch boom stems, enabling fluid, noise-free 360-degree arm rotation without metal-on-metal grinding.
  - 1.5-Inch Maximum Surface Clearance: Heavy-duty clamp screw accommodates tabletop, desk, and workstation edge thicknesses up to 1.5 inches (38.1 mm).
  - Compact Desktop Footprint: Provides a secure, rigid mounting point at table edges when permanent surface drilling is not desired.
  - Universal Heil Boom Compatibility: Fully compatible across Heil Sound's entire line of 1/2-inch stem mounting accessories and boom arms.
  - Rugged Metallic Construction: Built for daily professional broadcast studio, podcasting, and amateur radio use.
  - Product type: desktop C-clamp mount.
  - Compatible Heil booms: PL2T, HB-1, SB-2.
  - Stem acceptance size: 1/2″ (13 mm) diameter boom stem.
  - Maximum table thickness: up to 1.5″ (38.1 mm) opening.
  - Insert material: brass-lined low-friction sleeve.
  - Included in the PL2T, HB-1 and SB-2 boom arm sets, and sold individually as a replacement or secondary mount.
