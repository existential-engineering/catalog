details: |-
  The eight-inch bass/mid driver is custom-made, utilising a polymer cone in a flexible rubber surround. A high-temperature, one-inch aluminium voice coil provides the drive, and a shielding magnet reduces stray magnetic fields, so the Circle 5s may be used close to video equipment.

  It is a direct replacement for the HHB Circle 5 or Xpression! DPM1 mid/bass drive unit. Each drive unit is hand-assembled and tested at the Harbeth factory before shipping, and all finishes are available.
specs: |-
  - Eight-inch bass/mid drive unit
  - Custom-made polymer cone in a flexible rubber surround
  - High-temperature one-inch aluminium voice coil
  - Shielding magnet reduces stray magnetic fields, so the Circle 5s may be used close to video equipment
  - Direct replacement for the HHB Circle 5 or Xpression! DPM1 mid/bass drive unit
  - Hand-assembled and tested at the Harbeth factory before shipping
  - All finishes available
