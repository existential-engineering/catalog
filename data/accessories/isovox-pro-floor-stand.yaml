details: |-
  INFO
  The SP 5211 is a classic tripod speaker stand made of strong but lightweight aluminium tubing with powder coating. It has a 50 kg load capacity and a maximum height of 192 cm.The redesigned, extremely durable mounting of the support feet is made of aluminium pressure die-casting. The steel cuff of the height adjustment is virtually indestructible and ensures additional stability. A safety stud locks the 35 cm, strong extension tube. The ergonomic buttons on the locking screws are made from highly-resistant ABS with a non-slip soft-touch coating made of thermo-plastic for convenient operation. The SP 5211 is delivered with an additional set of black coding rings; additional rings are available in many different colours for distinct personalisation. Highlights
specs: |-
  - Solid durable construction
  - Light Weight Aluminium Construction
