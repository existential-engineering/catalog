details: |-
  The AirTurn QuickDisc is a lightweight, super-clean, and unobtrusive mount for your device at least 3.5 inches wide. Get set up without any distractions from your performance. The mount attaches to your device with a strong adhesive - just peel and stick. Then your mount is secured using hook-and-loop fastening that can be easily removed or adjusted on-the-fly. It's highly durable and compact so you can toss it in your gig bag, backpack, or even a jacket pocket. Includes mount only. Stand sold separately. *Note: We recommend applying directly to your device for the firmest grip. Smooth case surfaces may also work. Please use your own discretion. AirTurn is not liable for any broken devices related to the use of this product.
