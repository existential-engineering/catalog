details: |-
  The PV - L RIGHT - ANGLE PLUG is a high-quality non-pivoting, right-angle 1/4" plug. Pivot - All plugs feature a gold-plated tip for the best transfer of signal; a locking clamp mechanism to securely hold the connector cable; and a heat-resistant insulator around the hot connection to prevent damage from soldering. Please note that this listing is for an individual plug, which must be soldered to a cable. If you'd like us to make the cable in our professional facilities, then please take a moment to browse and select the correct length/configuration here . Pivot - All plugs are made in Japan from the highest quality materials available. NOTE: PV-L plugs must be soldered to a cable - They cannot be connected to an existing straight plug.
