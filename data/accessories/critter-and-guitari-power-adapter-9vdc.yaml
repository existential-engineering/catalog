details: |-
  This 'wall-wart' style adapter outputs 9 Volts DC (regulated) and can supply a maximum of 1300mA. The output has a 2.1mm tip with center-positive polarity. Input: 100-240 Volts AC at 50/60 Hz. Input plug style: North American 2-prong. Dimensions of plastic housing: 2.73" x 1.58" x 1.14". Length of output cable: 58".
specs: |-
  - Compatible with Bolsa Bass (pink or white enclosures)
  - Compatible with ETC Video Synth
  - Compatible with EYESY Video Synth
  - Compatible with original Kaleidoloop (yellow, blue, teal enclosures with wood bottoms)
  - Compatible with original Pocket Pianos (Standard & MIDI, green or 'silver' anodized enclosures with wood bottoms)
  - Compatible with Organelle (blue anodized, M, S, and S2 models)
  - Compatible with Septavox (yellow or black enclosures)
  - Compatible with Video Scopes (original, B&W, and Rhythm models)
