description: A precision 75-ohm coaxial cable with BNC male to RCA male
  connectors, built on Canare LV61S low-loss, low-jitter cable for S/PDIF
  digital audio and analog video applications. Hand assembled in the USA using
  true silver solder with dual foil and braid shielding.
details: |-
  The Benchmark BNC to RCA cable is built around Canare LV61S digital audio coax, chosen for its precision impedance tolerance, low loss, and low jitter characteristics. The 18 AWG solid copper center conductor and dual-layer shielding (100% foil plus 95% tinned copper braid) minimize attenuation, internal reflections, and impedance mismatches that can degrade digital audio signals or introduce jitter.

  Benchmark pairs the Canare cable with Canare RCA connectors specifically selected for their impedance match to 75-ohm coax, ensuring a consistent characteristic impedance from end to end. Each cable is hand assembled in the USA using true silver solder, and every unit is tested before shipment.

  The cable suits S/PDIF coaxial digital audio, as well as unbalanced analog audio and analog video. It is particularly useful for interfacing equipment with BNC digital outputs to consumer gear with RCA inputs.
specs: |-
  - Connectors: BNC male to RCA male
  - Impedance: 75 ohms
  - Cable: Canare LV61S
  - Center conductor: 18 AWG solid copper
  - Shielding: 100% foil + 95% tinned copper braid
  - Conductor DC resistance: 6.4 Ohms/1000 ft
  - Shield DC resistance: 2.8 Ohms/1000 ft
  - Solder: true silver solder
  - Assembly: hand assembled and tested in the USA
  - Length options: 1.5 ft (0.5 m), 3 ft (1 m)
