details: |-
  Dekoni Audio Ensemble TS 3.5mm Plugs Braided PCUHD Y-Split

  Connect dual 3.5mm-entry headphones directly into your modular rig with the Dekoni Audio Ensemble TS 3.5mm Y-Split Cable. Designed as a universal upper section for a vast range of audiophile headphones featuring standard 3.5mm TS earcup jacks, this cable delivers studio-grade conductivity and modular convenience. Key Features

  Built with premium PCUHD braided copper conductors, this Y-split offers an open, musical presentation with punchy low-end impact and smooth highs. The slimline 3.5mm TS connectors are designed to fit securely into recessed earcup sockets without strain. Integrated into Dekoni's modular Ensemble system, it locks seamlessly into your choice of Ensemble main cables or extensions via our custom locking interconnect.
