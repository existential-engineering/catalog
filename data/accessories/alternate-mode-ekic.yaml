details: |-
  Use it on your own bass drum pedal

  Superior Performance: The eKIC uses the same nuBounce material that is currently used on the MalletKAT and TrapKAT. This nuBounce material has a very dense molecular makeup, transferring with ease soft hits to the sensor. Because of its density however, it becomes more resistant to harder hits, allowing for harder playability before the sensor reaches dynamic saturation. The eKIC includes an additional 1/4" input for chaining two eKICs together with a 1/4" mono cable (included)!!! This price includes the eKIC, eKIC beater, and a six foot mono 1/4 inch cable for connecting your pedal to your controller. Your pedal needs to support a 1/4 inch (6.35mm) shaft in order to attach the eKIC beater. The eKIC does NOT work with Yamaha pedals.
