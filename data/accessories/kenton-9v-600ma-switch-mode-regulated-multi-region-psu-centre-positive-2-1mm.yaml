details: |-
  A plug-top (wall wart) switch-mode power supply rated at efficiency level VI. The output is 9 volts at 660mA, regulated, on a 2.1mm DC plug wired centre positive.

  The input accepts 100 to 240 volts at 50 or 60Hz, and four interchangeable mains heads are supplied covering the UK, Europe, the US and Australia or New Zealand. The heads clip onto the main body of the supply as required.

  It is intended for the Thru-5, Thru-12 and Thru-25 thru boxes, the Merge-4 and Merge-8 mergers, the LNDR and LNDX line drivers, Sync-5, Pro-CV to MIDI, Pro-SOLO mkII and mkIII, Pro-DCB mkII and mk3, Pro-KADI mkII, the LD-2, LD-3 and LD-4, GPIM-16, GPMX-16, the MidiStream receiver, all Control Freak models and the Spin Doctor. The mk1 versions of the Pro-SOLO, Pro-DCB and Pro-KADI take a different supply.

  The product photograph is generic and may not show the correct voltage, current or polarity, although it does show the supply type, the four interchangeable heads and the DC plug.
