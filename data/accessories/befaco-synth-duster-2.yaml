description: The Befaco Synth Duster is a super-soft cleaning brush designed to
  keep modular synthesizers and audio equipment free from dust accumulation. It
  is a non-electronic maintenance accessory with no patch points or power
  requirements. Compact and purpose-built for use in and around Eurorack cases
  and studio gear.
details: |-
  The Befaco Synth Duster is a practical maintenance tool aimed at synthesizer and modular gear owners. Dust is a persistent nuisance in studio environments, settling on knobs, jacks, and panel surfaces over time. The Synth Duster provides a safe, effective way to remove it without risk of scratching panels or dislodging components.

  The brush is described as super-soft, making it safe for use on delicate Eurorack module surfaces, potentiometers, and patch bay areas where abrasive materials would cause damage. Its compact form factor — 100 × 110 × 30 mm — makes it easy to store in a rack bag or case accessory pocket.

  As a non-electronic accessory, it requires no power and has no audio or CV connections. It is part of Befaco's broader accessories range alongside power solutions and other utility products for the modular synthesizer ecosystem.
