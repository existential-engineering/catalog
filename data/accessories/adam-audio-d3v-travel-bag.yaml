details: |-
  Take your music making essentials with you wherever you go.

  Winner of both Sound on Sound and TEC's 'Best Studio Monitor' award for 2026, the D3V desktop monitors continue to impress music producers and home audio enthusiasts around the world. Now your desktop companions and studio essentials can be taken on the road with the D3V Travel Bag – designed by ADAM Audio's team in Berlin and exclusively available via our webstore.

  The front and largest section of the backpack contains a firm but removable inlay with four cushioned compartments for maximum protection of your equipment. The lower compartments are identical and exactly fit the D3V, including a cutout for the volume knob. The upper two compartments have space for cables and an interface, with the larger compartment designed specifically to fit ADAM Audio's H200 closed back headphones. There's an additional two small compartments for stowing the D3V's removable feet. This entire section can be zipped shut with the included netting to ensure your equipment stays in place during transit.

  The rear section of the D3V Travel pack features two slim compartments that are designed to fit laptops up to 16" and small midi controllers.
