description: Now your desktop monitors and studio essentials can be taken on the road with the D3V Travel Bag. Exclusively available via our webstore.
details: |-
  Take your music making essentials with you wherever you go.

  Winner of both Sound on Sound and TEC's “Best Studio Monitor” award for 2026, the D3V desktop monitors continue to impress music producers and home audio enthusiasts around the world. Now your desktop companions and studio essentials can be taken on the road with the D3V Travel Bag, designed by ADAM Audio's team in Berlin and exclusively available via our webstore.

  The front and largest section of the backpack contains a firm but removable inlay with four cushioned compartments for maximum protection of your equipment. The lower compartments are identical and exactly fit the D3V, including a cutout for the volume knob. The upper two compartments have space for cables and an interface, with the larger compartment designed specifically to fit ADAM Audio's H200 closed back headphones. There's an additional two small compartments for stowing the D3V's removable feet. This entire section can be zipped shut with the included netting to ensure your equipment stays in place during transit.

  The rear section of the D3V Travel pack features two slim compartments that are designed to fit laptops up to 16” and small midi controllers.

  The D3V Travel Bag features two luggage straps in addition to the high-quality shoulder straps. This allows the backpack to be securely fastened to the telescopic handles and sit atop most modern suitcases. The front pocket zips shut and is ideal for storing items that need to be within easy reach during travel. The backpack is completed with bottle holders on either side of the main compartments, and its overall dimensions comply with IATA's 2026 recommendations for carry-on luggage.
specs: |-
  - Water resistant, carry-on compatible, 34 L backpack, designed to safely and efficiently transport the D3V
  - Additional compartments for studio essentials such as laptops, controllers, audio interfaces, headphones and cables
  - Removable hardshell inlay so the backpack can be used for any kind of travel
  - Substantial padding for comfort while wearing, and additional straps to attach the backpack to suitcases
  - Weight: 3.3 lbs (1.5 kg)
  - Total Volume: 34 L
  - Material Travel Bag: Polyester 80 %, Polyurethane 12 %, Nylon 5 %, Zinc Alloy 3 %
  - Material Inlay: Cardboard 63 %, MDF 15 %, Adhesive (Type 477) 11 %, Polyester 6 %, Nylon 4 %, Polyurethane 1 %
  - External Dimensions (Height x Width x Depth): 50 cm x 38 cm x 18 cm
  - Delivery Contents: D3V Travel Bag with cushioned inlay
