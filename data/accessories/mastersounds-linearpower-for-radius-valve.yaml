  especially at lower frequencies. Output voltage can be preset to 15V, 18V, or
  21V with over-temperature, short-circuit, and overvoltage protection.
details: |-
  If you want the ultimate performance from your MasterSounds mixer, you need LinearPOWER. As standard, we supply a compact switch-mode power supply with each mixer we sell, which is great and can be used anywhere in the world, but LinearPOWER has been designed specifically for our DJ mixers and enables the finest fidelity which can be heard, especially on the lower tones of the audio spectrum. The power supply features a hybrid discrete regulator design, controlled by a very accurate IC voltage reference and feedback loop. The output voltage can be pre-set to 15V, 18V, or 21V, with other custom voltages available by request. Output current is rated at 1amp continuous, but the supply can deliver more than double this for short periods. With a compact toroidal transformer and high-quality capacitors used throughout, long life and continued high performance are ensured. The power supply is protected against over-temperature and short circuit events, but crucially it also includes overvoltage protection to prevent damage to any connected devices. The unit is housed in a smart in-house designed steel chassis, with an illuminated power switch and a light-piped bi-colour LED to indicate status (green = good, red = fault). *Please note - orders outside the UK do not have VAT applied, but will be subject to local import taxes on delivery*
