details: |-
  Get serious and mount Cascadia in your studio or travel rack. The right side has a small cubby hole compartment with slots for 1/4" cable pass-thru to the top of Cascadia and the rear of the rack. (Cascadia not included)

  6U Tall, with clearance for cables and a cubby on the right for 1/4″ patch cables, an effects pedal, or anything else you can fit in there.

  Includes mounting hardware.

  Compatible with the center mount points (of each U) on a universal standard rail. Mounting will be offset on rails with MIL SRD 189 Spacing (0.5U space above and below so total space used is 7U instead of 6U).
specs: |-
  - 6U tall
  - Includes mounting hardware
  - Compatible with center mount points on a universal standard rail
  - MIL SRD 189 spacing: 0.5U offset above and below (7U total space used)
