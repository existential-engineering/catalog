name: TYPE 07 Front-Firing Mount Bundle
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/t07-front-firing-mount-bundle
description: A HEDD ceiling-mount bundle for forward-facing installation of a
  TYPE 07 monitor, pairing an M07 mounting adapter, a V120 L-Bracket, and a V120
  isolator for 360° rotation and up to 45° of adjustable tilt.
details: |-
  This bundle is a one-stop solution for wall and ceiling mounting requirements, specifically designed and made by industry-leading specialist IsoAcoustics for HEDD. It offers everything you need to connect a TYPE 07 monitor to the ceiling in a forward-facing configuration, and consists of an M07 mounting adapter, a V120 L-Bracket, and a V120 isolator.

  The mount features 360° rotation and up to 45° of adjustable tilt, with the L-Bracket designed for forward-facing applications. It uses patented IsoAcoustics isolation for improved stereo image and comes with all necessary hardware.

  Compatible with TYPE 07, TYPE 07 MK2, and A-CORE models. Monitor sold separately; the monitor needs to be prepared with mounting screw holes by HEDD or a certified service partner. Wall mounting requires an additional IsoAcoustics Wall Mount purchase.
specs: |-
  - Contents: 1x M07 mounting adapter, 1x V120 L-Bracket, 1x V120 isolator
  - 360° rotation and up to 45° of adjustable tilt
  - Patented IsoAcoustics isolation technology
  - Weight: 2.11kg
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with TYPE 07, TYPE 07 MK2, and A-CORE models
  - Monitor sold separately; requires mounting screw holes prepared by HEDD or a certified service partner
