description: A stereo link cable built on newly developed small 1/4-inch stereo
  plugs with 17 mm caps, for connecting expression pedals to effects units or
  carrying MIDI signals inside a pedalboard.
details: |-
  In recent years the downsizing and lightening of effects pedalboards has moved quickly, and Free The Tone has been working on shrinking the plugs used for its cables. A stereo plug has one more terminal than a mono plug and is harder to miniaturize, but a new approach to the structure made it possible, and the CB-5028 STEREO LINK CABLE is the result of using those small stereo plugs.

  Shrinking the plug meant reviewing the structure of the soldered terminals that join the cable to the plug. The whole cable and soldering section is now covered with resin, and the structure holding the cable was changed significantly. Because resin fills the space between the terminals, the joint is effectively insulated, and because resin sits between the cap and the cable, the assembly resists deformation when the cable is pulled, which makes it durable.

  The newly developed plug cap is 17 mm long. The cap on the stereo plug used in Free The Tone's CB-6560 cable is 33 mm, so this one is about half the length. Making the cap a pressed-on type also guards against it working loose.

  Both straight and L-angle plug types are offered. The straight plug is easy to insert and remove despite its size and suits places where cables are plugged and unplugged often; it carries Free The Tone's wave-shaped groove as an anti-slip feature. The L-angle type suits tight spots inside a pedalboard.

  The cable is a two-core construction, 28 strands of 0.10 mm OFC per conductor with a 0.55 mm conductor diameter, 0.375 mm insulation and a 1 mm jacket, 5 mm in overall diameter, terminated in 1/4-inch stereo standard phone plugs. It can be used for connecting expression pedals to effects units or for transmitting and receiving MIDI signals.
specs: |-
  - Plug: 1/4-inch stereo standard phone plug
  - Number of cores: 2
  - Conductor diameter: 0.55 mm
  - Construction: 28/0.10 OFC (no/mm)
  - Insulation thickness: 0.375 mm
  - Jacket thickness: 1 mm
  - Overall diameter: 5 mm
  - Plug cap length 17 mm, about half the 33 mm cap used on the CB-6560 cable
  - Pressed-on cap, with soldered terminals resin-coated for durability
  - Straight and L-angle plug types available
  - Available as S/S, S/L and L/L in 30 cm, 50 cm and 80 cm lengths
  - Suitable for expression pedal connections and for MIDI signals
