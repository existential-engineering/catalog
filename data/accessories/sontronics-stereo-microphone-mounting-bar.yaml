details: |-
  Adjustable Stereo Microphone Mounting Bar

  The Sontronics adjustable stereo microphone mounting bar is designed specifically to hold 2 pencil microphones, allowing for a vareity of stereo recording techniques, including: AB, XY, ORTF ( Office de Radiodiffusion Télévision Française) , NOS ( Nederlandse Omroep Stichting) and DIN. The mounting bar is finished in sleek black, with silver chrome thumb screws, providing both a durable and professional aesthetic to compliment your stereo recording setup. Each microphone holder mount is fitted with a 5/8". A thread adapter can be used for use with 3/8" mounts. The bar is designed with oversized, high-torque thumbscrews, allowing for tighter clamping force and more exact mic positioning - perfect for demanding studio sessions or rugged live environments. IDEAL FOR

