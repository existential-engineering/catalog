  Shock Mount for DELTA 2 and SIGMA 2

  The Sontronics DELTA 2 and SIGMA 2 shock mount is designed to provide secure, stable support for your microphone, ensuring optimal performance whether in the studio or on stage. Built with an adjustable locking mechanism, it allows for precise positioning, making it easy to capture the perfect sound. Crafted in the UK with a sleek black finish, this shock mount is the ideal companion for high-SPL sources like guitar amps, saxophones, and brass instruments, just as the Delta 2 microphone itself excels in handling powerful signals without distortion. Microphone not included.
