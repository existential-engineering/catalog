description: The Canvas Power HP Plus is a perfect power solution for hybrid
  rigs running pedals, modelers, and/or multi-effect pedals allowing you to
  power the thirstiest of pedals with two, 3A (three Amp, or 3,000mA) outputs.
details: "The Canvas Power HP Plus is a perfect power solution for hybrid rigs
  running pedals, modelers, and/or multi-effect pedals allowing you to power the
  thirstiest of pedals with two, 3A (three Amp, or 3,000mA) outputs. The HP Plus
  also has 7 isolated power outputs delivering up to 500mA of clean power at 9V
  and a 9/12/18V variable output. The 3A outputs can switch between 9V and 12V
  to power high-voltage pedals. Canvas Power HP Plus brings simplicity and
  modularity to powering your modeler, multi-effect unit, or high-powered
  pedals. Boasting two ports delivering up to 3A each, and up to 500mA in seven
  ports of silent, isolated, and clean 9V power, the HP Plus is perfect for
  hybrid rigs using pedals and modelers like the Quad Cortex, HX Series, and
  many more. The Canvas Power series is built using modern switch mode supply
  architectures. This means each output is isolated, highly efficient, and
  heavily filtered ensuring they supply plenty of power with incredibly low
  noise. The Power HP Plus is available for purchase as a standalone power
  supply or as a linkable unit to another supply via a 24V power link, allowing
  Canvas Power to grow with your power needs without adding another cable you
  need to plug into the wall. Note: to purchase a Canvas Power HP Plus Link,
  select the Link option under Power Supply Type AND 24v Link Cable option under
  the Power Source option before adding to your cart. The super slim 1.2 inch
  design allows Canvas Power Supplies to fit under nearly any pedalboard, and
  the included universal mounting brackets mean you don’t have to worry about
  your power supply staying put when you’re hustling to your next gig. The
  onboard LED power meter lets you clearly see how much power is being consumed,
  and each output has its own LED indicator letting you know when it’s sending
  power. We’ve also developed custom 2.1mm barrel cables with a 90-degree plug
  on one end, and our all-new super short straight plug on the other, giving you
  the maximum flexibility for fitting these power supplies into tight spaces. Of
  course, they all accept standard 2.1mm barrel cables as well, but they won’t
  be nearly as cool. Canvas Power HP Plus Details The Canvas Power HP Plus has 7
  isolated power outputs delivering up to 500mA of clean power at 9v, and two 3A
  isolated outputs with selectable 9 or 12V. Assorted 2.1mm and 2.5mm reverse
  and standard polarity cables are also included. See below for specifics.
  What’s in the Box?"
