  design.
details: |-
  Interchangeable color grids compatible with Amphion 12" loudspeaker models including the
  Helium510. Available in eight pre-selected RAL colors: Heather Violet (RAL 4003),
  Traffic Red (RAL 3020), Turquoise Blue (RAL 5018), Yellow-Green (RAL 6018),
  Sulfur Yellow (RAL 1016), Beige-Brown (RAL 1001), Sky Blue (RAL 5015), and
  Stone Grey (RAL 7030). Custom colors available on request. Sold per piece.
