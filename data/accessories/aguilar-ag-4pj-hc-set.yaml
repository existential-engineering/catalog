description: The Aguilar AG 4 P/J-HC's are well-balanced pickup sets that provide a flexible array of tones, whether using each pickup alone or in combination. Now you can get the thunderous lows of the neck pickup or the midrange cut of the bridge – or both – without 60 cycle hum.
details: |-
  The Aguilar AG 4 P/J-HC's are well-balanced pickup sets that provide a flexible array of tones, whether using each pickup alone or in combination.

  Now you can get the thunderous lows of the neck pickup or the midrange cut of the bridge – or both – without 60 cycle hum. The AG 4 P/J-HC set are a direct replacement for Fender P-Bass and Jazz bridge pickups.
specs: |-
  - 4P Wire: Heavy Formvar, 42 gauge
  - 4J-HC Wire: 42 gauge, Formvar
  - Magnets: Alnico V
  - 4P Leads: Single conductor, Teflon coated
  - 4J-HC Leads: Single conductor, heat resistant Teflon coated
