details: |-
  A KADI interconnect cable, wired 15 pin high density D plug to 15 pin high density D plug.

  It connects the KADI port of a Pro-KADI, Pro-2000 or Pro-4 converter to any instrument that has been fitted with a KADI socket.

  The cable is included at no extra cost with a Pro-KADI or with the optional KADI port on a Pro-2000, unless a Wasp cable is specified instead when ordering. It was never supplied with a Pro-4, so a Pro-4 owner needs it separately.
specs: |-
  - 15 pin high density D plug to 15 pin high density D plug
  - Compatible converters: Pro-KADI, Pro-2000, Pro-4
  - Connects to equipment fitted with a KADI socket
