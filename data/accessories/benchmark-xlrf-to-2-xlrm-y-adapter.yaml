description: A hand-assembled Y-adapter cable splitting one XLR female input
  into two XLR male outputs, built in the USA with Flexygy FLEX2T2 cable,
  Neutrik gold-contact connectors, and silver solder.
details: |-
  The Benchmark XLRF to 2 XLRM Y-Adapter takes a single XLR female input and splits the signal to two XLR male outputs. Each adapter is hand assembled in the USA using true silver solder and gold-contact Neutrik premium connectors, ensuring reliable signal integrity and long-term durability.

  The cable uses Flexygy FLEX2T2 microphone/audio line cable with 24 AWG, 19-strand copper conductors and a high-density (>95%) tinned copper spiral braid shield for excellent RF interference rejection. The special TPE insulation remains flexible even in extreme cold, making this adapter suitable for demanding studio and live environments.

  Common applications include driving multiple power amplifiers or subwoofers from a single preamp or DAC output. Sold individually; order two for a stereo pair.
specs: |-
  - Connectors: XLR-Female input, dual XLR-Male outputs, Neutrik gold-contact premium series
  - Length: 11 inches
  - Cable: Flexygy FLEX2T2 microphone/audio line cable
  - Conductors: 24 AWG, 19-strand copper x 2
  - Shielding: High-density (>95%) tinned copper spiral braid
  - Insulation: Special TPE (flexible in extreme cold)
  - Conductor DC resistance: 23.2 Ohms/1000 ft
  - Shield DC resistance: 11.5 Ohms/1000 ft
  - Nominal capacitance: 22.15 pF/ft
  - Nominal impedance: 69 Ohms
  - Solder: True silver solder
  - Assembly: Hand assembled in USA
