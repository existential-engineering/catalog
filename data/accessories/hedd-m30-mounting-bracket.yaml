description: A HEDD steel U-bracket that secures the TYPE 30 monitor to the
  IsoAcoustics V120 isolation mount, offering 360-degree rotation and 90-degree
  tilt for immersive ceiling installations.
details: |-
  The M30 mounting bracket is a steel U-bracket designed to secure HEDD TYPE 30 monitors to IsoAcoustics' patented V120 isolation mounting system. It requires no adapter and no modifications to the speaker itself.

  The bracket enables 360-degree rotation and 90-degree tilt adjustment, meeting the demands of immersive setups in professional studio environments. It was developed collaboratively between HEDD Audio and IsoAcoustics, whose V120 isolation technology mitigates vibration transfer into supporting structures and cavities to reduce unwanted resonance and improve audio accuracy during Dolby Atmos and immersive production.

  The bracket accommodates quick installation while adapting to various mounting configurations typical in professional studios, including truss and unistrut channel assemblies.
specs: |-
  - Compatibility: TYPE 30 models; IsoAcoustics V120 mounting system
  - Adjustment: 360 degrees rotation, 90 degrees tilt
  - Material: steel
  - Dimensions: 615 x 395 x 117 mm (24.2" x 15.5" x 4.6")
  - Weight: 4.3 kg (9.4 lbs)
  - Warranty: 2 years (IsoAcoustics), 5 years when purchased from HEDD Audio
