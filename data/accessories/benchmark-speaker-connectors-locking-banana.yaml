details: |-
  The Benchmark Speaker Connector Locking Banana is an 8mm gold-plated locking banana plug designed for high-quality speaker wire termination. The barrel-twist locking mechanism expands the plug inside the binding post socket, ensuring a secure, low-resistance electrical connection that outperforms traditional spade lugs in Benchmark's own testing.

  The connector accepts 10 AWG to 4 AWG speaker wire and can be terminated via set screws or soldering. A removable insert accommodates different cable entrance configurations, and the design is compatible with Techflex sleeving for a professional cable finish.

  These are the same connectors used on Benchmark's own Studio & Stage speaker cables. Sold individually; purchase two for a pair or four for a full set of speaker connections.
specs: |-
