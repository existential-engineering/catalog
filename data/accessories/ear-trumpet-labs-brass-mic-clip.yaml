details: |-
  The Brass Mic Clip is an all-metal clip for Ear Trumpet Labs microphones, made to hold a microphone with style, precision, and peace of mind. It is meticulously handcrafted, with a solid brass ball hinge, spring, and wing nut that give a secure, adjustable clamp design suited to all microphone configurations.

  With over 180 degrees of pivot, the clip mounts easily to standard mic stand threads and works with both straight and boom stands. A cork lining holds the microphone in place without marring it, and the clip fits every Ear Trumpet Labs microphone.

  The brass design is intended to harmonize with the look of Ear Trumpet Labs microphones, and each clip is handcrafted by the Ear Trumpet Labs artisans.
specs: |-
  - Solid brass ball hinge and all-metal construction for durability and flexibility
  - An elegant brass design that harmonizes with Ear Trumpet Labs microphones
  - Mounts to standard mic stand threads, compatible with straight and boom stands
  - Over 180 degrees of pivot for precise positioning
  - Cork lining for a secure grip without marring
  - Universal fit for all Ear Trumpet Labs microphones
  - Handcrafted by the Ear Trumpet Labs artisans
