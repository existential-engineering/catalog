details: |-
  Erica Synths wanted to organize the patch cables that were hanging on all possible objects in the Lab, so these patch cable holders were made.

  The rigid 2mm powder coated aluminium cable holders can host over 100 patch cables in perfect order.

  Patch cable holders come in two sizes, 205mm and 305mm wide. Holder gaps are 4mm wide, and two screws for fixing the holder are included.
