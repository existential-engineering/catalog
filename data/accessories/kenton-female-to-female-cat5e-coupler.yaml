description: Female to female CAT5E coupler, used to join two CAT5 cables
  together for a longer run.
details: |-
  A CAT5E coupler with a female RJ45 socket at each end. It joins two CAT5 cables so that a single run can be extended beyond the length of the cables on hand.

  The coupler is a passive pass-through and performs no conversion or signal processing, so it suits extending a CAT5 run between MIDI line drivers or other CAT5 connected equipment.
specs: |-
  - Female to female RJ45
  - CAT5E rated
  - Joins two CAT5 cables for a longer run
