description: Top plate for the CDJ-800
details: |-
  Complementing our DJ decks and effectors,  these solid plates and brackets incorporate a weighted balanced design with a durable  powder-coated finish.

  Product longevity and space within the DJ  booth is maximised by the tailored fit each stand gives to its partnering product.

  Each plate features anti-vibration pads, six fixing holes with supplied screws as well  as height and angle adjustment.

  Other design touches include cable management through the stem of  the bracket and space for heat dissipation.

  * Plates and bracket are sold separately.
