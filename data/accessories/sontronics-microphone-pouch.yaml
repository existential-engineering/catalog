details: |-
  Microphone Pouch

  This leather-look, zip-up pouch is perfect for keeping your microphone clean and protected. Whether you're transporting your gear from gig to gig or storing mics in the studio between sessions, the lightly padded design ensures your microphone stays safe. The pouch is sized to fit the Solo handheld dynamic mic, as well as our STC-2, STC-20, and STC-3X condenser microphones. It can also accommodate our Podcast Pro mic. Additionally, it's great for carrying smaller 'pencil' mics like the STC-1 and STC-10 condensers, or the DM-1S and DM-1T snare and tom mics.
