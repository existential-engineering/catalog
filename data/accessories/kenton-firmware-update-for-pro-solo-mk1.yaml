description: A replacement EPROM chip carrying the latest firmware for the Pro
  Solo mkI MIDI to CV converter. The unit cannot be re-flashed, so the chip has
  to be swapped to upgrade it.
details: |-
  A firmware upgrade for the Pro Solo mkI, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip. The mkI was replaced by the mkII in March 2005, and a mkI cannot be converted into a mkII.

  To read the installed revision, both the Inc and Dec buttons are held while the unit is turned on. The display then cycles through four groups of two numbers, so K1CV4300.087 reads as 43 00 00 87.

  The firmware history runs from K1CV4300.014 in June 1997 to K1CV4300.087 in January 2003. Additions over that span include auto sync and a new wavetable so the triangle LFO syncs at the top of the wave rather than the middle, a 128 note CV range with the auxiliary output able to produce an ARP 2600 trigger signal, recognition of all notes off and of reset all controllers, and two new clock divide ratios where d2 gives 24 clocks per quarter note and d4 gives 48, which allows a LinnDrum to be synced.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: K1CV4300.087, dated 22/01/2003
  - Firmware revision reported by holding Inc and Dec at power on, as four groups of two digits
  - Pro Solo mkI was replaced by the mkII in March 2005 and cannot be upgraded to it
