description: Protective case for Numark Mixtrack series DJ controllers.
  Clamshell design with a padded, foam-lined interior and a slot for headphones
  and cables.
details: |-
  Safely carry your Numark controller in a light, durable case! The Mixtrack Case is a perfect fit for almost all of Numark's Mixtrack DJ controllers. Its clamshell design gives you quick access to your controller to and from your gig.

  Made from a strong, lightweight composite resin material, the Case has a padded interior lined with foam that keeps your valuable controller from moving around during transport. There's also a slot inside the case to store your headphones and cables.

  No damaged knobs, no scratches!

  Mixtrack Case fits: Mixtrack 3, Mixtrack Pro 3, and Mixtrack Platinum.

  At your gig, place your controller on top of the Mixtrack Case to elevate it for better posture and performance. It also fits easily in an overhead compartment when traveling by air, so your controller is never out of your sight.
specs: |-
  - Clamshell design for quick access
  - Strong, lightweight composite resin material
  - Padded interior lined with foam
  - Internal slot for headphones and cables
  - Fits Mixtrack 3, Mixtrack Pro 3, and Mixtrack Platinum
  - Can be used as a controller riser at gigs
  - Fits in airplane overhead compartments
