description: A socket upgrade kit for the Moog Prodigy, adding 3.5mm mono jack
  sockets so the synthesiser can be driven from a MIDI to CV converter.
  Available as a one socket filter kit for late models or a three socket CV,
  gate and filter kit for early models.
details: |-
  A socket upgrade kit for the Moog Prodigy, fitting 3.5mm mono jack sockets to the instrument so that an external MIDI to CV converter can drive it. The kit itself adds connectors only and performs no conversion, so a converter such as the Pro-Solo mkII, USB-Solo or Pro-2000 mkII is still needed.

  The one socket version adds a filter socket to late model Prodigys, which already carry suitable CV (osc) and gate (S-trig) inputs. The extra socket puts the cutoff frequency of the low pass filter under voltage control, driven from an auxiliary output of a converter, so cutoff can follow any continuous controller or another MIDI message such as aftertouch or velocity.

  The three socket version suits early models that lack the osc and S-trig inputs found on later ones. It adds CV for volt per octave control of oscillator frequency, gate to control when notes play (0V for note off, above 3V for note on), and filter for cutoff frequency from a converter's auxiliary output.

  Fitted with a suitable converter, the three socket kit gives note control over at least five octaves (a limit set by the synthesiser rather than by the kit or converter), pitchbend with a range set in the converter, modulation from the converter's internal LFO with speed and waveshape changeable in real time, portamento with a real-time rate, filter cutoff from any continuous controller, aftertouch or velocity, low, high or recent note priority, and single or multiple note trigger modes.

  Each kit contains all the necessary components along with diagrams for connecting the wires and components and for mounting the jack sockets. The 2 pin Cinch-Jones connector used for the S-trig input can be supplied separately, either as a bare plug or as a made-up lead. Fitting a socket upgrade kit is a skilled job and should be undertaken by a competent synth service engineer, or carried out at the manufacturer's premises in Tadworth, just outside London.
specs: |-
  - Fits the Moog Prodigy
  - One socket version: filter socket only, for late models that already have osc and S-trig inputs
  - Three socket version: CV, gate and filter sockets, for early models without osc and S-trig inputs
  - Sockets are 3.5mm mono jacks
  - CV input: volt per octave control of oscillator frequency
  - Gate input: 0V note off, above 3V note on
  - Filter input: low pass filter cutoff frequency, driven from a converter auxiliary output
  - Requires a separate MIDI to CV converter such as the Pro-Solo mkII, USB-Solo or Pro-2000 mkII
  - Kit includes components, wiring diagrams and socket mounting instructions
  - 2 pin Cinch-Jones S-trig connector available separately as a plug or a made-up lead
