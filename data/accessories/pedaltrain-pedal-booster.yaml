details: |-
  About Pedaltrain Pedal Boosters

  Sometimes you just need a little boost! For example, on the front row you have an unusually tall pedal, and a short one right behind it. Reaching that foot switch can be a precarious toe-tap balancing act. Enter the Pedaltrain Pedal Booster.

  These handy little wedges will get the business end of your short pedal up a full one inch allowing easy access.

  Available in three widths to accommodate virtually any custom configuration. They can be fastened with the included Hook-and-loop with adhesive backing, or for a more permanent application use the provided screws. Folded steel construction, durable powder coat finish.

  Specifications

