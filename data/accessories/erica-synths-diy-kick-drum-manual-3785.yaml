description: Illustrated book that teaches analog kick drum design.
details: |-
  This illustrated guide walks a reader through designing an analog kick drum circuit from scratch, starting with a simple five-component bridged-t oscillator and building up to a fully featured percussion voice.

  Each chapter introduces a new functional block, moving from variable decay and pitch envelope through to distortion and CV control. Every step includes detailed schematics and a breadboard layout, so each addition can be tested as it is added and the circuit can be heard as it evolves.

  The book is based on the original manual for the Erica Synths EDU DIY Kick Drum kit and takes it further with hands-on design challenges that encourage experimentation, patch examples, a structured troubleshooting guide, notes on production-ready module design, and post-assembly modifications. It is a tool for understanding, refining and extending the circuit rather than only building it.

  Patch examples cover emulating TR-606, TR-808 and TR-909 kick sounds, and three simple post-assembly modifications tailor the decay range, distortion intensity and pitch range.

  The guide can be followed on LABOR, the Erica Synths circuit prototyping board, or on a standard breadboard with a dual power supply or two 9V batteries. Components can be bought as part of the EDU DIY Kick Drum kit or sourced individually. The printed breadboard layouts are drawn for LABOR, so a standard breadboard calls for adapting the layouts and providing signal sources and output amplification.
specs: |-
  - Circuit design walkthrough with schematics, breadboard layouts and browser-based circuit simulations
  - Design challenges for experimenting with component values
  - Notes on turning the breadboarded circuit into a production-ready module
  - Detailed assembly guide for the EDU DIY Kick Drum module
  - Step-by-step troubleshooting guide using on-board test points
  - Patch examples for TR-606, TR-808 and TR-909 kick sounds
  - Three post-assembly modifications for decay range, distortion intensity and pitch range
  - Requires LABOR or a standard breadboard with a dual power supply or two 9V batteries
