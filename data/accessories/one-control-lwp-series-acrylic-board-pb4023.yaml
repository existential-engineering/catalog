  Shipping charges are NOT INCLUDED at the time of order. Shipping costs will be calculated after your order has been confirmed and will be communicated to you later. Please note that shipping costs are not stated when ordering. Acrylic Pedal Board is a pedalboard using 5mm thick and sturdy acrylic board. If you artfully assemble a board that uses about 3 to 5 effects, you will be able to create your own various sounds and scenes, even in a small size. However, with a small board, it can be surprisingly difficult to handle. So, I made a small pedal board holes that can be used as a handle on the left and right. It is the best size for installing about 3 to 5 effects and 3 foot switches. Because the board itself is small, if you attach a handle there will be restrictions on the placement of the pedals. By making a handle on the board, it makes it easy to put a pedal on the handle when you want to add an extra effect. ・Pedal board
