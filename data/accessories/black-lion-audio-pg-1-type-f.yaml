description: Studio-grade power conditioner and surge protector (Schuko outlets)
details: |-
  The PG-1 Type F is a 1U rackmount power conditioner for international (230V) studio use, featuring eight Type F (Schuko) outlets. It uses PG-99 Filtering Technology with premium Panasonic and Wima capacitors, filtering an average of 99.7% of noise. Outlets are organized into Digital Audio, Analog Audio, and High Current groups on the rear (6 switched), plus 2 unswitched filtered convenience outlets on the front. The High Current outlets feature smart time-delayed sequencing so speakers power on last and off first, preventing audio pop. Surge protection is rated at 2775 joules. The front panel includes an LED voltmeter and status indicators for grounding, polarity, noise filtering, abnormal voltage, and surge protection, plus an audio alarm for unsafe voltage conditions.
specs: |-
  - Form Factor: 1U Rackmount
  - Power Input: Fixed Type F (Schuko) cable, 230V AC
  - Rear Outlets: 6 × Type F (switched, filtered)
  - Front Outlets: 2 × Type F (unswitched convenience)
  - Outlet Groups: Digital Audio (x2), Analog Audio (x2), High Current (x2)
  - Surge Protection: 2775 joules
  - Noise Filtering: 99.7% (PG-99 Filtering Technology)
  - Sequencer: Yes (High Current outlets time-delayed)
  - Display: LED voltmeter with status indicators
  - Height: 1.7"
  - Width: 19"
  - Depth: 9.8"
  - Weight: 10.6 lbs
