details: |-
  Professional-grade Replacement Tour Case with Wheels for Pedaltrain Classic PRO, Pedaltrain Novo 32, and Pedaltrain PT-PRO, engineered to be up to 35% lighter than previous models.

  This case accommodates several board sizes (Classic PRO, Novo 32, PT-PRO). Novo 32 will have extra room for storage of cables, accessories, etc. In either case, your Pedaltrain will be secure and protected.

  Case is designed to accommodate unmodified Pedaltrain pedal boards. Modifications like large raised feet, large handles, protruding in/out panels, and various custom accessories may not fit in the case. If you have modified your Pedaltrain, or have questions about sizing, please email us before purchase. We’d be happy to advise you.

  *CASE ONLY - pedal board and accessories not included

