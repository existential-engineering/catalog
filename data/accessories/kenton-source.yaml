description: Single socket upgrade kit that fits a filter control input to the
  Moog Source, so the cutoff frequency of the synthesiser's low pass filter can
  be voltage controlled from the aux output of a Kenton MIDI to CV converter.
details: |-
  A single socket upgrade kit for the Moog Source. The synthesiser already carries suitable CV (oscillator) and Gate (S-trig) input sockets, so only a filter input needs adding.

  The added socket allows the cutoff frequency of the synthesiser's low pass filter to be voltage controlled, for example from the aux output of a MIDI to CV converter such as the Pro-Solo mkII, USB-Solo or Pro-2000 mkII. Filter cutoff can then be driven from any continuous controller message, or from aftertouch or velocity.

  The kit supplies the components and the diagrams for wiring them and mounting the 3.5mm mono jack socket. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Adds one 3.5mm mono jack filter input socket
  - For the Moog Source, which already has CV (oscillator) and S-trig Gate inputs
  - Filter cutoff controllable from a continuous controller, aftertouch or velocity via a converter aux output
  - Kit supplies all necessary components plus wiring and mounting diagrams
  - Passive socket kit, so it has no power connection of its own
