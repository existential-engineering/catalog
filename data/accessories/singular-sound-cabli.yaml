details: |-
  Cabli is the cheat code for wrapping and organizing instrument cables. The dual action coiling mechanism winds both ends of your cable at once, finishing the job in seconds flat. Eliminate excess cable slack. Decrease setup and breakdown time for your live gigs. No more tripping over long cables on-stage or in your practice space. Cabli allows you to pull the exact amount of slack you want, leaving the rest of the cord safe in the device. Supreme portability, efficiency and protection make Cabli the last word in guitar cable storage. We designed the Cabli with guidance from professional cable manufacturers to ensure optimal detangling and pitch-preventing mechanics. Establish a peerless cable management system that's built to augment your setup. The Cabli takes all your favorite guitar cables and cords: 1/4", XLRs, MIDI, right-angle cables, SpeakOn, and more. A built-in pinch preventer makes kinked cables a thing of the past. Constructed from durable, nimble ABS material, Cabli is sturdy enough to survive the whole tour and last through your musical career. Orders of 4 or more units come with a free Cabli storage bag.
