description: Adds a filter control socket to the Yamaha CS-15, so the cutoff
  frequency of the low pass filters of both voices can be voltage controlled
  from the auxiliary output of a MIDI to CV converter.
details: |-
  A one socket upgrade kit for the Yamaha CS-15 that adds a filter control socket. The synthesiser already has suitable CV (Hz/V) and Gate (S-Trig) sockets, so those do not need to be added.

  The extra socket lets the cutoff frequency of the low pass filters of both voices be voltage controlled, typically from the auxiliary output of a MIDI to CV converter such as the Pro-Solo mkII, Pro-USB or Pro-2000 mkII. Filter cutoff can then be driven from any continuous controller, or from other MIDI messages such as aftertouch or velocity.

  For a complete connection, the CS-15's CV (Hz/V) input goes to the CV output of the converter with Hz/V scaling selected in the converter menu, and the S-Trig input goes to the Gate output of the converter with S-Trig and 5V pullup selected. The filter input goes to the auxiliary output of the converter, controlled by CC#16 by default. A Solo converter has one CV and one Gate output, so driving both oscillators and both envelope generators needs a jack splitter lead on each; with a Pro-2000, output channel A can drive VCO1 and EG1 and channel B VCO2 and EG2, with A and B set to the same MIDI channel.

  The kit contains the components, the 3.5mm mono jack socket and diagrams for connecting the wires and components. Fitting is a job for a competent synthesiser service engineer.
specs: |-
  - Adds one socket: low pass filter cutoff control for both voices
  - For the Yamaha CS-15, which already has CV (Hz/V) and Gate (S-Trig) sockets
  - Input is on a 3.5mm mono jack socket
  - Filter input is driven from the auxiliary output of the converter
  - Filter cutoff is controlled by CC#16 by default
  - Requires Hz/V scaling and S-Trig with 5V pullup selected in the converter
  - The kit adds a socket only and has no power input of its own
