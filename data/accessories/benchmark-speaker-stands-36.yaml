  management and ballast fill. Sold as a pair.
details: |-
  These 36-inch speaker stands are engineered specifically for the Benchmark SMS1 studio monitors and feature sonic isolation and decoupling at every contact point. The column is black-anodized extruded aluminum with three internal channels for cable management and weight ballast fill. The base is cast aluminum with spike feet and removable rubber isolators to accommodate hard floors or carpeted surfaces.

  Isolated speaker pads made of high-density non-slip acoustic foam sit atop the 12 x 10.25 inch top plate, decoupling the monitor from the stand structure. The 19-inch diameter base provides a wide stability footprint. Each stand supports up to 75 lbs.

  The internal channels accommodate both signal cable routing and sand or shot ballast fill for added mass and resonance damping. Stands are sold as a matched pair.
specs: |-
  - Height: 36 inches (914 mm)
  - Top plate: 12 x 10.25 inches (305 x 260 mm)
  - Base diameter: 19 inches (483 mm)
  - Load capacity: 75 lbs (34 kg) per stand
  - Stand weight: 12.2 lbs (5.5 kg) each
  - Column: Black-anodized extruded aluminum with 3 internal channels
  - Base: Cast aluminum with spike feet and removable rubber isolators
  - Speaker pads: High-density non-slip acoustic foam
  - Compatible with Benchmark SMS1 monitors
  - Sold as a pair
  - Color: Black
