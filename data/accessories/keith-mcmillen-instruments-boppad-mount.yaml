details: |-
  The BopPad Mount connects to a cymbal stand, providing a way to incorporate the BopPad drum pad controller into a drum kit. It is a mounting bracket only and carries no ports of its own.

  The frame is anodized aluminum, which keeps the mount both lightweight and rugged. The M8 thread is compatible with most cymbal stands currently available.
specs: |-
  - - Cymbal-stand mount for the BopPad drum pad controller
  - - Anodized aluminum frame
  - - M8 thread, compatible with most cymbal stands
