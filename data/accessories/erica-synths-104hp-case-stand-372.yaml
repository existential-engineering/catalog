description: A black wooden stand for your 104HP wide (one or two row) eurorack case
details: |-
  The 104HP Case Stand is a black wooden stand made for 104HP wide eurorack cases, in either the one row or the two row format.

  It is meant for studio and live use alike, holding the case at an angle so that patching and performing are more convenient and the panel sits at a different viewing angle.

  The stand is a passive wooden frame with no electronics and no connectors of its own, so it carries whatever case is placed on it without taking part in the signal path.
