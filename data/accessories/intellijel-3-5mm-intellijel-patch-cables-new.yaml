description: Follow the Rainbow—or Not! Legend has it there's a pot of gold at
  the end of every rainbow. Our cables are coloured by length or available in
  white and grey (available for all lengths) for marking stereo signals, or
  going monochrome. We don't know if every patch you create will be gold, but
  we're happy to provide you with the rainbow.
details: |-
  Complex patches are much easier to manage with Intellijel's custom molded housing that is thin (8mm diameter) and short (19mm tall + 5mm strain relief), making it easy to pull and plug these cables in a busy patch. A wide variety of lengths also makes it easy to manage any tangle. They also have the intellijel wordmark and robot embossed on the sides.

  All of the coloured cables are coloured by length, but each length is also available in white and grey for marking stereo signals or going monochrome.

  Sold in packs of four, one length and colour per pack.
specs: |-
  - Custom molded housing: 8mm diameter, 19mm tall + 5mm strain relief
  - Lengths: 10cm (red), 15cm (green), 30cm (blue), 45cm (yellow), 60cm (orange), 90cm (purple)
  - Also available in white or grey for all lengths
  - Sold in packs of 4 (single length + colour per pack)
  - 3.5mm (1/8-inch) mini-jack connectors
