details: |-
  The 4J-60 pickup, but over-wound with larger 6mm pole pieces for hotter output and fatter lows, for 5-string bass. Larger 6mm magnets and over-wound design give this pickup big personality – with an edge. Thick lows and a growly midrange character define the sound of the HOT series, all while capturing the dynamics and nuances of your playing. The AG 5J-Hot pickup set is a direct replacement in the Fender Jazz V and many other 5 string Jazz Basses.
