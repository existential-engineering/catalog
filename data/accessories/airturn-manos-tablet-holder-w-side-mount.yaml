details: |-
  Hold anything from a smartphone to an iPad Pro, with or without a case! ***Includes side mount clamp for accessories or when using a microphone.***

  Featuring a rugged heavy-duty design, the MANOS universal tablet mount holds smartphones and tablets from 5" to 13.3" with or without a protective casing. It displays your device without obstruction, easily rotates between portrait and landscape, fits a standard 5/8-27 mic thread, and lays flat to fit in your gig bag or backpack. Use the Side Mount Clamp to attach to mic stands, poles, railings, and more! Product Weight: 1 lb 1oz (.48 kg)

  Product Dimensions: 13x5x3 in (330x127x76mm)

  Download PDF | Product Manual

  *NOTE: microphone & mic stand sold separately. Extendibility

  CLEAR WORKSPACE: The AirTurn Desktop Clamp offers a convenient solution by allowing the user to mount their tablet to the side of most tabletops, creating a clear workspace. MIC MOUNTING: The classic AirTurn Side Mount Clamp Extended allows the display of lyrics/slides conveniently in view with room for extra extension away from the mic stand. STAND EXTENSION: The AirTurn goSTAND and BOOM offer greater accessibility when reading or watching from a bed or recliner. Best Tablet Holder for Page Turning and Performance

  Many performers find ease in storing digital sheet music, lyrics, notation, or tabs on their tablet or phone. Other performers use their tablets to control audio, lighting, back tracks, metronomes, and more! With the MANOS Universal Tablet Holder, you can mount your tablet or phone almost anywhere. Probably the most common places are either on top of or on the side of your mic stand. Using one of three different side clamps, one or two devices may be easily mounted to the post of the mic stand. Enjoy an unobstructed view of your device's screen, as well as an uncluttered view from behind. Universal Tablet Holder for Presentations and Teleprompters

  Perfect for slideshow and teleprompter apps! Presenters can easily present from their own device and enjoy the ability to view larger text with smooth 360° rotation for locking portrait and landscape positions. Mount your tablet or phone for easy viewing, or discretely display your script out of audience view. The universal compatibility allows users to quickly change devices on the fly, and easy access to charging ports guarantees you'll have power when you need it the most. Tablet Mount for Vlogging, YouTube Setup, and Video Capture

  The Manos Universal Tablet Holder is an excellent choice for Vlogging equipment and YouTube setup. Mount your tablet for an easy podcast station or create your own grip rig. Great for sports analysis apps to improve your swing. Use with a Bluetooth pedal for a hands-free experience. Start and stop recording and playback, with the press of a foot switch, to keep your head in the game! The Manos is ultra-portable and fits in a backpack! Tablet Display for Bed, Desktop, Kitchen, or Workspace

  The MANOS is the ideal solution for both seated and standing setups. Whether you are watching movies, playing games, or reading books in bed, the MANOS is a versatile mounting option. Even when using a tablet for webinars or video calls, following a recipe or filming in the kitchen, or watching videos for a DIY project in the workshop; The MANOS does it all! For convenient desktop mounting, combine the MANOS with our Desktop Clamp. Combine it with our goSTAND Portable Mic and Tablet Stand and Telescoping Boom for the perfect accessible solution. Optimize your workspace and keep your tablet or phone handy without it getting in the way! Tablet POS Stand and Kiosk Display

  Running your POS or kiosk from a tablet? The AirTurn MANOS is perfect for in-store tablet mounting. The AirTurn Desktop Clamp is the perfect companion for your tablet POS or kiosk when mounting to a desk. For a walk-up standing solution, combine with the goSTAND Portable Mic and Tablet Stand. This entire setup fits in a backpack, and would be perfect for quick setup events or trade shows. Check out the AirTurn TechAssist to save on a bundle!
