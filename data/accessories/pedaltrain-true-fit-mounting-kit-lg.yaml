details: |-
  About True Fit Mounting Kit (Large Size) for Pedaltrain Classic Series Model: PT-TFMK-LG The next generation of our universal brackets is here. The True Fit Mounting Kit is available in two sizes, designed to fit our various pedalboard collections perfectly. The new two-way "Flip Flop" design provides more options than ever to mount power supplies, wireless units, direct boxes, and more under your Pedaltrain. Comes with everything you need to mount including screws and velcro. Compatibility Mounts most other brands of power supplies underneath the Classic series boards. Contents: 2 brackets, 4 screws, 2 strips of hook-and-loop Note: This bracket is not compatible with vintage Pedaltrain Jr/1/2 models (those with "port holes"). These Pedaltrain models shipped with the correct bracket in the kit. Replacement brackets can be found here. Need help deciding which Mounting Bracket you need? Check out this article from our Help Center: Which Bracket is Right for Me
