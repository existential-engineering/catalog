name: CP-ML4
manufacturer: free-the-tone
primaryCategory: cable
url: https://www.freethetone.com/en/products/detail40/
description: A 4-way DC power splitter cable that feeds 9 VDC from one AC
  adapter to four effects units, split close to the power source so the shared
  current path stays very short.
details: |-
  A power splitter cable that supplies 9 VDC from one AC adapter is a useful product for reducing space on a pedalboard, because one cable can feed power to multiple effects units. Usual daisy-chain type splitter cables, however, have a long common section in which the current for every pedal runs, and that is one of the causes of noise and reduced voltage.

  The Free The Tone 4-way DC power splitter cables are split at a point close to the power source, so this common section is very short and the effects units are powered under ideal conditions.

  The CP-ML4 takes its power at a single L-shape male 5.5 by 2.1 mm barrel connector and fans out to four L-shape male barrel connectors of the same size, two on 50 cm tails and two on 75 cm tails. A connection diagram is published as a PDF on the product page.
specs: |-
  - Input end: 1 x barrel connector (5.5 by 2.1 mm, L-shape male)
  - Output end: 4 x barrel connector (5.5 by 2.1 mm, L-shape male)
  - Output cable lengths: 2 x 50 cm, 2 x 75 cm
  - Supplies 9 VDC from a single AC adapter to four effects units
