description: If you're ready to start playing bass, the LTD B Series Bass Pack
  from ESP contains everything you need to get into the world of bass playing.
  No matter what musical style you want to pursue, from metal to funk, reggae to
  punk, this is your starting point on the road to greatness! It includes an LTD
  B Series bass with a powerful ESP bass pickup and volume/tone controls. You
  also get a 15W bass amplifier with 4-band EQ controls to dial in your
  preferred tone, and a headphone output for practice. Perfect for lessons and
  jams with friends, the LTD B Series Bass Pack also includes an electronic
  tuner, a 10' guitar cable, a nylon gig bag, and even a bass strap and picks!
  Whether you're playing for fun or for creative expression, this is the only
  affordable all-in-one bass pack with the quality, sound, and playability
  people expect from ESP!
