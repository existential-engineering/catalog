description: Optional 4.4 mm 5-pole balanced cable (2.0 m) for the Premium Headphone TH series, with a flexible and easy-to-handle PVC sheath.
details: |-
  Optional 4.4 mm 5-pole balanced cable (2.0 m) for the Premium Headphone TH series. It uses a flexible and easy-to-handle PVC sheath.

  The cable is 7N grade (99.99999%) OFC (oxygen free copper) with a gold-plated plug. Available models are the TH1100RP, TH1000RP, TH909, TH900mk2, TH808, TH616 and TH610.
specs: |-
  - Cable: 7N Grade (99.99999%) OFC (Oxygen Free Copper)
  - Plug: Gold-plated, 4.4mm 5-pole balanced
  - Sheath: PVC
  - Length: 2.0m
  - Weight: 90g
  - Available models: TH1100RP, TH1000RP, TH909, TH900mk2, TH808, TH616, TH610
