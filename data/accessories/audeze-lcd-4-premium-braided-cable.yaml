details: |-
  Our premium cable features cryogenically treated four conductor stranded wire, each wire consisting of a large number of extremely fine strands of single-crystal OCC copper with a combined cross section equivalent to AWG 20 that ensures low resistance and negligible signal loss. Crystals within strands are oriented in a specific pattern to provide the best possible signal transmission.
specs: |-
  - Very flexible, tangle free
  - Non-microphonic jacket
  - Length: 2.5m; Weight: 110 g
  - 4-pin balanced XLR plug with 1/4" Single Ended adapter
  - 2 x 4-pin mini XLR for headphone earcup connection
  - Resistance: 12 milliohms per foot
  - Capacitance: 10 picofarads per foot
  - Inductance: 0.15 microhenrys per foot
  - Dielectric strength: 1000V
