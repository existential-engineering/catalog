description: Professional speaker cable with Neutrik NL2 SpeakON connectors on
  both ends, built on Canare 4S11 star-quad for effective 11 AWG performance.
  Hand-assembled in Syracuse, NY. Available in lengths from 2 to 100 feet.
details: |-
  Benchmark Studio & Stage Speaker Cables combine premium cable, connectors, and construction for performance that meets the demands of world-class studios while providing the strength and reliability required for stage applications.

  Built on Canare 4S11 star-quad cable, the 2-pole configuration uses a pair of 14 AWG conductors wired in star-quad for an effective 11 AWG gauge, providing 14% more copper than a standard 12 AWG cable. The polyethylene dielectric keeps capacitance low at 45 pF/ft, and DC resistance stays below 2.6 ohms per 1000 ft.

  Each end is terminated with a heavy-duty locking Neutrik NL2FXX SpeakON connector, compatible with both NL2 and NL4 jacks. Cables are sold individually; order two for a stereo pair. Available in 9 lengths from 2 to 100 feet.
specs: |-
  - Connectors: Neutrik NL2FXX SpeakON 2-pole (both ends)
  - Cable: Canare 4S11 star-quad
  - Effective gauge: 11 AWG (pair of 14 AWG conductors)
  - Copper: 14% more than 12 AWG
  - DC resistance: <2.6 Ohms/1000 ft
  - Capacitance: 45 pF/ft
  - Dielectric: Polyethylene
  - Cable diameter: 0.421 inches
  - Compatible with: NL2 and NL4 SpeakON jacks
  - Lengths available: 2, 3, 6, 10, 15, 25, 50, 75, 100 feet
  - Assembly: Hand-assembled in Syracuse, NY, USA
  - Sold individually (order 2 for stereo pair)
