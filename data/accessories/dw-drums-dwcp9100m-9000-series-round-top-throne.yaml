details: |-
  The DW 9000 Series Round Top Throne has a full 14-inch round seat, made of a special combination of foam for stability and comfort. It also features DW's newly designed Double Locking Clamp to keep the tripod solidly in place, a Vise Lock Seat Clamp to keep the seat married to its legs, and an oversized base for added stability.

  Full-Size Comfort: a supportive, molded round seat for balance and longevity.

  Double-Braced Tripod Legs: solid 1-1/8" double-braced foundation with no-slip feet.

  Flexible and Dependable Adjustment: expansive swivel height adjustment with a burly locking nut.

  DW: The Drummer's Choice.
