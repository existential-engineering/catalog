description: Socket upgrade kit that fits CV, Gate and Filter input sockets to
  the Roland SH-3A, so the synthesiser can be played from a Kenton MIDI to CV
  converter. It suits the SH-3A only, not the earlier SH-3.
details: |-
  This kit adds CV, Gate and Filter sockets to the Roland SH-3A. It suits the SH-3A only, since the earlier SH-3 uses different circuit boards inside.

  Used with a MIDI to CV converter such as the Pro-Solo mk3 or the Pro-2000 mkII, the three extra sockets let the synthesiser be played from a MIDI keyboard or MIDI sequencer. The inputs sit on 3.5mm mono jack sockets: CV provides volt per octave control over oscillator frequency, Gate controls when notes play with 0 volts as note off and above 3 volts as note on, and Filter controls the cutoff frequency of the low pass filter from the aux output of the converter.

  Paired with a Pro-Solo mk3 or Pro-2000 mkII, the kit gives control over notes across at least five octaves, pitchbend with a range set in the converter, modulation from the converter's own LFO with speed and waveshape adjustable in real time, portamento with a rate adjustable in real time, filter cutoff from any continuous controller or from aftertouch or velocity, selectable low, high or recent note priority, and single or multiple note trigger modes.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the three 3.5mm mono jack sockets. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Adds three 3.5mm mono jack input sockets: CV, Gate and Filter
  - CV input provides Volt per Octave control over oscillator frequency
  - Gate input controls when notes play (0 volts = note off, greater than 3 volts = note on)
  - Filter input controls the cutoff frequency of the low pass filter, driven from the aux output of a converter
  - Note range of at least five octaves, limited by the synthesiser rather than the kit
  - Fits the Roland SH-3A only, not the Roland SH-3
  - Kit supplies all necessary components plus wiring and mounting diagrams
  - Passive socket kit, so it has no power connection of its own
