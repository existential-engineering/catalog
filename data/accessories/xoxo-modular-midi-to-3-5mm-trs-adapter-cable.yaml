details: |-
  This adapter cable allows you to connect old school 5-pin MIDI DIN cables to a 3.5mm TRS jack. You might ask, "what polarity is it?" Well, if you're using our MIDIXO or IXO modules, the answer is "who cares!?"

  (Spoiler Alert: They happen to be Type A, which corresponds to manufacturers like Korg, Make Noise, Akai, and also became the MIDI standard a while back)

  Works great with our IXO and MIDIXO modules! SKU: CBL001
