details: |-
  A socket upgrade kit for the Korg 800DV. It fits control voltage sockets to the synthesiser so that it can be played from a MIDI keyboard or MIDI sequencer through a MIDI to CV converter capable of Hz/V scaling.

  Four kit sizes are offered. A three socket kit adds CV, Gate and low pass filter sockets. A six socket kit adds separate CV, Gate and low pass filter sockets for each voice. A one socket kit adds a high pass filter socket and a two socket kit adds a high pass filter socket for each voice, both designed to be used alongside the three socket kit.

  The inputs are on 3.5mm mono jack sockets. Hz/V gives Hz per volt control over the frequency of both oscillators, Gate decides when notes play (0 volts for note off, above 3 volts for note on), and the filter input sets the cutoff frequency of both low pass filters from the auxiliary output of the converter. On the six socket kit the same three inputs are repeated for the upper and lower sections, and a switch selects whether control comes from the synthesiser's own keyboard or from the sockets.

  Plugging into the upper sockets alone controls both sections of the synthesiser. Independent control of the upper and lower sections needs a dual channel MIDI to CV converter such as the Pro-2000 mkII, with a separate MIDI channel driving each section.

  Used with a Pro-Solo mk3, USB-Solo or Pro-2000 mkII, the kit passes notes across at least five octaves, pitchbend with the range set in the converter, modulation from the converter's own LFO, portamento from the converter's own glide, and filter cutoff from any continuous controller, aftertouch or velocity. Note priority and single or multiple trigger modes are set in the converter. Each kit contains the components, jack sockets and wiring diagrams needed for the installation.
specs: |-
  - Requires a MIDI to CV converter capable of Hz/V scaling
  - Inputs are on 3.5mm mono jack sockets
  - Hz/V input controls the frequency of both oscillators
  - Gate: 0 volts is note off, above 3 volts is note on
  - Filter input is driven from the auxiliary output of the converter
  - Note range at least 5 octaves, limited by the synthesiser rather than the kit
  - Six socket kit adds a switch to select keyboard or socket control
  - Independent upper and lower section control requires a dual channel converter
  - The kit adds sockets only and has no power input of its own
