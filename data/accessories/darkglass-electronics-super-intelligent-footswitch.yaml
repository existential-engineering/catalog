description: The Super Intelligent Footswitch gives foot control over a
  Darkglass Microtubes 500 or 900 bass amplifier. Buttons switch between the
  Clean, Vintage Microtubes, and Microtubes B3K sections, and a Mute button
  silences the amp for tuning or set breaks.
details: |-
  The Super Intelligent Footswitch is a rugged control accessory for Darkglass's Microtubes 500 and Microtubes 900 bass amplifiers. It provides easy foot access to the wide tonal options those amplifiers offer, in a compact and durable chassis.

  Four buttons handle the amp's sections: Clean accesses the clean channel with 4-band EQ, VMT (Vintage Microtubes) engages the warmer, more neutral overdrive, and B3K activates the aggressive, percussive Microtubes B3K overdrive. A Mute button silences the amplifier for tuning or set breaks.

  The footswitch measures 22cm long x 4.5cm deep x 4.8cm high and weighs 0.450 kg. It carries no audio signal path of its own and works only with Darkglass Microtubes 500 and 900 amplifiers.
specs: |-
  - Control footswitch for Microtubes 500 and 900 amplifiers
  - Clean button: clean channel with 4-band EQ
  - VMT button: Vintage Microtubes overdrive
  - B3K button: Microtubes B3K overdrive
  - Mute button: silences the amp for tuning or breaks
  - Dimensions: 22cm L x 4.5cm D x 4.8cm H, 0.450 kg
  - Compatible only with Darkglass Microtubes 500 and 900 amplifiers
