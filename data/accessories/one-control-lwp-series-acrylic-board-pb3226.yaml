details: |-
  *NOTE:
  Shipping charges are NOT INCLUDED at the time of order. Shipping costs will be calculated after your order has been confirmed and will be communicated to you later. Please note that shipping costs are not stated when ordering. Acrylic Pedal Board is a pedalboard using 5mm thick and sturdy acrylic board. Small boards that use about 2 to 3 effects are very easy to carry. However, with a small effects board, it may be surprisingly difficult to install the pedals efficiently. So, I made a small pedalboard with holes that can be used as a handle on the left and right sides. The PD 3226 is the best size for installing 2 to 3 effects or small multi-effects. Because the board itself is small, if you attach a handle, it will limit the placement of the pedals. By making holes for a handle, it makes possible putting a pedal on the handle when you want to temporarily add another unit. ・Pedal board
  Width: 32cm (between handle holes: 25cm)
  Depth: 26cm
  Weight: 440g

  * Effectors and accessories are not included.
