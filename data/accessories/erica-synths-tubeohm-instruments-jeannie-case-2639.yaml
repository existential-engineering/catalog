details: |-
  Erica Synths' aluminium case kit for the TubeOhm Jeannie synthesizer turns the DIY Jeannie into a proper, studio-grade instrument.

  The kit consists of a two-part powder coated and silkscreened aluminium case, a CNC-machined plexiglass LCD cover, 4 screws and 4 anti-slip pads.

  Those parts are the whole of the kit, so it is an enclosure for an already built Jeannie rather than a synthesizer, the TubeOhm Jeannie itself being a separate DIY project.
specs: |-
