description: Make juicy basslines on your Bullfrog
details: |-
  The ACID BASSLINE voicecard is an internal patch card for the Bullfrog that instantly provides all the connections needed to produce a punchy bassline. The patch expects an external controller, either a MIDI keyboard, a MIDI sequencer or a CV/GATE sequencer.

  With the card inserted, all audio sources (SINE OUT, PULSE OUT and NOISE) are mixed and sent to the VCF and then to the VCA. A gate starts both envelope generators, EG 1 controlling the VCA and EG 2 the cutoff of the VCF. The sample and hold output controls the waveshape of the VCO in addition.

  Erica Synths suggests setting both envelope generators to FREE mode and turning VCA OFFSET fully counter clockwise, then setting the desired audio mix and tweaking the CUTOFF and RESONANCE knobs. The acid bassline feel is strongest with resonance set high. ATTACK and RELEASE set the envelope times, and EG 2 on the VCF is best given a longer attack and a shorter release than EG 1.
specs: |-
  - Internal patch voicecard
  - Instant bassline sound
