details: |-
  The SF1 is a desk and sideboard stand designed as an ideal base for positioning small or medium-sized compact loudspeakers upon sideboards, shelves, or desks.

  It optimizes monitor performance with minimum effort or space by placing the monitor with a slight upward tilt. This minimizes the impact of surface reflections on the sound quality which would otherwise occur from the underlying foundation.

  Part of the Dynaudio Accessories series, the SF1 is available in matte black or silver finishes.
