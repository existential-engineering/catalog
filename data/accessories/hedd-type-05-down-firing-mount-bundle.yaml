name: TYPE 05 Down-Firing Mount Bundle
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/t05-down-firing-mount-bundle
description: A HEDD ceiling-mount bundle for down-firing installation of a TYPE
  05 monitor, pairing an M05 mounting adapter, a C-Bracket, and a V120 isolation
  mount for 360° rotation and up to 45° of adjustable tilt.
details: |-
  This bundle provides everything you need to connect a TYPE 05 monitor to the ceiling in a down-firing configuration. It comprises a mounting adapter (M05), a C-Bracket, and a V120 isolation mount, and includes all necessary hardware.

  The mount offers 360° rotation and up to 45° of adjustable tilt, and uses patented IsoAcoustics isolation for improved stereo image, reducing vibration transfer through supporting structures.

  Compatible with TYPE 05, TYPE 05 MK2, and A-CORE models. Monitor sold separately; the monitor needs to be prepared with mounting screw holes by HEDD or a certified service partner. For wall applications, the IsoAcoustics Wall Mount must be added separately.
specs: |-
  - Contents: 1x M05 mounting adapter, 1x C-Bracket, 1x V120 isolation mount
  - 360° rotation and up to 45° of adjustable tilt
  - Patented IsoAcoustics isolation technology
  - Weight: 1.75kg
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with TYPE 05, TYPE 05 MK2, and A-CORE models
  - Monitor sold separately; requires mounting screw holes prepared by HEDD or a certified service partner
