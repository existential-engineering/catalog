description: 'The PRO369-16U touring grade 19" rackmount road case for the Midas
  PRO3, PRO6, PRO9 and PRO X Live Digital Console systems is designed to
  withstand the rigours of live concert tours.'
details: |-
  Touring grade 19" rackmount road case providing a shock mounted 16U rack frame for the Midas PRO3, PRO6, PRO9 and PRO X Live Digital Console systems, the DL351 Audio System I/O stage box and the DL371 and NEUTRON Audio System Engines. Constructed from 12 mm thick rigid marine grade plywood with 40 x 40 mm durable aluminium edging extrusions, composite density foam internal support, premium Penn-Elcom castors and RK handles, and a removable protective pallet. External dimensions 577 mm length x 806 mm width x 989 mm height (22.7" x 31.7" x 38.9"); weight 61.0 kg (134.2 lbs). Designed to withstand the rigours of live concert tours.
specs: |-
  - Construction: 12 mm thick rigid marine grade plywood with 40 x 40 mm durable aluminium edging extrusions
  - Rack Frame: Shock mounted 16U rack frame
  - Internal Support: Composite density foam
  - Dimensions: 577 mm length x 806 mm width x 989 mm height (22.7" x 31.7" x 38.9")
  - Weight: 61.0 kg (134.2 lbs)
  - Hardware: Premium Penn-Elcom castors and RK handles
  - Included Accessories: Removable protective pallet
  - Compatible Consoles: Midas PRO3, PRO6, PRO9, PRO X Live Digital Console systems
  - Compatible Stage Box: DL351 Audio System I/O stage box
  - Compatible Audio System Engines: DL371 and NEUTRON
