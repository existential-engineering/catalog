  icon in the same gold used on those products.
details: |-
  D.W. Fearn has always recommended providing at least one rack unit (RU) of space above and below its products. This is especially important for the more complex products like the VT-7 Compressor and the VT-5 Stereo Equalizer, which have many tubes and may generate considerable heat while operating.

  This 1.75 inch (1RU) ventilated rack panel is coated with the same high-gloss polyurethane paint used on all D.W. Fearn products. The rack panel has a small D.W. Fearn logo and vacuum tube icon in the same gold used on the products.

  These panels are made of .25 inch laser-cut and milled aluminum.
specs: |-
  - 19" Wide - 1.75" High (1RU)
  - .25 " Deep (CNC Milled)
  - Color Matched Hand-Polished Polyurethane Finish
