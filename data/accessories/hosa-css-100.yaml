details: |-
  This cable is designed to interconnect pro audio gear with balanced phone jacks. It may also be used as a stereo interconnect.

  Features include nickel-plated plugs for rugged durability and efficient signal transfer, Oxygen-Free Copper (OFC) conductors for enhanced signal clarity, and an OFC spiral shield for effective EMI and RFI rejection and flexibility.

  The cable is offered with Straight to Same, Straight to Right-angle, or Right-angle to Same connectors, in lengths of 3, 5, 10, 15, and 25 ft.
