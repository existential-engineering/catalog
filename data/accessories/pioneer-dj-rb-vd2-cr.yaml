details: |-
  A range of rekordbox control vinyl sets, available in 5 fresh designs. 

  When using control vinyl with a rekordbox DVS setup, you can play, mix, and scratch tracks from your PC/Mac with the same feeling as if you're using analog records. 

  The special designs incorporate kanji - the Chinese characters used in Japanese writing - on the dust jacket of each set and the label of each record to express one of 5 key aspects of dance music: "music (音)", "mix (繋)", "scratch (擦)", "jump (舞)", or "dance (踊)". 

  RB-VD2 control vinyl is sold in pairs.

  *To use this control vinyl, you'll need an INTERFACE 2 audio interface or a DJ setup that's compatible with the rekordbox DVS function. Check here for the latest information on compatible equipment. 

  *To use the DVS function in rekordbox, you'll need a DJ setup with a DVS Hardware Unlock Device or a subscription to the rekordbox Core or Creative plan. Find a list of compatible devices here.
