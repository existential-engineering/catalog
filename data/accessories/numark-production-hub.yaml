description: Professional-grade surge-protected power strip for DJs with six AC
  outlets and an integrated four-port USB 3.0 hub.
details: |-
  Every DJ carries a bag of wires and extra cords for the "just-in-case" moments during their set. If only there was a surge-protector that could minimize the clutter of wires and connect multiple data devices.

  Finally—a professional surge protector built with the DJ in mind! The Production Hub comes with DJ-essentials: A perfect combination of six AC outlets and four USB data ports. In addition to the four data USB ports, there is a dedicated 5V 2.1A port strictly to charge a mobile device so you don't miss a beat.

  You can route all the data ports seamlessly to your computer and free up your laptop. Sometimes, it's the really simple "How come no one thought of this before" items that make our lives easier and more satisfying.
specs: |-
  - Integrated 4-port USB 3.0 hub - connect external hard drives, bus-powered controllers and other USB peripherals
  - Six surge-protected AC power sockets
  - Four USB 3.0 type A sockets for data or charging
  - One USB 3.0 type B connector for connecting to a PC
  - One 2.1A USB type A connector for mobile device charging
  - 6-foot cable
  - EMI & RFI Filtering
  - Metal Construction
