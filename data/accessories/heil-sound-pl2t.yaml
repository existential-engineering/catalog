details: |-
  Overview Features

  The Heil PL2T is a fully articulating, professional-quality microphone boom arm designed for broadcast, podcasting, studio, and home recording environments. Engineered for quiet adjustment and clean aesthetics, the PL2T combines internal tension control with an integrated cable management system to keep studio setups sleek and noise-free.

  Key Features

  Included Accessories:
specs: |-
  - Silent Movement: Features factory pre-set internal spring tension, eliminating external spring noise and reverberation during live broadcasts or podcast recordings.
  - Integrated Cable Management: Built-in covered cable channels eliminate clutter, exposed wires, and unsightly velcro straps.
  - Flexible Mounting: Comes standard with a Heil C-Clamp (1.5″ maximum opening) and fully integrates with Heil's complete line of custom mounting hardware.
  - Standard Threading : Features an industry-standard 5/8″-27 thread to accept standard mic clips and shock mounts.
  - C-Clamp boom mounting clamp.
  - Weight Capacity: supports microphones up to 2.5 lbs.
  - Maximum Extension Length: 40″.
  - Mount Compatibility: fits all Heil brass-lined mounts (DT-1, FL-2, RS-1, WM-1).
