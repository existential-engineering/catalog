description: A lead from a 3.5mm mono jack to the tip contact of a 6.35mm TRS
  jack, with the ring left unconnected. Suits the CV and trigger sockets of the
  Moog Rogue and Moog Source.
details: |-
  A lead with a 3.5mm mono jack plug at one end and a 6.35mm TRS jack plug at the other, wired to the tip contact only. The ring is deliberately left unconnected.

  That wiring suits the combined CV and trigger sockets of the Moog Rogue and Moog Source, where the two signals share one stereo jack and the tip carries the one this lead is for.

  Further wiring detail for both instruments is covered on their Find My Synth pages. A companion lead wired to the ring instead is sold separately.
specs: |-
  - Connector A: 3.5mm mono jack plug
  - Connector B: 6.35mm TRS jack plug, tip connected, ring not connected
  - For the CV and trigger sockets of the Moog Rogue and Moog Source
  - Sold in a choice of lengths
