details: |-
  A perfect fit for the LIVEN series and the deconstruct series, this rigid molded case provides excellent protection with a 1680D nylon exterior. A separate compartment (including a movable divider) holds accessories such as the PSU and cables, and the case is compact and lightweight.

  Exterior dimensions: W 16.74 inches (425 mm) x D 8.67 inches (220 mm) x H 2.56 inches (65 mm). Weight: 1.23lbs (554g).

  This product is a case only. The Ambient Ø unit, PSU, and accessories in the photo are not included.
