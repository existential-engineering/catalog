url: https://www.crownaudio.com/en-US/products/xfmr-4
description: Four-channel rack-mount step-up transformer accessory that provides
  70V/100V constant-voltage outputs for Crown ComTech DriveCore amplifiers that
  lack built-in high-impedance output capability.
details:
  - The XFMR-4 is a passive 4-channel step-up transformer accessory designed to
    pair with Crown's ComTech DriveCore Series amplifiers. It enables amplifiers
    without direct 70Vrms or 100Vrms output capability to drive distributed
    constant-voltage loudspeaker systems used in installed sound.
  - The unit accepts standard jumper cables for straightforward integration with
    the host amplifier and provides impedance matching across four independent
    channels. This expands the application range of compatible Crown amplifiers
    into 70V/100V distributed audio installations.
  - Outputs use pluggable barrier-block connectors that accept wire up to 14
    AWG, simplifying field termination in installed sound applications. The
    chassis is 1U rack-mount and weighs 17 lbs.
specs: |-
  - 4 channels
  - Output Connectors: pluggable barrier-block connectors (up to 14 AWG)
  - Frequency Response: ±1.0 dB (70 Hz – 15 kHz)
  - Insertion Loss: ≤1.0 dB max (70VAC)
  - Max Input: 32Vrms / 125W
  - Compatible with Crown ComTech DriveCore Series amplifiers
  - 1U rack-mount form factor
  - Dimensions: 19" W × 1.72" H × 15.6" D (48.3 × 4.4 × 39.7 cm)
  - Weight: 17 lbs (7.7 kg)
