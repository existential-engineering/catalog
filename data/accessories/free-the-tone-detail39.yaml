name: CP-M35CV
manufacturer: free-the-tone
primaryCategory: cable
url: https://www.freethetone.com/en/products/detail39/
description: A short DC conversion cable that lets an effects unit powered
  through a 3.5 mm mini-plug run from a standard 5.5 by 2.1 mm centre-minus
  adapter or power supply.
details: |-
  Regarding the polarity of the DC jack commonly used in an effects unit's power supply, in almost all cases the inner centre pin is minus and the outer sleeve is plus, with a 2.1 mm centre pin diameter. Commercially available AC adapters and power supply units therefore mainly support that specification. But some effects units use mini-plugs, inverted centre-plus polarity, or a 2.5 mm centre pin in the DC jack, and a DC conversion cable has to be used to connect such a unit to a common adapter or power supply.

  The CP-M35CV is the conversion cable for an effects unit that uses a 3.5 mm mini-plug to receive electric power. One end is a 5.5 by 2.1 mm barrel connector (female) that accepts the output plug of a standard supply, and the other end is a 3.5 mm mini-plug. By connecting it to a DC plug with centre minus polarity, the mini-plug's tip is changed to the plus side.

  Two polarity-inverting siblings are sold alongside it for units that expect centre-plus power, one terminating in a 5.5 by 2.5 mm barrel connector and one in a 5.5 by 2.1 mm barrel connector. Each of the three is a short, finished cable intended to sit between a pedalboard supply and one pedal.
specs: |-
  - Plug size: 5.5 by 2.1 mm barrel connector (female) to 3.5 mm mini-plug
  - By connecting to a DC plug with centre minus polarity, the mini-plug's tip is changed to the plus side
