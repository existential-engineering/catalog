description: The Power Tap is a multi-output pedalboard power adapter supplying
  seven 9 V DC 100 mA outputs plus one 9 V DC 500 mA, one 12 V DC 100 mA and one
  18 V DC 100 mA output, each filtered separately and short-circuit protected.
details: |-
  The Power Tap is a multi-power adapter designed for pedalboard users. Alongside the regular 9 V DC 100 mA outputs it offers a higher-current 9 V DC 500 mA output and 12 V and 18 V outputs for pedals that need them.

  All ten outputs are filtered separately and protected against short circuits, and the whole unit runs from the supplied 18 V DC power adapter. Polarity is centre negative throughout, the standard for guitar effect pedals.

  A switch turns the LED illumination on and off. The unit ships with an 18 V power adaptor, DC connection cables, a DC polarity reversal cable and an operator's manual. It measures 15 x 5.4 x 3.4 cm and weighs 0.6 kg.
specs: |-
  - DC input: 18 V DC from the supplied power adapter
  - 7 x 9 V DC 100 mA outputs
  - 1 x 9 V DC 500 mA output
  - 1 x 12 V DC 100 mA output
  - 1 x 18 V DC 100 mA output
  - All outputs filtered separately and short-circuit protected
  - Polarity: centre negative
  - On/off switch for the LED illumination
  - Supplied with an 18 V power adaptor, DC connection cables, a DC polarity reversal cable and an operator's manual
  - Dimensions: 15 x 5.4 x 3.4 cm
  - Weight: 0.6 kg
