name: CP-416DC
manufacturer: free-the-tone
primaryCategory: cable
url: https://www.freethetone.com/en/products/detail38/
description: A shielded instrument DC cable for feeding power from a pedalboard
  supply to an effects unit, built to block external noise and keep power
  transmission loss to a minimum.
details: |-
  In addition to a shielded cable as an audio signal line for connecting a guitar or an effects unit, a DC cable for supplying the power line from a power supply to an effects unit is also an important part that can influence the sound.

  With the CP-416DC instrument DC cable, external noise is blocked and power transmission loss is decreased to the utmost. The system can feed electric power to effects units without stress, which improves sound quality and allows the effects units to function at their maximum ability.

  The cable is the maker's shielded CU-416, which is less subject to external noise, and its very low resistance keeps power transmission loss from the supply down. It has the flexibility necessary for wiring within a pedalboard and is terminated with high strength molded plugs. Two plug orientations are sold, S/L (straight to L-angle) and L/L, each in 15 cm, 20 cm, 30 cm, 50 cm and 75 cm lengths.
specs: |-
  - Shielded type cable (CU-416), less subject to external noise
  - Lower power transmission loss from the power supply due to very low cable resistance
  - Flexibility necessary for wiring within the pedalboard
  - High strength molded plug
  - Plug types: S/L (straight to L-angle), L/L
  - Lengths: 15 cm, 20 cm, 30 cm, 50 cm, 75 cm
