name: HEDDphone D1 Premium Balanced Cable 2m
manufacturer: hedd
primaryCategory: cable
url: https://hedd.audio/products/heddphone-d1-balanced-cable
description: An official upgrade audio cable for the HEDDphone D1 with a 4.4 mm
  balanced termination and a high-purity hybrid conductor for higher resolution
  and improved clarity.
details: |-
  The HEDDphone D1 Premium Balanced Cable is an official upgrade cable that delivers higher resolution and improved clarity. It uses a high-purity hybrid conductor design combining silver-plated 5N LC-OFC copper and 5N LC-OFC copper, wrapped in black and silver textile sheathing.

  HEDD notes the cable requires high-quality amplifiers to perform at its best. It is 2 meters long, terminates in a 4.4 mm balanced connector, and is compatible with the HEDDphone D1, HEDDphone TWO, and HEDDphone TWO GT. Backed by a 5-year warranty.
specs: |-
  - Length: 2 meters
  - Connector: 4.4 mm balanced termination
  - Conductor: 4-braid, 24-core hybrid (silver-plated 5N LC-OFC copper + 5N LC-OFC copper), 168 strands
  - Construction: Litz Type 4 with fiber-filled damping core
  - Sheathing: black and silver textile
  - Compatibility: HEDDphone D1, HEDDphone TWO, HEDDphone TWO GT
  - Warranty: 5 years
