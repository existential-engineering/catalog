name: Cables
manufacturer: blackstar
primaryCategory: cable
url: https://blackstaramps.com/cables/
description: Blackstar's range of premium instrument and microphone cables,
  combining best-in-class quality and reliability with Blackstar's design vision
  for the perfect signal path.
details: |-
  Blackstar believes in removing barriers to creativity by creating the highest quality products. The same philosophy applies to our cables, combining best in class quality and reliability with Blackstar's design vision.

  Blackstar cables have high quality braided shielding which provides superior durability and electrical insulation compared to spiral shielding found in other cables.

  Our cables have PVC jackets for excellent flexibility, this also helps to reduce cable tangling. Heat-shrink tubes are also used around the solder connections providing ultimate protection. The 6.5mm / ¼" outer jacket also increases flexibility and durability of the cables, and an added shield ring reduces capacitance and unwanted noise interference.
specs: |-
  - PVC jackets for excellent flexibility and reduced tangling
  - Heat-shrink tubes around solder connections for protection
  - 6.5mm / ¼" outer jacket increases flexibility and durability
  - Added shield ring reduces capacitance and unwanted noise interference
  - High quality braided shielding (superior to spiral shielding)
versions:
  - name: Professional Instrument Cable
    description: Copper tip connectors (Straight to Straight, or Straight to
      Angled). AWG21 99.95% Oxygen Free Copper conductor for reliable, low
      impedance signal. 99% Braided copper shielding for optimum signal
      transfer.
  - name: Standard Instrument Cable
    description: Heavy-duty nickel-plated connectors (Straight to Straight, Straight
      to Angled). AWG23 99.95% Oxygen Free copper conductor for reliable, low
      impedance signal. 90-95% Braided copper shielding for optimum signal
      transfer.
  - name: Microphone Cable
    description: 24AWG 99.95% OFC dual-core conductors. Braided copper and foil
      shielding for optimum signal transfer. Premium matte black PVC jacket.
