details: |-
  Pedaltrain Deluxe MX Soft Case for Classic 3 & PT-3

  If you have a Pedaltrain Classic 3 or PT-3 we have a case purpose-built for you. Upgrade your soft case with this gem. We built it with 6" sidewalls so you have some extra headroom in there for tall stuff. There's also a nicely padded shoulder strap with durable swivel clasps - repetitive machine stress-tested to 44 lbs (20 kg). Durable construction, quality components, padded strap, and a great price.

  Features:

  Main Compartment Interior Dimensions: 24" x 17" x 6" (61 x 40 x 15 cm)

  Accessory Pouch Outer Dimensions: 21" x 14" x 1.5" (53 x 35 x 4 cm)

  Model: PT-CL3-MX-X
specs: |-
  - Familiar Pedaltrain soft case styling
  - Exterior accessory storage pocket (sizes vary by model)
  - Platinum SBS zippers on main compartment and accessory storage pocket
  - Premium shoulder strap with padded shoulder pad and enhanced swivel clasp
  - Easy-wipe interior
  - Water-resistant exterior shell
  - Deeper case, 6" or 15cm height (including lid height), for extra-tall pedals on all elevated Pedaltrain models
