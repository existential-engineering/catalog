description: A padded softshell carrying case for headphones, cables, and DACs,
  with extra internal depth for thick or permanently attached cables.
details: |-
  Dekoni Audio's Headphone Savior is built with the traveling audiophile in mind. Based on the philosophy of traditional camera bags-which protect thousands of dollars in equipment-we've applied that same standard of safety to your audio gear. With thick padding on all sides, a variety of internal configurations, and a design meant to accommodate headphones, cables, DACs, and anything else needed on the go, you can trust the Savior to keep your investment safe and worry-free.

  The Version 2 of the Headphone Savior (Charcoal) introduces a raft of changes for those who found the original design a little too snug. The defining feature of the V2 is the increased height, expanding the original's internal space by 3cm. You will never have to worry about a tight squeeze again.
specs: |-
  - Extra Depth for Cables: The V2 comes with two internal dividers. One lines the bottom of the case; removing this frees up even more depth, maximizing the available space for headphones with rigid, permanently attached cables.
  - Customizable Interior: Included are a variety of pockets and dividers, giving you the customization options needed to protect any style of headphone.
  - Travel Ready: Includes a shoulder strap for hands-free travel and a climbing loop on the back for carabiners to strap it to other bags.
