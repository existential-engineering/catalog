details: |-
  Dekoni Audio's Headphone Savior is built with the traveling audiophile in mind. Based on the philosophy of traditional camera bags-which protect thousands of dollars in equipment-we've applied that same standard of safety to your audio gear. With thick padding on all sides, a variety of internal configurations, and a design meant to accommodate headphones, cables, DACs, and anything else needed on the go, you can trust the Savior to keep your investment safe and worry-free. The Classic: Headphone Savior V1 (Medium)

  For those who prioritize a compact footprint. If you are looking for a more compact softshell case to keep traveling easy and comfortable, the tried-and-true original Savior is the perfect fit. The New Standard:

  Charcoal Headphone Savior V2 (Large)

  For those who need maximum room and flexibility. The Version 2 of the Headphone Savior (Charcoal) introduces a raft of changes for those who found the original design a little too snug. The defining feature of the V2 is the increased height, expanding the original's internal space by 3cm. You will never have to worry about a tight squeeze again. Comparison: Which Savior is right for you? While both cases offer the same high-quality softshell protection, heavy-duty padding, and modular dividers, the choice comes down to the size of your headphones and your cabling needs.
specs: |-
  - Compact Design: The V1 features a shorter vertical profile designed to take up as little space as possible in your luggage or backpack while still offering robust protection.
  - Proven Protection: Just like the V2, it features thick padding and modular dividers to secure your DACs and cables alongside your headphones.
  - Extra Depth for Cables: The V2 comes with two internal dividers. One lines the bottom of the case; removing this frees up even more depth, maximizing the available space for headphones with rigid, permanently attached cables.
  - Customizable Interior: Included are a variety of pockets and dividers, giving you the customization options needed to protect any style of headphone.
  - Travel Ready: Includes a shoulder strap for hands-free travel and a climbing loop on the back for carabiners to strap it to other bags.
  - Choose the Savior V1 (Original) if: You own standard-sized headphones with detachable cables and want a case that is as slim and portable as possible.
  - Choose the Savior V2 (Charcoal) if: You have large headphones, use thick aftermarket cables, or have headphones with permanently attached cables that require extra depth (an extra 3cm) to sit comfortably without bending.
