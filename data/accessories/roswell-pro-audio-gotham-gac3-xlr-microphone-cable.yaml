details: |-
  This is a premium microphone cable, assembled in our shop using arguably the finest cable and connectors in the world. It is compatible with all Roswell microphones. Features and Benefits

  We use Gotham cable sourced from Switzerland. This is superior in design, materials, and construction to most alternative options, including "Gotham" branded cable made in China and sold for cheap on Amazon. Genuine GAC3 cable has three individually insulated 24 AWG conductors, plus two layers of 100%-coverage woven copper shield. The two shield layers are counter-woven to improve EMI/RFI shielding. We use Neutrik NC3 connectors, an industry standard, revered for high performance and reliability. Each cable is hand-soldered in our shop, then "burned in" for 72 hours on a proprietary voltage fixture to condition the cable dielectric (insulation). The cables are 6m (just under 20') in length.
specs: |-
  - Genuine Gotham GAC-3 microphone cable
  - Genuine Neutrik NC3MXX / NC3FXX XLR connectors (black housing)
  - Hand-terminated in California
  - "Burned in" on a cable conditioning fixture for 72 hours
  - Full audio QC following burn-in
