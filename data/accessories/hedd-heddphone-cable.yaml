details: |-
  The official HEDDphone cable comes in five different variants to ensure the highest compatibility with a listener's favourite source gear, offering multiple connector options to work with various audio equipment. It is handcrafted in Berlin by HEDD Audio and backed by a 5-year warranty.

  Variants: HPC1 with a 6.35 mm (balanced) termination at 2.2 m; HPC2 with a 4-pin XLR (balanced) termination at 2.2 m; HPC3 with a 3.5 mm (unbalanced) termination at 1.6 m; HPC4 with a 2.5 mm (balanced) termination at 1.6 m; and HPC5 with a 4.4 mm (balanced) termination at 1.6 m.
specs: |-
  - HPC1: 6.35 mm (balanced), 2.2 m
  - HPC2: 4-pin XLR (balanced), 2.2 m
  - HPC3: 3.5 mm (unbalanced), 1.6 m
  - HPC4: 2.5 mm (balanced), 1.6 m
  - HPC5: 4.4 mm (balanced), 1.6 m
  - Handcrafted in Berlin
  - Warranty: 5 years
