details: |-
  DESCRIPTION

  Introducing the new Rivolta Premium Soft Case. All the protection your new instrument will need in a light, easy to carry package. Made from a high quality 900D Polyester material, this lightweight gig bag features a large accessories pocket, neck rest, heavy-duty zippers, 2 carry handles, S-Type shoulder straps, and a reinforced base. FEATURES
specs: |-
  - Innovative Water/Dust Resistant 900D Polyester with Snowflake Textures
  - 15mm EPE Insulation and 5mm Polyurethane Foam for better protection
  - Double Bag Handle (secured with rivets) and Ergonomic S-type shoulder straps
  - Heavy-Duty zippers with reflective stripes
  - PVC foot pad for durability and impact protection
