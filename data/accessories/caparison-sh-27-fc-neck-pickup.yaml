details: |-
  The SH-27F was developed specifically for 27-fret guitars. As an extended 27 fret neck places the pickup closer to a traditional centre pickup position - significantly altering the tone - the SH-27F was carefully developed to provide a superb, warm fat and throaty tone more associated with that of a neck pickup. Pickup Dimensions PDF
