description: Compass Microphone Boom Arm, with built-in cable management, a C-clamp mount, and 5/8 in threading for universal microphone compatibility.
details: |-
  Compass is a premium microphone boom arm with internal springs and built-in cable management, ideal for broadcast applications like game streaming, podcasting, YouTube videos and more. With smooth, quiet operation and sophisticated on-camera looks, it suits microphones weighing up to 2.4 pounds, including Yeti and Sona microphones.

  Compass features a broadcast studio-grade design with enclosed aluminum construction, internal springs, and hidden-channel cable management. All friction hinges are hand-tightening, so no tools are needed, and a full 360-degree rotation makes it easy to find the right mic position. The arm stays in place after being adjusted, and the robust C-clamp creates a solid connection with the desktop.

  Being nimble and sleek, Compass lets the mic be placed where it is wanted, when it is wanted. Whether the boom is adjusted to disappear on camera or featured front and center with the mic, Compass is a polished addition to any gaming, streaming, or podcasting setup.

  The arm mounts with the included C-clamp, which fits desktops up to 2 5/8 in thick, and reaches up to 32 in horizontally. Standard 5/8 in threading takes most microphones, and an adapter for 3/8 in threading is supplied in the box.
specs: |-
  - Extruded aluminum boom with enclosed construction and internal springs
  - C-clamp desktop mount, for desktops up to 2 5/8 in thick
  - 360-degree rotation
  - Max horizontal reach: 32 in (812.8 mm)
  - Max weight hold: 2.4 lbs (including mic and shock mount)
  - Hidden-channel cable management
  - Standard 5/8 in threading, adapter for 3/8 in threading included
  - Hand-tightening friction hinges, no tools required
  - In the box: Compass desktop boom arm, C-clamp for desktop mount, thread adapter
  - 2-year limited hardware warranty
