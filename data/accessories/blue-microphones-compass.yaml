details: |-
  Compass is a premium microphone boom arm with internal springs and built-in cable management, ideal for broadcast applications like game streaming, podcasting, YouTube videos and more. With smooth, quiet operation and sophisticated on-camera looks, Compass is the perfect microphone boom arm for mics weighing up to 2.4 pounds, including Yeti and Sona microphones.

  Studio-grade design: Compass uses a broadcast studio-grade construction with an enclosed extruded aluminium body, internal springs, and hidden-channel cable management, in place of the squeaky, flimsy scissor booms it replaces.

  All friction hinges are hand-tightening, so no tools are needed, and a full 360-degree rotation makes it easy to find the perfect mic position. Effortless and quiet, Compass stays in place after being adjusted, and the robust C-clamp creates a solid connection with the desktop.

  Game streaming, podcasting and YouTube: nimble and sleek, Compass lets you put your mic where you want it, when you want it. Whether you adjust the boom to disappear on camera or feature it front and centre with the mic, Compass is a polished addition to any gaming, streaming, or podcasting setup.

  In the box: the Compass desktop boom arm, a C-clamp for desktop mounting, and a 3/8 to 5/8 inch thread adapter. The arm carries a 2-year limited hardware warranty.
specs: |-
  - Boom type: extruded aluminium, enclosed construction with internal springs
  - Max horizontal reach: 32 in (812.8 mm)
  - Max weight hold: 2.4 lbs (1.1 kg), including mic and shock mount
  - Rotation: 360 degrees
  - Desktop mount: C-clamp
  - Max desktop thickness: 2 5/8 in
  - Threading: standard 5/8 in, with adapter for 3/8 in
  - Cable management: hidden-channel
  - Friction hinges: hand-tightening, no tools required
  - Colour: black
  - Warranty: 2-year limited hardware warranty
