details: |-
  Compass is a premium microphone boom arm with internal springs and built-in cable management, aimed at game streaming, podcasting and video. It is designed for smooth, quiet operation and an on-camera look, and holds microphones weighing up to 2.4 pounds including the shock mount, which covers Blue's Yeti and Sona microphones.

  Studio-grade design: Compass uses a broadcast studio-grade construction with an enclosed extruded aluminium body, internal springs, and hidden-channel cable management, rather than the exposed-spring scissor design of a basic boom.

  All friction hinges are hand-tightening, so no tools are needed, and the arm rotates a full 360 degrees. It holds its position once adjusted, and the C-clamp fixes it to desks up to 2 5/8 in thick.

  The boom can be positioned to stay out of frame on camera or to sit in shot with the microphone as part of a streaming or podcasting setup.

  In the box: the Compass desktop boom arm, a C-clamp for desktop mounting, and a 3/8 to 5/8 inch thread adapter. The arm carries a 2-year limited hardware warranty.
specs: |-
  - Boom type: extruded aluminium, enclosed construction with internal springs
  - Max horizontal reach: 32 in (812.8 mm)
  - Max weight hold: 2.4 lbs (1.1 kg), including mic and shock mount
  - Rotation: 360 degrees
  - Desktop mount: C-clamp
  - Max desktop thickness: 2 5/8 in
  - Threading: standard 5/8 in, with adapter for 3/8 in
  - Cable management: hidden-channel
  - Friction hinges: hand-tightening, no tools required
  - Colour: black
  - Warranty: 2-year limited hardware warranty
