description: NEMA 5-15P to IEC C13 locking power cable. The auto-locking IEC
  connector seats and locks automatically on insertion, with red release tabs
  for controlled removal. Available in 14 AWG and 18 AWG gauges in 3, 6, and
  8-foot lengths.
details: |-
  The Benchmark Locking Power Cord runs from a standard NEMA 5-15P plug to an IEC C13 connector equipped with a proprietary auto-locking mechanism. The connector locks automatically when inserted into any standard IEC power-entry inlet, providing high retention force and reliable electrical contact. Red tabs on the connector body must be grasped simultaneously to release it, preventing accidental disconnection.

  Two wire gauges are available to match the power requirements of different Benchmark components. The 14 AWG variant is the heavy-duty option included with the AHB2 power amplifier, while the 18 AWG variant is the standard option included with the DAC3, HPA4, and LA4 models.

  Cross-compatible with any equipment using a standard IEC C13/C14 power inlet. The locking mechanism is especially useful in rack-mount or live-sound environments where accidental cable pulls are a concern.
specs: |-
  - Connectors: NEMA 5-15P (AC mains) to IEC C13 (auto-locking)
  - Locking mechanism: auto-locks on insertion; release via red side tabs
  - Available gauges: 14 AWG (heavy-duty), 18 AWG (standard)
  - Available lengths: 3 ft, 6 ft, 8 ft
  - Compatible with all standard IEC C13/C14 power-entry connectors
  - Country of origin: Taiwan
