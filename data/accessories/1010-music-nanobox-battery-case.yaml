description: The nanobox battery case protects and powers your nanobox for use
  while traveling. The hard-shell case with magnetic closure keeps your nanobox
  safe in your backpack. The embedded battery pack ensures you can use the
  nanobox along the way and when you get there. Plug in headphones and you can
  make music along the way.
details: |-
  Nestle any of the four nanobox units into the injection-molded case, connect the built-in battery, and the nanobox is ready to travel. At the destination, remove the top of the case to connect speakers, MIDI devices, and audio inputs through the cutout in the back while powering the nanobox from the battery.

  Use the USB-C cable that came with the nanobox to charge the battery case. Includes a black nanobox battery case with a built-in lithium-ion polymer battery and a Quick Start Guide.
specs: |-
