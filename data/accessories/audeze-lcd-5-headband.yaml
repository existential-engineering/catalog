details: |-
  The Audeze LCD-5 and 5s feature a totally redesigned frame, including our newest iteration of the Carbon fiber headband.

  Fully tension adjustable with the included tools, these headbands provide hours of comfortable listening.

  Please note, these headbands are only compatible with headphones with the redesigned frame, including LCD-5, LCD-5s and MM-500 and will not fit our standard LCD series headphones.

  Please note: The serial number of your headphones is located on the headband. It is advisable to remove the serial number sticker from the old headband and replace it on your new one, or to keep the old headband in case of warranty service on your headphones.
specs: |-
