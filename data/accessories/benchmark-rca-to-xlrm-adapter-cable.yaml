name: RCA to XLR-M Adapter Cable
manufacturer: benchmark
primaryCategory: cable
url: https://benchmarkmedia.com/products/benchmark-rca-to-xlrm-adapter-cable
description: "Adapter cable connecting unbalanced RCA outputs to balanced XLR
  inputs, built on Canare StarQuad L-4E6S with Neutrik gold-contact connectors
  and silver solder. Pin wiring: RCA tip to XLR pin 2 (hot), RCA ring to XLR pin
  3 (cold) and XLR pin 1 (shield/ground)."
details: |-
  The Benchmark RCA to XLRM Adapter Cable converts unbalanced analog RCA outputs to balanced analog XLR inputs, making it the correct choice when connecting consumer or prosumer RCA-equipped sources to professional balanced XLR inputs. The wiring follows a back-referenced audio ground scheme: the RCA center pin connects to the star-quad positive conductors and XLR pin 2 (hot); the RCA ring connects to the star-quad negative conductors and XLR pin 3 (cold); and the RCA ring also connects to the shield braid, which terminates at XLR pin 1 (shield/ground).

  Constructed with Canare StarQuad L-4E6S cable, the four 24 AWG 40-strand copper conductors are arranged in a star-quad configuration that provides effective rejection of interference. The high-density (>95%) TAC braided copper shield, gold-contact Neutrik premium connectors, cross-linked PE insulation, and hand-assembled silver-solder construction in the USA reflect Benchmark's commitment to professional-grade build quality.

  Available in 3-foot and 6-foot lengths; cables are sold individually. For analog audio only — do not use with digital signals.
specs: |-
  - Connectors: RCA-Male (input), XLR-Male (output), Neutrik gold-contact premium series
  - Cable: Canare StarQuad L-4E6S
  - Conductors: 24 AWG, 40-strand copper x 4 (21 AWG effective per paired conductors)
  - Insulation: Cross-linked PE, flexible in extreme cold
  - Shielding: High-density (>95%) TAC braided copper shield
  - Conductor DC resistance: <29.9 Ohms/1000 ft
  - Shield DC resistance: <9.1 Ohms/1000 ft
  - Capacitance (conductor pair): 46 pF/ft
  - Capacitance (conductors to shield): 56 pF/ft
  - Nominal impedance: 44 Ohms
  - Pin wiring: RCA tip to star-quad + to XLR pin 2 (hot); RCA ring to star-quad - to XLR pin 3 (cold); RCA ring to shield to XLR pin 1 (ground)
  - Solder: Silver solder
  - Assembly: Hand assembled in USA
  - Lengths available: 3 ft, 6 ft
  - For analog audio only — do not use with digital signals
