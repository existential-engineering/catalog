details: |-
  Pedaltrain Deluxe MX Soft Case for Terra 42 You have a Pedaltrain Terra which says a lot about you. Namely, that you have a lot of pedals. You are in the upper echelon of pedal addicts, and we salute you! We made a case worthy of your pursuit. This is a big case with a big exterior accessory compartment. We can't promise you will enjoy carrying your Terra over your shoulder, but we thought you might want to try. So, there's a padded shoulder strap with swivel clasps that have been repetitive machine stress-tested to 44 lbs (20 kg) each, and rivet-reinforced attachment points on the case. So if you need a case for your Terra, this is the one to get. Durable construction, quality components, extra depth for taller pedals, padded strap and a great price. Features: Main Compartment Interior Dimensions: 42" x 15" x 6" (107 x 38 x 15 cm) Accessory Pouch Outer Dimensions: 21" x 14" x 1.5" (53 x 35 x 4 cm) Model: PT-TER-MX-X
specs: |-
  - Familiar Pedaltrain soft case styling
  - Exterior accessory storage pocket (sizes vary by model)
  - Platinum SBS zippers on main compartment and accessory storage pocket
  - Premium shoulder strap with padded shoulder pad and enhanced swivel clasp
  - Easy-wipe interior
  - Water-resistant exterior shell
  - Deeper case, 6" or 15cm height (including lid height), for extra-tall pedals on all elevated Pedaltrain models
