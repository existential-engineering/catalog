description: IEEE DCB to DCB leads
details: |-
  A 2 metre lead with a 14 pin IEEE DCB connector at each end, for joining two pieces of Roland DCB equipment directly together.

  The one-direction version carries the control signal from DCB device A to DCB device B only, which suits a fixed arrangement such as a sequencer that always plays a synthesiser. An MD-8 controlling a Juno-60 is the example given. Reversing the direction of control means unplugging the lead and swapping the ends over.

  A both-directions version of the same lead is also sold. It passes signal from A to B and from B to A, so an MD-8 can control a Juno-60 and the Juno-60 can control the MD-8 without the ends being swapped.

  Neither lead is intended for connecting to a Pro-DCB, Pro-2000 or Pro-4. Those converters take the leads listed under Kenton Connect Leads instead.
specs: |-
  - Length: 2 metres
  - Connectors: 14 pin IEEE DCB at both ends
  - One-direction version passes signal from device A to device B only
  - Both-directions version passes signal either way without swapping ends
  - Not for use with Pro-DCB, Pro-2000 or Pro-4 converters
