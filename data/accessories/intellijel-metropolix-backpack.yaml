description: Make Metropolix the MIDI Hub of your eurorack case. The Metropolix
  Backpack Hardware MIDI communication with Metropolix through Intellijel
  Palette or 7U Performance Case built-in MIDI IN/OUT and USB Jacks.
details: |-
  The Metropolix Backpack adds a 10-pin header to the back of Metropolix for connecting to the Intellijel 10-pin header on Intellijel cases, making Metropolix the MIDI hub of the case.

  MIDI on Metropolix runs alongside its classic CV/GATE modulation without interfering, letting the sequencer drive external hardware synths and software plugins at the same time as internal patching.
specs: |-
  - Adds a 10-pin header to the back of Metropolix for connecting to the Intellijel 10-pin header on Intellijel cases
  - 4U Palette Cases: TRS MIDI IN and OUT, USB MIDI
  - 7U Performance Cases: 5-Pin MIDI In, Out and Thru, USB MIDI
  - MIDI Clock In and Out, syncable with external hardware or a DAW
  - MIDI Notes and CC Modulation output from both Metropolix tracks
  - CC Modulation output from 8 Mod Lanes
  - Deep support for configuring Slide (Glide/Portamento)
  - Mounts directly onto the power header of Metropolix, secured with a screw
  - USB port extended and connected via an included cable
  - GX expander cannot be connected while the Backpack is installed
