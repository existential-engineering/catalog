description: iPad cable for the DDJ-WeGO and DDJ-ERGO
details: |-
  Use the WeCAi cable to connect a DDJ-WeGO or DDJ-ERGO to your iTunes library on a mobile device running Algorridim's djay 2 app. Or get to grips with video mixing using Algorridim's vjay app.

  USB power supply
  The WeCAi includes a USB connection for supplying power to the WeGO/ERGO via a standard USB power adaptor or a USB mobile battery, so you can play out even where traditional power sources cannot reach.
