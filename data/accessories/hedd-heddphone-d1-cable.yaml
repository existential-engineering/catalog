details: |-
  The official audio cable for the HEDDphone D1. It is a premium textile-covered TRS cable terminating in dual 3.5 mm mono connectors for the headphone, with a 6.35 mm adapter included for larger amplifier inputs. The cable is 2 meters long and ships with a branded drawstring cable pouch. Backed by a 5-year warranty.
specs: |-
  - Cable type: TRS 3.5 mm textile-covered premium cable
  - Length: 2 meters
  - Connectors: dual 3.5 mm mono (headphone side)
  - Adapter included: 6.35 mm
  - Accessories: branded drawstring cable pouch
  - Warranty: 5 years
