details: |-
  The Trolley Bus is Befaco's flagship Eurorack power distribution system, engineered to meet the demands of contemporary, power-intensive modular setups. Built around four high-quality DC-DC converters, it distributes power across 28 slots, delivering +12V at 5A, -12V at 2.5A, and +5V at 4A — enough headroom for fully loaded systems.

  The bus board uses horizontal connectors rather than vertical ones, a deliberate design choice that reduces the height clearance required behind the modules. The board measures 423mm × 80mm with a profile of just 25mm over the regulator grid and 15mm elsewhere, making it compatible with a wide range of shallow Eurorack cases.

  Power is supplied via an included 135W power brick with a 2.5mm barrel connector (center positive). The plug-and-play design requires no tools or soldering for the assembled version, lowering the barrier to a clean and reliable power installation.

  The companion ON/OFF module is a 3U, 4HP panel that mounts in the rack itself. It provides a front-panel power button for safe startup and shutdown sequencing, along with two USB-A charging ports — useful for powering tablets, phones, or other accessories at the studio desk.

  Designed and assembled in Barcelona, the Trolley Bus is available both fully assembled and as a DIY kit, following Befaco's open-source hardware philosophy.
