description: Portable studio-grade power conditioner and surge protector (Danish Type K)
details: |-
  The PG-P Type K is a portable power conditioner featuring PG-P Filtering Technology with premium Panasonic capacitors for high-frequency noise elimination. It delivers an average of 3x the noise filtering of other portable power conditioners at the same price point, providing the same noise filtering found in the majority of the world's rack-mount power conditioners. Designed for studio use on the go, it features six wall-wart spaced outlets. This variant uses Type K (DS 60884-2-D1) Danish plugs for the Danish market.
specs: |-
  - Outlets: 6 × Type K (wall-wart spaced)
  - Plug Standard: DS 60884-2-D1 (Type K, Danish)
  - Filtering: PG-P Filtering Technology
  - Capacitors: Premium Panasonic
