description: >-
  Juice Bus is a discontinued ultra-narrow Eurorack power busboard accommodating
  up to 20 modules via dedicated pin connectors, with an optional on-board 5V
  converter from +/-12V for digital modules. The board can be split into an
  11-connector main and 9-connector secondary section. Dimensions: 410×30×18mm.
  Handmade in Brno, Czech Republic.
