description: A HEDD steel mounting adapter that connects TYPE 05 monitors (MK1,
  MK2, and A-CORE) to IsoAcoustics V120 L- or C-brackets for ceiling and wall
  installation.
details: |-
  The M05 is an installation adapter designed to connect HEDD's compact TYPE 05 monitors, including MK1, MK2, and A-CORE models, to IsoAcoustics V120 brackets for ceiling or wall mounting. It enables easy installation and removal without damaging the monitor.

  The solution provides flexible mounting for front and surround playback in smaller rooms or as an overhead solution in larger Atmos installations. The mount can be tilted and rotated to suit specific immersive audio environments.

  The adapter features strong steel construction and works with IsoAcoustics' isolation technology, tested at Canada's National Research Council, which reduces vibrations and internal reflections to improve stereo imaging and spatial sound quality.
specs: |-
  - Compatibility: all TYPE 05 models (MK1, MK2, A-CORE); IsoAcoustics V120 mounts with L- or C-brackets
  - Material: steel mounting plate
  - Dimensions: 120 mm length x 143 mm width x 25 mm height
  - Weight: 0.28 kg
  - Warranty: 2 years (IsoAcoustics)
