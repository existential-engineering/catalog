  DESCRIPTION

  Your new Rivolta deserves top-tier protection. The Rivolta Custom Hard Case offers just that, combining robust, reliable construction to safeguard your instrument from dust, debris, and bumps on the road. Its heavy-duty latches ensure a secure closure, so you won't have to worry about accidental openings or slips. Inside, the Rivolta Custom Hard Case features a luxurious, silky plush lining, plus a convenient accessory compartment to store picks, strings, tuners, and anything else you need for your next performance. Note : These Rivolta Cases are intended to ship along with current spec (2024 onward) Rivolta Guitars. FEATURES
