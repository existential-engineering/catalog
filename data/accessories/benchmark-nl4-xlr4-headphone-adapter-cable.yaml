description: A 3-foot adapter cable that connects the AHB2 power amplifier's NL4
  speaker output to a 4-pin XLR headphone jack, enabling the AHB2 to function as
  a high-voltage headphone amplifier for low-sensitivity planar magnetic
  headphones.
details: |-
  The NL4-XLR4 Headphone Adapter Cable is a 3-foot cable terminated with a Neutrik NL4 (Speakon) connector on the amplifier end and a 4-pin XLR connector on the headphone end. It routes the balanced stereo output of the AHB2's speaker terminals directly to a balanced headphone connection, delivering up to 28.28 Vrms per channel at full output.

  The cable is purpose-built for driving low-sensitivity planar magnetic headphones such as the HiFiMAN HE6, HE6se, and Susvara, which require more drive voltage than a conventional headphone amplifier can provide. The AHB2 paired with this cable delivers approximately 9 to 10 dB higher drive voltage than the HPA4 headphone amplifier.

  Important: do not connect or disconnect headphones while the AHB2 is powered on, as transient voltages can damage headphone drivers. This cable is not suitable for high-sensitivity headphones such as the Sennheiser HD 800 S, which the AHB2 could drive well beyond their rated limits. Compatible with AHB2 Power Amplifier only — not compatible with HPA4.
specs: |-
  - Connector (amplifier end): NL4 Neutrik Speakon 4-pin
  - Connector (headphone end): 4-pin XLR balanced
  - Length: 3 feet
  - Maximum output voltage: 28.28 Vrms per channel at full output
  - Compatible amplifier: AHB2 only (not HPA4)
  - Recommended for: low-sensitivity planar magnetic headphones (e.g., HiFiMAN HE6, HE6se, Susvara)
