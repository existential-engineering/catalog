description: A one socket upgrade kit that adds a filter control socket to the
  Yamaha CS-10, so the low pass filter cutoff can be voltage controlled from the
  auxiliary output of a Kenton MIDI to CV converter. The synthesiser already has
  suitable CV (Hz/V) and Gate (S-Trig) sockets.
details: |-
  A one socket upgrade kit for the Yamaha CS-10 that adds a filter control socket. The synthesiser already has suitable CV (Hz/V) and Gate (S-Trig) sockets, so those do not need to be added.

  The extra socket lets the cutoff frequency of the synthesiser's low pass filter be voltage controlled, typically from the auxiliary output of a MIDI to CV converter such as the Pro-Solo mkII, Pro-USB or Pro-2000 mkII. Filter cutoff can then be driven from any continuous controller, or from other MIDI messages such as aftertouch or velocity.

  For a complete connection, the CS-10's CV (Hz/V) input goes to the CV output of the converter with Hz/V scaling selected in the converter menu, and the S-Trig input goes to the Gate output of the converter with S-Trig and 5V pullup selected. The filter input goes to the auxiliary output of the converter, controlled by CC#16 by default.

  The kit contains the components, the 3.5mm mono jack socket and diagrams for connecting the wires and components. Fitting is a job for a competent synthesiser service engineer.
specs: |-
  - Adds one socket: low pass filter cutoff control
  - For the Yamaha CS-10, which already has CV (Hz/V) and Gate (S-Trig) sockets
  - Input is on a 3.5mm mono jack socket
  - Filter input is driven from the auxiliary output of the converter
  - Filter cutoff is controlled by CC#16 by default
  - Requires Hz/V scaling and S-Trig with 5V pullup selected in the converter
  - The kit adds a socket only and has no power input of its own
