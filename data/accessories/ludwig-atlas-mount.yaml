url: https://www.ludwig-drums.com/en-us/ludwig/products/Hardware/accessories/atlas-mount
description: >-
  The A.T.L.A.S. Mount (LAPAM1) is the world's only integrated lug suspension
  system and mounting bracket (patent pending). It enables drum mounting without
  drilling into the shell by replacing an existing lug, providing both
  suspension and a mounting bracket in one unit.
details: |-
  No drilling required — attaches by replacing an existing lug

  Functions as both suspension system and mounting bracket

  Universal compatibility with lug hole spacing from 25mm to 43mm

  Compatible with Ludwig Small & Large Classic lugs and Keystone Lugs

  Patent pending integrated design
specs: |-
  - Model: LAPAM1
  - Lug Hole Spacing: 25mm to 43mm
  - Compatible Lugs: Ludwig Small Classic, Large Classic, and Keystone Lugs
