details: |-
  Sontronics Omni Capsule

  The omnidirectional capsule for the Sontronics STC-1 and STC-1S microphones provides a natural, open sound ideal for capturing ambient audio, room acoustics, or group performances. With its 360-degree sensitivity, this capsule picks up sound equally from all directions, making it perfect for recording in less controlled environments or when you want to capture the full atmosphere of a performance. Whether you're recording instruments, vocals, or environmental soundscapes, the omnidirectional capsule ensures accurate and transparent audio reproduction. The silver finish seamlessly matches your STC-1 or STC-1S mic, keeping the professional aesthetic intact.
