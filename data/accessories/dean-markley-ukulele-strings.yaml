details: |-
  Dean Markley Banjo strings have been a long and well known tradition since 1972. Used on countless hit records and loved by the worlds best artists for decades. Our Banjo strings give you the tone you want regardless of whether you have a strong or light pick attack. Our unique winding process gives you a great blend of harmonics that play to your style instead of influencing your tone. Our strings work with you to ensure you sound how you want to sound. And they last a long time too!
