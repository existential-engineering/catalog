details: |-
  Note for international orders: Please inquire with a local Rossum dealer to save on replacement OLED kit shipping costs. This is a replacement OLED display for Rossum Electro-Music's Assimil8or module. The display comes pre-mounted on a circuit board for easier installation. Note: Installation requires removal of the front panel of the module. Instructions are available here: https://www.rossum-electro.com/support/documentation/ (This listing is for the Assimil8or Replacement OLED Kit only. The eurorack module is not included.)
