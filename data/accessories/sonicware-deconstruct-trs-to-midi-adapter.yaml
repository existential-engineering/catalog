name: deconstruct 3.5mm TRS to MIDI Adapter
manufacturer: sonicware
primaryCategory: cable
url: https://sonicware.jp/products/deconstruct-trs-to-midi-adapter
description: A passive TRS-to-MIDI conversion adapter set compatible with all
  deconstruct models. It includes two Type-A MIDI (5-pin DIN female) to 3.5mm
  TRS male adapters, bridging MIDI devices that use 3.5mm TRS and 5-pin DIN
  connectors for both input and output.
details: |-
  This TRS to MIDI conversion adapter is compatible with all deconstruct models. It includes two Type-A MIDI female to 3.5 mm TRS male adapters and enables connection between MIDI devices with 3.5 mm TRS and 5-pin DIN connectors. Compatible with a wide range of equipment, including drum machines, synthesizers, and DAW controllers, it supports both MIDI input and output for flexible device connectivity. Its compact, lightweight design makes it easy to carry and use on the go.
