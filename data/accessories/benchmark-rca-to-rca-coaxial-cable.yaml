description: Precision 75-ohm coaxial cable hand-assembled in the USA with
  Canare RCA connectors and true silver solder, suited for S/PDIF digital audio,
  AES, analog audio, and analog video.
details: |-
  The Benchmark RCA to RCA Coaxial Cable is a precision-built interconnect for demanding digital and analog audio applications. Constructed with ultra-low attenuation, low-jitter coax and terminated with Canare RCA connectors, it maintains accurate 75-ohm impedance throughout the signal path to minimize internal reflections, pulse rounding, bit-errors, and jitter in digital audio systems.

  Each cable is hand-assembled in the USA using true silver solder, ensuring a reliable, low-resistance connection. Flexible boots on the Canare connectors protect the termination points and make the cable practical in tight spaces behind equipment. Suitable for S/PDIF, AES, multiplexed digital audio formats, as well as analog audio and analog video.

  Cables are sold individually; order two for stereo pairs. Available in five lengths: 3, 6, 10, 15, and 20 feet.
specs: |-
  - Connectors: Canare RCA male to RCA male with flexible boots
  - Impedance: 75 ohms
  - Cable: Ultra-low attenuation and return loss coaxial
  - Solder: True silver solder
  - Assembly: Hand assembled in USA
  - Applications: S/PDIF, AES, multiplexed digital audio, analog audio, analog video
  - Lengths available: 3 ft, 6 ft, 10 ft, 15 ft, 20 ft
