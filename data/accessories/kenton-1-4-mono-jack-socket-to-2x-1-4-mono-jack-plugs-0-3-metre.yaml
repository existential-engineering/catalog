description: 1/4" mono jack socket to two 1/4" mono jack plugs. Splits a single
  signal into two. Ideal for monophonic synthesisers that have independent
  inputs for each of two oscillators, such as CS-15 and CS40m.
details: |-
  A 0.3 metre splitter lead terminating in one 1/4" mono jack socket at one end and two 1/4" mono jack plugs at the other. The single socket accepts an incoming signal and passes it to both plugs, splitting one control signal into two destinations.

  The intended use is a monophonic synthesiser whose two oscillators have independent control inputs, such as the Yamaha CS-15 and CS40m, where one control voltage has to reach both oscillator inputs at once.

  The lead splits the signal at the synthesiser end only. Connecting it to a Kenton MIDI to CV converter also requires a 3.5mm mono jack to 1/4" mono jack lead, and a pair of splitters is normally needed, one carrying the Hz/V control voltage and one carrying the gate (trigger or S-trigger) signal.
specs: |-
  - Length: 0.3 metre
  - Connector A: 1 x 1/4" mono jack socket
  - Connector B: 2 x 1/4" mono jack plugs
  - Splits one signal into two
