description: Best-of-class 1U rackmount power conditioning for professionals on a budget
details: |-
  The PG-X Type C is a 1U rackmount power conditioner featuring Black Lion Audio's PG-90 Filtering Technology, which achieves approximately 90% noise filtering versus the industry standard of 76%. It provides surge protection, power filtering, and improved audio quality for connected gear. The unit runs on 220VAC with a fixed Type C mains cable and includes 8 filtered/surge-protected rear outlets, 1 switched front convenience outlet, and a USB Type A charging port on the front panel.
specs: |-
  - Form Factor: 1U Rackmount
  - Voltage: 220VAC, 15A max
  - AC Mains Input: Fixed Type C cable
  - Front Outlets: 1 × Schuko (switched convenience)
  - Rear Outlets: 8 × Schuko (switched, filtered, surge-protected)
  - Noise Filtering: ~90% (PG-90 Filtering Technology)
  - USB Charging: 1 × USB Type A (front panel)
  - Height: 44mm (1U)
  - Width: 438mm (19")
  - Depth: 167mm
  - Weight: 2.7 kg
