details: |-
  Whether you're working with Flow Studio, Console 1 Compact, Console 1 Channel Mk III, or Console 1 Fader Mk III, you'll get ideal ergonomics with Softube's stylish single stand.

  One stand, multiple options. The stand holds a single Softube hardware unit at a fixed angle, and ships with the custom screws needed to mount it plus a strap that keeps the unit's cables out of the way.
