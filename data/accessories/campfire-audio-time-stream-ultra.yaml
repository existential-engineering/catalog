details: |-
  Campfire Audio's new Time Stream: Ultra is a premium audio cable. It blends SPC and pure copper conductors to create a balanced sonic signature, while its large gauge allows for increased speed and resolution. Expand and enhance your favorite IEM's performance with this comfortable, durable, and high-performance cable. Ultra-high-definition large gauge IEM cable

  Eight 24 AWG conductors (Four silver-plated copper & four pure copper)

  Collective total gauge of 15 AWG

  Durable PVD aluminum termination housings

  Gold-plated terminations

  Custom-matrix MMCX connectors
