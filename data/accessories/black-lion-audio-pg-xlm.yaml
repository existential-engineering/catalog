description: The PG-XLM is a rackmount power conditioner and surge protector
  featuring Black Lion Audio's PG-90 Filtering Technology, delivering an average
  of 90% noise filtering. It includes eight switched, filtered, and
  surge-protected rear outlets, a front convenience outlet, USB charging port,
  pull-out dimmable LED lights, and an LED voltage meter.
details: |-
  Black Lion Audio developed the PG-XLM by refining industry-standard designs, recognizing that budget-conscious professionals wanted best-in-class power conditioning without premium pricing. The PG-XLM features eight switched, filtered, and surge-protected outlets on the rear panel, plus one front-panel switched convenience outlet and a USB Type A charging port. Its primary differentiator is PG-90 Filtering Technology, which delivers an average of 90% noise filtering — outperforming typical competitors that average 76% at similar price points. Additional features include pull-out dimmable LED lights and an LED voltage meter display.
specs: |-
  - PG-90 Filtering Technology — 90% average noise filtering
  - 8 rear switched, filtered, surge-protected outlets
  - 1 front switched convenience outlet
  - 1 USB Type A charging port
  - Pull-out dimmable LED lights
  - LED voltage meter display
  - Output Current: 15A
  - Power Source: Fixed AC cable
  - Form factor: 1U rackmount
  - Dimensions: 19" W x 1.7" H x 9.8" D
  - Weight: 3 lbs
