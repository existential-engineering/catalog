description: A speaker cable designed exclusively for musical instruments, built
  to convey the character of a guitar or bass amplifier completely to the
  speaker.
details: |-
  A speaker cable transmits electrical signals from the guitar or bass amplifier to the speaker after tone adjustment and amplification. It is an important component since it is used for the final output of sound and it influences the entire performance of the sound system. The CS-8037 is a speaker cable designed exclusively for musical instruments that can convey the character of a guitar or bass amplifier completely to the speaker and bring the sound system one step higher.

  It was developed to allow an amp head or power amplifier to drive speakers at full power. The OFC conductor is adopted to realize high-resolution clear sound, and the wires are twisted in order to stabilize HF performance and provide tonal character that matches guitar and bass sound well. Ample current capacity can improve the performance of the amplifier and the speaker.

  The cable measures 8.00 mm in diameter over a 2.00 mm2 conductor, with a maximum conductor resistance of 9.40 ohm/km. The unique wave shape groove cut in the plug aids with smooth plugging and unplugging.

  Three plug configurations are sold in parallel: Phone/Phone (PH/PH), Phone/SpeakON (PH/SP) and SpeakON/SpeakON (SP/SP). Each configuration is available in 0.7 m, 1 m and 1.5 m lengths.
specs: |-
  - Conductor size: 2.00 mm2
  - Construction: 2x 37/0.26A OFC (No/mm), dia 1.80 mm
  - Insulation thickness: 0.60 mm (plus or minus 0.05)
  - Shield diameter: 3.00 mm
  - Jacket thickness: 1.00 mm (plus or minus 0.10)
  - Diameter: 8.00 mm
  - Maximum conductor resistance (20 degrees C): 9.40 ohm/km or less
  - Capacitance (1 kHz): approx. 147 pF/m
  - Plug types: Phone/Phone (PH/PH), Phone/SpeakON (PH/SP), SpeakON/SpeakON (SP/SP)
  - Plug orientation: Straight/Straight (S/S)
  - Lengths: 0.7 m, 1 m, 1.5 m
