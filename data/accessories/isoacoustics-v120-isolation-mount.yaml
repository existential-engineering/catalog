name: V120 Isolation Mount
manufacturer: isoacoustics
primaryCategory: acoustic-treatment
url: https://isoacoustics.com/pro-audio-isolation-products/v120-mount/
description: The IsoAcoustics V120 Isolation Mount is the base ceiling and wall
  mount for HEDD monitors, decoupling wall- or ceiling-mounted speakers to
  eliminate unwanted vibration for improved clarity and transparency.
details: |-
  The IsoAcoustics V120 Isolation Mount is the starting point for any setup involving HEDD monitors. It isolates, decouples, and eliminates unwanted vibrations from wall- or ceiling-mounted monitors, enhancing sound clarity and transparency.

  Its patented isolation technology reduces vibration transfer, and with optional adapters it provides up to 360° of horizontal rotation. A mounting plate is included.

  Compatible with the entire HEDD monitor range and works with IsoAcoustics V120 brackets, adapters, and clamps. Supports speakers up to 18.1kg (40lbs).
specs: |-
  - Dimensions: 117mm x 117mm x 90mm (4.6" x 4.6" x 3.5")
  - Weight: 0.77kg (1.7lbs)
  - Load capacity: up to 18.1kg (40lbs)
  - Up to 360° of horizontal rotation with optional adapters
  - Includes a mounting plate
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with the entire HEDD monitor range and IsoAcoustics V120 brackets, adapters, and clamps
