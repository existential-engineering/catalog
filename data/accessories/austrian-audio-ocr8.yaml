description: The OCR8 is a Bluetooth dongle that enables wireless control of the
  OC818 microphone. It pairs with the free PolarPilot smartphone app to let
  engineers and musicians remotely control polar patterns, pad settings, and
  high-pass filter settings in real time.
details: |-
  The OCR8 attaches to the OC818 and establishes a Bluetooth connection to a mobile device running the PolarPilot app. This allows full remote control of the OC818's key parameters — polar pattern selection, pad attenuation, and high-pass filter — without physically touching the microphone.
specs: |-
  - Compatibility: OC818 microphone
  - Wireless: Bluetooth
  - App: PolarPilot (smartphone)
  - Controls: Polar pattern, pad, high-pass filter
