details: |-
  The FS-HTM D4 is a purpose-built stand from Bowers & Wilkins designed to support the flagship HTM81 D4 and HTM82 D4 centre-channel loudspeakers from the 800 Series Diamond range. By raising the centre channel to the correct listening height and providing a stable, resonance-controlling base, the stand helps owners get the best performance from their centre speaker in a home-theatre setup.

  The stand is offered in two finishes — Silver and Black — so the colourway can be matched to the speaker cabinet and surrounding equipment. It is positioned within the Bowers & Wilkins accessories lineup alongside other dedicated speaker stands such as the FS-805 D4 and FS-700 S3.

  Bowers & Wilkins publishes assembly instructions as a downloadable PDF, indicating that the stand ships as a flat-pack/modular product that the customer assembles on arrival.
