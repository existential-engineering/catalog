details: |-
  FS-HTM D4 is a dedicated floor stand for the Bowers & Wilkins HTM81 D4 and HTM82 D4 centre channel speakers. Bowers & Wilkins says owners of either model can get the best from their centre speaker with this stand, which fits both perfectly, and presents it as the flagship HTM81 D4 or HTM82 D4 centre-speaker stand.

  The stand is offered in two finishes, Black and Silver, so it can be matched to the centre speaker it carries. Unlike the stereo stands in the range it is priced as a single unit, and Bowers & Wilkins publishes a downloadable assembly instructions document for it.
specs: |-
  - Dedicated centre-speaker stand for the Bowers & Wilkins HTM81 D4 and HTM82 D4
  - Fits both HTM81 D4 and HTM82 D4
  - Finishes: Black, Silver
  - Sold as a single stand
