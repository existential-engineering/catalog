description: 2x3.5mm mono jacks to 3.5mm TRS stereo jack, 3m in length, ideal
  for connecting Kenton MIDI to CV converters to the Korg Volca Modular - for
  more Info see the Korg Volca Modular Find My Synth page.
details: |-
  A 3 metre lead carrying two 3.5mm mono jacks at one end and a single 3.5mm TRS stereo jack at the other, so two separate control signals travel over one stereo connection.

  It is intended for connecting a Kenton MIDI to CV converter to the Korg Volca Modular, whose control input is on a single TRS minijack. The two mono ends take the converter's separate control voltage and gate outputs.

  Further wiring detail for that instrument is covered on the Korg Volca Modular entry of the Find My Synth pages.
specs: |-
  - Length: 3 metres
  - Connector A: 2 x 3.5mm mono jack
  - Connector B: 1 x 3.5mm TRS stereo jack
  - Wired for the Korg Volca Modular control input
