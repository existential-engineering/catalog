details: |-
  RE-201 CHORUS VIBRATO - DIY MOD KIT

  Key Features

  Analog BBD Chorus Vibrato

  Direct Signal Off Mode (For 100% wet echo, spring reverb or Vibrato)

  Motor ON/OFF Mode

  Introducing our latest development: the DIY Analog BBD CHORUS MOD for the Roland RE-201. With careful attention to detail, we have successfully created a rich chorus sound that beautifully complements the RE-201's tone. This MOD also has convenient switches for Direct and Motor ON/OFF modes, allowing for a 100% wet echo, wet spring reverb, vibrato, and motor slow down / speed up effect. We supply a new painted metal front panel cover that houses the chorus PCB, switches and potentiometers, eliminating the need for drilling and allowing you to take the RE-201 back to original condition without any damage. If you did want to install the MOD on the original RE-201 Metal plate we supply a drilling template for this as well. Easy installation with 11 solder points. Instruction Guide - Install Instructions
