description: The Befaco Y Splitter Stereo to Mono is a short passive cable
  adapter that splits a single stereo 3.5mm TRS jack plug into two separate mono
  3.5mm TS jack sockets. At 10 centimeters in length, it is designed for use in
  Eurorack and modular synthesizer environments where stereo sources need to be
  routed to two independent mono signal paths. Each pack contains two cables in
  a two-tone black and red color scheme for easy left/right identification.
details: |-
  The Befaco Y Splitter Stereo to Mono cable is a simple but essential utility accessory for modular synthesizer setups. It takes a single stereo TRS 3.5mm plug and splits it into two individual mono TS 3.5mm sockets, allowing a stereo output — such as from a smartphone, audio interface, or stereo module — to feed two separate mono inputs in a Eurorack patch.

  The cable's compact 10cm length keeps it tidy in a modular rig without creating excess slack. The two-tone black-and-red color coding makes it easy to distinguish the left (tip) and right (ring) channels at a glance, reducing patching errors in a dense modular environment.

  Befaco packages these cables in sets of two, making them practical for common stereo-to-dual-mono splitting scenarios. Being entirely passive, no power is required and there is no signal conditioning — the cable is a straight electrical split from the TRS tip and ring to the individual TS plugs.

  This type of adapter is widely used for connecting stereo audio sources (headphone outputs, consumer electronics, mixers) into Eurorack systems that expect mono 3.5mm patch cable connections, or for splitting a stereo synthesizer output into two distinct mono channels for separate processing.
