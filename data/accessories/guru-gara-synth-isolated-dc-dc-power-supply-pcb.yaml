description: A compact isolated power supply PCB designed for use with
  industry-standard encapsulated DC/DC converter modules, providing a stable
  bipolar output with input and output filtering for low-noise operation.
details: |-
  This compact isolated power supply PCB is designed for use with industry-standard encapsulated DC/DC converter modules ("power bricks") from manufacturers such as RECOM, Traco Power, and Hi-Link. The board accepts a single DC input via the DC/DC module and provides a stable bipolar output, making it particularly well-suited for Eurorack and other analog audio applications where clean, isolated ± supply rails are required. To ensure low noise and smooth operation, the PCB incorporates input and output filtering capacitors and ferrite beads, improving ripple suppression and overall power stability beyond the DC/DC module alone. With a compact footprint of 35 mm × 63 mm, this board offers a space-efficient and reliable power solution for small to medium-sized projects.
specs: |-
  - Isolated DC/DC power supply PCB (module not included)
  - Compatible with standard 2″ × 1″ encapsulated DC/DC converter modules (e.g. RECOM, Traco Power, Hi-Link)
  - Single DC input with bipolar (±) output
  - Optimized for Eurorack power applications
  - Output filtering with capacitors and ferrite beads for reduced noise and ripple
  - Stable and smooth supply rails
  - Compact PCB size: 35 mm × 63 mm
