description: Studio-grade power conditioner and surge protector for Type F
  (Schuko) European/Russian markets
details: |-
  The PG-1 Type F mkII is the European/Russian market variant of the PG-1 mkII, using a Schuko Type F combination plug for 230V power grids. It provides six switched, filtered, and surge-protected outlets organized into three groups: Digital Audio, Analog Audio, and High Current. Time-delayed High Current outlets prevent speaker pop during startup.

  The unit utilizes PG-99 Filtering Technology with premium Panasonic and Wima capacitors, achieving an average of 99.7% noise filtering compared to the typical 85% found in competing products at similar price points. Features include a voltage meter, LED status indicators for grounding, polarity, noise filtering, abnormal voltage, and surge protection, plus an audio alarm for unsafe voltage and an XLR lamp connection on the front panel.
specs: |-
  - PG-99 Filtering Technology — 99.7% average noise filtering
  - Premium Panasonic and Wima capacitors
  - 6 switched, filtered, surge-protected outlets (3 groups: Digital Audio, Analog Audio, High Current)
  - 2 front filtered convenience outlets
  - XLR lamp connection (front panel)
  - Time-delayed High Current outlets
  - 2775 joules power absorption (surge protection)
  - Voltage meter and LED status indicators
  - Audio alarm for unsafe voltage conditions
  - Voltage: 230V AC, 10A max
  - AC Mains Input: Schuko Type F combination plug
  - Form factor: 1U rackmount
  - Dimensions: 483mm W x 44mm H x 250mm D
  - Weight: 4.2 kg
