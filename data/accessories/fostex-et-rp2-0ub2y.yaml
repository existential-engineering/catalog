description: Unbalanced headphone cable included as standard with the T60RPmk2 series, 2 m long, using a flexible and easy-to-handle PVC sheath.
details: |-
  Unbalanced cable included as standard with the T60RPmk2 series. It uses a flexible and easy-to-handle PVC sheath and is 2 m long.

  The cable is high sound quality OFC (oxygen free copper) and the plug has a gold plated finish. Supported models are the T60RPmk2 and T60RPmk2CL.
specs: |-
  - Cable: High sound quality OFC (Oxygen Free Copper)
  - Plug: Gold plated finish
  - Sheath: PVC
  - Length: 2.0m
  - Weight: approx. 50g
  - Supported models: T60RPmk2 / T60RPmk2CL
