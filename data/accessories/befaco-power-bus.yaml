description: The Befaco Power Bus is a regulated Eurorack power distribution
  board featuring linear regulators on each rail (+12V, -12V, and 5V), each
  capable of delivering up to 1.5A with minimum noise leakage. It provides 14
  IDC 'Boxed' connectors for powering modules and includes faston blade
  connectors for daisy-chaining multiple units in larger systems. Designed and
  manufactured in Barcelona, it is available as a DIY kit.
details: |-
  The Befaco Power Bus is a purpose-built Eurorack power distribution solution designed to cleanly and reliably power modular synthesizer systems. At its core, the board uses linear voltage regulators on each power rail rather than switching regulators, a design choice that prioritizes low noise output — a critical factor when powering audio-rate and CV-processing circuitry where switching noise artifacts can introduce unwanted interference.

  Each of the three rails — +12V, -12V, and 5V — is regulated independently and rated for up to 1.5A of continuous current. This means a single Power Bus can support a healthy complement of modules before requiring expansion. The board provides 14 IDC 'Boxed' (shrouded) connectors, the standard ribbon cable format used throughout the Eurorack ecosystem, ensuring broad compatibility with virtually all commercial and DIY modules.

  For larger systems that exceed a single board's capacity, the Power Bus includes faston blade connectors that allow multiple units to be daisy-chained together. This makes it straightforward to scale power distribution as a system grows, without needing to move to a more complex centralized supply architecture.

  The Power Bus is offered as a DIY kit, consistent with Befaco's broader ethos of open, buildable electronics. Assembly instructions, schematics, and a connection guide are all available as PDFs from the Befaco website. The board is designed and manufactured in Barcelona, Spain.
