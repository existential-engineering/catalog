description: A USB dongle that adds Bluetooth 4.0 wireless connectivity to a PC,
  enabling it to connect to Bluetooth speakers, headsets, keyboards, mice, and
  other devices. It can act as both a transmitter and a receiver for audio and
  file transfer.
details: |-
  If your PC lacks Bluetooth or is an older model with outdated drivers, this handy USB Bluetooth adapter will do the trick. Works with Windows 7,8 and10

  Features:

  USB to Bluetooth adapter, easily adds wireless Bluetooth feature for your computer, enables the computer to connect more Bluetooth devices such as the stereo speaker, headset, keyboard, mouse, game controller and more. Plug & Play for Windows 10 and 8, supports Windows system from Windows XP, Win Vista, Win 7 with adaptive driver program that supports to manage the connected devices and ensure the maximum performance, CD driver disc included in the package. Transmitter and receiver at the same time, the Bluetooth USB dongle supports work as a transmitter to send the audio signal to your Bluetooth headset but also can be used as the receiver to receive files sending from smartphones and tablet over Bluetooth. Specifications:

  Bluetooth Version: 4.0 with EDR & CD-ROM- data transfer rate up to 3Mbps

  ISM Band: 2.4GHz

  Operation Range: Up to 10meters / 32feet

  Support A2D ( Advanced Audio Distribution Profile) and ARVCP (Audio/ Video Remote Control Profile)

  Bluetooth Low Energy protocol: Support

  Backward support classic Bluetooth V3.0/2.1/2.0/1.1

  The LED indicator indicates device status

  Supported Bluetooth Profiles:

  A2DP v1.2, GAP, HFPv1.5, HID OVER CATT, AVRCP V1.4, HSP V1.2, APTX, SPP V1.2, DUN V1.1 and OPP 2.2. Supported Operating System :

  Supported: Windows 10, 8.1, 8, 7, XP, Vista. Not Supported: ARM-Based Windows RT, Mac OS, Linux. Compatible Bluetooth Devices :

  Supported: Wireless Bluetooth-enabled devices, such as smartphones, keyboards, mice, headsets, headphones, speakers, printers, modems, etc. Not Supported: Home theater and automotive systems.
