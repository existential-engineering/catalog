details: |-
  A 'blank' ATTiny85 microcontroller, ready to have the firmware of your choice flashed to it. The ATtiny85 is an 8-bit AVR microcontroller known for its low power consumption and small size. It features 8KB of flash memory, 512 bytes of EEPROM, and 6 I/O pins. It operates at voltages between 1.8V and 5.5V (my modules almost always run it at 5V) and supports a maximum clock speed of 20MHz using an external oscillator (although you'll lose pins 2 and 3 to the oscillator). The USI interface supports both SPI and I2C protocols, and there are three pins which support PWM plus a 4-channel 10-bit DAC. The ATTiny chips are supported by the Arduino IDE via the ATTinyCore package ( https://github.com/SpenceKonde/ATTinyCore )

  These chips are supplied as-is - there is no bootloader installed by default, and they're in a DIP-8 package so they're easily breadboarded. I can supply surface-mount (SOIC-8) controllers if necessary, but please contact me in the first instance.
