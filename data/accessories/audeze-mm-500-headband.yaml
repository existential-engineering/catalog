details: |-
  The Audeze MM-500 features our newest headband design. Flexible and easily adjustable, this is the perfect fit for your gear.

  Fully tension adjustable with the included tools, these headbands provide hours of comfortable listening for the MM-500.

  Although this will fit the LCD-5, the material and construction differ, which leads to a difference in weight and clamping force. This is not compatible with our standard LCD headphones. For information about replacing and LCD-5 headphone, please contact support@audeze.com.

  Please note: The serial number of your MM-500 headphones is located on the headband. It is advisable to remove the serial number sticker from the old headband and replace it on your new one, or to keep the old headband in case of warranty service on your headphones.
