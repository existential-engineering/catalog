details: |-
  The Befaco Noodler is a purpose-built cable and accessory organizer designed for modular synthesizer performers who work standing at a mic stand. Befaco created it to solve the common problem of patch cables and small tools disappearing or becoming tangled during live sessions and studio work. The result is a compact, practical organizer that keeps everything within arm's reach without cluttering the modular case itself.

  Constructed from anodized aluminum, the Noodler is both lightweight (0.55 kg) and durable. Its 30 × 21 × 3 cm form factor is wide enough to hold a meaningful number of cables and accessories while remaining unobtrusive. The surface features multiple dedicated slots and compartments sized for common modular accessories: patch cables, Knurlies, star multiples, screwdrivers, and jack adapters all have designated homes.

  A standout design detail is the headphone hanger — a side wing specifically shaped to hold a pair of headphones securely. There is also a dedicated slot for Befaco's Synth Duster cleaning tool, which is included in the box.

  The mounting system uses a custom rotatable locking nut that attaches to any standard microphone stand. Users can choose between a fully locked, fixed orientation or a freely rotating position, allowing the organizer to be swung out of the way when not needed.
