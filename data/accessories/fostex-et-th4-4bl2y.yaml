description: 4.4 mm 5-pole balanced cable for the TH910, TH919, TH1000RPmk2 and TH1100RPmk2, with a flexible and easy-to-handle PVC sheath.
details: |-
  4.4 mm 5-pole balanced cable for the TH910, TH919, TH1000RPmk2 and TH1100RPmk2. It uses a flexible and easy-to-handle PVC sheath.

  The conductor is 7N grade (99.99999%) high purity OFC (oxygen free copper), the plug has a gold plated finish, and the cable is 2.0 m long.
specs: |-
  - Conductor: 7N Grade (99.99999%) High Purity OFC (Oxygen Free Copper)
  - Plug: Gold plated finish, 4.4mm 5-pole balanced
  - Exterior: PVC
  - Length: 2.0m
  - Supported models: TH910, TH919, TH1000RPmk2, TH1100RPmk2
