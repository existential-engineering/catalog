details: |-
  The Pop Filter is a magnet-mounted pop filter that fits directly on the face of the Ear Trumpet Labs Edwina, Delphina and Myrtle microphones.

  It incorporates a thin layer of foam and silk between screening and plates that exactly match the design of Edwina, Delphina and Myrtle, so it adds protection from plosives while blending seamlessly into the microphone's looks.

  That makes it well suited to close vocal work, with no worries about popping and no effect on the tone of the microphone. The standard built-in silk pop filter in Edwina, Delphina and Myrtle is effective for many uses and singers, but for close use on a loud stage the added protection of this filter helps. It snaps onto the face of the microphone with magnets and is just as easily removed.
specs: |-
  - Hand made pop filter designed for the Edwina, Delphina and Myrtle microphones
  - Thin foam and silk in wire screen control plosives without affecting tone
  - Perfectly matches Edwina/Delphina/Myrtle in design and materials
  - Magnets hold filter securely to the face of Edwina, Delphina, or Myrtle
  - Dimensions: 3" diameter
  - Includes neodymium magnets, which should be kept away from pacemakers
