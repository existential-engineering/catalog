details: |-
  Designed for dreadnought and concert-size guitars, the Breedlove Tour Mate Travel Case delivers serious protection with thoughtful, road-ready functionality. A fully padded compartment with adjustable neck and waist support keeps your instrument secure, while dedicated storage—including a laptop sleeve, organized main compartment for clothing and essentials, and multiple accessory pockets—lets you carry everything in one streamlined pack. Finished with premium hardware, a stowable ergonomic harness system, and an integrated rain cover, it's built for players constantly on the move.
