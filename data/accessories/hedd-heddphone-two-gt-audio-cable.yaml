id: phD61bHUABr4GMch1ub-w
name: HEDDphone TWO GT Audio Cable
manufacturer: hedd
primaryCategory: cable
url: https://hedd.audio/products/heddphone-two-gt-cable
description: Official replacement audio cable for the HEDDphone TWO GT,
  available as a single-ended unbalanced version (6.35mm to 3.5mm) or a balanced
  version (4.4mm to 3.5mm), in 4-core 5N SPC nylon-woven, hand-braided
  construction.
details: |-
  Official audio cable for the HEDDphone TWO GT. The unbalanced option is TRS single-ended, terminating in 6.35mm on the amplifier side and 3.5mm connectors on the headphone side. The balanced option is TRRRS, terminating in 4.4mm on the amplifier side and 3.5mm connectors on the headphone side.

  The cable uses 4-core 5N SPC conductors that are nylon-woven and hand-braided. Total length is 1.6m.

  Compatible with the HEDDphone D1, HEDDphone TWO and HEDDphone TWO GT.
specs: |-
  - Unbalanced: TRS single-ended, 6.35mm to 3.5mm
  - Balanced: TRRRS, 4.4mm to 3.5mm
  - Construction: 4-core 5N SPC, nylon-woven and hand-braided
  - Length: 1.6m
  - Compatible with HEDDphone D1, HEDDphone TWO and HEDDphone TWO GT
