description: BOB is a discontinued analog processing full Eurorack system by Bastl Instruments designed for live performance with a microphone stand mount and built-in Meanwell power supply. It includes nine modules — Quattro Figaro (quad VCA), Cinnamon (filter), Tromsø (downsampler), Dynamo (dynamics analyzer), Hendrikson ×2 (instrument interfaces), CV Trinity (modulation), Dup Dup (foot switch routing), and Clutch (attenuator/expression interface) — plus 12HP of expansion space. Hand-crafted in Brno, Czech Republic.
