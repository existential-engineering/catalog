description: Replacement AC/DC power adapter bricks for Intellijel cases and
  power supplies, available in 40W, 60W, and 90W versions.
details: |-
  For Intellijel Cases and Power Supplies. Built-in active PFC (Power Factor Correction) function, PF>0.91, for highest efficiency and minimum line-induced noise. Protection from short circuit, overload, overvoltage, and over-temperature. Includes a 2-year warranty and a 1m North American AC power cable. Sold in three wattage/connector configurations: 40 Watt, 60 Watt, and 90 Watt.
specs: |-
  - Active PFC (Power Factor Correction), PF > 0.91
  - Protection: short circuit, overload, overvoltage, over-temperature
  - 2-year warranty
  - Includes 1m North American AC power cable
  - Universal AC input range
  - 40 Watt (GSM40A15-P1JR, SKU PSU-MEANW-40W): 2.1mm x 5.5mm right-angle barrel connector — for TPS30W Mini/Max and 62HP Palette case power supplies
  - 60 Watt (GSM60A15-P1JR, SKU PSU-MEANW-60W): 2.1mm x 5.5mm right-angle barrel connector — for TPS30W Mini/Max, 62HP/104HP Palette case, and 30W 7U Performance case power supplies
  - 90 Watt (GSM90A15-P1M, SKU PSU-MEANW-90W): 2.5mm x 5.5mm barrel connector — for TPS80W, 80W 7U Performance case, TPS135W, and 7U Performance case Gen-2 power supplies
  - Packaged dimensions (each variant): 22 x 16 x 10 cm
