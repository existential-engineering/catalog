details: |-
  The Sieveking Sound Omega Headphone Stand debuted at the 2009 Munich High End Show. Made from real wood with a sturdy, stable design that protects headphones while showcasing them. Accommodates larger headphones from the Professional and Statement Series.

  The design has received an EU design trademark. Features a smaller opening angle than a human head, putting less tension on headphones than wearing them. Made in Germany from a single piece of wood, steam-molded and coated with clear matte lacquer for durability. The soft lacquer finish resists the need for constant cleaning unlike painted or glossy alternatives.

  Includes a pouch of ultra-soft undyed flannel for transportation and protection from light and dust. Note: as a natural wood product, color and grain variations will occur.
