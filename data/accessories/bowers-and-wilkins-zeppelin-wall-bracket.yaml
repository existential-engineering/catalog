details: |-
  Produced specifically to complement the look, finish, and design of your Zeppelin, this wall bracket will elevate your Zeppelin ownership experience both literally and metaphorically. Let your music take center stage.

  The bracket is finished in black to match the Zeppelin and is compatible with the 2021 Zeppelin model only.

  Each bracket ships with the interface section, a screw cover, mounting screws for attaching the Zeppelin to the bracket, and a manual. Wall attachment screws are not included and must be sourced separately based on the wall type.
