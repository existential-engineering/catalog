description: Protect your Ear Trumpet Labs microphone from wind noise with a
  hand-knit black windscreen. Easy to use, with magnet clasps, sized to fit all
  Ear Trumpet Labs models.
details: |-
  The Knit Windscreen is a fuzzy onesie for a microphone, an effective windscreen designed to shield Ear Trumpet Labs microphones from windy conditions on outdoor stages and video shoots. Its furry texture shields the capsule in high wind.

  Each screen is hand-knit from metallic eyelash yarn, in black or silver to match the microphones' look, and uses magnetic clasps so it can be fitted and removed easily. It comes in two sizes, Small for Edwina and Delphina, and Large for Louise, Myrtle and Josephine.

  Ear Trumpet Labs also publishes the design as an open source knitting pattern for intermediate to experienced knitters, available free on Ravelry, for anyone who would rather knit one themselves.
specs: |-
  - Hand made knit windscreen
  - Metallic black or silver eyelash yarn matches unique mic design
  - Furry texture effectively shields capsule in high wind
  - Magnetic clasps for easy dressing and undressing of the microphone
  - Two sizes: Small Windscreen (for Edwina/Delphina) and Large Windscreen (for Louise/Myrtle/Josephine)
  - Open source knitting pattern available free on Ravelry
