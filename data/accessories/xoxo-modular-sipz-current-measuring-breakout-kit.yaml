details: |-
  Sipz is a breakout board that allows you to measure the current draw of a Eurorack module. It is rated for up to 2A of current, so you could even use it to measure the current draw of a row of your system. The connection points on Sipz are designed to allow the use of alligator clips, probes, test points, or whatever else you can think of (within reason!) to attach your multimeter or ammeter. To find out how many milliamps/amps are being consumed by your module, you just set the jumpers for whichever rail you're interested in measuring (-12V, +12V, or 5V) and attach your meter's probes. Included in this kit:

  Only basic soldering skills are required to assemble this kit. Instructions on building and using the board are available at the Downloads section of our website. While the kit includes a 16-pin to 16-pin IDC cable to go from Sipz to your power source, the module under test will need its own power cable. (No meter, clips, or probes are included with the kit, of course.)

  A complete build guide / user's manual can be found in the Downloads section of this site. SKU: XD002
specs: |-
  - 1 x Sipz PCB
  - 1 x 2x20 Male Pin Header (enough to make the board with a few pins to spare)
  - 2 x Jumpers
  - 1 x 16-pin to 16-pin IDC cable (15cm length)
