details: |-
  Full-bodied tone with a rich sustain characterizes the sound of the DCB series. Using the dual ceramic bar design, these pickups introduce a new and unique voice for PJ style basses. These passive, hum-cancelling pickups are engineered to deliver higher output versus traditional passive pickups and are characterized by their full-bodied tone, rich sustain, and even dynamic response. A great choice for any player looking for a new dimension in sound. The DCB 4P/J-HC set are a direct replacement for Fender P-Bass and Jazz bridge pickups.
specs: |-
  - Wire: Formvar, 42 gauge (P), Polyester-nylon, 43 gauge (J)
  - Magnets: Ceramic
  - Leads: Single conductor, Heat resistant Teflon coated
