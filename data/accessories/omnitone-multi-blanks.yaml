details: |-
  The MOST USEFUL BLANKS!! They are not just blanks, they are MULTS! Each white line connects holes which are electrically connected. Nicely fits the tip of a patch cable for a quick-n-easy signal splitting. OR
  The holes are sized for screws to fit, but not fall through, acting as a handy screw holder! OR
  Use it as a vent for your toasty warm skiff! Comes as a set of 5 in 10HP, 8HP, 6HP, 4HP, and 2HP.
