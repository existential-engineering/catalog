details: |-
  Harmony Acoustic Guitar Strings are made in the USA with phosphor bronze precision wound onto a steel core, resulting in a string with long-lasting, balanced acoustic tone and excellent intonation. Favored by players for their bright and warm qualities, phosphor bronze wound strings are suitable for a wide variety of genres and playing styles. The strings come with an anti-corrosion inner bag for longevity and are available in five different gauges for all types of players, starting from standard gauges to custom gauges for different tensions depending on each player's preference. The 10-47 gauge has light tension for easier fretting and bending and is ideal for beginners or players preferring a lighter touch.
