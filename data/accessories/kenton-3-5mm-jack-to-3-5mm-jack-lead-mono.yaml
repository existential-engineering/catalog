description: 3.5mm to 3.5mm mono leads suitable for connecting your Kenton MIDI to
  CV converters to your modulars, or to synths using our socket kits.
details: |-
  A mono patch lead terminated in a 3.5mm jack plug at each end, intended for carrying control voltage and gate signals between a MIDI to CV converter and a modular system.

  The same lead also connects a converter to a synthesiser that has been fitted with one of the maker's CV and gate socket kits, so a retrofitted instrument can be driven from the converter outputs.

  The lead is sold in a range of lengths, which is why the page lists a price span rather than a single figure.
specs: |-
  - Mono (tip and sleeve) 3.5mm jack plug at both ends
  - Carries a single control voltage or gate signal per lead
  - Offered in several cable lengths
