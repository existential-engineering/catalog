description: A DC 9V / 1.8A wall power supply for the LIVEN and deconstruct
  series, with EIAJ3 center-positive plug and interchangeable multi-plug heads
  for USA, UK, EU, and Japan. Also compatible with KORG's volca series.
details: |-
  This wall power supply unit is for the LIVEN series and the deconstruct series. It provides DC 9V 1.8A output, EIAJ3 standard (inner diameter 1.7mm, outer diameter 4.75mm), center plus, with a multi plug (for USA, UK, EU, and Japan). Cable length is approximately 1.4m, and it is compatible with KORG's volca series.
