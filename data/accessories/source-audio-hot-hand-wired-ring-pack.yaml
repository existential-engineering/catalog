details: |-
  The Hot Hand Wired Ring Pack is a wired motion-sensing ring controller that dramatically expands expressive capabilities. The surprisingly lightweight ring fits comfortably on your hand, foot, or instrument headstock.

  An internal accelerometer translates physical motion into an exceptionally precise and dynamic expression signal, letting a player control pedal parameters through natural movement rather than a foot-operated expression pedal.

  It uses a wired connection (not wireless) and sends only motion/control data, so no audio signal passes through the device. It is compatible with multiple mounting locations.
specs: |-
  - Internal accelerometer translates motion into an expression signal
  - Wired connection (not wireless)
  - Lightweight design
  - Wearable on hand, foot, or instrument headstock
  - Sends control/expression data only (no audio signal path)
