details: |-
  The PH-bc is a powerful, high output bridge pickup that features a tight and focused range, rich harmonics, and long natural sustain. The bass is clear and defined and the bell like high end can cut through the mix without ever becoming shrill or brittle. The note separation is exemplary with excellent volume control dynamics. Compatible with both tremolo bridge and fixed bridge. This pickup is available in two types: 2S attaches with two screws, standard for most guitars. 3S attaches with three screws, replacement type for Caparison guitars. 2S Version Dimensions PDF - 3S Version Dimensions PDF
