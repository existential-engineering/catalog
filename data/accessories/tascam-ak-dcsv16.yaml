details: |-
  The AK-DCSV16 is a purpose-built protective dust cover for the TASCAM Sonicview 16XP digital mixing console. It is designed to fit the Sonicview 16XP precisely, shielding the console's surface and controls from dust and dirt when not in use.

  Constructed from light polyester fabric, the cover offers a balance of protection and ease of handling. Its compact weight of 0.06 kg makes it easy to remove and replace as needed.

  Dimensions of the cover are 500(W) x 263(H) x 580(D) mm (19.69 x 10.36 x 22.84 inches), matching the Sonicview 16XP's footprint.

  The package includes one AK-DCSV16 dust cover. Note that a warranty card is not included with this accessory.
