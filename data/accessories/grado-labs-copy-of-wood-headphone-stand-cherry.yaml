details: |-
  The Sieveking Sound Omega Headphone Stand debuted at the 2009 Munich High End Show. It features a smaller opening angle than a human head, putting less tension on headphones than wearing them.

  Crafted from a single piece of wood, steam-molded and coated with clear matte lacquer, it's designed to last. The soft lacquer finish requires minimal maintenance unlike painted or glossy alternatives. Includes an ultra-soft undyed flannel pouch for protection and storage. Accommodates larger headphones from the Professional and Statement Series.

  The design has been granted a design trademark by the European Union. As a natural wood product, color and grain variations will occur.
