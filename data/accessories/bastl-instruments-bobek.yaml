description: >-
  BOBEK is a discontinued analog processing full Eurorack system by Bastl
  Instruments, the compact sibling to BOB, designed for live performance. It
  includes five modules — Quattro Figaro (quad VCA), Cinnamon (filter), Tromsø
  (downsampler), Dynamo (dynamics analyzer), and Hendrikson (instrument
  interface) — plus 10HP of expansion space. Built-in Meanwell power supply
  (120/240V AC) with microphone stand insert. Hand-crafted in Brno, Czech
  Republic.
