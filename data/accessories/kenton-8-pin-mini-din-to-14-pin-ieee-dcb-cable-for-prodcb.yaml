description: 8 pin mini DIN plug to 14 pin IEEE DCB cable, 2 metres. Connects a
  Pro-DCB, or the optional Pro-2000 DCB port, to a Juno-60 or to a Jupiter-8
  fitted with the 14 pin IEEE connector.
details: |-
  A 2 metre lead with an 8 pin mini DIN plug at one end and a 14 pin IEEE DCB plug at the other.

  It connects a Pro-DCB, or the optional DCB port of a Pro-2000, to a Roland Juno-60, or to a Jupiter-8 that carries the 14 pin IEEE connector. Some Jupiter-8s have a 20 pin connector instead and need the 20 pin version of the lead.

  The lead is included with a Pro-DCB or with the optional Pro-2000 DCB port unless the 20 pin version is asked for, so it is sold separately mainly as a replacement or a spare.
specs: |-
  - Length: 2 metres
  - Connector A: 8 pin mini DIN plug
  - Connector B: 14 pin IEEE DCB plug
  - For Pro-DCB or the optional Pro-2000 DCB port
  - Connects to a Roland Juno-60 or a 14 pin IEEE Jupiter-8
  - A 20 pin version is available for Jupiter-8s with the 20 pin connector
