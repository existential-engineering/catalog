description: Portable studio-grade power conditioner and surge protector with
  PG-P Filtering Technology
details: |-
  The PG-P Plus Type F is the European Schuko market variant of the PG-P Plus portable power conditioner — studio-grade noise filtering in a go-anywhere form factor for stages, mobile sessions, and field recording. Despite looking like a durable surge protector, it delivers the same studio-grade noise filtering found in far more expensive rack-mount conditioners, using premium Panasonic capacitors to eliminate high-frequency noise. Eight widely-spaced outlets accommodate wall-wart power bricks side by side.

  In testing, PG-P Filtering Technology provides up to triple the noise filtering of competing portable conditioners at the same price point. Status LEDs cover surge protection, ground, and conditioning; a voltage meter gives real-time mains analysis.
specs: |-
  - PG-P Filtering Technology — up to 3x the noise filtering of comparable portable conditioners
  - Premium Panasonic capacitors
  - 8 widely-spaced outlets
  - Voltage meter for real-time analysis
  - LED status indicators: surge protection, ground, conditioning
  - Voltage: 230V AC, 10A max
  - AC Mains Input: Schuko Type F plug
  - AC Cable Length: 4.6m (15')
  - Dimensions: 114mm W x 44mm H x 343mm D
  - Weight: 1.88 kg
