description: Balanced patch cables come with 1/4 in TRS connectors ideal for
  balanced phone patch bays.
details: >-
  These cables are designed to interconnect pro audio gear with balanced phone
  jacks. They are ideal for use with balanced phone patch bays.


  Features include nickel-plated plugs for rugged durability and efficient
  signal transfer, Oxygen-Free Copper (OFC) conductors for enhanced signal
  clarity, and OFC spiral shields for effective EMI and RFI rejection and
  flexibility.


  The cables are sold in packages of 8 pc and are offered in lengths of 1 ft,
  1.5 ft, and 3 ft.
specs: |-
  - Connectors: 1/4 in TRS to Same
  - Conductors: 26 AWG x 2 OFC
  - Shield: 85% OFC Spiral
  - Quantity: 8 pc
  - Nickel-plated plugs
  - Lengths: 1 ft, 1.5 ft, 3 ft
