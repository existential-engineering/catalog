description: Official audio adapter for the HEDDphone TWO GT, available as an
  unbalanced 6.35mm-to-3.5mm adapter or a balanced 4-pin 4.4mm-to-XLR adapter,
  in 4-core 5N SPC nylon-woven, hand-braided construction.
details: |-
  Official audio cable adapter for the HEDDphone TWO GT. Two connector options are offered: an unbalanced 6.35mm-to-3.5mm adapter and a balanced 4-pin 4.4mm-to-XLR adapter. Each adapter is 20cm long.

  The adapters use 4-core 5N SPC conductors that are nylon-woven and hand-braided, available in both balanced and unbalanced configurations.

  Compatible with the HEDDphone TWO GT as well as the HEDDphone TWO.
specs: |-
  - Unbalanced adapter: 6.35mm to 3.5mm, 20cm
  - Balanced adapter: 4-pin, 4.4mm to XLR, 20cm
  - Construction: 4-core 5N SPC, nylon-woven and hand-braided
  - Compatible with HEDDphone TWO and HEDDphone TWO GT
