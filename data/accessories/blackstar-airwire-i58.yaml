details: |-
  Wire Less. Play More. The AIRWIRE i58 is a high integrity wireless instrument system for guitars, basses, and many other musical instruments with 1/4" audio outputs.

  Stronger, More Reliable Connection. Operating on 5.8GHz, the AIRWIRE i58 sidesteps Wi-Fi interference, delivering a stable, dropout-free signal that outperforms 2.4GHz systems.

  Sleek, Stealthy, Seamless. Sleek, compact, and low-profile, the AIRWIRE i58 integrates seamlessly into your setup — performance-first, no distractions.

  All the Tone, None of the Cables. With ultra-low latency and a precise frequency response, the AIRWIRE i58 captures every nuance of your playing — no signal loss, no compromise.

  Fast Charge, Long Play. Get up to 9 hours of playtime on a quick 2.5-hour charge — so you can focus on playing, not charging.
specs: |-
  - Frequency Band: 5.8GHz
  - Transmission Channels: 4 independent channels
  - Transmission Distance: Up to 35 meters (100 feet)
  - Latency: <6ms
  - Frequency Response: 20Hz–20kHz
  - Output Impedance: 1kΩ
  - Connectors: 1/4" mono
  - Power: Rechargeable lithium-ion battery
  - Charging: USB-C 5V input (cable included)
  - Charging Time: <2.5 hours
  - Operation Time: 9 hours when fully charged
  - Dimensions: L 67.0mm, W 37.2mm, H 20.5mm
  - Weight: 45g (each transmitter or receiver, single unit)
