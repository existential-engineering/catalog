details: |-
  The Benchmark NL4 to NL4 Speaker Cable is a professional 4-pole bi-amp cable engineered for both studio and stage use. It is built around Canare 4S11 star-quad cable, which features four 14 AWG stranded conductors with polyethylene dielectric insulation, yielding a DC resistance of under 5.2 ohms per 1000 feet and a capacitance of 45 pF/ft. The cable's 0.421-inch super-flexible heavy-duty jacket makes it durable enough for demanding live applications while remaining manageable in tight studio installations.

  Each cable is terminated with Neutrik NL4FXX-W-S SpeakON connectors rated at 37 Amp RMS. The locking NL4 connector carries all four conductors, making this cable purpose-built for bi-amp speaker setups where a single cable carries both low- and high-frequency signals simultaneously. Benchmark hand-assembles and tests every cable in Syracuse, NY.

  The cable is sold individually in lengths of 2, 3, 6, 10, 15, 25, 50, 75, and 100 feet. For stereo operation, order two. Separate 2-pole SpeakON cables are available for non-bi-amp configurations.
specs: |-
  - Connectors: Neutrik NL4FXX-W-S SpeakON 4-pole locking, 37 Amp RMS
  - Cable: Canare 4S11 star-quad
  - Conductors: 4 x 14 AWG stranded
  - Insulation: Polyethylene dielectric
  - DC resistance: <5.2 Ohms/1000 ft
  - Capacitance: 45 pF/ft
  - Jacket diameter: 0.421 inches, super-flexible heavy-duty
  - Lengths available: 2, 3, 6, 10, 15, 25, 50, 75, 100 feet
  - Assembly: Hand-assembled and tested in Syracuse, NY, USA
