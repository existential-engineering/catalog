details: |-
  The Marantz Horizon Tripod is an optional pedestal designed to place your Marantz Horizon wireless speaker at the perfect height to create the optimal listening experience.

  Crafted from American Walnut and robust cast iron with a luxurious satin black finish, the tripod draws design inspiration from the walnut finishes used on iconic Marantz amplifiers of the past. It complements any décor and is as refined as the authentic, natural marble quarried to make the Marantz Horizon pedestal.
specs: |-
  - Materials: American Walnut and cast iron
  - Finish: Satin black with American Walnut accents
  - Compatible with: Marantz Horizon wireless speaker
  - Design inspired by classic Marantz amplifier walnut finishes
