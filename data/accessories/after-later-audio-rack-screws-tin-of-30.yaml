details: |-
  These rack screws for Eurorack can be screwed by hand for quick changes, or use a standard Phillips head screw driver. Each Standard Size M3 X 8mm black steel screw comes with a black nylon washer in a gold tin. Each Standard Size M3 X 8mm stainless steel screw comes with a black nylon washer in a silver tin. Each Special Size M2.5 X 8mm stainless steel screw comes with a black nylon washer in a silver tin.
