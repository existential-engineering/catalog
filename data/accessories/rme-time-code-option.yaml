id: ZS7mASOcdFOi97aIHe4xE
name: Time Code Option
manufacturer: rme
primaryCategory: other
url: https://rme-audio.de/time-code-option.html
description: Optional expansion module (HDSP Synchronization Module) for
  selected RME HDSPe cards that adds synchronization to LTC (Linear Time Code)
  and video signals. Connects to the host card via ribbon cable and uses
  SteadyClock technology to extract clean, low-jitter word clock from LTC and
  video sources, enabling sample-accurate timecode synchronization.
details: |-
  The Time Code Option (TCO) is an expansion board that adds LTC (SMPTE) and video sync capability to compatible RME HDSPe PCI Express cards. It connects internally to the host card via a flat ribbon cable and provides BNC connectors on a separate slot bracket for LTC In, LTC Out, Video/Word Clock In and Word Clock Out.

  RME's SteadyClock technology is used to derive a low-jitter word clock from incoming LTC or video signals, so the audio interface can be sample-accurately locked to external timecode sources. Multiple TCO-equipped cards can be combined for multi-card setups.

  Supported frame rates include 24, 25, 30 and 29.97 fps with both drop-frame and non-dropframe modes, as well as pull-up/pull-down formats (±0.1% and ±4%).

  After installation a dedicated page appears automatically in the HDSP card's settings dialog, allowing selection of the sync source (LTC, Video or Word Clock), 75 Ohm termination for the BNC input, the frame rate of the incoming SMPTE signal, and WCK conversion. The dialog also displays pull-up/pull-down factors and input state information, including whether the incoming word clock is in the Single, Double or Quad Speed range.

  Compatible host cards include the HDSPe AES, HDSPe MADI, HDSPe RayDat and HDSPe AIO Pro.
specs: |-
  - LTC Input: BNC unbalanced, level range -25 dBu to +12 dBu
  - Video/Word Clock Input: BNC with switchable 75 Ohm termination; supports PAL and NTSC; transformer coupled, galvanically isolated
  - Video/Word Clock Input level range: 1.0 Vpp – 5.6 Vpp
  - Video/Word Clock Input lock range: 28 kHz – 200 kHz
  - Jitter when synced to video/word clock: < 1 ns
  - Jitter suppression: > 30 dB (2.4 kHz)
  - LTC Output: BNC, output level +4 dBu (configurable to -7 dBu via jumper), output impedance 220 Ohm
  - Word Clock Output: BNC, max output voltage 5 Vpp; 4.0 Vpp @ 75 Ohm; output impedance 10 Ohm; frequency range 28 kHz – 52 kHz
  - Supported frame rates: 24, 25, 30, 29.97 fps; drop-frame and non-dropframe; pull-up/pull-down (±0.1% and ±4%)
  - Power: 5 V DC via ribbon cable, 100 mA
  - PCB dimensions: 98 x 75 mm
  - Compatible host cards: HDSPe AES, HDSPe MADI, HDSPe RayDat, HDSPe AIO Pro
