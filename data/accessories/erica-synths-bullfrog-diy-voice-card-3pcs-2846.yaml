description: Enable patch save on your Bulfrog
details: |-
  The DIY VOICECARD is a blank card that allows custom connections between the Bullfrog's modules to be built by hand. The card mimics the connection points of the Bullfrog, so a patch becomes permanent once it is wired.

  Making the connections takes a piece of wire, a soldering iron and some soldering skill. Pieces of wire join the points on the voicecard and are soldered in place. Erica Synths recommends making the connections with patch cables directly on the Bullfrog first, and turning a patch into a DIY voicecard once it proves worth keeping.

  The example printed on the card shows the basic audio patch, with the pulsewave going into the VCF and the VCF into the VCA, while the MANUAL GATE triggers both envelope generators and they control the VCA and the VCF respectively. Power connections are also provided on the voicecard for more advanced builders. The card is sold in packs of three.
specs: |-
  - Cable free patching
  - Unlimited patch points
  - Mimics the connection points of the Bullfrog
  - Power connections provided on the card
  - Supplied as 3 pieces
