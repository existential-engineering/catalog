details: |-
  The MAGVEL CLAMP for the PLX-CRSS12 is replaceable, and additional clamps are available to buy if you want to take your own set on the road, or if you need to replace a clamp that’s been lost. A cover is included to protect the adhesive sheet from dirt and scratches when the MAGVEL CLAMP is bought separately. You can store the MAGVEL CLAMP neatly in a dedicated area on top of the deck. Find your perfect “weight” setting by turning the dial on top of the MAGVEL CLAMP. The amount of torque will be increased or decreased to make the record feel lighter or heavier without changing or adjusting slip mats or slip sheets.
