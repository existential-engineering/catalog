  swapped to upgrade it.
details: |-
  A firmware upgrade for the Control Freak Original, supplied as a replacement EPROM chip. The unit cannot be re-flashed over MIDI or USB, so upgrading means fitting the new chip in place of the old one.

  The installed firmware revision is briefly displayed whenever the unit is powered on. Holding the shift button while powering up keeps the revision number on the display until the button is released, after which the unit enters analyser mode.

  The firmware history runs from KCNT4501.244 in November 1998 to KCNT4501.451 in June 2004. Along the way it added new real-time bytes, controller 65 to 119-000 in the factory set and a settling time after program change, VST and Pro Tools profiles in the factory set, soft thru on-off select, a control channel for remote control of programs and button presses, scene memory, erase program and delete to end of line, improved handling of large SysEx dumps so that several units can be chained together, a fix for MTC merge, the ability to load Control Freak Live and Studio profiles, and a fix for a dump request problem.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: KCNT4501.451, dated 26/06/2004
  - Firmware revision is shown briefly at power on, held by keeping shift pressed
