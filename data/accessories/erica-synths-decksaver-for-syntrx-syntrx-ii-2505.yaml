description: Protect your setup from damage at home, in the studio or on the stage
details: |-
  Erica Synths decksavers are engineered to fit Pērkons HD-01, SYNTRX and SYNTRX II. The smoky clear decksaver protects the synth from impact, dust and liquid, shielding the most vulnerable knobs and switches from bending and breaking while keeping settings and knob positions in place for the next time it is played.

  The low profile design stays compatible with most flight cases and travel bags, so a decksaver can be used together with an Erica Synths travel bag for maximum protection and convenience while travelling with the instrument.
specs: |-
  - Made from smoky clear super strong polycarbonate
  - Protects against dust, liquid and impact
  - Shields vulnerable faders, switches and knobs during transportation
  - Low profile design enables compatibility with most flight cases and travel bags
