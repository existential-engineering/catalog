details: |-
  The Befaco Passive Bus is a straightforward passive expansion solution for Eurorack modular synthesizer power systems. As a purely passive device, it contains no active components or voltage regulation circuitry — it simply distributes power from a main bus to additional modules via its 14 horizontal IDC power headers.

  The board measures 41.6cm in length and only 10mm in height, making it easy to mount inside cases with tight vertical clearance. Its slim profile is designed to fit alongside existing power rails or bus boards, extending their capacity without requiring additional power supplies.

  Because it is passive, the Passive Bus introduces no noise or interference of its own into the power rails — whatever is present on the upstream bus is passed directly to connected modules. Users with noisy supplies should address the source rather than relying on this board for filtering.

  Befaco offers the Passive Bus both as a ready-to-use assembled unit and as a DIY soldering kit.
