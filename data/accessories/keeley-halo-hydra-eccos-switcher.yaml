details: |-
  The Remote Switcher is a switching accessory for Keeley's next-generation HALO, HYDRA and ECCOS pedals. It lets those pedals be controlled from anywhere on a pedalboard rather than from the pedal itself.

  It plugs directly into the tip and ring input of the host pedal using a TRS cable, which is not supplied. One switcher works across all three pedals. Each unit is hand built and signed by Robert Keeley in Oklahoma, USA, and the enclosure has been offered in several finishes including Dream Purple.
