description: A socket kit that adds CV, Gate and Filter sockets to the miniKORG
  700 and 700S. With a Kenton MIDI to CV converter the synthesiser can then be
  played from a MIDI keyboard or sequencer.
details: |-
  A socket kit for the miniKORG 700 and 700S, adding three control sockets so the instrument can be driven from a MIDI keyboard or MIDI sequencer by way of a MIDI to CV converter such as the Pro-Solo mk3, USB-Pro or Pro-2000 mkII. This is the socket kit rather than the MIDI retrofit kit, which is a separate product with its own page for each model.

  The three added inputs are 3.5mm mono jack sockets. CV provides Hz/V control of oscillator frequency, which is the scaling these Korg instruments use, Gate decides when notes sound (0 volts for note off, above 3 volts for note on), and Filter controls the cutoff frequency of the low pass filter, driven from the auxiliary output of the converter.

  The kit contains a circuit board and all the components and diagrams needed to connect the wiring and to mount the three 3.5mm sockets and the switch.

  Paired with a Pro-Solo mkII or Pro-2000 mkII, the retrofitted synthesiser responds to note data over at least five octaves, pitch bend with a range set in the converter, modulation from the converter's internal LFO with speed and waveshape alterable in real time, portamento with a rate alterable in real time, and filter cutoff from any continuous controller or from aftertouch or velocity. Low, high and recent note priority and single or multiple trigger modes are selected in the converter.

  Fitting is a skilled job, intended for a competent synthesiser service engineer. Installation at the manufacturer's premises in Tadworth, near London, is also offered.
specs: |-
  - Adds three 3.5mm mono jack sockets: CV, Gate and Filter
  - CV: Hz/V control of oscillator frequency
  - Gate: 0 volts note off, above 3 volts note on
  - Filter: low pass cutoff control from the converter's auxiliary output
  - Note range at least 5 octaves, limited by the synthesiser rather than the kit
  - Supplied as a circuit board with components, switch, sockets and wiring diagrams
  - Powered from the host synthesiser, no power input of its own
  - Fits the miniKORG 700 and the miniKORG 700S
