description: Socket kit that adds five individual audio output sockets to the
  Roland TR-606 on 3.5mm mono jacks, giving separate access to its internal
  sounds alongside the existing main output.
details: |-
  This socket kit adds five audio output sockets to the Roland TR-606, so the internal sounds can be accessed individually on 3.5mm mono jacks.

  The main output continues to function exactly as normal once the kit is fitted. The five additional outputs give fixed level signals that are unaffected by the individual volume knob settings for those sounds.

  Individual audio outputs make it possible to process each sound separately and to control the stereo mix of the drum machine outside the instrument.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the five 3.5mm mono jack sockets. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Adds five individual audio output sockets on 3.5mm mono jacks
  - Outputs are at fixed level, unaffected by the individual volume knobs
  - The existing main output continues to work as normal
  - Supplied with components, wiring diagrams and mounting hardware
  - Passive socket kit, so it has no power connection of its own
