description: The CB-6560 series of microphone and line cables is built to
  express the beautiful sound of music, accepting everything from very low
  microphone signals to the line level signals of mixers and other devices.
details: |-
  As a pioneer and innovator in the building of sound systems in Japan, FREE THE TONE has always sought out unique solutions to a wide variety of requests from artists and engineers at the forefront of music creation in recording sessions and live performances. Finding an ideal solution means comprehending the true nature of the request and then considering the right conditions to make it possible. The CB-6560 microphone and line cable is the result of that approach.

  The essential quality for a microphone and line cable is stated simply on the product page as expressing the beautiful sound of music. The prerequisites include the wide-range characteristics required for conveying various spectra from various musical instruments, neutral and natural sound that can accurately represent an instrument's inherent tone, spacial reproduction capability to convey the depth of the sound image, rejection of noise that can tarnish a beautiful sound, and an extremely high signal-to-noise ratio.

  OFC (oxygen-free copper) is used for both conductor and shield, and a high-density braided shield of more than 94 percent coverage provides the spacial reproduction capability and high signal-to-noise ratio the design aims at. The cable accepts a wide range of signal levels, from very low microphone signals through to the line level signals of mixers and other devices.

  The cable measures 6.50 mm in diameter over a 0.3 mm2 conductor, with a maximum conductor resistance of 60 ohm/km and capacitance of approximately 160 pF/m. Seven plug configurations are sold in parallel, covering XLR female and male, stereo phone, angled stereo phone, a stereo phone socket and mono phone terminations, each in 1.0 m, 2.0 m, 3.0 m and 5.0 m lengths.
specs: |-
  - Conductor size: 0.3 mm2
  - Construction: 60/0.08A OFC (No/mm)
  - Insulation thickness: 2.00 mm (plus or minus 0.05)
  - Inner jacket thickness: 0.65 mm
  - Shield diameter: 4.60 mm
  - Jacket thickness: 0.3 mm (plus or minus 0.10)
  - Diameter: 6.50 mm
  - Maximum conductor resistance (20 degrees C): 60 ohm/km or less
  - Capacitance (1 kHz): approx. 160 pF/m
  - OFC (oxygen-free copper) conductor and shield
  - High-density braided shield, more than 94 percent coverage
  - Plug types: CF/3PH (XLR female to stereo phone), CM/3PH (XLR male to stereo phone), 3PH/3PH (stereo phone to stereo phone), 3PL/3PH (angled stereo phone to stereo phone), 3S/3PH (stereo phone socket to stereo phone), PH/PH (mono phone to mono phone), CF/CM (XLR female to XLR male)
  - Lengths: 1.0 m, 2.0 m, 3.0 m, 5.0 m
