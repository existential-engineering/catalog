description: Protective case for the DJM-V10
details: |-
  Take your DJM-V10 on the road with confidence. This purpose-built, tough case is waterproof and features wheels and a telescopic pull-handle for easy transportation.

  Stackable and fitted with double throw latches you can open easily, the DJRC-V10 case also has hand slots so it’s a breeze to remove your mixer from the case and fit it snugly back inside when it’s time to pack up. A cable compartment and space for the plug in the foam insert keep things neat and tidy.
