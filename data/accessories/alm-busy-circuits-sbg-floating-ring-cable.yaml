description: >-
  Mono 3.5mm mini jack to mono 6.35mm (1/4″) jack cable with the protection of a
  'floating ring' (nothing mystical, just the middle part of the large jack
  connects to nothing - i.e floats - as a safety precaution when connecting your
  modular to expression inputs on guitar pedals etc) Included with both the
  S.B.G. or S.B.G-PRO for safe expression pedal patching, these can be purchased
  as replacements or spares.
