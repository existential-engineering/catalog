description: A MIDI cable terminated with original FREE THE TONE design
  miniature L-plugs that allow 360-degree access, so MIDI pedals take up far
  less pedalboard space.
details: |-
  When assembling pedalboards for customers, FREE THE TONE found the MIDI cable to be one component that could be better. Conventional MIDI cables take up a lot of pedalboard space because they are terminated with large plugs, and most available plugs are the straight type, so good pedalboard layouts had to be worked around the fact that the plug angle cannot be adjusted.

  After two years of development the CM-3510 was completed with an unprecedented construction. A free-angle cap structure allows 360 degree access at all angles, and with miniature L-plugs the cable drastically reduces the space needed on pedalboards containing MIDI pedals and simplifies complicated layouts.

  The cable itself is a two-core shielded type that blocks external noise and provides a stable MIDI signal. To set the angle, the cap is pried off the connector, the cable is bent in the direction wanted and the cap is replaced. Changing the direction of the cable while the cap is still on may disconnect the cable, so the cap should be removed first.

  Four lengths are sold, 30 cm, 50 cm, 80 cm and 100 cm.
specs: |-
  - Original FREE THE TONE design L-plug allows 360-degree access
  - Two-core shielded cable blocks external noise and provides a stable MIDI signal
  - Reduced plug size takes up less pedalboard space
  - Free-angle cap structure, remove the cap before changing the cable direction
  - Lengths: 30 cm, 50 cm, 80 cm, 100 cm
