id: 9NP-8iheFXuOL-RFBg1vT
name: MDx Network Processor Board
manufacturer: bricasti-design
primaryCategory: other
url: https://bricasti.com/en/consumer/mdx.php
description: The Bricasti MDx is an internal upgrade board that adds network
  streaming and Ethernet connectivity to compatible Bricasti DACs including the
  M1 Series II, M12, and M21. It supports Roon, AirPlay 2, and UPnP playback and
  installs in the factory expansion slot.
specs: |-
  - Adds Ethernet (RJ45) and network streaming to compatible Bricasti DACs
  - Supported protocols: Roon Ready, AirPlay 2, UPnP/DLNA
  - Supports PCM up to 32-bit / 384kHz and DSD up to DSD256
  - Installs in factory-equipped expansion slot
  - Compatible models: M1 Series II, M12 Source Controller, M21 DAC
  - Factory-installed on Platinum series variants
