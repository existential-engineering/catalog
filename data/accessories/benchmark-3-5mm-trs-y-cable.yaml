description: A 3.5mm TRS Y-adapter cable for use with Benchmark's 12V trigger
  I/O ports, enabling one trigger output to control two slave devices
  simultaneously. Also functions as a standard 3.5mm TRS audio splitter cable.
details: |-
  This Y-adapter cable is designed primarily for use with the Trigger I/O ports found on Benchmark audio products. It can expand a bi-directional trigger network, sending a trigger output to two slave devices simultaneously, or link a Benchmark DAC to a pair of power amplifiers for synchronized power control.

  As a secondary use case, the cable functions as a standard 3.5mm TRS audio patch cable and can split the audio output from many portable devices to feed two inputs.

  Important: do not connect trigger ports to analog input or output ports — the 12V trigger signal is incompatible with analog audio circuitry.
specs: |-
  - Connectors: 3.5mm TRS on all three ends (1× input, 2× output Y-split)
  - Primary use: 12V trigger I/O networking between Benchmark components
  - Secondary use: stereo 3.5mm audio splitter
