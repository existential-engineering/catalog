id: veZuWYwB-cxD6wxDUsisA
name: GoXLR Desk Stand
manufacturer: tc-helicon
primaryCategory: other
url: https://www.tchelicon.com/en/products/0014-aaa
description: All-metal adjustable desk stand for the GoXLR mixer, with four tilt
  angles, rubberized padding and an inline power switch adapter.
details: |-
  The GoXLR Desk Stand raises and tilts a GoXLR so the panel sits at a usable viewing and operating angle for a given desk, whether the operator is seated or standing. Construction is all metal throughout.

  The stand is deliberately heavy and sits on rubberized feet, so it stays in place when the unit's buttons are pressed rather than sliding across the desk. Rubber padding is placed where the GoXLR meets the stand, protecting the back and edges of the unit from rubbing.

  Four discrete angle settings are available, selected to suit the operator's eyeline.

  GoXLR itself has no power switch and is designed to be powered down by pulling the cable. The stand ships with an inline power switch adapter that sits between the GoXLR power adapter and the unit, adding a conventional on/off switch.
specs: |-
  - All-metal construction
  - Four discrete tilt angle settings
  - Weighted body with rubberized feet
  - Rubber padding protecting the back and edges of the GoXLR
  - Includes an inline power switch adapter for the GoXLR power supply
  - Fits GoXLR
