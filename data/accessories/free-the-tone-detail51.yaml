description: Solderless plug for the 4 mm CU-416 Instrument Link Cable, part of
  Free The Tone's 2019 renewal of its solderless cable series. The plug's tip
  and core wire connection pin are integrated for more direct signal
  transduction, and the cap is replaceable in six colours.
details: |-
  Free The Tone devised its ultra miniature solderless plugs, the SL-8 Series, in 2012. Solderless cables can be handcrafted without soldering, so they came into wide use, and after almost seven years of accumulated know-how the maker decided it was time to reconsider the design to meet newly emerging needs. In 2019 the solderless series was reborn as the SL-4 and SL-5 plugs.

  The SL-4 is the plug for the 4 mm CU-416 Instrument Link Cable, and the SL-5 is the matching plug for the 5 mm CU-5050 cable. Each is offered as a straight plug, an L-angle plug or a mixed pair, in a nickel-plated version and a gold-plated Pro Series version, sold in packs of two and in ten-plug kits that include three metres of cable.

  Four changes came with the renewal. The plug's tip and the core wire connection pin are integrated for more direct signal transduction. The gold plated Pro Series now shares the structure of the nickel plated type, which makes assembly easier. Two plug bodies cover the two cable diameters. And the cap of the S straight plug is now replaceable like the cap of the L angle plug, with six cap colours available through the SLC-4A and SLC-5A replacement sets, so input and output sides or separate signal loops can be colour coded.

  The CU-416 cable the SL-4 is built for excels in sound quality, flexibility, durability and workability, and carries DC power as well as audio. At just 4 mm diameter it is the thinnest and most flexible cable in the lineup, which suits interconnection inside a compact pedalboard or a rack system, and it has a natural sound that works as an all-purpose link between effects units or a switcher.

  The maker warns that overtightening the plug screws may bring them into contact with the core wire of the cable and cause a short circuit.
specs: |-
  - SL-4 solderless plug for CU-416 Instrument Link Cable (ring with white logo)
  - Available as straight (SL-4S) or L-angle (SL-4L), nickel plated or gold plated Pro Series
  - Replacement caps SLC-4AS (straight) and SLC-4AL (angle), six colours: red, purple, blue, green, gunmetal, navy
  - CU-416 cable conductor size: 0.18mm sq, construction 16/0.12 OFC (No/mm)
  - CU-416 cable insulation thickness: 0.98mm (+/- 0.05mm), inner jacket 0.25mm, jacket 0.50mm (+/- 0.05mm)
  - CU-416 cable shield diameter: 3.50mm, overall diameter 4.00mm
  - CU-416 maximum conductor resistance (20 C): 100 or less (ohm/km)
  - CU-416 capacitance (1kHz): approx. 160 (pF/m)
  - Design Patent Registration: DES. PAT. JP. 1645384
