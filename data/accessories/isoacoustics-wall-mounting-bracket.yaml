name: Wall Mounting Bracket
manufacturer: isoacoustics
primaryCategory: acoustic-treatment
url: https://isoacoustics.com/products/v120-wall-bracket
description: A genuine IsoAcoustics wall bracket that, combined with V120 L- or
  C-bracket isolation mounts and HEDD's mounting adapters, enables
  vibration-decoupled wall installation of any HEDD speaker.
details: |-
  The IsoAcoustics Wall Mounting Bracket is a wall-installation solution developed in collaboration between HEDD Audio and IsoAcoustics. Combined with IsoAcoustics V120 L- or C-bracket isolation mounts and HEDD's proprietary mounting adapters, it enables wall installation of any HEDD speaker model.

  The bracket incorporates IsoAcoustics' patented isolation technology, which actively reduces vibration transfer into supporting structures and cavities. This minimizes excitation of the wall structure and prevents vibrational energy from conducting back into the speakers, enhancing audio clarity.

  Installation is designed for accessibility and versatility, accommodating not only HEDD monitors but also third-party assemblies such as truss and unistrut channels when used with the appropriate mounting components.
specs: |-
  - Compatibility: IsoAcoustics patented V120 mounting system; any HEDD speaker (with V120 L/C bracket and HEDD adapter)
  - Load capacity: up to 18.1 kg (40 lbs)
  - Dimensions: 350 x 90 x 250 mm (13.8" x 3.5" x 9.8")
  - Weight: 1.9 kg (4.19 lbs)
  - Warranty: 2 years (IsoAcoustics)
