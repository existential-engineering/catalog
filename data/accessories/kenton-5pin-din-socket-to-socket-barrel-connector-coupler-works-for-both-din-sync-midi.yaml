details: |-
  A barrel coupler with a 5 pin DIN socket at each end. Two leads plug into it to make one longer run, which saves replacing a pair of short leads with a single long one.

  All five pins are carried through, so the same coupler serves a MIDI connection and a DIN Sync connection.
specs: |-
  - Two 5 pin DIN sockets, socket to socket
  - Joins two MIDI or DIN Sync leads into a longer run
  - Suitable for both MIDI and DIN Sync
