description: The Power Tap Portable is a pocket-sized pedalboard power adapter
  that takes 5 V to 18 V DC from any common USB power bank and supplies a
  short-circuit protected 9 V DC 800 mA centre-negative output.
details: |-
  The Power Tap Portable is designed for pedalboard users who need to work away from a mains socket. It draws its supply from any common power bank and converts it to the voltage a pedal expects, so a pedalboard is no longer tied to a local power outlet.

  The input accepts 5 V to 18 V DC and the output supplies 9 V DC at 800 mA with centre-negative polarity, the standard for guitar effect pedals. The output is short-circuit protected.

  The unit ships with a DC connection cable, a USB connection cable and an operator's manual. It measures 7.0 x 3.0 x 3.0 cm and weighs 0.1 kg.
specs: |-
  - DC input: 5 V to 18 V DC
  - DC output: 9 V DC, 800 mA
  - Output is short-circuit protected
  - Polarity: centre negative
  - Supplied with a DC connection cable, a USB connection cable and an operator's manual
  - Dimensions: 7.0 x 3.0 x 3.0 cm
  - Weight: 0.1 kg
