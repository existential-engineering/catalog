  Dekoni Audio replacement earpads are engineered to enhance the performance of your Fostex TH-X00 and TH-900 series headphones. These premium earpads feature memory foam construction that provides superior comfort during extended listening sessions while maintaining acoustic integrity. Key Features & Benefits

  Crafted with premium materials, these earpads deliver improved comfort and sound quality. Compatible with Fostex TH-X00, TH-900, TH-900MK2, TH1000, TH-600, TH-610, and Massdrop X00 editions (Ebony, Mahogany, and Purpleheart). The memory foam design conforms to your ear shape for personalized comfort and optimal acoustic seal. Upgrade your audiophile headphone experience with Dekoni Audio's precision-engineered replacement earpads—trusted by the audiophile community.
