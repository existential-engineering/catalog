description: This cable enables you to connect MIDI devices that use standard
  MIDI cables to the stereo minijacks that use the Type B standard. The adapter
  cable has a male stereo minijack at one end, and a male 5 pin DIN MIDI
  connector on the other, and is 1.42 meters/4' 8" long. It is also useful as a
  converter for connecting to other MIDI devices that use a different mapping of
  MIDI signals to the stereo minijacks.
details: |-
  Early 1010music products use the Type B mapping of MIDI signals to stereo minijacks. Bitbox mk2 and bitbox micro can use mini TRS Type A or Type B for MIDI inputs, and bitbox micro uses Type B for MIDI outputs. This cable maps MIDI signals between a female 5-pin DIN MIDI connector and a stereo minijack: Pin 4 (Current Source) to Tip, Pin 5 (Current Sink) to Ring, and Pin 2 (Shield) to Sleeve.

  The cable features a male stereo minijack at one end and a male 5 pin DIN MIDI connector at the other, measuring 4' 8" (1.42 meters) long.
specs: |-
  - Copper core
  - Nickel plated brass connectors
  - Type B MIDI Mapping
  - 4' 8" (1.42 meters) long
  - End 1: male stereo minijack
  - End 2: male 5 pin DIN MIDI connector
  - Weight: 0.09 lbs
  - Dimensions: 5 x 4.5 x 0.75 in
  - Country of Origin: China
