details: |-
  FS-805 D5 is a dedicated floor stand for the Bowers & Wilkins 805 D5 stand-mount loudspeaker. Bowers & Wilkins presents it as the way to achieve the best possible performance from a pair of 805 D5s, and describes it as a reference 805 D5 speaker stand.

  The stand is offered in two finishes, Black and Warm Titanium, matching the finishes of the 800 Series Diamond D5 loudspeakers it is placed under. It is sold and priced as a pair.
