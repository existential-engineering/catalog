details: |-
  ELEVATE Desktop Microphone Stand

  The Sontronics ELEVATE is a versatile desktop-mounted broadcast-style boom arm, designed to create an organised and efficient workspace. It can be clamped to a work surface or permanently fixed, offering flexibility for any studio or broadcasting setup. With three lockable articulated joints, the ELEVATE arm allows you to suspend your microphone from above or tilt it towards you for optimal positioning. This helps keep your workspace clear, making room for your laptop, tablet, or script, while maintaining professional sound quality during recordings or broadcasts. Each arm features an integrated cable management system with channels and locking clips to keep your setup neat and clutter-free. The base rotates 360°, allowing you to easily move the microphone out of the way when not in use. Made from premium-grade powder-coated aluminum, ELEVATE is lightweight yet highly durable. It's compatible with both EU and US mic threads and comes with a 3/8" to 5/8" thread adapter for added versatility. IDEAL FOR

