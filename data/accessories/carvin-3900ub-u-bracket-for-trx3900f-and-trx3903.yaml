details: |-
  The 3900UB bracket allows the user to attach the TRx3900F column array to a wall or suspend from the ceiling. The 3900UB also allows one pair of TRx3900F column arrays to be connected together and then mounted on a wall or suspended from the celling for installations. The 3900UB features both 10.3mm and 6.4mm mounting holes. Clamp and hardware shown in photos may be purchased separately from a hardware supplier. The 3900UB also fits the TRx3903 column array.
