description: A 15 cm MIDI conversion cable that converts a 5-pin DIN MIDI plug
  to a 3.5-mm stereo mini plug.
details: |-
  The CM-3510-TRS/SC is a MIDI conversion cable that converts a DIN connector to a 3.5-mm stereo mini plug. It is 15 cm long.

  DIN connectors are widely used as MIDI I/O connectors on effects units, keyboards and similar gear, but as those devices have become smaller, products that use stereo mini plugs for MIDI signal connection have become more common. Attaching the CM-3510-TRS/SC to the 5-pin DIN plug of a DIN type MIDI cable converts it to a 3.5-mm stereo mini plug type cable.

  The cable belongs to Free The Tone's CM-3510 Series, which uses 2-conductor shielded wire to protect MIDI signals from external noise and to keep MIDI signal transmission stable.
specs: |-
  - MIDI conversion cable, 15 cm
  - Converts a 5-pin DIN MIDI plug to a 3.5-mm stereo mini plug
  - 2-conductor shielded wire
