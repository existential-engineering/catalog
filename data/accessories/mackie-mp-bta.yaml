description: The MP-BTA In-Ear Monitor Adapter enhances your monitoring system.
  This adapter offers Bluetooth capability, precise sound deliverance, and
  comfort.
details: |-
  MP-BTA is a Bluetooth adapter with an in-line mic and control that takes MP Series Professional In-Ear Monitors wireless.

  It pairs with any Bluetooth-enabled device and uses Bluetooth 5.0 technology for range and battery life, with up to 10 hours of playback.

  The in-line mic and control handle calls and music playback, and the swiveling, detachable MMCX connectors attach to MP Series earpieces.
specs: |-
  - Bluetooth 5.0
  - In-line mic and control for answering calls and controlling music playback
  - Swiveling, detachable MMCX connectors
  - Up to 10 hours of battery life
  - Battery powered, no external power input
  - Available individually or bundled with MP Series In-Ear Monitors
