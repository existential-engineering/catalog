description: A small power board that fixes oscillation and freezing issues on
  the Legion oscillator caused by certain power supply sequencing. It ships with
  a screwdriver and standoff for installation.
details: |-
  Some power supplies are sequenced in such a way that causes Legion to freeze and not oscillate. This little power board will fix that. It ships with a screwdriver and standoff for easy installation. The boards orientation won't increase the depth of Legion in your case.
