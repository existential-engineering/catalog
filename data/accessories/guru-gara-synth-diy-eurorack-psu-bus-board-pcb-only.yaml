details: |-
  Build your own compact, stable Eurorack power supply. This is the bare PCB for our 9-header PSU and Bus Board—ideal for custom cases, skiffs, and DIY bench projects. Key Features

  DIY Builder Notes
specs: |-
  - Flexible Power Brick Support: Designed specifically to fit industry-standard, high-efficiency encapsulated DC/DC converter modules from RECOM, Traco Power, and Hi-Link .
  - Standard Rails: Supports +12V (1.25A) , -12V (1.25A) , and +5V (depending on the converter modules you source).
  - 9 Power Headers: Layout accommodates 9 standard 16-pin Eurorack power connectors.
  - Signal Routing: Traces included to distribute system-wide Gate and CV signals.
  - Compact Size: Easy to fit into small or shallow cases.
  - PCB Only: This is a bare printed circuit board. No components are included.
  - Sourcing Parts: You must source your own parts, including the DC/DC converter modules, 16-pin headers, capacitors, and a compatible external DC wall adapter.
  - Assembly: Intermediate soldering skills are required. Always check your polarities before powering up your modules!
