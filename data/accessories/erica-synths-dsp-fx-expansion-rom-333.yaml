description: DSP FX expansion ROM adds third extra bank with 8 new effects to
  your Black Hole DSP! Shimmer reverbs, gritty distorted delays and fun mini
  loopers will take your Black Hole DSP unit to the next level of fun.
details: |-
  The DSP FX Expansion ROM is a replacement firmware chip for the Black Hole DSP module. It adds a third extra bank of 8 new effects, covering shimmer reverbs, gritty distorted delays and mini loopers.

  The bank opens with Mono Delay, the classic delay effect from the Pico DSP with nasty feedback, and two shimmer algorithms. Shimmer+ is a reverb with a +12 semitone pitch shifter in the feedback path, and Shimmer Drift is similar but replaces the amount setting with an adjustable pitch shifter.

  Pitch Shifter is a dual pitch shifter algorithm with +12 or -12 semitone settings on each side and a crossfade between them on the Dry/Wet knob. Ripper is a digital emulation of Erica Synths' FusionBox vacuum tube BBD delay and overdrive unit.

  LP Freezer and HP Freezer are mini sampler and looper algorithms with a low pass or a high pass filter at the end, the second adding reverb, with a maximum sampling time of 0.5s. Drone Bank is a three oscillator drone bank where inputs 1 and 2 work as FM inputs for oscillators 1 and 2.

  Installation requires the patch knob to be at its MAX level before the module is turned on.
specs: |-
  - Adds a third bank of 8 effects to Black Hole DSP
  - MONO DELAY, the Pico DSP delay with nasty feedback
  - SHIMMER+, reverb with a +12 semitone pitch shifter in the feedback path
  - SHIMMER DRIFT, reverb with an adjustable pitch shifter
  - PITCH SHIFTER, dual pitch shifter with +12 or -12 semitone settings
  - RIPPER, digital emulation of the FusionBox vacuum tube BBD delay and overdrive
  - LP FREEZER, sampler and looper with a low pass filter, max sampling time 0.5s
  - HP FREEZER, sampler and looper with a high pass filter and reverb
  - DRONE BANK, three oscillator drone bank with FM inputs on inputs 1 and 2
