description: Electric organ sound for your Bullfrog
details: |-
  The ELECTRIC ORGAN voicecard makes internal connections in the Bullfrog that emulate a pipe organ when several notes are played together. It also illustrates the principles of additive synthesis, where several simpler waveforms are mixed together to generate a more complex sound.

  On this voicecard the pulsewave is sent to the DIVIDER and all outputs of the divider are mixed with the original pulsewave before going to the VCF and then the VCA. Both envelope generators are involved in the same way as on the Acid Bassline voicecard. The divider divides the original frequency by even numbers, producing pitches an even number of octaves below the original, and faders on the voicecard set the amplitude of each suboctave.

  Erica Synths suggests turning VCA OFFSET fully counter clockwise, setting PULSE OUT to maximum and pressing the MANUAL GATE button to hear the sound, then tweaking the faders to hear the difference each suboctave makes. Tweaking CUTOFF and RESONANCE and adding echo with the DRY/WET knob at 12:00 along with suitable DELAY TIME and FEEDBACK settings completes the patch, which is then ready to be played from a connected keyboard.
specs: |-
  - Instant electric organ sound
  - Easily adjustable octaves with faders
  - Internal patch voicecard
