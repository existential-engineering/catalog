description: 3 x 3.5mm mono jack plugs to 8 pin Jones plug. Connects Kenton
  converters to EMS synths. Note that this cable is all you need to connect to
  an EMS synth as the 8 pin plug houses all the necessary interface components.
details: |-
  An interface lead that breaks out three 3.5mm mono jack plugs to a single 8 pin Jones plug, so a MIDI to CV converter can drive an EMS synthesiser. No separate interface box is required, because the components needed to match the converter outputs to the synthesiser are housed inside the 8 pin plug itself.

  The control voltage arrives at the synthesiser's patch panel as Input 1, which can then be patched anywhere on the panel, most often to the oscillators.

  The converter's Aux 1 output arrives as Input 2 and is likewise free to be patched where wanted, most often to the filter.

  The gate signal is hard wired to gate rather than brought to the patch panel.
specs: |-
  - Three 3.5mm mono jack plugs on the converter end
  - Single 8 pin Jones plug on the synthesiser end
  - Interface components housed inside the 8 pin Jones plug
  - CV presented at the EMS patch panel as Input 1
  - Converter Aux 1 output presented as Input 2
  - Gate signal hard wired to gate
