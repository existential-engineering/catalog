details: |-
  The 4J-60 pickup, but over-wound with larger 6mm pole pieces for hotter output and fatter lows. Larger 6mm magnets and over-wound design give this pickup big personality – with an edge. Thick lows and a growly midrange character define the sound of the HOT series, all while capturing the dynamics and nuances of your playing. The AG 4J-Hot pickups are direct replacements for Jazz Bass style basses.
