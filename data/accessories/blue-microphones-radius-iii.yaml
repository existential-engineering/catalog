details: |-
  Radius III is a custom shockmount for Yeti and Yeti-family USB microphones, sold by Logitech G under the Blue microphone line. It suspends the microphone so that unwanted noise and vibration are isolated from the capsule.

  The mount is built specifically for the Yeti form factor rather than as a generic cradle, so a Yeti sits in it in place of its standard desk stand. It is offered in a single black finish.

  The shockmount measures 2.36 in (60 mm) high, 7.28 in (185 mm) wide and 9.65 in (245 mm) deep, and weighs 10.23 oz (290 g). It carries a 2-year limited hardware warranty.
