description: A universal 9V DC, 2.5A negative-tip wall power supply with more
  than enough current to power any Empress pedal. It ships with interchangeable
  plug adapters for outlets in North America, Europe, the UK, China and
  Australia/New Zealand.
details: |-
  Empress pedals do not include a power supply in the box, so this universal 9V, 2.5A negative-tip adapter is offered to power any of them, with plenty of current headroom for high-draw pedals like the ZOIA.

  It accepts 100-240 VAC (50-60 Hz) input and outputs a regulated 9.0 VDC at up to 2.5 A with negative-tip polarity. Interchangeable plug adapters are included for North America, Europe, the UK, China and Australia/New Zealand outlets. It meets Level VI efficiency standards.
specs: |-
  - Output: 9.0 VDC, 2.5 A, negative-tip polarity
  - Input: 100-240 VAC, 50-60 Hz (range 90-264 VAC)
  - Input current 0.7 A (RMS) at 115 VAC; max inrush 60 A at 115 VAC (cold start)
  - Regulation (line & load) +/-5%, ripple 150 mVpk-pk max
  - No-load power < 100 mW typical; average efficiency 83.50% typical (meets Level VI)
  - Interchangeable plug adapters: NA, EU, UK, China, Australia/New Zealand
