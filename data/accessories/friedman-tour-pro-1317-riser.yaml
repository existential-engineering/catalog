details: |-
  An add-on 4 by 6 inch metal riser that fits the Tour Pro 1317 pedal board and nothing else, shipped with the screws needed to mount it.

  While most pedal boards have either a flat or a slanted surface, the Tour Pro boards are designed with two tiers, a bottom section that is flat and a top section that is angled, with all the holes needed for easy cable routing. The two-tier design gives a player access to every pedal on the board without toe-extending dance moves, and the riser addresses the need for wah and volume pedals: it can be mounted in various locations on the bottom tier, in a left footed or right footed layout.

  The Tour Pro 1317 already ships with one detachable riser, so this is the part to buy when a second one is wanted or an original is lost.
specs: |-
  - Add-on metal riser, 4 in x 6 in
  - Fits the Tour Pro 1317 only
  - Mounts in various locations on the board's bottom tier
  - Ships with mounting screws
