description: Socket upgrade kit that fits CV, Gate, Filter, Portamento and
  Accent input sockets to the Roland MC-202, so the synthesiser can be played
  directly from a Kenton MIDI to CV converter.
details: |-
  This kit adds CV, Gate, Filter, Portamento and Accent sockets to the Roland MC-202. Used with a MIDI to CV converter such as the Pro Solo mk3 or the Pro-2000 mkII, the five extra sockets let the synthesiser be played from a MIDI keyboard or MIDI sequencer.

  The inputs sit on 3.5mm mono jack sockets. CV provides volt per octave control over oscillator frequency, Gate controls when notes play with 0 volts as note off and above 3 volts as note on, Filter controls the cutoff frequency of the low pass filter from the aux output of the converter, Portamento switches the portamento feature on or off, and Accent switches the accent feature on or off.

  The MC-202 already carries CV and Gate input sockets, but they are designed for entering information into its internal sequencer, so incoming notes are quantised into discrete steps. A pitchbend played through them climbs in semitones rather than smoothly, response is slower because the note passes through the sequencer circuitry, and the note range is limited to what the sequencer can play. The added sockets avoid all three limitations.

  Paired with a Pro Solo mk3 or Pro-2000 mkII, the kit gives control over notes across at least five octaves, pitchbend with a range set in the converter, modulation from the converter's own LFO with speed and waveshape adjustable in real time, portamento with a rate adjustable in real time, filter cutoff from any continuous controller or from aftertouch or velocity, selectable low, high or recent note priority, and single or multiple note trigger modes.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the five 3.5mm mono jack sockets. The MC-202 also carries a 5 pin sync input socket, which can be driven from the sync 24 output of a Kenton converter to run its internal patterns in time with a MIDI sequencer. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Adds five 3.5mm mono jack input sockets: CV, Gate, Filter, Portamento and Accent
  - CV input is volt per octave over oscillator frequency
  - Gate threshold is 0 volts for note off and above 3 volts for note on
  - Filter input controls low pass filter cutoff from the converter aux output
  - Portamento and Accent inputs switch on above 3 volts and off at 0 volts
  - Note range of at least five octaves, limited by the synthesiser rather than the kit
  - Intended for use with a Kenton MIDI to CV converter such as the Pro Solo mk3 or Pro-2000 mkII
  - Sync 24 from a converter uses the MC-202 existing 5 pin socket and a fully wired 5 pin DIN lead
  - The MC-202 does not recognise song position pointers, so a synced sequence must start from the top
  - Passive socket kit, so it has no power connection of its own
