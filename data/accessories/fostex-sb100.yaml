description: Sound board that further brings out the acoustic performance of compact speakers. The SB100 can be installed without suppressing the resonance of the bottom surface, as if the speaker system were floating, thanks to the composite structure of aluminum and EVA sponge feet placed at the four corners of the top surface. The bottom surface is also entirely finished with EVA sponge to prevent rattling during installation and to insulate the speaker system from vibrations, enabling a more natural sound field reproduction.
details: |-
  Sound board that further brings out the acoustic performance of compact speakers.

  The SB100 can be installed without suppressing the resonance of the bottom surface, as if the speaker system were floating, thanks to the composite structure of aluminum and EVA sponge feet placed at the four corners of the top surface.

  The bottom surface is also entirely finished with EVA sponge, which prevents rattling during installation and insulates the speaker system from vibration, enabling a more natural sound field reproduction. It is shown in use with the GX100BJ speaker system (sold separately).
specs: |-
  - External dimensions: 164 (W) x 224 (D) x 26 (H) mm
  - Mass: approx. 390 g
  - Materials: MDF (t15) substrate, aluminium (foot), EVA (foot upper and lower surfaces), needle felt (sides)
  - Composite aluminium and EVA sponge feet at the four corners of the top surface
