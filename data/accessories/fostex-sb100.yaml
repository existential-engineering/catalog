description: Sound board that further brings out the acoustic performance of
  compact speakers. The SB100 can be installed without suppressing the resonance
  of the bottom surface, as if the speaker system were floating, thanks to the
  composite structure of aluminum and EVA sponge feet placed at the four corners
  of the top surface. The bottom surface is also entirely finished with EVA
  sponge to prevent rattling during installation and to insulate the speaker
  system from vibrations, enabling a more natural sound field reproduction.
