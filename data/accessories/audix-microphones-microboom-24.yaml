details: |-
  Designed to be used with the award winning Micros Series of miniaturized condensers. Lightweight and able to attach to any standard microphone stand, the MicroBoom is a problem solver for portability and hard-to-reach miking applications including choir, live theater and orchestra.

  The MicroBoom can be used with a choice of capsules in the Micros Series, offering a broad choice of pick-up pattern and frequency response. A high quality shielded cable is used internally to insure the cleanest audio signal path between the microphone and the bottom of the boom, which terminates in a mini-XLR male connector. The MCBOOM adaptor allows for total control over the angle, rotation and position of the carbon fiber rod. This is the 24-inch (approx.) carbon fiber boom; the microphone capsule is sold separately and the boom itself contains no electronics.
