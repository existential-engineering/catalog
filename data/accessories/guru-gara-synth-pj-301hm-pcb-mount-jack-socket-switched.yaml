  The PJ-301HM a high-quality, switched 3.5mm mono jack socket widely used in DIY audio and modular synthesizer builds. Also known as WQP518MA , and PJ398SM , it's fully compatible with most Eurorack PCBs and front-panel kits, including the majority of kits offered here. Key Features

