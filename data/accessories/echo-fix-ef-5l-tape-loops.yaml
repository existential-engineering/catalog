details: |-
  2 x Replacement EF-5L Tape Loops for the Echo Fix EF-X2, EF-X3 and EF-X3R Tape Echos

  These loops are only available to owners of the Echo Fix EF-X2 and are at a reduced price. We have a huge amount of tape stock and this is to ensure there will be enough tape for owners of the Echo Fix Tape Echos for decades to come. Packaged in slimline shock proof plastic cases. Note: Our tape is NOT BASF LGR-50 or Mastering tape which is not suitable for the Echo Fix tape echo range. The tape we use is very specific and ensures correct operation. Even mastering tape with a graphite backing is not suitable. Incorrect tape will cause low echo output, tape jamming, distorted echo output, little or no self oscillation, incorrect tone and excessive head wear and will void your warranty. Over 90% of the the echo repairs that come in to our workshop are due to faulty tape loops that were made with incorrect tape. Make sure that you are familiar with your country's customs, taxes and importing laws.
