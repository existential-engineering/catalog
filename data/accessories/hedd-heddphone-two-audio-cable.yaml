details: |-
  The official audio cable for the HEDDphone TWO, engineered with a Kevlar-infused braided construction for durability and signal integrity. Each cable is 2 meters and 20 cm long and is compatible across the HEDDphone D1, TWO, and TWO GT models.

  Two variants are offered: an unbalanced TRS single-ended cable running 6.35 mm to 3.5 mm, and a balanced TRRRS cable running 4.4 mm to 3.5 mm. Backed by a 5-year warranty.
specs: |-
  - Unbalanced variant: TRS single-ended, 6.35 mm to 3.5 mm
  - Balanced variant: TRRRS balanced, 4.4 mm to 3.5 mm
  - Length: 2 meters 20 cm
  - Construction: Kevlar-infused braided cable
  - Compatibility: HEDDphone D1, TWO, TWO GT
  - Warranty: 5 years
