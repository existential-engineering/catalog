description: Adds filter control sockets to the Yamaha CS-30, so the cutoff
  frequency of the low pass filter can be voltage controlled from the auxiliary
  outputs of a MIDI to CV converter.
details: |-
  A two socket upgrade kit for the Yamaha CS-30 that adds filter control sockets. The synthesiser already has suitable CV (Hz/V) and Gate (S-Trig) sockets, so those do not need to be added.

  The extra sockets let the cutoff frequency of the low pass filter be voltage controlled, typically from the auxiliary outputs of a MIDI to CV converter such as the Pro-Solo mkII, Pro-USB or Pro-2000 mkII. Filter cutoff can then be driven from any continuous controller, or from other MIDI messages such as aftertouch or velocity.

  For a complete connection, the CS-30's CV (Hz/V) input goes to the CV output of the converter with Hz/V scaling selected in the converter menu, and the S-Trig input goes to the Gate output of the converter with S-Trig and 5V pullup selected. The filter inputs go to the auxiliary outputs of the converter, controlled by CC#16 by default.

  The kit contains the components, the 3.5mm mono jack sockets and diagrams for connecting the wires and components. Fitting is a job for a competent synthesiser service engineer.
specs: |-
  - Adds two sockets for filter cutoff control
  - For the Yamaha CS-30, which already has CV (Hz/V) and Gate (S-Trig) sockets
  - Inputs are on 3.5mm mono jack sockets
  - Filter inputs are driven from the auxiliary outputs of the converter
  - Filter cutoff is controlled by CC#16 by default
  - Requires Hz/V scaling and S-Trig with 5V pullup selected in the converter
  - The kit adds sockets only and has no power input of its own
