details: |-
  Sontronics Hypercardioid Capsule

  The hypercardioid capsule for the Sontronics STC-1 and STC-1S microphones offers exceptional directionality, making it ideal for isolating sound sources in noisy or reverberant environments. This capsule provides greater side rejection than standard cardioid patterns, ensuring more focused audio capture with minimal off-axis interference. Perfect for studio or live recording, it delivers pristine sound quality for instruments, vocals, or any detailed audio work. The finish complements the design of your STC-1 or STC-1S mic, maintaining a sleek, professional look.
