description: Single socket upgrade kit that fits a filter control input to the
  Roland SH-09, so the low pass filter cutoff can be voltage controlled from the
  aux output of a Kenton MIDI to CV converter.
details: |-
  This kit adds a single filter socket to the Roland SH-09. The synthesiser already carries suitable CV and Gate sockets, so those do not need to be added.

  The extra socket lets the cutoff frequency of the low pass filter be voltage controlled. That voltage comes from an aux output of a Kenton MIDI to CV converter such as the Pro-Solo mkII or the Pro-2000 mkII.

  With the converter in place, filter cutoff can then be driven from any continuous controller or from other MIDI messages such as aftertouch or velocity.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the 3.5mm mono jack socket. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Adds one 3.5mm mono jack filter control input socket
  - Controls the cutoff frequency of the SH-09 low pass filter
  - Driven from an aux output of a Kenton MIDI to CV converter
  - Compatible converters include the Pro-Solo mkII and the Pro-2000 mkII
  - CV and Gate sockets are already fitted to the SH-09, so the kit does not add them
  - Passive socket kit, so it has no power connection of its own
