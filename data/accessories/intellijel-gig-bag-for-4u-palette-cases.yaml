details: |-
  The Transporter: High quality and durable padded gig bags for transporting your precious modular synth cargo—don't worry, there is enough head room to leave your system patched.

  Very high quality and durable padded gig bags for transporting your precious modular synth cargo. Sized for our 4U Palette Cases.
specs: |-
  - Padded main compartment protects your case from bumps and scratches.
  - Zipped outer pocket for stuffing accessories and other gear.
  - Rear pocket closes with velcro at the top but unzips at the bottom to become a handle sheath so your case can sit on top of a rolling suitcase.
  - Super beefy strap connectors with clipped strap.
  - Lightweight with a single handle design.
  - 4U × 62HP: 39 × 30 × 11 cm, 0.96 kg (SKU BAG-4U-62HP)
  - 4U × 104HP: 60 × 30 × 15 cm, 1.3 kg (SKU BAG-4U-104HP)
