details: |-
  The Power Your Pedals Crave Let’s cut the noise—literally. Introducing Raw Power, the power supply built for the musicians who demand only the best for their pedalboard. It’s cleaner. It’s tougher. It’s got enough juice to fuel a pedal army, and it works anywhere in the world. No compromises. Details Silence the Static Tired of noise stacking up and killing your tone? Raw Power runs so quiet, you might think your pedals are whispering sweet nothings. Perfect for recording, rehearsing, or shredding on stage. Big Power for Big Rigs Got 30+ pedals? No problem. Raw Power laughs in the face of your sprawling pedalboard and keeps the energy flowing no matter what you throw at it. Global Domination Ready Wherever your music takes you, Raw Power ’s got your back. Raw Power works with any international power specification. Plug it in, power up, and play. Built for Battle It’s a Death By Audio product, so you know it’s a tank. Take it on tour, drop it, kick it—it’s ready to power through whatever chaos you throw at it. Your sound is everything. Don’t let a noisy, weak power supply ruin it. Step up to Raw Power —because your tone deserves the best, and anything less is unacceptable. Pure power. Zero compromise. Are you in? NOTE: Does not include daisy chain. Specifications Electrical Input Voltage: 100-240VAC Nominal Output Voltage: 9 VDC, Center-Negative Maximum Output Current: 3 A Physical AC Connector: American Type-A Plug (Universal Adapter-Compatible) DC Connector: 2.1mm Barrel Dimensions: 2.88" x 1.19" x 2.57*" (*includes plug prongs) Cable Length: 120" Weight: 7.7 oz.
