details: |-
  Pedaltrain Deluxe MX Soft Case for Classic Pro, PT-PRO, PRO FX & Novo 32 This case is a perfect replacement or upgrade for your Pedaltrain Pro, Novo 32, or Pro FX. A big rig like that needs a big case, and a big case certainly needs a big pocket. These are facts, we don't dispute this. We threw in a a nicely padded shoulder strap with durable swivel clasps - repetitive machine stress-tested to 44 lbs (or 20 kg, for you metric types) - for hauling your big rig to the big gig. Travel safely and play well. Durable construction, quality components, padded strap, and a great price. Features: Main Compartment Interior Dimensions: 32" x 17" x 6" (82 x 40 x 15 cm) Accessory Pouch Outer Dimensions: 21" x 14" x 1.5" (53 x 35 x 4 cm) Model: PT-CLP-MX-X
specs: |-
  - Familiar Pedaltrain soft case styling
  - Exterior accessory storage pocket (sizes vary by model)
  - Platinum SBS zippers on main compartment and accessory storage pocket
  - Premium shoulder strap with padded shoulder pad and enhanced swivel clasp
  - Easy-wipe interior
  - Water-resistant exterior shell
  - Deeper case, 6" or 15cm height (including lid height), for extra-tall pedals on all elevated Pedaltrain models
