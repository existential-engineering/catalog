description: A replacement EPROM chip carrying the latest firmware for the Pro
  2000 mkII MIDI to CV converter. The unit cannot be re-flashed, so the chip has
  to be swapped to upgrade it.
details: |-
  A firmware upgrade for the Pro 2000 mkII, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip, and a mkI unit cannot be upgraded to a mkII.

  The update applies to serial numbers 1310 onwards, which run firmware in the 52xx series. Earlier units carrying firmware 5114 can only be taken as far as 5116, and that step is needed only where the KADI functionality is in use.

  The installed firmware revision is briefly displayed whenever the unit is powered on. Holding both the Inc and Dec buttons while powering up keeps the revision number on the display until the buttons are released.

  The firmware history runs from KP2K5219 in January 2008 to KP2K5241 in October 2013. KP2K5219 added polyphonic mode, fixed-time portamento for channels A and B alongside the existing fixed rate, and sustain on the auxiliary outputs in volt per octave mode. Later revisions fixed bugs in polyphonic mode and the arpeggio clock output, rewrote the DAC output routines for longer settle times, changed the default for continue equals start to on, and added default setups for polyphonic modes and for popular synths that use something other than the standard 1V/Oct and gate, which appear after a reset to factory defaults.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: KP2K5241, dated 21/10/2013
  - Applies to serial numbers 1310 onwards, with firmware in the 52xx series
  - Units with firmware 5114 can only be upgraded to 5116, and only for KADI use
  - Firmware revision reported by holding Inc and Dec at power on
  - A mkI unit cannot be upgraded to a mkII
