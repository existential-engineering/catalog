details: |-
  This adapter lets gear with a Type B 3.5mm (1/8") TRS MIDI minijack connect to standard 5-pin DIN MIDI cables. It has a male stereo minijack on one end and a female 5-pin DIN MIDI connector on the other, with a 22 cm (8.5") cable length. It is compatible with 1010music's bitbox, fxbox, and MX4 products.

  Construction uses a copper core with nickel-plated brass connectors. 1010music also publishes a compatibility guide covering stereo minijack MIDI wiring and cross-brand compatibility.
