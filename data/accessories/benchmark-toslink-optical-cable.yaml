description: Benchmark-selected TOSLINK optical cable featuring precision
  gold-plated metal ferrules with silver aluminum back shells for accurate
  optical alignment. Low attenuation of less than 0.15 dB/m at 650 nm, assembled
  in Canada.
details: |-
  Benchmark Media selected this TOSLINK optical cable for its combination of performance and durability. The precision metal ends are engineered to maintain accurate optical alignment with TOSLINK transmitters and receivers, unlike typical plastic-ferrule alternatives that can allow connector slop and misalignment.

  The cable uses plastic optical fiber (POF) at 650 nm with a 5 mm OD flexible jacket. Attenuation is rated at less than 0.15 dB per meter, which allows runs of approximately 26 meters. The numerical aperture of 0.5 yields a 60-degree acceptance angle, and the minimum bending radius is 9 mm.

  Connectors are standard TOSLINK (IEC 60874-17) on both ends, with gold-plated metal ferrules and silver aluminum back shells. Assembled in Canada. Available in 3-foot (1 m) and 6-foot (2 m) lengths.
specs: |-
  - Connectors: TOSLINK to TOSLINK (both ends)
  - Fiber type: Plastic optical fiber (POF), 650 nm
  - Ferrules: Gold-plated metal with silver aluminum back shells
  - Cable OD: 5 mm
  - Attenuation: <0.15 dB/m at 650 nm
  - Numerical aperture: 0.5
  - Acceptance angle: 60 degrees
  - Minimum bending radius: 9 mm
  - Maximum recommended distance: ~26 m
  - Assembled in Canada
  - Lengths available: 3 ft (1 m), 6 ft (2 m)
