details: |-
  Please Note: Limit of 2 tape loops per customer order (1 x 2 pack). 2 x Replacement Korg Stage Echo for SE-300 & SE-500

  We have researched tape loops for the Korg Stage Echo units extensively and we are very proud to be able to supply tape loops that are the best available for the Korg tape echo. Our tape has a rich tone with high echo output that self oscillates perfectly when needed. The tape is same type originally available from Korg. Packaged in slimline shock proof plastic cases. Make sure that you are familiar with your country's customs, taxes and importing laws. Note: Our tape is NOT BASF LGR-50 or Mastering tape which is not suitable for these units. Incorrect tape can cause low echo output, tape jamming, distorted echo output, little or no self oscillation, incorrect tone and excessive head wear. Over 90% of the repairs that come in to our workshop are due to faulty tape loops that were made with incorrect tape.
