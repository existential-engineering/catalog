details: |-
  Maximise space in the booth and product longevity with our range of solid plates and brackets for CDJs, XDJs and FX units. With a solid, weighted balanced design and a durable powder-coated finish, each plate is tailored to fit its partner product. Each plate features anti-vibration pads and 6 fixing holes with supplied screws. Other design touches include adjustable height and angle, improved airflow, and cable management through the stem of the bracket.

  Top plates and brackets are sold separately.
