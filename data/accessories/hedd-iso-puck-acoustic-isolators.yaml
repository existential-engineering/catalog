name: ISO-PUCK Acoustic Isolators
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/iso-puck-mini-acoustic-isolators
description: A HEDD-branded set of eight IsoAcoustics ISO-PUCK acoustic
  isolators that decouple studio monitors from their surface, offering high
  isolation while preventing lateral movement for greater clarity and focus.
details: |-
  These pucks feature a patented design that offers a high degree of isolation while preventing lateral movements and oscillations, giving you greater clarity and focus.

  The set contains 8 pucks and is described as a great, cost-effective way to improve the performance of your monitors. It is compatible with all HEDD models.

  Each puck measures 1.7" x 0.9" (44 x 24mm) and supports a weight capacity of 6 lbs (2.75kg) per unit.
specs: |-
  - Quantity: 8 pucks per set
  - Dimensions: 1.7" x 0.9" (44 x 24mm)
  - Weight capacity: 6 lbs (2.75kg) per unit
  - Patented isolation design; prevents lateral movements and oscillations
  - Compatible with all HEDD models
