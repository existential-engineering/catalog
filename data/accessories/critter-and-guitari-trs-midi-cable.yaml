description: Male 3.5mm (1/8") TRS to female 5-pin DIN adapter cable, TRS-MIDI
  Type A, for connecting Organelle S2 to standard 5-pin DIN MIDI devices.
details: |-
  Male 3.5mm (1/8") TRS to Female 5-pin DIN adapter. This adapter cable will connect the Organelle S2's TRS-MIDI In or Out ports to another device with a 5-pin DIN MIDI port. This adapter cable is TRS-MIDI Type A as set by the MIDI Manufacturers Association. Note: you will need a standard 5-pin MIDI cable between this cable and your other device. Overall length: 10.25" (~26cm).
