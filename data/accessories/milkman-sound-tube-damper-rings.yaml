details: |-
  Silence your tubes

  ABOUT

  These custom made high temperature silicone damper rings will prevent your tubes from dancing along with the music coming from your speaker. Commonly referred to as "tube rattle" this metallic ringing sound can occur in any tube amplifier - especially a high power combo amplifier in a small package. Milkman now offers two common sizes of damper rings: Small will fit on your 12AX7 and 12AT7 type preamp tubes, and Large fits on 5Y3, 5AR4, 6V6 and 6L6 tubes. Sold a la carte and also in sets.
