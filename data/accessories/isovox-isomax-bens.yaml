description: Bass Enhancing Noise Shields are optional add-on acoustic panels
  for the ISOVOX PRO that boost low-frequency response and block external noise.
  They attach magnetically to the outside of the booth's Acoustic Gills.
details: |-
  Elevate your recording capabilities with the ISOMAX BENS (Bass Enhancing Noise Shields). These optional external add-on panels are designed specifically for the ISOVOX PRO to provide a modular performance upgrade for your vocal booth. Whether you are dealing with a noisy environment or simply want more control over your vocal tone, these shields offer the flexibility needed to achieve professional results. Key Benefits:

  Technical Specifications:
  Type : Optional Add-On
  Dimensions : 69 x 39 cm (27.2 x 15 inches)
  Weight : 650g (1.4 lbs)
  Origin : Designed and Made in Sweden/Scandinavia

  What's Included:
  2x ISOMAX BENS (Left and Right panels)
  Note: These shields are highly recommended for users recording in challenging acoustic environments or those seeking additional tonal flexibility and low-end depth in their vocal tracks.
specs: |-
  - Enhanced Low-Frequency Response: Specifically engineered to boost the low-end weight of your recordings.
  - Superior Noise Isolation: Effectively blocks heavier external noise, making it the perfect solution for loud spaces or untreated rooms.
  - Customizable Tonal Palette: While the ISOVOX PRO is known for its balanced, reference-grade response, these panels allow you to adapt the acoustic environment to suit specific voices, microphones, or artistic preferences.
  - Magnetic "Tool-Free" Installation: The panels attach magnetically to the outside of the ISOVOX PRO's Acoustic Gills, allowing for fast, effortless installation and removal.
