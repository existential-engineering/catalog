details: |-
  Regardless of how you feel about faders versus rotary knobs, I think we can agree that a good cap makes any fader significantly better, compared to bare-shafted or rubber capped linear potentiometer. After making many (and I mean many ) incredibly bad and ill-fitting fader cap designs, I finally designed something that felt good and natural to use with a fader. The wide, flat orientation makes it easy to pinch, push and pull, and offers finer and more confident control, especially during performances. The cap is dimensioned to be able to sit side by side with other faders, and doesn't extend beyond the top or bottom of the fader, so it is very unlikely to collide with anything else. It is designed to fit 4mm x 1.2mm levers, and will accommodate all standard lengths. Each item is 3D printed here in my workshop, where I can personally control and inspect the manufacturing process. Please be mindful that these are small-batch in-house manufactured items, not mass produced injection-molded commodities, so while every effort is made to ensure your products work well and feel good, there is a chance there can be minor cosmetic oddities and blemishes which do not affect performance. Customization is available

  Need a different color? Contact me, chances are I can accommodate. Be mindful that non-stocked colors incur a €20 minimum startup fee per color. Sizes to fit different levers are also possible, but please contact me first.
