description: The PG-P Type F is a portable studio-grade power conditioner and
  surge protector designed to eliminate electrical noise from musicians'
  equipment. It uses premium Panasonic capacitors to deliver the same noise
  filtering found in rack-mount power conditioners, in a portable form factor
  with six wall-wart spaced Schuko (Type F) outlets.
details: |-
  Black Lion Audio brought their rack-mount power conditioning expertise to a portable form factor with the PG-P Type F — designed for the European/Russian Schuko market. Despite its compact strip design, the PG-P Type F delivers studio-class noise filtering using premium Panasonic capacitors, providing an average of triple the noise filtering of other portable power conditioners at the same price point. Six wall-wart spaced outlets accommodate bulky power bricks side by side. Ideal for portable musician rigs, home studios, and performance setups where 230V Schuko power is standard.
specs: |-
  - Voltage: 230V, Schuko Type F plug
  - 6 wall-wart spaced outlets
  - Premium Panasonic capacitors
  - Studio-grade noise filtering (3x competitors at same price point)
