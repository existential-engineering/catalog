details: |-
  The Copper Shock Mount is built for players and engineers who need to cut vibration on stage and in the studio, whether that is a rowdy old-time band flatfooting with confidence or a recording engineer trying to remove low-end mic stand rumble.

  It combines an elegant design with a practical vibration-cutting array of rubber shock bands suspended in a large copper tube. Four solid rubber bands hold the microphone, a pivoting wing nut allows precise positioning, and the all-metal brass and copper body is made to match Ear Trumpet Labs microphones. The mount grips the body of any Ear Trumpet Labs microphone firmly and attaches to standard mic stand threads, straight or boom.

  Ear Trumpet Labs had the mount road tested and refined by The Milk Carton Kids for 12 months to arrive at an artist-approved solution to vibrations. Each one is built by hand by the Ear Trumpet Labs artisans in Portland, Oregon.
specs: |-
  - Cuts vibrations from stage rumble, mic stand noise, and more
  - Four solid rubber shock bands suspend microphone in a large copper tube
  - Pivoting wing nut for precise positioning
  - All-metal brass and copper body that matches Ear Trumpet Labs microphones
  - Mounts to standard mic stand threads, compatible with straight and boom stands
  - Universal fit for all Ear Trumpet Labs microphones
  - Built by hand by the Ear Trumpet Labs artisans in Portland, Oregon
  - Dimensions: 2" x 2¼" x 4½"
