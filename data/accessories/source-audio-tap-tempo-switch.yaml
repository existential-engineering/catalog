details: |-
  The Source Audio Tap Tempo Switch is a simple footswitch that adds significant functionality to every One Series pedal in the Source Audio collection. It offers on-the-fly tap tempo control over modulation rates for the Vertigo Tremolo, Lunar Phaser, Gemini Chorus, and Mercury Flanger, as well as delay times for the Nemesis Delay.

  The Tap Tempo also makes it possible to externally scroll through presets on the Nemesis Delay, toggle between distortion engines on the L.A. Lady Overdrive, Kingmaker Fuzz, and AfterShock Bass Distortion, or render virtual knob changes to every One Series pedal. In addition, the Switch has a standard 1/4" output for use with compatible third-party products (normally open [NO], single pole/single throw (SPST)).

  With the One Series modulation pedals users can tap out the modulation rate and use the SPEED knob to set beat divisions (quarter note, eighth, 16th and triplets). With the One Series distortion pedals, the Tap Tempo Switch can toggle between two distortion engines, engaging or bypassing either engine when cascaded, or adding/subtracting the second engine when run in parallel.

  The Tap Tempo Switch's standard 1/4" TRS jack connects to most pedals featuring standard external normally open [NO], single pole/single throw (SPST) tap tempo connections.
specs: |-
  - Includes 1/8" TRRS Daisy Chain/Sensor cable for use with Source Audio One Series pedals
  - Footswitch: momentary single pole/single throw
  - 1/8" TRRS Output: connects with any Source Audio One Series pedal
  - 1/4" TRS Output: connects to compatible 3rd party pedals (normally open (NO), SPST switch)
  - Dimensions: L: 2.5 in./6.35 cm x W: 2.25 in./5.7 cm x H: 2 in./5.1 cm (including switch)
  - Weight: 0.4 lbs / 0.18 kgs
