description: Wall mounting bracket for the Fostex 6301N series and NF04R compact
  active monitor speakers. Enables angle adjustment of the speaker body and wall
  mounting; also compatible with the discontinued 6301B-H series. Speakers are
  sold separately.
details: |-
  The EB-6301 is a wall mounting bracket designed for use with the Fostex 6301N series and NF04R compact active monitors.

  It allows the mounted speaker's angle to be adjusted while securing the cabinet to a wall.

  The bracket is also compatible with the discontinued 6301B-H series.

  External dimensions are 200 (W) x 75 (H) x 148 (D) mm and the bracket weighs 850 g; speakers are sold separately.
specs: |-
  - External dimensions: 200 (W) x 75 (H) x 148 (D) mm
  - Weight: 850 g (speakers not included)
  - Compatible speakers: 6301N series, NF04R (also discontinued 6301B-H series)
