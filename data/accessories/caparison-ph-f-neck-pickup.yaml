description: A neck pickup with a three-magnet anisotropic construction that
  delivers high output and a dark, brooding sound rich in harmonics, well suited
  to heavy down-tuning.
details: |-
  The ideal companion to the PH-R, the Caparison PH-F features a three-magnet "anisotropic" construction, giving you massive amounts of output without compromising any of the tone. This arrangement of magnets, with one positioned centrally and additional ones on either side of the bobbin, contributes to a dark and brooding sound profile rich in harmonics and sustain - particularly in the mid-low frequencies, also making it ideal for heavy down-tuning with thicker strings. This pickup is available in two types: 2S attaches with two screws, standard for most guitars. 3S attaches with three screws, replacement type for Caparison guitars. 2S Version Dimensions PDF - 3S Version Dimensions PDF
