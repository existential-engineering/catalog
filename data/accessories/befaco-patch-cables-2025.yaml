description: Befaco Patch Cables 2025 are fully-molded, color-coded Eurorack
  patch cables in both straight and right-angle configurations. Cables are
  color-coded by length across nine sizes from 7cm to 300cm, making patch
  organization intuitive at a glance. Constructed with 99.99% oxygen-free copper
  and nickel-plated connectors for reliable signal integrity.
details: |-
  Befaco Patch Cables 2025 are designed and built for longevity in modular synthesizer setups. Both straight and right-angle variants are available, with each color corresponding to a specific cable length. The fully-molded construction uses 99.99% oxygen-free copper conductors with nickel-plated connectors and a 3.3mm cable diameter.

  The color-to-length system covers nine sizes from 7cm to 300cm, making patch organization intuitive. Straight cables ship in quantities of 3–6 per color depending on length; right-angle variants share the same color-coding scheme and are available individually or in sets.

  Available colors and lengths: Purple (7cm), Yellow (15cm), Black (30cm), Orange (50cm), Red (80cm), White (100cm), Blue (120cm), Green (200cm), Pink (300cm).
