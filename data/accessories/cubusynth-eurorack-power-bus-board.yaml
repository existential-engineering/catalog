description: A Eurorack power distribution board that connects up to 16 modules
  to a power supply, featuring noise filtering capacitors to reduce ripple and
  noise.
details: |-
  The CubuSynth bus board is used to distribute the voltages of your power supply to connect up to 16 Eurorack modules
  It features noise filtering capacitors to reduce noise in your power signal. Features:
  280mm * 40.6mm
  16 shrouded Eurorack power connectors (16pin)
  Noise filtering capacitors to reduce ripple and noise
  screw terminals on both sides for +12V, -12V, +5V, GND, CV and Gate to connect the power supply and/or chain multiple boards. With option to place Cold-pressed terminals on the Power Rails instead. 12 grounded mounting holes
  3 LEDs to indicate the three power rails

  Notes:
  It will only distribute the power from your power supply to your modules. No onboard power supply or Voltage regulators. No power cables or mounting accessories included.
