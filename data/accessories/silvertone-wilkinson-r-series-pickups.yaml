details: |-
  Model: S-RS1446 Matched Set. One of the most revered elements of the renowned 1960's Silvertone 1446 hollowbody were the unique pickups designed by Seth Lover and supplied exclusively to Silvertone by Gibson. That unmistakable clarity and warmth made the Silvertone 1446 famous. They were a specific model, designated the P19 and were in essence a modified PAF Mini Humbucking pickup with a unique 3+3 pole piece layout later used by Seth Lover in his "wide Range" Humbucking pickups he designed for Fender /CBS

  The sound is something special. To recreate these iconic pickups, Silvertone enlisted the services of legendary designer Trev Wilkinson. His Wilkinson "R series" pickups use only "vintage correct" materials and parts, assembled with precision and attention to detail that adheres to the historical construction methods used by the pioneers of the original classics. Both the covers and backing plates use unique tooling (rather than just modifing an existing mini humbucker) and the Alnico V bar magnets and winding wire are period correct, and wound to a Lower K Ohms resistance than common mini humbuckers, thereby imparting a unique tonal character to these pickups. And you must take notice that the bridge pickup has been slightly overwound by 5% to better match the neck pickups output. These pickups will install perfectly into any modern mini humbucking size pickup ring.

  The electrical and tonal profile is where the R series differs from a standard mini-humbucker. Resistance is deliberately low relative to a standard mini-humbucker, which gives the enhanced clarity and open vintage chime the 1446 is known for. The bridge pickup is overwound by 5% so that switching between positions holds an even volume. The result is high warmth with unmistakable clarity, replicating the 1446 hollowbody signature sound.
specs: |-
