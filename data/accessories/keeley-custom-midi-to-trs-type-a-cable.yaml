details: |-
  The Custom MIDI to TRS Type A Cable carries MIDI between a 1/4-inch TRS jack and a standard 5-pin DIN socket. The TRS end is wired to Type A, the arrangement adopted as the standard by the MIDI Association, with the tip as the sink that pulls the data line down and the ring as the source.

  Keeley's MIDI-controlled pedals use a Type A TRS connection on their Expression and MIDI jack, so the cable connects those pedals to DIN-equipped MIDI gear. The TRS plug is right-angled to sit close to a pedalboard.

  The cables are hand-made to order and offered in 2 foot and 6 foot lengths.
