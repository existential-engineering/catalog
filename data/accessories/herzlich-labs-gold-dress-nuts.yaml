details: |-
  You've got a beautiful black and gold Eurorack system - but what about your nuts? Don't get stuck with shabby nuts! And don't let them ruin the beautiful aesthetic you've worked so hard to achieve. Your friends at Herzlich have designed beautiful nuts to apply to your panels, made of brass and plated with gold to perfectly match the design of black and gold front panels. With both nicely machined knurls and a groove carved out in the top, scratch free installation is easy! Go ahead and compare my nuts to other nuts - the high quality is unmistakably Herzlich, and you won't miss your old nuts once you've tried these. Designed to fit commonly used 3.5mm jack sockets, these nuts will fit most modules, and really put the finishing touch on your aesthetic. Go ahead - impress your friends or delight the synthesist in your life today, by grabbing my nuts.
