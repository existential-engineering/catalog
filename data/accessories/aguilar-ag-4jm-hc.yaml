description: Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content, but with the added deep tone of the 4J-HC Neck pickup. These calibrated sets include one of Aguilar's AG 4M pickup for the bridge position and the AG 4J-HC pickup for the neck position.
details: |-
  Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content, but with the added deep tone of the 4J-HC Neck pickup.

  These calibrated sets include one of Aguilar's AG 4M pickup for the bridge position and the AG 4J-HC pickup for the neck position. The AG 4M humbucking pickups are wired in parallel to recreate the classic Stingray tone – crisp treble, articulate midrange and thunderous lows. By adding the AG 4J-HC pickup, you can enjoy the deep, resonant tone of a neck position, Jazz Bass pickup without any 60-cycle hum. The AG 4M/J-HC pickup sets offer players all of the characteristics that Aguilar pickups are known for – excellent string-to-string balance, consistency of tone and rich harmonic content. They sound great passive or active. When paired with an onboard preamp, such as Aguilar's OBP-1, 2 or 3, bassists will have the ultimate in tonal flexibility. The AG 4J-HC pickups are direct replacements for Jazz Bass style basses. The AG 4M Pickup is direct replacements for 4-string Music Man style basses.
specs: |-
  - Wire: 42-gauge Formvar wire
  - Magnets: Alnico V
  - Leads: Single conductor, heat resistant Teflon coat
