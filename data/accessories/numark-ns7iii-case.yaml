details: |-
  Professional protection for your NS7III.

  This coffin-style, heavy-duty flight case is designed specifically for NS7III, the Numark performance controller for Serato DJ software.

  Constructed with metal reinforcement, it has two heavy-duty casters and a handle for easy transport. The case's front and rear panels are easily removed, so you can perform with NS7III in the case for added convenience.
specs: |-
  - Metal reinforcement and dense protective foam padding
  - Wheels and handle for easy transport
  - Removable front and rear panels enable quick set up and breakdown
  - Accommodates laptop computer stand
  - Extra space for accessories
  - Case also fits NS7 and NS7II controllers
