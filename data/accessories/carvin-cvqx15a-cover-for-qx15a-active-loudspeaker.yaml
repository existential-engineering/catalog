details: |-
  Protective cover for QX15A . The CVQX15A is designed to protect the QX15A loudspeaker while in transit and storage. The CVQX15A features a removable front and rear panel allowing the speaker to operate with the cover installed. Top, bottom and side velcro flaps allow access to all handles and speaker stand mount. The cover will fit a loudspeaker that is 17.75 "W x 15.5"D x 27.5"H in size.
