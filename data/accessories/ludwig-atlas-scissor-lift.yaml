description: >-
  The Scissor Lift (LAP3S8) expands your set-up with unlimited cymbal placement
  flexibility. Featuring the Aerodyne tilter at both the boom and cymbal joint,
  it lets you bend, twist, and move cymbals into the right spot with gearless
  precision. Available in Long (dual 8") and Short (dual 5") models, the Scissor
  Lift simplifies drum set ups, hardware cartage, and set-up/tear-down time by
  eliminating the need for additional stands in multi-cymbal set ups.
