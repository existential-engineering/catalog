details: |-
  This flexible boom microphone cable is compatible with all Audeze over-ear LCD headphones (except LCD-1). It now incorporates the broadcast-quality mic capsule from the Penrose headset, which was developed in consultation with Shure.

  Key features include 4-pin mini XLR headphone connectors, a 3.5mm TRRS input with inline mute switch, a 3.5mm TRRS to 2x 3.5mm TRS microphone splitter, and an OMTP to CTIA adapter. Cable length is 8 feet.
specs: |-
  - Cable length: 8 feet
  - Headphone connectors: 4-pin mini XLR
  - Input: 3.5mm TRRS with inline mute switch
  - Microphone capsule: Broadcast-quality (sourced from Penrose headset)
  - Includes 3.5mm TRRS to 2x 3.5mm TRS microphone splitter
  - Includes OMTP to CTIA adapter
  - Compatible with all Audeze over-ear LCD headphones (except LCD-1)
