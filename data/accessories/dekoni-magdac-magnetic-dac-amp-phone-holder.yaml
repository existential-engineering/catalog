details: |-
  Keep Your Portable DAC/AMP Secure with Magdac

  The Dekoni Magdac is an innovative magnetic phone holder designed for audiophiles on the move. This compact accessory securely attaches your portable DAC/AMP to the back of your smartphone, creating a seamless high-fidelity audio solution. Key Features

  Strong magnetic adhesion keeps your device stable, while the elastic band design accommodates various DAC/AMP sizes. Simply snap the Magdac to your phone's back and slide your device under the secure band. Compatible with devices like the iFi Go Bar and similar portable amplifiers. Why Choose Magdac? Unlike bulky carrying cases, Magdac offers a lightweight, integrated solution for portable hi-fi audio. Take your premium sound quality anywhere without compromising on convenience or protection. Perfect for commuters, travelers, and audio enthusiasts.
