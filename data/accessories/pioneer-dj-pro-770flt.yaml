description: Flight case for MEP-7000 and 17-inch rack mount mixer
details: |-
  Constructed from quality 6mm birch ply, the PRO-770FLT is bonded by a red moulded PVC covering to reduce overall weight without compromising strength.  High grade black anodised aluminium profiles protect all exposed edges along with black powder coated fittings including recessed flip handles and over-latching catches. 

   Internally, a CNC machined plywood 'pod' forms the basis of the equipment housing.  A hard wearing black synthetic texture sprayed finish.  A dual position slide out laptop shelf is a key feature of the PRO-770FLT system case, enabling you to select either left or right handed operation. 

   This shelf incorporates professional ball-race telescopic slides for a smooth and durable movement.  Laptops up to 7.5kg can be mounted and can quickly be changed from left to right hand by just two screws. 

   Another unique feature of the system case is the pivoting rear 4u section which is primarily to house the MEP-7000 controller module.  This pod features custom fabricated powder coated steel panels designed by 5 Star Cases Ltd, laser cut and formed using 1.5mm steel. Incorporating ratchet stays, it allows a multi position pivot to the desired angle, while a curved rear cover hides all cabling and prevents trapped fingers.  

   Two USB ports (Type A and B) are included on the top panel enabling users to hook up a Laptop, External Hard Drives or USB 'sticks'.
