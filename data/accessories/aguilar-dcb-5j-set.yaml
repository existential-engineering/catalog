details: |-
  Full-bodied tone with a rich sustain characterizes the sound of the DCB series. Using the dual ceramic bar design, these pickups introduce a new and unique voice for Jazz style basses. These passive, hum-cancelling pickups are engineered to deliver higher output versus traditional passive pickups and are characterized by their full-bodied tone, rich sustain, and even dynamic response. A great choice for any player looking for a new dimension in sound. The DCB-5J pickup set is a direct replacement in the Fender Jazz V and many other 5 string J-style basses.
specs: |-
  - Wire: Polyester-nylon, 43 gauge
  - Magnets: Ceramic
  - Leads: Single conductor, Heat resistant Teflon coated
