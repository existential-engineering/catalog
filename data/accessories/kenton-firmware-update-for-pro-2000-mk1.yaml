description: A replacement EPROM chip carrying the latest firmware for the Pro
  2000 mkI MIDI to CV converter. The unit cannot be re-flashed, so the chip has
  to be swapped to upgrade it.
details: |-
  A firmware upgrade for the Pro 2000 mkI, supplied as a replacement EPROM chip. The unit cannot be re-flashed, so upgrading means fitting the new chip. The mkI was replaced by the mkII in March 2005, and a mkI cannot be converted into a mkII.

  The installed firmware revision is briefly displayed whenever the unit is powered on. Holding both the Inc and Dec buttons while powering up keeps the revision number on the display until the buttons are released.

  The firmware history runs from KP2K4304.745 in June 1997 to KP2K4305.331 in January 2003. Additions over that span include a new wavetable so the triangle LFO syncs at the top of the wave rather than the middle, auto sync, auxiliary outputs able to produce an ARP 2600 trigger signal and later full CVs and gates, recognition of all notes off and reset all controllers, SysEx send and receive, a pitchbend setting range raised to 24 semitones with a 128 note CV range, auxiliary ranges that update when programs change, and a 48 clocks per quarter note divide ratio for syncing a LinnDrum alongside the existing 24 cpqn mode.
specs: |-
  - Supplied as a replacement EPROM chip, the unit cannot be re-flashed
  - Latest firmware revision: KP2K4305.331, dated 22/01/2003
  - Firmware revision reported by holding Inc and Dec at power on
  - Pro 2000 mkI was replaced by the mkII in March 2005 and cannot be upgraded to it
