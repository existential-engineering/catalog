details: |-
  A plug-top (wall wart) power supply rated at efficiency level VI, giving 9 volts at 660mA regulated on a 2.1mm DC plug wired centre negative. The centre negative polarity is what older Roland instruments expect.

  The input is multi-region, accepting 100 to 240 volts at 50 or 60Hz, and is suitable for use in the UK, Europe, North America and Australia or New Zealand. Four interchangeable heads clip onto the main body of the supply. The lead is 1.4m long.

  It is intended for the Roland SH-101, MC-202, TB-303 and TR-606, and for any other equipment that needs a 9 volt regulated, centre negative supply on a 2.1mm DC plug.

  The product photograph is generic and may not show the correct voltage, current or polarity, although it does show the supply type, the four interchangeable heads and the DC plug.
specs: |-
  - Output: 9 volts, 660mA, regulated
  - Output plug: 2.1mm DC, centre negative
  - Input: 100 to 240 volts, 50/60Hz, multi-region
  - Supplied with 4 interchangeable mains heads
  - Wire length: 1.4m
  - Efficiency level VI
  - Suits the Roland SH-101, MC-202, TB-303 and TR-606
