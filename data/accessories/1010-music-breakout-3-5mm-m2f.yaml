description: A stereo breakout cable with a male 3.5 mm TRS minijack plug on one
  end and two female 3.5 mm TS mono minijack plugs on the other, connecting 2
  mono audio signals to a single stereo TRS 3.5 mm minijack. Sold individually
  or in a 3-pack.
details: |-
  The 1010music line of stereo breakout cables are designed to connect 2 mono audio signals to a single stereo TRS 3.5 mm minijack plug. The slim plug caps fit side by side with other cables in compactly spaced input jacks, like those on the 1010music bluebox. These cables may have been designed for the bluebox, but they have a wide variety of uses with other gear as well.

  Each cable connects two 3.5 mm female mono TS minijack plugs (left and right channels) to one 3.5 mm male stereo TRS minijack plug. Red and black end caps on the female end differentiate the left and right channels, and the 1010music logo is printed on the plug caps. Available individually and in 3 packs.
specs: |-
  - Length: 15 cm / 6 in
  - Connector: one 3.5 mm male stereo TRS minijack to two 3.5 mm female mono TS plugs
  - Nickel / 24K Gold plated connectors
  - Highly flexible PVC / TPE jacket material
  - RoHS, UL, CE, and FCC approved
  - Pack sizes: Single, 3 Pack
