details: |-
  Dekoni Audio Ensemble 3 meter Extension plugs Braided PCUHD Copper

  Enjoy full-room listening freedom from your favorite armchair or home theater rig with the Dekoni Audio Ensemble 3-Meter Extension. Engineered as an inline expansion for the Dekoni Ensemble modular cable system, this generous 9.8-foot cable bridges the distance between your source gear and headphone setup without compromising signal integrity. Key Features

  Featuring premium PCUHD (Pure Copper Ultra High Drawability) braided conductors, this extension preserves rich low-end texture, smooth midrange body, and natural warmth across long cable runs. The 3-meter (9.8-foot) length allows effortless movement in larger room setups. Built with robust aluminum connector housings, low-capacitance geometry, and a flexible braided sleeving, it snaps securely into any Ensemble upper Y-split and lower base cable. (Note: Designed exclusively for use within the Dekoni Audio Ensemble Cable System.)
