details: |-
  A replacement slider board pack for the Control Freak Studio and Original MIDI controllers. Each pack holds one board carrying 8 sliders. A Studio edition uses two of these boards and a Control Freak Original uses one.

  The pack also contains the associated mounting hardware, which lets the board be fitted to every generation of the Freaks, from the earliest units to the latest.

  Three different slider types were used across the production life of the Freaks: the earliest had short plastic shafts, later ones short metal shafts, and the latest slightly longer metal shafts. The pack includes all the parts needed to fit the replacement board into any Studio Edition or Original Control Freak regardless of which type it originally carried.

  Knobs are not included in this pack and are sold separately.
specs: |-
  - Fits the Control Freak Studio and Control Freak Original
  - One board per pack, carrying 8 sliders
  - A Studio edition contains two of these boards, an Original contains one
  - Includes mounting hardware compatible with all Control Freak generations
  - Knobs not included
