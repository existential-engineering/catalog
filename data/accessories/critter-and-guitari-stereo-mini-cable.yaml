details: |-
  Male-to-Male TRS cable with 3.5mm (1/8") plugs. This cable is great for TRS-MIDI connections. Use it to connect the Organelle S2's MIDI In or Out ports to the opposite port on another Organelle M/S/S2 or another device with TRS-MIDI Type A connections. Overall length: 26.75" (~68cm). Note: the Organelle S2 TRS-MIDI In & Out ports are TRS-MIDI Type A, the adopted standard of the MIDI Manufacturers Association.
