description: Die cast aluminum infrared remote control for Benchmark Media
  Systems audio components, featuring dedicated input selection buttons, a -20
  dB DIM button, and separate on/off buttons for universal remote integration.
details: |-
  The Benchmark Remote Control features a die cast aluminum frame for comfort and durability, distinguishing it from plastic remotes. It communicates via infrared (IR) and is compatible with the DAC1 HDR, DAC2, DAC3, HPA4, and LA4 devices. Early DAC1 HDR models require a factory upgrade to support the dedicated input selection buttons.

  The button layout includes dedicated input selection buttons for direct source access, a -20 dB DIM button for quick volume attenuation without altering settings, and separate on and off buttons. The separation of on/off functions is intentional, making the remote easier to integrate with universal remote control systems.

  The remote operates on a single battery accessed via a small Phillips screw on the underside. A battery is included with purchase.
specs: |-
  - Remote type: Infrared (IR)
  - Frame material: Die cast aluminum
  - Compatible devices: DAC1 HDR, DAC2, DAC3, HPA4, LA4
  - DIM button: -20 dB attenuation
  - Separate on and off buttons for universal remote compatibility
  - Dedicated input selection buttons
  - Battery included
  - Battery access: Phillips screw on underside
