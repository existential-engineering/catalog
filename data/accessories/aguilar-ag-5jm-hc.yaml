description: Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content, but with the added deep tone of the 5J-HC Neck pickup. These calibrated sets include one of Aguilar's 5M pickups for the bridge position and the 5J-HC pickup for the neck position.
details: |-
  Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content, but with the added deep tone of the 5J-HC Neck pickup.

  These calibrated sets include one of Aguilar's 5M pickups for the bridge position and the 5J-HC pickup for the neck position. The AG 5M humbucking pickups are wired in parallel to recreate the classic Stingray tone – crisp treble, articulate midrange and thunderous lows. By adding the AG 5J-HC pickup, you can enjoy the deep, resonant tone of a neck position, Jazz Bass pickup without any 60-cycle hum. The AG 5M/J-HC pickup sets offer players all of the characteristics that Aguilar pickups are known for – excellent string-to-string balance, consistency of tone and rich harmonic content. They sound great passive or active. When paired with an onboard preamp, such as Aguilar's OBP-1, 2 or 3, bassists will have the ultimate in tonal flexibility. The AG 5M is for basses using 18 to 19mm string spacing. Musicman style basses from Lakland and many others use this spacing. Please refer to the AG 5M dimensions for pickup size specifications. The AG 5M will not retrofit into Ernie Ball Musicman five string basses.
specs: |-
  - 5J-HC Wire: 43 gauge, Polyester-Nylon wire
  - 5M Wire: 42-gauge Formvar wire
  - Magnets: Alnico V
  - Leads: Single conductor, heat resistant Teflon coated
