description: Pro-DJ Cartridge for the PLX-1000
details: |-
  Designed for the PLX-1000 direct drive professional turntable in partnership with leading manufacturer Nagaoka, the hardy PC-X10 cartridge delivers high-quality analogue sound, excellent skip resistance and reliable performances with both vinyl and software (using DVS control). The PC-X10 cartridge comes with the replaceable PN-X10 stylus in the package, but you can also buy the stylus separately. The PC-X10 is only available online.
