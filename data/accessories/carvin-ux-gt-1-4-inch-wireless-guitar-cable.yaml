  UX-GT User Manual

  The UX-GT guitar cable allows players to connect their instrument to the UX600B body pack or UX1200B wireless system , giving guitar players the freedom to move about the stage without the confines of a traditional instrument cable. Features:

  1/4-Inch Connector for use with guitar and bass instruments
  Heavy insulated cable for maximum protection and signal quality
  4-Pin TA4F style connector works with Carvin UX600B, SHURE and Anchor Audio systems. Specifications:

  Type: 1/4-Inch Instrument cable
  Shielded Cable: Yes
  Connector Type: TA4F 4-Pin
  Cable Length : 32" (81cm)
