description: An add-on module for the EQP5 Passive Equalizer or OLA5 Opto
  Compressor built around a custom output transformer and discrete opamp. It
  gives signals a more forward, vintage character based on components found in
  classic API consoles.
details: |-
  Add the vintage sound of a discrete opamp and transformer to your EQP5 Passive Equalizer or OLA5 Opto Compressor . The bundle is based around our 2523 transformer and RED-25 discrete opamp . Both are based on the components found in vintage API consoles. Features

  The vintage output gives signals a more visceral, forward feeling that helps them translate clearly in a mix while requiring less level to do so. The solid-state Pultecs, the sound of which many engineers claim to be sweeter than that of the earlier tube units, use the same DOA/transformer output scheme. Docs
specs: |-
  - Custom, USA-wound output transformer
  - Use our RED-25 opamp or use your own
  - NOS tantalum capacitor
  - Transformer mounting hardware included
  - EQP5 Assembly Guide
  - EQP5 Vintage Output Assembly Guide
