details: |-
  Two-post height adjustable straight rack with a 43.5-inch cross bar. It utilizes 20-inch vertical legs with an 18-inch telescoping extender bar. The extender bar has 14-inch of vertical adjustability, with a notched number system, making it very easy to achieve your exact height every time. Designed to work with keyboards, DJ, drums, hand percussion, adjust the height to play sitting or standing. Height range from 26-inch to 41-inch. Includes:

  (1) GPR435 43.5-inch cross bar
  (2) GPR20 20-inch vertical legs
  (2) 18-inch extender bar
  (2) GCSQCLTLA large chrome T leg assemblies
  (2) RMAA rack mount attachment clamp
  (2) GCML slip on memory locks. Optional Add-On's:

  (2) DKB Mounting Brackets and (2) Multi Clamps

  (2) Tiltable Arms
