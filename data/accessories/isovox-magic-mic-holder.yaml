details: |-
  Magic Mic Holder : A Modern Alternative to Traditional Shock Mounts

  Ditch the bulk and reclaim your recording space. The Magic Mic Holder is a premium, universal microphone holder designed to provide faster setup, cleaner placement, and a sleek look without the hassle of traditional shock mounts. While large shock mounts often restrict precise positioning and clutter your visual setup, this compact solution keeps your microphone exactly where it sounds best—and stays out of the way when you don't need it. Why Upgrade Your Setup? Technical Specifications:
  Product Type: Universal Microphone Holder
  Microphone Diameter: ⌀18–78 mm (⌀0.71–3.07 inches)
  Thread Type: "Standard 5/8""–27 "
  Finish : Anodized Silver
  Installation : Tool-free mounting

  Perfect for ISOVOX PRO Users
  When used inside the ISOVOX PRO, the Magic Mic Holder ensures your microphone stays perfectly positioned within the acoustic "sweet spot". By maximizing internal space, it allows high-end microphones to perform at their full potential without the physical interference of a standard shock mount. It is also fully compatible with the ISOVOX Magic Mic Pole and standard microphone stands. Pro Tip: Use the upside-down mounting capability for your high-end tube mics to manage heat and achieve a classic studio aesthetic.
specs: |-
  - Compact & Space-Efficient: Replaces bulky, space-consuming traditional mounts with a minimal footprint.
  - Precision Placement: Enables fast and exact microphone positioning to capture the perfect take.
  - Versatile Mounting: Supports both upright and upside-down mounting, making it ideal for tube microphones and advanced techniques.
  - Professional Aesthetics: Provides a sleek, modern look that is perfect for on-camera use and modern studio environments.
  - Universal Compatibility: Securely fits most studio condenser, handheld, and pencil microphones.
