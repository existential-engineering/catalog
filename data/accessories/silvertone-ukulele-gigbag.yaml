details: |-
  Bags That Last

  Want to transport your Silvertone Ukulele in style? We took the iconic grey, black and red design cues from the legendary Silvertone 'Amp in Case' from the early 1960's, and incorporated them into durable and understated Ukulele gigbags. Designed to perfectly fit our Concert and Soprano size ukes. The fully adjustable shoulder strap makes carrying your ukulele a breeze, while it is safely tucked away inside a soft interior lining. The thick padding and rugged exterior will keep your ukulele safe from bumps and knocks when you're on the go.
specs: |-
  - Stylish 'Silvertone Heather Grey' water-repellent polyester exterior
  - Concert and Soprano Ukulele sizes
  - Padded handle and fully adjustable padded shoulder strap
  - Exterior pocket for cables, tuners, straps and song charts
