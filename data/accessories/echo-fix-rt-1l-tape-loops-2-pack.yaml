details: |-
  2 x Replacement Roland Space Echo RT-1L Tape Loops for models RE-101, RE-150, RE-201, RE-301, RE-501 & SRE-555

  We have researched tape loops for Roland Space Echo units extensively and we are very proud to be able to supply tape loops that are the best available for the Roland tape echo. Our tape has a rich tone with high echo output that self oscillates perfectly when needed. The tape is the same type originally available from Roland. Packaged in slimline shock proof plastic cases. Make sure that you are familiar with your country's customs, taxes and importing laws. Note: Our tape is NOT BASF LGR-50 or Mastering tape which is not suitable for these units. Even NOS Roland tape that has been stored correctly is not recommend as it has sticky shed syndrome and we are seeing repairs with this tape jammed in the mechanism. It will also dirty the heads with the shedding oxide. Incorrect tape or old Roland Tape loops can cause low echo output, tape jamming, distorted echo output, little or no self oscillation, incorrect tone and excessive head wear. Over 90% of the repairs that come in to our workshop are due to faulty tape loops that were made with incorrect tape or old Roland tape stock. If your tape echo has had any of this tape installed previously we recommend cleaning the heads with 99% Isopropyl alcohol and in some cases your heads will need to be polished to remove the thin layer of baked on oxide. We have a youtube video on how to polish the heads.
