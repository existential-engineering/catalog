description: The Revival Footswitch gives you access to two hidden features of
  the RevivalDRIVE line, letting you switch in the Mid Boost and Blend Override
  functions on the fly while on stage.
details: |-
  Revival Footswitch lets you remotely activate the RevivalDRIVE's sweepable mid boost on either channel, giving you the clarity you need to cut through the mix (set the RevivalDRIVE's MID ASSIGN switch to F/SWITCH). The RevivalDRIVE's Blend function mixes in your dry signal with your drive and is great for smoother, cleaner sounds. Blend Override gives you the flexibility to switch between your blended tone, and pure unadulterated overdrive at the press of a button.

  Housed in a hand polished, brushed stainless steel enclosure and furnished with heavy-duty footswitches, the Revival Footswitch is built to the same high standards as the RevivalDRIVE. It also includes a TRS patch cable, hand built using high grade Van Damme cable and Amphenol connectors.
specs: |-
  - Compatible with: RevivalDRIVE, RevivalDRIVE Custom, RevivalDRIVE Hot Rod, RevivalDRIVE Hot Rod Custom
  - Includes TRS patch cable, hand-built with Van Damme cable and Amphenol connectors
