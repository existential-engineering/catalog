description: Wasp cable 15 pin high density D plug to 7 pin DIN plug. Used for
  connecting the KADI port of a Pro-KADI, Pro-2000 or Pro-4 to a Wasp or Gnat
  synthesiser.
details: |-
  A connecting lead terminated in a 15 pin high density D plug at one end and a 7 pin DIN plug at the other.

  It joins the KADI port of a Pro-KADI, Pro-2000 or Pro-4 converter to an EDP Wasp or Gnat synthesiser.

  The same cable is included at no extra cost with the optional KADI port of a Pro-KADI or Pro-2000 when it is specified at the time of ordering. It was never supplied with a Pro-4.
specs: |-
  - 15 pin high density D plug to 7 pin DIN plug
  - Connects the KADI port of a Pro-KADI, Pro-2000 or Pro-4 to a Wasp or Gnat synthesiser
  - Included with the optional KADI port of a Pro-KADI or Pro-2000 when specified at the time of ordering
  - Not supplied with a Pro-4
