details: |-
  Overview & Features

  Heil FL-2 is a surface flange mount designed specifically for securing Heil microphone boom arms directly to the top of a desk, table, or console. Offering a stable, permanent mounting solution, the FL-2 ensures your boom arm remains firmly anchored in professional broadcast, podcast, and studio environments.

  Key Features
specs: |-
  - Integrated Security Lock: Allows the boom arm to be securely tightened into the exact position desired, preventing slipping or unwanted movement during use.
  - Noiseless Rotation: Engineered with a premium brass insert to ensure a smooth, exact fit and silent swivel rotation during live recording sessions.
  - Surface Top Mount: Easily mounts directly to desk or tabletop surfaces using three supplied mounting screws.
  - Compatible booms: Heil PL2T and SB-2.
  - Mounting type: desk or table top mount, includes 3 mounting screws.
  - Dimensions: 2 1/8″ H x 2 3/4″ W.
  - Stem acceptance: accepts 1/2″ boom stem.
