  Upgrade your comfort with plush, durable leather construction designed for long-wearing sessions. Customize your sound profile with Dekoni's Choice materials while maintaining studio-grade accuracy. Compatible with AKG K361, K361-BT, K371, and K371-BT models. Also fits Sony MDR-7506 and MDR-V6 headphones. Experience the Dekoni Audio difference—premium quality replacements that extend headphone lifespan and personalize your audio experience.
