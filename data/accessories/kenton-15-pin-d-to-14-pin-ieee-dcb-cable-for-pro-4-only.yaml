description: A 2 metre DCB cable from a 15 pin D plug to a 14 pin IEEE
  connector, for linking the DCB port of a Pro-4 to a Roland Juno 60 or to a
  Jupiter 8 fitted with the 14 pin IEEE connector.
details: |-
  A DCB cable wired from a 15 pin D plug to a 14 pin IEEE connector, 2 metres long.

  It connects the DCB port of a PRO-4 converter to a Roland Juno 60, or to a Jupiter 8 that carries the 14 pin IEEE connector. Some Jupiter 8 units instead have a 20 pin connector.

  Where a Jupiter 8 has the 20 pin adapter fitted, a 14 to 20 pin adapter is needed in addition to this cable. The cable is for the PRO-4 only.
specs: |-
  - 15 pin D plug to 14 pin IEEE DCB connector
  - Length: 2 metres
  - For the PRO-4 DCB port only
  - Target instruments: Roland Juno 60, Jupiter 8 with the 14 pin IEEE connector
  - A Jupiter 8 with the 20 pin adapter also needs a 14 to 20 pin adapter
