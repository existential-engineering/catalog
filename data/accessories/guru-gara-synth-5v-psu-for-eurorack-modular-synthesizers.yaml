details: |-
  +5V PSU for Eurorack – Easy Install (Fully Assembled Module)

  The +5V PSU for Eurorack is a fully assembled power expansion board designed to add a +5V rail to Eurorack systems that do not natively provide one. Compact and easy to install, this module converts +12V to +5V and distributes it directly to your power bus. No wiring or modification required. Simply insert the board into an available slot on your Eurorack bus board, and it immediately supplies regulated +5V power to compatible modules. Key Features

  Installation Notes

  Installation is quick and straightforward:

  Once installed, the board automatically regulates and distributes +5V to the power bus. Power Considerations

  Important Notes

  Technical Specifications
specs: |-
  - Fully assembled +5V regulator for Eurorack systems
  - Converts +12V to regulated +5V
  - Direct plug-in installation via standard Eurorack power bus
  - No additional wiring required
  - Compact form factor for easy integration
  - Ideal solution for systems without a native +5V rail
  - Insert the board into an empty connector on your Eurorack bus board
  - Ensure the triangle marking on the IDC connector aligns with −12V on the bus board (refer to product images for guidance)
  - Please note that current drawn from the +5V rail is sourced from the +12V rail. Ensure your +12V power supply has sufficient headroom to handle the combined current draw of both rails.
  - Bus board not included (shown in images for reference only)
  - Compatible with standard Eurorack power distribution boards
  - Intended for systems that already provide stable ±12V rails
  - Function: +12V to +5V regulation and distribution
  - Regulator Type : 7805 linear regulator
  - Installation: Direct plug-in to Eurorack bus board
  - Output Voltage: +5V (derived from +12V rail)
  - Format: Eurorack power accessory
