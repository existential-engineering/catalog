description: The Hosa Economy Microphone Cable comes with XLR connectors with
  internal strain relief to provide reliability and value.
details: >-
  Hosa Economy Microphone Cables are designed to provide years of dependable
  service. High-quality components and world-class manufacturing combine to
  deliver products of exceptional value.


  The cable terminates in Hosa XLR3F to XLR3M connectors with internal strain
  relief, and is built on 24 AWG x 2 Oxygen-Free Copper conductors with a 76%
  OFC spiral shield for EMI and RFI rejection.


  It is offered in 5 ft, 10 ft and 25 ft lengths, listed under Hosa's Microphone
  Cables category and carrying the Essential Hosa tag.
specs: |-
  - Connectors: Hosa XLR3F to XLR3M
  - Conductors: 24 AWG x 2 OFC
  - Shield: 76% OFC Spiral
  - XLR connectors with internal strain relief for rugged reliability
  - Oxygen-Free Copper (OFC) conductors for enhanced signal clarity
  - OFC spiral shield for effective EMI and RFI rejection
  - Available lengths: 5 ft, 10 ft, 25 ft
