details: |-
  Attention: The sensor does only work with the SOMI-1 receiver hub or the 2.4SINK Eurorack module. Additional motion sensor for SOMI-1 and 2.4SINK. Comes with wristband.
specs: |-
  - 7 different 3D movement parameters per sensor
  - 9-DOF state-of-the-art sensor fusion
  - Up to 6 sensors simultaneously
  - Wireless via Bluetooth 5
  - Low latency under 10ms (no perceivable delay)
  - High Precision (ca. 0.01 degrees)
  - Range up to 50 meters (164 feet)
  - Up to 20 hours battery lifetime
