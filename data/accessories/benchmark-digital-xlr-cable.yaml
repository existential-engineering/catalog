description: Professional-grade 110-ohm AES/EBU digital audio XLR cable
  hand-assembled in the USA using Canare DA206 cable and Neutrik premium
  connectors with gold contacts. The blue jacket provides easy identification,
  and the cable can also carry analog balanced signals when needed.
details: |-
  The Benchmark Studio&Stage XLR Cable is built around Canare DA206 110-ohm cable, purpose-designed for AES/EBU digital audio transmission. It ships in a distinctive blue jacket that makes it easy to identify in a dense cable run, and it is hand-assembled in the USA with silver solder for reliable, long-term connections.

  The cable uses 20 AWG stranded twisted-pair copper conductors shielded by a high-density copper braid with greater than 95% coverage. Its 110-ohm nominal impedance matches the AES/EBU standard, supporting digital signal runs up to 1,180 feet (360 meters).

  Terminated with one XLR-Male and one XLR-Female connector featuring Neutrik gold contacts, this cable is suited for connecting AES/EBU digital devices such as DACs, ADCs, and professional audio interfaces. It can also serve as a high-quality analog balanced cable when needed.
specs: |-
  - Connectors: XLR-Male to XLR-Female, Neutrik with gold contacts
  - Cable: Canare DA206, 110 ohm nominal impedance
  - Conductors: 20 AWG stranded twisted-pair copper
  - Shielding: >95% copper high-density braid
  - Shield DC resistance: <4.3 Ohms/1000 ft
  - Conductor DC resistance: <10.1 Ohms/1000 ft
  - Nominal capacitance: 14.6 pF/ft
  - Maximum AES/EBU run length: 1,180 ft (360 meters)
  - Jacket color: blue
  - Solder: silver
  - Assembly: hand-assembled in the USA
  - Length options: 3 ft, 6 ft
