url: https://www.darkglass.com/products/a-o-intelligent-footswitch
description: A dedicated control accessory for the Darkglass Alpha·Omega 500 and
  Alpha·Omega 900 bass amplifiers, enabling hands-free control of the amp's
  distortion engine and mute function during performance.
details: |-
  The Alpha·Omega Intelligent Footswitch is a dedicated control accessory designed specifically for Darkglass's Alpha·Omega bass amplifiers. It enables hands-free control of critical amplifier functions during performance through a simple tap-and-hold interface, communicating with the amplifier head over a proprietary protocol via a microcontroller for reliable command transmission.

  The device features a compact, pedalboard-friendly design with straightforward functionality. A single tap engages or disengages the aO distortion engine, while holding the switch activates the mute function, ideal for tuning between songs or managing feedback. A power indicator confirms footswitch connectivity. It connects to the amplifier's dedicated footswitch port using a standard quarter-inch cable, making setup and integration seamless.

  This accessory is designed to pair with the Alpha·Omega 500 and Alpha·Omega 900 amplifiers and is not compatible with other amplifier models.
specs: |-
  - Power indicator confirming footswitch connectivity
  - Distortion / aΩ Engine engagement toggle (single tap)
  - Mute function (press and hold)
  - Microcontroller-based communication protocol
  - Standard 1/4-inch cable connection to amplifier's footswitch port
  - Dimensions: 6.8 cm (L) x 7.3 cm (D) x 4.8 cm (H)
  - Weight: 0.180 kg
  - Designed to pair with Alpha-Omega 500 and Alpha-Omega 900 amplifiers
