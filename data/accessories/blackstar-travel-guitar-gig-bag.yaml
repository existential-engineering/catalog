details: |-
  Are you a passionate musician on the go? Whether you're heading to your next gig, travelling the world, or just jamming with friends, our Carry-On Guitar Gig Bag is the ideal choice to protect and transport your beloved Blackstar Carry-on ST guitar/bass guitar or Carry-on Mini guitar/bass guitar. Embrace the freedom to take your music wherever your heart desires.

  Superior Protection: Ensure your prized instruments receive top-notch care with our gig bag's durable padded woven polyester fiber, offering exceptional protection against bumps, scratches, and minor impacts. Your guitar will stay safe and sound wherever you go.

  Perfect Fit and Comfortable Carrying: Designed specifically for Blackstar Carry-on ST guitar/bass guitar and Carry-on mini guitar/bass guitar, our gig bag provides a secure and snug fit. Plus, the robust and ergonomic carry handle ensures easy portability, making your journey hassle-free and comfortable.

  Convenience on the Move: Say goodbye to heavy loads! Our gig bag has backstraps so you can wear it like a backpack and keep your hands free. It's compact and light, measuring 79 x 24 x 6.5cm and weighing only 0.65kg, making it easy to carry around. You can keep your music essentials organized in the zipped pocket and focus on your performance even on the go.
specs: |-
  - Specifically designed to fit Blackstar Carry-on ST guitar
  - Durable padded woven polyester fiber for maximum protection
  - Robust and ergonomic carry handle for comfortable transportation
  - Backstraps for hands-free transportation
  - Convenient zipped music pocket for accessories such as music, cables and picks
  - Compact and lightweight, measuring 79 x 24 x 6.5cm and weighing only 0.65kg (650g)
