description: Portable studio-grade power conditioner and surge protector
details: |-
  Get studio-grade power conditioning that goes wherever you do: onstage, mobile recording sessions, field recording, or film/video shoots. There's no doubt that when it comes to power, musicians have it bad. Whether it's modern modeling amplifiers or vintage synthesizers, bad power is gonna be heard throughout your signal. And it's everywhere — in homes, on stages, and especially in many rehearsal rooms.

  Black Lion Audio has been trusted for years to modify the best gear to make it even better; improving industry-standard designs to the point of peak performance. Those years of experience were all poured into the PG-P Plus. The PG-P Plus might look like a durable surge protector, but in reality it's a studio-class power conditioner — PG-P Plus doesn't just provide more noise filtering than other portable conditioners, it provides the same studio-grade noise filtering found in far more expensive rack-mount power conditioners. Eight wall-wart spaced outlets provide studio-grade power on the go; perfect for any performing musician's rig.

  Studio gear deserves the best power, and Black Lion Audio took great care in making sure the PG-P Plus delivers just that — thanks to its PG-P Filtering Technology. The PG-P Plus is built using premium Panasonic capacitors, due to their superior execution in eliminating high frequency noise that robs equipment of peak performance. In testing, this has provided an average of triple the noise filtering of other portable power conditioners at the same price point.
specs: |-
  - 8 wall-wart spaced outlets
  - PG-P Filtering Technology with premium Panasonic capacitors
  - Triple the noise filtering of comparable portable power conditioners (per testing)
  - Voltage meter for real-time analysis
  - LED status indicators for surge protection, ground, and conditioning
  - Surge protection
