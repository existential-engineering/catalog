details: |-
  Mic Mount for SM7B and EV RE 20 Users

  Info
  ISOVOX Horizontal Mic Mount is compatible with SM7B, RE20 and other Podcast, Broadcast, Shotgun and Handheld style mics or similar mounted microphones inside the ISOVOX Vocal Booth. The Horizontal Mic Mount bracket enables mounting your microphone upright or hanging upside down as well as mounting other products. Enjoy top-notch sound quality with our Horizontal Mic Mount specially designed for Shure SM7B and EV RE 20 mics usage with Isovox. This mount provides unbeatable stability for your mics, ensuring that you capture the best sound sequence without worrying about mic movement, instability, or falling. Our mounting accessory comes with premium-grade material build, offering immense durability. It is perfectly built to withstand continuous usage without wear or tear. It's reliable and durable for all your recording needs and available at an affordable price. Not only does it provide excellent quality, but its horizontal design ensures easy mounting and use of your mics. Compatible with both Shure SM7B and EV RE 20 microphones, the Horizontal Mic Mount is a versatile accessory for all your broadcast, recording, or podcast needs. It fits well and secures your mics, allowing you to focus solely on sound delivery. With its ease of use, you can easily mount your mics whenever needed and remove them when you're done. So why settle for less when you have the best? Mount your SM7B or EV RE 20 mics and enjoy excellent sound quality today with our superior Horizontal Mic Mount. Highlights

  TECHNICAL SPECIFICATIONS
  Type: Accessory for ISOVOX
  Material: Stainless steel
  Coupler: ⅝" - ⅝" Coupler, for connecting the Extension Pole to the ISOVOX pole
  Bracket: Adjustable microphone distance between 0 - 150 [mm] = 0 - 5.9 [Inch]
  Screw Adapter 1: ⅝" - ⅜" Fastening the Bracket
  Nut: ⅜" Fastening the Bracket together with Screw adapter 1
  Screw Adapter 2: ⅜" Fastening and adjusting the Microphone position
  Extension Pole: Enables microphones to be mounted upside down / hanging position
  Extension Pole dimensions: L150 [mm], ⅝" - Thread on top &amp; bottom
  Weight: 206 grams

  WHAT'S INCLUDED
  Bracket, 2x Screw adapter ⅝" to ⅜", Coupler ⅝" , Distance Pole ⅝", Nut ⅜"
