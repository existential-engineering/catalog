details: |-
  Free The Tone's instrument cables are developed and refined around the idea of delivering the sound that makes you want to keep on playing. Significant time goes into their development, with repeated prototyping to reach a sound that feels truly pleasant while electrical performance and durability stay in balance. Over the past five years more than twenty different cable prototypes were tried, exploring new materials and new structural designs.

  The CU-7030 is the cable that embodies that comfortable sound. It carries a protective sleeve with a black base and blue accents, and a distinctive zinc alloy plug cap marked with Free The Tone's signature wave design.

  Covering a shielded cable with a protective sleeve is a long-established technique, but the sleeve material was examined carefully for how it changes sound quality, flexibility and resistance to coiling. The method chosen weaves fiber around the cable's outer layer, which gives the cable a texture and a handling feel of its own.

  The plug cap was developed from scratch, and it is the first Free The Tone cap made by casting. The zinc alloy used in casting offers superior durability and strength, and the cap suppresses harsh high-frequency overtones, so the cable gives a soft yet well-defined sound.

  The cable was tested extensively with a range of guitars, basses and amplifiers to refine its response and overall sound quality. Lowering the guitar's volume or tone control slightly brings out a subtle but pleasing change in sound. It is offered in 3 m and 5 m lengths, each with straight-to-straight or straight-to-L-angle plugs.
specs: |-
  - Conductor size: 0.79 mm
  - Construction: 30/0.12 OFC (no/mm)
  - Insulation thickness: 0.6 mm
  - Inner jacket thickness: 0.2 mm
  - Jacket thickness: 1.7 mm
  - Overall diameter: 7 mm
  - Sheath material: PVC plus polypropylene fiber yarn, woven around the cable's outer layer
  - Cast zinc alloy plug cap with the Free The Tone wave design
  - Lengths and terminations: 3 m S/S, 3 m S/L, 5 m S/S, 5 m S/L
