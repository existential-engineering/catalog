details: |-
  The 7U Case Joiner Plates are a pair of plates that join two Intellijel 7U Performance Cases (Gen-1 and Gen-2 compatible) together in an angled vertical configuration.

  They snap into the quick-release latching slots on the edges of the cases for easy assembly and disassembly, and they pack flat for travel.
