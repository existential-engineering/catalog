description: A 13 by 17 inch two-tier pedal board made in the USA, with a flat
  bottom tier, an angled top tier drilled for cable routing and a detachable
  riser for a wah or volume pedal.
details: |-
  Dave Friedman has been building pedal boards for over 30 years. From the fancy and ultra-complex to the simplest boards, he has seen and designed them all for the who's who of the industry, and when it came time to design his own line everything a touring or home guitar player actually needs was thought out and addressed.

  While most pedal boards have either a flat or a slanted surface, the Tour Pro boards are designed with two tiers, a bottom section that is flat and a top section that is angled, with all the holes needed for easy cable routing. The two-tier design gives a player access to every pedal on the board without toe-extending dance moves, and to address the need for wah and volume pedals the Tour Pro 1317 includes a detachable riser that can be mounted in various locations on the bottom tier, in a left footed or right footed layout.

  The Tour Pro 1317 also has mounting holes for the Friedman Buffer Bay 6, an ultra-transparent buffer with a built-in patch bay, and for the Friedman Power Grid 10, an isolated pedal power supply with ten high current 9V outputs. Both are sold separately.

  Friedman pedal boards are made in the USA, which the maker credits for the quality and manufacturing consistency of the Tour Pro range. For a case or bag, Friedman names the SKB 3i-2015-10BC as a good match for this board.
specs: |-
  - Two-tier design, flat bottom section and angled top section
  - Pre-drilled cable routing options, left or right footed layout
  - Includes a detachable riser that mounts in various locations on the bottom tier
  - Mounting holes for the Buffer Bay 6 and Power Grid 10, both sold separately
  - Made in the USA
  - Board size: 13 in x 17 in
  - Dimensions: 17 in (W) x 13 in (D) x 4.5 in (H)
  - Weight: 4 lbs
