description: Add a sequencer to your Bullfrog
details: |-
  The ANALOGUE SEQUENCER voicecard gives the Bullfrog a compact CV/GATE five step sequencer. It generates up to five steps of discrete control voltages that set the pitch of the VCO and gates that trigger the envelope generators. Audio and CV connections are the same as on the Acid Bassline voicecard.

  The STEPS switch determines the length of the sequence and the CLOCK switch selects between an internal clock, defined by the RATE knob on the Sample and Hold section, and an external gate from the MANUAL GATE button, MIDI or an external analogue gate. Faders set the note value of each step, while the pushbuttons above them turn individual steps off so that no gate is produced on those steps.

  Erica Synths suggests setting both envelope generators to FREE mode with VCA OFFSET fully counter clockwise, putting the sequencer in LFO mode, setting the tempo with the RATE knob and designing a sequence with the faders, then shaping the result with the VCF and envelope settings.

  Several Bullfrogs can be chained so that their sequencers run at the same rate. Patching the PULSE OUT of the master Bullfrog into the GATE input on the rear panel of the second one and setting the second sequencer to GATE mode locks the two together.
specs: |-
  - 5 step CV/GATE sequencer
  - Mutable steps
  - Fader control for note value
  - STEPS switch for sequence length
  - Internal or external clock source
  - LFO mode
