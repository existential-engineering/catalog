description: The Oneiroi Pod is a compact 42HP desktop Eurorack enclosure
  developed with 4ms, purpose-built to house the Befaco Oneiroi synth voice
  module for use alongside desktop synthesizers and other gear. Its built-in
  power supply provides 1.4A at +12V across four Eurorack power headers, and the
  two daisy-chainable barrel jack inputs support linking multiple 4ms Pod
  enclosures.
details: |-
  The Oneiroi Pod is a 42HP portable Eurorack enclosure created by Befaco in collaboration with 4ms. It was designed specifically as the ideal desktop companion for the Befaco Oneiroi — an experimental full-stereo synthesizer voice focused on ambient pads and drone-like soundscapes. The pod allows musicians to integrate the Oneiroi into desktop setups alongside synthesizers, effects pedals, and other modular or semi-modular instruments without requiring a full Eurorack rack.

  The enclosure is built from 100% lightweight black anodized aluminum with standard M3 threaded holes for module mounting. It accommodates modules up to 40mm in depth, comfortably fitting the Oneiroi (25mm assembled). Four standard Eurorack power headers are built in, providing headroom for the Oneiroi and additional utility or effect modules.

  Power is delivered via two 2.1mm barrel jack inputs (15V–20VDC, positive tip), supporting daisy-chaining with other 4ms Pod enclosures for expanded setups. The power supply offers 1.4A at +12V, 0.67A at -12V, and 1A at +5V — sufficient for the Oneiroi plus several companion modules. A power brick and adhesive rubber feet are included in the box, along with blank panels to fill any unused HP.

  The Oneiroi Pod is available individually or in bundles combined with the Oneiroi module and related Befaco modules, providing a ready-to-play ambient and drone synthesizer voice in a portable desktop form factor.
