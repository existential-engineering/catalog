details: |-
  Professional-grade Replacement Tour Case for Pedaltrain Classic 2, Pedaltrain Novo 24, Pedaltrain PT-FLY, and Pedaltrain PT-2, engineered to be up to 35% lighter than previous models. This case accommodates several board sizes (Classic 2, Novo 24, PT-FLY, PT-2). Smaller Pedaltrain sizes in this group (Classic 2, PT-FLY, PT-2) will have extra room for storage of cables, accessories, etc. In either case, your Pedaltrain will be secure and protected. Case is designed to accommodate unmodified Pedaltrain pedal boards. Modifications like large raised feet, large handles, protruding in/out panels, and various custom accessories may not fit in the case. If you have modified your Pedaltrain, or have questions about sizing, please email us before purchase. We’d be happy to advise you. *CASE ONLY - pedal board and accessories not included Features & Specs Compatibility Specifications Model: PT-24-BTC-X
specs: |-
  - 6mm plywood and laminate construction
  - ATA approved ball corners
  - Fully recessed carry handles
  - Lockable latches
  - Tongue-in-groove aluminum extrusion edging
  - Tough rubber feet
  - Fully lined with dense rubberized foam
  - Lid lined with 2 1/2" impact absorbing egg-crate-style foam
  - Hinged lid with built in lid stop
  - Classic 2
  - Novo 24
  - PT-FLY
  - PT-2
  - Exterior Dimensions: 26.25 in x 17 in x 9 in (66.7 cm x 43.1 cm x 13.9 cm)
  - Interior Dimensions: 15 in x 25 in x 6.5 in (38.1 cm x 63.5 cm x 16.5 cm)
  - Weight: 17.1 lbs (7.76 kg)
