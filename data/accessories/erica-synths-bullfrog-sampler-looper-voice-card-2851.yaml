description: Enable the sampler/looper functionality on Bullfrog
details: |-
  The SAMPLER/LOOPER voicecard brings techniques used in the early days of electroacoustic and experimental music into the functionality of the Bullfrog.

  The voice card essentially emulates a tape recorder. It records up to 10 seconds of audio from a built-in microphone or from the Bullfrog itself and then feeds the recording back into the audio path of the Bullfrog, so it can be processed through the VCF, the VCA and the delay.

  Two playback modes are available, LOOP and GATED, and playback speed is configurable. A built-in ring modulator sits alongside them for further treatment of the recorded material.
specs: |-
  - Easy looping
  - Built-in microphone (MIC)
  - 2 playback modes, LOOP and GATED
  - Built-in ringmodulator
  - Configurable speed and playback modes
  - Records up to 10 seconds of audio
