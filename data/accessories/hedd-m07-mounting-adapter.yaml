description: A HEDD steel mounting adapter that connects TYPE 07 monitors (MK1,
  MK2, and A-CORE) to IsoAcoustics V120 L- or C-brackets for ceiling and wall
  installation.
details: |-
  The M07 is an installation solution bridging HEDD's TYPE 07 monitor line (MK1, MK2, A-CORE) with industry-standard IsoAcoustics isolation mounts. It facilitates flexible positioning in immersive audio environments, particularly for front and surround channels in smaller rooms or ceiling deployment in larger Atmos installations.

  The mounting system prioritizes acoustic isolation, leveraging IsoAcoustics' design tested at Canada's National Research Council. By reducing vibration transfer through supporting structures, it minimizes internal reflections that degrade stereo imaging.

  Installation is straightforward and non-destructive, so the adapter can be added or removed without speaker damage. The steel construction provides stability while tilt and rotation accommodate varied room geometries.
specs: |-
  - Compatibility: all TYPE 07 models (MK1, MK2, A-CORE); IsoAcoustics V120 mounts with L- or C-brackets
  - Material: steel mounting plate
  - Dimensions: 90 mm x 123.6 mm x 23 mm
  - Weight: 0.24 kg
  - Warranty: 2 years (IsoAcoustics)
