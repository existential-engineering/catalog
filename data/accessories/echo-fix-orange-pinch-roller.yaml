details: |-
  Improved ORANGE Pinch Roller with low friction bearings for Roland Space Echo (Suits RE-101, 150, 201, 301, 501 & SRE-555). Over time the rubber on the Space Echo pinch rollers disintegrate, turn hard or become sticky like tar which causes major problems for your echo unit and needs to be replaced. As the original Space Echo pinch rollers are no longer available we have had these pinch rollers manufactured to the exact specifications of the original. Install a new pinch roller and your Space Echo will love you for it. Make sure that you are familiar with your country's customs, taxes and importing laws.
