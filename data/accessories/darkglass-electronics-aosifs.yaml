name: Alpha·Omega Super Intelligent Footswitch
manufacturer: darkglass-electronics
primaryCategory: other
url: https://www.darkglass.com/products/aosifs
description: A dedicated foot controller for the Alpha·Omega 900 amplifier,
  giving stomp-away access to the Clean, Alpha, Omega, and Mod channels plus
  compressor and mute, with three programmable channel switches and a mute
  switch.
details: |-
  The Alpha·Omega Super Intelligent Footswitch is a dedicated controller designed as the perfect match for the Alpha·Omega 900 amplifier. It gives musicians foot-operated access to the amplifier's extensive tonal options, so the Clean, Alpha, Omega, and Mod channels, along with compressor and mute, are a stomp away with no need to reach the amp during performance.

  The footswitch includes three programmable channel switches that can be assigned to different operating modes plus a dedicated mute footswitch for tuning. Default assignments are Switch A for Clean with compression off, Switch B for Clean with compression on, and Switch C for the distortion (Mod) channel with compression on. Settings are programmed through the Darkglass Suite software and stored directly on the Alpha·Omega 900 amplifier.

  The device measures 22 cm x 4.5 cm x 4.8 cm and weighs approximately 0.45 kg. While it connects to Darkglass amplifiers, it can only be programmed on the Alpha·Omega 900 and cannot be programmed when connected to Microtubes models.
specs: |-
  - Three programmable channel switches (Clean, Alpha, Omega, Mod channels; compressor on/off)
  - Dedicated mute footswitch for tuning
  - Default: A = Clean/comp off, B = Clean/comp on, C = Mod/comp on
  - Programmed via Darkglass Suite; settings stored on the amplifier
  - Designed for the Alpha·Omega 900 amplifier
  - Dimensions: 22 cm x 4.5 cm x 4.8 cm; weight ~0.45 kg
