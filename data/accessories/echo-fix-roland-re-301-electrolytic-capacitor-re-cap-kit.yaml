details: |-
  Roland RE-301 Electrolytic Capacitor re-cap kit. The Roland RE-301 is now at an age where the electrolytic capacitors are failing and need to be replaced. This kit has all the electrolytic capacitors needed for a re-cap job. Note: There will be some capacitor values left over as we supply the capacitors to suit all the PCB changes that happened during production of these units. Also it is recommended to have this done via a qualified tech (No instructions included with this sale). Make sure that you are familiar with your country's customs, taxes and importing laws.
