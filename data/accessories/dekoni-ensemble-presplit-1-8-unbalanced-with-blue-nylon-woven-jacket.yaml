details: |-
  Gain greater flexibility in your listening setup with the Dekoni Ensemble Presplit 1/8" Audio Cable. As a crucial component of the Modular Cable System (MCS), this presplit cable extends the connection from your audio source to your Ensemble post-split headphone cable, delivering professional-grade performance. Premium Construction

  Built with durable blue nylon woven jacket protection and silver tinsel wire conductors, this cable ensures consistent signal transmission and long-lasting reliability. The gold-plated 3.5mm connectors minimize oxidation and maximize conductivity for superior audio clarity. Modular Flexibility

  Part of Dekoni's innovative Modular Cable System, this presplit cable integrates seamlessly with other Ensemble components, allowing you to customize your cable setup for any listening environment.
