description: A 2 metre DCB cable from a 15 pin D plug to a 20 pin flat
  connector, for linking the DCB port of a Pro-4 to a Roland Jupiter 8 fitted
  with the 20 pin flat (OP8) connector.
details: |-
  A DCB cable wired from a 15 pin D plug to a 20 pin flat connector, 2 metres long.

  It connects the DCB port of a PRO-4 converter to a Roland Jupiter 8 that carries the 20 pin flat (OP8) connector. Some Jupiter 8 units instead have a 14 pin IEEE connector, which needs the 14 pin version of the cable.

  The cable is for the PRO-4 only.
specs: |-
  - 15 pin D plug to 20 pin flat (OP8) DCB connector
  - Length: 2 metres
  - For the PRO-4 DCB port only
  - Target instrument: Roland Jupiter 8 with the 20 pin flat (OP8) connector
