specs: |-
  - One One Control Solid Board PBS4014 (400 mm x 140 mm)
  - One HOOK & LOOP HOOK (Velcro, male) – 1 meter
  - One HOOK & LOOP LOOP white logo (Velcro, female) – 1 meter
  - Four rubber feet (pre-installed, removable with screws)
  - Dimensions (W x D x H): 400 mm x 140 mm x 42 mm (46 mm including feet)
  - Weight: Approximately 580 grams
  - Material: 3 mm thick aluminum alloy
  - Pedal Capacity: 3 to 6 compact pedals
  - Cable Management: Integrated passthrough holes
  - Bottom Height: 3.9 cm (fits under-mounted power supplies)
  - Layout your pedals: Test-fit up to six compacts. Think about signal flow and foot access.
  - Mark and stick: Cut and apply Velcro to the board and pedals.
  - Run cables: Use the passthroughs to route patch and power cables below deck.
  - Mount power supply: Attach your Distro MkII or equivalent underneath.
  - Rock out: Plug in, power up, and let the tone fly.
