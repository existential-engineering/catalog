  Compact. Rugged. Road-Ready. Welcome to Your Tone Foundation! Congrats on getting your hands (and feet) on the One Control Solid Board PBS4014, our no-nonsense, pro-grade pedalboard that's engineered for maximum durability, clean cable routing, and tight setups. Whether you're a studio perfectionist, a barroom bruiser, or a touring minimalista, this board is ready to anchor your tone empire. What's in the Box:

  Key Specs:

  Built Like a Tank, Light as a Feather

  Constructed from 3 mm thick aluminum alloy, the PBS4014 is lightweight without sacrificing strength. Toss it in a gig bag, road case, or the backseat because this thing was built to be abused. Smart Cable Management

  No more pedal Tetris. The built-in patch and power cable passthroughs let you run cables beneath the board, opening up valuable real estate up top. That means more stomp, less clutter. Pro tip : drill or trim your patch or power cables to custom-fit them through the passthroughs but only if you know what you're doing. Power Supply? No Problem. With a back-end lift of 3.9 cm, there's plenty of room to mount compact power supplies like the One Control Distro MkII underneath. That keeps your juice hidden and your board sleek. Feet That Stick! Grippy rubber feet keep your rig from sliding on stage — whether you're in a sweaty punk dive or a cathedral hall. Need to lower your profile? The feet are screwed in and can be easily removed or swapped. Velcro That Means Business

  This isn't bargain-bin hook and loop. We include our premium HOOK AND LOOP HOOK (male) and LOOP white logo (female) to keep your pedals firmly in place — even after years of stomping. Getting Started:

  Final Thoughts:

  The One Control PBS4014 pedalboard is designed to simplify your rig without compromising performance. It's compact, road-ready, and laser-focused on efficient design. Whether you're chasing boutique sounds or just need a lean-and-mean fly rig, the Solid Board PBS4014 is your trusted companion. ・ Solid Board PBS4014 Manual.pdf

