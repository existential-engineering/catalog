description: Articulating side mount bracket for the Aston Stealth broadcast
  microphone, with an integrated cable-tidy clip and a matt black finish. Sold
  on its own or as part of the Stealth Broadcast Pack.
details: |-
  The Stealth Side Mount is an articulating bracket built specifically for the Aston Stealth broadcast microphone. It holds the microphone steady at a chosen angle for podcasting, voiceover, streaming or on-camera work, and adjusts smoothly when the talent shifts position.

  A built-in cable-tidy clip keeps the XLR run tucked away, and the matt black finish matches the Stealth itself. It is sold standalone or as part of the Stealth Broadcast Pack.
specs: |-
  - Articulating side mount designed for the Aston Stealth microphone
  - Secure articulation for precise and stable microphone positioning
  - Integrated cable-tidy clip
  - Matt black finish matching the Stealth microphone
  - Available standalone or as part of the Stealth Broadcast Pack
