  Pedaltrain Deluxe MX Soft Case for Classic Jr & PT-JR The Pedaltrain Classic Jr is just like you, adorable and popular. No reason to be bashful about it. This case is a perfect upgrade for the new version, or the original PT-JR. It has a nice, roomy, zippered pocket and extra depth in the main compartment for taller pedals. Durable construction, quality components, padded strap, and a great price. Features: Main Compartment Interior Dimensions: 18" x 13" x 6" (46 x 33 x 15 cm) Accessory Pouch Outer Dimensions: 15" x 10" x 1.5" (38 x 25 x 4 cm) Model: PT-CLJ-MX-X
