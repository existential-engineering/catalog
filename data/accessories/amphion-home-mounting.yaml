description: Adjustable wall brackets that allow Amphion home audio speakers to
  be mounted securely to walls without requiring additional floor space.
  Available in black and white, compatible with Argon1, Argon0, and Helium510
  speaker models.
details: |-
  Adjustable wall brackets for Amphion home audio speakers, compatible with Argon1, Argon0,
  and Helium510 models. The brackets integrate with threaded inserts on the backs of the
  speakers for easy and secure attachment. Available in Black and White finishes to match
  speaker color options.
