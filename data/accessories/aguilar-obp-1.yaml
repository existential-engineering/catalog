description: The OBP-1 SK is a two-band boost-only bass and treble preamp, that has high headroom, low distortion and the ability to reproduce the full dynamic range of your instrument. The OBP-1 gives you the tone shaping benefits of active electronics without losing the inherent sound of your instrument.
details: |-
  The OBP-1 SK is a two-band boost-only bass and treble preamp, that has high headroom, low distortion and the ability to reproduce the full dynamic range of your instrument. The OBP-1 gives you the tone shaping benefits of active electronics without losing the inherent sound of your instrument. OBP-1 SK kit includes stacked Treble/Bass pot. The OBP-1's discrete, all-FET circuitry features up to 18dB of boost at 40Hz and 4kHz, creating a sonic environment high in dynamic headroom and low in noise.

  The OBP-1 TK is a two-band boost-only bass and treble preamp, that has high headroom, low distortion and the ability to reproduce the full dynamic range of your instrument. The OBP-1 gives you the tone shaping benefits of active electronics without losing the inherent sound of your instrument. OBP-1 TK kit includes separate Treble and Bass pots. The OBP-1's discrete, all-FET circuitry features up to 18dB of boost at 40Hz and 4kHz, creating a sonic environment high in dynamic headroom and low in noise.
