description: Adapter cable connecting balanced analog XLR outputs to unbalanced
  RCA inputs, with pin 3 floating. Hand-assembled in the USA using Canare L-2T2S
  cable and Neutrik XX series gold-contact connectors. For analog audio only.
details: |-
  The Benchmark XLRF to RCA Adapter Cable connects transformerless balanced analog outputs to unbalanced analog inputs for studio, stage, and hi-fi applications. It is hand-assembled in the USA using Canare L-2T2S 2-conductor shielded cable and Neutrik XX series gold-contact connectors joined with true silver solder.

  The cable is wired pin-3-floating: XLR pin 3 is left unconnected, the RCA center tip connects to XLR pin 2 (hot), and the RCA shield connects to XLR pin 1 (ground). This configuration is intended for use with transformerless balanced outputs and is NOT suitable for digital signals.

  Available in 3-foot and 6-foot lengths.
specs: |-
  - Connectors: XLR-Female (input), RCA-Male (output), Neutrik XX series gold-contact
  - Wiring: XLR pin 1 to RCA shield; XLR pin 2 to RCA tip; XLR pin 3 floating
  - Cable: Canare L-2T2S 2-conductor shielded
  - Conductors: 23 AWG, 60-strand copper
  - Insulation: Cross-linked PE
  - Shielding: >94% TAC braided copper
  - Conductor DC resistance: <19.8 Ohms/1000 ft
  - Shield DC resistance: <9.4 Ohms/1000 ft
  - Capacitance between conductors: 21 pF/ft
  - Nominal impedance: 88 Ohms
  - Solder: True silver solder
  - Assembly: Hand assembled in USA
  - Lengths available: 3 ft, 6 ft
  - For analog audio only — do not use with digital signals
