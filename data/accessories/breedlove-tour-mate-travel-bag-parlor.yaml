  Designed specifically for smaller guitars, including Parlor and travel-size models, the Breedlove Tour Mate Travel Case sets a new standard for function and protection. A fully padded compartment with adjustable support keeps your instrument secure, while multiple storage pockets—including space for a laptop, clothing, and travel essentials—make it easy to carry everything in one streamlined pack. Complete with a stowable ergonomic harness and integrated rain cover, it's built for musicians on the move.
