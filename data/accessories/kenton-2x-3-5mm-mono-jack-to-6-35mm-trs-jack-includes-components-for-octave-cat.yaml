description: For later Octave CAT synths (SRM model) which have the FROM MASTER
  socket. Components are built into the jack socket during manufacture so the
  lead connects correctly to the CAT (SRM model) from any Kenton MIDI to CV
  converter.
details: |-
  A lead with two 3.5mm mono jacks at one end and a 6.35mm TRS jack at the other, made for the later Octave CAT SRM, the revision fitted with a FROM MASTER socket.

  The interfacing components are built into the 6.35mm jack plug during manufacture, so the control voltage and gate from any Kenton MIDI to CV converter arrive at the CAT's FROM MASTER input at the levels that instrument expects.

  An original CAT, which has no FROM MASTER socket, cannot use this lead and takes a socket upgrade kit instead.
specs: |-
  - Connector A: 2 x 3.5mm mono jack
  - Connector B: 1 x 6.35mm TRS jack with interfacing components built in
  - For the Octave CAT SRM with a FROM MASTER socket
  - Not suitable for the original CAT without a FROM MASTER socket
