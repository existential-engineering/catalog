description: Professional 2U rackmount power conditioner for Australian/Chinese
  (Type I) 230V connections
details: |-
  A professional 2U rackmount power conditioner delivering clean, filtered power to audio equipment with protection against surges and unsafe voltage conditions. Features 12 switched, filtered, and surge-protected rear outlets organized into 4 groups (Digital Audio x2, Analog Audio, High Current), plus 2 filtered front convenience outlets, a front USB charger, XLR lamp connectors (front and back), and time-delayed High Current outlets to prevent power-on pop. Equipped with PG-99 Filtering Technology providing 99.7% noise filtering using premium Panasonic and Wima capacitors, 2775 joules power absorption rating, voltage and amperage meters, LED status indicators (grounding, polarity, noise filtering, abnormal voltage, surge protection), and an audio alarm for unsafe voltage conditions.
specs: |-
  - Form Factor: 2U Rackmount
  - Power Input: Fixed Type I cable, 230V AC, 15A max
  - Rear Outlets: 12 × Type I (switched, filtered)
  - Front Outlets: 2 × Type I (unswitched convenience)
  - Outlet Groups: Digital Audio x2, Analog Audio, High Current
  - Sequencer: Yes (time-delayed High Current outlets)
  - Surge Protection: 2775 joules
  - Noise Filtering: 99.7%
  - Display: LED voltmeter and status indicators
  - Width: 438mm
  - Height: 88mm (2U)
  - Depth: 250mm
