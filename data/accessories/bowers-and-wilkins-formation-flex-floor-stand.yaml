details: |-
  Formation Flex Floor Stand is the dedicated floor stand for the Formation Flex wireless speaker, made for Bowers & Wilkins by Vogel's.

  It holds Formation Flex at the height intended for seated listening, which suits both a stereo pair and a pair used as rear channels in a surround-sound system.

  The page notes that the stand is sold singly, so a stereo pair or a pair of surround channels needs two, and it points to Vogel's own site for further information.

  This is a stand only. It carries no audio signal connection of its own, and Formation Flex is sold separately.
