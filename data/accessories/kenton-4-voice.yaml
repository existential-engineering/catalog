description: A socket kit that gives the Oberheim 4 Voice separate CV, gate and
  filter inputs for each of its four voices, twelve 3.5mm sockets in total, so
  every voice can be driven from a MIDI to CV converter.
details: |-
  A socket kit for the Oberheim 4 Voice, providing separate control inputs for each of the instrument's four voices.

  Each voice gains three inputs: CV at Volt per Octave, a gate where +12V is on and 0V is off, and filter cutoff frequency control over a 0V to +10V range. That makes twelve 3.5mm mono jack sockets in total, three per voice.

  The kit contains all the components and diagrams needed to connect the wiring and to mount the sockets. Further capability detail is covered by the specifications of the Pro-2000 mkII, the converter that can address all four voices.

  Fitting is a skilled job, intended for a competent synthesiser service engineer. Installation at the manufacturer's premises in Tadworth, near London, is also offered.
specs: |-
  - 12 sockets in total, three per voice, on 3.5mm mono jacks
  - CV: Volt per Octave
  - Gate: +12V on, 0V off
  - Filter cutoff control range: 0V to +10V
  - Supplied with all components and wiring diagrams
  - Powered from the host synthesiser, no power input of its own
  - Fits the Oberheim 4 Voice
  - Pairs with the Pro-2000 mkII converter
