name: HEDDphone TWO Audio Adapter
manufacturer: hedd
primaryCategory: cable
url: https://hedd.audio/products/heddphone-two-audio-adapters
description: Official short adapter cables for the HEDDphone TWO, available in
  single-ended (6.35 mm) and balanced (4.4 mm to XLR) configurations.
details: |-
  Official audio adapter cables for the HEDDphone TWO, providing connectivity to various audio equipment. Each adapter is 20 cm long and features a Kevlar-infused braided cable construction for durability and signal integrity, and is compatible with the HEDDphone TWO GT.

  The single-ended variant is an unbalanced adapter from a 6.35 mm connector to a 3-pin audio connector. The balanced variant is a 4-pin balanced adapter from a 4.4 mm connector to an XLR connector. Backed by a 5-year warranty.
specs: |-
  - Single-ended variant: 6.35 mm to 3-pin, unbalanced
  - Balanced variant: 4.4 mm to XLR, balanced (4-pin)
  - Length: 20 cm
  - Construction: Kevlar-infused braided cable
  - Compatibility: HEDDphone TWO GT
  - Warranty: 5 years
