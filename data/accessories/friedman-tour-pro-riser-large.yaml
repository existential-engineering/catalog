description: A 4 by 7 inch metal riser that mounts on the flat bottom tier of a
  Friedman Tour Pro pedal board. It ships with mounting screws and fits the Tour
  Pro 1520, 1524, 1529 and 1542 only.
details: |-
  While most pedal boards have either a flat or a slanted surface, the Tour Pro boards are designed with two tiers, a bottom section that is flat and a top section that is angled, with all the holes needed for easy cable routing. This two-tier design gives a guitar player access to all pedals on the board without toe-extending dance moves.

  The large Tour Pro riser is the metal platform that raises a pedal off the flat bottom tier, so a wah or volume pedal sits at a comfortable angle. It can be mounted in various locations on the bottom tier and ships with its mounting screws.
specs: |-
  - Riser dimensions: 4 in x 7 in
