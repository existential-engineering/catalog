details: |-
  Dave Friedman has been building pedal boards for over 30 years. From the fancy and ultra-complex to the simplistic, he has seen and designed them all for the who's who of the industry. When it came time for Dave to design his own line of pedal boards, everything a touring or home guitar player actually needs was meticulously thought out and addressed.

  Friedman pedal boards are made in the USA, and the quality and manufacturing consistency of the Tour Pro boards is what makes a Friedman a Friedman.

  While most pedal boards have either a flat or a slanted surface, the Tour Pro boards are designed with two tiers, a bottom section that is flat and a top section that is angled, with all the holes needed for easy cable routing. This two-tier design gives a guitar player access to all pedals on the board without toe-extending dance moves. To address the need for wah and volume pedals, the Tour Pro 1529 includes a detachable riser, which can be mounted in various locations on the bottom tier, left footed or right footed.

  The Tour Pro 1529 has mounting holes for the Friedman Buffer Bay 6, an ultra-transparent buffer with built-in patch bay, and the Friedman Power Grid 10, an isolated pedal power supply with 10 high current 9V outputs. Both are sold separately.

  For a case or bag, Friedman suggests the SKB 3i-3016-10BC or the Mono M80 2.0 as a match for the Tour Pro 1529.
