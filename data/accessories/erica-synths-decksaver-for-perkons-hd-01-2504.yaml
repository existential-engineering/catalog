details: |-
  Erica Synths decksavers are engineered to fit Pērkons HD-01, SYNTRX and SYNTRX II exactly. The smoky clear cover protects the instrument from impact, dust and liquid.

  It shields the most vulnerable knobs, faders and switches from bending and breaking while keeping settings and knob positions in place for the next time the instrument is played.

  The low profile design keeps the covered instrument compatible with most flight cases and travel bags, so the decksaver can be combined with an Erica Synths travel bag for maximum protection while travelling.
