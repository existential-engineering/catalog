details: |-
  Replacement low-latency 2.4GHz USB-A wireless dongle for the original Audeze Maxwell wireless gaming headset. Only one dongle can be active at any one time.

  Pairing multiple dongles to one headset is not possible. Not compatible with Maxwell 2. When pairing, please ensure both the dongle and headset are on the latest firmware version.

  For pairing instructions, see our support article. Please do not pair Xbox dongles to a PlayStation version Maxwell or vice versa! This can cause irreparable firmware incompatibilities to your headphones and is not covered by warranty.
