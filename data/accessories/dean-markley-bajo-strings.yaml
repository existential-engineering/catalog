details: |-
  The Bajo carries an important role in the musical realm it thrives in. It's needed to "push" and "move" the song along. Without power and punch, the songs just don't drive. In order to create a Bajo string that would carry the Bajo along, we incorporated our finest 80/20 "true brass" outer wrap alloy with our finest Swedish Steel, Hex-tinned, Mandolin wire. We also incorporate our proprietary "pitch wind" while winding the outer wrap onto the special core wires. This means the cores are brought to their concert pitch in the winding process. Then the outer wrap is meticulously applied. This ensures the strings will ring - loud and true - in your performanc
