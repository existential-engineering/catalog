description: iPad cable for the DDJ-WeGO3
details: |-
  Use the WeCAi30 cable to connect a DDJ-WeGO3 to your iTunes library on a mobile device running Algorridim's djay 2 app. Or get to grips with video mixing using Algorridim's vjay app.

  USB power supply 
  The WeCAi30 includes a USB connection for supplying power to the WeGO3 via a standard USB power adaptor or a USB mobile battery, so you can play out even where traditional power sources cannot reach.
