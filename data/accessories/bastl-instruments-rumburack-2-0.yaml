description: Rumburack 2.0 is a discontinued compact portable Eurorack full system by Bastl Instruments designed for live performance. It ships as a complete 11-module bundle (Tea Kick, Noise Square, Skis ×2, Cinnamon ×2, grandPa, Knit Rider + Exp, Popcorn, Tromsø, Quattro Figaro, ABC, Ciao!) in a carry case with an integrated Meanwell power supply supporting 100–240V AC. Fully Eurorack-compatible and hand-built in Brno, Czech Republic.
