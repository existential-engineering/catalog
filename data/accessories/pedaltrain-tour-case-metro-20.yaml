details: |-
  Professional-grade Replacement Tour Case for Pedaltrain Metro 20, Pedaltrain Mini, and Nano+ (roomy fit on Nano+), engineered to be up to 35% lighter than previous models.

  This case accommodates both the Metro 20 and PT-Mini. PT-Mini will have extra room for storage of cables, accessories, etc. In either case, your Pedaltrain will be secure and protected.

  Case is designed to accommodate unmodified Pedaltrain pedal boards. Modifications like large raised feet, large handles, protruding in/out panels, and various custom accessories may not fit in the case. If you have modified your Pedaltrain, or have questions about sizing, please email us before purchase. We’d be happy to advise you.

  *CASE ONLY - pedal board and accessories not included

  Features & Specs

  Compatibility

  Model: PT-M20-BTC-X
specs: |-
  - Exterior Dimensions: 22.5 in x 11 in x 7 in (57.1 cm x 27.9 cm x 17.7 cm)
  - Interior Dimensions: 8.5 in x 21 in x 5.5 in (21.5 cm x 53.3 cm x 14 cm)
  - Weight: 9.9 lbs (4.5 kg)
  - Features
  - 6mm plywood and laminate construction
  - ATA approved ball corners
  - Fully recessed carry handles
  - Lockable latches
  - Tongue-in-groove aluminum extrusion edging
  - Tough rubber feet
  - Fully lined with dense rubberized foam
  - Lid lined with 2 1/2" impact absorbing egg-crate-style foam
