details: |-
  A splitter lead for DIN Sync, wired as one plug to two plugs. It allows two DIN Sync devices to be driven by the Sync-24 output of Kenton equipment.

  Each of the two legs is 2 metres long. The lead carries the sync signal only and performs no conversion of its own, so a MIDI to DIN Sync converter is still needed where MIDI is the clock source.
specs: |-
  - 1 plug to 2 plugs
  - Each lead is 2 metres long
  - Drives two DIN Sync devices from one Sync-24 output
