details: |-
  Four conductor mini adaptor cable with a 1/8 inch (3.5mm) plug then 8 inches (20cm) of cable connected to a 1/4 inch (6.3mm) jack. The 8 inches (20cm) of cable eliminates added leverage on the output circuit board of the source.

  Constructed of the same super annealed copper wire as the X-Series headphone cables, with braided sheathing. Grado guarantees no degradation of sonic quality with Grado headphones while using their mini adaptor cable.
specs: |-
  - 4 conductor
