description: A performance-focused IEM cable with silver-plated copper
  conductors, extended 62-inch length, longer over-molded MMCX connectors with
  memory wire, and 3.5mm stereo termination.
details: |-
  This performance-focused cable utilizes the same conductor materials as our standard Smoky Litz cable; silver-plated copper. The distinguishing features are an additional 18" of cable length, for a total of 62", as well as longer over-molded MMCX connectors with built-in memory wire. This cable is available with either distinctively colored Red and Blue or semi-transparent smoky grey MMCX over-molds. 3.5mm Standard Stereo termination.
