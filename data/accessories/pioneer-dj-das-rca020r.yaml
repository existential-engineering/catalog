details: |-
  The DAS range is designed with the rigours of professional use in mind. A highly pliable cable construction reduces stress on the connections and adds flexibility, while the cable net protects against damage to the outer insulator. All plugs are nickel plated for high rigidity and damage-resistance.

  The cable's construction eliminates interference and enables the fast low-frequency response needed by dance music DJs and producers.
