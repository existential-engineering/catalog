details: |-
  The Sieveking Sound Omega Headphone Stand debuted at the 2009 Munich High End Show. Crafted from a single piece of wood using steam-molding techniques, then finished with clear matte lacquer. The design accommodates larger headphones and features a smaller opening angle than a human head, reducing tension on the headphones compared to wearing them.

  The stand's unique design has been granted a design trademark by the European Union. It is manufactured in Germany and built for durability. The soft lacquer finish resists the need for constant cleaning, maintaining appearance over time. A pouch of ultra-soft undyed flannel is included for protection during transport or storage.

  As a natural wood product, color and grain variations will occur.
