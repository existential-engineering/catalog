details: |-
  Harmony Electric Guitar Strings are designed for long-lasting tone and pristine feel. Made in the USA, the strings are precision wound with nickel-plated steel onto a steel core. Considered the industry standard for electric guitarists, its distinct bright and balanced tone make it a highly versatile choice for playing a variety of styles and genres. The strings come with an anti-corrosion inner bag for longevity and are available in five different gauges for all types of players, starting from standard gauges to hybrid gauges for alternate/drop tuning. The 11-52 gauge is a unique hybrid set for players looking for a fuller tone and even punchier bottom end and is ideal for alternate/drop-tuning.
