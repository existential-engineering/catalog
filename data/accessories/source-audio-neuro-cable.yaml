description: Use the Neuro Cable to connect your Neuro Mobile App to any Source
  Audio One Series pedal. The Neuro Cable is 3 ft. long.
details: |-
  The Neuro Cable connects the Neuro Mobile App to any Source Audio One Series pedal. One Series pedals include the Ventris Dual Reverb, Nemesis Delay, Vertigo Tremolo, Aftershock Bass Distortion, L.A. Lady Overdrive, Gemini Chorus, and Lunar Phaser, among others.

  The 3-foot cable runs from the headphone jack on a mobile device to Input 2 on a One Series pedal, enabling smartphone users to remotely control and configure their pedals via Source Audio's mobile application.

  It transmits control and configuration data only, not audio signal, so it is a control accessory rather than an audio device.
specs: |-
  - Length: 3 feet
  - Connects mobile device headphone jack (3.5mm) to pedal Input 2
  - Control/configuration data only (no audio signal)
  - Compatible with Source Audio One Series pedals
