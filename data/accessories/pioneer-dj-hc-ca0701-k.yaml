description: 1.2 m coiled cable for the HDJ-S7-K headphones
details: |-
  Replace your damaged cables and continue enjoying the excellent sound quality of your HDJ-S7-K headphones without the expense of buying a new pair. The independent ground wire in the 4-core twisted-structure cable gives superior left and right channel separation, improving sound quality. While the L-type mini-jack stops the headphones getting knocked or disconnected during performance, even in cramped booths. Cable length: 1.2 m coiled (extended length 3.0 m) Also applicable for the HDJ-S7-W.
