details: |-
  The third expansion ROM chip for the Black Wavetable VCO carries 8 custom wavetables and a new palette of sounds for the module.

  The new wavetables are Computer Organ 1, Computer Organ 2, Nasal Cyborg, Sine Pairs, Spiky FM, Sliced Sine, Stabbed Sine and AM Sweep. They are made in collaboration with Galbanum.

  Installing the chip is plug and play. It goes into the free slot on the back of the Black Wavetable VCO, with attention paid to the orientation of the chip, and the VCO identifies it automatically. The first LED blinking signals that wavetables are being selected from the third ROM chip.
specs: |-
  - 8 custom wavetables: Computer Organ 1, Computer Organ 2, Nasal Cyborg, Sine Pairs, Spiky FM, Sliced Sine, Stabbed Sine, AM Sweep
  - Wavetables made in collaboration with Galbanum
  - Plug and play installation into the free slot on the back of the Black Wavetable VCO
  - Automatically identified by the VCO
