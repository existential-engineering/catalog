description: An inline buffer module placed between a Eurorack power supply and
  modules that draw high current on power-up, ensuring consistent and reliable
  power-up for a case.
details: |-
  Pro level power handling

  The WMD Soft Start Module is an inline buffer module that goes in between your power supply and modules that draw high current on power up. Use to ensure a consistent and reliable power up each time you turn on your case. *We do not guarantee this module will solve your power issues.
specs: |-
  - 400 ms delay of power to both +-12V rails
  - Can handle 500mA per rail
  - Does not delay 5V rail
  - Passes CV and gate signals
  - Reverse polarity protected
  - Power Handling: +12V = 500mA; -12V = 500mA
  - Size: 1.5" x 1"
  - Depth: 0.5"
  - Plug female end directly into power distribution and the other into your ribbon cable.
  - -12V rail is labeled. Put red stripe towards indicator.
  - We will take care of you .
