description: Stereo breakouts with connectors perfect for connecting mini stereo
  phone outputs to unbalanced phone inputs.
details: |-
  This cable is designed to connect an audio device with a mini stereo phone output to pro audio gear with unbalanced phone inputs. It is ideal for connecting a portable media player, laptop, or similar device to a mixing console.

  The Stereo Breakout terminates in a 3.5 mm TRS plug on one end and a pair of 1/4 in TS plugs on the other, and is offered in 3 ft and 10 ft lengths. It is listed under Hosa's Hosa Breakouts category and carries the Essential Hosa tag.
specs: |-
  - Connectors: 3.5 mm TRS to Dual 1/4 in TS
  - Nickel-plated plugs for rugged durability and efficient signal transfer
  - Oxygen-Free Copper (OFC) conductors for enhanced signal clarity
  - OFC spiral shields for effective EMI and RFI rejection and flexibility
  - Available lengths: 3 ft, 10 ft
