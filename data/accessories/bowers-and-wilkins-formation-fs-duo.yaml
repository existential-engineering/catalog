details: |-
  Formation FS Duo is the dedicated floor stand for the Formation Duo wireless stereo speaker, designed by the Bowers & Wilkins acoustic team.

  The stand positions Formation Duo at the correct height for seated listening and gives the cabinet a rigid support, so that stereo focus and soundstaging are not compromised by placement.

  The page lists two finishes, Black and Silver. The supplied assembly instructions show the column being filled with dry sand (silver, play or silica) to add mass, and the base and top plate being bolted to the column before the speaker is fitted.

  This is a stand only. It carries no audio signal connection of its own, and Formation Duo is sold separately.
specs: |-
  - Type: Dedicated floor stand for Formation Duo, sold as a pair
  - Finishes: Black, Silver
  - Column is fillable with dry sand (silver, play or silica) per the assembly instructions
  - Brand: Bowers & Wilkins
