details: |-
  Built with period correct components, the AG 4P-60 offers warm, punchy, and articulate tones akin to those of the 1960s.

  Based on the legendary Pre-CBS era Precision bass, this pickup is designed to capture the vibe and feel of the 60's. Using period correct heavy Formvar wire and Alnico V magnets, these pickups are specially wound to deliver the warmth and midrange "nose" that defines a great 60's P-bass pickup. The AG 4P-60 Pickups are direct replacements for 4-string Precision Bass style basses.
specs: |-
  - Wire: Heavy Formvar, 42 gauge
  - Magnets: Alnico V
  - Leads: Single conductor, Teflon coated
