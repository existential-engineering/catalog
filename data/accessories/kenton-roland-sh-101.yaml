description: Socket upgrade kit that fits a filter control input to the Roland
  SH-101, so the low pass filter cutoff can be voltage controlled from the aux
  output of a Kenton MIDI to CV converter. A two socket version adds a
  modulation depth input as well.
details: |-
  This kit adds a filter socket to the Roland SH-101. The synthesiser already carries suitable CV and Gate sockets, so those do not need to be added.

  The extra socket lets the cutoff frequency of the low pass filter be voltage controlled from an aux output of a Kenton MIDI to CV converter such as the Pro-Solo mkII or the Pro-2000 mkII. Filter cutoff can then be driven from any continuous controller or from other MIDI messages such as aftertouch or velocity.

  A two socket version of the kit is also offered. It fits the same filter cutoff input plus a second voltage control input for the modulation depth of the SH-101's inbuilt LFO, both driven from the aux outputs of a converter.

  Every Kenton converter apart from the Pro-2 carries a MIDI controllable and MIDI syncable LFO of its own, so the one socket version is usually sufficient. The speed of the SH-101's internal LFO cannot be synchronised, and connecting an external clock to the instrument's EXT CLK IN does not affect that LFO, so the converter's LFO is the one to use.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the 3.5mm mono jack sockets. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - One socket version adds a 3.5mm mono jack filter control input
  - Two socket version adds filter cutoff and LFO modulation depth control inputs
  - Driven from the aux outputs of a Kenton MIDI to CV converter
  - Compatible converters include the Pro-Solo mkII and the Pro-2000 mkII
  - Filter cutoff controllable from any continuous controller, aftertouch or velocity
  - CV and Gate sockets are already fitted to the SH-101, so the kit does not add them
  - The SH-101 internal LFO speed cannot be synchronised to an external clock
  - Passive socket kit, so it has no power connection of its own
