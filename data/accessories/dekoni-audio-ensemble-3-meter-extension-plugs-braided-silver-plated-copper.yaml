details: |-
  Dekoni Audio Ensemble 3 meter Extension plugs Braided SIlver Plated Copper

  Experience ultimate living-room listening freedom without compromising micro-detail retrieval with the Dekoni Audio Ensemble 3-Meter Silver-Plated Extension. Designed for home theater and dedicated hi-fi listening rooms, this 9.8-foot cable section expands your modular setup across the room with crystal-clear signal transfer. Key Features

  Featuring silver-plated braided copper conductors, this extension cable delivers lightning-fast response times, extended treble air, and precise instrument separation over long distances. The generous 3-meter (9.8-foot) reach gives you full flexibility near rack equipment or listening chairs. Encased in a durable, tangle-resistant braided sleeve with precision aluminum connectors, it locks securely into all Ensemble upper Y-splits and lower base cables. (Note: Designed exclusively for use within the Dekoni Audio Ensemble Cable System.)
