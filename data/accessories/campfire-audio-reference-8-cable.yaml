details: |-
  The Reference 8 IEM Cable is a true high-fidelity earphone cable. Four high purity silver-plated copper (SXC) conductors combined with four OCC copper conductors in FEP jackets deliver full bodied musicality and fine inner detail to recordings. It also has the fun and "easy to listen to" sound signature of all of our ALO Audio cables. The terminations are subtly marked to indicate Right (Red) or Left (Blue) making it easy to use in on-the-go applications. The signature cable geometry combined with the durable FEP jacket work together to keep microphonics to a minimum while still delivering great sound quality. The FEP jacket will also keep the conductors safe from oxidation which is commonly found in many earphone cables. While oxidation doesn't negatively affect the sonic quality of the cable, keeping it out ensures your cable will stay looking great for years.
