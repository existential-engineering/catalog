name: M20 Mounting Bracket
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/type-20-u-bracket-isoacoustics-v120-mount
description: A HEDD steel U-bracket that holds the TYPE 20 monitor and connects
  directly to the IsoAcoustics V120 isolation mount, offering 360-degree
  rotation and 90-degree tilt for immersive ceiling installations.
details: |-
  The M20 is a mounting U-bracket designed to hold the TYPE 20 monitor in immersive studio environments. It connects directly to the IsoAcoustics V120 isolating mount without requiring a separate adapter plate, streamlining installation for ceiling-based speaker arrays.

  The bracket delivers flexible positioning through 360-degree rotation and 90-degree tilt adjustment, addressing the spatial demands of Dolby Atmos and immersive audio setups. The design requires no modification to the speaker itself, making it a non-invasive integration solution.

  The mounting system leverages IsoAcoustics' patented isolation technology to mitigate vibration transfer into supporting structures, reducing energy conduction back into the speaker and improving acoustic performance in complex installations.
specs: |-
  - Compatibility: all TYPE 20 models (MK2, A-CORE); IsoAcoustics V120 mounting system
  - Adjustment: 360 degrees rotation, 90 degrees tilt
  - Material: steel
  - Dimensions: 444 x 376 x 117 mm (17.5" x 14.8" x 4.6")
  - Weight: 3.70 kg (8.16 lbs)
  - Warranty: 2 years (IsoAcoustics)
