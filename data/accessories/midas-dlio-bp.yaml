details: |-
  Blanking plate accessory for Midas PRO Series digital console control centres and modular I/O stage boxes. Covers unused I/O expansion card slot positions. Shares the same front panel form factor as the DL441, DL442, DL443, DL444, and DL452 I/O cards. Compatible with Midas PRO3, PRO6, PRO9, PRO X consoles and DL351, DL451 stage boxes.
specs: |-
  - Compatible Consoles: Midas PRO3, PRO6, PRO9, PRO X
  - Compatible Stage Boxes: DL351, DL451
  - Form Factor: Matches DL441, DL442, DL443, DL444, DL452 I/O cards
