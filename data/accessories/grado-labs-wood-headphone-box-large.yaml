details: |-
  A beautiful hand-crafted wood box for storing your Grado headphones. 4OurEars exclusive. These solid wood boxes are stained and hand rubbed with golden oak and a clear satin lacquer. The boxes are precision engraved with the Grado logo and feature dovetail corner joint construction. All woods are sourced locally and are manufactured by dedicated craftsmen in Brooklyn, NY.

  Note: wood is a natural product and there will be variations in finish, grain and color. These variations should not be interpreted as defects.

  The large box fits all over-ear models of Grado headphones. Specify either the large foam insert or the small foam insert depending upon your headphones.

  Large insert: GS1000/2000/3000, PS1000/2000, White Headphone

  Small insert: All Prestige Series, RS1, RS2, PS500, GH1/2/3/4, Hemp, GW100
specs: |-
  - Solid wood construction with dovetail corner joints
  - Golden oak stain with clear satin lacquer finish
  - Precision engraved with the Grado logo
  - Made in Brooklyn, NY from locally-sourced woods
  - Available with large or small foam insert
