description: A socket upgrade kit that adds a 3.5mm filter socket to the Moog
  Rogue, putting low pass filter cutoff under voltage control from the auxiliary
  output of a MIDI to CV converter.
details: |-
  A one socket upgrade kit for the Moog Rogue. The synthesiser already carries suitable CV (osc) and gate (S-trig) input sockets, so those do not need adding; the kit fits the one socket the instrument lacks.

  The added socket puts the cutoff frequency of the low pass filter under voltage control. Driven from an auxiliary output of a MIDI to CV converter such as the Pro-Solo mkII, USB-Solo or Pro-2000 mkII, cutoff can then follow any continuous controller or another MIDI message such as aftertouch or velocity. The kit adds a connector only and performs no conversion itself.

  The kit contains all the necessary components along with diagrams for connecting the wires and components and for mounting the 3.5mm mono jack socket.

  A 3.5mm mono jack to 3.5mm mono jack lead is needed to connect the fitted socket to a converter, and a suitable lead is sold separately. Playing the notes of the Rogue needs a further lead, because the CV and trigger inputs of the Rogue sit on the ring connection of a stereo jack plug. On the trigger jack the ring carries V-trig and the tip S-trig, and Kenton recommends a 5V gate, the converter default, over S-trig on this synth.

  Fitting a socket upgrade kit is a skilled job and should be undertaken only by a competent synth service engineer, or carried out at the manufacturer's premises in Tadworth, just outside London.
specs: |-
  - Fits the Moog Rogue
  - One socket kit: adds a filter socket only
  - Socket type: 3.5mm mono jack
  - Puts low pass filter cutoff frequency under voltage control
  - Driven from the auxiliary output of a MIDI to CV converter such as the Pro-Solo mkII, USB-Solo or Pro-2000 mkII
  - The Rogue's existing CV and trigger inputs are on the ring connection of a stereo jack plug (trigger ring is V-trig, tip is S-trig; a 5V gate is recommended)
  - Kit includes components, wiring diagrams and socket mounting instructions
  - Requires a 3.5mm mono to 3.5mm mono lead, sold separately
