details: |-
  The Intelligent Footswitch is an intuitive yet versatile accessory for Darkglass amplifiers. One tap engages and disengages the Microtubes Engine, while holding for three seconds mutes the amplifier. It communicates with compatible amplifier heads through a proprietary protocol and connects to the amplifier using a standard 1/4" cable into the footswitch port.
specs: |-
  - Foot control for compatible Darkglass amplifiers
  - Tap to engage/disengage the Microtubes Engine
  - Hold 3 seconds to mute the amplifier
  - Communicates with amplifier heads via a proprietary protocol
  - Connects with a standard 1/4" cable
