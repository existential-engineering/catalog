description: This cable connects a stereo 1/4-inch TRS phone plug to a 3.5mm TRS
  mini stereo jack. It can be used to connect an expression pedal or headphones
  with different jack sizes.
details: |-
  This cable is designed to connect a stereo phone plug (1/4" TRS) to a mini stereo phone jack (3.5mm TRS). The right-angle mini stereo plug and pigtail design reduce stress on the mini jack. This cable may be used to connect an expression pedal to one of our pedals with a 3.5mm expression input jack. Or, it may be used to connect a 1/4" headphone plug to a 3.5mm headphone jack.
specs: |-
  - right-angle 3.5mm TRS plug on one end
  - 1/4" TRS jack on the other end
  - 6" / 15mm in length
  - flexible black jacket with molded strain relief
