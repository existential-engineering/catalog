description: Confidence inspiring power
details: |-
  The PG-1 Type C is a 1U rackmount power conditioner delivering clean, filtered, and surge-protected power via PG-99 Filtering Technology. It features eight switched rear Type C outlets grouped into Digital Audio (x2), Analog Audio (x2), and High Current (x2, time-delayed) categories, plus two unswitched front convenience outlets. Noise reduction reaches approximately 99.7% with premium Panasonic and Wima capacitors, 2775 joule surge absorption, a front-panel LED voltmeter, audio alarm for unsafe voltage, and XLR lamp connections on both front and rear panels.
specs: |-
  - Form Factor: 1U Rackmount
  - Input Voltage: 220VAC, 25A max
  - AC Mains Input: Type C plug (fixed cable, 230V AC)
  - Front Outlets: 2x Type C (unswitched)
  - Rear Outlets: 6x Type C (switched)
  - Surge Absorption: 2775 joules
  - Noise Reduction: ~99.7%
  - Width: 438mm (19")
  - Height: 44mm (1U)
  - Depth: 250mm
  - Display: LED voltmeter with status indicators
  - Power Sequencer: Yes (time-delayed for high current group)
