details: |-
  The K-Board Pro 4 Case is a hard carrying case custom built for the K-Board Pro 4. The outer construction is aluminum and ABS, chosen to stay rugged while remaining light, and the interior is a high-density EVA foam cushion formed to the shape of the instrument.

  The case closes with two locking latches and ships with keys for them, and carries a handle for transport. It is carry-on compatible on most flights, though airline rules vary and compatibility should be confirmed with the carrier.
