details: |-
  Replace your damaged cables and continue enjoying excellent sound quality without the expense of buying a new pair of headphones. The independent ground wire in the 4-core twisted-structure cable gives superior left and right channel separation, improving sound quality. While the L-type mini-jack stops the headphones getting knocked or disconnected during performance, even in cramped booths. And a mini-XLR connection with the HDJ-X10 s means you can easily detach the cables for transit or replace them if damaged.
