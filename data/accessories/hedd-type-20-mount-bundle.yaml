name: TYPE 20 Mount Bundle
manufacturer: hedd
primaryCategory: acoustic-treatment
url: https://hedd.audio/products/t20-mount-bundle
description: A HEDD ceiling-mount bundle for a TYPE 20 monitor, pairing an M20
  U-Bracket with a V120 isolating mount for full rotation and tilt control with
  patented IsoAcoustics isolation.
details: |-
  This bundle provides everything you need to connect a TYPE 20 monitor to a ceiling. It consists of an M20 U-Bracket and a V120 isolating mount, and includes all necessary hardware for installation.

  The steel U-Bracket bolts directly to the speaker via the mount for easy application, offering full rotation and tilt control. Patented IsoAcoustics isolation technology reduces vibration transfer.

  Compatible with TYPE 20, TYPE 20 MK2, and A-CORE models. Monitor sold separately; the monitor needs to be prepared with mounting screw holes by HEDD or a certified service partner. For wall installations, the IsoAcoustics Wall Mount must be added separately.
specs: |-
  - Contents: 1x M20 U-Bracket, 1x V120 isolating mount
  - Full rotation and tilt control
  - Steel construction
  - Patented IsoAcoustics isolation technology
  - Weight: 4.47kg
  - Warranty: 2-year warranty from IsoAcoustics
  - Compatible with TYPE 20, TYPE 20 MK2, and A-CORE models
  - Monitor sold separately; requires mounting screw holes prepared by HEDD or a certified service partner
