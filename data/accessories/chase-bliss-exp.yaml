details: |-
  The exp expression roller works like any other expression pedal, but comes
  with two completely independent outputs. The roller is attached to a dual
  linear 10k pot that's compatible with any TRS expression input. You can also
  change the polarity of either output.

  The body of exp is identical in size and build to classic Chase Bliss pedals,
  making it the perfect companion to your existing gear.
specs: |-
  - Dual independent expression outputs
  - Dual linear 10k potentiometer
  - TRS expression input compatible
  - Adjustable polarity per output
  - Compact pedal-sized enclosure matching classic Chase Bliss form factor
