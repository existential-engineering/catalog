details: |-
  HD15 to (12)1/4" Mono Plugs The FTB Output Cable is a high quality 10' HD15 to 1/4" mono plug cable. The cable has an HD15 connector which connects to the output of the FTB, and 12 mono plugs which can connect to any standard drum module. This cable sends out the Input signals from the HD15 IN and the 1/4" Inputs (1- 12) of the FTB. The mono plugs are labeled 1-12 which correspond to the FTB Input number as well as the pad number of the jamKAT or Drumkat Hybrid.
