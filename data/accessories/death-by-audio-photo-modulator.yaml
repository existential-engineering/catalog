description: A compact light-sensitive controller housed in a right-angle
  quarter-inch jack that lets any light source manipulate expression
  pedal-compatible effects.
details: |-
  Stick it where the sun does shine! The PHOTO MODULATOR is a compact, light-sensitive controller that allows you to manipulate expression pedal-compatible effects using any light source. Shine a bright light - such as a strobe, flashlight, stage light, or even a lava lamp - onto the sensor to sweep your effect one way. Cover it in shadow, and it sweeps the other. It works just like an expression pedal: light = toe down, dark = heel down. Housed in a right-angle ¼” jack for an ultra-small footprint, it’s easy to aim the sensor at your desired light source. No batteries required. Details The PHOTO MODULATOR uses a passive photoresistor circuit to allow almost any expression pedal-compatible pedal to be manipulated by light. Shining a bright light on the lens simulates putting your toe down on an expression pedal, and covering it in darkness simulates putting your heel down. This means you can connect the PHOTO MODULATOR to the ROOMS , EVIL FILTER , the new CROSSOVER FUZZ , or many of your favorite expression-control pedals and to instantly open it to the endless possibilities of light control! Specifications Electrical Details The PHOTO MODULATOR uses a cadmium-sulfide photoresistor connected between the tip and ring of the ¼” jack. Its resistance changes with light: Bright light: <1k Complete darkness: >1MΩ A 47kΩ resistor connects the ring to the sleeve, mimicking the behavior of the potentiometer found in most passive expression pedals. This configuration ensures compatibility with a wide range of effects that accept standard expression pedal input. Physical Details Dimensions: 2.6” x 1.9” x 0.6” Weight: 0.09 oz. Regulatory Notice: The PHOTO MODULATOR contains a cadmium-sulfide-based photoresistor. Due to the presence of this material, the device is not compliant with the following environmental safety regulations: EU Directive 2011/65/EU (RoHS) UK RoHS China RoHS K-RoHS (Korea) Taiwan RoHS As a result, it cannot be sold, shipped, or distributed in the European Union, the United Kingdom, China, Korea, or Taiwan. Digital Manual
