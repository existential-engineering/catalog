details: |-
  The DW 3000 Series Throne is for any drummer who wants a solid place to sit! The heavy-duty steel tripod base and double-braced legs are designed to last for years. The Round Top Throne has a durable, vinyl-covered, thick foam seat for support and comfort while sitting at the drum kit. The 3000 Series Throne is a dependable choice from the people that reinvented drum hardware.

  Thickset, Durable Comfort: a supportive, vinyl-covered cushion seat for balance and longevity.

  Flexible and Dependable Adjustment: expansive height adjustment with a burly vice lock.

  Double-Braced Tripod Legs: reliably solid 1-1/8" double-structure foundation with no-slip feet.

  The 3000 Series is engineered for drummers of all levels, with sturdy double-braced hardware providing stability and durability during intense performances, smooth memory locks for seamless adjustment, and a sleek design that complements any drum kit.
