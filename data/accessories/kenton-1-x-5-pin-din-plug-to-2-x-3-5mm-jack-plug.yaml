description: A breakout lead from one 5 pin DIN plug to two 3.5mm jack plugs,
  for reaching the DIN sync output of a Pro-Solo mk1 (pins 1 and 3 connect to
  the jacks) or auxiliary outputs 2 and 3 of a Pro-Solo mkII.
details: |-
  A breakout lead wired from one 5 pin DIN plug to two 3.5mm jack plugs, with pins 1 and 3 of the DIN connected to the two jacks. The page gives it two intended uses.

  With a Pro-Solo mkII, the DIN plug goes into the THRU socket set to Aux mode, which gives access to auxiliary outputs 2 and 3. Those outputs are intended to drive the accent and slide inputs of a TB-303 fitted with the Kenton 5 socket upgrade.

  With a Pro-Solo mk1, the two 3.5mm jack plugs go into the CV and Gate outputs of the converter running in sync mode, and the DIN plug can then be connected to any Sync 24 input on other equipment.
specs: |-
  - 1 x 5 pin DIN plug to 2 x 3.5mm jack plugs
  - DIN pins 1 and 3 connect to the jacks
  - Pro-Solo mkII: DIN plug into the THRU socket in Aux mode for auxes 2 and 3
  - Pro-Solo mk1: jacks into the CV and Gate outputs in sync mode, DIN into a Sync 24 input
