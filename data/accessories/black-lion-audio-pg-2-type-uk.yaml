description: Rackmount (3U) 12-output power conditioner
details: |-
  The PG-2 Type UK is the UK market variant of the PG-2, using a Type G (BS1363) plug for 230V UK power grids. It features twelve switched, filtered, and surge-protected outlets organized into four groups (Digital Audio x2, Analog Audio, and High Current) on the back panel, plus one filtered convenience outlet on the front. Time-delayed High Current outlets ensure speakers and power amplifiers power on last and off first, preventing audio pop.

  Built around PG-99 Filtering Technology with premium Panasonic and Wima capacitors, the PG-2 Type UK achieves up to 99.7% noise filtering — compared to the typical 85% average at the same price point. A voltage meter and amperage meter enable real-time power analysis; LED status indicators cover grounding, polarity, noise filtering, abnormal voltage, and surge protection; an audio alarm activates on unsafe voltage conditions. Power absorption rating: 2775 joules.
specs: |-
  - PG-99 Filtering Technology — 99.7% average noise filtering
  - Premium Panasonic and Wima capacitors
  - 11 rear switched, filtered, surge-protected outlets
  - 1 front filtered convenience outlet
  - Time-delayed High Current outlets
  - 2775 joules power absorption (surge protection)
  - Voltage meter and amperage meter
  - LED status indicators: grounding, polarity, noise filtering, abnormal voltage, surge protection
  - Audio alarm for unsafe voltage conditions
  - Voltage: 230V AC, 10A max
  - Plug type: Type UK (BS1363)
  - Form factor: 3U rackmount
  - Dimensions: 438mm W x 133mm H x 250mm D
  - Weight: 6.8 kg
