details: |-
  This cable is designed to interconnect gear with left and right stereo balanced phone jacks. It is ideal for use in a variety of professional and consumer applications.

  Connectors are Dual 1/4 in TRS to Same, and the cable is offered in 1 m, 2 m, 3 m and 4 m lengths under the SKUs CSS-201, CSS-202, CSS-203 and CSS-204.
specs: |-
  - Nickel-plated plugs for rugged durability and efficient signal transfer
  - Oxygen-Free Copper (OFC) conductors for enhanced signal clarity
  - OFC spiral shields for effective EMI and RFI rejection and flexibility
  - Connectors: Dual 1/4 in TRS to Same
  - SKU: CSS-200
  - Available lengths: 1 m, 2 m, 3 m, 4 m
  - Lifetime warranty
