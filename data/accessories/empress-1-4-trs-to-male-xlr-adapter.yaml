description: An Empress-branded 1/4" TRS to male XLR adapter for connecting an
  XLR cable to the balanced output of the Bass ParaEq or any product with a
  balanced 1/4" output. It does not convert the signal to mic level.
details: |-
  This Empress-branded 1/4" TRS to male XLR adapter can be used to connect an XLR cable to the output of your Bass ParaEq (or any product with a balanced output).

  Please note: this does not adapt the signal of the Bass ParaEq to mic level. If the receiving console is set to receive a mic-level signal there may be unwanted distortion at its input.

  One end is a 1/4" TRS (balanced) jack; the other is a male XLR connector.
specs: |-
  - 1/4" TRS (balanced) jack on one end, male XLR on the other
  - Passes the balanced line-level output signal unchanged (does not convert to mic level)
  - Intended companion for the Bass ParaEq balanced output
