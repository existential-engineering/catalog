details: |-
  Product Overview

  The Heil SM-1 is a professional suspended shock mounting system designed to isolate handheld dynamic microphones from low-frequency mechanical vibrations, stand noise, floor thuds, and surface thumps. Engineered specifically to fit Heil Sound's popular handheld dynamic microphones, including the PR 20, PR 20 UT, PR 22, and PR 22 UT, the SM-1 ensures pristine audio capture in broadcast studios, live sound venues, podcast setups, and recording facilities.

  Built with a durable outer metal skeletal frame and high-tension elastic suspension bands, the SM-1 securely clamps around the body of handheld dynamic microphones while decoupling them from the mic stand or boom arm. Equipped with an industry-standard 5/8″-27 metal threaded connection, the SM-1 seamlessly mounts onto Heil boom arms (such as the PL2T and SB-2) as well as standard floor stands and desktop mounts, making it an essential studio accessory for eliminating handling noise and mechanical resonance.

  Not compatible with the PR 35 or PR 37.
specs: |-
  - Professional Suspended Shock Mount: Flexible elastic suspension system decouples handheld dynamic microphones from stands and boom arms to suppress handling noise and floor rumble.
  - Engineered for Heil Handheld Dynamic Mics: Specifically designed to fit the PR 20, PR 20 UT, PR 22, PR 22 UT, and similar handheld dynamic microphone body sizes.
  - Heavy-Duty Frame Construction: Built with a durable metal outer cage and long-lasting elastic suspension bands designed for reliable performance in live sound and broadcasting environments.
  - Universal 5/8″-27 Threading: Integrated mounting base fits all standard microphone stands, floor booms, and desktop mounting hardware.
  - Seamless Boom Arm Compatibility: Integrates directly with Heil broadcast boom arms (including the PL2T and SB-2) and all Heil brass-lined desk mounts.
  - Clean Studio Aesthetic: Maintains a sleek, low-profile look on camera for video podcasts, live streaming, broadcast studios, and stage setups.
  - Not for large-body microphones: does not fit the PR 35, PR 30, PR 40 or PR 77D; the Heil PRSM shock mount covers PR 30, PR 40 and PR 77D.
