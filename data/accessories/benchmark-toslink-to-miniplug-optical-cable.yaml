description: A precision 6-foot optical cable assembled in Canada with one
  full-size TOSLINK and one 3.5mm mini-TOSLINK connector, featuring metal
  construction with gold-plated ferrules for reliable digital audio connections.
details: |-
  The Benchmark TOSLINK to MiniPlug Optical Cable connects a full-size TOSLINK port to a 3.5mm mini-TOSLINK (miniplug optical) port, enabling digital audio transmission between components such as audio interfaces, DACs, computers, and consumer electronics. The cable is assembled in Canada using precision metal connectors with silver aluminum back shells and gold-plated metal ferrules for reliable, low-loss connections.

  The cable uses a low-attenuation fiber core rated at less than 0.15 dB per meter at 650 nm, supporting transmission distances exceeding 26 meters with an average 4 dB loss budget. The 5mm flexible jacket is extra strong with a satin-smooth finish, and the allowable bending radius is greater than 9 mm for routing flexibility.

  Available in a 6-foot (2 m) length, suited for connecting equipment with differing optical port formats without adapters.
specs: |-
  - Connectors: TOSLINK full-size to 3.5mm mini-TOSLINK (miniplug optical)
  - Length: 6 feet (2 m)
  - Cable diameter: 5 mm
  - Attenuation: <0.15 dB/m at 650 nm
  - Maximum transmission distance: >26 m (average 4 dB budget)
  - Numerical aperture: 0.5
  - Acceptance angle: 60 degrees
  - Allowable bending radius: >9 mm
  - Connector finish: Gold-plated metal ferrules, silver aluminum back shells
  - Assembled in Canada
