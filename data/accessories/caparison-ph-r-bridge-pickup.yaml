details: |-
  The Caparison PH-R features a three-magnet "anisotropic" construction, giving you massive output without compromising any of the tone. This arrangement of magnets, with one positioned centrally and additional magnets either side of the bobbin, contributes to a powerful sound profile rich in harmonics and sustain, particularly in the mid-low frequencies, but still retaining clear separation and presence. Compatible with both tremolo bridge and fixed bridge. This pickup is available in two types: 2S attaches with two screws, standard for most guitars. 3S attaches with three screws, replacement type for Caparison guitars. 2S Version Dimensions PDF - 3S Version Dimensions PDF
