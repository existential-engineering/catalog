details: |-
  8 Conductors of Awesome Sound

  ALO Audio's SXC-8 headphone cable redesigned for IEMs. Silver-plated high purity copper wire is at the heart of the eight fine-stranded 22 AWG conductors. Each conductor is custom annealed to an extra soft temper. The SXC 8 IEM cable comes jacketed in durable FEP for exceptional resistance to discoloration. The FEP jacket produces a cable with a supple feel, unlike other silver plated or even pure silver cables. Each cable features our reference type 8 wire weave – a stereo symmetrical design with opposing currents. This weave design lends itself to a more open sonic signature and delivers the perfect blend of detail and clarity.
