  The Transporter: High quality and durable padded gig bags for transporting your precious modular synth cargo—don't worry, there is enough head room to leave your system patched.

  Very high quality and durable padded gig bags for transporting your precious modular synth cargo. Sized for our 7U Performance Cases (Gen-1 and Gen-2).
specs: |-
