details: |-
  The warm, punchy tone of the 60's era jazz bass pickup, but without the 60-cycle hum, in a 5-string version. Noise-free, classic Jazz Bass tone in a pickup that works great for all playing styles. Featuring the split-coil design, these pickups deliver a deep low-end, rich midrange character, and clear articulation – all with no hum! The AG 5J-HC pickup set is a direct replacement in the Fender Jazz V and many other 5 string J-style basses.
specs: |-
  - Wire: 44 gauge, polyester-nylon wire
  - Magnets: Alnico V
  - Leads: Single conductor, heat resistant Teflon coated
