details: |-
  Neutrik SpeakON connectors are the industry-standard locking loudspeaker connector for professional applications. They provide a reliable connection secured by a twist-lock mechanism that prevents accidental disconnection under load. Benchmark equips its AHB2 amplifier and SMS1 speakers with SpeakON jacks and recommends these connectors for all speaker connections.

  Each connector features solid contacts with screw-type terminals including a protective sleeve to secure stranded speaker wire. Benchmark's own distortion testing found that SpeakON connections produced consistently lower THD results than binding-post terminations, making them the preferred interface for critical listening and measurement.

  The NL2 (2-pole) variant is recommended for standard single-amplifier speaker wiring. The NL4 (4-pole) variant is required when building 4-pole bi-amp cables. Both are sold individually as bare connectors for DIY cable assembly.
