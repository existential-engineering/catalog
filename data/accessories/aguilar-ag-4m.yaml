details: |-
  Classic Stingray tone with excellent string-to-string balance, consistency of tone and rich harmonic content. The M- Style pickups re-create the classic Stingray tone while adding the characteristics that Aguilar pickups are known for – excellent string-to-string balance and consistency of tone. Wired in parallel, these pickups give players crisp treble, articulate midrange and thunderous lows. The AG 4M Pickup is direct replacements for 4-string Music Man style basses.
