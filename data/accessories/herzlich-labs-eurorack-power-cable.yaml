details: |-
  Tired of routing those same old, inflexible power cables that kink, always bend at awkward angles and, as anyone who has routed a skiff can attest, are a nightmare to effectively lay flat in tight spaces? Don't worry. The experts here at Herzlich Labs have soft and flexible news for you - black silicone power cables that are certain to please even the most discerning polymer paraphiliac. Heat resistant, highly flexible, kink-free, lightweight and very durable, they are the superior choice for when you frequently rearrange modules, when routing power in tight spaces or when reliability is paramount.
