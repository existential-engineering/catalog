  integrated cable guide.
details: |-
  Mounting Bracket for Midas DP48 Personal Monitoring Mixer. The Midas DP48 system is the easy, affordable way to provide live or recording musicians/vocalists what they really want – their very own custom-tailored monitor mix. The DP48MB bracket allows the DP48 mixer to be mounted on mic stands, music stands, drum hardware, or similar surfaces, and includes dual headphone hangers and integrated cable management.
