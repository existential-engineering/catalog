description: Built with period correct components, the AG 4J-70 set offers the bright, clear, and articulate jazz bass tones akin to those of the 1970s.
details: |-
  Built with period correct components, the AG 4J-70 set offers the bright, clear, and articulate jazz bass tones akin to those of the 1970s. In order to capture the signature tone of the 70's Jazz Bass pickup, Aguilar went through a unique prototyping process – sampling and deconstructing several pickups spanning the era to discover what makes them so special. Utilizing both a unique wire size and winding pattern, these pickups are bright and articulate with a clear and punchy low-end perfect for rock, funk, and R&B styles. The AG 4J-70 pickups are direct replacements for Jazz Bass style basses.
specs: |-
  - Wire: Enamel, 42 gauge
  - Magnets: Alnico V
  - Leads: Single conductor, Teflon coated
