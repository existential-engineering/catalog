details: |-
  The OBP-3 is a three-band boost and cut bass, mid, and treble preamp, that has high headroom, low distortion, and the ability to reproduce the full dynamic range of your instrument. The OBP-3 has multiple wiring options, and can be wired with either a push/pull pot OR mini-toggle for midrange frequency selection. (See kit configuration option.)

  The OBP-3 is Aguilar's most flexible onboard preamp design, providing +/-18dB of cut and boost at 40Hz, +/- 16dB of cut and boost at either 400Hz or 800Hz and +/- 16dB of treble cut and boost at 6.5 kHz.

  Available in the following kits:

  OBP-3TK: Includes separate Treble, Mid, and Bass pots, and black mini-toggle switch for Midrange frequency selection

  OBP-3TK/PP: Includes separate Treble, Mid, and Bass pots. Mid pot is push/pull for Midrange frequency selection

  OBP-3SK: Includes stacked Treble/Bass pot, Mid pot, and black mini-toggle switch for Midrange frequency selection

  OBP-3SK/PP: Includes stacked Treble/Bass pot and separate Mid pot. Mid pot is push/pull for Midrange frequency selection
