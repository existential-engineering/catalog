details: |-
  The sealed upper motor bearing in the Roland Space Echos can become worn over time causing excessive wow and flutter (tape speed variations). The bearing grease turns to glue over time and can burn out your motor. It is important to replace the motor bearings before the motor burns out as there is no replacement at this time

  Note: Replacing the sealed motor bearing is for experienced persons only as incorrect installation can damage the drive motor. Echo Fix can replace the motor bearing for a fee and also carry out a full service on your Space Echo so it will be functioning for another 30 years. Make sure that you are familiar with your country's customs, taxes and importing laws.
