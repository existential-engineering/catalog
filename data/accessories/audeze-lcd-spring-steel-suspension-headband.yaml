details: |-
  Our spring steel suspension headbands are designed to distribute weight evenly across your head, reducing hotspots and promoting comfort for extended listening sessions! The bands fit all LCD headphones except LCD-1 and LCD-5.

  Please note: The serial number of your LCD headphones is located on the headband. It is advisable to remove the serial number sticker from the old headband and replace it on your new one, or to keep the old headband in case of warranty service on your headphones.

  We also offer the suspension straps alone, in either leather or leather-free options. Simply choose the STRAP ONLY option in your choice of materials from the drop-down menu. The straps also fits our Carbon Fiber headbands!To replace the suspension strap, just remove the four screws on the inside of each adjustment block, then put the new strap in place and re-insert the screws. The exact pattern and spacing of the perforations may vary slightly from the photo shown.

  A full instruction sheet and simple tools are included with each headband, to make changing bands as easy as possible. You can download the instructional guide here.
