details: |-
  Compact Powered Tabletop Eurorack Case perfect for converting the Modbap Modular Per4mer into a self-contained desktop effects unit. Introducing the special edition Pod20 customized for ModBap Modular by 4ms, the Modbap20. The Modbap20 Powered Eurorack Case can be your on-ramp to eurorack, a great option for a focused mini system, or a live control surface, or the perfect way to expand a larger system. The Modbap20 is 20HP in width, and 34mm deep with 4ms power bus boards. The included power brick and your favorite combination of up to 20HP modules are all you need to get started with your new mini system, control pod, performance pod, effects pod, or whatever you so desire. Features

  Case Specs

  Power Adapter Specs
specs: |-
  - Powered case
  - 2 x 16-pin Power Headers
  - Matte black finish
  - Anodized Aluminum
  - Two power inlets for chaining pods
  - Power Adapter included
  - 20hp
  - 34mm depth
  - 6.28"x 4.18"x 1.42" (HxWxD)
  - +12V/700mA, -12V/280mA, +5V/200mA
