details: |-
  The Tone Hammer 210 Combo delivers the sound, feel, and authority of an Aguilar
  rig in a streamlined, gig-ready combo for small to medium rooms. Designed for
  working bassists who need professional tone without excess size or complexity,
  it combines a compact and vertically oriented 2x10 cabinet with a 300-watt
  Tone Hammer amplifier for punchy projection, warm harmonic character, and
  modern connectivity.

  From tight stages and Broadway pits to studio sessions and houses of worship,
  the Tone Hammer 210 Combo is built to perform wherever consistency, clarity,
  and reliability matter most. The vertically oriented 2x10 cabinet improves
  dispersion and stage presence while keeping the footprint compact.

  The amplifier section delivers Aguilar's signature tube-inspired warmth through
  a solid-state/Class D design with an ultra-quiet cooling system. The Tone Hammer
  preamp section features the proprietary AGS (Adaptive Gain Shaping) circuit for
  harmonically rich drive tones.

  Dual XLR outputs with Aguilar Cabinet Suite support allow bassists to send a
  consistent, cabinet-simulated signal to front-of-house and monitor mixes
  simultaneously. The onboard impulse responses replicate the character of
  Aguilar's most iconic cabinet voicings.

  Weighing 47 lbs with dimensions of 16.5" x 12" x 30", the Tone Hammer 210
  Combo is designed to be portable enough for regular transport while delivering
  the full-range sound of a professional bass rig.
specs: |-
  - Power output: 300W
  - Speaker configuration: 2x10" vertical cabinet
  - Custom ceramic 10-inch drivers
  - Dual XLR outputs with Aguilar Cabinet Suite (IR cabinet simulation)
  - Headphone output for silent practice
  - Auxiliary input for playing along to music
  - Tube-inspired warmth via AGS (Adaptive Gain Shaping) circuit
  - Ultra-quiet cooling system
  - Compact vertical design for improved stage dispersion
  - Dimensions: 16.5" (L) x 12" (W) x 30" (H)
  - Weight: 47 lbs
