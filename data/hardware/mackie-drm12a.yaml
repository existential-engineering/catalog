description: The Mackie DRM12A is a 12" powered array speaker that provides
  2000W of Class-D power, cutting technology, and professional sound for any
  application.
details: |-
  The DRM12A represents decades of innovation in acoustic, DSP, and amplifier design. Combining extensive tuning, premium components, and cutting-edge DSP, the DRM12A provides clarity, versatility and reliability in a tour-worthy package.

  The DRM12A 2000W 12 inch Arrayable Powered Loudspeaker delivers power via an ultra-efficient Class-D amplifier with next-gen protection and Power Factor Correction technology.

  Advanced Impulse DSP provides acoustic correction and time-alignment via precision tuned FIR filters. The DRM Control Dashboard features a high-contrast, full-color display for quick access to EQ, voicing modes and more.

  A custom high-excursion 12 inch woofer and three 1 inch compression drivers housed in the texture coated 15 mm plywood cabinet are designed for consistent performance in demanding applications.
specs: |-
  - 2000W peak Class-D system amplification (1620W peak LF, 380W peak HF)
  - Frequency range 50 Hz - 20 kHz (-10 dB), 65 Hz - 20 kHz (-3 dB)
  - Max SPL 135 dB peak
  - Coverage 110 degrees horizontal x 20 degrees vertical; array coverage 40/60/80 degrees vertical for 2/3/4 cabinets
  - 12 in / 305 mm ferrite woofer and 3x 1.0 in / 25 mm titanium dome compression drivers
  - Advanced Impulse DSP with FIR filtering for crossover and transducer time-alignment
  - Electronic crossover 24 dB/octave at 1.0 kHz
  - Four array modes (single, dual, 3-4, 3-4 long throw)
  - 3-band parametric EQ: +/-12 dB at 20-200 Hz, 200 Hz-2 kHz and 2-20 kHz; HPF 40-160 Hz variable
  - Subwoofer high-pass filter: off, DRM18S or variable
  - Alignment delay 0-100 ms
  - Six user presets, system lock with 4-digit passcode
  - Female XLR input (8 kOhm balanced) and parallel male XLR output (600 Ohm balanced)
  - Universal switchmode power supply 100-240 VAC, 50-60 Hz, 175W, with Power Factor Correction
  - Locking Neutrik powerCon A AC in (20 A, 250 VAC, max 1400W) and powerCon B AC thru (20 A, 250 VAC, max 1250W)
  - 15 mm plywood enclosure with black polyurea finish, powder-coated 16-18 gauge steel grille
  - Dual-angle pole mount, 7x M10 flypoints, flyable with up to 4 DRM12A and 2 DRM18S via the FB100 fly bar
  - Dimensions 15.2 x 24.7 x 18.0 in / 386 x 627 x 457 mm (H x W x D)
  - Weight 55.0 lb / 24.9 kg
