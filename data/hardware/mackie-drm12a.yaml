details: |-
  The Mackie DRM12A is a powered constant curvature array loudspeaker with 2000W of ultra-efficient amplification and sophisticated Advanced Impulse DSP for concert venues, clubs, houses of worship, touring, and more.

  The DRM12A represents decades of innovation in acoustic, DSP, and amplifier design. Combining extensive tuning, premium components, and cutting-edge DSP – the DRM12A provides unmatched clarity, versatility, and reliability in a world tour-worthy package. Whether you are a DJ that needs some serious output or a equipping a massive club, the DRM12A is ready to be the backbone of your PA.
specs: |-
  - Power: 2000W
  - LF Driver: 12"
  - HF Driver: 1.4" (x3)
  - Frequency Response: 50Hz - 20 kHz
  - Max SPL: 135 dB
  - Coverage: 20° V x 110° H
  - Weight: 55.0 lb / 24.9 kg
  - Construction: 15mm plywood with powder-coated steel grille
  - Compression drivers: Triple 1" Titanium diaphragm
  - Woofer: 12" High-excursion
  - Pole mount: Dual-angle
  - Flyable: Up to 4 DRM12A cabinets with FB100 Fly Bar
  - Flypoints: 7 x M10
