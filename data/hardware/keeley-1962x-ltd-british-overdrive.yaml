description: Two-mode British-voiced overdrive, a limited version of the 1962
  with an added high-headroom MOSFET clipping mode.
details: |-
  The 1962X is a limited version of the Keeley 1962, built in batches as parts supply allows, adding a second "KT88" high-headroom mode that uses MOSFET clipping. In the "KT66" mode it covers the same gain range as the standard 1962, from mild breakup through to full saturation. In the "KT88" mode a MOSFET transistor is inserted into the clipping stage for a higher output and a more forceful, focused sound with more presence, which suits pushing the front end of a tube amplifier. The pedal is finished in a graphic design drawing on classic Bluesbreaker elements.

  The 1962 is an amp-in-a-box design built around British black and gold amplifier tones, wrapping a Keeley Katana circuit around both sides of a Bluesbreaker-style core for a heavy, cutting classic distortion voice.

  Layered gain is central to the design. The Katana booster circuit is split in half and both JFET stages are used in the way valves are used in a British amplifier, producing preamp and output-stage distortion characteristics in one hybrid circuit.

  The unit is hand built from precision components, with the surface-mount JFET transistors placed and soldered by hand, and a low-noise op-amp chosen to keep the circuit clear and quiet at high gain.
