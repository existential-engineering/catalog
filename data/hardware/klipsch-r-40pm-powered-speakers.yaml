details: |-
  The R-40PM is a compact powered bookshelf monitor speaker system that requires no separate A/V receiver. A built-in customized amplifier drives both the 4" copper-spun TCP woofer and the 1" Linear Travel Suspension (LTS) aluminum tweeter with Kapton suspension, delivering clean, detailed sound at any listening level.

  Klipsch's signature Tractrix horn-loaded tweeter design provides wide, controlled dispersion and high efficiency. The steeply angled copper woofer cone and bass-reflex rear-firing port extend bass response for more low-end presence than typical bookshelf speakers.

  Connectivity includes a phono input with ground screw for MM turntables, an optical Toslink digital input, a USB Type-B input for computer audio, standard RCA analog line-level inputs, and Bluetooth for wireless streaming.

  A dedicated RCA subwoofer output allows the R-40PM to seamlessly integrate with compatible Klipsch subwoofers. Low-profile magnetic grilles provide design flexibility, displaying the distinctive copper-spun woofer cones.
