description: The One25A is a 3-way active sealed-cabinet studio monitor
  celebrating 25 years of Amphion acoustic design, delivering pinpoint stereo
  imaging through a phase-coherent driver array and an analog signal path free
  of DSP or AD/DA conversion.
details: |-
  The One25A is a 3-way active full-range studio monitor built around a 1-inch titanium tweeter, a 5¼-inch aluminium midrange driver, and a 10-inch aluminium bass driver. Crossover points are set at 100 Hz and 2000 Hz, enabling each driver to operate within its optimal range and preserving transient detail across the full frequency band.

  Amplification is handled by a separate rigid steel enclosure external to the speaker cabinet, housing a 700 W bass amplifier and two 205 W tweeter/midrange amplifiers (THD+N 0.002%). Isolating the electronics from the cabinet reduces vibration-induced noise and allows optimal thermal management without compromising cabinet acoustics.

  The sealed midrange and tweeter chamber is acoustically isolated from the bass woofer section, eliminating back-wave interference that would otherwise colour the critical midrange frequencies. Combined with Amphion's proprietary U/D/D (Uniform Directivity Design) and a symmetrical baffle, the result is a wide and consistent listening window.

  An 8-step boundary control provides ±7 dB of bass adjustment at 20 Hz, allowing the monitor to be tuned for placement near walls or in treated rooms without compromising low-frequency accuracy.

  Frequency response extends from 22 Hz to 55,000 Hz (−3 dB), with a maximum SPL of 105 dB. The cabinet measures 316×510×488 mm and weighs 41 kg.
specs: |-
  - Operating Principle: Active, 3-way, sealed cabinet
  - Tweeter: 1" titanium
  - Midrange: 5¼" aluminium
  - Bass: 10" aluminium
  - Crossover Points: 100 Hz / 2000 Hz
  - Amplifier Power (tweeter/midrange): 2×205 W (THD+N 0.002%)
  - Amplifier Power (bass): 700 W
  - Frequency Response: 22–55,000 Hz (−3 dB)
  - Maximum SPL: 105 dB
  - Boundary Control: 8-step, ±7 dB at 20 Hz
  - Mains: 230 V / 50 Hz or 115 V / 60 Hz
  - Dimensions (H×W×D): 316×510×488 mm
  - Weight: 41 kg (90.4 lbs)
