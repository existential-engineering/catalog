description: Elevate your home entertainment with a TV soundbar that delivers
  Dolby Atmos and next-generation immersive audio for a powerful cinematic
  experience.
details: |-
  Feel like you're at the heart of every scene thanks to Heston 60's legendary audio. Featuring the three-dimensional precision of Dolby Atmos, Heston 60 draws you deeper into the drama. Enjoy an immersive world where your sound is perfectly tuned for movies and music.

  Immersive sound for movies and music: from movie marathons to favourite songs on repeat, this soundbar makes every note hit deeper. A 5.1 configuration driven by seven Class D amplifiers feeds five full-range drivers and two woofers, with Dolby Atmos and DTS-X decoding.

  Multi wireless connectivity and integrated services: connect over Wi-Fi with AirPlay, Google Cast, Spotify Connect or TIDAL Connect, or over Bluetooth. Programming the preset button in the Marshall app gives one-press access to Spotify and internet radio through airable.

  Sound modes: Music mode delivers the Marshall signature sound, Movie mode a wide immersive soundstage, Night mode applies dynamic range compression to lower loud peaks and lift quiet passages, and Voice mode focuses the midrange to keep dialogue intelligible. A media control knob handles play, pause, skip and scrub.

  Mounts directly to the wall, with wall grommets included, and is ready for next-generation Bluetooth LE Audio with over-the-air updates. Subwoofer expansion is supported wirelessly with the Heston SUB 200 or by wire through the sub out port. Designed and engineered in Sweden. Made in China.
specs: |-
  - Frequency range: 45 Hz to 20 kHz
  - Maximum sound pressure level: 89 dB
  - Power amplifiers: 7 Class D amplifiers, 2 x 25 W and 5 x 5 W
  - Total audio power output: 56 W (peak)
  - Configuration: 5.1
  - Full range: 5 x 1.25"
  - Woofers: 2 x 3"
  - Immersive audio formats supported: Dolby Atmos, DTS-X
  - Wireless connectivity: Bluetooth 5.3, Wi-Fi 6
  - Wired connectivity: HDMI eARC, AUX IN 3.5 mm, RCA Mono (Sub Out), USB-C
  - Top panel controls: volume button, source selection button, sound mode toggle button, programmable preset button
  - Codecs: SBC, LC3, AAC, Mpeg4, ALAC, FLAC, LPCM, Ogg Vorbis, WMA, WMA9
  - Wi-Fi service integrations: AirPlay 2, Google Cast, Spotify Connect, TIDAL Connect
  - HDMI spec: HDMI 2.1 eARC, HDCP 1.4
  - Microphones: 2 used for room calibration
  - Weight: 2.76 kg / 6.08 lb
  - Width: 730 mm / 28.74"
  - Height: 68 mm / 2.68"
  - Depth: 124 mm / 4.88"
  - Materials: plastics, metals, electronics, paper
  - Repairability: fret, end-caps, drivers, PCBAs
  - Wall mount: yes, wall grommets included
  - Box contents: Heston 60 TV soundbar, 2 wall mount grommets, logo and UI panel, mains lead, HDMI cable, quick start guide and legal and safety information
  - Compatible app: Marshall app
