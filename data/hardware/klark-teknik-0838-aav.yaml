url: https://www.klarkteknik.com/en/products/0838-AAV
description: The MIC BOOSTER CT 1 is a compact gain booster for dynamic and
  passive ribbon microphones, adding up to +25 dB and powered by 48 V phantom
  power. At 24 x 25 x 78 mm it can connect directly to most microphones and
  sends a strong, clear signal on to a mixer, preamp or interface.
details: |-
  Where a dynamic microphone sounds right but the mixer or interface has to work hard to bring it up, the CT 1 adds up to +25 dB of gain to a dynamic or passive ribbon microphone signal and sends a strong, clear signal on to the mixer, preamp or interface.

  At 24 x 25 x 78 mm and 0.1 kg, the CT 1 is small enough to connect directly to most microphones. Balanced XLR goes in and balanced XLR comes out, and power comes from 48 V phantom power on the mixer or other receiving equipment.

  Phantom power cannot pass through to condenser microphones, so condensers should not be used with a mic booster. After connecting, the gain on the receiving channel needs checking, because the signal will be much greater than typical mic levels.
specs: |-
  - Up to +25 dB of gain
  - For dynamic and passive ribbon microphones
  - Balanced XLR input and balanced XLR output
  - Powered by 48 V phantom power from the mixer or receiving equipment
  - Does not pass phantom power through, so not suitable for condenser microphones
  - Dimensions: 24 x 25 x 78 mm
  - Weight: 0.1 kg
