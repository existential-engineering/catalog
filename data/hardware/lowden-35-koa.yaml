description: A Lowden 35 Series acoustic guitar with Koa back and sides, famed
  for a bright, focussed tone that warms and sweetens as the instrument matures.
details: |-
  Famed for its bright, focussed initial tone, Koa develops into a warmer, sweeter, and more resonant sound as the instrument matures. Boasting a strong mid-range, enhanced top-end, and enviable sustain, Koa complements the inherent tonal characteristics of the instrument.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Koa back and sides can be paired with Sitka Spruce or Alpine Spruce soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Koa
  - Soundboard options: Sitka Spruce, Alpine Spruce
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
