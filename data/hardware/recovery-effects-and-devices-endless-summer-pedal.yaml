details: |-
  ENDLESS SUMMER PEDAL

  (Real Spring Reverb Booster)

  The Endless Summer is an all-analog, real spring reverb in pedal form. It features a boost allowing you to make things gritty, or go full-on over-the-top fuzzy and psychedelic. Simply put, it's the coolest sounding and most unique reverb available! Start with the balance all the way to the left to get a splashy reverb with a slight "buffered" boost. 9 o'clock grits it up and boosts your amp. Things get crazy at 12 o'clock! Dial in the color and depth with the brightness control. And yes, it has a real spring reverb tank inside! Designed and assembled in Seattle, Washington. O perates on a standard 9Vdc Boss-style power supply (not included). Endless Summer manual

  Enclosure size: 5.625" x 4.625" x 1.563"

