  30 years after their launch, an icon of the Zildjian cymbal family returns to the lineup. The reimagined Z Custom series delivers powerfully explosive, bright, and cutting sounds for drummers to unleash their sound across metal, punk, hard rock and more. A revised design enhances the musicality, feel, and durability of these legendary cymbals. Featuring a brilliant finish and the classic star pattern of the original Z Custom, they look as good as they sound. The signature Z Custom sound cuts through any mix, delivering bold tones for limitless musical expression.
