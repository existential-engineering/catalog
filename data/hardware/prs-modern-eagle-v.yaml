details: |-
  “Modern Eagle models have always been built to stand up to history while celebrating tonewoods and the discovery of new tones. The Modern Eagle V is a sophisticated instrument not only in its craftsmanship but in its electronic and mechanical design,” said Paul Reed Smith.

  The Modern Eagle V offers highly musical tones for both recording and playing live. A mix of classic and modern, the Modern Eagle V is built on a tried-and-true foundation of a maple top and mahogany back, a 22 fret, 25” scale length, Pattern mahogany neck with rosewood fretboard, bone nut, PRS Phase III Tuners, and the PRS patented Gen III tremolo. Its innovative pickup and electronics configuration puts a wide range of tones at your fingertips.

  Utilizing a hum/single/hum (five-coil) pickup layout and unique electronics configuration, the Modern Eagle V gives players a vast array of tones in one guitar. The 5-way blade switch selects the pickups in intuitive groupings: treble, treble and middle, middle, middle and bass, and bass. There is a single volume and a push/pull tone control that activates both humbuckers when engaged; this allows players to access all three pickups simultaneously. Finally, the dual EQ mini-toggle switches act as tuned high-pass filters when engaged (in the up position), removing shelved low-end and allowing the high frequencies through for more clarity and musical highs.
