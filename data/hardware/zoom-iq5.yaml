details: |-
  The Zoom iQ5 is a high-quality mid-side stereo condenser mic, perfect for recording music and compact enough to be slipped into a pocket. It connects to the Lightning connector of an iPhone, iPad or iPod touch, ready for serious stereo recording any time, any place.

  The mid-side capsule switches between 90 degrees and 120 degrees, or records raw M-S so the stereo width can be set afterwards. Audio is captured at 44.1 kHz or 48 kHz, 16-bit, with input gain from 0 to +40 dB and a maximum input sound pressure of 120 dB SPL.

  A single stereo mini jack serves as a combined headphone and line level output for monitoring. A separate mini-B USB connector exists only to recharge the connected iOS device, which must be powered from the genuine Apple adapter supplied with it. The iPad and iPad mini do not support that function. The iQ5 itself draws its power from the connected iOS device.
specs: |-
  - Microphone: mid-side (M-S) stereo condenser mic, switchable 90 degrees / 120 degrees / M-S raw
  - Output connector: stereo mini jack (combined headphone and line level output)
  - Audio quality: 44.1 kHz/16-bit, 48 kHz/16-bit
  - Input gain: 0 to +40 dB
  - Maximum input sound pressure: 120 dB SPL
  - Connector: Lightning connector
  - USB: mini-B connector, only for recharging the connected iOS device
  - Power: powered by the connected iOS device. The connected iPhone or iPod touch should be powered with the genuine Apple power adapter included with it (iPad and iPad mini do not support this function)
  - Compatible devices: iPhone 5, 5S, 6 and 6 Plus, iPod touch 5th generation, iPad 4th generation, iPad mini
  - Supported OS: iOS 6.0 or newer
  - Dimensions: 58.6 mm (W) x 62.4 mm (D) x 38.5 mm (H)
  - Weight: 30.5 g
