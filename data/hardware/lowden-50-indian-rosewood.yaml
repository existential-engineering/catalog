description: A Lowden 50 Series acoustic guitar with East Indian Rosewood back
  and sides, giving a warm, rich tone, with added clarity when paired with
  Alpine Spruce.
details: |-
  When we receive Indian rosewood from our friends in Bombay we are so grateful that they always select the sets for us to the highest standard possible. We have been purchasing from the same family for 50 years and have absolutely no plans to go elsewhere! The tone from Indian rosewood is warm and rich. If it is paired with Alpine spruce for the top, the tone remains warm but with the added clarity associated with Alpine spruce.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The East Indian Rosewood back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 50 Series
  - Back and sides: East Indian Rosewood
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tonewood grade: Master Grade
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
