description: |-
  Engineered for speed, comfort and full-throttle attitude, the reimagined 5150® Series DX is an iconic blast from the past that blends both throwback and modernized features.

  Like its predecessor, the 5150 DX features a modified Strat®-style basswood body with a deeper upper body curve. The graphite-reinforced bolt-on quartersawn baked maple neck features a comfortable modified "C" profile, hand-rubbed satin urethane back finish, heel-mount truss rod adjustment wheel and "hockey stick" headstock with EVH® logo decal. Built for smooth and speedy playability, the 12"-16" compound radius baked maple fingerboard has 22 jumbo frets and black dot inlays.

  While the famed striped original had a single humbucking bridge pickup only, the all-new 5150 is outfitted with an HH pickup configuration controlled by a three-way toggle switch on the upper bout. The custom designed EVH® Wolfgang® Alnico 2 humbucking bridge pickup delivers the perfect amount of punch and articulation with sweet sustain and thick chunky rhythms in a perfectly balanced EQ curve. The EVH Wolfgang Alnico 2 humbucker neck pickup serves up no-nonsense, balls to the wall overdrive and endless sustain without skimping on articulate cleans when the volume is rolled down. A custom designed low friction volume knob creates even-volume tapering for the smoothest volume swells, while the high friction tone knob will stay in place even if accidentally bumped. An added new feature comes in the way of a lower bout kill switch, allowing you to mute your guitar for those stutter, rhythmic effects - think "You Really Got Me."

  Decked out with a "dive-bomb" certified EVH-branded top-mount Floyd Rose® bridge, the locking tailpiece features fine tuners for each string and a patented EVH D-Tuna® for switching back and forth from drop-D to standard tuning in an instant.
