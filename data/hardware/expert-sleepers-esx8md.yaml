details: |-
  The ESX-8MD is an expansion module for the ES-4, ES-40 or ES-5, adding eight MIDI/DINsync outputs from one expansion header.

  The ES-4/5 Controller software, part of Expert Sleepers Silent Way, allows the ESX-8MD outputs to be used for MIDI output. That is not just MIDI clock output, but an actual MIDI port capable of sending any MIDI message. Since these outputs are driven from an audio connection, they have sample-accurate timing, which no USB MIDI interface can claim.

  The Silent Way Sync plug-in would typically be used to send DINsync to the ESX-8MD, though any software capable of addressing the expansion headers of the ES-4 or ES-5, via Silent Way or the Expert Sleepers Max/MSP external, can send clock pulses to it.

  From December 2014 the ESX-8MD ships in a revised mk2 form. Functionally the mk2 is equivalent to the mk1, but MIDI output is now guaranteed at all sample rates for all receiving devices, where the mk1 was incompatible with some devices when running at 44.1kHz.

  The ESX-8MD requires software in order to operate, and the only such software is Expert Sleepers Silent Way plus the Max/MSP external, with MIDI functionality available only via Silent Way. Silent Way comes in AudioUnit, VST and AAX formats for Mac OS X and Windows, so it needs a compatible host application, and a Silent Way licence is not included with the module.
specs: |-
  - Panel width: 10HP
  - Module depth: 27mm
  - Digital input: connection from an ES-4, ES-40 or ES-5 module
  - Outputs: 8 5-pin DIN sockets, wired for both MIDI and DINsync
  - Each channel wired individually for MIDI (8 simultaneous outputs)
  - Channels wired in pairs for DINsync (4 simultaneous outputs, each duplicated on two sockets)
  - Indicators: 1 LED per channel indicating activity
  - Current draw: 23mA on the +12V rail, 0mA on the -12V rail
  - Power connector: Doepfer standard 10 way IDC, with -12V furthest from the top of the board
  - Front panel drilled for both Doepfer and Analogue Systems mounting holes
