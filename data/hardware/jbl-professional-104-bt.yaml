details: |-
  The JBL 104-BT is a compact desktop reference monitor system featuring a coaxial driver design with a 4.5-inch (118 mm) low-frequency driver and a 0.75-inch (19 mm) soft-dome tweeter. The coaxial configuration places the tweeter at the acoustic center of the woofer, delivering time-aligned, point-source audio reproduction ideal for critical listening in small spaces.

  A 60-watt Class D amplifier (30W per speaker) powers the pair, housed entirely within the host monitor unit. The electronics in the host monitor drive the passive extension monitor via a proprietary cable connection. The desktop-optimized acoustic design includes a contoured ABS molded cabinet with a low-frequency port, delivering a frequency response of 60 Hz to 20 kHz (±3 dB).

  Bluetooth 5.0 streaming is built in, allowing wireless audio from phones, tablets, and computers. A front-panel source selector switches between Bluetooth, 3.5 mm aux, RCA, and balanced TRS inputs, and a front-panel volume knob controls output level. A front-panel 3.5 mm headphone output mutes the speakers automatically when headphones are connected.

  Multiple analog input types are accommodated on the host monitor's rear panel: two balanced 1/4-inch TRS inputs at +4 dBu, two RCA inputs at -10 dBV, and a single 1/8-inch stereo mini input at -10 dBV. The unit accepts universal AC power (100–240 VAC, 50/60 Hz) and draws up to 85 watts.

  The 104-BT received a Red Dot Product Design Award and is available in black (104-BT) or white (104-BTW). Each speaker measures 9.72 x 6.02 x 4.88 inches (247 x 153 x 124 mm), with the host unit weighing 4.54 lb (2.06 kg) and the extension unit weighing 3.81 lb (1.73 kg).
specs: |-
  - LF Driver: 4.5 in (118 mm) coaxial
  - HF Driver: 0.75 in (19 mm) soft dome
  - Crossover: 1725 Hz, 1st order
  - Power Amplifier: 60 W Class D (30 W per speaker)
  - Frequency Response: 60 Hz – 20 kHz (±3 dB)
  - Maximum SPL: 104 dB momentary peak at 1 m
  - Maximum Continuous SPL: 89 dB
  - Signal-to-Noise Ratio: 75 dBA (A-weighted)
  - Coverage Angle: 120° x 60°
  - Sensitivity: 87 dB / 1 m
  - Bluetooth: 5.0
  - Enclosure: Ported ABS with metal grille
  - AC Input: 100–240 VAC (±10%), 50/60 Hz
  - Dimensions (H x W x D): 9.72 x 6.02 x 4.88 in (247 x 153 x 124 mm)
  - Weight – Host: 4.54 lb (2.06 kg)
  - Weight – Extension: 3.81 lb (1.73 kg)
