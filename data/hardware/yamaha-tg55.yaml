description: >-
  The Yamaha TG55 is a 1U rack-mount tone generator built around Yamaha's AWM2 sample playback technology, offering
  16-voice polyphony, 16-part multitimbral operation, and 74 high-quality 16-bit waveforms in a compact module.
details: |-
  The TG55 marked an important shift for Yamaha, representing one of their first synthesizer modules to employ AWM2 (Advanced Wave Memory 2nd generation) sample playback as its primary sound generation method rather than FM synthesis. This placed it in the growing PCM rompler category of the late 1980s and early 1990s.

  The sound engine draws from 2MB of ROM containing 74 waveforms sampled at 16-bit depth: 50 acoustic instruments, 16 drum sounds, and 8 digital waveforms recorded at 32 or 48kHz sample rates. Voices can be constructed with 1, 2, or 4 elements, allowing layering for richer timbres. Two cascaded digital resonant filters provide tonal shaping, with the first offering switchable high-pass or low-pass modes and the second dedicated to low-pass filtering.

  Each element gets its own LFO for amplitude, pitch, or filter modulation, plus three five-stage envelopes for detailed dynamic control. The onboard effects processor offers 34 programmable algorithms including eight reverb types, delay, stereo panning delay, gating, and distortion. Memory holds 64 preset and 64 user patches alongside 16 preset and 16 user performances.

  While the factory presets carry the typical character of early 1990s rompler sounds, the TG55 is considered underrated for its ability to produce lush ambient pads and atmospheric textures when programmed beyond the presets. Expansion card slots allow the waveform and data libraries to be extended further.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 16 parts
  - AWM2 (16-bit sample playback) synthesis
  - 74 waveforms in 2MB ROM (50 acoustic, 16 drum, 8 digital)
  - 1, 2, or 4 element voice architecture
  - 2 cascaded digital resonant filters (12dB/oct each)
  - Filter 1: switchable high-pass/low-pass
  - Filter 2: low-pass only
  - 1 LFO per element (amplitude, pitch, or filter modulation)
  - 3 envelope generators per element (5-stage)
  - 34 programmable digital effects (8 reverb types, delay, panning, gate, distortion)
  - 64 ROM presets, 64 user patches
  - 16 ROM performances, 16 user performances
  - MIDI In/Out/Thru
  - Waveform and data expansion card slots
  - 1U rack-mount format
releaseDate: "1989"
