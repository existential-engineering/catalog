description: >-
  The rack-mount version of Alesis's QuadraSynth, delivering 64-voice polyphony and 16MB of
  sample ROM with 16-part multitimbral capability and QuadraVerb-based effects processing.
details: |-
  The Alesis S4 distilled the QuadraSynth keyboard's capabilities into a compact rack format. With 64-voice polyphony and 16MB of 48kHz linear sample ROM (expandable to 24MB), it offered substantial sonic resources for studio and live use in the mid-1990s.

  The synthesis engine employs digital additive and subtractive sample playback, drawing on a broad library of acoustic and electronic sounds spread across 128 preset and 128 user programs. A mix mode allows layering and splitting across 100 preset and 100 user configurations, all addressable over 16 MIDI channels for full multitimbral operation.

  Four onboard effects based on the respected QuadraVerb 2 processor provide reverbs, delays, modulation, and other treatments without the need for external gear. The ADAT optical digital interface was a forward-thinking inclusion, integrating smoothly with Alesis's own multitrack recording ecosystem, while a PCMCIA card slot enabled convenient patch and sample storage.

  An updated S4 Plus model arrived in 1995 with an expanded 20MB ROM (expandable to 28MB), adding more sounds to an already generous palette. Both versions represent strong value for producers seeking a versatile digital sound module.
specs: |-
  - Polyphony: 64 voices
  - Sound source: 48kHz linear PCM samples
  - ROM: 16MB (expandable to 24MB); S4 Plus: 20MB (expandable to 28MB)
  - Multitimbral: 16 parts
  - Effects: 4 onboard (QuadraVerb 2 based)
  - Memory: 128 preset / 128 user programs; 100 preset / 100 user mixes
  - Outputs: 4 audio outputs, ADAT optical digital interface
  - Expansion: PCMCIA card slot
  - Control: MIDI IN/OUT/THRU (16 channels)
releaseDate: "1993"
