description: MULTB is a Eurorack module that functions as a quad 1-to-3 buffered
  multiple, taking four inputs and buffering each to three identical unity-gain
  outputs. This prevents the attenuation and crosstalk that can occur when using
  passive stacking cables instead of a buffered multiple.
details: |-
  MULTB, aka the YRGB Mult, is a Quad 1-to-3 Video Rate Buffered Multiple. Inputs are buffered to provide three identical unity gain outputs per. Using a buffered multiple instead of stackable cables prevents unwanted attenuation as well as potential crosstalk from modules without input buffers. Input switches are cascaded downward, so using just the first input will provide a user with twelve identical unity gain outputs. Inputs are terminated with a 100Kohm resistor and each output has a series resistance of 499ohms. Two versions are available for Assembled modules. One is 8HP and the other is 6HP. The 6HP version is assembled with surface mount components and is not as deep as the 8HP version. The full dimensions are below:

  Dimensions:

  8HP

  6HP

  41mm deep

  32mm deep

  Current Draw:

  11 mA +12V

  11 mA -12V

  0 mA +5V

  BOM & Build Guide
