details: |-
  Add a Silvertone Gray Gigbag for just $35 with this guitar — discount applied at checkout. Out There

  Originally offered in 1959 through 1962, the Silvertone 1423 was manufactured by the Harmony factory in Chicago . This version was known as the Jupiter H49. Pretty space age, eh? While Silvertone didn't use this name, collectors often refer to the 1423 as a "Jupiter." The highlight of this Reissue is the unique "blender control" control setup. In addition to separate volume and tone controls for each pickup, the guitar features a "blend" knob that alters the balance between the two pickups when the selector is in the middle position creating an almost 'Wah pedal' tone when dialed back and forth. Specs

  1423 Electric Solid Body

  Hardware

  Neck

  Pickups and Controls

  ~features~

  Upgraded Pickups

  The 1423 features D uncan-Design upgraded pickups that capture the tone of the originals. Upgraded Hardware

  The original 1423 had less-than-modern hardware. The Reissue has a fully adjustable bridge for accurate intonation and a die-cast tailpiece

  Improved Playability

  Neck shapes and fret jobs were inconsistent on the original 1423. The Reissue features a comfortable (and consistent) C-shaped neck with a precise and well-finished fret job. The neck also features a two-way truss rod for accurate and dependable adjustment.
