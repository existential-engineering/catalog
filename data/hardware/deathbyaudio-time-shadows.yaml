description: It's About Time. Get it here! This three-mode, space-time warping
  delay is like nothing you've heard before.
details: |-
  The Time Shadows II is a three-mode, space-time warping delay spanning sub-octave echoes, multi-delay washes, and pitch-shifted repeats, with customizable presets, expression control, and a formerly-secret third algorithm for even more extreme delay-bending sounds. Built by Death By Audio's Oliver Ackermann and EarthQuaker Devices' Jamie Stillman, it offers a universe of ambient and explosive tones.

  The EarthQuaker Devices side is a pitch-morphed fuzz delay filter that blows out the input with digital distortion, blends in a polyphonic sub octave, feeds it into a delay, and spits it into a highly resonant envelope-controlled lowpass filter. The Death By Audio side is a multi-delay filter that ranges from icy shimmers to cosmic caves of bouncing repeats, and the middle position is an energy beam that pushes repeats toward the heavens while diving deep. A user-assignable expression jack and six preset slots let you save and recall favorite settings. A limited Cyberpunk Edition, designed by Oliver Ackermann in a white-on-black package and limited to 500 units, is available exclusively at Reverb.

  The MODE SWITCH selects the EQD, DBA, or secret "!¡" setting, each changing how the other controls behave. TIME sets the delay time, SPAN sets the intensity of repetition, and FILTER controls a filter envelope and gate on the EQD side, filter frequency and delay-line shift on the DBA side, and the mix in the middle position. The SAVE/RECALL switch toggles between green Live Mode, where the controls operate as set, and red Preset Mode, where stored settings are recalled from the preset selector. Any TRS expression pedal can be assigned to Time, Span, or Filter (shipping mapped to Span), and the EXP jack also accepts 0 to 3.3v control voltage. Flexi-Switch Technology provides relay-based true bypass supporting both momentary and latching switching, and holding the footswitch while active engages the selected preset.
specs: |-
