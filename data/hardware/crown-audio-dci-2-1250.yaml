description: Two-channel, 1250W @ 4Ω Analog Power Amplifier with 70V/100V
  constant voltage capability. A professional installation amplifier using
  DriveCore technology, designed for high-performance installed sound
  applications with versatile, compact design and energy efficiency.
details: |-
  The DCi 2|1250 is a member of the DriveCore Install Analog series, providing professional installation amplifiers with proprietary DriveCore technology. The 2-channel format delivers 1250W per channel into 4Ω in a compact 2RU chassis.

  The amplifier offers direct drive constant voltage (70V or 100V rms) output without a step-up transformer, and channel-independent Hi-Z/Low-Z selection lets each output drive anything from 1–2 speakers to hundreds in high-Z mode. Channel pairs are bridgeable, even in 100V rms mode.

  Integration is supported via a remote on/off interface, internal cooling fans maximize airflow while minimizing noise, and an advanced Power Factor Correction (PFC) universal power supply ensures efficient operation across worldwide mains conditions.
specs: |-
  - Output Channels: 2
  - Output Power (4Ω, Stereo Mode): 1250W
  - Frequency Response (8Ω, 20Hz–20kHz): ±0.25dB
  - Total Harmonic Distortion (full rated power): 0.35%
  - Damping Factor (20Hz–100Hz): >1500
  - Load Impedance (Stereo): 2Ω–16Ω; 70/100Vrms
  - Load Impedance (Bridge Mono): 4Ω–16Ω; 140/200Vrms
  - Cooling: Forced air, front-to-back airflow
  - Max Fan Noise: 47 dBA SPL @ 1M
  - AC Mains: 100V–240V ~ 50/60Hz (±10%)
  - Power Connector: 15A IEC
  - Dimensions: 483 × 89 × 362 mm (19″ × 3.5″ × 14.25″)
  - Weight: 10.66 kg (23.5 lbs)
