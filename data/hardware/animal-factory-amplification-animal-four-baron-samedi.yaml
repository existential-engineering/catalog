details: |-
  This product is no longer available from us. You can still order the last few units from our retailers in the EU and Perfect Circuit in the US. The enormous quantities of rum consumed during the development process of this idiosyncratic fuzz pedal have paid off well. Steeped in voodoo mystique, playful and chaotic, obscene and disruptive all at once, the Baron will oversee the life and death of your sound. Respect him, for what you give is what you get! Full demo on guitar:

  Taking a Moog Minitaur to the afterlife:

  The AFA Baron Samedi Fuzz derives on the legendary Jordan Bosstone circuit, but sounds nothing like one. Additional gain and a very strange tone control add more aggression, fullness and bite to the sound. The interactivity of the top three knobs make this a raucous pedal that yields an entire variety of sounds, from a great vintage fuzz tone to synthier sounds with faux-portamento decay. Don't just take our word for it though - here's a video from harmonic hellraiser BLUSH RESPONSE using the Baron Samedi pedal... ...and one from Juan Alderete and Nick Reinhart, holding its own against some esteemed pedal company!
