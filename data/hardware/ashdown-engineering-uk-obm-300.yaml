description: UK-built, ultra-compact 300-watt bass head finished in Ice Blue.
  Lightweight and punchy, it features a responsive 5-band EQ, classic Pre-Shape
  circuit, DI output, FX Loop, and auto-voltage for worldwide use. A clean,
  dependable amp designed for bassists who want great tone in an extremely
  portable format.
details: |-
  The Ashdown UK-OBM-300 is a UK-built bass head created for musicians who need reliable performance and great tone in an ultra-portable package. Drawing on the proven OriginAL EVO platform and finished in bold Ice Blue, it delivers 300 watts of clean, controlled output for rehearsals, smaller stages, studio work, and lightweight touring. A responsive 5-band EQ offers clear control across the frequency spectrum, while the classic Pre-Shape switch applies a voiced contour that enhances low-end impact and high-frequency clarity. It is equipped with a clean DI output for live sound and recording, an FX Loop for external pedals, and auto-voltage operation for reliable performance worldwide.
specs: |-
  - Power output: 300 Watts
  - Power requirements: 115-230 Volts
  - Impedance: minimum 4 Ohms
  - Speaker outputs: 2 x jack outputs
  - Frequency response: -3dB @ 22Hz and 25kHz
  - Signal to noise: better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Distortion: less than 0.5% THD
  - H x W x D: 89 x 220 x 209 mm
  - Net weight: 1.8 kg
