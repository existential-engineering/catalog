details: |-
  The KO-ALS, or Knock-Out ALS, is a limited run distortion pedal based on the Keeley Stahlhammer, announced in August 2014 as a charity release for Project ALS. The run was limited to 100 units, each hand signed by Robert Keeley, and the design is a collaboration between Robert Keeley and Peter Gusmano.

  Controls are Distortion, Level, Bass, Mids and Treble, covering heavy distortion with a full three band EQ. Circuit modifications add a dual EQ system: a side-mounted switch changes the EQ contour between a Fender-style and a Marshall-style response.

  The pedal is hand-built in the USA in a powder-coated enclosure with true bypass switching, and carries a two year limited warranty.
specs: |-
  - Controls: Distortion, Level, Bass, Mids, Treble
  - Dual EQ system, side-mounted switch selecting a Fender-style or Marshall-style contour
  - Based on the Keeley Stahlhammer distortion circuit
  - True bypass switching
  - Powder-coated enclosure
  - Hand-built in the USA
  - Two year limited warranty
  - Limited run of 100 units, each hand signed
