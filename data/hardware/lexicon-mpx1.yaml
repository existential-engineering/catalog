url: https://lexiconpro.com/en-US/products/mpx1
description: Discontinued Lexicon 2-in/2-out multi-effects processor using
  Multiple Processor FX technology with 56 effect types and 200 preset programs.
specs: |-
  - 2-in/2-out stereo multi-effects processor
  - Multiple Processor FX technology with interactive front panel
  - Stereo reverb plus up to 4 additional stereo effects simultaneously
  - 56 effect types, 200 preset programs
  - S/PDIF coaxial digital I/O (24-bit, 44.1 kHz)
  - Frequency Response: 20 Hz - 20 kHz +/- 1 dB
  - THD: 0.01% (20 Hz - 20 kHz)
  - Dynamic Range: >95 dB (D/A), >90 dB (A/D)
  - Crosstalk: -60 dB
  - 1U rack-mount: 19"W x 1.75"H x 9"D, 6.125 lbs (2.8 kg)
  - Universal power: 100-240V AC, 50-60 Hz, 25 W
