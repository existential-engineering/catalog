description: >-
  The Roland System 700 was a flagship professional modular analog synthesizer produced
  from 1976 to 1982, designed to compete directly with large-format Moog and ARP modular
  systems. Its main console featured three VCOs, two VCFs, two VCAs, two LFOs, and
  integrated effects, with five optional expansion blocks for extensive customization.
  Notable users include Vangelis, Hans Zimmer, Vince Clarke, and Aphex Twin.
details: |-
  The System 700 was Roland's most ambitious analog synthesizer, representing the company's entry into the professional large-format modular market during the mid-1970s. It consisted of a main console, a 61-note keyboard controller (the 701A), and five optional expansion blocks that allowed musicians to build a system tailored to their specific needs.

    The main console alone provided a comprehensive synthesis voice with three voltage-controlled oscillators offering sine, triangle, sawtooth, and rectangle waveforms with pulse width modulation. Two voltage-controlled filters, two VCAs, two LFOs, and two ADSR envelope generators formed the core signal path. Additional integrated modules included a ring modulator, sample-and-hold circuit, envelope follower, noise source, mixer, spring reverb, phase shifter, and voltage-controlled panning.

    The five expansion blocks significantly extended the system's capabilities. These included additional sequencing (a 3x12 step sequencer in Block 3), extra oscillator banks (six more VCOs in Block 4), filter and VCA banks (Block 5), mixing and interface modules, and audio processing options including a two-channel audio delay. Extensive internal patching for common signal routings reduced setup time compared to fully modular competitors.

    A complete System 700 setup cost approximately $18,000, making it one of the most expensive synthesizers of its era. Roland also offered a more affordable Laboratory System 700 variant priced between $3,500 and $4,000. The instrument found its way into studios of legendary artists including Vangelis, Hans Zimmer, Vince Clarke, Aphex Twin, the Human League, and Richard Barbieri.
specs: |-
  - Polyphony: Monophonic
    - Oscillators: 3 VCOs (main console), up to 9 with Block 4 expansion
    - Waveforms: Sine, triangle, sawtooth, rectangle with PWM
    - Filters: 2 VCFs with 12dB and 24dB configurations
    - Amplifiers: 2 VCAs (main), up to 5 with Block 5 expansion
    - LFOs: 2 with rate and delay control
    - Envelopes: 2 ADSR generators (main console)
    - Keyboard: 701A 61-note, 5-octave controller with portamento and pitch bend
    - Sequencer: 3x12 step (Block 3, optional)
    - Effects: Spring reverb, phase shifter, voltage-controlled panning, 2-channel audio delay
    - Additional Modules: Ring modulator, sample-and-hold, envelope follower, noise source
    - Year Produced: 1976-1982
    - Original Price (Full System): ~$18,000
    - Original Price (Laboratory Version): $3,500-$4,000
