  Tour Series

  The Silvertone Tour Series guitars are built for the touring and gigging professional. With a solid Engelmann spruce top and mahogany back and sides, these guitars will deliver great tone at an affordable price. All models feature a modern neck taper for added comfort. This acoustic electric version includes the high-performance Fishman Clearwave 60 EQ/preamp with built-in tuner. At a stadium or theater, a place of worship or a local night club, the Silvertone Tour Series acoustics are ready for your next performance!
