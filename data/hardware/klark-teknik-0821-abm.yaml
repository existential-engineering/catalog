description: The DN330 is a single-channel, 30-band preset graphic equaliser
  designed for engineers who want fine-grained spectral control over a mono
  signal path. With one third-octave ISO-spaced fader for every critical
  frequency from sub-bass to air, it offers the resolution required for room
  correction, monitor tuning and front-of-house refinement.
details: |-
  The DN330's third-octave resolution follows the ISO standard that has defined professional graphic equalisation for half a century. Each band's preset Q is set to the value Klark Teknik's engineers determined gave the most musical, least phase-disruptive response, a decision settled by years of listening tests.

  The DN330 was designed and built at the Kidderminster facility, where the discipline of British studio engineering shapes every product carrying the Klark Teknik name. Although this model is now obsolete, units in continued use on tours and in installations remain trusted because they were built to behave the same way on the thousandth night as on the first.

  Whether ringing out a wedge, taming a feedback-prone PA or shaping a broadcast mix, the DN330 served as a single-channel companion for over a generation. Its legacy continues in the current DN-series lineup.
specs: |-
  - Single-channel preset graphic equaliser
  - 30 bands at one third-octave ISO-spaced centre frequencies
  - Preset Q per band
