name: "4pre"
manufacturer: motu
primaryCategory: audio-interface
categories:
  - midi-controller
  - midi-interface
url: https://motu.com/en-us/products/audio-interfaces/
description: The 4pre packs four mic inputs into a small half-rack form factor,
  along with additional professional-grade audio connections.
details: |-
  You can record and mix vocals plus guitar for two musicians simultaneously. Or
  mic a drum kit with overheads and close-ups. Or record lead and background
  vocals in one take.
specs: |-
  - 24-bit converters
  - Sample rates - 44.1, 48, 88.2, 96khz
  - Analog in - 4 x XLR/TRS combo
  - 2 x 1/4" TRS phone (balanced/unbalanced)
  - 2 x 1/4" hi-z guitar
  - Analog outputs - 2 x 1/4" balanced TRS main out
  - 2 x 1/4" balanced TRS line out
  - 2 x 1/4" TRS headphone
  - Digital input - 1 x rca coaxial s/pdif
  - Digital output - 1 x rca coaxial s/pdif
  - Computer I/O - 1 x firewire 400 (type b)
  - 1 x USB 2.0
  - Sync in/out s/pdif
  - Smpte time code (ltc)
  - Headphone output 2 x 1/4" TRS phone with independent volume control
  - Phantom power individual +48v
  - Front panel - 2 x 10-segment ladder LEDs main outs
  - 4 x 5-segment LEDs inputs
  - 2 x signal present LEDs s/pdif I/O
  - 2 x signal present LEDs stereo line out
  - 4 x LEDs 48v phantom power
  - 4 x LEDs -20 dB pad
  - 5 x LEDs mix/trim (main, line, s/pdif, phone, trim)
  - 1 x LED vol/pan
  - Power requirements 9-18v dc, 5w, tip + or -
  - Firewire bus power
  - Dc power adapter included
