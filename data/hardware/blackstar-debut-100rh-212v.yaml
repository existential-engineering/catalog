url: https://blackstaramps.com/debut-100rh-212v/
description: Affordable, compact and amazing sounding practice amps for the
  beginner. The Debut 100RH is a 100-watt solid-state guitar amplifier head with
  MOSFET preamp, paired with the matching 2x12 Debut 212V cabinet.
details: |-
  Take your playing from bedroom jams to stage performances with the Debut 100RH head and 212V cabinet. Built for guitarists ready to gig, this 100-watt solid-state powerhouse delivers pro-level tone without the premium price tag.

  Forget complicated digital menus — the Debut 100RH is all about pure tone. Whether you're jamming, rehearsing, or hitting the stage for the first time, this amp gives you the warm, responsive feel of a valve amp thanks to Blackstar's MOSFET technology.

  The Debut 100RH builds on the highly praised MOSFET preamp from the Debut 50R, capturing the character and dynamics of a valve amp — without the weight, fragility, or upkeep. Two footswitchable channels deliver pristine cleans modelled on Blackstar's award-winning valve amps and an Overdrive channel modelled on the St. James 6L6 that covers everything from blues to metal.

  A patented ISF (Infinite Shape Feature) control sweeps from American tight/aggressive tones to British woody/smoother tones, and onboard Plate and Hall reverbs add studio-quality depth. Power reduction from 100W down to 5W lets you play at stage or bedroom volumes without losing tone, and a speaker-emulated headphone/line output enables silent practice and direct recording.

  The matching Debut 212V is a mono vertical 2x12" open-back extension cabinet loaded with Blackstar Anthem 50 speakers, rated at 100 watts with selectable 4 Ohm or 16 Ohm inputs. Available in vintage cream with oxblood fret or black with 'biscuit' basketweave.
specs: |-
  - 100W solid-state head with MOSFET preamp
  - 2 footswitchable channels: Clean and Overdrive
  - Patented ISF (Infinite Shape Feature) tone control
  - Power reduction from 100W to 5W
  - Onboard reverb with Plate and Hall settings
  - Series effects loop
  - Line In for jamming or listening to music
  - Speaker-emulated Line Out for silent practice or recording
  - Headphone output with Line In playback
  - 1x16 Ohm / 1x8 Ohm speaker outputs
  - Dual footswitch control for channel switching and reverb enable/disable (footswitch sold separately)
  - Head controls: Clean Volume, Clean Bright switch, Overdrive switch, Overdrive Gain, Overdrive Volume, Bass, Middle, Treble, ISF, Reverb switch, Reverb level, Power reduction
  - Head weight: 7.08 kg
  - Head dimensions: 465 x 216 x 220 mm
  - 212V cabinet: 2x12" Blackstar Anthem 50 speakers, open back, 100W
  - 212V cabinet: 4 Ohm or 16 Ohm inputs
  - 212V cabinet weight: 17.84 kg
  - 212V cabinet dimensions: 501 x 718 x 293 mm
  - Available finishes: Black with basketweave grille, Vintage Cream with oxblood grille
