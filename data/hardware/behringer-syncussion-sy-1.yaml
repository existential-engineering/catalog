description: Dual analog percussion synthesizer reproducing the circuitry of the
  classic 1970s Pearl Syncussion SY-1, with six oscillator modes covering single
  oscillator, FM, dual oscillator mix, dynamic oscillator mix, FM/noise mix and
  pure noise. The main module can be transferred into a standard Eurorack case.
details: |-
  Experience the legendary sound and feel of a classic analog percussion synth with the Behringer SYNCUSSION SY-1. Based on the classic dual analog percussion synthesizer from the '70s, the original has been used by legendary artists such as Prince, Kraftwerk, and Herbie Hancock.

  The SY-1 offers six oscillator modes, each with a different character and timbre. You can choose from single oscillator, FM, dual oscillator mix, dynamic oscillator mix, FM/noise mix, and pure noise. Each mode can be shaped by adjusting the tune, decay, and filter cutoff controls. This allows you to create a wide range of percussive sounds and effects, from deep kicks and snappy snares to metallic clangs and sci-fi zaps. The SY-1 can also be triggered using drum pads, a drum machine like the Behringer RD-8 or any other external triggers.

  Movement and dynamics are important in creating exciting rhythms, which is why the SY-1 also features a pitch sweep function, which lets you create dramatic pitch dives and rises with speed, range, and up/down controls to create special effects and transitions. Additionally, the SY-1 has an LFO with square and triangle waves, which can modulate the pitch or the filter for unique vibrato effects.

  The SY-1 is designed to fit into a standard Eurorack case and can be integrated with other modules to expand its sonic possibilities or be placed alongside other instruments for a truly unique setup. Just connect the power cables to the power supply and mount the module using the included screws.
specs: |-
  - Dual analog percussion synthesizer, authentic reproduction of the original Pearl Syncussion SY-1 circuitry
  - 6 oscillator modes: single oscillator, FM, dual oscillator mix, dynamic oscillator mix, FM/noise mix, pure noise
  - Tune, decay and filter cutoff controls per voice
  - Pitch sweep with speed, range and up/down controls
  - LFO with square and triangle waves, routable to pitch or filter
  - Sample and hold for random pitch changes with each hit
  - 30 controls for direct real-time access to all important parameters
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - Eurorack format: main module can be transferred to a standard Eurorack case, where it is bus-powered from the case power supply via the supplied power cable
  - Editable with the SynthTribe app (Windows and macOS)
