description: Hi-fi stereo delay with BBD, Tape and digital modes.
details: |-
  The Erica Synths Black Stereo Delay 2 is a hi-fi stereo delay with a lot of unique features, based on a custom Erica Synths DSP engine. Tape, BBD and digital delay emulations with three modes each, every one of them accompanied by delay time, feedback, tone and stereo spread controls, allow extremely delicate effects to be designed. CV control over various parameters and storage for up to 10 presets make this module an integral part of a performance rack.

  The module runs on new Erica Synths DSP hardware, and the delay effects are developed in collaboration with the Dutch company 112dB.

  Erica Black Series include high-end, unique functionality and superior quality modules. Only the best, highest-quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Black Series consist of a range of modules that are needed to put together an entire synth.

  Maximum audio input level before clipping is 16Vptp and the CV input range spans -5V to +5V. Sampling runs at 48kHz and 24bit with delay times from 3ms to 3000ms, and the module occupies 12HP at a depth of 35mm.
specs: |-
  - Tape, BBD and digital delay types
  - Three modes for each type
  - Tap and clock synchronization of delay time
  - 10 preset patches
  - CV control over delay time, feedback, tone and preset selection
  - Adjustable stereo delay spread
  - Max audio input level before clipping 16Vptp
  - CV input range (full span) -5V to +5V
  - Sampling frequency 48kHz, 24bit
  - Delay time 3 to 3000ms
  - Audio codecs -108 dynamic range, -98dB THD+N
  - Power consumption 120mA@+12V, 39mA@-12V
  - Module width 12HP
  - Module depth 35mm
