name: MF5 Deluxe-V
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf5-deluxe-v/
description: The MF5 Deluxe-V is the flagship F-style mandolin, produced in very
  limited numbers with elaborate hand-etched inlays, multiple black/white
  purflings, and carefully selected tonewoods. It features Waverly tuners with
  pearl buttons, a custom hand-engraved tailpiece, and an ultra-thin high gloss
  alkyd resin varnish finish.
details: |-
  The MF5 Deluxe-V is the top-of-the-line F-style mandolin, built with an Adirondack spruce top and Eastern flamed maple back, sides, and neck. It features ivoroid binding with black/white top and side purfling throughout the body, fingerboard, and peghead, along with elaborate hand-etched inlays and a deluxe flourish peghead inlay. The ebony fingerboard has MOP dot inlays and a compound radius of 5 1/2" to 11 5/8", with a 1 1/8" nut width and 1 9/16" string spacing. Hardware includes Waverly tuners with pearl buttons and the original tailpiece with custom hand engraving. An ivoroid-bound ebony pickguard adds refinement. The instrument is finished in high gloss alkyd resin varnish and ships with D'Addario EJ74 strings and a deluxe hardshell case. Custom options are available including alternate finishes, tonewoods, and hardware.
specs: |-
  - Construction: F-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Ivoroid with b/w top and side purfling
  - Fingerboard Binding: Ivoroid with b/w top and side purfling
  - Peghead Binding: Ivoroid with b/w top and side purfling
  - Bracing: Tone bars
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo and deluxe flourish
  - Tuners: Nickel Waverly with pearl buttons
  - Pickguard: Ebony with ivoroid binding
  - Tailpiece: Original tailpiece with custom hand engraving
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: High gloss alkyd resin varnish
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
