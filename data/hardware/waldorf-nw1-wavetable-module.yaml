description: >-
  The Waldorf NW1 is a Eurorack wavetable synthesis module featuring a Nave-inspired sound
  engine. It offers 80 classic wavetables, 10 user-editable tables, and 50 text-to-speech
  wavetables, with 8-voice polyphony and 2 oscillators. A free editor and the ability to
  create wavetables from text, samples, or incoming audio make it a versatile module for
  modular systems.
details: |-
  The NW1 utilizes a Nave-inspired wavetable engine providing access to a vast library of tonal possibilities. Users can create custom wavetables directly from text input, imported samples, or incoming audio signals. The module includes a free editor for advanced sound creation, making it flexible for both quick tweaks and deep synthesis exploration.

  The module features a spacious layout with a solid powder-coated metal faceplate and a large red wavetable dial on the right side of the front panel. A prominent display shows active wavetables during playback or input signal levels during recording mode.

  The front panel includes dedicated sections for tuning with an octave range toggle, modulation parameters, spectrum and brilliance control, and keytrack and noisiness adjustment. The module supports both gate inputs and 1V/Oct CV inputs with trim control for comprehensive integration into larger modular systems, along with USB connectivity featuring galvanic isolation.
specs: |-
  - 8-voice polyphony
  - 2 oscillators
  - Wavetable synthesis engine
  - 80 classic wavetables, 10 user-editable, 50 text-to-speech tables
  - Gate input
  - 1V/Oct CV input with trim
  - 3 additional CV inputs for modulation and wavetable recording
  - Audio output
  - USB with galvanic isolation
  - Eurorack power connector
  - Powder-coated metal faceplate
