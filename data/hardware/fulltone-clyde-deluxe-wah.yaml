description: A deluxe wah pedal with a three-way mode switch and variable input
  control pot for a wide range of wah voicings, built with a hand-wound Fulltone
  inductor and long-life wah pot.
details: |-
  As a thank you for the nearly two-year out-of-stock wait, we're bringing the Clyde Deluxe back in a limited Gold finish for this first restock—same build and tone, with no price increase for the premium colorway. Each unit includes a Certificate of Authenticity and is serialized 1–300 . The Deluxe version of the CLYDE wah has all the features that players have come to know and love about the original "CLYDE Standard" but with the following additions:

  The three-way mode switch and variable input control pot will let you dial in almost any type of wah sound you can imagine. All the way from classic Voodoo Chile... to biting funk... to down and dirty low-end grunt. The CLYDE Deluxe can do it all! All CLYDE Deluxes sport the most authentic '60's Vox type inductor available, which happens also the quietest... our hand-wound Fulltone inductor and the long-life Fulltone-1 wah pot. Here's a great video of Robin Trower ripping it up on a Fulltone CLYDE wah.
specs: |-
  - Comes with the a custom-wound Fulltone pot...the most accurate (in resistance AND taper) reproduction of the vintage ICAR used in certain VOX wahs of the 60's and early 70's.
  - Variable Input Level Control
  - True-Bypass w/ bright side-viewable low current Pilot light status indicator
  - 3 selectable modes: - Wacked
  - Jimi" (Clyde Standard)
  - Shaft
