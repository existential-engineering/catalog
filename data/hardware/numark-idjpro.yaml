description: iDJ Pro Professional DJ Controller for iPad
details: |-
  iDJ Pro is a professional DJ controller that expands the iPad's interface, seamlessly integrating with Algoriddim's djay app for iPad (sold separately) to form a complete DJ experience. The unit features a brushed-aluminum casing and is equipped with capacitive touch-sensitive turntables, large die-cast aluminum volume knobs, hot cues, looping, pitch, and effect controls.

  The iPad slides into a dual-turntable layout and is held by a latching door for secure, seamless integration. Once docked, the DJ has access to both the iPad's touchscreen and dedicated hardware controls. Algoriddim's djay 2 app integrates with Spotify and the iTunes library, giving instant access to local tracks plus 20 million songs from Spotify, with dedicated effects controls for transitions and mixes.

  Thanks to the iPad's wireless capability, the system can also stream wirelessly via AirPlay and Bluetooth to external speakers. iDJ Pro includes professional connectivity: balanced XLR master outputs, RCA outputs, RCA inputs, a 1/4-inch microphone input for MC duties, and dual headphone jacks (1/8-inch and 1/4-inch) supporting collaborative DJing.

  iDJ Pro is Lightning-adapter ready and works with Apple's 30-pin to Lightning adapter (sold separately), supporting 2nd, 3rd, 4th, and 5th generation iPad models (iPad 1 is not supported). The unit is Core MIDI-compatible and integrates with Algoriddim's vjay app for video mixing (sold separately).
