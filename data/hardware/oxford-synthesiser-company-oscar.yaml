description: >-
  The OSCar is a monophonic analog synthesizer produced by the Oxford Synthesiser Company
  from 1983 to 1986. It features dual digitally controlled oscillators with analog
  filters, additive synthesis capabilities, and a built-in sequencer packed into a compact
  37-key keyboard.
details: |-
  The OSCar arrived in 1983 from British manufacturer Oxford Synthesiser Company and distinguished itself as a notably advanced programmable monosynth for its era. Its sound originates from dual digitally controlled oscillators offering sawtooth, triangle, square, variable-pulse, and modulated-pulse waveforms. Beyond standard analog tones, the synthesizer features an innovative additive-synthesis capability enabling users to create custom waveforms by mixing amplitudes of 24 harmonics via the keyboard, with up to 24 custom waves storable in memory.

  The filter section represents the real analog heart of the instrument. It contains two 12dB/octave filters linkable for 24dB/octave configuration, with switchable lowpass, highpass, and bandpass modes. Each filter includes dedicated ADSR envelope control alongside frequency cutoff and resonance parameters, with LFO modulation capabilities. The LFO itself offers triangle, sawtooth, square, and additional waveforms, capable of modulating amplitude, pitch, or pulse-width, plus sample-and-hold functionality.

  A built-in sequencer grants duophonic capability, allowing sequences on one oscillator while the keyboard simultaneously controls the other voice. The sequencer stores 24 sequences. Post-1984 MIDI models introduced 36 programmable memory patches assigned to keyboard keys, while earlier models featured 12 preset and 24 user patches. MIDI support enabled synchronization with external gear and offline patch storage via MIDI dumping.

  Notable users include Hardfloor, Orbital, Ozric Tentacles, BT, Jean-Michel Jarre, Asia, Ultravox, Stevie Wonder, Sneaker Pimps, Keith Emerson, and Underworld.
specs: |-
  - Polyphony: Monophonic (Duophonic via sequencer)
  - Oscillators: 2 DCOs with sawtooth, triangle, square, variable-pulse, and modulated-pulse waveforms
  - Digital Waveforms: 5 preset digital waveforms
  - Custom Waveforms: 24 storable additive-synthesis waveforms (24 harmonics each)
  - LFO: Square, triangle, sawtooth waveforms with sample-and-hold
  - Filters: Two 12dB/octave analog filters (linkable to 24dB/octave); lowpass, bandpass, highpass modes
  - Envelopes: 2 ADSR (filter and amplifier)
  - Keyboard: 37 keys
  - Memory: Pre-MIDI: 12 user + 24 preset patches; MIDI models: 36 programmable patches
  - Sequencer: 24 sequences
  - Control: Trigger input; MIDI on later models
  - Production Years: 1983-1986
