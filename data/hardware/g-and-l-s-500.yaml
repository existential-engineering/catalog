details: |-
  The G&L S•500 debuted in 1982 as Leo's own evolution of the traditional double-cutaway bolt-on axe, delivering innovations including the Dual-Fulcrum vibrato and Magnetic Field Design single-coil pickups, each designed by Leo Fender himself. These MFD pickups deliver a bright and sparkly top end and robust bottom end, all without losing midrange focus.

  There is plenty of punch in the MFD pickups, but what's surprising is how glassy and detailed they become as the volume and bass controls are rolled back, the latter a part of the S•500's PTB (Passive Treble and Bass) system which functions on all three pickups. What's more, the G&L Tribute Series S•500 includes a push-pull Expander Switch on the treble pot to allow neck+bridge or all three pickups together. In a pinch, the neck+bridge combo does a convincing faux ASAT Special.

  The new G&L Tribute Series S•500 features one of Leo's favorite pairings: the power of MFD pickups mellowed by the high porosity of a nato body. Making the most of this combo is Leo's Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  Leo's forward-looking spirit is clearly reflected in the S•500, a guitar he designed for players who share that spirit, at a price within reach of every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Poplar, Poplar with Swamp Ash Top, Nato
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), push/pull expander on treble pot enabling additional pickup combinations of neck+bridge or all three pickups together
  - Available in: Irish Ale over Nato body, Tortoise pickguard, Rosewood fingerboard
  - Available in: Sonic Blue over Poplar, 3-ply White pickguard, Rosewood fingerboard
  - Available in: Blueburst over Swamp Ash top on Poplar, Pearloid pickguard, Maple fingerboard
