details: |-
  The John Myung artist series Bongo is crafted to John's exacting specifications to be sleek, ultra-modern, and perfectly designed. The instrument represents a collaboration spanning more than a decade between John and the Ernie Ball Music Man engineering team, with design goals centered on enhanced comfort, playability, and performance for the most demanding players.

  A compact and balanced basswood body is paired with a roasted maple neck featuring a 5-string nut width for tighter string spacing, along with a combination rosewood and roasted maple fretboard in an elegant golden ratio aesthetic. The 5-bolt sculpted neck joint and custom artist series neck plate provide solid feel and access to all 24 high-profile, wide frets.

  Dual humbucking pickups with neodymium magnets and stealth black sealed covers deliver a powerful, modern voice. A simplified control layout with pre-specified EQ keeps the workflow focused: a volume knob that doubles as an on/off kill switch, and a 5-way rotary knob for pickup blend.
specs: |-
  - Body wood: Basswood
  - Body finish: High gloss polyester
  - Body colors: Black, Midnight Blue, Sunset Orange, Platinum Silver
  - Body dimensions: 12-3/4" wide, 1-5/8" thick, 47-5/8" long
  - Neck wood: Roasted maple
  - Neck finish: Oil and wax
  - Neck width: 1-3/4" at nut, 2-13/16" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Rosewood and roasted maple (divided wood)
  - Fret markers: White half-moon inlay
  - Frets: 24 high-profile wide
  - Headstock size: 9-3/4" long
  - Scale length: 34"
  - Pickups: Dual humbucking with neodymium magnets
  - Controls: Volume on/off; 5-way rotary pickup blend
  - Bridge: Music Man chrome-plated with stainless steel saddles
  - Pickguard: Black
  - Tuning machines: Custom Music Man lightweight with tapered posts
  - Electronic shielding: Graphite acrylic resin coated cavity; aluminum control cover
  - Strings: 32w-45w-65w-80w-100w-130w (Cobalt Bass)
