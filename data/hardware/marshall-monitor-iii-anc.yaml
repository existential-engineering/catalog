description: Focus on your music with over-ear headphones complete with active
  noise cancellation. Fully adjustable, with hours of wireless playtime.
details: |-
  Hit play and fully immerse yourself in thunderous bass and screaming highs with this addition to the Marshall headphone line-up. Created with enhanced active noise cancelling technology and all-day listening in mind, these headphones let you block out unwanted sounds in complete comfort. Enjoy hours and hours of your favourite music, from the first track to the final drumbeat.

  70 hours of playtime with ANC and 100 hours without: the extended wireless playtime keeps the music going for days without a recharge, and 15 minutes of charging gives 12 hours of playtime. Active noise cancelling continuously measures ambient noise to block out unwanted sounds, and Transparency mode lets the outside world back in.

  Marshall signature sound: Dynamic Loudness adjusts the treble, mids and bass for the most optimal sound at every volume. Adaptive Loudness goes further, using a digital signal processing algorithm that monitors the audio and the background noise and adjusts tonal balance and dynamics to keep bass, mids and treble natural and audible in any environment.

  Soundstage spatial audio separates the spatial content of stereo recordings and uses psychoacoustic cues and room acoustics to move the music out of your head and onto a virtual stage around you, with two sliders in the app to tune the effect.

  Controls and design: the multidirectional control knob covers play, pause, skip, volume, power, Bluetooth pairing and calls, while the customisable M-button reaches Spotify Tap, Soundstage or two equaliser settings of your choice, or a phone voice assistant. The frame is rugged and folds into a premium hard case, and the headphones are Bluetooth LE Audio-ready for Auracast audio sharing. Marshall also offers authorised repair services and spare parts for Monitor III A.N.C. through its website. Designed and engineered in Sweden. Made in China.
