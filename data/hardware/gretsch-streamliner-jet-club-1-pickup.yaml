  The Streamliner Jet Club 1 Pickup is a no-nonsense tone machine loaded with exciting new features to deliver exceptional performance, easy playability and rock-solid tuning stability at an incredible value.

  A single HotWire high-output ceramic humbucker drives the tone, paired with master volume and tone controls. The mahogany body features a belly contour and rounded heel for comfort, a Fast 'C' mahogany neck with Pitch-Perfect head angle keeps tuning stable, and a compensated wraparound bridge and GraphTech NuBone nut round out the package.
