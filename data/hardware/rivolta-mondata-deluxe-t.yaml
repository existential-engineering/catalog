description: An offset electric guitar with a lightweight Simarouba body, raised
  center-block, roasted maple neck, a JM style bridge with a custom Rivolta
  tremolo tailpiece, and two Rivolta Custom JM-style pickups.
details: |-
  Revolution, Redefined. Updated for 2024, the new Rivolta Mondata Deluxe T has been re-designed from the ground up by world renowned luthier & designer Dennis Fano ( Novo Guitars ). The Rivolta Mondata Deluxe T features an ultra lightweight Simarouba solid body with a refined raised center-block, 1-piece set Roasted Maple neck with a satin finish for improved comfort and playability, hand rolled Ebony fretboard with our new oval Pearloid inlays, 24 medium jumbo frets, JM style bridge & custom Rivolta tremolo for smooth vibrations and classic offset string resonance. Under the hood, the Rivolta Mondata Deluxe features our new Rivolta Custom JM style pickups in the neck and bridge positions. The simple, single vol/tone controls are complimented by 2 x pickguard mounted toggle on/off switches for each pickup.
specs: |-
  - Body Wood - Lightweight Simarouba with raised center block
  - Neck Wood - Set 1pc Roasted Maple
  - Fretboard Wood - Bound Ebony with rolled edges
  - Inlays - Pearloid/MOTO Oval
  - Side Dots - Black
  - Scale - 25"
  - Nut Width - 1.687"
  - Neck Width @ 12th Fret - 2.050"
  - Neck Carve Shape - Chunky C+
  - Neck Depth @ 1st Fret - .850"
  - Neck Depth @ 12th Fret - .990"
  - Fretboard Radius - 10"
  - Frets - 24 Medium Jumbo
  - Pickups - Neck - Rivolta Custom JM style (6.5K ohm) / Bridge - Rivolta Custom JM style (7.5k ohm)
  - Wiring - Vol, Tone & 2 x Slider Switches - Bridge On/Off, Neck On/Off
  - Hardware - Nickel
  - Bridge - Adjustable JM style (10mm String Spacing)
  - Tailpiece - Custom Nickel-plated Rivolta Tremolo
  - Tuners - Wilkinson vintage style with Nickel buttons
  - Knobs - Black reflector with Silver cap
  - Nut Material - Bone
  - Pickguard/Truss cover - Plexi
  - Strings - 10-46
  - Body Finish - Gloss
  - Headstock Finish - Gloss
