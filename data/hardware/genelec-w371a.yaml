url: https://www.genelec.com/w371a
description: "An absolute revelation in low frequency performance. With the
  W371A, you can finally wave goodbye to the detrimental influences of your room
  on LF reproduction."
details: |-
  The W371A is a Smart Active Monitoring (SAM) adaptive woofer system designed to complement Genelec's 8300-series and "The Ones" coaxial monitors, extending low-frequency reproduction down to 23 Hz while actively managing the way the room influences bass response. It pairs a Ø356 mm cone bass driver with a Ø305 mm cone bass driver, each driven by a 400 W Class D amplifier, to deliver a peak SPL of at least 123 dB.

  Rather than acting as a conventional subwoofer, the W371A is calibrated as part of a full-range system through Genelec Loudspeaker Manager (GLM) software, which requires either the 9320A SAM Reference Controller or the GLM Calibration Kit. Genelec technologies including Intelligent Signal Sensing (ISS), the Laminar Integrated Port (LIP), active crossovers and room response compensation work together to minimise the detrimental influence of the room on bass reproduction.

  The W371A targets mastering, music production, film, drama and post-production, and research applications. It won a 2021 TEC Award for Technical Achievement in the Studio Monitor category. Each unit ships with a 1.8 m mains cable, a 5 m RJ45 control cable, an operating manual, The Ones brochure, and eight cable-management clips with sixteen screws, and is covered by a 2-year parts-and-labour warranty extendable to 5 years with free registration.
specs: |-
  - Frequency Response: 23 Hz - 500 Hz (-6 dB)
  - Frequency Response Accuracy: ± 3 dB
  - Peak SPL: ≥123 dB
  - Short Term Max SPL: ≥120 dB
  - Self Generated Noise: ≤15 dB SPL (A-weighted)
  - Amplifier Power: 2 x 400 W (Class D)
  - Drivers: Ø 356 mm cone bass; Ø 305 mm cone bass
  - Dimensions: H 1108 x W 400 x D 400 mm
  - Weight: 61 kg (134.5 lb)
  - Mains Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption (ISS Active): ≤2 W
  - Power Consumption (Idle): ≤40 W
  - Power Consumption (Full Output): 600 W
