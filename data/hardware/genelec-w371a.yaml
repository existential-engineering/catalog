name: W371A SAM Woofer System
manufacturer: genelec
primaryCategory: studio-monitor
categories:
  - subwoofer
  - immersive
url: https://www.genelec.com/w371a
description: "An absolute revelation in low frequency performance. With the
  W371A, you can finally wave goodbye to the detrimental influences of your room
  on LF reproduction."
details: |-
  series: SAM (Smart Active Monitoring)

  subtype: Adaptive Woofer System

  drivers: Ø 356 mm cone bass + Ø 305 mm cone bass

  amplifierType: Class D

  amplifierPower: 2 x 400 W bass

  calibration: GLM (Genelec Loudspeaker Manager) calibration support; requires 9320A SAM Reference Controller or GLM Calibration Kit

  technologies: ["Smart Active Monitoring (SAM)", "Intelligent Signal Sensing (ISS)", "Laminar Integrated Port (LIP)", "Active crossovers", "Room response compensation"]

  applications: ["Mastering", "Music studio", "Film, drama & post-production", "Research"]

  awards: ["2021 TEC Award Winner - Technical Achievement, Studio Monitor"]

  warranty: 2 years parts-and-labour (extendable to 5 years with free registration)

  packageContents: ["1x W371A woofer system", "1x mains cable (1.8 m)", "1x RJ45 cable (5 m)", "1x operating manual", "1x The Ones brochure", "8x cable management clips + 16x screws"]
specs: |-
  - Frequency Response: 23 Hz - 500 Hz (-6 dB)
  - Frequency Response Accuracy: ± 3 dB
  - Spl_Peak: ≥123 dB
  - Spl_Short Term Max: ≥120 dB
  - Self Generated Noise: ≤15 dB SPL (A-weighted)
  - Amplifier Power: 2 x 400 W (Class D)
  - Drivers: Ø 356 mm cone bass; Ø 305 mm cone bass
  - Dimensions: H 1108 x W 400 x D 400 mm
  - Weight: 61 kg (134.5 lb)
  - Mains Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption_Iss Active: ≤2 W
  - Power Consumption_Idle: ≤40 W
  - Power Consumption_Full Output: 600 W
