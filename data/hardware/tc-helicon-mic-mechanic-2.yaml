url: https://www.tchelicon.com/en/products/0726-aae
description: Vocal stompbox that combines studio reverb and echo presets with
  pitch correction and an Adaptive Tone engine for EQ, compression, gating and
  de-essing. One footswitch activates the effect, and holding it banks through
  the presets.
details: |-
  The Mic Mechanic 2 addresses the problems that appear between a microphone and a PA system. It removes hum, sibilance and rumble, applies gentle pitch correction so notes land in tune, and finishes the signal with studio-grade reverb and echo presets that are usable without adjustment.

  An on-board Adaptive Tone engine analyses the incoming voice in real time and adjusts EQ, compression, gating and de-essing to suit the microphone in use and the room it is used in. The intent is a present, polished vocal with no manual tweaking.

  The pedal carries one XLR input and one XLR output, with true bypass and 48V phantom power for condenser microphones. A single footswitch activates the effect, and holding that switch banks through the available effects.
specs: |-
  - Studio reverb and echo presets
  - Pitch correction
  - Adaptive Tone engine with EQ, compression, gating and de-essing
  - Hum, sibilance and rumble removal
  - 48V phantom power on the XLR microphone input
  - True bypass
  - Single footswitch, press to activate and hold to bank through effects
  - Battery powered, no DC supply stated on the product page
