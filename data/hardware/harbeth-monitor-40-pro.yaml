details: |-
  The three-way Harbeth M40 Reference Monitor family has produced thousands of hours of network radio, TV and post production over twenty years. It is the latest generation and has been substantially re-engineered for higher efficiency, lower distortion, lower coloration and far better dispersion than its 1970s two-way predecessors. The brilliantly transparent Harbeth RADIAL midrange driver works in its own sealed cabinet, isolated from the high pressure bass unit. The overall sound is fresh, clean, clear and totally fatigue-free. Performers are placed accurately and naturally in 3D space.

  As with all members of the Harbeth Monitor 20/30/40 family, projects started on one speaker can be reworked on others with complete confidence thanks to a common design philosophy and resulting sonic presentation. The last word in sonic accuracy is indeed the Monitor 40.2, available in professional matt grey or a range of veneer options.

  Harbeth's Monitor 40.2s are at the heart of mainstream TV production. They are in daily use at the British Library's National Sound Archive for forensic audio restoration.
specs: |-
  - Technical features: 3-way vented, 300mm Harbeth bass unit, 200mm RADIAL2 mid, 25mm ferro-cooled soft dome tweeter
  - Midrange driver works in its own sealed cabinet, isolated from the bass unit
  - Frequency response: 35Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6-8 ohms, easy to drive
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: from 100W/channel is recommended for high dynamic material
  - Power handling: 650W programme
  - Dimensions: 750 x 432 x 388 mm
  - Connectors: SpeakON 2-pole socket (or binding posts)
  - Weight: 37.8kg each (without packing)
  - Space needs: LF optimised for use away from reflective surfaces
  - Stands: optimally to bring ears level with tweeters (tweeter 440mm up from cabinet base)
  - Packing: single speaker per shipping carton
  - Grille colour: black
