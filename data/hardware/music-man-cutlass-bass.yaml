description: >-
  The Cutlass Bass — part of the Modern Classic line — is a passive 4-string
  bass with vintage tone and modern appointments. Features include an old-school
  split-coil humbucking design, a 'C'-shaped maple neck, an alder body (ash on
  Classic Natural), an oversized headstock with a 3+1 tuner arrangement, and a
  hardened steel top-loading bridge.
details: |-
  The Cutlass Bass is part of the Modern Classic line of Ernie Ball Music Man instruments. This passive 4-string bass pairs rich, vintage tone with streamlined modern appointments for comfort and playability.

  The Cutlass features an old-school split-coil humbucking design for big, round bottom-end tone, a comfortable 'C'-shaped neck carve, and a lightweight contoured alder body. The top-loading bridge is hardened steel and complemented by a newly designed oversized headstock with the familiar 3+1 tuner arrangement.

  A sleek, modern bass with vintage features that stays true to its Music Man heritage.
specs: |-
  - Body wood: Alder (Ash on Classic Natural)
  - Body finish: High gloss polyester
  - Body colors: Black, White, Diamond Blue, Heritage Tobacco Burst
  - Body dimensions: 13-7/16" wide, 1-5/8" thick, 45-3/8" long
  - Neck wood: Select maple
  - Neck finish: Ultra-light satin polyurethane (natural aged yellow)
  - Neck width: 1-5/8" at nut, 2-15/32" at last fret
  - Neck radius: 7.5"
  - Neck attachment: 5-bolt sculpted joint
  - Headstock length: 9" (3+1 tuner arrangement)
  - Fingerboard: Select maple or rosewood
  - Fret markers: 5/16" black or white dots
  - Frets: 21 high-profile, narrow-width
  - Scale length: 34"
  - Pickup: Music Man offset humbucking (split-coil design)
  - Electronics: Passive 250k volume and tone with 0.022uF tone cap
  - Bridge: Vintage Music Man top-loaded chrome-plated steel with nickel-plated hollow steel saddles
  - Tuning machines: Schaller BM with tapered string posts
  - Pickguard: Shell (Heritage Tobacco Burst); Parchment (Diamond Blue); Black (Black); Mint (White)
  - Strings: 45w-65w-80w-100w (Super Slinky Bass #2834)
