description: "- Single Note Synth Fuzz - Reverse Attack / Swell - Bandpass Filter Control"
details: |-
  The Synth-1 is a guitar-triggered, single-note wave generator that produces fuzzed-out synth waves. The Filter control shapes the tone of the wave, the Attack knob sets the lead-in time or swell of the note, and the Blend control sets how much of the natural guitar tone remains alongside the synth wave. Sounds range from churning slow-gear reverse swells to sharp sustained tones.

  A Wave Selector footswitch changes wave modes while playing and a Chaos switch alters the triggering and octave behaviour, which is where the pedal's more unpredictable glitching and pseudo-harmonic counterpoint comes from. A side-mounted expression jack takes TRS control of the Filter, giving the pedal wah-like movement from an expression pedal.

  Jacks are top mounted, the pedal is true bypass, and it is designed and made in the USA.
