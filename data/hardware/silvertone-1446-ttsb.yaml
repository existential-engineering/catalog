details: |-
  Available Soon! Hauntingly Familiar... Silvertone 1446 Semi-Hollow Electric Guitar

  Silvertone proudly reintroduces the iconic 1446 - a legendary semi-hollow electric guitar with a rich history and unmistakable tone. Originally sold through the Sears catalog from 1961 to 1967, the 1446T has become a favorite among recording artists and collectors for its unique sound and classic style. The 1446 TBK in a Tobacco Sunburst finish features a chambered center-block maple body that enhances sustain, reduces feedback, and broadens the guitar's dynamic range—perfectly suited for today's stages and studios. Its 24 ¾" scale mahogany neck is redesigned with a comfortable modern soft-C taper, paired with a rosewood fingerboard fitted with advanced Semi-Hemispherical frets for a smooth, fast playing experience. Distinguishing this model is its classic 'Trapeze' tailpiece combined with a Tune-o-matic style bridge, offering solid tuning stability and a vintage aesthetic. At the core of the 1446's signature tone are the Wilkinson "R Series" mini-humbucker pickups. These pickups are exact, era-specific recreations inspired by the rare original P19 pickups designed by Seth Lover. Crafted with custom tooling, period-correct Alnico V magnets, and carefully matched winding, they deliver the warmth, clarity, and harmonic richness that define the 1446 sound. Blending vintage heritage with modern refinements, the Silvertone 1446 is ready to inspire musicians in both the studio and on stage.
specs: |-
  - Single-cutaway chambered arched maple body with center block construction
  - Wilkinson 'R-Series' Original Spec Mini humbucking pickups
  - 24 ¾" Scale soft "C" shaped mahogany neck
  - 12"-radius rosewood fingerboard with pearloid block inlays
  - 20 Silvertone 'Easy Feel' ball end frets
  - Electronics: Two Volume and two tone controls with a 3 way lever switch
  - Vintage spec "Cupcake" control knobs
  - Single ply cream pickguard
  - Chrome hardware
  - Color: Tobacco Sunburst
