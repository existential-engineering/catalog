description: A world of high-quality studio effects in one rack space.
specs: |-
  - 512 preset effect programs (16 effects x 2 banks x 16 patterns, 32 effects in all)
  - Bank A: Hall, Room, Plate, Vocal, Ambience, Orche., Session, Studio, Percus., Drums, Solo, Gate, Power, Reverse, Delay, Echo
  - Bank B: Chorus, Flanger, Pitch, Tremolo, ZNR, Cho+Rev, Fla+Rev, Pit+Rev, Cho/Rev, Fla/Rev, Pit/Rev, Trem/Rev, Cho/Echo, Fla/Echo, Pit/Echo, Trem/Echo
  - Pattern 1 of every effect is a demo setting and patterns 2 to 16 vary reverb time, gate time, modulation rate or depth
  - Reverb times from 0.5 to 9.0 seconds depending on the type, with diffusion, attack, pre-delay, high cut, high damp and density parameters
  - Delay up to 740 ms with cross-feedback between L and R, plus a fully discrete two-channel echo
  - Pitch shifter with a range of up to one octave up or down, shifted along the major scale, with a detune pattern
  - ZNR Zoom noise reduction with separate L and R depth
  - Compound effects marked with a slash can be used in series or in parallel, and an external effect can be inserted between the two stages
  - Front-panel input, mix (100% dry to 100% effect) and output controls, EQ high and low on the effect signal, EDIT 1 and EDIT 2 parameter knobs, effect selector, bank A/B switch and pattern selector
  - A/D conversion: 2 channels, 16-bit linear, 44.1 kHz, 64-times oversampling
  - D/A conversion: 2 channels, 16-bit, 44.1 kHz
  - True stereo configuration, with the two channels also usable individually
  - Inputs (L/MONO, R): -10 dBm to +4 dBm, input impedance 7 kilohms mono and 14 kilohms stereo
  - Outputs (L, R): -10 dBm to +4 dBm, output impedance 330 ohms
  - A guitar, electric bass or microphone needs a preamp or a mixer with an integrated preamp ahead of the input
  - EFFECT OFF jack for the optional FS01 foot switch, which flashes the front LED orange when effects are bypassed
  - 482 (W) x 44 (H) x 115 (D) mm, 1.4 kg
  - DC 9V 200 mA from the supplied AC adapter, which powers the unit on as soon as it is plugged in
