description: Professional mastering-grade equalizer featuring a 100% analog
  signal path with passive and parametric filters, digital touchscreen control,
  and DAW automation integration.
details: |-
  The Bettermaker Mastering Equalizer (MEQ) is a professional-grade analog equalizer designed for mastering applications. It features a 100% analog signal path combining passive equalizer circuits with parametric filters, controlled via a 5-inch capacitive touchscreen with backlit display and four encoders with push-button control.

  The unit supports stereo, dual-mono, and mid/side operation modes, making it highly flexible for mastering workflows. It stores up to 399 presets with total recall capability and A/B comparison, and integrates with DAW environments via USB for full automation and parameter recall.

  The equalization section includes a stereo high-pass filter (12/24 dB/oct, 10-240 Hz), four fully parametric filters with variable Q from 0.2 to 7, a stereo passive equalizer with air bands at 20 kHz and 28 kHz, and a low-pass filter (12 dB/oct, 2-38 kHz). A real-time FFT analyzer and peak/RMS metering are built in.

  The MEQ is housed in a 2U rack enclosure, 230mm deep, and operates at 20W maximum power consumption. It carries U.S. Patent No. 10,693,428 B2 for its analog/digital hybrid control architecture.
specs: |-
  - Frequency response: 20 Hz–20 kHz (±0.2 dB)
  - Dynamic range: 102 dB
  - THD+N: 0.03% @ +4 dBu
  - Maximum input/output level: 23 dBu (balanced XLR)
  - High-pass filter: 12/24 dB/oct, 10–240 Hz
  - Four parametric filters with variable Q: 0.2–7
  - Passive air bands: 20 kHz and 28 kHz
  - Low-pass filter: 12 dB/oct, 2–38 kHz
  - 5-inch capacitive touchscreen with backlight
  - 399 preset memory slots with total recall
  - Stereo, dual-mono, and mid/side operation modes
  - Real-time FFT analyzer and peak/RMS metering
  - USB connectivity for DAW automation (Mac/PC)
  - Form factor: 2U rack-mount, 230mm deep
  - Power consumption: 20W max
