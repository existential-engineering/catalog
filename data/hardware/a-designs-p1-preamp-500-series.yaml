description: A 500-Series microphone preamplifier and DI inspired by the
  Pacifica, featuring custom CineMag transformers, discrete Class A circuitry,
  up to 72dB of gain, and a front-panel Hi-Z instrument input. Handmade in the
  USA.
details: |-
  The P-1 delivers stunning sonic detail in a compact 500-series format,
  capturing the magic of its larger sibling, the legendary Pacifica. With a
  deep low end, slightly forward midrange, and extended airy highs, the P-1
  is ideal for producers and engineers who demand clarity, punch, and character
  in every track. Designed with inspiration from iconic Quad Eight and API
  preamps, the P-1 brings vintage vibe with modern fidelity to any 500-series
  rack.

  Custom CineMag transformers, discrete Class A circuitry, and an exceptionally
  wide frequency response work together to produce recordings with remarkable
  depth, punch, and clarity. The P-1's fast transient response makes it
  especially powerful for capturing drum overheads and room ambiance with
  natural shimmer and space.

  The front-panel high-impedance DI is ideal for bass, electric guitar,
  keyboards, synthesizers, and other instruments. The unique DI signal path
  utilizes both custom transformers, producing exceptional depth, punch, and
  harmonic richness.

  With up to 72 dB of clean gain and exceptionally low noise, the P-1 is an
  outstanding choice for ribbon microphones as well as dynamic and condenser
  microphones. Handmade in the USA with a full 1-year warranty.
specs: |-
  - Up to 72 dB of clean gain
  - Custom CineMag transformers
  - Discrete Class A circuitry
  - Front-panel high-impedance direct input (DI)
  - Wide bandwidth with exceptional headroom
  - Low noise performance
  - Fast transient response
  - Transformer-balanced design
  - 500-series module format
  - Handmade in the USA
  - Full 1-year warranty
