description: >-
  Kawai's hybrid wavetable synthesizer combining 32 digital waveforms with analog filters and
  envelopes, bridging the gap between digital precision and analog warmth in a 61-key package.
details: |-
  The Kawai K3 occupies an interesting position in the mid-1980s synthesizer landscape, blending digital wavetable oscillators with analog signal processing. Its 32 digital waveforms include both standard synthesis shapes and samples of acoustic instruments like piano and percussion, providing a diverse tonal starting point.

  What makes the K3 stand out is its ability to combine two waveforms and then route them through analog low-pass resonant and high-pass filters along with analog ADSR envelopes. This hybrid approach warms the digital source material considerably, producing sounds that feel more organic than purely digital instruments of the same era. A programmable digital waveform feature allows users to directly manipulate harmonic content for custom timbres.

  The 61-key keyboard responds to both velocity and aftertouch, and a flexible LFO adds modulation possibilities. Fifty patch memory slots store user programs, and full MIDI implementation connects it to the broader studio environment. A rackmount module version, the K3M, was also available for those who preferred to save keyboard real estate.

  Artists including Jan Hammer and Patrick O'Hearn have made use of the K3, drawn to its unique blend of digital clarity and analog character that remains appealing to collectors and hybrid synth enthusiasts.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 32 digital waveforms (including acoustic samples); programmable digital waveform
  - LFO: Yes
  - Filter: Low-pass resonant with envelope generator; high-pass filter
  - VCA: ADSR envelope
  - Keyboard: 61 keys (velocity and aftertouch)
  - Memory: 50 patches
  - Control: MIDI
