description: A signal booster module with two gain stages that can amplify a
  line-level signal up to modular level, controlled via an illuminated fader.
details: |-
  An old favourite(?) returns ... As one of my 'high turnover' modules (ie. I sell a lot of 'em) the bulk of the assembly is now handled by the board fabricators with the final assembly and testing taking place 'in house'. There are several advantages to this: first, I can take advantage of the fact that parts from the fabricator are very cheap (economies of scale etc.) and second, I spend far less time faffing around with surface-mount components, leaving me to do final fitting of any through-hole parts plus any testing. The module is the same as its predecessors - two gain stages, one fixed at x10 and the other adjustable between nil and x50 via a trimmer on the back side of the board. Overall gain is controlled via the rather funky illuminated Alpha fader. There's more than enough headroom to amplify a line-level signal up to modular level, or to brickwall the living daylights out of whatever you care to put through it. Does exactly what it says on the tin, with minimal fuss. As supplied, I will configure the module with an overall gain of about x40 - I calibrate the module so that an incoming voltage of 100mV will be amplified to around 4V. Just be aware that for large gains, any noise present in the signal will be amplified too. 2HP wide.
