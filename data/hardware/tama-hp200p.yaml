description: The Iron Cobra 200 series was developed using the same design
  principles as the Iron Cobra 900 series, and offers remarkable performance at
  an affordable price. The cam provides a smooth, light feel without sacrificing
  power or speed. Both the HP200P and HP200PTW can be fitted with TAMA's Cobra
  Coil for an even faster footboard return.
details: |-
  Spring Tight: Twisiting springs severely reduce pedal smotthness. Spring Tight, a clever half-moon shaped spring tension rod, keeps the spring from twisting so there's never any loss of power transmission.

  Power Glide: The Iron Cobra 200 series drum pedals' single chain pedals utilize the same offset cam shape as TAMA's best selling Iron Cobra 900 series Power Glide.
