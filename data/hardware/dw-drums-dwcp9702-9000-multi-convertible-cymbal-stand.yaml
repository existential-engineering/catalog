description: This multi-stand is designed to give drummers virtually limitless set-up options.
details: |-
  The 9702 Dual Cymbal Multi-Stand is yet another innovation designed to give drummers virtually limitless set-up options. This versatile stand features a dual ratchet boom with X-Pand quick release, mega-tripod base, heavy duty 1.25″ tubing and toothless tilters.

  With the 9702, less hardware is needed to accomplish the same task while never sacrificing stability.

  It is constructed with a 3/4″ upper tube, 1″ middle tube and 1-1/4″ base tube, and the boom arm features 1/2″ tubing.
specs: |-
  - Ultra-versatile dual cymbal stand
  - Dual ratchet boom with X-Pand quick release
  - Mega-tripod base and heavy duty tubing
  - Toothless tilters offer unsurpassed adjustment options
  - 3/4″ upper tube
  - 1″ middle tube
  - 1-1/4″ base tube
  - 1/2″ boom arm tubing
