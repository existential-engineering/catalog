description: The Microtubes X is a bass distortion pedal that covers the whole
  bass distortion spectrum, from articulate high gain to punchy mild overdrive,
  raw and gnarly fuzz, and everything in between. Split-band processing gives
  absolute control over distortion texture, definition, and size.
details: |-
  The Microtubes X is a bass distortion pedal from Darkglass's Core series. It brings the studio method producers have used for years to cover the whole bass distortion spectrum: from articulate high gain to punchy mild overdrive, raw and gnarly fuzz, and everything in between.

  The pedal addresses a key engineering challenge: achieving punchy, aggressive distortion while keeping a full sound. Attenuating bass before saturation produces tightness but a thin signal, while boosting lows creates unwanted fuzz. Microtubes X splits the signal so each side is handled independently.

  Controls include an adjustable High-pass frequency (100Hz to 1kHz) for the distorted signal, an adjustable Low-pass frequency (50Hz to 500Hz) for blending clean bass back in, a Mix control between the two bands, a Drive control for the high-pass side, an active Mids control (+/-12dB at 500Hz) after the Mix, and a Level control for overall output.

  The pedal runs on a regulated 9V DC adapter with a center-negative plug.
specs: |-
  - Bass distortion pedal with parallel split-band processing
  - High-pass frequency: adjustable cutoff 100Hz to 1kHz for the distorted signal
  - Low-pass frequency: adjustable cutoff 50Hz to 500Hz for clean bass blend
  - Mix control blends low-pass and high-pass signals
  - Drive controls distortion amount for the high-pass side
  - Active Mids control: +/-12dB at 500Hz
  - Level control for overall output volume
  - Dimensions: 75mm W x 111mm L x 43mm H, 250g
  - Power: regulated 9V DC, center-negative, 30mA
