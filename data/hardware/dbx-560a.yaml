description: 500 Series VCA-based compressor/limiter with OverEasy and Hard Knee
  curves from the industry-standard dbx 160A.
details: |-
  The dbx 560A Compressor/Limiter delivers VCA-based compression in the 500 Series format, continuing dbx's legacy of modular processors. It features switch-selectable OverEasy and Hard Knee compression curves from the industry-standard 160A rackmount processor.

  With extensive threshold, ratio, and output control ranges plus true RMS level detection, the 560A provides versatile dynamics processing from subtle vocal smoothing to aggressive peak limiting. Its program-dependent attack and release times deliver natural-sounding results across drums, bass, vocals, and other sources.

  The unit includes 19-segment Input/Output LEDs and 12-segment Gain Reduction LEDs for precise visual feedback. A unique INFINITY+ inverse-compression mode decreases output below unity gain when input exceeds threshold, useful for controlling overbearing vocal passages and runaway mix levels.
specs: |-
  - Switch-selectable OverEasy and Hard Knee compression
  - True RMS level detection
  - INFINITY+ inverse-compression mode
  - 19-segment Input/Output LED metering
  - 12-segment Gain Reduction LEDs
  - Input: Electronically balanced/unbalanced, RF filtered
  - Input Impedance: 40kΩ balanced, 20kΩ unbalanced
  - Maximum Input Level: +22dBu
  - Output: Electronically balanced/unbalanced, RF filtered
  - Output Impedance: 30Ω balanced, 15Ω unbalanced
  - Maximum Output Level: +22dBu
  - Frequency Response: 20 Hz – 20 kHz, +0/-0.5 dB
  - Noise: <-97 dBu, Unweighted (22 Hz – 22 kHz)
  - THD+Noise: <0.005% typical (no compression); <0.07% typical (up to 40 dB compression)
  - Dynamic Range: >119 dB
  - Compression Threshold: -40 dBu to +20 dBu
  - Compression Ratio: 1:1 to ∞:1 through -1:1; 60dB maximum compression
  - Attack Time: Program-dependent (typically 15ms @ 10dB, 5ms @ 20dB, 3ms @ 30dB)
  - Release Time: Program-dependent (typically 8ms @ 1dB, 80ms @ 10dB, 400ms @ 50dB)
  - Power Requirements: +/- 16VDC, 60mA per rail, 1.92 watts
  - Dimensions: 5.25" H x 1.5" W x 6" D
  - Weight: 1.3 lbs
  - Rack Space: 1 Slot (500 Series compatible)
