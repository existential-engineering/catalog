description: >-
  Ludwig's signature sound venting system on a reissued 8x14" Slotted Coliseum
  snare drum, available with a 6mm cast aluminum shell or a 7-ply Classic Maple
  shell in a new 10-lug format.
details: |-
  The signature sound venting system is now offered on a Ludwig metal snare for the first time ever. This re-imagined reissue is a statement piece for drummers who demand nothing less than sheer sonic authority. The 6mm cast aluminum shell delivers unparalleled attack, projection, and control. The Aluminum Slotted Coliseum isn't just a return — it's an evolution, delivering unmatched power, presence, and precision (limited to 100 units worldwide, USA made).

  The Classic Maple model features Ludwig's 7-ply Classic Maple shell in a new 10-lug format not yet offered for Slotted Coliseum models. It allows for much more consistent tuning while boosting the drum's mid-range, producing a more well-rounded sound with enhanced resonance. The Classic Maple model is finished in Poly-Glass lacquer for ultimate shine and durability.
specs: |-
  - Size: 8x14"
  - 10 large twin lugs
  - Die-cast hoops
  - P88 throw off
  - P35 butt plate
  - Remo Ambassador Clear Hazy snare-side head
  - Blue/Olive badge
  - L903XXCA — 6mm cast seamless aluminum shell, Remo Controlled Sound Coated batter, Puresound Super 30 snare wires, USA made, limited to 100 units worldwide
  - L903XX0N — 7-ply Classic Maple shell, Natural Poly-Glass lacquer finish, Remo Coated Ambassador batter
