description: Packed with professional vocal effects, built-in looper, and the
  new Formant Pedal, no matter what style you sing the V6 will take your music
  to the next level.
details: |-
  The V6 is a floor-standing vocal processor built for live performance, with a bank of footswitches for activating effects and recalling patches on stage. A single XLR microphone input with switchable +48 V phantom power feeds three processing sections, Voice, Harmony and Effect, that can run simultaneously, and the result leaves on a balanced XLR output with a switchable ground lift.

  The Voice section offers 12 effect types ranging from Unison and Octave Up/Down to Vocoder, Whistle, Talkbox and Pitch Correct. Key Pitch Correct moves the voice to the nearest pitch within a chosen key, with an ADJUST knob setting how fast the correction is applied for a softer or harsher result, and Chromatic Pitch Correct shifts to the nearest chromatic pitch regardless of key.

  The Harmony section adds up to two backing vocals for three-part harmony, building the intervals from the key selected on the panel, with five harmony types. The Effect section carries 10 studio effects including delay, chorus, reverb, telephone and beatbox, and a built-in compressor plus an Enhancer that works by equalization and de-essing sit in front of them.

  A treadle on the front of the unit is a formant pedal, shifting the formant of the voice in real time for radical changes in vocal character without changing the pitch. A built-in looper records up to 3 minutes 30 seconds, so vocal parts can be overdubbed from the footswitch. The unit ships with 40 preset patches created by professional vocalists and engineers and 100 memory locations for user patches.

  Over USB the V6 is a 2-in/2-out USB 2.0 Full Speed audio interface at 44.1 kHz and 16, 24 or 32-bit, and the same port carries firmware updates and can power the unit. Power otherwise comes from the included AD-16 9 V DC adapter or four AA batteries for about 3.5 hours. The optional SGV-6 shotgun vocal microphone isolates the voice from other instruments on stage, and the optional FP02M expression pedal plugs into the EFFECT CONTROL jack for parameter control.
specs: |-
  - Voice section: 12 types
  - Effect section: 10 types
  - Harmony section: 5 types
  - Number of patch memories: 100, plus 40 preloaded patches
  - Up to three vocal processors can run simultaneously, one each from the Voice, Harmony and Effect sections
  - Looper records up to 3 minutes 30 seconds
  - Sampling frequency: 44.1 kHz
  - A/D conversion: 24-bit 128x oversampling
  - D/A conversion: 24-bit 128x oversampling
  - Signal processing: 32-bit
  - Frequency response: 20 Hz to 20 kHz (+1 dB/-3 dB, 200 kohm load)
  - Display: 2-digit 7-segment LED
  - MIC IN: XLR jack, input gain +3 to +40 dB, maximum input level +4 dBu, input impedance 3 kohms or higher (1 kHz)
  - Phantom power: +48 V, switchable
  - OUTPUT: XLR jack, maximum output level +8 dBu, output impedance 50 ohms (HOT-GND, COLD-GND, 1 kHz) and 100 ohms (HOT-COLD, 1 kHz), switchable ground lift
  - PHONES: stereo mini jack, maximum output level 20 mW + 20 mW (into 32 ohm load)
  - Equivalent input noise (phantom power off): -125 dBu or less (A-weighted, 150 ohm input, +40 dBu input gain)
  - Noise floor (residual noise): -75 dBu
  - Control input: FP02 input
  - USB connector: Micro USB
  - Audio interface operation: 2-in/2-out, USB 2.0 Full Speed, 44.1 kHz, 16/24/32-bit
  - USB port also carries firmware updates and can power the unit. A cable designed only for power disables the other USB functions
  - Power: AC adapter (9 V DC 500 mA, centre negative, Zoom AD-16, included), or 4 AA batteries for about 3.5 hours continuous with alkaline batteries
  - External dimensions: 181 mm (D) x 320 mm (W) x 77 mm (H)
  - Weight: 1.56 kg (excluding batteries)
  - Built-in compressor for optimizing input signal levels
  - Built-in Enhancer for optimizing input signal frequencies via equalization and de-essing
  - Formant Shift pedal for adjusting vocal character in real time without changing pitch
  - In the box: V6-SP Vocal Processor, AD-16 AC Adapter, Quick Guide, Patch Memory List
  - Optional accessories: SGV-6 shotgun vocal microphone, FP02M expression pedal, CBR-16 carrying bag
