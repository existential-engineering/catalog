description: The B32 is a Eurorack controller module with 32 buttons for use
  with a DROID master, well suited for trigger sequencers.
details: |-
  The B32 controller has 32 buttons as you can never have too many buttons. Especially trigger sequencers benefit from this nice button array. The B32 is also a very good match for the M4 motor fader controller , since with the M4 you need buttons for switching fader layers are presets more than pots. Shipping includes a short ribbon cable for connecting the controller to the master or to the previous controller. If you want to place the controller further away from the master, you can purchaser longer ribbon cables here in the shop. You can connect up to 16 controllers to each DROID master . Current Draw : 24 mA +12V | 0 mA -12V | 0 mA 5V

  Width: 10 HP

  Depth : 33 mm

