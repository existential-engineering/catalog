details: |-
  The 20 for 20 series is a line of Keeley Custom Shop finishes. Each of the 20 colourways carries the 20 for 20 insignia and is limited to 20 units, and the page states that once a run is sold it will not be built again. This listing is the Aria in the Black Neon colourway.

  The Aria Compressor Drive combines a compressor and an overdrive in one dual-footswitch pedal. The overdrive is Keeley's most flexible to date, and the compressor carries the tone and blend features of the Compressor Plus. The order of the two halves can be swapped, giving two different drive responses. The overdrive has two modes, soft clipping and a transparent boost to midrange frequencies, while the compressor has a clean blend for mixing dry signal back in and a tone control to brighten the highs.

  Running compression before overdrive reduces idle noise and gives a consistent gain level, while running the compressor after the overdrive gives a warmer, rounder tone with more sustain, so the Aria's order switching covers both. Each half provides enough volume to boost and push an amplifier, and each has its own tone shaping controls.

  The pedal has TRS insert jacks that divide it into two separate units, so other effects can be placed between the compressor and the drive, and it can be connected to a pedal switcher with TRS cables so each side is controlled independently.
