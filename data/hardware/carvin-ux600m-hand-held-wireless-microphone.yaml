  UX1200 Series Frequency List

  The UX600M is the ideal microphone for live music and spoken word presentations. The UX600M microphone is included with UX1200MC systems and is designed to deliver rich vocals with intelligible mids, crisp highs and defined lows. The mic capsule can handle extreme vocal SPL levels and remain clean and transparent. Experience the freedom to move about the stage without the constrains of a wired microphone. Features:

  Frequency Band of 506 MHz - 542 MHz
  Internal shock mount capsule and wind pop filter
  Use up to 14 UX600M channels simultaneously
  Backlit LED Display shows battery life and mute status of belt pack
  LOCK mode to prevent unintentional changes
  Microphone has up to +6dB of boost and -18dB of attenuation for any vocal situation. UX600M Microphone Specifications :

  Frequency Band: 506 MHz - 542 MHz
  Polar Pattern: Unidirectional
  Frequency Response: 50Hz – 16kHz
  RF Output Level : 10mW or 50mW

  Sensitivity Adjust : Yes , -18dB /+12dB (3dB steps)
  Battery : 2x AA
  Dimensions: 10.3"L x 1.97" diameter
  Net Weight : 12.5oz
  Warranty: 90 Days
