details: |-
  The new Nick 13 Outlaw Heart acoustic from Gretsch offers the perfect blend of vintage style and modern playability. Modeled on a vintage Gretsch from Nick's collection but updated with his own flair, it captures his eclectic influences from midcentury roots music to punk – all the territory he traverses both as frontman of Tiger Army and in his Americana solo career.

  Features a solid spruce top, mahogany body with gloss finish, mahogany neck, rosewood fingerboard, Grand Concert body style, 25.25" scale length, spade inlay pattern, bone nut, compensated bridge, and open-gear tuning machines. Equipped with a Fishman PRESYS VT pickup system that lets you plug in for amplified performances while maintaining the guitar's natural acoustic sound.
