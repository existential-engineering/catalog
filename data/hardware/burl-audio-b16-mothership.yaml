url: "https://www.burlaudio.com/products/b16-mothership"
description: "Modular 2U AD/DA converter chassis with 2 daughter card slots and
  a swappable digital motherboard, featuring a BX1 transformer on every ADC
  channel and BOPA4 discrete op-amp on every DAC channel. A compact version of
  the B80 Mothership using the same daughter cards."
details: |-
  The B16 Mothership is a 2U, 2-slot version of Burl Audio's flagship B80 Mothership, bringing the same legendary transformer-based analog sound to a smaller and more portable chassis. It features 2 daughter card slots that accept the full range of B80-compatible cards, including ADC, DAC, AES, and word clock distribution cards.

  Digital connectivity is handled by a swappable Motherboard. Burl Audio offers five options: the BMB1 (DigiLink) with 2 DigiLink ports for direct Pro Tools hookup at 64-channel IO across all sample rates; the BMB2 (MADI) with 2 optical MADI ports supporting 64-channel IO at up to 96 kHz and 32-channel IO at 176.4 k/192 kHz; the BMB3 (Dante) with 2 Ethernet ports supporting 64-channel IO at up to 96 kHz; the BMB4 (SoundGrid) with 1 SoundGrid Ethernet port; and the BMB6 (AES/EBU) with DSUB25 AES/EBU connectivity for 8-channel IO (B16 only).

  The chassis includes 1 BNC word clock input and 2 BNC word clock outputs. A typical configuration is 8 inputs and 8 outputs, but the system can be configured as a 16-input tracking system or a 16-output portable mix rig. Every ADC channel uses a proprietary BX1 transformer, and every DAC channel uses the latest Burl Audio discrete BOPA4 op-amp.
specs: |-
  - 2U main chassis, 2 daughter card slots
  - Internal power supply
  - 1 BNC word clock input
  - 2 BNC word clock outputs
  - Proprietary BX1 input transformer on every ADC channel
  - BOPA4 discrete op-amp on every DAC channel
  - All class-A signal path
  - Typical configuration: 8-in / 8-out (up to 16 channels AD or DA)
  - Swappable Motherboard for digital connectivity
  - Compatible with all B80 Mothership daughter cards
