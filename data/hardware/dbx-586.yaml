description: Dual-channel vacuum tube microphone preamplifier with XLR and 1/4"
  I/O, 48V phantom power, high-pass filter, insert points, and limiter on each
  channel.
details: |-
  The dbx 586 is a dual-channel vacuum tube microphone preamplifier designed for studio recording applications. Both channels provide mic and instrument inputs, 48V phantom power, a low-cut filter, insert points, and a limiter, giving each channel basic channel-strip functionality.

  The tube-based gain path delivers the warm character associated with high-voltage vacuum tube amplification. Notched potentiometers and discrete selectors on the front panel allow precise, repeatable settings. The 586 occupies two rack units and is suitable for stereo recording or simultaneous recording of two independent sources.
