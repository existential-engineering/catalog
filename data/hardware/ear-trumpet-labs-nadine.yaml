description: A mountable condenser microphone for upright bass, for live and studio use.
details: |-
  Nadine attaches to and detaches from an upright bass in 30 seconds using the included velcro strap, 14 inch Gotham cable, and washer-mounted head. No tools are required, and the mount is designed to fit all sizes of upright bass.

  Nadine is a handbuilt medium-large diaphragm condenser microphone for amplifying an upright bass as naturally as possible. The low end is tuned to give a flat response at the mounting distance, and the cardioid pickup pattern provides natural sound by picking up as much of the surface of the bass as possible. Rejection off the back of the microphone allows live use with stage monitors in addition to studio work.

  Nadine's physical design is in two parts: a body that straps to the tailpiece with velcro elastic, and a head that mounts between the strings' afterlengths above the tailpiece using a rubber grommet. The 14-inch Gotham cable connecting the two parts makes it easy to place the microphone on any bass.

  The stated application is upright bass, live and in studio. Ear Trumpet Labs builds all of its products in Oregon and covers them with a lifetime warranty.
specs: |-
  - Hand-made microphone with unique appearance
  - Mounting system designed specifically for upright bass, with a 14 inch Gotham cable and washer-mounted head to fit all sizes of upright bass
  - Capsule and electronics tuned for live use with excellent feedback rejection
  - Internal shock dampers for minimal handling noise
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -41.9 dB (8 mV/Pa)
