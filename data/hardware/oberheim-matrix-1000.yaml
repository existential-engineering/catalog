description: >-
  The Oberheim Matrix 1000 is a single-space rackmount analog MIDI module containing 1000
  Matrix 6 patches with six voices, each featuring two DCOs, a low-pass filter, two VCAs, three
  envelope generators, two LFOs, and two ramp generators.
details: |-
  The analog Matrix 1000 is essentially 1000 Matrix 6 patches in a single-space compact rackmount MIDI module. It has the same synth architecture as the Matrix 6 with each of its 6 voices having two DCOs, a low-pass filter, 2 VCAs, 3 envelope generators, 2 LFOs, and 2 ramp generators.

  The sounds are plentiful and good enough, however sounds can only be edited via MIDI, so an external MIDI editor such as MOTU Unisyn or the Access Matrix Programmer is required. The Matrix 1000 provides an excellent source of pads, textures, and ambient sounds with 195 keyboard sounds, 118 strings, 130 woodwinds and percussion, 239 synthesizer, 119 bass, 74 lead, and 125 effects patches.

  Older versions of the Matrix 1000 have a black front panel while the newer models from the 1990s have a cream colored face plate. For the price, there is no better way to find genuine analog Oberheim Matrix sounds in a compact and inexpensive rack module loaded with more sounds than most users will ever need.

  The Matrix 1000 has been used by Apollo 440, Juno Reactor, Moby, Cirrus, Fatboy Slim, Laurent Garnier, ATB, Depeche Mode, Future Sound of London, Pet Shop Boys, and Faithless.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 12 DCOs (2 per voice)
  - LFO: 2 per voice
  - Layers: Single, Split, Multitimbral
  - Memory: 800 preset patches, 200 user patches
  - Keyboard: None
  - Effects: None
  - Control: MIDI
releaseDate: "1987"
