details: |-
  DESCRIPTION

  You asked for it, we delivered...Introducing the COMBINATA BASS! Designed around the same body silhouette and construction as the 6-string COMBINATA, the COMBINATA BASS features a 32" scale, slim taper set neck with a medium 'C' profile, chambered mahogany body and German carve top. Other features include our signature Rivolta full width fretboard inlays, bound body, fretboard and headstock, 20 medium jumbo frets and gold plexi appointments. FEATURES & SPECS
specs: |-
  - chambered mahogany body
  - German carve maple top
  - double bound body
  - set maple neck
  - bound fingerboard
  - aged perloid block inlays
  - bound peghead
  - 32" scale – 20 medium jumbo frets
  - 12″ fingerboard radius
  - 1 1/2″ nut width
  - Rivolta Medium C neck profile
  - Rivolta custom wound pickups
  - 1x master volume, 1x blend, 1x master tone
  - nickel hardware
  - open gear tuners
  - nickel bridge plate
  - gold plexi pickguard
  - Rivolta Hardshell Case: INCLUDED
