details: |-
  The Dolce is a handmade 7/8 size nylon string guitar built with a solid Cedar top and Mahogany back and sides. Its traditional 7-fan bracing produces a rich and warm Spanish sound despite its slightly reduced string length (630mm scale length). Stunning hand-crafted elements such as an all-natural wood rosette, Indian Rosewood binding, and a lightweight gloss PU finish distinguish the Dolce from other entry-level guitars in its price range. Like all Córdoba guitars, a lightweight adjustable truss rod is built into the neck for stability.
