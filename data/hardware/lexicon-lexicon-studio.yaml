details: |-
  Lexicon Studio was a PCI card based professional hard disk recording system that combined dedicated audio interface hardware with onboard DSP for use inside a host computer.

  The system was sold across multiple hardware and software revisions (Rev 1 and Rev 2 installations), with driver and application software shipped under the Core32 codebase through versions 3.02, 4.10, 4.20, and 4.21.

  Documentation positions Lexicon Studio as a professional tracking and mixing platform, including dedicated application notes for Steinberg Cubase via the Lexicon PC90 integration.

  The product is marked Discontinued on lexiconpro.com and is no longer manufactured or sold; legacy manuals, release notes, and installation guides remain available as PDF downloads for existing owners.
specs: |-
  - PCI card based architecture for desktop computer host
  - Professional hard disk recording interface
  - Onboard DSP for hardware-accelerated audio processing
  - Shipped in two hardware/software install revisions (Rev 1, Rev 2)
  - Core32 software stack with versions 3.02, 4.10, 4.20, and 4.21
  - Documented integration path with Steinberg Cubase via Lexicon PC90
