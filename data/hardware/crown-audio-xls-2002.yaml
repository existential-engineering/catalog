url: https://www.crownaudio.com/en-US/products/xls-2002
description: Two-channel, 650W @ 4Ω power amplifier from Crown's XLS DriveCore 2
  Series. Class D design with onboard DSP, large LCD display, integrated
  crossover, and Peakx limiters for portable PA use.
details: |-
  The XLS DriveCore 2 Series represents the next generation of the XLS amplifier line, featuring a sleek new look, an LCD display that is three times larger than the previous generation, and more DSP with higher capabilities. The XLS 2002 builds on Crown's patented DriveCore technology for ultra-efficient amplification.

  The amplifier can drive 2400W at 4Ω bridged with tons of headroom guaranteeing a clean, undistorted signal straight to your speakers. It weighs less than 11 pounds and provides a powerful, pure sound experience for any venue, making it well suited to portable PA applications.

  Key capabilities include higher DSP with bandpass filters per channel, increased lighting functionality with selectable LED control, and selectable input sensitivity options (1.4Vrms and 0.775Vrms). The unit features an integrated PureBand Crossover System, Peakx Limiters for speaker protection, and a remote power-trigger input.
specs: |-
  - 2 channels
  - 650W per channel @ 4Ω
  - 2400W bridged @ 4Ω
  - Input Sensitivity: 1.4Vrms (0.775Vrms selectable)
  - Frequency Response: +0dB, -1dB
  - Signal-to-Noise Ratio: >103dB (at 0.775Vrms, 6dB lower)
  - THD: <0.5%
  - Intermodulation Distortion: <0.3%
  - Damping Factor: >200
  - Crosstalk: 1kHz >85dB; 20kHz >55dB
  - Onboard DSP: band-pass filter per channel, PureBand Crossover, Peakx Limiters
  - Selectable LED indicator lighting
  - Remote power trigger
  - Dimensions: 19" W × 3.5" H × 10.7" D (48.3 × 8.9 × 21.2 cm)
  - Weight: 10.8 lbs (4.9 kg)
