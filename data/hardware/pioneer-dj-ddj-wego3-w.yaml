description: The DDJ-WeGO3 gives you unlimited musical choice. Connect it to an
  iOS device running Algoriddim’s djay 2 app to use the console’s jog wheels,
  buttons and dials to perform with your Spotify or iTunes library . Or connect
  to a PC/Mac and mix with other DJ software, including djay (Mac only), or
  Virtual DJ 8 Limited Edition. The controller was designed with beginners in
  mind, with Pulse Control lights to guide you through your performance. Yet
  it’s packed with advanced features that would keep pro-DJs entertained,
  including Beat Sync, loops and dedicated buttons for sound FX and samples.
details: |-
  Compact, entry-level DJ software controller. The DDJ-WeGO3 gives you unlimited musical choice. Connect it to an iOS device running Algoriddim’s djay 2 app to use the console’s jog wheels, buttons and dials to perform with your Spotify or iTunes library . Or connect to a PC/Mac and mix with other DJ software, including djay (Mac only), or Virtual DJ 8 Limited Edition. The controller was designed with beginners in mind, with Pulse Control lights to guide you through your performance. Yet it’s packed with advanced features that would keep pro-DJs entertained, including Beat Sync, loops and dedicated buttons for sound FX and samples.
