description: The HV-3D-4 is a four channel transformerless microphone
  preamplifier in a 2U steel rack chassis. Each channel carries a 36-step gain
  control and a balanced path from the microphone input to a laser-trimmed FET
  output stage.
details: |-
  The HV-3D-4 puts four channels of the Millennia HV-3 microphone preamplifier in a welded 16 gauge steel 19 inch chassis two rack units high. The transformerless design uses a matched high-speed discrete transistor octet with +23 dBu of input headroom, so no attenuator pad is required.

  Gain runs from 8.5 dB to 60 dB on 36-step switched controls at 1.5 dB per step, stereo matched to 0.08 dB, with up to 70 dB available on request. The laser-trimmed FET-based output stage carries 32 dBu of headroom and is rated to drive cable runs of 1000 feet (300 m).

  The audio path is balanced throughout with precision components and is specified under 5 ppm THD. Switching uses Grayhill mil-spec gold contacts and the universal supply accepts 100 V to 240 V at 50 or 60 Hz. Phantom powering is +48 V dc.

  Factory options include a ribbon-optimized DC coupled input, an extra 10 dB of gain at no charge, a 130 V DPA (B&K) microphone powering input, each ordered per channel, and Dante, AES or MADI digital outputs.
specs: |-
  - Minimum Gain: 8.5 dB
  - Maximum Gain (1.5 dB per step, 36 steps): 60 dB (up to 70 dB on request)
  - Frequency Response (+0 / -3 dB): sub 8 Hz to beyond 300 kHz (sub 3 Hz by request)
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -133 dBu EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +27 dBu Out): < .001%, Typ. < .0005% (< 5 ppm)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, +27 dBu Out): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +27 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +23 dBu (no attenuator pads required)
  - Maximum Output Level (20 Hz - 40 kHz): +32 dBu
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - DPA (B&K) Mic Powering: +130 V dc max (non-phantom)
  - Phantom Powering: +48 V dc, +/- 4 V dc
  - Power Consumption: 45 watts maximum
  - Power Requirements: 100V to 240V, 50/60 Hz
  - Dimensions/Shipping Weight: 19 in W x 3.5 in H x 12.5 in D, 21 lbs.
