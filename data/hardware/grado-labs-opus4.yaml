details: |-
  Opus4 is the entry point into the Grado Timbre Series, introducing the tonal character and construction of Grado's wood body cartridges. It leverages decades of design experience to deliver balanced, musical performance while maintaining core Grado principles. The cartridge employs Grado's moving iron design for stable, consistent signal output with minimal moving mass and long-term reliability. Available in stereo and mono configurations, it represents the foundation of the wood cartridge line.

  Performance-wise, Opus4 offers balanced, controlled presentation with clear detail and smooth treble. Midrange delivers warmth and presence while bass remains defined. Recordings maintain stability, coherence, and separation with natural character reproduction.
specs: |-
