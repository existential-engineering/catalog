description: The Drophead 15 packages the all-valve tone of the CTM-15 tube bass
  head into a compact combo with a 1x10-inch cabinet tuned for home and studio
  use. A dual EL84 power stage delivers deceptively large tones from just 15
  watts, making red-blooded overdrive easy to reach, and an analogue VU meter
  helps find the amp's sweet spot fast. The flip-up head design clips into
  position for play.
details: |-
  The DH-15-C110 (Drophead 15) is a compact all-valve bass combo that packages the tone of the CTM-15 tube bass head with a 1x10-inch cabinet tuned for use at home or in the studio. Its dual EL84 power stage delivers deceptively large tones from just 15 watts, and the low wattage makes it easier to reach red-blooded overdrive by driving it hard. An analogue VU meter gives an accurate display of the power amp's output so the player can quickly find the amp's sweet spot. The flip-up 'drophead' design lets the player un-clip the top, flip the amp head into position and clip it back down to play. The preamp uses two 12AX7 tubes.
specs: |-
  - Power output: 15 watts (all-valve)
  - Power requirement: 115/240V
  - Speaker configuration: 1 x 10 inch
  - Speaker outputs: jack
  - Frequency response: 30Hz to 16kHz
  - DI output: line level, 1k
  - EQ: passive Bass, Middle, Treble rotary controls
  - Preamp tubes: 2 x 12AX7
  - Output tubes: 2 x EL84
  - Analogue VU meter
  - Flip-up 'drophead' cabinet design
