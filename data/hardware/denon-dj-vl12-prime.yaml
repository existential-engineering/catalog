name: VL12 Prime
manufacturer: denon-dj
primaryCategory: turntable
categories:
  - vinyl
  - discontinued
url: https://www.denondj.com/vl12%20prime-vl12primexus.html
description: Professional direct-drive turntable with true quartz lock, S-shaped
  tonearm, highest-in-industry 5 kgf/cm torque, isolation feet for feedback-free
  bass-heavy environments, and a customizable RGB platter light ring.
details: |-
  Quartz direct-drive professional DJ turntable

  Isolation feet eliminate unwanted vibration and feedback in bass-heavy environments

  Highest-in-industry 5 kgf/cm torque on 'High' setting (instant), 3.4 kgf/cm stable

  Low torque setting: 3.2 kgf/cm (instant); 1.4 kgf/cm (stable)

  Innovative 'easy grip/brake' chamfered platter for tactile DJ touch

  Isolated motor design for optimal signal-to-noise ratio

  S-shaped tonearm for accurate tracking

  Reinterpreted tonearm support with dual-function 'lock or rest' feature

  Rugged all-metal tonearm base and high-quality brushed metal controls

  2-speed operation: 33 1/3 and 45 RPM (45 RPM adapter included)

  Adjustable pitch range: +/-8%, 16%, 50%

  Built-in RGB lighting illuminates platter's edge with 12 selectable colors and brightness control
specs: |-
  - Drive: Quartz direct-drive
  - High Torque: 5 kgf/cm (instant); 3.4 kgf/cm (stable)
  - Low Torque: 3.2 kgf/cm (instant); 1.4 kgf/cm (stable)
  - Starting Time: 0.3 seconds
  - Braking System: Electronic
  - Platter Material: Aluminum die-cast
  - Platter Diameter: 13.1" / 332 mm
  - Platter Weight: 4.9 lbs / 2.2 kg
  - Tonearm Effective Length: 9.4" / 238 mm
  - Tonearm Overhang: 1.0" / 25 mm
  - Tonearm Offset Angle: 20.5°
  - RPM: 33⅓, 45
  - Wow & Flutter: < 0.05%
  - Output: Phono-level via stereo RCA cable
  - Pitch Range: +/-8%, +/-16%, +/-50%
  - Connections: (2) RCA outputs (1 stereo pair); (1) IEC power input
  - Power Connection: IEC
  - Input Voltage: 100-240 VAC, 50/60 Hz
  - Power Consumption: 65 W
  - Dimensions (in): 17.8" x 14.0" x 5.9" (W x D x H)
  - Dimensions (mm): 451 x 355 x 150 (W x D x H)
  - Weight: 27.4 lbs / 12.4 kg
