description: The DS1 A Hill Country is a 12-fret dreadnought acoustic guitar
  from the Hill Country Series, built to push the tonal spectrum toward a strong
  fundamental voice that is warm and woody. Constructed with an Adirondack
  spruce top and Honduran mahogany back, sides, and neck, it delivers a dry
  character with full low-end response well suited to bluegrass and roots
  styles. Its Hill Country scalloped X-brace pattern and ebony appointments give
  it a distinctive voice and look.
details: |-
  The DS1 A Hill Country belongs to the Hill Country Series, a line designed to produce an acoustic option pushed to the far end of the tonal spectrum with a strong fundamental voice that is both warm and woody. The result is a dry character with full low-end response, making it especially appealing to bluegrass musicians while remaining versatile across multiple styles.

  The guitar features an Adirondack spruce top braced with a Hill Country scalloped X-brace pattern. Back and sides are Honduran mahogany, as is the neck, which has a comfortable C to modified V profile. The ebony fingerboard has a 14"-26" compound radius with gold mother-of-pearl dots. Appointments include a hand-poured tortoise pickguard with matching rosette ring, tortoise body binding, walnut backstrip, and a high-gloss ultra-thin nitrocellulose lacquer finish. Tuners are Relic Nickel Waverly.
specs: |-
  - Body Style: 12-fret dreadnought
  - Top: Adirondack spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with gold MOP dots
  - Fingerboard Binding: Ebony
  - Bridge: Ebony belly-style
  - Bridge Pins: Ebony
  - Nut: Aged bone, 1 3/4"
  - Bracing: Hill Country scalloped X-brace (Sitka spruce braces)
  - Tuners: Relic Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Neck Profile: Comfortable C to Modified V
  - Pickguard: Hand-poured tortoise
  - Rosette: Hand-poured tortoise ring
  - Body Binding: Tortoise
  - Backstrip: Walnut (1-style)
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Truss Rod: Fully adjustable
  - Body Width: 15 5/8"
  - Body Length: 20 7/8"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/8"
  - Strings: D'Addario EJ-17 (.013" - .056")
