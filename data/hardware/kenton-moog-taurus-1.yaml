description: A socket upgrade kit that adds Hz/V CV, Gate and Filter cutoff
  sockets to the Moog Taurus 1. Used with a MIDI to CV converter such as the
  Pro-Solo mk3, it lets the synthesiser be played from a MIDI keyboard or MIDI
  sequencer.
details: |-
  The Socket Upgrade Kit for the Moog Taurus 1 adds three 3.5mm mono jack sockets to the synthesiser. Used in conjunction with a MIDI to CV converter such as the Pro-Solo mk3, those sockets enable the Taurus 1 to be played from a MIDI keyboard or MIDI sequencer.

  The three inputs provide CV for Hz/V control over the oscillator frequency, Gate to control when notes play (0 volts for note off, above 3 volts for note on), and Filter to control the cutoff frequency of the low pass filter, taken from the auxiliary output of the converter.

  The kit contains a mounting plate that replaces the plastic bung in the Taurus' back panel, all necessary components, and diagrams for connecting the wires and components and for mounting the three 3.5mm mono jack sockets and the switch.

  Used with a Pro-Solo mk3, the kit gives control over notes across at least five octaves (a limit set by the synthesiser itself rather than by the kit or the converter), pitchbend with its range set in the converter, modulation from the converter's inbuilt LFO with speed and waveshape changeable in real time, portamento with a rate changeable in real time, and filter cutoff frequency driven by any continuous MIDI controller or by another MIDI message such as aftertouch or velocity.

  Low, high and recent note priority and single or multiple note trigger modes are set in the converter. Installing a socket upgrade kit is a skilled job which should be undertaken only by a competent synth service engineer, or carried out at Kenton's premises in Tadworth, just outside London.
specs: |-
  - Three 3.5mm mono jack input sockets: CV, Gate and Filter
  - CV input provides Hz/V control over the oscillator frequency
  - Gate input: 0 volts = note off, greater than 3 volts = note on
  - Filter input controls the low pass filter cutoff frequency, fed from the aux out of the converter
  - Includes a mounting plate that replaces the plastic bung in the Taurus 1 back panel
  - Supplied with all necessary components, a switch and connection diagrams
  - Note range at least 5 octaves, limited by the synthesiser rather than by the kit or converter
  - Pitchbend range, note priority and single or multiple trigger modes are set in the MIDI to CV converter
