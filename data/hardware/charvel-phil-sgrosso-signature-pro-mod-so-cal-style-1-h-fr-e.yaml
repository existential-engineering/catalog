details: |-
  The Phil Sgrosso Signature Pro-Mod So-Cal Style 1 H FR E is a signature electric guitar honoring As I Lay Dying rhythm guitarist Phil Sgrosso. Its mahogany body delivers rich and resonant tone for dark, chugging metal and has a scalloped lower back bout and sculpted shredder's cut heel for comfortable and unencumbered upper-fret access.

  The bolt-on maple neck is graphite-reinforced to withstand the abuses of worldwide touring, and has a hand-rubbed satin urethane back finish, fluorescent Luminlay side dots for fingerboard guidance in low light, and a conveniently located heel-mount truss adjustment wheel for neck tweaks on the fly. The 12"-16" compound radius ebony fingerboard has a more pronounced curvature across its width near the nut for comfortable chording, and gradually flattens to a very slight curvature toward the upper frets for blazing fast solos and effortless bends. The fingerboard also has rolled edges, 22 jumbo frets and offset dot inlays.

  A multi-voice Fishman Fluence Modern PRF-MHB-AB1 alnico bridge pickup delivers the most sought-after humbucking tones, from a modern active pickup with a full, boosted sound to clean, crisp and fluid tones. The black single speed volume knob functions as a push/pull selector for switching between both voices. Dive bomb away without sacrificing tuning stability, courtesy of a Floyd Rose 1000 Series double-locking tremolo bridge system.

  Sgrosso's signature model is wrapped in an alluring Silverburst finish with a black anodized aluminum pickguard, chrome hardware and a licensed Fender Stratocaster headstock with Charvel "toothpaste" logo.
