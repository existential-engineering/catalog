description: True stereo rotary speaker pedal with blend, drive and mid boost
  controls, dual speeds, brake, adjustable ramp, an LED speed indicator and
  switchable true or buffered bypass.
details: |-
  The Rotary recreates the swirling texture and warmth of a rotating speaker cabinet, an effect the maker describes as a distinctive form of chorus. The circuit boards are a new design housed in a laser cut aluminium case, and the voicing pairs the rotary swirl with a tube-style breakup.

  Tone shaping comes from three controls. Blend sets the mix of dry and wet signal, from a subtle warble to a fully wet effect. Drive adds tube-like harmonic saturation. Mid Boost offers three EQ curves for thickening the stereo effect.

  Motion is handled by a large speed knob plus a dual speed switch for two distinct rotation rates, a brake that slows the rotation to a stop, and an adjustable ramp that sets how quickly the speed changes between slow and fast. An optional pulsing LED tracks the rotary effect as a speed indicator.

  The pedal has stereo inputs and stereo outputs for true stereo operation, and bypass is switchable between true bypass and buffered bypass. It runs on 9 to 18 VDC at 130 mA, with no battery option. Keeley notes the Rotary received a Premier Guitar Premier Gear Award.
specs: |-
  - True stereo, stereo inputs and stereo outputs
  - Controls: Blend, Drive, Mid Boost, Speed, Dual Speed, Brake, Adjustable Ramp
  - Mid Boost offers three selectable EQ curves
  - LED speed indicator that pulses with the rotary effect, switchable
  - Switchable true bypass or buffered bypass
  - 9 to 18 VDC, 130 mA, high current power supply not included
  - No battery operation
  - Laser cut aluminium enclosure
  - Width 3.9 in / 99 mm
  - Height 2.6 in / 66 mm
  - Depth 4.9 in / 124.5 mm
