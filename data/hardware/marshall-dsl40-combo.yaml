description: The DSL40 Combo is an all-round 40W all-valve guitar combo from
  Marshall's DSL (Dual Super Lead) range, pairing two channels with two modes
  each (Classic Gain — Clean / Crunch, and Ultra Gain — Lead 1 / Lead 2) for a
  wide tonal palette from sparkling cleans to high-gain saturation. A
  pentode/triode power-reduction switch drops the output from 40W down to 20W
  for lower-volume playing without losing valve feel, and a single 12-inch
  Celestion V-Type speaker delivers the trademark sweet, harmonious British
  voicing. The rear panel exposes five speaker outputs for flexible cabinet
  matching, a series effects loop, an emulated line out for direct recording or
  silent practice, and MIDI compatibility for integration with switching rigs
  and controllers.
details: |-
  The DSL40 Combo has been designed with a 12" G-12 V-Type speaker for those who need exceptional tone and flexibility. With rich functionality including the ability to move between two sounds within each gain channel, players can experiment and release their personality through sound. Designed and engineered in UK. Made in Vietnam.

  Power reduction from 40W to 20W at the flick of a switch: you decide how loud you want the music to be. Choose between 40W and 20W power output at the flick of a switch. Perfect for jumping between practice and the stage over and over again.

  Can be controlled using any MIDI equipment: the features on the amp are fully compatible with any MIDI equipment, meaning that, for those technical players, you can play this amp and different MIDI equipment simultaneously.

  Five speaker outputs: whether you're practising or performing, the DSL40 is the amp for you. With five speaker outputs, this amp offers you plenty of tonal options. Simply change the speaker configuration to significantly alter the sound produced by the amp.

  Celestion G-12 V-Type speaker: elevate your sound with the V-Type speaker, renowned for its sweet and harmonious sound. Immerse yourself in a perfectly balanced tonal signature that captures the essence of vintage music, with a modern twist. Whether you're playing clean melodies or unleashing a fiery overdrive, this speaker ensures that every note resonates with clarity and definition. With its mid-band warmth, it adds depth and richness to your lead playing, giving your sound a full-bodied presence.
specs: |-
  - All-valve
  - 40W to 20W at the flick of a switch
  - 12-inch Celestion V-Type speaker
  - Five speaker outputs
  - Compact and portable
  - Suitable for a variety of genres
  - Model: DSL40 Combo
  - Range: DSL
  - Channels: 2, each with 2 modes
  - Technology: Valve
  - Output wattage: 40W (with power reduction option to 20W)
  - Outputs: speaker outputs 5 x 1/4" jack sockets (16 ohm load / 8 ohm load / 4 ohm load), 1 x 1/4" jack emulated line out
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5 mm jack aux input, MIDI in, footswitch
  - Controls: classic gain channel (gain, volume, clean crunch switch), ultra gain channel (gain, volume, OD1/OD2 switch), treble, middle, bass, tone shift switch, presence, resonance, reverb (classic gain channel), reverb (ultra gain channel), master select switch, master volume I, master volume II, loop on/off switch, low power option (on rear)
  - Effects: digital reverb
  - Effects loop: yes, series, send/return
  - Speaker configuration: 1x12"
  - Speaker model: Celestion V-Type speaker (16 ohm, 70 W)
  - Unit impedance: 16 ohm
  - Preamp valves: 4 x ECC83
  - Power amp valves: 2 x EL34
  - Weight: 22.9 kg / 50 lb
  - Width: 620 mm / 24.4"
  - Height: 490 mm / 19.3"
  - Depth: 252 mm / 9.9"
  - Country of origin: designed and engineered in UK, made in Vietnam
  - Box contents: PEDL-90012 footswitch included, compatible with PEDL-91016 (modes 1 clean, 2 crunch, 3 OD1, 4 OD2, 5 master 1 / master 2 toggle, 6 FX loop on/off), detachable power cable included
