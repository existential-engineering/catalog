description: A 2hp dual full-wave rectifier module that converts negative
  waveform portions to positive, with an inverted secondary output.
details: |-
  Are you sick and tired of having pesky negative waveforms interfering with your signals? Do you detest seeing the back-and-forth motion of AC waveforms going backwards, then forwards? Those days are OVER with the Herzlich Labs FWR, a dual full-wave rectifier that puts an end to negative waveforms! When you plug a signal into the FWR, you get two outputs in return, which have fully rectified the input. All negative inputs will be kindly returned to you in pristine, fully positive form. Beautiful bouncy sine waves, turned into pure "Oops! All Positive Waveshapes"-cereal, just the way you like it. You want to keep it purely negative? The secondary output is an inverted form of the primary output, so you get to choose which flavor you want. Don't believe me? Buy it and see. Use it anywhere where you want ONLY positive vibes, or use it with an inverter to get ONLY negative signals, if you please. Yes, you get two of these functions in just 2hp! I know! Herzlich Labs did it again!
