  The SX-212A is a compact angled 2x12 cabinet built from premium ply loaded with Celestion 70/80 speakers, delivering tight lows, punchy mids, and the unmistakable Celestion character. Its angled baffle projects your sound with greater clarity and presence, giving better on-stage monitoring alongside audience projection. Closed-back construction and a premium ply build make it a stage-ready partner for the SX Heads (SX-5H, SX-50H, and above).
