  level.
details: |-
  The largest speaker in the LYD series: the 3-way LYD 48. With this addition to the LYD personal reference monitor series, Dynaudio is bringing a new perspective to power and precision for producers and musicians everywhere – with unmatched accuracy at any volume level.

  This 3-way near- to midfield monitor reaches eyebrow-raising levels of accuracy thanks to a new soft-dome tweeter and Dynaudio's proprietary MSP midrange driver and woofer. Each driver is fuelled by a powerful, state-of-the-art Class-D amplifier and a full 24-bit/96kHz signal path. And, like the rest of the LYD range, it lets you fine-tune low frequency response, position and sound-balance using cutting-edge DSP.
specs: |-
  - Type: Nearfield Monitor
  - Box principle: Rear-loaded bass reflex
  - Crossover type: 3-way DSP-based
  - Crossover frequency: 460/5500 Hz
  - Tweeter: 1.1" soft dome
  - Midrange: 4" MSP
  - Woofer: 8" MSP
  - Amplifier power (woofer): 80W
  - Amplifier power (midrange): 50W
  - Amplifier power (tweeter): 50W
  - Maximum SPL (1m, pair): 112 dB
  - Lower cutoff (85 dB ±3 dB): 50 Hz
  - Upper cutoff (85 dB ±3 dB): 21 kHz
  - AC power input: 100-240V 50/60Hz
  - Max power consumption: 100W
  - Max standby power consumption: 0.5W
  - Weight: 12 kg (26.5 lbs)
  - Dimensions (W x D x H): 369 x 328 x 234 mm (14 4/8" x 12 7/8" x 9 2/8")
  - Finishes: Black Satin, White Satin
