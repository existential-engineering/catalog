details: |-
  FX3 is the perfect solution if you need a special effects controller for Traktor Pro. The device controls the browser and four effect slots simultaneously.

  It is a special controller for DJ software, optimised for Native Instruments Traktor Pro, and setup files for Traktor Pro/Duo are shipped with the controller. The USB interface is class compliant, so no driver is necessary.

  All 4 FX slots are available at once, reached simultaneously by 16 pots and 20 buttons, with 4 presets per FX slot to store FX types and FX modes (advanced or chained). About 120 commands are available and all of them are freely reassignable. A dedicated browser section carries its own encoder and 4 load buttons.

  25 coloured buttons all carry a double function by holding down the shift button, and 17 LEDs in different colours display various information, including the state of all FX buttons from feedback data sent by the computer software.

  The unit is USB bus powered, with a consumption of less than 500 mW / 100 mA. The very compact design uses a black plastic casing in desktop format, 180 x 105 x 70 mm and 350 g, with a silver aluminium front plate carrying an abrasion-resistant anodised coating and inscriptions. Faders, pots and encoders are high-quality parts from ALPS, fitted with new rubber knobs for best tactile feeling.
specs: |-
  - Special controller for DJ software (optimised for Native Instruments Traktor Pro)
  - Setup files for Traktor Pro/Duo shipped with the controller
  - USB interface, class compliant, no driver necessary
  - 4 FX slots available, access to all 4 FX slots simultaneously by 16 pots and 20 buttons
  - 4 presets per FX slot to store FX types and FX modes (advanced/chained)
  - About 120 commands, all freely reassignable
  - Browser section with a dedicated encoder and 4 load buttons
  - 25 coloured buttons
  - All controls with double function by holding down the shift button
  - 17 LEDs in different colors to display various informations
  - Indication of all FX button states by feedback data from computer software
  - USB bus powering, consumption less than 500 mW / 100 mA
  - Very compact design in a black, plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - Requires a PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - Requires Native Instruments Traktor Pro/Duo (as of version 1.2.4) or software which allows user assignments of continuous parameters (CC) and note commands
