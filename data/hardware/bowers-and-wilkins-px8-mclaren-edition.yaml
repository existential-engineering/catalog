details: |-
  Px8 McLaren Edition is a special-edition Bluetooth wireless over-ear noise-cancelling headphone marking the long-standing, award-winning partnership between Bowers & Wilkins and McLaren Automotive and the McLaren supercars and hypercars in which Bowers & Wilkins audio has been integrated. It fuses McLaren-inspired styling with the high-performance wireless sound of the standard Px8.

  The acoustic hardware is the Px8 platform: two 40mm dynamic full-range carbon drive units, with total harmonic distortion quoted below 0.1 percent at 1kHz and 10mW. Noise control is a Hybrid Noise Cancellation system fed by four dedicated ANC microphones, with a further two microphones for telephony, plus Ambient Pass-Through and a wear-detection sensor.

  Wireless is Bluetooth 5.2 with aptX Adaptive, also covering aptX HD, aptX Classic, AAC and SBC, and carrying the A2DP, AVRCP, HFP, HSP and BLE GATT profiles. The single physical port is a USB-C socket used for both charging and audio; the supplied 1.2m USB-C to 3.5mm stereo jack cable is how an analogue source is connected, so there is no dedicated 3.5mm jack on the headphone.

  The rechargeable lithium-ion battery is rated at 30 hours of playback, with a 15-minute charge giving 7 hours. Net weight is 320g without the carry case, and the supplied carry case measures 189mm wide by 63mm deep by 233mm high. One finish only was offered, Galvanic Grey with Papaya Orange, the orange drawn from the colour of founder Bruce McLaren's early racing cars.

  The product is now archived.
