description: Special-edition over-ear noise cancelling headphones celebrating
  the long-standing partnership between Bowers & Wilkins and McLaren Automotive,
  fusing McLaren-inspired styling with high-performance wireless sound.
details: |-
  Celebrating the long-standing, award-winning partnership between Bowers & Wilkins and McLaren Automotive and the McLaren supercars and hypercars in which Bowers & Wilkins has been integrated, the Px8 McLaren Edition headphones fuse McLaren-inspired styling with high-performance wireless sound synonymous with Bowers & Wilkins' headphones.

  Celebrating a relationship which has been in place since 2015, the Px8 McLaren Edition is finished in elegant grey leather with Papaya orange details inspired by McLaren's supercars and hypercars.

  Integration of McLaren Automotive cues is subtle but stylish, with a Galvanic grey finish and Papaya orange highlights, the latter inspired by the famous Papaya orange which originated on founder Bruce McLaren's early racing cars. A discreet tone-on-tone McLaren logo on the headband completes the headphones' distinct and striking design.

  The partnership is built on firm technical foundations, something that has already been recognised with three iF design awards for the system integrations of Bowers & Wilkins in the McLaren Speedtail, McLaren GT, and most recently, the hybrid McLaren Artura, which has again raised the bar for audio performance thanks to close engineering collaboration and optimisation.
specs: |-
