description: Ultimate tool for rhythm based music production.
details: |-
  Erica Synths Techno System is a complete eurorack system for rhythm based music production, live performances and sound design. The drum modules are internally patched to the sequencer, so they receive trigger and accent signals even without patching the relevant patch cables, which leaves the focus on audio signal patching. It is not limited to specific music genres, since what comes out depends on the patching and the settings of the modules.

  The system comes in the Erica Synths Travel Case, with a universal PSU and a case lid included, and with 25 black patch cables.

  Sound sources include Sample Drum, a 14HP sample player with a straightforward interface designed with live performance in mind, and Bassline, a fully analogue synth voice with an AS3340 VCO offering three waveforms, a filter inspired by Erica Synths Acidbox, a transistor-based suboscillator and two BBDs that emulate VCO detune. The drum voices are Bass Drum2, which takes classical drum machine kick sounds further with more parameters and CV control, Snare Drum with a 909 inspired sound, Toms carrying Low, Mid and High Tom with individual pitch and decay controls and outputs plus CV over pitch, Clap with accent and CV over tune, Hi-Hats D passing classical hi-hat samples through an AS3330 based VCA with an open hi-hat looping mode that creates a delay-like effect, and Cymbals with 10 sets of custom crash and ride samples with tune and individual decay control.

  Modulator provides two identical LFO and noise sources that sync to the BPM, with selectable morphing waveshapes, manual or CV control over frequency, frequency divisions and multiplications in sync mode, and a secondary output with adjustable phase for evolving modulations. The Drum Sequencer carries 16 trigger outputs, 12 accent outputs, one CV and gate track and two synced or free running LFO outputs.

  Dual Drive holds two independent distortion circuits with gain and overdrive parameters and three overdrive flavours each, with CV inputs for lively distortion and stereo effects, while Dual FX combines two Spin FV-1 chips, each carrying eight custom effect programs tailored to drum sounds with two CV controlled parameters per effect and an analogue dry/wet circuit, and all parameter settings can be saved with the effect. Drum Mixer is a 7 input mixer with a greater dynamic range and a vactrol based compressor, where the first three inputs can be allocated to the main output or to the main output plus Aux Send, Mixer Lite is a compact 6 input version with trimpot access through the front panel, Stereo Mixer adds four channel strips with left and right inputs, level controls and a limiter, and LINK bridges eurorack to stage mixers across five sections that attenuate eurorack signals to line level and feed 6.3mm jacks.
specs: |-
  - Power supply universal 110-240VAC -12VDC adapter
  - Power consumption 1.5 A
  - Dimensions (W x D x H) 550x280x140mm
  - Mass (with lid) 7.55 kg (excluding PSU)
  - Comes in Erica Synths Travel Case with universal PSU, case lid and 25 black patch cables
  - Sample Drum: 14HP eurorack sample player module
  - Bassline: analogue synth voice with AS3340 VCO, three waveforms, suboscillator and two BBDs
  - Drum voices: Bass Drum2, Snare Drum, Toms (Low, Mid, High), Clap, Hi-Hats D, Cymbals
  - Cymbals: 10 sets of custom Crash and Ride samples
  - Modulator: two BPM syncable LFO and noise sources with morphing waveshapes
  - Drum Sequencer: 16x trigger outputs, 12x Accent outputs, 1x CV and Gate track, 2x LFO outputs
  - Dual Drive: two independent distortion circuits with three overdrive flavours each
  - Dual FX: two Spin FV-1 chips with eight custom effect programs each
  - Drum Mixer: 7 input mixer with vactrol based compressor and Aux Send allocation
  - Mixer Lite: 6 input mixer with vactrol based compressor
  - Stereo Mixer: four stereo channel strips with level control and limiter
  - LINK: 5 sections attenuating eurorack signals to line level on 6.3mm jacks
