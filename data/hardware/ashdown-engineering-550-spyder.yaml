url: https://ashdownmusic.com/products/550-spyder
description: A rackmount bass head combining the all-tube preamp warmth and
  grind of the 427 Small Block with a tour-proven 500-watt ABM power stage. It
  offers High and Low gain inputs, front-panel Effects Send and Return,
  Bass/Middle/Treble EQ with Mid Shift, Bass Shift and Bright switching, a Mute
  switch, Gain and Master volume, and a balanced DI output with Pre/Post
  switching.
details: |-
  Rackmount bass head pairing the 427 Small Block's all-tube preamp with Ashdown's 500-watt ABM power stage. Controls include High and Low gain inputs, front-panel-mounted Effects Send and Return, rotary Bass, Middle and Treble with Mid Shift, Bass Shift and Bright switching, a Mute switch, and rotary Gain and Master volume. Balanced DI output with Pre/Post switching. Partners with Ashdown US Series cabinets.
specs: |-
  - Power output: 550W
  - H x W x D: 195 x 525 x 325 mm
  - Weight: 14 kg
  - All-tube preamp (from the 427 Small Block)
  - High and Low gain inputs
  - EQ: Bass, Middle, Treble with Mid Shift, Bass Shift and Bright switching
  - Balanced DI output with Pre/Post switching
