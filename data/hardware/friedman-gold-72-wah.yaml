description: A vintage-voiced wah pedal with a three-position sweep switch,
  adjustable treadle tension and a switchable internal buffer, so its feel and
  voice can be tuned to the player and the board.
details: |-
  At the heart of the Friedman Gold-72 Wah is a classic-sounding, almost vocal effect that reaches back to the great rock and funk tones of the decades players grew up with. Whether wailing through two humbuckers and a full stack, bringing the clean rhythmic sweeps of the '70s, or finding a unique voice all its own, the Gold-72 Wah sits comfortably on a board, and its classic voice works equally well with clean and driven tones and with single-coil and humbucker-loaded guitars.

  Where the Gold-72 Wah stands apart is its ability to conform to a player's preferences. A three-way sweep switch, hidden under the treadle, offers three voicing options, and an Allen screw tension adjustment gives control of the pedal's action for a tighter or looser feel. An internal buffered and true bypass switch means the wah works wherever it sits in the chain, and an easily visible LED shows when the pedal is engaged.

  Dave Friedman has built one of the most stellar reputations in the guitar, amplifier and effects industry over decades, and his clientele, which includes some of the biggest names in electric guitar, rely on him to keep them sounding their best night after night. The Gold-72 Wah is crafted from the finest materials, and every unit is inspected and tested before shipping.
specs: |-
  - Classic voice that works equally well with clean and driven tones
  - Great with single-coil and humbucker-loaded guitars
  - Familiar form factor that feels great underfoot
  - 3-position sweep switch, hidden under the treadle, offering three voicing options
  - Allen screw tension adjustment for control of the pedal's action
  - Internal buffer and true bypass switch, so the pedal works in multiple pedal arrangements
  - Easily visible LED indicates when the pedal is engaged or disengaged
  - Crafted with only the finest materials
  - Every unit is inspected and tested before shipping
