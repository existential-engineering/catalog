description: >-
  The Casio CT-401 is a preset synthesizer from 1981 featuring 14 preset sounds
  and 16 drum/rhythm patterns, notable as Casio's first keyboard with an
  auto-accompaniment section.
details: |-
  The Casiotone 401 was groundbreaking as the first Casio synthesizer to offer an auto-accompaniment section that would become a signature feature on later models. The instrument includes 14 preset sounds such as organ, flute, oboe, clarinet, trumpet, violin, cello, piano, harpsichord, celeste, accordion, electric piano, and two creatively named synthesizer sounds: frog and funny.

  The built-in drum/rhythm section provides 16 preset patterns including rock, bossanova, waltz, march, samba, and mambo styles, allowing players to create accompaniment without programming capabilities.

  The CT-401's "Casio Auto Chord" function enables users to hold left-hand keys to trigger stored chords in staccato or sustained modes, or activate "Fingered" mode for rhythmic chord playing with walking bass lines synchronized to the rhythm section.

  With its 49 full-sized keys and professional appearance despite plastic and particle board construction, the keyboard featured organ-style switches and a large built-in speaker, making it an accessible instrument for hobbyists and musicians seeking fun, interesting sounds.
specs: |-
  - Polyphony: 8 notes (12 notes with auto-chord polyphony)
  - Oscillators: 2
  - Waveforms: multi-pulse square wave tones
  - Modulation: Vibrato, Vibrato Delay
  - Filter: None
  - Envelope: Sustain, Hold
  - Effects: None
  - Keyboard: 49 full-sized keys
  - Memory: 14 preset sounds, 16 preset rhythms
  - Control: 3 foot switch jacks
  - Output: Mono 1/4-inch output, external audio input, headphone jack
  - Date Produced: 1981
releaseDate: "1981"
releaseDateYearOnly: true
