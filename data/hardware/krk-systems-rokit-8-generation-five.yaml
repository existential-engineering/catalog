details: |-
  The KRK Systems ROKIT 8 Generation Five is the most advanced studio monitor in its class. Whether you're working on a chart-topping hit, a film score, or a personal project, they provide the tools you need to capture every nuance of your sound with astonishing clarity. Part of the Fifth Generation of KRK ROKIT Studio Monitors, along with the ROKIT 5 Generation Five and ROKIT 7 Generation Five, their onboard DSP technology provides three distinct Voicing Modes. Mix Mode, with flat frequency and phase response, is best for mixing, mastering, and critical listening. Create Mode is a more inspirational voicing best used for writing, producing, and casual listening. Focus Mode is a mid-focused voicing for critical analysis of the midrange band where vocals and most instruments have the most energy. The three Voicing Modes eliminate the need for separate sets of monitors for different tasks. It's like having three pairs of monitors in one. The ROKIT 8 Generation Five also features 25 boundary and tuning EQ combinations that help minimize and correct problems in your acoustic environment, and with the aid of the free KRK App, they make setting up your recording environment easy and precise.

  The ROKIT 8 Generation Five is fitted with an 8" woven Kevlar aramid fiber cone woofer for superior damping and modal breakup control. The 1" tweeter benefits from a highly damped acoustic silk dome diaphragm to smoothly extend the frequency range up to 40 kHz. For maximum transient response and dynamics reproduction, bi-amplified Class D power amplifiers drive the transducers evenly and more efficiently at reduced operating temperatures to ensure audio integrity during long work sessions.
specs: |-
  - Configuration: 2-Way Bass Reflex
  - System Type: Active Studio Monitor
  - Low-Frequency Driver: Woofer, 8-inch, woven Kevlar aramid fiber cone, ferrite magnet
  - High-Frequency Driver: Tweeter, 1-inch, Silk Dome, Copper Cap, ferrite magnet
  - Frequency Response: (+/- 3 dB) 42 Hz - 36 kHz
  - Frequency Range: (+3/-10 dB) 32 Hz - 40 kHz
  - Crossover Frequency: 1.64 kHz
  - Amplifier Configuration: Bi-amplified (Class D)
  - HF Amp Power Output: 68 Watts
  - LF Amp Power Output: 135 Watts
  - Total Power: 203 Watts
  - Total Dynamic Power Output: 312 Watts
  - Max SPL: 111 dB
  - Coverage Angles: 148° Horizontal x 125° Vertical
  - Analog Input Connector: Balanced XLR / 1/4" TRS Combo
  - SNR (Signal to Noise Ratio): >94 dB (Low Sensitivity setting, balanced), >91 dB (High Sensitivity, unbalanced)
  - AC Input Voltage: 100 - 240VAC (+/- 10%), 50/60 Hz
  - Fuse Type: 5x20 mm T2A 250V
  - Enclosure Construction: PVC Vinyl Wrapped MDF
  - Baffle Construction: Structurally Reinforced High Impact Polystyrene
  - Three Voicing Modes: Mix, Focus and Create
  - 25 boundary and tuning EQ combinations
  - Includes two magnetic faceplates for grille or no-grille use
  - Integrated mounting points for optional KRK mounting brackets
  - Product Dimensions: (H x W x D) 15.75" (400 mm) x 10.47" (266 mm) x 12.56" (319 mm)
  - Product Weight: 23.04 lbs. (10.45 Kg.)
  - Packaged Dimensions: (H x W x D) 20.47" (520 mm) x 13.78" (350 mm) x 15.35" (390 mm)
  - Packaged Weight: 28.66 lbs. (13 Kg.)
