description: A 1U passive module that connects up to 8 inputs or outputs via
  Ethernet cable to link multiple cases, and can also serve as a passive
  3-section multiple.
details: |-
  With the ability to connect up to 8 inputs or outputs via an ethernet cable, the PIPE-S makes it easy to connect multiple case together or avoid any cable mess accros a case. This makes it the perfect solution for simply setting up your eurorack system in the studio or for a live gig. But that's not all, PIPE-S can also be used as a multiple passive 3 section. Want to transmit precise signals like pitch CV and want to avoid crosstalk induced by passive multiples? No worries you can easily deactivate this function for each section from the connector at the back of the module. The best part is that PIPE-S is completely passive which means you can place it anywhere, it doesn't draw any current from your power supply but that also makes it perhaps the simplest DIY module! PIPE-S modules are sold by pair . If you want a PIPE (3U) and a PIPE-S (1U) select the option:
  "Build & Tested - 1x PIPE-S + 1x PIPE". This option is only available for PIPE/PIPE-S built and tested. The ethernet cable is not supplied with the modules

  Regarding Ethernet cable
  We recommand shielded Straight-Thru RJ45 cable. Using un-shielded or Crossover cable won't damage your modules but you may experience noise and or mixed channels. Due to is passive nature we also recommand to avoid long ethernet cables.
