description: This signature model channels metalcore guitarist Sean Long's
  approach to modern heavy music, designed for high-speed playing, scorching
  sound, and a sinister yet eccentric style tailored for contemporary metal
  performance. It pairs an alder San Dimas Style 1 body in Gloss Black with a
  bolt-on maple neck, a maple fingerboard, EMG active humbuckers, and a Charvel
  HT6 string-through hardtail bridge.
details: |-
  The Sean Long Signature Pro-Mod San Dimas Style 1 HH HT M features an alder San Dimas Style 1 body in a Gloss Black finish, accented by neon yellow and black pickup covers. The bolt-on maple neck has graphite reinforcement rods, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. A maple fingerboard with a 12"-16" compound radius carries 22 jumbo frets and Luminlay side dots (no top inlays), anchored by a Graph Tech TUSQ XL nut (1.6875" width) and a 25.5" scale length.

  Electronics center on an EMG 57 bridge humbucker and EMG 66 neck humbucker (active) with neon yellow and black covers, routed through a 3-position blade switch (bridge / bridge + neck / neck) and a single dome-style volume control.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge, Charvel-branded die-cast locking tuning machines, a standard Fender string guide, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build. Optional Charvel Style 1/2 Economy Case (p/n 0990612100) and Charvel Multi-Fit Gig Bag (p/n 2991414006) are available.
