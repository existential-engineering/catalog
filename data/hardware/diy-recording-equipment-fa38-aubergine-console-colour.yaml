description: A recreation of the class-A transistor circuitry from the channel
  strip of a rare 1970s Trident console, designed to add fullness, width, and
  saturation to any signal. It is compatible with the Colour format.
details: |-
  In 1971 Trident Studios found themselves in need of particular console that nobody else could provide. So they designed their own. The result was the rarest, most mythical range of consoles ever made. Only 13 of these purple consoles were ever delivered, but the beautiful sound of its preamps and EQs was enough to cement their place in recording history. The FA38 is a loving recreation of the most colorful circuitry from this console's channel strip. Everything that passes through this class-A transistor circuit sounds a bit fuller, wider, and more finished. And at very high gains, the circuit breaks up beautifully with a wooly, bass-heavy saturation. The FA38 is designed by Ken Pearsall of Fetish Audio who has spent years working on and repairing these famous consoles in world-class studios. FEATURES

  Samples

  Resources
specs: |-
  - Actual circuitry from the console channel strip
