description: The Austrian Audio Hi-X50 is a professional closed-back on-ear
  headphone built for DJ sets, front-of-house mixing, and fast-paced live
  environments. It features Austrian Audio's proprietary high-excursion 44mm
  drivers with a ring magnet system, delivering punchy lows, clear detail, and
  distortion-free sound. Lightweight, durable construction includes all-metal
  hinges and bow, foldable design, memory foam ear and bow pads, and a
  detachable 3m cable. Fully serviceable and made in Austria with up to 5-year
  warranty.
details: |-
  The Hi-X50 uses Austrian Audio's proprietary high-excursion driver technology with a ring magnet system, enabling a wide frequency response of 5Hz to 28kHz with very low THD under 0.1% at 1kHz. At 25Ω impedance and 285g, well suited for portable and live-stage use. Closed-back on-ear design provides passive isolation.

  All-metal construction with foldable hinges makes it road-ready, and the 100% serviceable design means pads, cables, and components can be replaced. Up to 5-year warranty.
specs: |-
  - Frequency Response: 5 Hz – 28 kHz
  - Sensitivity: 118 dB SPL/V
  - THD (at 1 kHz): < 0.1%
  - Impedance: 25 Ω
  - Input Power: 150 mW
  - Driver Size: 44mm
  - Weight: 285 g
  - Dimensions: 190 × 170 × 70 mm
  - Cable: 3 m (detachable)
  - Connector: 3.5 mm (1/8-inch)
  - Adapter included: 3.5 mm to 6.3 mm (1/4-inch)
