description: FOR THE TRULY WILD Psycho multimode filter with an ultra-sleek
  enclosure. Its medical-grade IC chip creates a hyper-precise filter that
  sounds like no other.
details: |-
  A psycho multimode filter with an ultra-sleek enclosure, the Evil Filter's medical-grade IC chip creates a hyper-precise filter that sounds like no other. With high pass, bandpass, and low pass modes, as well as two types of screaming resonance, it is ready to saw any sound into pieces, or just be the most insane wah you've ever heard. Its two fuzzes take signals into a much more twisted dimension, creating a blooming compression perfect for ripping solos and walls of noise alike, and pushing past the limit into octaves up, down, and snarling wavefolding sounds. Using the CV/Expression input, you can also control the filter cutoff frequency with an expression pedal or synthesizer.

  In High-Pass mode you hear frequencies above where the Filter Freq. control is positioned. In Band-Pass mode it chops off the high and low frequencies, leaving a midrange signal with a round, vocal-like character similar to a wah. In Low-Pass mode only bass frequencies below the Filter Freq. control come through. The Filter Resonance control adjusts the width and ringiness of the filter: at lower settings it acts on a wide range of frequencies for gentle rolling sweeps, and as you bring up the Resonance the affected frequencies narrow until it clamps down and boosts them into ringing peaks, subharmonic pulses, and screaming self-oscillation. Flip the Resonance toggle from Normal to High for extra harmonics and oscillation. The CV/expression input controls the filter cutoff frequency using a synthesizer or expression pedal.

  The Evil Filter is also equipped with an Evil Fuzz that has its own footswitch, so you can use it as a standalone full-on fuzz or pair it with the filter. The Evil Fuzz has two fuzz types: one is a rich fuzz that cleans up nicely with your volume control, and the other is an over-the-top fire-breathing scorcher.

  On the fuzz side, the Fuzz Type switch chooses between a cleaner driving fuzz (down) and a blasted-out blooming fuzz (up), and Output sets the fuzz volume. On the filter side, Freq sets the cutoff frequency shown in Hz, the Selector chooses between Low Pass, Band Pass, and High Pass, Resonance sets the resonance in conjunction with the Resonance Switch (which sets its range between Normal and High), and Output sets the filter volume. The EXP/CV input accepts CV control (~0-3.0v) or an expression pedal for external control of the Filter Freq knob, which sets the range for the input.
