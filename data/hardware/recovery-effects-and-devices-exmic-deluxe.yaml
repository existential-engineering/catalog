details: |-
  EXMIC DELUXE TELEPHONE MICROPHONE

  (Microphone and Preamp)

  The ExMic Deluxe blends the nostalgia of a vintage telephone with the power of modern technology. This device is a microphone and a preamp, offering endless possibilities for capturing and shaping your sound. Plug in the handset, now transformed into a microphone with a 1/4" jack, and unleash your vocals through this eccentric, lo-fi creation. The ExMic Deluxe was specifically designed for this purpose, but this versatile device goes beyond vocals. Connect your guitar, bass, or synth to the converted base and experience the magic of boosted tones and uniquely shaped sounds. Let your creativity run wild as you experiment with unconventional techniques, such as using it as an overhead mic for your drums or placing it in the room to capture strange and unusual ambient sounds. The possibilities with the ExMic Deluxe are limitless! Designed and assembled in Seattle, Washington. FAQ's:

  - The input is on the left and the output is on the right. - The earpiece houses the microphone element, so you sing/speak into that end. - POWER SUPPLY: The ExMic needs a 9vdc, negative tip, Boss-style power supply with a maximum draw of 100ma to avoid noise issues (the actual draw is less than 10ma). Y
  - You may opt to buy the ExMic with or without the power supply. The power supply is sold separately here: Power Supply

  * ExMic Deluxe devices are made to order, with an estimated delivery time of 2-3 weeks. ExMic Deluxe Manual
