description: "The 1959 Modified's additional features ensure that this amp can
  adapt to any playing style, whether you're seeking Hendrix's dynamic depth or
  shaping your own unique tone. It delivers timeless rock sound with enhanced
  control at any volume. A reimagined version of the iconic 1959 'Plexi' with
  new modifications: a master volume control for high-gain crunch at any volume,
  a switchable bright cap for refined tonal control, and two switchable
  overdrive modes (diode and transistor clipping). Each 1959 Modified is crafted
  with precision at the Bletchley, England factory."
details: |-
  The 1959 Modified's additional features ensure that this amp can adapt to any playing style, whether you're seeking Hendrix's dynamic depth or shaping your own unique tone. It delivers timeless rock sound with enhanced control at any volume. Designed and engineered in UK. Made in UK.

  The modified amp culture, driven by dedicated musicians and gear enthusiasts, led Marshall to reimagine the iconic 1959 model with new features that stay true to its legendary tone while expanding its versatility for modern players.

  Feel the authentic sounds of the 'Plexi' that resonated with the likes of Jimi Hendrix, Cream, and The Who. Using the 1959's newfound flexibility, carve out new creative possibilities and tailor your tones to perfection.

  The new master volume control lets you achieve high-gain crunch at any volume, while a switchable bright cap provides tonal flexibility. With two overdrive modes, it blends classic sound with versatility, making it ideal for today's guitarist.

  Each 1959 Modified is crafted with precision at Marshall's Bletchley, England factory, to uphold the legacy of the original amp while adding its new, modern features.
specs: |-
  - Master volume control lets you enjoy this amp's renowned high-gain crunch at any volume level, ideal for home, studio, or stage
  - A switchable bright cap for refined tonal control, allowing you to fine-tune the high frequencies for either a sharp, vintage brightness that cuts through the mix or a smoother, warmer tone
  - The gain boost enables you to switch to classic breakup or engage a higher-gain mode for aggressive tones with two overdrive modes (diode clipping and transistor clipping)
  - Channels: Two (with shared EQ controls)
  - Technology: Valve
  - Output wattage: 100W
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16 ohm / 8 ohm / 4 ohm load
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter), and 4 x EL34
  - Controls: Treble, middle, bass, and presence
  - Weight: 21 kg / 46.3 lb
  - Width: 741 mm / 29.2"
  - Height: 294 mm / 11.6"
  - Depth: 210 mm / 8.7"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Colour: Black
