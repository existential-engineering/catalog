description: This snare drum is a great example of what the S.L.P. series
  concept is all about. The combination of this choice hardwood shell, Super
  Sensitive Hi-Carbon Snare Wire , and triple-flanged Sound Arc Hoop results in
  a fully open and resonant sounding drum.
details: |-
  Sound Arc Hoop: S.L.P. Classic Maple snare drum will be fitted with our new Sound Arc Hoops, inspired by the so-called "stick saver hoops" which were used on select vintage snare drums. The edges of the Sound Arc Hoops bend inward to enhance the natural tone of the drum and offer increased sensitivity, precision, and control.

  20 Strand Super Sensitive Hi-Carbon Steel Snare Wire: In order to provide a more crisp and sensitive sound, we redesigned our Snare Wires using new materials, customizing the shape of the plate, and changing the wire coils' winding pattern. As a result, the "Super Sensitive Hi-Carbon Snare Wire” fits more closely to the snare side head, providing greater sensitivity and brighter, crisper sound.
