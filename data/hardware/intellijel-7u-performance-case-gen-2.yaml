description: Have modular. Will travel. Studio, cafe, stage, floor, coffee
  table—the 7U Performance case doesn't care where you play with it. Two 3U rows
  house and power all the modules you love, while the additional 1U row
  accommodates an extensive selection of specialized utility modules.
details: |-
  The 7U Performance Case Gen-2 is the ultimate base for a portable, performant Eurorack system, building on the features that made the first generation popular with professionals and hobbyists.

  Each of the two 3U rows and the repositionable 1U row is 104HP wide, and the TPS135 MAX power supply has enough headers to connect 34 modules without flying-bus cables.

  Eight rear 1/4-inch TRS Neutrik jacks provide balanced mono, unbalanced stereo, or send/return connections to mixers, FX, and other audio gear, while three full-size 5-pin DIN MIDI jacks (In/Out/Thru) plus a USB-C MIDI port cover MIDI connectivity.

  The solid aluminum frame has an ergonomic carrying handle, an anodized aluminum lid with an internal locking latch system, and retractable glass-filled nylon legs that support the case at two angles or flat. VESA mounting holes (M4, 100mm x 100mm) allow attachment to a monitor arm or stand.

  Spring-loaded latching accessory slots on the top and bottom let two cases be joined with a pair of 7U Joiner Plates, and rails can be repositioned to place the 1U row at the top, middle, or bottom of the case.
specs: |-
  - 104HP per row; two 3U rows plus one repositionable 1U row (top/middle/bottom)
  - TPS135W MAX power supply: 34 shrouded power headers
  - +12V output at 6A (72W max), -12V output at 5A (60W max), +5V output at 2A (10W max)
  - Included Meanwell 90W AC/DC adapter (85W usable across 3 rails)
  - Module depth: 73mm; 50-62mm above power supply; 43-62mm above audio/MIDI boards
  - Dimensions w/ Lid: 556.5 x 352.9 x 146.4mm; w/o Lid: 556.5 x 352.4 x 79.6mm
  - Weight: 4.74kg with lid and power adapter (5.5kg boxed for shipping)
  - VESA mount (M4, 100mm x 100mm pattern)
