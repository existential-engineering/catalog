description: Enter a world of exquisite sound and elevated enjoyment of all your
  home entertainment sources without overwhelming your décor. STEREO 70s
  incorporates the technologies found in full-size surround sound home theaters
  with the simplicity and elegance of a two-channel stereo system.
details: |-
  Enter a world of exquisite sound and elevated enjoyment of all your home entertainment sources without overwhelming your décor. STEREO 70s incorporates the technologies found in full-size surround sound home theaters with the simplicity and elegance of a two-channel stereo system.

  A discrete Class A/B power amplifier drives two channels at 75 W into 8 ohms (20 Hz to 20 kHz, 0.08%), 100 W into 6 ohms and 150 W into 6 ohms in single-channel drive.

  Six HDMI inputs, three of them 8K capable, feed one HDMI output with ARC, HDCP 2.3 support, 1080p/4K to 8K upscaling, ALLM, VRR and QFT pass-through, and HDR, HLG, Dolby Vision, HDR10+ and Dynamic HDR video dynamic range.

  HEOS multi-room streaming, AirPlay 2, Bluetooth with re-transmission to headphones, Spotify Connect, TuneIn internet radio and Roon Tested certification cover the network side, alongside a moving magnet phono input and an AM/FM tuner.

  Pre-outs cover a 2.2 channel main output with two independent subwoofer outputs plus a Zone 2 analogue output, and the four speaker terminals support an A/B pair arrangement.
specs: |-
  - 2 powered channels, discrete Class A/B power amplifier
  - Power output: 75 W (8 ohm, 20 Hz to 20 kHz, 0.08%, 2 channel drive)
  - Power output: 100 W (6 ohm, 1 kHz, 0.7%, 2 channel drive), 150 W (6 ohm, 1 kHz, 10%, 1 channel drive)
  - HDMI in / out: 6 / 1
  - 3 inputs support 8K
  - HDCP 2.3
  - ARC
  - HDMI upscaling 1080p/4K to 8K
  - HDMI pass-through in standby
  - ALLM, Variable Refresh Rate and Quick Frame Transport supported
  - Video dynamic range: HDR, HLG, Dolby Vision, HDR10+, Dynamic HDR
  - Analog in: 3
  - phono (MM) in
  - digital in: 1 optical, 1 coaxial
  - Multichannel preamp out: 2.2
  - subwoofer out: 2
  - multi-room out: 1 analog
  - Number of speaker terminals: 4, Speaker A / B
  - USB audio: USB-A (host)
  - AM/FM tuner
  - Pure Direct mode
  - gold plated RCA terminals
  - HDAM
  - Lossless formats: FLAC HD 192/24, WAV 192/24, ALAC 192/24
  - DSD 2.8 / 5.6 MHz
  - Compressed Audio Enhancer MDAX2
  - gapless playback
  - HEOS multi-room and streaming
  - AirPlay 2
  - Spotify Connect
  - Roon Tested
  - Ethernet, Wi-Fi and Bluetooth, including Bluetooth re-transmit with volume control
  - Multi-room zones: 1
  - zone audio output: preout only
  - Voice assistant compatibility: Alexa, Google Voice Assistant, Apple HomePod, Josh.ai
  - System remote control: RC-052SR
  - Power consumption: 210 W
  - standby: 0.2 W
  - network standby less than 2.0 W
  - Dimensions without antenna (W x D x H): 17.4 x 14.7 x 4.3 in
  - In the box: main unit, remote control, batteries, AM/FM antennas, wire labels, quick start guide, 2 external detachable antennas, AC cord
  - UPC code: 747192140267
