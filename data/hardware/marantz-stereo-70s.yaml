name: Stereo 70s
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/amplifiers/stereo-70s/300789.html
description: Slimline Stereo Receiver Powered by HEOS with 75W, 8K and 6 HDMI
  Inputs. The STEREO 70s merges flexibility and features from full-size surround
  sound home theaters into a slim, simple 2-channel receiver with elegant design
  suitable for any decor.
details: |-
  Enter a world of exquisite sound and elevated enjoyment of all your home entertainment sources without overwhelming your decor. The STEREO 70s merges flexibility and features from full-size surround sound home theaters into a slim, simple 2-channel receiver with elegant design suitable for any decor.

  Slim and Elegant Design: Timelessly elegant engineering in a compact chassis that fits where standard equipment cannot.

  High Resolution Audio: Supports crystal-clear digital decoding up to 192 kHz 24-bit audio and DSD, providing immersive sound with depth and clarity.

  Sound Master Tuned: Meticulously tuned for amazing performance through careful parts selection to achieve the Most Musical Sound.

  Home Cinema from Two Channels: Merges CINEMA Series AVR flexibility with 8K HDMI plus ARC support, on-screen display via TV, and support for up to 2 subwoofers.
specs: |-
  - 2 powered channels
  - 75W per channel (8 ohm, 20 Hz-20 kHz, 0.08% 2ch)
  - 100W (6 ohm, 1 kHz, 0.7% 2ch)
  - 150W (6 ohm, 1 kHz, 10% 1ch)
  - Class A/B topology
  - Discrete power amplifier with custom HDAM
  - 6 HDMI inputs (3 support 8K)
  - 1 HDMI output with eARC
  - HDCP 2.3 support
  - 1080P/4K to 8K upscaling
  - HDR/HLG/Dolby Vision/HDR10+/Dynamic HDR support
  - ALLM (Auto Low Latency Mode) for gaming
  - Variable Refresh Rate / Quick Frame Transport
  - Dimensions: 17.4" W x 14.7" D x 4.3" H
  - Power consumption: 210W operating, 0.2W standby, 0.5W CEC standby, <2.0W network standby
  - Audio format support: MP3, WMA, AAC (lossy); FLAC, WAV, ALAC (192/24 lossless); DSD (2.8/5.6 MHz)
  - MDAX2 compressed audio enhancer
  - Gapless playback
  - Pure Direct Mode
  - Gold-plated RCA terminals
  - OLED front display
  - Firmware updates via network/USB
  - Setup Assistant
  - ECO Mode, auto power-off, sleep timer
  - Ethernet, Bluetooth, Wi-Fi, AM/FM tuner, HEOS built-in
  - Speaker A/B switching (4 speaker terminals)
  - 5-year warranty
