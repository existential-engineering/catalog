description: 8-inch two-way passive composite loudspeaker from the Electro-Voice
  ZX Series, delivering smooth full-range response with 100 x 100 degree
  coverage in a compact, monitor-friendly wedge enclosure suitable for mains,
  fills, or stage monitors.
details: >-
  The ZX1 is the 8-inch passive model in Electro-Voice's ZX Series of compact
  full-range loudspeakers. It pairs a long-excursion weather-treated EV8L 8-inch
  (203 mm) woofer with a DH2005 1.25-inch (25.4 mm) compression driver behind a
  rotatable 90 x 50 degree horn that can be reoriented to suit horizontal or
  vertical mounting, while the cabinet's symmetrical horn placement also gives
  the box a nominal 100 x 100 degree coverage pattern.


  The enclosure is molded from high-impact polypropylene with a polyester
  powder-coated galvanized steel grille, and its compact wedge shape is intended
  to double as a stage floor monitor. An integrated 35 mm pole-mount adapter,
  pocket handle, and four metric M6 suspension inserts support portable PA,
  fixed-install, and small-format monitor use. Available in black or white.


  As a passive loudspeaker the ZX1 requires external amplification, with signal
  connected via a Neutrik NL4 Speakon connector on the rear panel; a passive
  crossover at 1.7 kHz with full-band overload protection is built into the
  cabinet.
specs: |-
  - Configuration: 2-way passive full-range loudspeaker
  - LF driver: EV8L 8 in (203 mm)
  - HF driver: DH2005 1.25 in (25.4 mm) compression driver
  - Crossover frequency: 1.7 kHz
  - Frequency response (-3 dB): 60 Hz - 20 kHz
  - Frequency range (-10 dB): 48 Hz - 20 kHz
  - Maximum SPL: 121 dB calculated / 123 dB peak
  - Power handling: 200 W continuous / 400 W program / 800 W peak
  - Nominal impedance: 8 ohms (6 ohms minimum)
  - Axial sensitivity: 92 dB SPL (1 W @ 1 m)
  - Coverage pattern: 100 degrees H x 100 degrees V
  - Horn: Rotatable 90 x 50 degree
  - Recommended high-pass filter: 40 Hz
  - Connectors: Neutrik NL4 Speakon
  - Enclosure: High-impact polypropylene
  - Grille: Polyester powder-coated galvanized steel
  - Suspension: Four metric M6 inserts; 35 mm pole-mount socket
  - Dimensions (H x W x D): 457 x 282 x 264 mm (17.98 x 11.12 x 10.38 in)
  - Net weight: 8.4 kg (18.5 lb)
  - Shipping weight: 10.2 kg (22.5 lb)
  - Finishes: Black or white
