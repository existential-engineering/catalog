details: |-
  Electromatic Jet Club models feature arched maple tops with chambered basswood bodies and bolt-on maple necks with rosewood fingerboards. The G5425 Jet Club has a single-cutaway chambered basswood body with an arched maple top that resonates true to 'That Great Gretsch Sound,' with a two-tone body color scheme (Black or Silver top with Walnut-stained back and sides).

  Features include Gretsch dual-coil humbucking pickups that ensure luscious tone, 22 medium jumbo frets, anchored Adjusto-Matic bridge and stop tailpiece that ensure vibrant sustain, Neo-Classic thumbnail fingerboard inlays, G-arrow knobs and white pearloid Gretsch-logo pickguard.
