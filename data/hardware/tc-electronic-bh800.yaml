details: |-
  BH250 was a true innovation within the world of bass. Bass players were floored by how such great tones could be contained in an enclosure so small and lightweight, that they immediately cried out for more. So that's what we decided to do. With the BH800 you get 800 Watts of raw power, and all the punch and creative features your heart could possibly desire without compromising with the super portable and lightweight build that made the original BH250 such an innovative amp. And with the intelligent EQ section and the option of driving several cabs at once, BH800 is the new natural choice for every modern bass player out there    •    TonePrint - For a world of signature effects    •    Ultra-lightweight    •    800 Watt

  TonePrint: Creativity at the Core

  With the BH800's two TonePrint slots, you become the amp designer! So whether you need a lush chorus and a compressor for that next funk gig, or maybe a monstrous distortion and an octaver for your upcoming show with your metal band, BH800 will have you covered, and then some! TonePrint simply means signature effects, created by some of the world's best bass players, for instance Nathan East, Victor Wooten, Richard Bona and Duff McKagan. And, as if that wasn't enough, they are available for free, straight from your smartphone. Finally an amp that's as versatile as you need it to be!

  High-Tech Sledgehammer
