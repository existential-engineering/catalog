details: |-
  A New Look!

  Meet the PLETHORA X1 Neo, the same powerful, shape shifting multi-FX unit you know and love, now reimagined in a sleek new black finish. It’s everything the original was, but bolder, darker, and ready to make a statement on any stage or studio desk. The Neo keeps all 14 dynamic effects and that intuitive one-switch control but wraps it in a modern, stealth-inspired design that feels every bit as premium as it sounds. Same versatility. Same sonic muscle. A new attitude.

  A Box of Sonic Steroids

  PLETHORA X1 is a dedicated TonePrint loader that covers the entire range of TonePrint pedals. Sonic stompbox-sized flexibility is simply an understatement. Depending on your needs and current projects, let PLETHORA X1 be an ambient and flavorful reverb - until you need it to be a slapback echo for an upcoming rockabilly gig.   Effects include: Hall of Fame 2 Reverb, Flashback 2 Delay, Helix Phaser, Viscous Vibe, Sub n Up Octaver, Brainwaves Pitch Shifter, Corona Chorus, Hypergravity Compressor, Mimiq Doubler, Vortex Flanger, Pipeline Tap Tremolo, Quintessence Harmony, Sentry Noise Gate and Shaker Vibrato.

  Five Ways to Stomp
