details: |-
  Meet the new Accent: the gateway to the Ludwig family. Series updates include stylish new finishes, new keystone badges, and the classic script logo front and center.

  Whether you're taking your first lessons, returning to the kit, or adding a reliable practice setup, Accent delivers the tone, feel, and durability that make playing drums inspiring from day one.

  Accent series drums are the complete drum package for today's aspiring drummer. An all-inclusive 5-piece drum set that provides everything you need to start your journey to becoming a drummer.

  Master the fundamentals, rehearse your favorite songs, and explore creative ideas on a drum set designed to deliver the right balance of quality at an accessible price. A solid foundation right from the start.
specs: |-
  - 5-piece shell pack
  - 3-piece cymbal pack
  - 5-piece hardware pack including throne
  - 5-ply select hardwood shells
  - 45-degree bearing edges
  - Drive outfit: 16x22 bass drum, 16x16 floor tom, 9x12 tom, 8x10 tom, 5x14 snare
  - Fuse outfit: 14x20 bass drum, 14x14 floor tom, 9x12 tom, 8x10 tom, 5x14 snare
  - Available finishes: Jade Dust, Moon Dust, Snow Dust
