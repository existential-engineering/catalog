description: >-
  Korg's original touchpad-based effects processor offering six simultaneous real-time effects
  controlled through an intuitive X/Y pad interface, designed for DJs and live performers.
details: |-
  The original KAOSS Pad introduced Korg's innovative X/Y touchpad concept for real-time effects manipulation. By simply dragging a finger across the touch surface, performers can intuitively control multiple effect parameters simultaneously, making it an immediately expressive tool for DJs and electronic musicians looking to add dynamic processing to their performances.

  The KP1 functions as a dedicated real-time effects processor without the sampling or synthesis features added in later revisions. Its straightforward approach focuses entirely on effect manipulation, with six effects running simultaneously and a selection of filter, delay, reverb, flanger, phaser, distortion, and modulation programs accessible through a dedicated selector.

  MIDI connectivity allows the KAOSS Pad to integrate with other equipment, outputting control data from the touchpad movements and syncing to external clock sources. The unit established a product line that would evolve significantly through the KP2 and KP3 revisions, adding sampling, synthesis voices, and expanded memory, but the original remains a focused and effective performance effects tool.
specs: |-
