description: A three-channel passive mixer with DC-coupled inputs, suitable for
  mixing CVs and modular-level audio signals.
details: |-
  A three-channel passive mixer - handy to fill in an annoying gap in your set up as well as doing something useful (well, hopefully). The inputs are DC-coupled, so you can mix CVs without having any DC bias removed but bear in mind that the mixing resistors will lead to some signal attenuation which may need to be compensated for further down the signal chain. It'll handle modular-level audio signals as well, subject to the caveat above. This module is functionally identical to its predecessor, except that it now has a black faceplate with gold ENIG lettering,

  IF YOU'RE PLANNING TO MIX CVs THAT FEED INTO A VCO, THIS MODULE PROBABLY ISN'T WHAT YOU WANT - an active mixer would be better for that. Mixing resistors are 10k by default - if you'd prefer a different value then you can either do it yourself (you'll need to be confident with surface-mount soldering) or I can do it for you, subject to an additional customisation fee.
