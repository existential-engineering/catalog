name: TH919
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th919/
description: Open-back premium headphones that inherit the TH900 series
  character while completely revamping the driver, housing and structure. The
  solid hard maple housing carries a Japanese Urushi lacquer finish and an
  aluminum opening based on a Kumiko geometric pattern.
details: |-
  Since its release in 2012, the TH900 series has been Fostex's flagship model, captivating many audio enthusiasts with its BioDyna driver's sound quality and the texture of its lacquered housing. The TH919 inherits these qualities while completely revamping everything from the driver and housing to the structure.

  The BioDyna driver, acclaimed for its high resolution and smooth sound quality, has been significantly upgraded. A newly developed edge improves amplitude stability, enabling tight and well-defined low frequencies without excessive expansion. Suppressing unwanted resonance eliminates muddiness caused by extraneous noise, achieving a natural and smooth midrange, with transparent mids and lustrous high frequencies.

  Magnesium alloy is used for mechanical parts such as the housing base plate and hanger, reducing overall weight by 20% compared to aluminum. Rubber packing is used for the rotation mechanism to eliminate excess vibration.

  The solid hard maple housing is finished with a lacquer craft developed by Sakamoto Otozo Shoten. The open-type TH919 uses aluminum finished with matte anodizing based on a geometric pattern inspired by Kumiko woodwork on the housing opening, a precise two-layer structure with laser-cut mesh processing, and adjustment of the opening rate and internal components, reproducing a natural sound field with high resolution and minimal listening fatigue.

  The new ear pads are designed with a slanted surface that optimizes the fit, with two-layer low-resilience urethane and silk protein synthetic leather three times more durable than conventional materials. The head pad and headband are natural sheepskin. The internal wiring and included unbalanced cable use 7N (99.99999%) grade high-purity OFC cable, and a separate 4.4 mm balanced cable (ET-TH4.4BL2Y) is available.
specs: |-
  - Type: Open-back dynamic
  - Driver: 50 mm neodymium magnet / BioDyna diaphragm
  - Impedance: 25 ohm
  - Sensitivity: 100 dB/mW
  - Maximum input: 1,800 mW
  - Frequency response: 12.5 to 45,000 Hz
  - Weight: Approx. 385 g (excluding cable)
  - Housing: Solid hard maple with Urushi lacquer finish, matte anodized aluminum Kumiko-pattern opening
  - Connectors: 2-pole 3.5 mm on each housing
  - Cable: 3.5 mm (2-pole) x2 to 6.3 mm (gold-plated 3-pole) 2 m, 7N (99.99999%) grade high-purity OFC unbalanced cable x 1
  - Accessories: Synthetic leather pouch, safety precautions
  - Optional balanced cable: 4.4 mm ET-TH4.4BL2Y
  - Magnesium alloy mechanical parts, natural sheepskin head pad and headband
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
