name: TH919
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th919/
description: Flagship open-back dynamic premium headphone in the TH Premium
  Series, evolving the TH900 lineage with a redesigned 50 mm BioDyna driver,
  magnesium-alloy mechanical structure, and hard maple housing finished in
  traditional Japanese 'Urushi' lacquer. The open-type design uses a precise
  two-layer laser-cut mesh and Kumiko-inspired aluminum opening on the housing,
  paired with silk-protein synthetic leather ear pads and a natural sheepskin
  head pad for an extended, high-resolution, low-fatigue presentation.
details: |-
  Series: TH Premium Series

  Configuration: Open-back dynamic, over-ear

  Features:
  - Upgraded 50 mm BioDyna diaphragm with improved edge for tight, well-defined bass
  - Magnesium-alloy mechanical parts (approx. 20% lighter than aluminum equivalents)
  - Hard maple housing with Japanese traditional 'Urushi' lacquer 'foil pattern' finish (Sa-kamoto Otozo Shoten)
  - Kumiko-inspired aluminum housing opening with two-layer laser-cut mesh (open-type acoustic design)
  - Silk-protein synthetic leather ear pads (approx. 3x more durable than previous generation)
  - Natural sheepskin head pad and headband
  - Detachable cable system (3.5 mm 2-pole per side)
  - Includes 7N (99.99999%) high-purity OFC unbalanced Y cable
  - Optional 4.4 mm balanced cable available (ET-TH4.4BL2Y)
