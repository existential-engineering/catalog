url: https://www.mrblackpedals.com/products/ambience-reissue
description: A reissue of the Ambience delay, pairing two syncopated,
  independently modulated echoes drifting into a soft reverb.
details: |-
  The Ambience can be used just like a normal delay pedal, but there is more
  happening under the hood that gives it its feel and tone. Start with a delay
  pedal, add a second, syncopated echo tap, and then modulate them both
  independently.

  Those two modulated echoes drift into a soft reverb, producing the delicate
  atmospheric wash the pedal is known for. It works well both as a standard
  delay and as a source of ambient texture.

  This reissue was produced by popular demand as a limited run for Mr. Black
  Friday 2024. The Ambience is a Jack Deville original design.
specs: |-
  - Delay pedal with a second syncopated echo tap
  - Both echoes independently modulated
  - Echoes drift into a soft reverb
