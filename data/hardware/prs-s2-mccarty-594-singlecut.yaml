details: |-
  The S2 McCarty 594 Singlecut delivers vintage appointments with the precision of PRS’s modern manufacturing techniques and trusted craftsmanship. Whether you are looking for authentic humbucking tones or nuanced, sweet single-coil sounds, the S2 McCarty 594 Singlecut can seamlessly master both sonic territories thanks to its Maryland, USA-made PRS 58/15 LT pickups and dual volume and push/pull tone controls.

  The warm, familiar tone of the S2 McCarty 594 Singlecut is further supported by its construction specifications and design. Featuring a bound 22-fret Pattern Vintage neck and slightly thicker back for more sustain, the S2 McCarty 594 Singlecut feels and sounds like a guitar you’ve been playing forever. It plays in tune, stays in tune, and is intonated the entire length of the neck. A zinc two-piece bridge with brass saddles and steel studs, bone nut, and PRS Phase III tuners with brass shafts anchor this guitar, promoting tuning stability and sustain.

  Designed to capture the heart of the McCarty family of instruments and stay true to the S2 Series spirit, the S2 McCarty 594 Singlecut redefines the feel of vintage.
