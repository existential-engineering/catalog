details: |-
  The disting EX is a multifunction Eurorack module, building on the rich legacy of the previous disting incarnations. It can operate as two souped-up disting mk4s, or as a single powerful module in its own right.

  It is fully DC-coupled, so all inputs and outputs can carry CVs or audio depending on the selected function. The functions on offer include audio processing such as filters and delays, CV processing and generation such as quantizers and pattern generators, oscillators including VCOs and LFOs, and sample playback.

  Features new to the disting EX include an eight voice polyphonic sample (WAV) player, a powerful stereo tape delay based on Expert Sleepers' own Augustus Loop, and a dedicated WAV recorder mode. Added since launch are a full-featured polysynth, a granulator, and implementations of the popular Braids, Rings and Plaits modules.

  Acting as two disting mk4s, the disting EX offers a higher sample rate of 96kHz, much more RAM so that delays and reverbs can be much longer, lower latency when triggering samples at 700 microseconds, and an OLED display.
specs: |-
  - Sample rate: 96kHz
  - Sample triggering latency: 700 microseconds
  - OLED display
  - Fully DC-coupled inputs and outputs
  - Eight voice polyphonic WAV sample playback
  - Dedicated WAV recorder mode
  - Stereo tape delay based on Augustus Loop
