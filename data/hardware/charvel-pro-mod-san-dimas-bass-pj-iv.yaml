description: The Pro-Mod San Dimas Bass PJ IV pairs throwback Charvel DNA with
  modern, high-performance appointments for players seeking a versatile hot-rod
  4-string. An alder body and caramelized maple neck are loaded with a DiMarzio
  PJ pickup pair, push/pull active/passive volume and a 3-band active EQ.
details: |-
  Built on Charvel's classic San Dimas Bass platform, the Pro-Mod San Dimas Bass PJ IV is a 4-string instrument designed for players who want vintage feel with modern fire-breathing capability. A resonant alder body in a Sonic Blue gloss finish anchors the instrument with balanced tone and a familiar hot-rod silhouette.

  The bolt-on caramelized maple neck is reinforced with graphite for stability, with a 34" scale length and a 12"-16" compound-radius caramelized maple fingerboard. Twenty jumbo frets, a Graph Tech TUSQ XL nut measuring 1.5" wide, cream dot inlays and Luminlay side dots support fluid playability on stage or in low-light conditions.

  Electronics are anchored by a DiMarzio PJ pickup configuration: a DiMarzio Model P DP122 in the middle position paired with a DiMarzio Model J DP123 at the bridge, both in cream. A push/pull volume control switches between active and passive modes, while a blend knob and 3-band active EQ (active only) deliver wide tonal range from punchy traditional voicings to scooped, modern slap tones.

  Hardware is dressed in chrome, with a Charvel HiMass bridge for sustain and articulation, plus Charvel open-gear tuning machines for vintage-styled tuning stability. Factory-strung with nickel-plated steel .045-.100 gauges, the right-hand 4-string ships ready to play.
