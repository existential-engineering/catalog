details: |-
  Cardioid pattern with high feedback resistance

  Studio grade Neumann condenser capsule

  For Sennheiser SKM 2000/6000/9000 and EW G4 300/500 and EW-D wireless systems

  Neumann sound for Sennheiser SKM 2000/6000/9000 and also EW G4 300/500 wireless systems

  Tight cardioid pattern without off-axis coloration

  Feedback resistant, high rejection of rearward sound (180°)

  Unaffected by extreme sound pressure levels

  Built-in pop protection, low handling-noise

  Easy cleaning
specs: |-
  - Directional Pattern: Cardioid
  - Frequency Range: 40 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 2.8 mV/Pa ± 1 dB equ. 51 dBV
  - Equivalent noise level, CCIR: 35 dB
  - Equivalent noise level, A-weighted: 24 dB-A
  - Maximum SPL for THD 0.5%: 150 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 59 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 70 dB-A
  - Weight: approx. 500 g (incl. transmitter + power supply unit)
  - Diameter: 55 mm
  - Length: 272 mm (incl. SKM 2000)
