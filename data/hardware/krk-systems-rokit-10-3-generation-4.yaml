details: |-
  KRK's thunderous 10" KRK ROKIT RP103 G4 (Generation 4) tri-amp professional monitor brought music and sound creativity to a new industry-level when introduced in 2019. A tri-amp monitor ingeniously built for those needing to hear the depths of their productions clearly on every frequency range. A DSP-driven Graphic EQ and 25 settings help condition your acoustic environment while offering new levels of versatility in a studio monitor. Matching drivers (10", 4.5", 1") made with Kevlar ensures the same sonic integrity across all frequencies, minimizes listening-fatigue, and offers an incredibly balanced listening experience. A new scientifically designed speaker enclosure and front-firing port offer exceptional low-end extension and accuracy, punch and flexible room-positioning. The new powerful, yet efficient custom Class D power amplifier drives the speakers evenly and more efficiently at reduced operating temperatures and improves audio integrity.

  KRK App

  Real-time spectral analysis to tune the monitors. Compatible with Android and iPhone. Aids with monitor placement, level matching, subwoofer level and more.

  Built in Brickwall Limiter

  Automatically engages at maximum amp-level to maintain a balanced sound, protect the system, and offer better and wider dynamics.

  Systematically designed low resonance enclosure

  Offers minimal distortion and a wide sweet-spot with deep and dynamic imaging.

  High density Iso-foam pad

  Minimizes vibration transmission for improved clarity.
specs: |-
  - Drivers: Matching Kevlar drivers, 10", 4.5" and 1", the 4.5" and 1" rotatable for vertical or horizontal placement
  - Amplifier Configuration: Tri-amplified (Class D)
  - Frequency Response: 26Hz - 40KHz
  - Max SPL: 112 dB
  - Power Output: 300 Watts
  - Input Impedance: 5.12KΩ Balanced
  - Analog Input: Balanced TRS/XLR combo jack
  - DSP-driven graphic EQ with 25 settings and LCD display
  - Built-in brickwall limiter
  - Front-firing bass port
  - Includes high density Iso-foam pad
  - Height: 21.50" / 546 mm
  - Width: 12.95" / 329 mm
  - Depth: 14.6" / 371 mm
  - Weight: 35.05 lb / 15.9 kg
