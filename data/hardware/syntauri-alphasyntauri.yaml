description: >-
  The alphaSyntauri was the first affordable digital synthesizer, released in
  1980 by Syntauri Corporation at around $1,500 (Apple IIe not included). It
  combined an Apple II computer with specialized music synthesis hardware and
  software, offering computer-based synthesis at a fraction of the cost of
  competitors like the Synclavier and Fairlight. Notable users included Herbie
  Hancock and Laurie Spiegel.
details: |-
  The alphaSyntauri represented a paradigm shift two decades before software synthesizers became standard. While competitors like the Synclavier and Fairlight charged approximately $40,000, this system offered comparable functionality at a fraction of the cost. It was most popular in academic settings where Apple II systems were already commonplace, although it did make its way into a handful of professional recordings.

  The system's sound was distinctly digital and abrasive by design. Its 8-bit waveforms and utter lack of any analog processing gave it a fiercely aggressive digital character, a premonition of the first Ensoniq instruments to come a half-dozen years later. A unique feature allowed users to draw custom waveforms using the software, providing sampling-like capabilities without an actual sampler.

  The alphaSyntauri was built around the Mountain Computer Music System dual oscillator card installed in an Apple II or IIe. It shipped with alphaPlus performance software and the MetaTrak 16-track sequencer capable of recording up to 7,000 notes. Keyboard options included a 49-key non-velocity-sensitive model or a 61-key velocity-sensitive model.

  Syntauri Corporation folded in 1984, and support ended by 1988 as Apple II technology became obsolete. Intact systems are difficult to find today, with the keyboard interface card being the most commonly missing component.
specs: |-
  - Synthesis type: Digital (8-bit)
  - Polyphony: 16 digital oscillators / 8 stereo voices
  - Multitimbrality: 8-part
  - Memory: 64 KB (host system dependent)
  - Envelope: ADSR
  - Sequencer: MetaTrak (16-track, up to 7,000 notes)
  - Keyboard: 49 keys (non-velocity) or 61 keys (velocity-sensitive)
  - Control: Apple II paddle controllers, light pen
  - Core hardware: Mountain Computer Music System dual oscillator card
  - Filter: None
  - LFO: None
  - Effects: None
