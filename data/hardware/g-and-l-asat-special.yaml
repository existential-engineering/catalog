details: |-
  The G&L ASAT Special just might be the quintessential G&L guitar, viewed by many as Leo's ultimate single-cutaway. Back in 1985, Leo Fender launched this model under the G&L Broadcaster name, which prompted a response from Fred Gretsch of Gretsch Guitars over the name just as it had thirty-five years earlier. History buffs will recall that the Broadkaster name is owned by Gretsch, and once again, a Broadcaster from Leo was required to have its name changed. This time around, the name became "ASAT" which is US military shorthand for an "Anti-Satellite" missile.

  The ASAT Special, as the model became known, features jumbo single-coil Magnetic Field Design pickups, each with a narrow bobbin aperture for a coil which is shallow yet wide. In this regard, an MFD jumbo single coil is similar to a P-90 or Jazzmaster pickup, yet the MFD principle provides a punchier bottom end and brighter top end sparkling with harmonics. Leo further departed with the past with the addition of his innovative Saddle-Lock bridge which transfers string energy right into the body end-grain for an incredibly resonant instrument. The result is one of the most versatile guitars ever, serving up ballsy twang to searing blues to smooth jazz tones. This ASAT Special is also offered in either a Poplar or Swamp Ash top on poplar body.

  The Tribute Series ASAT Special brings the magic of Leo's own reinterpretation of the single-cutaway bolt-on guitar, all at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed jumbo G&L MFD single coils
  - Body wood: Poplar and Swamp Ash top on Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 9-1/2"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Controls: 3-position pickup selector, volume, tone
  - Available in: Gloss Black over Poplar, tortoise pickguard, Maple fingerboard
  - Available in: Surf Green over Poplar, 3-ply white pickguard, Maple fingerboard
  - Available in: Tobacco Sunburst over Swamp Ash top on Poplar, tortoise pickguard, Rosewood fingerboard
  - Available in: Antique Sunburst over Swamp Ash top on Poplar, 3-ply black pickguard, Rosewood fingerboard
