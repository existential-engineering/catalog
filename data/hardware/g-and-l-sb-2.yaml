description: Leo Fender packed his latest pickup and bridge designs into the
  SB•2 in 1982, a straightforward, hard-working bass on his own reinterpretation
  of the split-coil and single-coil pairing.
details: |-
  When Leo Fender launched the G&L SB•2 bass in 1982, he packed his latest innovations in pickup and bridge design into a straightforward, hard-working bass. For a player who prefers a less-is-more aesthetic but hungers for something meatier, the SB•2 is just the ticket.

  The SB•2 starts with a familiar shape, though subtle modifications to its sculpting make it more sleek and balanced. Strapped on, it immediately feels at home, yet somehow more comfortable than expected. The slim, C-shaped neck falls immediately to hand, checking in with a modern 12" radius and its 22 medium-jumbo nickel frets ready to deliver silky playability.

  Once the SB•2 has nestled into a player's comfort zone, it's time to experience just how far Leo evolved the classic duo of split-coil and single coil pickups. These Magnetic Field Design interpretations were created by Leo to give more gusto without losing detail and finesse. A simple dual-volume control setup allows any balance between the two, even backing off both volumes to dial in a more vintage flavor. What's more, the SB•2 features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  The Tribute Series SB•2 brings the magic of Leo's own reinterpretation of the P/J configuration, all at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: Leo Fender-designed G&L MFD split-coil (neck) and single coil (bridge)
  - Body wood: Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 1/2"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 21 medium jumbo, nickel
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: dual-volume
  - Available in: Black Frost over Poplar, 3-ply black pickguard, Rosewood fingerboard
  - Available in: Surf Green over Poplar, pearloid pickguard, Maple fingerboard
