description: Dynamic, transparent overdrive built around the JFET gain stages of
  the Katana Boost, with active tone controls and layered overdrive voicings.
details: |-
  The Katana Blues Drive is a musically rich and dynamic overdrive aimed at the most discriminating guitar player. It captures tube-like character with a transparency that lets the guitar's full tonal range through, while staying sensitive to the touch. Rolling the guitar volume back cleans the pedal up.

  The circuit takes the JFET gain stages of the Katana Boost and blends them with an overdrive section influenced by Keeley's own overdrive pedal modifications. Keeley describes it as the most expressive overdrive in the line to that point.

  Active tone controls and layered overdrive voicings give a thick, rich response that still lets the guitar's own tone come through. The design took more than thirteen years and incorporated customer feedback across that period, and it is presented as the evolution of Robert Keeley's first original overdrive.
