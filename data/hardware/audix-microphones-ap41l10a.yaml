  A value-packed bodypack diversity wireless system featuring the ADX10 cardioid miniature condenser microphone.

  The ADX10 is a lightweight, low-profile mic designed for lavalier applications such as speech, presentation, and theatrical production. With the ability to accurately capture and reproduce vocals from a comfortable distance of 4-8 inches, the ADX10 has a natural sound with an exceptional response that is resistant to feedback and easy to use.
