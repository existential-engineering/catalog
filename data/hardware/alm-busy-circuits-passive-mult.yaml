description: >-
  A compact 3HP passive multiple that routes audio or CV signals to up to four
  unbuffered outputs with no power consumption required. Features one 4-way and
  one 3-way passive multiple section, making it ideal for splitting signals in a
  Eurorack system.
details: |-
  The Passive Mult (ALM026) is a no-frills, zero-power signal splitter in the compact 3HP Eurorack format. It provides two independent passive multiple sections — one 4-way and one 3-way — allowing a single audio or CV signal to be distributed to multiple destinations without any active buffering or power draw.

  Because it is entirely passive, there is no signal conditioning, buffering, or amplification; the module simply connects jacks together electrically. This makes it ideal for distributing low-impedance signals such as gate pulses, audio, or control voltages over short distances, though users should be aware that loading multiple outputs may cause slight signal degradation compared to a buffered multiple.

  Originally debuted as part of the ALM System Coupe, the Passive Mult is now available as a standalone module in an anodised aluminium finish with a black anodic printed panel. Its skiff-friendly 32mm depth and zero power consumption make it a practical utility piece for any Eurorack system.
specs: |-
  - Format: Eurorack
  - Width: 3HP
  - Depth: 32mm
  - Power: +12V 0mA / -12V 0mA (passive, no power required)
  - Outputs: One 4-way section + one 3-way section (unbuffered)
  - Panel: Anodised aluminium with black anodic print
  - Warranty: 2 years
  - Made in England
