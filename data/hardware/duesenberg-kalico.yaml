details: |-
  The Kalico is a six-string lap steel built around a korina body and neck with a flamed maple top, combining a classic outline with the modern appointments Duesenberg fits to its lap steel range. The instrument measures 90 x 27 x 7.5 cm / 35.4" x 10.6" x 3" and is finished in PUR lacquer. The fingerboard is black anodized aluminium, the nut is a Duesenberg Roller Nut, and the nut width is 65 mm / 2.56" with 54 mm / 2.13" string spacing.

  The scale length is 610 mm / 24", shorter than Duesenberg's other lap steels, which the company says makes the instrument noticeably more compact and manageable to handle and play while keeping a more traditional form.

  Electronics are a single Duesenberg Split/King pickup, capable of producing both genuine single coil and genuine humbucker tone. A three-way mini toggle selects between three distinct tonal options, alongside one volume and one tone control.

  The bridge is the Duesenberg Multibender, a user-configurable string-bending system for harmonic up-bends and down-bends. It accepts up to five levers, with additional levers available separately, and each lever can be individually adjusted to raise or lower selected strings by a semitone or a whole tone, controlled with the heel of the hand while playing. Duesenberg describes the result as shifting chords from minor to major and creating a range of interval changes on the fly.

  A built-in Easy-Shift capo is fitted for changing keys: loosening the top thumbscrew lets the capo slide along the fretboard to the desired position before being tightened to lock in place, and an internal rail inside the fretboard keeps it attached at all times so it cannot be lost. Hardware is nickel finished with Duesenberg Z-Tuners, and the instrument ships with the Duesenberg Custom Line Case, a signed certificate of authenticity and all the required allen keys.
specs: |-
  - Body/Neck wood: Korina
  - Dimensions: 90 x 27 x 7,5 cm / 35,4" x 10,6" x 3"
  - Width at nut: 65 mm / 2.56"
  - Stringspacing: 54 mm / 2.13"
  - Fingerboard: Black anodized aluminium
  - Scale length: 610 mm / 24"
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Nut: Duesenberg Roller Nut
  - Bridge: Duesenberg Multibender
  - Plus: Duesenberg Easy Shift Capo
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 016/056 (016-018-026-036-046-056)
  - Pickup: Duesenberg Split/King
  - Wiring: 1 Volume, 1 Tone, 3-Way Tone Selector
  - Case: Custom Line Case (included)
  - Authenticity: Signed Certificate of Authenticity
  - Tools: All required allen keys (included)
