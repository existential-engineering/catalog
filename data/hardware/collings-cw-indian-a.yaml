description: The CW Indian A is a modified dreadnought acoustic guitar designed
  for flatpicking specialists, named after the Walnut Valley Festival in
  Winfield, Kansas. It features an Adirondack spruce top and bracing with an
  enlarged soundhole and pre-war scalloped X-brace construction. East Indian
  rosewood back and sides deliver strong projection for aggressive playing while
  maintaining Collings' signature tone.
details: |-
  The CW Indian A is the flatpicking-focused modified dreadnought, named in honor of the Walnut Valley Festival in Winfield, Kansas. It pairs an Adirondack spruce top with East Indian rosewood back and sides, delivering exceptional projection and volume suited to aggressive flatpicking styles. Pre-war scalloped X-bracing in Adirondack spruce enhances resonance and dynamic response. The neck is Honduran mahogany with a modified V profile and a 25 1/2" scale length. The ebony fingerboard features ivoroid binding, no inlay, and a 14" to 26" compound radius. Body binding is ivoroid with herringbone purfling, and the backstrip uses a 2-style zipper pattern. Hardware includes nickel Waverly tuners, an ebony belly-style bridge, bone nut and saddle, and ebony bridge pins with MOP dots.
specs: |-
  - Body Style: Modified dreadnought
  - Top: Adirondack spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Neck Profile: Modified V
  - Fingerboard: Ebony (no inlay)
  - Fingerboard Radius: 14" - 26" compound
  - Fingerboard Binding: .060" Ivoroid
  - Frets: Medium 18% nickel-silver
  - Scale Length: 25 1/2"
  - Nut: Bone, 1 23/32"
  - Saddle: Bone, cutthrough
  - Bracing: Pre-war scalloped X-brace, Adirondack spruce
  - Rosette: Ivoroid/tortoise/ivoroid & black/white purflings
  - Body Binding: Ivoroid with herringbone purfling
  - Backstrip: 2-style (Zipper)
  - Tuners: Nickel Waverly
  - Bridge: Ebony belly-style, 2 1/4" spacing
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Pickguard: Dalmatian
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
  - Strings: D'Addario EJ-17 (.013" - .056")
