description: The City Limits is a solid body electric guitar crafted from
  premium flamed maple and Honduran mahogany, built for tone and resonance. It
  features a hand-set extra long mortise and tenon neck joint for tonal
  complexity and sustain, paired with Lollar Standard Wind Imperial Humbuckers.
  The contoured body includes a swooping heel, elegant cutaway, and back comfort
  carvings finished in high gloss nitrocellulose lacquer.
details: |-
  The Collings City Limits is a handcrafted solid body electric guitar built in Austin, Texas. Its Honduran mahogany body is topped with premium flamed maple and bound in non-grained ivoroid. The extra long mortise and tenon neck joint delivers exceptional tonal transfer and sustain. The mahogany neck features a rosewood fingerboard with 12" radius, mother-of-pearl long dot inlays, and medium 18% nickel-silver frets at a 24 7/8" scale length and 1 11/16" nut width. Electronics include Lollar Standard Wind Imperial Humbuckers wired in 50s style with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware is nickel-plated throughout, including a Kluson ABR-1 bridge, Kluson stop tailpiece, and Gotoh tuners with Collings logo buttons. The guitar ships with a deluxe hardshell case and D'Addario NYXL1046 strings. Available in an extensive range of standard, non-standard, premium, and metallic finishes.
specs: |-
  - Body: Solid Honduran mahogany
  - Top: Premium flamed maple
  - Neck: Honduran mahogany
  - Neck joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard radius: 12"
  - Scale length: 24 7/8"
  - Nut width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: Mother-of-pearl long dots (5mm non-tapered)
  - Body binding: Non-grained ivoroid
  - Fingerboard binding: Non-grained ivoroid
  - Body dimensions: 13.5" width x 17" length x 1.875" depth
  - Total length: 38.5"
  - Pickups: Lollar Standard Wind Imperial Humbuckers
  - Wiring: 50s style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Bridge: Kluson ABR-1 (nickel-plated zinc with retaining wire)
  - Tailpiece: Kluson stop tailpiece (nickel-plated zinc, steel studs)
  - Tuners: Gotoh with Collings logo (nickel)
  - Peghead veneer: Ebony with mother-of-pearl Collings logo
  - Peghead profile: Haircut style
  - Knobs: Amber or black top hat
  - Pickup rings: Cream or black
  - Pickguard: Cream (bracketed)
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1046 (.010"-.046")
  - Case: Deluxe hardshell
