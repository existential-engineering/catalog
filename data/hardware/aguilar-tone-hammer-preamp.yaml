url: https://aguilaramp.com/products/tone-hammer-preamp
description: The Tone Hammer Preamp is a versatile preamp/direct box pedal for
  bassists seeking warm, rich, dynamic sound on stage and in the studio.
  Features 18-volt operation for expanded headroom, a 3-band EQ with fully
  sweepable midrange, an enhanced Drive circuit with dedicated foot-switch, XLR
  DI output with ground lift and pre/post switching, headphone output for silent
  practice, and aux input for playing along with tracks.
details: |-
  Three-band EQ with fully sweepable midrange (180 Hz to 1 kHz) for precise
  tonal shaping without cutting through the mix.

  Enhanced Drive circuit with dedicated foot-switch adds harmonically rich
  character from subtle warmth to full overdrive — independent from the clean
  output path.

  XLR DI output with ground lift switch and pre/post EQ selection for clean
  direct recording or full-processed signal. DI output level: 14 dBu nominal.

  18-volt operation provides extended headroom and dynamic range. Headphone
  output enables silent practice. Aux input allows mixing with backing tracks.
  The unbalanced 1/4-inch output can drive a power amp directly.

  Dimensions: 5.5" W × 4" D × 1.5" H. Backed by Aguilar's three-year
  limited warranty.
specs: |-
  - Bass EQ: ±18 dB @ 40 Hz
  - Mid EQ: ±17 dB @ 180 Hz – 1 kHz (fully sweepable)
  - Treble EQ: ±18 dB @ 4 kHz
  - XLR Output Level: 14 dBu nominal
  - Power: 18V DC (not included)
  - Dimensions: 5.5" W × 4" D × 1.5" H
