description: Clap inspired by the 909 circuits.
details: |-
  The clap sound of the TR-909, with the features the original lacked. Hexinverter's take on the design adds range and depth, and the result is a versatile module that works as a voltage controlled LFSR noise oscillator as well as a percussion synthesis engine.

  Pitch control of the noise generator covers everything from vanilla 909 claps to broken, chiptune-like alien sounds, and the module doubles as a voltage controlled, Commodore 64 sounding noise VCO through the NOISE output and the PITCH CV input.

  A SUSTAIN control extends the clap's sustain so the module can work as an abstract synth voice with external inputs, and the external input allows claps to be synthesised from virtually any source plugged in.

  An internal reverb effect derived from the clap tone is built in. The reverb decay forms the decay of the clap sound and is fully voltage controllable, from short reverb snaps to long, whooshing tails, and either the internal or an external noise source can be selected as the source for the reverb sound generation.

  A DRIVE control dials in anything from clean to extremely overdriven sounds, and a bandpass filter cutoff control shapes the tone.
specs: |-
  - Analogue handclap percussion synthesis reminiscent of the 909
  - Pitch control of noise generator
  - Doubles as a voltage controlled noise VCO via the NOISE output and PITCH CV input
  - SUSTAIN control
  - External input for synthesising claps from any source
  - Built in internal reverb effect derived from clap tone
  - Voltage controllable reverb decay
  - Selectable internal or external noise source for reverb generation
  - DRIVE control
  - Bandpass filter cutoff control
  - Audio output 10Vptp
  - CV levels -5V to +5V
  - Power consumption +29mA, -25mA
  - Module width 13HP
  - Module depth 20mm
