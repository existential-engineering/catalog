description: A random looping stepped CV and burst generator that can act as a
  random stepped CV source or a repeating 8-step CV source, triggerable via a
  burst generator.
details: |-
  Random Looping Stepped CV and Burst Generator

  STEPS has three functional blocks:

  You can either use this as a random stepped CV source or as a repeating 8 stepped CV source. You then can trigger the burst generator to play the 8 step loop or 8 random steps. All of this can use the internal or external clock signals. To get more complex patterns you can daisy chain STEPS modules together by tying together their clocks and sending EOB to TRIG. This way you can generate 16 step patterns (or longer). When first turning on STEPS you will need to run the module in RAND mode for at least 8 steps to fill the shift register with data. A caveat about STEPS:
  If a trigger is received off beat from the internal clock, the first step duration will be shortened. S T E P S M A N U A L
specs: |-
  - Internal clock with rate control and output
  - Burst generator
  - Pulses output which generates 8 pulses on every trigger
  - Gate output which is high during the burst event
  - EOB output which fires at the end of a burst event
  - Random Looping Stepped CV Generator
  - R.gate output outputs a random gate during a burst event
  - Random stepped output or a loop of 8 steps.
  - Steps output with attenuverter. The Steps output is held low while there is no burst event.
