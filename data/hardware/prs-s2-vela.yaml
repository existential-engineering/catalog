details: |-
  Anchored by PRS playability and craftsmanship, the S2 Vela is perfect for players who want PRS build quality and reliability with a fresh aesthetic. The Vela represents the maiden voyage into an offset body shape for PRS and is both elegant and distinctive.

  Loaded with a PRS DS-01 humbucker in the treble pickup position and the PRS Narrowfield in the bass pickup position, the Vela has a bright, punchy tone that sounds great plugged into your pedalboard or straight into an amp. A coil-tap on the tone control allows the DS-01 pickup to split into single coils and explore a whole new range of tones.

  The PRS plate-style bridge features two brass saddles specifically designed for great sustain and perfect intonation so both rhythm and lead tones sound great no matter where you are on the fretboard. In the studio or on the stage, you won’t want to leave this guitar at home.
