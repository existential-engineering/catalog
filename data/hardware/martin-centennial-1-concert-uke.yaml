description: Celebrate 100 years of Martin concert ukuleles with solid sinker
  mahogany, vintage-inspired design, and elegant details.
details: |-
  The Centennial 1 Concert Uke marks 100 years since Martin first introduced the concert-sized ukulele in 1925. This commemorative instrument honors that milestone with vintage-inspired design, premium materials, and a limited production run of just 91 units worldwide.

  The uke is crafted from solid sinker mahogany — tonewood recovered from the depths of Belizean rivers — delivering warm, focused tone with rich, distinctive grain patterns. The concert body size balances comfortable playability with resonant projection, while the all-mahogany construction produces the warm, woody voice associated with Martin's earliest ukes.

  Vintage details define the aesthetic: an East Indian rosewood fingerboard that terminates at the body joint to maximize top resonance, Madagascar rosewood binding, a satin finish, Waverly nickel uke tuners, and an ebony nut with ebony tuner knobs. A compensated black Tusq saddle keeps intonation accurate across the fretboard.

  Inside the body, a commemorative paper label references Martin's historic North Street factory in Nazareth, Pennsylvania — the very location where the original concert ukes were crafted a century ago. The uke ships in a softshell case with shoulder strap and is also available in a left-handed configuration.
