description: A 3-channel fully analog attenuverter/mixer module that can amplify
  up to x10 gain, attenuate, polarize, or generate voltage from -10V to +10V,
  with cascade mixing and daisy-chain capability.
details: |-
  GOMA Pro pushes the boundaries of the attenuverter-mixer concept. Attenuator, attenuverter, offset generator, voltage generator, waveshaper, distorsion, GOMA Pro can do all of that and more. Engineered for precision, GOMA Pro is crafted using high-quality components to ensure maximum accuracy, including low-tolerance resistors and low-noise op-amps. GOMA Pro offers 3 channels fully analog to amplify (up to x10 gain!), attenuate or polarize (attenuverter) any signal, from CV, audio to line level sources. Additionally, each channel can act as a high precision voltage generator (–10V to +10V) to offset another channel or control external parameters. The 3 channels can be processed separately or summed through cascade mixing, which can extend further than a
  single module since all the GOMA family (I, II, Pro) can be
  daisy chained to unlock virtually infinite mixing.
