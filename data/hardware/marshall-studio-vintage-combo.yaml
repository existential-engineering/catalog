description: The Studio Vintage Combo (SV20C) is a compact 20W all-valve combo built in the UK that recreates the sound of the legendary 1959SLP 'Plexi' in a portable home- and studio-friendly format. Loaded with a 10" Celestion VT-Junior speaker and powered by 2 x ECC83 preamp valves and 2 x EL34 power valves, it delivers the same warm blues tones and biting lead voicings as the original 100W head, scaled down through a 20W to 5W power reduction switch for usable volumes in any environment. A two-channel layout (linkable Normal/High Treble) with shared Presence, Bass, Middle and Treble EQ plus a series effects loop and DI output round out a Plexi voice that's just as at home on stage as it is in a small room.
details: |-
  Whether you're looking for warm blues tones or punchy leads, the Studio Vintage Combo has the same tones as the original 1959. Find your sound with the choice of high treble and normal voice or create your own blend between the two.

  Keep the same great sound even at lower volumes, switch between 20W and 5W to suit your playing environment. Pick the power that best suits your environment at the flick of a switch, perfect for jumping from the rehearsal studio to the living room and back again.

  The Studio Vintage Combo lets you harness the formidable tone of the 1959 at home or in the studio. Choose between the brightness of the high treble channel, the roundness of the normal channel, or blend between the two with a patch cable. Add in the EQ and presence controls and you can take your sound from warm blues to aggressive, biting leads.

  Elevate your sound with the Celestion V-Type speaker, renowned for its sweet and harmonious sound. Whether you're playing clean melodies or unleashing a fiery overdrive, this speaker ensures that every note resonates with clarity and definition, and its mid-band warmth adds depth and richness to lead playing.

  Recreating the tone produced by 100 watts, but with only 20 watts, wasn't an easy task. The Studio Vintage Combo has been skilfully crafted at the Marshall factory in Bletchley, England. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: SV20C
  - Range: Studio
  - Technology: valve
  - Channels: 2, bridgeable
  - Output wattage: 20W with power reduction option to 5W
  - Inputs: 4 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: speaker outputs 5 x 1/4" jack sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4" jack)
  - Controls: Normal/Loudness II, High Treble/Loudness I, Treble, Middle, Bass, Presence
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Speaker configuration: 1x10"
  - Speaker model: Celestion VT-Junior (16 ohm, 50W)
  - Unit impedance: 16 ohm
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 15.9 kg / 35 lb
  - Width: 500 mm / 19.7"
  - Height: 460 mm / 18.1"
  - Depth: 245 mm / 9.6"
  - Colour: Black
  - Country of origin: designed and engineered in UK, made in UK
  - Box contents: detachable power cable included
