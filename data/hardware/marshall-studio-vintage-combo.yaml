description: The Studio Vintage Combo (SV20C) is a compact 20W all-valve combo
  built in the UK that recreates the sound of the legendary 1959SLP 'Plexi' in a
  portable home- and studio-friendly format. Loaded with a 10" Celestion
  VT-Junior speaker and powered by 2 x ECC83 preamp valves and 2 x EL34 power
  valves, it delivers the same warm blues tones and biting lead voicings as the
  original 100W head, scaled down through a 20W to 5W power reduction switch for
  usable volumes in any environment. A two-channel layout (linkable Normal/High
  Treble) with shared Presence, Bass, Middle and Treble EQ plus a series effects
  loop and DI output round out a Plexi voice that's just as at home on stage as
  it is in a small room.
