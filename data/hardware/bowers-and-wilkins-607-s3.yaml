description: Offering power and scale that belies its compact form, the 607 S3
  bookshelf speaker combines the Titanium Dome tweeter with the accuracy and
  transparency of the Continuum bass/midrange cone.
details: |-
  The 607 S3 is the smallest model in the Bowers & Wilkins 600 Series, a compact bookshelf speaker the company positions for smaller spaces and for surround duty in a home theater system. It is a two-way vented-box design pairing a 25mm Titanium Dome tweeter with a 130mm Continuum cone handling bass and midrange together, with Flowport porting.

  Bowers & Wilkins presents it as using the same technologies as its larger siblings in the range rather than a cut-down set, which is how it justifies the claim of power and scale that belies the cabinet size. The all-new Titanium Dome tweeter is credited with combining resolution and insight with smooth, refined high-frequency reproduction, and it sits behind a new, more acoustically transparent tweeter grille mesh first developed for the Signature models.

  The Continuum cone's composite construction is intended to avoid the abrupt transitions in behaviour that can impair a conventional drive unit, which Bowers & Wilkins ties to a more open and neutral presentation of voices and instruments. The speaker terminals are derived from those introduced in the 700 Series range and are described as having an improved layout and a cleaner signal path between amplifier and loudspeaker.

  The 607 S3 is passive and needs an external amplifier. Nominal impedance is 8 ohms with a 3.0 ohm minimum, sensitivity is the lowest in the range at 84dB, and Bowers & Wilkins recommends 30W to 100W into 8 ohms on unclipped programme with total cable impedance below 0.1 ohm. The owner's manual states the speaker has two linked pairs of terminals: the links remain fitted for a conventional single-amplifier connection and are removed for bi-wiring or bi-amplification, which the manual says can improve the resolution of low-level detail.

  Placement is stand-first. The manual says the 607 S3 is primarily designed for the dedicated FS-600 S3 floor stand and notes that shelf placement offers less flexibility to optimise performance, recommending the supplied foam plugs to tune port behaviour if a shelf must be used and that the four self-adhesive rubber feet be fitted underneath. Stands are not included. Three finishes are offered, Black, White and Oak, with a black grille on Black and a grey grille on White and Oak.
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Decoupled Double Dome Titanium tweeter, Continuum cone bass/midrange, Flowport
  - Drive units: 1x 25mm (1in) Titanium Dome high-frequency, 1x 130mm (5in) Continuum cone bass/midrange
  - Frequency range: -6dB 40Hz to 33kHz
  - Frequency response: 52Hz to 28kHz +/-3dB from reference axis
  - Sensitivity: 84dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis)
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 30W to 100W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Terminals: two linked pairs of binding posts, links fitted for conventional connection and removed for bi-wiring or bi-amplification
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm diameter
  - Dimensions: Height 300mm (11.8in) cabinet only, Width 165mm (6.5in) cabinet only, Depth 207mm (8.2in) cabinet only, 235mm (9.3in) including grille and terminals
  - Net weight: 4.65kg (10.3 lb)
  - Cabinet finishes: Black, White, Oak
  - Grille finishes: Black (Black), Grey (White and Oak)
  - Primarily designed for the FS-600 S3 floor stand, may be shelf placed; stands not included
  - Supplied with grille, foam port plug and four self-adhesive rubber feet
  - Passive loudspeaker: no on-board amplification and no mains connection
