description: Performance compact bookshelf loudspeaker pairing a new Titanium
  Dome tweeter with the acclaimed Continuum cone bass/midrange. Offers power and
  scale that belies its compact form.
details: |-
  The 607 S3 is the most compact passive bookshelf model in the third-generation Bowers & Wilkins 600 Series, designed to deliver high-end performance in a small, room-friendly cabinet.

  It is a 2-way vented-box system that combines a 25mm (1 in) Decoupled Double Dome Titanium high-frequency driver with a 130mm (5 in) Continuum cone bass/midrange driver. The Titanium Dome tweeter is new for this generation and is paired with an acoustically transparent tweeter grille mesh for cleaner dispersion.

  Low-frequency tuning is handled by Bowers & Wilkins' Flowport technology to reduce port noise, while upgraded speaker terminals derived from the 700 Series provide an improved layout and a cleaner signal path between amplifier and drivers.

  Nominal impedance is 8 ohms (3.0 ohm minimum) with a sensitivity of 84dB and a recommended amplifier power range of 30W to 100W into 8 ohms, making the 607 S3 well-suited to a wide range of integrated amplifiers and stereo receivers.

  The cabinet is available in Black, White, or Oak finishes, with grilles colour-matched to the cabinet (Black grille for Black, Grey grille for White and Oak).
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm (1 in) Decoupled Double Dome Titanium
  - Bass/midrange driver: 1x 130mm (5 in) Continuum cone
  - Frequency response: 52Hz - 28kHz (±3dB on-axis)
  - Frequency range: 40Hz - 33kHz (-6dB)
  - Sensitivity: 84dB (on axis at 2.83Vrms at 1m)
  - Nominal impedance: 8Ω (minimum 3.0Ω)
  - Recommended amplifier power: 30W - 100W into 8Ω
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (500Hz - 10kHz)
  - Max recommended cable impedance: 0.1Ω
  - Dimensions (H x W x D): 300 x 165 x 207mm (11.8 x 6.5 x 8.2 in), 235mm (9.3 in) depth with grille and terminals
  - Net weight: 4.65kg (10.3 lb) each
  - Available finishes: Black, White, Oak
