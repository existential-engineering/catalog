description: The AGM-30-Offset is a 30 watt all-valve guitar head from Ashdown's
  Guitar Magnifier range. Inspired by legendary British and American guitar
  amplifiers of the 60s and 70s, it is a versatile all-valve amp spanning
  American vintage cleans, pushed British crunch and more modern higher-gain
  tones. Power can be reduced at the push of the Stealth button from 30 watts
  down to a bedroom- and studio-friendly 2 watts.
details: |-
  AGM-30-Offset 30 watt all valve guitar head. Inspired by legendary British and American guitar amplifiers of the 60s and 70s, the AGM-30 Offset is a truly timeless and supremely versatile all valve guitar amplifier. American vintage cleans and pushed British crunch tones through to more modern higher gain tones are all available. Power can be reduced at the push of the Stealth button from 30 watts right down to a bedroom/studio friendly 2 watts.
