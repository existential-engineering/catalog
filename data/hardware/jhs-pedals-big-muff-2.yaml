description: A collaboration between JHS Pedals and Electro-Harmonix that brings
  to life Bob Myer's never-built 1970s schematic for a dual op-amp Big Muff,
  delivering a more aggressive, cutting Big Muff voice with enhanced low-end,
  midrange, and volume compared to classic versions.
details: |-
  For 50 years, a forgotten schematic sat buried in dust and time — a concept waiting to be born. In 2021, while on a research trip for the book "Made On Earth For Rising Stars: The Electro-Harmonix Story," JHS discovered a hand-drawn schematic labeled "BIG MUFF USING (2 DUAL OP AMPS)" in Bob Myer's workshop — the inventor of the EHX Big Muff. This was Bob Myer's own attempt to reimagine the original transistorized Big Muff circuit using the new Op-Amp technology that had emerged in the 1970s. The circuit uses a different clipping arrangement, an extra gain stage, and various other elements compared to the famous late-70s Op-Amp Big Muff by Michael Abrams. Where the original Big Muff delivers sweet violin-like sustain, Bob's two dual Op-Amp approach pushes into more aggressive, cutting territory with more volume and the most pronounced low-end and midrange of any EHX Big Muff ever. Controls: Volume (output level), Sustain (fuzz amount), Tone (dark to bright). A collaborative result between JHS Pedals, Electro-Harmonix, and official EHX archivist Daniel Danger.
