details: |-
  AFTERGLOW CHORUS was designed specifically with the vintage aficionado in mind, and serves up a variety of time-honored modulation tones reminiscent of rock ‘n roll’s heyday. Its all-analog circuit uses a Bucket-Brigade Device (BBD) to create a wide range of classic handed-down modulation tones, from the smallest shudder to wildest wobble. This tiny marvel is sure to quench your thirst for vintage-flavored chorus!

  From the rotary speaker vibes of the ‘60s and ‘70s to jangle pop and grunge – AFTERGLOW CHORUS has it all. Plug in, turn a few dials and send your tone on an electrifying journey through decades of rock ‘n’ roll history!

  Many guitarists, bass players and keyboardists love the distinct tone of bucket-brigade circuits – and with good reason! AFTERGLOW CHORUS uses this same old-school technology’s natural band limiting to create the secret sauce found in countless classic rock songs. If savory modulation is what you're craving – call out the bucket brigade!

  A sturdy metal chassis with dedicated Input, Output and True Bypass means that AFTERGLOW CHORUS is equally roadworthy and pedalboard friendly. You can power it with a 9V battery, or use our convenient POWERPLUG 9V adapter.

  Chock-full of classic chorus tones, AFTERGLOW CHORUS sports an easy-to-use control layout including: Rate, which controls the speed of the modulation; Depth, for modulation intensity; and Mix, for setting the signal ratio of wet to dry. Nothing is easier! Check out AFTERGLOW CHORUS at your local TC ELECTRONIC dealer today, or get yours online – and let the chorus sing!
