description: The Grand J-16E 12-String pairs rosewood tone, comfortable
  playability, and rich, layered sound with onboard electronics and a built-in
  tuner for a gig-ready acoustic-electric. Its 12-string configuration adds a
  unique layer of chime and texture atop a satin spruce top and East Indian
  rosewood back and sides.
details: |-
  The Martin Grand J-16E 12-String combines the projection of a Grand Jumbo body with the comfort of an Auditorium-depth profile, giving players a chiming 12-string voice without sacrificing playability. A satin spruce top paired with East Indian rosewood back and sides delivers the warmth and harmonic richness that Martin's rosewood instruments are known for.

  Scalloped X-bracing and a 25.4" scale length support the dual-course string tension while preserving balance and clarity across the registers. The PA Profile neck with High-Performance Taper, ebony fingerboard, and 1 13/16" bone nut keep the wider 12-string fretboard comfortable for chording and lead work.

  Onboard Martin E1 electronics, including volume, tone, and phase controls plus a built-in chromatic tuner, make the Grand J-16E 12-String stage-ready out of the case. A modern belly bridge in ebony and chrome enclosed-gear tuners round out the appointments.

  Handcrafted at Martin's Nazareth, Pennsylvania factory and backed by a Limited Lifetime Warranty, the guitar ships pre-strung with Authentic Acoustic Lifespan 2.0 phosphor bronze 12-string strings (extra light) and includes a softshell case with backpack straps.
specs: |-
  - Body Size: Grand J-14 Fret (000 Depth)
  - Top: Spruce (satin finish)
  - Back and Sides: East Indian Rosewood (satin)
  - Bracing: X-brace, scalloped spruce (5/16")
  - Scale Length: 25.4"
  - Frets: 20 total, 14-fret neck joint
  - Fingerboard: Ebony
  - Nut Width: 1 13/16"
  - Nut Material: Bone
  - Neck Shape: PA Profile with High-Performance Taper
  - Bridge: Modern Belly (12-string drop-in, ebony)
  - Tuning Machines: Chrome enclosed gear
  - Electronics: Martin E1 (volume, tone, phase controls; built-in chromatic tuner)
  - Strings: Authentic Acoustic Lifespan 2.0 Extra Light 12-String Phosphor Bronze
  - Case: Softshell with backpack straps
  - Handcrafted in Nazareth, PA
