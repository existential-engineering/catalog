description: Bluetooth speaker delivering home-shaking Marshall signature sound.
details: |-
  Woburn III is guaranteed to fill any space with immersive, home-shaking Marshall signature sound. Built-in Dynamic Loudness adjusts the tonal balance of the sound, ensuring your music sounds brilliant at every volume. Woburn III is ready for the future of Bluetooth technology and has been built ready to deliver next-generation Bluetooth features the moment they are available. Designed and engineered in Sweden. Made in China.

  Re-engineered wider stereo soundstage: this generation of the home line-up has an even wider soundstage than before, delivering heavy Marshall signature sound re-engineered for a more immersive experience. Generation III has tweeters angled outwards and updated waveguides to deliver a consistently solid sound that is so wide it chases you around the room.

  Pair, play and turn it up: these speakers are straight to business, so you can just pair and play without the hassle of a complex set-up. You'll find everything you need right there on the unit, including the Bluetooth pairing button, power switch, bass and treble controls and the control knob, so you can control your music without ever picking up your device.

  Wired connectivity (3.5 mm, RCA and HDMI): with so many ways to connect to Woburn III, getting the right sound for listening to music or watching TV has never been so effortless. Connect directly from your device using Bluetooth, RCA or the 3.5 mm input. Woburn III also has an HDMI ARC input, which lets you connect it to your TV's HDMI ARC port, follow the TV's volume and power it on and off with the TV remote.

  App control and Night Mode: download and connect to the Marshall Bluetooth app for advanced settings and over-the-air updates. The EQ can be adjusted from the top controls or in the app, Placement Correction compensates for where the speaker sits in the room, and Night Mode reduces the volume of sudden loud noises while bringing up voices for late night TV and film viewing.
specs: |-
  - Frequency range: 35 to 20,000 Hz
  - Stereo/mono: stereo
  - Maximum sound pressure level: 100.5 dB at 1 m
  - Cabinet principle: bass-reflex
  - Adjustable bass and treble controls via analogue controls on the speaker
  - One 90 Watt Class D amplifier for the woofer
  - Two 15 Watt Class D amplifiers for the mids
  - Two 15 Watt Class D amplifiers for the tweeters
  - Wireless connectivity: Bluetooth 5.2, ready for Bluetooth LE Audio
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: 3.5 mm input, RCA input and HDMI ARC input
  - Customise sound: yes, on speaker and in app
  - Night Mode reduces the volume of sudden loud noises and lifts voices for night time TV viewing
  - Placement Correction adjustment in the Marshall Bluetooth app
  - Top panel controls: source button, volume control knob, bass control knob, treble control knob, play/pause button, skip backward/forward control knob, power switch
  - Wi-Fi: no
  - Microphone system: no
  - Voice command: no
  - Mains input voltage: 100 to 240 V
  - Mains frequency: 50 to 60 Hz
  - Weight: 7.45 kg / 16.42 lb
  - Width: 400 mm / 15.75"
  - Height: 317 mm / 12.48"
  - Depth: 203 mm / 7.99"
  - Water resistance: no
  - Country of origin: designed and engineered in Sweden, made in China
  - Box contents: Woburn III speaker, user manual and legal and safety information, mains lead
  - Compatible app: Marshall Bluetooth app (iOS and Android), with over-the-air software updates
