description: >-
  A fully analog modular synthesizer system from England featuring a customizable module selection,
  1V/octave CV compatibility, and Doepfer A-100 format compatibility.
details: |-
  The Analogue Systems RS-Integrator is a pure analog modular synthesizer system that requires
  patching for all sound creation, offering complete flexibility in signal routing and synthesis
  architecture. Manufactured in England, the system allows users to select and install individual
  modules into various cabinet sizes to build a personalized instrument.

  The flagship Sorcerer configuration houses the system in a walnut cabinet with a 49-note keyboard
  and 168hp of module space, accommodating roughly 28 modules. Other form factors include the
  keyboard-less Apprentice and the Demon controller with built-in MIDI-to-CV conversion. All
  configurations use 1/8-inch jacks for patching and maintain compatibility with Doepfer A-100
  modules.

  The module lineup includes the RS-90 VCO with waveshape modulation, the RS-110 multimode four-pole
  filter, the RS-120 comb filter, and replica designs inspired by classic Moog, EMS, and Bode filter
  circuits. The RS-80 LFO provides sine, triangle, square, and sawtooth waveforms, while the RS-180
  VCA handles amplitude shaping with dual audio inputs.

  Notable users include Jonny Greenwood of Radiohead, Autechre, and Parallel Worlds.
specs: |-
  - Polyphony: Monophonic (expandable)
  - Oscillators: RS-90 VCO with waveshape modulation
  - LFO: RS-80 (sine, triangle, square, sawtooth)
  - Filter: RS-110 multimode 4-pole, RS-120 comb filter
  - VCA: RS-180 with dual audio inputs
  - Keyboard: 49-note monophonic (Sorcerer)
  - Memory: None (patch cable routing)
  - Control: MIDI In/Out/Thru, CV/Gate
  - Patch format: 1/8-inch jacks, Doepfer A-100 compatible
releaseDate: "2000"
releaseDateYearOnly: true
