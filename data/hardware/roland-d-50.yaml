description: >-
  A groundbreaking digital synthesizer that introduced Linear Arithmetic
  Synthesis, combining short PCM attack transients with sustained digital
  waveforms to produce richly textured, immediately playable sounds with
  built-in effects.
details: |-
  Arriving in 1987, the D-50 was Roland's direct response to the Yamaha DX7's dominance of the digital synthesizer market. Where the DX7's FM synthesis offered vast tonal possibilities at the cost of notoriously difficult programming, the D-50's Linear Arithmetic Synthesis aimed to deliver expressive, complex sounds through a more approachable architecture. It succeeded on both counts and quickly became one of the decade's most celebrated instruments.

  Linear Arithmetic Synthesis works by combining short 8-bit PCM samples — typically capturing the attack transient of an acoustic instrument or percussive texture — with sustained digital oscillator tones shaped through subtractive-style filtering. This hybrid approach gives the D-50 a distinctive character: sounds that begin with realistic, organic attacks before transitioning into synthetic sustain tones. The result is a palette of ethereal pads, shimmering digital textures, and percussive leads that became defining sounds of late-1980s music production.

  The D-50 was among the first synthesizers to include onboard digital effects processing, featuring built-in chorus and reverb that were integral to many of its factory presets. A joystick controller on the front panel enables real-time manipulation of tonal parameters during performance, adding an expressive dimension that set it apart from the more static patch recall approach common to its digital contemporaries. For deeper editing, Roland offered the optional PG-1000 external programmer with dedicated knobs and sliders.

  With 16-voice polyphony, 61 velocity- and aftertouch-sensitive keys, and 64 patch memories, the D-50 was well-equipped for both studio work and live performance. Its six LFOs (three per tone, two tones per patch) allowed for complex modulation routing that could bring patches to life with subtle movement and animation.

  The D-50 left an indelible mark on the sound of its era, appearing on recordings by Enya, Vangelis, Jean Michel Jarre, and Eric Clapton, among many others. Its "Digital Native Dance" and "Fantasia" presets became some of the most recognized synthesizer sounds of the late 1980s. The instrument's legacy has been preserved through Roland's own cloud-based recreations and numerous software emulations.
specs: |-
  - Polyphony: 16 voices (32 partials)
  - Synthesis: Linear Arithmetic (LAS), combining PCM attack samples with digital oscillators
  - Oscillators: 32 digital oscillators with PCM waveforms
  - LFO: 6 total (3 per tone, 2 tones per patch)
  - Filter: Resonant lowpass
  - Envelopes: ADSR
  - Effects: Built-in chorus and digital reverb
  - Memory: 64 patches
  - Keyboard: 61 keys with velocity and aftertouch
  - Controller: Real-time joystick, optional PG-1000 external programmer
  - Connectivity: MIDI
  - Produced: 1987–1989
