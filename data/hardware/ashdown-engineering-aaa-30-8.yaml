description: A 30-watt bass combo with a single 8" speaker, delivering
  full-sized Ashdown bass tone at practice volumes in a portable package. It has
  a 3-band EQ, a 1/8" line input for playing along, a headphone output for
  silent practice, and an AppTek socket for iOS amp-sim and FX apps.
details: |-
  Portable 30-watt bass combo with a single 8" speaker. 3-band EQ, a 1/8" line input to play along, and a headphone output for silent practice. Heavy-duty buffalo Tolex with a vintage red grille. AppTek connection lets players use iOS amp-sim and FX apps via the AmpKit app, including Ashdown's ABM Pre App (Sub Harmonics, Tube Drive, Compression, 7-band EQ) through Agile Partners Amp Kit.
specs: |-
  - Power output: 30 watts
  - Speaker configuration: 1 x 8"
  - 3-band EQ
  - 1/8" line input
  - Headphone output
  - AppTek socket (iOS amp-sim integration)
  - Heavy-duty buffalo Tolex with vintage red grille
