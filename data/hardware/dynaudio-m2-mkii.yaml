description: More SPL, more accuracy and more finesse – across the board.
details: |-
  The concept for the original M2 was a compact three-way near-/mid-field monitor designed to produce maximum accuracy and SPL in a compact enclosure. This second generation takes that idea and supercharges it.

  The M2 MkII is a 3-way active/passive monitor system that employs external frequency dividers and power amplification, designed as a high-quality, all-purpose monitor for small to medium-sized rooms. The external electronic components for the M2 MkII will typically comprise the Dynaudio Acoustics DA40-DSP power amplifiers with built-in DSP, a Dynaudio Acoustics DA20 with built-in crossover filters or a pair of Dynaudio Acoustics DCA800/1400 amplifiers with built-in crossover filters. It is also possible to use an external crossover device, such as an XTA DP448.

  The system's hybrid crossover design utilises a combination of active and passive crossover filters to achieve optimal performance. Each channel of the monitor signal is supplied to the inputs of the amplifier. Internally, it is split into one low-frequency feed and one midrange / high-frequency feed to supply the two power amplifier channels and then the loudspeaker. Additionally, a passive crossover installed in the loudspeaker cabinet divides the midrange / high-frequency feed supplying the mid-range units and the tweeter.

  The M2 MkII features Esotar3 soft-dome tweeters, a newest-generation 75 mm soft-dome midrange, and twin 24 cm MSP low-frequency drivers feeding into a custom hand-built crossover, delivering astonishingly accurate imaging and frequency response. The loudspeaker can be stand-mounted or flush-mounted into a wall, and is well suited to small and medium studios with optimum imaging and very wide frequency response.

  For surround monitoring applications, the M2 MkII is typically complemented by a sub-bass loudspeaker system, along with surround speakers as needed. Optional hardwood cabinets are available in oak, cherry, walnut and maple, with custom cabinet sizes available on request.
specs: |-
  - Status: Current
  - Configuration: 3-way active/passive hybrid near-/mid-field monitor
  - Frequency Response: 40 Hz – 20 kHz
  - Maximum SPL at 2 metres: 125 dB stereo
  - Crossover Frequencies: 700 Hz and 3700 Hz
  - Total Harmonic Distortion: 1% at 90 dB
  - High Frequency Driver: Esotar3 soft-dome tweeter
  - Midrange Driver: 75 mm soft-dome
  - Low Frequency Driver: 24 cm MSP x2
  - Recommended Amplifier Power: 250–500 W/channel per speaker (two channels)
  - Amplifier Recommendation: Dynaudio Acoustics DA20 (with filters), DA40, DCA800 (with filters)
  - Connector Panel: Gold screw-down binding-post terminals (LF pair and MF/HF pair)
  - Cabinet Dimensions (H x W x D): 350 x 680 x 500 mm
  - Weight: 35 kg
  - Finish: Black textured paint
  - Optional Hardwood Cabinets: Oak, cherry, walnut, maple
  - Custom Cabinet Sizes: On request
