details: |-
  Available Soon! Your Long Last Love... Silvertone 1446 Semi-Hollow Electric Guitar

  Silvertone proudly reintroduces the iconic 1446 in Gloss Black - a legendary semi-hollow electric guitar that defined the sound of rock history. Originally sold through the Sears catalog from 1961 to 1967, the 1446 holds a special place among recording artists and collectors. This meticulously recreated model honors every detail of the original while integrating modern performance features to meet the demands of contemporary stages and studios. The 1446 features a chambered center-block maple body that enhances sustain, reduces feedback, and expands dynamic range. Its 24 ¾" scale mahogany neck has been redesigned from the original "2×4 lumber" profile into a comfortable, modern soft-C taper. The rosewood fingerboard is equipped with advanced Semi-Hemispherical frets, delivering an ultra-smooth playing experience. Distinctively, the 1446 comes equipped with a genuine Bigsby B70 vibrato tailpiece paired with a Tune-o-matic style bridge featuring roller saddles for exceptional tuning stability. The heart of the 1446's tone lies in its Wilkinson "R Series" mini-humbucker pickups, exacting era-specific recreations inspired by the rare original P19 pickups designed by Seth Lover. Crafted with custom tooling, period-correct Alnico V magnets, and matched winding, these pickups deliver the clarity, warmth, and harmonic richness that made the 1446 famous. With its blend of vintage mojo and modern playability, the Silvertone 1446 offers a timeless sound and feel—ready for both recording and live performance.
specs: |-
  - Single-cutaway chambered arched maple body with center block construction
  - Wilkinson 'R-Series' Original Spec Mini humbucking pickups
  - 24 ¾" Scale soft "C" shaped mahogany neck
  - 12"-radius rosewood fingerboard with pearloid block inlays
  - 20 Silvertone 'Easy Feel' ball end frets
  - Electronics: Two Volume and two tone controls with a 3 way lever switch
  - Vintage spec "Cupcake" control knobs
  - Tune-o-matic style bridge with 'Roller' saddles
  - Bigsby B70 vibrato tailpiece
  - Single ply cream pickguard
  - Chrome hardware
  - Color: Gloss Black
