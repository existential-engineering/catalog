details: |-
  The Control 1 Pro is a two-way professional compact loudspeaker system representing the next generation in high-performance compact speaker design. It builds on the heritage of the original Control 1 while incorporating the latest innovations in JBL Professional loudspeaker engineering.

  The system features a 135 mm (5.25 in) low-frequency driver paired with a 19 mm (0.75 in) polycarbonate dome tweeter, crossed over at 4.2 kHz. It delivers a frequency response of 100 Hz–18 kHz (±3 dB) with a maximum continuous SPL of 108 dB at 1 meter, and peak SPL of 114 dB.

  Protection is provided by JBL's full-range SonicGuard power limiting circuit, which safeguards both drivers from overload without audible artifacts. The speaker handles up to 150 W of amplifier power and presents a nominal 4-ohm impedance.

  The enclosure is constructed from polypropylene structural foam and ships with a wall swivel ball bracket mounting assembly. It is available in black (C1Pro) or white (C1Pro-WH). Optional heavy-duty mounting hardware (MTC-1A, MTC-8) is available for demanding installation environments.

  With a 120° x 120° coverage pattern, the Control 1 Pro is well-suited for recording studios, broadcast environments, and contractor installed sound applications where a small footprint and wide dispersion are required.
specs: |-
  - Frequency Range (-10 dB): 80 Hz – 20 kHz
  - Frequency Response (±3 dB): 100 Hz – 18 kHz
  - Power Rating: 150 W
  - Sensitivity: 87 dB SPL (1W/1m)
  - Maximum SPL (1m): 108 dB continuous, 114 dB peak
  - Impedance: 4 ohms
  - Crossover Frequency: 4.2 kHz
  - Coverage Angle: 120°H × 120°V
  - LF Driver: 135 mm (5.25 in)
  - HF Driver: 19 mm (0.75 in) polycarbonate dome
  - Input Connectors: Spring-loaded terminals
  - Overload Protection: SonicGuard power limiting
  - Enclosure: Polypropylene structural foam
  - Dimensions: 235 × 159 × 143 mm (9.3 × 6.3 × 5.6 in)
  - Net Weight (each): 1.8 kg (4 lb)
  - Finishes: Black (C1Pro), White (C1Pro-WH)
