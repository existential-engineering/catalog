details: |-
  The result of a passionate and tireless quest for audio perfection. Built on the success of the global award-winning M40.2 40th Anniversary, this new generation Harbeth achieves a leap in performance delivery. Stunning realism, expansive bass and lifelike transparency delivers an ultimate experience for even the most critical listener.

  Adaptable to a wide range of listening environments, accurate across the entire audio band, emotionally engaging and easy to drive, the M40.3 XD takes the acclaimed Harbeth sound to a new level.

  Harbeth cabinets are handmade and feature the finest veneers. Veneers vary in colour, shade and grain structure, particularly the Tamo Ash veneer. Not all finishes are available in all countries.
specs: |-
  - Technical features: 3-way vented, 300mm Harbeth bass unit, 200mm Harbeth RADIAL2 mid, 25mm ferrofluid-cooled tweeter
  - Frequency response: 35Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6-8 ohms, easy to drive
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 35W/channel
  - Power handling: 650W programme
  - Dimensions: 750 x 432 x 388 mm (+12mm for grille and binding posts)
  - Connectors: two 4mm Harbeth-branded binding posts
  - Weight: 38kg each (without packing)
  - Space needs: ideally free-space away from walls
  - Stands: optimally to bring ears level with tweeters (tweeter 660mm up from cabinet base)
  - Packing: single speaker per protective carton
  - Grille colour: black
