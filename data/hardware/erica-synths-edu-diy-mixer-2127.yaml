details: |-
  Mixing might be more of a utility function in a modular synthesizer, but that does not necessarily mean it has to be dull and boring. Case in point: this super simple three-channel mixer with built-in diode distortion, which makes patches sound delightfully rough.

  Erica Synths and Moritz Klein developed a series of educational DIY kits under the brand name mki x es.EDU with one specific goal in mind: to teach people with little-to-no prior experience how to design analog synthesizer circuits from scratch. What arrives in the box is not simply meant to be soldered together and then disappear in a rack. Instead the kit walks the builder through the circuit design process step by step, explaining every choice that was made and how it impacts the finished module.

  In total nine kits were developed to build a fully-featured modular monosynth: a sequencer, a VCO, a wavefolder, a noise/S&H module, a mixer, a VCF, an envelope generator, a dual VCA, and an output stereo mixer with a headphone amplifier. An affordable eurorack case with a DIY PSU is part of the series as well. The kits are easy to build, but design and functionality were not compromised.

  Each kit comes with an extensive user manual of 40 or more pages, downloadable separately, that dives deep into both the electronics behind the circuit and the fundamental principles of sound synthesis.
