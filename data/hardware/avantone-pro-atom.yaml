details: |-
  The Avantone Pro ATOM is a second-generation dynamic cardioid tom microphone
  designed for capturing full-bodied punch and definition from rack and floor
  toms in both studio and live environments.

  The ATOM features dye cast housings with interwoven brass and steel grill
  assemblies, precision machined inserts for secure shock mount positioning,
  and a distinctive cabernet red finish with gloss black grill and polished
  nickel trim.

  With a frequency response of 30Hz to 15kHz and a maximum SPL handling of
  145dB, the ATOM is built to handle the transient impact and low-end weight
  of tom drums without distortion or breakup.

  The microphone ships with the SSM Shockmount and PK1 Pro Klamp, providing a
  complete mounting solution for immediate studio or stage use.

  The ATOM is positioned as a top-shelf studio quality instrument microphone
  that is equally at home on the road, reflecting Avantone Pro's focus on
  professional-grade tools at accessible price points.
