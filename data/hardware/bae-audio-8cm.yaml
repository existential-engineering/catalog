description: The BAE 8CM is an 8-channel mixer chassis designed to house
  10-series modules including the 1073, 1084, 1023, and 1004. Each channel
  features individual pan controls and output level, with routing to left or
  right mix buses. It also functions as a straight 10-series rack with 8 direct
  outputs.
details: |-
  The BAE 8CM is an 8-channel mixer chassis that accepts BAE's 10-series format modules, including the venerable 1073, 1084, 1023, and 1004. Each of the 8 channels provides individual pan controls and per-channel output level, with mic and line inputs routable to either the left or right mix bus.

  A stereo master output allows attenuation of all channels simultaneously. The bussing amplifiers are Class A designs, the same topology used in BAE's 1272 models, preserving the sonic character throughout the signal chain.

  The 8CM can alternatively be used as a straightforward 10-series module rack with 8 direct outputs, making it a flexible platform for both mixing and tracking applications.
specs: |-
  - Power Requirements: 115/230 VAC, 42W
  - Weight (Empty): 15 lbs / 6.80 kg
  - Dimensions: 19"W × 8.75"L × 16"D
  - Bussing Amplifiers: Class A
  - Channels: 8
  - Compatible: BAE 10-series modules
