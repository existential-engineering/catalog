description: The I-30 LC is a fully-hollow double cutaway electric guitar built
  with a lightweight trestle-brace construction that directly couples the neck
  and tail block for exceptional strength and acoustic responsiveness. Featuring
  Lollar Dog Ear P90 pickups with custom phenolic covers and 50s-style wiring,
  it delivers expressive tone well-suited for jazz, blues, and rock. The 15"
  maple laminate body is finished in high gloss nitrocellulose lacquer with
  non-grained ivoroid binding throughout.
details: |-
  The I-30 LC is a fully-hollow double cutaway electric guitar developed through extensive R&D. Its trestle-brace construction directly couples the neck and tail block, providing exceptional strength and acoustic energy transfer while maintaining feedback resistance at stage volumes. The maple laminate body measures 15" wide and 1 5/8" deep, with a total length of 40". The Honduran mahogany neck features a rosewood fingerboard with 12" radius, medium 18% nickel-silver frets, and 1 11/16" nut width at a 24 7/8" scale length. Electronics consist of Lollar Dog Ear P90 pickups with custom phenolic covers, CTS 500K pots, Jupiter Vintage Yellow capacitors, and 50s-style wiring. Hardware includes a Kluson ABR-1 bridge, Collings original trapeze tailpiece, and Gotoh tuners with Collings logo. The guitar ships with D'Addario NYXL1149 strings and a deluxe hardshell case. Available in an extensive range of standard, non-standard, premium, and metallic finishes, with numerous custom options including alternative pickups, Bigsby vibrato, and left-handed configuration.
specs: |-
  - Body: Fully hollow, parallel trestle-brace construction
  - Top/Body Material: Maple laminate
  - Neck: Honduran mahogany
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Frets: Medium 18% nickel-silver
  - Inlays: MOP long dots, 5mm non-tapered
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Body Width: 15"
  - Body Length: 17 5/8"
  - Body Depth: 1 5/8"
  - Total Length: 40"
  - Binding: Non-grained ivoroid (body and fingerboard)
  - Pickups: Lollar Dog Ear P90s with custom phenolic covers
  - Wiring: 50s style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Amber or black top hat
  - Bridge: Kluson ABR-1 (nickel-plated zinc with retaining wire)
  - Tailpiece: Collings original trapeze design
  - Tuners: Nickel Gotoh with Collings logo
  - Peghead: Ebony veneer with MOP Collings logo
  - Pickguard: Black/Cream/Black
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Case: Deluxe hardshell
