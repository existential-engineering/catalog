description: Professional dynamic supercardioid vocal microphone with a
  neodymium element. High-mid frequency voicing helps position vocals precisely
  in a mix with minimal EQ, while the supercardioid pattern provides strong
  off-axis rejection for live stage use.
details: >-
  The Electro-Voice PL-44 is a handheld dynamic vocal microphone in the PL (Pro
  Line) series, designed for live performance and broadcast vocal applications.
  It uses a neodymium magnet structure to drive a dynamic capsule with a
  supercardioid polar pattern, delivering tight off-axis rejection that helps
  the microphone remain stable against stage monitors and adjacent sources.


  The voicing emphasizes high-mid frequency content, which is tuned to seat
  vocals in a mix with minimal setup time. Frequency response runs from 80 Hz to
  16 kHz, with the low-end roll-off helping to control proximity effect and
  stage rumble while preserving body and presence. The element is wired for a
  balanced low-impedance output of 600 ohms with a sensitivity of 2.2 mV/Pa (-53
  dBV) at 1 kHz, open circuit voltage, making it compatible with any standard
  professional mixer or preamp.


  The handle is finished in textured black satin and protected by a Memraflex
  grille that is designed to recover its shape after impacts. Output is via a
  3-pin XLR-type connector on the bottom of the handle. The microphone measures
  184.0 mm in length, 53.0 mm in head diameter and 23.6 mm at the shank, with a
  net weight of 294 g (10.4 oz). It ships with a stand adapter that includes a
  Euro-thread insert and a soft zippered gig bag.
specs: |-
  - Element: Dynamic, neodymium magnet structure

  - Polar pattern: Supercardioid

  - Frequency response: 80 Hz - 16,000 Hz

  - Sensitivity: 2.2 mV/Pa (-53 dBV) at 1 kHz, open circuit voltage

  - Impedance: 600 ohms

  - Connector: 3-pin XLR-type

  - Form factor: Handheld

  - Wired/wireless: Wired

  - Length: 184.0 mm (7.23 in)

  - Head diameter: 53.0 mm (2.10 in)

  - Shank diameter: 23.6 mm (0.93 in)

  - Net weight: 294 g (10.4 oz)

  - Shipping weight: 547 g (19.3 oz)

  - Finish: Textured black satin handle with Memraflex grille

  - Included accessories: Stand adapter with Euro-thread insert, soft zippered
  gig bag
