description: Yeti 2 is a multi-pattern USB microphone with Blue VO!CE,
  AI-powered de-noising, voice tracking, onboard presets and controls for gaming
  and streaming. It brings your voice into the future with new auto-enhancing
  and denoising audio features, plus an onboard LED display for adjusting
  settings.
details: |-
  Yeti 2 is the current generation of the Yeti multi-pattern USB microphone, sold under Logitech G with Blue VO!CE processing. It plugs into a computer over USB-C with no mixer or pre-amp required, and ships with auto-modes enabled so it is usable straight out of the box.

  A voice proximity sensor tracks the vocal source in 3D and auto-adapts gain, EQ and other settings in real time, so level and tone stay consistent as the speaker moves or changes volume. An AI-powered de-noiser actively cancels unwanted sounds such as keyboard clacks, notification chimes and PC fan noise.

  A 1.3 inch high-resolution LED screen on the front of the microphone drives the Yeti UI, showing at-a-glance audio information and tips. Settings can be tweaked and presets swapped with the onboard dial without opening any software, and an 8-bit avatar can be customized in G HUB.

  Blue VO!CE digital signal processing runs directly on the microphone, so studio-grade audio tools are available with no computer software needed. A 10-band EQ and onboard controls for pick-up patterns and gain provide further tonal control, and presets crafted by Logitech and Blue audio engineers cover gaming, podcasting and streaming scenarios.

  The re-engineered 3-capsule array records at 24-bit / 48 kHz. The body and stand are die cast, the LED screen is bonded glass, and the top surface has a touch mute. A die cast arm mount is sold separately. The microphone carries a 2-year limited hardware warranty.
specs: |-
  - Multi-pattern USB microphone with Blue VO!CE
  - Re-engineered 3-capsule array
  - Sample rate: 48 kHz
  - Bit rate: 24 bit
  - Frequency response: 20 Hz - 20 kHz
  - Sensitivity: -6 dBFS @ 94 dBSPL
  - Signal-to-noise: >77 dB
  - Max SPL: 129 dBSPL @ 10% THD
  - Power requirement: 2.5 W / 500 mA or less, bus-powered over the USB-C connection
  - USB-C plug-and-play connection, no mixer or pre-amp required
  - Voice proximity sensor tracks the vocal source in 3D and auto-adapts gain and EQ in real time
  - AI-powered de-noiser cancels keyboard clacks, notifications and PC fan noise
  - 1.3 inch LED screen with Yeti UI and onboard dial control
  - Blue VO!CE DSP onboard, no computer software needed
  - 10-band EQ with onboard control over pick-up patterns and gain
  - Onboard memory for presets saved from G HUB
  - Die cast body and stand, bonded glass LED screen, touch mute
  - Dimensions: 11.38 in (288.97 mm) height x 4.33 in (110 mm) width x 4.93 in (125.26 mm) depth
  - Weight: 35.1 oz (995 g)
  - 2-year limited hardware warranty
  - In the box: microphone with attached desktop stand, USB-C cable, 2 small rubber plugs for side holes, documentation
  - Available in Black (SKU 988-000587) and White (SKU 988-000588)
  - Die cast arm mount sold separately
