description: A ready-built 16 switch input to MIDI module board, for turning
  switch events into MIDI data in a custom controller or installation.
details: |-
  A module board for building a custom controller, or any project that needs several switch events turned into MIDI data. It ships as a ready built and tested circuit board only, with no case and no power supply.

  Sixteen switch inputs are normally pulled high, and closing a switch pulls the input low. Any MIDI data can be generated on any MIDI channel from any input, including sysex and NRPN messages.

  Programming is done with the free PC or Mac editor software, or from a Control Freak Studio or Control Freak Live. The board is effectively the button section of the Control Freak Studio Edition controller, with the same operating system behind it.

  It runs from a standard 9 volt supply, and a 6 volt version is available by special request. Typical uses are schools, colleges, research establishments, animatronics and automation.
specs: |-
  - 16 switch inputs, normally pulled high, switch closure pulls the input low
  - Switch inputs internally pulled up to +5 volts, connecting one to ground turns that switch on
  - Any MIDI data on any MIDI channel from any input, including sysex and NRPN
  - 1 x MIDI In, 1 x MIDI Out
  - Power socket: DC jack 2.1mm centre positive
  - Power requirement: 9V DC regulated or unregulated, 100mA
  - Never apply more than 12V; an unregulated supply above 9V typically exceeds its rating
  - Power supply not included
  - 6V operation available by special request
  - Dimensions: 80 x 60 x 22 mm
  - Weight: approx 50 grams
  - Supplied as a bare circuit board, no case
  - Programmed with the free PC or Mac editor, or from a Control Freak Studio or Control Freak Live
