details: |-
  Crafted with a classic mahogany and Sitka spruce wood combination, the Original Series 20 delivers exceptional clarity and string definition. This pairing is ideal for both flat picking and fingerpicking styles, offering a tonal precision that appeals to discerning players. George's early exploration of mahogany and cedar, seen in models like the 10 and 22, set a high standard, but the introduction of Sitka spruce elevates the sound with added brilliance and versatility. The Original Series is built with AAA-grade tonewoods selected for tonal depth, balance and responsiveness, and carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - Mahogany back and sides
  - Sitka Spruce top
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Available in O, F, S and WL body shapes
  - Hardshell case included
