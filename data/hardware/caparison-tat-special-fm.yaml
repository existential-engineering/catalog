description: A flagship neck-through electric guitar with Australian blackwood
  body wings and a flame maple top, featuring PH-Rm bridge and SH-27FC neck
  pickups with a rotary switch for multiple tonal combinations.
details: |-
  As a Caparison flagship design, the TAT-Special FM is an ever evolving instrument, and its line has been adjusted further in our perpetual chase for the perfect guitar. In order to create a snappier note attack, Jescar stainless steel jumbo frets are used throughout the range, and a full sounding note bloom and sustain are provided by the newly added Australian blackwood body wings in combination with a full thickness gorgeous flame maple top. Keeping in line with the Through and Through ethos, the TAT Special FM features neck through body construction, using a 5-piece maple / walnut neck with the matte surface extended to the very end of its playable area, ensuring a constant slippery and comfortable feel throughout the entire range - all the way to the 27th fret.This wood combination complements the aim of providing a full yet crisp sound while ensure excellent stability and reliability. An electric guitar of this caliber requires pickups to match, and the TAT-Special FM features the PH-Rm bridge pickup, a powerful and articulate unit that respects the guitar and the player's character, and the new SH-27FC neck pickup, which will provide authentic neck pickup sounds in spite of its location close to the bridge, with all the warm yet clear tones one might desire. The range of sounds on tap is deceptively large due to the rotary switch that will allow access to a number of different combinations, from more vintage leaning to modern sounding results. The TAT-Special FM comes in 3 new finishes: Moonlight, Aqua Burst and Rose Burst, which highlight the stunning flame maple top. The sides and back of the guitar are natural, in order to showcase the beautiful grain of the woods employed in its construction. Master luthier and head designer, Itaru Kanno notes that Australian Blackwood is perfectly suited to Caparison's guitar designs, known for its rich and warm tone, with a moderate low-end response, and is said to be suitable for various musical genres. By adopting Australian Blackwood for the TAT-Special FM body, the warm and rich tone of the wood can be enjoyed in addition to the visual beauty of the flame maple grain pattern.
