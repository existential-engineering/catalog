url: https://apiaudio.com/product/2500-stereo-compressor/
description: Dual-channel stereo bus compressor built around the API 2520 op-amp
  and patented THRUST® circuit. Configurable as stereo-linked or two independent
  mono channels. Selectable feed-back/feed-forward modes, variable link, and
  soft/medium/hard knee. Succeeded by the 2500+.
details: |-
  1U rackmount stereo bus compressor with THRUST® high-pass filter before
  RMS detector for added weight and punch. Selectable 'Old' (feedback) or 'New'
  (feed-forward) compression topology, variable L/R channel linking, auto or
  manual makeup gain, and dual VU meters. Fully balanced, transformer-coupled
  output.
specs: |-
  - Max output: +28 dBu
  - Output impedance: 75 Ohms (transformer coupled, balanced)
  - Input impedance: 60K Ohms (balanced)
  - Threshold: -20 to +10 dBu (variable)
  - Power: 22.8 W
  - Dimensions: 19" W × 1.75" H × 10.5" D
  - Weight: 9.48 lb
