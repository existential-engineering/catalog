description: The Pro-Mod DK24 HH 2PT CM Poplar Burl is a brazen instrument for
  the progressive guitarist searching for an unparalleled spectrum of sound,
  pairing a poplar burl top on an alder body with a caramelized maple neck and
  versatile HH electronics.
details: |-
  The Pro-Mod DK24 HH 2PT CM Poplar Burl pairs a Dinky-shaped alder body topped with figured poplar burl and finished in satin Transparent Black Burst, mated to a bolt-on caramelized maple neck with graphite reinforcement and a hand-rubbed satin urethane finish. The Speed Neck profile with rolled fingerboard edges delivers a broken-in feel from the first pass.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length. A sculpted shredder's cut heel and scalloped lower back bout provide unimpeded upper-fret access.

  Electronics are built around a versatile HH configuration: a Seymour Duncan Full Shred TB-10 at the bridge and a Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch and a 2-position mini toggle for series/parallel switching. A 500K EVH Bourns Low Friction volume pot and no-load tone control round out the wiring for an expansive tonal palette.

  Hardware includes a Gotoh Custom 510 tremolo, Charvel-branded die-cast locking tuning machines, and gold finish appointments, complementing the figured poplar burl top for a striking modern high-performance platform.
