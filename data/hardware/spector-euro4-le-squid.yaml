details: |-
  Spector's Euro Series has established itself as a true icon in the world of electric bass. Expertly handcrafted, these instruments represent the true essence of Spector's legendary design. Now, the Euro Series expands to include the limited-edition Euro LE Squid Bass. In collaboration with Darkglass Electronics, this stunning Spector Euro LE Squid features the same Kraken Squid graphic found on the Darkglass B7K Ultra Squid Pedal. Each bass is meticulously hand airbrushed making them truly one-of-a-kind. Beneath the astounding artwork, you will find a highly figured North American Maple top over a lightweight Empresswood body. The 3-piece Maple neck runs the entire length of the instrument and is complemented by a 24 fret Ebony fingerboard. This instrument also features sleek black hardware, EMG pickups, and the unrivaled Darkglass Tone Capsule active pre-amp.
