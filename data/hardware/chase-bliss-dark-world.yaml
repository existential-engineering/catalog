url: https://www.chasebliss.com/dark-world
description: Dual-channel reverb blender combining three natural algorithms
  (Spring, Plate, Hall) by Keeley Electronics with three impossible/surreal
  algorithms by Cooper FX, offering 33 distinct ways to mix and match reverb
  spaces.
details: |-
  Dark World is a dual-channel reverb blender combining the work of Keeley Electronics (World channel) with Cooper FX (Dark channel). The World channel offers three natural reverb algorithms — Spring, Plate, and Hall — while the Dark channel provides three impossible, surreal reverb algorithms.

  With series and parallel routing options, the two channels can be combined in 33 distinct ways, enabling everything from lush natural spaces to otherworldly ambient textures.

  The pedal features true bypass (with trails off) or buffered bypass (with trails on), analog dry-through, 2 onboard presets, internal modulation/ramping, MIDI control, CV, and expression pedal support. DIP switches on the rear panel offer further customization.
specs: |-
  - Dual-channel reverb (World + Dark)
  - World algorithms: Spring, Plate, Hall
  - Dark algorithms: 3 surreal/impossible reverbs
  - Series and parallel routing
  - 33 reverb combinations
  - Mono I/O
  - 2 onboard presets
  - Internal modulation (ramping)
  - True bypass / buffered bypass with trails
  - Analog dry-through
  - MIDI, CV, Expression control
  - DIP switches for customization
  - Power: 9V DC Center Negative, ~200mA
