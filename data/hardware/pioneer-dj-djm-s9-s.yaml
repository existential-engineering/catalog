details: |-
  Scratch style 2-channel DJ mixer for Serato DJ Pro/rekordbox.

  Meet the DJM-S9, our first two-channel battle mixer for Serato DJ Pro. With a fully configurable Magvel Pro crossfader and customisable FX buttons and pads, you can tailor the mixer to suit your DJing style. The tough DJM-S9 is build to withstand the most energetic scratch performances, and it boasts high-quality audio circuitry inherited from our flagship 4-channel digital mixer, the DJM-2000NXS .

  Magvel Fader Pro. Our durable Magvel Fader Pro magnetic crossfader delivers a smooth response. Use the Feeling Adjust dial to change the operational load, then modify the crossfader’s curve and reverse settings to your preference. Plus the mixer comes with shock-absorbing bumpers in 3 materials so you choose your level of rebound.

  Performance pads. Use the highly responsive multi-colour pads to trigger to Hot Cue, Roll, Slice and Loop or map the pads to other Serato DJ Pro functions. The EL display shows which mode is in play, and you can use Serato DJ Pro to allocate colours to modes for an even stronger visual cue.

  Customisable FX buttons. 6 Beat FX buttons and 6 Serato DJ Pro FX* buttons, plus 2 banks, give you unprecedented choice. Fire up the pre-set Beat FX or replace them with other popular on-board FX. Map your favourite Serato DJ Pro FX and their parameters to the 6 buttons on the right. * Serato DJ Pro offers up to 45 different FX (paid expansion pack needed)

  Filter FX. Rotate the dial to add a high/low pass filter to FX on each channel, or use Serato DJ Pro to switch to other filter FX like Dub Echo, Noise and Pitch.

  Style levers. Quickly turn effects on and off using the 2 large Style Levers. Trigger FX briefly, lock them on, or exit arrangements quickly.

  2 Built-in USB soundcards. Play back-to-back with other DJs seamlessly using the input switcher on top to switch between all four Serato DJ Pro decks. And if you prefer to play with CDJs or turntables, you can easily do so thanks to DVS support.
specs: |-
