details: |-
  The Nashville is a handheld portable speaker inspired by the musical heritage of Music City USA. It delivers powerful, room-filling audio through dual 2.25-inch full-range drivers paired with dual passive radiators that extend bass response without a subwoofer.

  The Nashville supports Bluetooth 5.3 with true wireless stereo capability and a range of up to 40 feet. Broadcast Mode allows synchronization with 10 or more compatible Klipsch speakers simultaneously. The built-in microphone enables speakerphone functionality for calls.

  With an IP67 rating, the Nashville is fully dustproof and can be submerged in water up to one meter deep for 30 minutes, making it suitable for outdoor and poolside use. Battery life reaches up to 24 hours per charge via 18W USB-C fast charging, and reverse USB-C charging at 10W allows the Nashville to charge other devices.

  The Klipsch Connect Plus app (iOS and Android) provides EQ customization and firmware update management.
