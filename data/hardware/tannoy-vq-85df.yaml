description: 2-way down-firing dual concentric mid-high loudspeaker for
  high-performance installation applications.
details: |-
  2-way down-firing dual concentric mid-high loudspeaker for high-performance installation applications. Features Dual Concentric 3.5" and 1.75" diaphragm compression drivers loaded into a single PSW (Point Source Waveguide) horn with 80° x 50° coverage. Configurable for Single-Amp or Bi-Amp with Lake LM26/44 DSP or Lab Gruppen PLM+/D series. Ideal for large sports arenas and stadia. Provides even coverage below main flown loudspeakers.
specs: |-
  - frequencyResponse: 400 Hz - 23 kHz (-3 dB)
  - frequencyRange: 350 Hz - 27 kHz (-10 dB)
  - sensitivity: 111 dB (1 W @ 1 m)
  - dispersion: 80° x 50° (-6 dB)
  - directivityFactorQ: 13.3
  - directivityIndexDI: 11.2 dB
  - maximumSPL: 134 dB averaged, 140 dB peak
  - powerHandlingMF: 200 W continuous, 400 W peak (@ 8 Ω)
  - powerHandlingHF: 90 W continuous, 180 W peak (@ 8 Ω)
  - nominalImpedance: MF: 8 Ω, HF: 8 Ω
  - dimensions: 500 x 694 x 515 mm
  - weight: 27.0 kg
