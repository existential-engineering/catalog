  chimey character than the standard 1960B. It is wired for mono or stereo
  operation and handles 280W mono (140W stereo), with switchable 16/4Ω mono and
  8Ω stereo impedance, making it suitable for pairing with most Marshall heads
  and stacking under an angled 1960AV cab.
