description: Instantly recognisable vintage-inspired 4x12" straight (base)
  speaker cabinet. The 1960BV is the vintage-voiced sibling of the long-running
  1960B, loaded with four 12" Celestion G12 Vintage speakers for a warmer, more
  chimey character than the standard 1960B. It is wired for mono or stereo
  operation and handles 280W mono (140W stereo), with switchable 16/4Ω mono and
  8Ω stereo impedance, making it suitable for pairing with most Marshall heads
  and stacking under an angled 1960AV cab.
details: |-
  The impressive 280W 1960BV 4x12 Base Cabinet combines the enclosure of the 1960 and the vintage aural characteristics of a 1982. This cabinet features four Celestion G12 Vintage speakers, giving it a warmer tone than its predecessor. This powerhouse offers it all from a well-rounded high-end punch to a low-end thump.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Built in Marshall's UK factory
  - Four 12-inch Celestion G12-Vintage speakers
  - Offers late 80s tone
  - Warmer sounds than other 1960 models
  - Inputs: 2
  - Speaker configuration: 4x12"
  - Power handling: 280W mono, 140W stereo
  - Speaker model: Celestion G12-Vintage speakers (16Ω, 70W)
  - Unit impedance: 16/4Ω mono, 8Ω stereo
  - Passive cabinet, no mains supply
  - Weight: 41 kg / 90.4 lb
  - Width: 770 mm / 30.3"
  - Height: 755 mm / 29.7"
  - Depth: 365 mm / 14.4"
