description: >-
  The GR-700 is a stomp-box guitar synth featuring the same synth engine as the
  JX-3P. It pairs with the G-707 guitar controller via a 24-pin cable, allowing
  musicians to play synth sounds with a guitar instead of a keyboard.
details: |-
  The GR-700 is a six-voice polyphonic synthesizer with two DCOs per voice, providing analog sounds with digital stability and control. The typical assortment of a resonant lowpass filter, ADSR envelope, LFO and oscillator sections are all present with straightforward programming.

  Sound-wise it is a capable synth, though the PG-200 programmer is recommended for easier patch editing. Patches are recalled by stomping on the foot pedals. The G-707 guitar controller includes knobs for cutoff editing and LFO modulation directly on the instrument.

  Notable users include Cirrus, Tim Skold, Amir Derakh, Charlie Singleton, King Crimson, and Andy Summers.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice
  - Filter: Resonant lowpass
  - Effects: Chorus
  - Arpeggiator: None
  - Memory: 32 preset, 32 user, 64 on memory card
  - Keyboard: 11 foot pedals
  - Control: MIDI (out only), G-707 guitar controller
releaseDate: "1984"
releaseDateYearOnly: true
