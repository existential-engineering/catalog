details: |-
  Mackie Thrash15v2 is the 15" powered loudspeaker with all the guts, grit and smarts to make yourself heard, including Feedback Eliminator, voicing modes and Bluetooth.

  Thrash15v2 has four voicing modes. Flat is neutral and leaves your tone alone. DJ adds more kick and more high end. Live projects across the vocal range for singing and speech. Wedge focuses on the midrange for when the speaker is used as a monitor.

  Feedback Eliminator prevents the squeal that happens when a mic gets too close to the speaker. Press a button and it watches for feedback and squashes it.

  You can connect a phone or laptop to Thrash15v2 and stream wirelessly. The mic input still works, so you can sing over backing tracks, and it is possible to stream to two speakers at once, in stereo or dual mono.
specs: |-
  - 1300W amplifier
  - 15" woofer
  - 1" tweeter
  - Frequency response: 48 Hz – 16 kHz
  - Max SPL: 129 dB
  - Overload limiter
  - Four voicing modes: Flat, DJ, Live, Wedge
  - Feedback Eliminator
  - Versatile XLR/TRS combo input for mics and instruments
  - Bluetooth wireless streaming and speaker linking
  - XLR mix output (includes Bluetooth signal and input)
  - Rugged frame with protective grille and built-in handles
  - Mounting pole cup with tightening screw
  - Height: 27.2 in / 691 mm
  - Width: 16.5 in / 420 mm
  - Depth: 15.0 in / 381 mm
  - Weight: 36.4 lb / 16.5 kg
