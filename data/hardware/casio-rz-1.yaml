description: >-
  The Casio RZ-1 is a digital drum machine from 1986 featuring 12 PCM sampled sounds and onboard
  sampling capability, allowing users to create up to four custom percussion sounds.
details: |-
  Released in 1986, the RZ-1 was Casio's entry into the sampling drum machine market. It shipped
  with 12 PCM sampled drum sounds covering the essentials: three toms, snare, kick, rimshot, open
  and closed hi-hats, ride, crash, clap, and cowbell. While the built-in sounds were serviceable
  rather than exceptional, the real appeal lay in the onboard sampling capabilities.

  The sampling specifications were modest even by mid-1980s standards, offering a 20kHz sample rate
  with just 0.2 seconds of sample time per pad across four sample pads, or alternatively 0.8
  seconds when using a single pad. Despite these limitations, the ability to load custom sounds
  into a drum machine at this price point was noteworthy.

  The built-in sequencer provided solid pattern-based programming with capacity for 100 patterns
  and 20 songs. Sixteen velocity-sensitive pads offered a playable interface for real-time input.
  Ten individual outputs with dedicated volume sliders gave users mixing flexibility, though some
  sounds shared output channels.

  MIDI connectivity with In, Out, and Thru ports ensured the RZ-1 could integrate into larger
  studio setups, making it a practical if unspectacular tool for budget-conscious producers of the
  era.
specs: |-
  - Polyphony: 16 voices
  - Sounds: 12 PCM drum sounds
  - Sampling: 20kHz, 0.8 seconds total (0.2 seconds per pad x 4 pads)
  - Sequencer: 100 patterns, 20 songs
  - Pads: 16 velocity-sensitive
  - Outputs: 10 individual with volume sliders
  - MIDI: In, Out, Thru
