description: MIDI Thing V2 is a flexible MIDI to CV converter for Eurorack,
  enabling polyphonic note handling, envelope and LFO generation, and conversion
  of all available MIDI messages into control voltage. A major upgrade from the
  original MIDI Thing, it adds a built-in screen for easy configuration, 12
  assignable ports, TRS type A MIDI IN and OUT, USB Host and Device
  connectivity, MIDI merge output, a web-based configuration tool, and a VCV
  Rack bridge counterpart.
details: |-
  MIDI Thing V2 is Befaco's second-generation MIDI to CV converter for Eurorack, representing a major leap over the original. It accepts MIDI input via TRS type A (1/8-inch) jacks and USB (both Host and Device modes), converting MIDI messages into control voltages and gate signals for use with analog and digital Eurorack modules.

  The module features 12 fully configurable ports that can be assigned to a wide range of functions: pitch CV for polyphonic voices, gate outputs, velocity, aftertouch, mod wheel, clock, LFO generation, envelope generation, and arbitrary MIDI CC values. This flexibility allows the module to serve as the hub of a MIDI-driven Eurorack system.

  A small built-in screen with intuitive menu navigation allows on-module configuration without needing a computer. For deeper configuration, Befaco provides a web-based editor (Web Editor v1.2) that connects over USB and offers a visual interface for assigning all 12 ports.

  The MIDI OUT jack supports MIDI merge, allowing the module to pass incoming MIDI through to additional devices or modules downstream. A VCV Rack bridge plugin is available for seamless integration with the software modular environment, bridging virtual and hardware instruments.

  Designed, kitted, and assembled in Barcelona, MIDI Thing V2 is available both as a fully assembled module and as a DIY kit. It draws minimal current from the Eurorack rails (+12V: 30mA, -12V: 5mA), with the +5V draw varying based on USB host devices connected (up to 120mA).
