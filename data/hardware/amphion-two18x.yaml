description: Two18X builds upon the strengths of the Two18 with tweeter and
  crossover enhancements that substantially lift performance across its sonic
  spectrum, while preserving the core characteristics that have placed it in
  many of the best studios in the world.
details: |-
  The Two18X is the next-generation evolution of the Two18, retaining the same two-way passive-radiator architecture — 1" titanium tweeter, dual 6½" aluminum woofers, 1600 Hz crossover, 4 Ω impedance — but with enhanced tweeter and crossover circuitry that lift performance across the sonic spectrum.

  The extended frequency response of 39–55,000 Hz ±3dB (versus the Two18's 39–20,000 Hz) reflects the crossover and tweeter upgrades, providing greater high-frequency resolution. Sensitivity and power handling remain identical to the Two18 at 89 dB and 100–350 W.

  Like the Two18, the Two18X operates with DSP-free acoustic purity, using the passive radiator bass-loading system and a waveguide-aligned point-source crossover for phase coherence and pinpoint imaging suited to larger room environments.

  Rob Kinelski: 'I adored my Amphion Two18's and genuinely thought they couldn't get any better — until I tried the Two18X.' The monitor is positioned as the top-tier passive nearfield/midfield option in Amphion's studio range.

  Requires an external power amplifier. Amphion recommends the Amp700. Dimensions and weight are identical to the Two18: 550×190×305 mm, 14 kg.
specs: |-
  - Operating Principle: Two-way, passive radiators
  - Tweeter: 1" titanium
  - Woofers: 2×6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 89 dB @ 2.83V/1m
  - Frequency Response: 39–55,000 Hz ±3dB
  - Power Recommendation: 100–350 W
  - Dimensions (H×W×D): 550×190×305 mm
  - Weight: 14 kg (30.9 lbs)
  - Manufacturing: Handmade in Finland
