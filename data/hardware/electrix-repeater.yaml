description: >-
  The Electrix Repeater is a loop-based digital recorder and sampler offering four independent tracks
  with real-time tempo, pitch, and time-stretching manipulation over recorded audio loops.
details: |-
  Released in fall 2001, the Repeater was the sixth product in Electrix's lineup of rack-mount processors, and arguably its most ambitious. It combined cutting-edge DSP technology with MIDI sequencer-style control, allowing performers to record, loop, and manipulate audio in real time with unprecedented flexibility.

  The core concept is straightforward but powerful: record any audio source for any length of time up to 50 minutes via CompactFlash media, then have it play back as a tempo-synced loop. From there, users can overdub, resample, and tweak parameters in real time. Each loop supports four independent stereo tracks, enabling layered performances from a single unit.

  What set the Repeater apart from simpler loopers was its ability to independently manipulate tempo and pitch. Time-stretching ranges from 1.5x faster to 4x slower, while pitch-shifting covers +1 to -2 octaves. Additional creative tools include reverse playback, track slip for offset adjustments, and a stereo effects insert loop.

  The Repeater found fans among electronic performers like Richie Hawtin and Imogen Heap, who valued its ability to transform live audio into rhythmically locked, layered compositions on the fly.
specs: |-
  - Tracks: 4 per loop (stereo)
  - Sampling: 24-bit, 44.1kHz stereo
  - Loop Limit: 8 minutes (40 MB) per loop
  - Storage: CompactFlash media, up to 999 loops
  - Pitch-Shift: +1 to -2 octaves
  - Time-Stretch: 1.5x faster to 4x slower
  - Effects: Reverse, Slip, Overdub, Resample, Stereo FX insert
  - Sync: MIDI, Audio Beat Detection
  - Record Time: Up to 50 minutes (with sufficient media)
