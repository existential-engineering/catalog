description: Aerodrums is an air-drumming instrument. It understands the user's
  drumming intent by watching them drum through a high speed camera.
details: >-
  Aerodrums is an air-drumming instrument that understands the user's drumming
  intent by watching them drum through a high speed camera. Besides a computer
  and speakers/headphones, the hardware weighs under one pound and takes up less
  than a square foot of space.


  Aerodrums allows MIDI input into a digital audio workstation or drum sampler
  with the same level of musical fidelity as traditional electronic drums or
  acoustic drum kits equipped with microphone or piezo triggers. The instrument
  can also function stand alone and uses a high fidelity sample bank.


  It is the only instrument/sample bank combination we are aware of that can
  take sticking handedness into account. It is possible to fully customize one's
  drum kit in aerodrums: drums, cymbals and pedals can be added or removed, and
  placed at the desired locations.


  System requirements for windows: windows vista, 7 or 8; sony playstation 3 eye
  camera; laptop or desktop from 2009 or later for stand alone operation; to
  operate along a demanding DAW, a powerful system is recommended, e.g. I7
  processor with dedicated graphics card.


  System requirements for mac: mac os x 10.6 or later; sony playstation 3 eye
  camera; laptop or desktop from 2009 or later for stand alone operation; to
  operate along a demanding DAW, a powerful system is recommended, e.g. I7
  processor with dedicated graphics card.
specs: |-
  - High speed camera tracking
  - MIDI input/output
  - Standalone operation
  - Customizable drum kit
  - Sticking handedness recognition
  - Adjustable drum hit sensitivity
  - MIDI data recording
  - Multiple kit presets (basic, jazz, rock, percussion)
  - Sample bank customization
  - Reflective tracking markers
