description: A Eurorack power distribution board with connectors for up to 20
  modules, dual screw terminals for daisy-chaining, LED voltage indicators, and
  an onboard switchable +5V regulator.
details: |-
  The Stoel Music Systems Bus Board is an excellent way to distribute power to your Eurorack modules. It has power connectors for powering up to 20 modules. There are two sets of screw terminals, making it easy to connect multiple bus boards to one power supply. Each voltage has an LED indicator. To improve performance and reduce noise, the board uses a ground plane design, and each voltage has a filter capacitor. In the center, a jumper enables the onboard +5V supply. If you have a power supply with a +5V output, do not install the jumper. If your power supply does not have a +5V output, install the jumper. The bus board's built-in +5V regulator will then draw from the +12V input to generate +5V. This is a distinct advantage in systems with many digital modules that need +5V. When using the onboard +5V supply, the +5V screw terminal is left unconnected, reducing the wiring required. Twelve mounting holes are provided. Mounting screws or standoffs are not included. The hardware used to mount the bus board will depend on the type of case you are using. Pan-head wood screws and a nylon spacer are recommended in a wood case. In a metal case, nylon screws and nylon threaded standoffs are recommended. Dimensons are 12"" (300mm) by 0.9"" (23mm).
specs: |-
  - The Stoel Music Systems Bus Board is an excellent way to distribute power to your Eurorack modules
  - It has power connectors for powering up to 20 modules
  - Each voltage has an LED indicator
  - There are two sets of screw terminals, making it easy to connect multiple bus boards to one power supply
  - To improve performance and reduce noise, the board uses a ground plane design, and each voltage has a filter capacitor
