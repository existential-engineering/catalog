description: The 412ce is a Grand Concert acoustic-electric from Taylor's 400
  Series, featuring Indian rosewood back and sides with a Sitka spruce top,
  V-Class bracing, and ES2 electronics — a fingerstyle-friendly combination with
  crisp trebles and warm low end.
details: |-
  The 412ce combines Indian rosewood back and sides with a Sitka spruce top in a compact Grand Concert body — a tonal profile that delivers warm, resonant low end balanced by crisp, articulate trebles well-suited to fingerstyle playing.

  Taylor's V-Class bracing provides greater volume, sustain, and intonation accuracy. The 24-7/8" scale length and Venetian cutaway make upper-fret access comfortable for extended sessions. The Neo-Tropical Mahogany neck with West African Crelicam Ebony fretboard adds tonal density.

  Expression System 2 behind-the-saddle electronics capture the guitar's natural acoustic voice for amplified performance. The guitar ships with a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Indian Rosewood (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Tuners: Taylor Nickel
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
