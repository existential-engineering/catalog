description: Professional Software Controller with MP3/CD/USB. NDX800 is a
  digital DJ software controller and CD/MP3 player with an integrated sampler
  and beat-synced DSP effects.
details: |-
  NDX800 isn't just a digital DJ software controller — it's also a top of the line CD Player. NDX800's smooth, fast and reliable CD drive works with both CDs and MP3 CDs. You can even connect a USB flash drive for access to thousands of MP3s without taking a computer or CDs to the gig.

  NDX800 has an advanced platter that is touch-sensitive for superb accuracy and smooth control of tracks on software, CDs and flash drives. The big, seven-inch platter is surrounded by an illuminated ring that acts as a position display, just like putting tape on vinyl. You'll appreciate NDX800's smooth, quick, slot-loading disc action. The deck has Anti-Shock electronically buffered skip protection to keep the music playing reliably when the floor gets packed. You can also adjust NDX800 to perform just like vinyl on turntables thanks to start and stop-time controls. The deck has Auto Cue, Instant Start, and Stutter Start for quickly and easily playing the track the way you like. Track selection is a breeze with a rotary control, and you can play back tracks in single, continuous, program, and shuffle modes. Fader Start enables NDX800 to start playing the track you have cued up when you move the crossfader on a compatible mixer for effortless transitions.

  On top of playing all kinds of music media, NDX800 enables you to add flavor to your performances with integrated, beat-synced DSP effects that include chop, echo, filter, flanger, pan, and phaser. Each is completely adjustable and a dedicated wet-dry fader controls them all.

  NDX800 contains a set of beat and pitch tools that will help you with beat matching and harmonic mixing. Start playing a track and NDX800 automatically analyzes its BPM (tempo), and displays it on screen. There's also a Tap tempo button for manual BPM entry. You can alter the track's BPM by ±6, 12, 25, and 100% using the pitch fader. For each of those ranges, you can also engage Key Lock, which holds the pitch of the track while you independently manipulate its BPM. There's also a set of pitch-bend buttons on each track for quick tweaks and you can adjust pitch in half steps (semitones).

  NDX800 gives you a complete range of remixing tools for on-the-fly creativity. NDX800 has an internal sampler with overlay and reverse settings so you can easily grab samples while you work and trigger them on the three sample/hot cue trigger pads whenever you want. NDX800 also has seamless looping on a set of easy-to-understand controls including adjustable loop-out point. Numark's familiar Bleep/Reverse gives you the ability to keep time moving forward while you cut or reverse the track. Five stutter starts and cue point memory storage round out this powerful deck's remix capabilities. NDX800 features a large, backlit display for keeping tabs on the deck even in poorly lit conditions.
