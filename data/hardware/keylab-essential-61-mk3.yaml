description: >
  A 61-key MIDI controller that combines a wider keyboard range with focused controls, inspiring features, and professional software. KeyLab Essential 61 mk3 delivers a personal, enjoyable workflow with room for expressive playing.
details: |-
  Keylab essential mk3 is a universal MIDI controller designed for beginner to experienced music makers seeking seamless DAW integration and creative control. It distills focused controls, inspiring features, and professional software into a keyboard controller package that offers total creative freedom. Available in 49-key and 61-key configurations, the controller combines premium keybed quality with intuitive workflow optimization, allowing musicians to control any DAW while maintaining hands-on access to their sounds and mixing parameters.

  The controller features a semi-weighted, velocity-sensitive hybrid synth-piano feel keybed that captures every nuance of performance, complemented by familiar pitch and modulation wheels and pedal input for sustain, footswitch, or expression control. Eight rgb color-coded, pressure-sensitive pads enable switching between MIDI notes, clip triggering, and finger-drumming across 2 banks. Nine full-rotation encoders and nine 30mm faders provide ultra-smooth real-time control over track levels, envelope settings, and parameters on arturia instruments, while a bright 2.5-inch LCD display with contextual buttons delivers real-time feedback on tweaks and controls.

  Creative performance features include a multi-mode arpeggiator with hold function, chord play mode for playing rich chords with single keys using built-in or custom chord presets, and scale mode that locks the keybed to built-in scales to prevent wrong notes. Performance controls enable note bending, sound modulation, and keyboard transposition by semitones or full octaves. The DAW command center with custom integration scripts for major daws ensures seamless control, while mcu/hui compatibility provides fast, familiar setup with virtually any DAW.

  Keylab essential mk3 includes comprehensive software: analog lab v with 2000+ sounds from v collection, augmented series, and pigments; ableton live lite for music recording and production; native instruments komplete select for production toolkit; uvi model d; a 2-month loopcloud subscription with millions of royalty-free samples; and melodics subscription offering 40 lessons for keyboard skills. The controller supports up to 6 user presets for customizable control assignments and seamless recall of favorite analog lab presets.

  Built with sustainability in mind, keylab essential mk3 follows eco-design principles with minimum 40% recycled plastic construction, 100% recyclable packaging, and an 18% material carbon footprint reduction. The controller is available in four finishes: black, white, rose quartz, and aquamarine, with both 49-key and 61-key options offering identical DAW integration, performance-ready controls, and software bundles. Dimensions are 790 x 70 x 240 mm (31.10 x 2.76 x 9.45 inches) with a weight of 2.76 kg (6.08 lb).
specs: |-
  - 49-key and 61-key velocity-sensitive keyboard
  - Hybrid synth-piano feel keybed
  - Semi-weighted keybed
  - 1 modulation wheel and bend wheel
  - 8 touch and pressure-sensitive rgb pads
  - 2.5 inch LCD display with contextual buttons
  - 9 rotary encoders with full rotation
  - 9 x 30mm faders
  - 1 clickable encoder
  - 4 command switches
  - 8 transport switches
  - Multi-mode arpeggiator
  - Chord mode with custom chord shapes
  - Scale mode with built-in scales
  - Hold function
  - Semitone transpose
  - Octave transpose
  - MIDI channel select
  - 2 banks of 8 pressure and velocity-sensitive pads
  - DAW command center with mcu/hui compatibility
  - Custom DAW scripts for fl studio, logic pro, ableton live, cubase, bitwig studio
  - Nks-compatible for native instruments komplete kontrol ecosystem
  - Up to 6 user presets
  - Seamless integration with analog lab v
  - USB-c connectivity
  - MIDI 5-pin din output
  - Pedal input for sustain, modulation, or expression
  - USB-c powered
  - Windows 10+ (64-bit) compatible
  - Mac os 11+ compatible
  - M1 cpu compatible
  - 4 gb ram required
  - 4 cores cpu 3.4 ghz minimum
  - 3gb free hard disk space required
  - Opengl 2.0 compatible gpu required
  - VST, AAX, audio unit, nks compatible
  - Standalone compatible
  - Minimum 40% recycled plastic construction
  - 100% recyclable packaging
  - 18% material carbon footprint reduction
  - Available in black, white, rose quartz, and aquamarine finishes
