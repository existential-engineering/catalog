description: Weighing just 18kg, the Ashdown Rootmaster EVO II 212T is a
  500-watt 2 x 12" bass cabinet at 8 ohms, driven by dual White Line Ashdown 12"
  speakers for exceptional attack, clarity, and low-end. Its compact,
  side-ported design maintains low-end response with a punchy mid-range, and a
  three-way tweeter switch (hi, low, or off) adds extra high-end zing.
  Lightweight ply construction, genuine Neutrik Jack/Speakon combi jacks, metal
  corners, and a Buffalo Tolex finish with black cloth grill complete the
  package.
details: |-
  Super-lightweight 2 x 12" bass speaker cabinet in the Rootmaster EVO II range, introduced for 2021. It delivers a punchy 500 watts at 8 ohms through dual White Line Ashdown 12" speakers for attack, clarity, and low-end, while weighing just 18kg. A compact, side-ported design maintains low-end response with a dynamic punchy mid-range, and the tweeter can be set to hi, low, or off via a three-way switch. Built from lightweight ply with genuine Neutrik Jack/Speakon combi jacks, metal corners, and a Buffalo Tolex finish with black cloth grill.
specs: |-
  - Power handling: 500 watts
  - Impedance: 8 Ohms
  - Speaker configuration: 2 x 12" White Line Ashdown speakers
  - Side-ported design
  - Tweeter: three-way switch (hi / low / off)
  - Weight: 18kg
  - Lightweight ply construction
  - Genuine Neutrik Jack/Speakon combi jacks
  - Buffalo Tolex finish with metal corners and black cloth grill
