details: |-
  A limited-edition throwback reissue of the original V1 Morning Glory. The V1 Morning Glory featured a larger white enclosure with black knobs, no bright-cut switch, and no logo — the circuit that started it all. This limited run allowed players to experience the original V1 voicing before JHS transitioned to the smaller current enclosure with the gold powder coat in V2.
