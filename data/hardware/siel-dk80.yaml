description: >-
  The SIEL DK-80 is a 12-voice polyphonic analog synthesizer with digital control from
  1985, bridging the gap between low-end mid-1980s Roland and Sequential instruments. It
  features bi-timbral capability with a split keyboard mode, essentially offering two
  polysynths in one 61-key velocity-sensitive instrument. Additional features include a
  2-track realtime sequencer, chord memory, hold functions, and programmable stereo
  panning with sweeping effects.
details: |-
  The DK-80 represents an interesting hybrid approach from SIEL, combining analog sound generation with digital parameter editing. Rather than being a fully digital instrument, this synthesizer maintains analog oscillators and filters while employing digital controls for parameter manipulation.

  The interface uses membrane push buttons for editing parameters one at a time, which was characteristic of budget-conscious synthesizer design during the mid-1980s. The onboard sequencer provides basic composition and looping capabilities, and additional features include chord memory, hold functions, and programmable stereo panning with sweeping effects.

  Sound quality is described as acceptable, making the DK-80 serviceable as a backup synthesizer, though its limitations may restrict its use as a primary analog instrument. The device was notably used by the electronic group Eat Static.
specs: |-
  - 12-voice polyphony
  - 2 DCOs (sine, square, triangle)
  - 1 pink noise generator
  - 2 LFOs
  - 2 24 dB/octave low-pass VCFs
  - 2 six-point envelope generators
  - 61 velocity-sensitive keys
  - Bi-timbral with split keyboard mode
  - 2-track realtime sequencer
  - 40 presets, 10 user patches, 50-100 external programs via RAM/ROM pack
  - Chord memory and hold functions
  - Programmable stereo panning
  - MIDI In/Out/Thru
