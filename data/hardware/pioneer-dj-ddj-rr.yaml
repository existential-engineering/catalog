description: The DDJ-RR is the little brother of our professional controllers
  for rekordbox dj, the DDJ-RZ and DDJ-RX . It has a compact design and
  intuitive layout with large jog wheels, illuminated on-jog indicators and
  tactile Performance Pads. This 2-channel controller comes with dedicated
  controls for rekordbox dj , such as Slip Mode, Release FX, Sequence Load, and
  Deck Select so you can switch between all 4 rekordbox dj decks by the touch of
  a button.
details: |-
