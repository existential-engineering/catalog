description: Versatile drum synth in 3HP.
details: |-
  Pico Drum2 is a compact yet versatile percussion synthesizer in a 3HP eurorack module. It features 8 drum synthesis algorithms created to deliver distinct sounds to a modular system.

  Each algorithm offers a lot of flexibility, so a big sounding bass drum and a squelchy snare can be dialled in within the same algorithm. Three parameters are available per algorithm, and algorithm switching itself can be placed under CV control.

  The module tracks 1V/Oct and all parameters can be mapped to the CV1 input. It is 3HP wide and 35mm deep, with input protection against over voltage and protection against a reversed PSU connection.
specs: |-
  - 8 percussion algorithms
  - 3 parameters per algorithm
  - 1V/Oct tracking
  - CV control over all parameters
  - CV controlled algorithm switching
  - Input protection against over voltage
  - Protection against reverse PSU connection
  - Output level 10Vptp
  - CV level (full span) -5V to +5V
  - Power consumption +28mA, -5mA
  - Module width 3HP
  - Module depth 35mm
