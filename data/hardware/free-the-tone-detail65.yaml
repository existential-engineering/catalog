description: The RED JASPER RJ-2V is a low gain overdrive pedal with a passive
  HI-CUT tone circuit and a four-position mode switch for low frequency
  characteristics.
details: |-
  The RED JASPER RJ-2V is the second generation of Free The Tone's low gain drive pedal. The maker describes its sound as resembling that of vintage tube amps, with smooth highs, punchy mids, full but tight lows and a natural compression feel, and says every component was examined and selected to refine it.

  Because the low register output of an overdrive varies with its gain setting and with the guitar, amp and cabinet in use, the RJ-2V adds a mode switch that selects between four different low frequency characteristics, or cut-off frequencies, so the low end can be matched to the rest of the rig. The low end of the bass range is cut progressively from setting A through to setting D, and the factory default is setting C.

  A HI-CUT tone circuit adjusts the higher registers. It is a passive circuit chosen for minimum phase error in the guitar signal, which the maker says gives high-fidelity amplification and keeps the guitar's original timbre; turning the knob counterclockwise cuts highs gently, much like the tone control on a guitar.

  Free The Tone's HTS (Holistic Tonal Solution) circuit performs impedance conversion while bringing out the sound characteristics of the guitar, and prevents degradation of the guitar's timbre even when the effect is switched off. The output signal is in the same phase as the input signal, so there is no phase reversal to allow for.
specs: |-
  - Input impedance: min. 390k Ohm
  - Output load impedance: min. 10k Ohm
  - Controls: LEVEL, HI-CUT and DRIVE knobs
  - Mode switch selects low end frequency characteristics from four settings (A to D), factory default setting C
  - Terminals: 2 x 1/4 inch standard phone jacks (input, output), DC9V input jack (for AC adapter connection)
  - Power supply: 9-volt PP3 battery, or 9V DC center negative polarity
  - Current consumption: 11 mA at DC 9V
  - Dimensions (D x W x H): 123 x 100 x 53 mm including protuberances such as footswitches and jacks
  - Weight: approx. 320 g excluding battery
  - Passive type hi-cut tone circuit to minimize phase error
  - Output signal in the same phase as the input signal
