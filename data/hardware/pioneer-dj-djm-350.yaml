details: |-
  2-channel effects mixer.

  The DJM-350 is the perfect entry-level mixer, boasting features from our top-flight mixers – including powerful creative effects, USB recording and a MIC input with a 2-band EQ – without the top-flight price.

  Record directly to USB. Record straight to a USB storage device and add track marks as you play so you can easily navigate, review and edit your set later.

  Energetic FX. Use the intuitive controls to add FX including Crush, Jet, Gate and use the High/Low-pass filter to change their parameters.

  EQ isolator on each channel. Use the 3-band EQ isolator to control the high, mid and low frequencies on each channel independently.
specs: |-
