details: |-
  The Belle Epoch Deluxe is Catalinbread's faithful recreation of the classic Echoplex EP-3 tape echo circuit. It faithfully reproduces the EP-3's 22 volt power rail, JFET preamp (later spec), mixer stage, high gain silicon transistor based record and playback amplifiers, and the feedback loop.

  The Deluxe version expands on the original Belle Epoch with additional controls for greater versatility while maintaining the warm, organic character of real tape echo. The pedal is designed to capture the same harmonic enhancement and slight saturation that made the EP-3 a studio and stage staple for decades.

  The Belle Epoch Deluxe is endorsed by guitar legend Eric Johnson, who is known for his meticulous attention to tone and his use of the original Echoplex EP-3 in his signal chain.
