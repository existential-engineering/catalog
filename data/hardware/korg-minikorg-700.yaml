description: >-
  The Korg MiniKorg-700 is a compact monophonic analog synthesizer first
  produced in 1974, featuring dual oscillators with triangle, sawtooth, and
  square waveforms. Its controls are uniquely positioned beneath the 37-key
  keyboard to accommodate a music stand above. Despite its simplicity, it is
  capable of generating rich analog bass sounds, growls, and unusual textures
  through its ring modulators and built-in effects.
details: |-
  The MiniKorg-700 holds a notable place in synthesizer history as one of Korg's earliest monophonic instruments. The original single-oscillator MiniKorg-700 evolved into the dual-oscillator 700S model, both sharing the distinctive design choice of placing all controls beneath the keyboard rather than above it, allowing musicians to use a music stand during performance.

  Sonically, the MiniKorg-700 offers a surprisingly wide palette for such a simple instrument. Its two VCOs can be detuned against each other for thick, beating tones, and three ring modulators provide access to metallic, inharmonic, and experimental textures. The high-pass and low-pass filters shape the sound effectively, making it particularly well-suited for punchy analog bass lines in electronic and techno music.

  Built-in effects include portamento, a rudimentary repeat-delay, auto-bend, vibrato, chorus, and noise waveforms, all adding character and movement to the sound. The synth has earned a reputation for reliability and stability, and has been used by artists including The Cure, Vangelis, Stevie Wonder, The Cars, Human League, Kitaro, ComaTeens, N-Trance, the Normal, and Paul Hardcastle.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, triangle, square waveforms)
  - LFO: Yes
  - Filter: High-pass and low-pass filters
  - Effects: 3 ring modulators, portamento, auto-bender, vibrato, repeat-delay, chorus, noise
  - Keyboard: 37 keys
  - Memory: None
  - Control: No pitch or modulation wheels
  - Date Produced: 1974
