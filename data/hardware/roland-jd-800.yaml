description: >-
  The Roland JD-800 is a programmable digital synthesizer released in 1991,
  designed to bring hands-on control back to digital synthesis with a panel
  covered in dedicated sliders. Built around ROM-based waveforms and multimode
  filters, it offers 24-voice polyphony and 6-part multitimbrality in a rugged
  metal chassis with a 61-key velocity- and aftertouch-sensitive keyboard.
details: |-
  The Roland JD-800 was released in 1991 as Roland's answer to the growing frustration with menu-driven digital synthesizers. Where most digital synths of the era buried parameters deep in LCD menus, the JD-800 put nearly every synthesis parameter on a dedicated front-panel slider, recalling the immediacy of classic analog instruments while delivering modern digital sound quality.

  The synthesis engine is built around internal ROM-based waveforms descended from Roland's D-50 lineage, processed through multimode filters that were uncommon in digital synthesizers at the time. Each of the four tones per patch can be independently shaped using dedicated envelope, filter, and amplifier controls, allowing complex layered sounds to be sculpted in real time.

  The JD-800 was produced from 1991 to 1993 and found its way into the studios of artists spanning electronic, progressive rock, and ambient genres, including William Orbit, Depeche Mode, Underworld, Tangerine Dream, Genesis, and 808 State. Its combination of programming depth and tactile control has kept it a sought-after instrument on the used market decades after its discontinuation.
specs: |-
  - 24-voice polyphony
  - ROM-based digital oscillators
  - Multimode filters (low-pass, band-pass, high-pass)
  - 61-key velocity and aftertouch sensitive keyboard
  - 6-part multitimbral
  - 4 tones per patch with independent envelopes
  - Dedicated front-panel sliders for real-time parameter control
  - Built-in effects
  - MIDI in/out/thru
  - Rugged metal chassis with plastic side panels
  - Produced 1991-1993
