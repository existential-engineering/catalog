description: The 4018 Supercardioid Tabletop Microphone is ideal for unobtrusive
  or distant miking like dialogue, interview and table or spot-recording use.
details: |-
  This mic can be used for dialogue, interview and table or spot-recording use. It offers superb expandability through modular accessories and is ideal for unobtrusive or distant miking such as desktop use.

  With a length of only 5 cm (2 in), the 4018 Supercardioid Microphone has a highly-directional supercardioid pickup pattern with a smooth and uniform off-axis frequency response. The supercardioid shape is frequency independent, securing an identical sound color around the microphone. The usual rear lobe heard on most supercardioids is minimized on this capsule. This makes it much more isolated without sudden frequency dependent peaks and dips.

  Combine it with the preamp of your choice: at any time, and with no tools needed, it is possible to transform the 4018-D-005 Supercardioid Microphone into a new configuration. You can combine it with another pencil mic capsule or preamplifier.
specs: |-
  - Directional pattern: Supercardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range, ±2 dB, at 30 cm (11.8 in): 40 Hz - 18 kHz
  - Sensitivity, nominal, ±2 dB at 1 kHz: 12 mV/Pa; -38.4 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 16 dB(A) re. 20 µPa (max. 19 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 23 dB
  - Distortion, THD < 1%: 134 dB SPL RMS, 137 dB SPL peak
  - Dynamic range: Typ. 121 dB
  - Max. SPL, THD 10%: 142 dB SPL peak
  - Rated output impedance: 100 Ω
  - Cable drive capability: 100 m (328 ft)
  - Output balance principle: Impedance balancing
  - Common mode rejection ratio (CMRR): > 40 dB
  - Power supply (for full performance): P48 (Phantom Power)
  - Current consumption: 3.5 mA
  - Connector: XLR-3M. Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase
  - Weight: 109 g (3.8 oz)
  - Microphone diameter: 19 mm (0.75 in)
  - Capsule diameter: 19 mm (0.75 in)
  - Microphone length: 35 mm (1.38 in)
  - Maximum output voltage, RMS: 2.2 V
  - Polarity: +V at pin 2 for positive sound pressure
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Matching tolerance (frequency response and sensitivity): ±1 dB
  - Phase deviation for kit: < 10°
  - Color: Matte black
