description: A transparent, low-noise 500-series microphone preamp with a single
  Colour module socket for adding adjustable analog character to the signal.
details: |-
  The CP5 is the first microphone preamp to feature Colour. On its own, the CP5 is a reference-quality, 500-series mic preamp with copious amounts of clean gain. With Colour, the CP5 is the most tonally versatile preamp in the world. World Class Preamp. The CP5 is a transparent, low-noise preamp that performs as good or better than preamps 5x the price (seriously, check out the SPECS tab above). The preamp's signal path features only best-in-class components, including WIMA capacitors and THAT Corp. ICs. Preamp gain and Colour are adjustable via stepped controls for easy recall and stereo operation. Add Some Colour. Plug any Colour module into the CP5 to add some character to your preamp. Dial in the exact amount of Colour you want with the stepped Colour control. Switch between tone and transparency with the Colour bypass switch. The CP5's preamp works with or without a Colour installed. Beginner Friendly. Like all our kits, the CP5 comes with every part required and step-by-step picture instructions. Features

  - Single Colour socket
  - Colour control adjusts amount of Colour without changing overall gain
  - Kit includes every component required to build the CP5
  - Step-by-step manual and guaranteed support

  The CP5 circuit and PCB layout were designed by Peter and Robert-Eric Gaskell of GKL Audio . What the Pros are Saying

  "Undoubtedly the most flexible and variable mic pre out there. And if you know how to solder it's at an unparalleled price point for its quality. Pro tip... it pairs extraordinarily well with DIYRE passive summing mixers for even more tonal flexibility on your mix bus or group buses."

  -Jack Mason
  J.Cole, Joe P, Spotify Singles

  "This really is one of the most versatile and useful preamps on the market. If you like getting your hands on a soldering iron, it can be one of the most satisfying to own as well."

  - Sonic Scoop

