description: A Eurorack module that plugs into a 16-pin power connection and
  generates regulated +5V from the +12V rail for bus boards lacking a +5V
  supply, with thermal shutdown and current limiting.
details: |-
  The Stoel Music Systems +5 Regulator is a simple, low-cost way to add +5V to your Eurorack bus board. Plug it into a 16-pin Eurorack power connection on your bus board. It draws from the +12V supply and provides regulated +5V onto the correct +5V bus. Features include thermal shutdown, current limiting, and an LED to indicate operation.
