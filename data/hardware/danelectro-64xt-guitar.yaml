details: |-
  Ultra cool vintage shape with classic Danelectro chambered body. Dual Lipstick Humbucker Pair in bridge with large Single Coil in neck. Coil tap with a pull on tone knob. Wilkinson tremolo. Best tone of any 6 string we ever made.

  Guitar Player Editor's Pick
specs: |-
  - Reversed double cutaway offset horn shape
  - Scale length: 25"
  - Number of frets: 22 (graphite nut)
  - Wilkinson vibrato bridge
  - 1 dual humbucking Lipstick bridge pickup
  - 1 vintage style large housing single coil neck pickup
  - 1 master volume
  - 1 master tone (with push-pull switch to split bridge pickup)
  - 3-way pickup switch
  - Finishes: Ice Gray, 3-Tone Sunburst, Black, Blood Red, Cream, Dark Aqua
