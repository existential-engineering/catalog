details: |-
  The 4006 Omni Mic offers total transparency in any recording situation. It picks up incredible detail and depth of sound. The definition of its high-frequency characteristics across a wide range of instruments is impressive. It offers natural sound, high sensitivity, low noise-floor and linear frequency response from 10 to 20 kHz (±2 dB).

  This omnidirectional condenser microphone is linear and true in character. It has earned its status as a worldwide recording standard and is DPA's most popular pencil mic. The mic has forged its enviable reputation over the past quarter of a century by repeatedly exhibiting its total transparency in any recording situation. Engineers, broadcasters and musicians alike can achieve clean, natural and precise sound reproduction. It is ideal for A-B stereo pairs for symphonic concert hall recordings, and also excels on vocals and for close miking all types of instruments.

  A wide selection of accessories is available, including acoustic pressure equalizers, a nose cone and interchangeable protection grids. These accessories can acoustically transform the mic. By changing grids, it is possible to gain several unique frequency responses and directional characteristics. These accessories will not produce any phase shift, noise or distortion that would otherwise be introduced by an electrical filter. The 4006 is also available as the compact 4006C and as the ultra-compact 4006ER/ES with rear or side cable entry.

  As with all of the modular pencil microphones, the Omni Mic Capsule can be combined with any of DPA's preamps. The MMP-A Microphone Preamp is an ultra-transparent, transformerless preamp with active drive for impedance balancing. The MMP-C Compact Microphone Preamp is an ultra-compact preamp with active drive. Other preamps include the small form factor MMP-E Modular Active Cable (XLR output) and MMP-G Modular Active Cable (MicroDot output), allowing for very slim set-ups.

  NASA's Mars 2020 Rover took off on July 30, 2020 for a seven-month journey to Mars. It touched down successfully on February 18, 2021 with a DPA 4006 Omnidirectional, an MMA-A Digital Audio Interface and an MMP-G Modular Active Cable in tow.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 10 Hz - 20 kHz
  - Effective frequency range ±2 dB: 10 Hz - 20 kHz
  - Sensitivity, nominal, ±2 dB at 250 Hz: 36 mV/Pa; -28.9 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 15 dB(A) re. 20 µPa (max. 17 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 27 dB (max. 29 dB)
  - Distortion, THD < 1%: 133 dB SPL RMS, 136 dB SPL peak
  - Dynamic range: Typ. 121 dB
  - Max. SPL, THD 10%: 146 dB SPL peak
  - Switchable attenuator: 0 dB / -20 dB
  - Rated output impedance: 200 Ω
  - Cable drive capability: 100 m (328 ft)
  - Output balance principle: Impedance balancing with Active Drive
  - Common mode rejection ratio (CMRR): > 60 dB
  - Power supply: P48 (Phantom Power)
  - Current consumption: 2.8 mA
  - Connector: XLR-3M (Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase)
  - Weight: 163 g (5.7 oz)
  - Microphone diameter: 16 - 19 mm (0.6 - 0.75 in)
  - Capsule diameter: 16 mm (0.6 in)
  - Microphone length: 170 mm (6.7 in)
  - Maximum output voltage, RMS: 8.0 V
  - Polarity: +V at pin 2 for positive sound pressure
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Matching tolerance (frequency response and sensitivity): ±0.5 dB
  - Phase deviation for kit: < 5°
  - Color: Matte black
  - Features: Acoustic authenticity; Linear throughout a large frequency bandwidth; Detailed and natural reproduction; High sensitivity and low noise floor; Excellent for concert halls and spot miking acoustical instruments; Modular flexibility
