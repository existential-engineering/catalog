details: |-
  The COLLECTOR Series is an exceptionally rare and expressive parlor crafted from Milagro Brazilian rosewood and Western red cedar. This small-body instrument delivers remarkable depth, warmth, and sensitivity, with a highly responsive feel that rewards light touch and expressive playing. The Black Edgeburst gloss finish and refined appointments highlight the exclusivity of this build, offering a deeply intimate voice suited for solo performance, recording, and collectors seeking something truly extraordinary. These are limited series of 5 total per shape.
