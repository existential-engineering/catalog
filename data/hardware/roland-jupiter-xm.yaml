description: >-
  The Jupiter-XM is a portable 37-key synthesizer that continues the legacy of Roland's
  iconic Jupiter line, combining classic design with a powerful modern synth engine. It
  faithfully recreates sounds from legendary Roland instruments including the Jupiter-8,
  Juno-106, SH-101, and XV-5080, along with drum machine emulations from the TR-808,
  TR-909, and CR-78. Powered by eight AA batteries with built-in stereo speakers, it is
  designed for both studio and on-the-go performance.
details: |-
  Released in 2020, the Jupiter-XM represents Roland's return to the Jupiter brand after eight years, following the Jupiter-50 and Jupiter-80. The synthesizer emphasizes premium construction with aluminum end pieces and a black brushed metal panel featuring the iconic orange stripes of the range.

  The sound engine is extraordinarily flexible, capable of reproducing classic Roland instruments spanning decades of the company's history. A standout feature is the I-Arpeggio system, which uses artificial intelligence to generate complementary drum parts, chords, basslines, and arpeggiated lines intelligently rather than relying on preset backing tracks.

  The 37-key slim keyboard provides responsive velocity-sensitive keys across three full octaves, though it lacks aftertouch capability. The interface includes a 128 x 64-dot graphic LCD along with numerous knobs, sliders, and buttons for tactile control, though the compact display size requires some menu diving to access deeper parameters. Those requiring a larger keyboard can step up to the Jupiter-X model with 61 keys.
specs: |-
  - Keyboard: 37 keys, compact type with velocity sensitivity
  - Oscillators: 4 per voice
  - Effects: Multi-effects with 4 systems and 90 types
  - Arpeggiator: I-ARPEGGIO with multi-part playing detection
  - Display: 128 x 64-dot graphic LCD
  - Connectivity: MIDI In/Out, USB
  - Audio: Built-in stereo Bluetooth speakers
  - Power: 8 AA batteries or AC adapter
releaseDate: "2020"
