  push/pull tone pot splits both pickups.
details: |-
  The G&L ASAT HH RMC takes the iconic ASAT into humbucker territory while retaining the feel and playability that have made the ASAT a perennial favorite among players. Essentially a fusion of Fullerton and Kalamazoo, the HH RMC features G&L Alnico humbuckers housed in an Alder body. An innovative G&L Saddle-Lock bridge transfers string energy right into the body end-grain to make the most of the resonant body wood combination. The familiar ASAT feel continues with a hard-rock maple neck sporting an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Neck - G&L AS4255B, Bridge - G&L AW4470B
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Controls: 3-position pickup selector, volume, tone with push/pull coil split for both pickups
  - Includes: G&L Deluxe Gig Bag
