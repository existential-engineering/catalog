details: |-
  Explore the advanced potential of multiband processing. The Ultrawave offers an array of thick and rich distortion and tremolo effects with unique overtones and dynamic interplay.

  The device combines multiband distortion and tremolo capabilities with sophisticated sound design tools. It features detailed LFO controls for tremolo, morphing, and ring modulation effects, along with 37 band-splitting options (single, 2, 3, 4, 8, and 10 bands with varying frequency points).

  The pedal enables sound morphing via expression pedal, envelope follower, or LFO, plus an 8-band graphic equalizer and a dual-channel compressor/expander. Integration with Neuro 3 software and the mobile app allows customization and sharing of effects.

  It stores 128 presets (6 via pedal toggle, 128 via MIDI), offers stereo I/O with Channel 1/2 sync and phase offset control, Universal Bypass (true bypass relays or analog buffers), reassignable knobs per preset, and USB-MIDI support (PC, CC, and MIDI Clock messages).
specs: |-
  - Multiband distortion and tremolo processing
  - 37 band-splitting options (single, 2, 3, 4, 8, 10 bands)
  - Detailed LFO controls for tremolo, morphing, and ring modulation
  - Sound morphing via expression pedal, envelope follower, or LFO
  - 8-band graphic equalizer
  - Dual-channel compressor/expander
  - 128 presets (6 via pedal toggle, 128 via MIDI)
  - Stereo I/O with Channel 1/2 sync and phase offset control
  - Universal Bypass (true bypass relays or analog buffers)
  - Reassignable knobs per preset
  - USB-MIDI support (PC, CC, MIDI Clock messages)
  - Housing: brushed anodized aluminum
  - Weight: 0.625 lb
  - Dimensions: 4.6 in. x 2.75 in. x 2.2 in.
  - Power consumption: 165 mA
