description: A left-handed baritone electric guitar with a lightweight Simarouba
  body, raised center-block, roasted maple neck, and a custom JM-style neck
  pickup paired with a humbucker bridge pickup.
details: |-
  Revolution, Redefined. Updated for 2024, the new Rivolta Mondata Baritone has been re-designed from the ground up by world renowned luthier & designer Dennis Fano ( Novo Guitars ). The Rivolta Mondata Baritone LH (Left-Hand) features an ultra lightweight Simarouba solid body with a refined raised center-block, 1-piece set Roasted Maple neck with a satin finish for improved comfort and playability, hand rolled Ebony fretboard with our new oval Pearloid inlays, 24 medium jumbo frets, JM style bridge & custom aluminum Rivolta 'Vibra-tail' tailpiece for easy string changing and classic offset string resonance. Under the hood, the Rivolta Mondata Baritone features our new Rivolta Custom JM style neck pickup and vintage voiced Rivolta Custom Humbucker in the bridge. The simple, single vol/tone controls are complimented by 4 x pickguard mounted toggle switches to offer pickup on/off, coil split and in/out phase options. Features & Specs
specs: |-
  - Body Wood - Lightweight Simarouba with raised center block
  - Neck Wood - Set 1pc Roasted Maple
  - Fretboard Wood - Bound Ebony with rolled edges
  - Inlays - Pearloid/MOTO Oval
  - Side Dots - Black
  - Scale - 28"
  - Nut Width - 1.687"
  - Neck Width @ 12th Fret - 2.080"
  - Neck Carve Shape - Chunky C+
  - Neck Depth @ 1st Fret - .850"
  - Neck Depth @ 12th Fret - .980"
  - Fretboard Radius - 10"
  - Frets - 24 Medium Jumbo
  - Pickups - Neck - Rivolta Custom JM style (7.5K ohm) / Bridge - Rivolta Custom Humbucker (11k ohm)
  - Wiring - Vol, Tone & 4 x Slider Switches - Bridge On/Off (Right), Neck On/Off (Middle Right), Bridge Split Coil (Left Middle) * This switch will also act as a Bridge ON in Split Coil mode when both pickup switches are in the OFF position (all switches Up position), In/Out Phase (Left)
  - Hardware - Nickel
  - Bridge - Adjustable JM style (10mm String Spacing)
  - Tailpiece - Custom Nickel-plated aluminum
  - Tuners - Wilkinson vintage style with Nickel buttons
  - Knobs - Black reflector with Silver cap
  - Nut Material - Bone
  - Pickguard/Truss cover - Plexi
  - Strings - 14-68 (EXL 157)
  - Body Finish - Gloss
  - Headstock Finish - Gloss
  - Neck Finish - Satin Natural
  - Overall Length - 42"
  - Body Length - 20"
  - Body Width @ Lower Bout - 14 1/2"
  - Body Width @ Upper Bout - 12"
  - Body Depth - 1 25/32"
  - Overall Depth - 2 15/32"
  - Average Weight - 7.5lbs
  - Optional Cases:
  - Custom Rivolta Hard Case
  - Rivolta Premium Soft Case
