details: |-
  The original DITTO LOOPER carved out a unique space in the world of guitar pedals.  By distilling the very essence of looping into a tiny, high quality stompbox with an extremely intuitive interface it continues to define the way we perceive guitar loopers to this day. DITTO+ takes all of the functionality that you know and love from the original DITTO and expands it with a little extra.  With the ability to store and recall up to 99 loop sessions, easy track importing/exporting and the all-new Extended Loop Mode feature, DITTO+ offers the discerning guitar player a little more of everything.

  There’s nothing more refreshing than a quick face-melting session in between procrastinations!  We’d all love to play with actual musicians but for most of us it’s hard to have a band ready in your room for whenever you’ve got a 15-minute hole in your schedule.   DITTO+ lets you import premade loop sessions and backing tracks for such an occasion!  Just pick your jam and rock it out!

  Everyone can be forgetful sometimes but that doesn’t mean that your gear should be!   Even if you accidentally yank out the power cord or suffer a power outage mid-jam, DITTO+ has you covered and stores your session automatically as you go.  As soon as you power back up, the internal memory picks up where you left off, leaving you to focus on what it’s all about – playing!

  Your loops are a reflection of you. So, to have them trapped in a tiny box just doesn’t make any sense.   Now, you are free to export your loops via USB to any computer and work with them in a DAW of your choice, or you can import loops and even backing tracks and take them to gigs.   Small sentence, HUGE advantage for gigging musicians!

  Considering all the potential uses of DITTO+ should take up a pretty substantial chunk of pedalboard real estate. So how does it only take up the space of a standard mini pedal?   Probably some boring but impressive feat of engineering but for us guitar players let’s just assume it’s a kind of sorcery.   Honestly, squeezing all this functionality and creative potential into a pedal that fits on any pedalboard IS magic.
