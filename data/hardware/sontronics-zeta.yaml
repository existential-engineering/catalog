details: |-
  ZETA is our brand-new high-performance JFET microphone, designed to give you a polished, characterful sound the moment you hit record. Built with a boutique Lundahl transformer and tuned by hand in England, ZETA delivers clarity, warmth and musical detail in a way that feels effortless, almost like the sound has already been mixed for you. Its extremely high sensitivity captures every breath, texture and nuance, while the ultra-low noise floor keeps recordings clean and confident in any space. Whether you're recording vocals, voiceover, acoustic guitar, piano or strings, ZETA brings an expressive, three-dimensional quality to every performance. It gives modern vocal producers instant presence, helps voice artists achieve intimate clarity without background noise, and offers studios a versatile tool that sits beautifully across a wide range of instruments and room setups. ZETA isn't trying to imitate a vintage mic. Instead, it carries its own distinctive voice, smooth on the top, rich in the mids and naturally flattering across the whole spectrum. It's a microphone for creators who want their recordings to feel alive, musical and ready to use straight out of the box. Hand-built in England and crafted for those who care deeply about tone and detail, ZETA is the perfect blend of modern precision and boutique character. FEATURES

