specs: |-
  - High-sensitivity JFET design captures every nuance with exceptional clarity and life.
  - Boutique Lundahl transformer adds smooth, musical character without muddying the signal.
  - Ultra-low self-noise (~9 dBA) ensures clean, confident recordings in any environment.
  - Rich, pre-finished sound that delivers presence, warmth and detail straight out of the box.
  - Modern black finish with engraved badges and golden accents.
  - Hand-built in England and covered by our Limited Lifetime Warranty.
  - Male & female vocals
  - Voiceover and spoken word (broadcast, narration, dubbing)
  - Acoustic guitar
  - Piano (upright & grand)
  - Cello, violin, and viola
  - Room miking
  - String sections and solo instruments
  - Vocal layering and harmonies
  - Ambient and choral recordings
  - Foley recording
  - ASMR & texture recording
  - Soft sound sources (flutes, whistles, hand percussion)
  - Microphone type: Large-diaphragm condenser
  - Polar pattern: Cardioid
  - Frequency response: 20Hz to 20kHz
  - Sensitivity: 33mV/Pa
  - Impedance: ≤200 Ohms
  - Max. SPL: (for 0.5% THD @ 1kHz) 125dB
  - Equivalent noise level: 9dB (A-weighted)
  - Connector: 3-pin XLR
  - Power: Phantom power 48V required
  - Product weight: 0.68 kg
  - Packaged weight: 2.15 kg
  - Product dimensions: 190 x 53 x 53mm
  - Packaged dimensions: 235 x 130 x 285mm
  - ZETA high-performance JFET microphone (with internal shockmount)
  - Discrete direct stand mount
  - Robust ABS Carry Case with Custom-Cut Foam inlay
  - User Manual
