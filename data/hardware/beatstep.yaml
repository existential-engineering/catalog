description: >
  The chameleon controller and sequencer that provides nearly endless possibilities. With a compact format, it is the perfect companion on the road or in the studio.
details: |-
  Beatstep is a compact controller and 16-step analog sequencer that combines pad control with sequencing capabilities for both software and hardware instruments. It features 16 velocity and pressure-sensitive pads that provide dynamic performance control and can be configured for various MIDI functions including note on/off messages, mmc commands, program and bank changes, or MIDI cc buttons. The device is highly versatile, capable of triggering clips in applications like ableton live, playing drums with drum software, tweaking synth parameters, or performing multiple functions simultaneously.

  In seq mode, the pads become toggles for each step in the sequence while the 16 encoders adjust pitch for the associated step. The 16 encoders are fully assignable in MIDI control mode and can adjust various parameters for real-time control over drum sounds and other parameters. Pad scale modes, sequence playback modes, and time division functions allow for real-time performance changes, while 16 memories enable instant recall of favorite patterns.

  The device offers advanced connectivity with MIDI, USB, and CV/gate inputs/outputs, allowing integration with analog synthesizers, MIDI drum machines, keyboards, daws, and ipad applications via camera connection kit. The transport buttons can send mmc or MIDI cc messages to daws and control the internal sequence, while the data encoder sends MIDI cc#7 (volume) in control mode and can transpose sequences or change playback rate in seq mode. The 16 pads turn red for control mode or blue for seq mode, providing instant visual feedback during performance.

  Beatstep can function as a MIDI clock master or slave to an external clock, making it compatible with all types of gear including analog synths, software instruments, and MIDI hardware. The compact format, slightly larger than half an a4 page, makes it an ideal companion for both studio and portable use. The device includes analog lab intro software and comes with industry-standard creative software to facilitate musical exploration and production.
