description: T12 DIY kit is a complete self-assembly kit for the T12 Eurorack
  touch controller, including all through-hole components, front panel and power
  cable, with surface-mount components pre-soldered.
details: |-
  This complete DIY kit includes everything you need to assemble the module yourself: all through-hole components, front panel and a power cable. All surface-mount components come pre-soldered, so you only need to solder the connectors, pots, jacks, and other through-hole parts. A standard soldering iron, solder, and basic hand tools are all it takes.
