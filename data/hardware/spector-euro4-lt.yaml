description: A 4-string bass with a weight-relieved European Alder body topped
  with figured North American Maple, a 3-piece Maple neck with Ebony
  fingerboard, custom wound Bartolini pickups, and a Darkglass active preamp.
details: |-
  Spector's Euro Series has established itself as true icon in the world of electric bass. Expertly handcrafted, these instruments represent the true essence of Spector's legendary design. Now, the Euro Series expands to include an additional range of instruments; the Euro LT Series. The European Alder body wings are now carefully weight relieved before they are topped with highly figured North American Maple. The 3-piece Maple neck now features a 24 fret Ebony fingerboard and carefully tapered neck profile that's fast and comfortable. Euro LT basses also include premium, custom wound pickups from Bartolini and a custom voiced Darkglass active pre-amp. Together, they provide an articulate and versatile tonal palette, suitable for all players. Additionally, Euro LT models include professional grade hardware, a variety of all new high gloss finishes, and Spector's world class craftsmanship.
