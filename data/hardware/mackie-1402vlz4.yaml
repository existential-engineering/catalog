description: Mackie 1402VLZ4 14-Channel Compact Analog Mixer with 6 Onyx mic
  preamps, providing pro features and studio-grade sound quality in a portable
  form factor.
details: |-
  When you need more channels, more routing, and more tonal control without the size, the 1402VLZ4 is a top choice. With pro features and studio-grade sound quality, it is ready to rock.

  Six boutique-quality Onyx mic preamps offer an ultra-wide 60 dB gain range, 128.5 dB dynamic range, +22 dBu line input handling and distortion under 0.0007% from 20 Hz to 50 kHz, with improved RF rejection for broadcast work and 48V phantom power for condenser mics.

  Fourteen high-headroom line inputs with +4/-10 operation control, two aux sends, two stereo returns and an ALT 3/4 stereo bus provide the routing, with 60 mm long-wearing log-taper faders and a control room / phones source matrix for monitoring.

  The chassis is a rugged solid-steel Built-Like-A-Tank design with a powder-coat finish, sealed rotary controls that resist dust and grime, and high-contrast controls for at-a-glance feedback. An optional rack ear kit makes it rack-mountable, and the multi-voltage power supply suits worldwide use.
specs: |-
  - 6 boutique-quality Onyx mic preamps
  - Ultra-wide 60 dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20 Hz - 50 kHz)
  - Improved RF rejection perfect for broadcast applications
  - 48V phantom power for condenser mics
  - 14 high-headroom line inputs with +4/-10 operation control
  - 6 balanced channel inserts for integrating outboard gear
  - 3-band EQ (80 Hz, 2.5 kHz, 12 kHz)
  - 18 dB/oct 75 Hz low-cut filter on mic input channels
  - 2 aux sends, level, pan and PFL solo on each channel
  - 60 mm long-wearing log-taper faders
  - 2 stereo returns for connecting FX processor or other stereo source
  - ALT 3/4 stereo bus for added routing flexibility
  - Control room / phones source matrix
  - High-resolution 12-segment stereo meters
  - Sealed rotary controls resist dust and grime
  - Built-Like-A-Tank rugged steel chassis with powder-coat finish
  - Rack-mountable design using optional rack ear kit
  - Multi-voltage power supply for worldwide use
