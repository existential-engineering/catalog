name: Aurora 16
manufacturer: lynx-studio-technology
primaryCategory: audio-interface
categories:
  - rack-mount
  - discontinued
url: https://www.lynxstudio.com/products/aurora-16/
description: The Aurora 16 AD/DA converter provides 24-bit analog to digital and
  digital to analog conversion at sample rates up to 192 kHz in a one-rack-space
  format, with simultaneous 16 channel analog and 16 channel AES/EBU I/O. Lynx's
  SynchroLock word clock offers extreme jitter reduction for the Aurora and for
  other digital devices in the studio.
details: |-
  The Aurora 16 AD/DA converter provides world-class analog to digital and digital to analog conversion in a compact one-rack space format. With sample rates up to 192 kHz, Aurora offers wide, open, uncompressed and unequalised audio for studios, mastering facilities, remote recording, broadcast and production. Lynx's exclusive SynchroLock word clock offers extreme jitter reduction, providing clean digital audio signals for Aurora and other digital devices in the studio.

  Simultaneous 16 channel analog and 16 channel AES/EBU I/O is carried on 25-pin D-sub connectors, with the AES/EBU ports supporting both single-wire and dual-wire modes at 192 kHz. An on-board 32 channel digital mixer provides flexible routing between the analog and digital sides, and the unit can be remote controlled from a Lynx AES16 or AES16e card.

  The LSlot bay lets the connection to a computer be changed as standards move on. Lynx offers USB, Thunderbolt, Pro Tools HD and Dante LSlot cards, each of which presents its own connectors once fitted.

  The Aurora 16 was discontinued in 2017 and replaced in the line by the Aurora(n).
specs: |-
  - Simultaneous 16 channel analog and 16 channel AES/EBU I/O
  - 24-bit / 192 kHz A/D and D/A conversion
  - 16 inputs and 16 outputs, 24 bit AES/EBU format, transformer coupled
  - All standard rates and variable rates up to 192 kHz in both single-wire and dual-wire modes
  - Line in: THD+N -108 dB @1kHz, -1dBFS and -104 dB @1kHz, -6dBFS
  - Line in: dynamic range 117 dB A-weighted
  - Line in: frequency response plus or minus 0.10 dB, 20 Hz to 20 kHz
  - Line in: crosstalk -120 dB maximum @ 1 kHz, -1dBFS signal
  - Line out: THD+N -107 dB @1kHz, -1dBFS and -106 dB @1kHz, -6dBFS
  - Line out: dynamic range 117 dB A-weighted
  - Line out: frequency response plus or minus 0.01 dB, 20 Hz to 20 kHz
  - Line out: crosstalk 120 dB maximum @ 1 kHz, -1dBFS signal
  - Analog I/O ports: 25-pin female D-sub connectors
  - Digital I/O ports: 25-pin female D-sub connectors
  - External clock: 75 ohm BNC word clock input and output with SynchroLock sample clock technology
  - MIDI (for firmware updates only): one input and one output, standard optoisolated 5-pin female DIN connectors
  - On-board 32 channel digital mixer for I/O routing
  - Remote control via Lynx AES16 or AES16e
  - LSlot expansion bay, with USB, Thunderbolt, Pro Tools HD and Dante cards available
  - AC power: 100 / 115 / 230 VAC, 70 watts
  - Size: 1.75 in H x 19 in W x 9 in D
  - Shipping weight: 12 pounds
  - Certifications: CE and FCC Class B EMI, CE product safety
