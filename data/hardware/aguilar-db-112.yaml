description: The DB 112 combines the full low-end extension of the GS 112 with
  the punchy midrange of the DB series, featuring a heavy-duty cast frame
  Eminence driver in a rear ported 13-ply Baltic Birch enclosure for high
  efficiency and focused, musical sound.
details: |-
  The DB 112 is a 1x12 bass speaker cabinet that bridges two of Aguilar's most
  celebrated design philosophies, delivering the deep, extended low-end response
  associated with the GS series alongside the defined, punchy midrange character
  of the DB lineup.

  At the heart of the cabinet is a custom ceramic Eminence driver mounted in a
  heavy-duty cast frame, paired with a phenolic tweeter featuring an integral
  phase plug and a custom crossover with variable tweeter level control for
  precise tonal shaping.

  The enclosure is constructed from 13-ply Baltic Birch in a rear ported design,
  a combination that Aguilar specifies for its rigidity, resonance control, and
  contribution to the cabinet's high sensitivity rating of 95 dB at 1W/1M.

  With a power handling capacity of 300 watts RMS, an 8 ohm impedance, and a
  frequency response extending from 42 Hz to 16 kHz, the DB 112 is suited for
  use as a standalone compact rig or as part of a stacked multi-cabinet
  configuration.

  The cabinet includes practical touring and stage features such as a deluxe strap
  handle for transport and rubber feet for stability, and it is backed by
  Aguilar's 3-year limited warranty.
specs: |-
  - Power Handling: 300W RMS
  - Impedance: 8 ohms
  - Frequency Response: 42 Hz – 16 kHz
  - Sensitivity: 95 dB 1W/1M
  - Driver: Custom Ceramic Eminence driver (heavy-duty cast frame)
  - Tweeter: Phenolic with integral phase plug
  - Crossover: Custom with variable tweeter control
  - Enclosure: Rear ported, 13-ply Baltic Birch
  - Height: 14"
  - Width: 19"
  - Depth: 19"
  - Weight: 45 lbs
