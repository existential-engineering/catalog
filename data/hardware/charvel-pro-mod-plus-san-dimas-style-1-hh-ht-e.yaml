description: |-
  The Pro-Mod Plus San Dimas Style 1 HH HT E is a modernized take on Charvel's classic San Dimas shred machine, built for lightning-fast playing with an updated feature set. The alder body wears a gloss finish with a matching painted headstock, and a hand-shaped heel with recessed neck screws provides unimpeded upper-fret access.

  A bolt-on caramelized maple neck with graphite reinforcement and hand-rubbed satin urethane finish carries an ebony fingerboard with a 12"-to-16" compound radius, 22 jumbo frets, 4mm pearloid dot inlays, Luminlay side dots, and rolled fingerboard edges. A Graph Tech TUSQ XL nut (1.6875") and 25.5" scale length round out the playing surface.

  Electronics consist of a Seymour Duncan JB TB-4 humbucker at the bridge and a Seymour Duncan '59 SH-1N humbucker at the neck, both direct-mounted, controlled by a Bourns low-friction volume pot, a no-load tone pot, and a 5-position blade pickup selector with coil-split combinations. Hardware includes a Charvel hardtail bridge, Charvel-branded die-cast locking tuners, and a black hardware finish. The instrument ships strung with .009-.042 nickel-plated steel strings and a Charvel Multi-Fit gig bag.
details: |-
  Modernized San Dimas shred machine with hand-shaped heel and recessed neck screws for upper-fret access. Matching painted headstock. Graphite-reinforced caramelized maple neck with rolled fingerboard edges. 5-position blade switch provides bridge, bridge outer coil/neck inner coil, bridge and neck, bridge inner coil/neck outer coil, and neck voicings. Bourns low-friction volume pot and no-load tone pot. Luminlay side dots for low-light visibility.
