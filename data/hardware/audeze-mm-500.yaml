description: Professional open-back planar magnetic studio headphones designed
  for mixing, conceived with Grammy-winning engineer Manny Marroquin for
  accurate mix translation.
details: |-
  Conceived and refined in one of the world's most acclaimed studios, the MM-500 is a purpose-built tool designed to deliver mixes that consistently translate and capture the emotion the artist intended. Lighter than our famous LCD-X, the MM-500's sleek and sturdy chassis offers all-day comfort.

  The MM-500 is designed to suit the requirements of long daily listening sessions under almost any condition. World-class studio monitor? Check. Quick reference on-the-go? No problem. Deep late-night listening? Done. With its ease of drive, comfortable fit and trustworthy sound, you can count on the MM-500 to deliver in every situation.

  Featuring extra-plush premium leather earpads, an adjustable spring steel headband, and a machined aluminum structure, the MM-500 feels substantial yet lightweight. Just like our flagship headphones, the MM-500 is hand-crafted in our Southern California workshop to provide years of reliable comfort.

  The MM-500's planar magnetic drivers provide realism that audio professionals like Manny can't live without. With lightning-fast transients, accurate frequency response and trusted mix translation powered by Audeze's patented innovations, the MM-500 produces unparalleled audio quality that other headphones can only dream of.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-Thin Uniforce
  - Transducer size: 90 mm
  - Maximum SPL: >130dB
  - Frequency response: 5Hz - 50kHz
  - THD: <0.1% @ 100 dB SPL, 1kHz
  - Sensitivity: 100 dB/1mW (at Drum Reference Point)
  - Impedance: 18 ohms
  - Max power handling: 5W RMS
  - Min recommended power: >100mW
  - Recommended power level: >250mW
  - Weight: 495g
  - SKU: 100-MM-1030-01
