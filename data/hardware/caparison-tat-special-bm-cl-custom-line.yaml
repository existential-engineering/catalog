details: |-
  To continue our 30th anniversary celebration, Caparison introduces the TAT-Special-BM-CL, the second limited-edition release in our exclusive series. With just 24 pieces to be madeavailable worldwide, this model offers a refined evolution of the classic TAT-Special. The guitar features a striking Burl Maple Radial Grain top, expertly shaped into the distinctive TAT curve, sitting atop a solid Australian Blackwood back. This combination brings a rich tonal complexity—brilliant highs balanced by warm yet focused low end. The 5-piece maple and walnut neck-through construction guarantees remarkable stability, resonance, and sustain. Equipped with a newly developed PH-R-CA4 bridge pickup and a SH-27FC neck pickup, the TAT-Special-BM-CL offers superb articulation and dynamic tonality across all 27 frets. The Rotary Switch Mode gives smooth, intuitive control over your sound. Stainless steel jumbo frets, an ebony fingerboard with Luminlay side markers, and a carefully considered finish to compliment the natural character of the wood both visually and sonically. Available in Amber Matt and Black Amber Matt finishes, each guitar features a gold Custom Line logo and a solid ebony truss rod cover. The TAT-Special-BM-CL marks thirty years of outstanding craftsmanship — a limited edition that perfectly balances tradition with precision.
