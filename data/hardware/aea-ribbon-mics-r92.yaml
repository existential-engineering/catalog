details: |-
  The R92 is a dual passive ribbon microphone designed to be positioned between 1 and 18 inches from the sound source. It retains a balanced frequency response across the spectrum with limited proximity effect, naturally reducing proximity effect while also avoiding the room tone that can cause problems in smaller spaces or iso booths.

  Naturally rolling off the low-end before it hits the ribbon creates a much different sound than using electronic equalization to roll off the low-end in post. Unlike traditional ribbon mics where the proximity effect can be so strong that it obscures the mid-range, the R92 handles this gracefully, allowing users to think of placement in terms of inches instead of feet.

  With its dual sonic character, the R92 offers limitless creative options. The front side delivers a crisp, brighter sonic signature while the back side is darker and smoother — ideal for taming harsh sounds such as trumpets and strings. The bass reproduction extends to the lowest audible bass frequencies.

  The R92 not only handles the SPL levels of a high-gain amplifier and loud trombone with ease, but also translates all the gritty details of an instrument that musicians seek. It performs brilliantly on brass, guitar amps, kick drum, and percussion.

  The R92's U-shaped yoke acts as a shock mount and enables positioning at various angles even with a straight stand, with an integrated 360-degree swivel mount. Since the R92 is a passive ribbon microphone, preamp gain should be at least +60dB or higher with a very high impedance (above 5K ohm).
specs: |-
  - Dual sonic character: front side brighter, back side darker
  - Near-field ribbon microphone with reduced proximity effect
  - Designed for placement 1–18 inches from the sound source
  - Dual passive ribbon design
  - Recommended preamp gain: +60dB or higher
  - Recommended preamp impedance: above 5K ohm
  - U-shaped yoke with integrated 360-degree swivel mount
  - Weight: approximately 2 lbs
  - Handles high SPL from guitar amplifiers, brass, and percussion
  - Made in the U.S.A.
