description: Erica Synths Black Polivoks System is a Polivoks-inspired 84HP
  two-VCO modular system with 55 patch points that go well beyond classical
  monosynths.
details: |-
  The Black Polivoks System has a full analogue design. Powerful VCOs with suboscillators, versatile modulation sources and the signature Polivoks filter make it a production and live performance tool with a sound that stands out.

  A versatile MIDI to CV module emulates classical monophonic and duophonic synth behaviour and adds a clock output, a configurable modulation output and analogue glide. The Black Modulator V2 is a fully analogue modulation and noise source, built from an LFO and audio frequency oscillator with three simultaneous waveform outputs, a Zener diode based noise generator with three noise flavours and a clockable sample and hold circuit.

  The Black VCO2 is an analogue VCO with four simultaneous waveform outputs and a one octave down suboscillator. Its core is borrowed from the Russian Polivoks VCO, and the exponential converter uses the original matched transistor IC fitted in the Polivoks.

  The Black Polivoks VCF is one of the most authentic sounding emulations of the Polivoks filter. Original Russian K140UD12 ICs sit in the sound circuit, giving a punchy bass sound and very smooth controls.

  The Black Envelope Generator is a compact, fully analogue envelope generator with a gated loop and gate delay for acid basslines and very slow drones. The Black VCA is a hi-fi level VCA with improved attenuation and CV reject levels plus bias control for tremolo effects, and smooth fading between linear and logarithmic response allows versatile percussion sounds while an LED bargraph gives visual feedback on output level.
specs: |-
  - Full analogue design
  - 84HP system width
  - 55 patch points
  - Two VCOs with suboscillators
  - MIDI to CV module with clock output, configurable modulation output and analogue glide
  - Black Modulator V2 with three simultaneous waveform outputs, three noise flavours and clockable sample and hold
  - Black Polivoks VCF with original Russian K140UD12 ICs
  - Black Envelope Generator with gated loop and gate delay
  - Black VCA with bias control and LED bargraph
