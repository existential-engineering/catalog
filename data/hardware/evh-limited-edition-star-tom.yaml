description: The limited edition EVH Star is a modern interpretation of
  (although not quite a re-creation of) one of the guitars that Eddie Van Halen
  used to attain the early Van Halen sound. Experience resonant tone, sustain,
  and crunch thanks to a basswood body and single EVH Wolfgang humbucker. Fire
  off cool stutter effects with the momentary kill switch. Outfitted with a
  comfortable maple neck and fast-playing ebony compound-radius fingerboard,
  blasting our pummeling riffs or lightning licks has never been easier. Beyond
  that, a Tuna-Matic Stoptail bridge yields massive sustain. The EVH Ltd Ed Star
  is teeming with classic Van Halen vibe, but most importantly, it provides
  killer tone and lightning-fast playability. Includes EVH Star gigbag!
