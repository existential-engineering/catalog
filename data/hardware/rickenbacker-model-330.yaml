url: https://www.rickenbacker.com/guitars/model-330/
description: Explore the Model 330 for its rich sound, full-size body, and
  single coil pickups that deliver exceptional performance.
details:
  - Careful acoustic research has resulted in the full, rich and warm sound of
    this popular model. Two single coil pickups on a full size body are accented
    by a traditionally shaped sound hole.
  - The 21 fret Rosewood fingerboard is punctuated by dot inlay fret markers,
    with full double cutaways permitting access to all the frets.
  - Standard output is monaural through a single jack plate.
specs: |-
  - Body Type: Semi-Acoustic
  - Number of Frets: 21
  - Scale Length: 62.9 cm (24 3/4")
  - Neck Width at Nut: 41.4 mm (1.63")
  - Neck Width at 12th Fret: 49.05 mm (1.931")
  - Crown Radius: 25.4 cm (10")
  - Body Wood: Maple
  - Neck Wood: Maple & Walnut
  - Fingerboard Wood: Rosewood
  - Weight: 3.6 kg (8.0 lbs.)
  - Overall Length: 100.3 cm (39 1/2")
  - Overall Width: 38.1 cm (15")
  - Overall Depth: 38.1 mm (1 1/2")
  - Fret Markers: Dot style
  - Tailpiece: 'R'
  - Bridge: 6 Saddle
  - Neck Type: Set-in
  - Machine Heads: Gotoh
  - Pickups: Two Hi-gain single coil
  - Output: Monaural through single jack plate
