details: |-
  Gretsch Rancher acoustics are back and better than ever! The G5034TFT Rancher dreadnought is one of the most distinctive Rancher models ever, with a sweet iso-chamber mounted Fideli'Tron pickup for great amplified tone and performance and a Bigsby B70G tailpiece with a "wire" trem arm.

  Other premium features include a laminated spruce top, arched laminated mahogany back, laminated mahogany sides, classic Rancher bound triangular sound hole, mahogany neck, 16-fret laurel fingerboard with Neo-Classic thumbnail inlays, volume control, rocking bar bridge with laurel base, deluxe tuners and gold-plated hardware.
