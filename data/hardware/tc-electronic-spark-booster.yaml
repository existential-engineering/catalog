details: |-
  Kick your playing into high gear with SPARK BOOSTER, the stealthy stompbox that rocks a completely clean boost with heaps of extra features for your tone palette.    •    A whopping 26 dB of boost    •    Gain knob for added grit and dirt    •    Active EQ and toggle switch for precise tonal shaping

  With a full 26 dB of boost, SPARK BOOSTER delivers the juice you need for highlighting solos and nailing that killer lick or riff.

  The Gain knob allows you to add just a hair (or heaps) of dirt to your tone vastly expanding your tonal palette. The active 2-band EQ functions as a powerful set of tone shaping tools allows you to sculpt your tone with unprecedented precision.

  The active 2-band EQ functions as a powerful set of tone-shaping tools, allowing you to sculpt your tone with unprecedented precision. The mid-shift toggle allows SPARK BOOSTER to focus and amplify all those juicy mid-heavy frequencies that make your guitar sound great, allowing you to cut through any mix.
