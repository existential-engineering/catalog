description: An accessibly priced San Dimas Style 2 electric guitar from the
  all-new Charvel Standard Series, delivering high-performance shred playability
  with a nyatoh body and neck, compound-radius amaranth fingerboard, dual
  Charvel Custom humbuckers, and a string-through-body hardtail bridge.
details: |-
  The Standard Series Style 2 SD2 HH HT pairs a nyatoh San Dimas Style 2 body in a gloss finish with a bolt-on nyatoh neck featuring graphite reinforcement, an oiled finish, and a Speed Neck profile with rolled fingerboard edges (no binding).

  An amaranth fingerboard with a 12" to 16" compound radius hosts 22 jumbo frets and offset white dot inlays, all anchored by a 1.6875" (42.86 mm) black plastic nut and a 25.1" (638 mm) scale length. A truss rod adjustment wheel at the fingerboard end allows truss rod tweaks without removing the neck.

  Electronics are an HH configuration with Charvel Custom Humbucking pickups at both the bridge and neck, routed through a single volume control and a 3-position toggle switch.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge with ferrules for maximum sustain, Charvel-branded die-cast locking tuning machines, and a black hardware finish. A licensed Fender Telecaster headstock completes the package.
