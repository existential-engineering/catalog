description: >-
  The E-mu Planet Earth is a 64-voice rack-mount sound module dedicated to world
  instruments and ethnic percussion, featuring a 32MB ROM soundset of authentic global
  timbres with E-mu's SuperBEATs groove performance mode.
details: |-
  The Planet Earth picks up where E-mu's popular Carnaval module left off, doubling the polyphony to 64 voices and introducing an all-new 32MB "World" soundset packed with authentic rhythms and traditional instruments from around the globe. It targets producers and performers who need convincing world music textures without investing in extensive sample libraries.

  Built on the same Proteus 2000 platform as E-mu's other rack modules, the Planet Earth features E-mu's SuperBEATs performance mode for generating and interacting with rhythmic grooves in real time. Up to 16 syncable arpeggiators provide further melodic and percussive variation, while 12 real-time controllers allow hands-on sound manipulation during performance.

  The sound engine employs digital 12-pole resonant filters for dramatic timbral shaping, processed through a 24-bit dual stereo effects section. Sounds can be extensively tweaked and warped using the advanced synthesis architecture, transforming acoustic world instruments into hybrid textures that blend the organic and the electronic.

  The unit ships with one 32MB soundset and can be expanded up to 128MB via three additional expansion slots, accepting cards from E-mu's extensive library including Siedlaczek Orchestra, World Expedition, Orchestral Sessions, and many others. Memory provides 512 preset and 512 user patch locations across its MIDI-controllable architecture.
specs: |-
  - Polyphony: 64 voices
  - Sound ROM: 32MB "World" soundset (expandable to 128MB via 3 slots)
  - Filter: Dynamic 12-pole resonant filtering
  - Effects: 24-bit dual stereo effects processor
  - Arpeggiator: Up to 16 syncable arpeggiators with SuperBEATs mode
  - Keyboard: None
  - Memory: 512 preset, 512 user
  - Control: MIDI (12 real-time control parameters)
releaseDate: "2000"
releaseDateYearOnly: true
