description: The Empress Reverb is a stereo reverb pedal with a large library of
  reverb algorithms spanning hall, plate, spring, room, modulated, ambient
  swell, delay, reverse, ghost and lo-fi voices. It keeps an analog dry path,
  offers presets, and adds deep control through a Universal Control Port.
details: |-
  The Empress Reverb is a stereo pedal built around a broad library of reverb algorithms (32 as of firmware 6.0), grouped into hall, plate, spring, room, sparkle, modulation, ambient swell, delay-and-reverb, reverse, ghost, lo-fi and beer categories. It ranges from natural concert-hall and studio-plate sounds through spring and modulated voices to swells, reverse, ghost pads and glitchy lo-fi textures.

  An analog dry path with VCA-based wet/dry blending keeps the core tone intact, and an output transformer supports hum-free stereo operation. Up to 35 presets can be saved and recalled in bank or scrolling modes, and three cabinet-simulator variations are available. It runs true bypass or buffered bypass with trails.

  Stereo inputs and outputs, an SD card slot for firmware updates and a Universal Control Port (expression pedal, external tap switch, control voltage, external audio input and MIDI over one 1/4" jack) round out the connectivity.
specs: |-
  - 32 reverb algorithms (firmware 6.0) across hall, plate, spring, room, sparkle, modulation, ambient swell, delay+reverb, reverse, ghost, lo-fi and beer categories
  - Stereo ins and outs with output transformer for hum-free stereo
  - Up to 35 presets (bank or scrolling modes)
  - 3 cabinet simulator variations
  - Analog dry path with VCA wet/dry blending
  - True bypass or buffered bypass with trails
  - Universal Control Port: expression, external tap, CV, external audio, MIDI over one 1/4" jack
  - SD card slot for firmware updates
  - Input impedance 1 MOhm, output impedance 100 Ohm (600 Ohm transformer)
  - Frequency response: dry 10Hz-50kHz, wet 10Hz-23.4kHz (-3dB)
  - 48kHz, 24-bit conversion with 32-bit internal processing
  - Power: 9V DC, 2.1mm barrel, 300 mA
  - Approx. 5.7" x 3.75" x 1.75", 1.5 lb
