details: |-
  The NOTADÜMBLË is a DIY pedal kit from JHS Pedals that puts a half-million dollars of tone at your feet. With the flip of a slider switch, you can go between two highly sought after sounds that are as magical and rare as it gets. In the Drive setting–slider up–you get the dirty and distorted violin-like sounds you know from guitarists like Santana, Joe Bonamassa, and Eric Johnson. In the Clean position–slider down–you get a powerful preamp buffer pulled directly from John Mayer's rare and never before replicated device, the Dumble BBC-1.

  With easy to understand instructions – no soldering required – this kit is for anyone who wants a particularly fabled amp-overdrive and the experience of easily building their own pedal. Go ahead - save yourself a few hundred thousand dollars and experience the magic for yourself!

  CONTROLS

  Channel Switch - Selects the active channel. Up is the Drive channel, and down is the Clean channel.

  CLEAN CHANNEL (Boost)
  Input - Attenuates bass and input gain at the front of the circuit. Fully right has no cut. As you turn the control left, bass and gain are gradually attenuated.
  Output - Output volume of the Clean channel. Left is less, right is more.

  OVERDRIVE CHANNEL
  Drive - Controls the amount of overdrive. Left is less, right is more.
  EQ - Adjustable low pass filter. Fully right is no cut, as you turn the control left it lowers the treble cut off frequency.
  Volume - Controls the overall volume of the overdrive channel. Left is less, right is more.
  Presence (internal trimpot) - Controls the upper-mid range and treble frequencies in the gain stage. Left is less, right is more.
  Footswitch - True bypass switching.

  JACKS
  Input - ¼" jack on the right side of the pedal.
  Output - ¼" jack on the left side of the pedal.
