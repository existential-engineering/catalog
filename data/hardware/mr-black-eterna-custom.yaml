description: A lush, fully-featured shimmer reverb, offered here as a limited
  "Stained-Glass" custom-graphic edition of the standard Eterna. Same classic
  circuit, custom finish.
details: |-
  The Eterna is a lush, expansive reverb that Mr. Black describes as breathtaking, beautiful and inspirational, layering shimmering radiance over long, evolving decays. It is well suited to ambient washes and atmospheric textures, painting a signal across a wide, cinematic space.

  This Custom edition is a limited "Stained-Glass" run featuring the classic Eterna circuit paired with a custom graphic finish. As the manufacturer states, it is the classic circuit with a stunning custom graphic, so it is a cosmetic variant rather than a distinct effect.

  Because the finish is made to order, the listing asks buyers to allow up to a two-day build time when the custom finish is available.

  The Eterna is proudly made in the U.S.A. and ships as a standard stompbox with a single input and output.
specs: |-
  - Lush, fully-capable reverb (shimmer voicing)
  - Classic Eterna circuit with custom "Stained-Glass" graphic
  - Up to two-day build time for the custom finish
  - Proudly made in the U.S.A.
