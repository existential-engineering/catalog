description: An electro-mechanical synth voice in pedal form, built around a
  brushed DC motor whose spin tracks the pitch of the incoming signal in real
  time, usable as a drone that doubles a played line or as a ring-mod and
  cross-mod engine for the signal itself.
details: |-
  The MOTOR Pedal is a fully playable electro-mechanical synth voice that tracks the pitch of the player's input in real time. It can be used as a drone element that doubles a played line, or as a ring-mod or cross-mod engine for the signal. This is not an emulation and not analog modeling: it is the sound of a spinning brushed DC motor, pushed to the edge and tamed with precision control.

  The DC motor inside the pedal is user replaceable, and the pedal is designed around replaceable motors. The lifespan of a brushed DC motor runs to around 8000 hours of continuous use, depending on the pitch it is held at.
specs: |-
  - Channels: mono
  - Inputs: IN, TRACK IN, MIDI IN, USB-C
  - Outputs: OUT, TRACK OUT
  - Power requirement 9V center negative at least 500 mA. The power supply is not included
  - Weight: 1.07 kg / 2.4 lbs
  - Length 18 cm / 7.1 in
  - Width: 10 cm / 4 in
  - Height 8 cm / 3.2 in including knobs
  - Motor system: brushed DC motor spinning at 3 Hz per one rotation
  - Motor lifespan of 1500 to 3000 h at D6 pitch continuous (1125 Hz or 22500 rpm)
  - Motor lifespan of 3800 to 8000 h at A4 pitch continuous (440 Hz or 8800 rpm)
  - The DC motor is a replaceable part
