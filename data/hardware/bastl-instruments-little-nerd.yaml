url: https://bastl-instruments.com/eurorack/modules/little-nerd
description: Little Nerd is a discontinued compact 6HP clock, trigger, and gate
  processor for Eurorack with two inputs and five programmable outputs. Seven
  selectable modes include Delayed Divider, Trigger to Gate/Flop Divider,
  Multiplier, Trigger Repeater, Euclidean Sequencer, Clock Oscillator, and
  Probability/Groove. Arduino-compatible via FTDI connector for custom firmware.
details: |-
  6HP width, 50mm depth. Power: +5V 30mA (from Eurorack bus board).
  Arduino-compatible firmware via FTDI.
