description: The EXO 25 is an active 2-way nearfield studio monitor from EVE
  Audio built around a 5" coated aluminium woofer, the Precision AirMotion
  Tweeter and the GDC waveguide. It covers 44 Hz to 24 kHz at 110 dB maximum SPL
  in full space, with Ethernet access to the EVE Origin control software and a
  rear OLED display with a SMART Control Knob.
details: |-
  The EXO 25 is the nearfield monitor of the EXO Series for those who want to combine precision with tangible depth. EVE Audio aims it at professional studios and producers who value sonic accuracy together with high performance, and its controlled dispersion characteristics also suit immersive formats such as Dolby Atmos. Four M6 threaded mounting points on the underside of the enclosure simplify mounting.

  The EXO Precision AirMotion Tweeter, combined with the GDC Waveguide (Guided Directivity Control), provides wider and more consistent dispersion and a larger sweet spot, which improves stereo imaging and spatial integration in setups like Dolby Atmos. Made from ultra-lightweight polyamide, the AMT gives a fast transient response, high efficiency and precise high-frequency reproduction with minimal distortion.

  The 5" woofer with a CAL diaphragm (Coated Aluminium) provides accurate reproduction with noticeable depth and high transparency, even with complex audio material. Its lightweight aluminium cone, a resonance-dampened dust cap and a redesigned magnet system keep playback precise and dynamic with minimal distortion.

  The system is housed in an airflow-optimized LDE enclosure (Low Diffraction Enclosure). The curved design with smooth, rounded edges minimizes sound diffraction, and enhanced rear-facing bass reflex ports with improved aerodynamics enable deeper low-frequency extension while reducing port noise.

  A rear-mounted OLED display with an integrated SMART Control Knob displays the key system parameters and gives precise control over output level, room adaptation filters and input source selection. The Ethernet connection opens access to the EVE Origin control software, calibration and firmware updates, and Wake-on-Signal and Wake-on-LAN bring the monitor out of standby. The illuminated eve audio logo on the front panel is a multi-color status indicator for overload protection, firmware update progress and other system states, glowing warm white in normal operation, with brightness adjustable to taste.
specs: |-
  - Frequency range (-3 dB at 1 m, full space): 44 Hz - 24 kHz
  - Woofer diameter: 5"
  - Max. SPL (full space, above 100 Hz): 110 dB
  - Max. SPL (half space, above 100 Hz): 116 dB
  - Cross-over frequency: 2200 Hz
  - Output power per speaker: 280 W
  - Tweeter: Precision AirMotion Tweeter (PAMT)
  - Waveguide technology: Guided Directivity Control (GDC)
  - Tweeter output power: 140 W / 1%
  - Woofer output power: 140 W / 1%
  - Woofer diaphragm material: Coated aluminum
  - Woofer voice coil: Air Stream Optimized Voice Coil Design
  - Dimensions: 195 x 284 x 230 mm (7.6 x 11.2 x 9.1 inch)
  - Weight: 5.35 kg (11.8 lb)
  - Protection limiter: Yes
  - User interface: Rear OLED display with SMART Control Knob
  - Volume: minus infinity to +10 dB
  - High-shelf filter (-5 dB to +3 dB): above 3 kHz
  - Mid EQ (-3 dB to +3 dB): 3.2 kHz
  - Desk filter cut (-5 dB to 0 dB): 550 Hz
  - Low-shelf filter (-5 dB to +3 dB): below 300 Hz
  - Max. input level: -10 dBV (max. 16.5 dBu) / +4 dBu (max. 20 dBu)
  - Input select: Balanced, Unbalanced, S/PDIF L/R/Mono
  - Standby mode: 15 min / 30 min / 60 min / off
  - Mounting point: Bottom side M6 mounting hole pattern of 50.8 x 107.9 mm
  - Standby power consumption: below 1 W
  - Idle power consumption: 7 W
  - Peak power consumption: 400 W
