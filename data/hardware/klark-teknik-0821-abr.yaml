description: The DN3030 is a dual-channel, third-octave graphic equaliser
  delivering 30 ISO-spaced bands per channel across the full audio spectrum. It
  is built for engineers who need the highest practical resolution from a
  graphic topology.
details: |-
  Each channel offers a full 30-band fader array tuned to the ISO third-octave centres, the same frequency grid used by real-time analysers and room-correction software. The bands' preset Q is set to the value Klark Teknik's engineers determined produced the most musical response when faders are combined.

  Class-leading signal-to-noise, true-bypass relay switching and a conservatively rated linear power supply let the DN3030 hold its composure under sustained professional load. Two channels in a single 1U enclosure means main-plus-fill or stereo programme EQ without sacrificing rack space.

  Designed and engineered in Kidderminster, the DN3030 carries the DN-series reputation for transparency, predictability and long-term reliability.
specs: |-
  - Dual-channel graphic equaliser
  - 30 bands per channel at ISO one third-octave centres
  - Preset Q per band
  - True-bypass relay switching
  - Linear power supply
  - 1U enclosure
