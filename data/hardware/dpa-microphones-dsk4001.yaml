description: The DSK4001 Studio Microphone Kit is perfect for a home studio or
  small recording studio. Or for boosting a larger recording studio with the
  most prestigious, high-quality professional condenser mics available.
details: |-
  This medium-sized mic kit contains a few fantastic DPA microphones for recording. Included are mics for vocals, close miking instruments as well as pencil mics for spot miking instrument groups. There's enough inside to convince you that you will need even more. The DPA Studio Microphone Kit has a wide variety of helpful clips and holders. It has everything you need to begin your studio journey. It is perfect for recording bands, recording vocals or anything else. Open the carry case and you'll see all of the studio mics you need to get started in one convenient package.

  This kit is no longer available to order. We are currently updating it and a new version will be available to order in Q3 2026.

  What's in the box

  The DSK4001 Studio Microphone Kit contains the following mics and accessories.

  Microphones
  1 x 4099-DC-1 Instrument Microphone (Loud SPL)
  3 x 4099-DC-2 Instrument Microphone (Extreme SPL)
  1 x d:facto 4018VL Linear Vocal Supercardioid Microphone
  1 x 4055 Kick Drum Microphone
  1 x 2012 Compact Cardioid Microphone
  2 x 4011A Cardioid Microphone (matched within ±1 dB on both frequency response and sensitivity)

  Accessories
  1 x DUA0415 Mic Clip
  4 x DAD6001-BC Adapter for MicroDot to 3-pin XLR with Belt Clip
  2 x UA0639 Clip for Pencil Microphone
  4 x DC4099 Clip for Drum
  2 x PC4099 Clip for Piano
  1 x CC4099 Clip for Cello
  1 x GC4099 Clip for Guitar
  1 x MS4099 Mic Stand Mount
  1 x UC4099 Clip for Universal Use
  4 x CM2218B00 MicroDot Extension Cable, 2.2 mm
  1 x DUA0020 Foam Windscreen for Pencil Microphone, Ø19 mm, Length 56 mm (2.2 in)
  2 x UA0896 Foam Windscreen for Pencil Microphone, Ø19, Length 92 mm (3.6 in)
