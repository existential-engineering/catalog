description: >-
  The Ensoniq VFX is a 21-voice digital synthesizer offering PPG-style wavetable
  synthesis with 109 waveforms, dual multi-mode filters, and a 24-bit effects
  processor. The VFX-SD variant added a professional 24-track sequencer for full
  workstation capability.
details: |-
  Following the ESQ-1 and SQ-80, the VFX brought increased polyphony and a larger waveform set to Ensoniq's synthesizer lineup. Its wavetable approach allowed PPG-like synthesis, with each voice combining up to six of the 109 available waveforms spanning multi-sampled acoustic instruments, sustained waveforms, and harmonic structures.

  The sound shaping architecture featured dual multi-mode digital filters offering highpass and lowpass at 12 or 24 dB per octave plus a 12 dB bandpass mode. Three 11-stage envelopes and an LFO per voice provided extensive modulation, with 15 modulation sources available for dynamic sound control. While the filters lacked the analog warmth of the SQ-80, they excelled at strings and textural sounds.

  The built-in 24-bit dual VLSI effects processor handled reverb, chorus, flanging, and delay. The 61-key keyboard supported velocity and polyphonic aftertouch, with 12-channel multitimbral operation via MIDI.

  The VFX-SD variant added a substantial 24-track sequencer with 25,000-note capacity expandable to 75,000, supporting 60 sequences and songs at 96 PPQN resolution, plus a 3.5-inch disk drive for storage. Notable users include Front 242, Rick Wakeman, Nick Rhodes, Tony Banks, and Oscar Peterson.
specs: |-
  - Polyphony: 21 voices
  - Oscillators: 1 to 6 per voice, 109 waveforms (multi-sampled acoustic, sustained, harmonic)
  - LFO: 1 per voice
  - Filter: Dual multi-mode digital (HP/LP at 12 or 24 dB/oct, BP at 12 dB/oct)
  - Envelopes: 3 x 11-stage per voice
  - Modulation sources: 15
  - Effects: 24-bit dual VLSI (reverb, chorus, flanging, delay)
  - Sequencer (VFX-SD): 24-track, 25,000 notes (expandable to 75,000), 60 songs, 96 PPQN
  - Keyboard: 61 keys with velocity and polyphonic aftertouch
  - Memory: VFX: 120 patches, 12 performances; VFX-SD: 200+ patches with disk storage
  - Control: MIDI In/Out/Thru (12-channel multitimbral)
releaseDate: "1989"
