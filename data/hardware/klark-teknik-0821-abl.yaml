description: The DN320 is a dual-channel, 16-band preset equaliser built to
  deliver precise tonal correction across two independent paths in a single 1U
  chassis. Part of the DN-series lineage, it carries forward the
  studio-engineering approach behind Klark Teknik's professional graphic
  equalisation.
details: |-
  Each channel offers 16 fixed-frequency bands tuned to musically critical points in the audible spectrum, allowing the engineer to address room nodes, feedback frequencies and tonal imbalances without disturbing adjacent regions. The preset bandwidth on each filter is the result of decades of refinement, wide enough to feel musical and narrow enough to surgically correct.

  Hand-assembled to broadcast-grade tolerances, the DN320 is housed in a road-ready 1U enclosure with conservatively rated power and headroom specifications that hold their composure under sustained professional use.

  Although now an obsolete model in the active lineup, the DN320 remains a benchmark for what a preset graphic equaliser should sound like, clean, transparent and uncoloured until the engineer decides otherwise.

  Engineered in Kidderminster, the DN320 was used in demanding live and broadcast venues and represents the Klark Teknik approach of engineering instruments rather than effects.
specs: |-
  - Dual-channel preset equaliser
  - 16 fixed-frequency bands per channel
  - Preset filter bandwidth
  - 1U rack-mount chassis
