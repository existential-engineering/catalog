description: Prepared for Performance You don't want to go in blind, but you
  also don't just want to hit play. Use track mutes, per-track probability,
  delay, clock divisions and sequence length to add even more variations to your
  track.
details: |-
  Steppy is a 4-track programmable gate sequencer with eight internal memory slots, external clocking, numerous tweakable parameters, and a performance-first design aesthetic.

  Each track has its own length (1 to 64 steps), gate length, clock divider, swing setting, delay setting, and probability control, plus the ability to be rotated forward or backward by a number of steps.

  Tracks can be programmed by entering active steps on the grid or tapped in live as the sequence is moving, and can be selected and modified in real time as the sequence plays.

  Tracks can be individually muted and unmuted, and a special performance mode (called “Loopy”) enables you to touch any two gate steps and instantly create a performance that loops between those steps.

  Track patterns can be cleared without clearing playback parameters, and all track patterns (along with their individual playback and performance parameters) can be saved as a preset to one of eight internal memory slots.
