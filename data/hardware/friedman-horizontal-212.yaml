details: |-
  The Friedman 2x12 is a rear-ported, closed-back cabinet built from tongue and groove Baltic birch to deliver the bass, mid response and sound expected of a Friedman cab, in a horizontal format.

  At the heart of the cab are two Celestion Vintage 30 speakers. The V30's sound has been captured on thousands of recordings from a diverse range of notable players, and it features enormously detailed and complex overtones, a warm low end, a famously rich vocal mid-range and a beautifully detailed top end. This cab delivers a wonderfully intricate Vintage 30 crunch, revealing the complexities found in hand-wired boutique amps.

  The power and thump of the V30s create a formidable speaker cabinet that is a match for any Friedman amplifier.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, so every ounce of valuable tone is captured. The Friedman 2x12 is handcrafted in the U.S.A. and designed to withstand the rigors of the road, and it can be ordered with the grill color and faceplate of your choice.
specs: |-
  - 2 x Celestion 12 in Vintage 30 speakers
  - Nominal impedance: 8 ohms
  - Closed-back, rear-ported cab design
  - Tongue and groove Baltic birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Grill color and faceplate ordered to choice: Black, Silver Weave, Vintage
  - Hand-crafted in the USA
  - Limited lifetime warranty
  - Dimensions: 12 in (D) x 30 in (W) x 20.75 in (H)
  - Weight: 58 lbs
