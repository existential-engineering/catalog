url: https://www.mrblackpedals.com/products/sludgemaster
description: A heavy, thick analog fuzz inspired by the classic late-1970s IC
  distortion-sustainer, expanded for more ferocity and less noise, equally at
  home on guitar and bass.
details: |-
  The SludgeMaster is a classic analog fuzz voiced after the celebrated
  late-1970s IC (integrated-circuit) distortion-sustainer, a circuit with deep
  recording history and a reputation for sheer power. Mr. Black describes the
  sound simply: heavy, thick, electric.

  Rather than clone the original, Mr. Black expanded its ferocity, reduced the
  noise, and sweetened the voicing. It fattens single-coils, drives humbuckers
  into wall-of-sound territory, turns leads into what the maker calls flaming
  flutes, and rhythm parts into a tsunami of saturated intensity. It also rips
  on bass.

  The build is high quality throughout, from tuned high-grade passives and
  robust mechanicals to deliberate circuit-board layout, and the enclosure is a
  powder-coated genuine Hammond box with glow-in-the-dark indicators and an
  EZ-2-C LED.

  It runs on an internal 9V battery or standard 2.1mm negative center-pin 9VDC
  pedal power and sips just under 9mA. Mr. Black recommends playing it as loud
  as your rig allows.
specs: |-
  - Classic 100% analog, high-gain fuzz (IC distortion-sustainer voicing)
  - Expanded ferocity with reduced noise vs. the original
  - Great on guitar and bass
  - Premium passives and robust mechanical components
  - Powder-coated genuine Hammond enclosure
  - Glow-in-the-dark indicators, EZ-2-C LED indicator
  - Input Impedance: ~51KΩ
  - Output Impedance: <25KΩ
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (not included)
  - <9mA current draw
