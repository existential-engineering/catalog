description: 5000 Series pedals are now fitted with more features and upgrades than ever before.
details: |-
  An industry standard gets even better. The 5000 Series Bass Drum Pedals established DW's reputation for innovation and quality. But because innovation is part of our DNA at Drum Workshop, we thought it was time to engineer some major improvements into our most successful pedals.

  Most notably, we have upgraded the toe clamp. We wanted our 5000 Series pedals to have more gripping strength, to provide a stronger connection between drummer and kick drum. So, we developed the Tri-Pivot Toe Clamp. The Tri-Pivot features three independent, 360-degree, rotating rubber pads that firmly grab almost any diameter and thickness of bass drum hoop, from the top and the bottom, with zero slippage, combined with a new, textured, rubber pad on the base plate.

  To improve on the top-flight smoothness and feel of the 5000 Series pedals, we added a Dual Bearing Spring Rocker, making the 5000 quicker and more responsive than ever. Finally, we added the dual-chain Accelerator drive system, with an eccentric motion that creates an indirect relationship between the sprocket and the footboard, shortening the length of the stroke, and increasing velocity and sensitivity.

  Featuring a host of refinements and upgrades, the legendary 5000 Series Bass Drum Pedals still feature aluminum hex shafts, pedal plates and linkages, DW's patented Delta Ball-Bearing Hinge, and the versatile Two-Way Beater.
specs: |-
  - Dual-Chain Accelerator Drive System
  - Tri-Pivot Toe Clamp (U.S. Patent No. 8330032)
  - Delta Ball-Bearing Hinge (U.S. Patent No. 5431081)
  - Dual-Bearing Spring Rocker
  - Aluminum hex shafts, pedal plates and linkages
  - Two-Way Beater
  - Drive system options: Dual-Chain Accelerator Drive, Dual-Chain Turbo Drive, Single-Chain Accelerator Drive
  - Regular footboard
