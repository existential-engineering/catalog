description: TubeMeister Deluxe 40 makes your job as a guitar player better
  sounding, easier, and a whole load more fun.
details: |-
  With its three channels, this 40-watt all-tube head covers everything from crystal-clear cleans through to dynamic crunch and powerful high-gain sounds. In addition to a power soak to reduce the power amp's output to as little as one watt, the Tubemeister Deluxe 40 also features the legendary Red Box AE speaker simulation, which makes this amp ideal for recording in the studio. The obligatory switchable effects loop is of course also included, as are footswitch connections to allow the player to change between the two channels and switch the effects loop on and off.

  Whether you Rock on Stage, Play at Home or Record at Night, TubeMeister Deluxe 40 is the ideal amp. The real power soak lets you switch between the full 40 Watts of power, 20 Watts, 5 Watts, 1 Watt, or even 0 Watts for truly silent recording at any time of day or night.

  TubeMeister Deluxe 40 is also the first tube amp ever to offer you a genuine FRFR (full range flat response) amp sound experience. The groundbreaking Red Box AE (Ambience Emulation) DI output lets you connect your guitar direct to your recording setup or the PA, so it's perfect for stage and studio work, and it delivers a perfect mix of authentic 4x12 cabinet ambience effects and an ultra-direct attack of pure tube tone.
specs: |-
  - Channels: Clean, Crunch, Lead
  - Power: 40 Watts
  - FX-Loop: Serial, switchable
  - Pre Amp: 3 x 12AX7
  - Power Amp: 4 x EL84
  - TSC: Tube Safety Control
  - Power Soak: 20, 5, 1, 0 Watts
  - Dimensions: 455 x 170 x 150 mm, Weight 7.7 kg
  - Protective Cover: Softbag included
  - Speaker Out: 1 x 8-16 Ohm
  - Red Box: RED BOX AE (Ambience Emulation) XLRm OUT
  - Footswitch: FS-2 (optional), FSM 432 MK IV (optional)
  - Midi: In
