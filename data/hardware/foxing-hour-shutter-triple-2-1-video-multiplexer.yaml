description: SHUTTER is a Eurorack video-rate multiplexer with three
  independently controllable multiplexers that switch between two full color RGB
  signals using control voltages.
details: |-
  SHUTTER is a video rate multiplexer featuring three independently controllable multiplexers. This allows users to switch between two full color RGB signals together with one control voltage or separately with up to three control voltages at video rates. Ch. A and Ch. B inputs are each normalled downward R>G>B. Switch inputs are also normalled downward. The Threshold VC input may be attenuated via the pot.
