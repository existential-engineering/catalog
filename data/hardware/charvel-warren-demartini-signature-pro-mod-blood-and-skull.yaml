details: |-
  Designed to keep up with Warren DeMartini's furious lead style, the signature Pro-Mod Blood and Skull is a fierce and versatile artist-series axe. Its alder San Dimas body is decorated with a customized white skull atop a black finish with splattered blood, and paired with a bolt-on quartersawn rock maple neck for rock-solid stability.

  Built for high-speed playing, the 12"-16" compound radius maple fingerboard features 22 jumbo frets and black dot inlays. Tone comes from a Seymour Duncan Custom Warren DeMartini RTM ("Rattus Tonus Maximus") humbucking bridge pickup wired to a single volume control. A Floyd Rose 1000 Series double-locking tremolo, Charvel-branded tuning machines, and chrome hardware round out the appointments.
