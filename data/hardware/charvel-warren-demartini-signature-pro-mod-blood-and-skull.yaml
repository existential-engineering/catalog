description: Designed to keep up with Warren DeMartini's furious lead style, the
  signature Pro-Mod Blood and Skull is a fierce and versatile axe. Outfitted
  with a customized white skull atop a black finish with splattered blood, the
  alder San Dimas body is paired with a bolt-on quartersawn rock maple neck.
  Built for comfortable and high-speed playing, the 12"-16" compound radius
  maple fingerboard has 22 jumbo frets and black dot inlays. Full-throttle tone
  comes from a Seymour Duncan Custom Warren DeMartini RTM ("Rattus Tonus
  Maximus") humbucking bridge pickup. A single volume control, Floyd Rose 1000
  Series double-locking bridge tremolo system, Charvel-branded tuning machines
  and chrome hardware complete the package.
