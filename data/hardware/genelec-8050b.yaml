description: "Nearfield monitoring with real muscle. The 8050B has power in
  abundance, making it ideally suited to larger spaces and longer listening
  distances."
details: |-
  The 8050B is a large two-way active nearfield monitor designed for studios that need real SPL headroom without sacrificing the detail and transparency expected from a reference loudspeaker. A 205 mm bass driver paired with a 25 mm metal dome tweeter delivers a frequency response of 38 Hz – 20 kHz (±2 dB) and short-term peak output of ≥120 dB SPL, making it well suited to control rooms, larger production spaces, and longer listening distances where smaller monitors would run out of steam.

  Genelec's Directivity Control Waveguide (DCW™) is integrated into the curved Minimum Diffraction Enclosure (MDE™) cast in die-cast aluminium, giving the 8050B a wide, stable sweet spot and uniform off-axis response. The result is a monitor that translates predictably across listening positions and rooms, with low coloration from cabinet diffraction or edge effects.

  Two onboard Class AB amplifiers — 150 W for the bass section and 120 W for the treble — drive the active crossover at 1.8 kHz, with optimised amplifier topologies and comprehensive protection circuitry to keep the system clean at high output levels. Rear-panel room compensation switches (bass tilt, treble tilt, bass roll-off and desktop notch) let engineers adapt the monitor to the room and mounting position without external processing.

  The 8050B ships with Genelec's Iso-Pod™ stand for acoustic decoupling and precise tilt adjustment, and is compatible with the full range of Genelec wall, ceiling, truss and floor mounting hardware. Intelligent Signal Sensing (ISS™) drops power consumption below 0.5 W when the monitor is left idle, automatically waking when signal is detected.

  Electrical input is via a single balanced XLR (10 kΩ) and the monitor accepts 100, 120, 220 or 230 VAC mains at 50/60 Hz. Standard finishes include Dark Grey (Producer Finish), white (8050BWM) and black, and the package includes the IsoPod kit, mains cable and operating manual.
specs: |-
  - Frequency response: 38 Hz – 20 kHz (±2 dB)
  - Low cutoff -6 dB: 32 Hz
  - High cutoff -6 dB: 25 kHz
  - Peak SPL: ≥120 dB
  - Short term max SPL: ≥110 dB
  - Long term max SPL: ≥101 dB
  - Self-generated noise: ≤10 dB SPL
  - Harmonic distortion 50–100 Hz: ≤2%
  - Harmonic distortion >100 Hz: ≤0.5%
  - Crossover frequency: 1.8 kHz
  - Bass driver: 205 mm cone (magnetically shielded)
  - Treble driver: 25 mm metal dome (magnetically shielded)
  - Bass amplifier: 150 W Class AB
  - Treble amplifier: 120 W Class AB
  - Enclosure: Die-cast aluminium, reflex port
  - Signal input: 1 x XLR (female, balanced, 10 kOhm)
  - Mains: 100, 120, 220, 230 VAC, 50/60 Hz
  - Power consumption (idle): ≤10 W
  - Power consumption (full output): 170 W
  - Power consumption (ISS active): ≤0.5 W
  - Height: 433 mm (452 mm with Iso-Pod)
  - Width: 286 mm
  - Depth: 278 mm
  - Weight: 14.4 kg (31.7 lb)
