details: |-
  Sonically captivating and versatility defined, the Ludwig Classic Maple has been a flagship professional drum series for over 20 years. Each kit is hand-crafted at Ludwig USA in Monroe, North Carolina, drawing on more than a century of American drum-building heritage.

  The shells are characterized by their full tonality, rich sustain, and exceptional versatility, making the series equally at home in the studio and on stage. A choice of standard outfits and a deep configurator program let players spec out a kit tailored to their setup and style.

  Construction centers on a 7-ply, 6mm maple shell with a center three-ply core panel (2.4mm) arranged in a horizontal/vertical/horizontal grain bond for stability and projection. Shells are formed using Ludwig's Radio Frequency Shell Technology (RFST) molding, and bearing edges are cut at 45 degrees within 1/16" precision.

  Bass drums are offered in 18", 20", 22", 24", and 26" diameters with multiple depth options; toms span 6"-16" diameters, floor toms 14"-18", and matching snares 12"-14". The series ships with more than 30 finish options ranging from classic sparkles and oyster pearls to natural stains, satins, bursts, and specialty colors like Heritage Blue, Heritage Green, Mod Orange, Citrus Mod, and African Bubinga.
specs: |-
  - 7-ply, 6mm maple shells with three-ply (2.4mm) center core panel
  - Horizontal / vertical / horizontal grain bond for stability and projection
  - Radio Frequency Shell Technology (RFST) molding
  - 45-degree bearing edges cut to within 1/16" precision
  - Hand-crafted at Ludwig USA in Monroe, NC
  - Bass drum diameters: 18", 20", 22", 24", 26" with multiple depths (14"-20")
  - Tom diameters: 6"-16" with depths 7"-13"
  - Floor tom diameters: 14"-18" with depths 12"-16"
  - Matching snare diameters: 12"-14" with depths 3"-6.5"
  - Standard outfits: FAB (14x22 BD, 16x16 FT, 9x13 TT); MOD (18x22 BD, 16x16 FT, 9x12 TT, 8x10 TT); DOWNBEAT (14x20 BD, 14x14 FT, 8x12 TT); PRO BEAT (14x24 BD, 16x16 FT, 9x13 TT)
  - 30+ finish options including sparkles, oyster pearls, natural stains, satins, bursts, and specialty colors
