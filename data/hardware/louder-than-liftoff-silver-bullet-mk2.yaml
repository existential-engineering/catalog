description: "The Silver Bullet mk2 is the culmination of over 7 years of
  dreaming, designing, and building: a flagship 2RU stereo Bus/Line/Mic Tone-Amp
  that brings real analog mojo and streamlined workflow to the modern DAW-based
  studio. While maintaining the hallmark intuitive workflow of the original mk1
  unit thanks to the abundance of I/O and the built-in matrix router, the mk2
  features expanded user-customizable MOJO, increased Tone Shaping options, and
  the new ASPECT RATIO stereo image enhancer—making this desert island tool even
  more versatile and powerful. It includes fully balanced inserts, a leveled-up
  meter, cascading Mojo Amps, and an expansion slot accepting Mojo Modules or
  Colour Modules."
details: |-
  The Silver Bullet mk2 features twin topology ('A' or 'N') MOJO Amps inspired by classic American and British consoles from the 70s, plus a third 'C' slot accepting stereo Mojo Modules or Colour Modules. Mix and Tracking Modes allow both Mix processing and Overdub/Tracking processing without re-patching. Mic Modes enable fully featured stereo microphone preamp functionality with Polarity Reverse and 48V phantom power. Tone shaping EQ suite includes: 25 Hz high pass filter with resonance at 40 Hz; 50 Hz Butterworth for rumble removal; LF section (Pultec-inspired Subsonic at 30/45 Hz, Bass at 60 Hz, and Body); HF section (Mid, Presence, Brite, Sheen); AIR band on dedicated knob; Tight 12 dB/oct high pass filter with two frequency options; Baxandall Tone EQ +/-9 dB boost/cut; Vintage filter to emulate vintage British consoles. ASPECT RATIO stereo imaging circuit enhances width, height, and clarity. Balanced TRS inserts are post-MOJO, pre-TIGHT. Visually stunning 20-segment stereo high-resolution output meter with RMS and peak indication. C slot: C-Drive -6 to +18 dB, C-Mix crossfade between processed and dry signal. Custom wound American-made transformers, ROGUE FIVE discrete op amps (2520 footprint), Class-A biased op amps. Internal jumpers optimize signal path for 2-in/2-out audio interfaces. Universal external power supply (100–240 VAC, 50/60 Hz). Designed and assembled in the USA.
specs: |-
  - Tone-Amp analog Mix and Tracking processing modes with dedicated I/O
  - 'A' and 'N' cascading MOJO Amp circuit topologies inspired by classic American and British consoles from the 70's
  - MOJO Amp 'C' expansion slot to add Colour analog plugin modules or stereo Mojo Amp modules
  - Hitmaker 4000 console modules pre-installed
  - C-Drive: -6 to +18 dB
  - C-Mix: crossfade blend of processed and dry signal
  - Mix and Tracking Modes allows both Mix processing and Overdub / Tracking processing without any re-patching of cables or need for patch bays
  - Mix: process the 2-bus, bounce digitally recorded tracks and stems, combine with a DAW controlled summing system, or use with a passive summing in Folcrom mode.
  - Track: connect after your mic preamp, synth, sampler, etc.
  - Internal jumpers to optimize signal path for 2-in/2-out audio interfaces
  - Mic Modes allow Silver Bullet to function as a fully featured stereo microphone preamplifier with Polarity Reverse and 48V phantom power
  - Stereo signal path throughout with single set of easily recallable detented controls
  - Balanced TRS inserts post-MOJO, pre-TIGHT
  - Mojo LEDs provide visual feedback of signal level intensity
  - Tone shaping EQ suite designed specifically for mix sweetening and broad stroke tone sculpting of individual tracks - 25 Hz high pass filter with slight resonance at 40 Hz for tightening bottom end and increasing low frequency headroom
  - 50 Hz Butterworth response for removing rumble and tightening low end on individual tracks
  - LF: Pultec-inspired Subsonic (30, 45 Hz) and Pultec-inspired Bass (60 Hz), and Body frequencies
  - HF: Mid, Presence, Brite, and Sheen frequencies
  - AIR: the original Silver Bullet air-band on a dedicated knob
  - Tight: 12 db/oct high pass filter with two frequency options for mixing and tracking
  - Vintage: softens high frequency response to emulate vintage British consoles.
  - ASPECT RATIO stereo imaging circuit to enhance width, height, and clarity of mix
  - ROGUE FIVE discrete op amps designed by Louder Than Liftoff, conforming to standard 2520 footprint
  - Class-A biased op amps
  - All circuit components chosen by ear for maximum MOJO
  - Includes robust external universal (100-240 VAC, 50/60 Hz) power supply and IEC power cord (14 AWG - U.S. only)
