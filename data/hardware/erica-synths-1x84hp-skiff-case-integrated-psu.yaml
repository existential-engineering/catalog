description: Full aluminium 84HP 57mm deep 1 row eurorack skiff enclosure with
  aluminium rails of a unique design.
details: |-
  The 1x84HP Aluminum Skiff Case is a full aluminium single row eurorack skiff, 84HP wide and 57mm deep, built with aluminium rails of a design particular to Erica Synths.

  The case has an integrated Erica Synths PSU rated at 2.5A total for the installed modules, and a 12V 3.34A 100 to 240VAC desktop supply is included, so the only external connection it needs is that supply's DC lead.

  As standard the 56mm deep enclosures come with horizontal wooden side panels and one distribution board with 18 connector sockets, which is what the installed modules take their power from.

  Dimensions with the wooden sides fitted are 470mm x 150mm x 110mm. The case depth itself is 57mm, and the wooden side panels set the case at an angle.
specs: |-
  - 84HP single row eurorack skiff enclosure
  - 57mm case depth
  - Full aluminium construction with aluminium rails
  - Integrated Erica Synths PSU, 2.5A total
  - 12V 3.34A 100 to 240VAC desktop PSU included
  - One distribution board with 18 connector sockets
  - Horizontal wooden side panels as standard
  - Dimensions with wooden sides 470mm x 150mm x 110mm
