description: A modular degradation and texture engine packed with '80s
  nostalgia, pro audio heritage, advanced processing and high performance signal
  paths. It upgrades the earlier vintage gaming-inspired Ottobit Jr. and Ottobit
  Sr., expanded with Lo-Fi sounds reminiscent of the '80s.
details: |-
  Ottobit X is a full stereo modular degradation and texture engine with vintage '80s nostalgia, featuring newer bitcrushing, stepped stutter and advanced sequencing plus glitch modes, filters, preamps, pitch shifters, and modulations. New VHS delay and reverb showcase sounds and textures, alongside a real-time vinyl-scratching looper, a one-button push looper, and tape stop with variable speed control for real-time performance effects.

  The pedal starts from 11 categories to build custom sounds exactly as wanted: Preamp, Crush, Filter, Glitch, Pitch, Clock, Ambience, Modulate, Mix, Modifiers, and Expression.

  Ottobit X offers stereo input and output with separate jacks for each, MIDI in and out over standard five-pin DIN jacks or USB-C, and a dedicated expression pedal jack. Switchable input and output headroom accommodates instrument or line/synth levels, and the unit uses an intuitive, color-screen based user interface adapted from LVX and MercuryX with an expressive Hold Modifier switch for on-the-fly control.
specs: |-
  - 6 Glitch Types: Grain Freeze, Stutter, Push Loop, Wikki Wikki, Tape Stop, Stutter Step
  - 3 Filter Types: Ladder, State Variable, Otto Tron
  - 2 Ambience Types: VHS Reverb and VHS Delay
  - 5 Pitch Types: Poly Chroma, Otto Tune, Micro Tune, Mono Chroma, Lo-Fi
  - 5 Modulation Types: Ring Mod, Div Trem, Tape Mod, Freq Shift, Otto Vibe
  - 4 Preamp Types: Volume Pedal, Tube, Vinyl, Wavefold
  - 16 Step Sequencer, assignable to approx. 48 parameters
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Sample Rate: 48000 Hz
  - Input Impedance: 1 Meg Ohm
  - SNR: 115 dB Typical
  - Frequency Response: 20Hz-20kHz
  - Max Input Level: +9 dBu (instrument level setting), +12.5 dBu (line/synth level setting)
  - Power: 9V DC center-negative, 300mA, 2.1mm jack
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Dimensions: 7.25" wide x 4.5" long x 2" tall
  - Weight: 24 ounces
