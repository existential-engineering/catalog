description: A signature model built with Frank Gambale in 2011 around a classic
  shape with soft upper horns and a rounded body. A set neck, semi-hollow body
  and signature pickup are its most prominent aspects, aimed at jazz-fusion
  playing.
specs: |-
  - Model designation: FG1
  - Construction: set neck
  - Body: mahogany with flamed maple top, rear of body natural clear, natural body binding
  - Neck: tung-oiled mahogany with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69 in at nut, 0.78 in thick at 1st fret, 0.88 in thick at 12th fret
  - Fingerboard: ebony with 14 in radius
  - Frets: 22 regular nickel, .080 in wide x .043 in tall
  - Scale length: 25 in
  - Headstock: carved top with flamed maple overlay
  - Bridge: Tune-O-Matic with stop piece, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: bezel-mount Kiesel Beryllium bridge humbucker and Kiesel Gambale neck humbucker
  - Electronics: 2 volume, 2 push/pull tone with coil splitter, 3-way pickup selector
  - Inlays: white pearl Frank Gambale signature inlays, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Body dimensions: 39 in long, 1.85 in thick, 14.1 in wide
  - Weight: 7.5 lbs
  - Strings: Elixir Nanoweb 1046E
  - Truss rod cover: Frank Gambale signature
