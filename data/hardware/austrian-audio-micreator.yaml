description: An all-in-one USB-C audio interface and studio condenser microphone
  designed for capturing vocals, instruments, and ideas anywhere. Features
  pro-grade audio quality up to 48 kHz/24-bit with real-time monitoring via a
  built-in headphone output and zero-latency capability.
details: |-
  The MiCreator Studio is a combined USB-C audio interface and studio condenser microphone with a cardioid directional pattern. Offers up to 48 kHz/24-bit digital resolution and a hardware gain switch with two settings (0 dB low / 20 dB high).

  Features zero-latency real-time monitoring through a built-in headphone output and a TRRS 3.5mm port for instrument input or headset use. The microphone head is flexible and movable for angle adjustment.

  Part of an expandable modular system, pairing with the MiCreator Satellite (second condenser mic) and MiCreator Y-Lav (lavalier mic) via the MCC2 Link Cable.

  Includes free Steinberg Cubase LE and WaveLab Cast software.
specs: |-
  - Digital Resolution: Max 48 kHz/24-bit
  - Frequency Range: 20 Hz – 20 kHz
  - Directional Pattern: Cardioid
  - Sensitivity: -35 dBFS/Pa (low gain) / -15 dBFS/Pa (high gain)
  - Equivalent Noise Level: 22 dB SPL (A) (high gain)
  - Hardware Gain Switch: 0 dB (low) / 20 dB (high)
  - Maximum SPL: 130 dB SPL (low gain)
  - Output Power: 45 mW (32 Ω load)
  - Digital Connector: USB-C (USB Audio Class 1.0/2.0)
  - Analog Connectors: 1× TRRS 3.5mm (IN/OUT), 1× TRS 3.5mm (Headphones)
  - Dimensions: 155 × 60 × 37 mm
  - Weight: 370g
