description: The CJ is a slope-shouldered jumbo acoustic guitar that draws on
  classic American guitar design while incorporating Collings' hallmark
  precision craftsmanship. It delivers a distinctly different tone from a
  traditional dreadnought, with a somewhat percussive bottom end ideal for
  acoustic blues or styles that benefit from a more controlled bass response.
  Built with a Sitka spruce top, East Indian rosewood back and sides, and a
  pre-war scalloped X-brace.
details: |-
  The CJ is a slope-shouldered jumbo acoustic guitar sharing the width and depth of a traditional dreadnought but delivering a distinctly different tonal character — a percussive bottom end especially well-suited for acoustic blues and styles requiring a more controlled bass response. The standard model features a Sitka spruce top with pre-war scalloped X-bracing, paired with East Indian rosewood back and sides. The neck is Honduran mahogany with a C-shape profile and a compound fingerboard radius of 14" to 26", topped with an ebony fingerboard inlaid with MOP long dots. The ebony belly-style bridge and ebony bridge pins with MOP dots complement the ivoroid body binding with b/w/b/w/b purfling and an ivoroid rosette. Tuning is handled by nickel Waverly tuners.
specs: |-
  - Body Style: Slope-shoulder jumbo
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Neck Profile: C-shape
  - Fingerboard: Ebony
  - Fingerboard Inlays: MOP long dots
  - Fingerboard Radius: 14" - 26" compound
  - Bridge: Ebony belly-style
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Scale Length: 25 1/2"
  - Bracing: Pre-war scalloped X-brace (Sitka spruce)
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Rosette: Ivoroid with b/w purfling
  - Backstrip: 3-style (Chevron)
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 16"
  - Body Length: 20 1/8"
  - Body Depth: 4 7/8"
  - Total Length: 41"
  - Strings: D'Addario EJ-17 (.013" - .056")
