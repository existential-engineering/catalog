description: The D-BOX is a transparent, audiophile-grade monitor controller for
  tracking, mixing and mastering with eight channels of Dangerous Music's
  award-winning analog summing.
details: |-
  The D-BOX is a transparent, audiophile-grade monitor controller for tracking, mixing and mastering with eight channels of Dangerous Music's award-winning analog summing at an unbelievable price point. The D-BOX handles input source monitoring, speaker switching, cue, talkback, headphone and mixing needs in just one rack space, with reference-grade D/A conversion, switchable analog inputs, two 20w/channel headphone amps, and a built-in talkback mic.

  As the centerpiece of a studio, the D-BOX handles all routing elegantly: a main stereo analog input, two digital inputs (both monitored through the same reference D/A), and two speaker outputs, handling both professional (+4dBu) and commercial (-10dBV) input levels.

  The award-winning active analog summing provides increased headroom and sonic space. Digital subgroups are sent out via the DAW interface's D/A converters to the D-BOX's eight analog summing inputs. Channel count can be expanded with a 2-BUS LT or 2-BUS+.
specs: |-
  - Summing Section frequency response: 1Hz-100kHz (±0.1dB)
  - Summing Section THD+N: <0.003%
  - Summing Section crosstalk: <-97dB
  - Monitor Section frequency response: 1Hz-100kHz (±0.1dB)
  - Monitor Section THD+N: <0.002%
  - D/A converter locks to AES or S/PDIF signals, 32kHz-100kHz
  - D/A converter THD+N: 0.005%
  - Input impedance: 25kOhm balanced
  - Output impedance: 50Ohm balanced
  - Power consumption: 25W
  - Two independent 20-watt/channel headphone amplifiers
  - 8 channels of analog summing via rear DB25 (Tascam wiring standard)
  - Hand-built in the USA
