url: https://www.klarkteknik.com/en/products/0829-AAK
description: The DM TCE is a configurable wall control panel for installed audio
  applications, with the DM TCE-EU fitting a standard single gang EU sized wall
  box. A single Cat5e cable provides PoE power and network control data to each
  device.
details: |-
  Modern installed audio applications require a configurable control panel. DM TCE can be installed into a standard single gang EU (DM TCE-EU) or US (DM TCE-UL) sized wall box, and a single Cat5e cable provides PoE power and network control data to each device. Each device ships with both black and white trim plates and control knobs to match the venue decor.

  Digital labels can be assigned to each of the 8 button areas, with colours chosen to reflect the action being performed. An icon or programmer-selected graphic can be used instead of text.

  To use DM TCE with a DM8000 DSP device, a DM801 ethernet to serial bridge is required, one for each DM8000 being controlled in the system. The DM801 is not required for use with a DM8500. DM TCE requires a PoE capable ethernet switch or mid-span power injector to provide power to the device.
specs: |-
  - Fits a standard single gang EU sized wall box
  - 8 button areas with assignable digital labels, colours, icons or graphics
  - Single Cat5e cable carries PoE power and network control data
  - Requires a PoE capable ethernet switch or mid-span power injector, no separate mains inlet
  - Supplied with both black and white trim plates and control knobs
  - Requires one DM801 ethernet to serial bridge per DM8000 controlled; not required with a DM8500
