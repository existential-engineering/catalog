details: |-
  Natural-sounding pencil condenser microphones for all your stereo-miking needs

  Welcome to the wonderful world of stereo recording with the Sontronics STC-1S small-diaphragm condenser mics. This pair of cardioid-pattern 'pencil' condensers will deliver superbly accurate and consistently reliable results across a multitude of stereo miking applications, whether you're working in the studio, at home or in a live sound environment. Laboratory-tested as a stereo pair, the superbly versatile STC-1S mics feature a three-stage pad switch, giving you total control over how they respond to sound pressure levels from any source, and a three-stage filter switch, allowing you to reduce the low-frequency response. The STC-1S, like all Sontronics mics, feature a super-smooth roll-off in the high frequencies, ensuring a clear, clean signal that sits perfectly in the mix. For even more flexibility, the STC-1S mics are compatible with our optional Omnidirectional and Hypercardioid capsules, opening up an array of recording possibilities whether you're using the STC-1S as a stereo pair or individual solo mics.
specs: |-
  - Matched Stereo Pair: Hand-matched for perfect stereo imaging, ideal for capturing realistic soundscapes and wide stereo fields.
  - Small-Diaphragm Condenser: Offers the same detailed and accurate sound capture as the STC-1, perfect for stereo recording of instruments and ensembles.
  - Interchangeable Capsules: Compatible with cardioid, hypercardioid, and omnidirectional capsules, offering versatility for various recording situations.
  - Accurate Stereo Imaging: Ensures balanced and precise stereo recordings, making it ideal for piano, choirs, string ensembles, and ambient room miking.
  - Switchable Pad and Filter: Each mic in the pair features a -10dB and -20dB PAD, along with a 75Hz and 150Hz high-pass filter, providing control over dynamics and low-end frequencies.
  - Durable Build: Solid brass construction with a sleek, professional finish, ensuring durability and long-lasting performance.
  - Excellent for Live and Studio Use: Equally effective in both live recording environments and studio settings, providing flexibility for any project.
  - Low Noise and High Sensitivity: Offers clean, transparent recordings with minimal self-noise, capturing even the most delicate nuances.
  - Versatile Setup Options: Perfect for XY, Spaced Pair, ORTF, and other stereo miking techniques, giving engineers creative flexibility.
  - Complete with Mounts and Case: Comes with mic clips, stereo mounting bar, foam windshields and a protective case, providing everything needed for stereo recording sessions.
