description: Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the LTD Deluxe MH-1000NT is a seriously heavy-duty machine for your most high-performance guitar playing.
details: |-
  Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the LTD Deluxe MH-1000NT is a seriously heavy-duty machine for your most high-performance guitar playing. Built with set-thru construction at 25.5” scale, the MH-1000NT offers a mahogany body, a three-piece extra-thin U-shaped maple neck, and a Macassar ebony fingerboard with compound radius, 24 extra-jumbo stainless steel frets, offset block inlays, and a reversed matching-finish headstock. Components on this outstanding guitar include LTD locking tuners, a TonePros locking TOM-style bridge with string-thru-body, and a set of direct-mounted Fishman Fluence Modern 3-Voice Humbucker pickups — ceramic in the bridge, and alnico in the neck — with Black Nickel covers. Push-pull controls allow for selection of these innovative pickups’ multiple voices.
specs: |-
  - Construction: Set-Thru
  - Scale: 25.5"
  - Body: Mahogany
  - Neck: 3Pc Maple
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 300-400mm Compound
  - Finish: Granite Sparkle
  - Nut Width: 42mm
  - Nut Type: Molded
  - Neck Contour: Extra Thin U
  - Frets/Type: 24 XJ Stainless Steel
  - Hardware Color: Black
  - Strap Button: Standard
  - Tuners: LTD Locking
  - Bridge: TonePros Locking TOM w/ String Thru
  - Bridge PU: Fishman Fluence Modern 3-Voice Humbucker Ceramic Black Nickel Direct-Mount *(Pull Volume for Voice 3 / Pull Tone for Voice 2)
  - Neck PU: Fishman Fluence Modern 3-Voice Humbucker Alnico Black Nickel Direct-Mount *(Pull Volume for Voice 3 / Pull Tone for Voice 2)
  - Electronics Layout: Volume(Push/Pull)/Tone(Push/Pull)/3-way Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
  - Case: MH GUITAR FORM FIT CASE
  - Case Included: N
