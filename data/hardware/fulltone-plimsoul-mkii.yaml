description: An overdrive/distortion pedal with independent dual-stage Soft and
  Hard clipping controls designed to replicate the sound and feel of a tube amp,
  featuring top-mounted jacks and a lossless Bass switch.
details: |-
  The mighty PlimSoul returns! ...and the MkII is better than ever, with:

  Clipping = Distortion, and for many years we've only been offered two clipping choices: Soft-Clipped or Hard-Clipped. Soft-Clipped pedals include Tube Screamers, Fulldrive2, OD-1, Zendrive, etc, which get their distortion by using diodes placed in the feedback loop of their Opamp. This type of clipping is generally favored by the folks wanting a cleaner, more compressed, low-to-medium gained Overdrive sound. The other choice we have are Hard-Clipped pedals like the RAT, Distortion+, Boss DS-1, etc. These pedals create distortion using diodes tied to ground or, unique to the Fulltone OCDv2, Mosfets that are tied to the half-way point between 9volt and ground (Vref) offering a more natural sounding distortion, one that emulates the SAG (feel) of an amp's tube rectifier.. The original PlimSoul is the only pedal to offer both Soft & Hard clipping with separate control over each. I designed the PlimSoul's unique, independent dual-stage clipping circuit to replicate not only the sound, but the feel of a tube amp with its subtleties and complexities. The original PlimSoul was a great first step, but the PlimSoul mkII offers significant improvements over it: Input Impedance increased from 500k to 700K+ ohms for even better interaction with guitar's Volume knob. Top-Mounted Jacks and external power port. Soft-Clipping (Stage 1) and Hard-Clipping (Stage 2) are now truly-independent, allowing for aggressive, punchy gain with the Hard-Clipping knob turned up even while the Soft-Clipping knob is turned down! Hard clipping now uses two Germanium Diodes tied to Vref, instead of LEDs...it's a night-and-day improvement. Loss-less Bass switch, located just before the Hard-Clipping in the circuit, giving the ability for tight, percussive distortion that's not muddy. You will find your place in the mix immediately, and sound great doing it! Treble control now offers plenty of brightness when turned up. The Soft-Clipping stage is extremely Asymmetrical, the Hard-Clipping stage is Symmetrical, dial-in infinite combinations of the two. The Fulltone PlimSoul mkII might be the most versatile Overdrive/Distortion ever made. They are Hand-Built in the U.S.A. using top-notch, full size components, many of our components are designed by me and made exclusively for Fulltone.
