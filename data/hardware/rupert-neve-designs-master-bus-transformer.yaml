description: The Master Bus Transformer (MBT) is a 2RU transformer-based
  mastering and mix-bus processor featuring custom Rupert Neve Designs
  transformers across multiple processing sections. It combines
  transformer-driven coloration with sophisticated tone-shaping tools, including
  a 2-band shelf EQ, an optical Color Comp compressor, a stereo Width section
  with variable HPF, and the Super Silk circuit for harmonic manipulation via
  Red, Blue, Harmonics, and Zener Drive controls.
details: |-
  The Master Bus Transformer (MBT) is a 2RU stereo analog processor built around custom Rupert Neve Designs transformers, combining transformer-driven coloration with sophisticated tone-shaping tools for mastering, mixing, and live applications.

  The signal path includes a 2-band shelf EQ (±9 dB per band — LF 30 Hz - 240 Hz, HF 3 kHz - 24 kHz), a 6 dB/octave input high-pass filter (15 Hz - 100 Hz), and an optical Color Comp compressor with selectable 2:1 / 5:1 ratios, threshold up to +24 dBu, fixed 20 ms attack, variable 100 ms - 1.5 s release, and a class-A make-up gain stage.

  A stereo Width section with a variable HPF (50 Hz - 800 Hz) lets the engineer adjust stereo spread without affecting low-frequency mono content. The Super Silk circuit takes Rupert Neve's signature harmonic enhancement further with independent Red, Blue, Harmonics, and Zener Drive controls for nuanced saturation shaping.

  Input and output trim (±12 dB each), a true hardwire Master Bypass for power-loss protection, and an internal universal power supply (100-240 VAC, IEC) round out the feature set. The unit ships in a 2RU steel chassis weighing 13 lbs.
specs: |-
  - Frequency response: ±0.1 dB (<5 Hz - 30 kHz), ±0.25 dB (<5 Hz - 60 kHz)
  - THD+N @ 0 dBu (1 kHz): better than 0.004%
  - THD+N @ +20 dBu (1 kHz): better than 0.002%
  - Noise (22 Hz - 22 kHz, no features engaged): better than -95 dBu
  - Crosstalk @ 1 kHz: better than -95 dB
  - Input impedance: 10 kOhm
  - Max input/output level: +25.5 dBu
  - EQ: LF 30 Hz - 240 Hz, HF 3 kHz - 24 kHz, ±9 dB per band
  - Color Comp: threshold 0 to +24 dBu, release 100 ms - 1.5 s, makeup gain 0 to +20 dB, S/C HPF 20 Hz - 350 Hz, attack 20 ms fixed
  - HPF: 15 Hz - 100 Hz, 6 dB/oct
  - Width HPF: 50 Hz - 800 Hz
  - Input/output trim: ±12 dB each
  - Power: 100-240 VAC, IEC 3-pin grounded, max 70 W
  - Dimensions: 19" W x 10.25" D x 3.5" H (48.3 x 26 x 8.9 cm)
  - Weight: 13 lbs (5.9 kg)
