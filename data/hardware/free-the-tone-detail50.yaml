description: The MB-5 receives one stream of MIDI data and splits it into five
  to enable parallel data transmission. By receiving MIDI data directly from the
  MB-5, devices can avoid the problems that can occur when they are connected
  serially.
details: |-
  MIDI is common to many guitar and bass devices, and Free The Tone adopts MIDI devices in most of its custom pedalboards and rack systems. A single MIDI receiving device poses no problem, but when a system holds several MIDI devices and every MIDI wire is run serially, the data transmission takes a certain amount of time, which can surface as a delay or a malfunction.

  The MB-5 receives one stream of MIDI data and splits it into five so that the data can travel in parallel. Each device takes its MIDI data directly from the MB-5 rather than through the device in front of it, which avoids the problems a serial chain can introduce.

  The wave shape of the MIDI signal fed into the MB-5 is corrected by an internal logic circuit, so transmission errors caused by a deteriorated data waveform are prevented as well.

  The box carries six 5-pin DIN connectors, one MIDI IN and five MIDI OUT. It runs from a 9 V DC centre-negative supply at roughly 8 mA, measures 100 x 52 x 30 mm and weighs about 200 g.
specs: |-
  - Terminals: 6x DIN 5-pin connectors (1x MIDI IN, 5x MIDI OUT)
  - Power supply: 9V DC center negative polarity
  - Current consumption: approx. 8 mA
  - Dimensions: 100 (W) x 52 (D) x 30 (H) mm
  - Weight: approx. 200 g (excluding accessories)
  - Accessories: warranty card, Web Access Card
