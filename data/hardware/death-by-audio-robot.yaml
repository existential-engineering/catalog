description: A low-fidelity 8-bit pitch transposer pedal that applies
  bit-crushed octave, ring modulation, and arpeggiation effects to any input
  signal.
details: |-
  8-BIT PITCH / RING / LOFI / GRANUALIZER The Robot is a low fidelity 8 bit pitch transposer with absolutely no feelings whatsoever. It is completely synthetic and transforms any input into a puree of resynthesized robot jargon. Features bendable super lo-fi fuzz, octave up, octave down, and arpeggiation. All modes are controlled by the Control Knob, which sets the frequency the chip operates at, changing and warping the pitch shifting and aliasing effects. Details This cranky computer uses a voice transformation IC from 80s kids toys to calculate crazy pitch shifting, bit-crushing distortion, tunable octaves up and down, and ring modulation. There's also an insane arpeggiator for primitive digital sound mangling that sounds like a squad of sentient automatons from the future-past marched across the uncanny valley, through the singularity, into your music room, and started playing lead in your band. Controls Control Knob Located on the right-hand side of the pedal. Controls the pitch of the effect. When turned up completely clockwise, it is at its highest pitch. Turning down, counterclockwise, lowers the pitch or speed of the arpeggiator. Volume Controls the output volume of the effect Rotary Selector Normal: Same pitch with 8-bit digital conversion when the Control Knob is fully clockwise. Turning the Control Knob down bends the pitch lower. Octave Down: The Control Knob turned fully clockwise yields a nasty octave down sound. Turning the Control Knob down bends the pitch further downwards. Octave Up: The Control Knob turned fully clockwise yields a nasty octave up sound. turning the Control Knob down bends the pitch lower. Arpeggiator: The pitch arpeggiates in a sequence. The Control Knob adjusts the speed of the arpeggiator. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel NOTE: Older versions of the Robot require a 9v battery or dedicated power supply (daisy chains do not work) Current Draw: 23 mA Physical Details Dimensions: 5.87" x 4.72" x 2.62" (including hardware) Weight: 19 oz.
