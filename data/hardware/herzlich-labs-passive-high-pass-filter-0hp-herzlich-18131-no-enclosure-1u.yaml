description: A single pole -3 dB passive high pass filter with high quality
  components, covering a range from 31 Hz to 16 kHz. It is used to gently cut
  low frequencies from a signal.
details: |-
  Cut the lows, keep the highs

  You need filters. You need huge, voltage controlled filters with massive cutoff knobs for doing sick filter sweeps, with old styroflex caps and transistors made in long-departed Eastern Bloc countries, of course. But when that is taken care of, you really also need some filters for smaller tasks. Taming sounds and signals gently, not with a brick wall or iron fist. The Passive HPF is simple: a single pole -3 dB high pass filter with high quality components ranging from 31 Hz to 16 kHz. Set and forget, and move on to more important tasks in your performance or recording. An excellent companion for situations where you need to cut a bit of low frequency. For instance, cutting lows before sending a signal into your reverb can help the reverb sparkle without creating too much low rumble. It's a simple and elegant solution that keeps you patching, without taking up your precious active filters.
specs: |-
  - Simple HPF for cutting low frequencies
  - High quality capacitors from Wera
  - Passive design: no external power, no batteries
