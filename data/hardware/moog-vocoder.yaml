description: >-
  The Moog Vocoder is a 16-band analog vocoder released in 1979, designed to process
  external carrier and modulator signals across distinct frequency bands ranging from 50
  to 5080 Hz. It lacks internal oscillators, output mixer, MIDI, or CV/Gate, functioning
  purely as an external signal processor. Its architecture is nearly identical to the Bode
  7702 vocoder and has been used by artists including Yellow Magic Orchestra, Wendy
  Carlos, Devo, and John Carpenter.
details: |-
  In 1979 Moog released a vocoder of their own, although its design and architecture is almost identical to the Bode 7702 vocoder. The device operates with 16 channels, separating sounds into frequency bands ranging from 50 to 5080 cycles per second. It processes synthesizer sounds by applying the spectral characteristics of a modulator signal (typically voice or drums) onto a carrier signal.

    The Moog Vocoder features microphone and line inputs, 16 individual synthesizer inputs (one per frequency band), and 16 corresponding outputs. Its 16-channel cross-matrix patching system, while cumbersome, was well-suited to the modular synth era. Additional capabilities include a high-frequency bypass for preserving sibilance, a fast 6ms response time for capturing percussive transients, sample-and-hold functionality, and a global bypass switch.

    It does not have any internal oscillators, no output mixer, and no MIDI or CV/Gate connectivity. Despite these limitations, the Moog Vocoder became a sought-after unit for its warm analog character. Notable users include Saga, Yellow Magic Orchestra, Wendy Carlos, Moog Cookbook, Devo, and filmmaker/composer John Carpenter.
specs: |-
  - 16 frequency bands/channels
    - Frequency range: 50 to 5080 Hz
    - Response time: 6ms
    - No internal oscillators
    - Microphone and line inputs
    - 16 synthesizer inputs (one per band)
    - 16 outputs
    - 16-channel cross-matrix patching system
    - High-frequency bypass
    - Sample-and-hold functionality
    - Global bypass switch
    - Foot control jack inputs for bypass and sample-and-hold
    - No output mixer, MIDI, or CV/Gate
