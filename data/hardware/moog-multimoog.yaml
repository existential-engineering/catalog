description: >-
  Moog's dual-oscillator monophonic synthesizer featuring a ribbon controller, aftertouch, sample
  and hold, and the classic 24 dB per octave Moog ladder filter.
details: |-
  The Multimoog served as the big brother to the Micromoog, offering a more fully featured monophonic synthesis experience while remaining more affordable than Moog's premium instruments. Two VCOs producing pulse, square, and sawtooth waveforms feed into the legendary 24 dB per octave Moog ladder filter with cutoff, emphasis (resonance), and envelope amount controls.

  A generous set of performance features sets the Multimoog apart from simpler monophonic synths of the era. The ribbon controller adds expressive pitch manipulation, while keyboard aftertouch can be routed to pitch, VCF cutoff, or LFO rate for dynamic, touch-responsive playing. A flexible sample-and-hold circuit provides additional modulation possibilities beyond the standard LFO.

  The 44-key keyboard is wider than many monophonic synthesizers of the period, giving players more range for lead lines and bass parts. The VCA section includes a full ADSR envelope with multiple modulation sources for nuanced amplitude shaping. With no patch memory and CV/Gate connectivity, the Multimoog is firmly rooted in the hands-on, knob-per-function ethos of late 1970s analog synthesis. Underworld is among its notable users.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (pulse, square, sawtooth)
  - Filter: 24 dB/oct lowpass with cutoff, emphasis, envelope amount
  - VCA: ADSR with multiple modulation sources
  - LFO: Yes
  - Keyboard: 44 keys with aftertouch
  - Features: Ribbon controller, sample and hold
  - Memory: None
  - Control: CV/Gate
releaseDate: "1978"
