description: An 80s British-inspired hitmaker console and VCA compressor expansion module designed for the Silver Bullet mk2. Delivers solid state British console sound through stereo Hitmaker 4000 Mix Amp circuits combined with a stereo VCA bus compressor.
details: |-
  Features stereo Hitmaker 4000 Mix Amp circuits for console-style saturation alongside a stereo VCA bus compressor with sidechain bypass. Selectable attack times of 1, 3, 10, or 30 milliseconds. Release options of 100, 300, 600, or Auto milliseconds. Compression ratios of 2:1, 4:1, or 10:1. Adjustable threshold and output gain via trimmers. Sidechain high-pass filter options: Full, 50, 100, or 230 Hz. Built with NE5534A op amps and Panasonic bipolar capacitors for vintage tone on a 4-layer PCB. Mojo Module format — slots into the Silver Bullet mk2 chassis (sold separately).

specs: |-
  - Stereo VCA bus compressor
  - Sidechain bypass for saturation only – selectable by jumper
  - Attack: 1, 3, 10, 30 ms – selectable by jumper
  - Release: 100, 300, 600, Auto ms – selectable by jumper
  - Ratio: 2:1, 4:1, 10:1 – selectable by jumper
  - Threshold and Output Gain – adjustable via trimmers to set balance of saturation to compression
  - Sidechain HPF: Full, 50, 100, 230 Hz – selectable by jumper
  - NE5534A op amps chosen for proper vintage tone closest to the famed Signetics 5534
  - Panasonic bipolar caps as originally spec'd in the 80's consoles
  - 4-layer PCB design (most parts on bottom of the PCB)
  - Analog expansion module compatible with Silver Bullet mk2 - C-DRV knob on Silver Bullet mk2 controls amount of drive into module
  - C-MIX knob on Silver Bullet mk2 blends effected/compressed signal with dry signal
  - Mojo Module Installation Instructions
  - Hitmaker Comp Mojo Module Settings
