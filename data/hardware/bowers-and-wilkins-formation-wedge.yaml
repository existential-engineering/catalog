description: The Formation Wedge wireless speaker delivers room-filling audio
  from one stylishly shaped and finished speaker. Five precisely angled drivers
  provide true stereo sound, making Wedge the hi-res speaker that sounds even
  better than it looks.
details: |-
  Formation Wedge is a network connected, wireless active speaker that provides extremely high performance reproduction of Formation audio streams. It is primarily intended to be configured and controlled using the Bowers & Wilkins Home app, available for both iOS and Android devices, and it is only possible to install and configure a Formation Wedge using that app. Some commonly used control functions are also available via touch buttons on the Formation Wedge top panel.

  Formation Wedge will enable you to listen to audio from streaming services like Spotify, Apple Music and Roon, to network stored audio files, to audio over Bluetooth from appropriately enabled Bluetooth source devices, to audio from devices such as turntables (via a phono preamp) and CD players that are connected to a Bowers & Wilkins Formation Audio, to audio such as Internet Radio from AirPlay or Bluetooth compatible services and apps, and to audio playing anywhere in your home on any Formation device connected to your home network.

  In addition to a mains power socket, the Formation Wedge speaker carries an Ethernet socket for connection to a router should a wired network connection be preferred to wireless (WiFi). The USB socket located on the Formation Wedge rear panel is intended for service and diagnostic use only and cannot be used for any other purpose.

  Formation Wedge requires a mains power supply to operate, so must be located within reach of a mains socket. It can be placed on a shelf, table or furniture unit and can also be wall-mounted on a dedicated wall bracket. The speaker has no mains power switch and, following a short start-up routine, will be operational as soon as it is connected to mains power. It manages its operational state and power consumption entirely automatically and will switch to a power saving mode after twenty minutes of inactivity.

  The top panel touch buttons provide play/pause control, volume adjustment and source/stream selection. Touching the Form button cycles through and plays the active streams and sources available to the Formation Wedge, and the Form button illumination changes to indicate a variety of operational states.
specs: |-
  - Description: Wireless Music System
  - Drive units: 2x 25mm (1in) Double dome tweeter, 2x 90mm (3.5in) FST midrange, 1x 150mm (6in) subwoofer
  - Frequency response: 35Hz to 28kHz
  - Technical features: Apple AirPlay 2 technology, Spotify Connect, Roon Ready, Bluetooth In, Digital Signal Processing (DSP), Digital Amplifier, Dynamic EQ
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: Below 6 Watts (Sleep)
  - Connections: Network (RJ45 Ethernet or WiFi), USB (service only)
  - Bluetooth: Bluetooth v4.1, Class 2, with aptX HD, AAC and SBC codecs
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Dimensions: Height 232mm (9.1in), Width 440mm (17.3in), Depth 243mm (9.6in)
  - Net weight: 6.5kg (14.3lb)
  - Cabinet finishes: Black, Silver
  - No mains power switch, automatic power saving mode after twenty minutes of inactivity
  - Can be shelf, table or furniture mounted, or wall-mounted on a dedicated wall bracket
