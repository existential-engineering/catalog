description: The Formation Wedge wireless speaker features five precisely angled
  drivers to provide true stereo sound and room-filling audio.
details: |-
  Formation Wedge is an elegant versatile wireless speaker in the Bowers & Wilkins Formation range. It delivers room-filling audio from one stylishly shaped and finished speaker: five precisely angled drivers provide true stereo sound, making Wedge the hi-res speaker that sounds even better than it looks.

  The five drivers are two 25mm (1 in) double dome tweeters, two 90mm (3.5 in) FST midrange units and one 150mm (6 in) subwoofer, angled across the wedge-shaped cabinet. Quoted frequency response runs from 35Hz to 28kHz. The product is a Wireless Music System.

  Streaming is handled natively: Apple AirPlay 2 technology, Spotify Connect, Roon Ready and Bluetooth In are all listed. Bluetooth is v4.1 Class 2 with aptX HD, AAC and SBC codecs. AirPlay 2 compatibility covers iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th generation) with tvOS 11.4 or later, and Mac or PC with iTunes 12.8 or later.

  Amplification and tuning are digital, with Digital Signal Processing (DSP), a Digital Amplifier and Dynamic EQ listed among the technical features. Wired connectivity is limited to the network port: the speaker joins a Formation system over RJ45 Ethernet or Wi-Fi, and the only other socket is a USB port marked service only.

  The speaker runs from mains at 100V to 240V, 50/60Hz, and draws below 6 watts in sleep. It measures 232mm (9.1 in) high, 440mm (17.3 in) wide and 243mm (9.6 in) deep, and weighs 6.5kg (14.3 lb). Two cabinet finishes are listed, Black and Silver.
specs: |-
