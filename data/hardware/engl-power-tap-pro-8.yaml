id: df4uwze5eHSPx7o1-1Ga-
name: Power Tap Pro 8
manufacturer: engl
primaryCategory: power-conditioner
url: https://www.engl-amps.com/shop/accessories/engl-power-tap-pro-8/
description: Eight-output isolated pedalboard power supply with an ultra-low
  noise design, a high-current 12 V / 2 A output for digital units, seven 9 V
  outputs, short-circuit and overload protection and a per-output LED indicator.
details: |-
  Every pedalboard is only as good as the power behind it. The Power Tap Pro 8 was built to make sure that power is never the problem, a professional power supply delivering clean, ultra-low noise current to every pedal on your board, so all you hear is your tone.

  Every output is fully isolated, eliminating ground loops and cross-noise between pedals even in the most demanding rigs. Alongside its standard 9 V outputs, the Power Tap Pro 8 packs a high-current 12 V / 2 A output built for modeling processors and other power-hungry digital units, plus a flexible mix of 500 mA, 300 mA and 100 mA outputs to run analog and digital pedals side by side, safely and reliably.

  Built-in short-circuit and overload protection, backed by individual LED indicators on every output, keep your rig running exactly as it should, night after night. Each indicator lights up when a pedal is connected and turns off automatically on a fault or overload.

  Compact and pedalboard-friendly, the Power Tap Pro 8 carries the same engineering and reliability ENGL Amplifiers has built its reputation on for over four decades, whether you're in the studio, at rehearsal, or out on the road.
specs: |-
  - Ultra-low noise design for clean, studio-quality tone
  - Fully isolated outputs to eliminate ground loops and interference
  - 1 x 12 V / 2 A high-current output for modeling processors and digital units
  - 1 x 9 V / 500 mA output
  - 1 x 9 V / 300 mA output
  - 5 x 9 V / 100 mA outputs for analog pedals
  - Short-circuit and overload protection
  - Individual LED indicator per output, lit when a pedal is connected and off automatically on fault or overload
  - Compact, pedalboard-friendly enclosure
  - Ideal for studio, rehearsal, live performance and touring use
