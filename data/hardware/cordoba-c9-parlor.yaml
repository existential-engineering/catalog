details: |-
  The C9 Parlor is ideal for guitarists looking for the comfort and ease of playability that a smaller instrument provides, while retaining the sweet, warm tone created by all-solid wood construction. Built with a solid Canadian Cedar top and solid Mahogany back and sides, the C9 Parlor has a reduced 7/8 body size and 50mm nut width.
