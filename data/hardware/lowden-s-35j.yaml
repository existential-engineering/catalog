details: |-
  The Lowden Jazz Series of guitars have been designed to feel comfortable and familiar to classical and steel string players alike, making it the ultimate 'cross-over' guitar. The neck has enough width to facilitate the nylon strings but at the same time the cambered fingerboard allows for a wide variety of playing styles. Jazz Series guitars are fitted with an LR Baggs Session VTC pickup, and all S-shaped Jazz models have a cutaway as standard. The soundbox is voiced for a really great acoustic response, and at the same time stiff enough to prevent the whole guitar from overreacting when played loud through a sound system. With 35 Series grade AAAA tonewoods and appointments, the S-35J features Guatemalan Rosewood back and sides and an Alpine Spruce top. See also the S-25J, S-32J, S-50J and WL-35J.
specs: |-
  - 48mm nut width
  - 60mm neck width at the 14th fret
  - 374mm soundbox width
  - 105mm soundbox depth
  - 650mm scale length
  - 508mm fretboard radius
  - Guatemalan Rosewood back and sides
  - Alpine Spruce top
  - AAAA grade 35 Series tonewoods
  - S-shaped body with cutaway
  - Cambered fingerboard
  - LR Baggs Session VTC pickup fitted as standard
