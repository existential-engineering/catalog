  reprogrammable via Arduino.
details: |-
  The Kastle v1.5 is a pocket-sized semi-modular synthesizer powered by two ATtiny 85 microcontrollers reprogrammable via Arduino. Its complex oscillator offers six synthesis modes split between main (phase modulation, noise, track & hold modulation) and secondary (phase distortion, tonal noise, formant synthesis) variants.

  A voltage-controllable LFO provides triangle and square wave outputs with a reset input. A stepped voltage generator offers random, 8-step, and 16-step modes for melodic sequencing and modulation. CV-controllable parameters include pitch, timbre, and waveshape.

  Two dual-purpose CV I/O ports enable patching with other modular gear. Audio output is via a headphone connector. 10 patch pin cables included. Powered by 5V Micro USB or 3x AA batteries. Open-source hardware (CC-BY-SA license) with schematics and firmware on GitHub.

  Dimensions: 70 × 60 × 50 mm. Succeeded by the Kastle 2 series (Alchemist, Wave Bard, FX Wizard).
