description: 9000 Series pedals offer drummers an unequaled combination of speed, feel, and power.
details: |-
  The DW 9000 Series Single Bass Drum Pedal (XF) is engineered for drummers who demand a smooth, powerful and highly adjustable playing experience. Every major component in the 9000 Series drivetrain is designed to reduce friction, improve stability and give players greater control over how the pedal responds underfoot.

  Drummers asked us for a longer footboard, and we listened. The 9000XF model offers all the cutting-edge features of our regular 9000 pedals, along with our Extended Footboard, which is one inch longer than standard.

  At the heart of the 9000 is DW's Floating Rotor design, which adds bearings directly into the cam assembly to help the drivetrain move through the path of least resistance. The EZ Infinite Adjustable Cam lets players continuously adjust the pedal from a linear Turbo-style response to the increased acceleration of an Accelerator-style cam, or anywhere in between.

  The Delta II Ball Bearing Hinge uses dual ball bearings and an interlocking component design to create a precise, low-friction connection between the footboard and heel plate. At the bass drum, the Tri-Pivot Toe Clamp uses three independently moving contact points to adapt to different hoop shapes, thicknesses and bass drum angles.

  The DW Two-Way bass drum beater features a felt side for warm and focused sound, and a high-impact plastic side recommended for more attack. A DW Single Pedal Bag is also included for convenient and protected transport.
specs: |-
  - Infinite cam adjustment for personalized feel
  - Delta II Ball Bearing Hinge (U.S. Patent No. 5431081) for precise, low-friction movement
  - Tri-Pivot Toe Clamp (U.S. Patent No. 8330032) adapts securely to bass drum hoops
  - Extended Footboard
  - DW 2-Way Beater and Pedal Bag included
