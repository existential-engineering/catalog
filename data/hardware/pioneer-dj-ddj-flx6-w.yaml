details: |-
  4-channel DJ controller for rekordbox and Serato DJ Pro. Captivate your audience with the DDJ-FLX6-W. Packing a host of brand-new features, this 4-channel unit makes it easy to hype up the audience, mix tracks from totally different musical genres, and spice up your sets with pro-sounding scratch effects. Key features: Updated design with a graphite color brings a sophisticated look; Support for VirtualDJ; All-new Merge FX; Jog Cutter: Create pro-sounding scratch effects, one-handed; Full-size jog wheels with track position display; Sample Scratch: Get creative with your favorite sounds; New aesthetic design; Limited-edition striking white finish.
