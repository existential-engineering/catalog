details: |-
  A full aluminium 2x84HP skiff eurorack enclosure, 57mm deep, with aluminium rails of unique design. The case has an integrated Erica Synths PSU capable of 1.25A per rail, 2.5A in total.

  As standard, 65mm deep enclosures come with black horizontal or vertical side panels and two power distribution rails carrying 9 connector sockets each.

  The skiff case can be used with modules up to 45mm deep, so most skiff modules available from leading producers will fit. Exact depth measurements are 55mm, 42mm over the PCB measuring from the cable shroud to the rail, and 33mm over the PSU brick on the right side.

  Dimensions with wooden sides are 461mm x 270mm x 120mm. The case depth itself is 57mm, and the side panels set it at an angle.
specs: |-
  - Integrated Erica Synths PSU capable of 1.25A per rail (2.5A total)
  - Two power distribution rails with 9 connector sockets each
  - Accepts modules up to 45mm deep
  - Case depth 57mm
  - Depth 55mm, 42mm over the PCB (from the cable shroud to the rail), 33mm over the PSU brick on the right side
  - Dimensions with wooden sides 461mmx270mmx120mm
  - Black horizontal or vertical side panels as standard
