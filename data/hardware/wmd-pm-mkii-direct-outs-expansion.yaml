description: A passive expansion module for the PM MKII or Channels MKII that
  provides 4 stereo direct outputs, selectable as pre-fader or post-fader, via
  3.5mm jacks.
details: |-
  Now Shipping! Direct Outs:

  Quite simply, this module will connect via a 2mm ribbon cable to the PM MKII or Channels MKII, and will provide you with Pre or Post fader outs on 3.5mm jacks. Choose Pre or Post depending on which header you connect it to. Module does not require power.
