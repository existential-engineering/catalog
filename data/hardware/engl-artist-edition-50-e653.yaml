description: The Artist Edition 50 E653 is a 50-watt, four-channel, all-valve
  guitar amplifier head based on the Ritchie Blackmore E650, designed in 2005
  for Doug Aldrich and later raised from prototype status to a production ENGL
  model.
details: |-
  The Artist Edition 50 E653 has an unusual history. ENGL built it as a hidden, underground amp for the studios of Los Angeles, taking the Ritchie Blackmore E650 as the starting point and designing it in 2005 for Doug Aldrich. The brief called for a few modifications, among them EL34 valves in the power amp stage, with dynamics and sound as the goal, and a concept of easy handling, practical features and sufficient performance.

  The amp never went into production at the time and ended up in the ENGL showroom in Los Angeles. From there it made the rounds of studios in the city and was played by Jimmy Page, Ken Hammer, Vivian Campbell, Paul Stanley and Scott Gorham. After that response from world-class players, ENGL decided to raise the model from prototype stage to the status of an official ENGL amp.

  Four channels cover Clean, Crunch, Soft Lead and Heavy Lead, each with its own gain control, over a shared 3-band EQ with Lead Presence and Lead Volume. Bright and Shape switches handle further voicing, a tube-buffered FX loop carries a Balance control, and a noise gate and Master A/B round out the feature set.

  The preamp runs four ENGL ECC83 / 12AX7 valves into a pair of ENGL EL34 output valves for 50 watts. Speaker outputs cover 4, 8 and 16 Ohm loads, singly or in parallel pairs, and the S.A.C. serial amp control port plus a dual footswitch jack take the ENGL Z4 and Z9 footswitches.
specs: |-
  - 4 channels: Clean, Crunch, Soft Lead, Heavy Lead
  - All-valve head
  - Valve-buffered FX loop with Balance control
  - Noise gate
  - Master A/B
  - S.A.C. serial amp control
  - Sound options: Bright, Shape
  - Controls: Gain (per channel), 3-band EQ, Lead Presence, Lead Volume, Master A, Master B, FX Loop Balance
  - Power amp output: 1 x 4 Ohm, 1 x 8 Ohm, 1 x 16 Ohm, 2 x 8 Ohm parallel, 2 x 16 Ohm parallel
  - Footswitch support: Z4 and Z9 (channels, Master A/B, Shape, FX loop, noise gate)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 2 x ENGL EL34
  - Output power: 50 W
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 19 kg
