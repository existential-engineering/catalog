description: The Bricasti M20 is a dual-mono, fully differential preamplifier
  featuring a proprietary all-discrete R2R resistor ladder attenuator, three
  independent Class A linear power supplies, and three separately buffered
  analog outputs. Handcrafted in Massachusetts, USA.
specs: |-
  - Dual-mono, fully differential design
  - All-discrete R2R resistor ladder attenuator
  - Three independent Class A linear power supplies
  - Three separately buffered analog outputs (2 balanced XLR, 1 unbalanced RCA)
  - Two balanced XLR inputs, one unbalanced RCA input
  - Trigger output: 1/8-inch TRS
  - Handcrafted in Massachusetts, USA
