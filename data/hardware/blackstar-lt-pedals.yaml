url: https://blackstaramps.com/lt-pedals/
description: Compact, affordable pedals that deliver amazing valve-like tonal performance.
details: |-
  The Blackstar LT Pedals are a range of compact, affordable analog effects pedals designed to deliver valve-like tonal performance. Each pedal features a patent-applied-for clipping circuit that matches the tone and response of Blackstar's valve pedals.

  Most pedals in the range include Blackstar's ISF (Infinite Shape Feature) circuit, giving infinite adjustment over the characteristics of the tone control to move from a USA to a UK voicing and anywhere in between. The pedals also feature buffered bypass and silent switching.

  The series includes five pedals: LT-BOOST, LT-DRIVE (overdrive), LT-DIST (distortion), LT-METAL (high gain distortion), and LT-DUAL (combined overdrive and distortion with two independent channels). All pedals run on 9V PP3 battery or an optional mains adapter and are built with rugged construction for stage use.
specs: |-
  - Patent-applied-for clipping circuit that matches the tone and response of Blackstar's valve pedals
  - ISF (Infinite Shape Feature) control on LT-DIST, LT-METAL and LT-DUAL
  - Buffered bypass and silent switching
  - 9V PP3 battery or optional mains adapter (9VDC)
  - Rugged construction
  - LT-BOOST: Boost pedal, Bass / Treble / Gain controls, 0.45kg, W 60 x H 54.5 x D 122 (mm)
  - LT-DRIVE: Overdrive, Gain / Level / Tone controls, 0.45kg, W 60 x H 54.5 x D 122 (mm)
  - LT-DIST: Distortion, Gain / Level / ISF / Tone controls, 0.45kg, W 60 x H 54.5 x D 122 (mm)
  - LT-METAL: High Gain Distortion, Gain / Level / ISF / Tone controls, 0.45kg, W 60 x H 54.5 x D 122 (mm)
  - LT-DUAL: Overdrive & Distortion, Gain (Ch1 & Ch2) / Level (Ch1 & Ch2) / Tone / ISF controls, 0.6kg, W 90 x H 54.5 x D 122 (mm)
