details: |-
  The BC5000 Bigfoot is Burl Audio's solid-state optical compressor with limiter, positioned as the company's flagship dynamics processor. It breaks from classic optical compressor designs by pairing an optical gain element with modern NextGen analog circuitry that is all class-A, discrete transistor, direct coupled, and fully balanced end-to-end.

  The Bigfoot uses the same input circuit as the BAD4M Mastering Analog input card and the same output circuit as the BDA4M Mastering Analog output card from the Mothership platform.

  Switchable BX1 input and BX5 output transformers allow the engineer to choose the transformer character or bypass them entirely, while a switchable fast FET limiter circuit handles peak transients without pumping. Stepped attenuators for Input, Output, Threshold, Attack, Release, and Ratio controls ensure repeatable settings.

  Practical features include a switchable side-chain low-cut for preserving low-end punch on bass-heavy material, a switchable de-esser for one-button sibilance control on vocals, and a switchable 10 kHz high-frequency boost. Stereo Link is also included for mix bus and mastering use.
specs: |-
  - Solid-state optical compressor with limiter
  - BURL Audio NextGen Analog circuitry — all discrete transistor, class-A, direct coupled
  - Fully balanced circuit path, end-to-end
  - Switchable BX1 input transformer
  - Switchable BX5 output transformer
  - Switchable fast FET limiter circuit
  - Switchable side-chain low-cut filter
  - Switchable de-esser circuit
  - Switchable high-frequency (10 kHz) boost
  - Stereo Link
  - Audiophile stepped attenuators for Input and Output
  - Stepped Threshold, Attack, Release, and Ratio controls
  - Hard bypass
