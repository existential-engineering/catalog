details: |-
  When we designed the BASSWITCH CLASSIC BOOST we had in mind classic passive P, JJ and PJ basses. This compact preamp combines the BASSWITCH IQ DI's boost with a 3-band-eq especially voiced for vintage basses. Additionally the treble control combines a passive high frequencies reduction with an active high frequency boost.

  This can substitute the installation of active electronics in the instrument, collectors or owners of vintage instruments will appreciate this, and your vintage bass will receive a new sonic shine without altering the characteristic sound of your instrument.

  The BASSWITCH CLASSIC BOOST allows gain adjustment of +/-15 dB and can be used as a stand-alone booster, it can be teamed up with the BASSWITCH IQ DI for more options or work as a compact standalone preamp in front of an active monitor or bass cab.

  The approved LEHLE True Sound Technology ensures a great tone: starting from the discrete JFET input stage, up to the switching via gold-plated relais this booster offers a more than studio-standard dynamic range of over 110 dB with very little noise. The extremely robust construction with its protected controls and indestructable switching mechanism will provide many years of joy with classical boosting.
specs: |-
  - Compact preamp and booster voiced for classic passive P, JJ and PJ basses
  - 3-band EQ, with a treble control combining passive high frequency reduction and active high frequency boost
  - Gain adjustment of +/-15 dB
  - LEHLE True Sound Technology with discrete JFET input stage
  - Switching via gold-plated relays
  - Dynamic range of over 110 dB with very little noise
  - Works internally with 18 V
  - Runs on any power supply between 9 and 15 V AC or DC
  - Robust construction with protected controls
