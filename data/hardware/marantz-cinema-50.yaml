name: Cinema 50
manufacturer: marantz
primaryCategory: amplifier
capabilities:
  - equalization
  - crossover
  - spatialization
  - alignment-delay
  - auto-gain
url: https://www.marantz.com/en-us/product/av-receivers/cinema-50/300616.html
prices:
  - amount: 2800
    currency: USD
description: Equipped with the latest immersive audio formats, CINEMA 50 is
  equally ideal for a dedicated home theater space or multi-use living room. Its
  thoughtfully selected connectivity options, flexible speaker arrangement, and
  fine-tuning ability allow you to make CINEMA 50 your own.
details: |-
  Equipped with the latest immersive audio formats, CINEMA 50 is equally ideal for a dedicated home theater space or multi-use living room. Supporting up to 9.4 channels of surround sound at 110 watts per channel with comprehensive 8K HDMI connectivity and advanced system tuning, it delivers flexible performance for dynamic speaker layouts, movies, games, and high-resolution music.

  A modern expression of timeless design principles, CINEMA 50 features the iconic Marantz porthole, symmetrical design, and front panel controls elegantly hidden from view.

  Immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics are legendary hallmarks of Marantz sound, and the Marantz Sound Master tuned CINEMA 50 around proprietary HDAM amplification circuitry.

  Eleven speaker terminals and an 11.4-channel pre-out with four independent subwoofer outputs allow flexible speaker arrangements, while six 8K HDMI inputs and three outputs, phono, two coaxial and two optical digital inputs cover sources.
specs: |-
  - 9 powered channels, 110 W per channel (8 ohm, 20 Hz - 20 kHz, 0.08% THD, 2ch driven)
  - 150 W per channel (6 ohm, 1 kHz, 0.7% THD, 2ch driven), 220 W (6 ohm, 1 kHz, 10% THD, 1ch driven)
  - 11.4 processing channels with 11.4-channel pre-out and four independent subwoofer outputs
  - Class A/B discrete power amplifier with current feedback topology, assignable bi-amp drive
  - Eleven speaker terminals, 4-16 ohm impedance
  - Six 8K HDMI inputs and three HDMI outputs (ARC and eARC), HDCP 2.3
  - Dolby Atmos, DTS:X, Auro-3D and IMAX Enhanced immersive audio formats
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - Dirac Live upgradable
  - HEOS built-in, AirPlay 2, Spotify Connect, Roon tested, Bluetooth with headphone retransmit
  - Multi-room zone pre-out, DC trigger out, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 680 W, standby 0.2 W, weight 29.8 lbs., 17.4 x 15.4 x 6.5 in. without antenna
