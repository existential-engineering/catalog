name: Cinema 50
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/av-receivers/cinema-50/300616.html
description: Premium 9.4 Channel AV Receiver powered by HEOS with Dolby Atmos,
  110W per channel, 8K HDMI connectivity, and 6 HDMI inputs. Equipped with the
  latest immersive audio formats, the Cinema 50 is equally ideal for a dedicated
  home theater space or multi-use living room. Supporting up to 9.4 channels of
  surround sound at 110 watts per channel with comprehensive 8K HDMI
  connectivity and advanced system tuning, it delivers flexible performance for
  dynamic speaker layouts, movies, games, and high-resolution music.
details: |-
  The Cinema 50 is a premium 9.4 channel AV receiver powered by HEOS with Dolby Atmos, delivering 110W per channel and offering 8K HDMI connectivity with 6 HDMI inputs. Equipped with the latest immersive audio formats, Cinema 50 is equally ideal for a dedicated home theater space or multi-use living room. Supporting up to 9.4 channels of surround sound at 110 watts per channel with comprehensive 8K HDMI connectivity and advanced system tuning, it delivers flexible performance for dynamic speaker layouts, movies, games, and high-resolution music.

  The receiver features artisanal Marantz design with a metal front panel and signature OLED porthole display. It supports Dolby Atmos, Dolby Atmos Music, Dolby Atmos Height Virtualization, DTS:X, DTS Neural:X, DTS Virtual:X, IMAX Enhanced, Auro-3D, 360 Reality Audio, and MPEG H. Up to 11.4 channels of processing are available with pre-amp outputs, and the unit can be Dirac Live upgraded for advanced room correction in addition to the built-in Audyssey MultEQ XT32.

  HDMI connectivity includes 6 8K inputs and 3 outputs (including Zone 2 HDMI Out) with HDCP 2.3, supporting 8K/60Hz, 4K/120Hz, ARC/eARC, HDR10+, Dolby Vision, Dynamic HDR, ALLM, VRR, and QFT for gaming. Streaming and network features include HEOS multi-room, AirPlay 2, Spotify Connect, TIDAL, Amazon Music HD, Deezer, Roon tested compatibility, Wi-Fi, Ethernet, and Bluetooth with re-transmit for headphones. Backed by a 5-year warranty.
specs: |-
  - 9.4 channel AV receiver with 11.4 channel processing
  - 110W per channel (8 ohm, 20Hz-20kHz, 0.08% THD, 2ch driven)
  - 150W per channel (6 ohm, 1kHz, 0.7% THD, 2ch driven)
  - 220W per channel (6 ohm, 1kHz, 10% THD, 1ch driven)
  - Class A/B amplifier topology
  - Discrete power amplifier with current feedback
  - Bi-amp drive assignable
  - Dolby Atmos, Dolby Atmos Music, Dolby Atmos Height Virtualization, Dolby TrueHD, Dolby Surround
  - DTS:X, DTS HD Master, DTS Neural:X, DTS Virtual:X
  - IMAX Enhanced, Auro-3D, 360 Reality Audio, MPEG H, Multichannel Stereo
  - 6 HDMI inputs (all 8K), 3 HDMI outputs
  - HDCP 2.3 support
  - 8K/60Hz and 4K/120Hz maximum resolution
  - ARC and eARC support
  - HDR10, HDR10+, HLG, Dolby Vision, Dynamic HDR
  - ALLM, Variable Refresh Rate (VRR), Quick Frame Transport (QFT)
  - CEC support
  - DSD audio over HDMI
  - 5 analog inputs
  - Phono (MM) input
  - 2 optical digital inputs
  - 2 coaxial digital inputs
  - 11.4 multichannel preamp outputs
  - 4 independent subwoofer outputs
  - 11 speaker terminals
  - Audyssey MultEQ XT32 room correction
  - Audyssey Dynamic EQ, Dynamic Volume, and LFC
  - Dirac Live upgradability
  - Variable crossover, optimized bass redirection, bass sync
  - MP3, WMA, AAC, FLAC, WAV, ALAC (192kHz/24-bit) playback
  - DSD 2.8MHz and 5.6MHz playback
  - Gapless playback (FLAC, WAV, ALAC, DSD)
  - MDAX2 compressed audio enhancement
  - HEOS multi-room built-in
  - AirPlay 2, Spotify Connect, TuneIn, Pandora, SiriusXM
  - Amazon Music HD, TIDAL, Deezer, iHeart Radio, Napster, SoundCloud, Mood Mix
  - Roon tested
  - Wi-Fi and Ethernet connectivity
  - Bluetooth with re-transmit for headphones
  - Voice assistant compatible (Alexa, Google Assistant, Apple HomePod)
  - Marantz AVR Remote App and HEOS app control
  - 2 multi-room zones
  - IP / RS-232 / Web / App control
  - OLED front display porthole
  - Metal front panel
  - Available in Black or Silver-Gold
  - Dimensions: 17.4 in W x 15.9 in D x 6.5 in H (without antenna)
  - Weight: 29.8 lbs
  - Power consumption: 680W operational, 60W (ECO on), 100W (ECO off)
  - Standby power: 0.2W
  - Includes RC049SR remote, Audyssey microphone with stand, 2 detachable antennas, AC power cord, wire labels, quick start guide
  - 5 year warranty
