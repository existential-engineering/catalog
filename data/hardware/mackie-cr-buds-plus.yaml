details: |-
  Utilizing decades of experience designing gear for the world's top artists, Mackie created earphones that present your favorite music with stunning detail and warmth that remain faithful to the artist's studio sound. Available in two models, the CR-Buds and the dual driver CR-Buds+, CR-Buds Series earphones are designed for maximum comfort and rich full-range audio with signature Mackie style.

  Pro Form Factor

  With an over-ear design, these offer an ultra-secure fit that will stay put even with some serious headbanging. With three different sizes of silicone and foam ear tips included, you can choose what works best for your ears for maximum comfort, sound isolation, and bass response.

  Dual Precision Drivers

  Featuring dual dynamic drivers, CR-Buds+ earphones offer incredible depth and a wide soundstage for a true reference quality sound while providing incredibly punchy low-frequency response.

  Answer Calls and Control Your Music

  An in-line microphone with call answer control, play/pause music control and device volume controls is fitted to the cable. A soft case is included to keep the CR-Buds+ protected when traveling.
specs: |-
  - Sensitivity: 93 dB
  - Impedance: 8 ohms
  - Frequency range: 20Hz - 20kHz
  - Cable length: 51 in. / 130 cm
  - Color: Mackie Black
  - Driver type: Dual Dynamic
  - Over-ear cable routing for a secure fit
  - Three sizes of silicone and foam ear tips included
  - In-line microphone with call answer, play/pause and device volume controls
  - Soft carry case included
