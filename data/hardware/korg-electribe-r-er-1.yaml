description: >-
  The Korg ElecTribe R is an analog modeling beat machine that combines
  synthesis-based drum sound generation with a built-in step sequencer for
  real-time rhythm creation. Its ten voice parts and dedicated knobs for pitch,
  modulation, and waveform shaping encourage hands-on sound design and live
  performance. Motion sequencing records parameter changes in real time,
  bringing evolving timbral movement to drum patterns.
details: |-
  The ElecTribe R brought analog-style drum synthesis into a compact, affordable tabletop format when it debuted in 1999. Korg marketed it as "the ultimate analog beat machine," and its design philosophy centers on direct, tactile control over every element of the sound.

  The unit features ten voice parts: four synthesizer parts for crafting custom percussion sounds from oscillator waveforms, two audio input parts for processing external signals, two hi-hat parts, one crash cymbal part, and one hand clap part. This multitimbral architecture provides a well-rounded percussive toolkit that goes beyond sample playback.

  The interface centers around dedicated knobs for pitch, modulation depth, and waveform shaping, encouraging real-time sound manipulation during performance. A 16-pad step sequencer with illuminated keys makes rhythm programming intuitive, while 12 assignable trigger pads offer immediate playability for live use.

  Motion sequencing is one of the ER-1's most distinctive features, allowing performers to record the real-time movement of any oscillator, amp, or effect parameter as a motion sequence. This brings dynamic sound changes as patterns progress, without requiring external automation. The built-in delay effect adds spatial depth with normal, motion sequence, and tempo-synced modes.

  The ER-1 stores 256 patterns with up to 64 steps per part and supports 16 songs with up to 256 patterns per song and 35,700 maximum events. Its straightforward design and distinctive sound made it a staple for electronic producers, earning adoption by artists including Orbital, The Prodigy, Massive Attack, The Chemical Brothers, Cirrus, Dan Hekate, and the Crystal Method.
specs: |-
  - Polyphony: 10 voices
  - Parts: 10 (4 synthesizer, 2 audio in, 2 hi-hat, 1 crash cymbal, 1 hand clap)
  - Sequencer: 256 patterns (64 steps max per part), 16 songs
  - Motion Sequence: 1 parameter per part, 64 events
  - Song Capacity: 256 patterns max per song, 35,700 events max
  - Effects: Delay (normal, motion sequence, tempo delay)
  - Keyboard: 16 touch pads
  - Control: MIDI In/Out
