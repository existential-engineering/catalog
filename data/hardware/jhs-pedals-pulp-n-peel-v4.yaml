details: |-
  COMPRESSOR / PREAMP / DI BOX

  The Pulp 'N' Peel V4 is the truly transparent compressor pedal you've been dreaming of. Its smooth-sounding parallel compression circuit offers you the power to blend in your ideal balance of compressed and uncompressed signal. You're able to add a touch of grit to your tone thanks to the pedal's Dirt mini toggle. Also, whether you're a bassist sending your signal direct or a guitarist running the Pulp 'N' Peel on your pedalboard, the pedal's 1/4", balanced XLR outputs have you covered. This compressor/preamp pedal sports a ton of tone-shaping power, so no matter what your compression needs are, the Pulp 'N' Peel V4 is your go-to solution.

  THE EXACT COMPRESSION YOU'VE BEEN WAITING FOR
  We know how much effort you put into getting your tone exactly right. That's why we worked so hard to ensure the Pulp 'N' Peel V4 maintains your instrument's natural attack, has a very low noise floor, and adds a professional polish to every chord, lead line, and note from your amplifier.

  WARM STUDIO-STYLE GRIT TO HELP YOU CUT THROUGH
  Whether you're looking to warm up your sound in the studio or want to add some grind for the stage, flip the Dirt mini toggle and you're there.

  ONSTAGE, IN THE STUDIO, OR ANYWHERE ELSE
  No matter what electric instrument you play, we've outfitted the Pulp 'N' Peel compressor/preamp pedal with enough connectivity options to make it your go-to compressor in the studio, on your pedalboard, at home, or anywhere else.

  VERSION HISTORY:
  V1 = Only two knobs; no logo; extremely rare.
  V2 = Three controls; softer orange color; older orange slice logo.
  V3 = Three controls; includes LBB via internal dip switch.
  V4 = (2016) Four controls; added EQ knob, Dirt Toggle, and XLR output.
  V4 = (2020 update) Buffer switch removed; buffered bypass soft-touch switching added.
