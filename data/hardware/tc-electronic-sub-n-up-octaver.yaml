details: |-
  Pitch Prodigy

  SUB ‘N’ UP OCTAVER is the new leader of the pitch-pack. Featuring our superb next generation octave-engine and individual blend controls for dry, octave-up and two sub-octaves, SUB ‘N’ UP is set to deliver flawless octave tones whether you’re playing complex chords or groovy single-note lines. And with the option of adding modulation to the mix via our high-powered TonePrint editor, for spacey ambient octaves, SUB ‘N’ UP OCTAVER truly is the definition of pitch perfection.    •    Next generation octave engine - For flawless polyphonic tracking    •    Cool old-school monophonic octaver    •    TonePrint-engine with modulation - for otherworldly octave tones

  Polyphonic Epiphany

  SUB ‘N’ UP features the latest in polyphonic pitch technology. This means you get lightning-fast note tracking and impeccable hi-fi octave tones when playing chords. So whether you’re into shimmery octave-up tones for swells, a sweet 12-string ring or down and dirty subsonic octave riffs, SUB ‘N’ UP OCTAVER will deliver the goods every single time!

  Old-School is Always Cool
