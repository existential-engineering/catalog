description: The DN50 is a two-channel spring reverberation system introduced by
  Klark Teknik in the mid-1970s, just before digital reverb rendered most spring
  units obsolete. It survives in studio inventories because the dense, complex
  tail of a six-spring tank is hard to emulate convincingly with a digital
  algorithm.
details: |-
  The DN50 is a two-channel spring reverb from the mid-1970s, arriving just before digital reverb displaced most spring units. Engineers return to it because the dense, complex, non-digital tail of a six-spring tank is difficult for a contemporary digital algorithm to reproduce.

  Each of the two independent channels drives a six-spring tank that vibrates and resonates with the input signal, producing the modal density characteristic of spring reverberation. The pair can be used as a true stereo set or as two independent mono effects sends.

  Each channel carries input and output trim controls, a dry/wet mixer for the reverb-to-direct balance, and a two-band shelving EQ for shaping the tail tonally. XLR and 1/4-inch inputs and outputs allow integration with mixing console aux sends or insert points.

  Typical use is vintage studio work on snare, vocals, guitar and electromechanical keyboards where the character of a Klark Teknik spring tank is the effect being sought. It is also used in dub and experimental electronic production for the percussive clang of the springs themselves.
specs: |-
  - Two independent channels with a six-spring tank per channel
  - Input and output trim per channel
  - Dry/wet mix control per channel
  - Two-band shelving EQ per channel
  - XLR and 1/4-inch input and output
  - Manufactured in England
