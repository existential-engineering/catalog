description: A 300-watt mini bass head weighing just under 2.5kg (7lbs),
  combining power, portability, and tonal versatility. At its heart is a 5-band
  EQ (bass, middle, treble plus hi-mid and lo-mid) with a Shape control for
  further sculpting. A front-facing effects loop and XLR DI output keep the
  signal clean and manageable, while the rear panel carries a headphone out for
  silent practice and multiple speaker outputs for versatile rig configurations.
  A rugged design with scuff-proof paint and a steel and alloy chassis, backed
  by a 5-year warranty, auto-protect voltage, and an adaptive
  temperature-controlled fan.
details: |-
  300W mini bass head, under 2.5kg (7lbs). 5-band EQ (bass, lo-mid, middle, hi-mid, treble) plus Shape control. Front-facing effects loop and XLR DI output. Rear: headphone out and multiple speaker outputs. Steel & alloy chassis, scuff-proof paint, 5-year warranty, auto-protect voltage, temperature-controlled fan.
specs: |-
  - Power output: 300 watts
  - EQ: 5-band (bass, lo-mid, middle, hi-mid, treble)
  - Shape control
  - Front-facing effects loop
  - XLR DI output
  - Headphone output (rear)
  - Multiple speaker outputs (rear)
  - Weight: under 2.5 kg / 7 lbs
  - Steel & alloy chassis; 5-year warranty; auto-protect voltage; temperature-controlled fan
