  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid American Alder with sound chambers
  - Top: flat
  - Dimensions: 41 x 32.5 cm / 16.14" x 12.6"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream
  - Pickguard: Black
  - Finish: PUR lacquer. Back and sides Trans-Black.
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tremolo: Duesenberg Diamond Deluxe Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 010/050 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Bag: Duesenberg Custom Line Bag (included)
  - Case: Duesenberg Custom Line Case for Caribou (available separately)
  - Tools: All required allen keys (included)
