description: The Caribou is totally different. Made for artists seeking the exceptional.
details: |-
  The Caribou is a chambered instrument: a solid American alder body into which extra large sound chambers are routed, which Duesenberg describes as giving a direct yet open voice sitting between a solid and a semi-hollow construction, with the chambers also reducing weight. The body is fitted with a flat maple top on the Narvik Blue and Black options and classic swamp ash on the Butterscotch version, with cream binding around the body, a Duesenberg Cat-Eye f-hole, a black pickguard and a PUR lacquer finish with trans-black back and sides.

  The neck is a set one-piece maple neck in a Medium D shape, measuring 42.5 mm at the nut and 52 mm at the 12th fret, with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets and a 648 mm / 25.5 inch scale length. A steel dual-action truss rod runs through the neck and the headstock is finished black. Duesenberg's Plek process levels the frets as the basis for hand fret polishing and setup work.

  The pickup set pairs a Duesenberg Domino P90 at the neck with a GrandVintage humbucker at the bridge. The middle position of the heavy duty three-way switch uses a special wiring that filters certain low-end frequencies out of the humbucker signal for a more open, funky voice. Duesenberg uses German silver for the pickup baseplate and cover, on the grounds that it is the one material that does not affect the frequencies the pickup transmits, and winds the coil slowly with insulated wire from an old German copper wire factory to imitate hand winding. Controls are one volume, one tone and the three-way selector.

  Hardware is nickel finished and comprises Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and the short version of the Diamond Deluxe Tremola vibrato, whose arm can be rotated freely through 360 degrees and adjusted for angle and length, with needle and nylon bearings carrying the action.

  A Duesenberg Custom Line Bag is included, with internal high impact padding, a black plush lining, external storage pockets, an adjustable neck pillow and shoulder straps that tuck away so the bag can be carried like a case. A Duesenberg Custom Line Case for Caribou is available separately, and all required allen keys are included.
