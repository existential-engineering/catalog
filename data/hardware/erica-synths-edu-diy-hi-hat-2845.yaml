description: Iconic hi-hat sound.
details: |-
  Synthesized, analog hi-hats are fascinating, because emulating any kind of cymbal with an analog circuit is tough: the sound a real cymbal produces is not quite pure noise, but not really harmonic either.

  A couple of classic drum machines, the Roland TR-606 and TR-808 among them, took their best shot at it with strange-sounding results that have since become iconic in electronic music. The mki x es.edu DIY Hi-Hats follows suit, continuing the percussion-focused second season of educational DIY kits with a TR-808 inspired circuit.

  Manual Tune, Decay and Tone controls shape the voice, Tune and Decay are CV controlled, and an accent input adds dynamics. CV span is -5V to +5V and accent triggers above +2.5V.

  Erica Synths and Moritz Klein developed the mki x es.EDU series of educational DIY kits with one specific goal in mind: to teach people with little to no prior experience how to design analog synthesizer circuits from scratch. The kit takes the builder through the circuit design process step by step, explaining every choice that was made and how it affects the finished module.

  The panel is 8HP wide, the module is 30mm deep, and power draw is 7mA on each of the +12V and -12V rails.
specs: |-
  - TR-808 inspired circuit
  - Manual Tune, Decay and Tone controls
  - CV controlled Tune and Decay
  - Accent input
  - CV span (full range) -5V to +5V
  - Accent >+2.5V
  - Module width 8HP
  - Module depth 30mm
  - Power consumption 7mA@+12V, 7mA@-12V
