id: tpUoZNFvJr7sMSJWyTQWS
name: MP-800U
manufacturer: tascam
primaryCategory: rack-mount
categories:
  - digital
url: https://tascam.com/us/product/mp-800u
description: 1U rackmount SD/USB media player with USB DAC and FM tuner.
  Supports WAV, MP3, and AAC playback from SD cards and USB flash drives.
  Features balanced XLR and unbalanced RCA outputs with a dedicated tuner output
  pair, pitch control, auto cue, and fade in/out. Bluetooth streaming available
  via optional AK-BT2 adapter. Compatible with Q-SYS platform (in development).
  Suited for installed audio environments such as restaurants, hotels, and
  entertainment venues.
details: |-
  1U rackmount media player. Supports SD/SDHC/SDXC cards and USB flash drives (512MB–512GB; FAT16, FAT32, exFAT). Playback formats: WAV, MP3, AAC at 44.1/48kHz, max 4GB file size, up to 999 files across 16 folder levels. Pitch control ±16%. Built-in FM tuner 87.5–108.0MHz with dedicated RCA tuner output pair. Bluetooth streaming via optional AK-BT2 adapter (not built-in). Auto cue, auto-ready, fade-in/fade-out. Separate level controls for main and tuner outputs. Q-SYS compatibility under development.
specs: |-
  - - Dimensions: 482.8(W) x 46.5(H) x 297.1(D) mm; Weight: 2.7 kg
  - Power: AC 100–240V 50/60Hz, 14W
  - Operating temperature: 0–40°C
  - Frequency response: 20Hz–20kHz (+0.5/–1.0dB)
  - THD+N: 0.005% or less; S/N ratio: 95dB or higher; Dynamic range: 95dB or higher
  - XLR balanced output: +4dBu rated / +20dBu max
  - RCA unbalanced output: –10dBV rated / +6dBV max
  - Headphone output: 20mW+20mW at 6.3mm stereo
  - USB Type-A: USB 2.0 High Speed
  - USB Type-C: USB 2.0 Audio Class 2.0
