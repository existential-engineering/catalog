description: The Wolfgang® WG Standard T.O.M boasts the same style and massive
  sound Eddie Van Halen created - at a price the everyday musician can afford.
  Offering many of the blazing features as its more expensive brethren, the
  Wolfgang WG Standard T.O.M has a natural bound basswood body with special
  'comfort cut' forearm contour for maximum playing ease. Its bolt-on baked
  maple neck with graphite-reinforcement rods holds strong against the ravages
  of temperature and humidity, while a conveniently located spoke wheel at the
  base of the neck makes for quick and painless truss rod adjustments. Designed
  for comfortable playability and speed, the Wolfgang WG Standard also features
  an oiled finish on the back of the neck and a 12"-16" compound radius baked
  maple fingerboard with rolled edges, 22 jumbo frets and black dot inlays. Dual
  EVH® Wolfgang humbucking pickups mounted directly to the body increase
  vibration transfer, resulting in sustain for days on end. The black speed tone
  and volume control knobs have been dialed-in to Van Halen's exacting
  specifications - the smooth-feeling 500k pots make it easy to find a unique
  sound while retaining the crisp high-end sparkle of the Wolfgang pickups. Now
  featuring a fixed bridge and stoptail bar!
