details: |-
  The ES-6 is the counterpart to the Expert Sleepers ES-3 Lightpipe/CV Interface, offering up to eight channels of CV input with output over an optical lightpipe connection. As with the ES-3, the ES-6 also works well for audio signals, with conversion quality on a par with a regular audio interface.

  The ES-6 itself has six input sockets, and the remaining two channels are provided by an expansion module such as the ES-7. A connected ES-3 or ES-8 is required for operation, because the ES-6 takes its clock signals from the ES-3, which derives them from its lightpipe input, or from the ES-8, which has an internal clock.

  The inputs are 3.5mm jacks, DC-coupled, with an input voltage range of plus or minus 10V and an input impedance of 100k. The digital output follows the ADAT Lightpipe standard, and a header on the module takes the connection to an expansion module such as the ES-7.

  November 2022 saw the launch of the ES-6 mk3. In other respects identical to the mk2, it adds jumpers on the PCB that allow DC coupling to be enabled or disabled for each stereo pair of inputs, along with enhanced audio performance. The ES-6 mk2, from February 2017, was functionally equivalent to the original and added illuminated jack sockets while using less HP and less depth.
specs: |-
  - Panel width: 4HP
  - Module depth: 50mm
  - Sync input: connection from ES-3 or ES-8 module
  - Analogue inputs: 6x 3.5mm jacks, DC-coupled
  - Input voltage range: plus or minus 10V
  - Input impedance: 100k
  - Digital output: optical, ADAT Lightpipe standard
  - Expansion: header for connecting expansion modules, for example the ES-7
  - Current draw: 182mA on the +12V rail, 53mA on the -12V rail
