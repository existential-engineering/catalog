details: |-
  The DN726 is a dual-channel digital delay line offering over 1.3 seconds of signal delay per channel, configured for stereo and dual-mono operation. It carries the signal-path principles of the DN700 series across two independent channels, for stereo programme delay, dual-zone PA timing and broadcast applications that need matched stereo delay paths.

  Each of the two channels offers more than 1.3 seconds of delay, set independently per channel. The channels can be used as a true stereo pair tracking a single delay value, or as two independent mono delays serving different destinations from a single rack unit.

  Typical applications are stereo programme delay for broadcast, dual-zone PA timing, stereo creative delay effects on tracking dates and front-of-house inserts where stereo image integrity matters.
specs: |-
  - Two-channel digital delay line
  - More than 1.3 seconds of delay per channel
  - Independent or linked stereo operation
  - Balanced input and output
  - 1U rackmount
  - Designed and built in the United Kingdom
