description: LT-TB is a two-port Thunderbolt LSlot interface card for Lynx
  Aurora and Hilo converters. It supports daisy-chaining Aurora and Hilo
  converters and any other certified Thunderbolt device on both Apple and
  Windows computers.
details: |-
  Lynx Studio Technology created the LT-TB Thunderbolt LSlot interface for its Aurora and Hilo converters. The LT-TB is a two-port Thunderbolt expansion card that supports daisy-chaining Aurora and Hilo converters and any other certified Thunderbolt device on both Apple and Windows computers. The LT-TB and the accompanying Aurora and Hilo models were the first Thunderbolt audio devices certified for Windows as well as Mac.

  The LT-TB LSlot card can be installed into any existing Hilo or Aurora with an easy and free firmware update. Lynx also made Thunderbolt equipped models available at the same time: Hilo-TB in black and silver, Aurora(n) 32-TB, Aurora(n) 24-TB, Aurora(n) 16-TB, Aurora(n) 8-TB, Aurora 16-TB and Aurora 8-TB.

  The LT-TB, in development for over a year, uses Intel's Cactus Ridge second-generation Thunderbolt controller, which allows for a more robust design electrically. Similar to other Lynx products, LT-TB incorporates an FPGA for audio mixing and control functions that can be easily updated in the field. Months of in-house testing along with support from Apple and Intel assure that LT-TB works well with any other certified Thunderbolt product on the market.

  Whereas some earlier Thunderbolt equipped converters are limited to two units and 32 analog channels, the LT-TB can be used in a chain of up to 6 Aurora converters for up to 96 analog channels, plus 96 digital channels on one Thunderbolt port. The Thunderbolt protocol allows up to six devices and one display on a single Thunderbolt port, so external drives, displays and expansion chassis can share the chain with Lynx converters. The LT-TB's two Thunderbolt ports are what allow that daisy chaining.

  Like other Thunderbolt devices, the LT-TB can be plugged, unplugged and hot-plugged, so an additional Aurora, Hilo or other Thunderbolt device can be brought in without reinstalling drivers or resetting anything.
specs: |-
  - Thunderbolt LSlot interface card for Lynx Aurora and Hilo converters
  - Two Thunderbolt ports for daisy-chaining converters and other certified Thunderbolt devices
  - Certified for both Windows and Mac
  - Uses Intel Cactus Ridge second-generation Thunderbolt controller
  - Incorporates an FPGA for audio mixing and control functions that can be updated in the field
  - Supports a chain of up to 6 Aurora converters for up to 96 analog channels plus 96 digital channels on one Thunderbolt port
  - Thunderbolt allows up to six devices and one display on a single port
  - Thunderbolt runs at 10 Gbps in each direction simultaneously, twice the speed of USB 3.0
  - Hot-pluggable, with no driver reinstallation when devices are added
  - Installs into any existing Aurora or Hilo with a free firmware update
  - Factory-fitted models offered alongside the card: Hilo-TB (black and silver), Aurora(n) 32-TB, Aurora(n) 24-TB, Aurora(n) 16-TB, Aurora(n) 8-TB, Aurora 16-TB, Aurora 8-TB
  - Powered by the Aurora or Hilo LSlot bay it is installed in, with no power connector of its own
  - No longer available; replaced by the LT-TB3 for the Aurora(n) and Hilo
