description: Made out of metal and real wood, NiftyCASE gives you 84hp, just
  enough room to put together an interesting mix of modules while staying
  completely portable, with built-in MIDI to CV/gate/clock conversion.
details: |-
  It's difficult to have a modular system without having a case to put modules into. Made out of metal and real wood, NiftyCASE gives you 84hp, just enough room to put together an interesting mix of modules while staying completely portable.

  MIDI to CV, gate, clock, and mod conversion is built into the case. NiftyCASE accepts MIDI from a computer via USB or from any 5-pin DIN MIDI device and converts it into Eurorack-compatible CV, gate, mod, and clock signals for sequencing from a DAW or jamming with controllers.

  Built-in power saves space for more modules. Up to 10 modules can be plugged into NiftyCASE's 10-gang flying bus, which provides a peak of 1500mA of +12V, 500mA of -12V, and 500mA of +5V, covering standard Eurorack power requirements.

  The included switching power supply comes with interchangeable blades for NA, EU, UK, and AU outlets.
specs: |-
  - Usable case area: 84hp
  - Internal depth: 55mm
  - Dimensions: 6.8cm x 44.6cm x 18.6cm
  - Weight: 1.8kg
  - Power output +12V: 1500mA peak
  - Power output -12V: 500mA peak
  - Power output +5V: 500mA peak
  - Audio output: 1/4" TS mono (rear)
  - MIDI in: USB and 5-pin DIN
  - MIDI thru: 5-pin DIN and USB
  - Module capacity: up to 10 modules
  - Construction: metal and real wood
  - Included: switching power supply with NA/EU/UK/AU blades
