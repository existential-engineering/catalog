description: "The Soft Focus Reverb is a shoegaze-focused reverb pedal inspired
  by the Yamaha FX500's 'Soft Focus' patch widely used by '90s bands like
  Slowdive. It features a modified plate reverb split into three signal paths:
  one with chorus modulation, one with octave-up effects, and one with clean
  reverb."
details: |-
  The Soft Focus Reverb draws inspiration from the Soft Focus patch on the Yamaha FX500, used by early shoegaze bands in the '90s. The reverb signal is split into three paths: chorus-modulated, octave-up, and clean reverb — blending all three produces the characteristic lush, washy sound.

  Features buffer and trails bypass modes. Recommended placement in signal chain after modulation effects. No battery operation supported. Power accepts 9-18V DC center-negative, minimum 100mA.
