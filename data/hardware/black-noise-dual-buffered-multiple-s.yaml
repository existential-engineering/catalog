  or single channel buffered multiples.
details: |-
  DBM-S is the simplest yet ultimate 1U solution to distribute incoming signals to up to 8 destinations without signal loss, distortion, or interference. DBM-S clever design provides you maximum flexibility, use it a dual channel to create 4 buffered copies of 2 signals or as single channel and get up to 8 buffered copies of the same signal ! Build with high-quality components for low noise and high accuracy, DBM-S create perfect copies of the original signal even for pitch CV. After all, quality isn't just a feature, it's our commitment. W e believe that f orm must follows function, but great design blends them seamlessly. With our black and gold signature, DBM-S is not just a high quality utility, it's a part of a system where each part contributes to the overall strength and quality of this system.
