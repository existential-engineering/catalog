description: A lightweight 300-watt bass combo delivering Ashdown tone through
  two 10" speakers while weighing just 14.5kg (32lbs). A comprehensive 5-band EQ
  makes dialling in tone easy, and a front-facing FX loop, XLR DI output, and
  headphone out add modern convenience. Its kickback design works either as a
  floor monitor or in standard vertical position, with tough carpet covering and
  a steel grille completing the package.
details: |-
  300W bass combo, 2x10" speakers, 14.5kg (32lbs). Kickback (wedge) cabinet usable as a floor monitor. 5-band EQ. Front-facing FX loop, XLR DI output, headphone out. Carpet covering and steel grille.
specs: |-
  - Power output: 300 watts
  - Speakers: 2 x 10"
  - Weight: 14.5 kg / 32 lbs
  - EQ: 5-band
  - Front-facing FX loop
  - XLR DI output
  - Headphone output
  - Kickback (wedge) cabinet
  - Carpet covering, steel grille
