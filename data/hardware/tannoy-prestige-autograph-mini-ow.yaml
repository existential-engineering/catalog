details: |-
  The Prestige Autograph Mini-OW is a 2-way stand-mount 4" Dual Concentric HiFi loudspeaker with handcrafted oiled walnut veneered cabinet and solid walnut trim. Features a 4" Dual Concentric driver with Omnimagnet configuration: 200-watt LF woofer paired with 19 mm titanium dome HF driver co-axially aligned via Tulip Waveguide for point-source imaging. Custom-engineered internal crossover with Tannoy capacitors, low-loss laminated core inductors, and wirewound resistors. Non-parallel enclosure with rear-firing reflex port. Frequency response: 106 Hz-20 kHz (±3 dB).
specs: |-
  - configuration: 2-way stand-mount
  - driver: 4" Dual Concentric with Omnimagnet
  - lfDriver: 200 W 4" woofer
  - hfDriver: 19 mm titanium dome
  - frequencyResponse: 106 Hz - 20 kHz (±3 dB)
  - frequencyResponseExtended: 60 Hz - 20 kHz (-10 dB)
