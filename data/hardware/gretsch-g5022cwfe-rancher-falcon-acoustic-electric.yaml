details: |-
  Gretsch Rancher acoustics are back and better than ever! The G5022CWFE Rancher Falcon Jumbo gives you full-bodied jumbo tone with full-on Gretsch Falcon style, sparkling gilded appointments and onboard electronics for peerless amplified tone.

  Features a solid spruce top with scalloped X-bracing and classic Rancher triangular sound hole, maple sides and arched back, mahogany neck with premium appointments including gold-sparkle binding and Neo-Classic thumbnail inlays.
