url: https://ashdownmusic.com/products/eb-180-head
description: The EB180H is an affordable Electric Blue bass amp head with a 180
  watt RMS fan-cooled, fast-transient power stage and a fully-featured preamp
  with inputs for both active and passive instruments. It offers an illuminated
  VU meter, a 5-band EQ with Bright and Deep switches, a front-panel balanced DI
  output, an FX loop, a tuner/line output and the classic Ashdown sub-harmonic
  generator.
details: |-
  The EB180H is part of the Electric Blue range, loading Ashdown tone into an affordable bass amp head. It uses a 180 watt RMS fan-cooled, fast-transient power stage and a fully-featured bass preamplifier with inputs for both active and passive instruments. Features include an illuminated VU meter, a 5-band EQ with Bright and Deep switches, a front-panel-mounted balanced DI output for connection to a PA or recording console, an FX loop, a tuner/line output and the classic Ashdown sub-harmonic generator. The minimum speaker load is 4 ohms.
specs: |-
  - Power output: 180 watts RMS
  - Power requirement: 115-230V
  - Speaker outputs: minimum impedance 4 ohms
  - Frequency response: -3dB at 33Hz and 25kHz
  - High instrument input: 3.9M ohms, 150mV - 20V p-p
  - Low instrument input: 10k ohms, 300mV - 40V p-p
  - Line input: 22k ohms, 0dBu nominal
  - Tuner output: 22k ohms, 0dBu nominal
  - DI output: 600 ohms balanced, -20dBu nominal
  - Signal to noise: better than 80dB (EQ flat)
  - EQ: Bass +/-15dB at 100Hz, Lo Mid +/-15dB at 220Hz, Middle +/-15dB at 660Hz, Hi Mid +/-15dB at 1.6kHz, Treble +/-15dB at 7kHz
  - Effects send: 22k ohm, 0dBu nominal
  - Effects return: 22k ohm, 0dBu nominal
  - Distortion: less than 0.5% THD
  - Illuminated VU meter
  - Sub-harmonic generator
  - Dimensions (H x W x D): 158 x 610 x 355 mm
  - Weight: 28 kg
