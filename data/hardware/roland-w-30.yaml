description: >-
  The Roland W-30 is a self-contained music workstation released in 1988 that combines the
  S-550 sampler engine with the MRC sequencer and a 61-key aftertouch-sensitive keyboard. It
  features 16-voice polyphony, 8-part multitimbrality, a 16-track phrase sequencer, and a
  built-in 3.5-inch floppy disk drive with optional SCSI expansion. The W-30 is compatible
  with Roland S-330, S-550, and S-50 sound libraries.
details: |-
  Released in 1988, the Roland W-30 was one of the very first self-contained music workstations, combining sampling, sequencing, and keyboard performance in a single instrument. Roland essentially merged their S-550 sampler engine with their MRC sequencer and added a full-size keyboard, creating a complete production tool that was groundbreaking for its time.

  The W-30 offers 512Kword of RAM, providing just over 14 seconds of sampling at 30kHz sample rate with 16-bit sample depth. It includes 512Kword of non-rewritable ROM, supports 32 RAM-using tones and 64 ROM-using tones, and stores 16 patches. Compatibility with Roland S-330, S-550, and S-50 sound libraries gives users access to extensive existing sample collections.

  The instrument operates in three main modes: Performance mode for playing the keyboard, Sequencer mode for recording data into the 16-track phrase sequencer, and Sound mode for editing patches, tones, and other parameters. Navigation is handled through an 8x40 character backlit blue LCD screen with two infinite rotary dials and five soft buttons, offering a more capable interface than the one or two line displays common at the time.

  Storage is provided via a built-in 3.5-inch floppy disk drive, with an optional KW30 SCSI kit that transforms the W-30 into a SCSI Master device capable of driving compatible hard drives and CD-ROM players up to 80MB. Connectivity includes MIDI In/Out/Thru, footswitch and footpedal inputs, mono headphone output, and a mono sample input with gain control. Notable users include Liam Howlett of The Prodigy, who used the W-30 extensively on all their early tracks and kept it as his master keyboard on-stage until 2008.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 8 parts
  - Sampler: 16-bit, 15kHz/30kHz sample rate
  - RAM: 512Kword (14 seconds at 30kHz)
  - ROM: 512Kword non-rewritable
  - Tones: 32 RAM-using, 64 ROM-using
  - Patches: 16
  - LFO: 1 (sine, peak-hold waveforms with delay, polarity, sync)
  - Sequencer: 16-track phrase sequencer
  - Songs: 20 internal, 64 max on song disk
  - Keyboard: 61 keys with aftertouch
  - Storage: Built-in 3.5-inch floppy disk drive, optional KW30 SCSI kit (80MB max)
  - Display: 8x40 character backlit blue LCD
  - Control: MIDI In/Out/Thru
  - Date Produced: 1988
releaseDate: "1988"
