description: The R20 MultiTrak is a 16-track recorder operated from a 4.3-inch full-colour touchscreen, with eight mic preamps, per-track 3-band EQ and Comp/Limiter/Gate, an MFX processor running up to three effects, a 150-loop rhythm track and an 8-voice FM synth track. Over USB-C it also works as an 8-in/4-out audio interface and a Mackie Control surface.
details: |-
  The R20 MultiTrak is a 16-track recorder driven from a 4.3-inch full-colour touchscreen, with a DAW-inspired layout where regions are dragged, dropped, pinched and swiped. Cut, copy, combine and loop operations all happen on the screen, and colour-coded faders, gain dials and track regions keep each channel identifiable.

  Eight mic preamps feed the recorder: inputs 1 and 2 are XLR/TRS combo jacks for mics, keyboards, guitars and basses, with a Hi-Z switch on input 1 for a passive-pickup instrument, and inputs 3 to 8 are XLR. Phantom power at +48 V is available on inputs 5 to 8, switched in pairs. Eight tracks record at once and sixteen play back, at 44.1 kHz in 16-bit or 24-bit BWF-compliant WAV, direct to an SDHC or SDXC card of up to 1 TB.

  Each track carries a 3-band EQ with shelving high and low bands and a peaking middle band, monitor panning, a stereo link to the adjacent track, a Comp/Limiter/Gate stage and a send-effect level. A full MFX processor runs up to three effects at a time, either as an insert on one channel or as a send available to every track, with fifty patch memories. The free Guitar Lab application for Mac and Windows adds effects distributed online and edits and backs up those memories.

  A rhythm track holds 150 PCM drum loops across 30 genres with song-form variations, and a synth track runs an 8-voice FM engine with 18 sound types plus a PCM drum kit, played from a USB MIDI keyboard or entered on the touchscreen. Standard MIDI files can be imported as bass lines, melodies or piano parts. A fully adjustable metronome covers 3/4, 4/4 and 6/8 from 40 to 250 BPM with per-output volume, and the tuner offers chromatic, guitar, bass and five open tunings.

  Over USB-C the R20 is an 8-in/4-out audio interface in multitrack mode or 2-in/2-out in stereo mode, for PC, Mac and iOS, and a Mackie Control surface that drives a DAW from the faders and transport keys. The same port imports and exports projects from a USB flash drive and connects a USB MIDI keyboard, supplying 5 V at 500 mA as a host. A REMOTE jack takes the optional BTA-1 Bluetooth adapter for the R20 Control app on iPad, which includes VoiceOver and VoiceOver Gestures support for visually impaired users. USB bus power is not supported, so the unit runs from the supplied ZAD-1220 locking 12 V adapter.
specs: |-
  - Record up to 16 tracks, 8 simultaneously
  - Inputs: 8 mono MIC/LINE. Outputs: 1 MASTER OUT, 1 PHONES
  - Input connectors: 2 XLR/TRS combo jacks plus 6 XLR jacks (XLR: 2 HOT, TRS: TIP HOT)
  - Input gain: +6 to +50 dB
  - Input impedance: XLR 3.9 kOhm. TRS 5.3 kOhm, or 1 MOhm with Hi-Z on, INPUT 1 only
  - Maximum input level: +4 dBu at 0 dBFS
  - Phantom power: +48 V on INPUTS 5 to 8, switchable in pairs
  - Equivalent input noise: -121 dBu or less (IHF-A) at +50 dB / 150 Ohm input
  - Frequency response: -1.0 dB, 20 Hz to 20 kHz
  - MASTER OUT: 2 TRS phone jacks (balanced), maximum output level +14 dBu, output impedance 200 Ohm
  - PHONES: 1 standard stereo phone jack, maximum output level 20 mW + 20 mW into a 32 Ohm load, output impedance 33 Ohm
  - Maximum simultaneous recording tracks: 8, maximum simultaneous playback tracks: 16
  - Recording format: 44.1 kHz, 16/24-bit, mono or stereo WAV, BWF-compliant
  - Recording media: 4 to 32 GB SDHC cards and 64 GB to 1 TB SDXC cards
  - Track settings: pan, EQ, send effect, stereo link, Comp/Limiter/Gate
  - Track EQ: High 10 kHz shelving plus or minus 12 dB, Middle 2.5 kHz peaking plus or minus 12 dB, Low 100 Hz shelving plus or minus 12 dB
  - Effects: up to 3 simultaneous, as one insert effect on one channel or one send effect available to all tracks. 50 patch memories. Compatible with Guitar Lab for Mac and Windows
  - Tuner: Chromatic, Guitar, Bass, Open A, Open D, Open E, Open G, DADGAD
  - Metronome: 3/4, 4/4 and 6/8 time signatures, tempo 40.0 to 250.0 BPM, volume adjustable per output
  - Rhythm loops: PCM, 150 loops across 30 genres with song form variations
  - Synth: FM sound source, 8-voice polyphony, 18 sound types plus a PCM drum kit. Standard MIDI files can be imported
  - Display: 4.3-inch 480 x 272 full-colour touchscreen LCD with pinch zoom
  - USB connector: USB Type-C, requires a cable that supports data transfer. USB bus power is NOT supported
  - Audio interface: stereo mix 2 in / 2 out at USB 2.0 Full Speed, or multitrack 8 in / 4 out at USB 2.0 High Speed, 44.1 kHz, 16/24-bit
  - USB mass storage: host or device, USB 2.0 High Speed, supplying 5 V at 500 mA when host
  - Guitar Lab connection, USB MIDI keyboard connection and DAW control surface all over USB 1.1 Full Speed. The MIDI keyboard connection supplies 5 V at 500 mA
  - Control surface uses the Mackie Control protocol
  - REMOTE: dedicated wireless adapter (ZOOM BTA-1), sold separately
  - Power: ZOOM ZAD-1220 locking AC adapter, 12 V / 2.0 A
  - Power consumption: 11 W maximum
  - Dimensions: 378 mm (W) x 206 mm (D) x 58 mm (H)
  - Weight, unit only: 1.33 kg
  - In the box: R20, ZAD-1220 AC adapter, Quick Tour
  - Bit depth is set when a project is created and cannot be changed afterwards
