description: Erica Synths Pico Trigger to Gate module is one of the few modules
  around that converts triggers to gates using smart algorithms that enhance
  your musical compositions and rhythm patterns.
details: |-
  The Erica Synths Pico Trigger to Gate module converts triggers into gates, one of few modules to do so, using algorithms meant to serve a composition rather than simply stretch a pulse.

  That turns a simple trigger sequencer into a musical pattern generator. The creation of the module was inspired by the compositions of Ryoji Ikeda.

  Gate length is set manually or by control voltage, and so is the probability that a gate is skipped altogether, which is where the rhythmic variation comes from. The module runs in a triggered mode or in an independent mode.

  Incoming triggers are expected at 0V to +5V, tolerating up to +10V, with a minimum length of 1ms, and output gates run 0V to +5V. LEDs indicate the incoming trigger and the output gate. The panel is 3HP wide and the module is 35mm deep.
specs: |-
  - Manually and CV controlled gate length
  - Manually and CV controlled gate skipping probability
  - Triggered and Independent modes
  - Incoming trigger in and output gate control LEDs
  - Incoming trigger amplitude 0V to +5V (max +10V)
  - Min incoming trigger length 1ms
  - Output gate amplitude 0V to +5V
  - Power consumption +14mA, -9mA
  - Module width 3HP
  - Module depth 35mm
