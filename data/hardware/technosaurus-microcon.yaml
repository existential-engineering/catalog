description: >-
  The Microcon is a modern analog monophonic synthesizer module created by Swiss company
  Technosaurus, emulating classic Roland TB-303 and SH-101 designs. It features handmade
  discrete circuits in a compact format slightly smaller than the original TB-303. The
  Microcon II variant adds MIDI functionality for contemporary performance control.
details: |-
  The Microcon represents a continuation of Technosaurus's philosophy, known primarily for their high-end Selector modular synthesizers. This instrument brings classic analog bass synthesis to a compact, affordable format while maintaining the build quality associated with the Swiss manufacturer.

  The original Microcon provides CV/Gate control exclusively, making it suitable for modular setups or control via external sequencers. The Microcon II enhancement introduced MIDI IN connectivity, transforming the instrument into a more accessible performance tool. Beyond basic note triggering, MIDI control extends to parameter manipulation including accent, cutoff frequency, and glide functions.

  The architecture emphasizes simplicity and sonic character over complexity. A single VCO with switchable waveforms forms the foundation, complemented by a sub-oscillator for enhanced low-end presence. The filter design offers flexibility beyond the original TB-303 and SH-101, with selectable pole configurations.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth or square waveforms) + 1 sub-oscillator
  - LFO: 1 with square or triangle waveforms for VCF and VCO modulation
  - Filter: Switchable lowpass VCF (12dB/octave or 24dB/octave) with resonance
  - Envelope: AD or ADR with manual trigger button
  - VCA: 1 with AD or gate control
  - Keyboard: None (control module only)
  - Memory: None
  - Control: CV/Gate inputs (Microcon), MIDI IN with CV/Gate outputs and VCF CV input (Microcon II)
  - Additional Features: Glide effect, sub-oscillator mixing
