details: |-
  The Dirty Little Secret Deluxe represents the next logical step in Catalinbread's Marshall Plexi emulation lineage, expanding on the original DLS with a complete amp-in-a-box architecture. The circuit includes a preamp stage, phase inverter, power amp simulation, and output transformer for an extremely authentic take on the classic Marshall Plexi sound.

  A key addition over the original is the built-in footswitchable boost circuit modeled after a Marshall preamp stage. An internal effect-order switch lets players choose between Boost into DLS or DLS into Boost, allowing for dramatic tonal differences and flexible gain staging options.

  The Super Lead/Super Bass toggle switch replicates the character difference between Marshall's two classic Plexi configurations. The externalized Presence knob and Tightness control for bass attenuation give players deeper control over the amp voicing than was possible with the original DLS.

  A dedicated Line Out jack on the rear panel provides a +10dB output suitable for feeding directly into a mixer, audio interface, or DAW, making the DLS Deluxe equally capable as a recording tool and a live stage pedal.
