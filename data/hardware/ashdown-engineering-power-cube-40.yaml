url: https://ashdownmusic.com/products/power-cube-40
description: The Ashdown Acoustic Power Cube Wood is a portable, lightweight
  40-watt powered extension monitor. Handbuilt in the UK Custom Shop with a
  stained wood cabinet, it features a single Volume control and a custom Italian
  Sica 1 x 5" speaker with tweeter. It can amplify any acoustic instrument with
  an onboard preamp, pair with the Ashdown Preamp pedal for a compact acoustic
  setup, or link as a slave to the Ashdown Acoustic Cube 40 combo for an 80-watt
  stereo rig.
details: |-
  40-watt powered acoustic extension cube with a single Volume control, handbuilt in the Ashdown UK Custom Shop with a stained wood cabinet. Loaded with a custom Italian Sica 1 x 5" speaker and tweeter, it weighs just 3.4kg and includes a carry strap. It can amplify any acoustic instrument with an onboard preamp, work alongside the Ashdown Preamp pedal for a compact controllable acoustic setup, link as a slave to the Ashdown Acoustic Cube 40 combo for an 80-watt stereo acoustic setup, or amplify instruments such as keyboards where no tone shaping is required.
specs: |-
  - Power output: 40 watts
  - Power requirement: 115/230V
  - Speaker configuration: 1 x 5" custom Italian Sica speaker with tweeter
  - Frequency response: -3dB at 52Hz and 28kHz
  - High instrument input (Chan 1, active): impedance 10k Ohms, input range 300mV - 20V p-p
  - Low instrument input (Chan 1, passive): impedance 3.9M Ohms, input range 150mV - 10V p-p
  - Line output: impedance 4.7k Ohms, level 0dBu
  - DI output: 600 Ohms balanced, level -20dBu
  - Signal to noise: greater than 70dB (EQ flat)
  - Notch filter: notch frequency 70 to 350Hz, 'Q' = 5
  - EQ: Bass +/-15dB @ 100Hz, Treble +/-15dB @ 10kHz
  - Distortion: less than 0.8% THD
  - Dimensions (H x W x D): 230 x 230 x 230 mm
  - Weight: 3.4kg
  - Carry strap included
