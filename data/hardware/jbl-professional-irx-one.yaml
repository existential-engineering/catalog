details: |-
  The IRX ONE is a portable all-in-one column PA system built around concert line array-inspired directivity control. Its custom-tuned, C-shaped array houses six 2" high-frequency drivers that deliver rich clarity, a wide sweet spot, and seamless front-to-back coverage. The advanced 8" woofer uses a bass-reflex design to extend low-frequency response down to 40 Hz.

  The integrated 3-channel mixer supports the most popular connections: XLR and 1/4" inputs with 48V phantom power and a 1/4" balanced mix-out. dbx Automatic Feedback Suppression (AFS), five EQ presets, Soundcraft Easy Ducking (which automatically lowers music when speech is detected), and Bluetooth 5.0 audio streaming provide a professional front-of-house experience without external gear.

  The IRX ONE is designed for effortless portability — it can be carried with one hand, sets up and tears down in seconds, and features an ergonomically-optimized carry handle to minimize wrist strain. Column spacers and the array cabinet store inside the back of the base unit, keeping the system self-contained.

  The system automatically adjusts its tuning depending on how many spacers are deployed, optimizing sound performance for the room size. Bluetooth 5.0 ensures premium audio quality and long-distance wireless streaming.

  Built for durability, the IRX ONE has passed JBL's rigorous 100-hour stress test and is backed by a three-year warranty. It is suited for educators, presenters, hospitality, house of worship, musicians, buskers, and singer/songwriters.
specs: |-
  - Frequency response: 40 Hz – 20 kHz
  - High-frequency array: C-shaped array of six 2" tweeters
  - Woofer: 8" with bass-reflex design
  - Mixer: 3-channel built-in
  - Inputs: XLR and 1/4" (with 48V phantom power)
  - Mix output: 1/4" balanced
  - Feedback suppression: dbx Automatic Feedback Suppression (AFS)
  - EQ presets: 5 system tuning presets
  - Ducking: Soundcraft Easy Ducking (speech detection)
  - Wireless: Bluetooth 5.0
  - Self-adjusting tuning per spacer deployment
  - Warranty: 3 years
