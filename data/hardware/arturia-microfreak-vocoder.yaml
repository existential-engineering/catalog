description: A 16-band vocoder with accessible real-time voicing controls. A
  detachable gooseneck microphone. A slick new aesthetic. MicroFreak Vocoder
  Edition takes unhinged hybrid carnage and cranks it up a notch - sing to the
  tune of pandemonium and lose control.
details: |-
  Accurate replication of the human voice via 16 frequency bands, and an easy-to-use gooseneck microphone for comfortable, instant vocoding. Combine the vocoder mode with microfreak's wild features and manipulate your sound like never before. Sequence vocal melodies, modulate voice parameters with the lfo, and much more.

  Process external instruments and sounds through the vocoder mode for unique formant textures - simply connect to the headphone input via 3.5mm trrs. A gooseneck design means quick position adjustment, with easy connection straight into the headphone socket. The fitting also allows you to connect headphones at the same time. The utility menu lets you set your preferred mic gain and noise gate settings.

  We've created an entirely new mode to harness the vocoder's 16-band power. The vocoder engine features 3 waveforms - sawtooth, pulse width and noise - while the timbre and shape knobs adjust the 16 frequency bands to twist and transform your voice. 16 new presets give you instant access to android translations, crystalline harmonies and vibrant formant sequences galore.

  Behind the revamped appearance and microphone attachment is the same lovable maniac that set the synth world spinning. Sparkling digital and wavetable oscillators collide with velvety analog filters. A unique poly-aftertouch pcb keyboard combines with a distinctly freaky arpeggiator & sequencer. Bathe your mix in sonic hysterics with the erratic mod matrix or the unique spice & dice randomizers.
specs: |-
  - 16-band vocoder
  - Detachable gooseneck microphone
  - 21 digital oscillator modes
  - Wavetable oscillators
  - Sample playback
  - Granular processing
  - Mutable instruments engines
  - Noise engineering engines
  - Vocoder mode
  - Analog state variable filter
  - 12db/octave resonant filter
  - Low pass filter
  - Band pass filter
  - High pass filter
  - Scale quantize
  - Poly-aftertouch pcb keyboard
  - Arpeggiator
  - Up mode
  - Order mode
  - Random mode
  - Pattern mode
  - Spice & dice randomizers
  - Mod matrix
  - LFO
  - 3.5mm trrs headphone input
  - 512 preset slots
  - 320 factory presets
  - 16 vocoder presets
  - 3 waveforms (sawtooth, pulse width, noise)
  - Timbre knob
  - Shape knob
  - Mic gain control
  - Noise gate settings
  - Tremolo effect
  - Formant synthesis
  - Paraphonic harmonies
  - Firmware v2.1 update
  - Firmware v3 update
