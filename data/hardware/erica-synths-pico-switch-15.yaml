description: Erica Synths Pico Switch is designed for simple audio (several
  VCOs) or cv signal (sequencers, EGs, LFOs) routing.
details: |-
  Erica Synths Pico Switch handles simple routing of audio, from several VCOs, or of control voltages, from sequencers, envelope generators and LFOs.

  Routing is bidirectional. A switch selects which of three inputs is connected to the output, or, used the other way round, routes one input to one of three outputs.

  The module is entirely passive and consumes no power, so it needs no connection to the case bus board at all.

  It belongs to the Pico Series, the brief Erica Synths set itself to fit superior synth functionality into a narrow panel at an affordable price.
specs: |-
  - Passive module, consumes no power
  - Bidirectional routing: three inputs to one output, or one input to three outputs
