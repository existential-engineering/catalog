url: https://www.neumann.com/en-us/products/microphones/kk-145--km-a
description: The combination of the capsule KK 145 with the output stage KM A is
  only one of the numerous options within the Neumann KM A/D small diaphragm
  microphone system.
details: |-
  Directional characteristic: cardioid with acoustic bass roll-off in free field

  Part of the modular microphone system KM A/D

  Comprehensive range of accessories

  Modular small diaphragm capsule with analog output stage

  Pressure gradient transducer with cardioid characteristic (similar to KK 184) but with acoustic bass roll-off in the free field

  Suppresses LF interference (wind, structure-borne noise)

  Optimized for a flat frequency response at a recording distance of approximately 15 cm („speech cardioid“)

  Switchable -10 dB preattenuation allows SPL up to 152 dB (depending on capsule)

  Transformerless analog output stage operating on P48 phantom power

  Capsule may be detached up to 100 m (330 ft) from output stage via special cable

  Output stage dimensions: 22 mm diameter, 93 mm length

  Available in nickel or Nextel black (nx)
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional  Pattern: Cardioid low frequ. roll-off
  - Frequency  Range: 20 Hz...20 kHz
  - Sensitivity at 1 k Hz into 1 kohm: 14 mV/Pa
  - Rated  Impedance: 50 ohms
  - Rated load impedance: 1000 ohms
  - Equivalent noise level,  C C I R: 22 dB
  - Equivalent noise level,  A-weighted: 14 dB-A
  - Maximum  S P L for  T H D 0.5%: 138 dB
  - Maximum  S P L for  T H D 0.5% with preattenuation: 148 dB
  - Signal-to-noise ratio,  C C I R (re. 94 d B  S P L): 70 dB
  - Signal-to-noise ratio,  A-weighted (re. 94 d B  S P L): 80 dB
  - Supply voltage ( P48,  I E C 61938): 48 V
  - Current consumption ( P48,  I E C 61938): max. 3.5 mA
  - Matching connector: XLR 3 F
  - Weight (output stage): 70 g
  - Weight (capsule only): 15 g
  - Diameter: 22 mm
  - Length (capsule only): 18 mm
  - Length (microphone): 108 mm
