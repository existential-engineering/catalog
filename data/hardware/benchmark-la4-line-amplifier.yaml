description: The LA4 is a fully-balanced, line-level preamplifier featuring
  relay-controlled volume and input selection with exceptionally low noise and
  distortion across 256 volume control settings. It offers extended bandwidth,
  linear phase response, and a 135 dB unweighted signal-to-noise ratio.
details: |-
  The Benchmark LA4 is a fully-balanced, line-level stereo preamplifier that employs relay-controlled switching for both volume attenuation and input selection. With 256 discrete steps spanning +15 dB to -127.5 dB in 0.5 dB increments, the volume control uses high-precision laser-trimmed resistors and make-before-break relay timing to eliminate switching noise.

  The LA4 achieves an unweighted signal-to-noise ratio greater than 135 dB and total harmonic distortion below -125 dB (0.00006%) when driven from balanced inputs at +24 dBu. Output impedance is 60 ohms, maximum output is 20 Vrms (+28 dBu), and output noise is under 1.9 µV at unity gain.

  Analog connectivity includes two balanced XLR stereo input pairs, two unbalanced RCA stereo input pairs, balanced XLR stereo outputs, a balanced XLR mono sum output, and unbalanced RCA stereo outputs. Two 3.5mm TRS ports provide bidirectional 12V trigger integration for home theater automation.

  Front panel controls include a color touch-screen display, optical encoder volume knob, and IR remote sensor. Per-input gain offset adjustments, a -20 dB Dim function, balance control, and Home Theater bypass mode are available. The LA4 is offered in Standard or Rackmount faceplate configurations and in silver or black finishes.
specs: |-
  - THD: < -125 dB (0.00006%) — balanced inputs at +24 dBu
  - Signal-to-Noise Ratio: > 135 dB unweighted, > 137 dB A-weighted
  - Frequency Response: 0.1 Hz to 500 kHz (-3 dB bandwidth)
  - Output Impedance: 60 Ohms
  - Output Noise: < 1.9 µV at unity gain
  - Maximum Input/Output: 20 Vrms (+28 dBu)
  - Crosstalk: < -133 dB @ 1 kHz
  - Volume control range: +15 dB to -127.5 dB in 0.5 dB steps (256 positions)
  - Inputs: 2x balanced XLR stereo pairs, 2x unbalanced RCA stereo pairs
  - Outputs: balanced XLR stereo + mono sum, unbalanced RCA stereo
  - 12V trigger: 2x 3.5mm TRS (bidirectional)
  - Power consumption: 12W typical, 17W maximum, 0.33W standby
  - Auto-ranging universal power supply (50-60 Hz)
  - Dimensions: 8.65"W × 3.88"H × 8.33"D (with feet)
  - Weight: 8.0 lbs
  - Available in Standard or Rackmount faceplate; Silver or Black finish
