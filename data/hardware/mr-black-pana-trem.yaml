description: A true-stereo harmonic-tremolo and panner with fully independent
  left and right paths, a tonally rich pre-amp per channel, tap-tempo, preset
  save/recall and assignable expression control.
details: |-
  The Pana-Trem is a true-stereo harmonic-tremolo and panner with two fully independent left and right audio paths, each carrying its own especially sweet, tonally rich "Sweet'ner" pre-amp. It offers both standard and panning modes: a Pulser mode for conventional pulsing tremolo and a Panner mode for ping-pong movement across the stereo field.

  A Shift control blends between tuned standard tremolo and harmonic vibrato, plus every shade in between, so the pedal covers a wide range of throb, wobble and vibrato-like textures. A pulsing LED tracks the tremolo speed.

  Presets are easy to store and recall: press Save to store a setting, then activate or deactivate it by holding the Tap-Tempo / Preset footswitch. Any standard expression pedal can be assigned to any or all control knobs on the fly by connecting it to the EXP jack and turning the desired control up to the blue dot. A new soft-touch tap-tempo footswitch extends the LFO out to a 30-second period, and the 2026 revision adds brighter LEDs and soft-touch footswitches.

  It runs on standard 9VDC pedalboard power (daisy-chain friendly, ~69mA draw). Because it is a true-stereo device, it provides independent left and right ins and outs along with a combined TAP/EXP jack.
specs: |-
  - True-stereo circuit with two fully independent audio paths
  - Specially tuned "Sweet'ner" pre-amp on each channel
  - Pulser (standard) and Panner (ping-pong) tremolo modes
  - Shift control blends standard tremolo and harmonic vibrato
  - Pulsing LED tremolo-speed indicator
  - Preset save/recall via Save button and Tap-Tempo/Preset footswitch
  - Assignable expression control (any/all knobs) via EXP jack
  - Soft-touch tap-tempo extends LFO to a 30-second period
  - TAP input uses a normally-open momentary switch (tip-to-sleeve, 1/4" patch cable)
  - Compact design (3.7" x 4.7")
  - 9VDC pedalboard/daisy-chain power (~69mA draw)
  - 2026 revision: brighter LEDs, soft-touch footswitches
