id: GKJrZ1lm-ExXOO3d6xEK1
name: Model 50
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/amplifiers/model50/300855.html
description: Premium integrated stereo amplifier with 70W per channel and custom
  HDAM circuitry. Engineered with Marantz proprietary technologies and a Class
  A/B amplifier section, Model 50 reveals the musicality in all your stereo
  source components. Includes a built-in MM phono stage and stereo preamp
  outputs for system flexibility.
details: |-
  Premium integrated stereo amplifier engineered to be thoroughly modern, yet timeless, with artisanal design inspired by Marantz icons of the past.

  Precisely engineered Class A/B amplifier section delivers 70 watts per channel into 8 ohms (100W into 4 ohms) to drive loudspeakers with authority while revealing fine musical detail.

  Custom HDAM (Hybrid Discrete Amplification Module) circuitry using SA3 and SA2 versions, meticulously tuned by the Marantz Sound Master for the Most Musical Sound.

  Built-in MM phono stage uses a new circuit without distortion-inducing coupling capacitors to amplify nuance and tone from your turntable.

  Stereo preamp outputs (including a subwoofer pre-out) add flexibility for 2.2-channel system configurations and external power amplifiers.

  Toroidal power transformer, linear drive power supply, symmetric PCB layout, aluminium extrusion heat sink, and triple bottom plate construction reduce noise and vibration.

  Low-noise OLED display, Source Direct mode, and Power Amp Direct mode preserve signal integrity.

  Artisanal cabinet available in Black and Silver-Gold finishes; backed by a 5-Year Warranty.
specs: |-
  - Channels: 2.2
  - Amplifier Class: A/B
  - Power Output (8 ohm RMS): 70W per channel
  - Power Output (4 ohm RMS): 100W per channel
  - Frequency Response: 5 Hz - 100 kHz
  - Total Harmonic Distortion: 0.02%
  - Damping Factor: 100
  - Input Sensitivity (MM): 1.4 mV / 47 kOhm
  - Signal-to-Noise Ratio (MM): 87 dB
  - Input Sensitivity (High Level): 185 mV / 16 kOhm
  - Signal-to-Noise Ratio (High Level): 116 dB (2V input)
  - Input Sensitivity (Power Amp Direct In): 1.5V / 15 kOhm
  - Signal-to-Noise Ratio (Power Amp Direct In): 125 dB
  - Treble Control: +/-10 dB at 15 kHz
  - Bass Control: +/-10 dB at 50 Hz
  - HDAM Versions: SA3, SA2
  - Power Transformer: Toroidal
  - Speaker Terminals: Marantz SPKT-1+ (4 terminals, Speaker A/B)
  - Audio Inputs: 6 (including Phono MM)
  - Power Consumption: 220W (Standby: 0.3W)
  - Dimensions (W x D x H): 442 x 431 x 130 mm
  - Weight: 14.2 kg
  - Available Colors: Black, Silver-Gold
  - Warranty: 5 Years
