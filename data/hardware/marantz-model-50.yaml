details: |-
  MODEL 50 was designed and engineered to be thoroughly modern, yet timeless. Engineered with Marantz proprietary technologies, this integrated amplifier pushes the boundaries of audio equipment design to reveal the musicality in all your stereo source components.

  Hallmark aesthetic cues like symmetry, warmth, and tactile satisfaction push the boundaries of audio equipment design inspired by icons of the Marantz past.

  With a precisely engineered Class A/B amplifier, MODEL 50 will drive your loudspeakers with authority yet reveal details you never knew existed. The Marantz Sound Master meticulously tuned MODEL 50 for amazing performance with careful parts selection.

  The built-in MM phono stage works with your turntable to amplify the nuance and tone in your records, using a new circuit without distortion-inducing coupling capacitors.

  MODEL 50's stereo preamp outputs add flexibility to the system setup, allowing a subwoofer, extra home-theater channels or additional listening zones to be connected.
specs: |-
  - 2 channels, Class A/B, current feedback topology
  - Power output: 70 W (8 ohm RMS) / 100 W (4 ohm RMS)
  - Frequency response: 5 Hz to 100 kHz
  - THD 0.02%
  - damping factor 100
  - HDAM version SA3, SA2
  - toroidal power transformer
  - Phono EQ: Marantz Musical
  - phono input MM
  - Input sensitivity MM: 1.4 mV / 47 kohm
  - S/N ratio MM: 87 dB
  - Input sensitivity high level: 185 mV / 16 kohm
  - S/N ratio: 116 dB (2 V input)
  - Input sensitivity Power Amp Direct In: 1.5 V / 15 kohm
  - S/N ratio: 125 dB
  - 6 audio inputs
  - 1 audio output
  - pre-out plus subwoofer
  - Power Amp Direct In
  - No digital inputs (USB-B, optical, coaxial and USB-A all absent)
  - Speaker terminals: Marantz SPKT-1+, 4 terminals, Speaker A / B
  - Treble control: plus/minus 10 dB at 15 kHz
  - bass control: plus/minus 10 dB at 50 Hz
  - Linear drive power supply, linear volume control, Schottky diodes
  - Source Direct and Power Amp Direct modes
  - low noise OLED display
  - Available colors: Black, Silver-Gold
  - metal front panel
  - Power consumption: 220 W
  - standby: 0.3 W
  - detachable power cable
  - Remote control: RC003PMND
  - Dimensions (W x D x H): 442 x 431 x 130 mm
  - weight: 14.2 kg
