description: Programm is a sequencing powerhouse. It houses a massive set of
  sequencing and performance tools in a tiny little enclosure. Step, play,
  generate and more all with speed and joy.
details: |-
  We've spent years testing every synth sequencer under the sun. We loved the speed of some and the randomness of others, but we hated having to choose. So, we built Programm. It's a creative playground that bridges the gap between human performance and algorithmic generation.

  Total Versatility: step it in, play it in, or let the machine take the lead. Programm is bilingual, speaking both MIDI and/or CV. With six orange knobs, players can tweak the main parameters per step with speed and without menu diving.

  Programm is a standalone 12-channel MIDI and CV sequencer that works with both MIDI and Eurorack synthesizers. It combines 4 monophonic melodic sequencers (2 of which have dedicated analog pitch, CV, and gate outputs) with 8 drum sequencers, all of which have their own dedicated gate outputs. It can be used standalone in its included case, or removed from the case and used as a 40hp Eurorack format module.

  Designed for most applications, Programm is well equipped with ample I/O. It connects to MIDI gear or synths that use CV/Gate with ease, and every sequencer channel can talk both MIDI and CV. Programm can clock or be clocked, in and/or out, via both CV and MIDI.
specs: |-
  - Standalone 12-channel MIDI and CV sequencer works with both MIDI and Eurorack synthesizers
  - 4 monophonic melodic sequencers with MIDI (2 with dedicated analog pitch, CV, and gate outputs)
  - 8 drum sequencers, all with dedicated gate outputs
  - Dedicated parameter controls for pitch, gate length, ratcheting, CV/CC, note offset, and step conditions
  - Customizable randomization of all parameters by step and/or by sequencer
  - Sequence lengths up to 64 steps, independently settable per sequence
  - 32-step grid functions as step programmer in step mode, grid keyboard in live mode, and dynamic information display
  - Save up to 64 patterns and 32 songs
  - Key and scale selection
  - 6 groove modes
  - 4 customizable pattern generator algorithms
  - Assignable chance CV input, mappable to any of six parameters on one or all sequencers
  - Supports external MIDI controllers for programming sequences
  - 4 melodic sequencer modes: mono, chord, arp, chip (chord + arp)
  - Standalone dimensions: 207mm x 138mm x 61mm, includes case
  - Eurorack module format: 40hp width, 25mm depth
  - Eurorack power draw: 120mA on +12V rail, 40mA on -12V rail
  - Reversed power polarity protection
  - Included in box: Programm unit, quickstart guide, 3.5mm to 5-pin (Type A) MIDI DIN pigtail, wall-wart power supply
