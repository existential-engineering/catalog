description: Excalibus is a skiff friendly compact power supply and bus.
  Specially designed for medium portable systems.
details: |-
  Excalibus is a compact Eurorack power supply and bus board designed specifically for skiff cases and portable medium-sized systems. It strikes a balance between space efficiency, power delivery, and stability, making it well-suited for musicians and modular synthesizer users who need a reliable power solution in a compact form factor.

  The module provides regulated +12V, -12V, and +5V rails to power a full Eurorack system. With 1.25A on both the positive and negative 12V rails and 350mA on the 5V rail, it is capable of powering a substantial number of modules in a medium-sized case.

  Input power is supplied via a 2.5mm barrel connector, accepting a wide input voltage range of 9–18V DC at a recommended 45W adapter. The horizontal bus connector orientation is specifically designed to optimize the available depth inside shallow skiff enclosures.

  A physical on/off button is included on the board, providing convenient power control without requiring a separate switch. The overall dimensions of 50mm × 400mm × 12mm make it suitable for integration into a variety of case designs.

  Excalibus is available as a DIY kit and is designed, kitted, and assembled in Barcelona by the Befaco team.
