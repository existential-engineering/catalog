id: QK8C84Y4dD3tR84C93e93
name: VTX A12
manufacturer: jbl-professional
primaryCategory: speaker
url: https://jblpro.com/en-US/products/vtx-a12
description: >-
  Next-generation dual 12-inch line array loudspeaker for mid- to large-size
  touring and fixed installations, featuring 90-degree horizontal dispersion,
  new JBL transducer technology, and a patented rigging mechanism for rapid
  deployment.
details: |-
  The JBL VTX A12 is a complete tour sound solution built to address the unique challenges of rental companies, FOH engineers, and tour sound production crews. Next-generation JBL transducer technology and a high-frequency waveguide design deliver unmatched performance, sensitivity, and 90-degree horizontal coverage. The innovative HF section integrates the phasing plug and waveguide for high sensitivity and linearity at high output levels.

  The LF section features industry-defining Differential Drive woofers with a dual magnet, dual voice-coil design for extended linear excursion, paired with four JBL 2165H 5.5-inch midrange drivers and three JBL 2423K 2-inch annular diaphragm compression drivers. The redesigned Radiation Boundary Integrator (RBI) reduces horn edge diffraction, improves LF sensitivity, lowers distortion, and maintains 90-degree coverage down to 250 Hz.

  A best-in-class patented rigging mechanism and redesigned suspension system streamline deployment with rapid-deployment capability. The enclosure supports eleven inter-enclosure angle options ranging from 0.25° to 10°, accommodating a wide range of throw distances and audience coverage configurations.

  The enclosure is constructed from Finnish birch plywood with Black DuraFlex finish and high-grade steel rigging hardware with anti-corrosion coating, captive suspension plates, quick-release pins, and auto-locking mechanisms. System amplification is Crown Audio I-Tech HD. The VTX A12 integrates fully with JBL Performance Manager 3 and Venue Synthesis prediction software.
specs: |-
  - Frequency Range (-10dB): 46 Hz – 19 kHz
  - Horizontal Coverage (-6 dB): 90° nominal (250 Hz – 18 kHz)
  - Max SPL: 146 dB
  - System Amplification: Crown Audio I-Tech HD
  - Nominal Impedance: LF: 2x 8Ω | MF: 8Ω | HF: 8Ω
  - LF Driver: (2) JBL 2264H 12-inch Neodymium Differential Drive woofer
  - MF Driver: (4) JBL 2165H 5.5-inch Neodymium Differential Drive woofer
  - HF Driver: (3) JBL 2423K 2-inch annular diaphragm compression driver
  - Inter-enclosure Angle Options: 0.25° – 10° (11 positions)
  - Enclosure: Finnish birch plywood, Black DuraFlex finish
  - Dimensions (H×W×D): 330 × 1118 × 495 mm (13 × 44 × 19.5 in)
  - Net Weight: 60.8 kg (134 lbs)
