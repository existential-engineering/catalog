details: |-
  A Custom Shop germanium edition of the Red Dirt Overdrive Pro, offered as a limited run under the GE-808 name. It is described as a blend of the hot sounds of the Red Dirt Germanium and the full, bold voicing of the Red Dirt Professional Limited Edition.

  The GE-808 carries the parallel gain branches of the Red Dirt Germanium, which the maker credits for a large gain response and the fullest Tube Screamer style voicing in the line, and it combines that with the clipping LEDs used on the Red Dirt Pro models for a fatter, more tube-like tone.

  The Red Dirt line began as a search for a classic drive sound with more versatility for a wider range of playing styles. A Keeley-designed FET input stage gives the pedal a tube-like breakup, with dynamics and clarity enough to cut through a dense mix while keeping a full midrange. Units are hand-built in the USA with premium components.
