id: G6mrY-NPk63HZem_tkrLk
name: CD 50n
manufacturer: marantz
primaryCategory: outboard
url: https://www.marantz.com/en-us/product/cd-sacd-players/cd-50n/300856.html
description: Amazing digital audio experiences come from a surprising number of
  sources. Play them all with a single product—the Marantz CD 50n. Its modern
  digital engine reveals the finest details in high-resolution recordings
  available today.
details: |-
  Amazing digital audio experiences come from a surprising number of sources. Play them all with a single product—the Marantz CD 50n. Its modern digital engine reveals the finest details in high-resolution recordings available today. The CD 50n is a premium CD and network audio player powered by HEOS, featuring HDMI ARC for TV integration, AirPlay 2, Bluetooth, and high-resolution audio playback including DSD11.2MHz. Its build incorporates a toroidal power transformer, HDAM + HDAM SA2 architecture, symmetric circuit layout, and a double-layer metal chassis for refined sonic performance.
specs: |-
  - CD compatibility: CD, CD-R/RW with DSD support
  - Frequency Response (CD): 2Hz - 20kHz (±1dB)
  - Dynamic Range (CD): 100dB (16bit)
  - Signal-to-Noise Ratio (CD): 112dB
  - Total Harmonic Distortion (CD): 0.0016% (16bit)
  - Channel Separation (CD): 110dB
  - Program Play: 25 tracks; Repeat and Random Play supported
  - Selectable digital filters for CD and DAC modes
  - HEOS multiroom and streaming enabled
  - Spotify Connect, Tidal, Deezer, Amazon Prime Music, Pandora support
  - AirPlay 2 compatible
  - Roon Tested
  - TuneIn internet radio
  - DSD Audio Streaming up to DSD11.2MHz
  - Supports lossless formats (FLAC HD 192/24, ALAC 96/24, WAV 192/24)
  - Gapless playback (FLAC, WAV, DSD)
  - Wi-Fi (2.4 GHz, 5 GHz) and wired Ethernet
  - Bluetooth with HP transmission option
  - Remote app control for iOS and Android
  - Toroidal power transformer
  - HDAM + HDAM SA2 architecture
  - Symmetric circuit layout
  - Double-layer metal chassis reinforcement (1mm x 2)
  - Metal front panel
  - Available colors: Black, Silver-Gold
  - Power consumption: 35W
  - Standby consumption: 0.3W
  - Auto power-off feature
  - Detachable power cable
  - Display: 3-line OLED with dimmer control
  - Remote Control: RC003PMND
  - Dimensions: 442 x 424 x 130 mm
  - Weight: 10.3 kg
  - 5-year warranty included
  - Gold-plated RCA connectors
  - HDMI ARC input for TV connection
  - USB Type-B asynchronous mode (up to DSD11.2 and PCM 384 kHz)
