description: Amazing digital audio experiences come from a surprising number of
  sources. Play them all with a single product—the Marantz CD 50n. Its modern
  digital engine reveals the finest details in high-resolution recordings
  available today.
details: |-
  The CD 50n plays CD and CD-R/RW discs and adds network audio streaming, a USB-DAC and S/PDIF digital inputs, so a single component handles discs, files and connected sources.

  A digital pre-amp is built in: alongside the traditional fixed analog output, HEOS or the remote control can adjust the variable output directly when driving a power amplifier.

  HDMI ARC lets the player carry TV, movie and game audio into a stereo system over a single cable, and HEOS Built-in provides multiroom playback and search across TIDAL, Pandora, Amazon Music HD and other services, with AirPlay 2, Bluetooth and Roon Tested support.

  The analog stage uses HDAM and HDAM SA2 modules with a toroidal power transformer, a symmetric circuit layout, a double-layer 1mm chassis reinforcement plate and a current-feedback HDAM SA2 headphone amplifier. Marantz Musical Digital Filtering offers two selectable filters.

  The Marantz Sound Master tuned the CD 50n, and the unit is covered by a 5 year warranty. Available in Black and Silver-Gold.
specs: |-
  - Disc compatibility: CD / CD-R/RW / WMA / MP3 (no SA-CD, no AAC)
  - USB-B DSD audio streaming (DoP): DSD2.8 / DSD5.6 / DSD11.2
  - Sample rate USB type B in: up to DSD11.2 and PCM 384 kHz
  - Max sample rate S/PDIF input: 192 kHz / 24-bit
  - Network: Wi-Fi 2.4 GHz and 5 GHz, wired LAN, Bluetooth, AirPlay 2, Roon Tested, TuneIn internet radio
  - Lossless streaming formats: DSD, FLAC HD 192/24, ALAC 96/24, WAV 192/24, gapless playback (FLAC, WAV, DSD)
  - HDAM version: HDAM + HDAM SA2
  - Power transformer: Toroidal
  - Headphone amp: current feedback (HDAM SA2), with headphone volume control
  - Digital filter: Filter 1, 2 selectable
  - Noise shaper: none
  - Frequency response: USB DSD 2Hz - 50kHz (-3dB), USB PCM 2Hz - 50kHz (-3dB), CD 2Hz - 20kHz (±1dB)
  - Dynamic range: USB DSD 106dB, USB PCM 112dB (24bit), CD 100dB (16bit)
  - Signal to noise ratio: 112dB (USB DSD / USB PCM / CD)
  - Total harmonic distortion: USB DSD 0.0010%, USB PCM 0.0010% (24bit), CD 0.0016% (16bit)
  - Channel separation: 110dB
  - Display: 3 line OLED with dimmer and off
  - Remote control: RC003PMND
  - Power consumption: 35W, standby 0.3W, auto power off, detachable power cable
  - Maximum dimensions (W x D x H): 442 x 424 x 130 mm
  - Weight: 10.3 kg
  - Available colors: Black, Silver-Gold
