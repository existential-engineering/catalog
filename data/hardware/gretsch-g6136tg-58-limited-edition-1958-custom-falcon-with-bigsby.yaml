details: |-
  The Limited Edition 1958 Custom Falcon offers an alluring take on a classic Gretsch design. Featuring the dark and mysterious Emerald Night metallic finish, this Falcon combines period-accurate features with some modern twists thrown in.

  A 2.75"-deep laminated maple body with 1959 Trestle Bracing provides added snap and faster note attack, improved sustain and excellent feedback rejection. TV Jones Ray Butts Ful-Fidelity Filter'Tron pickups produce a tighter bass response and slightly more top end than modern Filter'Tron pickups, with truly unique sparkle and exceptional dynamics.

  Classic and modern appointments come together with jeweled G-Arrow controls, mother-of-pearl Neo-Classic Thumbnail inlays, a Space Control bridge on a pinned ebony base, and a Bigsby B6GP String-Thru tailpiece. The 25.5" scale maple neck wears a 12" radius ebony fingerboard with 22 medium jumbo frets and a bone nut. Gold hardware throughout, Grover Imperial tuners and a gloss nitrocellulose lacquer finish complete the look. Ships in a G6241 Gretsch Deluxe Hardshell Case.
