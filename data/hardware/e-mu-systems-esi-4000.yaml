description: >-
  The E-mu ESI-4000 is a professional 64-voice rack sampler from the late 1990s
  featuring 16-bit sampling, expandable memory up to 128MB, and optional dual
  24-bit stereo effects processors with digital I/O capability.
details: |-
  The ESI-4000 represents a significant evolution of E-mu's ESI sampler line, doubling the polyphony of its predecessor the ESI-32 to 64 voices while dramatically expanding memory capacity. Starting with 4MB of RAM expandable to a generous 128MB via standard 72-pin SIMMs, it was built to handle the increasingly complex sample libraries of the late 1990s.

  Sampling is handled at 16-bit resolution with support for both 22.05kHz and 44.1kHz rates through analog inputs, plus 32kHz, 44.1kHz, and 48kHz via S/PDIF digital input with 18-bit A/D conversion. The DSP editing suite includes time compression and expansion, parametric EQ, digital tuning, auto and manual truncation, cross-fade looping, cut/copy/paste, normalization, transform multiply, and automatic correlation for simplified loop creation.

  Three configurations were available: Standard, Turbo, and Turbo Zip. The Turbo variant adds dual stereo sub-outputs, an effects stereo submix, dual 24-bit stereo effects processors, and S/PDIF digital I/O. The Turbo Zip model replaces the 3.5-inch floppy drive with an Iomega Zip drive for faster storage access. Standard models could be upgraded with the ESI Turbo Option Kit.

  The ESI-4000 features 64 digital 6-pole filters with 19 available filter types and a standard built-in SCSI interface for connecting external storage. Four analog outputs are provided as standard, making it a capable studio workhorse for sample-based production.
specs: |-
  - Polyphony: 64 voices
  - Sampler: 16-bit at 22.05/44.1kHz (analog), 32/44.1/48kHz via S/PDIF (18-bit A/D)
  - Filter: 64 digital 6-pole filters, 19 types
  - Effects: Dual 24-bit stereo processors (Turbo only) - reverb, delay, chorus, flange, distortion, vibrato, Doppler, exciter
  - Keyboard: None
  - Memory: 4MB (expandable to 128MB via 72-pin SIMMs)
  - Control: MIDI
  - Outputs: 4 analog outputs, S/PDIF digital (Turbo)
releaseDate: "1998"
