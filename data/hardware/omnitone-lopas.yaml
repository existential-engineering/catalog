description: A passive Eurorack module offering five low-pass filters with
  different fixed cutoff frequencies at -6dB per octave and no resonance,
  requiring no power.
details: |-
  Have some noisy modules in your case? Or maybe you're just looking to attenuate your sound for a different vibe. Whatever your case, Lopas is a great, compact solution for your passive filtering needs. Lopas has 5 passive low-pass filters each with a different cutoff frequency (10k, 5k, 1k, 500, 100) at -6dB/octave. Lopas has NO resonance making it great for reducing unwanted harsh frequencies without sacrificing a VCF. TECHNICAL SPECS:
  3U x 4HP x 20 mm deep. Passive Module -- No power required!
