description: >-
  The Kawai K1m is the desktop module version of Kawai's K1 digital synthesizer, offering 256 PCM
  waveforms that can be layered four at a time for budget-friendly D-50-style additive synthesis.
details: |-
  Released in 1988, the K1m is the compact desktop version of Kawai's K1 keyboard synthesizer, part of the company's popular K-series. It brought accessible digital synthesis to budget-conscious musicians by offering a simplified but effective approach to layered PCM sound design.

  The sound engine provides 256 digital PCM waveforms, 50 of which are sampled from acoustic instruments. Users can combine up to four waveforms simultaneously to build custom patches, enabling everything from realistic acoustic recreations to unique synthetic timbres and complex experimental textures. This approach drew frequent comparisons to Roland's D-50, earning the K1 series a reputation for budget D-50-like synthesis.

  With 16-voice polyphony and 8-part multitimbrality, the K1m punches above its weight as a sound module. Memory holds 64 single patches or 32 combination patches. Notably, the K1m lacks any filter section, relying entirely on waveform selection and layering for tonal variety.

  The K1 series was also available as the K1r in rackmount format. While it may not have the depth of more expensive digital synths of its era, the K1m remains a capable entry-level or backup instrument valued for its immediate, characterful digital sounds.
specs: |-
  - Polyphony: 16 voices
  - Waveforms: 256 PCM (50 acoustic, 4 combinable per sound)
  - Multitimbral: 8 parts
  - LFO: 1
  - Filter: None
  - Envelope: ADSR
  - Memory: 64 single patches or 32 combo patches
  - Connections: MIDI
  - Format: Desktop module (K1m) / Rackmount (K1r)
releaseDate: "1988"
