details: |-
  A series of optional interface cards, designed to fit the Local Rack, Compact
  Stagebox, Vi1, Vi3000 and in some cases also the Vi Stagebox, enabling Vi
  Series consoles to interface directly with a wide range of other systems and
  audio networks using industry standard protocols.
