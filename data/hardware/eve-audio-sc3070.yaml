description: The SC3070 is an active 3-way studio monitor from EVE Audio that
  combines the AMT RS3.1 tweeter with a 4" midrange driver and a SilverCone
  woofer in an ultra-compact cabinet. The tri-amplified midfield monitor is
  aimed at recording, mastering and home studios where space is at a premium.
details: |-
  The SC3070 is a high-resolution, tri-amplified midfield monitor optimized for a precise midrange and a powerful bass response, which makes it suited to work that needs the complete skill set of a fully-fledged 3-way system in a place where space is at a premium. The active reference studio monitor expands EVE Audio's range of three-way speakers with a smaller version, carrying the mid-high section reproduction of the TEC Award winning SC4070 into a much more compact cabinet with low distortion across the whole frequency range. EVE Audio presents it as a solution for recording, mastering and home studios.

  The maker's own Air Motion Transformer RS3.1 is combined with a specially designed 4" midrange driver to give the SC3070 accurate and un-hyped transmission of high and mid frequencies. A woofer driver rounds the system out with precise and powerful low frequencies. The bass and midrange drivers are the same SilverCone found in existing EVE Audio models, working with a low-distortion copper-cap magnet system that significantly reduces the distortion factor, and the fiberglass-coated membrane is built in a stable honeycomb structure for true tonal reproduction.

  A high-quality 24 bit, 192 kHz BurrBrown analog to digital converter handles the analog input signal supplied over RCA or XLR. The DSP provides latency-free filtering while protecting the tweeter and woofers against overload across the entire frequency range. When the monitor is switched on, its volume increases slowly to leave enough time to reduce the source volume if the input signal is too loud.

  Adjustments to the acoustic environment are made with the front rotary and pressure encoder, the SMART-knob with its rotating LED ring. The knob levels system volume and sets the room filters (low shelf, mid EQ and high shelf), and all settings are displayed on the LED ring, whose brightness can be adjusted for dark studios or video applications.

  High-quality Class D amplifiers complete the system, with 335 W of output power per speaker split as 50 W for the tweeter, 100 W for the midrange and 185 W for the woofer. Selected volume and filter settings can be fixed independently with DIP switches positioned on the rear of the amplifier, which prevents unauthorized or unintentional adjustment.
specs: |-
  - Frequency range: 35 Hz - 25 kHz
  - Woofer size: 6,5"
  - Max. SPL: 110 dB
  - Configuration: active 3-way studio monitor
  - Frequency range measured at -3 dB at 1 m distance
  - Sound pressure level: 110 dB max. SPL per pair
  - Output power: 335 W per speaker
  - Tweeter: AMT RS3.1
  - Output power tweeter: 50 W
  - Mid-driver: 4"
  - Output power mid-driver: 100 W
  - Woofer: 6,5"
  - Output power woofer: 185 W
  - Passive radiator: 6,5" diameter
  - Cross-over frequency: 320 & 2800 Hz
  - Protection limiter: Yes
  - A/D converter: BurrBrown, 24 bit / 192 kHz
  - Amplifier type: Class D
  - Volume range: minus infinity to +6 dB
  - High-shelf filter: -5 dB to +3 dB above 3 kHz
  - Mid EQ: -3 dB to +3 dB at 1 kHz
  - Desk filter cut: -5 dB to 0 dB at 160 Hz
  - Desk filter boost: 0 dB to +3 dB at 80 Hz
  - Low-shelf filter: -5 dB to +3 dB below 300 Hz
  - Input level dip switch: +7 dBu / +22 dBu
  - Phase inversion: 0 degrees / 180 degrees
  - Input impedance: 10 kOhm
  - Power consumption: less than 1 W standby, 220 VA maximum
  - Dimensions: 340 x 250 x 310 mm (13.4 x 9.8 x 12.2 inches, WxHxD)
  - Weight: 9.8 kg (21.6 lb)
