details: |-
  Designed in collaboration with legendary drummer Ahmir "Questlove" Thompson, the Ludwig Breakbeats kit packs punch, portability, and personality into a street-smart shell pack made to move with your rhythm. Whether you're gigging in tight spaces, practicing at home, or busking on the corner, Breakbeats delivers full-size tone in a scaled-down setup that's easy to travel with and hard to ignore.

  "I wanted to build a device that was apartment-friendly and compact for the street musician; but also something that was quality-sounding. A gritty, raw, 'break-able' kit for gigging in clubs that you can fit in a cab. Breakbeats by Questlove does it all." - Ahmir "Questlove" Thompson (The Roots)

  Make It Fit: Breakbeats was designed with the city in mind. Positioned on a riser for optimum reach, its compact 14x16" bass drum, 7x10" tom, and 13x13" floor tom create a set-up for sculpting grooves in tight spaces.

  Break It Down: The tonal center of Breakbeats is a 5x14" matching wood snare drum. Create beats on the fly and make your voice heard at gigs, on the street, or in rehearsal.

  Dial It In: Breakbeats' 7-ply hardwood shells play like a full-sized kit, fusing low-end kick punch with focused tom and snare midrange. Each drum's bearing edge is cut to a 45-degree angle within 1/16" from the outside edge and hand-sanded for a smooth, even surface that ensures easy head seating.
specs: |-
  - Bass drum: 14x16"
  - Rack tom: 7x10"
  - Floor tom: 13x13"
  - Matching wood snare drum: 5x14"
  - Shells: 7-ply hardwood
  - Bearing edges: 45-degree, hand-sanded, within 1/16" tolerance
  - Cast bass drum hoop claws
  - Evolution bracket vibra-band suspension mount
  - Evolution floor tom leg brackets
  - Available finishes: Lilac Sparkle, Deep Blue Sparkle, Frosted Sparkle
