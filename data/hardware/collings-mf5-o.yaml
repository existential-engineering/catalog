name: MF5-O
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf5-o/
description: The MF5-O is a fully-appointed F-style mandolin with an oval
  soundhole, carved Adirondack spruce top, and Eastern flamed maple back, sides,
  and neck. The oval soundhole accentuates bass and low-mid response while
  providing a warm, open tonality rich in overtones — contrasting with the more
  cut and chop character of f-hole models. Ivoroid binding throughout and high
  gloss nitrocellulose lacquer finish complete the premium specification.
details: |-
  The MF5-O is an F-style mandolin with a carved seasoned Adirondack spruce top and Eastern flamed maple back, sides, and neck, distinguished by its oval soundhole and X-brace construction. The oval soundhole delivers warmer, bass-forward tone compared to the f-hole MF5. Ivoroid binding with black/white purfling appears on the body, fingerboard, and peghead, along with a flourish peghead inlay. The ebony fingerboard has MOP dot inlays and a compound radius of 7" to 11 5/8", and the 1 3/16" nut width suits the oval-hole character. Hardware includes nickel Gotoh tuners with ivoroid buttons and the Collings original tailpiece. High gloss nitrocellulose lacquer finish. Ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Construction: F-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: Oval hole
  - Body Binding: Ivoroid with b/w side purfling
  - Fingerboard Binding: Ivoroid with b/w side purfling
  - Peghead Binding: Ivoroid with b/w side purfling
  - Bracing: X-brace
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 3/16"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP Collings logo and flourish
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Tailpiece: Original tailpiece
  - Pickguard: None
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 7" - 11 5/8" compound
  - Body Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
