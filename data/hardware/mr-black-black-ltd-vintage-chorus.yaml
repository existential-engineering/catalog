description: A recreation of the original 1976 chorus ensemble sound with modern
  touches like 9VDC power, true-bypass, a full wet/dry mix and expanded rate. A
  Jack Deville limited run of 48 pieces.
details: |-
  The Black LTD. Vintage Chorus is designed to replicate the original 1976 chorus
  ensemble sound, the lush shimmer that defined the era. It adds a few modern
  amenities that the big-box originals lacked: pedalboard-friendly 9VDC power,
  true-bypass switching, a full wet/dry mix control and expanded speed and rate
  limits.

  Without the bulky two-button, AC-corded enclosure of the vintage units, the pedal
  delivers that classic chorus voice and a good deal more, including deeper
  vibrato-leaning textures at higher settings.

  It is a Jack Deville original design produced as a Black LTD. limited run of 48
  pieces. The pedal uses a standard stompbox layout with a 1/4-inch input and
  output and 9VDC pedal power. This run has sold out, but no notice states the
  product line itself is permanently discontinued.
specs: |-
  - Recreation of the 1976 chorus ensemble sound
  - Full wet/dry mix control
  - Expanded speed/rate limits
  - True-bypass
  - 9VDC pedal power
  - Limited run of 48 pieces
  - Jack Deville original design
