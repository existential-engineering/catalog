description: >-
  The Yamaha W7 is a professional workstation synthesizer from the mid-1990s
  featuring Yamaha's AWM2 tone generation system with 8 MB of wave memory and
  384 realistic voices. It combines powerful synthesis tools, studio-quality DSP
  effects, and a 16-track onboard sequencer with 100,000-note capacity in a
  61-key velocity and aftertouch-sensitive keyboard.
details: |-
  The W7 employs Yamaha's AWM2 (Advanced Wave Memory 2) tone generation system, providing 384 realistic voices composed of up to 4 elements each for added realism and depth. The voice architecture includes 128 GM voices plus 8 drum kits, 128 preset AWM2 voices with 2 drum kits, and 128 user-programmable voices with 2 drum kits.

  Sound design is streamlined through Voice Templates, allowing quick parameter adjustment without deep menu diving. Users can choose from 39 preset amplitude types, 59 filter settings, 40 pitch envelope settings, and 33 LFO settings. The effects section provides 3 insertion effects and 3 system effects that can be applied individually to voices or globally across the system.

  A powerful 16-track sequencer is built in, supporting both real-time and step-time recording with up to 100,000 notes of storage at 96 clocks per quarter note resolution. The sequencer is SMF format compatible, and a 3.5-inch floppy disk drive is included for data storage. An optional 4 MB expansion wave/voice ROM board provides additional sonic capabilities.

  Yamaha released a Version 2 upgrade for pre-1996 models, adding additional voice banks (P2 and P3). The W7's sibling, the W5, differs primarily in keyboard size with a 76-note semi-weighted keyboard. The W-series was eventually succeeded by the EX5 and EX7 synthesizer workstations.
specs: |-
  - Polyphony: 32 notes
  - Keyboard: 61 keys with velocity and aftertouch
  - Tone Generation: AWM2 (Advanced Wave Memory 2)
  - Wave Memory: 8 MB preset
  - Voices: 384 total (128 GM + 128 preset AWM2 + 128 user)
  - Drum Kits: 12 total (8 GM + 2 preset + 2 user)
  - Voice Elements: 4 per voice
  - Effects: 3 insertion + 3 system
  - Sequencer: 16 tracks, 16 songs, 100,000 note capacity
  - Sequencer Resolution: 96 PPQN
  - Recording Modes: Real-time and step-time
  - Format: SMF compatible
  - Storage: 3.5-inch floppy disk drive
  - Expansion: Optional 4 MB wave/voice ROM board
  - MIDI: 16-part multitimbral
