details: |-
  The REDD Microphone is a large diaphragm tube condenser (LDC) microphone developed by Chandler Limited in partnership with EMI Abbey Road Studios, and the first new EMI-badged microphone in over half a century. It uniquely integrates the historic REDD.47 preamplifier circuit directly into the microphone body, coupled to a custom handmade premium platinum membrane capsule. The microphone can be used with or without an external preamplifier.

  Controls on the microphone body include: nine switchable gain positions (+4 to +33 dB in NORM mode), DRIVE mode for extended gain and tonal coloration, switchable Cardioid/Omni polar patterns, 10 dB pad, and phase reverse (0–180°). Continuous output level and low-contour (high-pass) filter are accessible from the included high-quality external power supply.

  Includes shockmount, 25' 7-pin Mogami microphone cable, PSU, and a custom molded flight case with high-density rigid foam. Patent No. 10,412,477.
