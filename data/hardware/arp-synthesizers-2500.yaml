description: >-
  The ARP 2500 is a technologically advanced modular synthesizer introduced by ARP
  Instruments in 1970, designed as a direct competitor to Moog modular systems with unique
  matrix switching for signal routing.
details: |-
  In 1969, ARP Instruments was established by electronics engineer Alan R. Pearlman, inspired by the Moog synthesizer and Wendy Carlos's groundbreaking "Switched on Bach" album. The 2500 debuted in 1970 as ARP's first modular synthesizer, featuring 15 modules covering VCOs, filters, envelope generators, modulators, sample-and-hold circuits, and sequencers.

  Unlike traditional patch-cable systems, the 2500 employed a unique 10x10 matrix switch design for signal routing. Modules occupied the center cabinet row with matrix switches above and below, allowing flexible patching without cables. While this reduced visual clutter, potential crosstalk between busses and less intuitive signal flow proved challenging compared to conventional systems.

  The modules featured engineering-focused designs with extensive controls and electronic diagrams, creating a steep learning curve. This made the 2500 particularly popular in university music departments. The instrument excelled with superior oscillators offering stable tuning that rarely drifted, outperforming comparable Moog components.

  With approximately 100 units sold, the 2500 remains exceptionally rare. It gained recognition through prominent musicians including Vangelis, Jean-Michel Jarre, Pete Townshend, and composer Jerry Goldsmith who used it for the film "Logan's Run."
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1004p/1004t VCOs, 1023 Dual VCO, 1016 Dual Noise/Random Voltage Generator
  - Filters: 1047 Multimode Filter/Resonator, 1006 Filtamp
  - Envelope Generators: 1003 Dual Exponential, 1033 Dual Delayed Exponential, 1046 Quad Exponential
  - Modulation: 1005 Modamp with VCA
  - Sequencers: 1027 Ten-Position Sequencer, 1050 Mix/Sequencer
  - Sample & Hold: 1036 Dual Sample & Hold
  - Routing: 10x10 Matrix Switch System (no patch cables)
  - Cabinets: 2515 Studio (15 modules, 47" wide x 22" tall), 2508 Wing (8 modules)
  - Keyboards: Multiple options from 4-5 octaves, various voice configurations
  - Control: CV/Gate
  - Production: 1970 - mid 1970s
  - Original List Price: Modules $400-$1,200, complete systems $8,000-$20,000
releaseDate: "1970"
