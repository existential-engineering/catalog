description: 64-channel flagship digital matrix processor for installed sound
  systems with 32-bit floating point DSP, advanced routing, and dual High Speed
  Option slots.
details: |-
  status: discontinued
  formFactor: 2U rack
specs: |-
  - Audio I/O Channels: 64 (configurable in banks of 8)
  - Card Slots: 8 (slots A–H)
  - High Speed Option Slots: 2
  - Sample Rate: 48 kHz
  - Internal Processing: 32-bit floating point
  - Frequency Response: 20 Hz–20 kHz, ±0.50 dB
  - Dynamic Range: 107 dB unweighted; 110 dB A-weighted
  - THD+Noise: 0.0045% typical at 0 dBu, 1 kHz
  - Max Input Level: +22 dBu
  - Max Output Level: +20 dBu
  - Input Gain Range: 0 dB nominal; up to +48 dB in 6 dB steps
  - Input Impedance: 3.5 kΩ
  - Output Impedance: 44 Ω
  - CMRR: >40 dB typical, >55 dB at 1 kHz
  - Phantom Power: +48 VDC, selectable per input
  - GPIO Control Inputs: 8
  - GPIO Logic Outputs: 6
  - Delay: Up to 5120 ms per channel (input and output)
  - Power Consumption: 120 W
  - Power Supply: 100–240 VAC, 50/60 Hz
  - Dimensions: 3.5" H × 19" W × 15" D / 89 × 483 × 381 mm (2U)
  - Weight: 18.9 lbs / 8.57 kg (with all audio cards)
