description: A discontinued subharmonic synthesizer designed for portable and
  touring applications, adding synthesized low-frequency enhancement to audio
  systems.
details: |-
  The 120X is a subharmonic synthesizer that generates synthesized low-frequency content below the fundamental frequency of audio signals. This technology enhances bass response and adds perceived depth to audio presentations in live sound reinforcement and portable PA systems.

  Ideal for touring professionals and portable sound systems, the 120X delivers subharmonic synthesis capabilities to extend the perceived low-frequency range of smaller speaker systems. The device processes incoming audio to create harmonic content that reinforces bass impact.
specs: |-
  - Subharmonic synthesizer
  - Generates synthesized low frequencies
  - Portable/Tour recommended application
  - Professional audio processing
