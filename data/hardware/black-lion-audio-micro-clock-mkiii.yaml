url: https://blacklionaudio.com/en/products/micro-clock-mkiii
description: Master word clock generator with six BNC outputs up to 384kHz
details: |-
  The Micro Clock mkIII is a master word clock generator by Black Lion Audio. It features an LED frequency display and six BNC outputs supporting clock rates up to 384kHz, alongside AES and RCA S/PDIF outputs up to 192kHz, and an optical S/PDIF output up to 96kHz. The unit is a significant redesign of its predecessor, incorporating lower-jitter oscillators, enhanced galvanic isolation, and improved noise filtration throughout the circuit. It ships with removable rack ears and fits in a half-rack form factor.
specs: |-
  - Jitter: 1.92pS RMS (BNC outputs)
  - BNC Output Impedance: 75Ω
  - BNC Output Voltage: 5V unterminated
  - AES Output: 110Ω balanced, up to 192kHz
  - RCA S/PDIF Output: 75Ω unbalanced, up to 192kHz
  - Optical S/PDIF Output: up to 96kHz
  - BNC Supported Frequencies: 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384 kHz
  - RCA S/PDIF & AES Supported Frequencies: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Optical S/PDIF Supported Frequencies: 44.1, 48, 88.2, 96 kHz
  - Power Input: 9VDC
  - Power Consumption: 6W
  - Power Connector: 2.1mm barrel, 5.5mm outer diameter, center pin positive
  - Dimensions: 6.5" L x 6" W x 1.75" H (without ears)
  - Weight: 2.2 lbs
