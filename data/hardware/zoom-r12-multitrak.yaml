description: The R12 MultiTrak is a battery-powered eight-track recorder operated from a 2.4-inch full-colour touchscreen, with two XLR/TRS combo inputs, per-track 3-band EQ, a send-effect channel, a 150-loop rhythm track and an 8-voice FM synth track. Over USB-C it also works as an audio interface and a DAW control surface.
details: |-
  The R12 MultiTrak is a battery-powered eight-track recorder built around a 2.4-inch full-colour touchscreen, so a song can be recorded, edited and mixed without a computer. Tracks are cut, copied, looped, trimmed, split and time-adjusted by touch and swipe, and the screen switches between a waveform Track View and a Level Meter View of every fader.

  Two XLR/TRS combo inputs take mics, keyboards and guitars, with +48 V phantom power switchable per input and a Hi-Z switch on input 1 for a guitar or bass with passive pickups. Two tracks record at once and eight play back, at 44.1 kHz in 16-bit or 24-bit WAV to a microSDHC or microSDXC card of up to 1 TB.

  Each track has pan and a 3-band EQ with shelving high and low bands and a peaking middle band. Inputs 1 and 2 share a Comp/Limiter/Gate stage. A dedicated send-effect channel with its own return fader offers ten spatial effects covering reverb, delay and chorus, and patch memories hold up to three effects at once across fifty slots, assignable as an insert on the input or as a send. Zoom's Guitar Lab editor replaces and edits those effects over USB.

  A rhythm track carries 150 preloaded PCM drum loops laid out as Intro, Verse, Bridge, Chorus and Outro sections, and a synth track runs an 8-voice FM engine with 18 sound types plus a PCM drum kit, played from a USB MIDI keyboard or drawn on the touchscreen in a piano-roll editor. A customizable click with 3/4, 4/4 and 6/8 signatures from 40 to 250 BPM can be balanced against the playback and routed to the headphones, the main outputs, or both, and the tuner covers chromatic, guitar, bass and five open tunings.

  Sequence Play chains finished projects into a playlist for use as backing tracks live or in rehearsal. Over USB-C the R12 is a 2-in/2-out or 2-in/4-out audio interface and a DAW control surface, and the same port imports and exports projects from a USB flash drive and connects a USB MIDI keyboard, supplying 5 V at 200 mA as a host. The R12 Control app for iPad adds a second display for mixing, effects, playlists and settings, with VoiceOver support for visually impaired users. Power is four AA batteries, the supplied AD-17 adapter or a USB battery, for about 5 hours on alkalines and about 11 on lithium.
specs: |-
  - Multi-track digital recorder with up to 8 tracks
  - Inputs: 2 mono MIC/LINE. Outputs: 1 MASTER OUT, 1 PHONES
  - Input connectors: 2 XLR/TRS combo jacks, balanced, XLR: 2 HOT, TRS: TIP HOT
  - Input gain: +6 to +50 dB
  - Input impedance: XLR 3.9 kOhm. TRS 3.9 kOhm, or 1 MOhm with Hi-Z on, INPUT 1 only
  - Phantom power: +48 V, switchable separately for INPUT 1 and INPUT 2
  - Equivalent input noise: -121 dBu or less (IHF-A) at +50 dB / 150 Ohm input
  - Frequency response: -1.0 / +0.5 dB, 20 Hz to 20 kHz
  - MASTER OUT: 2 TRS phone jacks (balanced), maximum output level +14 dBu, output impedance 200 Ohm
  - PHONES: 1 stereo 3.5 mm mini jack, maximum output level 45 mW + 45 mW into a 32 Ohm load, output impedance 10 Ohm
  - Maximum simultaneous recording tracks: 2, maximum simultaneous playback tracks: 8
  - Recording format: 44.1 kHz, 16/24-bit, mono or stereo WAV
  - Recording media: microSDHC cards 4 GB to 32 GB and microSDXC cards 64 GB to 1 TB
  - Track EQ: High 10 kHz shelving plus or minus 12 dB, Middle 2.5 kHz peaking plus or minus 12 dB, Low 100 Hz shelving plus or minus 12 dB
  - Pan range: L100 to R100
  - Input dynamics: Comp/Limiter/Gate
  - Patch memory effects: 3 types usable simultaneously, 50 patch memories, Guitar Lab supported, assignable as an insert (input) or send effect
  - Dedicated send effects: 10 types of spatial effects
  - Tuner: Chromatic, Guitar, Bass, Open A, Open D, Open E, Open G, DADGAD
  - Click (metronome): 3/4, 4/4 and 6/8 time signatures, tempo 40.0 to 250.0 BPM
  - Rhythm loops: PCM, 150 loops
  - Synth: FM sound source, 8-voice polyphony, 18 sound types plus a PCM drum kit
  - Display: 2.4-inch 320 x 240 full-colour touchscreen LCD
  - USB connector: USB Type-C, requires a cable that supports data transfer. USB bus power is supported
  - Audio interface: 2 in / 2 out at USB 2.0 Full Speed (also the iPad mode), or 2 in / 4 out at USB 2.0 High Speed, 44.1 kHz, 16/24-bit
  - USB device modes: mass storage USB 2.0 High Speed, Guitar Lab connection USB 1.1 Full Speed, DAW control surface USB 1.1 Full Speed
  - USB host modes: mass storage and USB MIDI keyboard, supplying 5 V at 200 mA
  - Power: 4 AA batteries (alkaline, lithium or rechargeable NiMH) or ZOOM AD-17 adapter (5V/1.0A)
  - Estimated continuous operation time during playback: about 5 hours alkaline, about 5 hours NiMH 1900 mAh, about 11 hours lithium
  - Power consumption: 5 W maximum
  - Dimensions: 256 mm (W) x 158 mm (D) x 61 mm (H)
  - Weight including batteries: 827 g
  - In the box: R12 MultiTrak, AD-17 AC adapter, USB cable, Quick Tour guide
  - Maximum regions per project: 50 audio and rhythm regions, 80 synth regions
