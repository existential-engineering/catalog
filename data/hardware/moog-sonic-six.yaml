description: >-
  The Sonic Six is a duophonic analog synthesizer originally derived from the muSonics
  Sonic V design, produced after muSonics merged with R.A. Moog to form Moog muSonics.
  Featuring two oscillators, a 24dB/oct low-pass filter, ring modulator, and built-in
  speaker, it was designed for educational and home use in a portable briefcase-style
  enclosure. Despite its simple front panel, the Sonic Six is a uniquely flexible and
  great-sounding instrument with advanced LFO mixing capabilities not found on other Moog
  synthesizers.
details: |-
  The Sonic Six has an unusual lineage among Moog synthesizers. Its design originated from the muSonics Sonic V, and it was adapted into a portable briefcase-style synthesizer when muSonics merged with R.A. Moog to form Moog muSonics. This heritage gives it a distinctive appearance and internal architecture that differs from standard Moog instruments.

  The instrument is duophonic, equipped with two analog oscillators offering sawtooth, triangle, and pulse waveforms. It features two independent LFO generators with advanced control options not seen on other Moog synths, including an X/Y knob for mixing LFO outputs. A ring modulator can process either oscillator B or external audio, and pink/white noise generators are also included.

  The filter is a classic 24dB/oct low-pass design with self-oscillation capability, though early models reportedly incorporated circuitry borrowed from ARP designs, with later units receiving more traditional Moog filters. The VCA provides attack and decay controls plus a sustain on/off switch. Originally designed for educational and home use, the Sonic Six includes built-in amplification and a speaker. Notable users include Freddy Fresh, Stereolab, and Spectrum/EAR.
specs: |-
  - Polyphony: Duophonic (2 voices)
  - Oscillators: 2 VCOs with sawtooth, triangle, and pulse waveforms
  - LFO: 2 multimode with variable rate (sawtooth, ramp, triangle, square)
  - Filter: 1 24dB/oct low-pass filter with self-oscillation
  - VCA: Attack/Decay/Sustain or Release
  - Keyboard: 49 keys
  - Modulation: Ring modulator, pink/white noise generator
  - Control: CV/Gate
  - Built-in amplifier and speaker
