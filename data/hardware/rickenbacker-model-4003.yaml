description: Explore the Model 4003, a Classic Rickenbacker bass known for its
  treble punch and magnificent sustain in music performances.
details:
  - The Classic Rickenbacker 4003 bass – famous for its ringing sustain, treble
    punch and solid underlying bass.
  - A subtle strip of binding graces the elegantly curved body and the Rosewood
    fingerboard. Deluxe triangular inlays and stereo capability are standard
    features.
