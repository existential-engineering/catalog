description: Erica Synths Black Dual EG/LFO has two full ADSR EGs and two unique
  LFOs with plenty of features just in 10HP!
details: |-
  Erica Synths Black Dual EG/LFO has two full ADSR envelope generators and two unique LFOs with plenty of features in just 10HP.

  The two full ADSR envelope generators can be adjusted one by one, or run as two simultaneous AD/ASR envelope generators, alongside an LFO with functionality not seen before, all within 10HP. That saves rack space for other Black Series modules.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on the module width, putting design and usability first. Big knobs are assigned to functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  The panel offers 2xADSR or 2xASR envelopes, 2xLFO with a drawable LFO shape, gate and trigger inputs, direct and inverted outputs, a long and short EG switch, full ADSR looping, an LFO key follow function, step activity indication LEDs and diode protection on reversed power supply.

  EG output level runs 0V to +10V and LFO output level -5V to +5V, with an LFO rate of 0.2Hz to 30Hz. Maximum attack time is 0.125s in short mode and 2s in long mode, maximum decay 0.125s and 1s, maximum release 0.350s and 5s. The module is 10HP wide and 25mm deep, drawing +25mA and -15mA.
specs: |-
  - 2xADSR envelope or 2xASR envelope
  - 2xLFO
  - Drawable LFO shape
  - Gate and Trigger inputs
  - Direct and inverted outputs
  - Long/Short EG switch
  - Full ADSR looping
  - LFO key follow function
  - Each step activity indication LEDs
  - Diode protection on reversed power supply
  - EG output signal level 0 – +10V
  - LFO output signal level -5V – +5V
  - LFO rate 0,2Hz – 30Hz
  - Sustain level 0 – +10V
  - Max Attack time 0,125’’(S), 2’’(L)
  - Max Decay time 0,125’’(S), 1’’(L)
  - Max Release time 0,350’’(S), 5’’(L)
  - Power consumption +25mA, -15mA
  - Module width 10HP
  - Module depth 25mm
