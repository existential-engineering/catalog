description: An analog JFET overdrive and distortion pedal voiced after a late
  1960s amp, with Level, Tone and Drive controls and a two-way Open and Closed
  toggle.
details: |-
  The Super Bass is Keeley's homage to a late 1960s amp whose sound has carried through generations of hard-hitting rock playing. It takes that voice and puts it into a pedal format rather than reproducing the amp itself.

  The design is analog and driven by a JFET circuit, an amp-in-a-box aimed at channelling the tone that inspired it into something pedalboard sized. The control layout is deliberately straightforward, with robust knobs for Level, Tone and Drive.

  A dedicated two-way toggle switches between Open and Closed operation, which gives two distinct voicings of the tone shaping. The housing is built for touring use, and the pedal is made in the USA alongside the rest of Keeley's stompboxes. It takes a single 1/4-inch input and output, and runs from a 9 V DC supply that is not included.
