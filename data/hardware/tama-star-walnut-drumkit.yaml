description: STAR is the flagship line for TAMA drums. It takes the knowledge
  and research we cultivated for the Starclassic series to the next level, by
  reexamining every detail to enhance shell resonance.
details: |-
  Walnut Shells (STAR Drum): All Walnut Shell TT/FT/SD: 6ply 6mm, BD: 7ply 7mm (except ASCS, AGJB, ASBJ, AIJB, LIC, RSC & AWC) *Satin Charcoal Japanese Sen (ASCS), Garnet Japanese Sen Burst (AGJB), Satin Black Japanese Sen Burst (ASBJ) & Indigo Japanese Sen Burst (AIJB) Walnut + 2 outer ply Japanese Sen TT/FT/SD: 6ply 6mm, BD: 7ply 7mm *Light Indigo Japanese Chestnut (LIC), Roasted Japanese Chestnut (RSC) & Antique White Japanese Chestnut (AWC) Walnut + 1 outer ply Japanese Chestnut TT/FT/SD: 6ply 6mm, BD: 7ply 7mm >Generation of furniture makers have favored Walnut for its reliable solidness and long-term stability. As a drum shell material, Walnut's distinctive warm, fat sound has long been subject of rumor among drum tone aficionados, and new STAR WALNUT are doubtlessly about to rekindle that discussion.

  Bearing Edges: Vibration produced by hitting a drum transfers to the shell through the contact point between the drumhead and the shell. Therefore, the shape of the bearing edges is one of the most important factors in a drum's sound. STAR drums feature a bearing edge shape as shown in the diagram. Its peak is rounder than TAMA's traditional bearing edge. This rounded peak provides more contact between the drumhead and shell, allowing vibration to travel from the drumhead to the shell more efficiently. Also, the peak position of the edge is 3.5mm from the shell's outer surface, which further improves contact between the drumhead and drum.

  Drum Heads: Tom Toms & Floor Toms: REMO® Coated Ambassador for Batter Side / REMO® Clear Ambassador for Bottom Side Bass Drums: REMO® Coated Powerstroke 3 for Batter Side / REMO® Fiberskyn Powerstroke 3 Diplomat for Front Side Snare Drums: REMO® Coated Ambassador for Batter Side / REMO® Snare Ambassador for Snare Side

  Hold Tight™ Washers: Hold Tight washers are designed to prevent the tension rods from loosening. They consist of a cup-shaped stainless steel washer which contains a rubber ring. Vibration caused from striking a drum creates space between tension rods and hoops, which can cause the tension rods to loosen over time. The rubber rings on our Hold Tight washers help absorb the impact of vibration and keeps tension rods in constant contact with the hoops to prevent loosening.

  Die-Cast Hoops: Hoops are a crucial element to a drum's sound and ease of tuning. STAR drums feature die-cast zinc hoops, which are manufactured by injecting molten metal into molds. Die-cast hoops are denser and more consistent in shape than triple-flanged hoops, which are manufactured by bending metal plates. Sonically, die-cast hoops provide crisper attack, greater projection and a more focused and powerful tone. Die-cast hoops also make tuning easier and keep drums in tune longer because of their density and consistency in shape. These hoops combine with the rich, resonant STAR drum shells for a very well-balanced, full-bodied sound.

  Bass Drum Spurs (US.PAT.NO.9093051): The bass drum spurs adopt the same concept as the floor tom legs. Since the bass drum spurs receive the horizontal impact from the pedal striking the bass drum, properly absorbing this impact is critical to the natural resonance of the bass drum shell and for a comfortable feel from the bass drum pedal. This is why we designed STAR bass drum spurs with soft, high-mass rubber feet. There is one more important consideration. Most bass drum spurs have metal spikes at the end to prevent slippage while playing. This is an important feature for many drummers, so to achieve the same impact absorption principle while using metal spikes, STAR bass drum spurs feature a unique 2-piece construction. The spike is separated from the rest of the spur by rubber, which absorbs the impact without transferring it to the spike itself, allowing the bass drum shell to vibrate and resonate more freely.
