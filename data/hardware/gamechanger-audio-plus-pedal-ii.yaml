details: |-
  The Plus Pedal II adds piano-style sustain and sostenuto to any instrument, preserving guitar, vocals, wind, acoustic instruments, brass, strings and experimental sound sources in stunning realism.

  Its new Spectral Sampling engine captures the true timbre, dynamics, harmonics and character of any input, preserving the expressive nuances of a performance. The player can choose from 1 to 10 layers, or go infinite, and connect any instrument or vocal via the combo XLR/TS input with its built-in mic preamp.

  The Plus Pedal II includes a smart SEND/RETURN FX loop with a three-position routing switch, which moves external effects to three positions, pre, inside and post the effects engine, without touching a cable. With a new gradual optical control system, the brass pedal responds smoothly across its full range, closer than ever to the feel of a real piano damper. Auto Layer Catch lets the player simply press and play while the engine detects and stacks new notes during the performance, with no manual catching.

  A new kind of sound engine. Built around a completely new Spectral Sampling engine, the Plus Pedal II does not just hold notes, it analyzes them at the spectral level, preserving the subtle harmonic and dynamic characteristics of every sound played. Working alongside the original Real-time Audio Sampling technology, the result is an experience that feels both natural and instantly responsive, preserving the expressive nuances of a performance across any instrument or vocal while seamlessly extending them into evolving sonic textures.

  Auto Layer Catch. With a foot kept on the pedal, the Plus Pedal II detects new note events, filters out noise, handles transitions and stacks sounds with remarkable musical accuracy, much like playing a piano with a sustain pedal that simply works without any thought or technique.

  Gradual optical control. A new optical sensing system reads the brass pedal's position across the whole movement range, which allows the volume and release curves of all sustain layers to be controlled by foot. It can emulate the gentle behaviour of a real piano pedal, or create expressive volume swells across the pedal's full mechanical range.

  Layer control. A dedicated LAYERS knob sets exactly how many active layers the pedal maintains. A single layer gives maximum clarity and clean sustain under one note or chord, two to ten layers build rich harmonic structures, chord beds and complex textures, and Infinite Mode continuously combines older layers for endless evolving soundscapes. Each active layer is shown on the circular LED halo display, giving real-time visual feedback as the sound builds.

  Combo XLR/TS input and built-in mic preamp. A combo XLR/TS input with a built-in studio-grade microphone preamp and adjustable gain control makes it easy to connect microphones directly, alongside guitars, vocals and acoustic instruments. A standard 1/4-inch jack input bypasses the preamp completely and behaves like a traditional instrument input. A Kill Dry switch allows the Plus Pedal II to be used for sustain layering only, while the instrument sounds naturally in the room.

  Dual resonator and dynamic tone. The built-in dual resonator engines continuously respond to the spectral content of each active layer, generating ever-shifting upper and lower resonances, so every new note changes the harmonic ecosystem and creates movement and organic complexity. The TONE control applies a gradually evolving filter envelope to each layer individually, so sustained sounds breathe more like a real acoustic instrument than a static tilt EQ would.

  Advanced catch, hold, rise and decay controls. The CATCH switch determines how new notes enter the sustained layer pool: ALL makes every new note a layer, GROUP catches only the selected number of layers so chords can be played and then soloed over without lifting a foot, and SINGLE adds notes one at a time. The HOLD switch controls what happens after layers are captured: ALL keeps every layer sustained while the pedal is held, FIRST holds the first note while new layers naturally decay, and NONE starts all layers decaying immediately after capture. Dedicated RISE and DECAY knobs shape how each layer fades in and out over time.

  Smart FX loop. The original Plus Pedal featured an FX loop that processed only the sustained layers. The Plus Pedal II takes that further with a three-position routing switch that moves external effects to three fundamentally different positions without touching a cable: PRE, before the engines, FX LOOP, affecting the sustained layers only, and POST, adding effects to the pedal's output mix, where the Dry Out output is unaffected.

  Optional external footswitch. The redesigned footswitch expands live and studio workflows with three operating modes and a dedicated Dry Out. WET removes the dry signal from the main output for pure sustained layers, LATCH keeps the pedal continuously active without holding the brass pedal, and HIDE temporarily removes the dry signal while the brass pedal is engaged. It is not included.
specs: |-
  - Spectral Sampling engine, captures the true harmonic and dynamic character of any input
  - Auto Layer Catch, captures and layers every new note while the foot stays parked
  - Layers: 1 to 10, or Infinite Mode
  - CATCH modes: ALL, GROUP, SINGLE
  - HOLD modes: ALL, FIRST, NONE
  - FX loop routing: PRE (before the engines), FX LOOP (sustained layers only), POST (the output mix, leaving the Dry Out unaffected)
  - Instrument input: 1/4-inch unbalanced TS (part of the combo jack), mono, 1 MOhm input impedance, 5.6 Vpp max input level
  - Microphone input: balanced female XLR (part of the combo jack), mono, 22 kOhm input impedance, analog gain potentiometer up to +27 dB, preamp for dynamic microphones only with no phantom power
  - RETURN input: 1/4-inch unbalanced TRS (stereo), 1 MOhm input impedance, 5.6 Vpp max input level
  - OUT and SEND outputs: 1/4-inch unbalanced TRS (stereo), 100 Ohm output impedance, 5.6 Vpp max output level
  - FSW / DRY OUT: 1/4-inch unbalanced TRS, 100 Ohm output impedance, 5.6 Vpp max output level, dual use for the external footswitch
  - Digital audio: 44.1 kHz, 24 bit
  - Controls: gradual control brass foot pedal, LEVEL, LAYERS, RISE, DECAY, TONE and RESONANCE potentiometers, CATCH and HOLD front-panel switches, FX LOOP and KILL DRY back-panel switches, XLR GAIN analog gain potentiometer, optional additional footswitch input
  - Indicator: 11 LED circular display
  - USB-C for USB-MIDI and firmware updates
  - Power: 9V DC center-negative, 2.1 x 5.5 mm barrel plug, 500 mA minimum (not included)
  - Mean power consumption: 2.4 W
  - Dimensions: 90 x 195 x 72 mm (3.54 x 7.68 x 2.83 in) WLH
  - Weight: 995 g (2.19 lbs)
  - Lifetime warranty
