details: |-
  The MWT-01 Midi Wave Theremin, made in Melbourne, Australia and released in 2010, is far more than a traditional theremin. It combines a professional stereo theremin, a MIDI controller, and an analog-style mini synthesizer into one unique instrument. As a MIDI controller, it sends CC messages, pitch-bend, or note on/off data, allowing performers to control synthesizers, samplers, and software by waving a hand near the antenna.

  A standout feature is the implementation of a vintage ladder-style 24dB resonant filter, which effectively transforms the theremin into a mini-synth. The filter frequency is accurately controlled via the theremin antenna with very fast response. The filter input can come from external sources or the internal oscillators (square, saw, triangle), and three filter outputs (highpass, bandpass, lowpass) can be freely mixed with individual volume and pan controls for dynamic stereo output.

  Connecting a trigger pad to the MWT-01 opens up percussive possibilities, allowing drummers and percussionists to manipulate samples in real time using the antenna as a virtual fader. The pitch-bend mode can sweep samples across the pitch spectrum from subsonic rumbles to high-pitched clicks, adding an entirely new dimension to performance.

  The stereo theremin section features three oscillators with individual volume and pan controls and a wide selection of waveforms including sine, triangle, sawtooth, and square. Additional features include tremolo, a VCA for external volume control, ring modulation, and noise generation capabilities, all stored in internal flash memory.
specs: |-
  - Polyphony: 3 voices
  - Oscillators: 1 main plus 2 sub-oscillators (1Hz to 15KHz range)
  - Waveforms: 8 (sine, triangle, sawtooth, square, and more)
  - Filter: 24dB self-oscillating ladder-style with LP, BP, HP outputs
  - Modulation: Ring modulator with 3 theremin-controlled carrier waves, Tremolo
  - VCA: Yes
  - Effects: Tremolo, auto-trigger, gate/envelope follower
  - Keyboard: None
  - Memory: Internal flash memory
  - Control: MIDI Out
  - Controls: Removable antenna rod, drum trigger pad input, manual trigger button
