details: |-
  Erica Synths Bass Drum is developed in collaboration with the French company e-licktronick and is Erica Synths' take on analogue bass drum circuits adapted for modular systems. Massive, punchy sound, Accent and CV control over key parameters of the module make it distinctively expressive in live performances.

  The panel carries Pitch, Tune and Tune Depth controls, CV control with attenuators over Pitch, Decay and Drive, a manual trigger and an Accent input for better expression.

  On this run of modules the Pitch and Decay CV inputs are inverted, so rising CV will decrease pitch and falling CV will increase it.

  Decay range spans 400ms to 2200ms, the audio output runs -5V to +5V and CV level covers -5V to +5V across the full span. Trigger level is 5V with a trigger time of 1ms, and Accent CV level is 10V. The module is 14HP wide and 35mm deep, drawing 40mA@+12V and 30mA@-12V.
specs: |-
  - Decay range 400ms - 2200ms
  - Audio output level -5...+5V
  - CV level (full span) -5V - +5V
  - Trigger level 5V
  - Trigger time 1ms
  - Accent CV level 10V
  - Power consumption 40mA@+12V, 30mA@-12V
  - Module width 14HP
  - Module depth 35mm
  - Pitch, Tune and Tune Depth controls
  - CV control with attenuators over Pitch, Decay and Drive
  - Manual trigger
  - Accent for better expression
