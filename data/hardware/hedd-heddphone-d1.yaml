description: The world's first dynamic-driver headphone with a Thin-Ply Carbon
  Diaphragm (TPCD), an open-back over-ear reference headphone made in Berlin.
details: |-
  The HEDDphone D1 combines HEDD's four decades of acoustic expertise with advanced material science developed in collaboration with Swedish specialists Composite Sound. It is the world's first dynamic-driver headphone built around a Thin-Ply Carbon Diaphragm (TPCD), delivering studio-quality clarity, realism, and tonal integrity.

  The TPCD technology uses ultra-thin carbon layers of the kind originally applied in Formula 1 racing and NASA's Mars Ingenuity helicopter. The material eliminates traditional diaphragm damping, enabling faster, cleaner transients and more accurate performance from the custom dynamic driver.

  The open-back circumaural design provides natural spaciousness and an immersive soundstage. With a moderate 32 ohm impedance and high 100 dB sensitivity, the D1 performs consistently from portable players through to dedicated amplifiers, scaling gracefully with premium equipment. Lightweight construction and perforated velour ear pads support fatigue-free listening.

  The headphone is designed and made in Berlin, fully serviceable, and backed by a 5-year warranty after registration.
specs: |-
  - Design: open-back over-ear headphone
  - Driver: dynamic with Thin-Ply Carbon Diaphragm (TPCD)
  - Impedance: 32 ohm
  - Sensitivity: 100 dB at 1 mW
  - Frequency response: 5 Hz to 40 kHz
  - Weight: 350 g (net)
  - Ear pad material: perforated velour
  - Cable: TRS 3.5 mm textile-covered premium cable, 2 m length
  - Connectors: dual 3.5 mm mono inputs (one per earcup), 6.35 mm adapter included
  - Origin: designed and made in Berlin
  - Warranty: 5 years (after registration)
