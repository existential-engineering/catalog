description: A 4HP Eurorack output module that converts modular-level signals to
  line level for studio mixers, active speakers, audio interfaces, recorders,
  and pedals. It provides balanced 6.35mm TRS line outputs and a dedicated
  stereo headphone amplifier with independent volume control.
details: |-
  Ether is a 4HP output module, the bridge from your
  eurorack system to professional recording and live
  environments. A compact, effortless, crystal-clear,
  and reliable connection to the outside world, matching
  high-end DI box performances. Eurorack levels are too high for most audio gear. Ether
  is calibrated for studio mixers, active speakers, audio
  interfaces, recorders, FX pedals, and headphones. It
  provides balanced 6.35 mm TRS line-level outputs and
  a dedicated 6.35 mm stereo headphones amplifier, with
  independent volume control. Staying true to our DNA, we draw from forgotten past
  to innovate. While many premium solutions rely on rare,
  expensive transformers, we took inspiration from a
  vintage French military radio circuit made for maximum
  signal integrity using stable, time-proven components. The core of the original design is a 1972 op-amp that
  looks modest on paper but performs exceptionally well
  with precisely tuned resistor and capacitor values. We
  adapted the circuit for modern, reliable op-amps while
  preserving the strengths of the original design, achieving
  some of the lowest noise and distortion levels in eurorack.
