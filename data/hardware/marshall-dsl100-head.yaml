description: The DSL100 Head is an all-valve 100W guitar amplifier head from
  Marshall's DSL (Dual Super Lead) range, delivering legendary Marshall tone in
  a versatile format suited to rehearsal rooms, stages, and home use. It offers
  two gain channels (Classic Gain and Ultra Gain) with dedicated master volume
  controls, and each channel can move between two voicings so players can shape
  a wide tonal palette from clean Marshall sparkle through bluesy crunch and
  into modern high-gain territory. A power-reduction switch drops the output
  from 100W down to 50W to retain valve feel at lower volumes, while MIDI
  control allows the amp to be operated alongside other MIDI-equipped gear in a
  larger rig. The rear panel provides five speaker outputs for flexible cabinet
  matching.
