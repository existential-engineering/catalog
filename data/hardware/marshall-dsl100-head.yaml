description: The DSL100 Head is an all-valve 100W guitar amplifier head from
  Marshall's DSL (Dual Super Lead) range, delivering legendary Marshall tone in
  a versatile format suited to rehearsal rooms, stages, and home use. It offers
  two gain channels (Classic Gain and Ultra Gain) with dedicated master volume
  controls, and each channel can move between two voicings so players can shape
  a wide tonal palette from clean Marshall sparkle through bluesy crunch and
  into modern high-gain territory. A power-reduction switch drops the output
  from 100W down to 50W to retain valve feel at lower volumes, while MIDI
  control allows the amp to be operated alongside other MIDI-equipped gear in a
  larger rig. The rear panel provides five speaker outputs for flexible cabinet
  matching.
details: |-
  The DSL100 Head has two gain channels to produce that legendary Marshall sound with rich functionality for those who require flexibility and unquestionable quality. This amp can move between two sounds within each gain channel, so that you can create and release your style through sound.

  Tailor your volume to your preference. Select either a commanding 100W or a more restrained 50W power output with a simple flick of a switch. Ideal for seamlessly transitioning from the rehearsal space to the comfort of your living room and vice versa.

  Elevate your solo performance with the added advantage of not one, but two master volume controls. Having complete command over your sound dynamics lets you effortlessly showcase your talent.

  The amp's functionalities are accessible through various MIDI devices, allowing skilled players to operate the amp alongside different MIDI equipment simultaneously.

  Boasting five speaker outputs, this amp provides an abundance of tonal possibilities. Altering the speaker configuration significantly influences the amp's sound, allowing you to have full control over your sound. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: DSL100HR
  - Range: DSL
  - Technology: All-valve
  - Channels: 2, each with 2 modes
  - Output wattage: 100W (with power reduction option to 50W)
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), 1 x 1/4" jack emulated line out
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5mm jack aux in, MIDI in, footswitch
  - Controls: Classic gain channel (gain, volume, clean/crunch switch), ultra gain channel (volume, gain, OD1/2 switch), treble, middle, bass, tone shift switch, presence, resonance, reverb (classic gain channel), reverb (ultra gain channel), master select switch, master volume I, master volume II, loop on/off switch
  - Effects: Digital reverb
  - Effects loop: Yes, 1 x series switchable
  - Preamp valves: 3 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 4 x EL34
  - Weight: 24.2 kg / 53 lb
  - Width: 740 mm / 29.1"
  - Height: 274 mm / 10.8"
  - Depth: 242 mm / 9.5"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90012 footswitch included, detachable power cable included
