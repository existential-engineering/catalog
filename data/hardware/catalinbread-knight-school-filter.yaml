details: |-
  If you've ever heard a synthesizer in action, chances are you've heard of a low-pass filter, a powerful tone-sculpting tool whose nuts and bolts increase exponentially as utility increases linearly. Found on even the earliest examples of analog synthesis, the low-pass filter establishes a cutoff frequency, and then rejects all frequencies above it at an intensity determined by the filter's construction. The Knight School Filter takes that guesswork out of the picture, letting you define your own cutoff frequency with an aggressive filter design. A resonance control lets you dial in the amount of "synthiness" by feeding the output signal back into the front end. A gain control dials in some grit on the front end to drive the filter harder. This filter design absolutely excels when stacked behind your favorite dirt or mod pedal; a hotter signal gets completely swallowed by the filter for even more synth-like textures. Try a fuzz in front for some serious Zappa tones!

  The Filter puts this synth-like control right at your feet, giving you a Resonance control (also known as "feedback") for a more intense filtering experience, as well as an onboard Gain control to add some grit to the signal. It sounds absolutely dynamite when stacked with your favorite dirt box.
specs: |-
  - Stripped-down state-variable low-pass filter
  - Cutoff range: about 280Hz to about 9kHz
  - Controls: Filter, Gain, Resonance
  - Resonance feeds the output back into the front end and does not self-oscillate
  - Accepts a 9V center-negative DC power supply
