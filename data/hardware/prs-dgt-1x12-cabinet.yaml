details: |-
  The PRS DGT 1x12 cabinet features a Celestion Vintage 30 speaker so it can handle high-output with vintage tone and style. With warm low-end, rich, vocal midrange, and detailed top-end, it is the perfect pair for the PRS DGT 15 head. The ported back adds expressiveness to the tone, keeping your sound from any boxiness, and the blonde tolex covering with salt & pepper grill cloth and PRS signature logo make for a handsome cabinet as well.
