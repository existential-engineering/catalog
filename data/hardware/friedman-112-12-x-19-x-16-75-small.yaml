details: |-
  The Friedman 'small' 1x12 is a closed-back front ported cabinet which utilizes tongue and groove Baltic Birch construction to deliver the bass, mid response and great sound expected from a Friedman 1x12 inch cab.

  At the heart of the cab is a Celestion G12M-65 Creamback 16 ohm speaker. The G12M Greenback is perhaps the definitive vintage Celestion ceramic magnet guitar speaker. Developed in the mid-sixties, it was quickly adopted by players like Hendrix, Beck and Page, who typified the louder and more aggressive blues-rock playing styles that came to characterize that era.

  The higher power handling G12M-65 Creamback produces that familiar woody tone, making it ideally suited when both vintage and modern tones are desired. The increased power handling brings with it low end grunt complementing the warm and vocal mid range, crunchy upper mids and sweet, refined highs.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, capturing every ounce of valuable tone. This compact cabinet not only excels in the studio, but is also a complement for any stereo or wet/dry/wet rig. The Friedman 1x12 closed-back is handcrafted in the U.S.A. and designed to withstand the rigors of the road.
specs: |-
  - 1 x 12 inch closed back, front ported cabinet design
  - 1 x Celestion G12M-65 Creamback 16 ohm speaker
  - Nominal impedance: 16 ohms
  - Tongue and groove Baltic Birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Hand-crafted in the USA
  - Grille cloth and faceplate ordered to choice: Black, Silver/Black Weave, Gold/Black Weave, Vintage, Checked
  - Dimensions: 12 in (D) x 19 in (W) x 16.75 in (H)
  - Weight: 26 lbs
  - Passive cabinet, no mains power connection
  - Limited lifetime warranty
