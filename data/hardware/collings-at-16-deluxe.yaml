description: Built in limited quantities, this 16" archtop is designed to be
  played as an acoustic guitar. Based on 1920s American f-hole archtops, it
  delivers warm and balanced response with clarity, projection, and immediate
  response. The Deluxe version features a venetian cutaway, multiple black/white
  purflings, bound S-holes, and a stylized flared peghead. The fully hollow
  X-braced construction and fully carved premium figured maple body and solid
  spruce top make it equally at home in jazz, blues, and beyond.
details: |-
  The AT-16 Deluxe is a 16" fully hollow archtop electric guitar with a venetian cutaway, built in limited quantities. Its design draws from 1920s American f-hole archtops, featuring a fully carved solid spruce top and fully carved premium figured maple back and sides. The ebony fingerboard has a compound radius and medium nickel-silver frets. An adjustable ebony bridge and ebony tailpiece, gold Schaller tuners with ivoroid or ebony buttons, and a high gloss nitrocellulose lacquer finish complete the instrument. It ships with D'Addario EJ-17 strings and a deluxe hardshell case.
specs: |-
  - Construction: Fully hollow X-braced
  - Body: Fully carved premium figured maple
  - Top: Fully carved solid spruce
  - Neck: Premium figured maple
  - Fingerboard: Ebony
  - Fingerboard Radius: 14" - 26" compound
  - Nut Width: 1 11/16"
  - Scale Length: 25 1/2"
  - Frets: Medium 18% nickel-silver
  - Bridge: Adjustable ebony
  - Tailpiece: Ebony
  - Tuners: Gold Schaller with ivoroid or ebony buttons
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario EJ-17 (.013" - .056")
  - Body Width: 16"
  - Body Length: 20 1/2"
  - Body Depth: 2 7/8"
  - Total Length: 41 1/8"
  - Case: Deluxe hardshell
