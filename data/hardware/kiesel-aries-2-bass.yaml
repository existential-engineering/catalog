details: |-
  The A2 Bass brings a modern, progressive bass guitar to Kiesel's bass lineup. It is rooted in advancements from the custom shop, and a number of new features are introduced alongside it.

  Those improvements include the newly-designed Tritium bass pickups for a modern, progressive sound, and the Access rear-mounted output jack, located on the back of the bass to eliminate physical cable obstruction.

  New multiscale scale length options arrive with the model as well, running from 34" fixed scale up to 34" to 37" multiscale depending on the configuration chosen.

  Construction is bolt-on with a radiused neck heel, on an alder body with a tung-oiled maple neck carrying two high-strength carbon-fiber reinforcing rods and a fully-adjustable dual action truss rod. Electronics are 18V active/passive, with a master volume and push-pull active/passive switch, pickup blend and stacked concentric bass and treble.
specs: |-
  - Body: alder
  - Construction: bolt-on with radiused neck heel
  - Scale length options: 34" fixed, 34" to 35.5", 34" to 36", 34" to 37" multiscale
  - Bridge options: Hipshot A-Style bridge at .748" (19mm) or .64" (16.25mm) spacing, or Hipshot Triple Locking Solo Saddle bridge at .748" (19mm) or .64" (16.25mm) spacing
  - Dimensions range across configurations: 45.5" to 46.75" long, 1.7" to 1.75" thick, 12.5" wide
  - Neck: tung-oiled maple with two high-strength carbon-fiber reinforcing rods and a fully-adjustable dual action truss rod
  - Neck width options: 1.53", 1.76" or 2.02" at the nut, 0.77" to 0.78" thick at the 1st fret, 0.88" to 0.89" thick at the 12th fret
  - Fingerboard: ebony with a 14" radius
  - Frets: 24 medium-jumbo stainless steel, .103" wide x .048" tall
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Headstock: GT style bass headstock
  - Tuners: Kiesel Premium tuners, 20:1 ratio
  - Pickups: Kiesel Radium KRH Radius humbuckers; the page's prose also names newly-designed Tritium bass pickups
  - Electronics: 18V active/passive, master volume with push-pull active/passive switch, pickup blend, stacked concentric bass/treble
  - Hardware: chrome
  - Strings: Dunlop Super Brights
  - Weight: 7.5 lbs to 8 lbs depending on configuration
  - Output jack: the Access jack is rear-mounted on the back of the body
  - The 18V active electronics run on internal batteries, so the bass carries no power input jack
