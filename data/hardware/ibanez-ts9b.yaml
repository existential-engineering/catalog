description: Bass-optimized Tube Screamer with Drive, Mix, Bass, Treble, and
  Level controls — preserves the low end bassists need while keeping the feel
  and tone of the original TS9 overdrive.
details: |-
  The TS9B is equipped with controls that allow bassists to preserve the low-end frequencies they need, while still maintaining the feel and tone of the original Tube Screamer.

  A five-control layout (Drive, Mix, Bass, Treble, Level) lets bass players dial in just the right amount of overdrive without losing their fundamental, then blend dry and wet signal to taste. Made in Japan, with input on the right side and output on the left.
specs: |-
  - Controls: Drive, Mix, Bass, Treble, Level
  - Required Current: 10mA@9V
  - Power Supply: One 9 volt battery (006P) or external AC adapter (DC 9V, Center-negative)
  - Input on right side; Output on left side
  - Made in Japan
