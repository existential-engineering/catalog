description: Focusrite Scarlett 18i16 is the 4th generation of industry-leading
  USB audio interfaces; including RedNet converters and four Focusrite mic
  preamps.
details: |-
  Complete portable studio hub for producers featuring four preamps, instrument connectivity for guitars/synths, expandable I/O via ADAT/S/PDIF, independent headphone mixes, Auto Gain/Clip Safe functionality, and dual Air modes for console-style sound enhancement.

  Bundle includes Ableton Live Lite, Pro Tools Intro+, Cubase LE, and Hitmaker Expansion software.
specs: |-
  - A/D Resolution: 24-bit/192 kHz
  - Dynamic Range (D-A): 122dB
  - Mic Preamp Gain Range: 69dB
  - EIN (Noise): -127dBu (A-Weighted)
  - Supported Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Bus Powered: Yes (3A)
  - Simultaneous I/O: 20 x 18 (including Loopback)
  - Dimensions: 240mm W x 60.5mm H x 169.4mm D
  - Weight: 1.494 kg
