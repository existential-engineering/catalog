details: |-
  Drum mounting hardware has to do two things really well: hold up the drums and put them exactly where you want them. This specialized tom and cymbal stand is made from heavy gauge tubing with oversized tube joints to minimize wobble, and armed with a ball-and-socket adjustment for easy positioning.

  It includes 1/2″ diameter tom arms to work with DW TB12 brackets and a 934 Boom Cymbal arm. Using the auxiliary clamp or an available tom arm on any of the four basic tom stand models, the set-up can be upgraded by adding the SM934 or SM799.

  Plastic tube insulators inside the heavy gauge tubing are a necessity in recording situations to avoid rattling when drum mics are placed close to stands, and hinged memory locks at tube joints, cymbal arms and tripod leg assemblies guarantee repeatable, precise height settings every time.
specs: |-
  - Double tom stand with a 934 boom cymbal arm
  - SM934 tube with boom cymbal arm included
  - Heavy gauge tubing with oversized tube joints
  - Ball-and-socket adjustment
  - 1/2″ diameter tom arms for DW TB12 brackets
  - Auxiliary clamp accepts the SM934 or SM799
  - Plastic tube insulators to avoid rattling
  - Hinged memory locks at tube joints, cymbal arms and tripod leg assemblies
