  own weapon.
details: |-
  Thee Treble Overload revives the treble boost circuit from the limited-edition Thee Fuzz Warr Overload, packed with extra features and unleashed as its own pedal. It slices through any mix with razor-sharp precision, carving away bass to tighten your tone and bring definition to whatever sound you feed it, making your signal sound mean, bright, and alive.

  Armed with nearly 60dB of gain and a LIMIT control, it pushes from a cutting boost to crispy obliteration while keeping your output balanced with the band. It is dual mono, so it can process stereo chains and blast stereo reverbs, choruses, delays, keyboards, or drum machines into overdrive, and pairing it with a Death By Audio Fuzz War resurrects the Thee Fuzz War Overload sound. Part of the Destroyer Series, it carries the line's signature compact footprint, glowing vintage-style LED display, and tour-grade build quality.

  BOOST adjusts the gain from a sharp +17dB to an extreme +52dB, reaching distortion territory for a gnarly edge. LIMIT sets the maximum output volume, so cranking BOOST and lowering LIMIT gives a controlled output level with high distortion. TRS inputs and outputs support mono operation with a standard TS cable or fully independent stereo with a TRS cable.
specs: |-
  - Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel. Death By Audio's RAW POWER power supply is recommended for optimal performance.
  - Current Draw: 23 mA
  - Dimensions: 5.16" x 2.76" x 2.38" (including hardware)
  - Weight: 9.1 oz.
