description: A passive 2hp Eurorack module with three independent performance
  mute switches for cutting audio or CV signals with a click.
details: |-
  I know what you want: you want to make something go silent, fast. You want nice, tactile clicky goodness. You want half the size, half the price and exactly as much utility - and buddy, you've found it. Introducing the Apnea 3, 3 mutes that'll make your patch go dead quiet in the click of a button. No funky clicks, no weirdness, just a kill switch that kills your incoming CV or audio signal, ready to be revived with another click of the button - and did I mention it's 2hp? Did I mention it's passive and draws no power? Did I mention it's skiff friendly? Did I mention it's really nice and also good? Finally, the unit is designed to be turned either way, for maximum ergonomic pleasure and utility. Also an excellent gift for the unskilled modular musician.
