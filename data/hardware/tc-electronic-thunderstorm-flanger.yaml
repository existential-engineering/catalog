details: |-
  THUNDERSTORM FLANGER perfectly captures the classic analog flanger tones of yesteryear from subtle, tape-like sweeps and lush chorusing – to a no-holds barred flanger frenzy! Designed by guitarists around an all-analog, Bucket-Brigade Device (BBD), THUNDERSTORM FLANGER delivers the goods in an extremely affordable package – one that will elevate both your mood, and your music.

  Full-on Flanger-Fest

  Turning on THUNDERSTORM FLANGER is like driving a pink Cadillac down Rock ‘n’ Roll Boulevard – fueled by a bolt of lightning! Want luscious faux-chorus tones? You got it! How about some classic ‘60s psychedelic riffs? You got it! How about the guitar sound that made ‘80s rock history? You got that, too! No matter what you’re looking for: a slight warble; a squadron of F16s with their afterburners kicked on; or anything in-between, with this little beauty you’ll be burning down the house in no time. So if old-school flanger tones make your heart race – then THUNDERSTORM FLANGER is your neo-vintage rocket-sled.

  Buckets of Tone

  While some of our competitors’ pedals tend to disrespect your personal tone, THUNDERSTORM FLANGER knows it’s all about tone, and always lets the real you come through. And THUNDERSTORM FLANGER’s classic all-analog design provides extremely warm, super-inspiring three-dimensional tones – no matter where you set the dials.
