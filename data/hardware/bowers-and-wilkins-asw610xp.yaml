description: Performance 10-inch subwoofer that delivers the finishing touch -
  or finishing thump - to a hi-fi or home theater system for larger rooms.
details: |-
  ASW610XP is the most powerful subwoofer in the Bowers & Wilkins ASW Series, offered as the finishing touch to a hi-fi or home theater system in larger rooms. Like its siblings it is an active closed-box subwoofer system, so the sealed cabinet carries its own amplification.

  It shares the 250mm (10in) long-throw driver diameter of the ASW610, with a cone that combines paper pulp, Aramid fibre and resin for stiffness and accuracy. Bowers & Wilkins is explicit that a big driver is not enough on its own, and the shared ASW information sheet lists the difference: a 500W ICEpower Class D amplifier against the 200W fitted to the ASW608 and ASW610.

  That extra power shows in the quoted figures. Frequency response is +/-3dB from 25Hz to an adjustable 40 / 140Hz with the EQ in position A, and the frequency range reaches -6dB at 18Hz. Bass extension switches between -6dB at 18Hz in position A, 23Hz in B and 28Hz in C. Signal to noise is quoted as better than 80dB and input impedance as 33kOhm.

  The amplifier panel carries input level for line in, input level for speaker in, low-pass filter frequency for the line input only, low-pass filter bypass, bass extension, bass roll-off alignment, auto sense on and standby, and a phase switch. The low-pass filter is an active 4th-order design with a variable cut-off frequency.

  Inputs listed are a line in on RCA phono, a speaker in on binding posts and a 12v trigger on a 3.5mm jack, and the unit runs from the mains, drawing 98W in use and 1W in standby. The cabinet measures 325mm (12.8in) high without feet or spikes by 325mm (12.8in) wide, 348mm (13.68in) deep without grilles and 375mm (14.8in) including grilles and controls, and weighs 18.65kg (41.12lb). Cabinet finishes are Black and White, grilles Black or Grey.
specs: |-
  - Description: active closed-box subwoofer system
  - Drive units: 1 x 250mm (10in) paper / Aramid fibre cone long-throw
  - Frequency response: +/-3dB 25Hz to 40 / 140Hz adjustable (EQ at A)
  - Frequency range: -6dB at 18Hz and 25 / 140Hz adjustable (EQ at A)
  - Bass extension: -6dB at 18Hz (position A), -6dB at 23Hz (position B), -6dB at 28Hz (position C)
  - Amplifier: 500W ICEpower Class D
  - Technical features: input level (line in), input level (speaker in), low-pass filter frequency (line in only), low-pass filter bypass, bass extension, bass roll-off alignment, auto sense on / standby, phase switch
  - Low-pass filter: active 4th-order, variable cut-off frequency
  - Inputs: line in (RCA Phono), speaker in (binding post), 12v trigger (3.5mm jack)
  - Power consumption: 98W / 1W standby
  - Input impedance: 33kOhm
  - Signal / noise: >80dB
  - Dimensions: height 325mm (12.8in) not including feet or spikes, 337mm (13.3in) including feet, 353mm (13.9in) including spikes; width 325mm (12.8in); depth 348mm (13.68in) not including grilles, 375mm (14.8in) including grilles and controls
  - Net weight: 18.65kg (41.12lb)
  - Cabinet finishes: Black, White
  - Grille finishes: Black, Grey
