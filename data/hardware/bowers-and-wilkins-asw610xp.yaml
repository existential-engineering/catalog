description: Performance 10-inch subwoofer that delivers the finishing touch -
  or finishing thump - to a hi-fi or home theater system for larger rooms.
details: |-
  The ASW610XP is the performance 10-inch subwoofer in Bowers & Wilkins' ASW Series, designed to deliver deep, controlled bass for hi-fi and home theater systems in larger rooms. It pairs a 250mm (10-inch) paper/aramid fibre cone long-throw driver with a built-in amplifier in an active closed-box cabinet for clean, articulate low-end extension.

  Frequency response is rated at 25Hz - 40/140Hz (±3dB, EQ at A), with bass extension reaching down to -6dB at 18Hz in the most extended EQ setting. Three selectable EQ alignments (A, B, C) let the user tailor the roll-off character to suit different rooms and listening preferences.

  An active 4th-order low-pass filter with a variable cut-off frequency allows precise integration with main speakers, while a phase switch and bypass option provide further system-matching flexibility. Auto sense/standby behavior keeps the subwoofer in a 1W idle state when no signal is present.

  Connectivity includes a line-level RCA Phono input, speaker-level binding post inputs, and a 3.5mm 12V trigger jack for system automation. Controls cover input level for both line and speaker inputs, low-pass filter frequency, bass extension, roll-off alignment, and phase.

  The cabinet measures 325mm wide by 325mm tall by 348mm deep (without grilles) and weighs 18.65kg (41.12 lb). It is available in Matte Black and Matte White finishes with Black or Grey grille options.
specs: |-
  - Driver: ø250mm (10 in) Paper/Aramid fibre cone long-throw
  - Cabinet Type: Active closed-box subwoofer system
  - Amplifier Power: 98W (1W standby)
  - Frequency Response: ±3dB 25Hz - 40/140Hz adjustable (EQ at A)
  - Frequency Range: -6dB at 18Hz and 25/140Hz adjustable (EQ at A)
  - Bass Extension: -6dB at 18Hz (A), 23Hz (B), 28Hz (C)
  - Input Impedance: 33kΩ
  - Signal/Noise Ratio: >80dB
  - Low-pass Filter: Active 4th-order with variable cut-off frequency
  - Controls: Input level (line/speaker), low-pass filter frequency, bypass, bass extension, roll-off alignment, auto sense/standby, phase switch
  - Height: 325mm (12.8 in) without feet; 337mm (13.3 in) with feet; 353mm (13.9 in) with spikes
  - Width: 325mm (12.8 in)
  - Depth: 348mm (13.68 in) without grilles; 375mm (14.8 in) with grilles
  - Net Weight: 18.65kg (41.12 lb)
  - Cabinet Finishes: Matte Black, Matte White
  - Grille Finishes: Black, Grey
