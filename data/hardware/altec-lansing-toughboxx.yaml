details: |-
  The Altec Lansing ToughBoxx is a rugged, high-performance Bluetooth speaker designed for any adventure. With 70W peak power, a 6.5" woofer, and a 2.5" tweeter, it delivers powerful sound. Its IPX5 waterproof rating makes it durable for outdoor use, while 18 hours of playtime keeps the music going all day. Party Sync lets you connect 100+ speakers for enhanced sound, and the LED display and FM radio add extra features. With a built-in carry handle, the ToughBoxx is portable and ready for any adventure.
