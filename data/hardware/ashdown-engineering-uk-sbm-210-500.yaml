description: UK-built, Ice Blue 500-watt 2x10" bass combo inspired by the
  acclaimed Studio series. Lightweight and powerful, it delivers 250 watts into
  its internal speakers and expands to 500 watts when paired with an 8-ohm
  external cabinet. Featuring premium Sica NEO speakers with an Eminence
  tweeter, Tweeter and Speaker Mute switches, onboard Overdrive, FX Loop,
  Balanced DI, and Headphone Out, it is finished in Charcoal Tweed with a Silver
  Weave grill for clean, modern performance with classic Ashdown style.
details: |-
  The Ashdown UK-SBM-210-500 delivers 250 watts into its internal speakers, expanding to a full 500 watts when paired with an 8-ohm external cabinet. This flexible power design gives the headroom needed for rehearsals, studio sessions, and live performance in a lightweight, UK-built combo inspired by the Studio series. Equipped with dual Sica NEO 10" speakers and an Eminence tweeter, it delivers articulate lows, tight midrange punch, and crisp highs. A rich, musical tube-emulated Overdrive circuit shapes tone, an FX Loop allows pedal integration, and a Balanced DI Output provides a reliable signal for front-of-house or recording. A dedicated Headphone Out supports silent practice, while integrated Tweeter and Speaker Mute switches give additional output control. A Passive/Active switch with a -15dB pad matches active instruments, and a footswitch jack controls Drive in and out.
specs: |-
  - Power output: 250 watts into internal speakers
  - Power output: 500 watts with an 8 ohm external cabinet
  - Speakers: 2 x Sica NEO 10" with Eminence tweeter
  - Input impedance: 1 Meg ohm
  - Input signal range: 100 mV to 10 V
  - Passive/Active switch with -15 dB input pad
  - Pre-shape EQ switch
  - Pre-Gain control
  - Tube-emulated Drive control
  - EQ: Bass +/-15dB, Lo-Mid +/-15dB, Middle, Hi-Mid +/-15dB, Treble +/-15dB
  - Master Volume control
  - Weight: 16.98 kg
