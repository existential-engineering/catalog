description: Born out of real-world necessity, this tool, the first of its kind,
  was created to bring back the analog sound-quality, feel and headroom that
  were missing from the digital mixing environment, while maintaining the fast
  DAW workflow, editing and recall capabilities that we all depend on.
details: |-
  Through cutting-edge analog audio circuit design the 2-BUS allows the full potential of your studio to be realized, audibly, in terms of sound quality, spatial detail and headroom, and ergonomically in terms of outboard equipment integration in the mix process. Designed and built with the highest quality components and a no-compromise attitude, this pristine audio path delivers nuance, depth and clarity to your mix without any added coloration.

  The Dangerous 2-BUS is a 16x2 summing device: much like traditional vintage consoles that brought together multiple channels of audio, it receives 16 analog outputs from any DAW interface and combines them to stereo. This is its sole purpose, and it performs transparently and musically.

  True summing devices have no individual volume controls, pan pots or aux sends. Those functions are performed by the recording software to leverage automation and recall on demand; running audio through unnecessary electronics lowers performance.

  By routing individual mono tracks or panned stereo subgroups out of the DAW via multiple D/A converters into the 2-BUS's 16 inputs, engineers report more detail and a faster, better mix. Up to eight 2-BUS or 2-BUS LT units can be linked together to create a 128-in by 2-out analog summing mixer.
specs: |-
  - Frequency Response: 1 Hz-100 kHz within 0.1 dB
  - Total Harmonic Distortion: 0.0045% @ +4 dBu input level, 0.0008% @ +22 dBu input level
  - Intermodulation Distortion: 0.0055% @ +4 dBu, 0.0015% @ +22 dBu
  - Crosstalk: > 101 dBu
  - Noise floor: < -83 dBu total energy in audio band
  - Max level: +28 dBu
  - Nominal operating level: +4 dBu (1.228 volts)
  - Input impedance: 25k ohm balanced
  - Output impedance: 50 ohms balanced (600 ohm drive capable)
  - Gain accuracy: > 0.02 dB @ 1 kHz for any gain setting
  - Power consumption: 30 watts
  - Massive punch and detail
  - Clear stereo imaging
  - Incredible headroom
  - Effortless outboard gear integration
  - Stepped attenuator volume control
  - Custom built linear power supply
  - Fully linkable with 2-BUS, 2-BUS LT and D-BOX
  - Hand assembled in the USA
  - 90-day standard warranty, plus free 2-year extended warranty with online registration
