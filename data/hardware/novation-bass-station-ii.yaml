description: The Novation Bass Station II is a pure analog monosynth that builds
  on the legacy of the classic original Bass Station from the 90s, but with a
  completely re-worked and enhanced design.
details: |-
  The Bass Station II features two analog oscillators, a sub-oscillator for
  extra low-end weight, and a flexible modulation section with two lfos and two
  envelopes. The classic multi-mode filter can be switched between low-pass,
  high-pass, and band-pass modes, and can be overdriven for aggressive and
  distorted sounds.

  The Bass Station II is a hands-on and intuitive synthesizer that is perfect
  for both studio production and live performance. The front panel is packed
  with knobs and sliders, giving you immediate control over all the key
  parameters.

  The 25-note velocity-sensitive keyboard has aftertouch, allowing for
  expressive and nuanced playing. The onboard arpeggiator and step sequencer are
  great for creating rhythmic and melodic patterns, and the patch memory allows
  you to save and recall your favorite sounds.

  The Bass Station II is a modern classic that delivers the sound and feel of a
  true analog synthesizer.
specs: |-
  - Pure analog monosynth
  - Two analog oscillators
  - Sub-oscillator
  - Multi-mode filter (low-pass, high-pass, band-pass)
  - Filter overdrive
  - 25-note velocity-sensitive keyboard
  - Aftertouch
  - Two LFOs
  - Two envelopes
  - Arpeggiator
  - Step sequencer
  - 64 factory presets
  - 64 user patch memories
  - External audio input
  - MIDI I/O
  - USB connectivity
  - AFX mode
