url: https://deathbyaudio.com/products/xcolorway-soundwave-breakdown
description: A fuzz pedal using backwards-wired matched transistors to produce
  fuzz, buzz, grind, octave, and oscillation sounds controlled by Square Wave
  and Sine Wave knobs.
details: |-
  MYSTERY FUZZ OCTO GENERATOR The Soundwave Breakdown takes the idea of a screaming fuzz pedal and turns it inside out, utilizing specially matched transistors turned backwards to get its bombastic sound. The exact positions of the knobs yield completely different sounds, ranging from fuzz, buzz, and grind, to bleeps, synth sounds, etc. A vast universe of gnarliness is yours, with octaves, oscillations, and overtones waiting just behind your next solo. Be forewarned, it's only grizzled psycho fuzz all the time. Controls Square Wave (You don't want to know) Sine Wave (You don't need to know) Volume Knob Controls the output volume of the effect (You know this one) Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 1 mA Physical Details Dimensions: 4.86" x 3.67" x 2.06" (including hardware) Weight: 13 oz.
