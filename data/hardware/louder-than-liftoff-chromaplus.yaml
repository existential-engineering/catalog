description: The Chroma+ is a stereo/dual-mono tracking and mixing channel strip
  featuring Twin Tone-Amp architecture and Tone Shaping EQ derived from the
  Silver Bullet circuits. It functions as both a bus processor and
  mic/instrument preamp, designed for hybrid studio workflows. Each channel
  accepts one mono Colour Module for additional analog processing.
details: |-
  The Chroma+ features selectable Mojo Amps with American (A) or British (N) inspired topologies, switchable between Mic and Mix/Line/Instrument modes. Gain ranges are 0–52 dB in Mix/Line mode and +8–60 dB in Mic mode (with high gain mode). 48V phantom power and polarity reverse are included. A Baxandall tone boost EQ handles Low and High frequency shaping, with a Vintage mode for softened high-frequency response. Front panel auto-switching stereo DI inputs support Retro Mode for vintage-style loading. Mega Mono mode cascades CH 1 into CH 2 for maximum drive. Each channel has one Colour-compatible analog plugin slot for Colour Format modules. Power is provided by a Hypermatter ultra-low noise power supply. Discrete audio path uses custom American transformers, ROGUE FIVE discrete op amps, Nichicon HE and Panasonic FR premium capacitors, and 0.5% thin-film resistors. Available in four preset flavors: Tube (valve saturation + 2-band EQ), Comp (FET compression), EQ (midrange boost/cut, HPF, LPF), and Standard (user-selectable Colour modules). Designed and assembled in Silicon Valley, California.
specs: |-
  - Mic or Mix/Line/Instrument mode
  - 48V phantom power
  - Polarity reverse
  - Mix/Line/Instrument Gain: 0 to +26 dB, +26 to +52 dB (High Gain mode)
  - Mic Gain: +8 to +34 dB, +34 to +60 dB (High Gain mode)
  - Optimized input impedance to reveal full potential of ribbon and dynamic mics
  - Colour Drive: -6 to +18 dB
  - Colour Mix: crossfade blend of processed and dry signal
  - Feeds entire Chroma signal path for full MOJO Amp amplification and Colour slot processing
  - Retro Mode alters loading and frequency response for a rounder tone
  - DI input gain = +10 dB, selectable via internal jumper to 0 or +20 dB
  - DI 2 input can be configured as a THRU jack via internal jumper
  - LF (+3 dB): Pultec-inspired Subsonic (30 Hz) and Bass (60 Hz) frequencies
  - HF (+4 dB): Presence and Air frequencies
  - Vintage: softens high frequency response to emulate vintage British consoles
  - Custom American made transformers
  - ROGUE FIVE discrete op amps designed by Louder Than Liftoff, conforming to standard 2520 footprint
  - Nichicon HE and Panasonic FR electrolytic capacitors
  - Wima polypropylene film capacitors
  - Thin film 0.5% resistors
  - Audiophile grade op amps, class A biased
  - CIT and Alps pushbutton switches
