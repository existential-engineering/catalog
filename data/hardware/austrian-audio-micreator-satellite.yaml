details: |-
  The MiCreator Satellite is a compact TRRS condenser microphone designed as a companion to the MiCreator Studio. It features the same custom cardioid condenser capsule, ensuring sonic consistency across dual-channel setups.

  The Satellite connects to the MiCreator Studio via a TRRS 3.5mm link cable, enabling stereo recordings, interviews, and dual-source capture. A built-in TRS 3.5mm headphone jack provides zero-latency monitoring.

  Swivelable design supports flexible positioning for desktop, stand, or handheld use. Compact and portable form factor suitable for both studio and mobile recording.
