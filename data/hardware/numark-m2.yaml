name: M2
manufacturer: numark
primaryCategory: mixer
url: https://www.numark.com/product/m2
description: M2 is a two-channel DJ scratch mixer with all the essentials to hit
  the stage in Numark style.
specs: |-
  - Two-channel DJ scratch mixer
  - Switchable phono/line inputs for turntables and CD players
  - Mic input with dedicated EQ and gain
  - Headphone output with crossfader-style cueing
  - Three-band EQ on each channel
  - Gain control per channel
  - Crossfader with reverse and slope controls
  - Replaceable crossfader
  - Dimensions: 11.4" x 9.5" x 3.6"
  - Packaged weight: 8.8 lbs
