url: https://sonicware.jp/products/liven-mega-synthesis
description: LIVEN MEGA SYNTHESIS is a retro game-music composer that recreates
  the sound of the world's first 16-bit console. It combines FM, PSG, and PCM
  sound modules across a 6-track sequencer, with 10 effect types and a sound
  bank contributed by composer Yuzo Koshiro.
details: |-
  A complete reproduction of the legendary sound of the world's first 16-bit game console. LIVEN MEGA SYNTHESIS is a retro game music composer developed with renowned composer Yuzo Koshiro. It fully recreates the legendary sound of the world's first 16-bit video game console from the late '80s, and lets you create diverse game music with a sophisticated 6-track sequencer and 10 types of effects. Yuzo Koshiro, known for "Ys", "The Streets of Rage" and "Etrian Odyssey", has contributed a sound bank and patterns.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - FM sound module (tracks 1-3): 4 operators, 8 algorithms, 6 voices, sound editing in FM Edit mode
  - PSG sound module (tracks 4-5): 11 types of basic waves and noise, 4 voices
  - PCM sound module (track 6): 8-bit, 12/24/48kHz (switchable) linear PCM sampling (mono), 3 voices (1 voice in one-shot mode), up to 8 seconds per sample (12kHz), 4 seconds (24kHz), or 2 seconds (48kHz)
  - 96 sample memory slots (16 x 6 banks)
  - Effects: Send Delay, Insert Delay, Reverb, Crusher, Distortion, Compressor, Low Pass Filter, High Pass Filter, Isolator, Remix Performance effect (send amount independent per track)
  - Sequencer: 6 tracks, up to 128 steps, 128 patterns, parameter locking
  - I/O: MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT, headphone out
  - Size: 11.7 in (W) x 6.92 in (D) x 1.89 in (H), 297mm x 176mm x 48mm
  - Weight: 1.74 lb, 790g
  - Accessories: Warranty, overlay sheet for FM synthesis editing
  - Power supply: AA batteries x 6, or 9V DC AC adapter (EIAJ3, center positive, not included)
