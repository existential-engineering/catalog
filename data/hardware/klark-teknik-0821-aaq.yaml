description: The DN360F is the fully transformer-isolated configuration of the
  DN360 dual 30-band graphic equaliser, with balanced transformer stages on both
  inputs and outputs and XLR connectors wired pin 3 hot. Full transformer
  isolation suits broadcast facilities, complex installed-sound systems and any
  environment where ground-loop integrity and common-mode rejection cannot be
  compromised.
details: |-
  Balanced transformer stages sit on both the inputs and the outputs, with industry-standard XLR connectors configured pin 3 hot. Full transformer isolation is the gold standard for broadcast facilities and complex installed-sound systems.

  The processing core is unchanged from the DN360 reference: dual 30-band Proportional-Q analogue graphic equalisation. The characteristic is wide and musical at small fader movements, narrowing to surgical precision as cuts and boosts deepen.

  An 18 dB/octave low-cut filter per channel handles subsonic rejection.

  The 3U chassis carries 30 mm oil-damped precision faders with centre detents, channel bypass switches, graphic EQ scale selection, power-off bypass relays, and the transformer-balanced XLR I/O wired pin 3 hot that defines the F variant.

  Although obsolete, the DN360F remains the reference for fully-isolated analogue graphic equalisation, with legacy support continuing through Music Tribe Care.
specs: |-
  - Dual channel, 30 band 1/3 octave graphic equalisation per channel
  - Proportional-Q filter response
  - Transformer-balanced inputs and outputs
  - Low-cut filter: 18 dB/octave, one per channel
  - 30 mm oil-damped precision faders with centre detents
  - Channel bypass switches and graphic EQ scale selection
  - Power-off bypass relays
  - XLR connectors wired pin 3 hot
  - 3U rackmount chassis
