description: Add-on horn-type super tweeter system designed for easy pairing
  with the GS103A-VB speaker system. Reissue of the long-running FT17H super
  tweeter (originally introduced 1986) housed in an English walnut finish
  enclosure with an integrated high-pass filter using CX-series condenser
  capacitors, so no external network components are required. Ships ready-to-use
  with speaker cables included.
details: |-
  Configuration: Horn-type super tweeter add-on system with integrated high-pass filter

  Features:
  - Reissue of FT17H horn super tweeter (originally 1986)
  - Integrated high-pass filter using CX-series condenser capacitors
  - No external network components required
  - English walnut finish enclosure (made in Japan)
  - MDF cabinet with olefin laminated sheet
  - Designed as add-on for GS103A-VB speaker system
  - Speaker cables included for plug-and-play setup

  Intended Pairing: GS103A-VB

  Country Of Manufacture: Japan
