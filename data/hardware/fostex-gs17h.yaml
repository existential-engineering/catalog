name: GS17H
manufacturer: fostex
primaryCategory: speaker
url: https://www.fostex.jp/en/products/gs17h/
description: Add-on horn-type super tweeter system designed for easy pairing with the GS103A-VB speaker system. Reissue of the long-running FT17H super tweeter (originally introduced 1986) housed in an English walnut finish enclosure with an integrated high-pass filter using CX-series condenser capacitors, so no external network components are required. Ships ready-to-use with speaker cables included.
details: |-
  Super tweeter system for easy enjoyment of add-on tweeters with the GS103A-VB. This super tweeter system is ideal for add-on use with the GS103A-VB premium full-range system. The English walnut finish gives a sense of unity as a bookshelf speaker system, and the addition of a high frequency component enhances the quality of the full-range sound of the GS103A-VB.

  Long-selling FT17H horn-type super tweeter. The FT17H, introduced in 1986, inherited the sharp and habit-free sound quality of its high-precision molded horn and aluminum diaphragm from its predecessor, the FT15H introduced in 1980, and has been supported as a long-selling super tweeter to this day.

  All-in-one design. The FT17H incorporates a CX series condenser as a high-pass filter, selected through a series of cut-and-tries in search of the best sound quality connection. This eliminates the need for network component selection and wiring. Setup is completed by placing the unit on the top panel of the GS103A-VB and connecting the included speaker cables to the terminals.

  English walnut tone enclosure produced in Japan, with the same finish as the GS103A-VB, creating a sense of high quality unity in the entire add-on system.
specs: |-
  - Impedance: 8 ohm (value before passing through the high-pass filter)
  - Frequency response: 4 kHz to 32 kHz (-10 dB)
  - S.P.L.: 76 dB/W (1 m) (value after passing through the high-pass filter)
  - Input: 30 W (NOM.)
  - High-pass filter cutoff frequency: 120 kHz (-6 dB/oct.)
  - Built-in CX series capacitor high-pass filter
  - Dimensions: 104 (W) x 96 (H) x 118.5 (D) mm
  - Weight: 685 g per unit
  - Material: MDF (finished with olefin laminated sheet)
  - Accessories: 2 speaker cables, instruction manual, safety precautions
  - Passive design, no power connection
