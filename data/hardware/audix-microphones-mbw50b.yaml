details: |-
  The MBW50B adds a wireless option to the popular Audix Microboom system. Needing only 5V to operate to full spec the MBW50B can plug into an Audix or other popular wireless body pack transmitters without any inline phantom power supply. The wireless body pack transmitter (not included) can be either mounted to the carbon fiber boom arm or mounted to the mic stand using the MBWFLEX.

  Weighing in at only 5oz and mounted to a standard straight mic stand a single MBW50B reaches to the top of a three tier riser and will cover a 20 person choir .
