description: >
  With an ultra-compact form factor, high-quality keybed, and intuitive controls, MicroLab mk3 is the perfect MIDI controller for producers working in small studios, on the go, or just starting their music production journey.
details: |-
  Microlab mk3 is an ultra-compact universal MIDI controller designed for producers working in small studios, on the go, or just starting their music production journey. It combines a high-quality velocity-sensitive keybed with intuitive controls in a minimal form factor, delivering responsive and expressive playing without compromise. The device is small, lightweight, durable, and USB-powered, making it ideal for mobile music-making and compact studio setups.

  The controller features a 25-note velocity-sensitive slim keyboard with responsive touch, complemented by 2 touch strips for intuitive pitch bend and modulation control. Four control buttons provide octave shift, chord mode, hold, and preset navigation capabilities, while chord mode allows players to activate full harmonies with a single key. A sustain or expression pedal can be connected for extended expressivity and enhanced performance options.

  Microlab mk3 offers seamless plug-and-play connectivity via USB-c with instant compatibility across all major daws and soft synths. The device includes analog lab intro with 500 curated presets from award-winning synth and keyboard libraries, plus ableton live lite for recording and music production. Multi client driver support for windows users ensures flexible integration, and the controller is compatible with ipads and android devices via adapter.

  The included software provides access to hundreds of synth and keyboard presets from analog lab v, v collection, and pigments libraries, offering everything from hard basses and lush leads to smooth keyboard sounds. Ableton live lite includes essential tools for recording, performing, and producing music with instrument presets, drums, fx, and MIDI clips. This comprehensive software bundle enables users to start making tracks immediately out of the box.
specs: |-
  - 25-note velocity-sensitive slim keyboard
  - 2-octave keybed
  - 2 touch strips for pitch bend and modulation
  - 4 control buttons
  - Octave shift
  - Chord mode
  - Hold function
  - Semitone transpose
  - USB-c connectivity
  - Bus-powered
  - MIDI class-compliant
  - Multiclient MIDI driver for windows
  - Compatible with ipads and android devices via adapter
  - Sustain pedal input
  - Expression pedal input
  - Ultra-compact form factor
  - 406 x 39 x 125 mm dimensions
  - 0.62 kg weight
  - Windows 10+ (64-bit) compatible
  - Mac os 11+ compatible
  - 4 gb ram required
  - 4 cores cpu 3.4 ghz minimum
  - 3gb free hard disk space required
  - Opengl 2.0 compatible gpu required
  - VST, AAX, audio unit compatible
  - Standalone operation supported
