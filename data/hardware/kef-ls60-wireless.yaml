name: LS60 Wireless
manufacturer: kef
primaryCategory: speaker
url: https://us.kef.com/products/ls60-wireless
prices:
  - amount: 5999.99
    currency: USD
description: |-
  A slim, plug-and-play wireless floorstanding loudspeaker system delivering
  high-fidelity sound up to 24bit/384kHz with tri-amped active design and
  integrated streaming.
specs: |-
  - Tri-amped active design: 500W Class D (LF) + 100W Class D (MF) + 100W Class AB (HF) per speaker
  - Uni-Q driver array: 19mm aluminum dome tweeter + 100mm aluminum midrange
  - Uni-Core force cancelling: 4× 135mm bass drivers per speaker
  - Frequency range (-6dB @ 85dB/1m): 26 Hz – 36 kHz
  - Frequency response (±3dB @ 85dB/1m): 31 Hz – 24 kHz
  - Maximum SPL: 111 dB @ 1m
  - Network input resolution: up to 24bit/384kHz
  - Wireless: Dual-band Wi-Fi (802.11a/b/g/n/ac), Bluetooth 5.0
  - Dimensions (with plinth): 1090 × 212 × 394 mm (42.9 × 8.3 × 15.5 in)
  - Weight: 62.4 kg (138 lbs) per set
  - Colors: Carbon Black, Titanium Grey, Royal Blue, Mineral White
