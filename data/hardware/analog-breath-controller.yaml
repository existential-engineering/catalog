details: |-
  The tecontrol bca is an analog breath controller, signal compatible with yamaha's discontinued breath controllers. This means it can be plugged directly into the 3.5 mm "breath" input jack of any compatible keyboard/synthesizer, for example the yamaha cs01, dx7, vl70-m, and several others from a variety of manufacturers.

  Compared to yamaha's bc3 breath controller, the bca contains a modern piezoelectric pressure sensor and a much improved signal conditioning circuit. The sensor is not only more sensitive but also free from drifts and hysteresis, which plagued the membrane sensor of the bc3.

  The offset and gain controls are more precise and, unlike the bc3, they are independent from each other: this means that changing gain does not affect offset and vice-versa.

  The bca is delivered with a flexible headset which allows bending to a comfortable shape and yet is springy enough to clamp around the head. The headset also includes a yamaha bc3-style mouthpiece with adjustable bleed valve that can be rotated away from the mouth when not in use.
specs: |-
  - Piezoelectric pressure sensor
  - Signal conditioning circuit
  - 3.5 mm breath input jack compatibility
  - Independent offset and gain controls
  - Flexible headset
  - Yamaha bc3-style mouthpiece
  - Adjustable bleed valve
