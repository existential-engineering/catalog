description: >-
  The Yamaha DX5 is a professional digital synthesizer positioned between the legendary
  DX7 and the flagship DX1. It features dual 6-operator FM synthesis engines, offering
  capabilities similar to having two DX7 synthesizers in one unit with enhanced
  performance memory and versatility. Produced from 1985 to 1987, it was designed as
  Yamaha's mid-range FM synthesis offering for live performance and studio use.
details: |-
  The DX5 was produced between 1985 and 1987 as Yamaha's mid-range FM synthesis offering. Internally, it shares nearly identical architecture with the DX1 but distinguishes itself by eliminating heavy wood paneling, using a standard keyboard without polyphonic aftertouch, and providing a more accessible price point.

  The synthesizer excels for live performance applications. It boasts 64 performance memories that can be loaded or saved to cartridge, substantially more than the DX7's single manual performance memory. This capacity enables sophisticated live setups where musicians can layer two different patches simultaneously using the bitimbral ability, playing bass in one hand and alternate sounds in the other while maintaining 16-voice polyphony in split or layer mode.

  Sonically, the DX5 produces unique and fresh tones with a character distinct from analog synthesizers. Programming demands understanding FM synthesis principles, which presents a steeper learning curve than traditional analog synthesis. The improved layout and parameter controls make navigation easier than comparable DX instruments, though FM fundamentals remain conceptually challenging.

  A notable limitation is that the MIDI implementation caps velocity at 99 rather than the standard 127, preventing full master keyboard functionality. The instrument has been utilized by notable musician Kitaro.
specs: |-
  - Dual 6-operator FM synthesis engines
  - 32-voice polyphony (16 in layer/split mode)
  - Bitimbral (2 simultaneous patches A and B)
  - 76-key keyboard with velocity and aftertouch
  - LFO with sine, square, triangle, sawtooth up, sawtooth down, and random waveforms
  - 6 envelope generators with 8 parameters each
  - 64 performance memories (32 ROM, 32 RAM)
  - External cartridge support
  - MIDI control
  - Produced 1985-1987
