description: DPA's selection of mics for the drum kit is designed specifically
  to put the sound engineer in control of the sound. By starting with the clear,
  true sound of the entire kit, the engineer has the best starting point to
  shape the sound wanted for the situation.
details: |-
  This kit has an upgraded case that is extremely stable and that has a special foam layout inside greatly simplifying assembly and disassembly and providing extra space for your gear. No need to take the mics apart to put them back in the case. The kit has also been updated with the newest versions of our mics and accessories – including CORE+ and MicroLock®.

  Capture the sublime, honest sound of the drum kit.

  Included microphones (per the page's Related Microphones for this kit):
  - 4055 Kick Drum Microphone
  - 4099 Instrument Microphone
  - 2012 Compact Cardioid Microphone
  - 2015 Wide Cardioid Microphone

  Included / related accessories:
  - DAD9001 Adapter: MicroLock to 3-pin XLR with Belt Clip
  - CM22 MicroLock Extension Cable, 2.2 mm, 1.8 m
  - D-CLIP Microphone Clip for Drum
  - UA0961 Microphone Holder for Pencil Microphones
  - DUA0020 Foam Windscreen for Pencil Microphone, Ø19 mm, Length 56 mm (2.2 in)
