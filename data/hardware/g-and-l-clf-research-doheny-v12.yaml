details: |-
  Explore new sonic territory in Leo's land.

  When the G&L Doheny was launched in 2017, its application of Leo's modern features was expected. The breathtaking versatility of its MFD single coil pickups, however, was a revelation, a guitar capable of delivering delicate, airy jangle all the way to thick, grindy single coil tones. Those pickups were painstakingly created by Johnny McLaren in the spirit of Leo's later work at CLF Research.

  The CLF Research Doheny V12 digs even deeper into the rapid pace of technical development that was the hallmark of Leo's CLFR years, with particular focus on his late '70s to early '80s development of MFD guitar humbuckers. With the benefit of decades of hindsight and unlimited access to Leo's technical work, brothers Dave and Johnny McLaren challenged themselves to create the most musical MFD guitar humbuckers ever to come from Fender Avenue. They set their sights even higher: to fulfill a vision Leo had for "end-to-end" humbuckers that would sound beautiful in series-humbucking, parallel-humbucking, and single coil modes. Pickups that would sit well in a variety of musical contexts, never short of either power or articulation. Pickups that would put a smile on Leo's face.

  Leo believed musicians could understand and benefit from more control over their instruments, and in his later years he was particularly interested in fundamental coil control. The reward can be a surprisingly versatile instrument, and that is why each of the Doheny V12's MFD humbuckers is individually controlled by a 3-way mini toggle with classic CLF color-coded switch tip, white for the neck pickup and red for the bridge pickup.

  The period styling continues with original CLF black crinkle powdercoating on a one-piece aluminum control plate and pickguard, a perfect backdrop for the exquisitely machined and chrome plated CLF knobs for volume, treble and bass. The Dual Fulcrum Vibrato features a CLF 3/16" machined stainless steel vibrato arm for a period look while benefiting from today's forged brass saddles and block. Put it all together, and the Doheny V12's gorgeous looks and bold, pioneering spirit make it an offset for the ages.

  Leo Fender founded CLF Research in 1966 and introduced the G&L brand in 1980. G&L USA instruments continue to be made in the historic CLF Research and G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
