description: Axe-Fx III is the world's most powerful Amp Modeler / FX processor.
  Featuring industry leading CYGNUS amp models, FullRes IRs, and much more.
details: |-
  The Axe-Fx III is Fractal Audio Systems' flagship rack processor, combining amp modeling, speaker cabinet simulation and a suite of stompbox and studio effects in a single 3U steel chassis. The current Mark II revision adds an IPS display with improved contrast and viewing angles, adjustable RGB LEDs behind the front panel logo, double the preset memory for a total of 1024 presets, increased flash memory for future updates, and an optional Turbo DSP module that raises the clock speed by 25 percent.

  Four separate processors drive the unit. Two floating-point Keystone DSPs form the main audio engine, running at 2 x 1.0 GHz as standard or 2 x 1.25 GHz with the Turbo module, fed by 4 Gb of PC1600 DDR3 memory, hundreds of Mb of flash memory and a proprietary FPGA. A dedicated graphics processor drives the animated 800 x 480 color display, and a 500 MHz 16-core microcontroller handles USB traffic and user interface tasks. Five push-encoders and a main encoder sit below the display, with an LED meter bridge reporting input and output status.

  Two instrument inputs are fitted, one on the front panel with Auto-Z input impedance modeling and one on the rear, switching automatically when a plug is inserted. Six further analog inputs cover one pair of balanced XLR and 1/4 inch combo jacks plus two pairs of balanced 1/4 inch inputs. Four fully independent stereo output pairs follow, with Output 1 on both XLR and 1/4 inch jacks, Output 2 on a second set of XLR jacks, and Outputs 3 and 4 on Humbuster 1/4 inch jacks for unity gain uses such as the four cable method.

  Digital audio runs over AES and SPDIF inputs and outputs, clocked internally or from either digital input. Two expression pedal inputs handle real-time control, and a FASLINK II jack carries phantom power and bidirectional communication with the FC-6 and FC-12 foot controllers over a standard XLR microphone cable. MIDI In, Out and a dedicated Thru let the unit act as the hub of a MIDI rig, and 8 in by 8 out USB audio connects it to a computer, with no driver needed on macOS 10.7.4 or newer.

  Amp modeling uses the Cygnus algorithms, with preamp and power amp sections modeled independently, four channels per Amp block and a parametric pre-EQ. The Cabinet block offers over 2200 factory UltraRes impulse responses alongside DynaCab simulations, a four-channel IR mixer derived from Cab-Lab, 2048 User Cab memories and a tone capture utility. Effects span 39 block types on a grid of six rows by 14 columns, including a Plex block with up to eight delay lines, a Pitch block for whammy, harmony and detune, a Real-Time Analyzer and a stereo looper with over five minutes of recording time.
specs: |-
  - Four separate processors, with two floating-point Keystone DSPs as the main audio engine at 2 x 1.0 GHz standard, or 2 x 1.25 GHz with the optional Turbo DSP module
  - 4 Gb PC1600 DDR3 memory, hundreds of Mb of flash memory and a proprietary FPGA
  - 500 MHz 16-core microcontroller for USB and user interface tasks, plus a dedicated graphics processor for the display
  - 800 x 480 color IPS display with a graphics accelerator for animated knobs, meters and graphs
  - Adjustable RGB LEDs for the color and brightness of the front panel logo
  - Five push-encoders plus a main encoder, and a front panel LED meter bridge
  - 1024 preset memories, eight scenes per preset and up to four channels per block
  - Routing grid of six rows by 14 columns, with up to six effects in parallel and four independent effect chains
  - 39 effect block types, including 259 amp model types and 2237 cab types
  - Over 2200 factory UltraRes impulse responses, including the Axe-Fx II IRs in a legacy bank
  - 2048 User Cab memories and 16 Scratch Pad locations for captured speaker tones
  - Four-channel cabinet mixer based on Cab-Lab, and a Tone Matching block that clones in UltraRes
  - Plex block with up to eight delay lines in a feedback arrangement
  - Stereo looper with over five minutes of recording time at full resolution, with overdub and undo
  - 8 in by 8 out USB audio, 16 channels total, with Windows 7/8/10 drivers included and no driver required on macOS 10.7.4 or newer
  - Internal or external clocking via the SPDIF or AES input
  - Burr-Brown SoundPlus and Analog Devices op amps, PPS film caps, a high-voltage bipolar power supply and Cirrus Logic converters with fully differential input and output circuitry
  - 3U steel chassis with an anodized aluminum front panel and an illuminated logo
  - Dimensions: 19.00 in (482.6 mm) wide, 5.16 in (131.1 mm) high, 11.530 in (292.87 mm) deep including front handles and rear jacks
  - Weight: 15 lbs 2.4 oz (6.87 kg)
