details: |-
  Press is a fully analog stereo compressor with features typically found only in professional studio gear but with additional controls used in modern VSTs, blending the tight, natural response of classic analog rack units with additional controls and features that cannot be found in other pedals. It offers stereo in/out so it no longer needs to be first in the signal chain, full analog transparent VCA compression with high headroom, and parallel compression without the phase issues of digital devices.

  Quality was the priority when designing Press. It is a transparent VCA compressor that preserves your tone without unwanted coloration. It packs all the controls needed for any scenario from limiting to subtle parallel compression, with separate attack and release, threshold and ratio controls, and sidechain highpass and lowpass filters for precise control. It suits guitars, synths, or drum machines.

  Press is designed as an end-of-chain compressor to glue a mix, pedalboard, or drum buss together. With TRS stereo I/O and tight, polished compression controlled by separate attack and release knobs, it works as an end-of-chain mastering device to control peaky reverb tails, noisy synths, or smooth out the volume from effects.

  Press features a unique stereo sidechain control not found in any other analog compressor pedal. The high and low pass filters work on either the stereo input or the external stereo sidechain thru. A Tilt EQ uses a single knob to boost highs and cut lows (or the reverse), active on the wet signal only. Construction is a sturdy all-aluminum body, including the knobs, in a small portable form factor.
specs: |-
  - Fully analog stereo VCA compressor
  - Stereo in/out (no longer required to be first in the signal chain)
  - Parallel compression (dial back the mix without digital phase issues)
  - Variable ratio from 2:1 compression up to limiting
  - Tilt EQ: single knob to boost highs/cut lows or boost lows/cut highs, active on wet signal only
  - Sidechain high and low pass filters
  - Internal or external sidechain (switchable via dedicated stomp-switch)
  - Separate attack and release controls
  - Threshold and ratio controls
  - Compact all-aluminum body including knobs
  - Max Input Level: 8 Vrms (18 dBV / 20 dBu)
  - Power: 9 V / 350 mA (power adapter not included)
  - Height: 2.24 inches (5.7 cm) with knobs
  - Width: 4.72 inches (12.0 cm)
  - Depth: 4.17 inches (10.6 cm)
  - Weight: 1.32 pounds (0.600 kg)
  - Impedance input: Line 20 kOhm / Instrument 1 MOhm
  - Impedance output: 100 Ohm
