description: The Knight School Synth turns your guitar signal into a square
  wave, and then uses the CD40106 to vary the pulse width of that square wave.
  There's also a switchable LFO, which automatically varies the pulse width for
  you, along with a Depth control to change the intensity of the shaping.
details: |-
  The Knight School Synth grew out of the CD40106 hex inverter, a chip that reached Catalinbread's designer through the "Heterodyne Peyote Space Explorer" project on the DIY site Beavis Audio. Combining the 40106 with a boost circuit produced an oddball noise that worked far better with a second boost circuit in front of it. Tim Escobedo had documented a form of the same circuit on his "Circuit Snippets" page back in 2002, and the pedal uses his method for producing the pre-gain, which is simpler and uses far fewer parts.

  Essentially, it turns your guitar signal into a square wave, and then uses the CD40106 to vary the pulse width of that square wave. There's also a switchable LFO, which automatically varies the pulse width for you, along with a Depth control to change the intensity of the shaping. It emulates the monophonic synthesizers of yesteryear.
specs: |-
  - Power source: 9V DC power supply, center-negative, at least 0.5mA
  - Controls: Rate, LFO toggle, Volume, Depth, Pulse
  - CD40106 hex inverter used to vary the pulse width of a squared guitar signal
  - Switchable LFO with Rate and Depth controls
  - Offered as a DIY kit or fully assembled
