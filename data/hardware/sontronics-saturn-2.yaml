specs: |-
  - Multi-Pattern Large-Diaphragm Condenser Mic : Offers nine selectable polar patterns including omnidirectional, cardioid, figure-of-8, supercardioid, and hypercardioid, along with 4 intermediary patterns, providing versatility for various recording applications.
  - Outstanding Sound Clarity : Delivers an exceptionally transparent and detailed sound, making it perfect for capturing vocals, instruments, ensembles, and more with pristine accuracy.
  - Versatile Application : Ideal for a wide range of recording tasks, from vocals and acoustic instruments to drums, choirs, and even full orchestras, due to its adaptable polar patterns.
  - Vintage-Inspired Design : Features a stunning retro-inspired body with a large, circular grille that not only looks iconic but also enhances the mic's acoustic performance.
  - High SPL Handling : Capable of handling high sound pressure levels (up to 140dB), allowing you to record loud sources like drums, brass, and guitar amps without distortion.
  - Class-A Electronics : Equipped with premium Class-A components that ensure low self-noise and a wide dynamic range, delivering a clean and precise sound.
  - Low Self-Noise : Engineered with ultra-low self-noise circuitry, making it ideal for capturing delicate and quiet sources without unwanted background noise.
  - Wide Frequency Response : Offers a wide and flat frequency response, ensuring accurate and balanced sound reproduction across the entire audio spectrum.
  - Perfect for Studio Professionals : Whether you're tracking vocals, recording instruments, or capturing complex soundscapes, the Saturn 2's versatility and quality make it a top choice for professional studios.
  - Vocals
  - Voiceover
  - Choir
  - Opera
  - Piano
  - Acoustic Instruments
  - Microphone type: Large-diaphragm multi-pattern condenser
  - Polar pattern: Nine including five main patterns (Omnidirectional, Subcardioid, Cardioid, Hypercardioid, Figure-of-Eight) plus four intermediate patterns
  - Frequency response: 20Hz to 20kHz
  - Sensitivity: 34mV/Pa
  - Impedance : ≤200 Ohms
  - Max. SPL (for 0.5% THD @ 1kHz): 130dB
  - Connector: 3-pin XLR connector
  - Power: 48V phantom power required
  - Product weight: 0.56 kg (0.83 kg with shock mount)
  - Packaged weight: 4.8 kg
  - Product dimensions: 285 x 150 x 32mm
  - Packaged dimensions: 450 x 400 x 180mm
  - Saturn 2 Microphone
  - Shockmount
  - ABS Flightcase
