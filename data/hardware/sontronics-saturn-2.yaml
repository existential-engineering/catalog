details: |-
  A multi-pattern large-diaphragm condenser microphone with 9 selectable polar patterns

  Designed, developed and built in the UK, the SATURN 2 has been completely redesigned from the inside out and now boasts nine polar patterns, British-made electronics, premium-quality components and precision-engineered parts, all of which combine to give you incredibly accurate recordings and a pristine response. SATURN 2 features a completely innovative digitally encoded controller, that allows you to select one of nine patterns shown on the front of the mic – omni, subcardioid, cardioid, hypercardioid, figure-of-eight – plus the four positions in between. This digital control ensures precise voltages being sent to the front and rear of the capsule, allowing for perfect matching between mics. With its high sensitivity, incredibly low self-noise, filter and PAD controls, and our signature smooth roll-off in the high end, SATURN 2 will be your go-to workhorse, whether you're recording vocals or piano, string quartets or solo brass, giving you mix-ready results and stunning sound. FEATURES

