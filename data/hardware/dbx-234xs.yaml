name: dbx 234xs
manufacturer: dbx
primaryCategory: filter
url: https://dbxpro.com/en/products/234xs
description: Stereo 2/3-Way, Mono 4-Way Crossover with XLR balanced connectors
  and Linkwitz-Riley 24dB/octave filters.
details: |-
  The dbx 234xs delivers professional-grade crossover performance with ultra low-noise operation and rugged reliability built on four decades of dbx expertise. By directing only specific frequency bands to each speaker driver, the unit frees amplifiers to concentrate full power on usable signals, eliminating distortion and producing cleaner, better sound in PA systems.

  This dual-channel crossover features Linkwitz-Riley 24dB per octave filters, independent output gain controls for level matching, output phase inversion, a 40 Hz low cut filter, and optional mono summing of low frequency subwoofer output. XLR connectors provide balanced professional connectivity throughout.

  The 234xs operates in stereo 2-way/3-way or mono 4-way configurations. CSA NRTL/C approved and CE compliant, with a 2-year parts and labor warranty.
specs: |-
  - Input Connectors: XLR
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+22 dBu
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: XLR
  - Output Impedance (Balanced): 60 ohm
  - Output Impedance (Unbalanced): 30 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >106 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range (Stereo): Low/Mid & Low/High: 45–960 Hz or 450–9600 Hz (×10); Mid/High: 450–9600 Hz
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100–120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 4.0 lbs (1.8 kg)
