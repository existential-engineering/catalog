  articulation well-suited for fingerstyle playing.
details: |-
  The K22ce is Taylor's all-koa Grand Concert model, combining a solid Hawaiian koa top with solid Hawaiian koa back and sides for a cohesive tonal character throughout. The Grand Concert body shape delivers balanced, focused sound with exceptional note clarity — a natural match for fingerpickers and players who prefer an intimate acoustic voice.

  Taylor's V-Class bracing system replaces the traditional X-brace pattern with a pair of stiff braces running along the centerline of the guitar, improving both intonation and sustain simultaneously while maintaining fingerstyle responsiveness.

  The Expression System 2 (ES2) behind-the-saddle pickup captures the full acoustic resonance of the guitar, delivering a natural, feedback-resistant amplified tone.

  The neck is crafted from Tropical Mahogany with a West African Crelicam Ebony fretboard and Spring Vine inlay. Ships with a deluxe hardshell case.
specs: |-
  - - Body Shape: Grand Concert
  - Cutaway: Venetian
  - Top: Solid Hawaiian Koa (gloss)
  - Back & Sides: Solid Hawaiian Koa (gloss)
  - Bracing: V-Class
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Fretboard Inlay: Spring Vine
  - Bridge: West African Crelicam Ebony
  - Scale Length: 24-7/8"
  - Nut: Black Graphite
  - Saddle: Micarta
  - Body Binding: Rock Maple
  - Tuners: Gotoh
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Deluxe hardshell case included
