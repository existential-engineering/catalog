description: "Mackie MDB-2P Passive Stereo Direct Box for clean stereo audio
  from keyboards, synthesizers, and other high-impedance sources."
details: |-
  Great for stereo sources like keyboards and synthesizers, the MDB-2P is an essential tool for electronic musicians, live sound venues, and recording studios. The passive design converts high-impedance stereo signals to balanced XLR outputs while maintaining audio fidelity, with no power required.

  Dual 1/4" high-impedance inputs are paired with parallel Thru outputs so the source signal can be passed on to an amplifier or other destination, while balanced XLR outputs with Ground Lift feed the main mix. Selectable -15dB pads keep high-output sources distortion-free.

  Built-Like-A-Tank construction ensures the MDB-2P stands up to the rigors of road and studio use.
specs: |-
  - Dual 1/4" high-impedance inputs with Thru outputs
  - Balanced XLR output connectors with Ground Lift
  - Ultra-low noise and distortion
  - -15dB pads for distortion-free performance with high-output sources
  - Parallel Thru outputs
  - Built-Like-A-Tank construction
  - No power required
