details: |-
  From acoustic guitars to laptops, always sound your best with MDB Series Direct Boxes. Available in four different models, the MDB Series will give you the peace of mind that your sound will faithfully get to your audience the way that you hear it on stage.

  Great for stereo sources like keyboards and synthesizers, the MDB-2P is an essential tool for electronic musicians, live sound venues, and recording studios. The MDB-2P Stereo Passive DI features dual 1/4" high-impedance inputs with Thru outputs and -15db pads, and dual low-impedance XLR outputs with ground lift.

  Unlike the other MDB Series direct boxes, the rear panel of the MDB-2P carries dual L/R output jacks for connecting XLR cables between the MDB-2P and a mixer's input jacks.

  The Thru jacks are parallel outputs, typically run to a keyboard amplifier's input jacks, and are unaffected by the direct box's circuitry.
specs: |-
  - Perfect for stereo sources like keyboards and media players
  - High-impedance 1/4" inputs with Thru outputs
  - Balanced XLR outputs with Ground Lift
  - Ultra-low noise and distortion
  - -15dB pads ensure distortion-free performance when connecting to high-output sources
  - Parallel Thru outputs
  - Built-Like-A-Tank construction
  - No power required (passive)
  - Frequency response 20 Hz to 20 kHz, +/-0.2 dB
  - Dynamic range 128 dB
  - Total harmonic distortion 0.002% from 1000 Hz
  - Input impedance 140 k ohm unbalanced
  - Impedance ratio (input to output) 350:1
  - Output impedance 400 ohm unbalanced
  - Dimensions 1.5 x 3.4 x 5.8 in / 38 x 86 x 147 mm
  - Weight 0.8 lb / 0.4 kg
