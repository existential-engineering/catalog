description: >-
  Korg's compact hybrid analog/digital drum machine from the Volca series, featuring six analog
  synthesized voices and four PCM samples with a 16-step sequencer, stutter effect, and motion
  sequencing in a portable battery-powered format.
details: |-
  The Volca Beats is a pocket-sized drum machine that packs genuine analog synthesis into an extremely affordable and portable package. Six of its ten voices are generated by analog circuitry, covering kick, snare, low tom, high tom, closed hi-hat, and open hi-hat, while four additional PCM sample-based sounds provide clap, clave, agogo, and crash. This hybrid approach gives the Volca Beats an organic, punchy character on its core drum sounds while filling out the percussion palette with digital samples.

  Each analog voice offers dedicated pitch and decay controls, allowing real-time tuning and shaping of individual drum sounds during performance. The stutter effect adds a retriggering delay-like effect that can transform simple patterns into complex rhythmic textures. Motion sequencing, borrowed from Korg's ElecTribe heritage, records knob movements as automation data that plays back with each pattern, bringing dynamic movement to otherwise static sequences.

  The sequencer draws inspiration from the ElecTribe range, supporting both real-time and step-entry programming across 16 steps with up to 8 storable patterns. Individual steps can be selectively muted to create polyrhythmic variations, and a 16-key multi-touch quantized ribbon controller provides a surprisingly playable interface for finger drumming and pattern entry despite the unit's diminutive size.

  Connectivity is minimal but functional, with a MIDI DIN input for external sequencing and a sync connector for chaining multiple Volca units or connecting to Korg's other sync-compatible devices. The battery-powered design and built-in speaker make it genuinely portable, while the headphone/line output connects to larger monitoring setups or recording interfaces.
specs: |-
  - Voices: 10 (6 analog synthesized, 4 PCM)
  - Analog voices: Kick, snare, low tom, high tom, closed hi-hat, open hi-hat
  - PCM voices: Clap, clave, agogo, crash
  - Sequencer: 16 steps, 8 patterns; real-time and step entry
  - Effects: Stutter (retriggering/delay)
  - Controller: 16-key multi-touch quantized ribbon
  - Motion sequencing: Real-time parameter recording
  - MIDI: DIN input
  - Sync: In/Out
  - Power: Battery or DC
