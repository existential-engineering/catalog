  style and grin-inducing playing feel and performance.
details: |-
  The left-handed Pro-Mod San Dimas Style 1 HH FR E Sassafras pairs a sassafras San Dimas Style 1 body with a satin finish and black hardware. The bolt-on maple neck features graphite reinforcement (dual rods), a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Seymour Duncan JB TB-4 humbucker in the bridge position and a Seymour Duncan '59 SH-1N humbucker in the neck position, routed through a 3-position blade switch with push/pull volume (coil split) and push/pull tone (coil split activation) controls.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with brass tremolo block and locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, knurled flat-top control knobs, and a black switch tip. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel (wrench included) round out the build.
