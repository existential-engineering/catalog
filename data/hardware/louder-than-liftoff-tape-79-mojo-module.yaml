description: TAPE•79 is a fully analog, stereo tape machine emulation module for the expansion slot of the Silver Bullet mk2 that convincingly captures the magnetic magic of 15 IPS tape.
details: |-
  Developed over approximately two years as an idealized emulation inspired by hot-rodded Studer and MCI tape decks. Designed to embody the subtle nuances of distortion, saturation, frequency shifts (including low frequency head bump), and phase shifts that occur when a signal is recorded and played back from real tape. Dipswitch-selectable options cover two distortion levels, LF head bump, HF response character, and iron response. Follows a set-it-and-forget-it philosophy to keep focus on recording rather than tweaking. Built with premium components including transformers from American manufacturers, proprietary discrete op-amps, Nichicon, Panasonic, Vishay, and TI parts, 0.1–0.5% thin film audio path resistors, and Tg 170 PCBs with RoHS-compliant construction. Fully assembled and tested. Mojo Module format — slots into the Silver Bullet mk2 chassis (sold separately).
