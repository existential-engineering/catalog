description: 8-slot 500-series rack and PSU with built-in TT/Bantam patchbay
details: An 8-slot 500-series rack and power supply featuring a patented fully
  balanced TT/Bantam patchbay that enables unlimited routing options for your
  500-series hardware without requiring module re-racking. Fits eight 500-series
  slots into a 3U rack-mountable enclosure with per-channel power regulation.
  Includes inputs and outputs for every slot plus two Mults for parallel
  processing, front-panel stereo linking via button press, and internal jumpers
  for custom linking configurations.
specs: |-
  - Slots: 8
  - Form Factor: 3U rack-mountable
  - Patchbay Type: Fully balanced TT/Bantam
  - Power per slot: 400mA per rail (max)
  - Total power: 1.6A per rail (1.8A non-continuous)
  - Mults: 2 (single input, dual outputs each)
  - Stereo Linking: Front-panel button + internal jumpers
