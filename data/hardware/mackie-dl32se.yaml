description: "The Mackie DL32SE digital mixer delivers 32 channels of proven DL
  series mixing in a stage-friendly, rack-mountable design with total control
  from the Master Fader SE app."
details: |-
  Master Fader SE is the main user interface for your DL32SE digital mixer. Rather than knobs, faders and buttons on a large piece of hardware, you get powerful mixing tools on your tablet, Mac or PC — up to 20 different devices simultaneously. The proven design of the Master Fader SE app makes managing your mix, large or small, easy and efficient. Organize your channels with view and mute groups, utilize subgroups with full bus processing, control levels of channel groups simply with VCAs, and even lock out devices from specific capabilities within the app. And when you get a mix you like, you can save it all into a snapshot.

  From EQ to compression, every bit of signal processing is implemented with the highest quality possible to maintain the fidelity of each source. Every channel and output bus gets its own dedicated processing. The 4-band parametric EQ on each channel and output features a dedicated high-pass filter (plus low-pass on the outputs), modern and vintage modes, and built-in RTA for maximum versatility and detailed analysis of each source. The clear UI makes it easy to make adjustments, view settings and choose presets.

  Each FX processor features tons of studio-quality reverbs and delays plus effects like chorus, tremolo, flanger and sweep filter. Fine tune each effect with advanced parameters and EQ — and since each processor has its own send and return, you won't use up any other busses.

  Connect Mackie DL32SE to a wireless router and control via Master Fader SE on up to 20 different iOS, Android, macOS and Windows devices at once. Wireless control also means you can put the mixer and router where it makes the most sense for application, while judging the sound from anywhere on the floor.
specs: |-
  - Convenient stagebox/rack design with built-in handle
  - 32 input channels with Onyx+ preamps (16 XLR, 16 XLR/TRS combo with 2 Hi-Z)
  - 10 fully assignable XLR outputs plus headphone output
  - Connect to your wireless router and control with Master Fader SE app
  - Per-channel EQ, filters, gate, compression and RTA/Spectrograph
  - 4 stereo FX busses with studio-quality reverbs, delays, chorus and more
  - Multitrack 32x32 USB audio interface for recording and playback
  - Waveform OEM professional software and plugins included
  - Take complete control via iOS, Android, macOS or Windows devices
  - No set FOH position — mix from anywhere
  - Control from up to 20 separate devices at once
  - Access Limiting allows performers to control their own monitor mixes without giving access to critical mixer functionality
  - Universal Ethernet connection supports your wireless router of choice
  - 32 input channels with 4-band PEQ + HPF, gate, compression and RTA/Spectrograph
  - 32 stereo-linkable input channels plus stereo return channel
  - 10 output busses with 4-band PEQ + HPF/LPF, 31-band GEQ, comp/limiter, alignment delay and RTA/Spectrograph
  - 8 stereo-linkable aux sends
  - 6 stereo-linkable subgroups
  - Main L/R bus
  - 6 VCAs and 6 mute groups
  - 4 stereo FX processors featuring studio-quality reverbs, delays, choruses, flangers and many more with dedicated sends and returns
  - Full I/O routing with A/B sources per channel
  - Assignable oscillator including pink/white noise and sine waves
  - Modern and Vintage options for comp/gate and EQ
  - 32x32 USB 2.0 audio interface for Mac or PC
  - Record the show for later mixdown
  - Perform a virtual sound check
  - Play intermission music, backing tracks and more directly into a dedicated stereo return channel
  - The DAW Essentials Bundle for Waveform OEM includes 16 powerful plugins like Equalizer, Compressor, Reverber8 and Limiter
