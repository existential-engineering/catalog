description: The Mackie DL32SE digital mixer delivers 32 channels of proven DL
  series mixing in a stage-friendly, rack-mountable design with total control
  from the Master Fader SE app.
details: |-
  The Mackie DL32SE digital mixer delivers proven mixing power with legendary Onyx+ mic preamps in a stage-friendly, rack-mountable design made to withstand real-world abuse. Connect to your wireless router and get mixing quickly with the multi-platform Master Fader SE app.

  Create multitrack recordings and get playback for a virtual soundcheck via USB I/O. Loaded with per-channel and output DSP plus 4 FX processors, DL32SE gives you the mixing power you need for professional sound.

  Master Fader SE is the main user interface for your DL32SE digital mixer. Rather than knobs, faders and buttons on a large piece of hardware, you get mixing tools on your tablet, Mac or PC, up to 20 different devices simultaneously. Organize your channels with view and mute groups, utilize subgroups with full bus processing, control levels of channel groups with VCAs, and lock out devices from specific capabilities within the app. And when you get a mix you like, you can save it all into a snapshot.

  From EQ to compression, every bit of signal processing is implemented with the highest quality possible to maintain the fidelity of each source. Every channel and output bus gets its own dedicated processing. The 4-band parametric EQ on each channel and output features a dedicated high-pass filter (plus low-pass on the outputs), modern and vintage modes, and built-in RTA.

  Each FX processor features studio-quality reverbs and delays plus effects like chorus, tremolo, flanger and sweep filter. Fine tune each effect with advanced parameters and EQ, and since each processor has its own send and return, you will not use up any other busses.
specs: |-
  - Convenient stagebox/rack design with built-in handle and included rack ears
  - 32 input channels with Onyx+ preamps (16 XLR, 16 XLR/TRS combo with 2 Hi-Z)
  - 10 fully assignable XLR outputs plus headphone output
  - Connect to your wireless router and control with Master Fader SE app
  - Per-channel EQ, filters, gate, compression and RTA/Spectrograph
  - 4 stereo FX busses with studio-quality reverbs, delays, chorus and more
  - Multitrack 32x32 USB 2.0 audio interface for recording and playback
  - Waveform OEM professional software and plugins included
  - Control from up to 20 separate iOS, Android, macOS or Windows devices at once
  - Access Limiting allows performers to control their own monitor mixes without giving access to critical mixer functionality
  - Universal Ethernet connection supports your wireless router of choice
  - 32 stereo-linkable input channels plus stereo return channel
  - 10 output busses with 4-band PEQ + HPF/LPF, 31-band GEQ, comp/limiter, alignment delay and RTA/Spectrograph
  - 8 stereo-linkable aux sends
  - 6 stereo-linkable subgroups
  - Main L/R bus
  - 6 VCAs and 6 mute groups
  - 4 stereo FX processors with dedicated sends and returns
  - Full I/O routing with A/B sources per channel
  - Assignable oscillator including pink/white noise and sine waves
  - Modern and Vintage options for comp/gate and EQ
  - No matrix mixes, no direct-to-drive recording and no Dante I/O option
