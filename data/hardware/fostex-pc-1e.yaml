name: PC-1e
manufacturer: fostex
primaryCategory: utility
url: https://www.fostex.jp/en/products/pc-1e/
description: Passive volume controller for level control of active speakers, with a stereo mini input and RCA pin outputs. Available in black and white.
details: |-
  Volume controller for volume control of active speakers. By connecting to active speakers equipped with an amplifier, the volume of the left and right speakers can be centrally controlled at your fingertips, improving usability when listening to music or watching DVDs on a PC.

  Equipped with a stereo mini input terminal and RCA pin output terminals. The metal body allows stable installation in spite of its small size, and the large volume knob is comfortable in the hand for smooth operation.

  Compact size (52 W x 37 H x 60 D mm) that does not get in the way on the desktop. Passive type, which does not require a power supply for easy use.

  If the input/output connections are reversed, the signal will be shorted on the output side when the volume is turned down, which may cause damage depending on the device connected. The product is designed for line-level signals (approximately 2 to 5 V) and cannot be used to adjust signals above line level, such as the speaker output of a power amplifier.
specs: |-
  - Input: 3.5 mm diameter stereo mini jack x 1
  - Output: RCA pins x 2 (L, R)
  - External dimensions: 52 (W) x 37 (H) x 60 (D) mm
  - Weight: approx. 120 g (main unit only)
  - Accessories: stereo mini to stereo mini cable (80 cm), RCA pin cable (1 m) x 2
  - Passive type, no power supply required
  - Complies with the European RoHS Directive
  - For line-level signals only (approx. 2 to 5 V)
