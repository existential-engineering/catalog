name: PC-1e
manufacturer: fostex
primaryCategory: other
url: https://www.fostex.jp/en/products/pc-1e/
description: Passive volume controller for centrally controlling the output of
  active speakers. Equipped with a stereo mini input and RCA pin outputs, with a
  metal body and large volume knob for smooth operation. Available in black and
  white.
details: |-
  Tagline: Volume controller for active speakers.

  Features:
  - Passive type, which does not require a power supply for easy use.
  - Available in black and white.
  - Equipped with a stereo mini input terminal and RCA pin output terminals.
  - The metal body of the unit allows stable installation in spite of its small size. The large volume knob is comfortable in the hand for smooth operation.
  - Compact size (external dimensions: 52W x 37H x 60D mm) that does not get in the way on the desktop.

  Color Variations: black / white

  Cautions:
  - If the input/output connections are reversed, the signal will be shorted on the output side when the volume is turned down, which may cause damage depending on the device connected. Please use the input/output connections in the correct direction.
  - This product is designed for use with line-level signals (approximately 2 to 5 V). It cannot be used to adjust signals above the line level, such as the speaker output of a power amplifier.
