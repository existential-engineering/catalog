description: >-
  The Roland D-70 is a 76-key digital synthesizer workstation released in the
  early 1990s that combines sample playback with resonant TVF filters and
  onboard effects. Though marketed as a successor to the D-50, it shares more in
  common with the U-20/220 series, featuring a versatile but complex
  architecture. Its resonant filters, real-time fader control, and layering
  capabilities make it a capable performance keyboard despite its notoriously
  awkward interface.
details: |-
  The D-70 was positioned as the next evolution in Roland's LA synthesis lineage, but internally it is closer to the U-series ROMplers. Internal circuit boards are labeled "U50," revealing its true heritage. The instrument was rushed into production to compete with machines like the Korg M1 and T-series, resulting in a design that reviewers often described as ambitious but uneven.

  The sound engine pairs a sample playback architecture with D-50-style TVF resonant filters and onboard effects including reverb, chorus, and flanger. The resonant filters are the D-70's strongest asset, adding character and movement to the digital samples. The instrument can read U-220 series PCM cards and features two PCM card slots plus RAM expansion capability.

  Performance features include a 76-note keyboard with velocity and aftertouch sensitivity, four assignable faders plus a fifth C1 controller for real-time parameter manipulation. Users can layer up to four tones per patch, with faders controlling level, pan, tuning, cutoff, resonance, attack, and release. MIDI data transmission from the faders makes it effective as a master keyboard.

  The D-70 excels with Rhodes and organ patches, alongside strong synth bass and lead sounds. The combination of effects and filters has been described as a souped-up D-50 with much better filters. However, it cannot filter drum samples, which limits percussion manipulation.
specs: |-
  - 76-key keyboard with velocity and aftertouch
  - 30-voice polyphony
  - Digital ROM sample playback with DLM (Differential Loop Modulation)
  - TVF low-pass resonant filter
  - 5-part multitimbral plus 1 percussion track
  - Up to 4 tones per patch
  - 10 user sets, 64 performances, 128 patches, 128 tones
  - Onboard reverb, chorus, and flanger effects
  - 4 assignable faders plus C1 controller
  - 2 PCM card slots, 1 RAM expansion slot
  - Full MIDI implementation with keyboard splitting and zoning
