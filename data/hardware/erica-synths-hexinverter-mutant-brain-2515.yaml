description: The Mutant Brain is the central nervous system connecting your
  modular analog eurorack system to MIDI gear, especially for percussion,
  polyphonic notes, and sync duties! It packs 16 eurorack compatible outputs
  into a tiny, super affordable 8HP package.
details: |-
  The Mutant Brain connects a modular analog eurorack system to MIDI gear, with percussion, polyphonic notes and sync duties in mind, and packs 16 eurorack compatible outputs into an 8HP panel.

  The 4 CV outputs and 12 gate and trigger outputs are all universally reconfigurable: triggers, gates, clock divisions and sync signals, polyphonic keyboard playing, velocity, sequencer transport and LFOs are all available.

  Configuring a patch means assigning each output in the Mutant Brain Surgery configuration utility and sending the resulting MIDI SysEx file to the module, which then remembers the whole setup. A web based SysEx patch builder is also available.

  The module was designed with live and studio performance in mind, so it does away with wasted panel space and menu-diving interfaces, and it avoids the limits of an auto-learn type MIDI interface, which does not always suit the combinations of gear a modular performer plays live with.

  The firmware updates published on the Hexinverter site are not compatible with this version of the module, and the Erica Synths version has no installable updates. In September 2022 Stacy Gaudreau, the founder of Hexinverter Électronique, announced the closing of its operations, and Erica Synths took over the manufacturing, sales and support of several of those modules, retaining all functionality while redesigning the hardware, with support provided for the reissue modules only.
specs: |-
  - 4 CV outputs and 12 gate/trigger outputs, all universally reconfigurable
  - 16 eurorack compatible outputs in total
  - Configured by MIDI SysEx from the Mutant Brain Surgery utility
  - Panel width 8HP
