description: "The 50-watt RB-110 is an ideal amp for practicing and playing
  small venues. Classic 3-band EQ and Super Grit Technology overdrive make it
  easy to dial in legendary Ampeg tone, with an auxiliary input for play-along,
  a headphone output for silent practice, and an XLR direct output for P.A. or
  recording."
specs: |-
  - 50-watt 1x10 combo
  - Vintage styling with modern features
  - Ampeg Legacy preamp
  - Super Grit Technology (SGT) overdrive
  - Classic 3-band EQ
  - 0dB and -15dB inputs
  - Auxiliary input and headphone output
  - XLR direct output
  - 22.5 lbs. (10.2 kg)
