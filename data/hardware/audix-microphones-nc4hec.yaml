details: |-
  The NC4HEC is a complete quad-channel Novacore digital wireless system for vocalists and presenters — everything needed to go from box to stage in a single purchase. It pairs the NCR4 Quad-Channel Digital Receiver with 4 x NCHH Digital Handheld Transmitters and 4 x NCEC Extended Cardioid Wireless Capsule, delivering the natural vocal clarity and transient response AUDIX microphones are known for on a professional AES-256 encrypted UHF digital wireless platform.

  The NCEC extended cardioid capsule provides balanced, even-sounding vocal coverage across a wide dynamic range — ideal for lead vocalists, worship leaders, and presenters who move during performance. The NCHH transmitter and NCR4 receiver are pre-matched on the Novacore RF platform and pair via one-touch IR sync.

  The system operates across a 48 MHz UHF tuning range with less than 3 ms latency and 9+ hours of transmitter battery life on 2× AA alkaline or 1× NCLB rechargeable lithium-ion. USB-C charging is built into the NCHH transmitter body. The NCEC capsule is interchangeable — upgrade or swap to an NCTH Tight Hypercardioid at any time using the same "S" thread mount with no tools required . The system is fully expandable within the Novacore ecosystem by adding channels, transmitters, or receivers as needs grow .
specs: |-
  - System: NCR4 quad-channel receiver + 4x NCHH handheld transmitters + 4x NCEC extended cardioid capsules
  - Receiver outputs: balanced analog XLR + Dante / AES67
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Encryption: AES-256
  - Transmitter power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours, USB-C charging
