url: https://www.fostex.jp/en/products/6301dt/
description: Compact active loudspeaker with Dante audio network compatibility.
  Part of the 6301 series used for more than 30 years in broadcast facilities
  and small-scale loudspeaker applications. Features a rugged die-cast aluminum
  enclosure with a 10cm cone-type full-range driver and a 20W amplifier.
  Supports analog unbalanced input and Dante digital network input.
details: |-
  Features:
  - Compact design for space-saving installation
  - Cone-type full-range speaker for stable sound
  - Rugged die-cast aluminum enclosure
  - Flat design with minimal protrusion of switches and knobs
  - Switching power supply compatible with 100-240 VAC
  - Either or both of 2-channel digital signals extracted from Dante network can be output
  - Incorporates Dante Ultimo chip (supports 44.1/48/88.2/96 kHz)
  - Optional wall-mounting angle (EB-6301) available
  - RoHS Directive compliant

  Dimensions: 120(W) x 189(H) x 120(D) mm (including maximum projection)

  Weight: Approx. 2.3 kg

  Accessories: Power cord (approx. 2 m) x 1
