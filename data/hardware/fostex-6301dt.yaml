description: The 6301 series of compact active loudspeakers, which have been used for more than 30 years in broadcast facilities and small-scale loudspeakers, is now available in a model compatible with the Dante audio network standard.
details: |-
  The 6301 series of compact active loudspeakers, which have been used for more than 30 years in broadcast facilities and small-scale loudspeakers, is now available in a model compatible with the Dante audio network standard. The compact design common to all series allows for space-saving installation.

  Cone-type full-range speakers are used to achieve stable sound, and a rugged die-cast aluminum enclosure houses the unit. The flat design keeps switches and knobs from protruding, preventing damage even in the event of a fall.

  Switching power supply circuitry is compatible with 100 VAC to 240 VAC power supplies. The product warranty is limited to use in Japan.

  Either or both of the 2-channel digital signals extracted from the Dante network signal can be output. The unit incorporates a Dante Ultimo chip, with supported sampling frequencies of 44.1/48/88.2/96 kHz.

  An optional wall-mounting angle (EB-6301) allows for angle adjustment and wall mounting. Dante is a registered trademark of Audinate, Inc.
specs: |-
  - Enclosure type: Closed type (Material: Aluminum die-cast)
  - Unit: Cone type 10cm full range unit x 1
  - Frequency response: 70Hz to 15kHz
  - Sound Pressure Level: 85dB/W (1m)
  - Maximum Sound Pressure Level: 98 dB
  - Rated output: 20W
  - Input connector: Analog unbalanced / 6.3 mm (1/4") TS phone, Dante / RJ45 (CAT5e or better)
  - T.H.D.: 0.05 % (at 1 kHz 1 W output)
  - Residual noise: -65 dBV
  - Dante Ultimo chip, supported sampling frequencies 44.1/48/88.2/96 kHz
  - External Dimensions: 120(W) x 189(H) x 120(D) mm including maximum projection
  - Weight: Approx. 2.3 kg
  - Power requirement: AC 100 V to 240 V, 50/60 Hz
  - Power consumption: 10 W (no auto-standby function)
  - Accessories: Power cord (approx. 2 m) x 1
  - Complies with the European RoHS Directive
