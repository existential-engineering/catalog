details: |-
  A revival of the first Darkglass design, the Harmonic Booster is a clean bass preamp that aims to master the control of harmonics and filtering, both crucial to sculpting the character and texture of a bass tone. It pairs a comprehensive 3-band active EQ with a semi-parametric Mid control for detailed frequency shaping. A unique tone-shaping engine, governed by the Character knob, enhances attack and presence to bring a bass forward in a mix. The Harmonic Booster is designed to perfectly complement Darkglass distortion circuits, and runs on standard 9V DC (center-negative) power.
specs: |-
  - Clean preamplifier that enhances attack and presence
  - Comprehensive 3-band active EQ
  - Unique tone-shaping engine controlled with Character knob
  - Semi-parametric Mid control
  - Designed to perfectly complement Darkglass distortion circuits
  - Standard 9V DC power (center-negative plug)
