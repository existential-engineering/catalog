description: A palm-sized synth, looper, and MIDI controller that lets anyone
  make music, anywhere.
details: |-
  Orba 3 is a palm-sized, all-in-one instrument that combines a synthesizer, a
  looper, an instant sampler, and an MPE MIDI controller. Its domed body carries
  eight touch-sensitive pads and a central button, and it is designed so anyone
  can build a song layer by layer using intuitive gestures like tapping,
  pressing, and moving the device in the air.

  A built-in omnidirectional MEMS microphone with a dedicated SAMPLE button lets
  you capture any sound and play it back across the pads instantly, while a
  four-track looper layers drums, bass, chords, and lead into complete
  arrangements. Onboard accelerometer and gyroscope sensors, plus embedded
  haptic feedback, translate motion and touch into expressive control, and the
  instrument ships with around 300 built-in sounds spanning synths, guitars,
  pianos, and drum kits.

  Orba 3 functions as a USB Class Compliant audio and MIDI device, connecting
  over USB-C for audio and MIDI or wirelessly via Bluetooth MIDI, and includes a
  3.5mm headphone/line output and a built-in speaker for standalone play. A
  rechargeable battery provides up to five hours of use. Orba 3 has since been
  discontinued.
specs: |-
  - Eight touch-sensitive pads plus a central button
  - Approximately 300 built-in sounds
  - Four-track looper
  - Built-in omnidirectional MEMS microphone with dedicated SAMPLE button
  - Accelerometer and gyroscope motion sensors
  - Embedded haptic feedback
  - Built-in speaker
  - USB Class Compliant audio and MIDI over USB-C
  - Bluetooth MIDI
  - 3.5mm headphone / line output
  - Rechargeable battery, up to 5 hours of use
