details: |-
  With a wide frequency response of 40 Hz – 18 kHz and the ability to handle SPLs in excess of 144 dB, the D4 dynamic instrument microphone is an excellent choice for miking instruments requiring precise, low-frequency reproduction such as large rack toms, floor toms, cajon, djembe, tympani, leslie bottom, bass flute, saxophone and baritone saxophone, trombone, acoustic bass, bass cabinets, and small kick drums.
  The D4 is lightweight, compact, and easy to position. Used for stage, studio, and broadcast applications, the D4 dynamic instrument microphone is designed with a hypercardioid pickup pattern for isolation and feedback control. The D4 hypercardioid is also equipped with a VLM diaphragm for natural accurate sound reproduction.
  Designed, machined, assembled, and tested by AUDIX in the USA.
specs: |-
  - Polar pattern: Hypercardioid
  - Transducer type: Dynamic (VLM diaphragm)
  - Frequency response: 40 Hz - 18 kHz
  - Maximum SPL: >144 dB
