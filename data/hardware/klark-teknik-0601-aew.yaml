id: JdmIfyJGlVJEYi8xQ0Fal
name: DN1248PLS
manufacturer: klark-teknik
primaryCategory: routing
categories:
  - preamp
  - rack-mount
  - outboard
url: https://www.klarkteknik.com/en/products/0601-AEW
description: The DN1248PLS is a 12-input active microphone splitter built for
  FOH, monitor and broadcast scenarios where a single source must be distributed
  without compromising signal integrity or introducing crosstalk. Twelve input
  channels each feed four discrete outputs, two electronically balanced for PA
  consoles and two transformer-isolated for broadcast feeds with ground-loop
  immunity.
details: |-
  Each input is buffered by a MIDAS HERITAGE microphone preamplifier, adapted from the same circuit topology used in the MIDAS Heritage consoles. The result is the wide dynamic range, low noise floor and headroom for which the Heritage preamplifier is recognised across the touring industry. Independent +30 dB and -15 dB gain switches per channel handle anything from condenser to dynamic source levels, and +48 V phantom and earth-lift switches are provided per channel.

  Input 1 and Output 1 are duplicated on both front and rear panels for cable-looming flexibility on stage trunks. A solo bus with integrated headphone amplifier and level control lets the engineer audition any channel pre-fade, and individual LED metering tracks each channel signal.

  Applications include touring FOH and monitor splits, broadcast outside-broadcast trucks, festival sub-rentals and corporate AV, wherever a single microphone source must be routed to multiple consoles.
specs: |-
  - 12 channels x 4 outputs (2 electronically balanced, 2 transformer balanced)
  - MIDAS HERITAGE microphone preamplifier per channel
  - +30 dB and -15 dB gain switches per channel
  - +48 V phantom power per channel
  - Earth lift per channel
  - Solo bus with headphone amplifier and level control
  - Individual LED metering per channel
  - Input 1 and Output 1 duplicated front and rear for looming flexibility
  - 3 U rackmount
  - Auto-ranging universal switch-mode power supply
  - Designed and engineered in the United Kingdom
