description: Designed for producers, and music lovers, the D3Vs can be connected via USB-C and offer a wealth of features, plus incredible audio performance.
details: |-
  The D3V is a fully active desktop monitoring system that stays true to ADAM Audio's industrial design heritage and features the iconic AMT tweeters. Each pair features 3.5" aluminum woofers and a ferrite magnet system, driven by an astonishing 240 W total system amplification. Dual-sided 3.5" passive radiators bolster bass frequencies and allow the D3V to extend down to 45 Hz.

  Equipped with a USB-C input and two balanced TRS sockets, D3V offers high-quality digital and analogue connections. Streamlined controls include a multi-function volume knob, intuitive room compensation switches and a multi-color status indicator. The D3V comes complete with detachable monitor stands as well as in-built threaded mic stand mounting points (3/8") for perfect positioning in any environment.

  Designed for songwriters, producers, and music lovers, the D3V monitors can be directly connected to computers and mobile devices via USB-C and offer a wealth of features, plus incredible audio performance in a remarkably compact form. The D3V offers a direct plug'n'play USB-C connection to computers, mobiles, and tablets, and traditional 1/4" TRS inputs are also included.

  The D3V features DSP-powered 3-way switches on the back plate of the left loudspeaker to address common acoustical issues arising from speaker placement, covering Position (Bass), Desk (Low-mid and Mid) and Room Acoustics (Treble). The multi-function front panel volume knob controls both the loudspeaker and headphone outputs, and its press functions cover mute, standby, input select, channel swap and firmware update mode.

  Available in black or white editions, the D3V's finish can be chosen to match your taste and complement your environment. A 5 year warranty is standard across ADAM Audio's portfolio of loudspeakers (2 years warranty plus 3 years optional with product registration).
specs: |-
  - Fully active 2-way desktop monitoring system, sold as a stereo pair (primary and secondary loudspeaker)
  - Tweeter: D-ART 1.5" hand-folded diaphragm, 2.8 inch² (1800 mm²) diaphragm area, 1.9" (48 mm) equivalent diameter, 5 to 1 velocity transform ratio, 0.085 g diaphragm weight
  - Tweeter dispersion: 120° horizontal, 120° vertical
  - Woofer: 3.5" basket diameter, 1" (25 mm) voice coil, single-piece aluminium cone, ferrite magnet system
  - Passive radiators: 2 x 3.5" basket diameter, dual-sided
  - Cabinet design: dual passive radiator; cabinet material PC-ABS
  - Amplification (woofer): PWM, peak 2 x 80 W (10% THD, limiter deactivated), RMS 2 x 70 W (1% THD, limiter deactivated)
  - Amplification (tweeter): PWM, peak 2 x 40 W (10% THD, limiter deactivated), RMS 2 x 30 W (1% THD, limiter deactivated)
  - Total peak amplifier power: 240 W
  - Frequency response @ -3 dB: 48 Hz – 22.6 kHz
  - Frequency response @ -6 dB: 45 Hz – 23.2 kHz
  - Crossover frequency: 4.0 kHz
  - Max SPL in full space at 1 m, sine bursts (average 100 Hz to 6 kHz) @ 3% THD: 94 dB SPL RMS / 97 dB SPL peak
  - Max SPL in full space at 1 m, sine bursts (average 50 Hz to 100 Hz) @ 3% THD: 80 dB SPL RMS / 84 dB SPL peak
  - Max peak SPL in full space at 1 m with IEC-weighted noise (full range / 80 Hz bass managed): 98 dB SPL
  - Dolby DARDT max SPL in full space: 103 dB SPL; bass managed: 106 dB SPL
  - Analog input connector: TRS; input impedance 47 kOhm; max. input level +9 dBu
  - Digital input: USB Type C, class-compliant USB 1.1
  - Headphones output connector: 3.5 mm TRS mini-jack; output impedance 32 Ohm
  - AD converter: 24-bit (via TRS inputs); USB bit depth 16-bit (via USB-C input); internal sample rate 48 kHz
  - Protection: independent peak and thermo limiters for each driver, plus amplifier thermo limiters
  - Input sensitivity: 0 dBu = 88 dB SPL at 1 m @ 0 dB level setting
  - Level control: front panel knob controls loudspeaker and headphone outputs over the range -∞ dB to +6 dB
  - Front panel knob press functions: mute, standby, input select, channel swap, firmware update mode
  - Input selection: Analog, USB-C; channel order: normal or L/R swapped
  - Backplate room adaption: Position (Bass) 0, -3, -6 dB; Desk (Low-mid and Mid) 0, -3, -6 dB and 0, -2, -4 dB; Room Acoustics (Treble) 0, -1.5, -3 dB
  - Display: front panel multi-color LED
  - Mounting options: flat on desk or loudspeaker stand (angled 15 degrees upwards on desk using supplied foot); threaded insert (3/8") on the bottom of the cabinet for microphone stand
  - Power consumption (max, idle, sleep): 60 W, 5 W, 0.3 W; power rating 60 W max.
  - AC input voltage: 100 – 240 V, 50/60 Hz
  - Operating conditions: -10° C to +45° C (+14° F to +113° F); <70% RH, non-condensing
  - Weight (excl. feet): 3.58 kg total (7 lbs 14 oz total)
  - Dimensions (H x W x D): 200 mm (240 mm with stand) x 115 mm x 150 mm
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Available in black or white editions
  - Delivery contents: D3V primary loudspeaker, D3V secondary loudspeaker, USB-C cable with USB-A adapter, connection cable (2 m), power cable, power block, Quick Start Guide, padded monitor stands, stick-on pads
  - Design patents: Registered EU No. 015065130-0001, 015065130-0003; UK No. 6412283, 6412285
