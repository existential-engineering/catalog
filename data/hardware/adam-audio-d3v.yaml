description: Designed for producers, and music lovers, the D3Vs can be connected via USB-C and offer a wealth of features, plus incredible audio performance.
details: |-
  The D3V is a fully active desktop monitoring system that stays true to ADAM Audio's industrial design heritage and features the iconic AMT tweeters. Each pair features 3.5" aluminum woofers and a ferrite magnet system, driven by an astonishing 240 W total system amplification. Dual-sided 3.5" passive radiators bolster bass frequencies and allow the D3V to extend down to 45 Hz.

  Equipped with a USB-C input and two balanced TRS sockets, D3V offers high-quality digital and analogue connections. Streamlined controls include a multi-function volume knob, intuitive room compensation switches and a multi-color status indicator. The D3V comes complete with detachable monitor stands as well as in-built threaded mic stand mounting points (3/8") for perfect positioning in any environment.

  Available in black or white editions, the D3V's finish can be chosen to match your taste and complement your environment.

  The D3V utilizes a 1.5" D-ART tweeter so that customers can enjoy precise and unfatiguing high frequency reproduction, and offers a direct plug'n'play USB-C connection to computers, mobiles, and tablets alongside traditional 1/4" TRS inputs.

  The D3V features DSP-powered 3-way switches to address common acoustical issues arising from speaker placement, and its multi-function volume control gives quick access to mute, standby, input select and channel swap.
specs: |-
  - Handmade precision D-ART 1.5" hand-folded tweeter
  - 3.5" aluminum woofers with ferrite magnet system, 1" voice coil, single-piece aluminium cone
  - Dual-sided passive radiators, 2 x 3.5" basket diameter
  - Total peak amplifier power: 240 W
  - Woofer amplification (PWM): peak 2 x 80 W, RMS 2 x 70 W
  - Tweeter amplification (PWM): peak 2 x 40 W, RMS 2 x 30 W
  - Frequency response @ -3 dB: 48 Hz to 22.6 kHz
  - Frequency response @ -6 dB: 45 Hz to 23.2 kHz
  - Crossover frequency: 4.0 kHz
  - Max SPL per speaker at 1 m: 94 dB RMS, 97 dB peak (100 Hz to 6 kHz, 3% THD)
  - Tweeter dispersion: 120 degrees horizontal, 120 degrees vertical
  - Tweeter diaphragm area 2.8 in2 (1800 mm2), equivalent diameter 1.9" (48 mm)
  - Analog input impedance 47 kOhm, max input level +9 dBu
  - Digital audio: class-compliant USB 1.1, 16-bit via USB-C
  - AD converter: 24-bit via TRS inputs, internal sample rate 48 kHz
  - Headphone output impedance: 32 Ohm
  - Level control range: -infinity dB to +6 dB for loudspeaker and headphone outputs
  - Front panel knob press functions: mute, standby, input select, channel swap, firmware update mode
  - Backplate room adaption: Position (bass) 0, -3, -6 dB; Desk (low-mid and mid) 0, -3, -6 dB and 0, -2, -4 dB; Room Acoustics (treble) 0, -1.5, -3 dB
  - Front panel multi-color LED status display
  - Cabinet: PC-ABS, dual passive radiator design
  - Dimensions (H x W x D): 200 mm (240 mm with stand) x 115 mm x 150 mm
  - Weight excluding feet: 3.58 kg total (7 lbs 14 oz total)
  - AC input voltage: 100 to 240 V, 50/60 Hz; power consumption 60 W max, 5 W idle, 0.3 W sleep
  - Mounting: flat on desk or loudspeaker stand, angled 15 degrees upwards using supplied foot, 3/8" threaded insert on cabinet bottom for microphone stand
  - Protection: independent peak and thermo limiters for each driver, plus amplifier thermo limiters
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
