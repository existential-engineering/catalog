description: Designed for producers, and music lovers, the D3Vs can be connected
  via USB-C and offer a wealth of features, plus incredible audio performance.
details: |-
  The D3V is a fully active desktop monitoring system designed for songwriters, producers, and music lovers. It connects directly to computers and mobile devices via USB-C, delivering incredible audio performance in a remarkably compact form factor.

  Each speaker features a 3.5" single-piece aluminum woofer flanked by dual-sided 3.5" passive radiators, paired with ADAM Audio's D-ART (Dispersion-Acoustic Reflector Tweeter) 1.5" hand-folded tweeter for wide 120° dispersion. With 240 W total peak amplification across both cabinets, the D3V extends frequency response down to 45 Hz despite its desktop footprint.

  Class-compliant USB-C connectivity (16-bit) lets the D3V serve as a plug-and-play audio interface, while two ¼" TRS balanced analog inputs (24-bit AD) accommodate outboard sources. A 3.5 mm headphone output and a single multi-function volume knob handle mute, standby, input select, channel swap, and firmware updates.

  DSP-driven room adaptation switches let you compensate for desk and wall placement: Bass (0, −3, −6 dB), Desk Low-mid (−3, −6 dB), Desk Mid (−2, −4 dB), and Treble (−1.5, −3 dB). Independent peak and thermal limiters protect each driver.

  Available in Black or White editions, the D3V ships with detachable monitor stands and includes a 3/8″ threaded insert for mic-stand mounting, making it equally at home on a desk, a stand, or in a portable rig.
specs: |-
  - 3.5" single-piece aluminum woofer with 1" voice coil
  - Dual 3.5" passive radiators (one per side)
  - D-ART 1.5" hand-folded tweeter, 2.8 in² diaphragm, 120° H/V dispersion
  - Frequency Response @ -3 dB: 48 Hz – 22.6 kHz
  - Frequency Response @ -6 dB: 45 Hz – 23.2 kHz
  - Crossover Frequency: 4.0 kHz
  - Max SPL @ 1m (peak, 100 Hz–6 kHz): 97 dB SPL
  - Max SPL @ 1m (RMS, 100 Hz–6 kHz): 94 dB SPL
  - Total Peak Power: 240 W
  - Woofer amplifier: 2 × 80 W peak (10% THD), 2 × 70 W RMS (1% THD)
  - Tweeter amplifier: 2 × 40 W peak (10% THD), 2 × 30 W RMS (1% THD)
  - AD Converter: 24-bit (TRS inputs)
  - USB Bit Depth: 16-bit (USB-C, class-compliant USB 1.1)
  - Internal Sample Rate: 48 kHz
  - Independent peak and thermal limiters per driver
  - Input Sensitivity: 0 dBu = 88 dB SPL @ 1m
  - Level Range: -∞ to +6 dB
  - Room Adaption – Bass: 0, −3, −6 dB
  - Room Adaption – Desk Low-mid: −3, −6 dB
  - Room Adaption – Desk Mid: −2, −4 dB
  - Room Adaption – Treble: −1.5, −3 dB
  - Knob Functions: Mute, standby, input select, channel swap, firmware mode
  - Front panel multi-color LED status indicator
  - Cabinet: Dual passive radiator, PC-ABS
  - Dimensions: 200 mm H (240 mm with stand) × 115 mm W × 150 mm D
  - Weight: 3.58 kg total (7 lbs 14 oz)
  - Power consumption: 60 W max, 5 W idle, 0.3 W sleep
  - AC Input: 100–240 V, 50/60 Hz
  - Operating Temperature: -10°C to +45°C
  - 3/8″ threaded insert for mic-stand mounting
  - Detachable monitor stands included
  - 5 year warranty (2 years + 3 years optional with registration)
