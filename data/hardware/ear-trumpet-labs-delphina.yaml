description: Handbuilt LDC microphone ideal for duos and small acoustic
  ensembles on stage and in studio. Vintage styling, detailed, warm sound
  quality. Named for Del McCoury.
details: |-
  Delphina sounds like Ear Trumpet Labs' Myrtle and looks like its Edwina, with a brass bracket to set it apart. For a number of years players had asked for a lower-profile ensemble mic that combined the sonic characteristics of Myrtle, the maker's ensemble model with full low-end response and flexibility for multiple players, with the portability and sleekness of the signature Edwina. Ear Trumpet Labs built the hybrid as a custom special order for several years before adding it to its standard line of microphones.

  Delphina is a large-diaphragm condenser microphone with distinctive but not domineering looks. It takes the warm, detailed sound and feedback rejection of the standard Edwina and adds a low end tuned for accurately capturing acoustic instruments from any distance, in the manner of Myrtle.

  The model had been a favorite of Del McCoury's for two years, and Ear Trumpet Labs named it in honour of the bluegrass musician.

  Delphina suits single-miking soloists or small acoustic ensembles, including acoustic instruments and multiple vocalists, on stage or in the studio. A closely matched stereo pair works for drum overheads and room mics, in x/y, spaced pair or ORTF configurations, and Ear Trumpet Labs offers a pair in a single case with custom-cut foam.
specs: |-
  - Hand-made microphone with unique appearance
  - Side or end address, using pivoting brass bracket
  - Internal shock dampers for minimal handling noise
  - Warm and smooth midrange for medium-to-long distance applications in a compact body
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -40.9 dB (9 mV/Pa)
  - Available as a closely matched stereo pair in a single case with custom-cut foam
