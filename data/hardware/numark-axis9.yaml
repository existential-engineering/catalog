url: https://www.numark.com/product/axis9
description: Professional tabletop CD player with a touch-sensitive scratch and
  effects wheel, multiple simultaneous DSP effects, 3,000 cue-point storage, key
  lock, and a built-in Beatkeeper.
details: |-
  The Axis 9 is Numark's innovative tabletop CD player embraced by Digital DJs for the wealth of controls and features it packs into one compact yet powerful machine.
specs: |-
  - Touch-sensitive scratch and effects wheel provides instant, accurate response
  - Multiple DSP effects with direct access including reverse
  - Play multi-effects simultaneously
  - 3,000 cue-point save capability
  - Built-in Beatkeeper with auto-synchronization
  - Key Lock at any tempo up to plus/minus 100% with key change
  - Plus/minus 6, 12, 25 and 100% pitch control
  - Two complete seamless loops with three hot stutter starts
  - Adjustable start and brake speeds
  - Fader/remote start and relay
  - Anti-Shock buffer ensures steady consistent playback
  - Transport bay illumination light for easy reading in low-light conditions
  - Sleep mode for extended laser life
  - User-updateable through Internet downloads
