description: A Custom Shop overdrive pedal using two Mosfets plus two Germanium
  diodes configured as hard-clipping to voltage reference rather than ground. It
  offers a tube-like feel, wider dynamic range, more sustain, and a focused
  single-note tone.
details: |-
  The OCD pedal is the only pedal that uses 2 x Mosfets configured as hard-clipping to 'Voltage reference" instead of the usual way: to ground." The earliest OCDs used 2 x Mosfets plus 1 x Germanium diode, but very quickly these diodes became harder and harder to find, and they became expensive. Recently I stumbled across a reasonably large stash of the right kind of Germanium diodes so I ponied-up and bought all of them. So I decided to do a run of the ultimate OCD: a Custom Shop offering with a few circuit tweaks using 2 x Mosfets plus 2 x Germanium diodes, and one hell of a beautiful paint job... Metallic Teal with a chrome undercoat! This beauty morphs between blues and greens depending on the light and angle. And what would the ultimate OCD be without a Blue LED? The sound? Great definition, more tube-like feel, a bit wider dynamic range, more sustain, and a more focused single-note tone. And as with all Fulltone pedals... 100% Built in the USA.
