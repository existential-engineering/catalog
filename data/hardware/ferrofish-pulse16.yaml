description: The PULSE16 converts 16 x 16 balanced analog inputs and outputs to
  ADAT I/O at studio quality up to 96 kHz. Its 4 x 4 ADAT ports carry 32 x 32
  digital channels, so all 16 x 16 channels still convert at 96 kHz without a
  reduced channel count.
details: |-
  The PULSE16 converts 16 x 16 balanced analog inputs and outputs to ADAT I/O at studio quality up to 96 kHz. ADAT is a cost-effective and mature interface that is already available almost everywhere, so adding 16 x 16 analog channels to a studio with the PULSE16 takes only a few steps.

  The low-latency A/D and D/A converters, a temperature-compensated clock and a jitter reduction PLL are there to keep the sound clear. All of it sits in a compact 1U chassis, and the PULSE16 delivers studio levels up to +20 dBu, individually adjustable in 1 dB steps, across a total of 32 jack connectors. The 4 x 4 ADAT ports convert 16 x 16 channels at 96 kHz without reducing the channel count.

  Configuration is straightforward thanks to the two TFT screens, which lay out all the information without a look at the manual. Remote control over MIDI is also possible with the free RemoteFish app for PC and Mac.

  The headphone output can play back almost any analog or digital input or output, which suits a quick check of a signal.

  The PULSE16 grows with a studio: the MADI I/O section can be unlocked with an upgrade kit consisting of a MADI SFP module together with an unlock code, which turns the PULSE16 into a full PULSE16 MX.
specs: |-
  - A/D and D/A converters with 16 balanced analog inputs and outputs at +20 dBu
  - Input and output levels individually adjustable in 1 dB steps
  - 32 x 32 digital channels over 4 ADAT I/O sockets, converting 16 x 16 channels even at 96 kHz
  - Monitoring matrix of almost every digital and analog input and output onto the stereo headphone output
  - All analog and digital inputs and outputs on the rear panel are freely routable in groups of 8 channels
  - Preset management
  - Word clock generator and receiver with a proprietary jitter reduction circuit
  - Upgradeable to the MADI-capable PULSE16 MX version with a paid upgrade kit
  - 19 inch 1U chassis, 19 x 48 x 4.4 cm, 5 kg
