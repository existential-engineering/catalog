details: |-
  The 1BX is part of dbx's BX series of dynamic range expanders, designed to complement the limited dynamic range of FM radio broadcasts, cassette tapes, and other compressed audio sources. The unit expands the dynamic range of compressed audio, restoring a more natural contrast between loud and soft passages.

  The 1BX uses dbx's proven expansion technology to gradually increase gain as signal levels rise, creating a natural-sounding enhancement without the artifacts associated with simple noise gating. The expansion ratio and threshold are adjustable to match the compression characteristics of different source material.

  The device was particularly popular among audiophiles and recording engineers looking to improve the perceived quality of dynamically compressed program material on home and professional playback systems.
