description: >-
  The Realistic Concertmate MG-1 is a 2-VCO monophonic/polyphonic analog synthesizer built
  by Moog for Radio Shack in 1981. Designed as an affordable entry point to Moog
  synthesis, it features a genuine 24dB/octave lowpass filter and shares its architecture
  with the Moog Rogue. A unique divide-down polyphonic organ section and RCA connectivity
  made it accessible to home musicians looking for authentic analog sounds on a budget.
details: |-
  The Concertmate MG-1 represents an unusual collaboration between Moog Music and Radio Shack, bringing genuine Moog synthesizer technology to the consumer electronics market. Sharing its core architecture with the Moog Rogue and the strap-on Moog Liberation, the MG-1 offered an accessible path to analog synthesis for home musicians who might never set foot in a professional music store.

  The synth features two voltage-controlled oscillators (labeled "Tone Generators") producing sawtooth, square, and pulse waveforms that can be detuned and synced together. Its 24dB/octave lowpass filter is a genuine Moog ladder design, giving the MG-1 an authenticity that belied its budget origins. An ASR (Attack, Sustain, Release) envelope generator labeled "Contour" can modulate both the amplifier and filter cutoff simultaneously.

  A distinctive feature is the divide-down polyphonic organ section, controlled by a slider on the right side of the instrument, which adds a layer of versatility uncommon in monophonic synthesizers of the era. The LFO offers triangle, square, and sample-and-hold modulation patterns. The MG-1 connects to external equipment via RCA jacks rather than standard audio connectors, reflecting its consumer electronics heritage.

  Despite its budget positioning, the MG-1 has appeared on recordings by notable artists including Peter Gabriel, 808 State, Remy Shand, and KMFDM, earning a reputation as a source of characterful and affordable Moog bass tones.
specs: |-
  - Polyphony: Monophonic (plus fully polyphonic divide-down organ)
  - Oscillators: 2 VCOs (TG1: sawtooth, square; TG2: sawtooth, pulse)
  - Noise: White noise generator
  - Filter: 1 24dB/octave lowpass with cutoff, emphasis, and envelope modulation
  - Envelope: ASR (Attack, Sustain, Release)
  - LFO: Triangle, square, and sample-and-hold waveforms
  - Keyboard: 32 keys
  - Control: CV/Gate
  - Connections: RCA input and output
  - Memory: None
  - Arpeggiator/Sequencer: None
  - MIDI: None
