details: |-
  The Aries Neck-Through follows its predecessor in looks but varies in functionality and tone. Players partial to this construction can get the popular Aries shape with the stability, resonance, and sustain of a neck-through.

  Construction is neck-through with a sculpted neck heel, using a tung-oiled maple neck with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability. Multi-piece neck builds shown in the gallery include a 5-piece maple neck with 2 walnut stripes, a 5-piece walnut neck with 2 maple stripes, and a 3-piece walnut neck with 1 purpleheart stripe.

  Electronics are a master volume and tone control with a 5-way blade-style pickup selector, feeding direct-mount passive Kiesel Lithium humbuckers. Bridge options are a Hipshot fixed bridge or a Hipshot Solo Saddle bridge, both at .4125 inch (10.5 mm) spacing, and gallery examples also show a Kiesel/Hipshot tremolo.

  The gallery shows the model in 6-string (NA6X, NA6H) and 7-string (NA7H) forms with alder, walnut and swamp ash bodies, quilted maple, burled maple and swamp ash tops, ebony, royal ebony and maple fingerboards, and a range of burst, solid and oiled finishes with chrome, black or gold hardware.
specs: |-
  - Available in multiple string counts, including 6-string and 7-string configurations, plus multiscale options
  - Construction: neck-through with sculpted neck heel
  - Body: alder (gallery examples also show walnut and swamp ash)
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius, or ebony with 20 inch radius
  - Frets: 24 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length options: 25.5 inch, 27 inch, and multiscale 25.5 to 26.5 inch, 25.5 to 27 inch, 26 to 27.5 inch
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Bridge: Hipshot fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot Solo Saddle bridge, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: pointed inline headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Neck width: 1.69 inch to 2.12 inch at the nut depending on configuration, 0.75 to 0.79 inch thick at the 1st fret, 0.85 to 0.88 inch thick at the 12th fret
  - Body dimensions: 38.25 inch, 39 inch or 39.75 inch long, 1.65 inch thick, 12.5 inch wide
  - Weight: 7.75 lbs, 7.82 lbs or 8 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
