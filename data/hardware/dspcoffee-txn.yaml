description: A 2HP Eurorack panning mixer that mixes and pans seven inputs
  across two outputs, remixed from Jesper Särnesjö's Nearness module.
details: |-
  Legendary tiny panning mixers by bpcmusic, which are a remix of Nearness by Jesper Särnesjö. It pairs very well with our KALI's stereo fx and some upcoming projects... From bpcmusic.com -

  The TELEXn (TXn) is a 2HP Remix of Jesper Särnesjö's open source module "nearness". Nearness is an ingenious module that you absolutely need in your rig. This remix is compresses the original 3HP module into 2HP. You can't go wrong with either one. ... The module mixes and pans seven inputs to two outputs. There is an output at the top and bottom of the panel. Between these outputs are the seven inputs. These patch points correspond to panning positions between the two outputs. The closer you are to an output, the louder your signal will be there (and the quieter it will be in the corresponding output). This module pairs quite well with a TXo (or two) running in oscillator mode as it provides you with a powerful way to sum the voices into a dimensional stereo field without eating tons of channels (or HP) with more complex mixing solutions.
