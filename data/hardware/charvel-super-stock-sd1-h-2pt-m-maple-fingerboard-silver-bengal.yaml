description: The Super-Stock SD1 H 2PT M is a Pro-Mod San Dimas Style 1 electric
  guitar in a Silver Bengal gloss finish. Built on an alder body with a bolt-on
  maple neck (graphite reinforcement and scarf joint), it pairs a 25.5" scale
  length with a 12"-to-16" compound-radius maple fingerboard, 22 jumbo frets,
  and a Graph Tech TUSQ XL nut (1.6875" width). A single Seymour Duncan
  Distortion TB-6 bridge humbucker is routed to a master volume control with no
  pickup switching for a direct, no-frills signal path. Hardware includes a
  Gotoh Custom 510 two-point tremolo and Charvel-branded Gotoh die-cast locking
  tuners in chrome, topped by a Charvel pointed 6-in-line headstock. The guitar
  ships strung with .009-.042 nickel-plated steel strings and includes a Charvel
  Multi-Fit gig bag.
details: |-
  Pro-Mod platform San Dimas Style 1 in the bold Silver Bengal graphic finish. Single-humbucker, volume-only layout for a stripped-down high-gain voice. Two-point Gotoh Custom 510 tremolo provides smooth pitch modulation, and the Charvel-branded Gotoh die-cast locking tuners aid tuning stability. Graphite-reinforced bolt-on maple neck with scarf joint and hand-rubbed urethane finish, 12"-16" compound-radius maple fingerboard with black dot inlays and black side dots.
