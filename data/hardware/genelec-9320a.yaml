description: "As a professional monitor controller, calibration set, output
  interface, GLM remote and headphone amplifier, the 9320A integrates tightly
  with our UNIO Ecosystem to offer audio engineers seamless bridging of in-room
  and personal headphone monitoring – from stereo to immersive."
details: |-
  The Genelec 9320A SAM Reference Controller is a desktop hardware controller designed to act as five audio tools in one – a professional monitor controller, calibration set, output interface, GLM remote, and headphone amplifier. It integrates tightly with Genelec's UNIO Ecosystem, providing engineers with a single tactile hub for switching between in-room loudspeaker monitoring and personal headphone monitoring, from stereo through to immersive layouts.

  Connectivity is comprehensive for a unit of this size. Two 6.3 mm TRS analog balanced line inputs and outputs sit alongside XLR AES/EBU digital input and output, a 6.3 mm stereo headphone jack, a Genelec measurement microphone input, and a USB-C computer interface that simultaneously handles audio, GLM management, and bus power. A second USB-C auxiliary power input is provided for setups where the host computer cannot supply sufficient current, and GLM network ports on the top and bottom allow the controller to be inserted into and terminated against a SAM monitor network.

  Audio performance is engineered to reference-grade specifications. The signal path delivers a frequency response extending to 46 kHz (–3 dB), THD+N below –110 dB, dynamic range of 126 dB on the headphone output and 138 dB (A-weighted) on the AES/EBU output, with input-to-output latency held in the 2.1 to 3.2 ms range. The headphone amplifier supports loads from 16 Ω to 600 Ω with a maximum RMS output of 6 V, delivering up to 200 mW into 150 Ω and remaining linear across the full impedance range.

  When paired with Genelec Loudspeaker Manager (GLM) software, the 9320A becomes the physical front end for AutoCal 2 room calibration, Aural ID binaural headphone monitoring, and GRADE acoustic reporting. A factory-calibrated reference microphone is included in the box for this purpose. The controller can equally operate standalone without a computer, providing direct alignment of loudspeaker and headphone monitoring, level matching across sources, and rapid switching between monitoring options with no need to readjust levels.

  Under UNIO Personal Reference Monitoring (PRM), the 9320A is offered together with a factory-matched pair of 8550A Professional Reference Headphones for a uniquely calibrated loudspeaker-and-headphone reference system. The unit ships with the reference microphone, a 2 m USB-C cable with a USB type-A adapter, and a carry case, and is housed in a compact 60 × 190 × 139 mm chassis weighing 0.9 kg with a Kensington anti-theft lock opening on top.
specs: |-
  - Frequency Response: 0 – 46 kHz (-3 dB point)
  - Dynamic Range: 126 dB (headphone output); 138 dB A-weighted (AES/EBU output)
  - THD Plus N: < -110 dB
  - Input To Output Latency: 2.1 – 3.2 ms
  - Headphone Max Output: 120 mW @ 16 Ω; 140 mW @ 32 Ω; 200 mW @ 150 Ω; 115 mW @ 300 Ω; 57 mW @ 600 Ω
  - Headphone Max Rmsoutput: 6 V
  - Headphone Impedance Range: 16 – 600 Ω
  - Analog Input Max Level: +12 dBu or +24 dBu (selectable)
  - Digital Input Format: AES/EBU (AES3); S/PDIF with separate 75 to 110 Ω impedance converter
  - Digital Output Format: AES/EBU (AES3)
  - Usb Audio: Up to 192 kHz, 24-bit
  - Supply Voltage: 5 VDC (USB-C)
  - Operating Consumption: < 2.5 W (computer connector); < 3.5 W (PWR connector)
  - Sleep Consumption: 0.125 W
  - Operating Temperature: 15 – 35 °C
  - Operating Humidity: 10 – 80% non-condensing
  - Height: 60 mm (2.4 in)
  - Width: 190 mm (7.5 in)
  - Depth: 139 mm (5.5 in)
  - Weight: 0.9 kg (2.0 lb)
  - Included Accessories: Factory-calibrated reference microphone, 2 m USB-C cable with type-A adapter, carry case
