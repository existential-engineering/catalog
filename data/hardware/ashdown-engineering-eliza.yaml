details: |-
  Part of the Ashdown Elizabeth Line, the Eliza is a stereo 2.0 powered speaker system delivering 60W + 60W of sound through dual 4-inch coaxial drivers, driven by a Class D amplifier. It features Ashdown's signature VU meter for output monitoring and combines classic design with modern connectivity: Bluetooth 5.2 wireless audio streaming, optical, USB and 3.5mm aux inputs, plus remote control and custom EQ controls. It weighs around 5 kg in a compact form. A two-way, two-stage rear inverted-phase audio system uses two 4-inch mid-woofers and two 20mm tweeters, with a maximum sound pressure of 100dB at 1m.
specs: |-
  - Configuration: stereo 2.0 powered speaker system
  - Drivers: dual 4-inch coaxial drivers (two 4-inch mid-woofers, two 20mm tweeters)
  - Amplifier: Class D, 2 x 45W + 2 x 15W
  - Output: 60W + 60W
  - Acoustic system: two-way, two-stage rear inverted-phase
  - Maximum sound pressure: 100dB at 1m
  - Wireless: Bluetooth 5.2
  - Wireless audio frequency response: 50 - 20,000Hz
  - Aux: 3.5mm audio cable connection
  - Optical: standard optical audio connection
  - USB: USB local playback
  - Signature VU meter
  - Remote control
  - Custom EQ controls
  - Input voltage: AC 100-240V
  - Input frequency: 50/60Hz
  - Dimensions (mm): 330 x 195 x 185
  - Weight: approximately 5 kg
