description: The dbx DriveRack PA+ is a complete loudspeaker management system
  with 2 inputs and 6 outputs, featuring dual 28-band graphic EQs, AutoEQ wizard
  with 28-band RTA, Advanced Feedback Suppression with 12 notch filters, dbx
  120A Subharmonic Synthesizer, compression, and configurable crossovers up to
  2×6. Preset JBL and Crown tunings enable fast professional system setup.
details: |-
  The dbx DriveRack PA+ is an enhanced iteration of dbx's popular loudspeaker management platform, maintaining core features of its predecessor while introducing expanded settings, control capabilities, and improved circuitry. It provides all the signal processing needed between a mixer and power amplifiers in a single 1U unit.

  The PA+ includes a Setup Wizard for speaker and amplifier selection with automatic level calibration, an AutoEQ Wizard using a 28-band RTA for venue-specific tuning, and an AFS Wizard for automated feedback suppression with 12 notch filters. The dbx 120A Subharmonic Synthesizer, input compression, and front-panel output mutes provide complete system control. Preset tunings for JBL speakers and Crown power amplifiers enable fast, professional-quality results without extensive technical expertise.

  Dual 28-band graphic equalizers and stereo multi-band parametric EQ give precise tone shaping control. Configurable crossover options from 2×3 through 2×6 accommodate full-range, bi-amped, and tri-amped systems. 25 user and 25 factory programs, a graphic LCD display with input/output metering, and per-channel output mutes round out the feature set.
specs: |-
  - Inputs: 2 line inputs (XLR), 1 RTA mic input
  - Input Impedance: >40 kΩ
  - Max Input Level: >+20 dBu
  - Outputs: 6 line outputs (XLR)
  - Output Impedance: 120 Ω
  - Sample Rate: 48 kHz
  - A/D Dynamic Range: 110 dB A-weighted
  - D/A Dynamic Range: 112 dB A-weighted
  - THD+Noise: 0.004% @ +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, ±0.5 dB
  - Alignment Delay: 10 ms per channel (60 ms total)
  - Mic Preamp EIN: <-117 dB (22 Hz–22 kHz, 150 Ω)
  - Mic Phantom Power: +15 VDC (RTA)
  - Power: 100–120 VAC or 220–240 VAC, 50/60 Hz
  - Power Consumption: 25 W
  - Dimensions: 19" W × 5.75" D × 1.75" H
  - Weight: 5.5 lbs (2.5 kg)
