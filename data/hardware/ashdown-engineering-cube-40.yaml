description: The Cube 40 (AA-40 Wood) is a 40 watt single-channel acoustic
  guitar amplifier built in the UK Custom Shop, with a hand-made wood-stained
  cabinet and a custom-designed Italian Sica speaker paired with a
  studio-quality tweeter. Weighing just 3.4 kg, it offers a fully-featured
  preamp with treble and bass EQ, four flavours of digital reverb, a
  feedback-cancelling notch filter, a balanced DI output and FX send and return.
details: |-
  The Cube 40 (AA-40 Wood) is a 40 watt single-channel acoustic guitar amplifier built in the UK Custom Shop, featuring a hand-made wood-stained cabinet and a custom-designed 5-inch Italian Sica speaker combined with a studio-quality tweeter. Designed to be ultra-portable at just 3.4 kg, its fully-featured preamp lets the player sculpt acoustic tones with treble and bass EQ while retaining the instrument's character. Digital reverb is available in four flavours and a notch filter (70 to 350Hz, Q=5) cancels feedback-inducing frequencies at higher volumes. It measures 230mm on each side and includes a carry strap and a 35mm recessed speaker pole socket.
specs: |-
  - Power output: 40 watts
  - Power requirement: 230/115V auto-select
  - Speaker configuration: 1 x 5 inch custom Italian Sica plus tweeter
  - Frequency response: -3dB at 52Hz and 28kHz
  - High instrument input (Ch 1 active): 10k ohms, 300mV to 20V p-p
  - Low instrument input (Ch 1 passive): 3.9M ohms, 150mV to 10V p-p
  - Line output: 4.7k ohms, 0dBu
  - DI output: 600 ohms, -20dBu
  - EQ: Bass +/-15dB at 100Hz, Treble +/-15dB at 10kHz
  - Signal to noise: better than 70dB (EQ flat)
  - Distortion: less than 0.8% THD
  - Notch filter: 70 to 350Hz, Q=5
  - Shape switch
  - Carry strap
  - 35mm recessed speaker pole socket
  - Link output for AA Power Cube extension combo
  - Handmade in the UK Custom Shop
  - Dimensions (H x W x D): 230 x 230 x 230 mm
  - Weight: 3.4 kg
