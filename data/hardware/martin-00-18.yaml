details: |-
  The Martin 00-18 brings together the intimate Grand Concert body shape with the classic spruce-and-mahogany tonewood pairing that has defined Martin's Style 18 instruments for generations. The smaller 00-14 fret body delivers a focused, articulate voice with a bright treble response and warm low end, making it equally at home for fingerstyle players and dynamic strummers.

  A solid Sitka spruce top with GE-scalloped 1/4" bracing gives the instrument a responsive, vintage-inspired voice, while the solid mahogany back and sides add warmth, woody mids, and clear note separation. The Gloss finish on the body lets the woods resonate freely while protecting the guitar through years of play.

  The Select Hardwood neck features Martin's GE Modified Low Oval profile with a High-Performance Taper, offering a comfortable, fast-feeling fretboard for both chord work and lead playing. The ebony fingerboard, 1 3/4" nut width, and 24.9" scale length combine for an inviting, fingerstyle-friendly feel, accented by 18 Old Style abalone dot inlays.

  Authentic period-correct details continue with an ebony GE Modern Belly bridge and compensated bone saddle, Old Style 18 multi-stripe rosette, faux tortoise pickguard, black binding, nickel open-gear tuners with butterbean knobs, and a solid East Indian rosewood headstock overlay with the Script Old Style Martin logo. The 00-18 ships pre-strung with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings and is delivered in a hardshell case.
specs: |-
  - Body size: 00-14 Fret (Grand Concert)
  - Top: Solid Spruce with GE-Scalloped 1/4" bracing
  - Top finish: Gloss, Aging Toner
  - Back and sides: Solid Mahogany with X-Brace pattern
  - Back and sides finish: Gloss, Dark Mahogany
  - Neck: Select Hardwood, Dark Mahogany, Satin finish
  - Neck shape: GE Modified Low Oval with High-Performance Taper
  - Scale length: 24.9"
  - Frets: 20 total, body joins at 14th fret
  - Fingerboard: Ebony
  - Nut width: 1 3/4"
  - Width at 12th fret: 2 1/8"
  - Fingerboard inlays: 18 Old Style abalone dots
  - Bridge: Ebony GE Modern Belly with drop-in saddle
  - String spacing: 2 5/32"
  - Saddle: Compensated Bone, 16" radius
  - Nut: Bone
  - Tuners: Nickel Open Gear with Butterbean knobs
  - Binding: Black
  - Pickguard: Faux Tortoise
  - Rosette: Old Style 18 Multi-Stripe
  - Headstock: Solid with Square Taper, East Indian Rosewood overlay, Script Old Style logo
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
  - Case: Hardshell with brass/nickel plated hardware
  - Electronics: None
