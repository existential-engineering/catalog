id: TO5KzAVAa1Bkc2MV50zds
name: SRM-400S
manufacturer: stax
primaryCategory: headphone-amp
categories:
  - amplifier
description: A middle-class semiconductor driver unit featuring FET
  amplification in all stages for electrostatic earspeakers. It combines
  high-resolution sound quality with improved power efficiency through a newly
  designed power transformer, offering balanced reproduction across the
  frequency spectrum.
details: |-
  Successor to the SRM-353X. STAX custom-made low-noise DUAL FET is installed on First Stage and FET is also installed on Last Stage. Right- and left-channel FETs are strictly matched. SRM-400S inherits the design and manufacturing method of the high-end SRM-700S, the amplifier with FETs installed in all stages.
specs: |-
  - Type: All-stage FET configuration DC amplification driver unit
  - Frequency response: DC – 90 kHz (with one SR-L500 MK2)
  - Gain: 60 dB
  - Harmonic distortion: 0.01% or less (1 kHz / 100 Vrms output)
  - Input impedance: 50 kΩ (RCA), 50 kΩ x 2 (XLR)
  - Maximum output voltage: 400 Vrms (1 kHz)
  - Bias voltage: DC 580 V
  - Operating temperature: 0 to 35 °C
  - Operating humidity: less than 90% (non-condensing)
  - Input terminals: RCA x 1, XLR x 1 (mutual exclusion input)
  - Output: RCA parallel output terminal
  - Power consumption: 30 W
  - Dimensions: 195 (W) x 102 (H) x 376 (D) mm
  - Weight: 3.4 kg
