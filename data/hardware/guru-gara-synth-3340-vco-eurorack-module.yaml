details: |-
  3340 VCO (Voltage Controlled Oscillator) – Fully Built & Calibrated Module

  At the heart of the 3340 VCO is its ability to generate four distinct waveforms: Square, Triangle, Ramp, and Sine. Whether you're seeking aggressive, edgy sounds or smooth, mellow tones, this module has you covered. With Hard Sync, Soft Sync, Linear Frequency Modulation, and a precise 1V/octave input, you have full control over the frequency behavior of your waveform, adding depth and complexity to your compositions. For those seeking detailed control over their pulse width modulation, the 3340 VCO provides an external control voltage input. This allows you to shape your pulse width with precision, unlocking a wide range of timbral variations and dynamic expression. This build uses an AS3340 integrated circuit, chosen for its reliability and excellent sound quality. Each module comes professionally built and fully calibrated , ready to drop into your Eurorack system. The front panel is crafted from PCB material and screen-printed by hand, giving each module a unique, high-quality finish. No soldering or assembly required – this is a ready-to-use module , designed for musicians and sound designers who want powerful, classic VCO functionality straight out of the box. Video Demo
