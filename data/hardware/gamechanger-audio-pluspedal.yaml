description: A sustain and sostenuto pedal for melodic instruments whose
  Real-time Audio Sampling algorithm captures the decay of the most recent note
  or chord as a seamless circular micro-loop, stacking up to five layers of
  sustain under a gradual brass foot pedal.
details: |-
  The Plus Pedal is a sustain and sostenuto pedal for all melodic instruments. It is more than a stomp-box, it is a compositional and arrangement tool that extends the potential of any instrument, bridging rhythm and lead parts and opening the doors to new soundscapes.

  Real-time Audio Sampling is a generative algorithm developed by Gamechanger Audio that adds piano-style sustain and sostenuto functionality to any musical instrument, by capturing and looping small segments of the instrument's output signal to produce smooth layers of sustain. Unlike granular synthesizers and synth-pad triggers, the Plus Pedal continuously records and analyzes a high-resolution audio buffer, and when engaged the algorithm identifies the optimal portion of the note's decay phase to create a seamless circular micro-loop. It works like a smart looper that catches the entire decay segment of the most recent note or chord and uses it to create a continuous sound. Because of this, each note or chord sustained retains the exact timbral qualities of the instrument and faithfully reflects the player's dynamics, which makes the pedal compatible with all melodic sound sources, including string instruments, synths, samples, brass, woodwinds and even vocals.

  Detailed control: the Plus Pedal offers full control over each layer of sustained sound. The RISE and TAIL knobs set the fade-in and fade-out speed of each new layer, and the SUSTAIN knob controls a gradual high-cut filter tuned to emulate the natural decay properties of plucked strings. The piano-style foot pedal provides a gradual response curve, which adds subtlety and nuance to every sustained layer.

  BLEND adjusts the volume of the wet signal, ranging between silence and roughly a 2x boost depending on the knob position. The middle position, marked by an indent in the potentiometer's path, represents an even volume balance between the instrument's input signal and the wet signal.

  RISE sets the fade-in speed of all new sustain layers. The minimum setting brings the wet signal in instantly, while the maximum produces extended gradual swells. A setting between 9 and 12 o'clock gives the smoothest transition between the instrument and the generated tone, while longer settings suit soundscapes and cinematic ambiance.

  TAIL adjusts the amount of signal spillover after each pedal release. At zero there is no spillover and the sustained tone cuts out as soon as the pedal is released. A 9 o'clock setting produces just enough spillover to create smooth transitions between different chords, which is useful when stepping outside diatonic harmonies. Past 12 o'clock the result is long, gradual fade-outs, giving enough time to build up multiple layers of sustain and to sample a new chord while the previous one is still ringing out. Set all the way up, all layers sustain infinitely. Up to five layers of sustain can be stacked on top of each other.

  SUSTAIN adjusts the speed and depth of a gradual high-cut filter applied to the sustained layers. This moving filter carves out space for melodic lines played on top of the sustained layers. At minimum the high-frequency cut is significant, and at maximum the sustained layers stay completely static for as long as the foot pedal is held, with no high-frequency reduction applied. In GROUP mode the SUSTAIN knob instead sets the number of layers allowed simultaneously, from one to five. The main LED indicates the setting, flashing once when the knob is turned all the way down and twice at around 10 o'clock.

  GROUP and SINGLE: the Plus Pedal can be operated in two modes, selected with a dedicated toggle switch. In SINGLE mode, holding the foot pedal down sustains the most recent layer while all previous layers continue fading out at the rate set by the TAIL knob. In GROUP mode, pressing and holding the foot pedal sustains the whole group of audio layers currently active, so a quick three-note arpeggio played at a medium TAIL setting can be held as all three layers.

  Outputs and SPLIT / MIX: the Plus Pedal features two 1/4-inch output jacks, labelled OUT and CLEAN OUT/FSW, plus a toggle switch on the pedal's side labelled SPLIT and MIX. OUT is the main output and can send two kinds of signal. In MIX, the most commonly used mode, it sends the wet signal combined with the dry signal from the instrument. In SPLIT it sends only the wet signal generated by the pedal, so the instrument's dry signal is muted while sustained layers can still be produced with the foot pedal. The second output, CLEAN OUT/FSW, sends out the unaffected dry signal from the instrument at all times. This dual output system gives a lot of diversity in setting up a signal chain and creating stereo effects, and CLEAN OUT/FSW also doubles as an input for the WET Only Footswitch.

  WET ONLY mode: all dry signal can be removed from the main output by activating a toggle switch on the pedal's side panel or by using a dedicated WET footswitch. This turns the Plus Pedal into a sound-design tool capable of creating stacked layers of sustained ambient note and chord swells from any instrument. The WET Only Footswitch serves as a remote foot controller for the mode, so it can be brought into various parts of a song arrangement as the player performs.

  Accessible FX loop: the Plus Pedal features a pair of Send and Return jacks on its side panel for patching in external effects units, and effects inserted into the loop affect only the sustain layers the pedal creates. Modulation effects such as chorus, vibrato, tremolo, flangers and phasers add movement, rhythm and turbulence to the sustained layers, while reverbs, delays, harmonizers, pitch-shifters, octavers and distortion units texturize and morph the sustained notes.
specs: |-
  - Real-time Audio Sampling captures and loops small segments of the instrument's output signal to produce layers of sustain
  - Up to five layers of sustain can be stacked
  - GROUP and SINGLE modes, selected with a dedicated toggle switch
  - BLEND knob sets the wet signal volume, from silence to roughly a 2x boost, with a centre indent marking an even balance against the dry signal
  - RISE knob sets the fade-in speed of new sustain layers
  - TAIL knob sets the amount of signal spillover after each pedal release, reaching infinite sustain at its maximum
  - SUSTAIN knob sets the speed and depth of a gradual high-cut filter on the sustained layers, and in GROUP mode sets the number of simultaneous layers from one to five
  - Two 1/4-inch output jacks, OUT and CLEAN OUT/FSW, with a side-panel SPLIT and MIX toggle
  - CLEAN OUT/FSW sends the unaffected dry signal at all times and doubles as the input for the WET Only Footswitch
  - Send and Return jacks on the side panel, for an FX loop that processes only the sustain layers
  - Side-panel toggle, or the optional WET footswitch, removes all dry signal from the main output
  - Piano-style brass foot pedal with a gradual response curve
  - Power: standard 9V DC center-negative pedal supply, 2.1 x 5.5 mm barrel plug, at least 250 mA (not included)
  - Lifetime warranty
