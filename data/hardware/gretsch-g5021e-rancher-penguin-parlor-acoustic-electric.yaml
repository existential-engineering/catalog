details: |-
  Surely one of the most fabulous Gretsch birds ever to take flight, the G5021E Rancher Penguin Parlor Acoustic/Electric delivers classic Penguin style and appointments in a richly resonant parlor-size acoustic guitar.

  The Fishman Presys III pickup/preamp system provides a modern sonic complement to classic touches including a solid spruce top with maple back and sides, gold sparkle neck and body binding, Neo-Classic thumbnail position inlays and gold-sparkle binding.

  Built for live performance, the Rancher Penguin Parlor is offered in finishes including Black, Mint Metallic, Shell Pink and White with gold hardware throughout.
