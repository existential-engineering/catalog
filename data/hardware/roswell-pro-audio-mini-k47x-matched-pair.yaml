  overheads and piano.
details: |-
  The Mini K47x is a large-diaphragm condenser that combines the color of its K47 capsule with harmonic saturation from its transformer-coupled circuit. Find single microphones here . Matched pairs of the K47x are wonderful on drum overheads and piano. Each K47x is soldered, assembled and hand-wired in California, using premium components selected by ear to give the mic its characteristic tone. Each mic is "burned in" and extensively tested by staff engineers at our workshop. Matching Criteria

  We match these mics to 0.5dB in sensitivity (measured at 1kHz), and 1.5dB (or better) in frequency response, 50Hz–15kHz. Headroom On Demand

  To ensure that matched pairs have plenty of headroom for use as overheads for loud drummers, we install an internally switchable 10dB attenuation pad in each of the K47x microphones used for matched pairs. Most customers will not need this additional headroom... but if you do, unscrew the base of the microphone (no tools needed), slide the body sleeve off, flip the toggle switch inside the mic, screw the body back on, and get back to the session. Included Accessories

  Each microphone includes our exclusive Cutaway metal-frame shockmount (with spare elastics), and a Roswell branded microfleece dust cover. Matched pairs ship in a single stereo-pair aluminum flightcase, which holds two microphones and two shockmounts. Custom Shop
