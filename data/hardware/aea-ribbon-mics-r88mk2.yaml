description: A dual passive Big Ribbon stereo microphone in a fixed Blumlein (XY
  coincident) configuration, capturing the full sonic character of a room with
  honest, open tonality from far-field distances up to 20 feet.
details: |-
  The R88 Series captures a space as it sounds live and in person, with all the present subtlety and nuance. Its expansive frequency response and balanced low end make it superbly effective when capturing the full breadth of sound from the back of a room or above a drum set. Alongside the mono AEA N8, it boasts the widest frequency range of any mic in the AEA lineup.

  The design of the R88 Series borrows from serious stereo recording tradition. In 1931, EMI engineer Alan Blumlein invented stereo recording by demonstrating the natural reproduction of the soundstage. Today, Blumlein's XY coincident recording technique lives on in the AEA R88 Series, which uses two figure-of-8 ribbons for producing an authentic representation of a performance. The pair of elements are angled at 90 degrees and mounted in close proximity along the vertical axis.

  As an alternative to Blumlein's technique, the microphone can also be used for mid-side (MS) stereo, providing excellent mono compatibility and full control over the width of the stereo image. R88 Series mics are packaged in a sleek, 2.6 pound black shell designed for quick setup, making it an excellent choice for remote recording.

  As a stereo far-field ribbon microphone, the R88 Series was designed to capture balanced sound from long distances. From 16 inches to 20 feet, the mic retains its full spectrum and incredible low end. The R88 Series can handle 165+ dB SPL at 1 kHz.

  Since the R88mk2 is a dual passive ribbon microphone, the preamp is critical for optimum performance. Preamp gain should be at least +60dB or higher and the preamp should have a very high impedance.
specs: |-
  - Dual Big Ribbon™ elements in fixed Blumlein (XY coincident) and mid-side configuration
  - Two figure-of-8 ribbon elements angled at 90 degrees along the vertical axis
  - Far-field ribbon mic designed to retain low end and top end at a distance
  - Handles 165+ dB SPL at 1 kHz
  - Optimal operating distance: 16 inches to 20 feet
  - Passive design requiring preamp with at least +60dB gain and high impedance (>5K ohm)
  - Weight: 2.6 lbs
  - Made in the U.S.A. (Pasadena, CA)
