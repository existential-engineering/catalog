description: A feedback octave oscillator fuzz pedal with a feedback loop
  (Messiah knob), voltage-controlled LFO, and a voltage-controlled low pass
  filter with resonance.
details: |-
  The Doom Messiah is a feedback octave oscillator fuzz, which will make every signal sound like cyber satan eating scanners. This is not a Simple Fuzz Distortion, the DOOM MESSIAH has a feedback loop feature (Messiah Knob) that feeds the output back into the input. Creating insane feedbacks self oscillating sounds (the pedal can sound even without any signal in). The lfo (voltage controlled) knob works only when the Doom and Tone knob are down and will add another modulable oscillation. Low pass filter with cut off (voltage controlled) and resonance will give extra control over the frequencies and give the user more Tone options.
