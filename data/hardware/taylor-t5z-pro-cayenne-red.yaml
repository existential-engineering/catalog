details: |-
  The T5z Pro is Taylor's mid-tier hybrid hollowbody, bridging acoustic and electric with a three-pickup system: a concealed neck humbucker, a visible middle humbucker, and an acoustic body sensor. Five-way switching and active tone controls deliver everything from warm acoustic sounds to electric tones.

  This Cayenne Red variant features a Big Leaf Maple top in Cayenne Red Shaded Edgeburst with black back, sides, and neck. The Shamel Ash body is contoured with an integral armrest, Venetian cutaway, and rosette f-holes.

  The Neo-Tropical Mahogany neck in T5 Carve profile is topped by a West African Crelicam Ebony fretboard with black binding and jumbo frets. At 24-7/8" scale length and 1-11/16" nut width, it plays like a traditional electric guitar.

  Ships with D'Addario XS Coated Electric Medium strings (.011-.049) and a deluxe hardshell case.
specs: |-
  - - Body: Hollowbody with Venetian Cutaway
  - Top: Big Leaf Maple
  - Back & Sides: Shamel Ash
  - Finish: Gloss; Cayenne Red Shaded Edgeburst top, black back/sides/neck
  - Neck: Neo-Tropical Mahogany, T5 Carve profile
  - Fretboard: West African Crelicam Ebony, Black binding
  - Scale Length: 24-7/8"
  - Nut Width: 1-11/16"
  - Frets: Jumbo
  - Pickups: Concealed neck humbucker, visible middle humbucker, acoustic body sensor
  - Switching: 5-way; Active tone controls
  - Bridge: West African Crelicam Ebony
  - Nut: White TUSQ
  - Saddle: White Micarta
  - Tuners: Taylor Nickel with Nickel Buttons
  - Strings: D'Addario XS Coated Electric Medium (.011-.049)
  - Case: Deluxe hardshell case included
