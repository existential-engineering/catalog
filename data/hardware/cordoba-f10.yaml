details: |-
  The F10 is a beautiful all-solid traditional flamenco guitar, suitable for intermediate and professional players. Its European Spruce top with Cypress back and sides provide a crisp, well-balanced tone with plenty of volume and flamenco growl. It is built with a slightly thinner body than a traditional classical guitar and its flat neck angle creates low action and the quintessential flamenco buzz.
