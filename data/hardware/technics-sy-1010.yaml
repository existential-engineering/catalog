description: >-
  A modest monophonic analog synthesizer from 1979 built by Matsushita under the Technics brand,
  featuring a single sawtooth oscillator and low-pass filter with a distinctly melancholic character.
details: |-
  The Technics SY-1010 is one of those overlooked instruments from the late 1970s Japanese synthesizer boom. Manufactured by Matsushita and sold exclusively through Technics showrooms in Japan, it was marketed alongside premium home audio equipment rather than as a serious musician's tool.

  At its core is a single VCO producing a sawtooth waveform, routed through a low-pass VCF and shaped by a standard ADSR envelope on the VCA. An onboard LFO with a sine waveform adds basic modulation possibilities. The 32-key keyboard is compact but functional for the monophonic lines and textures the instrument was designed to produce.

  The SY-1010 has a solid plastic enclosure that is prone to yellowing with age. Connectivity is limited to RCA outputs and a quarter-inch jack, with no MIDI, CV, or gate interfacing available. There is also no pitch bend or modulation wheel, which keeps the playing experience straightforward but restrictive.

  Despite its simplicity, the SY-1010 has a certain lo-fi charm that appeals to collectors and experimentalists drawn to its raw, unpolished analog voice.
specs: |-
  - Polyphony: 1 voice (monophonic)
  - Multitimbral: 1 part
  - Oscillators: 1 VCO (sawtooth waveform)
  - LFO: 1 (sine waveform)
  - Filter: Low-pass VCF
  - VCA: 1 with ADSR envelope
  - Keyboard: 32 keys
  - Output: RCA (low/high), 1/4" jack
  - Control: None (no MIDI, CV, or gate)
