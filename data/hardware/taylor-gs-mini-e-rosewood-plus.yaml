description: The GS Mini-e Rosewood Plus is a compact acoustic-electric guitar
  featuring a solid Sitka spruce top with layered rosewood back and sides,
  equipped with Taylor's Expression System 2 pickup in a travel-friendly GS Mini
  body. It ships with a brown AeroCase.
details: |-
  The GS Mini-e Rosewood Plus is an upgraded take on Taylor's compact acoustic-electric. Built around a GS Mini body shape, it pairs a solid Sitka spruce top with layered rosewood back and sides, delivering a warm, articulate voice with impressive projection for its size.

  The neck is crafted from tropical mahogany with a West African Crelicam ebony fretboard and bridge, providing a smooth, responsive playing surface. A 23-1/2" scale length makes it comfortable for players of all ages, and the Nubone nut and saddle contribute to clear, even tone across the fretboard.

  For amplified performance, the guitar is equipped with Taylor's Expression System 2 (ES2), a behind-the-saddle pickup design that captures the guitar's natural acoustic dynamics with exceptional accuracy. The system integrates cleanly into the body without bulk.

  Every GS Mini-e Rosewood Plus ships with a protective brown AeroCase at no extra charge and is backed by Taylor's free lifetime warranty. Strings are D'Addario XS Coated Phosphor Bronze Medium (.013-.056).
specs: |-
  - - Body Shape: GS Mini
  - Top: Solid Sitka Spruce (gloss)
  - Back & Sides: Layered Rosewood, 2-piece (gloss)
  - Bracing: X-Bracing with Relief Rout
  - Neck: Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Fretboard Inlay: 4mm Dot Italian Acrylic
  - Nut & Saddle: Nubone
  - Scale Length: 23-1/2"
  - Tuners: Taylor Nickel
  - Electronics: Expression System 2 (ES2)
  - Pickguard: Black
  - Strings: D'Addario XS Coated Phosphor Bronze Medium (.013-.056)
  - Case: Brown AeroCase included
