id: lMaBcKqkLqVrYJu8hr7Hs
name: SP-303 Dr. Sample
manufacturer: boss
primaryCategory: sampler
categories:
  - drum-machine
description: >-
  A compact, portable phrase sampler offering DJs and musicians CD-quality sound, 8-note
  polyphony, 26 onboard effects and a realtime pattern sequencer.
details: |-
  The BOSS SP-303 Dr. Sample provides a step up from the SP-202, featuring full 44.1 kHz sampling, double the polyphony and greater sampling memory and effects processing in a compact package. Users can sample sounds and loops with up to 200 minutes of sample time at 11 kHz using a 64MB SmartMedia Card. The device supports triggering up to 8 mono samples simultaneously and creating songs from loops and phrases up to 99 measures long. It includes 26 effects such as reverb, flanger, delay, Voice Transformer, distortion, Slicer, Isolator, Lo-Fi, and Vinyl Simulator, plus filter Cutoff and Resonance controls. The Resample feature allows users to create new samples with applied effects. It serves as an inexpensive alternative to more expensive samplers, well-suited for DJs and live performers.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 44.1 kHz (standard), 22.05 kHz (long), 11.025 kHz (lo-fi); 31 seconds to 202 min
  - Effects: 26 effects including Filter + Drive, Pitch, Delay, Vinyl Sim, Isolator, Reverb, Tape Echo
  - Memory: 32 samples (16 intern, 16 SmartMedia 3.3V Card); up to 112 samples backup
  - Keyboard: 8 touch pads
  - Control: MIDI IN
releaseDate: "2001"
