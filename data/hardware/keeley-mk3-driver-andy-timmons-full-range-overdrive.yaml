details: |-
  The Mk3 Driver is a full range overdrive developed with Andy Timmons, covering ground from clean boost and treble lift through chimey tube-amp overdrive to square-wave germanium fuzz. It pairs a three-control blues driver circuit with two voicing switches for drive and tone, and the bypass mode can be changed between true bypass and buffered bypass at any time.

  The Tone switch selects between two tone circuits. In the AT position it uses Andy Timmons' preferred low-end voicing, keeping each note in a chord clear and articulate. In the RK position it uses the Phat Boost low-end response, intended for pushing vintage or single coil pickups.

  The Drive switch selects the clipping stage. Up, in the AT position, the circuit uses asymmetrical LED diode clipping, the Super AT Mod sound, which is brighter with a more articulate attack. Down, in the RK position, two germanium diodes do the clipping for a smoother, slightly compressed drive. The circuit as a whole combines JFET saturation, diode clipping and op-amp clipping.

  Switching is handled by Keeley's buffer for noise-free operation, and holding the footswitch for two seconds toggles between true bypass and buffered bypass. The pedal is designed, engineered and manufactured in Oklahoma City, with circuit boards and aluminium enclosure built in house.
specs: |-
  - Blues driver style circuit with Keeley modifications
  - Germanium based overdrive voiced with Andy Timmons
  - AT/RK Tone switch: cuts lows for clarity or boosts low end for power
  - AT/RK Drive switch: asymmetrical silicon clipping or dual germanium diodes
  - Selectable buffered bypass or true bypass, toggled by holding the footswitch for two seconds
  - JFET transistors, germanium diodes and op-amp gain stages
  - 9 to 18 volt operation
  - Manufactured in Oklahoma City, USA
