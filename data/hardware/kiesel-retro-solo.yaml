description: The Retro Solo is a traditional spin on the Solo. The timeless look
  pairs with the vast combination of modern and vintage custom shop options
  offered by Kiesel to create one-of-a-kind instruments.
specs: |-
  - Scale length: 25.5"
  - Frets: 22 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder, 38.25" long, 1.65" thick, 12.5" wide
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.68" at nut, 2.22" at 24th fret, .780" thick at 1st fret, .870" thick at 12th fret
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: 10" ebony
  - Headstock: GT-style headstock
  - Bridge: Gotoh WT3, .425" (10.8mm) spacing
  - Pickups: Kiesel AP90s or Seymour Duncan Antiquity T; neck Retro Antiquity Telecaster model 11024-21-RSPD, bridge Antiquity Telecaster model 11024-22
  - Electronics: master volume and tone controls with Dunlop Super Pots, 3-way lever style pickup selector; flush mount or rear access output jack placement
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Hardware: chrome
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 7.8 lbs
  - Finishes seen in the gallery include antique ash treatment, white/white with Raw Tone top coat, and jet black
