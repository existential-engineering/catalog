  - Amplifier output per speaker: 500W (LF Class D) + 100W (MF Class D) + 100W (HF Class AB)
  - Frequency Range (-6dB): 26 Hz – 36 kHz
  - Frequency Response (±3dB): 31 Hz – 24 kHz
  - Max SPL: 111 dB at 1m
  - Dimensions with plinth: 1090 x 212 x 394 mm
  - Weight: 62.4 kg per set
