description: A professional shotgun microphone that captures authentic sound
  with high clarity and consistency.
details: |-
  Designed to excel at the challenging requirements of the broadcast industry, the 2017 is a reliable shotgun microphone, featuring durable construction and exceptional ease of use, combined with extraordinary acoustical properties. The 2017 performs both in fixed positions, on camera systems and on booms.
specs: |-
  - Directional pattern: Supercardioid @1 kHz
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range, ±2 dB, at 60 cm (23.6 in): 70 Hz to 18 kHz at 60 cm (23.6 in), with typ. 2 dB soft boost at 15 kHz
  - Sensitivity, nominal, ±2 dB at 1 kHz: 25 mV/Pa; -32 dB re. 1 V/pa
  - Equivalent noise level, A-weighted: Typ. 13 dB(A) re. 20 µPa (max. 15 dB(A))
  - Distortion, THD < 1%: 140 dB SPL, 143 dB SPL peak
  - Dynamic range: Typ. 130 dB
  - Max. SPL, THD 10%: 148 dB SPL peak
  - Rated output impedance: 60 Ω
  - Cable drive capability: 100 m (328 ft)
  - Output balance principle: Impedance balancing with Active Drive
  - Common mode rejection ratio (CMRR): > 60 dB
  - Power supply (for full performance): P48 (Phantom Power)
  - Current consumption: 1.8 mA
  - Connector: XLR-3M. Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase
  - Weight: 115 g (4.1 oz)
  - Microphone diameter: 19 mm (0.75 in)
  - Capsule diameter: 17 mm (0.67 in)
  - Microphone length: 184 mm (7.2 in)
  - Maximum output voltage, RMS: 8.7 V (21 dBu)
  - Polarity: +V at pin 2 for positive sound pressure
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black
