description: Bagài is an analog sample and hold, bitcrusher, and downsampler for
  Eurorack systems, also capable of generating clock bursts, fluctuating random
  voltages, and colored noise.
details: |-
  Bagài is an analog sample and hold, bitcrusher, and downsampler for Eurorack systems, also capable of generating clock bursts, fluctuating random voltages, and colored noise. It consists of six highly intertwined sections, and all its major parameters are voltage controllable.

  By default it outputs bipolar random voltages and triggers. The voltages are fluctuating, stepped, and quantized with selectable bit depth, and the clocks are straight, randomized, or burst. Once patching starts it can be used as a sample and hold, an audio downsampler, and a bitcrusher, with a sample rate of 48 kHz.

  Bagài features two stepped sample and hold circuits with open input, semi-normalled by default to an analog noise source. The quantized one has an LSB selector that defines its bit depth, from 1 to 8 bits, and with audio signals it becomes a warm bitcrusher with voltage-controllable bit depth. The internal clock can switch to an audio rate mode going up to 34 kHz, so patching audio into the sample and hold input turns the module into an analog downsampler.

  Besides the main, more-than and less-than modes, Bagài features a clock burst circuit that creates fast and unpredictable streams of gates, which can be combined with the main clock or with any other trigger. Both the main clock and the clock bursts can be controlled from external gates, and the main clock also carries a button to hold it manually. Many semi-normalled connections keep the signal path open for cross-patching.

  At Bagài's core is a thermal noise generator that feeds the sample and hold circuit, creating random voltage streams, and the noise output carries a knob that changes its color, emphasizing the high or low frequencies. Bagài belongs to the same family as Sapèl, with one clock generator and one fluctuating random voltage circuit where Sapèl has two of each, bipolar rather than unipolar voltages, and a burst section Sapèl does not have.
specs: |-
  - Clock with straight and random outputs
  - Analog noise generator with variable color
  - Bipolar fluctuating random voltage generator with variable rate
  - Sample and hold circuit with selectable time scale, slow for modulation or fast for audio sampling up to 48 kHz
  - 8-bit quantized sample and hold with variable bit depth, 1 to 8 bits
  - Clock burst section
  - Clock range ~0.05 to 75 Hz, and ~0.025 to 34 kHz in audio rate mode
  - Quantization: fixed source amplitude with variable bit depth
  - Sample and hold source: built-in thermal noise or any external signal
  - Random clocks: one section with simultaneous more-than, less-than and burst
  - All major parameters are voltage controllable
  - Bus-powered from the Eurorack case power header, with no power jack of its own
