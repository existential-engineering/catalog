description: >-
  The SH-5 is a classic yet very advanced monophonic analog synthesizer from Roland,
  rivalled mainly by its successor the SH-7. It features two analog VCOs with triangle,
  ramp, square, and pulse waveforms, two LFOs, two multi-mode filters, two VCAs, and white
  and pink noise generators. Notable users include Eat Static and Freddy Fresh.
details: |-
  The Roland SH-5 is one of the most capable monophonic synthesizers Roland ever produced. Its dual VCO architecture provides a rich palette of waveforms including triangle, ramp, square, and pulse, with a wide range from 32' to 2'. The inclusion of two independent multi-mode filters sets it apart from most monosynths of its era.

  The filter section is particularly notable, with VCF 1 offering hi-pass, low-pass, and band-pass modes, while VCF 2 provides dedicated band-pass filtering. Two separate VCAs with both AR and ADSR envelope options give extensive dynamic shaping capabilities. Additional features include two LFOs, a sample-and-hold circuit, stereo output with panning controls, and portamento.

  The SH-5 is controlled via CV/Gate and features a 44-key keyboard. While it lacks memory storage for patches, its extensive front-panel controls make it a hands-on performance instrument that remains highly sought after by analog synthesizer enthusiasts.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs, range 32' to 2' (triangle, ramp, square, pulse)
  - LFO 1: Rate, ramp, reverse ramp
  - LFO 2: Rate, delay, triangle, sine, square
  - Sample and Hold: Yes
  - Filter 1 (VCF 1): Hi-pass, low-pass, band-pass
  - Filter 2 (VCF 2): Band-pass
  - VCA: 2 VCAs with AR and ADSR envelopes
  - Noise: White and pink noise generators
  - Keyboard: 44 keys
  - Control: CV/Gate
  - Output: Stereo with panning controls
  - Portamento: Yes
  - Memory: None
  - Date Produced: 1976-1981
releaseDate: "1976"
