details: |-
  What better way to celebrate the Pacific Northwest's favorite imperfect lil guy than with an imperfect rendering of your own guitar's signal? The Jimothy Bit Crush captures the essence of the Pacific Northwest's favorite pseudo-cryptid in his natural environment, frolicking within an imperfect error-laden landscape, first imagined in Catalinbread's Knight School Bit Crush pedal. This pedal features what's called a sample rate reducer, which samples your guitar signal and degrades the quality of those samples at an interval you choose. A wet-dry Mix control lets you tailor the response to your rig as you see fit. Embrace the imperfect! Artwork by Noble Hardesty (noblehardesty.com).
specs: |-
  - Sample rate reducer with a full wet/dry Mix control
  - Controls: Degrade, Mix
  - Accepts a 9V center-negative DC power supply
  - Artwork by Noble Hardesty
