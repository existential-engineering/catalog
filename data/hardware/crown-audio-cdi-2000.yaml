name: CDi 2000
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-2000
description: Two-channel, 800W @ 4Ω, 70V/140V Power Amplifier designed and built
  for installed sound applications. Rugged and lightweight with onboard DSP for
  crossovers, EQ filters, delay, and output limiting.
specs: |-
  - 2 channels
  - 800W per channel @ 4Ω (stereo)
  - Rated for 2-, 4-, 8-ohm loads and 70V/140V outputs
  - Sensitivity (full rated power @ 8Ω): 1.4V
  - Signal-to-Noise Ratio: 100 dB (A-weighted)
  - THD: < 0.5%
  - Damping Factor (20Hz-400Hz): > 500
  - Frequency Response: +0/-1 dB (20Hz-20kHz)
  - Crosstalk (20Hz-1kHz): > 70 dB
  - Input Impedance: 20kΩ balanced, 10kΩ unbalanced
  - Switch-mode universal power supply
  - Front-panel LCD screen
  - Onboard DSP: crossovers, EQ, delay, limiting
  - Up to 20 user-defined DSP presets
  - Dimensions: 3.5" × 19" × 12.25"
  - Weight: 22.0 lbs
  - IEC Power Connector: 15A
