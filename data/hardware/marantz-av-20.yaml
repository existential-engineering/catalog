url: https://www.marantz.com/en-us/product/av-processors-pre-amplifiers/av-20/301022.html
description: Reference 13.4 channel balanced AV preamplifier powered by HEOS.
  Features Marantz HDAM discrete circuitry, fully balanced XLR outputs, seven 8K
  UHD-capable HDMI inputs, four independent subwoofer outputs, and support for
  Dolby Atmos, DTS:X Pro, and Auro-3D immersive audio formats.
details: |-
  The Marantz AV 20 is a reference 13.4 channel balanced AV preamplifier engineered for high-end home theater systems. It carries forward Marantz's signature HDAM (Hyper Dynamic Amplifier Module) discrete circuitry, with SA3 monolithic modules and current feedback topology delivering immersive spaciousness, rich tone, and lifelike dynamics.

  Processing supports the full slate of contemporary immersive audio formats including Dolby Atmos with Height Virtualization, DTS:X Pro, Auro-3D, IMAX Enhanced, 360 Reality Audio, and MPEG-H. Audyssey MultEQ XT32 room correction is included out of the box with optional upgrade to Dirac Live.

  Connectivity emphasizes professional-grade integration with 15.4 channels of fully balanced XLR preamp outputs alongside multichannel RCA preouts. Four independent subwoofer outputs with variable crossover, optimized bass redirection, and bass sync provide flexible low-frequency management. Seven 8K UHD-capable HDMI inputs and three HDMI outputs (one with eARC) support 8K/60Hz and 4K/120Hz pass-through with up to 40Gbps bandwidth and full HDR ecosystem compatibility including HDR10, HDR10+, Dolby Vision, HLG, and Dynamic HDR.

  The integrated HEOS ecosystem provides multi-room audio streaming with AirPlay 2, Spotify Connect, Amazon Music, TIDAL, Deezer, and Roon Ready support. Hi-res audio playback covers FLAC HD 192/24, ALAC 192/24, WAV 192/24, and DSD 2.8/5.6MHz with gapless playback. Control integration encompasses IP, RS-232, web, and mobile app protocols, plus IR flasher input, Marantz remote bus, and three DC trigger outputs.
specs: |-
  - 13.4 processing channels
  - 7 HDMI inputs (all 8K UHD capable)
  - 3 HDMI outputs (1 with eARC)
  - 15.4 channel balanced XLR preamp outputs
  - 15.4 channel RCA multichannel preamp outputs
  - 4 independent subwoofer outputs (RCA and XLR)
  - 8K/60Hz and 4K/120Hz HDMI 2.1 pass-through (up to 40Gbps)
  - HDR10, HDR10+, Dolby Vision, HLG, Dynamic HDR support
  - HDCP 2.3 support
  - Supports Dolby Atmos, DTS:X Pro, Auro-3D, IMAX Enhanced, 360 Reality Audio, MPEG-H
  - Audyssey MultEQ XT32 room correction (Dirac Live upgradable)
  - HDAM SA3 monolithic discrete amplification with Current Feedback Topology
  - Pure Direct mode with gold-plated RCA terminals
  - Copper-plated chassis with toroidal power transformer
  - HEOS built-in multi-room streaming
  - AirPlay 2, Spotify Connect, Amazon Music, TIDAL, Deezer, Roon Ready
  - Hi-res audio: FLAC/ALAC/WAV 192/24, DSD 2.8/5.6MHz, gapless playback
  - Ethernet, Wi-Fi, Bluetooth connectivity
  - AM/FM tuner
  - 3 DC trigger outputs, IR flasher input, Marantz remote bus, RS-232
  - 2-line FLD display with port hole OLED
  - 90W typical power consumption; 0.2W standby
  - Dimensions: 17.4 in W x 18.0 in D x 10.0 in H (with antenna)
  - Weight: 33.1 lbs
  - MSRP: $6,000 USD
