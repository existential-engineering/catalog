details: |-
  AV 20 delivers the highest measure of performance and capability for reference-level home theater systems. This 13.4-channel balanced AV preamplifier features Marantz HDAM discrete circuitry, seven 8K UHD-compatible HDMI inputs, Dolby Atmos, DTS:X Pro, AURO-3D, and four independent subwoofer outputs for advanced custom home theater installations.

  When it comes to home theater, Marantz AV Separates bring your movies to life. AV 20 bears all the cinematic performance and feature-rich innovation Marantz is renowned for, expertly engineered with a timeless design.

  Comprehensive connectivity options and extensive optimization ability ensure AV 20 will always deliver the perfect results to suit your home theater. The preamplifier can be combined with other Marantz components such as the AMP 20 power amplifier.

  Every channel is available on both gold-plated RCA and balanced XLR pre-outs (15.4 of each), alongside seven 8K HDMI inputs, three HDMI outputs with eARC, phono (MM), two coaxial and two optical digital inputs, and a balanced XLR analog input.

  HEOS is built in for high-resolution music streaming, with AirPlay 2, Spotify Connect, Bluetooth, Roon Ready certification and Wi-Fi or wired Ethernet networking. Room correction is Audyssey MultEQ XT32 with Dirac Live available as an upgrade.
specs: |-
  - 13.4 processing channels, balanced AV preamplifier
  - 15.4-channel pre-out on both RCA and XLR
  - Four independent subwoofer outputs
  - Seven 8K HDMI inputs (all 8K/60Hz, 4K/120Hz, up to 40Gbps), three HDMI outputs with eARC
  - Dolby Atmos, Dolby Atmos Music, DTS:X Pro, DTS Neural:X (13ch), Auro-3D, IMAX Enhanced, 360 Reality Audio, MPEG-H
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - Dirac Live upgradable
  - Marantz HDAM SA3 monolithic modules, current feedback topology, copper-plated chassis, toroidal power transformer
  - HEOS built-in, AirPlay 2, Spotify Connect, Roon Ready, Bluetooth with headphone retransmit
  - Three multi-room zones, 3 DC triggers, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 90 W, standby 0.2 W
