description: TS jacks for interfacing external 1/4" equipment with the Pedal I/O 1U module.
details: |-
  The Pedal I/O JACKS 1U module connects behind-the-panel to the Pedal I/O 1U module, providing a pair of 1/4-inch in/out jacks for connecting guitars or stompboxes directly to your modular.

  This module only works when connected to a Pedal I/O 1U module using the link cable included with that product, enabling you to connect high impedance external signals (such as guitars or pedals) directly to your Eurorack system via the Pedal I/O 1U.
specs: |-
  - Width: 8HP
  - Depth: 44mm
  - Power: Passive
  - 1/4-inch TS jacks for external equipment
  - Connects behind-the-panel to Pedal I/O 1U via included link cable
