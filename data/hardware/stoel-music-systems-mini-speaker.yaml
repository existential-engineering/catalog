details: |-
  Enjoy your Eurorack system anywhere without hooking up speakers or using headphones. The Stoel Music Systems Mini Speaker is great for casual jam sessions with friends without headphones, sharing your love for electronic music with others outside the studio, in the classroom to demonstrate music and physics, or just annoying your neighbors. For large cases, two speakers can be installed for a stereo effect. How loud does it get? This module features a 4-watt amplifier and 3" (77mm) speaker rated for 4 watts continuous, 8 watts peak. The speaker has an efficiency of 84dB @ 1 watt, measured from 1 meter away, so expect a maximum output of around 90dB at 1 meter away, or 93dB when standing about 18" away. It's loud enough to be heard across a small to medium-sized room but not loud enough to be heard over drums or loud guitars. How does it sound? The speaker is somewhat bandwidth-limited due to its small size but still delivers clear sound when playing back full-range music. The Eurorack case acts like a large speaker cabinet, contributing to the low-frequency response. The bass response rolls off around 200 Hz, and the high frequencies roll off above 10kHz. It can be miked up and recorded for a lo-fi effect. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

