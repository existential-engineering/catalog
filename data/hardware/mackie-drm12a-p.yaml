id: K3HmjdxyzWD06QSnuppwK
name: DRM12A-P
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/drm-passive-series/DRM12A_P.html
description: 12" 2000W Arrayable Passive Speaker. A 2000W constant curvature
  line array loudspeaker featuring high-output custom transducers housed in a
  touring-grade plywood cabinet for consistent performance in all applications.
details: |-
  We took everything we've learned in over three decades as an industry leader in pro audio to design the Mackie DRM12A-P passive line array speakers. This 2000W constant curvature line array loudspeaker features high-output custom transducers housed in a touring-grade plywood cabinet designed for consistent performance in all applications.

  Equipped with M10 flypoints and dual angle pole mounts, DRM12A-P is perfect for clubs, touring, rental systems, Houses of Worship, and more. Flyable with up to 4 total DRM12A-P loudspeakers and 2 DRM18S-P subwoofers. Requires optional flybar.
specs: |-
  - Power Handling: 500W continuous / 1000W program / 2000W peak
  - Coverage: 20° V x 110° H
  - Frequency Response: 47Hz - 20 kHz
  - Max SPL: 132 dB
  - LF Driver: 12" high-excursion woofer
  - HF Driver: Triple 1" Titanium diaphragm compression driver array
  - Weight: 53.7 lb / 24.4 kg
  - Cabinet: 15mm touring-grade plywood construction
  - Pole mount: Dual-angle
  - Flypoints: M10
  - Flyable: Up to 4 DRM12A-P loudspeakers with optional FB100 flybar
