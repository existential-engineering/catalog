description: The Mackie DRM12A-P is a 2000W, 12-inch passive line array speaker
  in road-ready cabinets for clubs and venues that delivers industry-leading
  sound.
details: |-
  We took everything we have learned in over three decades as an industry leader in pro audio to design the Mackie DRM12A-P passive line array speakers. This 2000W constant curvature line array loudspeaker features high-output custom transducers housed in a touring-grade plywood cabinet designed for consistent performance in all applications.

  Equipped with M10 flypoints and dual angle pole mounts, DRM12A-P suits clubs, touring, rental systems and houses of worship. It is flyable with up to four DRM12A-P loudspeakers and two DRM18S-P subwoofers, which requires the optional FB100 fly bar.

  Custom transducers housed in coated touring-grade plywood cabinets are designed for consistent performance in the most demanding applications.

  Equipped with M10 flypoints, dual angle pole mounts, and available line array configurations, the DRM Series suits clubs, houses of worship and rental systems.
specs: |-
  - 12 in arrayable passive loudspeaker (constant curvature line array)
  - Power handling 500W continuous / 1000W program / 2000W peak (1000 watts RMS, 2000 watts peak)
  - Max SPL 132 dB peak
  - Frequency range 47 Hz - 20 kHz (-10 dB), 60 Hz - 18 kHz (-3 dB)
  - Coverage 110 degrees horizontal x 20 degrees vertical; array coverage 40/60/80 degrees vertical for 2/3/4 cabinets
  - Crossover frequency 1.0 kHz
  - 12 in / 305 mm ferrite woofer
  - 3x 1.0 in / 25 mm titanium dome compression drivers
  - Nominal impedance 8 Ohm
  - 1x female speakON input, 1x female speakON thru (parallel)
  - 15 mm plywood enclosure with black polyurea finish, powder-coated 16-18 gauge steel grille
  - Horizontal trapezoidal cabinet, dual angle pole mount, 7x M10 flypoints, 50 degree monitor angle
  - Flyable with up to 4 DRM12A-P and 2 DRM18S-P using the optional FB100 fly bar
  - Dimensions 15.2 x 24.7 x 18.0 in / 386 x 627 x 457 mm (H x W x D)
  - Weight 53.7 lb / 24.4 kg
