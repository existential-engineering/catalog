details: |-
  Bass is a vital element in the enjoyment of sound. It's true for both music and movies, and it's as true for custom installation as it is for an audiophile's two-channel hi-fi or a home cinema system. ISW-6 is a discreet, compact and versatile custom installation subwoofer designed to work primarily with Bowers & Wilkins CI300 and CI600 speakers.

  Flexible and discreet. ISW-6 is supplied with a discreet grille as standard, and the cabinet can be mounted either horizontally or vertically, for further flexibility of positioning. Its thin profile allows it to fit into a 2in x 4in stud wall.

  High-performance bass. The ISW-6's twin drivers are arranged in a force-cancelling configuration. This approach dramatically reduces the potential for the ISW-6 to excite the wall around it, leading to a cleaner sound with minimal sound leakage.

  Retrofit option. Although the ISW-6 is primarily designed to be installed during construction, it is small and flexible enough to be retrofitted into rooms should it be required to do so. If it is being used in a retrofit system, then a separate grille (GR ISW-6) is available to purchase.

  The closed-box cabinet is an aluminium extrusion with a glass-loaded composite, 350 x 350 x 87.5mm around a 6L volume, behind a 136 x 267 x 6.5mm baffle. Power handling is 250W with the CDA-4D amplifier into a nominal 8 ohms, and the two 3in x 7in racetrack paper drivers move plus or minus 8mm.
specs: |-
  - Type: in-wall subwoofer, passive
  - Drive units: 2x 76.2mm x 177.8mm (3in x 7in) 'racetrack' paper cone bass
  - Driver throw: +/- 8mm
  - Impedance: 8 ohms
  - Power handling: 250W (CDA-4D)
  - Frequency response: 30Hz to 200Hz
  - Cabinet description: closed-box subwoofer
  - Cabinet dimensions: Height 350mm (13.8in), Width 350mm (13.8in), Depth 87.5mm (3.5in)
  - Cabinet material: aluminium extrusion and glass-loaded composite
  - Cabinet volume: 6L
  - Baffle dimensions: Height 136mm (5.4in), Width 267mm (10.5in), Depth 6.5mm (0.3in)
  - Mounting: horizontal or vertical, fits a 2in x 4in stud wall
  - Accessories: GR ISW-6 retro-fit grille kit, retro-fit baffle 400 x 400 x 8.5mm
  - Passive in-wall subwoofer, with no built-in amplifier and no mains inlet of its own
  - Driven from the CDA-4D distribution amplifier, which is the unit connected to the mains supply
  - Impedance 8 ohms, power handling 250W (CDA-4D)
