description: ISW-6 is a discreet, compact and versatile custom installation
  subwoofer designed to work primarily with Bowers & Wilkins CI300 and CI600
  speakers. Bass is a vital element in the enjoyment of sound, and it is as true
  for custom installation as it is for an audiophile's two-channel hi-fi or a
  home cinema system.
details: |-
  ISW-6 is a discreet in-wall subwoofer intended to work primarily alongside Bowers & Wilkins CI300 and CI600 installation speakers. It uses two 76.2mm by 177.8mm (3in by 7in) 'racetrack' paper bass drivers with plus or minus 8mm of throw in a closed 6-litre cabinet of aluminium extrusion and glass-loaded composite.

  The two drivers are arranged in a force-cancelling configuration, which Bowers & Wilkins says dramatically reduces the subwoofer's potential to excite the wall around it. The stated result is a cleaner sound with minimal sound leakage into adjoining rooms, which is the difficulty a conventional in-wall bass cabinet creates.

  It is a passive subwoofer. Impedance is 8 ohms and power handling is quoted as 250W with the CDA-4D named alongside it, and the installation instructions end by wiring the subwoofer to a CDA-4D distribution amplifier that is configured from a web browser. There is no on-board amplifier, no mains inlet, no line-level input and no level, phase or crossover control on the subwoofer itself.

  The cabinet is 350mm (13.8in) square and only 87.5mm (3.5in) deep, so it fits inside a 2in by 4in stud wall, and it can be mounted either horizontally or vertically. The visible baffle is 136mm (5.4in) by 267mm (10.5in) by 6.5mm (0.3in), and frequency response is quoted as 30Hz to 200Hz.

  A discreet grille is supplied as standard. ISW-6 is designed primarily to be installed during construction, but is small and flexible enough to be retrofitted into a finished room, in which case the separate GR ISW-6 retro-fit grille kit is purchased, whose larger baffle measures 400mm (15.8in) square by 8.5mm (0.3in).
specs: |-
  - Type: in-wall subwoofer
  - Drive units: 2x 76.2mm (3in) x 177.8mm (7in) 'racetrack' paper bass drivers in a force-cancelling configuration
  - Driver throw: +/- 8mm
  - Impedance: 8 ohms
  - Power handling: 250W (CDA-4D)
  - Frequency response: 30Hz - 200Hz
  - Passive: no on-board amplifier, no mains inlet, no line-level input; driven from a CDA-4D distribution amplifier
  - Cabinet: closed-box subwoofer, 350mm (13.8in) height x 350mm (13.8in) width x 87.5mm (3.5in) depth
  - Cabinet material: aluminium extrusion and glass-loaded composite
  - Internal volume: 6L
  - Baffle dimensions: 136mm (5.4in) height x 267mm (10.5in) width x 6.5mm (0.3in) depth
  - Fits a 2in x 4in stud wall; can be mounted horizontally or vertically
  - Grille supplied as standard
  - Optional accessory: GR ISW-6 retro-fit grille kit, baffle 400mm (15.8in) x 400mm (15.8in) x 8.5mm (0.3in)
  - Finish: Black
  - Designed to work primarily with Bowers & Wilkins CI300 and CI600 speakers
