description: >-
  The Yamaha TX802 is a rack-mount FM tone generator based on the DX7 Mark II sound
  engine, offering 8-part multi-timbral operation and 16-voice polyphony. It provides
  six-operator FM synthesis in a compact rack format, making it a studio-friendly
  alternative to Yamaha's flagship FM keyboard synthesizers.
details: |-
  The TX802 represents Yamaha's effort to bring the popular DX7 Mark II sound engine into a compact rack format during the late 1980s. As a standalone tone module without an integrated keyboard, it prioritized space efficiency for studio setups while maintaining the core FM synthesis capabilities users appreciated in the keyboard version.

  The instrument's primary limitation was its interface design. The minimal control surface made sound editing and custom patch creation difficult without the help of external hardware or software editors. This design choice reflected the era's approach to rack modules, which often delegated programming to external controllers or sequencers.

  Despite its programming challenges, the TX802 filled an important niche in studios of the period. It provided access to Yamaha's extensive DX sound library in a format suitable for rack mounting, making it an economical solution for musicians wanting distinctive FM tones in a compact package.
specs: |-
  - 6-operator digital FM synthesis
  - 16-voice polyphony
  - 8-part multi-timbral
  - 128 preset patches, 64 user patches
  - Cartridge slot for external memory
  - MIDI control
  - LFO
  - Rack-mount format
