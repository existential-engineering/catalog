description: Marshall JTM45-style amp-in-a-box overdrive pedal with a three-band
  tone stack (Bass, Middle, Treble) and Drive and Volume controls for classic
  British crunch tones.
details: |-
  Every guitarist loves the sound and feel of a Marshall JTM45 amp head. And with the JHS Pedals Charlie Brown V4 amp-in-a-box, you can put that same thick, chewy, old-school rock tone onto your pedalboard. In fact, we even outfitted the pedal with a Marshall-style 3-band tone stack to achieve a tone that would please Clapton himself. Whether you're trying to replicate classic Clapton, the character of Hendrix's cranked walls of Marshalls, or Gary Moore's higher-gain sound, they're all waiting for you in the Charlie Brown V4.

  Version history: V1 = Larger enclosure; no Charlie icon. V2 = Changed to current enclosure size; diamond knob layout. V3 = Slightly different Drive Control and gain structure than V2. V4 = Color changed to yellow; added three-band tone stack; five controls total; U-shaped knob layout.
