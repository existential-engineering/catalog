description: A limited-edition reissue of a semi-hollow body electric guitar
  with a double cutaway, maple neck, ebony fingerboard, and Mustache Gold Foil
  mini-humbucker pickups in a cherry finish.
details: |-
  The H72 Reissue brings a collectible into the present by inviting more players into the Harmony story with the thoughtful recreation of one of our most iconic musical instruments. The original H72, introduced in 1966, has become an instrument highly sought-after by collectors due to both its importance to guitar history and its enduring design. Today, players have an opportunity to join the Harmony tradition and add their unique signature to this instrument's story. The semi-hollow body construction and double cutaway instantly recalls classic melodies and inspires brand new riffs. The iconic six-in-line headstock graces a maple neck with an ebony fingerboard. The playability is comfortable as is the familiar feeling of a classic 24 ¾" scale length. Details like the diamond-shaped switch plate and use of the original cherry finish instantly connect the H72 Reissue with its guitar lineage. The reimagined Mustache Gold Foil pickups deliver legendary lo-fi tone with modern clarity.
specs: |-
  - Top, Back and Side: Maple Laminate
  - Body Color: Cherry
