name: ABC
manufacturer: bastl-instruments
primaryCategory: mixer
categories:
  - utility
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/abc
description: Simple six-channel signal mixer designed for audio signals that can
  be modified to mix control voltage (CV) signals instead. Features flexible
  routing with normalization options — three solder jumpers enable normalization
  of A→D, B→E, and C→F pairings, and the A+B+C output mix feeds into D+E+F when
  that output is unused. Suitable for mono, stereo, or CV mixing applications.
details: |-
  AC-coupled inputs convertible to DC coupling via solder jumpers for CV mixing. Three jumpers enable normalization of A→D, B→E, C→F pairings. When the D+E+F output is unused, the A+B+C mix cascades into it. DIY kit was available but is now discontinued. Power connector is 10-pin with PTC fuse and diode protection.
