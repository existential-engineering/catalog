description: CORE® combines all-tube Class A preamp, ELOP® compression before
  gain stage, Baxandall EQ, and FET limiter. MANLEY IRON® input transformers.
details: |-
  The Manley CORE Reference Channel Strip integrates microphone preamp, 3-band EQ, and dual-stage limiting in a streamlined 2U format. Hand-built in California, it combines a custom hand-wound Manley IRON® input transformer, all-tube Class A gain stages, and Manley's acclaimed ELOP electro-optical compression with FET brick-wall limiting.

  The preamp section is an all-tube Class A design featuring a custom hand-wound MANLEY IRON® input transformer and offers up to 60 dB of gain with switchable gain settings. A high-pass filter starting at 120 Hz (6 dB/octave slope) helps shape the input signal.

  The compressor section uses ELOP® electro-optical technology with a fixed 3:1 ratio and a maximum of 16 dB of gain reduction for a smooth, transparent response. The three-band EQ section follows a Baxandall-style design with high and low shelving bands and a sweepable mid-range band, offering up to 10 dB of gain. A FET brick-wall limiter prevents signal peaks from exceeding safe levels.
specs: |-
  - All-tube Class A preamp with custom hand-wound MANLEY IRON® input transformer
  - ELOP® electro-optical compressor (fixed 3:1 ratio, up to 16 dB gain reduction)
  - Three-band Baxandall-style EQ with sweepable mid-range
  - FET brick-wall limiter
  - High-pass filter: 120 Hz, 6 dB/octave
  - Tubes: 2 × 12AX7, 1 × 6922
  - Microphone Preamp Gain: 40 or 60 dB
  - Line Input Gain: 20 or 40 dB
  - Frequency Response: 20 Hz – 20 kHz ± 0.5 dB
  - THD & Noise: < 0.1%
  - Signal-to-Noise Ratio: > 85 dB
  - Dynamic Range: > 90 dB
  - Maximum Output: +29 dBu
  - Compressor Attack Time: 60 ms (slowest) to 5 ms (fastest)
  - Compressor Release Time: 1.5 s (slowest) to 100 ms (fastest)
  - Dimensions: 19" × 3.5" × 7" (2U rack space)
  - Unit Weight: 8.3 lbs
  - Shipping Weight: 11.5 lbs
  - Power Consumption: 35 watts
  - Operating Voltage: 90 to 254 VAC, 50–60 Hz
  - Hand-built in California
