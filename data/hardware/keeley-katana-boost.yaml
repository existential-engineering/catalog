description: Clean boost built on cascading FET stages, with a pure clean mode
  and a higher gain mode selected by pulling the level knob. An internal charge
  pump raises the operating voltage for extra headroom.
details: |-
  The Katana Boost is a redesigned clean boost intended to give a mirror image of the player's tone, only louder. It is also a fat, harmonically rich boost when the volume knob is pulled out. It can be left on permanently to push an amp harder, or used occasionally to cut through a mix.

  Two modes are selected by the pull switch on the knob. Pushed in, the control behaves as a volume control with a lot of extra range. Pulled out, the pedal becomes a cutting boost with a little gain, described as not quite an overdrive but closer to overdriven tube grit and edge.

  The design uses dual cascading FET stages for a tube-like tone in a transistor circuit. An internal charge pump nearly doubles the operating voltage from the 9V DC supply, which is what gives the pedal its high-headroom clean boost. The maximum input voltage is 9V DC, and feeding it 18V is cautioned against.

  The Katana circuit is Robert Keeley's first guitar effect design for Keeley Electronics. It was originally designed for Legendary Tones as the Time Machine Boost, then became an independent product under the Keeley name after the Compressor was released.
