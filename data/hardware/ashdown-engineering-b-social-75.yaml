description: 'B-Social delivers signature Ashdown bass tone from a 75W stereo
  amplifier driving two custom dual-concentric 5" drivers for punchy low-end in
  a compact enclosure. An App-Tek socket lets players use amp-sim and effects
  apps on smartphones, including Ashdown''s ABM Pre app. It features wireless
  audio connectivity with a bass transmitter for cable-free playing plus
  Bluetooth streaming from any compatible music player. A second input lets a
  bassist play alongside another player, electric or acoustic. Recording is
  handled by a built-in USB audio interface compatible with major DAWs on PC and
  Mac, and a speaker-mute switch enables headphone monitoring. Rounding out the
  connections are a Line In, Line Out and Headphone Out. Available in three
  high-gloss wood finishes: Natural, Black and White.'
details: |-
  Straight out of the box, B-Social delivers signature Ashdown bass tone via a powerful 75W stereo amplifier and two custom dual concentric 5" drivers, specifically designed to deliver punchy low-end in the most compact enclosure. Unlocking further tonal possibilities, the App-Tek socket allows players to access the ever-growing range of amp sim and effects apps available on smartphones and devices, including Ashdown's very own ABM Pre App. B-Social features wireless audio connectivity and a transmitter that lets the bass connect wirelessly to the amp for cable free jamming. Wireless Bluetooth audio connectivity also enables audio streaming from any compatible music player. Adding a new social dimension to the amp, the B-Social includes a second input so the bassist can play along with another bass player or guitarist - electric or acoustic. Recording is made simple via the built-in USB audio interface, compatible with all major DAWs on both PC and Mac platforms. The unit features a speaker mute switch for headphone monitoring. Rounding out the feature set is a Line In, Line Out and a Headphone Out for silent practice. B-Social is available in three high gloss wood finishes - Natural, Black and White.
specs: |-
  - 75W stereo bass amplifier combo
  - Two custom dual-concentric 5" drivers
  - App-Tek socket for smartphone amp-sim/effects apps
  - Wireless audio connectivity with bass transmitter
  - Bluetooth audio streaming
  - Second input for a second player (electric or acoustic)
  - Built-in USB audio interface (PC and Mac, major DAWs)
  - Speaker-mute switch for headphone monitoring
  - Line In, Line Out and Headphone Out
  - Three high-gloss wood finishes: Natural, Black, White
