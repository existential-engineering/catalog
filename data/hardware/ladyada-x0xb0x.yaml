description: >-
  The x0xb0x (pronounced "zox-box") is a DIY kit-based analog synthesizer clone
  of the Roland TB-303, created by Ladyada (Limor Fried) through meticulous
  reverse-engineering of the original. It sounds very nearly identical to the
  TB-303 while adding modern connectivity including MIDI, USB, and DIN sync.
  Originally sold as a kit requiring intermediate-to-advanced soldering skills,
  pre-built versions were later offered by third-party manufacturers like Mode
  Machines.
details: |-
  Created by Limor "Ladyada" Fried and released in 2006, the x0xb0x was born from a meticulous reverse-engineering of the original Roland TB-303. The goal was to produce a clone whose sound was virtually identical to the original, and by replicating the circuit board-by-board, the project largely succeeded. Third-party companies like Mode Machines later offered pre-assembled versions for those without soldering skills.

  The front panel faithfully mimicked the TB-303 layout while adding modern connectivity. The monophonic analog signal path featured a single VCO producing sawtooth and square waveforms through an 18 dB/octave analog low-pass filter, with control pots for decay time and accent intensity. The built-in sequencer arranged notes into patterns and patterns into tracks, with synchronization via MIDI, DIN sync, and CV/gate.

  A USB jack was a notable modernization, enabling firmware updates, external computer control, and integration with third-party software. The open-source nature of the project encouraged a thriving community of modders and custom panel designers, making each x0xb0x potentially unique.

  Building the kit was classified as a fairly advanced electronics project, requiring competent soldering skills and some troubleshooting ability. Despite the challenge, the x0xb0x became one of the most popular and respected 303 clones, offering the coveted acid bass sound at a fraction of the price of an original TB-303.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1 part
  - Oscillators: 1 VCO
  - Waveforms: Sawtooth, square
  - Filter: 18 dB/oct analog low-pass
  - Envelope: Decay time and accent intensity controls
  - Effects: None
  - Sequencer: 1-track, 64 user pattern banks, 128 user track banks
  - Keyboard: None
  - Memory: No sound patch memory
  - Control: MIDI In/Out, DIN sync, CV, gate, USB
