description: Alnico Speaker System. The GS103A-VB is a bookshelf-type speaker system manufactured in Japan that incorporates a premium-grade alnico magnet full range driver, with a design that retains a nostalgic and calming appearance.
details: |-
  GS103A-VB is a speaker system equipped with a premium-grade alnico magnet full range driver. It is a bookshelf-type speaker system manufactured in Japan that incorporates a premium full range unit with a design that retains a nostalgic and calming appearance, allowing you to relax and enjoy music.

  Heritage design that creates a retro feel. The traditionally designed bookshelf-shaped enclosure with a nostalgic grille, combined with the English walnut wood grain finish, creates a calming feel that blends easily into the interior.

  Built-in premium grade 10 cm full range unit. The full range unit, a symbol of Fostex, is constructed from carefully selected parts. By using Fostex's proprietary technology of two-layer cone paper, alnico magnets and copper caps, the unit combines dynamic low range, clear midrange that provides excellent voice expression, and moderately extended high range.

  Thorough acoustic tuning. The bass-reflex enclosure has been tuned to achieve optimal acoustic conditions with a focus on relaxed listening. The material and thickness of the board material was selected to disperse resonance while ensuring rigidity, and two types of sound absorbing material with different roles were placed to give a well-balanced sense of both volume and texture, including the tuning of the bass reflex port.
specs: |-
  - Enclosure type: bass reflex
  - Unit: 100 mm full range
  - Frequency response: 58 Hz to 20 kHz (-10 dB)
  - S.P.L.: 87 dB/W (1 m)
  - Impedance: 8 ohm
  - Maximum input: 5 W
  - Interior volume: 6.9 L
  - Tuning frequency: 74 Hz
  - Dimensions: 204 (W) x 288 (H) x 194.5 (D) mm (including grille)
  - Weight: approx. 3.0 kg each (including grille)
  - Materials: MDF (Medium Density Fiber Board)
  - Finishing: olefin decorative sheet
  - Accessories: 1 pair of grilles, 1 owner's manual
  - Passive design, no power connection
