details: |-
  The GS103A-VB is a Japanese-made bookshelf passive speaker system featuring a premium 100 mm full-range driver in a traditionally designed bass-reflex enclosure with a nostalgic grille. The cabinet is finished in an English walnut wood grain Olefin decorative sheet over MDF construction.

  The enclosure has an interior volume of 6.9 L and is tuned to 74 Hz, delivering a frequency range of 58 Hz to 20 kHz (-10 dB) with an SPL of 87 dB/W (1 m) and an 8 ohm impedance. Maximum input is rated at 5 W.

  Each unit measures 204 (W) x 288 (H) x 194.5 (D) mm (including grille) and weighs approximately 3.0 kg each. The package includes one pair of grilles and an owner's manual. The GS17H Super Tweeter System is offered as a related companion product.
