  - Dimensions: 204 (W) x 288 (H) x 194.5 (D) mm (including grille)
  - Weight: approx. 3.0 kg each (including grille)
  - Material: MDF (Medium Density Fiber Board) with Olefin Decorative Sheet finishing
  - Finish: English walnut wood grain
