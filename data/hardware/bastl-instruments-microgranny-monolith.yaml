details: |-
  The microGranny Monolith is a lo-fi granular sampling instrument and a redesigned edition of the original microGranny, featuring a black PCB case and improved tactile controls. It is monophonic and holds 6 playable samples with 60 preset slots across 10 banks.

  Samples are loaded via microSD card (mono WAV files, 22050 Hz, 8-bit or 16-bit, two-letter filenames) or recorded live at 8-bit/22050 Hz through the built-in microphone or line input. Granular controls include grain size and shift speed parameters.

  MIDI input supports note, CC, and clock sync. Arduino-based and open-source — hackable with custom firmware. Includes a pre-installed sample pack by Bogdan Raczynski. Available user manuals in English and Japanese.

  Dimensions: 141 × 76 × 45 mm. Powered by 9V battery or center-positive 9V DC supply.
