description: The Stingray® II delivers 40W from EL84 tubes with switchable
  triode/Ultra-Linear topology, RF remote control, and headphone output. Built
  in California.
details: |-
  The Manley Stingray II represents the evolution of the acclaimed Stingray integrated amplifier, incorporating enhanced power supply capacity, refined circuit topology, and expanded connectivity while preserving the musical character of the original design.

  Hand-built in California, this all-tube integrated amplifier employs a quartet of EL84 output tubes with switchable Triode and Ultra-Linear operation, delivering comprehensive system control with vacuum tube amplification throughout the signal path.
specs: |-
  - Power Output: 20W (Triode), 40W (Ultra-Linear)
  - Tubes: 4 x EL84, 1 x 12AT7EH, 1 x 12BH7EH
  - 5 line inputs (including tape loop)
  - 1/4" stereo headphone output (front panel, auto-mutes speakers and subwoofer)
  - 1/8" auxiliary input for portable/computer sources
  - Subwoofer output (post-volume, rear panel)
  - RF and IR remote control
  - Dimensions: 19" x 10" x 5" (2U)
