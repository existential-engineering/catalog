description: >-
  A phase distortion synthesizer from 1986 disguised as a home keyboard, sharing the same synthesis
  engine as the CZ-101 with a built-in speaker, drum machine, and full MIDI implementation.
details: |-
  The Casio CZ-230S is something of a wolf in sheep's clothing, packaging the same phase distortion
  synthesis technology found in the respected CZ-101 into a home keyboard form factor. Released in
  1986, it features a built-in speaker, 99 preset sounds, and a 49-note mini keyboard without
  velocity or aftertouch sensitivity, giving it an unassuming appearance that belies its genuine
  synthesizer capabilities.

  Beneath the consumer-friendly exterior, the CZ-230S offers eight-note polyphony with two DCOs per
  voice using Casio's Phase Distortion synthesis, four-part multitimbrality, and a programmable drum
  machine sourced from the Casio RZ-1. Both step and real-time sequencers are included, providing
  basic composition tools alongside the sound engine. While only four sounds can be edited by the
  user via MIDI connection, the synthesis architecture is identical to its more professional siblings.

  Full MIDI In/Out/Thru connectivity was a remarkable inclusion for a home keyboard of this era,
  making the CZ-230S a capable MIDI controller and sound source in a studio environment. This MIDI
  implementation was undoubtedly a first for instruments in the home keyboard category.

  Vince Clarke of Erasure notably used the CZ-230S on the album Wonderland.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 DCO (Phase Distortion synthesis)
  - Multitimbral: 4 parts
  - Keyboard: 49 mini keys (no velocity or aftertouch)
  - Memory: 100 presets (4 user-editable via MIDI)
  - Sequencer: Step and real-time
  - Drum Machine: Programmable (RZ-1 based)
  - Speaker: Built-in
  - Control: MIDI In/Out/Thru
releaseDate: "1986"
