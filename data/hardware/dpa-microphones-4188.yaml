details: |-
  The 4188 Earset Mic combines the sound of the 4088 directional capsule and a lightweight and flexible one-ear earset. It can be used when miking needs to be fast, easy, and where the person wearing the microphone won't feel the presence of it such as in conference, speech and active live performance applications. Now available with CORE+ & MicroLock.
specs: |-
  - Capsule: 4088 Directional Capsule
  - Polar pattern: Directional (cardioid)
  - Form factor: Single-ear earset or two-ear headset with flexible boom
  - Boom lengths: Medium (100 mm), Long (120 mm)
  - Available colors: Beige, Black, Brown
  - Termination options: MicroLock, 3-pin LEMO, Mini-Jack, TA4F Mini-XLR
  - Brand compatibility: Audio Technica, Wisycom, Wired XLR, Shure, Sony, Sennheiser, Lectrosonics
  - Technology: CORE+ amplifier
  - IP rating: IP58
  - Warranty: 2 years
