description: The F3 is a two-channel, two-track field recorder whose dual A/D converter circuits and 32-bit float recording mean input gain needs no setting at all. It records WAV at 44.1 to 192 kHz with BWF and iXML metadata, and works over USB-C as a 2-in/2-out audio interface.
details: |-
  The F3 is a two-channel, two-track field recorder built around 32-bit float recording and the dual A/D converter circuits from Zoom's larger F-series units. Because the two converters cover different parts of the range, input gain needs no setting at all, which is what lets the same take hold a quiet raindrop and a nearby explosion without clipping. It records WAV at 44.1 to 192 kHz in 32-bit float, mono or stereo, with BWF and iXML metadata.

  The unit measures 75 x 77.3 x 47.8 mm and weighs 242 g with batteries. The casing is metal, with side bars, a standard tripod mount and slide-resistant rubber feet, and it is light enough to strap to a boom. Two discrete inputs use locking XLR connectors, pin 2 hot, switchable between mic and line, with +24/48 V phantom power at a combined 10 mA or less across both channels and equivalent input noise of -127 dBu or less. A 96 x 64 backlit LCD shows input signals as a real-time waveform.

  Monitoring and output run on two separate 1/8-inch stereo mini jacks, a line out at up to +1 dBu for feeding a camera or other gear and a phone out rated 50 mW per side into 32 ohm with its own volume control. Recording goes to a single microSDHC or microSDXC card of up to 1 TB, which Zoom puts at over 180 hours of audio at the highest sample rate and bit depth.

  A USB Type-C port handles mass storage and 2-in/2-out audio interface operation at up to 96 kHz, in 32-bit float from firmware version 2.0 onward, with a loopback function that folds computer audio in with the F3's inputs for streaming. The port also takes bus power, so the unit runs from a USB battery pack or the AD-17 DC 5 V adapter as well as from two AA batteries, which give about eight hours on alkalines and about eighteen on lithium.

  A dedicated REMOTE connector takes the optional BTA-1 Bluetooth adapter, which enables remote recording from up to 30 feet away through the F3 Control app for iOS and Android, multi-recorder control through the Handy Control & Sync app, and wireless timecode sync with a Timecode Systems UltraSync Blue. The separately sold TCA-1 Timecode Adapter generates and outputs timecode or jams to an external clock, holding within 0.5 frames over 24 hours.
specs: |-
  - 2-channel / 2-track field audio recorder with 32-bit float recording and dual A/D converters
  - Inputs: 2 x MIC/LINE mono on locking XLR connectors (pin 2 hot)
  - Input gain adjustment unnecessary (dual A/D converter circuits)
  - Input impedance 3 kohm or more on both mic and line. Maximum input level +4 dBu mic, +24 dBu line
  - Phantom power +24/48 V, combined channel total of 10 mA or less
  - Equivalent input noise -127 dBu or less (IHF-A) at x1024 waveform magnification with 150 ohm input
  - LINE OUT: 1 stereo mini jack, maximum output level +1 dBu, output impedance 100 ohm or less
  - PHONE OUT: 1 stereo mini jack with dedicated volume control, 50 mW + 50 mW into 32 ohm, output impedance 15 ohm or less
  - Recording format: WAV at 44.1/48/88.2/96/192 kHz, 32-bit float, mono or stereo, BWF and iXML supported
  - Maximum simultaneous recording and playback tracks: 2
  - Recording media: microSDHC 4 to 32 GB, microSDXC 64 GB to 1 TB, over 180 hours at the highest sample rate and bit depth
  - Real-time waveform display of input signals on the LCD
  - Display: backlit LCD, 96 x 64
  - USB Type-C: USB 2.0 High Speed mass storage, and 2-in/2-out audio interface at 44.1/48/88.2/96 kHz, 24-bit linear or 32-bit float (32-bit float from firmware 2.0)
  - Loopback function mixes computer audio with the F3 inputs for streaming
  - REMOTE connector for the dedicated ZOOM BTA-1 wireless adapter
  - Wireless remote control up to 30 feet (10 m) via the F3 Control app for iOS and Android with the optional BTA-1
  - Wireless timecode synchronization with an optional BTA-1 and a Timecode Systems UltraSync Blue
  - Power: 2 AA batteries (alkaline, NiMH or lithium), ZOOM AD-17 DC 5 V/1 A adapter, or USB bus power
  - Battery life at 48 kHz/32-bit float 2 channels, no headphones, phantom off, backlight off: about 8 h alkaline, 8.5 h NiMH (1900 mAh), 18 h lithium
  - Battery life with headphones into 32 ohm and phantom at 48 V: about 2 h alkaline, 3 h NiMH, 7.5 h lithium
  - Power consumption 5 W maximum
  - Metal casing with durable side bars, standard tripod mount and slide-resistant rubber feet
  - Dimensions 75.0 mm (W) x 77.3 mm (D) x 47.8 mm (H), weight 242 g including batteries
