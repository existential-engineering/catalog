description: Official expander module for the Cylonix Cyclebox v2 complex VCO,
  unlocking a wealth of extra features on the already feature-packed main unit.
details: |-
  The Cyclebox Expander is the official expander module for the Cylonix Cyclebox v2 (sold by Intellijel as the Cylonix Cyclebox II). It is a fully passive 4HP panel that unlocks additional features on the main Cyclebox unit; refer to the Cyclebox v2 manual for full details on the extra controls it exposes.

  Being entirely passive, it draws no current from the Eurorack bus and simply extends the main module's front panel.
specs: |-
  - Width: 4HP
  - Max Depth: 29mm
  - Power: 0mA (passive)
  - Compatible with Cylonix Cyclebox v2 only
