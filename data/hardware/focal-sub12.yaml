details: |-
  Sub12 benefits from the best of Focal technologies to deliver unparalleled bass articulation and depth. Thanks to its 13" (33 cm) ultra-high-excursion "W" cone driver and its BASH amplifier with 600 W RMS and 1000 W peak-to-peak power, sound reproduction is more impactful and faithful than ever.

  Functionalities: Sub12 features a disengageable auto-sleep mode and variable user controls for low-pass, high-pass and phase, allowing ultimate precision for the perfect studio sound.

  Stop the noise: optimized bass bracing and a front port, in addition to internal and external flares, guarantee perfect noise and distortion reduction. This subwoofer is particularly suitable for use with Trio6, Solo6 and Twin6 monitor loudspeakers.

  Design: reinforced cabinetry and a robust design make Sub12 the result of high-quality engineering. Large handles on the sides make it easy to transport (with two people).

  Flexible and comprehensive: rear controls include switches for polarity, +4 dBu or -10 dBv sensitivity, automatic standby bypass, LFE input and output. Sub12 also features an input and output for a footswitch to engage bypass on a single Sub12 or simultaneously on several Sub12s.
specs: |-
  - Product type: monitoring subwoofer
  - Loudspeaker: 13" W membrane, ultra-high excursion
  - Frequency response (+/- 3dB): 28 Hz - 400 Hz
  - Maximum SPL (peak @ 1m): 125 dB
  - Amplifier: 600 W, class G (BASH), 1000 W peak-to-peak
  - Inputs: Left, Right, LFE; XLR symmetrical 10 kOhms
  - LEDs: power on, mute, hi-pass defeat
  - Indicators and controls: sub level (sensitivity) adjustment, low-pass frequency adjustment, phase adjustment, polarity switch, mute, 2.1 bypass (controlled by external footswitch), high-pass frequency selection, high-pass defeat
  - Sensitivity switch: +4 dBu or -10 dBV
  - Local supply: ~100-120 V T2.5AL/250 V; ~220-240 V T1.25AL/250 V
  - On/Off switch on the rear panel
  - Height: 60 cm / 23.6 in
  - Width: 48.7 cm / 19.2 in
  - Depth: 56.8 cm / 22.4 in
  - Weight: 58 kg / 127.8 lb
