id: TVTRnpoHrRZVY3xNeJ5et
name: Sub12
manufacturer: focal
primaryCategory: subwoofer
url: https://www.focal.com/products/sub12
description: Large-format professional subwoofer with a 13" W cone driver, 600
  W class G amplifier, and inputs for stereo and dedicated LFE, designed to
  anchor 2.1 and 5.1 monitoring systems down to 28 Hz.
specs: |-
  - Professional studio subwoofer
  - Driver: 13" W membrane (33 cm)
  - Frequency response (±3 dB): 28 Hz – 400 Hz
  - Maximum SPL (peak @ 1 m): 125 dB
  - Amplifier: 600 W class G (BASH); 1000 W peak-to-peak
  - Inputs: Left, Right, LFE — XLR symmetrical 10 kΩ
  - Controls: Sub level, Lo-pass frequency, Phase, Polarity switch, Mute, 2.1 bypass (footswitch), Hi-pass frequency selection
  - Rear-panel switches: polarity, +4 dBu / −10 dBv sensitivity, automatic standby bypass
  - Footswitch input/output for 2.1 bypass
  - Local supply: 100–120 V or 220–240 V
  - Dimensions (H × W × D): 60 × 48.7 × 56.8 cm (23.6 × 19.2 × 22.4 in)
  - Weight: 58 kg (127.8 lb)
