details: |-
  Turn an iOS device into a field recorder by plugging in a Zoom iQ6, a stereo X/Y microphone with a Lightning connector small enough to slip into a pocket. It captures the sound of concerts, interviews, meetings and lectures with precision and full fidelity, whether the job is a podcast on the fly, an impromptu concert or a sound effect for a video.

  The iQ6 features two high quality unidirectional condenser microphones in an X/Y configuration, the same ones used in the H4n Handy Recorder. X/Y stereo recording covers a wide area while still capturing sound sources in the centre with clarity and definition, and the mic angle changes from 90 degrees for a tightly focused image to 120 degrees for immersive wide-angle stereo (US Patent 8184815).

  A large analog-type MIC GAIN wheel and three-segment level LEDs keep levels right in every environment, from quiet meetings to loud concerts, with no signal overload. The dedicated headphone jack, which doubles as a line output, enables direct monitoring during both recording and playback.

  The iQ6 comes with an extended Lightning connector and a removable spacer that allow it to be used with most iPhone, iPad and iPod cases, so the case can stay on.

  Zoom's Handy Recorder app, free from the App Store, provides onscreen level metering, control of the iQ6 headphone volume and an automatic recording function for meetings, speeches and other situations where nothing should be missed. Recordings save in linear PCM for the highest quality or AAC to conserve storage space, and compression, EQ and reverb effects can then be applied in the app. The iQ6 also works with Voice Memos and GarageBand and with most apps that support input from an external microphone, including voice recognition apps, streaming apps and music apps.
specs: |-
  - Microphone: unidirectional X/Y stereo condenser, switchable 90 degrees / 120 degrees
  - Output connector: stereo mini 1/8-inch jack (combined headphone and line level output)
  - Audio quality: 48 kHz/16-bit
  - Input gain: +11 to +51 dB
  - Maximum input sound pressure: 130 dB SPL
  - Connector: Lightning connector, with extended reach and a removable spacer for cased devices
  - Power: powered by the connected iOS device
  - Three-position LED clip meter and analog-type MIC GAIN wheel
  - Supported OS: iOS 6 to 18, iPadOS 13 to 26 (the product page states iOS 6 to 26)
  - Compatible devices: iPhone 5 through 14 Pro Max, iPod touch 5th to 7th generation, iPad 4th to 9th generation, Air, Air 2, Air 3, mini to mini 5, Pro and Pro 2
  - Not compatible with video or voice call apps
  - Optional accessory: universal hairy windscreen (WSU-1)
  - Dimensions: 61.1 mm (W) x 30.6 mm (D) x 53.1 mm (H)
  - Weight: 30.5 g
