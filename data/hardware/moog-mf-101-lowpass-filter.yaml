description: >-
  The MF-101 is a Moogerfooger series analog voltage-controlled lowpass filter and
  envelope follower designed by Bob Moog. It features the classic Minimoog VCF circuit in
  a compact stomp-box format with switchable 2-pole and 4-pole filtering, a Drive knob for
  input signal overdrive, and an envelope follower for dynamic filter modulation. The unit
  also includes four expression pedal inputs and CV connections, making it a versatile
  semi-modular addition to any analog setup.
details: |-
  The MF-101 brings the legendary Minimoog filter to a pedalboard-friendly format. Its 24dB/oct lowpass filter can be switched between 2-pole and 4-pole configurations, providing a range of tonal shaping from subtle warmth to dramatic resonant sweeps. The built-in envelope follower responds to the dynamics of the input signal, with switchable fast and smooth attack modes that enable everything from percussive filter effects to slow, sweeping modulations.

  Designed for use with mono sound sources including synthesizers, samplers, recordings, and microphones, the MF-101 integrates easily into a wide variety of production and performance setups. Four expression pedal inputs allow real-time remote control of the filter cutoff, resonance, envelope amount, and mix parameters. External CV connections extend its functionality further, making it a natural companion to modular and semi-modular analog synthesizer systems.

  The MF-101 features a Minimoog-inspired aesthetic with wood side panels, a black faceplate, and bold white printing. Notable users include Fatboy Slim and The Crystal Method.
specs: |-
  - Mono input/output
  - 24dB/oct lowpass filter
  - Switchable 2-pole and 4-pole filter modes
  - Envelope follower with fast/smooth attack modes
  - Drive knob for input signal overdrive
  - Controls for cutoff, resonance, envelope amount, and mix
  - 4 expression pedal inputs
  - External CV connections
  - Minimoog-inspired design with wood panels
