name: CDi 4|600
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-4-600
description: A 4-channel professional power amplifier with analog inputs,
  delivering 600W per output channel. Part of Crown's CDi DriveCore series,
  engineered for medium-sized installations such as cinemas, houses of worship,
  bars, and lounges.
details: |-
  The CDi 4|600 is a professional 4-channel power amplifier representing an evolution in amplification technology, derived from Crown's flagship DriveCore Install series. It is designed for medium-sized installations including cinema, houses of worship, bars, lounges, and similar venues.

  The amplifier offers streamlined functionality with network control and monitoring, high-level onboard DSP, a front-panel interface, and support for driving up to 100Vrms speaker loads without requiring a transformer. The CDi DriveCore line is pre-loaded with JBL speaker tunings to streamline installation.

  DriveCore Technology reduces component count and variability, improving reliability. Onboard DSP includes input routing, delays, 8-band parametric EQ, crossover, and LevelMAX limiter. Network control and monitoring are available via HiQnet Audio Architect software.
specs: |-
  - 4 channels
  - 600W per channel @ 4Ω
  - Dual mode: 300W @ 2Ω, 600W @ 4Ω, 600W @ 8Ω, 300W @ 16Ω, 600W @ 70Vrms, 600W @ 100Vrms
  - Bridge mono: 600W @ 4Ω, 1200W @ 8Ω, 1200W @ 16Ω, 1200W @ 140Vrms, 1200W @ 200Vrms
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.25dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - Onboard DSP: 8-band parametric EQ, crossover, LevelMAX limiter
  - Network control via HiQnet Audio Architect
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - Dimensions: 19" W × 3.5" H × 12.25" D (excluding 1.3" front panel protrusion)
  - Weight: 16.3 lbs (7.39 kg)
  - Power: 15A IEC connector, 100–240V AC
  - BLU link: No
