description: The Galileo recreates the regal and soaring tones of a Rangemaster
  Treble-Booster into a cranked Vox AC30, designed to emulate Brian May's iconic
  signal chain. Often described as 'Queen in a box,' it places the treble
  booster character and AC30 amp response in a single compact pedal. Roll back
  your guitar's volume for clean tones, or open it up for the aggressive leads
  and rhythm tones that defined Brian May's sound.
details: |-
  The Galileo emulates Brian May's iconic signal chain: a Dallas Rangemaster Treble-Booster feeding a cranked Vox AC30 top-boost channel. Catalinbread combined both circuits into a single compact pedal so players can access the full 'Queen in a box' tone without running two separate units.

  Rolling back your guitar's volume control gives clean, sparkly tones. Opening it up delivers the bright, aggressive leads and full rhythm tones that defined May's playing on classic Queen recordings. The pedal responds dynamically to picking attack and volume control changes just like the original rig.

  Supports both 9V battery and DC power supply operation. Backed by Catalinbread's 3-year warranty.
