description: The Zeus Acoustic is a fusion of headless and semi-acoustic
  instruments, combining the weight relief and compact size of the former with
  the bright, resonant tone of the latter.
specs: |-
  - Scale length: 25.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder body with alder top, 30.5" long, 1.62" thick, 12" wide
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: bolt-on with radiused neck heel, headless
  - Fingerboard: ebony with 14" radius
  - Bridge: Hipshot fixed bridge
  - Pickups: Graphtech saddles with Kiesel electronics
  - Electronics: active electronics with master volume, bass and treble boost/cut controls; the active preamp runs on an internal battery rather than an external supply, so no power jack is present
  - Hardware: black with wood knobs
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir 1253E light bronze
  - Weight: 4.75 lbs
  - Gallery captions name ZA6 and ZAM6 multiscale configurations, with top woods including royal ebony, swamp ash and zebrawood
