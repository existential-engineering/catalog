details: |-
  Built on our decades of experience in designing DIs, the Align Active DI features some of the most pristine and transparent circuitry we’ve ever developed. Simple yet functional, phantom-powerable, with a small footprint and sound quality that rivals the most legendary DIs in the industry, the Align DI serves as the ideal output-stage to our whole line of acoustic effects pedals.
specs: |-
  - Balanced XLR output and 1/4" output
  - Pad boosts or cuts the XLR output to meet the needs of the PA
  - Ground lift switch to eliminate ground-loop noise
  - Thru/Out switch for added output versatility
  - Phase inversion for best sound and feedback control
  - Mute footswitch
  - Powered by 9V battery, 9V DC supply, or 48V phantom power
  - U.S. Patent D918,293
