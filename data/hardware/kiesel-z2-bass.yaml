description: The Z2 Bass improves upon its predecessor in updated aesthetics,
  functionality, and playability, with an offset body that accommodates a
  prominent arm contour for comfort. Modernized features include a slap ramp,
  standard Darkglass preamp, and Tritium pickups.
details: |-
  The Z2 Bass improves upon its predecessor in updated aesthetics, functionality, and playability.

  The body is offset to accommodate a prominent arm contour for comfort and a renewed appearance. Bevels are added to the lower horn and body shape, reminiscent of the wildly popular A2.

  The modernized features include a slap ramp, standard dark glass preamp, and tritium pickups.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Scale length: 34" standard, with multiscale options of 33.2" to 35"
  - Frets: 24 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with two high-strength carbon-fiber reinforcing rods and fully-adjustable dual action truss rod
  - Body: alder
  - Pickups: 3 stack Kiesel Tritium radius humbuckers
  - Electronics: 18V active/passive electronics, Darkglass preamp, master volume with push-pull active/passive switch, pickup blend, mid cut or boost with sweep control, stacked concentric bass/treble cut or boost
  - Slap ramp
  - Bridge options: Hipshot A-Style bridge at .748" (19mm) or .64" (16.25mm) spacing, or Hipshot multiscale headless bridge at .748" (19mm), .64" (16.25mm) or 16mm spacing
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Dimensions: 39" to 39.75" long, 1.625" to 1.825" thick, 12.375" to 12.725" wide depending on configuration
  - Weight: 7.85 to 8.75 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts, in headed or headless forms and in standard or multiscale layouts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
