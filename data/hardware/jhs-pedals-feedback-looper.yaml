description: The JHS Pedals Feedback Looper is an experimental effects loop
  utility pedal that routes signal through its send/return loop with a
  controllable feedback amount for creating infinite noise and texture effects.
details: |-
  Experimental noise making at its best. Literally has an unlimited amount of sounds because it sounds different depending on the pedals that run in its effects loop. Plug your guitar in the input and your amp into the output while running anything you want in the send and return.

  Has a volume knob to control the overall volume of the unit when it is on, as well as a feedback control for dialing in a perfect amount of texture and tone. The toggle switch allows this to be used as a straight up True Bypass loop or a feedback/noise unit.

  VERSION HISTORY
  V1 = blue texture enclosure. no logo.
  V2 = added true bypass toggle. added current logo.
  V3 = Slight changes in circuit.
