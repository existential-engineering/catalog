details: |-
  Spector NS Icon Bolt-On – Shaped by Tradition

  For nearly 50 years, Spector Bass has set the standard for exceptional craftsmanship, timeless design, and unmatched playability. The NS Icon Bolt-On continues this legacy, bringing the legendary NS design to a new generation of players. Designed by the Spector Custom Shop, the NS Icon Bolt-On features our fully curved body shape, premium appointments, and professional-grade hardware, delivering the unmistakable Spector experience. Every detail—from the neck profile and nut width to body contours and fingerboard radius—has been carefully specified by the same team that crafts our flagship Custom Shop instruments in Woodstock, NY. Classic Materials, Uncompromising Craftsmanship

  The NS Icon Bolt-On pairs a resonant, fully curved Alder body with a bolt-on 3-piece rock maple neck and rosewood fingerboard, – a combination of tonewoods used frequently in both our Custom Shop and renowned Euro Series.Aesthetically, players can choose from two solid gloss finishes (Black and White) or two timeless stain finishes (Black Cherry and Black Stain), both featuring highly figured Quilted Maple tops. Every model is adorned with our signature Crown inlays and gold hardware, including a fully intonating locking bridge, high-precision tuners, polished brass nut, and signature Spector control knobs. The NS Icon Bolt-On is available in both 4-string and 5-string models. The Signature Spector Sound, Enhanced

  Each NS Icon Bolt-On is equipped with custom-voiced Aguilar DCB pickups and an Aguilar OBP-2 preamp, delivering deep, punchy lows and crystal-clear highs. Working closely with the Aguilar team, we've ensured these electronics provide the trademark Spector sound with added versatility for today's player. 4-string models feature a Reverse P and J pickup combination, while the 5-string model features dual Soapbar pickups. With its refined, fully curved body, premium electronics, and time-honored craftsmanship, the NS Icon Bolt-On continues Spector's tradition of crafting basses that inspire. Whether on stage or in the studio, this instrument embodies the bold spirit, powerful tone, and performance-driven design that have defined Spector Basses since 1976.
