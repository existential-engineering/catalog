description: The C7ES-3 XD2 is a medium-sized stand-mount loudspeaker offering
  clarity, rich tonal balance and precise imaging, with Harbeth's RADIAL4 driver
  technology for natural sound reproduction across a broad frequency range.
details: |-
  The C7ES-3 XD2 offers remarkable clarity, rich tonal balance and precise imaging, bringing music to life. Equipped with Harbeth's newly advanced RADIAL4 driver technology, it aims at natural and accurate sound reproduction across a broad frequency range, and the handcrafted cabinet enhances the acoustics as well as the look of the room.

  Suited to audiophiles and home audio setups, the C7ES-3 delivers an immersive listening experience with Harbeth's signature sound quality, acclaimed for its accurate three-dimensional sound.

  At the core of the C7ES-3 XD2 is the RADIAL4 cone, a distinctive innovation that ensures exceptional detail. Pioneering work in loudspeaker diaphragm material science set the benchmark for the acclaimed RADIAL4 cone, a revolution in clarity and detail from a drive unit, here paired with a 25mm ferrofluid-cooled tweeter.

  Each speaker in the XD2 series incorporates a newly refined crossover design. The result is a speaker that excels in tonal accuracy and is more open and clear, immersing listeners in a more lifelike musical experience.

  The cabinets are handmade from carefully selected high-quality veneers, which vary in colour, shade and grain structure, and not all finishes are available in every country. The C7ES-3 XD2 is designed and handmade in the UK.
specs: |-
  - Description: stand-mount loudspeaker
  - Drive unit: 200mm Harbeth-made RADIAL4 drive unit
  - Tweeter: 25mm ferrofluid-cooled
  - Frequency range: 45Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W per channel
  - Power handling: 150W programme
  - Connectors: 4mm Harbeth-branded binding posts
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with tweeters (tweeter 440mm up from cabinet base)
  - Dimensions: 520mm high, 272mm wide, 305mm deep (plus 12mm for grille and binding posts)
  - Packing: single speaker per protective carton
