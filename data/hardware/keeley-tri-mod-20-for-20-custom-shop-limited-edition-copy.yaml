description: Custom Shop 20 for 20 colourway of the Tri-Mod modulation pedal,
  with chorus, flanger and phaser modes.
details: |-
  The Tri-Mod is a modulation pedal with three selectable modes: chorus, ranging from subtle to a heavily detuned swirl, flanger, from slow sweeps to fast ones, and phaser, from a gentle sonic spin to a thick swirl.

  This is the 20 for 20 Custom Shop edition of the pedal, drawn from the Keeley X-Series version. The 20 for 20 series was a line of twenty Custom Shop finishes, each carrying the 20 for 20 insignia and each limited to twenty units, with no further runs planned once a colourway sold out.

  This colourway is a matte yellow finish with a light sparkle and matte orange knobs.
specs: |-
  - Three modulation modes: chorus, flanger, phaser
  - 20 for 20 Custom Shop finish, matte yellow with matte orange knobs
  - Limited to 20 units of this colourway
  - Derived from the Keeley X-Series Tri-Mod
