description: Mixing control surface for filmmakers.
details: |-
  F-Control is a mixing control surface that gives filmmakers more control and flexibility when recording in the field. It works alongside the Zoom F8 and F4 to create a complete and professional on-location audio rig.

  F-Control works intuitively with the F8n and F6 to give you additional mastery over sound design and mixing, as well as broaden your creative possibilities. It connects to your F8 or F6 with a single USB cable, so you can keep your setup clutter-free and be ready to record in seconds.

  F-Control makes recording and mixing easy with nine 60 mm faders (eight plus Master) and hands-on input/output control for trim, pan, track arming, and PFL. Monitoring channel and output levels is simple with 12-segment LED meters, three user-programmable buttons, and a dedicated time code button. Recordings can be organized using the Track Scene edit buttons for metadata entry, and an external USB keyboard can be connected to enter information for Track Name, Scene Increment, Scene Name, Notes, and False Take.

  Connect your F8 or F4 to F-Control via one of two USB ports. The Keyboard USB port lets you connect an external keyboard so you can quickly enter metadata when you are out in the field. A 1/4 inch stereo cable connects the F8 or F4 headphone out to F-Control's headphone in, so you can monitor audio via F-Control's headphone jack.

  F-Control has two main power options: four AA batteries (for up to 9 hours of operation) or power it with a 4-pin HIROSE connector with an external battery pack. An additional USB bus power option is available when using the F4 (not available with the F8). Its metal chassis makes F-Control suitable for all production locations, and it is small and light enough to fit into a gear bag or backpack.
specs: |-
  - Nine 60 mm faders (eight channels plus Master)
  - 12-segment LED meters for channel and output levels
  - Hands-on input/output control for trim, pan, track arming and PFL
  - Three user-programmable buttons and a dedicated time code button
  - Track Scene edit buttons for metadata entry (Track Name, Scene Increment, Scene Name, Notes, False Take)
  - Two USB ports: one for the F-series recorder, one for an external USB keyboard
  - Headphone in and headphone out on 1/4 inch stereo jacks
  - Power: four AA batteries (up to 9 hours), external battery pack via 4-pin HIROSE connector, or USB bus power when used with the F4 (not available with the F8)
  - Metal chassis
  - Compatible with the Zoom F8n, F6, F8 and F4 multitrack field recorders
  - Supplied with a 1.5 m stereo cable and a 1.5 m USB cable
