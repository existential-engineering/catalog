description: Mode EQ headphones with microphone and remote for your cell phone.
  Experience excellent audio and tangle-resistant cord. Embrace the Marshall
  legacy in style.
details: |-
  Mode EQ's unique design anchors to your ear and the four ear tip sizes allow you to find the right fit for you. Custom-tuned dynamic drivers produce rich, powerful audio. The equaliser switch allows you to shift between sound settings according to your preference. Mode EQ also comes equipped with a built-in microphone and remote.

  The equaliser switch sits on the in-line remote and toggles between two voicings. The first setting is warm and bass-heavy, while EQ II is brighter with an emphasis on the mids and highs.

  The in-line microphone and remote are placed on the 3.5 mm cable, so the headphones can be used for calls as well as listening. Effortless controls, a tangle-resistant cord and a durable connection round out the wired design.

  Designed and engineered in Sweden. Made in China.
