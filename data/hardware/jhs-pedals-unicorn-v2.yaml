description: An all-analog photocell-based Uni-Vibe pedal with tap tempo,
  expression pedal control, and a toggle between Uni-Vibe and vibrato modes.
details: |-
  In 2015 JHS brought out the Unicorn V1, the world's first bulb-driven photocell modulator with tap tempo. As of Spring 2018, the Unicorn V2 continues the legacy in a smaller enclosure.

  Pink Floyd's 'Breathe,' Jimi Hendrix's Woodstock performance of 'The Star-Spangled Banner,' and Robin Trower's 'Bridge of Sighs' cemented the photocell-based vibe effect as an electric guitar standard. The JHS Pedals Unicorn delivers fully analog, photocell-based vibe sounds — not a digital emulation — with tap tempo, ratio subdivisions, and external expression control.

  The Unicorn features four knobs (Volume, Intensity, Speed, Ratio) and a mini Dry/Wet toggle. The Speed knob or onboard tap-tempo footswitch controls the rate, while the Ratio knob selects rhythmic subdivisions (quarter note, dotted eighth, triplet). An internal mini switch determines whether the side-mounted TRS jack acts as a Tap input or Expression pedal control for real-time rate manipulation.
