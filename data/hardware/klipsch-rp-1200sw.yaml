url: https://www.klipsch.com/products/rp-1200sw-subwoofer
description: The Klipsch RP-1200SW is a 12" front-firing subwoofer from the
  Reference Premiere series, featuring a Cerametallic ultra-long-throw woofer
  and a 400W RMS Class D amplifier with analog preamp stage. Its proprietary
  Aerofoil front slot port minimizes port noise for clean, deep bass extension
  down to 16.5Hz.
details: |-
  The RP-1200SW strikes the optimal balance between amplifier power, driver capability, and cabinet volume, achieving maximum low frequency extension with great output, accuracy, and speed.

  The newly designed Cerametallic woofer is exceptionally light and extremely rigid, providing remarkable low frequency response with minimal cone breakup and distortion for higher, cleaner output using less amplifier power.

  The built-in high efficiency amplifier features an analog preamp design, which maintains the original signal path for cleaner, true-to-source reproduction. The Class D output stage ensures maximum efficiency for maximum output, detail, and low frequency power.

  Proprietary internal geometry with a new Aerofoil slot port design minimizes port noise for clean undistorted low frequencies. The front-firing design allows for placement flexibility.

  Low Pass Crossover and Variable Phase control allows you to tune the subwoofer to your speakers and room. Both the RCA and wireless inputs can be utilized simultaneously, giving you the ability to use a single subwoofer with multiple systems in the same room.

  Backed by a 5-year limited warranty.
