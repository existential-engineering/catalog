url: https://bricasti.com/en/consumer/m1.php
description: The Bricasti M1 is a dual mono digital-to-analog converter
  featuring two completely isolated channels, each with its own dedicated linear
  power supply, D/A converter, DDS clocking, and analog circuitry, supporting
  DSD64/128/256 and PCM up to 352.8kHz.
specs: |-
  - Digital inputs: XLR AES/EBU, BNC S/PDIF, RCA S/PDIF, Toslink, USB 2.0
  - USB sample rates: PCM up to 352.8kHz; DSD64, DSD128, DSD256
  - Fully differential analog output design
  - Balanced XLR analog outputs
  - Unbalanced RCA analog outputs
  - Dual independent linear power supplies
  - Proprietary filter technology (no SRC)
  - Stillpoints isolation feet
  - Handcrafted in the USA
