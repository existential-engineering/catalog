details: |-
  The DN7103 pairs a single-input, three-output user-configurable digital delay line with parametric equalisation and per-output peak limiting, for broadcast, recording, installation and live sound work where delay and EQ need to sit in one processor. Total delay memory is 1.4 seconds.

  One input drives three outputs, each with its own programmable delay time. Each output also carries a peak limiter to protect downstream amplification, and per-output analogue attenuators set the gain trim into the destination. MIDI capability allows programme recall and parameter automation from sequencer- or controller-driven workflows.

  Typical applications are broadcast and recording delay with integrated room or system EQ, installation delay-tower zones that need EQ tailored per zone, and live sound where front-of-house delay and corrective EQ for each zone are best managed in a single chassis with MIDI recall.
specs: |-
  - 1 input, 3 outputs, 1.4 s total delay memory
  - Programmable delay time per output
  - Parametric EQ section
  - Peak limiter per output
  - Analogue output attenuators
  - MIDI programme recall and parameter automation
  - Rackmount chassis
