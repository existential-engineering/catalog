description: >-
  A combo keyboard from Yamaha combining a 7-voice polyphonic synthesizer with
  FM organ, brass, and string sections in a sturdy 61-key instrument with
  layerable timbral zones.
details: |-
  The Yamaha SK20 belongs to the SK series of combo keyboards that pack synthesizer, organ, brass, and string sections into a single performance instrument. Released around 1980 as a follow-up to the SK-10, it features a 61-key fully polyphonic keyboard housed in a very sturdy casing that has held up well over the decades.

  The synthesizer section provides 7-voice polyphony with basic filter, pitch, envelope, and portamento controls, producing warm pads and strings reminiscent of early Bowie-era textures. The FM-based organ section includes a Leslie simulator, while the preset strings section draws favorable comparisons to the ARP Solina and Logan String Machine. All sections can be layered together for rich composite sounds.

  Controls include rocker switches for Leslie simulation, vibrato, attack, and sustain, along with CV/Gate input and output connections for integration with external analog gear. The SK20 offers three presets per section and effects including vibrato, tremolo, and ensemble processing. While it lacks user memory, the direct hands-on controls make it an immediate and musical performance instrument.
specs: |-
  - Polyphony: 7-voice polysynth + fully polyphonic organ and strings
  - Oscillators: 2 (polysynth section)
  - LFO: 1 (sine waveform)
  - Filter: 12dB resonant lowpass (non-self-oscillating)
  - Keyboard: 61 keys
  - Memory: 3 presets per section
  - Effects: Vibrato, Tremolo, Ensemble, Leslie simulator
  - Control: CV/Gate In/Out
