details: |-
  The DW Collector's Series ICON Series was created to pay homage to some of the greatest artists and groups of music.

  This snare drum features an 11-ply HVLT shell made from North American hard rock maple with a maple veneer that features laser-cut wood inlays of a select series.

  This limited 6.5x14 snare offers the highest quality of hardware that DW offers. This includes the famed MAG throw-off, three-position butt plate, True-Tone Snare Wires, True-Hoops, and DW Heads by Remo U.S.A.

  Includes a heavy-duty DW snare bag and certificate of authenticity signed by John Good.
specs: |-
  - 11-ply North American maple shell
