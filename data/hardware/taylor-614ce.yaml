description: The 614ce is a Grand Auditorium acoustic-electric from Taylor's 600
  Series, featuring a torrefied Sitka spruce top with Big Leaf maple back and
  sides, V-Class bracing, and ES2 electronics — producing bright, articulate
  tone with strong note definition.
details: |-
  The 614ce combines a torrefied Sitka spruce top with Big Leaf maple back and sides in a Grand Auditorium body with Venetian cutaway. The heat-treated spruce top contributes sweetness and depth reminiscent of aged tonewoods, while the maple delivers a bright, articulate character with strong note definition.

  Taylor's V-Class bracing generates more volume and sustain than traditional X-bracing while improving intonation across the entire neck. West African Crelicam Ebony appointments throughout — fretboard, bridge, binding, bridge pins — give the instrument a refined, uniform aesthetic. A Brown Sugar stain highlights the maple's natural figuring.

  Expression System 2 behind-the-saddle electronics provide natural amplified tone. The Hard Rock Maple neck with satin finish and 25-1/2" scale length contributes to comfortable playability. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Torrefied Sitka Spruce (solid, gloss, Brown Sugar stain)
  - Back/sides: Big Leaf Maple (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Hard Rock Maple (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Binding: West African Crelicam Ebony
  - Inlays: Grained Ivoroid Wings
  - Rosette: Paua/abalone
  - Scale length: 25-1/2"
  - Tuners: Taylor Nickel
  - Pickguard: Dark Stained Maple
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
