description: >-
  A dual-oscillator monophonic analog synthesizer from Roland's SH series, offering a richer sound
  than the single-oscillator SH-101 with a sub-oscillator, self-oscillating 24 dB lowpass filter,
  and CV/Gate connectivity.
details: |-
  The Roland SH-2, produced from 1978 to 1979, occupies an interesting position in Roland's analog synthesizer lineup. While it shares the same visual layout as the SH-09, its dual VCO architecture gives it a considerably fuller and more harmonically rich sound compared to its single-oscillator siblings. The addition of a sub-oscillator further thickens the low end, making it particularly effective for bass duties.

  The oscillator section offers pulse, square, sawtooth, sine, and noise waveforms, with the ability to detune the two VCOs against each other for classic analog chorus and thickening effects. This detuning capability is a significant advantage over the more popular SH-101, which lacks a second oscillator entirely. The self-oscillating 24 dB/octave lowpass filter can be modulated by the envelope generator, LFO, and keyboard tracking, and also accepts external audio input for processing outside sound sources.

  Modulation comes from an LFO offering sine, square, and sample-and-hold waveforms, supplemented by an auto-bend feature for pitch sweeps. The 37-key keyboard and CV/Gate connectivity made it a practical performance instrument that could integrate with other analog gear of the era, though like most synths of its generation, it lacks MIDI and any form of patch memory.

  The SH-2 earned admirers among notable artists including Duran Duran, OMD, Men Without Hats, Eurythmics, Eat Static, and Groove Corporation. Its relative scarcity compared to the SH-101 has driven prices higher on the secondhand market, despite offering comparable programmability in a less visually distinctive package.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs + 1 sub-oscillator
  - Waveforms: Pulse, square, sawtooth, sine, noise
  - Filter: Self-oscillating 24 dB/oct lowpass with envelope, LFO, and key tracking modulation
  - LFO: Sine, square, sample & hold; auto-bend
  - Keyboard: 37 keys
  - Memory: None
  - Control: CV/Gate
  - External audio input
