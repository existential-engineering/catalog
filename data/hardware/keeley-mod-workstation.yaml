description: 8 Modulation Effects 2 Overdrives Including the Oxblood Tap Tempo
  and Effect Insert
details: |-
  The Mod Workstation collects eight Keeley modulation effects alongside two of the maker's overdrives, the 1962/Katana and the Oxblood, in one stompbox-sized enclosure with tap tempo and an effect insert. Several of the modulation sounds were given an increased range so they track tap tempo well, and the pedal is intended to sit after drive and distortion effects in a chain.

  The eight modulation settings are a standard amplitude tremolo whose Tone control shapes the oscillator from triangle to square, a harmonic tremolo that splits the signal into bass and treble bands and modulates them with two out-of-phase LFOs, an oscillating envelope filter that becomes a random sample and hold filter past the midpoint of the Tone control, a four stage phaser with Tone adjusting feedback and richness, the Keeley ADT automatic double tracker with 0 to 60ms of delay and 0 to 60 cents of detune, an analog BBD style chorus that blends into pitch vibrato as the Tone control is turned counter-clockwise, a flanger with Tone adjusting feedback, and a Leslie style rotary speaker whose Tone control blends between drum and horn.

  The pedal measures 4.7 inches wide by 3.72 inches tall and runs from a standard 9V negative tip supply at under 100mA. The tap insert expects a normally open momentary tap tempo switch. Keeley suggested pairing it with the Delay Workstation for a compact two-pedal board.
specs: |-
  - Eight modulation effects: tremolo, harmonic tremolo, oscillating and random sample and hold filter, four stage phaser, ADT double tracker, analog chorus and vibrato, flanger, Leslie style rotary speaker
  - Two overdrives: 1962/Katana and Oxblood
  - Tap tempo input, expecting a normally open momentary switch
  - Effect insert
  - ADT delay time 0 to 60ms, detune 0 to 60 cents
  - Dimensions: 4.7 inches wide by 3.72 inches tall
  - Power: standard 9V negative tip supply, under 100mA
