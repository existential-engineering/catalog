description: Cellz is a dual unipolar control voltage generator where each of
  the 16 touch sensitive pads can be fed two 12-bit values (semi-tone quantized
  or free scale), ranging from 0V to 10V.
details: |-
  Cellz is a dual unipolar control voltage generator where each of the 16 touch sensitive pads can be fed two 12-bit values (semi-tone quantized or free scale), ranging from 0V to 10V. It's a funky module that can be used as a controller or a sequencer.
specs: |-
  - Width = 12hp
  - Depth = 30mm
  - 2.5mA power draw when running +12V rail
  - 27mA power draw when running +5V rail
  - 1.5mA power draw when running -12V
  - 0-10V voltage range output 1
  - 0-10V voltage range output 2
