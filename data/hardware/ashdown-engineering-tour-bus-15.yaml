description: The Tour Bus 15 is a compact bass practice combo with a 15-watt
  power amp and 8" speaker, offering a little more headroom than the Tour Bus
  10. It keeps things simple with volume and 2-band bass and treble EQ, plus a
  headphone socket for silent practice and a CD/MP3 input for playing along.
details: |-
  The Tour Bus 15 packs essential features into a compact box with a 15-watt power amp and 8" speaker, delivering a surprisingly compelling volume and a little more headroom than its smaller sibling, the Tour Bus 10. Controls are kept simple with a volume and 2-band bass and treble EQ. A headphone socket allows for silent practice and a CD/MP3 input lets you play along with your favourite tracks. It is finished in heavy-duty buffalo Tolex with a distinctive vintage red grille.
specs: |-
  - Power output: 15 Watts
  - Speaker: 1 x 8"
  - EQ: 2-band (Bass, Treble)
  - Controls: Volume, Bass, Treble
  - Headphone output for silent practice
  - CD/MP3 input
  - Covering: heavy-duty buffalo Tolex, vintage red grille
