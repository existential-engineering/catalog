details: |-
  Meet the new centerpiece of your studio or live rig. The Mackie Onyx24 is a premium 24-channel USB mixer for professional multitrack recording and live sound applications.

  The Onyx24 features 18 low-noise Onyx preamps that provide 60dB of gain, along with switchable hi-Z inputs for guitars, bass, and other instruments. A 3-band Perkins EQ with sweepable mid offers musical tone shaping across every channel.

  High-resolution multitrack recording to Mac/PC via USB at up to 24-Bit / 96 kHz delivers studio-grade capture, while seamless stereo recording directly to an SD card makes it easy to grab a board mix of any gig or session.

  Built-in customizable Dynamic FX, Bluetooth streaming, and the Studio Command interface round out a feature set designed for both the stage and the studio.
specs: |-
  - 24x4 analog mixer
  - 18 low-noise Onyx mic preamps with 60dB of gain
  - Switchable hi-Z inputs for guitars, bass, and other instruments
  - 3-band Perkins EQ with sweepable mid
  - 24-Bit / 96 kHz multitrack recording via USB
  - Stereo recording directly to SD card
  - Customizable Dynamic FX
  - Bluetooth streaming
  - Studio Command interface
  - 2 Aux sends + FX send
