details: |-
  Pedal Anchor: To keep left-side double pedals from walking, a special stabilizer is mounted to the outside frame. This augments the stability of the floor anchor bolts.

  Hardshell Carrying Case: The pedals come standard with a specially designed hard carrying case.

  Hinge Guard Block: We've changed the construction of the Bearing Hinge on the footplate from a one-piece assembly to two pieces, which holds the bearing more evenly—minimizing stress, and maximizing smoothness, while adding to the pedal's sense of power.

  Super Stabilizer Design: During our detailed study of previous pedal concepts, we observed that under the stress of aggressive performance, pedals actually sway from side to side, which undermines efficiency. By widening the frame, the pedal's overall structure is expanded. The supports that hold the revolving shaft are 15mm wider, and the under-plate is about 12mm wider than the previous Cobra.

  Swivel Spring Tight (US.PAT.NO.9236038): The conventional approach to the spring assembly (including previous Iron Cobra Pedals) has been to anchor the bottom of the spring while the top of the spring is being pulled from various angles throughout the pedal's cycle. But a spring being pulled on at an angle represents wasted energy and causes turbulence. The Swivel Spring Tight assembly solves this problem, recapturing that lost energy and optimizing smoothness through the use of a contoured assembly that allows the base to swivel freely with the spring. This enables a straight spring pull during the pedal's entire cycle, resulting in the smoothest, lightest action ever found on a bass drum pedal.

  Speedo-Ring: Tama eliminated another source of friction by replacing the traditional nylon rocker cam with the Speedo-Ring, a rocker cam with a high quality built-in ball bearing rocker. The Quick-Hook not only allows for easy set up and tear down but provides a compact pedal that you can place in the hard case without taking off the beater.
