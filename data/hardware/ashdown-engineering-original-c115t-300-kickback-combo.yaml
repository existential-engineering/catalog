description: A lightweight 300-watt bass combo inspired by the classic Flip Top
  design, with a custom 15" speaker and a weight of just 15kg. A comprehensive
  5-band EQ handles booming lows through crystalline highs, while a front-facing
  FX loop, XLR DI output, and built-in headphone out add modern convenience. Its
  kickback design works as a floor monitor or in standard vertical position.
  Rugged build, scuff-proof paint, and quality-control pots survive the road,
  backed by a 5-year warranty, auto-protect voltage, and an adaptive
  temperature-controlled fan.
details: |-
  Introduced 2021. 300W bass combo, custom 1x15" speaker, 15kg, Flip Top-inspired. Kickback (wedge) cabinet usable as a floor monitor. 5-band EQ. Front-facing FX loop, XLR DI output, headphone out. Scuff-proof paint, quality-control pots, 5-year warranty, auto-protect voltage, adaptive temperature-controlled fan.
specs: |-
  - Power output: 300 watts
  - Speaker: 1 x 15" (custom)
  - Weight: 15 kg
  - EQ: 5-band
  - Front-facing FX loop
  - XLR DI output
  - Headphone output
  - Kickback (wedge) cabinet
  - 5-year warranty; auto-protect voltage; temperature-controlled fan
