description: The SoCo 16 LC Deluxe is a semi-hollow electric guitar inspired by
  Austin's South Congress district, built to deliver versatile tones from warm
  punchy jazz to sparkling airy leads. It features a maple laminate body with
  center block, a Honduran mahogany neck, and premium Lollar Low Wind Imperial
  Humbuckers with 50s-style wiring. The Deluxe model is distinguished by grained
  ivoroid binding and appointments throughout.
details: |-
  The SoCo 16 LC Deluxe is a semi-hollow electric guitar with a 16" maple laminate body and maple center block. It is built on a Honduran mahogany neck joined via an extra-long mortise & tenon joint, with a rosewood fingerboard featuring mother-of-pearl long dot inlays, a 12" radius, and medium 18% nickel-silver frets. The 24.875" scale length and 1 11/16" nut width provide a comfortable, familiar feel. Electronics consist of Lollar Low Wind Imperial Humbuckers wired in 50s style, driven by CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware includes a Kluson ABR-1 bridge, Kluson stop tailpiece, and nickel Gotoh tuners with Collings logo buttons. The body, fingerboard, and peghead are all bound in grained ivoroid, and the ebony peghead veneer carries a mother-of-pearl Collings logo. The finish is high-gloss nitrocellulose lacquer. Comes with D'Addario NYXL1149 strings and a deluxe hardshell case.
specs: |-
  - Body: Semi-hollow, maple laminate with maple center block
  - Body Width: 16"
  - Body Length: 20.25"
  - Body Depth: 1.625"
  - Total Length: 42.625"
  - Neck: Honduran mahogany, extra-long mortise & tenon joint
  - Fingerboard: Rosewood
  - Inlays: Mother-of-pearl long dots
  - Fingerboard Radius: 12"
  - Frets: Medium, 18% nickel-silver
  - Scale Length: 24.875"
  - Nut Width: 1 11/16"
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Wiring: 50s-style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Custom grained ivoroid top hat
  - Pickup Rings: Grained ivoroid
  - Bridge: Kluson ABR-1, nickel-plated zinc with retaining wire
  - Tailpiece: Kluson stop tailpiece, nickel-plated zinc with steel studs
  - Tuners: Nickel Gotoh with Collings logo
  - Binding: Grained ivoroid (body, fingerboard, peghead)
  - Peghead Veneer: Ebony with mother-of-pearl Collings logo
  - Truss Rod Cover: Grained ivoroid
  - Finish: High-gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Case: Deluxe hardshell case included
