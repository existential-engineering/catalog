description: >-
  The Quasimidi Raven is a 24-voice digital performance synthesizer released in
  1996, designed for creating dance music both live and in the studio. It
  integrates a Rave-O-Lution 309 synth engine into a professional 61-key
  keyboard with an 8-track pattern sequencer, arpeggiator, real-time control
  knobs, and integrated effects processing. Notable users include BT and Jean
  Michel Jarre.
details: |-
  The Raven essentially packages the Rave-O-Lution 309 synthesis engine into a sleek professional keyboard format, combining the dance-oriented sound design capabilities of its predecessor with the playability and stage presence of a full-size instrument.

  The synthesis engine uses M.A.S.S. (Multi-Algorithm Sound Synthesis) with 6 MB of samples in memory, expandable to 14 MB via the optional RavenMAX card. The sound library covers a broad palette including basses, lead synths, pads, natural sounds, organs, FM percussion, effects, and drum sets, along with multitimbral performance patches.

  An 8-track pattern sequencer and full arpeggiator provide real-time composition and performance tools, while two effects units including reverb handle sound processing. The 61-key keyboard with velocity and aftertouch sensitivity offers expressive control, and 16-part MIDI multitimbral operation enables complex layered arrangements. Memory stores 512 patches and 100 performances. The Motivator feature allows real-time parameter tweaks that can be recorded directly into the sequencer, adding a layer of performative spontaneity.
specs: |-
  - Polyphony: 24 voices
  - Oscillators: 3 with M.A.S.S. (6 MB samples in memory)
  - LFO: 1
  - Filter: 1 filter section
  - Envelopes: ADSR
  - Effects: 2 units including reverb
  - Sequencer: 8-track pattern sequencer
  - Arpeggiator: Full arpeggiator
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 512 patches, 100 performances
  - Control: MIDI (16 parts)
  - Upgrade: RavenMAX card (expands sample memory from 6 MB to 14 MB)
releaseDate: "1996"
