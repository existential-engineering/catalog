description: The LEHLE SUNDAY DRIVER SW II is a compact high-end preamp for all
  types of electric and acoustic instruments. The switchable version expands on
  the classic LEHLE SUNDAY DRIVER II with a soft-touch foot switch, to activate
  and deactivate the pedal.
details: |-
  The LEHLE-Switch works with a microcontroller and an intelligent True-Bypass-Relay-Circuit with active pop suppression circuit, thereby allowing the LEHLE SUNDAY DRIVER SW II to switch even faster than mechanical switches, noise-free and without wear. The easy-action mushroom-shaped button characteristic of LEHLE products is mounted in the cover, so that your foot pressure is transmitted indirectly, via a spring. Thus the electronics board is not exposed to mechanical loads.

  When ON, its circuit is based on a discrete Class A circuit with JFET technology and provides two modes of operation, selected by a mode selector switch with gold-plated contacts. "D" stands for Driver: in this mode, your guitar signal is amplified, with absolutely no modification, at the input impedance of a guitar amp, efficiently eliminating losses on the route through leads and effects. The second setting "S", as in Sunday, multiplies the input impedance by five, bringing out previously inaudible details and, as gain increases, giving your guitar a characteristic and unmistakable warmth.

  Even at the maximum +18 dB gain setting, the LEHLE SUNDAY DRIVER SW II always stays clean and absolutely free of background noise, thanks to its studio-standard overall dynamic range of 130 dB. To exploit the dynamics of tube amplifiers to the full, the input voltage is also rectified from the power supply socket, then filtered, stabilized and transformed to 30 V.

  When OFF, the LEHLE SUNDAY DRIVER SW II provides two different modes of operation: in TB (True Bypass) mode, the input and output are linked via relay, with zero tonal loss. True-Bypass mode is the best option if you have a small setup with short cable routings and for when a treble booster or old-school fuzz pedal is placed after the pedal.

  If you have long cables or a complex effects board configuration, switch to TS (True Sound) mode, and the LEHLE SUNDAY DRIVER SW II is active as a buffer, without amplifying the signal in any way. In this mode it operates as a neutral line driver and works with 5 MOhm or 1 MOhm input impedance, depending on the selected S or D mode.
specs: |-
  - High-end preamp, buffer and booster
  - Discrete Class A input stage
  - 130 dB dynamic range thanks to 30 V technology
  - Choose between two sound modes
  - Neutral, studio quality sound
  - Switchable boost up to +18 dB
  - Choose between Buffer and True-Bypass operation
  - Balanced output can be used as a DI box
  - Input impedance 5 MOhm or 1 MOhm depending on the selected mode
  - Input voltage rectified, filtered, stabilized and boosted to 30V
  - Microcontroller-controlled relay switching with active pop suppression
  - Service life of 2 million switching operations
