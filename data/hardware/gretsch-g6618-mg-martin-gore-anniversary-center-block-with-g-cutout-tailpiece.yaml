details: |-
  Martin Gore is a founding member of the seminal electronic rock band Depeche Mode. A Rock and Roll Hall of Fame member, Martin is a renowned songwriter and serves as Depeche Mode's guitarist and keyboardist. He was instrumental in weaving together synthesized electronic sounds with the organic sounds of the guitar to create the unique sonic landscape that would become Depeche Mode's signature sound.

  Having sold more than 100 million records and played to more than 35 million fans worldwide, Depeche Mode remains an ever-evolving and singularly influential musical force. A long time Gretsch aficionado, we are honored to partner with Martin on this exciting new signature model.
