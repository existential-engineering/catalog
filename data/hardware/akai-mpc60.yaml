description: >-
  The MPC60 is an all-in-one sequencer-sampler workstation designed by Roger Linn that has
  become the defining instrument of hip-hop production.
details: |-
  The MPC60, designed by Roger Linn (creator of the Linn Drum and Linn 9000), functions as an all-in-one sequencer-sampler workstation. Its built-in sequencer supports 99 tracks per sequence, 99 patterns, and 99 sequences with ease of creation, editing, and storage. Most artists create patterns in real-time, adding drum parts spontaneously to develop grooves capturing the desired vibe, then varying and chaining patterns into sequences. The device offers full MIDI, SMPTE, and various external control options for any studio situation.

  The sampler section provides 12-bit sampling at 40kHz with straightforward sample editing, looping, and transformation capabilities. A built-in drum machine provides additional groove options. With 18 voices of polyphony, the MPC60 accommodates professional hip-hop production.

  In 1991, the MPC60 MKII was released with minimal changes—primarily new casing and an added headphone jack. Both versions remain useful tools for contemporary aspiring musicians.
specs: |-
  - Polyphony: 16 voices
  - Sampler: 12-bit, 40kHz, Stereo
  - Memory: 768KB (13.1 seconds) expandable to 1.5MB (26.2 seconds)
  - Sounds: 32 drum sounds
  - Keyboard: 16 soft pads with velocity and aftertouch
  - Sequencer: 20 songs, 99 sequences, 99 tracks, 60,000 note capacity
  - Control: MIDI, MTC, SMPTE, FSK24, Pulse 96, click in
