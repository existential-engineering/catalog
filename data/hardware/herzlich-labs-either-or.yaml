description: A passive Eurorack logic module combining up to eight CV, trigger,
  clock or audio signals and switching the strongest signal to one of two output
  buses.
details: |-
  Choose something. Choose nothing. There was a philosopher who wrote a book about how to live your life in the 1840s. He wrote it from the perspective of two different people, who had vastly different answers to Aristotle's question, "How should we live?"

  What he did not account for, however, was the sheer power of the passive OR logic node. Had he known about this, I am certain he would have reached a different conclusion at the end of his book, safe in the knowledge that you can combine up to 8 different CV, trigger and clock signals (audio, too, if you're OK with half-wave rectification) and freely assign them to either bus A or B right at the end, in order to generate complex modulations, rhythms and much more. Although a fundamentally undemocratic design, you will find it useful that only the strongest signal takes precedence as you use the Either/Or to generate trigger patterns, combine gates, create complex modulations and freely switch them between the two output buses, using one as a mute, or using both to create ever evolving but connected patterns. Not experimental enough? Send audio through! You will get some very interesting harmonics as all negative waveforms are hard clipped, and the strongest amplitudes will continuously take precedence over other inputs. You may just discover sounds no one had dared dream of. Do you not know there comes an hour where every Eurorack musician must buy utility modules? Do you believe that your system will always allow itself to be mocked? Do you think you can buy just one more granular synthesis module to avoid this?
specs: |-
  - Analog logic circuit designed for CV, clock, gate and triggers
  - Eight inputs which can be freely assigned to output A or B
  - Only passes the strongest currently present signal, while blocking others
  - Passive design: draws no power from your case
