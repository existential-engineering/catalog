description: The TKE Uke features a solid koa body, gloss finish, and Mi-Si
  electronics for quick charging and stage-ready sound. With classic Martin
  craftsmanship, it's a powerful tenor uke made for any performance.
details: |-
  Martin's first tenor ukuleles rolled off the production line in 1929 and have been a favorite of countless players since. The TKE Uke is Martin's latest addition to its tenor-sized lineup, featuring a gloss body and satin neck, and top, back, and sides crafted of solid koa—a wood native to Hawaii and a favorite of island players.

  It also features an East Indian rosewood bridge and fingerboard, select hardwood neck, applied dovetail neck joint, and nickel open gear tuners. Its size already provides plenty of volume and projection, but the ukulele's electronics allow you to plug in and play at any volume.

  Developed in collaboration with Mi-Si, the electronics provide 16 hours of play on a 60-second charge. The TKE Uke is also available for lefties and comes with a softshell case.
