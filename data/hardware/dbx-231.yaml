id: FyRhCOpG5TBg8T0TFmxaM
name: "231"
manufacturer: dbx
primaryCategory: equalizer
url: https://dbxpro.com/en/products/231
description: Dual Channel 31-Band Graphic Equalizer with XLR and TRS
  connectivity and internal toroidal transformer.
details: |-
  The dbx 231 represents a continuation of the acclaimed 12 and 20 Series graphic equalizers, delivering professional quality at an accessible price point. It includes two 31-band channels of 1/3-octave equalization with ±6 or ±12 dB boost/cut range selection, XLR and 1/4" inputs, and comprehensive output metering with nonconductive nylon sliders.

  The 2-Series marks a significant advancement in entry-level graphic equalizer performance. With frequency response extending below 10 Hz to beyond 50 kHz and dynamic range exceeding 108 dB, combined with an internal toroidal transformer, this unit delivers professional-grade sound at an accessible price point.

  Designed for portable use, touring, and installed sound venues, the 231 incorporates a 50 Hz low-cut filter, front panel bypass switch, and comprehensive LED level monitoring.
specs: |-
  - Input Connectors: 1/4" TRS, XLR (female, pin 2 hot)
  - Input Impedance (Balanced): 40k ohm
  - Input Impedance (Unbalanced): 20k ohm
  - Max Input Level: >+21 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: 1/4" TRS, XLR (male, pin 2 hot)
  - Output Impedance (Balanced): 100 ohm
  - Output Impedance (Unbalanced): 50 ohm
  - Max Output Level (2k ohm): >+21 dBu
  - Max Output Level (600 ohm): >+18 dBm
  - Bandwidth: 20 Hz to 20 kHz, +0.5/−1 dB
  - Frequency Response: <10 Hz to >50 kHz, +0.5/−3 dB
  - Dynamic Range: >108 dB
  - Signal-to-Noise Ratio: >90 dB
  - THD+Noise: <0.004%
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - EQ Channels: Dual 31-band, 1/3-octave Constant Q
  - EQ Range: ±6 dB or ±12 dB switchable
  - Low Cut Filter: 50 Hz, 12 dB/octave high-pass
  - Operating Voltage: 100/120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
