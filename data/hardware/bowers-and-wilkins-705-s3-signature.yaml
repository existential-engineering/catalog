details: |-
  The 705 S3 Signature is a 2-way vented-box stand-mount loudspeaker that sits within the 700 Series Signature range. It pairs a 25mm Decoupled Carbon Dome high-frequency unit, housed in a Solid Body Tweeter-on-Top enclosure, with a 165mm Continuum cone bass/midrange driver.

  Compared with the standard 705 S3, the Signature edition introduces an upgraded mid-bass motor system, improved capacitors in the crossover, revised speaker terminals, and a more open tweeter grille mesh. Flowport venting technology is used to reduce port noise at the rear of the cabinet.

  Nominal impedance is 8 ohms (3.7 ohm minimum) with a sensitivity of 88dB SPL at 2.83Vrms / 1m, and a recommended amplifier power range of 30W to 120W into 8 ohms.

  Available finishes are Datuk Gloss and Midnight Blue Metallic, both supplied with a black grille. Passive loudspeakers carry a 5-year warranty from the date of purchase.
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm (1 in) Decoupled Carbon Dome
  - Bass/midrange driver: 1x 165mm (6.5 in) Continuum cone
  - Frequency range: 45Hz - 33kHz (-6dB)
  - Frequency response: 50Hz - 28kHz (±3dB)
  - Sensitivity: 88dB SPL (2.83Vrms at 1m)
  - Nominal impedance: 8Ω (minimum 3.7Ω)
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (150Hz - 20kHz) at 90dB / 1m
  - Recommended amplifier power: 30W - 120W into 8Ω
  - Max recommended cable impedance: 0.1Ω
  - Height (cabinet only): 345mm (13.6 in)
  - Height (with tweeter): 413mm (16.3 in)
  - Width: 192mm (7.6 in)
  - Depth (cabinet): 297mm (11.7 in)
  - Depth (with grille and terminals): 337mm (13.3 in)
  - Net weight: 10.35 kg (22.8 lb) each
  - Finishes: Datuk Gloss, Midnight Blue Metallic
  - Grille: Black
