description: A passive hybrid 0hp/1U module that senses ambient or direct light
  to attenuate an audio or CV signal, acting as a light-controlled attenuator or
  theremin-like performance tool.
details: |-
  Let there be light! The 0hp Light Attenuator is a performance tool which senses ambient and direct light, attenuating your signal in the dark, and letting it flow in the light. Whether you play by the candlelight, or aggressively shine a high-powered flashlight directly into the sensor, your can hear your audio or CV signal swell, while it will wither away to nothing when you cover it inside the palm of your hand. Perfect for experimental performances involving natural and artificial light sources, the sensor is receptive to visible light (sorry, infrared and UV don't do the trick quite as well), allowing you to create a tiny light theremin, or perhaps a mixer array of light-powered switches. The sensor is not immediate, so you get a pleasing slew limiter effect to everything you do with it as well. Designed according to the new hybrid 0hp/1U format, you can choose to buy the module both as safely enclosed 0hp, or as easily installed 1U. The enclosure is road ready and bolted down, but internal brass threads means you can always change your mind and install it somewhere else. No external power required, rackspace optional. Perfect for semi-modular musicians, as well as those dabbling in the world of experimental effects - both audio and control voltages will work.
specs: |-
  - Accepts both CV and audio signals
  - Bright lights allow your signal to pass
  - Keep it in darkness to silence your signals
  - Passive design: no external power, no batteries
