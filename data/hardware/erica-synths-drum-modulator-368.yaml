description: Erica Synths Modulator is an advanced modulation and pitched noise
  source with focus on rhythmic (but not limited to) compositions in mind. It
  features two identical syncable to the BPM LFOs/noise sources with selectable
  morphing waveshapes. LFO frequency can be manually adjustable, as well as they
  provide frequency divisions and multiplication in Sync mode. Each LFO has two
  outputs- main one and secondary one with adjustable phase, so you can create
  evolving modulations. Furthermore, LFOs can be linked to work at the same
  frequency and the first LFO has built in VCA to control output signal
  amplitude.
details: |-
  The Drum Modulator is an advanced modulation and pitched noise source built for the Erica Synths Drum series, with rhythmic work in mind though not limited to it. Two identical sources sit on a 10HP panel, each able to act as an LFO or as a pitched noise generator.

  Each source offers seven morphing waveshapes plus noise, and both can be synced to the BPM, with frequency divisions and multiplications available in sync mode. Frequency can also be set by hand, and the two sources can be linked to run at the same frequency.

  Every source has two outputs, a main one and a secondary one whose phase is adjustable, which is what lets a patch build evolving modulation out of a single waveshape. The first source has a VCA built in to control the amplitude of its output signal.

  In pitched noise mode a low pass and a high pass filter are available on the outputs, so the noise can be shaped into a usable percussion or texture source. CV control covers the LF rate and the noise pitch.

  Output level runs -5V to +5V and CV level spans the same range across the full sweep. The module is 10HP wide and 45mm deep, drawing 86mA from the positive rail and 7mA from the negative rail.
specs: |-
  - Two independent modulation/pitched noise sources
  - 7 morphing waveshapes plus noise
  - LFO Sync, frequency divisions and multiplications
  - Integrated VCA for first modulation source
  - Two main outputs
  - Two outputs with an adjustable phase shift
  - LP and HP filter on outputs in pitched noise mode
  - CV control over LF rate and noise pitch
  - Output level -5V to +5V
  - CV level (full span) -5V to +5V
  - Module width 10HP
  - Module depth 45mm
  - Power consumption 86mA@+12V, 7mA@-12V
