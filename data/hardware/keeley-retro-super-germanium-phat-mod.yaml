description: Custom Shop overdrive built around a germanium amplifier stage,
  covering drive, fuzz and cranked-amp gain tones.
details: |-
  The Retro Super Germanium Phat Mod is a Keeley Custom Shop drive that pairs the Phat Mod overdrive circuit with a germanium amplifier stage. That extra gain stage sits in front of the amp-style tone stack, which the maker describes as simulating a retro fuzz pedal run into a cranked amplifier. The secondary gain stage is opened up fully, so the pedal is responsive and dynamic and reaches high gain levels with long sustain.

  The circuit covers drive, fuzz and cranked-amp territory from one control set, and works at both low and high gain settings. Keeley describes it as an evolution of the original Keeley Blues Driver modifications.

  The pedal is built in Edmond, Oklahoma. Enclosures are CNC milled from aluminium, coated in a high temperature oven and then UV LED printed with the artwork. Each germanium transistor is tested for a particular gain range, installed, measured for correct biasing and then checked by ear for excessive noise before the pedal goes through a second round of testing at final assembly.
specs: |-
  - Germanium amplifier gain stage ahead of the amp-style tone stack
  - Germanium transistors individually gain tested and bias measured
  - CNC milled aluminium enclosure with UV LED printed artwork
  - Keeley Custom Shop build, made in Edmond, Oklahoma
