description: KONSTRUKT-8 Enclosure + Power Supply
details: |-
  A compact Eurorack enclosure with an integrated power supply, built for the KONSTRUKT-8 system. The enclosure provides a bespoke way to turn assembled EDU DIY percussion modules into a complete, playable instrument.

  It uses pre-drilled threaded mounting holes instead of standard Eurorack rails with sliding nuts. That fixed layout is designed to fit the KONSTRUKT-8 modules in a specific order.

  The box holds the enclosure, the integrated power supply, and a power distribution bus board with connectors. Power distribution is standard plus and minus 12V Eurorack, from an integrated 1A supply, in a compact desktop format.

  The enclosure is included in the KONSTRUKT-8 System bundle. For anyone who already owns the individual kits, it completes the system and turns those modules into a fully playable instrument.
specs: |-
  - Eurorack-compatible enclosure
  - Designed to fit the full KONSTRUKT-8 system
  - Integrated 1A power supply
  - Standard plus and minus 12V Eurorack power distribution
  - Compact desktop format
  - Pre-drilled threaded mounting holes instead of Eurorack rails with sliding nuts
  - Power distribution bus board and connectors included
