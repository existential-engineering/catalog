description: "Incredible three-way point source monitor with the footprint of a
  compact two-way. When space and precision is of the essence, nothing even
  comes close."
details: |-
  The 8331A is the smallest member of Genelec's award-winning 'The Ones' series of three-way coaxial Smart Active Monitors. Despite the compact footprint of a two-way design, it delivers true point source performance through Genelec's Minimum Diffraction Coaxial (MDC) driver technology, combining a 90 mm midrange and 19 mm tweeter into a single coincident point source, supplemented by two hidden 130x65 mm racetrack woofers acoustically concealed within the cabinet.

  Class D amplification provides 72 W for the bass driver and 36 W each for the midrange and treble, delivering a short-term maximum SPL of at least 104 dB SPL and a frequency response extending from 45 Hz to 37 kHz. The free-field frequency response is accurate to within ±1.5 dB across 58 Hz - 20 kHz, supported by active crossovers at 500 Hz and 3 kHz.

  The Minimum Diffraction Enclosure (MDE) is precision die-cast aluminium with rounded edges, paired with a Directivity Control Waveguide (DCW) to ensure controlled dispersion and consistent on- and off-axis response. Acoustically Concealed Woofers (ACW) keep the front baffle clean while extending bass response through a reflex port.

  As a SAM (Smart Active Monitoring) product, the 8331A is fully compatible with Genelec's GLM calibration software, which uses the included measurement microphone (sold via the GLM Calibration Kit) and either the 9320A Reference Controller or the GLM network adapter to compensate for room acoustics, set levels, manage groups, and run AutoCal. Two RJ45 GLM network ports allow daisy-chaining of monitors and subwoofers.

  Intelligent Signal Sensing (ISS) technology drops idle power consumption to under 0.5 W, meeting EU ErP directives. The integrated Iso-Pod stand decouples the monitor from the supporting surface, reduces unwanted vibrations, and allows angled placement. The 8331A is available in dark grey, white, black, raw aluminium, and over 120 custom RAL finishes.
specs: |-
  - Three-way coaxial point source design
  - Short term maximum SPL >= 104 dB
  - Peak SPL >= 110 dB
  - Frequency response: 45 Hz - 37 kHz (-6 dB)
  - Frequency response accuracy: +/- 1.5 dB (58 Hz - 20 kHz)
  - Bass amplifier: 72 W Class D
  - Midrange amplifier: 36 W Class D
  - Treble amplifier: 36 W Class D
  - Bass drivers: 2 x 130 x 65 mm racetrack (Acoustically Concealed Woofers)
  - Midrange driver: 90 mm coaxial
  - Treble driver: 19 mm coaxial
  - Crossover frequencies: 500 Hz (Bass/Mid) and 3 kHz (Mid/Treble)
  - Self-generated noise: <= 0 dB SPL @ 1 m on axis
  - Power consumption (ISS active): <= 0.5 W
  - Power consumption (idle): <= 4 W
  - Power consumption (full output): 60 W
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Dimensions: 305 x 189 x 212 mm (H x W x D) with Iso-Pod
  - Weight: 6.7 kg (14.8 lb)
  - Die-cast aluminium Minimum Diffraction Enclosure (MDE) with reflex port
  - Minimum Diffraction Coaxial (MDC) driver technology
  - Directivity Control Waveguide (DCW) technology
  - Iso-Pod vibration decoupling stand included
  - Intelligent Signal Sensing (ISS) auto power management
  - GLM (Genelec Loudspeaker Manager) network calibration support
  - Available colors: Producer Dark Grey, White, Black (Matte), Raw aluminium, 120+ RAL custom colors
