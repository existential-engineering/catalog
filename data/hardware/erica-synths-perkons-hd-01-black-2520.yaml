description: Unique live performance and sound design instrument.
details: |-
  PĒRKONS HD-01 is a unique live performance and sound design instrument that tears down the borders between drum machine, synthesizer and drone instrument. It features four sonically versatile hybrid voices, each a digital sound engine followed by an analogue multimode filter with overdrive, and a sequencer with simultaneous control over all four percussion tracks.

  Each voice has 3 sound engine modes, an HP/BP/LP filter and 8 controls for nuanced sound design, including an internal BBD FX send. All voice parameter settings can be saved as KITS. To add dynamics to the performance, parameter automation is implemented and a modulation LFO can be assigned to all parameters.

  Integration with external gear is considered throughout. Each voice has a dedicated trigger input, an individual output, and an FX send and return on 6.3mm jack sockets, along with extensive MIDI implementation. All voices are summed and run through a built-in compressor.

  The sequencer runs four tracks with four time divisions and four time multiplications per track, per-step ratchets and probabilities, and shuffle and groove settings for each track. 64 kits and 64 patterns are held in memory, with additional memory on the SD card.

  The BLACK edition carries a timelessly black finish, chosen to match Erica Synths' other instruments and to complement the dark aesthetic of the company's modules and desktop instruments.
specs: |-
  - 4 hybrid voices (digital sound engine and analogue multimode filter with overdrive)
  - 3 sound engine modes per voice
  - 8 controls per voice
  - HP/BP/LP filter per voice
  - External trigger inputs for each voice
  - Individual voice outputs
  - Individual FX sends and returns
  - Master FX send and return
  - 64 kit and 64 pattern memory plus additional memory on the SD card
  - Built-in BBD emulation and a compressor
  - Modulation LFO with morphing waveforms, up to 8 modulation destinations per voice
  - 4 track sequencer, 4 time divisions and 4 time multiplications per track
  - Per-step ratchets and probabilities
  - Shuffle and groove settings for each track
  - MIDI IN and MIDI OUT
  - Dimensions: 315mm x 454mm x 90mm (including knob height)
  - Weight: 3.7 kg
