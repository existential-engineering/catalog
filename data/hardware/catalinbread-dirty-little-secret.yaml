details: |-
  The Dirty Little Secret (DLS) is Catalinbread's flagship Marshall-inspired overdrive pedal, capturing the classic plexi to early 1970s Marshall Super Lead and Super Bass sound and response. It is designed as an always-on foundation pedal that transforms any amplifier into the tone of raging British Marshall stacks.

  Rather than acting as a standalone boost or clip-per-stage effect, the DLS is meant to be the core of your guitar sound — the foundation upon which you layer boosters, fuzzes, filters, and other overdrives placed in front of it. This approach mirrors how classic Marshall amplifiers were used: as the always-present tonal backbone of a rig.

  The pedal features an internal mode switch and an internal presence potentiometer, allowing players to set a fixed tone character without the need for external knob tweaking. It accepts 9-18V DC power, with higher voltages providing additional headroom and dynamics.

  Handmade in Portland, Oregon, the Dirty Little Secret ships with a 3-year warranty.
