details: |-
  Handwired Tube meets Class D Power

  ABOUT

  The Half and Half is where the old technology meets the new technology. The preamp is similar to the other all tube Milkman amplifiers: it is hand wired with high plate voltage. The discrete tube preamp section feeds into a Class D power module which scales up to 400 watts. It's the most transparent and exciting sounding hybrid amplifier on the market. Unlike other hybrid amplifiers, the tube portion of the Half and Half is designed and hand wired like a vintage tube amplifier. Tube amps need to be built a certain way to sound their best, be serviceable, and last into the ages. The Half and Half was designed with all of this in mind. The Steel Guitar Half and Half combo comes with a house made 4ohm Milkman Ceramic Speaker which is available in either a 12" or 15" size. The speaker is nearly identical to a JBL E120 however it is considerably less heavy. A Neodymium alternative is also available for those looking to shed even more weight from this amplifier. A DI with XLR output with level control has been added to the rear panel. This allows you to use the amplifier as a standalone tube preamp with EQ. It is safe to run the Half and Half with no speaker attached, or you can use the DI with a speaker attached for a balanced XLR line out. Like all Milkman amplifiers, the Half and Half is hand built using the finest possible components in San Francisco, CA

  WATTAGE

  200W Class D x 2

  4ohm @ 200W per side

  8ohm @100W per side

  16ohm @ 50W per side

  *Each output can operate discretely from one another for a total of 400 watts. You can mismatch speaker cabinets and it will not affect the total impedance. For example, run the internal speaker at 4ohms and plug an 8ohm cabinet into the second speaker output. FEATURES

  Tube preamp with EQ, Tube Reverb with Dwell, Blend and Tone controls. Output control. Switchable 120/240V power input. DIMENSIONS & WEIGHT

  Head 21-1/2" W x 9" H x 9" D 16lbs

  Ceramic Combo 21-1/2 " W x 22-1/2" H x 10" D 41lbs

  Neo Combo 21-1/2" W x 22-1/2" H x 10" D 30lbs

  Demo

  The Steel Guitar Half and Half

  Bob Hoffnar shows us the dreamy tones of the new Half ahd Half
