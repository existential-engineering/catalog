description: The Empress Tremolo2 is an analog-signal-path tremolo pedal with
  digitally controlled opto modulation, offering tap tempo, selectable
  waveforms, eight rhythms, up to eight presets and a control port for external
  tap, expression, control voltage and MIDI.
details: |-
  The Empress Tremolo2 is an original design built to add innovative features without sacrificing tone. The audio signal path is analog while the tremolo effect is controlled digitally via opto technology, giving a whisper-quiet result free from the LFO throb common to tremolos.

  Three waveforms are available: an asymmetrical shape modeled after a '64 Fender Vibrolux (brown face), a square wave for harder sounds, and a triangle wave for a more conventional tremolo. Tap tempo averages the last four taps and offers ratios (1:1, 3:4, 1:2, 1:3, 1:4), and an exclusive set of eight rhythm patterns goes beyond standard tremolo. An output gain stage delivers up to 12 dB of clean gain to offset the volume drop many tremolos introduce.

  Up to eight presets can be saved and recalled instantly. An advanced configuration menu controls bypass mode, preset count, MIDI, control-port behavior and ramp speed. The control port accepts external tap, expression pedal, control voltage and MIDI. It supports true or buffered bypass in a compact die-cast aluminum enclosure.
specs: |-
  - Analog audio path with digitally controlled opto tremolo
  - 3 waveforms: asymmetrical ('64 Fender Vibrolux model), square, triangle
  - Tap tempo (averages last four taps) with ratios 1:1, 3:4, 1:2, 1:3, 1:4
  - 8 rhythm patterns
  - Output gain stage up to 12 dB, clean
  - Up to 8 presets
  - Advanced configuration menu (bypass, preset count, MIDI, control port, ramp speed)
  - Control port: external tap, expression pedal, CV, MIDI
  - True or buffered bypass
  - Signal-to-noise 107.7 dB, THD 0.40%
  - Input impedance 1 MOhm, output impedance 330 Ohm, frequency response 4Hz-30kHz (-3dB)
  - Power: 9 - 12 V DC (negative tip), 2.1mm barrel, 100 mA
  - Die-cast aluminum enclosure, approx. 4.5" x 3.5" x 1.5"
