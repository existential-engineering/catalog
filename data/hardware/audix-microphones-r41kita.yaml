details: |-
  R41KIT is a single-channel true diversity wireless receiver kit. It ships with antennas, a power supply, and a padded carrying case, and is designed to pair with an Audix handheld or bodypack transmitter of the user's choice.

  Features include one-touch auto clear channel scan and transmitter sync, a 32 MHz wide-spectrum receiver, durable metal housing, and 106 pre-coordinated frequencies for quick and easy setup.

  Frequency Band
  522 MHz - 586 MHz (A: 522 - 554 MHz, B: 554 - 586 MHz)
