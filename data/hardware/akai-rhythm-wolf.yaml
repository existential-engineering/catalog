description: >-
  A fully analog 4-voice drum machine and 1-voice bass synthesizer that combines
  drum sequencing and bass synthesis in a single groovebox, released during the
  2010s analog revival as an affordable alternative to classic drum machines.
details: |-
  The Rhythm Wolf emerged during the 2010s "New Analog Revolution" when affordable analog gear became accessible to a wider audience. It featured a complete VCO analog signal path with four drum voices and one bass synthesizer voice, positioned as an affordable alternative to classic drum machines.

  The four drum voices cover kick, snare, percussion, and hi-hat, each with dedicated parameter controls. The snare and percussion voices produced solid results, while the kick drum was widely criticized for its weak output and limited parameter control. The bass synth voice offered saw or square waveforms through a resonant low-pass filter, though it suffered from pitch tracking issues that required an Akai-released tuning app for proper operation.

  The sequencer offered 16 banks with 16-step patterns (up to 64 steps), variable swing, and grid resolutions from 1/4 to 1/32 notes. MIDI implementation included channel 10 for drums and channel 1 for synth, with a note-tie feature for extended envelope control.

  Despite solid build quality and a capable sequencer, the Rhythm Wolf became the subject of viral criticism. A YouTube reviewer's negative video gained widespread attention, and subsequent copycat videos solidified its poor reputation before many users experienced it firsthand. An overdrive effect called "Howl" added additional character to the sound.
specs: |-
  - Polyphony: 5 voices (4 drum, 1 bass synth)
  - Oscillators: 5 VCOs (4 drums, 1 bass synth)
  - Waveforms: Saw or Square
  - Filter: One -12dB resonant low-pass filter (synth voice only)
  - Effects: Overdrive (Howl)
  - Sequencer: 16 banks x 64 steps, 1/4 to 1/32 grid resolution, variable swing
  - MIDI: In/Out/Through, Channel 10 (drums), Channel 1 (synth)
  - Analog trigger I/O: Roland 24 ppq compatible
  - Controls: 12 sequencer buttons, MPC-style velocity pads (3 velocity levels)
  - Memory: 16 x 64 patterns, retained after power-off
