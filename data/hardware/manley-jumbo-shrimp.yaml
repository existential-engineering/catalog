description: Jumbo Shrimp® delivers White Follower 5670 tube topology, 50Ω
  output impedance, zero global feedback. Minimalist all-tube signal path with
  RF remote.
specs: |-
  - All-tube, direct-coupled signal path with zero global feedback
  - White Follower output stage with ~50 Ohm output impedance
  - Gain: 12 dB
  - Frequency Response: 10 Hz – 80 kHz
  - THD: 0.02% at 1V rms output
  - Input Impedance: 250 kOhm
  - Maximum Output: +23 dBu
  - Tubes: 2x 12AT7EH (input), 2x 5670 (driver), 2x 7044 (output)
  - Motorized ALPS volume attenuator
  - MIT/MultiCap polypropylene coupling capacitors
  - RF remote control
