details: |-
  Designing MOJOMOJO OVERDRIVE was both very simple and very complex. We knew what we wanted from the start: A pedal that sounds like an amp, with a very open character and little compression allowing even the most subtle of your playing to shine through. We basically set out to capture lightning in a bottle with a clarity that even allowed for complex chords to stand out – did we succeed? Well, plug it in, play one lick, look us in the eye and try to tell us we didn’t!    •    Increased circuit board voltage for extra headroom    •    Precise tone controls    •    Voicing switch

  One of the reasons why we’ve achieved such a dynamic pedal is the fact that we use a special circuit that ramps up the voltage to more than 3 - 4 times the amount of your typical drive pedals. However, we don’t use this added gain to squeeze more overdrive/distortion out of the pedal, but to dramatically increase the headroom and dynamics. The result? The most alive overdrive you have ever heard and a pedal that defines all that is magic about overdriven sounds.

  MOJOMOJO is a very musical pedal, but it needs direction. It
