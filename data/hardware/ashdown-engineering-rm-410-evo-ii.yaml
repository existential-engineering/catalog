description: The Ashdown Rootmaster EVO 410T is a 450-watt 4 x 10" bass cabinet
  at 8 ohms with tweeter, weighing only 21kg/46lbs thanks to its compact,
  lightweight construction. Four robust custom-designed 10" White Line speakers
  bring classic Ashdown sound to the front of the mix with exceptional attack,
  clarity, and low-end. The tweeter can be set to hi, low, or off via a
  three-way switch, and the distinctive high-quality finish helps it stand out.
details: |-
  Super-lightweight 4 x 10" bass speaker cabinet in the Rootmaster EVO II range, handling up to 450 watts at 8 ohms while weighing only 21kg/46lbs. Four robust custom-designed White Line 10" speakers deliver classic Ashdown sound with exceptional attack, clarity, and low-end, bringing the bass to the front of the mix. Built from lightweight plywood, it adds a three-way tweeter switch (hi, low, or off) to shape the high end.
specs: |-
  - Power handling: 450 watts
