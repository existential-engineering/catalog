details: |-
  A professional true diversity handheld wireless system featuring the AUDIX VX5.
  The VX5 is a multi-purpose, professional vocal condenser microphone designed for stage, studio, and broadcast applications. With an ability to duplicate studio-quality sound on stage, the VX5 has a smooth and detailed frequency response, resistant to feedback, and handles very high SPLs without distortion.

  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include a rackmount kit for mounting two systems in one rack space, active directional antennas, and an antenna distribution system for up to four systems (4 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - RF frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum tuning
  - True diversity reception
  - Handheld transmitter: H60 with VX5 condenser capsule
  - One-touch auto clear channel scan and transmitter sync
