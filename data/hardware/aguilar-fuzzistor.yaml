  - Input: One 1/4-inch jack
  - Output: One 1/4-inch jack
  - Height: 2.25"
  - Width: 2.5"
  - Depth: 4.75"
  - Weight: 1 lb
  - Controls: Engage switch, Blend, Fuzz, Level, Tone
