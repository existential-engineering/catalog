description: The Fuzzistor delivers deep and textured tone using an analog
  silicon transistor distortion circuit. Provides complete control over the
  blend of clean and fuzz sound, the amount of fuzz from subtle to crushing,
  output level for gain matching, and a tilt EQ tone control.
details: |-
  Analog silicon transistor distortion circuit providing warm, deep fuzz textures
  specific to bass frequencies.

  Blend control mixes clean and fuzz tones, allowing the low-end to remain
  present even at full fuzz settings. Fuzz control sweeps from subtle grit to
  crushing distortion. Level control provides gain-matching output volume, and
  the Tone control is a tilt EQ that simultaneously boosts high frequencies
  while cutting lows (or vice versa).

  Dimensions: 2.25" H × 2.5" W × 4.75" D. Weight: 1 lb.

  Backed by Aguilar's three-year limited warranty to the original owner.
