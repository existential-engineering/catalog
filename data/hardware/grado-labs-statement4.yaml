description: Low-output moving iron phono cartridge from Grado's Lineage Series.
  Features a Brazilian Ebony wood body, machined boron cantilever with nude
  Shibata diamond stylus, and ultra-high purity 7N OCC copper internal wiring.
details: |-
  The Statement4 represents Grado's Lineage Series approach to cartridge design, combining decades of cartridge engineering with a moving iron flux-bridger system that achieves low moving mass with a stable coil structure.

  The body is machined from Brazilian Ebony, paired with a machined boron cantilever and a nude Shibata diamond stylus for accurate tracing and detail retrieval.

  The internal signal path uses ultra-high purity 7N OCC copper wiring, and components receive cryogenic treatment during assembly. The result is a balanced, controlled presentation with clear detail and a smooth, natural top end.

  Available in stereo and mono configurations. Eligible for Grado's Wood Cartridge Upgrade Program for existing Grado wood cartridge owners.
specs: |-
  - Body Material: Brazilian Ebony Wood
  - Cantilever: Machined Boron
  - Stylus Profile: Nude Shibata Diamond
  - Output Voltage: 1.0mV @ 5 CMV (45°)
  - Frequency Response: 5-65 kHz
  - Channel Separation: Avg. 30dB (10-30k Hz)
  - Input Load: 10-47k ohms
  - Inductance: 8mH
  - Resistance: 74 ohms
  - Weight: 10 grams
  - Tracking Force: 1.6-1.9 grams
  - Compliance: 20 μm/mN
  - Internal Wiring: Ultra-high purity 7N OCC copper
  - Processing: Cryogenic treatment
