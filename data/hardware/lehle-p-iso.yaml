details: |-
  The Lehle P-ISO combines passive isolation with the highest possible signal fidelity. Its applications range from isolation and eliminating hum, to balancing and reamplification, along with any signal routing that requires a clean signal free from noise.

  At its core is the high-end Lehle Transformer HZ, which galvanically isolates the signal and eliminates any possibility of ground loops. The transformer was specially designed for use with high-impedance signals but also processes low-impedance signals with uncompromising sound quality.

  The classic application is as a hum suppressor. Background noise caused by ground loops frequently occurs when two electronic devices are connected to each other, and the P-ISO provides a simple but extremely effective remedy when installed between the two units: using the ISO output, the devices are galvanically isolated and the background noise goes away. When two amplifiers are driven by one stereo effects device, the P-ISO can isolate one amplifier from the other.

  Because an unbalanced or balanced signal can be picked off at the ISO output, the P-ISO is also suitable as a reamplification device or as a high-quality compact DI box for all signal types. It performs all of its functions without any need for a power supply, and its optimised size and low weight let it fit below a pedalboard or in a pocket.
specs: |-
  - Isolator and DI box
  - Absolutely no signal loss or hum
  - High-impedance Lehle Transformer HZ galvanically isolates the signal
  - Suitable for balanced or unbalanced signals
  - Passive, no power supply required
  - Usable for reamplification and for isolating one amplifier from another
  - Optimised size and low weight, fits below a pedalboard
