description: The CL-210H-NEO is a hand-built UK bass cabinet from Ashdown's
  Classic Custom Shop range, delivering 500W AES / 1000W peak through dual
  10-inch B&C neodymium drivers and a B&C high-frequency horn with a three-way
  crossover for full-range clarity and punch. Its birch ply cabinet with a rear
  bass-reflex port projects tight, dynamic lows, while Buffalo Tolex, silver &
  blue cloth, and chrome corners showcase classic Ashdown style. With 99dB
  sensitivity, Neutrik connectors, and an offset carry handle, it is a
  lightweight yet powerful cab built for stage, studio, and the road.
