description: 'Midas'' HD96-AIR Control Centre with Touring Package is an
  ultra-portable digital live console built on the Graviton Mk 2 64-bit summing
  processing engine, fusing the iconic sound of the H3K and engineering
  precision of the Heritage D Series with breakthrough portability. The control
  surface features a 21" full-HD high-brightness capacitive multi-touch display
  (1920 x 1080 px, up to 10 simultaneous touches), 15 colour LCD info displays
  (24 x 24 mm, 240 x 240 px), 3 motorized 100 mm faders, 8 touch-sensitive
  rotary controls, 8 fully assignable backlit buttons, 24 global assignable
  shortcut buttons plus 2 global left/right shortcut buttons, and an integrated
  16-input / 12-output Shout Mixer. Connectivity includes 8 switchable
  analogue/AES3 inputs on 3-pin XLR, 8 switchable analogue/AES3 outputs on 3-pin
  XLR, 1 talk XLR input, 1 headphone output on 1/4" TRS stereo (side panel), 4
  AES50 RJ45 ports, 2 expansion module slots, snake ports (2 optical + 2
  copper), 2 BNC word clock (75 Ω), an external Ethernet connector (RJ45 XLR), 2
  HDMI monitor outputs, 8 USB 3.0 type-A ports (5 V / 900 mA), 1 USB 2.0 type-A
  port (top panel, 5 V / 500 mA), 2 micro-USB service ports, 2 x 5-pin MIDI DIN
  sockets (in/out), a 4-pin 12 VDC / 150 mA lamp output, and dual IEC mains
  inputs powered by 2 x auto-ranging 100–240 V (50/60 Hz) switch-mode supplies
  (220 W typical, 2 x 350 W max). Built-in wireless features include
  802.11a/b/g/n/ac (internal & external dual-band antenna, 2.4 GHz and 5 GHz,
  max 18 dBm output) and Bluetooth 5.0 Dual Mode (8 dBm, ~30 m range,
  GAP/SDN/PAN/SPP/IAP/HFP 1.5/GATT/ATTR/A2DP/ACRP). The TP variant ships with a
  touring-grade flight case; the full package weighs under 30 kg (16.74 kg
  surface; 29.90 kg with flight case).'
details: |-
  The Midas HD96-AIR-CC-TP is the Touring Package variant of the HD96-AIR Control Centre, a hyper-portable digital live console built on Midas' Graviton Mk 2 64-bit summing processing engine. The control surface uses a 21" full-HD capacitive multitouch display (1920 x 1080 px, up to 10 simultaneous touches), 15 colour LCD info strips (24 x 24 mm, 240 x 240 px), 4 x 20-segment meters (-36 dBu to +21 dBu), 3 motorized 100 mm faders, 8 touch-sensitive rotary encoders, 8 fully assignable backlit buttons, 24 global assignable shortcut buttons and 2 global left/right shortcuts. An integrated Shout Mixer provides 16 independent inputs and 12 dedicated outputs. Audio I/O comprises 8 switchable analogue/AES3 inputs and 8 switchable analogue/AES3 outputs on 3-pin XLR, a balanced talk XLR input, a 1/4" TRS stereo headphone output on the side panel, 4 AES50 RJ45 ports, 2 expansion module slots, 2 optical and 2 copper snake ports, 2 BNC word clock connectors (75 Ω), and an external Ethernet connector (RJ45 XLR). Computer/peripheral I/O includes 2 HDMI monitor outputs (1080p60/720x480p60 supported), 8 USB 3.0 type-A ports (5 V / 900 mA), 1 USB 2.0 type-A port on the top panel (5 V / 500 mA), 2 service micro-USB ports, 2 x 5-pin MIDI DIN (in/out), and a 4-pin 12 VDC / 150 mA lamp output. Wireless capabilities include 802.11a/b/g/n/ac Wi-Fi (2.4 / 5 GHz, internal & external dual-band antenna, 18 dBm max output) and Bluetooth 5.0 Dual Mode (8 dBm, ~30 m, GAP/SDN/PAN/SPP/IAP/HFP 1.5/GATT/ATTR/A2DP/ACRP). Audio performance: 10 kΩ input impedance, +24 dBu non-clip maximum input, -2.5 dB to +45 dB stepped analogue gain plus -40 dB to +20 dB continuous digital trim, switchable +48 V phantom power per input, 106 dB dynamic range (22 Hz–22 kHz unweighted), -100 dB adjacent-channel crosstalk at 1 kHz, +21 dBu maximum output level. Dual auto-ranging 100–240 V (50/60 Hz) switch-mode supplies (220 W typical / 2 x 350 W max) feed two IEC mains inputs. The TP variant ships in a touring-grade flight case; total package weighs 29.90 kg (16.74 kg surface only).
specs: |-
  - Processing Engine: Graviton Mk 2 (64-bit summing engine)
  - Analogue / AES3 In (switchable): 8 x 3-pin XLR
  - Analogue / AES3 Out (switchable): 8 x 3-pin XLR
  - Talk: 1 x XLR, balanced
  - Headphone Output (side panel): 1 x 1/4" TRS, stereo
  - AES50: 4 x RJ45
  - Snake 1 / 2: 2 x optical, 2 x copper
  - Expansion: 2 x expansion module slots
  - Word Clock 75 Ω: 2 x BNC
  - External (Ethernet) Connector: RJ45 XLR
  - HDMI 1 / 2 (Monitor Output): 2 x HDMI
  - Supported Monitor Formats: 1920 x 1080 p, 59.94 Hz / 60 Hz 16:9 & 720 x 480 p, 59.94 Hz / 60 Hz
  - USB Port: 8 x USB 3.0, type A, 5 V = 900 mA power
  - USB (Top Panel): 1 x USB 2.0, type A, 5 V = 500 mA power
  - USB Port (Service): 2 x USB, micro-USB
  - MIDI In / Out: 2 x 5-pin MIDI DIN sockets
  - Lamp: 4-pin, 12 VDC / 150 mA max
  - IEC Mains Socket with Power Switch: 2
  - Switch-Mode Power Supply: 2 x auto-ranging 100–240 V (50/60 Hz)
  - Power Consumption: 220 W typical, 2 x 350 W max
  - Analogue Input Impedance: 10 kΩ
  - Non-clip Maximum Input Level: +24 dBu
  - Input Gain: Analogue stepped gain -2.5 dB to +45 dB plus -40 dB to +20 dB continuous digital trim
  - Phantom Power (switchable per input): +48 V
  - Talk Mic Impedance: 5 kΩ
  - Talk Mic Gain: +15 dB to +60 dB
  - Talk Mic Max Level: +6 dBu
  - Talk: Talk gain min to max
  - Analogue Output Impedance: 50 Ω
  - Analogue Output Max Level: +21 dBu
  - Dynamic Range: 106 dB, 22 Hz to 22 kHz, unweighted
  - Crosstalk @ 1 kHz: -100 dB physically adjacent input channels
  - Crosstalk @ 10 kHz: -90 dB physically adjacent input channels
  - Headphones Output Impedance: 10 Ω
  - Headphones Maximum Output Level: +21 dBu
  - Phones Controls: Min to max, mutable
  - Display Screen: 21" LCD high brightness, 1920 x 1080 px, capacitive touchscreen up to 10 simultaneous touches
  - LCD Info Displays: 15 x full colour LCD info displays, 24 mm x 24 mm, 240 x 240 px
  - Meters: 4 x 20-segment, -36 dBu to +21 dBu
  - 100 mm Motorized Faders: 3
  - Fully Assignable Rotary Controls: 8
  - Fully Assignable Backlit Buttons: 8
  - Global Assignable Shortcut Buttons: 24
  - Global Assignable Shortcut Buttons (Left / Right): 2
  - Shout Mixer: 16 independent inputs, 12 dedicated outputs
  - Wi-Fi Standard: IEEE 802.11a/b/g/n/ac (supports a/b/g/n/ac device)
  - Wi-Fi Frequency Range: 2.4 GHz (2.4 GHz - 2.4835 GHz) and 5 GHz (5.15 GHz - 5.825 GHz) operation dependent on region
  - Wi-Fi Max Output Power: 18 dBm (using 5 GHz range)
  - Antenna: Internal & external dual-band
  - Bluetooth Version: 5.0 Dual Mode
  - Bluetooth Power: 8 dBm
  - Bluetooth Maximum Communication Range: 30 m typical
  - Bluetooth Compatibility: Supports GAP, SDN, PAN, SPP, IAP, HFP 1.5, GATT, ATTR, IAP, A2DP, ACRP
  - Operating Temperature Range: 5 °C to 45 °C (41 °F – 113 °F)
  - Storage Temperature Range: -20 °C to 60 °C (-4 °F – 140 °F)
  - Dimensions (H x W x D): 210.5 x 464.5 x 805.8 mm (8.3 x 18.3 x 31.7")
  - Weight Without Flight Case: 16.74 kg (36.83 lbs)
  - Weight With Flight Case: 29.90 kg (65.78 lbs)
  - Notable Features: Graviton Mk 2 Processing Engine; 64-bit summing engine; Flexi-Aux (aux to aux); Variable Channel Phase per channel; Tap Off Points (post-insert fader and customisable processing chains); Shout Mixer; 21" multi-gesture capacitive touchscreen; touring flight case included
