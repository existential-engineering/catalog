description: Focusrite Scarlett 16i16 is the 4th generation of industry-leading
  USB audio interfaces; including RedNet converters and two Focusrite mic
  preamps.
details: |-
  The compact, portable studio hub for artists and producers designed for recording vocals, guitars, keys, synths, and external gear.

  4th generation USB audio interface including RedNet converters and two Focusrite mic preamps. Two ultra-low-noise mic/line/instrument preamps with two Air modes: Presence and Presence + Harmonic Drive.

  Auto Gain and Clip Safe technologies, Alt speaker switching (A/B monitoring), loopback functionality, and remote control via Focusrite Control 2. Expandable I/O via ADAT and S/PDIF for up to 18 inputs and 18 outputs simultaneously.
specs: |-
  - A/D Resolution: 24-bit/192 kHz
  - Sample Rates: 44.1kHz to 192kHz
  - Microphone Preamp Gain: 69dB range
  - Dynamic Range (D-A): 122dB
  - Frequency Response (Mics): 20-20kHz ± 0.06dB
  - THD+N (Line Out): -112dB
  - Simultaneous I/O: 18 in x 18 out (with loopback)
  - Bus Powered: Yes (3A USB)
  - External Power: 15W optional
  - Dimensions: 220mm W x 60.5mm H x 155.2mm D
  - Weight: 1.25kg
  - 3-year manufacturer warranty
