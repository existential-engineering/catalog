description: Hand-built octave fuzz based on the Fox Tone Machine, using
  germanium diodes for the octave and 1960s 2N3565 transistors.
details: |-
  The Wolff Octave Fuzz is based on the vintage Fox Tone Machine. It combines germanium diodes for the octave stage with National Semiconductor 2N3565 transistors from the 1960s, producing an octave-up fuzz.

  Keeley describes the circuit as tweaked relative to the original to limit noise and to improve octave tracking with fewer of the intermodulation artefacts the original design produced. The page cites the sound's association with players including Peter Frampton, Adrian Belew and Trent Reznor as context for the voicing rather than as a feature of this pedal.

  Octave up is switchable, and the clipping can be switched between silicon and germanium diodes. The run was limited to 50 pieces, each built entirely by hand with through-hole components in Edmond, Oklahoma.
