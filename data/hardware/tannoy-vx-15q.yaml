description: The VX 15Q is a high-performance full-range loudspeaker cabinet
  delivering high SPL, low distortion audio coverage.
details: |-
  The VX 15Q is a high-performance full-range loudspeaker cabinet delivering high SPL, low distortion audio coverage. It provides a high-impact solution for medium-to-large scale sound reinforcement in high-SPL applications such as bars and clubs, as well as mid-scale portable/live PA applications. Its 15" PowerDual driver ensures high power output with high sensitivity and exceptional efficiency via a proprietary Q-Centric waveguide for precise 75° horizontal × 40° vertical dispersion. Configurable for bi-amp operation. Optimized for use with Lab Gruppen amplifiers or Lake LM Series controllers.
specs: |-
  - frequencyResponse: 70 Hz – 25 kHz (±3 dB); 58 Hz – 30 kHz (–10 dB)
  - nominalDispersion: 75° H × 40° V @ –6 dB points
  - directivityFactorQ: 12
  - directivityIndexDI: 10.8 dB
  - powerRatingPassive: 400 W continuous / 1,600 W peak
  - powerRatingBiampLF: 400 W continuous / 1,600 W peak
  - powerRatingBiampHF: 80 W continuous / 320 W peak
  - sensitivity: 99 dB (1 W @ 1 m)
  - impedancePassive: 8 Ω
  - impedanceBiampLF: 8 Ω
  - impedanceBiampHF: 8 Ω
  - crossoverType: Passive / Bi-amp switchable
  - driver: 1 × 15" (380 mm) constant directivity PowerDual
  - connectors: 2 × 4-pole industry-standard twist-lock speaker connectors; 1 × barrier strip terminals
  - dimensions: 591 × 451 × 421 mm (23.3 × 17.8 × 16.6")
  - weight: 25.4 kg (55.9 lbs)
  - cabinetConstruction: 18 mm (3/4") plywood, vented and internally braced
  - finish: Semi matt black paint (white optional)
  - grille: Powder coated perforated steel
  - flyingHardware: M10 × 8 flying inserts (portrait or landscape), M10 × 8 yoke bracket inserts, 2 × Integrip carrying handles, blanking plate for optional VTH pole mount, compatible with industry standard brackets (M6 × 4 inserts)
