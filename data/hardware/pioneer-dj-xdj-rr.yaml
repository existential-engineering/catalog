details: |-
  2-channel all-in-one DJ system

  Take your performances to the next level with the XDJ-RR all-in-one DJ system for rekordbox. This 2-channel DJ solution inherits design traits and essential features from our professional NXS2 multi player and mixer and packs it all into one lightweight, portable piece of kit. As a result, the XDJ-RR will help you become familiar with club-standard gear as you transition from DJing at home to commanding parties, bars, and soon, clubs. Use the rekordbox software to experiment with different DJ styles and discover your favourite. You can perform with music stored on USB drives, access your library through Link Export or use Performance mode via your laptop - the choice is yours. The 7-inch colour screen enables you to keep an eye on your beats as you put your own spin on tracks using dedicated Beat FX and Sound Color FX. Equipped with everything you need to create unique mixes on the fly, you'll be filling dancefloors in no time.
