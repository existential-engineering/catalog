  If you are willing to wait and are interested in a discount, please use pre-sale in the promo code. We hope to build and shiop these in 10 weeks (07/26)***

  CM47fet/CE

  The Advanced Audio CM47fet/CE came about because more than one of Dave's busy producer friends asked if we could retrofit the CM47fet with the AK47 capsule, to give it the more traditional, vintage sound of the U47fet but with the added OMNI feature. The Advanced Audio Custom Edition CM47fet provides a sonic response similar to the original U47fet. It has a smooth presence but sounds slightly warmer or "darker" than the CM47fet. Its become a favourite in front of the kick drum, on upright bass, trumpet, trombone, in front of guitar and bass amps where a warm but present sound is required. The CM47fet circuit is based on the extended headroom of the famous Neumann U47fet design. It features our AK47 capsule which is a true reproduction of the original K47 capsule made in the late 50's. The 2-stage Class "A" amplifier is coupled into a transformer balanced output. It also features a de-emphasis circuit that reduces sibilance but gives it the presence of a U47/U47fet with incredible smoothness. The CM47fet/CE has been optimized for close miking applications on loud sound sources so that it will not overload even economic transformerless preamplifiers. The CM47fet/CE also features passive "true" cardiod operation like the original U47/U48 and U47fet microphones. It can also be switched to OMNI operation for room miking duties or when the need to reduce any proximity effect is required.
specs: |-
  - 32mm 6-micron dual-diaphragm K47 type capsule
  - Class "A" fet 2 stage circuit with hf de-emphasis and extended headroom
  - 100Hz internal bass roll-off switch
  - Switched -10dB pad
  - Impedance: <200 ohm (load impedance <1.2K)
  - Frequency response 25hz to 20khz + or - 3db.
  - Noise: <16dB (A-weighted)
  - Distortion: 0.5% @ 131dB, 141db with -10db pad engaged.
  - 48V requirement
  - Robust shock-mount
  - Aluminum road case
