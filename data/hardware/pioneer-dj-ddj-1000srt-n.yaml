description: The Serato-compatible version of our popular DDJ-1000 is here –
  meet the DDJ-1000SRT. This 4-channel DJ controller for Serato DJ Pro is
  designed to feel just like our club-standard CDJ+DJM setup. You’ll enjoy
  low-latency, full-size jog wheels and a slick MAGVEL FADER for tight
  scratching. Build excitement on the dancefloor and create huge drops using 4
  Sound Color FX and 14 Beat FX. The DDJ-1000SRT comes with a free voucher for
  Pitch ‘n Time DJ, enabling you to get creative with advanced key-related
  features. With multiple inputs and outputs, you can enhance your setup by
  connecting external equipment like CDJs, the DDJ-XP1 , or turntables. This
  Serato DJ Pro controller will take your gigs to the next level. --> The
  limited-edition DDJ-1000SRT-N is only available at specific retail stores in
  Asia Pacific, the Americas and Latin Americas – not available in Japan, China
  and EMEA regions.
details: |-
