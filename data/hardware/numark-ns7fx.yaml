description: NS7FX Motorized DJ-Software Performance Controller.
details: |-
  Designed by Numark in collaboration with Serato, NS7FX represents the pinnacle of digital DJ performance. NS7FX combines a premium mixer with two motorized, adjustable-torque turntables, real vinyl, and a professional audio interface to deliver a complete performance solution that will satisfy the most hardcore turntablist. NS7FX also includes powerful effects controls for hands-on manipulation of the wide range of effects built into the included Serato ITCH software.

  A full complement of premium faders, knobs, buttons, and our new Strip Search virtual needle-drop control integrates seamlessly with ITCH. NS7FX exchanges turntable and control information with your Mac or PC at more than ten times standard MIDI resolution, resulting in a rock-solid hardware/software system that feels and as good as it looks.

  NS7FX has onboard audio outputs so it's the only piece of gear you need to connect to the PA system or powered speakers. NS7FX outputs 24-bit, 44.1 kHz digital audio to the sound system on XLRs and RCAs. The front panel contains mic input, RCA line input, and both 1/4" and 1/8" headphone outputs with volume control.

  NS7FX sends control information over USB at more than ten times the standard MIDI rate. This innovative communication technique yields extremely high-precision, low-latency control.

  We took extraordinary care in selecting the components of the audio signal chain. NS7FX contains a host of professional audio connectors and a multichannel, 24-bit USB digital-audio interface. The high-definition post-mix analog audio output features a minimized circuit path with containing only one audiophile-grade bipolar capacitor. This optimized design maximizes phase coherence, ensuring that audio is tight and punchy.
specs: |-
  - High-resolution digital DJ controller with effects, built for Serato ITCH and compatible with Scratch LIVE libraries
  - Direct-drive, motorized turntable platters with classic and modern feel settings
  - Activate and control the effects in Serato ITCH
  - Includes Serato ITCH DJ software—now with video mixing capability (Requires Serato video plug-in)
  - Built-in audio with audiophile-grade circuitry, 24-bit interface
  - Extensive loop, cue, and track-access controls
  - Strip Search virtual-needle drop control
  - Controls most MIDI applications without requiring a mouse or keyboard
  - Rugged, all-metal construction
  - Integrated laptop stand
  - Fits in NS7 CASE for protection in transit to the gig
  - High quality, replaceable, adjustable CP-PRO crossfader and D-TYPE line faders
  - Support for Whitelabel.net files in ITCH
  - Mix using either 33rpm or 45rpm speeds
  - Also works with VirtualDJ Pro and Torq (each sold separately)
  - Sample Rate: 44.1 kHz
  - Bit Depth: 24-bit
  - SNR (Balanced XLR Master): > 98 dB (A-weighted)
  - SNR (Unbalanced RCA Master and Booth): > 98 dB (A-weighted)
  - SNR (Headphone 1/4" and 1/8"): > 93 dB (A-weighted)
  - THD+N (all outputs): < 0.01% (A-weighted)
  - Maximum Output (Balanced XLR Master): +26.3 dBu into > 1kO
  - Maximum Output (Unbalanced RCA Master and Booth): +14.25 dBu into > 1kO
  - Maximum Output (Headphone 1/4" and 1/8"): +19 dBu into > 32O
  - Frequency Response: 22 Hz – 22 kHz (+0/-0.5 dB)
  - Dimensions (W x D x H): 30 x 15 7/8 x 3 7/8 in (762 x 403.2 x 98.4 mm)
  - Weight: 35.5 lbs (16.1 kg)
