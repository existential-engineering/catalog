details: |-
  Built on the classic combination of a solid Spruce top and Rosewood back and sides, the Fusion 12 Rose II brings a fresh aesthetic to Córdoba's popular Fusion 12 series. Featuring an Exotic Top, this innovative approach pairs the striking beauty of exotic woods with the tonal character of Spruce. By applying a thin, real wood veneer to a solid Spruce top, Córdoba's Exotic Top design allows players to choose a unique look without sacrificing that quintessential solid Spruce tone. The Fusion 12 Rose II offers a refined, modern take on traditional nylon-string design, while the pairing of Spruce and Rosewood delivers a balanced voice with crisp, articulate highs and rich, resonant lows.
