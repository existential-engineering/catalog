description: Tube-driven large-diaphragm condenser microphone with variable
  polar pattern, a 6072A tube, custom Cinemag transformer, and boutique
  capacitors — delivering vintage warmth for vocals, percussion, piano, brass,
  winds, and guitar cabinets.
details: |-
  The BV-1 mkII is built around a select low-noise Russian 6072A tube and a
  custom dual-sided 34mm edge-terminated gold-sputtered Mylar capsule (6
  micron), offering variable polar pattern selection from Figure 8 through
  Cardioid to Omni. The output transformer is a custom Cinemag design, and the
  signal path features capacitors sourced from six boutique manufacturers:
  Solen, Nichicon, Wima, Elna, Kyocera, and Epcos.

  The microphone includes a 7-pin male XLR output connector, an 80 Hz
  high-pass filter switch (6dB/octave), and a -10dB attenuation pad switch.
  Power is supplied via an included external power supply (90Vac–220Vac
  universal).

  The BV-1 mkII ships with a padded wooden mic box, shockmount, road case,
  custom Sommer 7-pin cable, and pop filter.
specs: |-
  - Tube Type: Select Low-Noise Russian 6072A
  - Polar Pattern: Variable Figure 8 through Cardioid to Omni
  - Capsule: Custom dual-sided 34mm edge-terminated gold-sputtered Mylar
    (6 micron)
  - Frequency Response: 25Hz–20kHz
  - Output Impedance: <200 Ohms (transformer isolated)
  - Sensitivity: -35dBV
  - S/N Ratio: 78dB (Ref. 1Pa A-weighted)
  - Noise Floor: <17 dBA
  - Maximum SPL: 134dB (0.5% THD @ 1kHz); 144dB with pad
  - Output Connector: Male XLR 7-pin
  - High-Pass Switch: 80 Hz, 6dB/octave
  - Attenuation Switch: -10dB
  - Power Requirement: 90Vac–220Vac (external PSU included)
