url: https://ashdownmusic.com/products/rm-c210-420
description: Powered by a 420W digital amp, the RM C210-420 is ideal for players
  who favour a tight, defined sound, delivering its power via a pair of 10 inch
  custom drivers supplemented by a high-frequency piezo for increased top-end
  bite and articulation.
details: |-
  The RM C210-420 is a 420W bass combo built for a tight, defined sound, delivering its power via a pair of custom 10 inch drivers supplemented by a high-frequency piezo. It starts with an ultra-low-noise instrument input and Input Level control, five-band rotary tone controls and a Shape switch that dials in a classic ABM-derived tone. A one-knob compressor adds warmth and body, a footswitchable tube-emulated overdrive pushes the tone from warm grind to distorted filth, and the Sub-Harmonic Generator adds a footswitchable sub-octave. Send and return sockets on the back panel patch in pedals or multi-effects, a DI output feeds a PA mixer or recording console, and a front-panel line input lets you jam along with a backing track.
specs: |-
  - Power Output: 420 Watts
  - Power Requirement: 230V
  - Speaker Configuration: 2 x 10 inch + HF piezo
  - Speaker Outputs: 2 x Jack sockets
  - Frequency Response: -3dB @ 17Hz and 30kHz
  - High Instrument Input: Impedance 3.9M Ohms, input range 150mV - 20mV p-p
  - Low Instrument Input: Impedance 10k Ohms, input range 300mV - 40V p-p
  - Line Input: Impedance 10k Ohms, Level 0dBu nominal
  - DI Output: 600 Ohm balanced, Level -20dBu nominal
  - Tuner Output: Impedance 22k Ohm, Level 0dBu nominal
  - Impedance: 8 Ohm
  - Output Impedance: Minimum 4 Ohm
  - Signal to Noise: Better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz
  - Effects Send: Impedance 22k Ohm, Level 0dBu nominal
  - Effects Return: Impedance 22k Ohm, Level 0dBu nominal
  - Distortion: Less than 0.5% THD
  - H x W x D: 603 x 468 x 335 mm
  - Weight: 27 kg
