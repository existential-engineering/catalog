details: |-
  This edition marked Keeley's sixteenth year modifying and designing pedals and was sold through the Keeley US direct market only. The underlying circuit was the third Robert Keeley modified, in 2001, after the ROSS Compressor and the Tube Screamer, and it carries many layers of tube amp simulation.

  The anniversary change is a small gain germanium amplifier placed immediately after the tone stack, simulating a tube power amp section run very hot. The result is a more aggressively voiced overdrive with the spongy compression that germanium transistors give. It is hand built with through-hole parts, and the badge carries sixteen gold bars and a germanium transistor marking; the first 100 were hand signed. The transistor used is the Tungsram AC125, chosen late in development after the enclosure graphics had already been printed.

  The Super Phat Mod platform underneath is Keeley's Phat Mod modification perfected with JFETs that emulate old tube amps. It uses tube-like amp stages, tube amp tone stacks and tone shaping circuits intended to suit any guitar's pickups, and the phrase transparent overdrive came out of this design. It is full range and very responsive, suiting players who prefer pick attack and guitar volume to do the work rather than the more refined sound of a common screamer, and it is true bypass.

  The lineage runs back to the Keeley BD-2, the first mod to carry a switch for two modes of bass response, the boosted setting being Phat mode. That switch survives as the micro toggle on the Super Phat Mod, which otherwise duplicates the Keeley Phat Mod part for part apart from the JFETs.
