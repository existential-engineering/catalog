description: The Ashdown NFR-1 is an active near-field monitor designed
  exclusively for music recording and production in home and project studios. A
  compact professional wideband low-distortion monitor for low-volume critical
  assessment of recorded material, sold in pairs.
details: |-
  In a year-long R&D project Ashdown researched every aspect of monitor design in developing the NFR-1, an active near-field monitor designed exclusively for music recording and production in home and project studios. It provides a full frequency response in small to medium control rooms and gives particular attention to the vocal area in respect of colouration and distortion, with a response similar to the famous BBC LS3/5 broadcast monitor but with enhanced bass and treble extension. Sealed construction means correct room placement is not critical. Twin power amplifiers rated at 100 watts each drive the speaker drivers, crossovers split the signal, acoustic centre compensation eliminates the crossover suck-out, a sub-sonic filter helps prevent cone damage, and an optical low-distortion compressor reduces the signal sent to the woofers in the case of accidental overdrive. Construction features void-free 11-lamination birch plywood, corner-lock joints, 17dB wool-felt cabinet damping and 100% long-fibre wool stuffing.
specs: |-
  - Configuration: Active near-field monitor, sold as a pair
  - Amplification: Twin power amplifiers, 100 watts each
  - Construction: Sealed, void-free 11-lamination birch plywood
  - Room size: Largest dimension 12-14ft (small) to 14-20ft (medium)
  - Features: Acoustic centre compensation, sub-sonic filter, optical low-distortion compressor
