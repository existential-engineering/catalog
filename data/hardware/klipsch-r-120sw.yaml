description: The Klipsch R-120SW is a 12" front-firing spun-copper IMG subwoofer
  powered by a 400-watt all-digital amplifier. It delivers deep, clean bass for
  home theater and music listening, with gain, crossover, and phase controls for
  room integration.
details: |-
  The R-120SW features Klipsch's spun-copper Injection Molded Graphite (IMG) woofer, which is exceptionally light while being extremely rigid, resulting in minimal cone breakup and distortion across the low-frequency range.

  The all-digital 400-watt amplifier delivers maximum output, detail, and power, ensuring tight, accurate bass reproduction whether used for home theater or two-channel music playback.

  The reinforced MDF cabinet construction reduces unwanted vibration and acoustic coloration. Onboard controls — volume, low-pass crossover frequency, and phase — allow the subwoofer to blend seamlessly with any speaker system and room placement. A low-profile magnetic grille completes the clean, modern aesthetic.
