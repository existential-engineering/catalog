details: |-
  Product Overview:

  The Prussian Blue Reverb Revival is a limited edition pedal commemorating the 15th anniversary of One Control. It reissues the original design of the acclaimed Prussian Blue Reverb, developed by legendary designer Bjorn Juhl. This pedal was created to offer the most natural and expressive reverb tone possible, specifically tailored for guitar and bass. What Is the Prussian Blue Reverb? Reverb is the gentle echo produced when sound travels through space. Every instrument, whether electric, acoustic, or electronic creates this natural effect before sound reaches our ears. The Prussian Blue Reverb is designed to replicate this ideal echo with clarity, subtlety, and spatial depth. Unlike traditional reverb types like spring, hall, or room, the Prussian Blue Reverb creates a balanced tone that combines the best elements of each. It delivers a sound that feels alive, three-dimensional, and naturally integrated with your playing. Rather than imitating classic reverb units, this pedal uses a custom algorithm designed by BJF to respond directly to guitar and bass performance. It avoids harshness and artificial coloration, allowing the instrument's character to shine through. Key Features:

  Reverb pedal with an original design by Bjorn Juhl

  Deep, natural, three-dimensional spatial diffusion

  Precisely tuned DECAY control that blends naturally with your playing

  KILL DRY switch for use in parallel effect loops

  Twenty-four-bit high-quality digital reverb processing

  Analog dry-through circuit for pure signal path

  Compact, durable aluminum mini enclosure

  Battery or external power supply compatible

  Controls:

  LEVEL: adjusts the volume of the reverb effect

  TONE: adjusts the brightness of the reverb

  DECAY: controls the duration of the reverb from two milliseconds to two seconds

  KILL DRY: mutes the dry signal for parallel routing or creative effects

  The DECAY control is specially designed to shape the reverb's presence without interfering with the rhythmic clarity of your performance. This makes it ideal for both subtle ambience and long, immersive trails. Sound Design and Technology:

  The Prussian Blue Reverb's algorithm uses random modulation to replicate the natural decay and diffusion of string instruments. This method creates a reverb that feels spacious, musical, and lifelike without sounding artificial or distracting. The early reflections are short, ensuring the reverb responds quickly to your playing while maintaining a natural decay. This results in an immersive experience that expands the sound without overwhelming it. Its wide dynamic range, about five times greater than traditional spring reverbs, ensures clarity across all frequencies, especially on bass instruments. Filtering prevents excessive treble or muddiness, keeping your tone open and clear. Technical Specifications:

  Input impedance: 500 K ohms

  Output impedance: 2 K ohms

  Operating voltage: 8 - 12 volts

  Current consumption: 32 milliamps

  Signal to noise ratio: -96 decibels

  Dimensions without protrusions (W x D x H) : 39 mm x 100 mm x 31 mm

  Dimensions with protrusions (W x D x H) : 47 mm x 100 mm x 48 mm

  Weight: approximately 160 grams (200 grams when the battery is inserted)

  True bypass switching

  Power options: 9V center minus adapter or 9V battery

  Controls: LEVEL, TONE, DECAY, KILL DRY

  *Adapter and Battery not included

  Power-On Note

  Upon powering the unit, allow a few seconds for the internal digital chip to stabilize. During this time, the sound may not be stable. For best performance, wait a few moments in bypass mode after connecting the adapter or battery. Recommended Useage:

  The Prussian Blue Reverb was designed specifically for guitar and bass, but it also works beautifully with acoustic instruments and electronic setups. It is particularly effective when placed after distortion effects and before modulation like tremolo. Its ability to stay on at all times makes it a versatile part of any signal chain, from subtle ambiance to spacious soundscapes. Final Thoughts from the Designer:

  When developing the reverb effect, I focused on the type of reverb guitarists actually want. In many cases, players desire a tone that lies somewhere between spring and hall reverb, rich but not overpowering, ambient but clear. That is why I created an accurate DECAY control that can be adjusted to avoid interfering with rhythm, while still providing depth and texture. I had high hopes, but even I was surprised when I first heard the final sound of the Prussian Blue Reverb. It feels like there is a vast space hidden inside this small pedal. Because it is built specifically for guitars and basses, it suits not only electric instruments but acoustic ones as well. One of my favorite setups is running the PBR after distortion and before tremolo because it sounds absolutely incredible. ─── Bjorn Juhl

