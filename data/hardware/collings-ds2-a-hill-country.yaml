description: The DS2 A Hill Country is a 12-fret dreadnought acoustic guitar
  built with Hill Country voicing — a construction approach that pushes the
  instrument toward a warm, woody tonal character with a strong fundamental and
  full low end. It features an Adirondack spruce top over East Indian rosewood
  back and sides, with a Hill Country scalloped X-brace pattern designed for
  bluegrass and beyond. Cosmetic appointments include ivoroid body binding, a
  zipper backstrip, gold MOP long diamond & squares inlays, and a 2-style
  rosette.
details: |-
  The Hill Country series represents Collings' exploration of acoustic guitars pushed to the far end of the tonal spectrum — emphasizing a dry character, strong fundamental voice, and full low end. The DS2 A Hill Country pairs an Adirondack spruce top with East Indian rosewood back and sides. The Hill Country scalloped X-brace pattern works in concert with a 12-fret neck joint and 25 1/2" scale length to deliver the low-end punch and warmth the series is known for. Appointments follow the 2-style tradition: ivoroid body binding, a zipper backstrip, diamonds and squares fingerboard inlays in gold MOP, and a 2-style rosette. The ebony belly-style bridge and fingerboard add tonal clarity and long-term durability. Finished in high-gloss ultra-thin nitrocellulose lacquer.
specs: |-
  - Top: Adirondack spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: Gold MOP long diamond & squares
  - Bridge: Ebony belly-style
  - Bridge Spacing: 2 5/16"
  - Scale Length: 25 1/2"
  - Brace Pattern: Hill Country scalloped X-brace
  - Binding: Ivoroid body binding
  - Backstrip: Zipper
  - Rosette: 2-style
  - Finish: High gloss ultra-thin nitrocellulose lacquer
  - Tuners: Relic Nickel Waverly
  - Body Width: 15 5/8"
  - Body Length: 20 7/8"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/8"
  - Strings: D'Addario EJ-17 (.013"-.056")
