details: |-
  4-channel DJ controller for multiple DJ applications. The fresh design of the DDJ-FLX6-GT introduces a new look and feel for its full-size jog wheels, which feature a graphite color plus a metallic texture on top and a rubberized coating on the outer ring for improved playability. The new unit adds support for VirtualDJ (license available separately), and retains free compatibility with rekordbox and Serato DJ Pro. TRAKTOR PRO 3 is available to use by downloading its mapping files. Key features: Updated design with a graphite color brings a sophisticated look; Support for VirtualDJ; All-new Merge FX; Jog Cutter: Create pro-sounding scratch effects, one-handed; Full-size jog wheels with track position display; Sample Scratch: Get creative with your favorite sounds.
