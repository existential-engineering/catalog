description: The MG15GR is a compact 15W solid-state guitar combo from
  Marshall's entry-level MG range, designed for home practice, band rehearsals,
  and recording. It offers two channels (clean and overdrive) that can be
  switched at the front panel to move between sparkling cleans and crunchy
  overdriven tones, plus a fully adjustable spring-style reverb for adding
  ambience. An MP3/line input lets players jam along with backing tracks from a
  phone or audio device, while an emulated speaker output sends a
  speaker-modeled signal straight to a recording interface or headphones for
  silent practice. Finished in Marshall's classic black-and-gold cosmetic, it is
  built around a single internal speaker driven by the 15W solid-state power
  stage.
