description: The MG15GR is a compact 15W solid-state guitar combo from Marshall's entry-level MG range, designed for home practice, band rehearsals, and recording. It offers two channels (clean and overdrive) that can be switched at the front panel to move between sparkling cleans and crunchy overdriven tones, plus a fully adjustable spring-style reverb for adding ambience. An MP3/line input lets players jam along with backing tracks from a phone or audio device, while an emulated speaker output sends a speaker-modeled signal straight to a recording interface or headphones for silent practice. Finished in Marshall's classic black-and-gold cosmetic, it is built around a single internal speaker driven by the 15W solid-state power stage.
details: |-
  The MG15GR Combo comes complete with all the features you could need from a practice amp, including fully adjustable reverb that can be used on both the clean and overdrive channels.

  Fitted with an emulated headphone output to make silent practice easier than ever, the MG15GR Combo is the ideal amp for playing at home. The MG15R's emulated speaker output simplifies recording directly from the amplifier while also being a perfect fit for silent practice sessions. The addition of the MP3/line input also gives you the chance to jam along with your favourite songs.

  Play the tones you want and never miss a beat. The dual channels on the MG15R allow you to quickly switch between channels during rehearsals, so you can experiment with different tones without interrupting your flow.

  This compact amplifier showcases remarkable adaptability, suitable for both home and on-the-go scenarios. It boasts a compact structure that makes it effortlessly transportable, ready to accompany you during band practice sessions, no matter where.

  Designed and engineered in UK. Made in Vietnam.
