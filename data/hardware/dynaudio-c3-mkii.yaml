details: |-
  A high-quality reference system for small- to medium-sized music studio applications, and for film and television post-production.

  The C3 MkII features the same high-quality components as the flagship M4 system: a 30cm MSP driver with 100mm ferrofluid-cooled voice coil for bass, a 17cm MSP driver with 75mm ferrofluid-cooled voice coil for midrange, and the legendary Esotar 3 soft-dome tweeter.

  When combined with subwoofers and surround speakers, the C3 MkII forms an excellent system for immersive monitoring, including Dolby Atmos HE 7.1.4 and 9.1.4.

  A horizontal version is available using twin 24cm bass drivers, and optional hardwood cabinets are offered in oak, cherry, walnut, and maple. Custom cabinet sizes are available on request.
specs: |-
  - Type: 3-way hybrid monitor
  - Frequency response: 35Hz – 20kHz
  - Maximum SPL at 2 metres: 120dB stereo
  - Crossover frequencies: 200Hz and 3000Hz
  - Total harmonic distortion: 1% at 90dB
  - High frequency driver: Esotar 3 soft-dome tweeter
  - Midrange driver: 17cm MSP
  - Low frequency driver: 30cm MSP
  - Recommended amplifier power: 250-500W per channel per speaker
  - Amplifier recommendation: DA40 DSP, DCA800 (with filters)
  - Cabinet dimensions (H x W x D): 875 x 440 x 395mm
  - Weight: 40 kg
  - Finish: Black textured paint
  - Optional hardwood cabinets: oak, cherry, walnut, maple
