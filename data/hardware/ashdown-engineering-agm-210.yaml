description: 'For vintage tonality, clarity and definition, the AGM-210 is a
  semi-open-back 2x10" guitar cabinet from Ashdown''s Guitar Magnifier range,
  fitted with a pair of Jensen P10R speakers. The P10R is an important part of
  Jensen history: its shimmering yet throaty and vibrant tone is a signature of
  the Tweed era, contributing to the sound of the 4x10 Bassman, 4x10 Super and
  3x10 Bandmaster amps. Built from premium ply with metal corners and a leather
  handle, it is rated at 16 ohms.'
details: |-
  For true vintage tonality, clarity and definition the AGM 210 cabinet is semi open back and features a pair of Jensen P10R speakers. The P10R is very important in the history of Jensen speakers. Its shimmering, yet throaty and vibrant tone is one of the signatures of the Tweed era and inspired the start-up of the British tones. It was the first speaker reissued by Jensen, presented to a restricted panel of partners at the 1999 Summer NAMM show. The P10R is the speaker that contributed to the magical tone of the 4x10 Bassman Tweed amps, the 4x10 Super Tweed Amps and the equally mythical 3x10 Bandmaster amps. Ashdown Guitar Magnifier 2 x 10 Cabinet.
