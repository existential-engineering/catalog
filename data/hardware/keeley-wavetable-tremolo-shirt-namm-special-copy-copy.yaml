description: Dynamic tremolo pedal whose rate or depth responds to playing
  strength, with a harmonic tremolo mode that adds reverb.
details: |-
  The DynaTrem Dynamic Tremolo is a tremolo pedal that responds to playing dynamics: picking strength drives either the rate or the depth of the modulation, so the effect intensifies with harder playing and relaxes when played softly. Sensitivity is set with the Rate or Depth controls.

  Three modes are provided. Dynamic Rate ties modulation speed to playing strength, Dynamic Depth ties modulation depth to it, and Harmonic Tremolo mode produces the phase-split, filtered tremolo voicing associated with vintage tube amplifiers while repurposing the Shape control as a reverb level.

  In the wave table modes the Shape control selects between four waveforms: ramp up, sine, ramp down and square. Units after serial number 300 add a fourth mode, a standard triangle wave tremolo, reached by turning the Shape knob fully down while in the Delta Rate or Delta Depth modes. Keeley offers an upgrade for earlier units that lack it.

  Other features include integrated noise reduction aimed at the noise swells common to tremolo circuits, an output volume control that can be set above unity for a boost, and true bypass. The enclosure artwork is styled after a vintage tube amplifier or radio.
