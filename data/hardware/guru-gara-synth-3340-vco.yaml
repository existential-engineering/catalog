details: |-
  3340 VCO (Voltage Controlled Oscillator)

  The 3340 VCO is a 10HP skiff-friendly (25mm depth) Eurorack PCB and Front Panel Kit. This CEM3340/AS3340-based analog oscillator is designed for intermediate builders and can be fully calibrated using only a chromatic tuner. This version of the kit includes the PCB and front panel only, allowing builders to source their own AS3340 IC and other necessary components. Technical Specifications

  Key Features

  Modulation & Sound Design

  The 3340 VCO offers a wide sonic range, from aggressive, harmonically rich tones to smooth and stable waveforms. With multiple sync options, linear FM, and precise pitch control, this Eurorack VCO design is well suited for complex modulation and expressive patching within modular synth systems. DIY Build & Front Panel

  This DIY Eurorack VCO PCB and front panel kit is intended for intermediate to experienced builders. The PCB is clearly labeled to assist with assembly and troubleshooting. The included front panel is made from durable PCB material and screen printed by hand, providing a distinctive and professional appearance for your finished module. Need help with tuning and setup? Read the 3340 VCO Calibration Guide for step-by-step calibration instructions and tracking tips. (Note: Electronic components/ICs are not included.)

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo

  Calibration
specs: |-
  - Format: Eurorack
  - Core IC: CEM3340 / AS3340 (High-accuracy VCO)
  - Width: 10HP
  - Depth: 25mm (Skiff-friendly)
  - Skill Level: Intermediate / Expert (Focus on precision calibration)
  - Calibration Tools: Chromatic Tuner (Standard guitar tuner or phone app is sufficient). No multimeter or oscilloscope required.
  - Current Draw (+12V): 15mA
  - Current Draw (-12V): 15mA
  - PCB: Professional-grade FR4; high-contrast silk-screen
  - Panel: 1.6mm Black FR4; hand-applied orange and white graphics
  - Eurorack PCB and front panel kit only
  - Supports Square, Triangle, Ramp, and Sine waveform outputs
  - Hard Sync and Soft Sync inputs
  - Linear Frequency Modulation and accurate 1V/octave tracking
  - External CV control for pulse width modulation (PWM) (0 to +5V)
  - 10HP Eurorack format
