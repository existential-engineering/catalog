description: Discover the M 50 V, a faithful reissue of the legendary M 50 with
  enhanced detail improvements, perfect for immersive and stereo recordings.
details: |-
  Perfect for spaced omni and Decca Tree technique

  Unique omnidirectional capsule mounted in a 40 mm sphere

  Classic tube circuit with output transformer

  Meticulously reproduced to original specifications

  Faithful reissue of the legendary M 50 according to original specifications

  Documentation sourced from the Neumann archive

  Becomes gradually more directional at high frequencies

  Outstanding transient response
specs: |-
  - Acoustical Operating Principle: Pressure transducer
  - Directional Pattern: Omni
  - Frequency Range: 20 Hz - 16 kHz
  - Sensitivity: 19 mV/Pa ≅ -34.5 dBV ± 1 dB at 1 kHz into 1 kohm
  - Rated Impedance: 200 ohms
  - Rated Load Impedance: 1000 ohms
  - Signal To Noise Ratio A Weighted: 79 dB
  - Equivalent Noise Level A Weighted: 15 dB-A
  - Maximum SPL THD05: 118 dB SPL
  - Signal To Noise Ratio CCIR: 67 dB
  - Equivalent Noise Level CCIR: 27 dB
  - Maximum Output Voltage: -8 dBu
  - Power Supply: NM V
  - Matching Connector: Microphone: KC 5 cable (7-pin), Power Supply: XLR 3 F
  - Weight: 800 g
  - Diameter: 80 mm
  - Length: 163 mm
