details: |-
  The SE McCarty 594 is a versatile, vintage-inspired instrument that delivers both humbucking and single-coil tones in a reliable, roadworthy guitar. Thanks to its dual volumeand push/pull tone controls, the SE McCarty 594 can seamlessly master humbucking andsingle coil sonic territories, so players can find all the tones they are looking for.

  Its 58/15 LT “S” pickups were carefully designed to deliver warm, vintage-inspired tonewith sweetness and clarity. The zinc two-piece bridge and vintage-style tuners anchorthe SE McCarty 594 and stay true to its vintage promise, while the classic PRS bodyshape and bird inlays add a hint of modern style to this classic feature set. Other featuresinclude a bound 22-fret Pattern Vintage neck and slightly thicker back for sustain.

  Designed to capture the heart of the McCarty family of instruments, the SE McCarty 594is high-quality workhorse instrument.
