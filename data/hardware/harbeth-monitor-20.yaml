details: |-
  Widely used since its introduction in 1990 as the replacement for the LS3/5a in pro-audio sound, AV digital workstations and OB trucks, the Monitor 20.1 offers a remarkably full scale sound that belies its extremely compact dimensions, still only the size of a shoe box.

  This two-way sealed box design has a skillfully designed bass response and an even, natural sound across the entire audio band. The incredible bass performance combined with the natural sound and excellent stereo imaging guarantees that wherever space is at a premium and audio accuracy is needed, the Monitor 20.1 is the perfect solution. In near or mid-field use, the M20.1 is just the best mini monitor.
specs: |-
  - Technical features: 110mm Harbeth RADIAL2 bass/mid, 19mm ferrofluid-cooled tweeter
  - Two-way sealed box design
  - Frequency response: 75Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms, easy to drive
  - Sensitivity: 83dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 15W/channel
  - Power handling: 50W programme
  - Dimensions: 306 x 190 x 184 mm (+12mm for grille and binding posts)
  - Connectors: two 4mm Harbeth branded binding posts, Speakon socket to order
  - Space needs: ideally more than 0.30m from rear wall
  - Stands: optimally to bring ears level with tweeters (tweeter 230mm up from cabinet base)
  - Packing: pair per protective carton
  - Grille colour: black
