details: |-
  The Pro-Mod DK24 HSS 2PT CM Ash is a Dinky-shaped electric guitar built around a resonant ash body finished in Red Ash with a satin finish. A sculpted shredder's cut heel and scalloped lower back bout work together to deliver comfortable, unencumbered upper fret access.

  The bolt-on caramelized maple neck is graphite-reinforced and shaped to a Speed Neck profile with rolled fingerboard edges and a satin finish for fast, friction-free play. A heel-mount truss rod adjustment wheel allows neck-relief tweaks without removing the neck.

  The caramelized maple fingerboard carries a 12"-16" compound radius, 24 jumbo frets, 4mm pearloid dot inlays and Luminlay side dots. A Graph Tech TUSQ XL nut sits 1.6875" wide at the headstock end of the 25.5" scale.

  Electronics are a versatile HSS layout: a Seymour Duncan Custom Full Shred TB-10 humbucker at the bridge plus Custom Seymour Duncan Flat Strat SSL-6 single-coils in the middle and neck (RWRP at the neck), all in flat parchment. A 5-position blade switch, no-load tone control and 500K EVH Bourns low-friction volume potentiometer cover everything from sparkly single-coil to thick humbucker tones.

  Hardware includes a Gotoh Custom 510 tremolo bridge with Gotoh arm, Charvel-branded die-cast locking tuners and chrome appointments. The guitar ships strung with .009-.042 nickel-plated steel strings; an optional hardshell case or gig bag is sold separately.
