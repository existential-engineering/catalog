description: The SC307 is an active 3-way midfield studio monitor from EVE
  Audio, with two 6,5" SilverCone woofers and the AMT RS2 tweeter, each driver
  fed by its own amplifier. It suits near and midfield monitoring and works as a
  center channel in surround setups.
details: |-
  The SC307 is a powerful monitor suited to both near and midfield monitoring, and in surround setups it also works as a center channel. The midfield monitor combines the power of three different amplifiers to deliver efficient, dynamic and low noise sound reproduction. EVE Audio develops its three-way systems for critical and detailed listening, so they provide plenty of power and deep bass frequencies while still reading as a precise and very detailed pair of speakers.

  In these three-way systems each driver, woofer or tweeter, gets its own amplifier. One of the woofers serves frequencies up to 300 Hz as a kind of bass driver, while the other covers a fuller range as a bass-midrange driver up to the crossover point, from where the AMT tweeter takes over. Dividing the band between both woofers minimizes interference between the drivers and leaves less effective physical work for each one, which results in less mechanical inertia and more efficient sound transmission.

  Both woofers use the proprietary 6,5" SilverCone also found in the two-way SC207, with the maker's low distortion copper cap magnet system. Because two of these woofers are used simultaneously, the frequency response reaches down to 40 Hz. The SC307 also uses the proprietary AMT RS2 tweeter, which has a bigger front plate and a bigger internal magnet to drive the Air Motion Transformer with greater efficiency.

  Three PWM power amplifiers drive the system, for 250 W of output power per speaker, and the stated maximum sound pressure level is 114 dB. The DSP section assists in choosing the speaker for the left and right hand side, so the pair keeps proper symmetry instead of having to be moved around, and a DIP switch on the rear of the speaker can temporarily lock the room adaptation settings. As with every other EVE Audio speaker, both balanced XLR inputs and unbalanced RCA inputs are provided.

  Room adaptation filters and volume are set from the front SMART-knob, a rotary encoder with an LED ring that displays the selected value, and the high-resolution DSP is fed by a high-quality A/D converter. The high-shelf, desk and low-shelf filters adjust in 0.5 dB increments, the LED ring brightness is adjustable, and settings can be locked so they are not changed by accident.
specs: |-
  - Frequency range: 40 Hz - 21 kHz
  - Woofer size: 6,5"
  - Max. SPL: 114 dB
  - Configuration: active 3-way midfield studio monitor
  - Frequency range measured at -3 dB at 1 m distance
  - Sound pressure level: 114 dB max. SPL per pair
  - Output power: 250 W per speaker
  - Tweeter: AMT RS2
  - Output power tweeter: 50 W
  - Mid-driver: 6,5"
  - Output power mid-driver: 100 W
  - Woofer: 6,5"
  - Output power woofer: 100 W
  - Passive radiator: 6,5" diameter
  - Cross-over frequency: 300 & 2800 Hz
  - Protection limiter: Yes
  - Volume range: minus infinity to +6 dB
  - High-shelf filter: -5 dB to +3 dB above 3 kHz
  - Desk filter cut: -5 dB to 0 dB at 160 Hz
  - Desk filter boost: 0 dB to +3 dB at 80 Hz
  - Low-shelf filter: -5 dB to +3 dB below 300 Hz
  - Phase inversion: 0 degrees / 180 degrees
  - Input impedance: 10 kOhm
  - Power consumption: less than 1 W standby, 350 VA maximum
  - Dimensions: 500 x 215 x 310 mm (19.7 x 8.5 x 12.2 inches, WxHxD)
  - Weight: 12.4 kg (27.3 lb)
