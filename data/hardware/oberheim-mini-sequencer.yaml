details: |-
  The Mini Sequencer is a straightforward 8-step sequencer designed to control Oberheim synthesizers using CV/Gate. Released in 1979, it was purpose-built for use with the classic Oberheim Two Voice, Four Voice, and Eight Voice synthesizers.

  Outside of the Oberheim ecosystem, the sequencer has limited appeal and is considered more of a novelty than a serious production tool by modern standards. Its primary uses include creating simple step patterns or loops, arpeggiation, and sample-and-hold effects.

  There is no MIDI available on the unit. The control voltage and gate trigger system uses the V/Oct standard, which is compatible with Roland, ARP, Sequential, and Moog synthesizers that also use CV/Gate for external control. To integrate the Mini Sequencer with MIDI synthesizers and sequencers, a separate MIDI-to-CV/Gate converter is required.
specs: |-
  - Sequencer: 8 steps
  - Control: CV/Gate (V/Oct standard)
  - MIDI: None
  - Keyboard: None
