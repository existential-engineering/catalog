description: The BAE 1084 is an authentic reproduction of the original vintage
  Neve equalizer, featuring identical St Ives (Carnhill) transformers, Elma
  switches, and Canford wire. It can retrofit into vintage Neve 80 Series
  consoles with identical chassis construction, connectors, PCB layouts,
  hand-wired looms, and circuitry.
details: |-
  The BAE 1084 is a faithful reproduction of the classic vintage Neve 1084 equalizer/preamp module, hand-built to the same exacting standards as the original 1970s hardware. Every component is chosen to match the vintage philosophy: St Ives (Carnhill) transformers, Elma rotary switches, and Canford wire are used throughout.

  The unit features a four-band equalizer with high-frequency and low-frequency shelving, a sweepable mid-range band with switchable High Q mode, plus high-pass and low-pass filters. A 180° phase reverse button is included alongside an EQ in/out bypass switch.

  The 1084 is available in two formats: a 19″ 1RU rackmount (with or without an external 24V PSU) and a 500-series-style module that fits directly into vintage Neve 80 Series console frames. Both share identical circuitry, PCB layouts, and hand-wired looms.

  Technical performance matches original Neve specifications: frequency response extends from 10Hz to -3dB at 55kHz, equivalent input noise is -110 dBu (unweighted, 300kHz BW), and maximum output level is +27.4 dBu into 600Ω. The microphone input impedance is switchable between approximately 1200 and 300 ohms.

  Powered by 115/230 VAC at 28W, the rackmount version weighs 10 lbs (4.54 kg) and the module version weighs 6 lbs (2.72 kg).
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Mic Input Impedance: ≈1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ≈150k ohms
  - Output Impedance: 65 ohms
  - CMRR: 100dB min @ 60Hz
  - Max Output Level: +27.4 dBu @ 600Ω
  - Gain Range: 0 to 80 dB
  - Equivalent Input Noise: -110 dBu (unweighted, 300kHz BW)
  - High Frequency EQ: ±16dB shelving at 10kHz, 12kHz, 16kHz
  - Low Frequency EQ: ±16dB shelving at 35Hz, 60Hz, 110Hz, 220Hz
  - Mid Range EQ: ±12dB or ±18dB peaking with switchable High Q
  - High Pass Filter: 18dB/octave at 45Hz, 70Hz, 160Hz, 360Hz
  - Low Pass Filter: 6kHz, 8kHz, 10kHz, 14kHz, 18kHz
  - Power Requirements: 115/230 VAC, 28W
  - Rackmount Dimensions: 19" W × 1.75" H × 9" D, Weight: 10 lbs
  - Module Dimensions: 45mm W × 8.75" H × 10.5" D, Weight: 6 lbs
