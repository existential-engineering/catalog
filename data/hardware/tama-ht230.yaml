name: 1st Chair Rounded Seat
manufacturer: tama
primaryCategory: drums
url: https://www.tama.com/usa/products/detail/ht230.html
description: TAMA's 1st chair drum throne provides unparalleled durability and
  comfort, combined with maximum playability. The HT230 features a traditional
  round seat, that is popular for its versatility. The 1st chair height
  adjustment offers the best of both worlds - the precision of a threaded rod
  coupled with the quick adjustment of a T-bolt system.
details: |-
  Traditional Rounded Seat: The HT230 features a traditional round seat, that is popular for its versatility.

  1st Chair Height Adjustment: 1st Chair thrones offer the best of both worlds-the exact height adjustment of threaded rod thrones with the fast adjustment of T-bolted systems: Loosen the bolt (A) and raise the threaded rod to the approximate desired height (it's not necessary to get the exact height at this point). Screw the Height lock (B) down to the top of the nylon bushing. If a minor adjustment is necessary, simply turn the Height lock or rotate the seat. Tighten the bolt (A) firmly.
