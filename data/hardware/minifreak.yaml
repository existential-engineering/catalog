description: >
  MiniFreak is a polyphonic hybrid keyboard that unites dual digital sound engines with analog filters, playful modulation, instinctive sequencing, and rich stereo effects for sounds that are immediately curious, beautiful, and chaotic in equal measure.
details: |-
  Minifreak is a polyphonic hybrid keyboard that unites dual digital sound engines with analog filters, playful modulation, instinctive sequencing, and rich stereo effects. It combines virtual analog, fm, additive, and granular synthesis modes, allowing users to collide contrasting oscillator modes for compound polyphonic timbres. Engine 1 can feed its sound into engine 2 for stacked sonic interplay, and external audio or voice can be processed through the synthesizer's architecture to unleash creative sonic possibilities.

  The synthesizer features twin lfos with customizable shapes, polyphonic cycling envelopes, and a powerful modulation matrix with 7 sources and dozens of possible destination combinations. Three digital fx engines provide 13 curated fx algorithms each, including distortion, chorus, reverb, vocoder effects, and more, ensuring every patch is mix-ready with stereo width. The modulation system allows users to animate and evolve sounds with responsive repeating modulations, even at audio rate, putting any flavor of sonic alteration at their disposal.

  Minifreak's interface features a 37-note velocity-sensitive slim-key keybed with aftertouch for responsive playing, multi-functional touch strips for tweaking macro controls during performances, and a shift button that unlocks secondary settings. The 64-step sequencer with 4 modulation lanes enables complex pattern creation with octave shifts, ratchets, repeats, and mutations. The spice & dice system provides one-touch randomization and creative mutations, ensuring sequences never fully repeat while maintaining musical integrity.

  The synthesizer includes 244 user preset slots and comes with over 300 factory presets created by experienced sound designers. Users can sync minifreak with the included minifreak v software counterpart (free for registered users) to use the same presets physically or virtually, with seamless creative flow between hardware and DAW. The device supports MIDI in/out/thru connectivity, USB for updates and preset management, and analog clock synchronization with external gear and modular systems.

  Minifreak ships with a universal psu (12v 1a), USB a to USB 2.0 cable, and registration card. The compact design measures 578 x 231 x 55mm and weighs 2.94 kg, making it portable for live performances and studio use. The synthesizer is compatible with windows 10+ and mac os 11+ systems, including m1 cpu support, requiring 4 gb ram and 3gb free disk space for software integration.
specs: |-
  - 6-voice polyphonic hybrid synthesizer
  - 37-note velocity-sensitive slim-key keybed with aftertouch
  - 2 sound engines with 22 oscillator modes total
  - Engine 1 oscillator modes: granular, sample, superwaves, karplus strong, wavetable, audio in, speech, modal, and 3 noise engineering modes
  - Engine 2 modes: comb filter, destroy, ring mod
  - Polyphonic state-variable resonant filters with low-pass, band-pass, and high-pass modes
  - Self-oscillating filters
  - Standard adsr envelope with 4 modes: polyphonic, monophonic, paraphonic, unison
  - Shape-adjustable cycling envelope with run and loop modes
  - 2 lfos with custom lfo shaper
  - Free-running or sync'd lfo operation
  - Modulation matrix with 7 sources and 13 potential destinations
  - 3 digital fx slots in insert or send mode
  - 13 fx algorithms including ext vocoder and self vocoder
  - Stereo outputs
  - 64-step sequencer with 4 pages of 16 steps
  - 4 lanes of automated modulation
  - Performance arpeggiator with ratchet, octave randomize controls
  - Spice & dice randomization and mutation system
  - Touch strips for macro control and sequence manipulation
  - Shift button for secondary settings
  - OLED display for real-time visual feedback
  - Single-knob operation for navigation
  - Sustain input
  - Audio input for processing external signals
  - Clock in/out connectivity
  - MIDI in, out, and thru
  - USB connectivity for updates and preset management
  - 244 user preset slots
  - Over 300 factory presets
  - Chord mode
  - Scale mode
  - Dimensions: 578 x 231 x 55mm (22.75 x 9.09 x 1.57 inches)
  - Weight: 2.94 kg (6.48 lbs)
  - Universal psu - 12v 1a
  - Compatible with minifreak v software (VST, AAX, audio unit, nks)
  - Windows 10+ (64-bit) compatible
  - Mac os 11+ compatible
  - M1 cpu compatible
  - 4 gb ram required
  - 4 cores cpu, 3.4 ghz (4.0 ghz turbo-boost)
  - 3gb free hard disk space
  - Opengl 2.0 compatible gpu
