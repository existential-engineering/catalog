description: The Lehle Dual SGoS is the second evolutionary stage of the highly
  successful programmable switcher for two amps plus tuner. It makes it possible
  to play through two amplifiers individually or simultaneously, either as a
  stand-alone unit or in a network with other Lehle SGoS switchers.
details: |-
  The Lehle Dual SGoS is the second evolutionary stage of the programmable switcher for two amps plus tuner. The unit can play through two amplifiers individually or simultaneously, either stand-alone or networked with other Lehle SGoS switchers. A particularly popular combination is the Dual SGoS with the Lehle d.loop SGoS.

  Programming is intuitive and can also be done remotely, using MIDI program change commands. The SGoS TRS socket connects to other Lehle SGoS switchers and to external MIDI equipment for synchronisation, so the unit can receive MIDI program change commands and can also send them, functioning as a MIDI controller.

  Hum loops are completely excluded, thanks to electrical isolation of outputs A and B by the Lehle Transformer HZ high-end transformer. Gold-plated-contact relays, ground switches and phase inverters assure the full, loss-free guitar sound. The relays feature active pop-and-click suppression, and outputs A and B can be muted for undisturbed instrument tuning.

  The potentiometers are in the signal path when outputs A and B are active simultaneously, so the volume of the two amps can be balanced. Output T, basically intended for instrument tuners, can also be used for a third amp or for a second channel for amp B.

  Because the transformer-isolated output A delivers a balanced or unbalanced mono signal over a stereo (TRS) cable, the Dual SGoS can also serve as a DI box. Lehle states that the galvanic isolation alters neither sound nor dynamics, the signal passing the switcher without loss in strength or frequency.
specs: |-
  - Programmable switcher for two amps plus tuner
  - Lehle Transformer HZ galvanically isolates outputs A and B
  - Gold-plated-contact relays, ground switch and phase inverter
  - Active pop-and-click suppression, outputs A and B mutable for tuning
  - Volume controls to balance amps A and B when both are active
  - MIDI program change send and receive over the SGoS TRS socket
  - Supply voltage: 8 to 20 V DC
  - Current consumption: 97 mA
  - Weight: 748 g
  - Dimensions: 103 mm (4") length, 156 mm (6.1") width, 47 mm (1.9") height
