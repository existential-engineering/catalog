description: >-
  The Korg TR-88 is an 88-key weighted hammer action workstation from 2006
  featuring 62-voice polyphony, 64 MB of PCM wave memory, a 16-track
  sequencer, and 89 effect types.
details: |-
  Released in 2006 as part of the range succeeding Korg's LE series, the TR-88 targets pianists and keyboard players who need a fully weighted hammer action keyboard in a workstation format. The progressive key resistance increases toward the bass register, simulating the feel of an acoustic grand piano.

  The sound engine delivers 62-voice polyphony, halved when using stereo samples, across 16 multitimbral parts. With 64 MB of PCM memory split between ROM and an extra sample area, the TR-88 doubled the wave memory of its predecessor. Both 2-pole and 4-pole filter options with high-pass and low-pass modes plus resonance provide flexible tone shaping.

  A 16-track sequencer with 200,000-note capacity handles serious arrangement work. The dual polyphonic arpeggiator with five preset patterns adds rhythmic and melodic variation. Pattern memory includes 150 presets and 100 user slots per song, giving producers a solid foundation for building tracks.

  Connectivity includes USB for MIDI interfacing with a computer, an SD card slot supporting up to 1 GB of storage, and standard MIDI in/out/thru. The 89 available effect types can be configured as insert or master effects, and a 240x64 pixel LCD with adjustable contrast handles the visual interface. At roughly 21 kg, the TR-88 is reasonably portable for a weighted 88-key instrument.
specs: |-
  - Polyphony: 62 voices (31 in stereo)
  - Multitimbral: 16 parts
  - Wave Memory: 64 MB PCM
  - Filter: 2-pole (12dB) and 4-pole (24dB), high-pass/low-pass with resonance
  - LFOs: 2 with sample & hold, saw, sine
  - Arpeggiator: Dual polyphonic, 5 preset patterns
  - Keyboard: 88 keys, weighted hammer action
  - Sequencer: 16-track, 200,000-note capacity
  - Patterns: 150 preset + 100 user per song
  - Effects: 89 types (insert or master)
  - Display: 240x64 pixel LCD
  - Connectivity: USB, SD card (up to 1 GB), MIDI In/Out/Thru
releaseDate: "2006"
