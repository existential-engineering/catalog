description: >-
  The Polymoog 203a is a fully polyphonic analog synthesizer released by Moog in
  1975, featuring eight preset sounds and a 71-note velocity-sensitive keyboard.
  It uses divide-down circuitry to achieve full polyphony and includes a genuine
  Moog ladder filter with extensive modulation options. Originally called the
  Polymoog Keyboard, it descended from the unreleased Moog Constellation project
  and was designed by Dave Luce.
details: |-
  The Polymoog 203a descended from an ambitious Moog Music project called the Constellation, which was intended to include two keyboard synthesizers (the polyphonic Apollo and monophonic Lyra) plus the Taurus pedalboard. While the Constellation never reached production, the Taurus was released separately and the Apollo evolved into the Polymoog. Notably, the instrument was designed by Dave Luce rather than Bob Moog directly.

  The model 203a was originally called the Polymoog Keyboard. In 1978, a simplified and less expensive model (280a) was introduced, at which point the original was rebranded as the Polymoog Synthesizer. The 280a added fourteen preset sounds including Vox Humana, Strings 2, Electric Piano, Honky Tonk Piano, Chorus Brass, and Rock Organ, but eliminated most editing functions, leaving users largely dependent on presets.

  The Polymoog 203a employs divide-down circuitry similar to certain string synths and combo organs, enabling full polyphony across the entire keyboard range. It features a genuine Moog ladder filter with modulation and keyboard tracking, along with a 3-band EQ, sample-and-hold, pitch controller ribbon, and a full set of envelope controls. The full 71-key velocity-sensitive Pratt & Read weighted keyboard can be split into three sections, each with independent volume sliders.

  The large top surface was intentionally designed to accommodate placing a Minimoog or similar synthesizer on top. An optional Polypedal board (model 285a) provides external control via two large foot pedals for pitch, filter, and volume, plus two smaller pedals for sustain and trigger mode. The instrument lacks patch memory and MIDI control, and is known to be rather unreliable and prone to breakdown, with used specimens often proving problematic when left unserviced.

  The Polymoog has been used by Chick Corea, Blondie, Keith Emerson, Devo, Gary Numan, Prince, Herbie Hancock, Richard Tandy of ELO, Patrick Moraz, Rush, Larry Fast, Wendy Carlos, Tony Banks, Kraftwerk, Geoff Downes, Jimmy Edgar, Freddy Fresh, and Rick Wakeman of Yes.
specs: |-
  - Polyphony: 71 notes (fully polyphonic)
  - Oscillators: 2 VCOs with sawtooth and pulse/square waveforms, pulse-width modulation
  - Filter: Moog ladder filter (highpass and lowpass), keyboard tracking, modulation
  - EQ: 3-band
  - LFO: Rate, Amount, and Attack controls
  - Extras: Sample-and-hold, pitch controller ribbon
  - Presets: 8 preset sounds (Strings, Piano, Organ, Harpsichord, Funk, Clavi, Vibes, Brass) plus 1 user variation
  - Keyboard: 71-key velocity-sensitive Pratt & Read weighted keyboard, splittable into 3 sections
  - Control: CV/Gate
  - Optional: Polypedal board (model 285a)
  - Weight: 82 lbs (37 kg)
  - Original MSRP: Approximately $5,000
  - Produced: 1975-1980
