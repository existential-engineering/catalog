description: A fuzz and overdrive pedal built on the Fuzz Head's differential
  pair transistor core, with a JFET front end, a germanium gain stage and
  switchable diode clipping.
details: |-
  The Son of Fuzz Head retains the differential pair transistor setup at the heart of the original Fuzz Head design, which is what makes that circuit unusual. Added to it are a JFET tube-amp simulator on the front end and a germanium transistor gain stage after it.

  The tone control was reworked and moved to the outside of the pedal, a change players had asked for over a decade. Diode clipping can be removed entirely, which turns the pedal into a brutal overdrive rather than a fuzz, so it covers both extremes from one enclosure.

  The original Fuzz Head won Guitar Player Magazine's Best Stomp Box award, and the key elements of that design remain intact here. The artwork is by Calvin Schenkel.
