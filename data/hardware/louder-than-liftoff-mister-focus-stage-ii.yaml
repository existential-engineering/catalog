description: The Mister Focus Stage II is a colorful console channel strip
  designed to pair with existing mic preamps, adding organic analog mojo through
  multiple processing stages. Available in four tonal flavors (Mass Drivr, Royal
  Blue, Pentode, Hitmaker 4000) and featuring two Colour-compatible analog
  expansion slots.
details: |-
  Features:

  STAGE II Drive: Input gain range of -6 to +18 dB with constant loudness output gain. Jumper-selectable BOOST mode for driving the filter saturation section to RMS level.

  Super Filter Section: High Pass Filter with selectable corner frequencies (23, 50, 80, 120 Hz) at 12 dB/oct. Vintage Low Pass Filter derived from the Silver Bullet design. Multi-stage transient saturation circuit (SAT). Individual jumper bypass options for HPF, vintage LPF, and saturation stages.

  Focus EQ: Single-knob EQ design adapted from the Chop Shop. Switchable pre or post STAGE II positioning via PRE-C switch. Internal jumpers for corner frequency selection.

  STAGE II Mix: Dry/processed signal crossfade blend control.

  Colour Expansion: Two analog expansion slots compatible with Colour-format modules. Available flavors include Mass Drivr (American), Royal Blue (British), Pentode (Tube), and Hitmaker 4000 (E-Series), plus third-party Colour modules.

  Designed and assembled in Silicon Valley, California. RoHS compliant (lead-free). High temperature Tg 170 PCB material.
specs: |-
  - Four flavors of STAGE II tone: - American, British, Tube, or E-Series
  - STAGE II Drive: - -6 to +18 dB input gain
  - Constant loudness output gain
  - Jumper selectable BOOST mode for driving FILTER saturation to RMS level.
  - STAGE II Mix: - Crossfade blend of processed and dry signal
  - Super Filter: - HPF: 23, 50, 80, 120 Hz
  - LPF: VINTAGE LPF from Silver Bullet
  - SAT: Multi-stage transient saturation
  - Individual jumper bypass for HPF, VINTAGE, SAT
  - Focus EQ adapted from Chop Shop: - Switchable to pre or post STAGE II Module
  - Internal jumpers to select corner frequency
  - All circuit components chosen by ear for maximum MOJO - Nichicon HE and Panasonic FR electrolytic capacitors
  - Wima polypropylene film capacitors
  - Thin film 0.5% resistors
  - Audiophile grade op amps (OPA1602), class A biased
  - Alps pushbutton switches
  - Analog plugin slots are Colour compatible
  - Made by tone geeks for tone geeks. Designed and assembled in Silicon Valley, California.
