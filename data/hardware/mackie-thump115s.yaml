description: "Our most compact Thump subwoofer ever, the Thump115S brings the
  rumble that modern DJs, bands, and clubs need."
details: |-
  Need extra oomph in your system? The compact 1400W 15" Thump115S subwoofer not only delivers the massive bass you need, but it's also the perfect match for your Thump loudspeaker system.

  Custom selectable voicing modes and a variable crossover makes optimization for your system easy. Stereo inputs plus High-Pass and Full-Range outputs offer plenty of configuration flexibility.

  Integrated top corner handles are our most ergonomic design yet making transport easier than ever. Add a Thump115S (or two, or three) to your system and really bring the rumble to your next gig.
specs: |-
  - 1400W Class-D amplifier
  - 15" High-performance woofer
  - Frequency response: 36Hz - 200Hz
  - Max SPL: 131 dB
  - Weight: 52.3 lb / 23.72 kg
  - Dimensions: 18.6 x 18.2 x 23 in / 472 x 462 x 584 mm (HxWxD)
