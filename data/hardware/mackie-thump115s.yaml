description: Our most compact Thump subwoofer ever, the Thump115S brings the
  rumble that modern DJs, bands, and clubs need.
details: |-
  Thump115S is the most compact subwoofer in the 2022 Thump Series, pairing a 1400W ultra-efficient Class-D amplifier with a 15 inch high-performance woofer. Frequency response runs 36 Hz to 200 Hz with a maximum SPL of 131 dB.

  Three voicing modes tailor the bass to the material: Flat keeps a natural balance between deep bass and overall output, Deep emphasises ultra-low frequencies for dance, rap and electronic music, and Punch prioritises the highest possible output level for bands and rock. A Variable mode lets the crossover be set manually.

  Stereo XLR inputs feed stereo full-range XLR outputs and stereo high-pass XLR outputs, so loudspeakers can be chained from the high-pass feed while the full, unaltered signal passes on to another subwoofer.

  Setup controls include a variable crossover frequency, a polarity invert switch, a defeatable front LED, stereo or mono summing for single or dual subwoofer deployment, and a variable level control from -6 dBU to +6 dBU.

  The cabinet is Built-Like-A-Tank with integrated top corner handles and an M20-threaded pole mount, and weighs 52.3 lb / 23.72 kg.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - 15 inch high-performance woofer
  - Frequency response: 36 Hz - 200 Hz
  - Max SPL: 131 dB
  - Voicing modes: Flat, Deep, Punch, Variable
  - Variable crossover frequency
  - Polarity invert switch
  - Defeatable front LED
  - Stereo or mono summing for single or dual subwoofer deployment
  - Variable level control (-6 dBU to +6 dBU)
  - Stereo XLR inputs
  - Stereo full-range XLR outputs
  - Stereo high-pass XLR outputs
  - Detachable line cord, 3-pin IEC inlet
  - Integrated M20-threaded pole mount
  - Weight: 52.3 lb / 23.72 kg
  - Dimensions (HxWxD): 18.6 x 18.2 x 23 in / 472 x 462 x 584 mm
