description: >-
  The Roland CR-68 is a preset analog rhythm machine closely related to the
  famous CR-78, offering the same sound set and rhythm patterns in a more
  streamlined package. It features analog drum sounds including kick, snare,
  rim, hi-hat, cymbal, maracas, claves, cowbell, and congas across 54 preset
  rhythm patterns. While it lacks the programmability of the CR-78, it
  compensates with useful performance features like breaks, fills, and an accent
  control.
details: |-
  The CR-68 represents Roland's entry-level approach to automated rhythm generation, sharing the same analog sound engine and rhythm patterns as the legendary CR-78 but in a simplified, non-programmable format. Released in 1978, it was designed as a more affordable companion to the CR-78, targeting musicians and performers who needed reliable preset rhythms without the complexity of pattern programming.

  The sound palette is pure analog, covering the essential drum voices: kick, snare, rim shot, hi-hat, cymbal, maracas, claves, cowbell, and congas. The CR-68 includes practical performance features such as breaks and fills, an accent control that adds dynamic variation to the beats, and a balance knob that can be used to creatively alter the character of the sounds.

  The unit offers 54 preset rhythm patterns spanning a wide range of styles including rock, disco, waltz, shuffle, slow rock, swing, fox trot, and tango. While its lack of programmability limits creative flexibility compared to the CR-78, its straightforward operation and characterful analog sounds have kept it relevant. In modern production, the CR-68's sounds are often sampled for use in recordings, prized for their warm analog character.
specs: |-
  - 54 preset rhythm patterns
  - Analog sound generation
  - Voices: kick, snare, rim, hi-hat, cymbal, maracas, claves, cowbell, congas
  - Rhythm styles: 4 Rock, 2 Disco, Waltz, Shuffle, Slow Rock, Swing, Fox Trot, Tango, and more
  - Controls: balance, tempo, level, accent
  - Breaks and fills
  - Trigger output
  - No user-programmable memory
