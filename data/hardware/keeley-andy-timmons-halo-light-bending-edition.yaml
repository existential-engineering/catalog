  engraved clear acrylic top, limited to 100 units.
details: |-
  This Custom Shop edition of the HALO carries a clear acrylic top, CNC machined and engraved by Ray Gerhart. The run is limited to 100 units because of the time the engraving takes, and units are built to order.

  The underlying pedal is Andy Timmons' "Halo" effect, a modulated dual echo sound he developed over several decades. Notes from the HALO repeat rhythmically into a dense diffusion, held together with tape-style modulation, saturation and compression. The pedal ships loaded with his signature delay tone, and user settings can be stored as presets, with Side A and Side B switchable on the fly so the unit works as two delay pedals in one. Alongside the Halo sound there are quarter note and dotted eighth rhythms, a stereo rack-mount analog delay and a vintage multi-head tape echo, with controls for saturation, tone and shelving filters.

  The Saturate control adds tape compression texture, while the Tone and High Pass Filter controls shape the delay and its mix. The Rhythm Mode selector provides five delay types. Setting Time and Feedback low opens up ambient chorus and flanger effects, and the pedal can be run in stereo for true-stereo imaging. Saved presets turn it into a compact multi-effect unit.

  Sides A and B give up to 1500 ms of delay each and can hold different delay times, switched by foot. Holding either stomp switch engages tap tempo, and holding the alternate switch gives infinite repeat or hold. Each preset bank stores two delay settings, for eight user-storable effects in total.
