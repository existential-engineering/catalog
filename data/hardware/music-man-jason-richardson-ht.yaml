details: |-
  The 2026 Jason Richardson Signature guitar collection features bold new finishes and an all-new 8-string hardtail. These guitars pair striking aesthetics with modern high-performance design.

  Crafted with an alder body, buckeye burl top, and a roasted figured maple neck with an ebony fretboard, the lineup spans 6-, 7-, and 8-string configurations and comes in three finishes — Kokiri Forest, Water Temple, and Death Mountain.

  Electronics include HT Custom humbuckers at the bridge and neck with coil tap, a custom Music Man active preamp with Silent Circuit, a 25k push/push volume for gain boost, a 500k push/push tone for coil splitting, and a 3-way pickup selector.

  The 8-string variant features a hardtail bridge and 25.5"–27" multiscale design; the 6- and 7-string variants ship with a custom Music Man floating tremolo.
specs: |-
  - Body wood: Alder with buckeye burl top
  - Body finish: High gloss polyester (Kokiri Forest) / Satin (Venetian Red)
  - Body dimensions: 12-7/8" wide, 1-5/8" thick, 38-1/8" long
  - Neck wood: Figured roasted maple
  - Neck finish: Gunstock oil and hand-rubbed wax
  - Neck attachment: 5-bolt sculpted joint
  - Neck radius: 15"
  - Neck width: 1-11/16" at nut, 2-1/4" at last fret
  - Fingerboard: Ebony (Kokiri Forest) / Striped ebony (Venetian Red)
  - Fret markers: Dot inlay
  - Frets: 24 medium-jumbo stainless steel
  - Scale length (6-string): 25-1/2"
  - Scale length (8-string): 25.5"–27" multiscale
  - Headstock length: 6-3/8"
  - Pickups: HT Custom humbucking (bridge and neck with coil tap)
  - Bridge: Hardtail (8-string) / Custom Music Man floating tremolo (6/7-string)
  - Tuning machines: Schaller M6-IND locking
  - Controls: Custom Music Man active preamp with Silent Circuit; 25k push/push volume (gain boost); 500k push/push tone (coil split)
  - Switching: 3-way toggle pickup selector
  - Electronic shielding: Graphite acrylic resin body cavity; aluminum control cover
  - Hardware: Black hardened steel with black saddles
  - Strings: 10p-13p-17p-26-36-46 (RPS 10 Slinkys #2240)
