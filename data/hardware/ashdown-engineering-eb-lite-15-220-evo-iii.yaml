description: The EB LITE 15-220 EVO III is an affordable Electric Blue 1x15-inch
  bass combo with a 220 watt RMS fan-cooled, fast-transient power stage and a
  fully-featured preamp for active and passive instruments. It offers an
  illuminated VU meter, a 5-band EQ with Bright and Deep switches, a front-panel
  balanced DI output, an FX loop, a tuner/line output, a built-in compressor and
  the classic Ashdown sub-harmonic generator, driving an Ashdown 'Blueline'
  speaker.
details: |-
  The EB LITE 15-220 EVO III is part of the Electric Blue range, loading Ashdown tone into an affordable 1x15-inch bass combo. It uses a 220 watt RMS fan-cooled, fast-transient power stage and a fully-featured bass preamp with inputs for both active and passive instruments. Features include an illuminated VU meter, a 5-band EQ with Bright and Deep switches, a front-panel-mounted balanced DI output for connection to a PA or recording console, an FX loop, a tuner/line output, a built-in compressor (consistent with its EVO III status) and the classic Ashdown sub-harmonic generator. A high-performance Ashdown 'Blueline' speaker ensures attack, clarity and low-end performance, and the cabinet is finished in retro-style vinyl with metal-protected corners.
specs: |-
  - Power output: 220 watts RMS
  - Power requirement: 115-230V
  - Speaker configuration: 1 x 15 inch Ashdown 'Blueline'
  - Cabinet impedance: minimum 4 ohm
  - Frequency response: -3dB at 33Hz and 25kHz
  - High instrument input: 3.9M ohms, 150mV - 20mV p-p
  - Low instrument input: 10k ohms, 300mV - 40V p-p
  - Line input: 22k ohms, 0dBu nominal
  - Tuner output: 22k ohms, 0dBu nominal
  - DI output: 600 ohms balanced, -20dBu nominal
  - EQ: Bass +/-15dB at 100Hz, Lo Mid +/-15dB at 220Hz, Middle +/-15dB at 660Hz, Hi Mid +/-15dB at 1.6kHz, Treble +/-15dB at 7kHz shelving
  - Effects send: 22k ohm, 0dBu nominal
  - Effects return: 22k ohm, 0dBu nominal
  - Distortion: less than 0.5% THD
  - Signal to noise: better than 80dB (EQ flat)
  - Built-in compressor
  - Illuminated VU meter
  - Sub-harmonic generator
  - Dimensions (H x W x D): 581 x 474 x 300 mm
  - Weight: 26 kg
