description: The Eastside LC Deluxe is a fully-hollow laminate archtop electric
  guitar designed for the professional jazz player. Built with a maple laminate
  body and top, a single Lollar Charlie Christian pickup at the neck position
  delivers a full, warm vintage tone. The Deluxe model adds ivoroid binding on
  the fingerboard, peghead, S-holes, and pickguard, along with custom ebony top
  hat knobs, distinguishing it from the standard Eastside LC.
details: |-
  The Eastside LC Deluxe features a fully-hollow parallel-braced body with maple laminate construction and a 16" lower bout width with 2 1/2" body depth. The Honduran mahogany neck is joined via an extra-long mortise & tenon neck joint and topped with a rosewood fingerboard featuring MOP long dot inlays and a 12" radius. Electronics consist of a single Lollar Charlie Christian pickup in the neck position wired with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware includes an adjustable ebony bridge, ebony tailpiece, nickel Gotoh tuners with Collings logo, and custom ebony top hat knobs. The body, fingerboard, and peghead are bound in non-grained ivoroid. The guitar is finished in high gloss nitrocellulose lacquer with a Deluxe Flared Haircut peghead profile and ebony peghead veneer. Medium 18% nickel-silver frets are used throughout. Comes strung with D'Addario NYXL1252W strings (.012"-.052") and includes a deluxe hardshell case. Custom options are available including alternate finishes, pickup alternatives, neck profiles, left-handed configuration, inlay styles, binding colors, hardware finishes, and pickguard materials.
specs: |-
  - Body Style: Fully hollow archtop
  - Construction: Parallel-braced, laminate
  - Body Material: Maple laminate
  - Top Material: Maple laminate
  - Neck Material: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: MOP long dots
  - Body Width: 16"
  - Body Length: 20 1/4"
  - Body Depth: 2 1/2"
  - Total Length: 42 5/8"
  - Binding: Non-grained ivoroid (body, fingerboard, peghead, S-holes, pickguard)
  - Pickup: Single Lollar Charlie Christian (neck position)
  - Controls: CTS 500K pots / Jupiter Vintage Yellow capacitors
  - Knobs: Custom ebony top hat
  - Pickup Rings: Black
  - Bridge: Adjustable ebony
  - Tailpiece: Ebony
  - Tuners: Nickel Gotoh with Collings logo
  - Peghead: Deluxe Flared Haircut profile, ebony veneer with MOP logo
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1252W (.012"-.052")
  - Case: Deluxe hardshell included
