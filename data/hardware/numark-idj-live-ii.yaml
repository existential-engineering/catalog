details: |-
  iDJ Live II is a low-profile DJ controller that connects to a Mac or PC laptop, or to an iOS device (iPad, iPhone, or iPod touch), via USB. The layout consists of two large performance turntables with a central mixer section, giving DJs a crossfader, EQ controls, and capacitive touch-activated platters for scratching and cueing.

  The controller ships bundled with Algoriddim's djay LE software for Mac and Virtual DJ LE Lite for Mac and PC. On iOS, it is designed to work with Algoriddim's djay 2 app (sold separately), which gives access to the user's iTunes library plus integration with Spotify. The unit is also designed to integrate with Algoriddim's vjay app for video mixing.

  The iDJ Live II is USB bus-powered, so no separate power adapter is required. The box includes a custom headphone/speaker audio splitter cable, an iPad stand, a USB cable for Mac/PC, and both 30-pin and Lightning cables for iOS devices.
