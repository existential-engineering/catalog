description: Hands-on precision delay which can blend into reverb.
details: |-
  The Echolocator is a stereo delay built on an algorithm developed by 112dB. It is a hands-on precision tool that puts manual and very musical control over small nuances in reach while playing.

  Like a bat navigating its environment in the dark, the player can feel a way through a live performance and shape the delay response and character on the fly.

  Twelve parameters cover detailed sound design, with selectable delay, filter and shimmer modes and a freeze function. Save and recall works on every parameter, across 30 factory presets and 70 user preset slots, and presets can be exported over USB.

  A configurable footswitch input adds hands-free control, and a full MIDI implementation puts every parameter under MIDI control.

  A sleek aluminium case matches Erica Synths' lineup of compact desktop units. The unit measures 23cm x 14.5cm x 7cm including knobs.
specs: |-
  - A unique stereo delay algorithm developed by 112dB
  - Selectable delay, filter, and shimmer modes
  - 12 parameters for detailed sound design
  - Freeze function
  - A configurable footswitch input
  - 30 factory presets and 70 user preset slots
  - Preset export via USB
  - Full MIDI implementation
  - Save and recall functions for all parameters
  - MIDI control over all parameters
  - Dimensions: 23cm x 14,5cm x 7cm (including knobs)
