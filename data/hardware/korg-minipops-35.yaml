description: >-
  The MiniPops 35 is a preset analog rhythm machine released by Korg in 1976,
  featuring six drum voices and nine pre-programmed rhythm patterns. Despite its
  limited programmability compared to contemporaries like the Roland CR-68 and
  CR-78, it gained cultural significance through its use by the French
  electronic duo Air.
details: |-
  The MiniPops 35 (also known as the MP-35) is a preset rhythm machine that Korg released during the mid-1970s. It provides nine rhythm patterns covering standard musical styles including Waltz, Samba, Rhumba, Bossa Nova, Tango, Slow Rock, Swing, Rock 1, and Rock 2.

  Controls are minimal by design — volume, balance, and tempo knobs handle the essentials, with the tempo dial offering only relative slow-to-fast markings rather than precise BPM values. A variation switch offers slight changes between bass/snare drums and cymbals, but that represents the full extent of its programmability.

  Compared to Roland's contemporary CompuRhythm boxes like the CR-68 and CR-78, the MiniPops 35 is considerably more limited in both sounds and features. Its six voices produce the expected bass drum, snare, toms, cymbals, and percussion tones through fully analog circuitry.

  While largely obsolete for modern production, the MiniPops 35 appeals to collectors and experimental musicians drawn to its lo-fi character. Its use by Air demonstrates that even the most basic rhythm boxes can find a place in creative music-making.
