details: |-
  For nearly a century, Abbey Road Studios has shaped the history of recorded music. The Limited Edition Abbey Road Studiomatic Hollow Body with Bigsby represents a very special collaboration featuring custom Filter'Tron pickups, and a custom-voiced Rumble Filter circuit developed in collaboration with Abbey Road sound engineers.

  Not only an homage to the continuing legacy of Abbey Road Studios, but also a unique and incredibly versatile guitar. The push-pull Rumble Filter and rotary pickup selector unlock a wide range of tonal possibilities while maintaining classic Gretsch character.
