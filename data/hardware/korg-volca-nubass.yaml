description: >-
  The Korg Volca Nubass is a monophonic bass synthesizer from 2019 featuring
  a Nutube vacuum tube oscillator, analog overdrive, and a 16-step sequencer
  designed for acid-style bass lines.
details: |-
  Released in 2019 as a spiritual successor to the Volca Bass, the Nubass takes a different approach to bass synthesis by centering its sound engine around Korg's Nutube technology. This modern miniaturized vacuum tube serves as the main oscillator, delivering the harmonic richness and warmth associated with tube circuits in a compact, low-power format.

  The oscillator offers sawtooth and square waveforms plus a sub-oscillator with its own saturation control. An analog overdrive circuit adds further harmonic density, while a voltage-controlled filter shapes the tone. The combination of tube oscillator, sub-oscillator saturation, and analog overdrive gives the Nubass a distinctly aggressive character well suited to acid bass lines.

  Accent and slide functions built into the 16-step sequencer directly reference the TB-303 style of bass sequencing. Sixteen pattern memory locations store sequences, and MIDI input allows external control. An LFO and AD envelope provide modulation and amplitude shaping.

  Like other Volca units, the Nubass features a built-in speaker and battery compartment for fully portable operation. Its focused feature set prioritizes hands-on sound design and sequencing over menu diving, making it an immediate and tactile instrument for bass-driven electronic music production.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 Nutube vacuum tube oscillator
  - Waveforms: Sawtooth, square, sub-oscillator
  - Filter: 1 VCF
  - LFO: 1
  - VCA: 1 with AD envelope
  - Effects: Analog overdrive
  - Sequencer: 16-step with accent and slide
  - Memory: 16 patterns
  - Control: MIDI In
  - Power: Battery or DC
releaseDate: "2019"
