description: >-
  The Korg Volca Nubass is a monophonic bass synthesizer that bases its sound
  source around a Nutube vacuum tube oscillator with analog overdrive. Released
  in 2019 as an update to the Volca Bass, it features saw and square waveforms,
  a sub-oscillator with saturation control, and a 16-step sequencer with accent
  and slide functions for acid bassline production. Its compact, battery-powered
  design with built-in speaker makes it one of the most portable acid
  synthesizers available.
details: |-
  The Nubass employs Korg's Nutube technology — a modern miniaturized vacuum tube — as its main oscillator, delivering harmonic richness and warmth associated with tube circuits in a compact, low-power format. The main oscillator switches between saw and square waveforms, while an independent sub-oscillator provides its own saturation control for added depth.

  An analog overdrive circuit adds further harmonic density, and a voltage-controlled filter shapes the tone. Modulation is handled through an LFO and an AD envelope generator. The combination of tube oscillator, sub-oscillator saturation, and analog overdrive gives the Nubass a distinctly aggressive character well suited to acid bass lines.

  The attached 16-step sequencer supports both accent and slide functions, directly referencing the TB-303 style of bass sequencing. Sixteen pattern memory locations store sequences, and MIDI input allows external control.

  Like other Volca units, the Nubass features a built-in speaker and battery compartment for fully portable operation. The glowing Nutube at the top of the unit drives the sound while creating visual appeal. Its focused feature set prioritizes hands-on sound design and sequencing over menu diving, making it an immediate and tactile instrument for bass-driven electronic music production.
specs: |-
  - Polyphony: 1 voice (monophonic)
  - Multitimbral: 1 part
  - Oscillators: 1 Nutube vacuum tube oscillator
  - Waveforms: Sawtooth, square, sub-oscillator with saturation
  - Filter: 1 VCF
  - LFO: 1
  - VCA: 1 with AD envelope
  - Effects: Analog overdrive
  - Sequencer: 16-step with accent and slide
  - Memory: 16 patterns
  - Control: MIDI In
  - Features: Built-in speaker
  - Power: 6 AA batteries or optional DC power supply
