description: >-
  The Roland JV-90 is a mid-1990s digital synthesizer featuring a 76-note semi-weighted
  keyboard with velocity and aftertouch response. It served as the basis for later
  professional models like the JV-1080 and JV-2080, offering a diverse sound palette
  powered by a 4MB ROM expandable to 14MB. The JV-90 also functions as a capable MIDI
  master controller with assignable parameter sliders for real-time sound editing.
details: |-
  The Roland JV-90 represents Roland's mid-1990s approach to combining affordable sound design with keyboard performance. Released in 1993, it expanded on the architecture of the JV-80 by offering a larger 76-key semi-weighted keyboard compared to the JV-80's 61 keys, while sharing the same core digital synthesis engine.

  The instrument features a comprehensive sound library covering basses, synth sounds, pads, leads, strings, percussion, drum kits, and more. An expansion slot accommodates an 8MB SR-JV80 ROM board, allowing users to significantly expand the available sound palette beyond the stock 4MB ROM. With 256 patches expandable to approximately 600, and 64 performances, the JV-90 provides substantial preset management capabilities.

  Assignable parameter sliders positioned above the keyboard enable real-time sound editing during performance, making the JV-90 well-suited for live use. Its MIDI implementation supports 8- to 16-part multitimbral operation, and the instrument doubles as a capable master MIDI keyboard controller for larger studio setups. While it lacks a built-in sequencer, its focus on sound quality and playability made it a popular choice among musicians seeking a versatile digital synthesizer.
specs: |-
  - Polyphony: 28 voices (expandable to 56)
  - Oscillators: Digital acoustic simulation via 4MB ROM (expandable to 14MB)
  - Filter: Digital filters
  - Effects: 2 effects units with chorus, reverb, and delay
  - Memory: 256 patches (expandable to approximately 600), 64 performances
  - Keyboard: 76 semi-weighted keys with velocity and aftertouch
  - Multitimbral: 8 to 16 parts via MIDI
  - Expansion: 1x SR-JV80 ROM board slot (8MB)
  - Arpeggiator/Sequencer: None
