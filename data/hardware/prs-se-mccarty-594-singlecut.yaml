details: |-
  With dual volume and push/pull tone controls, 3-way pickup selector on the upper bout,two-piece bridge, and vintage-style tuners, the SE McCarty 594 Singlecut is built with aclassic feature set that will make players feel right at home. Its 58/15 LT “S” pickups werecarefully designed to deliver warm, vintage-inspired tone with sweetness and clarity.Whether you are looking for rich, authentic humbucking tones or nuanced, sweet singlecoils, the SE McCarty 594 Singlecut can master both sonic territories with ease.

  Other specifications include a bound 22-fret, 24.594” scale length Pattern Vintage neckand slightly thicker back for sustain.

  Designed to capture the heart of the McCarty family of instruments, the SE McCarty 594Singlecut is a high-quality workhorse instrument.
