url: https://www.crownaudio.com/en-US/products/xls-2502
description: Two-channel, 775W @ 4Ω power amplifier from Crown's XLS DriveCore 2
  Series — the top of the XLS line. Class D design with large LCD display and
  onboard DSP for portable PA use.
details: |-
  The XLS DriveCore 2 Series represents the next generation of the XLS amplifier line, with a sleek new look, an LCD display three times larger than its predecessor, and expanded DSP capabilities. The XLS 2502 sits at the top of the line, delivering 775W per channel at 4Ω.

  Crown's patented DriveCore technology lets the XLS 2502 drive 2400W at 4Ω bridged with tons of headroom, guaranteeing a clean, undistorted signal straight to your speakers. The amplifier weighs less than 11 pounds, providing a powerful, pure sound experience for any venue.

  Onboard DSP includes band-pass filters per channel, the integrated PureBand Crossover System, and Peakx Limiters for speaker protection. Inputs accept XLR, 1/4-inch, or RCA, with selectable sensitivity (1.4Vrms or 0.775Vrms). A remote power-trigger input enables system-wide sequencing.
specs: |-
  - 2 channels
  - 775W per channel @ 4Ω
  - 2400W bridged @ 4Ω
  - Input Sensitivity: 1.4Vrms (selectable 0.775Vrms)
  - Frequency Response: +0dB, -1dB
  - Signal-to-Noise Ratio: >103dB (at 0.775Vrms)
  - THD: <0.5%
  - Intermodulation Distortion: <0.3%
  - Damping Factor: >200
  - Crosstalk: 1kHz >85dB; 20kHz >55dB
  - Onboard DSP: band-pass filter per channel, PureBand Crossover, Peakx Limiters
  - Dimensions: 19" W × 3.5" H × 10.7" D (48.3 × 8.9 × 21.2 cm)
  - Weight: 10.8 lbs (4.9 kg)
