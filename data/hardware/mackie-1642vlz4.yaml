name: 1642VLZ4
manufacturer: mackie
primaryCategory: mixer
url: https://mackie.com/en/products/mixers/vlz4-series/1642VLZ4.html
description: "16-Channel Compact Analog Mixer featuring Mackie's flagship Onyx
  mic preamps, with the proven feature set, high-headroom/low-noise design and
  'Built-Like-A-Tank' construction."
details: |-
  Now featuring Mackie's flagship Onyx mic preamps, the professional 1642VLZ4 delivers the proven feature set, high-headroom/low-noise design and "Built-Like-A-Tank" construction that created an industry more than 25 years ago. Made for routing signal in tons of ways, 1642VLZ4 is a perfect companion for a home studio. Easily route busses and channels and effects for mixdown with incredible VLZ4 sound quality.

  VLZ4 ups the level of sonic quality at every level, featuring Mackie's flagship Onyx mic preamps and premium components from front to back. The result is the most rock solid, the most easy to use and, yes, the best sounding compact mixer ever created.
specs: |-
  - 10 boutique-quality Onyx mic preamps
  - Ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Extended frequency response
  - Distortion under 0.0007% (20Hz - 50kHz)
  - Phantom power for studio condenser mics
  - Improved RF rejection perfect for broadcast applications
  - 16 high-headroom line inputs with +4/-10 operation control
  - 4 aux sends, level, pan and PFL solo on each channel
  - 3-band EQ (80Hz, 2.5kHz, 12kHz)
  - 18 dB/oct 75Hz low-cut filter on mic input channels
  - 60mm long-wearing log-taper faders
  - 4 stereo returns for connecting FX processor or other stereo source
  - ALT 3/4 stereo bus for added routing flexibility
  - Control room / phones source matrix
  - High-resolution 12-segment stereo meters
  - Sealed rotary control resist dust and grime
  - "Built-Like-A-Tank" rugged steel chassis with powder-coat finish
  - High-visibility, high-contrast controls
  - Rack-mountable design using optional rack ear kit
  - Multi-voltage power supply for worldwide use
