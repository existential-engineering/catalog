description: Mackie 1642VLZ4 16-Channel Compact Analog Mixer for live sound,
  broadcast, and recording.
details: |-
  Now featuring Mackie's flagship Onyx mic preamps, the professional 1642VLZ4 delivers the proven feature set, high-headroom and low-noise design and Built-Like-A-Tank construction that created an industry more than 25 years ago.

  Made for routing signal in tons of ways, 1642VLZ4 is a perfect companion for a home studio. Easily route busses and channels and effects for mixdown with VLZ4 sound quality.

  Channels 1-8 are mono channels with mic and line inputs, featuring Onyx mic preamps. Channels 9-10 and 11-12 are stereo pairs with left and right line inputs and a single mic input feeding each pair. Channels 13-14 and 15-16 are stereo pairs with line inputs only.

  Inserts and direct outputs are found on channels 1-8 only. Two sets of jacks are provided for the main outputs, 1/4 inch TRS jacks and XLR jacks, alongside a mono output, stereo control room outputs, four subgroup outputs, four aux sends and four stereo returns.

  Phantom power is globally controlled by a single switch on the rear panel, so it is turned on and off for all channels together. The power jack accepts a standard 3-prong IEC cord and a voltage selector sets the mixer for worldwide use.
specs: |-
  - 10 boutique-quality Onyx mic preamps with ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20Hz to 50kHz)
  - Phantom power for studio condenser mics
  - Improved RF rejection perfect for broadcast applications
  - 16 high-headroom line inputs with +4/-10 operation control
  - 4 aux sends, level, pan and PFL solo on each channel
  - 3-band EQ on channels 1-8 (80Hz, 2.5kHz, 12kHz); 4-band fixed-frequency EQ on channels 9-16 (80Hz, 400Hz, 2.5kHz, 12kHz)
  - 18 dB/oct 75Hz low-cut filter on mic input channels
  - 60mm long-wearing log-taper faders
  - 4 stereo returns for connecting FX processor or other stereo source
  - ALT 3/4 stereo bus for added routing flexibility
  - Control room / phones source matrix
  - High-resolution 12-segment stereo meters
  - Maximum levels: mic in +22 dBu, main mix TRS and XLR out +28 dBu, all other inputs and outputs +22 dBu
  - Power consumption 50 watts; 100-120 VAC or 200-240 VAC, 50-60 Hz
  - Rack-mountable design using optional rack ear kit
  - Dimensions: 16.7 x 16.6 x 5.2 in / 425 x 421 x 131 mm
