details: |-
  AEA's KU4 is one of the most useful and unique ribbon microphones in the world. Its supercardioid polar pattern rejects bleed from other instruments and reflections in the room while retaining matchless top-end clarity. As the brightest mic in the AEA line, it retains the full spectrum sonic range that has made ribbon mics a staple in most of the world's great recording studios.

  The KU4's supercardioid polar pattern enables it to capture direct sound from a vocalist or instrument without room tone. This is an advantage when tracking musicians live in the same room or when used live on stage. Being a near-field ribbon microphone, the microphone was designed to be positioned between one and 18 inches from the source. The mic's proximity effect kicks in six inches away from the sound source. The KU4 can handle 140+ dB SPL at 1 kHz.

  After getting used to bright condenser microphones, sometimes traditional ribbon mics sound darker than desired. The KU4, with its unique bright character, has the best elements of both condensers and ribbons — specifically, a smooth midrange that doesn't accentuate sibilance in the same way that condensers often do. The mic's supercardioid polar pattern, bright voicing, and near-field design offer the flexibility to use it in the exact same way as a condenser.

  The KU4 is a redesign of the legendary RCA KU3A, a unidirectional microphone originally designed for boom use in Hollywood motion picture studios. It was RCA's most expensive ribbon microphone and fewer than 600 units were ever manufactured. The KU3A combined the smooth ribbon sound of the classic RCA 44 with a unidirectional pattern, a wide sweet spot, and reduced proximity bass boost.

  Since the KU4 is a classic passive ribbon microphone, the preamp is critical for optimum performance. Preamp gain should be at least +60 dB or higher and the preamp should have a very high impedance. Preamps with above 5K ohm impedance are adequate for guitar amps and other louder instruments.
specs: |-
  - Supercardioid polar pattern
  - Extended top end with classic ribbon smoothness
  - Near-field ribbon mic with reduced proximity effect for close-miking
  - Maximum SPL: 140+ dB at 1 kHz
  - Recommended preamp gain: +60 dB or higher
  - Recommended preamp impedance: 5K ohm or higher
  - Passive ribbon microphone (no phantom power required)
  - AEA's redesign of the RCA KU3A
  - Near-field placement range: 1 to 18 inches from source
  - Proximity effect kicks in at approximately 6 inches from source
  - Made in the USA (Pasadena, CA)
