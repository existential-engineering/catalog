description: Versatile 50W all-valve guitar amplifier head built in the UK. Two
  independent channels (Clean and Overdrive 1), each with three switchable gain
  modes (Green/Orange/Red), giving six distinct voicings. Per-channel gain,
  three-band EQ, reverb, and master volume, plus shared presence and resonance.
  Two effects loops (one series/parallel, one series), studio-quality digital
  reverb, and a programmable footswitch (included) that recalls mode, master
  volume select, reverb on/off, and FX loop on/off via MIDI. Hand-assembled at
  Marshall's UK factory.
details: |-
  Enhance your sound with the JVM205 Head. Packed full of versatile features, this amp effortlessly showcases Marshall's broad sound palette.

  Green, orange and red LED lights guide you through the modes, each with more gain than the last, to find the sound that will set you apart. The amp carries two channels, each with its own master volume, so a solo can be set apart from the rhythm sound.

  Built-in reverb controls are independent per channel, and mode, master and reverb settings are recalled from the programmable footswitch included in the box.

  Two effects loops (one series and parallel, one series), an emulated XLR line out and MIDI in and thru handle switching and connection to the rest of a rig.

  The JVM205 Head is constructed at the UK factory, from loading the circuit boards to the black, white and gold finish, with each amplifier in the series assembled by hand. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: JVM205H
  - Range: JVM
  - Channels: 2 (multi), each with three modes
  - Technology: Valve
  - Output wattage: 50W
  - Outputs: 5 x 1/4-inch jack speaker sockets (16 ohm load / 8 ohm load / 4 ohm load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4-inch jack instrument input, MIDI In, Footswitch
  - Controls: channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 17.5 kg / 39 lb
  - Width: 740 mm / 29.1 inches
  - Height: 310 mm / 12.2 inches
  - Depth: 215 mm / 8.5 inches
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-91006 footswitch included, detachable power cable included, speaker cable included
  - Colour: Black
