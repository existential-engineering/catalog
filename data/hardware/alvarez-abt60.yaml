details: |-
  Tuned from B to B, the ABT60 is pitched between a dreadnought and acoustic
  bass, giving you deep, sonorous tones. Providing easy playability, chord shapes
  and scales on this baritone are the same as a standard six-string, only with a
  lower voicing.

  A baritone unlocks new sonic worlds to players at any point in their musical
  journey, helping you to approach your music in a distinctive way. Baritones are
  exciting instruments to explore new sounds or accompany vocals.

  The FST2 bracing finds the perfect harmony between rigidity and vibration,
  allowing the top to be both driven and controlled by the air volume this guitar
  creates. Delivering both balance and liveliness, the symmetry is inspiring for
  every player.

  The ABT60 remains one of Alvarez's best-selling models, also available in
  cutaway, Shadowburst, and 8-string configurations.

  Alvarez Artist Series represents the brand's commitment to quality and care,
  with meticulous design in bracing, voicing, and overall construction.
