url: https://intellijel.com/shop/eurorack/dixie-2/
description: Triangle Core VCO/LFO.
details: |-
  The Dixie II is a triangle core VCO/LFO. It has all the great qualities and features of the original Dixie but has been made a bit wider (6 hp instead of 4 hp) for better spacing and is now skiff friendly. The panel knobs are bolted on and the jacks have more space between them.

  This makes a perfect modulation source to pair with the Rubicon. Add a µFold, µVCA and µFade and you have all the ingredients for a powerful and highly flexible complex timbre generator.

  The triangle core is superior for musical FM sounds. In VCO mode the range is 1 Hz to 24 kHz; in LFO mode the range is 0.01 Hz (100 seconds) to 240 Hz, with precise tracking within 0.1% over 8 octaves.

  It offers 6 waveforms: triangle, sine, sawtooth, pulse (with PWM), square (50% duty cycle), and a unique 'zigzag' waveform. There is reversing sync (which can be made into soft sync with an external VCA or attenuator) and a jumper on the PCB to select center- or edge-triggered PWM.
specs: |-
  - Triangle core (superior for musical FM sounds)
  - VCO mode range: 1 Hz to 24 kHz
  - LFO mode range: 0.01 Hz (100 seconds) to 240 Hz
  - Precise tracking within 0.1% over 8 octaves
  - 6 waveforms: triangle, sine, sawtooth, pulse (with PWM), square (50% duty cycle), zigzag
  - Reversing sync (soft sync possible with external VCA or attenuator)
  - Jumper on PCB to select center- or edge-triggered PWM
  - PWM input range +/-5V; pulse width 50% with nothing connected
  - Width: 6 hp
  - Max Depth: 40 mm
  - Power: 42mA @ +12V, 37mA @ -12V
