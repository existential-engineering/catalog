description: Single-channel Auteur Mic/DI preamp in desktop format
details: |-
  The Auteur DT is a single-channel mic preamp and DI box in a desktop format, delivering 60dB of Chicago console-style gain. It has an XLR mic input on the rear and a front-panel 1/4" TRS instrument/DI input, with a 1/4" TRS line output on the rear. Built with brushed black aluminum and varnished maple side panels, it houses a USA-made transformer and cherry-picked Nichicon and Vishay capacitors. Includes a -10dB pad. Ideal for microphones, direct instruments (guitar, bass, keyboards), and adding console warmth and harmonic character.
specs: |-
  - Preamp Type: Solid State
  - Number of Channels: 1
  - Transformer: USA-made
  - Gain: 60 dB
  - Pad: -10 dB
  - Analog Inputs: 1 x XLR (rear), 1 x 1/4" TRS (front, Hi-Z DI)
  - Analog Outputs: 1 x 1/4" TRS (rear)
  - Frequency Response: 10Hz-30kHz
  - Form factor: Desktop (no rack spaces)
  - Power Source: 24V AC, 500mA (external)
  - Dimensions: 6" W x 2" H x 6" D
  - Weight: 2.5 lbs.
  - Capacitors: Nichicon and Vishay
