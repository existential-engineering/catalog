details: |-
  “With the PRS SE Chleo, we set out to create the best affordable guitar that delivers a unique combination of effortless playability, outstanding craftsmanship, and versatile tonal range. It combines modern innovations with classic style, giving players the tools they need to create everything from classic tones to cutting edge new sounds. The SE Chleo proves that a world-class instrument doesn’t have to break the bank—it’s a guitar that brings high-end performance within reach for everyone.” – Herman Li, DragonForce

  The PRS SE Chleo is the result of an intimate collaboration between PRS Guitars and award-winning guitar player Herman Li. Li, best known for his work as one of the lead guitar players in the power metal band DragonForce, is a demanding guitarist known for his fast and precise playing style. Based on the exclusive 2025 PRS Chleo Limited Edition, this SE signature model is a unique guitar in the PRS lineup designed with the modern metal guitarist in mind. The PRS SE Chleo features a maple top and mahogany back with maple neck and ebony fretboard. The body features a sculpted carve that allows it to be very thin and very lightweight overall, so you can play longer and with more energy. The neck shape and neck joint were specially designed to be comfortable and fast. The neck is very thin front-to-back with a slightly taller playing surface and 20” fretboard radius, and the added high-modulus carbon fiber strength rods ensure a strong neck that promotes sustain. The fretboard features “Eclipse Dragon” inlays, and PRS’s trademark scoop has also been modified for ultimate access to the upper frets. All this plus a Floyd Rose locking tremolo mean you can dig in and play hard without sacrifice. The PRS SE Chleo boasts the same signature pickups as the Limited Edition that preceded it. The Fishman Fluence Signature Series Omniforce Herman Li pickups feature copper-free layered PCB’s for consistency and no-hum tones. With three distinct voices and a versatile switching system, the guitar offers up to 13 unique tone combinations. From fat, aggressive rhythm tones to smooth, warm leads, soaring screams, and crystal-clear single-coil sounds, these pickups cover it all. The performance-friendly control layout makes it easy to switch between tones on the fly. Whether you’re using high-gain tube amps, modern amp modelers, or DAW plugins, the Chleo’s pickups are built to shine across any setup. Push boundaries and forge your own ground with the PRS SE Chleo.
