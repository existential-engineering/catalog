description: Named after the vibrant South Congress district of Austin, TX, the
  SoCo LC is a single-cutaway semi-hollow electric guitar that combines the most
  well-loved features and sounds from the heritage of semi-hollow guitars with a
  distinctive look and feel. Built with a maple laminate body and center block,
  it delivers a drier, woodier, and mid-forward tone compared to solid-wood
  counterparts. Lollar Low Wind Imperial Humbuckers and 50s-style wiring round
  out a vintage-voiced, player-focused instrument.
details: |-
  The SoCo LC is Collings' single-cutaway semi-hollow electric, inspired by the classic heritage of the format. The maple laminate top and back sit over a maple center block, producing a tone that is drier, woodier, and more mid-forward than solid wood models. The Honduran mahogany neck features an extra-long mortise & tenon joint, a rosewood fingerboard with MOP long dot inlays, a 12" radius, and medium nickel-silver frets. Electronics consist of Lollar Low Wind Imperial Humbuckers wired in 50s style with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware includes a Kluson ABR-1 bridge and Kluson stop tailpiece, both in nickel-plated zinc, and Nickel Gotoh tuners. The guitar ships with a deluxe hardshell case and D'Addario NYXL1149 strings.
specs: |-
  - Body Style: Semi-hollow, single cutaway
  - Body: Maple laminate
  - Top: Maple laminate
  - Center Block: Maple
  - Body Width: 15"
  - Body Length: 19"
  - Body Depth: 1 5/8"
  - Total Length: 40 1/4"
  - Neck: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Inlays: MOP long dots (5mm non-tapered)
  - Fingerboard Radius: 12"
  - Nut Width: 1 11/16"
  - Scale Length: 24 7/8"
  - Frets: Medium 18% nickel-silver
  - Bridge: Kluson ABR-1 (nickel-plated zinc w/ retaining wire)
  - Tailpiece: Kluson Stop Tailpiece (nickel-plated zinc, steel studs)
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Controls: 2 volume, 2 tone, 3-way toggle
  - Pots/Caps: CTS 500K / Jupiter Vintage Yellow
  - Wiring: 50s style
  - Binding: Non-grained ivoroid (body & fingerboard)
  - Soundhole: F-holes (unbound)
  - Peghead Veneer: Ebony w/ MOP Collings logo
  - Peghead Profile: Haircut
  - Tuners: Nickel Gotoh w/ Collings logo
  - Knobs: Amber or black top hat
  - Pickup Rings: Cream or black
  - Pickguard: Black/Cream/Black
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011" - .049")
  - Case: Deluxe hardshell case
