description: >-
  The Tempest is a hybrid analog drum machine and synthesizer co-designed by Dave Smith
  and Roger Linn. It combines six voices of analog synthesis with 16 velocity-sensitive
  pads and a step sequencer, functioning as a drum machine, drum synthesizer, polyphonic
  synth, and analog groovebox all in one.
details: |-
  The Tempest represents a unique fusion of two legendary synthesizer designers' expertise. Dave Smith, creator of the Prophet 5 and pioneer of MIDI, partnered with Roger Linn, renowned for designing the MPC and LinnDrum drum machines. This collaboration leverages each designer's strengths to create an instrument that transcends traditional categorization.

  At its core, the Tempest features a sophisticated analog synthesizer engine with six voices of polyphony and 32 simultaneously accessible sounds. Each voice includes two analog DCOs and two digital oscillators, with the Curtis analog low-pass filter switchable between 12 and 24 dB/octave configurations. The modulation matrix offers eight assignment paths, while five ADSR envelopes provide extensive sound-shaping capabilities.

  The instrument emphasizes real-time performance through 16 pressure and velocity-sensitive pads operating in four distinct modes: sound selection, beat sequencing, pattern editing, and mute control. Two assignable touch sliders enable dynamic parameter manipulation during performance, with the ability to record slider movements for individual sound pads.

  Sonically, the Tempest delivers characteristic DSI sound quality with authentic analog character and extended sound design possibilities. Roger Linn's swing implementation and odd time signature support reflect the drum machine heritage, while the synthesis capabilities enable sounds ranging from traditional percussion to experimental textures.
specs: |-
  - Polyphony: 6 voices
  - Multitimbral: 32 sounds
  - Oscillators: Two analog DCOs (sawtooth, triangle, saw/triangle, variable pulse width square); two digital oscillators (450+ drum samples and waveforms); one sub-octave generator
  - LFOs: 2 (triangle, reverse sawtooth, sawtooth, square, random)
  - Modulation Matrix: 8x8
  - Filter: Curtis switchable 2-pole/4-pole low pass; high pass
  - Envelopes: 5 ADSR with hold (two hardwired to VCA and low-pass filter)
  - Effects: Analog compressor and distortion; MIDI delay; glide
  - Sequencer: 16-step
  - Pads: 16 pressure and velocity-sensitive backlit pads
  - Memory: 650 patches; 4 MB Flash
  - Touch Controls: Two pressure and position-sensitive sliders
  - Connectivity: MIDI In/Out; USB
  - Weight: 6.5 lb (2.95 kg)
releaseDate: "2011"
