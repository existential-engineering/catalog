name: TYPE 30 MK2
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-30-mk2
description: HEDD's monitoring solution for mid to large recording and mastering
  studios, the TYPE 30 MK2 is a symmetrical 3-way DSP-enabled monitor built for
  power, flexibility, and dynamics.
details: |-
  The TYPE 30 MK2 uses a strictly symmetrical driver layout that calms the soundstage and lets engineers identify and shape even the smallest signals within a track or a larger immersive setup, while remaining fun to use and experience.

  A high-definition Air Motion Transformer tweeter handcrafted in Berlin delivers clear, precise upper mids and highs without audible distortion. A dedicated 4-inch midrange driver works with dual 7-inch honeycomb woofers to produce controlled, powerful low end, with a bass-extension mode reaching up to 20% deeper.

  An integrated 32-bit SHARC DSP enables comprehensive tuning through the free HEDD CTRL software, allowing real-time adjustment of the Lineariser zero-phase filter, EQ, delay compensation, and Closed or Ported enclosure mode from the listening position. The CoP function switches between sealed-cabinet accuracy and ported-cabinet bass response using a removable plug.

  Additional refinements include hi and low shelving filters, desktop filtering to mitigate nearby furniture reflections, and support for complete linear-phase satellite-subwoofer configurations using BASS 08 subwoofers. Every unit is rigorously tested before shipment and covered by a five-year warranty after registration.
specs: |-
  - Configuration: 3-way active monitor, symmetrical layout
  - Woofers: 2 x 7" honeycomb
  - Midrange: 1 x 4" honeycomb
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequencies: 250 Hz / 3,200 Hz
  - Frequency response: 32 Hz - 40 kHz (LFE mode: 26 Hz - 40 kHz)
  - Maximum SPL: 125 dB per pair at 1 m
  - Amplification: 3 x 300 W ICEpower Class D (85-264 V AC)
  - DSP: 96 kHz / 32-bit AD/DA converter
  - Features: HEDD Lineariser, CoP, GDC, LFE, desktop filter, hi/low shelf, bass-extension mode
  - Dimensions: 280 x 530 x 338 mm (W x H x D)
  - Weight: 21.5 kg per unit
