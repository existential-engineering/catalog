details: |-
  The 9700 XL is an extra-large version of DW's popular 9700 convertible straight/boom cymbal stand. It includes a larger-footprint Mega Tripod base, larger diameter steel tubing (1.5″ at the base), removable counter weight, toothless tilter with TechLock, integrated memory locks and more.

  This stand is perfect for drummers that require additional reach and sturdiness for larger diameter cymbals.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
