details: |-
  6060 CORE Subminiature Microphones are just 3 mm (0.12 in) in size but pack the audio power of our larger, award-winning DPA mics. What they lack in size, they more than make up for in clarity, consistency and durability – three qualities that really matter. These subminiatures have a lower noise floor than any other 3 mm (0.12 in) capsule on the market and they are better able to capture high sound pressure levels without distortion as well. Now available with MicroLock® – A dependable, secure locking microphone connector with limitless flexibility and reassuring reliability.
