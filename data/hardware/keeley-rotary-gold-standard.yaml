description: Custom Shop Gold Standard colourway of the true stereo Rotary
  pedal, with blend, drive and mid boost controls, dual speeds, brake,
  adjustable ramp and switchable true or buffered bypass.
details: |-
  The Rotary Gold Standard is a Keeley Custom Shop colourway of the Rotary pedal. The circuit is the same: it recreates the swirling texture and warmth of a rotating speaker cabinet, which the maker describes as a distinctive form of chorus, from a new set of circuit boards in a laser cut aluminium case, with a tube-style breakup alongside the swirl.

  Blend sets the mix of dry and wet signal, from a subtle warble to a fully wet effect, Drive adds tube-like harmonic saturation, and Mid Boost offers three EQ curves for thickening the stereo effect.

  A large speed knob sets the rotation rate, a dual speed switch selects between two distinct rates, a brake slows the rotation to a stop, and an adjustable ramp sets how quickly the speed changes between slow and fast. An optional pulsing LED tracks the effect as a speed indicator.

  The pedal has stereo inputs and outputs for true stereo operation, bypass is switchable between true bypass and buffered bypass, and it runs on 9 to 18 VDC at 130 mA with no battery option.
specs: |-
  - Gold Standard Custom Shop colourway
  - True stereo, stereo inputs and stereo outputs
  - Controls: Blend, Drive, Mid Boost, Speed, Dual Speed, Brake, Adjustable Ramp
  - Mid Boost offers three selectable EQ curves
  - LED speed indicator that pulses with the rotary effect, switchable
  - Switchable true bypass or buffered bypass
  - 9 to 18 VDC, 130 mA, high current power supply not included
  - No battery operation
  - Laser cut aluminium enclosure
  - Width 3.9 in / 99 mm
  - Height 2.6 in / 66 mm
  - Depth 4.9 in / 124.5 mm
