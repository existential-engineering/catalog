description: "The 8010A squeezes true reference performance and extended
  frequency response into an extremely compact package."
details: |-
  The 8010A is Genelec's most compact active two-way studio monitor, engineered to deliver true reference performance in spaces where size, portability, or weight are at a premium. Built around a die-cast aluminium Minimum Diffraction Enclosure (MDE), it pairs a 76 mm bass driver with a 19 mm metal-dome tweeter, each powered by its own 25 W Class D amplifier and crossed over at 3 kHz. The result is uncoloured, accurate monitoring from a cabinet small enough to slip into a backpack alongside a laptop.

  Despite measuring just 195 mm tall, the 8010A produces a frequency response of 67 Hz - 25 kHz (-6 dB) and a peak SPL of at least 105 dB at one metre. The integrated Directivity Control Waveguide (DCW) gives a wide, controlled dispersion that helps it perform predictably in untreated rooms, on desks, in OB vans, or on location - environments where larger monitors would be impractical.

  Room-response tuning is handled by rear-panel DIP switches: bass tilt, treble tilt, and bass roll-off let users tailor the monitor to wall- or corner-loaded placements without needing external processing. The supplied Iso-Pod stand decouples the cabinet from its surface and provides a small amount of tilt to direct the tweeter at the listening position, while threaded inserts and a wide accessory ecosystem support fixed installations on walls, ceilings, microphone stands, and VESA arms.

  The 8010A includes Genelec's Intelligent Signal Sensing (ISS) circuitry, which detects signal activity and drops power consumption below 0.5 W when the monitor is idle. Combined with the recycled-aluminium enclosure and the absence of paint or solvents in the finish, the 8010A is designed both as a portable reference tool and as a long-lifetime, low-impact product in keeping with Genelec's sustainability practices.

  Its compact form and reference-grade pedigree have made the 8010A a fixture in mobile production, broadcast, post-production, mastering rigs, and home studios where space is constrained but no compromise on monitoring quality is acceptable.
specs: |-
  - Frequency response: 67 Hz - 25 kHz (-6 dB)
  - Frequency response: 74 Hz - 20 kHz (±2.5 dB)
  - Peak SPL: ≥105 dB
  - Short term max SPL: ≥96 dB
  - Long term max SPL: ≥91 dB
  - Self-generated noise: ≤5 dB SPL (A-weighted)
  - Harmonic distortion 70-400 Hz: ≤3%
  - Harmonic distortion >400 Hz: ≤0.5%
  - Crossover frequency: 3000 Hz
  - Bass driver: 76 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 25 W Class D
  - Treble amplifier: 25 W Class D
  - Enclosure: Die-cast aluminium, reflex port
  - Signal input: 1 x XLR female, balanced, 10 kOhm
  - Mains: 100-240 VAC, 50/60 Hz
  - Power consumption (idle): ≤5 W
  - Power consumption (full output): 30 W
  - Height: 195 mm (with Iso-Pod)
  - Width: 121 mm
  - Depth: 115 mm
  - Weight: 1.5 kg (3.3 lb)
