name: M4
manufacturer: numark
primaryCategory: mixer
url: https://www.numark.com/product/m4
description: Three-channel tabletop DJ mixer with replaceable crossfader, mic
  input with EQ, and six total inputs for phono and line devices.
details: |-
  The Numark M4 is a three-channel tabletop mixer designed for any DJ who needs maximum flexibility. It features a replaceable crossfader with reverse and slope controls, allowing DJs to dial in their preferred feel and easily swap the fader when worn.

  The mixer offers six total inputs: two switchable phono/line RCA inputs plus four dedicated line RCA inputs, accommodating turntables, CD players, and other line-level sources. A 1/4-inch microphone input with dedicated EQ provides flexibility for announcements and vocal performances.

  Each channel includes a steep three-band EQ with rotary kills, a six-segment LED display for signal monitoring, and a toggle for master and PFL metering. Master and Record outputs along with a 1/4-inch stereo headphone output round out the connectivity.
