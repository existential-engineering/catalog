  DW's 5000 Series Straight Cymbal Stands feature heavy-gauge tubing, double-braced legs and more, in a road-worthy package.

  The 5710 Straight Stands are designed with sturdy, double-braced tripod legs and heavier gauge tubing, to offer plenty of support for larger cymbals, and plastic tube insulators kill the rattle in recording situations.

  The Toothless Tilter and hinged memory locks allow you to quickly and firmly set the stand heights and angles, so your cymbals stay where you put them.
