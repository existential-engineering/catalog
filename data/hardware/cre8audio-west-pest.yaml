description: Designed and developed in partnership with Pittsburgh Modular
  Synthesizers, West Pest is a powerful west coast style/influenced analog,
  monophonic full voice synthesizer with many unique sound-shaping tools and
  deep performance capabilities.
details: |-
  West Coast style is typically characterized by additive derived, rich and complex sounds. Often more traditional user interface elements are replaced by the abstract and experimental.

  West Pest's oscillator, designed in partnership with Pittsburgh Modular Synthesizers, stems from 10 years of continuous development of analog oscillator research.

  A wave folder shapes sounds differently than a filter. Instead of removing harmonics, the wave folder increases the harmonic content of the oscillator by folding the wave in on itself to create sonically rich waveforms.

  The Dynamics Controller is a fascinating invention from the folks at Pittsburgh Modular Synthesizers. It combines the functionality of an envelope generator, VCA, and a low pass filter. When a note is triggered, the Dynamics Controller opens with a sharp, percussive attack. Once the note is released, the Dynamics Controller adds a magical, voltage controllable, ringing decay as the amplitude drops and harmonics are rolled off.

  West Pest provides access to 8 different modules (Oscillator, wave contour, dynamics controller, LFO, multi-mod tool, MIDI to CV converter, sequencer, and button keyboard) worth of functionality with 18 Eurorack compatible patch points to plug into itself and your other gear.
specs: |-
  - West Coast style monophonic synthesizer with additive elements
  - Controllable via MIDI, CV, and integrated button keyboard
  - Fully patchable with 18 Eurorack-compatible patch points across 8 internal modules
  - 32-step sequencer with up to 13 storable presets
  - Generative sequencing mode
  - Clock-synced arpeggiator
  - Step sequencer can be transposed and manipulated via MIDI or the button keyboard
  - 100% analog oscillator developed with Pittsburgh Modular Synthesizers
  - Oscillator waveforms: sine, triangle, saw (combinable), with linear FM
  - Pittsburgh Modular wave folder/shaper circuit
  - PGH Dynamics Controller: hybrid envelope generator, VCA, and lowpass gate with voltage-controllable release
  - Dual-range analog LFO with square and triangle outputs (High: 2Hz-500Hz, Low: 41 seconds-5Hz)
  - Digital multi-mod tool with CV modulation control, random generator, extra LFO, and envelope generator
  - Internal clock with tap tempo, external clock sync, and built-in clock divider
  - Removable 40HP Eurorack module (25mm depth) or usable standalone in included case
  - Eurorack power draw: 250mA at +12V, 190mA at -12V
  - Oscillator input voltage range: 0-10V
