description: Created with Guy Pratt, the Interstellar is a 600-watt UK-built
  bass head inspired by his long history with the ABM-900. It features a 9-band
  EQ, valve drive, and foot-switchable compression and sub-harmonics, delivering
  the versatility, punch and precision that define Pratt's tone. The custom wood
  enclosure is visually striking and acoustically tuned, with an optional rack
  kit for flexible setups. Full pro connectivity includes a balanced DI, tuner
  output, line input, FX return and dual Jack/Speakon speaker outputs.
details: |-
  600-watt UK-built bass head created with Guy Pratt, inspired by the ABM-900. 9-band EQ, valve drive stage with a 12AX7 preamp tube, and foot-switchable compression and sub-harmonics. Custom acoustically tuned wood enclosure, with an optional rack kit. High instrument input (impedance 3.9 MOhm, input range 150 mV). Line input (22 kOhm, 0 dBu nominal). Balanced DI output (600 Ohm balanced, 0 dBu nominal). Tuner output (22 kOhm, 0 dBu nominal). FX return (22 kOhm, 0 dBu nominal). 2 x Jack/Speakon speaker outputs. Frequency response -3 dB @ 17 Hz - 30 kHz. Minimum impedance 4 Ohms. Power requirement 115-230 V. All UK-built products made to order (approx. 20-day lead time).
specs: |-
  - Power output: 600 watts
  - Preamp tube: 1 x 12AX7 (valve drive)
  - 9-band EQ
  - Foot-switchable compression and sub-harmonics
  - High instrument input: impedance 3.9 MOhm, input range 150 mV
  - Line input: impedance 22 kOhm, 0 dBu nominal
  - Balanced DI output: 600 Ohm balanced, 0 dBu nominal
  - Tuner output: impedance 22 kOhm, 0 dBu nominal
  - FX return: impedance 22 kOhm, 0 dBu nominal
  - 2 x Jack/Speakon speaker outputs
  - Frequency response: -3 dB @ 17 Hz - 30 kHz
  - Minimum impedance: 4 Ohms
  - Power requirement: 115-230 V
  - Custom wood enclosure with optional rack kit
