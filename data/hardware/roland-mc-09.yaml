description: >-
  The Roland MC-09 PhraseLab is a compact groovebox combining analog modeling synthesis
  with audio looping and step sequencing capabilities. Designed for musicians and DJs, it
  features monophonic bass and lead synth sounds modeled after the TB-303, alongside
  polyphonic rhythm parts. It also includes a four-part audio looper and real-time effects
  processing at an affordable price point.
details: |-
  The MC-09 PhraseLab integrates monophonic bass and lead synth sounds alongside polyphonic rhythm capabilities, with six control knobs for tweaking sounds via filters, LFOs, and other parameters. Users can play sounds through pads, a 32-step sequencer, or MIDI input, and the step sequencer is capable of emulating the TB-303's signature slides and accent effects.

  The device features a four-part audio looper capable of playing back four monophonic phrases up to six seconds each. Phrases can originate from the internal synth engine or external audio sources, and the looping system uses BPM and measure timing to automatically end recordings at musically appropriate points. The Chop function automatically divides loops into 16 slices for constructing new phrases.

  Four high-quality effects algorithms are included: Filter, Isolator, Phaser, and Slicer, which can be applied to audio loops or live inputs with real-time knob control. The lead synth section adds Overdrive, Distortion, Phaser, Slicer, and Ring Modulator effects. Rear connections include RCA-style audio I/O and MIDI In/Out, and users can save work to optional SmartMedia cards.
specs: |-
  - Polyphony: Lead 1, Bass 1, Rhythm 3
  - Preset Tones: 128 Lead, 128 Bass, 10 Rhythm
  - Sequencer: 32 steps, sixteenth-note resolution
  - Preset Patterns: 40 Lead, 60 Bass, 100 Rhythm, 30 Effect
  - User Patterns: 20
  - Effects: 30 total (Filter, Isolator, Phaser, Slicer, Overdrive, Distortion, Ring Modulator)
  - LFO: Triangle, square, sawtooth, sample and hold
  - Filter: Lowpass, bandpass, highpass
  - VCA: ADSR envelope
  - Storage: SmartMedia card
  - Control: MIDI In/Out
