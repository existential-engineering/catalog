details: |-
  The Martin Super HD-28 is a Standard Series dreadnought that pushes the iconic HD-28 platform into bigger territory. Its Super D-14 Fret body offers roughly 20 percent more internal air volume than a traditional dreadnought, producing thunderous bass response, extended sustain, and exceptional projection while preserving the balance and clarity Martin players expect.

  The instrument pairs a solid spruce top with East Indian rosewood back and sides, finished in a vintage-leaning Aging Toner gloss top over natural gloss back and sides. Forward-shifted Golden Era scalloped X-bracing unlocks the larger soundboard, giving the guitar a powerful low end and harmonically rich overtones.

  Classic Style 28 appointments include vintage herringbone trim around the top, antique white binding, and diamond-and-square long-pattern fingerboard inlays in ebony. The 14-fret neck is shaped to Martin's GE Modified Low Oval profile with a High-Performance Taper, joined to the body with a traditional dovetail neck joint.

  A bone nut and compensated bone saddle work with nickel open-gear tuners to round out the vintage feel, while the 25.4-inch scale length, 1 3/4-inch nut width, and 2 1/8-inch string spacing at the 12th fret keep the playing experience squarely in Martin's flagship Standard Series tradition.

  The Super HD-28 ships with a hardshell case and Authentic Acoustic Lifespan 2.0 phosphor bronze medium-gauge strings, and is new for 2026.
specs: |-
  - Body Size: Super D-14 Fret
  - Top: Solid Spruce (Aging Toner gloss)
  - Back and Sides: East Indian Rosewood (Natural gloss)
  - Bracing: Forward Shifted X Brace, Golden Era Scalloped
  - Neck: Select Hardwood (Dark Mahogany)
  - Neck Shape: GE Modified Low Oval with High-Performance Taper
  - Neck Joint: Dovetail
  - Fingerboard: Ebony
  - Scale Length: 25.4 inches
  - Nut Width: 1 3/4 inches
  - String Spacing at 12th Fret: 2 1/8 inches
  - Frets: 20 total, joins body at 14th
  - Inlays: Diamond and Square Long Pattern
  - Binding: Antique White
  - Top Trim: Vintage Herringbone
  - Nut and Saddle: Bone (compensated saddle)
  - Tuners: Nickel Open Gear
  - Electronics: None
  - Strings: Martin Authentic Acoustic Lifespan 2.0, Phosphor Bronze, Medium
  - Case: Hardshell
