description: The award-winning, all-in-one instrument that plays like guitar,
  violin, piano, and drums.
details: |-
  Instrument 1 is an award-winning, all-in-one adaptive MIDI controller that can
  be played like a guitar, violin, piano, or drum kit. Held like a ukulele, it
  lets a single player strum, tap, bow, and slide across one instrument, and a
  control knob switches between four preset modes while capo buttons shift the
  virtual capo position.

  The playing surface is a pressure-sensitive fingerboard with a 12-fret (full
  octave) layout arranged across six string rows, providing 78 note locations.
  Frets can be turned on or off for fretted or fretless playing, and the
  continuous pressure sensing supports polyphonic aftertouch for expressive
  control of software instruments. A raised strum bridge with six rubber-covered
  triggers lets you strum or tap notes, and a built-in accelerometer maps motion
  to the mod-wheel for added expression.

  Instrument 1 is a class-compliant USB audio and MIDI device that connects to
  iPhone, iPad, Mac, or Windows via its Mini USB port, and it includes a 1/8"
  TRRS headphone/microphone jack plus built-in stereo speakers and a
  rechargeable battery for standalone play. It has since been discontinued.
specs: |-
  - Pressure-sensitive fingerboard with 12-fret (full octave) layout
  - Six string rows and 78 note locations
  - Fret on/off for fretted or fretless playability
  - Polyphonic aftertouch
  - Strum bridge with six rubber-covered triggers
  - Built-in accelerometer mapped to mod-wheel
  - Four preset modes (guitar, violin, piano, drums) with capo buttons
  - Class-compliant USB audio and MIDI (48/44.1 kHz, 16/24-bit)
  - 1/8" TRRS headphone / microphone jack
  - Built-in stereo speakers
  - Rechargeable battery
  - Dimensions: 23.5 x 3.2 x 2.15 in
  - Weight: 1.6 lb (729 g)
