description: "When the recipe calls for deep, satisfying low-end sound, look no
  further than the Mackie MRS10 powered studio subwoofer."
details: |-
  If you're working on music that's all about that bass—hip-hop, EDM, metal—you need speakers that speak low-end. The Mackie MRS10 powered subwoofer is the professional, yet affordable, solution for producers and beatmakers.

  Equipped with a 10" glass aramid composite woofer, this mighty subwoofer is perfect for anyone who wants to experience deep, powerful bass in their studio. Powerful, deep extended low end for your studio, perfect for electronic music, hip-hop and more.

  Professional all-wood cabinet design built to last and look great in any studio.
specs: |-
  - 120 watts Class-D amplification
  - 10" glass aramid composite woofer
  - Shelf-ported design
  - Adjustable 40Hz to 180Hz crossover point
  - Polarity switch (0°/180°)
  - Vibration-absorbing rubber feet
  - Included footswitch bypass function
  - Professional all-wood cabinet design
