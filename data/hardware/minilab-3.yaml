description: >
  Find your own flow and enjoy making music with a plug-and-play MIDI keyboard that does it all. MiniLab 3 gives you easy controls, great-feeling keys, and a fully-integrated all-in-one software package that’s ready to get creative right out the box.
details: |-
  Minilab 3 is a universal plug-and-play MIDI keyboard controller designed for music production and performance. It combines a premium 25-key velocity-sensitive slim keyboard with comprehensive control surfaces including 8 encoders, 4 faders, and 8 rgb velocity and pressure-sensitive pads across 2 banks. The controller features a mini display with clickable browser knob for real-time feedback and preset navigation, along with capacitive touch sensors for pitch bend and modulation control. This compact, portable design is built for both beginners and professional producers, offering seamless integration with major daws and arturia software instruments.

  The minilab 3 includes intelligent performance features such as a built-in arpeggiator that locks melodies to project tempo, hold mode for sustaining notes, and chord mode for creating rich chords with single key presses. Octave shift buttons and semitone transpose functionality provide flexible note range control. The device supports up to 5 user presets for customizable configurations, plus 1 DAW preset for automatic integration with any major DAW. Mcu/hui protocol support ensures compatibility with virtually any DAW, while nks-compatibility enables seamless connection with the native instruments komplete kontrol ecosystem.

  Connectivity options include USB-c for computer and ipad connection, MIDI 5-pin din output for external instruments and gear, and a control input for connecting sustain, expression, or footswitch pedals. The controller is bus-powered and class-compliant, requiring no additional power supply. Deep integration with ableton live, logic pro, cubase, fl studio, bitwig, and other major daws is provided through custom scripts, enabling smart-assigned controls and seamless workflow. The minilab 3 champagne variant offers the same functionality in a limited-edition champagne finish for an elegant, modern aesthetic.

  The included software package provides comprehensive music production tools and sounds. Users receive access to hundreds of synth and keyboard presets from award-winning analog lab v, v collection, and pigments libraries, plus a 2-month loopcloud subscription offering millions of royalty-free samples and loops. A steinway grand piano sample is included for authentic piano sounds. The package also features music recording software with instrument presets, drums, fx, and MIDI clips, along with optional bundles including komplete 15 select and melodics subscription for skill development.

  Minilab 3 represents a commitment to eco-friendly design, constructed with minimum 50% recycled plastic and fully-recyclable cardboard packaging. The device includes a 5-year warranty and is built to last longer while reducing environmental impact. The compact, lightweight design (1 kg) makes it ideal for portable use—on commutes, at home, between lessons, or on stage. Whether for recording, performing, or jamming, the controller adapts to various musical styles and workflows, from beat-making and lo-fi production to rock tracks and dj applications.
