details: |-
  The Ler Bubble Tron is the Keeley Artist Series edition of the Bubble Tron, made with Larry 'Ler' LaLonde of Primus, who had used the original since its 2016 release. It carries three dynamic filter modes, each responding to pick attack: an envelope filter, an envelope flanger and an envelope phaser. What distinguishes this edition is the control layout: the envelope filter mode, which on the standard Bubble Tron requires moving internal DIP switches, is brought out to the front panel, and the filter sample and hold effect moves to Bank B. The knobs are knurled aluminium.

  The envelope filter mode follows playing dynamics with a slow release. Resonance acts as a Q control, from a narrow peak at one frequency to a broad push across a range, Depth sweeps the response from high pass through to low pass, and Sensitivity is set to suit the guitar's pickups and output level.

  The DynaMoPhase mode holds two phasers. One runs from an LFO whose speed is set by the Rate control while its depth is modulated dynamically, and the other is a true dynamic phaser that starts and stops with pick attack. Turning the Rate control off leaves only the dynamic phaser. Depth and Sensitivity set the range and the trigger threshold.

  The DynaFlanger mode takes its cue from the MicMix DynaFlanger, a dynamic flanger used on Frank Zappa recordings from the late 1970s to the mid 1980s. It uses playing dynamics rather than a conventional oscillator to start and stop the sweep, so no LFO is audible in the background. The FDBK control offers positive or negative feedback, negative reading as hollow and vocal and positive as thicker and smoother, with Sensitivity and Depth setting the trigger threshold and the sweep depth. The pedal was designed and engineered by Aaron Tackett, Craighton Hale and Robert Keeley and is made in Oklahoma City.
specs: |-
  - Three dynamic modes: envelope filter, envelope flanger, envelope phaser
  - Envelope filter controls: Resonance (Q), Depth (high pass to low pass), Sensitivity
  - Envelope filter has a slow release time
  - DynaMoPhase section holds an LFO phaser and a pick-attack triggered dynamic phaser
  - DynaFlanger section has no audible LFO and offers positive or negative feedback via FDBK
  - Artist Series layout brings the envelope filter mode to the front panel, where the standard Bubble Tron uses internal DIP switches
  - Filter sample and hold effect relocated to Bank B
  - Knurled aluminium knobs
  - Made in Oklahoma City, USA
