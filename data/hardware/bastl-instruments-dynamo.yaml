url: https://bastl-instruments.com/eurorack/modules/dynamo
description: Combines envelope follower, comparator, and voltage-controlled
  switch. Two passively-connected envelope follower inputs with inverted,
  non-inverted, and full-wave rectifier outputs. Compressor CV output with LED.
  Selectable release time (Short/Mid/Long). Comparator with threshold control
  and CV input. Bi-directional non-buffered voltage-controlled switch.
details: |-
  5HP, 35mm depth. +12V <30mA, -12V <35mA. 10-pin, PTC fuse. Comparator Out→VCS Gate In normalized. Comparator In from EF Out normalized.
