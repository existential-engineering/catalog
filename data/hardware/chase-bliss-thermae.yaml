url: https://www.chasebliss.com/thermae
description: An all-analog delay and pitch-shifter built around four MN3005
  bucket-brigade chips, featuring a built-in sequencer, tap tempo with
  subdivisions, CV and expression control, and MIDI support.
details: |-
  Thermae is an all-analog delay and pitch-shifter built around four MN3005 bucket-brigade chips. It combines analog delay with precise pitch-shifting intervals, creating harmonized delays that can be sequenced.

  The built-in sequencer allows you to create patterns of pitch-shifted delays, while tap tempo with subdivisions provides precise timing control.

  The pedal features true bypass (with trails off), 2 onboard presets, internal modulation via ramping, momentary or latching bypass modes, and trails support.

  Full MIDI support (PC, CC, Clock), CV control, and expression pedal compatibility provide deep integration into any performance rig.
specs: |-
  - All-analog signal path
  - 4x MN3005 bucket-brigade delay chips
  - Built-in sequencer
  - Tap tempo with subdivisions
  - Mono I/O
  - True bypass (with trails off)
  - 2 onboard presets
  - Internal modulation (ramping)
  - Momentary or latching bypass
  - Trails mode
  - MIDI (PC, CC, Clock)
  - CV and Expression control
  - DIP switches for customization
  - Power: 9V Center Negative, ~150mA (200mA recommended)
