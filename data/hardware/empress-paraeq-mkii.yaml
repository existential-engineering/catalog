description: "The ParaEq returns, better than ever: a transparent, high-headroom
  parametric EQ pedal with a footswitchable clean boost. Three parametric bands
  with 15dB of boost/cut, selectable bandwidth per band, and up to 30dB of
  boost, running internally at 27V for high clean headroom."
details: |-
  The ParaEq MKII is an ultra-transparent, all-analog parametric EQ that enhances your sound without masking the tone of your instrument. Three parametric bands each provide 15dB of boost or cut with fully overlapping, sweepable frequency selection and adjustable/switchable Q, giving all the control you need for tone shaping or problem-solving.

  Operating internally from a 27V supply, similar to rack-mount equipment, it delivers loads of headroom and a pristine clean sound with distortion measured under 0.05%. The footswitchable boost adds up to 30dB of gain, making it ideal ahead of long effects chains or for overdriving tube amps, and it can be linked with or run independently of the EQ. The pedal offers both true and buffered bypass, with top-mounted jacks for easy integration.
specs: |-
  - Controls: 3 parametric bands (sweepable frequency, +/-15dB boost/cut, adjustable/switchable Q per band), footswitchable Boost up to +30dB
  - Linked or independent EQ/boost switching
  - 27V internal operation for high clean headroom
  - Distortion under 0.05%
  - All-analog signal path
  - True or buffered bypass
  - Top-mounted jacks
  - Power: 9V DC centre-negative, 2.1mm barrel connector, 300mA
  - Dimensions: 4.8" L x 2.6" W x 1.5" H (enclosure), 2.5" H including controls
  - Weight: 1 lb
