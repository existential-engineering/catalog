  configurations and broadcast chain requirements without replacing the microphone
  body. Built to Coles' standards for reliability in live and location recording,
  the FIST delivers consistent performance across varying operational environments.
details: |-
  The FIST Microphone is part of Coles Electroacoustics' broadcast range, developed
  for professional applications requiring a robust handheld form factor with
  interchangeable capsule compatibility.

  The interchangeable impedance capsule system allows the FIST to be adapted to
  varying broadcast chain requirements without changing the microphone body,
  providing flexibility across different production configurations.
