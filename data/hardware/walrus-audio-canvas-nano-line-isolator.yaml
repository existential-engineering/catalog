name: Canvas Nano Line Isolator
manufacturer: walrus-audio
primaryCategory: di-box
url: https://www.walrusaudio.com/products/canvas-nano-line-isolator
description: You are the artist. Your sound is the paint, and this is your canvas.
details: |-
  You are the artist. Your sound is the paint, and this is your canvas. The Canvas Nano Line Isolator is a Line Isolator (LI) in a compact form factor designed to be an ideal fit on a busy pedalboard or fly rig where space is limited, removing any resistance between you and your audience by giving a pristine sonic foundation to build your masterpiece upon. From houses of worship to the dive bar downtown, Canvas Nano LI is built to be the performance tool that goes wherever you are making your music. Canvas Nano Line Isolator is a Passive device that converts your unbalanced signal into a balanced signal for interfacing properly with your recording interface or mixer at front-of-house. If you’re using an amp-in-a-box (DSP Guitar Rig), like our ACS1, or running an active acoustic or active bass guitar direct, then the Canvas LI is your new bridge to the front-of-house. The signal will remain at full volume and be converted to a balanced signal via the transformer connected to the XLR output. Less preamp gain will be required in LI mode. The Canvas LI packs everything you need from a LI into a compact-sized enclosure designed to look great right on top of your board. Needing a stereo solution? Click here for the Canvas Stereo. Canvas Nano LI Features Compact design perfect for tight pedal board layouts or small fly rigs. DI or LI? Not sure if you need a DI or LI? When deciding between DI or LI, check with the manufacturer of your gear to find the output impedance of the device you want to interface with. For a general guide: High Impedance = anything above 1k = Use DI Low Impedance = less than 1k = Use LI Find our Canvas Mono D.I. / L.I. here and our Canvas Stereo D.I. / L.I. here.
specs: |-
  - Flat frequency response from 20Hz-20kHz
  - Converts ¼” unbalanced input to XLR balanced output.
  - Transformer isolated output.
  - GND Lift: Isolates the GND pin on XLR to help reduce hum if present. Leave out for normal operation.
  - Custom wound Sapphire Transformers for low THD (Total Harmonic Distortion) and full frequency response.
  - Passive device, no power source required.
