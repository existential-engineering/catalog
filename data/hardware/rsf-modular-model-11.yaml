description: >-
  The RSF Modular Model 11 is a rare analog modular synthesizer created by
  French company RSF (Ruben & Serge Fernandez) in 1976. This towering monophonic
  system features three oscillators and resembles the ARP 2600 in architecture
  and capability. It excels at generating dense bass, growls, and textured tones
  through its generous overdriven sounds and punchy ADSR and filter sections.
details: |-
  RSF is a French synthesizer company founded by Ruben and Serge Fernandez. The Model 11 represents their entry into the modular synthesizer market during the 1970s. It is quite a rare analog modular synth and as a result little is known about this classic analog instrument.

  The system functions as a monophonic synthesizer with substantial sound design capabilities. It includes three voltage-controlled oscillators (VCOs) that enable great bass, growls, and blippy sounds. The instrument incorporates a low-frequency oscillator for modulation effects, along with a voltage-controlled filter and a punchy ADSR envelope generator driving the VCA.

  A notable phaser effect processor allows users to create thickening effects suitable for lead synthesis and experimental wobbly sounds. Rather than MIDI, control occurs via CV/Gate signals. A remote 61-note keyboard manages the synthesizer parameters. The instrument also includes three audio inputs for processing external signal sources through its internal filters and modulation modules.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs
  - LFO: 1
  - Filter: 1 VCF
  - Envelope Generator: 1 ADSR (VCA)
  - Keyboard: 61 Keys (remote)
  - Memory: None
  - Control: CV/Gate
  - Audio Inputs: 3
  - Effects: Phaser
