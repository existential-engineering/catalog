description: >-
  The Novation KS4 is a 16-voice polyphonic, four-part multitimbral synthesizer
  with an enhanced K-Station sound engine, semi-weighted aftertouch keyboard,
  independent effects per part, and a built-in 12-band vocoder.
details: |-
  Using an enhanced version of the K-Station sound engine, the KS4 offers many additional features and benefits over its predecessor. The keyboard has aftertouch, is semi-weighted, and each of the 33 knobs and sliders transmit MIDI. Four-part multitimbral operation with four individual assignable outputs is included, plus a separate effects section for each part.

  The KS synths have 3 oscillators providing sawtooth, triangle, sine, pulse width modulation and other waveforms. A simple FM synth engine can be dialed in for sharpening the sound. Oscillators may be set to unison or synced operation and a noise source is also included. External sounds can also be used as an oscillator and run through the filters and envelopes.

  The filter section provides a low-pass, band-pass, and high-pass resonant filter with switchable 12 or 24 dB/oct slopes and ADSR controls. A second ADSR envelope is available for the amp, as well as two LFOs with sample-and-hold and MIDI sync. On-board effects include reverb, distortion, and tempo-locked chorus, phaser, delay, panner, and enveloped filter with EQ. A 12-band vocoder is included for processing external mono sounds such as drum loops or vocals.

  The KS synths have been used by Infected Mushroom.
specs: |-
  - Polyphony: 16 voices, 4-part multitimbral
  - Oscillators: 3 per voice with Square, Saw, Variable Pulse, Tri, Sine, Double Saw, Double Tri, Double Sine; Osc 1-2 sync, FM, Ring Mod, Noise, external audio in
  - LFO: 2 LFOs (sine, triangle, saw, square, sample-and-hold, panning); cyclic or one-shot
  - Filter: Low/High/Band-pass, 12/24 dB switchable
  - Envelopes: ADSR envelope generators
  - Effects: 6 simultaneous per program (Reverb, Distortion, Chorus, Phaser, Delay, Panner, Enveloped Filter with EQ, 12-band Vocoder)
  - Arpeggiator: 4 independent in multi mode; up, down, random, chord; 32 preset patterns
  - Keyboard: 49-note semi-weighted with velocity and aftertouch
  - Memory: 200 preset programs, 200 user programs, 50 preset performances, 50 user performances, 100 drum sounds
  - Control: MIDI In/Out/Thru
