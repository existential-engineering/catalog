description: 5000 Series pedals are now fitted with more features and upgrades than ever before.
details: |-
  The 5000AD4XF takes the industry standard AD4 pedal and goes just a bit longer for even more leverage and power. A dual-chain Accelerator cam delivers a quick and mighty stroke, while a host of adjustments and player-friendly details make the AD4XF a formidable pedal for a variety of musical styles.

  The lightweight, aluminum Delta Ball-Bearing Hinge is engineered for performance, and the Tri-Pivot Toe Clamp system features three self-aligning pads that grip to any counter hoop. A dual-bearing rocker allows the spring to follow the motion of each stroke.
specs: |-
  - Extended footboard (XF) and baseplate
  - Dual-Chain Accelerator Drive; Dual Spring Rocker
  - 102 2-Way Beater
  - Aluminum cam shaft, anodized in 5000 red
  - Aluminum baseplate housing an extra drum key
  - Delta Ball-Bearing Hinge
