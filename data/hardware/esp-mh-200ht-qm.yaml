description: LTD's MH Series takes design elements from our acclaimed M/Mirage Series (fast extra-thin neck, inline headstock) and our H/Horizon Series (carved arch top body), adding up to a great all-around guitar that can handle nearly any musical genre or performance style. The MH-200HT QM offers bolt-on construction at 25.5" scale, with a mahogany body and figured quilted maple top that's paired to a three-piece, extra-thin, U-shaped maple neck with rosewood fingerboard and reversed matching-finish headstock.
details: |-
  LTD’s MH Series takes design elements from our acclaimed M/Mirage Series (fast extra-thin neck, inline headstock) and our H/Horizon Series (carved arch top body), adding up to a great all-around guitar that can handle nearly any musical genre or performance style. The MH-200HT QM offers bolt-on construction at 25.5” scale, with a mahogany body and figured quilted maple top that’s paired to a three-piece, extra-thin, U-shaped maple neck with rosewood fingerboard and reversed matching-finish headstock. Components on the MH-200HT QM include LTD tuners, and LTD fixed bridge with string-thru-body, and a set of high-output ESP LH-301 passive pickups.
specs: |-
  - Construction: Bolt-On
  - Scale: 25.5"
  - Body: Mahogany
  - Top: Quilted Maple
  - Neck: 3Pc Maple
  - Fingerboard: Rosewood
  - Fingerboard Radius: 350mm
  - Finish: Dark Brown Sunburst
  - Nut Width: 42mm
  - Nut Type: Molded
  - Neck Contour: Extra Thin U
  - Frets/Type: 24 XJ
  - Hardware Color: Black
  - Strap Button: Standard
  - Tuners: LTD
  - Bridge: LTD Fixed Bridge w/ String Thru
  - Bridge PU: ESP LH-301B *(Pull Tone for Split)
  - Neck PU: ESP LH-301N *(Pull Tone for Split)
  - Electronics Layout: Volume/Tone(Push/Pull)/3-way Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
