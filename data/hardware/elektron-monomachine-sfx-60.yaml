details: |-
  The Monomachine SFX-60 is a six-track digital synthesizer in a desktop module form factor. It combines five distinct synthesis engines — SuperWave, SID, DigiPRO, FM+, and VO — into a single instrument, each offering a fundamentally different approach to sound generation.

  Each of the six tracks features its own 24dB resonant multimode filter, AHDR envelope, and dedicated effects including delay, EQ, sample rate reduction, and distortion. The step sequencer offers six internal synthesis tracks plus six external MIDI tracks for controlling outboard gear.

  Modulation capabilities include 18 tempo-synced LFOs (three per track) and 12 programmable multi-function arpeggiators, enabling complex evolving patterns. The +Drive storage expansion provides additional capacity for patterns, sounds, songs, and waveforms.

  The SFX-60 is the desktop module variant; the SFX-6 adds a 37-key keyboard and joystick controller. The latest firmware is OS 1.32B, released May 2016.
specs: |-
  - 6-track digital synthesizer
  - 5 synthesis engines: SuperWave, SID, DigiPRO, FM+, VO
  - 24dB resonant multimode filter per track
  - AHDR envelope per track
  - Effects per track: delay, EQ, sample rate reduction, distortion
  - 18 tempo-synced LFOs (3 per track)
  - 12 multi-function programmable arpeggiators
  - Step sequencer: 6 internal + 6 external MIDI tracks
  - Memory: 768 patches (6 x 128), 128 patterns, 32 songs
  - +Drive storage expansion
  - Latest firmware: OS 1.32B (May 2016)
