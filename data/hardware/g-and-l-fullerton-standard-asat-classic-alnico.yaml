details: |-
  It has been six years since Fullerton Standard models were produced at G&L's historic Fender Avenue factory, delivering unsurpassed value and an authentic Made-in-Fullerton experience. The Fullerton Standard ASAT Classic Alnico leads their return, combining premium craftsmanship and exceptional value.

  The Fullerton Standard ASAT Classic Alnico shares the carefully refined single-coil Alnico V pickups, hardware, and build quality found in its Fullerton Deluxe and Build To Order counterparts. Crafted by legendary pickup specialist Paul Gagon, these pickups deliver articulate, powerful twang in the bridge position and smooth, warm tones in the neck, rich in harmonics and musical expression. Set within a classic boxed-steel bridge featuring Leo Fender's traditional brass saddles, this guitar ensures precise intonation and authentic vintage tone.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L Alnico single coils
  - Body wood: Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
  - Limited edition run
  - Available in: Lake Placid Blue Frost with rosewood fingerboard and 1-ply .060" white pickguard
  - Available in: Silver Frost with rosewood fingerboard and 1-ply .060" black pickguard
