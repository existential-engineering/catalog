name: MiBass 2.0
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/mibass-2-0
description: The MiBass 2.0 is a compact bass amplifier head with a 400W RMS
  (640W peak) power section that fits in a gig-bag pocket. It distills Ashdown's
  musical EQ into a classic 3-band Bass, Middle and Treble section paired with a
  variable Gain control for tones from warm and clean to full overdrive.
  Connections include a headphone socket, a line input for jamming and a
  pro-quality DI for sending bass tone straight to the desk.
details: |-
  A compact, gig-bag-sized bass head built to serve as hotel practice amp, recording amp and gigging amp in a single box. Its 640W peak (400W RMS) power section delivers a fat low-end across the volume range. MiBass distills Ashdown's acclaimed musical EQ into a classic 3-band Bass, Middle and Treble tone-shaping section, paired with a variable Gain control from warm and clean to full-tilt overdrive. Connections cover a headphone socket for late-night practice, a Line In for jamming with CD/MP3 players and a pro-quality DI to feed the desk or PA for recording sessions.
specs: |-
  - Power output: 640W peak / 400W RMS
  - Power requirement: 115 - 230V
  - Speaker outputs: 2 x jack sockets
  - Minimum impedance: 4 Ohm
  - Frequency response: -3dB at 17Hz - 30kHz
  - High instrument input impedance: 3.9M Ohms, input range 150mV - 20mV p-p
  - Low instrument input impedance: 10K Ohms, input range 300mV - 40V p-p
  - Line input impedance: 10K Ohms, level 0dBu nominal
  - Tuner output impedance: 22K Ohms, level 0dBu nominal
  - DI output: 600 Ohms balanced, level -20dBu nominal
  - EQ: 3-band Bass, Middle, Treble
  - Effects send impedance: 22K Ohm, level 0dBu nominal
  - Effects return impedance: 22K Ohm, level 0dBu nominal
  - Distortion: less than 0.5% THD
  - Signal to noise: better than 80dB (EQ flat)
