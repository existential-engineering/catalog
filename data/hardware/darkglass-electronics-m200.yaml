description: The Microtubes 200 is a 200W bass amplifier head featuring the
  signature Microtubes voicing in a slim, lightweight body. It has a
  studio-quality 4-band EQ, a Microtubes B3K drive engine, XLR DI and headphone
  outputs, and an aux input for backing tracks.
details: |-
  The Microtubes 200 is a compact 200W bass amplifier head, billed as slimmer, lighter, and louder. It packs the signature Microtubes voicing into a slim, lightweight body weighing under 1kg.

  Tone shaping comes from a studio-quality 4-band EQ with +/-12dB ranges at 80Hz, 1kHz, 3kHz, and 5kHz. A variable Drive control runs the Microtubes B3K engine from soft overdrive to modern distortion, and a Blend control mixes clean and distorted signals. A push-knob Master handles volume and mute.

  Connections include a 1/4-inch instrument input, a Speakon combo speaker output (accepting Speakon or 1/4-inch cables), an XLR DI output with ground lift, a 3.5mm headphone output with analog cabinet emulation, and an aux input routed to the headphone output for playing along with backing tracks. The amp runs on 100 to 230 VAC.
specs: |-
  - 200W bass amplifier head with signature Microtubes voicing
  - Slim, lightweight body: 15cm W x 15.7cm L x 5.2cm H, 0.965 kg
  - Studio-quality 4-band EQ: +/-12dB at 80Hz, 1kHz, 3kHz, 5kHz
  - Variable Drive via Microtubes B3K engine, with clean/dirty Blend
  - Push-knob Master with mute
  - XLR DI output with ground lift
  - 3.5mm headphone output with analog cabinet emulation
  - Aux input for backing tracks
  - Speakon combo speaker output
  - Power: 100-230 VAC, 50-60Hz
