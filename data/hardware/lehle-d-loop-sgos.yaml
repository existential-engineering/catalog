description: The LEHLE D.LOOP SGoS is recommended as the centerpiece of your
  pedal-board management system, a programmable double looper that takes
  inactive effects out of the signal path.
details: |-
  The LEHLE D.LOOP SGoS is recommended as the centerpiece of your pedal-board management system, a programmable double looper that takes inactive effects out of the signal path. The loops can be used independently of each other. An adjustable buffer is additionally available in every situation and, because not all effect pedals have a volume controller, can even be used to boost them when necessary. The high-end buffer boost has gain margins of up to 12 dB and can also be used separately.

  The jack sockets and internal signal routing are entirely stereo, to permit full-quality use of studio, 19" and stereo effect-pedal units, too. This is assured by the True Bypass characteristics of the Lehle switchers and their gold-plated-contact relays. The signal ground is also switched, to eliminate hum in your effect loops, and a pop-and-click suppression circuit avoids annoying switching noise.

  Programming is as easy and as intuitive as you would expect from Lehle products, whether via remote, using MIDI program change commands, as a stand-alone unit, or combined with other SGoS switchers. One very popular combination is to use the LEHLE D.LOOP SGoS with the LEHLE DUAL SGoS, which can mutually monitor and control each other, and manage effects and amps. A simple stereo patch cable is all you need.

  All Lehle switchers feature special relays and slide switches with gold-plated contacts for zero-loss switching, and a processor based on ARM Cortex-M technology controls the switching operation, giving a service life of 2 million switching operations.

  The easy-action mushroom-shaped buttons characteristic of LEHLE products are mounted in the cover, so that foot pressure is transmitted indirectly only, via a spring. Thus the electronics board is not exposed to mechanical loads.
specs: |-
  - Programmable double effects looper, loops usable independently
  - Adjustable buffer boost with up to 12 dB of gain, usable separately
  - True Bypass switching with gold-plated-contact relays
  - Switched signal ground and pop-and-click suppression
  - Fully stereo jack sockets and internal signal routing
  - Programmable stand-alone, via remote, or by MIDI program change commands
  - Number of FX loops: 2
  - Max. gain: 12 dB
  - Weight: 696 g
  - Length: 103 mm / 4"
  - Width: 156 mm / 6.1"
  - Overall height: 47 mm / 1.9"
  - Supply voltage: 8 - 20 V DC
  - Current consumption: 250 mA
