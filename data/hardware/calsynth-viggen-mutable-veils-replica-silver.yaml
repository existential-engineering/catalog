description: A full-size Eurorack replica of the Mutable Instruments Veils quad
  VCA, offering four DC-coupled VCAs with adjustable response and offset
  controls for use as an offset generator or LFO shaper.
details: |-
  Viggen is a full-size replica of the Mutable Instruments Veils 2020 quad VCA, using the same circuit and components with identical functionality. Veils is four DC-coupled VCAs with adjustable response from linear to exponential, offset controls for use as an offset generator or LFO shaper, and cascaded outputs so channels can be summed into a mixer. Built by hand in California. With an anodized aluminum panel, real Alpha components and the same parts as the original, it is as close as you can come in a new build. Note: the non-detent sliders on the original Veils are no longer manufactured, so the sliders on Viggen have center detents. This has no impact on the circuitry. Manual: Mutable Instruments Veils documentation
specs: |-
  - 10hp, 25mm deep — skiff friendly
  - Same circuit and components as the original
  - Anodized silver aluminum panel (also available in black)
  - Fully tested and calibrated before shipping
  - 2-year Calsynth warranty
