details: |-
  The Apocalypse is our jack-of-all-trades fuzz pedal. After being dramatically overdriven, the signal is routed to one of five selectable post-amplifiers for five wild and unique fuzz tones. Toggle through its five signal paths and choose your desired apocalyptic sound. To further refine this beast, control the Sweepable Frequency Equalizer and carve your tone out just the way you like it.

  Use this pedal as a boost for solos, an amp-simulated recording DI, your main fuzz sound, a bass blitzer, or run anything into it you want to beef up, blast out, destroy, or supercharge.

  Volume adjusts the output volume of the pedal. Drive controls the volume of the initial preamp inside the pedal: turn it up for more distortion and fuzz or pull it back for cleaner overdrives and boosts. The Sweepable Frequency Equalizer is a special tone knob designed to function as a multitude of tone controls simultaneously, ranging from a bass booster that fades into a mid scoop, followed by a mid boost, and eventually into a few stages of treble-boosting for a bright sound.

  The rotary selector chooses the post-amplifier. Twin-T Scoop adds bass and treble simultaneously at a quieter volume than the rest. War Fuzz is a very full and dynamic distortion with rich harmonics and sustain. Dual J-FET is similar to War Fuzz but uses dual J-FETs to get its sound. Octave Rect sums the bottom and top halves of a waveform to create an octave up. Gain x1000 cranks the gain super high on this post amp, causing erratic results.
