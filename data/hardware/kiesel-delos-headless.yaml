details: |-
  The Headless Delos (HD) further modernizes the Delos guitar with a headless construction. A smaller, compact body creates a comfortable, lightweight instrument inspired by the famous S-style instrument.

  The model is available with either 22 or 24 frets, an exclusive option among the headless lineup.

  The standard build is an alder body with a white multi-layered pickguard, bolt-on construction with a radiused neck heel, and a tung-oiled maple neck with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability.

  Electronics are master volume and tone controls with a 5-way blade-style pickup selector feeding Kiesel Beryllium humbuckers, over a Hipshot headless fixed bridge or a Hipshot fixed headless multiscale bridge at .4125 inch (10.5 mm) spacing.

  At 31.2 inch body length the instrument weighs 5.5 to 5.65 lbs, and the gallery shows 6-string (HD6, HD6X) and 7-string (HD7X) builds in finishes from seafoam green and translucent blue to custom purple to pink fade crackle and splatter.
specs: |-
  - Headless version of the Kiesel Delos, model designation HD
  - Available in multiple string counts, with 6-string and 7-string builds shown
  - Available with either 22 or 24 frets
  - Construction: bolt-on with radiused neck heel
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius
  - Frets: 24 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length: 25.5 inch, with a multiscale bridge option
  - Pickups: Kiesel Beryllium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Bridge: Hipshot headless fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot fixed headless multiscale bridge, .4125 inch (10.5 mm) spacing
  - Pickguard: white multi-layered
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Neck width: 1.69 inch or 1.90 inch wide at the nut, 0.78 to 0.82 inch thick at the 1st fret, 0.88 to 0.90 inch thick at the 12th fret
  - Body dimensions: 31.2 inch long, 1.65 inch thick, 12.5 inch wide, or 31.2 inch long, 1.68 inch thick, 12.75 inch wide
  - Weight: 5.5 lbs or 5.65 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
  - No headstock or tuners listed, since the bridge-mounted headless hardware carries the tuning
