description: The 9th entry into the STAR Reserve series, this Solid Japanese
  Cedar snare drum uniquely features the traditional Japanese woodworking
  technique, Uzukuri, creating a three-dimensional appearance. Complemented by
  the beautiful oil finish, this snare drum produces a dynamically bright,
  powerful, yet focused sound.
details: |-
  8mm Solid Japanese Cedar w/8mm Solid Japanese Cedar Sound Focus Rings: A light and soft wood that offers a dynamically bright, powerful, yet focused and mellow sound.

  Uzukuri Finish: This snare drum uniquely features the traditional Japanese woodworking technique, Uzukuri, creating a three-dimensional appearance.

  Customized Brass Mighty Hoop: Customized Brass Mighty Hoop provides a sharper and brighter attack with rich harmonic overtones, made of brass with a slightly shaved down edge.

  Starclassic Bell Brass Snare Wires: The MS20SN14B features bell brass strands for greater sensitivity.
