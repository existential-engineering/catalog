description: The Joe Walsh Alliance Series features an unusual extra slim
  semi-hollow construction. Besides the unique semi-hollow tone, this makes the
  guitar handle more like a thin solid-body.
details: |-
  The Alliance Series Joe Walsh is a semi-hollow guitar built with a sustain block, bent sides and an f-hole, using a laminated spruce top with laminated flamed maple back and sides. The construction is unusually slim, which according to Duesenberg gives the semi-hollow voice while making the instrument handle more like a thin solid body. The body measures 46 x 34 cm with sides 3.5 cm high, is bound in cream 5-layer purfling and finished in PUR lacquer with a matching colour headstock, a custom gold pickguard and a Tibetan Knot decal placed between the two pickups.

  The set neck is one-piece maple in a medium D shape, carrying an Indian rosewood fingerboard with a 305 mm / 12 inch radius, 22 jumbo frets and a steel dual-action trussrod over a 648 mm / 25.5 inch scale. The fretboard inlays spell the artist's name in morse code, a reference to his interest in radio operation. Duesenberg's Plek process levels the frets, which the maker describes as the basis for its hand fret polishing and setup work.

  Electrics pair a Duesenberg SingleTwin Mini noiseless single coil at the neck with a Duesenberg LittleToaster mini-humbucker at the bridge, wired to one volume, one tone and a 3-way pickup selector. Duesenberg presents this as one of the more unusual pickup combinations in its lineup, with the LittleToaster giving transparent treble at the bridge and the noise-cancelling SingleTwin Mini covering classic neck sounds.

  Hardware is a deliberate mix of nickel and gold. Duesenberg Z-Tuners and a Duesenberg Steel Saddle Bridge sit alongside the Duesenberg Radiator Tremola vibrato, fitted here with a custom golden grill. The Radiator is Duesenberg's evolution of its Diamond Deluxe design, running on heavy duty needle and nylon bearings, with an arm that turns freely through 360 degrees and can be adjusted for angle and length; strings pass through holes in the bar under the arm axis on their way to the tuners. Strap pins are Duesenberg Standard and Straplock compatible, and the instrument ships with Duesenberg Custom 10/50 strings.

  The guitar comes with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case, plus all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Morse code inlays
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching body colour
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated Spruce
  - Back, sides: Laminated flamed Maple
  - Dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Height (sides): 3.5 cm / 1.4"
  - Special artwork: Tibetan Knot Decal
  - Binding: Cream, 5-layer purfling
  - Pickguard: Custom Gold
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Radiator Tremola (custom golden grill)
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel & gold
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg SingleTwin Mini
  - Pickup (bridge): Duesenberg LittleToaster
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
