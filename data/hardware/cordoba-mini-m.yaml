details: |-
  The Mini M is the ultimate travel instrument, offering the playability of a full size guitar in a compact, lightweight body with an impressively loud voice. This miniature guitar features a solid spruce top paired with mahogany back and sides for a clear, complex tone. Its comfortable, thin U-shaped neck and 1 7/8 inch (48mm) nut width offers the feel and string spacing of a full-size guitar. The Mini M is a perfect companion for road trips, vacations, and hanging out at home. Includes a Cordoba gig bag.
