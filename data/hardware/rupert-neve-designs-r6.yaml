description: A six-slot 500 Series chassis built around an over-engineered power
  supply and a flexible rear-panel I/O design with interchangeable DB-25, XLR,
  or TRS connectors. Aimed at engineers who want a higher degree of confidence
  in their 500 Series rack — at home, in the studio, or on the road.
details: |-
  The R6 is a six-slot 500 Series chassis from Rupert Neve Designs built around an over-engineered power supply and a flexible, interchangeable rear-panel I/O design. With abundant power and versatile connections, the R6 is aimed at engineers who want a higher degree of confidence in their 500 Series rack — at home, in the studio, or on the road.

  The solid steel chassis houses six standard 500 Series slots powered by a double-shielded supply rated at 150% of the required current, delivering ±16VDC to the modules and a dedicated +48VDC phantom rail. Rear-panel LED current metering gives at-a-glance confirmation that each module is drawing power correctly.

  The R6's rear panel offers eight channels of balanced I/O that can be patched via interchangeable DB-25, XLR, or TRS connectors. Channels 7–8 are wired as thru connections, making the rack a quick format converter between DB-25, XLR, and TRS when those slots aren't loaded. Link jumpers tie adjacent channel pairs (1–2, 3–4, 5–6) for stereo operation of compressors and other linkable modules.

  A collapsible handle, dual sets of rubber feet for horizontal or vertical placement, and optional 3U rack ears make the R6 equally at home on a desktop, in a road case, or in a 19-inch rack. Made in the USA.
specs: |-
  - Slots: 6 standard 500 Series
  - DC voltage to modules: ±16VDC
  - Phantom power: +48VDC
  - Max current: 1000 mA (modules), 150 mA (48V phantom)
  - Mains input: 100–240VAC, 50/60Hz, 50W (universal)
  - Channels of balanced I/O: 8 (channels 7–8 wired as thru)
  - Connectors (interchangeable): DB-25, XLR, or TRS
  - Stereo link jumpers: channels 1–2, 3–4, 5–6
  - Rear-panel LED current metering
  - Chassis: solid steel
  - Dimensions: 13" W × 7.25" D × 5.5" H (33 × 18.4 × 14 cm)
  - Weight: 9.5 lb (4.3 kg)
  - Optional 3U rack ears (serial 250+)
  - Made in USA
