description: "TONEX Plug is the ultimate portable guitar and bass headphone amp,
  giving you instant access to over 40,000 free amps and pedal rigs in your
  pocket. Powered by IK's award-winning AI Machine Modeling, it offers the same
  studio-quality tone as the TONEX Pedal and TONEX ONE in a sleek,
  travel-friendly design."
details: |-
  Preloaded with 30 premium factory presets crafted to perfection, TONEX Plug provides the world's best tones right at your fingertips. From the first note, you'll notice and feel the difference — rich, dynamic, touch-sensitive tones that respond like real gear. As you discover new tones, it's simple to save your favorites, load them wirelessly, and build a personal library of sounds for any style or session.

  TONEX Plug lets you go far beyond factory sounds. Instantly connect to ToneNET, IK's global tone community, which currently offers over 40,000 free Tone Models to explore, along with a growing selection of Premium and Signature collections. Easily search and download tones based on your favorite songs and artists.

  With TONEX Plug, practicing becomes more fun than ever. Stream backing tracks via Bluetooth, jam along with YouTube lessons or music-learning apps, or explore your tone library in complete silence with headphones. Use your favorite learning apps to slow down riffs, loop tricky sections, and follow along with lessons — all while hearing your guitar through world-class amp and FX.

  Capture and take your own rig anywhere with IK's powerful AI Machine Modeling. Use the included TONEX Modeler to model your rig's tone in just minutes using real guitar signals, not just test tones, for a level of authenticity you've never imagined.

  The TONEX Control app for iOS and Android serves as your wireless command center for TONEX Plug, providing full real-time control over all parameters. Easily browse and load Tone Models from ToneNET. Edit the amp, cab, EQ, IRs, and effects with precision, and save your changes directly to the hardware.
specs: |-
  - Ultra-low noise 24-bit/96 kHz converters
  - Frequency response: 5 Hz - 20 kHz
  - Dynamic range: up to 119 dB
  - USB audio interface: 24-bit/44.1 kHz
  - 30 customizable presets across 10 color-coded banks
  - Bluetooth 5.0 (BLE) for wireless audio and control
  - Built-in chromatic tuner, metronome
  - Onboard EQ, gate, compressor, delay, modulation, reverb
  - Rechargeable battery: up to 6 hours playtime
  - 1/4" swivel jack instrument input
  - 1/8" (3.5 mm) stereo headphone output
  - Dimensions: 40 x 75 x 20 mm (1.57" x 2.95" x 0.79")
  - Weight: 70 g (0.15 lbs)
  - Power: 5V DC, 700 mA via USB-C
