description: A four-part MIDI interval sequencer that plays chords, arpeggiated
  motifs, and drones, translating music theory into hands-on controls for
  real-time performance.
details: |-
  The NDLR is a four-track MIDI groove box built around music theory rather than a keyboard. Four independent parts — a polyphonic PAD chord player, two sequenced Motif arpeggiators, and a Drone — can each drive their own synth over four MIDI tracks, letting non-keyboardists and keyboard players alike jam and perform in real time.

  Seven chord buttons follow the current scale automatically, and the Pattern and Rhythm editors ship with 20 built-in patterns and rhythms plus 20 user-saveable slots each. An 8-slot modulation matrix routes LFOs, pitch bend, velocity, CC, and aftertouch, while the Chord Sequencer arranges progressions up to 6 steps across 3 sections. A built-in MIDI controller adds mixer, pan, and filter control via configurable CC knobs.

  Current Rev2 hardware has a soft-power button, a powder-coated black faceplate with a red base, and a faster microcontroller. Release 3 firmware (June 2025) added a Euclidean rhythm algorithm and expanded global patch storage from 8 to 20 slots.
specs: |-
  - Four independent parts: PAD (polyphonic chord player), two Motifs (sequenced arpeggiators), Drone
  - Up to 8 synths addressable across four MIDI tracks
  - Seven chord buttons with automatic scale/note following
  - Pattern and Rhythm editors: 20 built-in + 20 user-saveable slots each
  - 8-slot modulation matrix (LFOs, pitch bend, velocity, CC, aftertouch)
  - Chord Sequencer: up to 6 steps across 3 sections
  - Built-in MIDI controller (mixer, pan, filter, configurable CC knobs)
  - Euclidean rhythm algorithm and Perlin noise pattern generator (4 favorite slots)
  - 20 Global Patch slots
  - "Interleaved Poly-Chain" note distribution across multiple MIDI channels
  - Tempo range 10-300 BPM, internal or external clock sync
  - 1.8" color LCD screen (128x160)
  - 8 rotary encoders with switches, 7 chord buttons, 4 play/pause buttons, panic button
  - Dimensions: 9" W x 6.3" L x 2.8" H
  - USB powered, 5V DC (140mA), no external supply required
  - 6-foot USB A-to-B cable included
