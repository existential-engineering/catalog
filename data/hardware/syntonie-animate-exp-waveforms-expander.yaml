prices:
  - amount: 109
    currency: EUR
    asOf: 2026-09-04
    source: official-website
description: Expander module that adds 4 additional waveforms (saw, trapezoid,
  shark, chainsaw) to the Animate oscillator, connecting via two 4-pin
  connectors for power and shared waveforms.
details: |-
  Adds 4 additional waveforms to Animate: saw, trapezoid, shark and chainsaw. Saw is twice the frequency of other waveforms and are 180° degrees apart, all other waveforms are 90° degrees apart. Connected to Animate through 2x 4pin connector, the core module provides power and triangle/square waveforms used to derive the expander waveforms. Outputs:

  0-1V, 499 ohm

  Specs:

  - 8HP
  - 40mA +12V
  - 0mA -12V
  - 0mA +5V
  - 15mm deep

  Documentation
specs: |-
  - Bus-powered from Animate over two 4-pin connectors, no power connector of its own
  - 8HP
  - 40mA +12V, 0mA -12V, 0mA +5V
  - 15mm deep
