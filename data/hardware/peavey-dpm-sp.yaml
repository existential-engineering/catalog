description: >-
  The Peavey DPM SP is a 16-voice multitimbral sample playback synthesizer released in the
  early 1990s, featuring 2 MB of onboard sample RAM expandable to 32 MB. It combines
  sample playback with an integrated synthesis section for processing samples, offering a
  compact and affordable alternative to dedicated samplers of its era.
details: |-
  Peavey had established experience with sampling technology before releasing the DPM SP. The company offered the DPM3 SE Plus, which could loop, trim, and combine samples when loaded into its 512K of battery-backed sample RAM. They also released the SX, a mono 16-bit sampling module designed as an affordable add-on to expand sampling capabilities across their product line.

  The combination of the DPM3 and SX proved limiting compared to dedicated samplers, prompting Peavey to develop the Sample Playback Synthesizer. The synthesizer designation reflects genuine synthesis capabilities, as the SP includes its own synthesis section for processing samples with an LFO, low pass filter with resonance, and ADSR envelope.

  The standard 2 MB memory required up to two 1.44 MB high-density disks for sample storage. Users upgrading to 32 MB benefited from SCSI ports on the rear panel for connecting larger hard drives. SCSI connectivity also provided the most practical method for interfacing with the SX module.

  The front panel featured a simple layout with a 2x20 character backlit LCD display and integrated disk drive. Navigation employed dedicated buttons for Disk, Wave, Tone, Map, and Preset functions, with arrow buttons for cursor movement. An infinite rotary data knob and Inc/Dec buttons managed parameter selection and page navigation. The rear panel included MIDI In/Out/Thru ports, paired main and sub audio outputs, and two SCSI sockets.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 16 parts
  - Oscillators: 1 VCO per voice
  - LFO: 1 with low-pass filter and resonance
  - VCA: 1 with ADSR envelope
  - Sample RAM: 2 MB (expandable to 32 MB)
  - Memory: 128 patches RAM
  - Storage: 1.44 MB high-density disk drive, SCSI connectivity
  - MIDI: In/Out/Thru
  - Outputs: Main and sub audio outputs
  - Display: 2x20 character backlit LCD
