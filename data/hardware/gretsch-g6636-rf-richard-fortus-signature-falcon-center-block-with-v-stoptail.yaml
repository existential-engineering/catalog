details: |-
  With a multitude of projects over the years headlined by a nearly two-decade stint with rock powerhouse Guns N' Roses, Richard Fortus is one of the most respected guitarists in the world.

  True to his dreams, the G6636-RF Richard Fortus Signature Falcon Center Block with V-Stoptail checks all the boxes. It begins with a resonant 1.75"-deep, 17"-wide double-cutaway maple body with a lightweight chambered spruce center block running throughout, reinforcing the arched laminate top while eliminating undesired feedback for volume-friendly performance that fits modern stages.

  The 24.6" scale length, "U" shaped maple neck and 12"-radius ebony fingerboard with 22 medium jumbo frets provide easy playability with enhanced sustain and tone, perfect for deep bends and soaring leads. Guitarists with Fortus' shape-shifting talents demand versatility in their instruments to remain on top of their game, which is why a set of Custom Wound Filter'Tron pickups in the bridge and neck positions fit perfectly.

  A master volume with treble bleed circuit allows you to throttle your amp without sacrificing your dialed-in tone, while a master tone with a no-load pot provides that organic vintage 'Tron feel at the twist of a knob. Switch between pickup combinations with a three-way toggle switch, while a V-stoptail couples with a TonePros Tune-o-matic Bridge to offer rock-solid tuning and stability.
