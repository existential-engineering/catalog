description: The Violet is a collaborative distortion pedal from JHS and
  guitarist Lari Basilio featuring a unique pre-distortion mid-shaping EQ and
  three-band post-distortion EQ, covering overdrive through modern distortion
  tones.
details: |-
  The Violet Distortion is a new take on distortion/overdrive brought to you from the collaborative minds of Josh Scott and highly influential Brazilian guitarist Lari Basilio! Using this pedal is like adding a new and ultra-flexible distortion channel to your favorite clean amplifier. The unique three-band EQ sets the Violet apart from our other popular distortion pedals. We placed the Midrange control before the distortion circuit as a powerful pre-amp distortion shaping tool. This single design choice allows the Violet to achieve hundreds of tones, from overdrive to full-on modern distortion. Treble and Bass controls are located in a more traditional position after the distortion circuit, offering familiar but extremely flexible post-distortion shaping.

  The Violet also excels at stacking with other overdrives, distortions, and fuzzes, allowing it to fit perfectly into any rig as a second or new primary dirt device.
