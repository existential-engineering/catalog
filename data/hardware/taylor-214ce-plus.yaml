description: The 214ce Plus is a Grand Auditorium acoustic-electric with a solid
  torrefied spruce top, layered Indian Rosewood back and sides, C-Class bracing
  for enhanced volume and low-end, and Expression System 2 electronics — shipped
  with an AeroCase.
details: |-
  Part of Taylor's 200 Series, the 214ce Plus features a Grand Auditorium body with a Venetian cutaway and a solid torrefied spruce top roasted to emulate the tonal characteristics of an aged instrument, delivering warmth and projection with a bold, punchy midrange response.

  C-Class bracing enhances volume and low-end presence. The Neo-Tropical Mahogany neck with Standard Carve profile and West African Crelicam Ebony fretboard provide comfortable playability and tonal clarity.

  Expression System 2 electronics use a behind-the-saddle pickup design for natural amplified acoustic tone. The guitar ships with D'Addario XS Coated Phosphor Bronze Light strings and a Taylor AeroCase.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Torrefied Spruce (solid, gloss)
  - Back/sides: Indian Rosewood (layered, gloss)
  - Bracing: C-Class
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-11/16"
  - Tuners: Taylor Nickel with Nickel Buttons
  - Electronics: Expression System 2 (ES2)
  - Body binding: Black
  - Pickguard: Black
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: AeroCase included
  - Series: 200
