details: |-
  Kali's first coincident studio monitor, the original IN-8 was built on the same platform of the LP-8, adding a third amp channel and a mid-range transducer.

  The maker lists the IN-8 as succeeded by the 2nd Wave IN-8, also called the IN-8 V2. That 2nd Wave version is described as being built on a new platform that realizes improvements in noise floor, THD, and system construction, which is a claim about the successor rather than about this unit.

  At a Glance, as published on the Legacy Products page: First Manufactured October 2019, Last Manufactured November 2020, US Price $399 each.

  Kali Audio distinguishes 1st Wave from 2nd Wave units by the transducers. 1st Wave monitors have a dark black, shiny finish, while 2nd Wave monitors have a lighter matte finish. The serial number dates a unit as well, with the 3rd to 9th digits giving the date of manufacture in MMDDYY format. All IN-8 units made before November 21, 2020 are 1st Wave, and all made after March 1, 2021 are 2nd Wave.

  The transducers and amplifiers in each generation are optimized for use with one another, so 1st Wave and 2nd Wave IN-8 components are not interchangeable (the WS-12 is named as the only product whose components are swappable between versions). The maker states that the user's manual and specs for the original version remain available at kaliaudio.com/product-history.
