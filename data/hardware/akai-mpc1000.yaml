description: >-
  The MPC1000 is the latest in a long line of sampling drum machines and sequencers from
  Akai, combining compact portability with professional features including six outputs,
  built-in effects, and expandable memory up to 128MB.
details: |-
  The MPC1000 represents an affordable entry point into Akai's respected MPC line without compromising audio quality. It builds upon the MPC2000 foundation by adding six dedicated outputs as standard, integrated multi-effects processing, and quadrupling the memory capacity to 128MB through the EXM128 upgrade option. The device's compact form factor makes it exceptionally portable for live performance and studio work.

  The unit features a 64-track MIDI sequencer paired with a 32-voice stereo digital sampler, providing substantial sequencing depth and polyphonic capability. Sixteen velocity and pressure-sensitive rubber pads enable expressive performance control, while dual Q-Link sliders allow real-time parameter manipulation during recording and playback. The sampler supports four-way sample layering and velocity switching per pad, enabling sophisticated sound design possibilities.

  Data management utilizes standard CompactFlash cards supporting up to 2GB, storing both WAV audio samples and MIDI sequences. USB connectivity allows seamless sample and sequence transfer between the MPC1000 and computer systems. The device includes 99 storable sequences and 20 song arrangements, internal flash-based sounds, and can resample its own output for creative layering effects.

  Akai achieved affordability by selective cost reduction in build materials while preserving sound quality entirely. The MPC1000 became instrumental in hip-hop, rap, R&B, and techno production, democratizing access to professional sampling and sequencing capabilities.
specs: |-
  - Polyphony: 32 voices
  - Sample Rate: 44.1 kHz
  - Audio Format: 16-bit linear WAV
  - Memory: 16MB standard (136 seconds mono); upgradable to 128MB via EXM128 option
  - LFOs: 2
  - Filters: 2 x 2-pole filters per voice (lowpass, bandpass, highpass)
  - Effects: Chorus, Flanger, 4-band EQ, Bit-Grunger, Compressor, Phaser, Tremolo, Auto Pan, Reverb
  - Master Effects: 4-band EQ and Compressor
  - Pads: 16 velocity and pressure-sensitive
  - Sequencer: 64 tracks per sequence, 99 sequences, 100,000 note capacity, 20 songs, 250 steps per song, 96 ppqn resolution
  - MIDI: 32 channels, 2 x MIDI In, 2 x MIDI Out
  - USB: Device connector x 1
  - Storage: CompactFlash card (up to 2GB)
releaseDate: "2003"
