description: "iLoud Micro Monitor Pro portable studio monitors by IK Multimedia
  with built-in ARC correction, X-Monitor integration, and more make critical
  mixing possible in the studio, at home or on the go."
details: |-
  The iLoud Micro Monitor Pro is a 2-way bi-amped, digitally controlled compact studio monitor featuring a 3" composite cellulose fiber custom-made mid-woofer and 1" low-distortion silk-dome tweeter. The DSP-tuned bass reflex acoustic design with high-efficiency Class-D amplification (2 amps per speaker) delivers 50 W RMS total power (30 W LF + 20 W HF).

  A digital linear phase crossover at 2.5 kHz and advanced DSP ensure perfect transient response and linear phase accuracy. Built-in ARC self-calibration analyzes and adjusts to any listening environment, with ARC X control software for macOS and Windows. Manual switches for LF Extension, LF trim, HF trim, and Desk position provide additional tuning.

  The ultra-compact format includes an integrated tilting isolation stand and threaded insert for mic stand mounting. Available in Black and White, sold as Single, Pair (includes ARC Mic), or Immersive Bundle 11 (includes ARC Mic).
specs: |-
  - 2-way bi-amped digitally controlled studio monitor
  - 3" composite cellulose fiber mid-woofer
  - 1" low-distortion silk-dome tweeter
  - DSP-tuned bass reflex acoustic design
  - Class-D amplification, 2 amps per speaker
  - 50 W RMS total power (30 W LF + 20 W HF)
  - Digital linear phase crossover at 2.5 kHz
  - Built-in ARC self-calibration
  - Manual EQ switches: LF Extension, LF trim, HF trim, Desk position
  - Integrated tilting isolation stand
  - Threaded mic stand insert
  - Available in Black and White
