description: >-
  The first in Roland's beloved Juno series, a six-voice analog polysynth with
  digitally controlled oscillators that delivered punchy, warm tones at an
  accessible price point.
details: |-
  Released in 1982, the Juno-6 launched what would become one of the most celebrated synthesizer families in music history. It offered six-voice polyphony with digitally controlled oscillators that maintained the warmth of analog while solving the tuning stability issues that plagued purely analog designs of the era.

  The oscillator section provides pulse, sawtooth, and square waveforms, feeding into a resonant lowpass filter and non-resonant highpass filter. The VCA section offers both ADSR envelope and gate modes. Two types of onboard chorus add the lush, shimmering character that became a signature of the Juno sound. Many players consider the Juno-6 and its immediate successor to sound punchier than the later and more popular Juno-106.

  The Juno-6 does have notable limitations that place it firmly in its era. There is no MIDI control, no patch memory storage, and the 61-key keyboard lacks both velocity sensitivity and aftertouch. An external JSQ-60 sequencer could be connected for sequence playback. The wooden side panels give it a classic aesthetic that signals its vintage pedigree.

  Despite these constraints, the instrument found favor with a wide range of artists including Nick Rhodes of Duran Duran, Enya, Vince Clarke of Erasure, Sean Lennon, and Banco De Gaia. Its straightforward interface and excellent sound continue to make it a sought-after instrument on the used market.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: DCO with pulse, sawtooth, and square waveforms
  - LFO: Rate and delay controls
  - Filter: Non-resonant highpass, resonant lowpass
  - VCA: Level, ADSR and gate modes
  - Keyboard: 61 keys (no velocity or aftertouch)
  - Effects: Chorus (2 types)
  - Memory: None
  - Control: Filter control in, external clock in
  - Sequencer: External JSQ-60 compatible
