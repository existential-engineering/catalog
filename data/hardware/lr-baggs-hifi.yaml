details: |-
  Bridge plate contact pickups aren’t anything new, but while traditionally they’ve offered a warm and woody sound, they have struggled with feedback and often require a permanent, glued-in installation. The HiFi System provides exceptional feedback resistance, a non-invasive, no-glue installation, and a studio-grade preamp so you always get a high-fidelity sound from your favorite guitar, no matter where you play.
specs: |-
  - Bridge plate contact pickup system with pre-wired transducers
  - All-discrete, high-fidelity endpin preamp with High-Graded FET input, Class-A design
  - Soundhole-mounted volume and tone controls
  - Peel-and-stick, no-glue installation
  - Includes installation jig for optimal placement
  - Steel-string and 12-string compatible (not for nylon-string)
  - 9V battery, 700+ hours of runtime
  - Requires professional installation
