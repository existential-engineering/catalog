details: |-
  Working with the acclaimed Devin Townsend, Kiesel Guitars meticulously designed and crafted the guitar into a compact, unique, headless instrument. The model is offered on one page in two editions, the Neo (also presented as the Circle) and the Om; this entry is the Om.

  The Om highlights a natural aesthetic and features 32 frets, three Kiesel S60A pickups paired with custom switching, and the Om inlay. Both Neos feature a counterweight, custom-covered Hipshot bridge, Dunlop flush-mounted strap locks, and a recessed jack.

  The body is mahogany with a carved poplar burl top, carried on bolt-on construction, over a short 29 inch overall length, 1.66 inch body thickness and 11.25 inch body width, for a 6.75 lbs instrument.

  The neck is tung-oiled roasted flamed maple with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, over an ebony fingerboard with less color variation at a 14 inch radius.

  Electronics are a stacked volume and tone control with a 5-way Super Switch, driving direct-mount passive Kiesel S60A single coils in a stacked single-single-single configuration.
specs: |-
  - Headless signature instrument, the Om edition; the Neo edition is a separate entry
  - Construction: bolt-on
  - Body: mahogany with a carved poplar burl top
  - Neck: roasted flamed maple, tung-oil finish, with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony, less color variation, with 14 inch radius
  - Frets: 32 stainless jumbo, .110 inch wide x .055 inch tall
  - Scale length: 24.75 inch (6-string) or 25.5 inch (7-string) as listed on the page
  - Pickups: direct-mount passive Kiesel S60A single coils in a stacked single-single-single configuration
  - Electronics: stacked volume and tone control with 5-way Super Switch
  - Output jack: recessed
  - Bridge: custom covered Hipshot fixed bridge, .4125 inch (10.5 mm) spacing (6-string), or Hipshot/Kiesel tremolo system (7-string) as listed on the page
  - Inlays: roasted flamed maple Om inlay with roasted flamed maple 2 mm side dots
  - Logo: engraved Kiesel logo
  - Hardware: black
  - Strap locks: Dunlop flush mount
  - Neck width: 1.69 inch wide at the nut, 0.76 inch thick at the 1st fret, 0.85 inch thick at the 12th fret
  - Dimensions: 29 inch long, 1.66 inch body thickness, 11.25 inch wide body
  - Weight: 6.75 lbs
  - Strings: Elixir Nanoweb 1046E
  - Counterweight fitted
