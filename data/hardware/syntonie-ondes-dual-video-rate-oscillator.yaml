details: |-
  Ondes, french for waves , is a dual video rate oscillator, featuring two independent oscillators with selectable sync, frequency and amplitude modulation, square and triangle/sawtooth wave outputs, as well as a mix output, offering a lot of versatility in pattern creation. Specs:

  - 8HP
  - 200mA +12V
  - 0mA -12V
  - 0mA +5V
  - 42mm deep

  Can be powered through standard Eurorack 16pin connector or DC barrel connector. User Guide
