description: Made in Japan analog chorus mini-pedal with Depth, Speed, and Level
  controls. A classic, warm, and ethereal chorus shrunk down to fit any
  pedalboard.
details: |-
  The mini-pedal market has been booming the past few several years, so we felt the time was right to offer some of our most legendary pedals in new mini housings! Made in Japan, the CSMINI features a smaller Depth knob and a significantly larger Speed knob in the middle.

  The CSMINI is a classic, warm, and ethereal chorus pedal shrunk down to fit any pedalboard. True bypass switching delivers the shortest, most direct signal path, while 100% analog circuitry preserves the warmth and character of vintage chorus tones.
specs: |-
  - Controls: Depth, Speed, Level
  - True Bypass switching
  - Required Current: 22mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - 100% analog circuitry
  - Made in Japan
