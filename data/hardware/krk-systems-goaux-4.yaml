description: The GoAux 4 is a portable nearfield monitor pair pairing a 4-inch
  glass aramid woofer with a 1-inch soft textile dome tweeter in a 100 W RMS
  bi-amplified two-way design. It adds USB and balanced 1/4-inch TRS inputs and
  Auto ARC room correction with an included measurement microphone.
details: |-
  The KRK GoAux 4 portable nearfield monitors are designed to provide KRK sound quality in a mobile-friendly size. The pair comes with a nylon carrying bag that holds both monitors, the included monitor stands, the Auto ARC microphone and any extra cables, and the stands are adjustable for monitoring position and angle.

  The GoAux 4 monitors pair a 4-inch glass aramid woofer with a 1-inch soft textile dome tweeter in a 100 W RMS (total system power) bi-amplified two-way design. The rear-ported ABS cabinets supply bass extension for a portable speaker. With the power amps located in one speaker's housing and the second speaker powered through an included speaker-level connection from the first, the pair only needs a single AC outlet for operation.

  Built-in LF and HF EQ let you adjust the monitors' response to the room and personal preference. With the included measurement microphone, the built-in Auto ARC automatic room correction feature can optimize the response of the speakers to the acoustic environment. Along with the USB, 1/8-inch aux, RCA and 1/4-inch TRS balanced stereo inputs, Bluetooth lets you connect wirelessly to a smartphone, computer or other Bluetooth-capable audio device. For silent monitoring, the front panel 1/8-inch stereo headphone output automatically mutes the speakers.
specs: |-
  - System inputs: Bluetooth, 1/4-inch TRS balanced, RCA, USB Type-B, 1/8-inch aux, Auto ARC microphone
  - System outputs: 1/8-inch stereo headphone jack with auto speaker mute
  - Bluetooth: version 5.0 and older compatibility
  - Low-frequency transducer: 4-inch woven glass aramid
  - High-frequency transducer: 1-inch soft textile dome
  - Crossover frequency: 2.5 kHz
  - Power output: bi-amplified Class D, 100 W total system power, 33 W RMS for each woofer, 17 W RMS for each tweeter
  - Maximum continuous SPL: 98.5 dB SPL
  - System peak SPL: 102 dB SPL
  - Maximum system SPL, momentary peak: 108 dB SPL
  - Frequency response (-3 dB): 65 Hz to 20 kHz
  - Frequency range (-10 dB): 55 Hz to 22 kHz
  - Signal to noise ratio: >95 dB (A-weighted) at rated output level
  - Coverage (horizontal x vertical): 120 degrees x 60 degrees
  - AC input voltage: 100 to 240 V, 50/60 Hz
  - AC power consumption: 6.07 W idle, 100 W max, 0.475 W standby
  - Enclosure type: rear ported
  - Enclosure material: ABS, black textured finish
  - Auto ARC automatic room correction with included measurement microphone
  - Dimensions (H x W x D): 8.07 in x 5.35 in x 5.51 in (205 mm x 136 mm x 140 mm)
  - Weight: 9.48 lb (4.3 kg) including both speakers, stands, carrying bag and accessories
