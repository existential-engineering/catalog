description: An expanded 16hp Eurorack granular texture synthesizer based on
  Mutable Clouds, adding VCAs, mutes, sliders and an aux CV control, running
  Super Parasites firmware with multiple processing modes.
details: |-
  Featuring an anodized matte black aluminum panel - also available in silver

  Typhoon is a brand new 16hp module that has the sound and features of Microcell, with the sliders that have been so popular on Monsoon. Featuring VCAs and mutes for the inputs and outputs, an aux control to send cv to all unpatched parameters, a trigger button and all the hidden functions broken out to individual controls. Super Parasites firmware is installed, so you will have 8 different modes to play with. All the regular Clouds modes, all the Parasites modes, and Kammerl Beat Repeat and Spectral Clouds modes. A handy Typhoon-specific guide can be found here

  Comes with rack screws, power cable, and washers
