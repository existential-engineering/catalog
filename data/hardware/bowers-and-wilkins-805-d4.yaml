  including the Diamond dome tweeter and the Solid Body Tweeter-on-Top.
details: |-
  The 805 D4 is the most compact model in the 800 Series Diamond D4 range, a two-way vented-box stand-mount loudspeaker built around the Diamond dome tweeter and the Solid Body Tweeter-on-Top housing. It is a passive design rated for amplifiers of 50W to 120W into 8 ohms with no mains connection of its own, and stands are not included.

  Smaller than its tower siblings, it is no lightweight: a beautifully constructed Reverse-Wrap cabinet, stiff aluminium bass pods and a 165mm (6.5in) Continuum mid-bass cone afford it exceptional bass extension and scale for a relatively compact speaker.

  Bowers & Wilkins describes the Diamond dome tweeter as one of its most significant accomplishments of the past two decades, an ultra-stiff and supremely accurate dome combining low mass, exceptional stiffness and outstanding accuracy. The Solid Body Tweeter-on-Top housing has an elongated form with a longer tube-loading system and is milled from a single solid block of aluminium to better resist resonance, and is carefully decoupled from the cabinet.

  The reverse-wrap orientation of the cabinet lets the sensitive crossover components sit in their own dedicated space inside the enclosure, which the company says benefits both performance and serviceability. It also notes that the speaker terminals were upgraded for this generation.

  The cabinet measures 440mm high by 240mm wide by 373mm deep and weighs 15.55kg. Finishes are Gloss Black, White, Satin Rosenut and Satin Walnut, with black or grey grilles. Frequency response is quoted at 42Hz to 28kHz (+/-3dB) with a sensitivity of 88dB and a nominal 8 ohm impedance (4.6 ohm minimum).
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Diamond tweeter, Solid body Tweeter-on-Top, Continuum cone bass/mid, Matrix, Anti-Resonance plug, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 165mm (6.5in) Continuum cone bass midrange
  - Frequency range: 34Hz to 35kHz
  - Frequency response: 42Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 88dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis)
  - Nominal impedance: 8 ohms (minimum 4.6 ohms)
  - Recommended amplifier power: 50W to 120W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 440mm (17.3 in), Width 240mm (9.4 in), Depth 373mm (14.7 in)
  - Net weight: 15.55kg (34.3 lb)
  - Cabinet finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
  - Grille finishes: Black, Grey
  - Stands are not included
