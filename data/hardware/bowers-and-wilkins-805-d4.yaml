description: The 805 D4 is the most compact model in Bowers & Wilkins' 800
  Series Diamond range - a stand-mount loudspeaker built around a Diamond dome
  tweeter in a Solid Body Tweeter-on-Top housing and a Continuum cone
  bass/midrange driver.
details: |-
  The 805 D4 is a 2-way vented-box stand-mount loudspeaker that brings the flagship engineering of Bowers & Wilkins' 800 Series Diamond range into a compact enclosure. Despite its modest footprint, it pairs a Diamond dome tweeter with a 165mm Continuum cone bass/midrange driver for a wide, detailed presentation.

  High frequencies are handled by a 25mm Diamond dome tweeter mounted in the Solid Body Tweeter-on-Top assembly, decoupling the tweeter mechanically from the main cabinet. An Anti-Resonance Plug behind the dome works to push residual resonances out of the audible band.

  Bass and midrange duties are handled by a single 165mm Continuum cone driver in a Matrix-braced, Reverse-Wrap cabinet vented by a Flowport. Aluminium bass pods and revised cabinet detailing extend low-frequency reach to 34Hz, with response measured at 42Hz to 28kHz (+/-3dB).

  With a sensitivity of 88dB and a nominal 8Ω impedance (4.6Ω minimum), the 805 D4 is rated for amplifiers between 50W and 120W into 8Ω on unclipped programme. The cabinet is finished by hand and offered in Gloss Black, White, Satin Rosenut, or Satin Walnut, with Black or Grey grilles available.
specs: |-
  - System: 2-way vented-box
  - High-frequency driver: 1x 25mm (1 in) Diamond dome tweeter
  - Bass/midrange driver: 1x 165mm (6.5 in) Continuum cone
  - Frequency range: 34Hz to 35kHz
  - Frequency response: 42Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 88dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: <1% (90Hz-20kHz); <0.3% (120Hz-20kHz) at 90dB, 1m on axis
  - Nominal impedance: 8Ω (minimum 4.6Ω)
  - Recommended amplifier power: 50W-120W into 8Ω on unclipped programme
  - Max recommended cable impedance: 0.1Ω
  - Height: 440mm (17.3 in)
  - Width: 240mm (9.4 in)
  - Depth: 373mm (14.7 in)
  - Weight: 15.55kg (34.3 lb)
  - Finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
  - Grilles: Black, Grey
