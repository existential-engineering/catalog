description: A side-address small diaphragm condenser microphone for accurate
  and detailed spot micing. Retro-industrial styling, good feedback rejection.
  Effective for live or studio use.
details: |-
  Edna combines retro-industrial styling with accurate, detailed sound. It is built for spot micing and is effective for live or studio use.

  Edna is a small-diaphragm side-address condenser microphone in a lollipop-style housing made from plumbing flanges and stainless steel bolts. It is acoustically very accurate, with a full, even frequency response, a neutral, natural character and a very smooth high end. Because of its clarity and fast transient response it excels with acoustic instruments, especially guitar, but also violin, mandolin and cello, and it compares well with any high-quality small-diaphragm condenser.

  A cardioid pickup pattern with strong rejection of off-pattern sound makes for easy use in a live mix. Ear Trumpet Labs suggests Edna for acoustic instruments, live or in the studio.
specs: |-
  - Hand-made microphone with unique appearance
  - Side address
  - Lollipop-style housing made from plumbing flanges and stainless steel bolts
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, small (16 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -41.9 dB (8 mV/Pa)
