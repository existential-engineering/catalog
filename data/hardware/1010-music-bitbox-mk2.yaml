description: Bitbox mk2 is a 26 HP Eurorack sampling module with a 3.5 inch
  touchscreen, offering sample, clip, slicer, and granular playback modes
  triggered by touch, CV gates, or MIDI. It streams samples up to 4 GB directly
  from a microSD card and records Eurorack-level audio through its stereo input
  pair.
details: |-
  Bitbox mk2 delivers powerful sampling and mangling for Eurorack. With this module you can add recording, sample playback, clip launching, slicing, granular sounds and musically intelligent looping capabilities to your Eurorack rig. With a 3.5 inch touchscreen, bitbox mk2 makes easy work of selecting, editing, and tweaking your samples. You can stream large samples of up to 4 GB file size straight from the microSD card. Interact with other musical components via CV and MIDI. Tweak your configurations to get them just right, then save them to multiple presets for future reuse. With the new bitbox mk2 hardware, you can now do more with the new more powerful processor.

  You can also download fxbox and synthbox firmware from the 1010music forum and install it on your bitbox mk2 to get three modules in one. Swap to the fxbox firmware to get effects processing, or the synthbox firmware to play with wavetable synthesis.

  Next Generation Sampling Module for Eurorack: the bitbox mk2 is a follow up to the original bitbox module. It has all the features of the original and adds effects and mixing capabilities that take advantage of a faster, more powerful processor and improved touch screen.

  Sample Playback:
  - Play up to 24 polyphonic notes when samples fit in the 64 MB of internal memory, or up to 8 larger samples streaming directly from the microSD card
  - Configure 16 sample pads per preset as single or multi-samples, clips, slicers, granular pads, or new recordings
  - Stream long samples from the microSD card with a max sample size of 4 GB, many hours of audio
  - Trigger samples with the touch screen, CV gate inputs, or MIDI input
  - Use MIDI for polyphonic playback of samples or slices, and to control sample recording
  - Choose from trigger, toggle, and gate launch modes
  - Tweak playback through parameters including start position, length, pitch, level, filter, loop mode, launch quantization, ADSR, exclusive grouping, clip synchronization, slice placement and sequencing, grain size, grain spread, grain count, and MIDI note/channel mapping

  Sample Recording:
  - Record Eurorack-level audio from a stereo audio input pair
  - Configure each pad for stereo or mono recording, with the option to synchronize start/stop to clock inputs
  - Trigger recording via audio level threshold, or set a fixed recording length for perfectly sized loops
  - Enable immediate playback after recording for live looping
  - Record up to 4 hours in length, stored as WAV files on the microSD card

  Sample Modes: 5 playback modes covering one-shots and loops (sample mode), time-synchronized loops with constant-pitch time shifting (clip mode), skipping between slices of a WAV (slicer mode), and rich granular textures (granular mode)

  External Control and Synchronization:
  - Playback can be immediate or synchronized to internal clock, TRS clock in, or MIDI clock in/out
  - Trigger each pad independently through a dedicated gate input, or via MIDI note per pad
  - Play single or multi-sample pads pitch-shifted using MIDI notes or CV, and trigger sample slices using MIDI notes or CV
  - Modulate sample and effect parameters through the MIDI input and up to 8 CV signals, with a Learn mode for quick MIDI CC mapping

  Module Features:
  - 3.5 inch diagonal touchscreen for exploring module features
  - Double the processing power of the original bitbox
  - Built-in reverb and delay
  - Import/export WAV files via microSD card on Mac or PC
  - Save and recall multiple presets
  - Flipped UI mode to mount the unit with the screen on the bottom

  What's Included: a bitbox mk2 Eurorack module, a microSD card with a bank of demo presets and samples, a Eurorack power cable, a bitbox mk2 Quick Start guide, and a MIDI adapter.
specs: |-
  - 26 HP Eurorack module
  - Module dimensions including knobs: 5.25 x 5 x 1.75 in; depth behind front panel with ribbon cable: 1.25 in
  - Power: +12V 400mA, -12V 0mA, 5V 0mA
  - 24-bit ADC and DAC
  - 3.5 inch diagonal touchscreen
  - 16 sample pads per preset; 5 playback modes (sample, multi-sample, clip, slicer, granular)
  - 64 MB internal memory cache; microSD streaming up to 4 GB per sample file
  - Up to 24 polyphonic notes from internal memory, or up to 8 larger samples streamed from microSD; 32 simultaneous voices absolute maximum
  - Supports 1- or 2-channel WAV files at 16/24/32-bit resolution, any sample rate (48kHz preferred)
  - microSD card slot, tested with cards up to 256 GB
  - MIDI: mini TRS input, compatible with both Type A and Type B wiring, no adapter needed
  - CV/Gate: dedicated gate input per pad (16 total, unlabeled front-panel grid) and up to 8 CV modulator inputs (unlabeled front-panel grid); DC-coupled, -5V to +5V trigger range
  - Dedicated CV clock input, DC-coupled
  - Audio: stereo input pair (In 1, In 2) for recording; 2 stereo output pairs (Out 1/Out 2, FX 1/FX 2), independently routable per pad as mono or stereo
  - Weight: 0.76 lbs; package dimensions: 6.5 x 5.5 x 2 in
  - Country of origin: China
  - SKU: 020
