description: Compact broadcast mixer and USB audio interface for streamers, with
  a Midas microphone preamp and on-board equalization, compression and gating.
details: |-
  GoXLR Mini is a desktop broadcast mixer and USB audio interface aimed at live streamers and content creators. It presents several separate USB audio devices to a Windows host, so individual applications can be assigned to their own faders and ridden independently without tabbing out of a game.

  The microphone channel uses the same Midas low-noise preamp as the larger GoXLR, with a condenser setting in the app that supplies phantom power for microphones that need it. Equalization, compression and gating run on the unit's own hardware rather than on the host CPU.

  A censor button bleeps the microphone and a cough button mutes it while held. Lighting, audio routing, mute modes and profiles are configured in the GoXLR app, which is required to operate the unit and is published for Windows only.

  Rear-panel connections cover an XLR microphone input, line in and line out on 1/8 inch jacks, an optical input for a games console, and a USB port that carries audio to the host and powers the unit. A headset microphone input and a headphone output sit on the front edge.
specs: |-
  - Four channel faders with LED level displays
  - Midas low-noise microphone preamp with a condenser setting that supplies phantom power
  - On-board equalization, compression and gating
  - Presents multiple USB audio devices to the host so application volumes can be assigned to separate faders
  - Censor button and cough button for the microphone
  - Customizable RGB lighting, routing, mute modes and profiles set in the app
  - USB bus powered, no external power supply
  - Designed for USB 2.0 host ports. USB 3.0 and 3.1 ports can cause audio dropouts and disconnections
  - Requires the GoXLR app, published for Windows 7, 8, 10 and 11, with no official macOS or Linux build
