details: |-
  4017 Sequencer

  The 4017 Sequencer Eurorack PCB and Front Panel Kit is a DIY 8-step CV and gate sequencer designed for Eurorack modular systems. Built around the classic 4017 integrated circuit, this sequencer offers hands-on control and flexible step manipulation for creating rhythmic and melodic patterns. Key Features

  Sequencing & Control

  This 4017-based sequencer allows deep hands-on interaction with your sequences. Each of the eight steps features an individual CV potentiometer for voltage control and a gate switch for rhythmic articulation. The rotary switch enables on-the-fly sequence length changes and instant resets at any step, making it easy to experiment with evolving patterns. For advanced timing control, the reset CV input allows precise manipulation of sequence length and rhythm, while the internal 555-based clock provides stable timing. The sequencer can synchronize to external clocks or act as a master clock using the clock out output. DIY Build & Front Panel

  This DIY Eurorack sequencer PCB and front panel kit is intended for intermediate to advanced builders. Due to the densely populated PCB and wiring requirements, careful assembly and soldering experience are required. The front panel is made from durable PCB material and screen printed by hand, reflecting the attention to detail and craftsmanship of Guru Gara Synth modules. Technical Specifications

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo
