description: The Chandler Limited TG2 Pre Amp/DI is a recreation of the rare EMI
  TG12428 pre amp used in EMI/Abbey Road recording and mastering consoles in the
  late 60s and early 70s. The sound was used on many famous recordings done at
  Abbey Road including The Beatles 'Abbey Road' and Pink Floyd 'Dark Side of the
  Moon.' This microphone pre-amplifier features the same discrete transformer
  balanced amplifiers as the TG series and offers a creamy, smooth tone with a
  surprisingly open, clear top end.
details: |-
  2-channel microphone preamplifier and DI. Recreation of the EMI TG12428 preamp used in EMI/Abbey Road consoles. Features discrete transformer balanced amplifiers. Gain switchable from +5 to +75 dB in 5 dB steps. Continuous output control. Input impedance switchable between 1200Ω and 300Ω. 2×1 output summing switchable. Phase 0/180° switchable. Phantom power +48V switchable. DI input 100kΩ impedance. Custom wound transformers. Requires external PSU-1 power supply (sold separately). Optional Stepped Output (Stereo) configuration available.
