description: >-
  The Korg R3 is a virtual analog synthesizer and 16-band vocoder that bridges the gap
  between the flagship Radias and the microKorg XL. Featuring 37 full-sized
  velocity-sensitive keys, dual timbres sharing 8-voice polyphony, and a gooseneck
  microphone for vocoding, it delivers sophisticated synthesis in a compact and portable
  package.
details: |-
  The R3 builds on the synthesis lineage of the Korg MS2000, combining a powerful virtual analog engine with an integrated vocoder. Each of its two timbres contains two oscillators with wave-shaping, a sub-oscillator, two LFOs, three ADSR envelopes, and two chain-able filters. Oscillator 1 offers 64 DWGS preset waveforms and formant wave options alongside traditional analog waveforms, while a Virtual Patch system provides up to six additional modulation routings for modular-like flexibility.

  The 16-band vocoder operates with internal or external carrier signals, and users can record up to sixteen 7.5-second Formant Motion sequences for playable vocal-like phrases. A 6-mode arpeggiator with toggle and latch controls adds rhythmic movement, and each timbre features a motion sequence recorder for capturing knob changes into evolving sound designs.

  The effects section is extensive, with two insert effects per timbre plus a master effect and variable 2-band EQ. Available effects include compressor, limiter, gate, wah, EQ, decimator, talk mod, delays, reverb, chorus, flanger, pitch shift, and cabinet modeling. The interface uses a rotary encoder with four assignable knobs encircled by LED halos and an Original Value indicator to streamline sound programming.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: 2 timbres
  - Oscillators: 2 per timbre with waveform mod, cross-mod, unison, VPM
  - Waveforms: Saw, pulse, triangle, sine, formant, noise, DWGS, audio in
  - LFOs: 2 per timbre (saw, square, triangle, sample & hold, random)
  - Filters: 2 chain-able per timbre (Filter 1: 12/24dB LPF, HPF, BPF; Filter 2: LPF, HPF, BPF, comb)
  - Envelopes: 3 ADSR per timbre (pitch, filter, assignable)
  - Vocoder: 16-band with gooseneck microphone
  - Arpeggiator: 8-step with up, down, alt1, alt2, random, trigger modes
  - Effects: 2 insert effects per timbre, 1 master effect, 2-band EQ
  - Memory: 128 user programs
  - Keyboard: 37 keys, velocity-sensitive
  - Connections: MIDI in/out/thru, pedal input, switch input
