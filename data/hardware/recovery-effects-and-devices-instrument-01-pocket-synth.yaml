details: |-
  Made to order: Orders will be processed and shipped within 3-4 business days. INSTRUMENT 01: POCKET SYNTH

  (Limited Edition)

  Instrument 01 is the pocket-sized version of The Mystic desktop synth. It is an Arduino-based FM drone synth with 5 knobs for controlling pitch, modulation, rate, carrier frequency, and carrier frequency modulation. This versatile device can be used as a standalone instrument to create glitchy FM synth tones. Additionally, it can be connected to your effects pedal chain and your semi-modular or modular gear to produce complex waveforms. Whether you are an experienced player or new to synths, this pocket-sized device is a powerful sound source that packs a punch! Instrument 01 is powered by a standard 9vdc negative tip power supply ( sold separately ). Instrument 01 manual

  Visit our Instagram account for more demos
