details: |-
  2 Channel Effects Mixer with Traktor Scratch Duo 2.

  The DJM-T1 is the first TRAKTOR certified mixer designed specifically to natively control all of the software’s advanced new features. The DJM-T1 is the complete solution: a hybrid mixer, a controller and audio interface in one unit. Also included in the box is a copy of TRAKTOR SCRATCH DUO 2 software , along with the CONTROL CD and vinyl needed for DVS scratch control. All that’s left is to connect your CDJs or turntables to the mixer and the software does the rest. The DJM-T1 brings the included software’s exciting new features to life straight out of the box – particularly the eagerly awaited Sample Decks . Alongside the two scratch decks, DJs can open a pair of Sample Decks and load up to four loops or samples in each – for amazing loops and remixing on the fly. DJs won’t need to touch the computer as all browsing, loading and even cue, play and nudge features are available should the turntables go down . There’s a bank of dedicated controls for TRAKTOR’s Advanced and Chained effects and the included software provides six stunning FX . Scratch DJs will be glad to see essential crossfader adjustments such as lag, tension, curve and reverse functions. The onboard soundcard and MIDI interface lets DJs connect to a computer with a single USB cable and there’s a dedicated output channel to easily record your set straight back into the mixer. Inheriting the sound quality design of our industry-leading DJM-900NXS and DJM-2000 , the DJM-T1 delivers a clear and powerful club sound every time.
