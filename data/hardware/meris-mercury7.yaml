description: Pro Audio Heritage in a Pedalboard Friendly Design
details: |-
  Mercury7 takes guitars and synths to ambient worlds with real-time tactile controls, an extensive modulation matrix, intra-tank pitch regeneration, and ambient swell.

  Infinite permutations lead in new musical directions. An infinite tail can be swelled and modulated, and a cavernous, beautiful space can be bent and warped into oblivion.

  Mercury7 provides stereo input and output, with switchable input/output headroom level for guitar, synthesizer or line levels. The multi-function EXP jack supports MIDI in/out via a compatible MIDI-to-TRS conversion box, preset switching, an expression pedal, or a tap switch, and presets are available via an external 4-preset switch or MIDI.
specs: |-
  - Handcrafted algorithmic reverbs: Ultraplate (lush plate with a fast build) and Cathedra (massive, ethereal algorithm with a slow build)
  - Intra-tank pitch vector regeneration: octave down, slight pitch up/down, 5th up, or octave up
  - High and low frequency damping
  - Auto Swell envelope (variable and foot-switchable)
  - Signal to Noise Ratio: -115 dB (typical)
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Current draw: < 150 mA
  - Dimensions: 4.25" wide x 4.5" long x 2" tall
