details: |-
  The Harmony Foundation Series is for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra FS GA is a versatile acoustic guitar for players of all styles, with a single cutaway that brings high-fret access to play. Coming in an attractive natural gloss finish, it features a solid spruce top, with solid mahogany sides and back, to produce a full-bodied blend of balanced, warm, and complex tones. The satin-finished mahogany neck provides straightness, while the rosewood fretboard adds smoothness to the playing experience. Solid spruce X-bracing enhances sound projection, while the bone nut and saddle contribute to superior tone and resonance. The premium tonewoods, that age gracefully, also ensure that the Terra FS GA only improves in appearance and sound with each passing year. The Terra FS GA Cutaway comes strung with D'Addario EXP16 coated strings for lasting bright tones. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
