description: A Custom Shop Fuzz Bender in a chrome holographic flake finish with
  oversized aluminium knobs, carrying the three-transistor hybrid fuzz circuit
  with silicon and germanium stages and active gyrator bass and treble controls.
details: |-
  The Ghost Prism Custom Shop edition of the Fuzz Bender uses a chrome powder coat finish with a prismatic holographic flake, premium oversized aluminium knobs and a clear bevelled 'ghost' UV graphic. Depending on the viewing angle, the finish can hide the holographic flake and show the chrome powder coat instead. Keeley notes that the chrome powder coat may show an occasional small imperfection.

  The Fuzz Bender is a five-knob, three-transistor fuzz that combines high-gain silicon with germanium. Two gyrators work as an active EQ, giving over 20 dB of boost or cut at 100 Hz and 10 kHz, which allows fuzz voicings that a typical square-wave circuit cannot reach.

  The circuit is built around vintage Japanese germanium transistors. A Bias control sets the attack and decay of each note, covering fat square waves, angular fuzz and glitchy, velcro-like attacks. Each Ghost Prism unit is hand assembled, the input and output jacks are top mounted, and the bypass is true bypass.
