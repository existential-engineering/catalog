description: The Klipsch The Sevens II are Dolby Atmos 6.5" powered speakers
  featuring HDMI 2.1 eARC, Dirac Live room correction, built-in phono stage, and
  multi-platform wireless streaming.
details: |-
  The Sevens II are Dolby Atmos 6.5" powered speakers representing Klipsch's legacy, now supercharged with an all-new electronics package powered by Onkyo technology. HDMI 2.1 In/Out with eARC support makes The Sevens II the hub of your entertainment setup, delivering simpler connectivity and full next-gen compatibility.

  Dirac Live room correction technology — with a standard license included — automatically measures and corrects for the acoustic properties of your room. Wireless hi-res stereo is supported at 48kHz over Bluetooth and 96kHz over wired connections.

  A dedicated analog input with a built-in phono stage eliminates the need for a separate phono preamp, allowing direct connection of a turntable. The one-piece BMC (Bulk Molding Compound) baffle minimizes resonance and coloration.

  Built-in streaming platforms include Google Cast, Apple AirPlay 2, Spotify Connect, Tidal Connect, and Qobuz Connect. Control is available via the top-mounted metal control wheel, backlit remote, and the Klipsch Connect mobile app.

  Available in Walnut, Red Oak, and Black finishes.
