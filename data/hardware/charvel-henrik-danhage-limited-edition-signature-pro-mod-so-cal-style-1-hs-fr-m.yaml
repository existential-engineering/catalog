description: The Henrik Danhage Limited Edition Signature Pro-Mod So-Cal Style 1
  HS FR M honors the Swedish progressive metal guitarist of Evergrey with a
  heavily road-worn instrument built for hard-hitting performance. The ash
  So-Cal Style 1 body is finished in a semi-gloss White Relic lacquer with a
  3-ply white pickguard, suggesting years of stage wear straight out of the
  case.
details: |-
  Limited-edition artist signature model for Evergrey's Henrik Danhage. Heavily relic'd White finish with relic'd maple neck, fingerboard, and chrome hardware for an authentic road-worn look. Streamlined single-knob control layout with push/push pickup selector. Top-mount Floyd Rose 1000 Series double-locking tremolo for aggressive whammy work. Reverse licensed Fender Stratocaster headstock. Speed Neck profile with heel-mount truss rod wheel.
specs: |-
  - Model Number: 2966035855
  - Body Shape: So-Cal Style 1
  - Body Material: Ash
  - Body Finish: White Relic, semi-gloss lacquer
  - Pickguard: 3-ply white
  - Neck Material: Relic'd Maple with graphite-reinforcement rods (bolt-on)
  - Neck Profile: Speed Neck
  - Scale Length: 25.5"
  - Fingerboard Material: Relic'd Maple
  - Fingerboard Radius: 12"-16" compound
  - Frets: 22 jumbo
  - Inlays: Black dot
  - Nut: Floyd Rose locking
  - Truss Rod: Heel-mount adjustment wheel
  - Bridge Pickup: Seymour Duncan JB TB-4 humbucker
  - Neck Pickup: DiMarzio Area 67 DP419CR single-coil
  - Pickup Configuration: HS
  - Controls: Single volume knob (labeled "Tone") with push/push pickup selector
  - Pickup Switching: Down = bridge; Up = neck
  - Bridge: Floyd Rose 1000 Series double-locking tremolo (top-mount)
  - Tuning Machines: Charvel-branded die-cast
  - Hardware Finish: Relic'd chrome
  - Headstock: Reverse licensed Fender Stratocaster
  - Strings: Nickel-plated steel (.009-.042)
  - Number of Strings: 6
  - Orientation: Right-hand
  - Case: Charvel hardshell gig bag
