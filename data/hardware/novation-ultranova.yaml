description: >-
  The Ultranova is Novation's portable digital synthesizer reviving their classic Nova line, featuring a powerful 20-voice
  engine with wavetable capabilities, a built-in 12-band vocoder, and an extensive effects chain in a compact 37-key format.
details: |-
  Novation introduced the Ultranova as a modern successor to their beloved Nova synthesizer range from the late 1990s. Housed in a durable blue plastic enclosure with eye-catching illuminated controls, it packed one of the company's most ambitious synth engines into a lightweight, portable package that delivered excellent value for its feature set.

  The synthesis architecture provides three oscillators per voice with an impressive selection of waveforms including sawtooth, square, pulse, triangle, sine, wavetable, and super saw options. Two filters, six envelopes, and a 20-slot modulation matrix give sound designers deep control over timbre shaping. A chain of five simultaneous effects including distortion, compression, chorus, delay, and reverb rounds out the signal path.

  One of the Ultranova's standout features is its built-in 12-band vocoder, which ships with a gooseneck microphone and supports custom XLR mic connections. The vocoder enables creative voice-to-preset mapping that opens up expressive performance possibilities beyond typical keyboard synthesis.

  Connectivity is generous for its class, with balanced audio inputs, four unbalanced outputs, MIDI In/Out/Thru, USB, S/PDIF digital output, sustain and expression pedal inputs, and a headphone jack. The unit can run on USB power or via an AC adapter, making it a genuinely portable production tool.
specs: |-
  - Polyphony: 20 voices
  - Monotimbral (1 part)
  - 3 oscillators per voice
  - Waveforms: Saw, Square, Pulse, Triangle, Sine, Wavetable, Super Saw, Noise, Sub Oscillator
  - 3 LFOs with multiple waveform options
  - 2 filters
  - 6 envelopes
  - 20-slot modulation matrix
  - 5-chain effects: Distortion, Compressor, Chorus/Phaser, Delay, Reverb, Gator, EQ
  - 12-band vocoder with gooseneck microphone
  - 256 RAM patches, 128 ROM patches
  - 37-key keyboard with velocity and aftertouch
  - 33-pattern arpeggiator
  - MIDI In/Out/Thru
  - USB, S/PDIF output
  - Balanced audio inputs, 4 unbalanced outputs
  - Sustain and expression pedal inputs
  - Headphone output
releaseDate: "2011"
