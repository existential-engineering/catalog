description: EC4 is a universal controller for all kinds of MIDI controllable
  hard- and software. The all-rounder has 16 gridless push-encoders, 7 function
  buttons and a large OLED-display.
details: |-
  EC4 is a universal controller for all kinds of MIDI controllable hard- and software. The all-rounder has 16 gridless push-encoders, 7 function buttons and a large OLED-display. Encoders and pushbuttons are switchable to 16 groups that allow controlling a total of 512 control parameters per setup. The display shows the current values of all controls or editable encoder, group and setup names.

  Various kinds of MIDI commands are possible, like program change, pitch bend, aftertouch, NRPN, and control change in relative and absolute mode with different acceleration amounts. All these properties are easily and efficiently programmable on the device, allowing personalized customisation for each separate control.

  The encoders can work as high resolution 14bit controllers too (NRPN, control change or pitch bend). This makes them suitable for sensitive parameters like resonating filter cutoffs.

  Use the internal 16 setups to save your individual settings. Backup and restore of all settings by SysEx dumps are possible too. The factory settings are perfect to control music and video software products out of the box, so any additional device programming is not necessary for many applications.

  The little box is also a great extension for your Ableton Live setup. There you can control all the continuous parameters like track volumes, device parameters, send amounts, and track pannings. A special control surface script for Ableton Live, including all necessary mappings, is enclosed in the package.
specs: |-
  - Universal controller for all kinds of MIDI controllable hard- and software
  - iPad compatible
  - Control surface script for Ableton Live with extended display control
  - USB interface, class compliant, no driver necessary (consumption under 500 mW)
  - USB bus-powered
  - MIDI in and out ports on minijack sockets (type B) with routing and merge functionality, cannot power external devices
  - 16 gridless push encoders, resolution of 72 pulses per revolution
  - Encoder push buttons can send separate commands, each fully programmable
  - 4 x 20 character OLED display shows control values (numeric or bar), names and programming data
  - Editable names for encoders, groups and setups (4 characters per name)
  - 14 bit high resolution encoder mode for sensitive parameters
  - Programmable value ranges with min and max values
  - Data feedback avoids value jumps
  - All encoders fully programmable in the device by channel, type, number, mode and name
  - Command types include control change (CC), pitch bend, NRPN, program change and notes
  - Advanced programming functions like copy, paste and fill
  - 16 independent groups per setup for 16 encoders (256 commands per setup)
  - Learn function for fast assignment to incoming MIDI commands
  - 15 preset memories for initializing of all controls
  - Snapshot function sends all control commands within a group with one click
  - Link function links up to 16 encoders or pushbuttons for multiple commands
  - 16 setups with backup and restore function contain all controller settings including names
  - Very compact design in a black casing (180 x 105 x 70 mm, 350 g)
  - Requires a PC or Mac with a free USB port (1.0 or higher) or a USB hub, connected by the enclosed USB cable
  - Works with an iPad running iOS 5 or higher via Apple's camera connection kit
  - Connects to a MIDI device with a standard MIDI in port (5-pin DIN socket) by the enclosed adapter cable
  - USB power adapter (5 V, min 100 mA) needed if you want to control only MIDI gear
