description: A limited-run fuzz and overdrive built around a vintage 1960s
  Mullard OC44 germanium transistor, with a JFET tube-amp front end, an external
  Tone control and switchable diode clipping.
details: |-
  The Fuzz Head OC44 is a later take on the original Fuzz Head. It keeps the differential-pair transistor arrangement at the heart of that design and adds a JFET tube-amp stage on the front end, followed by a germanium transistor gain stage using a vintage 1960s black glass Mullard OC44.

  This version carries a power supply section built specifically for the Mullard OC44, which Keeley credits for its smoother character and longer sustain. The Tone control was reworked and moved to the outside of the enclosure, and the diode clipping can be removed entirely for a more aggressive overdrive rather than fuzz.

  The run was limited to 40 units and was the first to carry Keeley's Red Triangle marking, used to designate very limited builds. The original Fuzz Head won a Guitar Player magazine Best Stomp Box award, and the key elements of that design are retained here.
