description: The RFX-1100 is a 1U 19-inch rack digital reverb and multi-effect processor carrying 33 effects across three banks (REVERB, EFFECTS and MIX&SFX), each with 11 character or variation settings for 363 preset programs in total. A front-panel XLR and phone combo microphone input with its own on/off switch mixes with the rear line inputs and feeds the vocoder effect.
details: |-
  The RFX-1100 is a 1U 19-inch rack digital reverb and multi-effect processor carrying 33 effects, 11 in each of three banks picked by a selector, with 11 character or variation settings per effect for 363 preset programs in total. The reverb effects alone account for 121 of those settings.

  The REVERB bank covers Hall, Room and Plate programs plus banks aimed at a source, VOCAL for singers and narration, AMBIENCE for whole stereo mixes, PERCUSSION for drums, ENSEMBLE for strings, brass and organ, and POWER for weight on kicks, snares, distorted guitar and vocals. A DIMENSION group works on spatial spread instead, converting stereo to mono and back, swapping left and right and bouncing reverb between the channels, and the bank finishes with a GATE program whose tail is cut by a threshold and a REVERSE program that behaves like tape run backwards.

  The EFFECTS bank holds a compressor and limiter, a delay reaching 1486 ms with cross-feedback, a stereo pitch shifter spanning a 7 cent detune to an octave either way, a three-voice-per-channel stereo chorus, a wide-range stereo flanger, a phaser and an effect sweeping from tremolo to auto-panning, plus four pairings of two effects either in series or split across the left and right channels. The MIX&SFX bank adds four mixdown programs, a microphone simulator that gives a dynamic mic the character of a high-quality condenser with a limiter and treble enhancer, a guitar cabinet simulator with combo and stack models, a rotary speaker simulation with its own drive, a ring modulator with short delay, a resonant filter with manual or envelope-driven cutoff, a Lo-Fi effect that degrades the sound deliberately, and a 10 or 18 band vocoder with optional chorus and distortion.

  Conversion is 18-bit at 44.1 kHz, oversampled 64 times in and 8 times out. Rear 1/4-inch jacks take a line-level stereo or mono source at -10 to +4 dBm, with the L/MONO jack feeding both channels alone, and a guitar wants a preamp or pedal in front of it. The front panel carries a dedicated microphone input on an XLR-3-31 and phone combo jack, balanced at 4.5 kohm with pin 2 hot or unbalanced at 50 kohm, with its own on/off switch and indicator. It normally mixes with the rear inputs and becomes the control signal for the vocoder. A rear BYPASS jack takes the optional FS01 foot switch to turn effects on and off, and the unit runs from AC mains through a detachable power cord supplied with it. The chassis is 482 x 115 x 44 mm on a metal frame and weighs 1.8 kg.
specs: |-
  - 1U 19-inch rack digital reverb and multi-effect processor, EIA and DIN rack compatible (rack screws not supplied)
  - 33 effects (11 effects x 3 banks), 363 preset programs counting the 11 character or variation settings per effect
  - REVERB bank: HALL, ROOM, PLATE, VOCAL, AMBIENCE, DIMENSION, PERCUSSION, ENSEMBLE, POWER, GATE, REVERSE. 121 reverb settings in total
  - EFFECTS bank: COMP LIM, DELAY, PITCH, CHORUS, FLANGER, PHASER, TRM-PAN, plus DLY+REV and CHO+REV in series and DLY/REV and FLG/REV split across the two channels in parallel
  - MIX&SFX bank: POWER MIX, WIDE MIX, BOOST MIX, VOCAL MIX, MIC SIMULATOR, CABINET SIM, ROTARY, RING MOD, RESONANCE, Lo-Fi EFX, VOCODER
  - Delay time up to 1486 ms with normal or cross feedback, 743 ms in the combined delay and reverb programs
  - Pitch shift from a 7 cent detune to 1200 cents (one octave) up or down, stereo
  - VOCODER selectable 10 or 18 filter bands, fast or slow attack, with optional chorus and distortion. Controlled from MIC IN or from the right input
  - RESONANCE filter cutoff set manually or driven automatically by the input signal envelope
  - Sampling frequency 44.1 kHz, A/D converter 18-bit with 64 times oversampling, D/A converter 18-bit with 8 times oversampling
  - Line inputs: 2 x standard mono phone jack, input impedance 10 kohm mono and 20 kohm stereo, reference input level -10 to +4 dBm. L/MONO alone feeds both channels
  - Microphone input: XLR-3-31 and standard phone combo jack on the front panel, balanced 4.5 kohm with pin 2 hot or unbalanced 50 kohm, reference input level -56 dBm, with a MIC ON/OFF switch and indicator
  - Outputs: 2 x standard mono phone jack, output impedance 500 ohm, reference output level -10 to +4 dBm
  - Control input: BYPASS jack for the optional FS01 foot switch, which turns the effects on and off
  - Front panel controls: MIC ON/OFF, INPUT, OUTPUT, MIX (dry/wet), REVERB TIME/ADJUST, CHARACTER/VARIATION selector, BANK selector, EFFECT TYPE selector, POWER switch, level meter with CLIP LED
  - A high-impedance source such as an electric guitar should be routed through a preamplifier or a guitar effect first. Line-level sources belong on the rear inputs rather than MIC IN
  - Power: AC mains, 100-120 V or 220-240 V 50/60 Hz depending on the unit's voltage range, through the supplied detachable power cord, with a grounded plug
  - Dimensions 482 (W) x 115 (D) x 44 (H) mm
  - Weight 1.8 kg
