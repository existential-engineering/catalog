description: >-
  The Oberheim OB-Xk is a MIDI keyboard controller from 1986, originally
  designed to control Oberheim's Matrix and Xpander synthesizer modules. It
  features a 61-key velocity and aftertouch-sensitive keyboard with classic
  OB-style pitch and modulation controllers housed in a solid black metal case
  with wooden end-cheeks.
details: |-
  The OB-Xk was built as a companion controller for Oberheim's rack-mounted synthesizer modules, particularly the Matrix-12 and Xpander. It provided musicians with a high-quality keyboard interface and direct front-panel access to the first 100 single patches and 100 multi patches on connected MIDI modules, though selecting additional patches required an external MIDI controller.

  The keyboard supports transpose functionality up to two octaves or by half-step increments, and can be split into three independent zones with basic hold and chord memory features. The built-in arpeggiator accepts both internal and external clock sources, and the unit can transmit sequencer song select, start, and stop commands to connected equipment.

  While the OB-Xk offered practical control options during the mid-1980s MIDI era, its single-channel MIDI output and limited programming capabilities make it relatively basic by modern standards. It remains a niche collector's item valued primarily for its classic Oberheim build quality and aesthetics.
specs: |-
  - 61 velocity and aftertouch-sensitive keys
  - Two OB-style pitch/modulation controllers
  - One assignable continuous control slider
  - 100 single patch memories
  - 100 multi patch memories
  - 3-zone keyboard split
  - Hold and chord memory functions
  - Arpeggiator with internal and external clock
  - MIDI Out (1 channel)
  - Sequencer song select, start, and stop transmission
  - Solid black metal case with wooden end-cheeks
