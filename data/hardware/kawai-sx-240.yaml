description: >-
  The Kawai SX-240 is an eight-voice fully programmable polyphonic analog synthesizer
  released in 1984, originally marketed under the Teisco brand in Japan. It features two
  DCOs and a sub-oscillator per voice, delivering a big, wide analog sound suited for
  leads, basses, pads, and strings. The synthesizer includes split and dual modes, a
  built-in 1,500-note sequencer, and chord memory for expanded performance capabilities.
details: |-
  The SX-240 arrived during the peak of the digital revolution, which hindered its market adoption despite solid engineering. It competed against the Korg Polysix and Roland Juno 6/60 but occupied a unique sonic territory. Originally sold under the Teisco brand in Japan, it was marketed internationally as the Kawai SX-240. Though it never gained major attention at launch, the synthesizer has developed a dedicated following among analog enthusiasts.

    The instrument employs a data-wheel for parameter editing, similar to the Roland Alpha Juno and Moog Source. Four scroll buttons allow parameter selection, with LED indicators showing which controls are active. An electroluminescent display enables alphanumeric naming of custom sounds. The 61-key keyboard supports poly-8, poly-4, and mono modes, with the mono mode allowing all 24 oscillators to stack for powerful monophonic synthesis.

    The SX-240 has a big, wide and full analog sound, courtesy of its two analog DCOs and one sub-oscillator per voice. An Ensemble effect adds warmth to pads and strings, while a ring-mod effect labeled Brass provides additional tonal variety. The filter employs eight SSM 2044 chips creating a distinctive 24dB/octave four-pole lowpass response with self-oscillation around resonance values of 98-99. Both portamento and glissando are available, which was uncommon on synths of that era.

    Vintage units frequently suffer from NI-Cad battery failures preventing patch memory retention. Replacement or Li-Ion conversion is recommended to prevent leakage damage to the circuit board.
specs: |-
  - Polyphony: 8 voices
    - Multitimbral: Dual and Split modes
    - Oscillators: 2 DCOs plus 1 sub-oscillator per voice (24 oscillators total)
    - Waveforms: Saw, Sine, Pulse with pulse width and PWM
    - LFO: 1 with 3 waveforms (saw, square, triangle); routes to DCO, VCA, or VCF
    - Filter: 24dB/octave four-pole lowpass (SSM 2044 chips) with resonance, cutoff, envelope amount, and dedicated ADSR
    - Envelopes: 1 VCA ADSR, 1 VCF ADSR
    - Effects: Chorus (Ensemble), Hold, Portamento, Glissando
    - Sequencer: 1,500-note capacity with 8 memory slots
    - Keyboard: 61 keys
    - Memory: 48 tone patch memories
    - MIDI: In, Out, Thru
    - Modes: Poly-8, Poly-4, Mono
