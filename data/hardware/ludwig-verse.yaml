description: >-
  Iconic Ludwig Sound - Reimagined for Electronics. The Verse combines
  expressive pad technology, deep sample detail, and full studio integration in
  one smart, adaptable kit. With Bluetooth audio, onboard recording, and full
  MIDI control, it's ready for practice and performances.
details: |-
  Every pad is responsive, every sound dynamic — perfect for the intermediate drummer. With 380 custom sounds, including kits inspired by Ludwig's most iconic drums, plus 40 total kit slots (20 factory/20 user), Verse gives you the feel and flexibility to lock in your sound, style, and development.

  Featuring dual-zone 8" pads for the drums, these pads respond to dynamics across head and rim, while 10" dual-zone cymbals with choke capture expressive stops and accents. A variable hi-hat delivers closed, half-open, and fully open tones, along with foot-chick and splash for realistic pedal articulation. The Verse electronic drum set is equipped with a single bass drum pedal to get you started right out of the box.

  Practice-forward features like onboard recording let you capture takes in seconds, while Bluetooth audio-in and a 1/8" aux input make it easy to play along with your favorite tracks and lesson apps. Complete MIDI functionality with multiple MIDI maps to integrate with all software.
specs: |-
  - 380 custom sounds, including kits inspired by iconic Ludwig drums
  - 40 total kit slots (20 factory presets, 20 user-customizable)
  - Dual-zone 8" mesh drum pads, responsive across head and rim
  - 10" dual-zone cymbals with choke functionality
  - Variable hi-hat with closed, half-open, and fully open tones; foot-chick and splash articulation
  - Single bass drum pedal included
  - Onboard recording
  - Bluetooth audio input
  - 1/8" auxiliary input
  - Complete MIDI functionality with multiple MIDI maps
