description: "SoundGrid motherboard for the B80 and B16 Mothership, featuring
  one Ethernet port for 64-channel Waves SoundGrid audio-over-Ethernet
  connectivity, providing extremely low-latency audio processing over 1 Gbps
  Ethernet."
specs: |-
  - 1 SoundGrid Ethernet port
  - 64-channel IO at 44.1 kHz, 48 kHz, 88.2 kHz, 96 kHz
  - 1 Gbps Ethernet network
  - Waves SoundGrid audio-over-Ethernet technology
  - Real-time audio processing on Intel-based SoundGrid servers
  - 2 BNC word clock outputs
  - 1 BNC word clock input
  - Compatible with B80 and B16 Mothership
