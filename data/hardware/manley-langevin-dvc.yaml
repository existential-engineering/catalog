details: |-
  The Langevin DVC is a dual-channel (vocal combo) 2U rack-mount channel strip combining transformer-coupled discrete mic preamps, shelf EQ, and electro-optical limiting in a single chassis.

  Hand-built in California, the DVC provides two independent channels suitable for stereo tracking or two mono vocal sources.
