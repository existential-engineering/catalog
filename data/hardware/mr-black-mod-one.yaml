description: A 100% analog BBD modulation pedal that combines chorus, flanger
  and high-band flanger in one unit, blendable on the fly, with tap-tempo, six
  LFO waveforms and click-less relay bypass.
details: |-
  The Mod.One is a fully analog, bucket-brigade (BBD) modulation pedal designed from scratch to capture and combine three related time-based effects in one box: chorus, flanger and high-band flanger. It excels at each on its own and, unusually, lets you blend and morph between them on the fly.

  Mr. Black expanded the analog core well beyond a typical BBD design, improving the fidelity and headroom BBDs are usually limited by, adding multiple modulation waveforms, and including precise tap-tempo. Five controls dial in a liquid chorus, swirling flange or airy high-band flange, blend them into new time-modulation tones, and then intensify the result via a dedicated Enhance control.

  A wide-range LFO stretches to a 20-second period via tap-tempo and can be applied to any of six distinct waveforms (triangle, sine, ramp-up, hypertriangle, ramp-down and step), shown in real time on a dedicated LED indicator. A second-generation click-less relay true-bypass and high-endurance non-volatile storage round out the feature set.

  Mr. Black notes the Mod.One is extremely time-consuming to build, as each unit is meticulously calibrated and aligned by hand, so stock can be limited. It runs on standard 9V pedal power at 53mA, with matched impedances for clean integration into a chain. Original design by Jack Deville.
specs: |-
  - 100% pure-analog signal path (BBD modulation)
  - Analog chorus, flanger and high-band flanger, blendable on the fly
  - "Enhance" control to intensify the modulation
  - Dry frequency response: ~15Hz - ~22KHz; wet (BBD): ~66.4Hz - ~11.6KHz
  - Delay sweep range: 31mS - 0.5mS
  - Speed knob LFO: ~0.16Hz - 8Hz; tap-tempo: 0.05Hz (20s) - 83Hz (12mS)
  - Six LFO waveforms: triangle, sine, ramp-up, hypertriangle, ramp-down, step
  - Tap-tempo with real-time LED waveform/rate indicator
  - High-endurance non-volatile preset storage
  - Click-less true-bypass (2nd generation relay)
  - Input Impedance: ~470KΩ
  - Output Impedance: ~2KΩ
  - 9VDC 2.1mm negative center-pin power (>100mA regulated supply recommended)
  - 53mA current draw @ 9VDC
  - 4.75" x 3.725" x 2.10" (120.65mm x 64.62mm x 53.54mm)
  - 13.25oz (375g)
