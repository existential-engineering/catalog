description: Four-in-one analog overdrive and distortion with switchable tone
  stacks and clipping stages, and selectable bypass.
details: |-
  The Blues Disorder combines two different overdrive and distortion circuits to give four drives in one box. Two switches separate the tone control from the clipping section, so mixing and matching them produces two hybrid sounds alongside the two originals. With both switches up the pedal is a smooth, soft-clipping Bluesy Breaker, a low gain soft-clipping overdrive. With both switches down it is a fuller, hard-clipping OC distortion. The whole pedal stays a simple three-knob overdrive. It is designed and manufactured entirely by Keeley, in an in-house aluminium enclosure.

  Two tone control circuits are available. With the Tone switch down in the OC position there is an active midrange boost followed by a high-frequency roll-off. With it up in the BB position there is no active mid boost, only a simple high-frequency filter, which gives a more transparent overdrive and response.

  Both styles of diode clipping are available, and where the diodes sit in the circuit affects gain and compression. The OC position of the Drive toggle gives hard clipping for an edgier, more aggressive tone, and the BB position gives soft clipping, which sounds like a softly overdriven tube amplifier.

  Bypass can be switched between buffered and true bypass by holding the footswitch for two seconds. The buffer keeps the signal strong and clear when the pedal is off and prevents the pops and clicks of true-bypass switching, while true bypass suits rigs where a buffer would affect the tone of a vintage pedal. The pedal is designed, engineered and manufactured in Oklahoma City, and won a Premier Guitar Premier Gear Award.
