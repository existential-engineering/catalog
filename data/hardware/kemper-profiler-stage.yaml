url: https://www.kemper-amps.com/shop/profiler-stage-b.html
description: Floorboard featuring a complete PROFILER including PROFILING with
  integrated Remote-grade switching system. The all-in-one design can be
  extended with up to four pedals for real-time control, and offers two FX
  loops.
details: |-
  The PROFILER Stage is the floor/pedalboard form-factor version of the Kemper PROFILER, combining the full amp profiling engine with an integrated Remote-grade switching system for seamless live performance use.

  The all-in-one design can be extended with up to four external pedals for real-time control, and features two FX loops for integrating external effects into the signal chain. It connects in stereo to a PA system and supports mono or stereo monitoring with guitar cabinets.

  Built with ultra-rugged construction and lightweight materials, the PROFILER Stage delivers the complete PROFILER experience — including full PROFILING capture technology and the entire PROFILER effects suite — in a compact pedalboard footprint.

  Wi-Fi connectivity enables wireless integration with Rig Manager software, while USB audio (8 channels at 44.1 kHz) and S/PDIF I/O provide flexible recording and integration options.
specs: |-
  - Dimensions: W 47 cm (18.5 in) × D 26 cm (10.24 in) × H 8.5 cm (3.35 in)
  - Weight: 4.1 kg (9.09 lbs) (MK 2)
  - INPUT: 1/4-inch TS unbalanced, 127 dB dynamic range, 1 megohm impedance
  - RETURN 1–4: 1/4-inch TRS balanced with ground lifts, 105 dB dynamic range
  - MAIN OUTPUT L/R: XLR balanced + 1/4-inch TS unbalanced, +4 dBu
  - MONITOR OUTPUT L/R: 1/4-inch TS unbalanced, +4 dBu
  - SEND 1+2: 1/4-inch TS unbalanced with ground lift, +4 dBu, >108 dB dynamic range
  - HEADPHONE: 3.5 mm TRS stereo, 330 mW @ 32 ohms, 220 mW @ 600 ohms
  - S/PDIF I/O: RCA coax, 44.1/48/88.2/96 kHz (24-bit)
  - PEDAL: Four 1/4-inch TRS inputs (switch or expression pedal)
  - MIDI IN/OUT: 5-pin DIN connectors
  - USB: USB 2.0 (FS), USB-A and USB-B connectors; 8 USB audio channels at 44.1 kHz
  - Wi-Fi: 2.4 GHz, WPA2 PSK
  - Line Voltage: 100–230 V AC, max. 0.5 A, 50–60 Hz
  - Operating Temperature: 5° to 45° C
  - Two FX loops, integrated Remote-grade switching system
