description: A full range overdrive on the Super Phat Mod platform, modified
  with Andy Timmons, with a new tone switch voiced for humbuckers and
  asymmetrical diode and LED clipping.
details: |-
  The Super AT Mod Overdrive takes the Super Phat Mod platform and reworks it with Andy Timmons, whose board has long carried a Keeley modded Blues Driver. Two changes are audible immediately: the Timmons modification accentuates both the tone control and the way gain is created, so the circuit sounds and responds more like a tube amplifier in a stompbox.

  The tone switch is a new circuit design. Its AT mode is voiced for humbuckers, with lower mid-bass frequencies so humbuckers sound tighter and more transparent. Flipped to the right, the original Keeley PHAT mode remains available, which suits single coils wanting more power behind the sound.

  The clipping is the other large change. The pedal returns to Robert Keeley's original clipping style, first used in the Keeley Blues Driver Phat Mod twenty years earlier, and this edition makes it asymmetrical by combining regular diodes with LEDs, which clip at a higher voltage. Asymmetry is what gives tube biasing, output transformers and a push-pull output section their character, and it keeps chord work and harmonies cleaner and tighter without reducing gain.

  The topology is similar to classic California tube amps, with JFET transistors used in place of tubes and the filtering of an amp tone stack designed into the pedal.
