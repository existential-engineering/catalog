description: Vintage-inspired tall 4x12" angled guitar speaker cabinet. The
  1960TV is a mono cab loaded with four 12" Celestion G12M-25 speakers — the
  warm, broken-in voicing associated with the original 1960s Marshall stacks —
  and is built in the taller cabinet format favoured for classic British blues
  and rock tones. Power handling is 100W with a 16Ω speaker output impedance,
  and the cab takes a single 1/4" speaker input. The angled top baffle helps
  project sound on stage and the cabinet is designed to pair with vintage-style
  Marshall heads.
