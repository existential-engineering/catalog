description: The HeadRush FRFR-8 CAB is a full-range, flat-response amp cabinet
  for modeling pedal rigs with 480W of power, an 8 inch speaker, and Bluetooth
  connectivity.
details: |-
  The FRFR-8 CAB is a full-range, flat-response active cabinet for modern modeling pedal rigs, with 480W of power, a full-range 8 inch speaker and Bluetooth connectivity. It is built for guitarists and bassists who need a powerful and authentic platform to amplify a fine-tuned modeling pedal rig, and a custom-designed 8 inch woofer, a high-frequency compression driver and up to 480W of power deliver modeled tones through a clean, comprehensive harmonic spectrum with zero coloration.

  Whether the source is Neural Amp Modeler, Super Clones, amp profiles, third-party IRs or another capture technology, the cabinet is tailor-made to reproduce it rather than recolor it. Pure and transparent, it is custom designed for guitarists and bassists using modern amp and pedal modelers, with up to 480 watts of power on tap for environments from the practice space to outdoor amphitheaters.

  Short for Full-Range, Flat-Response, the cabinet is crafted from schematic to component to performance for a faithful recreation of the sound the player intended the crowd to hear. Where a traditional guitar amplifier intentionally colors the signal, this guitar and bass cab translates the tone through a custom-designed low-frequency woofer, a 1 inch high-frequency compression driver and a wide 90 degree conical horn for consistently pristine response.

  The closed-back golden-era amp look and feel runs down to the tweed grill cloth, with sleek black tolex, a custom HeadRush logo and a built-in kickstand like classic 60s amps that sets an optimal listening angle while performing. At 14.1 by 8.5 by 14.3 inches and 24.1 lbs, it is the ultra-compact and portable member of the FRFR CAB Series, intended for home use, recording, rehearsal and smaller venues, where the FRFR-12 CAB delivers greater output and stage presence.

  A Baxandall 3-band EQ and variable hi-cut filter adapt the tone to the room, stage or rehearsal space without rebuilding presets inside the modeling pedal. A balanced combo XLR and 1/4 inch TRS line input accepts any modeling pedal, a balanced XLR DI output feeds the PA or chains another cabinet, and two cabs driven from one modeler run in stereo for stage-filling reverb, delay and modulation. Built-in Bluetooth 5.3 streams audio from a phone or tablet for practice, jamming along to a setlist and running backing tracks.
specs: |-
  - Output power: 480W peak, 240W RMS (200W low frequency, 40W high frequency)
  - Maximum SPL: 125 dB
  - Low-frequency driver: custom-designed 8.0 inch (203.2 mm) woofer for guitar and bass
  - High-frequency driver: 1.0 inch (25.4 mm) compression driver
  - Frequency response: 60 Hz to 20 kHz
  - Dispersion: 90 degree conical horn
  - Connectors: one balanced XLR plus 1/4 inch (6.35 mm) TRS combo line input, one balanced XLR DI output, one IEC power cable input
  - EQ: 3-band Baxandall EQ with variable high-frequency cutoff
  - Cabinet type: closed-back with kickstand and top handle
  - Cabinet materials: Tolex wrapped wood with cloth grille
  - Wireless: Bluetooth 5.3, Classic Audio
  - Bluetooth range: up to 30 m (100 ft)
  - Bluetooth transmitter: 2402 to 2480 MHz, 4 dBm, GFSK and pi/4-DQPSK modulation
  - Power: IEC inlet, 100 to 120V 50/60 Hz or 220 to 240V 50/60 Hz, 600W consumption
  - Dimensions (w x d x h): 14.1 x 8.5 x 14.3 inches (36.3 x 21.6 x 36.3 cm)
  - Weight: 24.1 lbs (10.9 kg)
  - Accepts the line-level output of virtually any modeling pedal, amp modeler, profiler or digital guitar processor
  - Two cabinets can be paired for a stereo guitar rig
  - Ultra-compact, portable format for home use, recording, rehearsal and smaller venues
