details: |-
  Inspired by the pivotal and prolific years of Gretsch's 1950s and early '60s golden age, Vintage Select Edition guitars are designed for the player who appreciates the finest in musical instrument heritage. The G6134T-58 Vintage Select '58 Penguin with Bigsby presents a finely crafted new take on that rarest of Gretsch birds.

  1958 saw Gretsch's venerable Penguin guitar decked out with a pair of Filter'Tron pickups, complementing the signature sound of its chambered mahogany body, which magnifies harmonic richness by letting air resonate between the top and body.

  Dual TV Jones Classic Pickups: Dual TV Jones Classic pickups replicate that unmistakable vintage Filter'Tron sound with rich, three-dimensional clarity.

  Vintage Appointments: Gold sparkle binding, Pearloid Neo-Classic thumbnail inlays, gold plexi pickguard, jeweled G-Arrow knobs and a Bigsby B3GB tailpiece complete the period-correct look in Vintage White nitrocellulose lacquer.
