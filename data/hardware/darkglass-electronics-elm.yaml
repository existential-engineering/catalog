description: The Element is a headphone amplifier with cabinet simulation for
  practicing, performing, or recording, fully compatible with bass guitars,
  guitars, or any kind of instrument.
details: |-
  With a uniquely innovative approach, the Element is an immensely practical tool to empower players. Fully compatible with bass guitars, guitars, or any kind of instrument, this headphone amplifier offers cabinet simulation for practicing, performing, or recording. It carries five user-exchangeable IR cabinet simulations, two headphone outputs with independent volume control, and Bluetooth audio playback for backing tracks. Up to 30 dB of attenuation lets it handle up to a 900W amplifier input, and Bluetooth and USB connectivity link it to the Darkglass Suite. Connections include an Instrument In and Instrument Out on 6.3 mm jacks, a 3.5 mm Aux In, a balanced XLR Direct Output, two 3.5 mm headphone outputs, a USB-C port, and a 9-12V DC power input.
specs: |-
  - 5 user-exchangeable IR cabinet simulations
  - Two headphone outputs with independent volume control
  - Bluetooth audio playback for backing tracks
  - Up to -30dB of attenuation to handle up to 900W amplifier input
  - Bluetooth and USB to connect to Darkglass Suite
  - Instrument In and Instrument Out (6.3 mm), Aux In (3.5 mm), balanced XLR Direct Output
