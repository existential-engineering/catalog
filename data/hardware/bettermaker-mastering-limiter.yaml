description: A hybrid analog/digital mastering limiter with a 100% analog signal
  path, plugin recall, and DAW automation, featuring frequency-dependent
  saturation, mid-side processing, and an extensive metering section. It is the
  discontinued predecessor to the Mastering Limiter 2.0.
details: |-
  The Bettermaker Mastering Limiter is a hybrid analog/digital mastering limiter featuring a 100% analog signal path combined with plugin recall and DAW automation. It includes frequency-dependent saturation, mid-side processing, an enhanced metering section, and a large LED touchscreen for control.

  The unit features two color modules providing odd and even harmonic saturation with internal EQ capability, allowing engineers to shape the tonal character of the limiting process. The limiting section offers both intelligent and manual release modes, a variable mix between limiting and clipping, and an optional clipping bypass.

  Metering capabilities are extensive, including VU, PPM, RMS, and Peak meters, LUFS measurement, K-metering, a 30-band FFT analyzer, a goniometer, and a correlation meter. The large LCD touchscreen provides access to all metering and control functions from the front panel.

  DAW integration is handled via USB, enabling a companion plugin to recall hardware settings and provide full DAW automation of the analog hardware. The Mastering Limiter is the predecessor to the Mastering Limiter 2.0 and is listed in the Legacy section of the Bettermaker website, with its final firmware update (v1.7, July 2022) and plugin update (v1.2.8, December 2023).
specs: |-
  - Maximum input level: +21.5 dBu (balanced)
  - Maximum output level: +23 dBu (THD < 0.1%)
  - Operating level: +4 dBu
  - Maximum gain reduction: 20 dB
  - Attack time: 0.1–250 ms
  - Release time: 0.01–1.3 s + intelligent release
  - Input impedance: 48 kΩ (balanced)
  - Output impedance: 50Ω + 50Ω (electronically balanced)
  - Frequency response: 5 Hz to 30 kHz, ±0.1 dB
  - Dynamic range: 107 dB @ +21 dBu, 20 kHz BW
  - THD+N: <0.03% at +4 dBu, unity gain, 20 kHz BW
  - Power consumption: 30 W
  - Enclosure: 2U rack-mount, 230 mm deep
  - Shipping weight: 5.5 kg
  - USB connection for plugin communication and firmware updates
  - 100% analog signal path
  - Two color modules with odd and even harmonic saturation
  - 30-band FFT analyzer, goniometer, correlation meter
  - VU / PPM / RMS / Peak / LUFS / K-metering
  - DAW automation support via companion plugin
  - Mid-side (MS) processing
  - Variable mix between limiting and clipping
  - U.S. Patent No. 10,693,428 B2
