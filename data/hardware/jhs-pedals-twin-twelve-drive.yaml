description: An all-analog channel drive pedal replicating the classic overdrive
  tones of the Silvertone 1484 Twin Twelve amplifier, with Volume, Drive, Bass,
  and Treble controls.
details: |-
  In 1963 Silvertone introduced the 60 Watt Model 1484 guitar amplifier. Originally a student model amplifier, the 1484 has since become legendary, hard to find, and coveted by some of the biggest names in music. Artists such as Beck, Death Cab For Cutie, The White Stripes/Jack White, and more recently Vampire Weekend and Coldplay have brought this rare amp to the forefront of popular music. The JHS Pedals Twin Twelve channel drive is the first ever all analog stomp box that replicates the classic preamp/overdrive tones only found in the Silvertone 1484 Twin Twelve amplifier.

  The heart of the JHS Pedals Twin Twelve are the discrete transistor stages that take the place of the original tubes found in the amplifier. Each transistor stage is meticulously hand tuned and adjusted for the perfect voltage. The circuit uses a charge pump that internally converts 9V DC Negative power up to 18 volts, giving more punch, better dynamic range, and an amp-like feel.

  The Twin Twelve has four controls: Volume, Drive, Bass, and Treble. The Volume control acts as the master volume, the Drive knob replicates cranking the amplifier's Volume control for more overdrive and tube-like saturation. The Bass and Treble controls are near-exact replications of the 1484's baxandall tone circuit.

  Can be used as an always-on preamp, an enhancer for your current rig, or as a powerful solo booster.
