details: |-
  The RP-504C II is a center channel speaker from Klipsch's Reference Premiere II series, engineered to deliver crystal-clear dialogue and lyrics with precision and efficiency. It features a new, larger 90° x 90° silicone composite hybrid Tractrix horn that provides incredibly efficient transfer of high-frequency waves into the listening area, creating a crisper, clearer sound.

  The exclusive 1" Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for enhanced, detailed performance. The LTS design allows the tweeter to travel in a perfectly linear motion, reducing distortion to near zero and improving overall sound accuracy.

  The four 5.25" Cerametallic woofers have been updated for flawless sound reproduction, minimum distortion, and maximum efficiency. The Cerametallic cone combines the light weight of aluminum with the rigidity of ceramic, resulting in a stiff yet light cone that moves with incredible accuracy.

  Tractrix port geometry allows for the most efficient, fastest air transfer from the cabinet, which reduces port noise for punchier low frequencies and cleaner, more powerful bass. The rear-firing Tractrix port is tuned to the cabinet volume for optimal performance.

  The cabinet features advanced internal bracing, satin-painted baffles, and furniture-grade vinyl finishes available in Ebony and Walnut. Audiophile-grade wire and aluminum binding posts ensure a clean, reliable connection to your amplifier or AV receiver.
