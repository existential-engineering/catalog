description: The DF1000 is a dual-channel automatic feedback-suppression
  processor whose detection algorithms find critical frequencies and apply up to
  32 filters per channel to eliminate feedback. It is aimed at any venue with a
  live sound system, from conference rooms to concert halls and houses of
  worship.
details: |-
  The DF1000 is a fully automatic feedback suppressor that requires no advance setup or tuning. It functions in real time with detection accuracy within one-sixth of a cycle, so once it is installed in line between the mixing console and the power amps the operator powers up, engages the front-panel Active button and leaves it running.

  Feedback suppression is the main function, but removing feedback also improves overall system performance: with annoying and potentially destructive feedback gone, a live sound system's output gain can be increased by as much as 10 dB to provide extra headroom.

  Using a fast feedback detection algorithm, the DF1000 locates up to 32 feedback frequencies per channel and sets extremely narrow notch filters, up to one thirtieth of an octave, to lower those frequencies while leaving the remainder of the signal virtually untouched.

  The unit works as a stereo front-of-house feedback eliminator, or channel 1 can serve mono front-of-house while channel 2 handles monitors, making a single-unit feedback control centre.

  Connectivity covers two balanced or unbalanced inputs on combination line-level XLR/TRS sockets and 3-pin Euroblock connectors, with outputs on balanced XLR and Euroblock connectors.
specs: |-
  - Dual-channel automatic feedback suppressor
  - Up to 32 notch filters per channel
  - Notch filter bandwidth down to 1/30th octave
  - Feedback detection accuracy within one sixth of a cycle
  - Output gain increase of up to 10 dB of additional headroom
  - 2 balanced/unbalanced line-level inputs on combination XLR/TRS sockets and 3-pin Euroblock connectors
  - Balanced XLR and Euroblock outputs
