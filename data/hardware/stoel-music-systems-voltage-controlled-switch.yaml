description: A Eurorack module providing two bi-directional electronically
  controlled switches that route a common jack to one of two other jacks based
  on an applied CV signal, supporting both audio and CV signals.
details: |-
  The Stoel Music Systems Dual Voltage-Controlled Switch provides two electronically controlled switches. The two switches are bi-directional so that the signal can flow in either direction. CV or audio signals are supported. Each switch can be used with one input (COM jack) that may be selectively routed to two different outputs (A or B), or as two inputs (A or B) that can be selected to go to one output (COM jack). Without CV input on the CV jack, the common jack is connected to the A jack. When CV is applied, the common jack is connected to the B jack. LEDs indicate whether A or B is connected to the COM jack. Technical Specifications

  Width
  4 HP

  Depth
  4 mm

  Current Draw
  +12V: 10mA, -12V: 0mA, +5V: 0mA
specs: |-
  - Two independent voltage-controlled switches
  - Signal flows in any direction
  - Supports audio or CV signals up to +/-12V
  - Four LEDs to indicate position of switches
  - High gloss white front panel with UV cured ink
