details: |-
  When it was introduced in 2010, the original POLYTUNE forever revolutionized the way musicians tune their instruments. Praised by professional and amateur players, guitar tuning instantly became as simple as Strum - Tune - Rock! So how do you make the best-selling polyphonic tuner even better? You take it to the next level by: providing multiple tuning modes, including polyphonic, chromatic, strobe and a variety of altered tunings; adding an onboard BONAFIDE BUFFER to preserve your tone over long cable runs and pedal board signal paths; and upgrading the LED display for even higher tuning accuracy. Say hello to your next tuner
