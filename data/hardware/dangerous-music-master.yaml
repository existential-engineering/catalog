description: Dangerous Music offered Chris Muth's mastering circuit designs to
  the public at affordable prices for the first time, and the MASTER quickly
  became a staple in mastering rooms everywhere.
details: |-
  The Dangerous MASTER is a 2-rack-space transfer console built around Chris Muth's mastering circuit designs, originally developed for custom high-end consoles used at facilities like Sterling Sound and Masterdisk. It sits at the center of an analog mastering chain, tying outboard EQs, compressors, limiters and de-essers together into a single signal path feeding a DAW's A/D converter.

  Two stereo inputs (front-panel selectable) feed a chain of three front-panel-switchable insert loops, with true hardwire bypass on each. Insert 2 doubles as an audiophile-grade all-analog Mid/Side (sum-and-difference) matrix with a dedicated Width control, letting engineers process the center and sides of a stereo mix independently.

  Three stereo outputs are provided: two main outputs (for feeding parallel A/D converters, tape machines, or a patchbay) and a dedicated monitor output that can switch between pre- and post-processing signal. The console can be expanded with a Dangerous Music LIAISON for additional insert points. In 2020 the MASTER was updated with a new chassis to match the rest of the Dangerous Music product line.
specs: |-
  - All connections: Balanced XLR, +4dBu nominal operating level
  - I/O: 2 stereo inputs, 3 stereo outputs (one dedicated monitor output)
  - Insert loops: 3 stereo, true hardwire bypass; Insert 2 also functions as a line-level Mid/Side matrix
  - Input/Output level control range: +/-5dB in 0.5dB steps
  - Width control: -4 to +6dB in 0.5dB steps
  - THD+Noise (audio band): < 0.0018%
  - IMD (60Hz + 4kHz, 4:1): < 0.0025%
  - Crosstalk rejection: > 111dB @ 1kHz
  - Headroom: > +27dBu (+23dBu in the M/S matrix, worst case)
  - Frequency response: within 0.2dB, 1Hz-100kHz
  - Noise floor: < -92dBu total energy in the audio band
  - Rack format: 2U (2 rack spaces)
  - Hand-built in the USA
