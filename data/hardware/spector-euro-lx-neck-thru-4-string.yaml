details: |-
  The Euro LX offers all the features that have made the Spector name famous around the globe. Inspired by the iconic NS-2, Euro LX basses feature a fully carved and contoured body, high-grade tonewoods, and professional-grade elec­tronics and hardware. For the first time ever, players can now choose between neck-thru and bolt-on construction in the Euro LX range. Each Euro LX bass, regardless of construction, is crafted using premium materials, including a European Alder body, figured European Maple top, and a 3-piece North American Maple neck combined with a Rosewood fingerboard for strength, stability, and sustain. These basses are then outfitted with a lightweight aluminum bridge for spot-on, reliable intonation. Premium active pickups from EMG provide the exceptional clarity, attack, and silent operation that Spector is known for. Spector is proud to offer the all-new Spector Legacy preamp for the Euro LX range. This new preamp was designed in collaboration with Darkglass Elec­tronics to deliver the classic 'Spector growl' heard on countless iconic recordings over the years. The newly revised Euro LX range is available in four distinct, hand-rubbed stains, including Transparent Black, Natural Sunburst, Haunted Moss, and Nightshade. Each of these enchanting colors features a durable and comfort­able matte finish. Rediscover the Spector experience with the all-new Euro LX lineup.
