description: "Erica Synths Black Wavetable VCO is a compact, fat sounding
  wavetable VCO that features 16+ banks of selected waves: classical synths, FM
  synths, Erica modular, vowels and others."
details: |-
  The Black Wavetable VCO is a compact wavetable oscillator carrying 16 wavetables of 16 waves each, drawn from classical synths, FM synths, Erica modular sources and vowel sounds. Voltage controlled wave surfing and bank surfing move through that material, and manual or voltage controlled bitcrush roughens it.

  The oscillator has a separate suboscillator output with three suboscillator waves at -1 and -2 octaves, a built in VCA and a wave morphing feature for a more pleasant sound. Additional ROM chips, sold separately, carry extra wavetables so the module can be adapted to a different style of making music.

  Erica Synths' Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black series, putting design and usability first, so the big knobs are assigned to the functions that make a difference in sound. Together the Black series modules form a range that makes an entire synthesizer.

  The panel is 12HP wide and the module is 25mm deep. The oscillator covers 30Hz to 5kHz, outputs -5V to +5V and takes CV between -10V and +10V. Firmware can be updated in the field.
specs: |-
  - 16 wavetables of 16 waves
  - Additional ROM chips with extra waves
  - VC wavesurf
  - VC bank surf
  - Manual and VC bitcrush
  - Built in VCA
  - Wave morphing
  - Suboscillator output
  - 3 suboscillator waves (-1 and -2 octaves)
  - Output signal level: -5V to +5V
  - Frequency range: 30Hz to 5kHz
  - CV input level: -10V to +10V
  - Power consumption: +48mA, -12mA
  - Module width: 12HP
  - Module depth: 25mm
