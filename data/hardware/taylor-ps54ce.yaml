description: The PS54ce is a 12-string Grand Auditorium acoustic-electric from
  Taylor's Presentation Series, featuring an Adirondack spruce top with Honduran
  rosewood back and sides, V-Class bracing, ES2 electronics, and premium
  appointments including Paua California Vine inlays and a radius ebony armrest.
details: |-
  The PS54ce sits at the pinnacle of Taylor's Presentation Series — a 12-string Grand Auditorium built around premium tonewoods and meticulous craftsmanship. Its Adirondack spruce top delivers exceptional headroom and dynamic range, while the rare Honduran rosewood back and sides contribute deep lows and shimmering overtones that define the 12-string voice.

  Taylor's V-Class bracing underpins the top, providing greater sustain, improved intonation across the neck, and more balanced response. The Venetian cutaway grants easy access to upper-register frets.

  Presentation Series appointments throughout: West African Crelicam Ebony fretboard, bridge, binding, and armrest; Paua California Vine inlays on fretboard and peghead; Paua purfling; Indian Rosewood pickguard; and Gotoh 510 Antique Gold tuners. Full gloss finish with shaded edgeburst on back and sides.

  Built-in Expression System 2 (ES2) electronics make the PS54ce equally at home on stage. Ships with a Deluxe Hardshell Case.
specs: |-
  - - Body Shape: Grand Auditorium
  - Strings: 12-String
  - Top: Adirondack Spruce (full gloss)
  - Back & Sides: Honduran Rosewood (full gloss, shaded edgeburst)
  - Bracing: V-Class
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Binding: West African Crelicam Ebony
  - Fretboard Inlay: Paua California Vine
  - Armrest: Radius Ebony
  - Pickguard: Indian Rosewood
  - Purfling: Paua
  - Scale Length: 25-1/2"
  - Nut Width: 1-7/8"
  - Tuners: Gotoh 510 Antique Gold
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze
  - Case: Deluxe hardshell case included
