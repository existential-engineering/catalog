description: A high-voltage distortion pedal that converts the instrument signal
  into a series of plasma discharges inside a sealed xenon-filled tube,
  producing a sharp, sizzling distortion with a natural noise gate and a very
  wide EQ.
details: |-
  High voltage distortion is a new and previously unexplored method of achieving signal clipping. The player is playing a bolt of electricity, and the electrical discharges produced by the Plasma tube are instantly converted back into an audio signal.

  Simplified wet signal chain: input, then the EQ if it is switched on, then a transformer to high voltage, then the xenon tube, then an antenna that picks up the electromagnetic vibrations surrounding the tube, then the EQ if it is switched off, then the blend with the clean signal, then the output.

  The Plasma Pedal is a revolutionary way of producing distortion by converting an instrument's signal into a series of high-voltage plasma discharges in a sealed xenon-filled tube. The result is an incredibly sharp and sizzling overdrive that is extremely clear and responsive. This patent-pending technology of high-voltage electric discharge also acts as a natural noise-gating device that creates strong contrasts between staccato notes, as well as eliminating unwanted noise and pick-up hum. The pedal's electric discharge tube produces visible bolts of lightning that react to the input signal.

  Natural noise gate: as soon as the player stops playing, the electrical discharge within the gas-filled tube is interrupted and the pedal will not produce any output signal at all. This allows extreme contrasts between individual notes, by eliminating all of the in-between noises created by the instrument's pick-ups or by humming strings.

  Blend: the blend control mixes in a clean or already overdriven sound to produce unique dirty tones, including a gated Plasma sound against an unaffected clean sound. It also works in an amplifier's FX loop.

  Extremely wide EQ: the Plasma Pedal loses the original dry input signal and creates a new signal from fluctuations in the electromagnetic field surrounding the gas-discharge tube, which allows for a very wide range of frequencies. Dedicated knobs boost and cut the lows and highs, and the EQ can be switched to affect only the wet sound or only the dry sound, which is especially suitable for bass.

  Unique harmonic saturation: converting the instrument's signal into a rapid series of electric discharges results in a large amount of non-linear harmonic saturation, which causes extremely rich and responsive attacks and brings out screeching sharp overtones and harmonics. These harmonic artifacts, produced as a by-product of the high voltage discharge, are uncommon in traditional signal amplification.
specs: |-
  - Unique frequency response with grainy and sizzling distortion textures. Sharp and massive pick attacks because of the naturally occurring noise gate.
  - Wide scope of picking response. From sputtery broken sounds to rhythmical staccato playing, all the way to rich and very long sustaining lead sounds.
  - Harmonic transparency allows even the most complex chords to be played. Suitable for and designed to use with guitars, bass, synthesizers and drum machines.
  - Two-band EQ, switchable to affect the wet or the dry signal
  - Blend control for mixing the clean signal with the Plasma signal
  - Expected xenon tube life is 10,000 to 70,000 hours of active playing, and the tube is replaceable
  - Power: standard 9V DC center-negative pedal supply, at least 250 mA (not included)
  - Made in Riga, Latvia
  - Lifetime warranty
