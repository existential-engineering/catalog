details: |-
  The SE CE 24 Standard Stoptail Satin brings the snap and response of a bolt-on guitar into an all-mahogany body for a warm, focused tone, now paired with the rock-solid stability of a stoptail bridge. The mahogany body features a thin satin finish that results in a highly resonant instrument, and the maple neck’s semi-gloss finish provides a smooth playing feel. Loaded with 85/15 “S” pickups and a push/pull tone control for coil tapping, the SE CE 24 Standard Stoptail Satin packs impressive versatility, whether you’re chasing classic humbucking growl or snappy single-coil sparkle. The fixed-bridge design offers guaranteed tuning consistency and simple setup, making it a great choice for players who want plug-and-play reliability. A great choice for players just starting out, or for anyone looking to add an affordable, reliable workhorse to their rig, the SE CE 24 Standard Stoptail Satin delivers classic PRS design and tone at an exceptional value. This is a guitar that can grow with you.
