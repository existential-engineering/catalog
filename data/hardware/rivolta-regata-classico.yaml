details: |-
  Introducing the all-new Regata Classico from Rivolta – a fresh, refined version of our best-selling semi-hollow Regata. With a redesigned headstock, sleek oval inlays, and an ultra-smooth satin neck, the Regata Classico delivers a striking blend of style and performance. Designed with comfort and playability in mind, the Regata Classico features a mahogany frame and weight-relieved mahogany center-block sandwiched between a pressed maple & mahogany top & back. The comfortable chunky C++ profile mahogany neck feels great in the hand and the 25" scale offers optimal string tension. The 24 jumbo frets offer an extended range rarely seen on the semi-hollowbody platform. The result of these design elements is an extremely lightweight, versatile instrument. A pair of PAF inspired humbuckers offer familiar, vintage inspired tones perfectly suited to genres ranging from jazz to blues, rock and beyond. Features and Specs

  Case Fit
specs: |-
  - Body Wood - Pressed Mahogany Ply with Maple Laminate Top & Back
  - Neck Wood - Set Mahogany
  - Fretboard Wood - Bound Rosewood
  - Inlays - Pearloid/MOTO Oval
  - Side Dots - Black
  - Scale - 25"
  - Nut Width - 1.687"
  - Neck Width @ 12th Fret - 2.080"
  - Neck Carve Shape - Chunky C+
  - Neck Depth @ 1st Fret - .850"
  - Neck Depth @ 12th Fret - .980"
  - Fretboard Radius - 12"
  - Frets - 24 Jumbo
  - Pickups - Neck - Rivolta Humbucker (8.4k) Bridge - Rivolta Humbucker (8.8k)
  - Wiring - Vol, Tone, 3-Way Toggle
  - Hardware - Chrome
  - Bridge - Tunematic (10mm String Spacing)
  - Tailpiece - Stoptail
