description: Cut, Boost, Sculpt and Fizzle The perfect multimode,
  voltage-controlled filter for sweet-sounding subtractive synthesis duties or
  to form the basis of more complex patches. Punchy, clean, and precise. Explore
  new sounds through the dual modulation inputs and dedicated low pass, high
  pass and band pass/notch outputs. This filter responds beautifully to audio
  rate FM and you can self-patch to get even more interesting filter responses.
  Adjust the Q for a sharp howl or use it as a sine VCO.
specs: |-
  - Width: 20HP
  - Depth: 35mm
  - Power: 27mA @ +12V, 30mA @ -12V
  - Dedicated 2-pole low pass (LP) and 2-pole high pass (HP) filter outputs
  - Switchable bandpass (BP) / notch (N) output
  - Optional +6dB input boost with asymmetric clipping circuit
  - PITCH input tracks 1V/Oct accurately over 4+ octaves
  - FM CV input with attenuverter
  - Self-oscillates to generate low-distortion sine waves from 2Hz to 20kHz at max Q
