description: >-
  The Roland MT-32 is a multi-timbral sound module released in 1987 that uses Linear
  Arithmetic Synthesis, the same engine found in the popular D-50 synthesizer. Designed as
  an affordable desktop companion for MIDI keyboards, sequencers, and computer software,
  it offers 128 preset sounds across 17 instrument groups along with built-in rhythm
  presets. The MT-32 became widely adopted in early PC gaming as a de facto standard for
  game music and sound effects.
details: |-
  The Roland MT-32 brought the company's Linear Arithmetic Synthesis technology to a compact, affordable desktop module aimed at home musicians and computer users. Employing the same basic LAS digital synthesis architecture as the D-50, it combined PCM waveform samples with subtractive synthesis to produce a wide palette of sounds spanning bass, strings, wind, percussion, and synthesizer timbres.

    The unit is 9-part multitimbral with 8-voice polyphony (32 partials), making it capable of playing multiple instrument parts simultaneously over MIDI. It includes 128 synth presets grouped into 17 instrument categories, 64 user-programmable memory slots, and 28 rhythm presets. A built-in digital reverb effect adds spatial depth to the output.

    On-board sound editing is not available directly from the front panel and can only be achieved externally through MIDI system exclusive messages. Six Part buttons on the face of the module provide quick access to changing patches within each part. A notable limitation is that all programmable memory is volatile and disappears when the unit is powered off, requiring MIDI SysEx dumps for storage.

    The MT-32 found its greatest legacy in the world of PC gaming during the late 1980s and early 1990s, where it became a de facto standard for game audio. Titles from Sierra On-Line, LucasArts, and many other developers supported the MT-32 directly, and its superior sound quality compared to FM synthesis-based sound cards like the AdLib made it a prized piece of hardware among PC gamers of the era.
specs: |-
  - Polyphony: 8 voices (32 partials)
    - Multitimbral: 9 parts
    - Synthesis: Linear Arithmetic Synthesis (LAS) with PCM
    - Presets: 128 synth sounds in 17 groups
    - User Memory: 64 programmable patches (volatile)
    - Rhythm Presets: 28
    - Effects: Digital reverb
    - Filter: None
    - Keyboard: None (sound module)
    - Control: MIDI
    - Year Produced: 1987
