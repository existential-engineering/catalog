url: https://empresseffects.com/products/compressor
description: "The Empress Compressor is a truly transparent, all-analog
  compressor pedal with the full set of studio-style controls: three ratios,
  independent attack and release, a mix knob for parallel compression, and a
  gain-reduction meter. It has been discontinued and replaced by the Compressor
  MKII and the Bass Compressor."
details: |-
  Compression is a tool used on pretty much every recording you will ever hear, yet this extremely useful and versatile tool is often overlooked by guitar players as part of their rig. Other compressor pedals are often limited by oversimplified controls and heavily colored sounds. Empress created a truly transparent compressor, complete with all the controls found in the studio.

  The result is a tool that allows for a wide range of sounds, from subtly adding sustain to getting the "quack" that country players love. A mix knob blends in the dry signal for an even more transparent, parallel-compression sound, and a gain-reduction meter shows what the compressor is doing at all times. It works great on bass as well as guitar.

  This original Compressor has been discontinued and replaced by the Compressor MKII and the Bass Compressor.
specs: |-
  - All-analog signal path
  - Extremely transparent dynamic control
  - 3 compression ratios: 2:1, 4:1, 10:1
  - Independent attack and release controls
  - Mix knob for parallel (New York style) compression
  - Metering of gain reduction, input, or both
  - True bypass
  - Works on guitar and bass
  - Input impedance 1M, output impedance 2.2k
  - Frequency response (-3dB) 40Hz - 35kHz
  - Distortion less than 0.1%, noise -101dB
  - Power 9 - 18V DC (negative tip), 2.1mm barrel connector, ~100mA draw
  - Die-cast aluminum enclosure
  - Dimensions 3.5" (L) x 4.5" (W) x 2" (H with controls), weight 1 lb
