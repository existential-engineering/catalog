description: >-
  A 16-bit sampler from the late 1980s offering 22kHz to 44.1kHz sampling with 2MB to 32MB
  RAM and advanced editing capabilities for looping, tuning, and filter control.
details: |-
  An oldie but a goodie. Akai's great sampler of the late eighties! It actually still stacks up pretty well even today! A 16-bit, 22kHz to 44.1kHz sampler with 2MB to 32MB of RAM. Editing and programming the S1000 is a very good precursor to the advanced S3000 series. There are lots of advanced edit capabilities for looping, truncating, sample merging, time comp/exp, tuning and even analog-like parameters to control its filters and envelopes. Individual outputs for each of the 16 voices, stereo mix out, stereo input, MIDI, and trigger inputs round out this machine as a professional vintage-status sampler that still proves to be very useful even today!

  The S1000KB was a nice big keyboard version of this mega-sampler. It featured a 61-note keyboard with velocity and aftertouch sensitivity and room for an 80MB hard disk. SCSI and digital interfaces were available on both keyboard and rack versions. Other variations include the S1000PB playback-only unit and the S1000HD with its built-in 40MB hard disk.

  Following the S1000 came the S1100 (1990) which boasted up to 32MB of sampling with 24-bit internal processing! Also on-board were a SCSI interface, digital effects, AES/EBU digital output, SMPTE reader/gen, and optional hard-disk recording.
specs: |-
  - Polyphony: 16 voices
  - Bit depth: 16-bit linear
  - Sample rate: 22kHz to 44.1kHz (variable)
  - Maximum sample time: 47.4 seconds at 22kHz
  - Filter: 18 dB/oct digital filter
  - Envelope: ADSR VCA
  - Memory: 2MB expandable to 32MB
  - Outputs: Individual outputs for each 16 voice, stereo mix out
  - Inputs: Stereo input, MIDI, trigger inputs
  - Control: MIDI
  - Production dates: 1988-1993
releaseDate: "1988"
