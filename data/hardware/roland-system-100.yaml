description: >-
  The Roland System 100 is a semi-modular monophonic analog synthesizer consisting of five
  interconnectable modules: the Synthesizer 101, Expander 102, Mixer 103, Sequencer 104,
  and Monitor Speakers 109. Produced from 1975 to 1979, it delivers a warm, classic Roland
  sound through its VCO, low-pass and high-pass filters, and ADSR envelopes. It is widely
  regarded as warmer-sounding than its successor, the System 100m, despite the latter's
  greater patching flexibility.
details: |-
  The System 100 represents Roland's approach to semi-modular synthesis, built around the Synthesizer 101 as its core module. The 101 is a fully self-contained analog mono-synth with a 37-note keyboard (lacking velocity and aftertouch), featuring VCO with pulse width modulation, LFO, low-pass and high-pass filters, VCA with ADSR envelope, white and pink noise generation, portamento/glide, and a built-in A-440Hz tuning oscillator similar to the Minimoog.

  The Expander 102 is a keyboard-less version of the 101 designed to stand upright behind the main synthesizer. It replaces the 101's portamento with sample-and-hold and swaps the noise generator for a ring modulator, while adding sync inputs. Multiple Expander 102 units can be stacked for increasingly thick, layered sounds.

  The Mixer 103 provides four inputs with individual sliders, mixing down to two outputs, and includes built-in spring reverb, VU meters, panning controls, and effect sends and returns. The Sequencer 104 offers a 12-step by 2-row pattern sequencer with variable gate time and the ability to run in series or parallel configurations.

  The System 100 is prized for its warm, classic vintage Roland sound. While Roland later expanded the concept with the System 100m and its greater patching freedom, many players and collectors consider the original System 100 to have a warmer and more characterful tone.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO per module (101 and 102) with PWM, tunable from 10 Hz to 10 kHz
  - Noise: White/Pink noise (Model 101); Ring Modulator (Model 102)
  - Filter: Low-pass and high-pass filters per module
  - Envelope: ADSR per module
  - Keyboard: 37 keys (Synthesizer 101 only), no velocity or aftertouch
  - Sequencer: 12 x 2 step pattern sequencer with variable gate time (Model 104)
  - Control: CV/Gate
  - Modules: Synthesizer 101, Expander 102, Mixer 103, Sequencer 104, Monitor Speakers 109
  - Date Produced: 1975-1979
