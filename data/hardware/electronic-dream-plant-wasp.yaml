description: >-
  The EDP Wasp is one of the earliest compact digital/analog hybrid monosynths, combining
  two digital oscillators with analog filters and envelopes in a distinctive
  black-and-yellow casing with flat touch-sensitive keys. Despite its toy-like appearance,
  it produces quality analog sounds suitable for bass, leads, and other classic monophonic
  patches.
details: |-
  The Wasp is a quirky and characterful synthesizer that belies its toyish appearance with genuinely useful analog sounds. True to its namesake, the instrument is finished in black and yellow, with a 2-octave keyboard using flat capacitive touch-sensitive keys that respond to electrostatic contact rather than mechanical pressure.

  Under the hood, the Wasp pairs two digital oscillators with analog filters, envelopes, and controls, making it one of the earliest compact digital/analog hybrid monosynths. The DCOs offer ramp and pulse width on oscillator one, square on oscillator two, plus a white noise generator. The filter section provides switchable lowpass, highpass, and bandpass modes at various slopes, while a versatile LFO offers sine, ramp, sawtooth, square, and sample-and-hold waveforms.

  Three variants were produced: the Wasp Deluxe (1979) added a standard 3-octave keyboard, wood panels, oscillator mixer, external audio input, larger speaker, and battery operation. The Wasp Special (1981) returned to a 2-octave touch-sensitive keyboard but added wood panels, a black-and-gold color scheme, and an internal power supply while removing the built-in speaker. An extremely rare keytar variant in guitar form was also produced, with only two ever made.

  Designed by Chris Huggett, who went on to create the OSCar, the Wasp has been used by 808 State, Vince Clarke, Nick Rhodes of Duran Duran, and many others. It connects to other EDP products like the Spider sequencer, Caterpillar master keyboard, and Gnat via a proprietary digital interface.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 DCOs
  - Waveforms: Ramp, pulse width (osc 1), square (osc 2), white noise
  - LFO: 1 (sine, ramp, sawtooth, square, sample-and-hold)
  - Filter: Switchable 12 dB/oct lowpass, highpass, 6 dB/oct bandpass
  - Keyboard: 25 capacitive touch keys (37 standard keys on Deluxe)
  - Memory: None
  - Control: EDP-Link In/Out (proprietary digital sockets)
releaseDate: "1978"
