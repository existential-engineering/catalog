description: >-
  A professional 16-bit sampling keyboard from Casio with 8-voice polyphony, variable sample rates
  up to 36kHz, additive synthesis, and waveform drawing capabilities.
details: |-
  Released in 1987, the Casio FZ-1 challenged the notion that Casio was strictly a consumer electronics company. It delivered genuinely professional sampling capabilities in a 61-key keyboard at a price point that undercut established competitors like Akai and E-mu, making 16-bit sampling accessible to a much wider range of musicians.

  The sampler section offered variable sample rates from 9kHz to 36kHz, providing a trade-off between fidelity and recording time. At the highest rate, users got 14.5 seconds of sampling; at the lowest, a generous 58 seconds. Up to 64 samples could reside in the 1MB internal memory, expandable to 2MB. Storage used standard 3.5-inch HD floppy disks. Beyond straightforward sampling, the FZ-1 included harmonic additive synthesis and a waveform drawing function for creating sounds from scratch.

  Eight voices of polyphony drove the sounds through a DCF with 8-stage analog-style filtering, giving sampled material more tonal shaping options than many competing samplers offered. The 61-key keyboard responded to both velocity and aftertouch, and eight individual outputs allowed for flexible mixing and processing of separate sounds. MIDI connectivity kept it integrated with the rest of a studio setup.

  The FZ-1 attracted a diverse roster of users including Underworld, Kronos Quartet, Dee Lite, 2 Live Crew, and Kitaro. A rackmount variant, the FZ-10M, featured double the internal memory at 2MB with XLR inputs and outputs. A German-market variant was sold by Hohner as the HS-1, notably adopted by Coldcut.
specs: |-
  - Polyphony: 8 voices
  - Keyboard: 61 keys with velocity and aftertouch
  - Sampler: 16-bit, variable 9kHz-36kHz sampling rates
  - Sample time: 58 seconds (9kHz) to 14.5 seconds (36kHz)
  - Memory: 1MB internal (expandable to 2MB); up to 64 samples
  - Filter: DCF 8-stage analog-style
  - Synthesis: Harmonic additive, waveform drawing
  - Outputs: 8 individual
  - Storage: 3.5" HD floppy disk
  - Control: MIDI
