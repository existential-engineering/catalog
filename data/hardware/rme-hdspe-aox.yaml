description: 512-channel PCI Express card combining dual Milan-compliant AVB
  network ports with headphone output, AES3, MIDI, and internal expansion
  headers for up to four MADI ports.
details: |-
  The HDSPe AoX-M is a 512-channel PCI Express card that combines dual network ports with headphone output, AES3, MIDI, and internal expansion headers for up to four MADI ports. It transmits and receives up to 512 channels of audio and provides numerous mixing and routing capabilities.

  Channel capacity scales with sample rate: 512 channels at 48 kHz / 24 bit, 256 channels at 96 kHz / 24 bit, and 128 channels at 192 kHz / 24 bit. Up to 128 channels are available in Milan-compliant 8-channel AVB stream format.

  TotalMix FX provides a 256 x 256 channel mixer with 46-bit internal resolution. SyncAlign guarantees sample-accurate alignment, SyncCheck verifies synchronization, and DIGICheck offers DSP-based level metering and analysis.

  The card is a single-slot PCIe x4 card that can be installed in external Thunderbolt enclosures or internal DAW/processor systems. Optional expansion boards (AoX-MADI-EXT-BNC, AoX-MADI-EXT-SFP) add up to four MADI ports via coaxial BNC or optical SFP.
specs: |-
  - 512-channel PCI Express x4 card
  - 512 channels at 48 kHz / 24 bit
  - 256 channels at 96 kHz / 24 bit
  - 128 channels at 192 kHz / 24 bit
  - 128 channels in Milan-compliant 8-channel AVB stream format
  - TotalMix FX: 256 x 256 channel mixer with 46-bit internal resolution
  - SyncAlign sample alignment guarantee
  - SyncCheck synchronization testing
  - DIGICheck DSP level metering
  - 2x Gigabit Ethernet (RJ45), 802.3 compliant, Milan/AVB network audio
  - 1x AES/EBU I/O, 2 channels up to 192 kHz
  - 1x Headphone output (1/4-inch stereo)
  - 1x MIDI I/O, 16 channels high-speed
  - Up to 4x MADI expansion ports via optional expansion boards (coaxial BNC or optical SFP)
  - Single-slot PCIe x4 form factor
  - Compatible with external Thunderbolt enclosures and internal DAW/processor systems
