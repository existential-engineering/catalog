description: Keeley's Funky, Tripped-Out Neutrino Envelope Filter and Auto Wah!
  This dynamic wah sound is based on your pick attack or strength. The harder
  you pick, the harder it "wahs"!
details: |-
  The Neutrino is Keeley's envelope filter and auto wah. The wah sweep follows pick attack and strength, so the harder the player picks, the more pronounced the filter movement.

  This listing is the first model of the pedal. The later Neutrino V2 moves the output volume control to the side of the enclosure and remains fully analog and opto-coupler based.
specs: |-
  - Envelope filter and auto wah, swept by pick attack
  - Superseded by the Neutrino V2, which adds a side-mounted output volume control
