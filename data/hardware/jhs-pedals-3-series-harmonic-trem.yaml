description: The JHS Pedals 3 Series Harmonic Trem recreates the Harmonic
  Tremolo circuit Leo Fender introduced in 1960 in his Bandmaster and Vibrasonic
  amps, which splits the signal into high and low frequency components for a
  dreamy, Uni-Vibe-like effect. Toggle up delivers classic amp tremolo while
  toggle down engages harmonic tremolo.
details: |-
  In 1960, Leo Fender introduced a circuit in his Bandmaster and Vibrasonic amps called the "Harmonic Tremolo." Essentially, the amp's signal was split into high frequency and low frequency components, with the output switching back and forth between the two, resulting in a dreamy effect similar to the Uni-Vibe.

  The 3 Series Harmonic Trem allows you to utilize Leo Fender's revolutionary effect in a package much easier to tote than a vintage amplifier. Toggle up is a great sounding amp trem, while toggle down is a take on the harmonic trem effect.
