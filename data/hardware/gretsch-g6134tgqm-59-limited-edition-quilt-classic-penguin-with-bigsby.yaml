details: |-
  Gretsch Quilt Classics are stylish renditions of classic vintage models, reborn with stunning highly figured quilt maple. A sophisticated rendition of the original masterpiece, the G6134TQM-59 Limited Quilt Classic Penguin combines opulent aesthetics with period-accurate features and appointments from the golden age of electric guitars. Satisfying eyes and ears with its golden tones and gleaming looks, this rare bird comes alive in the player's hands, singing with its distinctive voice at every strum.

  Figured Quilt Maple Top: An arched laminated quilt maple top in Forge Glow finish delivers opulent visual depth over a chambered mahogany body.

  Ray Butts Filter'Tron Pickups: Dual TV Jones Ray Butts Ful-Fidelity Filter'Tron pickups capture the classic Penguin voice with tighter bass and open, three-dimensional sound.

  Golden Era Appointments: Jeweled knobs, aged white binding, Mother of Pearl Neo-Classic thumbnail inlays, a gold plexi pickguard with Penguin graphic and a Bigsby B3GB vibrato complete the period-accurate look.
