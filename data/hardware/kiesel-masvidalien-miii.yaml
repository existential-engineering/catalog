details: |-
  The MIII occupies its own realm within the Kiesel line, a dimension defined by exclusive specs that set it apart. Its neck emerges from a hybrid construction process, achieving a near-equilibrium between wood and carbon fiber. Even its contours speak to its singularity, with aesthetic carvings that diverge from the Kyber Headless.

  Paul Masvidal on the design: "Through it all I learned the value of patience, of showing up and letting the instrument itself guide the process. What emerged is both personal and universal, a guitar designed for playability, balance, and substance. Guitars evolve as musicians and styles evolve, so this work is like a living organism that will keep expanding."

  The headless, multiscale build pairs a 1-piece swamp ash body under a 5A poplar burl top with a Hipshot fixed headless multiscale bridge and a 25.5" to 26.5" scale, finished at 5 lbs.
specs: |-
  - Scale length: 25.5" to 26.5" multiscale
  - Frets: 24 stainless steel jumbo, .110" wide x .055" tall
  - Body wood: 1-piece swamp ash with antique ash treatment, 37.25" long, 1.375" thick, 12.6" wide
  - Top wood: 5A poplar burl top with deep natural top wood body binding
  - Neck: tung-oiled maple with 2-way adjustable truss rod and hybrid 40% carbon fiber neck, thinner neck profile
  - Neck width: 1.71" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: Richlite Diamond Black board with 14" or 20" radius
  - Bridge: Hipshot fixed headless multiscale bridge, .4125" (10.5mm) spacing
  - Bridge pickup: Paul Masvidal Signature Focus bridge pickup
  - Neck pickup: Kiesel Beryllium single coil
  - Electronics: master volume control with push-pull coil splitting, 3-way pickup selector, flush mount output jack
  - Finish: ultra-thin Raw Tone translucent purple California burst with rear of body natural clear
  - Hardware: black
  - Inlays: white acrylic Paul Masvidal crop circle inlay with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 5 lbs
