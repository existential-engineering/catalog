description: The Chandler Limited TG Microphone is a solid-state large diaphragm
  condenser microphone with an on-board EMI Tape Equalizer section and Dual Tone
  System. The Dual Tone System and 5-setting Tape EQ create an extremely
  flexible microphone capable of rivaling the C414, FET47, U87, and U47.
details: |-
  The Chandler Limited TG Microphone is a solid-state large diaphragm condenser microphone featuring multiple TG amplifier circuits and an on-board Tape Equalizer with 5 settings adapted from the NAB/IEC tape equalizer found on vintage EMI TG12410 transfer consoles.

  The Dual Tone System provides two distinct voicings: System 'A' is TG mid-forward and harmonically rich, while the 'B' voicing has a more pristine, ribbon-like quality and handles extreme SPLs. Patterns are switchable between Cardioid and Omni. A 10 dB PAD is included, along with a frequency-selectable Low-Cut filter (90 Hz or 50 Hz).

  The TG Microphone requires a dedicated external PSU (included) rather than 48V phantom power, connected via a 4-pin Mogami cable. Includes shockmount, 25' Mogami 4-pin microphone cable, dedicated PSU, and a wooden case.
