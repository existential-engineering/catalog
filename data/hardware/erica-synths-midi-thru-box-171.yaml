url: https://www.ericasynths.lv/midi-thru-box-171/
description: Erica Synths midi thru box is professional quality, no latency, one
  midi In to 8 midi Through splitter in rigid aluminum case. It allows to
  connect up to 8 instruments to your sequencer or master keyboard and control
  them simultaneously without undesired delays and interference.
details: |-
  The Erica Synths MIDI Thru Box is a professional quality splitter from one MIDI input to eight MIDI thru outputs, housed in a rigid aluminium case. Up to eight instruments can be connected to a sequencer or master keyboard and controlled at the same time without undesired delays or interference.

  Latency is 60ns, which the maker describes as far below the limits of human perception, even subconscious perception, so the eight destinations receive their messages effectively together.

  Power comes from a universal 220V/110V to 12VDC adapter, which is supplied with the device.

  The unit weighs 0.7 kg and measures 220 x 33 x 50mm.
specs: |-
  - Latency 60ns
  - One MIDI input to 8 MIDI thru outputs
  - Rigid aluminium case
  - Power supply universal 220V/110V to 12VDC adapter supplied with a device
  - Mass 0.7 kg
  - Dimensions 220x33x50mm
