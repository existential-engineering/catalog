description: MIDI splitter and USB MIDI interface with extras.
details: |-
  The MIDI DISPATCH is a MIDI dispatcher and the successor to Erica Synths' first ever desktop unit, the MIDI THRU BOX, with a number of features added to turn it into a hands-on command centre for a studio setup.

  In essence it is an ultra-low latency splitter from one MIDI input to eight outputs, with advanced MIDI filtering options. Up to eight instruments can be connected to a MIDI keyboard or sequencer, and the unit also connects directly to a laptop over USB-C.

  Each of the eight outputs is configured separately, with per-output MIDI filtering and routing, which gives a lot of flexibility in a studio or live setting. Configuration is handled through a web-based interface rather than on-unit menus.

  The unit can be powered either over USB-C or from a 12V DC input, so it works with or without a computer attached.
specs: |-
  - Ultra-low latency MIDI signal splitting
  - USB-C port for computer connection (MIDI over USB)
  - Per-output MIDI filtering and routing
  - Web-based configuration interface
  - Powered via USB-C or 12V DC input
  - 8 independent MIDI outputs
