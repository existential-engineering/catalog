description: The Model 60n is a 2-channel network integrated amplifier
  engineered for exceptional hi-fi performance and comprehensive connectivity.
  It enables high-resolution streaming via HEOS and connection of analog sources
  like CD players or turntables, delivering 60W per channel at 8 ohms (80W at 4
  ohms) through a Class A/B topology with a toroidal transformer and Marantz
  HDAM-SA3/SA2 modules. The Model 60n supports high-resolution streaming from
  popular services including TIDAL, Amazon Music HD, Deezer, and Qobuz-class
  lossless playback, plus AirPlay 2, Bluetooth, Spotify Connect, Tidal Connect,
  and Roon Ready. An HDMI ARC input enhances TV sound for movies and gaming,
  while an MM phono stage, multiple analog and digital inputs, preamp/sub
  outputs, and a headphone jack round out a flexible hi-fi hub. Master tuned for
  the signature Marantz sound, it delivers texture, nuance, and clarity, and won
  the EISA Award 2025.
details: |-
  MODEL 60n is a high-performance stereo amplifier engineered to deliver hi-fi sound quality and is ideal for those who want to build a comprehensive sound system. It is a two-channel Class A/B design rated at 60W per channel into 8 ohms and 80W into 4 ohms, built on a toroidal power supply with current feedback topology and Marantz HDAM-SA3 and SA2 circuits.

  Sound Master tuned and engineered to bring the texture, nuance, and clarity of the Marantz signature sound, it carries a low-noise monochrome OLED display, symmetric PCB layout, an aluminium extrusion heat sink and a metal front panel.

  Streaming is handled by HEOS Built-in with Wi-Fi and wired LAN, AirPlay 2, Bluetooth, Roon Ready, Spotify Connect and Tidal Connect, supporting PCM up to 192 kHz / 24-bit and DSD up to 4x (11.2 MHz), with gapless playback of MP3, WMA, AAC, DSD/DSF, FLAC, ALAC, WAV and AIFF.

  Connections include four analog audio inputs with a moving magnet phono stage, coaxial, optical and rear USB-A digital inputs, one HDMI ARC input with CEC for TV and gaming sound, a preamp output, a mono subwoofer output and a headphone output.
specs: |-
  - Channels: 2
  - power output 60 W (8 ohm) / 80 W (4 ohm) RMS
  - Topology: Class A/B, current feedback
  - HDAM version: SA3, SA2
  - PSU transformer: toroidal, linear drive power supply
  - Frequency response: 5 Hz - 100 kHz
  - Total harmonic distortion: 0.02%
  - Damping factor: 100
  - Input sensitivity MM: 2 mV / 47 kOhm
  - SN ratio MM 87 dB
  - Input sensitivity high level: 190 mV / 20 kOhm
  - SN ratio 113 dB (2V input)
  - Treble control: +/- 10 dB at 10kHz
  - bass control +/- 10 dB at 50Hz
  - balance
  - Source Direct
  - Analog audio inputs: 4 (including MM phono)
  - preamp outputs 1
  - subwoofer output 1 mono
  - Digital inputs: coaxial, optical, USB-A
  - max PCM 192 kHz / 24-bit
  - max DSD 4x (11.2 MHz)
  - HDMI: 1 ARC with CEC
  - Network: Wi-Fi and wired LAN
  - Streaming: HEOS Built-in, Bluetooth, AirPlay 2, Roon Ready, Spotify Connect, Tidal Connect
  - Lossless formats: DSD/DSF, FLAC, ALAC, WAV, AIFF
  - lossy MP3, WMA, AAC
  - gapless playback
  - Speaker terminals: Marantz SPKT-1+, number of terminals 2, 4~16 ohm
  - Speaker A/B: no
  - bi-amp and multichannel option: no
  - balanced in/out: no
  - power amp direct: no
  - Control: D-Bus
  - remote control RC006PM
  - low-noise monochrome OLED display
  - Power consumption: 220 W
  - standby 0.3 W
  - detachable power cable
  - auto power off
  - Dimensions: 442 x 431 x 129 mm (W x D x H)
  - weight 28.1 lbs
