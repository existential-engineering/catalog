name: Model 60n
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/amplifiers/model-60n/301009.html
description: The Model 60n is a 2-channel network integrated amplifier
  engineered for exceptional hi-fi performance and comprehensive connectivity.
  It enables high-resolution streaming via HEOS and connection of analog sources
  like CD players or turntables, delivering 60W per channel at 8 ohms (80W at 4
  ohms) through a Class A/B topology with a toroidal transformer and Marantz
  HDAM-SA3/SA2 modules. The Model 60n supports high-resolution streaming from
  popular services including TIDAL, Amazon Music HD, Deezer, and Qobuz-class
  lossless playback, plus AirPlay 2, Bluetooth, Spotify Connect, Tidal Connect,
  and Roon Ready. An HDMI ARC input enhances TV sound for movies and gaming,
  while an MM phono stage, multiple analog and digital inputs, preamp/sub
  outputs, and a headphone jack round out a flexible hi-fi hub. Master tuned for
  the signature Marantz sound, it delivers texture, nuance, and clarity, and won
  the EISA Award 2025.
details: |-
  The Model 60n is positioned as a network integrated amplifier engineered for exceptional hi-fi performance and comprehensive connectivity, enabling streaming in high-resolution via HEOS and connection of analog sources like CD players or turntables. It delivers the perfect blend of performance and connectivity, with master-tuned Superb Marantz Sound for texture, nuance, and clarity. The amplifier supports high-resolution streaming from popular music services including TIDAL, provides comprehensive connectivity for building complete hi-fi systems, and enhances TV sound for movies and gaming via HDMI ARC. It is designed with robust yet refined materials and earned the EISA Award 2025, recognized as an eye-catching addition to any setup whose authenticity in portraying music seals the deal.
specs: |-
  - Channels: 2
  - Power Output: 60W @ 8 ohms / 80W @ 4 ohms (RMS)
  - Amplifier Topology: Class A/B
  - Power Supply: Toroidal Transformer
  - Speaker Terminals: Marantz SPKT-1+ (2 sets)
  - Current Feedback Topology
  - HDAM-SA3 and HDAM-SA2 modules
  - High Grade Audio Components with customized parts
  - Symmetric PCB Layout
  - Aluminum Extrusion Heat Sink
  - Linear Drive Power Supply
  - Schottky Diodes
  - Digital Inputs: Coaxial, Optical, USB-A
  - Max PCM Sample Rate: 192 kHz / 24-bit
  - Max DSD Sample Rate: DSD 4x (11.2 MHz)
  - HDMI: 1x ARC
  - Streaming: Bluetooth, AirPlay 2, Roon Ready, Spotify Connect, Tidal Connect
  - Streaming Services: Tidal (Hi-Res), Deezer (Hi-Res), Amazon Music HD, Pandora, TuneIn, iHeartRadio, SoundCloud, SiriusXM, AWA, Mood:Mix, Qplay, Sony HiRes
  - Multiroom audio support
  - Lossy Formats: MP3, WMA, AAC
  - Lossless Formats: DSD/DSF, FLAC, ALAC, WAV
  - Gapless Playback
  - HEOS App: iOS, Android
  - Wi-Fi and Wired LAN (Ethernet)
  - Phono Input: MM Standard
  - Preamp Outputs: 1
  - Subwoofer Output: 1 (Mono)
  - Headphone Output
  - Audio Adjustments (Bass/Treble)
  - Frequency Response: 5 Hz - 100 kHz
  - Total Harmonic Distortion: 0.02%
  - Damping Factor: >100
  - Input Sensitivity (MM): 1.9 mV / 47 kOhm
  - Signal-to-Noise Ratio (MM): 87 dB
  - Input Sensitivity (High Level): 190 mV / 20 kOhm
  - Signal-to-Noise Ratio (High Level): 113 dB
  - Treble Control: +/-10 dB @ 15 kHz
  - Bass Control: +/-10 dB @ 50 Hz
  - Power Consumption: 220W
  - Standby Consumption: 0.3W
  - Auto Power Off
  - Detachable Power Cable
  - Remote Control: RC006PM
  - System Remote Function
  - Dimensions (W x D x H): 442 x 431 x 129 mm (17.4 x 17 x 5.1 inches)
  - Weight: 12.75 kg (28.1 lbs)
  - Display: Low-Noise OLED Monochrome
  - Metal Front Panel
  - Finishes: Black, Silver, Gold
  - EISA Award 2025
