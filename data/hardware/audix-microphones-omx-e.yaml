details: |-
  Engineered for vocalists with a varied mic technique, the OMX-E microphone features a robust all metal construction, a dynamic capsule for accurate vocal capture and a unique identification ring.

  With expanded reach capabilities , the OMX-E will ensure every detail of your voice is reproduced with supreme accuracy, making it ideal for varied performance styles. OMX-E shines in small to mid-sized PA systems, while retaining true sound on large or professional PA systems.

  OMX-E is part of the new generation of AUDIX's dynamic vocal microphones , featuring our proprietary VLM (very low mass) capsule technology and the new flat-top grille that intuitively guides towards correct positioning and technique

  Designed and crafted in the USA.
