description: A versatile 2x12" angled guitar speaker cabinet from Marshall's MX range, loaded with two 12" Celestion Seventy-80 speakers in an angled baffle for upward stage projection. Voiced for classic rock tones, the passive cabinet handles 160W at 8Ω and is designed to pair with MX-series heads or other Marshall amplifiers as an affordable, gig-ready 2x12 alternative to a full 4x12.
details: |-
  Great value and fantastic quality, what is not to love about the angled MX 2x12" Cabinet?

  They pair well with most Marshall heads or can be used as an extension cabinet for a combo, and are fitted with two Celestion Seventy-80 speakers that pack a punch, delivering a tight low-end and a punchy mid-range.

  This angled cabinet is perfect for projecting sound and is also available as a straight base cab, allowing you to create your own Marshall stack. It handles 160W at an 8 ohm unit impedance through a single input.

  Designed and engineered in UK. Made in Vietnam.
