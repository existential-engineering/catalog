id: P7fntv7vE__a8tA9Ol3c8
name: Dangerous Music MONITOR
manufacturer: dangerous-music
primaryCategory: monitor
categories:
  - discontinued
url: https://www.dangerousmusic.com/product/monitor
description: The world's top mastering engineers know that monitoring is the
  most crucial part of any studio. The Dangerous MONITOR delivers an honest,
  uncolored yet musical signal path with immediate and intuitive controls to
  deliver the perfect balance every time.
details: |-
  The Dangerous MONITOR realizes four distinct functions: fluidly switching between multiple analog and digital sources, referencing different sets of speakers, recalling level settings, and critically analyzing input source material through an identical signal path.

  The sound of the Dangerous MONITOR is transparent yet musical. Designed by Chris Muth, equipment designer for many of the world's top mastering facilities, real-world testing and fine-tuning amidst some of the world's greatest studios shaped the design.

  The MONITOR is designed to be the cornerstone of a recording studio, providing a convenient method for listening to and metering the different stages of the recording process. A built-in digital-to-analog converter lets engineers compare digital sources directly through an identical D/A path.
specs: |-
  - Mastering grade onboard D-to-A conversion
  - Stepped attenuator volume control (21 positions)
  - Analog input switching: 3 pairs of analog inputs
  - Digital input switching: 4 digital inputs, with active thru outputs
  - Full console monitoring functions: L&R phase reverse, L&R mute, mono, dim, alternate speaker, -6VU meter offset
  - Frequency response: 1 Hz-100 kHz within 0.2 dB
  - Total harmonic distortion: 0.003% in audio band
  - Converter lock range: 32 kHz - 192 kHz
  - Crosstalk @ 1 kHz: -113 dB
  - Noise floor: -93 dBu total energy in audio band
  - Max level: +26 dBu
  - Power consumption: 40 watts
  - Size: 2 RU for MONITOR, 1 RU for power supply
