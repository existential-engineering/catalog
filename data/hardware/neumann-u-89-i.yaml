details: |-
  Even frequency response in 5 directional patterns

  Very low distortion

  High SPL capabilities

  Transformer balanced circuit

  Universal studio microphone

  Five directional characteristics

  High linearity for all polar patterns

  Uncolored off-axis response

  Compact size

  Switchable pad and two-stage low cut
specs: |-
  - Acoustical Operating Principle: Pressure gradient transducer
  - Directional Pattern: Omnidirectional, wide angle, cardioid, hypercardioid, figure-8
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity At1 kHz Into1kohm: 8 mV/Pa = -42 dBV ± 1 dB
  - Rated Impedance: 150 ohms
  - Rated Load Impedance: 1 kohms
  - Equivalent Noise Level CCIR: 28 dB
  - Equivalent Noise Level A Weighted: 17 dB-A
  - Max SPL THD05: 134 dB
  - Max SPL THD05 With Preattenuation: 140 dB
  - Signal To Noise Ratio CCIR: 66 dB (re. 94 dB SPL)
  - Signal To Noise Ratio A Weighted: 77 dB (re. 94 dB SPL)
  - Maximum Output Voltage: 0.3 dBu
  - Supply Voltage: 48 V ± 4 V (P48, IEC 61938)
  - Current Consumption: 0.8 mA (P48, IEC 61938)
  - Matching Connector: XLR 3 F
  - Weight: 400 g
  - Diameter: 46 mm
  - Length: 185 mm
