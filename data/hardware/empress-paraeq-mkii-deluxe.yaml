description: "The flagship ParaEq: everything in the MKII plus Baxandall
  shelving filters and 12dB/octave high-pass and low-pass filtering. A
  transparent, high-headroom parametric EQ with footswitchable clean boost,
  running internally at 27V."
details: |-
  The ParaEq MKII Deluxe builds on the MKII with the same three parametric bands (15dB of boost/cut, fully overlapping sweepable frequency, adjustable/switchable Q), footswitchable boost up to 30dB, and linked or independent switching, all running internally at 27V for clean headroom without unwanted clipping. Distortion measures under 0.05% for a pristine clean sound.

  The Deluxe adds beautiful-sounding, super-smooth Baxandall shelving filters for broad high and low frequency adjustment, plus 12dB/octave high-pass and low-pass filters to cut noise out of the spaces where your instrument's frequency spectrum does not exist. Like the MKII it offers both true and buffered bypass and top-mounted jacks for easy integration.
specs: |-
  - Controls: 3 parametric bands (sweepable frequency, +/-15dB boost/cut, adjustable/switchable Q per band), footswitchable Boost up to +30dB, Baxandall high/low shelving filters, 12dB/oct high-pass and low-pass filters
  - Linked or independent EQ/boost switching
  - 27V internal operation for high clean headroom
  - Distortion under 0.05%
  - All-analog signal path
  - True or buffered bypass
  - Top-mounted jacks
  - Power: 9V DC centre-negative, 2.1mm barrel connector, 300mA
  - Dimensions: 4.8" L x 2.6" W x 1.5" H (enclosure), 2.5" H including controls
  - Weight: 1 lb
