description: The Heart+ The beating heart(s) of your rack, the analog
  oscillator. If the Dixie2's six waveform outputs don't offer enough shapes for
  you, the PWM, sync, and FM inputs have you covered. Unique to the Dixie2+ is
  PWM control, exponential FM, and an Octave switch for quick and precise
  musical tuning.
details: |-
  The Dixie 2+ is a larger variant of the classic Dixie 2. Using the same great triangle core oscillator, it adds a number of features to make it even more versatile with only a modest increase in size. The Dixie 2+ makes a perfect primary oscillator for a modular system, or a great companion for the Rubicon 2.

  The beating heart(s) of your rack, the analog oscillator. If the Dixie2's six waveform outputs don't offer enough shapes for you, the PWM, sync, and FM inputs have you covered. Unique to the Dixie2+ is PWM control, exponential FM, and an Octave switch for quick and precise musical tuning.

  Features: an 8-position octave switch for quick setting of coarse tuning; a fine tuning knob that converts into a coarse knob when in LFO mode; dual FM inputs with an FM1 attenuator and a switch to select between exponential and linear mode; pulse width control with attenuator; a reset-to-0V hard sync input ideal for percussive sounds or modulation; and a flip sync circuit similar to but improved from the Dixie II.

  Six waveform outputs are provided: sine, triangle, zigzag, saw, pulse and suboctave.
specs: |-
  - Width: 8HP
  - Depth: 38mm
  - Power: 60mA @ -12V, 70mA @ +12V
  - No onboard firmware (fully analog)
