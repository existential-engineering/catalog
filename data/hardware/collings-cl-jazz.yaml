description: The City Limits Jazz is a fully hollow thin-line archtop electric
  guitar built for jazz performance. Its Honduran mahogany body features a
  carved solid spruce top with parallel bracing, producing a lightweight and
  ultra-responsive instrument. Elegant appointments include bound S-holes,
  multiple black/white purflings, and an ebony fingerboard with mother-of-pearl
  parallelogram inlays. A single Lollar Johnny Smith pickup at the neck delivers
  warm, articulate jazz tone.
details: |-
  The City Limits Jazz features a fully hollow body constructed from Honduran mahogany with a solid spruce top that is parallel braced for an open, resonant response. The mahogany neck is set with an ebony fingerboard and mother-of-pearl parallelogram inlays, and the headstock and fingerboard are bound in non-grained ivoroid. The body binding is also non-grained ivoroid, and the instrument features elegant bound S-holes in place of traditional f-holes. Electronics consist of a single Lollar Johnny Smith pickup in the neck position wired with thumbwheel 500K volume and tone controls and a .047 ceramic capacitor. Hardware includes nickel Gotoh tuners, an adjustable ebony bridge, and an ebony tailpiece. The guitar ships with D'Addario NYXL1252W strings (.012-.052 with wound 3rd) and a deluxe hardshell case. Standard finishes include Amber Sunburst, Blonde, Iced Tea Sunburst, Merlot, and Tobacco Sunburst. Optional inlay patterns include Broken Glass in addition to the standard Parallelograms. Left-handed configuration is available.
specs: |-
  - Body: Fully hollow Honduran mahogany
  - Top: Solid spruce, parallel braced
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Radius: 12"
  - Nut Width: 1 11/16"
  - Scale Length: 25 1/2"
  - Frets: Medium 18% nickel-silver
  - Inlay: Mother-of-pearl parallelograms
  - Binding: Non-grained ivoroid (body, fingerboard, peghead)
  - Pickup: Single Lollar Johnny Smith (neck position)
  - Controls: Thumbwheel 500K volume & tone, .047 ceramic capacitor
  - Bridge: Adjustable ebony
  - Tailpiece: Ebony
  - Tuners: Nickel Gotoh with Collings logo
  - Pickguard: Ebony with ivoroid binding
  - Finish: High gloss nitrocellulose lacquer
  - Body Width: 15"
  - Body Length: 19 1/2"
  - Body Depth: 1 5/8"
  - Total Length: 40 3/4"
  - Strings: D'Addario NYXL1252W (.012-.052, wound 3rd)
  - Case: Deluxe hardshell included
