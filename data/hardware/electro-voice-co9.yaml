  - Polar pattern: Cardioid
  - Frequency response: 50 Hz - 18,000 Hz
  - Impedance (low-Z balanced): 600 ohms
  - Open circuit voltage: 3.2 mV/Pa
  - Connector: 3-pin XLR
  - Form factor: Handheld
  - Wired/wireless: Wired
  - Height: 173 mm
  - Maximum diameter: 53 mm
  - Net weight: 0.335 kg
  - Case material: Die cast zinc
