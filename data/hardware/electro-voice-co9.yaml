details: >-
  The Cobalt Co9 is a handheld dynamic vocal microphone in Electro-Voice's
  Cobalt series, aimed at lead and backing vocalists working across musical
  styles. Its cardioid polar pattern provides strong off-axis rejection, helping
  the mic remain stable against stage monitors and bleed from other sources.


  The voicing is tuned for vocals: a slight bass roll-off keeps proximity effect
  from clouding the low end when sung close, while an accentuated mid-range adds
  presence and intelligibility so vocals cut through a mix without aggressive
  EQ.


  The body is built from die cast zinc with a Cobalt finish for durability under
  road and stage use. At 173 mm tall, 53 mm in diameter and 0.335 kg, it has the
  familiar weight and balance of a handheld stage mic. Output is via a standard
  3-pin XLR connector, with a low-impedance balanced signal at 600 ohms suitable
  for any professional mixer or preamp. The microphone ships with a stand
  adapter and a zippered vinyl carrying case.
