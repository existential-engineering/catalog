description: Get the unvarnished truth and deliver your mixes exactly as the
  artist intended. LYD 5 is the ideal complement for any small studio set-up.
details: |-
  Compact nearfield personal monitors for incredible precision in smaller spaces - and even at low volumes. The truth, the whole truth and nothing but the truth. Get the unvarnished truth and deliver your mixes exactly as the artist intended.

  LYD 5 pairs a handmade 5-inch MSP (Magnesium Silicate Polymer) woofer with a 1.1-inch soft-dome tweeter, each driven by a dedicated 50W Class-D amplifier for a maximum SPL of 106 dB per pair at 1 metre.

  A 24-bit/96 kHz signal path with advanced DSP handles the 2-way crossover at 5200 Hz, while lightweight aluminium voice-coils keep transient response quick and accurate.

  Configured as a rear-loaded bass reflex enclosure, LYD 5 covers 60 Hz to 21 kHz (-3 dB @ 85 dB) and is designed as the ideal complement for any small studio set-up where space and lower listening levels are a factor.
specs: |-
  - Type: Nearfield Monitor
  - Series: LYD
  - Segment: Pro
  - Box Principle: Rear-loaded bass reflex
  - Crossover: 2-way DSP-based
  - Crossover Frequency: 5200 Hz
  - Tweeter: 1.1in soft dome
  - Woofer: 5in MSP
  - Amplifier Power (Woofer): 50W
  - Amplifier Power (Tweeter): 50W
  - Maximum SPL (1m, pair): 106 dB
  - Lower Cutoff (-3 dB @ 85 dB): 60 Hz
  - Upper Cutoff (-3 dB @ 85 dB): 21 kHz
  - AC Power Input: 100-240V 50/60Hz
  - Max Power Consumption: 100W
  - Max Standby Power: 0.5W
  - Dimensions (W x D x H): 170 x 211 x 260 mm (6 6/8 x 8 2/8 x 10 2/8 in)
  - Weight: 5.7 kg (12.6 lbs)
  - Finishes: Black Satin, White Satin
  - Speakers per packaged box: 1
