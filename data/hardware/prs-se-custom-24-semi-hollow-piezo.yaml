details: |-
  The PRS SE Custom 24 Semi-Hollow Piezo is a highly sophisticated and incredibly versatile instrument. The Custom 24 is the original design first introduced by PRS in 1985 as a solidbody guitar with maple top, mahogany back, dual humbuckers, and the patented PRS tremolo. This semi-hollow version adds natural resonance and a vibrant, organic tone. The humbuckers in this model are PRS 85/15 “S” pickups, which can be tapped via the push/pull tone control for more sounds.
specs: |-
  - Body Construction: Semi-Hollow Body with Single F-Hole
  - Top Wood: Maple
  - Veneer: Flame Maple
  - Back Wood: Mahogany
  - Top Carve: Shallow Violin
  - Number of Frets: 24
  - Neck Wood: Maple
  - Neck Construction: Multi-Ply
  - Truss Rod: PRS Double-Acting
  - Neck Shape: Wide Thin
  - Fretboard Wood: Rosewood
  - Fretboard Inlay: Birds
  - Bridge: PRS Patented Tremolo
  - Tuners: PRS Designed Tuners
  - Hardware Type: Nickel
  - Nut: PRS
  - Treble Pickup: 85/15 “S”
  - Bass Pickup: 85/15 “S”
  - Gig Bag: Controls
