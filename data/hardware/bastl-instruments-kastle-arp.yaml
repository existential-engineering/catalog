  CV-controllable decay envelope, and a stepped voltage generator.
details: |-
  The Kastle ARP is a unique modular melody generator built around a quantized sine wave oscillator with a digital waveshaper. It is a melodic evolution of the original Kastle glitchbox, designed for generating melodies and arpeggios with a patchable, modular workflow.

  Key features include an 8-octave NOTE knob for pitch selection, a Timbre XOR waveshaper for timbral variation, a CV-controllable decay envelope, and a CHORD CV input that switches between 3 different chord voicings. A dedicated BASS output provides a complementary lower voice. The voltage-controllable clock generator produces both square and triangle wave outputs.

  A stepped voltage generator with random, 8-step, and 16-step modes enables melodic sequencing and modulation. All signals are accessible via the top patch header, compatible with standard Kastle patch cables. Open-source design; schematics and firmware available on GitHub.

  Powered via 5V Micro USB or 3x AA batteries (batteries not included). Dimensions: 70 × 60 × 50 mm.
