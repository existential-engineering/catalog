details: |-
  The Misnomer is part of Catalinbread's Cabinet Series, reproducing the vintage Systech Overdrive — a hard-clipping op-amp overdrive with a resonant band-pass filter disguised as an EQ control.

  The Frequency knob sweeps the high-Q band-pass filter from 122Hz to 900Hz. A Blend control splits signal between dry and processed paths. A Wet/Mix toggle switch applies the frequency filter to both blend sides or just the wet side. The Gain control adjusts distortion amount. This combination creates a unique overdrive/distortion character that sits outside conventional dirt box territory. Limited Cabinet Series run.
