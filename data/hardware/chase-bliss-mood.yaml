url: https://www.chasebliss.com/mood
description: A two-channel micro-looper and spatial effects pedal where one half
  samples and loops brief moments while the other provides real-time spatial
  effects, with both channels aware of each other and working together.
details: |-
  MOOD is a two-channel micro-looper and spatial effects pedal. The micro-looping channel, designed by Drolo FX, samples and loops brief moments. The spatial effects channel, designed by Old Blood Noise Endeavors, provides real-time ambient processing.

  Both channels are aware of each other and work together. The Musical Clock knob controls sample rate of both channels in harmonized steps. Variable routing between channels allows audio spillback for creative interaction.

  The pedal features mono I/O, 2 presets, internal modulation via ramping, MIDI control (PC, CC), CV control, expression control, trails option, and momentary or latching bypass. Analog dry-through with buffered bypass ensures transparent signal when disengaged.
specs: |-
  - Mono I/O
  - 2 Presets
  - Internal modulation (Ramping)
  - MIDI (PC, CC)
  - CV control
  - Expression control
  - Trails option
  - Momentary or latching bypass
  - Analog dry thru
  - Buffered bypass
  - Micro-looper by Drolo FX
  - Spatial effects by Old Blood Noise Endeavors
  - Musical Clock for harmonized sample rate control
  - Power: 9V Center Negative, ~200mA
