details: |-
  Product Overview

  The Heil Pro Set 3 is a professional closed-back studio headphone engineered for critical listening, broadcast monitoring, and studio tracking. Designed to deliver clean, uncolored audio reproduction, the Pro Set 3 combines dynamic clarity with exceptional low-frequency reproduction and articulate highs, providing sound engineers, broadcasters, and musicians with an accurate acoustic environment.

  The Pro Set 3 features a phase reversal switch that runs the speakers out of phase when engaged. This unique feature reduces listener fatigue during long sessions and helps live sound engineers accurately monitor signals in loud and noisy environments.

  Built around high-performance 40 mm neodymium magnet drivers , the Pro Set 3 offers an ultra-wide frequency response spanning 10 Hz to 22 kHz with a low impedance rating of 32 ohms. The headphones feature lightweight, ergonomic ear cups lined with high-density padded cushions that fit comfortably around the ear to provide superior passive noise isolation and reduce acoustic leakage into nearby recording microphones. Equipped with a twist-lock detachable cable system, the Pro Set 3 comes complete with two versatile cables (flexible straight and coiled) and a 1/4″ adapter for effortless integration across all audio equipment.
specs: |-
  - High-Performance 40 mm Neodymium Drivers: Delivers linear frequency reproduction with accurate bass extension, detailed midrange, and smooth highs across 10 Hz – 22 kHz.
  - Ergonomic Closed-Back Acoustic Isolation: Circum-aural ear pads wrap comfortably around the ears, blocking ambient background noise and suppressing sound bleed during studio recording sessions.
  - Twist-Lock Detachable Cable System: Features a secure twist-locking connector at the left ear cup to prevent accidental disconnection during live broadcast or tracking sessions.
  - Two Detachable Cables Included: Package includes a 1.8-meter flexible straight cable and a 3-meter coiled cable.
  - Lightweight & Comfortable Ergonomics: Adjustable padded headband and soft ear cushions allow for extended listening sessions without ear fatigue or pressure points.
  - High Sensitivity & Low Impedance (32 Ω): Efficiently driven by mixing consoles, audio interfaces, headphone amplifiers, mobile devices, and amateur radio transceivers without requiring high-power amplification.
  - Adapter Included: Ships complete with a screw-on 1/4″ (6.3 mm) stereo adapter.
  - Headphone Type: Closed-Back Circum-aural (Over-Ear).
  - Driver Size: 40 mm Neodymium Magnet Drivers.
  - Frequency Response: 10 Hz – 22 kHz.
  - Impedance: 32 ohms @ 1 kHz.
  - Sensitivity / Output Level: 102 dB SPL (±3 dB) @ 1 mW.
  - Max Input Power: 1,000 mW.
  - Cable Type: Twist-lock detachable.
  - Termination & Connector: 1/8″ (3.5 mm) stereo jack plus screw-on 1/4″ (6.3 mm) adapter.
  - Weight: 7.0 oz (198.4 g) without cable.
  - Phase reversal switch runs the drivers out of phase when engaged.
