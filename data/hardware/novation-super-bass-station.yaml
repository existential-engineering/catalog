description: >-
  Novation's enhanced monophonic bass synthesizer module featuring dual oscillators, a sub-oscillator,
  switchable 12dB/24dB filters, ring modulation, and built-in effects including distortion and chorus.
details: |-
  The Super Bass Station expanded on its predecessor with a more comprehensive feature set aimed at serious bass synthesis. Its dual oscillators produce pulse and sawtooth waveforms, supplemented by a sub-oscillator and noise generator that together provide a thick foundation for weighty bass tones.

  The filter section is a standout, offering switchable 12dB and 24dB per octave slopes on a resonant low-pass design. Dedicated ADSR envelopes for both the filter and amplifier allow independent shaping of timbre and dynamics, while key follow and velocity depth add expressive responsiveness. Two LFOs with random, triangle, and sawtooth waveforms provide modulation, and ring modulation opens up more aggressive and metallic textures.

  Practical studio features include 50 presets and 150 user program slots, MIDI and CV/Gate connectivity, an arpeggiator with clock output, and a slide function for smooth pitch transitions. The effects section adds distortion, stereo chorus, and panning, making it largely self-contained for bass duties.

  Capable of emulating Roland and Moog bass characteristics while maintaining its own identity, the Super Bass Station earned a reputation as a versatile and affordable analog bass workhorse during the late 1990s.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 (pulse, sawtooth) plus 1 sub-oscillator; noise generator
  - LFOs: 2 (random, triangle, sawtooth)
  - Filter: 12dB/24dB switchable resonant low-pass with cutoff, resonance, envelope modulation, key follow
  - Envelopes: 2 ADSR (filter and amplifier) with velocity depth and auto-glide
  - Effects: Distortion, stereo chorus, panning
  - Ring modulation: Yes
  - Memory: 50 presets, 150 user programs
  - Arpeggiator: Yes (with clock output)
  - Control: MIDI, CV/Gate in/out
releaseDate: "1997"
releaseDateYearOnly: true
