details: |-
  This ultra-limited Custom Shop offering combines Brazilian rosewood back and sides with an Adirondack spruce top, delivering exceptional depth and clarity reminiscent of the legendary pre-war Dreadnoughts.

  The design references iconic 1937 Dreadnoughts with Authentic 1937 forward-shifted scalloped X-bracing, hide glue construction throughout, and an adjustable truss rod for modern reliability. A Stage 1 aged vintage gloss finish gives the instrument the look and feel of a treasured vintage piece straight from the case.

  Production is limited to 28 units worldwide and is available exclusively through Custom Shop Expert Dealers.
specs: |-
  - Body Size: D-14 Fret Dreadnought
  - Top: Adirondack Spruce
  - Back & Sides: Brazilian Rosewood
  - Bracing: Authentic 1937 Forward Shifted X-Brace, scalloped, 5/16" Adirondack spruce
  - Construction: Dovetail neck joint with hide glue
  - Neck: D-28 Authentic 1937 Barrel & Heel, genuine mahogany
  - Scale Length: 25.4"
  - Frets: 20 total, 14 clear of body
  - Fingerboard: Ebony
  - Nut Width: 1 3/4"
  - Width at 12th Fret: 2 1/4"
  - Fingerboard Inlay: Diamonds and squares (abalone)
  - Bridge: Ebony, 1930 style belly, glue-in long saddle, aged finish
  - Saddle: Bone
  - Nut: Bone
  - Tuning Machines: Aged Waverly nickel open back
  - Bridge Pins: Bone with black plastic dots
  - Finish: Vintage Gloss - Aged (Stage 1)
  - Binding: Antique white
  - Top Inlay: Bold herringbone
  - Rosette: Style 28 multi-stripe
  - Headstock: Brazilian rosewood with 1937 taper and diamond shape
  - Headplate Logo: Script Golden Era overlay
  - Production: Limited to 28 units worldwide
