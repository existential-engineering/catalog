description: The largest of the two models, HR824mk2 is an excellent choice for
  any pro studio that demands serious precision and excellent low frequency
  reproduction.
details: |-
  HR824mk2 is a two-way active studio monitor from Mackie's HRmk2 Series, built around a 8.75 inch low-distortion low-frequency transducer and a 1 inch ferro-fluid-cooled titanium dome tweeter on an optimized waveguide.

  A passive radiator rather than a port extends the low end, which Mackie states reaches down to 35 Hz, and the cabinet is fully internally damped to suppress midrange artifacts.

  Amplification is a twin FR Series pair, 150W for the low frequencies and 100W for the high, with a Zero-Edge Baffle and a rotatable Mackie logo so the cabinet can be used on its side.

  Rear controls cover acoustic space, low-frequency roll-off and high-frequency adjustment, plus input sensitivity and a power mode switch offering standby, auto-on or always-on. A front panel LED reports power and overload.

  Inputs are flush-mounted so the cabinet can sit against a wall without connector clearance, and comprise a balanced XLR, a balanced or unbalanced 1/4 inch phone jack and an unbalanced RCA. The monitor is THX pm3 certified for surround applications, and Mackie notes that HR624mk2 and HR824mk2 share a design and so work together in a surround system.
specs: |-
  - Ultra-linear frequency response for accurate mix translation
  - 8.75 inch high-precision, low-distortion LF transducer
  - 1 inch titanium dome, ferro-fluid cooled tweeter
  - Optimized waveguide for a wide, even sweet zone
  - Twin FR Series amplifiers: 150W for LF, 100W for HF
  - Full internal damping eliminates midrange artifacts
  - Passive radiator provides bass extension down to 35 Hz
  - Acoustic space, LF roll-off and HF controls
  - Input type: balanced differential (XLR and 1/4 inch TRS), unbalanced (RCA)
  - Input impedance: 20 kOhm balanced, 10 kOhm unbalanced
  - Input protection: RFI and level protected
  - Maximum input level: +20 dBu
  - Flush-mount connector system allows the monitor to be placed against a wall without connector clearance
  - Zero-Edge Baffle and rotatable logo for horizontal or vertical placement
  - Power mode switch: standby, auto-on or on
  - THX pm3 certified for surround sound applications
