description: 8" 2 Way Active Studio Monitor. Modern studios demand precision and
  accuracy from their monitors.
details: |-
  The HR824mk2 is part of Mackie's HRmk2 Series of active studio reference monitors, designed for critical mixing and mastering work where precision and accuracy are essential.

  It features an 8.75-inch low-distortion LF transducer paired with a 1-inch ferro-fluid cooled titanium dome tweeter, driven by Twin FR Series amplifiers delivering 150W to the low frequencies and 100W to the high frequencies.

  A rear-firing passive radiator extends low-frequency response down to 35Hz, while full internal damping minimizes cabinet resonance for cleaner reproduction. Rear-panel Acoustic Space, LF roll-off, and HF controls allow the monitor to be tuned to its room placement.

  The HR824mk2 is THX pm3 Certified, making it suitable for surround-sound production environments, and is designed to integrate seamlessly with the smaller HR624mk2 in multi-speaker configurations.
specs: |-
  - Ultra-linear frequency response
  - 8.75-inch low-distortion LF transducer
  - 1-inch titanium dome, ferro-fluid cooled tweeter
  - Twin FR Series amps (150W LF / 100W HF)
  - Full internal damping
  - Passive radiator (35Hz extension)
  - Acoustic space, LF roll-off, HF controls
  - THX pm3 Certified
