description: >-
  The original portable Dirtywave M8 synthesizer, sampler, and tracker-style
  sequencer, since discontinued and replaced by the Model:02.
details: |-
  The original M8 Tracker (Model:01) is a portable music workstation built around a tracker-style sequencer, combining multiple synthesis engines with sample playback across 8 monophonic tracks. Its sequencer can also control external gear over MIDI.

  Stereo audio inputs and outputs, plus MIDI in and out, are on 3.5mm TRS jacks. The line output doubles as a headphone output. The original model uses a 2.8-inch display and a micro-USB port.

  Model:01 is no longer for sale and has been replaced by the updated M8 Tracker Model:02. Firmware features and support continue in parallel with the Model:02, with different download links, available on the Dirtywave support page.
specs: |-
  - Portable synthesizer, sampler, and tracker-style sequencer
  - 8 monophonic sequencer tracks
  - Multiple synthesis engines plus sample playback
  - 2.8-inch display
  - Stereo audio in/out and MIDI in/out on 3.5mm TRS jacks
  - Micro-USB port
  - microSD card storage
  - Discontinued, replaced by the M8 Tracker Model:02
