details: |-
  The CK-1 is a small-diaphragm FET condenser pencil microphone from Avantone
  Pro, designed to deliver professional-grade performance at an accessible
  price point. Its brass body with Cabernet-red finish and nickel silver
  accents gives it a distinctive look while maintaining rigorous build quality.

  What sets the CK-1 apart is its system of three interchangeable capsules —
  cardioid, hypercardioid, and omnidirectional — making it a versatile tool
  adaptable to a wide variety of recording scenarios without the need for
  multiple dedicated microphones.

  The microphone covers an extended frequency range of 25–25,000 Hz (±3dB),
  making it suitable for capturing the full detail of acoustic sources
  including upright piano, strings, wind instruments, drum overheads, and
  snare/tom/bass drum miking.

  The CK-1 features a switchable -10dB pad for handling high-SPL sources
  without distortion, and an 80Hz high-pass filter to reduce low-frequency
  rumble and handling noise. Its output impedance is under 200 ohms, ensuring
  compatibility with a broad range of preamplifiers.

  Each CK-1 ships with an SSM shock mount for reduced mechanical vibration
  transfer and a padded wooden storage box.
specs: |-
  - Transducer type: FET condenser (SDC)
  - Polar patterns: Cardioid, Hypercardioid, Omnidirectional
    (interchangeable capsules)
  - Frequency response: 25–25,000 Hz ±3dB
  - Pad: -10dB attenuation
  - High-pass filter: 80Hz
  - Output impedance: <200 Ohms
  - Weight: <5 oz
  - Includes: SSM shock mount, padded wooden storage box
