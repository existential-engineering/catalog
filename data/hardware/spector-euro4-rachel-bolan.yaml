details: |-
  Rachel Bolan's work with the legendary Skid Row defined the era of 80's hard rock. His signature Spector aims to re-create those classic tones. The Euro4 Rachel Bolan features extremely comfortable, fully carved body is crafted from carved solid Maple. A 3-piece maple neck runs through the entire length of the instrument and features a 24 fret ebony fingerboard with Rachel's custom red Crown inlays. Outfitted with a lightweight, zinc brass alloy bridge and nut, premium EMG pickups and Spector's coveted Tone Pump active tone circuit, Rachel's signature Spector Euro is ready to rock the world's biggest stages.
