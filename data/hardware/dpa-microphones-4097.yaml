description: The 4097 CORE+ Supercardioid Choir Mic is unobtrusive, versatile
  and great sounding, for live broadcast shows with choir or ensemble vocal
  performance.
details: |-
  An inconspicuous floor stand solution specifically designed to capture the natural sound of a choir; the 4097 CORE+ is unlike any Choir Mic available on the market. Each part of the solution has been specifically designed and tested to ensure it meets the needs of a wide range of choir situations. As a supercardioid mic, the 4097 offers a highly directional pick-up pattern as well as low self noise and high sensitivity. Capable of handling extremely high SPLs allowing the mic to deliver undistorted natural sound, even when the choir sings loudly. Fitted with MicroLock, the mic provides even better stability and flexibility.
specs: |-
  - Directional pattern: Supercardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB, at 20 cm (7.9 in): 80 Hz - 15 kHz with 2 dB soft boost at 10-12 kHz. Second order low-cut filter at 80 Hz with DAD9099-BC
  - Sensitivity, nominal, ±3 dB at 1 kHz: 16 mV/Pa; -36 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 23 dB(A) re. 20 µPa (max 26 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 35 dB (max. 38 dB)
  - Distortion, THD < 0.5%: 130 dB SPL RMS, 133 dB SPL peak
  - Distortion, THD < 1%: 131 dB SPL RMS, 134 dB SPL peak
  - Dynamic range: Typ. 111 dB
  - Max. SPL, THD 10%: 136 dB SPL peak
  - Rated output impedance: From MicroLock: 30 - 40 Ω. From DAD9099 XLR Adapter: 100 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9099 XLR Adapter
  - Common mode rejection ratio (CMRR): > 60 dB from 50 Hz to 15 kHz with DAD9099 XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD9099: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9099 XLR Adapter
  - Connector: MicroLock. XLR via supplied DAD9099 adapter
  - Weight: Total: 5.1 kg (180 oz). Round Base: 4.4 kg (155 oz)
  - Maximum Total Height: 253 cm (100 in)
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black
  - Warranty: 2 years
  - IP rating: IP58
  - Technology: CORE+ amplifier
