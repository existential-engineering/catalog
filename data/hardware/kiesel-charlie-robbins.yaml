description: A limited artist edition built on Kiesel's Aries 6 string model and
  finished to Charlie Robbins' chosen options.
details: |-
  Built on Kiesel's Aries 6 string model and embellished with Charlie Robbins' choice options, this limited artist edition is specified as a single fixed configuration rather than a configurable model line.

  The guitar pairs a swamp ash body with a plain maple top, finished in Sea Foam Green with a natural clear rear finish and a clear satin matte top coat. The headstock is a 2 x 4 shape painted to match the body, carrying a white Kiesel logo and white pearloid tuner buttons.

  The neck is maple with a tung oil finish and a maple fingerboard at a 14 inch radius, fitted with stainless steel medium-jumbo frets, abalone dot inlays and an ivory Graph Tech TUSQ nut.

  Electronics are a pair of white Kiesel Guitars Beryllium humbuckers at bridge and neck, with white plastic knobs, chrome hardware, a white acrylic truss rod cover and a Hipshot fixed bridge.
specs: |-
  - Model: Aries
  - String count: 6
  - Scale length: 25.5"
  - Bridge: Hipshot fixed bridge
  - Body wood: swamp ash
  - Top wood: plain maple
  - Finish: Sea Foam Green
  - Rear finish: natural clear
  - Top coat: clear satin matte
  - Neck wood: maple, tung oil finish
  - Fingerboard wood: maple
  - Fingerboard radius: 14"
  - Nut: ivory Graph Tech TUSQ
  - Frets: stainless steel medium-jumbo
  - Headstock: 2 x 4, painted to match body
  - Tuner buttons: white pearloid
  - Truss rod cover: white acrylic
  - Logo: white Kiesel logo
  - Inlays: abalone dots
  - Hardware colour: chrome
  - Knobs: white plastic
  - Bridge pickup: white Kiesel Guitars Beryllium humbucker
  - Neck pickup: white Kiesel Guitars Beryllium humbucker
  - Passive humbuckers, so the guitar needs no battery and carries no power input
