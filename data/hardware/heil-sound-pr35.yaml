details: |-
  Product Overview

  The Heil PR 35 is a professional-quality dynamic handheld microphone specifically engineered for live vocal sound reinforcement, studio recording, and high-volume stage applications. Featuring a large 1.5-inch diaphragm dynamic element, the PR 35 delivers the clear, natural, and wide frequency response of a studio condenser microphone alongside the rugged durability and high isolation of a dynamic capsule.

  Designed to overcome demanding acoustic environments, the PR 35 features a multi-position low-end roll-off switch (allowing users to select between a full flat response or an 80 Hz high-pass filter) to eliminate unwanted low-frequency rumble and proximity boominess. Its supercardioid polar pattern provides an exceptional -35 dB of rear noise rejection at 180° off-axis , making it an outstanding choice for vocalists needing maximum gain-before-feedback on loud stages with high monitor or instrument bleed. To ensure comfort and longevity during live performances, the microphone is finished in a durable rubberized exterior coating that enhances grip while suppressing handling noise.
specs: |-
  - Large 1.5" Dynamic Diaphragm: Delivers an ultra-wide, linear frequency response (40 Hz – 18 kHz) that provides pristine condenser-like articulation and smooth vocal presence.
  - Multi-Position Low-End Roll-Off Switch: Built-in high-pass filter allows switching between UP (40 Hz – 18 kHz) for full-range response and DOWN (80 Hz – 18 kHz) to eliminate low-frequency rumble, stage thuds, or excessive proximity effect.
  - High Rear Noise Rejection (-35 dB): Supercardioid pickup pattern delivers powerful -35 dB rejection at 180° off-axis, isolating live vocals from stage volume, monitor bleed, and drum bleed.
  - High SPL Capacity (140 dB Max SPL): Handles high sound pressure levels effortlessly without distorting, making it equally effective on powerful lead vocalists and loud instruments.
  - Durable Rubberized Protective Coating: Rubber-coated exterior finish offers a comfortable grip, extra physical durability, and additional suppression of handling noise during live stage performances.
  - Plosive and Handling Protection: Internal shock mounting combined with acoustic damping shields the element from mechanical shock, vibration, and vocal plosives.
  - Passive Dynamic Design: Requires no phantom power or external preamp boosters, operating via a standard 3-pin XLR connection.
  - Element Type: Dynamic.
  - Frequency Response (Filter UP): 40 Hz – 18 kHz.
  - Frequency Response (Filter DOWN): 80 Hz – 18 kHz.
  - Polar Pattern: Supercardioid.
  - Rear Rejection (@ 180° off-axis): -35 dB.
  - Output Level (@ 1 kHz): -52.9 dB.
  - Impedance: 370 ohms balanced.
  - Max SPL: 140 dB.
  - Weight: 9 oz (255 g).
  - Output Connection: 3-pin XLR.
