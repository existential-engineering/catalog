description: >-
  The Yamaha TQ5 is an entry-level FM workstation in a compact keyboardless
  desktop unit, combining 4-operator FM synthesis with a built-in 8-track
  sequencer and digital effects. Featuring 8 voices of polyphony and 8-part
  multitimbrality, it was designed to make FM synthesis accessible to musicians
  on a budget. Released in 1988 during the decline of FM synthesis popularity,
  the TQ5 remains an affordable way to explore Yamaha's FM sound engine.
details: |-
  The TQ5 follows in the lineage of Yamaha's smaller FM synthesizers, featuring 4 FM operators per voice with 8 waveforms, 8 voices of polyphony, and 8-part multitimbrality. The unit includes Quick Edit keys for accessing basic parameters, enabling rapid sound modifications without deep menu diving.

  The TQ5 featured built-in digital effects including reverb, chorus, echo, and distortion, along with an 8-track sequencer with 8 song capacity, supporting its workstation functionality. It was designed for dual use as either a standalone unit or MIDI module.

  Released at a time when DX and FM synthesizers were becoming less popular in the market, the TQ5 did not achieve strong sales. However, its depressed market prices have preserved its original purpose of providing an FM workstation for entry-level musicians on a budget.
specs: |-
  - 8-voice polyphony
  - 4 FM operators with 8 waveforms
  - 8-part multitimbral
  - Built-in digital effects: reverb, chorus, echo, distortion
  - One LFO
  - ADSR envelopes
  - 8-track sequencer with 8 song capacity
  - 100 preset patches, 100 user patches
  - External memory card support
  - MIDI control
  - Desktop/tabletop module format
