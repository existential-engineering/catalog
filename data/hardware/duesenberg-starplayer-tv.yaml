description: Beauty, clarity, reliability. The Starplayer TV is known for its
  clear, flexible tone that feels at home in just about any genre.
details: |-
  The Starplayer TV Standard is Duesenberg's semi-hollow electric guitar, presented as a versatile instrument rather than a single-genre one. The body is semi-hollow with a solid sustain block, bent sides and an f-hole, measuring 46 x 34 cm with sides 4.5 cm deep, built from a laminated spruce top with laminated flamed maple back and sides and cream binding. Duesenberg states the centre block gives the open tonal response of a hollow construction with improved feedback resistance.

  The neck is a set neck in one-piece maple with a medium D profile, 42.5 mm at the nut and 52 mm at the twelfth fret, carrying an Indian rosewood fingerboard of 305 mm (12") radius with 22 jumbo frets and cream dot inlays. Scale length is 648 mm (25.5"), which Duesenberg describes as giving a snappy response, defined bass and a tight feel. Every fretboard goes through Duesenberg's Plek process, with each fret measured and levelled before hand finishing and polishing, so the action can be set low without fret buzz. A steel dual-action truss rod is fitted, and the high-gloss black headstock carries Duesenberg Z-Tuners and a metal ornament D-logo, the tuners designed so string ends tuck inside the shaft.

  Electronics pair a Duesenberg Domino P90 at the neck with a Duesenberg GrandVintage humbucker at the bridge, wired to one volume, one tone and a three-way pickup selector. In the middle position a custom wiring trims the low end of the humbucker for a more airy and responsive tone.

  Hardware is nickel finished and includes a Duesenberg Steel Saddle Bridge, Duesenberg standard Straplock-compatible strap pins and Duesenberg Custom 10/50 factory strings. Tremolo models carry the Duesenberg Diamond Deluxe Tremola, a vibrato unit the page describes as lightweight and tuning-stable, running on needle and nylon bearings with a freely rotating, adjustable arm and strings that thread through for quick changes; non-tremolo models use a Duesenberg aluminium stop tailpiece instead. Duesenberg notes that nickel ages naturally over time unless cleaned regularly, and that the geometric three-step motif recurs across the hardware from the headstock curves to the output jack.

  The instrument ships with the Duesenberg Custom Line Case as standard, described as handcrafted flightcase quality, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated spruce
  - Back, sides: Laminated flamed maple
  - Body dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream
  - Pickguard: Sparkle, Black/Gold Custom or nickel-plated brass (depending on the model)
  - Finish: PUR lacquer (Polyester used on Sparkle, Pearl and Pearloid tops). Back and sides Trans-Black, except for special models.
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tailpiece: Duesenberg Aluminum Stop Tailpiece (non-trem models only)
  - Vibrato System: Duesenberg Diamond Deluxe Tremola (trem models only)
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Special model (Outlaw): Skai-leather on top and headstock, nickel pickguard
  - Special model (Gold-Top): Cream pickguard and cream pickup rings
  - Special model (Pearl models): Pearl mosaic on top and headstock, nickel pickguard
  - Special model (TV+): Piezo bridge, stainless steel pickguard, multi-tone-pot
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
