name: B2 Bomber DAC
manufacturer: burl-audio
primaryCategory: audio-interface
categories:
  - rack-mount
  - outboard
url: "https://www.burlaudio.com/products/b2-bomber-dac"
description: "2-channel digital-to-analog converter featuring all-discrete
  class-A BOPA11 op-amps with passive filtering and a zero-capacitor signal
  path, designed for high-fidelity monitoring from 44.1 kHz to 192 kHz at 24-bit
  resolution."
details: |-
  The B2 Bomber DAC is the result of tireless digital-to-analog research and development. It features unique class-A, discrete BOPA11 op-amps with passive filtering and a zero capacitor signal path, making it ideal for critical monitoring applications.

  As a complement to the B2 Bomber ADC, the B2 Bomber DAC delivers exceptional low-end punch along with three-dimensional spaciality and stereo spread. Both units share identical, incredibly low-jitter clocking, precision metering, and audiophile quality 6-position stepped attenuators with standard headroom settings.

  The unit accepts 2 AES, SPDIF, and Toslink digital inputs. A BNC word clock input is included along with two BNC word clock outputs.
specs: |-
  - 44.1 kHz to 192 kHz, 24-bit, 2-channel DAC
  - NextGen BOPA11 all-discrete op-amps
  - Passive filters, all class-A signal path — zero capacitor signal path
  - Audiophile quality 6-position attenuator
  - High-definition metering with simultaneous RMS and peak indication
  - 2 AES, SPDIF, and Toslink digital inputs
  - BNC word clock input with two BNC word clock outputs
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - Frequency response at 96 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -0.3 dB @ 40 kHz
  - Frequency response at 192 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -1.5 dB @ 90 kHz
  - 115 dB dynamic range
  - -96 dB THD+N, full scale output = +22 dBU
  - Made in USA
