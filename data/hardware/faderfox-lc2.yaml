description: Special controller for sequencer software, optimized for Ableton
  Live. Setup files for Ableton Live as of version 4.1 are shipped with the
  controller.
details: |-
  Special controller for sequencer software (optimized for Ableton Live). Setup files for Ableton Live as of version 4.1 are shipped with the controller. Take the Live internal control surface 'LV2_LX2_LC2_LD2' to have all controls automapped, so setting files are no longer necessary. Independent of operating system and computer type (PC or Mac) due to the midi interface, with no driver necessary.

  The crossfader controls the Live-crossfader. 6 track faders let you switch between 2 fader groups (1-6, 7-12). 4 push-encoders give jump-free control of track-dependent and track-independent parameters, a total of 144 parameters. A main function gives fast encoder access to important functions like trackselect, slot/scene-scroll, mastervolume and clip/scene-launch. A joystick controls track-dependent and track-independent parameters, a total of 30 parameters. A button row with 6 buttons and LED's is programmable in 6 keymodes (scene-launch, fx-control, mute, solo etc.).

  Parameter feedback of LIVE button statuses is indicated by LED's (Mute, FX). Fadermute works for all controls by holding down the instrument's SHIFT button, and faderposition view by LED's appears while that button is held. A play-LED shows the beat speed. 39 LED's in different colors display various information, with low basic lights of all LED's for better orientation in dark club atmosphere.

  Independent power supply comes from standard or rechargeable batteries, 3 x AA cell, with a lifetime of about 30 to 60 hours, plus a powersave mode after 10 minutes of the last movement (running light) and LED battery control. A socket takes an external power adaptor (4.5-6V DC, min. 50 mA). Very compact design in a black, plastic casing (desktop format 180x105x70 mm, 450 g) with a silver aluminium front plate with anodised coating (abrasion resistant) and inscriptions. High-quality faders, encoders and joystick from ALPS.

  The system is expandable by other micromodul controllers, with easy chaining by midi connections, and a midi-merge function. It is compatible to the 1st and 2nd micromodul line, with the same cc and note numbers as LV1, LX1, LV2, LX2 and LD2.
specs: |-
  - Special controller for sequencer software, optimized for Ableton Live
  - Setup files for Ableton Live as of version 4.1 shipped with the controller
  - Works with the Live internal control surface 'LV2_LX2_LC2_LD2' for automapped controls
  - Independent of operating system and computer type (PC or Mac), no driver necessary
  - Crossfader controls the Live-crossfader
  - 6 track faders with switching between 2 fader groups (1-6, 7-12)
  - 4 push-encoders for jump-free control, total of 144 parameters
  - Joystick for track-dependent and track-independent parameters, total of 30 parameters
  - Button row with 6 buttons and LED's, programmable in 6 keymodes
  - Parameter feedback of LIVE button statuses indicated by LED's (Mute, FX)
  - Fadermute and faderposition view via the SHIFT button
  - Play-LED to show the beat speed
  - 39 LED's in different colors to display various information
  - Battery powered by 3 x AA standard or rechargeable cells, lifetime about 30 to 60 hours
  - Powersave mode after 10 minutes of the last movement
  - LED battery control
  - Socket for an external power adaptor (4.5-6V DC, min. 50 mA)
  - Midi-merge function
  - High-quality faders, encoders and joystick from ALPS
  - Black plastic casing with silver anodised aluminium front plate, desktop format 180x105x70 mm, 450 g
  - Connects over MIDI to the computer's sound card or MIDI interface (a USB MIDI interface when the computer has none)
  - Expandable by other micromodul controllers, chained by midi connections
  - Compatible to the 1st and 2nd micromodul line, same cc and note numbers as LV1, LX1, LV2, LX2 and LD2
