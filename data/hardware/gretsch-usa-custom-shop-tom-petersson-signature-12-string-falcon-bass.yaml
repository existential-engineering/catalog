details: |-
  The members of Cheap Trick have reigned as the high priests of hard-rocking U.S. power pop for more than 40 years, with an influential and infectiously ever-youthful sound driven by the impeccable playing and volcanic sound of bassist and co-founder Tom Petersson.

  Petersson pioneered the creation and use of the 12-string bass guitar, and the Gretsch Custom Shop is supremely delighted to honor him with the USA Custom Shop Tom Petersson Signature 12-String Falcon Bass.

  Stunning in style and utterly seismic in tone, it puts Petersson's distinctive stamp on the classic White Falcon Bass design, with premium features including dual custom Seymour Duncan Super'Tron pickups, short scale length (30.5"), a specially designed 12-string Space Control bridge and Gretsch Cadillac tailpiece.
