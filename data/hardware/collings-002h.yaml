details: |-
  The 002H is a 12-fret 00-size acoustic guitar with East Indian rosewood back and sides and herringbone trim. With body dimensions combining timeless appearance with a comfortable size, wide neck, and shorter 24 7/8" string scale, the tone is typically balanced and precise, suited for vocal accompaniment to ragtime solos.

  Features include a Sitka spruce top with pre-war scalloped X-bracing, ebony fingerboard with abalone diamond and square inlays, ivoroid body binding with herringbone purfling, tortoise pickguard, and Nickel Waverly tuners.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard inlays: Abalone diamond & square
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Nut: Bone
  - Nut width: 1 13/16"
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Scale length: 24 7/8"
  - Bracing: Pre-war scalloped X-brace (Sitka spruce)
  - Neck profile: Modified V
  - Body width: 14 1/4"
  - Body length: 19 3/8"
  - Body depth: 4"
  - Total length: 38"
  - Body finish: High gloss nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
  - Body binding: Ivoroid with herringbone purfling
  - Rosette: Ivory/tortoise/ivory & black/white purflings
