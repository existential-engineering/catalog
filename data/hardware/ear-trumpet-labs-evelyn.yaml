description: A large diaphragm ORTF stereo microphone with a visually striking
  dual pivoting two-headed design. Beautiful, with stunningly natural stereo
  sound.
details: |-
  Evelyn is a stereo microphone consisting of two closely matched large diaphragm capsules mounted in individually pivoting head baskets, spaced at the correct distance for the ORTF stereo recording technique. Both the capsules and the JFET transistors for each side of the stereo pair are hand-matched by Ear Trumpet Labs for stereo imaging, and the electronics are hand-wired, which the maker says produces a natural stereo sound.

  Evelyn makes an easy-to-deploy stereo drum overhead or room mic, and is also adept at applications beyond standard stereo miking. With its heritage from the Ear Trumpet Labs Edwina, Evelyn works as a live miking solution for acoustic ensembles from traditional bluegrass bands to string quartets, with feedback control and off-pattern rejection.

  The striking design complements the sound, and on a live stage the microphone looks distinctive. Ear Trumpet Labs builds its solid designs by hand from copper plumbing pipe and fixtures, electrical flanges, brass and stainless steel, and the 1 inch body fits standard microphone clips.

  Each microphone includes a standard 5-pin XLR to dual 3-pin XLR adapter cable, and the pinout is standard so other stereo cables can be used. Each Evelyn comes in a solid metal tool case with hand-cut foam lining, and units are custom built and ship within three weeks.
specs: |-
  - Hand made studio and live stereo condenser microphone with unique appearance
  - Dual fixed-cardioid large (26mm) diaphragm condenser capsules mounted in pivoting heads, spaced ideally for ORTF stereo
  - Capsules and JFET transistors hand-matched between the two sides of the stereo pair
  - 1 inch body fits standard microphone clips
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - Includes a standard 5-pin XLR to dual 3-pin XLR adapter cable, with a standard pinout
  - Supplied in a solid metal tool case with hand-cut foam lining
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000Hz, 94 dB): -40.9 dB (9 mV/Pa)
  - Power requirement: +24V to +48V phantom power
