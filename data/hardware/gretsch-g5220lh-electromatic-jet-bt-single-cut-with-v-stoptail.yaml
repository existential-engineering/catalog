details: |-
  True Jet Essence with Broad'Tron Might - The all-new G5220LH Electromatic Jet BT Single-Cut with V-Stoptail delivers Broad'Tron power with classic Jet clarity.

  Chambered Mahogany Bodies - At the heart of each Electromatic Jet BT is a chambered mahogany body with maple top that produces a rich, present mid-range that accentuates big lows and shimmering highs.

  All-new Black Top Broad'Tron Pickups - A pair of Black Top Broad'Tron pickups drive the chambered mahogany body through thick, aggressive overdrive while maintaining astounding definition and note balance.

  Versatile Controls - The Electromatic Jet BT is equipped with essential features that give you complete tonal control.
