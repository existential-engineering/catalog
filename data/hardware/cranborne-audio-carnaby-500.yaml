description: Carnaby 500 is a 3-band parametric EQ for the 500 series format
  with a unique and revolutionary EQ concept conceived and created by Cranborne
  Audio. Carnaby 500 is the world's first Harmonic EQ, an analogue EQ that uses
  harmonic saturation to boost and cut frequency content.
details: |-
  Carnaby 500 is a 500 series module built around Cranborne Audio's Harmonic EQ circuit, a 3-band parametric equalizer that boosts and cuts frequency content using genuine analogue harmonic saturation rather than conventional filtering alone. The design pairs a LO shelving band, a MID peaking band, and a HI shelving band, each with its own LED indicator that displays the amount of saturation being generated as the band is driven.

  Each band offers up to 10dB of cut or boost through stepped, front-panel controls, with the LO band covering 20Hz-420Hz as a low shelf, the MID band covering 200Hz-6.2kHz as a peak filter, and the HI band covering 5kHz-25kHz as a high shelf. Overall input and output level trims of plus or minus 20dB are provided alongside true-bypass IN/OUT switching.

  Carnaby 500 includes OptoSync, a wireless stereo-linking feature that keeps paired modules synchronized, along with an eighth-inch TRS socket for linking modules that are not mounted adjacently in the rack. An auto-calibration routine matches the circuits of two linked modules for accurate stereo operation.

  The module measures 170mm wide, 31mm tall, and 133mm deep, weighing 0.4kg, and is rated for a maximum input and output level of +26dBu with a noise floor below -93dBu with all bands bypassed. It draws 140mA per rail at idle and up to 160mA at peak.
specs: |-
  - 3-band parametric EQ with Harmonic EQ circuit (LO, MID, HI bands)
  - LO band: Low Shelf, 20Hz-420Hz, up to ±8.5dB @ -6dBu, ±12dB @ +14dBu
  - MID band: Peak Filter, 200Hz-6.2kHz, up to ±5dB @ -6dBu, +10dB/-18dB @ +14dBu
  - HI band: High Shelf, 5kHz-25kHz, up to ±12dB @ -6dBu, +13dB/-18dB @ +14dBu
  - Per-band LED saturation indicators (LO, MID, HI)
  - ±20dB Input/Output level controls
  - OptoSync wireless stereo-linking between modules
  - 1/8-inch TRS socket for linking non-adjacent modules
  - True-bypass IN/OUT switching
  - Circuit auto-calibration for stereo matching
  - Max Input/Output Level: +26dBu (<0.003% THD)
  - Noise Floor: <-93dBu (all bands bypassed)
  - Input Impedance: 10 kOhms / Output Impedance: 150 Ohms
  - Current Draw: 140mA per rail idle, 160mA peak
  - Dimensions: 170mm W x 31mm H x 133mm D, 0.4kg
  - Operating Temperature: +1 to 35°C, Storage Temperature: -20 to 50°C
