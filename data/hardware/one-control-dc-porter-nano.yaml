details: |-
  Many guitarists are always seeking simpler solutions to power their pedals. The One Control DC Porter Nano model is one of the lightest and easiest to use power supplies on the market, as it is powered by any USB power source! You can use various USB power supplies such as cellphone chargers or computers, as well as various power banks, batteries, and even solar powered devices. The DC Porter Nano converts USB power into a standard center negative DC power supply for your pedalboard. These can be especially useful in high electrical noise environments, where using clean battery power can provide lower noise in your signal. Power your board with everything from your cellphone charger to a solar panel with the DC Porter Nano !
