description: The Cali76 FET Compressor is a studio-grade compressor pedal
  inspired by the world-famous Urei 1176 studio compressor, heard on many of the
  greatest studio recordings since the 1960s. The Cali76 FET Compressor uses
  uncompromising all-analogue circuitry to make these distinctive, ultra-fast
  FET compression tones available to the modern guitarist.
details: |-
  The latest in a long lineage of Cali76 compressors, the Cali76 FET Compressor features a full set of studio-style controls, a DRY knob for parallel compression and an improved sidechain that matches the response of our sought-after "large format" Cali76 - the pedal that put Origin Effects on the map back in 2012.

  With a 10-LED gain reduction meter, a pedalboard friendly enclosure and massive headroom thanks to internally increased voltage, the Cali76 FET Compressor marks the culmination of over a decade of experience making the world's finest compressor pedals.

  It wouldn't be a modern compressor pedal without a DRY control, allowing you to achieve parallel compression without the need for any extra gear. Parallel compression is a popular studio technique that mixes heavy compression with the natural dynamics of your dry signal. The DRY control on the Cali76 FET Compressor lets you do this on your pedal board, getting you the perfect blend of presence, sustain and articulation.

  Great compression needs great headroom and this pedal has plenty. Voltages are increased internally to 24V from a standard 9VDC supply. The Cali76 FET Compressor can stay crystal-clear anywhere in your signal chain and can deal with line-level signals from keyboards and studio outboard gear.

  Trust your ears, but trust your meters too! The 10-LED gain reduction meter gives you an accurate visual indication of how much the pedal is compressing and how fast. Housed in a compact, brushed stainless enclosure and built in the UK from premium components, the Cali76 FET Compressor puts the tone, versatility and sophistication of studio compression right at your feet.
specs: |-
  - All-analogue signal path
  - Ultra-fast FET compression
  - 1176-inspired circuitry
  - Dedicated Attack, Release and Ratio controls
  - Dry Blend control for parallel compression
  - 10-LED bar graph gain reduction meter
  - Voltage increased internally to 24V for high headroom
  - Optimised for guitar, compatible with line-level signals
  - Improved dynamic response matches large format Cali76
  - High-quality buffered bypass
  - Premium components throughout
  - Designed and built in England
  - Weight: 553 g (1.22 lb)
  - Dimensions: 124 x 64 x 58 mm (4.8 x 2.5 x 2.3 in.) L x W x H, includes knobs and switches
  - Input Impedance: 1 M ohm
  - Output Impedance: 1 k ohm
  - Current Draw: 200 mA
  - Power Supply: 9V DC 2.1 mm centre-negative (mains adaptor only, not included)
