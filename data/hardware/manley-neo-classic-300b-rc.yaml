description: "The Neo-Classic 300B RC: first 300B tube preamplifier. 6SL7 input,
  tube rectification, custom transformers. Drives headphones and line-level
  sources."
details: |-
  The Manley Neo-Classic 300B RC Preamplifier employs the 300B triode as a dedicated line driver in single-ended Class A configuration, combining vacuum tube rectification and regulation with advanced ripple rejection circuitry for exceptional noise floor performance. Hand-assembled in California, this all-triode design delivers the transparency and dimensional imaging characteristic of zero-crossover-distortion amplification while providing comprehensive source integration and remote control functionality for modern high-fidelity systems.

  The preamplifier architecture maximizes the linearity and bandwidth of the 300B triode in single-ended operation. Vacuum tube rectification and regulation, combined with proprietary ripple rejection topology, achieve exceptionally low noise performance essential for resolving micro-dynamic information and spatial cues. The all-triode Class A signal path maintains phase coherence and harmonic accuracy from input to output, ensuring faithful reproduction of source material without solid-state artifacts.

  The 300B output stage functions as a dedicated Class A headphone amplifier, delivering 1 watt into 600 Ohm loads with exceptional current drive capability. A three-position impedance selector optimizes output matching for headphones ranging from 30 Ohms to 4000 Ohms, ensuring proper damping factor and transient response across all driver types. This topology provides reference-grade headphone performance directly from the preamplifier without additional amplification stages.

  System control is executed through a precision motorized ALPS volume potentiometer operated via omnidirectional RF remote, providing wireless functionality through walls and cabinetry. Five line-level inputs accommodate multiple sources, while a dedicated unbuffered record output and post-volume subwoofer output enable flexible system integration. The Neo-Classic 300B RC serves as a complete analog control center for discerning high-fidelity installations.
specs: |-
  - 300B triode output stage in single-ended Class A topology
  - Vacuum tube rectification and regulation with low-noise power supply
  - Dedicated headphone amplification delivering 1W into 600 Ohm loads
  - Motorized ALPS volume control with omnidirectional RF remote
  - Three-position headphone impedance selector (30 Ohms to 4000 Ohms)
  - Automatic speaker muting when headphones connected
  - Tubes: 2 x 300B, 2 x 6SL7, 2 x 5AR4 (Rectifier)
  - Inputs: 5 stereo pair Unbalanced RCA
  - Max Output: +17.2 dBu (Line Stage)
  - Headphone Power: 1 W into 600 Ohms
  - S/N Ratio: 105 dB typical (A WGT)
  - Dimensions: 19" W x 13" L x 4" H (Top Deck)
