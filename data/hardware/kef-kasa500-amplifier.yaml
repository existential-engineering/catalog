description: |-
  Powerful Class-D dual 250W-per-channel subwoofer amplifier with DSP
  control, optimized for KEF Ci subwoofers. Features selectable stereo RCA
  line level, mono LFE RCA, and stereo speaker-level inputs with
  DSP-configurable pass-through and optional high-pass filters.
specs: |-
  - Amplifier Power: 2 × 250W @ 4Ω; Bridge: 1 × 500W @ 8Ω
  - Amplifier Class: Class-D
  - Crossover Frequency: 40–140Hz adjustable or software bypass
  - Trigger Input: 8–14V DC
  - Dimensions: 88 × 432 × 304mm (standard); 2 EIA rack spaces
  - Weight: 4kg
  - Compatible: KEF Ci subwoofers (Ci3160RLb-THX, Ci250RRb-THX, Ci200QSb-THX, Ci200TRb, Ci4100QLb)
