description: Mackie EM-98MS On-Camera Shotgun Microphone for Smartphones and DSLRs.
details: |-
  The best video is nothing without great audio to go with it, and that starts at the source. Designed to minimize sound from off-camera, the lightweight EM-98MS microphone is suited to content creation at home or on location. With features like variable gain level and high-pass filters, tailoring the sound to your needs is easy and flexible.

  You can even connect a pair of headphones directly to the microphone to monitor its output. And with an internal Lithium-ion battery, you are ready for action without the need for external power. EM-98MS includes two different windscreens, a professional shockmount, cables, and a carrying case.

  Not only do shotgun microphones sound right for video, dialogue, and capturing specific sounds, they do it while rejecting most other noises. This is thanks to the long shape of the microphone that works to cancel out sound from the sides. The physical design, combined with the onboard high-pass filters for eliminating rumble and included windscreens ensure clean, transparent audio.
specs: |-
  - Broadcast-worthy condenser microphone
  - High-directivity super-cardioid design focuses sound capture where it is pointed
  - Included cold shoe shockmount isolates the microphone from vibrations and handling noise
  - Compact and ultra-lightweight for easy transport and setup
  - Dedicated headphone output for real-time monitoring
  - Internal rechargeable Lithium-ion battery
  - 75 / 150Hz high-pass filters eliminate low frequency rumble
  - Fully variable gain allows for precise level control
  - Overdrive protection mode lowers the right channel level by -10dB
  - Auto on/off with devices that supply plugin power
  - Includes furry and foam windscreens
  - Cables for both DSLR and smartphone connections included plus charging cable
  - Mountable on 3/8-inch tripod screw
  - Includes premium carrying case
