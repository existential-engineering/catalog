description: The Ashdown RM-800 EVO II is a lightweight bass head for musicians
  seeking massive headroom without the weight. At just 2.6kg it delivers 800
  watts with an onboard headphone preamp, 5-band EQ, compressor and
  valve-emulated overdrive.
details: |-
  Weighing a mere 2.6kg, the RM-800 EVO II delivers 800 watts of power. The EVO II range includes an onboard headphone preamp for silent practice, and accommodates both passive and active instruments through a crystal-clear signal path to the input control, tuned with the iconic Ashdown VU meter. Tonal possibilities include a Shape button, 5-band EQ, onboard compressor and valve-emulated overdrive. The drive control adds valve-driven overdrive and the sub-harmonic controls offer added depth and richness, both foot-switchable with an FS-2 footswitch (sold separately). It is housed in a clear anodized alloy housing with a black anodized front panel.
specs: |-
  - Power Output: 800 Watts
  - Weight: 2.6 kg (5.5 lbs)
  - Instrument Input: passive and active compatible, with VU meter
  - EQ: 5-band, plus Shape button
  - Onboard compressor
  - Valve-emulated overdrive (drive control)
  - Sub-harmonic controls
  - Onboard headphone preamp
  - FS-2 footswitch compatible (sold separately)
