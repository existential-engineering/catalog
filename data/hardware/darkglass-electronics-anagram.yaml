id: s4iHIczw0pDLDsSH00Bml
name: Anagram
manufacturer: darkglass-electronics
primaryCategory: multi-effect
categories:
  - pedal
url: https://www.darkglass.com/products/anagram
description: Anagram is a professional multi-effects processor optimized for
  bass, powered by a hexacore processor with 32-bit/48kHz audio, a 7-inch
  touchscreen, 50+ effects, a looper, tuner, and Neural Amp Modeler integration.
details: |-
  The Anagram is a professional-grade multi-effects processor specifically optimized for bass players. Powered by a state-of-the-art hexacore processor with 32-bit/48kHz audio processing, it delivers ultra-low latency, pristine clarity, and studio-grade sound for both live performance and studio work. The device features a 7-inch high-brightness touchscreen with three footswitches and six high-resolution endless rotary knobs for intuitive control.

  The unit ships loaded with a curated collection of distinct preamps, over 50 customizable effects, a looper, and a tuner. Neural Amp Modeler (NAM) integration provides access to 10,000+ high-quality amps and effects, and it also supports AIDA-X neural models and impulse responses. Musicians can construct signal chains in series (up to 12 blocks) or parallel (up to 24 blocks). The Anagram Marketplace lets users share creations and access additional content.

  The platform runs KosmOS, a Linux-based operating system, and includes a Global EQ mixer for line, XLR, and headphone outputs. It offers extensive studio and stage I/O, USB audio, MIDI, and Bluetooth connectivity, and ships with a carry case.
specs: |-
  - State-of-the-art hexacore processor with 32-bit/48kHz audio processing
  - 7-inch high-brightness touchscreen, three footswitches, six endless rotary knobs
  - 50+ customizable effects, curated preamps, looper, tuner
  - Neural Amp Modeler (NAM) integration: access to 10,000+ amps and effects
  - AIDA-X neural model and impulse response support
  - Signal chains in series (12 blocks) or parallel (24 blocks)
  - USB Audio, MIDI and Bluetooth connectivity
  - Runs KosmOS (Linux-based OS)
  - Includes carry case
