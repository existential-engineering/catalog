description: >-
  First introduced in 1976, the StingRay has been one of the most iconic bass
  guitars in history. The current StingRay Special retains the signature
  features — solid construction, oval pickguard, 3+1 tuning configuration, and
  Music Man humbucker — while modernizing body contours, electronics, and
  hardware.
details: |-
  The StingRay Special is a modernized iteration of the classic StingRay bass, optimized for comfort and playability while retaining the iconic features that have defined the model since 1976: solid construction, oval pickguard, 3+1 tuning configuration, and the signature Music Man humbucker.

  Enhanced body contours improve ergonomics, and a 5-bolt sculpted neck joint provides uninhibited access to all 22 stainless steel frets. The neck is roasted maple with options for maple, rosewood, or ebony fretboards.

  Electronics consist of neodymium humbucking pickups (single H or dual HH configurations) paired with an 18-volt 3-band active preamp, delivering increased output and expanded tonal range.

  Hardware includes lightweight custom tuning machines and the vintage Music Man top-loaded chrome steel bridge, contributing to improved balance and tuning stability.
specs: |-
  - Body: Select hardwoods
  - Body finish: High gloss polyester (matte on Black Rock)
  - Neck: Roasted maple
  - Fretboard options: Maple, rosewood, or ebony
  - Frets: 22 stainless steel, high-profile wide
  - Scale length: 34 inches (86.4 cm)
  - Neck radius: 11 inches (27.9 cm)
  - Neck width: 1-11/16 inch at nut, 2-1/2 inch at last fret
  - Pickups: Neodymium humbucking (H or HH configurations)
  - Electronics: 18-volt 3-band active preamp
  - Bridge: Vintage Music Man top-loaded chrome steel
  - Tuners: Lightweight custom tuning machines
  - Headstock length: 8-3/4 inches
  - Body dimensions: 13-1/2 inch wide, 1-5/8 inch thick, 44-7/8 inch long
  - Strings: Super Slinky Bass #2834 (45w-65w-80w-100w)
  - Neck joint: 5-bolt sculpted
