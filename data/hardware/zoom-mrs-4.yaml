description: The MRS-4 is a 4-track recorder that uses SmartMedia cards for storing data.
details: |-
  The MRS-4 offers simultaneous 4-track playback and 2-track recording. Eight virtual takes per track add up to a total of 32 takes available for recording.

  Hi/Lo EQ, effect send and other track parameters can be set individually for each track, and the bounce feature lets you bounce existing material onto 2 tracks while performing simultaneous playback of 4 tracks, even when there are no empty tracks.

  The MRS-4 incorporates an insert effect for processing the input signal, a send/return effect for use in a mixer loop, and a mixdown effect for use on the master bus.

  A metronome, MIDI output, AUX input and long-stroke faders round out the package.

  The MRS-4 Card Manager software for Windows and Macintosh can be downloaded from Zoom free of charge. On a computer equipped with a SmartMedia card reader it converts MRS-4 audio data into WAV files, converts WAV and AIFF files into MRS-4 audio data, and backs up the contents of the SmartMedia card onto the computer's hard disk.
specs: |-
  - Recorder: 4 physical tracks, 32 virtual takes (8 V-takes per track), 2 simultaneous recording tracks, 4 simultaneous playback tracks
  - Recording media: SmartMedia card, 16 to 128 MB (3.3 V). A 32 MB card is supplied
  - Recording grade: 32 kHz (HiFi) or 16 kHz (Long)
  - Maximum recording time on a single monaural track: 8 minutes or more on 16 MB in HiFi, up to 135 minutes or more on 128 MB in Long
  - Track editing functions: copy and paste, erase, exchange, manual and auto punch-in/out, bounce and A-B repeat. 50 marker points per song
  - Mixer: five 45 mm faders (tracks 1 to 4 plus master), 8 level meter bars, per-track equalizer, effect send and pan, stereo link on tracks 1+2 or 3+4
  - Equalizer: High (f 500 to 8000 Hz, gain +/-12 dB), Low (f 63 to 2000 Hz, gain +/-12 dB)
  - Insert effects: compressor, limiter, cabinet simulator, mic pre
  - Send/return effects: hall, room, doubling, delay, chorus
  - Mixdown effects: power, boost, vocal
  - Chromatic auto tuner and metronome (tempo 40.0 to 250.0, time signature 0/4 to 8/4, precount off or 2 to 8)
  - Maximum number of songs: 15
  - A/D converter: 20-bit, 64x oversampling. D/A converter: 20-bit, 8x oversampling
  - Sampling frequency: 32 kHz
  - Display: MRS-4 original LCD with backlight
  - Inputs: 2 standard mono phone jacks, input level -50 to +4 dBm continuously variable, input impedance 1 to 500 kilohms continuously variable
  - AUX input (L/MONO, R): 2 standard mono phone jacks, input impedance 10 kilohms (mono) or 20 kilohms (stereo)
  - Master out: RCA type phono jacks (L/R), rated output level -10 dBm into 10 kilohms or higher, output impedance 1 kilohm maximum
  - Headphone output: standard stereo phone jack, 50 mW into a 32-ohm load
  - MIDI OUT connector
  - Dimensions: 220 (W) x 165 (D) x 56.3 (H) mm
  - Weight: 700 g without batteries
  - Power requirements: DC 9 V 300 mA from the Zoom AD-0006 AC adapter, or four IEC R6 (size AA) batteries with a battery life of 5 hours or more using alkaline cells
