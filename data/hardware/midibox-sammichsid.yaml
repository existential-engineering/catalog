description: >-
  The SammichSID is a DIY synthesizer kit based on the open-source MidiBox
  platform, featuring dual Commodore 64 SID chips for stereo operation. It
  combines powerful chip-based synthesis with an affordable, compact form factor
  that can be assembled with intermediate soldering skills. The synthesis engine
  supports monophonic, polyphonic, and hybrid voice configurations with
  extensive modulation capabilities.
details: |-
  The SammichSID is a specific implementation of the larger MidiBox SID project, an open-source modular synthesis platform. Where the full MidiBox SID requires multiple PCBs, the SammichSID streamlines the design into two circuit boards that nest together within a custom enclosure, making it accessible to builders with intermediate soldering skills.

  The synthesizer employs dual SID chips, each providing three independent oscillators and one analog filter. This configuration yields six total voices with considerable flexibility in voice assignment. The synthesis engine can operate as a monophonic bass instrument with extreme parameter control, a six-voice polyphonic synthesizer, or various hybrid configurations utilizing oscillator synchronization and ring modulation between voices.

  The MidiBox software provides comprehensive control over all synthesis parameters through a powerful modulation matrix. Six independent LFOs provide modulation sources, while six DADDSRR envelope generators with optional nonlinear curves shape amplitude and filter responses. The sequencer implementation includes a TB-303-inspired bassline sequencer, drum sequencer, and arpeggiator system with six independent voice assignment options.

  Although kits are no longer manufactured, completed units regularly appear on the secondhand market. Its combination of affordability and synthesis depth positions it as a premier SID-based synthesizer option for chiptune and electronic music producers.
specs: |-
  - Dual Commodore 64 SID chips in stereo configuration
  - Six total oscillators (three per chip/filter section)
  - Two-voice multitimbral operation
  - One 12dB/octave analog filter per SID chip
  - Waveforms: sawtooth, triangle, pulse, quasi-random noise (all mixable)
  - Six independent LFOs with modulation matrix
  - Six DADDSRR envelope generators with optional nonlinear curves
  - Wavetable sequencer, TB-303-style bassline sequencer, and drum sequencer
  - Six independent arpeggiators with flexible voice assignment
  - 4 banks of 128 patches plus 128 ensembles
  - MIDI In/Out
  - DIY kit with two nested PCBs in custom enclosure
