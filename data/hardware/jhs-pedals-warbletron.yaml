description: A vibrato/chorus modulation pedal with a large foot-controllable
  speed knob, depth control, and a toggle to switch between vibrato and chorus
  modes.
details: |-
  From the 60's came an effect that had a serious impact on the way guitarists expressed themselves — an effect that when used right had that 'wow' factor, a tool that helped make the Star Spangled Banner relevant to a new generation in the hands of Jimi Hendrix. Some of the most influential guitarists have consistently found a way to express their voice with this circuit.

  With a large speed control that is easily controlled with your foot, changes to the speed of the effect are easy during live settings. The Speed LED blinks in time with the speed even when the unit is off so you always know what is going on inside. Controls for Depth (intensity of the effect), Volume Cut, and a vibrato/chorus toggle (gives you the classic chorus or vibrato settings with the flick of a switch). The Warbletron runs on standard 9V power and internally converts it to 15V for more headroom and power.
