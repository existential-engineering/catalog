url: https://dynaudio.com/professional-audio/dynaudio-acoustics-delta-amplifiers/delta-40-dsp
description: "The Delta series philosophy: reliability, trust and transparent
  amplification of your mix."
details: |-
  Every model uses the highest-quality power-amplifier technology so you know for a fact that what goes in, comes out exactly as intended. Only louder.

  The 2U Delta 40 yields a huge 4x 1000W at 4 ohms or 2x 2400W when bridged. And it does so without breaking a sweat, while delivering enviably low distortion and noise figures. For instance, THD is as low as <0.18% at 1kHz.

  Analogue or AoIP via Dante? Delta 40 handles up to four channels; it's a future-proof system that can keep up with whatever your studio throws at it. When using Dante, your audio is converted by 24-bit/96kHz DACs.

  Should the need for room tuning arise, you also get access to pristine DSP features. These span three dynamic and eight static EQ bands per input channel, and nine static EQ bands per output. Add to that, a suite of additional filters.

  You also get wireless control via the DeltaDirect app for iPad, GPIO for remote control and monitoring, and redundant back-up amplifier inputs. Want a stereo four-way system? Just connect to a Delta DSP amplifier with a single Cat 5 cable to eliminate the need for external processing.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Acoustic Amplifiers
  - Type: Amplifier
  - Number of channels: 4
  - Output power per channel @ 8 ohms: 500W
  - Output power per channel @ 4 ohms: 1000W
  - Output power per channel @ 2.7 ohms: 1400W
  - Output power per channel @ 2 ohms: 1200W (amplifier stable, output reduced)
  - Output power bridged @ 8 ohms: 2000W
  - Output power bridged @ 4 ohms: 2400W
  - THD @ 1kHz (1dB below max output): < 0.18%
  - THD 20Hz to 20kHz (1dB below max output): < 0.2%
  - Gain: 32dB
  - Sensitivity (for max power): 6.2dBu
  - Frequency response: 20Hz to 20kHz (+0/-0.5dB)
  - Power consumption (standby): < 5W
  - Power consumption nominal @ 240V into 4 ohms: 2.9A
  - Power consumption nominal @ 120V into 4 ohms: 6.0A
  - Chassis: 2U rack
  - Dimensions (HxWxD): 88 x 482 x 428 mm
  - Weight: 10.0 kg (22.0 lbs)
  - Boxed weight: 12.0 kg (26.5 lbs)
  - DSP: 3 dynamic + 8 static EQ bands per input channel, 9 static EQ bands per output
  - Control: DeltaDirect app for iPad (wireless), GPIO for remote control and monitoring
  - Redundancy: Redundant back-up amplifier inputs
  - Network audio: Dante / AES67 (24-bit / 96kHz DACs)
  - Mains input: 90-260 VAC (max 120W) via IEC C13
