description: A compact powered subwoofer with a 10-inch long-stroke woofer and
  Hypex Class-D amplification, featuring WiSA wireless connectivity, standard
  wired connections and Bluetooth app-controlled DSP including room correction.
details: |-
  Both Black and White are delivered with Black grilles. Need XLR cables? Our 4-meter XLR to RCA cable set is available here. For many who follow us, this has been a project we have worked on for over 2 years now. We wanted a subwoofer that would be less intrusive in your typical home but, in typical Buchardt fashion, perform well beyond what users expect from its size. The SUB10 features a very powerful long-stroke 10" woofer that has been designed specifically for this exact enclosure and Hypex amplifier. Getting the woofer just right was the main reason for its long development process. This allows us output capabilities way beyond our competition in the compact subwoofer market. But there's more! This subwoofer also carries WiSA for wireless use with our active speakers, as well as your standard wired connections for passive systems. It has Bluetooth for app-controlled DSP functions like Room Correction, Manual EQ, variable LLE slider, and more. The only 16-centimeter / 6.3" slim design is ideal for near-wall placement both on its side, standing up, and even lying on its back if you have special application needs, like placing it under your couch. Interested in adding the Zen Mic for room correction? You can find it here . (You need Zen for doing room correction on Android)
