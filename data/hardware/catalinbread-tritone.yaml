description: The Tritone is a pitch echo pedal that combines a call-and-response
  octave-up effect with a blendable perfect fifth and onboard slapback echo,
  allowing players to craft bursts of three-note arpeggios for lead augmentation
  or rhythmic texture. The onboard slapback echo can be pushed into
  self-oscillation at higher feedback settings.
details: |-
  The Tritone pairs an octave-up with a blendable perfect fifth delayed at half the unit's delay time, creating three-note arpeggios on each played note. Controls include MIX (master wet-dry blend), TRITONE (perfect fifth blend), TIME (arpeggio speed), and ECHO (slapback feedback — can self-oscillate at higher settings).

  A limited Proto Club release. Power accepts 9-18V DC center-negative, minimum 100mA. Backed by a 3-year warranty.
