description: Classic German channel sound in the Colour format. The FET-72
  recreates the V72-style amplifier circuit using JFETs in place of vacuum
  tubes, with switchable triode or pentode modes, selectable negative feedback,
  and a 4-position high-cut filter.
details: |-
  The FET-72 reworks the classic V72-style tube amplifier circuit around JFETs instead of vacuum tubes, giving access to the familiar German module sound with a wider set of options.

  In Classic mode (NFB and Pentode) the module sits closest to its vintage inspiration, with a big, thick low end and a smooth top that does not read as dark. Removing negative feedback (NO NFB) rounds off the frequency response and makes the low end less pronounced. Triode mode drops the high-frequency response subtly and smooths the transition from clean to distorted as the host's Drive control comes up, while Pentode mode is more aggressive.

  The jumpered 4-position HI CUT low-pass filter (Off, 18kHz, 12kHz, 6kHz) tames the brightness that added harmonic distortion introduces when the module is driven hard.

  An output transformer adds depth and weight. A Colour host is required and sold separately: Chroma, Mister Focus, or a DIY Recording Equipment Colour Palette. Assembled and tested by Locomotive Audio.
specs: |-
  - Triode or Pentode mode
  - Negative Feedback (NFB) or No Negative Feedback (NO NFB)
  - Output transformer for depth and weight
  - Jumpered 4-position low pass filter (Off, 18kHz, 12kHz, 6kHz)
  - Compatible with Chroma, Mister Focus, and DIYRE Colour hosts
