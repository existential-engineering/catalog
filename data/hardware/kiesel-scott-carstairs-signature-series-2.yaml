description: The Scott Carstairs SC27X combines the best features of the A2 and
  the Kyber. Using the rounded A2 shape, the body wields the same thickness as
  the Kyber, offering weight relief, comfort, and sleekness.
specs: |-
  - Scale length: 25.5"
  - Frets: 24 stainless steel jumbo, .110" wide x .055" tall
  - Body: swamp ash with blacked out ash treatment, 38.25" long, 0.82" thick, 12.6" wide
  - Top wood: burled maple
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods, thinner neck profile
  - Neck width: 1.90" at nut, 0.79" thick at 1st fret, 0.87" thick at 12th fret
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: 14" flamed maple
  - Headstock: non-painted pointed angled headstock
  - Bridge: Hipshot/Kiesel tremolo, .4125" (10.5mm) spacing
  - Neck pickup: Kiesel Empyrean neck pickup
  - Bridge pickup: Kiesel Thorium humbucker
  - Electronics: master volume control and 3-way pickup selector
  - Finish: black stain, clear gloss
  - Hardware: black
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: Scott Carstairs signature truss rod cover
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Strings: Elixir Nanoweb 1046E
  - Weight: 7.25 lbs
  - Offered as two packages, a white version and a black version, each of which automatically equips complementary specs based on colour, notably the headstock overlay, fingerboard wood and body wood treatment
