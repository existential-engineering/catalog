id: rd3SEoDR8DmptbFTEU5gA
name: SRM-700S
manufacturer: stax
primaryCategory: headphone-amp
categories:
  - amplifier
description: An all-stage FET configuration DC amplification driver unit
  featuring a custom-made low-noise dual FET at the first stage and J-FET at the
  second stage for excellent low-noise amplification and precise musical detail
  reproduction. Includes switchable RCA and XLR inputs, high-definition German
  WIMA film capacitors, and a large aluminum insulator with vibration-proof
  material.
specs: |-
  - Type: All-stage FET configuration DC amplification driver unit
  - Frequency response: DC – 100 kHz (with one SR-009S)
  - Gain: 60 dB
  - Harmonic distortion: 0.01% or less (1 kHz / 100 Vrms output)
  - Input impedance: 50 kΩ (RCA), 50 kΩ x 2 (XLR)
  - Maximum output voltage: 450 Vrms (1 kHz)
  - Bias voltage: PRO 580 V
  - Operating temperature: 0 to 35 °C
  - Operating humidity: less than 90% (non-condensing)
  - Input terminals: RCA x 1, XLR x 1
  - Output: RCA parallel output terminal
  - Power consumption: 46 W
  - Dimensions: 240 (W) x 103 (H) x 393 (D) mm (maximum protruding portion included)
  - Weight: 6.3 kg
