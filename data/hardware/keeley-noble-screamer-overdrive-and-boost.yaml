description: A 4-in-1 overdrive and boost with two familiar drive circuits and
  two amp-like hybrid tones, an all-analog signal path, and buffered or true
  bypass selectable on the fly.
details: |-
  The Noble Screamer is a 4-in-1 overdrive and boost that combines two familiar drive circuits with two amp-like distortion voices. The tone-control section and the clipping section are each switchable, so the four combinations can be mixed, and the circuits are entirely analog rather than modelled. The control set stays at three knobs.

  Two tone-control circuits are available. With the Tone switch in the OD position a broad spectrum control runs from a flat EQ to one with boosted treble and bass response. In the TS position the control becomes a low-pass filter that rolls off the high frequencies only.

  Both styles of diode clipping are provided. The Clipping switch in the OD position gives hard diode clipping for an edgier, more aggressive tone, while the TS position gives soft diode clipping closer to a softly overdriven tube amplifier.

  The pedal carries a buffer for noise-free switching, and holding the footswitch for two seconds moves between true bypass (the LED flashes twice) and buffered bypass (the LED flashes three times). It is designed, engineered and manufactured in Oklahoma City and is the first Keeley pedal in the maker's aluminium enclosure. It won Premier Guitar's Premier Gear Award.
specs: |-
  - Four overdrive and boost sounds, including two amp-like hybrid tones
  - Tone switch selects a broad spectrum tone control or a low-pass filter
  - Clipping switch selects hard or soft diode clipping
  - Silent buffered bypass or true bypass, changed by holding the footswitch for two seconds
  - All-analog signal path
  - Aluminium enclosure
  - Designed and manufactured in Oklahoma City, USA
