description: A discontinued digital delay pedal with up to 1000ms of delay time,
  tap tempo with subdivision control, two modulation settings, EQ for repeats,
  and switchable Vintage Tape or Digital Clean modes.
details: |-
  In 2007, we released our very first delay pedal, the Pink Panther. That pedal was instantly recognizable with its bright pink case and shiny silver knobs. Unfortunately, not every cat has nine lives, and we only produced about 100 units before the chip set was no longer available, forcing the pedal out of production. We decided to revisit this now beloved delay and rebuild it from the ground up. We now present a simple digital delay/echo that has everything you need and nothing you don't.

  The Lucky Cat delay has basic controls consisting of Time, Mix, Ratio, Repeats, Darken (EQ), and a Modulation toggle. Time is a manual control for the length of the repeats up to 1000ms. Mix controls the volume of the repeats, from fully clean signal to fully wet. Ratio controls the subdivision of the tap tempo with options of quarter note, dotted eighth note, eighth note, and triplets. Repeats controls the amount of repeats you will hear, from one repeat to infinite. The Darken control works as an EQ for the repeats only.

  On the left side of the Lucky Cat, you'll find a dip switch for Vintage Tape/Digital Clean tones. In Vintage Tape mode, you'll find a more compressed slightly driven echo like vintage tape delays. In Digital Clean mode the echo is crisp and clean. On the right side of the pedal, you'll also find an external tap jack so you can control the tempo of your delay with an external tap pedal.
