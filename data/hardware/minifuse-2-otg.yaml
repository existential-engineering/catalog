description: >
  Two devices. One mix. MiniFuse 2 OTG is the compact interface that lets your mobile device and computer run at the same time. Route audio between hosts, capture with transparent preamps, and go live in seconds. Dual-USB/OTG connectivity, Loopback, and a premium software bundle means zero friction and studio sound - anywhere.
details: |-
  The minifuse 2 otg is a compact dual-USB audio interface designed for creators, streamers, podcasters, musicians, and field recordists who need professional-quality recording and streaming capabilities on mobile devices and computers simultaneously. It features dual USB/otg connectivity that allows seamless routing between a phone/tablet and computer, enabling real-time audio mixing and zero-latency monitoring. The interface combines transparent preamps, smart connectivity, and a premium software bundle to deliver studio-quality sound anywhere.

  The minifuse 2 otg delivers exceptional audio quality with a 110db dynamic range and class-leading -129db equivalent input noise on microphone preamps, ensuring every recording captures rich dynamics and clear, noise-free signals. It includes two combo xlr/1/4" jack inputs with 48v phantom power for condenser microphones, instrument/line level switching, and backlit gain knobs with real-time overload indication. The interface provides two balanced trs line outputs for studio monitors and a stereo headphone output with independent volume control, plus a loopback function for capturing computer audio during streaming or recording.

  The minifuse 2 otg features a direct monitor system with USB source selector that allows blending between DAW, otg, or both for flexible zero-latency monitoring. It includes a USB-a hub (200ma max) for connecting MIDI controllers or USB devices without using a computer port, and operates as a bus-powered, class-compliant interface via USB-c. The minifuse control center app provides centralized monitoring of inputs, outputs, settings, and firmware updates across windows 10+, os x 10.13+, and mobile devices running ios 15+ or android 10+.

  The minifuse 2 otg comes with an extensive software bundle including analog lab intro with 500 vintage and modern keyboard presets, arturia fx suite (rev plate-140 reverb, pre 1973 preamp, delay tape-201 echo, chorus jun-6), ableton live lite, steinberg cubase le, cubasis for ipad/iphone, izotope vea ai voice enhancement, hindenburg pro (1-year subscription), auto-tune unlimited (3-month subscription), and splice creator plan (3-month subscription). The interface is engineered with robust materials and undergoes over 200 reliability tests before approval, backed by a 5-year hardware warranty.

  The minifuse 2 otg is designed for portability with a rugged aluminium casing that handles mobile producer lifestyles, weighing just 0.44 kg. It supports sample rates from 44.1khz to 192khz on computer connections and 44.1khz to 48khz on otg connections, with frequency response of 20hz to 20khz. The interface includes USB-a to USB-c and USB-c to USB-c cables in the box, and is compatible with thunderbolt via third-party adapter for expanded connectivity options.
specs: |-
  - Dual USB connectivity (otg & main USB)
  - 2x combo mic/inst/line xlr inputs with 48v phantom power
  - Instrument/line level switch
  - 2x 1/4 trs balanced line outputs
  - Stereo headphone output with independent volume control
  - USB-a hub (200ma max) for MIDI controller or USB device
  - Direct monitor & USB source selector
  - Loopback function
  - Backlit gain knobs with overload indication
  - Bus-powered USB-c interface
  - Class-compliant mac/pc compatibility
  - 110db dynamic range
  - -129db equivalent input noise (microphone preamps)
  - Supported sample rates: 44.1khz, 48khz, 88.2khz, 96khz, 176.4khz, 192khz
  - Otg sample rates: 44.1khz, 48khz
  - Frequency response 20hz to 20khz
  - Rugged aluminium casing
  - Compact and lightweight design
  - Minifuse control center app for monitoring and firmware updates
  - Class-compliant compatibility with pc, mac, tablets, and mobile devices
  - Thunderbolt compatible via 3rd party adapter
  - Windows 10 or later (64-bit) with 4gb ram minimum
  - Os x 10.13 or later (64-bit) with 4gb ram minimum
  - Minimum ios version 15
  - Minimum android version 10
  - Size: 43 x 200 x 100 mm (1.69 x 7.87 x 3.94 in)
  - Weight: 0.44 kg (0.97 lb)
