description: Experience the unrivalled power and tone of the 100W JVM210 Combo. A 2x12 valve combo built the traditional way in Marshall's UK factory, the JVM210C features two independent channels — Clean/Crunch and Overdrive — each with three switchable gain modes (green, orange, red) for a total of six distinct sounds. Two footswitchable master volumes, dual effects loops (one programmable series/parallel, one series power-amp insert), digital reverb per channel and a 4x12-emulated balanced XLR line out make it equally at home on stage and in silent-recording setups. Loaded with one Celestion Heritage G12H and one Celestion Vintage speaker, the JVM210C delivers everything from sparkling cleans to fully saturated heavy metal tones.
details: |-
  Switch through six modes across two channels and explore classic clean, searing distortion and more.

  With one Celestion Heritage speaker and one Celestion Vintage speaker, this amp has everything you need in one package with a warm, powerful sound.

  When it comes to creating your own sound, the JVM210 Combo doesn't mess about. Featuring two channels and three gain settings each, this amp provides countless options for customising your tone and unleashing a wide range of sounds. In addition to the three-way EQ on each channel, the Presence and Resonance knobs allow you to fine-tune the power amp's tone to your liking.

  Two effects loops, one parallel and one series, allow you to connect a variety of effects pedals and other external equipment. The two effects loops offer enhanced versatility and command over your effects chain, enabling you to tailor your tone with precision and explore diverse configurations.

  The JVM210 Combo offers recording capabilities and a standby function for silent recording. All you have to do to capture the perfect take is connect your amp to a recording device via the line out and keep the standby switch in off mode.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Built in our UK factory
  - All-valve
  - 12" Celestion Heritage and Vintage speakers
  - Save your settings
  - Multiple channels with dedicated volume controls
  - Built-in reverb options
  - Model: JVM210C
  - Range: JVM
  - Channels: 2 (Multi)
  - Technology: Valve
  - Output wattage: 100W
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Speaker configuration: 2x12"
  - Speaker model: 1 x Celestion Heritage G12H (8Ω, 80w), 1 x Celestion Vintage (8Ω, 70w)
  - Unit impedance: 16Ω
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitters)
  - Power amp valves: 4 x EL34
  - Weight: 34.5 kg / 76 lb
  - Width: 690 mm / 27.2"
  - Height: 510 mm / 20.1"
  - Depth: 265 mm / 10.4"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-91006 footswitch included, detachable power cable included
