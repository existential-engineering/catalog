description: Experience the unrivalled power and tone of the 100W JVM210 Combo.
  A 2x12 valve combo built the traditional way in Marshall's UK factory, the
  JVM210C features two independent channels — Clean/Crunch and Overdrive — each
  with three switchable gain modes (green, orange, red) for a total of six
  distinct sounds. Two footswitchable master volumes, dual effects loops (one
  programmable series/parallel, one series power-amp insert), digital reverb per
  channel and a 4x12-emulated balanced XLR line out make it equally at home on
  stage and in silent-recording setups. Loaded with one Celestion Heritage G12H
  and one Celestion Vintage speaker, the JVM210C delivers everything from
  sparkling cleans to fully saturated heavy metal tones.
details: |-
  JVM210C

  JVM

  Valve

  Combo

  2 (Clean/Crunch and Overdrive), each with 3 gain modes

  Made in UK

  Detachable mains (power) lead, 4-way programmable footswitch
specs: |-
  - Output Wattage: 100W
  - Channels: 2 (Clean/Crunch and Overdrive)
  - Gain Modes: 3 per channel (green / orange / red) = 6 total sounds
  - Controls: Channel-switch buttons (Clean/Crunch, Overdrive), per-channel Gain, Volume, Treble, Middle, Bass and Reverb level; global Master 1, Master 2, Master switch, Resonance, Presence; Power switch, Standby switch, FX Loop switch, Footswitch/MIDI program switch
  - Equalisation: Treble, middle, bass, presence and resonance
  - Effects: Digital reverb (per channel level)
  - Effects Loop: 2 — one programmable series/parallel FX loop (with FX Level +4dBu/-10dBV and Mix control), one series power-amp insert loop
  - Footswitch: Yes, supplied — 4-way programmable footswitch with switch-store and pre-set store modes (5 status LEDs)
  - Midi: Yes — MIDI In (5-pin DIN) and MIDI Thru (5-pin DIN); footswitch/MIDI program switch on front panel
  - Preamp Valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 4 x EL34
  - Speaker Config: 2 x 12"
  - Speaker Model: 1 x Celestion Heritage G12H (8Ω, 80W) + 1 x Celestion Vintage (8Ω, 70W)
  - Speaker Outputs: 5 x 1/4" jack speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Line Out: Emulated line out (XLR, balanced) — 4x12 speaker cabinet emulated, taken pre-master volume; usable in silent recording mode without a speaker load
  - Width: 690 mm
  - Height: 510 mm
  - Depth: 265 mm
  - Weight: 34.5 kg
