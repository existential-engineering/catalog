details: |-
  The ADX24 ia professional miniature gooseneck condenser microphones designed for applications such as podium, presentation, meetings, and teleconferencing.

  With a uniformly controlled cardioid polar pattern, the ADX24 help isolate the speaker from ambient noise. The ADX series is available in a hypercardioid polar pattern for tighter pick-up control.

  The ADX24 is designed with integrated preamp circuitry built into the base of the XLR. They can be mounted permanently via the supplied flange mount or with an optional base with an internal shock mount (see model ATS10, ATS1, ATS1L). The microphone may also be used on a standard microphone stand using the DCLIP snap to fit the microphone holder.

  Designed, manufactured, assembled, and tested by AUDIX in the USA.
specs: |-
