url: https://robertkeeley.com/product/beach-boys-i-get-around-rotary-simulator/
description: Stereo rotary speaker simulator with two speeds, a brake, an
  adjustable ramp and a tube-style drive.
details: |-
  The I Get Around Rotary Simulator recreates the swirling texture and warmth of a rotary speaker cabinet, an effect that was part of the sounds The Beach Boys used, in a pedal rather than a cabinet.

  It combines a rich, chorus-like rotary voice with a tube-like overdrive. Blend sets the mix between dry and wet signal, from a subtle warble to a heavily modulated sound. Drive adds gritty overdrive, and a Mids Boost pushes the midrange for a cutting lead sound.

  The rotary motion is controlled by a Dual Speed switch between two rotation rates, a Brake that slows the rotation to a stop, an adjustable Ramp that sets how quickly the speed changes between slow and fast, and a large Speed knob for the rotation rate itself. An optional pulsing LED reacts to the rotary effect.

  The pedal has stereo inputs and outputs, and bypass can be set to either true or buffered for use in longer chains.
