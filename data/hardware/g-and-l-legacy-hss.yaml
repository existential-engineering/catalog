details: |-
  The G&L Legacy HSS fattens things up with a G&L AW4370B Alnico bridge humbucker to complement the vintage alnico G&L CLF-100 single coils in the neck and middle positions. Masterminded by G&L VP Engineering Paul Gagon, the Legacy HSS has that ideal balance that lets it play well in a variety of settings, and its splittable bridge humbucker does a convincing job as a single coil with rich, ringing harmonics.

  The Legacy HSS brings all of the Legacy features, starting with Leo's PTB (Passive Treble and Bass) system which functions on all three pickups for dramatically more variety than the vintage setup, while the treble pot has a push/pull coil-split for the bridge humbucker. What's more, the Legacy HSS features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  For players after extra power without losing the classic voice, the Legacy HSS is worth a look.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L AW4368 Alnico bridge humbucker, G&L CLF-100 Alnico V single-coils
  - Body wood: Poplar and Swamp Ash top on Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), push/pull switch on treble pot to split bridge humbucker
  - Available in: 3-Tone Sunburst over Swamp Ash top on Poplar, tortoise pickguard, Maple fingerboard
  - Available in: Lake Placid Blue over Poplar, pearloid pickguard, Rosewood fingerboard
