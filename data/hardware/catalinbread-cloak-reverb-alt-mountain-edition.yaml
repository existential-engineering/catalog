description: The Cloak began after unearthing some ancient texts containing some
  forbidden incantations on how to introduce spectral elements within a decaying
  echo.
details: |-
  The Cloak began after unearthing some ancient texts containing some forbidden incantations on how to introduce spectral elements within a decaying echo. That part is an embellishment; the actual inspiration came from the land of academia and the acoustics department at Stanford, where a treatise on the optimal shimmer effect was penned a handful of years back. Catalinbread drew on a combination of that research and its own experiments to craft this take on shimmer reverb. At its core, the Cloak is a “room” style reverb that sounds amazing on its own, but with a twist of the Shimmer knob, rich, harmonically-laden overtones creep in, emphasizing three different orders of harmonics within the trails. A specially-designed low-pass filter steps in and smooths the harmonics out before they get too out of hand and wreck up the signal path. The size of the room can be effortlessly dialed in, from a cramped broom closet to as close to infinity as the circuit can muster. This comes in handy when deciding on which type of switching you prefer; the Cloak offers up true bypass switching that cuts off the reverb trails when the Cloak is disengaged, or buffered bypass, which keeps the decay going even after switching off—your pick. Either way you slice it, the Cloak is ready to impart a little black magic unto your rig.
specs: |-
  - Power source: standard DC center-negative pedal supply, 9 to 18 volts, at least 100mA
  - Current draw: ~60mA
  - Does not run on batteries
  - Controls: Room Size, Mix, High Cut, Shimmer
  - Reverb time: shortest 250ms, longest greater than 3 seconds
  - High Cut filter: cutoff at 5kHz, knob sets how much reduction above 5kHz
  - Ships in trails (buffered) mode; an internal option under the back panel switches it to true bypass
