description: A 2hp precision buffered multiple using high-precision op-amps and
  resistors for accurate signal multiplication of audio and CV.
details: |-
  What comes to mind when you think of precision? A surgeon with a scalpel? A watchmaker? I've got a better idea: this buffered multiple. This is not an ordinary buffered multiple, of course - this is Clone Mult . You think your buffered multiple is precise ? Think again. Your buffered multiple will try to repeat a signal, yes, but it is not particularly concerned with how close it gets. It will get close enough, it will sound good enough, right up until you notice something is out of tune. Right up until something suddenly stops working they way you intended. I know what it looks like. You're furiously pulling patch cables, patching again from scratch, trying to find the source of the two cent detune in your patch. Where is it? Where could it be? It's where you least expected it to be: in your non-precise buffered multiple. Listen, I hate to demolish your illusion like this, but your buffered multiple is just not that precise, like mine. Mine is super-duper precise. We're talking op-amps I would trust a surgical robot to do open heart surgery on my most beloved pet with. We're talking 0.05% precision resistors. What you put in, is what you will get back out, but like, multiplied. It's also useful for everything else you would use a buffered multiple for: things like buffering a signal in your signal chain, multiplying signals that are very sensitive to voltage changes and yes, it does both audio and DC. Not convinced you should pull all your old buffered mults out of your cabinet immediately , sell them and get this instead? Then your time will come, the day will arrive where you, too, shall fall victim to something being ever so slightly detuned in a way that's almost a little hard to articulate but is definitely perceptible nonetheless, and you will think of me, then. Or, like, just get one of these, for when you really need it.
specs: |-
  - Two channels of precision buffered multiples
  - Internal normalization allows 1:6 or 2:3 mults
  - High grade, precision component selection and all-analog architecture
  - More power to you: energy efficient design draws just 2-3mA per rail
  - Low-profile, skiff friendly depth
