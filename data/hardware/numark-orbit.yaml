description: "Wireless DJ controller with motion control: a handheld 2.4 GHz
  MIDI controller with 16 backlit pads, accelerometer, and illuminated jog wheel
  for fully customizable performance control of music, effects, and lighting."
details: |-
  Orbit is a compact, handheld MIDI controller designed for live DJ performance and wireless control. It uses 2.4 GHz ultra-low-latency wireless to manipulate effects, samples, hot cues, software, and lighting, and is 100% MIDI-customizable for music, software, videos, effects, and lighting.

  The surface offers 16 backlit customizable pads across 4 selectable banks (64 assignable buttons total), an illuminated aluminum-faced control wheel, and two shoulder trigger controls. An internal 2-axis accelerometer enables motion-based parameter assignment, and an included MIDI editor configures 84 performance controls.

  Orbit supports multiple wearing options (handheld, belt/body strap, or neck attachment) and runs on a rechargeable lithium-ion battery rated for 8 hours of continuous use and up to 24 hours of standby. Wireless range is up to 100 feet via the included USB receiver dongle; a wired USB connection is also supported.
