description: A two-in-one surf-flavored pedal pairing dripping spring reverb
  with smooth bias-modulating harmonic vibrato, usable individually or together.
details: |-
  The DeluxePlus Plus is a surf-flavored, two-effects-in-one pedal that pairs
  dripping spring reverb with smooth, bias-modulating harmonic vibrato. Each effect
  can be used on its own, or the two can run in tandem for a double-whammy of splash
  and motion.

  It offers a very high input headroom of up to 3V peak-to-peak and an easy-to-use,
  versatile control interface, and it is daisy-chain friendly.

  The pedal is currently available. Power comes from industry-standard 9VDC 2.1mm
  negative-center-pin pedal power or an optional internal 9V battery (not included).
specs: |-
  - Spring reverb and harmonic vibrato in one pedal (usable individually or together)
  - Very high input headroom (up to 3V peak-to-peak)
  - Daisy-chain friendly
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - True-bypass
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (not included)
  - <60mA current draw (>=100mA recommended)
  - Compact footprint (2.4" x 4.5" x 1.8")
