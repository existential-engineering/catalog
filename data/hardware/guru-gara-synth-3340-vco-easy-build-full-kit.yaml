details: |-
  The 3340 VCO Eurorack Complete Kit is an easy-build DIY voltage controlled oscillator based on the classic AS3340/CEM3340 design, created for Eurorack format systems. This complete kit includes the PCB, front panel, and all required electronic components, making it an ideal choice for builders who want everything included in one package while saving time on sourcing parts from multiple suppliers. To streamline the build process and ensure consistent performance, all essential SMD components are professionally assembled at the factory. The builder completes the module by installing the through-hole (THT) components, offering a satisfying DIY experience without the complexity of SMD soldering. This approach significantly reduces build time and lowers the risk of assembly errors, making it a reliable and time-saving option for both new and experienced DIY builders. Key Features

  Included Components

  Modulation & Sound Design

  The 3340 VCO provides a broad sonic range, from aggressive, harmonically rich textures to smooth and stable waveforms. With linear FM, multiple sync options, PWM control, and precise pitch tracking, it excels in both traditional analog synthesis and complex modular sound design. DIY Build & Assembly

  The PCB is clearly labeled to assist with assembly and calibration, and the pre-assembled SMD components significantly reduce build time and difficulty. All remaining components are through-hole and straightforward to install. Need help with tuning and setup? Read the 3340 VCO Calibration Guide for step-by-step calibration instructions and tracking tips. The front panel is made from high-quality PCB material with a black solder mask, factory-printed white markings, and gold-plated exposed copper, delivering a durable, modern, and professional appearance without screen printing. Technical Specifications

  This full kit offers a complete, high-quality build experience and delivers the classic sound and flexibility of a 3340-based Eurorack VCO with a refined, modern aesthetic. Skiff Friendly Module

  Videos
specs: |-
  - Complete Eurorack VCO full kit (PCB, front panel, and all components included)
  - Factory-assembled SMD components
  - Square, Triangle, Ramp, and Sine waveform outputs
  - Hard Sync and Soft Sync inputs
  - Linear FM input with accurate 1V/octave tracking
  - External CV control for pulse width modulation (PWM) (0 to +5V)
  - 10HP Eurorack format
  - Eurorack PCB with pre-assembled SMD components
  - PCB front panel (black PCB with factory-printed white graphics and gold-plated exposed copper)
  - Jack sockets
  - Potentiometers
  - Control knob
  - IDC power socket
  - Trimmers
  - Timing capacitor
  - AS3340 IC
  - IC socket
  - Eurorack power cable
  - Mounting screws
  - Width: 10HP
  - Current Draw: +12V: 15mA, −12V: 15mA
  - Depth: 25mm
