description: >-
  The Ensoniq SQ-80 is an enhanced version of the ESQ-1, combining 75 digital waveforms
  with analog four-pole lowpass filters, a floppy disk drive for patch storage, and an
  8-track multitimbral sequencer in a 61-key keyboard with polyphonic aftertouch.
details: |-
  The SQ-80 built upon the ESQ-1's architecture by expanding the waveform set to 75, adding a floppy disk drive, and improving the sequencer. Each voice combines up to three of these waveforms, which include multi-sampled transient attack waves such as violin bow, plectrum picks, mallet strikes, hammer, and breath attacks, plus five sampled drum sets.

  The hybrid analog-digital architecture pairs digital oscillators with true four-pole analog lowpass filters featuring sweepable resonance, one per voice. Each oscillator gets its own digital amplifier, with an additional global amp per voice. Up to three LFOs per voice can be routed to pitch, amplitude, filter, and panning parameters.

  The 61-key keyboard features polyphonic aftertouch and supports split and layered configurations. The pattern-based 8-track sequencer holds up to 20,000 notes across 60 patterns and 20 songs, making it capable of both quick sketch ideas and more elaborate compositions. Tracks can be bounced for consolidation.

  The SQ-80 excels at organ sounds, analog-style pads, and textural sound effects. Its combination of digital waveform flexibility with analog filter warmth has kept it relevant among vintage synthesizer enthusiasts. It was notably used by filmmaker and composer John Carpenter.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 24 total (3 per voice), 75 waveforms including transient attacks and drum sets
  - LFO: Up to 3 per voice, routable to pitch, amp, filter, pan
  - Filter: 1 four-pole analog lowpass per voice with sweepable resonance
  - VCA: 1 digital amp per oscillator + 1 global amp per voice
  - Sequencer: 8-track, 60 patterns, 20 songs, 20,000-note capacity
  - Keyboard: 61 keys with velocity and polyphonic aftertouch
  - Memory: 40 patches onboard + 80 with EEPROM cartridge, floppy disk drive
  - Control: MIDI (8-part multitimbral)
releaseDate: "1988"
