description: The DN540 packs four channels of creative compression into a single
  rack unit, with Presence Accenting and Dynamic EQ setting it apart from
  utility compressors. The Presence control dynamically accentuates a broad band
  centred around 5 kHz to restore high-mid energy that gain reduction often
  dulls, while the Dynamic EQ adds programme-dependent air to vocals without the
  noise floor or pumping of a static high-shelf boost.
details: |-
  Each channel offers rotary Threshold, Ratio, Attack and Release controls. A latching AUTO switch selects RMS-sensing auto mode in place of the default peak-sensing manual mode, with auto-attack and auto-release timing optimised for transparent compression on programme material, and soft- and hard-knee responses are switchable per channel.

  Flexible channel linking allows multiple combinations of side-chain summing, preserving stereo and surround images where conventional fixed-pair links would not. Each channel has an external side-chain input on balanced 1/4" TRS for frequency-conscious compression, and a 6-segment gain-reduction and signal-metering LED bargraph tracks each channel.

  Applications named on the page are live FOH on vocals, brass and acoustic sources where presence decides mix translation, touring monitor work where the Dynamic EQ keeps wedges intelligible without the ear fatigue of static EQ, and broadcast, corporate and theatre use.
specs: |-
  - Four-channel compressor with Presence and Dynamic EQ
  - Presence control accentuates a broad band centred around 5 kHz
  - Manual peak-sensing or AUTO RMS-sensing compression
  - Switchable soft- and hard-knee response with programme-dependent timing
  - Rotary Threshold, Ratio, Attack and Release per channel
  - Flexible channel linking for stereo and surround groups
  - External side-chain input on balanced 1/4" TRS per channel
  - 6-segment gain-reduction and signal LED metering per channel
  - Balanced XLR input and output
  - 1U rackmount
