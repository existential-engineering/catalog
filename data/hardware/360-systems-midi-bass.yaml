description: >-
  The 360 Systems MIDI Bass is a dedicated bass sound module released in 1986,
  featuring EPROM-based playback of authentic acoustic and electric bass tones
  with MIDI control, touch sensitivity, and pitch bend response.
details: |-
  360 Systems marketed the MIDI Bass with the slogan "Real Bass In A Box" because it featured authentic rather than synthesized bass sounds. The device could produce exact acoustic and electric bass tones, offering popular bass sounds of that era including slapped and popped funk bass, flat picked roundwound jazz bass, stand-up acoustic bass, and bowed bass.

  The instrument was touch-sensitive, responded to pitch bends, and reacted to MIDI patch changes, making it responsive to performer input. This responsiveness positioned it as a natural complement to digital drum machines and MIDI sequencer/synthesizer systems.

  The front panel featured a simple, straightforward layout. The MIDI Channel selector switch allowed users to choose specific channels or set it to ALL position to receive all incoming MIDI data. The key priority switch offered three modes: Last Key (most common for performance and sequencer work), Low Key (extracting the lowest note from a chord), and High Key (selecting the highest note). Users could also set upper and lower range limits.

  The lower panel contained a Volume knob, Pitch knob, and five buttons — four for selecting different EPROM sounds (with position one as default) and indicator LEDs showing available memory chips. The device came in both 2- and 4-sound configurations and could accommodate up to four different EPROMs simultaneously.
specs: |-
  - Polyphony: 1 voice
  - Audio bandwidth: 16 Hz to 16,000 Hz
  - Sound storage: EPROMs (up to four simultaneously)
  - Available configurations: 2-sound and 4-sound models
  - Controls: Volume knob, Pitch knob, MIDI Channel selector, Key priority switch, four sound selection buttons
  - Features: Touch-sensitive, pitch bend response, MIDI patch change response, range limit control
