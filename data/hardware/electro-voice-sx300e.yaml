name: Sx300E
manufacturer: electro-voice
primaryCategory: speaker
categories:
  - monitor
url: https://products.electrovoice.com/na/en/sx300e/
description: 12-inch two-way passive loudspeaker designed for compact, portable
  sound reinforcement, delivering 300 W continuous / 1200 W peak through a
  cast-frame DL12BFH woofer and a DH3/2010A titanium HF compression driver on a
  65 x 65 degree Varipath constant-directivity horn with Ring-Mode Decoupling
  (RMD).
details: >-
  The Sx300E is the export version of Electro-Voice's classic Sx300 portable
  loudspeaker, a 12-inch two-way passive cabinet aimed at compact sound
  reinforcement, stage monitoring, and use in small to medium arrays. It pairs a
  cast-frame DL12BFH 12-inch low-frequency transducer with a DH3/2010A 1.25-inch
  titanium HF compression driver, crossed over at 1.5 kHz behind a 65 degree by
  65 degree Varipath constant-directivity horn. EV's Ring-Mode Decoupling (RMD)
  is applied throughout the design to suppress resonant artefacts and improve
  vocal intelligibility.


  The copolymer composite (polypropylene) enclosure is available in black or
  white and includes integral handles, rubber feet with stacking sockets, and a
  pole-mount socket for use on a speaker stand or sub-pole. The cabinet is
  flying-capable for permanent installation but is not weatherized.


  As a passive loudspeaker the Sx300E requires external amplification. Signal is
  connected via two Neutrik Speakon high-current connectors on the rear panel,
  wired in parallel so one jack acts as the input and the second as a
  loop-through to a second cabinet.
specs: >-
  - Configuration: 2-way passive loudspeaker

  - LF driver: Cast-frame DL12BFH 12-inch low-frequency transducer

  - HF driver: DH3/2010A 1.25-inch titanium HF compression driver

  - Horn: 65 degree x 65 degree Varipath constant-directivity horn

  - Crossover frequency: 1.5 kHz

  - Frequency range (-10 dB): 50 Hz - 20 kHz

  - Axial sensitivity (1 W / 1 m): 99 dB SPL

  - Maximum SPL (calculated, 1 m): 131 dB peak / 123 dB program

  - Power handling: 300 W continuous / 1200 W peak

  - Nominal impedance: 8 ohms (5 ohms minimum)

  - Coverage pattern (-6 dB): 65 degrees H x 65 degrees V

  - Directivity index: 11.1

  - Connectors: Dual Neutrik Speakon high-current (input + parallel)

  - Enclosure: Copolymer composite (polypropylene), black or white

  - Features: Ring-Mode Decoupling (RMD), integral handles, rubber feet with
  stacking sockets, pole-mount, flying-capable, non-weatherized

  - Dimensions (H x W x D): 586 x 429 x 312 mm

  - Net weight: 17.7 kg
