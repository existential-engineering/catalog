  a complex oscillator with three synthesis modes, a voltage-controllable LFO,
  and a stepped waveform generator with 8 random or looping step patterns.
details: |-
  The Kastle Synth is the original Kastle (v1.0–1.4), a pocket-sized lo-fi mini modular synthesizer running on two ATtiny85 chips reprogrammable via Arduino. It features a complex oscillator with three synthesis modes: phase distortion, phase modulation/FM, and track & hold.

  A voltage-controllable LFO provides triangle and square wave outputs with a reset input. A stepped waveform generator offers 8 random or looping step patterns for melodic sequencing and modulation.

  The device features two dual-purpose CV I/O patch ports that can function as either inputs or outputs depending on patch routing. Audio output is via a headphone connector. Powered by 3x AA batteries or Micro USB. Open-source hardware with schematics and firmware on GitHub.

  Dimensions: 70 × 60 × 50 mm. Includes 10 patch cables and user manual.
