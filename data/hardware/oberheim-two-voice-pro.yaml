description: >-
  The Oberheim Two Voice Pro is a modern reissue of the classic 1975-1979 analog duophonic
  synthesizer, featuring two independently programmable voices with four VCOs and 56
  mini-jack patch points. It retains the sonic character of the original while adding
  velocity-sensitive and aftertouch-capable keys, an enhanced mini-sequencer, and MIDI
  connectivity.
details: |-
  The original Oberheim Two Voice was produced from 1975 to 1979 and became a sought-after instrument used by artists including Vangelis and Vince Clarke. Despite its cult following, the original remained relatively scarce even during its production run. When Tom Oberheim returned to synthesizer manufacturing in 2009, anticipation grew for a reissue.

    Announced in 2012 and finally released in 2015, the Two Voice Pro is not a direct copy but a thoughtful redesign that maintains the sonic qualities of its predecessor while introducing substantial enhancements. The original's road case has been replaced with a lighter, more compact design featuring an integrated power supply. The 37-key keyboard now includes velocity sensitivity and aftertouch, a significant upgrade over the original.

    A key feature is the control section adjacent to the keyboard called "The Bendbox," which houses modulation and pitch-bend wheels, an independent vibrato LFO, a headphone jack, Fine Tune control, and VCO2 Detune knob. The instrument includes 56 mini-jack patch points for semi-modular sound design, along with standard 1/4-inch audio inputs and MIDI In/Out/Thru connectivity.

    The standout addition is the enhanced Mini-Sequencer, which allows programming of 16 steps per voice with storage for 50 sequences that can be chained into complete songs using 9 memory slots. The Two Voice Pro delivers authentic analog sounds with the warmth and character of the original hardware, prioritizing quality and thoughtful design over feature abundance.
specs: |-
  - 2-voice polyphony, 2-part multitimbral
    - 4 VCOs (Voltage Controlled Oscillators)
    - Waveforms: Pulse, Sawtooth, Square
    - 12dB/octave (2-pole) low-pass filter
    - 2 LFOs
    - 4 envelope generators
    - 37-key keyboard with velocity sensitivity and aftertouch
    - 56 mini-jack patch points for semi-modular patching
    - Enhanced mini-sequencer: 16 steps per voice
    - 50 sequence memory slots, 9 song memory slots
    - MIDI In/Out/Thru
    - 1/4-inch audio inputs
    - Headphone output
    - Integrated power supply
