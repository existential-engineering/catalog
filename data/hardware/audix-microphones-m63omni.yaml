details: |-
  The M63 is a condenser boundary microphone featuring programmable functionality including a local toggle on/off, momentary talk and mute switching, and LED status (red/green) indicators. Optimized for speech, the M63 employs the Micros series technology for superior audio quality and performance. The M63 is also the industry's only programmable boundary microphone with a patented internal shock-mount suspension system to reduce noise caused by touch and surface vibrations.

  The M63 uses an internal microprocessor programmed to provide common DSP functions at a fraction of the cost of a typical DSP solution. Only the microphone connection (A+, A- and ground) is required for full functionality when set to internal logic. Phantom power is required (No other power supply is needed). For installations not requiring elaborate DSP programming, the M63 provides an easy-to-operate solution without the cost and labor required for DSP operation.

  Available variations:
  M63 – Low profile condenser boundary microphone with programmable toggle on/off.
  M63B – As above, except cable exits the bottom of the unit (cable passes through the mounting surface).
  M63OMNI – Omnidirectional polar pattern; cable exits the rear of the unit.
  M63OMNIB – As above, except cable exits the bottom of the unit.
