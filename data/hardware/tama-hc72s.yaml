description: The heavy weight of the stand pressing on your shoulder as you
  carry your gear. The frustration when adjustments don't go the way you want.
details: |-
  Lightweight Aluminum Pipe: In pursuit of the ultimate lightweight design, this new series from TAMA was developed entirely from the ground up, with all parts and mechanisms reimagined from scratch. Using lightweight aluminum extensively throughout, each component has been carefully designed to minimize size. At the same time, achieving a high level of stability alongside a reduced weight is the core concept behind the Spartan stand. To ensure this, critical adjustment points that tend to experience wear and tear—such as the boom tilter, bolts, and T-nut threads—are made from high-strength, durable materials like zinc die-cast and steel.

  Flatter Pipe: The stand legs combine aluminum construction with a hollow pipe-shaped design, delivering not only exceptional lightness but reliable strength.

  Anti-Walk Rubber Feet: To prevent cymbal stand “walking” while playing, TAMA has developed an all-new rubber tip. Even when the stand lifts slightly off the floor while playing, a piece at the center of the rubber foot remains in contact with the floor, effectively minimizing unwanted movement during performance. This innovative feature delivers a level of stability that's almost unbelievable given the stand’s lightweight design— yet another practical and original solution from TAMA.

  Glide-Tite Grip Joint (US.PAT.NO.9631656): Our Glide-Tite Grip Joint allows for a more secure attachment by using a metal-to-metal contact point. This provides an extremely solid anchor and complete isolation for a tom or cymbal. Because the stand does not move with the instrument, the natural resonance of that instrument is maximized.

  Quick-Set Tilter (US.PAT.NO.7385127): TAMA's patented toothless Quick-Set Tilter marks another TAMA advancement in hardware. Relying on basic principles of physics, the Quick-Set Tilter holds its position using the friction of six smooth metal disc plates instead of traditional toothed gears, so you can adjust it to any desired angle. This mechanism also has a more durable structure than a conventional gear tilter.

  Quick-Set Cymbal Mate (US. PAT.No.7629526): By simply gripping and pressing the two buttons on the both sides, users can attach and remove the Cymbal Mate with just one touch, making cymbals setup/breakdown a snap. Like our standard Cymbal Mate: fine adjustments to the cymbal's swinging motion can be made by rotating the unit.
