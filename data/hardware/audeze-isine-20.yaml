description: In-ear planar magnetic headphones featuring Fluxor magnets and
  Uniforce voice-coil technology. One step up from the iSINE 10 with an even
  longer Uniforce voice coil that yields improved bass, clarity, and imaging.
details: |-
  The iSINE 20 is one step up from the iSINE 10, featuring an even longer Uniforce voice-coil that yields improved bass, clarity, and imaging. Zero distortion sound means you'll feel closer to your music. Add the CIPHER Lightning cable with built-in amplifier and DSP and there's no other in-ear headphone that even comes close to its performance.

  Our Fluxor magnets produce an incredible amount of driving force, rendering frequencies from 10Hz to 50kHz with guttural impact and pinpoint accuracy.

  Our Uniforce voice coil technology minimizes distortion even at high volumes, delivering unprecedented audio clarity.

  The iSINEs combine our flagship LCD planar technology and the best in industrial design to create a comfortable listening experience that sounds as real and spacious as a live performance.

  iSINE accessories, including the earfins, are still available separately. This is a legacy product and no longer available for sale.
specs: |-
  - Style: In-ear, semi open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 30 mm
  - Maximum power handling: 500mW RMS
  - Maximum SPL: >130dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 24 ohms
  - Sensitivity: 112 dB/1mW (at Drum Reference Point)
  - Minimum power requirement: >50mW
  - Weight: 20g/pair
  - Standard cable: 1.5m audio cable, 1/8" stereo plug to 2-pin plug
  - Optional cable: 1.5m CIPHER Lightning cable with built-in amplifier and DSP
