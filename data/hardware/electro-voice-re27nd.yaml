description: Broadcast announcer's microphone with a neodymium dynamic capsule
  and Variable-D design. High-output voice production mic delivering open,
  crisp, detailed tonal reproduction for broadcast, podcasting, voiceover,
  recording studios, and live sound — equally at home on vocals and instruments
  including kick drum and bass cabinets.
details: >-
  The RE27N/D is Electro-Voice's flagship broadcast announcer's microphone,
  built around a neodymium dynamic element that delivers approximately 6 dB more
  sensitivity than comparable conventional dynamics — bringing its output and
  detail closer to that of a studio condenser without phantom power.


  Variable-D porting along the barrel minimizes proximity effect, so close-mic'd
  announcers, hosts, and vocalists keep a natural tonal balance instead of an
  exaggerated low end. The cardioid pattern stays consistent across the
  frequency range, which also reduces off-axis coloration when sources move
  around the mic.


  Three voice-shaping filter switches on the body let engineers tailor
  low-frequency rolloff and presence on the fly, useful for matching different
  voices, taming room rumble, or adapting the mic to instrument duty (kick drum,
  bass cabinets, guitar amps, brass). A humbucking coil rejects line hum from
  nearby video monitors and lighting, and integral wind and blast filters guard
  against pops and plosives without an external screen.


  The satin nickel steel body is 217 mm tall and 54 mm in maximum diameter,
  weighing 0.709 kg. Output is balanced low-impedance (150 ohms) on a 3-pin XLR
  connector at the base of the mic. The mic is passive — no phantom power
  required.
specs: >-
  - Element: Dynamic (neodymium)

  - Polar pattern: Cardioid

  - Frequency response (-3 dB): 45 Hz - 20,000 Hz

  - Impedance (low-Z balanced): 150 ohms

  - Open circuit voltage: 2.5 mV/Pa

  - Connector: 3-pin XLR

  - Mic type: Vocal / Instrument

  - Wired/wireless: Wired

  - Power requirement: Passive (no phantom required)

  - Height: 217 mm

  - Maximum diameter: 54 mm

  - Net weight: 0.709 kg

  - Case material: Steel

  - Finish: Satin Nickel

  - Features: Variable-D, three voice-shaping filter switches, humbucking coil,
  integral wind and blast filters
