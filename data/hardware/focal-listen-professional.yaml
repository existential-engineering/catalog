description: Listen Professional is a closed-back monitoring headphone particularly suited to quiet environments. It offers outstanding isolation which, combined with good tonal balance, facilitates equalization of tracks and registers.
details: |-
  Listen Professional is a closed-back monitoring headphone particularly suited to quiet environments. They offer outstanding isolation which, combined with good tonal balance, facilitates equalization of tracks and registers. Its unique transducer combines a Mylar/Titanium alloy and offers incomparable low-frequency articulation for closed studio headphones.

  Lively, dynamic sound: the sound is lively, akin to listening with semi-open-back headphones coupled with the isolation of closed-back headphones. Made in France, the loudspeakers are equipped with a Mylar/Titanium membrane, offering a solution that respects the dynamics of the original signal while accurately reproducing the details of the recording across the entire audio spectrum.

  Comfort and design: the design of the headband combines comfort, strength and torsion-resistant articulation. Its constant profile, whatever the size of the head, ensures even weight distribution, avoiding pronounced pressure points during long work sessions. The earcups' structured black coating offers excellent resistance to shocks and scratches, while the thermosensitive, high-resilience memory foam provides excellent coupling to different face shapes.

  Insulation: the earpad volume has been sized for very balanced acoustics, with two materials in studied proportions. The microfiber allows for linearization of the bass register and sound diffusion, while the acoustic fabric combines absorption and linearization capacities of the 3-9 kHz register.

  Mylar suspension: the driver suspension is made of 100% Mylar, while the central dome is made of a Mylar-Titanium alloy for greater rigidity and an ever-wider response in the high end of the spectrum. This keeps the moving assembly extremely light, allowing the transducer to exceed 22 kHz on a baffle plane.
specs: |-
  - Product type: closed-back headphones
  - Mylar/Titanium membrane drivers, made in France
  - Frequency response (+/- 3dB): 5 Hz - 23 kHz
  - Harmonic distortion rate: 0.3% @ 1 kHz / 100 dB SPL
  - Impedance: 32 Ohms
  - Sensitivity: 122dB SPL @ 1kHz / 1VRMS
  - Weight: 280 g / 0.61 lb
  - Carrying case included (212 x 111 x 239 mm)
  - Cables provided: 16.5 ft (5m) coiled asymmetric cable (1/8" - 3.5mm TRS jack), 4.5 ft (1.4m) straight asymmetric cable (1/8" - 3.5mm TRS jack)
