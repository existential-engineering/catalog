description: >-
  The E-mu Proteus 2500 is a 128-voice rack module expanding on the Proteus 2000 with over 30
  real-time knobs, a built-in 16-track MIDI sequencer, and 24-bit audio output.
details: |-
  Released in 2001, the Proteus 2500 took the proven Proteus 2000 platform and expanded it into a 4U rack unit packed with hands-on control. While the core sound engine and 32 MB Composer ROM sample set remain identical to the Proteus 2000, the 2500 added over 30 real-time programmable knobs and buttons for immediate sound shaping.

  The built-in 16-track MIDI sequencer supports 16 channels per track and offers linear, pattern-based, real-time, and step-time recording modes. This made the Proteus 2500 a self-contained production tool rather than just a passive sound module, capable of handling both sound generation and arrangement duties.

  Sound design benefits from E-mu's renowned Z-plane filter technology, providing 50 filter types across 6th- and 12th-order configurations. The 24-bit dual stereo effects processor offers 29 reverb algorithms, 15 delay types, 8 chorus variations, 7 flange options, and 5 distortion modes. Two LFOs per voice add further modulation depth.

  Audio quality received a significant upgrade over its predecessor with 24-bit DAC outputs replacing the earlier 16-bit converters. Six audio outputs plus S/PDIF digital output and USB connectivity round out the I/O. The sound set is expandable up to 128 MB via additional cards, and memory holds 1,024 patches split between 512 factory and 512 user slots across 32 multitimbral parts.
specs: |-
  - Polyphony: 128 voices
  - Sound ROM: 32 MB Composer set (expandable to 128 MB)
  - Multitimbral: 32 parts
  - Filters: 50 types of 6th- and 12th-order Z-plane filters
  - LFOs: 2 per voice
  - DAC: 24-bit (four converters)
  - Effects: 24-bit dual stereo processor (29 reverbs, 15 delays, 8 chorus, 7 flange, 5 distortion)
  - Sequencer: 16-track MIDI (linear, pattern, real-time, step-time)
  - Memory: 1,024 patches (512 factory, 512 user)
  - Outputs: 6 audio + S/PDIF digital
  - Connections: MIDI, USB
  - Format: 4U rackmount
