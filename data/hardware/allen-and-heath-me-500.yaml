details: |-
  16 Channel Personal Mixer. ME-500 is a walk-up-and-mix solution that is quick to set up and can be used instantly with no learning curve. With plug 'n' play setup and self-sufficient musicians, ME-500 is also a massive time-saver for the audio engineer.

  16 Inputs — control up to 16 stereo or mono inputs with level and pan controls for each input.

  Master 2-Band EQ and Limiter — protect your ears and craft the overall tone of your mix.

  Automatic Setup — plug in and start mixing; the first 16 channels/mixes sent from the host mixer are automatically mapped to ME-500's 16 select keys, so it is fast and simple to deploy personal mixers in pressured situations such as festivals.

  8 User Presets — levels, pan and mutes can all be stored and recalled at the touch of a button; presets can be saved to USB and easily transferred to different ME-500s.

  Powerful, Clear Sound — features 1/4" and 3.5mm mini-jack headphone outputs and will drive all popular headphone types and impedances, delivering enough power to hear the mix loud and clear through headphones or in-ears.

  Protect Your Ears — integrated limiter, adjustable from -24dB to 0dB, prevents unexpected loud signals from reaching headphones.

  Musician Friendly — intuitive hands-on controls and clear visual display make it easy for musicians to control their own monitor mixes. The uncluttered top panel makes control quick, easy and intuitive: press a key to select one of the 16 sources and turn the rotary control to adjust the volume or push and turn to adjust the pan. Dedicated Mute and Solo switches ensure fast, instinctive control of the mix.

  3rd Party Compatibility — non Allen & Heath users can benefit from the ME Personal Mixing System via the ME-U hub, with MADI and Dante option cards allowing a digital feed of up to 40 sources from third-party systems. ME-1 and ME-500 can be used as drop-in replacements for older AVIOM A-16ii units.

  Compatible with dLive, Avantis, SQ / SQ+ and Qu host mixers.

  Features list: 16 Mono / Stereo Inputs With Level and Pan Control; Master 2-Band EQ and Limiter; Automatic Key Assignment; 8 User Presets; 3.5mm and 1/4" Headphone Outputs; Solo and Mute Keys; Mains or PoE Powered; Daisy Chain or Use Standard PoE Ethernet Hubs; Mic Stand Bracket and Headphone Hanger Sold Separately.
