description: A high-gain distortion pedal with interactive Bass and Treble tone
  controls that can generate amp-like distortion tones from lightly overdriven
  blues sounds to heavy classic rock crunch. It also works well as a distortion
  pedal for bass guitar.
details: |-
  *Please note: Maxon has discontinued the AC210 AC Adapter. Due to this, the Maxon Vintage series pedals will no longer ship with power supply included. The Maxon Vintage Series Pedals can be run with a standard 9vdc Center Negative Adapter. We recommend the PA-9 Power-All ECO-Dapter. Despite its modest array of controls, the DS830 is one of the most flexible distortion boxes you will ever encounter. The DS830 can generate insane amounts of gain while still retaining remarkable evenness and transparency. Yet far from being a one-trick pony, the DS830 is also capable of lightly overdriven blues tones and even semi-clean solo boosts at lower Gain settings. Clarity and punch may seem like self-canceling traits, yet the DS830 provides both. The high-gain settings don't force a particular color on your tone - a great trait if you're pleased with your particular guitar/amp combination. The DS830's dual tone controls are surgically effective and highly interactive. The Bass knob contributes low-end muscle that makes a combo sound like a stack and turns a full stack into a wrecking ball. The Treble control dials in just the right amount of bite without excessive top-end sizzle. Between the two, you can get everything from penetrating bite to an obese square-wave bordering on fuzz. This additional tone-shaping makes the DS830 ideal for use with Bass Guitar, generating an edgy, aggressive tone that retains the note clarity and character of your instrument. For full-bodied distortion with an amp-like feel and a huge variety of useable tones, the DS830 Distortion Master is unrivaled in its sonic range. TECH TALK:

  The DS830's gain section features a dual-stage clipping design that combines the classic "808" clipping (diodes in feedback loop) with a pair of diodes to ground ala' the SD-9 and RAT. This design effectively clips the signal twice, and the round smooth clipping of the feedback loop followed by the edgier diodes to ground adds a degree of "chewiness" to the pedal's voice. The DS830 features a complex tone control which acts like an active two-band filter by changing the gain of the treble and bass frequencies going into the Op Amp. The Bass and Treble controls are highly interactive and complementary. For example; turning up the Bass doesn't just add low-end, but will also help to smooth out any harshness in the Treble frequencies. The DS830 features buffered, Mechanical bypass switching with a low impedance output, allowing it to drive long cable lengths or other effect units without loss of signal. Input Impedance : 500K Ohms

  Input Jack : 1/4 inch standard phone jack

  Output Impedance : 10K Ohms or less

  Output Jack : 1/4 inch standard phone jack

  Output : 1

  Equivalent Input Noise : -114 dB (VR Max)

  Residual Noise : -110 dB (Level, VR Min)

  Maximum Gain : +59 dB (VR Max) (At 1 KHz)

  Controls : Gain, Bass, Treble, Level

  Switch : Normal/Effect

  Power Supply : 9V Manganese dry cell battery (S-006P) or special AC adaptor

  Power Voltage : DC9 V (Battery) / DC10 V (AC-adaptor)

  Current Consumption : 8 mA (9 V)

  AC Adaptor : AC210N (option) Input: AC120V Output: DC9V/200 mA Center - / Sleeve +)

  Dimensions (whole) : 117 mm (W) x 150 mm (D) x 60 mm (H)

  Weight : 500 g

  Accessories : 9V Manganese dry cell battery (S-006P) x 1

