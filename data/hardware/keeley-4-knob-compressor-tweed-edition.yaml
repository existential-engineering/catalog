details: |-
  This is the classic C4 Compressor in a limited edition tweed finish. The top is printed in multiple glossy stages with raised lettering and edges for a realistic feel, and the run was limited to 30 pieces.

  The circuit is the standard Keeley Compressor, hand built in the USA. It took Guitar Player magazine's Editor's Pick award and a Reader's Choice award for stompbox, and Keeley describes it as an audiophile and studio-grade compressor with rack mount quality in a stompbox enclosure.

  The compressor carries an internal Attack control intended for bass players with high-output active pickups or active pedalboards with buffers. A later revision added an input sensitivity control, which allows the pedal to be used with keyboards, drum machines, drum mics, master recordings and other line-level sources.

  Switching is true bypass through a triple pole double throw switch, with an LED for effect indication. The circuit uses metal film resistors and capacitors, and transistors hand matched to better than 1% tolerance. It runs from a 9V battery or a standard 9V DC adapter at a 5mA current draw.
