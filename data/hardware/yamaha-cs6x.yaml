description: >-
  The Yamaha CS6x is a 61-key synthesizer combining AWM2 digital sampling with
  analog-style subtractive synthesis, designed for dance and electronic music
  production. It features 64-voice polyphony, 13 filter types, a built-in phrase
  sampler, and extensive real-time control via six assignable knobs and a ribbon
  controller. The CS6x is expandable with two slots for Yamaha Plug-In Expansion
  Boards.
details: |-
  The CS6x represents Yamaha's evolution of the CS synthesizer line, building on the company's legacy while incorporating modern production features. Released in 1999, it was marketed specifically for trance and electronic music production, combining the analog modeling heritage of the AN1x with sampling capabilities.

  The sound engine offers 64-voice polyphony driven by AWM2 (Advanced Wave Memory) synthesis with 16MB of waveform ROM containing 479 waveforms across four oscillators. Sound shaping includes 13 filter types with 2, 3, and 4-pole configurations offering 6dB, 12dB, and 24dB slopes in low-pass, high-pass, and band-pass modes. A bit-depth switch allows degradation to vintage lo-fi character.

  Performance features include a built-in arpeggiator with 128 patterns and filter patterns, plus a 4MB phrase sampler supporting up to 256 clips at 44.1kHz. Smart media storage provides convenient sample and patch management. Notable users include Faithless and Depeche Mode.

  The CS6x is expandable with two slots for Plug-In Expansion Boards, which add polyphony, sounds, effects, and additional capabilities. Effects processing includes 12 reverbs, 23 choruses, and 93 insertion effects.
specs: |-
  - 64-voice polyphony
  - 61-key keyboard with velocity and aftertouch
  - 4 oscillators with 16MB AWM2 ROM, 479 waveforms
  - 2 LFOs with saw, square, triangle, and sample & hold waveforms
  - 13 filter types including 2/3/4-pole configurations (6/12/24dB slopes)
  - 12 reverbs, 23 choruses, 93 insertion effects
  - 256 preset patches, 128 user patches, 128 performance banks
  - 4MB phrase sampler at 44.1kHz, up to 256 clips
  - MIDI with 20 parts
  - 6 assignable knobs, ribbon controller
  - 2 Plug-In Expansion Board slots
  - Built-in smart media storage (3.3V)
