details: |-
  The LITTLE LEHLE II is the universal Lehle switching and looping tool. It removes effect pedals from the signal path at the press of its button. A signal can be picked off at any point in the signal chain, to switch to an instrument tuner, for example.

  The LITTLE LEHLE II can also be used to switch between two instruments on one amp or, vice versa, between two amps with one instrument. Extremely diverse sound sources are possible, signals from pick-ups, microphones and keyboard line-out sockets are routed loss-free to the target amplifier or recorders, and all jack sockets are stereo.

  Switches with gold-plated contacts assure True Bypass. As on this unit's big brother, the LEHLE D.LOOP SGOS, not only the stereo signal, but also the signal ground, is switched, so it is goodbye to hum when switching between two amps, and selecting effect loops.

  The easy-action mushroom-shaped button characteristic of Lehle products is mounted in the cover, so that your foot pressure is transmitted indirectly, via only a spring, to the slide switch with its gold-plated contacts. The electronics board is thus not exposed to mechanical loads, making the Little Lehle II virtually indestructible and guaranteeing years of trouble-free switching.
specs: |-
  - Passive switching, the power supply feeds the LEDs only
  - Switches with gold-plated contacts assure True Bypass
  - Switches the signal ground as well as the stereo signal, avoiding hum between two amps
  - All jack sockets are stereo
  - Handles pick-up, microphone and keyboard line-out level signals, and weak piezo pickups
  - Mushroom-shaped button transmits foot pressure through a spring, keeping load off the electronics board
