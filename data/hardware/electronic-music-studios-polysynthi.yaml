description: >-
  The EMS Polysynthi is an exceptionally rare paraphonic analog synthesizer from 1978 featuring
  a pressure-sensitive 4-octave keyboard, dual voltage-controlled LFOs, and a novel voltage-
  controlled analog delay line, with only around 30 units ever produced.
details: |-
  Produced around 1978 by a company already facing financial difficulties despite the legendary
  status of instruments like the VCS3 and Synthi A, the Polysynthi was hardly a commercial
  success. Roughly 30 units reached the market before disappearing into obscurity outside of
  dedicated EMS enthusiasts and synth historians.

  Despite its name suggesting full polyphony, the Polysynthi is technically paraphonic. It
  features a fully polyphonic 49-key pressure-sensitive keyboard controlling a Voltage Controlled
  Oscillator Bank, but all voices share a single VCA and one filter switchable between 2-pole
  (12 dB) and 4-pole (24 dB) operation. Sound sources include two VCOs generating independently
  mixable triangle, square, and pulse waveforms, a noise generator, and an external input with
  envelope follower.

  The modulation architecture is notably sophisticated, with dual voltage-controlled LFOs
  producing sine and variable pulse waveforms. These can modulate each other or be frequency-
  modulated by either of two ADSR envelopes. The LFOs can also trigger the envelope generators,
  allowing performers to decouple keyboard control from the VCA for creative parameter routing.

  The voltage-controlled analog delay line was perhaps the most novel feature, with switchable
  short delay mode for chorus, flanging, and reverb effects, and a long delay mode providing
  echoes up to one second. Delay time could be modulated by keyboard voltage and the VCLFOs.
  Despite these innovations, the instrument's unintuitive control panel and shifting musical
  tastes in the 1980s limited its success, though renewed vintage interest has made it highly
  sought after.
specs: |-
  - Polyphony: 49-note paraphonic
  - Oscillators: 2 VCOs (triangle, square, pulse)
  - LFO: 2 VCLFOs (sine, variable pulse, 0.8-20 Hz)
  - Filter: Switchable 12 dB or 24 dB/oct, with ADSR control
  - VCA: 1 shared, controllable by ADSR, VCLFO, keyboard, or external
  - Envelopes: 2 ADSR
  - Effects: Voltage-controlled analog delay line (short/long modes)
  - Keyboard: 49 keys, pressure-sensitive with keyboard memory
  - Memory: None
  - Control: External sequencer connection available
