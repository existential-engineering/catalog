description: >-
  The EMS Poly Synthi is a rare paraphonic synthesizer produced around 1978, featuring a
  fully polyphonic 4-octave pressure-sensitive keyboard controlling a Voltage Controlled
  Oscillator Bank while sharing a single VCA and filter across all voices. Approximately
  30 units were manufactured before Electronic Music Studios' financial difficulties led
  to its discontinuation.
details: |-
  The EMS Poly Synthi emerged during a challenging period for Electronic Music Studios, a company already legendary for instruments used by Tangerine Dream, The Who, Pink Floyd, and Kraftwerk. Despite this prestigious heritage, the Poly Synthi struggled commercially and virtually disappeared from public awareness except among devoted EMS enthusiasts and synthesizer historians.

  The instrument's architecture employed a novel approach to polyphony through its Voltage Controlled Oscillator Bank paired with a single shared VCA and switchable filter operating in 12dB or 24dB mode. This paraphonic design allowed multiple note triggering but limited independent voice control, fundamentally different from true polyphonic synthesizers of that era like the Prophet 5 or Oberheim OB-X.

  The Poly Synthi's most distinctive feature was its voltage controlled analog delay line, offering both short delay modes for chorus, flanging, and reverb effects, and long delay modes with up to 1 second of echo. Keyboard voltage could modulate delay time alongside the dual VCLFOs, enabling extensive time-based effects manipulation.

  Coming at analog synthesis's twilight as 1980s digital aesthetics emerged, the Poly Synthi's ergonomic challenges and inferior delay quality compared to professional tape echo systems hindered adoption. Its rarity and innovative design have since attracted renewed collector and musician interest.
specs: |-
  - Polyphony: 49 notes (paraphonic)
  - Oscillators: Voltage Controlled Oscillator Bank (VCOB)
  - Waveforms: Triangle, square, pulse (independently mixable)
  - Filter: Switchable 12dB or 24dB/octave with ADSR
  - LFO: 2 VCLFOs with sine and variable pulse (0.8-20Hz)
  - VCA: Controlled via ADSR, VCLFO, keyboard, or external
  - Effects: Voltage controlled analog delay line (short and long modes, up to 1 second)
  - Keyboard: 49 keys, pressure-sensitive with pressure and position CV
  - Units manufactured: Approximately 30
  - Year produced: 1978
releaseDate: "1978"
