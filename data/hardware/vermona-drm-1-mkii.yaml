description: >-
  The Vermona DRM-1 mkII is a true analog drum synthesizer capable of creating eight
  distinct percussive sounds, each with approximately nine knobs for real-time sound
  shaping. With over 72 knobs on its front panel, it offers deep hands-on control over a
  wide range of drum and percussion tones. The rack-mountable unit features stereo and
  individual channel outputs, MIDI control, and an optional trigger input expansion.
details: |-
  The DRM-1 mkII is a comprehensive analog percussion synthesis system built around eight dedicated sound channels. Five predetermined percussive sound types are distributed across specialized channels: three DRUM channels for bass drums, toms, and effects; one MULTI channel for cowbells and effects; one SNARE channel for snare drums and sonar sounds; two HI HAT channels for open and closed hi-hats; and one CLAP channel.

  Each channel provides seven real-time sound controls plus panning and volume, giving performers immediate tactile access to every parameter. The stereo output is complemented by individual channel outputs that double as insert points for external processing. The front panel tilts for comfortable use in both rack-mount and tabletop configurations.

  A notable limitation is the lack of patch memory, meaning all settings must be dialed in manually. The original DRM-1 was released by Touched By Sound in a gold finish, while the mkII versions came in blue or silver colorways.
specs: |-
  - 8 analog drum voices with individual sound-shaping controls
  - Over 72 knobs on the front panel
  - 3 Drum channels, 1 Multi channel, 1 Snare channel, 2 Hi Hat channels, 1 Clap channel
  - 7 real-time sound controls per channel plus panning and volume
  - Stereo main output
  - Individual channel outputs with insert functionality
  - MIDI In and MIDI Thru
  - Optional 10 trigger inputs
  - Tilting front panel for rack-mount or tabletop use
  - No patch memory
