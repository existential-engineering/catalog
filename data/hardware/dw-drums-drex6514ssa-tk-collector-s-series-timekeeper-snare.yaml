details: |-
  Resident Woodologist and Drum Designer John Good dreamed up this collectable wood-inlayed work of art as a fitting tribute to the art of drumming.

  A Collector's Series 11-ply VLT Pure Purpleheart shell is adorned with 531 individual laser-cut exotic and dyed woods that are meticulously inlayed into an Exotic Santos Rosewood background.

  The Custom Shop designed clock motif is complemented with ultra-custom Antique Bronze hardware including True-Hoops, MAG throw-off system with 3P butt plate and DW's trademark turret lugs.
specs: |-
  - Crafted at the California, U.S.A. Custom Shop
  - Pure Purpleheart shell with VLT grain orientation technology
  - Custom-plated antique bronze components
  - MAG throw-off system with 3P (3 position) butt plate
  - True-Hoops
  - 531 individual laser-cut exotic and dyed wood inlays
  - Size: 6.5x14
