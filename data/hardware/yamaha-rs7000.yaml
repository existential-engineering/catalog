description: >-
  The Yamaha RS7000 is a groove production workstation that combines sampling,
  sequencing, and AWM2 synthesis in a single unit. Designed for dance, techno,
  hip-hop, and ambient music production, it functions similarly to the Akai MPC
  series but adds an internal synthesizer engine with over 1,000 voices. Its
  powerful pattern-based sequencer, real-time controls, and extensive effects
  processing make it a comprehensive production tool.
details: |-
  The RS7000 integrates three primary sound-creation systems into a single groovebox. The tone generator provides 62-voice polyphonic AWM2 synthesis with over 1,000 synthesizer sounds and 63 drum kit configurations stored in ROM. The sampler section offers 4MB of memory, expandable to 64MB via SIMMS, with sampling rates from 5kHz to 48kHz and auto-beat slicing for synchronizing loops to tempo.

  The sequencer is the instrument's central strength, offering pattern-based recording across 16 tracks with a 200,000-note capacity and tempos ranging from 1 to 300 BPM at 480 ppqn resolution. Both linear and pattern-based sequencing approaches are supported, with real-time, grid, and step recording methods available.

  The RS7000 includes six filter types, expandable to eighteen with OS updates, along with advanced LFO modulation featuring BPM-synchronized waveforms. Real-time control is provided via 18 assignable knobs and two pads for hands-on manipulation during performance.

  The master effects section includes multi-band compression, slicing, isolation, and DJ-style effects. Four effect blocks provide reverb (11 types), delay and chorus (22 types), and variation effects (92 types), along with six EQ types for comprehensive sound shaping.
specs: |-
  - 62-voice polyphonic AWM2 tone generator
  - 1,054 synth voices and 63 drum kit sounds in ROM
  - 256 sample voices with 5kHz to 48kHz sampling rates
  - 4MB sample memory, expandable to 64MB via SIMMS
  - 16-track pattern sequencer with 200,000-note capacity
  - 480 ppqn resolution, 1-300 BPM tempo range
  - 6 filter types (18 with OS 1.2+)
  - 18 assignable knobs and 2 performance pads
  - Reverb, delay, chorus, variation, and master effects
  - Dual MIDI in/out
  - Supports WAV, AIFF, and Yamaha sampler formats
