description: An ultra-affordable homage to the iconic 1970s portable analog
  synthesizer, MODEL D is a monophonic instrument whose pure analog signal path
  is built on authentic VCO, VCF, VCA and ladder filter designs alongside a
  dedicated analog triangle/square wave LFO. Its semi-modular layout needs no
  patching to play, and the main module can be transferred into a standard
  Eurorack case.
details: |-
  The 1970s spawned the first truly portable analog synthesizer, and while it was quickly adopted by renowned musical artists including Jan Hammer, Chick Corea, Rick Wakeman, Jean-Michel Jarre, Isao Tomita and Keith Emerson, it was somewhat temperamental and very expensive. An ultra-affordable homage to that iconic synthesizer, with all the features of the original and then some, MODEL D conjures up virtually any monophonic sound imaginable.

  Great care has been taken in designing MODEL D, including the true to the original "D Type" circuitry with its matched transistors and JFETs, ultra-high precision 0.1% thin film resistors and polyphenylene sulphide capacitors. This attention to detail gives MODEL D an ultra-flexible sound shaping capability, covering everything from super-fat bass and lead tones to stunning effects and progressive organ sounds.

  MODEL D's 3 highly-flexible Voltage Controlled Oscillators provide a range of 5 waveforms for sculpting a sound. Oscillators 1 and 2 options include triangular, triangular/saw, saw, square, wide pulse and narrow pulse, while OSC 3 features triangular, reverse saw, saw, square, wide pulse and narrow pulse. All 3 VCOs can be adjusted across an extremely wide 6-octave range (LO, 32', 16', 8', 4' and 2').

  The very heart of MODEL D's sound is its highly-flexible 24 dB Ladder Filter, with Cutoff Frequency, Emphasis and Contour controls. The Filter Mode switch can be set to either Lo- or Hi-pass, and the Attack, Decay and Sustain controls shape the cutoff frequency over time. Filter keytracking selects how much filtering is applied based on the note being played, and the VCA can be overloaded via the feedback circuit to add edge to a sound without losing low-end content.

  Onboard modulation covers adjustable Tune, Mod Depth, LFO Rate, Glide (portamento) and Mod Mix knobs, with switches for triangle or square wave oscillation, modulation on or off, OSC 3 or Filter EG, and Noise or LFO as the modulation source. The internal noise generator is switchable between pink and white noise and acts as the default modulation source unless an external source is connected at the 3.5 mm input jack.

  Designed around a linear workflow, MODEL D's semi-modular design requires no patching for immediate performance: connect a keyboard or computer via MIDI over DIN or USB and start playing. Although it is monophonic, the 16-note Poly Chain function combines multiple units for up to 16-voice polyphony, and the main module can be transferred into a standard Eurorack case for integration into an existing system.
specs: |-
  - Analog monophonic synthesizer, pure analog VCO, VCF and VCA signal path
  - 3 Voltage Controlled Oscillators
  - OSC 1 and 2 waveforms: triangular, triangular/saw, saw, square, wide pulse, narrow pulse
  - OSC 3 waveforms: triangular, reverse saw, saw, square, wide pulse, narrow pulse
  - 6-octave oscillator range: LO, 32', 16', 8', 4', 2'
  - 24 dB ladder filter with resonance (Emphasis), switchable lo-pass / hi-pass
  - Filter envelope with Attack, Decay and Sustain, plus filter keytracking
  - VCA with Decay switch, overloadable via the feedback circuit
  - Dedicated fully analog triangle / square wave LFO
  - Noise generator switchable between pink and white noise
  - Glide (portamento) control
  - 16-note Poly Chain for up to 16-voice polyphony across multiple units
  - Semi-modular: no patching required for immediate performance
  - 0.1% thin film resistors and polyphenylene sulphide capacitors, matched transistors and JFETs
  - 29 knobs and 19 switches (48 controls)
  - Main module transferable into a standard Eurorack case
  - Low and high level outputs
