details: |-
  Experience home cinema as it was meant to be heard with B&W's Custom Theatre 700 Series. This range of dedicated custom theatre loudspeakers brings B&W 700 Series technology and craftsmanship to a home cinema set-up at a cost-effective mid-range price.

  The three models in the range integrate seamlessly with home theatre cabinetry and can each be positioned as left, centre, right or surround speakers. Each speaker uses high sensitivity Nautilus tube-loaded tweeters designed specifically for the reproduction of movie soundtracks along with first-order tweeter crossover filters for minimal signal degradation. Combined with the Aramid Fibre drive units, the result is extraordinarily life-like, dynamic movie sound quality.

  The mid-point in the range, the CT7.4 LCRS offers superior performance at lower frequencies through its two 6 inch Aramid Fibre CT700 series bass/midrange drive units. It is a 2-way vented-box system built around a Nautilus tube-loaded 25mm cloth dome tweeter and two 165mm woven Aramid Fibre bass/midrange cones, with a Flowport and a magnetically attached grille.

  CT700 Series speakers can either be installed within existing or custom designed home theatre system cabinets, or wall mounted. The speakers incorporate four M6 tapped inserts in their back panels for the two wall brackets supplied, and four more M6 tapped inserts in their undersides that allow adjustable ball-joint style mounting brackets designed for 127mm x 69.9mm (5in x 2.75in) mounting hole centres. Adhesive rubber feet are supplied for cabinet installation, and the black fabric grilles are attached by magnets and may be removed if desired.

  CT700 Series speakers have a pair of binding post connection terminals and one Neutrik Speakon connection socket on their rear panels. The binding post terminals provide quick and easy connection of stripped wires, with the positive cable to the red terminal and the negative cable to the black terminal, while the Speakon socket provides a more secure and reliable connection method, with the positive cable to the terminal marked +1 and the negative cable to -1. If a general reduction in bass volume is wanted, foam plugs can be fitted in the speakers' Flowport tubes.
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Nautilus tube loaded tweeter, Aramid Fibre bass/midrange cone, Flowport, magnetically attached grille
  - Drive units: 1x ø25mm (1in) cloth dome high-frequency
  - Drive units: 2x ø165mm (6.5in) woven Aramid Fibre cone bass/midrange
  - Frequency range: -6dB at 43Hz and 28kHz
  - Frequency response: 49Hz to 22kHz ±3dB on reference axis
  - Dispersion: within 2dB of reference response, horizontal over 60º arc, vertical over 10º arc
  - Sensitivity: 94dB spl (2.83V, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) <1% 90Hz to 20kHz
  - Nominal impedance: 8Ω (minimum 4.0Ω)
  - Crossover frequency: 4kHz
  - Recommended amplifier power: 50W to 150W into 8Ω on unclipped programme
  - Max. recommended cable impedance: 0.1Ω
  - Dimensions: Height 343mm (13.5in), Width 444mm (17.5in), Depth 265mm (10.5in), Depth with grille 288mm (11.3in)
  - Net weight: 15.75kg (34.7lb)
  - Finishes: Cabinet black painted, grille black cloth
  - Connections: pair of binding post terminals plus one Neutrik Speakon socket on the rear panel
