url: https://intellijel.com/shop/legacy/hexvca/
description: Six high quality VCAs + Summer in 8HP
details: |-
  The HexVCA contains six separate DC-coupled logarithmic VCAs with outputs normalled to two mix busses, SUM+ and SUM- (the latter phase-inverted). The front-panel output of each VCA is a switching jack that breaks the normal to the mix bus when patched, allowing the HexVCA to be used as six individual VCAs, a six-input voltage-controlled mixer, or any combination of the two.

  Each channel offers an offset/bias knob (with a CV indicator LED) that injects 0-5V into the CV input to open the VCA as an initial level control, plus dedicated IN and CV jacks; patching into an individual OUT jack removes that channel from the SUM mix. Rear-panel trimmers attenuate each channel's CV input to compensate for varying modular CV levels, and the module is factory-calibrated so that 5V at the CV input equals unity gain.

  A rear 12-pin header carries the six individual VCA outputs and can be used to normal them into the Intellijel Mutagen mixer via ribbon cable. The module uses THATcorp 2162 VCA chips for a dynamic range of -80dB to 0dB with a 0-5V control signal.
specs: |-
  - Width: 8HP
  - Max Depth: 39mm
  - Current Draw: 54mA @ +12V, 52mA @ -12V
  - Dynamic Range: -80dB to 0dB with 0-5V control signal
  - Expected input: 5V peak to peak
  - VCA component: THATcorp 2162
  - Rear 12-pin header normals VCA outputs to the Intellijel Mutagen mixer
