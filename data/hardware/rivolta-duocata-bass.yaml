  simplified volume and tone control layout.
details: |-
  The new Rivolta Duocata Bass brings the bold style and player-focused ergonomics of the Duocata Guitar comfortably into the low end. With a 30" scale, one custom-single-coil pickup, and a stripped-down electronic layout (one volume and one tone), this bass cuts with power, sings with clarity, and responds instantly to your touch. A bound f-hole gives the semi-hollow body classic character, and the checkerboard ivory binding injects a dash of retro attitude. With bold contours, sleek curves, and razor-sharp details, the Duocata Bass commands attention wherever it plays. Features and Specs

  Case Fit
