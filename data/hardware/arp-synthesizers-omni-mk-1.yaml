description: >-
  A versatile analog keyboard combining polyphonic orchestral string sounds with
  a monophonic synthesizer and bass section, offering three simultaneously
  playable sound layers from a single 49-key instrument.
details: |-
  Produced from 1975 to 1977, the ARP Omni Mk 1 was designed to give keyboardists access to
  multiple sound types without requiring a multi-keyboard rig. The instrument divides its
  architecture into three independent sections that can be played simultaneously: a polyphonic
  string section with violin and viola waveforms, a monophonic synthesizer section with full
  VCF and VCA controls, and a monophonic bass section featuring cello waveforms.

  The string section uses a divide-down oscillator architecture common to string machines of
  the era, with a built-in chorus effect that thickens the sound considerably. A variable-speed
  sine wave LFO adds vibrato to the string voices. The synthesizer section features ARP's
  Model 4075 4-pole low-pass filter at 24 dB per octave with a dedicated ADSR envelope,
  providing the classic warm analog filter sweep that defined the era.

  The Omni Mk 1 uses an AR (Attack/Release) envelope for its VCA, which was later upgraded
  to a full ADSR in the Mk 2 revision of 1978. The Mk 2 also added LFO control over the VCF
  and improved the triggering system, distinguishing itself visually with an orange and black
  color scheme compared to the Mk 1's original styling.

  Notable users include Tangerine Dream, The Cars, Joy Division, Kraftwerk, Trouble Funk, and
  New Order. The instrument's ability to layer lush string pads with punchy monophonic bass and
  lead sounds made it particularly popular in new wave and electronic music contexts.
specs: |-
  - Polyphony: Polyphonic strings (divide-down), monophonic synth and bass
  - Waveforms: Violin (poly), Viola (poly), Cello (mono), Bass (mono)
  - Filter: Model 4075 4-pole low-pass, 24 dB/oct with ADSR
  - VCA: AR envelope (Mk 1), ADSR (Mk 2)
  - LFO: 1 sine wave (string vibrato)
  - Effects: Built-in chorus
  - Keyboard: 49 keys
  - Control: CV/Gate
releaseDate: "1975"
