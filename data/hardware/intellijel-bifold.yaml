description: Into the Folds Bifold is a unique dual channel wavefolder with
  numerous feedback and routing options along with CV control. Mix, blend and
  crossfade the two different folder flavours into a rich stew of unique
  waveforms and harmonic movement. It is the first wavefolder to offer
  simultaneous, independently controllable serial and parallel folder circuits.
details: |-
  Wavefolding is one of the most powerful ways to produce complex timbres out of a simple sound source or waveform. When done well, the results can be warm, textured, organic and full of musical character. Intellijel studied some of the most revered wavefolding circuits and looked at ways to integrate the positive qualities of these into a design that was full of sweet spots and allowed for a huge amount of experimentation and modulation.

  Bifold combines two unique wavefolders with a crossfader; one channel (the P channel) has a sonic characteristic inspired by the Buchla-style Parallel “deadband” folding circuit, while the other channel (the S channel) is more characteristic of a Serge-type Serial folding circuit. There are distinct differences to how they react to specific waveforms, modulation and even their overall frequency response.

  By linking both folders together with a voltage controlled crossfader, Bifold further expands the ability to blend these two different folders together to create new waveforms. Ring modulation, blending, crossfading, complex noise generation, feedback modulation, cascaded folding and much more are all possible thanks to the strategically placed routing switches, jack normals and attenuators and other control options.
