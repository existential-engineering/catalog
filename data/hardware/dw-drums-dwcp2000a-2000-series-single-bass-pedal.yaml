description: More features, unmatched durability, and distinctive feel for any player.
details: |-
  For over half a century, DW has been contributing to the world of hardware innovation. Every product launch, including the 2000 Series, is a step forward in this continuous journey of improvement and innovation. The 2000 Series pedal provides innovative features and adaptable player functionality, making it a savvy, flexible choice for drummers at every stage of their journey.

  This robust, all-metal, single-chain pedal in the 2000 Series has been enhanced with a responsive Accelerator cam, adjustable footboard angle, and a refined Footboard InterLock Hinge System. The steel base plate now features an anti-skid rubber mat, ensuring superior stability.

  Upgraded Features: 5000 Series-inspired stroke adjustment, spring tension assembly, and more.

  Footboard Angle Adjustment: Quickly adjust footboard angle with accessible drum key screw.

  Wing Screw Toe Clamp: Securely clamp pedal to kick drum hoop. Anti-skid Rubber Mat: Keeps your pedal in place while you play.
specs: |-
  - Single-Chain Accelerator Drive System
  - Delta Stroke Adjustment with Ball Bearing and Detachable Spring
  - All-metal Frame and Drivetrain
  - Two-Way DW101 Beater with Memory Lock
  - Steel Base Plate with Anti-skid Rubber Mat and Included Drum Key
