details: |-
  The Q4 brings a new dimension to music video, combining high-definition video with high-resolution audio so a performance can be shot with sound to match. Its side panel carries an input level slider with a three-position gain switch, a manual and auto gain selector, a low-cut filter switch and SD card, battery and charging indicators.
