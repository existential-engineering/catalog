description: Trio11 Be combines a 3-way and a 2-way monitor; its Focus Mode makes it easy to switch from one to the other. Thanks to its G-Class amplification and horizontal or vertical positioning, this monitoring loudspeaker offers a wide range of nearfield and midfield applications.
details: |-
  Trio11 Be combines a 3-way and a 2-way monitor; its Focus Mode makes it easy to switch from one to the other. Thanks to its G-Class amplification and horizontal or vertical positioning, this monitoring loudspeaker offers a wide range of nearfield and midfield applications.

  Focal technologies: in addition to a 5" midrange and an 11" subwoofer with high efficiency and power handling, Trio11 Be benefits from the latest Focal technologies in acoustics and electronics: TMD technologies, optimized vents for perfect bass definition and high excursion for even greater loudspeaker linearity.

  Power and precision: thanks to its powerful amplification, Trio11 Be delivers a high SPL level (118 dB at 1 m) and allows nearfield and midfield use, always accompanied by extremely accurate sound reproduction and stereophonic imaging. Bass, midrange and treble controls are available on the rear panel.

  Focus Mode: Trio11 Be consists of a 3-way monitor, offering full-spectrum control (30 Hz - 40 kHz), and a 2-way monitor with a frequency response from 90 Hz to 20 kHz. The Focus Mode lets you switch from one to the other via a foot pedal (not supplied) for quick and easy control of mix transfer quality, especially on systems with limited frequency response in the bass.

  The monitor can be placed horizontally or vertically, and an adjustable plate gives installation flexibility.
specs: |-
  - Product type: 3-way monitor
  - Subwoofer: 11" W membrane
  - Woofer: 5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (+/- 3dB): 3-way mode 30 Hz - 40 kHz; 2-way Focus mode 90 Hz - 20 kHz
  - Maximum SPL (peak @ 1m): 118 dB
  - High frequency amplifier: 100 W, class AB
  - Bass amplifier: 300 W, class G; midrange amplifier: 150 W, class G
  - Inputs: XLR symmetrical 10 kOhms
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-3 dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, HPF, LF Shelv, LMF EQ, HF Shelv
  - LEDs: power on, Focus mode, clipping/default/stand-by
  - Local supply: 230V (1.6A T fuse) or 115V (3.5A T fuse)
  - On/Off switch on the rear panel
  - TMD suspension, adjustable mounting plate for horizontal or vertical placement
  - Height: 63.5 cm / 25 in
  - Width: 34.5 cm / 13.6 in
  - Depth: 45 cm / 17.7 in
  - Weight: 37.3 kg / 82.2 lb
