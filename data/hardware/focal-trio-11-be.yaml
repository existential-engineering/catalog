url: https://www.focal.com/products/trio-11-be
description: 3-way nearfield and midfield monitor with an 11" W cone subwoofer,
  5" W cone midrange, 1" Beryllium inverted dome tweeter, and Focus mode for
  switching between full-range, 2-way, and 1-way references.
specs: |-
  - 3-way monitor with Focus mode
  - Subwoofer: 11" W membrane
  - Woofer: 5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (3-way mode, ±3 dB): 30 Hz – 40 kHz
  - Frequency response (2-way Focus): 90 Hz – 20 kHz
  - Maximum SPL (peak @ 1 m): 118 dB
  - High frequency amplifier: 100 W class AB
  - Bass amplifier: 300 W class G
  - Midrange amplifier: 150 W class G
  - Bass/midrange level (160 Hz): adjustable ±3 dB
  - Bass level (>250 Hz): adjustable ±3 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - Power supply: 230 V or 115 V
  - Dimensions (H × W × D): 63.5 × 34.5 × 45 cm (25 × 13.6 × 17.7 in)
  - Weight: 37.3 kg (82.2 lb)
