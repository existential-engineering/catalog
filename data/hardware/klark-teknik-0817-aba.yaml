description: Designed as an homage to the classic 1176LN, the 76-KT FET-Style
  Compressor stays true to the original D and E versions of that signal
  processor. The completely discrete signal path is modernised with
  hand-selected components and custom-engineered MIDAS input and output
  transformers.
details: |-
  The 76-KT is a FET-style compressor built as an homage to the classic 1176LN, keeping to the original D and E versions of that processor while rebuilding the fully discrete signal path from hand-selected components and custom-engineered MIDAS input and output transformers.

  The compression ratio is selected by pushing any, or all, of the Ratio buttons to the left of the VU meter. The available ratios are 4:1 for moderate compression, 8:1 for severe compression, 12:1 for mild limiting and 20:1 for hard limiting. All-Button mode can be especially effective on drums, bass, guitar and room mics, or for more aggressive vocals.

  The Attack knob adjusts how long the compressor takes to respond to audio that exceeds the threshold, slower fully counterclockwise and faster turned clockwise. The Release knob sets how long the compressor stays engaged after the incoming audio falls back below the threshold, with the same sense of rotation.

  In keeping with the original design, an illuminated vintage-style VU meter gives visual confirmation of gain reduction and output level. A meter reading of 0 corresponds to an output level of +4, +6 or +8 dBm depending on which button is engaged.

  The rugged steel 2U rackmount enclosure is built for concert touring, with industry-standard XLR connectors for the audio connections, and the universal switch-mode power supply is auto-voltage sensing for worldwide use.
specs: |-
  - FET-style compressor with a completely discrete signal path
  - Custom-engineered MIDAS input and output transformers
  - Selectable compression ratios: 4:1, 8:1, 12:1, 20:1, plus All-Button mode
  - Variable attack and release controls
  - Illuminated vintage-style VU meter for gain reduction and output level
  - Meter 0 corresponds to +4, +6 or +8 dBm output, button selectable
  - XLR audio input and output connectors
  - 2U rugged steel rackmount enclosure
  - Auto-ranging universal switch-mode power supply
