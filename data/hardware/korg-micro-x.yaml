description: >-
  The Korg Micro-X is a compact 25-key synthesizer built on Korg's HI (Hyper Integrated)
  synthesis engine, originally made famous by the Triton line of workstations. Released in
  2007, it packed 62-voice polyphony, 640 preset patches, dual arpeggiators, and a 64MB
  wave ROM into a portable format aimed at touring musicians and home studio producers.
details: |-
  The Micro-X represented Korg's most affordable entry into their HI synthesis platform, sharing its core sound engine with the acclaimed Triton series. Every unit shipped in a distinctive bright orange road case rather than standard cardboard packaging, emphasizing its portable design philosophy. A limited-edition white version was also released.

  At the heart of the Micro-X is a 64MB Wave ROM containing 32MB of classic Triton waveforms alongside 32MB of new multisampled and drum sounds exclusive to this model. This yielded 642 multisamples and 929 drum samples arranged into 640 preset patches of excellent quality. The synth also included a complete General MIDI soundset and 40 customizable drum kits.

  The synthesis architecture is built on a two-oscillator structure with extensive modulation capabilities, including two LFOs per oscillator, three six-point envelopes per voice, and dual programmable arpeggiators with 256 user slots. Its effects section provided up to four simultaneous effects per patch drawn from 89 available types. The instrument supported 16-part multitimbrality with 384 combination presets for managing complex layered and split configurations.

  Programming could be done entirely from the front panel using the backlit display and array of knobs and switches, or via the included software editor and librarian available in both standalone and VST formats. While the front-panel workflow was manageable despite the synthesis depth, the software editor offered superior efficiency for deep sound design.
specs: |-
  - 62-voice polyphony
  - 16-part multitimbral
  - 2 oscillators per voice
  - 64MB Wave ROM (32MB Triton + 32MB new content)
  - 642 multisamples, 929 drum samples
  - 640 preset patches
  - 384 combination presets
  - Complete General MIDI soundset
  - 40 customizable drum kits
  - 2 LFOs per oscillator, 4 per patch
  - 3 six-point envelopes (oscillator, filter, amplitude)
  - 89 effect types, up to 4 per patch
  - 2 programmable arpeggiators with 256 presets
  - 25-key velocity-sensitive keyboard
  - MIDI In/Out
  - USB MIDI
  - Includes software editor/librarian (standalone and VST)
