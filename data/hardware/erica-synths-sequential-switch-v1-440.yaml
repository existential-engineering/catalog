id: DgVA3ycrzfXCQPEbZy9u5
name: Sequential Switch V1
manufacturer: erica-synths
primaryCategory: utility
categories:
  - discontinued
  - modular
  - routing
  - sequencer
hp: 14
url: https://www.ericasynths.lv/sequential-switch-v1-440/
description: Erica Synths 8 channel Sequential Switch is the first assembled
  module for Erica synths, and it allows you to sequence up to eight sound
  sources in advanced ways or route one sound source sequentially to eight
  different sound modifiers- VCFs, waweshapers, VCAs, etc.
details: |-
  The 8 channel Sequential Switch is the first assembled module Erica Synths released. It sequences up to eight sound sources in advanced ways, or routes one sound source sequentially to eight different sound modifiers, among them VCFs, waveshapers and VCAs.

  Its control interface allows steps to be paused, skipped and merged and the sequence length to be set, but what really sets it apart from other sequential switches is the gate output. Used with an ADSR and a VCA, that turns it into a powerful sequencer with real time control over each sound source in the sequence.

  Driven from a random clock source, the module becomes the heart of insane random, self-generating patches. It is 14HP wide and 20mm deep, and with all LEDs on it draws at most 52mA@+12V and 13mA@-12V.
specs: |-
  - 8 channels sequentially routed to one common jack
  - Pause, skip and merge steps
  - Settable sequence length
  - Gate output
  - Panel width 14HP
  - Module depth 20mm
  - Max power consumption (all LEDs on) 52mA@+12V, 13mA@-12V
