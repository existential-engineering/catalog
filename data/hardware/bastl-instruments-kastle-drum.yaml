description: A pocket-sized patchable mini modular synthesizer specializing in
  algorithmic industrial glitchy drum synthesis, featuring 8 drum synthesis
  styles with a unique dynamic acceleration charged envelope.
details: |-
  The Kastle Drum is a pocket-sized patchable mini modular synthesizer specializing in algorithmic industrial glitchy drum synthesis. Eight drum synthesis styles are selectable via the DRUM control, each shaped by a unique dynamic acceleration charged envelope. Decay time is separately controllable with a CV input.

  A voltage-controllable clock generator produces square (CLK) and triangle (LFO) wave outputs. A stepped voltage generator offers random, 8-step, and 16-step loop modes, with its output accessible as a patch point. The PITCH control has an offset knob and CV input with an attenuator.

  Two protected CV I/O ports can be routed to any patch point and are the recommended connection points for interfacing with external gear (using I/O 1 as clock input for sync). The main audio output can drive headphones directly without a volume control.

  Open-source design with firmware and schematics on GitHub. Originally released Fall 2016; v1.5 introduced significant improvements. Powered by 5V Micro USB (power only, no data) or 3x AA batteries (switchable). Dimensions: 70 × 60 × 50 mm.
