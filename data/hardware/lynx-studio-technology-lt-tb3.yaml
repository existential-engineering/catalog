details: |-
  Lynx Studio Technology created the LT-TB3 Thunderbolt 3 LSlot interface for its Aurora(n) and Hilo converters. The LT-TB3 is a two-port Thunderbolt 3 expansion card that supports daisy-chaining Aurora(n) and Hilo converters for up to six total certified Thunderbolt devices plus a display on both Apple and Windows computers.

  The LT-TB3 LSlot card can be installed into any existing Hilo or Aurora(n) with an easy and free firmware update. In addition, Lynx is making Thunderbolt 3 equipped Aurora(n) and Hilo models available at the same time: Hilo-TB3 in Black and Silver, Aurora(n) 32-TB3, Aurora(n) 24-TB3, Aurora(n) 16-TB3 and Aurora(n) 8-TB3.

  The LT-TB3 is the latest in a series of LSlot connectivity cards available for the acclaimed Aurora(n) and Hilo A/D and D/A converter interfaces. The LT-TB3 allows the Aurora(n) and Hilo to have direct connectivity to Thunderbolt 3 equipped devices without the need of Thunderbolt adapters. Other LSlot modules available include Dante, USB and ProTools|HD versions.
specs: |-
  - Two-port Thunderbolt 3 LSlot expansion card
  - Available for Aurora(n) and Hilo converters
  - Supports connection of up to 6 other Thunderbolt devices total plus a display
  - Compatible with Thunderbolt 1 and Thunderbolt 2 devices (with customer supplied adapter)
  - Supports up to 40Gbps data speed
  - Installs into any existing Hilo or Aurora(n) with a free firmware update
  - The Aurora classic (silver) does not support the LT-TB3
  - Factory Thunderbolt 3 models: Hilo-TB3 in Black and Silver, Aurora(n) 32-TB3, Aurora(n) 24-TB3, Aurora(n) 16-TB3, Aurora(n) 8-TB3
  - Powered by the host Aurora(n) or Hilo converter through its LSlot bay; the card carries no power connector of its own
