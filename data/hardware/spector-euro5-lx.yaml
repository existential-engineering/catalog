details: |-
  Precision crafted in the Czech Republic since 1993, the Euro5 LX is a stunning instrument to behold. Featuring your choice of premium tonewoods, this meticulously crafted bass features neck-thru construction and comes complete with professional grade hardware and electronics. The Euro5 LX offers all of the features that have made the Spector name famous around the globe. The extremely comfortable, fully carved body is crafted from carved European alder body and is topped off a USA figured maple top. A 3-piece maple neck runs through the entire length of the instrument and features a 24 fret rosewood fingerboard with Spector's signature Crown inlays. Outfitted with a lightweight, zinc brass alloy bridge and nut, active EMG pickups and Spector's coveted Tone Pump active tone circuit, Euro5 LX basses are equipped to hold down the low-end on the world's biggest stages.
specs: |-
  - Carved European alder body with a USA figured maple top and a slice of Walnut
  - 3 piece maple neck; 24 fret rosewood fingerboard with Spector's signature Crown inlays
  - Active EMG pickups; Spector Tone Pump active tone circuit
  - Black & Blue matte finish; Black hardware
  - Includes Spector gig bag
