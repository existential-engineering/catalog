details: |-
  The G&L ASAT Classic Bluesboy 90 has joined the Fullerton Deluxe range of Made-in-Fullerton instruments. Until now, this ASAT has been available only through G&L's Build-to-Order program. Featuring G&L's own P-90 neck pickup made in-house, it's wound with less coil wire than a traditional P90, adding more sparkle to pair perfectly with the G&L Magnetic Field Design bridge pickup. The Fullerton Deluxe Bluesboy 90's hard-rock maple neck features G&L's Vintage Tint Satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coil in bridge position, G&L P90 in neck position
  - Body wood: Swamp Ash and Alder with Rear Contour
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
  - Available in: Shoreline Gold over Alder, tortoise pickguard, Rosewood fingerboard
  - Available in: Pearl Grey over Alder, 3-ply black pickguard, Maple fingerboard
