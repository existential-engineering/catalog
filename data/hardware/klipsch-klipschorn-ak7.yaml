description: The Klipschorn AK7 is Klipsch's flagship three-way, fully
  horn-loaded loudspeaker — the evolution of the original Klipsch design now in
  continuous production for over 75 years. Hand-built to order in Hope,
  Arkansas, it delivers cinema-grade dynamics and efficiency through updated
  compression drivers, a patented Tractrix mid-range horn, and a folded 15" bass
