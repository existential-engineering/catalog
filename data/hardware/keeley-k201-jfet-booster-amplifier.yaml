url: https://robertkeeley.com/product/keeley-k201-jfet-booster-amplifier/
description: JFET pre-amp boost, the Katana Boost circuit with a top-mounted
  volume knob, built as a transition model limited to 40 units.
details: |-
  The K201 JFET Booster Amplifier is the Keeley Katana Boost circuit with the pull switch removed and the volume control moved to the top of the enclosure. Keeley describes it as the same circuit as the standard Katana, without the pull switch for distortion, built as a transition model ahead of a planned mini version of the pedal.

  It is presented as a fat, harmonically rich boost that can be left on permanently to push an amplifier harder, or used occasionally to cut through a mix. Its cascading JFET stages are chosen for a response curve close to that of a valve stage, with semiconductor reliability.

  The K201 circuit was Robert Keeley's first guitar effect design for Keeley Electronics. It was originally designed for Legendary Tones for the Time Machine Boost, and became an independent product under the Keeley name after the Keeley Compressor was released.

  Internally the design uses voltage doubling: 9V DC goes in and a charge pump nearly doubles the operating voltage, for a clean, high-headroom boost. The maximum input voltage is 9V DC, so a higher supply must not be used in the hope that the doubler will raise it further.
specs: |-
  - - Top-mounted volume control
  - - Cascading dual JFET gain stages
  - - Same circuit as the standard Katana boost, without the pull switch for distortion
  - - Internal charge pump voltage doubler for additional headroom
  - - 9V DC maximum input voltage
  - - Transition model limited to 40 units
