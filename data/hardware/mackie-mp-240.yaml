description: Professional hybrid dual-driver in-ear monitors delivering
  studio-quality sound with dynamic and balanced armature drivers.
details: |-
  Instead of two dynamic drivers, MP-240 swaps one out for a balanced armature driver and a custom crossover that splits the frequencies between the two drivers. The result in stunning clarity and instrument separation for an accurate and punchy monitoring experience.

  The ergonomically molded low-profile enclosure offers maximum comfort and bass response, with up to 40dB of sound isolation. MP-240 in-ear monitors deliver the incredible high-frequency clarity and dynamic response that artists need to perform their best.

  Utilizing a dynamic driver for low frequencies and a balanced armature driver for mids and highs, MP-240 in-ear monitors deliver high-fidelity, studio-quality sound. The shielded, braided cable is designed for extra durability and sonic performance, equipped with a detachable MMCX connector that swivels for increased comfort and durability.

  With three different types of ear tips included (foam, silicone, double flange) in three different sizes, you can choose what works best for your ears. Also includes a hard case and gold-plated 1/8" to 1/4" adapter.
specs: |-
  - Frequency Response: 20 Hz – 20 kHz
  - Impedance: 32 Ohms ±15%
  - Transducer Type: Single Dynamic + Single Balanced Armature
  - Sensitivity: 94dB±3dB@1mW at 1KHz
  - Sound Isolation: Up to 40dB
  - Ergonomically molded low-profile enclosure
  - Hybrid dual driver design (dynamic + balanced armature)
  - Shielded, braided cable with detachable MMCX connector
  - Over-ear cable design
  - Three ear tip types (foam, silicone, double flange) in three sizes
  - Includes hard case and gold-plated 1/8" to 1/4" adapter
