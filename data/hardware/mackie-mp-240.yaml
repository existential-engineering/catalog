description: The MP-240 keeps the same driver count as the 220, but reaches the
  next level of detail and clarity thanks to its hybrid configuration.
details: |-
  The MP-240 keeps the same driver count as the 220, but reaches the next level of detail and clarity thanks to its hybrid configuration.

  We’ve been helping artists perform their best for decades with our renowned loudspeaker designs, and now we are bringing that signature sound straight to your ears. Instead of two dynamic drivers, MP-240 swaps one out for a balanced armature driver and a custom crossover that splits the frequencies between the two drivers. The result in stunning clarity and instrument separation for an accurate and punchy monitoring experience.
specs: |-
  - Ergonomically molded low-profile enclosure offers maximum comfort and bass response
  - Up to 40 dB of sound isolation
  - Hybrid dual driver design: a dynamic driver for low frequencies and a balanced armature driver for mids and highs
  - Custom crossover splits the frequencies between the two drivers
  - Shielded, braided cable designed for extra durability and sonic performance
  - Detachable MMCX connector that swivels for increased comfort and durability
  - Over-ear design keeps the cables behind your head for uninterrupted performance
  - Three types of ear tips included (foam, silicone, double flange) in small, medium and large
  - Hard case included
  - Gold-plated 1/8-inch to 1/4-inch adapter included
  - Frequency Response: 20 Hz - 20 kHz
  - Impedance: 32 Ohms ±15%
  - Transducer Type: Single Dynamic + Single Balanced Armature
  - Sensitivity: 94dB±3dB@1mW at 1KHz
