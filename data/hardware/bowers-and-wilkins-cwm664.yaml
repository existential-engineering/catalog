details: |-
  CWM664 is a two-way passive in-wall speaker in the Bowers & Wilkins Performance Series, pairing a 150mm (6in) black glassfibre cone bass/midrange driver with a 25mm (1in) soft dome tweeter. It is a passive design with no on-board amplifier and no mains connection, driven from an external amplifier over ordinary speaker cable.

  The soft dome tweeter is what distinguishes this model from its CWM663 and CWM652 siblings, which use aluminium domes with Nautilus tube loading. Bowers & Wilkins positions the soft dome as bringing smoother and more detailed high frequency performance, and pairs it with a woven glass fibre bass/midrange cone.

  A three-position high frequency switch lets the installer fine-tune the treble balance to the room and the mounting position, which is the one adjustment the speaker offers.

  Installation is catered for by the QuickDog fixing system, which Bowers & Wilkins describes as a simple and effective route to high quality in-wall sound at lower cost than the rest of the series. The speaker needs a 279mm x 183mm (11in x 7.2in) cut-out and 95mm (3.7in) of clear depth behind the mounting surface, and protrudes 4mm (0.2in) from the wall. A PMK W6 pre-mount kit and a BB 6W back box are offered for new-build installations.
specs: |-
  - Description: 2-way in-wall system
  - Drive units: 1x 25mm (1in) soft dome tweeter, 1x 150mm (6in) black glassfibre cone bass/midrange
  - Frequency range (-6dB): 45Hz to 35kHz
  - Maximum amplifier power: 25W to 130W
  - Sensitivity SPL (2.83V, 1m): 87.5dB
  - Nominal impedance: 8 ohms (minimum 4.5 ohms)
  - Frame height: 315mm (12.4in)
  - Frame width: 221mm (8.7in)
  - Cut-out height: 279mm (11in)
  - Cut-out width: 183mm (7.2in)
  - Depth behind surface: 95mm (3.7in)
  - Protrusion: 4mm (0.2in)
  - Three-position high frequency switch
  - QuickDog fixing system
  - Pre-mount kit: PMK W6
  - Back box: BB 6W
  - Passive two-way in-wall speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
