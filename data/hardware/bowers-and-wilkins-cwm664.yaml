details: |-
  The CWM664 is a Performance Series two-way in-wall speaker, listed on the product page as a Performance two-way in-wall speaker in a White finish.

  The CWM664 is an in-wall speaker distinguished by its 25mm (1in) soft dome tweeter. It brings smoother and more detailed high frequency performance to a package that also includes a woven glass fibre 150mm (6in) bass/midrange driver and three-position high frequency switch to fine tune the sound.

  Installation is catered for by a simple and effective QuickDog fixing system. The CWM664 is an elegantly engineered and cost effective route to high quality in-wall sound.

  CWM6 Series wall mount speakers comprise a baffle carrying the speaker drivers and crossover, an integrated frame and front flange, and a magnetically secured grille. The frame is connected via side mounted terminals to the speaker cables, with the baffle connecting automatically as it is inserted in the frame. Speaker cable connects to the red and black spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then held in the aperture by QuickDogs spring clamps (six on the CWM664). The baffle carrying the drivers and crossover then fits into the frame and the grille is held magnetically.
specs: |-
  - Description: 2-way in-wall system
  - Drive units: 1x ø25mm (1in) soft dome tweeter
  - Drive units: 1x ø150mm (6in) black glassfibre cone bass/midrange
  - Frequency range (-6dB): 45Hz – 35kHz
