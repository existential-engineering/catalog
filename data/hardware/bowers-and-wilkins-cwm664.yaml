  - Sensitivity SPL (2.83V, 1m): 87.5dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame height: 315mm (12.4in)
  - Frame width: 221mm (8.7in)
  - Cut-out height: 279mm (11in)
  - Cut-out width: 183mm (7.2in)
  - Depth behind surface: 95mm (3.7in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: PMK W6
  - Back box: BB 6W
  - Three-position high-frequency switch
  - Six QuickDogs™ spring clamps, magnetically secured grille
  - Red and black spring terminals on the side of the frame
  - Finish: White
