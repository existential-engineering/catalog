url: https://www.engl-amps.com/shop/rackmount/poweramp-50-50-e840/
description: All-tube stereo 2 x 50 watt guitar power amplifier in a 2U 19 inch
  rack chassis, with four 6L6GC output tubes and switchable A/B volume and
  presence per side.
details: |-
  The 2 x 50 watts of this power amp are truly impressive. The four Type 5881 tubes, the original military version of a 6L6, offer more than enough headroom for every situation.

  The character of this tube type, rich in overtones, provides a combination of attack, heat and power. With the separate presence controls for each channel, the sound can be tweaked even more individually.

  Together with the A and B volume controls, two different volumes with different tonal characteristics can be called up, and it is all footswitchable. The E840 is the powerhouse every rack needs.
specs: |-
  - All tube stereo rack power amp
  - 2 channels per side: Left A / Right A, Left B / Right B
  - Output wattage: 2 x 50 W
  - 2 HE (2U) 19 inch rack chassis
  - Ground lift
  - Controls: Gain, A/B Volume, A/B Presence
  - Volume Left A, Volume Left B, Volume Right A, Volume Right B
  - Presence Left A, Presence Left B, Presence Right A, Presence Right B
  - Speaker output left: 1 x 8 ohm, 1 x 16 ohm
  - Speaker output right: 1 x 8 ohm, 1 x 16 ohm
  - Footswitch: ENGL Z4 (Volume A/B, Presence A/B)
  - Preamp tubes: 3 x ENGL ECC83 / 12AX7
  - Output tubes: 4 x ENGL 6L6GC
  - Weight: 12 kg
