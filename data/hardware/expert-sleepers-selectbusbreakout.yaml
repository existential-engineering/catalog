description: The Select Bus breakout provides access to the MIDI-based Select
  Bus protocol used by some Expert Sleepers modules and by a handful of modules
  from other manufacturers. With it, multiple modules can be made to save or
  recall presets at the same time, remotely controlled over MIDI.
details: |-
  The Select Bus breakout provides access to the MIDI-based Select Bus protocol as used by some Expert Sleepers modules, the disting mk4, disting EX and General CV, as well as a handful of modules from various manufacturers including the Malekko Varigate 8+, Macro Machines Storage Strip, and the Make Noise Tempi and Rene mk2.

  Using the breakout, multiple modules can be made to simultaneously save or recall presets, remotely controlled via MIDI.

  The breakout can be used either to drive the Select Bus, or to output the bus messages as MIDI. The Select Bus is not a multi-master specification, so if another module is driving the bus, the breakout can only work in the latter mode. When the breakout is driving the bus, its output is effectively a MIDI Thru.

  The module was created quite early in the history of the Select Bus, and the most common electrical implementations have changed somewhat since then. As sold, it is compatible with the disting mk4 and older modules by other manufacturers. With the disting EX it can be used to receive from the Select Bus, but not to drive it.

  Full disting EX compatibility requires three component changes: resistor R4 goes from 470R to 33K, resistor R7 from 10K to 680R, and diode D1 is removed.
specs: |-
  - Access to the MIDI-based Select Bus protocol
  - Can either drive the Select Bus or output the bus messages as MIDI
  - Output is effectively a MIDI Thru when the breakout is driving the bus
  - Works with the disting mk4, disting EX and General CV, plus Select Bus modules from other manufacturers
  - As sold, compatible with the disting mk4 and older modules by other manufacturers
  - With the disting EX, receives from the Select Bus but does not drive it
  - Full disting EX compatibility: R4 470R to 33K, R7 10K to 680R, D1 removed
