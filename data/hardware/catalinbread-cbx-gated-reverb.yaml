description: A gated reverb pedal that recreates the classic studio effect
  popularized in the 1980s, combining digital reverb with noise gate
  functionality. Features an overdrivable preamp, adjustable reverb lag time,
  and a full wet-dry blend control.
details: |-
  The CBX Gated Reverb from Catalinbread recreates the iconic gated reverb sound popularized in the 1970s and 1980s, most famously associated with Phil Collins. This effect became a defining sonic characteristic of that era and the CBX puts it at your feet in a compact pedal format.

  The gate operates as a function of signal strength: once the signal level drops below an adjustable threshold, the reverb tail snaps shut abruptly. This creates the distinctive chopped reverb effect rather than a natural decay, giving drums and other instruments that punchy, larger-than-life quality.

  An onboard overdrivable preamp adds harmonic richness and can push the reverb into more saturated territory. The Lag control adjusts the delay between the note's attack and the gate onset, and at extreme settings it can produce reverse-reverb-like sounds.

  The pedal runs on center-negative DC power from 9V to 18V, with 18V operation recommended for increased headroom.
specs: |-
  - Power source: center-negative DC power supply, 9 to 18 volts, capable of at least 100mA (18V gives more headroom)
  - Controls: Lag, Gate, Mix, Verb, Pre
  - Lag sets the delay between the played note and the onset of the gate
  - Gate knob fully down removes the gate from the circuit
