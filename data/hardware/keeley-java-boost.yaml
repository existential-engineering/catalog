description: A germanium treble booster voiced for 1960s and 1970s lead tones,
  with two bass-cut modes, intended for use with an amplifier already overdriven
  rather than as a clean boost. Discontinued in 2016.
details: |-
  The Java Boost is a germanium treble booster voiced for classic 1960s and 1970s tones. It is not a clean boost: as a treble booster, higher notes are amplified more than lower ones and bass is cut, in two modes, so that the following amplifier produces the distortion.

  It is intended for use with a tube amplifier already set to some overdrive or clipping, which Keeley describes as the key to the pedal. In front of a very clean amplifier at low volume the result is a thin tone, while an amplifier set on the verge of breakup or beyond gives the creamier, sustaining distortion the pedal is known for. It is not related to a Tube Screamer, a Blues Driver or any other overdrive or distortion circuit.

  A second way to use it is in front of another overdrive pedal, as the first of a two-pedal drive chain, which works even when the amplifier itself is set clean. Players without experience of treble boosters may find the pedal difficult with a high-headroom power amplifier that does not distort easily.
