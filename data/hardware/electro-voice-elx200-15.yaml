name: ELX200-15
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/elx200-15/
description: 15-inch two-way passive loudspeaker from the Electro-Voice ELX200
  Series, delivering 1200 W peak / 130 dB peak SPL through an EVS-15M woofer, a
  DH-1L titanium compression driver, and EV's Signal Synchronized Transducers
  (SST) waveguide for 90 x 60 degree coverage.
details: >-
  The ELX200-15 is the 15-inch passive model in Electro-Voice's ELX200 Series of
  portable loudspeakers. It pairs an EVS-15M 15-inch woofer with a DH-1L 1-inch
  titanium compression driver, crossed over at 1.6 kHz behind a Signal
  Synchronized Transducers (SST) waveguide that EV designs for uniform 90 degree
  horizontal by 60 degree vertical coverage.


  The cabinet is a polypropylene composite enclosure with an 18 AWG powdercoated
  steel grille, chosen to balance weight, manageability, and structural
  integrity. EV publishes over 500 hours of abuse and endurance testing for the
  series. Three M10 threaded suspension points, an integrated pole mount, and a
  three-handle design support both portable and installed use, and the speaker
  is offered in black or white.


  As a passive loudspeaker the ELX200-15 requires external amplification. Signal
  is connected via dual Neutrik NL4 Speakon connectors (one input, one parallel
  through) on the rear panel.
specs: |-
  - Configuration: 2-way passive loudspeaker
  - LF driver: EVS-15M 15-inch woofer
  - HF driver: DH-1L 1-inch titanium compression driver
  - Crossover frequency: 1.6 kHz
  - Frequency response (-3 dB): 77 Hz - 16 kHz
  - Frequency range (-10 dB): 52 Hz - 19 kHz
  - Maximum SPL (1 m, calculated): 130 dB peak
  - Power handling: 300 W continuous / 1200 W peak
  - Nominal impedance: 8 ohms (7.0 ohms minimum)
  - Axial sensitivity: 95 dB SPL (1 W @ 1 m)
  - Coverage pattern: 90 degrees H x 60 degrees V (-6 dB)
  - Waveguide: EV Signal Synchronized Transducers (SST)
  - Recommended high-pass frequency: 42 Hz
  - Connectors: Dual NL4 Speakon (input + parallel)
  - Enclosure: Polypropylene composite
  - Grille: 18 AWG steel with powdercoat
  - Suspension: Three M10 threaded points
  - Colors: Black or white
  - Dimensions (H x W x D): 710 x 423 x 384 mm
  - Net weight: 18.7 kg
  - Shipping weight: 21.4 kg
