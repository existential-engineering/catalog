description: The OctaMic II provides 8-Channel 192 kHz / 24 bit AD conversion
  with eight hi-class microphone and line pre-amplification channels, featuring
  a combination of sophisticated components and approved RME technology. It
  offers 8 balanced XLR mic/line inputs via Neutrik XLR/TRS combo jacks, with
  switches for 48V phantom power, low cut filter and phase reversal per channel.
  Amplification can be set between 6 and 60 dB. The 8-Channel AD-conversion
  operates at up to 192 kHz, with the digitized signal available simultaneously
  at the double ADAT output (S/MUX, up to 96 kHz) and at a DB-25 connector (4
  AES/EBU outputs, up to 192 kHz). The digital part can be clocked internally
  (master) and externally via word clock, AES/EBU and SPDIF. RME's
  SteadyClock(TM) ensures perfect AD-conversion by removing jitter on external
  sync-sources.
details: |-
  8-Channel Mic Preamp & AD Converter. 8 balanced XLR/TRS mic/line inputs with 54 dB gain range (6 to 60 dB). Switchable 48V phantom power, low cut filter (80 Hz, 18 dB/oct) and phase reversal per channel. LEDs for signal, clip, and phantom power. Clip Hold mode for long-term peak detection. Front-panel output level switching (-10 dBV, +4 dBu, Hi Gain +19 dBu). 8-Channel AD-conversion at up to 192 kHz, available simultaneously at double ADAT output (S/MUX, up to 96 kHz) and DB-25 connector (4 AES/EBU outputs, up to 192 kHz). Sync via word clock, AES/EBU, SPDIF, or internal. SteadyClock(TM) jitter reduction. Internal hi-performance switch mode power supply (100-240V AC), short-circuit-proof with integrated line-filter. All settings via DIP-switches on the back. Includes enhancements over the original OctaMic: improved SNR ADC 107.5 dB, improved THD especially at higher gains, optimised heat dissipation with new larger housing, internal wide range power supply with line filter, super-stable short-circuit-proof 48V phantom power.
specs: |-
  - 8 balanced XLR/TRS mic/line inputs
  - 54 dB gain range
  - Input impedance: XLR 2 kOhm, TRS 5 kOhm
  - Analog input level: from -40 dBu up to +21 dBu
  - Maximum output level: +21 dBu
  - Output impedance: 75 Ohm
  - Output level switchable Hi Gain / +4 dBu / -10 dBV
  - Signal to noise ratio (SNR): 129 dB EIN @ 150 Ohm
  - THD: < 0.0005 % @ 30 dB Gain
  - Large frequency range (200 kHz) with special EMI input filtering
  - Frequency response -0.5 dB: 5 Hz - 200 kHz
  - Hi-pass filter: 80 Hz, 18 dB/oct.
  - Line Out: 1/4" TRS (6.3 mm stereo jack), servo-balanced
  - Phantom power: +48 Volt switchable per channel
  - Internal wide range switching power supply 100-240 Volt AC
  - AD conversion SNR: >110 dB(A)
  - Supported sample rates: 28 kHz - 200 kHz
  - AD conversion THD: < 0.0003 %, < -110 dB
  - Sync Sources: AES/EBU (also SPDIF coaxial), wordclock, internal
  - SteadyClock(TM) ensures best sound quality even with jittery external clocks
  - 2 x ADAT I/O
  - 4 x AES/SPDIF Sync Input
  - 1 x AES/EBU I/O
