details: |-
  This custom shop run puts the reissued Keeley Katana Clean Boost circuit into hand-swirled Arlon Prince new old stock enclosures. Keeley first offered the hand-swirled Arlon Prince Katana in 2014, and found a box of unused cases during a facility move in 2021. Eleven units were built, each with a different finish and hand signed by Robert Keeley, and the maker notes that the aged cases may show slight imperfections while carrying the same two year warranty.

  The circuit returns to the original JFETs and component values of the first Katana, with the boost mode reworked for a more robust and clearer sound that keeps bass notes defined. The build uses modern construction methods and an aluminium control knob meant to be adjusted on the fly with a foot.

  The pedal has two modes, Pure Clean and High Gain, selected by the control knob. Pushed in, the knob acts as a volume control with a large amount of headroom on tap. Pulled out, it gives an extra 30dB of fat, harmonically rich cutting boost with some gain, which the maker describes as not quite an overdrive but closer to overdriven tube grit.

  Dual Class A FETs provide the tube-like character in a transistor design, and an internal charge pump nearly doubles the operating voltage from the 9V supply for high headroom; the input is 9 VDC maximum. The Katana circuit is Robert Keeley's first guitar effect design, which began as part of the Time Machine Boost before becoming an independent product after the original Keeley Compressor.
specs: |-
  - Eleven units built, each in a different hand-swirled Arlon Prince new old stock enclosure
  - Each unit hand signed by Robert Keeley
  - Two modes, Pure Clean and High Gain, selected by pushing or pulling the control knob
  - Knob pulled out adds 30dB of boost
  - Dual Class A FET circuit
  - Internal charge pump nearly doubles the operating voltage
  - Power: 9 VDC maximum input voltage
  - Aluminium control knob designed for foot adjustment
  - Two year warranty
