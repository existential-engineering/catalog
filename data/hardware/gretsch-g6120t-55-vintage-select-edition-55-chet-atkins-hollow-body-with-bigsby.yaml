details: |-
  Co-designed with the guitarist's guitarist, Chet Atkins, the venerable 6120 is one of the most widely heard Gretsch instruments. The G6120T-55 Vintage Select Edition '55 Chet Atkins Hollow Body with Bigsby stays true to the original design and astounding classic aesthetics.

  A pair of TV Jones T-Armond single-coil pickups creates multi-dimensional tone with plenty of articulate detail. With a Bigsby B6CBVF tailpiece, compensated aluminum bridge, Grover V98 Sta-Tite open-back tuning machines and gold hardware throughout, this Nashville is sure to satisfy any devotee of Gretsch's golden era.
