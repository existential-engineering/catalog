description: A mixer/crossfader and wavefolder module that works with the COCO
  oscillator system or standalone, featuring a five-stage wavefolder, input and
  output crossfaders, and CV control over all parameters.
details: |-
  This works with our COCO system and can also be used as a standalone module. Valley

  Valley is both a mixer/crossfader and wavefolder/timbre generator.
specs: |-
  - Five stage wavefolder
  - Input crossfader between the two inputs
  - Output crossfader between the fundamentals and folded signal
  - Odd and even harmonics
  - CV control over all parameters
  - Tuning and sync controls for connected COCO oscillators
