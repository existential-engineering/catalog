description: The LP-UNF is meant to give you everything you need from a studio
  monitor, in a package that you can set up anywhere. Specifically made for
  desktop mixing, it delivers crystal clear full range audio and a rock solid
  stereo image that doesn't compromise on output or extension.
details: |-
  The LP-UNF is specifically designed for your desk, no matter how else you're using your desk. Reflections from the drivers to the desk to your ears are accounted for, giving you a perfectly clear picture of your mix that you can rely on to translate well.

  The LP-UNF has specific settings to let you use it on stands behind your desk, on a desk away from walls, on a desk against a wall, on a desk on speaker stands away from walls, on a desk on speaker stands against a wall, on a recording desk with rack units away from walls, and on a recording desk with rack units against a wall.

  The LP-UNF uses much of the same technology as Kali's best-selling LP-6 and LP-8 V2 speakers. A 3-D imaging waveguide is employed to create a detailed, lifelike stereo image where all of the elements of the mix can be clearly perceived in space.

  The large front-firing port tube uses a unique, fluid dynamics derived shape that eliminates port noise and compression. This allows you to place the speakers against walls without worrying about adverse effects on the port's performance.

  Despite its small size, the LP-UNF's high-excursion 4.5-inch woofer packs plenty of punch, extending down to 39 Hz and allowing less than 2% distortion on the low end.
