description: The AIR LINK DW 20R is a wireless stereo receiver that works with
  the DW 20T wireless transmitter to bring audio streaming to an installed or
  portable sound system, aimed at hospitality and event spaces as well as retail
  and home audio. It has a maximum wireless range of 100 feet (30 m) and
  balanced XLR plus unbalanced 1/4" TRS outputs.
details: |-
  A high headroom design is used for the receiver's audio path, with attention to both the design process and component selection.

  An external articulated antenna supports dependable reception over a range of up to 100 feet (30 m). Multiple receivers can be deployed to provide targeted zone broadcasting, as long as each DW 20R is paired with only one DW 20T at a time, which allows unique content to be streamed concurrently across individual zones.

  The compact aluminium extrusion enclosure can be permanently installed via the included floor and wall mount brackets, or placed on a shelf on its rubber corner protectors. Connectivity is industry-standard XLR and 1/4" TRS output sockets, feeding professional mixers, amplifiers or powered loudspeakers.
specs: |-
  - Wireless stereo receiver, paired with the DW 20T transmitter
  - Maximum wireless range: 100 feet (30 m)
  - Outputs: balanced XLR and unbalanced 1/4" TRS
  - External articulated antenna
  - Pairs with one DW 20T at a time
  - Aluminium extrusion enclosure with rubber corner protectors, floor and wall mount brackets included
