details: |-
  Alive and loud, Electromatic Center Block guitars are designed for that pure and powerful Gretsch sound at high volume. The G5622 Electromatic Center Block Double-Cut with V-Stoptail features a double-cutaway maple body with chambered spruce center block for dynamic resonance, high gain power and lightweight comfort.

  Dual Black Top Broad'Tron humbucking pickups deliver chiming highs with dynamic and articulate tone for enhanced sonic punch.

  Painstakingly crafted with essential Gretsch sound, style and playability, the G5622 is offered in three stunning finishes.
