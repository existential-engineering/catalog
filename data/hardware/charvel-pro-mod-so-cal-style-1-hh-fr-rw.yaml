details: |-
  The Pro-Mod So-Cal Style 1 HH FR RW is a high-performance double-cutaway electric guitar that blends vintage 1980s Southern California styling with modern playability. The alder body wears a gloss finish in Pelham Blue (also offered in Snow White) with a 1-ply black pickguard and a licensed Fender Stratocaster headstock.

  The bolt-on maple neck features graphite reinforcement and a hand-rubbed satin urethane finish for smooth, fast playability. A 12"-16" compound radius rosewood fingerboard hosts 22 jumbo frets with white dot inlays and white side dots, while a Floyd Rose 1000 Series locking nut keeps tuning rock-solid.

  Dual Seymour Duncan Distortion humbuckers (TB-6 bridge / SH-6N neck) deliver hot, articulate output suited for hard rock and metal. The push/pull volume control activates coil splitting, paired with a no-load tone control and a 3-position blade switch for tonal versatility.

  A recessed Floyd Rose 1000 Series double-locking tremolo with locking arm, Charvel-branded die-cast tuners, and a Floyd Rose retainer bar string tree round out the black hardware appointments.
