details: |-
  The Ferrofish PULSE16 AE is a versatile and compact AD/DA converter designed for seamless integration into studio and live setups. With 16 high-quality balanced analog inputs and outputs, it ensures precise and transparent signal conversion. The PULSE16 AE offers full visual control via its front-panel displays, simplifying real-time monitoring and configuration, and its clocking options and compatibility with standard studio connections suit professional workflows in a 19 inch 1U rack form factor.

  Analog I/O is 16 balanced TRS inputs and 16 balanced TRS outputs on quarter-inch jacks, with a quarter-inch headphone output. ADAT connectivity is 4 input ports and 4 output ports, and SMUX support carries 32 channels at 48 kHz, 16 channels at 96 kHz or 8 channels at 192 kHz.

  Clocking runs from an internal high-stability clock or external sync via ADAT or word clock, with a word clock input and output on BNC connectors. Routing is per channel.

  Signal monitoring uses high-resolution front-panel displays for input and output levels along with multi-coloured LED meters, and a front-panel control knob and buttons handle navigation and setup.

  For connectivity, USB-C carries remote configuration through the Ferrofish RemoteFish software, MIDI controller commands (MIDI CC) provide remote control, and a MIDI port serves firmware updates and future features. The converter is expandable via an optional DSP stick.
specs: |-
  - 16 balanced TRS inputs (¼-inch / 6.3 mm)
  - 16 balanced TRS outputs (¼-inch / 6.3 mm)
  - Headphone Output (¼-inch / 6.3 mm)
  - 4 ADAT input ports
  - 4 ADAT output ports
  - Supports SMUX for higher sample rates: 32 channels at 48 kHz, 16 channels at 96 kHz, 8 channels at 192 kHz
  - Word Clock input and output (BNC connectors)
  - Internal high-stability clock or external sync via ADAT or Word Clock
  - Per-channel routing
  - High-resolution front-panel displays for input and output level monitoring
  - Multi-colored LED meters for clear visual feedback
  - Front-panel control knob and buttons for quick navigation and setup
  - USB-C for remote configuration via Ferrofish RemoteFish software
  - Remote control via MIDI controller commands (MIDI CC)
  - MIDI port for firmware updates and future features
  - Expandable via optional DSP stick
  - 19 inch 1U rack form factor, 19 x 50 x 4.4 cm, 2 kg
