details: |-
  A professional true diversity handheld wireless system featuring the AUDIX OM5.
  Since the mid-90s, the OM5 has become one of the most respected handheld dynamic mics in the world. Used on stage, in studios, and for broadcast applications, the OM5 has a reputation for clarity, resistance to feedback, and the ability to handle SPLs in excess of 144 dB without distortion.

  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include a rackmount kit for mounting two systems in one rack space, active directional antennas, and an antenna distribution system for up to four systems (4 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - RF frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum tuning
  - 207 pre-coordinated frequencies
  - True diversity reception
  - Handheld transmitter: H60 with OM5 dynamic capsule
  - One-touch auto clear channel scan and transmitter sync
