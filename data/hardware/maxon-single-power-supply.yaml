details: |-
  The world's first high-current digital power supply, the Power-All was specifically designed for guitar effect users by guitar effect users. The Power-All provides clean, regulated, noise-free power with an energy efficiency rating that archaic transformer-based adapters just can't match. The Power-All provides a whopping 2000 milliamps of current to meet the demands of today's complex pedalboards and digital multi-effects. The improved Power-All also features additional noise filtering circuitry and a longer, 10 foot power cable to power your pedals more quietly and effectively. As all players' needs are not the same, we are now offering the Power-All in three different configurations – PA-9S (Supply Only), PA-9B (powers 5 effects) and PA-9D (powers 11 effects). Often imitated but never matched, the Power-All 's simple-yet-ingenious kit configurations include color-coded cables that provide clear, concise connections for your effects. The Power-All system – simple, ingenious, affordable and effective – truly a Progression in Power!
