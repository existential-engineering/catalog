description: The VNET ETHERNET INTERFACE is a rack-mountable device for
  connecting a Windows PC running VNET Software to any VNET loudspeaker network.
  Capable of driving a network span up to 1 km and 50 devices, it gives the PC
  user complete control, tuning and diagnostics of all devices on the network.
specs: |-
  - Drives a network span up to 1 km
  - Supports up to 50 devices on the network
  - Connects to a Windows PC or laptop using standard Ethernet cabling
  - Interconnection between VNET devices via Cat5 cables and RJ45 connectors
  - Rugged steel enclosure with Ethercon connectors
  - Rack-mountable
