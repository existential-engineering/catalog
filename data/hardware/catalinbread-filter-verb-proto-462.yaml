description: The Filter Verb is a prototype reverb effects pedal years in the
  making, combining a fat resonant low-pass filter with a lush modulated
  chorus-verb. It features expression pedal control over filter cutoff frequency
  or chorus rate/depth, a momentary switch for room reverb activation, and an
  onboard preamp with adjustable saturation for shoegaze and
  performance-oriented tones.
details: |-
  The Filter Verb (Proto 462) is Catalinbread's second Proto Club release — a prototype reverb pedal that was shelved during the development of the Soft Focus and Soft Focus Deluxe, now finally seeing the light of day.

  At its core is a fat resonant low-pass filter that makes precise cuts to the base of a lush modulated chorus-verb. The filter cutoff can be swept manually or via expression pedal, letting you sculpt tone in real time during performance. A dedicated momentary switch activates a room reverb while engaged, adding another layer of performance expression.

  An onboard preamp (PRE control) sits before the effects chain and can be driven into saturation at higher settings, adding warmth and grit before the signal hits the filter and reverb.
