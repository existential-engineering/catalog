description: Erica Synths DIY Bassline is a fully analogue synth voice module
  for ultimate acid basslines. It features highly stable AS3340-based VCO with
  three wave-forms, a filter inspired by Erica Synths Acidbox and a unique
  feature - transistor based suboscillator. Accent provides more expression to
  the bassline by adding volume and slightly opening the VCF.
details: |-
  The DIY Bassline is a fully analogue synth voice module for acid basslines, supplied as a full build kit. It is built around a highly stable AS3340 based VCO with three waveforms, a filter inspired by the Erica Synths Acidbox and a transistor based suboscillator.

  Triangle, square and master outputs are available simultaneously, and the VCO tracks 1V/oct accurately. The lowpass and bandpass VCF and the VCA each have their own decay envelope, and accent adds expression to a line by raising the volume and opening the VCF slightly. External CV inputs cover VCO FM and VCF cutoff.

  This is a comparably complex DIY project for experienced builders. Erica Synths does not recommend it for beginners or for anyone without proper soldering and testing equipment, and the kit ships with a bill of materials, assembly documents and an assembly guide.

  The panel is 16HP wide and the module is 45mm deep. Pitch range covers C0 to C8, audio output amplitude is 10V peak to peak, CV amplitude runs from -5V to +5V, and the module draws 80mA from the +12V rail and 40mA from the -12V rail.
specs: |-
  - Full analogue circuit
  - Great 1V/oct tracking
  - Simultaneous Triangle, Square and Master outputs
  - Accent
  - Transistor-based suboscillator
  - VCF and VCA decay envelopes
  - LP/BP VCF
  - External VCO FM and VCF cutoff CV inputs
  - Pitch range: C0 to C8
  - Audio output amplitude: 10Vptp
  - CV amplitude: -5V to +5V
  - Panel width: 16HP
  - Module depth: 45mm
  - Power consumption: 80mA @ +12V, 40mA @ -12V
