description: The SC6000M's 8.5" motorized platter is where Vinyl Turntablism
  Excellence Meets Digital Performance Power! Powered by Engine OS
details: |-
  Motorized 8.5" / 216 mm metal platter driven by a brushless DC motor with adjustable torque delivers a true vinyl feel for turntablism and scratching on a standalone digital media player.

  10.1" HD multi-touch display offers gesture-based navigation of waveforms, libraries, and on-board crate management, while dual-layer playback lets a single SC6000M act as two players for back-to-back mixing without a second deck.

  Engine OS powers the standalone workflow with fast track loading, harmonic mixing with key match/shift, best-in-class timestretch, and 8 RGB performance pads for cues, loops, rolls, and slicer functions.

  Built-in Wi-Fi plus a hardwired Ethernet LINK port enable cloud streaming from Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, and Dropbox, with StageLinq for tight integration with Prime mixers and lighting/video software.

  Media options include an internal 2.5" SATA drive bay, an SD card slot, three USB Type-A ports for thumb drives (two rear USB 3.0 / one front USB 2.0), and a USB Type-B port for controller mode with Serato DJ Pro and VirtualDJ.
specs: |-
  - Analog Output: 2.0 Vrms (0 dBFS, 1 kHz)
  - Signal-to-Noise Ratio: 116 dB
  - Distortion (THD+N): < 0.0015%
  - Frequency Range: 22 Hz to 22 kHz
  - Digital Output: 96 kHz / 24-bit
  - Platter: 8.5" / 216 mm metal motorized platter with brushless DC motor and adjustable torque
  - Main Display: 10.1" / 257 mm diagonal, full-color LED-backlit touchscreen
  - Power Connection: Locking IEC
  - Power Input: 110-240 VAC, 50/60 Hz
  - Dimensions: 319.5 mm x 463.3 mm x 151.17 mm (12.6" x 18.2" x 6")
  - Weight: 7.01 kg / 15.4 lbs (without USB and power cable)
  - Supported File Systems: exFAT, FAT32
  - Supported Audio Formats: AAC/M4A, AIF/AIFF (44.1-192 kHz, 16-32-bit), ALAC, FLAC, MP3 (32-320 kbps), MP4, Ogg Vorbis, WAV (44.1-192 kHz, 16-32-bit)
