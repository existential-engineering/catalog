description: Single 31-Band Graphic Equalizer with exceptional sound and rugged
  reliability for touring, studios, and audio installations.
details: |-
  The dbx 131s is a single-channel 31-band 1/3-octave graphic equalizer designed for the most demanding sound reinforcement environments. It features ±12 dB input gain, switchable ±6 dB or ±12 dB boost/cut range, 20mm nonconductive sliders, and intuitive controls.

  With an extended frequency response from 10Hz to 50kHz and 110+ dB dynamic range, the 131s delivers exceptional audio quality. It includes a front panel bypass switch, 4-segment LED level monitoring, and both XLR and TRS inputs/outputs for flexible integration.

  The S Series update improved dynamic range to 112dB, added a universal 100-240VAC power supply, and incorporated newer component technology for reduced noise and improved sonic integrity. Recommended for portable and touring applications where reliability is essential.
specs: |-
  - Single 31-band, 1/3-octave Constant Q frequency bands
  - Switchable ±6 or ±12dB boost/cut ranges
  - 12dB per octave, 3dB down @ 50Hz low-cut filter
  - Front panel bypass switch
  - ±12 dB input gain range
  - 4-segment LED ladders for output level monitoring
  - XLR and TRS Inputs and Outputs
  - Frequency Response: <10Hz to >50kHz (+0.5/-3dB)
  - Dynamic range: Typically >112dB
  - Signal to Noise Ratio: Typically >95dB
  - THD+Noise: <0.003%
  - Interchannel Crosstalk: <-90dB (20Hz-20kHz)
  - Input Impedance: Balanced 40k ohm, unbalanced 20k ohm
  - Output Impedance: Balanced 100 ohm, unbalanced 50 ohm
  - Max Input: >+21dBu balanced or unbalanced
  - Max Output: >+21dBu balanced/unbalanced into 2k ohm or greater
  - CMRR: >40dB, typically >55dB at 1kHz
  - Bandwidth: 20Hz to 20kHz (+0.5/-1dB)
  - Operating Voltage: 100-240VAC 50/60Hz
  - Power Consumption: 15W
  - Unit Weight: 4.8 lbs (2.2 kg)
  - Dimensions: 1.75" H x 6" D x 19" W
