description: BTFLD (Bit Fold) is a distortion, wavefolder, and four-bit
  asynchronous analog to digital converter module. It can act as a distortion or
  wavefolder effect at audio rate, or generate rhythms and gates from envelope
  or LFO inputs.
details: |-
  BTFLD (Bit Fold) is a distortion, wavefolder, and four bit asynchronous analog to digital converter. The folding output at audio rate provides a hard sync like timbre in a unique sawtooth wavefolder circuit. The stepped output is a type of bit crushed effect and the bit outputs provide different frequency divisions or distortions. Rhythms can also be generated by putting envelopes or LFOs into the input and using the bit outputs as gates. It can also be paired with the rest of our four bit binary system (Nibbler, BTMX) for experiments in four bit computing and unusual logic based patching. Quickstart Guide

  Manual

  Features
specs: |-
  - 6 related outputs
  - Unique wavefolding circuit
  - Switched range for bipolar audio signals or unipolar modulation signals
  - Acts as distortion/wavefolder or rhythm generator depending on input
  - 4 bit binary output interfaces with other logic modules
  - LED indication for every input and output
  - 6 HP
  - Skiff friendly 28mm depth (35mm including cables)
  - POWER DRAW: +12V 70mA, -12V 50mA
