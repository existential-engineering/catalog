description: >-
  The Future Retro 777 is a monophonic analog synthesizer with a built-in digital
  sequencer, combining two VCOs, a switchable 3/7-pole filter, and extensive modulation
  capabilities in a compact desktop format. Designed for bass sequencing and live sound
  manipulation, it functions as both a standalone instrument and a MIDI-controllable sound
  module. An internal MIDI-to-CV/Gate converter bridges modern and vintage gear.
details: |-
  The 777 goes beyond simple TB-303 emulation to realize the full potential of a monophonic pattern-based synthesizer. Its analog signal path features two oscillators producing sawtooth or square waves, a sub-oscillator, white noise generator, and FM capabilities. The oscillators can modulate each other for complex timbral results, while the layout remains as intuitive as classic instruments like the SH-101 or MC-202.

  The filter section offers switchable 3-pole or 7-pole slopes for a wide range of tonal character, from subtle to extreme. Filter cutoff can be modulated by the sequencer, oscillator B, or the decay envelope, and an external audio input allows routing outside signals through the filter. A smart accent effect adds rhythmic emphasis to basslines.

  The digital sequencer supports 256 patterns of 12 or 16 steps each, linkable into 16 songs with up to 3,580 measures per song. Notes are entered via pseudo-keyboard buttons, and all real-time parameter edits can be recorded into sequences and controlled via MIDI. An internal MIDI-to-CV/Gate converter bridges modern and vintage gear.

  Additional features include glide and portamento effects, distortion, chorus, and phase effects. The 777 has been used by BT, KMFDM, and Sense Datum.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (saw or square), white noise generator, sub-oscillator, FM
  - Filter: Lowpass resonant with switchable 3-pole or 7-pole slope
  - LFO: Limited modulation routing
  - Sequencer: 256 patterns (12 or 16 steps), 16 songs (3,580 measures per song)
  - Effects: Distortion, chorus, phase
  - Control: MIDI + CV/Gate
  - Date produced: 1998
