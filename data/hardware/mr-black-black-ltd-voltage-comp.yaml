url: https://www.mrblackpedals.com/products/black-ltd-voltage-comp
description: A responsive, high-headroom compressor built around a proprietary
  voltage-controlled amplifier, for clean, natural sustain on guitar and bass. A
  Jack Deville limited run of 48 pieces.
details: |-
  The Black LTD. Voltage Comp. is a responsive, high-headroom compressor built
  around a proprietary voltage-controlled amplifier. It works with both active and
  passive guitars and basses, delivering clean, natural sustain and smooth
  compression.

  An Attack Speed control provides a wide range of transient response, from heavy
  squish to a lightning-fast response that yields natural, transparent sustain. A
  wide compression range, generous output and well-matched impedances make it easy
  to place anywhere in a guitar or bass signal chain.

  The pedal can be run at up to 12VDC for even lower noise and additional headroom.
  Jack Deville original design, limited run of 48 pieces.
specs: |-
  - Proprietary voltage-controlled amplifier (VCA) compression
  - Attack Speed control for wide transient range
  - Works with active and passive guitars and basses
  - Matched impedances for flexible chain placement
  - Runs on 9VDC, up to 12VDC for lower noise and more headroom
  - Limited run of 48 pieces
  - Jack Deville original design
