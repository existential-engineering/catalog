details: |-
  JIMS 800 pays tribute to classic, guitar-driven rock. So, brace yourself as an unparalleled rock guitar tone gets up in your face!  Harnessing the cutting-edge TC Ampworx component-based modelling technology, we've successfully encapsulated the prowess of a glorious and iconic guitar head from the 80’s – all within a compact pedal. You’ll get the power of that era's unmistakable guitar tone right at your feet.  However, our commitment to delivering the ultimate guitar-hero experience went beyond merely reproducing the sound. We took great care to preserve the pedal's authentic look and feel, remaining true to the original amplifier. Every detail, from the control layout to the overall design, has been meticulously crafted to evoke nostalgia, as well as give an intuitive and familiar interface.  But why stop there? Why not enhance the guitar-playing experience without compromising the original tone and vibe? Well, we added a few ingenious additions that will enhance life for guitarists, uniting the best from the original amp with added modern and versatile features.

  Modeling One Amp. But Perfectly!

  When it comes to digital amp modeling, there are numerous approaches. However, our focus was on merging accuracy and simplicity. JIMS 800 is dedicated to emulating a single iconic amp, rather than overwhelming you with an array of countless amp models and versions.   The goal was to capture the essence and sonic characteristics with remarkable precision that is guaranteed to ignite inspiration. It was also a high priority to add an intuitive control layout that lets you navigate effortlessly. So, we eliminated unnecessary complexities, which enables you to focus wholeheartedly on what truly matters: playing!  In other words, your gain is a perfect balance of accuracy and simplicity, empowering you to fully immerse yourself in your musical expression.

  Dual Channel or Stompbox

  The first time you plug into JIMS 800, it’ll be in Dual Channel mode. In this mode, the pedal is always on, allowing you to easily switch between the two channels and access their distinct sonic profiles, exactly as it was in the original amp.  But if you’re more into the classic stompbox experience, we also made a Bypass Mode available. This mode simply allows you to toggle the pedal on and off, and in this scenario, you choose which of the two channels you want to punch in and out of your signal chain.  Whether you opt for the versatile Dual Channel mode or the familiar simplicity of the Bypass Mode, JIMS 800 delivers uncompromising performance power. The choice is yours – there’s never just one correct way to rock out!
