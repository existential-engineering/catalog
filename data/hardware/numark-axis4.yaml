description: Tabletop CD player with two seamless loop points, three hot stutter
  starts, tap-in BPM counter, anti-shock, fader/remote start, and S/PDIF digital
  output.
details: |-
  The Axis 4 tabletop CD player offers professional features at an introductory price. The two seamless loop points and three stutter starts allow for endless creative options. An included tap BPM counter simplifies beat-mixing, while features like fader start encourage the user to take his skills to a new level of performance.

  The durable steel enclosed unit has been meticulously crafted with life-extending features such as a laser shutoff mode and auto-retractable media trays. The Numark AXIS 4 offers substantial value in a unit that is sure to inspire the aspiring.
specs: |-
  - 2 seamless loops with 3 hot stutter starts
  - Anti-Shock
  - Tap-in beat (BPM) counter
  - True continuous play, track sequence programmable
  - Fader/remote start & relay
  - Sleep mode
  - Digital output (S/PDIF)
  - Durable steel enclosure
  - Laser shutoff mode
  - Auto-retractable media tray
