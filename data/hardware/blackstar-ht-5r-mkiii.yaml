url: https://blackstaramps.com/ht-5r-mkiii/
description: Inspiration from practise to performance. HT MK III series offer
  low wattage valve performance for home and studio recording.
details: |-
  The HT-5R MK III takes the revered design from the award-winning MkII series to new heights with incredible performance, gorgeous looks and game-changing new features from improved voicings to the addition of our IR-based CabRig™ speaker simulator software.

  Alongside providing capture-ready valve tones at any volume, the HT-5R MK III comes equipped with a direct USB-C output which can send 2 channels (left and right) to your DAW, ensuring the easiest way to capture authentic valve tone in recordings without the need for an interface.

  The best part? These amps have in-built load protection, meaning you can use them without a cabinet connected for silent practice and recording.

  CabRig™, our class-leading IR-based speaker simulator comes as standard in the HT-5R MK III, offering hundreds of different cabinet, mic, and room combinations. Save your favourites to three presets for easy access directly from the amplifier. Get premium valve tones into your headphones, monitors and mixes.

  ‘HT’ stands for ‘High Tension’ and refers to the high voltages used in valve circuits like HT MK III. The HT name goes back to the very beginning of Blackstar and our first products: the HT valve pedals.
specs: |-
  - Wattage: 5W
  - Valves: ECC83 Preamp, 12BH7 Power Amp
  - Channels/Voices: 2 Channels, 2 Voices Per Channel
  - Footswitchable: Yes - Channels & Voices
  - Speakers: 1x 12" Blackstar Designed
  - Reverb: Yes (studio quality)
  - CabRig Output: Yes (USB-C, Balanced XLR & Jack)
  - Effects Loop: Yes
  - USB Recording: Yes (USB-C)
  - Power Reduction: Yes (down to 0.5W)
  - Weight: 12.4kg
  - Dimensions: 441 x 410.5 x 249 mm
  - In-built load protection (no cab required for silent practice/recording)
  - IR-based CabRig™ speaker simulator with 3 amp presets
  - Patented Infinite Shape Feature (ISF) tone control
