description: A fuzz pedal with interacting controls creating gated and
  oscillating fuzz tones, from distorted guitar sounds to total noise
  oscillation.
details: |-
  A TRUE FREAK OF A PEDAL The Supersonic Fuzz Gun is a completely unique take on a fuzz pedal made with the extremes of manipulation in mind. The controls interact with one another to create a huge array of gated and oscillating fuzz sounds. It can scream, it can blast, it can implode, it can doom, and it can gloom. Possible sounds vary from (relatively) straightforward distorted guitar to shards of total insanity. This pedal is well at home making its own howls, chirps, growls, and sputters - harness the unruliest electric destroyer we make with the Supersonic Fuzz Gun. Controls Bias Biases the output transistor to change the overall sound structure Density Increases the Q range input into the fuzz while also adjusting the oscillation frequency in Osc. mode Fuzz Increases the intensity of the output Filter Sweeps the high frequencies of the output Level Controls the output volume of the effect. Gate/Oscillation Toggle In Gate mode, the fuzz tone is more standard and gated. In Oscillation mode, the signal self-oscillates for noisemaking and bizarre fuzz tones Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 2 mA Physical Details Dimensions: 4.72" x 3.84" x 2.06" (including hardware) Weight: 13 oz.
