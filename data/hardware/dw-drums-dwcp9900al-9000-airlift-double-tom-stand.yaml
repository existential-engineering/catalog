description: This AirLift version of the 9900 double tom stand makes adjusting your rack toms easier.
details: |-
  Adjusting rack toms just got easier. With advancements in drum manufacturing and hardware design, everything seems to weigh more these days, from counter hoops to metal shells and lugs, so making a simple height adjustment on toms or snare drums has become a challenge.

  The secret of AirLift hardware is a pneumatic shock that effortlessly allows drums to float on a cushion of air for quick, effortless, and exact adjustments every time. The patented, Randall May-designed system is available in DW's top-selling, road-proven 9300 snare stands and 9900 tom stands.

  Every piece of the AirLift hardware series is equipped with an internal pneumatic shock to expedite kit setup and height adjustments.
specs: |-
  - Double tom stand with heavy duty tubing and robust features
  - Patented AirLift system with pneumatic shock for effortless adjustment
  - Randall May-designed AirLift system
