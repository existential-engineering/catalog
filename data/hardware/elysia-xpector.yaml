description: xpector is the perfect monitoring solution for artists and
  engineers in any recording situation. A headphone amp with advanced monitoring
  functions.
details: |-
  The xpector is a dual headphone amplifier built around two high-end headphone amplifiers with features tailored to the engineer's and the artist's specific needs during recording. Two stereo inputs, Direct and DAW, feed the corresponding mix controllers on the front panel, so engineer and artist can each adjust their levels and their own mix independently.

  Beyond headphones, the xpector also works as a monitor controller. Balanced XLR outputs connect powered speakers or studio monitors, and several monitoring modes are available to give a better understanding of dimension in a mix. The artist's headphone path carries dedicated tone control with a high- and low-shelf equalizer, and both headphone outputs have large level controls.

  Mirrored headphone outputs for the engineer and the artist sit on the back panel alongside the XLR outputs, the stereo Direct and DAW inputs and the Loop outputs. The Loop outputs can feed the output signal of a preamp connected to the Direct input on to an interface, or daisy-chain several xpector units so that each musician controls their own mix of the two stereo sources.

  elysia designed a super-low noise internal power supply specifically for the xpector. The unit is built into the qube chassis, the company's ultraportable format for analog audio processing hardware, with a custom backplate: elysia states that the in- and outputs needed for a dual headphone amplifier without compromises cannot be offered by the 500 Series format, so the qube backplate carries 12 audio connections.

  The application examples on the product page cover mixing and audiophile listening, using an external preamp for latency-free monitoring, cascading multiple xpector units for separate mixes out of two stereo sources, and cascading for latency-free direct monitoring in addition to a shared stereo mix. The xpector is manufactured in Germany.
specs: |-
  - Two independent high-end headphone amplifiers with large level controls
  - Stereo Direct and DAW inputs feeding separate front-panel mix controllers
  - High- and low-shelf equalizer on the artist headphone path
  - Balanced XLR outputs for use as a monitor controller
  - Loop outputs for daisy-chaining multiple units
  - Selectable monitoring modes
  - 12 audio connections on the back panel
  - Super-low noise internal power supply
  - Frequency response: below 10 Hz to 400 kHz (-3.0 dB)
  - Level, input: +22 dBu
  - Level, XLR outputs: +22 dBu
  - Impedance, input: 45 kOhm
  - Impedance, output: 0.09 Ohm
  - Max output power at 22 ohms: 2 x 150 mW (RMS)
  - Max output power at 600 ohms: 2 x 150 mW (RMS)
  - Dimensions (W x H x D, incl. knobs): 104 mm x 137 mm x 212 mm (4.1 in x 5.39 in x 8.4 in)
  - Weight: 1.46 kg (3.17 lbs)
  - Power consumption: 9 Watts
