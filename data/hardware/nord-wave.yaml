description: >-
  The Nord Wave by Clavia combines analog, wavetable, FM synthesis, and sample
  playback into an 18-voice polyphonic performance instrument with 180 MB of
  flash memory for user-loadable samples and a quick-booting sample RAM
  architecture.
details: |-
  Clavia designed the Nord Wave as a performance instrument offering 18 notes of polyphony. The Wave allows users to quickly swap between two related sounds or layer them using two slots available to each patch. Although reverb, tube simulation, and delay are global, EQ and chorus settings can be adjusted for each slot independently.

  Control is handled via Slot A and B buttons situated close to the pitch stick, mod wheel, and octave-switching buttons. The Nord Wave offers 1024 patches spread across eight banks of 128 patches each, three of which are filled by Clavia with factory presets.

  Sample data is stored in flash memory, giving users the ability to easily and quickly replace whatever they want. While the 180 MB sample memory is modest compared to more recent synths, it makes use of a lossless compression algorithm to maximize capacity.

  Clavia ensured a vast palette of sounds by combining analog, wavetable, and sampled waveforms as well as FM synthesis. The Nord Wave incorporates six different filter types, ranging from standard low-pass, high-pass, and band-pass filters to a multi-peak filter. Notable limitations include the lack of an arpeggiator, a cap of 99 instruments loaded at once, and no split-keyboard or MIDI Thru.
specs: |-
  - Polyphony: 18 voices
  - Multitimbral: 2 parts
  - Waveforms: Pulse, Triangle, Saw, Sine
  - Filters: 6 types of single or multi-mode filters with Frequency, Resonance, Keyboard Tracking and Envelope control
  - LFO: 2 LFOs with square, inverted saw, triangle, random and soft random
  - Effects: Tube-style Overdrive, Stereo Delay with tap-tempo, Reverb with 5 algorithms
  - Keyboard: 49 keys, velocity and aftertouch sensitive
  - Memory: 180 MB Flash Memory, 1024 patches
  - Control: MIDI In/Out
releaseDate: "2008"
