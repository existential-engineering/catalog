description: >-
  The Yamaha CS-15 is a monophonic/duophonic analog synthesizer from the late 1970s
  featuring two voltage-controlled oscillators and a pair of multimode filters. Its dual
  12 dB/octave filters with flexible routing and multiple envelope generators deliver a
  distinctive sound suited for experimental bass, leads, and textural effects. The CS-15
  was used by artists including The Human League, Vince Clarke, and Astral Projection.
details: |-
  The CS-15 represents Yamaha's commitment to analog synthesis during the late 1970s, when such instruments were becoming increasingly sophisticated. Built with substantial build quality and numerous hands-on controls, the synthesizer earned recognition among experimental and electronic music pioneers.

  The instrument's defining characteristic lies in its dual multimode filters, which can operate independently or in tandem. These 12 dB/octave filters switch between lowpass, bandpass, and highpass modes and can be routed flexibly to various envelope generators with either positive or negative voltage control. This routing flexibility enables complex timbral possibilities unusual for synthesizers of its era.

  The CS-15 also features a noise generator, external audio input, individual auto-bend for each VCO, and dual CV/Gate inputs for external control. Its accessible price point combined with substantial sonic capabilities made it attractive to both professionals and enthusiasts seeking to explore analog synthesis.

  Notable users include Astral Projection, Somatic Responses, Moog Cookbook, The Human League, and Vince Clarke.
specs: |-
  - Polyphony: Monophonic/Duophonic (with external CV control)
  - Oscillators: 2 VCOs per voice
  - Filters: 2 multimode VCFs (12 dB/octave, LP/BP/HP switchable)
  - LFO: 1 with triangle, sawtooth, and sample-and-hold waveforms
  - Keyboard: 37 keys
  - Memory: None
  - Control: Dual CV/Gate inputs
  - Additional features: Noise generator, external audio input, individual auto-bend for VCOs, brilliance slider
