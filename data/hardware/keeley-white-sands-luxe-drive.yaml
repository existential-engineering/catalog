description: Low gain overdrive using asymmetrical clipping, with a tone network
  that leaves the mid-range unboosted and keeps bass response tight.
details: |-
  The White Sands Luxe Drive is Keeley's low gain overdrive, voiced after the slight rounding of tone heard as a tube amplifier begins to be pushed. It uses asymmetrical clipping, distorting one half of the guitar signal more than the other to approximate some of the behaviour of a tube amplifier, and the clipping stage is arranged to keep bass frequencies tight rather than muddy under distortion.

  Its tone control network differs from Keeley's Red Dirt Overdrive in that it does not boost mid-range frequencies, so the Tone control works over a narrow but useful range for setting high end response. The pedal is presented as a transparent drive that can stay close to the guitar's own tone, including with humbucking neck pickups.

  Sandy Mode provides the higher gain setting for a smoother, more saturated drive. A JFET input buffer, shared with the Red Dirt and the Seafoam chorus, is used to avoid loading down the pickups.

  The page places the pedal between the Katana and the Red Dirt in Keeley's line-up. Each unit is hand built in Edmond, Oklahoma, USA, and the page notes a build-to-order lead time.
