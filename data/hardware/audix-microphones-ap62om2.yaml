details: |-
  A professional true diversity handheld wireless system featuring the AUDIX OM2.
  The OM2, our best-selling vocal microphone, has slight bass proximity, a tailored mid-range, and a full-bodied sound. Ideally optimized for small to mid-size PA systems, the OM2 is a workhorse microphone known for its excellent isolation on stage, outstanding feedback rejection, and ability to handle high sound pressure levels without distortion.
  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include active directional antennas and an antenna distribution system for up to four systems (8 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - RF frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum tuning
  - 2560 tunable frequencies
  - True diversity dual-channel reception (R62 receiver)
  - Handheld transmitter: H60 with OM2 dynamic capsule
  - One-touch sync links transmitter to receiver via infrared
