details: |-
  The T1 Uke represents a tenor-sized instrument designed for environmentally conscious players. It features construction entirely from FSC-certified sustainable woods, including sapele top, back, and sides paired with an ebony fingerboard and bridge. An applied dovetail sipo neck provides structural stability.

  This model includes upgraded Ratio tuning machines for precise, fast tuning — a standout enhancement for Martin ukuleles. The hand-rubbed satin finish delivers a smooth, natural aesthetic.

  The instrument produces warm, full, and clear tone with smooth playability. It arrives with a gig bag constructed from 100% recycled post-consumer polyester in bold blue.
