details: |-
  JHS Pedals is proud to present the Whitey Tighty compressor, their take on the classic effect that no one may ever know is on, but when it's off you feel like your pants are down. The Whitey Tighty is as simple as it gets while never getting in the way. At only 1" x 3", it saves pedal board space while still delivering studio-quality compression.

  The Whitey Tighty is a FET compressor with three simple controls: Volume, Compression, and Blend. The Volume control sets your volume at unity gain or slightly boosted to compensate for any perceived volume loss from compression. The Compression knob controls the amount of compression, from subtle smoothing to a pleasing squash perfect for country, blues, pop, and rock. The Blend knob dials in the right amount of clean tone alongside the compressed signal, retaining the natural feel of your clean tone while adding studio-quality compression.
