name: Ibis
manufacturer: crane-song
primaryCategory: equalizer
url: http://cranesong.com/ibis.html
description: Ibis is a four-band discrete Class-A analog equalizer whose
  switch-selectable frequencies are labeled by musical note name as well as
  frequency, translating between musician-speak and engineer-jargon. Each
  overlapping band spans 32-Hz "C" to 22.35-kHz "F" with adjustable bandwidth
  and an adjustable "color" harmonic-distortion function.
details: |-
  Ibis is an analog equalizer that boldly takes equalization to a new level of musicality. Each of its four bands features switch-selectable frequencies centered on and covering musical-step intervals from 32-Hz "C" to 22.35-kHz "F." Its four overlapping bands are labeled with note names and frequency, allowing for the first time a "translation" between musician-speak and engineer-jargon. The bandwidth control has similar notation with adjustment from 0.2 octave to 4 octaves per band and a boost/cut range of 12 dB.

  The low-cut filter is switch selectable from 20-Hz to 150-Hz with slopes of either 12-dB or 24-dB per octave. Like most Crane Song products, Ibis utilizes discrete Class-A circuitry and features a truly unique and adjustable "color" function that can be applied to either the entire audio path or to any individual frequency band. A fully stepped mastering version is also available.

  Per the operator's manual, each band offers 24 switch-selectable frequencies (96 total across the four overlapping bands), with a +1 step button that shifts a band up one musical step and shelving buttons available on the low and high bands. A dead zone of about +/-0.3 dB on the boost/cut control makes it easy to set a band flat.

  Interfacing is floating, balanced XLR on both input and output, with a maximum level of +25 dBm. The unit runs on 100, 120, 230, or 240 volts at 50/60 Hz, draws 55 watts, and occupies 2 rack spaces at 19 lbs (8.6 kg).
specs: |-
  - 4-band discrete Class-A analog equalizer
  - 24 switch-selectable frequencies per band, 96 total across overlapping bands, labeled by musical note and frequency
  - Boost/cut range: +/-12 dB per band (standard version)
  - Bandwidth: 0.2 to 4 octaves per band (Q range 0.15 to 17)
  - Low-cut filter: 20 Hz to 150 Hz, switchable 12 dB/octave or 24 dB/octave (steep) slope
  - Adjustable "color" function (additive 2nd/3rd harmonic distortion), applicable to full signal path or per band
  - Input: floating, balanced XLR, maximum +25 dBm
  - Output: floating, balanced XLR, maximum +25 dBm
  - Noise: -85 dBm (EQ flat, bandwidth controls at max)
  - Distortion: 0.001% (EQ flat, measured at +20 dBm)
  - Power: 100/120/230/240V, 50/60 Hz, 55 watts
  - 2 rack spaces (2U), 19 lbs (8.6 kg)
  - Fully stepped mastering version available
