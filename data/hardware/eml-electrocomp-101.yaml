description: >-
  The EML ElectroComp 101 is a patchable semi-modular analog synthesizer
  featuring four oscillators and duophonic capability, manufactured by
  Electronic Music Laboratories from 1972 to 1982. It uses an ARP 2600-style
  pre-wired voice path overridable with quarter-inch patch cords, housed in a
  portable wooden enclosure. Its op-amp-based circuitry provided superior tuning
  stability compared to transistor-based competitors from Moog and ARP.
details: |-
  The ElectroComp 101 succeeded the rare ElectroComp 100 and became EML's longest-running product, manufactured from 1972 through 1982. Like the ARP 2600, it features a pre-wired voice path that can be overridden using quarter-inch patch cords, combining the convenience of a normalized signal flow with the creative flexibility of modular patching.

  Four oscillators form the core of the instrument, two of which can operate at sub-sonic frequencies for use as LFOs. Each oscillator provides multiple waveforms controllable via rotary knobs, and the instrument supports duophonic playing for two simultaneous notes. EML's signature op-amp design delivers superior stability compared to the transistor-based circuits used by Moog and ARP, eliminating the temperature drift issues common to competing instruments.

  The synthesis architecture includes a voltage-controlled 12dB per octave multimode filter with resonance and switchable lowpass, bandpass, and highpass modes, dual ADS envelope generators, a ring and amplitude modulator, noise generation, and sample-and-hold functionality. The design makes no distinction between control voltage and audio signal paths, enabling highly flexible routing.

  Originally marketed to educational institutions and universities, the 101 quickly found mainstream adoption. Its four-oscillator architecture and elaborate patch control made it one of the most flexible portable patch-synthesizers available, attracting artists including Skinny Puppy, Tommy Mars, Download, Weezer, Foreigner, and Ohm.
specs: |-
  - Polyphony: Duophonic
  - Oscillators: 4 VCOs (2 sub-sonic capable, multiple/variable waveforms + noise)
  - LFO: 2 (via sub-sonic oscillators)
  - Filter: 12dB/oct voltage-controlled multimode with resonance (lowpass, bandpass, highpass)
  - Envelope: 2 ADS envelope generators
  - Effects: Ring/amplitude modulator, sample-and-hold
  - Keyboard: 44 keys
  - Memory: None
  - Control: CV/Gate
