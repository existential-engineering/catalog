description: The Bricasti Design M10 is a dedicated hardware remote controller
  for the M7 and M7M stereo reverb processors, capable of controlling up to 8
  units simultaneously via RS422 serial interface. Milled from solid anodized
  aluminum with the same interface as the M7, and powered directly from the M7
  through the cable.
details: |-
  The Bricasti Design Model 10 remote console is a dedicated hardware remote
  controller for use with the M7 stereo reverb processor. Following the same
  design criteria as the M7, the M10 casing is manufactured and milled from
  solid anodized aluminum, for an enduring design and long life.

  The M10 is designed to be simple to use and easy to interface, utilizing a
  standard RS422 serial interface. In application, it can be very useful when
  using more than one M7, or when there is a need to be in the sweet spot when
  making adjustments in a large mixing environment.

  The unit controls 1–8 M7/M7M reverb processors and connects to the first M7
  via an RS422 9-pin serial cable (10-meter cable provided), supporting up to
  30 meters with no IP addresses to configure. Additional M7 units are connected
  via simple serial loop-thru daisy chaining.

  DC power is supplied directly from the M7 through the cable — no wall adapter
  or external power supply is required. The M10 features eight level meters for
  monitoring 4 stereo pairs simultaneously.

  The M10 shares the same user interface as the M7 with the addition of Machine
  and Setup keys, so no new learning is required. Simultaneous control from
  both the M7 front panel and the M10 is supported, with a lockout capability.
specs: |-
  - Custom milled solid aluminum casing and buttons, fine finished and anodized
  - Controls 1–8 M7/M7M units
  - Connects via RS422 9-pin serial cable (10-meter cable included, supports up to 30 meters)
  - Simple serial loop-thru for daisy-chaining multiple M7 units
  - DC power supplied from M7 through cable — no external power supply needed
  - Eight level meters for 4 stereo pairs (4 machines at a time)
  - Machine key with toggle/step-through and direct access (1–4 keys) modes
  - Up/down keys to change banks and metering for more than 4 M7s
  - Same display and user interface as the M7 plus Machine and Setup keys
  - Simultaneous control from M7 front panel and M10 with lockout capability
  - Setup key for M10 local memory, configuration, and settings
