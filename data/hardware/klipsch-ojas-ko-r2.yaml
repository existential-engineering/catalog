name: kO-R2
manufacturer: klipsch
primaryCategory: speaker
url: https://www.klipsch.com/products/ojas-ko-r2-2-way-multisectoral-loudspeaker
description: A limited-edition 2-way horn-loaded loudspeaker born from a
  collaboration between Klipsch and acoustic designer Devon Turnbull of Ojas,
  handcrafted in Hope, Arkansas. Only 600 pairs worldwide, featuring a 15-cell
  sandcast-aluminum multisectoral horn, Baltic birch plywood cabinetry, and
  Klipsch heritage drivers.
details: |-
  The kO-R2 is a passive 2-way multisectoral loudspeaker developed jointly by Klipsch and Ojas founder Devon Turnbull, combining nearly a century of Klipsch acoustic engineering with Turnbull's horn-design philosophy. The enclosure is constructed from 13-ply Grade A Baltic birch plywood and is available in Spiral Oak veneer or Hammertone Gray finish, with a powder-coated matte black horn.

  The high-frequency section uses a Klipsch K-706 compression driver mounted on a 15-cell sandcast-aluminum multisectoral horn, providing 90° horizontal (±30°) and 70° vertical (±20°) coverage from 500 Hz to 20 kHz. The low-frequency section employs a Klipsch K-33-E 15-inch woofer in a vented enclosure, crossing over at 760 Hz. A 5-step high-frequency gain attenuator allows tonal adjustment at the listening position.

  The speaker achieves 97 dB sensitivity at 2.83V/1m and handles up to 300W continuous power, capable of 118 dB maximum continuous output. Each cabinet sits on anti-vibration rubber feet and is identified by a laser-engraved metal ID plate. Production is limited to 600 pairs globally.
