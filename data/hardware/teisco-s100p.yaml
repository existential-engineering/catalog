description: >-
  The Teisco S100P is a monophonic preset synthesizer from 1979 featuring 32 built-in
  sounds and a compact 37-key keyboard with assignable aftertouch. Designed as a portable
  sound module that could sit atop another keyboard, it offers quick access to generic
  sounds through preset switching beneath the keys. It was manufactured under license from
  ARP Instruments and was also sold under the Kawai brand.
details: |-
  The S100P represents a category of synthesizers that emerged in the late 1970s, competing with similar offerings from Roland (SH-2000) and ARP (Pro Soloist). It prioritizes immediacy and playability over deep editing capabilities, making it appealing to performers seeking variety without complex programming.

  The 32 preset sounds vary considerably in quality. While realistic emulation is not the S100P's strong point, the instrument excels in particular areas. The bass sounds feature a solid low end, the shakuhachi patch delivers a smooth and effective result, and the four synthesizer presets possess a pleasing rawness. The overall palette encourages creative exploration rather than straightforward realism.

  Despite its simplicity, the S100P incorporates surprising expressiveness. A spring reverb effect with adjustable level adds spatial dimension. The keyboard features assignable aftertouch with sensitivity control and simultaneous routing to pitch bend, filter, vibrato, and growl. Additional controls include a pitch-bend slider, filter brilliance adjustment, modulation rate, octave switching, and separate portamento/glissando timing. An effects section enables porta/glissando switching, hold/sustain, note repeat, and flanger.

  Teisco equipment circulated under both Teisco and Kawai branding following Kawai's acquisition of Teisco. The Teisco model features all-metal construction, while Kawai versions added wood-effect paneling. The underside bears a label indicating manufacture under license from ARP Instruments, referencing ARP's electronic aftertouch patent.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Waveforms: Pulse with PWM, saw, noise (fixed settings)
  - LFO: 1 LFO routed to effects
  - Filter: 24dB/oct lowpass; preset highpass
  - Envelopes: 2 preset ADS (VCF and VCA)
  - Effects: Spring reverb, flanger
  - Arpeggiator: Note repeat only
  - Keyboard: 37-key C-C with aftertouch
  - Memory: 32 presets
  - Control: Expression pedal for volume
  - I/O: High/low outputs, headphone jack
