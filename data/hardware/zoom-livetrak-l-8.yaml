description: Zoom LiveTrak L-8 makes it easier than ever to mix, monitor and
  record professional-sounding podcasts and music performances in one portable,
  affordable package.
details: |-
  The LiveTrak L-8 is an eight-channel digital mixer and multi-track recorder aimed at podcast production and small live performances. Six channels take XLR/TRS combo jacks with Zoom preamps, switchable +48 V phantom power and up to +54 dB of gain, channels 1 and 2 add a Hi-Z setting for instruments, and channels 3 to 6 carry a -26 dB pad. Channels 7 and 8 are stereo pairs fed from TS line jacks or from the USB return, so backing tracks can run from a computer alongside live sources.

  Six assignable Sound Pads sit beside the channel strips for intros, outros, jingles, advertisements and sound effects, with 13 preset sounds supplied. A dedicated channel takes a phone over the included TRRS cable, and the Mix-Minus function prevents echo and feedback reaching the caller. The same routing covers calls arriving over USB from software such as Skype, FaceTime, Hangouts and Slack.

  Each channel has a 3-band EQ (10 kHz shelving high, 2.5 kHz peaking mid, 100 Hz shelving low, each plus or minus 15 dB), a 75 Hz 12 dB/octave low cut and a 9-segment level meter, with a send effect bus carrying eight effect types across reverb, delay, chorus and vocal settings. Up to seven scene memories store a finished mix for instant recall.

  The recorder captures up to 12 tracks at once to SDHC or SDXC cards at 44.1, 48 or 96 kHz and 16 or 24-bit, with 10-track playback plus punch-in and overdub. Effects, EQ, overdub and audio-interface operation are not available at 96 kHz. Four headphone outputs cover three independent monitor mixes plus the main mix, each with its own level control, and balanced XLR master outputs feed a PA or monitors.

  Used as an interface the L-8 is a 12-in/4-out, 24-bit USB 2.0 device that can record to a computer and to the SD card at the same time, and it runs class-compliant for iOS and iPadOS with an Apple Lightning to USB Camera Adapter. Power comes from four AA batteries for about 1.5 hours, from a USB battery pack, or from the supplied AD-17 adapter, and the USB socket is recessed into a channel on the underside so the cable cannot be pulled out by accident.
specs: |-
  - 8-channel mixer: 6 XLR/TRS combo mic/line inputs plus 2 TS line inputs
  - Inputs: MIC/LINE x 6, LINE x 2. Outputs: MASTER OUT x 1, MASTER OUT (PHONES) x 1, MONITOR OUT (PHONES) x 3
  - MIC/LINE: XLR/TRS combo jacks (XLR 2 HOT, TRS TIP HOT), input gain +10 to +54 dB (-3 to +41 dB with Hi-Z on)
  - MIC/LINE input impedance: XLR 3 kOhm, TRS 3 kOhm (1 MOhm with Hi-Z on)
  - MIC/LINE maximum input level: -2 dBu with the -26 dB switch off, +24 dBu with it on (at 0 dBFS)
  - Phantom power: +48 V
  - LINE: TS phone jack, input impedance 10 kOhm, maximum input level +3 dBu
  - Smartphone connection jack: TRRS mini jack (4 contact, TIP L, RING 1 R, RING 2 GND, SLEEVE MIC), input impedance 10 kOhm, maximum input level +3 dBu
  - MASTER OUT: XLR jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MASTER OUT and MONITOR OUT (PHONES): standard stereo phone jacks, maximum output level 10 mW + 10 mW into 60 Ohm, output impedance 10 Ohm
  - Buses: MASTER 1, MONITOR 3, SEND EFX 1
  - Channel strip: low cut 75 Hz 12 dB/OCT. EQ HIGH 10 kHz shelving, MID 2.5 kHz peaking, LOW 100 Hz shelving, each plus or minus 15 dB. 9-segment level meter
  - Send effects: 8 types
  - 7 scene memories for storing mixes
  - 6 assignable Sound Pads with 13 preset sounds
  - Mix-Minus function for dial-in guests, with a TRRS cable included
  - Maximum simultaneous recording tracks: 12 at 44.1, 48 or 96 kHz. Maximum simultaneous playback tracks: 10
  - Recording format: WAV 44.1/48/96 kHz, 16/24-bit, mono or stereo
  - Recording media: 4 GB to 32 GB SDHC cards and 64 GB to 1 TB SDXC cards, class 10 or higher
  - Audio interface: 12-in / 4-out at 44.1 or 48 kHz, 24-bit, USB 2.0, class-compliant mode for iOS
  - Effects, EQ, overdub and audio interface are not available at 96 kHz
  - Card reader: mass storage USB 2.0 High Speed
  - Frequency response: -1 dB at 20 Hz to 20 kHz at 44.1 kHz, -3 dB at 20 Hz to 40 kHz at 96 kHz with GAIN at 3 o'clock
  - Equivalent input noise: -121 dBu or less (IHF-A) at +54 dB, 150 Ohm input
  - Display: LCD with backlight, 96 x 64 resolution
  - System requirements for audio interface mode: Windows 8.1 / 10 / 11 (32 or 64-bit), macOS 10.12 to 26, iOS 10 to 26 and iPadOS 15 to 26 with an Apple Lightning to USB Camera Adapter
  - Power: 4 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 AC adapter (DC 5 V / 1 A) or USB bus power
  - Estimated continuous recording time on batteries (44.1 kHz/16-bit/4ch to SD, 48 V off, backlight 15 sec, battery saving on, 62 Ohm headphones): about 1.5 hours alkaline, about 3 hours NiMH 1900 mAh, about 5 hours lithium
  - Power consumption: 5 W
  - External dimensions: 268 mm (W) x 282 mm (D) x 74 mm (H)
  - Weight (unit only): 1.56 kg
  - Supplied with a TRRS cable, a USB cable, the AD-17 AC adapter and a quick guide
