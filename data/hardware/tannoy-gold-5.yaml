details: |-
  The Tannoy GOLD 5 is a premium 200-watt bi-amplified nearfield studio reference monitor featuring the legendary Dual Concentric point source driver technology with over seven decades of refinement, designed for accurate, uncolored audio reproduction in recording, broadcast, and post-production environments.
specs: |-
  - Total power output: 200 watts (bi-amplified)
  - Amplifier class: Class-AB
  - LF driver: 5" Dual Concentric woofer
  - HF driver: 0.75" titanium tweeter with Tulip waveguide
  - Driver technology: Tannoy Dual Concentric point source
  - Bass port: Front-firing
  - Inputs: Continually-active XLR balanced, TRS phone jack, 3.5mm TRS (switchable L/R)
  - Controls: Input trim, bass, treble, HF trim, rear panel boundary filter switch
  - Standby: Selectable intelligent signal-sensing automatic standby mode
  - Placement: Near-wall placement supported via front-firing bass port
