description: Build full modular DIY system!
details: |-
  Erica Synths and Moritz Klein developed the mki x es.EDU series of educational DIY kits with one goal in mind, which is to teach people with little or no prior experience how to design analog synthesizer circuits from scratch. What arrives in the box is not simply meant to be soldered together and then disappear into a rack: the kits walk through the circuit design process step by step, explaining every choice and how it affects the finished module.

  Nine kits make up a fully-featured modular monosynth: a sequencer, a VCO, a wavefolder, a noise and sample-and-hold module, a mixer, a VCF, an envelope generator, a dual VCA, and an output stereo mixer with a headphone amplifier.

  Each kit comes with an extensive user manual of more than forty pages, downloaded separately, which goes deep into both the electronics behind the circuit and the fundamental principles of sound synthesis. The kits are easy to build, and the design and functionality were not compromised to make them so.

  This complete system package holds the nine kits, a DIY eurorack case built for the mki x es.EDU system with a DIY PSU, and three sets of five braided patch cables in different lengths. The kits are also sold as a set on their own, without the case and cables.
specs: |-
  - 9 DIY kits forming a complete modular monosynth
  - EDU DIY VCO
  - EDU DIY VCF
  - EDU DIY VCA
  - 2x EDU DIY EG
  - EDU DIY Sequencer
  - EDU DIY Mixer
  - EDU DIY Noise/S&H
  - EDU DIY Wavefolder
  - EDU DIY Output
  - DIY eurorack case for the mki x es.EDU system, with DIY PSU
  - 3 x braided patch cables (sets of 5 pieces) of different lengths
  - Extensive user manual per kit, 40+ pages, downloaded separately
