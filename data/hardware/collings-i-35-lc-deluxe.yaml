description: The I-35 LC Deluxe is a semi-hollow electric guitar built with a
  maple laminate top, sides, and back using a custom-laminated construction
  process developed by Bill Collings' R&D team. The laminate construction over a
  maple/spruce center block produces a drier, woodier, and mid-forward tone
  characteristic of classic semi-hollow guitars. Enhanced appointments include
  grained ivoroid bindings, custom ivoroid knobs, and pickup rings that
  distinguish it from the standard I-35 LC.
details: |-
  The I-35 LC Deluxe features a semi-hollow body construction with a maple laminate top, sides, and back over a maple/spruce center block. The body measures 15" wide x 17 5/8" long x 1 5/8" deep with a total instrument length of 40". The Honduran mahogany neck is joined via an extra-long mortise & tenon joint, topped with a rosewood fingerboard with mother-of-pearl long dot inlays, 12" radius, and medium 18% nickel-silver frets. Scale length is 24 7/8" with a 1 11/16" nut width. Electronics consist of Lollar Low Wind Imperial humbuckers wired in 50s-style through CTS 500K pots and Jupiter Vintage Yellow capacitors, with custom grained ivoroid top hat knobs and pickup rings. Hardware includes a Kluson ABR-1 bridge, Kluson Stop Tailpiece, and nickel Gotoh tuners with Collings logo. The finish is high gloss nitrocellulose lacquer with grained ivoroid binding on the body, fingerboard, and peghead, plus an ebony peghead veneer with mother-of-pearl Collings logo. Ships with D'Addario NYXL1149 strings (.011"-.049") and a deluxe hardshell case.
specs: |-
  - Body: Semi-hollow, maple laminate top/sides/back with maple/spruce center block
  - Body Width: 15"
  - Body Length: 17 5/8"
  - Body Depth: 1 5/8"
  - Total Length: 40"
  - Neck: Honduran mahogany, extra-long mortise & tenon joint
  - Fingerboard: Rosewood
  - Inlays: Mother-of-pearl long dots
  - Fingerboard Radius: 12"
  - Frets: Medium 18% nickel-silver
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Pickups: Lollar Low Wind Imperial humbuckers
  - Wiring: 50s-style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Custom grained ivoroid top hat
  - Pickup Rings: Custom grained ivoroid
  - Bridge: Kluson ABR-1 (nickel-plated zinc with retaining wire)
  - Tailpiece: Kluson Stop Tailpiece (nickel-plated zinc, steel studs)
  - Tuners: Nickel Gotoh with Collings logo
  - Binding: Grained ivoroid on body, fingerboard, and peghead
  - Peghead Veneer: Ebony with mother-of-pearl Collings logo
  - Truss Rod Cover: Grained ivoroid
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Case: Deluxe hardshell included
