  amara fingerboard, and passive P/J pickups.
details: |-
  The Spector Performer 4 is a versatile and easy to play bass designed specifically for the beginning bassist. The instantly recognizable Spector NS body outline is a joy to play, providing a uniquely comfortable and natural playing experience. The 3-piece bolt-on neck has been carefully tapered for comfort, allowing easy access to all 24 frets on the amara fingerboard.Our specially Spector passive pickups pack plenty of mid-range presence and punch for an overall professional sound. The Performer is available in four distinct high gloss finishes including Solid Black, Metallic Blue, Metallic Red, and the iconic Solid White. Whether you're looking for your or an affordable way to add a Spector to your collection, the Performer is the perfect bass for budget-minded players.
