description: >-
  The Casio VL-1, also known as the VL-Tone, is a miniature monophonic
  synthesizer and calculator hybrid released in 1979. Weighing under a pound, it
  features preset sounds, a built-in rhythm machine, and a 100-note sequencer.
  Its cheap, tinny sound became iconic through use by artists like Trio, Devo,
  and The Human League.
details: |-
  The VL-1 achieved unexpected cultural significance despite its toy-like appearance and extremely low-cost construction. Released by Casio in 1979, it was among the first affordable electronic musical instruments aimed at consumers, combining a tiny 29-key keyboard with a basic calculator.

  Its ultra-cheesy sounds were discovered and immortalized in hit songs, most notably "Da Da Da" by Trio and recordings by White Town. Beyond those acts, the VL-1's distinctive sound appears on recordings by Apollo 440, Devo, The Talking Heads, The Cars, Dee-Lite, Sting, Stevie Wonder, Vince Clarke, Beastie Boys, The Human League, and Bill Nelson. This widespread adoption transformed the device from a disposable children's toy into a recognized sound design tool with cult status.

  The VL-1 was succeeded by two variants that expanded on the original design. The VL-10 maintained identical specifications in a smaller case, while the VL-5 introduced 4-note polyphony alongside the addition of a bar-code reader feature. Production continued through 1984.
specs: |-
  - Polyphony: Monophonic (1 voice)
  - Oscillators: 1 VCO
  - LFO: Vibrato, Tremolo
  - Sequencer: 100-note sequencer, 1 pattern
  - Rhythm Machine: 10 built-in patterns (March, Waltz, Swing, Rock, Samba, Beguine, Bossa Nova)
  - Sounds: 5 presets, 1 user patch
  - Keyboard: 29 calculator-style keys, 3-position octave switch
  - Effects: None
  - External Control: None (no MIDI)
  - Power: Battery-operated
  - Built-in: Calculator, speaker
