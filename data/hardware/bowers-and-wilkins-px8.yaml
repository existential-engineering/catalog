description: Flagship noise-cancelling wireless headphone combining exceptional
  performance, premium materials, intelligent technology, and smart features.
details: |-
  The Px8 is Bowers & Wilkins' flagship noise-cancelling wireless over-ear headphone, designed to deliver reference-class sound in a portable, premium package. It combines high-end materials such as aluminum arms and Nappa leather earpads with intelligent technology aimed at audiophile listeners on the move.

  Audio is driven by 2 x 40mm dynamic full range carbon drivers, paired with 24-bit high-resolution DSP for detailed playback. Total harmonic distortion is rated at less than 0.1% (1 kHz/10mW). Bluetooth 5.2 with aptX Adaptive enables high-quality wireless streaming, with additional codec support for aptX HD, aptX, AAC, and SBC.

  Hybrid noise cancellation is powered by six microphones — four dedicated to active noise cancellation and two for telephony — alongside an ambient pass-through mode and a wear-detection sensor that automatically pauses playback when the headphones are removed.

  Battery life is rated at 30 hours of playback, with a quick-charge feature delivering 7 hours of playback from a 15-minute charge. A USB-C port serves double duty for charging and as a wired audio interface. Included in the box are a 1.2m USB-C to 3.5mm stereo jack audio cable, a 1.2m USB-C to USB-C cable, and a carry case.

  The Px8 integrates with the Bowers & Wilkins Music app and supports streaming services including Deezer, Last.FM, Qobuz, TIDAL HiFi Plus, and Pandora.
