details: |-
  Px8 is sold as the Bowers & Wilkins flagship noise-cancelling wireless over-ear headphone, presented as the combination of exceptional performance, premium materials, intelligent technology and smart features, with luxury finishes intended to complement the sound quality.

  The Px8 combines a 24-bit DSP with fine Nappa leather detailing, and Bowers & Wilkins credits precisely angled Carbon Cone drivers with enhanced stereo imaging, reduced distortion and improved clarity. The specifications give the drive units as two 40mm dynamic full-range carbon drivers.

  The Px8 uses aptX Adaptive wireless technology, powerful Digital Signal Processing and proprietary noise cancellation with six microphones, for 24-bit high-resolution sound and clear calls. Those six split into four microphones for ANC and two for telephony, and the technical features are Hybrid Noise Cancellation, Ambient Pass-Through and a wear-detection sensor.

  The 'Comfort, for longer' section describes light, stiff aluminum arms, Nappa leather and memory foam earpads, and diamond-cut bright metal detailing. The headphone weighs 320g without its carry case, and the case measures 189mm (w) x 63mm (d) x 233mm (h).

  Wireless streaming is Bluetooth 5.2 with aptX Adaptive, with aptX HD, aptX, AAC and SBC also supported, and the A2DP, AVRCP, HFP, HSP and BLE GATT profiles. The battery is a rechargeable lithium ion pack rated at 30 hours of playback with 7 hours from a 15-minute charge. There is one physical socket, a USB-C port on the right earpiece, which the manual uses for charging, for USB audio from a computer, and, through the supplied USB-C to 3.5 mm audio cable, for analogue sources. The Bowers & Wilkins Music app sets up the headphones, selects the environmental mode and carries Treble and Bass EQ sliders.
