description: Custom Shop edition of the Dark Side workstation, combining an
  analogue big-fuzz circuit with a 24-bit DSP multi-head tape delay and four
  modulation voices (flanger, rotary cabinet, U-Vibe and phaser), with an
  expression pedal port.
details: |-
  The Dark Side is a workstation pedal built from three parts: fuzz, delay and modulation. This Custom Shop edition carries an iridescent sparkle finish over gloss black, simplified graphics and black aluminium knobs.

  The fuzz side is a big-fuzz style distortion based on a 1977 op-amp circuit, reworked to pick up the character of earlier transistor fuzzes and set at a lower gain to suit the period. It is described as a more transparent take on that circuit, holding sustain while keeping the character of either single coil or humbucking pickups.

  The delay and modulation side is selectable between a multi-head tape delay and four modulation voices. The delay offers twelve syncopated settings with the rhythmic quality of spinning-drum tape machines, filtered for the feel of the originals, with expression pedal control over the number of repeats and the option of running into feedback oscillation. The modulation section covers flanger, rotary speaker cabinet, U-Vibe and phaser, with blending between the flanger and the rotary cabinet and between the opto-coupler U-Vibe and the phaser.

  A port for a TRS expression pedal sits on the pedal and is recommended for adjusting settings while playing. Later units replace the earlier TRS insert, which let another pedal sit between the fuzz and the delay and modulation side, with a push-button effect-order switch. At the centre of the pedal is a hand-built board carrying the analogue fuzz alongside a 24-bit DSP engine, with the whole unit hand assembled and soldered.
