description: Dual-effect pedal with a crunch or lead drive channel and a chorus
  or rotary modulation channel, a TRS effects loop and true bypass.
details: |-
  The DCR places a drive section and a modulation section in one compact pedal, so a single box covers rhythm and chord work. This 20 for 20 Custom Shop run wears a colour-shifting Illusion Purple finish with the 20 for 20 Custom Shop insignia and was limited to 20 pedals.

  The drive side has a highly saturated, compressed tube-gain character and offers two profiles: one full-range and heavily saturated, the other combining a slight shelf filter with a low-pass filter to warm or thicken the guitar. The in and out jacks double as TRS inserts, allowing another effect to be placed between the drive and the chorus.

  The drive section feeds one of two modulation types, a chorus and flanger voice or a rotary-speaker swirl. The rotary voicing offers Vibra and Les modes for vintage organ tones, and the chorus voicing switches between a thick doubling chorus and a slick flanger.
