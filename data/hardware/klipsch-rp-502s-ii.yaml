details: |-
  The RP-502S II surround speaker is part of Klipsch's Reference Premiere II series. Its 90° x 90° silicone composite hybrid Tractrix horn maximizes efficiency and focuses high frequencies toward the listening area; the second-generation design increases horn size for a larger soundstage and enhanced directivity.

  The 1" Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for detailed high-frequency performance. A vented tweeter housing further reduces standing waves and unwanted harmonics. The dual 5.25" Cerametallic woofers are exceptionally rigid and lightweight; new aluminum shorting rings (Faraday rings) reduce distortion and increase power handling, while the redesigned motor structure improves transient response.

  Wide Dispersion Surround Technology (WDST) is the cornerstone of Klipsch's surround speaker lineup, providing astounding sonic detail for lifelike, cinematic sound in any room configuration. The MDF cabinet is internally braced with a sealed enclosure design, available in ebony vinyl and walnut vinyl finishes with satin-painted baffles. A magnetic grille attaches cleanly for an elegant appearance.
