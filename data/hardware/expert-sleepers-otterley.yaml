url: https://www.expert-sleepers.co.uk/otterley.html
description: Otterley is a multi-LFO Eurorack module designed to offer extensive
  modulation possibilities, with a good amount of control and flexibility while
  remaining compact. The module is 100% analogue.
details: |-
  Otterley is a multi-LFO module, designed to offer extensive modulation possibilities, with a good amount of control and flexibility, while remaining nicely compact.

  Four of the outputs are switchable between sine and square LFOs. Their frequencies are jointly set by the Speed and Spread knobs, which control the base speed and the speed difference between the outputs respectively. Both controls also have CV inputs.

  Those four outputs can also be switched between bipolar (plus or minus 5V) and unipolar (10V positive or negative), and can be reset to the start of their cycle via the Reset input.

  A fifth output offers another, independent, sine LFO with its own speed knob.

  The module is 100% analogue.
specs: |-
  - Four outputs switchable between sine and square LFOs
  - Speed and Spread knobs set the base speed and the speed difference between those four outputs
  - CV inputs for Speed and Spread
  - Four outputs switchable between bipolar (plus or minus 5V) and unipolar (10V positive or negative)
  - Reset input returns the four outputs to the start of their cycle
  - Fifth independent sine LFO output with its own speed knob
  - 100% analogue
