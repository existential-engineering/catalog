description: The AMS-22 is a 2-in, 2-out USB audio interface for mobile
  recording and streaming, with an XLR/TRS combo input plus a stereo line in, a
  headphone output and two TRS outputs for external monitors.
details: |-
  AMS Audio Interfaces are designed for musicians who want to record music with a DAW or livestream on platforms like YouTube and Twitch without the typical complications. The AMS-22 is the solo-musician model in the line and the smallest of the three, with a single XLR/TRS combo input feeding Zoom's low-noise preamp, a stereo line in on a 3.5 mm jack, one headphone output and two TRS outputs for external monitors.

  Two hardware switches cover the common cases. The Direct Monitor switch sends the input signal straight to the headphones while the same signal is routed to the DAW or streaming software. The Loopback switch combines the input audio with playback from the computer and routes it to the streaming software, for adding background music to a stream or singing over an instrumental track. The combo input supplies 48 V phantom power for condenser microphones and takes a guitar at Hi-Z, with input gain running from +8 to +54 dB in either mode.

  The AMS-22 records and plays back two channels at up to 96 kHz and 24-bit over USB 2.0 as a USB Audio Class 2.0 device. It runs on USB bus power from a PC or Mac over USB-C, or on the Zoom AD-17 AC adapter through a second USB Type-C socket when working from a tablet or phone. At 85 g and 68 mm wide it draws 170 mA and 1.8 W at most.

  The interface works with Mac and PC as well as iOS and Android devices, and is designed to fit the software and platforms musicians already use: streaming to YouTube, Facebook, Twitch, Instagram and Patreon, and recording with Adobe Audition, Pro Tools, Cubase and GarageBand. The box contains the AMS-22 USB Audio Interface, a USB-C cable and a Quick Tour.
specs: |-
  - Input channels: 1 mono MIC/GUITAR, 1 stereo LINE IN
  - Output channels: 1 stereo TRS, 1 stereo PHONES
  - MIC/GUITAR: XLR/TRS combo jack (XLR 2 hot, TRS tip hot)
  - Input gain: +8 to +54 dB (MIC), +8 to +54 dB (GUITAR)
  - Input impedance: XLR 2 kohms (MIC), TS 1 megohm (GUITAR)
  - Maximum input level: XLR +0.6 dBu (MIC), TS +11 dBu (GUITAR)
  - Phantom power: +48 V
  - LINE IN: 3.5 mm stereo mini jack, input impedance 20 kohms, maximum input level +1.5 dBu
  - OUTPUT (standard phone jacks): TRS phone jacks (impedance balanced), maximum output level -2 dBu at 0 dBFS, output impedance 100 ohms
  - OUTPUT (headphone jack): 3.5 mm stereo mini jack, 20 mW + 20 mW into a 32 ohm load, output impedance 10 ohms
  - USB: USB Type-C for the audio interface function (requires a cable that supports data transfer), USB bus power supported, plus a USB Type-C DC 5 V power supply input
  - Frequency response: 44.1 kHz +0/-2 dB (20 Hz to 20 kHz), 96 kHz +0/-3 dB (20 Hz to 40 kHz)
  - Equivalent input noise: -120 dBu or less (IHF-A) at +54 dB into 150 ohms
  - Audio interface: 2 channels recording, 2 channels playback
  - Sampling frequencies: 44.1, 48, 88.2 and 96 kHz
  - Bit depth: 24-bit
  - Interface: USB 2.0, USB Audio Class 2.0
  - Power: ZOOM AD-17 AC adapter (DC 5 V/1 A), USB bus power supported, no battery compartment
  - Rated current: 170 mA on USB bus power or the DC 5 V supply
  - Power consumption: 1.8 W maximum
  - Dimensions: 68.0 mm (W) x 57.7 mm (D) x 46.0 mm (H)
  - Weight: 85 g unit only
  - Hardware Direct Monitor and Loopback switches, GAIN and OUTPUT knobs, signal and power indicators
  - System requirements, Windows: Windows 10 or 11 (64-bit), Intel Core i3 or faster or AMD Ryzen 3 or faster with Zen architecture, USB 3.0 or 2.0
  - System requirements, Mac: Mac OS X 10.14.6 to macOS 26, Intel Core i3 or faster or Apple M1, USB 3.0 or 2.0
  - System requirements, iPhone and iPad: iOS/iPadOS 13.7 to 26, Apple Lightning-to-USB Camera Adapter required
  - System requirements, Android: Android OS 9 to 11, matching USB cables and adapters necessary
