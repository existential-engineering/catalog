description: Large portable party speaker with 40+ hours of playtime from a
  replaceable LFP battery, two mic/instrument combo inputs and an IP54 rating.
details: |-
  Make the street, forest, or garden your venue as this powerful portable speaker can play free from wires for 40+ hours without taking a breath. You'll never miss a bass drop, as its True Stereophonic 360 degree sound can reach wherever you're standing, even outdoors. Bromley 750 has been tuned for all volumes, and makes a heavy statement wherever it shows up.

  Bromley 750 delivers a fully immersive and dynamic sound performance. Engineered with True Stereophonic, a unique form of multi-directional sound, music fills the air above and around you. Its durable, closed-box design ensures a tighter, more controlled, and natural sounding bass. Two side-firing drivers help create the 360 degree sound field, up-firing tweeters push audio out over your head, a front-firing driver and tweeter deliver sound you can feel, and rear-firing drivers complete the design so the music reaches you wherever you stand.

  The sound character control is not a volume or gain control. It works alongside the volume knob across thirteen steps to fine-tune both the tonal profile and loudness: the EQ curve, compression and harmonic content of the signal alter progressively, moving from a flat response suited to smaller rooms, through a dynamic loudness mode with enhanced bass and wider dynamics, to a party mode with maximum character compression and a custom EQ curve optimised for high-volume playback.

  A replaceable LFP battery comes pre-installed and gives 40+ hours of playtime at volume step 5 with the light show off. It can be removed and charged separately and also works as a power bank for external devices, and the speaker runs directly from the included mains lead even with no battery fitted. Integrated stage lights offer three presets synchronised to the audio, and two mic and instrument inputs with effect controls let you add microphones, instruments or turntables to the playback.

  The cabinet is IP54 rated against dirt and splashes with a built-in drainage system, carries integrated wheels, side handles and a retractable handle for transport, and has a tripod mount on the underside for a standard speaker stand. Marshall offers authorised repair services and spare parts for the product. Designed and engineered in Sweden. Made in China.
specs: |-
  - Dynamic drivers: 2 x 10 inch 150W woofers, 2 x 5.25 inch 50W mid-ranges, 2 x 1 inch 7W tweeters, 2 x 0.8 inch 14W tweeters
  - Power amplifiers: 2 x 100W class D (woofers), 2 x 50W class D (mid-range), 4 x 50W class D (tweeters)
  - Frequency range: 20Hz to 20,000Hz
  - Maximum sound pressure level: 127 dB @ 1 m
  - Stereo, closed-system cabinet with equaliser
  - Bluetooth 5.3 with Auracast, multipoint connectivity, range >70 m (229 feet) in free field
  - Codecs: SBC, AAC-mpeg 2 and LC3
  - Wired connectivity: AUX 3.5 mm (input and output), USB-C, RCA, 2 x XLR / 6.35 mm combo jacks for mic and instrument
  - Top panel controls: power switch, source selector, media control, volume, bass, treble, M-button, input 1 volume, input 2 volume, input 1 and 2 effect control, sound character, light mode, battery indicator
  - Rechargeable, replaceable LFP (LiFePO4) battery, 40+ hours play time, 3.5 hours to full recharge, 20 minutes quick charge gives 5 hours playtime
  - USB Type-C charge in and out, 5V 3.0A (power bank function)
  - Mains input voltage 100-240V, mains frequency 50/60Hz
  - Water resistance: IP54
  - Integrated wheels and retractable handle, tripod mount on the underside
  - Dimensions: 652 x 413 x 355 mm (25.7 x 16.3 x 14 in)
  - Weight: 23.9 kg (52.7 lbs)
  - Compatible with the Marshall Bluetooth app
  - In the box: speaker, Bromley battery (fitted), mains lead, quick start guide, legal and safety sheet
