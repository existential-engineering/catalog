description: The Blackstar Amps Fly Series delivers the same tonal balance and
  feel of a larger guitar amp even at low volumes.
details: |-
  Rather than just being focussed on its look and compact size and ultimately sacrificing the quality of sound, the FLY 3's unique design delivers the same tonal balance and feel of a larger guitar amp even at low volumes. The FLY 3 combines awesome tone and features in a lightweight and compact battery-powered format, giving you the perfect take-anywhere mini amp.

  The use of a full range driver eliminates the need of a subwoofer. This has the benefit of removing the requirement for a crossover and the negative sonic impact that can have. The key part of a guitar's tone occurs in the frequencies that are normally affected by a crossover and for music playback the performance is similar to nearfield monitors.

  Countless hours were spent on the design of the cabinet to achieve a sonic performance not normally found in a mini amp. The housing is sealed and tuned to ensure optimum tonal response and the material used has been mathematically modelled to have the Young's Modulus of wood. This retains the bass response usually associated with a wooden cabinet.

  FLY 3 comes equipped with Blackstar's patented ISF (Infinite Shape Feature) EQ, allowing you to dial in incredible sounds. Fully counter clockwise has an American characteristic with a tight bottom end and aggressive middle; fully clockwise has a British characteristic which is more 'woody' and less aggressive. It also features an Emulated Line Out for silent practice or home recordings, an in-built 'tape' delay effect with time and level controls, and overdrive channels meticulously designed to clean up with your guitar volume.

  Connect to the FLY 103 cabinet (sold separately) for a 6W stereo setup, perfect for use with a computer or any other device connected via the FLY 3's MP3 / LINE IN jack. The FLY 3 is battery powered and has a competition-beating battery life (when set at around half volume), letting you listen to music or play guitar for hours.
specs: |-
  - Channels: Clean & Overdrive
  - Watts: 3
  - Speaker: 3" Full Range
  - Controls: Gain, Volume, ISF (EQ), Delay Time, Delay Level, OD Select
  - Inputs/Outputs: Headphone/Emulated Out, Line-in, DC-in, FLY 103 Ext Speaker Out
  - Power: 6x AA Batteries or DC
  - Weight: 0.9kg
  - Dimensions: 170 x 126 x 102 (mm)
  - Patented ISF (Infinite Shape Feature) tone control
  - Emulated Line Out for silent practice and recording
  - In-built 'tape' delay effect with time and level controls
  - Compatible with FLY 103 extension cabinet for 6W stereo setup
