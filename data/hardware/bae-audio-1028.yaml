  significantly expanded mid and high-frequency EQ sections, offering 28 total
  frequency options for enhanced tone-shaping versatility.
details: |-
  The BAE Audio 1028 is a hand-wired microphone/line preamplifier combined with a comprehensive 3-band equalizer. It features the identical mic/line preamp circuit as the legendary 1073 model, built with Carnhill (St. Ives) transformers for authentic vintage character.

  Where the 1028 expands beyond the 1073 is in its EQ section. The high frequency shelving offers five selectable frequencies (10kHz, 12kHz, 16kHz, 20kHz, 24kHz) at ±16dB, while the low frequency shelving provides four options (35Hz, 60Hz, 110Hz, 220Hz) at ±16dB. The mid-range section delivers ±12dB or ±18dB peaking across 11 selectable centre frequencies spanning 160Hz to 10kHz.

  An 18dB/octave high-pass filter is switchable across four frequencies (45Hz, 70Hz, 160Hz, 360Hz), and a low-pass filter offers five positions (6kHz, 8kHz, 10kHz, 14kHz, 18kHz) at the same slope. The expanded 28 total frequency options allow overlapping frequency interaction between mid bell curves and high/low shelves.

  The 1028 is available in two formats: a 19-inch 1RU rackmount with integrated power supply, and a 500-series compatible module. Both are available with standard or black faceplates. The rackmount version weighs 10 lbs and the module 6 lbs.

  Key controls include switchable EQ on/off, 180-degree phase invert, and a gain range of 0 to 80 dB. The unit achieves an equivalent input noise of -110 dBu (unweighted, 300kHz bandwidth) and a maximum output level of +27.4 dBu into 600 ohms.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Mic Input Impedance: ≈1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ≈150k ohms
  - Output Impedance: 65 ohms
  - CMRR: 100dB min @ 60Hz
  - Max Output Level: +27.4 dBu @ 600Ω
  - Gain Range: 0 to 80 dB
  - Equivalent Input Noise: -110 dBu (unweighted, 300kHz bandwidth)
  - Power Requirements: 115/230 VAC, 28W
  - High Frequency EQ: ±16dB shelving, 5 frequencies (10kHz, 12kHz, 16kHz, 20kHz, 24kHz)
  - Low Frequency EQ: ±16dB shelving, 4 frequencies (35Hz, 60Hz, 110Hz, 220Hz)
  - Mid Range EQ: ±12dB or ±18dB peaking, 11 selectable centre frequencies (160Hz–10kHz)
  - High Pass Filter: 18dB/octave, switchable (45Hz, 70Hz, 160Hz, 360Hz)
  - Low Pass Filter: 18dB/octave, switchable (6kHz, 8kHz, 10kHz, 14kHz, 18kHz)
  - Total EQ frequency options: 28
  - Transformers: Carnhill (St. Ives)
  - Rackmount Dimensions: 19" W × 1.75" H × 9" D
  - Rackmount Weight: 10 lbs
  - Module Dimensions: 45mm W × 8.75" H × 10.5" D
  - Module Weight: 6 lbs
