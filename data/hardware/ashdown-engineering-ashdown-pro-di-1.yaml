details: |-
  Designed for touring bassists, the Pro-DI packs Ashdown's signature 5-band EQ with Shape option, valve-emulated overdrive (with mix and level controls), and the iconic VU meter into a rugged, road-ready pedal. With transformer-isolated DI output, ground-lift, active/passive inputs, and a dedicated Line In with mix control, it's equally at home on stage, in rehearsal, or in the studio. Built for longevity with easy repairability and backed by a 5-year warranty. The on-board valve-emulated overdrive features a drive mix and level control to ensure you don't lose any volume or gain when engaging the drive. Used in conjunction with the input and output controls and the Ashdown VU Meter, you can balance your levels to ensure unity with the output. There is also a passive and active input sensitivity pad, with a -3dB cut for use with active instruments. The Pro-DI features its own transformer-isolated DI output, providing a balanced output for front of house or a monitor feed, with an optional ground lift. There is also a link out for connection to another monitor feed or alternative output for front of house. Both the DI and link outputs are post-EQ and set at a nominal output of 0dB. There is a line input with its own dedicated line mix level control on the top of the pedal, allowing you to plug in an audio device to play along with, or to receive a feed from a monitor mix and blend the amount you want to hear in your own headphone mix via the dedicated headphone output on the rear of the pedal. The pedal requires a minimum of 9V with a 45mA draw, centre pin negative (power supply not included).
specs: |-
  - Bass DI preamp pedal
  - 5-band EQ with Shape option
  - Valve-emulated overdrive with drive mix and level controls
  - Ashdown VU meter
  - Transformer-isolated balanced DI output with ground-lift
  - Active/passive input sensitivity with -3dB active pad
  - Post-EQ Link output at nominal 0dB
  - Line In with dedicated mix level control
  - Dedicated headphone output
  - Power: 9V minimum, 45mA draw, centre pin negative (supply not included)
  - 5-year warranty
  - Dimensions (H x W x D) 183 x 116.2 x 65 mm
  - Weight 1.46 kg
