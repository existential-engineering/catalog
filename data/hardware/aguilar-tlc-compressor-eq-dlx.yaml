description: Aguilar's most full-featured bass compressor, combining
  professional dynamic control with musical EQ in a compact pedalboard-friendly
  format. Built on the original TLC Compressor, the DLX adds a Release control,
  six Ratio settings, LED gain-reduction metering, Blend for parallel
  compression, and a boost-only Bass/Treble EQ section inspired by the Aguilar
  DB 925 circuit.
details: |-
  Studio-style compression with Threshold, Attack, Release, Ratio, Output, and
  Blend controls. Ratio settings: 2:1, 4:1, 8:1, 12:1, 20:1, and ∞ (limiting).

  Blend control enables parallel compression — mixing the compressed and dry
  signals to retain dynamics and low-end weight. LED gain-reduction meter provides
  real-time visual feedback of compression amount.

  Boost-only Bass and Treble EQ section inspired by the Aguilar DB 925 circuit
  adds tonal shaping without cutting frequencies. Ultra-low noise floor.

  Advanced DSP platform with in-house algorithms. Backed by Aguilar's three-year
  limited warranty.
specs: |-
  - Power: 9V DC, 500mA center-negative (not included)
  - Dimensions: 6" W × 3.25" L × 2.25" H
  - Ratio settings: 2:1, 4:1, 8:1, 12:1, 20:1, ∞
