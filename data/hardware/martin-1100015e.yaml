description: The 000-15E pairs a solid mahogany top with sapele back and sides
  for warm, balanced tone. With an Auditorium body, E1 electronics, and timeless
  style, it's a stage-ready acoustic with classic character and modern edge.
details: |-
  The Martin 000-15E is part of the 15 Series, pairing a solid Indian Plantation Mahogany top with sapele back and sides in an Auditorium (000-14 Fret) body. The all-solid wood construction yields a warm, woody tone with a pronounced midrange, while the sapele back and sides add bright and airy trebles for a balanced acoustic voice.

  The neck features Martin's PA Profile with High-Performance Taper, a 24.9-inch scale length, and a katalox fingerboard with a 1 3/4-inch nut width. Twenty total frets join the body at the 14th fret, with a modern belly-style katalox bridge and scalloped X-brace spruce bracing inside the body.

  Martin's E1 electronics are factory-installed, providing tuner, volume, tone, and phase controls for plugged-in performance on stage or in the studio. Nickel open-gear tuners, a white Corian nut, and a satin finish round out the appointments.

  The guitar ships with Authentic Acoustic Lifespan 2.0 (Light) strings and a waterproof softshell case with backpack straps, and is also offered as a left-handed option.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Solid Indian Plantation Mahogany
  - Back & Sides: Solid Sapele
  - Bracing: Scalloped X-Brace spruce
  - Finish: Satin
  - Neck Shape: PA Profile with High-Performance Taper
  - Scale Length: 24.9"
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard: Katalox
  - Bridge: Katalox, modern belly style
  - Frets: 20 total, joins body at 14th fret
  - Nut: White Corian
  - Tuners: Nickel open gear
  - Electronics: Martin E1 (tuner, volume, tone, phase)
  - Strings: Authentic Acoustic Lifespan 2.0 (Light)
  - Case: Waterproof softshell with backpack straps
