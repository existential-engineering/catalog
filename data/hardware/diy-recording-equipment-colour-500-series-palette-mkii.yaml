description: A 500-series module offering three Colour module slots with
  individual drive/trim controls and bypass switches, letting users combine
  multiple analog color stages in one slot.
details: |-
  Add three stages of real analog color to your setup in a single 500-series slot. Revamped Controls. Dial in exactly the signal path you want with individual drive/trim knobs and bypass switches for each Colour. 21-position stepped controls make stereo matching and recall easy. Still Radically Affordable. Despite featuring new controls, an upgraded signal path, and aluminum knobs (formerly a premium upgrade), the Palette mkII still comes in at an unbelievable price point. Even DIY Friendlier. The Palette mkII is a painstakingly thought out and documented kit. Over the last few years, we've seen seen every possible snag a DIY project can hit, and built every way we can think of to prevent those snags into this kit. Full Features List

  What the Pros are Saying

  "The Colour system is a fascinating example of what can be done with analogue electronics, and produces some great textures. If you have a 500-series with space for another module or two, this is a no-brainer."

  -Mike Hillier
  MusicTech.net

  "I can't say enough good things about Colour. This product embodies everything Tape Op is about. It's rooted in DIY; it sounds good; and it's inexpensive, novel, fun, and wide open for experimentation. Right on."

  -Scott Evans
  TapeOp Magazine #107

  "...the whole concept and execution works brilliantly: DIYRE's Colour platform is a great way to add a little analogue character to your setup, or to dip those first tentative toes into the world of DIY."

  -Matt Houghton
  Sound on Sound Magazine

  Technical

  Signal Path

  The balanced, line-level input signal is received via a THAT Corp. 1256 integrated circuit. From there, the signal passes through each Colour stage in series. Each Colour stage includes a bypass switch and combined drive/trim control. The drive/trim control is a dual potentiometer that controls both a drive amplifier before the Colour and corresponding attenuator after the Colour. The result is that the Colour's intensity increases/decreases while the net gain remains the same. The Colour stages are followed by a master output trim/boost control and bypass switch. Finally, the output signal is balanced via a THAT Corp. 1646 line driver IC. Specifications

  Input Impedance
  24kΩ

  Output Impedance
  50Ω

  Colour Controls Gain Range
  0-18dB

  Output Control Gain Range
  +/-6dB

  Max Input Level
  27.5dBu

  Power Supply Voltage
  +/-16VDC

  Power Supply Current
  140mA max (with three Colours installed)

  Chassis Requirements
  Compatible with any 500-series rack

  Nominal Operating Level
  +4dBu

  Resources
specs: |-
  - 3 Colour sockets. Colour modules are sold separately. Browse our ever-broadening Colour spectrum .
  - Individual knobs and switches for each Colour
