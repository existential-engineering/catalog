description: Erica Synths DIY Synth Voice consists of all essential blocks for a
  versatile monosynth and is 100% patchable for even more controll options.
details: |-
  The DIY Synth Voice gathers the know-how Erica Synths accumulated while developing the Black Series and Pico Series modules into a compact, great sounding DIY design, and it carries all the essential blocks of a versatile monosynth on one 30HP panel.

  The module is a digital and analogue hybrid, chosen to keep it compact and reliable in tuning. The oscillator and the envelope generators and LFOs are digital, built around a pre-programmed MCU board that arrives in the kit pre-soldered on a small controller board, while the rest of the signal path is analogue.

  The oscillator offers 16 waves with manual wave morphing, a suboscillator one octave down and a white noise generator, with auto calibration for better 1V/oct tuning. An external audio input and an audio mixer sit in front of a LP/BP filter inspired by the Black Polivoks VCF, and the VCA that follows has bias control.

  Modulation comes from a linear or logarithmic ASR envelope generator with a looping function, a second linear ASR envelope generator that doubles as an LFO, also with looping, and 9 LFO waves with wave morphing. Tap tempo and LFO sync are on board, and in sync mode the LFO frequency can be multiplied by two or four or divided by two or four.

  The whole module is fully patchable, and several DIY Synth Voice modules can be chained to build a polysynth. Audio output level is 10V ptp, LFO output runs -5V to +5V and envelope outputs run 0V to +10V.
specs: |-
  - VCO with 16 waves and manual wave morphing
  - -1 oct suboscillator
  - White noise generator
  - External audio input
  - Audio Mixer
  - LP/BP VCF inspired by Black Polivoks VCF
  - Lin/log ASR envelope generator with looping function
  - Lin ASR EG/LFO with looping function
  - 9 LFO waves with wave morphing
  - Tap tempo and LFO sync
  - LFO frequency multiplication (x2, x4) and division (/2, /4) in sync mode
  - VCA with bias control
  - Auto calibration for better 1V/oct tuning
  - VCO range C1 to C8
  - Audio output signal level 10V ptp
  - LFO output signal level -5V to +5V
  - EG output signal level 0V to +10V
  - LFO Frequency 0.1Hz to 70Hz
  - VCA attenuation level 80dB
  - Module width 30HP
  - Module depth 35mm
  - Power consumption 82mA@+12V, 50mA@-12V
