description: A space-friendly, feature-rich, highly flexible
  solution for all your stereo line level input and output needs. Includes a
  dedicated headphone jack/volume and a clever Cue bus for monitoring signals
  outside of the main output or to add a 2nd source to the main outputs.
details: |-
  The Stereo I/O 1U is an all-in-one audio input/output module designed to bridge the gap between your Eurorack system and line-level devices. Whether you want to process external audio with your modules, monitor your patch with headphones, or connect your system to mixers or interfaces with line level, Stereo I/O 1U has got you covered.

  Main output to balanced stereo line level with volume control (for line mixers, FX, speakers etc.). Stereo input from balanced line level with gain switches (for Grooveboxes, FX, Synthesizers etc.).

  ⅛” stereo headphone output with independent level control & source selection. Cue output for monitoring with headphones or summing with the main output.

  The Stereo I/O module connects to compatible Intellijel Cases & Modules using 6-pin or 3-pin connectors (included with the module) on the module's rear.

  Because Stereo I/O 1U is designed specifically for audio (and not for CV mixing), it's AC-coupled, and uses audio-grade, logarithmic attenuators for a smooth, even response across the entire volume range.
