description: >
  RackBrute 6U is an all-inclusive Eurorack case ensuring the total security of your modules and maximum practicality in all conditions of use. Its multi- position configuration and included dependable power supply make it the true specialist solution.
details: |-
  The rackbrute 6u is an all-inclusive eurorack case designed to provide total security and maximum practicality for modular synthesizer setups. It features 176 hp of space housed in a lightweight yet durable aluminum chassis flanked by two wood panels, making it both protective and portable. The multi-position configuration and included dependable power supply make it a complete specialist solution for organizing and transporting eurorack modules.

  The rackbrute 6u includes a formidable power supply with 1600ma on +12v and -12v outputs, plus 900ma on +5v, coupled with a military-grade power rail featuring 32 available slots. The power distribution is organized into zones: a 20-slot zone with up to 800ma on +12v and -12v, and a 12-slot zone with the same capacity, all protected by advanced noise filtering technology that guarantees optimum conditions for module operation.

  The link system is a convenient and simple-to-use fastening mechanism that allows you to orient the dedicated handle for multi-position configurations, whether the case is prone, crouching, or standing upright. Built-in spacers ensure no collisions occur when transporting multiple rackbrute units or combining with other link-ready equipment. The handle, chassis, and threaded nut strips are constructed from aluminum or steel for durability and reliability across various transport contexts and distances.

  The rackbrute 6u is designed as a complete transport solution with strategic components engineered to carry your modular setup securely regardless of weight or destination. An optional rackbrute travel case is available for additional protection during covert missions or when keeping your modular away from prying eyes. The case maintains equipment integrity during transport while allowing you to organize your command center the way you want it when in position.
specs: |-
  - 176 hp eurorack format
  - Aluminum chassis with wood panels
  - 5 hp power module included
  - Power supply: +12v/1600ma, -12v/1600ma, +5v/900ma
  - 32 standard power slots
  - 20-slot zone with up to 800ma on +12v and -12v
  - 12-slot zone with up to 800ma on +12v and -12v
  - Advanced noise filtering technology
  - Link system fastening
  - Smart handle for multi-position configuration
  - True bypass switching
  - Built-in spacers for transport protection
  - Aluminum and steel construction
  - Dimensions: 19 x 13.2 x 3.3 inches (484 x 300 x 83mm)
  - Weight: 8.3 lbs (3.76 kg)
  - 171 hp available when power supply module is connected
