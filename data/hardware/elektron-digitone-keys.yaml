url: https://www.elektron.se/legacy
description: >-
  Keyboard version of the Digitone FM synthesizer with a 37-key velocity- and
  pressure-sensitive keyboard with aftertouch, eight-voice polyphony, dedicated
  track outputs, and customizable front panel controls.
details: |-
  Digitone Keys is a four-operator FM synthesizer presented in a keyboard form factor. The FM engine functions as a complex tone generator paired with a more approachable subtractive synth signal path for overall sound shaping.

  The instrument features a 37-key velocity- and pressure-sensitive keyboard with aftertouch, providing instant access to eight-voice polyphony. Mod and pitch wheels offer expressive real-time control over the synthesis engine.

  Dedicated outputs per track allow for individual processing of each of the four synth tracks in an external mixing environment. Customizable controls on the front panel expanded the hands-on performance capabilities beyond the original Digitone.

  The internal +Drive provides storage for projects, sounds, and samples. The built-in Elektron sequencer enables pattern-based composition and live performance with parameter locks, trig conditions, and micro timing.
specs: |-
  - 4-operator FM synthesis engine
  - 8-voice polyphony
  - 37-key velocity- and pressure-sensitive keyboard with aftertouch
  - Pitch and mod wheels
  - Subtractive synthesis signal path
  - Dedicated outputs per track
  - Internal +Drive storage
  - Built-in Elektron sequencer
  - Overbridge enabled for DAW integration
  - Customizable front panel controls
