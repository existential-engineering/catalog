name: SRT210
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/srt-series/SRT210.html
description: "The ultimate workhorse loudspeaker combining Advanced Impulse DSP
  acoustic tuning technology, an ultra-powerful 1600W Class-D amplifier, custom
  transducers, and Bluetooth streaming for bands and gigging DJs."
specs: |-
  - 1600W Class-D amplifier with transparent system limiting
  - Advanced Impulse DSP tuning
  - Custom transducers and SymX Horn
  - SRT Mix Control 4-channel digital mixer with Bluetooth
  - SRT Connect app control (iOS/Android)
  - Wireless speaker linking capability
  - Dual-angle pole mount design
  - M10 flypoints for professional installation
  - Frequency Response: 47Hz – 20kHz
  - Max SPL: 128 dB
  - Weight: 28.2 lb / 12.8 kg
  - Dimensions: 23.0 x 15.1 x 12.9 in (584 x 384 x 328 mm)
  - LF Driver: 10"
  - HF Driver: 1.4"
  - Horn Coverage: 90° horizontal x 60° vertical
  - Universal Power Supply (100-240VAC with Power Factor Correction)
