details: |-
  The Martin HD-28 is a legendary acoustic guitar, trusted by generations of players and played by countless icons across genres. Its Dreadnought body size and scalloped bracing delivers the bold, projective tone with strong bass, clear trebles, and rich overtones that has defined acoustic music for nearly a century.

  Handcrafted with a solid spruce top and solid East Indian rosewood back and sides, the HD-28 offers a resonant, balanced voice for all playing styles. Bold herringbone top inlay and an ebony fingerboard with abalone diamond and square inlays add a vintage-inspired touch.

  The satin neck, featuring a Golden Era (GE) Modified Low Oval profile, high-performance taper, and 25.4" scale length, ensures effortless playability. Complete with antique white binding, an ebony bridge with bone pins, and nickel open gear tuners, the HD-28 blends timeless craftsmanship with modern versatility.

  Martin's refreshed Standard Series for 2025 enhances tone, comfort, and style. Sitka spruce GE top bracing, as featured on the Modern Deluxe Series, delivers vintage-inspired tone and sustain, while updates like a reimagined neck profile, thinner fingerboard, and refined bridge and heel improve playability and aesthetics. Each guitar includes a hardshell case.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Solid Spruce, Aging Toner, Gloss finish
  - Top Inlay: Bold Herringbone
  - Back and Sides: Solid East Indian Rosewood, Natural, Gloss finish
  - Back Purfling: Zig-Zag with Black Stripe
  - Binding: Antique White
  - Bridge: Ebony, GE Modern Belly - Drop in Saddle
  - Bridge Pins: Bone with Faux Tortoise dots
  - Bridge String Spacing: 2 5/32"
  - Saddle: Compensated Bone, 16" radius
  - Pickguard: Faux Tortoise
  - Rosette: Style 28 Multi-Stripe
  - Bracing Pattern: Forward-Shifted X-Brace
  - Brace Shape: GE-Scalloped
  - Brace Material: Spruce, 5/16"
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Neck Material: Select Hardwood, Dark Mahogany, Satin finish
  - Scale Length: 25.4"
  - Total Frets: 20
  - Neck Joins Body At: 14th Fret
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Diamonds and Squares Long (Abalone)
  - Side Dots: White
  - Headstock: Solid with Square Taper and Diamond
  - Headplate: East Indian Rosewood with Script Old Style Overlay logo
  - Tuning Machines: Nickel Open Gear with Butterbean knobs
  - Nut: Bone
  - Construction: Dovetail Neck Joint
  - Case: Molded Hardshell included
  - Electronics: No
  - Left-Handed: Available
  - Pleked: Yes
