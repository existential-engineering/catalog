details: |-
  The iLoud Micro Monitor is an ultra-compact 2-way active bi-amped studio monitor featuring 56-bit DSP with digital crossover and high-efficiency Class-D amplification delivering 50W RMS total output power (70W peak). A 3/4" silk dome tweeter with neodymium magnet handles the highs while a 3" high-rigidity custom composite material woofer provides bass response down to 45 Hz (-10 dB).

  The high-performance bass-reflex design achieves a maximum SPL of 107 dB at 50 cm. Acoustic EQ settings for high shelf, low shelf, and desktop compensation allow fine-tuning to your environment. Bluetooth with A2DP protocol enables wireless audio streaming.

  Each monitor features an integrated isolation base with two angles of inclination and an integrated mic stand thread (UNC 3/8"-16). Available in Black and White finishes. Package includes a pair of speakers, power supply, 4-pin speaker connection cable, and TRS 1/8" stereo to 2x RCA cable. Includes T-RackS 5 Metering Suite software.
specs: |-
  - 2-way active bi-amped studio monitor
  - 56-bit DSP with digital crossover
  - Class-D amplification, 50W RMS (70W peak)
  - 3/4" silk dome tweeter with neodymium magnet
  - 3" custom composite material woofer
  - Frequency response down to 45 Hz (-10 dB)
  - Maximum SPL: 107 dB at 50 cm
  - Acoustic EQ: high shelf, low shelf, desktop compensation
  - Bluetooth with A2DP protocol
  - Integrated isolation base with two tilt angles
  - Integrated mic stand thread (UNC 3/8"-16)
  - Available in Black and White
  - Includes T-RackS 5 Metering Suite
