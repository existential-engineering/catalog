description: Open-back planar magnetic professional studio headphones with
  single-sided cable, gel-filled earpads, and a magnesium/steel chassis designed
  for portable studio reference.
details: |-
  Experience the precision and reliability of a professional studio anywhere you create or listen to music with the new MM-100. Enjoy all-day comfort from our newest full-sized headphone, built in the USA on a lightweight premium magnesium and steel chassis.

  For years top audio professionals worldwide have relied on Audeze headphones like the LCD-X and MM-500. MM-100 instantly transforms your space into a studio, putting you between a pair of industry-trusted monitors that consistently deliver the sound and emotions the artist intended.

  Hear deeper into every mix, and don't let a single detail go unnoticed thanks to the industry-leading driver technology packed into MM-100. Expect pinpoint precision and ultra-low distortion from MM-100's newly designed planar magnetic drivers.

  MM-100 is designed to deliver effortless comfort for even your longest sessions. Relax as the supple gel-filled earpads cradle your ears, and the adjustable suspension strap feels feather-light for hours.

  Work easily around your instrument, computer, or console thanks to MM-100's single-sided cable, which can be conveniently connected to either side of the headphone. Every pair is hand-assembled and tested in our Southern California workshop.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-Thin Uniforce
  - Transducer size: 90 mm
  - Maximum SPL: >120dB
  - Frequency response: 20Hz - 25kHz
  - THD: <0.1% @ 100 dB SPL, 1kHz
  - Sensitivity: 98 dB/1mW (at Drum Reference Point)
  - Impedance: 18 ohms
  - Max power handling: 5W RMS
  - Min recommended power: >100mW
  - Recommended power level: >250mW
  - Cable: 2.5m (8.2ft) single-ended 3.5mm TRS to 1/4-inch TRS
  - Weight: 475g
  - Warranty: 1 year
  - SKU: 211-MM-1100-01
