  increases transient response, control and punch.
details: |-
  The S10.4 powered studio subwoofer builds upon KRK's legacy for sonic accuracy and performance. The custom-voiced, glass-aramid woofer delivers tight, defined bass, while the Class-D power amplifier dramatically increases transient response, control and punch. The four-position selectable crossover makes it easy to adjust the subwoofer setting to your existing monitors.

  Pairing the S10.4 with KRK or another studio monitor delivers an optimized listening and mixing experience with extended low end, while the exclusive bypass-control feature provides full range audio to the monitors without switching off the subwoofer.

  Bypass Footswitch

  The bypass footswitch control mutes the subwoofer and sends full-range audio to the monitors. The footswitch is optional and not included.

  Heavy Duty Enclosure

  Reinforced MDF construction for strength and durability.

  Front-firing Port

  The front-firing port provides low frequency extension while reducing boundary coupling, and its shape is optimized to avoid port turbulence.

  Crossover and High-pass Filter

  A dedicated crossover and optional high-pass filter bypass suit the subwoofer to powered monitors, for mixing and mastering, sound design, broadcast and production work.
specs: |-
  - Configuration: Front Loaded, Vented Subwoofer
  - System Type: Active Subwoofer
  - Low-Frequency Transducer: 10" Glass Aramid Composite Woofer
  - Frequency Response: 30Hz - 110Hz
  - Max Peak SPL: 117.2 dB
  - Amplifier: Class D
  - Power Output (Continuous): 160 Watts @ 1% THD+N @ 44Hz
  - Signal to Noise Ratio: 92 dB
  - Amplifier Distortion (THD + N): <= 0.12% @-3dB Of Max Power Output 31Hz-110Hz
  - Input Impedance: 9.4 KΩ Balanced, 9.2 KΩ Unbalanced
  - Ground Lift: On/Off
  - HPF Bypass: With Footswitch Only
  - Footswitch: Optional
  - Indicators: Power/Standby
  - Input Connectors: XLR, 1/4" TRS and RCA, left and right
  - Footswitch Input: 1/4"
  - LFE Input: N/A
  - Output Connectors: XLR, 1/4" TRS and RCA, left and right
  - AC Power Input: 100VAC-240VAC
  - Four-position selectable crossover control
  - Polarity and input sensitivity controls
  - Enclosure: 15 mm and 18 mm Reinforced MDF
  - Finish: Black Vinyl Wrap, Baffle - Black Paint
  - Hardware: EVA Isolation Pad
  - Dimensions (H x W x D): 13.4375" (341 mm) x 18.875" (479 mm) x 12.1875" (310 mm)
  - Weight: 35 lb. (15.88 kg.)
