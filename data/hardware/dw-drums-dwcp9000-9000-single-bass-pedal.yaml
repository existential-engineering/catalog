details: |-
  The DW 9000 Series Single Bass Drum Pedal is engineered for drummers who demand a smooth, powerful and highly adjustable playing experience. Every major component in the 9000 drivetrain is designed to reduce friction, improve stability and give players greater control over how the pedal responds underfoot.

  At the heart of the 9000 is DW's Floating Rotor design, which adds bearings directly into the cam assembly to help the drivetrain move through the path of least resistance. By better accommodating the small variations found in any mechanical system, the Floating Rotor helps create the exceptionally smooth and consistent stroke the 9000 Series is known for.

  The EZ Infinite Adjustable Cam lets players continuously adjust the pedal from a linear Turbo-style response to the increased acceleration of an Accelerator-style cam, or anywhere in between. DW's Floating Swivel Spring system further reduces resistance by allowing the spring connections to pivot more freely throughout the pedal stroke.

  The Delta II Ball Bearing Hinge uses dual ball bearings and an interlocking component design to create a precise, low-friction connection between the footboard and heel plate. At the bass drum, the Tri-Pivot Toe Clamp uses three independently moving contact points to adapt to different hoop shapes, thicknesses and bass drum angles.

  The DW Two-Way bass drum beater features a felt side for warm and focused sound, and a high-impact plastic side recommended for more attack. A DW Single Pedal Bag is also included for convenient and protected transport.
specs: |-
  - Infinite cam adjustment for personalized feel
  - Floating Rotor for a smooth, consistent stroke
  - Delta II Ball Bearing Hinge (U.S. Patent No. 5431081) for precise, low-friction movement
  - Tri-Pivot Toe Clamp (U.S. Patent No. 8330032) adapts securely to bass drum hoops
