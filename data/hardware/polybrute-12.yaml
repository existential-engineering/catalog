description: >
  PolyBrute 12 is the most expressive synthesizer ever. With a FullTouch®
  keyboard, unrivaled sonic palette and advanced software companion - it offers
  more sonic possibilities than any other analog synthesizer.
details:
  - Polybrute 12 takes in-the-moment sonic expression to a whole new level, with
    a groundbreaking fulltouch keyboard that brings you into direct and tactile
    connection with your sound like never before. A machine as sensitive as it
    is powerful, embodying a dynamic and expressive sound on par with acoustic
    instruments.
  - Polybrute 12's fulltouch keyboard enables polyphonic aftertouch expression
    across the entire key movement range, inviting incredibly dynamic
    composition unmatched by any other synth. Choose between regular synth
    action aftertouch modes and fulltouch modes for a cascade of modulation at
    your fingertips.
  - The 12-voice architecture of polybrute 12 combined with its analog
    oscillators, filters, advanced matrix and integrated fx allow for an
    infinite spectrum of sonic color to be explored. Choose between 480 dynamic
    presets or advanced end-to-end sound design and discover polybrute's seismic
    sound.
  - Polybrute connect provides a coherent bridge between polybrute and your
    virtual studio projects. Manage your patches and easily import new presets
    and sound banks. Control polybrute in real-time with every parameter change
    mirrored between synth and software.
  - Polybrute 12 represents a leap forward in analog synthesis, while remaining
    firmly rooted in synth design heritage. Crafted with the finest materials,
    including walnut wood and a striking aluminum exterior - polybrute 12 is
    designed to meet the demands of professional musicians as well as appeal to
    the enthusiasts. Its not just for looks either, the vents at the back
    provide passive cooling so polybrute can operate in complete silence.
specs:
  - 61-note mpe polyphonic keyboard with fulltouch technology
  - 12-voice polyphony with split, layer and unison capabilities
  - Two brute analog vcos generating sawtooth, triangle, and square waves
  - Metalizer and sub-oscillator
  - Cross-modulation and sync controls
  - Steiner 12db/octave multimode filter with continuous slope morphing between
    lowpass, highpass, bandpass and notch modes
  - Brute factor feedback control
  - Ladder 24db/octave lowpass filter with distortion overdrive
  - Dual analog filters configurable in series, parallel, or continuously
    variable
  - Three adsr envelope generators with velocity sensitivity
  - Third freely assignable eg with delay stage
  - Three lfos with waveform selection and shaping
  - Modulation matrix with 96-point digital patchbay
  - Up to 32 modulation destinations with 64 total connections
  - Morphe controller with x, y, and z pressure axis mapping
  - Ribbon controller positioned above keybed
  - 480 professionally designed presets with 768 memory locations
  - Polyphonic aftertouch expression across entire key movement range
  - Three aftertouch modes including fulltouch modes
  - Sequencer with up to 64-step polyphonic sequences
  - Velocity, accents, slides and randomization in sequencer
  - Three parallel modulation tracks
  - Arpeggiator with multiple note-stepping orders
  - Matrix arpeggiator hybrid mode with 16-step framework
  - Parameter motion recording
  - Stereo digital effects including chorus, phaser, flanger, ring modulation,
    delays, and reverbs
  - 9 delay algorithms including bbd and digital delay
  - 9 reverb algorithms including hall, plate, spring, and shimmer
  - Distortion effects including tape, classic distortion, soft clip, worn out
    tape, germanium, bitcrusher, downsampler
  - Stereo audio output
  - Control voltage in/out
  - MIDI in, out, and thru
  - USB connection for updates and preset management
  - 1 sustain pedal port and 2 expression pedal ports
  - Patch memory protection
  - Polybrute connect software for mac/pc and DAW plugin
  - Walnut wood and aluminum exterior construction
  - Passive cooling vents
  - "Size: 38.3 x 17.1 x 6.1 inches (972 x 435 x 156mm)"
  - "Weight: 50.7lbs (23kg)"
