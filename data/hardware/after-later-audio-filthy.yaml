description: A multimode filter offering simultaneous low-pass, band-pass,
  high-pass, and notch outputs in 6HP, with resonance capable of
  self-oscillation.
details: |-
  A multimode filter offering LPF, BPF, HPF, and NOTCH simultaneous outputs in 6HP.
specs: |-
  - Low pass filter (4 pole)
  - Band pass filter
  - High pass filter
  - Notch filter
  - Two audio inputs
  - Two FM inputs with an attenuverter for FM1
  - v/oct tracking for cutoff CV
  - CV over Resonance
  - Resonance will reach self-oscillation
