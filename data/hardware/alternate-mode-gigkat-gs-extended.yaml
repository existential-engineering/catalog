details: |-
  The GIGKAT GS EXTENDED+ is the new and improved version of the GIGKAT GS. The GIGKAT GS was jam packed with hundreds of sounds and as well as fantastic percussion libraries including

  On top of all that, we have managed to improve it even more!! The GIGKAT GS EXTENDED+ now includes an expanded ethnic percussion library including newly created "hybrid" melodic/percussion kits. Our new 4GB sound engine has new updated ethnic and melodic percussion kits along with tons of vibes, marimbas, timps, xylophones, bells as well as pianos, basses etc. This new module has upgraded signal to noise amplifiers as well as improved A/D converters. The output jacks are now TRS balanced ¼" connections, ensuring quiet output, perfect for studio recordings. The GS9.5 firmware chip is included, and can be easily installed at home to take advantage of the additional performance features available in the gigKAT GS EXTENDED+. The firmware chip is only compatible with version 4.0 or higher. Older versions require a hardware board upgrade. Please include your malletKAT's serial number and current version so that we send you the correct firmware chip.
specs: |-
  - Latin Percussion Library
  - World Percussion Library
  - Asian Percussion Library
  - Middle East Percussion Library
  - Orchestral Chromatic Percussion Library
  - A host of vibraphones, marimba, steel pan.
  - Guitars, Keys, Basses, Leads, Drums and much much more.
