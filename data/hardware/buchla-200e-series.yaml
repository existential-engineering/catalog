description: >-
  The Buchla 200e is a 21st century analog modular synthesizer system that combines
  classic 70s design with modern improvements including MIDI control, patch memory
  storage, and digital hybridization.
details: |-
  The 200e represents a rebirth of the classic 1970s Buchla 200 series analog modular systems. It maintains analog circuitry while incorporating 21st century enhancements such as internal MIDI buses, expanded voltage-controlled parameters, a signal/control voltage router, velocity sensitivity, and a redesigned output section.

  The system features a hybrid approach combining analog signal paths with digital componentry for stability and patch storage. Customers can configure systems from empty cabinets with modular components suited to their needs, with five cabinet sizes available ranging from 2 to 18 panels.

  The system stores knob settings and switch positions but not patch cable routings. Complete systems range from $10,000 to $30,000, with individual modules averaging around $1,000. Despite high cost and steep learning curve, the 200e continues Don Buchla's analog-modular synthesizer tradition.
specs: |-
  - Polyphony: Up to 8 notes (system dependent)
  - Oscillators: 261e Complex Waveform Generator, 260e Duophonic Pitch Class Generator
  - Multitimbral: Up to 4 parts with independent MIDI channels
  - Filter: 291e Triple Morphing Filter with voltage control
  - Envelope: 281e Quad Function Generator with attack/decay
  - LFO: 261e Complex Waveform Generator
  - VCA: 292e Quad VCA
  - VCF: 292e Quad VCF (lowpass filter)
  - Effects: 297 Voltage Controlled Phase Shifter (up to 1800 degrees)
  - Keyboard: 222e with 27 touch-sensitive velocity/pressure keys
  - Memory: 30 user presets for knob settings and switch positions
  - Control: Control Voltage, MIDI IN
  - Sequencer: 250e 16-stage sequence/function generator
releaseDate: "2005"
