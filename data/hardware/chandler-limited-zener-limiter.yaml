description: The EMI TG12413 Zener Limiter is a stereo/dual mono limiter
  conceived by Chandler Limited designer Wade Goeke and based on the vintage EMI
  circuits used to record The Beatles and Pink Floyd. Issued in celebration of
  the 75th birthday of Abbey Road Studios, it draws from the 1968 RS168 Zener
  Limiter and the TG12345 console channel strip.
details: |-
  Circuit Type: EMI TG, Transistor, Solid-state. Channels: Stereo / Dual Mono switchable. Feature Set: Input Gain High/Low switchable, stepped input control, stepped output control, compression modes (Comp 1, Comp 2, LIMIT), sidechain filter (Out, 30, 50, 90, 150, 300 Hz), 11-position switched attack, 21-position switched release, THD mode, true bypass. I/O: XLR (pin 2 hot), transformer balanced, custom wound. Power: External PSU-1, purchased separately. Part of the EMI Abbey Road Series. Created in partnership with Abbey Road Studios.
