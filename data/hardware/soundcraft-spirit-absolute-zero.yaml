details: |-
  The sturdy, vented cabinet design complements the 170mm low-frequency driver to give smooth, extended bass response and the soft-dome tweeter is mounted in a proprietary waveguide to ensure controlled dispersion. In the tradition of all good monitors, the wide frequency response remains even at all listening levels, both on and off axis - so you can be assured of consistent, dependable results every time. Furthermore, special attention has been paid to the impulse response of the system in order to give the most natural, uncoloured sound possible. Absolute Zero offers superb all-round performance, is remarkably versatile and comes at a price that is truly affordable. The in-line driver array, with its wideangle tweeter, means that Absolute Zero may be used horizontally or vertically. With flat response up to 30&deg; off-axis, speaker angle is less critical than with many monitors. In addition, the rear-ported design not only makes for a smaller front baffle area but also allows the speaker to be used in mid-room positions. Absolute Zero is rated at 95 Watts RMS but its high quality design permits the use of more powerful amplifiers, albeit with caution. The sturdy, recessed binding posts will accept bare wires, 4mm 'banana' plugs or 6mm fork terminals.
