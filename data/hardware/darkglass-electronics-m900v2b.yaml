description: The Microtubes 900 V2 is a 900W bass amplifier head with the
  signature Darkglass Microtubes engine, studio-grade compression,
  impulse-response cabinet emulation, a 6-band graphic EQ, and pre/post DI
  outputs. This is the black-cosmetic version.
details: |-
  The Microtubes 900 V2 bass head embodies the Darkglass ethos: uncompromising performance, incredibly versatile, and unapologetically loud. With studio-grade compression, impulse-response cabinet emulation, and the signature Darkglass Microtubes engine, it delivers all the options a modern professional bassist needs.

  The black cosmetic on this version is sleek, easier to read, and looks at home in any studio or on any stage. A 900W power section drives the signature Microtubes engine, with a studio-grade 6-band graphic EQ and an intelligent compressor.

  Cab simulation offers three selectable impulse responses, with memory for three IRs via the Cab Select switch. Connections include aux in, headphone output, and pre and post DI outputs. The Darkglass Suite software changes impulse responses and edits deeper features, and the amp can be controlled externally via DarkglassIFS or SIFS footswitches or a third-party MIDI controller.
specs: |-
  - 900W bass amplifier head with signature Darkglass Microtubes engine
  - Cab sim with 3 selectable impulse responses
  - Studio-grade 6-band graphic EQ and intelligent compressor
  - Aux in, headphone output, pre and post DI outputs
  - Memory for 3 impulse responses via the Cab Select switch
  - Darkglass Suite software for IR swapping and deeper editing
  - External control via DarkglassIFS or SIFS footswitches, or third-party MIDI controller
  - Black cosmetic finish
