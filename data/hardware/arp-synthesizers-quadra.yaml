description: >-
  The ARP Quadra is a four-section hybrid synthesizer combining bass, polyphonic, lead,
  and string synthesis with programmable memory and built-in effects.
details: |-
  The Quadra functions as a hybrid version of ARP's Omni II and Solus synths, featuring four distinct sections: a monophonic Bass synth occupying the lower two octaves, a Poly synth, a duophonic Lead synth with aftertouch in the upper octaves, and a String synth based on the Omni II with a phase-shift effect.

  Sounds are instantly recalled from memory via button push, with 16 program patches storing performance parameters. However, memory patches recall active parameter sliders rather than storing true sound data, limiting the programmability compared to later instruments.

  Key features include a Model 4075 4-pole voltage-controlled filter, a phase shifter effect, sample-and-hold, dual portamento controls, a superior arpeggiator, and balanced audio outputs for each section. The instrument also provides CV/Gate inputs and an ARP system interface for external connectivity.

  Notable limitations include a fragile mylar front panel and an autotune feature that constrains keys to play unusual intervals. Despite these quirks, the Quadra found use among many prominent artists.

  The ARP Quadra has been used by 808 State, ELO, Genesis, The Human League, Pink Floyd, New Order, Nick Rhodes of Duran Duran, Joe Zawinul, and filmmaker John Carpenter.
specs: |-
  - Four synthesis sections: Bass, Poly, Lead, and String
  - Polyphony: Monophonic (Bass), Duophonic (Lead), Polyphonic (String)
  - 61-key keyboard (5 octaves) with aftertouch on Lead section
  - Model 4075 4-pole 24dB/oct voltage-controlled filter
  - One ADSR VCA
  - 16 program memory patches
  - Built-in phase shifter and sample-and-hold
  - Dual portamento controls
  - Arpeggiator
  - Balanced audio outputs per section
  - CV/Gate inputs and ARP system interface
  - Production years: 1978-1981
