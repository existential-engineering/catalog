description: The MADI 316 Option is a factory-installed card that adds a sixteen
  channel 24-bit 192 kHz MADI digital output to the HV-316 microphone
  preamplifier. It carries optical and BNC MADI connections plus an external
  word clock input, and can clock from the incoming MADI stream.
details: |-
  The MADI 316 Option adds sixteen channels of MADI digital output to the HV-316 microphone preamplifier at up to 24-bit 192 kHz. It is built on an industry standard i64 style MADI card with custom software, and any HV-316 unit can have the option installed.

  Optical and BNC MADI input and output connectors are provided, along with an external word clock input. Clocking can be taken from the incoming MADI stream and defaults to 48 kHz. The card is installed at the factory and powered by the host preamplifier rather than a supply of its own.
specs: |-
  - Channels: 16 MADI outputs
  - Resolution: 24-bit, up to 192 kHz
  - Clocking: External from the MADI stream, defaults to 48 kHz
  - Connectors: Optical and BNC MADI input and output, external word clock input
  - Card: Industry standard i64 MADI style card with custom software
  - Host Compatibility: All HV-316 units
  - Installation: Factory-installed, powered by the host unit
