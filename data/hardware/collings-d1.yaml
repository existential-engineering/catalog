description: The D1 is a square-shouldered 14-fret dreadnought acoustic guitar
  built with a Sitka spruce top and Honduran mahogany back, sides, and neck. It
  delivers tonal clarity combined with depth and warmth, making it equally
  suited to vocal accompaniment and bluegrass flatpicking. The guitar features
  pre-war scalloped X-bracing, an ebony fingerboard with MOP long dot inlays,
  and a high-gloss nitrocellulose lacquer finish.
details: |-
  The D1 is the foundational dreadnought in the Collings acoustic lineup, representing the most popular steel-string body shape in the world. It is constructed with a Sitka spruce top braced with pre-war scalloped X-bracing and Honduran mahogany back, sides, and neck, joined via a mortise and tenon hybrid neck joint. The ebony fingerboard features a 14" to 26" compound radius and medium 18% nickel-silver frets, with a Modified V neck profile and a 1 11/16" bone nut. An ebony belly-style bridge holds a drop-in bone saddle, and nickel Waverly tuners with ebony buttons and MOP dot pins complete the hardware.
specs: |-
  - Body Style: Dreadnought (14-fret, square-shoulder)
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: MOP long dots
  - Bridge: Ebony belly-style
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Neck Profile: Modified V
  - Neck Joint: Mortise & tenon hybrid
  - Frets: Medium 18% nickel-silver
  - Bracing: Sitka spruce, pre-war scalloped X-brace
  - Truss Rod: Fully adjustable
  - String Spacing: 2 3/16"
  - Strings: D'Addario EJ-17 (.013"-.056")
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Rosette: b/w purfling
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
