specs: |-
  - Go wireless: Play along with tracks from your phone or tablet via wireless input. With an all new industry leading wireless input that accepts apple lossless, and APTX lossless codecs.
  - Three Legendary Voices: Craving that Marshall crunch, Vox chime, or Fender warmth? Flip the switch and dive into the iconic sounds of JMP, AC15, and FEND. Your tone, your rules!
  - Speaker and Cab Simulations: Mix and match Celestion Classic Lead 80, Celestion Vintage 30, and Jensen speakers with Closed Back, Open Back, or FRFR cabs. It's like having a whole studio in your pedalboard!
  - Pedalboard-Perfection: Four footswitches for Gain, Limiter, Reverb, and Boost, plus a Mono FX Send and Stereo FX Return. This little beast plays nice with all your favorite pedals.
  - Stereo Awesomeness: Rock out with TRS Stereo Headphone Out and XLR Stereo Output. Whether you're jamming at home or tearing up the stage, the DirectAmp has got you covered.
  - Compact and Mighty: At just 8.25" x 5" x 1.625" and 2.17 lbs, the DirectAmp is perfect for the gigging guitarist who needs a portable yet extensive solution.
  - Global ready 9-volt adapter No matter where your talent takes you, the DirectAmp adapter easily convert to various global AC plug configurations, ensuring you're ready to rock no matter where you are in the world!
  - GAIN: From sparkling clean to face-melting overdrive, sculpt your sound with precision.
  - LIMITER: Keep your tone tight and controlled, even at high volumes.
  - 3-BAND ACTIVE EQ: Fine-tune your Bass, Mids, and Treble to perfection.
  - REVERB: Add depth and space to your sound with a lush spring-type reverb that provides a rich ambient effect when used in STEREO mode.
  - Features - 3 Classic Amp Voices
  - 3 Speaker Types
  - 3 Cab Types
  - 3 Band EQ (Bass/Mid/Treble)
  - Wireless Connectivity (Can connect to your Bluetooth * enabled device )
  - Gain
  - Limiter
  - Reverb
  - Boost
  - Mono FX Send
  - Stereo FX Return
  - TRS Stereo Headphone Out
  - XLR Stereo Output
  - Aux Input
  - 4 Footswitches
  - Controls - Primary Controls - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies
  - LIMITER reduces gain just enough to prevent overdrive, and then restores gain as the note dies away
  - 3-Voice Switch: JMP, AC15 or Fend voicings
  - Cab Sim Switch (Open, Closed, or FRFR)
  - Speaker Type Switch: (CL-80, V30, or Jens)
  - Clean Channel Gain and Limiter
  - Q-Boost Switch (Flat, Bright, or Fat)
  - Boost Channel Gain and Output
  - 4 Footswitches (FX Loop, Reverb, Limiter, Boost)
  - Effects Controls - REVERB provides lively spring-type sound
  - FX LOOP (Mono send and Stereo return jacks)
  - Volume Controls - MASTER Regulates overall volume of entire mix without changing relative levels of AUX, WIRELESS, and GUITAR signals
  - Specifications Electronic Performance Input ¼" mono, 1M input impedance FX Loop Send (Mono) Unbalanced 1/4" jack: 1V peak, 1K impedance FX Loop Return (Stereo) Unbalanced 1/4" jacks:1V peak, 47K impedance XLR Stereo Line Out Balanced 600 ohm line, signal level +4dB at full MASTER setting Power Power Adapter 9 Volt Power Supply included (with global attachments ) Power Requirement 9V - 250ma Dimensions HxWxD 8.25" x 5" x 1.625" ( 10.8cm x 16.5cm x 2.5cm) Weight 2.17 lbs (1 kg)
  - Resources - The manual contains detailed info for setup and technical specs.
