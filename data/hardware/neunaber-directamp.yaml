  cab types, with stereo XLR and headphone outputs plus Bluetooth wireless
  input.
details: |-
  Meet your pedalboard's new best friend: The Quilter DirectAmp! Hey there pedalboard wizard! Ready to supercharge your rig? Say hello to the DirectAmp , the ultimate stereo amp and cab simulator that's here to make your tonal dreams a reality! Not just another gadget - it's your ticket to tonal paradise, straight into the PA or through your headphones in glorious stereo! Why You'll Be Obsessed:

