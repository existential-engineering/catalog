description: Designed for high-speed playing, the Pro-Mod San Dimas Style 1 HSS
  FR M delivers scorching sound, stunning style, and grin-inducing playing feel
  and performance, representing Charvel's storied legacy of innovative
  excellence. It pairs a classic alder San Dimas Style 1 body with a bolt-on
  graphite-reinforced maple neck, a 12"-16" compound radius maple fingerboard, a
  Floyd Rose 1000 Series double-locking tremolo, and a Seymour Duncan HSS pickup
  set for a versatile, high-performance super-strat.
details: |-
  The Pro-Mod San Dimas Style 1 HSS FR M features a gloss-finished alder San Dimas Style 1 body in Aqua Flake, mated to a bolt-on maple neck with graphite reinforcement, a hand-rubbed urethane finish, and a Speed Neck profile with rolled fingerboard edges. The maple fingerboard sports a 12"-16" compound radius, 22 jumbo frets, black dot position inlays with black side dots, a Floyd Rose 1000 Series locking nut (1.6875" width), and a 25.5" scale length. A heel-mount truss rod adjustment wheel allows quick neck relief tweaks.

  Electronics are an HSS configuration featuring a Seymour Duncan JB TB-4 humbucker in the bridge position, a Seymour Duncan Custom Flat Strat SSL-6 single-coil in the middle, and a Seymour Duncan Custom Flat Strat SSL-6 RWRP (reverse-wound/reverse-polarity) single-coil in the neck. Wiring runs through master volume and no-load tone controls and a 5-position blade pickup selector.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo, Charvel-branded die-cast tuning machines, knurled flat-top control knobs, a black switch tip, and standard strap buttons, all in chrome. The guitar ships strung with nickel-plated steel strings (.009-.042). Also available in Blizzard Pearl (model 2965033576).
