description: These award-winning headphone amps for electric guitar and bass
  deliver Blackstar tone anywhere.
details: |-
  Blackstar Tone & Performance — Anywhere. The amPlug 2 FLY is a pocket-sized headphone amp that plugs directly into the output jack of an electric guitar or bass, delivering award-winning Blackstar tone with no guitar cable required. With a foldable 180 degree jack, amPlug 2 FLY is designed to plug directly into all guitar and bass body shapes.

  amPlug 2 FLY Guitar and Bass both offer three uniquely customisable channels — Clean, Crunch and Lead channels for guitar; Classic, Modern and Overdrive channels for bass. The crunch and lead channels of the amPlug 2 FLY Guitar have been meticulously designed to clean up with your instrument volume, just like a real amp would, allowing for endless tonal textures and an addictive playing experience.

  amPlug 2 FLY Guitar features built-in effects — three reverbs, three delays and three chorus/modulation effects can be selected for any channel. amPlug 2 FLY Bass features six inbuilt rhythm/drum loops covering styles from Funk to Blues, so you can set your tempo and jam along with tap tempo control.

  amPlug 2 FLY comes equipped with Blackstar's patented ISF (Infinite Shape Feature) EQ on the guitar version, allowing you to effortlessly dial in incredible sounds. Fully counter-clockwise has an American characteristic with a tight bottom-end and aggressive middle; fully clockwise has a British characteristic which is more 'woody' and less aggressive. The speaker-emulated output provides realistic miked-up sounds, ideal for direct recording or running into a PA system, and the unit has been specifically designed to take pedals just like an amp would.

  Hours of continuous play time from two AAA batteries means you can play for longer on the FLY, and the auto power-off feature shuts the unit down after 30 minutes of no signal so you don't drain the batteries. An aux input lets you connect a phone or audio player to jam along with backing tracks.
