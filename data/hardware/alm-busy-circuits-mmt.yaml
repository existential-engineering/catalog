description: >-
  mmT is an expander module for the mmMidi that offers additional outputs for
  triggering drum and sample modules.
details: |-
  The mmT is a 3HP expander for ALM Busy Circuits' mmMidi MIDI-to-CV module. It maps the key presses of a third configured MIDI channel to a bank of eight dedicated trigger/gate outputs, making it well suited to firing drum and sample modules from an incoming MIDI stream.

  It connects directly to the 'expand' socket on the rear of the mmMidi using the supplied cable and is powered from the host module, adding drum-triggering duties without occupying the mmMidi's own outputs.
specs: |-
  - Format: Eurorack, 3HP
  - Depth: 38mm
  - Power: +12V 50mA / -12V 0mA
  - 8 trigger/gate outputs mapped from MIDI notes
  - Connects to mmMidi 'expand' header via supplied cable (bus-powered from host)
  - Warranty: 2 years
