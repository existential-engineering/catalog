details: |-
  The Px8 S2 McLaren Edition represents a special collaboration between Bowers & Wilkins, McLaren Automotive, and McLaren Racing. It merges the exceptional wireless sound and luxurious materials synonymous with Bowers & Wilkins' flagship over-ear headphones with a bold new McLaren-inspired design.

  The design incorporates papaya accents referencing founder Bruce McLaren's early racing cars — a color still used on McLaren's Formula 1 Team cars to this day. The headphones feature Anthracite Gray Nappa leather across every primary surface and metallic papaya-colored earcups, with an embossed McLaren logo on the headband.

  Audio is delivered through custom-designed drive units paired with powerful digital processing. The headphones support aptX Lossless and aptX Adaptive codecs for optimized connections between device and audio source, with a true 24-bit audio connection and a high-performance DSP with dedicated amplifier/DAC.

  The Bowers & Wilkins Music app enables direct streaming and complete control, integration with preferred streaming platforms, and personalized recommendations. Users can select the type of noise cancellation and launch voice assistants directly from the app.
