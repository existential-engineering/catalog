details: |-
  Px8 S2 McLaren Edition is a special-edition wireless over-ear noise-cancelling headphone and the newest expression of the partnership between Bowers & Wilkins, McLaren Automotive and McLaren Racing. It takes the flagship Px8 S2 platform and gives it a bold McLaren-inspired design, and sits at the Reference performance tier at the top of the Bowers & Wilkins over-ear range.

  The design references McLaren's racing heritage. Anthracite Grey Nappa leather covers every primary surface, the earcups are finished in metallic papaya, and an embossed McLaren logo sits on the headband. The papaya shade is drawn from the colour of founder Bruce McLaren's early racing cars and is still used on McLaren's Formula 1 cars today. The headphone is manufactured under licence from McLaren Automotive Limited.

  Sound comes from two 40mm dynamic full-range carbon drive units paired with a high-performance DSP and a dedicated amplifier and DAC, supporting a true 24-bit audio connection. Bowers & Wilkins calls the result its best sound quality ever. Active noise cancellation is fed by eight microphones in total, four per earcup, and call handling runs through the ADI Pure Voice algorithm.

  Wireless is Bluetooth 5.3 with aptX Lossless and aptX Adaptive, alongside aptX HD, aptX Classic, AAC and SBC, with multipoint connectivity, Apple MFi Made For iPhone support and Google Fast Pair. The Bowers & Wilkins Music app integrates streaming services, launches the phone's voice assistant, selects the type of noise cancellation and exposes a five-band customisable EQ plus a TrueSound mode.

  The rechargeable lithium-ion battery is rated at 30 hours of playback, with fast charging giving 7 hours from a 15-minute charge. Headphone weight is 0.31kg and the supplied carry case measures 177mm wide by 60mm deep by 234mm high. The single physical port is a USB-C socket used for both charging and audio; the supplied 1.2m USB-C to 3.5mm stereo jack cable is how an analogue source is connected, so there is no dedicated 3.5mm jack on the headphone. One finish is offered, Anthracite Grey with Papaya.
