description: >-
  Limited edition run of 50 premium Axis guitars featuring a hand-selected,
  one-piece quilt maple top, white birdseye maple neck, and figured roasted
  maple fingerboard — paired with exclusive finishes and a custom G&G tolex
  case.
details: |-
  This exclusive 50-instrument release combines the iconic Axis specs — custom-wound DiMarzio pickups, basswood body, and the signature asymmetrical neck shape — with hand-selected premium materials.

  The collection includes 20 units in Translucent Gold, 15 in Translucent Blue (both with matching painted headstocks and chrome hardware), and 15 in Natural with Gold Pearl backs paired with gold hardware.

  Each guitar features a hand-selected one-piece quilt maple top over a basswood body, paired with a white birdseye maple neck and a figured roasted maple fingerboard. Every instrument ships in a custom G&G black tolex case.
specs: |-
  - Body wood: Basswood with premium one-piece quilt maple top
  - Body finish: High gloss polyester
  - Neck wood: White birdseye maple
  - Neck radius: 10"
  - Neck width: 1-5/8" at nut, 2-3/16" at last fret
  - Fingerboard: Figured roasted maple
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25-1/2"
  - Pickups: HH — 2 DiMarzio custom humbucking
  - Controls: 500k volume pot
  - Switching: 3-way toggle pickup selector
  - Bridge: Music Man double-locking tremolo with fine tuners
  - Tuning machines: Schaller M6LA with pearl buttons
  - Hardware: Chrome or gold (varies by finish)
  - Strings: 9p-11p-16p-24w-32w-42w (RPS 9 Slinkys)
  - Case: Custom G&G black tolex
