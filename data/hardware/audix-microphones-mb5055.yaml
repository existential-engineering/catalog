details: |-
  The MicroBoom System is produced in three lengths: 24″, 50″, and 84″ and comes with a carbon fiber rod compatible with any of The Micros. Lightweight, able to attach to any microphone stand, the MicroBoom is a problem solver for many hard-to-reach miking applications including choir, live theater, and orchestra.

  The MicroBoom can be used with any of the microphones in The Micros series providing a broad selection of pick-up patterns, output levels, and frequency responses. High quality shielded cable is used internally to insure the cleanest audio signal path between the microphone and the bottom of the boom. The stand adapter offers total control over the angle, rotation, and position of the carbon fiber rod by way of a flexible metal gooseneck. The MicroBoom provides an ultra-clean, professional, and elegant appearance on stage while providing exceptional performance and portability.

  Designed, assembled, and tested by AUDIX in the USA.

  MICROBOOM SYSTEMS
  The MICROBOOM System comes with a carbon fiber boom (24″, 50″ or 84″), microphone (M1250B, M1250BHC, M1255B, or M1255BHC), clutch assembly, 25′ shielded cable and windscreen. Available in white or black finish.

  Model Variations
  24 Series
  MICROBOOM24 – 24″ (610 mm) carbon fiber boom and clutch assembly ONLY (NO MICROPHONE, NO CABLE). Black.
  MB2450 – 24″ carbon fiber boom with M1250B cardioid microphone, clutch assembly, and cable. 18 – 52 V phantom power. Black.
  MB2450HC – As above with M1250HC hypercardioid capsule. Black.
  MB2455 – As above with M1255B high output cardioid capsule. Black.
  MB2455HC – As above with M1255BHC hypercardioid capsule. Black.

  50 Series
  MICROBOOM50 – 50″ (1270 mm) carbon fiber boom and clutch assembly ONLY (NO MICROPHONE, NO CABLE). Black.
  MICROBOOM50W – As above. White.
  MB5050 – 50″ carbon fiber boom with M1250B microphone, clutch assembly, and cable.
  18 – 52 V phantom power. Black.
  MB5050W – As above. White.
  MB5050HC – As above with M1250BHC hypercardioid capsule. Black.
  MB5050WHC – As above. White.
  MB5055 – As above with M1255B high output cardioid capsule. Black.
  MB5055W – As above. White.
  MB5055HC – As above with M1255BHC hypercardioid capsule. Black.
  MB5055WHC – As above. White.

  84 Series
  MICROBOOM84 – 84″ (2134 mm) carbon fiber boom and clutch assembly ONLY (NO MICROPHONE, NO CABLE). Black.
  MICROBOOM84W – As above. White.
  MB8450 – 84″ carbon fiber boom with M1250B microphone, clutch assembly, and cable.
  18 – 52 V phantom power. Black.
  MB8450W – As above. White.
  MB8450HC – As above with M1250BHC hypercardioid capsule. Black.
  MB8450WHC – As above. White.
  MB8455 – 84″ carbon fiber boom with M1255B microphone, clutch assembly, and cable.
  18 – 52 V phantom power. Black.
  MB8455W – As above. White.
  MB8455HC – As above with high output M1255BHC hypercardioid capsule. Black.
  MB8455WHC – As above. White.
