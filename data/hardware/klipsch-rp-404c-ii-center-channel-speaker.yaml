name: RP-404C II
manufacturer: klipsch
primaryCategory: speaker
url: https://www.klipsch.com/products/rp-404c-ii-center-channel-speaker
description: The Klipsch RP-404C II is a sealed, shallow-depth center channel
  speaker from the Reference Premiere series, featuring four 4" Cerametallic
  woofers and a 1" titanium LTS vented tweeter with a 90° x 90° Tractrix horn.
details: |-
  The RP-404C II delivers crystal-clear dialogue and vocals as part of Klipsch's Reference Premiere lineup. The 90° x 90° silicon composite hybrid Tractrix horn maximizes efficiency and focuses high frequencies toward the listening area. Proprietary Tractrix geometry provides the most efficient transfer of high-frequency waves, and the phase plug with compressed molded silicon face ensures smooth frequency response. The second-generation horn increases size for a larger soundstage and enhanced directivity.

  The exclusive Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for enhanced, detailed performance. A vented tweeter housing reduces standing waves that create unwanted harmonics, resulting in enhanced detail and clarity in high-frequency reproduction.

  The all-new Cerametallic woofers are exceptionally rigid and lightweight for minimal distortion and maximum efficiency. New aluminum shorting rings (Faraday rings) reduce distortion while increasing power handling. The redesigned motor structure improves transient response with greater speed and accuracy.

  The shallow-depth sealed enclosure allows the speaker to be used for in-wall placement and prevents bass-loading against a back wall in tight spaces like fireplace mantles, resulting in crisp, clear vocals in a small and versatile package. Cork pads replace rubber bumpers for security on a stand or table. Available in ebony vinyl and walnut vinyl finishes.
