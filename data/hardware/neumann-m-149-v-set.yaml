description: The M 149 Tube is a modern version of Neumann's famous M 49
  microphone. Like its predecessor, it uses the classic K47/49 large diaphragm
  capsule in an acoustically open headgrille.
details: |-
  Studio Tube Microphone

  Features:
  - 9 directional characteristics
  - 7-position low cut
  - Same capsule as the legendary U 47 and M 49 microphones
  - Tube electronics with very low self-noise
  - Same capsule as the legendary Neumann M 49
  - Classic sound in nine directional patterns
  - Seven-position low cut switch
  - Tube circuit with extremely low self-noise
  - Transformerless output stage
  - Comes with power supply
specs: |-
  - Acoustical Operating Principle: Pressure gradient transducer
  - Directional Pattern: Omnidirectional, wide angle cardioid, cardioid, hypercardioid, figure-8 plus one intermediate position each
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity At1 kHz Into1kohm: 34/47/62 mV/Pa (Omni/cardioid/8)
  - Rated Impedance: 50 ohms
  - Rated Load Impedance: 1 kohms
  - Equivalent Noise Level CCIR: 28/25/23 dB (Omni/cardioid/8)
  - Equivalent Noise Level A Weighted: 16/13/11 dB-A (Omni/cardioid/8)
  - Typical SPL For K0_5 Percent: 120 dB
  - Typical SPL For K5 Percent: 136 dB
  - Signal To Noise Ratio CCIR: 66/69/71 dB (Omni/cardioid/8)
  - Signal To Noise Ratio A Weighted: 78/81/83 dB (Omni/cardioid/8)
  - Maximum Output Voltage: 18 dBu
  - Dynamic Range Amplifier THD0_5 Percent: 101 dB
  - Dynamic Range Amplifier THD5 Percent: 121 dB
  - Power Supply: N 149 A
  - Matching Connector: Microphone: DIN 8 F, Power Supply: XLR 3 F
  - Weight: approx. 730 g
  - Diameter: 70 mm
  - Length: 201 mm
  - Tube: Subminiature triode
  - Capsule: K 47/49 large diaphragm dual diaphragm capsule
  - Low Cut: 7-position (20 to 160 Hz in half-octave steps)
  - Directional Patterns: 9 (omni, wide cardioid, cardioid, hypercardioid, figure-8, plus 4 intermediate positions)
