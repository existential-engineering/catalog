description: Dual drive and boost pedal with a high-voltage boost side, a
  saturated multistage gain side, and order switching for pro rigs.
details: |-
  The D&M Drive, developed with Dan and Mick of That Pedal Show, puts a boost and a drive in one enclosure. The high-voltage boost side is built to push an amp, delivering a large amount of headroom with a distinct midrange voice that can be dialled in for lead work, and it grows into a smoothly saturated midrange as it is turned up.

  The drive side runs multiple gain stages, from a low-gain overdrive for chord work through to a heavily saturated, sustaining lead tone with quick attack and plenty of high and low end. Each side stands on its own and the two can be stacked.

  A toggle sets which side comes first when both are engaged, so a round boost can feed a driven gain stage or a driven tone can be boosted afterwards. TRS insert cabling allows the pedal to be integrated into a professional switching system and the two sides addressed as independent effects. The pedal won a 2017 Guitar Player Magazine Editor's Pick award.
