details: |-
  Crafted with a redwood top with a black edgeburst finish, East Indian rosewood back and sides, mahogany neck, and ebony fretboard. Accented by brass inlays and Gotoh open-gear tuners. Strung with Elixir Phosphor Bronze light-gauge strings, this guitar combines visual elegance with powerful tonal response. Bright, controlled, and impressively loud, it delivers articulate tone and remarkable balance across the spectrum. Equally suited for fingerpicking or strumming, this versatile instrument is as striking to look at as it is to play. Complemented by BREEDLOVE'S Soft C low-profile neck and an LR Baggs Anthem pickup system, it offers effortless playability and performance-ready tone.
