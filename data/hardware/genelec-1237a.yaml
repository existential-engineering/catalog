details: |-
  The 1237A is Genelec's smart three-way main studio monitor, designed to deliver reference-grade performance for the most demanding professional environments. Positioned as the spiritual successor to the long-running 1037 main monitor, the 1237A carries that heritage into the modern Smart Active Monitoring (SAM) era and is widely deployed flush-mounted into the walls of music, post-production and broadcast facilities where uncompromised accuracy and high SPL are required.

  Its three-way driver complement combines a 305 mm (12 in) bass cone, a 125 mm (5 in) midrange cone and a 25 mm (1 in) metal-dome tweeter, each driven by its own dedicated amplifier through active crossovers for tight phase and amplitude control. Genelec specifies a frequency response of 37 Hz to 20 kHz (plus/minus 2.5 dB), a short-term maximum SPL of at least 118 dB and a peak SPL of at least 122 dB at 1 m, supported by 950 W of total onboard amplification (500 W Class D bass, 250 W Class D midrange and 200 W Class AB treble).

  As part of the Smart Active Monitoring family, the 1237A integrates with Genelec Loudspeaker Manager (GLM) software via a redundant pair of RJ45 control connectors. GLM allows the monitor to be configured, level-matched and calibrated for its specific listening environment, compensating for room-induced colouration and producing a consistent, neutral response at the engineer's position. Intelligent Signal Sensing (ISS) drops the monitor into a very low-power standby state (under 0.5 W) when no signal is detected for a configurable period, supporting modern energy-efficiency requirements.

  Acoustic design centres on Genelec's Directivity Control Waveguide (DCW), which shapes a wide, even radiation pattern, controls early reflections at the listening position and yields a smooth power response - critical for flush-mounted and large-room applications. Comprehensive protection circuitry guards each driver and amplifier section against overload, while the cabinet is engineered for soffit mounting in custom installations, complementing applications such as music production, mastering and film and drama post-production.

  Connectivity covers the typical needs of a professional control room: a balanced XLR analog input (10 kOhm), an AES/EBU digital input on XLR (110 Ohm) with a digital output/thru for daisy-chaining a second monitor, and two RJ45 connectors for the GLM control network. Universal mains operation (100-240 VAC, 50/60 Hz) and a maximum power consumption of 750 W at full output round out the installation profile. The product code on the page is 1237APM.
specs: |-
  - Configuration: Active 3-way main studio monitor (Smart Active Monitoring)
  - Frequency response: 37 Hz - 20 kHz (+/- 2.5 dB)
  - Low cutoff -6 dB: 32 Hz
  - High cutoff -6 dB: 22 kHz
  - Short-term max SPL: >=118 dB
  - Long-term max SPL: >=112 dB
  - Peak SPL: >=122 dB
  - Self-generated noise: <=10 dB SPL
  - Harmonic distortion: <=3% (50-200 Hz), <=0.5% (>200 Hz)
  - Group delay: 5.0 ms
  - Bass driver: 305 mm (12 in) cone
  - Midrange driver: 125 mm (5 in) cone
  - Treble driver: 25 mm (1 in) metal dome
  - Bass amplifier: 500 W Class D
  - Midrange amplifier: 250 W Class D
  - Treble amplifier: 200 W Class AB
  - Total amplifier power: 950 W
  - Mains voltage: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): <=0.5 W
  - Power consumption (idle): <=25 W
  - Power consumption (full output): 750 W
  - Height: 680 mm
  - Width: 400 mm
  - Depth: 380 mm
  - Weight: 42 kg (92.6 lb)
  - Analog input: XLR female, balanced, 10 kOhm
  - Digital input (AES/EBU): XLR female, 110 Ohm
  - Digital output / thru (AES/EBU): XLR male, 110 Ohm
  - Control network: 2 x RJ45 (CAT5) for GLM
