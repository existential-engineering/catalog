description: The Zoom R16 instantly transforms any environment into a recording
  studio. Not only does it offer 16 tracks for recording, it can also be used as
  a DAW control surface and audio interface.
details: |-
  The R16 provides sixteen tracks for recording and playback (up to eight tracks can be recorded simultaneously) in full fidelity WAV format, making it ideal for both professional production and for use as a musical sketchpad. Battery operation allows for field recording. External microphones or line-level sources connect directly to the R16, or the built-in stereo mic pair can be used for minimal setup. Instruments such as electric guitar or bass plug straight in. When a multitrack recording is complete, the R16's internal mixer, complete with real faders, equalization, panning, and 135 built-in DSP effects including amp models and mastering effects like multi-band compression, creates a stereo mix.

  Mackie Control emulation enables the R16 to act as a full-featured control surface for DAWs such as Cubase, Logic, Ableton Live, and Sonar, adding physical faders and transport and status buttons. Five assignable function keys set marker points and initiate advanced editing operations.

  The R16 offers eight inputs on combo connectors which accept either XLR or 1/4-inch balanced or unbalanced cables. All can handle mic and line level signals, and Input 1 can also handle instrument-level signals from passive or active electric guitars and basses. Phantom power of +48 volts can be applied to Inputs 5 and 6. There are dual balanced 1/4-inch TRS output jacks and a headphone output with a dedicated volume control.

  135 studio-quality DSP effects are provided, including insert effects such as equalization and dynamics processing and send-return effects such as reverb, delay, chorus, flanging, and phasing. There are guitar amp, bass amp, and mic preamp models, effects designed for vocals and stereo instruments, and mastering algorithms such as multi-band compression. Effects can be applied during recording and mixdown, or used for playback only. The USB port lets the R16 send and receive digital data and act as an 8-input/2-output interface for DAW software. All level meters and the onboard chromatic tuner remain operational when the R16 is used as an interface, and at 44.1 kHz the input signal can be routed through the onboard DSP effects. Two R16s can be synchronized via USB for 32 tracks of playback and 16 tracks of simultaneous recording.

  Six AA batteries, either alkaline or rechargeable NiMH, are all that is required for power, with alkaline battery life of more than 4.5 hours even during continuous recording. The included AD-14 AC adapter powers the R16 from a wall socket, and the R16 can also be powered via USB when connected to a computer. Recording goes directly to SD media, with support for both standard SD and SDHC cards up to 32 gigabytes, for a maximum of 100 track hours.
specs: |-
  - 16-track playback, 8-track simultaneous recording
  - Built-in stereo condenser microphones (omnidirectional)
  - Records to SD and SDHC cards up to 32 GB, for up to 100 track hours
  - Records 16 / 24-bit, 44.1 kHz mono and stereo WAV files
  - Eight mic/line level inputs on XLR/TRS combo connectors
  - Input 1 switchable to Hi-Z (470 kOhm) for instrument-level signals such as electric guitar or bass
  - +48 V phantom power on Inputs 5 and 6
  - Dual balanced 1/4-inch TRS output jacks
  - Headphone output with dedicated volume control (20 mW x 2 into 32 Ohm)
  - Built-in metronome (5 tones, 40.0 to 250.0 BPM) and chromatic tuner (chromatic, guitar, bass, open A/D/E/G, D modal)
  - 135 send-return and insert DSP effects: 330 insert and 60 send-return patches, 7 insert and 2 send effect modules, 390 patch memories
  - 8 effect algorithms: CLEAN, DISTORTION, ACO/BASS SIM, BASS, MIC, DUAL MIC, STEREO, MASTERING
  - 9 faders (8 mono plus master), 3-band EQ, pan and two effect sends per track
  - Stereo link selectable across tracks 1/2 to 15/16
  - Internal track bouncing and mixdown of multitrack to stereo
  - Punch-in/out (manual and auto), A-B repeat, undo/redo, divide file editing, invert track phase
  - Up to 100 marks per project, 1000 projects
  - 8-in/2-out USB audio interface, 24-bit, 44.1 / 48 / 88.2 / 96 kHz
  - 96 kHz 24-bit delta-sigma AD and DA conversion
  - Control surface functionality (Mackie Control emulation)
  - 20-digit 2-line backlit custom LCD, 4-segment LED level meters
  - USB 2.0 operation as audio interface, control surface or mass storage, plus SD card reader function
  - Runs on 6 AA batteries (more than 4.5 hours alkaline) or the supplied AD-14 DC 5V 1A adapter, plus USB bus power
  - 376 mm (W) x 237.1 mm (D) x 52.2 mm (H), 1.3 kg
