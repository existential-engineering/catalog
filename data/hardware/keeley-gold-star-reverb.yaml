details: |-
  The Gold Star Reverb is one of Keeley's studio-themed reverbs, taking the Wall of Sound production approach as its starting point and extending the room compression and heavily driven mixing faders of that era. It offers three reverb modes: compressed, distorted and flanged, each reusing the Depth and Vinyl controls for different parameters.

  In Compression mode the reverb trails duck or compress as playing gets heavier, with Depth setting the compression threshold and Vinyl setting the ratio. Keeley suggests it for synth leads in dance music, for vocals needing clarity, and for blues guitar where note definition matters against the reverb. Distorted mode applies a thick distortion to the trails, with Vinyl controlling the amount of distortion and Depth setting pre-delay time, which can be set for a distorted slap-back effect.

  Flanged mode holds two voicings, selected with the Vinyl control: flanger reverb to the left of centre and a sun-drenched vinyl reverb to the right, which adds a random pitch vibrato to the reverb. This mode has the longest trails of the three. Throughout, the pedal includes vintage microphone and tape machine response emulations modelled on the RCA 44 and the Ampex 350, with some AM radio response. Turning the Vinyl control down leaves the three plain reverb voicings.
