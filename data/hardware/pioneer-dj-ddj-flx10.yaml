details: |-
  4-channel professional DJ controller. The DDJ-FLX10 is a 4-channel performance DJ controller for rekordbox and Serato DJ Pro. It includes a host of brand-new features including STEMS technology, which enables new creative possibilities such as the easy performance of mash-ups on the fly with no need to prepare tracks in advance. Key features: STEMS for innovative performances including live mashups; See details of the STEMS function; Expanded On Jog Display; New Mix Point Link for seamless transitions; DMX output for rekordbox Lighting function; Evolved MAGVEL FADER 4-sensor system; rekordbox, Serato DJ Pro, and djay Pro compatibility; Multicolored jog ring.
