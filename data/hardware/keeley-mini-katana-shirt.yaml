description: "- 35dB Boost - Dual Class A JFETs - 4 Modes with Filter + Gain"
details: |-
  The Mini Katana is a smaller version of Keeley's oldest design, a clean boost offering over 35dB of gain. The Katana circuit began in 2002 inside the Time Machine Boost, a dual Class A JFET design that players often left switched on, and in some rigs stacked two or three at a time.

  The Mini Katana adds a four mode layout. Two internal micro switches combine for four sounds: a Hi-Gain switch takes the pedal into overdriven territory, a Hi-Cut switch, new to the Mini, warms the tone for brighter single coil guitars, and both together give a thick, tube-amp voiced boost with plenty of volume available.

  The cascading FET stages are the source of the tube-like character, predating the blue LED and non-diode clipping stages used in other boosts. In the smaller enclosure it is intended to fit any pedalboard.
specs: |-
  - Over 35dB of clean boost
  - Dual Class A JFET circuit, cascading FET gain stages
  - Four modes from two internal micro switches: Hi-Gain and Hi-Cut
  - Mini enclosure, smaller than the standard Katana
