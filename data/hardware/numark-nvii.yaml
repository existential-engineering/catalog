description: NVII Intelligent Dual-Display controller for Serato DJ.
details: |-
  ReiNVenting DJ Performance

  The NV II with its sleek design, seasoned with red and white colors, really grabs your attention. But it's so much more — it improves on the superior performance of the original NV! Suited and tailored with an eye-catching symmetrical design, the NV II features an upgraded layout with clear markings for fast, responsive operation.

  Aside from its 4.3-inch full-color screens, the NV II adds gridlines on the screens so you can seamlessly beat match your tracks. It also adds a 5-column sort to view your music by song, artist, time, BPM and key.

  Touch and Feel the Mix

  The adaptive 5-inch touch-activated platters, touch-capacitive EQ, FX and filter knobs, and the highly-advanced touch-adaptive jog wheels give you free range to carve out a custom sonic mix on the fly.

  Performance Trigger Pads

  Create your own remix during your performance with 16 velocity-sensitive pads. RGB backlit pads with color-coded feedback for each mode make switching in and out a liquid operation. Great for finger drumming, looping, sample slicing, hot cues and more.

  Four Deck Control and Pro I/O

  With four decks of Serato DJ control and a road-ready I/O complement (XLR master outs, RCA Master/Booth outs, balanced 1/4" mic input, 1/4" and 1/8" headphone outs), the NV II fits in any environment.
specs: |-
  - 4-decks of Serato DJ software control in a sleek, low-profile design
  - Integrated displays let you focus on the music, not the computer
  - Full-color displays provide 1:1 real-time visualization of Serato DJ
  - Dedicated hardware controls for all critical software functions
  - Gridlines on screen enable perfect beat matching
  - 5-column options to show Song, Artist, Time, BPM, and Key
  - Dual 5-inch hyper-responsive metal platters with search and scratch modes
  - Adaptive learning platter technology for optimum response in any environment
  - 16 velocity-sensitive trigger pads with backlit RGB feedback
  - 10 pad modes for hot cues, loop slicing, and sample triggering
  - Mouseless library browsing controls with dedicated on-screen feedback
  - Integrated BPM metering for manual beat matching; Sync button for an instant match
  - Pro-grade crossfader with Fader Start and curve adjustment
  - Built-in professional USB 2.0 audio interface
  - Aux and balanced mic inputs seamlessly integrate additional audio sources
  - Zone/booth outputs and balanced XLR outputs for club use
  - Serato DJ included via download
  - Supported OS: Windows 7 and up; Mac OS X 10.8 – macOS 10.14 Mojave
  - Sample Rate: 44.1 kHz
  - Bit Depth: 16-bit
  - Output Level: 2.25 Vrms (100% Master Volume); 1.19 Vrms (80% Master Volume)
  - Signal-to-Noise Ratio: -112 dB (100% Master Volume, A-weighted)
  - Total Harmonic Distortion + Noise: 0.005% (100% Master Volume)
  - Power: 12 V DC, 2 A, center-positive; power adapter included
  - Dimensions (W x D x H): 21.6" x 13.4" x 2.1"
  - Weight: 7.0 lbs
