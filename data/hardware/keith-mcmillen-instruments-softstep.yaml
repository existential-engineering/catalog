description: SoftStep3 is a MIDI foot controller whose pads sense pressure in
  three dimensions, with TRS MIDI out, two CV outputs, an expression pedal input
  and MIDI over USB-C.
details: |-
  SoftStep3 is a MIDI foot controller that sends MIDI notes, CC and program change messages. Each of its 10 keys carries sensors that detect pressure in three dimensions, so the x, y and z axes can be mapped to CCs for continuous control of effects parameters while playing.

  Each key is programmed with the SoftStep Editor software, which assigns the notes, CC numbers and program change messages a key sends. An expression pedal can be plugged in and mapped to send MIDI CC messages.

  Connections cover MIDI over USB-C, a TRS MIDI output for 5-pin MIDI hardware and synthesizers using the type A wiring standard, and two CV outputs that send pitch and gate messages to Eurorack and modular rigs.
specs: |-
  - 10 keys, each with sensors detecting pressure in 3D on the x, y, and z axes
  - Sends MIDI notes, CC numbers, and program change messages
  - Programmed with the SoftStep Editor software
  - TRS MIDI output (type A) for 5-pin MIDI hardware and synthesizers
  - 2 CV outputs for pitch and gate to Eurorack and modular synthesizers
  - Expression pedal input sends MIDI CC messages
  - MIDI over USB-C
  - USB bus powered, no external power supply
