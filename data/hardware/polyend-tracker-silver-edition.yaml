description: A limited-edition version of the original Polyend Tracker with an
  all-aluminum body, silver brushed aluminum top, black bottom, and square
  low-profile keys, shipping with a free hard case.
details: |-
  The Tracker Silver Edition is a limited-edition version of the original Polyend Tracker. It shares the same feature set as the original Tracker but wraps it in a full metal body with a silver brushed aluminum top, a black bottom, and square, low-profile keys. Each unit ships with a free hard case included.

  At its core the Tracker is a standalone, portable workstation that combines a sampler, wavetable and granular synthesizer, and an FM radio for sound sources. A chain of sound-design tools (volume, tuning, panning, resonant filters, delay and reverb sends, ADSRs, LFOs, and overdrive) can turn any sample into a playable instrument. Samples can be recorded via line or mic inputs, sliced, mangled, or resynthesized.

  The interface pairs a large high-resolution screen with a mechanical keyboard and a metal haptic knob for fast navigation, alongside a grid of 48 backlit silicon pads for note and pattern entry that also functions as a customizable scale-based keyboard controller.

  A powerful step sequencer and song arranger, plus a performance mode for live pattern mangling, round out the workflow. Bidirectional MIDI lets the Tracker sequence and control external gear or act as a sound module, and MOD file compatibility allows importing and exporting tracks from classic and modern software trackers.
specs: |-
  - Sampler with slicer, sample editor, and sample recorder
  - Wavetable and Granular synthesis
  - Built-in FM radio as a sound source
  - Instrument chain: volume, tuning, panning, resonant filters, delay and reverb sends, ADSRs, LFOs, overdrive
  - Powerful step sequencer and song arranger
  - Performance mode for live pattern mangling
  - Bidirectional MIDI (sequence/control external gear or act as a sound module)
  - 48 backlit silicon pads, also usable as a customizable keyboard controller with editable scales
  - High-resolution screen, mechanical keyboard, metal haptic knob
  - MOD file import/export compatibility
  - Full metal body: silver brushed aluminum top, black bottom, square low-profile keys
  - Free hard case included
  - Powered via USB (any standard USB power source)
  - Height (w/ knob): 1.3 in (3.3 cm)
  - Width: 11.02 in (28.2 cm)
  - Depth: 8.15 in (20.7 cm)
  - Weight: 2.65 lb (1.2 kg)
  - In the box: USB-A power adapter, USB-C cable (2 m), stereo 3.5mm to 2x mono 6.3mm adapter, minijack to MIDI DIN adapter (Type B), 16GB MicroSD card, MicroSD to USB-A adapter
