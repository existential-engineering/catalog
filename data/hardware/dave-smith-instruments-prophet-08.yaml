description: >-
  The Prophet '08 is a modern programmable analog synthesizer with eight voices of
  polyphony that revives the classic Sequential Circuits Prophet lineage. It features a
  100% analog signal path with digitally controlled oscillators and Curtis filters,
  combining vintage tone with contemporary performance capabilities including velocity,
  aftertouch, and full MIDI functionality.
details: |-
  Dave Smith is acknowledged as a legendary synthesizer designer who founded Sequential Circuits and created influential instruments including the Prophet 5 and Prophet VS. His pioneering work extended to bringing MIDI technology to synthesizers. The Prophet '08, introduced in 2007, represents the culmination of this heritage.

  The Prophet '08 distinguishes itself from competitors by employing genuine analog circuitry rather than merely attaching vintage names to digital instruments. It incorporates Curtis filters and analog oscillators comparable to the original Prophet series, yet updated to meet contemporary musical demands. The design philosophy emphasizes evolution rather than pure nostalgia.

  Beyond core synthesis capabilities, the Prophet '08 incorporates modern performance features including velocity sensitivity, aftertouch, an arpeggiator, and a gated 16x4 step sequencer. The instrument offers deep modulation possibilities with four LFOs and three loopable envelope generators, exceeding what the classic Sequential Circuits instruments could achieve.

  A Special Edition variant released in 2008 celebrated thirty years of Dave Smith synthesizers. This premium version featured illuminated pitch and modulation wheels, exotic leopard-wood panels, a commemorative signed overlay, editor software, and a documentary DVD.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 digitally controlled analog oscillators per voice
  - Waveforms: Sawtooth, triangle, saw/triangle mix, pulse with PWM, hard sync
  - Noise: White noise generator
  - LFOs: 4, all MIDI syncable
  - Filter: 1 Curtis analog low-pass per voice, selectable 2-pole and 4-pole, self-resonating in 4-pole mode
  - VCA: Analog voltage-controlled amplifier
  - Envelopes: 3 ADSR with delay (filter, VCA, assignable), loopable envelope 3
  - Keyboard: 61-key semi-weighted with velocity and aftertouch
  - Memory: 256 programs across 2 banks, each with 2 layers
  - Arpeggiator: Yes, MIDI syncable
  - Sequencer: Gated 16x4 step sequencer, MIDI syncable
  - MIDI: In, Out, Thru, Poly Chain
  - Control Inputs: Pedal/CV input (0-5VDC)
