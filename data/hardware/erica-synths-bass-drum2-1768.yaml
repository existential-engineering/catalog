details: |-
  Erica Synths Bass Drum2 is developed in collaboration with the French company e-licktronic and is Erica Synths' take on analogue bass drum circuits adapted for modular systems. Massive, punchy sound, Accent and CV control over key parameters of the module make it distinctively expressive in live performances.

  The Bass Drum2 has a unique take on the same concept, 909 based as before but with a Trigger/Gate mode. In Gate Mode the Bass Drum2 reacts to gated signals, which makes it possible to create sustained drum sounds. By modulating the gate length, patching the Gate output of the preferred sequencer into the Trigger input and setting various gate lengths, unconventional Bass Drum patterns can be designed.

  Panel controls cover Pitch, Tune and Tune Depth alongside Attack, Decay and Drive. CV control with attenuators is available over Pitch, Decay and Drive, and a manual trigger plus an Accent input add expression.

  The audio output runs -5V to +5V and CV level covers -5V to +5V across the full span. Trigger level is 5V with a trigger time of 1ms. The module is 14HP wide and 35mm deep, drawing +40mA and -30mA.
specs: |-
  - Audio output level -5…+5V
  - CV level (full span) -5V - +5V
  - Trigger level 5V
  - Trigger time 1ms
  - Power consumption +40mA, -30mA
  - Module width 14HP
  - Module depth 35mm
  - Pitch, Tune, Tune Depth controls
  - Attack, Decay, Drive controls
  - CV control with attenuators over Pitch, Decay and Drive
  - Manual trigger
  - Accent for better expression
  - Trigger/Gate mode for sustained drum sounds
