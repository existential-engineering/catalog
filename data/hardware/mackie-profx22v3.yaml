description: Designed for musicians and creators who want high-resolution audio,
  the Mackie ProFX22v3 is a professional USB analog mixer with award-winning
  Onyx mic preamps.
details: |-
  Designed for musicians and creators who want high-resolution audio, the Mackie ProFX22v3 is a professional USB analog mixer with award-winning Onyx mic preamps and a high-resolution GigFX engine, for applications that range from studio recording to live sound reinforcement.

  The ProFX22v3 features seventeen award-winning Onyx mic preamps for capturing pristine audio in the studio or on stage. Ultra-low noise and up to 60 dB of gain mean headroom and clarity for any microphone.

  The high-resolution effects engine gives your sound the perfect touch, whether you need to add a bit of reverb to a guitar track or explore new sounds, with 24 effects on board.

  The mixer is optimized for USB recording at sample rates up to 192 kHz. The 2x4 I/O sends separate mixes from your computer to your headphones and the channel strip, and latency-free direct monitoring includes a dedicated control to blend between the DAW and the channel inputs. The included Waveform OEM software bundle adds a plug-in collection for fine-tuning your sound.
specs: |-
  - 22-channel USB mixer with 17 low-noise, high-headroom Onyx preamps that provide 60 dB of gain
  - 3-band EQ with On/Off hard bypass switch and variable mid frequency control
  - Dual stereo USB return for additional routing flexibility during performances
  - Latency-free direct monitoring for hassle-free overdub sessions
  - High-resolution recording with sample rates up to 192 kHz to Mac/PC via USB
  - 24 included effects, including reverbs, delays and choruses, delivered via GigFX effects engine
  - GigFX presets include bright room, warm lounge, small stage, warm theater, warm hall, concert hall, cathedral, small plate, large plate, chorus, delay, ping-pong delay, overdrive/distortion, spring reverb, early reflections, auto-wah, flange and slapback reverb
  - Built-in compression on 12 channels
  - Switchable Hi-Z inputs for guitars, bass, and other instruments
  - 100 Hz low-cut filter and 48V phantom power on all mic channels
  - Aux/Monitor with dedicated per-channel send control, 4 aux sends
  - Dual stereo subgroup output bus with per-channel assignment
  - Headphone output with separate level and blend control
  - Dedicated control room output with level control
  - Footswitch input for FX mute
  - Waveform OEM professional software bundle included
  - Power consumption 45 watts, universal 100-240 VAC supply via 3-pin IEC line cord
  - 24.1 x 17.1 x 4.4 in / 612 x 434 x 112 mm, 19.8 lb / 9.0 kg
