description: "The Mackie ProFX22v3 is a 22-channel professional analog mixer
  with USB recording, 17 Onyx mic preamps, GigFX effects engine, and Waveform
  OEM DAW for studio and live sound applications."
details: |-
  Bring legendary sound to the studio or the stage. The Mackie ProFX22v3 gives you ultimate control, versatility and flexibility for multiple applications that range from recording to live sound reinforcement. In addition to a powerful FX engine, Mackie ProFX22v3 comes with Waveform OEM to power your workflow.

  Onyx Mic Preamps deliver award-winning sound with 17 low-noise preamps offering 60dB of gain for capturing pristine vocals and instruments. The GigFX High-Resolution Effects Engine includes 24 onboard effects spanning reverbs, delays, and choruses for shaping live and recorded sound.

  With 2x4 192 kHz USB recording to Mac/PC and latency-free direct monitoring, the ProFX22v3 doubles as a high-resolution recording interface. Per-channel features include 3-band EQ with hard-bypass, switchable Hi-Z inputs, 100Hz low-cut filter, and 48V phantom power on all channels.

  The mixer includes built-in compression on 12 channels, dual stereo subgroup output bus, aux/monitor sends with per-channel control, dedicated control room output, and a footswitch input for FX mute, plus the bundled Waveform OEM professional DAW software.
specs: |-
  - 22-channel USB mixer with 17 low-noise Onyx preamps (60dB gain)
  - 3-band EQ with On/Off hard bypass and variable mid frequency
  - Dual stereo USB return
  - Latency-free direct monitoring
  - High-resolution 192kHz USB recording to Mac/PC
  - 24 included GigFX effects (reverbs, delays, choruses)
  - Built-in compression on 12 channels
  - Switchable Hi-Z inputs
  - 100Hz low-cut filter
  - 48V phantom power on all channels
  - Aux/Monitor with per-channel send control
  - Dual stereo subgroup output bus
  - Headphone output with separate level and blend control
  - Dedicated control room output with level control
  - Footswitch input for FX mute
  - Waveform OEM professional software included
