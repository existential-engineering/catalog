description: The OM1 is a 14-fret Orchestra Model steel-string acoustic guitar
  built for fingerstyle soloists, flatpickers, and lead players. Its compact
  body features a Sitka spruce top paired with Honduran mahogany back and sides,
  delivering balanced tone and immediate response. Pre-war scalloped X-bracing,
  an ebony fingerboard, and bone nut and saddle round out a classic,
  player-focused build.
details: |-
  The OM1 is an Orchestra Model steel-string acoustic guitar with a compact 14-fret body design favored by fingerstyle soloists and flatpickers. The shallow 4-inch body depth contributes to the instrument's balanced tone and immediate response. The top is Sitka spruce braced with a pre-war scalloped X-brace pattern, while the back and sides are Honduran mahogany. The neck is also Honduran mahogany with a Modified V profile and mortise & tenon hybrid neck joint. The ebony fingerboard features Mother-of-Pearl short dot inlays, and the ebony belly-style bridge is fitted with a drop-in bone saddle and ebony bridge pins with MOP dots. The nut is bone at 1 11/16". Hardware includes nickel Waverly tuners. The body is finished in high gloss nitrocellulose lacquer with tortoise binding and b/w/b/w top purfling, while the neck carries a high gloss polyester resin finish.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: Mother-of-Pearl short dots
  - Bridge: Ebony belly-style
  - Bridge Pins: Ebony with MOP dot
  - Bracing: Sitka spruce, pre-war scalloped X-brace
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Scale Length: 25 1/2"
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Neck Profile: Modified V
  - Peghead Profile: Square
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Rosette: b/w purfling
  - Backstrip: 1-style (Walnut)
  - Pickguard: Tortoise
  - Strings: D'Addario EJ-16 (.012"-.053")
