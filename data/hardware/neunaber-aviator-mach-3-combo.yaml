description: The Aviator Mach 3 Combo is a two-channel, 200-watt guitar combo
  amplifier with twelve switchable voices, built-in reverb and tremolo, a
  distortion boost, and a Celestion Copperback 12-inch speaker.
details: |-
  Soar to New Heights with Unparalleled Power and Tone

  Introducing the Quilter Aviator Mach 3, the pinnacle of lightweight and powerful guitar amplification. Weighing in at just over 20 pounds, this two-channel combo is a marvel of modern engineering, capable of delivering up to a full 200 watts of tube-like power. Whether you're a gigging musician or a recording artist, the Mach 3 is designed to elevate your performance with its supersonic power and tonal versatility. Dual Channels for Dynamic Creativity

  The Mach 3 offers two switchable channels that cover a wide array of iconic rock amp tones, perfect for genres ranging from rock and blues to country and pop. With six distinct voices on each channel, you can effortlessly switch between instruments or blend them together for a rich, layered sound. Professional Features for the Performing Artist

  The Mach 3 is more than just an amplifier – it's a complete toolkit for the discerning guitarist. With features like independent mix-out volume controls, you can keep your signal level consistent while adjusting your speaker volume on stage. It also offers an adjustable limiter, tremolo, reverb, and the ability to switch between six voicings per channel. Plus, an effects loop and switchable cab sim output add even more versatility to this powerful setup. Connectivity and Control

  Designed with the modern musician in mind, the Mach 3 provides differentiated signal output paths for on-stage performance and sound engineering needs. The FX Loop, SIG OUT, and HEADPHONE outputs offer flexibility for direct PA system connection, recording, and silent practice. Compact and Tour-Ready

  Despite its extensive features, the Mach 3's compact design makes it an ideal companion for touring musicians. Its robust build ensures it can handle the rigors of the road, while its lightweight nature means it won't weigh you down. -
