specs: |-
  - Features - Up to 200 watts of tube-like power.
  - Dual channel switching: Switch one instrument between channels, switch between two instruments, or use both channels at once!
  - 6 different voicings to switch between or combine 2 at a time.
  - 3 band active EQ (Bass/Mid/Treble)
  - Reverb and Tremolo effects.
  - Separate SPKR VOL and SIG OUT volumes. When playing on stage with PA reinforcement, work with the sound operator to establish a comfortable SIG OUT level, and then use the SPKR VOL to set your personal speaker level without changing the SIG OUT level.
  - Cab Sim Switch
  - Effects Loop
  - Controls - Primary Controls
  - VOICE SELECTOR SWITCH allowing you to choose between 6 distinct voices on each channel.
  - GAIN adjusts the distortion from clean to high gain.
  - LIMITER intervenes to limit how far into overdrive the sound can go.
  - DISTORTION BOOST lets you add breakup before the VOICE and EQ section, so these settings will also shape the tone of the distortion, much like using a pedal in front of the amp.
  - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies.
  - Effects Controls
  - REVERB applies to both channels and is footswitch defeatable.
  - TREMOLO applies to both channels and is footswitch defeatable.
  - Volume Controls
  - CH OUT marked with percentages from zero to 100% relating to the power level selected by the SPKR VOL located in the MASTER section on the far right.
  - SPKR VOL adjusts speaker power volume level.
  - SIG OUT controls the volumes of headphones and Line Out.
  - Specifications Electronic Performance Input 2 X ¼" Mono, 2 meg impedance, 1.5-5Vpk (depending on EQ) FX Loop ¼" mono, 1V full scale, 1K out, 47K inp (with FX Send lifted) SIG OUT ¼" TRS, balanced line, 40 ohms each leg, 2V full scale HEADPHONE (SIG OUT) ¼" TRS, 40 ohms each channel, 0-6Vpk (depending on SIG VOL) Power Speaker Out 0-200W (depending on SPKR VOL setting) AC Power 100-240 VAC, 50-60Hz, 250W maximum Speaker Celestion Copperback 12" Speaker Dimensions Combo HxWxD Height: 17" (43.2cm) including feet & handleWidth: 18.4" (46.7cm) Depth: 10.6" (26.9cm) Weight (Combo) 21 lbs (9.5kg) Cover 4mm Ballistic Nylon with carry pouch on rear
  - Resources - The Wiki Page contains detailed info for setup and technical specs.
