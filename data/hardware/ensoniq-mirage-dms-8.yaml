description: >-
  The rack-mount version of the Ensoniq Mirage sampler, offering the same 8-bit
  sampling engine and analog filters as the DSK-8 keyboard in a compact rack
  format.
details: |-
  The DMS-8 arrived in 1985 as a rack-mount version of the Ensoniq Mirage, making the sampler's capabilities accessible without the 61-key keyboard. It retains the same 8-bit sampling engine with up to 32 kHz sample rate and 128 KB of RAM, along with the analog lowpass VCF, five-stage envelopes, and built-in 3.5-inch disk drive.

  Without the keyboard, the DMS-8 is controlled entirely via MIDI, making it well-suited as a studio sound module or live rig expansion. The same sample library compatible with the DSK-8 keyboard version works with the rack unit, and sample editing is performed via the same hexadecimal code interface.

  The analog signal path gives the DMS-8 the same warm character as the keyboard version, and the Mirage sample library has proven enduringly useful across genres.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 8-bit, up to 32 kHz (6.5 seconds at 10 kHz)
  - Filter: Analog lowpass with 5-stage envelope
  - VCA: 5-stage digital envelope
  - Form factor: Rack-mount
  - Memory: 16 internal patches, 128 KB sampler RAM, 3.5-inch diskette
  - Sequencer: 333-note capacity
  - Outputs: Mono
  - Control: MIDI
