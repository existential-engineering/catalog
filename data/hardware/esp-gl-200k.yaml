description: In 1985, George Lynch became one of ESP's first Signature artists
  with the introduction of the original Kamikaze model. Over the subsequent 40+
  years, ESP has worked with George to create many different renditions of the
  distinctive Kamikaze guitar… but the GL-200 Kami is perhaps the most unique of
  them all, due to its streamlined solid Black finish! This guitar is perfect
  for anyone who loves the inimitable performance style of George Lynch, but
  perhaps wants a more understated look in their guitar graphics. Built with
  bolt-on construction at 25.5" scale, it features a basswood body and thin
  U-shaped maple neck with rosewood fingerboard, 22 extra-jumbo frets, and what
  is often referred to as a "hockey stick" reverse headstock as was featured on
  the original Kamikaze model. Components on the GL-200 Kami include matching
  black hardware, LTD tuners, a Floyd Rose Special double-locking tremolo
  bridge, and a set of ESP LH-150B (bridge) humbucker and an ESP LS-120 passive
  single coil pickups in the neck position.
