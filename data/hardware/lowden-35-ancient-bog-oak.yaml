description: A Lowden 35 Series acoustic guitar with Ancient Bog Oak back and
  sides, offering warm, woody tones well suited to jazz and melodic playing.
details: |-
  Rather than being a particular species of Oak, Bog Oak is any Oak found and salvaged from a naturally occurring bog. The rich, dark hue of the wood results from absorbing the peat and mud in which it was preserved - sometimes for thousands of years! Lowden Bog Oak guitars offer warm, woody tones, perfect for jazz and melodies.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Ancient Bog Oak back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, or Alpine Spruce soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Ancient Bog Oak
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
