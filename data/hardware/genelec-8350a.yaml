description: "All the intelligence of Smart Active Monitoring in an extremely
  potent nearfield monitor. Introducing the Genelec 8350A."
details: |-
  The Genelec 8350A is a high-output two-way nearfield Smart Active Monitor (SAM) designed for demanding studio, broadcast, and post-production environments. It combines a 205 mm bass driver and a 25 mm metal dome tweeter loaded by Genelec's Directivity Control Waveguide (DCW), delivering a frequency response of 38 Hz - 20 kHz (+/- 1.5 dB) and a short-term maximum SPL of at least 112 dB at 1 m.

  Bi-amplified by an integrated 200 W Class D bass amplifier and a 150 W Class D treble amplifier, the 8350A is engineered for transparency and neutrality at high listening levels while keeping self-generated noise at or below 5 dB SPL (A-weighted). Active crossovers operate at low signal levels for low distortion and precise driver alignment.

  The Minimum Diffraction Enclosure (MDE) is precision die-cast aluminium with curved surfaces and a rear-firing reflex port for extended bass response. The included Iso-Pod stand decouples the monitor from its supporting surface, reduces unwanted vibration, and allows up to +/- 15 degrees of tilt for accurate listener alignment. M6 mounting points and a 3/8 inch microphone stand thread support wall, ceiling, and stand installation.

  As a SAM product, the 8350A integrates with Genelec's GLM (Genelec Loudspeaker Manager) calibration software via two RJ45 GLM Network ports. With a GLM Calibration Kit and either the 9320A SAM Reference Controller or a GLM network adapter, GLM measures room response, compensates for acoustic anomalies, manages levels and groups, and runs AutoCal. Multiple 8350A units can be daisy-chained alongside other SAM monitors and subwoofers.

  Intelligent Signal Sensing (ISS) technology drops idle power consumption to under 1 W to meet EU ErP directives, while internal driver protection circuitry safeguards the amplifiers and transducers under high-output operation. The 8350A ships with a mains cable and a 5 m RJ45 cable, includes a 2-year warranty extendable to 5 years via MyGenelec registration, and was recognised as Best New Studio Monitor in the SOS Awards 2019.
specs: |-
  - Two-way bi-amplified Smart Active Monitor (SAM) design
  - Frequency response: 38 Hz - 20 kHz (+/- 1.5 dB)
  - Frequency response: 33 Hz - 22 kHz (-6 dB)
  - Short term maximum SPL: >= 112 dB
  - Peak SPL: >= 121 dB
  - Long term maximum SPL: >= 103 dB
  - Self-generated noise: <= 5 dB SPL (A-weighted)
  - Harmonic distortion: <= 2% (50-100 Hz), <= 0.5% (>100 Hz)
  - Group delay (Extended Phase Linearity OFF): 3.0 ms
  - Bass driver: 205 mm cone
  - Treble driver: 25 mm metal dome
  - Bass amplifier: 200 W Class D
  - Treble amplifier: 150 W Class D
  - Directivity Control Waveguide (DCW) technology
  - Minimum Diffraction Enclosure (MDE) - die-cast aluminium with reflex port
  - Iso-Pod stand included (+/- 15 degrees tilt adjustment)
  - Intelligent Signal Sensing (ISS) auto power management
  - GLM (Genelec Loudspeaker Manager) network calibration support
  - Height: 433 mm (452 mm with Iso-Pod)
  - Width: 286 mm
  - Depth: 278 mm
  - Weight: 12.8 kg (28.2 lb)
  - Mains voltage: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): <= 1 W
  - Power consumption (idle): <= 12 W
  - Power consumption (full output): 230 W
  - Mounting: M6 support points and 3/8 inch microphone stand thread
  - Warranty: 2 years (extendable to 5 years via MyGenelec registration)
  - Available finishes: Producer Dark Grey (8350APM), White (8350AWM), Black
