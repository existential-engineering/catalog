name: 527 Compressor/Limiter
manufacturer: api-audio
primaryCategory: compressor
categories:
  - limiter
  - dynamics
  - rack-mount
  - discontinued
url: https://apiaudio.com/product/527-compressor-limiter/
description: VCA-based 500-series compressor/limiter with API 2510/2520 discrete
  op-amps, transformer output, THRUST® sidechain circuit, and
  feed-forward/feed-back mode switching. Discontinued, superseded by the 527A.
details: |-
  500-series VCA compressor/limiter using API 2510 and 2520 discrete
  op-amps, transformer output. Continuously variable detented controls for
  Threshold (+10 to −20 dBu), Attack (1–25 ms), Release (0.3–3 s), Ratio (1:1 to
  1:∞), Output Fader (−∞ to +10 dB). 10-segment VU/GR meter. THRUST®
  frequency-dependent sidechain filter. New/Old (feed-forward/feed-back) mode
  switch, Hard/Soft knee switch, Link for stereo. Hard relay bypass.
specs: |-
  - Input impedance: 160 kΩ (high) / 80 kΩ (low)
  - Output impedance: 85 Ω (high) / 50 Ω (low)
  - Max input/output: +26 dBu
  - Attack: 1–25 ms
  - Release: 0.3–3 s
  - Ratios: 1:1 to 1:∞
  - Threshold: +10 to −20 dBu
  - Frequency response: ±1 dB (20 Hz–20 kHz)
  - THD: <0.2%
  - S/N ratio: −100 dB (unweighted)
  - Power: ±15–18V DC @ 130 mA
  - Dimensions: 1.5″ × 5.25″ × 7.5″ D
  - Weight: 1.75 lb
