description: 500R8 is a complete USB audio interface, high-performance
  converter, monitor controller, summing mixer, zero-latency artist mixer, and
  500 series rack.
details: |-
  500R8 combines a USB audio interface, monitor controller, zero-latency artist mixer, discrete analogue summing mixer, and an 8-slot 500 series rack in a single 4U rackmount chassis, designed and engineered in the UK.

  As a USB interface it offers 28-in/30-out USB 2.0 recording and playback, plus ADAT I/O (16/16 channels at 44.1/48kHz, 8/8 at 88.2/96kHz), S/PDIF I/O, word clock in/out via BNC, and 5-pin MIDI I/O. Conversion is built around reference-grade converters rated at 121dB dynamic range (AES17, A-weighted) with less than 0.5 picoseconds of clock jitter, and sample rates up to 192kHz are supported.

  Each of the 8 rack slots exposes a balanced XLR module input, a pre-ADC TRS insert, and a balanced XLR direct output, with per-slot source-select switching between Analogue, USB, and C.A.S.T. signal paths. An 8-into-2 discrete analogue summing mixer (+26.5dBu headroom) sums the installed modules to a stereo bus, and a zero-latency artist mixer provides per-channel level/pan and DAW-return blend controls feeding two high-power headphone outputs.

  The built-in monitor controller handles Speaker A/B switching, mono check, dim, mute, a 28-segment peak meter, and a talkback input with always-on phantom power. Four C.A.S.T. ports (plus a dedicated C.A.S.T. link) allow slot I/O to be relocated to remote breakout boxes such as the N22/N22H, or the summing mixer to be expanded to 16-into-2 by linking with Cranborne's 500ADAT.

  500R8 is powered by an included 24V/5A external locking supply, measures 481 x 185 x 219mm (19-inch, 4U), and weighs 7kg. It is class-compliant on macOS (no drivers required) and uses a Windows ASIO driver, with firmware v1.3 (including USB driver v5.5) as the current release.
specs: |-
  - 28-in/30-out USB 2.0 audio interface
  - ADAT I/O: 16/16 channels @ 44.1/48kHz, 8/8 channels @ 88.2/96kHz
  - S/PDIF I/O (2-in/2-out), AES3 coax compatible
  - 5-pin MIDI I/O
  - Word Clock In/Out via BNC; external sync via Word Clock, S/PDIF, or ADAT
  - Dynamic Range: 121dB A-weighted (AES17, 20Hz-20kHz)
  - Frequency Response: -1dB, 2.2Hz to >80kHz
  - THD+N: <0.00032% (-110dB) @ -4dBFS
  - Max I/O Level: +24dBu
  - Jitter: <0.5 picoseconds
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192kHz
  - 8-into-2 discrete analogue summing mixer, +26.5dBu headroom, balanced 1/4" outputs
  - C.A.S.T. link port for 16-into-2 summing mixer expansion with 500ADAT
  - Zero-latency analogue Artist Mixer: per-channel level/pan, DAW return blend
  - 2 high-power headphone outputs: 250mW@600ohm, 650mW@220ohm, 1.21W@100ohm, 500mW@32ohm
  - 8-slot 500 series rack, 250mA per slot (2A total)
  - XLR inputs, XLR line outputs, and TRS inserts (pre-ADC) per slot
  - Speaker A/B switching, Mono check, Dim, Mute, 28-segment peak meter
  - Talkback input with always-on phantom power
  - C.A.S.T. compatible with N22/N22H breakout boxes, Cat 5e/6/7 cable up to 100m, 48v phantom power transport
  - Power: 24V 5A external locking supply, 120W consumption
  - Dimensions: 481mm W x 185mm H x 219mm D (19" rack, 4U); Weight: 7kg
  - macOS: class-compliant, no drivers needed; Windows: ASIO driver required (v5.5 current)
