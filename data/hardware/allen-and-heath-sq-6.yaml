description: The Allen & Heath SQ-6 is a powerful digital mixer tailored for
  small-to-mid-sized productions.
details: |-
  Step up to the Allen & Heath SQ-6, a powerhouse digital mixer tailored for small-to-mid-sized productions. With 24+1 faders, 24+1 onboard preamps, 16 assignable SoftKeys, and 4 assignable Soft Rotaries, the SQ-6 offers enhanced control and flexibility for diverse live sound environments.

  Built around a 96kHz XCVI FPGA core, the SQ-6 provides 48 input channels mixing to LR and 12 stereo mix busses, plus a PAFL bus and 36 total busses. Channels and mixes can be dragged and dropped to any strip, with custom naming and colour coding on the per-strip backlit LCD displays, allowing a mixing environment to be built around the operator. Each strip features the patented Chromatic channel metering system, giving at-a-glance level indication thanks to LEDs with variable brightness and colour.

  SQ's dashboard is centred around a high-res 7" colour touchscreen, framed by an array of high-grip, illuminating encoders to create an intuitive, integrated blend of clear visual feedback and immediate, hands-on control. Dedicated physical controls give direct access to Gain, HPF Frequency, Gate Threshold, Compressor Threshold, Pan, and EQ Gain/Frequency/Width. Proven on countless world-tours with international artists, DEEP Processing and RackExtra FX from the award-winning dLive digital mixing system are available within SQ.

  Thanks to its SLink EtherCON port, SQ can be expanded up to a total of 48 mic inputs via the Everything I/O family of rack and stage box expanders, supporting dSnake/ME, DX or GigaACE/GX protocols with a maximum 64x64 digital channels. A separate I/O Port accepts optional cards for 3rd-party AoIP protocols such as Dante and Waves, also supporting 64x64 channels. SQ is fully compatible with the ME Personal Mixing System for performer-controlled monitor mixes.

  SQ-6 is built for live sound, studio and installation. With 12 stereo mixes, super-low latency, and both parametric and graphic EQ on every mix - plus an airline-friendly compactness, 3-tier all-metal chassis and extruded aluminium light bar - it is well suited to in-ear monitoring setups. SQ-Drive enables stereo and multitrack recording/playback direct to USB drives, while the rear-panel USB-B 2.0 connection provides 32x32 channel bi-directional audio streaming to/from Mac/PC along with MIDI DAW control.
specs: |-
  - Compact Digital Mixer for Live, Studio and Installation
  - 96kHz XCVI FPGA core
  - 48 Input Channels
  - 24 Local Mic Inputs (XLR)
  - 2 1/4" Stereo Inputs (TRS)
  - 1 3.5mm Stereo Input
  - 36 Total Busses
  - 12 Stereo Mix (Aux or Group) + Main
  - PAFL Bus
  - 16 Assignable Local Outputs (14 XLR + 2 1/4" TRS)
  - AES Digital Output (XLR, switchable sample rates)
  - Dedicated Talkback mic input (XLR)
  - 1/4" TRS Headphone out with dedicated control
  - SLink EtherCON connection for remote audio using dSnake/ME, DX or GigaACE/GX protocol (64x64 channels)
  - I/O Port for Option Card (including 3rd party protocols - Dante/Waves, 64x64 channels)
  - 8 Mute Groups
  - 8 DCA Groups
  - 8 Stereo FX with dedicated FX Returns
  - DEEP Processing Ready
  - RackFX Effects suite
  - 7" colour touchscreen
  - 16 Assignable SoftKeys
  - 4 Assignable Soft Rotaries
  - Dedicated physical controls for channel processing (Gain, HPF Frequency, Gate Threshold, Compressor Threshold, Pan, EQ Gain/Frequency/Width)
  - 24+1 Faders with 6 Layers for 144 assignable Channel Strips
  - Motorised faders for sends on faders, GEQ fader flip and mix recall
  - 24 Backlit LCD Channel Strip displays
  - Chromatic Channel Metering
  - Integrated Surface Illumination
  - Single/Dual Footswitch Control
  - Input channel pairs switchable mono/stereo
  - Patchable Insert points
  - Input processing - Trim, HPF, Gate, PEQ, Compressor, Delay
  - Output processing - Graphic EQ, PEQ, Compressor, Delay
  - DEEP Automatic Mic Mixing
  - 2 31/61 Band Real Time Analysers
  - Quick copy/paste/reset for parameters
  - User Permissions to restrict operator access
  - 300 Scene memories per show
  - Channel Safes, Global and per Scene Recall Filters
  - FX, processing and channel Libraries
  - SQ-Drive for stereo and multitrack recording/playback direct to USB drive
  - USB transfer of Scenes, Libraries, Shows
  - 32x32 channel USB streaming to/from Mac/PC
  - MIDI via USB or TCP/IP, including DAW control options
  - Remote mixing apps for iPad, Android, Mac and PC
  - Compatible with ME personal monitoring range
  - Up to +60dB preamp gain with 48V phantom power and switchable -20dB pad (+30dBu max input)
  - Nominal line output +4dBu, maximum +22dBu
  - Fast Ethernet (100 Mbit/s) network port for TCP/IP control
  - Built-in power supply 100-240V, 50/60Hz, 90W (IEC connector)
  - Recommended operating temperature 5 to 35 degrees Celsius
  - Dimensions: 638mm x 501.9mm x 198.5mm (25.1" x 19.8" x 7.8")
