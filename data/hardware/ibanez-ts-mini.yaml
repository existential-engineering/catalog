description: Made in Japan Tube Screamer Mini — the legendary TS overdrive in a
  footprint roughly half the size of the original, with Overdrive, Tone, and
  Level controls and true bypass.
details: |-
  Ibanez knows space on your pedalboard is at a premium, and the Tube Screamer Mini was designed to help you preserve that valuable real estate. This smaller form-factor Tube Screamer delivers the same legendary tones you'd expect from our larger offerings, but in a box that's roughly half the size of the original.

  True bypass switching provides the shortest, most direct signal path as well as the cleanest tone. Three classic controls — Overdrive, Tone, and Level — sit on top, with input on the right side and output on the left.
specs: |-
  - Controls: Overdrive, Tone, Level
  - True Bypass
  - Required Current: 18mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - Input on right side; output on left side
  - Made in Japan
