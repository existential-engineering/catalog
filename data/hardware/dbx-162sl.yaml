name: 162SL
manufacturer: dbx
primaryCategory: compressor
categories:
  - limiter
  - rack-mount
  - outboard
url: https://dbxpro.com/en/products/162sl
description: Purple Series stereo compressor/limiter featuring dual proprietary
  VCA modules and AutoVelocity™ technology, with Jensen output transformers and
  aircraft aluminum construction for studio and live applications.
details: |-
  The 162SL combines premium construction with advanced compression capabilities, featuring a front panel machined from aircraft aluminum, handcrafted knobs, and custom VU meters. It incorporates the best features of dbx's legacy compressors including auto attack/release, hard knee threshold, and the OverEasy® mode alongside variable controls and PeakStopPlus™ limiting algorithm.

  Equipped with dual proprietary dbx VCA modules based on the original Blackmer decilinear design, the unit delivers exceptional dynamic range and ultra-low distortion suitable for both studio and harsh environments. Jensen® output transformers are included standard on each output, ensuring sonic clarity and superior performance.
specs: |-
  - Input Connectors: XLR, 1/4" electronically balanced/unbalanced, RF filtered
  - Max Input: 24 dBu balanced
  - Output Connectors: XLR, 1/4" transformer balanced/unbalanced, RF filtered
  - Max Output: >24 dBm
  - Bandwidth: >200 kHz
  - Dynamic Range: >118 dB
  - Headroom: 20 dB (reference +4 dBu)
  - Signal to Noise Ratio: 96 dB (reference +4 dBu)
  - THD+Noise: <0.008% at +4 dBu, 1 kHz, unity gain
  - Frequency Response: +0/-3 dB 2 Hz - 200 kHz; +0/-0.1 dB 20 Hz - 20 kHz
  - Deviation From Linear Phase: <1 degree 20 Hz - 20 kHz
  - Compressor Threshold Range: -40 to +30 dBu
  - Compressor Ratio: 1:1 to infinity:1
  - Compressor Threshold Characteristic: Selectable OverEasy® or hard knee
  - Limiter Threshold Range: +4 to +24 dBu (off)
  - Limiter Ratio: infinity:1
  - Limiter Type: PeakStopPlus® 2-stage limiter
