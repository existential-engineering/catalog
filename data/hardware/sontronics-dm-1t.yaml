details: |-
  Capture incredible detail from drums with these condenser microphones for tom-toms. The Sontronics DM-1T is your passport to drum sound perfection, guaranteeing incredible and unmatchable results from your tom-toms, whether you're in the studio, at home or on the road. This mic will capture all the unmistakable characteristics of your drums, from the crack of the initial hit right through to the boomy resonance of your floor tom. It also sounds superb on other percussion instruments such as cajón, djembe, bongos, tabla, congas and more. The mic features a -10dB pad switch, making it capable of withstanding an impressive 135dB SPL, enough to cope with even the most heavy of hitters! FEATURES

  Key Features

  IDEAL FOR

  The DM-1T is perfect for:

  TECH SPECS

  Technical Specifications

  Frequency Response

  WHAT'S INCLUDED

  What's in the Box?
specs: |-
  - Small-Diaphragm Condenser Microphone : Specifically engineered to capture the full, resonant sound of tom drums with precision.
  - Cardioid Polar Pattern : Provides focused sound capture, isolating the toms from other drums and reducing bleed.
  - Tailored Frequency Response : Optimised to enhance the natural depth and warmth of toms, ensuring they sit perfectly in the mix.
  - High-SPL Capability : Designed to handle the high sound pressure levels typical of tom drums without distortion.
  - Rugged Construction : Built to endure the demands of both studio recording and live performances, offering long-term durability.
  - Compact Design : Easily fits into tight drum setups, allowing for precise positioning without getting in the drummer's way.
  - Versatile Mounting Options : Compatible with various mounting hardware, providing flexibility in positioning and angle for optimal sound capture.
  - Excellent Transient Response : Captures the quick, sharp transients of tom hits, preserving the dynamic impact of your drumming.
  - Professional Choice : Favoured by drummers and engineers for its ability to deliver a consistent, high-quality tom sound in any recording or live scenario.
  - Tom-Toms
  - Drums
  - Percussion
  - Microphone type: Small-diaphragm condenser for toms and percussion
  - Polar pattern: Cardioid
  - Frequency response: 30Hz to 20kHz
  - Pad: 0dB, -10dB
  - Sensitivity: 16mV/Pa
  - Impedance: ≤200 Ohms
  - Max. SPL.: (for 0.5% THD @ 1kHz) 135dB (with -10dB pad switched on)
