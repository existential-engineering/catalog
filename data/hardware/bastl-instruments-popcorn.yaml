url: https://bastl-instruments.com/eurorack/modules/popcorn
description: Compact, musical sequencer/quantizer/arpeggiator. Embraces the idea
  of making a selection of 8 notes that can be browsed in many different ways.
  Features CV output with selectable range (1, 2, or 5 octaves), multiple
  quantizer modes (chromatic, diatonic, pentatonic, blues scales, and chord
  modes), gate output with adjustable gate time, dual trigger inputs for step
  navigation, slide functionality, and expandability via Popcorn CV Exp and
  Popcorn Gate Exp modules.
details: |-
  Width: 10 HP. Depth: 35mm. Power: +12V <65mA, -12V <5mA. 10-pin power connector with PTC fuse and diode protection. Firmware v1.1 available for units manufactured before May 2018.
