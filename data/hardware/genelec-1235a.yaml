description: "The 1235A brings the sound and heritage of the iconic 1035 into
  the modern recording age. High SPL capability and precise imaging come
  together in a main monitor that adapts to your room."
details: |-
  The Genelec 1235A is a flagship Smart Active Monitor (SAM) that carries the heritage of the iconic 1035 into the modern recording age. Engineered as a wall-mountable full-range main monitor, it is designed for prestigious studios that demand true reference performance at very high sound pressure levels and over long listening distances - and it is available both as a complete system and as a retro-fittable upgrade kit for owners of 1035A or B models.

  Its three-way active design pairs dual 381 mm bass drivers with dual 125 mm midrange cones and a 25 mm compression treble driver, powered by an external 3U-rack RAM-XL amplifier delivering 2 x 1000 W (bass), 2 x 400 W (mid), and 250 W (treble) of Class D power. The result is a frequency response of 31 Hz - 20 kHz (±2 dB), short-term maximum output of 130 dB SPL, and peak output exceeding 135 dB - all with self-generated noise of ≤5 dB SPL.

  Outstanding on- and off-axis response combined with Genelec's Directivity Control Waveguide (DCW) produces a very wide and stable sweet spot that can be trusted by multiple listeners simultaneously within a room. The wall-mount form factor and controlled directivity make the 1235A particularly well suited to the soffit-mount and wall-mount installations expected of a main reference monitor.

  As a SAM monitor with 96 kHz internal processing, the 1235A integrates fully with Genelec Loudspeaker Manager (GLM) software over its dual RJ45 GLM Network ports. GLM can configure, control, and calibrate the system for any acoustic environment, applying room response compensation, level and distance adjustments, and Extended Phase Linearity processing for accurate translation between rooms and systems.

  The unit accepts both analog (balanced XLR, 10 kOhm) and AES/EBU digital (XLR, 110 Ohm) inputs, with a digital thru output for daisy-chaining additional monitors. Intelligent Signal Sensing (ISS) standby reduces idle power consumption to ≤6 W, and the package ships with an individually calibrated RAM-XL amplifier unit, Speakon cables, RJ45 cables, and a mains lead so the system is GLM-ready out of the box.
specs: |-
  - Frequency Response: 31 Hz - 20 kHz (±2 dB)
  - Low Cutoff: 29 Hz (-6 dB)
  - High Cutoff: 26 kHz (-6 dB)
  - Peak SPL: ≥135 dB
  - Short Term Max SPL: ≥130 dB
  - Long Term Max SPL: ≥124 dB
  - Self Generated Noise: ≤5 dB SPL
  - Harmonic Distortion: 50-100 Hz ≤1%; 100 Hz-3 kHz ≤0.5%; >3 kHz ≤3%
  - Group Delay: 5.2 ms (Extended Phase Linearity OFF)
  - Bass Amplifier: 2 × 1000 W Class D (3U Rack)
  - Midrange Amplifier: 2 × 400 W Class D (3U Rack)
  - Treble Amplifier: 250 W Class D (3U Rack)
  - Bass Drivers: 2 × Ø381 mm cone
  - Midrange Drivers: 2 × Ø125 mm cone
  - Treble Driver: Ø25 mm compression
  - Height: 820 mm
  - Width: 1105 mm
  - Depth: 650 mm
  - Weight: 164 kg (361.6 lb)
  - Mains Voltage: 100-120 VAC / 220-230 VAC, 50/60 Hz
  - ISS Active Power Consumption: ≤6 W
  - Idle Power Consumption: ≤40 W
  - Full Output Power Consumption: 2400 W
  - Analog Input Impedance: 10 kOhm balanced
  - Digital Input Impedance: 110 Ohm AES/EBU
  - Amplifier Unit: RAM-XL (individually calibrated, 3U rack)
  - Product Code: 1235AP
