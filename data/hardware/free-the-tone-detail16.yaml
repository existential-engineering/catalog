description: FIRE MIST for True British Rock Sound
details: |-
  The Integrated Series began as Free The Tone's 15th anniversary project, restructuring every component of an effects unit around the company's accumulated experience and its own sense of tone. The first release in the series is a pair of overdrive pedals, the STRING SLINGER and the FIRE MIST.

  The design targets were extended dynamic range, brilliant overtones, long sustain, a quick but fat tone and, above all, a pure and clean overdrive sound. Electronic circuits and parts were investigated in turn alongside factors such as magnetic fields and resonance, and the case and knob materials were selected to match. The pedals took several years and many prototypes to complete.

  Both pedals carry a lot of headroom and volume. With the drive at zero the pedal gives a cleanish boost that tightens the low end and brings the mids forward, which works well to push an amp into overdrive. Even with the drive at maximum there is still good note definition on chords and rhythm parts, and the pedal cleans up well when the guitar volume is rolled back, so it responds closely to playing dynamics.

  Where its sibling is voiced for American Blues, the FIRE MIST renders the edgy, traditional British Rock sound associated with the golden Plexi panel, with outstanding response.

  The pedal uses the renewed HTS (Holistic Tonal Solution) circuit, which handles impedance conversion while keeping the character of the guitar and amplifier intact, along with custom turned brass knobs, a metal tone plate over the IC for damping and shielding, and a passive tone circuit that minimizes phase shift in the guitar signal.
specs: |-
  - Input impedance: min. 1 MOhm
  - Output load impedance: min. 10 kOhm
  - Controls: LEVEL, TONE, DRIVE
  - Terminals: 2 x 1/4 inch phone jacks (input and output), 1 x DC 9V input jack for AC adapter
  - Power supply: 9-volt battery (PP3/006P) or AC adapter
  - Current consumption: approx. 10 mA
  - Dimensions: 98 (W) x 120 (D) x 51 (H) mm including protuberances such as footswitches and jacks
  - Weight: approx. 640 g excluding battery
  - Renewed HTS (Holistic Tonal Solution) circuit for impedance conversion and low noise
  - Passive tone circuit to minimize phase shift
  - Custom turned brass control knobs
  - Metal IC tone plate for damping and shielding
  - Accessories: warranty card, Web Access Card, 9-volt battery (PP3/006P), 4 rubber feet
