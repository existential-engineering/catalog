description: >-
  A limited-edition analog synthesizer module from Moog based on the Taurus bass engine, but
  extended to reach notes as high as D8, featuring the classic Moog ladder filter, dual ADSR
  envelopes, and 128 presets in a compact brushed stainless steel enclosure.
details: |-
  Dubbed "The Analog Messenger of Joy," the Moog Sirin was released in 2019 as a limited-production instrument crafted by employee-owners at Moog's Asheville, North Carolina facility. It drew its core sound engine from the legendary Taurus bass synthesizer lineage but broke new ground by extending the pitch range far above middle C, reaching as high as D8 and transforming it from a bass-only instrument into a versatile lead and bass synthesizer.

  The Sirin's signal path featured the iconic four-pole Moog ladder filter, dual ADSR envelopes for filter and amplitude shaping, and a multi-wave LFO for modulation. Its knob-per-function interface emphasized immediacy and playability, with every essential parameter directly accessible on the front panel without menu diving. The brushed stainless steel enclosure and retro-inspired aesthetics gave it a distinctive visual identity.

  Unlike many compact analog modules, the Sirin offered 128 hardware preset locations for storing and recalling patches. A free Editor/Librarian software package extended its capabilities further, providing DAW integration, MIDI control, and access to six additional LFO waveforms not available from the hardware alone. Connectivity included audio output, audio input, headphones, CV inputs for pitch, filter, and volume, plus a gate input for integration with modular systems.

  Created to commemorate the 2019 Moog House of Electronicus experience in Los Angeles, the Sirin was produced in strictly limited quantities, making it a sought-after collector's item. Its combination of the Taurus sound engine with extended range and modern preset management bridged the gap between Moog's analog heritage and contemporary production workflows.
specs: |-
  - Polyphony: Monophonic
  - Filter: 4-pole Moog ladder (24 dB/oct)
  - Envelopes: 2 ADSR (filter, amplitude)
  - LFO: 1 multi-wave (6 additional waveforms via software)
  - VCA: 1 with ADSR
  - Memory: 128 patches (RAM)
  - Connectivity: Audio out, audio in, headphones, CV in (pitch, filter, volume), gate in
  - MIDI: In/Out, USB
