details: |-
  Bluetooth MIDI Tools is a collection of apps that turns your devices in a
  keyboard controller, a sliders controller, a pads controller and a motion
  controller. Play and control your desktop, mobile and hardware Bluetooth le
  MIDI host, instruments and effects from your iphone and ipad.

  Bluetooth MIDI keyboard features selectable number of keys and selectable
  octave. Bluetooth MIDI controller provides up to 64 controllers that sends cc
  MIDI messages, 128 on ipad. Bluetooth MIDI pads includes a 16 pads matrix with
  selectable octave.

  Bluetooth MIDI motion provides 48 motion controllers that sends cc MIDI
  messages from the accelerometer values, with x, y and z axes.

  To use the apps, push connect button and in the opened view turn on the switch
  button. This will make your device discoverable by your Bluetooth MIDI host,
  connect it from it and you will can control your MIDI host from b.m.k, b.m.c,
  b.m.p and b.m.m.

  B.m.k. Uses channel 2. B.m.c. Uses channel 2 on iphone, 2 and 3 on ipad.
  B.m.p. Uses channel 2. B.m.m. Uses channel 4. All them supports Bluetooth le
  MIDI. If your MIDI host don't support Bluetooth MIDI there are some free apps
  on the market that creates virtual Bluetooth MIDI ports.
specs: |-
  - Bluetooth le MIDI
  - Selectable number of keys
  - Selectable octave
  - Up to 64 controllers (iphone) / 128 controllers (ipad)
  - Cc MIDI messages
  - 16 pads matrix
  - 48 motion controllers
  - X, y and z axes
  - Accelerometer values
  - Channel 2 (b.m.k.)
  - Channel 2 and 3 (b.m.c. Ipad)
  - Channel 2 (b.m.p.)
  - Channel 4 (b.m.m.)
  - iOS compatible
