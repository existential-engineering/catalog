details: |-
  The Charvel Angel Vivaldi Signature Pro-Mod DK24 GT7 HH Nova-7 is a seven-string signature electric guitar built for the progressive metal virtuoso. Its modified Dinky body is crafted from caramelized basswood and capped with a striking flame maple top finished in satin Natural, framed by 3-ply body binding for an upscale, refined look.

  A bolt-on caramelized maple neck with graphite reinforcement provides a rock-solid, resonant playing platform, while the 12"-to-16" compound-radius maple fingerboard with 24 jumbo frets and Luminlay side dots supports both fluid chord work and high-velocity lead playing.

  Voiced for articulate clarity and aggressive drive, the Nova-7 pairs a DiMarzio Air Norton 7 in the neck with a DiMarzio The Tone Zone 7 at the bridge. A 5-position blade switch with master volume and tone provides a flexible palette of seven-string tones suited to modern progressive, metal, and djent styles.

  Hardware is anchored by a recessed Gotoh GE1996T double-locking tremolo, a Gotoh locking nut, and Charvel-branded die-cast tuners, all finished in gold to complement the natural top. A reverse 7-string licensed Fender Stratocaster headstock completes the silhouette.

  Each guitar ships with a Charvel multi-fit gig bag and is strung with .009-.054 nickel plated steel strings, ready for stage or studio.
