description: A passive Eurorack module that converts signals between 3.5mm patch
  cables and banana plug connectors, allowing interfacing between Eurorack-style
  and Buchla-style banana-jack synthesizers.
details: |-
  A converter for passing signals between synthesizers that use 3.5mm plugs, such as Eurorack, and synthesizers that use banana plugs, such as Buchla. The voltage patched into each 3.5mm jack can be taken from the banana jack on the right. The circuit is passive, so connection in the reverse direction is also possible.

  When using it between separated systems the ground has to be shared, so connect the GND jack at the bottom to ground with a banana cable before use.

  Banana to Eurorack. Banana to 3.5mm.

  Width: 4HP
  Depth: 20mm

  Built by hand in Japan.
