description: A passive Eurorack module that converts signals between 3.5mm patch
  cables and banana plug connectors, allowing interfacing between Eurorack-style
  and Buchla-style banana-jack synthesizers.
details: |-
  こちらは受注完了後に組み立てする商品となっております。
  部品の在庫状況によっては納品まで1〜2週間程度時間を要する場合がございますことをご了承ください。

  <商品説明>
  ユーロラック等の3.5mmプラグを用いたシンセサイザーとBuchla等のバナナプラグを用いたシンセサイザー同士でシグナルをやり取りするのに使用可能なコンバーターです。
  各3.5mmにパッチされた電圧を右側のバナナジャックから取り出すことができます。
  パッシブ回路なので逆方向の接続も可能です。

  分離されたシステム同士で使用する際にはグラウンドを共通にする必要があるため一番下のGNDジャックをバナナケーブルでグラウンドに接続してから使用してください。

  マニュアル(JP)

  Width: 4HP
  Depth: 20mm

  Built by hand in Japan. Banana to Eurorack
  Banana to 3.5mm

  <注意事項>
  基板製造に伴い発生してしまう印刷ムラやスレ、キズなどがある場合がございますのでご了承ください。
