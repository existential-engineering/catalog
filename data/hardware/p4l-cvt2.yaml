translations:
  ja:
    details: |-
      ユーロラック等の3.5mmプラグを用いたシンセサイザーとBuchla等のバナナプラグを用いたシンセサイザー同士でシグナルをやり取りするのに使用可能なコンバーターです。
      各3.5mmにパッチされた電圧を右側のバナナジャックから取り出すことができます。
      パッシブ回路なので逆方向の接続も可能です。

      分離されたシステム同士で使用する際にはグラウンドを共通にする必要があるため一番下のGNDジャックをバナナケーブルでグラウンドに接続してから使用してください。

