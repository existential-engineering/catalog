description: >-
  The Oberheim Strummer is a MIDI processor that analyzes chords played on a
  keyboard and re-voices them with authentic guitar articulations, including
  realistic strum speed and direction control.
details: |-
  Released in 1991, the Oberheim Strummer addressed a persistent challenge in MIDI-based music production: making keyboard-triggered guitar parts sound convincingly like an actual guitarist playing them. Rather than generating sound itself, the Strummer sits between a MIDI keyboard and a synthesizer or sampler, transforming chord input into guitar-authentic output.

  The device analyzes several aspects of the incoming performance including the range of the guitar being emulated, the number of notes played, chord position, and velocity. It then redistributes the notes across multiple MIDI channels with correct guitar chord voicings and realistic strum timing. Players can control the speed and direction of strums by varying their keyboard technique.

  Beyond basic strumming, the Strummer offers arpeggiation, MIDI delay/echo effects, keyboard splitting, velocity switching, chord capture for single-finger chord triggering, MIDI transposition, and adjustable delay and decay rates. It responds to MIDI program changes and supports external sync, making it a flexible tool for both studio and live performance contexts.

  The Strummer represents a niche but clever approach to MIDI processing from Oberheim's later years, when the company was exploring creative utility devices alongside their synthesizer line. For producers working with sampled or synthesized guitar sounds, it offered a level of realism that was difficult to achieve through keyboard technique alone.
specs: |-
  - MIDI processor (no internal sound generation)
  - Multiple MIDI channel output for guitar voicing
  - Arpeggiation
  - MIDI delay/echo effect
  - Keyboard splitting
  - Velocity switching
  - Chord voicing variations
  - Chord capture (single-finger chords)
  - MIDI transposition
  - Adjustable delay and decay rates
  - External sync compatible
  - MIDI program change support
  - SysEx compatible
  - No keyboard (standalone processor)
