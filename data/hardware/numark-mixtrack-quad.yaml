description: Mixtrack Quad 4-Channel DJ Controller with Audio I/O.
details: |-
  With 4 channels of software control, 16 multi-color drum pads, and color-customizable dual-zone platters, Mixtrack Quad integrates seamlessly with your laptop, placing a fully interactive mixing experience at your fingertips. Stunning color. Dynamic performance capability. It all comes together to empower your performance and bring your mix to life.

  You get four channels of software control to mix and match tracks, juggle beats, or completely deconstruct, mashup, and remix songs with your unique style. With Mixtrack Quad, mixing is an instinctual experience, with the entire control surface, turntables, and pads illuminated and providing real-time visual feedback.

  Create loops, launch samples, and control hot cues with the 16 illuminated rubber drum pads. Utilizing its palette of 16 vibrant colors, Mixtrack Quad's lighted pad and platter animations signal transitions when loading tracks or moving between modes and configurations. 16 dedicated effects controls are built in to the control surface to instantly add and manipulate flanger, phaser, echo, and more.

  Mixtrack Quad is a fully interactive instrument for modern mixing. Its dual-zone platters are color-customizable, so you can assign your choice of 16 colors to each of the platter's four decks. Both platters are capacitive and dual-zone—scratch or stop a track simply by touching the top of the platter or adjust pitch by manipulating the platter from the side.

  With the included Serato DJ Intro software (4-channel version) you can start mixing right away with all four channels, built-in effects, and all the tools you need to perform at parties and clubs. Plus, Mixtrack Quad operates via standard MIDI, so it's compatible with virtually any popular DJ software. Getting up and running couldn't be easier—Mixtrack Quad is class-compliant and USB-powered, so there are no drivers or power adapters required. A professional audio interface is built in, so you can hook up your headphones, mic, and PA system.
specs: |-
  - 4 channels of control and built-in audio interface
  - 16 multi-color rubber pads with Loop, Sample, and Hot Cue Modes
  - Color-customizable dual-zone platters with touch-sensitivity
  - Crossfader, 3-band EQ, and music navigation controls
  - 16 effects controls for flanger, phaser, echo, and more
  - Built-in audio system connects with headphones, mic, and PA
  - Pitch and Sync controls for seamless and easy mixing
  - Standard MIDI for use with most popular DJ software
  - Class-compliant with both Mac and PC; no driver required
  - USB-powered; no power adapter required
  - Includes Serato DJ Intro (4-channel version) software
