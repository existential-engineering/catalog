description: The DN9331 Helix RAPIDE is a tactile remote control surface that
  offers direct access to all of the graphic equalisation functions of Helix
  digital equalisers, using thirty one console-quality 100 mm motorised faders
  for instant recall of fader positions. It also acts as the networking centre
  of the Show Command System, with an eight port Ethernet hub for connecting
  Helix equalisers, system processors and control laptops.
details: |-
  Instant recall of fader positions is made possible by thirty one console-quality 100 mm long travel high resolution motorised faders. These are custom manufactured to Klark Teknik's standards, featuring long life conductive plastic tracks and driven by fast acting precision servo control circuits.

  A generously specified power supply ensures high speed of response and can supply the peak currents required by simultaneous multiple fader movements, without the lag effects experienced with lower-grade remote fader units.

  The unit integrates a MIDAS and Klark Teknik STS Solo Tracking System interface, which suits it to stage monitoring systems. Combined with a MIDAS Heritage, Legend, Siena or XL8 Live Performance System, the solo buttons on each aux send can be used to instantly recall the graphic equaliser settings of the connected channel of Helix digital equalisation, giving the monitor engineer fast access in situations demanding an immediate response.

  A flexible user interface allows custom remote channel assignments across four banks of 32 channel selection buttons. Four freely assignable group buttons and a global all-channels button allow relative adjustment of channels, which matters when the priority is to stop on-stage feedback first and determine the source second.

  As the networking centre of the Show Command System, the unit incorporates an eight external port Ethernet hub, allowing the connection of Helix digital equalisers and system processors with wired or wireless connections to laptop or tablet PCs running the Elgar Helix EQ RCS and System Controller RCS. It is backwards-compatible with the original Helix DN9340 and DN9344 digital equalisers, which may be interfaced using Ethernet-to-serial converters.
specs: |-
  - 31 console-quality 100 mm long travel motorised faders
  - Long life conductive plastic fader tracks with precision servo control circuits
  - Four banks of 32 channel selection buttons
  - Four freely assignable group buttons plus a global all-channels button
  - MIDAS and Klark Teknik STS Solo Tracking System interface
  - Eight external port Ethernet hub
  - Backwards-compatible with Helix DN9340 and DN9344 via Ethernet-to-serial converters
  - Supports Elgar Helix EQ RCS and System Controller RCS software
