description: A full-size Eurorack replica of the Mutable Instruments Warps meta
  modulator, cross-modulating two audio signals through algorithms like
  crossfade, ring modulation, wavefolding, and vocoding.
details: |-
  NOTE - WARPS REPLICAS DO NOT HAVE THE ABILITY TO USE THE AUDIO FIRMWARE UPDATE FUNCTION, SO SWITCHING FIRMWARE MUST BE DONE WITH A PROGRAMMER. THIS IS THE ONLY CASE OF A REPLICA HAVING THIS ISSUE. PLEASE LET ME KNOW IF YOU WOULD LIKE PARASITES OR ANOTHER FIRMWARE INSTALLED. THANKS

  XMOD is a 1:1 full-size replica of the Mutable Instruments Warps meta modulator, using the same circuit and firmware with identical functionality. Warps cross-modulates two audio signals using a selectable range of algorithms — crossfade, ring modulation, wavefolding, comparators, vocoder and more — with an internal oscillator available as a carrier and an easter-egg frequency shifter mode. Built by hand in California. With genuine Rogan knobs, real Alpha pots and the same components as the original, it is as close as you can come in a new build. Manual: Mutable Instruments Warps documentation
specs: |-
  - 10hp, 25mm deep — skiff friendly
  - Same circuit and firmware as the original
  - FR4 panel
  - Genuine Rogan knobs and Alpha pots
  - Fully tested and calibrated before shipping
  - 2-year Calsynth warranty
