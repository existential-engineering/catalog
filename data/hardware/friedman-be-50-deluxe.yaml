description: The BE-50 Deluxe is a hand-wired three channel, 50 watt all-tube
  guitar head combining Dave Friedman's BE and HBE drive circuits with a clean
  channel inspired by the Buxom Betty. A switchable power section runs at 50
  watts pentode or 25 watts triode, with presence, thump and response controls
  shaping the power amp.
details: |-
  By combining the tonal palette of his BE and HBE circuits with the sparkling cleans of the Buxom Betty in the BE-50 Deluxe amplifier head, Dave Friedman unleashed his most flexible design yet. Thanks to a handful of Friedman's most requested mods, this three channel head is chock full of tone-shaping possibilities and power. With three channels of his most popular circuits and effortless tone sculpting, all while retaining unmatched touch-sensitive purity, Friedman has called the BE-50 Deluxe 50 watt all-tube head the best amp he has ever made.

  Thanks to an astoundingly flexible power section, the BE-50 Deluxe makes a go-to amp on any gig. From the front panel the amp's overall character is tuned with a trio of variable controls, and the rear panel carries a half-power switch as well as one of the most transparent effects loops in the business.

  Housed in the BE-50 Deluxe, Friedman's BE and HBE drive channels are industry standards for high-gain crunch, clarity and nuance. With independent volume and gain controls, as well as some of Friedman's most popular amp modifications, switching between these worlds of grit happens on the fly.

  The clean channel of the BE-50 Deluxe is directly inspired by the chime, glassy top end and full body of the Friedman Buxom Betty amplifier. Not only does it sing with massive headroom and detail, it brings out the very best in pedals and effects as well.
specs: |-
  - 50/25 watt all-tube head
  - Three channels: Clean, BE and HBE
  - Hand-wired in the USA
  - 2 x EL34 power tubes
  - 4 x 12AX7 preamp tubes
  - Clean channel: Volume, Bass, Middle, Treble, with a 3-position bright switch
  - BE channel: Gain 1, Master 1, Bass, Middle, Treble (EQ shared with the HBE channel)
  - HBE channel: Gain 2, Master 2, Bass, Middle, Treble (EQ shared with the BE channel)
  - Footswitchable BE and HBE channels with independent volume and gain
  - SAT, FAT, Bright and Voice switches create a multitude of unique textures
  - 3-position voice switch dictates the top-end response of the dirty channels
  - Fat switch adds low-end girth and warmth
  - 3-way gain structure switch lowers overall gain
  - Presence knob attenuates high frequencies in the power section
  - Thump control adds or removes low-end rumble
  - Response control determines the amp's feel
  - Power toggle selects 50 watt pentode operation or 25 watt triode mode
  - Ultra transparent series effects loop with bypass switch
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Dimensions 8.75 in (D) x 26.75 in (W) x 11 in (H)
  - Weight 37.5 lbs
  - Limited lifetime warranty
