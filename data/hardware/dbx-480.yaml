details: |-
  The dbx 480 is a discontinued processor from the dbx DriveRack product line, designed for installed, portable, and tour audio applications.

  The 480 was compatible with DriveRack Updater software (v2.5) and DriveWare software (v2.6.2) for Windows-based system configuration and management. Speaker tunings were available for JBL VerTec series, JBL AE series, and EAW speaker systems.

  No detailed specifications or extended product description are available on the manufacturer page for this discontinued product.
