details: |-
  The dbx 482 is a discontinued unit from the dbx DriveRack product line, targeting installed, portable, and tour audio markets.

  The 482 was compatible with DriveRack Updater software (v2.5) and DriveWare software (v2.6.2) for Windows-based system configuration. Speaker tunings were available for JBL VerTec series, JBL AE series, and EAW speaker systems.

  No detailed specifications or extended product description are available on the manufacturer page for this discontinued product.
