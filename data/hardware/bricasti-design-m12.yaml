  - preamp
url: https://bricasti.com/en/consumer/m12.php
description: The Bricasti M12 is a dual mono source controller and D/A converter
  that consolidates digital and analog signal processing with network streaming
  capabilities and a pure dual mono analog signal path. Handcrafted in
  Massachusetts, USA.
specs: |-
  - Digital inputs: XLR AES/EBU, BNC S/PDIF, RCA S/PDIF, Toslink optical, USB 2.0, Ethernet
  - Network streaming via DLNA
  - Volume control: 90dB range in 1dB steps
  - Balanced XLR analog outputs
  - Unbalanced RCA analog outputs
  - Trigger output: 1/8-inch TRS
  - Dual mono architecture
  - Handcrafted in Massachusetts, USA
