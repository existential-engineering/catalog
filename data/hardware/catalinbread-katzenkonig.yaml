description: The Katzenkönig combines the best elements of a Tone Bender MkII
  fuzz with a Rat distortion to create something that sings like a fuzz but is
  tight like a distortion. Three germanium transistors drive the front section
  derived from the Tone Bender MKII, with a Filter control providing tonal
  variations unavailable on the original. Compatible with both humbuckers and
  single coils, and works equally well with cranked or clean amplifiers.
details: |-
  The Katzenkönig is a hybrid fuzz/distortion that merges the three-transistor germanium circuit of the Sola Sound Tone Bender MKII with the tight, cutting tone of a Rat-style distortion. The front section uses three germanium transistors in a progressively louder gain structure, while the Filter control shapes the high end in a way not found on the original Tone Bender.

  The combination gives you fuzz warmth and bloom with distortion's note definition and clarity. It accommodates both humbuckers and single coils without adjustment, and responds well in front of both clean and cranked amplifiers. Accepts 9V battery or DC power. Handmade in Portland, Oregon with a 3-year warranty.
