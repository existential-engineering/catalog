description: The Phil X Signature is a hand-wired, single channel 100-watt head
  powered by four EL34s, built with session guitarist Phil X. A foot-switchable
  solo boost, a gain structure switch, a line out and an ultra transparent
  series effects loop round out the panel.
details: |-
  Session and touring guitarist Phil X is the go-to player for heavyweights like Alice Cooper, Rob Zombie, Bon Jovi, Avril Lavigne and Tommy Lee. Particular about his tone, he would settle for nothing less than perfection when collaborating with a builder on his signature amp, and turned to Dave Friedman, sound architect to some of rock's most recognizable names and their iconic tones.

  The result is a single channel 100-watt head simply dubbed the Friedman Phil X. This EL34 powered amp moves from a dynamic clean tone to a crunchy rhythm sound by rolling on the guitar's volume knob, and kicking in the foot-switchable boost takes it to a searing lead tone.

  The front panel also features a gain structure switch to further dial in the sound, plus a switch to select high and low voltage, which works in the manner of a variac. A line out with level control and the ultra transparent series effects loop complete the feature set.

  The hand crafted in the USA Phil X head features black Tolex encasing tongue and groove Baltic Birch construction and is built to withstand the rigors of the road.
specs: |-
  - 100-watt all-tube head
  - Single channel with solo master
  - Hand-wired in the USA
  - 4 x EL34 power tubes
  - 4 x 12AX7 preamp tubes
  - Two master volumes and one gain control
  - Full EQ consisting of bass, middle, treble and presence
  - Gain switch varies the global gain structure of the amp
  - Switch to select high and low voltage
  - Line out with level control
  - Ultra transparent series FX loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Single button footswitch with LED
  - Dimensions: 8.75 inches (D) x 29.25 inches (W) x 12.25 inches (H)
  - Weight: 43 lbs
  - Limited lifetime warranty
