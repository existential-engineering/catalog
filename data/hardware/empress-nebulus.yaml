description: A compact modulation pedal offering high-quality chorus, flanger
  and vibrato effects, each with three variations for nine tweakable modes. Up
  to eight presets, per-mode voicing options and true bypass pack a lot of range
  into a small box.
details: |-
  The Nebulus brings chorus, flanger and vibrato to a compact 4.5 by 3.5 inch pedal, with three variations on each effect for a total of nine modes, all accessible via a preset system that stores up to eight presets. Chorus mode offers a lush, warm chorus, a fluid multi-chorus and a unique tremolo'ed chorus. Flanger covers a classic tape flange, a 70s negative-feedback flanger and a thru-zero flange. Vibrato includes a standard vibrato, a classic vibe sound and a rotating speaker effect.

  Each mode has a special switch for tweaking crucial settings, with bonus features such as adding compression to vibrato mode. A tone switch offers warm, clean and bright voicings, and soft-touch switches drive a relay bypass for smooth transitions. The pedal is true bypass and delivers the sound quality guitarists expect from Empress in a very small enclosure.
specs: |-
  - 9 modes: Chorus (lush, multi-chorus, tremolo'ed), Flanger (tape, 70s negative feedback, thru-zero), Vibrato (standard, vibe, rotating speaker)
  - Up to 8 presets
  - Special switch per mode plus advanced configuration
  - Tone switch: warm / clean / bright voicings
  - Soft-touch relay bypass switching
  - True bypass
  - Input impedance: 1M / Output impedance: 1K
  - Frequency response (-3dB): 8Hz - 18.5kHz
  - Input headroom +10.8dBu / Output headroom +10.2dBu
  - Distortion 0.40% / Signal to noise 102.7dB
  - Power: 9-12V DC (negative tip), 2.1mm barrel connector
  - Power consumption: ~300mA
  - Enclosure: die-cast aluminum
  - Dimensions: 3.5" L x 4.5" W x 1.5" H (enclosure), 2" H including controls
  - Weight: 1 lb
