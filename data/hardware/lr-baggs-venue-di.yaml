details: |-
  Built on the shoulders of the legendary Para Acoustic DI, the Baggs Venue DI puts you in the driver’s seat of your own sound, in any venue. Guitarists know they will face unpredictable stages, from faulty monitors to questionable house PAs, and the constant threat of feedback. The Venue was built with sound quality at the forefront, using best-in-class and custom-designed audio components usually reserved for elite studio gear. Roadworthy enough to survive any tour, it’s your personal command center, giving you the studio-quality tools you need to travel light, set up fast, and sound incredible in any environment.
specs: |-
  - Adjustable gain for both passive and active pickups
  - 5 band EQ with tunable low-mid and high-mid bands
  - Garrett Null notch filter for effective feedback control
  - Phase inversion for best sound and feedback control
  - Full chromatic tuner with footswitch mute/tune function
  - Adjustable volume boost footswitch
  - Full isolation audio transformer-coupled DI
  - 4 segment clip meter and 4 segment battery status gauge
  - 9V battery or 9V DC adapter (adapter not included)
