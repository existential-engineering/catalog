description: ISW-8 is Bowers & Wilkins flagship in-wall subwoofer; it delivers
  exceptional subwoofer performance for custom installed applications. It's a
  no-compromise design for when power and performance are key, but has a thin
  profile that allows it to fit into a 2in x 4in stud wall.
details: |-
  ISW-8 is the flagship in-wall subwoofer in the Bowers & Wilkins custom installation range. It is built around a single 304.8mm (12in) Aerofoil Profile bass driver on a 400mm x 400mm baffle, and is designed to be installed in a closed-box cabinet, the BB ISW-8 back box, which is sold separately. That back box is only 84mm (3.3in) deep, so the complete assembly fits inside a conventional 2in x 4in stud wall.

  It is a passive subwoofer. The information sheet lists an 8 ohm nominal impedance and 1000W power handling and describes no on-board amplifier, no mains connection and no gain, crossover or phase controls, so the ISW-8 is driven from an external power amplifier in the same way as the rest of the Custom Installation range.

  The 12in Aerofoil driver uses neodymium magnets and offers the longest excursion of any in-wall subwoofer Bowers & Wilkins has made, which the company presents as the combination of high power handling with precise control. The baffle is 400mm x 400mm and 8.5mm thick. The BB ISW-8 back box it mounts into is a braced MDF cabinet enclosing 30 litres, 1640mm (64.6in) tall by 350mm (13.8in) wide.

  To keep that output from reaching the building, the backbox hangs from the wall on integrated vibration isolation mounts, which Bowers & Wilkins says reduces vibration transferred from the cabinet into the wall and improves both performance and structural integrity.

  Bowers & Wilkins positions the ISW-8 as a partner for its high-end CI700 and CI800 custom installation speakers, in home cinema systems and in high-performance two-channel installations. The BB ISW-8 back box is not included with the ISW-8 and is purchased separately.
specs: |-
  - Type: in-wall subwoofer
  - Drive units: 1x 304.8mm (12in) Aerofoil Profile bass driver with neodymium magnets
  - Passive: no on-board amplifier and no mains connection, driven from an external power amplifier
  - Nominal impedance: 8 ohms
  - Power handling: 1000W
  - Frequency response (-3dB): 16Hz to 200Hz
  - Frequency range (-6dB): 12Hz to 260Hz
  - Enclosure (BB ISW-8 back box, sold separately): closed-box, braced MDF, 30L volume
  - BB ISW-8 back box dimensions: 1640mm (64.6in) H x 350mm (13.8in) W x 84mm (3.3in) D
  - Baffle dimensions: 400mm (15.8in) H x 400mm (15.8in) W x 8.5mm (0.3in) D
  - Fits a 2in x 4in stud wall when installed in the BB ISW-8 back box
  - Back box hung on integrated vibration isolation mounts
  - Back box not included: requires the separately purchased BB ISW-8
  - Finish: Black
  - Intended to partner the CI700 and CI800 custom installation speakers
