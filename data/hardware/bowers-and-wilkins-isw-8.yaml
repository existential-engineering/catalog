details: |-
  ISW-8 is Bowers & Wilkins flagship in-wall subwoofer. It delivers exceptional subwoofer performance for custom installed applications. It’s a no-compromise design for when power and performance are key, but has a thin profile that allows it to fit into a 2in x 4in stud wall.

  Advanced technology = high-performance sound. ISW-8 features the longest excursion from an in-wall subwoofer Bowers & Wilkins has ever made. Its 12in Aerofoil driver uses Neodymium magnets and can deliver both incredible levels of power and precise control for a sensational listening experience.

  Designed to work with the best. ISW-8 is primarily targeted to work with Bowers & Wilkins high-end CI700 and CI800 custom installation speakers in both home cinema and high-performance two-channel installations.

  Reduced vibration. To counter the incredible power on offer, the ISW-8’s backbox is designed to be hung from the wall using new Integrated vibration isolation mounts. This helps reduce any vibration transferring from the cabinet to the walls, providing both improved performance and structural integrity.

  The product page states that the back box is not included. The matching back box, BB ISW-8, is covered by the same installation instructions and dimensioned drawings that the page links to, and its rear panel carries the positive (red) and negative (black) speaker terminals shown on the drawing sheet.
specs: |-
  - Type: In-wall subwoofer
  - Description: Closed-box subwoofer
  - Drive units: 1x ⌀304.8mm (12in) Aerofoil Profile bass driver
  - Cone material: Aerofoil Profile bass cone
  - Nominal impedance: 8 ohms
  - Power handling: 1000W
  - Frequency response (-3dB): 16Hz to 200Hz
  - Frequency range (-6dB): 12Hz to 260Hz
  - Cabinet material: MDF
  - Cabinet bracing: Yes
  - Cabinet volume: 30L
  - Cabinet dimensions: Height 1640mm (64.6in), Width 350mm (13.8in), Depth 84mm (3.3in)
  - Baffle dimensions: Height 400mm (15.8in), Width 400mm (15.8in), Depth 8.5mm (0.3in)
  - Fits a 2in x 4in stud wall
  - Passive design, requires an external power amplifier
  - Back box not included (BB ISW-8 supplied separately)
  - Finish: Black
  - Passive in-wall subwoofer, with no built-in amplifier and no mains inlet of its own
  - Driven from an external distribution amplifier, the CDA-2HD in the installation instructions, which is the unit connected to the mains supply
  - Impedance 8 ohms, power handling 1000W
