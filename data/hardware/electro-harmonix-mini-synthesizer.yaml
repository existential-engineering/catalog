description: >-
  The Electro-Harmonix Mini-Synthesizer is a compact, budget-friendly monophonic analog
  synthesizer from the early 1980s with a 25-note membrane keyboard, a single pulse-wave
  oscillator, and a quirky phase-shifting filter.
details: |-
  The Mini-Synthesizer is a novelty instrument by modern standards, housed in a small plastic and
  metal enclosure with colorful sliders and membrane buttons rather than traditional keys. The
  25-note membrane keyboard can be uncomfortable and unreliable to play, though it shares the
  touch-sensitive concept with instruments from Buchla and Serge. A built-in speaker confirms
  its entry-level positioning.

  The sound engine centers on a single analog VCO producing only a pulse waveform, with an
  octave divider and a dedicated LFO providing pulse-width modulation. While the single oscillator
  limits its capacity for thick analog bass, the quirky filter section adds character. Two sliders
  set the filter cutoff at the start and end of a note, a third controls the sweep rate between
  those points, and a fourth adjusts phase-shifting of the filter.

  Later production models added an analog delay effect for echo capabilities and a ribbon
  controller above the keyboard for glide effects, significantly enhancing the instrument's
  sonic possibilities.

  Notable users include Van Halen, Jean-Michel Jarre, Jimmy Edgar, and the Moog Cookbook,
  demonstrating that this humble instrument found its way into some surprisingly high-profile
  recordings.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (pulse waveform only, with octave divider)
  - LFO: 1 (pulse-width modulation)
  - Filter: VCF with sweep rate, phase shifting, Q/resonance, sensitivity
  - Effects: Analog delay (later models only)
  - Keyboard: 25 membrane keys
  - Memory: None
  - Control: None
releaseDate: "1980"
releaseDateYearOnly: true
