description: >-
  The Electro-Harmonix Mini-Synthesizer is a compact, entry-level monophonic
  analog synthesizer housed in a plastic and metal enclosure with a 25-note
  membrane keyboard. It features a single VCO with pulse waveform, an
  unconventional filter with sweep controls, and a built-in speaker with
  colorful sliders for sound manipulation.
details: |-
  The Mini-Synthesizer uses a single analog VCO with only a pulse waveform, supplemented by an octave divider and a dedicated LFO for pulse-width modulation effects. The filter design is unconventional, featuring sliders that control cutoff points at note start and end, sweep rate between them, and phase-shifting capabilities. Resonance, phase selection, and sensitivity are controlled via on/off switches, with an additional 2x switch creating phase-shifty effects.

  The keyboard employs membrane buttons rather than traditional keys, which proves uncomfortable and unreliable during play. This design approach was also attempted in instruments like the EDP Wasp and advanced Buchla and Serge machines. Some later models included an analog delay effect and a ribbon controller above the keyboard for glide effects.

  The instrument lacks memory, ADSR envelope controls, and CV/Gate connectivity, which were standard features on contemporary synthesizers. The single VCO cannot produce the thick or punchy analog bass tones that more sophisticated instruments deliver. Despite these limitations, the Mini-Synthesizer found use among notable artists and remains primarily valued as a collectible.

  With its built-in speaker and portable form factor, the Mini-Synthesizer represented Electro-Harmonix's attempt to bring synthesis to a wider audience at an accessible price point, though its limited feature set and unconventional keyboard ultimately constrained its appeal as a serious performance instrument.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (pulse waveform only)
  - Sub-Oscillator: Octave divider
  - Filter: VCF with sweep rate, 2x effect, phase, Q (resonance), sensitivity
  - LFO: Yes (pulse-width modulation)
  - Keyboard: 25 membrane keys
  - Memory: None
  - Control: No CV/Gate
  - Effects: Analog delay (later models only)
  - Speaker: Built-in
releaseDate: "1980"
