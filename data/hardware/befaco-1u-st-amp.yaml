details: |-
  The 1U ST AMP is a compact stereo amplifier module from Befaco designed to boost external signals into Eurorack modular levels. It follows the Intellijel 1U format standard, making it compatible with both Befaco 7U cases and Intellijel cases.

  The module offers three selectable gain modes — x1, x5, and x10 — giving users flexibility when interfacing line-level instruments, consumer audio gear, or other external sources with their modular system.

  Built-in level meter LEDs provide real-time visual feedback on signal levels, helping users avoid clipping and maintain proper signal gain staging.

  Designed and assembled in Barcelona, the 1U ST AMP features an aluminum heat-treated front panel. It is available both as a fully assembled module and as a DIY kit through Befaco's shop.
