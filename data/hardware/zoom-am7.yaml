description: The Am7 is a mid-side stereo microphone that connects to an Android device through its USB Type-C port, with a capsule switchable between 90 degrees, 120 degrees and raw mid-side. The mic position rotates between audio and video orientations, and a front-facing MIC gain knob, LED level meters and a headphone jack that doubles as a line output sit on the body.
details: |-
  The Am7 is the audio companion for an Android device. Ideal for music videos, video podcasts, vlogging and more, it makes videos sound as good as they look, connecting straight to the phone's USB Type-C port. A removable case adjuster lets the connector seat properly when the device is in a case.

  The mid-side capsule gives a choice of 90 degrees for standard stereo, 120 degrees for a wider sonic image, or raw Mid-Side for a stereo image set afterwards. The mic position rotates to align with the camera for recording audio while shooting video. Rotated to the audio position, the phone can be pointed like a microphone at the sound being recorded. The Am7 can also shoot in selfie mode, with the Zoom Handy Recorder app, so the creator is in the centre of the action.

  Input level is set with a large front-facing MIC gain knob and LED level meters, and the headphone jack monitors audio before, during and after recording. That jack doubles as a line level output.

  The Zoom Handy Recorder app, on Google Play, records, edits and shares audio from an Android device and uploads directly to SoundCloud or Google Drive. Mobile HandyShare is an enhanced mobile recording app for Android that integrates the phone's camera with the Am7, combining 4K video with record and playback level meters, direct monitoring and dedicated Am7 controls.

  Mobile HandyShare provides camera zoom and focus and can use the front and rear cameras for selfie-mode recording. It records up to 4K resolution at 60 fps and supports video files larger than 4 GB, so a performance-length video can be captured at high resolution in a single file. For audio it adds clip detection and zero latency monitoring at sample rates of 44.1 or 48 kHz, and it requires Android 10 or later (Android 9 has limitations such as no monitor sound output during recording and a level meter that shows the same left and right).
specs: |-
  - Microphone type: mid-side (M-S) stereo mic, switchable 90 degrees / 120 degrees / M-S raw
  - Maximum input sound pressure: 120 dB SPL
  - Input gain: +3 to +43 dB
  - Audio quality: 44.1 kHz/16-bit, 48 kHz/16-bit
  - Power: powered by the connected device
  - Connector: USB Type-C connector, with a removable case adjuster for cased devices
  - Stereo mini jack: combined headphone and line level output
  - Front-facing MIC gain knob, LED level indicator and stereo width switch
  - Two modes: audio and video, with a mic capsule that rotates between them and flips for the selfie camera
  - Zero latency audio monitoring when using the ZOOM Handy Recorder app
  - Not compatible with an iPhone or iPad that has a USB-C connector. Connected to an iPhone or iPad, the Am7 headphone output is fixed at maximum volume and cannot be adjusted
  - Mobile HandyShare app system requirements: Android 10 or later
  - Included: Am7 stereo microphone, foam windscreen, operation manual
  - Dimensions: 54.5 mm (W) x 57.5 mm (D) x 28.1 mm (H)
  - Weight: 31.8 g
