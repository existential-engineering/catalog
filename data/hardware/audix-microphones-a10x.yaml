details: |-
  The A10X Earphones are designed for the ultimate immersive listening experience. At the heart of the earphone is a dynamic low-mass moving coil assembly and composite beryllium diaphragm delivering over ten octaves of balanced frequency response and extended bass. With exceptional imaging, isolation and phase coherence, the A10X accurately presents the full details of your music.
specs: |-
  - Driver: 10 mm dynamic, beryllium composite diaphragm
  - Frequency response: over ten octaves, extended bass
  - Connector: detachable gold-plated MMCX, 360-degree rotation
  - Ear tips: silicone (small, medium, large)
