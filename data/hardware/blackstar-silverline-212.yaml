details: |-
  The Silverline 212 is a 2x12 speaker cabinet designed as the matched pairing for the Silverline Deluxe Head. Loaded with Celestion V-Type speakers, it complements the Silverline Series' boutique-grade digital amplification with authentic guitar amplifier voicing.

  The cabinet can be operated in mono (4 Ohm or 16 Ohm) or stereo (8 Ohm L/R) configurations, providing flexible routing options for a variety of stage and studio setups.
specs: |-
  - 2x 12" Celestion V-Type speakers
  - 140W power handling
  - Mono 4 Ohm / Mono 16 Ohm / Stereo 8 Ohm (L/R)
  - Matched pairing for the Silverline Deluxe Head
