description: DX3 as special Traktor Pro controller is the perfect solution for
  setups with external mixer. The device controls effects, loops, pitch, key,
  cues, transport, filters and browser.
details: |-
  DX3 as special Traktor Pro controller is the perfect solution for setups with external mixer. The device controls effects, loops, pitch, key, cues, transport, filters and browser.

  It is a special controller for DJ software, optimised for Native Instruments Traktor Pro, and setup files for Traktor Pro/Duo are shipped with the controller. The USB interface is class compliant, so no driver is necessary.

  DX3 controls up to four decks, with easy switching between deck A-C and B-D on the fly. Four FX slots are available, with access to two FX slots simultaneously by 8 pots and 10 buttons, and 4 presets per FX slot to store FX types and FX modes (advanced/chained). A browser section with encoder and 2 load buttons adds tree navigation, and 4 multifunctional encoders each carry 3 independently switchable groups for various functions.

  About 250 commands are available and all are freely reassignable, with all controls carrying a double function by holding down the shift button. 33 LEDs in different colors display various informations, including indication of FX, play, sync, loop and filter states by feedback data from the computer software.

  The very compact design uses a black, plastic casing in desktop format, 180 x 105 x 70 mm and 350 g, with a silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions. Faders, pots and encoders are high-quality parts from ALPS, with new rubber knobs for best tactile feeling.
specs: |-
  - Special controller for DJ software (optimised for Native Instruments Traktor Pro)
  - Setup files for Traktor Pro/Duo shipped with the controller
  - USB interface, class compliant, no driver necessary
  - Controls up to four decks, easy switching between deck A-C and B-D on the fly
  - 4 FX slots available, access to 2 FX slots simultaneously by 8 pots and 10 buttons
  - 4 presets per FX slot to store FX types and FX modes (advanced/chained)
  - About 250 commands, all freely reassignable
  - Browser section with encoder and 2 load buttons (with additional tree navigation)
  - 4 multifunctional encoders with each 3 independently switchable groups for various functions
  - 31 coloured buttons
  - All controls with double function by holding down the shift button
  - 33 LEDs in different colors to display various informations
  - Indication of FX, play, sync, loop, filter states by feedback data from computer software
  - USB bus-powered, consumption less than 500 mW / 100 mA
  - Very compact design in a black, plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - Requires a PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - Requires Native Instruments Traktor Pro/Duo (as of version 1.2.4) or software which allows user assignments of continuous parameters (CC) and note commands
