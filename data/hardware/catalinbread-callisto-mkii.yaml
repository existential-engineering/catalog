details: |-
  The Callisto MKII is Catalinbread's fully analog chorus and flanger hybrid pedal, redesigned and improved from the original Callisto. It is built around 100% analog circuitry, giving it the warm, organic character associated with classic bucket-brigade style modulation effects.

  The pedal features four controls: Rate adjusts the LFO speed, Depth sets the intensity of the modulation, Mix blends the dry and wet signals (noon position yields classic chorus tones), and Feedback regenerates the modulated signal to dial in anything from clean chorus to more pronounced flanger-type tones.

  The Feedback control is the key to the Callisto MKII's versatility. At lower settings it produces lush, transparent chorus. As feedback increases, the effect takes on the metallic, comb-filtered qualities of a flanger. Combined with the Depth control, users can also achieve pitch vibrato and subtle tape-like wobble.
