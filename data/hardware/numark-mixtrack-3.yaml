description: All-in-one Controller Solution for Virtual DJ.
details: |-
  From Numark the world's leading innovator of DJ equipment and technologies, comes the incredible Mixtrack 3 DJ controller, designed with the skilled, professionally-aspiring DJ in mind. It's the latest addition to the Numark family of industry-leading DJ solutions. This controller offers a whole host of features and performance that sets it way above conventional DJ controllers, yet it offers great bang-for-the-buck and it's a snap to take anywhere.

  When action is non-stop, we make sure you're the one in the driver's seat. Mixtrack 3 keeps everything you loved about the Mixtrack II and adds 100mm pitch sliders that make it easy to perform even the finest pitch adjustments, so it's easy to keep two cuts in perfect beat sync without any drift.

  Dive into 16 multi-function backlit performance pads and add loops, launch samples, and control hot cues to your performance. Use the multi-function touch strip for dynamic FX control and track search operation. There are dedicated filter knobs for each channel, to give you just the exact amount of tonal control you need for that perfect sound.

  Get precise control over every track and every transition with Mixtrack 3's advanced low-profile rugged metal platters. They are capacitive and dual-zone, giving you the ability to scratch or stop a track simply by touching the top of the platter, while at the same time allowing you to adjust the pitch by manipulating the platter from the side.

  Includes a Prime Loops remix tool kit with 6 sample packs and over 380 premium instrumental loops, drum kits, one-shots, and more (a $200 value). Also gives exclusive access to download studio-grade audio stems from the Toolroom Records catalog.
specs: |-
  - Dedicated Filter knobs for each channel
  - Multi-function Touch strip for dynamic FX control and Strip Search
  - 16 multi-function performance pads
  - All-new high resolution metal jog wheels
  - Multiple FX manipulation
  - Includes Prime Loops remix tool kit
  - Dedicated track browsing controls from your library
  - 100mm pitch sliders
  - Capacitive, dual-zone low-profile metal platters
  - Mac system requirements: Mac OS X 10.6 - macOS 10.13 High Sierra, 1.6GHz Intel Core Duo (i3/i5/i7 supported), 1GB RAM minimum, 1024x768 screen resolution, available USB 2.0 port
  - Windows system requirements: Windows Vista SP1, Windows 7 SP1, Windows 8, 8.1, or 10; 2GHz Intel Core 2 Duo; available USB 2.0 port
