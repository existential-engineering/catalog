details: |-
  Story

  Introducing the Regata LTD: a limited-edition take on our best-selling semi-hollow guitar, dressed to impress in a striking Tuxedo Black finish. Crisp white binding, pickguard, and appointments create a bold monochrome look that delivers black-tie elegance with a dangerous edge. At its heart is a pair of handwound Dagger Sonic True Vintage pickups from Dagger Guitars. Inspired by the clarity, punch, and dynamic response of classic DeArmond Dynasonics, they deliver articulate cleans, muscular lows, and a lively top end that responds beautifully to every nuance of your playing. Beneath its exclusive finish, the Regata LTD retains the lightweight semi-hollow construction, comfortable satin-finished chunky C+ mahogany neck, 25-inch scale, and extended 24-fret range of the Regata Classico . The result is a highly responsive instrument: vintage at heart, modern in the hand, and loaded with attitude. Features and Specs

  Case Fit
