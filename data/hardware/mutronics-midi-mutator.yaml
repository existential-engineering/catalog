description: >-
  The Mutronics MIDI Mutator is a rack-mount stereo analog filter, modulation, and
  envelope follower unit designed for real-time audio processing. Featuring dual
  independent 24dB/octave resonant filters with envelope followers and a shared LFO, it
  became iconic in 1990s dance music production. Notable users include Daft Punk, Fatboy
  Slim, Future Sound of London, Depeche Mode, and Radiohead.
details: |-
  The Mutronics MIDI Mutator is a dedicated effects processor that became iconic in dance music production during the 1990s. Its two identical, fully independent filters operate in either stereo or dual mono configurations with analog circuitry throughout. Each filter includes its own envelope follower and access to a shared LFO with four selectable waveform types that can be linked or inverted for creative sound design.

    A standout feature is its MIDI implementation, which enables keyboard note control of filter cutoff frequencies. Playing notes on a connected keyboard or sequencer directly corresponds to filter cutoff positions, and pitch-bend data further manipulates the cutoff in real-time, offering intuitive, performance-oriented control over the filtering process.

    The device contains no patch memory, but this design choice reflects its intended purpose as a machine meant to be grabbed and played with live, whether going to tape or performing on stage. The LFO can synchronize to external MIDI clock for tempo-locked modulation effects.

    The Mutator achieved prominence in professional music production, becoming closely associated with the sound of Daft Punk. It was also employed by Fatboy Slim, Future Sound of London, Depeche Mode, and Radiohead, and remains a sought-after piece of analog processing gear.
specs: |-
  - Stereo/Dual Mono analog effects processor
    - 2 identical, independent resonant filters
    - 24dB/octave filter rolloff
    - LFO with 4 selectable waveform types
    - LFO linkable and invertible between channels
    - MIDI sync for LFO
    - Envelope follower with attack and release controls per channel
    - MIDI control of filter cutoff via note and pitch-bend data
    - No patch memory
    - Rack-mount format
