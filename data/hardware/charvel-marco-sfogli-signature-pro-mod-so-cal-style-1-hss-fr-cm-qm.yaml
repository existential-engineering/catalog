details: |-
  The Marco Sfogli Signature Pro-Mod So-Cal Style 1 pairs an alder body capped with a quilt maple top in a Transparent Purple Burst gloss finish, featuring a scalloped lower back bout and sculpted shredder's cut heel for comfortable upper-fret access.

  The bolt-on caramelized maple neck has heat treatment for vintage character, graphite reinforcement, a hand-rubbed satin urethane back finish, a Speed Neck profile with rolled fingerboard edges, Luminlay side dots, and a heel-mounted truss rod adjustment wheel.

  A caramelized maple fingerboard with a 12"-16" compound radius hosts 22 jumbo frets and cream dot inlays, anchored by a Floyd Rose 1000 Series locking nut and a 25.5" scale length.

  Electronics are built around an active HSS configuration: an EMG 89 humbucker at the bridge paired with EMG SA single-coils in the middle and neck positions, routed through a 5-position blade switch with a push/pull coil-split volume control and master tone.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo, Charvel-branded die-cast tuning machines, a 3-ply black pickguard, and Stratocaster-style skirt control knobs in a chrome hardware finish. The headstock is a licensed Fender Stratocaster shape.
