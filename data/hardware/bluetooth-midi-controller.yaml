name: Bluetooth MIDI Controller
manufacturer: zzsound
primaryCategory: controller
url: https://www.zzsound.net/bluetooth-midi-controller
description: Bluetooth MIDI Controller turns your iOS and ipados devices in a
  wireless MIDI controller. Control your favourites iOS, ipados and desktop
  Bluetooth le MIDI DAWs, instruments and effects from your iphone and ipad.
details: |-
  Bluetooth MIDI Controller turns your iOS and ipados devices in a wireless MIDI
  controller. Control your favourites iOS, ipados and desktop Bluetooth le MIDI
  DAWs, instruments and effects from your iphone and ipad.

  Up to 64 faders that sends cc MIDI messages, 128 on ipad. Bluetooth low energy
  MIDI.

  Push connect button and in the opened view turn on the switch button. This
  will make your device discoverable by your Bluetooth MIDI host, connect it
  from it and you will can control your MIDI host from b.m.c.. If your MIDI host
  don't support Bluetooth MIDI there are some free apps on the market that
  creates virtual Bluetooth MIDI ports.
specs: |-
  - Bluetooth low energy MIDI
  - Up to 64 faders on iOS
  - 128 faders on ipad
  - Cc MIDI messages
  - Wireless MIDI controller
  - iOS and ipados compatible
  - Bluetooth le MIDI support
