description: >-
  The Roland RS-101 is a fully polyphonic analog string synthesizer released in 1975, and
  was Roland's first string synthesizer. It features a 61-key keyboard with three timbres
  (Strings I, Strings II, and Brass) generated from a single divide-down oscillator, and
  was the first keyboard instrument to use Roland's famous ensemble effect.
details: |-
  The RS-101 was Roland's first foray into the string synthesizer market when it debuted in 1975. Built around a single divide-down oscillator, it produces three basic tones: Strings I delivers a classic divide-down sawtooth sound, Strings II provides the same tone an octave above, and Brass applies a different filter to the same fundamental waveform. All three sounds are filtered separately but share the same volume articulation.

  The keyboard features a fixed split point at two octaves up, allowing independent control of each half. Each section offers a Slow Attack switch for selecting between quick and gradual attack, a Volume Soft switch for full or reduced volume, and a Sustain slider for adjusting release time. Tone shaping is handled by single brightness sliders for Strings and Brass respectively, along with a vibrato control that adjusts the depth of a fixed-speed pitch variation.

  The RS-101 was the first keyboard instrument to feature Roland's famous ensemble effect, powered by a four-Bucket Brigade circuit. Though offering no user-adjustable parameters, this ensemble circuit plays a huge part in the well-loved and familiar synthesizer string sound of the era. The instrument is housed in a hard case with a detachable lid and carry strap.

  Connectivity is minimal, with just two mono quarter-inch outputs (high and low) and no triggers, gates, or expression pedal inputs. The RS-101 was succeeded one year later by the RS-202, which added ensemble circuit modifications and additional controls while retaining the same sound-generating design and form factor.
specs: |-
  - Polyphony: 61 voices (divide-down, fully polyphonic)
  - Multitimbral: 3 parts (Brass, Strings I, Strings II)
  - Oscillators: 1 divide-down oscillator
  - Waveforms: Divide-down sawtooth
  - Filter: Fixed filters with cutoff control for Strings and Brass
  - LFO: 1 (vibrato with fixed speed, variable depth)
  - VCA: Switched attack, variable release, volume soft switch
  - Effects: Ensemble (four-Bucket Brigade circuit, no user control)
  - Keyboard: 61 keys (5 octaves, F-F), no velocity sensitivity
  - Outputs: 2x mono 1/4-inch (high and low)
