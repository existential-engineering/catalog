description: Handheld dynamic vocal microphone with a supercardioid pattern, a
  custom neodymium capsule and an internal shock mount. Its Mic Control switch
  remotely controls a connected TC-Helicon vocal processor.
details: |-
  The MP-85 is a high-output dynamic vocal microphone designed for working singers who want studio-grade clarity in a live-tough chassis. An advanced supercardioid pattern delivers tighter off-axis rejection than a typical cardioid, which means more gain before feedback on cramped stages and cleaner harmonies when the microphone is paired with a voice processor.

  The custom neodymium capsule pushes a hot signal to the mixer, the multi-stage pop filter tames sibilance and breath noise, and an internal shock mount cuts handling rumble. It holds up across festival stages, worship services and street performance.
specs: |-
  - Supercardioid polar pattern
  - Custom neodymium capsule
  - Multi-stage pop filter
  - Internal shock mount
  - Mic Control switch for remote control of a connected TC-Helicon vocal processor
