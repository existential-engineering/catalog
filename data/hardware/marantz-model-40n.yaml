description: 70W premium integrated stereo amplifier powered by HEOS with HDMI
  ARC. The Model 40n reimagines the integrated amplifier for the digital age
  while preserving a luxurious analog feel and sound, combining artisanal design
  with modern streaming capabilities. Features custom HDAM (Hyper Dynamic
  Amplifier Modules) technology, MM phono input with Marantz Musical Phono EQ,
  and was meticulously tuned by Marantz Sound Masters.
details: |-
  MODEL 40n is an integrated stereo amplifier with streaming built in, rated at 70W + 70W into 8 ohms and 100W + 100W into 4 ohms. It unlocks high-resolution digital music streams and local music file libraries over AirPlay, Bluetooth and HEOS, and takes TV audio over built-in HDMI ARC.

  MODEL 40n follows a long line of historic Marantz pieces notable for their design. Every aspect is considered, from premium materials and symmetry to the classic porthole display and the smooth operation of the volume control.

  To preserve the detail, nuance, and essence of the music, Marantz developed HDAM (Hyper Dynamic Amplifier Modules), which are superior in speed and response to off-the-shelf modules. The power amplifier circuit is HDAM-SA3 with a double shielded toroidal transformer. The Marantz Sound Master tuned MODEL 40n with careful parts selection.

  Connectivity covers four analog inputs including a Marantz Musical Phono EQ moving magnet phono stage, a recorder output, optical and coaxial digital inputs, one HDMI ARC input, a rear USB-A port for mass storage, wired and wireless networking, and a subwoofer pre-out with a selectable low-pass filter at 40, 60, 80, 100 or 120 Hz.
specs: |-
  - Rated output power: 70W + 70W (8 ohm)
  - 100W + 100W (4 ohm)
  - Power amplifier circuit: HDAM-SA3
  - Power transformer: double shielded toroidal
  - Frequency response: 5Hz - 100kHz
  - Total harmonic distortion: 0.02% (20Hz - 20kHz, 8 ohm)
  - Damping factor: 100
  - Phono input sensitivity: 2 mV / 47 kohm (MM, Marantz Musical Phono EQ)
  - Input sensitivity CD/Line/Recorder: 220 mV / 20 kohm
  - Input sensitivity power amplifier input: 1.6 V / 15 kohm
  - SN ratio: Phono MM 87dB, CD 106dB
  - Analog input (including phono) / Rec Out (RCA): 4 (Phono, CD, Line, Recorder) / 1 (Recorder)
  - Optical input: 1
  - Coaxial input: 1
  - HDMI input/output: 1 / 0 (ARC), PCM only
  - USB-A: 1 (rear), Mass Storage Class, 5V/1A
  - Subwoofer pre-out low pass filter: selectable 40 / 60 / 80 / 100 / 120 Hz
  - Speaker terminal: SPKT-1+, 4~16 ohm
  - Remote control bus terminal (RC-5 in / out)
  - Streaming: HEOS Built-in, AirPlay 2, Bluetooth, Spotify, Tidal, Amazon Music, Pandora, iHeartRadio, TuneIn, Roon Ready
  - Voice control: Amazon Alexa, Google Assistant, Apple Siri
  - Ext. pre input (power amp direct)
  - bass / treble / balance controls
  - Source Direct
  - Power consumption: 220W
  - 0.3W standby
  - Dimensions: 17.4 x 5.1 x 17 in (W x H x D)
  - weight 36 lbs 13 oz
  - 5 year warranty
