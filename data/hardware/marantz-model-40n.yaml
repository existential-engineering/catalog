description: 70W premium integrated stereo amplifier powered by HEOS with HDMI
  ARC. The Model 40n reimagines the integrated amplifier for the digital age
  while preserving a luxurious analog feel and sound, combining artisanal design
  with modern streaming capabilities. Features custom HDAM (Hyper Dynamic
  Amplifier Modules) technology, MM phono input with Marantz Musical Phono EQ,
  and was meticulously tuned by Marantz Sound Masters.
details: |-
  Marantz has reimagined the integrated amplifier for the digital age while preserving a luxurious analog feel and sound. The Model 40n combines artisanal design with modern streaming capabilities. It features custom HDAM (Hyper Dynamic Amplifier Modules) technology and was meticulously tuned by Marantz Sound Masters for optimal performance. The device is engineered for durability across generations with premium materials and exemplary build quality. HEOS built-in support enables multi-room audio and streaming, while an HDMI input with eARC adds modern TV connectivity. An MM phono input with Marantz Musical Phono EQ supports turntable playback, and a subwoofer pre-out with selectable low-pass filter rounds out the I/O.
specs: |-
  - 2.2 channels
  - Output Power: 70W + 70W (8 ohm), 100W + 100W (4 ohm)
  - Class A/B amplifier circuit with HDAM-SA3
  - Custom HDAM technology for superior speed and response
  - Frequency Response: 5Hz - 50kHz
  - Total Harmonic Distortion: 0.02% (20Hz - 20kHz, 8 ohm)
  - Damping Factor: 100
  - Signal-to-Noise Ratio (Phono MM): 87 dB
  - Signal-to-Noise Ratio (CD): 106 dB
  - Phono input sensitivity: 2 mV / 47 kohm
  - CD/Line/Recorder input sensitivity: 220 mV / 20 kohm
  - Power Amplifier input sensitivity: 1.6 V / 15 kohm
  - Power Consumption: 220W operating / 0.3W standby
  - Double shielded toroidal power transformer
  - HEOS built-in for multi-room audio and streaming
  - 1 HDMI input with eARC (PCM only)
  - MM phono input with Marantz Musical Phono EQ
  - Subwoofer Pre-out with selectable low-pass filter (40/60/80/100/120 Hz)
  - USB-A rear port (5V/1A, Mass Storage Class)
  - Electric volume control
  - Bass, Treble, and Balance controls
  - Source Direct function
  - Remote control via HEOS app
  - RC-5 remote control bus terminal (In/Out)
  - Speaker Terminals: SPKT-1+ type
  - Edge lighting with dimmer function
  - Dimensions: 17.4"W x 5.1"H x 17"D
  - Weight: 36 lbs 13 oz
  - Materials: SECC chassis, aluminum front panel, steel top cover
  - Available in Black or Silver-Gold finishes
  - 5-year warranty
