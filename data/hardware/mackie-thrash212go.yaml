name: Thrash212 GO
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/battery-powered/live-sound/thrash212go.html
description: "Thrash212 GO is a full-size, battery-powered 300W loudspeaker with
  Bluetooth that delivers professional sound, anywhere."
details: |-
  GO PLACES: Thrash212 GO is the perfect off-the-grid solution for countless setup challenges from events in remote locations, to DJ gigs that require fast setup and teardown, to the venue with questionable power. All without sacrificing sound quality and output. And it can do it for up to 10 hours.

  Can't Stop, Won't Stop: Don't choose between battery life and performance. Thrash212 GO comes with a swappable, rechargeable battery that delivers 10 hours of high-output playtime, for those parties that go till the next morning.

  Bluetooth Streaming and Pairing: Pair your smartphone or computer to Thrash212 GO via Bluetooth and harness an incredibly powerful system that can be set up anywhere you need it. You can even link to a second Thrash212 GO in stereo for a completely wireless music streaming system.
specs: |-
  - Up to 10 hours of playtime with included swappable, rechargeable battery
  - Ultra-efficient, 300W Class D amplifier
  - 12" high-performance woofer
  - 1" Titanium compression driver
  - Bluetooth streaming
  - Link via Bluetooth to a second Thrash212 GO for stereo music playback
  - Built-Like-A-Tank design, lightweight for easy loading
  - 4 handles for easy loading
  - Rotatable grille badge
  - Rugged powder coated steel grille
  - Frequency response: 52 Hz – 20 kHz (-10 dB)
  - Weight: 35.9 lb / 16.28 kg
