details: |-
  The Invisible Blue is a Custom Shop run of the Keeley Monterey, made with Keeley artist Mark Lettieri. It pairs a soft-focus blue powder coat with an invisible-ink graphic that carries a coded message, and the circuit is the standard Monterey workstation.

  The Monterey has two channels that can be configured for five sounds. The right footswitch engages the fuzz channel, a two-transistor design built around vintage Fairchild Semiconductor transistors chosen as moderate-gain devices that avoid the temperature sensitivity of germanium while keeping a classic fuzz voice. The modulation channel holds the Kool Vibe, Les Rotary and Harmonic Wah settings, and an Octave control adds octave up, octave down or neither, with the centre position of that control bypassing it.

  The Kool Vibe setting combines phasing and tremolo at key frequencies and simulates the pulsing of a photocell-based effect, and the Octave control over it gives doubling or deep synth-bass textures. The Les Rotary setting models both the lower drum and the upper horn of a rotating speaker cabinet, with short reverberated reflections for a doubling effect and a Doppler-derived chorusing. In that mode the Octave control sets horn volume rather than producing an octave, and with the Rate off the pedal becomes a speaker cabinet simulation for the fuzz. The Harmonic Wah section is a fixed or cocked wah, an auto wah driven by pick attack, and a harmonic tremolo wah, depending on the Depth control, and it becomes a conventional treadle wah when an expression pedal is connected.

  An expression pedal on the rear EXP jack controls the Rate of the Les Rotary and Kool Vibe settings and the frequency in Harmonic Wah; no expression pedal is included. A DIP switch under the base plate reverses the order of the fuzz and modulation sections. The pedal is not battery powered and needs a 9V 100mA supply with a negative tip.
