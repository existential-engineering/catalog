details: |-
  Fulltone Custom Shop

  Mini Deja' Vibe 3 V2

  Up to 15dB of available and adjustable volume boost when pedal is on. much slower speeds available thanks to the dual potentiometer being replaced by 2 Fulltone Custom-made Optocouplers. even more lush and watery 'vibe sound. Real Estate is precious, especially on your pedalboard, but the lush organic sounds of a perfect "authentic vintage Univibe clone" are a necessity, and they are now attainable in a space now smaller than a standard wah wah pedal... the Mini-Deja'Vibe3, MDV-3 for short. With a Hammertone Blue powder coated finish, White lettering, and a Blue LED that throbs to the beat of the pedal's hypnotic, asymmetrical rhythm. The MDV-3 has a new heel or toe activated True-Bypass footswitch that is perfect for the person who rarely changes speeds and just wants to turn it on or off with their toe, but also perfect for the person who rides it like a Gas-pedal and wants to turn the pedal on/off with a simple flick of the heel. There are a LOT of pedals claiming to be "authentic vintage Univibe clones" on the market...the small ones are merely a glorified MXR phaser filled with opamps with a few capacitor changes. That's not a Univibe! So how is one to know which pedals are real and which ones are just a cheap shortcut? A real Univibe clone will have:

  4 x glass covered/hermetically-sealed photocells and an incandescent bulb on the circuit board. I go one step further...and NO ONE else does this, I took many real 1960's 'cells and blueprinted them, not only their dark/bright resistance, but also for their all-important rise and fall times as they react to the light turning on and off. This is deep E.E. stuff, cannot be done unless you have the know-how and the expensive scopes. Run at 18+ volts. Totally discrete electronics, i.e. NO OPAMPS in the audio path! In typical Fulltone fashion, I also manufacture my own geared potentiometer & Optocouplers used to control the speed, which is why Fulltone 'vibes get a much wider range of speeds than other 'vibe clones. I've been building "authentic vintage Univibe clones" longer than anyone, since 1992. Mine are used by Robin Trower, Peter Frampton, Doyle Bramhall II, and countless others... by the people who know great sound and won't settle for less. Only 300 Mini Deja' Vibe 3 V2 pedals will be built this year. Secure yours directly from Fulltone USA before this production run is gone. While the demo below features the Mini Deja'Vibe MkII, it accurately showcases the unmistakable Deja'Vibe tone you'll hear from the Mini Deja'Vibe 3 V2. The CS-MDV3 V2 can be powered with an 18 volt DC power supply (included when bought direct from us) or by an 18 volt DC outlet on your power supply offering at least 300mA of current. You can also split between 2 x 9Volt DC outlets using Voodoo Lab's series splitter cable.
