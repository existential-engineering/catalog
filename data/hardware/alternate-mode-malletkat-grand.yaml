  and splitting, layering, poly/mono and hang modes. An optional GS Extended
  internal sound module version is also available.
details: |-
  PLEASE NOTE:

  There is currently a 2 week lead time on all controller only purchases

  There is an 2 week lead time on GS Extended Internal Sound Units

  No built in sounds: Our flagship MIDI mallet controller in a sleek, lightweight, white textured four-octave frame. The malletKAT is the world's most powerful MIDI percussion mallet controller using true FSR sensing technology. The malletKAT Grand offers a standard lightweight 4-octave design which can be expanded to 5 octaves. It incorporates the same FSR technology as all of the KAT instruments, delivering superb feel and response. With 127 programmable setups and features like splitting, layering, poly/mono and "hang" modes, the MalletKAT is an incredibly expressive and powerful alternative to traditional marimba and vibraphone instruments. Dimensions: 62" X 11" X 3"
  Weight: 22 lbs. With GS Extended Internal Sounds: The newly redesigned malletKAT Grand GS EXT - in a sleek, four octave lightweight white textured frame - is the world's most powerful MIDI percussion mallet controller using true FSR sensing technology. It contains newly formulated playing pads (version RR) that were market tested as our most natural feeling pads we ever offered. The GS EXT model contains the same newly designed GS EXT amp and sound board used in our gigKAT GS EXT for true plug-and-play operation. We have even added controller features, up to 4 CC# per kit. The malletKAT is the world's most powerful MIDI percussion mallet controller using true FSR sensing technology. The malletKAT Grand offers a standard lightweight 4-octave design which can be expanded to 5 octaves. It incorporates the same FSR technology as all of the KAT instruments, delivering superb feel and response. With 127 programmable setups and features like splitting, layering, poly/mono and "hang" modes, the MalletKAT is an incredibly expressive and powerful alternative to traditional marimba and vibraphone instruments. Dimensions: 62" X 11" X 3"
  Weight: 23 lbs. We offer a 90 Day warranty for LABOR. All controllers are BUILT TO ORDER . **iOS compatibility requires an Apple Lightning to USB 3 Camera Adapter (sold separately)
  **Android compatibility requires a USB converter cable (sold separately)
