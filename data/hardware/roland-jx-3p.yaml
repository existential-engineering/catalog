description: >-
  Roland's first MIDI-equipped synthesizer, the JX-3P is a six-voice polysynth
  with two DCOs per voice that shares its analog filter and VCA circuits with
  the renowned JUNO and JUPITER series.
details: |-
  Released in 1983, the JX-3P represented Roland's transition toward more accessible, preset-based
  synthesizers with fewer front-panel controls. Despite its unassuming appearance, the instrument
  hides substantial sonic depth beneath its streamlined interface, earning it a reputation as
  something of a hidden treasure among vintage analog synths.

  The synth features two digitally controlled oscillators per voice feeding into resonant low-pass
  and high-pass filters, with a built-in chorus effect that adds the lush warmth Roland became known
  for during this era. A 128-step sequencer provides basic pattern creation capabilities, and 32
  preset plus 32 user memory slots offer reasonable patch storage for the time.

  As Roland's inaugural MIDI synthesizer, the JX-3P's MIDI implementation was notably limited,
  supporting only note on/off messages with no velocity response unless a special ROM upgrade was
  installed. The optional PG-200 programmer accessory unlocked hands-on control of all synthesis
  parameters, transforming the instrument into a far more expressive tool.

  The JX-3P has found lasting appeal across electronic, pop, rock, and hip-hop genres, valued for
  its warm analog character and relative affordability compared to its more celebrated Roland
  siblings.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice
  - Filter: Resonant low-pass and high-pass
  - Effects: Chorus
  - Sequencer: 128-step
  - Memory: 32 preset, 32 user patches
  - Keyboard: 61 keys
  - Control: MIDI (note on/off only; velocity with ROM upgrade)
