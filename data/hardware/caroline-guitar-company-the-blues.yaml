details: |-
  The Blues was released on April Fools' Day in 2021, but the sound is no joke.
  Caroline Guitar Company positions it as an affordable alternative to expensive
  amplifiers, delivering what they call 'delicious artisanal mojo infusion
  vintage boutique hardwired bespoke sonic' character.

  The pedal operates in two distinct modes: a transparent, always-on light drive
  setting ideal for adding subtle warmth and color, and a gnarly raw drive mode
  for more aggressive tones.

  Compared to Caroline's Hawaiian Pizza pedal which sits at 30% drive and 70%
  fuzz, The Blues leans heavily toward the drive side at approximately 85% drive
  and 15% fuzz, making it primarily an overdrive with fuzz characteristics.

  The circuit design is described as 'very straightforward with a couple twists,'
  reflecting Caroline Guitar Company's minimalist design philosophy.
