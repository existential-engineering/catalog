details: |-
  The Spirit 8 is the ultimate Spirit Range live console, a full-featured 8-bus desk that combines a comprehensive range of professional control and routing facilities with cost-effective and compact design. You can choose the Spirit 8 in any of four frame sizes, from 16 to 40 mono channels, all featuring eight subgroups for routing sets of channels together, giving you fewer faders to ride when balancing the overall mix. Applications:
