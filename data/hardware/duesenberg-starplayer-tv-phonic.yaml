description: The Duesenberg Starplayer TV Phonic stands out with its bold,
  individual styling, featuring distinctive Phonico pickup covers, elegant
  deluxe pearl binding, and luxurious gold hardware. A standout feature is the
  stunning Radiator Tremolo, adding both visual flair and expressive performance
  capabilities.
details: |-
  The Starplayer TV Phonic is a semi-hollow electric guitar with a solid centerblock, a single f-hole, an arched laminated Spruce top and a flat laminated Maple back, with laminated Maple sides. The body measures 46 x 34 cm with sides 4.5 cm deep, and is trimmed with pearloid binding and 5-layer purfling, a Custom Gold pickguard and a PUR lacquer finish. Duesenberg describes the semi-hollow construction as giving an open response suited to any genre, and the headstock is finished to match the body colour.

  The neck is a set, one-piece Maple neck in a Medium D shape, 42.5 mm at the nut and 52 mm at the twelfth fret, carrying an Indian Rosewood fingerboard of 305 mm radius, Duesenberg Wing inlays, 22 jumbo frets on a 648 mm scale and a steel dual-action truss rod. Every fretboard is Plek-processed for level, buzz-free frets, then hand-finished and set up by one of Duesenberg's luthiers, who leaves a signature inside the instrument.

  The electronics pair a Duesenberg GrandVintage Humbucker in the bridge with a Domino P90 in the neck position, both under Duesenberg's Phonico pickup covers in a gold finish. Controls are one volume, one tone and a 4-way rotary switch, which allows either pickup alone or a choice of two blend modes: one running both pickups wide open, the other filtering selected frequencies for a more focused sound. Duesenberg positions the instrument's voice as sitting where a guitar belongs in a mix while still carrying the frequencies needed to cut through.

  Hardware is gold throughout, with Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, Duesenberg Standard strap pins that accept Straplocks and Duesenberg Custom 10/50 strings. The vibrato is the Duesenberg Radiator Tremola, described as the evolution of the company's earlier Diamond Deluxe design: heavy duty needle and nylon bearings for a responsive feel, an arm that rotates a full 360 degrees and adjusts for angle and length, stable tuning, and strings guided through holes in the bar beneath the arm axis for quick changes.

  The guitar ships with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Duesenberg Wing
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching body color
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated Spruce, arched
  - Back: Laminated Maple, flat
  - Sides: Laminated Maple
  - Dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Pearloid, 5-layer purfling
  - Pickguard: Custom Gold
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Radiator Tremolo
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Gold
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg "Phonico" (P90 Domino)
  - Pickup (bridge): Duesenberg "Phonico" (GrandVintage Humbucker)
  - Wiring: 1 Volume, 1 Tone, 4-way Rotary Switch
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
