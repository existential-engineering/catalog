details: |-
  Celebrating 30 years of the Axis, this limited-edition collection revisits the iconic translucent finishes of its 1996 debut. Hand-stained quilt maple tops in Gold, Black, Pink, Red, Blue, and Purple are paired with subtly sparkled black backs that echo the top's hue.

  Built to the original specifications, the Axis 30th Anniversary features the classic asymmetrical neck carve, 22 stainless steel frets, and glow-in-the-dark side dots on a figured maple neck. Two custom-wound DiMarzio humbucking pickups deliver the punchy voice the Axis is known for.

  A color-matched headstock and a commemorative 30th Anniversary logo complete the tribute. Each instrument ships with a certificate of authenticity and a deluxe hardshell case.
specs: |-
  - Body wood: Basswood with quilt maple top
  - Body finish: High gloss polyester
  - Body colors: Translucent Black, Blue, Gold, Pink, Purple, Red
  - Body bindings: Cream
  - Body dimensions: 12-5/8" wide, 1-3/4" thick, 36-1/4" long
  - Neck wood: White figured maple
  - Neck radius: 10"
  - Neck width: 1-5/8" at nut, 2-3/16" at last fret
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Figured maple
  - Fret markers: Dot (with glow-in-the-dark side dots)
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25-1/2"
  - Pickups: HH — 2 DiMarzio custom humbucking
  - Controls: 500k volume pot, 3-way toggle pickup selector
  - Bridge: Music Man double-locking tremolo with fine tuners
  - Tuning machines: Schaller M6LA with pearl buttons
  - Headstock length: 5-7/8"
  - Electronic shielding: Graphite acrylic resin body cavity; aluminum-lined control cover
  - Strings: 9p-11p-16p-24w-32w-42w (RPS 9 Slinkys #2239)
