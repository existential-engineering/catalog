  for the rich, open sound of a well-played pre-war guitar.
details: |-
  1937 is widely regarded as one of the finest years in Martin's history—a moment when craftsmanship, innovation, and premium materials came together to shape what would become legendary instruments. The D-18 Authentic 1937 Aged honors that pivotal era with painstaking attention to period-correct construction and appointments.

  The model features hide glue construction throughout, an Authentic 1937 forward-shifted scalloped bracing pattern, and historically accurate details. It pairs genuine mahogany back and sides with an Adirondack spruce top thermally aged using Martin's Vintage Tone System (VTS) to deliver the rich, open sound of a well-played pre-war guitar.

  What distinguishes this model is its meticulously aged finish, which adds the visual character and feel of an instrument that's been played and loved for decades. The body profile follows early Golden Era Dreadnoughts, and period-correct features include an Authentic-style neck barrel and heel with traditional 18-style appointments.

  The Authentic 1937 neck shape with standard taper, 1 3/4-inch nut width, and 25.4-inch scale length provide the playing experience of a true pre-war Martin, while aged Waverly nickel open-back tuners, bone nut and saddle, and ebony bridge and fingerboard complete the vintage specification.
specs: |-
  - Body Size: Authentic D-14 Fret
  - Top: Adirondack Spruce with VTS
  - Back/Sides: Genuine Mahogany
  - Scale Length: 25.4"
  - Frets: 20 (joins body at 14th)
  - Fingerboard: Ebony
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th: 2 1/4"
  - Neck Wood: Genuine Mahogany
  - Neck Shape: Authentic 1937
  - Neck Taper: Standard Taper
  - Bracing Pattern: Authentic 1937 Forward-Shifted X-Brace
  - Brace Shape: Scalloped
  - Brace Material: Adirondack Spruce with VTS
  - Finish: Vintage Gloss - Aged
  - Electronics: No
  - Tuning Machines: Aged Waverly Nickel Open Back
  - Nut Material: Bone
  - Bridge Material: Ebony
  - Bridge Style: Authentic Belly - Glue in Long Saddle - Aged
  - Saddle: Bone (16" radius)
  - Bridge Pin Material: Black Plastic - Aged
  - Bridge String Spacing: 2 1/4"
  - Pickguard: Tortoise Pattern Aged
  - Binding: Brown Tortoise Pattern
  - Headstock Shape: Solid with 1937 Taper
  - Headplate: Madagascar Rosewood
  - Construction: Dovetail Neck Joint - Hide Glue
  - Case: Hardshell
  - Left-Handed Available: Yes
