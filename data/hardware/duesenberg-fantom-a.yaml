description: Duesenberg Guitars Fantom Series A & Series S
details: |-
  The Fantom is the first Duesenberg instrument built with a shorter 24.6"/625 mm scale length, and it is offered as two separate series, A and S, which between them cover the range from a pure vintage tone to a refined modern voice, with three colour options per series. The Fantom Series A is a solid-body guitar made from premium mahogany for the neck, body and carved top, and the body is finished off with a bespoke 5-ply pearl binding. Duesenberg describes it as a powerful blend of mahogany, ebony and increased-output pickups, intended for players who want to cover the stage in a wall of sound.

  The neck is a set neck in 1-piece mahogany with a medium D shape, 42.5 mm / 1.67" wide at the nut and 52 mm / 2.05" at the twelfth fret, and 21 mm / 0.8" to 23.5 mm / 0.93" thick over the same span. The fingerboard is plain ebony with vintage pearl binding and a 305 mm / 12" radius, carries no fretboard inlays, and holds 22 jumbo frets of 2.8 x 1.0 mm. A steel dual-action truss rod sits in the neck, the scale length is 625 mm / 24.6", and the headstock is finished in a colour matching the body. Duesenberg's Plek process levels the fretboard, which is the basis for the multi-step fret polishing and setup work applied to its instruments.

  The Series A is fitted with an increased-output pickup pair, a Duesenberg Crunchbucker at the bridge and a Duesenberg GrandVintage humbucker at the neck, a combination Duesenberg describes as a long-standing choice for players chasing a large tone. The ebony fretboard is said to support that voicing with tight attack and defined high frequencies. Wiring runs to one master volume, one master tone, a 3-way pickup selector, and a neck preset volume control located at the cutaway horn, which allows a separate volume to be pre-set for the neck pickup and heard when switching pickups.

  Hardware is Duesenberg's own throughout: Z-Tuners, a Steel Saddle Bridge, an Aluminum Wrapper Tailpiece, and Duesenberg Standard strap pins that are Straplock compatible. The guitar ships with Duesenberg Custom 10/50 strings (010-013-017-028-042-050) and a black custom pickguard, over a poly finish, with vintage pearl binding on back and top. The hardware finish is gold, except on the Matte Olive model, which is fitted with black hardware. Release finishes are Matte Olive, Aged White and Black.

  The body measures 44 x 32 cm / 17.3" x 12.6" with sides 4.5 cm / 1.8" deep. The instrument comes with the Duesenberg Custom Line Case as standard, a classically shaped handcrafted flightcase-quality case, along with all required allen keys.
