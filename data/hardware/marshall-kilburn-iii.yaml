description: Portable Bluetooth speaker with 50+ hours of playtime, an IP54
  rating and a USB-C port that also charges a phone.
details: |-
  Turn heads and ears with the impeccable audio and timeless design of Kilburn III. 360 degree True Stereophonic sound keeps the music hitting all the right notes from wherever you're standing. No wonder it's got such an obsessive following. Designed and engineered in Sweden. Made in Thailand.

  50+ hours of portable playtime: a speaker for inside and outside your home. Start track one in the bedroom, then listen to the encore on the balcony. With 50+ hours of portable playtime, your playlist will probably run out before the battery.

  True Stereophonic: 360 degree sound finds you wherever you're standing thanks to a stereo arrangement with no blind spot. Take in well-rounded mids, crisp highs, and bass that digs deep with improved tuning and wide band drivers.

  Dust and water-resistant (IP54): Kilburn III's IP54 dust and water-resistant design makes it ready to deal with a splash of water or a bit of dirt. Dynamic Loudness turns the music right up without compromising on any musical detail, so the bass, mids and treble adjust perfectly no matter the volume.

  Tactile controls and charging bank: customise your bass and treble, turn the speaker on or off, play, pause and skip tracks, or use the M-button to instantly access presets. Kilburn III can also charge your phone whenever it needs a boost. Marshall offers authorised repair services and spare parts for Kilburn III through its website.
specs: |-
  - 50+ hours of portable playtime on a single charge
  - True Stereophonic: 360 degree sound finds you wherever you stand
  - Dust and water-resistant: IP54 rating
  - Dynamic Loudness: perfectly tuned sound whatever the volume
  - Tactile controls in Marshall's signature style
  - Charging bank: use the speaker to charge your phone on the go
  - Driver type: dynamic
  - Frequency range: 45 Hz to 20 kHz
  - Drivers: one 4 inch woofer, two 2 inch full-range speakers
  - Stereo/mono: stereo
  - Maximum sound pressure level: 91 dB SPL at 1 m
  - Cabinet principle: active stereo loudspeaker with bass reflex system
  - Power amplifiers: one 30 W Class D amplifier for the woofer, two 10 W Class D amplifiers for the full ranges
  - Wireless connectivity: Bluetooth 5.3, Auracast
  - Wired connectivity: AUX 3.5 mm
  - Bluetooth range: 10 m / 32.8 ft
  - Bluetooth multipoint connectivity: yes
  - Codecs: SBC, LC3, MPEG-2 AAC
  - Top panel controls: bass, treble, volume, on/off, media jog, M-button, Bluetooth button
  - Microphones: no
  - Weight: 2.8 kg / 6.17 lb
  - Width: 273 mm / 10.74"
  - Height: 169 mm / 6.65"
  - Depth: 150 mm / 5.9"
  - Water resistance: IP54
  - Battery type: rechargeable, replaceable Li-ion battery, with battery preservation
  - Quick charging: 20 minutes of charge time gives 8 hours of playtime with a 30 W USB-C PD charger
  - Charging time: 3 hours to full recharge with a 30 W USB-C PD charger
  - Power input: USB-C 9 V/3 A, 5 V/3 A
  - Materials: 38% of the total product is recycled
  - Country of origin: designed and engineered in Sweden, made in Thailand
  - Compatible app: Marshall Bluetooth app
  - Box contents: speaker, USB-C to USB-C charging cable, quick start guide, legal and safety information
