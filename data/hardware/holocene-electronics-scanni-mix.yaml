description: A 12HP 5-input voltage-controlled scanning audio/CV mixer and
  panner with dedicated attenuator sliders, an offset switch, and dual scan
  voltage control inputs for dynamic scanning motion across channels.
details: |-
  SCANNI-MIX is a 12HP 5 input Voltage-Controlled Scanning Audio/CV Mixer and Panner. • 5 Audio/CV Inputs:
  with dedicated attenuator sliders

  • Offset Switch:
  Offset normalizes a DC voltage to all inputs when nothing is connected. Useful for use as a wave shaper or scannable cv source

  • Scan VC 1:
  Main voltage control for scanning position

  • Scan VC 2:
  Adds to Scan VC 1 for dynamic motion

  • Attenuverter:
  Adjusts Scan VC 1's polarity and level

  • Curve Knob:
  Controls scanning shape:
  CCW = focused (1–2 channels)
  CW = wide (3–5 channels)

  • Outputs:
  All: Scans through all inputs
  Odd: Outputs only odd- numbered inputs (1, 3, 5)
  Even: Outputs only even- numbered inputs (2, 4)

  QUICKGUIDE :)
