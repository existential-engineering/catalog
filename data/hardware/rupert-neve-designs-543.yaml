description: Clean, precise, powerful level control. Whether you're tracking,
  mixing or mastering, the 543 delivers unobtrusive, musical dynamic control and
  high-ratio limiting with massive flexibility, transparency and precision.
details: |-
  The 543 features a fully controllable compressor-limiter with feed-forward / feedback modes, Peak / RMS detection and a built-in side chain high pass filter. With an unrivaled heritage and a tremendous feature set, the 543 provides an astonishing degree of flexibility and precision.

  The 543 is a VCA-based compressor-limiter offering transparent, musical dynamic control suitable for tracking, mixing, or mastering applications without heavy sonic imprint. Key features include VCA gain control, switchable Feed-Forward or Feed-Back detection modes, Peak and RMS detection, a fixed 250Hz sidechain high-pass filter, stereo link capability, illuminated push-button controls, and output level and gain reduction meters.
specs: |-
  - Gain Range: -6 dB to +20 dB
  - Threshold: -30 dB to +20 dB
  - Ratio: 1.1:1 to 40:1 (Limit)
  - Attack: 20ms to 75ms
  - Release: 100ms to 2.5 seconds
  - THD: Better than 0.075% (compressor engaged)
  - Noise: Better than -93 dBu (compressor engaged)
  - Frequency Response: -3dB @ 150kHz
  - Max Output: 21 dBu (20Hz-40kHz)
  - Input Impedance: 10,000 Ohms
  - Power: 110-125mA @ ±16V
  - Dimensions: 1.5"W x 5.9"D x 5.25"H
  - Weight: 1.5 lbs
  - Sidechain high-pass filter: 250Hz (fixed)
  - Stereo link capable
