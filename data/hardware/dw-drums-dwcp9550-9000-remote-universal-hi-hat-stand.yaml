description: DW's Universal Linkage Assembly creates lightning-fast response and a smooth, effortless feel.
details: |-
  All of the heavy-duty features associated with the 9000 Series line of hardware, like heavy gauge steel tubing, integrated vise memory lock and lateral cymbal seat adjustment, are standard. The 9550 comes complete with auxiliary pedal, MG1 and MG2 mounting clamps and Universal Linkage with two extension options.

  The 9550 Universal Hi-Hat System represents the latest advancement in hi-hat technology. Using DW's Universal Linkage Assembly, the 9550 achieves lightning-fast response and a smooth, effortless feel.

  It can be placed on either side of the kit, making it a multi-position primary hi-hat or a versatile auxiliary hi-hat for secondary hat sounds and effects cymbals.
specs: |-
