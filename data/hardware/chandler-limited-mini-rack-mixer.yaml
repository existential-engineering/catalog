description: The Chandler Limited Mini Mixer is the culmination of Chandler's
  experience working with many types of vintage discrete circuits. Each channel
  of the 16x2 mixer is transformer balanced and driven by the Chandler line amp.
details: |-
  The Chandler Limited Mini Rack Mixer is the culmination of Chandler's experience working with many types of vintage discrete circuits. The Mini Rack Mixer traces its lineage back to several types of amplifiers developed in the 60s and 70s that have been Chandlerized for modern usage.

  Each channel of the 16x2 mixer is transformer balanced and driven by the new Chandler line amp, which borrows from Chandler's other products but has been redesigned for use in this mixer. The Mini Mixer is jam-packed with 20 discrete amplifiers and 22 custom wound transformers, giving it a classic sound with all the punch and tone you need for today's digital environment.

  In addition to the mixer section, the unit has a full featured Control Room section including Talkback, Speaker switching, Mute, Mono, Dim, External input (also used as an insert point), and separate Control Room and Stereo Buss outs. Mixers are easily expandable to 32 channels or more.

  All Mixer units require and function on the PSU-2, Chandler Limited power supply. The PSU-2 has an internal switch for setting voltage to 120V or 220V (115V/230V).

  The Mini Rack Mixer has been used on major recordings including Beyoncé's 'Lemonade,' Selena Gomez's 'Rare,' Robin Thicke's 'Blurred Lines,' and Lady Gaga's 'Born This Way,' with notable engineers including Tony Maserati and Jim Abbiss.
