description: A true analog 12-voice polyphonic synthesizer in a desktop or rack
  mount format, with 2 analog oscillators and 2 LFOs per voice, 3 ADSR
  generators and an 8-channel modulation matrix. Four FX engines, a 32-step
  control sequencer and remote control over USB, MIDI or built-in WiFi round out
  the package.
details: |-
  With the creation of the DEEPMIND 12D, the ultimate true analog, 12-voice polyphonic synthesizer in a convenient desktop or rack mount format is finally a reality. Thanks to its 4 FX engines, dual analog OSCs and LFOs per voice, 3 ADSR Generators, 8-Channel Modulation Matrix and onboard 32-Step Control Sequencer, the DEEPMIND 12D gives complete control over the soundscape, with comprehensive remote control via iPad, PC, Mac and selected Android apps over USB, MIDI or built-in WiFi.

  The DEEPMIND 12D's pure analog signal path uses legendary IR3109-style VCFs, stereo VCAs and 12-voice polyphony. Each voice has 2 oscillators, with OSC 1 generating sawtooth and square/pulse waveforms with pulse width modulation, and OSC 2 generating square/pulse waveforms with a unique tone modulation. With 24 oscillators available, oscillator modes include Unison 12, 6, 4, 3, 2 Mono; Mono -2; Mono 4; Mono 6; Poly; Poly 6 and Poly 8, while oscillator sync, oscillator drift and parameter drift recreate the warmth and movement of vintage analog synthesizers.

  Individual voices also have 2 LFOs with a range that extends into the audio rate, each with adjustable slew-rate, modulation delay, key sync, assignable clock sync, envelope auto-triggering, delay and fade in, across 7 waveform shapes (Sine, Triangle, Square, Ramp Up, Ramp Down, Sample and Hold, Sample and Glide). A Phase Link option lets the polyphonic LFOs run in unison or with an adjustable phase shift between voices. Three four-stage ADSR envelope generators per voice carry continuously-variable curves and Legato, Mono and Retrigger trigger modes.

  Four simultaneous FX engines provide over 33 TC Electronic, Midas and Klark Teknik algorithms, including reverbs, chorus, flanger, phaser, delays, a 4-band parametric EQ taken from the Midas PRO X console, the Fair compressor model, Midas multi-band distortion, Rackamp, a noise gate, auto pan, a dual pitch shifter, a mood filter and rotary speaker. A Bypass Mode removes the digital FX from the signal path entirely for a pure analog tone.

  An 8-channel modulation matrix offers 20 modulation sources and more than 130 destinations including effects parameters. The 32-step control sequencer has an adjustable slew rate and MIDI sync, with step values from -127 to 127 plus note value, tie and length, slew and swing. A selectable dual-slope 12/24 dB analog low pass filter per voice sits alongside a global variable 6 dB high pass filter with a +12 dB bass boost switch, and 1024 user program memories store patches with a compare-and-match function.
specs: |-
  - 12 true analog voices, 12-note polyphony
  - 2 oscillators per voice (24 oscillators total) with oscillator sync, oscillator drift and parameter drift
  - OSC 1: sawtooth and square/pulse with pulse width modulation
  - OSC 2: square/pulse with tone modulation
  - 2 LFOs per voice with 7 waveform shapes, key sync, MIDI sync and envelope auto-triggering, range extending into audio rate
  - 3 four-stage ADSR envelope generators per voice with continuously variable curves
  - Selectable dual slope 12/24 dB analog low pass filter per voice with adjustable resonance and tracking
  - Global variable 6 dB high pass filter with +12 dB bass boost switch
  - 8-channel modulation matrix with over 20 sources and more than 130 destinations
  - 32-step control sequencer, step values -127 to 127, adjustable slew rate and MIDI sync
  - Arpeggiator across up to 6 octaves, 32 preset patterns with up to 32 steps and rests, tap tempo
  - Chord and PolyChord memory: 36 six-note chords, chords up to 12 notes
  - 4 simultaneous FX engines with over 33 TC Electronic, Midas and Klark Teknik algorithms
  - 1024 user program memories with compare and match function
  - Fully servo-balanced stereo TRS outputs
  - Comprehensive MIDI implementation including NRPN/CC control of virtually all parameters and bulk load/save
  - Integrated and configurable WiFi client / access point
  - Controls: 26 sliders, 33 switches, 1 rotary encoder, 2 knobs, LCD display with adjustable contrast and brightness
  - Rack mount brackets included
