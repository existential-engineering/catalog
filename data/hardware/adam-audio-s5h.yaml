description: ADAM Audio's new flagship reference monitor S5H offers audio reproduction to the highest standards of fidelity. Innovative features & enormous dynamic range.
details: |-
  The S5H is a powerful main monitor custom-designed for the demanding rigours of reference listening in the world's most expansive studios and control rooms.

  The three-way S5H was conceived, as its name suggests, to be used in a horizontal orientation and features two 10-inch Extended Linear Excursion (ELE) bass drivers, newly designed by ADAM Audio expressly for the S Series. Like the LF ELE units on all the other members of the range, the S5H's woofers feature ADAM Audio's proprietary Symmetrical Magnet Assembly (SMA) guaranteeing that low-frequency audio remains tightly controlled and free of distortion at all times. The all-important mid-range frequencies are handled by ADAM Audio's new hybrid DCH. This innovative 4-inch MF driver was also newly developed by ADAM Audio exclusively for the S Series and combines the sonic advantages of cone and dome drivers in a single, one-piece unit.

  Together with the S-ART treble driver, the latest iteration of ADAM Audio's widely respected folded-ribbon tweeter, now produced to tighter tolerances than ever before, the resulting combination produces a powerful but unfatiguing sound, with a palpable sense of depth: the last word in high-resolution, natural-sounding audio reproduction. The off-axis responses of the treble and mid drivers remain extremely accurate thanks to the addition of high- and mid-frequency waveguides milled from solid aluminum: ADAM Audio's newly developed Mid-range and High-frequency Propagation Systems (MPS and HPS). The resultant stable, wide-ranging dispersion ensures that teams of more than one person can work in the loudspeakers' sweet spot simultaneously, as is often necessary in larger control rooms.

  The S Series' custom-designed DSP optimizes the loudspeaker crossovers to create linear responses for the entire range, as well as providing user equalization and in-room tuning/voicing functions. The DSP also handles the limiter-based high-frequency driver protection, processes the signals from the AES3 digital inputs, and will in time facilitate various expansion options. Software updates can be carried out with ease via the associated USB port, which also allows users to connect computers and control the speakers' DSP functions via a software front-end. The rear panel also carries an OLED display and a dual-function push-button/rotary encoder for access to the DSP settings, plus a blank panel covering an Options slot for future expansion.

  No fewer than three separate amplifiers power the drivers: a 700 W Class D design for the bass drivers, a 300 W Class D for the mid range and a 100 W Class D unit for the S-ART tweeter. With its innovative features, advanced design, generous headroom and enormous dynamic range, the S5H takes its rightful place as ADAM Audio's flagship reference monitor: an extraordinary loudspeaker offering audio reproduction to the very highest standards of fidelity.
specs: |-
  - Three-way active main monitor, horizontal orientation
  - German handmade precision S-ART tweeter with HPS waveguide
  - Tweeter: S-ART type, 4 inch2 (2420 mm2) diaphragm area, 2" (56 mm) equivalent diaphragm diameter, 4 to 1 velocity transform ratio, 0.17 g diaphragm weight
  - Midrange: 4" dome/cone hybrid, carbon composite cone, 2.4" (60 mm) voice coil, MPS waveguide
  - Woofer: 2 x 10" HexaCone, 3" (76 mm) voice coil
  - Total RMS amplifier power: 1100 W
  - Woofer amplifier: PWM type, 700 W RMS
  - Midrange amplifier: PWM type, 300 W RMS
  - Tweeter amplifier: PWM type, 100 W RMS
  - Frequency response: 22 Hz - 50 kHz (-20 dB)
  - THD > 100 Hz: <=0.3 %
  - Max. SPL per pair at 1 m: >=131 dB
  - Crossover frequencies: 250 Hz, 3 kHz
  - Analog input: XLR
  - Input impedance: 48 kOhm
  - Max. input level: +24 dBu
  - Digital input: AES3, with AES3 Thru for multi-channel arrays
  - USB jack for internal software upgrades and computer-based remote setting software
  - Options slot (behind blank panel) for future expansion
  - Control options: adjustable input sensitivity, 6 parametric EQs, 1 room compensation high-shelf EQ, 1 room compensation low-shelf EQ, 5 preset memories, 0 ms to 5 ms delay
  - Rear-panel OLED display with dual-function push-button/rotary encoder
  - Connection panel: rear
  - Max. power consumption: 900 W
  - Dimensions (H x W x D): 16.9" (430 mm) x 34.8" (885 mm) x 19.7" (500 mm)
  - Weight: 160 lb (72.6 kg)
  - Delivery contents: power cord, manual
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
