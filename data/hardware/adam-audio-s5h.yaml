description: ADAM Audio's new flagship reference monitor S5H offers audio
  reproduction to the highest standards of fidelity. Innovative features &
  enormous dynamic range.
details: |-
  The ADAM Audio S5H is a three-way main monitor designed for reference listening in expansive studios and control rooms. It pairs two 10-inch HexaCone Extended Linear Excursion (ELE) bass drivers with Symmetrical Magnet Assembly (SMA), a newly developed 4-inch Dome/Cone Hybrid (DCH) carbon midrange driver, and ADAM Audio's S-ART folded-ribbon tweeter for distortion-free reproduction across the full audio band.

  Custom-designed MPS (midrange) and HPS (tweeter) waveguides provide accurate off-axis response, widening the sweet spot so multiple engineers can work in the optimal listening position simultaneously. The horizontal cabinet orientation is intended for use as a main monitor in soffit-mounted and free-standing installations.

  Three Class D amplifiers deliver 700 W to the bass section, 300 W to the midrange driver, and 100 W to the S-ART tweeter for a combined 1100 W RMS. A custom DSP engine handles crossover filtering at 250 Hz and 3 kHz, user EQ, in-room tuning, and high-frequency driver protection, with maximum SPL per pair at 1 m specified as greater than or equal to 131 dB and THD above 100 Hz of less than 0.3%.

  Rear-panel connectivity covers a balanced analog XLR input (48 kOhm impedance, +24 dBu maximum input level) and an AES3 digital input. DSP control surfaces 6 parametric EQs, 1 high-shelf and 1 low-shelf room compensation filter, 0-5 ms of delay, and 5 preset memories. Software updates and DSP control are handled over the associated USB port via a software front-end.

  The cabinet measures 430 x 885 x 500 mm (16.9 x 34.8 x 19.7 in, H x W x D) and weighs 72.6 kg (160 lb). Maximum power consumption is 900 W. The S5H ships with a 5-year warranty and is intended for reference and main-monitor use in professional recording, mixing, and mastering environments.
specs: |-
  - Three-way active main / reference studio monitor (horizontal cabinet)
  - 2 x 10" HexaCone ELE woofers with 3" voice coil and Symmetrical Magnet Assembly (SMA)
  - 4" Dome/Cone Hybrid (DCH) carbon midrange driver with 2.4" voice coil
  - S-ART folded-ribbon tweeter (handbuilt) with 4 in² diaphragm area, 2" equivalent diameter, 4:1 velocity transform ratio, 0.17 g diaphragm weight
  - Custom MPS midrange waveguide and HPS tweeter waveguide
  - Frequency response: 22 Hz – 50 kHz (-20 dB)
  - Max SPL per pair at 1 m: ≥131 dB
  - THD > 100 Hz: ≤0.3%
  - Crossover frequencies: 250 Hz and 3 kHz
  - Bass amplifier: Class D, 700 W RMS
  - Midrange amplifier: Class D, 300 W RMS
  - Tweeter amplifier: Class D, 100 W RMS
  - Total amplifier power: 1100 W RMS
  - Analog input: XLR (balanced), 48 kOhm input impedance, max input level +24 dBu
  - Digital input: AES3
  - USB port for software updates and DSP control
  - DSP controls: 6 parametric EQs, 1 high-shelf and 1 low-shelf room compensation EQ
  - 5 preset memories
  - Delay: 0–5 ms
  - Max power consumption: 900 W
  - Dimensions (H x W x D): 430 x 885 x 500 mm (16.9 x 34.8 x 19.7 in)
  - Weight: 72.6 kg (160 lb)
  - Warranty: 5 years
