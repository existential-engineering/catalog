description: >-
  The Opera 6 is a classic early 1980s Italian analog 6-voice polyphonic
  synthesizer that competed with the Roland Juno series. It features two
  oscillators per voice, three LFOs for extensive modulation, and a 61-key
  velocity-sensitive keyboard. Later versions added DCOs for improved tuning
  stability and MIDI support.
details: |-
  The Siel Opera 6 was produced from 1983 to 1985 as an Italian alternative to Roland's popular Juno lineup. It was released in three versions over its production run: the original featured true VCOs with an Oberheim-style control panel, later versions replaced the VCOs with DCOs for more stable tuning, and the final revision added MIDI connectivity and velocity response.

  The synthesizer excels at swooshy pads, analog strings, and lush analog effects, offering a distinctive character that sets it apart from its Japanese competitors. Its unconventional design places the pitch and modulation wheels away from the keyboard, which some players find unusual. The three LFOs provide extensive modulation possibilities for shaping sound.

  MIDI implementation on equipped models is limited to 1-part multitimbral operation in OMNI mode only, though velocity can be routed to control either the VCF or ADSR envelope. The instrument stores 95 patches in memory. Despite its limitations in bass, brass, and lead sounds, the Opera 6 remains prized for its warm analog pad and string tones.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice (12 total); sawtooth and pulse waveforms
  - LFOs: 3
  - Filter: Resonant low-pass with ADSR envelope
  - VCA: ADSR envelope
  - Keyboard: 61 keys, velocity sensitive
  - Memory: 95 patches
  - Control: MIDI (later models)
  - Production Period: 1983-1985
