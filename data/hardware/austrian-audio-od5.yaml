description: The OD5 is an active dynamic instrument microphone from Austrian
  Audio, handmade at their Vienna facility. Featuring the ODC50 active dynamic
  capsule, it delivers a tight, focused tone with huge headroom and noise-free
  performance. The 220° swivel head enables precise placement on stage or in the
  studio.
details: |-
  The OD5 is Austrian Audio's active dynamic instrument microphone, built around the ODC50 capsule developed in Vienna. Active circuitry provides extended frequency response and higher sensitivity (6.7 mV/Pa), with an equivalent noise level of 21 dB SPL (A).

  A 220° swivel head allows repositioning without moving a stand, enabling precise directional control for close-miking. Maximum SPL of 151 dB natively, over 160 dB with -10 dB pad. Switchable low-cut filters at 80 Hz or 120 Hz (2nd order).

  Phantom-powered at 48V (< 1.5 mA). Rugged all-metal enclosure.
specs: |-
  - Directional Pattern: Cardioid
  - Frequency Range: 20 Hz – 18 kHz
  - Sensitivity: 6.7 mV/Pa
  - Equivalent Noise Level: 21 dB SPL (A)
  - Maximum SPL: 151 dB SPL (>160 dB SPL with pad)
  - Low-cut filter: 80 Hz or 120 Hz (2nd order) switchable
  - Pad: -10 dB switchable
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 1.5 mA)
  - Connector: XLR 3-pin
  - Swivel head rotation: 220°
  - Capsule: ODC50 (active dynamic)
  - Dimensions: 147 × 82 × 54 mm
  - Weight: 265g
