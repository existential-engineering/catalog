description: >-
  The Yamaha CS2x is a 61-key digital synthesizer and the second generation of
  Yamaha's popular CS1x, featuring AWM2 synthesis with 64-voice polyphony and
  16MB of sampled waveforms. It offers extensive real-time control through
  semi-dedicated and assignable knobs, scene morphing via the mod wheel, and a
  40-pattern arpeggiator. The CS2x was widely used for dance music production
  and was notably adopted by Depeche Mode.
details: |-
  The CS2x represents a major upgrade over its predecessor, the CS1x, doubling the polyphony from 32 to 64 voices and enabling complex, layered sound creation. The synthesizer features Yamaha's AWM2 (Advanced Wave Memory 2) technology with 779 normal voices and 30 drum kits drawn from its 16MB waveform library, along with 64 resonant 24dB high-pass and low-pass filters for extensive sound shaping.

  A distinctive feature inherited from the CS1x is the Memory Scene system, which can store up to two different edit parameter settings per patch. These scenes can be morphed smoothly using the mod wheel, and each of the 256 user patches saves scene memories alongside patch data. The arpeggiator offers 40 patterns with full MIDI transmission capability to control external synthesizers or sequencers.

  The effects section provides significant creative potential with three independent digital effect processors, including 12 reverbs, 14 choruses, and 62 variation effects. A direct TO-HOST connector enables seamless computer integration for modern production workflows. The CS2x's hands-on interface and digital clarity made it particularly effective for electronic and dance music production.
specs: |-
  - Polyphony: 64 voices
  - Sound Engine: AWM2 (Advanced Wave Memory 2)
  - Waveforms: 779 normal voices, 30 drum kits
  - Wave ROM: 16MB sampled waveforms
  - Filters: 64 resonant 24dB filters (high-pass and low-pass)
  - Effects: 3 independent digital effects (12 reverbs, 14 choruses, 62 variations)
  - Arpeggiator: 40 patterns with MIDI transmission
  - Keyboard: 61 keys with Initial Touch
  - Memory: 256 preset patches, 256 user patches
  - Connections: MIDI, TO-HOST computer interface
