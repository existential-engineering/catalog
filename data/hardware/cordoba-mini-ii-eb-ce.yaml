description: Mini II EB-CE is resonant with a clear, defined tone.
details: |-
  Say hello to the Mini II EB-CE, Cordoba's popular Mini travel-size guitar, but slightly bigger and with an extended 580mm (22 7/8 inch) scale length so it tunes perfectly to Standard E. Despite its small profile, the Mini II has a deeper body depth which creates a well-rounded tone that is close to a full-size nylon string guitar. Built with a solid Spruce top and striped Ebony back and sides, the Mini II EB-CE is resonant with a clear, defined tone. Another stand-out feature is its cutaway for reaching the uppermost frets with ease and a Cordoba pickup with an on-board tuner so you can amplify on the go.
