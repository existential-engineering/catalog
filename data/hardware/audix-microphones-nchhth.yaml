details: |-
  The NCHHTH bundles the AUDIX Novacore NCHH digital handheld transmitter with the NCTH Tight Hypercardioid Wireless Capsule — a complete, performance-ready wireless handheld built for loud stages, high-SPL environments, and any application where maximum feedback rejection and precise pickup control are the priority. The NCTH's tight hypercardioid pattern delivers narrow off-axis rejection and strong gain-before-feedback headroom, with voicing consistent with the AUDIX OMX series and the natural transient response that AUDIX capsules are known for.

  The NCHH transmitter delivers AES-256 encrypted UHF digital transmission across a 48 MHz tuning range with less than 3 ms latency. One-touch IR sync pairs to any Novacore receiver in seconds. On-board controls provide access to variable input gain, low-cut filter, limiter, RF power level, and three selectable mute modes — all accessible via the front-panel LCD and the controls beneath the battery cover.

  The NCHHTH operates on 2× AA alkaline batteries or 1× NCLB rechargeable lithium-ion battery with 9+ hours of runtime, with USB-C charging built into the transmitter body. The NCTH capsule is interchangeable — swap to an NCEC Extended Cardioid at any time using the same "S" thread mount, with no tools required .
specs: |-
  - Type: UHF digital handheld transmitter with capsule
  - Capsule: NCTH tight hypercardioid, interchangeable "S" thread
  - Encryption: AES-256
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours
  - Charging: built-in USB-C
