description: >-
  A hands-on stereo/mono analog filter processor in a 2U rack format, offering four filter types
  with switchable 2-pole stereo or 4-pole mono operation and full MIDI/CV control.
details: |-
  The Electrix Filter Factory is a dedicated analog filter processor built for real-time performance and studio tweaking. Its large knobs invite hands-on manipulation, making it as much a performance instrument as a studio tool. The unit occupies two rack spaces and can operate in either stereo mode with a 2-pole filter slope or mono mode with a steeper 4-pole response.

  Four filter types are available: low-pass, high-pass, band-pass, and notch. An onboard LFO offers sawtooth, reverse sawtooth, triangle, and square waveforms with adjustable depth and speed for automated filter sweeps. A distortion circuit adds grit and harmonic saturation when the source material calls for something more aggressive.

  Full MIDI implementation allows all knob movements and parameter changes to be recorded, triggered, and sequenced, while a CV input provides compatibility with modular and analog gear. Although there is no onboard patch memory, all settings can be saved as MIDI data for recall in a DAW or hardware sequencer.

  Popular with DJs and live electronic performers, the Filter Factory found its way into the rigs of artists like U2, John Digweed, and the Chemical Brothers during its production run from 1999 to 2001. Its straightforward interface and musical analog character made it a go-to choice for creative filter processing.
specs: |-
  - Type: Stereo/mono analog filter processor
  - Filter types: Low-pass, high-pass, band-pass, notch
  - Filter slope: 2-pole (stereo), 4-pole (mono)
  - LFO: Sawtooth, reverse sawtooth, triangle, square; adjustable depth and speed
  - Effects: Distortion
  - Control: MIDI, CV input
  - Memory: None (saveable via MIDI)
  - Keyboard: None
  - Format: 2U rack
releaseDate: "1999"
