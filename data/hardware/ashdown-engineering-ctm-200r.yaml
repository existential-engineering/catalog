description: The CTM-200R is an all-valve rack-mount bass head delivering 200
  watts of valve-driven power, built for the stage. Crafted in Essex, England in
  a 2mm mild steel chassis with spot-welded supports, it runs a five-valve
  preamp (2 x ECC832, 2 x ECC82, 1 x ECC99) into four KT88 output valves,
  covering everything from '60s bass warmth to growling '70s tones and thick
  modern punch. Standard tone controls plus Deep, Mid Shift, and Bright switches
  shape a responsive passive EQ, while user-adjustable bias via a dual-function
  VU meter, individually fused and user-replaceable output valves, a tube-driven
  transformer-derived DI with isolated ground, and a front-mounted valve FX loop
  round out the feature set.
details: |-
  All-valve rack-mount bass amplifier head, crafted in Essex, England, in a 2mm mild steel chassis with spot-welded supports, powder-coated black. Five-valve preamp into four KT88 output valves. Standard tone controls plus Deep, Mid Shift, and Bright switches. User-adjustable bias via a dual-function VU meter, individually fused and user-replaceable output valves, tube-driven transformer-derived DI output with isolated ground, and a front-mounted valve-driven FX loop. Note: direct purchases not available in the United States (local dealers only).
specs: |-
  - Power output: 200 watts (all valve)
  - Preamp valves: 2 x ECC832, 2 x ECC82, 1 x ECC99
  - Output valves: 4 x KT88
  - EQ: passive with Deep, Mid Shift, and Bright switches
  - Tube-driven transformer-derived DI output with isolated ground
  - Front-mounted valve-driven FX loop
  - Chassis: 2mm mild steel, powder-coated black
  - Rack-mount format
