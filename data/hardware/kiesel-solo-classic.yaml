url: https://www.kieselguitars.com/series/guitar/solo-classic
description: The Solo is a modern take on the beloved T-style, evoking a
  traditional aesthetic and shape while modernizing with a vast array of
  bridges, a sculpted neck heel, customizable control layouts, an optional
  bevel, and 22 or 24 frets.
specs: |-
  - Scale length: 25.5" or 27" fixed, or 25.5" to 26.5", 25.5" to 27" and 26" to 27.5" multiscale
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall; 22 or 24 frets offered
  - Body: alder, 38.25" to 39.75" long, 1.65" thick, 12.5" wide depending on configuration
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" to 2.02" at nut depending on string count
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: ebony with 14" radius
  - Headstock: GT-style headstock
  - Bridge: Hipshot fixed bridge or Hipshot Solo saddle bridge, .4125" (10.5mm) spacing; a vast array of bridges is offered
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector; flush mount or rear access output jack placement; customizable control layouts
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Hardware: chrome
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 7.8 lbs, 7.9 lbs or 8 lbs depending on configuration
  - An optional body bevel is offered
