description: The SL 212 features two 12" Neodymium drivers that deliver deep,
  musical lows, articulate mids, and a smooth top-end. This cabinet functions as
  a standalone powerhouse or can be paired with an SL 112 for expanded sound,
  with a design emphasizing balanced, focused tone suitable across multiple
  genres.
details: |-
  The SL 212 houses two 12" neodymium drivers in a lightweight enclosure,
  delivering 500 watts RMS power handling at 4 ohms. Its neodymium design
  keeps weight low while producing deep musical lows, articulate mids, and a
  smooth top end with exceptional clarity and definition.

  The cabinet pairs a phenolic tweeter with integral phase plug and a custom
  crossover featuring variable tweeter level control, allowing players to dial
  in the precise amount of high-frequency presence for their style. The SL 212
  is designed to work as a standalone cabinet or pair with an SL 112 for
  expanded coverage. Covered by Aguilar's three-year limited warranty.
specs: |-
  - Power Handling: 500 watts RMS
  - Impedance: 4 ohms
  - Frequency Response: 37 Hz – 16 kHz
  - Sensitivity: 102.9 dB 1W/1M
  - Drivers: Two 12" Neodymium
  - Tweeter: Phenolic with integral phase plug
  - Crossover: Custom with variable tweeter control
  - Height: 28 5/8"
  - Width: 19"
  - Depth: 18"
  - Weight: 45 lbs (20.41 kg)
