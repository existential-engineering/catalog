details: |-
  The DN700 arrived in 1984 as one of Klark Teknik's first digital delay lines, a single-input three-output unit whose architecture was later refined in the DN716 and DN7103. It is a historically significant piece of British studio outboard, and its signal-path design set the benchmark for low-noise, low-distortion delay processing of its period.

  One input feeds three independently adjustable outputs. Delay time on each output is adjustable from zero to 434 milliseconds in 26.5 microsecond steps, a resolution well below the threshold of audible position artefact for any practical speaker time-alignment task, and memory settings are retained for a minimum of one year without power.

  The audio input uses a differential electronically balanced circuit that is both voltage- and current-balanced, achieving symmetry better than -50 dB from 20 Hz to 10 kHz. Input and output filters are seven-pole elliptical types using FDNR (Frequency Dependent Negative Resistance) circuitry, chosen for optimum distortion and noise performance.

  Typical applications are touring PA delay-tower time alignment, broadcast monitor delay, vintage studio production, and any job that calls for an early-1980s Klark Teknik digital delay as the specific sonic reference.
specs: |-
  - One input and three independently adjustable outputs
  - Delay range 0 to 434 ms per output, in 26.5 microsecond steps
  - Memory settings retained for a minimum of one year without power
  - Seven-pole elliptical input and output filters using FDNR circuitry
  - Differential electronically balanced input, voltage- and current-balanced
  - Input symmetry better than -50 dB from 20 Hz to 10 kHz
  - Frequency response: 20 Hz to 15 kHz unweighted
  - Dynamic range: better than 85 dB unweighted, better than 90 dB A-weighted
  - 1U rackmount
