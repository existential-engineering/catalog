description: All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. The ESP EX offers the body and angular design of the EX shape along with the high-end, exquisite design details that only the ESP Custom Shop can offer.
details: |-
  All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. The ESP EX offers the body and angular design of the EX shape along with the high-end, exquisite design details that only the ESP Custom Shop can offer.

  This guitar comes in the astounding Black/Andromeda-II finish, with its iridescent bevels that change color as light hits it from various directions. It's built with set-thru construction at 25.5" scale, allowing smooth, unfettered access to the highest frets.

  The ESP EX Black/Andromeda-II offers a Honduran mahogany body paired to a thin u-shaped three-piece maple neck. Its ebony fingerboard has a 305mm radius, with 22 extra-jumbo stainless steel frets, triangular inlays, Luminlay side dots, and a graphite nut.

  Its components include black nickel hardware, ESP strap locks, Gotoh locking tuners, a TonePros locking TOM-style bridge and tailpiece, and a set of outstanding EMG 57 (bridge) and EMG 66 (neck) pickups with black nickel covers, providing exceptional tonal definition and presence. Includes a deluxe ESP form fit case.

  Finish: Black Andromeda-II. Series: EX Series, ESP Original Series. New for 2026.
