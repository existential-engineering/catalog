description: This stand shares patented features with the MFG 3-leg Hi Hat stand, but with an extended footboard.
details: |-
  For drummers that require additional leverage and throw, the already long DW MFG footboard is offered in XF Extended Footboard models. A modified Contour Heel Plate allows a longer footboard without the need for a larger overall footprint.

  A perfect companion to MDD bass drum pedals, the precisely Machined Direct Drive Hi-Hat Stands feature a host of patented features and cutting-edge technology. From the One-Touch Clutch down to the machined high-grade aluminum perforated pedal plate, these hi-hat stands are engineered to provide drummers with smooth, responsive action and road-ready dependability.

  This model uses a three-leg tripod base, with Offset Cymbal Seat Adjustment, V.E.R.T. vertical spring tension adjustment, an Interlocking Delta ball bearing hinge and a Direct-Pull System with selectable action.

  These precision-machined stands are handcrafted in the U.S.A., at the highest standard, using airplane-grade materials for persisting, streamlined performance.
specs: |-
  - Extended Footboard (XF) with modified Contour Heel Plate
  - Three-leg tripod base
  - One-Touch Clutch (U.S. Patent No. 9,601,096)
  - Offset Cymbal Seat Adjustment
  - V.E.R.T. (Vertical Spring Tension Adjustment)
  - Interlocking Delta Ball Bearing Hinge (U.S. Patent No. 9472174)
  - Direct-Pull System with Selectable Action
  - Finish: Polished Anodized Aluminum
  - Handcrafted in the U.S.A.
