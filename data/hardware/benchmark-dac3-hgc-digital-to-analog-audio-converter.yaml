description: The DAC3 HGC is a high-resolution digital-to-analog converter
  combining professional studio-grade engineering with hi-fi listening in a
  half-rack, 1U form factor. It features a motorized Hybrid Gain Control volume
  system, a zero-ohm HPA2 headphone amplifier, jitter-immune UltraLock3
  clocking, and support for PCM up to 192 kHz and native DSD.
details: |-
  The Benchmark DAC3 HGC is a professional digital-to-analog converter built around a Hybrid Gain Control (HGC) system that combines a motorized analog attenuator with high-headroom linear-phase digital processing. The result is a volume control implementation that maintains exceptional dynamic range across the entire gain range, equally suitable for studio monitoring and high-fidelity listening applications.

  At its core, the DAC3 HGC uses Benchmark's UltraLock3 clock system to achieve near-total jitter immunity on all digital inputs including asynchronous USB, two TOSLINK optical, and two coaxial S/PDIF connections. The converter supports PCM audio up to 24-bit/192 kHz and native DSD, with a measured frequency response of ±0.015 dB from 20 Hz to 20 kHz at sample rates of 48 kHz and above.

  The integrated HPA2 headphone amplifier features a true 0-ohm output impedance, delivering 1.25 watts into 30 ohms and over 250 mA of peak current. Two front-panel 1/4-inch TRS headphone outputs are provided; the first jack includes a relay that mutes the line outputs when engaged. THD+N at 20 mW into 300 ohms measures -108 dB, and into 30 ohms -100 dB.

  Analog outputs include a pair of balanced XLR (Neutrik) connectors and two independent pairs of unbalanced RCA outputs, all driven simultaneously. Two stereo RCA analog inputs (A1, A2) are also provided for pass-through use with the built-in volume control. A rear-panel 12V trigger port enables integration with downstream power amplifiers.

  The DAC3 HGC occupies a half-rack-wide, 1U-high chassis (9.5" wide, 1.725" tall, 8.5" deep behind panel) and weighs 3 lbs. It accepts universal AC mains input (100-240V, 50-60 Hz) and draws 12W typical. A factory rackmount version is available, as are silver and black finish options.
specs: |-
  - Form factor: half-rack wide (9.5"), 1U high
  - Digital inputs: USB 2.0 asynchronous, 2x TOSLINK optical, 2x S/PDIF coaxial
  - Analog inputs: 2x stereo RCA pairs (A1, A2)
  - Analog outputs: 2x balanced XLR, 4x unbalanced RCA (2 stereo pairs)
  - Headphone outputs: 2x 1/4-inch TRS, HPA2 amplifier
  - Supported formats: PCM 24-bit up to 192 kHz; native DSD
  - SNR (A-weighted): 128 dB
  - THD+N @ 1 kHz, 0 dBFS: -113 dB (0.00022%)
  - Frequency response 20–20 kHz: ±0.015 dB (Fs ≥ 48 kHz)
  - Crosstalk: -137 dB @ 20 Hz
  - Headphone output impedance: <0.11 Ohms
  - Headphone output power: 1.25W into 30 Ohms
  - Headphone max output current: 250 mA
  - D/A latency: 1.36 ms @ 44.1 kHz; 0.47 ms @ 192 kHz
  - Power: 100-240V AC, 50-60 Hz; 12W typical; 13W maximum
  - UltraLock3 jitter-immune clock system
  - Motorized analog volume attenuator with remote control support
  - 12V trigger I/O for downstream device control
  - Dimensions: 9.5" W × 1.725" H × 9.33" D; weight 3 lbs
