description: >-
  The Quasimidi Sirius is a 28-voice digital performance synthesizer released in 1998,
  designed for the dance music market with extensive hands-on controls for live
  performance and studio work. It features dual oscillators with 128 synth waves, 365 drum
  and percussion samples, a modern vocoder, switchable 12/24dB filters with overdrive, and
  a 7-track pattern-based sequencer. Notable user includes KMFDM/MDFMK founder Sascha
  Konietzko.
details: |-
  The Sirius represents Quasimidi's high-end offering for the electronic dance music market, emphasizing total hands-on control through an interface laden with knobs, buttons, and colorful visual feedback. It combines synthesizer and drum machine capabilities in a single 49-key keyboard instrument.

  The synthesis engine provides two oscillators with 128 synth waveforms alongside 365 drum and percussion samples, enabling both melodic and rhythmic sound design from a single unit. The filter section offers switchable 24dB and 12dB slopes with high-pass and low-pass modes, resonance, and overdrive for aggressive tonal shaping.

  Effects processing includes two dedicated units: FX1 handles reverbs and stereo delays, while FX2 provides chorus, flanger, and additional delay types. The built-in vocoder adds vocal processing capabilities with 16 dedicated patches. A 16-pattern arpeggiator and 7-track sequencer with tap tempo support real-time performance and composition. Eight mixer control knobs manage level, pan, and effects sends across the 7 MIDI parts (3 synth and 4 drums). Memory stores 384 patches (288 preset, 96 user) and 20 percussion kits.
specs: |-
  - Polyphony: 28 voices
  - Oscillators: 2 with 128 synth waves; 365 drum and percussion samples
  - Filter: Switchable 24dB and 12dB slopes; high-pass and low-pass with resonance and overdrive
  - Effects: FX1 (reverbs, stereo delays), FX2 (chorus, flanger, delays), vocoder
  - Arpeggiator: 16 patterns
  - Sequencer: 7-track with tap tempo
  - Keyboard: 49 velocity-sensitive keys
  - Memory: 384 patches (288 preset, 96 user), 16 vocoder patches, 20 percussion kits
  - Control: MIDI (7 parts: 3 synth, 4 drums)
  - Mixer: 8 control knobs for level, pan, and effects send
releaseDate: "1998"
