description: An authentic, hand-assembled reissue of Marshall's original 1992
  Bluesbreaker overdrive pedal, built at Marshall's UK factory. Designed to
  reproduce the velvety, warm, low-gain drive tones famously associated with the
  original Marshall Bluesbreaker amplifier, the pedal combines vintage, organic
  drive with natural colour and warmth for earlier breakup and elevated bluesy
  lead sounds with clarity. Housed in a steel chassis with adjustable gain,
  volume and tone controls.
details: |-
  The sound of the 1962 Bluesbreaker amplifier became a legend, with the smooth tone, rich warmth and full character that gave guitarists more expression than ever before. The original Bluesbreaker pedal took this and put it in a stompbox. Today, this reissue accurately delivers timeless tones and style once again. It captures the magic of those classic vintage amps with added sweetness, crispness and extra edge to carry solos and squeeze out those vital harmonics.

  This authentic reissue is built and hand-assembled in the Bletchley factory. Designed with precision and crafted for quality, the Bluesbreaker carries on the Marshall legacy. Renowned for its straightforward yet impactful design, this pedal seeks to emulate the velvety and warm overdrive tones reminiscent of the iconic Marshall Bluesbreaker amplifier. Having been used on countless stages since its inception in 1992, this pedal has evolved into a coveted collector's item, highly sought after by enthusiasts.

  This reissue pedal faithfully reproduces timeless tones and style, recapturing the enchantment of vintage amplifiers. Infused with additional sweetness, crispness and an extra edge, it excels in elevating solos and extracting essential harmonics, truly embodying the essence of classic tones. The Bluesbreaker pedal masters bluesy lead sounds with bags of clarity and sparkle.

  Just like the original, this classic low-gain drive pedal brings your music to life. By combining vintage, organic drive with natural colour and warmth, the Bluesbreaker gives you earlier breakup and makes your solos tower above the noise.

  Designed and engineered in UK. Made in UK.
