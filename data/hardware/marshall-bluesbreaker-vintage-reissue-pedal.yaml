description: An authentic, hand-assembled reissue of Marshall's original 1992
  Bluesbreaker overdrive pedal, built at Marshall's UK factory. Designed to
  reproduce the velvety, warm, low-gain drive tones famously associated with the
  original Marshall Bluesbreaker amplifier, the pedal combines vintage, organic
  drive with natural colour and warmth for earlier breakup and elevated bluesy
  lead sounds with clarity. Housed in a steel chassis with adjustable gain,
  volume and tone controls.
