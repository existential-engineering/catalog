description: The Midas AS88 is designed to seamlessly convert two high-bitrate
  HyperMAC connections into eight fully redundant AES50 connections, and vice
  versa, whilst ensuring ultra-fast audio switching. Built for speed and
  reliability, the AS88 supports up to 192 bidirectional channels at 96 kHz.
  Using the AS88 with the flagship HD96 console enables full redundancy across
  both console Snake ports, unlocking greater channel capacity and enhanced
  system reliability. Its FPGA-based switching technology ensures dependable
  HyperMAC failover to a redundant connection when needed. Equipped with
  industry-standard RJ45 and optical connectors, the AS88 provides reliable,
  high-performance audio transmission over long distances. Housed in a rugged 2U
  rackmountable chassis, it is engineered for touring and live sound
  environments.
details: |-
  Two high-bitrate HyperMAC connections converted to eight fully redundant AES50 connections (bidirectional). Supports up to 192 bidirectional channels at 96 kHz. Dual-redundant PSUs with rocker power switches and IEC C13 inlets. FPGA-based switching enables fast HyperMAC failover. Rugged 2U rackmountable chassis with industry-standard RJ45 and optical connectors. Designed to pair with the Midas HD96 console for full Snake-port redundancy in touring and live sound environments.
specs: |-
  - HyperMAC / AES50 Converter: 2 In / 16 Out (Dual redundancy)
  - Channels: 192 at 96 kHz
  - Power switches: 2 x rocker on rear panel
  - Power Inlets: 2 x IEC C13 on rear panel
  - Power indicator: Blue LED on front panel
  - HyperMAC Optical: 2 x standard connector on rear panel
  - HyperMAC Copper: 2 x standard connector on rear panel
  - Ethernet: RJ45 connector on rear panel
  - AES50: 16 x RJ45 socket on rear panel
  - Factory Reset: Pushbutton on rear panel
  - Snake X status: 2 x green / 2 x red
  - Snake Y status: 2 x green / 2 x red
  - PSU status: 2 x green / 2 x red
  - AES50 status: 16 x green / 16 x red
  - Ethernet status: 1 x green
  - Voltage: 100 - 240 V 50 / 60 Hz AC
  - Power consumption: 2 x 25 W maximum draw (Dual redundancy)
  - Standard Operating Temperature: 5 C - 45 C (41 F - 113 F)
  - Dimensions (H x W x D): 88 x 440 x 483 mm (3.46 x 17.32 x 19.01 in)
  - Weight: 6.59 kg (14.53 lbs)
