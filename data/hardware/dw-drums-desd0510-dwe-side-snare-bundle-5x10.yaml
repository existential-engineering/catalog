description: This bundle offers a convertible 100% Maple snare, DrumLink wireless hub, DW Soundworks license, and more.
details: |-
  DWe is the first acoustic-electronic, convertible drum set that is playable as both a wireless electronic or a boutique-quality acoustic kit. Built on U.S.-made Collector's 333 Maple shells with wireless triggers, DWe is powered by the patented and expandable DrumLink ecosystem, which gives drummers and producers the ability to build a hybrid setup one component at a time.

  This DWe Side Snare Drum Bundle offers a compact, acoustic-electronic convertible 5x10″ Maple snare designed to help creators integrate hardware components, such as the Roland SPD-SX Pro multi-pad, into an acoustic DW kit or an acoustic-electronic DWe setup.

  The package includes a DrumLink wireless hub, a DW Soundworks license, snare wires, and both mesh and mylar drum heads for rapid conversion. Sounds can be assigned to the digiMag throw-off, and each wireless trigger is powered by two alkaline AA batteries.

  The shell is a Collector's 333 Maple shell handcrafted from 100% North American Hard Rock Maple, built with DW's patented 333 technique that orients Maple plies in horizontal and vertical grain patterns for low, punchy fundamentals. Converting from electronic to acoustic means removing the DWe trigger star plates with drum key screws and changing the batter head from mesh to the included mylar head.

  DrumLink is a proprietary 2.4GHz wireless protocol designed exclusively for drums, sending small micro packets of data so it is not affected by RF interference, with total system latency measured under 8ms. Sound sources are either a computer running DW Soundworks or a compatible Roland drum module, and the drum also works as a wireless MIDI controller with AAX, AU and VST hosts.
specs: |-
  - 5x10″ acoustic-electronic convertible side snare drum
  - Collector's 333 Maple shell, 100% North American Hard Rock Maple
  - Proprietary DrumLink 2.4GHz wireless system (Patent No. 12,033,604)
  - DrumLink wireless hub included
  - digiMag throw-off with assignable sounds
  - Snare wires included
  - Mesh and mylar batter heads included for rapid conversion
  - Includes DW Soundworks license
  - Powered by two alkaline AA batteries per trigger, battery life up to one year
  - Total system latency measured under 8ms
  - Designed to integrate with an acoustic DW kit, a DWe setup or a Roland SPD-SX Pro multi-pad
  - Functions as a wireless MIDI controller with AAX, AU and VST hosts
  - Made in Oxnard, California, USA
