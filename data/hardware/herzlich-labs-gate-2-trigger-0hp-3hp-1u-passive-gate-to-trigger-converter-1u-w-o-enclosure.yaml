description: A passive gate-to-trigger converter module that generates a short
  trigger on the leading edge of a gate signal.
details: |-
  You've been here before - it's like unwrapping a gift that's nearly, but not quite what you wanted. You wanted triggers, and you got gates. But now, there is finally a solution - the Herzlich Labs G2T. Borrowing from the 1U format, this new line of in-line units (and of course also 1U) products seek to improve upon the 0hp formula in several ways. The products are first of all fully enclosed, eliminating the risk of shorting exposed pins to something important, as well as offering a more pleasant device to hold. The format also allows the user to build small arrays of combined units in a single enclosure. The G2T is an evolution of the old 0hp Tachycardia module, with the form factor kept approximately the same, while the internal circuit has been perfected. Quickly and brutally truncate a signal or sound into a short 2ms trigger rather than a prolonged bleep. The G2T only permits signals to pass for a brief moment, generating a trigger on the leading edge, before rejecting it outright, allowing you to derive trigger signals from previously non-triggery sources. Why not generate a drum pattern from a drunkenly modulated gate pattern, or perhaps manipulate square waves in your system as triggers for other things? It is incidentally also the perfect companion to the Behringer 2600, and is beloved by many users of this device - in fact, I'm quite sure I once heard someone whisper "the one thing they forgot to ship with the unit."

  Close those gates, get trigger happy and set your heart aflutter with Herzlich Labs.
