description: Send yourself to another sampling dimension. With Digitakt II, you can weave splinters of sound in stereo, ripped from the moment and brought to your fingertips for marvelous manipulation and beat arraying.
details: |-
  Digitakt II offers many times the power, and sonic possibilities, of its predecessor. It may be a familiar shape, and offer the same recognizable playfulness, but there is so much more power under the hood. Sample, either externally or internally, freely or quantized to the tempo. With a radically enhanced memory capacity, and up to 30 minutes of stereo samples per project, you can trigger ideas from over a thousand sample slots available in each project.

  The Digitakt experience has evolved, offering an even more modular approach to sound creation. Mix and match the layers of your sonic landscape using any of the five distinct sample-manipulating Machines. Carve samples into precise fragments with both Slice and Grid, or venture into new sonic territories with Werp. Use Repitch or Stretch to fit your sample to the beat, and of course there is One Shot for those crisp drum hits and tones.

  Choose from several swappable filters for each track. One filter is fixed as a base/width filter, but the other lets you swap between Multi-mode, Low pass 4, Comb-, Comb+, EQ, or Legacy LP/HP. You also have a filter envelope and a separate amp envelope of ADSR and AHD. Three LFOs per track give you the chance to go wild in modulation land, and any of these settings can be individually selected for each track.

  Transform your sounds with the built-in effects palette. Dip your brush into vibrant delay and reverb, widen your spectrum with chorus, and get destructive with bit reduction and sample rate reduction, or Overdrive. Navigate to the mixer page to apply compression and master overdrive.

  There are 128 steps on Digitakt II for your digits to traverse, double the previous amount. Mix math and music with the Euclidean sequence generator, let the pattern roll the dice with conditional trigs, and use trig modes for 16 levels of velocity, retrig mode, or the Preset Pool. Song Mode is available from the get go, letting you create, edit, and play compositions via a playlist of your patterns. Connect to your other gear with balanced stereo ins and outs, and use the 16 tracks for MIDI in, out, and thru.
specs: |-
  - 6 selectable SRC (audio) machines: Oneshot, Werp, Stretch, Repitch, Slice, Grid
  - 5 selectable FLTR machines: Multi-Mode, Lowpass 4, Equalizer, Comb-, Comb+, Legacy LP/HP
  - 16 stereo or mono audio tracks, or MIDI tracks
  - 1 digital base-width filter, 1 digital overdrive, 1 digital bit reduction and 1 digital sample rate reduction per track
  - 1 overdrive master effect and 1 stereo compressor master effect
  - 3 assignable LFOs per track
  - Modulation setup for pitch bend, velocity, key track, mod wheel, breath control, aftertouch
  - 400 MB sample memory, 20 GB +Drive storage
  - MIDI tracks: 4 note polyphony per step, 16 assignable CC controls, 2 assignable LFOs per track
  - 5 trig modes, keyboard mode with 36 different scales, song mode
  - 128 steps per pattern and track, individual pattern length and time scale multiplier per track
  - Parameter locks, trig conditions and trig chance, retrig, micro timing
  - 1 Euclidean sequence generator per track
  - Send effects: Saturator Delay, Supervoid Reverb, Panoramic Chorus
  - 128 x 64 pixel OLED screen
  - 2 x 1/4" impedance balanced audio out jacks
  - 2 x 1/4" impedance balanced audio in jacks
  - 1 x 1/4" stereo headphone jack
  - 48 kHz, 24-bit D/A and A/D converters
  - Hi-Speed USB 2.0 port
  - MIDI In/Out/Thru with DIN Sync out
  - Sturdy steel casing, W215 x D176 x H63 mm (8.5" x 6.9" x 2.5")
  - Weight: approximately 1.48 kg (3.25 lbs)
  - 100 x 100 mm VESA mounting holes, M4 screws with a max length of 7 mm
  - Overbridge enabled, class compliant USB audio, external input mixer
  - 3 year Elektron warranty
