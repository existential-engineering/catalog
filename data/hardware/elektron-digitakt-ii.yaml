description: >-
  Send yourself to another sampling dimension. With Digitakt II, you can weave
  splinters of sound in stereo, ripped from the moment and brought to your
  fingertips for marvelous manipulation and beat arraying.
details: |-
  The Digitakt II is a 16-track drum computer and sampler featuring six sample machines (Oneshot, Werp, Stretch, Repitch, Slice, Grid) and six filter types. It supports stereo and mono audio tracks alongside MIDI tracks, with 400 MB of sample memory and 20 GB of +Drive storage.

  The sequencer offers 128 steps per pattern with individual track length, time scale multiplier, parameter locks, trig conditions, Euclidean sequence generation, and Song Mode. Five trig modes provide deep performance control including velocity, retrigs, slice, and preset pool modes.

  Effects include Saturator Delay, Supervoid Reverb, Panoramic Chorus, Compression, and Master Overdrive. The unit features Overbridge integration and class-compliant USB audio. Housed in a sturdy steel casing with 100 x 100 mm VESA mounting.
specs: |-
  - 16 stereo/mono audio or MIDI tracks
  - 6 sample machines: Oneshot, Werp, Stretch, Repitch, Slice, Grid
  - 6 filter types: Multi-Mode, Lowpass 4, Equalizer, Comb-, Comb+, Legacy
  - 400 MB sample memory, 20 GB +Drive storage
  - 128-step sequencer with Euclidean generator and Song Mode
  - Parameter locks, trig conditions, micro timing
  - Effects: Saturator Delay, Supervoid Reverb, Panoramic Chorus
  - Overbridge enabled for DAW integration
  - Class-compliant USB 2.0 Hi-Speed audio
  - 48 kHz, 24-bit D/A and A/D converters
  - 128 x 64 pixel OLED display
  - Steel casing: 215 x 176 x 63 mm, 1.48 kg
