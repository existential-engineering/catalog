details: |-
  Mix it up with the Micro Mix, a dual passive mixer in 2hp that functions as both a dual 3-to-1 or a 6-to-1 passive mixer, allowing you to perform acts of minor sorcery in your modular system (or maybe outside with your Volca and Pocket Operator jam?). No knobs or buttons here to confuse you, plug in either audio, CV, clock or triggers, and get the mixed signal out. The best part? Since it's passive, there's no guarantee what you put in is exactly what you'll get out. Embrace the unpredictable world of passive mixing like they did in the 60s and 70s. Go ahead, spend your money, you'll be very glad you did.
