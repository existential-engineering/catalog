description: "The Studio-210 is born from the changing needs of modern bassists:
  lightweight, versatile, and packed with features for both home and stage."
details: |-
  The Studio-210 is a lightweight bass combo with 2 x 10" NEO speakers and an HF unit, offering a 5-band EQ, foot-switchable valve-emulated overdrive, an FX loop, a balanced XLR DI, a switchable tweeter and an external speaker output for pairing with an 8 Ohm cab. A headphone output allows silent practice, and the tone-shaping is borrowed from the Rootmaster and ORIGINAL ranges.
specs: |-
  - Speakers: 2 x 10" NEO + HF unit
  - Weight: 15.5kg (34.2lbs)
  - Size (mm): H-458 W-377 D-560
  - 5-band EQ: Bass, Low Mid, Middle, Hi-Mid, Treble
  - Pre shape
  - Tweeter mute switch
  - Valve-emulated drive
  - Line input
  - Headphone out
  - XLR DI output
  - Footswitchable drive
  - Speaker output
