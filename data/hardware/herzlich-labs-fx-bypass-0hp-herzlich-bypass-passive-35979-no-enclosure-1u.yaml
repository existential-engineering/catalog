description: A passive send, return and bypass utility module for switching
  between dry and wet signal paths or using as an A/B switch.
details: |-
  Bypass, or un-bypass, at will

  There has got to be a better way to turn off your effects chain than quickly unpatching and repatching the signal, right? Fortunately, there is, thanks to the FX Bypass - operation is simple, you just press the button, and what a nice button it is, too. Signals inserted in Input are forwarded to Send, allowing you to pass the signal on to whatever destination you desire. Once the signal has been sufficiently mangled, put it back into Return, and patch Out to your desired destination. Now, when you press the switch, you can switch between the dry and wet signal with ease. Need an A/B switch real quick? Insert one signal into Input, and another in Return, and you can quickly swap between them. It's practically a multi-tool, with exactly two tools inside of it. Amazing. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Accepts both CV and audio signals
  - Use it for your FX chain - or even as an A/B switch
  - Passive design: no external power, no batteries
