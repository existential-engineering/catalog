description: Guitar virtuoso Jake E Lee blazed trails in the 1980s with Ratt and
  Rough Cutt before landing his legendary gig as Ozzy Osbourne's lead guitarist.
  His acclaimed career continued with Badlands and now Red Dragon Cartel, and
  Charvel has been there every step of the way. Charvel honors the dynamic
  guitarist with the new Jake E Lee Signature Pro-Mod So-Cal, based on the
  distinctive white "Charvel-ized" instrument he acquired back in 1975.
details: |-
  The Jake E Lee Signature Pro-Mod So-Cal Style 1 HSS HT RW pairs an alder body in a Pearl White gloss finish with a bolt-on maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A rosewood fingerboard with a 12" to 16" compound radius hosts 21 jumbo frets and white dot inlays, anchored by a 1.6875" plastic nut and a 25.5" scale length. A heel-mount truss rod adjustment wheel rounds out the neck, which terminates in a licensed Fender Stratocaster headstock with a 4-bolt serialized neck plate.

  Electronics are built around an HSS configuration: a Seymour Duncan JB SH-4 humbucker at the bridge paired with DiMarzio SDS-1 DP111 single-coils in the middle and neck positions, routed through a 5-position blade switch (Position 1: Bridge, Position 2: Bridge Outer Coil and Middle, Position 3: Middle, Position 4: Middle and Neck, Position 5: Neck) with a single master volume control.

  Hardware is finished in black throughout, including a hardtail bridge with black base plate, Charvel-branded tuning machines with pearl buttons, Stratocaster-style black skirt control knobs, a white switch tip, and a 1-ply black pickguard.
