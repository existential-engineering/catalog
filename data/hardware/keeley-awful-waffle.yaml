description: Limited-edition silicon treble booster in a slime green enclosure,
  with three modes and gain and output controls.
details: |-
  The Awful Waffle Slime Blaster is a treble booster that can push an amplifier into overdrive. Three modes and two knobs for gain and output let the effect be set from subtle to saturated. It is based on the Big D Rangemaster, using a National Semiconductor 2n3565 NPN silicon transistor, which gives it more gain and a harder edge than a germanium treble booster.

  Keeley describes the run as the result of a batch of Germanium Ecstasy boards that were not wired for reverse-polarity PNP transistors, housed in a set of slime green enclosures held back from use. The artwork is by Gabe Tavarez.

  The pedal is hand made and aimed at classic 1960s and 1970s tones. It was a limited edition of 30 units and the page states it will not be made again.

  It is a treble booster by design rather than a conventional overdrive or distortion, so higher notes are amplified and driven more than lower ones, and bass notes stay tight and defined. It is intended for use with an amplifier that is already breaking up, and cranking both the amplifier and the pedal gives more sustain and a creamier distortion.
