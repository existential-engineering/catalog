details: |-
  Since the 1970s, Auratone 5C Super Sound Cubes have been valued by engineers, producers, and artists for the real-world reference they provide. Bettermaker makes for Auratone a dedicated amplifier to power them optimally.

  Purpose-built for the legendary TEC Award-winning Auratone Super Sound Cube reference monitors, the Auratone A2-30 amplifier powers two 8-ohm loudspeakers with 30 watts per channel.

  Like the Super Sound Cubes, the A2-30 is a serious professional studio tool that is lean and mean, with nothing but a power switch, status LED, and professional connectivity. The amp has the same footprint as the Sound Cubes, so it sits naturally on a desk or meter bridge alongside them.

  For decades, Auratones have been the gold standard for brutal honesty in monitoring, making it glaringly obvious when aspects of your mix are not sitting right.
specs: |-
  - 30 watts per channel output
  - Powers two 8-ohm loudspeakers
  - Two-channel stereo amplifier
  - Power switch and status LED
  - Same footprint as Auratone Sound Cubes
