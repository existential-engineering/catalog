description: >-
  The Korg Triton is a flagship 62-voice digital workstation from 1999
  featuring HI synthesis, a built-in sampler, touch-screen interface, and
  a 16-track sequencer that became one of the most widely used production
  keyboards of its era.
details: |-
  Building on the foundation laid by the Trinity, the Triton arrived in 1999 as Korg's new flagship workstation. It nearly doubled the polyphony to 62 voices and introduced a built-in sampler with 16 MB of RAM expandable to 64 MB, making it a self-contained production powerhouse. The HI synthesis engine drew from 32 MB of PCM ROM containing 425 multi-samples and 413 drum samples.

  The effects section provided 102 effect types including 2 master effects, 5 insert effects, and a master EQ running simultaneously. A 16-track sequencer with 100,000-note capacity and 1/192 note resolution handled detailed arrangement work, while a versatile arpeggiator offered 72 or more patterns per song for rhythmic and melodic inspiration.

  The Triton line expanded substantially over its production run. The original 1999 model was followed by the Triton Rack and budget-friendly LE in 2000, the Studio model with increased 120-voice polyphony in 2002, and the Extreme with vacuum tube output circuitry in 2005. Keyboard options ranged from 61-key to 76-key and 88-key weighted models, all with velocity and aftertouch sensitivity.

  The Triton became ubiquitous in professional music production, adopted by artists including Depeche Mode, Orbital, The Orb, BT, Rick Wakeman, Yes, and Vangelis. Its combination of expansive sound library, sampling capability, and comprehensive sequencing made it a studio centerpiece throughout the 2000s.
specs: |-
  - Polyphony: 62 voices (120 on Studio/Extreme models)
  - Sound Source: HI synthesis, 48 kHz, 32 MB PCM ROM
  - Samples: 425 multi-samples, 413 drum samples
  - Sampler: 16-bit, 48 kHz, 16 MB RAM (expandable to 64 MB)
  - Memory: 640 programs, 512 combinations, 64 drum programs
  - Filter: Digital multi-mode
  - Effects: 102 types (2 master, 5 insert, 1 master EQ)
  - Sequencer: 16-track, 100,000-note capacity, 1/192 resolution
  - Arpeggiator: 72+ patterns
  - Keyboard: 61/76/88-key options with velocity and aftertouch
  - Display: Touch-screen interface
