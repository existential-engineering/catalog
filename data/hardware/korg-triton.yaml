description: >-
  The Korg Triton is a flagship 62-voice digital workstation synthesizer released in 1999,
  featuring HI synthesis, a built-in 16-bit stereo sampler, touch-screen interface, and a
  16-track sequencer. It became one of the most widely used production keyboards of its
  era, adopted by artists including Depeche Mode, Orbital, The Orb, BT, Rick Wakeman, and
  Vangelis.
details: |-
  Building on the foundation laid by the Trinity, the Triton arrived in 1999 as Korg's new flagship workstation. It nearly doubled the polyphony to 62 voices and introduced a built-in sampler with 16 MB of RAM expandable to 64 MB, making it a self-contained production powerhouse. The HI synthesis engine drew from 32 MB of PCM ROM containing 425 multi-samples and 413 drum samples.

  The effects section provided 102 effect types including 2 master effects, 5 insert effects, and a master EQ running simultaneously. A stereo digital multi-effect system supported mono-in stereo-out master effects and stereo-in stereo-out insert effects. A 16-track sequencer with 200,000-note capacity and 1/192 note resolution handled detailed arrangement work, while a versatile arpeggiator offered 72 or more patterns per song with RPPR (Real-time Pattern Play/Recording) for rhythmic and melodic inspiration.

  The sound design capabilities were expansive, enabling everything from orchestral instruments with life-like vibrato to aggressive filtered chord stabs for dance music. The sampler supported AIFF, WAVE, and AKAI format compatibility with up to 1,000 multi-samples and 4,000 individual samples. Control surfaces included a joystick, 2 assignable switches, 4 assignable knobs, and damper pedal input.

  The Triton line expanded substantially over its production run. The original 1999 model was followed by the Triton Rack and budget-friendly LE in 2000, the Studio model with doubled 120-voice polyphony and S/PDIF I/O in 2002, and the Extreme with 160 MB waveform memory, 96 MB sample RAM, a 12AU7 vacuum tube effect processor, and USB connectivity in 2005. Keyboard options ranged from 61-key to 76-key and 88-key weighted models, all with velocity and aftertouch sensitivity.
specs: |-
  - Polyphony: 62 voices (120 on Studio/Extreme models)
  - Sound Source: HI synthesis, 48 kHz, 32 MB PCM ROM
  - Samples: 425 multi-samples, 413 drum samples
  - Sampler: 16-bit, 48 kHz stereo/mono, 16 MB RAM (expandable to 64 MB)
  - Max Samples: 1,000 multi-samples / 4,000 samples, 128 per multi-sample
  - Memory: 640 programs, 512 combinations, 64 drum programs
  - GM Level 2: 256 programs + 9 drum sets
  - Effects: 102 types (2 master, 5 insert, 1 master EQ simultaneously)
  - Sequencer: 16-track, 200,000-note capacity, 1/192 resolution, 200 songs
  - Arpeggiator: RPPR, 5 preset + 232 user patterns
  - Keyboard: 61/76/88-key options with velocity and aftertouch
  - Display: Touch-screen interface
  - I/O: MIDI (16-part), stereo outputs, 4 individual outputs, 2 audio inputs
  - Controls: Joystick, 2 assignable switches, 4 assignable knobs
  - Storage: 3.5-inch floppy drive, SMF Format 0 & 1 compatible
