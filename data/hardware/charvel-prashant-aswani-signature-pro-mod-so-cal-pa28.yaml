description: This signature model honors the "guru of groove" Prashant Aswani,
  known for blending a hard-hitting, aggressive playing style with unique
  phrasing, unbridled passion and spontaneity. The PA28 delivers a versatile
  tonal range from lush designs to crushing riffs, crafted with an alder body
  and graphite-reinforced maple neck for comfort and upper-fret accessibility.
details: |-
  The Prashant Aswani Signature Pro-Mod So-Cal PA28 pairs an alder So-Cal Style 1 body finished in thin-skin nitro lacquer Inca Silver (with matching headstock) with a bolt-on graphite-reinforced maple neck. The neck features a hand-rubbed satin urethane finish, a Speed Neck profile with rolled fingerboard edges, and a sculpted shredder's cut heel mounted with 4 bolts (no neck plate). The body includes a scalloped lower back bout for upper-fret access.

  A rosewood fingerboard with a 12" radius hosts 22 jumbo frets with rolled edges, cream dot position inlays, and Luminlay glow-in-the-dark side dots. A 42mm Graph Tech TUSQ XL nut and a heel-mount truss rod adjustment wheel round out the neck.

  Electronics are built around a custom Charvel PA28 humbucking set with alnico 3 magnets and parchment covers, delivering glassy, chiming cleans with woody undertones and rich harmonic content with gain. The HH configuration is wired through a 5-position blade switch (Position 1: Bridge only, Position 2: Both outer coils, Position 3: Bridge and Neck, Position 4: Both inside coils, Position 5: Neck only) with Volume and Tone controls using Dunlop Super Pots.

  Hardware is finished in chrome throughout, including a recessed Wilkinson WVS 130 CR 2-point locking tremolo with locking saddles and pop-in tremolo arm, Charvel-branded die-cast staggered locking tuning machines, a 1-ply parchment pickguard, Stratocaster-style skirted control knobs, and a parchment switch tip. The "PA28" signature is engraved on the back of the headstock.
