description: A rack-mount guitar amplifier featuring selectable input channels,
  a 4-band EQ, an adjustable limiter, tremolo, and reverb, with a rear-panel
  effects loop.
details: |-
  Equally at home in a rack or sitting gently atop your choice of cabinet, the Steelaire Rackmount represents the future of amplification technology. The Steelaire Rackmount utilizes a patented technology that combines a fully regulated switchmode power supply and proprietary class-D power amplification with our own secret sauce to add warmth and resolution normally reserved for hand-wired boutique tube amplifiers costing many thousands of dollars. With selectable input channels, a 4 band EQ, an adjustable limiter, tremolo, and a full-service reverb section, you get a full tool kit to optimize the sound of your instrument. In addition, a unique rear-panel effects loop with 9 volt DC supply allows you to customize the sound of your amp by wiring in accessory pedals of your choice, with integrated control using one of our 6 position remote switches. (Foot controller or leg mount remote, available separately.)

  Checkout our current lineup of Guitar Amplifiers here . Specifications

  Power Output

  200 watts , 4-8 ohms

  AC Power Req:

  100-240Vac, 50-60 Hz, 250W

  Input Connections
  INSTR-1: 1/4" mono, INSTR-2: 1/4" mono

  Speaker 1 Output:

  4 ohms, 200 W minimum rating

  Speaker 2 Output:

  4-8 ohms, 200 W minimum rating

  Rack mount Dimensions & Weight

  2RU, 7.75" (19.7cm) deep, 7.2 lbs (3.3 Kg)
