url: https://www.mrblackpedals.com/products/black-ltd-overdriver
description: A natural-sounding overdrive for guitar and bass that cleans up
  well from the instrument's volume knob. A Jack Deville original design,
  limited run of 95 pieces.
details: |-
  The Black LTD. Overdriver is a natural overdrive voiced for both guitar and
  bass. Run into a clean amp it works as a separate overdrive channel, and pushed
  into a dirty amp it drives the tone harder for a more aggressive sound.

  The circuit is prized for how it responds to playing dynamics, cleaning up
  smoothly as you back off the guitar's volume or soften your pick attack. It
  keeps a strong low end while staying articulate.

  It is a Jack Deville original design, produced as a Black LTD. limited run of
  95 pieces.

  The pedal uses a standard stompbox layout with a 1/4-inch instrument input and
  output and 9VDC pedal power. This run has sold out, but no notice states the
  product line itself is permanently discontinued.
specs: |-
  - Natural overdrive for guitar and bass
  - Cleans up via guitar volume and pick attack
  - Limited run of 95 pieces
  - Jack Deville original design
