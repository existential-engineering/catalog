description: A JFET clean boost based on the Dumble BBC-1 circuit, itself
  derived from a 1970s Barcus Berry acoustic preamp, offering transparent clean
  tone with simultaneous bass and gain attenuation control.
details: |-
  The Fumble is a faithful production version of the Dumble BBC-1 circuit, a JFET preamp lifted almost part for part from a Barcus Berry acoustic preamp made in the 1970s. It has two knobs: OUTPUT (master volume) and INPUT (simultaneous bass and gain attenuator — fully right bypasses the control; turning left progressively cuts bass and input gain). True bypass switching. Use as a permanent buffer at the front of a board, to slam the front of overdrives, to slam the front of a dirty amp, or as a solo boost at the end of the chain.
