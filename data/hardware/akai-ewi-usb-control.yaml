details: >-
  Utility software for the wind controller hardware ewi-USB from akai
  professional. Provides controls for all the hardware's parameters and allows
  for saving frequently used presets to disk.


  This way you can keep multiple settings for different setups.


  Akai ewi-USB control can be chained between the controller hardware and a
  sequencer or synthesizer software in order to filter the MIDI data stream in
  real-time.


  Four different key switches can be assigned to individual hardware sensors and
  trigger specific sound articulations this way.
specs: |-
  - MIDI controller
  - Real-time MIDI data stream filtering
  - Hardware parameter control
  - Preset saving and loading
  - Key switch assignment to hardware sensors
  - Sound articulation triggering
