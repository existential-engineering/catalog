description: >
  Unparalleled sequencing and arpeggiation power in a compact, desktop friendly
  form. KeyStep Pro lets you connect all your vintage hardware, modular gear,
  and software instruments together to supercharge your creativity.
details: |-
  Keystep pro is a polyphonic sequencing controller keyboard offering unparalleled sequencing and arpeggiation power in a compact, desktop friendly form. It lets you connect all your vintage hardware, modular gear, and software instruments together to supercharge your creativity.

  Keystep pro removes every barrier between you and the music you want to create, making every performance a breeze. You can build your own sound at every level, from punching in individual drum tracks to shifting the key of every instrument at once.

  4 independent polyphonic sequencers control whatever synth, module, or drum machine you want. 16 patterns per track, with each sequencer pattern up to 64 steps long and containing 16 notes per step. Link up to 16 patterns together to create whole songs or sections of your set.

  Your ever-growing collection of eurorack modules, analog synths, and VST instruments can finally perform in sync, thanks to the unmatched connectivity keystep pro has to offer. Make the most of 4 CV, gate and mod outputs, 8 dedicated drum gate outputs, clocks, MIDI in, 2 MIDI outputs, a solo metronome output, sustain pedal input, and USB for easy power and DAW/softsynth control.

  Keystep pro comes with a selection of industry-standard creative software to get your musical ideas flowing, so you can start exploring right out the box.
specs: |-
  - 37 note slim keys
  - Velocity and aftertouch sensitive
  - LED above each key
  - Four track step sequencer
  - 16 step buttons
  - Up to 64 steps per sequence
  - Up to 16 notes of polyphony per step
  - Real-time recording
  - Step recording
  - Step editing
  - Pitch control per note
  - Velocity control per note
  - Gate length control per note
  - Time shift control per note
  - Probability control per note
  - Scale quantization with user scales
  - Polyphonic CV outputs
  - Forward playing mode
  - Random playing modes
  - Pattern randomization
  - Quantized recording
  - Unquantized recording
  - 7 arpeggiator modes
  - 5 octave range
  - 5 encoders for cc sending
  - 4x CV, gate, mod outputs
  - 8 drum gate outputs
  - 1 MIDI in
  - 2 MIDI out
  - USB
  - Clock synchronization
  - Metronome with speaker
  - Metronome line output
  - Crisp OLED screen
  - Touch strip
  - Capacitive strip looper control
  - Size: 589 x 55 x 209 mm
  - Size: 23.19 x 2.17 x 8.23 in
  - Weight: 2.7 kg
  - Weight: 5.95 lb
  - 4 independent polyphonic sequencers
  - 16 patterns per track
  - Each pattern up to 64 steps long
  - 16 notes per step
  - Link up to 16 patterns together
  - Snapshots for instant pattern switching
  - Onboard memory for projects
