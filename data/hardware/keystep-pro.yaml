description: >
  Unparalleled sequencing and arpeggiation power in a compact, desktop friendly form. KeyStep Pro lets you connect all your vintage hardware, modular gear, and software instruments together to supercharge your creativity.
details: |-
  The keystep pro is a polyphonic sequencing controller keyboard that combines unparalleled sequencing and arpeggiation power in a compact, desktop-friendly form. It lets you connect vintage hardware, modular gear, and software instruments together to supercharge creativity. The device removes barriers between you and the music you want to create, enabling both dawless and DAW-based workflows for producers and keyboardists alike.

  The sequencing engine features 4 independent polyphonic sequencers with 16 patterns per track, each supporting up to 64 steps and 16 notes per step. You can link up to 16 patterns together to create entire songs or setlist sections, and access snapshots of all sequences within a pattern for instant switching between sets. Real-time recording, step recording, and step editing provide flexible note input, with per-note control over pitch, velocity, gate length, time shift, and probability. Scale quantization with user scales ensures notes stay in key, while 7 arpeggiator modes with 5 octave range offer performance-oriented sequencing with forward and random playing modes.

  The 37-note slim keyboard with velocity and aftertouch sensitivity features LED feedback above each key for visual confirmation. Control is managed through 5 encoders for cc sending, dedicated tempo and swing controls, project editing capabilities, and track controls for navigating patterns and selecting track types (arp, drum, or sequence). A crisp OLED screen displays project details and editing information, while a capacitive touch strip provides intuitive looper control and a built-in piezo speaker with line output lets you reference tempo and sync with other gear.

  Connectivity is extensive with 4 CV, gate, and mod outputs that can be freely routed for polyphonic CV output, 8 dedicated drum gate outputs for controlling multiple modules, 1 MIDI in, 2 MIDI out, USB for power and DAW control, and clock synchronization with in, out, and reset outputs for eurorack sequencers. A dedicated metronome output provides an audio click for mixers, modules, or drummers. All projects can be loaded, duplicated, tweaked, edited, and saved in onboard memory for an ever-growing collection of sequences and setups.
