url: https://www.pioneerdj.com/en/product/dj-controllers/ddj-ergo-v/
description: "The DDJ-ERGO brings simplicity into both setup and performance,
  without compromising sound quality or features. Portable dimensions and sharp
  styling are complemented by a single bus powered cable connection to your
  laptop. All major controls and effects are intuitively positioned and ready on
  the first press of a button. Quick access features include 4-deck control,
  filters, FX, Hot Cues and sample banks with loop sampling too. The DDJ-ERGO
  comes bundled with Atomix Productions Virtual DJ Limited Edition, that lets
  you scratch, mix and add modern remix effects to your music and video sets
  without paying for an upgrade. On top of the 4 decks with autosync, you get
  instant access to 8 samples, smart loops and much more. Automatic beatgrids,
  high-detail waveforms and a software interface that matches the controller
  will make it easy to keep track of the mix. Pulse Control uses lights to
  highlight what features are in play, how accurate your beat matching is and
  which track is loaded. Other features: MIDI output makes the DDJ-ERGO
  compatible with most other DJ software on the market. TRAKTOR users can apply
  the included TSI settings file to control their favourite software; Boasts
  features from our pro range, including the 115mm Jog Wheel and the same audio
  circuitry as our professional mixers for the master out terminal; Laptop dock
  design enables you to use as little space as possible and keep the screen in
  view while using the controls. The DDJ-ERGO can also be adapted to sitting or
  standing positions by unscrewing the removable legs; The industry’s first lock
  mechanism, “P-LOCK Fader Cap”, is equipped on the cross-fader and each channel
  fader to prevent fader caps from slipping during performance; Line in and MIC
  input; Built-in audio interface."
details: |-
  DJ controller for Virtual DJ Limited Edition. The DDJ-ERGO brings simplicity into both setup and performance, without compromising sound quality or features. Portable dimensions and sharp styling are complemented by a single bus powered cable connection to your laptop. All major controls and effects are intuitively positioned and ready on the first press of a button. Quick access features include 4-deck control, filters, FX, Hot Cues and sample banks with loop sampling too. The DDJ-ERGO comes bundled with Atomix Productions Virtual DJ Limited Edition, that lets you scratch, mix and add modern remix effects to your music and video sets without paying for an upgrade. On top of the 4 decks with autosync, you get instant access to 8 samples, smart loops and much more. Automatic beatgrids, high-detail waveforms and a software interface that matches the controller will make it easy to keep track of the mix. Pulse Control uses lights to highlight what features are in play, how accurate your beat matching is and which track is loaded. Other features: MIDI output makes the DDJ-ERGO compatible with most other DJ software on the market. TRAKTOR users can apply the included TSI settings file to control their favourite software; Boasts features from our pro range, including the 115mm Jog Wheel and the same audio circuitry as our professional mixers for the master out terminal; Laptop dock design enables you to use as little space as possible and keep the screen in view while using the controls. The DDJ-ERGO can also be adapted to sitting or standing positions by unscrewing the removable legs; The industry’s first lock mechanism, “P-LOCK Fader Cap”, is equipped on the cross-fader and each channel fader to prevent fader caps from slipping during performance; Line in and MIC input; Built-in audio interface.
