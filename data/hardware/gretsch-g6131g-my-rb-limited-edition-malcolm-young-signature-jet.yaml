details: |-
  Malcolm Young's fiery rock 'n' roll spirit lives on through AC/DC's enduringly timeless music, and it is Gretsch's great privilege to pay tribute to the groundbreaking rhythm guitarist with the all-new G6131G-MY-RB Limited Malcolm Young Signature Jet in Vintage Firebird Red.

  Nicknamed "The Beast," Malcolm Young's iconic Gretsch was used in early AC/DC performances and iconic music videos before later modifications and stripping of the original paint. This Limited Edition recreation captures that early-career spirit in Vintage Firebird Red.

  Features include TV Jones Ray Butts Ful-Fidelity Filter'Tron pickups in the bridge and neck positions plus a middle TV Jones Starwood humbucker. Construction includes a chambered mahogany body with maple top, lightly aged finish, bound ebony fingerboard with 22 jumbo frets, aged pearloid inlays, bone nut, Adjusto-Matic bridge, '60s Jet vibrato tailpiece, Schaller tuners, black pickguard, and aged gold hardware.
