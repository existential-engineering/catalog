description: The DN800 is a 1U analogue active crossover that reconfigures
  through plug-in filter cards to suit the system architecture at hand. A single
  chassis covers four-input two-way, two-input three-way and two-input four-way
  configurations, making it adaptable to bi-amped, tri-amped and four-way
  loudspeaker systems without committing to a topology at purchase.
details: |-
  The DN800 is a 1U analogue active crossover that is reconfigured through plug-in filter cards rather than fixed at purchase. One chassis covers four-input two-way, two-input three-way and two-input four-way configurations, so it suits bi-amped, tri-amped and four-way loudspeaker systems alike.

  Interchangeable plug-in filter cards set the frequency and slope characteristics of each crossover point, offering 12, 18 or 24 dB per octave slopes with a choice of Linkwitz-Riley, Butterworth or Bessel responses, covering the standard alignments used in professional loudspeaker design. Each band carries its own adjustable VCA limiter, with time constants optimised for the frequency range that band covers, to protect drivers without audibly limiting programme material.

  All inputs pass through an independent band-limiting filter section providing an 18 dB per octave high-pass at 30 Hz and an 18 dB per octave low-pass at 30 kHz, which protects downstream electronics from subsonic and ultrasonic content. Adjustable make-up gain after the crossover filters, with a range from -6 dB to +12 dB, matches each band to the power amplifier input it drives.

  Typical applications are touring PA crossovers, fixed installations, broadcast monitoring systems and any context that calls for a reconfigurable analogue crossover with per-band driver protection.
specs: |-
  - Configurable topologies: 4 x 2-way, 2 x 3-way, 2 x 4-way
  - Plug-in filter cards with 12, 18 or 24 dB per octave slopes
  - Filter alignments: Linkwitz-Riley, Butterworth, Bessel
  - VCA limiter per band with frequency-appropriate time constants
  - Input band limiting: 30 Hz high-pass and 30 kHz low-pass, both 18 dB per octave
  - Make-up gain per band: -6 dB to +12 dB
  - 1U rackmount with balanced XLR input and output
