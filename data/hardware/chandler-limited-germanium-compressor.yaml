details: |-
  The Germanium Compressor continues the Germanium series with the same all class A amplifier found in the Germanium Preamp and Tone Control. The unit is transformer balanced in and out, using custom-wound XLR (pin 2 hot) connectors.

  The compression circuit uses an FET gain reduction element with the same flexibility as other Germ units. Notable features include a Wet/Dry mix control for parallel compression within the unit, a 4-position Comp Curve switch that selects the knee using various diode combinations, and a Clean/Dirty comp mode switch.

  A switchable Sidechain filter offers settings at Out, 30, 60, 90, 150, and 300 Hz, allowing precise control over what drives the compression. A negative Feedback control, true bypass switch, and stereo Link switch round out the feature set.

  Many parameters were deliberately set by studio use and listening rather than test-gear analysis, resulting in what Chandler describes as a musical powerhouse suited for tracking, mixing, and mastering.

  All Germanium units require the PSU-1 Chandler Limited external power supply, which is purchased separately and includes an internal voltage switch for 120V or 220V operation.
