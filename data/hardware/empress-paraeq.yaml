description: "The original ParaEq w/Boost: a powerful, musical, high-quality
  parametric EQ with a clean boost in a small package. Three bands of parametric
  EQ each with three selectable Q widths give extremely flexible tone shaping,
  with 30dB of clean boost on top. Discontinued and replaced by the ParaEq MKII
  and MKII Deluxe."
details: |-
  The ParaEq w/Boost gives musicians a powerful, transparent parametric EQ built from high-quality components chosen for transparency, tone-shaping capability and low noise. Your instrument still sounds like your instrument, only better. Three bands of parametric EQ each offer three selectable Q widths: wide for general, transparent tone shaping, medium for everyday problem-solving (pulling boxiness from the low mids, taming harshness in the upper mids), and narrow for notching out problem frequencies (a saviour for acoustic players fighting feedback).

  The Boost section offers 30dB of clean boost. It can engage with the EQ section as make-up gain when doing subtractive EQ, or be used entirely separately as a pure clean boost, great for lifting your volume for solos or pushing the front end of a tube amp into break-up. The pedal is internally switchable for 9/12/18V operation, measures under 0.03% distortion, and is true bypass.
specs: |-
  - Controls: 3 bands of parametric EQ (sweepable frequency, +/-15dB cut/boost, switchable Q per band), 30dB clean Boost with separate footswitch
  - Selectable Q values: 0.5, 1.5, 3
  - Internally switchable 9/12/18V operation
  - Distortion under 0.03%
  - All-analog signal path
  - True bypass
  - Input impedance: 1MΩ / Output impedance: 510Ω
  - Power: 9-18V DC (negative tip), 2.1mm barrel connector
  - Power consumption: 85mA (constant across input voltage)
  - Enclosure: die-cast aluminum
  - Dimensions: 3.5" L x 4.5" W x 1.5" H (enclosure), 2" H including controls
  - Weight: 1 lb
