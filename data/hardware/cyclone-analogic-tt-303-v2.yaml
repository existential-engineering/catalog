description: >-
  The Cyclone Analogic TT-303 V2 is a modern analog bass synthesizer inspired by
  the Roland TB-303, featuring an expanded 432-pattern sequencer, CV/Gate
  outputs, and a refined design with customizable LED colors.
details: |-
  The TT-303 V2 is Cyclone Analogic's second-generation take on the legendary
  Roland TB-303 Bass Line. Rather than simply cloning the original, this
  revision adds significant improvements while maintaining the core analog
  bass synthesis that made the 303 an icon of acid house and techno.

  The redesigned unit features a more elegant and modern aesthetic compared to
  its predecessor. Under the hood, it retains a single VCO with sawtooth and
  square waveforms feeding a 24dB/octave 4-pole low-pass ladder filter with
  resonance, staying true to the classic 303 signal path that defined an
  entire genre of electronic music.

  The sequencer is where the V2 really distinguishes itself, offering 432 user
  patterns with up to 64 steps per pattern, plus over 100 preset patterns
  across nine musical styles. Creative tools include Loop Edit and Pattern Lab
  modes, MUTE and HAMMER functions, swing and shuffle adjustment, and a unique
  ARP mode for generating new pattern ideas.

  Connectivity includes MIDI in and out, CV and Gate outputs, accent, and
  dynamic sync, making the TT-303 V2 a flexible partner in both modern and
  vintage-style production setups. Non-volatile memory eliminates the need for
  battery backup.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth, square)
  - Filter: 24dB/oct 4-pole low-pass with resonance
  - Envelope: 1 VCA with decay
  - Sequencer: 432 user patterns / 108 preset patterns, up to 64 steps
  - Arpeggiator: 1 ARP mode
  - Memory: Non-volatile (no batteries required)
  - Control: MIDI In/Out, CV Out, Gate Out, Accent, Dyn Sync
