description: 'A 1x12" guitar extension cabinet from Ashdown''s Guitar Magnifier
  range, built in the UK Custom Shop from premium lightweight ply to cut weight
  without cutting tone. It carries a single Celestion G12M-65 Creamback, the
  speaker Ashdown found paired best with the AGM amplifiers such as the AGM-484
  head and the AGM 30-Offset, or as an extension cabinet for a combo. The
  Creamback delivers the familiar woody G12M tone with greater power handling:
  low-end grunt, a warm vocal mid-range, crunchy upper-mids and refined highs.
  The semi-open-back cabinet is rated at 65 watts, 16 ohms, and fitted with
  metal corner protection and a leather handle.'
details: |-
  All AGM cabinets are constructed using premium lightweight ply to cut the weight but not the tone. After extensive testing we found that the Celestion 12" G12M-65 Creamback speaker sounded the best when paired with the AGM amplifiers such as the AGM-484 head and the AGM 30-Offset or when used as an extension cabinet with a combo. The G12M-65 Creamback produces the familiar woody G12M tone, but handles greater power making it ideally suited for today's amps when a vintage tone is desired. The increased power handling brings with it low end grunt complementing the warm and vocal mid range, crunchy upper-mids and sweet, refined highs. Ashdown Guitar Magnifier 1 x 12" Cabinet.
