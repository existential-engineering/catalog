description: The MM8077 is designed to deliver impressive power, exceptional
  home theater amplification, and pristine high-resolution sound reproduction.
details: |-
  The MM8077 is designed to deliver impressive power, exceptional home theater amplification, and pristine high-resolution sound reproduction. This 7-channel amplifier was designed to deliver the essential entertainment experience.

  MM8077 is built to deliver on its promise of high-performance power. Its no-nonsense yet elegant design ensures that every ounce of amplification is available whenever you require it.

  The power supply features a high current toroidal power transformer along with high power (71 WVDC) filter capacitors with a total 100,000 microfarad capacitance to easily handle sharp short-term transient peaks.

  Featuring unique current feedback discrete power amp output stages that are identical for all channels, the MM8077 is equipped with multiple high current discrete power transistors that feature high slew rate and wide operating bandwidth to extract the most detail from high resolution audio formats.

  The Marantz Sound Master meticulously tuned MM8077 for amazing performance with careful parts selection to create the Most Musical Sound in your home.
specs: |-
  - 7 channels, Class A/B, current feedback topology, discrete amplification
  - Power output: 150 W (20 Hz to 20 kHz, 0.08%)
  - S/N ratio: 105 dB
  - frequency response (analog in): 8 Hz to 100 kHz (plus/minus 3 dB)
  - Main amplifier in: balanced and unbalanced, 7 channels, selected by a switch per channel
  - DC triggers: 1 in / 1 out
  - D-Bus remote (RC-5) 1 in / 1 out
  - flasher in: 1
  - Toroidal power transformer
  - copper plated chassis
  - Front panel: aluminium and glass-reinforced resin
  - colour Black
  - Power requirement: AC 120 V, 60 Hz
  - power consumption 800 W (standby 0.4 W)
  - Dimensions (W x H x D): 17.32 x 7.29 x 15.1 in
  - weight: 45.41 lbs
  - 3 year warranty
