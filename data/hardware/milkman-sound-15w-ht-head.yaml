details: |-
  The first of its kind

  ABOUT

  The HT15 is the result of 6 years of careful experimentation to bring the classic "Harmonic Tremolo" circuit into a low power lightweight amplifier. This legendary Fender circuit from the early 1960s was typically found in amplifiers with over 45 watts or bundled into heavy combos with multiple speakers. In addition to swirling tremolo, a tube reverb system adds to the depth and presence of this small amplifier. How is 15 watts different than 20 watts? When you compare the HT15 to the Creamer, you will notice right away a difference in headroom (as well as the sound of the tremolo circuit). This is because the HT15 operates with lower internal voltages than the Creamer. The HT15 was designed to break up more than the Creamer, and to do so in a way that is very fun coupled with the tremolo circuit. The HT15 is the only Milkman amplifier designed with its tremolo circuit ahead of the reverb. With standard tremolo, it is essential that the reverb pulses with the tremolo to add to the overall harmonic and psychoacoustic effect. The HT15 on the other hand sounds best with the harmonic tremolo going through the reverb circuit.

  The HT15 is hand wired onto a turret board with bespoke Soursound transformers and Jupiter capacitors. WATTAGE

  15W Class AB

  EFFECTS

  Tube "harmonic tremolo" and spring reverb
  Includes handwired original design detachable footswitch and 15' cable

  Demo

  HT15 Demo by James Deprato

  James is really good at making demos at this point

