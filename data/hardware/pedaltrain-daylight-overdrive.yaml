name: "Daylight Overdrive"
manufacturer: pedaltrain
primaryCategory: overdrive
categories:
  - pedal
url: https://pedaltrain.com/products/pedaltrain-daylight-overdrive
description: "A symmetrical overdrive pedal with a musical, textural gain sound
  and a lot of headroom, designed and hand-built in Nashville, TN."
details: |-
  Daylight Overdrive ("Daylight") is a symmetrical overdrive, with a musical and textural gain sound. There is a ton of headroom, where glassy notes have space to breathe and come to life. Daylight is pleasantly dynamic, musical, and focused.

  The pedal was designed to work well across a wide range of guitar and amp combinations, then refined over a year of sharing it with session players in Nashville. The controls are simple: Level, Tone, and Drive, each starting at 12:00 as a good baseline. The tone knob sweep stays musical and usable through its entire range, and backing off the guitar's volume pot cleans the pedal up without the sound collapsing at higher gain settings.

  Designed, built, and tested in Nashville, Tennessee, with true bypass switching and Switchcraft jacks.
specs: |-
  - Level: controls the volume of the output
  - Tone: controls the darkness/brightness of the tone
  - Drive: controls the amount of overdrive/distortion
  - True bypass switching
  - Switchcraft jacks
  - 9V DC power only, external power supply required (center-negative barrel, 2.1mm), no battery clip
  - Current draw: less than 10 mA
  - Dimensions (incl. sockets, knobs): 4.92" x 2.62" x 2.23" (125 mm x 66.5 mm x 56.6 mm)
  - Made in the USA
