description: Mandolins inherently produce a sound that is rich in transient
  detail and upper harmonics. When creating the Radius Mandolin Pickup, we knew
  we had to design something fundamentally different to capture that response.
details: |-
  Mandolins inherently produce a sound that is rich in transient detail and upper harmonics. When creating the Radius Mandolin Pickup, we knew we had to design something fundamentally different to capture that response. Our design team focused on reproducing a microphone sound, without any of the problems that come with using a real mic on a loud stage. Instead of a piezo bridge pickup, we developed an accelerometer with a film sensor that is very similar to a mic diaphragm. With opposing neodymium magnets that suspend and dampen the sensor, this capsule allows the sensor to be free-floating to respond to the most subtle vibrations, just like a microphone diaphragm.
specs: |-
  - Hybrid contact-sensor (accelerometer) mandolin pickup
  - Free-floating film sensor suspended by opposing neodymium magnets
  - Passive (no preamp or power required)
  - Mounts to the instrument top with non-permanent adhesive
  - Includes output jack, clamp adjustment tool, adhesive options, and external jack mount
  - For mandolin (not recommended for octave mandolin)
  - Requires professional installation
