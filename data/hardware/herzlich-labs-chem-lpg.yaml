description: A 2hp passive low pass gate module featuring hand-built
  phosphorescent vactrols with UV LEDs for plucked attacks and extended decay
  times.
details: |-
  The LPG that refuses to die. The Chem LPG is your beloved classic, passive low pass gate, but with one very particular change: the vactrol itself is phosphorescent. This stems from an idea I had after an expedition through the rainforest for four days and nights without sleep. My boots were full of brackish mud, and my machete was getting dull, when I happened upon a long abandoned box, there, in the middle of the mangrove. Inside it, I found an enormous, forgotten delivery of 80s glow in the dark wall decorations. From nearby rocks, I fashioned a crude mortar and pestle, which I used to grind them all into powder, which I filled into my packs and canteens. Now, I have forged them into phosphorescent vactrols, with UV LEDs, that offer plucked attacks and very, very long delays. When you activate the vactrol with CV, not only does the LED open the vactrol: it also charges the phosphorescent element, causing it to glow, which in turns keep the vactrol open. The more intensely and frequently you apply CV, the longer it will glow, increasing your decay time. The eyeball frying UV lights and the sensitive shells are delivered to you safely in a dark enclosure. If you choose to install it, be vary that ambient light, or even LEDs inside your case, may also charge the shells and cause them to glow. This LPG will not be easily tamed - but perhaps you are also a cruel master?
specs: |-
  - Two independent LPG units with two different filter cutoffs
  - Hand-built vactrols using UV LEDs and phosphorescent materials
  - High grade component selection and all-analog architecture
  - Low-profile passive design fits anywhere and draws no power
  - Experience the joy of hostile design: one mistake and the decay lasts forever
  - Comes in a darkened enclosure to keep ambient light out
