description: Compact 2x12" angled guitar speaker cabinet from the Studio Vintage range, designed to pair with the SV20H Studio Vintage head or to act as an extension cab for the Studio Vintage combo. Loaded with two Celestion V-Type speakers (16Ω, 70W each, wired in parallel) for 140W total power handling at 8Ω, delivering the plexi-voiced British tone associated with the 1959SLP lineage. Hand-built in the UK with the top speaker angled slightly upwards to improve projection, finished in classic "salt and pepper" fretcloth with black levant covering and gold accents including the script logo. Single 1/4-inch input.
details: |-
  Created to be combined with the Studio Vintage head or to be used as an extension cab for the Studio Vintage combo, the British-built 2x12 Angled Cabinet makes superb use of two Celestion V-Type speakers to drive home that iconic Marshall tone.

  The angled cabinet is inspired by the 1959 and scaled down for the Studio Vintage range, so it keeps the look of a full Marshall stack in a portable, compact form factor.

  Two Celestion V-Type speakers, each rated 16 ohm and 70W and wired in parallel, give the cabinet 140W of power handling at an 8 ohm unit impedance through a single input.

  Designed and engineered in UK. Made in UK.
