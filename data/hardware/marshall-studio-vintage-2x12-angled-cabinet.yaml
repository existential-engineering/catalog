description: Compact 2x12" angled guitar speaker cabinet from the Studio Vintage
  range, designed to pair with the SV20H Studio Vintage head or to act as an
  extension cab for the Studio Vintage combo. Loaded with two Celestion V-Type
  speakers (8Ω, 70W each) for 140W total power handling at 8Ω, delivering the
  plexi-voiced British tone associated with the 1959SLP lineage. Hand-built in
  the UK with the top speaker angled slightly upwards to improve projection,
  finished in classic "salt and pepper" fretcloth with black levant covering and
  gold accents including the script logo. Single 1/4-inch input.
