details: |-
  Erica Synths' all aluminium travel case is slimmer and 25% lighter than regular plywood travel cases. It houses 2x104HP of eurorack modules, and the lid is deep enough to transport a modular system with a patch left ready for performance.

  With the lid on, the case measures 556x280x140mm, which meets the hand luggage requirements of any airline, so it suits gigs around the world. It weighs 4.9 kg without modules and around 7.3 kg with them.

  The depth measurements are 66mm on the left-hand side, 53mm over the PCB, measured from the cable shroud to the rail, and 45 to 50mm over the power bricks on the right side. The depth of the lid is 59mm.

  The case comes with a built in universal PSU that provides 2.5A@+12V, 2.5A@-12V and 0.4A@+5V, fed from a 3.5A universal external supply, plus eurorack distribution boards with 60 module connectors. The leather shoulder strap is not included.
specs: |-
  - Capacity 2x104HP
  - Mass w/o modules 4.9 kg
  - Mass with modules ~7.3 kg
  - Dimensions 550x280x140mm
  - Dimensions with lid 556x280x140mm
  - Depth of a lid 59 mm
  - Depth 53mm over the PCB, from the cable shroud to the rail
  - Depth 45-50mm over the power bricks on the right side
  - 3.5A universal external PSU with built in voltage converters
  - Built in PSU provides 2.5A@+12V, 2.5A@-12V and 0.4A@+5V
  - Eurorack distribution boards with 60 module connectors
  - Meets hand luggage requirements of any airline
