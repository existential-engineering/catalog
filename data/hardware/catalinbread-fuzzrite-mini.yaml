details: |-
  The Fuzzrite Mini is a compact version of the classic American Fuzzrite circuit, developed in collaboration with the estate of Semie Moseley, founder of Mosrite. It recreates the exact circuit of the original 1960s pedal in a mini form factor.

  The Depth control is the heart of the pedal: at minimum it blends in a second transistor gain stage for a clean, fat tone; turning it up introduces voltage-starved, gated tones and pseudo ring mod-style upper octave harmonics, culminating in an aggressive saturated sound at maximum. The Volume control adjusts output level — higher settings can overdrive your amplifier for added body and smoothness.
