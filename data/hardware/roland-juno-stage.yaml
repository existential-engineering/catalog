description: >-
  The Roland Juno-Stage is a 76-key stage performance synthesizer built around the digital
  sound engine from the Juno-G, with double the wave memory at 128MB. It features a
  semi-weighted keyboard, intuitive front-panel controls, and a comprehensive sound
  library including an 88-key stereo multi-sampled piano from the Fantom-X. Designed for
  gigging musicians, it prioritizes immediate sound access and live performance
  functionality over workstation sequencing capabilities.
details: |-
  The Juno-Stage takes the high-quality digital wave-based sound engine from the Juno-G and repackages it into a dedicated stage performance instrument. With 128MB of wave memory, double that of the Juno-G, it offers an extensive sound library covering pianos, organs, synths, and a wide range of keyboard sounds suitable for virtually any live performance scenario.

  Performance-oriented controls include easy-to-grab knobs for instant Master EQ and Reverb adjustment positioned above the pitch bender, along with two assignable switches for rotary organ effects, portamento toggling, and other functions. Quick sound access is facilitated through Favorite buttons and a hands-free patch select system using a foot switch with a dedicated jack.

  A built-in Song Player supports playback of backing tracks directly from USB storage in MP3, WAV, AIFF, and SMF formats, including a Center Cancel feature for karaoke-style applications. The XLR microphone input with phantom power includes reverb and vocoder processing, making it a versatile all-in-one solution for solo performers and bands alike.

  Two open SRX expansion slots allow users to customize the sound set according to their musical needs, further extending the instrument's already broad palette of over 1,000 preset patches.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 16 parts
  - Wave Memory: 128MB (16-bit linear equivalent)
  - Keyboard: 76 keys, velocity sensitive, no aftertouch
  - Preset Patches: 1,027 + 256 GM2
  - User Patches: 256
  - Performances: 64 preset, 64 user
  - Rhythm Sets: 32 + 9 GM2
  - Arpeggiator: 128 preset, 128 user patterns
  - Chord Memory: 64 preset, 64 user
  - Rhythm Patterns: 256 preset, 256 user
  - Multi Effects: 3 systems, 79 types
  - Chorus: 3 types
  - Reverb: 5 types (8 types for microphone input)
  - Song Player: SMF Format-0/1, WAV, AIFF, MP3
  - Expansion Slots: 2x SRX
  - Connections: MIDI In/Out, USB
releaseDate: "2008"
