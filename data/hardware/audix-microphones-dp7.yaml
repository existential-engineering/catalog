details: |-
  The DP7 professional drum microphone pack represents an outstanding combination of seven microphones designed to meet the demands of today's professional drummer, both on the stage and in the studio.

  Included in the DP7 drum microphone package is the D6, AUDIX's flagship kick drum microphone, two – D2 dynamic drum microphones for rack toms, one D4 for floor tom, the i5 for snare, and a pair of ADX51 studio condenser microphones for overhead miking. Also included are four D-Vice rim mount clips for the snare and tom microphones, and three heavy-duty tension fit microphone clips for the other three microphones.

  Everything is conveniently packaged in a foam-lined aluminum road case for safekeeping when the microphones are not in use.
specs: |-
  - Includes: 1x D6, 2x D2, 1x D4, 1x i5 (dynamic), 2x ADX51 studio condenser (overhead)
  - Included mounts: 4x D-Vice rim mounts, 3x tension-fit mic clips
  - Included case: Foam-lined aluminum road case
