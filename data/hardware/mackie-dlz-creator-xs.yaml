description: DLZ Creator XS Compact Adaptive Digital Mixer for Podcasting,
  Streaming and YouTube with User Modes, Mix Agent Technology, Auto Mix, Onyx80
  Mic Preamps.
details: |-
  DLZ Creator XS is a compact adaptive digital mixer for podcasting and streaming that features the same DSP processing power and features as the larger DLZ Creator, in a smaller design.

  Three work modes transform the on-screen controls to fit experience level and needs: Easy, a no-fuss interface for the fastest path to a first podcast, Enhanced, with expanded control over sound and mix, and Pro, which is totally customizable.

  Mix Agent guides the user through setup and sound check, AutoMix manages levels so everyone can be heard even when speaking at the same time, and Mix Minus with a Bluetooth-connected smartphone lets a caller join the mix with no audible echo.

  Onyx80 mic preamps give up to 80 dB of gain. Processing includes a 3-band parametric EQ, noise gate, de-esser, compressor, Atomizer Reverb and Chronotronic Delay, plus voice-changing FX. Customizable pads trigger samples, switch FX on and off and run commands such as fade and duck.

  Recording and streaming go to a computer over USB-C as a 14x4 interface, or straight to MicroSD or a USB flash drive for a self-contained setup. The interface supports nine languages.
specs: |-
  - 7 inch high-resolution full-color touch display with anti-glare coating
  - 2 discrete XLR/TRS combo inputs with Onyx80 mic preamps, up to 80 dB gain
  - Stereo channel with dual 1/4 inch TRS inputs
  - Stereo channel with 1/8 inch TRS connection
  - Stereo bi-directional Bluetooth 5.0 channel
  - 14x4 USB-C audio interface to Mac/PC
  - Sample Rate: 48 kHz
  - A/D/A Bit Depth: 24-bit
  - System Latency: approximately 3 ms
  - Equivalent Noise: -143.4 dBV (A-weighted)
  - Input Impedances: 4 kohm balanced (microphone), 10 kohm balanced (instrument), 5 kohm unbalanced (instrument)
  - Line Output Maximum Level: 14 dBu
  - Headphone Output Power: 30 mW
  - Multitrack recording to MicroSD (12 channels plus main mix, 24-bit / 48 kHz) and to USB-A removable drive
  - Network Connectivity: Ethernet 10/100
  - 4 dynamically color-coded rotary encoders and 5 potentiometers with dynamic LED level indication
  - Backlit mute, solo and nav buttons
  - Power: 18V DC, 1.5A
  - Dimensions: 3.3 in / 83 mm (H) x 10.2 in / 260 mm (W) x 8.0 in / 204 mm (D)
  - Weight: 2.6 lb / 1.2 kg
