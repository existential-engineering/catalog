url: https://mackie.com/en/products/livestreaming-podcasting/dlz/dlz_creator_xs.html
description: "Compact Adaptative Digital Mixer for Podcasting and Streaming.
  Inspired in part by smartphone and DSLR cameras that make great results
  accessible to anyone, DLZ Creator XS transforms the on-screen controls to meet
  your creative style or skill level—without compromising processing power or
  sound quality."
details: |-
  The DLZ Creator XS Compact Adaptative Digital Mixer for Podcasting and Streaming enables you to get the results you want—faster than ever.

  Inspired in part by smartphone and DSLR cameras that make great results accessible to anyone, DLZ Creator XS transforms the on-screen controls to meet your creative style or skill level—without compromising processing power or sound quality.

  DLZ Creator XS features the same DSP processing power and features of the larger DLZ Creator model, now in a compact design that doesn't sacrifice on capability.
specs: |-
  - 7" high-resolution full-color touch display with anti-glare coating
  - 2 discrete XLR/TRS combo inputs
  - Stereo channel with dual 1/4" TRS inputs
  - Stereo channel with 1/8" TRS connection
  - Stereo bi-directional Bluetooth channel
  - 14x4 USB-C audio interface to Mac/PC
  - Record to MicroSD or USB Flash Drive
  - Professional audio processing (3-band parametric EQ, Noise gate, De-Esser, Compressor, Atomizer Reverb, Chronotronic Delay)
  - Fun and interactive voice-changing FX
  - Customizable pads for triggering samples, turning FX on/off, and executing commands
  - Onyx80 mic preamps with up to 80dB gain
  - 4 dynamically color-coded rotary encoders
  - 5 potentiometers with dynamic LED level indication
  - Backlit mute, solo, and nav buttons
  - 2 independent headphone outputs
  - Support for 9 languages
