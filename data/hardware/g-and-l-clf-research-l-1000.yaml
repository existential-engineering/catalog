details: |-
  The new CLF Research L•1000 brings back the best of the iconic passive G&L bass from 1980. Fans of the vintage G&L "wunkay" know.

  It is that rounded, fast shape of the neck combined with the slick feel of an old gloss finish. It is the clean, modern aesthetic of the original CLF and G&L headstock.

  It is the tactile delight of those beautiful CLF Research knobs shimmering from an elegant chrome control plate. And of course, there is the legendary punch of the L•1000's MFD humbucker in OMG mode.

  Now take all that goodness and pack it into the slimmer mid-90s L-Series body shape for added comfort and lower weight, enough to make it through a 3 hour gig with tone and style to spare.

  On the road, the neck is more stable than those beloved vintage wunkays, with a modern dual-action truss rod and twin graphite stiffening rods. Add it all up and it is the best of the vintage CLF vibe with the best of modern G&L elements.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Pickups: G&L Magnetic Field humbucking pickup
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: CLF/G&L 1 5/8" slim C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: 3-position mini toggle for parallel/split/OMG pickup modes, volume, treble, bass
  - Includes: G&L Deluxe Gig Bag
  - Available in: Old School Tobacco over Okoume, Rosewood fingerboard
  - Available in: Natural Gloss over Swamp Ash, Maple fingerboard
  - Available in: Blueburst over Swamp Ash, Maple fingerboard
  - Available in: Rally Red over Alder, Maple fingerboard
  - Available in: Matcha Green over Alder, Rosewood fingerboard
  - Available in: Pharaoh Gold Firemist over Alder, Rosewood fingerboard
  - Available in: Midnight Blue Metallic over Alder, Rosewood fingerboard
  - Available in: Royal Purple Metallic over Alder, Rosewood fingerboard
