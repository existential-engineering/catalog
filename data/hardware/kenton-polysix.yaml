description: A MIDI retrofit kit for the Korg Polysix, adding MIDI In, Out and
  Thru sockets along with MIDI note, program change, pitchbend, mod wheel,
  filter cutoff and volume control, plus sysex program dump and load. Built to
  order and intended for installation by an experienced synth engineer.
details: |-
  A MIDI retrofit kit for the Korg Polysix. After fitting, the synthesiser responds to incoming MIDI on any selectable channel, covering notes in the range of MIDI note numbers 36 to 96 with transposition possible, program changes 1 to 40, pitchbend over a fifth up and down, mod wheel, the cutoff frequency of the low pass filter and volume. Sysex dump and load of programs is also supported.

  The default assignments take pitchbend from pitchbend messages, mod wheel from CC#1 and aftertouch, filter cutoff from CC#16 and volume from MIDI volume (CC#7). Any destination can be remapped to another controller, to aftertouch or to velocity, so velocity can be set to control volume instead.

  Outgoing MIDI covers notes in the same 36 to 96 range on any selectable channel, and program changes 1 to 61 can be sent with a button press followed by a key press. Nothing else is transmitted, the retrofit being aimed primarily at playing the synthesiser from a MIDI master keyboard or sequencer. A push button added by the kit programs the MIDI setup, and setups are held in non-volatile EEPROM memory.

  The kit ships as a circuit board that fits in the base of the Polysix, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions covering changes to the default settings, and step by step fitting instructions with diagrams of the connection points. Every kit is checked and tested before despatch.

  Installation is a skilled job. The kit is not intended for end-user fitting and should be installed by a competent synth service engineer, or fitted at the manufacturer's premises in Tadworth, just outside London. Kits are built to order.
specs: |-
  - Fits the Korg Polysix
  - Incoming MIDI note range: MIDI note numbers 36 to 96, transpose possible
  - Incoming program change numbers 1 to 40
  - Pitchbend range: a fifth up and down
  - Sysex dump and load for programs
  - Default controller map: pitchbend messages, mod wheel CC#1 plus aftertouch, filter cutoff CC#16, volume CC#7
  - Outgoing MIDI: notes 36 to 96 on any channel, plus program changes 1 to 61 by button press and key press
  - Setups stored in non-volatile EEPROM memory
  - Adds a push button for programming the MIDI setup
  - Circuit board fits in the base of the synthesiser
  - Powered from the host synthesiser, no separate power connection
