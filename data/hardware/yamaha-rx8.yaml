description: >-
  The Yamaha RX8 is a digital drum machine released in 1989 as a low-cost alternative to
  the RX5. It was the first Yamaha drum machine to use 16-bit PCM samples, offering 43
  tunable sounds with reverse playback capability. Despite its budget positioning, it
  features internal memory for 99 patterns and 20 songs, MIDI connectivity, and RAM card
  storage expansion.
details: |-
  Yamaha released the RX8 in 1989 intending to offer a low-cost alternative to their RX5. Despite targeting the budget market segment, the machine retained many RX5 capabilities while establishing its own sonic identity through superior 16-bit PCM sampling technology, which was rather impressive for the time.

  The sound palette includes 43 tunable sounds encompassing typical drum kit noises, percussion sounds, bass guitar, marimba, and orchestral stabs, all of which can be played in reverse. Programming uses 16 rounded rectangular pads, twelve assigned to drum sounds, with the remaining four used for adjustments. The pads are not fully velocity-sensitive like those of the Alesis HR-16, though the RX8 can record incoming note velocity data from an external controller.

  Internal memory has space for 99 patterns and 20 songs of up to 999 parts each, with RAM card storage available for songs, pattern, and voice data. The back panel includes MIDI In/Out, a power supply socket, cassette and cartridge storage interfaces, and various audio jacks and outputs. The RX8 can trigger external modules via MIDI and can also be triggered itself.

  The biggest advantage of the RX8 is how easy it is to use, featuring a 2x16 character backlit LCD with menu shortcuts for experienced users. It remains a capable budget drum machine of its era, though it has since been surpassed by more advanced units.
specs: |-
  - 43 tunable 16-bit PCM sounds with reverse playback
  - 100 patterns, 20 named songs (up to 999 parts per song)
  - 16 rounded rectangular pads (12 drum-assigned)
  - 26 thin rectangular buttons
  - Volume and Tempo knobs
  - 2x16 character backlit LCD
  - MIDI In/Out
  - Cassette and cartridge storage interfaces
  - RAM card storage for songs, patterns, and voice data
  - Multiple audio outputs
