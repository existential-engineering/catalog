description: Lightweight true wireless earbuds with 30+ hours of playtime
  including the charging case.
details: |-
  Minor IV's straightforward design lets you focus on what matters most, the music. These earbuds cover all bases so you can dive into Marshall signature sound wherever you go. Packing 30+ hours of wireless playtime with the case means you have more than a day to get lost in your favourite music or podcast. Add the intuitive, water-resistant earbud design to the mix, and you will enjoy every beat in complete comfort.

  Marshall signature sound: these earbuds are acoustically tuned to unleash an expertly balanced sound that commands attention. When you need to take a break from the music, their superior call quality means you can always pick up the phone without any distractions.

  30+ hours of wireless playtime: the earbuds hold up to 7 hours of wireless playtime on their own, and paired with the portable charging case they can power you for 30+ hours in total. Simply slip the earbuds into the case when you want an extra boost.

  Designed for comfort: Minor IV features a re-designed earbud and stem, angled to create a truer fit inside the ear canal, and they are water-resistant so the music does not have to stop when it rains. Mirrored touch-sensitive earbuds let you use either one to control your music and phone calls, and removing or inserting an earbud initiates the auto-pause and play feature.

  Earbuds that last longer: the in-app battery preservation feature lets you reduce how quickly your battery ages, and over-the-air updates keep the earbuds on the latest software. Bluetooth LE Audio-ready technology delivers higher audio quality while increasing streaming range and improving audio sync. Designed and engineered in Sweden. Made in China.
specs: |-
  - Headphone type: In-ear true wireless earbuds
  - Driver type: Dynamic
  - Drivers: 12 mm
  - Driver impedance: 32 Ohm
  - Frequency range: 20 to 20,000 Hz
  - Wireless connectivity: Bluetooth, LE Audio-ready
  - Bluetooth range: 10 m / 30 ft
  - Bluetooth Multipoint connectivity: Yes, connected to two devices at a time and remembers up to 8 paired devices
  - Wired connectivity: No
  - Active noise cancellation: No
  - Microphone and remote: Yes
  - Voice command: No
  - Controls: touch response, mirrored between earbuds, for music, calls, volume, voice assistant and EQ preset
  - Ear detect sensor for auto-pause and play
  - Customise sound: Yes, EQ presets via the Marshall Bluetooth app
  - Weight: 7.39 g / 0.26 oz
  - Water resistance: IPX4 in earbuds
  - Play time: 7 hours in earbuds, 30+ total hours with the case
  - Quick charging: 15 minutes gives 3 hours of playtime
  - Charging time: 1.1 hours to recharge earbuds, 2 hours to recharge case
  - Wireless charging: Yes
  - Battery preservation: Yes, no mains inlet
  - Box contents: Minor IV true wireless headphones, charging case, USB-C charging cable, user manual and legal and safety information
  - Compatible app: Marshall Bluetooth app, with over-the-air software updates
