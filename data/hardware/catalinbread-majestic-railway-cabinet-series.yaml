description: The Majestic Railway recreates the Tone Messer circuit from Grand
  Funk Railroad's Mark Farner's Musicraft Messenger guitar. Part of
  Catalinbread's Cabinet Series, it includes a pickup simulator and guitar-style
  volume and tone knobs placed before the actual fuzz circuit, along with an
  output boost for practical amplifier use.
details: |-
  The Majestic Railway is part of Catalinbread's Cabinet Series, which focuses on recreating historically significant effects circuits. This pedal recreates the Tone Messer circuit built into Grand Funk Railroad's Mark Farner's Musicraft Messenger guitar.

  The Volume knob acts as the fuzz control, emulating how a guitar volume knob would feed into the fuzz circuit of the original instrument. The Tone knob has an expanded range to compensate for the fuzz circuit's bright character. A pickup simulator runs before the fuzz circuit to further replicate the feel of playing the original instrument into the effect. An output boost stage makes the pedal practical for use with amplifiers. Limited Cabinet Series run.
