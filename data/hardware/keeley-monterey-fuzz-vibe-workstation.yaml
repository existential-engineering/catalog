description: "- The 1960s in a box! - Rotary, Vibe, Harmonic Wah - Thick Vintage
  Fuzz, Octave Up/Down"
details: |-
  The Monterey Rotary Fuzz Vibe is a workstation pedal built around neo-vintage 1960s effects: a vintage voiced fuzz, a rotary speaker simulation, a vibe, harmonic and auto wah, octave up and octave down, and an expression input. Two channels can be configured for five different sounds.

  The right footswitch engages the fuzz channel, a classic two-transistor fuzz built around vintage Fairchild Semiconductor transistors, chosen as moderate gain devices that avoid the temperature sensitivity of germanium parts. The modulation channel adds an octave effect to the vibe and wah sounds: turning the Octave control clockwise from centre adds an increasing octave up, counter-clockwise an increasing octave down, and the centre position gives none.

  The Les Rotary setting joins a lower drum and an upper horn into one effect, simulating the cabinet with very short reverberated reflections for a doubling effect and a Doppler effect for a chorused sound. In this setting the Octave control sets the volume of the horn rather than producing an octave. With Rate off and the fuzz engaged, Depth and Octave give a speaker cabinet simulation. The Kool Vibe setting combines phasing and tremolo at key frequencies and models the pulsing of a photocell based effect.

  The Harmonic Wah section covers a fixed or cocked wah, an auto wah driven by pick attack, a harmonic wah voiced like the harmonic tremolo of a brown face amp but centred on wah frequencies, and a conventional foot-controlled wah when an expression pedal is connected to the EXP input. That input also controls the rate of the Les Rotary and Kool Vibe settings. An order switch on the jack side swaps the fuzz and modulation blocks. No expression pedal is included, and the pedal is not battery powered: it requires a standard 9V 100mA negative tip supply.
specs: |-
  - Two channels, configurable for five sounds
  - Two-transistor fuzz using vintage Fairchild Semiconductor transistors
  - Modulation side: Les Rotary speaker simulation, Kool Vibe, Harmonic Wah with auto wah and cocked wah
  - Octave control: octave up, octave down or no octave at centre, and horn volume in the rotary setting
  - Expression pedal input controls rate in the rotary and vibe settings, frequency in the wah setting
  - Order switch swaps the fuzz and modulation blocks
  - Power: standard 9V 100mA negative tip supply, no battery operation
  - No expression pedal included
