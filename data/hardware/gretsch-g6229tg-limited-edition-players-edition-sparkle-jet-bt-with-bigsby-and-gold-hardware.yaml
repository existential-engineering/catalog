details: |-
  For over 65 years the Gretsch Jet has fueled stages and studios, producing some of the greatest sounds in rock 'n' roll history. The all-new G6229TG Limited Edition Players Edition Sparkle Jet BT with Bigsby and Gold Hardware is the culmination of over half a century of tonal and performance magic, delivered in two new head-turning finishes - Champagne Sparkle or Ocean Turquoise Sparkle with black pickguards.

  Chambered mahogany bodies feature a maple top delivering balanced mid-range and acoustically rich tones. Broad'Tron BT65 pickups designed by Tim Shaw provide powerful mids, extended lows and an exceptionally clear, yet smooth high end.

  Players Edition enhancements include lowered neck set for improved mobility, full-access rolled cutaway with tapered heel, no-load master tone with Squeezebox capacitor, master volume with treble bleed, and individual pickup volume controls.
