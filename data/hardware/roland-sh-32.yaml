description: >-
  The Roland SH-32 is a 4-part multitimbral desktop synthesizer module featuring
  Wave Acceleration Synthesis with up to 32 voices of polyphony. It combines
  virtual analog-style synthesis with built-in rhythm patterns, a 32-step
  arpeggiator, and 35 insert effects in a compact tabletop format. Released in
  2001, it served as a more affordable alternative to Roland's JP-8000 and
  JP-8080 analog modeling synthesizers.
details: |-
  The SH-32 represents Roland's accessible entry point into their lineup of analog modeling synthesizers, positioned below the JP-8000 and JP-8080. Despite its modest price, the synth delivers considerable sonic flexibility through 67 waveform variations across 7 categories, with raw waveforms that are sampled rather than mathematically generated and multi-sampled across octave ranges.

  The instrument features aggressive filters with 12dB and 24dB slope options in low-pass, band-pass, high-pass, and peaking modes. Every parameter is accessible on the front panel via knobs and sliders with no hidden menus, though the dense control layout can initially overwhelm new users. Filter cutoff adjustments via the knob exhibit audible stepping, though envelope and LFO modulation eliminates this artifact.

  The SH-32 operates as a standalone sound module or via MIDI keyboard and sequencer control. It includes 64 programmable arpeggiations, 64 drum rhythm patterns with TR-808 and TR-909 sounds, chord memory functionality, 35 insert effects, and 10 reverb/delay variations. This combination of features targets DJs, live performers, and electronic musicians seeking compact groovebox capabilities.
specs: |-
  - Polyphony: 32 voices (16 with both oscillators active)
  - Oscillators: 2 oscillators with sub oscillator, PWM, oscillator sync, ring modulation
  - Waveforms: 67 waveforms across 7 categories for main oscillators; 63 rhythm waveforms
  - Multitimbral: 4 parts (or 3 synth + 1 rhythm)
  - LFO: 2 LFOs with 7 waveforms
  - Filter: Low-pass, band-pass, high-pass, and peaking modes; 12dB or 24dB slope
  - Envelope: 1 ADSR for amplifier
  - Memory: 128 user patches, 128 preset patches, 4 drum sets (including TR-808 and TR-909), 64 performance patches
  - Effects: 35 insert multi-effects, 10 reverb/delay types
  - Arpeggiator: 32-step with 128 patterns (64 arpeggiations, 64 rhythms)
  - Control: MIDI In/Out
  - Keyboard: None (13 preview buttons)
releaseDate: "2001"
