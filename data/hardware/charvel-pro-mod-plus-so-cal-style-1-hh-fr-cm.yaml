description: Take your shredding to the next level with the all-new Pro-Mod Plus
  So-Cal from Charvel. This modernized take on the classic So-Cal shred machine
  packs even more cutting-edge features for lightning-fast playing.
details: |-
  The Pro-Mod Plus So-Cal Style 1 HH FR CM pairs an alder body in a Blue Burst gloss finish with a bolt-on caramelized maple neck featuring graphite reinforcement and a hand-rubbed satin urethane finish with rolled fingerboard edges.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 22 jumbo frets and black dot inlays, anchored by a Floyd Rose 1500 Series locking nut (1.6875" width) and a 25.5" scale length. The neck terminates in a licensed Fender Stratocaster headstock with a 4-bolt recessed-screw neck plate.

  Electronics are an HH configuration with a Seymour Duncan Distortion TB-6 humbucker at the bridge and a Seymour Duncan Distortion SH-6N humbucker at the neck. A 5-position blade switch (Position 1: Bridge, Position 2: Bridge Outer Coil and Neck Inner Coil, Position 3: Bridge and Neck, Position 4: Bridge Inner Coil and Neck Outer Coil, Position 5: Neck) provides coil-split voicings, controlled by master volume and tone knobs.

  Hardware is finished in black throughout, including a Floyd Rose 1500 Series double-locking tremolo with locking tremolo arm, Charvel-branded die-cast tuning machines, a 1-ply black anodized aluminum pickguard, dome-style control knobs, and a black switch tip. Strung with nickel-plated steel .009-.042 strings and shipped with an included Charvel Multi-Fit Gig Bag (p/n 299-1414-006). Also offered in Black (p/n 2966101368).
