description: User Wave variant of the Machinedrum adding RAM-based sample
  playback machines alongside the original synthesis engines.
details: |-
  The Machinedrum SPS-1UW was a groundbreaking digital drum machine that combined extremely flexible drum synthesis methods with a sampling engine. The UW (User Wave) variant added RAM-based sample playback alongside the original five drum synthesis methods.

  The powerful sequencer with parameter locks allowed per-step control of any parameter, enabling complex evolving patterns. The sampling engine expanded the sonic palette beyond the synthesis engines, allowing users to layer and manipulate their own samples.

  This is the MKI hardware revision, using an AC power supply (6 VAC). All Machinedrum variants share the same final firmware, OS 1.63, released May 2016.
specs: |-
  - 5 drum synthesis methods plus User Wave sampling
  - RAM-based sample playback
  - Step sequencer with parameter locks
  - 6 individual audio outputs (A/B balanced, C-F unbalanced)
  - 2 audio inputs
  - Power: 6 VAC, 50/60 Hz, minimum 2.5A
  - Final firmware: OS 1.63 (May 2016)
