description: The Klipsch New York is a portable party speaker featuring dual
  professional-grade 8" woofers with proprietary horn-loaded technology,
  delivering powerful sound with up to 12 hours of battery life. It won the 2025
  TWICE Picks Award and was recognized by Gear Patrol at CES 2025.
details: |-
  The Klipsch New York is part of the Music City Party Speaker series, designed for high-output portable use. It features dual professional-grade 8" woofers paired with Klipsch's proprietary horn-loaded technology and dual custom front ports for deep, powerful bass with an Ultra Bass boost option.

  The speaker offers five customizable RGB light show settings controllable via the Klipsch Connect Plus app, which also provides EQ adjustment, bass and treble control, and echo effect tuning. Built-in DJ sound effects include airhorn, record scratch, and applause buttons.

  The New York is rated IPX4 splash-resistant and built for portability with trolley wheels and carrying handles. It supports Party Link mode to connect multiple Klipsch speakers simultaneously. Battery life reaches 12 hours with lights off and 8 hours with lights on.
