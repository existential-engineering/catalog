description: Handheld recorder with five built-in mics and four different recording modes.
details: |-
  The H2n Handy Recorder is the only portable recording device to come with five built-in microphones and four different recording modes: X/Y, Mid-Side, 2-channel surround and 4-channel surround. Other advanced features include automatic gain control and onboard MS decoding, plus effects like compression, limiting and low cut filtering. You can even use the H2n as a multi-purpose USB microphone.

  Two of the five microphones are arranged as an X/Y pair, while the other three are configured in a Mid-Side pattern. They can be used separately for X/Y or MS stereo recording, or combined to create 2- or 4-channel surround sound. The onboard MS decoder allows you to adjust the relative level of the mic elements, either during recording or afterwards in post-production. As you increase the level of the Side microphones, the perceived stereo width increases as well. The X/Y technique covers a wide area while still capturing sound sources in the centre with clarity and definition.

  Use 2ch mode to create a single stereo file of the combined mics, or 4ch mode to record the signal from the X/Y mics onto one stereo track and the MS mics onto another. The resulting pair of tracks can be routed to separate speakers for an immersive listening experience or blended into a custom stereo track. With firmware v2.0, Spatial Audio mode creates a single four-channel, multi-track WAV file that includes Omni, Left/Right and Forward/Backward tracks, ready to be combined with 360-degree video.

  The Line In is a stereo 1/8-inch mini phone jack that can accept two channels of mic- or line-level signals, and condenser microphones requiring plug-in power (2.5 volts) can be connected to it. An analog-type Mic Gain dial sets input level manually, or one of three Auto Gain presets sets it automatically. The Line Out is a stereo 1/8-inch phone jack with dedicated volume control for headphone monitoring, and a built-in speaker on the back panel gives fast monophonic monitoring with no connections at all. The USB port provides a digital output of the stereo mix and lets the H2n act as a 4-in/2-out audio interface or a USB microphone.

  The Pre-Record function keeps the H2n silently recording in the background, keeping the previous two seconds when you hit RECORD (one second in 4ch surround mode at 96 kHz). Auto-Record starts recording when incoming signal exceeds a Start Level you set and stops when it drops below a Stop Level. The Data Recovery feature automatically repairs corrupted files, which can happen if power is interrupted during recording or if an SD card is removed mid-write.

  Onboard effects include compression and limiting to control fluctuations in level and a low-cut filter to remove pops, wind noise and low frequency rumble. There is also an onboard metronome and a chromatic, guitar and bass tuner, and playback can be looped, its speed varied without pitch change, or its pitch varied without speed change. The H2n requires just 2 AA batteries, giving more than 20 hours of continuous recording on alkalines, or can run from the optional AD-17 AC adapter.
specs: |-
  - Five built-in microphones and four recording modes: Mid-Side stereo, 90-degree X/Y stereo, and both 2-channel and 4-channel surround
  - Analog-type input gain control, with Auto Gain providing three preset recording levels
  - Stereo 1/8-inch Mic/Line In mini phone jack with plug-in power (2.5V)
  - Stereo 1/8-inch Phone/Line Output jack with dedicated volume control
  - Built-in reference speaker for fast monitoring
  - Large 1.8-inch backlit LCD display
  - Records directly to SD and SDHC cards up to 32 GB
  - Supports up to 24-bit/96 kHz audio in BWF-compliant WAV or a variety of MP3 formats
  - Auto-Record and Pre-Record features, WAV to MP3 conversion, internal four-track surround to stereo mixdown
  - Up to 99 marks per recording
  - Built-in effects, including compression/limiting and low-cut filtering, plus onboard MS decoding
  - Normalize and Divide functions, chromatic tuner and metronome
  - Loop playback with user-defined start and stop points
  - Variable playback speed from 50% to 150% for phrase training, and variable pitch without affecting playback speed
  - USB port for data exchange with a computer and use as a USB microphone, 4-in/2-out USB audio interface for PC/Mac, SD card reader function
  - Data recovery function automatically saves data if power fails or the card is removed
  - Mounts directly to tripod or DSLR
  - Runs on 2 AA alkaline or NiMH rechargeable batteries, or the AD-17 USB-to-AC adapter, with over 20 hours of operation on alkalines
  - Recording media: 16 MB to 2 GB SD cards, 4 GB to 32 GB SDHC cards
  - Built-in memory: up to 1 minute in 96 kbps MP3 format (recording overwrites any previous recording in memory)
  - Mic arrangements: 90-degree X/Y stereo, MS stereo with adjustable side mic level
  - Microphone types: directional (X/Y and MS mid mics), bidirectional (MS side mic)
  - Maximum sound pressure input: 120 dB SPL directional, 122 dB SPL bidirectional
  - Stereo uncompressed PCM: 44.1/48/96 kHz at 16/24-bit WAV (BWF)
  - 4ch uncompressed PCM: 44.1/48/96 kHz at 16/24-bit WAV (BWF), two stereo files for each recording
  - Compressed MP3 recording: 44.1/48 kHz at 56 to 320 kbps (not compatible with MS-RAW recording)
  - Compressed MP3 playback: 44.1/48 kHz at 32 to 320 kbps
  - A/D and D/A conversion: 24-bit with 128x oversampling, 32-bit signal processing
  - Recording time on a 2 GB card: 3 hours 8 minutes at 44.1 kHz/16-bit WAV, 34 hours 43 minutes at 128 kbps MP3
  - Low cut: 80 Hz high-pass filter
  - Comp/Limiter: 3 types of compressors and 3 types of limiters
  - Tuner: chromatic, guitar, bass and alternate (A/E/G/D/DADGAD) tunings with automatic string detection
  - Metronome: 40 to 250 BPM, five tones, pre-count
  - Key control: playback pitch adjustable plus or minus 6 semitones (cannot be used with 96 kHz files)
  - Display: 128 x 64 pixel backlit LCD
  - Input gain: 0 to +39 dB
  - Input jack: line/mic stereo mini jack with plug-in power, 2 kohm impedance at input levels of 0 to -39 dBm
  - Output jack: line/headphone stereo mini jack, rated output level -10 dBm into 10 kohm or more
  - Headphones: 20 mW + 20 mW into 32 ohm load
  - Built-in speaker: 400 mW, 8 ohm, mono
  - USB: Mini-B type, card reader operation, USB 2.0 high speed for audio interface operation, USB 1.0 full speed supporting 44.1/48 kHz at 16-bit, USB bus power operation supported
  - Power: two AA batteries or AD-17 USB-to-AC adapter (DC 5V 1A), 20 or more hours of continuous 44.1 kHz/16-bit WAV recording on alkalines
  - Physical features: tripod mounting socket, strap attachment
  - Dimensions: 67.6 (W) x 113.85 (H) x 42.7 (D) mm
  - Weight: 130 g without batteries
