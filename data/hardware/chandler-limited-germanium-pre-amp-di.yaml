details: |-
  The Chandler Limited Germanium Pre Amp/DI is a completely new microphone pre-amplifier design by Wade Goeke that uses classic germanium transistors in an all class A, transformer balanced circuit. The use of germanium devices opens a whole new sound palette not found in any pro audio equipment currently manufactured. These incredibly smooth sounding transistors were the basis of the earliest transistor designs by Neve (1053, 1055, 1057), EMI (TG12345 MKI), Telefunken, and Fairchild.

  The GERMANIUM series runs on +40 volt power, high current, and has a huge +34 dBu output before clipping. The Germanium uses Chandler's new custom wound transformers that combine the best parts of their favorite St Ives and Gardners input and output transformers.

  Features include a Feedback control (0–10 range affecting harmonic character), switchable stepped gain (-5 to +65 dB in 3 dB steps), 15 dB PAD, +48V phantom power, 0/180° phase switch, Thick switch (low boost), LED VU meter with switchable range (-12 to +3 dB / +5 to +20 dB), and a front-panel 1/4-inch DI input (100kΩ).

  All Germanium units require the PSU-1, Chandler Limited power supply (purchased separately).
