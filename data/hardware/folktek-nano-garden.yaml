description: Nano Garden is an acoustic-electronic hybrid instrument combining
  an Alter effects circuit with two contact-mic-equipped stringed panels,
  functioning as a touch synthesizer and an external audio effects processor.
details: |-
  The Nano Garden is temporarily unavailable. It will be available for purchase again in late June. We apologize for the inconvenience. Acoustic Electronic "synthesizer" and external audio effect processor with CV control. Little sister of the Resonant Garden. The Nano Garden is an acoustic-electronic hybrid designed to create anything from beats and oddities to dense sound scapes. From its inception in 2006, the original garden has gone through many changes and refinements: micro garden, luminist garden and illuminist garden and finally this latest and likely final version of what is essentially an expanded micro garden. The Nano Garden essentially utilizes a single Alter circuit with 7 effects selected specifically for this instrument. Each is also equipped with a mic pre-amp, and 2 garden (stringed) panels for generating acoustics. By plucking, rubbing, tapping or even bowing, those micro-acoustic sounds become amplified and effected by the Alter in any number of ways. In essence, the garden is a large microphone designed to pick up vibrations. Aside from the internal mic, the nano can be used to process external signals with any of the internal effects as well. Note that the Nano is only available in gold. MONOLITHIC VS DISCRETE

  A Monolithic version of the Nano garden consists of a single faceplate for the entire instrument. A Discrete version of the Nano garden consists of 3 faceplates, one for the Alter module and two for the sprouts. The discrete version allows for individual sprout and Alter module to be moved around or substituted with other modules. Keep in mind the power and audio distribution system is designed for the configuration shown here, but can easily be hand wired with standard cables (sold separately). The maximum depth for modules in the garden box is 33mm. EFFECTS

  There is a single Alter in the Nano which has seven different DSP effects, selected by touching the copper hexagon. The effect list is different than either Alter 1 or 2 - these are selected specifically for the Nano (this selection is subject to change):

  1 - long delay (capable of near infinite feedback looping
  2 - notated granular delay
  3 - plate reverb
  4 - choral reverb
  5 - palindrome reverse delay - backward/forward repeat
  6 - pitch delay
  7 - time stretch/glitch

  CONTROL

  - Control for the gain of the mic pre-amp or any incoming audio. - Controls for Mix, X, Y and Sift as well as clock. - All effects have a variation of a filter which may change effect to effect. - X and Y control various rates. - Clock control adjusts the rate which controls the DSP which can drastically change the effect. In doing so it does slightly lower the quality of the output signal but the results are fantastic. This clock is not for synchronization. - Mix, X, Y and Sift all have CV control inputs. - Each control level or cv input is visualized on the control panel. ACOUSTICS

  Each sprout panel is equipped with a contact mic. A contact mic is designed to pick up vibration. The mic pre-amp is specifically designed to deal with the frequencies of the contact mic by boosting certain frequencies and dulling others in order to optimize the sound quality. The mic pre-amp has a gain control so the level can be adjusted according to how you intend to play. DESIGN

  The box is constructed with Sapele African hardwood and a white birch bottom panel. It features anodized black aluminum rails for mounting the faceplates. Each sprout of strings is bolted in from the back and held in place with a backing panel under the main board. Each box has unique wood grain patterns. The wood grain shown in the images will appear different for each instrument we ship. INCLUDED

  - Power Supply: 12V positive tip AC Adapter (included) - US - 100-240V ~ 50/60Hz 0.6A
  - Four (4) black 24" (60cm) 3.5mm TS mono patch cables

  SHIPPING, FULFILLMENT & DELIVERY

  We are a small company and strive to fulfill orders as quickly as possible. During busy times, please allow up to several business days for order fulfillment. International Shipments (delivery address outside the U.S.) may be subject to import duties, value added taxes (VAT), and long customs clearance times. Tariff rates vary from country to country. Folktek does not collect VAT on behalf of the customer. Folktek is not responsible for payment of import taxes. Please check with your local customs agency for rates and more information. **Note: There may be tiny scratches or blemishes on the faceplates from the manufacturing process. These scratches are unavoidable.
