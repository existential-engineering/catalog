details: |-
  Legendary professional reference monitor know-how, packed into a pair of compact near field monitors.

  Versatile, powerful and precise – exactly as they should be. A 7in personal reference monitor, designed from the ground-up to bring supreme precision to your mixes.

  This monitor uses sophisticated DSP to extend or curtail low-frequency response by 10Hz, while Position and Sound Balance controls let you fine-tune for total neutrality in your environment. Its larger 7in woofer helps extend bass, while the low-mass aluminium voice-coil, vented ferrite magnet and MSP driver take care of precision.
specs: |-
  - Type: Nearfield Monitor
  - Series: LYD
  - Analog inputs: XLR, RCA
  - Maximum SPL (1m, pair): 109 dB
  - Amplifier power (woofer): 50W
  - Amplifier power (tweeter): 50W
  - AC power input: 100-240V 50/60Hz
  - Max stand-by power consumption: 0.5W
  - Max power consumption: 100W
  - Lower cutoff (Hz @85 dB ±3 dB): 55
  - Upper cutoff (kHz @85 dB ±3 dB): 21
  - Box principle: Rear-loaded bass reflex
  - Crossover: 2-way DSP-based
  - Crossover frequency: 4300 Hz
  - Tweeter: 1.1in soft dome
  - Midrange/Woofer: 7in MSP
  - Weight: 8 kg / 17.6 lbs
  - Width: 186 mm / 7 3/8 inches
  - Depth: 296 mm / 11 5/8 inches
  - Height: 320 mm / 12 5/8 inches
  - Speakers per packaged box: 1
  - Finishes: Black Satin, White Satin
