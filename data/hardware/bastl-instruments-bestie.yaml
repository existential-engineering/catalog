  preamps with overdrive character.
details: |-
  Bestie is a compact 5-channel portable stereo mixer with built-in saturation and distortion, designed for experimental sound work and portable setups. Each channel features a 3.5mm TRS stereo input, an individual mute switch with LED indicator, and up to 20 dB of boost through low-noise preamps with intentional overdrive character.

  Channel 3 is normalized as a self-feedback channel — with nothing plugged in, it routes the output back to the input, allowing the level control to add distortion and gain. At higher settings it self-oscillates and generates deep tones, making Bestie well-suited for no-input mixing techniques. Channels 1 and 5 accept dual 3.5mm jacks for flexible stereo or dual-mono input configurations.

  A dedicated headphone output with loudness control supports 8–250 Ω headphones and can be switched between pre- or post-mute monitoring. Powered via USB-C or 4× AA batteries for portable use. Dimensions: 101 × 69 × 51 mm.
