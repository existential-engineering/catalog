description: A 5-watt Class A single-ended low power guitar amplifier with a
  single 6V6 power tube, tube tremolo, and spring reverb. It includes onboard
  voltage-controlled power scaling and a handwired detachable footswitch with
  15-foot cable.
details: |-
  The Ultimate low power amplifier

  ABOUT

  The Half Pint was designed to be the most versatile low power amplifier possible. Reverb and tremolo and Class A single ended breakup are just the start of what this little amp can do. With the onboard voltage controlled power scaling, you can turn this amp up to 10 and dial it back to just a fraction of a watt so that your fun zone is volume appropriate for just about anywhere. This amp is comfortable on stage, in studio, and at home. Because of the variable power, you can set it how you like and adjust the power level for the room. The power section of this amplifier consists of a single 6V6 power tube biased to class A. The front end is similar to the Creamer, with extended headroom reverb and tremolo. Three speaker options help tailor the Half Pint to your unique style:

  Fane F25 12" is a transparent sounding speaker. Bright, Lively, and efficient. This speaker has a big bottom even at low volume. This speaker has very little breakup and does not color the amp when driven. Jupiter Alnico 12" has a classic American alnico magnet sound. A bit less transparent in the upper midrange, this speaker adds a "woody" tone. Its lively on top, and a bit more focused in the bass response than the Greenback. The speaker starts to break up and add alnico character as the amp is pushed. Its the most efficient of the 3 speaker options. Fane A30 Alnico 12" takes the amp in a different direction. This speaker is very mid forward with little midrange scoop. The top is bright, and the bass response is the tightest out of the three options. This speaker starts to break up when the amp is driven hard. When the amp is overdriven, the A30 is extremely reactive shedding low end and pushing the midrange further into the fun zone. The amplifier is hand wired onto a turret board with bespoke Soursound transformers and Jupiter capacitors

  WATTAGE

  5W Class A

  SPEAKER

  12" 25W Fane F25, 8 ohm

  12" 50W Alnico Jupiter Speaker, 8 ohm

  12" 30W Fane A30, 8ohm

  EFFECTS

  Tube tremolo and spring reverb
  Includes handwired original design detachable footswitch and 15' cable

  DIMENSIONS & WEIGHT

  19-7/8" W x 16" H x 9-1/2" D 28lbs

  Demo

  5W Half Pint Demo by James Deprato

  James and the Half Pint. SOUNDS

  Listen

  Reviews

  Matt Lemay

  New York City

  www.mattlemaysongs.com

  Joel Hamilton was not kidding; this is the best-sounding amp I've ever met. I had been on the fence about whether I needed an amp with reverb and tremolo, but now I couldn't imagine using an amp without them. This is a game changer for me, thanks for doing such incredible work. Richard Lawton

  Terre Haute, IN

  You created a Very Good Thing! I can't imagine using any other amp ever...it crunches at low volume, the reverb and tremolo are transcendent, it can be used at home, for recording, comfortably at small venues, mic'd at larger venues, and it is so kind to my back when I carry it.
