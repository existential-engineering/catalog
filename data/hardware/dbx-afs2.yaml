description: The AFS2 is a stereo Advanced Feedback Suppression processor
  featuring a full LCD display and intuitive Wizard setup function for live
  sound applications. It provides 24 programmable filters per channel with dbx's
  patented AFS technology to automatically detect and eliminate feedback.
details: |-
  The dbx AFS2 is a redesigned feedback suppression processor that builds upon the foundation of the best-selling AFS224. It features an intuitive Wizard function that guides users through room setup, and a completely re-engineered Advanced Feedback Suppression module with a full LCD display for setup and monitoring.

  The AFS2 provides 24 programmable filters per channel with filter Qs as narrow as 1/80 of an octave, allowing surgical elimination of feedback frequencies without audibly affecting the program material. The unit supports stereo or dual independent channel processing, giving users maximum flexibility for both FOH and monitor applications.

  Live and Fixed filter modes provide further control: Live filters automatically lift to make room for new feedback frequencies over time, while Fixed filters remain permanently in place to protect against known problem frequencies. Application-specific filter types optimized for Speech and Music (Low, Medium, High settings) ensure the best possible audio transparency.

  Connectivity includes XLR and TRS inputs and outputs on both channels, with 24-LED per channel filter metering giving a clear visual representation of active filters. The unit operates on 100–120 VAC (EU: 220–240 VAC) and draws only 9W.
specs: |-
  - Inputs: 2 channels; Female XLR and 1/4" TRS
  - Outputs: 2 channels; Male XLR and 1/4" TRS
  - Input Impedance: Balanced 50 kΩ, Unbalanced 25 kΩ
  - Output Impedance: Balanced >120 Ω, Unbalanced >60 Ω
  - Max Input Level: +20 dBu
  - Max Output Level: +20 dBu
  - A/D Conversion: 24-bit at 48 kHz
  - D/A Conversion: 24-bit at 48 kHz
  - A/D Dynamic Range: >113 dB A-weighted
  - D/A Dynamic Range: 112 dB A-weighted
  - Type IV Dynamic Range: >119 dB A-weighted
  - THD+Noise: 0.003% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, ±0.5 dB
  - Crosstalk: >80 dB (input to output)
  - CMRR: >40 dB, typically >55 dB @ 1 kHz
  - Filters per Channel: 24 programmable
  - Power: 100–120 VAC 50/60 Hz (EU: 220–240 VAC)
  - Power Consumption: 9 W
  - Dimensions: 19" W × 5.75" D × 1.75" H
  - Weight: 4.5 lbs (2.04 kg)
