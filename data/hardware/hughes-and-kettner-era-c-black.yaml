details: |-
  The era C is a compact amplifier engineered to capture every tonal nuance of your acoustic instrument. Designed for small venues and intimate home settings alike, it delivers the high-level sonic brilliance the award-winning era series is known for. With four simultaneous inputs and integrated effects, you can easily optimize multiple sound sources to enhance your performance. It's a versatile, intuitive solution that ensures you never have to compromise your sound.

  The era C delivers 60 watts of transparent power through a custom 8" double-membrane speaker, ensuring every nuance of your performance is heard. With four dedicated channels for instruments, microphones, and Bluetooth audio, it serves as a complete sonic hub. Channels 1 and 2 feature independent EQ and a suite of integrated effects, including five reverbs and three delays, allowing for precise tonal shaping. From phantom-powered condenser support to a precision-adjustable notch filter (41-180 Hz) for feedback-free playing, the era C provides the professional DI connectivity and wireless flexibility required by the modern acoustic artist.

  Performance doesn't have to be heavy. Starting at just 6.2 kg, the era C is a lightweight powerhouse that fits into any lifestyle. The classic Black finish complements your living room as naturally as it does the stage. For larger venues, the integrated 35 mm stand mount ensures optimal sound distribution, while the compact footprint makes transport effortless. Whether you're a touring pro or a home enthusiast, the era C combines premium acoustic tone with the ultimate in flexible portability.
specs: |-
  - Channels: 4
  - Power: 60 Watts
  - Multi FX: 8 (Reverb, Delay, Combinations)
  - Speaker: 1 x 8" Double Membrane
  - Cabinet Construction: Closed
  - Stand Flange: Fits 35 mm speaker stands
  - Dimensions: 270 x 285 x 250 mm
  - Weight: 6.2 kg / 13.7 lbs
  - Line Out: XLR, Pre/Post EQ/FX Switchable
  - Effects Loop: Send / Return
  - Footswitch: FS2 Footswitch (optional), 6.3 mm stereo jack (Mute/FX-Mute)
  - Special Features: Bluetooth
