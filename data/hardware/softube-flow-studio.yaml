name: Flow Studio
manufacturer: softube
primaryCategory: control-surface
url: https://www.softube.com/hardware/flow-studio
description: Flow Studio control surface hardware is the ultimate control
  surface for the busy music producer. It lets you get hands-on and go from a
  dry recording to a draft mix in seconds.
details: |-
  Flow Studio is a desktop hardware controller for the Softube Flow Mixing and Mastering Suite plug-ins. It gives hands-on control over macros inside the Flow plug-ins for fast, broad-stroke mixing and producing, and ships with perpetual licenses for 25 included effects plus over 100 Flows, or signal chains, to get going straight away.

  Three operating modes cover different stages of a session. DAW Mode controls levels, pan and sends right out of the box with no mapping required. Flow Mode transforms the sound through macro controls, taking a dry track to finished-sounding in a turn of a knob. Detail Mode goes deeper, adjusting each parameter of individual Softube plug-ins directly from the hardware.

  Five touch-sensitive Analog Feel potentiometers sit under a 4.3-inch high-resolution IPS display, each knob acting as a macro control that adjusts the parameters of several plug-ins at once. A larger Omni Knob at the heart of the unit scrolls through lists and handles common functions such as input gain and output volume. Bright RGB LEDs on the knobs and the nine buttons change color with the screen view.

  The display is sized to carry visualizations rather than just values: EQ curves, gain reduction, reverb tails, mic position and metering. Softube states that Flow Studio and its included software run with the company's lowest latency for in-the-box processing, including live vocal tuning, so recording, monitoring and mixing stay responsive.

  Flow Studio supports 80+ Softube plug-ins and 300+ dedicated Flows, so it grows with a Softube collection, and can be expanded further with a Flow Suites subscription that unlocks up to 145 additional Flows and 65+ plug-ins. It does not integrate directly with the Console 1 Mixing System but is designed to sit alongside it, sharing uniform sizing with Console 1 Channel Mk III and Console 1 Fader Mk III. The casing is anodized aluminum on top with injection-moulded sides and back.
specs: |-
  - 4.3-inch high-resolution IPS screen
  - 5 touch-sensitive high-resolution Analog Feel knobs with RGB LEDs
  - Omni Knob for scrolling lists and controlling sound and volume
  - 9 buttons with RGB LEDs plus a Shift button for a second layer of control
  - Bus-powered and connected over a single USB-C port, no external power supply
  - DAW control of volume, pan, solo/mute, 6 sends and track select with no mapping required
  - Three operating modes: DAW Mode, Flow Mode and Detail Mode
  - Dimensions: 146 mm / 5.75 in wide, 219 mm / 8.66 in deep, 45 mm / 1.77 in high
  - Weight: 0.66 kg / 1.46 lbs (boxed 0.84 kg / 1.85 lbs)
  - Boxed dimensions: 165 mm / 6.50 in wide, 225 mm / 8.86 in deep, 73 mm / 2.87 in high
  - Anodized aluminum top with injection-moulded sides and back
  - M4 threads on the sides for the Single Unit Stand
  - 100 mm M4 threads on the bottom for VESA mounting
  - Kensington lock slot on the right side
  - Includes a 2-meter USB-C to USB-C braided cable and four M4 screws for VESA mounting
  - Includes Flow Studio Suite with 25 Softube plug-ins as perpetual licenses, three activations each, no update fees
  - Includes the Flow Mixing Suite plug-in and 100+ signal chains, no subscription required
  - Supports 80+ Softube plug-ins and 300+ dedicated Flows
  - Users can create, save and share their own Flows
  - Requires macOS Sonoma 14, Sequoia 15 or Tahoe 26, or Windows 10 (64-bit) or Windows 11
  - Requires a Softube account, an iLok account and internet access for installers and license management
  - Flow Mixing Suite plug-in supports VST3, AU (Logic Pro) and AAX (Pro Tools); the VST2 version is not supported with the Flow Studio hardware
  - Compatible DAWs include Pro Tools, Logic, Ableton Live, Cubase, Fender Studio Pro (Studio One), LUNA, Reaper, FL Studio, Nuendo, Bitwig Studio, Digital Performer, Cakewalk and Samplitude
