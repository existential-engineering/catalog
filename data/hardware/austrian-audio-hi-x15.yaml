description: The Hi-X15 delivers clear, honest sound and reliable performance.
  High Excursion drivers ensure tight lows, detailed mids, and crisp highs at
  any volume. Lightweight, foldable, and built for daily use, it combines
  durability with lasting comfort — a true workhorse, ready whenever you are.
details: The Austrian Audio Hi-X15 is a professional closed-back over-ear
  headphone designed in Vienna for daily studio use, rehearsals, and home
  tracking sessions. Features proprietary 44mm High Excursion drivers with an
  advanced ring magnet system and copper-clad aluminum voice coil. Foldable,
  lightweight construction with memory foam ear and bow pads. Detachable 1.4m
  cable with 3.5mm connector.
