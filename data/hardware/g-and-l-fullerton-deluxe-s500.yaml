details: |-
  The Fullerton Deluxe S•500 bundles some of the most time-honored option combinations from the G&L Option Order menu. All FD S•500s feature swamp ash, alder or western sugar pine bodies coated in finishes to showcase their beauty, with ideal pickguard pairings to set off the colors just right. That elegance continues up the neck with the G&L Natural Satin finish neck.

  The G&L S•500 debuted in 1982 as Leo's own evolution of the traditional double-cutaway bolt-on axe, delivering innovations including the Dual-Fulcrum vibrato and Magnetic Field Design single-coil pickups, each designed by Leo Fender himself. These MFD pickups deliver a bright and sparkly top end and robust bottom end, all without losing midrange focus.

  There is plenty of punch in the MFD pickups, but what is surprising is how glassy and detailed they become as the volume and bass controls are rolled back, the latter a part of the S•500's PTB (Passive Treble and Bass) system which functions on all three pickups. The S•500 also includes a mini-toggle Expander Switch to allow neck plus bridge or all three pickups together. In a pinch, the neck plus bridge combo does a convincing faux ASAT Special.

  The S•500 features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm. The S•500's hard-rock maple neck features an easy-playing satin finish, while its 9.5" radius allows notes to be bent deeply and its medium-jumbo nickel frets deliver silky playability.

  Leo's forward-looking spirit is clearly reflected in the S•500, a guitar he designed for players who share that spirit.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L MCNK with 9.5" radius and 1 11/16" nut-width
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), mini-toggle switch enabling additional pickup combinations of neck plus bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
  - Available in: 3-Tone Sunburst over Alder, 3-ply parchment pickguard, Rosewood fingerboard
