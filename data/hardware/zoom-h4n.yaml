details: |-
  The H4n Handy Recorder has long been a favorite of audio and video aficionados everywhere. It offers four tracks of simultaneous recording, a built-in X/Y stereo microphone, and advanced features such as time stamping, phantom power and mid-side (MS) decoding, as well as onboard multi-effects and guitar/bass amp modeling. Rugged, lightweight and versatile, the H4n suits everything from live concert recording to location videography to music-making.

  The built-in X/Y stereo mic is adjustable between 90 and 120 degrees and is backed by onboard MS decoding. Two mic/line/instrument level inputs sit on XLR/TRS combo connectors with +24V or +48V phantom power, and a stereo 1/8-inch Mic/Line In mini phone jack carries 2.5V plug-in power for an external microphone. An output/headphone jack with dedicated volume control and a built-in reference speaker cover monitoring.

  Recording goes to SD and SDHC cards up to 32GB at up to 24-bit/96 kHz in BWF-compliant WAV or a variety of MP3 formats, with auto-record and pre-record, up to 99 marks per recording, flexible overdubbing and punch-in/out, internal mixdown from four tracks to stereo and stereo to dual mono, and normalize and divide functions.

  Onboard effects include compression and limiting, low-cut filtering, modulation, reverb and delay, and amp models, with a chromatic tuner and metronome alongside. Playback offers loop playback with user-defined start and stop points, variable speed from 50% to 150% without affecting pitch, and variable pitch without affecting playback speed.

  The USB port exchanges data with a computer, serves as a 2-in/2-out USB audio interface for PC and Mac, and provides SD card reader function. The recorder mounts to a mic stand or tripod, or directly to a DSLR with an optional hot shoe adapter, and runs on two standard AA alkaline or NiMH rechargeable batteries for over 6 hours, or over 11 hours in Stamina mode, with an AC adapter included.
specs: |-
  - Simultaneous recording tracks: 2 (STEREO mode), 4 (4CH mode), 2 (MTR mode)
  - Simultaneous playback tracks: 2 (STEREO mode), 4 (4CH mode), 4 (MTR mode)
  - WAV record and play: 16/24 bit at 44.1 / 48 / 96 kHz
  - MP3 recording: 48 to 320 kbps and VBR at 44.1 kHz, playback at 44.1 / 48 kHz
  - A/D and D/A conversion: 24 bit x 128 oversampling
  - Recording media: SD card (16MB to 2GB), SDHC card (4GB to 32GB)
  - Recording time on 4GB SDHC: approx. 380 minutes (WAV 44.1 kHz/16 bit stereo), approx. 68 hours (MP3 44.1 kHz/128 kbps stereo)
  - Maximum file size: 2GB, 1000 projects per card
  - Other functions: punch-in/out, bounce, A-B repeat, locate by hours/minutes/seconds/milliseconds
  - Effects: 2 modules, 50 types, 60 patches (STEREO and 4CH modes LO CUT and COMP/LIMITER, MTR mode PRE AMP and EFX)
  - Tuners: chromatic, guitar, bass, open A/D/E/G, DADGAD
  - Metronome: 5 sound sources, 1/4 to 8/4 and 6/8 plus unaccentuated, tempo 40.0 to 250.0 BPM
  - Input 1 and 2: XLR balanced / standard phone unbalanced combo jack, 1 kOhm balanced (pin 2 hot) or 480 kOhm unbalanced
  - Input 1 and 2 level: -10 dBm to -42 dBm balanced, +2 dBm to -32 dBm unbalanced
  - Built-in stereo mic: unidirectional condenser, gain +7 dB to +47 dB
  - External mic input: mini stereo phone jack, 2 kOhm, -7 dBm to -47 dBm
  - Line/phone output: line load impedance 10 kOhm or more, rated output level -10 dBm, phones 20 mW + 20 mW into 32 Ohm
  - Built-in monaural reference speaker: 400 mW, 8 Ohm
  - Phantom power: 48V, 24V, OFF
  - USB: USB 2.0 High Speed, mass storage class and audio interface operation, can run on USB bus power
  - Power: DC 5V 1A from AC adapter (Zoom AD-14), or 2 x IEC R6 (AA) batteries
  - Continuous recording time: 6 hours (STEREO/4CH/MTR mode), 11 hours (STAMINA mode)
  - Display: 128 x 64 dot full-dot backlit LCD, 1.9 inch
  - Dimensions: 73 (W) x 156.3 (D) x 35 (H) mm
  - Weight: 280 g
