description: >-
  The LinnDrum (LM-2) is Linn Electronics' follow-up to the groundbreaking LM-1, featuring 15
  digitally sampled acoustic drum sounds at 35kHz that helped define the sound of 1980s pop and
  electronic music.
details: |-
  Released in 1982, the LinnDrum was essentially an upgraded and more affordable version of the
  original LM-1 Drum Computer. It expanded the sound palette with the addition of crash and ride
  cymbals, bringing the total to 15 sampled drum sounds including bass, snare, rimshot, open and
  closed hi-hats, three toms, cabasa, tambourine, high and low congas, cowbell, and hand claps.

  The built-in sequencer offered both real-time and step-time programming with 96 pulses per quarter
  note resolution, swing quantization, and a digital metronome. Users could store 56 patterns and
  chain them into 49 songs, with 42 additional preset patterns available for quick inspiration.

  One of the LinnDrum's most professional features was its 15 individual audio outputs, one per
  sound, enabling full mixing control in the studio. Each sound also had individual tune, pan, and
  mix controls, along with accent capability on kick, snare, and hi-hat voices. Synchronization
  options included tape sync, clock sync, and external trigger inputs.

  The LinnDrum remained in production until 1985 and became one of the most iconic drum machines of
  the decade, appearing on countless hit records across pop, rock, new wave, and electronic genres.
specs: |-
  - Polyphony: 12 simultaneous voices
  - Sample Rate: 35kHz
  - Drum Sounds: 15 (bass, snare, rimshot, hi-hat, 3 toms, crash, ride, cabasa, tambourine, congas, cowbell, claps)
  - Patterns: 56 user, 42 preset
  - Songs: 49 memory locations
  - Resolution: 96 PPQN
  - Outputs: 15 individual outputs
  - Sync: Tape sync, clock sync, external trigger inputs
  - Individual tune, pan, and mix controls per sound
