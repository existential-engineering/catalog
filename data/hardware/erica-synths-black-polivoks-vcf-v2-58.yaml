description: Authentic sounding emulation of Polivoks VCF.
details: |-
  Erica Synths Black Polivoks VCF is one of the most authentic sounding emulations of the famous Russian synth, the Formanta Radio Factory Polivoks.

  The original Russian K140UD12 ICs sit in the sound circuit. Several updates adapt the filter to contemporary modular synth demands: independently buffered inputs, an extended Cutoff knob, clicks eliminated when switching filter modes, and an output stage added to remove signal inversion. The result is a much punchier bass sound and very smooth controls.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  The filter accepts input levels up to 20Vptp, takes a -10V to +10V CV input, and offers bandpass at 6dB per octave and lowpass at 12dB per octave. It occupies 10HP at a depth of 25mm.
specs: |-
  - Input level up to 20Vptp
  - CV input level -10V to +10V
  - Filter modes BP (6dB/oct) and LP (12dB/oct)
  - Original Russian K140UD12 ICs in the sound circuit
  - Independently buffered inputs
  - Power consumption +11mA, -11mA
  - Module width 10 HP
  - Module depth 25mm
