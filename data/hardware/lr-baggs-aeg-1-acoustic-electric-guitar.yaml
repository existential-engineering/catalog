details: |-
  Touring has always come with a trade-off. Mic your favorite acoustic and fight feedback all night, or plug in and settle for the “quack” that drains your performance of its sonic soul. We don’t believe in compromise. We built the AEG-1 to give you studio-quality sound on stage, without the struggle. After four decades of studying acoustic physics, we decided to stop viewing the guitar and the electronics as separate parts. The Baggs Guitar is the result of treating all the guitar’s elements as one integrated system. This performance-ready guitar delivers the authentic tone of a prized acoustic at any volume, on every stage. The Natural finish shows off the elegant simplicity of the solid Sitka Spruce top, which blends organically with the mid-century-inspired Poplar-ply sides. The African Mahogany neck and slim-C shape give the player both an effortless and solid feel, while the Indian Rosewood back is braced to complement the guitar top for full-body tone.
specs: |-
  - Solid Sitka Spruce top (Natural finish)
  - Poplar-ply sides, braced Indian Rosewood back
  - African Mahogany neck, slim-C shape
  - Scale length 25-5/8" (651mm)
  - Integrated HiFi Duet electronics: dual HiFi pickups plus built-in Silo studio microphone
  - Controls: Volume, Mix, Tone, Phase, Mic Level
  - All-discrete, Class-A FET input preamp
  - Single 9V battery, 160-hour battery life at 4.1mA
