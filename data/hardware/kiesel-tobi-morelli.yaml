description: An artist edition of the Vader Neck-Through, an 8 string headless
  multiscale guitar in a jet black and blood red colour scheme.
details: |-
  This artist edition is specified on the Vader Neck-Through model as an 8 string multiscale instrument, with a Hipshot fixed headless multiscale bridge at .4125 inch (10.5mm) string spacing.

  Body and top are both swamp ash, finished in Jet Black with Kiesel's Raw Tone treatment and carrying a red Kiesel logo. Hardware is black throughout and the guitar ships with Dunlop straplocks.

  The neck is maple with a tung oil finish in Kiesel's thinner neck profile, topped with a Richlite Diamond Black fingerboard at a 20 inch radius, stainless steel jumbo frets measuring .055" x .110" and red acrylic staggered offset dot inlays.

  Electronics pair a Kiesel Guitars Thorium pickup at the bridge with a Kiesel Guitars Empyrean pickup at the neck, both painted blood red with black pole pieces, wired to a three way blade switch and a push/pull coil split volume knob. The tone control is deleted and the volume moved to the tone position.
specs: |-
  - Model: Vader Neck-Through
  - String count: 8
  - Multiscale: yes
  - Bridge: Hipshot fixed headless multiscale bridge, .4125" (10.5mm) spacing
  - Body wood: swamp ash
  - Top wood: swamp ash
  - Finish: Jet Black, Raw Tone
  - Neck wood: maple, tung oil finish
  - Neck profile: thinner neck profile
  - Logo: red Kiesel logo
  - Fingerboard wood: Richlite Diamond Black
  - Fingerboard radius: 20"
  - Frets: stainless steel jumbo, .055" x .110"
  - Inlays: red acrylic staggered offset dots
  - Hardware colour: black
  - Bridge pickup: Kiesel Guitars Thorium
  - Neck pickup: Kiesel Guitars Empyrean
  - Pickup colour: painted blood red with black pole pieces
  - Electronics: three way blade switch, push/pull coil split volume knob
  - Controls: tone deleted, volume moved to the tone position
  - Strap buttons: Dunlop straplocks
  - Passive pickups, so the guitar needs no battery and carries no power input
