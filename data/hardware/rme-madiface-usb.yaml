description: 128-channel mobile MADI USB 2.0 audio interface providing dual MADI
  I/O (optical and coaxial), word clock input, AES input over BNC, and
  bus-powered operation with TotalMix FX integration.
details: |-
  The RME MADIface USB is a compact, bus-powered USB 2.0 MADI audio interface that delivers up to 128 channels of input and output to a host computer when both MADI ports are active. It is positioned as a fully mobile MADI front-end suitable for recording, mixing, format-conversion, signal repeating, and routing within MADI-based infrastructures, without requiring any external power supply.

  Each of the two MADI ports provides 64 channels per direction at 1FS sample rates (44.1/48 kHz). MADI is delivered simultaneously over optical (fiber) and coaxial (BNC) connectors, and the device supports the full MADI sample-rate range up to 192 kHz with corresponding channel reductions, including 96k Frame compatibility and variable Sync/DDS operation.

  The interface integrates RME's 2048-channel TotalMix FX mixer with 48-bit internal resolution, providing latency-free submixes, complete routing, and ASIO Direct Monitoring. Dedicated operating modes include 64-channel and 128-channel mixes, a seamless Redundancy Mode that fails over between the two MADI inputs, a straight routing mode that bypasses the mixer, and full stand-alone format-converter / repeater operation.

  Additional I/O includes a Word Clock input on BNC, an AES input over BNC, MIDI over MADI via virtual MIDI ports, and an ARC USB connector for the optional Advanced Remote Control. SteadyClock keeps internal jitter under 1 ns and the PLL continues to operate cleanly with up to 100 ns of input jitter. The unit is bus-powered, ships with TotalMix FX, DIGICheck and the full RME USB driver stack for macOS and Windows.
specs: |-
  - 128-channel mobile MADI USB 2.0 audio interface
  - USB 2.0, bus-powered (no external power supply required)
  - 2 x MADI I/O, optical and coaxial (BNC)
  - 64 channels for recording and playback per MADI port
  - Up to 128 channels input and output when both MADI I/Os operate simultaneously
  - 1 x Word Clock In (BNC)
  - 1 x AES In over BNC
  - 1 x MIDI input and output via virtual MIDI port (MIDI over MADI)
  - 1 x ARC USB connector for Advanced Remote Control
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz, variable (Sync/DDS)
  - 96k Frame compatible
  - Internal jitter and at all inputs: < 1 ns
  - PLL operates even at 100 ns jitter
  - 2048-channel TotalMix FX mixer with 48-bit internal resolution
  - Latency-free submixes and ASIO Direct Monitoring
  - Operating modes: 64-Channel Mix, 128-Channel Mix, Redundancy Mode, Straight routing (TotalMix disabled)
  - Stand-alone operation as MADI format converter / repeater
  - Seamless Redundancy Operation between both MADI inputs
  - Includes TotalMix FX, DIGICheck and RME USB drivers
