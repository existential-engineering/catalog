description: A passive remote footswitch accessory that connects to Red
  Remote-equipped JHS pedals via a standard 1/4" cable to remotely toggle the
  onboard gain switch.
details: |-
  Use the Red Remote with select JHS Pedals to remotely activate the on-board toggle found on the pedal itself. By connecting the Red Remote to a Red Remote equipped pedal with any 1/4" instrument cable, this essentially acts as an on-the-fly switcher to give you more tonal options in any setting. The Red Remote is currently compatible with the following JHS Pedals: Morning Glory V4, SuperBolt V2, Twin Twelve V2, Double Barrel V4, Kilt V2, Switchback. When using the Red Remote, the remote itself will act as the toggle, therefore disabling the pedal's onboard toggle switch. To use the Red Remote, plug the remote into the jack of the pedal labeled 'REMOTE...' — this jack will have a red washer to denote it is the appropriate jack to plug the Red Remote into.
