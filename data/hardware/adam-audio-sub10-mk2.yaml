description: The Sub10 MK2 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 25 Hz.
details: |-
  The Sub10 MK2 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 25Hz.

  A sturdy special woofer with extended cone travel and a heavy-duty coil have been optimized for accurate reproduction from a bass reflex enclosure. The down-firing bass reflex tube avoids intrusive ventilation noise because of its generous size and shape. The PWM amplifier produces over 90% efficiency and can handle critical passages without overheating for long periods of time. An additional output allows you to cascade as many subwoofers as needed.

  The Sub10 MK2 subwoofer provides a precise combination of low cutoff frequency (-3 dB at 25Hz) and an undistorted high sound pressure level (113dB at 1m).

  On the rear side of the speaker you can find balanced (XLR) and unbalanced (RCA) connectors. The LEFT and RIGHT INPUT jacks take the line-level signal from an audio interface or mixer, while the LEFT and RIGHT SATELLITE OUT jacks feed the main powered speakers or the amps driving them. The balanced SUB OUT mirrors the input signal so that any number of Sub10 units can be daisy-chained, with the Sub Level control affecting the output so every sub in the chain can be levelled at once.

  Rear panel controls cover Mode (Signal On, where the woofer starts as soon as a musical signal arrives and stops after 15 minutes without one, or Continuous), Subwoofer Phase (0 or 180 degrees relative to the satellites), Satellite Filter, Sub Level and Sub Filter. Two LEDs on the front indicate operating and standby mode, with the lower LED flashing red when the protective circuit engages on overload.
specs: |-
  - 10" (260 mm) subwoofer with coated paper cone and 2" (50 mm) voice coil
  - Down-firing bass reflex tube
  - 1 built-in PWM amplifier
  - Amp. power RMS / music: 200 W / 300 W
  - Frequency response: 25 Hz - 150 Hz
  - THD > 60 Hz: <= 1 %
  - Max. peak SPL at 1 m: >= 113 dB
  - Crossover frequencies: 50 - 150 Hz
  - Audio input connectors: XLR (balanced) / RCA (unbalanced)
  - Input impedance: 10 kOhm
  - Panel: rear
  - Weight: 21 kg (46.3 lb)
  - Height x Width x Depth: 560 x 300 x 400 mm (22" x 12" x 15.5")
  - Mains: 100-240 V, 50/60 Hz, 300 W
  - Operating temperature: 0 C to 40 C (32 F to 104 F)
  - Storage temperature: -30 C to 70 C (-22 F to 167 F)
  - Humidity: max. 90 %, not condensing
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
  - Delivery contents: power cord, manual
