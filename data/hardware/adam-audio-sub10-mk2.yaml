  Hz.
details: |-
  The Sub10 MK2 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 25 Hz.

  A sturdy special woofer with extended cone travel and a heavy-duty coil have been optimized for accurate reproduction from a bass reflex enclosure. The down-firing bass reflex tube avoids intrusive ventilation noise because of its generous size and shape.

  The PWM amplifier produces over 90% efficiency and can handle critical passages without overheating for long periods of time. An additional output allows you to cascade as many subwoofers as needed.

  The Sub10 MK2 delivers a precise combination of a low cutoff frequency (-3 dB at 25 Hz) and undistorted high sound pressure level (113 dB at 1 m), making it an ideal companion for extending the low end of compact and midfield monitoring rigs.
specs: |-
  - 10" Subwoofer (paper cone)
  - Amp. Power RMS / Music: 200 W / 300 W
  - Amplifier Type: PWM
  - Frequency Response: 25 Hz – 150 Hz
  - Max. peak SPL at 1 m: ≥113 dB
  - THD > 60 Hz: ≤1 %
  - Crossover Frequencies: 50 – 150 Hz
  - Basket Diameter: 10"
  - Voice Coil Diameter: 2" (50 mm)
  - Cone Material: Paper
  - Analog Inputs: XLR / RCA
  - Input Impedance: 10 kOhm
  - Panel: Rear
  - Weight: 46.3 lb (21 kg)
  - Height x Width x Depth: 22" (560 mm) x 12" (300 mm) x 15.5" (400 mm)
  - Delivery Contents: Power cord, manual
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
