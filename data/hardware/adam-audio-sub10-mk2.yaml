description: The Sub10 MK2 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 25 Hz.
details: |-
  The Sub10 MK2 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 25Hz. ADAM Audio positions it as an ideal match for its own AX- and SX-Series monitors.

  A sturdy special woofer with extended cone travel and a heavy-duty coil have been optimized for accurate reproduction from a bass reflex enclosure. The down-firing bass reflex tube avoids intrusive ventilation noise because of its generous size and shape.

  The PWM amplifier produces over 90% efficiency and can handle critical passages without overheating for long periods of time. An additional output allows you to cascade as many subwoofers as needed: the Sub Out mirrors the input signal so several Sub10 units can be daisy-chained, with the Sub Level control affecting the output so every subwoofer in the chain can be levelled at once.

  On the rear side are balanced (XLR) and unbalanced (RCA) connectors. The left and right line-level inputs accept the signal source, while the LEFT and RIGHT SATELLITE OUT jacks feed the main powered speakers or the amplifiers driving them. Satellites can be run full range or through an 85 Hz high pass, as recommended by Dolby laboratories for surround setups.

  Rear-panel controls cover Mode (Signal On, which wakes the unit when a musical signal arrives and stops after 15 minutes without one, or Continuous), a subwoofer phase switch for 0 or 180 degrees relative to the satellites, the satellite filter, Sub Level (input sensitivity from -60 dB to +6 dB, relative to 775 mV on the balanced XLR input or 250 mV on the unbalanced RCA input) and Sub Filter, a variable upper frequency limit between 50 and 150 Hz with an 85 Hz marker. Two front-panel LEDs indicate operating and standby mode, and the lower LED flashes red when the protection circuit engages on overload.
specs: |-
  - 10" (260 mm) subwoofer driver, coated paper cone
  - Voice coil diameter: 2" (50 mm)
  - Amplifier type: PWM
  - Amp. power RMS / Music: 200 W / 300 W
  - Built-in amplifiers: 1
  - Frequency response: 25 Hz - 150 Hz
  - THD > 60 Hz: <= 1%
  - Max. peak SPL at 1 m: >= 113 dB
  - Crossover frequencies: 50 - 150 Hz
  - Inputs: XLR / RCA
  - Input impedance: 10 kOhm
  - Panel: Rear
  - Height x Width x Depth: 22" (560 mm) x 12" (300 mm) x 15.5" (400 mm)
  - Weight: 46.3 lb (21 kg)
  - Operating temperature: 0 C to 40 C (32 F to 104 F)
  - Storage temperature: -30 C to 70 C (-22 F to 167 F)
  - Humidity: max. 90%, not condensing
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: power cord, manual
