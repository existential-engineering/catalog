description: >-
  The Action Filter AF-1 from Vermona is a dual analog stereo filter designed for live use
  by DJs and musicians. It features two 24dB/oct high/lowpass filters per channel with
  BAND and NOTCH operating modes, offering hands-on control of filter frequency,
  resonance, and bandwidth. Built-in phono RCA and line-level inputs make it easy to
  integrate with DJ setups and various audio sources.
details: |-
  The Action Filter is based on Vermona's DAF-1 filter but represents a more compact, simplified version tailored for live performance. It operates in two distinct modes: BAND mode, where Filter 1 functions as a highpass filter and Filter 2 as a lowpass filter, and NOTCH mode, which inverts this configuration.

  The device features adjustable controls for filter frequencies, resonance amounts, bandpass width, and band-stop range. A bypass button allows users to quickly toggle the effect on and off, making it practical for real-time performance.

  Connectivity includes built-in phono RCA and ground jacks for turntable integration, along with additional line-level inputs for CD players, cassette decks, and DAT devices. While priced similarly to the larger DAF-1, the Action Filter omits the SERIAL and PARALLEL operating modes, focusing instead on essential filtering functions for live use.
specs: |-
  - Dual analog stereo filter
  - 2 filters per channel (4 filters total)
  - 24dB/octave filter slope (high/lowpass)
  - BAND and NOTCH operating modes
  - Controls for filter frequency, resonance, and bandwidth
  - Phono RCA inputs with ground jack
  - Line-level inputs
  - Bypass button
