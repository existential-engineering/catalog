description: A 2hp Eurorack module containing four passive gate to trigger
  converters, each generating a 2ms trigger from the leading edge of a gate
  input, sharing a single input.
details: |-
  It's a passive gate to trigger converter, but there's FOUR of them! Holy SMOKES that's a LOT of gate to trigger conversion in JUST 2hp! At the time of writing, NO OTHER COMPANY DARES DO THIS. They say it's TOO DANGEROUS, but NOT for the wunderkind scientists at Herzlich, who are unafraid to challenge the status quo. Get not one, not two, not three but FOUR gate to trigger converters to keep your gates in check and generate trigger patterns from mostly any gatelike, squarewavey or just impressively loud signal. But wait, there's more - the inputs are normalled to each other, so plug in one signal, and all the following trigger outputs will generate a trigger. Four triggers in one! That's incredible value! Generates a 2ms trigger from the leading edge of a gate input. No questions asked, no power required. Best of all? It's in black and gold. No one will ever know that it was cheap, on top of everything else.
