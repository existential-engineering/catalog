description: DPA gooseneck microphones have quickly become a very popular choice
  for podium mics and conference room usage as either tabletop or ceiling mount.
details: |-
  The 4098 gooseneck microphone, in any of its configurations, delivers high intelligibility and controlled directionality as well as efficient rejection of background noise and radio frequency interference. They are often the preferred mic to turn to when high speech intelligibility is paramount - for example at parliaments where multiple languages are to be simultaneous interpreted and the interpreters must catch every word and nuance in a split second to deliver the perfect translation.
specs: |-
  - Directional pattern: Supercardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB, at 20 cm (7.9 in): MicroDot: 80 Hz - 15 kHz with 3 dB soft boost at 8-15 kHz; XLR-3M: 100 Hz - 15 kHz with 3 dB soft boost at 8-15 kHz and permanent 2nd order low-cut filter at 80 Hz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 16 mV/Pa; -36 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 23 dB(A) re. 20 µPa (max. 26 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 35 dB (max. 38 dB)
  - Distortion, THD < 1%: 130 dB SPL RMS, 133 dB SPL peak
  - Dynamic range: Typ. 110 dB
  - Max. SPL, THD 10%: 135 dB SPL peak
  - Rated output impedance: From MicroDot: 30 - 40 Ω. From XLR connector or DAD9001-BC XLR Adapter: 100 Ω
  - Cable drive capability: MicroDot: Up to 300 m (984 ft) with DAD9001-BC XLR Adapter; XLR-3M: Up to 100 m (328 ft)
  - Output balance principle: Signal balanced with XLR connector or DAD6001-BC XLR Adapter
  - Common mode rejection ratio (CMRR): > 60 dB from 50 Hz to 15 kHz with DAD6001-BC XLR Adapter
  - Power supply (for full performance): MicroDot: Min. 5 V to max. 10 V through DPA adapter for wireless systems or P48 (Phantom Power) with DAD6001-BC XLR adapter; XLR-3M: P48 (Phantom Power)
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001-BC XLR Adapter
  - Connector: MicroDot or XLR-3M
  - Microphone diameter: 5.7 mm (0.22 in)
  - Microphone length: MicroDot: 16 cm (6 in), 28 cm (11 in), 43 cm (17 in), 77 cm (30 in), 122 cm (48 in); XLR-3M: 20 cm (8 in), 32 cm (13 in), 47 cm (18 in), 77 cm (30 in), 122 cm (48 in)
  - Weight (MicroDot): 16 cm: 12 g (0.4 oz); 28 cm: 20 g (0.7 oz); 43 cm: 28 g (1.0 oz); 77 cm: 55 g (1.9 oz); 122 cm: 67 g (2.4 oz)
  - Weight (XLR-3M): 20 cm: 75 g (2.6 oz); 32 cm: 80 g (2.8 oz); 47 cm: 88 g (3.1 oz); 77 cm: 115 g (4.1 oz); 122 cm: 127 g (4.5 oz)
  - Polarity: +V at MicroDot pin for positive sound pressure (and pin 2 on XLR connector or DAD9001-BC XLR adapter)
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black, White
