description: Handcrafted in the UK Custom Shop for Black Sabbath's Geezer
  Butler, the Head of Doom is a 600-watt bass head delivering signature Ashdown
  tone with crushing power and versatility. Built on the flagship ABM platform,
  it features a 9-band EQ, a Sub-Harmonic generator and the unique Doom control
  that drives a 12AX7 preamp stage for rich harmonic distortion. Dual inputs
  handle passive and active basses, twin illuminated VU meters monitor input and
  output, and full pro connectivity includes a balanced DI, FX loop, line
  in/out, tuner output and dual Jack/Speakon speaker outputs. UK-built to order.
details: |-
  UK Custom Shop bass head built for Geezer Butler on the flagship ABM platform. 600 watts. 9-band EQ with a Shape control, Sub-Harmonic generator, and a signature Doom control that pushes extra current through the 12AX7 preamp valve for harmonic distortion. Dual instrument inputs (high/low impedance) for passive and active basses. Twin illuminated VU meters monitor input and output simultaneously (an Ashdown first). Footswitchable EQ settings. Full pro connectivity: balanced DI output, FX send/return, line input, tuner output and 2 x Jack/Speakon speaker outputs. Frequency response -3 dB @ 17 Hz - 30 kHz. Minimum impedance 4 Ohms. Dimensions 434 x 280 x 140 mm. Weight 10.5 kg. All UK-built products made to order (approx. 20-day lead time).
specs: |-
  - Power output: 600 watts
  - Platform: flagship ABM
  - 9-band graphic EQ with Shape control
  - Sub-Harmonic generator
  - Doom control driving a 12AX7 preamp valve
  - Twin illuminated VU meters (input and output)
  - Dual instrument inputs (high/low impedance) for passive/active basses
  - Balanced DI output
  - FX send/return loop
  - Line input
  - Tuner output
  - 2 x Jack/Speakon speaker outputs
  - Frequency response: -3 dB @ 17 Hz - 30 kHz
  - Minimum impedance: 4 Ohms
  - Dimensions: 434 x 280 x 140 mm
  - Weight: 10.5 kg
