description: The dbx DriveRack 220i is a fixed-installation system processor
  combining Advanced Feedback Suppression, graphic and parametric EQ,
  compressor, limiter, noise gate, de-esser, ducker, and 1.3 seconds of delay in
  a 1U format. It features 2×2 matrix mixing, switchable mic/line inputs, RS-232
  PC control via DriveWare software, and wall panel control support.
details: |-
  Designed from the ground up to provide state-of-the-art signal processing, the dbx DriveRack 220i is the perfect tool for any fixed-install application. It integrates a comprehensive set of processing modules — including Advanced Feedback Suppression, graphic and parametric EQ, compressor, limiter, auto gain control, noise gate, de-esser, ducker, bandpass filters, and 2×2 matrix mixing — into a single 1U rack unit.

  The 220i accepts two switchable line/mic inputs via XLR and Euroblock connectors, with mic preamp gain from 30–60 dB, phantom power, and EIN better than -110 dB. Both inputs and outputs are available on XLR and Euroblock connectors, supporting installation in permanent racks or custom panels. Processing modules can be linked between channels for stereo operation or processed independently.

  Control is via DriveWare GUI software over RS-232, and compatible wall-mounted Zone Controllers provide convenient front-of-room access. A security lockout prevents unauthorized parameter changes. Up to 1.3 seconds of delay supports complex installed sound scenarios. The dbx Type IV conversion system delivers dynamic range exceeding 119 dB A-weighted.
specs: |-
  - Inputs: 2 switchable line/mic; Female XLR and Euroblock
  - Input Impedance: >50 kΩ
  - Max Input Level: +20 dBu
  - CMRR: >40 dB (typically >55 dB @ 1 kHz)
  - Mic Preamp Gain: 30–60 dB
  - Mic EIN: <-110 dB (22 Hz–22 kHz, 150 Ω)
  - Phantom Power: +15 VDC
  - Outputs: 2 total; Male XLR and Euroblock
  - Output Impedance: 120 Ω balanced, 60 Ω unbalanced
  - Max Output Level: +20 dBu
  - A/D Converter: dbx Type IV Conversion System
  - A/D Dynamic Range: >113 dB A-weighted (line); >110 dB unweighted
  - Type IV Dynamic Range: >119 dB A-weighted; >117 dB unweighted
  - Sample Rate: 48 kHz
  - D/A Dynamic Range: 112 dB A-weighted; 109 dB unweighted
  - THD+Noise: 0.003% typical (+4 dBu, 1 kHz, 0 dB gain)
  - Frequency Response: 20 Hz – 20 kHz, ±0.5 dB
  - Delay: Up to 1.3 seconds
  - Dimensions: 19" W × 1.75" H × 7.7" D
  - Operating Voltage: 100/120/230 VAC, 50/60 Hz
