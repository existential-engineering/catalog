details: |-
  The LNDM MIDI Line Driver for Balanced XLR extends MIDI beyond its 15 metre (50 feet) specification using audio cable terminated with 3 pin XLR connectors.

  LNDM works as a pair that allows MIDI to be sent accurately in both directions at the same time, across distances of up to 300 metres (1000 feet) using a standard audio cable terminated by 3 pin XLR connectors, which is twenty times the distance achievable using standard MIDI cables. The range could be increased to up to 1000 metres (3280 feet) by using low-capacitance data cable. Each unit is sold singly, so two are needed for a working link.

  The use of balanced line drivers gives a high degree of immunity to noise, which results in a very high degree of signal integrity, and in plain language a very reliable MIDI link over much greater distances than can be achieved with ordinary MIDI connections.

  Each unit carries an XLR female LINE IN socket, an XLR male LINE OUT socket, and two 5 pin DIN sockets for MIDI IN and MIDI OUT. Two LEDs indicate power and MIDI IN and MIDI OUT activity. Each unit measures 130 x 54 x 43mm and weighs 96g excluding its power supply.

  The unit is mains powered from the included 9V regulated multi-region power supply, which is suitable for use in the UK, EU, US and Canada, and Australia and New Zealand. A user manual is included. XLR cables are not included, since the length required varies by installation.
specs: |-
  - Power: 9V DC via a 2.1mm centre-positive jack socket, power supply included
  - Current draw: to be confirmed
  - Connectors per unit: 1 x XLR female socket (LINE IN)
  - Connectors per unit: 1 x XLR male socket (LINE OUT)
  - Connectors per unit: 2 x 5 pin DIN (MIDI IN, MIDI OUT)
  - Range: 300 metres using audio XLR cable
  - Range: up to 1000 metres using high quality, low capacitance data cable
  - Extends MIDI beyond its 15 metre (50 feet) specification, twenty times the distance of standard MIDI cables
  - Bidirectional: MIDI is sent in both directions at the same time across a pair of units
  - 2 LEDs indicate power and MIDI IN and MIDI OUT activity
  - Dimensions: 130 x 54 x 43mm per unit
  - Weight: 96g per unit, excluding power supply
  - Supplied with a user manual and a 9V regulated multi-region power supply for UK, EU, US/Canada and AUS/NZ
  - Sold singly, two units are required for a working link
  - XLR cables are not included
