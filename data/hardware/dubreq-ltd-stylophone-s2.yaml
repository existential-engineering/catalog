description: >-
  The Dubreq Stylophone S2 is a compact all-analog monophonic synthesizer that
  dramatically expands on the classic Stylophone formula with a proper
  state-variable filter, LFO, sub-oscillators, and CV input capabilities.
details: |-
  The original Stylophone launched in 1968 and enjoyed commercial success
  before being discontinued in 1975. It returned in 2007 as the S1, and the
  S2 represents a significant evolution of the concept, transforming the
  novelty instrument into a genuine analog synthesizer.

  The S2 features a 37-note three-octave keyboard playable by either the
  traditional stylus or fingertips, housed in a sturdy metal casing with a
  matte black finish. A brushed aluminum disc with blue LED illumination
  serves as the speaker port, giving the unit a distinctive modern aesthetic
  at roughly 30cm long and 2.5cm high.

  Under the hood, the S2 packs a fully analog signal path with a square wave
  oscillator, sub-oscillators for bass reinforcement, and a classic British
  12dB/octave state-variable filter with resonance control. An LFO with
  triangle waveform and an impressive 14-octave range provides modulation
  possibilities well beyond what the compact form factor might suggest.

  CV and trigger inputs allow external keyboards or sequencers to control the
  S2, while an external audio input enables processing of other sound sources
  through its filter. The unit runs on either an AC adapter or four AA
  batteries, making it truly portable.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 (square wave) with sub-oscillators
  - Filter: 12dB/oct state-variable with resonance
  - LFO: 1 (triangle waveform, 14-octave range)
  - Keyboard: 37 keys with +/-2 octave shift
  - Signal path: All-analog
  - Connections: Headphone out, line out, external input, trigger in, CV in
  - Power: AC adapter or 4x AA batteries
releaseDate: "2009"
