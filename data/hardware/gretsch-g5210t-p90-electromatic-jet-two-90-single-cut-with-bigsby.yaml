details: |-
  No nonsense, Electromatic Jet models are the perfect real, pure and powerful Gretsch instruments — bold, dynamic and articulate, and crafted with essential Gretsch sound, style and playability.

  The chambered mahogany body with maple top delivers a strong sonic profile and exceptional acoustic balance, while the all-new P-90E single-coil pickups produce a wide, balanced, and transparent tone.

  A Bigsby B50 vibrato tailpiece adds expressive shimmer and a touch of vintage Gretsch attitude, rounding out a solid-body Jet built for working players.
