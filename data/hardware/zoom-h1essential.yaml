description: With the push of a button the H1essential captures perfect audio
  for musicians, podcasters, filmmakers, and content creators. Simply hit record
  and discover the power of 32-bit float.
details: |-
  With the push of a button the H1essential captures perfect audio for musicians, podcasters, filmmakers, and content creators. With 32-bit float recording, you never have to adjust levels. The H1essential captures every nuance of your sound ensuring high-quality audio with every take.

  The Essential Series was designed with Accessibility for the blind and visually impaired. Navigate the menu with audible descriptions through the built-in speaker or headphones. Creators can choose English, Spanish, French, Japanese, German, Italian or Chinese. To use a language other than English, visit Support and Downloads.

  The onboard X/Y microphones capture clean audio up to 120 dB SPL, equivalent to the sound of a high-performance engine. The H1essential has advanced features such as overdubbing, pre-record, auto record, and playback speed adjustment, plus a dedicated Marker button to instantly set reference points while recording.

  Musicians can use the H1essential to record every rehearsal, with overdubbing and playback-speed adjustment for writing and practicing. Filmmakers can record and send audio directly to a camera or capture sound effects. Podcasters can mount it on a tripod for sit-down conversations or use mono mode for on-the-go interviews.

  When connected to a PC, Mac, iOS, or Android device using the USB-C port, the H1essential can be used as a USB microphone while simultaneously recording to the SD card. A firmware update adds AI Noise Reduction, which eliminates steady background noise and lowers the noise floor, gain adjustment during recording, and MP3 recording.
specs: |-
  - Built-in mic: 90 degree XY stereo format, unidirectional, sensitivity -37 dB/1 Pa at 1 kHz
  - Maximum sound pressure input: 120 dB SPL
  - MIC/LINE IN jack: stereo mini jack, input impedance 2 kohm or more, plug-in power 2.5 V
  - PHONE/LINE OUT jack: stereo mini jack, maximum output level 20 mW + 20 mW into 32 ohm load, output impedance 10 ohm or less
  - Built-in speaker: 20 x 30 mm oval dynamic speaker, practical maximum output 250 mW
  - Recording formats: WAV 44.1/48/96 kHz, 32-bit float, stereo or mono, BWF and iXML supported
  - Recording media: microSDHC 4-32 GB, microSDXC 64 GB-1 TB
  - Display: OLED, 128 x 64
  - USB: USB Type-C connector, USB mic USB 2.0 High Speed 48 kHz, 24-bit, file transfer USB 2.0 High Speed
  - Power: 2 AAA batteries (alkaline, lithium or rechargeable NiMH), USB bus power, or ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Estimated continuous battery operation: about 10 hours (alkaline), about 9 hours (NiMH 800 mAh), about 18 hours (lithium)
  - Power consumption: 5 W maximum
  - Dimensions: 53.9 mm (W) x 136.6 mm (D) x 29.0 mm (H)
  - Weight including batteries: 92 g
