details: |-
  For over 65 years the Gretsch Jet has fueled stages and studios producing some of the greatest sounds in rock 'n' roll history. The all-new G6128T Players Edition Jet DS with Bigsby is the culmination of over half a century of tonal and performance magic.

  The Jet DS begins with a select mahogany body with maple top that produces the signature strong, punchy response that has made the Jet famous. For the Players Edition Jet DS, we chose a 1.85" depth along with vintage chambering to deliver a tighter, more controlled attack.

  DynaSonic bridge and neck pickups complement the Jet DS's chambered body to produce amplified bright, shimmering highs and a defined, rich bass for distinct tone that cuts through the mix.
