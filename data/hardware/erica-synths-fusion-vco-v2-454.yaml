description: Fusion VCO2 is a full analogue sound source with lots of distinct features.
details: |-
  The core of the module is a highly stable AS3340 based VCO with three simultaneously available waveforms, a transistor based suboscillator and a detune function built from two BBD delay lines that make a frequency shifter mixed back into the principal oscillator to emulate two detuned VCOs. Tube crunch, a distinct tube overdrive, is added on top of the mix.

  An audio input mixes an external signal with the principal oscillator, which widens what the two tube stages can be used for. The Fusion VCO2 suits anyone after really low frequencies and a sound that sets a modular system apart.

  The range of sounds is wide. An oscillator without the specific tube character is available from the triangle and pulse outputs, so the module works as a plain VCO as well. Thanks to the two tube stages it is also a sound shaping module in its own right, good for warm, fat or heavily distorted sounds, and it works for long sustained material as well as percussive material.

  The panel adds great tracking over an 8 octave range, a -1 oct transistor based suboscillator, VCO synchronisation and simultaneous waveform outputs.
specs: |-
  - Full analogue design
  - AS3340 based VCO core
  - Great tracking over 8 octave range
  - Detune function built from two BBD delay lines
  - -1 oct transistor based suboscillator
  - Tube overdrive circuit
  - External audio input
  - VCO synchronization
  - Simultaneous waveform outputs
  - Audio input level 10Vptp
  - Audio output level 10Vptp
  - VCO range C0 to C8 and more
  - PWM CV range (full span) -5V to +5V
  - Panel width 14HP
  - Module depth 42mm
  - Power consumption 228mA@+12V, 55mA@-12V
