details: |-
  With close to 100 years' experience building copper timpani, the newest member to the Ludwig USA snare drum range is the Copper Phonic snare drum.

  Designed for high-volume performance with dark, focused tonal qualities, it represents an expansion of Ludwig's Phonic tone offerings.
specs: |-
  - Shell: 1.2mm seamless copper
  - Hoops: 2.3mm steel triple flanged (optional die-cast)
  - Throw-off: P88AC
  - Butt plate: P35P
  - Top head: Ludwig Weather Master Medium Coated
  - Snare-side head: Ludwig Weather Master Clear
  - Lugs: 10 total (Imperial or Tube options)
  - Sizes: 5x14, 6.5x14, 8x14
  - Finishes: Smooth Raw, Smooth, Hammered, Pewter
  - Models — 5x14: LC661 (Smooth Raw/Imperial), LC661T (Smooth Raw/Tube), LC660 (Smooth/Imperial), LC660T (Smooth/Tube), LC660K (Hammered), LC664 (Pewter/Imperial)
  - Models — 6.5x14: LC663 (Smooth Raw/Imperial), LC663T (Smooth Raw/Tube), LC662 (Smooth/Imperial), LC662T (Smooth/Tube), LC662K (Hammered), LC665 (Pewter/Imperial), LC663CKWMBLK (Hammered Raw, Black Nickel Triple-Flanged Hoops), LC663CKWMDBLK (Hammered Raw, Black Nickel Die-Cast Hoops), LC663S (Raw Striped, Die-Cast Hoops)
  - Models — 8x14: LC668R (Smooth Raw/Imperial)
