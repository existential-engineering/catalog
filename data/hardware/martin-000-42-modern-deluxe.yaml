  and a torch headstock inlay.
details: |-
  The 000-42 Modern Deluxe captures Golden Era elegance with contemporary sophistication. A spruce VINTAGE TONE SYSTEM (VTS) top and Golden Era-style Adirondack spruce X-bracing recreate the resonant tone of a nearly century-old Martin.

  Natural protein glue and a lightweight carbon-fiber bridge plate enhance sustain, while exclusive Liquidmetal bridge pins boost projection. EVO gold frets and a slightly asymmetrical neck offer modern playability, while European flamed-maple binding on the body and fingerboard pairs beautifully with Waverly gold open-gear tuners.

  Stunning pearl bordering outlines the top of this model, complemented by a pearl torch inlay on the headstock. Its 000 body delivers balanced warmth and brilliance, a perfect blend of vintage tone, luxury detailing, and modern comfort that rewards every touch.
specs: |-
  - Body Size: 000-14 Fret
  - Top: Spruce with VTS (Vintage Tone System)
  - Back & Sides: East Indian Rosewood
  - Bracing: Adirondack Spruce with VTS, GE-Scalloped X-brace
  - Bridge Plate: Carbon Fiber
  - Bridge: Ebony, Modern Belly with Drop in Saddle
  - Bridge Pins: Liquidmetal with Abalone dots
  - Saddle: Bone, Compensated, 16" radius
  - Pickguard: Tortoise
  - Neck Joint: Dovetail
  - Neck Material: Genuine Mahogany, Dark Mahogany finish
  - Neck Shape: Vintage Deluxe with High-Performance Taper
  - Scale Length: 24.9"
  - Total Frets: 20 (joins body at 14th fret)
  - Frets: EVO Gold
  - Fingerboard: Ebony
  - Nut Width: 1 3/4"
  - Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Golden Era Style 45 Snowflake (Abalone/Mother of Pearl)
  - Side Dots: Abalone
  - Binding: European Flamed Maple with Multi-Stripe
  - Top Inlay: Abalone with Multi-Stripe
  - Headstock: Solid with Square Taper/Diamond/Square corners
  - Headplate: Ebony with Torch inlay logo
  - Tuning Machines: Waverly Gold Open Gear with Butterbean knobs
  - Nut: Bone
  - Case: Ply Hardshell
  - Setup: Pleked
  - Left-handed available
