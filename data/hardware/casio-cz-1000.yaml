description: >-
  The Casio CZ-1000 is an entry-level 49-key synthesizer from 1985 featuring Phase
  Distortion synthesis and surprisingly capable 8-stage envelopes for creating digital and
  analog-like sounds.
details: |-
  Coming from Casio, the CZ-1000 was positioned as an entry-level instrument but gained recognition for its unexpectedly good 8-stage envelope capabilities. It employs Phase Distortion (PD) synthesis, Casio's proprietary approach to digital synthesis from the mid-eighties found across their CZ series, which modifies digital waveforms (sine waves) to create various sounds and is particularly effective for percussive tones.

  Three sets of 8-stage envelope sections provide extensive modulation: one modulates DCO pitches over time, another adjusts Phase Angle in the DCW (like filtering), and a third controls volume via the DCA amplifier. The synth includes four vibrato types with triangle, square, and ramp waveforms, plus rate, depth, and delay controls.

  Additional features comprise portamento (glide effect), 4-note polyphony with double oscillators, built-in noise and ring modulation. MIDI implementation offers 4 monophonic multitimbral parts. Storage is limited with only 32 patches total (16 preset, 16 user).

  The CZ-1000 represents the full-sized keyboard version of the CZ-101 and was used by notable artists including Vince Clarke and Eat Static.
specs: |-
  - Polyphony: 8 notes (8 oscillators)
  - Oscillators: Digital Phase Distortion Synthesis (sine, saw, square, pulse, resonance, double-sine, saw-pulse)
  - Instruments: 4 part multitimbral
  - DCW: 8-stage envelope generators with level and rate controls with Key Follow
  - DCA: 8-stage envelope generators with level and rate controls with Key Follow
  - Keyboard: 49 keys
  - Memory: 16 preset, 16 internal and 16 cartridge patches
  - MIDI: Yes
  - Date Produced: 1985
releaseDate: "1985"
