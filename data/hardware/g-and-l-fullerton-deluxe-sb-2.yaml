description: The Fullerton Deluxe SB•2 is Leo Fender's take on the P/J
  configuration, pairing a Magnetic Field Design split-coil at the neck with a
  single coil at the bridge. The 2024 revamp introduced a three-knob layout of
  volume, volume and tone, and a Leo Fender-designed Saddle-Lock bridge adds
  clarity and sustain.
details: |-
  When Leo Fender launched the G&L SB•2 bass in 1982, he packed his latest innovations in pickup and bridge design into a straightforward, hard-working bass. For players who prefer a less-is-more aesthetic but hunger for something meatier, the SB•2 is just the ticket.

  The SB•2 starts with a familiar shape, though subtle modifications to its sculpting make it more sleek and balanced. Strapped on, it immediately feels at home, yet somehow more comfortable than expected. The slim, C-shaped neck falls immediately to hand, checking in with a comfortable 9 1/2" radius and 21 Jescar 57110 medium-jumbo nickel-silver frets ready to deliver silky playability.

  Once the SB•2 has settled in, it shows just how far Leo evolved the classic duo of split-coil and single coil pickups. These Magnetic Field Design interpretations were created by Leo to give more gusto without losing detail and finesse. The 2024 revamp introduces a three-knob twist: volume, volume, and a tone control, which lets each tone be tailored. The SB•2 also features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  The bottom line: SB•2 brings the magic of Leo's own reinterpretation of the P/J configuration in a bass that delivers all the tone and feel expected in a "Latter Day Leo" instrument.

  Made in Leo Fender's historic G&L facility on Fender Avenue in Fullerton, California, the SB•2 is available with a wide range of custom options including body and neck woods, body and neck finishes, neck profiles and pickguard materials.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: Leo Fender-designed G&L MFD split-coil (neck) and single coil (bridge)
  - Body wood: Alder
  - Neck wood: Hard-Rock Maple with choice of Maple or Rosewood fingerboard
  - Neck profile: G&L 1-1/2" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Electronics: volume-volume-tone
  - Includes: G&L Deluxe Gig Bag
  - Available in: 3-Tone Sunburst over Alder, 4-ply tortoise pickguard, Rosewood fingerboard
  - Available in: Andromeda over Alder, 3-ply pearl pickguard, Maple fingerboard
