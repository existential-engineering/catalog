name: DN32-ADAT
manufacturer: klark-teknik
primaryCategory: audio-interface
categories:
  - routing
url: https://www.klarkteknik.com/en/products/0606-ACL
description: The DN32-ADAT is an expansion card providing up to 32 channels of
  ADAT I/O over four pairs of optical-fibre Toslink connectors arranged in
  groups of eight channels. It offers 24-bit signal transmission at a choice of
  44.1 or 48 kHz sample rate.
details: |-
  Up to 32 channels of ADAT I/O are carried on four pairs of optical-fibre Toslink connectors, arranged in groups of eight channels, with 24-bit signal transmission at either 44.1 or 48 kHz.

  The optical-fibre light-pipe connections provide galvanic isolation, which eliminates ground loop interference between the card and the devices connected to it.
specs: |-
  - Up to 32 channels of ADAT I/O
  - Four pairs of optical Toslink connectors, eight channels per pair
  - 24-bit signal transmission
  - 44.1 kHz or 48 kHz sample rate
  - Optical light-pipe connections give galvanic isolation
