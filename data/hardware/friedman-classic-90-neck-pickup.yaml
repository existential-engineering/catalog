details: |-
  The Friedman Classic 90 was inspired by the distinctive tones of the Golden Age of Rock 'n' Roll. The Classic 90 Neck and Bridge pickups deliver tremendous vintage tone while also maintaining a strong presence and a low noise floor.

  When Dave Friedman and Grover Jackson were designing the Friedman line of guitars, a lot of thought was put into every aspect of the build, especially the pickups. Inspired by both modern and vintage guitar tones, Dave wanted to make sure that the pickups used in all Friedman guitars delivered the exact tone he envisioned. With Dave's vision and Grover's unsurpassed skills, the Friedman Classic Pickup line was born.

  The Classic 90 is hand built in the USA by Grover Jackson and custom voiced by Dave Friedman, and is offered in black or cream covers so it can be matched to the guitar it is going into.
specs: |-
  - DC resistance: 8.6k neck, 8.7k bridge
  - 80/20 wax potted
  - Custom voiced by Dave Friedman
  - Made in the USA by Grover Jackson
  - Cover colour options: black, cream
