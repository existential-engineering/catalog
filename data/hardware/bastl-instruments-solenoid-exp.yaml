url: https://bastl-instruments.com/eurorack/modules/solenoid-exp
description: Expansion module for the Bastl Instruments Solenoid module, adding
  4 independent CV inputs (0–5V) that individually control the output pulse
  width on each solenoid channel. Requires the primary Solenoid module to
  function.
details: |-
  2HP. Power drawn from the Solenoid module via ribbon; combined draw +5V <35mA. 4 independent CV inputs (0–5V) for per-channel velocity/pulse width control.
