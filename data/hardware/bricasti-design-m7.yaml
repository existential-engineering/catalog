description: The Bricasti Design M7 is a professional stereo reverb processor
  featuring over 200 unique reverb presets with a True Stereo Reverb Process
  algorithm, dual dedicated power supplies, and a fully-balanced DC-coupled
  analog signal path, handcrafted in the USA.
details: |-
  The Bricasti Design Model 7 provides the highest level of musicality and
  ease of control imaginable in a processor dedicated to the task of
  reverberation. A modern high resolution digital design, utilizing a stunning
  array of the latest DSP processors, provides a platform for the long overdue
  next step in reverb processing algorithms.

  A separate fully differential analog section and dedicated transformer based
  linear power supply provide the finest analog specifications of any product
  of its kind. An exceptionally strong stainless steel chassis, and a tooled
  aluminum front panel, combine with a classic high visibility display and
  straightforward human interface, to complete an enduring design.

  Features more than 200 unique reverb presets including Halls, Plates,
  Chambers, and Ambient Spaces, alongside a revolutionary True Stereo Reverb
  Process algorithm. The unit offers 12 parametric program parameters, 100 user
  registers, and 4 front panel Favorites for quick saves and compares.

  The hardware design includes dual dedicated power supplies: a custom toroidal
  transformer linear supply for analog circuitry and a high performance
  switching supply for digital processing. The chassis is non-corrosive
  stainless steel with a milled anodized aluminum front panel. Each unit is
  hand crafted in the USA.
specs: |-
  - AES 24-bit digital I/O
  - AES single wire 192k supported
  - Self-clocking to incoming sample rates 44.1k to 192k
  - 6 state-of-the-art dual-core Analog Devices DSPs
  - Balanced XLR analog I/O, fully-balanced DC-coupled
  - 24-bit conversion with dual D/A
  - Analog input dynamic range: >116 dB A-weighted
  - Analog input THD+N: <0.001%
  - Analog input frequency response: 10Hz–20kHz ±<0.05dB
  - Analog input CMRR: >100 dB @ ≤1kHz
  - Maximum input level: +24 dBu
  - Analog output dynamic range: >116 dB A-weighted
  - Analog output THD+N: <0.001%
  - Analog output frequency response: 10Hz–20kHz ±<0.05dB
  - Maximum output level: +24 dBu
  - More than 200 unique reverb presets
  - 12 parametric program parameters
  - 100 user registers, 4 front panel Favorites
  - MIDI I/O
  - Dual dedicated power supplies
  - Non-corrosive stainless steel chassis
  - Milled anodized aluminum front panel
  - Hand crafted in the USA
