description: 18-inch passive subwoofer from the Electro-Voice Tour X (TX)
  Series, designed as a high-power low-frequency supplement to the TX1122 and
  TX1152 full-range cabinets. Delivers 132 dB peak SPL from a high-excursion
  EVS-18S woofer with a built-in 6 dB/octave low-pass filter that allows it to
  be connected in parallel with a TX top without an external crossover or
  additional amplifier channel.
details: >-
  The TX1181 is the 18-inch passive subwoofer in Electro-Voice's Tour X (TX)
  Series, intended as a high-output low-frequency extension for the TX1122 and
  TX1152 full-range loudspeakers. It uses a single high-excursion EVS-18S
  18-inch woofer in a vented enclosure, rated at 500 W continuous / 2000 W peak
  with a nominal 8 ohm impedance (7.5 ohm minimum).


  A built-in 6 dB/octave passive low-pass filter lets the TX1181 be
  daisy-chained in parallel with a TX top from a single amplifier channel: the
  sub keeps the low frequencies while the top receives the full-range signal,
  with no external crossover or extra amp required. A recommended 30 Hz
  high-pass on the source protects the woofer at high drive levels.


  The braced plywood and MDF cabinet is finished in EV's black EVCoat texture. A
  top-side M20 socket accepts a speaker pole for mounting a TX top directly
  above the sub. Connections are made via parallel Neutrik NL4 Speakon jacks on
  the rear panel (one input, one parallel through).
specs: >-
  - Configuration: Single-18 passive subwoofer with built-in 6 dB/octave
  low-pass filter

  - LF driver: EVS-18S 18-inch high-excursion woofer

  - Frequency response (-3 dB): 50 Hz - 160 Hz

  - Frequency range (-10 dB): 45 Hz - 700 Hz

  - Recommended high-pass: 30 Hz

  - Maximum SPL: 132 dB

  - Axial sensitivity: 100 dB SPL (1 W @ 1 m)

  - Power handling: 500 W continuous / 2000 W peak

  - Nominal impedance: 8 ohms (7.5 ohms minimum)

  - Connectors: Dual parallel Neutrik NL4 Speakon (input + through)

  - Pole mount: Top-side socket for speaker pole

  - Enclosure: Braced plywood and MDF with EVCoat finish

  - Color: Black

  - Dimensions (H x W x D): 769 x 508 x 591 mm

  - Net weight: 33.8 kg
