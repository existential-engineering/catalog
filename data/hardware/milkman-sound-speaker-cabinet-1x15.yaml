details: |-
  About

  These Pine speaker cabinets are nice and light and they sound great. They make the perfect addition to your existing Milkman setup, or for The Amp. Please note that these are built to order they do not always ship immediately after purchase. If you would prefer to set up the order with a deposit please use the contact page to send me a message. Cabinet and Finish

  Pine Cabinet with Smooth Blonde Tolex and Beige grill cloth. Larger cabinets come with a recessed top handle for easy transport, small cabinets have a strap handle - both can easily be cleared by both amplifier heads and combo amplifiers. These cabinets are available in any custom shop finish. The default color is Vanilla. Available Speakers and Cabinets

  12" Fane 30W A30 Alnico 8ohm, 16ohm

  12" Fane F25 Ceramic 80hm

