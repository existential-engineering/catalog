supersedes: SIpOAqdHMmLf4FJvLi02U
url: https://lexiconpro.com/en-US/products/pcm81
description: The PCM 81 takes where the PCM 80 left off, and adds AES/EBU
  Digital I/O, includes algorithms and presets from the Pitch FX and Vocal Fix
  Cards, and adds 24-bit converters for even higher quality audio.
specs: |-
  - 2-in/2-out studio/live sound multi-effects processor
  - AES/EBU Digital I/O (XLR)
  - S/PDIF coaxial digital I/O (RCA)
  - 24-bit A/D and D/A converters with 24-bit internal DSP
  - Sample rates: 44.1 kHz and 48 kHz
  - Frequency response: 10 Hz - 20 kHz +/- 0.5 dB
  - THD: <0.006%
  - Dynamic range: D/A >98 dB, A/D >105 dB typical
  - Includes algorithms and presets from Pitch FX and Vocal Fix Cards
  - PCMCIA Type I memory card slot (up to 1 MB SRAM)
  - MIDI In, Out, and Thru (5-pin DIN)
  - Footswitch and foot controller (expression pedal) inputs
  - 1U rack-mount chassis (19" W x 1.75" H x 12" D, 6.4 lbs)
  - Universal power supply: 100-240V AC, 35W
