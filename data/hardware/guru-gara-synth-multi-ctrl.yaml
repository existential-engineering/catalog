details: |-
  Multi CTRL

  The Multi CTRL Eurorack PCB and Front Panel Kit is a DIY control voltage utility module designed to control multiple parameters using a single knob. It generates a bipolar control voltage and distributes it across multiple outputs, making it ideal for coordinated modulation and macro-style control in Eurorack systems. Key Features

  - External CV input to combine with the generated control voltage
  - Can function as a simple active multiple
  - 10HP Eurorack format

  Control & Modulation

  Multi CTRL allows you to create a central control voltage using the main CTRL knob and send it to up to four destinations simultaneously. Each output can be independently scaled and inverted, enabling complex modulation relationships such as opposing movement, subtle offsets, or exaggerated responses. An external CV source can be added to the internally generated CV, allowing the module to act as a modulation hub that blends manual control with dynamic modulation sources. DIY Build & Front Panel

  This DIY Eurorack CV control PCB and front panel kit is intended for intermediate builders. The front panel is made from durable PCB material and screen printed by hand, ensuring a cohesive aesthetic across Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module

  View Documents

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
