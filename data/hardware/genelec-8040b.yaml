details: |-
  The 8040B is a nearfield active studio monitor in Genelec's Classic family, designed to deliver truthful reproduction for music production, post-production and broadcast environments. Its die-cast recycled aluminium Minimum Diffraction Enclosure (MDE) houses a 165 mm bass driver and a 19 mm metal dome tweeter, each driven by its own 90 W Class AB amplifier through an active crossover at 3 kHz.

  Frequency response extends from 48 Hz to 20 kHz (±2 dB) with a low cutoff of 41 Hz, and the monitor delivers a short term maximum SPL of ≥105 dB at 1 m with self-generated noise of ≤10 dB SPL (A-weighted). The curved enclosure and integrated Directivity Control Waveguide (DCW) work together to provide a wide sweet spot and controlled on- and off-axis response, while a rear reflex port supports the low end without compromising transient detail.

  The rear panel offers a single balanced XLR analog input and a set of DIP switches for room response, bass tilt, treble tilt and bass roll-off compensation, allowing the monitor to be tuned to a wide range of acoustic environments and console reflections. An Intelligent Signal Sensing (ISS) circuit drops standby consumption to under 0.5 W after periods of inactivity, automatically waking the monitor when audio returns.

  Each 8040B ships with the Iso-Pod vibration isolation stand, which decouples the cabinet from the work surface and provides ±15° of acoustic-axis tilt. Optional mounting hardware, stand plates, soft bags and a hard case extend the monitor to fixed installations, mobile rigs and touring use without changing its sonic character.
specs: |-
  - Frequency response: 48 Hz - 20 kHz (±2 dB)
  - Low cutoff -6 dB: 41 Hz
  - High cutoff -6 dB: 25 kHz
  - Peak SPL: ≥115 dB (per pair at 1 m with music material)
  - Short term max SPL: ≥105 dB
  - Long term max SPL: ≥99 dB
  - Self-generated noise: ≤10 dB SPL (A-weighted at 1 m)
  - Harmonic distortion 50-100 Hz: ≤2%
  - Harmonic distortion >100 Hz: ≤0.5%
  - Crossover frequency: 3000 Hz
  - Bass driver: 165 mm cone, magnetically shielded
  - Treble driver: 19 mm metal dome, magnetically shielded
  - Bass amplifier: 90 W Class AB
  - Treble amplifier: 90 W Class AB
  - Enclosure: Die cast aluminium, reflex port
  - Signal input: 1 x XLR (female, balanced, 10 kOhm)
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤10 W
  - Power consumption (full output): 110 W
  - Mains: 100, 120, 220 or 230 VAC, 50/60 Hz (region-dependent)
  - Height: 365 mm (with Iso-Pod)
  - Width: 237 mm
  - Depth: 223 mm
  - Weight: 9.4 kg (20.7 lb)
