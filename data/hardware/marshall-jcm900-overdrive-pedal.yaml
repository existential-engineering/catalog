description: The JCM900 pedal is meticulously crafted to embody the iconic
  high-gain sound of the legendary JCM900 amp. Put your foot down and achieve
  the versatile tones that helped shape a genre. Characterised by hard diode
  clipping, the JCM900 distortion sits in between the bright bite of the JCM800
  and the fatter, bottom-heavy tones of the DSL — the sound that shaped modern
  rock, now available on your pedalboard in a compact stompbox with tactile
  rotary knobs (Gain, Contour, Tone, Volume), an illuminated true-bypass
  footswitch, and the unmistakable black-and-gold Marshall finish.
details: |-
  The JCM900 pedal is meticulously crafted to embody the iconic high-gain sound of the legendary JCM900 amp. Put your foot down and achieve the versatile tones that helped shape a genre. Designed and engineered in UK. Made in Vietnam.

  Delivering the classic Marshall tones that defined a decade, this pedal ensures your tone remains uncompromised. From gritty overdrive to soaring leads, the JCM900 Pedal offers the dynamic range and rich harmonics you crave.

  Combining Marshall's unmatched craftsmanship with a compact and robust design, this pedal withstands the rigours of professional use while seamlessly fitting into any pedalboard configuration.

  The pedal's tactile rotary knobs enable you to shape your sound to match the distinctive characteristics of the original JCM900 with ease. You can also fine tune your midrange frequencies with precision using the contour control.
