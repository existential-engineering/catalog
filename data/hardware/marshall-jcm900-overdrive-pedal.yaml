description: The JCM900 pedal is meticulously crafted to embody the iconic
  high-gain sound of the legendary JCM900 amp. Put your foot down and achieve
  the versatile tones that helped shape a genre. Characterised by hard diode
  clipping, the JCM900 distortion sits in between the bright bite of the JCM800
  and the fatter, bottom-heavy tones of the DSL — the sound that shaped modern
  rock, now available on your pedalboard in a compact stompbox with tactile
  rotary knobs (Gain, Contour, Tone, Volume), an illuminated true-bypass
  footswitch, and the unmistakable black-and-gold Marshall finish.
