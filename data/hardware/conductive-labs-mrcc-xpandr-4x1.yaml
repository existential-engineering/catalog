description: A DIN expander for MRCC that also functions as a stand-alone,
  class-compliant USB MIDI interface and merger.
details: |-
  The XpandR 4x1 adds DIN and TRS MIDI connectivity to an MRCC, plugging into one of its USB host ports; up to four XpandRs can be attached to a single MRCC. Its anodized aluminum enclosure houses a class-compliant USB MIDI interface that also runs as a stand-alone, USB-powered MIDI merger with PCs, Macs, and tablets.

  Dual-color (blue/red) LEDs indicate power, mode, and MIDI activity.
specs: |-
  - Adds 4 DIN inputs plus a shared 3.5mm TRS Type A input option
  - 1 DIN output with a shared TRS Type A thru output
  - 4 USB MIDI virtual inputs and 1 virtual output
  - Dual-color (blue/red) LED indicators for power, mode, and MIDI activity
  - Up to 4 XpandRs attachable to one MRCC via USB host ports
  - Stand-alone USB-powered MIDI merger mode
  - Class-compliant USB MIDI interface for PC, Mac, and tablets
  - USB 2.0, 5V DC, 40mA via Type B connector; 6-foot USB cable included
  - Anodized aluminum enclosure with silk-screened interface
