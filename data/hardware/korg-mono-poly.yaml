description: >-
  A uniquely flexible four-oscillator analog synthesizer that seamlessly shifts between monophonic
  and polyphonic operation, offering oscillator sync, dual LFOs, and a voice-cycling arpeggiator
  that set it apart from its early-1980s peers.
details: |-
  The Korg Mono/Poly arrived in 1981 as a genuinely original take on the analog synthesizer. Rather than committing to a single architecture, it gave players four independently controllable VCOs that could be deployed as a four-voice polysynth for chords or stacked together in unison for towering monophonic leads. This duality, reflected right in the instrument's name, made it one of the most versatile analog keyboards of its generation.

  Each of the four oscillators offers individual level, tuning, and waveform selection across triangle, sawtooth, and pulse-width-modulated shapes. This per-oscillator control means that even in unison mode, players can create richly detuned textures and complex timbres by setting each VCO to slightly different parameters. Oscillator sync adds another layer of harmonic complexity, producing the searing, metallic tones that became a hallmark of the instrument.

  The dual independent LFOs are an unusually sophisticated feature for a synth at this price point. Each can modulate different targets — pulse width, envelope characteristics, and arpeggiator behavior — at independent rates, enabling evolving, organic textures that simpler single-LFO designs cannot match. The built-in arpeggiator itself is notable for its ability to cycle through the four voices on each triggered note, creating rippling, animated patterns.

  With additional features including chord memory, portamento, a noise generator, and CV/Gate connectivity, the Mono/Poly earned devoted followings among electronic artists. Hardfloor, Tangerine Dream, The Orb, Chemical Brothers, and Daft Punk have all tapped into its aggressive yet versatile character, and it continues to be prized by collectors and performers who value its unique four-oscillator architecture.
specs: |-
  - Polyphony: 4 voices (poly mode) or monophonic (unison mode)
  - Oscillators: 4 VCOs with triangle, sawtooth, and PWM waveforms
  - LFO: 2 independent LFOs with individual rate controls
  - Filter: VCF with dedicated ADSR envelope
  - VCA: ADSR envelope
  - Keyboard: 44 keys
  - Arpeggiator: Built-in with voice-cycling capability
  - Effects: Oscillator sync, chord memory
  - Control: CV/Gate, CV filter input
  - Additional: Noise generator, portamento
  - Date Produced: 1981
