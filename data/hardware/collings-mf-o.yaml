name: MF-O
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf-o/
description: The MF-O combines an affordable satin finish and simplified
  appointments with the same quality construction and tonewoods as
  fully-appointed F-style models. The fully carved Adirondack spruce top with
  maple back and sides produces a rich, woody tone. The oval soundhole
  accentuates bass and low-mid response while providing a warm, open tonality
  that is rich in overtones.
details: |-
  The MF-O is an F-style mandolin with a fully carved Adirondack spruce top, Eastern flamed maple back, sides, and neck, and an oval soundhole. X-brace construction delivers the warm, open character associated with oval-hole instruments. Tortoise top binding keeps appointments simple. The ebony fingerboard features mother-of-pearl dot inlays, and the ebony bridge has an adjustable saddle. A rounded V neck profile, 13 7/8" scale length, and 1 3/16" nut width with 1 9/16" string spacing suit a wide range of playing styles. Hardware includes nickel Gotoh tuners with black buttons and the Collings original design tailpiece. The body is finished in satin nitrocellulose lacquer. Ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Construction: F-style
  - Top: Adirondack spruce (fully carved)
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: Oval
  - Body Binding: Tortoise (top)
  - Bracing: X-brace
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 3/16"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo
  - Tuners: Nickel Gotoh with black buttons
  - Tailpiece: Original design
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 7" - 11 5/8" compound
  - Body Finish: Satin nitrocellulose lacquer
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
