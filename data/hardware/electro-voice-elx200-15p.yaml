id: YV2lnIEB2FRTs1fR_Lf12
name: ELX200-15P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/elx200-15p/
description: The ELX200-15P is a 15-inch two-way powered loudspeaker for
  portable and installed sound applications. A 1200 W Class-D amplifier drives
  an EVS-15M 15-inch woofer and a DH-1L 1-inch titanium compression driver
  behind EV's Signal Synchronized Transducers (SST) waveguide, delivering up to
  132 dB peak SPL with 90 x 60 degree coverage. QuickSmartDSP provides four
  factory presets (Music, Live, Speech, Club) plus user-programmable presets
  with sub/top crossover and three-band EQ. The lightweight polypropylene
  enclosure features three M10 suspension points, integrated pole-mount, and the
  proven ZLX three-handle design. Bluetooth Low Energy enables wireless
  configuration of up to six ELX200 loudspeakers via the EV QuickSmart Mobile
  app (availability varies by country).
details: >-
  1200 W Class-D amplifier delivering up to 132 dB peak SPL


  EVS-15M 381 mm (15-inch) woofer with DH-1L 1-inch titanium compression driver


  EV-patented Signal Synchronized Transducers (SST) waveguide design


  QuickSmartDSP with four factory presets (Music, Live, Speech, Club)


  User-programmable presets with store and recall


  Sub/top system-match crossovers and three-band EQ


  Bluetooth Low Energy (BTLE) connectivity for wireless control (select
  countries)


  EV QuickSmart Mobile app controls up to six ELX200 loudspeakers simultaneously


  Visual limiter status monitoring and input metering


  Performance alerts surfaced via mobile app


  Lightweight polypropylene enclosure


  Three M10 threaded suspension points for rigging


  Integrated pole-mount and proven ZLX three-handle design for easy lifting


  Available in black or white
specs: |-
  - frequencyResponse: 55 Hz - 16 kHz (-3 dB)
  - frequencyRange: 48 Hz - 19 kHz (-10 dB)
  - maxSpl: 132 dB
  - amplifierPower: 1200 W Class-D
  - coverage: 90 x 60 degrees (H x V)
  - woofer: EVS-15M 381 mm (15-inch)
  - tweeter: DH-1L 1-inch titanium compression driver
  - crossoverFrequency: 1.6 kHz
  - dimensions: 710 x 423 x 384 mm (28.0 x 16.7 x 15.2 in)
  - weight: 18.9 kg (41.7 lb)
  - shippingWeight: 21.8 kg (48.1 lb)
  - powerConsumption: 100-240V~, 50-60 Hz, 1.2-0.6 A
  - enclosureMaterial: Polypropylene
  - suspension: 3 M10 threaded mounting points
  - colorOptions: Black or White
