details: |-
  Building on KRK's legacy of sonic accuracy and performance, the KRK CLASSIC 8 powered studio monitors incorporate over 30 years of innovation. Borrowing concepts from previous ROKIT lines, the CLASSIC 8 defaults to a flat frequency response aimed at critical listening, for more accurate mixes. With the optional ability to engage the +2 dB KRK Bass Boost, the CLASSIC 8 can also provide an enhanced bass response.

  The CLASSIC 8 is an active (self-powered) two-way studio monitor that uses a 1-inch textile soft dome tweeter paired with an 8-inch glass aramid woofer. The built-in power amplifiers provide a total of 100 watts of power, with a 75 watt amp driving the woofer and a 25 watt amp for the tweeter.
