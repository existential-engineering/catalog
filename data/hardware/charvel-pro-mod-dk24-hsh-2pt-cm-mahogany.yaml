details: |-
  The Pro-Mod DK24 HSH 2PT CM Mahogany pairs a sculpted Dinky-shaped mahogany body in a satin finish (with scalloped lower back bout and shredder's cut heel for upper register access) with a bolt-on caramelized maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, all anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around a versatile HSH configuration: a Seymour Duncan Full Shred TB-10 at the bridge, a Seymour Duncan Custom Flat Strat SSL-6 single-coil in the middle, and a custom Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch. A 500K EVH Bourns Low Friction volume pot and no-load tone control round out the wiring.

  Hardware includes a Gotoh Custom 510 Tremolo with Gotoh tremolo arm, Charvel-branded die-cast locking tuning machines, gold finish, Stratocaster-style skirt knobs, and a black switch tip. The licensed Fender Stratocaster headstock, 4-bolt sculpted heel, and heel-mount truss rod adjustment wheel complete a thoroughly modern high-performance platform.
