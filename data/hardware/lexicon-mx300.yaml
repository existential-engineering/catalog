description: Stereo Reverb/Effects Processor with USB “Hardware Plug-In”
  capability — 16 Lexicon reverbs, 7 delays, dbx compression/de-essing, and
  modulated effects controllable from PC VST and Mac AU plug-ins.
details: |-
  The Lexicon MX300 is a 1U rack-mount stereo reverb and effects processor that packs a significant portion of the higher-end MX400’s feature set into a more affordable unit. It offers 16 legendary Lexicon reverbs, 7 delays, dbx compression and de-essing, and modulated effects in a 2-in / 2-out configuration with both XLR and 1/4” TRS balanced I/O.

  Its signature feature is USB “Hardware Plug-In” operation: connecting the MX300 to a PC or Mac via USB exposes all reverb, delay, and dynamics parameters inside any PC VST or Macintosh Audio Units compatible DAW, so settings can be automated and recalled like a software plug-in while the actual DSP runs on the hardware—offloading the CPU from heavy reverb processing.

  The front panel is built for live use: a Page/Select wheel, three dedicated parameter knobs, dedicated Tempo, Bypass, and Exit controls, plus a Program/Load knob and bright LED program indicator allow whole nights of presets to be dialed up without menu diving. There are 99 Factory and 99 User programs and five effect routing options (Dual Mono, Cascade/Series, Dual Stereo/Parallel, Mono Split, and Stereo).

  Audio is converted at 24-bit with 44.1/48 kHz sample rates and 128x oversampling, with S/PDIF digital I/O on dual RCA. Control connectivity includes USB 1.0 (for MX-Edit Editor/Librarian and the VST/AU plug-ins), MIDI In/Thru on 5-pin DIN, and a 1/4” footswitch jack. Power is universal-voltage via a standard IEC line cord (no wall wart).

  The MX300 is listed as a discontinued product on lexiconpro.com. Legacy datasheets, the owner’s manual (English, French, Spanish), the MX-Edit Editor/Librarian (Mac v2.2.0, Windows v2.3.1), and the MX NetUpdater utility remain available as downloads for existing owners; the included VST/AU plug-ins are 32-bit only.
specs: |-
  - 1U rack-mount stereo reverb / effects processor
  - 2-in / 2-out configuration
  - 16 legendary Lexicon reverbs (Small/Large Hall, Small/Large Plate, Room, Chamber, Gated, Reverse, Vocal Hall, Vocal Plate, Drum Hall, Drum Plate, Ambience, Studio, Arena, Spring)
  - 7 Lexicon delays (Studio, Mono, Tape, Pong, Mod, Reverse, 2-Tap)
  - dbx dvx dynamics: Compressor and De-Esser
  - Modulated effects: Chorus, Flanger, Phaser, Tremolo/Pan, Rotary, Vibrato, Pitch Shift, Detune
  - 5 effect routing options: Dual Mono, Cascade (Series), Dual Stereo (Parallel), Mono Split, Stereo
  - 99 Factory / 99 User programs
  - USB “Hardware Plug-In” operation with included PC VST and Mac AU plug-ins (32-bit only)
  - MX-Edit Editor/Librarian software included
  - Analog inputs: Two 1/4” balanced TRS and two XLR female, 50kΩ balanced / 25kΩ unbalanced, +4 dBu nominal / +24 dBu max
  - Analog outputs: Two 1/4” TRS balanced and two XLR male, 2kΩ balanced / 1kΩ unbalanced (1/4” only), +4 dBu or –10 dBV nominal (software adjustable), 24 dBu max
  - A/D and D/A conversion: 24-bit, 44.1/48 kHz with 128x oversampling
  - S/PDIF digital I/O on dual RCA phono, 24-bit, 44.1/48 kHz
  - Frequency response: 10 Hz – 20 kHz +0/–0.5 dB
  - THD+N: <0.0019% (10 Hz – 20 kHz)
  - Dynamic range: >109 dB (A-weighted) A/A
  - Crosstalk: typical <–80 dB (20 Hz – 20 kHz)
  - Processing delay: 3.7 ms @ 48 kHz
  - USB 1.0 control interface for MX-Edit and VST/AU plug-ins
  - MIDI In / Thru on 5-pin DIN
  - 1/4” footswitch jack
  - Universal power: 100–120 VAC and 220–240 VAC, 50/60 Hz, 18 W, standard IEC line cord
  - Dimensions: 19” x 1.75” x 7.25” / 6.375” (483 x 44 x 185 mm / 162 mm) including knobs
  - Weight: 5.8 lbs (2.63 kg)
