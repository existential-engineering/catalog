description: The Empress Superdelay is a feature-rich digital delay pedal
  offering up to 2.8 seconds of delay time across eight modes (normal, tap,
  autoset, reverse, rhythm/multitap, tape, misc and an 11-second looper), with
  presets, tap tempo, filtering and an expression pedal input. It has been
  discontinued and superseded by the Empress Echosystem.
details: |-
  The Empress Superdelay is aimed at players who want a delay that inspires rather than just repeats. It sounds excellent on basic delays but goes far beyond them, with up to 2.8 seconds of delay time and eight modes: normal, tap, autoset (delay time set by tempo played), reverse, rhythm/multitap, tape, misc (dynamic, gate) and an 11-second looper.

  Settings can be stored to eight presets and recalled easily via its three footswitches. An expression pedal input controls either mix or feedback, a high-pass/low-pass filter shapes the repeats, and switchable fast/slow modulation adds texture. Tap tempo with ratio selection makes in-time delays easy.

  It uses true bypass in a compact die-cast aluminum enclosure with a signal-to-noise ratio around 105 dB.
specs: |-
  - Signal-to-noise ratio around 105 dB
  - Up to 2.8 seconds of delay time
  - 8 modes: normal, tap, autoset, reverse, rhythm (multitap), tape, misc (dynamic/gate), 11-second looper
  - 8 presets accessed via three footswitches
  - Expression pedal input (controls mix or feedback)
  - High-pass / low-pass filter on repeats
  - Fast/slow modulation
  - Tap tempo with ratio selection
  - True bypass
  - Power: 9 - 12 V DC (positive tip), 2.1mm barrel, ~300 mA
  - Die-cast aluminum enclosure, approx. 5.7" x 3.75" x 1.75", 1.5 lb
