description: The Chandler Limited TG12345 MKIV equalizer is a handmade, fully
  discrete, mono, single space module designed for the 500 Series format. It
  inherits from Chandler Limited's TG Microphone Cassette and flagship TG12345
  Curve Bender, drawing its heritage from the input and group channel equalizers
  found on historic EMI TG12345 recording consoles of the late 1960s and early
  1970s.
details: |-
  The TG12345 MKIV EQ is part of the Abbey Road Series from Chandler Limited, authorized by EMI/Abbey Road Studios. It is handmade, fully discrete, mono, and occupies a single 500 Series slot. The unit features transformer balanced I/O wired pin 2 hot. Designed to recreate the equalizer character of the historic EMI TG12345 recording console, it pairs with the TG Opto Compressor and TG2-500 Pre Amp to form a complete EMI TG console channel strip in a 500 Series rack. Notable users include Dave Cobb, Joe Chiccarelli, and Ryan Hewitt.

  The presence band is switchable with eight frequencies (500, 800, 1.2, 1.8, 2.8, 4.2, 6.5, 10 kHz) and an out position — the first seven are bell type and the eighth is a shelf at 10 kHz. The bass band is a shelving type with two frequency options at 90 or 150 Hz.
