description: Music streaming hub that connects multiple Marshall home Bluetooth
  speakers, with an RCA input for adding a record player to the set-up.
details: |-
  Heddon connects multiple speakers so that they play music simultaneously. Add your record player through the dedicated RCA input and bring the warm, analogue richness of vinyl into modern streaming. A one-time set-up is made easy via the Marshall app.

  Multi-speaker connectivity: enjoy hearing your music playing in sync as you walk from room to room. Heddon streams music via Wi-Fi then uses Auracast to broadcast it across multiple connected Marshall speakers throughout the home. Auracast transmission means you can connect as many compatible speakers as you like within range, at more than double the range of standard Bluetooth, with higher quality audio and less compression.

  Compatible with early edition speakers: Heddon's RCA output allows older-generation Marshall speakers to be integrated into the listening set-up, extending their use and helping to avoid unnecessary disposal.

  Record player input: add a record player to the set-up and listen to a favourite album back-to-back. Certain record player models require a preamp to function properly with this device.

  However you want to connect, Wi-Fi works with Google Cast, AirPlay, Spotify Connect or Tidal Connect. Streaming to Heddon means the music does not stop if a call comes in, it does not drain a phone battery, and everyone on the Wi-Fi network can control the music. Designed and engineered in Sweden. Made in China.
specs: |-
  - Wireless connectivity: Wi-Fi with Google Cast, Apple AirPlay, Spotify Connect and Tidal Connect
  - Auracast transmission to compatible Marshall speakers
  - RCA input for analogue sources such as a vinyl player (preamp required for certain record players)
  - RCA output for Marshall Homeline I and II legacy speakers
  - Dimensions: 120.5 x 120.5 x 42 mm / 4.75 x 4.75 x 1.65 in
  - Weight: 0.44 kg / 0.97 lb
  - Mains input voltage: 100 to 240 V
  - Mains frequency: 50/60 Hz
  - Colorways: Black
  - Box contents: Heddon music streaming hub, mains lead, quick start guide, legal and safety information
  - Compatible app: Marshall app
  - Country of origin: designed and engineered in Sweden, made in China
