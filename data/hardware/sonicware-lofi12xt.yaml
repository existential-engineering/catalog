description: Lofi-12 XT is a low-res digitized sampler and groovebox with a
  12-bit sampler mode, 12/24kHz retro sampling, and an 8-track sequencer. It
  packs deep signal processing (22 insert FX, 6 master FX, delay and reverb), up
  to 3 hours of mix-tape recording, a built-in mic and speaker, and battery
  power.
details: |-
  Lofi-12 XT is a low-res digitized sampler offering 12/24kHz retro sampling with a 12-bit sampler mode. Intuitive, non-stop beat making comes from its 8-track sequencer, backed by powerful signal processing (22-type IFX, 6-type MFX, delay and reverb). Background mix-tape recording captures up to 3 hours effortlessly, and a built-in mic, speaker, battery power, and versatile connectivity round it out.

  Included: Lofi-12 XT unit (Standard Black Color), 32GB SD card with 2,500+ samples, power supply unit, and warranty. Batteries, USB cable, and other connection cables are sold separately.
