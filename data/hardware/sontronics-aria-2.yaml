details: |-
  ARIA 2 is a professional valve condenser microphone, hand-built in England to deliver stunning vocal recordings with warmth, clarity and character. Whether you're working in a studio, a vocal booth or a live room, ARIA 2 gives singers, voiceover artists , musicians and engineers the confidence to capture every performance exactly as it should be heard. At its core is a brand-new proprieta ry 34mm gold-sputtered ca p sule, developed exclusively for this model. The result is a smoother, more open sound, with beautifully balanced mids and a detailed top end that brings out the best in vocals, spoken word, acoustic instruments and more. Tuned for a tailored silky-smooth frequency response and consistent results, ARIA 2 is built to deliver t ime and time again . Upgraded internal circuitry gives you increased sensitivity, lower self- n oise and a cleaner, more dynamic signal straight out of the box. Finished in premium black with golden accents and supplied in a rugged ABS flight case, ARIA 2 doesn ' t just sound exceptional, it looks the part too. Whether you ' re upgrading your first mic or adding a trusted new flagship to your setup, ARIA 2 is ready to earn its place in your workflow. FEATURES

