description: Small module, big distortion!
details: |-
  Pico Drive is a combined wavefolder and overdrive module for distorting drums or thickening up a final mix where rack space is short. It fits the whole circuit into 3HP.

  Gain and Drive levels are adjustable by hand, and both have CV control for added expression. A built-in limiter keeps the output from running into undesired clipping however hard the stage in front of it is pushed.

  The module is 3HP wide and 35mm deep. Audio output level runs from -5V to +5V, CV inputs take a full span of -5V to +5V, and the input and output carry protection against undesired overvoltage.
specs: |-
  - Manual Gain and Drive controls
  - CV control over Gain and Drive
  - Wavefolder
  - Output signal limiter
  - Input and output protection against undesired overvoltage
  - Audio output level -5V to +5V
  - CV level (full span) -5V to +5V
  - Power consumption 29mA @ +12V, 29mA @ -12V
  - Module width 3HP
  - Module depth 35mm
