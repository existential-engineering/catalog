description: >-
  A spring-loaded joystick modulation controller from 1981 with two internal
  LFOs and four VCAs, designed for real-time CV-based modulation of analog
  synthesizers.
details: |-
  The Octave Plateau CATSTICK is a specialized modulation control device released in 1981, originally
  designed as a companion to the company's Cat synthesizer but compatible with any analog synthesizer
  or CV-equipped instrument. It addresses the practical challenge of managing multiple modulation
  parameters simultaneously during live performance through an innovative joystick interface.

  The core of the device is a return-to-zero spring-loaded joystick that assigns independent
  modulation outputs to each of its four directional axes. Pulling the joystick forward might produce
  vibrato, rightward movement could control pitch bend, leftward position might modulate filter
  cutoff, with automatic return to zero upon release. This approach allows performers to intuitively
  control multiple modulation sources with a single hand gesture.

  Internally, the CATSTICK houses two LFOs with selectable waveforms including sawtooth, square, and
  triangle, along with four voltage-controlled amplifiers. Sixteen jacks provide access to
  independent and mixed control voltages with independent VCA operations, enabling sophisticated
  patch routing well beyond simple modulation duties. Applications extend to audio panning systems
  and deep modular synthesizer integration.

  The device remains a cult favorite among analog synthesizer enthusiasts for its hands-on approach
  to real-time sound manipulation.
specs: |-
  - Type: Modulation controller
  - Interface: Spring-loaded return-to-zero joystick
  - LFO: 2 with sawtooth, square, triangle waveforms
  - VCA: 4 internal
  - Jacks: 16 total (independent and mixed CV)
  - Control: CV input/output
