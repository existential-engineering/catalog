details: |-
  Want to smooth out attack and release on your signals, but don't want to sacrifice too much space in your case? Quadar is an analog 4 channel slew rate limiter that can be used as an attack/release envelope generator. Send in any signal to independently control the attack time and release time with the A and R knobs. Technical Specs:
  - 3U x 6HP x 25 mm deep
  - Current Draw: 10mA @ 12V, 10mA @ -12V

  Order processing is usually 1-2 days.
