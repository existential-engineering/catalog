description: "When you get into eurorack, you'll inevitably come across the old
  adage: you can never have enough VCAs. Each of the four VCAs has independent
  level control, bipolar CV inputs with attenuators and LED indicators,
  adjustable linear/exponential response, and a +6dB boost switch."
details: |-
  The Quad VCA comprises four channels of voltage controlled amplifiers. Each channel is equipped with a 6dB boost, a LEVEL control, and the CV input response can be swept between linear and exponential. Additionally, the outputs of these channels are cascaded from left to right, allowing Quad VCA to function as a four channel mixer.
specs: |-
  - Width: 12HP
  - Depth: 29mm
  - Power: 65mA @ -12V, 65mA @ +12V
  - Manual LEVEL control per VCA
  - Dedicated CV attenuators with dual color LEDs for bipolar CV monitoring
  - Continuously adjustable response from linear to exponential per VCA
  - Each CV input normalled to the adjacent one for cascaded control
  - Each output normalled to the mix input of the adjacent one (submixing, or 4th output as main mix)
  - +6dB boost switch per VCA (doubles output level)
releaseDate: "2017-01-29"
