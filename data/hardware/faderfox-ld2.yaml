description: LD2 is a special controller for jump free control of continuing
  parameters, optimized for Ableton Live, with 16 push encoders switchable to 6
  groups.
details: |-
  LD2 is a controller for Ableton Live, built for jump free control of continuing parameters. It belongs to the Faderfox micromodul line, and the Live internal control surface 'LV2_LX2_LC2_LD2' automaps all controls, so the setup files shipped with the controller are no longer necessary.

  The panel carries 16 push encoders switchable to 6 groups, with different push button modes: CC toggle, note commands like a midi keyboard, and an acceleration function by holding down the push buttons. Rotary mode (absolute or relative), CC and note numbers in groups of 16 ascending numbers and the acceleration function are programmable, and 12 setup memories store the programmings. Track select with two buttons covers the Live modes 1-track-control and 4-track-control, which can also be remote controlled by LV2, LX2 or LC2.

  Parameter feedback of button statuses and CC values is indicated by encoder LEDs and a 13-part LED bar. 36 LEDs in different colors display various information, with low basic lights of all LEDs for better orientation in dark club atmosphere.

  Power comes from standard or rechargeable batteries, 3 x AA cells with a lifetime of about 30 to 60 hours, supported by a powersave mode after 10 minutes of the last movement and LED battery control. A socket takes an optional external power adaptor of 4.5 to 6 V DC at a minimum of 100 mA.

  The casing is a very compact black plastic desktop format of 180 x 105 x 70 mm at 450 g, with a silver aluminium front plate with anodised coating (abrasion resistant) and inscriptions. The controller is independent of operating system and computer type (PC or Mac) due to the midi interface, so no driver is necessary, and the system is expandable by other micromodul controllers through easy chaining by midi connections. It is compatible to the 1st and 2nd micromodul line, using the same CC and note numbers as LV1, LX1, LV2, LX2 and LC2.
specs: |-
  - 16 push encoders, switchable to 6 groups
  - Push button modes: CC toggle, note commands like a midi keyboard, acceleration function by holding down the push buttons
  - Programmable rotary mode (absolute/relative), CC/note number in groups of 16 ascending numbers, acceleration function
  - Track select with two buttons for the Live modes 1-track-control and 4-track-control, also remote controllable by LV2/LX2/LC2
  - 12 setup memories to store the programmings
  - Parameter feedback of button statuses and CC values by encoder LEDs and a 13-part LED bar
  - 36 LEDs in different colors
  - Midi-merge function
  - Battery powered by 3 x AA standard or rechargeable cells, lifetime about 30 to 60 hours
  - Socket for an optional external power adaptor (4.5-6 V DC, min. 100 mA)
  - Powersave mode after 10 minutes of the last movement
  - LED battery control
  - Black plastic desktop casing, 180 x 105 x 70 mm, 450 g
  - Silver aluminium front plate with anodised coating and inscriptions
  - Independent of operating system and computer type (PC or Mac) due to the midi interface, no driver necessary
  - Connects over MIDI to the computer's sound card or MIDI interface (a USB MIDI interface when the computer has none)
  - Requires Ableton Live (as of version 4.1) or software which allows user assignments of continuous parameters (CC) and note commands
  - Expandable by other micromodul controllers through midi chaining
  - Compatible to the 1st/2nd micromodul line (same CC/note numbers as LV1, LX1, LV2, LX2, LC2)
