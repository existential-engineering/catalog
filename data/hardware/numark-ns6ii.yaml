url: https://www.numark.com/product/ns6ii
description: NS6II 4-Channel Premium DJ Controller.
details: |-
  The NS6II builds on the NS6's legacy of innovation and performance, delivering a 4-channel DJ controller with two USB outputs and built-in high-resolution screens. The flagship NS6II is a true 4-channel premium DJ controller for the modern DJ.

  NS6II features dual USB ports enabling simultaneous connection of two laptops for seamless DJ hand-offs. Built-in 2-inch color LCD displays in each jog wheel provide critical performance feedback. Numark's exclusive touch-capacitive frequency knobs allow for tactile EQ adjustment.

  The controller features 6-inch multi-function jog wheels with capacitive technology, a 100mm pitch fader and a replaceable crossfader for serious performance use. Rubber MPC-style performance pads with velocity sensitivity provide expressive control over cues, loops and samples.

  NS6II includes 4-channel USB audio capability and operates as a standalone mixer (24-bit, 44.1 kHz audio) with two phono preamps. The controller comes with the full version of Serato DJ and supports an optional Serato DJ DVS expansion for time-coded vinyl control.
specs: |-
  - 4-channel premium DJ controller
  - Dual USB ports for simultaneous connection of two laptops (DJ hand-offs)
  - Built-in 2-inch color LCD displays in each jog wheel
  - Touch-capacitive frequency knobs (exclusive to Numark) for EQ adjustment
  - 6-inch multi-function capacitive jog wheels
  - 4-channel USB audio (4 in, 4 out) with 2 phono preamps
  - Standalone mixer functionality
  - 24-bit, 44.1 kHz audio
  - Replaceable crossfader
  - 100mm pitch fader
  - Rubber MPC-style velocity-sensitive performance pads
  - Comes with the full version of Serato DJ
  - Optional Serato DJ DVS expansion supported
  - Balanced Master Output (XLR): 20 Hz–20 kHz (+0.2 dB), 109 dB SNR (A-weighted), 0.001% THD+N, +24 dBu max
  - Unbalanced Master Output (RCA): 20 Hz–20 kHz (+0.1 dB), 109 dB SNR (A-weighted), 0.002% THD+N, +16 dBV max
  - Booth Output (RCA): 20 Hz–20 kHz (+0.1 dB), 109 dB SNR (A-weighted), 0.004% THD+N, +16 dBV max
  - Headphone Output: 20 Hz–20 kHz (+0.2 dB), 104 dB SNR (A-weighted), 0.011% THD+N, +19 dBu max unloaded, 55 mW RMS per channel into 32Ω
  - Line Inputs (RCA): 20 Hz–20 kHz (+0.1 dB), 102 dB SNR (A-weighted), 0.002% THD+N, +8 dBV max
  - Phono Inputs (RCA): 93 dB SNR (A-weighted), −22 dBV max at 1 kHz
  - Mic Inputs (1/4" TRS): −18 dBu max
