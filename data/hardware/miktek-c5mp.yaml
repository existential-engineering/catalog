details: |-
  The Miktek C5 pencil condenser provides discerning engineers with a valuable new tool for the critical recording of acoustic instruments. The C5, fitted with our MK5a, 0.5-inch cardioid capsule, produces a super-linear, full-bodied response. The capsule employs a 5-micron tensioned Mylar diaphragm, on which a 0.4-micron layer of evaporated gold is applied. Tight tolerances and special attention to precise machining of the backplate, and acoustical porting, produces an off-axis response that ensures the accuracy of the microphone. Also included are the MK5bMP (matched pair) omni capsules. Specifications

