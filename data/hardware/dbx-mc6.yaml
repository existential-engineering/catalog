details: |-
  The dbx MC6 is a zone controller faceplate designed for dbx zone management and distribution systems. It provides local control capabilities in portable, tour, and studio applications.

  As a control surface, the MC6 enables users to adjust parameters such as volume and source selection at the zone level, interfacing with compatible dbx distribution and zone management hardware.

  Note: This product is discontinued.
