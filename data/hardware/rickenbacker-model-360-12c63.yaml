details:
  - Created to exact original specifications of the world's most popular
    12-string electric guitar, the 360/12C63 is an accurate replica of the model
    George Harrison made so famous. Complete with double-bound body, trapeze
    tailpiece, and unique Rickenbacker 12-string headstock, the 360/12C63 is
    true to the 1963 version in every aspect— down to the shading on the Fireglo
    finish.
