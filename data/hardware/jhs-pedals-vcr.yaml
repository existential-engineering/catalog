description: A three-in-one multi-effect pedal combining a transistor boost,
  classic 1980s-style chorus, and hall reverb with individual bypass toggles and
  a master footswitch.
details: |-
  The VCR (later renamed Space Commander) brings vintage 1980s chorus and reverb sounds with a powerful clean boost on board. With simple controls and the ability to use each effect separately or engage all three effects with one stomp, it offers a complete spacey effects solution.

  The Space Commander / VCR is three effects in one, with a one-knob control for each effect: Boost, Chorus, and Reverb. Each effect is independently engaged by a toggle below the knob, and the pedal's master on/off is the footswitch. The Boost is a simple but powerful transistor boost for added volume or natural amp breakup. The Chorus is a classic swirling 1980s style chorus — increasing the Chorus control increases speed while decreasing depth, and vice versa. The Reverb is a hall reverb with a mix knob from fully dry to fully wet.

  Version History: V1 = VCR graphics. V2 = Updated to Space Commander graphics/name. JHS also offered a re-casing service to convert VCR units to Space Commander cases for $35 plus shipping.
