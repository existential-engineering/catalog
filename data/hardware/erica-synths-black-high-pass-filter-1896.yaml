details: |-
  The Black High Pass VCF is designed for analogue purists who take sound design seriously. It is a highly stable, 24dB per octave resonant high pass filter with voltage control over both cutoff and resonance, and a cutoff CV attenuverter sets the amount and the polarity of incoming modulation.

  Two bonus features sit on the panel. A built-in post-filter overdrive circuit with a user adjustable drive amount adds dirt after the filter rather than before it, and gain loss compensation keeps the level up when resonance is pushed high.

  The Black Filter Coupler connector lets the module be tied to its siblings. Used in combination with the Black Low Pass VCF and the Black Filter Coupler, the three parts make a holy trinity of VCFs for an analogue modular system.

  The module is 35mm deep and accepts CV between -10V and +10V. Power draw is 25mA on the positive rail against 29mA on the negative one.
specs: |-
  - 24dB/oct resonant high pass VCF
  - CV level -10V - +10V
  - Module depth 35mm
  - Power consumption +25mA; -29mA
  - Voltage control over cutoff and resonance
  - Gain loss compensation on high resonance
  - Cutoff CV attenuverter
  - Adjustable post filter overdrive circuit
  - Black Filter Coupler connector
