id: 8aN0ZOncpXgFnG7zngcWU
name: Scratch
manufacturer: numark
primaryCategory: mixer
url: https://www.numark.com/product/scratch
description: 24-Bit 2-Channel Scratch Mixer for Serato DJ Pro with Innofader
  crossfader, performance pads, and DVS license included.
details: |-
  A professional 2-channel scratch mixer featuring an all-metal build designed for DJs at an affordable price point. The device combines performance features with software integration for both digital and vinyl DJing.

  Includes an Innofader crossfader with reverse and slope controls, 6 software-based effects with toggle paddles and dry/wet control, 4 performance pads per deck for cues, rolls, and samples, a dedicated instant loop encoder, filter knobs for audio sweeps, and a dual headphone output cueing system. The mixer is DVS (Digital Vinyl System) ready and ships with a Serato DJ Pro DVS license.
specs: |-
  - 24-bit digital sound quality
  - 2-channel scratch mixer
  - All-metal build
  - Innofader crossfader with reverse and slope controls
  - 6 software-based effects with toggle paddles and dry/wet control
  - 4 performance pads per deck for cues, rolls, and samples
  - Dedicated instant loop encoder
  - Filter knobs for audio sweeps
  - Dual headphone output cueing system
  - DVS (Digital Vinyl System) ready
  - Serato DJ Pro with DVS License Included
  - Internal 100V-240V universal voltage power supply
  - Dimensions: 12.05" (L) x 9.61" (W) x 3.32" (H)
