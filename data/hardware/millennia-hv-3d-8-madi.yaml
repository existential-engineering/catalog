description: The HV-3D-8-MADI is an eight channel transformerless microphone
  preamplifier in a 2U steel rack chassis fitted with a MADI digital output.
  Each channel carries a 36-step gain control and a balanced path to a
  laser-trimmed FET output stage.
details: |-
  The HV-3D-8-MADI puts eight channels of the Millennia HV-3 microphone preamplifier in a welded 16 gauge steel 19 inch chassis two rack units high, with a MADI digital output fitted. The transformerless design uses a matched high-speed discrete transistor octet with +23 dBu of input headroom, so no attenuator pad is required.

  Gain runs from 8.5 dB to 60 dB on 36-step switched controls at 1.5 dB per step, stereo matched to 0.08 dB, with up to 70 dB available on request. The laser-trimmed FET-based output stage carries 32 dB of headroom and is rated to drive cable runs of 1000 feet (300 m), and the balanced audio path is specified under 5 ppm THD.

  Switching uses Grayhill mil-spec gold contacts and the universal supply accepts 100 V to 240 V at 50 or 60 Hz. Phantom powering is +48 V dc, and a non-phantom 130 V DPA (B&K) microphone powering input is available as a per-channel option alongside a ribbon-optimized DC coupled input and an extra 10 dB of gain at no charge.

  The digital specification block published on this page is the Dante table shared with the HV-3D-8 Dante build, covering Ethernet on dual RJ-45 ports at 1 Gbps, sample rates from 44.1 kHz to 192 kHz and a minimum latency of 250 microseconds. The page states no medium, connector or channel count for the MADI output itself.
specs: |-
  - Minimum Gain: 8.5 dB
  - Maximum Gain (1.5 dB per step, 36 steps): 60 dB (up to 70 dB on request)
  - Frequency Response (+0 / -3 dB): sub 8 Hz to beyond 300 kHz (sub 3 Hz by request)
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -133 dB EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +27 dBu Out): < .001%, Typ. < .0005% (< 5 ppm)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, +27 dBu Out): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +27 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +23 dBu (no attenuator pads required)
  - Maximum Output Level (20 Hz - 40 kHz): +32 dBu
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - DPA (B&K) Mic Powering: +130 V dc max (non-phantom)
  - Phantom Powering: +48 V dc, +/- 4 V dc
  - Power Consumption: 45 watts maximum
  - Power Requirements: 100V to 240V, 50/60 Hz
  - Dimensions/Shipping Weight: 19 in W x 3.5 in H x 12.5 in D, 23 lbs.
  - Dante Physical Layer: Ethernet
  - Dante Connectors: Dual RJ-45 (Primary / Secondary)
  - Dante Cable Quality: CAT-5e or better
  - Dante Transmission Speed: 1Gbps
  - Dante Supported Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 176.4kHz, 192kHz
  - Minimum Dante Latency: 250 µS
  - Dante Supported Modes: Redundant / Switched
  - AES67 Support: Planned (Dante embedded)
  - Certifications: FCC CFR 47 Part 15 Subpart B Class A, ICES-03 Issue 6 (Canada), ANSI C63.4-2014, EN 55032:2015, EN 55035:2017, EN 61000-3-2:2014, EN 61000-3-3:2013
  - Compliance: RoHS 2011/65/EU (and delegated directive (EU) 2015/863), WEEE 2012/19/EU, REACH
  - Environmental: 0 to +40 C / +32 to +104 F, 10% to 80% RH, maximum altitude 3,000 meters
