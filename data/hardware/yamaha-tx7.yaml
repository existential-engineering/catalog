description: >-
  The Yamaha TX7 is a desktop FM tone generator module containing the same
  6-operator synthesis engine as the legendary DX7, offering authentic DX7
  sounds in a compact, affordable non-rack format.
details: |-
  Introduced in 1985, the TX7 gave musicians access to Yamaha's groundbreaking DX7 FM synthesis engine without the cost or bulk of the full keyboard instrument. It is essentially the DX7's sound engine repackaged as a compact desktop module, sharing the same 6-operator architecture with 32 algorithms that defined the sound of 1980s pop, rock, and electronic music.

  The TX7 lacks any front-panel editing controls, so sound programming must be done externally via MIDI using a DX7 keyboard, Yamaha's PR-7 programmer, or computer-based editor software such as Unisyn. This limitation reflects both the era's approach to expander modules and the inherent complexity of FM synthesis programming, which is challenging enough even on a fully equipped DX synthesizer.

  With 16-voice polyphony and storage for 32 patches, the TX7 is a straightforward instrument. The LFO offers triangle, sawtooth, square, sine, and random waveforms, while six envelope generators with eight parameters each provide detailed control over each operator's behavior. Loading patches from the vast library of DX7-compatible sounds available online is generally more practical than programming from scratch.

  The TX7 found its way into studios belonging to Genesis, the Human League, and the producers behind the Spice Girls. It remains an affordable entry point for anyone seeking authentic first-generation DX7 FM tones.
specs: |-
  - Polyphony: 16 voices
  - Monotimbral (1 part)
  - 6 FM operators with 32 algorithms
  - LFO: Triangle, Sawtooth, Square, Sine, Random waveforms
  - 6 envelope generators with 8 parameters each
  - 32 patch memory
  - No keyboard (desktop module)
  - MIDI
