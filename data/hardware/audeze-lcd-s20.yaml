description: Closed-back planar magnetic headphone offering extended, dynamic
  bass with lifelike punch and noise isolation for professional studio tracking
  and recording.
details: |-
  LCD-S20 delivers studio-grade precision in an affordable closed-back model, trusted by professional recording studios worldwide.

  Features the latest advancements for spatial audio detail reproduction, engineered with SLAM technology in California workshops. Planar magnetic drivers paired with SLAM (Symmetric Linear Acoustic Modulator) deliver dynamically powerful bass that maintains clarity at high volumes without muddiness.

  Tracking and recording features include bidirectional passive noise reduction that prevents microphone bleed, low distortion that protects hearing, pinpoint impulse response that aids timing accuracy, and broad compatibility with interfaces, mixers, laptops, and mobile devices.

  Premium construction uses magnesium, aluminum, and steel with magnetically-attached earpads. The adjustable leather suspension headband and gel-filled earpads, combined with acoustically-dampened cloth-covered earcups, provide isolation and long-wear comfort.
specs: |-
  - Style: Over-ear, closed-back
  - Transducer type: Planar magnetic
  - Magnetic structure: Fluxor magnet array
  - Magnet type: Neodymium N50
  - Phase management: Fazor
  - Acoustic management: SLAM
  - Diaphragm: Ultra-Thin Uniforce
  - Transducer size: 90 mm
  - Maximum SPL: >120dB
  - Frequency response: 10Hz - 40kHz
  - THD: <0.1% @ 100dB SPL, 1kHz
  - Impedance: 18 ohms
  - Sensitivity: 93 dB/1mW (Drum Reference Point)
  - Maximum power handling: 5W RMS
  - Minimum power requirement: >100mW
  - Recommended power level: >250mW
  - Weight: 550g
  - Cable: 2.5m (8.2ft), 3.5mm stereo jack with 3.5mm to 6.3mm adapter included
