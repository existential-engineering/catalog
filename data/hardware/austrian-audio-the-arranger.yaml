description: The Arranger is an open-back reference headphone for a new
  generation of listeners. Built around a 44mm high-excursion driver with a
  DLC-coated diaphragm and proprietary ring magnet design, it delivers
  immersive, natural sound with clarity, depth, and bass extension down to 5Hz.
  The foldable, 100% serviceable design features soft suede leatherette ear pads
  and robust metal construction, with low impedance making it compatible with
  mobile devices as well as studio gear. Crafted in Europe and backed by up to a
  5-year warranty.
details: The Arranger uses a 44mm high-excursion driver with a DLC (Diamond-Like
  Carbon) coated diaphragm and a proprietary ring magnet design. Open-back,
  over-ear design for a natural, spacious soundstage. Ships with a detachable 3m
  TRS cable (3.5mm) plus 3.5mm-to-6.3mm adapter; compatible with optional
  balanced Pentaconn and 5-pin XLR cables. Foldable, fully serviceable with
  user-replaceable ear pads and headband. Crafted in Europe. VGP 2026 Summer
  award winner.
specs: |-
