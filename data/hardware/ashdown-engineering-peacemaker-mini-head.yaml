description: A hand-built UK guitar head delivering US and UK-inspired voicing
  from premium JJ Electronics ECC83 preamp tubes in a compact, lightweight
  design. A single-channel preamplifier with two voiced inputs and Dark & Light
  voicing dials in the tones of both US and UK amplifiers, from shimmering
  cleans to searing overdrive. Bass, Middle, Treble, Gain, and Volume controls
  give complete command, with up to 2 watts of output from a JJ Electronics 6V6
  valve into 8-16 ohm outputs. A headphone output with load allows silent
  practice. Housed in a birch plywood cabinet wrapped in classic Tolex.
details: |-
  Hand-built in the UK, built to order. Single-channel preamp with two voiced inputs; Dark & Light voicing for US/UK styles. 2 x JJ Electronics ECC83 preamp tubes. Bass, Middle, Treble, Gain, Volume controls. Headphone output with load. Up to 2W output from 1 x JJ Electronics 6V6 valve. 8-16 ohm output. Birch plywood, Tolex-covered classically styled cabinet.
specs: |-
  - Single-channel preamplifier with two voiced inputs
  - Dark & Light voicing (US/UK styles)
  - Preamp tubes: 2 x JJ Electronics ECC83
  - Power valve: 1 x JJ Electronics 6V6
  - Power output: up to 2 watts
  - Controls: Bass, Middle, Treble, Gain, Volume
  - Headphone output with load
  - Speaker output: 8-16 ohm
  - Cabinet: birch plywood, Tolex covered
  - Weight: 7.5 kg
  - Dimensions: 220mm x 405mm x 190mm
