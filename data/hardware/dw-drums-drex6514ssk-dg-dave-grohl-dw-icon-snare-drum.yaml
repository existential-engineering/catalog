description: The Sound City DW Collector's Series Icon was created to pay homage to legendary DW artist Dave Grohl.
details: |-
  Dave Grohl's illustrious career has been marked by legendary bands and compelling projects. His ICON snare drum celebrates his self-produced Sound City documentary, as well as his personal studio that now houses the sacred Sound City console.

  The visionary's face adorns the all-maple drum, as well as his feather tattoo artwork and the logos of both recording studios, all laser-cut from 1/36″ veneer and hand inlayed into a background of teal-dyed Exotic Birdseye Maple. Nickel-plated hardware complements the eye-catching color scheme.

  Other features include an 11-ply North American Hard Rock Maple VLT shell, True-Hoops, True-Pitch 50 Tuning, True-Tone Snare Wires, and a MAG throw-off with 3P butt plate. A deluxe DW carrying case, legend and Sound City hat are also included.

  Only 250 were produced.
specs: |-
  - 11-ply North American Hard Rock Maple shell
  - Laser-cut, hand-inlayed wood graphics
  - Teal-dyed Exotic Birdseye Maple background
  - Nickel-plated hardware
  - MAG throw-off with 3P butt plate
  - True-Hoops, True-Pitch 50 tuning, True-Tone snare wires
  - Limited to 250 drums worldwide
  - Size: 6.5x14
