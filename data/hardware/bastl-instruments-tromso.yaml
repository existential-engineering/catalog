url: https://bastl-instruments.com/eurorack/modules/tromso
description: "Compact 5HP utility combining VCO, Comparator, and Sample & Hold
  with internal normalization, functioning as a voltage controllable analog
  downsampler. Inspired by the 1994 Distortotron machine. VCO triangle wave with
  high (15Hz–45kHz) and low (50s–50Hz) range, tracks ~5 octaves at 1V/oct. Mode
  switch: Sample & Hold vs Track & Hold."
details: |-
  5HP, 45mm depth. +12V <35mA, -12V <35mA. VCO triangle wave, high/low range.
