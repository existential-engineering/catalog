details:
  - The uafx anti 1992 high gain amp is a digital guitar pedal that recreates the iconic 120-watt tube amp sound associated with modern metal genres. It delivers a wide range of tones from crystalline cleans to bone-crushing high-gain distortion, capturing the aggressive sound of bands like slipknot and machine head.
  - The pedal features multiple tone-shaping capabilities, including a built-in noise gate, ts-style overdrive, and an integrated preamp boost. Musicians can explore six carefully modeled mic and speaker combinations, allowing them to craft sounds ranging from scandinavian death metal to american thrash with precision and versatility.
  - Users can control the anti 1992 through the uafx control app, which enables deep tone customization, preset management, and artist tone loading. The pedal offers Bluetooth and hardwired connectivity, with the ability to save up to four onboard presets and access a live mode for dynamic performance control.
  - The anti 1992 provides extensive connectivity options, including a rear panel USB-to-MIDI connection that allows integration into programmable MIDI rigs. It supports real-time control of boosts, eq, and other parameters, making it a flexible tool for modern guitarists.
  - Powered by a 9v dc isolated power supply, the pedal requires 400 ma for full-sized models and can be updated via USB-c using the ua connect application. It is compatible with both desktop and mobile apps for comprehensive control and firmware management.
