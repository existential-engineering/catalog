description: The DN370B is a dual channel 30 band graphic equaliser with
  enhanced Proportional-Q response, swept high-pass and low-pass filters and two
  swept notch filters per channel. It adds transformer balanced outputs with
  high-drive capability for full galvanic isolation, and carries Phoenix-style
  connectors for installation use.
details: |-
  The enhanced Proportional-Q equalisation offers advantages over Constant-Q graphic equalisers. At low amounts of cut or boost the filter width is relatively broad, allowing gentle contouring of the frequency spectrum, and it becomes progressively narrower as the amount of boost or cut is increased. The response also minimises interaction between adjacent frequency bands, allowing subtle tonal correction without frequency response ripple.

  The graphic equalisation section is augmented with continuously swept filters. The control knobs incorporate a push function to switch a filter in and out whilst maintaining the frequency setting, and feature illuminated LED rings for status display. The 12 dB/oct high-pass filter covers 20 Hz to 500 Hz and the 12 dB/oct low-pass filter covers 2 kHz to 20 kHz.

  The two notch filters have overlapping frequency ranges of 20 Hz to 2 kHz and 200 Hz to 20 kHz, allowing surgical removal of resonances and feedback with minimal effect on the rest of the programme material. Overlapping the notch filters with each other and with the graphic equaliser bands allows up to 45 dB of attenuation. A channel gain control covers -8 dB to +6 dB.

  The graphic equaliser section uses centre-detented long-throw 45 mm precision oil-damped faders over a ±12 dB range, with a ±6 dB range for finer resolution. Channel bypass and range selection switches are provided, and the faders carry protective covers against dirt and dust.

  Transformer-balanced outputs with high-drive capability allow the unit to be used in-line over long cable runs as well as on a console insert. Power-off bypass relays preserve the signal path in the event of a power failure, and the recessed front panel power switch avoids accidental operation. The rugged steel 3U rackmount enclosure uses premium industry-standard connectors.
specs: |-
  - Dual channel, 30 band graphic equalisation per channel
  - Enhanced Proportional-Q filter response
  - Transformer balanced outputs with high-drive capability for full galvanic isolation
  - Fader range: ±12 dB, switchable to ±6 dB
  - 45 mm centre-detented long-throw oil-damped precision faders with protective covers
  - High-pass filter: 12 dB/oct, 20 Hz to 500 Hz, continuously swept
  - Low-pass filter: 12 dB/oct, 2 kHz to 20 kHz, continuously swept
  - Two swept notch filters per channel, 20 Hz to 2 kHz and 200 Hz to 20 kHz
  - Up to 45 dB attenuation using notch filters with the graphic equaliser bands
  - Channel gain range: -8 dB to +6 dB
  - Power-off bypass relays
  - Phoenix-style connectors provided for installation
  - 3U rugged steel rackmount enclosure
  - Auto-voltage-sensing universal switch-mode power supply
