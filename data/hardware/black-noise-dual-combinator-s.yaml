description: A 1U mixer module combining Averager and Unity Gain mixer designs,
  offering low-noise, distortion-free mixing. It can function as a dual-channel
  mixer for up to 4 inputs, or a single-channel mixer for up to 7 inputs.
details: |-
  DC-S is a unique and innovative module that combines the strengh of both Averager and Unity Gain mixers without their weaknesses. Along with some additional unique features that make it stand out from other mixers on the market. To create DC-S we had to rethink the mixer, start from scratch, try new design, prototype many circuits and fail in order to succeed. The result is DC-S a new type of mixer that offer low noise floor, stable output signal and mix accurately signal without introducing any distortion, clipping, attenuation or unwanted noise and those regardless of the number of inputs signals or their gain. We called this new mixer design a «Combinator,» and the name «DC-S» stands for «Dual Combinator.» This versatile mixer can function as a dual-channel, mixing up to 4 inputs into a single output, or as a single-channel, allowing up to 7 inputs to be mixed into a single output. We put time and effort into the design of DC-S because we think that it is an essential module in any eurorack system. It offers a ratio size, functionality, simplicity that no other mixer offers. DC-s may seem like a simple utility module, but make no mistake, small things done well can make a big difference.
