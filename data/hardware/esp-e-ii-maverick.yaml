description: ESP E-II instruments, formerly known as “ESP Standard Series,” are
  made in Japan at the ESP factory by highly skilled builders. The ESP E-II
  Maverick offers smooth, flowing curves and a slightly asymmetrical shape that
  truly stands out from the crowd of typical guitars, and is designed with the
  superb tones, smooth and fast playability, and excellent reliability needed
  for touring and professional recording. Built with neck-thru-body construction
  at 25.5” scale for superior sustain and smooth, fast access to the highest
  frets, the E-II Maverick offers an alder body with ESP’s exclusive Andromeda
  II Satin finish, which changes color from shades of blue to purple, green and
  even gold depending on the angle the light that hits it. It’s paired to a
  three-piece thin U-shaped maple neck with ebony fingerboard and 27 extra-jumbo
  stainless steel frets. Components on this guitar include black hardware, a
  Floyd Rose Original double-locking tremolo bridge, ESP strap locks, Gotoh
  locking tuners, an a truly outstanding passive pickup set with a Seymour
  Duncan TB-14 Custom-5 Trembucker in the bridge — splittable via push-pull
  control — and a Seymour Duncan SCR-1 Cool Rails in the neck position. Includes
  ESP form-fit case.
