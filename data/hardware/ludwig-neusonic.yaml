details: |-
  The latest era of Ludwig's award-winning NeuSonic series is here. Designed for the high-velocity working drummer, NeuSonic offers unrivaled tone, upgraded premium drum finishes, and lightweight portability. The series is positioned as the only drum set redefining USA-made affordability — authentic Ludwig quality and professional capabilities, trusted for over a century.

  This new era focuses on an updated shell construction, new Rapid Tom sizes, and stunning new looks. Formed at the factory in Monroe, NC, USA, NeuSonic shells use a 7-ply crossover design made up of a 4-ply maple exterior and 3-ply cherry interior, measuring 5.5mm thick. The design produces full-range tuning and optimum sustain, with a 45-degree bearing edge cut to a 1/16" back cut.

  NeuSonic outfits come in five standard configurations — Downbeat, Fab, Pro Beat, Mod2, and Rapid Mod2 — covering 20"-24" bass drums, 10"-13" rack toms, and 14"-16" floor toms. A full component program is also available, with tom sizes from 6" to 13", bass drums from 14" to 24", floor toms from 14" to 16", and a 6.5" matching snare.

  Kits are available in seven finishes: Silver Silk, Satin Diablo Red, Satin Golden Slumbers, Satin Royal Blue, Titanium Super Sparkle, Blue Super Sparkle, and Merlot Super Sparkle. Hardware includes Mini-Elite Lugs, Low Mass Claw Hooks, Elite Spurs, Triad Leg Brackets, Triad Tom Bracket, and a Virgin Kick Drum configuration.

  All NeuSonic outfits now ship standard with Evans USA heads: G1 Coated tom batters, G1 Clear tom resonants, EQ4 bass drum batter, EQ3 bass drum resonant, and a G1 Coated batter with Hazy 300 resonant on the matching snare.
specs: |-
  - 7-ply crossover shell: 4-ply maple exterior, 3-ply cherry interior, 5.5mm thick
  - 45-degree bearing edge with 1/16" back cut
  - Formed at Ludwig USA factory in Monroe, NC
  - Standard outfits: Downbeat (14x20 BD, 14x14 FT, 8x12 TT); Fab (14x22 BD, 16x16 FT, 9x13 TT); Pro Beat (14x24 BD, 16x16 FT, 9x13 TT); Mod2 (14x22 BD, 16x16 FT, 8x12 + 7x10 TT); Rapid Mod2 (14x22 BD, 14x16 FT, 7x12 + 6x10 TT)
  - Component drums: 6"-13" toms, 14"-24" bass drums, 14"-16" floor toms, 6.5"x14" matching snare
  - Finishes: Silver Silk, Satin Diablo Red, Satin Golden Slumbers, Satin Royal Blue, Titanium Super Sparkle, Blue Super Sparkle, Merlot Super Sparkle
  - Hardware: Virgin Kick Drum, Mini-Elite Lugs, Low Mass Claw Hooks, Elite Spurs, Triad Leg Brackets, Triad Tom Bracket
  - Heads: Evans G1 Coated tom batters, G1 Clear tom resos, EQ4 bass batter, EQ3 bass reso, G1 Coated snare batter, Hazy 300 snare reso
