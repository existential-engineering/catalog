details: |-
  The AEA R44C is a museum-quality modern replica of the 1936–38 RCA 44BX ribbon microphone, handcrafted in Pasadena, CA. All R44 series microphones are detailed, hand-crafted replicas using parts made to be interchangeable with an original RCA 44, with ribbon material that meets or exceeds original RCA specifications.

  At the core, every passive version of the R44 sounds the same when powered with a ribbon preamp. The R44C is the flagship model with original museum-quality exterior cosmetics, while the R44CE uses cost-effective exterior components — both sharing identical internals and sound.

  The R44 is celebrated for its unparalleled warmth, legendary character, full and rich tonality, generous low end, and strong proximity effect. Critics and engineers have described it as smooth and creamy on top — almost like the effect of recording to tape — smoothing frequency peaks and dynamics in a completely transparent way.

  For passive R44 models, the preamp is critical for optimum performance. Preamp gain should be at least +60 dB or higher with a very high input impedance (above 5K ohm). AEA's RPQ3, RPQ503, TRP500, and TRP3 preamps were specially designed for ribbon microphones and are highly recommended.
specs: |-
  - Polar pattern: Figure-8 (bidirectional)
  - Transducer type: Passive ribbon
  - Handcrafted in Pasadena, CA, USA
  - Replica of the 1936–38 RCA 44BX
  - Ribbon material meets or exceeds original RCA specification
  - Requires preamp with minimum +60 dB gain and high input impedance (>5K ohm)
  - Dimensions: 12.4 × 4.65 × 3.1 in
  - Weight: 6.5 lbs
  - Full and rich tonality with generous low end and strong proximity effect
