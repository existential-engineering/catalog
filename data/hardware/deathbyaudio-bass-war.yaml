url: https://deathbyaudio.com/products/bass-war
description: We've hit a new low. From this moment forward, the power and
  intensity of bass fuzz is changed forever. The Bass War by Death By Audio is a
  louder, wider-ranging, earth-shaking bass fuzz that can get more oomph than
  any other pedal we've ever heard.
details: |-
  The Bass War began as an idea to make a version of the Fuzz War even more perfect for bass. It is a harmonically rich octave fuzz with extraordinary levels of gain, a massive tone sweep, and a MIX control, delivering more volume, more tones, more fuzz, and more sonic syrup than expected. The super-extended control ranges dial in wildly different tones that stay surprisingly useful and heavy, all wrapped in a DBA punk-style raw enclosure with spray-painted graphics.

  VOLUME controls the overall output level from -inf to +27 dB, with roughly unity volume near 10 o'clock and a capacity for extreme loudness. FUZZ controls the gain from +16 to +64 dB, ranging from raunchy drive to smooth fuzz to overloaded insanity. TONE is a deep notch filter tuned from 98 Hz to 3.3 kHz that radically reshapes the fuzz across a massive range. MIX blends between your clean sound and the fuzz, keeping notes articulate and bassy against the huge fuzz circuitry.
specs: |-
  - Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel
  - Current Draw: 33 mA
  - Dimensions: 5.9" x 4.73" x 2.24" (including hardware)
  - Weight: 15.5 oz.
