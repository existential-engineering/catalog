description: SUPER FILTER combines a musical set of high and low pass filters with a meticulously tweaked multi-stage saturation circuit, inspired by the analog character of tape. If you are recording digitally and seeking mix-ready analog tones, then this handy module is one that belongs in your tool box.
details: |-
  SUPER FILTER addresses four sonic elements that give tape its character: subsonic roll-off, tape head bump (30–70 Hz), soft transient clipping, and harmonic generation. The high pass filter offers four musically tuned frequencies (23, 50, 80, 120 Hz) at 12 dB/oct. The 23 Hz setting features a tape-like 'head bump' at 45 Hz inspired by the MCI JH-110A tape deck. The VINTAGE low pass filter (6 dB/oct), derived from the Silver Bullet design, adds top-end softening. The multi-stage saturation circuit adds 2nd and 3rd order harmonics for presence and punch, with soft-clipping that helps prevent A/D converter clipping. Individual jumper bypass controls are provided for the HPF, VINTAGE, and SAT circuits. Eight recommended preset configurations are included: Very Analog (HPF=23 Hz, LPF=BYP, SAT=IN), Fat Bass (HPF=23 Hz, LPF=IN, SAT=IN), Tight and Clean (HPF=23 Hz, LPF=BYP, SAT=BYP), Kick/Snare/Toms (HPF=23 Hz, LPF=IN, SAT=IN), Drum Overheads (HPF=50 Hz, LPF=BYP, SAT=IN), Electric Guitars (HPF=80 Hz, LPF=IN, SAT=IN), Vocals/Acoustic Guitars (HPF=120 Hz, LPF=BYP, SAT=BYP), General Purpose Lo-Cut (HPF=50 Hz, LPF=BYP, SAT=BYP). Analog plugin compatible with Chroma.
