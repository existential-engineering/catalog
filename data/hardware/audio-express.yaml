name: Audio Express
manufacturer: motu
primaryCategory: audio-interface
url: https://amzn.to/4l5MmJo
description: Audio Express is a 6 x 6 hybrid firewire/usb2 interface. It
  connects to any current mac or pc via firewire or high-speed USB 2.0.
details: |-
  6 x 8 physical input/output channels all channels are available simultaneously
  and operate independently. Hybrid firewire/USB 2.0 connectivity connect to
  your mac or pc via either bus-powered firewire or hi-speed usb2. 8-bus digital
  mixer routes and mixes all six inputs to any output pair. Four separate mixes
  each output pair (main outs, line outs, s/pdif out, and phones) can have a
  completely different mix of all six inputs, with or without computer tracks.

  Two mic/guitar combo jacks provide hi-z 1/4" guitar input or xlr mic input
  with phantom power, 20 db pad, precision digital trim, and plenty of gain.
  Stereo analog inputs on line-level, balanced trs quarter-inch jacks. Great for
  keyboards or other line level-input signals. Stereo main outs on balanced trs
  quarter-inch jacks. Connect directly to powered speakers (or other line-level
  analog destination). Stereo 24-bit 96khz s/pdif digital in/out. Stereo
  headphone output on quarter-inch jack with independent volume control.

  Cuemix fx cross-platform mixing software attractive on-screen graphic mixing
  with an instrument tuner and audio analysis tools including real-time fft
  display, spectrogram "waterfall" display, oscilloscope, x-y plot and linear or
  polar phase analysis. Stand-alone operation bring the audio express to your
  gig, with or without a computer. Just plug in the included power adapter and
  you are ready to go.

  Sample-accurate MIDI connect a MIDI controller and/or sound module with no
  separate interface needed. MIDI I/o is sample-accurate with supporting
  software. Foot switch input connect a standard foot pedal switch (sold
  separately) for hands-free punch-in and punch-out while recording. Dc-coupled
  trs outputs can be used with volta (sold separately) to manipulate and
  sequence voltage-controlled modular synthesizers from a host DAW.
specs: |-
  - 6 x 6 hybrid firewire/usb2 interface
  - 6-input, 6-output audio interface
  - 6 x 8 physical input/output channels
  - Hybrid firewire/USB 2.0 connectivity
  - 8-bus digital mixer
  - Two mic/guitar combo jacks
  - Hi-z 1/4" guitar input
  - XLR mic input with phantom power
  - 20 dB pad
  - Precision digital trim
  - Stereo analog inputs on balanced TRS quarter-inch jacks
  - Stereo main outs on balanced TRS quarter-inch jacks
  - Stereo 24-bit 96khz s/pdif digital in/out
  - Stereo headphone output on quarter-inch jack
  - Support for standard sample rates up to 96 kHz
  - Front-panel mixing and control
  - Cuemix FX cross-platform mixing software
  - Stand-alone operation
  - Expandable
  - Time code support
  - Direct digital synthesis (dds)
  - Sample-accurate MIDI
  - Foot switch input
  - Dc-coupled TRS outputs
  - Plug-and-play operation
  - Native 32- and 64-bit drivers for Mac OS X and Windows 7/vista
  - Asio, wdm, wave, core audio, and core MIDI support
  - Bus-powered firewire operation
  - 1u high rack mount
  - Chassis dimensions: 9.5 x 7 x 1.75 inches
