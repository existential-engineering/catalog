description: 3-Voice Rhythmic Pitch Shifter
details: |-
  Hedra expands a melody palette and unfolds new sonic landscapes. Three voices, in rhythm, combine with the original voice to create harmonies. Each voice can be delayed and fed back in four intricate matrices for either predictable or unpredictable results.

  Endless creative avenues are available through pitch corrective locking and glide modes, either smooth or hard stepped, and sonic unease and texture can be added by micro-tuning each voice.

  Hedra provides stereo input and output, with switchable input/output headroom level for guitar or synth/line level. The multi-function EXP jack supports MIDI in/out via a compatible MIDI-to-TRS conversion box, preset switching, an expression pedal, or a tap switch, and presets are available via an external 4-preset switch or MIDI.
specs: |-
  - Individual controls for pitch and time offset for each of 3 voices
  - Micro Tune control for gentle chorus-like detuning to extreme warping
  - Chromatic or key-driven harmony with selectable scale types
  - 4 Delay Configurations with unique feedback routing (520 mS max delay time)
  - Switchable Half Speed and Auto Swell
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Current draw: < 150 mA
  - Dimensions: 4.25" wide x 4.5" long x 2" tall
