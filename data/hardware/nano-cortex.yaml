details: |-
  Nano cortex is an ultra-portable digital guitar and bass rig that delivers studio-grade sound and a fully customizable signal chain. It features neural capture technology, allowing users to create accurate digital replicas of amps, cabinets, and drive pedals directly on the device within minutes. The pedal is designed for musicians of all skill levels, from touring professionals to home practitioners.

  The device comes with 25 pre-loaded neural captures of iconic amps like mesa boogie jp2c, fender princeton 65, diezel vh4, and ampeg svt classic. It includes 10 cabinet models with 300 studio-grade impulse responses (irs), offering five microphone options and six positions per mic. Users can access thousands of additional neural captures through the cortex cloud, or create their own custom captures.

  Nano cortex offers a comprehensive suite of over 50 effects and utilities, including various compressors, wahs, filters, overdrives, modulation effects, delays, and reverbs. The device features customizable pre-effects and post-effects slots, a built-in input gate, and flexible routing options. Its intuitive interface supports both beginners and professionals, with customizable footswitches and real-time control capabilities.

  The pedal serves multiple use cases, functioning as a complete rig replacement, audio interface, and portable tone solution. It can be powered by a standard USB battery pack, making it ideal for live performances, studio sessions, travel, and home practice. Users can connect directly to pa systems, frfr cabs, or use headphones for silent practice.

  Nano cortex includes advanced features like Bluetooth support for wireless preset management, a built-in tuner, and the ability to change tunings without switching instruments. It doubles as a high-quality USB audio interface with 24-bit/48khz recording capabilities, providing musicians with a versatile and compact solution for creating and performing music.
