description: >-
  A pioneering digital synthesizer that fused vector synthesis with innovative wave sequencing to
  create complex, evolving textures and rhythmic patterns unlike anything else available in 1990.
details: |-
  The Korg Wavestation emerged in 1990 from a remarkable lineage. When Sequential Circuits closed its doors in 1987, key members of the team behind the Prophet VS — including its vector synthesis technology — joined Korg. The Wavestation built directly upon that foundation, retaining the two-dimensional joystick that allowed performers to morph between four sound sources in real time, while adding an entirely new dimension: wave sequencing.

  Wave sequencing was the Wavestation's defining innovation. Rather than simply playing back static samples, it allowed users to chain together short waveform segments and crossfade between them, producing constantly shifting timbres, intricate rhythmic patterns, and evolving textures that sounded genuinely unlike any other instrument on the market. Combined with the vector joystick for real-time tonal animation, the Wavestation could generate sounds of extraordinary complexity and movement from its 2MB ROM sample library.

  The synthesis architecture offered up to 32 voices of polyphony with 16-part multitimbral operation, a digital lowpass filter per voice, and two onboard effects processors. While the filter lacked resonance — a common compromise in digital instruments of the era — the sheer textural richness of the wave sequencing and vector mixing more than compensated. The 1991 EX revision expanded the waveform library to 4MB, added 150 new waveforms, incorporated a vocoder, and enhanced the effects section.

  The Wavestation carved out a distinctive niche in electronic and ambient music, with Orbital, Future Sound of London, Depeche Mode, Vangelis, and Genesis among its notable adopters. Its lush, cinematic pads and rhythmic wave sequences became staples of 1990s soundtrack and electronic production, and Korg has kept the concept alive through software recreations that bring its unique synthesis approach to modern producers.
specs: |-
  - Polyphony: Up to 32 voices
  - Sound Engine: Digital with 2MB ROM samples, vector synthesis, and wave sequencing
  - Multitimbral: 16 parts
  - Filter: 1 digital lowpass per voice (non-resonant)
  - Effects: 2 onboard multi-effects processors
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 150 patches
  - Control: MIDI (up to 8 channels), vector joystick
  - Expansion: EX version adds 4MB waveforms, vocoder, additional effects
  - Date Produced: 1990–1994
