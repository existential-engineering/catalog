description: The iSINE 10 sounds and looks like no other. The Fluxor Magnets and
  large 30mm planar magnetic diaphragms deliver precise control and fast
  response times without distortion so music always sounds alive.
details: |-
  The iSINE 10 combines flagship LCD planar technology with distinctive industrial design. Fluxor magnets and 30mm planar magnetic diaphragms provide precise control and fast response without distortion.

  Uniforce voice coil technology minimizes distortion at high volumes for audio clarity. The semi-open design delivers spacious sound comparable to live performance.

  Optional CIPHER Lightning cable with built-in amplifier and DSP enhances performance further.

  This is a legacy product and no longer available for sale.
specs: |-
  - Style: In-ear, semi open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 30 mm
  - Maximum power handling: 500mW RMS
  - Maximum SPL: >130dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 16 ohms
  - Sensitivity: 110 dB/1mW (at Drum Reference Point)
  - Minimum power requirement: >50mW
  - Weight: 20g/pair
  - Standard cable: 1.5m audio cable, 1/8" stereo plug to 2-pin plug
  - Optional cable: 1.5m CIPHER Lightning cable
