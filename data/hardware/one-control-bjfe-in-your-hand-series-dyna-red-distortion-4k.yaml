details: |-
  BJFE in Your Hand Series

  The Original BJFE Experience – Now Handmade in Japan with Precision and Passion

  Introducing the BJFE in Your Hand Series – an exquisite line of handmade pedals created with unmatched craftsmanship and artistry in Japan. This exclusive series is the only line approved by Björn Jühl himself, a pioneer of boutique pedal design. Meticulously hand-wired, each pedal faithfully replicates the iconic BJFE models down to the finest detail, capturing the same tone, aesthetics, and spirit that have made BJFE a legend among guitarists. This series was developed to bring the renowned BJFE sound to more players, enhanced with the intuitive functionality and reliability that characterize One Control. Using One Control's proprietary aluminum-machined housing, these pedals combine authentic BJFE sound with modern enhancements for a flawless, dependable performance wherever you play. Every pedal in the series is handcrafted from high-quality audio components, such as premium carbon film resistors and metal film capacitors, ensuring a warm, rich tone. The innovative layout, optimized for through-hole components, reduces noise and enhances signal clarity, marrying traditional craftsmanship with the dependability expected of modern pedals. Dyna Red Distortion 4K

  The One Control BJFE in Your Hand Series Dyna Red Distortion 4K is a masterwork of handmade distortion, featuring a lush texture and balanced, aggressive tone that sets it apart. With its adaptable presence and treble controls, players can refine their sound to precise detail, dialing in everything from bright tones to warm, ear-pleasing presence. Whether paired with a tube amp or a clean solid-state setup, this pedal brings dynamic control to any rig, emulating the responsiveness of a vacuum tube amp with an UK like character even in high-distortion settings. Key Features

  • Wide Range of Drive Control: From light gain to full, clear sustain, the DRIVE knob offers a spectrum of distortion intensity and sustain, responding with touch sensitivity at lower settings and compression-rich stability at higher ones. • Precision Tone Shaping: The TREBLE and PRESENCE knobs give fine control over upper frequencies, allowing you to add brightness without harshness and perfectly balance the tonal presence. • Universal Compatibility: The Dyna Red Distortion 4K delivers bold, balanced distortion, adaptable for any amp configuration, solid-state or tube-driven. Controls

  • V (Volume): Adjusts overall output level, ideal for balancing the pedal with your amp. • D (Drive): Controls distortion intensity and sustain, ranging from subtle to powerful compression for a richly textured tone. • T (Treble): Adjusts high frequencies, perfect for fine-tuning tonal brightness. • P (Presence): Fine-tunes the higher frequency range even beyond TREBLE, enabling a detailed control over the final sound's clarity and definition. Björn calls these "luxury trebles". Specifications

  • Input Impedance: 370k
  • Output Impedance: 25K
  • Drive Voltage: 5-15V center negative
  • Current Consumption: 3.5mA
  • Dimensions: 61Wx113Dx31H mm (without protrusions) / 66Wx113Dx46H mm (with protrusions)
  • Battery: Not included

