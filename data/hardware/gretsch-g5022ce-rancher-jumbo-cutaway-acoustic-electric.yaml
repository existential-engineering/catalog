details: |-
  A great Gretsch guitar returns with the Rancher acoustic guitars. The richly resonant Rancher first appeared in the early 1950s with a highly distinctive triangular sound hole and sweepingly elegant pickguard, and Gretsch is now very proud to reintroduce the model with its classic features intact.

  With a great new selection of body sizes, styles and features that combine the best of the guitar's acclaimed past with the best in modern sound, strength, style and playability, Gretsch now gives you the best of all Ranchers.

  The biggest and fullest-sounding Rancher is the G5022CE Rancher Jumbo Cutaway Electric, which produces great volume and broadly expansive tone complemented by its elegant Venetian cutaway for easy access to the fingerboard's upper reaches and onboard electronics that let it be heard even more loudly and clearly.
