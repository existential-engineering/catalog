details: |-
  3x Stereo Mixer is a high quality 3 channel stereo mixer with manual volume controls. Total mix Left and Right outputs available on separate jacks, plus L&R stereo jack can be used to route the mix via single stereo cable or drive the headphones.

  Channels 1 and 2 can be muted with the relative switches. Left and Right led indicators are available for all three channels.

  All left channel inputs are normalled to be used as mono inputs.

  Several 3x Stereo Mixer modules can be chained together via connections on the back side. This connection is possible with other Happy Nerding stereo modules too. At the moment PanMix Jr and 3x Stereo Mixer can be connected in both ways. Their stereo outputs can also be internally sent to the Isolator module, or a stereo signal can be received from OUT and the latest revision of PanMix.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - 3 stereo channels with manual volume controls
  - Left and Right LED indicators for all three channels
  - Mute switches on channels 1 and 2
  - All left channel inputs normalled for mono operation
  - Rear-side connections for chaining with other Happy Nerding stereo modules
  - 50 mA +12V
  - 50 mA -12V
  - 35 mm depth
  - 6 HP wide
  - Reverse power protected
