description: The Sub12 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 22 Hz.
details: |-
  The Sub12 is a powerful subwoofer designed to extend the low frequency capabilities of any near or midfield monitoring system down to 22 Hz.

  A sturdy special woofer with extended cone travel and a heavy-duty coil have been optimized for accurate reproduction from a bass reflex enclosure. The down-firing bass reflex tube avoids intrusive ventilation noise because of its generous size and shape.

  The PWM amplifier produces over 90% efficiency and can handle critical passages without overheating for long periods of time. An additional output allows you to cascade as many subwoofers as needed.

  The Sub12 subwoofer provides a precise combination of low cutoff frequency (-3dB at 22Hz) and an undistorted high sound pressure level (115dB SPL at 1m).
specs: |-
  - 12" subwoofer driver, paper cone
  - Voice coil diameter: 2" (50 mm)
  - Amplifier type: PWM
  - Amp. Power RMS / Music: 200 W / 300 W
  - Frequency response: 22 Hz - 150 Hz
  - THD > 60 Hz: ≤1 %
  - Max. peak SPL at 1 m: ≥115 dB
  - Crossover frequencies: 50 - 150 Hz
  - Analog inputs: XLR / RCA
  - Input impedance: 10 kOhm
  - Panel: rear
  - Height x Width x Depth: 23.5" (600 mm) x 14" (360 mm) x 17.5" (450 mm)
  - Weight: 57.3 lb (26 kg)
  - Rear panel controls: Mode (Signal-On / Continuous), Subwoofer Phase (0° / 180°), Satellite Filter (85 Hz / Flat), Sub Level (-60 dB to +6 dB), Sub Filter (50 Hz - 150 Hz)
  - Power: 100-240 V~ 50/60 Hz, 300 W
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
  - Delivery contents: power cord, manual
