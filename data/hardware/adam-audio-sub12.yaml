id: B0mnm46CANSFwbsiL61A7
name: Sub12
manufacturer: adam-audio
primaryCategory: subwoofer
url: https://www.adam-audio.com/en/subwoofers/sub12/
description: The Sub12 is a powerful subwoofer designed to extend the low
  frequency capabilities of any near or midfield monitoring system down to 22
  Hz.
details: |-
  The Sub12 is a powerful subwoofer engineered to extend the low-frequency range of near or midfield monitoring systems down to 22 Hz. It combines a robust 12" woofer with extended cone travel and a heavy-duty voice coil optimized for accurate bass reproduction through a bass reflex enclosure.

  The down-firing bass reflex tube is generously sized and shaped to minimize ventilation noise. A PWM amplifier achieves over 90% efficiency and maintains performance during demanding passages without thermal issues.

  Multiple subwoofers can be cascaded using the additional output connector for expanded system configurations, making the Sub12 suitable for professional midfield monitoring applications that require precise low-end extension and undistorted high output (≥115 dB SPL at 1 meter).
specs: |-
  - Driver: 12" basket diameter, paper cone, 2" (50mm) voice coil
  - Frequency response: 22 Hz – 150 Hz
  - Amplifier type: PWM
  - Amplifier power: 200W RMS / 300W Music
  - Maximum peak SPL: ≥115 dB at 1 meter
  - THD: ≤1% above 60 Hz
  - Crossover range: 50 – 150 Hz
  - Input impedance: 10 kOhm
  - Dimensions (H×W×D): 600 × 360 × 450 mm (23.5" × 14" × 17.5")
  - Weight: 26 kg (57.3 lbs)
  - Warranty: 5 years (2 years standard + 3 years optional with registration)
