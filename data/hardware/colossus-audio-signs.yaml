description: A voltage-controlled dual-path echo-delay Eurorack module built
  around two PT2399 ICs, offering delay times from about 400ms to nearly 2
  seconds, independent glitch/degrade generators per channel, and a post-gain
  stage with selectable soft or hard clipping.
details: |-
  SIGNS is a dual-path Echo–Delay module built around two PT2399 ICs, designed to explore the full expressive potential of time-based signal degradation. Its architecture spans a wide delay range—from approximately 400 ms of relatively clean repeats to nearly 2 seconds of heavily deteriorated echoes, where the sound transforms into glitch-laden, noisy fragments. A defining feature of this design is its ability to split a single input into two parallel delay lines, each with its own timing and character. This parallel configuration enables the creation of intricate rhythmic structures, evolving textures, and unexpected interactions between the two delay paths. Each channel incorporates its own glitch/degrade generator, progressively breaking down the audio in a circuit-bent-inspired manner and introducing crushed, unstable, and unpredictable artifacts over time. To further shape the output, SIGNS includes a post-gain stage with selectable soft or hard clipping, offering additional tonal reinforcement or saturation when desired. The D1 and D2 send outputs can be routed for stereo operation or used as independent outputs, opening up diverse spatial and modular routing possibilities. In essence, SIGNS invites the user into a vast, immersive landscape of delay—ranging from subtle ambience to complete sonic disintegration—unlocking a near-limitless palette of textures, patterns, and atmospheres. English Manual

