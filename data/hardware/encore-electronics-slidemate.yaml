name: SlideMate
manufacturer: encore-electronics
primaryCategory: midi-controller
description: >-
  The Encore Electronics SlideMate is a programmable MIDI fader controller with
  8 faders and 15 banks, providing 120 assignable controls for real-time
  manipulation of synths, effects, and DAWs.
details: |-
  Released in 2001, the SlideMate addressed the growing need for tactile, real-time MIDI control in an era when software synths and digital effects were becoming increasingly prevalent. Its eight 60mm steel faders offered twice the resolution of comparable controllers at the time, providing smooth and precise parameter adjustment.

  Each fader can be independently assigned to any MIDI channel and configured to send continuous controllers, SysEx messages up to 55 bytes, NRPNs, or RPNs. With 15 selectable banks accessed via four group buttons, users get a total of 120 programmable controls from a compact desktop footprint.

  Programming is handled through included Mac and PC software with drag-and-drop preset definitions. Once configured, settings are stored in non-volatile memory, allowing the SlideMate to operate completely independently without a connected computer. Additional features include an integrated MIDI merger, a scene/panic button, and programmable MIDI delay.

  The SlideMate was designed as a universal controller compatible with virtually any MIDI-equipped hardware or software, from synthesizers and rack effects to sound modules and DAW applications.
specs: |-
  - Faders: 8 with scribble strips (60mm steel)
  - Banks: 15 (120 total programmable controls)
  - Resolution: Twice standard MIDI controller resolution
  - Control Types: MIDI CC, SysEx (up to 55 bytes), NRPN, RPN
  - MIDI Channels: 16
  - Memory: Non-volatile
  - Features: MIDI merger, scene/panic button, programmable delay
  - Software: Windows 95/98/NT; Mac alpha
