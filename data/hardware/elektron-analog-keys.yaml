description: >-
  Keyboard flagship of Elektron's original Analog line, built on the Analog Four
  sound engine. Four-voice analog synthesizer with a 37-key keyboard, dual
  oscillators and dual filters per voice, CV/Gate outputs, and step sequencer.
details: |-
  The Analog Keys was the keyboard flagship of Elektron's original Analog product line. Built on the same sound engine and architecture as the Analog Four, it offered a 4-voice analog synthesizer with a 37-key keyboard in a premium desktop form factor.

  Each of the four voices features a fully analog signal path with two analog oscillators with variable waveshape, two sub-oscillators, a noise generator, a 4-pole analog lowpass ladder filter, a 2-pole analog multi-mode filter, and an analog overdrive circuit with filter feedback.

  The synthesizer includes two assignable LFOs plus dedicated vibrato, waveshape, fade, and autobend LFOs per voice, along with an amp envelope and two assignable envelopes. Three individual send effects provide chorus, delay, and reverb processing.

  The Elektron step sequencer offers 4 synth tracks, 1 FX track, and 1 CV/Gate track with up to 64 steps per pattern. Features include parameter locks, trig probability, swing, slide, accent, track transpose, and micro timing. Six arpeggiators are available.
specs: |-
  - 4-voice polyphonic analog synthesizer
  - 37-key keyboard
  - Based on Analog Four sound engine
  - 2 analog oscillators per voice with variable waveshape, AM, and sync
  - 2 sub-oscillators and 1 noise generator per voice
  - 4-pole analog lowpass ladder filter per voice
  - 2-pole analog multi-mode filter per voice
  - Analog overdrive circuit with filter feedback
  - 2 assignable LFOs, 2 assignable envelopes, plus amp envelope per voice
  - 3 send effects: chorus, delay, reverb
  - Step sequencer: 4 synth tracks, 1 FX track, 1 CV/Gate track
  - Up to 64 steps per pattern
  - Parameter locks, trig conditions, 6 arpeggiators
  - +Drive storage
  - Overbridge enabled for DAW integration
