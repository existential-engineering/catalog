description: Portable Bluetooth speaker with 20+ hours of playtime, True
  Stereophonic 360 degree sound and an IP67 dust and waterproof build.
details: |-
  Middleton utilises True Stereophonic (360 degree sound), a unique form of multi-directional stereo sound from Marshall. Keep the music going when your phone battery is low, charge your device on the move with Middleton's trusty power bank feature. With a rugged IP67 dust and waterproof build, a bit of rain and dirt won't get under its skin.

  Marshall signature sound: carry the heaviest portable sound in your hand. This speaker is built with two 3/5" tweeters, two 3" woofers and two passive radiators in a quad-speaker set-up to ensure the ultimate immersive experience wherever you roam. Built-in Dynamic Loudness adjusts the tonal balance of the sound to ensure your music sounds brilliant at every volume.

  True Stereophonic (360 degree sound): Middleton utilises True Stereophonic, a unique form of multi-directional sound from Marshall. Experience superior spatial and binaural sound that flows around you and fills any space. Indoors or out, take your speaker anywhere you like and be immersed in your music.

  Iconic and rugged design: Middleton is equally at home in the festival mud or on your polished sideboard thanks to its iconic yet durable design. This speaker is your lifeline on the go, with a grabbable carry strap and trusty power bank capability. The IP67 build can be submerged in 1 m of water for a period of up to 30 minutes.

  20+ hours of portable playtime: Middleton keeps the music going on a single charge. When you do need to charge, it only takes 4.5 hours to return Middleton to full power, and 20 minutes of charging gives you 2 hours of playtime. Adjust the bass and treble on the top of the speaker, or download the dedicated Marshall Bluetooth app to control the sound wirelessly. Designed and engineered in Sweden. Made in China.
specs: |-
  - Driver type: Dynamic
  - Frequency range: 50 Hz to 20,000 Hz
  - Drivers: two 3" 15 W woofers, two 3/5" 10 W tweeters, two passive radiators
  - Power amplifiers: two 20 Watt Class D amplifiers for the woofers, two 10 Watt Class D amplifiers for the tweeters
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 87 dB SPL at 1 m
  - Cabinet principle: Sealed with passive radiator
  - Adjustable bass and treble controls via analogue controls on the speaker
  - Wireless connectivity: Bluetooth 5.1
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: 3.5 mm input
  - Top panel controls: multi-directional control knob (play/pause, skip track, volume, on/off), Bluetooth pairing button (pairing and Stack Mode), battery and volume indicator, treble and bass controls
  - Wi-Fi: No
  - Microphone system: No
  - Voice command: No
  - Weight: 1.8 kg / 4.0 lb
  - Width: 230 mm / 9.06"
  - Height: 109 mm / 4.29"
  - Depth: 95 mm / 3.74"
  - Water resistance: IP67 dust and waterproof
  - Battery type: built-in rechargeable Li-ion battery, no mains inlet
  - Play time: 20+ hours
  - Quick charging: 20 minutes charge gives 2 hours of playtime
  - Charging time: 4.5 hours
  - Power bank feature: charge a connected device from the speaker
  - Box contents: Middleton speaker, detachable carry strap, user manual and legal and safety information, USB-A to USB-C charging cable
  - Compatible app: Marshall Bluetooth app, with over-the-air software updates
