details: |-
  The M3F is a high quality loudspeaker system for use in medium-sized film and television post-production studios.

  It's intended to be put behind a screen — and its small footprint means you can have more space in the theatre.

  Combine it with our subwoofers and surrounds, and the M3F completes an excellent system for immersive monitoring, including Dolby Atmos HE 7.1.4 and 9.1.4, and full Atmos theatrical multi-channel.

  The bass section consists of two 300mm MSP (Magnesium Silicate Polymer) drivers with 100mm ferrofluid-cooled voice-coils. The midrange section consists of two ultra-high-quality 170mm MSP drivers with 75mm diameter voice coils. And the high frequency unit is the D260H soft-dome with short waveguide.

  These speakers are supplied as an active two-way system. Dynaudio recommends the DA-series amplifiers with onboard DSP, or the DCA series power amps with analogue filter cards.
specs: |-
  - Type: 3-way hybrid
  - Application: Post-production and music
  - Frequency response: 35Hz – 20kHz
  - Maximum SPL at 2 metres: 120dB
  - Crossover frequencies: 250Hz and 2500Hz
  - Total harmonic distortion: 1% at 90dB
  - High frequency driver: 28mm soft-dome in short waveguide
  - Midrange: 2x 17cm MSP
  - Low frequency driver: 2x 30cm MSP
  - Recommended amplifier power: Two channels: 500-1000W/channel per speaker
  - Amplifier recommendation: Dynaudio Acoustics DA40 DSP, DCA800 (with filters)
  - Cabinet dimensions (H x W x D): 1300 x 520 x 400mm
  - Weight: 62 kg
  - Finish: Black textured paint
  - Optional: Hardwood cabinet (oak, cherry, walnut, maple)
  - Custom cabinet sizes: On request
