description: Compact 5HP Eurorack output module featuring four high-quality line
  outputs for recording and live performance. Provides two balanced line outputs
  (left and right channels), one stereo line output, and one headphone output
  with a channel selector switch. Includes per-channel volume controls,
  line-level clipping indicators, internal normalization for mono-to-stereo
  conversion, and a front panel switch to mix channel A into channel B.
  Available with aluminum or oak wood front panel. Discontinued — superseded by
  CIAO!!
details: |-
  5HP width, 55mm depth. Power: +12V <40mA, -12V <40mA. 10-pin power connector with PTC fuse and diode protection. Front panel switch to select headphone monitoring source. Internal normalization for mono-to-stereo conversion. Per-channel clipping indicators.
