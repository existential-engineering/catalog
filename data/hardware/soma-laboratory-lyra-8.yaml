description: >-
  The Lyra-8 is a unique 'organismic' analog synthesizer from SOMA Laboratory featuring
  eight voices with tone generators based on electric organ principles rather than
  traditional VCOs or DCOs. It includes built-in dual delay lines with cross-feedback and
  a distortion effect, emphasizing experimental and unconventional sound design. The
  all-metal construction and innovative modulation architecture make it a distinctive
  instrument for exploring complex, evolving textures.
details: |-
  The Lyra-8 employs an innovative design philosophy centered on organismic principles, mirroring biological systems rather than conventional synthesis approaches. Each of the eight voices functions as a tone generator capable of operating in either electric organ mode or FM synthesis mode, producing square and triangle waveforms.

  The instrument features a Hyper LFO consisting of two modulation sources that cannot be accessed individually. Instead, their waveforms are synthesized through summation or multiplication of the two frequencies, allowing complex and unpredictable modulation possibilities.

  The MOD DELAY section comprises two delay lines with cross-feedback and resonance capabilities. Each delay line's time can be modulated independently from various sources, including external inputs. Self-modulation is possible, enabling the output signal to modulate the delay sample rate for unique sonic effects.

  The distortion effect concludes the signal chain, allowing the delay to influence its character. The all-metal case and high-quality components emphasize build quality, while the unconventional architecture offers a world of opportunities for experimental sound design.
specs: |-
  - Polyphony: 8 voices
  - Architecture: Analog
  - Oscillators: 8 tone generators (electric organ-style, not VCOs/DCOs)
  - Waveforms: Square, Triangle
  - Modulation: Hyper LFO (2 combined sources)
  - Effects: Dual delay lines with cross-feedback and resonance, Distortion
  - Multitimbral: 1 part
  - Construction: All-metal case
