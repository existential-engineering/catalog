details: |-
  The REVEAL 402 is a 70 Watt 4" bi-amped ultra-compact studio reference monitor with a tuned front-firing bass port, custom-tweaked by Tannoy's in-house speaker guru Dr. Paul Mills. Its active crossover filters provide impeccable timing and an ultra-wide sweet spot for accurate stereo imaging throughout the workspace.
specs: |-
  - Frequency Response: 56 Hz – 48 kHz
  - Max SPL: 101 dB
  - HF Driver: 3/4" Soft Dome (19 mm)
  - LF/Mid Range Driver: 4" (100 mm)
  - Total Power Output: 50 Watts (bi-amped)
  - LF/Mid Range Amplifier: 25 Watts
  - HF Amplifier: 25 Watts
  - THD: 0.9%
  - Balanced Input: XLR, 20 kOhm
  - Unbalanced Input: 1/4" Jack, 10 kOhm
  - AUX Link Input: Mini Jack, 10 kOhm
  - AUX Link Output: Mini Jack
  - HF EQ Settings: -1.5 dB HF Cut / Neutral / +1.5 dB HF Boost
  - Crossover Frequency: 2.8 kHz
  - Low Frequency Alignment: Optimized Front Port
  - Dimensions HxWxD (inches): 9.5 x 5.8 x 8.4
  - Dimensions HxWxD (mm): 240 x 147 x 212
