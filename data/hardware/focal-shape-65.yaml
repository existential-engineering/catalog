description: Shape 65 offers an unrivalled quality of control, from the lowest to the highest frequencies. With a 6.5" woofer with a Flax membrane, an aluminium/magnesium "M" tweeter and class AB amplifiers, this monitoring speaker is aimed at professionals looking for perfectly defined, transparent sound.
details: |-
  Shape 65 offers an unrivalled quality of control, from the lowest to the highest frequencies. With a 6.5" woofer with a Flax membrane, an aluminium/magnesium "M" tweeter and class AB amplifiers, this monitoring speaker is essential for professionals looking for perfectly defined, transparent sound. It expresses all its potential from a listening distance of one metre.

  Acoustic transparency: like Shape 40 and Shape 50, Shape 65 is characterized by a stereo image that is both wide and extremely precise. Benefiting from the advantages of the Flax membrane, combined with the "M" profile tweeter, it delivers a very high-definition sound with redoubled clarity across the entire spectrum. Control is precise, right down to the extreme treble.

  Optimal integration: designed to meet the needs of nearfield listening, Shape loudspeakers combine ingenious design with essential features and controls (XLR and RCA inputs, adjustable bass and treble levels, disengageable high-pass crossover, adjustable 160 Hz filter).

  Design: sobriety and style define Shape 65. The MDF cabinet body is covered with a real walnut veneer. Its compactness, ventless design and mounting inserts make for optimal, flexible integration, even close to a wall.

  Accessories: mounting inserts are provided on the back and underside of Shape line monitors, making it possible to install them on table stands, microphone stands, ceilings or walls (mounting accessories not supplied).
specs: |-
  - Product type: 2-way monitor
  - Woofer: 6.5" Flax membrane
  - Tweeter: 1" aluminium-magnesium M-shaped dome
  - Frequency response (+/- 3dB): 40 Hz - 35 kHz
  - Maximum SPL (peak @ 1m): 109 dB
  - High frequency amplifier: 35 W, class AB
  - Mid-range and low frequency amplifier: 80 W, class AB
  - Inputs: XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - High-pass filter: full range, 45 Hz, 60 Hz, 90 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: HPF, LF Shelv, LMF EQ, HF Shelv
  - Power On LED
  - Local supply: 220-240V (T500mAL / 250V fuse) or 100-120V (T1.6AL / 250V fuse)
  - On/Off switch on the rear panel
  - Ventless cabinet with passive radiators
  - Height: 35.5 cm / 14 in
  - Width: 21.8 cm / 8.6 in
  - Depth: 28.5 cm / 11.2 in
  - Weight: 8.5 kg
