description: 2-way active studio monitor with a 6.5" Flax woofer and an
  Aluminium-Magnesium M-shaped tweeter, suited for nearfield to short-midfield
  monitoring.
specs: |-
  - 2-way active studio monitor
  - Woofer: 6.5" Flax membrane
  - Tweeter: 1" Aluminium-Magnesium M-shaped dome
  - Frequency response (±3 dB): 40 Hz – 35 kHz
  - Maximum SPL (peak @ 1 m): 109 dB
  - High frequency amplifier: 35 W class AB
  - Mid-range/low frequency amplifier: 80 W class AB
  - Bass/midrange level (160 Hz): adjustable ±3 dB
  - Bass level (>250 Hz): adjustable ±6 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - High-pass filter: Full range, 45 Hz, 60 Hz, 90 Hz
  - Dimensions (H × W × D): 35.5 × 21.8 × 28.5 cm (14 × 8.6 × 11.2 in)
  - Weight: 8.5 kg (18.7 lb)
