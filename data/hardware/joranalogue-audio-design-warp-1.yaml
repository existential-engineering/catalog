details: |-
  POWER CURVE WAVESHAPER 8 HP | +12: 65 mA, −12: 60 mA | JORW1 User Manual (PDF) | ModularGrid Available exclusively through our authorised dealer network . Warp 1 is a new breed of analogue waveshaper. Rather than being based on the inherent properties of transistors and diodes, it precisely implements a mathematical relationship between input and output, governed by a variable power function. Like a beam of light travelling through a lens, straight waveform segments are bent into ‘hollow-sounding’ concave or ‘driven-sounding’ convex curves. The degree of curvature is determined by the exponent control, while the scale parameter determines the ‘depth’ of the curving action. A precision clipper on the output adds adjustable clamping of the positive and negative parts of the waveform. In conjunction with the absolute value switch, this allows Warp 1 to be used as a half or full wave rectifier: useful for limiting CV ranges, or as an audio octave-up effect. Flipping the mode switch from ‘direct’ into the ‘hyper’ setting exposes Warp 1’s dark side, where its exponent turns negative and the outputs resemble hyperbolic curves. Dual summed inputs, an inverted signal output and a polarity comparator gate output round out Warp 1’s signal processing capabilities. From subtle timbral colouring to wild hyperbolic distortion, Warp 1 provides a level of control that’s unprecedented in waveshapers, combining meaningful parameters, clear LED indication, complete voltage control and DC to supersonic operation.
specs: |-
  - Analogue waveshaper based on power functions.
  - Adjustable exponent shapes waveforms from concave, to straight, to convex.
  - Hyper mode shapes incoming signals into hyperbolic-like waveforms.
  - Absolute value function for full wave rectifier use.
  - Symmetry control for asymmetric waveshaping.
  - Precision output clipper with independent negative and positive clipping levels.
  - Regular, inverted and polarity comparator impedance-compensated outputs.
  - Excellent visual feedback: input voltage, output voltage and clipper status indicator LEDs.
  - Precision-milled 2 mm anodised aluminium front panel with high-resolution, non-erasable graphics.
  - Bullet-proof design: polarised power header and MOSFET protection circuit.
  - Includes 16-to-10-pin Eurorack power ribbon cable.
  - Premium mounting hardware: black screws, black nylon washers and matching hex key.
  - High-quality components and assembly; designed and made in Belgium.
