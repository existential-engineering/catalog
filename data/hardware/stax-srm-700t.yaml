id: zrD5g5nXvziADu0Qd1uld
name: SRM-700T
manufacturer: stax
primaryCategory: headphone-amp
categories:
  - amplifier
description: A high-end vacuum tube driver unit featuring a 6SN7 GT tube in the
  output stage paired with custom-made low-noise dual FETs in the first stage.
  This hybrid amplifier delivers warm, spacious sound reproduction with high
  transparency through premium components including VISHAY resistors and WIMA
  film capacitors.
details: |-
  '6SN7' GT tube has been adopted in the second stage of the vacuum tube system, while custom-made low-noise dual FET is employed in the first stage. The vacuum tube 6SN7 that has become the original form of 6FQ7 realizes simple and powerful performance. The hybrid type driver has adopted the high-quality non-inductive winding resistor from VISHAY Co. as a load resistance. The clear and high slew-rate vacuum tube sound has been improved further to polish up warm and spacious reproduction. RCA and XLR inputs are switchable. RCA input supports parallel out. The newly developed large-sized aluminum insulator combined with new vibration-proof material and high frictional coefficient (grip power) has been employed.
specs: |-
  - Type: FET input + vacuum tube output hybrid DC amplification driver unit
  - Vacuum tube: 6SN7
  - Frequency response: DC – 100 kHz (with one SR-009S)
  - Gain: 60 dB
  - Harmonic distortion: 0.01% or less (1 kHz / 100 Vrms output)
  - Input impedance: 50 kΩ (RCA), 50 kΩ x 2 (XLR)
  - Maximum output voltage: 340 Vrms (1 kHz)
  - Bias voltage: PRO 580 V
  - Operating temperature: 0 to 35 °C
  - Operating humidity: less than 90% (non-condensing)
  - Input terminals: RCA x 1, XLR x 1
  - Output: RCA parallel output terminal
  - Power consumption: 54 W
  - Dimensions: 240 (W) x 103 (H) x 393 (D) mm
  - Weight: 5.7 kg
