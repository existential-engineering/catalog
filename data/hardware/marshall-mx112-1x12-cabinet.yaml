description: Portable 1x12" passive guitar speaker cabinet from Marshall's MX range. Loaded with a single Celestion Seventy 80 12" speaker, the MX112 handles 80W at 16Ω and is designed as a compact extension cabinet — a natural pairing for the DSL20H head or as an additional cab for the DSL20C combo. A single 1/4-inch speaker input keeps connection simple for stage or studio use.
details: |-
  Small size, great value and excellent quality all in one MX112 1x12" Cabinet, what is not to love?

  It pairs perfectly with the DSL20 Head or can be used as an extension cabinet for the DSL20 Combo. Fitted with a single Celestion Seventy-80 speaker this cabinet definitely packs a punch.

  Compact and portable, it offers heavy bass, bold mid-range and punchy highs, handling 80W at a 16 ohm unit impedance through its single input.

  Designed and engineered in UK. Made in Vietnam.
