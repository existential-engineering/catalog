details: |-
  The Sir-Compre is an optical compressor pedal with a Friedman twist. The compressor controls are volume, treble, compression and a tight knob.

  The twist is the wide-range gain knob. This gain control is the mastermind of the Sir-Compre and shapes the overall sound of the pedal from ultra-clean to semi-overdriven.

  That combination of compression and overdrive delivers semi gritty compression, warm compressed overdrive, singing compressed drive, or an extra channel added to a clean amp.

  The pedal uses true bypass switching, runs on 9 to 18VDC with no battery compartment, and is built in the USA with premium worldwide components, designed to withstand decades of abuse.
