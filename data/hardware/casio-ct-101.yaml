description: >-
  The Casio CT-101 (CasioTone 101) is a basic 8-voice analog preset synthesizer from 1981 with
  a 49-key keyboard, 25 preset sounds, and a distinctive Cosmic Tone patch that uses two
  oscillators tuned an octave apart for a unique fading effect.
details: |-
  Released in 1981, the CasioTone CT-101 is one of Casio's earliest forays into electronic
  keyboards. Despite its simplicity, it has earned a following among musicians drawn to its
  lo-fi analog character. The satin black painted metal case with wooden end-cheeks gives it a
  vintage aesthetic that belies its budget origins.

  The CT-101 offers 25 preset sounds and 4 performance modes, with most patches considered fairly
  basic. The standout is the Cosmic Tone preset, which uses two oscillators tuned an octave apart
  in an unusual configuration: as keys are held, oscillator 1 fades up while oscillator 2 fades
  down, creating a shifting octave drop effect that has become the instrument's signature sound.
  Organ tones are also regarded as usable and pleasant.

  Despite its limitations, the CT-101 has appeared in the work of notable artists including The
  Human League, Blondie, Vince Clarke, Severed Heads, Goldie, and Moby. Simple sustain and
  vibrato effects are the only sound modifiers available. The 49 full-size keys and compact form
  factor made it an accessible entry point for electronic music in the early 1980s.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 VCOs
  - Presets: 25 sounds, 4 performance modes
  - Effects: Sustain, vibrato
  - Keyboard: 49 full-size keys
  - Memory: 25 preset patches
  - Date produced: 1981
