name: B26 Orca
manufacturer: burl-audio
primaryCategory: outboard
categories:
  - rack-mount
url: "https://www.burlaudio.com/products/b26-orca"
description: "Discrete class-A control room monitor controller featuring BURL
  NextGen Analog circuitry with BOPA10 and BOPA8 op-amps, three stereo mix
  inputs, two stereo speaker outputs, and independent studio and headphone
  sends."
details: |-
  The B26 Orca is Burl Audio's control room monitor controller, built on an all-discrete, class-A analog circuit path with an emphasis on sonic transparency and 3D stereo imaging. Now featuring BURL NextGen Analog circuitry with the new BOPA10 and BOPA8 op amps, the B26 Orca delivers tighter bass and higher definition throughout the audio spectrum.

  The unit provides three stereo mix inputs, two stereo tape return inputs, and an RCA stereo input, alongside two stereo speaker outputs. An audiophile-grade 0.1% matched resistor stepped attenuator handles control room level, while independent studio and headphone sends with their own level controls offer flexible monitoring routing.

  Additional features include an external meter output and dedicated control room and studio headphone outputs.
specs: |-
  - Direct coupled, discrete, class-A signal path
  - BURL NextGen Analog circuit with BOPA10 and BOPA8 op amps
  - 3 stereo mix inputs
  - 2 stereo tape return inputs
  - RCA stereo input
  - 2 stereo speaker outputs
  - Audiophile 0.1% matched resistor stepped attenuator for control room level
  - Independent studio/phones send and level
  - External meter output
  - Control room and studio headphone outputs
