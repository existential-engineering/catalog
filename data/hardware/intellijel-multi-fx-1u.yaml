description: Another Dimension. Spice up any patch with some synced delay, lush
  chorus or cavernous reverb.
details: |-
  Multi-FX 1U provides three carefully crafted and highly musical sounding delay based FX in a compact 1U package. Powerful on its own but even more fun as part of a bigger fx chain that could include the Digiverb 1U, Pedal I/O 1U and other 3U FX modules like the Rainmaker and Springray for some dub craziness.

  Three FX modes: DELAY (tap/clock syncable, controls for rate/division, tone (feedback low pass filtering), and feedback amount), CHORUS (controls for modulation rate, tone (brightness) and modulation depth), and PLATE REVERB (controls for pre-delay, tone (brightness), and decay time).

  Stereo Wet/Dry balance for all three FX modes.
specs: |-
  - Width: 24HP
  - Depth: 33mm
  - Power: 130mA @ +12V, 12mA @ -12V
  - Three FX modes: Delay, Chorus, Plate Reverb
  - Tap/clock-syncable delay
  - Stereo wet/dry balance
