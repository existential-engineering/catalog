description: Compact analog semi-modular synthesizer in Eurorack format, with
  dual VCOs, a 24 dB ladder filter, step sequencer and arpeggiator. A pure
  analog signal path recreates circuits from the Model 15 modular synthesizer,
  and 48 patch points allow integration with external modules.
details: |-
  A compact analog synthesizer with dual VCOs for fat bass lines and lead sounds, the MODEL 15 is an authentic recreation of circuits from the legendary Model 15 modular synthesizer.

  The semi-modular design makes it ready to go right out of the box, with 48 patch points available to connect and integrate any module in a collection. It condenses what made the System 55 appealing into a sleek, compact chassis.

  Featuring a pure analog signal path, the MODEL 15 carries dual oscillators each with 4 waveforms, pulse width modulation and a sub-oscillator, and a classic 24 dB ladder filter with resonance. It also provides 3 separate memory slots for its 256-step sequencer and arpeggiator with multiple playback modes.

  Spring reverb emulation adds a sense of space to a riff or melody. Coupled with a fully analog 4-waveform LFO with dedicated controls for pitch, filter and pulse width modulation, the MODEL 15 is capable of lush, intricate and expansive sounds.

  The MODEL 15 is designed to fit into a standard Eurorack case: connect the power cables to the power supply and mount the module using the included screws, so it can be mixed with other synth modules.
specs: |-
  - Analog semi-modular synthesizer with dual VCO design
  - Pure analog signal path based on authentic VCO, VCF and VCA designs
  - Dual oscillators with 4 waveforms each, oscillator sync, pulse width modulation and sub-oscillator
  - Classic 24 dB ladder filter with resonance
  - Fully analog LFO with 4 waveforms and dedicated controls for pitch, filter and pulse width modulation
  - Step sequencer with 3 separate 256-step memory slots, key transpose and multiple playback modes
  - Arpeggiator with hold function and multiple playback modes
  - Spring reverb emulation
  - 48 patch points for modular connection and integration with external equipment
  - 37 controls for direct real-time access to parameters
  - Main module transferable to a standard Eurorack case
  - 16-voice Poly Chain for combining multiple synthesizers up to 16 voice polyphony
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
