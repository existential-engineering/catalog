url: https://collingsguitars.com/archtops/at-17/
description: The AT-17 is a fully-hollow 17" archtop electric guitar
  representing a pinnacle of craftsmanship. One of the rarest and most
  labor-intensive instruments in the lineup, it features a fully-carved premium
  figured maple body, a fully-carved solid spruce top, and an ebony fingerboard.
  It is finished in high-gloss nitrocellulose lacquer with grained ivoroid
  bindings throughout.
details: |-
  The AT-17 is a 17" fully-hollow archtop electric guitar built with X-bracing and an archtop mortise and tenon neck joint. The body is fully carved from premium figured maple with a solid spruce top. The ebony fingerboard has a 14"-26" compound radius and is bound with grained ivoroid purfling. S-holes are bound with purfling. The neck is premium figured maple with a deluxe flared haircut peghead profile featuring an ebony veneer with MOP Collings logo. Tuners are gold Schaller with ivoroid/ebony buttons. The pickguard is ebony with grained ivoroid binding. Ships with D'Addario EJ-17 strings and a deluxe hardshell case.
specs: |-
  - Construction: Fully-hollow X-braced
  - Body: Fully-carved premium figured maple
  - Top: Fully-carved solid spruce
  - Neck: Premium figured maple
  - Fingerboard: Ebony
  - Fingerboard Radius: 14" - 26" compound
  - Bindings: Grained ivoroid (body, fingerboard, peghead)
  - Bridge: Adjustable ebony
  - Tailpiece: Ebony
  - Soundhole: S-holes (bound with purfling)
  - Nut Width: 1 11/16"
  - Scale Length: 25 1/2"
  - Neck Joint: Archtop mortise and tenon
  - Frets: Medium 18% nickel-silver
  - Peghead Veneer: Ebony with MOP Collings logo
  - Peghead Profile: Deluxe Flared Haircut
  - Tuners: Gold Schaller with ivoroid/ebony buttons
  - Finish: High-gloss nitrocellulose lacquer
  - Pickguard: Ebony with grained ivoroid binding
  - Strings: D'Addario EJ-17 (.013" - .056")
  - Body Width: 17"
  - Body Length: 20 1/4"
  - Total Length: 42"
  - Case: Deluxe hardshell
