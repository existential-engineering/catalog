description: >-
  The Sequential Max is a six-voice multitimbral analog synthesizer from 1984
  that features individual VCFs per voice and dual onboard sequencers, though it
  suffers from limited user patch storage and a lack of real-time performance
  controls.
details: |-
  Released in 1984, the Sequential Circuits Max was designed as a multitimbral
  analog keyboard that could handle melody, bass, and chord parts
  simultaneously. Its architecture dedicates a VCO and VCF to each of its six
  voices, giving it a surprisingly flexible sound engine for its era.

  The Max offered 80 factory presets covering organ, string, and brass tones,
  but only 20 user-programmable patches. Editing required an external software
  editor running on a Commodore 64 or Macintosh, which limited hands-on
  tweaking considerably.

  Two built-in six-track real-time sequencers continued Sequential's tradition
  of integrating sequencing into their instruments. These could store up to 500
  notes across two songs, making the Max a self-contained composition tool.

  The synth's biggest drawback was its lack of performance controls — it shipped
  without pitch bend or modulation wheels. Combined with its budget
  construction, this positioned the Max as an affordable entry point into
  multitimbral synthesis rather than a stage performer.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 6 VCOs (sawtooth, triangle, pulse waveforms)
  - Filter: 6 x 24dB/oct lowpass VCFs (one per voice)
  - LFO: 1 (triangle and square waveforms)
  - Envelopes: Separate ADSR for VCF, VCA, and VCO
  - Keyboard: 49 keys
  - Memory: 80 presets, 20 user patches
  - Sequencer: 2 x 6-track real-time (500 notes total, 2 songs)
  - Control: MIDI
releaseDate: "1984"
