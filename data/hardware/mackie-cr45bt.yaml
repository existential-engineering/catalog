description: "Shape the sound of your Mackie CR4.5BT studio monitors on the fly,
  so you can mix a podcast episode, listen to music and DJ a house party, all
  with the same set of compact speakers."
details: |-
  4.5" powered studio monitors with tone control and Bluetooth®. The CR4.5BT is part of the CR Series (Gen 3) and is designed for content creation, gaming, music production, and casual listening.

  The sound-shaping tone control lets you tailor playback to the material at hand, while the location switch toggles between desktop and bookshelf modes to match the speaker placement.

  Driven by 50 watts RMS of bi-amplified Class A/B amplification, the CR4.5BT pairs a silk dome tweeter (with protective grille) with a 4.5" woven woofer for full-range reproduction in a compact cabinet.

  Connect via TRS, RCA, and 3.5 mm inputs, or stream wirelessly over Bluetooth®. A built-in headphone output is included for private listening.
specs: |-
  - Sound-shaping tone control
  - Location switch with desktop and bookshelf modes
  - 50 watts RMS of bi-amplified Class A/B amplification
  - TRS, RCA and 3.5 mm inputs
  - Bluetooth® connectivity
  - Built-in headphone output
  - Silk dome tweeter with protective grille
  - 4.5" woven woofer
  - Size: 8.9 × 6.1 × 8.3 in / 226 × 155 × 211 mm
  - Weight: 9.9 lb / 4.5 kg
