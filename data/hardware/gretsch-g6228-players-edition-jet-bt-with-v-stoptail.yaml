details: |-
  The all-new G6228 Players Edition Jet BT with V-Stoptail gives you powerful overdrive and shimmering cleans at the stomp of a switch.

  Chambered Mahogany Bodies - Thick and Acoustically Rich: Each Jet BT begins with a select 1.85" mahogany body with maple top that produces a strong, balanced mid-range, while the chambered body delivers a smooth attack and extended bandwidth that is remarkably wide and harmonically rich.

  Broad'Tron BT65 Pickups - Power & Fidelity: This powerful platform is fueled by all-new Gretsch Broad'Tron BT65 pickups. Designed by the famed Tim Shaw, the BT65 meticulously captures the guitar's sonic palette and reproduces powerful mids, extended lows and an exceptionally clear, yet smooth high end.

  Players Edition Comfort, Control & Performance: The Jet BT comes equipped with the Players Edition premium feature set, providing you with total control of your tone.
