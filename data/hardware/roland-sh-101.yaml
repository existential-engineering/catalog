description: >-
  Roland's iconic monophonic analog synthesizer featuring a single VCO with
  sub-oscillator, a self-oscillating lowpass filter, built-in arpeggiator and
  100-step sequencer, and CV/Gate connectivity, available in gray, blue, red,
  and rare white finishes.
details: |-
  The Roland SH-101 is one of the most celebrated monophonic analog synthesizers ever produced, occupying a unique sonic territory between the squelchy TB-303 and the fuller-bodied Juno bass sounds. Released in 1983, its single VCO offers independent level controls for sawtooth, square/pulse/PWM, and sub-oscillator outputs, providing a surprisingly versatile range of timbres from a seemingly simple architecture.

  The filter section is the heart of the SH-101's character, featuring a resonant, self-oscillating lowpass design that can be modulated by the envelope generator, LFO, and keyboard tracking. The LFO provides triangle, square, random, and noise waveforms for modulation, while the pitch bender can be routed to control VCF cutoff, pitch, and LFO rate simultaneously. A white noise generator and portamento effect round out the sound-shaping tools.

  Beyond its synthesis capabilities, the SH-101 includes a digital sequencer capable of recording up to 100 steps and an arpeggiator with up, down, and up/down patterns. These features, combined with its lightweight construction and optional hand grip attachment for keytar-style performance, made it a favorite among live electronic performers. The 32-key keyboard and CV/Gate inputs and outputs allowed integration with other analog equipment, though native MIDI support was absent and required aftermarket modifications.

  Available in gray, blue, red, and the exceptionally rare white finish, the SH-101 has become a highly sought-after vintage instrument. Its lack of patch memory means every sound must be dialed in from scratch, but this limitation has arguably contributed to its appeal as a hands-on, immediate instrument. It remains a cornerstone of acid, techno, and electronic music production decades after its discontinuation.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth, square/pulse/PWM, sub-oscillator)
  - LFO: Triangle, square, random, noise waveforms
  - Filter: Resonant, self-oscillating lowpass; modulation via EG, LFO, keyboard tracking
  - VCA: ADSR envelope; modulation via EG or gate
  - Sequencer: 100 steps maximum
  - Arpeggiator: Up, down, up/down patterns
  - Keyboard: 32 keys
  - Control: CV/Gate in/out
  - Memory: None
  - Colors: Gray, blue, red, white (rare)
