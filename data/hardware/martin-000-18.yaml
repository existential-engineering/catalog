description: The 000-18 pairs spruce and mahogany for clear, balanced tone in a
  comfortable Auditorium body. Handcrafted with a solid spruce top and solid
  mahogany back and sides, it offers a bright treble response, punchy midrange,
  and impressive projection in a classic, comfortable design.
details: |-
  The Martin 000-18 is part of the refreshed Standard Series, pairing a solid Sitka spruce top with solid mahogany back and sides in the comfortable 000-14 fret Auditorium body shape. The result is a balanced, articulate voice with bright treble response, punchy midrange, and impressive projection that suits fingerstyle, flatpicking, and singer-songwriter work alike.

  The top is braced with GE-scalloped 1/4" spruce X-bracing for a responsive, open tone, while the dovetail neck joint and gloss-finished spruce top reinforce traditional Martin construction. Cosmetic appointments include a faux tortoise pickguard, Old Style 18 multi-stripe rosette, abalone Old Style 18 fingerboard inlays, and an aging toner top.

  The neck features a GE Modified Low Oval shape with Martin's High-Performance Taper, a satin-finished select hardwood neck, and an ebony fingerboard with a 1 3/4" nut width and 24.9" scale length. The guitar ships Pleked from the factory for clean, consistent fretwork and playability.

  Hardware includes an ebony bridge with a GE Modern Belly drop-in saddle, compensated bone saddle on a 16" radius, bone nut, ebony bridge pins, and nickel open-gear tuners with butterbean knobs. The headstock carries a solid East Indian rosewood headplate with the Script Old Style overlay logo.

  Each 000-18 ships with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings pre-installed and a hardshell case with brass/nickel hardware, plush interior, and a laminated wood shell. The model is covered by Martin's Limited Lifetime Warranty.
specs: |-
  - Body size: 000-14 Fret (Auditorium)
  - Top: Solid Sitka Spruce, gloss finish, aging toner
  - Top bracing: X-Brace, GE-Scalloped, Spruce, 1/4"
  - Back: Solid Mahogany
  - Sides: Solid Mahogany
  - Neck joint: Dovetail
  - Neck shape: GE Modified Low Oval
  - Neck taper: High-Performance Taper
  - Neck material: Select hardwood, satin finish
  - Scale length: 24.9"
  - Frets: 20 total, joins body at 14th fret
  - Fingerboard: Ebony
  - Nut width: 1 3/4"
  - Width at 12th fret: 2 1/8"
  - Fingerboard inlays: Old Style 18 (Abalone)
  - Bridge: Ebony, GE Modern Belly, drop-in saddle
  - Saddle: Compensated bone, 16" radius
  - Nut: Bone
  - Bridge pins: Ebony
  - Tuning machines: Nickel open gear with butterbean knobs
  - Pickguard: Faux tortoise
  - Rosette: Old Style 18 multi-stripe
  - Headplate: East Indian Rosewood with Script Old Style overlay
  - Binding: Black
  - Electronics: None
  - Pleked: Yes
  - Includes: Hardshell case, Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings
