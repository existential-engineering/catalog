id: uR16IW0s4IgSeSahQfQ2n
name: VX 6
manufacturer: tannoy
primaryCategory: speaker
url: https://www.tannoy.com/en/products/0312-anb
description: The VX 6 is a compact 6" Dual Concentric full range loudspeaker for
  portable and installation applications.
details: |-
  The VX 6 is a compact 6" Dual Concentric full range loudspeaker for portable and installation applications. It delivers an exceptional performance-to-size ratio with 100 W continuous / 400 W peak power handling, making it suitable for small-scale performance sound reinforcement, background music, and high-intelligibility speech applications. The point-source Dual Concentric driver provides precise 90° constant-directivity dispersion for optimum coverage and forward projection. Ideal for FOH, floor monitor, delay, and stage front fill use, and equally suited as a complement to larger systems. Available in black or optional white finish.
specs: |-
  - frequencyResponse: 92 Hz – 35 kHz (±3 dB); 80 Hz – 45 kHz (–10 dB)
  - nominalDispersion: 90° conical @ –6 dB point
  - directivityFactorQ: 5.6
  - directivityIndexDI: 7 dB
  - powerHandlingContinuous: 100 W
  - powerHandlingPeak: 400 W
  - sensitivity: 91 dB (1 W @ 1 m)
  - maxSPLContinuous: 111 dB
  - maxSPLPeak: 117 dB
  - nominalImpedance: 8 Ω
  - crossoverType: Passive / Bi-amp switchable
  - components: 1 × 6" (150 mm) constant directivity PowerDual Dual Concentric driver
  - connectors: 2 × industry-standard 4-pole twist-lock speaker connectors; 1 × barrier strip terminals
  - wiring: Pins 1+ / 1– Input, Pins 2+ / 2– Link
  - dimensionsHWD: 334 × 226 × 216 mm (13.1" × 8.9" × 8.5")
  - netWeight: 5.0 kg (11.0 lbs)
  - construction: 12 mm (½") plywood, vented and internally braced
  - grille: Powder coated perforated steel
  - flyingHardware: M6 × 2 yoke bracket insert (4 mm allen key); M6 × 4 inserts; compatible with industry standard brackets; blanking plate for optional VTH pole mount
