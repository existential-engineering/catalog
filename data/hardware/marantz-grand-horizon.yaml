description: Flagship Wireless Speaker Powered by HEOS, featuring innovative
  proprietary amplification paired with powerful driver technology to deliver a
  superior listening experience via an intuitive user interface. Key innovations
  include the Marantz Rise Amplifier, Marantz Radiance 360 degree Seamless
  Fabric, Marantz AuraControl, and Marantz Mirage DSP technology. The design
  embodies Marantz signature sound with luxurious materials and a timeless
  silhouette.
details: |-
  The Marantz signature sound, embraced by music lovers and critical listeners around the world, is synonymous with texture, nuance, and authenticity. It's a sound like no other.

  Elements of the iconic Marantz design ethos are strikingly reimagined and complemented with luxurious materials to create Marantz Grand Horizon's unique yet timeless silhouette.

  Marantz Grand Horizon features Marantz Radiance 360 Seamless Fabric. This engineering feat balances a seamless, luxurious feel, visual impact, durability, and acoustic transparency.

  The Marantz Rise Amplifier is the next generation of Marantz amplification. It quickly and accurately amplifies audio signals for a superior listening experience. The Marantz Gravity Drivers use neodymium magnets to ensure powerful, distortion-free sound.

  Marantz Mirage is a bespoke, in-house Digital Signal Processing algorithm that helps create pristine sound that extends far beyond the physical boundaries of Marantz Grand Horizon.

  HEOS has a search feature that lets you find and stream from the world's leading music platforms, including TIDAL, Pandora, and Amazon Music HD. Devices Powered by HEOS allow you to control multiple rooms, all with the HEOS app.
specs: |-
  - Total amplifier power (FTC): 370W
  - Total amplifier power (peak): 860W (not tested under the FTC standard)
  - Total amplifier power (peak, raw amplifier power): 1400W (not tested under the FTC standard)
  - Amplifier topology: Marantz Rise GaN FET
  - Bass driver: 1 x 8 in Marantz Gravity
  - Wideband drivers: 4 x 3 in
  - High frequency drivers: 3 x 1 in
  - Frequency response: 28Hz to 20kHz (+/-3dB), 18Hz (-10dB)
  - Maximum SPL: 111dB (1m)
  - Peak SPL: 122dB (1m)
  - Analog audio: 1 pair RCA L/R
  - Digital audio: 1 x TOSLINK optical
  - USB: 1 x USB-C (mass storage)
  - HDMI: 1 x eARC / ARC
  - Decoding: Dolby Atmos, Dolby TrueHD, DSD, Dolby Digital+, Dolby Digital, LPCM
  - Max PCM sample rate / bit depth: stereo 192kHz / 24 bit, multi-channel 192kHz / 24 bit (7.1 channel)
  - Max DSD data rate: 5.6 MHz (DSD x2)
  - Stereo file formats (HEOS network share or USB): WMA up to 192 kbps, AAC and MP3 up to 320 kbps, WAV, ALAC and FLAC up to 24-bit/192kHz, DSD 2.8 MHz and 5.6 MHz
  - Bluetooth: BT 5.4
  - AirPlay 2
  - Spotify Connect
  - Wired connectivity: Ethernet
  - Wireless connectivity: dual band 802.11 a/b/g/n/ac/ax
  - Control system compatibility via TCP/IP: Crestron, Control4, AMX
  - HEOS app: iOS, Android, Kindle Fire
  - USB storage device playback: FAT32 and NTFS formatted drives
  - NAS: network share, UPnP
  - Product colors: Moon Ray, Midnight Sky, Marantz Champagne
  - In the box: Certificate of Authenticity, quick start guide, power cable, HDMI cable
  - User interface: volume up/down, play/pause, multi colored LED status indicator, connect button (rear), Bluetooth button (rear)
  - Dimensions (H x W x D): 19.41 x 10.04 x 20.83 in (493 x 255 x 529.2 mm)
  - Weight: 46.9 lbs (21.3 kg)
