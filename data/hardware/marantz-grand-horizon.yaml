name: Grand Horizon
manufacturer: marantz
primaryCategory: speaker
url: https://www.marantz.com/en-us/product/wireless-speakers/marantz-grand-horizon/300864.html
description: Flagship Wireless Speaker Powered by HEOS, featuring innovative
  proprietary amplification paired with powerful driver technology to deliver a
  superior listening experience via an intuitive user interface. Key innovations
  include the Marantz Rise Amplifier, Marantz Radiance 360 degree Seamless
  Fabric, Marantz AuraControl, and Marantz Mirage DSP technology. The design
  embodies Marantz signature sound with luxurious materials and a timeless
  silhouette.
details: |-
  The Grand Horizon is Marantz's flagship wireless speaker powered by HEOS, combining innovative proprietary amplification with powerful driver technology to deliver a superior listening experience. It introduces the Marantz Rise GaN FET amplifier topology, Marantz Radiance 360 degree seamless fabric, Marantz AuraControl, and Marantz Mirage DSP technology.

  A dedicated 8-inch Marantz Gravity bass driver is paired with four 3-inch wideband drivers and three 1-inch high-frequency drivers, producing up to 122 dB peak SPL at 1 meter with frequency response down to 18 Hz (-10 dB). The speaker supports Dolby Atmos, Dolby TrueHD, Dolby Digital+, Dolby Digital, LPCM, hi-res PCM up to 192 kHz / 24-bit (stereo and 7.1 multi-channel), and DSD up to 5.6 MHz.

  Streaming is provided via HEOS, AirPlay 2, Bluetooth 5.4, and Spotify Connect, with access to Pandora, Spotify, TuneIn, SiriusXM, Amazon Music, TIDAL, iHeartRadio, Deezer, Mood:Mix, Sony Hi-Res, AWA, Play, and SoundCloud. Available in Moon Ray, Midnight Sky, and Marantz Champagne finishes.
specs: |-
  - Total Amplifier Power (FTC): 370W
  - Total Amplifier Power (Peak): 860W
  - Total Amplifier Power (Peak, Raw): 1400W
  - Amplifier Topology: Marantz Rise GaN FET
  - Bass: 1x8 inch Marantz Gravity
  - Wideband: 4x3 inch
  - High Frequency: 3x1 inch
  - Frequency Response: 28Hz to 20kHz (+/-3dB), 18Hz (-10dB)
  - Maximum SPL: 111dB (1M)
  - Peak SPL: 122dB (1M)
  - Decoding: Dolby Atmos, Dolby TrueHD, DSD Dolby Digital+, Dolby Digital, LPCM
  - Max PCM: 192kHz / 24 bit (Stereo and Multi-Channel 7.1)
  - Max DSD: 5.6 MHz (DSD x2)
  - File Formats: WMA (192kbps), AAC/MP3 (320kbps), WAV/ALAC/FLAC (24-bit/192kHz), DSD (2.8/5.6MHz)
  - Bluetooth: BT 5.4
  - AirPlay 2
  - Spotify Connect
  - Music Services: Pandora, Spotify, TuneIn, SiriusXM, Amazon Music, TIDAL, iHeartRadio, Deezer, Deezer HiFi, Mood:Mix, Sony Hi-Res, AWA, Play, SoundCloud
  - Colors: Moon Ray, Midnight Sky, Marantz Champagne
  - Dimensions: 19.41"H x 10.04"W x 20.83"D (493 x 255 x 529.2mm)
  - Weight: 46.9 lbs (21.3kg)
