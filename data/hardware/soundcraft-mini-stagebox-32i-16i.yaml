details: |-
  Soundcraft Mini Stagebox 32i and 16i combine high-quality components with a streamlined design, making it easy to add multiple channels of remote-controlled I/O to your Si-series mixing console. The Studer-designed mic preamps provide exceptional sound quality, while the compact form factor offers easy transport and fast configuration. Ideal for live engineers, houses of worship, bands, club owners and corporate installations, Soundcraft Mini Stageboxes allow you to replace heavy, expensive analog snakes with a single RJ45 Cat5 style Ethernet cable.

  Soundcraft Mini Stageboxes offer remarkable value while maintaining the industry-leading performance that Soundcraft live solutions are known for. Renowned Studer-designed mic preamps deliver warm, rich sound for live performances and recording events.

  Soundcraft Mini Stageboxes provide multi-channel MADI I/O via standard Cat5 cabling, eliminating the need to run expensive and heavy analog snakes from the stage to front-of-house mixing positions. Dedicated XLR mic pre inputs allow 32 or 16 simultaneous channels of external analog input. Mini Stagebox 32i offers twelve analog outputs, while Mini Stagebox 16i offers eight analog outputs for easy connection to house and stage monitors and broadcast or streaming feeds.

  A streamlined design provides essential connections and features, including MADI over RJ45 connectors built right onto the chassis. No local hardware configuration or installing option cards are required—simply plug in, power on, select inputs and control remotely using a Soundcraft Si console.

  FULL INTEGRATION WITH Si SERIES MIXERS
