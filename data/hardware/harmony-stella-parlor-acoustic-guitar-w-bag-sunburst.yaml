details: |-
  Some guitars feel like they've already lived a little. Stella is one of them. First built in 1899 by Oscar Schmidt, the Stella name found its way into the Harmony family in 1939, and into the hands of Woody Guthrie, Elvis Presley, and Kurt Cobain along the way. The Foundation Series Stella picks up that thread. It's a parlor-sized acoustic built for songwriting, late-night practice, and the kind of melodies that don't need much room to breathe. A solid spruce top with mahogany back and sides gives the small body a voice that's warm, clear, and unmistakably its own. Spruce X-bracing opens the projection without crowding the tone. A bone nut and saddle keep things resonant note to note. The slotted headstock, soundhole rosette, and off-white binding are quiet nods to the original Stella, and D'Addario coated strings hold their brightness through long playing sessions. A padded gig bag is included. Available in Sunburst, Moonstone Blue, Backwoods Green, and Ivory.
