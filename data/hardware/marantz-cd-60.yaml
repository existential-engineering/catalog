description: Extraordinary sound and peerless style—Marantz CD 60 celebrates
  your CD collection with a player engineered to sound better than any other in
  this class. Built with high quality materials and Sound Master tuned, CD 60
  adds precision CD playback to MODEL 40n or any high-quality audio system.
details: |-
  Premium CD Player with Modern Design and Custom HDAM. CD 60 adds precision CD playback to MODEL 40n or any high-quality audio system. Compatible with CD, CD-R/RW, WMA, MP3, and AAC formats. Hi-Res USB Playback supports FLAC, WAV, AIFF, ALAC (up to 192-kHz/24bit), and DSD (up to 5.6-MHz). Available in Silver/Gold and Marantz Black.
specs: |-
  - Frequency response USB DSD: 2Hz - 50kHz (-3dB); USB PCM: 2Hz - 50kHz (-1.5dB); CD: 2Hz - 20kHz
  - Total Harmonic Distortion USB DSD: 0.0006%; USB PCM 24bit: 0.0005%; CD: 0.0015%
  - Signal to Noise Ratio USB DSD: 110dB; USB PCM 24bit: 118dB; CD: 118dB
  - Dynamic Range USB DSD: 110dB; USB PCM 24bit: 118dB; CD: 101dB
  - Line Output Level: 2.2Vrms
  - Headphone Output Level: 28mW / 32 ohms
  - Power Consumption: 38W (Standby: 0.3W)
  - Unit Dimensions: 442 x 129 x 396mm
  - Net Weight: 7.5kg
  - Available Colors: Silver/Gold and Marantz Black
  - CD Compatibility: CD / CD-R/RW / WMA / MP3 / AAC
  - Hi-Res USB Playback: FLAC, WAV, AIFF, ALAC (up to 192-kHz/24bit), DSD (up to 5.6-MHz)
