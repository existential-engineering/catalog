description: Extraordinary sound and peerless style—Marantz CD 60 celebrates
  your CD collection with a player engineered to sound better than any other in
  this class. Built with high quality materials and Sound Master tuned, CD 60
  adds precision CD playback to MODEL 40n or any high-quality audio system.
details: |-
  CD 60 is built for listeners who cherish their CD collections, with architectural design, modern materials and intuitive operation.

  The proprietary HDAM circuit is further optimized from its previous version by placing the parts symmetrically on the audio board and creating a more direct signal path, improving the sound stage over earlier models.

  Beyond discs, the front USB-A input plays MP3, WMA, AAC, WAV, FLAC HD, ALAC and AIFF files up to 192-kHz/24-bit, plus DSD up to 5.6 MHz, with native DSD playback.

  The headphone stage combines a high slew rate op-amp with HDAM-SA2 and offers Low / Mid / High gain settings. Two selectable digital filters are provided, and the front display dims across four levels.

  The Marantz Sound Master tuned CD 60 with careful parts selection. Available in Silver/Gold and Marantz Black with an aluminum front panel.
specs: |-
  - CD compatibility: CD / CD-R/RW / WMA / MP3 / AAC
  - data disc compatibility: DSD / WAV / ALAC
  - Fixed analog output (RCA): 1 (gold plated)
  - Optical input / output: 0 / 1
  - Coaxial input / output: 0 / 1
  - USB A: 1 (front), mass storage class, 5V/1A, FAT 16/32, FLAC / WAV / AIFF / ALAC / DSD, native DSD playback
  - Remote control bus terminal: RC-5 in / out with external / internal select switch
  - Flasher input: Yes (U version)
  - HDAM: New HDAM + HDAM-SA2
  - Power transformer: EI
  - Headphone amp: high slew rate op-amp + HDAM-SA2, gain setting Low / Mid / High
  - Digital filter: Filter 1, 2 selectable
  - Frequency response: USB DSD 2Hz - 50kHz (-3dB), USB PCM 2Hz - 50kHz (-1.5dB), CD 2Hz - 20kHz
  - Total harmonic distortion: USB DSD 0.0006%, USB PCM 24bit 0.0005%, CD 0.0015%
  - Signal to noise ratio: USB DSD 110dB, USB PCM 24bit 118dB, CD 118dB
  - Dynamic range: USB DSD 110dB, USB PCM 24bit 118dB, CD 101dB
  - Line output level: 2.2Vrms
  - Headphone output level: 28mW / 32 ohms
  - Power consumption: 38W, standby 0.3W
  - Dimensions (W x H x D): 442 x 129 x 396 mm
  - Net weight: 7.5 kg
  - Front (center) panel: aluminum
  - Available colors: Silver/Gold and Marantz Black
