details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra FS OM is an acoustic treasure, pairing a solid spruce top with solid mahogany back and sides, in an attractive natural gloss finish. The satin-finished mahogany neck's strength and resilience ensure straightness, while the rosewood fretboard adds smoothness for comfortable fretting and seamless transitions between notes. Solid spruce X-bracing enhances sound projection with remarkable depth, while the bone nut and saddle contribute to superior tone and resonance. Made from premium tonewoods that age gracefully, this guitar will only improve in appearance and sound with each passing year of play. The Terra FS OM comes strung with D'Addario EXP16 coated strings for lasting bright tones on every performance. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
