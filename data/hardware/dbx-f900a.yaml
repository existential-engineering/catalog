details: |-
  The dbx F900A is a feedback suppressor module designed for the dbx 900 Series modular rack system. It provides automatic feedback suppression for live sound applications and is the A-revision of the F900 module.

  As part of the 900 Series, the F900A fits into a dbx 900 host chassis alongside other 900 Series modules for a fully customizable signal processing rack.

  Note: This product is discontinued.
