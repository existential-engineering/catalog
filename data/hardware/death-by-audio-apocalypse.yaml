description: A multi-mode fuzz pedal that routes an overdriven signal into one
  of five selectable post-amplifiers for different fuzz, octave and distortion
  tones, with a sweepable frequency equalizer.
details: |-
  FUZZ TO THE NEXT LEVEL The Apocalypse is our jack-of-all trades fuzz pedal. After being dramatically overdriven, the signal is routed to one of five selectable post-amplifiers for five wild and unique fuzz tones. Toggle through its five signal paths and choose your desired apocalyptic sound. To further refine this beast, control the Sweepable Frequency Equalizer and carve your tone out just the way you like it. Use this pedal as a boost for solos, an amp simulated recording DI, your main fuzz sound, a bass blitzer, or run anything into it you want to beef up, blast out, destroy, or supercharge!! Controls Knobs Volume Adjusts the output volume of the pedal. Drive Controls the volume of the initial preamp inside the pedal. Turn it up to get more distortion and fuzz or pull it back to get cleaner overdrives and boosts. Sweepable Frequency Equalizer This is a special tone knob designed to function as a multitude of tone controls simultaneously. Its range is extreme, starting with a bass booster that fades into a mid scoop, followed by a mid boost, and eventually into a few stages of treble-boosting to give you a beautiful bright sound. Rotary Selector Twin-T Scoop A circuit adding bass and treble simultaneously. Quieter volume than the rest. War Fuzz A very full and dynamic distortion with rich harmonics and sustain. Dual J-FET Similar to the War Fuzz setting using dual J-FETs to get its sound. Octave Rect Sums the bottom and top halves of a waveform to create an octave up. Gain x1000 The gain is cranked super high on this post amp causing erratic results. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 5.8 mA Physical Details Dimensions: 5.87" x 4.72" x 2.46" (including hardware) Weight: 20 oz. Sound Samples Twin-T Scoop Guitar Punk Guitar Rock Bass Fuzz Attack Synth Shredder War Fuzz Guitar Straight-Ahead Guitar Heavy Riff Bass Scooped Riff Synth Scooped Dirt Dual J-FET Guitar Metal Chug Bass Doom Synth Smashed Solo Octave Rect Guitar Rip and Tear Bass Classic Fizz Synth Smashed Commlink Gain x1000 Guitar Searing Solo Guitar Collapsing Chug Guitar Speaker Ripper Bass Rumble Fuzz Synth Screamer
