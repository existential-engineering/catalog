name: Black LTD. Overdriver Mk. II
manufacturer: mr-black
primaryCategory: pedal
categories:
  - overdrive
url: https://www.mrblackpedals.com/products/black-ltd-overdriver-mk-ii
description: A dynamic, natural overdrive built on the original Black LTD.
  Overdriver, using an internal voltage inverter for expanded headroom and low
  noise. A Jack Deville limited run of 95 pieces.
details: |-
  The Black LTD. Overdriver Mk. II builds on the original Black LTD. Overdriver,
  delivering dynamic, natural and neutral organic overdrive. It works on its own
  as a fresh overdrive channel, stacked with other pedals to push them harder, or
  slammed into an already-overdriven amplifier for a show-stopping roar.

  Like the original circuit, the Mk. II includes an internal voltage inverter
  that creates bipolar power rails. This greatly enhances the dynamic range and
  expression of the overdrive while reducing unwanted harmonic distortion and
  noise. Thanks to this power circuit the pedal cleans up very well, either by
  rolling back the guitar's volume knob or by picking lightly.

  At full drive the Mk. II produces heavy saturation and sustain with plenty of
  output volume on tap, while retaining a smooth, natural decay and minimal tonal
  coloration. It behaves like an instrument in its own right, blending into the
  signal chain as an extension of the guitar and amplifier rather than an outboard
  effect.

  Compared with the original Overdriver, the Mk. II has a punchier lower-mid focus
  while keeping its strong bottom, sweet highs and signature dynamic response. It
  is exceptional on guitar, baritone and bass. Jack Deville original design,
  limited run of 95 pieces.

  The Mk. II can only be powered by 9VDC, from an industry-standard 9VDC 2.1mm
  negative-center-pin supply or an optional internal 9V battery. Any voltage in
  excess of 9.8VDC will damage and destroy the internal voltage inverter circuit.
specs: |-
  - Internal voltage inverter with bipolar power rails
  - Cleans up via guitar volume or pick attack
  - Suited to guitar, baritone and bass
  - Limited run of 95 pieces
  - Jack Deville original design
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (max 9.8VDC)
