description: Spring reverb with built-in feedback FX.
details: |-
  Erica Synths Black Spring Reverb is a different take on spring reverberation units. It carries a vactrol based audio compressor, it can drive an external tank or a combination of internal and external tanks, and it has built-in feedback effects that animate the reverb.

  The feedback effects include pitch shifters, a delay and a ring modulator, seven distinct effects in all. Feedback amount and effect parameters can be set by hand or controlled by CV, which makes the module an experimental instrument on its own.

  The module comes with a compact spring reverberation tank that installs in most eurorack cases, including a skiff case. Internal tank dimensions are 190mm x 67mm x 24mm, or 30mm with spacers.

  The design works with a wide variety of spring tanks, and the best results come from tanks with low input impedance of 8 to 200 ohm.

  The panel is 12HP wide and the module is 30mm deep. Audio input level and CV level both span -5V to +5V, and power consumption is 43mA on the positive rail and 71mA on the negative rail.
specs: |-
  - Compact spring reverberation tank to install in a skiff case
  - Manually and CV controlled feedback amount
  - Vactrol-based compressor
  - 7 distinct feedback effects
  - Selection between internal, external reverberation tanks or a combination of both
  - Feedback Send and Return jack sockets
  - Audio input level -5V to +5V
  - CV level (full span) -5V to +5V
  - Power consumption 43mA, -71mA
  - Module width 12HP
  - Module depth 30mm
  - Internal reverb tank dimensions 190mm x 67mm x 24mm (30mm with spacers)
  - Best results with tanks of low input impedance, 8 to 200 ohm
