  attached to one FH-2 for a total of 64 CV outputs.
details: |-
  The FHX-8CV is an expansion module for the FH-2 'factotum' Eurorack module, providing 8 extra CV outputs.

  Up to seven FHX-8CVs can be attached to one FH-2 for a total of 64 CV outputs.

  That is in addition to the four FHX-8GTs that can be added to an FH-2 for extra gate and clock outputs.

  The module also works with the FH-1 'faderHost' USB MIDI host Eurorack module, where the output voltage range is set by jumper rather than in software.
specs: |-
  - Panel width: 4HP
  - Module depth: 48mm
  - Current draw: 65mA on the +12V rail, 33mA on the -12V rail
  - Outputs: 8
  - Digital-to-analogue conversion: 14 bit
  - Voltage range: software (FH-2) or jumper (FH-1) selectable between +/-5V and 0-10V
