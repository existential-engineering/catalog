url: https://bastl-instruments.com/eurorack/modules/solenoid
description: Quad trigger-to-solenoid motor driver module for Eurorack. Drives 4
  solenoid motors using voltage directly from the power supply, physically
  striking objects to create percussive sounds. CV circuitry and motor driving
  circuitry are optically isolated with no ground connection between them. Each
  channel has a dedicated trigger input and a shared output pulse width knob.
  Requires an external power supply for the motors. Compatible with the Solenoid
  Expander module for individual CV velocity control per channel.
details: |-
  5HP, 50mm depth. +5V <30mA (+12V: 0mA, -12V: 0mA). PTC fuse and diode-protected 16-pin power connector. Shared pulse width knob for all four channels. Requires external power supply for solenoid motors.
