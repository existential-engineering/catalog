description: Winning NAMM Best-in-Show upon its release in 2015, the Vader
  became an instant fan-favorite. The extreme, modern aesthetic and headless
  build ushered in a new era for Kiesel, acting as the catalyst for the
  manufacturer's deep headless catalog and innovation.
specs: |-
  - Scale length: 25.5" or 27" fixed, or 25.5" to 26.5", 25.5" to 27" and 26" to 27.5" multiscale
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder, 31.25" long, 1.66" thick, 12" wide
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" to 2.12" at nut depending on string count and scale
  - Construction: neck-through with sculpted neck heel
  - Fingerboard: ebony with 20" radius
  - Bridge: Hipshot fixed bridge or Hipshot fixed headless multiscale bridge, .4125" (10.5mm) spacing
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector; flush mount or side-mounted output jack placement
  - Hardware: black
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 5.5 lbs, 5.7 lbs or 5.9 lbs depending on configuration
  - Gallery captions name V6, V6X tremolo, V8 multiscale and VM6 multiscale configurations
