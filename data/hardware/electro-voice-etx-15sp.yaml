url: https://products.electrovoice.com/na/en/etx-15sp/
description: The ETX-15SP is a 15-inch powered subwoofer driven by an 1800 W
  Class-D amplifier with integrated FIR-Drive DSP. The DVX3159A 15-inch woofer
  in an EVCoat-finished 18 mm plywood enclosure delivers up to 134 dB peak SPL
  with low-frequency extension to 32 Hz (-10 dB). A dedicated cardioid DSP
  preset enables true cardioid performance across the full operating bandwidth
  when multiple units are deployed. The cabinet provides four selectable
  low-pass crossover points (80, 100, 120, 150 Hz), a combo pole cup compatible
  with ETX full-range models, removable casters, and a 16 AWG powdercoated steel
  grille.
details: >-
  1800 W Class-D power amplifier with integrated FIR-Drive DSP


  DVX3159A 15-inch (380 mm) woofer


  Maximum SPL of 134 dB peak


  Frequency response 37 Hz - 150 Hz (-3 dB), 32 Hz - 180 Hz (-10 dB)


  Adjustable low-pass crossover: 80 / 100 / 120 / 150 Hz


  Dedicated DSP preset for true cardioid performance across the full operating
  bandwidth


  Combo pole cup compatible with ETX full-range models


  18 mm plywood enclosure with EVCoat finish


  16 AWG steel grille with powdercoat


  Removable casters for transport
