url: https://apiaudio.com/product/529-stereo-compressor/
description: Dual-slot 500-series stereo compressor inspired by the API 2500,
  with THRUST® sidechain circuit, feed-forward/feed-back switching, three knee
  settings, variable or auto makeup gain, and transformer-coupled output via
  2520/2510 discrete op-amps.
details: |-
  Two-slot 500-series stereo compressor. Occupies two adjacent 500-series
  slots. THRUST® frequency-dependent sidechain filter. Old/New
  (feed-back/feed-forward) mode switch. Three selectable knee settings. Variable
  or auto makeup gain. Hard relay bypass. Dual 10-LED VU meters + 10-LED GR
  meter. API 2520/2510 discrete op-amps, transformer-coupled output. VPR
  Alliance compliant. Five-year warranty.
specs: |-
  - Input impedance: 80 kΩ
  - Output impedance: 50 Ω
  - Nominal level: +4 dBu
  - Max input: +26 dBu
  - Max output: +26 dBu
  - Attack: <1 ms–50 ms
  - Release: 0.05–4 s
  - Ratios: 1.5:1 to ∞:1
  - Threshold: +10 to −20 dBu
  - Frequency response: ±0.25 dB (20 Hz–20 kHz)
  - S/N ratio: 106 dB
  - Power: +16V DC @ 180 mA, −16V DC @ 180 mA (across 2 slots)
  - Dimensions: 3″ × 5.25″ × 7″
  - Weight: 2.4 lb
