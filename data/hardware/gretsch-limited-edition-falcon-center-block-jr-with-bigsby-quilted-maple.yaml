details: |-
  The Limited Edition Falcon Center Block Jr. offers a unique twist on the classic Falcon recipe. Featuring a scaled down body size, a gorgeous, quilted maple top, mahogany back and sides, and a redesigned Channel Core center block, this rare bird is sure to impress with its upscale style and glorious sound.

  The instrument includes TV Jones pickups designed for versatility, with the neck model providing clean, compressed highs and mids with a tight and controlled low-end, while the bridge pickup delivers a slightly rounder top end and higher output.

  The redesigned Channel Core combines maple top layer and spruce bottom layer with a more focused chambering design for enhanced midrange punch and faster note attack.
