description: A lightweight 120-watt bass combo delivering classic Ashdown tone
  through a single 15" speaker. It offers passive and active inputs, a 4-band EQ
  with sweepable mids, a footswitchable valve-emulated overdrive, an FX loop, a
  balanced XLR DI output, a switchable tweeter, a headphone output, an extension
  speaker out, and an AppTek socket for iOS amp-sim integration.
details: |-
  Lightweight 120-watt bass combo with a single 15" speaker. Passive and active inputs, a comprehensive 4-band EQ with sweepable mids, a footswitchable valve-emulated overdrive, an FX loop, a balanced XLR DI output and a switchable tweeter. Headphone output for silent practice and an 8 Ohm extension speaker output. Supplied with an AppTek cable so players can use iOS amp-sim and FX apps (including Ashdown's ABM Pre App via Agile Partners Amp Kit). Lightweight ply construction.
specs: |-
  - Power output: 120 watts
  - Speaker configuration: 1 x 15"
  - Passive and active inputs
  - 4-band EQ with sweepable mids
  - Footswitchable valve-emulated overdrive
  - FX loop
  - Balanced XLR DI output
  - Switchable tweeter
  - Headphone output
  - 8 Ohm extension speaker output
  - AppTek socket (iOS amp-sim integration)
  - Weight: 17 kg (37 lb)
