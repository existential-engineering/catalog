description: The NSEQ-2 is a two-channel fully parametric equalizer in a 2U rack
  chassis, with four EQ bands covering 20 Hz to 20 kHz and a Q range of 0.4 to
  4.0. Twin Topology lets each channel run through either an all-triode 300 V
  vacuum tube signal path or an all-discrete J-FET solid state path.
details: |-
  The NSEQ-2 is a two-channel parametric equalizer built around Millennia's Twin Topology approach, where a switch selects between an all-triode 300 V vacuum tube signal path and an all-discrete J-FET solid state signal path. Both topologies are entirely transformerless high voltage pure Class A, and the minimalist design places only one active stage in the audio path.

  Each channel carries four EQ bands spanning 20 Hz to 20 kHz center frequency with a Q range of 0.4 to 4.0. The low and high ranges are switched between fixed centers and are selectable for peak or shelf response, while the low mid and hi mid bands sweep with a 10X range switch. Boost and cut run to 20 dB in 21 detented steps, or 10 dB with the range switch engaged, and noise is rated at -106 dBu with all EQ stages in and controls flat.

  Construction is aimed at demanding professional applications, with gold relays, switches and tube sockets, OFC audio wiring and hand assembly in Northern California. A main hard-wire bypass switch is provided for each channel and individual EQ bands can also be hard-wire bypassed.

  Options include differentially balanced inputs using pure Class-A discrete FET balanced receivers, quoted at $300, and an NSEQ-2 can be converted to an NSEQ-4.
specs: |-
  - "Q" Range: Q = 0.4 to 4.0 adjustable on middle ranges, Q = 1.0 fixed on low and high ranges
  - Maximum Output Level: > +28 dBu (VT)
  - Maximum Input Level (EQ Flat): +28 dBu (VT)
  - Maximum Input Level (EQ Full Boost): +17 dBu (VT)
  - Frequency Response: +0 / -3 dB, sub 2 Hz to beyond 300 kHz
  - Frequency Response, Stereo Deviation: +/- 0.5 dB (with Mastering Option)
  - Noise (All EQ Stages In, Controls Flat): -106 dBu (SS), -94 dBu (VT)
  - Maximum Boost (21 Step Detented): +20 dB (+10 dB with range switch in)
  - Maximum Cut (21 Step Detented): -20 dB (-10 dB with range switch in)
  - Low Range Switch Centers (Peak/Shelf Selectable): 20, 34, 56, 100, 180, 270 Hz
  - Low Mid Sweep: 20 Hz to 220 Hz or 200 Hz to 2.2 kHz, 10X range switch selectable
  - Hi Mid Sweep: 250 Hz to 2.5 kHz or 2.5 kHz to 25 kHz, 10X range switch selectable
  - High Range Switch Centers (Peak/Shelf Selectable): 4.8 k, 5.8 k, 8.0 k, 10 k, 16 k, 21 k
  - THD + Noise (20 Hz to 30 kHz, All EQ Bands Switched In): < 0.009%, typ < 0.003% (VT or SS)
  - Common Mode Rejection Ratio (10 Hz to 20 kHz, 100 mV C.M., with Balanced Option): > 60 dB, typ > 80 dB
  - Slew Rate (+27 dBu Out): > 50 volts per microsecond
  - Main Hard-wire Bypass Switch For Each Channel: Yes
  - Peak/Shelf Selection On High and Low Range: Yes
  - Hard-wire Bypass Switching On Individual EQ Bands: Yes
  - Input Impedance: 25 kilohms
  - Minimum Output Load Impedance: 1 kilohm (VT), 150 ohms (SS)
  - Recommended Load: > 3 kilohms (VT)
  - Output Impedance: < 300 ohms (VT), < 5 ohms (SS)
  - Twin Topology EQ Amplifiers: switch in for pure Class-A discrete J-FETs, switch out for pure Class-A triode tubes
  - Power Consumption: 40 watts maximum
  - Power Requirements: Selectable 100-120, 200-240 V ac, 50/60 Hz
  - Dimensions/Shipping Weight: 19 in W x 3.5 in H x 12.5 in, 26 lbs
