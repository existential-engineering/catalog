details: |-
  The SR325 is part of Grado's Classic Series, featuring a 44mm X2 dynamic driver with Mylar diaphragm, copper voice coil, and rare earth magnet system. The tuning emphasizes articulation and speed, delivering tight bass response, forward midrange clarity, and crisp high-frequency extension.

  It includes a Signature Silver headband assembly with engraved polymer gimbals, leather headstrap, and Signature Silver cable. The aluminum housing is precision-machined to reduce resonance.
