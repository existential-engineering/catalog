description: The most compact Bowers & Wilkins tower speaker to feature a
  Turbine Head has all the technical advantages of a dedicated midrange
  enclosure.
details: |-
  The 803 D4 is the most compact headed model in the 800 Series Diamond D4 range, bringing the technical advantages of a dedicated midrange enclosure, the Turbine Head with its decoupled midrange cone, to a smaller footprint that is easily accommodated in any home. It is a three-way vented-box system and a passive design, rated for amplifiers of 50W to 500W into 8 ohms with no mains connection of its own.

  Though notably more compact than the 801 D4 or 802 D4, the 803 D4 still uses three-box construction. Its 130mm (5in) Continuum cone FST midrange is carefully isolated from the impact of the bass cones by the Turbine Head enclosure, while a 25mm Diamond dome tweeter sits in the Solid Body Tweeter-on-Top housing.

  Instead of a conventional loudspeaker box, the cabinet is made from a continuous curved section of wood with the drive units mounted at the heart of the curvature. Bowers & Wilkins says this stiffer, more inert Reverse Wrap structure resists mechanical resonances far better and ensures better dispersion of sound.

  Matrix bracing uses interlocking panels to reinforce the cabinet walls in all directions internally, reducing resonance and creating a more believable soundstage. The company describes the Matrix assembly in the 803 D4 as its best yet, ensuring optimum scale, power and intelligibility.

  Two Aerofoil cone bass drivers of 180mm (7in) are mounted in twin solid aluminium bass pods, each clamped into an aluminium plate fixed to the stiffest part of the curved cabinet. The speaker measures 1165mm high by 357mm wide by 511mm deep, weighs 62.15kg, and is offered in Gloss Black, White, Satin Rosenut and Satin Walnut with black or grey grilles.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond tweeter, Solid body Tweeter-on-Top, Continuum cone FST, Matrix, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Aerofoil cone bass units, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 130mm (5in) Continuum cone FST midrange, 2x 180mm (7in) Aerofoil cone bass units
  - Frequency range: 16Hz to 35kHz
  - Frequency response: 19Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 80Hz to 20kHz, less than 0.3% 100Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 500W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1165mm (45.9 in), Width 357mm (14.1 in), Depth 511mm (20.1 in)
  - Net weight: 62.15kg (137 lb)
  - Cabinet finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
  - Grille finishes: Black, Grey
