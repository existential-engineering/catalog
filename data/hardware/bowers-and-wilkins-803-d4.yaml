description: The 803 D4 is the most compact headed model in Bowers & Wilkins'
  800 Series Diamond range, bringing the technical advantages of a dedicated
  midrange enclosure - the Turbine Head, with its decoupled midrange cone - to a
  smaller footprint that's easily accommodated in any home.
details: |-
  The 803 D4 is a 3-way vented-box tower loudspeaker that brings the engineering of Bowers & Wilkins' flagship 800 Series Diamond D4 line into a more domestically scaled enclosure. It pairs a Diamond dome tweeter housed in a Solid Body Tweeter-on-Top with a Turbine Head midrange and a pair of Aerofoil cone bass drivers in the main cabinet.

  Mid-range duties are handled by a 130mm Continuum cone FST driver mounted in a dedicated decoupled Turbine Head enclosure. The aluminium Turbine Head provides a rigid, low-resonance environment for the midrange, isolating it from the bass cabinet so that vocal and instrumental detail emerge cleanly from a black background.

  Two 180mm Aerofoil cone bass drivers operate in a Reverse Wrap cabinet braced internally by Matrix construction. A downward-firing Flowport vents the cabinet for extended low-frequency response, with the system reaching down to 19Hz (-3dB).

  Engineering refinements throughout - including the Anti-Resonance Plug, Biomimetic Suspension, and the diamond tweeter dome - aim to remove mechanical and acoustic colourations from the signal path. The cabinet is finished by hand and available in Gloss Black, White, Satin Rosenut, or Satin Walnut.

  With a sensitivity of 90dB and a nominal 8Ω impedance (3.0Ω minimum), the 803 D4 is rated for amplifiers between 50W and 500W into 8Ω, making it suitable for a wide range of high-end home audio amplification.
specs: |-
  - System: 3-way vented-box
  - High-frequency driver: 1x 25mm (1 in) Diamond dome tweeter
  - Midrange driver: 1x 130mm (5 in) Continuum cone FST
  - Bass drivers: 2x 180mm (7 in) Aerofoil cone
  - Frequency range: 16Hz to 35kHz
  - Frequency response: 19Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: <1% (80Hz-20kHz); <0.3% (100Hz-20kHz)
  - Nominal impedance: 8Ω (minimum 3.0Ω)
  - Recommended amplifier power: 50W-500W into 8Ω
  - Height: 1165mm (45.9 in)
  - Width: 357mm (14.1 in)
  - Depth: 511mm (20.1 in)
  - Weight: 62.15kg (137 lb)
  - Finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
