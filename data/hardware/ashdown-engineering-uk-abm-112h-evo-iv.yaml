  - Speaker: 1 x 12" CIARE ceramic driver
  - Impedance: 8 Ohms nominal
  - Sensitivity @ 1m (2.83v): 98 dB
  - Magnet type: ceramic
  - Connectors: Neutrik SpeakOn
  - Height: 470 mm (including feet)
  - Width: 600 mm
  - Depth: 340 mm
  - Net weight: 21.70 kg
  - Compatible with ABM and Rootmaster amp heads
  - Made in the UK, built to order
