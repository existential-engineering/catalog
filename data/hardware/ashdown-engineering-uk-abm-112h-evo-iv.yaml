details: |-
  The UK-ABM-112H-EVO IV is a professional-grade 1x12" bass cabinet handcrafted in the UK, balancing tonal excellence with portability. A custom 12" CIARE ceramic driver delivers 300W AES at 8 Ohms with 98dB sensitivity, giving articulate, controlled low-end, clear mids and a balanced response suited to funk, jazz and indie styles. Premium Neutrik SpeakOn connectors ensure dependable connectivity, and it works as a standalone cab or as part of a modular multi-cab rig with ABM and Rootmaster amp heads.
specs: |-
