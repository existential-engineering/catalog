description: Like all guitars in the LTD Deluxe '1000' Series, the Viper-1001 EverTune is designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. The streamlined single-pickup guitar features the Viper's asymmetrical double horns and EverTune constant tension bridge technology. Built with set-thru construction, it offers fast fret access and combines a mahogany body with maple cap and three-piece mahogany neck with Macassar ebony fingerboard.
details: |-
  Like all guitars in the LTD Deluxe “1000” Series, the Viper-1001 EverTune is designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. This streamlined single-pickup guitar delivers the asymmetrical double horns of the Viper shape, and is highlighted by the EverTune constant tension bridge, keeping your guitar in perfect tune and intonation in nearly every possible circumstance. Built with set-thru construction at 24.75” scale for fast access to the highest frets, the Viper-1001 EverTune features a mahogany body with maple cap, and a three-piece mahogany neck with Macassar ebony fingerboard, block pearloid inlays, 22 extra-jumbo stainless steel frets, and a matching headstock. More components on this exceptional guitar include black hardware, LTD locking tuners, and the in-your-face aggressive tone of an EMG 81 active humbucking pickup.
