description: 1U stereo rack monitor speakers with built-in amplifier, supporting balanced and unbalanced analog input and AES/EBU digital input, with a 26-dot LED level meter offering VU and PEAK display.
details: |-
  1U size stereo monitor speakers with amplifier. The RM-3 supports balanced and unbalanced analog input and AES/EBU digital input, uses a power-saving design with a digital amplifier and switching power supply, and carries a 26-dot LED level meter with VU and PEAK display.

  Space-saving 1U size, mountable in an EIA standard rack (the rack mounting angle is removable). JIS standard racks are not supported. The Class-D power amplifier has a maximum output of 10 W + 10 W and drives two 110 x 40 mm magnetically shielded elliptical cone full-range speakers.

  Analog input is on XLR and phone combo connectors and digital input on XLR (AES/EBU); a through-out is provided for each input. A headphone output (20 mW + 20 mW) is fitted on the front panel and the speaker output is muted when headphones are plugged in.

  Mute and input source select switches are provided. MUSIC and VOICE modes allow the playback frequency range to be selected according to the sound source and usage conditions, and monitor output can be selected from STEREO, L, R or L+R.

  The highly visible 26-dot LED meter (L/R) brightness can be adjusted in four levels using the DIP switch on the rear panel. A standby mode suppresses power consumption to 0.5 W or less by keeping the input signal below a certain level for 4 hours or by holding the mute button for approximately 5 seconds.
specs: |-
  - Speaker unit: 110 x 40 mm cone type, antimagnetic (magnetically shielded)
  - Impedance: 8 ohm
  - Sound pressure level: 84 dB/W (1 m)
  - Frequency response: 200 Hz to 20 kHz
  - Power amplifier maximum output: 10 W + 10 W
  - Residual noise: -50 dBV or less (DIN AUDIO)
  - Distortion rate: 0.1% or less
  - Digital input: XLR-3-31 type, IEC60958 (AES/EBU), sampling frequency 44.1 kHz to 96 kHz
  - Analog input: XLR / 6.3 mm TS phone combo type, rated input level +4/0 dBu (XLR), -10/-14 dBV (TS phone), input impedance 10 kohm min.
  - Through-out provided for each input
  - Phones: 6.3 mm stereo phone, applicable load impedance 16 ohm or more, maximum output 20 mW + 20 mW (32 ohm, 1 kHz)
  - MUSIC and VOICE playback frequency modes
  - Monitor output selectable from STEREO, L, R or L+R
  - 26-dot LED level meter (L/R) with four brightness levels
  - External dimensions: 482 (W) x 44 (H) x 284 (D) mm (including projections)
  - Weight: approx. 3.5 kg
  - Power requirement: AC 100 to 240 V (50/60 Hz)
  - Power consumption: 10 W (0.5 W or less in standby mode)
  - Complies with the European RoHS Directive
