name: Talkbox Synth
manufacturer: tc-helicon
primaryCategory: talk-box
categories:
  - pedal
  - vocals
  - vocoder
capabilities:
  - vocoder
  - equalization
url: https://www.tchelicon.com/en/products/0726-aap
description: Stompbox that modulates a vocal with the harmonic content of a
  guitar signal to produce talkbox effects without a tube, with three selectable
  voicings. A polyphonic synth voice can be blended with the talkbox signal.
details: |-
  Talkbox Synth reproduces the vocoder-style talkbox effect heard in rock and funk recordings without the plastic tube the original technique puts in the player's mouth. A guitar and a microphone both connect to the pedal, which modulates the vocal with the harmonic content of the guitar signal in real time.

  Three voicings are available, each taken from a classic talkbox tone and each with its own character and EQ profile. The dry talkbox signal can be blended with a polyphonic synth voice for a thicker texture, or left alone for the plain vintage effect.

  The pedal carries an XLR microphone input with 48V phantom power, a 1/4-inch guitar input and thru, and an XLR vocal output, with true bypass when the effect is off. Power comes from a standard 9V supply.
specs: |-
  - Three talkbox voicings, each with its own EQ profile
  - Polyphonic synth voice blendable with the talkbox signal
  - 48V phantom power on the XLR microphone input
  - 1/4-inch guitar input and thru
  - True bypass
  - 9V DC power input
