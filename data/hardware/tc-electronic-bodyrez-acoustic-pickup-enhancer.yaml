details: |-
  BODYREZ is the new must-have tool for every acoustic player out there. Designed to restore the natural acoustic resonance of your instrument when using under-saddle pickups, BODYREZ gives you a more pristine sound simply with the turn of a single knob.Getting great acoustic tone couldn’t possibly be easier, with harmonic bliss now just a stomp away.    •    Studio-Quality Acoustic Guitar Tone    •    Built-In Feedback Suppression    •    Restores Natural Playing Feel

  There’s nothing more captivating than the natural rich and crisp sound of an acoustic guitar. Sadly, most acoustic pickups take that full 3-dimensional sound and make it flatter and more uninviting than a burned pancake. This is where BODYREZ comes in. With BODYREZ it’s like having your own personal pro audio engineer along with you at all times, making sure that you sound your best all while eliminating potential feedback traps. Once you plug this pedal in, you’re going to wonder how you ever lived without it!

  Even though BODYREZ emanates simplicity with its one dial design, there are tons of cool things going on underneath the hood. BODYREZ applies a vast amount of pre-configured filters combined with subtle quick compression in order to bring your amplified acoustic tone back to life. All of these factors have been painstakingly measured and meticulously selected to help bring out all that’s good about your instrument. So all you have to do is turn it on and start wowing the crowd.

  When you play your acoustic guitar at home everything just feels right. The tone, the response, the natural ambiance – it’s all there. But on stage and plugged into a PA, it’s a whole different story. BODYREZ restores that natural feeling you get playing your guitar acoustically, as opposed to that super sensitive and nervous feel you get when using a piezo system.
