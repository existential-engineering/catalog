categories:
  - effect
url: https://www.denondj.com/x1850%20prime-x1850primexus.html
description: Denon DJ X1850 PRIME - Professional 4 Channel Digital DJ Mixer With
  USB, Digital and Switchable Phono/Line Inputs Plus Built-In DJ FX
details: |-
  4-channel digital DJ mixer with multi-assignable inputs (Line, Phono, Digital, USB, DVS)

  3-band EQ with selectable Normal and Isolation modes

  4 Sweep FX with Lo/Hi pass Filter and adjustable resonance

  16 Pro-Club BPM FX with Time-Division Touchstrip and FX Quantize

  Built-in LAN hub for connecting up to four SC media players (StagelinQ)

  2 independent microphone channels with EQ, level controls, and talkover

  Split/Cue headphone monitoring with 1/4-inch and 1/8-inch outputs

  Engine Connect for DVS support and multi-channel audio recording

  5-pin DIN MIDI output for sync with external gear

  Rugged metal construction with smooth line and crossfader controls

  24-bit / 96 kHz pro-grade audio connectivity
specs: |-
  - Channels: 4
  - Dynamic Range (master): > 117 dB (A-weighted)
  - Frequency Range: 22-22,000 Hz (+1 dB)
  - Signal-to-Noise Ratio (Line): > 93 dB (A-weighted)
  - Signal-to-Noise Ratio (Phono): > 87 dB (A-weighted)
  - THD+N: < 0.02%
  - Channel Separation: < -90 dB (@ 1 kHz, unity)
  - Headroom (Line Inputs): > 16 dB
  - Headroom (Microphone Inputs): > 20 dB
  - Headroom (Outputs): > 20 dB
  - Master Output (balanced): +24 dBu (maximum), +4 dBu (unity)
  - Master Output (unbalanced): +20 dBu (maximum), 0 dBu (unity)
  - Booth Output: +24 dBu (maximum), +4 dBu (unity)
  - Record Output: +10 dBV (maximum), -10 dBV (unity)
  - Send Output: +10 dBV (maximum), -10 dBV (unity)
  - Headphone Output: > 150 mW @ 40 Ohm
  - Microphone Input: -40 dBu (maximum), -60 dBu (minimum)
  - Microphone CMRR: > 80 dB (@ 1 kHz, unity)
  - Microphone EIN: < -124 dBu (Rs = 150 Ohm, DIN)
  - Digital Output Sampling Rate: 44.1, 48, 96 kHz
  - Digital Output Bit Depth: 24-bit
  - Displays: (2) monochromatic LED-backlit displays, 1.6" / 39 mm diagonal
  - Power Connection: Locking IEC
  - Input Voltage: 100-240 V~, 50/60 Hz
  - Power Consumption: 65 W
  - Dimensions (mm): 310.9 x 445 x 109.7
  - Dimensions (inches): 12.2" x 17.5" x 4.3"
  - Weight: 15.43 lbs / 7.00 kg
