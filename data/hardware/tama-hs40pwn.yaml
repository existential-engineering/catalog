description: The Stage Master snare drum stand features a universal gearless
  tilter. This tilter holds the snare basket securely in place using metal plate
  friction instead of traditional gears.
details: |-
  Universal Gearless Tilter: The universal tilter securely holds its position with metal-plate friction instead of traditional gears so you can adjust it to any angle you desire.

  Escape Claw: TAMA’s Escape Claws rubber cushions allow the snare drum to float on the basket arms for improved resonance. In addition, they help reduce fatigue by softening the impact of snare drum playing on your arms and wrists.

  Swiveling Basket: Asymmetrically spaced basket arms allow an 8 or 10 lug drum to be held without interference with its strainer, butt or lugs. Since the basket rotates independently from the stand, you can place the strainer in any position needed.
