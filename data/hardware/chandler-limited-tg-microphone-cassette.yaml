description: The Chandler Limited TG Microphone Cassette is a full-featured
  channel strip combining the TG2 Pre-Amp, Curve Bender EQ, and TG1 Opto Limiter
  into a single unit. An independently patchable compressor section makes this
  the ultimate TG channel strip reimagined for modern studio use.
details: |-
  The Chandler Limited TG Microphone Cassette is a full-featured mixing console channel strip incorporating elements of the historic EMI/Abbey Road Studios TG12345 recording and mastering desks of the late 1960s and 1970s. The pre-amp section uses the Chandler Limited TG2 preamp based on the vintage EMI TG12428, with switchable coarse and variable fine gain for up to +70 dB overall gain, selectable Line/DI modes, +48V phantom power, phase reverse, and switchable rumble filter.

  The equalizer section is derived from the Chandler Limited EMI TG12345 Curve Bender EQ, providing Hi and Low shelf, frequency-selectable presence, output control, and bypass functionality.

  The compressor section is a special adaptation of the Chandler Limited TG1 Limiter, tracing its lineage to the historic EMI TG12413 console limiters. The TG1 Opto compressor section is fully independent and separately patchable via standard XLR connection. It is stereo linkable to a second unit via a standard 1/4-inch cable.

  All TG units require the PSU-1, Chandler Limited power supply (purchased separately).
