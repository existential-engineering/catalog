specs: |-
  - One Control Purple Humper Kit.
  - Phillips screwdriver.
  - All necessary components and tools (no soldering required).
  - Faithful recreation of the rare BJFE Purple Humper
  - Mid-range booster that adds warmth and vintage British character
  - Makes any amp sound like a classic rock machine
  - Dial in hollow-body sweetness or 80s metal leads
  - True bypass switching
  - Input Impedance: 330K
  - Output Impedance: 1K
  - Operating Voltage: 9V (6-18V supported)
  - Current Consumption: 3.6mA
  - S/N Ratio: -100dB
  - Set the BLEND knob to your preferred level of mid-boost.
  - If the knob is on the left of center, try placing distortion pedals before the Purple Humper.
  - If it's on the right, try putting it after distortion.
  - Experiment with your guitar and amp to find your ideal sound.
