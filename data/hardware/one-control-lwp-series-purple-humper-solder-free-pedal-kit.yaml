description: A solder-free mid-range booster pedal kit recreating the BJFE
  Purple Humper, adding warm vintage British-voiced mid-range boost to any amp.
details: |-
  This mid-range booster pedal recreates the legendary BJFE Purple Humper in a convenient, easy-to-build format with no soldering required, just your phillips screwdriver and a touch of rock 'n' roll spirit. With this pedal, you can transform any amplifier into a vintage beast with a warm British tone. Let's get you up and running. What's Included:

  Getting Started:

  The Purple Humper is a mid-boost pedal kit that captures the magic of a rare BJFE model. It's perfect for learning the ropes of pedal building while achieving that legendary mid-range tone. This kit is powered by a standard 9V DC center-negative adapter (One Control EPA-2000/RPA-1000 recommended). Batteries are not supported. Estimated Assembly Time: 15 to 30 minutes. Purple Humper — What's It All About? Every guitar hero knows the importance of mid-range. Whether you're taming the high-end snarl of a Strat or pushing a clean transistor amp into vintage territory, mid-boosters have been the secret sauce since the days of 1960s British amps. The original BJFE Purple Humper was designed to push a 60s Stratocaster up to ES-335 output levels, letting you dial in a richer, more powerful tone no matter what pickups you use. One Control's version pays tribute to this rare pedal, capturing that sweet spot between a warm buffer and a powerful mid-boost. Unlike many mid-boost pedals, the Purple Humper doesn't just slam your signal with a honky boost. Instead, it preserves your guitar's natural tone while adding a warm, dynamic mid-range that instantly gives any amp a vintage British voice. Even a sterile solid-state amp comes alive with classic rock mojo. Use it as a preamp, a solo booster, or to add character to your dirt pedals. It plays nice with everything from single coils to humbuckers, P-90s to actives, always finding that sweet spot without killing your tone. Controls and Connections:

  ・ INPUT : Connect your guitar or bass here. ・ OUTPUT : Connect to your amplifier. ・ BLEND : Adjusts the amount of mid-range boost. Turn left for a subtle lift, or right for full-on mid-saturation (up to 15dB of boost). ・ DC INPUT : Plug in a standard 9V DC adapter with center-negative polarity (6 to 18V supported). Features:

  Specifications:

  How to Use It:

  When using Purple Humper with distortion, the order in your pedal chain matters — try different setups to find your personal sweet spot. Start clean, then add grit to taste. Pro Tip:

  With its powerful yet balanced boost, the Purple Humper is perfect as a lead booster or to sweeten up any amp that's too bright. You'll get that rich, dynamic mid-range that makes you want to play all night. Try it at 18v for added headroom

  Enjoy your Purple Humper Kit, and get ready to rock! If you need any help or have questions, check out the One Control website. Estimated kit completion time: 15-30 minutes. ・ LWP Series Purple Humper Solder Free Pedal Kit Manual.pdf

