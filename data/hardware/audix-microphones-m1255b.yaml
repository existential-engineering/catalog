details: |-
  The M1255B is a miniaturized cardioid condenser microphone with a fully integrated preamp, detachable cable, and has RF immunity to prevent interference from cell phone and GSM devices. It is also available with hypercardioid, omni, or shotgun capsules, giving the microphone the unique ability to be used in a wide variety of stage, studio, and broadcast applications.

  The M1255B condenser microphone is available with a wide array of clips and accessories allowing the microphone to be used for acoustic instruments, choral miking, overhead stage miking, podiums, conferences, and presentations.
  Designed, machined, assembled, and tested by AUDIX in the USA.

  Model variations:
  M1255B – Micro condenser microphone with RFI immunity. Only 54 mm long with integrated preamp – includes 25′ cable, clip, hanging clip, windscreen and pouch. Requires 18 – 52 V phantom power.
  M1255BW – As above with cable. White.
  M1255BHC – As above with a hypercardioid capsule. Black.
  M1255BWHC – As above with cable. White.
  M1255BO – As above with an omnidirectional capsule. Black.
  M1255BWO – As above with cable. White.
  M1255BS – As above with shotgun capsule. Black.
