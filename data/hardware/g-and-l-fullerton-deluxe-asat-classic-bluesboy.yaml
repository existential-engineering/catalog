details: |-
  The 2025 Fullerton Deluxe ASAT Classic Bluesboy bundles some of the most time-honored option combinations from the G&L Option Order menu. Each of these Bluesboys starts with a finish to showcase its beauty, paired with a pickguard that sets off the color just right. That elegance continues up the neck with the G&L Natural Satin neck. All feature rear contoured alder or swamp ash bodies.

  The G&L ASAT Classic Bluesboy is a factory-modded version of Leo's final word on the traditional single-cutaway bolt-on axe. For players looking for the unmistakable warmth of a classic humbucker in the neck position, the Bluesboy delivers with a well-balanced pairing of a G&L A2S4248N Alnico II magnet humbucker and a single-coil G&L Magnetic Field Design bridge pickup designed by Leo Fender. Framed in a classic boxed-steel bridge, the single-coil MFD bridge pickup delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the neck humbucker brings all the charismatic warmth a player could ask for, and the two together open up the limits of this guitar's surprising versatility.

  The Fullerton Deluxe Bluesboy's hard-rock maple neck features G&L's Vintage Tint Satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
