  range from FM broadcasts, cassette tapes, and other limited audio sources. An
  owner's manual is available for download from the dbx product page.
details: |-
  The 1BX Series III represents the third iteration of dbx's single-channel dynamic range expander, progressively refining the circuit design introduced in the original 1BX and continued through the Series II. The unit restores the natural dynamic contrast that is reduced during FM broadcasting, cassette duplication, disc mastering, and other bandwidth-limited or dynamically compressed transmission processes.

  dbx's expansion technology works by gradually increasing output gain as input signal levels rise above a threshold, effectively undoing the compression applied to the source material. The result is a more lifelike audio experience with greater contrast between loud and soft passages.

  An owner's manual (460KB) is available for download from the dbx product page, providing complete operational and technical documentation for this model.
