description: >-
  Limited 35th Anniversary edition of the StingRay 5 bass — an ash body with
  spalted maple top in Spalted Sunburst, roasted maple neck, ebony fretboard,
  copper pearloid Atlanté blocks, and neodymium humbuckers. Limited to 225
  single-humbucker and 25 dual-humbucker instruments.
details: |-
  In 1987 Ernie Ball Music Man created the legendary StingRay 5 bass, setting the standard for the modern 5-string bass. The 35th Anniversary edition honors the timeless Ernie Ball Music Man design used by some of the world's most iconic bassists.

  The ash body features a spalted maple top with thin maple veneer in a standard Spalted Sunburst finish. High-output neodymium StingRay 5 pickups provide powerful low-end with distinctive mid-range punch, while lightweight hardware contributes to solid stability.

  Limited to 225 single-humbucker and 25 dual-humbucker instruments. Each Anniversary StingRay 5 includes a certificate of authenticity.
specs: |-
  - Body wood: Ash with spalted maple top
  - Body finish: High gloss polyester
  - Body color: Spalted Sunburst
  - Body dimensions: 13-3/8" wide, 1-3/4" thick, 45-3/4" long
  - Neck wood: Select roasted maple
  - Neck width: 1-3/4" at nut, 2-3/4" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony
  - Fret markers: Copper pearloid Atlanté blocks
  - Frets: 22 high-profile, wide stainless steel
  - Headstock length: 9"
  - Scale length: 34"
  - Pickups: Single (H) or dual (HH) humbucking with neodymium magnets
  - Controls: 3-band active preamp (18-volt headroom) — volume, treble, mid, bass
  - Switching: 3-way lever (H) / 5-way lever (HH)
  - Bridge: Music Man black-plated hardened steel with stainless saddles
  - Tuning machines: Custom Music Man lightweight with tapered posts
  - Hardware: All black with gold pole-piece accents
  - Electronic shielding: Graphite acrylic resin cavity; aluminum control cover
  - Strings: 45w-65w-80w-100w-130w (Regular Slinky Bass #2836)
  - Production: 225 H + 25 HH instruments
