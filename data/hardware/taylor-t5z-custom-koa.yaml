details: |-
  The T5z Custom Koa is Taylor's premium hollowbody hybrid guitar, blending acoustic warmth with electric versatility. Its figured Hawaiian koa top sits over a lightweight Shamel Ash body (2-piece), offering visual elegance and tonal resonance. Chamfered body edges and an integral armrest on the upper body make long playing sessions comfortable for electric-style players.

  The guitar's three-pickup system is the heart of its tonal range: a concealed neck humbucker delivers warm, full-bodied tones; a visible humbucker in the middle position adds punch and definition; and an acoustic body sensor captures natural acoustic resonance. Five-way switching and active on-board circuitry provide flexibility from lush acoustic sounds to electric output.

  The fast-playing Sapele neck features an ebony fingerboard with Faux Pearl/Silver Spires inlays, black binding, and jumbo frets. A 24-7/8" scale length contributes to the electric-leaning playability the T5z is designed for. Bone nut and saddle, ebony bridge and bridge pins, and Taylor Gold tuners complete the premium appointments.

  Strings are D'Addario XS Coated Electric Medium (.011-.049). Ships with a deluxe hardshell case.
