description: >-
  The Yamaha YS200 is a 4-operator digital FM synthesizer released in 1988,
  featuring 61 velocity and aftertouch-sensitive keys and an 8-track onboard
  sequencer. It uses the same synthesis engine as the TX81Z, offering 8
  waveforms rather than just sine waves, giving it a wide range of possible
  sounds including deep dance and techno basses, eighties digital synth tones,
  and new age pads.
details: |-
  The YS200 employs the same FM synthesis engine as the popular TX81Z, providing 8 waveforms to choose from rather than just sine waves. This gives it a wider range of tonal possibilities than earlier 4-operator FM synths. It can load original patches from the TX81Z and other classic Yamaha 4-operator DX synthesizers.

  The keyboard offers 61 velocity and aftertouch-sensitive keys with capacity for up to 300 patches across three memory banks: 100 preset, 100 user, and 100 via external card. Built-in effects include reverb, delay, and distortion.

  The onboard 8-track sequencer supports 8 songs with quantization, cut, copy, paste, insert, and punch-in recording. Editing patches is managed through Easy Edit controls for basic operations, though full patch editing requires a MIDI-based external editor such as YSEditor.

  A variant called the Yamaha B200 (EOS B200 in Japan) features integrated 2x20W speakers and stereo line-in amplification, with distinctive sphere-shaped pitch and modulation wheels.
specs: |-
  - 8-voice polyphony
  - 4-operator digital FM synthesis
  - 8 waveforms per operator
  - 61 velocity and aftertouch-sensitive keys
  - 100 preset patches, 100 user patches, 100 via external card
  - Built-in reverb, delay, and distortion effects
  - 8-track sequencer with 8-song capacity
  - Quantization, cut, copy, paste, insert, and punch-in recording
  - MIDI IN/OUT/THRU
  - Breath controller input
