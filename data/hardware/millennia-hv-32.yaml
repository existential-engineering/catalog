description: The HV-32 is a single channel microphone preamplifier module that
  fits an API 200 frame as well as API Legacy and Vision consoles. It
  provides continuously variable gain, a DC coupled ribbon microphone path with
  a 10 dB gain boost, 48V phantom power and a 15 dB pad.
details: |-
  The HV-32 is an HV-35 reworked to fit an API 200 rack, or an API Legacy or Vision console. It carries one channel of the HV-3 microphone preamplifier circuit in a module that draws its audio connections and power from the host frame.

  Gain is continuously variable from a minimum of 8.5 dB up to 60 dB, and a selectable DC coupled ribbon microphone setting adds a 10 dB boost for a 70 dB maximum. A 15 dB pad and 48V phantom power are included.

  Measured frequency response runs from below 3 Hz to beyond 300 kHz, equivalent input noise is -130 dB, and total harmonic distortion plus noise sits under 0.001 percent. Maximum input level is +20 dBu, which the page notes needs no attenuator pads, and maximum output level is +28 dBu.
specs: |-
  - Minimum Gain: 8.5 dB
  - Maximum Gain (continuously variable): 60 dB (70 dB in Ribbon Mode)
  - Frequency Response (+0 / -3 dB): sub 3 Hz to beyond 300 kHz
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -130 dB EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +27 dBu Out): < .001%, Typ. < .0005% (< 5 ppm)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, +27 dBu Out): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +27 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +20 dBu (no attenuator pads required)
  - Maximum Output Level (20 Hz - 40 kHz): +28 dBu
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - Phantom Powering: +48 V dc, +/- 2 V dc
  - Dimensions/Shipping Weight: 1-1/8" W x 2-5/8" H x 5-7/8" D, 1 lb.
