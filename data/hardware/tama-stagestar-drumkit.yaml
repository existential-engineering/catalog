description: With over 40 years of experience, TAMA knows what drummers really
  want. Which is why TAMA has the set you need, want and can afford no matter
  how long you've been playing drums or what budget you have to work with.
details: |-
  All Poplar Shell: The full warm tone and medium attack offered by poplar wood has made it a mainstay of drum shell manufacturing for more than 50 years.

  Omnisphere Tom Holder: The Stagestar’s Omni-ball system double tom holder allows you to achieve almost any angle by simply loosening one T-bolt.

  Drum Pedal: Drum pedal features double chain drive cam and beater angle adjustment.

  Cymbal Set: Cymbal set (14" Hi-hats & 16" Crash) included.

  Drum Throne: Heavy-duty double braced drum throne has threaded rod adjustment, which allows you to achieve any height simply rotating its seat.
