description: >
  Take command of your sounds, and perform like you've always dreamed of. KeyLab Essential 88 is an intuitive, powerful, carefully crafted controller with a full size keyboard that invites you to unleash your creative flow with note- spanning flair.
details: |-
  The keylab essential 88 mk3 is a full-size universal MIDI controller designed for both beginner pianists and experienced music producers. It features an 88-note velocity-sensitive semi-weighted keyboard that captures every nuance of performance, complemented by familiar pitch and mod wheels and a pedal input for sustain, footswitch, or expression control. The controller offers seamless integration with daws and analog lab, providing intuitive access to creative tools and sound parameters without requiring computer interaction.

  The control surface includes 8 rgb color-coded velocity and pressure-sensitive pads for triggering MIDI notes, drums, samples, or clips, along with 9 rotary encoders and 9 x 30mm faders for adjusting track levels, envelope settings, and arturia instrument parameters. A bright 2.5 LCD display with contextual buttons provides real-time feedback on parameter values and current presets, while dedicated DAW controls with custom integration scripts ensure compatibility with major daws including fl studio, logic pro, ableton live, cubase, and bitwig studio. The controller also supports mcu/hui protocol for compatibility with virtually any DAW.

  Performance features include multi-mode arpeggiator, chord mode with smart voicing, scale mode to lock the keybed to built-in scales, and hold function for sustained notes and arpeggios. Split point programming allows loading two different sounds across the keyboard for layered performances. Bend and modulation controls enable pitch bending and sound modulation, while semitone transpose functionality allows keyboard transposition by semitones or full octaves.

  The keylab essential 88 mk3 includes analog lab pro software with 2000+ sounds, ableton live lite, native instruments the gentleman, uvi model d, a 2-month loopcloud subscription with millions of royalty-free samples, and melodics subscription for 40 lessons. The controller features eco-designed construction with 100% recycled packaging and sourced recycled plastic, following sustainable practices established with the minilab 3. MIDI 5-pin din output enables control of external MIDI-compatible gear including synths and drum machines.

  The unit measures 1258mm x 255mm x 88mm (49.53 x 10.04 x 3.46 inches) and weighs 8.2kg (18.08 lbs). USB-c connectivity powers the device and connects to computers and MIDI control center. The keylab essential mk3 series also offers 49-key and 61-key options in black or white finishes for users requiring smaller note ranges or different aesthetic preferences.
