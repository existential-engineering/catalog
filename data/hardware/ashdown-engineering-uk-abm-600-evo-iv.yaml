description: Made in the UK, the UK-ABM-600-EVO IV offers 600 watts of power
  with legendary Ashdown tone and flexibility. It features a footswitchable
  Variable Valve Drive Plus, a detailed 9-band EQ, a Sub-Harmonic Generator, and
  a One Knob Compressor, with comprehensive stage and studio connectivity
  including an FX loop, line and tuner outputs, and a DI output.
details: |-
  The UK-ABM-600-EVO IV is a UK-built 600-watt bass head with crushing power and tonal flexibility. An upgraded Variable Valve Drive Plus preamp delivers more current to a 12AX7 tube for greater drive and harmonic content, footswitchable from pristine cleans to fat overdrive. The EQ pairs Bass, Middle and Treble controls with a 6-band slider section (100Hz, 180Hz, 340Hz, 1.3kHz, 2.6kHz, 5kHz), footswitchable between flat and sculpted, with an illuminated input VU meter for gain staging. Ashdown's One Knob Compressor delivers punch and consistency, and the Sub-Harmonic Generator adds an octave below the played notes. Connectivity includes a tuner output, line output, line input, a transparent FX loop and output muting for silent tuning, with two Neutrik Jack/Speakon sockets supporting single 8 Ohm, dual 8 Ohm or single 4 Ohm cab setups.
specs: |-
  - Power output: 600 Watts
  - Power requirement: 115-230 Volts
  - EQ: Bass, Middle, Treble plus 6-band slider (100Hz, 180Hz, 340Hz, 1.3kHz, 2.6kHz, 5kHz)
  - Variable Valve Drive Plus (footswitchable, 12AX7 tube)
  - One Knob Compressor
  - Sub-Harmonic Generator
  - Illuminated input VU meter
  - Speaker outputs: 2 x Jack/Speakon
  - Line input: 22k Ohms, 0dBu nominal
  - DI output: 600 Ohm balanced, 0dBu nominal
  - Tuner output: 22k Ohms, 0dBu nominal
  - Effects send: 22k Ohms, 0dBu nominal
  - Effects return: 22k Ohms, 0dBu nominal
  - High instrument input: 3.9M Ohms, 150mV
  - Low instrument input: 22k Ohms, 0dBu nominal
  - Frequency response: -3dB @ 17Hz and 30kHz
  - Height x Width x Depth: 619 x 476 x 230 mm
  - Weight: 13.80 kg
  - Made in the UK, built to order
