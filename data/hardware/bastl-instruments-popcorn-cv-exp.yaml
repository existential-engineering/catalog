url: https://bastl-instruments.com/eurorack/modules/popcorn-cv-exp
description: Adds more CV inputs for enhanced control of nonlinear browsing
  through the steps of the Popcorn sequencer. Provides a gate input for
  minor/major quantizer selection, CV input for Gate Time, CV input for Slide
  Time, CV input for trigger A step jumping, and CV step address offset. An
  alternative mode offers 3 binary gate bits for step address selection.
details: |-
  2HP expander for the Bastl Instruments Popcorn sequencer.
