url: https://products.electrovoice.com/na/en/etx-18sp/
description: The ETX-18SP is an 18-inch powered subwoofer engineered for
  professional portable and installed sound systems. An 1800 W Class-D amplifier
  with integrated FIR-Drive DSP drives a DVX3180A 18-inch woofer in an 18 mm
  plywood enclosure with EVCoat finish, delivering up to 135 dB peak SPL with
  low-frequency extension to 28 Hz. A dedicated DSP preset enables true cardioid
  performance across the full operating bandwidth, and an adjustable low-pass
  filter (80 / 100 / 120 / 150 Hz) plus a combo pole cup (insert and threaded)
  support flexible deployment alongside ETX full-range models. Removable casters
  provide mobility, and the enclosure is protected by a 16 AWG powdercoated
  steel grille.
details: >-
  1800 W Class-D power amplifier with integrated FIR-Drive DSP


  DVX3180A 457 mm (18 inch) low-frequency transducer


  Maximum SPL of 135 dB peak


  Frequency response 33 Hz - 150 Hz (-3 dB), 28 Hz - 180 Hz (-10 dB)


  Dedicated DSP preset for true cardioid performance across the full operating
  bandwidth


  Adjustable low-pass filter: 80 / 100 / 120 / 150 Hz


  Combo pole cup (insert and threaded) for use with ETX full-range loudspeakers


  Removable casters for transport and mobility


  18 mm plywood enclosure with EVCoat finish


  16 AWG steel grille with powdercoat


  Universal switching power supply (100 - 240 V~, 50 - 60 Hz)
