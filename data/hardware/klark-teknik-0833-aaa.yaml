description: The DN735 is a solid-state audio recorder engineered for broadcast,
  installation and live-event applications where reliable, instantly recallable
  audio playback is required. With no moving parts beyond the user controls, it
  avoids the playback dependency of mechanical media.
details: |-
  Solid-state storage means no tape, no disk and no head-cleaning, just instant access to the required audio. For announcement systems, event playback rigs and broadcast continuity, the DN735's reliability profile is engineered to disappear into the background of the operator's daily work.

  The DN735's audio path is built to the transparent, low-noise, low-distortion standards that the DN-series has carried since the 1970s. Storage is solid-state and the signal path is not compromised on its account.

  The recorder is designed and engineered at the Klark Teknik facility in Kidderminster, United Kingdom, bringing DN-series discipline to the recorder category.
specs: |-
  - Solid-state storage, no moving parts beyond the user controls
  - Audio path built to DN-series transparent, low-noise and low-distortion standards
  - Designed and engineered in Kidderminster, United Kingdom
