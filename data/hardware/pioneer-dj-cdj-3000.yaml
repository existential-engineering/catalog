details: |-
  Professional DJ multi player

  Enhance your creative power with our evolved flagship multi player, the CDJ-3000. This robust unit is powered by a new MPU and packed with specially developed high-quality components and innovative features.

  The MPU (micro-processing unit) is the first we’ve ever put in a CDJ. It drives the unit, delivering stable performance and enabling advanced new features, and creates a smoother overall DJ experience.

  Compatible with rekordbox CloudDirectPlay
  Simply connect the CDJ-3000 to the internet via a Pro DJ Link connection with a LAN cable to start using rekordbox CloudDirectPlay. In advance, you’ll export an authentication key from rekordbox to a USB storage device which, when plugged into the CDJ-3000, enables you to browse and play all the tracks in your cloud-based library. 

  *rekordbox Creative or Professional plan subscription is required.

  StreamingDirectPlay
  Browse and play the latest tracks from the Beatport Streaming* platform directly from the CDJ-3000, with access to playlists of various genres and tracks from your pre-created My Playlist. Automatic BPM and grid analysis enables you to check the development of a song on the waveform display. And you can use Beat Sync and quantize for intuitive and accurate beat matching and mixing.

  *Requires subscription to Beatport Streaming's Professional or Advanced plan. Visit the official Beatport website for more details.

  Analyze tracks quicker with Cloud Analysis
  When loading track on a CDJ-3000 connected to the internet, the BPM, beatgrid, and waveform can be instantly acquired from AlphaTheta's track information database and used for your performance. This enables rapid and accurate beat matching and mixing using Beat Sync and quantize, even with tracks from supported streaming services, removing the need for song analysis on the CDJ-3000. Cloud Analysis is available to all rekordbox users.

  Enhanced performance and rock-solid stability

  Have faith in the decks. As well as expanded creative options, the CDJ-3000 brings even more stability and reliability to your setup.

  Advanced MPU
  We’ve revolutionized the way the CDJ is driven with its new MPU, making it smoother and more stable than its predecessors. The MPU’s processing power allows for new functions and lets us introduce more features in future updates.

  Pro DJ Link with Gigabit ethernet
  Thanks to the Gigabit Ethernet connection for Pro DJ Link, you can share and play audio files from USB devices and SD cards on up to 6 CDJ-3000 units when you combine them with a compatible 6-channel mixer such as the DJM-V10.

  Better screen visibility
  The maximum screen brightness has been improved by more than 150% compared to that on the CDJ-2000NXS2, so you can crank it up depending on the environment you’re playing in and improve visibility.

  Tougher components
  The high-quality aluminum top plate and redesigned play, cue, and Hot Cue buttons are stronger than ever. Also, the lockable V-Lock power cable* guards against accidental disconnections that could interrupt your show.

  * Excluding some regions.
