  - 15" Custom Lavoce speaker
  - Ampeg Legacy preamp with 3-band EQ
  - Footswitchable SGT overdrive
  - Auxiliary input and headphone output
  - Effects loop
  - Extension speaker and XLR direct outputs
  - 34 lbs. (15.45 kg)
