description: A tri-mode chorus pedal combining Keeley true chorus and vibrato,
  an automatic double tracker with reverb, and a dual-band chorus engine, with
  selectable guitar or bass voicings.
details: |-
  The Seafoam Plus Chorus is a tri-mode chorus pedal that pairs a conventional LFO chorus with an automatic double tracker and a crossover-based dual chorus engine. It is tuned for guitar, and an internal switch selects voices and modes created for bass players, including flanging and tremolo. A second internal switch chooses between vintage and modern tones, doubling the available sounds; the pedal ships in Modern Mode for a wide, lush, high-fidelity chorus.

  The ADT mode carries the automatic doubler developed for the 30ms Double Tracker, creating second and third voices that sound at different times and different pitches. In that mode the Space control is a heavily modified Abbey chamber type reverb, Rate sets the tune or pitch offset of the doubled voices, and Depth sets their time delay.

  Seafoam Mode is the classic voice, modelled on a vintage BBD analog chorus unit with a regularly cycling LFO. Slow rate and wide depth give a spacious chorus, rolling the Mix control fully up gives vibrato, and Space acts as a tone control running from bright to vintage warmth.

  Dual Chorus Mode uses a frequency crossover centred near the high E string so the depth of chorus can be set independently for highs and lows, from a deep throbbing low end under a calm top to a shimmering high end over a fixed low end. In bass mode the band split puts chorus on top and tremolo underneath, and the bass flange mode gives the Space knob positive and negative feedback control with zero feedback at centre.
