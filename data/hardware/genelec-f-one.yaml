url: https://www.genelec.com/f-one
description: "The compact F One active subwoofer combines extended, controlled
  bass performance with award-winning aesthetic design that will blend
  beautifully with any space and decor."
details: |-
  The F One is a compact active subwoofer from Genelec's home audio F Series, engineered to extend the low-frequency reach of small to mid-sized listening systems while occupying minimal floor space. Its die-cast aluminium enclosure houses a magnetically shielded 165 mm cone driver powered by a 40 W Class D amplifier, reproducing frequencies down to 35 Hz with very low distortion at high SPLs.

  Unlike many lifestyle subwoofers, the F One is designed as a true system hub. Onboard room response controls and full bass management allow precise tailoring to the room's acoustics, freeing the main speakers from low-frequency duties so they can focus on cleaner mid and high reproduction. The result is a more coherent, less distorted system that delivers convincing bass without overwhelming the listening space.

  The upgraded model adds versatile connectivity to suit modern home setups: analog inputs sit alongside optical and coaxial S/PDIF digital inputs, with automatic input detection that selects the active source without manual intervention. Wireless volume control and IR remote learning let the F One slot into existing remote ecosystems, positioning it as a central control point for a home audio system.

  Genelec's Intelligent Signal Sensing (ISS) circuitry drops power consumption below 0.5 W when no audio is detected, helping the subwoofer meet strict standby targets while remaining ready to wake on signal. Combined with protection circuitry, optimized amplifier topology, and active crossovers, the F One delivers controlled, full-range bass that integrates cleanly with Genelec's F Series and G Series speakers as well as third-party stereo and home theatre systems.

  Available in matte black and matte white finishes, the F One's iconic curved cabinet and compact 251 x 305 x 305 mm footprint allow flexible placement, while its 5.6 kg weight makes installation straightforward in living rooms, dedicated theatre spaces, gaming setups, and high-end listening environments alike.
specs: |-
  - Frequency response: 35 Hz - 85 Hz (-6 dB)
  - Short term max SPL (averaged 40-85 Hz at 1 m): ≥100 dB
  - Self-generated noise (A-weighted, free field at 1 m on-axis): ≤15 dB SPL
  - Bass driver: 165 mm cone, magnetically shielded
  - Bass amplifier: 40 W Class D
  - Enclosure: Die-cast aluminium
  - Inputs: 1 × optical Toslink S/PDIF, 1 × coaxial RCA S/PDIF (75 Ohm), 1 × 3.5 mm stereo analog jack, 3 × RCA analog (L, R, LFE)
  - Outputs: 2 × RCA analog (L, R)
  - Automatic input detection
  - Wireless volume control with IR remote learning
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤7 W
  - Power consumption (full output): 70 W
  - Mains voltage: 100, 120, 220, or 230 VAC, 50/60 Hz (region-dependent)
  - Height: 251 mm
  - Width: 305 mm
  - Depth: 305 mm
  - Weight: 5.6 kg (12.3 lb)
  - Finishes: Matte Black, Matte White
