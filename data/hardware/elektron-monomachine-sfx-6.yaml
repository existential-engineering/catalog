description: >-
  The Elektron Monomachine SFX-6 is a six-voice digital synthesizer combining five distinct
  synthesis engines with a powerful step sequencer, built-in effects per track, and a 37-key
  LED keyboard with joystick controller.
details: |-
  Released in 2004, the Monomachine SFX-6 is a limited edition variant of Elektron's SFX-60 that
  adds a 37-note LED-action keyboard and a specialized joystick controller for real-time sound
  manipulation. It packs five different synthesizer engines into a single compact instrument,
  each offering a fundamentally different approach to sound generation.

  The five engines include SuperWave for analog-modeled saw and pulse leads and basses, SID for
  Commodore 64-style synthesis with ring modulation and sync, DigiPRO for raw digital waveforms
  and percussive beatbox sounds, FM+ for modern frequency modulation with custom FM blocks, and
  VO for formant-based vocal synthesis using pulse, noise, and consonant-like shaping. Each of
  the six tracks gets its own 24dB resonant multimode filter, AHDR envelope, and dedicated
  effects including delay, EQ, sample rate reduction, and distortion.

  The sequencer is a standout feature, offering six internal synthesis tracks plus six external
  MIDI tracks for controlling outboard gear. Twelve programmable multi-function arpeggiators and
  18 tempo-synced LFOs (three per track) enable complex evolving patterns. Memory stores 768
  patches across six banks, along with 128 patterns and 32 songs. Three MIDI connections
  (In/Out/Thru) provide comprehensive integration with other equipment.
specs: |-
  - Polyphony: 6-part monophonic or 1 six-voice polyphonic
  - Synthesis engines: 5 (SuperWave, SID, DigiPRO, FM+, VO)
  - LFOs: 18 tempo-synced (3 per track)
  - Filter: 1 resonant 24dB multimode per track
  - Envelope: AHDR per track
  - Effects: 6x delay, 6x EQ, 6x sample rate reduction, 6x distortion
  - Sequencer: 6 internal tracks + 6 external MIDI tracks
  - Arpeggiator: 12 multi-function programmable
  - Keyboard: 37-note LED (SFX-6 only)
  - Controller: DJ-style joystick
  - Memory: 768 patches (6 x 128), 128 patterns, 32 songs
  - Connectivity: 3x MIDI (In/Out/Thru)
  - Date produced: 2004
