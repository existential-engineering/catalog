description: >-
  The Little Phatty is a monophonic analog synthesizer from Moog Music that brings classic
  Moog sound design into a compact, portable package. Designed by Bob Moog as his final
  synthesizer creation, it features a 100% analog signal path with two ultra-stable
  oscillators and the iconic Moog ladder filter. It offers 100 user-editable presets and a
  37-note keyboard, positioned as an accessible entry point to authentic Moog synthesis.
details: |-
  The Little Phatty occupies a unique position in Moog's lineup, sitting beneath the Voyager in complexity while offering substantial sonic capabilities without excessive feature density. The instrument emphasizes hands-on control and visual feedback through backlit buttons and dials, with no hidden pages or sub-layers of button functions.

  Designed as a 21st century analog Moog synthesizer in a compact portable package, the Little Phatty balances simplicity with capability. Its pure analog architecture delivers authentic Moog character with modern reliability, excelling at generating analog basses, leads, effects, and noises with exceptional stability.

  Moog also released a limited Tribute Edition run of 1,200 individually numbered units featuring wood side panels, signature plates, a commemorative CD-ROM, and poster, honoring the legacy of Bob Moog.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 ultra-stable analog oscillators
  - Waveforms: Triangle, sawtooth, square, pulse (continuously variable)
  - Oscillator sync capability
  - Filter: 1 low-pass Moog ladder filter with ADSR envelope
  - Envelopes: 2 ADSR envelope generators (filter and volume)
  - LFO: 1 LFO with 4 waveforms (saw, square, triangle, ramp)
  - Modulation sources: Filter envelope and Osc 2
  - Modulation destinations: Filter, pitch, wave, Osc 2
  - Keyboard: 37 keys with +/-2 octave transpose
  - Memory: 100 user-editable presets
  - MIDI IN/OUT
  - CV inputs: Pitch, volume, filter
  - Gate control input
  - Signal path: 100% analog
  - No on-board sequencers or effects
releaseDate: "2007"
