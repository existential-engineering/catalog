description: A 500 Series module combining analog tape emulation with discrete
  transformer-coupled console processing. The 1-Track integrates the TAPE•C
  module (100% analog, modeled on 15 IPS tape machine operation) with the Mass
  Drivr discrete console mojo circuit and a single-knob Emphasis EQ, forming a
  complete tracking chain designed for use prior to A/D conversion.
details: |-
  The 1-Track houses three processors in a single 500 Series slot: a tape emulation stage (TAPE•C), a discrete transformer-coupled console saturation stage (Mass Drivr), and a single-knob Emphasis EQ. The EQ can be placed before or after the tape stage. A Texture switch provides flexible tape response options, and each of the three processors can be individually bypassed. LF Head Bump and HF Response are user-configurable via dipswitches (defaults: LF Head Bump ON, HF Response OFF). The module also includes a Colour-compatible analog expansion slot. Designed and assembled in the USA. RoHS compliant.
