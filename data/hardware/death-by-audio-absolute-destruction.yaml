description: A fuzz/distortion pedal built around a power amplifier IC with Gain
  and Overload sliders that interact to create fuzz, octave, distortion and
  self-destructing texture effects.
details: |-
  OUR MOST INSANE PEDAL YET This might be our craziest pedal. Showing little-to-no respect for what instruments normally sound like, or even what people want them to sound like, we pushed this thing until it sounded fully unhinged. Want a thick, gnarly fuzz sound? How about a crushing distortion tone? Sure, you can do that, and it'll sound great. But you can also push the OVERLOAD slider into blooming, octave nastiness; push it further and starve the circuit until your signal eats itself. Crank it to the maximum and your sound will duck completely into the void before it returns to life with a relentless vengeance. Details The Absolute Destruction harnesses a power amplifier IC to generate its insane sound. Its Gain and Overload sliders interact to create a wide range of unique sounds in various positions. You choose, to your liking, how much to absolutely destroy your sound. The further the Overload control is set to the left, the faster the effect slips into absolute destruction. Blow it out even harder and faster by slamming Gain and Overload opposite one another. Lower one or the other for smoother attack and release. Screaming octaves, thick fuzz, and the sound of your guitar reaching back from the depths of destruction are at your fingertips. Think of it as a psychotic compressor, or maybe more accurately the sound your amp would make if you set fire to it. Controls MASTER VOLUME Controls the output volume of the effect. OVERLOAD Sets the ceiling at which the pedal overloads. When turned all the way up, the pedal will not overload. As the control slides to the left, it pulverizes the sound more rapidly. GAIN Sliding this control to the right increases gain and distortion. Horizontal sliders have been recessed to protect them from bending or any accidental movement while playing. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 5 mA Physical Details Dimensions: 4.95" x 2.61" x 2.34" (including hardware) Weight: 10 oz. Sound Samples Mustang High-Gain Octave Low-Gain Maxxed Out Swell Maxxed Out Staccato Jazz Bass Maxxed Out Octafuzz Swell Vox Bass Everything Down High Noon High-Gain Overloaded Freak-Out
