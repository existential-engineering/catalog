details: |-
  PLETHORA X1 automatically saves your settings as you go. No need to constantly reminding yourself to hit that ‘Save’ button or fear losing your latest effect preset. We want to give you peace of mind, knowing that PLETHORA X1 has your back once the music starts playing!

  With Stereo inputs and outputs, you can make the most of the effect types that benefit from having access to a wide sonic playground. This could be mesmerizing reverbs, ever-moving delay tails, broad harmonies, lush phasing, and so much more.

  When you have loaded your TonePrint into the PLETHORA X1, you want easy and intuitive control. Once your drummer counts you in, the time for deep editing has passed and on-the-fly control is all that matters. PLETHORA X1 can be adjusted fast via three simple knobs that let you tweak key parameters mid-song.

  You may prefer to simply use the TonePrints as they were meticulously designed by masterful players, but if you feel like adjusting them or even tweaking out your own custom TonePrints, we welcome you to go nuts in the TonePrint Editor where you gain access to a, well, plethora of effect parameters and creative possibilities!

  Connect the free TonePrint App to PLETHORA X1 via Bluetooth to effortlessly import scorching sounds from our ever-growing TonePrint library of which most of the items are created by some of the world’s best musicians. In other words, today PLETHORA X1 will drop your jaw to your lap – tomorrow it will hit the floor. The keyword here is ‘future-proof’! Speaking of, we’ll keep your PLETHORA X1 cutting edge with regular firmware updates, including new boards, TonePrints, and more…
