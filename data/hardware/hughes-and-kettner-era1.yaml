details: |-
  Welcome to a new era of acoustic amplification. Developed with renowned designer Michael Eisenmann, Era 1 gives you richly detailed definition for peerless authenticity and tonal brilliance, plus a bunch of remarkably innovative and intuitive features to make every performance better. On top of all this, Era 1 is built in Germany to the highest quality standards.

  High-definition audio comes from painstakingly selected, top-drawer components, excellent preamps, premium-quality AD/DA converters, and a custom-made power amp with massive headroom. Richly detailed definition, wonderfully dynamic response and plenty of headroom add up to a natural-sounding audio experience unrivaled in authenticity.

  Intuitive handling comes with zero compromises: two fully featured, identical channels, each with an independent FX engine with 16 programs. Very effective Preshape and Mode buttons voice the channels to suit different instruments and vocal registers, and Era 1 stays as compact and light as a conventional 60-watt combo.

  Superior quality comes from development by renowned acoustic amp designer Michael Eisenmann in a joint effort with the Hughes & Kettner team, choice materials handpicked for durability and ruggedness, and manufacture in Germany to the most discriminating standards for quality.
specs: |-
  - 4 channels
  - Notch filter: 40-180 Hz
  - 3-Band EQ with 2 switchable modes
  - 16 FX programs (Reverb, Chorus, Flanger, Delay, Combinations), adjustable FX parameters
  - CH 1 / CH 2 switches: -10 dB, Shape, Mute
  - Master Volume and Gain controls
  - Tilt stand (included): 25° / 35°
  - Pole mount: 35 mm
  - Padded protective cover (included)
  - 250-watt power amp
  - 1x8" custom-made mid/low speaker
  - 1x1" dome tweeter (high speaker)
  - Optional Hughes & Kettner FS-2 footswitch (amp mute, internal FX mute)
  - Dimensions: 350 x 285 x 290 mm
  - Weight: 9.85 kg / 21.7 lbs (wood), 10.75 kg / 23.7 lbs (black)
