details: |-
  The Cubicle is a reverb pedal from Ashdown's Dr Green range. Using simple wet and dry controls, it allows players to easily add a bit of depth to their tone right up to everlasting cathedral-style reverb, making it a high-quantity yet simple-to-use reverb for a pedalboard. It features true bypass switching and is housed in a custom-designed steel casing that will stand up to being stomped on night after night.
specs: |-
  - Reverb pedal
  - Wet and dry controls
  - True bypass switching
  - Custom steel casing
