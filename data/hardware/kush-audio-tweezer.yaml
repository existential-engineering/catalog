description: A 500 Series compressor that represents everything this generation
  of Kush compression has to offer.
details: |-
  Tweezer is a punchy, vintage VCA powerhouse of a compressor, packed into a single 500 series module.

  With an independent, pre-compression distortion section, capable of everything from subtle warming to intense, fiery overdrive, a widely variable "tilting" eq in the sidechain, attack and release controls capable of extreme speeds, and built-in parallel compression, Tweezer's endless sonic palette rewards fearless experimentation.

  After witnessing the enormous success of TWEAKER, Kush's 19" Rackmount Mono Compressor, the company immediately turned its attention to condensing the same versatility and tone of that groundbreaking hardware into the limited space of a 500 module.

  In development since the day Tweaker was released, Kush finally landed on a brand new piece of gear that ticks all the boxes that represent what this generation of Kush compression has to offer.
specs: |-
  - 500 Module Single Channel Compressor
  - Stereo-linkable with included molex link cable
  - Sidechain Contouring via Detector-Path Filtering
  - Ultra-Responsive Gain Reduction Metering
  - Frequency Response 10Hz - 22kHz +/- 1dB
  - Total Harmonic Distortion = 0.003% min - 10% max
  - Wet/Dry Mix for Parallel Compression
  - Makeup Gain with 18dB of gain in hand
  - Bespoke detector ranging from lightning fast to musically mellow response
  - UBK-designed Drive circuit for 70s-style solid-state saturation with upper-midrange, odd-order harmonics
  - Attack measured in microseconds up to 50 milliseconds, with equally flexible release
  - Ratio/knee control from a 1.5:1 soft knee to a 30:1 hard knee
  - Soft bypass: signal always passes through the input and output amplifiers
