description: The 312ce-N is a nylon-string acoustic-electric guitar from
  Taylor's 300 Series, designed for classical and fingerstyle players, with a
  Grand Concert body, solid Sitka spruce top, solid sapele back and sides, and
  ES-N electronics.
details: |-
  The 312ce-N is built on Taylor's Grand Concert body shape, offering a comfortable, compact feel well-suited to fingerstyle technique and lighter playing dynamics.

  The solid Sitka spruce top pairs with solid sapele back and sides for a balanced tonal profile with clear highs and focused midrange projection. The 1-7/8" nut width accommodates the wider spacing typical of nylon-string guitars.

  Taylor's ES-N under-saddle transducer captures the instrument's natural voice for amplified performance. Classical nickel tuners and an ebony bridge complete the setup. The guitar ships with a deluxe brown hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Sapele (solid, satin)
  - Bracing: Nylon Series
  - Cutaway: Soft cutaway
  - Neck: Tropical Mahogany
  - Fretboard: Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Tuners: Classical Nickel
  - Electronics: ES-N under-saddle transducer
  - Strings: D'Addario Pro Arte Carbon (.024-.046)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
