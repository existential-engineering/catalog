description: An ABY switcher using silent optocoupler-based soft switches with a
  custom-wound isolation transformer to split a guitar signal to two amps
  without pops or hum. Each channel has switchable JFET buffers for driving long
  cable runs.
details: |-
  CS-ABY-ST V2

  The CS-ABY-ST is now the "v2," is now Black , still the best ABY switcher in the world, and just got a LOT smaller! The CS-ABY-ST V2 has silent soft switches. No pops, no ticks, and no electrocutions, thanks to a Nickel core custom-wound 1:1 transformer that doesn't boost the treble frequencies like the "industry standard" transformer does, so fuzzes played through the True-Path sound round and distortions don't sound strident. I can hear it, so can you. Using the most advanced 4 opto switching system ever, yet also offering the purest signal. I developed our photocells over the last year with a rather patient optocoupler manufacturer (Thanks Fred), and my cells only have around only 50 ohms series resistance compared to the Vactecs (which all other optocoupler switchers use) offering a whopping 300-400 ohms of series resistance to your guitar's signal. I can hear 300 ohms... you can hear 300-400 ohms. Want it Buffered? You got it. Each channel has switchable JFET Buffers to drive long lengths of cables without any tone loss. Want it clean & clear for Fuzztones? Let me explain: Fuzz pedals like to be hit with High impedance signal like your pickups produce. Buffers are Low Impedance, so if you are a Fuzz connoisseur like me you simply turn off the buffer on the ABY channel that goes to your Fuzzes. Want to correct the phase between your 2 amps? You got it. I know the other ABY's says they're silent... but truth is they have a slight "thump" that becomes a loud "BOOM" when splitting say a Twin Reverb and Vintage Plexi Marshall. Do not confuse this with a simple metal box and 2 switches that comprise 99% of the ABY's out there. Those sound ok UNTIL your signal chain reaches 20 feet or more... UNTIL you hit "Both" and the signal is loaded down to oblivion, or UNTIL you get electrocuted because of grounding issues due to the absence of an Isolation Transformer that the True-Path has! And don't think that your tone is going to suck because you see the inside of the True-Path and think that your signal is going through a bunch of circuitry. No Audio signal passes through the switches or ANY of that circuity! Your signal is going through ONE RESISTOR in the True-Path (that's the optocoupler), or if you choose, it will go through a tone-full JFET unity gain buffer that is rich and sweet, and perhaps a custom wound Nickel-core Audio transformer (B channel only). All that gadgetry in the True-Path is simply to light up those 4 optocoupler in a way that they don't POP when switching between amps...NONE of your guitar signal goes through that. It's pure, it's True-Path, it's Fulltone.
