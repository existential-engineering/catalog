description: Machined Direct Drive Hi-Hat Stands feature a host of patented features and cutting-edge technology.
details: |-
  A perfect companion to MDD bass drum pedals, the precisely Machined Direct Drive Hi-Hat Stands feature a host of patented features and cutting-edge technology.

  From the newly-designed One-Touch Clutch down to the machined high-grade aluminum perforated pedal plate, these hi-hat stands are engineered to provide drummers with smooth, responsive action and road-ready dependability.

  This model uses a three-leg tripod base, with Offset Cymbal Seat Adjustment, V.E.R.T. vertical spring tension adjustment, an Interlocking Delta ball bearing hinge and a Direct-Pull System with selectable action.

  These precision-machined stands are handcrafted in the U.S.A., at the highest standard, using airplane-grade materials for persisting, streamlined performance.
specs: |-
  - Three-leg tripod base
  - One-Touch Clutch (U.S. Patent No. 9,601,096)
  - Offset Cymbal Seat Adjustment
  - V.E.R.T. (Vertical Spring Tension Adjustment)
  - Interlocking Delta Ball Bearing Hinge (U.S. Patent No. 9472174)
  - Direct-Pull System with Selectable Action
  - Machined high-grade aluminum perforated pedal plate
  - Handcrafted in the U.S.A.
