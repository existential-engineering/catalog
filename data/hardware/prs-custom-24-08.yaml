details: |-
  The Custom 24 is the quintessential PRS guitar, the iconic instrument that started it all back in 1985. The Custom 24-08 keeps many of the foundational specs as the original Custom – maple top, mahogany back and neck, 24 frets, 25” scale length, the PRS patented Gen III tremolo, and Phase III tuners with wing buttons – but adds a new level of versatility with its TCI pickups and EQ Mini-toggle switches.

  TCI pickups are designed to offer a full, musical sound reminiscent of single-coil and soapbar tones. The dual EQ mini-toggle switches act as tuned high-pass filters when engaged (in the up position), removing shelved low-end and allowing the high frequencies through for more clarity and musical highs. “The EQ switches were developed with and first featured on the Private Stock John McLaughlin model in 2023. Both John and I felt that they offered a different, but just as versatile, sound that played a significant role in the musicality of that guitar. I am happy that we are now extending this feature into more models.”

  – Paul Reed Smith

  For classic PRS playability, reliability, and tone with ultimate flexibility, check out the Custom 24-08.
