description: The SQ1D provides 8 channels of either compression or gating in a
  compact 3U rack unit, with flexible options for channel linking and side chain
  filtering and monitoring. It offers multiple compression modes combining RMS
  and Peak sensing with Hard and Soft Knee characteristics alongside a fully
  featured noise gate, so one unit can stand in for several separate dynamics
  processors.
details: |-
  Intelligent Threshold Shift (iTS) operates in conjunction with the Gate Hold control to reduce false triggering of noise gates. When signals, especially low frequency ones, sit very close to the gate threshold, a gate can repeatedly open and close on the programme material. iTS keeps the gate open by automatically adjusting the gate threshold downwards the moment the signal goes over the threshold setting, then resets when the signal falls below the temporarily adjusted threshold. The hysteresis action gives more decisive gate operation and attack envelopes that start instantly and consistently even on signals only slightly over threshold.

  Adjacent channels can be linked in any combination for stereo or multichannel operation. Linked channels all adopt the operating mode, compressor or noise gate, of the left-hand channel of the group, whose settings then control every member, with only the make-up gain and side chain filter frequency controls left independent per channel.

  On many outboard dynamics processors the side chain listen function is routed to the main output when engaged, which prevents mix engineers using it during a live performance. The SQ1D instead features an additive console-style Solo Bus for monitoring incoming signals at source and fine-tuning the side chain filters. Dedicated input and output XLR connectors allow the bus to be cascaded between multiple units and connected to a spare input channel or auxiliary return on the console. A Solo In Place button routes the side chain signals directly to the audio outputs, useful during set-up for a show.

  A Vintage switch selects either the default RMS sensing compression mode or an emulation of older compressor designs with exponential attack and release envelopes, and a Hard Knee switch replaces the default Soft Knee response. With both inactive the compressor runs in RMS and Soft Knee modes for the slowest and most subtle envelopes; Hard Knee with RMS gives a more clinical, limiting-style response; Vintage with Soft Knee uses a dual time constant linear attack profile whose peak sensing adds harmonic overtones; and both switches together give precise envelope control and aggressive compression that at the highest ratio works as a limiter.

  Each channel side chain carries a selectable bandpass filter with wide and narrow responses. Frequency-selective compression is an alternative to equalisation, the wide response enhancing an instrument's character without boosted EQ, while the narrow response lets the unit work as a frequency-selective de-esser on sibilance or on specific resonances. In gate mode the side chain filter selects the key frequency component that triggers the gate, which is useful on drum kits and percussion. Each channel also has a dedicated side chain input on a balanced 1/4" TRS connector.
specs: |-
  - 8 channels, each switchable between compression and gating
  - 3U rugged steel rackmount enclosure
  - Compression modes: RMS or Peak (Vintage) sensing with Soft or Hard Knee
  - Intelligent Threshold Shift (iTS) gate hysteresis with Gate Hold control
  - Selectable wide and narrow bandpass side chain filter per channel
  - Dedicated balanced 1/4" TRS side chain input per channel
  - Additive console-style Solo Bus with dedicated input and output XLR connectors, cascadable between units
  - Solo In Place button routing side chain signals to the audio outputs
  - Adjacent channel linking in any combination for stereo or multichannel operation
  - Balanced XLR audio connectors
  - Auto-ranging universal switch-mode power supply, auto-voltage sensing for worldwide use
