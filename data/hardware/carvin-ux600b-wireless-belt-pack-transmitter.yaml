details: |-
  UX600B User Manual

  UX1200 Series Frequency List

  The UX600B body pack transmitter is the ideal solution for theater, live music and spoken word presentations. Experience the freedom to move about the stage without the constrains of a wired microphone. The UX600B is found in the UX1200B system and can serve as 3 different workhorses in your inventory. Choose different accessories such as the UX-HM3B black headset microphone , the UX-LP lavalier microphone or the UX-GT 1/4-inch instrument cable. Features:

  Six channel groups allow for frequency ranges that work well with multiple channels
  Use up to 14 UX1200B channels simultaneously
  Scan for available frequencies or select your own pre determined frequiences
  Backlit LED Display shows battery life and mute status of belt pack
  LOCK mode to prevent unintentional changes
  4-Pin TA4F style connector

  UX600B Belt Pack Transmitter Specifications :
  Frequency Band: 516 MHz - 542 MHz
  Input Connector: TA4F 4-pin XLR
  Frequency Response: 40Hz - 18kHz
  RF Output Level : 10mW or 50mW
  Battery : 2x AA, Not included
  Lighted Mute Indicator : Yes
  Backlit Display: Yes
  Group and Frequency Selection: Yes, Manual and Auto Scan
  Sensitivity Adjust : Yes , -18dB /+12dB (3dB steps)
  Attenuation Control : Yes- Helps to manage extreme SPL input
  Lock Out: Yes
  Microphone Accessories : UX-HM3(Black) , UX-HM3T(Tan) , UX-LP1 , UX-GT
  Warranty: 90 Days
