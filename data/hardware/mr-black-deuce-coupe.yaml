url: https://www.mrblackpedals.com/products/deuce-coupe
description: A reborn cult-classic overdrive and boost prized for its clear,
  natural, amp-like dynamic response, now with dual soft-touch footswitches and
  on-the-fly Ultra Boost. A Jack Deville design.
details: |-
  Clear, open, natural, responsive and organic are words often used to describe
  overdrive, yet most compact overdrives feel constricted and artificial. From its
  release in late 2011, the Deuce Coupe broke that mold, delivering amp-like
  response, dynamic content, detailed articulation, high headroom and uncolored
  tone, earning a lasting cult-classic reputation.

  More than a decade later the Deuce Coupe has been reborn. It now carries two
  soft-touch footswitches, an external Ultra Boost control and modernized
  Click-Less relay true-bypass switching, while delivering the same dynamic,
  naturally responsive overdrive and boost that earned the original its reverence.

  Three familiar, intuitive controls complement the overdrive circuit, and the
  Ultra Boost can be adjusted on the fly alongside direct access to the Ultra
  channel. Carefully matched impedances mean the Deuce Coupe keeps its response
  regardless of where it sits in the chain: it does not need to be first to respond
  to guitar volume or picking dynamics, and it delivers loads of output on demand
  (over +56dB gain at maximum, which is a lot of volume).

  Many overdrives sound good, but few offer this clarity, natural feel and dynamic
  response. The Deuce Coupe behaves like an instrument in its own right, an
  extension of the guitar that integrates seamlessly with the amplifier. An
  internal split-rail power supply (+/-9V) drives its dynamic content and detail.
specs: |-
  - Incredibly dynamic natural and organic overdrive
  - 100% pure-analog, high-headroom signal path
  - Drive channel boost: +1dB to +40.8dB
  - Ultra channel boost: +1.8dB to +56.5dB
  - Internal split-rail power supply (+/-9V) for dynamic content and detail
  - Two soft-touch footswitches with Click-Less relay true-bypass
  - Input Impedance: ~480KΩ
  - Output Impedance: <1KΩ
  - Frequency response: ~15.92Hz - ~6.66KHz
  - 9VDC 2.1mm negative center-pin power
  - ~22mA current draw
  - Jack Deville original design
