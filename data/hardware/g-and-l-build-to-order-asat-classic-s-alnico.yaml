details: |-
  Following on the heels of the ASAT Classic Alnico, the G&L crew in Fullerton turned their attention to bringing uncompromising alnico sonic flavor to the three-pickup ASAT Classic 'S'. The single-coil Alnico V bridge pickup belts out meaty twang. The Alnico V neck pickup is specified for a fuller tone that leaves traditional, anemic T-style neck pickups in the dust.

  The two pickups also pair beautifully for an exceptionally sweet, jangly tone bursting with harmonics. The ASAT Classic 'S' Alnico goes even further, with a reverse-wound, reverse-polarity G&L CLF-100 Alnico V pickup, as used on the G&L Legacy, in the middle. The result is the sweet, evocative "quack" of a good S-style axe. A push/pull tone pot, becoming a staple of G&L three-pickup axes, gives the classic neck and bridge combination as well as all three pickups together, for a unique sonic depth that G&L players love.

  These Alnico pickups are not a flavor-of-the-week, having been carefully refined by G&L's Paul Gagon for personal guitars since the late 1970s. Back then, Gagon was an R&D engineer at another company when he was tasked with finding out what was so special about the early bolt-on guitars many players raved about. Gagon analyzed many examples of what were considered "holy grail" guitars, spending time out on the shop floor talking to builders still working in the pickup department since the '50s, all on a quest to discover where the real mojo was and was not. What he learned from the builders matched his own engineering analysis. Back in the day, the actual spec of pickups coming down that old production line varied considerably. The nagging imbalance between bridge and neck pickup was something he longed to improve on, and today Gagon's preferred pairing of Alnico V pickups has arrived to delight the ears of discerning guitarists.

  Like the G&L Legacy, the ASAT Classic 'S' Alnico combines best-of Alnico tone with modern Leo touches for a blend of vintage and contemporary.

  To commemorate the introduction of the 'S', G&L commissioned a special 50-instrument production of ASAT Classic 'S' Alnico Launch Edition guitars. The Launch Edition features a Sugar Pine body coated in a new Autumn Burst finish. The combination of Sugar Pine and Alnico magnet pickups harks back to early prototype instruments created by Leo Fender. This Launch Edition 'S' is a thoughtful blending of old-school Leo with 21st century G&L quality and playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L Alnico single coils
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 5-position pickup selector, volume, tone with push/pull pickup expansion enabling neck+bridge or all 3 pickups together
  - Includes: G&L Deluxe Gig Bag
  - Launch Edition: 50-instrument run with a Sugar Pine body in Autumn Burst finish
