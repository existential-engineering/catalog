details: |-
  The Gretsch G5700 Electromatic Lap Steel produces the unmistakably rich tones of an electric Hawaiian guitar. Sleek and smooth, it features a solid mahogany slab body, 22.5" scale length, 28-fret plastic fingerboard with circle, triangle, square and diamond position markers, aluminum nut, chrome-covered single-coil bridge pickup with G-arrow control knobs for master volume and master tone, chrome-plated string-through-body bar bridge with chrome-plated cast zinc cover and silver plastic deco control plate. Enjoy the enticing magic of lap steel in remarkable Gretsch style.
