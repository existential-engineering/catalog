description: CUNSA is a quadruple analog pingable multimode resonant filter,
  saturator, mixer and oscillator. Each of its four state-variable filters gives
  lowpass, bandpass and highpass simultaneously, with a Character circuit for
  feedback and saturation, and the four can be used independently or linked
  through seminormalizations.
details: |-
  CUNSA is a quadruple analog pingable multimode resonant filter, saturator, mixer and oscillator. It is Frap Tools' sound seasoning tool, able to gently even out a patch with a final touch or to set it on fire with a ridiculous amount of spice. It consists of four multimode resonant filters with a custom saturation and feedback control, usable independently or in various combinations and roles thanks to a series of seminormalizations.

  The four state-variable filters each provide three behaviors simultaneously: lowpass, bandpass and highpass. Every behavior has a 12 dB/oct slope, except the lowpass, which can be switched between 12 and 24 dB/oct. Beyond the usual Q control that emphasizes the cutoff frequency, the Character circuit defines the amount of soft clipping when the filter overloads: high clipping gives a controlled behavior with a fat tone and pure resonance, while low or no clipping lets the signal saturate the filter stages and scream.

  Each filter responds to a V/oct signal with close tracking, so the cutoff frequency can follow a melody, or the filter can be made to resonate with no input at all and turn CUNSA into a multiple oscillator. The AC-coupled Ping circuit responds to incoming gates with a selectable decay curve, creating natural decay sounds from trigs or smoother envelopes from any other voltage, like a linear integrator with a custom decay. Feeding the audio input with trigs at high Q settings makes the filter ring.

  The four filters can work independently or be arranged in groups through seminormalled inputs and sum outputs, so CUNSA can be a 4x1, a 2x2 or a single 1x4 filter, as well as odd configurations such as 1+2+1 or 3+1, for mono, stereo or quadraphonic audio. Four input types carry a cascaded seminormalization, audio, VCA CV, V/oct and Ping, so a signal patched to one filter also feeds those to its right, and patching a dummy cable removes the seminormalization.

  Every filter output can be routed to an analog mix bus that sums the four filters and presents them in three combinations, all, 1+2 and 3+4, with a gentle shelving EQ on the higher frequencies of the All output for extra timbral variety. When the filter behavior is set to COMBINED, cutoff frequency control also acts on the input VCA, reducing amplitude and saturation as it approaches the lowest range. Besides the seminormalled inputs, every filter carries additional CV inputs for cutoff frequency, Q and Character, each with a dedicated attenuverter.
specs: |-
  - Four analog state-variable multimode filters, usable independently or linked and mixed
  - Lowpass, bandpass and highpass available simultaneously per filter, at 12 dB/oct, with the lowpass switchable to 24 dB/oct
  - Character circuit sets the amount of soft clipping on filter overload, from controlled fat resonance to full saturation of the filter stages
  - V/oct tracking on every filter, so the bank can resonate with no input and act as a quadruple oscillator
  - V/oct inputs seminormalled so one CV can control several filters
  - AC-coupled Ping circuit with selectable decay curve, responding to gates for natural decays or to any other voltage like a linear integrator
  - Audio inputs fed with trigs ring the filter at high Q settings
  - Group configurations of 4x1, 2x2 and 1x4, plus odd splits such as 1+2+1 and 3+1, for mono, stereo or quadraphonic audio
  - COMBINED filter behavior links cutoff control to the input VCA, reducing amplitude and saturation toward the low range
  - Cascaded seminormalization on four input types (audio, VCA CV, V/oct and Ping), removed by patching a dummy cable
  - Analog mix bus with All, 1+2 and 3+4 outputs, plus a gentle high-frequency shelving EQ on the All output
  - Additional CV inputs for cutoff frequency, Q and Character on every filter, each with its own attenuverter
  - Dimensions as listed by the maker: 15.6 x 23.6 x 6 cm
  - Eurorack module, bus-powered from the case's power header, with no power jack of its own
