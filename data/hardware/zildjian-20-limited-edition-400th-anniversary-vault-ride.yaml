details: |-
  This cymbal was made at the original U.S. Zildjian factory in Quincy, MA and was produced in the mid-1940s. The owner of this cymbal may notice stick marks and fingerprints, some of which belonged to Armand Zildjian, the cymbal tester in the factory at the time. These vintage cymbals feature the original mounting hole on the bell. For your convenience, an adapter has been included so you can play this cymbal on a modern cymbal stand.
