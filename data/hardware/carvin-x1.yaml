specs: |-
  - Overview
  - Specifications
  - Reviews
  - The design criteria for the X1 was to deliver the sounds of the classic Carvin X-100B amplifier in a compact package with added connectivity. The result is a full tube preamp in a pedal format, able to fit in a carry-on or backpack. The X1 incorporates tube technology with simple, yet flexible modern features to interface with many types of gear.
  - » Preamp Tubes: Two 12AX7 (four stages) » Controls: MASTER, BASS, MID, TREBLE, PRESENCE,GRAPHIC EQ » Lead channel: VOLUME, DRIVE, GAIN switch » Rhythm channel: VOLUME, BRIGHT switch » Graphic EQ: 5-Band, channel tracking, foot switchable, backlight color indications » Audio connections: Input, Output, Loop Send, Loop Return, Cab Voiced Out/Phones, Speaker » Input Impedance: >500K Ohms » Effects loop: Fully buffered, footswitchable, pre- Master/Amp/Voiced Out » Cab Voiced/Phones: 3G (3rd generation) active analog circuit, 2x12" and 4x12" settings, » TS (mono) or TRS dual-mono (for stereo headphones) low impedance capable » Speaker Output: 1 Watt @ 4 Ohms minimum » Footswitches (4): BYPASS(Master or Loop), GEQ, GAIN, CHANNEL » Bypass type (master): relay engaged hardwire bypass » DC adapter (included): , 100-240VAC input, 12VDC/1A voltage regulated output, 5.5mmOD/2.1mmID Center Positive » Size: H x W x D 3.825" x 8.875" x 8.375" (97mm x 225mm x 213mm) » Weight (without adapter): 3.9 lb. (1.77 kg
  - This is a product that was ahead of its time. Many performance venues no longer allow bulky amplifiers on stage and want you to play directly into their console or mixing board. The X1 is the perfect tool for this application. I want to encourage and thank you for your forward thinking and innovative products. Keep up the good work. Edgar C. - FL Just received my X1 Pre amp. It is amazing! So nice to purchase a product that meets or better yet exceeds expectations. Perfect fit for my home studio, sounded great through my THD Univalve 15. I own a V3M and I can attest that both amps are definitely voiced differently, now I have a huge pallet of tonal options. Thanks for hanging in there and designing such a versatile and useful piece of gear. Look forward to see what you develop next. David L. Marshfield,MA Dear Mr. Bruce,I need to congratulate you on the CARVIN X1, which has made me feel great emotions, after years of using software emulators of tube amplifiers!!!!!! I could not spend my money better, thank you very very much!!! I'll tell all the musicians my friends and I really hope you'll have a great success. Simone F. Calenzano,Italy
