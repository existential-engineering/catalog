details: |-
  The Anthem SL was designed as the streamlined version of the Anthem. Utilizing a pre-set mix between the mic and pickup, you get the best tonal qualities of the Anthem with a simplified control unit and minimalist endpin preamp. In 2010, when the acoustic world was running to cold digital modeling, Baggs chose a different route. We believed a real mic would do a better job of being a mic. Leaning into pure analog physics, we bypassed the digital emulation idea to create our award-winning Anthem System. Our breakthrough moment came when we collaborated with Keith Sewell, who was searching for a mic solution while touring with Lyle Lovett to eliminate the harsh spikes of traditional pickups in their in-ears. Lloyd Baggs saw this as his challenge to create a hybrid mic-pickup system with a single, feather-weight preamp on the instrument and a new type of mic, packing it with more advanced circuitry than even our legendary Para DI. This system became a grand Anthem to those years of innovation.
specs: |-
  - Patented TRU-MIC technology on the bridge plate with noise-cancelling microphone
  - Element pickup for low frequencies
  - Pre-set mic and pickup mix levels
  - Simplified control unit with volume and mic level controls
  - Minimalist endpin preamp, all-discrete Class-A with High-Graded FET input
  - Feedback-resistant design
  - Peel-and-stick mic installation
  - Steel-string, 12-string, and nylon-string models available
  - Single 9V battery powered
  - Requires professional installation
