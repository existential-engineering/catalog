name: ABM 500 RC EVO III
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - rack-mount
url: https://ashdownmusic.com/products/abm-500-rc-evo-iii
description: A rack-mounted version of the ABM 500 EVO III bass head with a
  polished chrome panel and 575W power stage. Three rotary tone controls provide
  20dB of EQ cut and boost, supplemented by two pairs of sliders. A single input
  is switchable for passive and active instruments through a blend of
  solid-state and dual-triode tube preamp stages, all footswitchable along with
  the compressor and Ashdown's sub-harmonic generator. Front-panel balanced DI
  (pre/post EQ), sub-bass output, tuner output, FX loop, and line input round
  out the connectivity.
details: |-
  The ABM 500RC EVO III is a rack-mounted ABM 500 EVO III head with a polished chrome panel and 575W power stage. Three rotary tone controls give 20dB cut/boost at 60Hz, 660Hz, and 5kHz, plus two pairs of sliders giving 15dB cut/boost at 180Hz, 340Hz, 1.3kHz, and 2.6kHz. The EQ is footswitchable in/out. A single input switchable for passive/active instruments runs through a blend of solid-state and dual-triode tube preamp stages (footswitchable presets). The compressor and sub-harmonic generator are also footswitchable. Connectivity includes a front-panel balanced DI output with pre/post EQ switching, a sub-bass output, a tuner output (with silent-tuning output mute), an FX loop, and a line input. An upgraded power section offers faster transient attack, more headroom, and lower noise.
specs: |-
  - Power Output: 575W
  - Power Requirement: 230V
  - Speaker Outputs: 2 x Jack/Speakon outputs
  - Minimum Impedance: 4 Ohm
  - Frequency Response: -3dB at 17Hz and 30kHz
  - High Instrument Input: 3.9M Ohms, 150mV - 20mV p-p
  - Low Instrument Input: 10K Ohms, 300mV - 40V p-p
  - Line Input: 22K Ohms, 0dBu nominal
  - Tuner Output: 22K Ohms, 0dBu nominal
  - DI Output: 600 Ohms
  - Effects Send: 22k Ohm, 0dBu nominal
  - Effects Return: 22K Ohm, 0dBu nominal
  - Sub Output: 1k Ohm, 0dBu nominal
  - EQ: Bass +/-15dB @ 45Hz, Middle +/-15dB @ 660Hz, Treble +/-15dB @ 7kHz shelving; Slider 1 +/-15dB @ 180Hz, Slider 2 +/-15dB @ 340Hz
  - Pre-amp Tubes: 1 x 12AX7
  - Dimensions (H x W x D): 88 x 482 x 293 mm
  - Weight: 12 kg
