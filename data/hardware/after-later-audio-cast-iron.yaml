description: A simple Eurorack voltage-controlled panner with CV-controlled
  level, where the left input normals to the right input for easy mono-to-stereo
  panning.
details: |-
  A simple VC panner with CV-controlled level. The left input normals to the right input to give an easy way to add panning to a mono signal. Expandable

  Demos
specs: |-
  - Bartender, Barbacks, DVCA, Cast Iron, Mingles, and USB-2CH can all be connected with Dupont cables (aka female to female breadboard cables) via pin headers on the back of the modules. Connecting the in and out pins will send/receive the audio into the next module.
