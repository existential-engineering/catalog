description: The dbx 164 is a discontinued single-channel compressor/limiter in
  the 160 series, featuring OverEasy® compression and professional balanced I/O
  in a 1U rackmount enclosure. It was a staple of studio and live sound dynamics
  processing throughout the 1980s.
details: |-
  The 164 belongs to dbx's renowned 160-series compressor/limiter line, offering single-channel OverEasy® compression with professional balanced connectivity in a 1U rackmount chassis. It provided transparent, musical dynamics control for studio recording, broadcast, and live sound applications.

  OverEasy® compression delivers a smooth soft-knee response that transitions gradually from linear amplification to gain reduction as the signal approaches and exceeds the threshold. This produces natural-sounding compression that blends into the audio without calling attention to itself.

  An owner's manual is available for download from the dbx product page. The 163/164 manual shared across both models indicates they share a common circuit architecture with the 163X.
