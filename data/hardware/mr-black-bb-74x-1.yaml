description: A pure-analog overdrive that captures the sag, response, and
  harmonic character of a legendary 18-watt EL-84 combo amp.
details: |-
  The BB-74x captures all the juice, sag, response, and harmonic magic of the
  legendary 18-watt EL-84 combo, reformed into a compact overdrive pedal.

  Its 100% pure-analog, organic overdrive circuit spans light drive to heavy
  saturation, emulating the responsive character of the classic British 18-watt
  combo amp.

  Housed in a CNC-milled genuine Hammond enclosure with an EZ-2-C LED indicator
  and diffusion lens, the BB-74x is a Jack Deville original design.
specs: |-
  - 100% pure-analog organic overdrive
  - Light drive to heavy saturation
  - Responsive circuit emulating the classic British 18W combo amp
  - CNC-milled genuine Hammond enclosure
  - EZ-2-C LED indicator with diffusion lens
  - Input Impedance: ~495KOhm
  - Output Impedance: <25KOhm
  - True-Bypass
  - Power: 9VDC, 2.1mm negative center-pin, or internal 9V battery (not included)
  - Current draw: 5mA
