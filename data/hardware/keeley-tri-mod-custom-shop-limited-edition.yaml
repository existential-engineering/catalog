details: |-
  The Tri-Mod is a modulation pedal with three selectable modes: chorus, ranging from subtle to a heavily detuned swirl, flanger, from slow sweeps to fast ones, and phaser, from a gentle spin to a thick swirl.

  This is a Custom Shop limited run that followed the 20 for 20 edition of the same pedal. The finish is matte baby blue with a light sparkle in the underbase, matte white knobs and a minimal graphic.
specs: |-
  - Three modulation modes: chorus, flanger, phaser
  - Custom Shop limited run finish, matte baby blue with matte white knobs
