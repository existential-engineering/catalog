description: A compact 4HP Eurorack module providing four logarithmic (audio)
  VCAs that mix to a common output, with audio and CV jacks normalled from top
  to bottom.
details: |-
  The Stoel Music Systems Quad VCA provides four logarithmic (audio) VCAs that mix to one common output in a compact 4HP module. Both the audio jacks and the CV jacks are normalled from top to bottom. If a CV signal is plugged in, and the CV jacks below it are unused, the same CV signal goes to the remaining VCAs. This applies the same VCA signal to multiple signals, such as in stereo or quad-channel configurations. Likewise, when an audio signal is plugged in, and the audio jacks below it are unused, the same audio signal is provided to the VCAs below. This configuration allows for the remaining VCAs to be used in parallel. Using two VCA channels in parallel reduces the noise floor by 3dB, and using all four channels in parallel reduces the noise floor by 6dB. Please note there will be an increase in output level when VCA channels are used in parallel. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  4 HP

  Depth
  37 mm

  Current Draw
  +12V: 19mA, -12V: 16mA, +5V: 0mA
specs: |-
  - VCA features four logarithmic VCAs in one single slim module
  - Both the audio jacks and the CV jacks are normalled from top to bottom
  - Using two VCA channels in parallel reduces the noise floor by 3dB
  - Using all four channels in parallel reduces the noise floor by 6dB
