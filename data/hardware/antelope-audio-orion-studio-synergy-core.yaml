description: "The Orion Studio Synergy Core Thunderbolt & USB audio interface
  with 12 preamps. DC-coupled analog outputs, real-time effects processing at
  low-latency."
details: |-
  A recording and production centerpiece. Orion Studio Synergy Core has already become a modern classic in the realm of top-tier studio equipment. With unmatched high-resolution sound, extended I/O, and an ever-evolving library of flawlessly modeled audio effects, it has everything the centerpiece of any recording or production-oriented modern-day studio needs.

  Sonic transparency: The 12 discrete preamps are among the signature features of the Orion Studio Synergy Core. Designed to remain transparent while authentically capturing any sound source, they provide the stunning 75 dB of gain with maximum noise reduction. The Orion Studio mic preamps excel at capturing the true character of vocals or any acoustic instrument. They shine the brightest, especially when paired with the Antelope Audio Edge modeling condenser microphones.

  Maximum analog potential: Control your CV-compatible synths and outboard gear with the Orion Studio DC-Coupled inputs and outputs. The Direct-In feature of all Orion Studio analog inputs allows you to bypass the preamp controls and directly record line-in signals without any coloration. Two analog inserts (applied to Preamp 1 and 2) allow you to connect analog outboard gear without any additional routing in the DAW or in the Control Panel.

  Explore 50+ legendary audio effects: Orion Studio grants you access to a massive library of audio effects, modelled after iconic, rare, and sought-after studio hardware. Crafted with meticulous precision and care, the effects are powered by our proprietary Synergy Core platform, which provides not only the authentic recreation of the real hardware but also offers massive processing power handled by the interface itself for a practically zero-latency performance.

  Immense analog & digital flexibility: Designed to become the centerpiece of pro studios of any size and purpose, there is no task the Orion Studio Synergy Core can't handle. Record high-impedance instruments and reamp DI tracks through the designated Reamp outputs. Use in specific multichannel setups or connect various outboard gear with the unit's 16 line outputs. Expand your I/O count through the digital S/PDIF and ADAT ports. Use the intuitive and flexible software Routing Matrix to direct all incoming and outgoing audio. An addition to the already advanced Orion Studio monitoring is the two headphone and monitor outs, which can be used simultaneously.

  Unbeatable depth: The flawless audio fidelity of Orion Studio Synergy Core is courtesy of our proprietary 64-bit Acoustically Focused Clocking jitter management algorithm. This signature Antelope Audio feature brings your production to the next level by allowing you to achieve the polished, organic, and artifact-free sound once a privilege only of the most prestigious studio facilities. Achieve unmatched sonic depth and detail thanks to the interface's best-in-class AD/DA converters with up to 130dB dynamic range.

  Immersive monitoring, Atmos ready: Orion Studio Synergy Core supports immersive monitoring across 23+ formats, from stereo to Dolby Atmos 9.1.6. With precise speaker and room calibration, intuitive controls, and instant preset recall, it keeps your workflow fast and accurate. The functionality is optionally available through a separate upgrade license for the Orion Studio Synergy Core, or with every MRC purchase including a free add-on license code.
