details: |-
  The 7382A SAM Studio Subwoofer is Genelec's most powerful subwoofer to date, combining tremendous low frequency output with exceptional clarity, precise bass articulation, and the flexible calibration and bass management of the Smart Active Monitoring (SAM) family. Designed for the most demanding professional applications, it is engineered to deliver reference-grade performance at the lowest octaves where lesser subwoofers struggle to remain composed.

  With a frequency response extending down to 15 Hz and a maximum short-term SPL of 129 dB (peak ≥133 dB), the 7382A is built for recording studios, film mixing facilities, mastering suites, post-production houses, EDM playback environments, and premium home theatres where headroom, accuracy, and low distortion are non-negotiable. Three 381 mm (15 inch) cone drivers are powered by a 2500 W Class D amplifier housed in a reflex-ported enclosure, producing high SPL with very low harmonic distortion (≤1% from 30-85 Hz, 2nd harmonic) and an extremely low self-generated noise floor of ≤5 dB SPL.

  As a member of the Smart Active Monitoring family, the 7382A integrates with Genelec's GLM (Genelec Loudspeaker Manager) software for configuration, calibration, and ongoing control. GLM handles bass management for stereo and immersive systems, resolves the placement compromises imposed by real-world rooms, and enables the construction of carefully phase-aligned subwoofer arrays. Daisy-chained over the GLM control network, multiple 7382A units can be combined to produce uniform low-frequency coverage across large mix and dub stages.

  The 7382A's I/O is comprehensive: three balanced analog XLR inputs plus a dedicated LFE input, two analog XLR outputs, AES/EBU digital input and thru, and dual RJ45 ports for the GLM control network. Together with Intelligent Signal Sensing (ISS) power management, optimized amplifier protection circuitry, and integrated bass management, the result is a subwoofer engineered to anchor the largest immersive and multichannel systems while still translating mixes accurately at any reference level.
specs: |-
  - Frequency response: 15 Hz - 100 Hz (-6 dB)
  - Maximum short-term SPL: 129 dB
  - Maximum peak SPL: ≥133 dB
  - Self-generated noise: ≤5 dB SPL (A-weighted at 1 m)
  - Harmonic distortion: ≤1% (30-85 Hz, 2nd harmonic)
  - Amplifier: 2500 W Class D (bass)
  - Drivers: 3 x 381 mm (15 in) cone
  - Enclosure: Reflex port
  - Analog inputs: 3 x XLR female balanced (10 kOhm) + 1 x LFE XLR
  - Analog outputs: 2 x XLR male
  - Digital input: 1 x XLR AES/EBU (110 Ohm)
  - Digital output/thru: 1 x XLR AES/EBU (110 Ohm)
  - Control network: 2 x RJ45 (CAT5) for GLM
  - Dimensions: H 625 x W 1400 x D 558 mm
  - Weight: 145 kg (319.7 lb)
  - Mains voltage: 100-120 VAC / 220-230 VAC, 50/60 Hz
  - Power consumption (ISS active): 13 W
  - Power consumption (idle): 22 W
  - Power consumption (full output): 1500 W
