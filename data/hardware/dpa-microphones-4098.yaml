details: |-
  A complete, supercardioid tabletop microphone solution, which is ideal for either permanently affixing to or temporarily placed on a table in conference venues, meeting rooms and board rooms. This mic ensures maximum speech intelligibility regardless of the acoustical environment. With a linear response, low distortion and an extremely large dynamic range, it sounds great in any environment.

  Available in different solutions: Tabletop (gear needed to either permanently affix or temporarily place the mic on a table) and Ceiling (gear needed for permanently mounting the mic from the ceiling). Available with different terminations.

