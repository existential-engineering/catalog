description: Affectionately nicknamed 'the Bluesbreaker', the 1962 was launched in the 1960s when electric guitarists were smashing through musical boundaries. This reissue is an iconic 30W combo, expertly manufactured at Marshall's Bletchley, England facility, that delivers legendary deep blues tones through two Celestion Greenback (G12M-25) speakers. Equipped with a valve tremolo effect (controllable via the included footswitch), a three-band EQ shared between two channels and modern 6L6 power valves, the 1962 'Bluesbreaker' combines timeless Marshall design details with the durability and consistency of modern components.
details: |-
  Add soul to your sound with classic '60s-inspired deep blues tones. This two-voice combo is powered by two 5881 tubes.

  With two Celestion Greenback speakers and tremolo effect, it is designed for those who want to plug and play.

  The front panel carries a shared three-band EQ with presence, a volume control per channel and speed and intensity controls for the valve tremolo, which is switched in and out from the included footswitch.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Built in Marshall's UK factory
  - All-valve
  - Celestion G12M-25 speakers
  - Two voices
  - Three band EQ
  - Tremolo effect controlled by a footswitch
  - Range: Vintage reissue
  - Channels: 2, bridgeable
  - Technology: Valve
  - Output wattage: 30W
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Inputs: 4 x 1/4" jack instrument inputs (high/low sensitivity)
  - Controls: VOLUME II, VOLUME I, TREBLE, MIDDLE, BASS, PRESENCE, TREMOLO INTENSITY, TREMOLO SPEED
  - Effects: Valve tremolo
  - Effects loop: No
  - Speaker configuration: 2x12"
  - Speaker model: Celestion G12M-25 (16Ω, 25W)
  - Unit impedance: 8Ω
  - Preamp valves: 3 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x 5881
  - Rectifier valves: 1 x GZ34
  - Weight: 30.2 kg / 67 lb
  - Width: 740 mm / 29.1"
  - Height: 610 mm / 24"
  - Depth: 265 mm / 10.4"
  - Box contents: PEDL-90003 footswitch included, detachable power cable included
  - Country of origin: Designed and engineered in UK. Made in UK.
