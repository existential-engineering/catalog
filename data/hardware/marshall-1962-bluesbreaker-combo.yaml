description: Affectionately nicknamed 'the Bluesbreaker', the 1962 was launched
  in the 1960s when electric guitarists were smashing through musical
  boundaries. This reissue is an iconic 30W combo, expertly manufactured at
  Marshall's Bletchley, England facility, that delivers legendary deep blues
  tones through two Celestion Greenback (G12M-25) speakers. Equipped with a
  valve tremolo effect (controllable via the included footswitch), a three-band
  EQ shared between two channels and modern 6L6 power valves, the 1962
  'Bluesbreaker' combines timeless Marshall design details with the durability
  and consistency of modern components.
details: |-
  1962

  Bluesbreaker

  Vintage Reissue

  Valve

  Combo

  2 (with shared EQ controls)

  Designed, engineered and made in UK (Bletchley, England)

  Detachable mains (power) lead, footswitch
specs: |-
  - Output Wattage: 30W
  - Channels: 2 (with shared EQ controls)
  - Controls: VOLUME I, VOLUME II, TREBLE, MIDDLE, BASS, PRESENCE, TREMOLO SPEED, TREMOLO INTENSITY, POWER, STANDBY
  - Equalisation: Treble, middle, bass and presence
  - Inputs: 4 x 1/4" jack instrument inputs (2 per channel: high/low sensitivity)
  - Outputs: 2 x 1/4" jack speaker outputs (selectable 16Ω / 8Ω / 4Ω load)
  - Effects: Valve 'tremolo' with speed and intensity controls (channel 2 only)
  - Effects Loop: No
  - Footswitch: Yes, included (tremolo on/off)
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x 5881
  - Rectifier Valves: 1 x GZ34
  - Speaker Config: 2 x 12"
  - Speaker Model: Celestion G12M-25 Greenback (25W, 16Ω)
  - Width: 740 mm / 29.1"
  - Height: 610 mm / 24.0"
  - Depth: 265 mm / 10.4"
  - Weight: 30.2 kg / 66.6 lb
