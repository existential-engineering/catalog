description: The MS-2 is Marshall's pocket-sized 1W micro stack — a tiny
  battery-powered practice amp styled as a miniature half-stack (head sitting on
  a single cab) with a built-in 2-inch speaker. It's designed for playing on the
  go or quiet practice at home, with volume, tone and overdrive controls so the
  player can switch between a clean voice and a crunchy dirt sound from a single
  front panel. A belt clip on the back lets the amp hang off jeans or a strap
  for stand-up jamming away from a power outlet.
