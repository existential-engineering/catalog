description: The MS-2 is Marshall's pocket-sized 1W micro stack — a tiny
  battery-powered practice amp styled as a miniature half-stack (head sitting on
  a single cab) with a built-in 2-inch speaker. It's designed for playing on the
  go or quiet practice at home, with volume, tone and overdrive controls so the
  player can switch between a clean voice and a crunchy dirt sound from a single
  front panel. A belt clip on the back lets the amp hang off jeans or a strap
  for stand-up jamming away from a power outlet.
details: |-
  The MS-2 is a 1W micro stack that may be small but will deliver the true Marshall tone. Powered either by plugging into mains or by batteries, it is versatile enough to play on the move or practice in your bedroom.

  The MS-2 features volume, tone and overdrive controls, and is available in a variety of colours and styles: black, red, or classic dark grey. The two split channels are selected with the same switch that powers the amp, choosing either the clean 'On' voice or the 'Overdrive' voice.

  A single 2-inch speaker sits in the miniature cabinet, and a belt clip is included so the amp can be worn and played on the move. A 1/4-inch headphone output on the cabinet allows silent practice.

  Designed and engineered in UK. Made in Vietnam.
