description: Compact surround speaker for immersive audio applications
details: |-
  The MF15 is a compact surround speaker designed specifically for immersive audio work including music and post-production.

  It suits Dolby Atmos HE configurations such as 7.1.4 and 9.1.4 setups. As a passive speaker, it offers compact installation with a shallow enclosure that fits well in control rooms with limited ceiling height.

  The unit integrates with all M-series enclosures and MS subwoofers for bass management. Driver characteristics complement screen speakers for seamless sound movement in Atmos applications.

  Available in both vertical and horizontal formats with custom configurations upon request.
specs: |-
  - Type: 2-way passive surround
  - Frequency response: 60Hz – 20kHz
  - Maximum SPL at 1 metre: 114dB
  - Sensitivity: 90dB/2.83v/1m
  - Impedance: 4 Ohms
  - Crossover frequency: 2000Hz
  - Total harmonic distortion: 1% at 90dB
  - High frequency driver: 28mm soft-dome
  - Low frequency driver: 24cm MSP
  - Recommended amplifier power: 100-500 watts
  - Amplifier recommendation: Dynaudio Acoustics DA20 4-channel
  - Cabinet dimensions (H x W x D): 452 x 320 x 204mm
  - Weight: 10 kg
  - Finish: Black textured paint
  - Fixing: 4x M8 threaded inserts in the back
  - Optional: Hardwood cabinet (oak, cherry, walnut, maple)
  - Custom cabinet sizes: On request
