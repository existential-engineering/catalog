details: |-
  For full-throttle Nashville class, the G6620T Players Edition Nashville Center Block Double-Cut with String-Thru Bigsby nails it with the time-honored Gretsch model's classic style.

  Premium features include a beautiful maple top, body and headstock with a chambered spruce center block that enhances body resonance for more organic tone and comfortably lighter weight.

  Two High Sensitive Filter'Tron pickups deliver authentic Gretsch power and articulation, with a classic Round-Up Orange finish, tortoise pickguard with Gretsch logo, ebony fingerboard, nickel hardware and the classic Gretsch horseshoe headstock inlay.
