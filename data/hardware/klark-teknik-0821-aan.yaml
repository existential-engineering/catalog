description: The DN360-P2H delivers the same Proportional-Q dual 30-band, 1/3
  octave analogue graphic equalisation as the standard DN360, configured for pin
  2 hot XLR wiring. The 3U rackmount unit is built for the touring environment
  and remains in service in racks worldwide.
details: |-
  The pin 2 hot XLR wiring of this variant matches the international convention standard in North American, European and most international audio installations, while the signal path is that of the standard DN360.

  The Proportional-Q characteristic is what made the DN360 platform the reference for live sound engineers: wide, musical filters at modest cuts and boosts narrowing to surgical precision as fader travel increases, allowing feedback control and room correction without the audible signature of constant-Q designs.

  An 18 dB/octave low-cut filter per channel removes subsonic content that would otherwise waste amplifier headroom.

  The 3U rackmount chassis is built for the touring environment, with 30 mm oil-damped precision faders with centre detents, channel bypass switches, graphic EQ scale selection and power-off bypass relays.

  The DN360-P2H is obsolete but remains in active service in countless racks worldwide, with service support continuing through Music Tribe Care.
specs: |-
  - Dual channel, 30 band 1/3 octave graphic equalisation per channel
  - Proportional-Q filter response
  - Low-cut filter: 18 dB/octave, one per channel
  - 30 mm oil-damped precision faders with centre detents
  - Channel bypass switches and graphic EQ scale selection
  - Power-off bypass relays
  - XLR connectors wired pin 2 hot
  - 3U rackmount chassis
