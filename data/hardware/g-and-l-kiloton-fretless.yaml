description: A fretless version of the Tribute Series Kiloton, built on what the
  maker calls the most comfortable bass body Leo Fender ever created and powered
  by a single G&L Magnetic Field Design humbucker.
details: |-
  The verdict became clear so fast it would have put that wry grin on Leo's face: the Made-in-Fullerton Kiloton is a smash-hit. Demand from players and musicians alike for a Fretless Tribute Series version thundered with the same visceral punch as the bass itself delivers. And the moment of impact is now: meet the new Fretless G&L Tribute Series Kiloton.

  Just like its Made-in-Fullerton brother, the Tribute Series Fretless Kiloton features the most comfortable bass body ever created by Leo Fender. It's compact and pure, with every curve and contour perfectly executed. The Tribute Series Kiloton delivers maximum firepower from its single G&L Magnetic Field Design humbucker, planted right in the sweet spot specified by Leo Fender back when the G&L factory was still called CLF Research.

  The Tribute Series Fretless Kiloton's single Made-in-Fullerton MFD 'bucker fires without the aid of a preamp, while a 3-position series/split/parallel toggle harnesses the coils' power. Simple volume and tone controls are devastatingly effective, revealing a wide range of textures Leo's MFD bucker is famous for. What's more, the Tribute Series Kiloton is armed with a Leo Fender-designed Saddle-Lock bridge to transfer all the energy right into the body end-grain for an incredibly resonant instrument.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: Leo Fender-designed G&L MFD Magnetic Field Design humbucker
  - Body wood: Poplar with Swamp Ash Top
  - Neck wood: Hard-Rock Maple with Fretless Lined Rosewood fingerboard
  - Neck width at nut: 1 1/2"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: N/A
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: 3-way series/split/parallel mini toggle, volume, tone
  - Available in: 3-Tone Sunburst over Swamp Ash top on Poplar, tortoise pickguard, Lined Fretless Rosewood fingerboard
