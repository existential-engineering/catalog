description: "Experience fantastic analog sound combined with razor-sharp digital accuracy and control. For studio sessions, bursts of inspiration, and heartfelt performances: the Analog Four MKII brings together the best of both worlds. The sound of worlds colliding."
details: |-
  Organic, steely, warm, cold, chaotic, precise, and all the shades in between. Mold unique analog basses, leads, drums, and whatever other sounds that can be dreamt up. Program them with precision, or design and redesign as you go. Sounds as vast as the most infinite of palettes.

  Four synth tracks and an FX track, each with an intuitive step-sequencer, let you easily create and layer melodies. Play back your composition and immediately reshape it. Change notes, alter sounds, add effects. Add vibrant chorus, reverb, and delay at your leisure. Each synth track offers loads of sound crafting and modulation options: two multi-waveform oscillators with one versatile sub-oscillator each, oscillator sync options, amplitude modulation, pulse-width modulation, spectral noise and vibrato, a ladder filter and a resonant multimode filter, plus two envelopes and two LFOs per track.

  Not only a splendid synthesizer, the Analog Four MKII can also make other gear sing. In addition to letting the sequencer tracks of your choice send MIDI out to external instruments, CV/Gate sequencing and DIN sync outputs let you control other analog gear. The individual audio outputs for each voice ensure this instrument fits just as snugly in a vintage analog studio recording session as in a modern digital one.

  Use the four voices monophonically or polyphonically with several routing options. From the mini-keyboard for quickly sketching musical ideas to the one-handed operation of pattern or sound changes, playability is always in focus. Control all lets you warp your parameters at the same time, across all tracks, and ten performance macros are ready to kick in simultaneously at the tweak of a knob.

  The full-featured step sequencer lets you control both structure and sound. Simply press a step and tweak any parameter onto it for ultra-fast and detailed sequencing. Add controlled randomness and logic with trig conditions, then create a full-blown composition from your patterns using song mode. The Euclidean Sequencer brings a new sense of motion to your patterns, courtesy of two Euclidean generators that algorithmically distribute trig-like pulses across a sequence.
specs: |-
  - Fully analog signal path, 4 synth voices
  - 2 analog oscillators per voice with variable waveshape, AM and sync modes
  - 2 sub-oscillators and 1 noise generator per voice
  - 1 4-pole analog lowpass ladder filter and 1 2-pole analog multi-mode filter per voice
  - 1 analog overdrive circuit with filter feedback per voice
  - 2 assignable LFOs, 1 dedicated vibrato LFO, 2 dedicated waveshape LFOs per voice
  - Amp envelope, 2 assignable envelopes, LFO fade, noise fade, vibrato and autobend envelopes
  - 3 individual send effects per voice
  - Up to 4 notes of polyphony, 4 part multitimbrality, 4 note unison playback
  - 128 projects, 4096 sounds (+Drive sound library), 128 kits and 128 patterns per project, 16 songs per project
  - Sequencer: 4 synth tracks, 1 FX track, 1 CV/Gate track, sequencer MIDI out
  - Up to 64 steps per pattern, individual length and scale per track
  - 6 arpeggiators, parameter locks, trig probability, micro timing, page loop
  - 1 Euclidean sequence generator per track
  - Send effects: chorus, delay, reverb
  - 128 x 64 pixel OLED screen
  - MIDI In/Out/Thru with DIN Sync out
  - 2 x 1/4" impedance balanced main audio out jacks
  - 4 x 1/4" separate stereo voice output jacks
  - 2 x 1/4" audio in jacks
  - 1 x 1/4" stereo headphone jack
  - 4 x 1/4" CV/Gate outputs
  - 2 x 1/4" CV/Expression inputs
  - 48 kHz, 24-bit D/A and A/D converters
  - USB 2.0 Hi-Speed port
  - Headphones out level: +19 dBu (55 ohm), main outputs level: +19 dBu
  - Output impedance: 440 ohm unbalanced, audio input impedance: 9 kohm
  - CV/Expression input voltage on tip: -5 V to +5 V, supplies +5 V on ring
  - CV output voltage range: -10 V to +10 V
  - Digital S/N ratio: 102 dBFS (20 to 20000 Hz)
  - Unit power consumption: 15 W typical, 20 W maximum
  - Recommended power supply: 12 V DC, 2 A
  - Aluminum enclosure, W385 x D225 x H82 mm (15.2 x 8.85 x 3.3")
  - Weight: approximately 2.4 kg (5.3 lbs)
  - Overbridge enabled, class-compliant USB audio
  - 3 year Elektron warranty
