description: >-
  Experience fantastic analog sound combined with razor-sharp digital accuracy
  and control. For studio sessions, bursts of inspiration, and heartfelt
  performances: the Analog Four MKII brings together the best of both worlds.
details: |-
  The Analog Four MKII is a four-voice polyphonic analog synthesizer that combines a fully analog signal path with digital precision and control. Each voice features dual analog oscillators with variable waveshapes, oscillator AM and sync modes, two sub-oscillators, and a noise generator, routed through a 4-pole analog lowpass ladder filter and a multimode 2-pole filter with analog overdrive and filter feedback.

  Modulation capabilities are extensive, with two assignable LFOs, dedicated vibrato and waveshape envelopes, two assignable envelopes plus an amp envelope per voice. Three individual send effects per voice route into chorus, delay, and reverb processors, enabling rich sound design directly on the hardware.

  The built-in step sequencer provides 4 synth tracks, an FX track, and a dedicated CV/Gate track with up to 64 steps per pattern. Advanced sequencing features include parameter locks, trig conditions with probability and conditional logic, six arpeggiators, swing, slide, and accent controls.

  The Analog Four MKII supports up to 4-note polyphony and 4-part multitimbral operation, with storage for 128 projects and 4096 sounds. Overbridge integration enables tight DAW connectivity with class-compliant USB audio, while 4 CV/Gate outputs and 2 CV/Expression inputs allow control of external modular gear.
specs: |-
  - 4-voice polyphonic analog synthesizer
  - Fully analog signal path with digital control
  - 2 analog oscillators per voice with variable waveshape, AM, and sync
  - 2 sub-oscillators and 1 noise generator per voice
  - 4-pole analog lowpass ladder filter per voice
  - Multimode 2-pole resonant filter per voice
  - Analog overdrive circuit with filter feedback
  - 2 assignable LFOs, 2 assignable envelopes, plus amp envelope per voice
  - 3 individual send effects per voice (chorus, delay, reverb)
  - Step sequencer: 4 synth tracks, 1 FX track, 1 CV/Gate track
  - Up to 64 steps per pattern
  - Parameter locks, trig conditions, 6 arpeggiators
  - 128 projects, 4096 sounds per project
  - 4 CV/Gate outputs, 2 CV/Expression inputs
  - Class-compliant USB 2.0 Hi-Speed audio
  - Overbridge enabled for DAW integration
  - 48 kHz, 24-bit D/A and A/D converters
  - 128 x 64 pixel OLED display
  - Aluminum enclosure: 385 x 225 x 82 mm, ~2.4 kg
