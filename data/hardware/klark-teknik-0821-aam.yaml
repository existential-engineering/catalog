description: The DN360 is a dual 30-band, 1/3 octave analogue graphic equaliser
  delivering two independent channels of the Klark Teknik Proportional-Q
  response. The 3U rackmount DN-series unit became a reference standard in
  touring sound racks, broadcast control rooms and fixed installations where
  transparent, precise frequency control was required.
details: |-
  For decades the DN-series 1/3 octave graphic equaliser was the reference standard in touring sound racks, broadcast control rooms and fixed installations where transparent, surgically precise frequency control was non-negotiable. The DN360 delivers two independent 30-band channels of the Proportional-Q response.

  Proportional-Q equalisation behaves differently from constant-Q designs. At small cuts and boosts the filters are wide and musical, and as fader travel increases the Q narrows, providing the precision engineers need for feedback control and room correction without the audible artefacts of conventional graphics.

  An 18 dB/octave low-cut filter per channel removes unwanted subsonic content before it consumes amplifier headroom.

  Construction reflects four decades of live-sound abuse-testing: 30 mm oil-damped precision faders with centre detents, channel bypass switches, graphic EQ scale selection, and power-off bypass relays that route audio through even when the unit is unpowered. The 3U rackmount chassis with industry-standard XLR connectors wired pin 3 hot was engineered for the road.

  Although now obsolete, the DN360 remains the analogue benchmark against which graphic equalisers are still measured.
specs: |-
  - Dual channel, 30 band 1/3 octave graphic equalisation per channel
  - Proportional-Q filter response
  - Low-cut filter: 18 dB/octave, one per channel
  - 30 mm oil-damped precision faders with centre detents
  - Channel bypass switches and graphic EQ scale selection
  - Power-off bypass relays
  - XLR connectors wired pin 3 hot
  - 3U rackmount chassis
