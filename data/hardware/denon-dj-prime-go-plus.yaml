description: Rechargeable Battery-powered, Standalone DJ System with Wi-Fi Streaming
details: |-
  The Denon DJ Prime GO+ is a battery-powered, standalone 2-deck DJ system with a 7" multi-gesture HD touchscreen and built-in Wi-Fi for music streaming. Building on the original PRIME GO, the Plus model adds an expanded FX suite (26 Main FX, 2 knob-controlled Sweep FX, and 10 interactive Touch FX), four dual-layer performance pads per deck (Hot Cue, Loop, Roll, Sampler), a loop/beat-jump encoder per deck, touch-capacitive jog wheels, an embedded sampler, and a roughly 25% improvement in internal battery runtime. It supports streaming from Apple Music, Amazon Music Unlimited, TIDAL, Beatport, Beatsource, SoundCloud GO+, and Dropbox, and integrates with Engine Lighting (Philips Hue, Nanoleaf, DMX). The unit is also compatible with Serato DJ and Virtual DJ when used as a controller, and receives over-the-air firmware updates over Wi-Fi.
specs: |-
  - Frequency response: 20 Hz - 20 kHz (+/-1 dB)
  - Dynamic range: >109 dB (A-weighted)
  - Signal-to-noise ratio: >92 dB (A-weighted)
  - Channel separation: <-88 dB (1 kHz, unity)
  - T.H.D. (Aux): <0.01%
  - T.H.D. (Mic): <0.02%
  - Headphone output: <40 mW
  - Power consumption: 30W maximum
  - Power adapter: DC, Center Positive, 19V 3.42A
  - Display: 7" multi-gesture HD touchscreen with customizable views and Day Mode
  - Battery: rechargeable internal battery (approx. 25% improvement over original PRIME GO)
  - Dimensions: 411mm W x 274mm D x 53mm H (16.2" x 10.8" x 2.1")
  - Weight: 3.68 kg (8.11 lbs)
