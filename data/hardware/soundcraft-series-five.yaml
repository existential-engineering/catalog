details: |-
  Over 25 years of success in mixing console design and manufacture has given Soundcraft unique insight into the demands of leading audio professionals. Through the application of this experience, and having sought the opinions of top live sound engineers and designers, Soundcraft has arrived at what it strongly believes to be its best front of house console yet. Soundcraft set out to provide a great-sounding, fully-featured and affordable live sound console. The result is the Series FIVE.

  Available in frame sizes of 24 to 56 input channels, Series FIVE is ideally suited to a whole range of demanding applications from touring to theatre installation. Series FIVE’s comprehensive standard feature set includes LCR panning, aux master levels on 100mm faders, full-spec stereo modules and FX returns, plus flexible MIDI scene control. Despite the Series FIVE's high level of facilities, the console's layout is clear and reassuringly familiar. This has been achieved without compromising the audio quality. Key Features
