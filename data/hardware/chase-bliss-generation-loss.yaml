description: A limited-edition collaboration between Chase Bliss Audio and
  Cooper FX that brings together all aspects of tape degradation, combining
  random pitch fluctuations, bandwidth-limiting filters, sample rate reduction,
  and noise to mimic that sound without the need for a broken VHS player.
details: |-
  This is the sound of nostalgia. Chase Bliss Audio and Cooper FX teamed up to take everything about the original Cooper FX Generation Loss while making tweaks based on customer feedback and adding the additional control Chase Bliss is known for. Generation Loss refers to the decrease in sound quality and introduction of noise and sound artifacts each time a copy is made on magnetic media such as tape — random pitch fluctuations, filters to cut down on the signal's bandwidth, sample rate reduction, and noise are all brought together in this pedal to mimic that sound without the need for a broken VHS player.

  Wow controls the lower-frequency pitch fluctuations of tape playback for random vibrato and chorus sounds, while Flutter adds the relatively fast, random pitch fluctuations largely responsible for "that" tape sound. Gen controls the sample rate of the wet signal, becoming increasingly lower quality as it is turned counterclockwise, and the resonant HP and LP filter knobs narrow the signal's bandwidth from both ends. The Wet (Ramp) knob provides wet make-up gain — a new addition over the original pedal — or sets ramp time when dip switches are engaged for ramping.

  Three toggles shape the character further: AUX FUNC assigns the aux footswitch to max out Wow and Flutter (MOD), jump between Gen settings (GEN), or bypass the filters (FILTER); DRY mixes in none, a small amount, or unity dry signal; and HISS selects three levels of noise, from none to quite a bit, generated from a mixture of white noise and flutter distortion that can be sculpted with the filters.

  As a full Chase Bliss platform pedal, it offers two onboard presets, a bank of sixteen rear dip switches for ramping and modulation (bounce or ramp-and-hold) of the Wow, HP, Flutter, Gen, and LP parameters, expression pedal or 0-5V CV control over any of those parameters, MIDI via the Chase Bliss Midibox, and relay-based true bypass or optional click-less buffered bypass.

  The pedal was released as a one-time, limited-edition official collaboration sold direct through Reverb.com to keep the price affordable. The project grew out of the Dark World reverb, whose "mod" channel first implemented elements of the Generation Loss tone and introduced Chase Bliss founder Joel Korte to Cooper FX's Tom Majeski.
specs: |-
  - Wow and Flutter random pitch fluctuation controls
  - Gen knob for sample rate reduction of the wet signal
  - Resonant high-pass and low-pass filter knobs
  - Wet (Ramp) knob for wet make-up gain or ramp time
  - AUX FUNC toggle (MOD / GEN / FILTER) assigns the aux footswitch
  - Dry toggle (None / Small / Unity) with internal trim pot
  - Hiss toggle with three noise levels (None / Mild / Heavy)
  - 2 presets recalled via lower toggle
  - Internal modulation via ramping (16 rear dip switches)
  - Expression pedal or 0-5V CV control
  - MIDI via Chase Bliss Midibox (1/4-inch TRS)
  - Bypass and AUX foot switches, latching or momentary via dip switch
  - True bypass (relay) or selectable buffered bypass
  - Mono 1/4-inch in/out
  - Input impedance 1M, output impedance less than 1k
  - Power: 9V DC center negative, 2.1mm barrel, ~150mA (200mA+ supply required)
