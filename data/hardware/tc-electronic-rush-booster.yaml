description: Ultra-Transparent Clean Boost with Powerful 20 dB Gain
details: |-
  RUSH BOOSTER cuts through the clutter and puts you at centerstage with just a single tap of your toe. The all-analog circuit serves up a whopping 20 dB of super-transparent clean boost, perfect for solos and in-your-face rhythm. All of this magic is housed in a built-to-last enclosure with True Bypass, and a price point so low – it’s sure to evoke a tonal adrenaline rush!

  Many of our competitors’ booster pedals really do a number on your tone, making all that beautiful sound you spent years developing just vanish! RUSH BOOSTER is a true tonal team player, taking your already awesome performance and making it louder, with all the punch and power your soul cries out for. Just louder – now isn’t that all you want from a booster pedal?

  Don’t let the simple appearance and diminutive size of RUSH BOOSTER fool you – it’s extremely-versatile and capable of elevating you well above the crowd. The discrete analog circuit provides up to 20 dB (that’s a lot) of power boost, which is more than enough to really raise the roof! RUSH BOOSTER’s versatility is determined by where you place it in the signal chain; before your drive pedals for extra gain, or at the end for a mild solo boost. You might even want to get two – for the best of both worlds!

  A sturdy metal chassis with dedicated Input, Output and True Bypass means that RUSH BOOSTER is equally roadworthy and pedalboard friendly. You can power it with a 9V battery, or use our convenient POWERPLUG 9V adapter.

  RUSH BOOSTER sports just one knob – Volume (Isn’t that all that really matters?), and one switch for on or Bypass. Nothing is easier!Check out RUSH BOOSTER at your local TC ELECTRONIC dealer today, or get yours online – and turn it up to eleven!
