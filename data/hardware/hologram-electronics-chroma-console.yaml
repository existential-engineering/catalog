details: |-
  Chroma Console is a flexible multi-effect pedal that draws inspiration from vintage recording technology, combining eccentric and gritty sounds with contemporary innovations. The pedal offers an intuitive user interface that enables wide-ranging sonic experimentation, allowing musicians to easily re-order effects and create unique signal chains. Users can process effects in creative combinations, such as running reverb through fuzz or a reverse delay into a pitch shifter.

  The pedal features a diverse range of effects including overdrive, compression, fuzz, modulation, and time-based effects. Unique modules like gesture allow for dynamic knob movement recording, while capture enables creating ephemeral loops up to 30 seconds long. Effects include vintage-inspired sounds like tape echo, vibrato, phaser, and innovative textures like granular delays and pitch-shifting with lo-fi character.

  Chroma Console offers advanced routing and control capabilities with highly-configurable MIDI implementation over din and USB-c. Musicians can save and recall 80 user presets, customize bypass foot switch configurations, and map expression controls to primary knob functions. The pedal supports stereo signal processing and can create a lively stereo image from mono signals, providing extensive sound design flexibility.

  The effect modules include unique sound-shaping tools like a multi-mode filter with low-pass, high-pass, and tilt options, a heavy-handed compressor, and creative effects like cassette (tape degradation) and interference (audio glitch simulations). These modules allow musicians to add nostalgic warble, randomness, and experimental textures to their sound.

  Designed for both instrument and line-level sources, Chroma Console provides sophisticated input level calibration and true bypass switching. The pedal's tap tempo feature can sync time-based and modulation effects, offering musicians precise control over their sonic landscape and enabling complex, evolving soundscapes.
