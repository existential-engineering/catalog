description: The dbx DriveRack 4800 is a flagship 4-in/8-out loudspeaker
  management processor operating at 96 kHz with analog and AES/EBU digital I/O,
  32-bit floating-point DSP, and comprehensive per-channel EQ, dynamics,
  feedback suppression, and crossover processing. HiQnet Ethernet networking and
  an optional Jensen transformer I/O option make it a flexible hub for major
  touring and installed sound systems.
details: |-
  The dbx DriveRack 4800 is designed to provide incredible flexibility, sonic excellence, and intuitive control for performance applications. Operating at 96 kHz with 24-bit conversion and 32-bit floating-point internal processing, it delivers four inputs and eight outputs in both analog (XLR) and digital (AES/EBU) formats — all transformer-isolated on the digital side.

  Per-input processing includes a 31-band graphic EQ, switchable 31/9-band parametric EQ, up to 682 ms of delay, and two selectable DSP insert blocks (noise gate, compressor, AGC, de-esser, sub-harmonic synthesizer, or advanced feedback suppression). Each of the eight outputs features a 6-band parametric EQ, up to 1365 ms of delay, and two selectable inserts (noise gate, AutoWarmth, compressor, AGC, peak limiter, sub-harmonic, or AFS). A 4-input mixer is available at each output, and 21 crossover configurations from 1×1 to 4×8 support virtually any speaker system topology.

  Control is via HiQnet Ethernet networking, RS-232, and optional dbx ZC wall panel controllers. A color QVGA display and menu-driven interface provide a clear front-panel setup path. Optional Jensen transformer I/O is available for environments requiring galvanic isolation. The system received THX certification (with the 4820 model) for cinema sound applications.
specs: |-
  - Analog Inputs: 4 channels; female XLR, electronically balanced, RF filtered; >50 kΩ
  - Max Input Level: Selectable: +28 to +14 dBu
  - CMRR: >40 dB typical; >55 dB @ 1 kHz
  - Digital Inputs: 4 AES/EBU channels; female XLR; transformer-isolated
  - Analog Outputs: 8 channels; male XLR; 30 Ω impedance
  - Max Output Level: Selectable: +24 to +4 dBu
  - Digital Outputs: 8 AES/EBU channels; male XLR; transformer-isolated
  - RTA Mic Input: 1× female XLR; 10–50 dB gain (10 dB steps)
  - Sample Rate: 96 kHz
  - Word Length: 24-bit
  - Internal Processing: 32-bit floating point
  - A/D Dynamic Range: >114 dB unweighted; 116 dB A-weighted
  - D/A Dynamic Range: 112 dB unweighted; 115 dB A-weighted
  - THD+Noise: 0.004% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 40 kHz, ±0.5 dB
  - Crosstalk: <-85 dB at 1 kHz
  - Input Delay: Up to 682 ms
  - Output Delay: Up to 1365 ms (shared)
  - Crossover Configurations: 21 configurations (1×1 through 4×8)
  - Dimensions: 3.5" H × 19" W × 12.15" D
  - Weight: 11 lbs
  - Power: 100–240 V, 50/60 Hz, 45 W
