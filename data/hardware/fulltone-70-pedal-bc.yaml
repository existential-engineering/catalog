description: A fuzz pedal with two intentionally mismatched silicon transistors
  for harmonically rich, aggressive tone housed in a steel enclosure, featuring
  a Mid control for extra clarity and cut.
details: |-
  Ever played an original FuzzFace from around 1970? (HINT: Not AT ALL the same sound as ones with the same namesake being mass-produced currently.) Ours has two intentionally mismatched (for harmonic content) silicon transistors that snarl and spit... not for the meek! If you put the "Fuzz" on 10 you will rip, and you might get all sorts of oscillation and weirdness... but that's Rock. Don't try using it with a wah wah... you can't, and neither could Jimi, without it screaming and howling. You want polite and quiet? Go elsewhere. You want art in a box? Come on in. Housed in a 16 gauge steel box and powder coated deep blue, this pedal is a bit unruly but with some warmth... ideal for older 4 input Marshall amps, it has much more FUZZ than the '69 Pedal and includes a Mid control for extra clarity and cut. I got my hands on Eric Johnson's Blue Fuzzface that he used from Tones through Ah Via Musicom period (now owned by Ian Moore) and incorporated a few of its tonal secrets into the '70 pedal with staggering sonic results!
