url: https://www.ericasynths.lv/black-stereo-mixer-v2-52/
description: Erica Synths Black Stereo Mixer is just what you need if your setup
  has several of the nowadays more and more popular modules with stereo inputs
  or outputs like Black Hole DSP, Erica Fusion Delay, MI Clouds or others.
details: |-
  The Black Stereo Mixer suits a setup with several modules carrying stereo inputs or outputs, such as the Black Hole DSP, the Erica Synths Fusion Delay or MI Clouds. To save rack space, Erica Synths designed a compact mixer with a lot of performance oriented features.

  Three stereo inputs offer simultaneous volume adjustment on both channels, one mono input has CV stereo panning, and two of the inputs can merge their left and right channels. IN1 and IN2 take a selectable +6dB boost, left and right outputs leave the panel, and signal level LEDs show what is passing through.

  The Black Pre-fade Listen Expander is a satellite module to the Black Stereo Mixer and adds monitoring before the mixer level knob takes effect.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  Input signals are accepted up to 20Vptp, pan CV up to 20Vptp, mixer gain is 1, and the module occupies 10HP at a depth of 25mm.
specs: |-
  - 3x stereo inputs with simultaneous volume adjustment on both channels
  - 1 mono input with CV stereo panning
  - 2 inputs with L and R channel merge feature
  - Selectable +6dB boost for IN1 and IN2
  - L and R outputs
  - Signal level LEDs
  - Input signal up to 20Vptp
  - Pan CV 20Vptp
  - Mixer gain 1
  - Power consumption +25mA, -15mA
  - Module width 10HP
  - Module depth 25mm
