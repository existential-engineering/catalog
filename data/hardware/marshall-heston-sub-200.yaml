description: Wireless subwoofer with Bluetooth LE-audio.
details: |-
  Enjoy power and precision that provides the perfect extension to your soundbar's performance. Designed to fit seamlessly into your home, the Heston Sub 200 subwoofer delivers next-level bass wherever it stands, without taking up space. Get straight to the sound thanks to wireless pairing with Marshall's TV soundbars. Designed and engineered in Sweden. Made in China.

  Deep bass: feel the rumble that moves you. This subwoofer delivers a powerful and precise bass performance that transforms movie night into a main stage experience.

  Wireless connection: enjoy a bigger, bolder home audio experience powered by the latest Bluetooth LE Audio wireless technology. It pairs with the Marshall soundbar range over Bluetooth LE Audio.

  Versatile placement: proudly place this subwoofer where it sounds best and let depth, impact and audio authority take over. Heston Sub 200 offers a different level of bass performance. Wherever you move it in the room, you will still feel the shake.

  Marshall app: easily control the subwoofer's performance with the Marshall app. Instantly pair and start fine-tuning your sound, including crossover frequency and phase inversion, whether the Heston Sub 200 is connected wirelessly or by cable.
specs: |-
  - Frequency range: 30 - 150 Hz
  - Maximum sound pressure level: 99 dB
  - Cabinet principle: ported
  - Power amplifiers: 2 x 120 W class-D
  - Total audio power output: 236 W (peak)
  - Subwoofers: 2 x 5.25 inch
  - Wireless connectivity: Bluetooth 5.3 LE audio
  - Wired connectivity: SUB IN (RCA mono)
  - Controls: setup button, volume knob
  - Codecs: LC3
