details: |-
  The Legend 5 Classic Alex Webster is a brutal take on the the coveted Spector NS body, complete with Alex's signature Blood Drip finish. The extremely comfortable curved body is crafted from solid maple for a bright and responsive tone. The 3-piece bolt-on maple neck runs features a 24 fret pau ferro fingerboard. A pair of EMG humbuckers are complemented by EMG's active BTS System for a powerful and aggressive sound, perfect for cutting through a dense mix. Alex's Legend bass is also outfitted with professional quality die-cast hardware to provide rock-solid intonation show after show. If you're looking to make a statement with your playing, might as well start with your bass.
specs: |-
  - Powered by an onboard battery for the active electronics, no external power connector
