description: A 5-way active buffered multiple Eurorack module that duplicates an
  input signal to five outputs without significant voltage loss, suitable for
  both control voltages and audio.
details: |-
  An updated version of the AM5 buffered mult module - functionally the same as its predecessors but now quite a bit cheaper. As one of my 'high turnover' modules (ie. I sell a lot of 'em) the bulk of the assembly is now handled by the board fabricators with the final assembly and testing taking place 'in house'. There are several advantages to this: first, I can take advantage of the fact that parts from the fabricator are very cheap (economies of scale etc.) and second, I spend far less time faffing around with surface-mount components, leaving me to do final fitting of any through-hole parts plus any testing. Exactly what it says on the tin: a 5-way buffered multiple in 2HP

  Inputs are resistively coupled, so this module can be used for both control voltages and audio signals. If you're planning to distribute a control voltage amongst a number of modules then this is the module you need - since it's active (ie. powered), voltage losses are kept to a minimum. Also available as a partial build. Power is provided via a JST-to-Eurorack adapter, which is included with the module. WHAT DOES IT DO? A mult (multiple) will duplicate a signal - whatever is presented at the input will be duplicated, unmodified, at each of the outputs. Thus, you can use it to send a signal to multiple modules simultaneously. Mults can be active or passive - passive mults do not require any power, but there's a chance of a small voltage drop between the input and outputs. For this reason, if you're planning to route a control voltage to a VCO, or similar module which is sensitive to input voltages, an active mult is preferable.
