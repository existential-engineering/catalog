prices:
  - amount: 1899.99
    currency: USD
description: The JVM210 Head offers versatility and power in equal measure. It's
  a formidable force whether you enjoy cleans, breakup or distortion. At 100W,
  this amp effortlessly handles the demands of playing the biggest shows whilst
  still boasting a versatile sound palette that'll let your personality shine
  through. Two independent channels (Clean and OD), each with three selectable
  modes and dedicated volume, gain, and EQ controls, deliver six distinct
  voicings driven by an all-valve preamp (ECC83) and EL34 power section. Built
  in Marshall's UK factory.
details: |-
  - All-valve construction
  - Two channels (Clean and OD), each with three modes (six total voicings)
  - Clean channel modes: Clean 1, Clean 2, Crunch 1
  - OD channel modes: Crunch 2, Crunch 3, OD
  - Digital reverb (independent level per channel)
  - Two effects loops (1 x series/parallel, 1 x series)
  - Selectable speaker output loads: 16Ω / 8Ω / 4Ω
  - Emulated XLR line out
  - MIDI In and Thru (programmable footswitch + MIDI control)
  - Six-button programmable footswitch (PEDL-91006) included
  - Built in Marshall's UK factory
specs: |-
  - Output Wattage: 100W
  - Channels: 2 (Multi)
  - Technology: Valve
  - Preamp Valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 4 x EL34
  - Effects: Digital reverb
  - Effects Loop: 2, 1 x series parallel, 1 x series
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Product Height: 310 mm / 12.2"
  - Product Width: 740 mm / 29.1"
  - Product Depth: 215 mm / 8.5"
  - Weight: 22 kg / 49 LB
  - Color: Black
  - Box Contents: PEDL-91006 included; Detachable power cable included; Speaker cable included
  - Origin Country: Designed and engineered in UK. Made in UK
