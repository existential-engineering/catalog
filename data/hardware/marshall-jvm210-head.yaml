details: |-
  The JVM210 Head offers versatility and power in equal measure. It is a formidable force whether you enjoy cleans, breakup or distortion.

  At 100W, this amp effortlessly handles the demands of playing the biggest shows whilst still boasting a versatile sound palette that will let your personality shine through.

  The JVM210 Head brings you to the front of the stage. With one master volume for each channel, you can create explosive solo moments that will be impossible to ignore.

  Step out of your comfort zone with built-in reverb controls. Recall your mode, master and reverb options with the programmable footswitch, which is included, giving you power and flexibility exactly when and where you need it.

  The meticulous craftsmanship of the JVM210 Head at our UK factory is proof of our dedication to quality. From loading the circuit boards to achieving the iconic black, white and gold finish, every amplifier in this series is carefully hand-assembled. Designed and engineered in UK. Made in UK.
specs: |-
  - Built in our UK factory
  - All-valve
  - Store your settings
  - Two channels, each with dedicated volume controls
  - Built-in reverb options
  - Model: JVM210 Head
  - Range: JVM
  - Channels: 2 (Multi)
  - Technology: Valve
  - Output wattage: 100W
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 4 x EL34
  - Weight: 22 kg / 49 lb
  - Width: 740 mm / 29.1"
  - Height: 310 mm / 12.2"
  - Depth: 215 mm / 8.5"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-91006 footswitch included, detachable power cable included, speaker cable included
