description: A silver-finish version of the Super Phat Mod overdrive, adding a
  germanium amplifier stage after the tone stack to the pedal's JFET gain stages
  for a more aggressive voicing with germanium fuzz character.
details: |-
  The Super Phat Mod descends from Keeley's modification of the BD-2 Blues Driver, one of the earliest pedals the company modified. That circuit layers tube-amp style gain stages and tone stacks with several tone-shaping sections, and the modern pedal reproduces the Keeley Phat Mod part for part apart from newly selected JFETs.

  This Germanium version adds a germanium amplifier stage immediately after the tone stack. The result is a more aggressively voiced overdrive with a spongy compression and the fuzz character germanium transistors produce, so the pedal covers both overdrive and fuzz territory.

  The pedal is full range and responsive, intended to be driven by guitar volume and picking attack rather than by its own gain control alone. A micro toggle provides the two bass-response modes of the original BD-2 modification, where the boosted setting was called Phat mode and suited Stratocaster and Telecaster players wanting a small push without mud. The bypass is true bypass.
