description: >
  A 49-key MIDI controller that distills focused controls, inspiring features, and professional software into an accessible, compact package. KeyLab Essential 49 mk3 offers a personal, enjoyable workflow with total creative freedom.
details: |-
  The keylab essential 49 mk3 is a 49-key MIDI controller designed to provide a personal, accessible, and enjoyable music-making workflow. It combines focused controls, inspiring features, and professional software into a compact keyboard controller package that offers total creative freedom. The device measures 31.1 x 9.45 x 2.76 inches and weighs 6.1 lbs, making it portable yet substantial.

  The keyboard features a premium 49-note velocity-sensitive keybed with hybrid synth-piano feel, complemented by a 2.5 LCD display with contextual buttons for real-time feedback on tweaks and controls. The control surface includes 1 clickable encoder, 9 rotary encoders, 9 x 30mm faders, 8 transport switches, 4 command switches, 1 modulation wheel, 1 bend wheel, and 8 touch and pressure-sensitive pads for comprehensive performance and editing capabilities.

  Smart features include a multi-mode arpeggiator, chord mode, scale mode, hold function, and semitone transpose for enhanced musical expression. The controller seamlessly integrates with analog lab v for sound selection and preset browsing with smart-assigned controls, while custom DAW scripts support fl studio, logic pro, ableton live, cubase, and bitwig studio. It also supports mcu/hui control and allows up to 6 user presets for customizable workflows.

  Connectivity options include USB-c for computer and MIDI control center connection, MIDI 5-pin din output for external instruments and gear, and control inputs for sustain pedal, expression pedal, or footswitch. The device is USB-c powered and works in standalone, VST, AAX, audio unit, and nks formats on 64-bit daws. Included software features analog lab v with 2000+ sounds, ableton live lite, native instruments the gentleman, uvi model d, 2-month loopcloud subscription, and melodics subscription for 40 lessons.
