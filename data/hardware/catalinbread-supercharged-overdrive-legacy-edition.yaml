description: The SuperCharged Overdrive Legacy Edition is a revival of
  Catalinbread's MOSFET-based overdrive featuring eight stacked MOSFET devices
  for bottom-heavy crunch. The updated circuit adds a tilt equalizer with an
  800Hz centerpoint and a Contour control that feeds the output signal back into
  the circuit for variable saturation and midrange shaping.
details: |-
  The SuperCharged Overdrive features eight stacked MOSFET devices for bottom-heavy crunch. The tilt equalizer has an 800Hz centerpoint with a center detent at 12:00. The Contour control feeds the output signal back into the circuit for variable saturation and midrange shaping — the Gain and Contour controls interact with each other for a wide dynamic gain range with amp-like resonance.

  Power accepts 9-18V DC center-negative. Backed by a 3-year warranty.
