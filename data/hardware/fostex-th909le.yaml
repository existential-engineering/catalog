name: TH909LE
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th909le/
description: Premium open-back dynamic headphones in the TH Premium Series. The
  TH909LE is the simplified-packaging version of the TH909, based on the
  TH900mk2 platform with a 50 mm neodymium / Bio-Dynamic diaphragm driver.
  Houses are finished in lacquered Bordeaux on Mizume Cherry hardwood by
  Sakamoto Otosho Shoten using a hand-applied silver-foil lacquer technique.
  Drivers use a 1.5 tesla repulsive-field magnetic circuit, and the
  double-layered aluminum etched housing openings tune the acoustic response.
  Ships with a 2 m 7N high-purity OFC unbalanced cable (PVC sheath, same
  material as TH910) terminated in rhodium-plated 2-pin connectors and a 6.3 mm
  gold stereo plug. A leather-like pouch is included; no headphone stand is
  bundled.
details: |-
  Features:
  - Simplified-packaging version of the TH909 (no headphone stand)
  - Lacquered Bordeaux finish on Mizume Cherry hardwood housing, hand-finished by Sakamoto Otosho Shoten
  - 50 mm neodymium / Bio-Dynamic diaphragm driver using bio-cellulose fiber blend
  - 1.5 tesla magnetic flux density repulsive-field magnetic circuit
  - Double-layered aluminum etched housing openings for natural sound field
  - Includes 7N (99.99999%) high-purity OFC unbalanced cable (2 m, PVC sheath)
  - Low-rebound cushioning ear pads with premium synthetic leather

  Color: Bordeaux

  Wood Type: Mizume Cherry

  Accessories: Leather-like pouch

  Compliance: European RoHS Directive
releaseDate: 2026-03-05
