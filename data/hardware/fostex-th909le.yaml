description: Premium open-back dynamic headphones in the TH Premium Series. The
  TH909LE is the simplified-packaging version of the TH909, based on the
  TH900mk2 platform with a 50 mm neodymium / Bio-Dynamic diaphragm driver.
  Houses are finished in lacquered Bordeaux on Mizume Cherry hardwood by
  Sakamoto Otosho Shoten using a hand-applied silver-foil lacquer technique.
  Drivers use a 1.5 tesla repulsive-field magnetic circuit, and the
  double-layered aluminum etched housing openings tune the acoustic response.
  Ships with a 2 m 7N high-purity OFC unbalanced cable (PVC sheath, same
  material as TH910) terminated in rhodium-plated 2-pin connectors and a 6.3 mm
  gold stereo plug. A leather-like pouch is included; no headphone stand is
  bundled.
details: |-
  Based on the TH900mk2, this is a newly developed open-back high-end headphone model. This product is the simplified packaging version of the TH909, it does not include a headphone stand, and the included cable is 2 m with PVC sheathing, the same cable material as the TH910. The body color is Bordeaux.

  The surface finish of the wooden parts is achieved using a lacquer craft technique developed by Sakamoto Otosho Shoten, a company founded in 1900 that applies traditional Japanese craftsmanship to modern industrial products. The lacquer consists of a base black lacquer and an adhesive lacquer for applying the foil, with several types of silver foil, smoked with sulfur, applied in a torn-paper-like manner to express depth. The wood is Mizume cherry, a premium Japanese species derived from a variety of the birch tree, known for its fine, dense grain and hardness.

  The BioDyna diaphragm uses ultra-fine bio-cellulose fiber material blended with other fibers under optimal conditions, achieving low specific gravity, high Young's modulus and high internal loss. A free edge with excellent linearity faithfully reproduces large-amplitude low to mid frequencies. Bio-cellulose fibers are 20 to 50 nm thick, roughly one thousandth the thickness of natural plant fibers such as cotton.

  The magnetic circuit employs a repulsive magnetic field with a neodymium magnet at 1.5 Tesla magnetic flux density, delivering an expansive dynamic range with low distortion. The housing openings feature a unique design with double-layered aluminum etched parts that change their impression depending on light intensity and angle, and repeated fine-tuning of the opening ratio and internal components reproduces a natural, fatigue-free sound field.

  The headphones include a 7N (99.99999%) grade high-purity OFC unbalanced cable. The ear pads fit snugly around the back of the ear to minimize sound leakage, with low-rebound cushions and premium synthetic leather for a comfortable wearing experience during extended use.
specs: |-
  - Model: Open type / dynamic type
  - Driver: 50 mm neodymium magnet / bio-dynamic diaphragm
  - Playback frequency range: 5 to 45,000 Hz
  - Impedance: 25 ohm
  - Sensitivity: 100 dB/mW
  - Maximum input: 1,800 mW
  - Weight of main unit: Approx. 390 g (excluding cord)
  - Housing: Mizume cherry wood with lacquered Bordeaux finish, double-layered aluminum etched openings
  - Cable: 2-pin rhodium-plated specification x2 (L, R) to 6.3 mm gold-plated stereo plug, 7N (99.99999%) grade high-purity OFC, 2 m x1
  - Accessories: Leather-like pouch
  - Simplified packaging edition, no headphone stand included
  - Replacement ear pads: EX-EP-99
  - Complies with the European RoHS Directive
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
