details: |-
  The F-12 is an F-body Original Series model pairing East Indian Rosewood back and sides with a Sitka Spruce top. George Lowden notes: 'For years I have been thinking of developing a light weight bolt on design neck joint, one that would achieve a really solid joint but not disturb the natural balance of the instrument.' The Original Series is built with AAA-grade tonewoods selected for tonal depth, balance and responsiveness, and carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - East Indian Rosewood back and sides
  - Sitka Spruce top
  - F body shape
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Hardshell case included
