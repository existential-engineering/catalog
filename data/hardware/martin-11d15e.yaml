  includes a softshell case.
details: |-
  The Martin D-15E is a solid wood acoustic-electric Dreadnought in Martin's 15 Series. It pairs a satin-finished Indian Plantation Mahogany top with Sapele back and sides, delivering a warm, woody tone that's well suited to both stage and studio.

  Built around the D-14 Fret Dreadnought body shape with a 25.4" scale length and a 1 3/4" nut, the guitar uses a Select Hardwood neck with Martin's Performing Artist (PA) profile and High-Performance Taper for modern playability. Katalox is used for both the fingerboard (with faux abalone inlays) and the modern belly bridge with drop-in saddle.

  Factory electronics consist of the Martin E1 system, offering volume, tone, phase control, and an onboard chromatic tuner. Ping Nickel Open Gear tuners with black knobs handle tuning duties, and the guitar ships strung with Martin Authentic Acoustic Lifespan 2.0 phosphor bronze medium strings.

  The instrument is supplied with a softshell case featuring waterproof construction and backpack straps, making it a practical choice for gigging musicians. A left-handed configuration is also available.
specs: |-
  - Body Size: D-14 Fret Dreadnought
  - Top: Indian Plantation Mahogany (satin finish)
  - Back & Sides: Sapele (satin finish)
  - Neck: Select Hardwood, PA Profile, High-Performance Taper
  - Fingerboard: Katalox with faux abalone inlays
  - Scale Length: 25.4"
  - Nut Width: 1 3/4"
  - Bridge: Katalox, modern belly with drop-in saddle
  - Tuning Machines: Ping Nickel Open Gear with Black Knob
  - Electronics: Martin E1 (volume, tone, phase control, chromatic tuner)
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze, Medium
  - Frets: 20 total (14-fret body)
  - Case: Softshell with waterproof construction and backpack straps
