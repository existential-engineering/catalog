url: https://www.behringer.com/en/products/0718-abm
description: Analog semi-modular percussion synthesizer with dual VCOs, a
  multi-mode 24 dB resonant ladder filter, three decay envelopes, a dual 8-step
  sequencer and 16-voice poly chain. A pure analog signal path and a 15 x 10 I/O
  patch matrix take it from super-tight percussive sounds out to dark, moody
  bass lines.
details: |-
  Great care has been taken in designing the EDGE to achieve new possibilities in sound creation by reviving timeless analog designs and technologies. By taking a fresh and modern approach on classic circuits, the EDGE gives you the power to create super-tight percussive sounds to dark and moody bass lines.

  Live Performance Beat Maker

  Built to enhance the way you perform, the EDGE boasts a pure analog signal path, Dual VCOs with pulse and triangle waves, oscillator sync and FM plus a white/pink noise source for a huge range of sounds and timbres. Its dual 8-step sequencer with pitch and velocity controls can also provide you with a degree of control that will let you create any groove and rhythm you can imagine. If that wasn't enough, the EDGE's sequencer can go up to an astounding 10,000 BPM so you can turn your beats into mind-blowing waveforms that'll surprise even the most hardcore synth wave fan out there.

  Controls

  The EDGE has a whole slew of modulation and controls that can help you in shaping your beats and basslines and giving them the ability to transcend dimensions or just sound really, really awesome. These include a multi-mode 24 dB resonant ladder filter with a low and high-pass filter and three separate decay envelopes for pitch, filter cutoff and amplitude for detailed control. Thanks to its semi-modular design, the EDGE can perform right out of the box with its default routing. But if you need a lot more control and want to sculpt your sound even more, the EDGE features a 15 x 10 I/O matrix for incredibly vast and flexible patching options. The matrix includes inputs for Control Voltages, Decay, Trigger, Velocity, Noise Level, External Audio Sources, Tempo, Modulation and so much more.

  The Numbers

  The EDGE has 44 controls to give you direct and real-time access to all important parameters, all laid out in a highly intuitive format that puts the fun back in to your beat creation. Input and output connections include MIDI In, MIDI Out/Thru, USB, OSC 1 CV, OSC 2 CV, OSC Decay, ADV/CLOCK, Trigger, Velocity, Noise Level, 1-2FM AMT, EXT AUDIO, Tempo, Play/Stop, VCF MOD, VCF Decay, VCA CV and Pitch. An external MIDI keyboard, footswitch or expression pedal can be connected to the EDGE so you can have even more control over your beats and basslines. If one EDGE isn't enough for you, you can chain multiple EDGE units for more intricate combinations.
specs: |-
  - Analog semi-modular percussion synthesizer with a pure analog signal path based on authentic VCO and VCF designs
  - Dual VCOs with pulse and triangle waveforms, oscillator sync and FM
  - White/pink noise source, usable as a modulation source and as a cutoff modulation source for the filter
  - External audio input for processing external sound sources
  - Multi-mode 24 dB resonant ladder filter, switchable low pass / high pass, with cutoff modulation by noise
  - 3 separate decay envelopes for pitch, filter cutoff and amplitude
  - Dual 8-step sequencer with pitch and velocity controls per step
  - Sequencer speed up to 10,000 BPM, allowing audio-range waveform generation
  - Time division control with 8 different rates
  - Multiple clocking sources including MIDI and USB for synchronization with other equipment
  - 16-voice Poly Chain for combining multiple units up to 16-voice polyphony
  - Semi-modular design with default routings requires no patching for immediate performance
  - 15 x 10 I/O patch matrix (15 inputs, 10 outputs)
  - 44 controls
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - An external MIDI keyboard, footswitch or expression pedal can be connected for additional control
