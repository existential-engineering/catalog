description: Preset-driven three-button vocal effects floor processor with over
  200 factory presets and up to eight simultaneous effect blocks covering
  harmony, doubling, reverb, echo, HardTune and transducer. A 30-second looper
  and a front-panel display are built in.
details: |-
  VoiceLive Play is a preset-driven floor processor aimed at singers who do not want to program effects. More than 200 factory presets are organised by song and style, covering pop, rock, country, worship and jazz vocal production, and each is recalled with a footswitch.

  Harmony, doubling, reverb, echo, HardTune, transducer and an Adaptive Tone engine all run in real time, with up to eight effect blocks active at once. The harmony engine takes its key either from MIDI sent by a keyboard or from a key set by hand, and builds backing voices behind the lead vocal.

  A built-in 30-second looper allows vocal arrangements to be assembled during a performance, and a front-panel display exposes every setting without buried menus. Connections are an XLR input with phantom power, a balanced XLR main output, a MIDI input and a standard 12V supply. The unit is the entry point to the VoiceLive range.
specs: |-
  - Over 200 factory presets organised by song and style
  - Up to 8 effect blocks active at once
  - Harmony, doubling, reverb, echo, HardTune and transducer effect blocks
  - Adaptive Tone engine
  - Built-in 30-second looper
  - Harmony key set by MIDI or by hand
  - Front-panel display
  - Three footswitches
  - Phantom power on the XLR microphone input
  - 12V DC power input
