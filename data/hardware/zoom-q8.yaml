description: The Q8 marries high-definition video with high-resolution audio,
  making it the perfect camera for music and video creators everywhere. Its 160
  degree wide-angle lens and digital zoom ensure that you will always capture
  the complete picture.
details: |-
  The Q8 marries high-definition video with high-resolution audio, for music and video creators. Its 160 degree wide-angle lens and digital zoom capture the complete picture, combined with Zoom's interchangeable mic capsule system and two XLR/TRS combo inputs.

  A large full-color LCD touchscreen makes the unit easy to operate, and the screen is fully rotatable so the image can be viewed whatever the camera position. Dual combo XLR/TRS inputs take external microphones and line-level sources, a built-in speaker and a stereo headphone/line out jack provide audio monitoring, and an HDMI output handles video monitoring. A USB port connects the Q8 to a computer for use with streaming or editing software.

  Audio supports 24-bit/96 kHz recording. The supplied detachable X/Y microphone can be swapped for most Zoom mic capsules, including those from an H5 or H6, though the EXH-6 TRS/XLR combo capsule is not compatible. A low-cut filter and the supplied foam windscreen cut low-frequency noise and rumble, and there is a built-in compressor and limiter. Audio can be recorded with video, or the Q8 can run as a standalone stereo or four-channel audio-only recorder.

  Video goes beyond standard HD, offering 3M HD (2304 x 1296 pixels at 30fps, 24 Mbps) plus two kinds of HD (24 Mbps and 16 Mbps) at frame rates up to 60fps at 720p for fast action. The F2.0 aperture and 160 degree wide-angle lens are matched by 10 Scene presets for lighting conditions from direct sunlight to low light, including Concert Lighting and Concert Low-Light, and settings tailored for jazz clubs, rehearsal studios and the outdoors.

  The Q8 attaches to any standard tripod and ships with a tripod-to-three-prong converter for action camera mounts. The supplied lithium-ion battery recharges over USB or from an optional AC adapter, with battery life of more than two hours when shooting at 720p/30fps and longer in audio-only mode. Recording goes to SD, SDHC and SDXC cards up to 128 GB, in MOV format with audio embedded or saved separately as WAV or AAC.
specs: |-
  - Recording media: SD, SDHC and SDXC cards up to 128 GB
  - Image sensor: 1/3-inch 3-megapixel CMOS sensor
  - Lens: fixed focus (36 cm to infinity), F2.0, focal distance approximately 16.6 mm (35 mm equivalent), 160 degree wide angle
  - Video format: MPEG-4 AVC/H.264 (MOV)
  - Video resolutions: 3M HD (2304 x 1296) 30fps, HD (1080) 30fps, HD (720) 60fps, HD (720) 30fps, WVGA 60fps, WVGA 30fps
  - Audio formats: WAV (16/24-bit, 44.1/48/96 kHz), AAC (64 to 320 kbps, 48 kHz)
  - Audio functions: low-cut filter, compressor, limiter
  - Image functions: digital zoom 1.0x to 4.0x, scene selection (Auto/Concert Lighting/Night), self timer (off, 3, 5 or 10 seconds)
  - Display: 2.7 inch full-color LCD touchscreen, fully rotatable
  - Built-in speaker: 400 mW 8 ohm mono speaker
  - L/R inputs: X/Y mic (XYQ-8), 120 degree X/Y stereo format, maximum sound pressure input 140 dB SPL, input gain -inf to +52 dB, equivalent input noise -120 dBu or less
  - INPUT 1/2: TRS/XLR combo jacks, input gain -inf to 55 dB (PAD off) or -inf to 35 dB (PAD on), input impedance 1.8 kohm or more, maximum input level +22 dBu (PAD on), phantom power +12/+24/+48 V global for both inputs
  - Outputs: combined line/headphones stereo mini-jack, Type D micro HDMI. HDMI output selectable between NTSC and PAL
  - USB: mini B connector. Mass storage class USB 2.0 High Speed. Audio interface class USB 1.0 Full Speed. Webcam at WVGA/720p video with 48 kHz 16-bit audio. Audio interface and mass storage supported with iPad (Apple Camera Connection Kit required). USB bus power supported
  - Up to four tracks of simultaneous audio recording, with analog-style gain controls per input, a built-in mixer and a stereo link function
  - Power: lithium-ion battery, DC 4.2 V maximum, DC 3.7 V nominal, 1700 mAh. Recharging about 4 hours 30 minutes over USB or 2 hours 45 minutes from an AC adapter
  - Battery operation time: more than 2 hours when recording 720p/30fps
  - Dimensions: 158 mm L x 48 mm W x 69 mm H with the mic lowered, 158 x 48 x 119 mm with the mic raised. XYQ-8 capsule 50 x 37 x 32 mm
  - Weight: recorder 260 g / 9.2 oz (without battery and capsule), XYQ-8 capsule 40 g / 1.4 oz, battery 40 g / 1.4 oz
  - Built-in standard tripod mount plus a supplied tripod-to-three-prong converter for action camera mounts
  - Compatible with most Zoom mic capsules (sold separately), but not with the EXH-6 TRS/XLR combo input capsule
