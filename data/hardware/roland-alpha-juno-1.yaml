description: >-
  The Alpha Juno-1 is a 6-voice polyphonic synthesizer released by Roland in 1986,
  featuring digitally controlled oscillators paired with a 24dB analog lowpass filter. It
  replaced traditional sliders with membrane buttons and the Alpha Dial for parameter
  editing, offering solid sound quality at an affordable price point. The synth is
  well-regarded for bass synthesis, particularly acid-style basslines, and includes chord
  memory, portamento, and a capable MIDI implementation.
details: |-
  The Alpha Juno-1 was Roland's effort to create an affordable yet capable synthesizer, building on the legacy of the earlier Juno series. Rather than traditional faders found on its predecessors, it employs membrane buttons and the Alpha Dial for browsing and editing its extensive selection of parameters. While not quite as warm as earlier Juno models, it delivers solid sound quality that has earned a devoted following.

  The sound engine is built around digitally controlled oscillators (DCO), offering pulse, sawtooth, sub, and noise waveforms alongside a dedicated sub-oscillator. Filtering is handled by a 24dB analog lowpass filter with frequency, envelope, resonance, and LFO modulation capabilities. The LFO is capable of very slow sweep rates, adding to the instrument's expressive range. The synth excels at bass synthesis, particularly acid-style basslines, and includes noise effects for textural variety.

  The Alpha Juno-1 provides a better MIDI implementation than previous Roland synths and stores 64 user patches plus 64 presets with cassette backup capability. Additional performance features include chord memory, which proved popular in rave and techno contexts, portamento, and keyboard transposing. Related models include the PG-300 programmer for traditional slider control, the MKS-50 rackmount variant, and the consumer-oriented HS-10.
specs: |-
  - 6-voice polyphony
  - 1 DCO per voice with pulse, sawtooth, sub, and noise waveforms
  - 1 sub-oscillator per voice
  - 24dB analog lowpass filter with ADSR envelope
  - LFO with very slow sweep rate capability
  - Chorus effect
  - Portamento
  - Chord memory
  - Keyboard transpose
  - 64 user patches
  - 64 preset patches
  - Cassette backup
  - 49-key keyboard (no velocity or aftertouch)
  - MIDI control
