description: The largest floor-standing speaker in the Bowers & Wilkins 600
  Series, engineered for larger rooms and home theater. Combines a new Titanium
  Dome tweeter with the brand's Continuum cone FST midrange and dual paper bass
  drivers for room-filling scale and authority.
details: |-
  The 603 S3 is the flagship floor-standing model in the third-generation Bowers & Wilkins 600 Series. It is a three-way vented-box design built for larger listening spaces, pairing two 165mm paper-cone bass drivers with a 150mm Continuum cone FST midrange and a newly developed 25mm Titanium Dome tweeter.

  The Titanium Dome tweeter is the headline change for the S3 generation. It uses a Decoupled Double Dome construction intended to combine exceptional high-frequency resolution with smooth, refined treble. The Continuum cone FST midrange driver, a technology originally developed for higher-tier B&W series, is engineered to avoid abrupt transitions in cone behavior, allowing a more open and neutral midrange.

  Bass output is delivered by two 165mm paper-cone drivers in a vented enclosure that uses the company's Flowport design to reduce port noise at high output levels. Speaker terminals have been upgraded with hardware derived from the 700 Series.

  The cabinet is supplied with an acoustically transparent grille mesh first introduced on the Signature models. Available finishes are Black (black grille), White (grey grille), and Oak (grey grille). The speaker ships as a single unit and is sold here as a pair.
specs: |-
  - Drive units: 1x 25mm Titanium Dome tweeter, 1x 150mm Continuum cone FST midrange, 2x 165mm paper cone bass
  - Configuration: 3-way vented-box system
  - Frequency range: 29Hz - 33kHz (-6dB)
  - Frequency response: 46Hz - 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on-axis at 2.83Vrms at 1m)
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (350Hz - 12kHz) at 90dB/1m
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 30W - 200W into 8 ohms (unclipped program material)
  - Max recommended cable impedance: 0.1 ohms
  - Height: 985mm (cabinet), 1020mm (with plinth)
  - Width: 190mm (cabinet), 260mm (with plinth)
  - Depth: 340mm (cabinet), 368mm (with grille), 402mm (with plinth)
  - Net weight: 27.5kg (60.6 lb)
  - Finishes: Black, White, Oak
