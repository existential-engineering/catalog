details: |-
  The 603 S3 is the largest loudspeaker in the Bowers & Wilkins 600 Series and the only floor-stander in the range, aimed at larger rooms and at home theater front channels. It is a three-way vented-box system carrying a 25mm Titanium Dome tweeter, a 150mm Continuum cone FST midrange driver and a pair of 165mm paper bass cones, with Flowport porting.

  Room-filling scale and authority come from the two bass drivers, and Bowers & Wilkins credits improved terminals and enhanced drive unit positioning with making this, in its own words, the most sophisticated affordable tower speaker it has made. The all-new Titanium Dome tweeter is presented as combining high resolution and insight with a smooth, refined top end, and it sits behind a new, more acoustically transparent tweeter grille mesh first developed for the Signature models.

  The Continuum cone is a composite construction intended to avoid the abrupt changes in behaviour that can impair a conventional drive unit, which Bowers & Wilkins ties to a more open and neutral presentation of voices and instruments. The speaker terminals are derived from those introduced in the 700 Series range and are described as offering an improved layout and a cleaner signal path between amplifier and loudspeaker.

  The 603 S3 is passive and needs an external amplifier. Nominal impedance is 8 ohms with a 3.0 ohm minimum, sensitivity is 90dB, and Bowers & Wilkins recommends 30W to 200W into 8 ohms on unclipped programme with total cable impedance below 0.1 ohm. The owner's manual states that the speaker has two linked pairs of terminals: the links stay in place for a conventional single amplifier connection and are removed for bi-wiring or bi-amplification, which the manual says can improve the resolution of low-level detail.

  The cabinet is floor-mounting only and the supplied plinth must always be fitted, with the spike or rubber feet screwed into the plinth rather than directly into the cabinet. Three finishes are offered, Black, White and Oak, with a black grille on Black and a grey grille on White and Oak, and supplied foam port plugs allow low-frequency output to be trimmed when the speaker has to sit close to a wall.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Decoupled Double Dome Titanium tweeter, Continuum cone FST midrange, Paper bass cones, Flowport
  - Drive units: 1x 25mm (1in) Titanium Dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 165mm (6.5in) Paper bass cone
  - Frequency range: -6dB 29Hz to 33kHz
  - Frequency response: 46Hz to 28kHz +/-3dB from reference axis
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 100Hz to 22kHz, less than 0.5% 350Hz to 12kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 30W to 200W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Terminals: two linked pairs of binding posts, links fitted for conventional connection and removed for bi-wiring or bi-amplification
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm diameter
  - Dimensions: Height 985mm (38.8in) cabinet only, 1,020mm (40.2in) including plinth, Width 190mm (7.5in) cabinet only, 260mm (10.2in) including plinth, Depth 340mm (13.4in) cabinet only, 368mm (14.5in) including grille and terminals, 402mm (15.8in) including plinth
  - Net weight: 27.5kg (60.6 lb)
  - Cabinet finishes: Black, White, Oak
  - Grille finishes: Black (Black), Grey (White and Oak)
  - Floor mounting only, supplied plinth must always be fitted, with spike or rubber feet inserted into the plinth
  - Supplied with grille, foam port plug, plinth, spike feet and screw-on rubber feet
  - Passive loudspeaker: no on-board amplification and no mains connection
