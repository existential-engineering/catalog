description: >-
  Ludwig Classic Oak drums deliver unmatched power, bold tone, and rock-solid
  durability. Built in the USA, these kits feature 5-ply oak/maple shells for
  deep resonance and massive projection.
details: |-
  Dark presence. Sculpted definition. Classic Oak is built around a proprietary 5-ply, 6.5mm cross-over shell that pairs a 3-ply maple core with American red oak inner and outer plies, producing a tone that is balanced, focused, and loud.

  A dual 45-degree bearing edge with a maple core apex adds focus, attack, and tuning control. Combined with Ludwig's Radio Frequency Shell Technology — using historic bladder molds for even shell curing — the kit delivers aggressive attack and dark tones with a quick, even decay.

  Designed for settings that prioritize volume, attack, and control, Classic Oak is offered in three Standard Outfits (FAB 3-PC, STUDIO 4-PC, PRO BEAT 3-PC) and a range of finishes including Tennessee Whiskey, Smoke, Night Oak, and new Green, Blue, and Brown Burst options.
specs: |-
  - 5-ply, 6.5mm cross-over shell (3-ply maple core with American red oak inner and outer plies)
  - Dual 45-degree bearing edge with maple core apex
  - Radio Frequency Shell Technology (historic bladder molds for even shell curing)
  - Bass drums (Virgin w/ Elite Spurs): 20x14, 22x14, 22x18, 24x14
  - Floor toms (Triad Brackets w/ 12.5mm legs): 14x14, 16x16, 18x16
  - Tom toms (Atlas Mounting): 10x8, 12x8, 13x9
  - Snare drums (Twin Lugs, P88 Throw-Off, P35 Butt-Plate): 14x5, 14x6.5
  - Standard Outfits: FAB 3-PC, STUDIO 4-PC, PRO BEAT 3-PC
  - Made in the USA
