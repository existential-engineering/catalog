description: Prepared for Performance. You don’t want to go in blind, but you
  also don’t just want to hit play. Use track mutes, per-track probability,
  delay, clock divisions and sequence length to add even more variations to your
  track. Finally put it in loopy mode to stutter or loop slices of your
  sequence, or program unique fills with unused steps.
details: |-
  Steppy is a 4-track programmable gate sequencer with eight internal memory slots, external clocking, numerous tweakable parameters, and a performance-first design aesthetic.

  Each track features numerous independent parameters that govern its playback independently of the other tracks, including its own length (1 to 64 steps), gate length, clock divider, swing, delay, and probability control.

  Tracks can be programmed by entering active steps on the grid or tapped in live as the sequence is moving. Tracks can be selected and modified in real time as the sequence plays. A select button allows direct access to each track (and each page of 16 steps within that track) through Steppy’s multifunction buttons array.

  Tracks can be individually muted and unmuted, and a special performance mode (called “Loopy”) enables you to touch any two gate steps and instantly create a performance that loops between those steps.

  Track patterns can be cleared without clearing playback parameters, and all track patterns (along with their individual playback and performance parameters) can be saved as a preset to one of eight internal memory slots.
specs: |-
  - Width: 8HP
  - Depth: 25mm
  - Power: 15mA @ +12V, <1mA @ -12V
  - 4 independently programmable gate tracks
  - 8 internal memory preset slots
  - Per-track length: 1 to 64 steps
  - Per-track gate length (with tied gates at extreme setting)
  - Per-track clock divider
  - Per-track swing setting
  - Per-track delay setting
  - Per-track probability control
  - Per-track pattern shift/rotate
  - “Loopy” performance mode for stutter/loop effects
