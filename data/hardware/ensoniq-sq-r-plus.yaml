description: >-
  An upgraded version of the Ensoniq SQ-R rack-mount synthesizer with expanded
  32-voice polyphony, three digital oscillators per voice, Transwave wavetable
  support, and an 8-zone MIDI controller function.
details: |-
  The SQ-R Plus/32 was an upgraded revision of the original SQ-R, increasing polyphony from 21 to 32 voices while retaining the same synthesis engine with three digital oscillators per voice drawing from over 100 sampled waves plus nine Transwaves for wavetable-style timbral animation.

  Like the original, the Plus/32 features the Smart Transmit function, which turns the unit into an eight-zone MIDI controller when a keyboard is connected. The front panel provides a 32-character LCD display and controls organized across four operational modes.

  The onboard memory holds 100 ROM sounds and 80 RAM slots for custom patches, expandable by 160 additional sounds via optional RAM/ROM cards. The digital effects processor covers reverb, chorusing, flanging, distortion, delay, compression, and wah effects.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 8 parts
  - Oscillators: 3 digital per voice
  - Waveforms: Wavetable with 9 Transwaves
  - Effects: Reverb, chorusing, flanging, distortion, delay, compression, wah
  - Display: 16-character 2-line LCD
  - Memory: 80 RAM patches, 100 ROM patches, up to 160 additional via cards
  - Control: MIDI In/Out/Thru
