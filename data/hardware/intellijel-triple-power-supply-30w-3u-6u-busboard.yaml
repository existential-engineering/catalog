details: |-
  The TPS30W MAX is a high power, super efficient and low noise studio grade power system for your Eurorack Modular. Intellijel carefully designed this power supply to perform optimally with even the most demanding, noisy and power hungry modules in your rig. The TPS30W MAX is recommended for cases up to 6U x 84hp in size.

  It is built around a 30 Watt integrated switching power supply with low impedance star distribution on a 4 layer PCB, delivering +12V at 1.5A, -12V at 1.5A, and +5V at 1A. A triple 120° phased controller keeps induced noise low, and the design includes output short circuit protection with foldback current limiting, output overvoltage protection from transient overshooting, soft start for controlled start up operation, and +/-1% output voltage accuracy.

  Two 2-pin molex headers give access to the +5V bus, which is great for attaching special accessories like the USB Power 1U module.

  The board fits comfortably in an 84HP 3U case or 6U case and larger, measures 34cm wide by 8cm tall with a max height of 20mm, and its mounting holes can be used with 0.157" / 4mm PEM snaps for quick install.
specs: |-
  - 30 Watt integrated switching power supply
  - +12V output at 1.5A
  - -12V output at 1.5A
  - +5V output at 1A
  - Recommended for cases up to 6U x 84hp
  - Low impedance star distribution due to 4 layer PCB
  - Triple 120° phased controller for low induced noise
  - Output short circuit protection and foldback current limiting
  - Output overvoltage protection from transient overshooting
  - Soft start for controlled start up operation
  - +/-1% output voltage accuracy
  - Two 2-pin molex headers for access to +5V bus (for accessories like the USB Power 1U module)
  - Fits comfortably in an 84HP 3U case or 6U case and larger
  - Dimensions: 34cm × 8cm × 20mm (max height)
  - Mounting holes usable with 0.157" / 4mm PEM snaps for quick install
