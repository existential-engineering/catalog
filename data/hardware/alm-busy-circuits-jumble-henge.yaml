description: >-
  The Jumble Henge is a compact 8HP 16-input stereo spectral mixer with a unique
  patch-based interface, where each input's vertical and horizontal patch
  position determines its spectral band and stereo pan placement in the mix.
  Each input has a fixed resonant analog filter tuned across the frequency
  spectrum — highs, high mids, low mids, and lows — providing natural spectral
  separation without manual EQ.
details: |-
  The Jumble Henge (ALM029) is an 8HP 16-input stereo spectral mixer co-designed with Worng Electronics, inspired by the SP1200 mixer section and Worng's SoundStage concept. The core idea is that a sound's position in the mix — both spectrally and spatially — is determined by where it is physically patched on the panel.

  The 16 inputs are arranged in four rows (High, High Mid, Low Mid, Low), with each row applying a fixed resonant analog filter to shape the input's spectral content before summing. Panning follows equal-power curves with wider stereo spread at higher frequencies — highs are spread wide, while lows remain centered.

  A clean external stereo input (Ext In) bypasses the spectral filter entirely, allowing cascading of multiple Jumble Henges or adding an unprocessed stem.
specs: |-
  - Width: 8HP
  - Depth: 38mm
  - Power: +12V 70mA / -12V 70mA
  - Inputs: 16 total (8 spectral jacks in 4 rows of 2 + Ext In L/R)
  - Spectral Bands: High, High Mid, Low Mid, Low (4 rows, 2 inputs each)
  - Filter Type: Resonant analog, fixed frequency per row
  - Panning: Fixed equal-power; wider spread at higher frequencies
  - Mix Control: Adjusts filter depth globally
  - External Input: Clean stereo bypass (R normalized to L)
  - Output: Stereo L + R
  - Capacitors: COG/NPO audiophile grade
  - Co-designed with Worng Electronics
  - Reverse power protection
  - Made in England
  - 2-year warranty
