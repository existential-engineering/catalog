description: The M2 MicTrak is a 32-bit float stereo handheld recorder built in the shape of a handheld microphone, with a 90 degree X/Y capsule, stereo and mono modes, a real-time waveform display and a built-in mono speaker. It records WAV at 44.1, 48 or 96 kHz to microSD and works over USB Type-C as a USB microphone, including while recording to the card.
details: |-
  The M2 MicTrak is a 32-bit float stereo handheld recorder built in the shape of a handheld microphone. A newly designed 90 degree X/Y stereo capsule sits in the basket at the top of the body, and 32-bit float recording captures clip-free audio with no need to set gain, from soft-spoken dialogue through to drums.

  The body construction and a glossy finish are designed to cut handling noise, which matters for a recorder meant to be held or passed between speakers. Stereo and mono modes cover music performance and interview or ENG work respectively, and a NORMALIZE function raises or lowers the level of a finished recording to optimize its volume before editing.

  Monitoring happens on the unit. A 96x64 backlit LCD shows a real-time waveform display, a 3.5 mm PHONE/LINE OUT jack with its own volume buttons feeds headphones, and a 500 mW 8 ohm mono speaker is built in for quick reference playback. Front-panel controls cover transport, stereo or mono selection and a low cut.

  Over USB Type-C the M2 works as a USB microphone on PC, Mac, iOS and Android at 48 kHz in 24-bit or 32-bit float, and it can run as a USB mic while recording to the memory card at the same time. On Android, 32-bit float is not available over the USB microphone path. Recording is to WAV at 44.1, 48 or 96 kHz with BWF and iXML metadata, onto microSDHC cards of 4 to 32 GB or microSDXC cards of 64 GB to 1 TB.

  The unit measures 221.5 mm wide by 61.9 mm deep by 59.3 mm high and weighs 204 g with batteries. It runs on two AA cells behind a lock-system battery compartment, giving about 11 hours on alkaline, 10.5 hours on 1900 mAh NiMH and 22 hours on lithium, and it also takes USB bus power or the Zoom AD-17 DC 5 V/1 A adapter through the same Type-C port. A windscreen, a mic clip for mounting on a mic stand, and a Quick Tour are in the box. Batteries are not.
specs: |-
  - Built-in mic: 90 degree XY stereo format, unidirectional
  - Mic sensitivity: -42 dB/1 Pa at 1 kHz
  - Maximum sound pressure input: 135 dB SPL
  - PHONE/LINE OUT: stereo mini jack, maximum output level 20 mW + 20 mW (into 32 ohm load), output impedance 10 ohms or less
  - Built-in speaker: 500 mW 8 ohm mono
  - Recording format: WAV at 44.1, 48 or 96 kHz, 32-bit float, stereo or mono, BWF and iXML supported
  - Recording media: microSDHC 4 to 32 GB, microSDXC 64 GB to 1 TB
  - Display: 96 x 64 LCD with backlight
  - USB: USB Type-C connector (requires a cable that supports data transfer)
  - USB mic: USB 2.0 High Speed, 48 kHz, 24-bit or 32-bit float
  - File transfer: USB 2.0 High Speed
  - Power: 2 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 AC adapter (DC 5 V/1 A), USB bus power supported
  - Battery life: about 11 hours alkaline, about 10.5 hours NiMH (1900 mAh), about 22 hours lithium, measured at 48 kHz/32-bit float stereo with no headphones and the backlight off
  - Power consumption: 5 W maximum
  - Dimensions: 221.5 mm (W) x 61.9 mm (D) x 59.3 mm (H)
  - Weight (including batteries): 204 g
  - Stereo and mono recording modes, mono intended for ENG use
  - Onboard NORMALIZE function adjusts recording level after capture
  - LO CUT and transport controls on the front panel
  - Usable as a USB microphone and as a card recorder at the same time
  - USB microphone works with PC, Mac, iOS and Android, though 32-bit float is not available over USB on Android
  - In the box: M2 MicTrak, windscreen, mic clip, Quick Tour (batteries not included)
  - Optional accessories: WSU-1 universal windscreen, SMC-1 stereo mini cable, TPS-4 tripod mic stand, AD-17 power adapter, ZHA-4 headphone amplifier
  - Note: 0 dBu = 0.775 Vrms
