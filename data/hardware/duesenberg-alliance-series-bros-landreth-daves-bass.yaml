details: |-
  Dave's Bass is the bass in Duesenberg's Alliance Series collaboration with the Winnipeg band The Bros. Landreth, built on the maker's Starplayer Bass design and customised for David Landreth. Duesenberg describes the pair of Alliance instruments as geared to each other, with the guitar taking a solid alder body for quick attack and long sustain and the bass a semi-hollow construction in maple and spruce. The body is semi-hollow with a sustain block, bent sides and an f-hole, measuring 46 x 34 cm / 18" x 13.4" with 4.5 cm / 1.8" sides, multi-layer binding, a cream pickguard and a poly finish.

  The neck is a set one-piece maple neck in a medium D shape, 41 mm / 1.6" at the nut and 53.5 mm / 2.11" at the twelfth fret, with an Indian rosewood fingerboard at a 305 mm / 12" radius, cream dot inlays, 22 jumbo frets, a steel dual-action trussrod and a short 768 mm / 30.2" scale length. The headstock is finished to match the body. Every fingerboard passes through Duesenberg's Plek process so the frets are level, which the maker treats as the basis for its hand fret polishing and setup work.

  The pickups are a custom pair. Duesenberg states that the neck position houses its Alnico-Blade Bass Singlecoil in a custom noiseless version under a new Gold-Foil style cover, giving the transparency of a classic singlecoil while cancelling stage noise, with the noise cancelling switchable on or off from a small switch on the pickguard. The bridge position carries the latest Duesenberg Gold-Foil Bass Singlecoil beneath a Phonico cover, which the maker describes as offering transparency and clarity along with ample low-end power. The specification table lists these as a Duesenberg Mobucker at the neck and a Duesenberg Phonico Gold-Foil at the bridge.

  Wiring gives each pickup its own volume control plus a master tone, so the two can be blended, and a slide switch for the neck pickup split. Hardware is nickel finished throughout and includes Duesenberg Z-Tuners Bass, a Duesenberg Bass Bridge, a Duesenberg Trapeze Tailpiece and Duesenberg Multi-Lock strap pins, strung with Duesenberg Custom 050/110.

  The bass ships with the Duesenberg Custom Line Case as standard, a handcrafted case Duesenberg describes as true flightcase quality, plus all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 41 mm / 1.6" (nut), 53.5 mm / 2.11" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream Dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 768 mm / 30.2"
  - Trussrod: Steel dual-action
  - Headstock: Matching Color
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Body dimensions: 46 x 34 cm / 18" x 13.4"
  - Height (sides): 4.5 cm / 1.8"
  - Pickguard: Cream
  - Binding: Multi-layer binding
  - Finish: Poly finish
  - Tuners: Duesenberg Z-Tuners Bass
  - Bridge: Duesenberg Bass Bridge
  - Tailpiece: Duesenberg Trapeze Tailpiece
  - Strap pins: Duesenberg Multi-Lock
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 050/110 (050-070-085-110)
  - Pickup (neck): Duesenberg Mobucker
  - Pickup (bridge): Duesenberg Phonico Gold-Foil
  - Wiring: 2 Volume, 1 Tone, 1 Slide Switch for Neck Pickup split
  - Case: Duesenberg Custom Line Case (included)
  - Tools: All required allen keys (included)
