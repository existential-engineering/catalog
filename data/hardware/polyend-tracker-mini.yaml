description: A compact, battery-powered 16-track sampler and step-sequencer
  groovebox with sampling, synth and drum-machine engines, a built-in
  microphone, and an included travel case for making music anywhere.
details: |-
  The Tracker Mini is a complete portable workstation that lets you compose, sample, design sounds, and perform. Its expanded 16-track sequencer plus dedicated synth and drum-machine engines give greater flexibility while crafting songs. The Mini supports 14 stereo tracks of USB Audio and USB MIDI, making it suitable for multi-track recording into a DAW or hybrid setups. With up to eight hours of battery life and an included hard travel case, it is built to create music wherever inspiration strikes.

  It offers four synth engines and a drum-machine synth engine: authentic recreations of iconic single-oscillator monosynths (ACD), a virtual-analog voice with three oscillators featuring drift and detune (FAT), a virtual-analog polysynth with dual oscillators and an advanced modulation matrix (VAP), a two-operator FM engine using wavetable-based oscillators with a 3x feedback system (WTFM), and the PERC drum instrument spanning classic 808/909 sounds to experimental glitch effects. A Synth Patch Editor with hundreds of parameters speeds up patch creation and sound design.

  Sampling is central: start from an included sample pack, explore over 250 synth presets, or record your own sounds via the built-in high-quality microphone or line-in. You can convert samples to instruments, resample synth engines, slice breaks with the Slicer and Beat Slicer, build wavetable or granular instruments, and apply offline sample-editor effects.

  Feature-rich modes include Pattern (eight universal audio/MIDI tracks, steps of Note + Instrument + two FX, 1 to 128 steps), instrument parameters and automation with envelopes and LFOs, Sample Player with Forward/Backward/Pingpong loop modes, Song mode for arranging patterns, a Perform module for live effects and cross-pattern mixing, and a Mixer and Master stage with saturator, limiter, EQ, bass booster, and space enhancer.

  Projects created on the original Tracker are fully compatible with the Mini, so a song can start in the studio and finish on the go, with complete MIDI implementation for controlling external gear or connecting a MIDI keyboard.
specs: |-
  - 16-track sequencer
  - Four synth engines: ACD (monosynth recreation), FAT (three virtual-analog oscillators with drift/detune), VAP (dual-oscillator VA polysynth with modulation matrix), WTFM (2-operator wavetable FM with 3x feedback)
  - PERC drum synth engine (7 customizable drums per kit)
  - Wavetable synthesizer and one-grain granular synthesizer
  - Slicer and Beat Slicer for breakbeats and sample kits
  - Sample Recorder via built-in microphone or line-in, with metronome
  - Over 250 synth presets, with access to 50+ professional sample packs and wavetables
  - 14 stereo tracks of USB Audio and USB MIDI
  - USB Mass Storage Device support for file management via USB
  - Stereo sampling and extended memory
  - Up to 8 hours of battery life (built-in battery)
  - Included hard travel case
  - In the box: hard case, Essential References book, USB-A power adapter, 2 m USB-C cable, Stereo 3.5 mm to 2x Mono 6.3 mm adapter, Minijack to MIDI DIN adapter (Type B), 16 GB MicroSD card, MicroSD to USB-A adapter
  - Dimensions: 0.82 in / 2.1 cm height (with buttons), 6.70 in / 17 cm width, 5.12 in / 13 cm depth
  - Weight: device 0.77 lbs / 350 g, incl. hard case 1.34 lbs / 606 g
