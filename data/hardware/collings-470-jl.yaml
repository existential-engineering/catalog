description: The 470 JL is a fully hollow electric guitar developed through a
  years-long collaboration between Collings and jazz guitarist Julian Lage.
  Designed and built from the sound up, it combines a solid Honduran mahogany
  body with a maple laminate top, Ron Ellis Ellisonics pickups, and a Bigsby B3
  vibrato tailpiece. The result is an instrument that reflects both the
  builder's and player's unique approaches to tone and playability.
details: |-
  The 470 JL is Collings' fully hollow signature electric guitar built in collaboration with jazz guitarist Julian Lage. Its construction features a solid Honduran mahogany body with a maple laminate top and an extra-long mortise & tenon neck joint for stability and resonance. The ebony fingerboard has a 12" radius with graduated pearl dot inlays, and the neck is also Honduran mahogany. Electronics consist of custom Ron Ellis Ellisonics pickups with adjustable height, wired with CTS 500K pots, Jupiter Vintage Yellow capacitors, and a 470 wiring scheme (master volume, two tones). Hardware highlights include a pinned ebony bridge with tune-o-matic saddle top (nylon saddles), a Bigsby B3 vibrato tailpiece, and relic nickel Waverly tuners with vintage oval buttons. The guitar is finished in antiqued nitrocellulose lacquer and ships with a deluxe hardshell case.
specs: |-
  - Construction: Fully hollow w/ trestle block
  - Body: Solid Honduran mahogany
  - Top: Maple laminate
  - Neck: Honduran mahogany
  - Body Binding: Non-grained ivoroid
  - Fingerboard Binding: Ebony
  - Peghead Binding: None
  - Bridge: Pinned ebony base w/ tune-o-matic saddle top (nylon saddles)
  - Tailpiece: Bigsby vibrato B3
  - Fingerboard: Ebony w/ graduated pearl dots
  - Fingerboard Radius: 12"
  - Pickups: Ron Ellis Ellisonics (custom adjustable height)
  - Pots/Caps: CTS 500K / Jupiter Vintage Yellow
  - Knobs: Black/Silver or Black/Gold Reflector Top
  - Pickup Rings: Black Phenolic
  - Nut: 1 11/16" Delrin
  - Scale Length: 24 7/8"
  - Neck Joint: Extra long mortise & tenon
  - Frets: Medium 18% nickel-silver
  - Peghead Veneer: Ebony w/ MOP Collings Script logo
  - Peghead Profile: 470 JL Haircut
  - Tuners: Relic nickel Waverly with vintage oval buttons (16:1 ratio)
  - Wiring: 470 Wiring (master volume, two tones)
  - Guitar Finish: Antiqued nitrocellulose lacquer
  - Pickguard: Acrylic Tortoise (1-ply) or Parchment (3-ply)
  - Truss Rod Cover: Black/Cream/Black
  - Strings: D'Addario NYXL1149 (.011" - .049")
  - Case: Deluxe hardshell case
  - Body Width: 13 1/2"
  - Body Length: 17 3/8"
  - Body Depth: 1 13/16"
  - Total Length: 38 3/4"
