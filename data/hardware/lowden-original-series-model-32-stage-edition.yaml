details: |-
  With its shallow body depth, the Stage Edition (32-SE) is designed to be played onstage and primarily as an amplified, rather than purely acoustic, instrument. An LR Baggs Anthem pick-up and cutaway come as standard features, and the neck is a thinner profile (43.5mm at the nut) with a Lowden Shallow Carve, all to make for a super-comfortable playing experience. Aesthetically, the 32-SE splits the difference between an F-32C and an F-35 Indian Rosewood and Sitka Spruce. It has an abalone rosette and abalone dot fingerboard inlays to the Ebony fretboard, and Original Series style Sycamore body bindings. As a high-performing amplified guitar, the 32-SE is a firm favourite with studio and performing musicians. The 32-SE is a 'set' guitar with no configurable options other than being available as a left-handed version.
specs: |-
  - East Indian Rosewood back and sides
  - Sitka Spruce top
  - F body shape with cutaway
  - Shallow body depth
  - 43.5mm nut width
  - Lowden Shallow Carve neck profile
  - Ebony fretboard with abalone dot inlays
  - Abalone rosette
  - Sycamore body bindings
  - LR Baggs Anthem pickup fitted as standard
  - Hardshell case included
