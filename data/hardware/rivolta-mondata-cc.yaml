description: An electric guitar with a 6-in-line headstock, lightweight
  Simarouba body with raised center-block, roasted maple neck, and a pair of
  Rivolta Alnico 5 mini-humbuckers.
details: |-
  The Mondata CC takes the core Mondata platform and reworks it into a more traditional, straight-ahead player's guitar: familiar in feel, confident in tone, and unmistakably Rivolta in character. This is the first Mondata featuring the 6-in-line headstock, borrowed from the original Rivolta Regata. This gives the CC a classic string path and visual balance, subtly shifting the feel toward vintage-inspired designs while maintaining Rivolta's offset identity. Combined with the Mondata CC's proportions, it creates a guitar that feels immediately familiar in the hands. At the heart of the Mondata CC is its 25" scale length, positioned between the 25.5" F-world and 24.75" G-world. This delivers a responsive balance of string snap, clarity, and elasticity: as articulate and lively as a Tele, yet as forgiving and warm as LP. It's a scale that rewards touch and dynamics, making the Mondata CC equally comfortable for rhythm work, melodic lines, and expressive lead playing. The lightweight Simarouba body, paired with a raised center block, gives the Mondata CC excellent resonance and balance, with added focus and sustain. A set, one-piece roasted maple neck provides stability and a broken-in feel from day one, while the bound ebony fretboard with rolled edges keeps the playing experience smooth and precise across all 24 frets. Electronics are intentionally straightforward and versatile. A pair of Rivolta Alnico 5 mini-humbuckers offer clarity and definition with a tight low end and articulate highs. They sit comfortably between single-coil snap and full humbucker weight, making them ideal for players who want note separation, midrange character, and controlled output without sacrificing punch. The tune-o-matic bridge and stop tailpiece, paired with a traditional control layout, reinforce the Mondata CC's no-nonsense approach: familiar, dependable, and focused on feel and tone. The Mondata CC is for players who want something recognizable yet unpredictable. This guitar lives in classic territory, yet offers a distinct balance, scale, and voice that set it apart. FEATURES & SPECS

  A left-handed model is also available.
