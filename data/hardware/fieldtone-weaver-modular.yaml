description: Weaver Modular is a Eurorack format version of the Weaver handheld
  sampler, adding separate level controls, trigger outputs, and CV control over
  recording. It uses randomness to turn captured sounds into evolving rhythmic
  or textural loops.
details: |-
  The modular edition builds on the functionality of the original by adding a variety of additional control. The Weaver is no ordinary audio sampler, it is a meditation on impermanence and chance. With a single, enigmatic knob, it embraces randomness as an artistic principle, reconfiguring two-second sound bites into hypnotic loops and evolving textures. There is no undo button, no way back once a sound is captured; the Weaver insists that you move forward, shaping the unpredictable into rhythm or texture with nothing more than a twist of the wrist or control voltage change. New functionality on the device includes separate level controls of different elements of the loop, as well as 3 x trigger outputs which turns the device into a random rhythm generator for which you don't even need to be using the sampling capabilities. You can trigger the Recording start via CV, allowing you to keep replacing the sample whilst the loop continuously plays - something that works beautifully with acoustic sound sources such as guitar or voice, as well as electronics. A switch has also been added to select between Random or Root note sympathetic pitch playback. Features:

