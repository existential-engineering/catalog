details: |-
  The Martin TKE Uke is a tenor ukulele built around a solid koa body with a gloss finish, pairing traditional Hawaiian tonewood with modern stage-ready electronics.

  Onboard Mi-Si electronics provide a rechargeable preamp system that the manufacturer describes as offering roughly 16 hours of play on a 60-second charge, making the instrument well suited to live performance without the need for batteries.

  Construction includes a dovetail neck joint, East Indian rosewood fingerboard and bridge, black Tusq nut and saddle, and nickel open-gear tuners. The instrument is supplied pre-strung with Martin Tenor Ukulele Strings and ships with a soft gig bag featuring backpack-style straps.
specs: |-
  - Body: Tenor Ukulele
  - Top: Solid Koa
  - Back & Sides: Solid Koa
  - Finish: Gloss
  - Neck: Select Hardwood (satin finish)
  - Fingerboard: East Indian Rosewood
  - Fingerboard Width at Nut: 1 11/32"
  - Frets: 20 total
  - Bridge: East Indian Rosewood
  - Tuners: Nickel Open Gear
  - Nut & Saddle: Black Tusq
  - Binding: Black Boltaron
  - Electronics: Mi-Si
  - Case: Soft Gig Bag
  - Left-Handed Availability: Yes
