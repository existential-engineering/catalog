description: Xone:96 takes the legendary soul of the acclaimed Xone:92 and
  redelivers it, enhanced, and with state-of-the-art digital connectivity.
details:
  - An uncompromising analogue DJ mixer, designed to be at the heart of your
    creativity, Xone:96 takes the legendary soul of the acclaimed Xone:92 and
    redelivers it, enhanced, and with state-of-the-art digital connectivity.
  - The follow-up to a genuine club classic. It's all here. The huge, detailed,
    space-shaking analogue sound that only Xone delivers. A refined, precision
    4-band EQ. Unrivalled dual Xone:VCF filters with CRUNCH harmonic distortion.
    And a dual 32-bit USB soundcard (24 Channels @ 96kHz) with Traktor Scratch
    certification right out of the box.
  - Xone:96 lets you connect your whole rig, from laptops and turntables, to
    pedals, synths and drum machines. Two dedicated FX sends, four stereo input
    channels (with 4-Band EQ), two stereo input channels with all new 3-Band
    Parametric EQ + two auxiliary stereo return channels. And a separate master
    insert for your outboard hardware.
  - Xone:96 draws on our rich heritage to create our most advanced analogue
    mixer yet, engineered from the ground up to deliver the legendary Xone
    analogue sound in the most flexible, powerful format. Xone:92 users will
    feel instantly at home with the Xone:96's layout. All four main stereo input
    channels feature the latest incarnation of our industry standard Xone 4-band
    EQ, the choice of countless international DJ artists. Stereo Return channels
    A and B are fully-featured, and incorporate an all-new 3-band parametric EQ
    design, giving you even more control over how you style your sound.
  - Xone:96 features two independent USB connections, each with 6 stereo inputs
    and outputs giving you a myriad of routing options. State-of-the-art
    96kHz/32-bit processing ensures the highest audio quality is passed between
    your laptops and the analogue engine. Additionally the Xone:96 soundcard
    supports DVS control of Native Instruments' TRAKTOR SCRATCH PRO 3 DJ
    software right out of the box.
  - Nothing comes close to the sound and power of the Xone VCF filter. In
    Xone:96 we've refined this classic design, preserving its unmistakable sonic
    signature while taking its performance to the next level. Alongside the
    classic HPF, BPF, LPF, resonance control and frequency sweep layout, there's
    CRUNCH, a controlled harmonic distortion that sits pre-filter in the circuit
    to give you a powerful new effect. Xone:96 lets you route all six main
    channels to either filter.
  - Xone:96 features two independent headphone CUE systems. Combined with the
    dual soundcard, these allow for back-to-back performances and smooth set
    transitions. Dedicated booth outputs with 3-band booth EQ let you tune the
    monitor system perfectly, and artists using complex, hybrid, multi-channel
    software will benefit from the simplicity of using a single USB to connect
    their computer to Xone:96.
  - Xone:96's rear panel is fully-loaded with I/O. Alongside all the analogue
    connections you'd expect to find, DJs will welcome the addition of 2 stereo
    sends, 4 stereo returns and a dedicated master insert. Send 1 is switchable
    from Line to Hi-Z level, making it ideal for incorporating instrument level
    effects, like guitar pedals. X-Link allows you to hook up Xone:K series
    controllers to the Xone:96 for hands-on control over your software, saving
    USB ports on your laptop. MIDI I/O is catered for via USB and 5-pin
    connection.
  - Built to last, Xone:96 features custom-designed 60mm linear VCA channel
    faders. Perfectly balanced, they offer smooth performance and precise
    control. In the crossfader position, Xone:96 comes equipped with the
    industry-favourite Innofader Mini, complete with fader cut adjustment for
    our sharpest cut ever.
specs: |-
  - 6+2 channel analogue DJ mixer (four 4-band EQ stereo input channels + two 3-band parametric EQ stereo return channels)
  - Four 4-band EQ mix channels
  - Two 3-band parametric EQs on stereo return channels A and B
  - Dual Xone:VCF analogue filters with HPF / BPF / LPF, resonance and frequency sweep
  - CRUNCH pre-filter harmonic distortion
  - Dual 32-bit / 96kHz USB soundcard — 24 channels (2 x 6 stereo in / 6 stereo out)
  - Traktor Scratch certified (DVS control of Native Instruments TRAKTOR SCRATCH PRO 3)
  - Two dedicated FX sends (Send 1 switchable Line / Hi-Z for guitar pedals and instrument-level FX)
  - Two stereo auxiliary return channels plus dedicated master insert for outboard hardware
  - Two independent headphone CUE systems for back-to-back performances
  - Dedicated booth outputs with 3-band booth EQ
  - Custom-designed 60mm linear VCA channel faders
  - Innofader Mini crossfader with fader cut adjustment
  - X-Link connection for Xone:K series controllers
  - MIDI I/O via USB and 5-pin DIN
