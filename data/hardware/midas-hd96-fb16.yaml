description: A portable fader bay expansion unit designed to work with HD Series
  consoles. Turns any HD Series console into a fully expanded mixing surface and
  is described as the perfect partner to the HD96-AIR. Features 16 motorised 100
  mm faders with Mute and Select buttons per channel, 24x240 LCD screen displays
  per channel, a single USB connection, internal power supply, and a compact,
  road-ready design.
details: |-
  Portable fader bay expansion for the Midas HD Series consoles. Provides 16 motorised 100 mm faders with dedicated per-channel LCD displays and Mute/Select command buttons. Connects to the host console via a single USB cable. Includes an internal power supply and is built in a compact, road-ready chassis. Positioned as the companion expansion for the HD96-AIR.
specs: |-
  - Faders: 16 x 100 mm motorised
  - Channel Displays: 24x240 LCD per channel
  - Per-channel Controls: Mute and Select buttons
  - Connection: Single USB
  - Power: Internal power supply
