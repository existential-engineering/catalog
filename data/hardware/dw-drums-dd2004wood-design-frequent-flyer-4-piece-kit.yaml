description: This Frequent Flyer is a lightweight, tour-sized, pro-quality setup for the jazz or funk player.
details: |-
  The DW Design Series raised the bar for DW and made custom-style drums available to more drummers than ever before. This Design Series Frequent Flyer is a lightweight, tour-sized, professional-quality setup for the jazz or funk player. These drums feature 100% North American 8-ply maple shells constructed with HVLT grain orientation technology that deliver warm punch and satisfying resonance.

  The hardware set is fitted with low-mass mini-turret lugs, triple-flange hoops, STM (Suspension Tom Mounts) for reduced tension on mounted toms, and a MAG throw-off.

  This shell pack offers an 8x12″ mounted tom, 11x14″ floor tom, a 12x20″ kick drum, and a 5x14″ snare drum. Cymbals and hardware sold separately. Includes two-piece bass drum pillow set (DSCPBDP2W).
specs: |-
  - North American maple shells
  - Mini-turret lugs
  - STM (Suspension Tom Mount)
  - MAG Throw-Off
  - 8-ply HVLT shells
  - Triple-flange hoops
  - Sizes: 8x12″ mounted tom, 11x14″ floor tom, 12x20″ kick drum, 5x14″ snare drum
  - Series: Design Series
  - Finish options: Black Satin, Tobacco Burst
  - Cymbals and hardware sold separately
  - Includes two-piece bass drum pillow set (DSCPBDP2W)
