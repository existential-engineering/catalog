description: The SM-5 is the Santa Monica Series 5-inch three-way powered studio
  monitor, presenting every detail of a mix with accuracy, imaging and
  translation. It features user-editable DSP that processes room calibration
  profiles on board, for a perfect fit in the room.
details: |-
  Kali's founding principle is to deliver the best possible product for the price. Kali speakers have always been praised for their accuracy, translation and ease of use. The SM-Series builds on these ideals, and incorporates the best available materials, components and manufacturing. The result is a high performance studio monitor that is ready for the most demanding mixing and mastering applications.

  The SM-5 is a three-way design driven by a 3-channel Class D amplifier with discrete LF, midrange and HF sections, rated at 225 W in total. A 1-inch metal dome tweeter, a 4-inch optimized profile paper cone midrange and a 5-inch optimized paper woofer are crossed over at 280 Hz and 2800 Hz inside a front-ported enclosure.

  With onboard processing for room calibration, each speaker can be programmed with delays, trims and EQs to deliver accurate response in the room. Per loudspeaker the user-definable DSP offers 8 parametric EQs, 10 ms of delay and -12 to +6 dB of trim, with DSP latency below 3 ms.

  The user-editable DSP is configured with Kali Control Panel software for Mac and Windows. It works in Online Mode, where each speaker is connected to a network with an ethernet cable, or Offline Mode, where files are loaded onto the speaker from a USB thumb drive. The page states that Kali Control Panel is in beta and that not all features may work as intended.

  The SM-Series has mounting holes on both the top and bottom of the loudspeaker. Kali recommends a speaker-specific U-bracket from Triad-Orbit, though any speaker mount with a 4.25 x 2-inch bolt pattern rated for the weight will work. The page also states that passive versions of the SM-5 and SM-8 are made for enterprise customers, with equivalent output, distortion and frequency response when used with Kali-specified amplification.
