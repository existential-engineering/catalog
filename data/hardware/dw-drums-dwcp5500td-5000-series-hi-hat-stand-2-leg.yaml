description: Features DW's patented lateral cymbal seat adjustment, hinged memory locks and locking clutch
details: |-
  The heavy-duty DW 5000 Series Hi-Hat Stands are offered in both 2-legged and 3-legged models, featuring DW's patented Lateral Cymbal Seat Adjustment, Hinged Memory Locks and Locking Clutch. The folding footboard stays attached to the base casting when folded up, so packing up is more secure.

  The 5000 Series Hi-Hat Stands were designed with DW's patented Delta Ball-Bearing Hinge, which incorporates ball bearings on both sides for a smooth pedal motion, and a Bearing Link Connector that reduces joint friction for smoother playing.

  The swivel legs are designed to get out of the way when you set up your other stands and pedals, and each hi-hat stand includes two pull rods in 21″ and 15″ lengths, so you can customize it to fit different drum kit set-ups. Reinforced double-braced legs keep the stand from toppling or rocking.
specs: |-
  - 2-leg base
  - Folding Footboard (U.S. Patent Nos. 5105706 & 6822150 B1)
  - Delta Ball-Bearing Hinge (U.S. Patent No. 5431081)
  - Lateral Cymbal Seat (U.S. Patent No. 6570075 B1)
  - Locking Clutch
  - Bearing Link Connector on footboard chain
  - Includes 21″ and 15″ pull rods
  - Part number: DWCP5500TD
