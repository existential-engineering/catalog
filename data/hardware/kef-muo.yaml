description: |-
  A portable Bluetooth speaker designed by Ross Lovegrove combining
  high-fidelity audio with an IP67-rated compact form factor. Delivers up
  to 90 dB SPL with 40W total Class D amplification and up to 24 hours of
  battery life.
specs: |-
  - Drivers: 20mm HF tweeter, 58×117mm P-Flex MF/LF woofer
  - Amplification: 10W HF + 30W MF/LF Class D
  - Frequency Response: 43Hz–20kHz (±3dB)
  - Max SPL: 90 ±3dB at 1m
  - Bluetooth 5.4 with aptX Adaptive, AAC, SBC
  - USB-C audio playback up to 48kHz/16-bit
  - Google Fast Pair & Microsoft Swift Pair
  - True Wireless Stereo (TWS) pairing
  - Auracast multi-speaker support
  - Battery: up to 24 hours playtime
  - Quick charge: 15 min = 3 hours playtime
  - Full charge: ~2 hours (20V/1.5A)
  - IP67 waterproof & dustproof
  - Dimensions: 216×82×59mm
  - Weight: 740 g
  - Built-in speakerphone with noise & echo cancellation
  - KEF Connect app compatible
