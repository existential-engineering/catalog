description: The 333 is a summing and distribution module for Eurorack, built
  from three identical sections that each carry a three-input summing amplifier
  and three independently buffered outputs. Because the sections are normalled
  to one another, it also works as a 1-to-9 buffered multiple.
details: |-
  The 333 is a summing and distribution module for Eurorack modular systems, laid out as three sections each with three inputs and three outputs. The three identical sections are coloured red, yellow and green, and each features a three-input summing amplifier feeding three independently buffered outputs.

  Derived directly from the CGM creative mixer series, the sum section is DC coupled, so control voltages can be summed as well as audio signals. Tolerance in both the sum and the output stages is extremely low, which makes the module suitable for summing quantized voltages such as the ones coming from the quantized outputs of the SAPÈL.

  The red and yellow outputs are normalled to the first jack socket of the yellow and green inputs respectively, so the three sections can be cascaded. That allows one signal to be sent to as many as nine outputs, turning the module into a 1-to-9 buffered multiple, or up to seven signals to be blended down to one, with every intermediate pattern available in between.

  All nine outputs are buffered to guarantee high multiplication fidelity, which keeps V/oct pitch signals accurate when they are distributed. The architecture therefore covers use as a mixer, as a buffered multiple, or as both at the same time.

  When control voltages or audio signals are particularly hot, each section's -6 dB switch halves the incoming signal exactly. Because the sections are connected, the three switches can be cascaded to reach -12 dB in the second section and -18 dB in the third.
specs: |-
  - Three identical sections, red, yellow and green, each a three-input summing amplifier with three independently buffered outputs
  - Nine inputs and nine outputs in total
  - DC-coupled sum, suitable for control voltages as well as audio signals
  - Extremely low tolerance in both sum and output stages, suitable for summing quantized voltages
  - -6 dB switch per section, cascading to -12 dB and -18 dB across the second and third sections
  - Red and yellow outputs normalled to the first input of the yellow and green sections
  - Usable as a mixer, as a buffered multiple, or both, with I/O patterns from 1-to-9 through to 7-to-1
  - All nine outputs buffered for high multiplication fidelity on V/oct signals
  - Sum design derived from the CGM creative mixer series
  - Bus-powered from the Eurorack case power bus, with no power jack of its own
