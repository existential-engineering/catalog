details: |-
  Scratch-style 2-channel professional DJ controller for multiple DJ applications (Gold). The DDJ-REV7 is built to help you get the most from the Serato DJ Pro and rekordbox performance software and boasts a brand-new design that includes large, motorized jog wheels with On Jog Display to create a tactile connection between you and your music. The layout of this 2-channel unit emulates a professional DJM-S mixer + PLX turntable setup, and includes specialized features for open-format and scratch DJs. Key features: Key Features; Large jog wheels and MAGVEL FADER for dynamic scratching; VINYLIZED JOG: Customize the feeling; On Jog Display: Keep an eye on essential information; Waveform mode; Virtual Deck mode; Artwork display; DJ Logo display.
