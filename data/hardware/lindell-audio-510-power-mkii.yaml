id: 2fZlyqFSHuLOL-V9Wc-Dm
name: 510 Power Mk2
manufacturer: lindell-audio
primaryCategory: rack-mount
categories:
  - utility
  - analog
url: https://lindellaudio.com/en/products/510-power-mkii
description: The 510 Power Mk2 is a 10-slot 500 Series compatible power supply
  with 5A of power. This model is upgraded with dSub I/O, a FEED mix switch that
  daisy chains channels without cables, and an external power supply for lower
  noise.
details: |-
  The 510 Power Mk2 replaces the original 510 Power. The latest model is upgraded with dSub I/O and a FEED mix switch that daisy chains channels without any cables, and the power supply has been changed to an external one for lower noise.

  The 510 Power is a 10-slot 500 Series compatible power supply. It features 5A of power and is a match for Lindell's own 500 Series modules, including the 6X-500, 7X-500 and PEX-500.

  The 510 Power features gold plated XLR inputs and outputs in a 3U aluminium cabinet with steel M3 threads, and ships with removable rack ears and one blank panel.
specs: |-
  - 10-slot chassis for 500-series modules
  - Lightweight aluminium enclosure with steel M3 threads
  - No-noise, high-frequency switching power supply, 90-250V
  - 500mA of power per slot
  - Power rail LED indication
  - Comes with removable rack ears and one blank panel
  - +/-16V rails
  - 48V phantom power
  - Gold plated XLR inputs and outputs
  - Overload protection
  - Short circuit protection
  - 134mm height, 3U
  - dSub I/O
  - FEED mix switch for daisy chaining channels without cables
