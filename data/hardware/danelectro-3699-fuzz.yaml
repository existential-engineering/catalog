description: "The 3699 fUZZ is a recreation of the original FOXX Tone Machine
  pedal from the 1970s, designed by Danelectro owner Steve Ridinger. Steve
  priced the FOXX Tone Machine at $49; today originals sell for $600+. Now Steve
  brings back his original circuit with some important tweaks: the octave is way
  more pronounced, the octave is foot switchable, the tone is warmer, and there
  is a 'mids boost' toggle that counteracts the mid cut of the original pedal.
  Velvet tone for sure."
details: |-
  Features a foot-switchable octave and a mids boost toggle. FOXX and TONE MACHINE are trademarks of Mark Simonsen, who is not affiliated with Danelectro.
