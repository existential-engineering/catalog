description: Named for the scenic US 290 highway that winds past the Collings
  shop through the Texas Hill Country, the 290 is a single-cutaway solid body
  electric built on Honduran mahogany with a set neck and 24 7/8" scale. Two
  Lollar P90 Soapbar pickups deliver broad harmonic richness and dynamic
  response, wired in classic 50s style with CTS 500K pots and Jupiter Vintage
  Yellow caps. The result is a refined take on vintage single-cutaway tone with
  meticulous American craftsmanship.
details: |-
  The Collings 290 draws its name from US Highway 290, which winds past the Collings workshop through the Texas Hill Country. It is a contemporary homage to classic single-cutaway rock guitars, built around a solid Honduran mahogany body and neck joined by an extra long mortise & tenon joint. The 290 features a rosewood fingerboard with ivoroid dot inlays, a 12" radius, 24 7/8" scale length, and a C-shape neck profile with a haircut peghead. Two Lollar P90 Soapbar pickups are wired in 50s style through CTS 500K pots and Jupiter Vintage Yellow caps, providing warm, harmonically rich output. Hardware includes a Kluson ABR-1 bridge, Kluson stop tailpiece (both nickel-plated zinc), and Gotoh tuners with Collings logo. The guitar ships with a high gloss nitrocellulose lacquer finish and comes with a deluxe hardshell case. A wide range of standard, non-standard, premium, and metallic finish options are available, along with custom options including alternate pickups, Bigsby, gold hardware, and left-handed configuration. The 290 S (single bridge pickup) and 290 DC (double cutaway) are related variants.
specs: |-
  - Body: Single cutaway solid Honduran mahogany
  - Body Width: 13½"
  - Body Length: 17"
  - Body Depth: 1⅝"
  - Total Length: 38½"
  - Neck: Honduran mahogany, C-shape profile, haircut peghead
  - Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Inlays: Ivoroid dots (5mm, non-tapered)
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium (18% nickel-silver)
  - Binding: None
  - Pickups: 2x Lollar P90 Soapbar
  - Controls: CTS 500K pots, Jupiter Vintage Yellow caps, 50s-style wiring
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson Stop Tailpiece (nickel-plated zinc)
  - Tuners: Gotoh with Collings logo (nickel)
  - Pickguard: Black/Cream/Black
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1046 (.010"-.046")
  - Case: Deluxe hardshell included
