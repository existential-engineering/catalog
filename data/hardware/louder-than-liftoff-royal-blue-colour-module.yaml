description: Compact analog EQ module inspired by vintage Neve 1081 channel amplifiers from 1970s recording consoles. Features discrete transistor circuitry adapted from BA306 and BA338 Neve amplifiers with a custom American-made steel output transformer designed to deliver characteristic tonal warmth.
details: |-
  Inspired by 1081 modules in vintage Neve 80 Series consoles. Discrete transistor design with tantalum capacitors. Switchable 4.7 kHz treble shelving boost (fixed 5 dB). Variable EQ boost control via C-MIX knob (0–5 dB). Supports "A" into "N" or "N" into "N" gain staging. Compatible with Chroma, Mister Focus RGB, and DIYRE Colour platforms.
