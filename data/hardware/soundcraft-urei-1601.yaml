details: |-
  A purpose built digital mixer ergonomically designed to compliment scratch djs and turntablists enabling them to maximise their creative potential. Packed with unique features such as the hi-pass filter to instantly remove turntable rumble with the touch of a button and the aural exciter to boost those tightly pressed vinyls and to accentuate your scratches. Built to survive hours of practise with fully replaceable faders and knobs and reverse / curve adjust on all faders.
