id: OPAgKGy8cLekPqgbYndag
name: "2231"
manufacturer: dbx
primaryCategory: equalizer
url: https://dbxpro.com/en/products/2231
description: Dual-channel 31-band graphic equalizer with Type III Noise
  Reduction and PeakPlus Limiter.
details: |-
  The dbx 2231 combines professional-grade equalization with innovative signal processing. It features Type III® Noise Reduction, which provides instantaneous encode/decode functionality to increase signal-to-noise ratio by up to 20 dB. The PeakPlus™ Limiter offers transparent dynamic control with threshold adjustment from 0 dBu to +24 dBu, accommodating both subtle nuance and aggressive transient taming.

  Designed for portable and touring applications, the 2231 delivers the sonic characteristics of dbx's acclaimed 30 Series EQ designs in a modern package. The unit includes dual 31-band sections with switchable ±6 dB or ±15 dB range capability, a 40 Hz high-pass filter, and comprehensive metering via dual 4-segment LED bargraphs displaying both gain reduction and output levels.

  With XLR, TRS, and barrier terminal strip connectivity, the 2231 integrates into a wide variety of professional signal chains. Operating on worldwide voltages, it is suitable for touring and installed applications alike.
specs: |-
  - Input Connectors: 1/4" TRS, XLR (female, pin 2 hot), barrier terminal strip
  - Input Impedance (Balanced): 40k ohm
  - Input Impedance (Unbalanced): 20k ohm
  - Max Input Level: >+21 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: 1/4" TRS, XLR (male, pin 2 hot), barrier terminal strip
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm; >+18 dBm into 600 ohm
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <10 Hz to >50 kHz, +0.5/−3 dB
  - THD+Noise: <0.04%, 0.02% typical at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - EQ Channels: Dual 31-band, 1/3-octave
  - EQ Range: ±6 dB or ±15 dB switchable
  - High-Pass Filter: 40 Hz, 18 dB/octave Bessel
  - Noise Reduction: Type III® instantaneous encode/decode, up to 20 dB
  - Limiter Type: PeakPlus™, threshold 0 dBu to +24 dBu
  - Operating Voltage: 100/120/230 VAC, 50/60 Hz
  - Power Consumption: 28 W
  - Dimensions: 5.25" H × 19" W × 7.9" D
