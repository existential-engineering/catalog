details: |-
  The second series Circle expands on Devin Townsend's go-to T-style guitar and equips his favorite specs. The hardware includes an Evertune bridge, a flush-mounted barrel jack, and a tone control delete.

  Aesthetics display the exclusive "Circle" inlay, one of five different colors, and a satin finish. The inlay is white acrylic, paired with standard black-ring Luminlay Super Blue side dots.

  Featuring Townsend's signature Fishman pickups, the signature model is rounded out by a roasted maple or roasted flame maple neck and 24 frets. The neck carries a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, and the truss rod cover is deleted.

  The body is alder with bolt-on construction and a radiused neck heel, fitted with a GT-style inline headstock carrying a black Kiesel logo and a string mute, black hardware, and a Richlite Diamond Black fingerboard at a 12 inch radius.
specs: |-
  - Second series of the Devin Townsend Circle, a T-style model
  - Body: alder
  - Construction: bolt-on with radiused neck heel
  - Neck: tung-oiled roasted maple with 2-way adjustable truss rod and dual carbon-fiber rods; roasted flame maple also offered
  - Fingerboard: Richlite Diamond Black with 12 inch radius
  - Frets: 24 stainless steel jumbo, .110 inch wide x .055 inch tall
  - Scale length: 25.5 inch
  - Pickups: direct-mount active Devin Townsend signature Fishman Fluence pickups, powered by an internal battery rather than an external supply
  - Electronics: master volume control, 5-way blade-style pickup selector, tone control deleted, flush mount barrel output jack
  - Bridge: Evertune
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: GT-style inline headstock with black Kiesel logo and string mute
  - Inlays: white acrylic Devin Townsend Circle inlay with standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: deleted
  - Finish: White/White in satin matte, one of five colours offered
  - Hardware: black
  - Neck width: 1.69 inch wide at the nut, 0.78 inch thick at the 1st fret, 0.88 inch thick at the 12th fret
  - Body dimensions: 38.25 inch long, 1.65 inch thick, 12.5 inch wide
  - Weight: 7.8 lbs
  - Strings: Elixir Nanoweb 1046E
