details: |-
  The Jake E Lee USA Signature Blue Burst is a USA-built signature electric guitar modeled after Jake E Lee's original Blue Burst instrument famously used during his tenure with Ozzy Osbourne on the Bark at the Moon and Ultimate Sin albums and tours.

  It features a poplar San Dimas Style 1 body in a satin Blue Burst finish, paired with a bolt-on quartersawn maple neck shaped to Jake E Lee's custom profile with rolled fingerboard edges and a hand-rubbed satin urethane finish for a broken-in feel. The 25.5" scale rosewood fingerboard carries a 12" radius, 22 Dunlop 6130 medium jumbo frets, white dot inlays, and a 1.58" nut width.

  Electronics are an HSS configuration with a customized Seymour Duncan JB Alnico II in the bridge and DiMarzio SDS-1 DP111 single-coils in the middle and neck positions, all in black. A single volume knob and 5-way blade switch keep the controls simple and tour-ready.

  Hardware includes a rounded brass Charvel hardtail bridge, brass output jack plate, Gotoh die-cast tuning machines in black, Gotoh strap buttons, a vintage-style disc string tree, and a 4-bolt serialized neck plate. The licensed Fender Stratocaster headstock and deluxe Charvel hardshell case complete the package. Strung with nickel-plated steel .009-.042 strings.
