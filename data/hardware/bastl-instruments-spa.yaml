id: FRWQvLoSNwJHROEfAYmm1
name: SPA
manufacturer: bastl-instruments
primaryCategory: utility
categories:
  - granular
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/spa
description: >-
  SPA is a discontinued Eurorack expander for the Bastl Instruments grandPA
  granular sampler, adding CV inputs for grain size, shift speed, start/end or
  attack/release, and crush on both channels A and B, plus a clock input to
  trigger grain shifts. Requires connection to grandPA via rear ribbon cable.
details: |-
  5HP width, 50mm depth. Power: +12V 25mA. Expander for grandPA module.
