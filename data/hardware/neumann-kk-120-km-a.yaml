name: KK 120
manufacturer: neumann
primaryCategory: microphone
categories:
  - condenser
url: https://www.neumann.com/en-us/products/microphones/kk-120--km-a
description: The combination of the capsule KK 120 with the output stage KM A is
  only one of the numerous options within the Neumann KM A/D small diaphragm
  microphone system.
details: |-
  Directional characteristic: figure-8

  Part of the modular microphone system KM A/D

  Comprehensive range of accessories

  Pressure gradient transducer, side-addressed

  Single 16 mm diaphragm realizing the figure-8 pattern

  Identical frequency response and sensitivity for 0° and 180°

  Suitable for MS-stereo recording when combined with other capsules/microphones

  Combines with the transformerless analog output stage KM A (P48 phantom power)

  Switchable -10 dB preattenuation allows SPL up to 152 dB (depending on capsule)

  Capsule can be detached and used at a distance from the output stage of up to 100 m (330 ft) via special cable
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional  Pattern: Figure-8, side-fire
  - Frequency  Range: 20 Hz...20 kHz
  - Sensitivity at 1 k Hz into 1 kohm: 12 mV/Pa
  - Rated  Impedance: 50 ohms
  - Rated load impedance: 1000 ohms
  - Equivalent noise level,  C C I R: 25 dB
  - Equivalent noise level,  A-weighted: 15 dB-A
  - Maximum  S P L for  T H D 0.5%: 140 dB
  - Maximum  S P L for  T H D 0.5% with preattenuation: 150 dB
  - Signal-to-noise ratio,  C C I R (re. 94 d B  S P L): 69 dB
  - Signal-to-noise ratio,  A-weighted (re. 94 d B  S P L): 79 dB
  - Supply voltage ( P48,  I E C 61938): 48 V
  - Current consumption ( P48,  I E C 61938): max. 3.5 mA
  - Matching connector: XLR 3 F
  - Weight (output stage): 70 g
  - Weight (capsule only): 37 g
  - Diameter: 24 mm
  - Length (capsule only): 40 mm
  - Length (microphone): 130 mm
