description: Infinite control over MIDI hardware and software in a compact,
  rugged footcontroller.
details: |-
  The Live Logic compact and versatile 6-button MIDI footcontroller gives you quick and easy performance control of any MIDI hardware or software platforms and plugins. MIDI over USB, assignable functions and two expression pedal inputs make it the perfect MIDI control solution and it can also be used as your USB MIDI interface. Power it anywhere via USB, 9V battery or power supply and unlock your performance.

  Customising the Live Logic MIDI Footcontroller is simple thanks to a free PC or Mac app, which allows you to customise the function of each footswitch and expression pedal and save and load configuration pre-sets. Patch mode sets up the Live Logic to send MIDI Program Change messages — Switches 1-4 send the Program Change message, and 5 and 6 will Bank Up and Bank Down, perfect for patch changing on the Silverline range or any MIDI-enabled amplifier. In Custom mode, all 6 switches can be individually configured to any type of MIDI message required, whether Program Change for changing channels, Control Change for changing individual parameters, Note for triggering samples or Clock for synchronising tempo.

  The Live Logic's MIDI over USB functionality gives effortlessly powerful performance control of DAWs, plugins and live sequencer/sampling software like Ableton Live. Live Logic can also be used as a USB MIDI interface to integrate any non-USB MIDI devices into a USB setup. It is the only footcontroller to include a free copy of Ableton's renowned Live 10 Lite software.

  Live Logic is a super-compact, fully customisable control interface that's gig-ready. Its tough metal construction with bright LEDs and display make it perfect for home or stage use. It can be powered by 9V battery, an external 9V power supply, or even directly via USB. Two integrated expression pedal inputs offer continuous control of MIDI parameters.
specs: |-
  - 6-button MIDI Footcontroller
  - 2 x expression pedal inputs
  - Controls PC, CC, Note and Clock messages
  - MIDI over USB for use with DAWs and plugins
  - PP3 battery, 9V DC and USB bus powered
  - Customisable MIDI messages via free software
  - Program Change Messages 0-127 / 1-128
  - Stage visible multi-function LED display
  - MIDI IN, MIDI OUT and USB
  - Power: 9V DC, 9V Battery or USB
  - Connections: USB, MIDI In/Out & 2x Expression Pedal Inputs
  - MIDI Messages Sent: PC, CC, Note & Clock
  - Software: Live Logic Customising App
  - Dimensions: 396 x 37 x 74mm
  - Weight: 1.2kg
  - Includes free Ableton Live 10 Lite software
