description: >-
  All-in-one powered column PA system with 2,000W Class D amplifier, 7-channel
  digital mixer, full dbx DriveRack DSP suite, Bluetooth 5.0, and JBL Pro
  Connect app control, delivering 130 dB max SPL with consistent front-to-back
  coverage.
details: |-
  The PRX ONE delivers unrivaled sonic performance through 12 custom-engineered 2.5-inch HF drivers working in combination with JBL A.I.M. geometrically optimized array-shading technology. Custom HF transducers feature copper-capped pole pieces to reduce inductance for smoother high-frequency response with less power compression. High-frequency performance is optimized down to 500 Hz, allowing the 12-inch bass-reflex woofer to deliver accurate bass sound extending to 35 Hz.

  The 2,000-watt (peak) fully bridged Class D amplifier with power factor correction delivers clean, stable power across 100–230 V AC. High-quality, high-linearity inductors improve efficiency and minimize total harmonic distortion.

  PRX ONE integrates a Soundcraft-designed 7-channel dual-mode digital mixer: Channel Strip Mode provides hardware control of gain, EQ, and effects per channel, while Mix Mode manages the full 7-channel mix. Built-in Lexicon effects (reverb, delay, chorus, echo, sub synth) and dbx DriveRack technology — including AFS Pro Automatic Feedback Suppression, 8-band master EQ, system limiter, gates, and per-channel compressors — deliver studio-quality dynamics processing.

  Connectivity includes four XLR Combo jacks with +48V phantom power on two channels, two 1/4-inch Hi-Z inputs, a 1/8-inch stereo/BT summed input, and an XLR pass-through output with up to 100 ms of delay. Bluetooth 5.0 enables audio streaming and remote control of up to 10 units via the JBL Pro Connect app (iOS and Android).

  A full-color LCD screen with 8 user presets provides on-unit access to all DSP, EQ, and mixer functions.
specs: |-
  - Woofer: 12"
  - Tweeters: 12 × 2.5"
  - Max SPL: 130 dB
  - Frequency Range (-10 dB): 35 Hz – 20 kHz
  - Frequency Range (-3 dB): 40 Hz – 20 kHz
  - Horizontal Dispersion: 130°
  - Vertical Dispersion: 30°
  - Power Rating: 2,000 W Peak / 1,000 W RMS
  - AC Power Input: 300 W, 100–230 V AC, 50–60 Hz
  - Crossover Frequency: 260 Hz
  - I/O: 4 × XLR Combo (48V on 2 channels), 2 × 1/4" Hi-Z, 1 × 1/8" stereo/BT, 1 × XLR pass-through
  - Cabinet: Polypropylene (PP)
  - Net Weight: 25.7 kg (56.6 lbs)
  - Dimensions (H×W×D): 850 × 482 × 647 mm (33.4 × 18.9 × 25.4 in)
