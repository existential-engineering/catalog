name: Sequential Switch V2
manufacturer: erica-synths
primaryCategory: utility
categories:
  - discontinued
  - modular
  - routing
  - sequencer
hp: 10
url: https://www.ericasynths.lv/sequential-switch-v2-73/
description: Erica Synths 8 channel Sequential Switch is a unique module that
  allows you to sequence up to eight sound sources in advanced ways or route one
  sound source sequentially to eight different sound modifiers – VCFs,
  waveshapers, VCAs, etc.
details: |-
  The Erica Synths Sequential Switch routes eight inputs or outputs sequentially to one common jack, so it can sequence up to eight sound sources or send one source through eight different sound modifiers such as VCFs, waveshapers and VCAs.

  Its control interface allows steps to be paused, skipped and merged and the sequence length to be set, but what really sets it apart from other sequential switches is the gate output, which reacts on merged and paused steps. Used with an ADSR and a VCA, that gives a powerful sequencer with real time control over each sound source in the sequence. There are eight play modes plus a piano mode, and manual Step and Reset controls on the panel.

  Driven from a random clock source, the module becomes the heart of insane random, self-generating patches. Note that the input signal level should not exceed 20Vptp, which is a rare occasion in modular synths. Nothing bad happens above that, but some unwanted signal becomes audible on unused outputs.

  The panel is 10HP wide and the module is 20mm deep, drawing +50mA with all LEDs on and -13mA from the eurorack bus.
specs: |-
  - 8 inputs/outputs sequentially routed to one input/output
  - Manual Step and Reset
  - Gate output (reacts on merged and paused steps)
  - 8 different play modes
  - Piano mode
  - Max input level -10V to +10V
  - Power consumption +50mA (all LEDs on), -13mA
  - Module width 10HP
  - Module depth 20mm
