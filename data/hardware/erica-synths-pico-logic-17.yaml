description: Erica Synths Pico LOGIC is a Boolean logic module that allows yout
  to manage several Gate signals in advanced ways.
details: |-
  Pico LOGIC is a Boolean logic module for managing several gate signals in advanced ways. It carries two independent sections, each with two inputs and one output, and 8 logic algorithms in each section, so 2x8 algorithms are squeezed into a 3HP panel.

  The inputs of both sections can be connected internally, which lets one pair of gates drive two algorithms at once. The selected mode is indicated by RGB LEDs and each output has its own signal status LED.

  The inputs do not work with stackable cables. Input signal level runs from a 2.5V minimum to a 10V maximum and outputs swing between 0V and 5V.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep.
specs: |-
  - 2 independent sections of 2 inputs and 1 output
  - 8 logic algorithms in each section
  - Internal connection of inputs of both sections
  - Mode indication via RGB LEDs
  - Output signal status LEDs
  - Inputs do not work with stackable cables
  - Max input signal level 10V
  - Min input signal level 2.5V
  - Output signal level 0 or 5V
  - Power consumption +22mA, -5mA
  - Module width 3HP
  - Module depth 35mm
