name: TYPE 05 A-CORE
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-05-a-core
description: 'A compact 2-way active monitor with a pure analog signal path, the
  TYPE 05 A-CORE pairs HEDD''s AMT tweeter with a 5" honeycomb woofer for clear
  mids and highs and bass down to 43 Hz.'
details: |-
  The TYPE 05 A-CORE pairs HEDD's signature Air Motion Transformer tweeter with a 5-inch custom honeycomb woofer, creating a compact solution for nearfield applications and portable studio setups. Its pure analog signal path eliminates converters and software dependencies, making it ideal for users who prioritize low-latency, straightforward workflows.

  A tuned analog filter board enables natural frequency distribution alongside continuously variable high and low shelving EQ (±6 dB) for room and taste customization. The plug-and-play design incorporates multiple input options and a physical front-panel standby switch, simplifying integration into diverse studio configurations.

  Construction emphasizes Berlin-based engineering and assembly using premium components. The cabinet uses heavy-duty MDF with a black satin finish and front-panel LED indicators, and the speaker is mounting-ready for Atmos installations. Each unit includes a 5-year warranty following registration.
specs: |-
  - Configuration: 2-way active nearfield monitor, pure analog signal path
  - Woofer: 5" custom honeycomb compound
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequency: 2,500 Hz
  - Frequency response: 43 Hz - 50 kHz
  - Maximum SPL: 112 dB per pair at 1 m
  - Amplification: 2 x 100 W ICEpower Class D
  - Shelving EQ: hi/low, ±6 dB continuous
  - Cabinet: heavy-duty MDF, black satin finish
  - Dimensions: 308 x 180 x 245 mm
  - Weight: 6.2 kg (net) per unit
