description: A CEM3340-based Eurorack triangle-core oscillator offering a wide
  frequency range, four waveform outputs, V/OCT tracking, linear FM, and
  switchable hard or soft sync.
details: |-
  CEM3340 Based Oscillator

  A triangle core oscillator that is based on the same CEM3340 chipset used in legendary synths (SH-101, Prophet 5, MemoryMoog). Offers a wide frequency range from 80s cycles up to 40kHz. Printable version of the infographic .
specs: |-
  - Four waveform outputs (TRI, SAW, PULSE, SINE)
  - V/OCT tracking over 5+ octaves
  - Linear FM with attenuator
  - Choice of hard sync or soft sync (set via jumper on back)
  - PWM attenuator and input (normalled to 5V)
  - LFO/VCO switch will change from audio rate to LFO rate (choice of two LFO timings, 8 sec or 80 sec, via jumper on the back)
