details: |-
  Beats and loops is a free drum machine/ loop creator/ beat maker designed for
  putting beats together on the go. Choose beats, sequence loops, then keep
  building new parts until you are ready to export it as a high quality wav
  file.

  A mixer panel allows panning and individual voice adjustment for full stereo
  loops.

  This app uses pdlib for sound generation.
specs: |-
  - Drum machine
  - Loop creator
  - Beat maker
  - 2, 3 or 4 beats per bar
  - 2, 3 or 4 subdivisions per beat
  - Adjustable tempo
  - Bounce and mix multiple parts
  - Groove adjustment
  - Mixer with panning
  - Individual voice adjustment
  - Stereo loops
  - Classic 909 drum machine samples
  - Wav file export
  - Android
  - Ad-supported
