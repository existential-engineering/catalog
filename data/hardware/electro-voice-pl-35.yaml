description: The PL-35 is a professional-grade supercardioid dynamic microphone
  voiced for the power, punctuation, and natural tones of snare drums and
  tom-toms in both live sound reinforcement and studio applications. A
  supercardioid polar pattern delivers strong isolation from surrounding kit
  pieces and stage bleed, while a powerful neodymium magnet structure preserves
  transient detail and dynamic range under the heavy attack of close drum
  miking. The die-cast zinc case with textured satin black finish stands up to
  road use, and the included DRC-1 drum rim clamp secures the mic to the rim for
  fast, repeatable placement. Frequency response of 50 Hz - 16,000 Hz and
  balanced low-Z output via 3-pin XLR.
details: >-
  Dynamic element voiced for snare drums and tom-toms


  Supercardioid polar pattern for excellent isolation from surrounding
  instruments


  Powerful neodymium magnet structure for strong output and transient detail


  Frequency response 50 Hz - 16,000 Hz


  Balanced low-Z output via 3-pin XLR


  Passive design - no phantom power required


  Die-cast zinc case with textured satin black finish


  Built for live sound reinforcement and studio drum miking


  Includes DRC-1 drum rim clamp for secure, tool-free mounting
