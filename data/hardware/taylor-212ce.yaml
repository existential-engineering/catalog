description: A compact Grand Concert acoustic-electric featuring a solid
  torrefied spruce top with layered walnut back and sides, Venetian cutaway, and
  built-in Expression System 2 electronics suited for both stage and studio use.
details: |-
  The 212ce is part of Taylor's 200 Series, built around a Grand Concert body shape with a Venetian cutaway and Expression System 2 onboard electronics. The torrefied spruce top provides clarity and warmth from the first note, while layered walnut back and sides deliver rich, warm hues and consistent tone.

  The Neo-Tropical Mahogany neck features a Standard Carve profile, and the West African Crelicam Ebony fretboard offers a smooth playing surface with 4mm Faux Pearl dot inlays. The 24-7/8" scale length and 1-11/16" nut width make it approachable for players of all skill levels.

  Taylor's Expression System 2 features a behind-the-saddle pickup that captures the guitar's natural dynamic range. The guitar ships with a gig bag and is backed by Taylor's Limited Lifetime Warranty.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Spruce (solid)
  - Back/sides: Walnut (layered)
  - Bracing: X-Bracing
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Nut width: 1-11/16"
  - Electronics: Expression System 2 (ES2)
  - Finish: Matte
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Body binding: White
  - Pickguard: Tortoise
  - Case: Gig bag included
