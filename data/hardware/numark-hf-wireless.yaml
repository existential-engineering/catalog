details: |-
  Music is who you are, right? You live it, you breathe it, and it's central to everything you do. That means your headphones are indispensable. You gig with your headphones and you relax during your down time with your headphones. Now, with our HF Wireless Headphones, you can do both without carrying two sets with you and switching them around. That's because these phones work two ways — with a cable for your professional DJ work and wirelessly for your relaxation time.

  Our HF Wireless Headphones free you from the restrictions of a traditional fixed-length headphone cable and let you move while you're listening.

  The Numark HF Wireless headphones provide superb audio performance, great wireless range and an "all night long" battery that really delivers on its promise. The key to its superior wireless streaming is its Bluetooth 4.0 technology with NFC pairing, so its signal connection is always strong and clear. The HF Wireless has a wireless range of over 30 feet for great freedom of movement while you keep track of the musical action. In addition, the unit's built-in rechargeable battery gives you up to 10 hours of music playback on a single charge.

  Other thoughtful touches that make HF Wireless a pleasure to use are the on-ear cup for great bass response and outstanding noise isolation, a compact, collapsible design with built-in microphone and wide-range 40mm drivers that deliver detailed, articulate sound and well-defined bass. The headphones have a 32-ohm impedance, so you can easily drive them to loud levels from low-output devices. Plus, the HF Wireless headphones come with a 4 ft. cable with 1/8-inch stereo plug.
specs: |-
  - Bluetooth 4.0 technology with NFC pairing for superior wireless streaming
  - Operate in wireless or wired mode with detachable cord
  - Compact, collapsible design with built-in microphone
  - Onboard microphone, volume and track search controls for enhanced Bluetooth control
  - Wireless range 10m (over 30 feet), music playback time up to 10 hours
  - Wide-range 40mm drivers deliver detailed, articulate sound
  - Frequency response 60-20 kHz
  - 32 ohm impedance works well with low-output devices
  - Rotating earcup provides hands-free, single-ear monitoring
  - Plush padded leatherette earpieces ensure long-term comfort
  - Includes 4 ft. detachable cable with 1/8-inch stereo plug
