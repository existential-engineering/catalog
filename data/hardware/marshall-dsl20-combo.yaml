description: All-round 20W all-valve guitar combo from Marshall's DSL (Dual
  Super Lead) series. The DSL20 Combo pairs two channels (Classic Gain and Ultra
  Gain), a tone-shift switch, and digital reverb with a series effects loop and
  a 12" Celestion Seventy 80 speaker. A pentode/triode-style power reduction
  switch drops output from 20W to 10W for lower-volume use, and an emulated line
  out plus standby mode enables silent recording. Three speaker outputs (16Ω /
  8Ω) cover combo and external-cabinet rigs alike.
details: |-
  The DSL20 Combo has a 12" Celestion Seventy-80 speaker for those who require extraordinary tone and versatility. Unleash your alter ego and create more bite and punch to your tone, with the functionality rich EQ.

  The DSL20 Combo gives you full control over the volume. Choose between 20W and 10W power output at the flick of a switch. The amp is perfect for a variety of different playing situations and environments, letting you take the stage wherever you go.

  The DSL20 Combo has two gain channels, ultra gain and classic gain, giving you greater versatility in tone shaping. These channels typically feature varying amounts of gain and distortion, allowing you to transition between cleaner tones and heavier overdriven or distorted sounds without having to substantially alter settings.

  The three speaker outputs allow you to experiment with different speaker configurations to discover the best sound for your playing style, genre or performance location. This adaptability enables customisation to your specific tastes and also provides the ability to record.

  With its three speaker outputs, the DSL20 Combo has the ability to record and a standby function for silent recording. Simply connect your amp to a recording device through the line out and keep the standby switch in off mode. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: DSL20CR
  - Range: DSL
  - Technology: All-valve
  - Channels: 2
  - Output wattage: 20W (with power reduction option, 10W)
  - Outputs: Speaker outputs 3 x 1/4" jack sockets (16Ω load / 8Ω load), 1 x 3.5mm jack emulated line out
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5mm jack aux in, footswitch
  - Controls: Classic gain channel gain and volume, channel select switch, ultra gain channel gain and volume, tone shift switch, treble, middle, bass, presence, reverb
  - Effects: Digital reverb
  - Effects loop: Yes, 1 x series
  - Speaker configuration: 1x12"
  - Speaker model: Celestion Seventy 80 speaker (16Ω, 80w)
  - Unit impedance: 16Ω
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 16.3 kg / 36 lb
  - Width: 500 mm / 19.7"
  - Height: 420 mm / 16.5"
  - Depth: 250 mm / 9.8"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90012 footswitch included, detachable power cable included
