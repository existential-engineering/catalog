description: All-round 20W all-valve guitar combo from Marshall's DSL (Dual
  Super Lead) series. The DSL20 Combo pairs two channels (Classic Gain and Ultra
  Gain), a tone-shift switch, and digital reverb with a series effects loop and
  a 12" Celestion Seventy 80 speaker. A pentode/triode-style power reduction
  switch drops output from 20W to 10W for lower-volume use, and an emulated line
  out plus standby mode enables silent recording. Three speaker outputs (16Ω /
  8Ω) cover combo and external-cabinet rigs alike.
details: |-
  - 20W all-valve guitar combo with switchable power reduction to 10W
  - Two channels: Classic Gain and Ultra Gain
  - Tone Shift switch for re-voicing the mid-range
  - Built-in digital reverb
  - Series effects loop
  - Emulated line out (3.5mm) for silent recording via standby mode
  - Three 1/4" speaker outputs (16Ω / 8Ω)
  - 1 x 12" Celestion Seventy 80 speaker
  - Preamp: 2 x ECC83 + 1 x ECC83 phase splitter; power amp: 2 x EL34
  - Includes PEDL-90012 footswitch and detachable power cable
specs: |-
  - Model: DSL20CR
  - Range: DSL
  - Output Wattage: 20W (with power reduction option, 10W)
  - Channels: 2 (Classic Gain, Ultra Gain)
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Controls: Classic Gain channel Gain and Volume, channel select switch, Ultra Gain channel Gain and Volume, Tone Shift switch, Treble, Middle, Bass, Presence, Reverb
  - Effects: Digital reverb
  - Effects Loop: Yes, 1 x series
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5mm jack Aux in, footswitch
  - Outputs: Speaker outputs: 3 x 1/4" jack sockets (16Ω load / 8Ω load), 1 x 3.5mm jack emulated line out
  - Speaker Configuration: 1x12"
  - Speaker Model: Celestion Seventy 80 speaker (16Ω, 80W)
  - Product Height: 420 mm / 16.5"
  - Product Width: 500 mm / 19.7"
  - Product Depth: 250 mm / 9.8"
  - Weight: 16.3 kg / 36 lb
  - Box Contents: Footswitch PEDL-90012 included; detachable power cable included
  - Country Of Origin: Designed and engineered in UK. Made in Vietnam.
