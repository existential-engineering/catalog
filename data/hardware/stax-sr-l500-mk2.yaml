name: SR-L500 MK2
manufacturer: stax
primaryCategory: headphones
description: A push-pull electrostatic earspeaker featuring an exchangeable
  cable structure and aluminum case holder designed for improved comfort and
  fit. The MK2 model includes a parallel 6-strand low-capacity HiFC cable and a
  curved case holder that enhances adhesion for better low-frequency
  reproduction.
specs: |-
  - Type: Push-pull electrostatic, oval sound element, rear open-air type enclosure
  - Frequency response: 7 – 41,000 Hz
  - Electrostatic capacitance: 110 pF (including attached cable)
  - Impedance: 145 kΩ (including attached cable, at 10 kHz)
  - Sound pressure sensitivity: 101 dB / input 100 Vr.m.s. / 1 kHz
  - Maximum sound pressure level: 118 dB / 400 Hz
  - Bias voltage: DC 580 V
  - Ear pad: High-quality artificial leather
  - Cable: Parallel 6-strand, 2.5 m full length, low-capacity special wide cable (HiFC)
  - Weight: 479 g (including attached cable), 351 g (without cable)
