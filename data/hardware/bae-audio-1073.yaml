description: The BAE 1073 is an authentic recreation of the classic vintage
  microphone preamplifier and equalizer, featuring the same St Ives (Carnhill)
  transformers as the original vintage modules, Elma switches, and Canford wire.
  It will retrofit directly into vintage Neve 80 Series consoles due to
  identical chassis construction, connectors, PCB layouts, hand-wired looms, and
  circuitry.
details: |-
  The BAE 1073 is as authentic as you can get to the original vintage Neve 1073 module, featuring the same St Ives (Carnhill) transformers as the vintage modules, original Elma switches, and Canford wire. The product looks identical to the original vintage module and will happily retrofit in vintage Neve 80 Series consoles because the entire product is engineered in exactly the same way as the originals.

  The equalizer section offers comprehensive frequency shaping across three bands. The high-frequency band provides ±16dB of fixed shelving at 12kHz. The low-frequency band provides ±16dB of shelving with selectable frequencies at 35Hz, 60Hz, 110Hz, and 220Hz. The mid-range band provides ±18dB of peaking with selectable center frequencies at 0.36kHz, 0.7kHz, 1.6kHz, 3.2kHz, 4.8kHz, and 7.2kHz. A high-pass filter with an 18dB/octave slope offers switchable corner frequencies at 50Hz, 80Hz, 160Hz, and 300Hz.

  The preamp stage delivers up to 80dB of gain with an equivalent input noise of -110dBu (unweighted, 300kHz bandwidth), a CMRR of 100dB minimum at 60Hz, and a maximum output level of +27.4dBu into 600Ω. The unit accepts mic input impedances of approximately 1200/300 ohms, a line input impedance of 10k ohms, and a DI input impedance of approximately 150k ohms.

  The 1073 is available in two form factors: a 19-inch 1RU rackmount version and a standalone module. Both use the same circuitry. The rackmount version ships with or without the companion 24V power supply. A black faceplate cosmetic option is available for both formats.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Mic Input Impedance: ≈1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ≈150k ohms
  - Output Impedance: 35 ohms
  - CMRR: 100dB min @ 60Hz
  - Max Output Level: +27.4dBu @ 600Ω
  - Gain Range: 0 to 80dB
  - Equivalent Input Noise: -110dBu (unweighted, 300kHz BW)
  - High Frequency EQ: ±16dB shelving at 12kHz
  - Low Frequency EQ: ±16dB shelving, selectable 35Hz / 60Hz / 110Hz / 220Hz
  - Mid Range EQ: ±18dB peaking, selectable 0.36kHz / 0.7kHz / 1.6kHz / 3.2kHz / 4.8kHz / 7.2kHz
  - High Pass Filter: 18dB/octave, switchable 50Hz / 80Hz / 160Hz / 300Hz
  - Transformers: St Ives (Carnhill)
  - Switches: Original Elma
  - Wire: Canford
  - Power Requirements: 115/230 VAC, 28W
  - Module Dimensions: 45mm W × 8.75" H × 10.5" D
  - Rackmount Dimensions: 19" W × 1.75" H × 9" D
  - Rackmount Weight: 12 lbs
