description: Ideal for tracking, mixing and mastering, the VT-7 is a stereo/dual
  mono vacuum tube compressor with an all Class-A vacuum tube audio path. Its
  gain reduction elements duplicate the sound and characteristics of classic
  vacuum tube compressors, while the Pulse Width Modulation (PWM) control
  circuitry is modern solid-state analog.
details: |-
  Ideal for tracking, mixing and mastering, the VT-7 features an all Class-A vacuum tube audio path, like all D.W. Fearn products. The gain reduction elements utilize circuitry that duplicates the sound and characteristics of the finest classic vacuum tube compressors, without depending on esoteric tubes that are no longer manufactured, while the Pulse Width Modulation (PWM) control circuitry is modern solid-state analog.

  Designed to deliver a highly transparent sound, the VT-7 can be used more aggressively if desired, with artifacts of the compression process substantially diminished when compared to most other compressors.

  In use, the two channels may be used independently or linked for stereo, while a third position on the Link switch inserts a high-pass filter (HPF) in the side-chain to reduce the gain-reduction sensitivity of the VT-7 to low frequencies. This is a gentle roll-off, nominally at 100Hz, allowing a bass-heavy mix to have a better frequency balance and avoids heavy low-frequency audio from modulating the audio level.

  Renowned for its ability to add a magical gloss to rock and pop mixes, the VT-7 is also transparent enough to add a touch of gain control to jazz and classical tracks with no obvious effects other than a significant improvement in the overall sound of the mix.
specs: |-
  - Selectable Stereo/Dual Mono operation
  - High Pass Filter on switchable Sidechain
  - Threshold
  - Gain
  - Attack
  - Release
  - Harder/Softer
  - Input 600 ohm source (nominal) balanced or unbalanced
  - Input Load Impedance 32k ohms, transformer balanced bridging
  - Nominal Input Level +4 dBm
  - Maximum Input Level @ 20 cps +25 dBm
  - Gain unity to +15dB
  - Frequency Response ± 0.2 dB 20 cps to 20 kc ± 0.5 dB 11 cps to 28 kc -3 dB @ 0.5 cps & 65 kc
  - THD + Noise <0.05% 20 cps to 20 kc
  - Signal to Noise Ratio 78 dB minimum
  - Output low-Z, transformer balanced
  - Output source impedance 115 ohms
  - Maximum Output Level +22 dBm into bridging input balanced or unbalanced
  - Gain Reduction Range 0 to 20dB
  - Power Requirements 115 or 230 VAC 50/60Hz, 85 W
  - Dimensions 19" (48.5 cm) W 5.25" (13.5 cm) H 13" (23 cm) D
  - Weight 22 lbs (9.55 kg)
