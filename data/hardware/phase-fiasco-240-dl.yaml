details: |-
  Built on the powerful Daisy Seed platform, the 240 DL is a Eurorack distortion and FX module that takes inspiration from the legendary Volvo 240, a Swedish icon of durability, grit, and no-nonsense character. Just like the car, this module isn't about polish, it's about raw personality, stubborn reliability, and a touch of Nordic eccentricity.

  The 240 DL is a Eurorack multi-effect distortion module built on the Electrosmith Daisy Seed platform and developed in C++ for optimized performance and stability. It doesn't just add distortion. It gives your signal the attitude of a roaring old-school machine built for endless miles.

  Its processing chain combines compression, modal filtering, overdrive, sample reduction, bitcrushing, notch filtering, and reverb, giving a wide spectrum of sound shaping, from subtle harmonic enhancement to highly degraded, textural distortion. Each stage is internally routable, allowing for complex interaction between dynamic control, filtering, and time-based effects.

  This isn't a pristine sports car module. It's a Volvo 240 of distortion: boxy, stubborn, and ready to survive anything you throw at it.
specs: |-
  - 10 HP
  - 31mm depth
  - Power consumption: +12V=58mA, -12V=60mA, +5V=0mA
  - Built on the Daisy (SM) platform using C++
  - Precision DSP coding for consistent results and low latency
  - Internal modulation paths enabling dynamic control without external CV
  - Stereo signal flow with additional noise sources (white and dust) for expanded timbral possibilities
  - Configurable routing for both subtle processing and aggressive signal destruction
