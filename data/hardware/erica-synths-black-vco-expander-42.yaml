description: Erica Synths Black VCO Expander essentially is an advanced waveform
  mixer plus two octaves down suboscillator, it allows you to explore wave
  design in brand new areas.
details: |-
  The Black VCO Expander is an advanced waveform mixer plus a two octaves down suboscillator, opening up areas of wave design the host oscillator cannot reach on its own.

  A waveform mixer and inverter sits behind a sine, triangle and Tits waveform switch. The transistor-based -2 octave suboscillator crossfades against the -1 octave sub, a lowpass filter shapes the suboscillator, a diode limiter holds the output signal amplitude, and three outputs run simultaneously.

  This expander module can be connected only to the Black VCO and the Black VCO2. It will not work as a standalone eurorack module.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.
specs: |-
  - Waveform mixer and inverter
  - Sine, triangle and Tits waveform switch
  - Transistor-based -2 octave suboscillator
  - -1 and -2 octave suboscillator crossfade
  - Suboscillator lowpass filter
  - Diode limiter on output signal amplitude
  - Three simultaneous outputs
  - Connects only to the Black VCO and Black VCO2, not standalone
