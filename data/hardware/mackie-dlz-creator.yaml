description: Content Creation Studio with Mix Agent Technology for podcasting
  and live streaming.
details: |-
  The DLZ Creator Adaptive Digital Mixer for Podcasting and Streaming transforms its on-screen controls to meet the user's creative style or skill level, without compromising processing power or sound quality. Three work modes are offered: Easy, a no-fuss interface that is the fastest path to a first podcast, Enhanced, with expanded control over sound and mix, and Pro, which is totally customizable.

  Mix Agent is a personal audio assistant that guides the user through setup and sound check, including setting gain levels. AutoMix manages levels for up to four mics so everyone can be heard even when they speak at the same time, and Mix Minus with a Bluetooth-connected smartphone lets a caller join the mix with no audible echo.

  Onyx80 mic preamps provide up to 80 dB of gain. Audio processing includes a 3-band parametric EQ with high-pass filter, noise gate, de-esser, compressor, Atomizer Reverb and Chronotronic Delay. Four independent headphone outputs each have their own level control and can carry custom mixes in Pro mode.

  Recording and streaming go to a computer over USB-C as a 14x4 interface, or straight to MicroSD or a USB thumb drive for a self-contained multitrack setup. Multi-colored pads trigger samples from eight memory banks and can also fire controls such as censor, duck and fade.

  Firmware 1.2 added enhanced sample pads and voice-changing FX including Robot, Disguise and Telephone, NDI support for dual-PC setups and remote collaboration between DLZ Creators in different locations, and interface languages including English, Chinese (Simplified Mandarin), Japanese, Korean, French, German, Italian, Spanish and Portuguese.
specs: |-
  - 10.1 inch high-resolution full-color touch display with anti-glare coating
  - 4 discrete XLR/TRS combo inputs with Onyx80 mic preamps, up to 80 dB gain
  - Stereo channel with dual 1/4 inch TRS inputs
  - Stereo channel with 1/8 inch TRS connection
  - Stereo bi-directional Bluetooth 5.0 channel
  - 14x4 USB-C audio interface to Mac/PC
  - Sample Rate: 48 kHz
  - A/D/A Bit Depth: 24-bit
  - System Latency: approximately 3 ms
  - Equivalent Noise: -143.4 dBV (A-weighted)
  - Input Impedances: 4 kohm balanced (microphone), 10 kohm balanced (instrument), 5 kohm unbalanced (instrument)
  - Line Output Maximum Level: 14 dBu
  - Headphone Output Power: 30 mW
  - Multitrack recording to MicroSD (12 channels plus main mix, 24-bit / 48 kHz) and to USB-A removable drive
  - Data Transfer: Integrated SD 3.0 104 MB/s
  - Network Connectivity: Ethernet 10/100
  - 5 dynamically color-coded rotary controls and 9 professional 100 mm faders
  - Backlit mute, solo, sample trigger and nav buttons
  - Power: 18V DC, 1.5A, hard power switch and locking power connector
  - Dimensions: 4.1 in / 103 mm (H) x 13.0 in / 330 mm (W) x 15.0 in / 381 mm (D)
  - Weight: 6.1 lb / 2.8 kg
