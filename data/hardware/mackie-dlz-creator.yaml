description: Adaptive Digital Mixer for Podcasting and Streaming. The DLZ
  Creator enables you to get the results you want—faster than ever.
details: |-
  The DLZ Creator Adaptive Digital Mixer for Podcasting and Streaming enables you to get the results you want—faster than ever.

  Inspired in part by smartphone and DSLR cameras that make great results accessible to anyone, DLZ Creator transforms the on-screen controls to meet your creative style or skill level.

  DLZ Creator harnesses decades of Mackie expertise, making every detail count for your productions. From Onyx80 preamps that make even low-output mics sound both loud and pristine, to professional audio processing including 3-band parametric EQ, noise gate, de-esser, compressor, reverb and delay.

  As a content creator, you know that flexibility is key. Record or stream to a computer via USB-C, or skip the computer and record full multitrack audio to an SD card.
specs: |-
  - 10.1" high-resolution full-color touch display with anti-glare coating
  - 4 discrete XLR/TRS combo inputs with Onyx80 mic preamps (up to 80dB gain)
  - Stereo channel with dual 1/4" TRS inputs
  - Stereo channel with 1/8" TRS connection
  - Stereo bi-directional Bluetooth channel
  - 14x4 USB-C audio interface to Mac/PC
  - 5 dynamically color-coded rotary controls
  - 9 professional 100mm faders
  - 4 independent headphone outputs with individual level control
  - Mix Agent guided setup with three work modes: Easy, Enhanced, Pro
  - AutoMix technology
  - Professional audio processing: 3-band parametric EQ, noise gate, de-esser, compressor, reverb, delay
  - Sample pad triggers with 8 memory banks
  - Voice-changing FX (Robot, Disguise, Telephone)
  - Multitrack recording to MicroSD and USB thumb drive
