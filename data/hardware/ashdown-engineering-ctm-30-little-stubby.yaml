description: "The CTM-30 Little Stubby is the next step in Ashdown's CTM
  (Classic Tube Magnifier) bloodline, an evolutionary step forward from the
  classic LB-30/CTM-30 that packs all-valve bass tone into a highly compact
  package. Producing 30 watts from 4 x EL84 output valves, it is all about
  purity of tone combined with real-world versatility: input gain and master
  volume span deep cleans to heavily overdriven contemporary tones, while a
  unique Feedback control reshapes the amp's character from old-school vintage
  voicing to tighter, more mid-heavy modern tones. A well-considered three-band
  EQ and an FX send/return round out the feature set."
details: |-
  Compact all-valve bass amplifier head in the CTM (Classic Tube Magnifier) line, an evolution of the LB-30/CTM-30. 30 watts from 4 x EL84 output valves. Input gain and master volume controls, a unique Feedback control to reshape the amp's character (vintage to modern), a three-band EQ, and an FX send/return for inserting modulation/time-based effects into the power amp. Note: direct purchases not available in the United States (local dealers only).
specs: |-
  - Power output: 30 watts (all valve)
  - Output valves: 4 x EL84
  - Controls: input gain, master volume, Feedback (character control), three-band EQ
  - FX send and return
  - Compact format
