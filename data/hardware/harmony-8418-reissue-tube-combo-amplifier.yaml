description: The Harmony 8418 Reissue is a hand-wired tube combo amplifier with
  a 6" Jensen Alnico speaker, recreating the warm vintage tones of the original
  1950s design.
details: |-
  The Harmony 8418 Reissue Tube Combo Amplifier returns as a limited edition release, boasting the same classic looks, circuitry and hand-wired construction as the original 8418. This faithful reproduction features a compact and versatile design that feels right at home whether it's in the living room or a small studio. Carefully selected 6V6 vacuum tubes recreate the unmistakably sweet and warm tones of the '50s, while a made-in-Italy 6" Jensen Alnico speaker offers full and responsive sound that's sought after in the world of vintage blues, jazz, rock and more. All components — from capacitors to the made-in-USA output transformer — have been sourced by Harmony's engineers and are of the highest quality.
specs: |-
  - Technology: Point to point hand-wired and assembled in Singapore
  - Channels: 2 input channels
  - Power tube: 6V6
  - Rectifier tube: 5Y3GT
  - Preamp tube: 6SJ7
  - Output wattage: 5W
  - Inputs: 2 x 1/4" jack instrument input
  - Controls: Volume
  - Speaker configuration: 6" Jensen Alnico Driver, P6V, 4Ω
  - Materials: Plywood construction, Tolex wrapping
  - Dimensions: 12" x 15" x 8.7" / 305 x 380 x 220 mm
  - Weight: 13.9lbs / 6.3kg
