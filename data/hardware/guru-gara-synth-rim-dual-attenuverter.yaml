details: |-
  The Rim Dual Attenuverter Eurorack Complete Kit is an essential DIY utility module designed to give you precise control over your control voltages and audio signals. This complete kit includes the PCB, front panel, and all required electronic components, making it an ideal choice for builders who want everything included in one package while saving time on sourcing parts from multiple suppliers. To streamline the build process and ensure consistent performance, all essential SMD components are professionally assembled at the factory. The builder completes the module by installing the through-hole (THT) components, offering a satisfying DIY experience without the complexity of SMD soldering. This approach significantly reduces build time and lowers the risk of assembly errors, making it a reliable and time-saving option for both new and experienced DIY builders. Concept & Design

  The name Rim is inspired by the event horizon of a black hole; the ultimate point of equilibrium where things are pulled either in or out, positive or negative. Mirroring this concept, the module features a beautifully symmetrical layout. When the potentiometers are in the middle position, the output is completely silent. Turning the pot clockwise increases the normal signal output, while turning it counterclockwise delivers an inverted, increased version of your signal. Additionally, the top attenuverter is normalled to an internal +5V reference. When no input jack is inserted, it transforms into a steady, standalone control voltage generator capable of sweeping from -5V to +5V. Key Features

  Included Components

  Modulation & Utility Control

  The Rim Dual Attenuverter is a Swiss Army knife for your modular system. Whether you need to scale back an overpowering LFO, invert an envelope for creative modulation, or use the top channel as a manual offset generator to open a filter, Rim provides precise, predictable attenuation and inversion in a highly compact footprint. DIY Build & Assembly

  The PCB is clearly labeled to assist with assembly, and the pre-assembled SMD components significantly reduce build time and difficulty. All remaining components are through-hole and straightforward to install. The front panel is made from high-quality PCB material with a black solder mask, factory-printed white markings, and gold-plated (ENIG) exposed copper, delivering a durable, modern, and professional appearance that perfectly matches a clean, dark aesthetic. Technical Specifications

  This full kit offers a complete, high-quality build experience, delivering crucial signal routing flexibility and utility with a refined, modern aesthetic.
specs: |-
