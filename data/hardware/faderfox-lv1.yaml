description: LV1 is the Ableton Live controller of the Faderfox micromodul 1st
  generation, controlling 16 tracks plus FX devices. It carries MIDI sockets for
  an in and an out port and runs on batteries, with an external power supply
  possible.
details: |-
  LV1 is the Ableton Live controller in the Faderfox micromodul 1st generation, a line the page presents together with the LX1 extension controller for Ableton Live and the DJ1 controller for NI Traktor (Pro).

  The controller addresses 16 tracks in Ableton Live along with FX devices, which is the one function the page states for it.

  For connection it carries MIDI sockets for an in and an out port.

  The unit is battery powered, and the page notes that an external power supply is possible.

  Faderfox supplies the settings for the line as micromodul Live.zip, which holds all LV1, LX1 and DJ1 settings for Ableton Live from version 2.0, and offers the LV1 user manual as a PDF in English and German. The page marks the LV1 as discontinued / sold out.
specs: |-
  - Controller for Ableton Live
  - Controls 16 tracks plus FX devices
  - MIDI sockets for in and out port
  - Battery powered (external power supply possible)
  - Part of the micromodul 1st generation line (LV1 / LX1 / DJ1)
  - Settings file for Ableton Live from version 2.0 (micromodul Live.zip), shared across LV1, LX1 and DJ1
