details: |-
  The GC-2 Limiting Amplifier is a compressor and limiter in a stompbox enclosure, offered here in the limited 2024 Chromalux Custom Shop colorway. It carries the same compression and limiting technology as the maker's Bassist Limiting Amplifier.

  The circuit is built around a THAT Corporation 4320, using voltage-controlled amplifiers, an on-board true-RMS detector and high-performance op-amps. Where the maker's earlier compressors used the CA3080 or LM13700 and are voiced for a compressor effect, the GC-2 is aimed at low noise and transparency: it accepts large signals and has bandwidth above 20kHz, which suits guitar, keyboards and drum machines alike.

  Threshold sets the level at which the unit begins to act, indicated by a dual LED, and using it as a limiting amplifier protects an amplifier or speakers from clipping. The Compression control sets the ratio applied above threshold, from 1:1 for no compression up to a hard-knee limiter; with compression at 1:1 the Gain control works as a boost, with up to 30dB of output voltage gain available.

  Attack and release are adaptive rather than knob-set. The feed-forward design with a true-RMS detector uses a single time constant around 125dB per second, so the times follow the program material, with attack typically about 100 times faster than release. Attack is roughly 15ms for 10dB, 5ms for 20dB and 3ms for 30dB; release runs from 8ms for 1dB out to 240ms for 30dB.
