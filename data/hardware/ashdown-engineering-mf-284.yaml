description: The MF-284 is a compact 15-watt all-valve guitar amplifier head, a
  resurrection of the Mini Mofo enhanced with an Ashdown VU meter. Its 2 x EL84
  power section covers clean tones through classic rock crunch to full hard-rock
  roar, and a built-in reactive load plus headphone output and line-level DI
  make it a capable silent-practice and recording amp. Steel construction with
  an integral carry handle, 8 and 16 ohm outputs allow use with a range of
  extension cabinets.
details: |-
  The MF-284 revives the Mini Mofo with an added Ashdown VU meter. It delivers 15 watts from a 2 x EL84 power section, enough for small venues and rehearsals while still able to push the valves into overdrive at home or in the studio. A built-in load and headphone output enable silent practice and recording, complemented by an on-board line-level DI. Intuitive controls sculpt a wide tonal palette from shimmering cleans to classic-rock crunch and hard-rock roar. Crafted from high-quality steel with a black finish and integral carry handle, it offers 8 and 16 ohm outputs for pairing with various extension cabinets. Note: direct purchases are not available in the United States.
specs: |-
  - Power output: 15 watts
  - Valves: 2 x EL84 (power section)
  - Speaker outputs: 8 ohm and 16 ohm
  - Built-in reactive load
  - Headphone output
  - Line-level DI output
  - Ashdown VU meter
