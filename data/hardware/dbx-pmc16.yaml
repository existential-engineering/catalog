details: |-
  The dbx PMC16 is a 16-channel personal monitor controller that enables performers to create custom monitor mixes from 16 channels of audio. It is designed for use with the dbx TR1616 or any BLU link compatible device, supporting in-ear monitors, headphones, powered monitors, or wedge monitors.

  Each channel provides level, pan, mute, solo, and reverb send controls, with onboard Lexicon reverb for adding ambience to monitor mixes. Stereo width control and wedge monitor compensation EQ are included, along with global high and low EQ and master level control. dbx PeakStopPlus limiting protects the outputs.

  Multiple PMC16 units can be daisy-chained via CAT5e cable on a BLU link ring, supporting up to 60 PMC16s on a single ring. An LCD display provides 16-channel metering. The unit mounts on a microphone stand via the built-in mount, and firmware updates are performed via USB. Both XLR, 1/4", 1/8", and headphone outputs are provided for maximum flexibility.
specs: |-
  - Channels: 16
  - Mixer Features: Level, Pan, Mute, Solo, Reverb Send Control
  - Presets: 16 Preset Locations
  - Display: LCD Display with 16 Channel Metering
  - Reverb: Built-in Lexicon Reverb
  - Limiting: dbx PeakStopPlus Limiting
  - EQ: Global High & Low EQ
  - Master Control: Global Master Level Control
  - Stereo Width: Global Stereo Width Control
  - Digital Bus: BLU link High Bandwidth Fault Tolerant Digital Audio Bus
  - Outputs: XLR & 1/4" Stereo or Mono
  - Headphone Outputs: 1/8" & 1/4"
  - Sampling Rates: 48 kHz & 96 kHz
  - Channel Features: Channel Linking, Grouping, & Multi-Select
  - Daisy Chain: Supports up to 60 PMC16s on a Single BLU Link Ring
  - Mount: Built-In Mic Stand Mount
  - Firmware: USB Port for Firmware Updates
