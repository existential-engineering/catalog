description: >-
  The Serge Modular is an analog modular synthesizer system designed by French electronic
  musician Serge Tcherepnin, first produced in 1974 in Los Angeles. Featuring unique
  designs such as the Wave Multiplier module and banana plug patching, it offers a compact
  and cost-effective alternative to Buchla and Moog systems. Production continues today
  through Sound Transform Systems, which acquired Serge's circuit designs in 1993.
details: |-
  The Serge Modular synthesizer originated in Los Angeles in 1974 as the creation of French electronic designer Serge Tcherepnin. Initially built in Serge's home, mass production began in 1975 with the goal of creating systems that were smaller, more compact, and less expensive than competitors like Buchla and Moog.

    Production continued until 1986, after which modules were manufactured only to special order. Full production resumed in 1993 when Serge's circuit designs were sold to Rex Probe, an early collaborator who founded Sound Transform Systems (STS). STS continues to produce many of the original Serge modules along with new designs of their own.

    The system shows influences of the Buchla, including touch-sensitive keyboards and sequencers, random voltage generators, function generators, and matrix mixers. However, it features many unique designs of its own, most notably the Wave Multiplier module, which sits between the oscillator and filter sections and allows external audio or control voltage signals to modulate the timbre of the oscillator's tones. The systems also use banana plugs in lieu of traditional patch cords.

    Serge systems are available in several configurations. Shop Panels include the Animal (dual oscillator), Blue Voice (three oscillator), Red Voice (dual oscillator variant), and Soup Kitchen (external audio processing). The M-Class series offers more compact half-width panels, ranging from the Creature, the smallest self-contained Serge, to rhythm generators like the Gator.

    Notable users include Stereolab, John Adams, Vince Clarke, Radiohead, Jon Hassell, Richie Hawtin, Ingram Marshall, Moby, Stevie Wonder, Skinny Puppy, Sonic Boom, and Frank Zappa.
specs: |-
  - Polyphony: Monophonic (polyphony possible with multiple modules)
  - Oscillators: New Timbral Oscillator, Precision VCO (sine, triangle, sawtooth)
  - LFO: Quadrature Oscillator
  - Filters: Variable Q VCF, Variable Band Pass, Variable Slope VCF, Extended Range VCF (low, high, notch, bandpass)
  - VCA: Dual VCA, Universal Audio Processor, Cross Fader, Dual Stereo Panner
  - Envelope Generators: Extended ADSR, Dual Transient Generator, Smooth/Stepped Generator, Dual Slope Generator
  - Effects: Resonant EQ, Ring Modulator, Frequency Shifter, Phase Shifter, Wave Shaper, Wave Multiplier, Wilson Analog Delay, Noise Source
  - Sequencers: 4-8 Stage Sequencer Programmers, 8x2 Sequencer (6 modules total)
  - Keyboard: Touch Keyboard Sequencer with 16 touch-sensitive metal pads
  - Control: CV/Gate
  - Patching: Banana plugs
  - Production Dates: 1975 - Present
