description: 4x2 USB 2.0 desktop recording interface with four mic preamps,
  S/PDIF and MIDI I/O. Discontinued.
details: |-
  The Lexicon I-ONIX U42S is a 4x2 USB 2.0 desktop recording interface aimed at home and project studios. It provides four combo-jack analog inputs with microphone preamps and +48V phantom power, two of which double as Hi-Z instrument inputs for direct guitar/bass connection, allowing up to six simultaneous recording sources when combined with the stereo S/PDIF digital input.

  Output is provided via two 1/4" TRS balanced line outputs plus a pair of 1/4" stereo headphone jacks, along with stereo S/PDIF digital output on RCA and MIDI In/Out on 5-pin DIN. Converters operate at up to 24-bit/96 kHz (44.1, 48, 88.2, and 96 kHz sample rates supported) with a quoted 108 dB A/D and 110 dB D/A dynamic range.

  The unit connects to a host computer via USB 2.0 and shipped with Cubase LE 4 along with Lexicon's Pantheon reverb plug-in. Supported operating systems at end of life were Windows XP/Vista/7 (32/64-bit) and Mac OS X 10.4 through 10.6, indicating the product's vintage in the late 2000s era.

  The I-ONIX U42S is listed as discontinued on Lexicon's website and has been superseded by Lexicon's later I-O 42 USB interface.
