url: https://www.fostex.jp/en/products/ap20d/
description: Compact digital power amplifier (108 mm wide) delivering 20 W + 20
  W into 4 ohm (12 W + 12 W into 8 ohm) for driving passive speakers. Provides a
  front-panel stereo mini input and rear-panel RCA inputs, plus a post-volume
  RCA pre-output for system expansion (e.g., powered subwoofer), with a
  selectable auto-standby function.
details: |-
  Series: AP Series

  Features:
  - Digital power amplifier with carefully selected acoustic parts
  - Two input options: front stereo mini-jack (priority) and rear RCA
  - RCA pre-out (post-volume) for connecting a powered subwoofer or additional system
  - Auto-standby function selectable between 5 and 30 minutes via dipswitch
  - EU RoHS directive compliant
