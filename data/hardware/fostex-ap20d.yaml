url: https://www.fostex.jp/en/products/ap20d/
description: Compact digital power amplifier (108 mm wide) delivering 20 W + 20 W into 4 ohm (12 W + 12 W into 8 ohm) for driving passive speakers. Provides a front-panel stereo mini input and rear-panel RCA inputs, plus a post-volume RCA pre-output for system expansion (e.g., powered subwoofer), with a selectable auto-standby function.
details: |-
  This compact power amplifier is equipped with a 20W+20W (4 ohm) digital amplifier. The circuit design uses carefully selected acoustic parts to achieve high sound quality, and can be easily connected to passive speakers such as the P802-S and P804-S to create a high-quality sound reproduction environment.

  Simply input various music sources such as a PC or media player, and connect passive speakers to the speaker terminals. A stereo mini cable (0.8m), a stereo RCA cable (1.5m) and two speaker cables (1.5m) are included for connection.

  Two input terminals are provided: RCA terminals on the rear panel and a stereo mini terminal on the front panel, so the input can be selected according to the installation location and playback equipment. Stereo mini-jacks have priority for input signals, and the stereo mini-jack and RCA cannot be input simultaneously.

  A PRE OUT terminal carries a line-level output of the signal after the volume has been adjusted by the AP20d's volume control, so system expansion is possible by connecting an active subwoofer. When an active subwoofer is connected, its volume is adjusted in conjunction with the main speakers by operating the AP20d's volume control.

  An auto-standby function complying with the European Eco-Design Directive automatically reduces power consumption. It can be turned ON/OFF and the standby time set to either 5 minutes or 30 minutes using the dipswitch on the bottom of the unit, avoiding switching to standby at an unintended time such as when the output level on the playback device is turned down.
specs: |-
  - Maximum output: 20W + 20W (4 ohm load), 12W + 12W (8 ohm load)
  - Applicable load impedance: 4 ohm to 8 ohm
  - Frequency response: 20Hz to 40kHz
  - Total Harmonic Distortion: 0.01% (output 3W, load 8 ohm, 1kHz)
  - S/N ratio: 100 dB or more
  - Input terminal: Stereo mini-jack (1 channel), RCA (1 channel), input sensitivity 1V
  - Stereo mini-jack has input priority; simultaneous input of both inputs is not possible
  - Output terminal (PRE OUT): RCA (1 system), signal output after the volume control
  - Power: DC15V (dedicated AC adapter included)
  - Power consumption: 60W (maximum), less than 1W (standby)
  - Auto-standby switchable ON/OFF with 5 minute or 30 minute delay via bottom dipswitch
  - External dimensions: 108mm (W) x 42mm (H) x 138mm (D) including protrusions
  - Mass: 520g
  - Accessories: AC adapter x 1, speaker cable (1.5 m) x 2, stereo mini cable (0.8 m) x 1, stereo RCA cable (1.5 m) x 1
  - Complies with the European RoHS Directive
