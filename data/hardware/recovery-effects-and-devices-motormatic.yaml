details: |-
  MOTORMATIC V2 EURORACK MODULAR DEVICE

  (Bit Crushing Ring Modulator)

  Motormatic produces its own variable frequency that latches to CV, allowing movement and dynamic motion, creating beautifully bizarre textures and erratic pitches from your original sound source. Motormatic is unhinged and detached from reality just enough to aid in creating totally unique sounds! Designed and assembled in Seattle, Washington. . 3hp width, 16mm depth, 4ma current draw. . . Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
