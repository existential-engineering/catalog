description: Unleash 500 Watts of pure analog power and experience unparalleled
  flexibility with the Darkglass Microtubes 500 1x12 combo amp.
details: |-
  The Darkglass Microtubes 500 Combo 112 unleashes 500 Watts of pure analog power in a 1x12 combo format. Its all-analog preamp carries the signature VMT and B3K drive voices alongside a studio-grade compressor with automatic gain adjustment. A four-band ultra-quiet EQ with adjustable mid frequencies shapes the tone. The back panel provides a pre/post-switchable XLR DI output with ground lift, an aux input, an effects loop (Send and Return), a 1/4" footswitch jack, a headphone output, and a SpeakON/1/4" combination external speaker jack (minimum 8 Ohm load).
specs: |-
  - 500W 1x12 analog combo amplifier
  - Analog preamp with signature VMT and B3K drives
  - Studio compressor with automatic gain adjustment
  - Four-band ultra quiet EQ with adjustable mid frequencies
  - Pre/post switchable XLR DI with ground lift
  - Aux in, effects loop (Send/Return), footswitch jack, headphone out
  - External speaker SpeakON/1/4" jack (minimum 8 Ohm, 250W)
