  Closed-back circumaural headphones. 50mm dynamic drivers. Fixed 3-meter straight cable terminating in a 3.5mm plug; snap-on 6.3mm (1/4") adapter included. Impedance 32Ω, sensitivity 98dB ±3dB, max input 600mW. Foldable earcups rotate 90° for compact transport and single-ear monitoring. Padded headband and plush earpads.
