details: |-
  The Chandler Limited TG Microphone Type L is a phantom powered, cardioid large diaphragm condenser microphone descended from the innovative TG Microphone. It inherits the core EMI TG solid-state FET circuitry, gold custom-spec capsule, and Dual Tone System of the larger TG Microphone, but is tuned to have its own sound and unique voicings.

  The Dual Tone System provides two distinct characters: System 'A' is TG mid-forward and harmonically rich, while the 'B' voicing has a ribbon-like, more pristine quality and handles extreme SPLs with the PAD engaged. A -10 dB PAD is included. Output impedance is 200Ω.

  The Type L uses standard 48V phantom power (no external PSU required), making it more convenient than the original TG Microphone. It is designed as a recording studio workhorse intended to rival scenarios where the C12, C414, FET47, U67, and U87 have found favor, and may replace the practice of employing a dynamic and a ribbon in combination on guitar cabinets.

  Kit includes microphone, swivel mount, and bamboo storage box.
