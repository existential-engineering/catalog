description: A true-stereo reverb and tremolo pedal with spring, plate and room
  reverbs, harmonic, vibrato and sine tremolos, three presets, switchable effect
  order and infinite hold reverb trails.
details: |-
  The HYDRA combines high-fidelity reverb and tremolo for guitar, bass or keyboard, and was designed as a companion to the ECCOS and as an end-of-pedalboard unit. Reverb covers spring, plate and room voicings, and the tremolo covers harmonic, vibrato and sine wave shapes with tap tempo.

  The order of the two effects can be swapped on the fly, as can the character of either, using the pedal's Alt Controls. Those controls also reach shimmer, spring age and room or hall size, and an infinite hold can be engaged to sustain a reverb trail. Up to three presets can be stored, and reverb trails can be switched in and out without opening the enclosure, where earlier designs used internal DIP switches.

  The pedal works with professional remote switching systems and provides separate TRS expression pedal and external tap tempo inputs, with the expression pedal assignable to any knob. Bypass is switchable between true bypass and trails. It draws 146 mA from a 9V DC supply and is made in Edmond, USA.
