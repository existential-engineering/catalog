details: |-
  The Friedman ASM-10 powered monitor was designed and voiced for use with today's guitar amp modelers and profilers including Fractal Audio Axe-Fx, Kemper Profiler, Line 6 HD Series, Synergy and others. The ASM-10 delivers rich authentic tones, letting players get the most out of these systems in live use and playback applications.

  The ASM-10 active monitor is an ultra-compact onstage modeling solution. It combines a high-end 1 x 10 inch speaker cabinet with 500 watts of clean, analog power in a familiar and elegant design, pushing the tone of a favourite modeler through the air while blending seamlessly with the rest of the rig. Thanks to the cabinet's tilt-back floor monitor design, every nuance of a performance is easy to hear. For a player who uses amplifier modeling in performance but needs the immediacy and feel of a real speaker pushing air, the ASM-10 is a two-way, 500 watt powered monitor built for exactly that.

  With the ASM-10, the cabinet can be positioned anywhere onstage while every note still reaches the player. Its tilt back design allows it to be placed comfortably out front, delivering sound directly to the player's ears, or behind in the traditional location for amplifiers, where its guitar-cabinet look blends right in with the rest of the backline.

  The heart of the ASM-10 is its all-analog, bi-amped Class G power section, built with materials chosen for reliability and sonic clarity. At 500 non-digital watts it carries a warmth and detail that leave PA-style monitoring far behind, and harmonic overtones create a tight response so no notes are lost over the full spectrum.

  The back panel carries straightforward control for tailoring the ASM-10 to any situation: a level control and a Low Cut switch keep frequencies and volume balanced, and both balanced XLR and 1/4 inch inputs offer the hookup flexibility needed. Every unit is inspected and tested before shipping.
specs: |-
  - 10 inch two-way active stage monitor for use with modelers and profilers
  - All-analog, bi-amped Class G power section
  - Power output LF 270 W rms Class G, HF 80 W rms Class AB+B
  - Maximum total burst power 500 W
  - Low frequency transducer: Celestion 10 inch TF1025E woofer with 2.5 inch edge-wound voice coil
  - High frequency transducer: Celestion PETP film compression driver with 1 inch voice coil
  - Frequency range 50 Hz to 20 kHz
  - Frequency response 58 Hz to 18 kHz
  - High frequency dispersion by optical wave guide
  - Maximum peak SPL 129 dB
  - Input impedance 20 kohm balanced, 10 kohm unbalanced
  - Electronic crossover 4th order
  - Switchable low cut filter, 3rd order Butterworth at 100 Hz, controls frequencies below 100 Hz
  - Controls: level knob, low-cut filter switch, ground lift switch
  - Power switch, AC fuse, 115/230 V switch
  - Indicators: Power, Protect
  - Convection cooling
  - XLR and 1/4 inch inputs for different connectivity needs
  - Tilt-back design for optimal onstage placement, looks like a traditional cabinet when placed vertical
  - Crafted with the same look and care as traditional Friedman guitar cabinets
  - Powerful enough to also be used as backline or a mobile PA
  - Dimensions 20.5 in (H) x 15.25 in (W) x 13.25 in (D)
  - Weight 40.9 lbs
  - Made in USA using premium worldwide components
