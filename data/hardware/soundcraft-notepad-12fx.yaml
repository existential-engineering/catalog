details: |-
  The Notepad-12FX 12-channel mixer makes it easy to get legendary Soundcraft sound for your music, podcasts or videos. The Notepad-12FX combines professional-grade analog components, renowned HARMAN digital signal processing and a built-in USB audio interface to use with your favorite Mac or PC editing software. Whether you’re a singer-songwriter or a podcaster, the Notepad-12FX mixer offers best-in-class features like Lexicon effects, so you can bring a level of polish to your creative productions that’s sure to impress. Pristine Audio Quality. A Soundcraft Tradition. For over 40 years, audio professionals have trusted Soundcraft mixing solutions for pristine sound quality and reliable performance. Notepad series mixers continue this tradition with professional-grade Soundcraft microphone preamps, convenient XLR and 1/4” connectors, and durable metal enclosures built to stand the test of time. Comfortably Familiar. Incredibly Powerful. You’ll find yourself right at home with Notepad’s traditional channel strip layout. Aux sends and three EQ controls per channel give you a level of convenience often reserved for larger consoles. A rotary headphone volume control makes it easy to adjust your personal listening level, while a master fader level with LED metering provides precise control over your master output signal. Designed for home studios, rehearsals, live performances, and podcast production, the Notepad series provides a layout that’s familiar to audio professionals yet easy to grasp for beginners.
