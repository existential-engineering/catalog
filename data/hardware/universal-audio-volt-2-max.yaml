description: Ten-in, four-out desktop USB audio interface with Tone Shaping
  preamps and onboard Max compression.
details: |-
  Volt 2 Max is a desktop USB audio interface with two Tone Shaping preamps, each giving 60 dB of gain across the Warmth, Focus and Shine harmonic character modes.

  Max Processing adds onboard realtime compression with six musical presets for vocals, guitars and bass, modelled on classics such as the LA-2A and the 1176. Pairing the Tone and Max stages yields over eighteen character combinations.

  Two mic and line combo inputs pair with two front-panel Hi-Z instrument inputs. An ADAT or S/PDIF optical input adds up to eight channels of digital expansion, and MIDI In and Out are provided. A built-in talkback microphone, two headphone outputs sharing one cue mix, and a full-colour Smart Display with gain-reduction metering complete the unit.
specs: |-
  - 10-in / 4-out desktop USB audio interface
  - 32-bit / 192 kHz conversion
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Two Tone Shaping preamps, 60 dB available gain each
  - Warmth, Focus and Shine harmonic character modes
  - Max Processing realtime compression with six presets
  - Over 18 character combinations from the Tone and Max stages
  - ADAT or S/PDIF optical input, 8 channels at 44.1 and 48 kHz
  - MIDI In and Out on 1/8-inch TRS, MIDI Type A
  - Built-in talkback microphone
  - Two headphone outputs sharing one cue mix
  - Full-colour Smart Display with gain-reduction metering
  - Auto-Gain and Clip Protection
  - USB hub port supplying 5VDC at 0.5A maximum
  - Independent switchable 48V phantom power per channel
