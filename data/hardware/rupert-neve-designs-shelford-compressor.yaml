description: Two-channel diode bridge compressor inspired by vintage Neve 2254
  and 33609 units. Delivers classic diode bridge punch, color, weight, and tone
  with modern updates including advanced timing control, lower noise floor,
  fully stepped 31-position detented controls for precision recall, higher
  voltage power rails, full-wave sidechain detection, and internal parallel
  processing via blend control.
details: |-
  The Shelford Compressor brings the legendary 2254 diode bridge topology — the heart of countless Neve console compressors — into a modern, two-channel 1RU rackmount unit. Built around custom transformers and class-A line amplifiers, it delivers the classic punch, weight, and harmonic color of vintage Neve compressors with the precision controls modern engineers expect.

  Five selectable timing modes (FAST, MF, MED, MS, SLOW) plus an AUTO program-dependent setting let the engineer dial in the response to any source — from snappy transient control to smooth program-level reduction. Compression ratio ranges from a gentle 1.5:1 to a firm 8:1.

  A built-in parallel compression Blend control lets you mix compressed and dry signal entirely within the unit. Stereo Link ties both channels together for stereo bus duties, or leave them independent for dual-mono operation. 31-position stepped threshold and makeup gain controls support precise recall.

  Formerly sold as the 5254 Dual Diode Bridge Compressor, the Shelford Compressor uses an internal universal power supply (90-240V AC via IEC) and is made in the USA.
specs: |-
  - Input Impedance: 10 kOhm
  - Output Impedance: 40 Ohm
  - Max Input/Output Level: +26.7 dBu typical
  - Noise (10 Hz - 120 kHz): -104 dBu typical
  - Compressor Noise @ 0 dB Make-up Gain: -84.5 dBu typical
  - Frequency Response (10 Hz - 120 kHz): ±0.25 dB typical
  - THD+N @ 1 kHz @ Max Level: 0.0008% typical
  - Ratio: 1.5:1 to 8:1
  - Timing FAST: Attack 250 us - 2 ms / Release 100-200 ms
  - Timing MED: Attack 3-18 ms / Release 350-700 ms
  - Timing SLOW: Attack 10-80 ms / Release 800 ms - 1.5 s
  - Timing AUTO: Attack 5-40 ms / Release program-dependent
  - Dimensions: 19" W x 8.25" D x 1.75" H (1RU)
  - Weight: 8.5 lbs (3.9 kg)
  - Power: Universal IEC, 90-240 VAC
  - Made in USA
