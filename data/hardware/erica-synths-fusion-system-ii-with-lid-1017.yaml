description: Vacuum tube based eurorack modular synthesizer for sounds of
  unprecedented pressure.
details: |-
  Erica Synths is one of the few manufacturers that use vacuum tubes in eurorack modules, and anyone familiar with tube based modules knows that tubes can push the sound to extremes or turn it deep, saturated and complete.

  Three new Fusion series modules, the Fusion VCF3, the Fusion Modulator and the Fusion VCA / Waveshaper / Ringmodulator, were added to build the Fusion System II, a modular synthesiser for sounds of unprecedented pressure, unconventional modulations and creativity-inspiring patching. The 104HP system has 63 patch points for extensive experiments in sound design and an all analogue signal and CV path, for anyone who takes sound design seriously.

  Sound generation comes from two Fusion VCO2 modules, each a fully analogue source with three simultaneously available waveforms, a transistor based suboscillator and a detune function built from two BBD delay lines that make a frequency shifter mixed back into the principal oscillator to emulate two detuned VCOs, with distinct tube crunch added on top of the mix. The Fusion VCF3 is a resonant 24dB/oct lowpass filter that combines vacuum tubes and vactrols for soft filtering and carries a CV recorder that captures potentiometer motion for advanced modulation patterns.

  Modulation and processing come from the Fusion Modulator, a complex all analogue CV source with two looping envelope generators inspired by the EMS Synthi offering simultaneous unipolar (0V to 10V) and bipolar (-5V to +5V) outputs, a VCA, a noise generator and a sample and hold. The Fusion VCA / Waveshaper / Ringmodulator is based on two miniature pentodes and works as a VCA, a waveshaper and a ring modulator, and the Fusion Delay / Flanger / Vintage Ensemble combines BBD chip based effects with an adjustable tube overdrive on the delay output and a feedback path for extra thickness.

  The system ships in a 104HP one row skiff case with a lid, together with 20 patch cables.
