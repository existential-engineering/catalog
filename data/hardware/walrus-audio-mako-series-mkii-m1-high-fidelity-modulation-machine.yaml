details: "The M1 MKII is a stereo, all-in-one modulation pedal featuring six
  studio-grade programs based on fan-favorite modulation tones: Chorus, Phaser,
  Tremolo, Vibrato, Rotary, and Filter. A sound explorers delight, the M1
  features a dedicated lo-fi knob allowing you to mix various lo-fi parameters
  to every program. Each program features three types plus program-specific
  controls. Chorus: Type I traditional, Type II tri-chorus, Type III
  vintage-style flanger. Phaser: Type I 2-stage, Type II 4-stage, Type III
  Uni-Vibe. Tremolo: Type I optical/bias, Type II harmonic, Type III patterned,
  with stereo spread. Vibrato: Type I traditional, Type II vinyl RPM, Type III
  tape. Rotary: Leslie-style with horn/drum options and mic distance. Filter:
  lowpass/highpass/bandpass with resonance, envelope speed and release (usable
  as an envelope follower). Six Lo-Fi global controls (Env, Drive, Space, Age,
  Noise, Warble) via the right encoder. Up to 128 onboard presets in banks A/B/C
  plus MIDI."
specs: |-
  - The M1 features six fine-tuned modulation algorithms: Chorus, Phaser, Tremolo, Vibrato, Rotary, and Filter
  - Total BPM control, readable on the menu screen for Chorus, Phaser, Tremolo, and Vibrato programs
  - Internal wet/dry mix
  - All new flanger sound added to the Chorus algorithm
  - 128 onboard presets
  - Navigation menu for adjusting secondary controls and lo-fi parameters
  - Revamped Rotary and Filter programs
  - Stereo in and out; MIDI support
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
