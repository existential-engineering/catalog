description: >-
  The refined second generation of Yamaha's landmark FM synthesizer, adding dual-timbral operation,
  expanded memory, and cleaner 16-bit circuitry to the original DX7 formula.
details: |-
  By the mid-1980s, the original DX7 had become ubiquitous, and Yamaha responded with a thoroughly modernized successor. The DX7II arrived in 1986 in two variants — the DX7IID with a standard cartridge slot and the DX7IIFD with a built-in floppy disk drive for more convenient patch management. Both models addressed common complaints about the original while preserving the core FM synthesis engine that had made the DX7 a phenomenon.

  The most significant sonic improvement came from updated 16-bit digital-to-analog conversion, which gave the DX7II a noticeably cleaner and more refined output compared to its predecessor. The six-operator FM engine remained, offering the same 32 algorithms, but the doubled internal memory — 64 voice patches and 32 performances — meant far less reliance on external cartridges. Micro-tuning capabilities opened the door to alternative scales and non-Western temperaments, a feature that appealed to adventurous composers and world music artists.

  Bi-timbral operation was the headline workflow improvement. Players could now split the keyboard between two different sounds or layer them together, effectively turning a single DX7II into two independent FM voices. Enhanced MIDI implementation made it a more capable studio instrument, and the sturdier chassis with proper push-button controls replaced the sometimes frustrating membrane switches of the original.

  Yamaha also produced a limited DX7 Centennial edition — just 300 units in a distinctive gold finish — to celebrate the company's 100th anniversary. While the DX7II never achieved quite the cultural impact of the original, it remains the more practical and sonically polished instrument, and it continued to keep FM synthesis at the forefront of professional music production through the end of the decade.
specs: |-
  - Polyphony: 16 voices (8 in dual mode)
  - Oscillators: 6-operator FM tone generator, 32 algorithms
  - LFO: Sine, square, triangle, saw up, saw down, random
  - Envelopes: 6 envelope generators per voice
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 64 internal voices, 32 performances
  - Micro-tuning support
  - Control: MIDI In/Out/Thru
  - IIFD variant includes built-in floppy disk drive
  - Weight: 23 lbs
  - Produced: 1986–1989
