description: A push-pull electrostatic canal-type in-ear earspeaker featuring an
  improved diaphragm that is 15% thinner and more lightweight than its
  predecessor. Compatible with STAX driver units equipped with PRO bias output
  sockets and includes three silicone ear piece sizes for a customized fit.
specs: |-
  - Type: Push-pull electrostatic, canal-type in-the-earspeaker
  - Frequency response: 20 – 20,000 Hz (±4 dB)
  - Static capacity: 44 pF (including attached cable)
  - Sound pressure sensitivity: 110 dB / 100 Vr.m.s. / 1 kHz
  - Bias voltage: DC 550 – 580 V
  - Ear piece: L/M/S size made of silicone rubber (M size equipped at factory shipment)
  - Cable: 5-pin for STAX PRO bias, 6-core parallel, total length 1.5 m
  - Weight: 38 g (including cable), 12 g (main part only)
  - Dimension: 28 mm (diameter)
  - Overhead arc weight: 15 g
