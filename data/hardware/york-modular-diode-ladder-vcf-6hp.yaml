description: A voltage-controlled diode-ladder filter Eurorack module with
  voltage-controlled cutoff and resonance, offering a gnarly, characterful
  filter response.
details: |-
  An updated version of my old diode-ladder filter - now shrinkified so that it fits into 6HP rather than 8HP. It is, as it's name suggests, a filter which utilises a ladder of diodes and capacitors to work its magic. It's surprisingly versatile, and with voltage-controlled resonance as well as cutoff you can make this sound as gnarly as you like. Or not. There are two trimmer pots on the rear of the board which you can use to adjust the response of the filter. The CV trim will be pre-adjusted so that with the cutoff pot fully counter-clockwise there'll be nothing passing through the filter. There's also a V/octave trimmer which you can use to alter the cutoff CV response - I generally leave this alone but you can fiddle with it to your heart's content. If you want something potentially nasty sounding then this could be for you - if you'd prefer something more mellow then the state-variable or YaVCF filters may be a better fit; they're all based around the LM13700 dual OTA but have slightly different topologies. This initial run will be pre-built only, but I plan to offer partial builds starting with the next board run.
