details:
  - The mpc live iii is a powerful standalone music production center designed for producers who need a portable, all-in-one creative solution. It features advanced production tools, responsive controls, and the fastest processor ever used in an mpc, enabling users to create music anywhere without a computer.
  - The device introduces innovative mpce pads with 3d-sensing technology, offering ultra-responsive performance capabilities. These pads enable x/y control of one-shot layers, seamless sample blending, and dynamic note repeats, providing musicians with more expressive performance options.
  - The mpc live iii offers expanded workflow features including clip launching, step sequencing, and assignable performance buttons. This allows producers to trigger clips, lock in basslines, and create complex arrangements directly on the device, breaking beyond traditional production methods.
  - The system comes with a comprehensive mpc3 pro pack, which includes studio-grade time-stretch, clip-launching, expanded CV control, and professional plugins like air reverb pro, air visual eq4, and other creative tools. It also provides access to a world-class sample library and premium plugin collection.
  - With its built-in battery, speakers, and microphone, the mpc live iii is designed to be a truly portable music production center. Users can create, sample, and perform music anywhere, with the flexibility to connect to other devices or work completely standalone.
