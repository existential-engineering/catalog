details: |-
  SPECTRADRIVE Bass Preamp and Line Driver is a powerful tool for serious bass players in search of an exceptional sounding and ultra-flexible preamp. Jam-packed with useful features, SPECTRADRIVE includes built-in TonePrint-customizable SpectraComp compression and distortion, as well as a custom built studio-grade DI Output. And SPECTRADRIVE easily pulls double-duty as the perfect practice companion thanks to its high-quality headphone amplifier and Aux input.

  Ready, Set, TubeDrive...

  The TubeDrive TonePrint utility gives your bass the dynamic and warm sound and feel of a full blown tube amp. From just a single knob, TubeDrive serves up everything from a slightly overdriven tone with organic, rich harmonics all the way out to fuzzed out, edgy hard rock distortion and beyond. Plus, TubeDrive features its own dedicated footswitch – so you always kick it in at the ideal moment!

  SpectraComp

  Our acclaimed TonePrint setup not only lets you fine tune your overdrive, it provides access to the ultimate treasure trove of artist compression TonePrints in addition to the stellar selection but into the SPECTRADRIVE. Using the same advanced multiband algorithm from our legendary System 6000 studio compressors, SpectraComp’s deceptively simple single knob operation gives you unequaled control over dynamics, and cuts through the mix like a flaming katana through warm butter. Just turn up the SpectraComp knob to dial in the perfect amount of compression!
