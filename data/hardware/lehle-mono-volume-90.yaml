name: Mono Volume 90
manufacturer: lehle
primaryCategory: pedal
capabilities:
  - boost
url: https://www.lehle.com/lehle-mono-volume-90
description: The Lehle Mono Volume 90 is a volume pedal equipped with a precise
  magnetic sensor enabling it to operate almost wear-free. Its in- and output
  jacks sit on the side of the pedal and a MIN control sets the minimum volume.
details: |-
  The Lehle Mono Volume 90 is a volume pedal equipped with a precise magnetic sensor enabling it to operate almost wear-free. The sensor uses the Hall effect, named after Edwin Hall, to measure the strength of magnetic fields. The German-made Hall sensor is accurately calibrated to the built-in magnet and to the control range of the pedal, so the pedal moves only the magnet while the sensor measures the distance and controls a VCA.

  A premium Blackmer VCA (Voltage Controlled Amplifier) from the THAT Corporation replaces the mechanical potentiometer. Gain is varied by the control voltage coming from the Hall sensor, which operates more precisely than the conventional mechanical potentiometers or optical sensors used by standard volume pedals, and potentiometer-typical noise and complicated adjustment are eliminated.

  Over the entire control range the Mono Volume 90 transmits the full sound spectrum of the connected instrument. Input and output impedance always stay the same, ensuring that there is no damping of higher frequencies as with potentiometers. Internally, the input voltage coming from the power supply socket is rectified, then filtered, stabilized and doubled to 18 V, achieving a total dynamic range of 110 dB.

  The volume control ranges from -92 dB to 0 dB, from a virtually muted level to the same volume as the input. The MIN control sets the minimum volume anywhere from mute (0%) to 90% (-10 dB), and the GAIN control adds up to +12 dB of boost.

  The pedal runs mechanically smooth and steady on low-friction bearings of a high-performance polymer, with no mechanical transmission from the pedal to other components, and an adjusting screw modifies its mobility very precisely. A buffered direct out can supply a tuner, a DAW or a second amp without affecting the sound, and the in- and output jacks on the side of the pedal make it an ideal device for pedal steel players, since the pedal can sit in its usual spot on the pedal steel rack without obstruction.
specs: |-
  - Volume control range: -92 dB to 0 dB
  - MIN control sets the minimum volume from mute (0%) to 90% (-10 dB)
  - GAIN control adds up to +12 dB of boost
  - Total dynamic range: 110 dB, input voltage internally doubled to 18 V
  - Magnetic Hall sensor with Blackmer VCA, no potentiometer
  - Buffered direct out for a tuner, DAW or second amp
  - In- and output jacks on the side of the pedal
  - Low-friction high-performance polymer bearings with an adjusting screw for pedal tension
