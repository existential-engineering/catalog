description: >-
  The Korg SQ-10 is a three-channel analog step sequencer from 1978 designed
  as a companion to the MS-series synthesizers, using CV/Gate control to
  generate sequences via 36 knobs.
details: |-
  Designed primarily as a partner for Korg's MS-10 and MS-20 synthesizers, the SQ-10 provides hands-on analog sequencing through a straightforward knob-per-step interface. Each of its three channels offers 12 steps, and channels can be linked for up to 24-step sequences, giving users flexibility in pattern length.

  The three separate channels output control voltages for pitch, tone color, and timing variation, allowing a single sequence to modulate multiple parameters on the connected synthesizer simultaneously. This multi-channel approach enables complex evolving patterns that go beyond simple melodic lines.

  Programming is entirely real-time via the 36 knobs arranged across the front panel. While there is no patch memory for storing sequences, the immediacy of the knob interface encourages experimentation. Users have noted the SQ-10's ability to produce TB-303-like acid bass sounds when paired with the right synthesizer.

  Using Korg's Hz/V control voltage standard, the SQ-10 connects natively to MS-series instruments. With appropriate CV/Gate converters, it can also drive other analog synthesizers, making it a versatile sequencing tool for modular and semi-modular setups.
specs: |-
  - Steps: 12 per channel (24 max when linked)
  - Channels: 3 with independent CV control
  - Controls: 36 knobs
  - Memory: None
  - Control: CV/Hz out, Gate/Trigger out, FM out, VCF out
  - Compatibility: Korg MS-series, other CV/Gate synths via converter
releaseDate: "1978"
releaseDateYearOnly: true
