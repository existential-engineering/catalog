name: SQ-10 Analog Sequencer
manufacturer: korg
primaryCategory: sequencer
categories:
  - analog
description: >-
  The Korg SQ-10 is a three-channel analog step sequencer from 1978 designed as a
  companion to the MS-series synthesizers. It uses Korg's CV/Gate control system and 36
  front-panel knobs to program sequences of up to 12 steps per channel, expandable to 24
  when channels are linked. Its three independent channel outputs can simultaneously
  control pitch, tone color, and timing variation on connected synthesizers.
details: |-
  Designed primarily as a partner for Korg's MS-10 and MS-20 synthesizers, the SQ-10 provides hands-on analog sequencing through a straightforward knob-per-step interface. Each of its three channels offers 12 steps, and channels can be linked for up to 24-step sequences, giving users flexibility in pattern length.

  The three separate channels output control voltages for pitch, tone color, and timing variation, allowing a single sequence to modulate multiple parameters on the connected synthesizer simultaneously. This multi-channel approach enables complex evolving patterns that go beyond simple melodic lines, producing groovy basslines reminiscent of classic acid sounds when paired with the right synthesizer.

  Programming is entirely real-time via the 36 knobs arranged across the front panel. While there is no patch memory for storing sequences, the immediacy of the knob interface encourages experimentation. The SQ-10 supports a single pattern and a single song, keeping operation simple and direct.

  Using Korg's Hz/V control voltage standard, the SQ-10 connects natively to MS-series instruments including the MS-10, MS-20, and MS-50. With appropriate CV/Gate converters, it can also drive synthesizers from Roland, Moog, Sequential, and MIDI-equipped gear, making it a versatile sequencing tool for modular and semi-modular setups.
specs: |-
  - Polyphony: None
  - Sequencer: 12 steps per channel (24 max when linked)
  - Channels: 3 with independent CV control
  - Multitimbral: 3 separate channels
  - Patterns: 1 pattern
  - Songs: 1 song
  - Controls: 36 knobs
  - Memory: None
  - Control: CV/Hz out, Gate/Trigger out, FM out, VCF out
  - Compatibility: Korg MS-series, other CV/Gate synths via converter
  - Date Produced: 1978
releaseDate: "1978"
releaseDateYearOnly: true
