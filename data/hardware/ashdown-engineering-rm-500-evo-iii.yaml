description: Delivering 500 watts of classic Ashdown sound in a lightweight,
  portable head, the Rootmaster 500 EVO III combines a flexible EQ, Sub Harmonic
  Generator, compression, and Valve Emulated Drive with pro features like an
  Analogue Cab Sim DI output, balanced DI, and monitor filters.
details: |-
  The Rootmaster 500 EVO III delivers a formidable 500 watts alongside a wide frequency response and a responsive 5-band EQ. It stays true to Ashdown's signature analogue warmth, featuring the Sub Harmonic Generator for earth-shaking lows, a built-in compressor for dynamic control, and Valve Emulated Drive for grit and warmth. Built for the gigging bassist, it accepts power from 115-230V and uses two Neutrik Speakon/Jack outputs for solid connectivity, with high and low instrument inputs and a line input for a wide variety of sources. It provides multiple DI options: a balanced DI for front-of-house, a dedicated tuner output, and a rear-panel XLR DI with post-EQ and post-effects routing. Ashdown's Analogue Cab Sim DI emulates the legendary ABM cabinets with selectable enclosure type (ported or sealed), speaker voicing (10 inch or 15 inch) and a horn option adding a high-end lift around 5kHz.
specs: |-
  - Power Output: 500 Watts
  - Power Requirements: 115-230 Volts
  - Impedance: Minimum 4 Ohms
  - Speaker Outputs: 2 x Neutrik Speakon/Jack outputs
  - High Instrument Input: Impedance 3.9M Ohms, input range 150mV
  - Low Instrument Input: Impedance 10k Ohms, input range 300mV - 405V p-p
  - Line Input: Impedance 22k Ohms, input level 0dBu nominal
  - DI Output: 420 Ohm balanced, Level 0dBu nominal
  - Effects Send: Impedance 22k Ohm, Level 0dBu nominal
  - Effects Return: Impedance 22k Ohms, Input Level 0dBu nominal
  - Frequency Response: -3dB @ 17Hz and 30kHz
  - Signal to Noise: Better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 340Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Distortion: Less than 0.5% THD
  - H x W x D: 89 x 311 x 235 mm
  - Net Weight: 2.5 kg
