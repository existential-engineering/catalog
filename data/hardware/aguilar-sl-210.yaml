url: https://aguilaramp.com/products/sl-210-bass-cabinet
description: The Aguilar SL 210 is an ultra-lightweight 2x10 bass cabinet
  featuring dual neodymium drivers that deliver articulate mids, smooth highs,
  and punchy lows. Designed for demanding live and studio use, it works equally
  well as a standalone cabinet or stacked with other SL Series cabinets.
details: |-
  The SL 210 is part of Aguilar's SL (Super Light) Series, engineered to deliver
  professional bass cabinet performance in a significantly reduced weight package.
  At just 35 lbs, it achieves a remarkable power-to-weight ratio without
  sacrificing the tone quality Aguilar is known for.

  Two 10-inch neodymium drivers form the core of the SL 210's voice, providing
  the articulate low-mid punch and defined attack that bass players demand on stage
  and in the studio. Neodymium magnets allow for smaller, lighter driver assemblies
  compared to traditional ceramic magnets while maintaining output efficiency.

  A phenolic tweeter with integral phase plug extends high-frequency reproduction
  and adds presence and clarity to slap bass, pick attack, and harmonic content.
  A custom crossover network routes the appropriate frequency ranges to each
  driver, and a variable tweeter control allows players to dial in the desired
  amount of high-end presence to match the room or playing style.

  With 400 watts RMS power handling at 8 ohms, the SL 210 pairs with a wide range
  of amplifier heads. Its frequency response of 44 Hz to 16 kHz covers the full
  range of bass guitar and beyond, and its 97.3 dB sensitivity rating ensures it
  keeps up with loud stage environments.

  The cabinet is designed to be used standalone for smaller gigs or rehearsals,
  and can be vertically stacked with other SL Series cabinets for larger stages
  requiring more volume and coverage.
specs: |-
  - Power Handling: 400W RMS
  - Impedance: 8 ohms
  - Frequency Response: 44 Hz – 16 kHz
  - Sensitivity: 97.3 dB (1W/1M)
  - Drivers: 2x 10" Neodymium
  - Tweeter: Phenolic with integral phase plug
  - Crossover: Custom with variable tweeter control
  - Dimensions: 17 5/8" H × 21 15/16" W × 15 11/32" D
  - Weight: 35 lbs (15.42 kg)
