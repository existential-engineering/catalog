details: |-
  Master4 is part of the Grado Timbre Series, offering a balanced and engaging presentation built on decades of cartridge design experience. It is designed to deliver clarity, control, and musicality while maintaining the tonal character that defines Grado cartridges.

  Utilizing Grado's moving iron design, Master4 provides a stable and consistent signal with low moving mass and long-term reliability.

  Offered in both stereo and mono configurations, Master4 continues the tradition of Grado's wood body cartridges.
specs: |-
