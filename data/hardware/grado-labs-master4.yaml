  - Cantilever: Machined Boron with Elliptical Diamond
  - Output (High): 4.0mV @ 5 CMV (45)
  - Output (Low): 1.0mV @ 5 CMV (45)
  - Inductance (High Output): 55mH
  - Inductance (Low Output): 6mH
  - Resistance (High Output): 660 ohms
  - Resistance (Low Output): 70 ohms
  - Input Load: 10k-47k ohms
  - Cartridge Weight: 9.6 grams
  - Tracking Force: 1.6-1.9 grams
  - Compliance: 20μm/mN
  - Channel Separation: Average 30dB (10-30kHz)
  - Frequency Response: 10-60 kHz
