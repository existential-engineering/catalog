description: Add an ADSR envelope to your Bullfrog.
details: |-
  The ADSR voice card adds a full four stage attack, decay, sustain and release envelope to the Bullfrog. The envelope can be triggered by the Bullfrog's GATE button or by notes played on a connected MIDI keyboard.

  Once the card is inserted the envelope is internally routed to the VCA. A RELEASE CV input places the release stage under voltage control, and a separate OUTPUT carries another copy of the envelope that can be patched elsewhere.

  Selectable gate and loop modes change how the envelope responds, so the same card serves both as a conventional note envelope and as a cycling modulation source.
specs: |-
  - Four stage attack, decay, sustain and release envelope
  - CV controllable release stage
  - Selectable Gate and Loop modes
  - Internally routed to the VCA once connected
  - Separate envelope output for patching elsewhere
