details: |-
  Flagship 4-channel digital mixer.

  The DJM-2000NXS combines advanced performance features and an intuitive layout to empower unbridled creativity in the booth. A newly designed Peak Limiter eliminates distortion and clipping even at club volumes, all four channels are equipped with a Peak Level Meter so you can check your input levels at a glance. The perfect match for our flagship CDJ-2000NXS digital decks, the DJM-2000NXS features ProDJ Link for a smooth connection, while the club-standard design - with chrome-plated knobs and white LED buttons - makes sure they can be placed side-by-side in total harmony.

  Advanced connectivity. With Pro DJ Link you can connect multiple players, turntables or laptops via LAN connection and share a single source. Combine this with rekordbox to access pre-prepared loops and cues, sync the beat with the master deck, and access a host of advanced pro-DJ features.

  Beat Slice. Sample and slice tracks on-the-fly for spontaneous creativity.

  Frequency Remix. Choose which frequencies are in the mix with a 7-band touch cross fader.

  Side Chain Remix. Borrowed from the groundbreaking RMX-1000 remix station, Side Chain Remix delivers louder side chain oscillators and multiple effect chaining.

  USB audio interface. Connect via USB to play tracks from your PC/Mac without an external soundcard. Assign a different input to each channel or output audio from the master channel to your computer for easy recording.

  Quantized Beat FX. Quantize snaps Beat FX, cues and loops to the rekordbox beat grid for precision performances.
specs: |-
  - Flagship 4-channel digital mixer
