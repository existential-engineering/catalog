description: Iconic straight-fronted 4x12" guitar speaker cabinet inspired by
  the Silver Jubilee, designed to form the base half of a Silver Jubilee full
  stack. Loaded with four 12" Celestion G12 Vintage speakers, the 2551BV handles
  280W and offers switchable 16Ω/4Ω mono or 8Ω stereo operation via the
  rear-panel jacks. Voiced to pair with the 2555X Silver Jubilee head for the
  unmistakable late-'80s Marshall stack tone.
details: |-
  - Straight-fronted (base) 4x12" cabinet — bottom half of the Silver Jubilee full stack
  - Loaded with four Celestion G12 Vintage speakers
  - 280W power handling
  - Switchable 16Ω/4Ω mono or 8Ω stereo impedance
  - Voiced to pair with the 2555X Silver Jubilee head
