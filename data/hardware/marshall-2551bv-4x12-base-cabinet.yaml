description: Iconic straight-fronted 4x12" guitar speaker cabinet inspired by the Silver Jubilee, designed to form the base half of a Silver Jubilee full stack. Loaded with four 12" Celestion G12 Vintage speakers, the 2551BV handles 280W and offers switchable 16Ω/4Ω mono or 8Ω stereo operation via the rear-panel jacks. Voiced to pair with the 2555X Silver Jubilee head for the unmistakable late-'80s Marshall stack tone.
details: |-
  The Silver Jubilee reissue base cabinet comes finished in silver vinyl. For those wishing to emulate the 80s aesthetic, this cabinet pairs perfectly with the 2555X to create the iconic Marshall Silver Jubilee stack. Featuring four 70W Celestion G12 vintage speakers to create that 80s tone.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Built in Marshall's UK factory
  - Four 12-inch Celestion G12-Vintage speakers
  - Inspired by the Silver Jubilee
  - Delivers an ultra-focused sound, reminiscent of the late 1980s
  - Model: 2551BV 4x12 BASE CABINET
  - Speaker configuration: 4x12"
  - Power handling: 280W
  - Speaker model: Celestion G12 Vintage (70W)
  - Unit impedance: 16/4 Ohm mono, 8 Ohm stereo
  - Inputs: 2
  - Passive cabinet, no mains supply or power inlet
