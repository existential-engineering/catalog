details: |-
  The HT2 is a professional pre-polarized headset condenser microphone for the stage, presentation, and broadcast. The HT2 is known for its excellent sonic characteristics, low profile, comfort, and sound isolation. Designed for use with the AUDIX Wireless Systems, the HT2 may also be used as a wired microphone. Simply order the APS911 phantom power adapter for use with a standard mic cable.

  With a uniformly controlled supercardioid polar pattern, the HT2 captures vocals from a comfortable distance of 2″-3″ off-axis. The HT2 condenser microphone handles very high SPLs without distortion. Easy to position and lightweight, the HT2 supercardioid microphone is manufactured with very tight tolerances. This mic has a rubber-coated metal frame, a high-performance 5 mm capsule, and has a 3′ high-quality cable terminating in a space-saving mini XLRf connector.
specs: |-
  - Type: Pre-polarized headset condenser microphone
  - Polar pattern: Supercardioid
  - Capsule: 5 mm
  - Cable: 3 ft, terminating in mini XLRf connector
  - Powering: AUDIX wireless bodypack, or wired via APS911 phantom power adapter
