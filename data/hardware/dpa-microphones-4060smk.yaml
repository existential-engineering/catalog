details: |-
  We have collected our award-winning miniature microphones in specialized kits that contain the mics and accessories you need to capture fantastic sound no matter what you need.

  Now available with CORE+ & MicroLock®. CORE+ takes your miniature mic to the next level, neutralizing distortion across the entire dynamic range. MicroLock – A dependable, secure locking microphone connector with limitless flexibility and reassuring reliability.

  Complete kit with mics and accessories: 4060 Stereo Microphone Kit. This Stereo Microphone Kit is a cost-effective and flexible stereo recording solution aimed at project studios and for discreet mic setup on stage. It contains a complete stereo pair; two handpicked omnidirectional condenser microphones, selected on sensitivity within ±1.5 dB. It combines two 4060 Miniature Omnidirectional Microphone, Normal SPL, with a variety of mounting accessories. These include the BLM6000 Boundary Layer Mount, which can be used in conjunction with our 4060, 4061, 4062 and 4063 Miniature Microphones to place on a reflective boundary such as a floor, wall, ceiling, piano lid etc. This enables the mics to capture the ambient sound of the area. The sound captured from this 'pressure zone' has higher sensitivity, clarity and intelligibility compared to the sound captured from the 'free air'. This solution serves as a kind of acoustical zoom. There are many accessories included in the kit. One of them is the DMM0007 Universal Surface Mount. This mount allows all kinds of instruments, from acoustic guitar through grand piano and drums, to be mounted in the best-sounding position. The mount uses special non-marking adhesive discs for attachment.

  4061 Stereo Microphone Kit: similar in content to the 4060 Stereo Microphone Kit, this kit is a cost-effective and flexible stereo recording solution aimed at project studios and for discreet mic setup on stage. It contains a complete stereo pair; two handpicked omnidirectional condenser microphones, selected on sensitivity within ±1.5 dB. It combines two 4060 Miniature Omnidirectional Microphone, Loud SPL, with a variety of mounting accessories for use with high SPL sources.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB: Soft boost grid: 20 Hz - 20 kHz, 3 dB soft boost at 8 - 20 kHz. High boost grid: 20 Hz - 20 kHz, 10 dB boost at 12 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 20 mV/Pa; -34 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 23 dB(A) re. 20 µPa (max. 26 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 35 dB (max. 38 dB)
  - Distortion, THD < 0.5%: 128 dB SPL RMS, 131 dB SPL peak
  - Distortion, THD < 1%: 129 dB SPL RMS, 132 dB SPL peak
  - Dynamic range: Typ. 106 dB
  - Max. SPL, THD 10%: 134 dB SPL peak
  - Rated output impedance: 30 - 40 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001-BC XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD6001-BC: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001-BC XLR Adapter
  - Connector: MicroLock, TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - Weight: 7.5 g (0.26 oz) incl. Cable and MicroLock connector
  - Microphone diameter: 5.4 mm (0.21 in)
  - Microphone length: 12.7 mm (0.5 in)
  - Cable length: 3 m (10 ft)
  - Polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Sensitivity selection tolerance (at 1 kHz): ±1.5 dB
  - Colors: Black, Beige, Brown, White
