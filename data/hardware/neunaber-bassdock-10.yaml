description: The BassDock 10 is a compact bass speaker cabinet featuring a
  10-inch 400-watt Eminence speaker with a horn tweeter and a rear-firing bass
  port, designed to pair with Quilter's Bass Block amplifiers.
details: |-
  Can a bass cube hardly bigger than a breadbox deliver fully professional stage volume? You bet, when it combines a long-throw 10" speaker, pro-audio cabinet construction, high-flow bass port, HF horn, and Quilter's exclusive BassDockTM mounting system. Our highly acclaimed 800W Bass Block amp provides extra headroom to get the most from this compact cab. Makes a great grab-and-go compact combo, or set the rig on top of another 10 or 12-inch BassDock cab for twice the output. 10-inch, 400-watt custom-built Eminence speaker delivers plenty of punch without neglecting the bottom octave. The rear-firing bass port provides ample reinforcement of the lowest octave without "chuffing" through the aluminum grille. The front mounted speaker and "unibody" solid-core plywood construction provides maximum strength without excess weight. The modular BlockDock system lets you easily remove your Bass Block for fly dates or mount it in the cabinet of your choice.
