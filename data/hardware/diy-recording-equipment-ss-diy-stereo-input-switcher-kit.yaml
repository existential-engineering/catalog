description: A passive stereo input switcher kit that allows selecting among 10
  stereo (or 20 mono) 1/4-inch inputs to route to a single stereo output pair,
  with no coloration or gain change.
details: |-
  The SS-DIY is a collaboration between DIYRE and Franklin Audio, who originated the synth switcher concept with the SS-6. We've taken that concept and adapted it into a DIY kit that's as fun to build as it is to make music with. Less patching, more creating

  The SS-DIY puts 10 stereo inputs at your fingertips behind a single switch. No cables, no re-patching, and no reason to default to whatever synth happens to be plugged in. Now every instrument in your rack is one turn of the knob away instead of buried behind cables. With a circuit path so clean it's barely there and no power required, the only thing you'll hear is your gear. 20 × Inputs
  Connect to 10 × stereo or 20 × mono sources such as synths, keyboards, drum machines, guitars and basses. Stereo Output
  Send your selected source to your audio interface, a DI box, or a pair of mic preamps. Built by you

  Take your passion for audio to the next level by building your own gear. With just a few parts, no risk of electric shock, and a step-by-step assembly guide, the SS-DIY is your perfect entryway to the world of DIY. FAQ

  How is the SS-DIY different from the Franklin Audio SS-6? The SS-DIY is designed to perform the same function as the SS-6 with a few key differences:

  Does the SS-DIY have a sound? No, the SS-DIY does not affect the audio signal in anyway besides switching between inputs. Does the SS-DIY change the level of the signal? No, the SS-DIY simply passes whatever signal is at the inputs to the outputs without gain or attenuation. Can I hear all of the inputs at the same time? Nope, the SS-DIY is a switcher, not a mixer. Only one pair of stereo inputs at a time is routed to the outputs. Do you sell the SS-DIY assembled? Nope. The SS-DIY is a very simple build and makes a perfect first DIY project. If you're not sure what's involved in building your own gear, check out our Getting Started page. If you can't or don't want to solder, you can buy the SS-6 assembled from Franklin Audio . Specifications

  Inputs
  10 × stereo pair / 20 × mono, 1/4" (6.35mm) TS jack, unbalanced

  Outputs
  1 × stereo pair / 2 × mono, 1/4" (6.35mm) TS jack, unbalanced

  Power Supply
  None (completely passive)

  Frequency Response
  1Hz-96kHz ±0dB

  THD+N
  None

  Noise
  None

  Gain
  None

  Weight
  2lb 5oz (1048g)

  Dimensions
  7.5" × 3.75" × 2.75" (191mm × 95mm × 70mm)

  *+20dBu output, 1kHz, 20-20kHz bandwidth

  Resources
specs: |-
  - Inputs: The SS-DIY has 10 pairs of inputs, while the SS-6 has 6.
  - Outputs: The SS-DIY's outputs are connected directly to whichever pair of inputs is selected. The SS-6, on the other hand, has transformer DI outputs.
  - Levels: The SS-DIY accepts any type of input (instrument, line, mic) and outputs that same level with no gain or attenuation. The SS-6, on the other hand, has microphone-level outputs.
  - Reversible: The SS-DIY's inputs and outputs can be used in reverse, while the SS-6's cannot.
  - SS-DIY Assembly Guide
  - SS-DIY Operation Manual
