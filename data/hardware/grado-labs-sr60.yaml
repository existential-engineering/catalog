description: Open-back, on-ear dynamic headphones from Grado's Classic Series.
  Tuned for balance and musicality with a 44mm X2 dynamic driver, delivering
  clear midrange and a natural, spacious presentation suited to long listening
  sessions.
details: |-
  The SR60 features a 44mm X2 dynamic driver built around a Mylar diaphragm, copper voice coil, and rare earth magnetic system engineered for efficiency and control. The tuning emphasizes balance and musicality, delivering clear midrange, natural detail, and an inviting presentation designed for long listening sessions.

  The headphones use a standard headband assembly with a padded synthetic headstrap and a steel spring band for personalized fit adjustment. They include a fixed Bronze cable and ship with S cushions that contribute to the overall tonal presentation.

  The open-back housing provides the spacious presentation that defines the Grado listening experience.
specs: |-
