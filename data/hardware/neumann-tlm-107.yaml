description: The TLM 107 is a reference class microphone for vocals and
  instruments with breathtaking realism. Five polar patterns plus variable pad
  and low cut settings make the TLM 107 exceptionally flexible.
details: |-
  Our new state of the art microphone: extremely versatile and surprisingly affordable!

  Reference-class large-diaphragm condenser with five switchable polar patterns (omni, wide cardioid, cardioid, hypercardioid, figure-8), variable pad (0/-6/-12 dB) and low cut (lin/40 Hz/100 Hz) settings, controlled via a single navigation toggle on the rear. Uses a newly developed dual diaphragm capsule for outstanding transient response and a transformerless circuit for open, transparent sound with 131 dB dynamic range.

  Highlights:
  - Highly defined sound in 5 directional patterns
  - Variable pad and low cut settings
  - All-new capsule design
  - Outstanding transient response

  Applications:
  - Vocals
  - Acoustic and electric guitar
  - Piano
  - Upright bass
  - Drums and percussion
  - Broadcast
  - Classical recordings
  - Project and home studio
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional  Pattern: Omni, wide angle cardioid, cardioid, hypercardioid, figure-8
  - Frequency  Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 k Hz into 1 kohm: 11 mV/Pa
  - Rated  Impedance: 50 ohms
  - Rated load impedance: 1000 ohms
  - Equivalent noise level,  C C I R: 22 dB
  - Equivalent noise level,  A-weighted: 10 dB-A
  - Maximum  S P L for  T H D 0.5%: 141 dB
  - Maximum  S P L for  T H D < 0.5% with pre-attenuation -6 d B: 147 dB
  - Maximum  S P L for  T H D < 0.5% with pre-attenuation -12 d B: 153 dB
  - Signal-to-noise ratio,  C C I R (re. 94 d B  S P L): 72 dB
  - Signal-to-noise ratio,  A-weighted (re. 94 d B  S P L): 84 dB
  - Maximum output voltage: 10 dBu
  - Supply voltage ( P48,  I E C 61938): 48 V ± 4 V
  - Current consumption ( P48,  I E C 61938): 3.2 mA
  - Matching connector: XLR 3 F
  - Weight: 445 g
  - Diameter: 64 mm
  - Length: 145 mm
