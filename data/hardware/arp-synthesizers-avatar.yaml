description: >-
  The ARP Avatar is a monophonic guitar synthesizer from 1977 that uses
  pitch-to-voltage technology and a hex pickup to allow guitarists to control
  synthesizer sounds, sharing its dual-oscillator architecture with the
  celebrated ARP Odyssey.
details: |-
  In 1977 ARP pushed into designing a synth that could respond to incoming guitar signals using pitch-to-voltage technology. This gave rise to the Avatar, which despite demonstrating functional guitar-to-synth conversion capabilities, became a commercial failure due to its steep $3,000 price point, nearly sinking the company before it divested its remaining assets.

  The Avatar leverages a hex pickup system that enables guitarists to play synthesizer sounds directly from their instrument. Architecturally, the unit shares significant similarities with ARP's more successful Odyssey model, incorporating comparable sound-generation and control methodologies.

  The Avatar features two oscillators and reproduces many of the Odyssey's celebrated sonic characteristics and programming capabilities, including oscillator sync, ring modulator, sample and hold, portamento, and envelope follower. Today, musicians primarily employ the Avatar as an expandable module rather than a standalone guitar interface.

  Only approximately 300 units were manufactured, making the Avatar scarce and desirable among vintage synthesizer collectors. The Avatar makes a great alternative to the Odyssey since it is capable of all the same sounds. Contemporary use typically involves CV/Gate or MIDI-to-CV/Gate connectivity with modular and compatible analog systems rather than direct guitar input operation.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs with sawtooth, square, and pulse waveforms
  - LFO: Sine and square wave options
  - Filter: Model 4075 4-pole, 24dB low-pass filter
  - Envelopes: Env 1 (ADSR), Env 2 (AR)
  - Keyboard: None (control via CV/Gate)
  - Memory: None
  - Control: CV/Gate input
  - Production Period: 1977-1978
releaseDate: "1977"
