description: >-
  The Korg Sigma is a bi-timbral monophonic analog synthesizer released in 1979, featuring
  two independent sound sections: a variable analog Synthe section and a preset-based
  Instrument section with 19 total presets. Controlled via a distinctive dual-joystick
  interface, it offers expressive real-time manipulation of pitch, filters, noise, and
  vibrato. Notable users include Jean Michel Jarre, Rick Wakeman, and Keith Emerson.
details: |-
  The Sigma takes an unusual approach to synthesis by splitting its architecture into two independent sections. The Instrument section offers 11 preset sounds including fuzz guitar, electric bass, clavinet, strings, flute, double reed, trumpet, and hammered percussion, while the Synthe section provides 8 presets giving variable waveforms with sawtooth, square, and pulse width modulation sources across pitch ranges from 32' to 4'. Both sections can be played simultaneously, giving the Sigma a bi-timbral character unusual for a monophonic instrument.

  Two joystick controllers are a defining feature of the Sigma's interface. The first joystick manages pitch, noise, and vibrato, while the second controls the low-pass and high-pass voltage-controlled filters. This dual-joystick system gives performers expressive real-time control that goes well beyond the typical pitch and modulation wheels of the era.

  The effects and modulation section adds considerable sonic flexibility, offering vibrato, portamento, sample and hold, noise generation, key hold, multiple trigger modes, and a ring modulator that functions as cross-modulation between the Instrument and Synthe sections. CV and trigger inputs allow integration with external gear, and a quarter-tone scale capability opens up microtonal possibilities.

  Despite its innovative design, the Sigma had notable limitations for its time: no patch memory and no MIDI capability. The preset instrument sounds were considered weak in isolation, though they improved significantly when layered with the Synthe section. The Sigma found its way into the rigs of notable players including Jean Michel Jarre, Rick Wakeman, and Keith Emerson, demonstrating professional adoption despite these limitations.
specs: |-
  - Polyphony: Monophonic (bi-timbral)
  - Oscillators: 18 VCOs across Synth and String sections
  - Waveforms: Sawtooth, square, PWM, noise
  - Filter: 12dB/octave low-pass and high-pass with joystick control
  - LFO: Vibrato
  - VCA: Attack/Decay envelope
  - Keyboard: 37 keys
  - Memory: None
  - Effects: Vibrato, portamento, sample & hold, ring modulator, key hold, multiple trigger
  - Control: CV and trigger inputs
  - Special: Quarter-tone scale capability, dual joystick modulation
