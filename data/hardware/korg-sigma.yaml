description: >-
  The Korg Sigma is a bi-timbral monophonic analog synthesizer from 1979
  that combines a preset instrument section with a variable synth section,
  controlled via dual joysticks.
details: |-
  The Sigma takes an unusual approach to synthesis by splitting its architecture into two independent sections. The Instrument section offers preset sounds including fuzz guitar, electric bass, and various orchestral tones, while the Synthe section provides variable waveforms with sawtooth, square, pulse width modulation, and noise sources. Both sections can be played simultaneously, giving the Sigma a bi-timbral character unusual for a monophonic instrument.

  Two joystick controllers are a defining feature. They provide real-time manipulation of pitch, noise, vibrato, and filter parameters, giving performers expressive control that goes well beyond the typical pitch and modulation wheels of the era. A 12dB per octave filter with both low-pass and high-pass modes adds tonal shaping flexibility.

  Additional features include portamento, sample and hold, a ring modulator for cross-modulation effects, and CV/trigger inputs for external control. The 37-key keyboard keeps the instrument compact while providing enough range for lead and bass duties.

  The Sigma found its way into the rigs of notable players including Jean Michel Jarre, Rick Wakeman, and Keith Emerson. Its combination of instant preset sounds and deeper synthesis capabilities made it a practical performance instrument that could cover a wide range of tonal territory.
specs: |-
  - Polyphony: Monophonic (bi-timbral)
  - Oscillators: 18 VCOs across Synth and String sections
  - Waveforms: Sawtooth, square, PWM, noise
  - Filter: 12dB/octave low-pass and high-pass with joystick control
  - LFO: Vibrato
  - VCA: Attack/Decay envelope
  - Keyboard: 37 keys
  - Memory: None
  - Effects: Vibrato, portamento, sample & hold, ring modulator
  - Control: CV and trigger inputs
