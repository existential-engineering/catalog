  - rack-mount
url: https://apiaudio.com/product/525a-fet-compressor/
description: 500-series FET compressor building on the original 525, with
  variable attack (15 µs–15 ms), seven selectable release modes, and a Ceiling
  Control combining threshold and make-up gain. Uses API 2510/2520 op-amps with
  proprietary transformers.
details: |-
  500-series FET compressor successor to the original 1970s API 525.
  Retains API's proprietary transformers and 2510/2520 op-amps. Variable attack
  from 15 µs to 15 ms. Seven selectable release modes: 0.05, 0.1, 0.2, 0.3, 0.5,
  1.0, 2.0 s. Ceiling Control combines threshold and make-up gain in a single
  knob. 2:1 compression and 20:1 limiting ratios. Up to 25 dB gain reduction.
  Classic 1970s-style analog VU meter. VPR Alliance compliant.
specs: |-
  - Attack: 15 µs–15 ms
  - Release: 0.05 / 0.1 / 0.2 / 0.3 / 0.5 / 1.0 / 2.0 s
  - Ratios: 2:1 / 20:1 (limit)
  - Max gain reduction: 25 dB
  - Frequency response: ±0.5 dB (20 Hz–40 kHz)
  - S/N ratio: 112 dB
  - Max input: +27 dBu
  - Max output: +28 dBu
  - Input impedance: 80 kΩ (balanced)
  - Output impedance: 75 Ω (transformer coupled, balanced)
  - Power: 3 W (VPR Alliance compliant)
  - Dimensions: 1.5″ × 5.25″ × 7″
  - Weight: 1.5 lb
