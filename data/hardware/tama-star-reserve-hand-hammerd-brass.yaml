description: In keeping with the craftsmanship and quality of previous STAR
  Reserve snare drums, TAMA introduces another drum in the series - The STAR
  Reserve 14"x5.5" Hand Hammered Brass Snare Drum. This drum features a 1.5mm
  thick shell, 2.3mm brass Customized Flanged Hoops, and a unique hammering
  pattern.
details: |-
  Super Sensitive Hi-Carbon Snare Wire: In order to provide a crisper and more sensitive sound, we redesigned our snappy snare using new materials and customizing the shape of the plate and the wire coil's winding pattern. As a result of these modifications, the Super Sensitive Hi-Carbon Snappy Snare fits closer to the snare side head, providing greater sensitivity and a brighter, crisper sound.

  Customized Brass Mighty Hoop: Customized Brass Mighty Hoop provides a sharper and brighter attack with rich harmonic overtones, made of brass with a slightly shaved down edge.
