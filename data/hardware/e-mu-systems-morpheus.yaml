description: >-
  E-mu's 32-voice rack-mount synthesizer built around Z-Plane synthesis technology, featuring 198
  programmable 14-pole interpolating filters that morph between timbres in real time.
details: |-
  The Morpheus earns its name from its signature ability to morph between sounds, creating unique, evolving, and intricate timbres with superb digital clarity. At the heart of this capability lies E-mu's Z-Plane synthesis technology, which employs specialized filters that model and interpolate resonant sound characteristics to enable smooth transitions between radically different tonal qualities.

  The synthesis engine draws from 8 MB of 16-bit ROM samples expandable to 16 MB, processed through 32 fourteen-pole interpolating digital filters with 198 programmed filter types. This filter architecture is the Morpheus's defining feature, offering sound-shaping possibilities that go far beyond conventional subtractive or additive approaches. Output runs through 18-bit DACs for clean, detailed audio quality.

  A complete 16-channel MIDI implementation provides control over most parameters, paired with a dual effects processor and up to six individual outputs for professional studio integration. The unit stores 384 patches across RAM, ROM, and card slots alongside 16 internal and 16 external performances. Notable users include Orbital, Astral Projection, Hardfloor, LTJ Bukem, and Fluke.
specs: |-
  - Polyphony: 32 voices
  - Oscillators: 16-bit ROM samples, 8 MB (expandable to 16 MB), 18-bit DACs
  - Synthesis: Z-Plane with acoustic simulation
  - Filters: 32 fourteen-pole interpolating digital filters, 198 filter types
  - Effects: 2 processors
  - Memory: 384 patches (128 RAM, 128 ROM, 128 card), 16 internal + 16 card performances
  - Outputs: Up to 6 individual
  - Control: MIDI (full 16-channel)
releaseDate: "1993"
releaseDateYearOnly: true
