details: |-
  Silvertone has partnered up with ChromAharP to reissue the legendary instrument from the 1960's. The original 15 chord version has been updated to 21 chords! The Acoustic Electric model allows you to plug directly into an amplifier, PA system, or recording console. Construction and design features include torsion-tight tuning pins, pre- stressed maple frame, and a maple top and back. The following 21 chord bars enable the player to literally play hundreds of songs: Eb, Bb, F, C, G, D, A, F7, C7, G7, D7, A7, E7, B7, Ab, Bb7, Cm, Gm, Dm, Am, Em.
specs: |-
  - 21 Chord Bars
  - Torsion-tight tuning pins
  - Pre-stressed maple frame
  - Nylock chord bar buttons
  - Maple top and back
  - SCH21AE – Electric version includes: Volume and Tone controls
