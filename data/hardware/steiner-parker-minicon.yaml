description: >-
  The Steiner-Parker Minicon is a rare monophonic analog synthesizer from 1977,
  a simplified single-oscillator sibling of the Synthacon that nonetheless
  delivered a rich, dual-oscillator-like sound thanks to its distinctive
  circuit design.
details: |-
  Released in 1977 by the Salt Lake City-based Steiner-Parker company, the
  Minicon was conceived as a more accessible version of their flagship
  Synthacon. While it featured only a single VCO compared to the Synthacon's
  three, the manufacturer claimed its circuit design produced a sound more
  akin to two oscillators, with exceptional tuning stability.

  The Minicon features a clean, logically organized control panel with 17 knobs
  and 19 switches housed in a case with solid wood end panels. Its four-octave
  keyboard provides a comfortable playing range, and the inclusion of a
  three-mode filter (low-pass, band-pass, and high-pass) gives it tonal
  flexibility uncommon in monophonic synths of this era.

  Additional features include a continuously variable noise source ranging from
  white to pink, portamento, sample and hold, and an LFO with square and
  triangle waveforms assignable to both the filter and oscillator. The synth
  connects via CV/Gate for integration with other analog equipment.

  Steiner-Parker operated from 1975 to 1979, producing instruments of
  exceptionally high quality in small quantities. The Minicon remains one of
  the rarest and most sought-after vintage analog synthesizers, prized by
  collectors for its unique character and build quality.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth, square, pulse-width)
  - Noise: Continuously variable white to pink
  - Filter: 3-mode (low-pass, band-pass, high-pass)
  - Envelope: Attack, Decay, ACD (attack converted to delay)
  - LFO: 1 (square and triangle waveforms)
  - Keyboard: 49 keys with 3 octave ranges
  - Effects: Portamento, Sample & Hold
  - Control: CV/Gate
  - Additional: Legato triggers, internal headphone driver
