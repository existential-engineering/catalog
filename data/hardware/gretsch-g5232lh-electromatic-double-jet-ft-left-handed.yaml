  and Black Top Filter'Tron pickups produce a wide, balanced and transparent
  tone with remarkable definition at any level of gain.
details: |-
  The G5232LH Electromatic Double Jet FT captures essential Jet power and fidelity at a great price. Classic Jet tone begins with a chambered mahogany body with arched maple top that produces full lows and mids with a well-defined, yet smooth high end. The result is a strong and balanced acoustic foundation fit for a variety of tones.

  Black Top Filter'Tron pickups amplify and accentuate the Electromatic Double Jet FT's chambered body to produce a wide, balanced and transparent tone. Loud and punchy, this Jet sounds out with remarkable definition at any level of gain.

  The combination of individual pickup volume controls, master tone and master volume with treble bleed circuit provides intuitive global control over your pickup and tone settings.
