description: >-
  The EML SynKey is a programmable monophonic analog synthesizer featuring 13 oscillators, a unique punch-card patch memory system, and a pressure-sensitive "second touch" keyboard.
details: |-
  The SynKey stands out as one of EML's most distinctive instruments, a programmable synthesizer with an unusual approach to both sound generation and patch storage. Its thick analog sound is driven by thirteen oscillators, with one primary oscillator and twelve additional oscillators tuned to higher semitones, each activated via simple on/off buttons without requiring manual tuning.

  Despite having multiple oscillators, the SynKey operates monophonically, generating exclusively square waves. What makes the keyboard experience unique is the "second touch" feature, which functions similarly to aftertouch, allowing players to trigger filter sweeps, vibrato, and pitch bends by applying increased pressure to keys already held down. The 44-key keyboard with this capability gives the instrument an expressive character uncommon for its era.

  Patch memory is handled through an ingenious punch-card system. The instrument shipped with 25 blank and 25 pre-punched factory sound cards, allowing players to save and recall settings physically. Two models were produced: the programmable SynKey 2001 and the non-programmable SynKey 1500. CV/Gate connections provide external control. Herbie Hancock is among the instrument's notable users.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 13 (square waves only)
  - Keyboard: 44 keys with "second touch" (aftertouch-like)
  - Memory: Punch-card system (25 blank + 25 factory cards)
  - Effects: None
  - Control: CV/Gate
releaseDate: "1976"
