description: >-
  The SynKey is a classic monophonic analog synthesizer featuring 13 square-wave
  oscillators and an innovative punch-card program memory system. Its "Second Touch"
  keyboard feature provides aftertouch-like control over filter sweeps, vibrato, and pitch
  bends.
details: |-
  The SynKey employed a truly innovative approach to program storage, using plastic punch-cards for reliable on-stage use. Each card stored one complete sound patch including most editable parameters, with the synth originally shipping with 25 blank cards and 25 pre-punched factory sounds. This design enabled fast, hassle-free programming and loading compared to manual patch note-taking.

    The instrument's sonic architecture centers on 13 square-wave oscillators: one primary tone generator plus twelve additional oscillators for higher semitones. Users could activate or deactivate any oscillator via simple on/off buttons without requiring tuning adjustments, creating thick analog tones despite the monophonic architecture.

    The "Second Touch" keyboard feature allowed performers to control filter sweeps, vibrato, and pitch bends through key pressure, adding expressive performance capability. Two models were produced: the programmable SynKey 2001 and the non-programmable SynKey 1500. The synthesizer was notably used by Herbie Hancock.
specs: |-
  - Polyphony: Monophonic
    - Oscillators: 13 (square waves only)
    - Memory: Punch-cards (25 blank + 25 pre-punched factory sounds)
    - Keyboard: 44 keys with Second Touch
    - Control: CV/Gate
releaseDate: "1976"
