description: An amp-in-a-box overdrive pedal carrying the control set and voice
  of the Friedman Dirty Shirley head. It works into a clean amp or as a dirty
  boost in front of an already driven one, with a side-mounted Tight switch for
  the low end.
details: |-
  The Friedman Dirty Shirley all-tube amp is well known for being one of the most flexible and touch-responsive single-channel amplifiers on the market. Now that same tonal versatility, sensitivity and harmonically rich overdrive is available in a pedal. The Dirty Shirley Overdrive packs the same intuitive control set as the amplifier, allowing a player to dial in a shade of rock in no time. It doesn't matter if you want a high-output cleaner tone for pushing your amp hard or a thick gritty drive that will sit well in any classic to modern rock band, a sweep of the gain control easily gets you there.

  Though the Dirty Shirley overdrive can scream with an unabashedly rock 'n' roll voice, it is more versatile than that suggests. To get more out of the amp already in the rig, roll the pedal's gain knob back, crank the volume and get a dirty boost. Roll up the gain and the pedal responds to every touch and manipulation of the guitar's controls.

  The Dirty Shirley Overdrive delivers tube-like tone in a small pedal format, used either into a clean amp or to boost an already over-driven amp. If the amp or another overdrive gets a bit loose in the low end, the side-mounted Tight switch brings back the percussive attack.

  Tone is shaped with volume, gain, bass, treble and presence controls plus the Tight switch, and the pedal is built in the USA with true bypass switching.
specs: |-
  - Friedman Dirty Shirley amp tone in a compact pedal format
  - Responds to guitar controls and picking nuance exactly like the amp
  - Gain control takes you from gritty to hard rock in no time
  - Controls: Bass, Treble, Presence, Volume, Mid and Gain
  - Side-mounted Tight switch
  - True bypass switching
  - Voltage requirements: 9-18V centre negative
  - Built in the USA using premium worldwide components
  - Weight: 1 lb
