details: |-
  The Microtubes B7K Ultra is a versatile bass preamp designed for both studio and live applications, delivering a perfect combination of brutality and clarity with defined and powerful saturation in an intuitive format. It combines a powerful saturation circuit with comprehensive tone-shaping controls, letting players achieve anything from pristine clean tones to extreme high-gain distortion.

  The pedal excels at direct recording and monitoring. It includes an internal stereo headphone amplifier and an auxiliary input for practicing along with backing tracks. A four-band EQ with six selectable mid frequencies provides extensive sculpting, while dedicated footswitches control overdrive engagement and frequency saturation. A balanced XLR output with switchable cabinet simulation makes it ideal for direct-to-mixer applications.

  Connectivity includes a 1/4-inch input and output, a balanced XLR DI with ground lift and cab sim toggle, a 3.5 mm headphone output, a 3.5 mm aux input, and a Micro USB-B port for loading cabinet IRs and control via the Darkglass Suite. It runs on a regulated 9V DC center-negative supply (120 mA draw).
specs: |-
  - Four band equalizer with six selectable mid frequencies
  - XLR output with switchable cab sim and ground lift
  - Headphone output with IR cab sim
  - Dedicated footswitch to engage the overdrive section independently
  - Master volume to control the overall unit level
  - Attack and Grunt toggle switches to control high and low frequency saturation
  - Aux In jack to practice with backing tracks
  - Micro USB-B for cabinet IR loading and control via Darkglass Suite
  - Requires regulated 9V DC center-negative supply (120 mA)
