url: https://www.kieselguitars.com/series/guitar/will-swan-signature
description: Though Will Swan is known for his inventive and unique sound, his
  signature model, the WS, sticks to a traditional shape and options. The guitar
  is based on the CS6 and pairs with various Select finishes over a flamed maple
  top.
specs: |-
  - Scale length: 25"
  - Frets: 22 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: mahogany body with flamed maple top, 38.5" long, 2.1" thick, 12.8" wide
  - Neck: tung-oiled mahogany with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: set neck
  - Fingerboard: ebony with 14" radius
  - Headstock: traditional style headstock with flamed maple overlay, painted to match body
  - Bridge: Tune-O-Matic with stop piece, .4125" (10.5mm) spacing
  - Pickups: bezel-mount Kiesel Beryllium humbuckers with chrome metal covers
  - Electronics: two volume and two tone controls, 3-way pickup selector
  - Finish: black burst edges; Select stain finishes over a flamed maple top, including Purple Drink, Midnight Blue and Raspberry Jam
  - Hardware: chrome
  - Inlays: Will Swan signature inlays with standard black-ring Luminlay Super Blue side dots
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Strings: Elixir Nanoweb 1046E
  - Weight: 8.75 lbs
  - Based on the CS6; the only model that allows Select stain finishes over a flamed maple top
