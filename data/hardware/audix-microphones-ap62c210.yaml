details: |-
  A professional true diversity wireless system featuring the AUDIX OM2 handheld transmitter with the ADX10 cardioid lavalier system.

  This is a very efficient and cost-effective solution for combining the hands-free convenience of a lavalier with the flexibility of a handheld mic. The package is ideally suited for presentations, meetings, or events where the lead speaker remains in control while the handheld microphone is passed around either on stage or in the audience.
  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include active directional antennas and an antenna distribution system for up to four systems (8 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - RF frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum tuning
  - True diversity dual-channel reception (R62 receiver)
  - Combo system: OM2 handheld dynamic transmitter + B60 bodypack with ADX10 cardioid lavalier
  - One-touch sync links transmitter to receiver via infrared
