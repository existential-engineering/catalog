description: A true analog 12-voice polyphonic synthesizer in a desktop and
  rack-mount format, with 2 oscillators and 2 LFOs per voice, 3 ADSR generators,
  an 8-channel modulation matrix and a 32-step control sequencer. Four
  simultaneous FX engines, a selectable 12/24 dB analog low pass filter and
  remote control over USB, MIDI or built-in WiFi round out the instrument.
details: |-
  With the creation of the DEEPMIND 12XD, the ultimate true analog, 12-voice polyphonic synthesizer in a convenient desktop or rack mount format is finally a reality. Thanks to its 4 FX engines, dual analog OSCs and LFOs per voice, 3 ADSR Generators, 8-Channel Modulation Matrix and onboard 32-Step Control Sequencer, the DEEPMIND 12XD gives you complete control over your soundscape. It also features comprehensive remote control via iPad/PC/Mac and selected Android Apps over USB, MIDI or built-in WiFi.

  A pure analog signal path with legendary IR3109-style VCFs and stereo VCAs underpins 12-note polyphony. Each voice has 2 oscillators: OSC 1 generates sawtooth and square/pulse waveforms with pulse width modulation, and OSC 2 generates square/pulse waveforms with a unique tone modulation. With 24 oscillators available the oscillator modes include Unison 12, 6, 4, 3, 2 Mono; Mono -2; Mono 4; Mono 6; Poly; Poly 6 and Poly 8, and oscillator sync, oscillator drift and parameter drift recreate the warmth and movement of vintage analog instruments.

  Individual voices also carry 2 LFOs with a range extending into the audio rate, each with adjustable slew rate, modulation delay, key sync, assignable clock sync (internal or external MIDI), envelope auto-triggering, plus Delay and Fade In. The 7 waveform shapes are Sine, Triangle, Square, Ramp Up, Ramp Down, Sample and Hold, and Sample and Glide. A Phase Link option lets the polyphonic LFOs run in Unison or link with an adjustable phase shift between voices, and the LFOs can track key pitch through the modulation matrix.

  Three four-stage ADSR envelope generators per voice carry continuously variable curves, with Legato, Mono and Retrigger trigger modes, and can be triggered by key, by individual LFOs or by the control sequencer and looped well into the audio rate. The 8-channel modulation matrix offers 20 sources and more than 130 destinations, including effects parameters such as reverb tail and the Midas multi-band distortion. The 32-step control sequencer adds an adjustable slew rate, MIDI sync and step values from -127 to 127, with note value, tie and length, slew and swing all mappable as modulation sources.

  Four simultaneous FX engines run over 33 TC Electronic, Midas and Klark Teknik algorithms including Reverb, Chorus, Flanger, Phaser, Delay and Multiband Distortion, all inside a low-latency environment with flexible routing, and a Bypass Mode removes the digital FX from the signal path entirely. Connectivity covers fully servo-balanced stereo TRS outputs, Phones, Sustain, Pedal/CV and MIDI In, Out and Thru, plus MIDI USB for a computer and firmware updates, and an integrated, configurable WiFi client / access point.
specs: |-
  - 12 true analog voices, 24 oscillators total (2 OSCs per voice) with oscillator sync
  - OSC 1: sawtooth and square/pulse waveforms with pulse width modulation
  - OSC 2: square/pulse waveforms with tone modulation
  - Oscillator modes: Unison 12, 6, 4, 3, 2 Mono; Mono -2; Mono 4; Mono 6; Poly; Poly 6; Poly 8
  - 2 LFOs per voice extending into the audio rate, 7 waveforms (Sine, Triangle, Square, Ramp Up, Ramp Down, Sample and Hold, Sample and Glide)
  - 3 four-stage ADSR envelope generators per voice (VCF, VCA, MOD) with continuously variable curves
  - Selectable dual-slope 12/24 dB analog low pass filter per voice with adjustable resonance and tracking
  - Global variable 6 dB high pass filter with +12 dB bass boost switch
  - 8-channel modulation matrix with over 20 sources and more than 130 destinations including effects parameters
  - 32-step control sequencer with adjustable slew rate, MIDI sync and step values from -127 to 127
  - Arpeggiator with tap tempo, up to 6 octaves, 32 preset patterns of up to 32 steps and rests, modes UP, DOWN, UP-DOWN, UP-INV, DOWN-INV, UP-DN-INV, UP-ALT, DOWN-ALT, RAND, AS-PLAYED, CHORD
  - Chord and PolyChord memory up to 12 notes each, storage for 36 six-note chords mappable to trigger keys
  - 4 simultaneous FX engines with over 33 TC Electronic, Midas and Klark Teknik algorithms, plus true bypass mode
  - Polyphonic portamento with fixed rate, fixed time and exponential pitch glide modes
  - Global noise generator
  - 1024 user program memories with compare and match function
  - Control surface: 26 sliders, 33 switches, 1 rotary encoder, 2 knobs, LCD display with encoder and data value slider
  - Integrated and configurable WiFi client / access point; remote control via iPad/PC/Mac and selected Android apps over USB, MIDI or WiFi
  - Comprehensive MIDI implementation with NRPN/CC control of all parameters and bulk load/save
  - Desktop format with rack mount brackets included
  - AC mains powered via rear IEC inlet with power rocker switch
