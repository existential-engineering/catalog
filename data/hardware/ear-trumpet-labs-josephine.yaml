description: A large-diaphragm condenser microphone with a spring-suspension
  design and elegant copper ring. Bright harmonics and presence for
  medium-to-long distance applications, ideal for small acoustic ensembles, on
  stage and in studio.
details: |-
  Josephine is a large-diaphragm condenser microphone spring-suspended in a large copper ring. It is tuned for live performance use and is aimed at miking small acoustic ensembles.

  Josephine has the clarity, gain, feedback resistance and full, natural frequency response for live single-mic situations. It has a pleasing high end with no harshness, and a sound that performers, audiences and engineers describe as astonishingly natural. It also brings that sound into the studio, capturing vocals and acoustic instruments with straightforward clarity.

  Josephine is acoustically identical to Ear Trumpet Labs' Louise and to the maker's various bike gear models. For a slightly warmer, mellower sound in the same applications, Ear Trumpet Labs points to Myrtle instead. Suggested applications are single-miking a small acoustic ensemble, including acoustic instruments and multiple vocalists, on stage or in the studio.
specs: |-
  - Hand-made microphone with unique appearance
  - Capsule and electronics tuned for close vocal use on the loudest of stages with excellent feedback rejection
  - Spring-suspended capsule in a large copper ring
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -41.9 dB (8 mV/Pa)
  - Power requirement: +24V to +48V phantom power
