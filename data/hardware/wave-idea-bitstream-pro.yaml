description: >-
  A universal MIDI controller from French company Wave Idea, offering 35 knobs,
  8 sliders, and 8 buttons with deep MIDI assignment capabilities and a built-in
  parameter LFO.
details: |-
  Released in 2001, the Wave Idea Bitstream Pro was designed to put hands-on control back into MIDI-based music production at a time when software synthesizers and hardware modules increasingly relied on mouse-driven interfaces. Its generous complement of 35 knobs, 8 sliders, and 8 buttons gave producers and performers immediate tactile access to their gear.

  Three user setup snapshots effectively tripled the available controls to 144 assignable parameters. Each control could be mapped to any MIDI continuous controller, RPN, NRPN, or SysEx message up to 24 bytes across all 16 MIDI channels. A built-in LFO with square, triangle, and sine waveforms could modulate any MIDI parameter, syncable to internal or external MIDI clock for tempo-locked sweeps and rhythmic modulation.

  Configuration was handled through companion software available for both macOS and Windows, with preset mappings included for numerous popular synthesizers. Once programmed, settings could be stored permanently on the computer and recalled as needed. The unit could also operate standalone after initial configuration via SysEx dumps. The Bitstream Pro could be used flat on a desktop or rack-mounted, offering flexibility for both studio and live setups.
specs: |-
  - Controls: 35 knobs, 8 sliders, 8 buttons
  - Snapshots: 3 user setups (144 total assignable controls)
  - LFO: Built-in with square, triangle, and sine waveforms
  - MIDI: All 16 channels (CCs, RPNs, NRPNs, SysEx up to 24 bytes)
  - Memory: MIDI setups stored to PC
  - Software: macOS and Windows compatible
  - Mounting: Rack-mountable or desktop
