description: Expand the Monitor ST with up to 4 additional modules for D/A
  conversion, digital input switching, video source switching, and custom RS232
  device control, all from the original Monitor ST remote.
details: |-
  The MONITOR ST has become the audio gold standard for mix and mastering engineers around the globe. But it gets even better.

  Assemble the configuration as desired. Go from stereo to surround, add video switching, digital conversion or custom functions. Can be customized to control any RS232 capable device.

  Each expansion rack supports up to 2 modules, with a maximum of 4 modules per system. Need mastering-quality D to A conversion with multiple inputs and digital input switching? Need to run several computer systems from one monitor? The Additional Switching System delivers.
specs: |-
  - Expand the MONITOR ST or MONITOR ST/SR Combo With Up To 4 More Modules
  - The Original MONITOR ST Remote Still Controls Everything
  - Add D/A Conversion with Digital Input Switching
  - Add Video Source Switching
  - Add Custom Options
