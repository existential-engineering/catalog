name: TPS30 Mini Triple Power Supply
manufacturer: intellijel
primaryCategory: modular
categories:
  - utility
  - discontinued
url: https://intellijel.com/shop/power/mini-triple-power-supply-30w-skiffs-3u-6u-busboard/
description: Lunch Time. You've been thinking about it for years. What should I
  do with this Flintstones™ lunch box. Get started on your conversion with a low
  noise TPS30 Mini 30W power supply.
details: |-
  The TPS30W Mini is a high power, super efficient and low noise studio grade power system for your Eurorack Modular. Intellijel carefully designed this power supply to perform optimally with even the most demanding, noisy and power hungry modules in your rig.

  It is built around a 30 Watt integrated switching power supply with low impedance star distribution on a 4 layer PCB, delivering +12V at 1.2A, -12V at 1.2A, and +5V at 500mA. A triple 120° phased controller keeps induced noise low, and the design includes output short circuit protection with foldback current limiting, output overvoltage protection from transient overshooting, soft start for controlled start up operation, and +/-1% output voltage accuracy.

  The board fits comfortably in a tiny skiff but can also span up to an 84HP 3U / 6U case, and connects up to 10 Eurorack modules. It can be used to expand on the TPS80W or other TPS30W supplies by chaining the DC inputs.

  At 9cm wide by 8cm tall with a max height of 20mm, the mounting holes can be used with 0.157" / 4mm PEM snaps for quick install.
specs: |-
  - 30 Watt integrated switching power supply
  - +12V output at 1.2A
  - -12V output at 1.2A
  - +5V output at 500mA
  - Low impedance star distribution due to 4 layer PCB
  - Triple 120° phased controller for low induced noise
  - Output short circuit protection and foldback current limiting
  - Output overvoltage protection from transient overshooting
  - Soft start for controlled start up operation
  - +/-1% output voltage accuracy
  - Fits comfortably in a tiny skiff but can also span up to 84HP 3U / 6U case
  - Connects up to 10 Eurorack modules
  - Can expand a TPS80W or other TPS30W by chaining the DC inputs
  - Dimensions: 9cm × 8cm × 20mm (max height)
  - Mounting holes usable with 0.157" / 4mm PEM snaps for quick install
