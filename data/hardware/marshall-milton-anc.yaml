description: Discover headphones built to go on the road with you for days,
  thanks to their rugged design and 100+ hours of wireless playtime.
details: |-
  Stay locked in to your music with on-ear headphones that block out the noise in real time. Milton A.N.C. features next-generation adaptive active noise cancellation and a tough, foldable design that stays intact no matter where they are packed. One charge delivers more than three entire days and nights of soundtracks. Directly access your preferred preset with a simple press of the M-button.

  Adaptive ANC and Transparency mode: thanks to several microphones monitoring and analysing your environment, noise is blocked out automatically. To let surrounding sounds back in, it is just one press of a button.

  Soundstage spatial audio: enjoy a listening experience that places you front and centre. Feel like you are in the room with your favourite band or right at the heart of the action as sound expands naturally, filling the space around you.

  Durable and foldable design: perfectly portable and tough enough to handle life in constant motion. Fold them, pack them, drag them out and still get maximum performance and comfort. Adaptive loudness keeps the details of your music alive even when the volume is low, raising the bass and lower mids for a rich, full sound that stays balanced and true when surrounding noise creeps in.

  Customisable M-button: get to your preferred preset in one press of the button, choosing between ANC, Transparency mode, soundstage spatial audio, EQ settings, Spotify Tap or voice assistant. Authorised repair services and spare parts are offered for Milton A.N.C. The battery, ear cushions and USB-C cable are available through the Marshall website, and the outer headband and jog assembly via authorised service centres. Designed and engineered in Sweden. Made in China.
specs: |-
  - Headphone type: On-ear, foldable
  - Driver type: Dynamic
  - Drivers: 32 mm
  - Driver sensitivity: 99.3 dB SPL (1 mW at 1 kHz)
  - Driver impedance: 32 Ohm
  - Frequency range: 20 to 20,000 Hz (SBC, AAC, LC3), 20 to 40,000 Hz (LDAC at 96 kHz)
  - Wireless connectivity: Bluetooth 6.0
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: USB-C to 3.5 mm
  - Codecs: SBC, AAC (MPEG-2), LC3, LDAC
  - Bluetooth Multipoint connectivity: Yes
  - Active noise cancellation: Yes, adaptive, with Transparency mode
  - Microphones: 6, with microphone and remote for calls
  - Controls: control knob, customisable M-button
  - Play time: 50 hours with Bluetooth and ANC, 80 hours with Bluetooth only
  - Quick charging: 15 minutes gives 9.5 hours of playtime
  - Charging time: 2 hours to full recharge
  - Battery: rechargeable and exchangeable, with battery preservation, and no mains inlet
  - Wireless charging: No
  - Weight: 200 g / 7.05 oz
  - Repairability: Yes
  - Box contents: Milton A.N.C. headphones, 3.5 mm audio cord, user manual and legal and safety information, USB-C charging cable, pouch
  - Compatible app: Marshall Bluetooth app, with over-the-air software updates
