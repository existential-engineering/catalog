url: https://www.crownaudio.com/en-US/products/xli-800
description: Two-channel, 300W @ 4Ω power amplifier from Crown's XLi series —
  affordable, reliable power for musicians, DJs, houses of worship, and small
  venues.
details:
  - The XLi 800 is the entry point of Crown's XLi series, a no-nonsense
    two-channel power amplifier delivering 300W per channel at 4Ω. It targets
    musicians, DJs, entertainers, houses of worship, and small venues where
    reliable power and straightforward operation matter more than DSP feature
    lists.
  - Inputs accept RCA or electronically balanced XLR signal with user-selectable
    sensitivity (0.775V or 1.4V). Outputs are provided on both Speakon and
    binding posts, simplifying integration with existing speaker cabling.
    Stereo, parallel, and bridge-mono operating modes are all supported.
  - Forced-air cooling and full protection circuitry guard against shorts,
    no-load conditions, on/off thumps, and RF interference. Front-panel LEDs
    report power, signal presence, clip, and fault status.
specs: |-
  - 2 channels
  - 300W per channel @ 4Ω
  - Frequency Response: 20 Hz - 20 kHz, +0/-1 dB
  - THD: <0.5%, 20 Hz - 20 kHz
  - Slew Rate: >10V/μs
  - Damping Factor: >200 (8Ω, 10 Hz-400 Hz)
  - Signal-to-Noise Ratio: >100 dB (A-weighted)
  - Operating modes: stereo, parallel, bridge-mono
  - User-selectable input sensitivity (0.775V or 1.4V)
  - Forced-air cooling
  - Dimensions: 19" × 3.5" × 12.4"
  - Weight: 25.1 lbs
  - Power: IEC inlet (15A)
