description: "Upgrade your club, rental system or house of worship PA system
  with Mackie DRM212-P 12-inch passive speakers."
details: |-
  Upgrade your club, rental system or house of worship PA system with Mackie DRM212-P 12-inch passive speakers. Custom Mackie transducers and a rugged texture-coated plywood cabinet deliver rock-solid performance, no matter the gig. M10 flypoints and dual-angle pole mounts provide plenty of placement options, making the Mackie DRM212-P perfect for mains, monitors and more.
specs: |-
  - Peak Power: 1600W
  - Power handling: 400W continuous / 800W program / 1600W peak
  - LF Driver: 12"
  - HF Driver: 1.4" Titanium diaphragm compression driver
  - Frequency Response: 50Hz - 20 kHz
  - Max SPL: 128 dB
  - Cabinet: 15mm texture-coated plywood construction
  - 8x M10 flypoints
  - Dual-angle pole mount
  - Weight: 44.2 lb / 20 kg
