description: Second-generation Maxwell wireless gaming headset with
  patent-pending SLAM acoustic management, 24-bit/96kHz wireless audio, advanced
  FILTER AI mic processing, and the new ReSkin magnetic side-plate system.
details: |-
  The best sound in gaming - just got better.

  We've upgraded the best-performing wireless headset on the market with even better audio quality, improved comfort, and exciting new features. Experience heightened spatial immersion, tactical precision, and punchier bass response from our patent-pending SLAM technology. Advanced high-bandwidth microphone processing ensures you always sound your best on chat and stream.

  Lose yourself in the intricately crafted sonic worlds of your favorite games when you experience Maxwell 2's vividly lifelike audio. Built for marathon gaming sessions with a new wide, ventilated head strap and an upgraded earpad design with more space to accommodate a wide range of users.

  Hear every footstep and reload with surgical accuracy from our most advanced 90mm planar drivers to date. Experience heightened spatial positioning, studio-grade clarity, and powerfully dynamic bass that hits hard, goes low, and never gets muddy.

  Maxwell 2 plays well with all your devices, offering up to 24-bit/96kHz high-resolution audio in ultra-low latency with USB-C wireless dongle and USB-C wired connections. Bluetooth supports Auracast, LE Audio, LDAC, and AAC. You can easily change the look of your headset with the new ReSkin system - just remove the magnetic side plates and pop on your choice of curated styles.
specs: |-
  - Style: Over-ear (circumaural), closed-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Acoustic management: SLAM (patent-pending)
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-Thin Uniforce
  - Transducer size: 90 mm
  - Maximum SPL: >115dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Spatial Audio: Dolby Atmos (Xbox) / Tempest 3D (PlayStation)
  - Weight: 560g
  - Boom Microphone: Detachable, Hypercardioid
  - Mic Beamforming: Physical and AI noise reduction, internal mic for chat
  - Battery type: Lithium-polymer, 1800mAh
  - Battery life: Over 80 hrs wireless playback @ 80dBA
  - Fast charge: USB-C, 5v 1.8 Amp max - 25% charge / 20min (Full charge 2hr)
  - Wireless: USB-C, Ultra-low-latency; Bluetooth 5.3
  - Bluetooth support: Multipoint, LE Audio, LC3, LC3plus, LDAC, AAC, SBC
  - Wired Digital: USB-C with dual-audio endpoints and game-chat mix
  - Wired Analog: 3.5mm TRRS active
  - High-res audio: Up to 24-bit/96kHz wireless
