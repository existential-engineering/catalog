description: The BASSWITCH SONIC PARK integrates a harmonic overtone generator
  into a complex EQ section that will make your bass sound shine over stages,
  studios and rehearsal rooms.
details: |-
  The BASSWITCH SONIC PARK integrates a harmonic overtone generator into a complex EQ section that will make your bass sound shine over stages, studios and rehearsal rooms. This sonic flavour enhancer is equipped with LEHLE True Sound Technology, which means it switches via goldplated relays, has a discrete JFET input stage and works internally with 18 V. The BASSWITCH SONIC PARK has a gain control of +/-15 dB.

  This will also enable our three BASSWITCH babies to work as a compact standalone preamp in front of an active monitor or bass cab, while the housing is designed to perfectly match the BASSWITCH IQ DI.
specs: |-
  - Harmonic overtone generator integrated into a complex EQ section
  - Gain control of +/-15 dB
  - LEHLE True Sound Technology with discrete JFET input stage
  - Switching via gold-plated relays
  - Works internally with 18 V
  - Housing designed to match the BASSWITCH IQ DI
  - Can work as a compact standalone preamp in front of an active monitor or bass cab
