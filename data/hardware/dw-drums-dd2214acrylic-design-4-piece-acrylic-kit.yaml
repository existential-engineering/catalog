description: The DW Design Series made custom-style drums available to more drummers than ever, and these are the first acrylics to receive the DW moniker.
details: |-
  Clearly the top choice on every drummer's wish list. They're the first acrylics to receive the DW moniker. The transparent 5MM thick extruded, seamless acrylic shells are outfitted with pro features such as STM (Suspension Tom Mounts), True-Pitch Tuning, MAG Throw-Off, F.A.S.T. (Fundamentally Accurate-Sized Toms), and DW Heads by Remo.

  Sizing shown 18x22″ bass drum, 14x16″ floor tom, 8x10″ and 9x12″ toms. Snare drum, hardware, and cymbals sold separately. Includes two-piece bass drum pillow set (DSCPBDP2W).

  Design Series features include seamless acrylic shells (5mm thick extruded, seamless transparent acrylic), STM Suspension Tom Mounts for support and resonance, True Pitch Tuning with extra threads to dial in tuning while reducing unwanted slippage, and graduated chrome steel triple flange counter hoops.
