details: |-
  The Benchmark DAC1 PRE is a reference-quality 2-channel digital-to-analog audio converter designed for both professional studio and high-end home audiophile use. It offers five digital inputs (three coaxial S/PDIF, one optical, and one USB) alongside two relay-selected analog inputs, all accessible via a front-panel rotary input selector.

  The DAC1 PRE features Benchmark's jitter-immune UltraLock clock system, which effectively isolates the internal DAC clock from jitter present on incoming digital signals. The AdvancedUSB technology supports 24-bit audio at up to 96 kHz without the need for additional drivers on most platforms.

  A built-in HPA2 headphone power amplifier drives two front-panel 1/4-inch headphone jacks simultaneously. Headphone gain is programmable at 0 dB, -10 dB, or -20 dB, and a programmable mute switch on the left headphone jack allows for independent muting. The output level can be set to calibrated fixed or variable (volume-controlled) operation.

  The unit is housed in a rack-mountable chassis and features an international power supply supporting all worldwide voltages. This model has been discontinued and replaced by the DAC2 Series.
specs: |-
  - Jitter-immune UltraLock™ clock system
  - AdvancedUSB™ technology: 24-bit, 96 kHz USB audio input
  - HPA2™ headphone power amplifier (2 front-panel 1/4" outputs)
  - Programmable headphone gain: 0 dB, -10 dB, -20 dB
  - Programmable mute switch on left headphone jack
  - 5 digital inputs: 3 coaxial S/PDIF + 1 optical + 1 USB
  - 2 relay-selected analog inputs (RCA)
  - Balanced XLR analog outputs
  - Unbalanced RCA analog outputs
  - Calibrated or variable (volume-controlled) output levels
  - International power supply (all worldwide voltages)
