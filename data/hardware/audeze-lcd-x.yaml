description: Professional reference headphones for audio mixing and mastering,
  featuring 106mm planar magnetic drivers in an open-back design.
details: |-
  The LCD-X is Audeze's best-selling professional reference headphone since 2013, positioned as the gold standard of the professional audio world for mixing, mastering, and audiophile applications.

  Featuring extra-large 106mm planar magnetic drivers with Ultra-Thin Uniforce diaphragms, Fazor waveguides, and Neodymium N50 magnets, the LCD-X delivers reference-grade accuracy in an open-back design that provides natural soundstage.

  Highly efficient at 20-ohm impedance, the LCD-X is easy to drive from most interfaces while still offering the headroom and detail demanded by professional engineers.

  The headphones ship with a braided OCC copper 4-pin XLR combo cable with 1/4 inch adapter and travel case.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Planar Magnetic
  - Transducer size: 106 mm
  - Magnetic structure: Proprietary magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-Thin Uniforce
  - Frequency response: 10Hz - 50kHz
  - Maximum SPL: >130dB
  - THD: <0.1% @ 100 dB SPL
  - Sensitivity: 103 dB/1mW (at Drum Reference Point)
  - Impedance: 20 ohms
  - Max power handling: 5W RMS
  - Min recommended power: >100mW
  - Recommended power level: >250mW
  - Cable length: 1.9m (6.2ft)
  - Cable termination: 4-pin XLR with 1/4 inch adapter
  - Wire material: 20 AWG high-purity OCC audio-grade copper
  - Weight: 612g
