name: Cinnamon
manufacturer: bastl-instruments
primaryCategory: filter
url: https://bastl-instruments.com/eurorack/modules/cinnamon
description: "A 5HP voltage-controlled state variable filter with a unique
  character. Voltage-controlled cutoff with CV attenuator and a separate V/OCT
  input. Audio input with gain control and a drive switch for overdrive. Two
  character switches alter the resonance response and self-oscillation
  waveforms. Three simultaneous outputs: lowpass (12dB/oct), bandpass (6dB/oct),
  and highpass (12dB/oct). Self-oscillates at maximum resonance. Available with
  aluminum or oak wood panel. Hand-assembled in Brno, Czech Republic."
details: |-
  Cinnamon is a voltage-controlled state variable filter offering a uniquely characterful sound. The cutoff frequency is controlled by a dedicated knob and a CV input with its own attenuator, while a separate V/OCT input allows precise pitch-tracking without attenuation.

  The audio input includes a gain knob, and a drive switch engages input overdrive for added harmonic content. Two character switches modify the resonance response and shape the waveforms the filter produces when self-oscillating — giving a wide range of tonal options from clean and surgical to saturated and unpredictable.

  All three filter modes are simultaneously available as separate outputs: lowpass (12dB/oct, 2-pole), bandpass (6dB/oct, 1-pole), and highpass (12dB/oct, 2-pole). When resonance is pushed to maximum the filter enters self-oscillation, producing phase-shifted sine waves at each output simultaneously.

  Hand-assembled in Brno, Czech Republic. Available with either an aluminum panel or an oak wood panel with custom knobs. The 16-pin power connector includes PTC fuse and reverse-polarity diode protection.
