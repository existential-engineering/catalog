details: |-
  The OMSynth is a circuit development and performance interface designed to help you quickly build audiovisual instruments from scratch and experiment with them live. Developed by Casper Electronics in collaboration with Bastl Instruments, it targets those with some circuit-building experience, though beginners are welcome with additional self-study.

  The OMSynth features a 3-channel audio mixer with weighted inputs (×1, ×1, ×10), an amplified speaker with volume control, a dual mono headphone output, and 2 stereo I/O jacks for external connections. Regulated 5V and unregulated power sockets are available on-board, with 200mA over-current protection.

  Interaction and sensing are provided by 5 modular 100kΩ potentiometers with 1kΩ buffer protection, 1 pushbutton with integrated on/off switch, 3 touch sensors on the OMS logo, a tri-color LED with discrete channel drivers, and a light sensor functioning as a basic vactrol. Two full-size breadboards and a laser-engraved base plate with carrying handle allow for rapid circuit prototyping. An expansion section supports custom satellite boards.

  Discontinued. Assembly documentation including guide, BOM, schematics, and board diagrams remains available.
