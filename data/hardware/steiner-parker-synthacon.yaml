description: >-
  The Steiner-Parker Synthacon is a portable three-oscillator monophonic analog
  synthesizer produced from 1975 to 1979, featuring the same circuitry as the
  larger modular SynthaSystem. Known for its fat tone, durable construction, and
  stable tuning, it rivals the Minimoog with a unique multimode filter that
  maintains full volume at high resonance settings.
details: |-
  The Synthacon was designed by Nyle Steiner as a portable alternative to his modular SynthaSystem, packing three voltage-controlled oscillators into a compact keyboard instrument. Its distinctive Steiner-Parker filter can self-oscillate like the Minimoog but uses opposite polarity, so it does not lose any volume when resonance is increased, giving it a unique sonic character.

  Each of the three oscillators supports modulation from multiple sources including the LFO, envelope generators, VCF, sample-and-hold, and the other oscillators, enabling complex timbral possibilities. The multimode resonant filter can be switched between lowpass, bandpass, and highpass configurations, providing a wide range of tonal shaping options. White and pink noise generators are also included for adding texture and creating percussive or ambient sounds.

  Two envelope generators control the voltage-controlled amplifier, oscillators, noise, and filter parameters. Earlier production models featured distinctive silver-faced panels, while later versions included a duophonic Two Voice Synthacon variant. Notable users of the Synthacon include Earth Wind and Fire, Joe Walsh, the Doors, Frank Zappa, and John Paul Jones.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs (VCO1: sawtooth, sine; VCO2-3: sawtooth, square, pulse)
  - Noise: White and pink noise generators
  - Filter: 2-pole resonant multimode VCF (lowpass, bandpass, highpass)
  - Envelopes: 2 (ADSR envelope generator, trigger generator)
  - Amplifier: VCA
  - Effects: Sample and hold, portamento
  - Keyboard: 49 keys with tune, scale, portamento, range select
  - Range: 8 octaves
  - Control: CV/Trigger
  - Memory: None
  - Production Years: 1975-1979
