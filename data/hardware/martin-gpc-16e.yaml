details: |-
  The Martin GPC-16E is part of the 16 Series, combining a Grand Performance 14-fret body shape with Auditorium (000) depth. This blend delivers balanced projection and articulate response while remaining comfortable to hold for extended playing sessions.

  A satin-finished spruce top is paired with mahogany back and sides, producing a warm, focused voice with a clear top end. Forward-shifted scalloped spruce X-bracing helps the soundboard breathe freely, contributing to the guitar's responsive dynamics and sustain.

  The select hardwood neck features Martin's Modified Low Oval profile with a High-Performance Taper, an ebony fingerboard, and a 25.4" scale length. A compensated white Tusq saddle on an ebony modern belly bridge supports accurate intonation across the 20 frets.

  Martin E1 electronics are built in, providing onboard volume, tone, and phase controls along with a chromatic tuner, so the guitar is stage-ready out of the case. The instrument ships in a waterproof softshell case with backpack straps.

  Handcrafted in Martin's Nazareth, Pennsylvania factory, the GPC-16E is offered with mahogany or East Indian rosewood back and sides and is available in both right- and left-handed configurations.
specs: |-
  - Body size: Grand Performance 14-Fret (000 depth)
  - Top: Spruce, satin finish
  - Back and sides: Mahogany, satin finish
  - Bracing: Forward-shifted scalloped spruce X-brace, 5/16"
  - Neck: Select hardwood, Modified Low Oval profile
  - Neck taper: High-Performance Taper
  - Scale length: 25.4"
  - Fingerboard: Ebony
  - Frets: 20 total, joins body at 14th fret
  - Nut width: 1 3/4"
  - Fingerboard width at 12th fret: 2 1/8"
  - Bridge: Ebony, modern belly with drop-in saddle
  - Saddle: Compensated white Tusq, 16" radius
  - Tuning machines: Nickel open gear
  - Headstock: Solid with square taper
  - Electronics: Martin E1 with volume, tone, phase, and built-in chromatic tuner
  - Finish: Satin throughout
  - Case: Waterproof softshell with backpack straps
  - Handedness: Right- or left-handed
  - Handcrafted in Nazareth, Pennsylvania, USA
