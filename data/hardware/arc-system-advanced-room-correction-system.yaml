details: |-
  Arc system (advanced room correction system) is a combination of a
  professionally calibrated measurement microphone, a measuring software
  application and a multi-platform plug-in that can be integrated with any
  DAW-based studio, capable of correcting the distortion caused by room
  acoustics and able to improve how a studio will sound forever.

  Arc features audyssey multeq, which corrects for both frequency and phase
  response, not only for the engineer's 'sweet spot', but also for multiple
  points in the room. This solves many of the problems that have plagued room
  correction eq systems since their inception. Other eq systems only correct for
  frequency domain problems, which leaves the time domain to cause phase
  distortion and smearing.

  Arc system will correct acoustic problems for any DAW-based studio,
  dramatically improving the clarity, stereo imaging and frequency response, for
  faster, more reliable mixing. Low-end alterations, typically added by small
  rooms, are removed with better low frequency control. More consistent
  frequency response across the entire range. Tonal balance is restored,
  allowing for more accurate mixes.

  Arc provides a convenient, unique, and easy-to-use mobile correction solution
  for the traveling professional engineer and musician. You can conveniently
  bring arc system with you and quickly measure and correct any studio
  environment, so you can mix and produce comfortably in any situation. The
  step-by-step setup measurement wizard will have you up and running in minutes.

  Arc system measurement software features automatic multi-point room
  measurement system, wizard based, based on audyssey multeq technology. Arc
  system correction plug-in is a multi platform high quality frequency and time
  correction processor based on audyssey multeq technology with four target
  curves and graphic frequency response display.
specs: |-
  - Audyssey multeq technology
  - Frequency and phase response correction
  - Multi-point room measurement
  - 32-bits floating point processor
  - Supported sampling rates: 32 kHz to 96 kHz
  - Four target curves
  - Graphic frequency response display
  - Professional measurement microphone: 1/4" precision measurement condenser microphone
  - Omni directional polar pattern
  - Capsule frequency response: 20-16,000 Hz
  - Calibrated frequency response: 16-20,000 Hz, +/- 1.5 dB
  - Transformerless, electronically balanced output
  - 200 ohms output impedance
  - Sensitivity: 50 mv/pa
  - Noise equivalent level: 22 dB
  - Max spl: 130 dB for 3% thd
  - Measurement precision: +/- 1.5 dB
  - Correction precision: +/- 1.5 dB
  - Requires 48 kHz operation for measurements
  - Asio audio hardware on Windows vista or xp
  - Coreaudio on Mac OS X
  - DAW integration: Pro Tools, Cubase, logic, sonar, live
