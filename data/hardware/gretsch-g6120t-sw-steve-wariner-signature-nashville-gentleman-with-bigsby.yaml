details: |-
  Gretsch celebrates the incredible talents of revered country musician Steve Wariner with the G6120T-SW Steve Wariner Signature Nashville Gentleman with Bigsby. A Grand Ole Opry and Kentucky Music Hall of Fame member, four-time Grammy-award winning artist Wariner has released 19 studio albums and more than 50 charted Billboard singles including 14 No. 1 hits.

  The single-cutaway hollow body combines with a TV Jones TV Classic Plus bridge pickup and a TV Jones Paul Yandell Duo-Tron neck pickup for that classic powerful and big-body Gretsch sound. A master volume and master tone control with a push-pull pot for coil splitting offers expanded tonal versatility.

  The 12"-radius ebony fingerboard features classy aged mother of pearl Neo-Classic thumbnail inlays and 22 medium jumbo frets. Hardware includes a Bigsby B6GP String-Thru tailpiece and a pinned vintage-style Tru-Arc brass rocking bar bridge.

  Dressed in a Magic Black finish with shiny gold G-arrow control knobs and matching hardware, aged white binding with black and white purfling, and a gold plexi pickguard.
