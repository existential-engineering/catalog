description: A tolex-enclosed tape echo variant with vintage-voiced tape heads,
  wow and flutter modulation controls, extended motor speed range, analog spring
  reverb, and live tape looping via record/erase head control.
details: |-
  PRE-SALE LIMITED NUMBERS (Introductory PRE-SALE Price) - Ships 6 weeks from purchase date. USA CUSTOMERS - Echo Fix covers the Tariff and custom charges via our express courier. This checkout price is an all inclusive price for USA customers. Introducing the Echo Fix EF-X3 Vintage Voice. Built on the EF-X3 platform, the Vintage Voice delivers the warmth and character of classic tape echo machines with hands-on control over every imperfection. Controls to introduce Wow and Flutter via sample-and-hold modulation to bring organic movement to your repeats, while an analog spring reverb section adds genuine vintage depth. An extended motor speed range allowing for slower delay times and introduces the lo-fi textures of aging tape. The Record/Erase Off controls unlock a live tape looping mode - disable the Erase head to hold your loop, then switch off the Record head and layer your performance on top. For players who want the real thing, and then some. Key EF-X3 Vintage Voice features

  100% Analog
  Now with an Analog BBD Chorus & Analog Spring Reverb, the EF-X3 boasts a 100% analog signal path. Individual Playback Head Outputs for stereo effect from mono source
  Individual outputs for each playback head offer flexibility never seen before in a tape echo, with the ability to achieve a classic Stereo Ping-Pong delay effect from a mono source by panning each playback head externally via a mixer or DAW. Unmatched Reliability
  On top of this, we've implemented a new auto tape stop circuit to extend tape life. Same Team, Same Peace of Mind
  For nearly 15 years, we've been keeping tape echos alive. Now that we make our own, our standards are higher than ever. Rest assured that your machine will be the most capable, reliable tape echo on the market, supported by a team with some of the best customer service in the industry. It's Alive
  If you've been in a room with one of our units, you'll know what we mean by this. Used as an effect, they simply make everything sound better. But turn up the echo volume, dial in some feedback and watch as our unit self-oscillates into life and becomes an instrument more than an effect. The EF-X3 will change the way you make music. EF-X3VV Features

  Head Mode Settings

  Mode 1 - Head 1

  Mode 2 - Head 2

  Mode 3 - Head 3

  Mode 4 - Head 1 + 2

  Mode 5 - Head 2 + 3

  Mode 6 - Head 1 + 3

  Mode 7 - Head 1 + 2 + 3

  Sound On Sound is another head that can be switched on over the top of all the head mode settings or you can use the SOS head independently. Tape Speed - 3 IPS to 15 IPS

  Weight: 12Kgs

  Please Note: These items are shipped from Australia and Import duties / fees are the responsibility of the buyer. Make sure that you are familiar with your country's customs, taxes and importing laws.
specs: |-
  - Vintage-voiced echo repeats capturing the warmth and character of classic tape echos utilizing new tape heads.
  - Wow & Flutter controls using sample-and-hold random modulation, breathing life and unpredictability into your signal for that authentic, living-tape feel. The new LFO Mod adds RATE and DEPTH controls to control the speed and intensity of the modulation. The SHAPE knob blends seamlessly between a SINE waveform and a SAMPLE AND HOLD waveform. This allows you to dial in the exact amount of entropy to your echo repeats.
  - New Analog Spring Reverb section voiced after beloved vintage units, adding lush, organic depth that only real springs can deliver. Dial it up and you're deep in dub territory.
  - Extended Motor Speed Range for longer delay times and gloriously lo-fi repeats.
  - Record/Erase Off controls unlock a live tape looping mode. Disable the Erase head to hold your recorded loop, then switch off the Record head and layer your performance on top.
  - Fast Head Mode Switching
  - Real Tape Based Chorus Effects (as well as normal BBD Chorus)
  - LFO Output (via ring of CV motor control jack)
  - New Spec Vintage Voiced Tape Heads
  - Vintage Voice Blue Front Panel
  - Direct playback head outputs allowing for external panning for stereo ping pong delays from a mono source
  - Analog BBD Chorus with rate and depth controls
  - Analog Spring Reverb
  - Independent SOS switching for longer delay time (1.2 seconds)
  - Direct WET output at rear for Reverb/Chorus
  - Balanced Input and Output at rear
  - Auto tape stop when no audio signal present to extend tape and motor life (There is a switch at the rear to disable this feature).
  - CV Control for Motor Speed and Feedback level (0-5v) via compatible Expression Pedals
  - Bass and Treble Controls (Echo Signal)
  - Vintage Guitar/Line FET Preamp (Front Panel)
  - High/Low Output level switch (Front Panel Output)
  - Four echo playback heads (including SOS head)
  - Motor ON/OFF Switch for tape slow down effect
  - Mute the reverb, echo and chorus signal via remote foot switches
  - Comes with a worldwide-compatible, 100 - 240v power supply (no step-down or other transformers required)
  - 2 Years Warranty for all pre-sale purchases with peace of mind that this is made by a company that has been operating for nearly 15 years specialising in tape echo repair and spare parts
  - Removable Tinted Acrylic Lid
  - High quality scratch resistant front panel
  - 2 Tape loops supplied with each unit
