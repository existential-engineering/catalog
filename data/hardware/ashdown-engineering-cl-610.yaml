description: Handmade in the UK from birch ply, the CL-610 is a Classic Series
  bass cabinet featuring custom drivers, dual Speakon/jack connectors, horn
  control switch, heavy-duty vinyl covering, and vintage red grilles. It
  delivers huge bottom end with real definition and is the ideal solution when
  an 8x10 is overkill and a 4x10 just isn't enough. Rated at 1200W at 4 ohms, it
  features 6 x 10-inch custom Eminence drivers in a tilt-back cabinet with bar
  handles, castors, kick plates, and slide rails.
details: |-
