details: |-
  One of the most revered and highly sought after guitars in history, the Gretsch Falcon is a true holy grail instrument. The Professional Falcon model takes it to a whole new level, from its decadent aesthetics to its deep, rich sound.

  A 17"-wide, 2.5"-deep laminated maple body with Arc-Tone bracing (torrefied maple tone bars) delivers a rich, resonant voice, while a 25.5" scale maple neck with a standard "U" profile carries a 12"-radius ebony fingerboard with rolled edges, 22 medium jumbo frets and pearloid Neo-Classic inlays.

  PRO-FT Filter'Tron humbucking pickups — Alnico 2 in the neck and Alnico 5 in the bridge — feed neck and bridge volumes plus master volume and master tone through a 3-position toggle. A String-Thru Bigsby B6 tailpiece, Adjusto-Matic bridge on a pinned ebony base, Graph Tech TUSQ XL nut, and Grover Imperial locking tuners round out the package, which ships in a G6242L Gretsch 17" deluxe hollow body hardshell case.
