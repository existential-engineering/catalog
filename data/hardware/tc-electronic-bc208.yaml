details: |-
  BC208 is a powerful, compact bass cabinet with plenty of low-end punch, making it ideal for small venue gigs and rehearsal spaces, as well as the recording studio. It’s perfect for clear, focused bass tones, and its practical form factor makes BC208 as easy on your back as your bank account.

  Lightweight Low-End

  Featuring a pair of powerful 8" custom-engineered drivers, BC208 is voiced for deep fundamental bass tones with 200 Watts of power handling capability. This twin 8" speaker configuration is unmatched for clear and focused bass tones with an immediate response and super-tight feel. BC208 produces loads of low-end thump that will blow your mind, especially coming from a cabinet of this size!

  Rack ‘em and Stack ‘em

  Designed to stand either horizontally or vertically for tight stage arrangements, BC208 makes it easy to stake your claim to your share of the stage real estate with the rest of the band. Dual speaker link connections on premium ¼" connectors allows you to stack your BC208(s) with any other TC cabinet for an unrivaled bass tour de force!
