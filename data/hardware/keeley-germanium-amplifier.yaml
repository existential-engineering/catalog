details: |-
  The Germanium Amplifier is a Custom Shop single-knob preamp, designed and hand built by Robert Keeley and intended as the first, or the only, pedal between a guitar and an amplifier. It adds boost, gain and colour rather than a distinct effect.

  Because germanium transistors vary in bias and temperament, each unit was voiced individually: some come out hotter with more edge, others warmer and smoother, which makes every one slightly different. The units carry the builder's signature for that reason.

  The graphics were made with the artist Phillip Ortiz and look back to the maker's early work and to vintage stereo equipment, with one large knob that can be turned by foot, the current logo and a blue LED.

  The pedal is built with the Tungsram AC125 germanium PNP transistor. A bias control inside the enclosure, reachable with the back plate removed, sets how much gain is available, and each unit ships able to go from fairly clean to a little vintage breakup. It likes being fed straight from guitar pickups and is interactive with them, so tuners, wahs, fuzzes and drives are best placed after it. Power comes from a standard 9 volt supply or an isolated supply.
