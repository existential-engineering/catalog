description: The 002H T is a Traditional Series 12-fret 00-size acoustic guitar
  combining East Indian rosewood back and sides with vintage-inspired
  construction. The ultra-thin nitrocellulose lacquer finish and unique neck
  construction make for a woody and articulate voice with rich, balanced tone
  and excellent note separation.
details: |-
  The 002H T is the Traditional Series variant of the classic 12-fret 00-body guitar with East Indian rosewood back and sides and herringbone-inspired trim. It delivers the 00's rich, balanced tone with excellent note separation through a vintage-inspired lens, featuring an ultra-thin nitrocellulose lacquer finish, abbreviated soundboard graft (tongue brace), and Traditional neck construction.

  The 2-style appointments include ivoroid body binding with small brown herringbone purfling, a zipper backstrip, gold MOP diamond and square fingerboard inlays, and a stained exotic ebony peghead veneer. The slotted square peghead with volute and pyramid-style bridge complete the vintage aesthetic.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard inlays: Gold MOP short diamond & squares
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Fingerboard radius: 14" - 26" compound
  - Neck profile: Traditional
  - Peghead: Tapered slotted square with volute
  - Scale length: 24 7/8"
  - Body width: 14 1/4"
  - Body length: 19 3/8"
  - Body depth: 4"
  - Total length: 38"
  - Body binding: Ivoroid with small brown herringbone purfling
  - Backstrip: 2-style (Zipper)
  - Rosette: Custom wood rosette
  - Body finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
  - Bracing: Custom Traditional Series pre-war scalloped X-brace
  - Strings: D'Addario EJ-16 (.012"-.053")
