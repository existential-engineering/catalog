description: Experience the classic charm of the Model 4003W Bass Guitar,
  featuring walnut and maple for impressive sound and aesthetics.
details: |-
  The Classic Rickenbacker bass has been strengthened with Walnut for a solid
  and natural look that keeps with the traditional character of the instrument
  made famous for its ringing sustain, treble punch and solid underlying bass.
  A subtle strip of binding graces the elegantly curved body and the Maple
  fingerboard. Deluxe triangular inlays and stereo capability are standard
  features.
specs: |-
