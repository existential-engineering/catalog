description: "The Fiore-H humbucker fulfills Lettieri’s desire for extensive
  versatility in the treble position: enough power and punch for high-gain lead
  tones, but with a smooth top end that allows the pickup to be played clean,
  even with the volume knob wide open."
details: |-
  The Fiore-H humbucker fulfills Lettieri’s desire for extensive versatility in the treble position: enough power and punch for high-gain lead tones, but with a smooth top end that allows the pickup to be played clean, even with the volume knob wide open. Both the Fiore-S and -H pickups work seamlessly together, producing balance, clarity, and that elusive ‘bloom’ in all five positions.
