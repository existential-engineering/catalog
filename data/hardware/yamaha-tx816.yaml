description: >-
  The Yamaha TX816 is a massive rack-mount FM synthesis system from 1984 that
  houses up to eight TF1 modules, each equivalent to a DX7, delivering up to 128
  voices of polyphony and 48 operators of FM synthesis power.
details: |-
  The TX816 represents the pinnacle of Yamaha's first-generation FM synthesis
  hardware. Released in 1984, this rack unit could accommodate up to eight TF1
  modules, each of which is essentially a DX7 condensed onto a single circuit
  board with minimal front panel controls.

  A fully loaded TX816 delivers a staggering 128 voices of polyphony across
  eight independent 16-voice, 6-operator FM synth engines. Each TF1 module
  provides 32 algorithms and stores 32 patches, giving a complete system
  access to 256 patches total. Eight independent XLR audio outputs allow
  discrete mixing of each module.

  The system was designed to be controlled externally via MIDI, with each TF1
  module having its own MIDI input and output plus a global MIDI connection.
  This made the TX816 ideal for studio setups where multiple FM voices needed
  to run simultaneously under software or hardware sequencer control.

  The TX816 found its way into major professional studios and touring rigs,
  with artists like Kitaro, Chick Corea, Michael Jackson, Europe, and Scritti
  Politti employing its dense FM textures. Its 8-part multitimbral capability
  made it a cornerstone of MIDI-based production throughout the mid-1980s.
specs: |-
  - Polyphony: Up to 128 voices (8 x 16-voice TF1 modules)
  - Synthesis: 6-operator digital FM with 32 algorithms per module
  - Multitimbral: 8 parts
  - LFO: Yes (per module)
  - Filter: None
  - Effects: None
  - Memory: 256 patches (32 per module x 8)
  - Outputs: 8 independent XLR audio outputs
  - Control: MIDI (1 IN/OUT per TF1 module, 1 global IN/OUT)
releaseDate: "1984"
releaseDateYearOnly: true
