description: HTM72 S3 is the more compact center-channel speaker in the new 700
  Series. It features a Carbon Dome tweeter and twin Continuum cone Mid/Bass
  drivers, and it's the perfect partner for a home theater system based around
  the 704 S3, 706 S3 or 707 S3.
details: |-
  HTM72 S3 is the compact centre channel loudspeaker of the third-generation Bowers & Wilkins 700 Series, a 2-way vented-box design carrying one 25mm Decoupled Carbon Dome high-frequency unit and two 130mm Continuum cone bass/midrange drivers with Flowport venting. Bowers & Wilkins positions it as the premium choice for smaller set-ups and the partner for a home theatre system built around the 704 S3, 706 S3 or 707 S3, where it sits below the three-way HTM71 S3 in the range.

  The Carbon Dome tweeter is purpose-built for the 700 Series. Bowers & Wilkins describes it as a dramatic improvement on the aluminium double dome unit it replaces, raising the breakup threshold to 47kHz for pinpoint imaging accuracy and detail. Unlike the HTM71 S3 it is mounted in the cabinet face rather than in a Solid Body Tweeter-on-Top housing, which is part of what keeps the cabinet to 165mm high and 266mm deep.

  The two bass/midrange drivers use the Continuum cone, whose composite construction avoids the abrupt transitions in behaviour that can impair a conventional drive unit. The company's stated result is a more open, neutral performance that delivers voices and instruments with precision and transparency, which on a centre channel is above all a claim about dialogue clarity.

  The cabinet is entirely passive, with no on-board amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals take 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins to satisfy European CENELEC rules.

  Installation follows the manual's centre-channel guidance: behind the centre of an acoustically transparent projection screen where one is used, or directly above or below the screen on a floor stand, furniture unit or wall shelf, as close to ear height as possible. Four self-adhesive rubber feet are supplied to fit to the base for vibration isolation when the speaker shares a shelf or rack with other AV equipment, and a foam port plug is supplied for trimming low-frequency output when the speaker sits close to a wall. The cabinet is offered in Gloss Black, Satin White and Mocha, with a Black grille and a Grey grille offered on the Satin White finish.
specs: |-
  - Description: 2-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 2x 130mm (5 in) Continuum cone bass/midrange
  - Frequency range: 48Hz to 33kHz
  - Frequency response: 70Hz to 28kHz +/-3dB
  - Sensitivity: 87dB spl (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 100Hz to 22kHz, less than 0.5% 200Hz to 22kHz
  - Nominal impedance: 8 ohms (minimum 4.3 ohms)
  - Recommended amplifier power: 30W to 120W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Continuum cone bass/midrange, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 165mm (6.5in) cabinet only; width 477mm (18.8in) cabinet only; depth 266mm (10.5in) cabinet only, 302mm (11.9in) including grille and terminals
  - Net weight: 9.66kg (21.3lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
  - Supplied with grille, foam port plug and four self-adhesive rubber feet
