details: |-
  The HTM72 S3 is the more compact of the two center-channel loudspeakers in the third-generation Bowers & Wilkins 700 Series, designed as a timbre-matched partner for 704 S3, 706 S3, or 707 S3 front-channel speakers in a home-theater configuration.

  It is a 2-way vented-box system combining a single 25mm (1 in) Decoupled Carbon Dome high-frequency tweeter with two 130mm (5 in) Continuum cone bass/midrange drivers, tuned via Bowers & Wilkins' Flowport technology for low-noise port behavior. The Carbon Dome construction raises the tweeter's first breakup mode to 47kHz for improved imaging compared with conventional aluminum-dome designs.

  Nominal impedance is 8 ohms (4.3 ohm minimum) with a sensitivity of 87dB SPL (2.83Vrms at 1m) and a recommended amplifier power range of 30W to 120W into 8 ohms. Frequency response is quoted as 70Hz - 28kHz (±3dB), with a usable range from 48Hz to 33kHz.

  The cabinet measures 165 x 477 x 266mm (H x W x D, cabinet only) and weighs 9.66kg (21.3 lb). Available finishes are Gloss Black, Satin White, and Mocha. Bowers & Wilkins covers the passive loudspeaker with a five-year warranty.
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm (1 in) Decoupled Carbon Dome
  - Bass/midrange drivers: 2x 130mm (5 in) Continuum cone
  - Frequency range: 48Hz to 33kHz
  - Frequency response: 70Hz - 28kHz (±3dB)
  - Sensitivity: 87dB SPL (2.83Vrms at 1m)
  - Nominal impedance: 8Ω (minimum 4.3Ω)
  - Recommended amplifier power: 30W - 120W into 8Ω
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (200Hz - 22kHz) at 90dB SPL, 1m on axis
  - Max recommended cable impedance: 0.1Ω
  - Dimensions (H x W x D): 165 x 477 x 266mm (6.5 x 18.8 x 10.5 in) cabinet only
  - Depth with grille and terminals: 302mm (11.9 in)
  - Net weight: 9.66kg (21.3 lb)
  - Available finishes: Gloss Black, Satin White, Mocha
