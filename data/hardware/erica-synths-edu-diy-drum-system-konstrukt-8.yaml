description: DIY drum machine that teaches circuit design.
details: |-
  KONSTRUKT-8 is an expressive live performance instrument and sound design tool, as well as a hands-on deep dive into electronic circuit design. Each of its eight DIY modules comes with a detailed build guide and can be explored on a breadboard first, letting the builder trace every circuit design decision before assembling the final instrument.

  Four fully analog drum voices make up the sound. The kick drum uses a resonant bridged-T network for deep, punchy kicks. The snare drum layers a burst of filtered transistor noise over a tuned resonator for a crisp snap. The hi-hat mixes, filters and overdrives six dissonant square-wave oscillators into metallic percussion. The FM drum sets two interacting oscillators against each other for kicks, toms, bells and cymbal-like sounds.

  A four-channel drum sequencer takes tapped-in rhythms and loops them automatically, with shift registers storing the pattern as a circular sequence of binary data. Two syncable triangle LFOs handle voice modulation.

  All voices feed a four-channel mixer with per-channel FX sends and a master insert, so the whole beat can be shaped with external effects or with the built-in variable diode distortion and compressor. Two effects modules complete the system: an analog bucket-brigade delay with flanger and delay modes, and a diode-based compressor with sidechain capability. Headphone and line outputs carry the result.

  Both versions ship with the eight kits (Kick Drum, Snare Drum, Hi-Hat, FM Drum, Drum Sequencer, Output Mixer 2, BBD and Compressor) plus 8 downloadable build guides. The system version adds a Eurorack enclosure with an integrated power supply and 15 braided patch cables. Soldering difficulty ranges from beginner to intermediate, the build guides assume a basic understanding of voltage, current, resistance and capacitance, and completing the full learning path typically takes 6 to 8 weekends.
specs: |-
  - Four fully analog drum voices: kick, snare, hi-hat, FM drum
  - Shift register-based performance sequencer
  - Two syncable triangle LFOs for voice modulation
  - Four-channel mixer with per-channel FX send/return
  - Variable diode distortion and master insert point
  - Analog BBD with flanger and delay modes
  - Diode-based compressor with sidechain capability
  - Headphone and line outputs
  - Enclosure dimensions: 26.5 cm x 27.5 cm x 6 cm
  - Eight DIY module kits with 8 downloadable build guides
  - System version adds a Eurorack enclosure with integrated power supply and 15 braided patch cables (5x 20cm, 5x 30cm, 5x 60cm)
