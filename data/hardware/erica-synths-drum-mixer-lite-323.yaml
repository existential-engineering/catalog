description: Erica Synths Drum Mixer Lite is compact version of Drum Mixer. It
  features extended headroom and a dedicated drum compressor of unique design
  keeps each drum sound clearly distinguishable and add power to the final mix.
  Bonus feature - effects send output allows to apply external effects to the
  signals on the first three inputs. LEDs next to each input give visual
  feedback on the signal level.
details: |-
  Drum Mixer Lite is the compact version of the Erica Synths Drum Mixer, fitting six inputs into 10HP rather than seven into 14HP.

  Like the larger module it carries extended headroom and a vactrol based drum compressor of Erica Synths' own design, with Amount and Decay controls, intended to keep each drum sound clearly distinguishable while adding power to the final mix.

  Three inputs are assignable either to the main output or to the aux send output, so external effects can be applied to those signals. Main and Aux Send outputs are separate jacks on the panel.

  LEDs next to each input report signal level. Mixer gain runs to plus and minus 6dB, the module is 35 mm deep, and it draws 59mA from the positive rail and 36mA from the negative rail.
specs: |-
  - 6 inputs
  - Built in vactrol based drum compressor with Amount and Decay control
  - Three inputs assignable to main or aux send outputs
  - Main and Aux Send outputs
  - Signal level indicator LEDs
  - Mixer gain -+6dB
  - Module width 10HP
  - Module depth 35 mm
  - Power consumption 59mA@+12V, 36mA@-12V
