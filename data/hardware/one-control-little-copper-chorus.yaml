details: |-
  Features
  The LITTLE COPPER CHORUS is the most compact and versatile chorus pedal you'll ever own. It was designed using a sine wave oscillator to recreate standard and rotary speaker-like sounds such as a Fender Vibratone. Specifications Input impedance: 500K Output impedance: 2K Drive voltage: 8-12V Power consumption: 60mA S/N ratio:-96dBm Size: 39Wx100Dx31H mm (excl. protruding parts) 47Wx100Dx48H mm (incl. protruding parts) Weight: Approx. 160 grams True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply Bjorn's Description The LITTLE COPPER CHORUS was designed differently than your typical chorus. I wanted to give the chorus sound a modern feel instead of resurrecting an effect that has otherwise been overused for decades. Back in the 1980s, you had to have a chorus or else you'd be sacked from the band. In the 80s, I listened to SRV and Lonnie Mack on my way to rehearsal and secretly practiced using chorus ahead of distortion in my pedal chain to recreate an organ sound. Typical choruses run triangular wave oscillators while the LITTLE COPPER CHORUS utilizes a sine wave oscillator. Coincidentally, sine waves are produced by an electrical motors such as those in a Fender Vibratone cabinet. 3 Controls WIDTH: Width or depth of the modulations COLOUR: Mild mid-boost to ensure a clean chorus sound. A chorus effect has the slight tendency of becoming scooped, hence, this knob allows you to conl this tendency. SPEED: From standard to rotary speaker-like speed adjustment. - Bjorn Juhl

