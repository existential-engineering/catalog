name: A77H
manufacturer: adam-audio
primaryCategory: studio-monitor
categories:
  - monitor
url: https://www.adam-audio.com/en/a-series/a77h/
description: A successor to the A77X, the A77H is a true 3-way monitor that
  capitalizes on the latest technologies to deliver a rich and enveloping sound.
details: |-
  The A77H is a true three-way midfield monitor that capitalizes on the latest ADAM Audio technologies to deliver a rich, spacious, and enveloping sound.

  Incorporating two 7-inch woofers, a midrange driver, and ADAM Audio's X-ART tweeter, the A77H delivers an ultra-wide frequency range. The addition of the midrange driver helps produce clear sound in the most sensitive range of human hearing.

  Rotatable HPS waveguide technology and onboard DSP allow you to tune the sound for your precise requirements. The monitor supports automated room correction via Sonarworks integration and can be controlled remotely via the A Control software using OCA over standard IP networks.

  Hybrid amplification combines PWM (250 W peak for the woofer) with Class A/B amplification for the midrange (70 W peak) and tweeter (20 W peak), delivering a total peak amp power of 340 W with a 500 W max power rating.
specs: |-
  - Frequency Response @ -3 dB: 37 Hz – 41 kHz
  - Frequency Response @ -6 dB: 34 Hz – 45 kHz
  - Crossover Frequencies: 400 Hz, 3.0 kHz
  - Max. Peak SPL per speaker at 1 m (sine bursts): 106 dB SPL
  - Max. Peak SPL per speaker at 1 m (IEC-weighted noise): 118 dB SPL
  - Total Peak Amp Power: 340 W
  - Woofer Amp: PWM, 250 W peak, 200 W RMS
  - Midrange Amp: Class A/B, 70 W peak, 55 W RMS
  - Tweeter Amp: Class A/B, 20 W peak, 15 W RMS
  - Power Rating: 500 W max
  - Drivers: 2 x 7" Multi-Layer Mineral woofers, 3.5" DCH midrange, X-ART tweeter with rotatable HPS waveguide
  - Dimensions (H x W x D): 236 mm x 531 mm x 350 mm (9.25" x 20.875" x 13.75")
  - Weight: 17.1 kg (37 lb 11 oz)
  - Cabinet Design: Dual front ported
  - Cabinet Material: Vinyl wrapped MDF, painted MDF front panel
  - AC Input Voltage: 100 – 240 V, 50/60 Hz
  - Power Consumption: 220 W (max), 15 W (idle), 3.5 W (sleep)
  - Operating Conditions: -10° C to +40° C; <75% RH, non-condensing
  - AD Converter: 24-bit
  - Internal Sample Rate: 96 kHz
  - Delay Range: 0 – 10 ms, 0.1 ms resolution
  - Input Impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA)
  - Max Input Level: +19 dBu
  - Network Protocol: OCA over standard IP
  - Mounting: 4 x M8 threaded inserts on bottom of cabinet
