description: A successor to the A77X, the A77H is a true 3-way monitor that capitalizes on the latest technologies to deliver a rich and enveloping sound.
details: |-
  The A77H is a true three-way midfield monitor that capitalizes on the latest ADAM Audio technologies to deliver a rich, spacious, and enveloping sound.

  Incorporating two 7-inch woofers, a midrange driver, and ADAM Audio's X-ART tweeter, the A77H delivers an ultra-wide frequency range. The addition of the midrange driver helps produce clear sound in the most sensitive range of human hearing. Rotatable HPS waveguide technology and onboard DSP allow you to tune the sound for your precise requirements.

  The DSP-based functionality of all A Series monitors can be controlled remotely and in real time over ethernet using A Control. ADAM Audio also partners with Sonarworks on an automated room correction solution that runs directly on the DSP of A Series monitors, with calibration profiles importable from SoundID Reference.

  On the back panel you will find two Voicings (Pure and UNR) plus four bands of room adaptation equalization: Bass, Desk, Presence and Treble. Made from a new glass fiber polymer compound, the HPS waveguide enables the X-ART tweeter to disperse sound in space with controlled consistency.

  The A Series combines the best of both digital and analog worlds with hybrid amplification, and the dual front ported cabinet builds on the heritage of ADAM Audio and the AX Series in particular. A 5 year warranty is standard across the loudspeaker portfolio (2 years warranty plus 3 years optional with product registration).
specs: |-
  - 3-way active midfield studio monitor
  - Drivers: 2 x 7" Multi-Layer Mineral (MLM) woofers, 3.5" Dome Cone Hybrid (DCH) midrange, German handmade precision X-ART tweeter
  - Rotatable HPS waveguide, 120° horizontal x 70° vertical dispersion
  - Total peak amplifier power: 340 W (woofer 250 W peak PWM, midrange 70 W peak Class A/B, tweeter 20 W peak Class A/B)
  - Frequency response: 37 Hz – 41 kHz @ -3 dB, 34 Hz – 45 kHz @ -6 dB
  - Crossover frequencies: 400 Hz and 3.0 kHz
  - Max peak SPL per speaker at 1 m: 106 dB SPL (sine bursts), 118 dB SPL (IEC-weighted noise)
  - Dolby DARDT max SPL in full space: 118 dB SPL (120 dB SPL bass managed)
  - Signal processing: 24-bit AD converter, 96 kHz internal sample rate, 0 – 10 ms delay in 0.1 ms steps
  - Backplate controls: Level (-12 dB to +12 dB), input selection (balanced/unbalanced), Voicings (Pure, UNR), Room Adaptation (Bass, Desk, Presence, Treble)
  - Network control via RJ45 Ethernet using OCA over standard IP, A Control software for Windows and macOS
  - Advanced room adaptation: 6 x PEQ, Level, Delay, with import from Sonarworks SoundID Reference
  - Input impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA), max input level +19 dBu
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m at 0 dB level setting
  - Independent peak and thermo limiters for each driver, plus amplifier thermo limiters
  - Dual front ported cabinet, vinyl wrapped MDF with painted MDF front panel
  - Front panel multi-color LED status display
  - Mounting: 4 x M8 threaded inserts on the bottom of the cabinet
  - AC input voltage: 100 – 240 V, 50/60 Hz, power rating 500 W max
  - Power consumption: 220 W max, 15 W idle, 3.5 W sleep
  - Dimensions (H x W x D): 236 mm x 531 mm x 350 mm (9 1/4" x 20 7/8" x 13 3/4")
  - Weight: 17.1 kg (37 lb 11 oz)
  - 5 year warranty (2 years plus 3 years optional with product registration)
