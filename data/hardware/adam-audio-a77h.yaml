description: A successor to the A77X, the A77H is a true 3-way monitor that capitalizes on the latest technologies to deliver a rich and enveloping sound.
details: |-
  The A77H is a true three-way midfield monitor that capitalizes on the latest ADAM Audio technologies to deliver a rich, spacious, and enveloping sound. Incorporating two 7-inch woofers, a midrange driver, and ADAM Audio's X-ART tweeter, the A77H delivers an ultra-wide frequency range.

  The addition of the midrange driver helps produce clean sound in the critical part of the frequency range where humans are especially sensitive to coloration of sound. Rotatable HPS waveguide technology and onboard DSP allow you to tune the sound for your precise requirements. Made from a new glass fiber polymer compound, the HPS waveguide enables the X-ART tweeter to disperse sound in space with controlled consistency.

  The A Series combines the best of both digital and analog worlds through hybrid amplification: the A77H uses a PWM amplifier for the woofers and Class A/B amplifiers for the midrange driver and tweeter, with independent peak and thermo limiters for each driver. The latest materials and advanced analysis and design processes have led to the development of the new long-throw Multi-Layer Mineral woofers.

  The DSP-based functionality of all A Series monitors can be controlled remotely and in real time over Ethernet using the A Control software, available for Windows and macOS. On the back panel you will find two voicings, "Pure" and "UNR", plus four bands of room adaptation equalization: Bass, Desk, Presence and Treble. ADAM Audio also partners with Sonarworks on an automated room correction solution that runs directly on the DSP of A Series monitors.

  The cabinet builds on the heritage of ADAM Audio and the AX Series in particular, using a dual front ported bass reflex system in vinyl wrapped MDF with a painted MDF front panel. A front-facing multi-color LED indicates status changes, and a mounting interface at the bottom of the cabinet allows for flexible speaker positioning.
specs: |-
  - Three-way active midfield studio monitor
  - 2 x 7" Multi-Layer Mineral (MLM) woofers, 1.5" (38 mm) voice coil
  - 3.5" Dome Cone Hybrid (DCH) midrange driver, 1.3" (33 mm) voice coil, MLM cone
  - Handmade X-ART tweeter with rotatable HPS waveguide, 4 inch² (2420 mm²) diaphragm area
  - Tweeter equivalent diaphragm diameter: 2" (56 mm), velocity transform ratio 4 to 1, diaphragm weight 0.17 g
  - Waveguide dispersion: 120° horizontal, 70° vertical
  - Frequency response @ -3 dB: 37 Hz – 41 kHz
  - Frequency response @ -6 dB: 34 Hz – 45 kHz
  - Crossover frequencies: 400 Hz, 3.0 kHz
  - Max. peak SPL per speaker at 1 m (sine bursts): 106 dB SPL
  - Max. peak SPL per speaker at 1 m (IEC-weighted noise): 118 dB SPL
  - Dolby DARDT max SPL in full space: 118 dB SPL (120 dB SPL bass managed)
  - Woofer amplifier: PWM, 250 W peak / 200 W RMS
  - Midrange amplifier: Class A/B, 70 W peak / 55 W RMS
  - Tweeter amplifier: Class A/B, 20 W peak / 15 W RMS
  - AD converter: 24-bit, internal sample rate 96 kHz
  - Delay range and resolution: 0 – 10 ms, 0.1 ms
  - Protection: independent peak and thermo limiters for each driver, plus amplifier thermo limiters
  - Analog inputs: XLR (balanced) and RCA (unbalanced)
  - Input impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA)
  - Max. input level: +19 dBu
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m @ 0 dB level setting
  - Backplate controls: Level (-12 dB to +12 dB), input selection (balanced/unbalanced), voicings (Pure, UNR)
  - Room adaptation EQ: Bass (+2/0/-2/-4 dB), Desk (0/-2/-4 dB), Presence (+1/0/-1 dB), Treble (+1.5/0/-1.5 dB)
  - Advanced room adaptation via A Control: 6 x PEQ, level, delay
  - Networked control over Ethernet (RJ45) using OCA with standard IP data
  - A Control software available for Windows and macOS
  - Third-party calibration: import from Sonarworks SoundID Reference
  - Dual front ported bass reflex cabinet
  - Cabinet material: vinyl wrapped MDF with painted MDF front panel
  - Front panel multi-color status LED
  - Mounting: threaded inserts on the bottom of the cabinet (4 x M8)
  - Power consumption (max, idle, sleep): 220 W, 15 W, 3.5 W
  - AC input voltage: 100 – 240 V, 50/60 Hz; power rating 500 W max.
  - Operating conditions: -10° C to +40° C (+14° F to +104° F), <75 % RH non-condensing
  - Dimensions (H x W x D): 236 mm x 531 mm x 350 mm (9 1/4" x 20 7/8" x 13 3/4")
  - Weight: 17.1 kg (37 lb 11 oz)
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
  - Delivery contents: A77H loudspeaker, power cable, Quick Start Guide
