description: Get the most musical sound possible from this Sound Master tuned
  integrated amplifier. Its custom designed technology delivers exquisite detail
  and unforgettable musicality from any style of music.
details: |-
  MODEL 30 is a Sound Master tuned integrated amplifier rated at 100W + 100W into 8 ohms and 200W + 200W into 4 ohms. Featuring a fully discrete, two stage design for minimal interference, and Marantz HDAM technology for signal purity, it is built around a switching amplifier stage with a toroidal transformer in a case.

  Marantz HDAM-SA3 technology is comprised of dozens of independent parts, each hand-selected for pure, detailed Marantz sound. The Marantz Sound Master meticulously tuned MODEL 30 with careful parts selection.

  The preamplifier stage includes a phono input for both moving magnet and moving coil cartridges, with a quoted input sensitivity of 2.3 mV / 39 kohm for MM and 250 for MC, and signal to noise ratios of 88dB (MM) and 75dB (MC). Bass, treble and balance controls are provided, along with a Source Direct mode.

  The chassis is triple-layered SECC with an aluminium front centre panel, aluminium side covers and a steel top cover, with dimmable edge lighting, aluminium volume, input selector and power controls, and copper-plated side screws. The unit measures 443 x 130 x 432 mm and weighs 14.8kg.
specs: |-
  - Rated output power: 100W + 100W (8 ohm)
  - 200W + 200W (4 ohm)
  - Amplifier circuit: switching amp (Hypex NC500/SMPS600 by single)
  - Power transformer: toroidal with case
  - Wide range: 5Hz - 50kHz
  - Total harmonic distortion: 0.005% (1kHz, 8 ohm)
  - Damping factor: 500
  - Phono input sensitivity: MM 2.3 mV / 39 kohm
  - MC 250
  - Input sensitivity CD/Line/Recorder: 220 mV / 13 kohm
  - Input sensitivity power amplifier input: 1.1 V / 13 kohm
  - SN ratio: Phono MM 88dB, Phono MC 75dB, CD 107dB
  - Phono input (MM/MC), external pre input (power amp direct), pre out
  - Audio in/out terminals: 6 / 1 (Phono, CD, Tuner, Line 1, Line 2, Recorder)
  - Phono and CD are high grade terminals
  - No balanced XLR, optical, coaxial, USB, HDMI or network connectivity
  - Speaker terminal: Marantz Original SPKT-100+, one set, 4~16 ohm
  - Remote control bus terminal (cinch)
  - Bass / treble / balance controls, electric volume, Source Direct
  - Display: porthole OLED with dimmer
  - app control via network player
  - Power consumption: 130W
  - 0.2W standby
  - Dimensions: 443 x 130 x 432 mm (W x H x D)
  - net weight 14.8kg
  - Chassis: SECC, triple layer
  - aluminium front centre panel, side cover and top cover steel
