id: lPy_imeTfPvPD6fu9uj_C
name: Model 30
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/amplifiers/model-30/300003.html
description: Premium integrated stereo amplifier tuned by the Marantz Sound
  Master. Custom designed technology delivers exquisite detail and musicality
  from any style of music, using Class D amplification (Hypex NC500/SMPS600) and
  Marantz's proprietary HDAM (Hybrid Discrete Amplification Module) circuitry.
details: |-
  Premium integrated stereo amplifier tuned by the Marantz Sound Master.

  2.2 channel configuration with 100 watts per channel into 8 ohms and 200 watts per channel into 4 ohms.

  Class D amplification using Hypex NC500 modules with SMPS600 switching power supply.

  Custom HDAM (Hybrid Discrete Amplification Module) circuitry for the preamplifier stage.

  Toroidal power transformer with case for low noise operation.

  Electric volume control, bass, treble, and balance controls, plus Source Direct mode for pure signal path.

  OLED porthole display with edge lighting and dimmer.

  Artisanal design available in Black and Silver-Gold finishes.

  3-Year Warranty.
specs: |-
  - Output Power: 100W + 100W (8 ohms); 200W + 200W (4 ohms)
  - Frequency Response: 5Hz - 50kHz
  - Total Harmonic Distortion: 0.005% (1kHz, 8 ohms)
  - Damping Factor: 500
  - Signal-to-Noise Ratio: Phono MM 88dB; Phono MC 75dB; CD 107dB
  - Power Consumption: 130W (Standby: 0.2W)
  - Dimensions: 443W x 130H x 432D mm
  - Weight: 14.8 kg
  - Channels: 2.2
  - Amplifier Type: Class D (Hypex NC500/SMPS600)
