url: https://bastl-instruments.com/eurorack/modules/dup-dup
description: Dual voltage-controlled footswitch module with two independent
  channels. Each channel routes Signal In to FX Send and selects Signal Out
  between FX Return and Signal In based on switch state — enabling signal
  processor bypass, signal switching, or gate generation. Gate input inverts
  current switch state per channel. Supports both momentary and latch switch
  modes per channel. Footswitch inputs include LED indication for passive
  footswitches.
details: |-
  5HP, 35mm depth. +12V <30mA, -12V <5mA. 10-pin power connector with PTC fuse and diode protection. Footswitch jacks accept standard stompbox footswitches.
