description: "Looking for the best small condenser microphone? We're proud to
  introduce the Edge Note, a 13-in-1 modeling mic that's big on sound but low in
  price."
details: |-
  The Edge Note is a small-diaphragm condenser modeling microphone designed for capturing a wide range of musical instruments at high volumes. With 13 classic mic emulations on board, it is positioned as a flexible studio tool for instrumentalists, recording engineers and studio owners.

  Engineered with a maximum SPL of 146 dB, the Edge Note is built to deliver clear recordings of loud sources, from drum solos to trumpet trills, without clipping the converter.

  An onboard high-pass filter offers two steps at 75 Hz and 115 Hz to reduce lower frequencies for a cleaner, tighter low-end recording.

  A pad attenuator lets the user reduce the input signal by -10 dB or -20 dB so that loud sources retain detail and realism without clipping or distortion.

  The Edge Note is targeted at accurately recording loud or transient-heavy sources such as snares and hi-hats, brass instruments, gentle guitars and sweeping strings, and is compatible with any standard microphone preamp.
specs: |-
  - Type: small-diaphragm condenser modeling microphone
  - Included emulations: 13 (Aalborg 4006, Berlin 184, Berlin K53, Berlin K54, Berlin K86, Freiburg 6, Hamburg 40, Hamburg 211, Hamburg 441, Illinois 7B, Illinois 57, Perth 55, Vienna D112)
  - Frequency response: 20 Hz - 20 kHz
  - Sensitivity: -42 dB | 8 mV/Pa (+/- 3 dB)
  - Maximum SPL: 146 dB
  - High-pass filter: two steps at 75 Hz and 115 Hz
  - Pad attenuator: -10 dB / -20 dB
  - Output: XLR (compatible with any standard microphone preamp)
