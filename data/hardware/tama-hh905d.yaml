  - drums
url: https://www.tama.com/usa/products/detail/hh905d.html
description: The perfect counterpart to Iron Cobra 900 Series bass drum pedals,
  the Iron Cobra 900 Series hi-hat stands offer incredibly sensitive,
  lightning-fast action, maximum adjustability and completely noise-free
  operation. The latest innovation on these stands, the new "Quick-Set Clutch",
  allows hi-hat cymbals to be quickly attached and removed.
details: |-
  Quick-Set Hi-Hat Clutch (US.PAT.NO.9812101): With just one touch, the Quick-Set Clutch can be attached or removed - simply push the button on the side of the clutch. The clutch also allows the top hi-hat cymbal to float more freely, maximizing the natural resonance of the cymbals.

  Non-Loosening Tension Rod: Specially shaped plastic and metal nuts fit together perfectly to keep the cymbal rod from loosening while playing.

  Lever Glide: The idea of replacing the traditional pull mehanism with a lever design was a genuinely revolutionary concept. Our Iron Cobra version uses roller bearings at the lever fulcrum for even smoother footboard action while a super-strong Kevlar® strap connects the footboard and pull rod for even, noise-free action. (Kevlar® is a registered trademark of the Dupont Corporation)

  Hinge Guard Block: We've changed the construction of the Bearing Hinge on the footplate from a one-piece assembly to two pieces, which holds the bearing more evenly minimizing stress, and maximizing smoothness, while adding to the pedal's sense of power.

  Swivel Foot: Since the foot pedal can be rotated around the dual leg base, the Swivel Foot feature greatly expands floor space and set-up flexibility.

  Tilt System: Not only do Tilt equipped stands offer more flexible set-ups, they also offer more expressive hi-hat work because you can tilt the hi-hat cymbal. Iron Cobra hi-hat stands can be tilted quickly and easily by loosening just one T-Bolt.
