details: |-
  FALISTRI is a fully analog multipurpose movement manager designed to generate and edit voltages to easily accomplish any patch. The module divides into two big parts: the upper two thirds of the panel hold two specular function generators, while the lower third is composed of a dual cascaded frequency divider, a linear slew limiter and a four-quadrant multiplier.

  The two generators are identical, with the same controls and the same set of outputs, and a Time Scale switch swaps each one from LFO to oscillator range with close tracking. The shape morphs freely from logarithmic to linear to exponential without changing the time needed to complete the rise or the fall, so an envelope keeps its duration as its curve changes and an oscillator keeps its frequency as its waveform changes. Rise and fall can take different shapes, for a logarithmic rise with a logarithmic fall, a linear attack with a logarithmic fall, or any other combination of the three modes.

  Envelopes can be fired by an external trig or gate or by the built-in trig buttons, which can also override incoming gates and hold an envelope high. Each function works in three voltage-selectable play modes: Loop, where the envelope retrigs itself and becomes an LFO or an oscillator, Transient, an attack-release envelope with no sustain and no gate information, and Sustained, an attack-hold-release envelope whose duration depends on the gate length. A gate input switches automatically from Transient or Sustained to Loop.

  The two sections can be connected for complex envelopes or waveforms. In Quadrature mode the end of the yellow rise triggers the start of the green rise, the end of the green rise triggers the start of the yellow fall, and the end of the yellow fall triggers the start of the green fall, which at audio rate gives a kind of trapezoid oscillator. Each generator has five outputs, unipolar 0V to +10V, bipolar -5V to +5V, attenuverted -10V to 0 to +10V, an End of Rise gate and an End of Fall gate, and an additional Max output works as an analog OR that puts out the highest voltage currently generated by the two envelopes.

  The lower third adds three utilities. Two semi-normalled cascaded frequency dividers, or flip-flops, turn a gate patched to the first input into gate streams at half and a quarter of its frequency, generate sub octaves from audio-rate signals, and can be used independently by patching two separate signals. The four-quadrant multiplier works as a bipolar DC-coupled linear VCA for amplitude modulation, ring modulation and voltage processing or scaling, and is semi-normalled by default to the green bipolar output and the yellow unipolar output, so FALISTRI can act as a stand-alone synth voice. The linear slew limiter smooths any voltage transition for a classic portamento or glide, with independent rise and fall controls, and can serve as a rudimentary third AR envelope.
specs: |-
  - Two identical analog function generators, usable as envelopes, LFOs or oscillators, with a Time Scale switch to swap from LFO to oscillator range
  - Shape morphs freely from logarithmic to linear to exponential without changing the rise or fall time, so an envelope keeps its duration and an oscillator its frequency
  - Exclusive shape per stage, so rise and fall can take any combination of the three modes
  - Trig buttons fire the envelopes by hand and can override incoming gates to hold an envelope high
  - Three voltage-selectable play modes: Loop, where the envelope retrigs itself and becomes an LFO or an oscillator, Transient, an attack-release envelope with no sustain and no gate information, and Sustained, an attack-hold-release envelope whose duration depends on the gate length
  - A gate input switches automatically from Transient or Sustained to Loop
  - Quadrature mode chains the generators: the end of the yellow rise starts the green rise, the end of the green rise starts the yellow fall, and the end of the yellow fall starts the green fall
  - Five outputs per generator: unipolar 0V to +10V, bipolar -5V to +5V, attenuverted -10V to 0 to +10V, End of Rise gate and End of Fall gate
  - Max output acts as an analog OR, putting out the highest voltage currently generated by the two envelopes
  - Two semi-normalled cascaded frequency dividers (flip-flops) giving gate streams at half and a quarter frequency, or sub octaves from audio-rate signals, and usable independently
  - Four-quadrant multiplier working as a bipolar DC-coupled linear VCA for AM, RM and voltage processing or scaling, semi-normalled to the green bipolar and yellow unipolar outputs so the module can be a stand-alone synth voice
  - Linear slew limiter with independent rise and fall controls, for portamento and glide or as a rudimentary third AR envelope
  - Weight 0.365 kg, dimensions as listed by the maker: 15.6 x 11.7 x 6 cm
  - Eurorack module, bus-powered from the case's power header, with no power jack of its own
