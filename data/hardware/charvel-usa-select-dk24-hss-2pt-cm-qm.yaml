details: |-
  Built at the Charvel Custom Shop in Corona, California, the USA Select DK24 HSS 2PT CM QM is a Dinky-shaped electric guitar featuring an alder body topped with a figured quilt maple cap finished in gloss with a masked-off natural binding. A scalloped lower back bout and shredder's cut heel provide comfortable upper fretboard access, while a beveled output jack adds a refined modern touch.

  The bolt-on caramelized flame maple Speed Neck is graphite-reinforced and finished in hand-rubbed urethane with rolled fingerboard edges for fast, friction-free play. A heel-mount truss rod adjustment wheel allows neck-relief tweaks without removing the neck. The caramelized flame maple fingerboard carries a 12"-16" compound radius, 24 stainless steel jumbo frets, 4mm pearloid dot inlays and Luminlay side dots for stage visibility. A Graph Tech TUSQ XL nut sits 1.6875" wide at the headstock end of the 25.5" scale.

  Electronics are a versatile HSS layout: a Seymour Duncan Full Shred TB-10 humbucker at the bridge plus Seymour Duncan Custom Flat Strat SSL-6 single-coils in the middle and neck (RWRP at the neck), all finished in flat black. A 5-position blade switch, no-load tone control and 500K EVH Bourns low-friction volume potentiometer deliver beefed-up mids and articulated, crispy highs across a wide tonal range.

  Hardware includes a Gotoh Custom 510 tremolo bridge with brass block, titanium saddles and Gotoh arm, Sperzel die-cast locking tuners and chrome appointments. The guitar ships with .009-.042 nickel-plated steel strings in a Charvel hardshell case (p/n 009-0228-000); an optional gig bag (p/n 299-1414-006) is sold separately.
