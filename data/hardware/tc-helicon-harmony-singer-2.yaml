url: https://www.tchelicon.com/en/products/0726-aab
description: Vocal stompbox that reads the chords played on a connected acoustic
  guitar and generates two voices of harmony in key with the playing. Reverb,
  adaptive tone and pitch correction are applied to the lead vocal, and the
  guitar signal passes through to an amplifier.
details: |-
  The Harmony Singer 2 listens to the chords played on a connected acoustic guitar and generates two harmony voices tuned to what is being played. No MIDI connection, key selection or scale setting is required.

  Reverb, adaptive tone and pitch correction are applied to the lead vocal at the same time as the harmony voices, so one pedal handles both the backing parts and the polish on the lead. A dedicated guitar input passes the instrument signal on to an amplifier unaffected.

  The enclosure is compact and runs from a standard 9V supply, so it fits a pedalboard and shares a power brick with the rest of a rig. With a microphone and a guitar connected, the pedal produces a three-voice vocal part.
specs: |-
  - Two voices of guitar-controlled harmony, keyed to the chords played
  - Reverb, adaptive tone and pitch correction on the lead vocal
  - Guitar input with thru to an amplifier
  - Battery powered
  - 9V DC power input
