description: A passive manual crossfader for CV and audio signals that closes
  fully at either end without bleed, usable also as a panner by swapping input
  and output, in a hybrid 1U/0hp format.
details: |-
  Smooth transitions, emphasis on smooth

  Once upon a time, a company going by the name of this company made a passive crossfader. This is not that, no, this is something new and far better: a passive crossfader that closes fully on either end, without bleed and with only high quality components. No surprises here, just a crossfader to help you do cool transitions, from audio mixing to gradually changing the shape of an oscillator or altering a modulation pattern. You'll love it, there's no doubt in my mind. Besides, if you get sick of crossfading, just switch input for output and you've got a panner! No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Accepts both CV and audio signals
  - Crossfade between signals, with either signal closing fully at either end
  - Tired of crossfading? Swap input and output and pan instead!
  - Passive design: no external power, no batteries
