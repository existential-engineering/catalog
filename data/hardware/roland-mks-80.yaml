description: >-
  The MKS-80 Super Jupiter is a refined rack-mount version of the Jupiter-8, condensing
  8-voice polyphony with 16 analog oscillators into a 2-space rack module. Its classic
  Roland analog filters and extensive modulation capabilities make it ideal for lush pads,
  drones, leads, and ambient textures. The optional MPG-80 programmer provides hands-on
  control for its comprehensive but otherwise tedious front-panel editing.
details: |-
  The MKS-80 represents Roland's evolution of their legendary Jupiter synthesizer line, translating the desktop Jupiter-8 into a professional rackmount format introduced in 1984. As a module-only unit, it prioritizes sound design over performance features, offering all the classic sounds of the Jupiter synths and beyond.

  Its warm, fat analog character derives from dual oscillators per voice and sophisticated modulation routing. The lowpass filter with dedicated ADSR envelope and highpass filter provide flexible tonal shaping, while the standard ADSR VCA envelope controls dynamics.

  The editing interface, while comprehensive, can be tedious without external controllers. Roland designed the optional MPG-80 programmer to address this limitation, providing dedicated slider-based parameter control for all synthesis parameters. Memory stores 64 single and 64 combination patches.

  The MKS-80 gained recognition among electronic music pioneers and commercial artists alike. Notable users include Hardfloor, Astral Projection, Vince Clarke, Vangelis, Pet Shop Boys, and Snap. The instrument excels at creating lush textures, atmospheric soundscapes, blips, buzzes, and cutting leads.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 16 analog oscillators (2 per voice)
  - Filter: Lowpass filter with ADSR envelope, highpass filter
  - VCA: Standard ADSR envelope
  - Effects: None
  - Arpeggiator/Sequencer: None
  - Keyboard: None (2-space rack module)
  - Memory: 64 single, 64 combination patches
  - Control: MIDI
releaseDate: "1984"
