details: |-
  Our all-new G6129T-89VS Vintage Select '89 Sparkle Jet with Bigsby pays homage to a classic late-'80s design that rocked the forefront of the Pacific Northwest grunge movement that overtook the music world in the early 1990s.

  Delivering signature solid-body power and punch, the G6129T-89VS features period-correct chambered mahogany construction, which magnifies harmonic richness by letting air resonate between the top and body for livelier and more articulate tone.
