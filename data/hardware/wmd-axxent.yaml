description: Axxent is an accent expander for Metron, adding 16 gate outputs in
  4HP to bring dynamics to trigger sequences. Each output ties directly to its
  matching Metron track for accent programming.
details: |-
  Axxent is the accent expander for Metron, adding 16 gate outputs in 4HP — and giving your performance the thing flat trigger sequences never have: dynamics. Accents are what make a rhythm feel played instead of programmed. The loud hit that anchors the downbeat, the ghost note that gives a groove its swing — before Axxent, getting them out of Metron meant burning a second trigger track for every voice you wanted to accent. Axxent gives those tracks back. Each of its 16 outputs is tied directly to its matching Metron track, so accent programming lands exactly where you'd expect it, in the interface you already know. On stage, that means dynamics you can play in real time: send accent gates to a second envelope for harder transients on the downbeats, push a slew or VCA for emphasis, or drive the accent input on your drum modules — all sequenced alongside your patterns, no extra programming surface, nothing new to learn mid-set. Axxent connects over Metron's expansion bus and is easy to program the moment it's racked. One Axxent can be used per Metron. Metron needs a firmware update to support Axxent — get it on the Metron page .
