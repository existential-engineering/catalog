description: 15" 1600W Professional Passive Loudspeaker. Built For Years of
  Incredible Sound.
details: |-
  Mackie's 30+ years of live sound expertise informs the DRM215-P 15-inch passive speakers, engineered for industry-leading sound quality. The design incorporates custom high-excursion woofers and titanium compression drivers to maximize clarity while minimizing distortion.

  Rugged construction uses sturdy 18mm plywood cabinets built to withstand dynamic live performances across diverse venues including tours, clubs, theaters, and houses of worship. The angled cabinet design also makes the DRM215-P floor monitor capable, and 8x M10 flypoints allow flexible installation rigging.

  Parallel SpeakON inputs simplify daisy-chaining, while the precision internal crossover and dual-angle pole-mount round out a robust passive PA box ready for tours, install, and rental applications.
specs: |-
  - Custom designed transducers
  - 1.4" Titanium diaphragm compression driver
  - 15" High-excursion woofer
  - Precision internal crossover
  - Parallel SpeakON inputs
  - 15mm plywood construction with internal bracing
  - Textured cabinet coating
  - Powder-coated heavy gauge steel grille
  - Angled cabinet design (floor monitor capable)
  - Dual angle pole-mount
  - Flyable with 8xM10 flypoints
  - Power handling: 400W / 800W / 1600W
  - Weight: 51.9 lb / 23.5 kg
  - Frequency Response: 45Hz - 20 kHz
  - Max SPL: 129 dB
