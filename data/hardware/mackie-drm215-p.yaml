description: 15" 1600W Professional Passive Loudspeaker. Built For Years of
  Incredible Sound.
details: |-
  Bring Mackie's 30+ years of live sound experience to every gig with the DRM215-P 15-inch passive speakers, engineered with custom high-excursion woofers and titanium compression drivers for clarity and minimal distortion. These rugged speakers use a sturdy plywood cabinet for tour, club, theatre and house of worship use.

  DRM Series Professional Passive Loudspeakers deliver high-performance sound with the rugged construction and reliability that professional production and install customers demand.

  Custom transducers housed in coated touring-grade plywood cabinets are designed for consistent performance in the most demanding applications.

  Equipped with M10 flypoints, dual angle pole mounts, and available line array configurations, the DRM Series suits clubs, houses of worship and rental systems.
specs: |-
  - 15 in professional passive loudspeaker
  - Power handling 400W continuous / 800W program / 1600W peak (800 watts RMS, 1600 watts peak)
  - Max SPL 129 dB peak
  - Frequency range 45 Hz - 20 kHz (-10 dB), 70 Hz - 18 kHz (-3 dB)
  - Coverage 90 degrees horizontal x 60 degrees vertical
  - Crossover frequency 1.5 kHz
  - 15 in / 381 mm ferrite woofer
  - 1.4 in / 36 mm titanium dome compression driver
  - Nominal impedance 8 Ohm
  - 1x female speakON input, 1x female speakON thru (parallel)
  - 15 mm plywood enclosure with black polyurea finish, powder-coated 16-18 gauge steel grille
  - Angled cabinet allows use as a floor monitor, 50 degree monitor angle
  - Dual angle pole-mount socket, 8x M10 flypoints for vertical orientation
  - Dimensions 28.3 x 17.0 x 18.1 in / 719 x 431 x 461 mm (H x W x D)
  - Weight 51.9 lb / 23.5 kg
