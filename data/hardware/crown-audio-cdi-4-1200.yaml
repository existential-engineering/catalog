name: CDi 4|1200
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-4-1200
description: A 4-channel professional power amplifier delivering 1200W per
  output channel with analog inputs. Part of Crown's CDi DriveCore series,
  engineered for large-scale installations including cinemas, houses of worship,
  hotels, and cruise lines.
details:
  - Built on technology from Crown's flagship DriveCore Install series, the CDi
    4|1200 is engineered for large-scale installations including cinemas, houses
    of worship, hotels, and cruise lines. It features network control and
    monitoring, high-level DSP, a front-panel interface, and the ability to
    drive up to 100Vrms speaker loads without requiring a transformer.
  - The CDi DriveCore Series is an evolution in amplification, providing an
    impressive mix of high-performance, rich feature set, and competitive cost.
    The amplifier offers streamlined functionality and ease-of-use across a
    variety of applications, with pre-loaded JBL speaker tunings to streamline
    installations.
  - DriveCore Technology eliminates hundreds of components within each
    amplifier, reducing variability and increasing reliability. The 4|1200
    supports 70V and 100V constant-voltage distribution without external
    transformers.
specs: |-
  - 4 channels
  - 1200W per channel @ 4Ω
  - Dual mode: 850W @ 2Ω, 1200W @ 4Ω, 1200W @ 8Ω, 600W @ 16Ω, 1200W @ 70Vrms, 1200W @ 100Vrms
  - Bridge mono: 1200W @ 4Ω, 2400W @ 8Ω, 2400W @ 16Ω, 2400W @ 140Vrms, 2400W @ 200Vrms
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.25dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - Onboard DSP
  - Network control via HiQnet Audio Architect
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - Dimensions: 19" W × 3.5" H × 14.71" D (excluding 1.3" front panel protrusion)
  - Weight: 20.1 lbs (9.12 kg)
  - Power: 20A IEC connector, 100–240V AC
  - BLU link: No
