name: CV Trinity
manufacturer: bastl-instruments
primaryCategory: modulation
categories:
  - sequencer
  - discontinued
capabilities:
  - sequencing
url: https://bastl-instruments.com/eurorack/modules/cv-trinity
description: "Six-channel modulation module. Each channel supports three modes:
  Automation (32-step sequencer), LFO (with waveshaping, audio-rate capable), or
  ADSR envelope generator. Variable step counts, independent clocking, LFO sync,
  ADSR with linear/exponential modes and looping. Compatible with CV Trinity
  Expander for reset/re-trigger inputs. Requires +5V bus."
details: |-
  14HP, 35mm depth. +12V <5mA, -12V <5mA, +5V <35mA. 16-pin connector. Requires +5V bus board. CV inputs 0-5V or 0-10V selectable via jumpers.
