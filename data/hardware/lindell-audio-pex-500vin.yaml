details: |-
  The PEX-500VIN Vintage Edition is an all discrete equalizer modeled after Pultec's legendary passive EQ design, for API 500 Series compatible racks.

  Built around a classic Pultec parametric EQ design, the PEX-500VIN gives you the open mids, creamy highs, and punchy lows that only a true passive equalizer can deliver.

  Like the classic EQs it was modeled after, the PEX-500VIN features all discrete circuitry, including transformer-coupled balanced inputs and outputs.

  A series of 3-step switches provide control over the low- and high-frequency EQ bands plus the cutoff frequency for the high-frequency attenuator, and true-bypass circuitry keeps the signal pure when the equalizer is bypassed.
specs: |-
  - 500 Series equalizer modeled after Pultec's passive EQ design
  - Compatible with all standard API 500 Series compliant racks
  - All discrete design based upon the Vintage OPA1731 amplifier
  - Transformer coupled balanced inputs and balanced outputs
  - 3-step switched low frequency boost 30Hz, 60Hz, 100Hz +/-10%
  - 3-step switched high frequency boost 6kHz, 10kHz, 16kHz +/-10%
  - 3-step switched high frequency attenuation 10kHz, 15kHz, 20kHz +/-10%
  - True bypass hardware preserves sound quality when bypassed
