description: >-
  A budget-oriented 61-key performance keyboard from Roland featuring PCM
  sample-based synthesis with 24-voice polyphony, 16-part multitimbrality, and
  four real-time editing sliders.
details: |-
  Roland released the JX-1 in the early 1990s as a performance-oriented budget keyboard. While it carries the JX name associated with Roland's earlier analog polysynths, it is a PCM sample-based instrument with basic editing parameters rather than a full synthesizer. Its 61 velocity-sensitive keys, 24-voice polyphony, and 16-part multitimbrality give it reasonable capability for its price bracket.

  The interface prioritizes immediate access over deep programming. Thirty-two tone buttons provide direct selection of 64 ROM preset tones arranged in two groups, and four sliders offer real-time control over filter, effects, and amplitude parameters. Two tones can be layered together, though this reduces polyphony to six notes. Notable omissions include aftertouch, an arpeggiator, an LCD screen, keyboard split functionality, and any way to balance layered tones.

  The filter section features a 24dB 4-pole design with both highpass and lowpass modes, paired with two LFOs and two envelopes for modulation. At 3.5 feet long and just 12.9 pounds, the JX-1 is highly portable. It provides 32 RAM patches alongside the 64 ROM presets, plus built-in reverb and MIDI In/Out/Thru connections for integration into larger setups.
specs: |-
  - Polyphony: 24 voices
  - Multitimbral: 16 parts
  - Oscillators: 2 (ROM-based)
  - Filter: 24dB 4-pole (highpass and lowpass)
  - LFO: 2 (saw up, saw down, square, triangle)
  - Envelopes: 2 (Attack, Decay, Decay 2, Sustain, Release)
  - Effects: Reverb
  - Keyboard: 61 keys with velocity sensitivity
  - Memory: 32 RAM patches, 64 ROM patches
  - Control: MIDI In/Out/Thru
releaseDate: "1991"
