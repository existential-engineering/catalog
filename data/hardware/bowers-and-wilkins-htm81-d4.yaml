details: |-
  The HTM81 D4 is the largest center-channel loudspeaker in the 800 Series Diamond range, sized and voiced to partner the 801 D4 and 802 D4 floor-standers. It is a 3-way vented-box passive design driven from an external amplifier, with a recommended amplifier power of 50W to 500W into 8 ohms and no mains connection of its own.

  Bowers & Wilkins describes the center channel as arguably the most important speaker in a home theater, and gives the HTM81 D4 the range's full technology set: the Solid Body Tweeter-on-Top housing, a decoupled Continuum cone midrange drive unit and twin 200mm (8in) Aerofoil bass cones.

  The Aerofoil bass cone combines a carbon-fiber skin with a variable-profile foam core to pair low mass with high stiffness, and adds a foam Anti-Resonance Plug for lower distortion and cleaner bass. The 25mm Diamond dome tweeter is presented as the company's best dome material 15 years after its introduction, combining low mass, high stiffness and accuracy.

  The two Aerofoil bass cones are mounted in twin solid aluminum bass pods, each clamped into an aluminum plate fixed to the stiffest part of the curved cabinet. Formed as single pieces of metal, those structures give the bass drivers a rigid mechanical location. Matrix bracing and Flowport loading complete the enclosure.

  The cabinet measures 334mm (13.1in) high, 847mm (33.3in) wide and 371mm (14.6in) deep, and weighs 32.20kg (71lb). Cabinet finishes are Gloss Black and White, with Black or Grey grilles. A stand is not included; the manual recommends the FS-HTM D4 adjustable center speaker stand, which allows 4 or 8 degrees of tilt.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond tweeter, Solid body Tweeter-on-Top, Continuum cone FST, Matrix, Anti-Resonance plug, Biomimetic Suspension, Aerofoil cone bass units, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 200mm (8in) Aerofoil cone bass units
  - Frequency range: 20Hz to 35kHz
  - Frequency response: 28Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 80Hz to 20kHz, less than 0.3% 100Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 500W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Speaker terminals: two pairs at the back of the speaker for bi-wiring, link wires supplied for single-wire connection
  - Terminal cable acceptance: 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm (5/32in) diameter
  - Dimensions: Height 334mm (13.1in), Width 847mm (33.3in), Depth 371mm (14.6in)
  - Net weight: 32.20kg (71lb)
  - Cabinet finishes: Gloss Black, White
  - Grille finishes: Black, Grey
  - In the carton: 1 midrange grille, 2 bass grilles, 2 terminal link wires, 4 self-adhesive plastic pads, 2 two-part foam plugs, 1 cleaning cloth
