description: Flagship center-channel loudspeaker in Bowers & Wilkins' 800 Series
  Diamond, designed to partner the 801 D4 and 802 D4 in reference-grade home
  theater installations. A 3-way vented-box design combining a Diamond dome
  tweeter, Continuum cone FST midrange, and twin Aerofoil bass units.
details: |-
  The HTM81 D4 is the largest center-channel loudspeaker in Bowers & Wilkins' 800 Series Diamond range, engineered specifically to partner the floor-standing 801 D4 and 802 D4 for cinematic dialogue and front-soundstage continuity. It carries the same driver complement and cabinet engineering language as its stablemates, scaled into a horizontal cabinet optimized for placement above or below a display.

  A 25mm Diamond dome tweeter sits in a Solid Body Tweeter-on-Top housing, mechanically decoupled from the main cabinet so the high-frequency driver can extend cleanly to 35kHz without picking up cabinet vibrations. A 150mm Continuum cone FST handles the midrange with Biomimetic Suspension, while two 200mm Aerofoil cone bass drivers with Anti-Resonance Plugs are loaded by a Flowport-tuned, Matrix-braced enclosure.

  Electrically the HTM81 D4 presents a nominal 8Ω load (minimum 3.0Ω) with 90dB sensitivity, and is rated for 50-500W amplifiers on unclipped programme. Frequency response is quoted as 28Hz to 28kHz (±3dB on reference axis) with usable extension from 20Hz to 35kHz, giving it both the scale and midrange extension to match the larger floor-standers in the range.

  The cabinet is offered in Gloss Black and White finishes with a choice of Black or Grey grille. A dedicated stand is available separately; the speaker itself ships without a stand.
specs: |-
  - Type: 3-way vented-box center-channel loudspeaker
  - Tweeter: 1x 25mm (1 in) Diamond dome, Solid Body Tweeter-on-Top
  - Midrange: 1x 150mm (6 in) Continuum cone FST with Biomimetic Suspension
  - Bass: 2x 200mm (8 in) Aerofoil cone with Anti-Resonance Plugs
  - Frequency range: 20Hz - 35kHz
  - Frequency response: 28Hz - 28kHz (±3dB from reference axis)
  - Sensitivity: 90dB (on-axis at 2.83Vrms at 1m)
  - Harmonic distortion: <1% (80Hz-20kHz), <0.3% (100Hz-20kHz)
  - Nominal impedance: 8Ω (minimum 3.0Ω)
  - Recommended amplifier power: 50W - 500W into 8Ω on unclipped programme
  - Maximum recommended cable impedance: 0.1Ω
  - Cabinet bracing: Matrix internal bracing
  - Bass loading: Flowport
  - Finishes: Gloss Black, White
  - Grille options: Black or Grey
  - Height: 334mm (13.1 in)
  - Width: 847mm (33.3 in)
  - Depth: 371mm (14.6 in)
  - Net weight: 32.20kg (71 lb)
