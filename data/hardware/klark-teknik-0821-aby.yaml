description: The RT60 is a dedicated reverberation-time analyser engineered for
  acousticians, system designers and installation engineers who need accurate
  measurements of room decay characteristics across the audio spectrum. RT60,
  the time taken for a signal to decay by 60 decibels, is the foundational
  metric of architectural acoustics.
details: |-
  The RT60 is engineered around the single discipline of accurate reverberation-time measurement rather than being a general analyser with RT60 as one feature. Frequency-band resolution, decay-rate calculation and signal handling are all optimised for the demands of room-acoustics work.

  Built to Klark Teknik's Kidderminster engineering standards, the RT60 holds its calibration in the conditions measurement work imposes. Concert halls, lecture theatres, sports arenas and houses of worship are not bench environments, and the RT60 was built to deliver bench accuracy in the field.

  The RT60 reflects four decades of Klark Teknik measurement expertise, beginning with the DN60 in 1980 and continuing through the professional analysers that followed.
specs: |-
  - Dedicated reverberation-time (RT60) analyser
  - Frequency-band resolution and decay-rate calculation optimised for room acoustics
  - Field-portable measurement instrument
