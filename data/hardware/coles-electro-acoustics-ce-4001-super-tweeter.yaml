description: The CE-4001 Super Tweeter is a compact high-frequency drive unit
  from Coles Electroacoustics covering 1.2kHz to 35kHz, intended for use in
  multi-driver speaker systems requiring extended high-frequency reproduction.
  Available in 7 ohm and 16 ohm impedance variants.
details: |-
  The CE-4001 Super Tweeter is a compact drive unit produced by Coles Electroacoustics,
  a British manufacturer with a long history in professional audio transducer design.
  This tweeter is built for use in multi-way speaker systems where extended high-frequency
  coverage is required.

  The unit operates across a frequency range of 1.2kHz to 35kHz, with a usable response
  of 8kHz to 35kHz and a tighter ±2dB window of 5kHz to 25kHz. Its free air resonance
  sits at 1.6kHz, making it suitable for crossover points well above that figure.

  The CE-4001 is available in two impedance variants: a 7 ohm version (/K) and a 16 ohm
  version (/G). The 7 ohm variant offers a sensitivity of 87dB at 5kHz per 1W at 1m,
  while the 16 ohm variant measures 85dB at 15kHz. Power handling is rated at 120W
  continuous/programme for both versions.

  Physically, the unit is very compact at 76mm overall diameter with a 19mm piston and
  coil diameter, weighing just 250g. It features a polyester cone, a self-supporting
  coil former, and a black powder coat finish. Non-standard impedance options are
  available from Coles upon request.
specs: |-
  - Frequency Range: 1.2kHz–35kHz
  - Usable Response: 8kHz–35kHz; 5kHz–25kHz (±2dB)
  - Free Air Resonance: 1.6kHz
  - Impedance: 7 ohm (/K) or 16 ohm (/G)
  - DC Resistance: 6 ohm (/K) or 23 ohm (/G)
  - Power Handling: 120W continuous/programme
  - Flux Density: 10,000 Gauss
  - Sensitivity: 87dB (/K @ 5kHz) or 85dB (/G @ 15kHz) per 1W/1m
  - Cone Material: Polyester
  - Coil Former: Self-supporting
  - Finish: Black powder coat
  - Overall Diameter: 76mm
  - Body Diameter: 61mm
  - Depth: 20mm
  - Weight: 250g
  - Piston Diameter: 19mm
  - Coil Diameter: 19mm
  - Mounting Hole: 61mm
  - Mounting: Front flush mount on baffle
