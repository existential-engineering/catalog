description: Quality VCA with bargraph.
details: |-
  Smooth fading between linear and logarithmic response lets the Black VCA V2 create versatile percussion sounds, and an LED bargraph gives visual feedback on the output level.

  Manual bias control sits beside two CV inputs, so the amplifier can be driven from more than one modulation source at a time.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  CV level spans -10V to +10V, giving -80dB of attenuation at 0V and unity gain at +10V. The module occupies 10HP at a depth of 25mm.
specs: |-
  - Manual bias control
  - Manual fading between linear and logarithmic response
  - Two CV inputs
  - Output level indicator bargraph
  - CV level -10V to +10V
  - Attenuation -80dB at CV = 0V, 0dB at CV = +10V
  - Power consumption +45mA, -32mA
  - Module width 10HP
  - Module depth 25mm
