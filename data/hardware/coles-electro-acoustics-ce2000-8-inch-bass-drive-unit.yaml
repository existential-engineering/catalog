name: CE2000 8-inch Bass Drive Unit
manufacturer: coles-electro-acoustics
primaryCategory: speaker
url: https://coleselectroacoustics.com/ce2000-8-inch-bass/
description: The CE2000 is an 8-inch bass drive unit from Coles Electroacoustics
  featuring a polypropylene cone with rubber surround, suitable for infinite
  baffle or reflex enclosure configurations in professional speaker building
  applications.
details: |-
  The CE2000 is an 8-inch bass drive unit manufactured by Coles Electroacoustics, a
  British company with a long heritage in professional audio transducer design. This
  driver is suited to professional speaker building and studio monitor construction.

  The cone is constructed from polypropylene with a rubber surround, providing a balance
  of low coloration and long-term durability. The coil former uses aluminium/paper
  construction, and the unit features a 26mm coil diameter operating within a 10,000
  Gauss flux density magnetic circuit.

  The CE2000 covers a frequency range of 20Hz to 8kHz, with a useable response of
  50Hz to 5kHz (+/-3dB), making it well-suited as a bass or bass-midrange driver in
  two- or three-way speaker systems. Free air resonance is specified at 28Hz.

  Power handling is rated at 50W RMS continuous with a 100W program rating. Sensitivity
  is 89dB at 1W/1m. The driver is offered in an 8 ohm nominal impedance, with a double
  coil version available for applications requiring alternative impedance or wiring.

  Recommended enclosure alignments are infinite baffle (20-25 litres) or reflex
  (25-40 litres). Overall diameter is 245mm maximum, with a mounting hole of 190mm
  and a depth of 90mm.
specs: |-
  - Frequency Range: 20Hz–8kHz
  - Useable Response: 50Hz–5kHz (+/-3dB)
  - Free Air Resonance: 28Hz
  - Nominal Impedance: 8 ohm
  - DC Resistance: 7 ohm
  - Max Continuous Power: 50W RMS
  - Program Rating: 100W
  - Sensitivity: 89dB (1W @ 1m)
  - Flux Density: 10,000 Gauss
  - Piston Diameter: 160mm
  - Coil Diameter: 26mm
  - Coil Former: Aluminium/Paper
  - Cone Material: Polypropylene with rubber surround
  - Mounting Hole: 190mm
  - Max Diameter: 245mm
  - Depth: 90mm
  - Weight: 1.56kg
  - Recommended Enclosure: Infinite baffle 20–25L, Reflex 25–40L
  - Double coil version available
