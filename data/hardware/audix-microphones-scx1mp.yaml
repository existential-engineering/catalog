details: |-
  The SCX1MP is a factory-matched pair of SCX1 professional studio cardioid condenser microphones, designed for stereo recording and a wide variety of recording, broadcast, and live sound applications.
  With a smooth uniform frequency response from 40 Hz – 20 kHz, the SCX1 is very consistent when responding to on and off-axis signals, and exhibits excellent phase coherence and minimal proximity effect. The SCX1 is characterized by a wide cardioid polar pattern; this, coupled with the high output and sensitivity of the microphone, makes it an ideal choice for miking overhead, drums, instruments, room ambiance, orchestral sections, stringed instruments, piano, vibes, and sound effects.

  Other features include a 21 mm gold vapor capsule, miniaturized electronics, and an extremely small footprint. The SCX1 will handle sound pressure levels of 130 dB and will provide up to 20 dB of ambient noise rejection. It has a precision machined brass body, interchangeable capsules, black multi-layer class 'A' liquid finish, and a gold-plated XLR connector.

  Designed, machined, assembled, and tested by AUDIX in the USA.
