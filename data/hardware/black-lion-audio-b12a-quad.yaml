description: 4-channel American-style mic/DI preamp with Cinemag transformers
details: The B12A Quad fits four B12A preamps into a single 1U rackmount
  chassis, delivering 70dB of clean gain via Cinemag transformers on both input
  and output stages. American-style design prioritizes transparency and quick
  transient response — ideal for drums, percussion, and staccato vocals. When
  driven, it adds subtle upper-midrange color and bite. Channels 1 and 2 include
  front-panel Hi-Z DI inputs for guitars, basses, and synths. Parallel XLR and
  TRS outputs on all four channels. Per-channel metering displays output level.
  Each channel has +48V phantom power, phase inversion, 18dB pad, and output
  level control. External power supply keeps noise out of the signal path.
specs: |-
  - Preamp Type: Solid State
  - Number of Channels: 4
  - Transformers: Cinemag (input and output)
  - Phantom Power: Yes (+48V, per channel)
  - Pad: -18dB (per channel)
  - Polarity Switch: Yes (per channel)
  - Gain: Up to 70dB
  - Analog Inputs: 4 x XLR (rear), 2 x 1/4" Hi-Z DI (front, channels 1-2)
  - Analog Outputs: 4 x XLR + 4 x TRS 1/4" (parallel, rear)
  - Form factor: 1U rackmount
  - Power Source: 5-pin AC adapter (included)
