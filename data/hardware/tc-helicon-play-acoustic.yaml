description: Three-button floor processor that handles a vocal and an acoustic
  guitar in one chassis. The vocal side runs harmony, reverb, doubling, echo,
  HardTune and Adaptive Tone with a 30-second looper, and the guitar side runs
  chorus, compression, reverb and BodyRez resonance restoration.
details: |-
  Play Acoustic is a vocal and acoustic-guitar processor aimed at performers working with one guitar and one voice. Two processors share a single chassis, a single power supply and one footprint on a pedalboard.

  The vocal engine produces up to two harmony voices that follow the chords played on the connected guitar, alongside reverb, doubling, echo and HardTune correction. Adaptive Tone keeps the lead vocal consistent without manual EQ, and a dedicated loop function captures up to 30 seconds of vocal and guitar for layering during a performance.

  The guitar engine provides chorus, compression and reverb along with BodyRez, a resonance restoration process aimed at the flattened tone an under-saddle pickup sends to a PA.

  Connections sit on the rear panel: an XLR microphone input with phantom power, a 1/4-inch guitar input, a 1/8-inch aux input, balanced XLR outputs for voice and guitar DI with a ground lift, a 1/8-inch headphone output, a 1/4-inch pedal jack and USB for direct recording. Power comes from an external 12 V supply.
specs: |-
  - Up to two harmony voices keyed from the chords played on the connected guitar
  - Adaptive Tone sweeps EQ, compression, de-essing and gating on the vocal
  - Reverb, doubling, echo and HardTune correction on the vocal channel
  - Chorus, compression, reverb and BodyRez resonance restoration on the guitar channel
  - Loop function captures up to 30 seconds of vocal and guitar
  - Three footswitches
  - XLR microphone input with phantom power
  - Ground lift switch on the XLR outputs
  - 12 V DC, 400 mA power input
