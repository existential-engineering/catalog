description: The MICROPHONE PREAMPLIFIER 502 V2 is the award-winning Midas
  microphone preamp delivered as a 500 Series add-on module for mobile or
  recording systems, particularly designed for use with the LEGEND L10 or L6 500
  Series Rackmount Chassis. The V2 iteration upgrades the original 502 with four
  discrete ultra low-noise input transistors, retaining the legendary Midas
  sound while extending dynamic range. The input stage accepts signal levels up
  to +24 dBu with soft clipping, gain is set via a 12-position rotary switch
  from 0 to +60 dB in 5 dB increments, and a ±20 dB output trim potentiometer
  brings total maximum gain to +80 dB. Twin balanced outputs (main and an
  auxiliary TX output) feed independent destinations, with illuminated
  push-button switches handling low-pass and high-pass filter engagement, phase
  reverse, 48 V phantom power, and TX output routing. Variable low-pass (1
  kHz–40 kHz, -3 dB) and high-pass (10 Hz–400 Hz, -3 dB) filters provide
  on-module shaping, and 11-segment rotary LED meters monitor input and output
  levels.
details: |-
  Front panel controls include a 12-position gain rotary switch (0 to +60 dB in 5 dB steps), a continuously variable ±20 dB output trim potentiometer, low-pass and high-pass filter frequency controls, and illuminated push-button switches for low-pass engage, high-pass engage, phase reverse, 48 V phantom power, and TX output selector. Two 11-segment rotary LED meters monitor input and output levels. As a 500 Series module, audio I/O is provided by the host chassis (e.g. Midas LEGEND L10 or L6, or any standard 500 Series rackmount chassis), so no audio connectors are exposed on the module itself. The auxiliary TX output is a second balanced output that runs alongside the main output for split feeds (e.g. to a recording rig and a live mix).
specs: |-
  - Format: 500 Series module
  - Maximum Input Level: +24 dBu (with soft clipping)
  - Gain Range: 0 to +60 dB in 5 dB increments (12-position rotary switch)
  - Output Trim: ±20 dB (variable potentiometer)
  - Total Maximum Gain: +80 dB
  - Low Pass Filter: 1 kHz to 40 kHz (-3 dB points)
  - High Pass Filter: 10 Hz to 400 Hz (-3 dB points)
  - Outputs: Twin balanced outputs (main + auxiliary TX)
  - Input Stage: Four discrete ultra low-noise input transistors
  - Metering: 11-segment rotary LED meters (input and output)
  - Phantom Power: +48 V, switchable (illuminated push-button)
  - Phase Reverse: Switchable (illuminated push-button)
versions:
