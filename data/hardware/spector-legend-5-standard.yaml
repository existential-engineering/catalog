details: |-
  The Legend Standard Series has been upgraded for 2019. The instantly familiar, curved body design is now crafted from solid, lightweight ash and adorned with a flame maple top. Other key improvements include a 5-piece maple/padauk neck, all-new pickups and electronics, improved hi-mass bridge, and all new gloss finishes! The Legend 5 Standard offers the coveted Spector NS body design at a price that is well within the reach of all bassists. The extremely comfortable curved body is crafted from solid ash and sports a genuine flame maple top, a five-piece maple and padauk neck, a 24 fret amara fingerboard, professional quality chrome hardware, and a hi-mass bridge. Specially designed Spector humbucker pickups are complemented by the two-band active EQ controls that offer 12dB of boost or cut for both treble and bass controls. Adorned with a high gloss finish, the Legend 5 Standard offers the looks, tone, and playability of basses twice its price.
