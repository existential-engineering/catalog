description: Zoom H1n-VP handy recorder features an onboard stereo microphone
  that lets you easily record two tracks of high-resolution audio.
details: |-
  The H1n is loved by musicians, podcasters and filmmakers because of its audio, ease of use and small size. The H1n-VP includes a padded shell case, micro USB cable, AD-17 Power Adapter and foam windscreen, offering creators more value than ever before.

  The H1n is a take-anywhere recorder for a creator's gear bag. Its X/Y microphones capture high-quality stereo sound, supporting up to 24-bit/96 kHz. One-touch button controls make it simple to record songs, audio-for-film, lectures, podcasts and more, and its monochromatic 1.25 inch LCD display is easy to read even in the brightest lighting conditions.

  An advanced onboard limiter offers distortion-free recording up to 120 dB SPL, and a low-cut filter helps eliminate pops and unwanted low frequency rumble. The overdub function allows compositions to be built up in layers, and playback speed adjustment helps transcribe music and interviews without altering pitch. The H1n can be set to auto-record, pre-record and use the self-timer, and a built-in tone generator makes it easy to calibrate the recorder and camera audio levels.

  An 1/8 inch stereo mic/line input records external microphones or other sound sources. Headphones connect via the 1/8 inch headphone output with dedicated volume control, and the built-in speaker allows quick reference listening. The H1n can be connected via USB when recording and streaming on PC, Mac and iOS devices.

  The H1n is battery-powered and offers up to 10 hours of recording time on two AAA batteries, so it can go in a pocket or a backpack or be mounted to a camera.
specs: |-
  - Includes H1n Handy Recorder, windscreen, AD-17 AC adapter, USB cable and padded-shell case
  - Simultaneous recording tracks: 2, simultaneous playback tracks: 2
  - Functions: lo-cut filter, limiter, test tone, slate tone, voice emphasize filter, playback position skipping, playback speed control, A-B repeat, auto REC level, marker, auto-record, pre-record, self-timer, overdubbing
  - Recording formats: WAV 44.1 kHz/16-bit, 48 kHz/16-bit, 48 kHz/24-bit, 96 kHz/24-bit, BWF-compliant, plus a variety of MP3 formats
  - A/D and D/A conversion: 24-bit, 128x oversampling, signal processing 32-bit
  - Recording media: microSD/microSDHC cards, Class 4 or higher, up to 32 GB
  - Display: 1.25 inch monochrome LCD, 96 x 64
  - Built-in stereo mic: unidirectional condenser, 90 degree XY stereo format, gain -infinity dB to +39 dB, maximum sound pressure level 120 dB SPL
  - Input: 1/8 inch stereo phone jack, rated input level -infinity dB to -39 dBm, input impedance 2 kohm, plug-in power supported (2.5 V)
  - Output: 1/8 inch stereo phone jack (combined line/headphones), rated output level 20 mW + 20 mW into 32 ohm load, output impedance 10 kohm or more
  - Built-in speaker: 500 mW mono speaker, output impedance 8 ohm
  - USB: Micro USB port, mass storage class operation USB 2.0 high speed, audio interface operation 44.1/48 kHz sampling rate, 16-bit depth, 2-in/2-out, asynchronous transfer
  - Power requirements: 2 AAA batteries (alkaline, nickel-metal hydride rechargeable or lithium), ZOOM AD-17 AC adapter (DC 5 V/1 A), or USB bus power
  - Battery life: approximately 10 hours continuous recording on alkaline batteries using the built-in mic at 44.1 kHz/16-bit
  - Dimensions: 50 mm (W) x 137.5 mm (D) x 32 mm (H), 1.9 in (W) x 5.4 in (D) x 1.2 in (H)
  - Weight: 60 g / 0.13 lbs without batteries
