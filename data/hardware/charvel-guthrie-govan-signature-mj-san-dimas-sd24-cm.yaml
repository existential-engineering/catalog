description: The Guthrie Govan Signature MJ San Dimas SD24 CM blends Charvel's
  high-performance instrument legacy with the premium feature set chosen by U.K.
  virtuoso Guthrie Govan. Built on a basswood San Dimas body with an ash top and
  finished in satin Three-Tone Sunburst, the guitar features a specially
  contoured heel for unimpeded upper-fret access.
details: |-
  Sculpted shredder's cut heel without neck plate (4-bolt sculpted heel) provides unimpeded upper-fret access. Graphite-reinforced caramelized maple neck with satin finish. Heel-mount truss rod adjustment wheel for fast setup. Five-way blade and two-way mini toggle switching enable a wide palette of humbucking and single-coil voicings. Luminlay side dots and crème dot inlays for low-light visibility. Licensed Fender Stratocaster headstock with pop-in tremolo arm and side-mounted jack.
specs: |-
  - Model Number: 2925414588
  - Body Shape: San Dimas Style 1
  - Body Material: Basswood with ash top
  - Body Finish: Satin (Three-Tone Sunburst)
  - Body Features: Specially contoured heel for upper-fret access
  - Neck Material: Caramelized Maple with graphite reinforcement (bolt-on)
  - Neck Finish: Satin
  - Neck Construction: 4-bolt sculpted heel (no neck plate)
  - Scale Length: 25.5" (648 mm)
  - Fingerboard Material: Caramelized Maple
  - Fingerboard Radius: 12"-16" compound (304.8-406.4 mm)
  - Frets: 24 jumbo stainless-steel
  - Inlays: Crème dot
  - Side Dots: Luminlay
  - Nut Material: Graph Tech TUSQ XL
  - Nut Width: 1.6875" (42.86 mm)
  - Truss Rod: Heel-mount adjustment wheel
  - Bridge Pickup: Custom Charvel humbucking
  - Middle Pickup: Custom Charvel single-coil
  - Neck Pickup: Custom Charvel humbucking
  - Pickup Configuration: HSH
  - Controls: Volume, Tone (Luminlay numbered dome knobs)
  - Pickup Switching: 5-way blade plus 2-way mini toggle (single-coil simulation)
  - Bridge: Recessed Charvel locking tremolo with brass block
  - Tremolo Arm: Pop-in
  - Tuning Machines: Gotoh die-cast locking
  - Hardware Finish: Chrome
  - Headstock: Licensed Fender Stratocaster
  - Output Jack: Side-mounted
  - Strings: Nickel-plated steel (.010-.046)
  - Number of Strings: 6
  - Case: Charvel Multi-Fit hardshell gig bag
