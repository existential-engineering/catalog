details: |-
  THRUST BQ500

  THRUST BQ500 is a 500-Watt revolution in portable bass amplification, packing more bang for the buck into an ultra-lightweight micro bass head (2.3 kg/5.1 lbs) than a warehouse full of discounted fireworks! A custom-designed EQ and MOSFET preamp provides a tremendous tonal palette and realistic tube-like sound and feel.

  Portable Power

  Built for the pragmatic bass player, the 500-Watt BQ500 is designed with the ultimate in portability and power in mind. The cutting-edge Class-D circuit features a high-voltage MOSFET preamp that delivers the authentic feel and dynamic response of a real tube amp. A powerful 4-band EQ lets you sculpt your tone exactly how you like it, while the balanced DI output makes it ultra-easy to connect to the FoH (Front of House) mixing console or your recording equipment.

  Versatility & Tone
