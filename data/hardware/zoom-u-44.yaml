description: The U-44 is a compact, 4-in/4-out audio interface that enables you
  to record and perform wherever you are. Small enough to fit in the palm of
  your hand, the U-44 comes equipped with the features you need to record
  24-bit/96 kHz audio anywhere.
details: |-
  The U-44 is a compact 4-in/4-out audio interface small enough to fit in the palm of a hand, recording and playing back at resolutions up to 24-bit/96 kHz. An asynchronous transfer system keeps it clear of computer jitter. It works with Windows and Mac computers and with iOS devices, and its mic preamps are based on the same design as the H5 and H6 Handy Recorders.

  Power comes from the USB bus when a computer is connected, from two AA batteries for about 4 hours with phantom power off, or from the Zoom AD-17 adapter or any 5 V DC supply. Connecting to an iPhone or iPad needs battery or adapter power plus an Apple iPad Camera Connection Kit or Lightning-to-USB Camera Adapter.

  A 10-pin Zoom connector takes the H-Series interchangeable input capsules, sold separately: the XYH-6 adjustable X/Y, XYH-5 shock-mounted X/Y, MSH-6 mid-side, SGH-6 shotgun, SSH-6 stereo shotgun and EXH-6 dual XLR/TRS combo input capsule, with ECM-3 and ECM-6 extension cables available. The capsule input is assigned to inputs 3 and 4, and the S/PDIF inputs are disabled while a capsule is attached.

  Two XLR/TRS combo inputs have independent gain knobs and multi-color level indicators, +48 V phantom power for both, and a Hi-Z switch on input 1 for passive guitars and basses. Outputs are MAIN OUT L/R on TRS phone jacks, two RCA pairs as LINE OUT 1 and LINE OUT 2, and a standard stereo phone jack for headphones with its own volume control. LINE OUT 1 carries the MAIN OUT signal and LINE OUT 2 carries the PHONES signal. S/PDIF optical and coaxial jacks give digital input and output, with an S/PDIF IN SELECT switch choosing the input and a SYNC indicator for clock lock. The output is always sent from both the optical and coaxial jacks. MIDI IN and OUT on 5-pin DIN jacks synchronise keyboards, controllers and synth or sampler modules.

  Monitoring is handled in hardware. A DIRECT MONITOR knob blends the headphone mix between the input and the computer playback signals for latency-free tracking, a BALANCE knob sets the PHONES and LINE OUT 2 mix between computer playback signals 1-2 and 3-4 so that a click can be balanced against the main output or a cue against the main output while DJing, and MUTE switches silence the A and B output groups. In standalone mode the U-44 works as a mic preamp and AD/DA converter at 44.1 or 48 kHz, or slaved to the sampling rate arriving on the optical or coaxial input, for taking digital gear into analog amps and mixers or digitising records and tapes. A download code for Ableton Live 9 Lite is included.
specs: |-
  - 4-in/4-out USB audio interface for PC, Mac and iOS
  - ANALOG IN, INPUT 1/2: TRS/XLR combo jacks (XLR 2 hot, TRS tip hot)
  - Input gain: 0 to 43 dB
  - Input impedance: 2.6 kohms (MIC IN), 1.1 Mohm with Hi-Z on
  - Maximum input level: +2.7 dBu (MIC IN), +20.7 dBu (TRS IN)
  - Phantom power: +48 V, supplied to both inputs 1 and 2
  - MIC IN: 10-pin Zoom connector, supports XYH-6, MSH-6, SGH-6, EXH-6, SSH-6 and XYH-5 capsules
  - ANALOG OUT, MAIN OUT L/R: TRS phone jacks (unbalanced), maximum output level +10 dBu at 0 dBFS, output impedance 330 ohms
  - ANALOG OUT, LINE OUT 1/2: RCA (coaxial), maximum output level +8 dBu at 0 dBFS, output impedance 1 kohm
  - ANALOG OUT, PHONES: standard stereo phone jack, 30 mW x 2 into a 32 ohm load, maximum output level +10 dBu at 0 dBFS, output impedance 33 ohms
  - DIGITAL IN/OUT, S/PDIF OPTICAL: TOSLINK, supported sampling frequencies 44.1, 48, 88.2 and 96 kHz
  - DIGITAL IN/OUT, S/PDIF COAXIAL: RCA (coaxial), supported sampling frequencies 44.1, 48, 88.2 and 96 kHz
  - Frequency characteristics: at 44.1 kHz plus or minus 1.5 dB (20 Hz to 20 kHz), at 96 kHz plus or minus 2 dB (20 Hz to 40 kHz)
  - Input conversion noise: measured EIN -119.5 dB (IHF-A) at 43 dB with 150 ohm input
  - Audio recording and playback channels: 4 recording, 4 playback
  - Sampling frequencies: 44.1, 48, 88.2 and 96 kHz
  - Bit depth: 24-bit
  - Interface: USB 2.0
  - MIDI IN/OUT: 5-pin DIN jacks
  - Power source: USB bus power (Type B), ZOOM AD-17 (Micro-B), DC 5 V power supply (Micro-B), or 2 AA batteries for about 4 hours continuous operation with phantom power off
  - Accepts standard AA alkaline or NiMH rechargeable batteries
  - Power consumption: 5 W maximum
  - Dimensions: 198.8 mm (D) x 92.3 mm (W) x 42.7 mm (H)
  - Weight (main unit only): 310 g
  - Standalone AD/DA conversion mode at 44.1 or 48 kHz, or slaved to the S/PDIF input rate
  - Zero-latency direct monitoring with a DIRECT MONITOR blend knob
  - BALANCE knob for the PHONES and LINE OUT 2 mix between computer playback signals 1-2 and 3-4
  - MUTE switches for output groups A and B
  - Includes a download code for Ableton Live 9 Lite
  - System requirements, Windows: Windows 10 or 11 (64-bit), Intel Core i3 or faster, USB 3.0 or 2.0
  - System requirements, Mac: Mac OS X 10.9.5 to macOS 26, Intel Core i3 or faster, USB 3.0 or 2.0
  - System requirements, iPhone and iPad: iOS 7.1 to 26, iPadOS 15 to 26, with batteries or AC adapter for power plus an Apple Camera Connection Kit or Lightning-to-USB Camera Adapter
  - Note: 0 dBu = 0.775 Vrms
