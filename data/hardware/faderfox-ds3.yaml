description: Fast access to samples and hotcues, a special controller for
  Traktor Pro. DS3 is the perfect solution if you like to work with samples,
  loops, hotcues and FX in Traktor Pro 2.
details: |-
  DS3 is the perfect solution if you like to work with samples, loops, hotcues and FX in Traktor Pro 2. The device has 12 extra large keys with a perfect tactile feeling to fire samples and for convenient access to 8 hotcues and all the transport functions.

  4 multifunctional encoders give you a quick control to various deck, loop and FX parameters. A display shows all the values on the device so you don't have to look at the screen all the time. You can switch the device to each of the 4 decks by dedicated buttons in a fast way.

  Last but not least there are special loop recorder and browser sections. The browser section carries an encoder plus view and favorite buttons with additional tree navigation, and the loop recorder section has an encoder and two buttons. Dedicated FX assign buttons switch quickly between the 4 FX busses, and the 4 encoders also give detailed control of sample slot parameters.

  The controller is optimised for Native Instruments Traktor Pro 2 and ships with setup files for Traktor Pro and Duo. Its USB interface is class compliant, so no driver is necessary, and the unit is powered over the USB bus with a consumption of less than 500 mW / 100 mA. Track deck and sample deck modes are both supported with easy switching between them, all controls carry a double function when the shift button is held down, and 31 LEDs plus a 2-digit display show various information from feedback data sent by the computer.

  The casing is a very compact black plastic desktop format measuring 180 x 105 x 70 mm and weighing 350 g, with a silver aluminium front plate finished in an abrasion resistant anodised coating and inscriptions. Faders, pots and encoders are high-quality ALPS parts, fitted with new rubber knobs for the best tactile feeling.
specs: |-
  - Special controller for DJ software (optimised for Native Instruments Traktor Pro 2)
  - Setup files for Traktor Pro/Duo shipped with the controller
  - USB interface, class compliant, no driver necessary
  - Controls up to four decks, easy switching between deck A-B-C-D on the fly
  - Supports track deck and sample deck mode with easy switching between the modes
  - 4 multifunctional encoders, access to all FX and important deck and loop parameters
  - Dedicated FX assign buttons for quick switching to the 4 FX busses
  - Detailed control of sample slot parameters by 4 encoders
  - Browser section with encoder, view and favorite buttons (with additional tree navigation)
  - Loop recorder section with encoder and two buttons
  - 12 extra large buttons for sample trigger and hotcue access
  - All controls with double function by holding down the shift button
  - 31 LEDs plus 2-digit display to show various information by feedback data from computer
  - About 750 commands, all free to reassign
  - USB bus powering, consumption less than 500 mW / 100 mA
  - Very compact design in a black, plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - System requirements: PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - System requirements: Native Instruments Traktor Pro/Duo 2 (as of version 2.1.1) or software which allows user assignments of continuous parameters (CC) and note commands
