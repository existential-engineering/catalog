details: |-
  The emphasis with the Soundcraft EPM is very firmly on quality build and audio performance, with an easy to understand control surface uncluttered by unnecessary facilities, and Soundcraft have brought new technologies and ideas to this very cost-effective range. Recommmended for: Houses of Worship Music Venues Musicians & Bands Theatres The emphasis with the Soundcraft EPM is very firmly on quality build and audio performance, with an easy to understand control surface uncluttered by unnecessary facilities, and Soundcraft have brought new technologies and ideas to this very cost-effective range. Surface mount technology is used throughout, using close-tolerance components for high accuracy and repeatable settings for EQ and gain controls. The highly-transparent GB30 Mic amp (designed by Graham Blyth for the company’s 30th anniversary, and also used on the larger LX7ii and GB Series consoles) features high-resolution adjustment over a wide gain range of 55dB, and provides a stunning +22dB headroom through the console. True professional 48-volt phantom power caters for condenser microphones of all types. A unique feature of the signal monitoring is the PEAK led. This uses multipoint signal take-offs to watch for overload in several parts of the channel strip, and the led lights more brightly as the signal approaches the peak point. For smooth and accurate channel control, the EPM has 60mm high quality faders as used on other Soundcraft desks. The monitor output and headphone output work in parallel so that performers can still listen on phones while an engineer is listening on studio monitors.
