details: |-
  The VX 8.2 is a new concept for this type of device, adding new capabilities to the range with its exceptional acoustic clarity, definition and all round acoustical performance. Boasting an exceptional performance-to-size ratio, VX 8.2 provides a compact, yet punchy and sonically articulate solution for medium scale performance sound reinforcement as well as high performance speech reproduction where clarity and vocal character are paramount. The versatile twin driver design and mounting options also make the VX 8.2, due to acoustic matching with the wider range of VX Series models, perfectly capable components within much larger installations.
specs: |-
  - Frequency Response: 80 Hz – 35 kHz ±3 dB / 60 Hz – 45 kHz –10 dB
  - Nominal Dispersion: 90° conical @ –6 dB point
  - Directivity Factor (Q): 8.1
  - Directivity Index (DI): 9.2
  - Power Handling (Passive): 200 W continuous, 800 W peak
  - Sensitivity: 93 dB (1 W @ 1 m)
  - Nominal Impedance (Passive): 8 Ω
  - Crossover Type: Passive with dynamic HF protection
  - Components: 1 x 8" (200 mm) LF driver, 1 x 8" (200 mm) constant directivity Dual Concentric
  - Connectors: 2 x industry-standard 4-pole twist-lock speaker connectors, 1 x barrier strip terminals
  - Wiring (Passive): Pins 1+ / 1– Input, Pins 2+ / 2– Link
  - Dimensions (H x W x D): 591 x 281 x 276 mm (23.3 x 11.1 x 10.9")
  - Net Weight: 14.8 kg (32.6 lbs)
  - Construction: 15 mm (5/8") plywood, vented and internally braced
  - Finish: Semi matt black paint (white optional)
  - Grille: Powder coated perforated steel
  - Flying Hardware: M10 x 4 flying inserts, M10 x 2 yoke bracket inserts, 2 x Integrip carrying handle, blanking plate for optional VTH pole mount
