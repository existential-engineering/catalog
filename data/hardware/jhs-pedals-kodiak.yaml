details: |-
  TREMOLO

  The JHS Pedals Kodiak tremolo is the newest addition to our tap-tempo series featuring all the bells-and-whistles you need to create the biggest tremolo growl you've ever heard! Based around classic Vox and Black Face tremolo sounds, the Kodiak brings vintage tremolo into the modern era with four different wave patterns, Mix, onboard tap-tempo, and sub-divisions to give you total control as well as plenty of inspiration to bring your sound out of hibernation.

  CONTROLS & FEATURES

  The Kodiak has five simple controls: Volume, Speed, Mix, Ratio, and Wave. The Volume control enables you to set the overall volume however you like it, either dialed back, at unity, or boosted. A great feature of the Kodiak is that you can turn the Mix knob all the way down and use the Volume to boost your amp or other pedals, acting as a preamp or slightly driven boost. The Speed knob is a manual control for the speed of the tremolo, which you can also set with the on-board tap-tempo switch. The Mix knob controls how deep the tremolo is perceived, from fully clean to fully wet. The Ratio control gives you the ability to dial in faster speeds that are perfectly sync'd with the BPM of your tap. You can choose from quarter notes, eighth notes, "triplets," or sixteenth notes. The Wave control gives you four different wave variations to choose from: Sine, Rhythmic, Square, and Ramp. The Sine wave is a classic amp-like tremolo sound, the Rhythmic wave gives you an interesting rhythmic pattern that can be used in many different time-signatures for different effect, the Square wave gives you a more choppy trem sound, and the Ramp wave gives you a warbly type of sound.

  TAP / EXPRESSION JACK

  The Kodiak also features a Tap/Expression jack on the right side of the pedal. Plug in an external tap tempo or an expression pedal to control the speed of the tremolo. Select either TAP or EXP via the switch on the left side of the Kodiak.
