details: |-
  The O2 Bass, a massive update to the original Osiris Bass, sees critical improvements to enhance the player's experience.

  By offsetting the body, the top bevel adds comfort and a refreshed look; contours are also utilized in the lower horn and radiused neck heel.

  Due to the massive popularity of the multiscale A2 Bass, the Osiris 2 Bass, a reminiscent design, follows suit and is exclusively available in the configuration.
specs: |-
  - Exclusively available in a multiscale configuration
  - Construction: bolt-on with radiused neck heel
  - Scale length: multiscale, ranging from 33.2" to 35.5" depending on configuration
  - Frets: 24 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with two high-strength carbon-fiber reinforcing rods and fully-adjustable dual action truss rod
  - Body: alder
  - Pickups: 3 stack Tritium radius humbuckers
  - Electronics: 18V active/passive electronics, master volume with push-pull active/passive switch, pickup blend, mid cut or boost with sweep control, stacked concentric bass/treble cut or boost
  - Bridge options: Hipshot A-Style bridge at .748" (19mm) or .64" (16.25mm) spacing, or Hipshot multiscale headless bridge at .748" (19mm) or .64" (16.25mm) spacing
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Dimensions: 39" to 39.9" long, 1.625" to 1.7" thick, 13.375" to 13.75" wide depending on configuration
  - Weight: 8 to 8.95 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts and in headed or headless forms, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
