description: Introduced for Kiesel's 70th anniversary, the K-Series is built
  with standard Master Grade woods, a deep arm bevel and the most upper-fret
  access of any Kiesel. It is the flagship series, and Jeff Kiesel works on each
  instrument from start to finish.
specs: |-
  - Configurations: K6 and K7 model codes appear in the gallery, in fixed (H), tremolo (X) and Original Floyd Rose (C) forms, with a multiscale option
  - Construction: neck-through with sculpted neck heel
  - Body: 3-piece swamp ash with 7A Master Grade flamed maple top, deep-finish body binding
  - Neck: tung-oiled 7-piece with 2-way adjustable truss rod and dual carbon-fiber rods, thinner profile
  - Neck widths: 1.69 in, 1.71 in, 1.90 in, 1.92 in, 2.02 in or 2.12 in at nut depending on configuration
  - Fingerboard: ebony with 14 in or 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale lengths: 25.5 in or 27 in, or 25.5 in to 26.5 in, 25.5 in to 27 in and 26 in to 27.5 in multiscale
  - Headstock: pointed 3 x 3
  - Bridge: Hipshot fixed or Hipshot Solo Saddle, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: pull-up volume with kill switch, 5-way blade-style pickup selector
  - Output jack: available flush mount or rear access
  - Inlays: abalone offset dots, black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Body dimensions: 38.25 in, 39 in or 39.75 in long, 1.65 in thick, 12.5 in wide
  - Weight: 8.25 lbs to 8.7 lbs
  - Strings: Elixir Nanoweb 1046E
  - Every instrument is signed by Jeff Kiesel and stamped with a serial number unique to the K-Series
