specs: |-
  - Dynamic 2D waveform control , providing continuous access to all core wave shapes and extended variations. Controllable via front-panel controls and bipolar CV inputs with built-in attenuverters.
  - Unique alternating cycle-length patterns , creating clean yet harmonically rich distortion by varying individual cycle lengths while keeping the overall period stable.
  - Standard 1 V/oct pitch input , an adjustable fine-tuning section, and a true hard-sync input for precise, musically stable synchronization.
  - Optional MIDI input via a dedicated extension module .
  - Width 9hp (45.5mm)
  - Depth 35mm (including power cable)
  - Universal 10/16 pin Eurorack power connector (16 pin cable included)
  - Standard 3.5mm TS jacks
  - Power 90mA 12V, 10mA -12V
