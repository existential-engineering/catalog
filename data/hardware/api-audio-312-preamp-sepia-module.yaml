id: rYp65mVRgGySp9o3UbB9K
name: 312 Preamp SEPIA Module
manufacturer: api-audio
primaryCategory: preamp
categories:
  - rack-mount
url: https://apiaudio.com/product/312-preamp-sepia-module/
description: API 312 microphone preamplifier circuitry integrated with Karno's
  SEPIA digital control platform, enabling real-time automation and preset
  recall. Exclusive to the SEPIA L6 rackmount system.
details: |-
  Combines the classic 312 analog topology (proprietary API transformer)
  with Karno's SEPIA digital control layer for automated gain recall and preset
  management. Requires the Karno SEPIA L6 rackmount system. Gain selectable from
  +34.5 to +68 dB.
specs: |-
  - Format: SEPIA Module (Karno SEPIA L6 system)
  - Gain range: +34.5 to +68 dB (+14.5 to +48 dB with pad)
  - Max input: -4 dBu (+16 dBu with pad)
  - Max output: +31.5 dBu
  - THD+N: <0.05% @ +4 dBu
  - Input impedance: 1,500 Ω
  - Output impedance: <75 Ω (transformer balanced)
  - Frequency response: ±0.5 dB, 20 Hz–40 kHz
  - Power: ±16V @ 30 mA, +5V @ 20 mA
  - Dimensions: 1.6" × 2.6" × 5" deep
  - Weight: 1.2 lb
