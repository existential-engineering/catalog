details: |-
  “The DGT is a product a lot of miles down the road: a lot of gigs, a lot of records. It’s like picking up a vintage guitar. It sounds like a vintage guitar, and out of the box it’s ready to go. There’s a whole lot of thought gone into this. The DGT is pretty perfect to me.”

  – David Grissom

  The DGT (David Grissom Trem) is the result of more than 20 years of collaboration between Paul Reed Smith and David Grissom. The DGT is based on the McCarty platform with a unique DGT neck shape, taller frets, specially-voiced pickups, and a revised control layout. Grissom and Paul spent a year A/B-ing more than forty sets of pickups before nailing the vintage-voice of DGT humbuckers. When paired with individual volume controls for each pickup and a push/pull master tone control that operates the coil taps, DGT pickups provide versatility and articulation.

  An ultimate expression of a player’s guitar.
