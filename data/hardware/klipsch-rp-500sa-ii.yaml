details: |-
  The RP-500SA II belongs to Klipsch's Reference Premiere II series and is designed for multi-role surround sound use. It can function as an up-firing Dolby Atmos elevation speaker, a dedicated height channel speaker, or a conventional rear surround, making it a flexible choice for immersive home theater systems.

  The driver complement consists of a 5.25" Cerametallic woofer paired with a 1" Linear Travel Suspension (LTS) titanium diaphragm tweeter. The tweeter is housed in a vented enclosure and mated to Klipsch's 90° x 90° silicone composite hybrid Tractrix horn, which controls dispersion and maintains high sensitivity across the listening area.

  A switchable crossover allows the speaker to be configured for Dolby Atmos/Dolby Surround modes as appropriate for the installation. Internal cabinet bracing reduces resonance, and audiophile-grade binding posts are provided for secure cable connections.

  The cabinet features a keyhole mounting system for on-wall placement and magnetic grille attachment. Available in Ebony vinyl and Walnut vinyl finishes with satin-painted baffles.
