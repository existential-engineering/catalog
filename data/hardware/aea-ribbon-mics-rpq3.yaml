description: A two-channel ribbon preamp and EQ with 3rd-generation JFET
  circuitry, 85dB of gain, 68KΩ input impedance, and a unique CurveShaper™ EQ
  with sweepable high- and low-frequency controls for shaping the front end of
  the signal path.
details: |-
  The AEA RPQ3 Ribbon Preamp and EQ provide two channels of high-output, high-impedance, and low-noise gain with a rich and natural sound that brings out the full potential of your microphones. Specifically designed for ribbon microphones, the RPQ3 excels at drawing out the warmth and lush sound that ribbons are uniquely known for.

  The RPQ3 is a powerhouse providing 85dB of JFET output — enough gain to record soft sources without noise. You will never consider a source too quiet to record with a ribbon mic ever again.

  The RPQ3's CurveShaper™ EQ gives you the ability to control your microphone right at the start of the signal path. The adjustable boost/cut low and high-frequency controls tame proximity problems and provide high-frequency extension with slope control. The high-frequency filter boost enables you to add presence and air to your source — perfect for ribbons and 2-busses.

  The RPQ3 boasts an extra high input impedance of 68K Ohms (phantom power off). Preamps with an impedance of under 10k ohms will limit the lows, highs, and transients of your passive microphones. The RPQ3's high impedance reveals a microphone's true nature — thick low-end, open top-end, and articulate transient response.

  The RPQ3 is made in the U.S.A. and shares the same topology and sound as AEA's RPQ500, TRP3 and TRP500 preamps — the differences being extra EQ features and form factor.
specs: |-
  - Two channels with 85dB of JFET gain
  - CurveShaper™ high-frequency EQ with slope control
  - Low-frequency proximity control
  - Input impedance: 68K Ohms (phantom off)
  - Post-Mic and Pre-EQ Inserts per channel
  - Switchable phantom power per channel
  - Polarity invert per channel
  - 3rd generation circuit design
  - Made in the U.S.A.
