description: The BE-OD Deluxe is a dual channel overdrive pedal based on the
  Friedman BE-100 amplifier. Channel 1 matches the original BE-OD while Channel
  2 is voiced with slightly lower gain, each with its own volume, gain, three
  band EQ, presence and three position tight switch.
details: |-
  This BE dual overdrive pedal captures the tone of the now legendary Friedman BE-100 amplifier, which has graced the stages of world class musicians the world over.

  The original Friedman BE-OD single channel pedal took the industry by storm. The BE-OD Deluxe employs the exact same circuit but adds another channel and dual midrange controls. The top row (Channel 1) is identical to the original BE-OD pedal, while Dave Friedman voiced the bottom row (Channel 2) with slightly lower gain. Dual BE channels allow a rhythm sound and a lead sound to be set perfectly.

  The BE-OD Deluxe delivers authentic tube amplifier sound with the controls needed to shape a tone, including a three position tight switch plus volume, gain, bass, middle, treble and presence knobs. These responsive controls go from mild overdrives to straight up gain nirvana.

  Built in the USA and designed to withstand decades of abuse, the BE-OD Deluxe is a must have pedal for any tone enthusiast.
specs: |-
  - Dual channel overdrive based on the legendary BE-100 tube head
  - Channel 1 (top row) is identical to the original BE-OD pedal
  - Channel 2 (bottom row) is voiced with slightly lower gain
  - Per channel controls: Volume, Gain, Bass, Middle, Treble and Presence
  - Three position tight switch per channel
  - True bypass switching
  - Powered by 18 V DC, no battery
  - Includes splitter cable for 18 V operation, connecting to a power supply through 2 x 9 V isolated outputs
  - Assembled in the USA
