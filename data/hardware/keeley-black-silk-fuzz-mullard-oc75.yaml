details: |-
  The Black Silk British Fuzz was announced in April 2015 in a run limited to 20 units, hand sanded, signed by Robert Keeley, clear coated and marked with the Black Silk British Fuzz logo.

  It is a hand-built compact circuit based on the OC75 design. The first two of its three transistors are CV7003 PNP germaniums, which are mil-spec OC44s, followed by a Mullard OC75. It offers MkIII tone-bending sounds with reduced noise, no gating, and a modern power supply arrangement.

  Controls for Fuzz, Tone and Level make wide amounts of fuzz easy to set. Unlike the Keeley Black Glass this design is not gated in any way and sounds very open, and there is no treble push, which makes it more vintage-correct and very responsive to a guitar's volume control. A reverse polarity germanium diode at the final gain stage addresses the temperature problems that affect vintage fuzz units, and a built-in power supply inversion lets it run from a regular 9 volt supply.

  Keeley's stated aim was a MkIII-style circuit around a stock of black glass OC75 transistors that combined compact size, repeatable tone and low noise, since PNP germanium pedals are often expensive, bulky and inconsistent. Techniques from the Time Machine Boost and Holy Fuzz designs were used. The pedal is hand built in the USA in a powder-coated enclosure, with true bypass switching and a two-year limited warranty.
