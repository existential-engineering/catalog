description: The Manx Loaghtan Fuzz (Reissue) is a reissue of a classic Big
  Muff-style fuzz pedal featuring a more powerful Baxandall-type EQ section in
  place of the original's single-knob dual filter. It offers chunky chords,
  woodwind-like sustain, and low-gain overdrive tones. The Sustain control
  includes a treble-retaining subcircuit to preserve high-frequency content at
  lower gain settings.
details: |-
  The Manx Loaghtan is Catalinbread's reissue of their own classic take on the Big Muff circuit. Catalinbread replaced the original Muff's single-knob dual filter with a Baxandall-type EQ featuring separate Highs and Lows shelving controls. Cranking both knobs together creates approximately a -5dB mid scoop, while rolling both back boosts the midrange — giving players fine control over the EQ curve that the standard Muff topology lacks.

  The Sustain control feeds more signal from the first stage into the core distortion engine. A treble-retaining subcircuit ensures that rolling back the Sustain knob does not thin out the top end. Power: 9-18V center-negative DC (9V recommended). Backed by a 3-year warranty.
