details: |-
  The Bicycle Gear Microphones are custom Ear Trumpet Labs models that use a tea-ball capsule basket held in a spring suspension inside a mid-sized reclaimed bike gear. The maker describes them as visually striking, singular and elegant, and the microphone body is built from heavy copper and brass plumbing components.

  The microphone has a classic cardioid pattern, with off-pattern rejection and plenty of output, which makes it easy to use live. Ear Trumpet Labs credits it with the clarity, gain, feedback resistance and full, natural frequency response for live single-mic situations, and describes a pleasing high end with no harshness and a sound that performers, audiences and engineers call astonishingly natural.

  Each unit is one of a kind, so the tonal character varies with the build: depending on the head basket shape, some have the tonal quality of Myrtle (a bit warmer and mellower) and some that of Louise (a bit brighter and crisper). Ear Trumpet Labs suggests the microphone for single-miking a small acoustic ensemble, covering acoustic instruments and multiple vocalists, on stage or in studio.

  The electronics are transformerless FET and fully balanced, hand-wired with film caps, precision resistors and hand-tested, matched transistors, with component values tuned for the individual circuit. An integral silk and foam pop filter controls plosives without loss of clarity.
specs: |-
  - Hand-made microphone with unique appearance
  - Tea-ball head basket capsule assembly spring-mounted in a reclaimed bicycle gear
  - Mic body built from heavy copper and brass plumbing components
  - Integral silk and foam pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - Depending on the head basket shape, some have the tonal quality of Myrtle (a bit warmer and mellower) and some the tonal quality of Louise (a bit brighter and crisper)
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Frequency response: 20 Hz to 17 kHz (-3dB)
  - Sensitivity: -38.8 dB (11 mV/Pa)
