description: UTOPIA MAIN 212 is the ultimate studio monitor. With two brand-new
  5" midranges, a brand-new Beryllium tweeter and patented remote amplification,
  it is the dual-driver configuration of the UTOPIA MAIN 112 and embodies the
  best of the Focal Professional division.
specs: |-
  - 3.5-way main/mastering monitor with remote amplification
  - Subwoofers: 2 × 13" W membrane
  - Woofers: 2 × 5" W membrane with M profile
  - Tweeter: 1.5" Beryllium with M profile
  - Frequency response (±3 dB): 28 Hz – 40 kHz
  - Maximum SPL (peak @ 1 m): 123 dB
  - High frequency amplifier: 140 W RMS Class H Current Mode
  - Mid-range amplifier: 2 × 180 W RMS Class H Current Mode
  - Low frequency amplifier: 2 × 500 W RMS Class D
  - Inputs: XLR symmetrical 10 kΩ
  - High-pass filter: Full range, 30 Hz, 40 Hz, 50 Hz
  - Bass level (>250 Hz): adjustable ±3 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - Local supply: 100–120 V or 220–240 V (50/60 Hz)
  - Dimensions (H × W × D): 79.6 × 105 × 46 cm (31.3 × 41.3 × 18.1 in)
  - Weight: 119.5 kg (263.4 lb)
