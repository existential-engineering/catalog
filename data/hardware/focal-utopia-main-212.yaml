details: |-
  UTOPIA MAIN 212 is the ultimate studio monitor. With two brand new 5" midranges, a brand-new Beryllium tweeter and patented remote amplification, it is the dual-driver configuration of the UTOPIA MAIN 112 and embodies the best of the Focal Professional division. Innovative drivers, top-of-the-range cabinet design, power and exceptional precision ensure an unparalleled monitoring experience for reference recording, mixing and mastering.

  The apex of monitoring: the UTOPIA MAIN range is a technological triumph, inheriting over forty years of Focal know-how and twenty years of innovation in the design of studio monitors. In development since 2017, this product delivers a high level of detail, even at high SPL.

  Patented drivers: Focal's unique 5" midrange drivers with an 'M' profile offer unrivalled dynamic range and transparency. The 1.5" Beryllium tweeter reproduces exceptional transients without causing hearing fatigue. Damping Hook System (DHS) technology has been integrated into this tweeter for the first time, halving THD at 3 kHz.

  Exceptional subwoofers: the long-excursion 13" subwoofers and large cross-section ports provide impressive subwoofer extension, with precision even at high sound levels. The bass is even more powerful thanks to the special design of the MDF cabinet, reinforced by a bracing network that eliminates any cabinet warping.

  Unique external amplification: the patented amplifiers of the UTOPIA MAIN 112 and UTOPIA MAIN 212 use a combination of a class H design with current-mode amplification. Combined with analogue filtering, it achieves the lowest level of harmonic distortion ever measured by Focal in an anechoic chamber.
specs: |-
  - Product type: 3.5-way monitor
  - Subwoofers: 2 x 13" W membrane
  - Woofers: 2 x 5" M-shaped W membrane
  - Tweeter: 1.5" M-shaped Beryllium with Damping Hook System (DHS)
  - Frequency response (+/- 3dB): 28 Hz - 40 kHz
  - Maximum SPL (peak @ 1m): 123 dB
  - High frequency amplifier: 140 W RMS class H current mode
  - Bass amplifier: 2 x 500 W RMS class D; midrange amplifier: 2 x 180 W RMS class H current mode
  - Inputs: XLR symmetrical 10 kOhms
  - High-pass filter: full range, 30 Hz, 40 Hz, 50 Hz
  - Bass level (>250Hz): adjustable +/-3 dB
  - Treble level (< 4.5kHz): adjustable +/-3 dB
  - Indicators and controls: sensitivity, auto standby, LED logo on/off, HPF, LF Shelving, LF EQ, LMF EQ, HF Shelving, subwoofer/midrange/tweeter trims, soffit filter, sealed port filter
  - LEDs: loudspeaker power on and clipping; remote amplifier power on
  - Local supply: ~100-120 V 50/60 Hz; ~220-240 V 50/60 Hz
  - On/Off switch on the remote amplifier
  - Height: 79.6 cm / 31.3 in
  - Width: 105 cm / 41.3 in
  - Depth: 46 cm / 18.1 in
  - Weight: 119.5 kg / 263.4 lb
