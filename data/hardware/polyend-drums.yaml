description: Drums is an analog and digital drum machine built without
  compromise, designed to feel immediate, sound exceptional, and give you more
  ways to create with less to think about.
details: |-
  Drums is an analog and digital drum machine built without compromise. Complete analog voices sit alongside high-quality digital instruments and samples, with complex sequencing, studio-grade effects, and mastering tools all on hand when you want to go further. It is built around a single-piece aluminum body with custom metal knobs and high-end components throughout.

  Four analog voices built on modern SSI chips create a dense, classic tone with modern flexibility. Each stacks dual analog VCOs, a dedicated noise source, and an additional digital oscillator for hybrid layering or precise FM modulation, shaped through a multimode analog filter and VCA. The design uses SSI2130 oscillators, SSI2140 filters (LP / HP / BP), and SSI2164 VCAs.

  The sequencer offers 8 tracks with up to 64 steps each, 48 songs with arrangement mode, all-parameter locks, real-time recording, independent track length and speed, step conditions and chance, micro timing, and random, euclidean and beat generators. 50 instruments (each assignable to any of 8 tracks) with 500+ mutations span analog (classic and FM) and digital (VA, WT, FM, physical modeling, samples) synthesis, plus 8 independent LFOs with 29 waveforms.

  Three effects groups cover 10 sequencable insert FX, 2 send buses with 52 send FX, a master 8-band EQ, and a master compressor with sidechain. Live control includes X0Y fader morphing, instant fill triggering, track metering, mutes, and quick kit and pattern access.

  Audio runs at 32-bit floating point 96kHz internal processing with a 24-bit/96 kHz DAC and ADC, backed by a dual-core CPU and 32 GB of internal storage.
specs: |-
  - Four analog voices (2x SSI2130 oscillators, SSI2140 multimode filter LP/HP/BP, SSI2164 VCA, analog noise generator, additional digital oscillator per voice)
  - 8-track sequencer with up to 64 steps per track
  - 48 songs with song arrangement mode
  - All-parameter locks and real-time step/parameter recording
  - Independent track length, speed and play mode
  - Step repeats, step conditions and chance, micro timing
  - Track random, euclidean and beat generators
  - 50 instruments (assignable to any of 8 tracks) with 500+ mutations
  - Synthesis: analog (classic, FM), digital (VA, WT, FM, physical modeling, samples)
  - 8 independent LFOs with 29 waveforms
  - X0Y fader morphing, instant fill trigger, track metering, mutes
  - 10 sequencable insert FX, 2 send buses, 52 send FX
  - Master 8-band EQ and master compressor with sidechain
  - 32-bit floating point 96kHz internal processing
  - 24-bit/96 kHz DAC output and 24-bit/96 kHz ADC input
  - Dual-core main CPU with auxiliary processors
  - 32 GB internal storage
  - Single-piece aluminum body with custom metal knobs
  - Power supply: 12V/4A
  - Dimensions: 44.6 cm W x 29.2 cm D x 4.3 cm H (with knob)
  - Weight: 3.1 kg (6.84 lb)
