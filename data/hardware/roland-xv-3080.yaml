description: >-
  The Roland XV-3080 is a 128-voice professional synthesizer module that picks up where the
  classic JV-series left off, featuring 64MB of internal wave memory with 1,083 waveforms and
  true stereo waveforms per tone. It includes sounds from the JV-2080, JD-990, and Super JD,
  plus studio-quality effects derived from the SRV-3030, V-Studios, and RSS technology, with
  four SR-JV80 expansion slots for further sonic expansion.
details: |-
  The Roland XV-3080 represents the pinnacle of Roland's JV/XV rack synthesizer line, delivering 128 voices of polyphony for extensive layering and multitimbral applications. With 64MB of internal wave memory containing 1,083 waveforms, it provides a massive sonic palette that encompasses the best sounds from the JV-2080 plus many additional waveforms from the JD-990 and Super JD synthesizers.

  Each patch features true stereo waveforms per tone and expressive Matrix Control with four destinations per source, allowing deep and responsive sound design. The synthesis architecture supports the full range of JV/XV sound design capabilities, from realistic acoustic instrument emulations to complex layered textures.

  Effects processing draws from Roland's professional studio technology, incorporating reverb and effects algorithms derived from the SRV-3030, V-Studios, and RSS spatial processing technology. This gives the XV-3080 studio-quality effects processing that elevates its sounds beyond typical workstation fare.

  Expandability is provided through four SR-JV80-Series wave expansion board slots, allowing users to significantly extend the available sound library. The unit ships with 1,152 patches and 96 performances. A companion keyboard version, the XV-88, pairs the same sound engine with an 88-note hammer-action keyboard with velocity and aftertouch sensitivity. Notable users include Rick Wakeman and Yes.
specs: |-
  - Polyphony: 128 voices
  - Wave Memory: 64MB internal, 1,083 waveforms
  - Waveforms: True stereo per tone
  - Modulation: Matrix Control, 4 destinations per source
  - Effects: Studio-quality reverb and effects (SRV-3030, V-Studios, RSS derived)
  - Memory: 1,152 patches, 96 performances
  - Expansion: 4 SR-JV80-Series slots
  - Format: Rack-mount module
  - Control: MIDI
  - Date Produced: 2000
