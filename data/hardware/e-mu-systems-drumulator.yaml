description: >-
  The E-mu Drumulator is a sample-based drum machine from 1983 featuring eight 12-bit ROM
  drum sounds, real-time and step sequencing, and the gritty lo-fi character that became a
  staple of early electronic music production.
details: |-
  Born in the wake of E-mu's successful Emulator sampler line, the Drumulator was designed to compete with the Linn LM-1 at a more accessible price point. It stores eight drum sounds on ROM chips as gritty 12-bit samples covering the essential kit pieces, and while the fidelity is modest by modern standards, these lo-fi textures have become beloved production tools in their own right.

  The sequencer section offers both real-time recording for capturing live performances and precise step-entry programming for meticulous pattern building. Users can store up to 36 patterns and chain them into 8 complete songs, with the ability to save sequences and sample data to floppy diskettes for archival.

  The Drumulator II variant expanded the concept significantly by adding sampling capability, allowing users to record their own sounds with truncation and looping options. With 12-bit sampling and up to 5 seconds of recording time in its expanded configuration, it bridged the gap between dedicated drum machine and creative sampler, ultimately evolving into the legendary SP-12.

  Integration with vintage computers like the Apple II enabled enhanced visual sequencing workflows. Later models added MIDI connectivity, keeping the Drumulator relevant as studio standards evolved. Notable users include Howard Jones and Hardfloor.
specs: |-
  - Polyphony: 8 voices
  - Drums: 8 ROM samples
  - Sampler: 12-bit sampling, 1.2 seconds expandable to 5 seconds (Drumulator II only)
  - Patterns: 36
  - Songs: 8
  - Keyboard: 4 touch pads
  - Memory: 8 user
  - Control: MIDI (on later models)
