description: A compact modulation workstation with two banks of effects that can
  be combined, covering tremolo, filter, phaser, chorus, vibrato, flanger,
  rotary, double tracking, delay and reverb, with tap tempo on bank one and
  expression control on bank two.
details: |-
  The Super Mod Workstation holds two banks of modulation effects that can be run together, so two effects combine into one sound rather than being selected one at a time. Tap tempo and an expression pedal extend the control over them.

  It collects many of Keeley's own designs. The harmonic tremolo is inspired by vintage brown face amps and first appeared in the Keeley DynaTrem, and many players consider it deeper and thicker than a vibe-type effect. The ADT is the automatic double tracker from the 30ms Double Tracker.

  Any effect in bank one can be paired with one in bank two: the 30ms Double Tracker sound with a flanger, an echo or a plate reverb, a phaser with a delay, or an analog delay under a very wet hall reverb. An expression pedal can push delays into self-oscillating feedback, and tap tempo sets the rate of the harmonic tremolo on bank one while the expression input sets the speed of the rotary cabinet sound on bank two.
