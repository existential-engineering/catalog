description: >-
  A compact desktop sound module from Korg offering nine PCM orchestral patches across seven
  programs, with 16-note polyphony and an 8-part multitimbral mode via MIDI.
details: |-
  The Korg Symphony-03 takes a stripped-back approach to orchestral sound generation. Users simply press a program button to light its number on a basic LED display and begin playing immediately. Despite its simplicity, the module supports layering and detuning patches in multi-mode with up to 8 parts controllable via MIDI, and parts can be independently routed through two assignable output jacks.

  The unit responds to modulation and channel aftertouch for vibrato effects, though it notably lacks pitch-bend functionality. Its standout voice is a choir patch that sounded remarkably authentic for 1988. System Exclusive data allows setup storage on external sequencers for recall.

  Marketed alongside Korg's Concerto digital piano, the Symphony-03 struggled commercially due to its high price point and limited patch count, especially as the far more capable M1 workstation was available at the same time. Four optional ROM cards (Jazz Combo, Orchestral, Piano, and Pop) expanded the sound palette. The module has been used by Vangelis.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 8 parts
  - Oscillators: ROM sample playback (PCM)
  - LFO: Basic modulation with 3 settings
  - Control: MIDI In/Out/Thru
  - Expansion: 4 optional ROM cards
