description: Two names synonymous with Southern California glam-metal majesty
  come together in a sleekly fearsome guitar, built to the specifications of
  legendary Ratt lead guitarist Warren DeMartini and featuring an '80s-style San
  Dimas Style 1 platform with premium components.
details: |-
  The Warren DeMartini USA Signature San Dimas is built around an alder San Dimas Style 1 body finished in satin with a Cross Swords graphic by artist Dan Lawrence.

  A bolt-on quartersawn maple neck with graphite reinforcement features a hand-rubbed satin urethane finish and a Speed Neck profile with rolled fingerboard edges. The maple fingerboard carries a 12" to 16" compound radius, 22 jumbo frets, and black dot inlays. Scale length is 25.5" with a 1.6875" Floyd Rose Original locking nut.

  Electronics consist of a single Seymour Duncan Custom Warren DeMartini Signature RTM humbucking pickup at the bridge with a single volume control.

  Hardware includes a Floyd Rose Original double-locking 2-point tremolo with Floyd Rose Original tremolo arm, Gotoh die-cast tuning machines, and NOS Charvel brass strap buttons in a black hardware finish. Ships with a Charvel hardshell case (p/n 928-0960-170); an optional gig bag (p/n 299-1414-006) is available separately.
