translations:
  ja:
    details: |-
      "TIMBRE"はModel 208 (後期バージョン)のウェーブフォルダー回路を再現したモジュールです。
      ウェーブフォルダーとは波形を折り返すことで入力信号に対して倍音を加算していくような機能で西海岸シンセシスにおける特徴的なサウンドの一つです。また使い方によってはディストーション/サチュレーションのような効果も得ることができます。
      P4Lでは入力にアッテネーター/ブースターを追加し様々なレベルの入力信号に対応させることで適切なフォールド効果を得ることができるようにしました。またSine to Triコンバーターを組み込むことでフォールド効果のバリエーションをプラスしています。

      特徴的な機能
      ・インプットアッテネーター/ブースター搭載
      ・Sine to Tri ウェイブシェイプコンバーター搭載
      ・NOSメタル缶トランジスタを使用

      付属品: 電源ケーブル、交換用スペアパネル(ご注文いただいた色以外のパネルが付属いたします)

      Width: 4HP
      Depth: 28mm
      Power: +12V 20mA / -12V 20mA
