description: TIMBRE is a Eurorack module that recreates the wavefolder circuit
  of the Model 208 (later version), adding harmonics by folding the input
  waveform. It includes an input attenuator/booster and a Sine to Tri waveshape
  converter to expand the range of folding effects.
details: |-
  こちらは受注後に組み立てするBuild to Orderの商品となっております。
  お支払い確認後1週間前後での納品となりますのでご了承ください。

  <商品説明>
  "TIMBRE"はModel 208 (後期バージョン)のウェーブフォルダー回路を再現したモジュールです。
  ウェーブフォルダーとは波形を折り返すことで入力信号に対して倍音を加算していくような機能で西海岸シンセシスにおける特徴的なサウンドの一つです。また使い方によってはディストーション/サチュレーションのような効果も得ることができます。
  P4Lでは入力にアッテネーター/ブースターを追加し様々なレベルの入力信号に対応させることで適切なフォールド効果を得ることができるようにしました。 またSine to Triコンバーターを組み組むことでフォールド効果のバリエーションをプラスしています。

  特徴的な機能
  ・インプットアッテネーター/ ブースター
  搭載
  ・ Sine to Tri ウェイブシェイプコンバーター搭載
  ・NOSメタル缶トランジスタを使用

  マニュアル(JP)

  付属品:
  電源ケーブル
  交換用スペアパネル(ご注文いただいた色以外のパネルが付属いたします)

  Width: 4HP
  Depth: 28mm
  Power: +12V 20mA / -12V 20mA

  Built by hand in Japan.

  <注意事項>

  ※電源を入れる前に電源の接続を再度ご確認ください。
  当製品の使用により直接または間接的に発生した人身事故、機器の損傷、使用不能について、一切の責任を負いません。

  基板製造に伴い発生してしまう印刷ムラやスレ、キズなどがある場合がございますのでご了承ください。
