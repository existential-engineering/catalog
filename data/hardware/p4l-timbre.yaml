description: TIMBRE is a Eurorack module that recreates the wavefolder circuit
  of the Model 208 (later version), adding harmonics by folding the input
  waveform. It includes an input attenuator/booster and a Sine to Tri waveshape
  converter to expand the range of folding effects.
details: |-
  Notable features
  - Input attenuator/booster
  - Sine to Tri waveshape converter
  - NOS metal-can transistors

  Supplied with a power cable and a spare panel in the colour that was not ordered.

  Width: 4HP
  Depth: 28mm
  Power: +12V 20mA / -12V 20mA

  Built by hand in Japan.
