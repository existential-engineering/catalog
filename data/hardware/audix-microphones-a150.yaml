details: |-
  The A150 is designed with one goal in mind: to reproduce music with accuracy throughout the full frequency range with a smooth, balanced linear response. Featuring 50 mm phase-coherent drivers, the A150 headphones are designed to be worn for hours without listening fatigue. With exceptional isolation, free from the artifacts of noise cancellation, the A150 headphones are intended for studio engineers, DJ mixers, and anyone who enjoys high-quality audio.
