description: The S1 Uke pairs classic Martin craftsmanship with a solid mahogany
  body for rich tone and vintage style. Compact, portable, and full of
  character, it's a high-quality soprano built for everyday play.
details: |-
  Martin has been crafting soprano ukuleles since 1915, inspired by the original instruments that came out of Hawaii in the late 1800s. The S1 Uke carries that legacy forward with a solid mahogany body and a hand-rubbed finish that brings out its natural beauty.

  As the smallest ukulele we make, it's incredibly portable, but don't let the size fool you. The S1 delivers a surprisingly full, rich tone that punches well above its weight.

  Whether you're just starting out or adding to your collection, this compact, high-quality instrument offers classic Martin craftsmanship in a fun-to-play package. It ships with a soft gig bag.
