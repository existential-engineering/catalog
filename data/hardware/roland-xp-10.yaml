description: >-
  The Roland XP-10 is an entry-level 28-voice digital workstation synthesizer released in 1994,
  featuring sampled sounds and waveforms stored on ROM chips with basic envelope and filter
  editing. It includes 338 preset and 256 user patches covering acoustic instruments and synth
  sounds, a resonant digital filter, two effects units, an arpeggiator, and a 61-key
  velocity and aftertouch sensitive keyboard with X-Dual layering mode.
details: |-
  The Roland XP-10 was designed as an affordable entry point into Roland's XP workstation series. Built around digital ROM-based sample playback, it offers a broad GM-compatible sound set plus SR-JV80 type sounds covering acoustic pianos, strings, winds, percussion, brass, and a variety of synth sounds including 303 bass lines, sub bass, noise, leads, and pads.

  While the sounds are preset and not deeply tweakable, basic envelope and filter settings can be manipulated to shape the output. The digital filter is resonant and capable, and two effects units provide up to 10 different effect types including reverb and chorus. The X-Dual mode layers two sounds that can be panned and mixed independently to create composite tones.

  The XP-10 provides 28-voice polyphony with 16-part MIDI multitimbrality and includes an arpeggiator with several preset patterns. Two programmable sliders offer real-time control of editable parameters like filter cutoff. The 61-key keyboard responds to both velocity and aftertouch for expressive playing. Memory capacity includes 338 preset and 256 user patches, 64 preset and 64 user performances, and 16 preset plus 20 user drum kits.

  The interface uses a narrow LCD display that can make deep programming tedious, and the interface has been noted as occasionally buggy. Despite these limitations, the XP-10 is capable of producing quality sounds suitable for dance music or symphonic performances, making it a functional backup synthesizer for basic sound needs.
specs: |-
  - Polyphony: 28 voices
  - Oscillators: Digital acoustic simulation (ROM-based)
  - LFO: Yes
  - Filter: Resonant digital filter
  - Effects: 2 units with up to 10 effect types
  - Memory: 338 preset patches, 256 user patches
  - Performances: 64 preset, 64 user
  - Drum Kits: 16 preset, 20 user
  - Keyboard: 61 keys with velocity and aftertouch
  - Control: MIDI (16-part multitimbral), PC/Mac port
  - Date Produced: 1994
