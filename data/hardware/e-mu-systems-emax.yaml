description: >-
  The E-mu Emax is a classic 12-bit sampler workstation that bridged the gap
  between the Emulator II and Emulator III, offering powerful lo-fi sampling
  with analog-style sound shaping controls and an extensive sample library.
details: |-
  Released in 1986, the Emax represented E-mu's effort to make professional sampling more accessible. Positioned between the beloved Emulator II and the higher-end Emulator III, it delivered a compelling combination of sampling capability and hands-on sound design at a more approachable price point.

  The Emax appeared in several configurations over its production run: the standard keyboard version, the Emax Rack, the Emax HD with a built-in 20MB hard disk, the Emax HD Rack, and the Emax SE (Synthesis Enhanced) which added a dedicated synthesizer section. All versions featured 12-bit sampling at rates from 10kHz to 42kHz, yielding that characteristically warm and gritty digital texture that has become prized by producers.

  Sound design went well beyond basic sample playback. The Emax included many common analog synth-type controls for shaping samples, LFOs for modulation, a 16-track real-time sequencer, and onboard chorus effects. Individual channel outputs alongside stereo outs made it a flexible studio tool. An extensive library of factory samples was available on floppy disk.

  The Emax II followed in 1989, upgrading to 16-bit sampling with up to 8MB of RAM and 32-channel polyphony. Both generations remain sought after for their distinctive character, particularly in hip-hop, electronic, and experimental music production.
specs: |-
  - Polyphony: 8 voices (Emax), 16 stereo voices (Emax II)
  - 12-bit sampling, 10kHz to 42kHz variable rate (Emax)
  - 16-bit sampling (Emax II)
  - 512K RAM (Emax HD/SE), 1MB expandable to 8MB (Emax II)
  - 52 seconds sampling at 10kHz (Emax HD/SE)
  - 61-key keyboard with velocity and polyphonic pressure
  - LFO modulation
  - Chorus effect
  - 16-track real-time sequencer (non-quantizable)
  - Individual channel outputs and stereo outputs
  - MIDI
  - Built-in 3.5" floppy drive
  - SCSI (SE Plus)
