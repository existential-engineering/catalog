description: >-
  The MCO is a highly versatile 6HP digital VCO and voice module offering eight
  high-quality synth voice engines — including wavetable, additive, FM, vocoder,
  virtual analog, and SID chip emulation — with up to four-voice chords and
  extensive CV control.
details: |-
  The MCO (mk II) is a highly versatile digital VCO and voice module inspired by 90s/00s digital synths. It offers eight unique synthesis voices: DigiWave (multi-dimensional wavetable), ToneSum (additive synthesis with twelve sine waves), BC8000 (JP-type digi-synth), Sylon (FFT-based vocoder), Virtana (dual-oscillator virtual analog), Oomph (kick drum and bass synth), SID Guts (C64 SID chip emulation), and AEIOU (vocal/formant synthesis).

  Each voice supports up to four-voice chords, external-triggered envelopes, multiple LFOs, and dual audio outputs. Certain per-voice parameters support audio-rate modulation including FM, sync, and DSP. The module has 4 freely assignable CV inputs on the panel, plus a dedicated audio-rate External input for FM, hard sync, ring mod, or vocoder processing.

  A high-resolution colour display provides a rich visual UI. All states preserve across power cycles. USB-C enables firmware updates, wavetable upload, and device backup. AXON expander support extends assignable CV inputs to 8 total.
specs: |-
  - 6HP width, 32mm depth
  - +12V: 70mA, -12V: 30mA
  - 8 synthesis voice engines
  - Up to 4-voice chords
  - 4 assignable CV inputs (Trig can be 4th)
  - Audio-rate External input
  - Dual audio outputs (Out A, Out B)
  - Built-in ADSR/AD envelopes and LFOs
  - 32 user preset slots
  - High-resolution colour display
  - USB-C for firmware/wavetable/backup
  - AXON expander support (up to 8 CV inputs)
  - Reverse power protection
