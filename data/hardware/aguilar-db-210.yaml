details: |-
  The DB 210 is a compact 2x10 bass speaker cabinet from Aguilar's DB series,
  designed to pack a mighty punch in a road-worthy package. It delivers excellent
  midrange punch, articulation, and low-end extension that suits a broad range of
  playing styles from finger-style to slap and pick.

  The cabinet is built from 13-ply Baltic Birch, providing the rigidity and
  resonance characteristics that are a hallmark of the DB series construction
  approach. Custom Ceramic Eminence drivers are paired with Aguilar's custom horn
  and crossover system, which includes a variable tweeter level control for tonal
  flexibility.

  With 350 watts RMS power handling and 98 dB sensitivity (1W/1M), the DB 210
  is available in both 4 ohm and 8 ohm impedance configurations. Its frequency
  response of 41 Hz to 16 kHz covers the full range of bass guitar and upright.

  The cabinet includes removable casters for easy positioning and transport and
  is designed to work as a standalone unit or paired with additional DB series
  cabinets for larger applications. It is backed by Aguilar's three-year limited
  warranty to the original owner.
specs: |-
