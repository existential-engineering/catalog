  - Frequency Response: 41 Hz – 16 kHz
  - Sensitivity: 98 dB (1W/1M)
  - Drivers: 2x 10" Custom Ceramic Eminence
  - Horn: Aguilar custom with variable tweeter control
  - Construction: 13-ply Baltic Birch
  - Height: 16 5/8"
  - Width: 24 1/2"
  - Depth: 13 1/8"
  - Weight: 59 lbs
  - Removable casters included
