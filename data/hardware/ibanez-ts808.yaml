description: Reissue of the original Tube Screamer — the TS808 — featuring the
  JRC 4558D IC chip and analog circuitry with traditional Overdrive, Tone, and
  Level controls. Made in Japan.
details: |-
  The Ibanez Tube Screamer, in its many versions and forms, can be found on pedal boards in every corner of the globe. The TS808 reissue brings back the warm overdrive that has been sought after for decades.

  This reissue features the JRC 4558D IC chip and analog circuitry, with traditional Overdrive, Tone, and Level controls. Made in Japan, the TS808 includes a converter cable for use with a standard center-negative 9V supply.
specs: |-
  - Controls: Overdrive, Tone, Level
  - Required Current: 8mA@9V
  - Power Supply: One 9 volt battery (006P) or external AC adapter (DC 9V, Center-negative)
  - Converter Cable included
  - JRC 4558D IC chip
  - Made in Japan
