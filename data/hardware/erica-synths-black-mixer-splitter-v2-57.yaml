description: 4x splitter / 4x mixer combo.
details: |-
  The Black Mixer/Splitter V2 is an advanced replacement for stackable patchcables, combining a four input mixer and a four output signal splitter in 4HP.

  Anyone who knows a bit more about electronics will point out that stackable patchcables are not a really wise choice for something as sensitive as a musical instrument, because they mechanically connect electrical signals that at best can cause undesired modulations or even damage the modules. The answer here is four independently buffered mixer inputs and a buffered output signal splitter in one module.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first.

  Input signals run between -10V and +10V, the module is 4HP wide at a depth of 25mm, and power draw is 25mA on each of the positive and negative rails.
specs: |-
  - Four independently buffered mixer inputs
  - Buffered output signal splitter
  - Input signal level -10V - +10V
  - Power consumption +25mA, -25mA
  - Module width 4HP
  - Module depth 25mm
