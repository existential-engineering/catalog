description: >-
  The Boss PC-2 is a compact analog percussion synthesizer released in 1984,
  featuring a touch-sensitive trigger pad and simple controls for creating drum
  and percussion sounds.
details: |-
  Boss released the PC-2 Percussion Synthesizer in 1984 as a pedal-sized unit with a battery compartment and rear jacks. It functions as a straightforward analog synthesizer with a single VCO producing triangle waveforms. The device includes six controls for shaping sounds, with a Sweep knob enabling ascending or descending pitch bend effects. Its VCA envelope offers only Decay control with fixed hard transient attack. A switchable LFO provides Triangle or Square waveforms with adjustable Depth and Rate.

  The unit operates standalone via its highly sensitive trigger pad or accepts 1/4" trigger inputs from drum machines and sequencers. Despite its simplicity, the PC-2 produces diverse analog sounds from UFO bleeps to bass drums and percussion textures. Output is mono through a 1/4" jack. The Amdek PCK-100 offers an identical DIY kit version with modification options.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1
  - Oscillators: 1 VCO (range: 85Hz to 3kHz)
  - Waveforms: Triangle
  - LFO: 1 LFO with Triangle or Square waveforms, Rate (2Hz to 400Hz), Depth
  - Filter: None
  - Envelope: 1 VCA with Decay (time: 30ms to 5 sec)
  - Effects: None
  - Keyboard: Touch-sensitive trigger pad
  - Memory: None
  - Control: 1/4" trigger input
  - Power: 9V battery or external 9V DC supply
  - Date Produced: 1984-85
releaseDate: "1984"
