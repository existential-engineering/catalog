name: Sx600
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/sx600/
description: The Sx600 is a high-output, two-way passive loudspeaker engineered
  for demanding indoor and outdoor installations. It pairs a 12-inch DL12BFH
  low-frequency woofer with a 2-inch DH2T compression driver in a dual-element
  vertical line array configuration, delivering 105 dB sensitivity (1 W/1 m) and
  up to 139 dB peak SPL with 65 x 65 degree coverage. The high-density composite
  enclosure is rated to IEC 529 IP 44 and MIL-SPEC 810 for all-weather use, and
  the included SuperSAM mounting system supports a wide range of fixed-install
  positions. An optional 600 W internal step-down transformer (Sx600PIX variant)
  enables distributed 70 V / 100 V line operation, and the speaker is EN54-24
  Type B certified for voice-alarm applications.
details: >-
  Two-way full-range passive loudspeaker for indoor and outdoor use


  Dual-element vertical line array geometry for improved clarity and
  intelligibility


  12-inch DL12BFH low-frequency transducer paired with 2-inch DH2T HF
  compression driver


  Additional 12-inch ND12 midrange element supporting the line-array
  configuration


  Sensitivity of 105 dB (1 W/1 m); peak SPL of 139 dB


  Frequency range of 70 Hz to 16 kHz (-10 dB) with a passive crossover at 1.8
  kHz


  Coverage pattern of 65 x 65 degrees (H x V, -6 dB) with directivity index of
  11.3


  Recommended high-pass at 90 Hz, Q = 1.6


  Power handling of 600 W continuous / 2400 W peak at 4 ohms nominal (3.5 ohms
  minimum)


  High-density polymer composite enclosure rated IEC 529 IP 44 and MIL-SPEC 810
  for all-weather installation


  Hardwired SJO input cable with weatherproof gland nut


  SuperSAM mounting system included for versatile fixed-install positioning and
  flying


  Optional Sx600PIX variant adds an internal 600 W 70 V / 100 V step-down
  transformer


  EN54-24 Type B certified (1438-CPD-0300) for use in voice-alarm and
  life-safety systems
