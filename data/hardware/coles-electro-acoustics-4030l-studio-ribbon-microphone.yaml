details: |-
  The 4030L Studio Ribbon Microphone is Coles Electroacoustics' entry-level ribbon
  microphone, manufactured using the very latest CNC machinery and magnet technology.
  It is designed to offer performance comparable to the company's higher-end 4040 and
  4050 models at a more accessible price point.

  The microphone features a bi-directional (figure-of-eight) polar response that is
  maintained consistently across both the horizontal and vertical planes, making it
  highly versatile for critical recording applications and a wide range of instruments.

  For stereo recording, the 4030L can be used as a matched pair with a rotatable
  360-degree mount, and is fully compatible with the classic Blumlein crossed
  figure-of-eight stereo configuration. A red dot on the microphone body indicates
  the front for phasing reference when using it in a stereo pair.

  The microphone ships with a foam-lined rigid carrying case and an adjustable
  universal stand mount. Coles Electroacoustics has been manufacturing professional
  ribbon microphones since 1964.
specs: |-
  - Frequency response: 50 Hz to 20,000 Hz (exceptionally flat)
  - Sensitivity: -67 dB W.R.T. 1V/Pa
  - Polar pattern: Bi-directional (figure-of-eight)
  - Consistent polar response across horizontal and vertical planes
  - Compatible with Blumlein crossed figure-of-eight stereo configuration
  - Rotatable 360-degree mount for stereo pair use
  - Red dot front indicator for phasing reference
  - Includes foam-lined rigid carrying case and adjustable universal stand mount
