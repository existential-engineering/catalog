details: |-
  DESCRIPTION

  Introducing the Duocata Classico Custom LTD: a rare and exclusive release, limited to only six guitars (in each finish) worldwide . This special edition Duocata has been meticulously upgraded with the ultra-smooth G7 tremolo system from Göldo, crafted from aluminum with precision bearings for exceptional tuning stability and tonal clarity. Every detail has been fine-tuned for performance: American-made compensated brass saddles by Advanced Plating ensure perfect intonation, while the innovative slot-end screws let you make adjustments easily from either side of the bridge. Built with a chambered ash body and the iconic Rivolta F-Hole, this guitar pairs a set maple neck with our new C++ chunky neck profile, a rosewood fretboard, and a smooth satin finish that feels broken-in from day one. The 25" scale and 24 jumbo frets give you room to express every nuance of your playing. Powering it all are our new proprietary DUOCATA matched pickups (a P90 in the neck and a T-style in the bridge) designed to deliver articulate clarity, balanced tone, and unmistakable character. Each Duocata Classico Custom LTD comes complete with a Rivolta Premium Soft Case , so it's ready to go wherever inspiration strikes. FEATURES & SPECS

  Rivolta Premium Soft Case: INCLUDED
