description: >-
  The Spectralis is a hybrid synthesizer and groovebox from Radikal Technologies
  that combines a monophonic analog/digital synth engine with a 32-voice
  polyphonic multisampling engine. It features an advanced 24-track step
  sequencer and an 11-track drum matrix, making it a comprehensive tool for
  electronic music production and live performance.
details: |-
  The Spectralis combines two distinct sound engines in a single desktop unit. The Asynth is a monophonic hybrid synthesizer featuring four digital oscillators routed through two analog filters: a 4-pole 24dB lowpass and a 2-pole 12dB multi-mode filter. The oscillators can be shaped continuously from sine to square waves and support FM, PM, oscillator sync, bit reduction, and time linearity modulation for pulse-width modulation on any waveform. Three independent Trigger Groups allow the Asynth's oscillators and filters to be split into three separately sequenced monophonic parts.

  The Dsynth is a 32-voice stereo polyphonic multisampling engine with digital 12dB multi-mode filtering, capable of loading up to 128MB of samples into RAM. It supports three independent timbres for multi-timbral operation and can import WAV and SoundFont2 formats. Each Dsynth timbre can be routed into the analog filter section or the 8-bandpass fixed filterbank.

  The sequencing system consists of a drum matrix for xOx-style programming of 11 sampled drum sounds and a 24-track step sequencer with lines ranging from 1 to 192 steps. Sequencer lines can target internal parameters or external MIDI gear, with variable resolutions, directional playback options, and probability settings. The device stores 32 songs with 32 patterns each.

  The Spectralis 2, released in 2009, added 4GB internal CompactFlash storage and OS 1.5, introducing PERFORMZ folders for organizing additional songs and enabling pattern changes via MIDI program changes.
specs: |-
  - 4 DSP hybrid oscillators with continuous waveshaping
  - 24dB/oct analog lowpass filter with ADSR envelope
  - 12dB/oct analog multi-mode filter with ADSR envelope
  - 8-bandpass fixed filterbank
  - 32-voice stereo polyphonic multisampling engine (Dsynth)
  - 128MB sample RAM with WAV and SoundFont2 import
  - 11 drum parts, 3 Asynth parts (Trigger Groups), 3 Dsynth parts
  - 24-track step sequencer with 1-192 steps per line
  - 11-track drum matrix (xOx-style)
  - Approximately 10 LFOs with variable waveforms
  - Two independent delay effects
  - Arpeggiator with Up, Down, Up+Down, Random, As Played, Chord Memory modes
  - 32 songs with 32 patterns each
  - MIDI In/Out/Thru
  - 4GB CompactFlash storage (Spectralis 2 only)
