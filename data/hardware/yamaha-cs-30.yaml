description: >-
  The Yamaha CS-30 is a large-format monophonic analog synthesizer with dual
  oscillators, dual filters, dual amplifiers, three envelopes, a ring modulator,
  and a built-in 8-step sequencer. Its extensive front-panel controls and
  modular-style routing make it one of the most versatile monosynths of the late
  1970s.
details: |-
  Produced between 1977 and 1980, the Yamaha CS-30 sits near the top of Yamaha's CS-series lineup as a feature-rich monophonic instrument. Its large panel is densely populated with knobs and switches, providing direct access to virtually every synthesis parameter without any menu diving.

  The dual-oscillator, dual-filter, dual-amplifier architecture gives the CS-30 a flexibility uncommon among monosynths of its era. Each oscillator has its own dedicated output, and the two voltage-controlled resonant filters can be configured independently, enabling complex timbral shaping. Three envelope generators provide ample modulation sources for dynamic sound sculpting, while the ring modulator adds metallic and inharmonic textures.

  The built-in 8-step sequencer, though limited to a single pattern, was a welcome addition for creating repetitive bass lines and melodic patterns. CV/Gate connectivity and external audio triggering allow the CS-30 to integrate with modular systems and external gear. The instrument notably lacks any memory, effects processing, or MIDI, keeping it firmly in the hands-on analog tradition. 808 State is among the notable artists who have employed the CS-30 in their work.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs with separate outputs
  - Filters: 2 voltage-controlled resonant filters
  - Amplifiers: 2 VCAs
  - Envelopes: 3
  - Ring Modulator: Yes
  - Sequencer: 8-step (1 pattern)
  - Keyboard: 44 keys
  - Effects: None
  - Memory: None
  - MIDI: No
  - Control: CV/Gate, external trigger
