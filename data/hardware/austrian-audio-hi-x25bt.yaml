description: The Austrian Audio Hi-X25BT is a professional wireless Bluetooth
  over-ear headphone featuring Austrian Audio's proprietary 44mm High Excursion
  drivers with a copper-clad aluminum voice coil and ring magnet system.
  Designed for studio-quality monitoring on the go, it delivers a wide frequency
  range of 12Hz–24kHz in a closed-back, foldable form factor. Supports Bluetooth
  5.0 with SBC codec alongside wired connectivity via 3.5mm analog jack and
  digital audio via USB-C. The integrated microphone and touch controls enable
  calls and media control, while 30-hour battery life ensures extended session
  capability.
details: |-
  The Hi-X25BT uses Austrian Audio's High Excursion driver technology — the same 44mm driver, copper-clad aluminum voice coil, and ring magnet system as their wired studio line. Bluetooth 5.0 with A2DP, AVRCP, HSP, HFP profiles and SBC codec. Foldable with memory foam pads, 270g. Accessories include a 1.4m 3.5mm cable, 1.2m USB-C cable, and USB-C to USB-A adapter. VGP Summer 2024, MusicTech Gear of the Year, VGP 2025/2026 winner.
specs: |-
  - Driver Size: 44mm
  - Frequency Range: 12 Hz – 24 kHz
  - Sensitivity: 113 dB SPL/V
  - Impedance: 25 Ω
  - Input Power: 150 mW
  - Weight (without cable): 270 g
  - Dimensions: 205 × 170 × 80 mm
  - Battery Life: 30 hours
  - Bluetooth Version: 5.0
  - Bluetooth Profiles: A2DP, AVRCP, HSP, HFP
  - Bluetooth Codec: SBC
  - Wired Connector: 3.5 mm (1/8-inch)
  - Charging: USB-C
  - Included: 1.4 m 3.5 mm cable, 1.2 m USB-C cable, USB-C to USB-A adapter
