description: The HeadRush VX5 is a dedicated vocal effects unit that makes the
  coveted, industry-standard Antares AutoTune pitch correction technology
  available to vocalists in any live performance or studio setting, with no
  computer needed.
details: |-
  The VX5 is a dedicated vocal effects stomp box that brings industry-standard Antares AutoTune pitch correction to live performance and studio work without a computer. Dedicated Retune Speed and Humanize knobs move the treatment from subtle correction through to the classic hard AutoTune effect.

  Alongside the pitch correction sit onboard studio-quality Reverb, Delay, Chorus and Compressor blocks plus Flavor FX. An intelligent Harmony effect generates vocal harmonies automatically, reading the chords played on a connected guitar or keyboard, and the unit is pitched at beginners and seasoned performers alike across any genre.

  Performance control is hands-free through two onboard footswitches, with A/B Mode switching individual effects on and off inside a preset and Talk Mode disabling all effects for speaking to the audience between songs. A color display and simple menus handle editing, and the unit ships with 99 factory presets and stores up to 250 in total.

  Connections cover a premium XLR mic preamp with switchable +48V phantom power and an XLR line output with a ground lift switch for dealing with ground-loop noise. Stereo 24-bit 48 kHz USB audio interface operation records vocals straight to a computer for backing vocals or DAW production, and USB MIDI connectivity automates preset changes during a show.
specs: |-
  - Industry-standard Antares AutoTune pitch correction
  - Dedicated Retune Speed and Humanize knobs, from subtle correction to the classic hard AutoTune effect
  - Onboard studio-quality Reverb, Delay, Chorus, Compressor and Flavor FX
  - Intelligent Harmony effect that generates harmonies from chords played on a connected guitar or keyboard
  - Stereo 24-bit 48 kHz USB audio interface
  - USB MIDI connectivity for automated preset changes
  - Color display with simple menus
  - 99 factory presets, stores up to 250 presets in total
  - Two onboard footswitches for hands-free preset navigation
  - A/B Mode for switching individual effects on and off within a preset
  - Talk Mode disables all effects between songs
  - Premium XLR mic preamp with switchable +48V phantom power
  - XLR line output with ground lift switch
