details: The Janus is a true bypass, dual joystick controlled Tremolo/Fuzz pedal
  that allows you to create a landscape of distorted textures. Both the Tremolo
  and the Fuzz can be isolated and used alone, but can also be used together in
  series creating thick textures with a lot of movement. Each joystick has a
  separate X and Y axis that has designated controls. The Tremolo joystick
  controls the rate and depth while the Fuzz joystick controls the amount of
  fuzz and the tone. There are individual Volume controls for both effects and a
  Blend control for the Fuzz that allows the user to mix unaffected signal with
  the effected fuzz signal. The joystick controls make the Janus a great option
  for guitars, vocals, keys, or tracks.
specs: |-
  - True Bypass
  - Dual joystick control (Tremolo and Fuzz)
  - Individual volume controls per effect, plus Fuzz blend
  - Power: 9V DC, 8mA, center negative
  - Dimensions: 7.38" x 4.70" x 2.75"
