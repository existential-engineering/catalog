description: "The Axino Synergy Core combines the best of several devices in one
  recording system, that needs just a USB cable connected to a computer to
  achieve studio sound."
details: |-
  The Axino Synergy Core is an all-in-one recording system in a USB microphone, combining studio-grade microphone, preamp, AD/DA conversion and onboard FX processing in a single device that needs only a USB cable to a computer to deliver studio-quality sound.

  Single large-diaphragm capsule with a 34 mm gold-sputtered membrane in a cardioid polar pattern, designed to capture an accurate, frequency-flat representation of the source for vocals, instruments, podcasting and streaming.

  Studio-grade 192 kHz AD/DA conversion paired with Antelope's award-winning 64-bit Acoustically Focused Clocking (AFC) for high-resolution audio capture and ultra-low jitter timing.

  Integrated discrete preamp with a hybrid analog/digital design intended to deliver transparent, uncolored gain to the converter stage.

  Built-in Synergy Core FPGA + DSP runs up to 12 effect instances simultaneously and offloads processing from the host CPU and memory, enabling near-zero latency monitoring, tracking, streaming and mixing. Ships with 18 vintage microphone emulations and 10 real-time effects (EQs, compressors, preamps, reverb, de-esser, gate, expander). Loopback is supported for streaming workflows. Compatible with macOS and Windows.
specs: |-
  - Capsule: single large-diaphragm capsule, 34 mm gold-sputtered membrane
  - Polar pattern: Cardioid
  - Frequency response: 20 Hz - 20 kHz
  - Self-noise: 17 dBA
  - Maximum SPL: 140 dB (<1% THD @ 1 kHz)
  - Sensitivity: 34 +/-3 dB (at 1 kHz, 0 dB = 1 V/Pa)
  - Microphone ADC: 117 dB dynamic range
  - Headphone DAC: 124 dB dynamic range
  - AD/DA conversion: up to 192 kHz
  - Clocking: 64-bit Acoustically Focused Clocking (AFC)
  - USB: Type-B (USB 2.0 compatible)
  - Headphone output: 1/8" (3.5 mm) stereo jack
  - Power: USB bus powered, 5.0 V / 500 mA
  - Dimensions: 1.9" x 2.2" x 7.4" (50 mm x 56 mm x 188 mm)
  - Weight: 0.96 lbs (435 g)
  - Color: Black matte
  - Onboard FX: up to 12 effect instances simultaneously
  - Included microphone emulations: 18 (Berlin 47FT, 47TU, 49T, 57, 67, 87, K86, M103, M251, V563; Hamburg 441; Illinois 7B, 57; Minnesota 20; Tokyo 800T; Vienna 12, 112, 414)
  - Included real-time effects: 10 (VEQ-55A, BAE-1073, FET-A76, OPTO 2A, BAE-1073MP, GYRAF GYRATEC IX, AURAVERB, MASTER DE-ESSER, POWERGATE, POWEREX)
  - Loopback: supported (for streaming)
  - Compatibility: macOS and Windows
  - In the box: microphone, table stand, shockmount, USB cable, quick start guide
