description: The 290 DC is a double-cutaway solid body electric guitar with a
  Honduran mahogany body and neck, offering unhindered access to the upper
  frets. It features dual hand-wound Lollar P90 pickups, a 24 7/8" scale length,
  and an extra long mortise & tenon neck joint. The guitar delivers clean tones
  with harmonic richness through classic rock sounds, finished in high gloss
  nitrocellulose lacquer.
details: |-
  The Collings 290 DC is a double-cutaway evolution of the 290 platform, built with a solid Honduran mahogany body and neck for warm, resonant tone. The double-cutaway design provides unhindered access to the upper frets compared to the single-cutaway 290. Dual Lollar P90 pickups deliver a wide range of tonal possibilities, from clean tones with harmonic richness through classic rock sounds. The neck pickup's position on the DC produces less bass-heavy tones with extra clarity compared to the single-cutaway model. An extra long mortise & tenon neck joint ensures solid coupling between neck and body. The guitar ships with a deluxe hardshell case and is built in Austin, TX.
specs: |-
  - Construction: Solid body double cutaway
  - Body: Honduran mahogany
  - Neck: Honduran mahogany
  - Body Binding: None
  - Fingerboard Binding: None
  - Peghead Binding: None
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson Stop Tailpiece (nickel-plated zinc, steel studs)
  - Fingerboard: Rosewood w/ ivoroid long dots (5mm non-tapered)
  - Fingerboard Radius: 12"
  - Pickups: Lollar P90s
  - Pots/Caps: CTS 500K / Jupiter Vintage Yellow
  - Knobs: Amber or black top hat
  - Pickup Rings: Cream or black
  - Nut Width: 1 11/16"
  - Scale Length: 24 7/8"
  - Neck Joint: Extra long mortise & tenon
  - Frets: Medium 18% nickel-silver
  - Peghead Veneer: Ebony w/ MOP Collings logo
  - Peghead Profile: Haircut
  - Tuners: Nickel Gotoh w/ Collings logo
  - Wiring: 50s style
  - Finish: High gloss nitrocellulose lacquer
  - Pickguard: Black/Cream/Black
  - Truss Rod Cover: Black/Cream/Black with 290 logo
  - Strings: D'Addario NYXL1046 (.010" - .046")
  - Case: Deluxe hardshell case
  - Body Width: 13 1/2"
  - Body Length: 16 1/2"
  - Body Depth: 1 5/8"
  - Total Length: 38 3/4"
