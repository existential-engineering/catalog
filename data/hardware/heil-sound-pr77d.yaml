details: |-
  Product Overview

  The Heil PR 77D is a professional vintage-style dynamic microphone that pairs classic 1950s broadcast aesthetics with modern, high-performance sound engineering. Designed for podcasting, broadcasting, voiceover, and studio recording, the PR 77D features a classic side-address body styled after iconic radio microphones while utilizing a large dynamic element that delivers articulate, full-range audio reproduction.

  Equipped with a built-in two-position Voice / Music switch , the PR 77D allows creators to instantly tailor their frequency response. The Voice setting engages a high-pass roll-off filter starting at 120 Hz to eliminate low-frequency room rumble, mechanical noise, and vocal proximity effect, while the Music setting provides a flat, full-frequency response from 40 Hz to 18 kHz for instruments and music capture. With a cardioid polar pattern delivering exceptional rear rejection and an extreme 148 dB Max SPL capability, the PR 77D is a versatile workhorse for high-end studio and broadcast environments.
specs: |-
  - Iconic Retro Design: Classic side-address broadcast body style finished in high-quality chrome and vintage-inspired housing for a commanding camera presence.
  - Two-Position Voice / Music Switch: Built-in base switch allows instant toggling between a Voice setting (120 Hz high-pass filter) for articulate speech and a Music setting (40 Hz flat) for full-range instrument capture.
  - Large-Diaphragm Dynamic Element: Delivers a wide 40 Hz – 18 kHz frequency response with smooth, linear mid-range presence and condenser-like audio clarity.
  - High SPL Handling (148 dB Max SPL): Handles extremely high sound pressure levels without distortion, making it suitable for both vocalists and loud acoustic/amplified instruments.
  - Cardioid Polar Pattern: Provides excellent off-axis rejection to suppress unwanted background noise, studio reflections, and ambient bleed.
  - Integrated Swivel Mount: Fitted with a built-in vintage-style mounting yoke that threads directly onto standard 5/8″-27 microphone stands and boom arms.
  - Passive Dynamic Operation: Connects via standard 3-pin XLR with balanced 370-ohm impedance; requires no phantom power or inline pre-amp boosters.
  - Element Type: Dynamic.
  - Frequency Response (Music Mode): 40 Hz – 18 kHz.
  - Frequency Response (Voice Mode): 120 Hz – 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -40 dB.
  - Impedance: 370 ohms balanced.
  - Output Level (@ 1 kHz): -53.9 dB.
  - Max SPL: 148 dB.
  - Output Connection: 3-pin XLR.
  - Weight: 28 oz (793.7 g).
