description: >-
  Originally introduced in 1963 as a student drum, the Ludwig Acrolite quickly
  became the choice of pro players in need of dry, cracking snare tone. The
  reintroduced Acrolite is built on a seamless, beaded, brushed-aluminum shell
  manufactured in Monroe, North Carolina, USA, and is offered alongside Acro
  Copper, Acro Brass, and Acro Bronze variants for a range of tonal options.
details: |-
  The Acrolite Series is built on USA-made seamless, beaded metal shells in 6.5x14" with brushed finishes. Available shell materials: aluminum (original Acrolite), copper, brass, and bronze. All models share the same hardware package: 2.3mm steel triple-flanged hoops, P86C throw-off, P35P butt plate, Remo coated Ambassador batter head, Remo clear snare-side head, and Keystone badge.
specs: |-
  - Available size: 6.5x14"
  - 2.3mm steel triple-flanged hoops
  - P86C throw-off
  - P35P butt plate
  - Remo coated Ambassador batter head
  - Remo clear snare-side head
  - Keystone badge
  - LA654BM — Acrolite, 1.6mm seamless aluminum shell, brushed, twin lugs with chrome finish
  - LC654BM — Acro Copper, 1mm seamless copper shell, 10 twin lugs
  - LB654BM — Acro Brass, 1mm seamless brass shell, 10 twin lugs
  - LZ654BM — Acro Bronze, 1mm seamless bronze shell, brushed, 10 twin lugs
