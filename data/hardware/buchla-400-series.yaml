description: >-
  The Buchla 400 is a 1982 compact synthesizer featuring six voices with digital
  oscillators and a simplified panel layout in a solid wood cabinet, eliminating the patch
  cords of modular systems.
details: |-
  Released in 1982, the Buchla 400 introduced a streamlined approach to synthesis, building on designs from its predecessors while removing the complexity of patch cord-based modular systems. The instrument featured six voices equipped with digital oscillators capable of FM synthesis, waveshape interpolation, and timbre modulation.

  Programming required connecting a computer monitor to access graphic editing and sequencing functions through a music programming language called MIDAS. The synthesizer offered sophisticated control over up to 64 acoustic parameters and included a real-time score editor with SMPTE locking capabilities, foreshadowing modern MIDI sequencing.

  Complete scores and patches could be stored on cassette tape or program cards for later recall, with real-time manipulation capabilities during playback or recording.
specs: |-
  - Polyphony: 6 voices
  - Keyboard: 61 piano-style keys or pressure-sensitive touch-plate keys
  - Oscillators: Digital with FM synthesis and waveshape interpolation
  - Memory: Yes
  - Control: CV/GATE inputs and outputs
  - Date Produced: 1982
  - Housing: Solid wood cabinet
releaseDate: "1982"
