description: The Microtubes X 900 is a compact 900W bass amplifier head built
  around the X-series preamp voicing. It pairs an all-analog preamp and Class D
  power section with parallel compression and distortion, an adjustable
  frequency crossover, a 6-band graphic EQ, and cab-sim.
details: |-
  Designed after the revered X series pedals, the Microtubes X 900 sets a new standard for accuracy and control. It packs an all-analog preamp, a 900-watt Class D amplifier, and an ultra-quiet 6-band graphic equalizer into a compact head, letting you sculpt tones from crystal clear to aggressive and overdriven.

  Built around the Microtubes X preamp voicing and controls, it offers parallel compression and distortion with an adjustable frequency crossover, so you can choose exactly which frequencies to compress and which to saturate.

  A built-in cabinet simulation carries three user-swappable impulse responses, and MIDI support handles channel switching and muting programmability.
specs: |-
  - 900W bass amplifier head in a compact format
  - Built around the Microtubes X preamp voicing and controls
  - All-analog preamp with 900W Class D power section
  - Parallel compression and distortion with an adjustable frequency crossover
  - Select exactly which frequencies to compress and saturate
  - Studio-quality 6-band graphic EQ
  - Built-in cab sim with 3 user-swappable IRs
  - MIDI for channel switching and muting programmability
