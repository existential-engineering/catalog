description: Sends is a Eurorack expander that adds four send and four return
  buses to the Bartender V2/Barback V2 mixer system, or functions independently
  as a 4x8 stereo matrix mixer.
details: |-
  Sends can be used in two modes:

  1) Add four send/ret channels: When connected with ribbon cables to Bartender V2/Barback V2 it adds four send buses and four return buses for up to eight channels. Each channel is switchable between PRE and POST and also offers 3.5mm direct outputs jacks for each channel. The output jacks follow the pre/post selection on the switch for the corresponding channel. 2) Stereo matrix mixer: When run without the ribbon cable connections it is a 4x8 stereo matrix mixer. You just use the direct outputs as inputs. Ribbon cables
  There are a total of nine 2x3 ribbon cables to connect all of the audio signals and then a power cable. So it can be a bit fiddly connecting all of the cables. Once you use the pre/post outputs on the Bartender/Barback you cannot then use them to connect other direct output expanders (OUTS or BAL OUTS). Connections
  Connect the pre/post from each channel pair or if you only use pre or post you're welcome to only connect what you'll use. To get the return sum back to Bartender you connect the RET OUT on Sends to CASE IN RET (Line) on Bartender.
