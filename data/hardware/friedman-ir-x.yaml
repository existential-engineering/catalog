description: A dual-channel all-tube preamp and DI pedal that takes a Friedman
  flagship voice from British cleans to high gain, with impulse response cabinet
  and power amp simulation on board.
details: |-
  The Friedman IR-X dual-channel tube preamp is an entire Friedman rig in a compact pedalboard-friendly package. Two high-voltage 12AX7 preamp tubes give each channel the harmonic richness and touch response of Dave Friedman's finest designs, and the controls are kept simple, with no menus and no hundred-page manual to work through.

  IR-X is not simulating a tube preamp, it is one. Where many preamp pedals use a tube to warm up a digital or solid-state circuit, two glowing 12AX7s running at the proper high voltage are this pedal's beating heart. Like the Friedman flagship amps, channel one runs from bluesy British-voiced cleans to a muscular Plexi-style roar, while channel two carries the Friedman higher-gain voice with its percussive punch, note clarity and singing sustain. Both channels have their own independent and highly tweakable boost circuit, which effectively gives four voices under foot.

  DSP impulse response cabinet and power amp simulation sends a studio-quality mic'd-up tone to a DAW or to front of house, whether through the balanced output or the onboard headphone output. The IR per channel is picked with a three-position mini toggle, custom IRs load over the editor software, and the onboard IRs can be disengaged entirely so the tube preamp feeds another IR loader.

  The included editor software, powered by Synergy, tweaks each channel's power amp simulation through the thump and presence controls, loads IRs, activates the Boost Lock feature, switches the effects loop on and off and saves it all to 128 MIDI presets. Twelve Friedman cabinet IRs are included, three of them factory set to the hardware, and the editor adds a five-band parametric EQ and phase control per IR.

  IR-X is MIDI-capable, so channels and presets can be recalled from a pedalboard controller or from a laptop running a whole show. Its ultra-transparent series effects loop takes time-based effects, the loop send can feed a power amp for players who prefer a live cabinet on stage, and the loop return on its own turns the pedal into a standalone IR loader.
specs: |-
  - All-tube high-voltage preamp and DI
  - 2 x 12AX7 preamp tubes
  - Two independent channels plus boost
  - Channel 1 (top channel) clean to gritty
  - Channel 2 (bottom channel) high gain drive
  - MIDI programmable channel select and boost, IR select, Thump and Presence, effects loop on/off and Boost Lock
  - Power amp simulation with software editable presence and thump per channel
  - Low latency impulse response cabinet simulation, bypassable
  - Three position CAB/IR select switch per channel, programmable via software
  - 12 free Friedman IRs or load your own
  - Boost volume and gain controls per channel
  - Volume and gain controls per channel
  - Full EQ consisting of bass, middle and treble per channel
  - 3-way Bright switch on channel 1
  - 2-way Tight switch on channel 2
  - Three multi-function foot switches
  - Ultra-transparent series FX loop, bypassable
  - TRS balanced output
  - Headphone output
  - MIDI 5-pin standard connector and USB MIDI
  - USB software editor, powered by Synergy
  - Universal 12V power supply included
  - 6 foot USB 2.0 A male to B male cable included
  - Limited 3-year warranty
  - Dimensions including knobs: 5.5 in (D) x 6.5 in (W) x 2.3 in (H)
  - Weight: 1.5 lbs
