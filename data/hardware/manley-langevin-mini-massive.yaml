details: |-
  The Langevin Mini-Massive is a two-channel stereo equalizer that distills the essence of Manley's flagship Massive Passive EQ into a single rack space. It captures the warmth and tone of the Massive Passive's outer bands while adding selectable High-Q Bell curves for surgical tonal control.

  Designed for stereo program material or two independent mono channels, the Mini-Massive features all-discrete solid-state make-up gain with optional transformer-coupled outputs. A true hard-wire relay bypass preserves signal integrity when the EQ is not engaged.
specs: |-
  - Two-channel stereo passive EQ with discrete solid-state make-up gain
  - Low Band: 22 Hz – 1 kHz (Shelf or Bell curves)
  - High Band: 560 Hz – 27 kHz (Shelf, Bell, or High-Q Bell at 8.2 kHz, 12 kHz, 18 kHz, 27 kHz)
  - Max Output: +30 dBm balanced
  - THD & Noise: < 0.007%
  - True hard-wire bypass via relays
  - Optional output transformers
  - Dimensions: 19" x 1 3/4" x 10" (1U)
