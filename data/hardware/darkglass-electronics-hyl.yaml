details: |-
  The Hyper Luminal is a hybrid compressor pedal featuring an analog VCA controlled by digital side-chain technology. It offers three compression modes, BUS, FET, and SYM, each modeled after legendary studio compressors, giving players a range of character from transparent to aggressively colored. A Blend control mixes the clean and effected signals for parallel (New York style) compression, a Time control adjusts both the attack and release of the compression, and a Compression knob sets the overall amount of compression along with the internal makeup gain. A micro USB B connector links the pedal to a PC or Mac for the Darkglass Suite software. This unit is a limited edition black finish.
specs: |-
  - Blend control to mix the clean and effected signals
  - Time control to adjust both the attack and release of the compression
  - Compression knob that adjusts both the overall amount of compression and the internal makeup gain
  - Three compression modes - BUS, FET, and SYM
  - Micro USB B connector to connect to PC/Mac for Darkglass Suite software
  - Limited edition black finish
