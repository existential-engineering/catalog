id: eJSBPzkl5tUdjer7j1ylS
name: AAA Five 15
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/aaa-five-15
description: A 125-watt bass combo in the AAA range (named for John Entwistle),
  driving a single 15" Ashdown speaker as a compact practice and rehearsal amp.
  It has High and Low impedance inputs, a 5-band EQ, tube-emulated drive, a line
  input, a transparent effects loop, a headphone output with speaker mute, an
  XLR DI, and an AppTek socket for iOS amp-sim integration.
details: |-
  125-watt AAA bass combo with a single 15" Ashdown speaker, named in reference to John Entwistle. High and Low impedance inputs suit active or passive basses. Tube-emulated drive control from clean to distortion. Five-band EQ (Bass 100Hz, Lo Mid 340Hz, Middle 660Hz, Hi Mid 1.6kHz, Treble 7kHz shelving). Line input for an mp3 player, headphone connection with speaker mute for silent practice, a DI output for recording or a mixer, and a transparent effects loop. AppTek socket (4-pole mini jack) for iOS amp-sim and FX apps, including Ashdown's ABM Pre App via Agile Partners Amp Kit.
specs: |-
  - Power output: 125 watts
  - Speaker configuration: 1 x 15"
  - Frequency response: -3dB at 22Hz and 25kHz
  - High instrument input: 3.9M Ohms, input range 150mV - 20V p-p
  - Low instrument input: 10k Ohms, input range 300mV - 40V p-p
  - Line input: yes, with mix control
  - DI output: XLR
  - EQ: Bass 100Hz, Lo Mid 340Hz, Middle 660Hz, Hi Mid 1.6kHz, Treble 7kHz shelving (all +/-15dB)
  - Effects send and return
  - Distortion: less than 0.5% THD
  - AppTek socket (iOS amp-sim integration)
  - Weight: 17 kg
