details: |-
  DivKid Mutes MK2 is a collaborative Eurorack module from Befaco and DivKid that goes above and beyond basic muting by allowing you to split groups of signals to multiple destinations, making it great for FX dub performing and varied signal routing.

  The module is based on VCA technology for more precision in both modulation and audio handling, as well as click-free muting. This makes it equally suited for audio signals and CV/modulation sources.

  Each channel features a three-position switch: a momentary signal pass-through mode that springs back to center when released, an OFF (muted) center position, and a latching ON position to the right. LEDs visualize the signal state of each channel at a glance.

  Inputs are buffered with cascading normaling, meaning an unpatched input will receive the signal from the channel above it — enabling one source to be routed through multiple destinations simultaneously.

  The module ships with an interchangeable panel that allows it to be converted into a 1U Intellijel-format module, offering flexible installation options for different case configurations.
