description: The Merkin Fuzz is a reissue of one of Catalinbread's first fuzz
  pedals, blending design elements from classic American fuzz boxes including
  the Mosrite Fuzzrite and Jordan Bosstone. It features three gain stages with
  the first two governed by the Texture control, creating a wide array of
  vintage fuzz tones. The Texture knob acts as a mixer between gain stages with
  mild phase cancellation at the midpoint for distinctive vintage coloration.
details: |-
  The Merkin Fuzz is a reissue of one of Catalinbread's earliest fuzz designs, blending circuit elements from the Mosrite Fuzzrite and the Jordan Bosstone. Three gain stages drive the circuit, with the first two governed by the Texture control.

  The Texture knob acts as a mixer between the first gain stage output alone and the combined first/second stage output. At the midpoint, mild phase cancellation occurs between the two paths, creating a distinctive vintage coloration not achievable with a simple blend. This makes the Texture control highly sensitive in the middle of its range.
