  controls. Limited to 50 numbered instruments worldwide.
details: |-
  The Joe Dart Jr is the younger sibling of the popular Joe Dart bass. With its custom contoured body and simplified single-humbucking layout, it packs a serious punch in a smaller package.

  At the heart of its warm, punchy tonality is a lightweight ash body, select maple neck, and a passive neodymium pickup. There are no controls or equalization to color the sound — the tone is manipulated solely by the player's technique and finesse.

  Finished in Olympic White with a gold 3-ply pickguard, the Dart Jr is outfitted with 22 high-profile wide frets, chrome hardware, and ships set up tuned down to C standard with custom Ernie Ball Short Scale Flatwound bass strings.

  Limited to 50 instruments worldwide, each with a numbered neck plate. Ships with a black Mono "Vertigo" gig bag.
specs: |-
  - Body wood: Ash
  - Body finish: High gloss polyester
  - Body color: Olympic White
  - Body dimensions: 12-3/8" wide, 1-5/8" thick, 40-7/8" long
  - Scale length: 30" (short scale)
  - Neck wood: Select maple
  - Neck finish: Satin (natural aged light yellow)
  - Neck width: 2-3/8"
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Maple
  - Fret markers: 5/16" dot inlay
  - Frets: 22 high-profile, wide
  - Pickup: Single Music Man humbucking with neodymium magnets
  - Controls: None (passive, wired straight to jack)
  - Bridge: Vintage Music Man top-loaded chrome-plated steel with nickel saddles
  - Pickguard: Gold (3-ply)
  - Tuning machines: Custom Music Man lightweight with tapered posts
  - Hardware: Chrome
  - Tuning: C Standard
  - Strings: Custom Ernie Ball Short Scale Flatwound (45w-65w-85w-105w)
  - Production: Limited to 50 numbered instruments
