id: 5WEWT7fXE3RMXNEXqQm0F
name: SACD 10
manufacturer: marantz
primaryCategory: outboard
url: https://www.marantz.com/en-us/product/cd-sacd-players/sacd-10/300989.html
description: |-
  The reference-standard SACD 10 is crafted to be the very best using a fully Marantz designed SACDM-3 transport mechanism for maximum rejection of resonance. Featuring a proprietary SACDM-3 disc transport, CD playback, and DAC inputs, SACD 10 offers high-resolution audio support for external source components and digital inputs for other sources.

  From the triple-layer aluminum chassis with copper shielding to entirely original multi-layer PCBs, isolated sub-enclosures, and HDAM module, SACD 10 is the product of decades of expertise in audio engineering, setting a new benchmark with meticulous construction, state-of-the art technologies, and remarkable design.

  SACD 10 retains the sonic Marantz signatures of warmth, spaciousness, and resolution, with advances in design and precise tuning by the Sound Master resulting in the purest expression of the Marantz sound ever. Made for the ultimate CD and SACD enthusiast, SACD 10 is engineered with updated Marantz Musical Mastering and a next generation HDAM module for impeccably detailed audio reproduction.
