description: |-
  The reference-standard SACD 10 is crafted to be the very best using a fully Marantz designed SACDM-3 transport mechanism for maximum rejection of resonance. Featuring a proprietary SACDM-3 disc transport, CD playback, and DAC inputs, SACD 10 offers high-resolution audio support for external source components and digital inputs for other sources.

  From the triple-layer aluminum chassis with copper shielding to entirely original multi-layer PCBs, isolated sub-enclosures, and HDAM module, SACD 10 is the product of decades of expertise in audio engineering, setting a new benchmark with meticulous construction, state-of-the art technologies, and remarkable design.

  SACD 10 retains the sonic Marantz signatures of warmth, spaciousness, and resolution, with advances in design and precise tuning by the Sound Master resulting in the purest expression of the Marantz sound ever. Made for the ultimate CD and SACD enthusiast, SACD 10 is engineered with updated Marantz Musical Mastering and a next generation HDAM module for impeccably detailed audio reproduction.
details: |-
  The reference-standard SACD 10 uses a fully Marantz designed SACDM-3 transport mechanism for maximum rejection of resonance, alongside CD playback and DAC inputs for external source components.

  From the triple-layer aluminum chassis with copper shielding to entirely original multi-layer PCBs, isolated sub-enclosures and a new HDAM module, it is built with a 12mm aluminum top cover, aluminum side covers up to 15.8mm thick, a triple-layer copper-plated bottom plate and solid aluminum feet with copper.

  The DAC stage uses new MMM-Conversion with MMM-Stream dither and noise shaping, two selectable digital filters, a jitter reducer, a DAC master clock design covering SACD, USB-A and USB-DAC, plus asynchronous mode and a Complete Isolation System Duo on the USB-B input. It supports DSD 256 and PCM 384 / 32.

  Connectivity covers fixed unbalanced RCA and balanced XLR line outputs, coaxial and optical digital inputs and outputs, a USB-A input and a USB-B DAC input. A discrete headphone circuit with Low / Mid / High gain drives the 6.3mm output and switches off automatically when not in use.

  Dual power supplies with toroidal transformers feed the unit, which measures 440 x 192 x 442 mm and weighs 33.0 kg. It is available in Marantz Black and Marantz Champagne, with an OLED display and dimmable all-side front panel illumination.
specs: |-
  - Transport: Marantz SACDM-3 mechanism, SACD and CD support
  - DSD 256 and PCM 384 / 32 support
  - Fixed analog output (RCA): 1, thick nickel plated machined copper L/R independent terminals
  - Fixed balanced XLR output: 1
  - Optical input / output: 2 / 1 (4.1 kHz - 192 kHz)
  - Coaxial input / output: 1 / 1 (4.1 kHz - 192 kHz)
  - Headphone output: 6.3mm x 1, discrete circuit, gain setting Low / Mid / High, auto off when unused
  - Remote control bus terminal with internal / external switch
  - AC inlet: Yes
  - Output circuit: New HDAM
  - Power transformer: Toroidal
  - DAC circuit: New MMM-Conversion
  - Dither: MMM-Stream (Dither 1, 2, Off)
  - Noise shaper: MMM-Stream (Balanced, Natural, Dynamic Music, Dynamic Voice)
  - Digital filter: MMM-Stream, Filter 1, 2 selectable
  - Jitter reducer: Yes
  - Asynchronous mode and Complete Isolation System Duo on the USB-B input
  - Frequency response: SACD 2Hz - 50kHz (-3dB), CD 2Hz - 20kHz (±1.0dB)
  - Harmonic distortion: SACD 0.0004%, CD 0.0015%
  - Signal to noise: SACD 118dB, CD 116dB
  - Dynamic range: SACD 112dB, CD 98dB
  - Line output level: unbalanced 2.0Vrms, balanced 4.0Vrms
  - Headphone output level: 130mW / 32 ohms
  - Power consumption: 55W, less than 0.3W at standby
  - Dimensions (W x H x D): 440 x 192 x 442 mm
  - Net weight: 33.0 kg
  - Chassis: aluminum front, side and top covers, triple-layer copper-plated bottom, solid aluminum feet with copper
  - Remote controller: RC004PMND
  - Panel colors: Black / Marantz Champagne
