specs: |-
  - Dimensions (W x H x D): 440 x 192 x 442 mm
  - Net Weight: 33.0 kg
  - Panel Color: Black / Marantz Champagne
  - Front Panel: Aluminum
  - Top Cover: Aluminum (12 mm thickness)
  - Bottom Layer: Triple layer copper-plated
  - Feet: Solid aluminum with copper
  - Frequency Response SACD: 2 Hz-50 kHz (-3 dB)
  - Frequency Response CD: 2 Hz-20 kHz (+/-1.0 dB)
  - Harmonic Distortion SACD: 0.0004%
  - Harmonic Distortion CD: 0.0015%
  - S/N SACD: 118 dB
  - S/N CD: 116 dB
  - Dynamic Range SACD: 112 dB
  - Dynamic Range CD: 98 dB
  - Line Output Level Unbalanced: 2.0 Vrms
  - Line Output Level Balanced: 4.0 Vrms
  - Headphone Output Level: 130 mW / 32 ohms
  - Output Circuit: New HDAM
  - Power Transformer: Toroidal
  - Headphone Circuit: Discrete
  - Headphone Amp Gain Setting: Low / Mid / High
  - DAC Circuit: New MMM-Conversion
  - Digital Filter: MMM-Stream (Filter 1, 2 Selectable)
  - Jitter Reducer: Yes
  - DAC Master Clock Design: Yes (SACD, USB-A, USB-DAC)
  - USB-B Asynchronous Mode: Yes
  - USB-B Isolator: Yes (Complete Isolation System Duo)
  - Power Consumption: 55 W
  - Standby Power: Less than 0.3 W
  - DSD 256 support
  - PCM 384 kHz / 32-bit support
  - SACD playback
  - CD playback
