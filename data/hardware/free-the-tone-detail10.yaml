description: An expansion loop box developed to control various signal lines,
  adding two loops to an ARC-3 or ARC-53M or providing effect loops for an
  amplifier's send and return.
details: |-
  The Free The Tone LB-2 is an expansion loop box developed to control various signal lines. It can add two loops to an ARC-3 or ARC-53M, or provide effect loops for an amplifier's send and return, so a sound system built around a Free The Tone routing controller becomes more flexible without a larger switcher.

  The LB-2 carries two completely independent loops. Because those loops are separate, the unit can be used in six ways depending on how it is connected: as an effects loop, as an effects loop for an amplifier send and return, as an input selector, as an output selector, as a stereo effects loop, and as a mute box.

  All of the input and output jacks and the controls are mounted on one side of the housing, which reduces the wiring space the unit takes inside a pedalboard or a rack. The control section offers ON and RMT (remote) operation.

  When only one loop is in use, the LOOP1 control terminal is the one to use. Inserting a mono standard plug into the LOOP1 control terminal automatically turns the LOOP2 terminal on, which causes no problem in actual usage, and on/off control of LOOP2 becomes available once a plug is inserted in the LOOP2 terminal.

  The unit runs on 9 V DC with centre-negative polarity and draws approximately 75 mA at most. It measures 145 by 59 by 49 mm including protuberances such as jacks and weighs approximately 230 g excluding the AC adapter. No connecting cable and no AC adapter are supplied. Free The Tone builds stereo cables to order for connecting an ARC series unit to the LB-2, in 30 cm, 50 cm and 1 m lengths and in other lengths in 10 cm increments.
specs: |-
  - Number of loops: 2 (two separated loops)
  - Control: ON, RMT (remote)
  - Terminals: 9x 1/4-inch phone jacks (for inputs, outputs and control), 1x 1/4-inch TRS phone jack (for control), 1x DC 9V input jack (for AC adapter)
  - Power supply: 9 V DC centre-negative polarity
  - Current consumption: approx. 75 mA (max.)
  - Dimensions: 145W x 59D x 49H mm (incl. protuberances such as jacks)
  - Weight: approx. 230 g (excl. AC adapter)
  - Accessories: warranty card, Web Access Card, 4x rubber feet (no connecting cable and no AC adapter are supplied)
  - Usable six ways: effects loop, effects loop for amplifier send/return, input selector, output selector, stereo effects loop, mute box
