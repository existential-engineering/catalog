  in a 4 x 6 matrix.
details: |-
  PC4 is a universal controller for all kinds of midi controllable hard- and software. The device has 24 standard pots with rubber knobs designed in a 4 x 6 matrix, and various kinds of midi commands like control change, pitchbend and program change are possible.

  The pots can be assigned to any of these commands by learning incoming midi commands, the way software does it. The pots work with a standard resolution of 7 bit for full compatibility with any software and hardware instruments, effects and DAWs. The internal 16 setups save individual settings, and backup and restore of all settings by sysex dumps is possible too.

  The factory settings are made to control music and video software products out of the box where those products are freely assignable, so any additional device programming is not necessary for many applications.

  A special feature is the switchable snap function for all pots. This simple function is very rare on standard midi controllers with pots and it avoids possible annoying value jumps. Three switchable midi routings make the unit much more flexible for complex midi setups.

  Simultaneous control of external gear and software instruments is no problem for the PC4 due to the available USB and MIDI ports. A separate PC4 Editor helps to program and save PC4 setups.
specs: |-
  - Universal controller for all kinds of midi controllable hard- and software
  - iPad compatible with camera connection kit
  - USB interface with bus powering, class compliant, no driver necessary (consumption under 500 mW)
  - USB bus-powered, with no separate DC power jack
  - MIDI in and out ports with routing and merge functionality
  - 24 pots with rubber knobs and standard midi resolution of 7 bit, laid out in a 4 x 6 matrix
  - Fast pot assign by incoming midi commands like control change (CC), pitch bend and program change
  - Switchable snap function for all pots to avoid value jumps
  - Three switchable midi routings
  - 16 setups with backup and restore functions
  - Backup and restore of all settings by sysex dumps
  - Very compact design in a black casing (180 x 105 x 70 mm, 350 g)
  - Requires a PC or Mac with a free USB port (1.0 or higher) or a USB hub, connected by the enclosed USB cable
  - Works with an iPad running iOS 5 or higher via Apple's camera connection kit
  - Connects to a MIDI device with a standard midi in port (5-pin DIN socket) by the enclosed adapter cable
  - USB power adapter (5 V, min 200 mA) needed if you want to control only midi gear
