details: |-
  A new breed of octave fuzz based on a lost circuit that belongs to no known lineage — a complete replication of the obscure Moonrock Fuzz by G.S. Wyllie, a reclusive North Carolina builder who sandcast his own enclosures, etched his own boards, and designed a unique fuzz utilizing a transformer in an unconventional way. The circuit has a transformer, but it is not creating the octave — it acts more like an inductive element, shaping how the fuzz stage responds and contributing to the swell, fuzz, and octave character of the control.

  Every octave fuzz traces back to just a handful of circuits: the Octavia, the Super Fuzz, and the Tone Machine. The Coyote originates from none of these. Glenn S. Wyllie grew up in New Jersey, learned to read schematics from his electrical-engineer father by age twelve, built his first fuzz pedal at seventeen after hearing Satisfaction, met Jimi Hendrix several times in Greenwich Village, and settled in the Appalachian foothills of North Carolina. His work ended up on recordings and stages with Paul Simon, Bruce Springsteen, Stevie Wonder, David Byrne, Joan Baez, and dozens more — played by NYC guitarist Mark Stewart. Glenn passed away in 2014, still building.

  The Swell/Fuzz/Octave control sweeps through three distinct zones:
  - Swell: At its lowest setting, notes bloom in with a gated, reversed-tape quality — a slow breathing attack that rises from silence.
  - Fuzz: At noon, a fully realized fuzz tone. Rich low end, aggressive mids, in Tone Bender territory, handling chords well.
  - Octave: Fully clockwise, aggressive octave-up territory. Intentionally uneven clipping emphasizes even-order harmonics, especially the second harmonic, pushing it above the fundamental.

  Roll back the guitar volume knob and the Coyote becomes remarkably touch-sensitive. Best used first in chain, played into another overdrive or an overdriven amp. Neck pickup, above the twelfth fret — that is where the octave effect is most pronounced.
