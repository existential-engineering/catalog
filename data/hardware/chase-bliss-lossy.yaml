description: Lossy is an effects pedal from Chase Bliss and Goodhertz that captures the special kind of degradation that happens to digital audio when it's shrunk, transferred, and compromised.
details: |-
  Lossy captures the special kind of degradation that happens to digital audio when it's shrunk, transferred, and compromised: streaming music on a 56k modem, an MP3 ripped from a CD-R, a viral video from 2007 played through a cellphone. All the nasty and beautiful mistakes of heavily-deconstructed digital audio in an easy-to-tweak real-time pedal, made with Goodhertz.

  The pedal breaks into three main blocks: a Loss section that deconstructs the audio, a Filter section to shape and emphasize the artifacts, and a Reverb section to feed or diffuse the loss. Three distinct loss types (Inverse, Standard, and Jitter) each offer a different sonic response, from submerged sparkles to feathery plunks to shifting digital clouds.

  A Packets toggle introduces unpredictability and motion, simulating a bad connection with Packet Loss or adding glitches and transfer errors with Packet Repeat. A spectral freeze can follow the player's input and evolve at a chosen speed, or be solidified into a steady pad, and can be shaped further by the filter and reverb blocks.

  Lossy brings the much-loved Goodhertz plugin into a portable pedal, with a built-in limiter, evolving spectral freeze, All Wet mode (true analog dry-thru with the reverb always wet), and a Slow mode that recaptures the original plugin's bigger, darker, higher-latency character.

  Advanced connectivity includes 2 onboard presets, internal modulation via ramping/bounce of any knob, MIDI (Program Change and CC, via a Chase Bliss MIDIbox), CV control (0-5V), and expression pedal control, making it deeply integrable into a performance rig.
specs: |-
  - Three Loss modes: Inverse, Standard, Jitter
  - Packets toggle: Clean, Packet Loss, Packet Repeat
  - Routable reverb (pre/post) with true analog mix in All Wet mode
  - Flexible filter block with 6dB, 24dB, and 96dB slopes
  - Spectral freeze, evolving or solid state
  - Built-in limiter
  - All Wet mode (true analog dry thru)
  - Slow mode
  - Dry Kill option
  - MISO (mono in, stereo out) and SPREAD stereo widening
  - Trails and Latch options
  - Stereo I/O
  - 2 onboard presets
  - Internal modulation (ramping/bounce)
  - MIDI control (PC, CC) via Chase Bliss MIDIbox
  - CV control (0-5V)
  - Expression control
  - True bypass
  - Power: 9V DC center negative, ~400 mA
