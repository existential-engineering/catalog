description: Lossy captures the special kind of degradation that happens to
  digital audio when it's shrunk, transferred, and compromised. Made with
  Goodhertz, it recreates vintage digital artifacts in an easy-to-tweak
  real-time pedal.
details: |-
  Lossy captures the special kind of degradation that happens to digital audio when it's shrunk, transferred, and compromised — all the nasty and beautiful mistakes of heavily deconstructed digital audio in an easy-to-tweak real-time pedal. It recreates artifacts from compressed MP3s, streaming on 56k modems, and early viral videos played through phones.

  Lossy captures the much-loved plugin from Goodhertz in a portable package, with performance enhancements, refined algorithms, and new features including a built-in limiter, evolving spectral freeze, All Wet mode, and Slow mode.

  Three distinct loss types offer different sonic responses — submerged, feathery, and shifting digital clouds. The Packets toggle adds unpredictability with Packet Loss and Packet Repeat options, simulating unstable digital connections.

  A routable reverb and flexible filter block provide additional shaping, while spectral freeze can be slushy or solid. Full MIDI, CV, and expression control make it deeply integrable into any performance rig.
specs: |-
  - Three types of loss with different sonic responses
  - Spectral freeze with evolving (slushy) or solid modes
  - Packets toggle: Packet Loss and Packet Repeat
  - Routable reverb and flexible filter block
  - Built-in limiter
  - All Wet mode
  - Slow mode
  - 2 onboard presets
  - Internal modulation (ramping)
  - MIDI control (PC, CC)
  - CV control
  - Expression control
  - True bypass with trails option
  - Stereo input/output
  - 9V DC center negative, ~400 mA
