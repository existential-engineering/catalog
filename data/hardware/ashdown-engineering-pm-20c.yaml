description: A hand-built UK 20-watt all-valve guitar combo powered by 2 x 6V6
  and loaded with a 12" Celestion Creamback, delivering warmth, punch, and rich
  harmonics in a portable format. With Gain, Bass, Middle, Treble, and Master
  controls, plus Dark/Light voicing, channel linking, and a foot-switchable
  Boost, it moves from shimmering cleans to saturated overdrive. A built-in load
  allows silent recording or practice, making it a balance of boutique
  craftsmanship, portability, and classic British character.
