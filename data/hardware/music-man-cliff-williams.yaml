details: |-
  The Cliff Williams Icon Series StingRay Bass is the first in a series of limited handcrafted replicas made to capture the look, sound, and essence of iconic Music Man instruments. Only 26 were made available worldwide, matching Cliff Williams' decades-long tenure with AC/DC.

  Initially dubbed 'The #1 Workhorse,' Cliff's 1979 StingRay has been his favorite bass for more than 40 years. Built to the exacting specifications of his original, every detail and characteristic was carefully examined and addressed. Body contours, neck carve, pickup construction, and decades of wear and tear were dutifully replicated by Music Man's team of master craftsmen.

  Hand-selected three-piece poplar body blanks were chosen for their specific weight and appearance to match Cliff's original bass. The 'Back in Burst' Sunburst bodies and maple necks were sprayed with nitrocellulose lacquer to replicate the period-correct finishing techniques. Hand-scraping, sanding, and oil paint were used to recreate worn-through areas, and string tension applied during freeze cycles directed lacquer checking patterns perpendicular to the strings.

  A string-through-body bridge with stainless steel saddles replicates the classic StingRay design. The original rubber mute pads were removed per Cliff's setup requirements. A 3-bolt chrome-plated neck attachment with Micro-Tilt provides neck angle adjustment without shims. The 2-band active preamp is a hand-soldered circuit board built with vintage-correct ceramic disc capacitors; the custom humbucker uses eight elongated alnico 5 magnets wound with original single poly-nylon wire.
specs: |-
  - Body wood: 3-piece translucent poplar
  - Body finish: Nitrocellulose lacquer (Back in Burst sunburst)
  - Body dimensions: 13-1/2" wide, 1-5/8" thick, 44-7/8" long
  - Bridge: Pre-EB geometry Music Man chrome-plated steel with vintage stainless steel saddles
  - Scale length: 34"
  - Neck radius: 7.5"
  - Neck wood: Select maple
  - Neck attachment: 3-bolt Pre-EB Music Man design with Micro-Tilt
  - Truss rod: Bullet truss rod (original Pre-EB style)
  - Fingerboard: Maple (natural aged light yellow finish)
  - Fret markers: 5/16" dot inlay
  - Frets: 21 low-profile, wide
  - Neck width: 2-1/2"
  - Headstock length: 8-3/4"
  - Tuning machines: Schaller BM with tapered string posts
  - Pickup: Custom humbucking with 8 elongated alnico 5 magnets
  - Electronics: 2-band active preamp (volume, treble, bass) with vintage-correct ceramic disc capacitors
  - Electronic shielding: Chrome-plated brass control cover; copper insulating tape in cavity
  - Strings: 50w-70w-85w-105w (Group II Flatwound #2804)
  - Production: Limited to 26 worldwide
