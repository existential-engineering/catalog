description: The 620 SM LC is a fully hollow thinline electric guitar with a 15"
  wide maple laminate body and a shape reminiscent of 1960s hollow bodies. Its
  trestle-block construction delivers open, expressive tonality while
  maintaining the articulate response of a semi-hollow. Custom-voiced Righteous
  Sound Diadem P90-inspired pickups, 50s-style wiring, and an ebony-based
  tune-o-matic bridge complete the vintage-leaning feature set.
details: |-
  The 620 SM LC is Collings' take on the classic 1960s thinline hollow-body electric. The body is fully hollow with a trestle block for structural stability, built from maple laminate at 15" wide and 1 7/8" deep — a quarter inch deeper than other thinline models in the lineup. The extra long mortise & tenon neck joint anchors a maple neck topped with an ebony fingerboard featuring mother-of-pearl long dot inlays and a 12" radius. Custom-voiced Righteous Sound Diadem pickups deliver P90-inspired tone with added musical richness, wired in 50s style through 500K pots and Jupiter Vintage Yellow capacitors. The pinned ebony base with tune-o-matic bridge and nylon saddles provides intonation stability, and a Bigsby vibrato or solid tailpiece is available depending on configuration. Hardware is nickel Gotoh tuners with the Collings logo. Ships with D'Addario NYXL1149 strings and a deluxe hardshell case.
specs: |-
  - Body: Fully hollow with trestle block
  - Body material: Maple laminate
  - Body width: 15"
  - Body length: 19 3/16"
  - Body depth: 1 7/8"
  - Total length: 40"
  - Body binding: Non-grained ivoroid or tortoise
  - Neck: Maple
  - Neck joint: Extra long mortise & tenon
  - Fingerboard: Ebony
  - Fingerboard inlays: Mother-of-pearl long dots
  - Fingerboard radius: 12"
  - Scale length: 24 7/8"
  - Nut width: 1 11/16"
  - Frets: Medium, 18% nickel-silver
  - Peghead veneer: Ebony with MOP Collings logo
  - Peghead profile: Flipped haircut
  - Pickups: Righteous Sound Diadem (P90-inspired, custom-voiced)
  - Wiring: 50s style
  - Pots: 500K
  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Davies Radio
  - Pickup rings: Black phenolic
  - Bridge: Pinned ebony base, tune-o-matic with nylon saddles
  - Tailpiece: Bigsby vibrato or solid tailpiece
  - Tuners: Nickel Gotoh with Collings logo
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011" - .049")
  - Case: Deluxe hardshell
