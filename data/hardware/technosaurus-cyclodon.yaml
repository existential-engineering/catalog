description: >-
  The Technosaurus Cyclodon is a compact 16-step analog sequencer roughly the
  size of a VHS tape, designed to drive CV/Gate-compatible vintage synthesizers
  with looping pitch patterns.
details: |-
  Introduced in 1998, the Cyclodon is a minimalist analog sequencer from German manufacturer Technosaurus. Its design philosophy embraces simplicity: sixteen knobs each correspond to a sixteenth-note step in a single-bar loop, and turning each knob sets the pitch for that step. A tempo knob controls playback speed, though there is no BPM display.

  The Cyclodon communicates exclusively through CV/Gate output, making it a purpose-built controller for vintage analog synthesizers that predate MIDI. It can also receive clock synchronization via Roland-style DIN-Sync input, allowing it to lock to other vintage gear. There is no MIDI connectivity whatsoever, which keeps the design focused and pure.

  At roughly the size of a VHS cassette, the Cyclodon is remarkably compact. It pairs particularly well with the Technosaurus Microcon synthesizer, creating an all-analog sequencing and synthesis setup in a very small footprint. The unit has no patch memory, so each pattern exists only as the current knob positions.

  The Cyclodon appeals to musicians who appreciate the immediacy and happy accidents that come from hands-on analog sequencing. Its inability to program rests means every step always plays a note, encouraging the kind of constantly evolving melodic patterns that characterize classic analog sequencer music.
specs: |-
  - 16-step analog sequencer
  - Tempo control knob (no BPM display)
  - 16 pitch knobs (one per step)
  - No rest programming
  - CV/Gate output
  - Roland DIN-Sync input
  - No MIDI
  - No patch memory
  - No keyboard
  - Approximately VHS tape-sized
