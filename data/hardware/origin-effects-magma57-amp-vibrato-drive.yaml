description: "Combine lush, shimmering vibrato with a smooth, clear overdrive
  tone: MAGMA57 brings the best of the Magnatone 200 Series amplifiers to a
  pedalboard, offering everything from warm, jazzy clean tones to full-on
  swirling psychedelia via true two-stage pitch-modulating vibrato and Analogue
  Amp Recreation technology inspired by the Magnatone Model 213."
details: |-
  MAGMA57 authentically recreates the pitch-bending vibrato effect built into the Magnatone Custom 260 and 280 models from the late 1950s, offering true pitch modulation (unlike volume-changing tremolo). A three-way Blend switch combines the vibrato's wet and dry signals in different ways for three modulation modes: pure Magnatone pitch modulation, Uni-Vibe-style phasing, and a chorus-type effect.

  The amp section is inspired by the Magnatone Model 213 'Troubadour', using Origin Effects' Analogue Amp Recreation technology for warm clean tones and raw, organic overdrive with a semi-passive, semi-active tone control.

  A built-in Post-Drive EQ tailors the output for any amp, flat-response power amp, cabinet simulator, or recording interface. Housed in a hand-polished, brushed stainless steel enclosure with Neutrik jack sockets. Includes a TRS F/SWITCH jack for remote tap tempo and vibrato on/off control.
