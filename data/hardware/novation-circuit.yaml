description: >-
  The Novation Circuit is an all-in-one groovebox combining a two-part synth engine derived from the
  MiniNova with a four-part drum machine and step sequencer, all in a portable battery-powered format.
details: |-
  Released in 2015, the Circuit was Novation's answer to the growing demand for portable, self-contained music-making devices. It brought together synthesis, drum programming, and sequencing in a compact form factor designed for immediate creativity without needing any external gear.

  The synth engine borrows its DNA from the MiniNova, offering two polyphonic synth parts with six-note polyphony each. Waveforms span pulse, sine, square, triangle, and wavetable options, run through multimode filters with 12dB and 24dB slopes. Two LFOs and three loopable ADSR envelopes provide extensive modulation possibilities.

  On the drum side, the Circuit provides four sample-based parts with 64 sample slots offering roughly one minute of total sample time. The 16-step sequencer supports both real-time and step recording, with eight patterns available per part. Built-in effects include 16 delay types, 8 reverbs, and sidechain processing.

  The velocity-sensitive RGB grid serves double duty as both a performance pad surface and a sequencer interface. Its rounded, matt-black enclosure houses a built-in speaker for completely standalone operation, making it ideal for sketching ideas anywhere.
specs: |-
  - Polyphony: 6 notes per synth part
  - Multitimbral: 6 parts (2 synth, 4 drum)
  - Oscillators: 2 per synth voice
  - Waveforms: Pulse, Variable, Sine, Square, Triangle, Wavetable, White Noise
  - Filter: 12dB and 24dB slopes; Low Pass, High Pass, Band Pass with resonance
  - LFOs: 2 (Sine, Square, Triangle, Sample & Hold; clocked and key sync)
  - Envelopes: 3 ADSR (looping, monophonic, polyphonic)
  - Effects: 16 delays, 8 reverbs, sidechain
  - Sampler: 60-second sample time, 64 slots
  - Memory: 64 presets
  - Connections: MIDI In/Out, USB
  - Arpeggiator: 6 tracks per session
