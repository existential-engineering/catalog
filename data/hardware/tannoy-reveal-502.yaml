details: |-
  Custom tweaked by TANNOY's in-house speaker guru, Dr. Paul Mills, the active cross-over filters of REVEAL 502 have absolutely impeccable timing. This produces the ultimate sweet spot so that you can move around in your workspace without losing the stereo imaging of your mix.
specs: |-
