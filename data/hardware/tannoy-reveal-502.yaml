  - Total Power Output: 75 Watts
  - LF/Mid Range Power: 50 Watts
  - HF Power: 25 Watts
  - THD: 0.7%
  - Balanced Input: XLR, 20 kOhm
  - Unbalanced Input: 1/4" Jack, 10 kOhm
  - AUX Link Input: Mini Jack, 10 kOhm
  - AUX Link Output: Mini Jack
  - HF EQ Settings: -1.5 dB HF Cut / Neutral / +1.5 dB HF Boost
  - Crossover Frequency: 2.3 kHz
  - Low Frequency Alignment: Optimized Front Port
  - Dimensions HxWxD: 11.8 x 7.2 x 9.4 inches (300 x 184 x 238 mm)
