description: >-
  A dedicated 16-step analog sequencer from ARP that generates control voltage patterns for
  driving external synthesizers, allowing musicians to create looping melodic and rhythmic
  sequences through hands-on slider manipulation.
details: |-
  Released in 1976, the ARP Sequencer was designed as a companion controller for ARP's lineup
  of analog synthesizers including the 2500, 2600, Odyssey, and Avatar. Rather than producing
  sound on its own, it outputs CV/Gate signals to drive other instruments, making it a pure
  performance and composition tool.

  The interface centers around 16 sliders, each representing one step in a looping sequence.
  Musicians set pitch values by adjusting slider positions, creating patterns that cycle
  continuously. This hands-on approach made real-time tweaking intuitive and musically
  expressive, a stark contrast to the rigid step-programming interfaces of many later digital
  sequencers.

  Thanks to its use of standard CV/Gate protocols, the Sequencer was not limited to ARP
  instruments. It could also control synthesizers from Roland, Oberheim, and Sequential
  Circuits. Its portability at just 8 pounds made it a practical addition to any modular or
  semi-modular setup.

  The Sequencer found favor with a wide range of artists including The Who, Depeche Mode,
  808 State, Vince Clarke, Jean-Michel Jarre, Billy Currie of Ultravox, and filmmaker
  John Carpenter, who used it extensively in his iconic soundtrack work.
specs: |-
  - Sequencer: 16-step analog
  - Control: CV/Gate output
  - Polyphony: N/A (controller only)
  - Keyboard: None
  - Weight: 8 lbs (3.6 kg)
