details: |-
  The Limited Edition Paisley Penguin offers an elegant take on a classic Gretsch design. This Penguin features a chambered mahogany body with arched maple top that is gloriously adorned with a gold edge burst finish over a gold paisley and sparkle top.

  A mahogany set-neck with a Standard "U" profile and aged white binding carries a 12"-radius ebony fingerboard with 22 medium jumbo frets and mother of pearl Neo-Classic thumbnail inlays at a 24.6" scale.

  TV Jones TV Classic (neck) and TV Classic Plus (bridge) pickups feed individual neck and bridge volumes plus master volume and master tone through a 3-position toggle. Gold Adjusto-Matic bridge on a pinned ebony base, Bigsby B3GP String-Thru vibrato tailpiece, and Grover Imperial locking tuners complete the package, which ships in a G6238XL Gretsch solid body hardshell case.
