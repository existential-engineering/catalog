description: 'The 500-watt RB-210 is the ideal portable gigging amp. Dual custom
  10" Lavoce speakers paired with a mutable HF horn reproduce a wide range of
  bass sounds, while classic Ampeg 3-band EQ, Ultra Hi/Ultra Lo switches, and
