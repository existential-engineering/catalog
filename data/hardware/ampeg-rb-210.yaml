details: |-
  500-watt portable bass combo amplifier with dual custom 10" Lavoce speakers paired with a mutable high-frequency horn.

  Ampeg Legacy preamp with classic 3-band EQ and Ultra Hi/Ultra Lo tone-shaping switches.

  Footswitchable Super Grit Technology (SGT) overdrive circuit for legendary Ampeg drive on demand.

  Effects loop, auxiliary input, headphone output, extension speaker output, and XLR direct output for connecting to a P.A. or recorder.
specs: |-
  - 500 watts
  - Dual 10" Custom Lavoce speakers + HF horn
  - Ampeg Legacy preamp with 3-band EQ
  - Footswitchable SGT (Super Grit Technology) overdrive
  - Ultra Hi / Ultra Lo tone switches
  - Effects loop, auxiliary input, headphone output
  - Extension speaker and XLR direct outputs
  - 39 lbs (17.7 kg)
