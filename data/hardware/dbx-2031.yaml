id: Dj2IwhLOdf79nIBxHbtIt
name: "2031 Graphic Equalizer/Limiter with Type III"
manufacturer: dbx
primaryCategory: equalizer
categories:
  - rack-mount
  - outboard
url: https://dbxpro.com/en/products/2031
description: The dbx 2031 is a discontinued 2U dual-channel 31-band graphic
  equalizer integrating Type III® noise reduction, a PeakPlus® limiter, and
  high-quality EQ circuitry for over 120dB of dynamic range. It offers
  switchable ±6dB or ±15dB boost/cut ranges with comprehensive XLR, TRS, and
  barrier-strip connectivity.
details: |-
  The 2031 delivers more than typical graphic equalizers by combining three essential technologies in a single 2U rackmount unit. Type III® Noise Reduction provides up to 20dB of signal-to-noise improvement through an instant encode/decode process, with the noise reduction engaged raising effective dynamic range to over 120dB unweighted — more than 90dB even with noise reduction bypassed.

  The patent-pending PeakPlus® Limiter with a threshold range of 0dBu to +24dBu protects downstream equipment and provides peak control without compression artifacts at normal levels. A comprehensive four-segment LED bargraph simultaneously displays gain reduction and output level, while status LEDs illuminate all front-panel settings for clear visual monitoring in dark environments.

  Recessed front-panel switches control the 40Hz Bessel high-pass filter (18dB/octave) and the equalization boost/cut range. The extensive I/O includes XLR, 1/4" TRS, and barrier terminal strip on both input and output, accommodating virtually any installation or live-sound application.
specs: |-
  - Input Connectors: 1/4" TRS (female), XLR (female, pin 2 hot), barrier terminal strip
  - Input Impedance: Balanced: 40kΩ; Unbalanced: 20kΩ
  - Max Input Level: >+21dBu
  - Output Connectors: 1/4" TRS (male), XLR (male, pin 2 hot), barrier terminal strip
  - Output Impedance: Balanced: 200Ω; Unbalanced: 100Ω
  - Max Output Level: >+21dBu (2kΩ+); >+18dBm (600Ω)
  - Frequency Response: 20Hz–20kHz, +0.5/–1dB; <10Hz–>50kHz, +0.5/–3dB
  - Signal-to-Noise (NR In): >102dB unweighted
  - Dynamic Range (NR In): >120dB unweighted
  - Signal-to-Noise (NR Out): >94dB (±6dB range); >90dB (±15dB range)
  - THD+Noise: <0.04% (0.02% typical at +4dBu, 1kHz)
  - CMRR: >40dB (typically >55dB at 1kHz)
  - EQ Bands: 31 bands per channel
  - Boost/Cut Range: Switchable ±6dB or ±15dB
  - High-Pass Filter: 40Hz, 18dB/octave Bessel
  - Noise Reduction: Type III® (up to 20dB S/N improvement)
  - Limiter Threshold: 0dBu to +24dBu
  - Power: 15W; 100VAC, 120VAC, or 230VAC, 50/60Hz
  - Dimensions: 3.5" H × 19" W × 7.9" D
  - Weight: 8.5 lbs (3.9 kg); 9.5 lbs shipping
