description: >-
  The E-mu Proteus 1000 is a streamlined 64-voice rack-mount sound module
  offering the same 32MB Composer soundset as the Proteus 2000 in a more
  affordable single-expansion-slot configuration.
details: |-
  The Proteus 1000 brings E-mu's acclaimed Proteus 2000 sound engine to a more budget-conscious audience without sacrificing the core sonic quality. It ships with the same 32MB "Composer" soundset found in its bigger siblings, providing a comprehensive palette of synthesizer sounds, realistic instruments, and effects suitable for a wide range of musical styles.

  Polyphony is reduced from the Proteus 2000's 128 voices to 64, and the multitimbral capability steps down from 32 parts to 16. Expansion is limited to a single additional soundset slot compared to the four available in the Proteus 2000 and 2500, bringing maximum memory to 64MB. These are practical compromises that keep the price down while retaining the fundamental sound quality.

  The sound engine features the same 50 types of 6th and 12th-order Z-plane filters that define the Proteus family's character, processed through a 24-bit dual stereo effects section with 29 reverb types, 15 delay types, 8 chorus types, 7 flange types, and 5 distortion types. Two LFOs per voice provide modulation, and 1,536 presets are available split between 1,024 ROM and 512 user-programmable slots.

  The front panel offers four assignable real-time control knobs, more modest than the 16 found on the Proteus 2500 but adequate for basic sound tweaking. Output is simplified to stereo only with no digital output, reinforcing the unit's positioning as an entry-level gateway to the Proteus sound.
specs: |-
  - Polyphony: 64 voices
  - Sound ROM: 32MB "Composer" soundset (expandable to 64MB via 1 slot)
  - LFO: 2 per voice
  - Filter: 50 types of 6th and 12th-order Z-plane filters
  - Effects: 24-bit dual stereo processors (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Keyboard: None
  - Memory: 1,536 presets (1,024 ROM, 512 user)
  - Control: MIDI (16 channels)
