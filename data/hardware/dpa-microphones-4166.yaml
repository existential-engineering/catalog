details: |-
  The 4166 Earset Mic combines the Slim Omni Capsule on the Flex earset. It features the same capsule as the 4060 Omnidirectional Miniature Microphone, but in a different housing. It delivers sound on par with the legacy 4060 on a lightweight and flexible system.

  Now available with CORE+ & MicroLock(R). CORE+ takes your miniature mic to the next level, neutralizing distortion across the entire dynamic range. MicroLock - A dependable, secure locking microphone connector with limitless flexibility and reassuring reliability.

  The 4166 Omnidirectional Earset Microphone merges the amazing sound of the 4066 Omnidirectional Capsule with a lightweight and flexible earset. This condenser earset mic is extremely easy and fast to put on, and it offers clean and transparent sound quality with a lot of headroom. The capsule itself is the same type as the 4066 but is attached to an interchangeable boom arm.

  This mic solution offers clear, natural voice intelligibility and extremely high SPL capabilities. Users can both speak and sing into the mic with no hint of distortion.

  The 4166 earset is the quickest to put on and often the best choice when miking needs to be fast and easy for example for conference use. It is ergonomically designed to fit comfortably and easily. This mic adjusts to fit any ear size and head shape while at the same time it mounts securely and is hardly visible. The boom and the ear hook can be rotated so that the microphone can be easily used on either the left or the right ear.

  The connector splits the cable from the microphone boom allowing you to swap broken cables and/or wireless connectors quickly.

  Three boom lengths are available to accommodate different applications and head sizes: 40 mm (1.6 in), 90 mm (3.5 in) and 110 mm (4.3 in). The 110 mm (4.3 in) is the standard choice for most users.

  This microphone is also available as a headset.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB: 40 Hz - 20 kHz with 3 dB soft boost at 8 - 15 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 6 mV/Pa; -44 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 26 dB(A) re. 20 µPa (max. 28 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 38 dB (max. 40 dB)
  - Distortion, THD < 0.5%: 133 dB SPL RMS, 136 dB SPL peak
  - Distortion, THD < 1%: 136 dB SPL RMS, 139 dB SPL peak
  - Dynamic range: Typ. 113 dB
  - Max. SPL, THD 10%: 144 dB SPL peak
  - Rated output impedance: From MicroLock: 30 - 40 Ω. From DAD9001: 100 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001 XLR Adapter
  - Output balance principle: Signal balanced with DAD9001 XLR Adapter
  - Common mode rejection ratio (CMRR): > 60 dB from 50 Hz to 15 kHz with DAD9001 XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD9001: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001 XLR Adapter
  - Connector: MicroLock
  - Weight: Microphone boom: 0.8 g (0.03 oz). Earhook: 1.1 g (0.04 oz). Cable: 6.6 g (0.23 oz). Total: 8.5 g (0.30 oz)
  - Microphone diameter: 5.4 mm (0.21 in)
  - Microphone length: Boom length: Normal: 120 mm (4.7 in), Medium: 100 mm (3.9 in)
  - Cable length: 1.3 m (4.3 ft)
  - Cable diameter: 1.6 mm (0.06 in)
  - Polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - Electromagnetic compatibility (EMC): Fully compatible
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black, Beige, Brown
  - Features: Pristine audio quality; Lightweight and flexible; Easy mounting to the left or right; Minimal visual impact; Resistant to humidity; Flexible adapter system fits most professional wireless systems
