details: |-
  Grado's new Signature HP100 SE headphones are a contemporary homage to the trailblazing high-end HP1 model, heralding a new design direction. World-renowned designer and manufacturer of award-winning headphones, Grado Labs presents its newest and flagship model, the Signature HP100 SE.

  Grado Labs founder Joseph Grado created what many consider to be the high-end headphone market with the release of the Signature HP1 headphone in the early 1990s. In recognition of Joseph Grado's 100th birthday and this industry milestone, Grado Labs is producing these Special Edition headphones.

  "Although Uncle Joe left us 10 years ago, he will always be a presence at Grado Labs," says Joseph's nephew and Grado's CEO, John Grado. The HP100 SE features newly engineered drivers and a modern design direction, hand-assembled in Brooklyn, NY.

  The headphones include hand-machined aluminum housing, a white stitched leather headband with 50% more padding than previous models, G and F style cushions, and a stainless steel band with adjustable height rods. It is the first Grado model with detachable cables.
