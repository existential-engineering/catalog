details: |-
  The California Single-Cut (CS) is an updated take on the classic single-cut guitar. One of the most beloved features of the CS is its minimal neck heel: the Kiesel set-neck construction is sculpted for a virtually seamless, flowing design that allows effortless upper-fret access.

  Customizable options include scale length, fret count, pickup configuration, and other Custom Shop specs.

  The standard build is a mahogany body with a flamed maple top, rear of body natural clear and natural body binding, with a set tung-oiled mahogany neck carrying a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability.

  Electronics are a master volume, a push/pull tone and coil splitter and a 3-way pickup selector feeding bezel-mount Kiesel Beryllium humbuckers, over a Tune-O-Matic bridge at .4125 inch (10.5 mm) spacing with premium Kiesel locking tuners.
specs: |-
  - California Single-Cut (CS) model line, 6-string at this configuration
  - Construction: set neck with sculpted minimal neck heel
  - Body: mahogany body, flamed maple top, rear of body natural clear
  - Binding: natural body binding
  - Neck: tung-oiled mahogany with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius
  - Frets: 22 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length: 25 inch
  - Pickups: bezel-mount Kiesel Beryllium humbuckers
  - Electronics: master volume, push/pull tone and coil splitter, 3-way pickup selector
  - Bridge: Tune-O-Matic, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: carved top headstock with flamed maple overlay
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Neck width: 1.69 inch wide at the nut, 0.78 inch thick at the 1st fret, 0.88 inch thick at the 12th fret
  - Body dimensions: 38.5 inch long, 2.1 inch thick, 12.8 inch wide
  - Weight: 8.75 lbs
  - Strings: Elixir Nanoweb 1046E
  - Scale length, fret count, pickup configuration and other Custom Shop specs are configurable
