details: |-
  The 2021 Tim Commerford Artist Series StingRay is a limited-edition collection designed in collaboration with Tim Commerford, legendary bassist of Rage Against the Machine, Audioslave, and 7D7D. Each color is limited to 50 instruments with numbered neck plates (#1–50).

  The collection was offered in four configurations: Active Short-Scale, Passive Short-Scale, Active Full-Scale, and Passive Full-Scale — several of which had never been offered before in the StingRay line.

  A powerful neodymium humbucking pickup drives the instrument. Active models feature a 3-band active preamp with 18 volts of headroom. Passive models use a 3-position parallel/single-coil/series rotary switch with a push-volume passive gain boost.

  Player-focused appointments include a 5-bolt sculpted neck joint with full 22-fret access, a height-adjustable custom finger ramp, and a strings-through-body bridge with vintage plated saddles and adjustable mute pads.
specs: |-
  - Body: Ash; 12-3/8" wide, 1-5/8" thick, 40-7/8" long
  - Body finish: High gloss polyester
  - Scale length: 30" short-scale or 34" full-scale
  - Neck: Select maple (roasted maple option) with oil/wax finish
  - Neck width: 1-1/2" at nut, 2-3/8" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Maple
  - Fret markers: 5/16" dot inlay
  - Frets: 22 high-profile, wide stainless steel
  - Headstock length: 8"
  - Pickup: Single humbucking with neodymium magnets
  - Electronics (active): 3-band active preamp with 18-volt headroom (volume, treble, mid, bass)
  - Electronics (passive): 3-position parallel/single-coil/series rotary; push-volume passive gain boost
  - Bridge: Music Man chrome-plated strings-through with hardened steel plate, nickel-plated saddles, adjustable mute pads
  - Tuning machines: Custom Music Man lightweight with tapered posts
  - Pickguard: Black
  - Strings: 45w-65w-85w-105w (Medium Scale Regular Slinky Bass #2856)
  - Production: Limited to 50 instruments per color, numbered neck plates
  - Made in: San Luis Obispo, California
