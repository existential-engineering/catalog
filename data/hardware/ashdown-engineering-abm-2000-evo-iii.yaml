id: q2SAxXrUJOD_G0fsEagiz
name: ABM 2000 EVO III
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-2000-evo-iii
description: The ABM 2000 EVO III is the most powerful Ashdown head, pairing the
  much-loved ABM EVO III preamp with two Class D power sections for 1000+1000W
  RMS (4000W peak) into two 4 ohm / 4 x 8 ohm outputs. Three rotary tone
  controls provide 20dB of cut and boost at 60Hz, 660Hz and 5kHz, supplemented
  by two pairs of sliders. A switchable passive/active input blends solid-state
  and dual-triode tube preamp stages, and the amp adds a footswitchable
  compressor, sub-harmonic generator, front-panel balanced DI, sub-bass output,
  tuner output, FX loop and line input.
details: |-
  Flagship Ashdown ABM bass head. Two Class D power sections producing 1000+1000W RMS (4000W peak) into two 4 ohm / 4 x 8 ohm outputs; same enclosure size as an ABM 900 head. Three rotary tone controls give 20dB cut/boost at 60Hz, 660Hz and 5kHz, supplemented by two pairs of sliders giving 15dB cut/boost at 180Hz, 340Hz, 1.3kHz and 2.6kHz; EQ footswitchable in/out. Single input switchable for passive and active instruments, blending solid-state and dual-triode tube preamp stages, presettable and footswitchable. Footswitchable onboard compressor and sub-harmonic generator that tracks the main signal an octave lower with a level control. Front-panel balanced DI out with pre/post EQ switching, a sub-bass output, tuner output, FX loop and a line input for an external sampler or sound source; output muting cuts the DI while leaving the tuner output live for silent tuning. One 12AX7 preamp tube. Power output: 2000W. Power handling: 4000W peak. Frequency response: -3dB @ 17Hz - 30kHz. High instrument input impedance: 3.9M Ohms. Low instrument input impedance: 10k Ohms. Line input impedance: 22k Ohms. Tuner output impedance: 1k Ohms. DI output: 600 Ohms balanced. Minimum impedance: 4 Ohm. FX send/return: 22k Ohms, 0dBu nominal. Dimensions (H x W x D): 158 x 610 x 355 mm. Weight: 17.9 kg.
specs: |-
  - Power output: 2000W (1000+1000W RMS)
  - Power handling: 4000W peak
  - Speaker outputs: 1 x Speakon/Jack socket
  - Frequency response: -3dB @ 17Hz - 30kHz
  - High instrument input impedance: 3.9M Ohms
  - Low instrument input impedance: 10k Ohms
  - Line input impedance: 22k Ohms
  - Tuner output impedance: 1k Ohms
  - DI output: 600 Ohms balanced
  - Minimum impedance: 4 Ohm
  - FX send/return impedance: 22k Ohms, 0dBu nominal
  - Preamp tube: 1 x 12AX7
  - Dimensions (H x W x D): 158 x 610 x 355 mm
  - Weight: 17.9 kg
