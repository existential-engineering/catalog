description: The Fuzzrite Germanium faithfully recreates the rare 1966-1968
  Mosrite germanium fuzz circuit, of which only around 250 originals were ever
  produced. Built with two NOS PNP germanium semiconductors, it captures the raw
  psychedelic tones beloved by players like Ron Asheton and Henry Vestine. A
  Modern/Vintage toggle switch adapts the circuit's output capacitors for
  compatibility with contemporary rigs while preserving the original's iconic
  character.
details: |-
  The Fuzzrite Germanium recreates the rare Mosrite germanium fuzz pedal from 1966-1968. The Depth control blends a second transistor gain stage, ranging from clean and fat to saturated and aggressive. A Modern/Vintage toggle selects between 2nF (vintage) and 10nF (modern) output capacitors for adjustable low-end response.

  The pedal uses two NOS PNP germanium semiconductors with a polarity inverter IC for standard center-negative power supply compatibility. Best placed first in the signal chain — avoid buffers before this pedal.
