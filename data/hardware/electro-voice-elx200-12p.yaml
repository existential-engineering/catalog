name: ELX200-12P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/elx200-12p/
description: The ELX200-12P is a 12-inch two-way powered loudspeaker for
  portable and installed sound applications. A 1200 W Class-D amplifier drives
  an EVS-12M 12-inch woofer and a DH-1L 1-inch titanium compression driver
  behind EV's Signal Synchronized Transducers (SST) waveguide, delivering up to
  130 dB peak SPL with 90 x 60 degree coverage. QuickSmartDSP provides four
  factory presets (Music, Live, Speech, Club) plus five user-programmable
  presets with sub/top crossover and three-band EQ. The lightweight
  polypropylene enclosure features three M10 suspension points, integrated
  pole-mount, and the proven ZLX three-handle design. Bluetooth Low Energy
  enables wireless configuration of up to six ELX200 loudspeakers via the EV
  QuickSmart Mobile app (availability varies by country).
details: >-
  1200 W Class-D amplifier delivering up to 130 dB peak SPL


  EVS-12M 300 mm (12-inch) woofer with DH-1L 1-inch titanium compression driver


  EV-patented Signal Synchronized Transducers (SST) waveguide design


  QuickSmartDSP with four factory presets (Music, Live, Speech, Club)


  Five user-programmable presets with store and recall


  Sub/top system-match crossovers and three-band EQ


  Bluetooth Low Energy (BTLE) connectivity for wireless control (select
  countries)


  EV QuickSmart Mobile app controls up to six ELX200 loudspeakers simultaneously


  Visual limiter status monitoring and input metering


  Performance alerts surfaced via mobile app


  Lightweight polypropylene enclosure with 18 AWG steel powdercoated grille


  Three M10 threaded suspension points for rigging


  Integrated pole-mount and proven ZLX three-handle design for easy lifting


  Available in black or white
specs: |-
