details: |-
  The world's greatest hollow body guitars just got even better. Designed from the ground up for modern players yet retaining all the timeless style that made the 6120 famous, the G6120TG-DS Players Edition Nashville Hollow Body DS with String-Thru Bigsby and Gold Hardware is a perfect pairing of art and performance. Player-oriented features, wide-open sound and comfortable playability combine to create a playing experience like no other.

  Two DynaSonic pickups produce amplified bright, shimmering highs and a defined, rich bass for distinct tone that cuts through the mix. The innovative Gretsch "ML" bracing delivers huge hollow body sound from the comfortable 2.5"-deep maple body.

  A 12"-radius ebony fingerboard with rolled edges and 22 medium jumbo frets top a 24.6"-scale maple neck. The Bigsby B6GP vibrato tailpiece and Adjusto-Matic bridge combine with the Graph Tech TUSQ XL nut for maximum tuning stability.

  This Nashville is ready to bring Music City style to the stage - from the Roundup Orange gloss urethane finish to the gold Gotoh locking tuning machines.
