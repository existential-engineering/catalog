details: |-
  The DWCP9999 Tom/Cymbal stand is a rugged, versatile, purposeful stand that will simplify set-up. Made from heavy-gauge tubing with oversized tube joints to minimize wobble, and armed with a ball-and-socket adjustment for easy positioning.

  Stands include 1/2″ diameter tom arms to work with DW TB12 brackets and an auxiliary clamp for mounting cymbals or other percussion accessories. Using the Auxiliary Clamp or an available Tom Arm on any of the four basic Tom Stand models, you can easily upgrade or create your own unique set-up.

  This stand utilizes the SM799 DogBone with Boom Cymbal Arm. Plastic Tube Insulators inside the heavy gauge tubing are a necessity in recording situations to avoid rattling when drum mics are placed close to stands.

  Hinged Memory Locks are included at tube joints, cymbal arms and tripod leg assemblies to guarantee 100% repeatable, precise height settings every time.
specs: |-
  - Heavy-gauge tubing with oversized tube joints
  - Ball-and-socket adjustment for easy positioning
  - 1/2″ diameter tom arms, work with DW TB12 brackets
  - Auxiliary clamp for mounting cymbals or other percussion accessories
  - SM799 DogBone with Boom Cymbal Arm
  - Plastic Tube Insulators to avoid rattling near drum mics
  - Hinged Memory Locks at tube joints, cymbal arms and tripod leg assemblies
