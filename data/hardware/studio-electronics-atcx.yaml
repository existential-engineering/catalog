description: >-
  The ATCX is a 2U rack-mounted monophonic analog synthesizer from Studio Electronics
  featuring dual VCOs and four switchable analog filter types inspired by the Moog
  Minimoog, ARP 2600, Roland TB-303, and Oberheim SEM. It combines classic analog sound
  with digital control via a single rotary encoder interface and a 512-patch internal
  memory.
details: |-
  The ATCX represents a departure from its predecessor, the ATC-1, adopting an all-blue industrial design with a minimalist front panel. The most distinctive interface element is a single rotary encoder in the center used for making all edits, operated through membrane switches that display values on a 3-character LCD screen. While this design saves panel space, it requires consulting the user manual to interpret abbreviated parameter names, making real-time tweaking less intuitive than knob-based interfaces.

  The synthesizer houses two VCOs offering triangle, sawtooth, and variable square waveforms that can be active simultaneously. The standout feature is the ability to switch between four analog filter types at the touch of a button: designs modeled after the Moog Minimoog, ARP 2600, Roland TB-303, and Oberheim Synthesizer Expander Module. All filters share the same characteristics with their inspirations, allowing dramatic tonal variations from a single instrument. Three ADSR envelope generators control the VCF, VCA, and modulation tasks respectively.

  Two LFOs provide modulation sources with multiple waveform options including noise, saw up, saw down, square, and triangle. A novel addition is analog distortion processing, activated through the Noise Level control. The back panel includes MIDI In/Out connectivity, ring modulator I/O, audio outputs, and an external input routed to the filter, LFOs, and VCA for external signal processing.
specs: |-
  - Polyphony: 1 voice (monophonic)
  - Multitimbral: 1 part
  - Oscillators: 2 VCO
  - Waveforms: Pulse, Variable Pulse, Saw Down, Saw Up, Sine, Square
  - Filters: 4 switchable types (Minimoog, ARP 2600, TB-303, Oberheim SEM)
  - Filter Slopes: 12dB (2-pole) and 24dB (4-pole), Low Pass, High Pass, Band Pass
  - Filter Routing: Serial and Parallel configurations
  - LFOs: 2 with Noise, Saw Up, Saw Down, Square, Triangle waveforms
  - Envelopes: 3 ADSR (VCF, VCA, Modulation)
  - Memory: 512 patches (internal RAM)
  - Format: 2U Rack Mount
  - Connectivity: MIDI In/Out, Ring Modulator I/O, Audio Output, External Input
