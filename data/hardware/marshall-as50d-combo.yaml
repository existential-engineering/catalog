description: The AS50D is a 50W solid-state acoustic combo from Marshall, designed for amplifying acoustic instruments and vocals. It provides two independent channels — an instrument channel and a microphone channel — each with its own controls, so a player can plug an acoustic guitar in alongside a mic and mix the two on the front panel. Anti-feedback circuitry helps tame the howl that comes with amplifying piezo and condenser sources at stage volume, and a built-in digital FX section adds chorus and reverb for sweetening the dry signal. The amp is voiced for a clear, full-range acoustic tone rather than the coloured response of an electric guitar amp.
details: |-
  With two channels and multiple input features, the AS50D Combo is a versatile amp designed for an abundance of acoustic instruments. Designed to effortlessly accommodate FX pedals and equipped with its own integrated digital FX, you can create your own tone with ease.

  Never hold back thanks to the dual channels on the AS50D Combo amp, which expand the range of available tones. You can configure each channel to a different setting and effortlessly switch between the two when needed, unlocking whole new levels of versatility. This flexibility proves especially valuable when experimenting with a range of music genres.

  If you play with amplified instruments or sing, then you know that feedback can cause a real disruption. That is why we have added our anti-feedback technology to make sure that every channel sounds crisp and clear.

  Designed to effortlessly integrate with FX pedals, the AS50D empowers you to craft a personalised tone. Combine this with the built-in digital FX of the amplifier, and you can effortlessly shape and refine your ideal sound.

  Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: AS50DV, Acoustic range
  - Solid state, 50W output
  - Two channels (multi)
  - Two 8 inch custom speakers plus a Hi-Fi tweeter
  - Speaker configuration: 2x8 inch plus tweeter, custom speakers (8 ohm), unit impedance 4 ohm
  - Anti-feedback controls with frequency sweep
  - Built-in digital FX: reverb and chorus
  - Effects loop with send and return
  - Controls: acoustic channel 1 (volume, bass, treble), microphone/aux channel 2 (volume, bass, treble), chorus channel selection, chorus effect speed, chorus effect depth, reverb balance, reverb level, anti-feedback frequency sweep, volume
  - Inputs: 2 x instrument jacks, 1 x phono (aux) in, 1 x XLR, footswitch
  - Outputs: DI out, line out, effects loop
  - Dimensions: 565 x 415 x 250 mm (22.2 x 16.3 x 9.8 in)
  - Weight: 14.1 kg / 31 lb
  - Detachable power cable included
  - Designed and engineered in UK. Made in Vietnam.
