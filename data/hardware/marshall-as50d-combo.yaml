description: The AS50D is a 50W solid-state acoustic combo from Marshall,
  designed for amplifying acoustic instruments and vocals. It provides two
  independent channels — an instrument channel and a microphone channel — each
  with its own controls, so a player can plug an acoustic guitar in alongside a
  mic and mix the two on the front panel. Anti-feedback circuitry helps tame the
  howl that comes with amplifying piezo and condenser sources at stage volume,
  and a built-in digital FX section adds chorus and reverb for sweetening the
  dry signal. The amp is voiced for a clear, full-range acoustic tone rather
  than the coloured response of an electric guitar amp.
