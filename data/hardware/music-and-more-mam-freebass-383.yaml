description: >-
  The MAM FreeBass 383 is a monophonic analog synthesizer module designed as a TB-303
  clone in a compact 1U rack-mount format. Originally a repackaged version of the MB 33
  sold exclusively through Turnkey music shop in the UK, it offers classic acid bass tones
  at an affordable price point. The unit features eight front-panel knobs for essential
  sound shaping but lacks MIDI control and onboard memory.
details: |-
  The FreeBass 383 replicates the classic Roland TB-303 bass synthesizer architecture, delivering the squelchy, resonant acid bass lines that defined an entire genre of electronic music. Built by Music and More (MAM), it was positioned as a budget-friendly alternative to the increasingly rare and expensive original 303.

  The synthesizer provides eight front-panel knobs controlling tune, filter cutoff, resonance, envelope modulation, accent, and decay. A key distinction from the original TB-303 is the oscillator waveform knob, which enables smooth morphing between sawtooth and square waveforms rather than offering only a fixed switch between the two.

  The FreeBass 383 also includes an external audio input routed through the filter section, allowing users to process external sound sources through its resonant filter. However, the unit lacks MIDI support for note and parameter control and offers no onboard memory for storing custom sounds, reflecting its budget-oriented design philosophy.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with continuous waveform morphing (sawtooth to square)
  - LFO: None
  - Filter: Resonant low-pass with cutoff, resonance, and envelope modulation controls
  - VCA: Accent and decay controls
  - Keyboard: None
  - Memory: None
  - MIDI: Not supported
  - External Input: Audio input routed to filter section
  - Form Factor: 1U rack-mount module
