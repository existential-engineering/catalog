description: The E805 Powercube 200 is a pedalboard-sized, full-range Class D
  guitar power amplifier delivering 200 watts into a 4 Ohm minimum load, with a
  balanced DI output and a switchable 3-band EQ plus presence control.
details: |-
  The Powercube 200 is a full-range, pedalboard-ready power amp that turns a preamp, a modeler or an amp-in-a-box into a stage-ready rig without the weight of a traditional valve head.

  The compact Class D power stage delivers 200 watts of clean, transparent headroom in a footprint that fits on a pedalboard. A preamp plugs in at the front of the chain, and the Powercube 200 pushes the result through a guitar cabinet, an FRFR speaker or a PA without colouring what has already been dialled in.

  A switchable 3-band EQ with an additional presence control is available when shaping is wanted, and it can be switched out of the path entirely. A balanced DI output feeds a desk or PA directly.

  The unit runs from a wide-range internal power supply covering 100 V AC to 240 V AC. It measures 7.5 x 18.5 x 11.5 cm and weighs 1.05 kg.
specs: |-
  - Class D power amplifier, 200 W maximum power output into a 4 Ohm minimum load
  - Wide-range power supply from 100 V AC to 240 V AC
  - Balanced DI output
  - Switchable 3-band EQ with additional presence control
  - EQ can be switched off
  - Dimensions: 7.5 x 18.5 x 11.5 cm
  - Weight: 1.05 kg
