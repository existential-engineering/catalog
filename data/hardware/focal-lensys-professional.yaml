description: With Lensys Professional, you can work on your music in the studio or on the move. Its closed-back design, meticulous ergonomics and robust materials make these headphones comfortable and solid, ideal for any environment.
details: |-
  Experience limitless possibilities with Lensys Professional. Whether you are in the studio or on the move, these headphones provide the comfort and durability you need. Their closed design, meticulous ergonomics, and robust materials make them the ideal choice for any environment. With Focal drivers delivering extremely accurate sound, you can trust these headphones for professional use. The included case and two cables add further convenience and flexibility.

  Comfort and insulation: comfort is essential for headphones used during extended work sessions. The Lensys Professional headphones are designed to be lightweight and feature memory foam ear cushions for a comfortable fit and excellent sound insulation. The aerated fabric headband provides a consistent curvature, making it perfect for extended wear.

  Accuracy anywhere: the Lensys Professional headphones are designed to offer a neutral tonal balance and high accuracy, making them an excellent choice for mixing. Their versatility and reliability make them a valuable tool in any setting, and they provide an immersive experience for binaural work.

  Focal expertise: the 40mm aluminium-magnesium "M" dome drivers provide linear frequency response, low distortion, and improved sound dispersion, resulting in highly accurate sound. Their slightly angled position in the earcups enhances the stereo image, while their acoustic load has been optimized for operation similar to that of a bass-reflex loudspeaker.

  Insulation: the earpad volume has been sized for very balanced acoustics, with two materials in studied proportions. The microfiber allows for linearization of the bass register and sound diffusion, while the acoustic fabric combines absorption and linearization capacities of the 3-9 kHz register. The thermosensitive, high-resilience memory foam offers excellent coupling to different face shapes.
specs: |-
  - Product type: closed-back headphones
  - 40mm aluminium/magnesium "M" dome full-range electrodynamic drivers
  - Frequency response (+/- 3dB): 5 Hz - 22 kHz
  - Harmonic distortion rate: 0.3% @ 1 kHz / 100 dB SPL
  - Impedance: 26 Ohms
  - Sensitivity: 100 dB SPL / 1 mW @ 1 kHz
  - Weight: 306 g / 0.67 lb
  - Carrying case included (210 x 70 x 240 mm)
  - Cables provided: 1 x 4 ft (1.2m) straight cable, 1 x 10 ft (3m) coiled cable
  - 1 x 1/8"/1/4" (3.5mm/6mm) screwable jack adapter
