  - Impedance: 26 Ω
  - Sensitivity: 100 dB SPL / 1 mW @ 1 kHz
  - Weight: 306 g (0.67 lb)
  - Cables: 1.2 m straight; 3 m coiled
  - Adapter: 1/8"-to-1/4" (3.5 mm to 6.35 mm) screwable jack adapter
  - Includes carrying case
