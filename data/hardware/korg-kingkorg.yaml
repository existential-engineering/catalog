description: >-
  The KingKORG is a 61-key virtual analog synthesizer from Korg featuring 24-voice
  polyphony and the XMT synthesis engine with dual timbres that can be split or layered.
  It offers extensive sound design capabilities including modeled filters from classic
  synthesizers, a 16-band vocoder, and three effect modules, making it a versatile
  performance-oriented instrument.
details: |-
  The KingKORG is built around Korg's XMT synthesis engine, a successor to the MMT technology found in the MicroKorg series. Each of its two timbres provides three oscillators and one filter, and the two timbres can be split or layered across the 61-key velocity-sensitive keyboard. The oscillator section offers classic analog waveforms along with dual, unison, sync, and ring-modulated variations, plus white, pink, blue, and resonant noise sources, FM-like VPM synthesis, DWGS oscillators, and PCM samples including Mellotron, Wurlitzer, strings, and choirs.

  The filter section is a standout feature, providing 18 different filter models that emulate circuits from the Moog, Oberheim, Prophet, MS-20, and TB-303, available in low-pass, high-pass, and band-pass configurations with 12 and 24 dB/oct slopes. Cutoff sweeps are smooth and stepless via both the dedicated knob and modulation sources.

  Modulation is delivered through a Virtual Patch system that connects two LFOs and two ADSR envelope generators to a wide range of destinations. The MIDI-syncable LFOs feature triangle, sine, saw, square, sample-and-hold, and random waveforms operating up to 100Hz. An 8-step arpeggiator provides hands-off note generation.

  Effects processing includes three modules: a PRE section with ring modulation, amp modeling, and distortion; a MOD section with chorus, U-Vibe, phaser, and flanger; and a REV/DELAY section with reverbs, delay, and tape echo. A global stereo tube preamp with boost and a configurable 2-band parametric EQ round out the signal chain. The instrument also features a 16-band vocoder and CV/Gate outputs configurable for Hz/V or V/octave interfacing with modular systems.
specs: |-
  - 61 full-size velocity-sensitive keys
  - 24-voice polyphony
  - 3 oscillators per timbre, 2 timbres per program
  - 126 virtual analog and PCM oscillator types
  - 18 modeled filter types (Moog, MS-20, Oberheim, Prophet, TB-303)
  - 2 ADSR envelope generators
  - 2 LFOs with 6 waveforms (up to 100Hz)
  - Virtual Patch modulation system
  - 8-step arpeggiator
  - 16-band vocoder
  - 3 effect modules (PRE, MOD, REV/DELAY)
  - Global stereo tube preamp with boost
  - 2-band parametric EQ
  - 300 program memory
  - CV/Gate outputs (Hz/V and V/octave)
  - MIDI and USB connectivity
