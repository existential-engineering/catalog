description: Reference-grade open-back headphones featuring a 70×95 mm planar
  magnetic transducer for extremely low distortion and fast transient response,
  designed for mix engineers, musicians, podcasters, and hi-fi enthusiasts.
details: |-
  The Planar the II is Avantone Pro's reference-grade open-back headphone built
  around a 70×95 mm planar magnetic transducer using a Neodymium N50SH magnet
  structure and a 21-micron PET diaphragm. The planar driver moves air
  uniformly across its entire surface, eliminating the pistonic distortion
  common in dynamic drivers and delivering extremely fast transient response.

  The open-back acoustic design vents the rear of the ear cups to the
  environment, preventing the buildup of pressure and heat that causes listener
  fatigue. This makes the Planar the II well-suited for long mixing and
  critical listening sessions where comfort and accuracy are both essential.

  At 32Ω impedance and 104 dB/1mW sensitivity, the Planar the II can be driven
  directly from recording interfaces, laptops, and mobile devices without
  requiring a dedicated headphone amplifier. However, Avantone recommends at
  least 250mW for optimal performance, and the drivers are rated for up to 5W
  RMS continuous power.

  The headphones ship with a removable 2-meter 3.5mm cable that connects via
  dual input jacks — one on each ear cup — providing a balanced signal path
  and allowing the cable to be replaced or upgraded. A 3.5mm-to-¼-inch adapter
  and an eco-friendly carrying bag are included.

  The Planar the II is available in three colorways — black, red, and crème —
  and won a Best in Show award at a 2021 industry event.
specs: |-
  - Style: Over-ear, open-back
  - Transducer: Planar Magnetic (Neodymium N50SH)
  - Diaphragm: 21 Micron PET
  - Driver Size: 70 × 95 mm
  - Frequency Response: 30 Hz – 30 kHz
  - THD: <0.1% @ 100 dB
  - Impedance: 32 Ω
  - Sensitivity: 104 dB/1mW
  - Minimum Power: >100 mW
  - Recommended Power: >250 mW
  - Maximum Power: 5 W RMS
  - Weight: 0.51 kg (1.13 lbs)
  - Cable: 2 m, 3.5 mm, removable (dual entry)
  - Included Accessories: 3.5 mm to ¼-inch adapter, eco-friendly carrying bag
  - Available Colors: Black, Red, Crème
