description: A rack-mountable Thunderbolt audio interface built to act as the
  central hub of a studio or home setup, with 8 analog inputs and 10 analog
  outputs, 10 digital inputs and outputs in S/PDIF and ADAT Optical, and both
  word clock and MIDI I/O.
details: |-
  The TAC-8 is a rack-mountable 18-in/20-out Thunderbolt audio interface in a 1U robust metal housing, built to act as the central hub of a professional or home setup. It carries 8 analog inputs and 10 analog outputs, 10 digital inputs and outputs across S/PDIF and ADAT Optical, and both word clock and MIDI I/O, at up to 24-bit/192 kHz with near-zero latency.

  Eight combo balanced XLR/TRS analog input connectors accept mic and line level signals, with high-performance mic preamps offering up to +60 dB of amplification, an independent gain control and clip LED for each input, Hi-Z switches on Inputs 1 and 2 for an electric guitar or bass plugged in directly, and switchable +48V phantom power in two banks (Inputs 1 to 4 and Inputs 5 to 8).

  Ten balanced TRS output jacks connect to mixers, amplifiers, self-powered speakers or effects devices, split between a Main Output L/R pair and eight line outputs. Two front-panel 1/4-inch headphone outputs each have a dedicated volume control, and a large knob sets the overall output level.

  Digital I/O covers S/PDIF in and out on RCA coaxial at up to 24-bit/192 kHz, ADAT Optical in and out at 8 channels each at 44.1 and 48 kHz (4 at 88.2 and 96 kHz with S/MUX, 2 at 176.4 and 192 kHz with S/MUX4), word clock in and out with a clock source indicator, and MIDI in and out on 5-pin DIN jacks. Conversion runs 4x upsampling in both directions for reduced noise and higher fidelity, and the asynchronous transfer system is unaffected by computer jitter.

  Standalone mode lets the TAC-8 work as an 8-channel mic preamp and A/D or D/A converter with no computer connected. It is Mac only, working with Thunderbolt-equipped Macintosh computers running macOS 10.14 to 13 on Intel Macs, and is powered by the AD-19 DC12V 2A AC adapter.
specs: |-
  - 18-in/20-out Thunderbolt audio interface, 8 tracks recorded and played back simultaneously
  - Sampling frequencies: 192 / 176.4 / 96 / 88.2 / 48 / 44.1 kHz, 24-bit
  - Recording and playback channels at 44.1/48 kHz: 18 in (analog 8, S/PDIF 2, ADAT 8), 20 out (analog 10, S/PDIF 2, ADAT 8)
  - Recording and playback channels at 88.2/96 kHz: 14 in (analog 8, S/PDIF 2, ADAT 4), 16 out (analog 10, S/PDIF 2, ADAT 4)
  - Recording and playback channels at 176.4/192 kHz: 12 in (analog 8, S/PDIF 2, ADAT 2), 14 out (analog 10, S/PDIF 2, ADAT 2)
  - Inputs 1 to 8: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain 0 to 60 dB in 1 dB steps
  - Inputs 1 to 8: input impedance 5 kOhm, or 1 MOhm with IN1/IN2 Hi-Z on. Max input level +13 dBu (XLR) and +21 dBu (TRS) at 0 dBFS
  - Phantom power: +48V, switchable for Inputs 1 to 4 and Inputs 5 to 8
  - Master outputs L/R: balanced TRS jacks
  - Line outputs 1 to 8: max output level +14 dBu at 0 dBFS, output impedance 150 Ohm
  - Phones 1/2: standard stereo phone jacks, 20 mW x 2 into 32 Ohm, max output level +10 dBu, output impedance 33 Ohm
  - ADAT optical (lightpipe): 8 in/out at 44.1/48 kHz, 4 in/out at 88.2/96 kHz (S/MUX), 2 in/out at 176.4/192 kHz (S/MUX4)
  - S/PDIF: RCA coaxial, 2 in / 2 out, 44.1 to 192 kHz, up to 24-bit/192 kHz
  - Word clock: BNC in and out, 44.1 to 192 kHz, output impedance 75 Ohm, with clock source indicator
  - MIDI in/out: 5-pin DIN jacks
  - Frequency characteristics: -1.0 dB, 20 Hz to 20 kHz at 44.1 kHz. 20 Hz to 40 kHz at 96 kHz. 20 Hz to 60 kHz at 192 kHz
  - Input conversion noise: measured EIN 125 dB (IHF-A) at 60 dB gain, 150 Ohm input
  - Dynamic range: 120 dB typical (IHF-A) for both A/D and D/A
  - 4x upsampling during A/D and D/A conversion
  - Interface: Thunderbolt, power supply: AD-19 DC12V 2A AC adapter
  - Rack-mountable, 1U space, robust metal housing
  - Dimensions: 6.2 in (D) x 19 in (W) x 1.8 in (H), 157.65 x 482.6 x 46.03 mm
  - Weight (main unit only): 4.4 lb / 2.01 kg
  - Works with Thunderbolt-equipped Macintosh computers running macOS 10.14 to 13 (Intel Mac only)
