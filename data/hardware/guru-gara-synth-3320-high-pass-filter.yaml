details: |-
  3320 High Pass Filter (Voltage Controlled Filter)

  The 3320 High Pass Filter Eurorack PCB and Front Panel Kit is a DIY voltage-controlled high-pass filter designed for Eurorack modular systems. Built around the renowned CEM3320 / AS3320 VCF chip, this filter delivers precise control, musical response, and classic analog character. Key Features

  Sound & Filtering

  This 3320-based high-pass filter offers a focused and expressive filtering response, ideal for sculpting low-frequency content, adding movement to midrange material, or creating aggressive resonant effects. The resonance is finely tuned, allowing everything from gentle emphasis to intense, screaming self-oscillation for experimental and musical applications alike. DIY Build & Front Panel

  This DIY Eurorack high-pass filter PCB and front panel kit is intended for intermediate builders. The front panel is made from durable PCB material and screen printed by hand, giving the finished module a distinctive and cohesive appearance within any Eurorack system. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
