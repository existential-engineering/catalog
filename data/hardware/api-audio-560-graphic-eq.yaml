url: https://apiaudio.com/product/560-graphic-eq/
description: 10-band graphic equalizer based on the original 1969 API design,
  with proportional Q technology, API 2520 op-amp, and custom output
  transformer. Ten bands at standard octave frequencies (31 Hz–16 kHz), ±12 dB
  boost/cut per band.
details: |-
  500-series 10-band graphic EQ. Bands at: 31, 63, 125, 250, 500 Hz, 1k,
  2k, 4k, 8k, 16 kHz. ±12 dB boost/cut per band. Proportional Q (filter Q
  narrows with increasing boost/cut). Center-detented sliders. Silent bypass
  button. API 2520 op-amp with custom output transformer. 12 dB/octave filter
  slope. 15-position 0.156″ edge connector.
specs: |-
  - Filter slope: 12 dB/octave
  - Input impedance: 20 kΩ (balanced)
  - Output impedance: <85 Ω
  - Nominal levels: −15 to +15 dBu
  - Clipping level: >+28 dBu
  - Frequency response: +0/−0.25 dB (30 Hz–20 kHz)
  - Noise: −95 dBu (EQ out)
  - THD: 0.05% max @ +20 dBu
  - Power: ±12/18V DC @ 60 mA
  - Dimensions: 1.5″ × 5.25″ × 6.75″ D
