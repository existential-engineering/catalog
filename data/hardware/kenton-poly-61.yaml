description: A MIDI retrofit kit for the Korg Poly-61, adding MIDI In, Out and
  Thru sockets along with MIDI note, program change, pitchbend, mod wheel,
  filter cutoff, volume and sustain control. Built to order and intended for
  installation by an experienced synth engineer.
details: |-
  A MIDI retrofit kit for the Korg Poly-61. Once fitted, the synthesiser responds to incoming MIDI on any selectable MIDI channel, covering notes in the range of MIDI note numbers 36 to 96 with transposition possible, program changes 1 to 40, pitchbend over a fifth up and down, mod wheel, the cutoff frequency of the low pass filter, volume and sustain (decay on-off).

  The default control assignments send pitchbend from pitchbend messages, mod wheel from CC#1 and aftertouch, filter cutoff from CC#16, volume from MIDI volume (CC#7) and sustain from CC#64. Any of those destinations can be remapped to a different controller, to aftertouch or to velocity, so velocity can be set to control volume instead.

  Outgoing MIDI is limited to notes in the same 36 to 96 range, the retrofit being aimed primarily at playing the synthesiser from a MIDI master keyboard or sequencer. A push button added by the kit programs the MIDI setup, and the resulting setups are held in non-volatile EEPROM memory so they survive a power cycle.

  The kit ships as a circuit board that fits in the top panel of the Poly-61, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions covering changes to the default settings, and step by step fitting instructions with diagrams of the connection points. Every kit is checked and tested before despatch.

  Installation is a skilled job. The kit is not intended for end-user fitting and should be installed by a competent synth service engineer, or fitted at the manufacturer's premises in Tadworth, just outside London. Kits are built to order.
specs: |-
  - Fits the Korg Poly-61
  - Incoming MIDI note range: MIDI note numbers 36 to 96, transpose possible
  - Incoming program change numbers 1 to 40
  - Pitchbend range: a fifth up and down
  - Default controller map: pitchbend messages, mod wheel CC#1 plus aftertouch, filter cutoff CC#16, volume CC#7, sustain CC#64
  - Any controller, aftertouch or velocity can be remapped to any supported destination
  - Outgoing MIDI: notes only, MIDI note numbers 36 to 96
  - Setups stored in non-volatile EEPROM memory
  - Adds a push button for programming the MIDI setup
  - Powered from the host synthesiser, no separate power connection
