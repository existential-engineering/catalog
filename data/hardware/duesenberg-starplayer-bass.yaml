description: "The low-end legend of the Starplayer TV family. Meet the
  Starplayer Bass: a short-scale semi-hollow powerhouse packed with
  personality."
details: |-
  The Starplayer Bass is a short-scale semi-hollow bass built on the design of Duesenberg's Starplayer TV. It is described as delivering a rich, full-bodied tone with deep lows and a warm, resonant foundation, suited to both vintage-leaning and modern rhythm playing.

  Construction is semi-hollow with a solid sustain block, bent sides and an f-hole. The arched top is laminated spruce, with back and sides in laminated flamed maple, body dimensions of 46 x 34 cm and sides 4.5 cm deep. Duesenberg states that its semi-hollow construction gives an open response unlike a solid body while blocking most feedback even at high gain levels.

  The neck is a set neck in one-piece American hard rock maple with a medium D profile, topped by an Indian rosewood fingerboard of 305 mm (12") radius carrying 22 jumbo frets and cream dot inlays. Scale length is 768 mm (30.2"), and the fretboard is Plek processed, which Duesenberg describes as the basis for its multi-step hand fret polishing and setup work.

  Electronics consist of two Duesenberg BassBucker pickups, wired to separate volume controls for each pickup plus a master tone dial, so the two pickups can be blended. A discreet on/off slide switch on the pickguard acts as a kill switch, muting the instrument instantly while preserving the pickup blend setting.

  Hardware is nickel finished on every finish except Black Velvet, which Duesenberg pairs with gold hardware, and includes Duesenberg Z-Tuners, a Duesenberg Bass Bridge, a Duesenberg Trapeze Tailpiece and Duesenberg Multi-Lock strap pins, with the maker's geometric three-step motif carried through parts from the headstock curves to the output jack shape. Duesenberg notes that nickel takes on a warm sheen and ages naturally unless cleaned regularly. The instrument ships with the Duesenberg Custom Line Case and all required allen keys as standard.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 41 mm / 1.6" (nut), 53.5 mm / 2.11" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 768 mm / 30.2"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated Spruce
  - Back, sides: Laminated flamed Maple
  - Body dimensions: 46 x 34 cm / 18.11" x 13.39"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream
  - Pickguard: Aged White
  - Finish: PUR lacquer. Back and sides Trans-Black.
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Bass Bridge
  - Tailpiece: Duesenberg Trapeze Tailpiece
  - Strap pins: Duesenberg Multi-Lock
  - Hardware color: Nickel (gold on Black Velvet)
  - Strings: Duesenberg Custom 050/110 (050-070-085-110)
  - Pickup (neck): Duesenberg BassBucker
  - Pickup (bridge): Duesenberg BassBucker
  - Wiring: 2 Volume, 1 Tone, on/off Slide Switch
  - Special model (Outlaw): Skai-leather on top and headstock, nickel pickguard
  - Special model (Ice-Pearl): Pearl mosaic on top and headstock, nickel pickguard
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
