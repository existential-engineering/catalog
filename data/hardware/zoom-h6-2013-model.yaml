description: Six interchangeable input capsules make the ZOOM H6 a recorder for
  film, video, podcast and music, with six-track simultaneous recording and four
  mic/line inputs on XLR/TRS combo connectors.
details: |-
  Six interchangeable input capsules make the ZOOM H6 a recorder for film, video, podcast and music, and its preamps carry the sound. The H6 records six tracks simultaneously and ships with the XYH-6 X/Y capsule fitted.

  Four mic/line inputs sit on XLR/TRS combo connectors, each with its own gain control knob and -20 dB pad, and phantom power at +12V, +24V or +48V can be switched independently per input. The supplied XYH-6 capsule adds a secondary input through a stereo 1/8-inch Mic/Line In mini phone jack with 2.5V plug-in power, and the capsule bay also accepts the MSH-6 MS capsule and other Zoom capsules.

  Recording goes directly to SD, SDHC and SDXC cards up to 128GB at up to 24-bit/96 kHz in BWF-compliant WAV or a variety of MP3 formats, with up to eight simultaneous WAV tracks (L/R, inputs 1 to 4, and an L/R backup track recorded 12 dB below the set input gain). Auto-record, pre-record and backup-record cover takes that start before the transport does.

  Onboard effects include low-cut filtering, compression and limiting, and a 2.0-inch full-color angled LCD at 320 x 240 pixels carries the metering and menus.

  Over USB the H6 works as a multichannel or stereo audio interface for PC, Mac and iPad, with 6 inputs and 2 outputs at 44.1, 48 or 96 kHz and 16 or 24 bit. It runs on four AA alkaline or NiMH rechargeable batteries for over 20 hours of continuous recording, on USB bus power, or from the optional AD-17 USB-type AC adapter.
specs: |-
  - Recording media: SD card 16MB to 2GB, SDHC card 4GB to 32GB, SDXC card 64GB to 128GB
  - WAV: 44.1/48/96 kHz, 16/24 bit, mono or stereo, BWF-compliant, up to 8 simultaneous tracks (L/R + inputs 1 to 4 + L/R backup)
  - MP3: 44.1 kHz, 48 to 320 kbps, up to 2 simultaneous tracks
  - Inputs 1 to 4: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain -inf to 55.5 dB with pad off and -inf to 35.5 dB with pad on
  - Inputs 1 to 4: input impedance 1.8 kOhm or more, max input level +22 dBu (pad on), EIN -120 dBu or less
  - Phantom power: +12V / +24V / +48V, switchable independently for inputs 1 to 4
  - XYH-6 X/Y mic: unidirectional, sensitivity -41 dB at 1 kHz/1 Pa, input gain -inf to 46.5 dB, max SPL 136 dB
  - XYH-6 Mic/Line In: 1/8-inch stereo mini jack, input level -inf to 46.5 dB, 2 kOhm, 2.5V plug-in power supported
  - MSH-6 MS mic: unidirectional and bi-directional, sensitivity -37 dB and -39 dB at 1 kHz/1 Pa, input gain -inf to 42.5 dB, max SPL 120 dB and 122 dB
  - Line out: 1/8-inch stereo mini jack, rated output level -10 dBu into 10 kOhm or more
  - Phone out: 1/8-inch stereo mini jack, 20 mW + 20 mW into 32 Ohm
  - Built-in speaker: 400 mW, 8 Ohm, mono
  - Display: 2.0-inch full color LCD, 320 x 240 pixels
  - USB: USB 2.0 High Speed, mass storage class and audio interface operation, 6 in / 2 out at 44.1/48/96 kHz and 16/24 bit, USB bus powered operation possible
  - Power: 4 x AA (LR6) alkaline or NiMH batteries, USB bus power, or optional AD-17 AC adapter (DC 5V/1A, USB type)
  - Battery life: over 20 hours of continuous recording on alkaline batteries
  - Dimensions and weight: H6 77.8 (W) x 152.8 (D) x 47.8 (H) mm, 280 g. XYH-6 78.9 x 60.2 x 45.2 mm, 130 g. MSH-6 58.0 x 67.6 x 42.1 mm, 85 g
