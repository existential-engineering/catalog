details: |-
  16 track dynamic sequencer

  Unlock limitless creativity with the SQUID™ multitrack sequencer. Part of our TORAIZ™ series of musical instruments and production equipment, this inspiration tool will be the heartbeat of your studio and live setups. The SQUID will control your workflow and give you the chance to develop new styles of music as you create unique sequence patterns and phrases at the touch of a button. Connect, sync and simultaneously control up to 16 instruments via its multiple input/outputs. The terminals are compatible with various equipment, from your DAW and hardware instruments to modular synths, vintage synthesizers and drum machines. Perfect for on-the-fly music production, the layout and controls are effortless to navigate so your ideas will come to life the moment inspiration strikes. This production tool enables you to randomize sounds, sequences, and drums – all in key. Access endless polyrhythmic-looping options and instantly change the playback direction and speeds. With the world-first* Groove Bend feature, you’ll really feel the groove as you generate original rhythms in real time. And by controlling everything in one place, you can focus on developing phrases. * First slider-operated trigger timing feature in the music production category (according to research conducted by Pioneer DJ Corporation, as of April 18, 2019). Dive deep into the SQUID’s vast creative potential with our tutorial series More
