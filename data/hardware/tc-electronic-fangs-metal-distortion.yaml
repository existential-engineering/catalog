description: Ultra-Thick, High Gain Distortion with Super Tight Response
details: |-
  Tap into a world of high-gain decadence as FANGS METAL DISTORTION and its super-versatile set of tone tools sculpts your sonic onslaught to perfection. From ultra-tight thrash tones to thick walls of doom metal distortion, you’ll find it all here and then some in a highly affordable pedal that’s ready for battle!

  Let’s be honest, you’re not here for a nice transparent overdrive or a bluesy crunch box. If you are, you must have taken a wrong turn at our competitors’ stompboxes on aisle 14. You’re here for the gain, all the gain and nothing but the gain. FANGS METAL DISTORTION delivers it all in spades. Whether you’re looking for tight and raunchy rhythm tones or searing solo sounds, FANGS METAL DISTORTION’s ultra-tight, bone-crushing gain structure makes you the master of all you survey!

  When it comes to mastering metal guitar tones, the mid frequencies are where it all happens. That’s why FANGS METAL DISTORTION features a versatile mid-frequency selector switch in addition to the typical Bass and Treble controls. This handy little control lets you go from raw classic metal tones to scooped nu-metal – and all the way to super-beefy sludge metal tones, with just the flick of a switch.

  FANGS METAL DISTORTION is a ferocious tone monster, but we’ve managed to contain all that sonic brutality in a compact enclosure that’s built like a tank. A sturdy metal chassis with dedicated Input, Output and True Bypass means that FANGS METAL DISTORTION is equally roadworthy and pedalboard friendly. You can power it with a 9V battery, or use our convenient POWERPLUG 9V adapter.

  Capable of all the high-gain you and your audience can handle, FANGS METAL DISTORTION sports an easy-to-use control layout including: Gain, to control the amount of drive; Volume, controls the output level; Bass, for setting the amount of bottom-end; Treble, for the perfect amount of highs; and a 3-position midrange selector (Raw/Fat/Scoop) for the ultimate in definition. Nothing is easier!Check out FANGS METAL DISTORTION at your local TC ELECTRONIC dealer today, or get yours online – and turn your tone up to eleven!
