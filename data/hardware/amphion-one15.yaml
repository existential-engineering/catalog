  - Impedance: 8 Ω
  - Sensitivity: 84 dB @ 2.83V/1m
  - Frequency Response: 49–20,000 Hz ±3dB
  - Power Recommendation: 50–200 W
  - Dimensions (H×W×D): 316×160×265 mm
  - Weight: 7 kg (15.4 lbs)
