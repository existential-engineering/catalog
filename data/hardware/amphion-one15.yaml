details: |-
  The One15 is a two-way passive radiator nearfield studio monitor featuring a 1" titanium tweeter and a 5¼" aluminum woofer with a crossover point at 1600 Hz. The passive radiator design avoids typical reflex port coloration, delivering natural and even bass loading without the distortion common in ported enclosures.

  Amphion's DSP-free acoustic design philosophy minimizes electrical interference, preserving maximum signal processing potential. The point-source sound approach and low crossover point enable a coherent phase response, while time-aligned drivers via a waveguide align the tweeter and woofer voice coils for improved transient timing.

  The One15 offers pinpoint imaging with precise spatial reproduction across width, height, and depth. It delivers consistent performance at low listening volumes and in challenging acoustic environments, making it suitable for a wide range of studio settings.

  With a sensitivity of 84 dB at 2.83V/1m and a recommended amplifier power range of 50–200 W, the One15 is a passive monitor requiring a separate power amplifier. Frequency response extends from 49 Hz to 20,000 Hz ±3dB.

  Each unit is handmade in Finland and weighs 7 kg. Dimensions are 316×160×265 mm.
specs: |-
