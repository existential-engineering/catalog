description: Brauner's flagship large-diaphragm tube microphone, delivering a
  natural and transparent sound with infinitely variable polar patterns. The
  archetype from which all Brauner microphones are developed.
details: |-
  The VM1 was the fulfillment of Dirk Brauner's dream to build his vision of the perfect
  sounding tube microphone. A microphone that captures the spirit of the classic vintage tube
  microphones and at the same time, meets the high technical standards of today's modern
  microphones. The VM1 was awarded the SSAIR Award in 1998, marking the beginning of a
  tradition of excellence in design philosophy, engineering and precision.

  In our humble opinion, no other microphone has played a greater role in the renaissance of
  the tube microphone. As the archetype of all Brauner microphones it continues to serve as
  the inspiration for all Brauner products. The VM1 has a completely natural, modern sound
  with the highest resolution of sonic detail. Its transparent open character is predestined
  for vocal and instrumental recordings and is the first choice microphone of top artists and
  sound engineers all over the world.

  The power supply of the VM1 allows infinite adjustments of the directional characteristics
  as well as a 10 dB reduction through a switchable attenuator.
specs: |-
  - Equivalent Noise: < 11 dB A (IEC651)
  - Signal to Noise: > 83 dB (1 Pa/1 kHz-Cardioid)
  - Sensitivity: 28 mV / Pa-Cardioid
  - Pattern: all, infinitely variable
  - Frequency Range: 18 Hz - 24 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 115 V or 230 V
