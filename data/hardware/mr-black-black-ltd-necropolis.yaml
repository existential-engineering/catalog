name: Black LTD. Necropolis
manufacturer: mr-black
primaryCategory: pedal
categories:
  - reverb
url: https://www.mrblackpedals.com/products/black-ltd-necropolis
description: An ethereal reverb whose unique Decline control slows and bends the
  reverb tails, stretching them into a descending sonic pad.
details: |-
  The Black LTD. Necropolis is an ethereal reverberator unlike anything before
  it. Two familiar controls deliver a wide range of reverb, from airy and light
  to deep and vast, but the pedal's real allure is its unique Decline control.

  At its minimum setting, Decline is removed from the circuit entirely, leaving
  a powerful, lush reverb engine capable of 100% wet mixes and a long tail. As
  Decline increases, the reverb begins a gradual descent into a subterranean
  realm: the tails appear to slow down as they stretch and bend within the time
  domain, burrowing into a deep, luscious sonic pad that continues to descend
  while opening space above for fresh, incoming sounds.

  Truly surreal and unique, the Necropolis is designed to provoke, captivate,
  and inspire. It is a Jack Deville original design.
specs: |-
  - Ethereal reverb with airy-to-vast range
  - Unique Decline control that slows and bends reverb tails
  - 100% wet mix capable with long tail
  - Creates a descending sonic pad while leaving space for incoming sounds
