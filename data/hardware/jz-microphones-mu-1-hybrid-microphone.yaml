description: World's first ribbon and large-diaphragm condenser hybrid
  microphone, designed by Marc Urselli.
details: |-
  The MU-1 combines a ribbon capsule and a JZ Golden Drop condenser capsule in a single, phase-aligned and level-matched hybrid design, with a patent-pending capsule architecture and independent dual outputs.

  The condenser side is a cardioid capsule with a 20 Hz - 20 kHz frequency response and 134.5 dB max SPL, while the ribbon side offers a figure-8 pattern with a 35 Hz - 15 kHz frequency response and a toroidal transformer with a 1:28 turns ratio.

  Handcrafted in Latvia and backed by a 5-year warranty.
specs: |-
  - Combines a ribbon and JZ Golden Drop condenser capsule
  - Phase-aligned and level-matched
  - Independent dual outputs via 5-pin XLR split
  - Patent-pending hybrid capsule architecture
  - Condenser: cardioid pattern, 20 Hz - 20 kHz, max SPL 134.5 dB, sensitivity 21 mV/Pa at 1 kHz, self-noise 6.5 dB-A, output impedance 50 Ohm
  - Ribbon: figure-8 pattern, 35 Hz - 15 kHz, max SPL 125 dB, output impedance 250 Ohm, toroidal transformer (1:28 turns ratio)
  - Phantom power: +48V DC
  - Dimensions: 176.5 x 38 x 77 mm
  - Weight: 1290 g
  - Handcrafted in Latvia
  - 5-Year Warranty
