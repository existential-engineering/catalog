name: BASS 12
manufacturer: hedd
primaryCategory: subwoofer
url: https://hedd.audio/products/bass-12
description: A powerhouse 12-inch DSP subwoofer for professional recording
  studios and immersive audio installations, delivering huge, fully controlled
  low end.
details: |-
  The BASS 12 is a high-end subwoofer engineered for professional recording studios and immersive audio installations, delivering a huge sound with a set of unrivaled features that allow full control of its impact in a setup. It is designed to complement HEDD's range of 3-way monitors.

  Its core strength is comprehensive spatial control. A 32-bit SHARC DSP processor enables precise tuning to individual acoustic environments, and the dedicated HEDD CTRL software unifies the subwoofer with MK2 monitors into a transparent, controllable ecosystem. Users interact directly with the Lineariser zero-phase filter, EQ, delay, and CoP (Closed or Ported) controls for real-time system refinement.

  Group Delay Compensation removes typical subwoofer integration problems such as smeariness and disorientation by achieving phase linearity across the complete system. The unit supports complete linear-phase satellite-subwoofer setups and includes a Satellite OFFSET control for positioning compensation.
specs: |-
  - Main features: Lineariser, CoP, Group Delay Compensation, LFE mode, variable phase, crossover filters
  - DSP: custom 96 kHz / 32-bit AD/DA converter
  - Driver: 12-inch woofer with 2.5-inch voice coil
  - Amplification: 700 W ICEpower (85-264 V)
  - Frequency range: 20 Hz to 200 Hz (LFE mode: 16 Hz to 200 Hz)
  - Maximum SPL: 115 dB at 1 meter
  - Dimensions: 595 x 380 x 610 mm
  - Weight: 32.1 kg
  - Inputs: analog XLR (22 kOhm) and digital 2-channel AES (XLR)
  - Outputs: filtered analog XLR (22 kOhm) and digital AES pass-through
  - Power: universal 85-264 V (IEC connector)
  - Warranty: 5 years (after registration)
