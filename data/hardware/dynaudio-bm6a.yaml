url: https://dynaudio.com/professional-audio/classic-bm-range/bm6a
description: The Dynaudio BM6A monitors deliver neutral and uncolored sounds
  when mixing, due to our unique driver technology.
details: |-
  The Dynaudio nearfield experience. The BM6A features an electronic 4th order phase-aligned crossover with a crossover point at 2.2kHz, which feeds two high performance discrete MOSFET amplifiers rated at 100W each.

  A low-frequency equalizer allows the response to be tuned to suit the listening environment, while built-in protection circuitry prevents driver damage at extreme drive levels.

  The elegant matte cabinet has radius-edged front baffle construction to reduce boundary effects and improve the overall sound quality of the rear-loaded bass reflex enclosure.
specs: |-
  - Type: Nearfield Monitor
  - Box principle: Rear-loaded bass reflex
  - Crossover type: 2-way
  - Crossover frequency: 2200 Hz
  - Tweeter: 1.1" soft dome
  - Woofer: 6.5" MSP
  - Amplifier power (woofer): 100W
  - Amplifier power (tweeter): 100W
  - Maximum SPL (1m, pair): 118 dB
  - Lower cutoff (-3dB @ 85dB): 41 Hz
  - Upper cutoff (-3dB @ 85dB): 21 kHz
  - AC power input: 100-240V 50/60Hz
  - Max power consumption: 200W
  - Weight: 11 kg (24.25 lbs)
  - Dimensions (W x H x D): 217 x 338 x 321 mm (8.5" x 13.25" x 12.625")
