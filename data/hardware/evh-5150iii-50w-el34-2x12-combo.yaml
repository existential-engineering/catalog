details: |-
  The EVH® 5150III® 50W EL34 2x12 Combo delivers signature harmonic overtones with improved dynamic compression and saturation that evoke a more modern 'British' sound, all with the sustain and versatility expected from an amp bearing Eddie Van Halen's name. Designed with flexible and independent dual-concentric controls that allow for gain and volume level matching, this 50-watt tube combo amp boasts three channels for any playing style - sparkly cleans, tight crunch or soulful leads. Delivering a full-spectrum of tone, channel one features pristine cleans and compressed tone, channel two kicks in with overdrive and heavy gain and channel three oozes with liquid distortion. Channels one and two each have dual concentric gain/volume controls, with shared EQ (low, mid, high). Channel three has its own gain, volume and EQ (low, mid, high) controls. All three channels also have global presence, resonance and reverb controls. Loaded with two 12" custom special designed EVH Celestion® speaker to enhance sound and style, this combo amp also has seven JJ ECC83 (12AX7) preamp tubes, two JJ EL34 power tubes and front-panel adjustable power output from 50 watts down to one watt. Other features include an ultra-high-gain preamp design custom voiced for maximum output, single instrument input, rear-panel selectable output impedance (4, 8 or 16 ohms) with a pair of parallel speaker outputs, rear-panel MIDI input and preamp output, rear-panel effects loop and headphone jack (mutes power amp), and a four-button footswitch that controls all three channels and reverb for easy onstage switching. The cabinet is constructed out of birch with special internal baffling for tight and increased bass response. Sporting a slick black and gold motif on the control panel, this combo is finished off with black vintage-style chicken knobs, red LED jewel indicator, molded black plastic top handle and pop-out casters. A high-quality fitted cover is available as an EVH Accessory.
