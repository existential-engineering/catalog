details: |-
  - LIMITED EDITION - Silver Bee OD Limited BJFE Style Wave

  From the tonal palette of the analog effects master Bjorn Juhl (BJF/BJFe), the Silver Bee takes players for a fresh spin around the low-gain overdrive race track. Drawing from his very sought-after Honey Bee OD design, Juhl conceived the Silver Bee to excel at capturing that "on the edge" sound, with shimmering treble just on the brink of distortion, reminiscent of classic American "silvery" combo amps. Where the Honey Bee has a very prominent mid focus and a rich, syrupy haze of low-gain goodness, its new silver sibling has a tighter, more modern overall sound, flying along with sparkling highs, razor sharp edges, and sweet, subtly-distorted amp-like tones. Like the Honey Bee, Silver Bee offers hugely dynamic breakup, with the amount of overdrive highly controllable by the player's hand. Featuring Volume and Drive controls, as well as as a highly controllable 2-band EQ via Treble and Bass controls, Silver Bee caters to players who appreciate the rawness and shimmering presence of a tube amp on the brink of full breakup, and those who enjoy using various preamp and distortion-style boxes to stack their pedals. Whether you use it to kick your main drive pedal into full-on solo mode by adding just a touch of gain and high-end shimmer, or pummel the front end of this Bee with your own favorite preamp or overdrive to send it buzzing into an otherworldly overdrive of your own, or simply employ it as an "always on" pedal, the Silver Bee brings a new sting your tone. ●Controls Volume: Adjusts overall signal volume. Drive: Adjusts the intensity of overdrive. Bass: Adjusts the low/mid frequencies of the output signal. Treble: Adjusts the high frequencies of the output signal. ●Specifications Input impedance: 270 K Output impedance: 25K Drive voltage: 9V DC, center negative Current Consumption: 3.6 mA Size: 31 (W) x 113 (D) x 61 (H) mm (excluding knobs) Weight: 295g True-Bypass Switching High Quality Aluminum Enclosure

