details: |-
  Over the years, the Lowden 32 has become highly sought after for its full-bodied yet clear and defined tone. The Sitka spruce top beautifully balances the warmth and fullness of the rosewood, creating a rich, dynamic sound. In the 'O' version, it offers a warm, full, and clear voice, while the 'F' provides the same tonal richness with a more focused projection, making it perfect for flat-picking and fingerstyle playing. The 'S' version has been a pleasant surprise, delivering a large-body sound in a compact concert-sized instrument, offering impressive depth and resonance despite its smaller size. The Original Series carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices.
specs: |-
  - East Indian Rosewood back and sides
  - Sitka Spruce top
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Available in O, F, S and WL body shapes
  - Hardshell case included
