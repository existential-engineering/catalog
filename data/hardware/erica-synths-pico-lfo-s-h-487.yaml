url: https://www.ericasynths.lv/pico-lfo-s-h-487/
description: Pico LFO/S&H is full analogue modulations source – LFO and Sample
  and Hold – to provide some controlled randomness to your modular setup.
details: |-
  Pico LFO/S&H is a full analogue modulation source, an LFO alongside a sample and hold circuit, for bringing controlled randomness to a modular setup.

  The LFO offers triangle and square wave outputs over a frequency range of 0.4Hz to 20Hz, with an output amplitude of -5V to +5V. The sample and hold section is built around the AS1100CK2 IC for a highly stable held voltage.

  The module is 3HP wide and 35mm deep, with input and output protection against overvoltage and protection against a reversed PSU connection.
specs: |-
  - Full analogue circuit
  - LFO with triangle and square wave outputs
  - Highly stable S&H circuit based on AS1100CK2 IC
  - Input and output protection against overvoltage
  - Protection against reverse PSU connection
  - Output amplitude -5V to +5V
  - LFO frequency range 0.4Hz to 20Hz
  - Power consumption +13mA, -10mA
  - Module width 3HP
  - Module depth 35mm
