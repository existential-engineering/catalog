description: >-
  Novation's flagship virtual analog synthesizer offering up to 20 voices of polyphony with three
  oscillators per voice, multimode filters, and an impressive seven effects per voice for a total
  of 56 simultaneous effects, housed in a distinctive blue rackmount enclosure.
details: |-
  The SuperNova built upon the foundation laid by Novation's popular Bass Station, scaling up to a fully polyphonic architecture that could convincingly emulate classic analog synthesizers including the Minimoog, Jupiter 8, Juno 106, and ARP 2600. Its three oscillators per voice employed sound modeling techniques to recreate classic analog waveforms with digital precision and reliability.

  One of the SuperNova's most distinctive features was its effects architecture, providing seven programmable effects per voice for a total of 56 simultaneous effects across all voices. This meant every patch could have its own dedicated effects chain without sharing resources with other voices, a luxury that few competing synthesizers could match at the time.

  The filter section was equally impressive, offering high-pass, low-pass, and band-pass modes at 12, 18, and 24 dB/octave slopes with resonance capable of self-oscillation, overdrive, and keyboard tracking. Two flexible LFO sections and two ring modulators expanded the modulation possibilities, while eight dedicated audio outputs and full MIDI parameter control made it a powerful studio tool.

  Initially released as a 3U blue rackmount unit with 16 voices (later expandable to 20 via OS update), the SuperNova was also offered as a 61-note keyboard version that doubled the polyphony to 32 voices and expanded memory to 1,024 patches. Produced from 1998 to 2000, it established Novation as a serious contender in the virtual analog synthesizer market and paved the way for the SuperNova II.
specs: |-
  - Polyphony: 20 voices (expandable to 32 with expansion card)
  - Oscillators: 3 per voice (square, sawtooth, variable pulse) plus noise
  - LFOs: 2 (saw, square, triangle, sample & hold)
  - Filter: Hi/low/band pass, 12/18/24 dB/oct, resonant, self-oscillating with overdrive
  - Effects: 56 programmable (7 per voice)
  - Memory: 512 patches (expandable to 1,024), 256 performances
  - Multitimbral: 8 parts
  - Audio Outputs: 8
  - Keyboard (keyboard version): 61 keys with velocity and aftertouch
  - MIDI: Full parameter control
