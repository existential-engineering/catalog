details: |-
  Combining the snap and sustain of a bolt-on guitar with the airy resonance of a semi-hollow body, the CE 24 Semi-Hollow is a truly unique instrument in the PRS Bolt-On lineup. The body pairs the traditional combination of a mahogany back and maple top with a bolt-on maple neck and rosewood fretboard. The neck features a Pattern Thin carve and satin nitro finish for a natural, addictive feel.

  The CE 24 Semi-Hollow boasts PRS 85/15 pickups, which were designed to have clarity across their extended high- and low-end frequencies. The electronics consist of a volume and push/pull tone control with a 3-way toggle switch, giving a total of six classic sounds from the PRS 85/15 pickups.

  The PRS CE 24 Semi-Hollow now comes with PRS Phase III tuners, featuring a handsome open-back design, unplated brass shafts, and highly-usable gear ratio.

  The original CE was introduced in 1988, offering players traditional PRS design and quality with the added snap and sparkle of a bolt-on guitar.
