description: "- Keeley Magnetic Tape Echo - 40-600ms of Delay with Modulation -
  Custom Shop Synth-Inspired Edition"
details: |-
  The Maag Echo Custom Shop Edition is a synth-inspired version of the Keeley Magnetic Echo, built as an initial run of ten units with wood side panels that are CNC cut and hand stained in house.

  The Mag-Echo circuit simulates tube tape echo sounds by combining a delay circuit with a small amount of modulation. Tape echoes have long been regarded as a warm and guitar-friendly form of delay, and this pedal aims at similar results through a touch of lo-fi delay, a slightly filtered echo response that keeps the repeats warm, and modulation.

  Modulation, or wow and flutter in the tape world, is the slight pitch shift or wavering that occurs as tape is pulled across the heads. The modulation used here is similar to the one in the Keeley Seafoam Chorus, a slight wavering of pitch on the trails of the repeats. The delay side is set with Time, Regen and Level, and the wow and flutter side with Depth and Rate. Keeley Electronics began developing the circuit in 2005 before setting it aside for other projects and returning to it later.
specs: |-
  - Delay Time: roughly 40ms to 600ms between repeats, suited to slapback and medium delay times
  - Regen: sets the number of repeats, from a single slapback to runaway self-oscillation
  - Delay Level: mix control for how loud the echoes are
  - Depth: amount of chorusing and pitch shifting on the echoes, with an LED indicating the amount of modulation applied
  - Rate: flutter rate of the pitch modulation on the repeats
  - Wood side panels, CNC cut and hand stained
  - Initial run limited to 10 units
