name: AAA - Perfect 10 40w
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/aaa-perfect-10-40w
description: A 40-watt bass practice combo in the AAA (All Access) range,
  driving a custom 10" Ashdown speaker. It offers a 3-band EQ, Hi and Low
  inputs, a Drive control, an XLR DI, a headphone output, an auxiliary input
  with mix control, and an AppTek socket for iOS amp-sim integration.
details: |-
  40-watt AAA (All Access) bass practice combo with a custom 10" Ashdown speaker. Hi and Low inputs, a 3-band EQ and a Drive control. XLR DI output, headphone output, and an auxiliary input with mix control. AppTek socket connects a smartphone or tablet for amp-sim and FX apps, including Ashdown's ABM Pre App (Sub Harmonics, Tube Drive, Compression, 7-band EQ) via Agile Partners Amp Kit.
specs: |-
  - Power output: 40 watts
  - Speaker configuration: 1 x 10" custom Ashdown
  - EQ: Bass, Middle and Treble
  - Hi and Low inputs
  - Drive control
  - XLR DI output
  - Headphone output
  - Auxiliary input with mix control
  - AppTek socket (iOS amp-sim integration)
  - H x W x D: 505 x 444 x 500 mm
