description: >-
  A compact semi-modular analog synthesizer from Sonicsmith featuring a single VCO with square and
  triangle waveforms, a dedicated LFO, two VCAs, and patch points for integration with other
  analog gear, powered by a standard 9V DC supply.
details: |-
  The Sonicsmith Modular A1 is a minimalist semi-modular analog synthesizer designed as a companion piece to enhance existing analog setups rather than function as a standalone instrument. Its stripped-down architecture focuses on providing a single high-quality voice with enough patching flexibility to serve as a useful building block in a larger modular or semi-modular system.

  The front panel is organized into three color-coded sections for intuitive operation. The left section handles VCO control with frequency and fine-tune knobs plus a waveform toggle between square and triangle outputs. The right section manages the LFO with amount and rate adjustments and a dedicated output. The central VCA section includes CV input and a switch for routing the LFO to VCO pitch modulation, providing basic but functional modulation routing without patch cables.

  Both the VCO and LFO are capable of synchronization, and the dual VCA design provides independent amplitude control for each oscillator. Audio output is available through both a standard line-level jack and a 9V mini-jack, accommodating different connection scenarios. The entire unit runs from a standard guitar-style 9V DC power supply, making it easy to power alongside pedalboard setups.

  Sonicsmith positioned the Modular A1 as "a perfect accompaniment" to other gear, and its compact form factor and simple interface reflect that philosophy. While it lacks the depth of a full synthesizer voice, its combination of analog oscillator, LFO, and patch points makes it a useful utility module for adding analog character to digital setups or extending the capabilities of existing analog instruments.
specs: |-
  - Polyphony: 1 voice
  - Oscillators: 1 VCO (square, triangle)
  - LFO: 1 (square, triangle)
  - VCAs: 2
  - Outputs: Line-level jack, 9V mini-jack
  - Power: 9V DC (guitar pedal style)
  - Sync: VCO and LFO sync-able
  - CV input for VCA control
