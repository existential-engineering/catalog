details: |-
  The M3 MkII is a 3-way active/passive hybrid main monitor designed for continuous high-power operation in demanding listening environments, intended as an all-purpose monitor for small to medium-sized music studios and film dubbing theatres. It is the result of a painstaking research and development process aimed at elevating main monitors.

  A pair of 300mm low-frequency MSP (Magnesium Silicate Polymer) drive units are complemented by two 150mm midrange units, with high frequencies handled by a high-power Esotar3 dome tweeter — the same tweeter found in Dynaudio's award-winning home and theatre systems. The result is an exceptionally clean, dynamic and powerful speaker in which cone break-up, thermal compression and phase misalignment have been eliminated; frequency response is full and flat.

  The system employs a hybrid crossover design that combines active and passive filtering. Each channel of the monitor signal is supplied to the inputs of an external amplifier, where it is split into one low-frequency feed and one midrange/high-frequency feed to drive two amplifier channels per speaker; a passive crossover inside the loudspeaker cabinet then divides the midrange/high-frequency feed between the mid units and the tweeter.

  External electronic components for the M3 MkII typically comprise Dynaudio Acoustics DA40-DSP power amplifiers with built-in DSP, or a pair of Dynaudio Acoustics DCA800/1400 amplifiers with built-in crossovers. An external crossover device such as the XTA DP448 may also be used. The rear connector panel exposes two pairs of gold screw-down speaker terminals (LF and MF/HF) for bi-amp connection from the amplifier's speakON outputs.

  For surround monitoring applications, the M3 MkII is typically complemented by a sub-bass loudspeaker system along with surround speakers as needed. Dynaudio Acoustics recommends that final setup and alignment be carried out by a qualified engineer with extensive expertise in acoustics and the appropriate test equipment.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Music and post-production
  - Type: 3-way hybrid
  - Frequency response: 35Hz – 20kHz
  - Maximum SPL at 2 metres: 123dB stereo
  - Crossover frequencies: 400Hz and 3900Hz
  - Total harmonic distortion: 1% at 90dB
  - Recommended amplifier power: Two channels: 500-1000W/channel per speaker
  - High frequency driver: Esotar3
  - Midrange: 2x 15cm MSP
  - Low frequency driver: 2x 30cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA40 DSP, DCA800 (with filters)
  - Cabinet dimensions (H x W x D): 775 x 555 x 505mm
  - Weight: 65 kg
  - Finish: Black textured paint
  - Optional cabinet finishes: Oak, cherry, walnut, maple
  - Custom cabinet sizes: On request
