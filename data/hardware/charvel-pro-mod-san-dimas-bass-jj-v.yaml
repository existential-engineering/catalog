description: For the seasoned player who defies the status quo and demands more
  from a high-performance hot rod bass, the Charvel Pro-Mod San Dimas Bass JJ V
  combines modern appointments with throwback Charvel DNA in a 5-string platform
  built for versatility and aggressive tone shaping.
details: |-
  The Pro-Mod San Dimas Bass JJ V pairs an alder San Dimas-shaped body in a gloss finish with a bolt-on caramelized maple Speed Neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and rolled fingerboard edges for a broken-in feel.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 20 jumbo frets, cream dot inlays, and Luminlay side dots, all anchored by a 1.75" Graph Tech TUSQ XL nut and a 34" scale length.

  Electronics center on a JJ configuration with DiMarzio Area J DP550 (neck) and DP551 (bridge) pickups in cream covers, routed through a master volume with push/pull active/passive selector, a pickup blend control, and a 3-band active EQ (bass, middle, treble) for wide tonal reach.

  Hardware includes a Charvel HiMass bridge, Charvel open-gear tuning machines, a gold finish throughout, oversized strap buttons, and a heel-mount truss rod adjustment wheel. A licensed Fender Precision Bass headstock and bolt-on construction complete this modern high-performance 5-string platform.
