description: The Fireball 100 E635 is a 100-watt, two-channel, all-valve
  high-gain guitar amplifier head with a valve-buffered FX loop, a noise gate,
  Master A/B and a 6L6GC power section.
details: |-
  The Fireball is a hot amp and the name says it all. Even on the Clean channel, shimmering crunch tones arrive once the gain control passes 12 o'clock. On the Lead channel the gain flourishes and reaches its full potential, so the amp is ready for any kind of metal playing however heavy, with no need for external distortion pedals.

  The Mid Boost keeps the heavier sounds pumping, while the 6L6GC valve power section brings punch and layered gain structures. Bright and Bottom switches handle further voicing.

  Two channels, Clean and Lead, each carry their own gain control over a shared 3-band EQ with Lead Volume, Presence and Master A/B. A valve-buffered FX loop with a balance control, a noise gate with an adjustable threshold and a power tube monitor complete the panel.

  The preamp runs four ENGL ECC83 / 12AX7 valves into four ENGL 6L6GC output valves for 100 watts. Speaker outputs cover 4, 8 and 16 Ohm loads, singly or in parallel pairs, and a footswitch jack takes the ENGL Z4 for channels, Master A/B, Mid Boost and the FX loop.
specs: |-
  - 2 channels: Clean, Lead
  - All-valve head
  - Valve-buffered FX loop
  - Noise gate
  - Master A/B
  - Power tube monitor
  - Sound options: Bright, Bottom, Mid Boost
  - Controls: Gain (for each channel), 3-band EQ, Lead Volume, Master A, Master B, Presence, noise gate threshold level, FX Loop Balance
  - Power amp output: 1 x 4 Ohm, 1 x 8 Ohm, 1 x 16 Ohm, 2 x 8 Ohm parallel, 2 x 16 Ohm parallel
  - Footswitch support: Z4 (channels, Master A/B, Mid Boost, FX loop)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 4 x ENGL 6L6GC
  - Output power: 100 W
  - Dimensions: 71 x 27 x 27 cm
  - Weight: 21 kg
