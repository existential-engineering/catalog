description: 8 sound generation algorithms.
details: |-
  Erica Synths Pico Voice is a versatile sound source in a 3HP panel. Despite the small size, it sounds bigger than it is.

  The module features eight sound generation algorithms: Karplus Strong, Chords, Wavetable, TB303 bassline emulation, PWM, Supersaw, Wavefold and Harmonic saturation. Each algorithm has adjustable parameters on the panel, and one user defined parameter per algorithm can be put under CV control. Algorithm selection is colour coded, and user settings are held in memory.

  Tuning is both manual and 1V/oct, over a C1 to C8 range, and a CV amplitude of -5V to +5V sweeps an assigned parameter across its full span. The Pico Series set Erica Synths the challenge of fitting superior functionality into a 3HP panel at an affordable price. The module is 3HP wide, 35mm deep, and draws +28mA and -5mA from the bus.
specs: |-
  - 8 sound generation algorithms
  - Karplus Strong, Chords, Wavetable, TB303 bassline emulation, PWM, Supersaw, Wavefold and Harmonic saturation
  - Manual and 1V/oct tuning
  - Adjustable parameters per algorithm
  - Assignable CV control over algorithm parameters
  - User setting memory
  - Colour coded algorithm selection
  - Tune range C1 to C8
  - CV amplitude for full parameter sweep -5V to +5V
  - Power consumption +28mA, -5mA
  - Module width 3HP
  - Module depth 35mm
