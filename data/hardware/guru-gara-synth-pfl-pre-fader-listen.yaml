details: |-
  Pre-Fader Listen (PFL) Module

  The Pre-Fader Listen Eurorack PCB and Front Panel Kit is a DIY monitoring module designed as a mixer add-on for Eurorack systems. It allows pre-fader listening of up to four audio channels, making it ideal for cueing, signal checking, and detailed audio analysis without affecting the main mix. Key Features

  Monitoring & Usage

  This PFL module allows you to listen to audio signals before the channel fader, making it easier to preview sounds, check levels, or isolate signals during live performance or studio patching. Each channel includes a dedicated volume control, enabling precise level balancing in the headphones without influencing the main output. The module is designed for mono monitoring, focusing on clarity and accuracy rather than stereo imaging, which is ideal for critical listening and troubleshooting. Headphone Amplification

  The built-in headphone amplifier is based on two LME49600 ICs, delivering clean and reliable headphone drive. The headphone output uses a stereo jack socket, ensuring compatibility with standard headphones while maintaining a mono signal path. DIY Build & Front Panel

  This DIY Eurorack PFL PCB and front panel kit is intended for intermediate builders. The front panel is made from durable PCB material and screen printed by hand, matching the aesthetic of other Guru Gara Synth modules. Technical Specifications

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
