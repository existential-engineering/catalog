description: DJ controller with built-in LED light show that synchronizes to the
  music, large touch-sensitive jog wheels, and plug-and-play support for Serato
  DJ Lite, Algoriddim djay Pro AI, and DJ Player Pro.
details: |-
  The Party Mix II takes the legacy of the original Party Mix to the next level with pro-level features and a built-in light show that synchronizes to music.

  It offers plug-and-play support for Serato DJ Lite, Algoriddim djay Pro AI (iOS and desktop), and DJ Player Pro mobile app, plus access to streaming partners including TIDAL, Beatport LINK, Beatsource LINK, and SoundCloud GO through supported DJ software.

  Large touch-sensitive jog wheels enable scratching, while large Filter effect knobs on each deck, performance pads with Effect, Cue, Loop, and Sampler modes, and a 2-band EQ provide hands-on creative control.
specs: |-
  - Built-in LED light show that synchronizes to the music
  - Access to streaming partners through supported DJ software and apps
  - Plug-and-play support for Serato DJ Lite, Algoriddim djay Pro AI iOS and desktop app, and DJ Player Pro mobile app
  - Large touch-sensitive jog wheels for scratching
  - Large Filter effect knobs on each deck
  - Sync, Play/Pause, and Cue buttons
  - Pitch sliders for tempo adjustments
  - Performance pads with Effect, Cue, Loop, and Sampler modes
  - Library controls for scrolling and loading tracks
  - 2-band EQ on each deck
  - Dimensions: 12.8" x 7.8" x 2" (325.5 x 199 x 51 mm)
  - Weight: 2.1 lb (0.95 kg)
  - Power via USB
