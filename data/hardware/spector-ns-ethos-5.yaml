details: |-
  Spector's NS Ethos range celebrates the brand's iconic legacy while simultaneously incorporating fresh features that matter to the modern player. The iconic curved body is carved from solid Maple and is adorned with a highly figured Poplar Burl top. The 3-piece Maple neck features a 24 fret Rosewood fingerboard, adorned with a custom Spector logo inlay on the 12 th fret. When it comes to electronics, the NS Ethos employs Aguilar's premium pickups & OBP-2 active pre-amp for a wide range of usable and musical tones. NS Ethos basses are available in two distinct finishes including Interstellar and Super Faded Back. These eye-catching, high gloss finishes are inspired by our USA Series instruments and lend an extra level of sophistication to these instruments.
