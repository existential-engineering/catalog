description: >-
  Tangle Quartet is a high-quality quad linear voltage controlled amplifier
  (VCA) providing individual level control of four signal inputs with both
  individual outputs and a combined mix output. Control inputs are normalised to
  5V, enabling manual mixing operation even without external control voltages.
details: |-
  The Tangle Quartet uses four high-quality linear VCA circuits (2164 IC) to provide independent voltage-controlled amplitude management for each of four signal channels. Each channel features an audio input, a CV input with attenuation control, and a dedicated individual output, making the module equally useful as four independent VCAs or as a complete four-channel mixer.

  The combined mix output sums any channels whose individual outputs are not patched, following a normalisation scheme that keeps the mix output useful even in partial-patch configurations. Control inputs are normalised to +5V, meaning the attenuation knobs function as manual level controls with no CV connected — a practical design that removes the need for a separate voltage source for basic mixing.

  Inputs and outputs are DC-coupled, so the module handles both audio-rate signals and slow control voltages equally well. The module includes reverse polarity protection and is built in the UK. At 8HP and 32mm deep, it is skiff-friendly and pairs naturally with ALM's larger MEGA-TANG expander (ALM033) for live performance applications.
specs: |-
  - Size: 8HP
  - Depth: 32mm
  - Power: +12V 80mA / -12V 80mA
  - VCA type: Linear (2164 IC)
  - Inputs: 4 × audio in, 4 × CV in (normalised to +5V)
  - Outputs: 4 × individual out, 1 × mix out
  - DC coupled: yes (audio and CV compatible)
  - Reverse polarity protection: yes
  - Warranty: 2 years
  - Manufactured in the UK
