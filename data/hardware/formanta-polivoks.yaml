description: >-
  The most popular vintage Soviet synthesizer, a duophonic analog instrument from
  the Formanta factory featuring a distinctive switchable bandpass/lowpass filter
  and aggressive, raw character.
details: |-
  The Polivoks holds the distinction of being the most well-known synthesizer produced in the Soviet Union, manufactured by the Formanta electronic factory beginning in 1982. It was among the first synthesizers built in the USSR and was sold exclusively within the country, making exports to the West uncommon until after the fall of the Soviet Union.

  The sound architecture centers on two oscillators offering triangle, sawtooth, square, and two pulse waveforms, plus a noise generator. The filter is a particularly distinctive feature, offering switchable dual-mode operation between bandpass and lowpass with a full ADSR envelope. A modulator section provides triangle, square, random, and noise waveforms for vibrato and other modulation effects, while a glissando function adds portamento between notes.

  Built in a rugged aluminum housing with magnetically controlled keyboard contacts across 49 keys, the Polivoks was designed to withstand the rigors of Soviet manufacturing and use. Its independent circuit board modules make maintenance relatively straightforward, though the DIN socket connections and Russian-language labeling present challenges for Western users. The instrument excels at screeching leads, thunderous bass, and processing external audio through its distinctive filter.
specs: |-
  - Polyphony: 2 voices (duophonic)
  - Oscillators: 2 + 1 noise generator
  - Waveforms: Triangle, sawtooth, square, pulse 1, pulse 2
  - Filter: Switchable dual-mode bandpass/lowpass with ADSR
  - LFO: 1 modulator (triangle, square, random, noise)
  - Envelopes: 2 ADSR
  - Effects: Glissando
  - Keyboard: 49 keys (magnetically controlled)
  - Memory: None
