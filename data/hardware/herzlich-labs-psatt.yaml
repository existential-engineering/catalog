description: A passive stereo attenuator module for Eurorack that attenuates
  stereo audio or CV signals down to usable levels. It is normalled so a mono
  input is repeated on both outputs.
details: |-
  In recent years, stereo signal paths have increasingly found their way into the wonderful world of Eurorack synthesis - so naturally, utilities should follow suit. Introducing psATT, a simple solution to a problem you might not even realize you had. Far from just useful as an attenuator for audio sources in mixdowns, the psATT can also be used to bring stereo audio signals down to more managable levels (such as line level), attenuate multiple signals simultaneously (like increasing the modulation depth of two LFO's at the same time! It's like having two hands, but with one hand!) and is even normalled, so if you only have a mono signal, the attenuated signal will be present at both outputs. That's what utility is all about! There's not much else to say, except that it's passive, and draws no power - and it looks very classy in black and gold! You'll like it, I'm sure of it. It's also only 2hp, did you know that? You probably knew that, you could probably tell, you have a good eye for these things I bet.
