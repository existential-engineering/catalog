description: Turn heads and melt faces with this unapologetically radical Super
  Stock Charvel San Dimas Style 1 - a high-octane throwback that looks like it's
  been earning its stripes since neon was in fashion. The distressed black
  nitrocellulose finish, emblazoned with a killer yellow diamond pattern, tells
  a story of countless all-night jams and sweaty club gigs that never actually
  happened (but totally could have).
details: |-
  The Super-Stock San Dimas Style 1 H FR EB is a single-humbucker, hot-rodded electric guitar finished in distressed black nitrocellulose lacquer with a yellow Diamond Life pattern. It pairs a classic San Dimas alder body with a bolt-on maple neck featuring graphite reinforcement and a hand-rubbed urethane finish for a fast, smooth feel.

  The ebony fingerboard carries a 12"-16" compound radius and 22 jumbo frets with white dot inlays, giving comfortable chording at the nut and effortless bends and lead playing in the upper register. A licensed Fender Stratocaster headstock tops the neck.

  Tone comes from a single Seymour Duncan JB TB-4 humbucker in the bridge position controlled by a master volume knob, while a recessed Floyd Rose 1000 Series double-locking tremolo with matching locking nut keeps tuning rock-solid through aggressive whammy work. Black hardware, Charvel-branded die-cast tuning machines, dome-style control knobs, and nickel-plated steel strings (.009-.042) round out the package.

  Ships with a Charvel Style 1/2 Economy Case (P/N 099-0612-100).
specs: |-
  - Body: Alder, San Dimas shape, Distressed Nitrocellulose Lacquer finish
  - Neck: Maple, bolt-on with graphite reinforcement, hand-rubbed urethane finish
  - Fingerboard: Ebony, 12"-16" compound radius, white dot inlays, white side dots
  - Scale Length: 25.5"
  - Frets: 22 jumbo
  - Nut: Floyd Rose 1000 Series Locking, 1.6875" width
  - Bridge pickup: Seymour Duncan JB TB-4 (black)
  - Pickup configuration: H (single bridge humbucker)
  - Controls: Master volume
  - Bridge: Floyd Rose 1000 Series Double-Locking Tremolo (recessed), Floyd Rose 1000 Series locking tremolo arm
  - Tuners: Charvel-branded die-cast
  - Hardware finish: Black
  - Control knobs: Dome-style
  - Switch tip: Black
  - Headstock: Licensed Fender Stratocaster
  - Strings: Nickel Plated Steel (.009-.042)
  - Orientation: Right-hand, 6-string
  - Strap buttons: Standard
  - Neck plate: Charvel
  - Color: Diamond Life
  - Included: Charvel Style 1/2 Economy Case (P/N 099-0612-100)
