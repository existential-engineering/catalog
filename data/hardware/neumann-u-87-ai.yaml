details: |-
  The world's most famous studio microphone

  Classic sound, instantly recognizable yet versatile

  Balanced frequency response

  Three polar patterns: omni, cardioid, figure-8

  Switchable low cut and pad

  Very low self-noise
specs: |-
  - Acoustical Operating Principle: Pressure gradient transducer
  - Directional Pattern: Omnidirectional, cardioid, figure-8
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity: 20/28/22 mV/Pa ± 1 dB (Omni/cardioid/8) at 1 kHz into 1 kohm
  - Rated Impedance: 200 ohms
  - Rated Load Impedance: 1 kohms
  - Equivalent Noise Level C C I R: 26/23/25 dB (Omni/cardioid/8)
  - Equivalent Noise Level A Weighted: 15/12/14 dB-A (Omni/cardioid/8)
  - Max Spl T H D05: 117 dB (cardioid)
  - Max Spl T H D05 With Preattenuation: 127 dB
  - Signal To Noise Ratio C C I R: 68/71/69 dB (Omni/cardioid/8)
  - Signal To Noise Ratio A Weighted: 79/82/80 dB (Omni/cardioid/8)
  - Maximum Output Voltage: -6 dBu
  - Supply Voltage: 48 V ± 4 V (P48, IEC 61938)
  - Current Consumption: 0.8 mA (P48, IEC 61938)
  - Matching Connector: XLR 3 F
  - Weight: 500 g
  - Diameter: 56 mm
  - Length: 200 mm
