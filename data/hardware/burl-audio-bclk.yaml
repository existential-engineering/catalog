name: BCLK
manufacturer: burl-audio
primaryCategory: utility
categories:
  - rack-mount
  - digital
url: "https://www.burlaudio.com/products/daughter-cards/bclk"
description: "Word clock distribution daughter card for the B80 and B16
  MOTHERSHIP chassis, providing 8 BNC word clock outputs plus one AES/EBU clock
  output with two independently programmable banks. A single B80 can achieve up
  to 92 total word clock outputs with BCLK cards installed."
specs: |-
  - 9 word clock outputs (8 BNC, 1 AES/EBU XLR)
  - Two independently programmable banks
  - Extremely stable, low-jitter clock sourced from BMBx motherboard via Burl BackBone
  - Up to 92 total word clock outputs in 1 B80 unit
  - Supports clock multiples: 48 kHz, 96 kHz, or 192 kHz output from single system clock
