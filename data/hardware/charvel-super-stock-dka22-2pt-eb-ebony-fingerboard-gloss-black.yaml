details: |-
  The Charvel Super-Stock DKA22 2PT EB is a limited edition Dinky-shape electric guitar with an arched alder body finished in gloss black. The bolt-on caramelized maple 'speed' neck features graphite reinforcement and a hand-rubbed urethane gel finish for fast playability.

  The 12"-16" compound radius ebony fingerboard carries 22 jumbo frets, cream dot inlays, Luminlay side dots and rolled edges for player comfort. A Graph Tech TUSQ XL nut (1.6875") tops the Stratocaster-style 6-in-line headstock.

  Electronics consist of a Seymour Duncan Custom Custom Trembucker TB-11 in the bridge and a Seymour Duncan '59 SH-1N in the neck, both in chrome. A 5-position blade switch provides classic humbucker selections plus inner/outer coil split combinations, with master Volume and Tone controls on dome-style knobs.

  Hardware includes a Gotoh Custom 510 tremolo bridge and Charvel-branded die-cast locking tuners in chrome. Strung with nickel-plated steel strings (.009-.042) and shipped in a Charvel Multi-Fit Gig Bag.
