details: |-
  The Argon3S is a two-way passive radiator bookshelf loudspeaker designed to bring studio-quality sound into the home. It features a 1" titanium tweeter and a 6½" aluminum woofer with a crossover point at 1600 Hz, delivering a frequency response of 38–25,000 Hz (-6dB).

  At the heart of the Argon3S is Amphion's 5th generation waveguide technology, which ensures seamless integration between the tweeter and woofer for a natural, coherent presentation across the entire frequency range.

  The speaker performs exceptionally well at low volumes while maintaining high intensity and detail, making it suitable for extended critical listening sessions.

  The Argon3S is handmade in Finland and is available in four finish options: Standard White, Full Black, Walnut, and Full White.

  The Argon3S has received recognition from the audio press, including HiFi Awards Winner and ABA Highly Recommended accolades.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 87 dB
  - Frequency Response: 38–25,000 Hz (-6dB)
  - Power Recommendation: 50–150 W
  - Dimensions (H×W×D): 380×190×305 mm
  - Weight: 10 kg (22 lbs)
  - Manufacturing: Handmade in Finland
