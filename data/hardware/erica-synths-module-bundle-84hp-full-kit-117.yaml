description: An 84HP two-VCO modular system with 53 patch points that go well
  beyond classic monosynths. This is not just a Polivoks clone.
details: |-
  The 84HP full kit is a two-VCO DIY modular system with 53 patch points, aimed well beyond classic monosynth territory rather than at a straight Polivoks reproduction. The 84HP bundle holds a MIDI-CV, a Modulator, two VCOs, a Mixer, a VCF, two envelope generators, a VCA and an Output module, while the smaller 72HP bundle drops the MIDI-CV.

  The DIY MIDI-CV emulates classical monophonic and duophonic synth behaviour. The DIY Modulator is essentially an LFO with simultaneous triangle and square wave outputs, a clockable sample and hold with an external CV input, and a noise source.

  The DIY Polivoks-inspired VCO has simultaneous triangle, ramp and pulse wave outputs plus sync and PWM CV inputs, and its exponential converter uses the original matched transistor IC fitted to the Polivoks. The DIY Polivoks VCF is known for crazy resonance sweeps and a deep, bassy sound that suits acid basslines, and its kit includes two K140UD12 opamps of the type used in the original Polivoks.

  The DIY Polivoks-inspired looping ADSR envelope generator offers gate delay with direct and inverted envelope outputs. The DIY Polivoks-inspired VCA puts two differential opamp-based VCAs in series, one each for LFO and ADSR control over amplitude independently, and it can be used as a dual VCA instead, with two K118UD1 differential opamp ICs in the kit. The DIY Mixer is a straightforward audio mixer, and the DIY Output module interfaces the system with external gear over a 3.5mm stereo jack and allows monitoring on headphones.

  Erica Synths stopped providing technical support for its DIY projects on 1 January 2021. All of the DIY kits are sold out and the designs are published as open source build projects on GitHub, with rare components available from the larger DIY retailers.
specs: |-
  - 84HP bundle: MIDI-CV, Modulator, 2xVCO, Mixer, VCF, 2xEG, VCA, Output
  - 72HP bundle: Modulator, 2xVCO, Mixer, VCF, 2xEG, VCA, Output
  - 53 patch points
  - Two VCOs with simultaneous triangle, ramp and pulse outputs, sync and PWM CV inputs
  - VCO exponential converter uses the original Polivoks matched transistor IC
  - Polivoks VCF kit includes two K140UD12 opamps
  - Looping ADSR envelope generator with gate delay, direct and inverted outputs
  - VCA kit includes two K118UD1 differential opamp ICs
  - Modulator with triangle and square LFO outputs, clockable S&H and noise source
  - Output module with 3.5mm stereo jack and headphone monitoring
