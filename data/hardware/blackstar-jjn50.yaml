details: |-
  Jared James Nichols has built a reputation as one of the most talented players in the world today; a true player's player. Jared has been a Blackstar Artist for 14 years and we've been honoured to work with him on his second signature model with us, the JJN 50 & JJN 212 VOC.

  As Jared's career has grown, so has the size of the stages he plays and it has come to a time where his amplifier is also in need of growth. We worked closely with Jared to develop his new signature model and we're extremely proud to reveal the JJN 50. This amp has been road-tested on tour around the UK and Europe and tweaked to perfection, to deliver Jared's awesome BLUES POWER tones.

  At the heart of the JJN 50 lies a pair of EL34 output valves. A staple of many iconic amplifiers and revered amongst players for their vocal midrange and quintessential British essence. Jared has been playing a St. James 50 EL34H live since its launch (alongside his JJN 20) and his new signature amp is based on that platform. Working closely with him we've opened up more of the top end of the amp to allow a wider spectrum of frequencies through. This allows the notes to pop and snap off his fingers more percussively. We've also added a unique BLUES POWER circuit which really kicks the amp into overdrive with rich harmonics and overtones.

  When Jared visited Blackstar HQ in Northampton, UK we tested many different speaker types and combinations. Jared's preferred choice was a Celestion G12T-75 in the top and a lightweight Celestion Zephyr speaker in the bottom position. This unique speaker blend kept the cabinet lightweight while delivering the punch he needs. The JJN 212 VOC is up to 36% lighter than a traditional 50W valve amp cabinet.

  With more musicians recording at home, or playing on silent stages, the JJN 50 is perfect for the way we play today, with USB audio connectivity for pro-recording and an XLR D.I. for professional live use, both using the inbuilt reactive load and CabRig DSP speaker simulation. The JJN 50 is loaded with three exclusive CabRig presets crafted with Jared: 'JJN Classic Muscle,' 'JJN Modern Grit,' and 'JJN Nashville Basement.'
specs: |-
  - Jared James Nichols' Signature Amplifier
  - Ultra-lightweight 50 Watt head
  - Footswitchable BLUES POWER boost
  - Built-in reactive load
  - CabRig advanced IR based DSP cabinet simulator including 3x of Jared's personal patches
  - 2 x ECC83 preamp valves, 2 x EL34 output valves
  - Two footswitchable channels
  - 50W / 2W / Sag power reduction
  - Master Volume
  - Reverb
  - Effects loop with effects level switch
  - USB audio output
  - XLR D.I. output
  - Footswitch included
  - Covered in Jared's British Racing Green tolex and biscuit fret including illuminated logo
  - EQ: Bass, Middle, Treble
  - Universal voltage: 100V to 240V 50/60Hz
  - Head weight: 7.7 kg
  - Head dimensions (mm): 495 x 241 x 228
  - JJN 212 VOC: Vertical 2x12" cabinet with Open/Closed back
  - JJN 212 VOC: 1 x 12" Celestion G12T-75 and 1 x 12" Celestion Zephyr speakers, 145W cabinet power handling
  - JJN 212 VOC: 4 Ohm and 16 Ohm inputs
  - JJN 212 VOC: Constructed from lightweight Candlenut Ply
  - JJN 212 VOC weight: 15.67 kg
  - JJN 212 VOC dimensions (mm): 501 x 718 x 295
