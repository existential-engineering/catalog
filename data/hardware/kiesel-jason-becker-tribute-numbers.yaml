description: The JB24, known as "Numbers", is a Jason Becker tribute model whose
  colour scheme draws on a wooden toy, with multi-coloured number inlays and
  orange tuner buttons. It carries an Original Floyd Rose bridge and a set of
  Seymour Duncan pickups.
specs: |-
  - Model designation: JB24
  - Construction: bolt-on with sculpted neck heel
  - Body: tung-oiled swamp ash
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.68 in at nut, .78 in thick at 1st fret, .88 in thick at 12th fret, 2.22 in wide at 24th fret
  - Fingerboard: maple with 14 in radius
  - Frets: 24 stainless steel medium-jumbo
  - Scale length: 25.5 in
  - Headstock: pointed inline with swamp ash overlay
  - Bridge: Original Floyd Rose tremolo, .42 in (10.7 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio, with orange buttons
  - Pickups: multi-coloured Seymour Duncan set, neck SH-2n, middle STK-S7, bridge Becker Signature Perpetual Burn
  - Electronics: master volume control with orange knob, 5-way pickup selector
  - Inlays: multi-coloured "Numbers" inlays, black-ring Luminlay Super Blue side dots
  - Hardware: multi-coloured
  - Body dimensions: 39.125 in long, 1.7 in thick, 12.625 in wide
  - Weight: 7.5 lbs
  - Strings: Elixir Nanoweb 1046E
  - Truss rod cover: Jason Becker signature, with the Becker logo engraved
