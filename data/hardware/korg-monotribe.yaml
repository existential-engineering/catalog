description: >-
  The Korg Monotribe is a compact analog groovebox from 2011 combining a monophonic synthesizer
  with a three-part drum machine and an 8-step sequencer, all built around the same 24dB lowpass
  filter design found in the MS-20.
details: |-
  Released in 2011, the Korg Monotribe evolved from the tiny Monotron into a more capable
  production tool while maintaining an accessible price point. It marked an important step in
  Korg's renewed commitment to analog synthesis, helping pave the way for the Volca series and
  the modern MS-20 Mini reissue that followed.

  The synthesizer section features a single VCO with sawtooth, triangle, and square waveforms
  spanning a wide octave range from 64' to 2'. It feeds into the same 24dB per octave lowpass
  filter topology used in the Monotron and derived from the classic MS-20 design, with a Peak
  resonance control capable of aggressive self-oscillating sweeps. A single LFO offers saw,
  triangle, and square waveforms in fast, slow, and one-shot modes, with the one-shot mode
  effectively functioning as a simple envelope generator.

  The drum section provides kick, snare, and hi-hat sounds, each programmable across 8 steps
  independently from the synth sequencer. A pitch ribbon controller replaces a traditional
  keyboard, with selectable Wide, Narrow, and Key modes for different playing styles. The metal
  case with quarter-inch audio output and analog clock sync I/O for connecting to other gear
  represented a significant build quality upgrade from the Monotron. A small built-in speaker
  allows for portable use without external amplification.
specs: |-
  - Polyphony: Monophonic
  - Oscillator: 1 VCO (sawtooth, triangle, square)
  - Octave range: 64' to 2'
  - Noise: White noise generator
  - Filter: 24dB/octave lowpass (MS-20 type) with Peak resonance
  - LFO: 1 (saw, triangle, square) with fast/slow/one-shot modes
  - Envelope: 3 selectable shapes (ramp down, gate, ramp up)
  - Drums: Kick, snare, hi-hat
  - Sequencer: 8-step analog (synth + independent drum patterns)
  - Memory: 1 user sequence
  - Controller: Pitch ribbon (Wide/Narrow/Key modes)
  - Sync: Analog clock in/out
  - Output: Quarter-inch jack + built-in speaker
  - Case: Metal construction
releaseDate: "2011"
