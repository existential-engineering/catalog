description: The Drum Sequencer is easy to use, classical X0X style live
  performance oriented sequencer module that provides the ultimate control over
  your system. Erica Synths Drum Sequencer might be the last modular sequencer
  for drums and basslines you will ever have to buy!
details: |-
  The Drum Sequencer is a 42HP eurorack drum brain in the classical X0X style, built around live performance. Sixteen trigger outputs and twelve accent outputs drive a rack full of drum modules, and a CV track with scales plus a gate track cover basslines and melodic parts from the same panel.

  Pattern capacity is generous. Patterns run up to 64 steps, eight banks hold sixteen patterns each, patterns switch instantly, can be linked, and a song mode chains them. Quick copy and paste works per track and per pattern.

  Timings are set per track rather than globally. Time signature, direction, pattern length and shuffle are all per track or per pattern, and each step carries its own probability, retrigger and time shift settings. Tracks can be soloed or muted, and recording works in step or tap modes.

  Two LFOs run either independently or synced to the BPM, with attenuation set per output, so modulation leaves the sequencer alongside the triggers. Sync from outside arrives over MIDI with start and stop, or over an external 4PPQ clock input.

  Trigger amplitude is 5V, the module is 30mm deep and it draws 152mA from the positive rail and 56mA from the negative rail. Firmware is upgraded over MIDI SysEx.
specs: |-
  - 16x trigger outputs
  - 12x accent outs
  - 1x CV track with scales
  - 1x Gate track
  - 2x LFO with independent or synced to the BPM frequency
  - LFO attenuation per out
  - Max pattern length 64 steps
  - Time signature per track
  - Direction per track/pattern
  - Pattern length per track
  - Shuffle per track
  - Probability per step
  - Retrigger per step
  - Time shift per step
  - Instant pattern switching
  - Solo/Mute tracks
  - Step/Tap record modes
  - 8 Banks of 16 Patterns
  - Quick Copy/Paste per tracks and patterns
  - Pattern linking
  - Song mode
  - MIDI sync in with Start/Stop
  - External 4PPQ clock in
  - Firmware upgrade via MIDI SysEx
  - Trigger amplitude 5V
  - Panel Width 42 HP
  - Module depth 30mm
  - Power consumption 152mA@+12V, 56mA@-12V
