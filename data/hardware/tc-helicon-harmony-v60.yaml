description: 60 W two-channel acoustic combo amplifier with a Tannoy dual
  concentric speaker, a microphone channel carrying TC Helicon vocal processing
  and an instrument channel with EQ, effects and a tuner. A looper, a
  four-button footswitch and XLR outputs with DI, FX and Mix switching are
  included.
details: |-
  The Harmony V60 is a 60 W two-channel acoustic amplifier that doubles as a personal vocal monitor. A coaxial Tannoy dual concentric driver and a voicing tuned for the human voice reproduce both the dry vocal and the processed signal, so the stage sound matches what the audience hears.

  The microphone channel carries the TC Helicon vocal chain: switchable phantom power, Adaptive Tone, pitch correction, harmony with its own level and enable control, anti-feedback, reverb and echo, plus a Talk button for speech between songs.

  The instrument channel adds a chromatic tuner with mute, three-band EQ, anti-feedback, BodyRez, chorus, reverb and echo. A looper section with its own level control, tap tempo and a voice, guitar or all source selector records over both channels, and a master volume sets the output.

  The rear panel carries an aux input with its own level control, XLR outputs for the microphone and instrument channels with per-output DI, FX or Mix switching and a ground lift, a headphone output, a USB port, a footswitch socket for the supplied four-button FST4 and a switch for the top tweeter. Mains power arrives through an IEC inlet beside the power switch.
specs: |-
  - 60 W output
  - Two channels: microphone with switchable phantom power, and instrument
  - Tannoy dual concentric speaker with a switchable top tweeter
  - Vocal channel: Adaptive Tone, pitch correction, harmony, anti-feedback, reverb, echo and Talk
  - Instrument channel: chromatic tuner with mute, three-band EQ, anti-feedback, BodyRez, chorus, reverb and echo
  - Looper with level control, tap tempo and voice, guitar or all source selection
  - Per-output DI, FX or Mix switching with a ground lift
  - Aux input with its own level control
  - Four-button FST4 footswitch included
  - IEC mains inlet with a power switch
