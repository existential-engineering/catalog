details: |-
  The DA100 Ruby is Blackstar's artist signature valve amplifier head, developed in collaboration with guitarist Doug Aldrich (The Dead Daisies, Whitesnake, Dio). At the heart of the amp is a classic British valve setup driven by a quartet of EL34 power valves, delivering a rock 'n' roll growl with a wide dynamic range from lush, warm cleans to aggressive, ripping leads.

  The amp features bespoke CabRig profiles co-developed with Doug — 'Doug's Ruby Reds', 'Doug's Classic Cabs' and 'Doug's L.A. Studio'. CabRig is Blackstar's next-generation IR-based DSP speaker simulator that reproduces the sound and feel of a mic'd-up guitar cab, available across the XLR D.I. and USB audio outputs.

  An advanced switchable Effects Loop allows adjustable tail lengths through Architect software, preserving delay repeats and other time-based effects when disengaged — a rare feature for a valve head. An included 5-way footcontroller provides access to all channels and voices along with a versatile 4dB Solo boost on any channel or voice combination, running over a standard guitar cable.

  USB audio connectivity supports pro-recording while the XLR D.I. is intended for professional live use; both leverage CabRig DSP speaker simulation, making the amp suited to home recording and silent stages as well as traditional cabinet use.

  The matching DA412B is a 4x12 closed-back cabinet loaded with Doug's preferred Celestion Vintage 30 speakers, designed as the cornerstone of his signature setup. Prototypes were road-tested with Doug on tours with The Dead Daisies across the UK and Europe for sonic refinement and endurance testing.
specs: |-
  - EL34 quartet valve power section (classic British setup)
  - Switchable advanced FX loop with adjustable tail lengths via Architect software
  - Bespoke CabRig profiles: Doug's Ruby Reds, Doug's Classic Cabs, Doug's L.A. Studio
  - CabRig next-generation IR-based DSP speaker simulator
  - USB audio for direct recording
  - XLR D.I. output with CabRig simulation
  - Included 5-way footcontroller (standard guitar cable, no special wiring)
  - 4dB Solo boost selectable on any channel/voice combination
  - DA412B companion 4x12 cabinet loaded with Celestion Vintage 30 speakers
