description: A top-of-the-line multi-pattern studio condenser microphone.
  Distinctive industrial styling, pivoting head, and full, smooth sound for
  demanding recording sources like acoustic instruments, drum overheads, and
  vocals.
details: |-
  Mabel is a hand-built multi-pattern condenser microphone designed primarily for studio use on demanding sources like acoustic instruments, drum overheads, and vocals. It features a copper-ringed head basket with brass grill work, held in a pivoting mount in a stainless-steel yoke, and a copper-and-brass body. The design is both visually striking and practical, as the pivoting head makes for easy positioning adjustments.

  Mabel uses two fixed-cardioid electret medium-large diaphragm (26 mm) condenser capsules, individually tested and selected to match each other and strict design criteria. The circuit is a transformerless FET with fully balanced output, incorporating thorough EMI protection. Other electrical components in the signal path are metal film resistors, polypropylene and polystyrene capacitors, and individually tested, hand-matched and biased transistors and JFETs.

  The dual-cardioid-capsule design is an uncommon approach to a multi-pattern mic. It has advantages in an especially deep null at the sides of the figure 8 pattern and greater control over the directional frequency response across all the patterns. The circuit includes high frequency EQ tuned to the capsules to provide a very smooth high end. The response is very flat, with full low end and controlled high end, with response dropping above 14 kHz.

  Ear Trumpet Labs suggests Mabel for studio vocals, acoustic instruments and overheads, with the switch-selectable patterns providing different tonal options.
specs: |-
  - Hand-made microphone with unique appearance
  - Multiple switch-selectable patterns: cardioid, omni, figure-8
  - Pivoting head for ease of positioning
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid, omni, figure 8
  - Sensitivity: -33 dB (23 mV/Pa) cardioid, -38 dB (12 mV/Pa) omni and figure 8
  - Two fixed-cardioid electret 26 mm capsules, individually tested and matched
