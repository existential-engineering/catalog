description: Fuzz So Heavy, It Had to Be Split The Crossover Fuzz is a
  screaming, swirling filter-fuzz monster. It takes your signal, slices it into
  high and low frequencies, and then absolutely wrecks each band with Death By
  Audio's signature fuzz.
details: |-
  The Crossover Fuzz is a filter-fuzz that slices your signal into high and low frequencies and demolishes each band separately with Death By Audio's signature fuzz. Like a crossover circuit on a rampage, it gives independent control over each half of your sound, letting you shape, destroy, and reimagine your tone. Crank the Freq knob to sweep two analog resonant filters in tandem for surgical precision or chaotic, oscillating madness, and adjust the volume of highs and lows separately for gritty sculpting or a dream EQ.

  With HIGH and LOW inputs and outputs, the pedal can split your signal to different amps, isolate frequencies for creative routing, or act as a stereo panner that slings frequencies across the room. The dual-linked high-pass and low-pass filters are controlled in tandem, the resonant filter runs from subtle sweeps to screaming spikes, and a reactive LED display glows and shifts color based on filter position. It supports mono, stereo-to-mono, mono-to-stereo, and full stereo routing configurations.

  FREQ sets the low-pass filter from 30Hz to 7.6kHz and the high-pass from 80Hz to 17kHz. RES controls filter resonance from smooth to nasty oscillation, GAIN sets the drive from clean to towering fuzz, and VOL sets each filter's output level. The side FREQ EXP jack controls filter frequency with an expression pedal or 0-5V external CV for panning, filtering, and stereo sweeps, with the FREQ knob setting the minimum frequency. An internal Light Switch changes the LED color set between "Sky Light" and "Cyber Light" modes.
specs: |-
  - Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel. Death By Audio's RAW POWER power supply is recommended for optimal performance.
  - Current Draw: 120 mA
  - Dimensions: 5.73" x 5.2" x 2.37" (including hardware)
  - Weight: 18.5 oz.
