description: |-
  In 2024, we will once again challenge the “norm” with the introduction of the SA-126 Special, Wolfgang Van Halen’s interpretation of what a modern guitar should be in the 21st century.

  SA-126 is the very definition of innovation incarnate. It’s a hybrid between semi-hollow and solid body guitar: think chambered/center block solid body blended with a bolt-on neck, then kitted out with features most frequently associated with high performance guitar brands such as a slim neck, jumbo frets and higher output pickups. The brain child of Wolfgang Van Halen, the instrument was created with versatility in mind, striking the perfect balance between pummeling rhythm tones and lightning-fast lead runs.

  Here is a quick look at the features.

  The all-new SA-126 features a Mahogany body that is chambered, with a basswood Centerblock added for stability and tone. Capped with a maple top on solid finishes and quilt maple on transparent finishes w/ 5 ply body binding, this thing emits “TONE”. The neck is a 22 fret 12”-16” compound Ebony fingerboard with jumbo frets and triple block inlays on a graphite reinforced mahogany neck. With a scale length of 24 and three quarters… this feels like a modern - classic that is familiar and comfortable. Finally, a spoke wheel truss rod adjustment at the butt end of the neck for easy adjustments, on the fly.

  Introducing the EVH SA-126 bridge and neck pickups created by Fender’s resident pickup designer Tim Shaw and the EVH team, they can handle just about anything you feed them. From the elegant sound of cascading-glassy cleans to a heavy bath of Overdrive to “Burn” that will satisfy the most discerning gainiac. Three-way toggle at the upper horn to switch between bridge, bridge and neck, and neck pickups as well as two volumes and two tones to control each. Other features include a Harmonica bridge and stop bar tailpiece, oversized strap buttons, and keystone tuning pegs.

  The SA-126 Special comes in 4 finishes. Tobacco Sunburst w/ Gold Hardware, Transparent Purple w/ Chrome Hardware, and Matte Army Drab as well as Stealth Black w/ Black hardware. Finally, this also comes with the SA126 Hardshell case that is wrapped in Ivory vinyl and has blue crushed velvet interior.
