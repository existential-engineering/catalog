details: |-
  A guitar for bass players, and a bass for guitar players: the Silhouette Bass was developed to meet an ever-increasing need among musicians for a special range of sound. It is a 6-string hybrid instrument — tuned like a bass in E or like a baritone in A — that fills the sonic territory between bass and guitar.

  Key highlights include dual DiMarzio custom split humbuckers, a 5-way pickup selector with a 2-way series/parallel rotary switch, a Music Man string-through-body bridge with Schaller roller saddles, and a compensated nut for accurate intonation across the unusual scale length.

  The instrument is built on a poplar body with a select maple neck and fingerboard. A short 5-7/8" headstock keeps balance under control. A passive 250k volume and tone circuit with 0.068µF tone cap routes the signal directly to the output jack.
specs: |-
  - Body wood: Poplar
  - Body finish: High gloss polyester
  - Body dimensions: 12-1/4" wide, 1-3/4" thick, 38-1/2" long
  - Neck wood: Select maple
  - Neck finish: Gunstock oil and hand-rubbed wax
  - Neck attachment: 5-bolt sculpted joint
  - Neck width: 1-3/4" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Headstock length: 5-7/8"
  - Fingerboard: Select maple
  - Frets: 22 high-profile, medium-width
  - Scale length: 29-5/8"
  - Pickups: HH — 2 DiMarzio custom split humbucking
  - Controls: 250k volume and tone (0.068µF tone cap)
  - Switching: 5-way lever pickup selector; 2-way rotary series/parallel selector
  - Bridge: Music Man string-through-body chrome-plated hardened steel with Schaller roller saddles
  - Tuning machines: Schaller M6LA
  - Electronic shielding: Graphite acrylic resin body cavity; aluminum-lined control cover
  - Strings (E tuning): 20w-30w-42w-54w-74w-90w (6-String Bass Guitar Slinkys #2837)
  - Strings (A tuning): 13p-18p-30w-44w-56w-72w (6-String Baritone Slinky #2839)
