name: I-ONIX FW810S
manufacturer: lexicon
primaryCategory: audio-interface
categories:
  - rack-mount
  - discontinued
  - legacy
url: https://lexiconpro.com/en-US/products/i-onix-fw810s
description: 10 Input/12 Output FireWire Audio Interface with Integrated Channel
  Strip Processing.
specs: |-
  - 10 inputs / 12 outputs
  - 4 mic preamps with XLR inputs
  - 4 line inputs on 1/4-inch TRS (balanced/unbalanced)
  - 1 instrument input on 1/4-inch TS (unbalanced)
  - 8 line outputs on 1/4-inch TRS (balanced/unbalanced)
  - Headphone output: 250 mW per channel at 50 Ohm
  - MIDI In and Out (5-pin DIN)
  - Integrated channel strip processing
  - Sample rates: 44.1, 48, 88.2, 96 kHz
  - Bit depth: 24-bit
  - Dynamic range: 110 dB (A/D and D/A), 108 dB (A/D/A)
  - Frequency response: +/-1.5 dB (20Hz-20kHz, mic/line); +/-2.5 dB (instrument)
  - Power: 100-240 VAC, 50/60 Hz, 30W
  - Dimensions: 19"W x 1.75"H x 10.5"D
  - Weight: 7.7 lbs
