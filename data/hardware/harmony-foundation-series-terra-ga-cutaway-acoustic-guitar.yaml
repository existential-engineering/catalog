details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable acoustic companion to weave tales out of every path of the journey. The Terra GA Cutaway is made with a laminated spruce top paired with sapele sides and back, with a smooth cutaway which provides high-fret access to players of all styles. The okoume neck's lightweight nature enhances sustain and resonance to ensure each note rings clear and true. Solid spruce X-bracing improves top vibration to afford superior sound projection and tonal depth. The Terra GA Cutaway comes pre-strung with D'Addario EXP16 coated strings, guaranteeing lasting bright tones for every session. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
