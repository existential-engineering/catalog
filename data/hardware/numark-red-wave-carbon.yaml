description: Red Wave Carbon High-quality Full-range Headphones.
details: |-
  The drivers are big 50mm neodymium-powered units, compared to the smaller 40mm headphone driver size found in most other headphones. This gives Red Wave Carbon a deep, potent bass response that really brings the music to life. When combined with their high-temperature/high-power voice coils, the overall effect is dynamic, realistic music, reproduced with detail and accuracy.

  We also paid close attention to comfort and convenience. The ear pads are made from a special breathable leather, which stay comfortable and cool, with no “sweating” during extended sessions. The Red Wave Carbon folds down for easy transport. For a perfect finishing touch, we include a custom carrying pouch to store the headphones, cable and adapter.

  Red Wave Carbon sounds really great, and they have the comfort and versatility that meets all the unique demands of a professional DJ.
specs: |-
  - Swivel design allowing DJs the flexibility to monitor house audio and cue audition
  - Breathable protein-leather padding that remains comfortable during extended use
  - Large 50mm drivers, neodymium magnets and high-temperature voice coils
  - Detachable headphone cable with 1/8" adapter
  - Fully foldable design for easy transportation
  - Driver Unit: 50mm diameter neodymium-powered
  - Frequency Range: 15 Hz - 20 kHz
  - Input Sensitivity: 98 +/- 3 dB
  - Impedance: 24 ohm
  - Cable Length: 1 meter coiled, 3 meters uncoiled
  - Weight: 280 grams
  - Max Load: 3500 mW
  - SPL: 120 dB
  - Includes: Red Wave Carbon Headphones, Detachable Headphone Cable, 1/8" to 1/4" Adapter, Carrying Pouch
