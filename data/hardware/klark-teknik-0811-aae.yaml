description: The DI 20P PRO DI 2 is a passive two-channel direct injection box
  for interfacing stereo keyboards, samplers and other electronic musical
  instruments to mixing consoles. It needs no external power, and a custom-built
  MIDAS transformer and switchable input pad let it accommodate instrument, line
  and loudspeaker level signals.
details: |-
  A custom instrumentation-grade input circuit uses advanced analogue design techniques to create the ideal input impedance match, giving a low noise, low harmonic and phase distortion input stage with a flat frequency response from 20 Hz to 30 kHz (±1 dB).

  Connectivity uses industry-standard XLR and high impedance 1/4" TS connectors. The input connectors accept unbalanced signals over 1/4" TS cables, the Thru jacks pass unbalanced 1/4" TS signals to local amps or monitors, and the Output XLR jacks send balanced versions of the input signals to a mixing board or other processing device.

  A -15 dB input Pad lets the DI 20P accept a wide range of input signals including guitar, line and speaker levels, up to 30 dBu. The Earth Lift switch separates the input and output grounds, eliminating earth loops between equipment on different mains electricity supplies, and the fully transformer-isolated design is intended to hold up in large-scale production environments.

  The ultra-compact enclosure is a thick aluminium extrusion that protects the electronics, with sturdy rubber corner bumpers for road use.
specs: |-
  - 2 channels
  - Frequency response: 20 Hz to 30 kHz (±1 dB)
  - Passive design, requires no external power
  - Input pad: -15 dB, accepts guitar, line and speaker levels up to 30 dBu
  - MIDAS custom-design transformers, fully transformer-isolated
  - Earth Lift switch separating input and output grounds
  - Aluminium extrusion enclosure with rubber corner bumpers
