description: Dept. 10 Valve Pedals by Blackstar are the most advanced valve
  pedals in the world. Brought to you by Blackstar's R&D division.
details: |-
  Dept. 10 is Blackstar's R&D division series of valve pedals. At the heart of each Dept. 10 pedal is an ECC83 triode valve, running at more than 200V internally like a valve amp, which allows them to deliver organic tone, dynamics and break up.

  The series comprises three models: Dept. 10 Boost (a high voltage valve boost pedal with Class A gain stage and James-Baxandall EQ), Dept. 10 Dual Drive (a 2-channel valve overdrive with ISF, USB and XLR D.I.) and Dept. 10 Dual Distortion (a higher gain 2-channel valve distortion pedal with ISF, USB and XLR D.I.).

  Dual Drive and Dual Distortion include CabRig, Blackstar's next-generation IR-based DSP speaker simulator that reproduces the sound and feel of a mic'd up guitar cab in incredible detail. Tones can be captured via low latency USB, XLR D.I. out or headphones, and the units double as a valve interface for recording.

  The 'Dual' pedals offer 2 channels with 2 voices per channel, a patented Infinite Shape Feature (ISF) tone stack, stereo 1/4" headphone output, and a built-in FX loop for seamless integration with a pedalboard or as a flexible backup amp.

  Dept. 10 has won numerous awards including Total Guitar Platinum Award, Total Guitar Gear Of The Year 2021, Premier Guitar Premier Gear, Guitar.com Gear Of The Year and Editor's Choice, Guitarist Gear Of The Year and Gitarist NL Poll Award.
specs: |-
  - ECC83 triode valve running at >200V internally
  - High voltage valve circuit
  - 9V PSU powered
  - Compact pedal format
  - Boost: Class A gain stage, passive James-Baxandall EQ, built-in buffer/line drive
  - Dual Drive / Dual Distortion: 2 channels / 2 voices per channel
  - Dual Drive / Dual Distortion: Patented ISF Tone Stack EQ
  - Dual Drive / Dual Distortion: XLR D.I. Output
  - Dual Drive / Dual Distortion: USB Recording Output
  - Dual Drive / Dual Distortion: Stereo 1/4" Headphone Output
  - Dual Drive / Dual Distortion: FX-Loop
  - Dual Drive / Dual Distortion: CabRig speaker simulator (3 save slots on pedal)
versions:
  - name: Dept. 10 Boost
    description: The ultimate high voltage valve boost pedal. Combining a Class A
      gain stage and natural sounding passive James-Baxandall EQ, this
      class-leading pedal is like adding two extra hot valve stages to your amp.
  - name: Dept. 10 Dual Drive
    description: The best valve drive pedal you will ever own and a world-class
      valve recording preamp – with 3 crunch/overdrive voices alongside the
      clean channel, patented ISF control, low latency USB, XLR out and Dept.
      10's proprietary Cab Rig simulator technology.
  - name: Dept. 10 Dual Distortion
    description: For those requiring higher gain, the Dept. 10 Dual Distortion takes
      things up a notch. A formidable sounding valve distortion pedal and a
      world-class valve recording preamp – with 3 crunch/overdrive voices
      alongside the clean channel, patented ISF control, low latency USB, XLR
      out and Dept. 10's proprietary Cab Rig simulator technology.
