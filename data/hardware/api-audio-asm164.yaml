id: 2sTWYe-8_KLJI0I-Smz6Q
name: ASM164 Summing Mixer
manufacturer: api-audio
primaryCategory: mixer
categories:
  - rack-mount
url: https://apiaudio.com/product/asm164/
description: 16-channel analog summing mixer based on THE BOX console's summing
  section, with API 2510/2520 op-amps, dual stereo program buses (Mix-A and
  Mix-B), per-channel insert points, and external 30W PSU.
details: |-
  1U 16-channel analog summing mixer. 16 balanced inputs via two DB-25
  connectors (8 channels each). External input L/R via XLR. Two stereo program
  buses: Mix-A and Mix-B (each with XLR L/R outputs). Per-channel insert
  send/return (TRS 1/4"). 31-step detented level controls, 4-segment LED channel
  meters, VU output meters. API 2510 input op-amps, API 2520 output op-amps,
  transformer-coupled output. External 30W PSU.
specs: |-
  - Input impedance: 30 kΩ (balanced)
  - Max input level: +25 dBu
  - Max output level: +25 dBu
  - Frequency response: ±0.5 dB (20 Hz–40 kHz)
  - THD+N @ +4 dBu, 1 kHz: <0.02%
  - S/N ratio: −112 dBr
  - Output impedance: 75 Ω (transformer coupled, balanced)
  - Power: 30W external PSU
