description: The Rootmaster RM-300 EVO II delivers Ashdown tone, power, and
  reliability without the weight, tipping the scales at just 2.1kg (4.6lbs)
  while producing 300 watts. It is well suited to practice, rehearsals, and
  small to medium gigs. Passive and active input jacks feed the input control
  and trademark Ashdown VU meter, followed by a Shape button, five-band EQ,
  onboard compressor, valve-emulated drive, and Sub-Harmonic controls (drive and
  sub-harmonic footswitchable via the optional FS2). An onboard headphone preamp
  allows silent practice, and a mute button switches the VU meter from orange to
  blue between sets.
details: |-
  Ultra-lightweight 300-watt bass amplifier head in the Rootmaster EVO II range, weighing just 2.1kg (4.6lbs) and aimed at practice, rehearsals, and small to medium gigs. The preamp provides passive and active input jack sockets for high- and low-output instruments, feeding an input control set against the trademark Ashdown VU meter. Tone features include a Shape button, five-band EQ, onboard compressor, valve-emulated Drive, and Sub-Harmonic controls, with Drive and Sub-Harmonic footswitchable via an optional FS2 footswitch. An onboard headphone preamp enables silent practice, and a Mute button turns the VU meter from orange to blue.
specs: |-
  - Power output: 300 watts
  - Weight: 2.1kg (4.6lbs)
  - Passive and active instrument input jacks
  - 5-band EQ with Shape button
  - Onboard compressor
  - Valve-emulated Drive (footswitchable via optional FS2)
  - Sub-Harmonic controls (footswitchable via optional FS2)
  - Onboard headphone preamp for silent practice
  - Trademark Ashdown VU meter
  - Mute button (VU meter turns from orange to blue)
