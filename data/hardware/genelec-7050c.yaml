name: "7050C"
manufacturer: genelec
primaryCategory: subwoofer
url: https://www.genelec.com/7050c
description: "For those demanding a compact subwoofer with extended LF
  performance, generous SPL and professional bass management, the 7050C is the
  natural choice."
details: |-
  The Genelec 7050C is a compact active studio subwoofer designed to extend the low-frequency performance of nearfield monitors such as the 8010, 8020, and 8030. Built around a 205 mm magnetically shielded driver paired with a 130 W Class D amplifier, it delivers a maximum short-term SPL of at least 103 dB while keeping self-generated noise below 5 dB SPL (A-weighted).

  A laminar spiral enclosure made of MDF with a reflex port enables the 7050C to reach down to 24 Hz (-6 dB) with low distortion. Harmonic distortion stays at or below 4% at 90 dB SPL, measured at 1 m on-axis across the 30 to 85 Hz range, making it well suited to critical music production, post-production, and broadcast monitoring contexts.

  Onboard bass management routes signals through five XLR inputs filtered at 85 Hz, with a dedicated LFE input filtered at 120 Hz, and provides five matching high-pass filtered XLR outputs to drive the satellite monitors. This native multichannel capability allows the 7050C to anchor stereo, surround, and immersive monitoring rigs without requiring an external bass management controller.

  A universal switched-mode power supply accepts 100 to 240 VAC at 50/60 Hz and includes Genelec's Intelligent Signal Sensing (ISS) for low standby consumption of 0.5 W or less. Power draw idles below 11 W and peaks at 150 W under full output, supporting compliance with modern energy regulations.

  Physically the 7050C measures 410 mm high by 350 mm wide by 319 mm deep and weighs 17.3 kg (38.1 lb). The compact footprint, multichannel routing, and refined acoustic design make it a natural partner for desktop nearfield setups that need extended low end and professional bass management.
specs: |-
  - Maximum short-term SPL: ≥103 dB
  - Frequency response: 24 Hz – 85 Hz (-6 dB)
  - Self-generated noise: ≤5 dB SPL (A-weighted) at 1 m on-axis
  - Harmonic distortion: ≤4% at 90 dB SPL, 1 m on-axis, 30–85 Hz
  - Amplifier power: 130 W Class D
  - Driver: 205 mm (⌀) cone, magnetically shielded
  - Enclosure: MDF, reflex port
  - Inputs: 5 × XLR female (10 kΩ balanced) signal inputs, 1 × LFE XLR input
  - Outputs: 5 × XLR male signal outputs
  - Mains voltage: 100–240 VAC, 50/60 Hz
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤11 W
  - Power consumption (full output): 150 W
  - Dimensions (H × W × D): 410 × 350 × 319 mm
  - Weight: 17.3 kg (38.1 lb)
