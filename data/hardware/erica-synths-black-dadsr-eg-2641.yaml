description: The Erica Synths Black DADSR (Delay-Attack-Decay-Sustain-Release)
  is a fully analogue envelope generator that gives you extended control over
  events in your modular synth. It’s a looping exponential envelope generator
  that has voltage control over each stage of the envelope. An independent Gate
  Delay section adds extra functionality to design advanced soundscapes, like
  delayed modulation effects, wave morphing, etc.
details: |-
  The Black DADSR EG is a fully analogue Delay, Attack, Decay, Sustain and Release envelope generator, built to give extended control over events in a modular synth. It is a re-triggerable exponential envelope generator with voltage control over each stage of the envelope.

  An independent Gate Delay section, with a manually controlled delay time of up to 0,7 seconds, adds further scope for advanced soundscapes such as delayed modulation effects and wave morphing. A looping function turns the envelope into a repeating modulation source, and a manual gate button fires it from the panel.

  CV attenuators set how much of an incoming control voltage reaches each stage, over a full sweep of -5V to +5V. Attack runs from 0 to 2,5 seconds and stretches to 4,4 seconds at maximum CV, decay from 0 to 5 seconds and up to 12 seconds, and release from 0 to 4,5 seconds and up to 10 seconds. Sustain level spans 0 to 10V.

  The panel is 10HP wide and the module is 30mm deep. Power consumption is 42mA at +12V and 58mA at -12V.
specs: |-
  - Re-triggerable exponential DADSR envelope generator
  - CV control over each stage
  - Gate delay with a manually controlled delay time
  - CV attenuators
  - Looping function
  - Manual gate button
  - Attack time 0 to 2,5 seconds (4,4 seconds with max CV)
  - Decay time 0 to 5 seconds (12 seconds with max CV)
  - Sustain level 0 to 10V
  - Release time 0 to 4,5 seconds (10 seconds with max CV)
  - Gate delay time 0,7 seconds
  - CV level (full sweep) -5V to +5V
  - Panel width 10HP
  - Module depth 30mm
  - Power consumption 42mA@+12V, 58mA@-12V
