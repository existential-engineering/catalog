description: The DN514 is a four-channel auto-gate optimised for the
  high-channel-count live-sound environment, where drum and percussion mics,
  brass sections and harmony vocals all need gating but adjusting individual
  attack times across 16 or more channels is impractical. It replaces the
  conventional rotary attack control with two semi-automatic attack modes, one
  dedicated to percussion sources.
details: |-
  The DN514 is a four-channel auto-gate aimed at high-channel-count live sound, where drum and percussion mics, brass sections and harmony vocals all need gating but setting individual attack times across sixteen or more channels is impractical. In place of a conventional rotary attack control it offers two semi-automatic attack modes, one of them dedicated to percussion sources.

  Hold time is scaled to the release time setting, so the gate closes reliably without chattering on decaying material. A Sync function interlocks the release times of all four gates, so harmony vocals, brass sections and string groups close together rather than dropping out at different points on a held chord.

  Frequency-conscious gating lets engineers place microphones close together without each mic triggering the others' gates. A Key input on each channel allows the gate to be triggered from a source other than the signal passing through that channel, for rhythmic gating effects or for triggering a tom gate from a kick signal.

  Typical applications include touring drum and percussion gating, sync gating of brass and string sections, and broadcast voice-over ducking through the Key input.
specs: |-
  - Four-channel auto-gate, 1U rackmount
  - Two semi-automatic attack modes, one for percussion
  - Hold time scaled to the release setting
  - Sync interlock across all four gates
  - Frequency-conscious gating with a Key input per channel
  - Gate threshold variable from -40 dBu to +20 dBu
  - Maximum input and output level: +21 dBu
  - Frequency response: 20 Hz to 20 kHz, plus or minus 0.5 dB
  - Noise (EIN): less than -103 dBu with the gate closed, less than -94 dBu with the gate open
