url: https://www.befaco.org/chopping-kinky/
description: Chopping kinky is a voltage controllable dual channel wavefolder.
  As a unique feature, it has a chop out that will choose between both channels.
details: |-
  Chopping Kinky is a voltage controllable, dual channel wavefolder for Eurorack modular synthesizers. Each of the module's two channels has a unique wave folding profile, adding harmonic content to input signals through saturation and folding effects.

  At each input, there are two CV inputs for controlling the level of waveshaping, including one that passes through an attenuverter. This allows expressive, real-time modulation of the wavefolder's character from external CV sources.

  As a unique feature, the module includes a 'chop out' that switches between both channels using a zero-cross detector or an external gate signal. This makes it possible to rapidly alternate between the two distinct wavefolder circuits for complex timbral effects.

  Chopping Kinky is DC coupled, allowing it to be used for both CV and audio duties. It is designed and assembled in Barcelona and is available both as a fully assembled module and as a DIY kit.
