description: >-
  A monophonic analog synthesizer from Italian maker Jen Electronics, designed
  to sit atop an organ and add synthesizer and preset instrument sounds to a
  keyboard player's setup.
details: |-
  Produced from 1978 to 1982, the Jen SX-2000 Synthetone was an analog monophonic synthesizer built with a specific use case in mind: sitting on top of an organ to give keyboardists access to synthesizer sounds without replacing their primary instrument. This organ-top concept was common among Italian keyboard manufacturers of the era.

  The single VCO offered sawtooth, square, and two rectangular waveforms across a four-octave range switchable between 32', 16', 8', and 4' footage settings. The VCF provided cutoff and emphasis (resonance) controls with three preset envelope shapes: repeat, ASR, and AD. The same three envelope presets were available for the VCA section. An LFO with square or triangle waveforms could modulate either the VCO or VCF for vibrato and filter sweep effects.

  Beyond its synthesis capabilities, the SX-2000 included seven preset sounds selectable via red switches: synthy, harpsichord, flute, clarinet, violin, trumpet, and piano. Portamento was available for smooth pitch glides between notes. The 44-key keyboard kept the instrument compact enough for its intended organ-top role. Like many products from Jen Electronics, the SX-2000 has become quite rare and is valued by collectors for its unique Italian sonic character.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth, square, two rectangular waveforms)
  - Octave range: 4 octaves (32', 16', 8', 4')
  - Filter: 1 VCF with cutoff and emphasis; 3 preset envelopes (repeat, ASR, AD)
  - LFO: Square or triangle; modulates VCO or VCF
  - VCA: 3 preset envelope settings (repeat, ASR, AD)
  - Presets: 7 (synthy, harpsichord, flute, clarinet, violin, trumpet, piano)
  - Keyboard: 44 keys
  - Effects: Portamento
  - Memory: None
  - Control: None
releaseDate: "1978"
