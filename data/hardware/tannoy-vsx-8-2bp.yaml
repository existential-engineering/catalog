details: |-
  The VSX 8.2BP is a compact dual 8" 1,600-Watt passive band pass subwoofer for speech and music sound reinforcement in fixed, portable, and touring audio systems. A dual ported band pass system with twin 8" low frequency drivers providing extended low frequency response below 40 Hz. The low distortion band pass design reinforces bass musical instrument frequencies with steep cut-off slopes for effective acoustic transition when used with full-range loudspeakers.
specs: |-
  - type: Passive band pass subwoofer
  - drivers: 2x 8" low frequency drivers
  - powerHandlingContinuous: 400 W
  - powerHandlingPeak: 1600 W
  - impedance: 8 Ohms
  - frequencyResponse: Below 40 Hz
