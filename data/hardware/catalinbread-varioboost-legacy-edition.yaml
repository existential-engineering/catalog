description: The VariOboost Legacy Edition is a reissue of one of Catalinbread's
  oldest pedals, offering 12dB of boost or cut at a user-selectable frequency
  from 70Hz to 1.4kHz. A new Pre control adds a clipping circuit before the
  frequency boost, enabling everything from ultra-clean boosts to convincing
  overdrive tones. Together with the Post volume control, it covers a wide range
  from surgical EQ shaping to full-on amp-pushing gain.
details: |-
  The VariOboost Legacy Edition reissues one of Catalinbread's earliest pedals with an added Pre control. LEVEL boosts or cuts the selected frequency up to 12dB, with a center-detent at noon for a flat response. FREQ selects the target frequency from 70Hz to 1.4kHz. PRE introduces gain with high-threshold soft clipping before the EQ stage. POST provides volume control with high output gain capacity.

  Power accepts 9-18V DC center-negative. Backed by a 3-year warranty.
