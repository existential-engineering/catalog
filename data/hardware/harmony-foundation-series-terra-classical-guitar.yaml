details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra Classical Acoustic delivers a balanced tone with its laminated spruce top and sapele sides and back in an altogether robust build. The lightweight okoume neck helps ensure this nylon-string delivers each note with clarity, articulation and sustain. Solid spruce X-bracing helps to improve sound projection and tonal depth, ensuring your music rings true, whether you're performing in a cozy room or on the stage. The Terra Classical Acoustic comes strung with D'Addario EJ45 Pro-Arte, which offer sweet and mellow highs. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
