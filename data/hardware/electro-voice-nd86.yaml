  detailed vocal reproduction with superior isolation from stage bleed.
  Engineered for lead vocals in large, loud venues where gain before feedback is
  critical.
details: >-
  The Electro-Voice ND86 is a handheld dynamic vocal microphone in EV's N/D
  series, designed for lead vocals in large venues and high-SPL stage
  environments. Its supercardioid polar pattern provides tighter off-axis
  rejection than a cardioid pickup, giving superior isolation from monitor
  wedges, drum kits, and stage bleed for greater gain before feedback.


  A large-diaphragm dynamic capsule delivers a present, smooth, and detailed
  sound tailored to cut through dense live mixes, while a shock-mounted capsule
  minimizes handling noise and low-frequency thumps from the mic body. A
  built-in humbucking coil guards against AC line hum picked up near speaker
  cabinets and stage power, and the Memraflex grille resists denting and stands
  up to rough handling on the road. A high-pass filter and frequency shaping
  help tame proximity buildup and tailor the response for the source.


  The body is built from die cast zinc with a black polyurethane finish for
  durability under stage and touring use. At 182.5 mm tall, 50.5 mm in diameter
  and 0.326 kg, it has the familiar weight and balance of a handheld stage mic.
  Output is via a standard 3-pin XLR connector, with a low-impedance balanced
  signal at 350 ohms suitable for any professional mixer or preamp. The
  microphone is passive and requires no phantom power.
