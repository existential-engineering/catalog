  - Polar pattern: Supercardioid
  - Frequency response: 70 Hz - 17,000 Hz
  - Impedance (low-Z balanced): 350 ohms
  - Open circuit voltage: 2.4 mV/Pa
  - Maximum SPL: >140 dB
  - Connector: 3-pin XLR
  - Power requirement: Passive
  - Form factor: Handheld
