details: |-
  The Chandler Limited Germanium Tone Control is a discontinued (as of March 2018) outboard equalizer built around the same GERMANIUM amplifier circuit developed for the Germanium Pre Amp/DI. It combines active and passive EQ circuits in a single mono channel, inheriting the Feedback and Drive controls found on the preamp.

  All EQ bands use inductors, contributing to the fattest, smoothest tonal character possible. The passive low-frequency section can be switched between Pultec/Lang interactive curves and a more standard low-frequency curve with pass filter. The Treble and Presence bands are active and voiced to evoke classic British equalizers.

  The unit features selectable output impedance (200 or 600 ohms) and a stereo link capability via a standard 1/4-inch jack. All I/O is via XLR with transformer-balanced, custom-wound transformers (pin 2 hot). Power requires the external Chandler PSU-1 supply (purchased separately).

  The Germanium Tone Control received enthusiastic reviews from the professional engineering community, earning coverage in Tape Op (Nov/Dec 2006), Sound on Sound (Nov 2007), and Recording Magazine (2007). Notable engineers including Joe Barresi, Michael Brauer, Billy Bush, Ryan Hewitt, and Matthew Sweet have praised its musical low-end character.
