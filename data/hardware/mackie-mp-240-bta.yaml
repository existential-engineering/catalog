url: https://mackie.com/en/products/in-ear-monitors/mp-series-in-ear-monitors/MP_240_BTA.html
description: "Dual Hybrid Driver Professional In-Ear Monitors with Bluetooth
  Adapter. When you need to hear yourself and everything else as clearly as
  possible on stage, in-ear monitors are the ultimate solution."
details: |-
  Mackie applies decades of loudspeaker design heritage to in-ear monitors. Precision-tuned drivers, ergonomic design, and rugged construction ensure you'll never miss a beat on stage.

  The MP-240 BTA features a hybrid dual-driver design combining a dynamic driver for lows with a balanced armature for mids and highs, delivering deep, punchy bass with precise clarity. Ergonomically molded, low-profile enclosures and an over-ear cable routing provide a secure, comfortable fit while isolating up to 40dB of ambient noise.

  The included MP-BTA Bluetooth 5.0 adapter snaps onto the swiveling MMCX connectors for wireless playback from phones and other Bluetooth-enabled devices, with an in-line microphone for calls and music playback controls. The shielded, braided cable, three ear tip styles (foam, silicone, double flange) in three sizes, a hard molded carrying case, and a gold-plated 1/8" to 1/4" adapter are all included.
specs: |-
  - Hybrid dual driver: single dynamic + single balanced armature
  - Frequency response: 20 Hz – 20 kHz
  - Impedance: 32 Ohms
  - Sensitivity: 94dB ±3dB @ 1mW at 1kHz
  - Sound isolation: up to 40dB
  - Ergonomically molded low-profile enclosure
  - Shielded, braided cable with swiveling MMCX connectors
  - Over-ear cable routing
  - Three ear tip types (foam, silicone, double flange) in three sizes
  - MP-BTA Bluetooth 5.0 adapter included
  - In-line microphone and music playback controls on Bluetooth adapter
  - Hard molded carrying case included
  - Gold-plated 1/8" to 1/4" adapter included
