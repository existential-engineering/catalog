id: IMF1OfXfPV38YR8D-UByF
name: "231s"
manufacturer: dbx
primaryCategory: equalizer
url: https://dbxpro.com/en/products/231s
description: Dual Channel 31-Band Graphic Equalizer with XLR and TRS
  connectivity, switchable ±6/±12 dB ranges, and >112 dB dynamic range.
details: |-
  The dbx 231s represents over four decades of professional audio equalization expertise, serving as the industry standard for touring, studios, and installed sound systems. This dual-channel graphic equalizer combines straightforward controls with professional-grade performance, making it suitable for the most demanding sound reinforcement environments.

  Equipped with dual 31-band channels of 1/3-octave equalization, the unit delivers ±12 dB input gain and switchable ±6 dB or ±12 dB boost/cut ranges. The 231s features 20 mm nonconductive sliders, an intuitive user interface, and 4-segment LED output level metering for precise gain control.

  Designed for portability and touring applications, the 231s provides an extended 10 Hz to 50 kHz frequency response and typically >112 dB dynamic range. Its robust construction ensures reliable performance and exceptional sound quality across diverse professional audio applications.
specs: |-
  - Input Connectors: 1/4" TRS (female), XLR (female, pin 2 hot)
  - Input Impedance (Balanced): 40k ohm
  - Input Impedance (Unbalanced): 20k ohm
  - Max Input Level: >+21 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: 1/4" TRS (male), XLR (male, pin 2 hot)
  - Output Impedance (Balanced): 100 ohm
  - Output Impedance (Unbalanced): 50 ohm
  - Max Output Level (2k ohm): >+21 dBu
  - Max Output Level (600 ohm): >+18 dBm
  - Bandwidth: 20 Hz to 20 kHz, +0.5/−1 dB
  - Frequency Response: <10 Hz to >50 kHz, +0.5/−3 dB
  - Dynamic Range: Typically >112 dB
  - Signal-to-Noise Ratio: Typically >95 dB
  - THD+Noise: <0.003%
  - Interchannel Crosstalk: <−90 dB, 20 Hz–20 kHz
  - EQ Channels: Dual 31-band, 1/3-octave Constant Q
  - EQ Range: ±6 dB or ±12 dB switchable
  - Low Cut Filter: 50 Hz, 12 dB/octave high-pass
  - Operating Voltage: 100–240 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 3.5" H × 19" W × 6" D
  - Weight: 6.2 lbs (2.81 kg)
