details: |-
  The Martin D-15M is part of Martin's 15 Series, pairing the company's iconic D-14 fret Dreadnought body with all-solid mahogany construction. The result is a bold, balanced voice with a strong low end and warm midrange that has made all-mahogany Dreadnoughts a long-standing staple in the Martin lineup.

  The top, back, and sides are all crafted from solid mahogany finished in a deep, dark mahogany stain with a satin finish that lets the wood breathe and age naturally. Non-scalloped spruce X-bracing supports the top for a punchy, focused tone that holds up well to flatpicking and strumming alike.

  The select hardwood neck is shaped to Martin's Modified Low Oval profile with a standard taper, joined to an East Indian rosewood fingerboard inlaid with diamond and square abalone markers. The 25.4-inch scale, 1-11/16" nut width, and modern belly-style rosewood bridge with a compensated bone saddle give the D-15M comfortable, familiar playability.

  Ping nickel open-gear tuners with black knobs complete the vintage-inspired aesthetic. The guitar ships with Martin Authentic Acoustic Lifespan 2.0 phosphor bronze medium strings in a softshell case with backpack-style straps. Optional factory electronics packages (L.R. Baggs Anthem, Fishman Gold+Plus Natural, Fishman Matrix Infinity) are available as upgrades, but the standard D-15M is a pure acoustic instrument.
specs: |-
  - Body shape: D-14 Fret Dreadnought
  - Top: Solid mahogany (Dark Mahogany)
  - Back and sides: Solid mahogany (Dark Mahogany)
  - Bracing: Non-scalloped spruce X-brace
  - Finish: Satin (top, back, sides, neck)
  - Neck material: Select hardwood (Dark Mahogany)
  - Neck shape: Modified Low Oval with standard taper
  - Fingerboard: East Indian rosewood
  - Scale length: 25.4"
  - Nut width: 1 11/16"
  - Fingerboard width at 12th fret: 2 1/8"
  - Frets: 20 (14 clear of body)
  - Bridge: East Indian rosewood, modern belly style
  - Saddle: Compensated bone, 16" radius
  - Tuners: Ping nickel open-gear with black knobs
  - Inlays: Diamonds and squares (abalone)
  - Pickguard: Tortoise pattern or black (availability varies)
  - Strings: Authentic Acoustic Lifespan 2.0 phosphor bronze, medium
  - Case: Softshell with waterproof backpack-style straps
  - Electronics: None standard (optional upgrades available)
