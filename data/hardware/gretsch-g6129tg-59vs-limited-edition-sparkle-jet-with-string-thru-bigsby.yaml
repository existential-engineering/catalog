details: |-
  Inspired by the pivotal and prolific years of Gretsch's 1950s and early '60s golden age, Vintage Select Edition guitars are designed for players who appreciate the finest in musical instrument heritage. The Limited Edition G6129T-59VS Red Sparkle Jet pays sparkling homage to that great legacy.

  The Sparkle Jet is a glitzed-up and time-honored version of the Gretsch Duo Jet model, with signature power and punch coming from its chambered mahogany construction, which magnifies harmonic richness by letting air resonate between the top and body for livelier and more articulate tone.

  The original Filter'Tron pickup was invented by the legendary Ray Butts and was originally called 'Ful-Fidelity' in his technical journals. Built according to the specification found in Ray's personal notes and designs.
