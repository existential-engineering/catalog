description: A high-power distribution amplifier, with two channels, DSP for
  product optimization and dynamic EQ for subwoofers.
details: |-
  CDA-2HD distribution power amplifier can drive any Bowers & Wilkins custom installation speaker to new heights of performance. Offering 2 channels of high quality amplification, the CDA-2HD offers your home speaker system a powerful upgrade yet takes up minimal space thanks to its compact 2U, half width design. CDA-2HD configuration also supports bridging of its Class D stereo channels into even more powerful mono outputs, if needed.

  Features listed by the manufacturer are 2 channel amplification with 500 watts per channel delivering high-resolution audio, engineering to work with Bowers & Wilkins installation speakers and subwoofers, left and right outputs that can be bridged to provide a mono output of double the power at 1,000 watts, three power mode control options (on, auto detect or 12V trigger), protection features preventing damage due to overload, short circuits or heat, a Product Configuration page for customisable setup, and Audio Video Bridging (AVB) compatibility when two or more Bowers & Wilkins CDA amplifiers are connected to the same wired network using AVB enabled network hardware.

  CDA-2HD can be easily set up via the Product Configuration page, which allows customisable complex DSP tuning. The configuration page exposes an 8 band parametric EQ (filter types parametric, high shelf and low shelf), High Pass and Low Pass crossover filters, and a delay adjustment shown in milliseconds, feet or meters with a minimum of 0.01 milliseconds and a maximum of 20 milliseconds. Each CDA DSP amplifier is also loaded with Bowers & Wilkins speaker presets, selectable from Speaker Mode, Subwoofer / Bridge Tied Load Mode and CT800 Mode.

  The rear panel carries a power input socket (IEC C14), a reset button, a Gigabit-only Ethernet (RJ45) socket, 12V trigger in and out, digital inputs, analogue inputs and the speaker outputs. A network connection is mandatory for setup and configuration. Speakers connect through a Neutrik SpeakOn connector, and speakers can also be wired to bridge into a single channel to increase the power available to a single speaker, in which case the minimum load impedance is 8 ohms.

  The amplifier is intended for installation in a standard 19-inch equipment rack and is supplied with two rack mounting ears, though not with rack mount bolts and nuts. A link bracket is provided so two CDA-2HD units can be mounted side by side. It can also be table mounted using the supplied feet and feet screws. In either case the ventilation apertures must be left unobstructed, with at least 50mm (2in) clear at the sides.
specs: |-
  - Description: 2-channel Class D distribution power amplifier, half-rack width, 1U (2U with feet)
  - Load impedance range: >3Ω per channel (>6Ω in bridge mode)
  - Output power per channel, non-clipped: 250W into 8Ω, 500W into 4Ω
  - Output power bridge mode, non-clipped: 1,000W into 8Ω
  - Output power total, all channels: 1,000W short term, >250W continuous
  - DC offset voltage: <50mV
  - Frequency response (-3dB): <10Hz to >30kHz, any load impedance
  - Frequency response accuracy 20Hz to 20kHz: +/-1dB
  - Dynamic range: >85dB A-weighted
  - THD+N (1kHz, 500W, 4Ω): less than 1%
  - Voltage gain: 21dB to 45dB, adjustable
  - Input impedance: 10kΩ
  - Maximum input voltage: 4 Vrms
  - Signal sense threshold: 2.5mV (independent of gain setting)
  - Wake-up time: <0.2s if other zones active, <2s from all zones inactive
  - Turn-off time: 15 minutes from last signal detected
  - 12V trigger input threshold: typically 3V (recommended input is 5 to 15V)
  - Front panel indicators: 1x power LED, 1x network status LED, 1x zone status LED
  - Rear panel controls: reset button
  - Input connectors: 1x RCA (pair) phono socket analogue line in, 1x RCA phono socket digital line in, 1x Ethernet
  - Output connectors: 1x SpeakOn
  - 12V trigger control: 1x 3.5mm jack in, 1x 3.5mm jack out (maximum 100mA pass-through)
  - DSP: 8 band parametric EQ, high pass and low pass crossover filters, 0.01 to 20ms delay, Bowers & Wilkins speaker presets
  - Audio Video Bridging (AVB) compatible between Bowers & Wilkins CDA amplifiers on an AVB enabled wired network
  - Power consumption: <0.5W standby, 200W maximum average, 2,800W peak
  - AC supply: 100-240V 50/60Hz
  - AC inlet: IEC C14, switched
  - Thermal dissipation: 1.7 BTU/hr standby, 150 BTU/hr idle, 850 BTU/hr max
  - Dimensions: Height 85mm (3.4in) 1U, 100mm (3.9in) plus feet, Width 218mm (8.6in), Depth 315mm (12.4in) [323mm (12.7in) in the manual and dimension drawing]
  - Rack width with ears: 482mm (19in)
  - Net weight: 3.4kg (7.5lb)
  - Finish: Black
