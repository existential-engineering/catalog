description: "Looking for exceptional sound over IP? The 4430A offers power,
  audio and loudspeaker management via a single standard CAT cable, delivering
  unrivalled flexibility, cost-effectiveness and simplicity of installation."
details: |-
  The Genelec 4430A is a Smart IP installation loudspeaker that delivers power, audio and loudspeaker management over a single standard CAT cable. By combining Power over Ethernet (PoE) with networked audio over IP, it dramatically simplifies fixed installation work in venues such as restaurants, retail spaces, museums, hotels and corporate environments, where running long parallel cable runs for power and balanced audio is otherwise costly and disruptive.

  Despite its compact die-cast aluminium enclosure - 285 mm tall, 189 mm wide and 178 mm deep at 5.1 kg - the 4430A produces uncompromised SPL and acoustic performance. A 130 mm cone woofer and 19 mm metal-dome tweeter are each driven by 50 W of Class D amplification, yielding a frequency response of 58 Hz to 20 kHz (±1.5 dB), short-term maximum output of ≥104 dB SPL and peak output of ≥107 dB SPL at 1 m. Self-generated noise sits at ≤5 dB(A), making the speaker suitable for quiet listening environments as well as more demanding background and foreground music applications.

  On the networking side, the 4430A is fully compatible with both Dante and open AES67 streaming, with a single RJ45 connector carrying both audio and PoE/PoE+ power. A secondary Euroblock analog input is provided for installations that still need a balanced line connection. The internal Intelligent Signal Sensing (ISS) circuit drops idle power consumption to ≤4 W, and the unit only draws around 25.5 W at full output - well within standard PoE+ (IEEE 802.3at) budgets.

  Configuration is handled by Genelec's Smart IP Manager software, which discovers connected loudspeakers on the network and lets installers organise them into an effectively unlimited number of rooms, zones and audio channels. Per-room and per-speaker EQ, level, delay and grouping can be applied, and the system continually reports status so faults can be diagnosed remotely without sending an engineer on site.

  The 4430A ships with a simple bracket, mounting screw set and 3-position terminal block, and is offered in standard black or white as well as over 120 custom RAL colours and a raw aluminium finish, so it can be specified to match almost any interior. Like every Genelec product it is manufactured in Iisalmi, Finland using certified sustainable methods, and is engineered for decades of reliable service in fixed installation work.
specs: |-
  - Frequency Response: 58 Hz - 20 kHz (±1.5 dB)
  - Low Cutoff: 45 Hz (-6 dB)
  - High Cutoff: 39 kHz (-6 dB)
  - Peak SPL: ≥107 dB
  - Short Term Max SPL: ≥104 dB
  - Long Term Max SPL: ≥96 dB
  - Self Generated Noise: ≤5 dB(A) at 1 m
  - Harmonic Distortion: 50-200 Hz ≤2%; >200 Hz ≤0.5%
  - Group Delay: 2.3 ms (high frequencies)
  - Crossover Frequency: 2900 Hz
  - Bass Amplifier: 50 W Class D
  - Treble Amplifier: 50 W Class D
  - Woofer: Ø130 mm cone
  - Tweeter: Ø19 mm metal dome
  - Enclosure Material: Die-cast aluminium
  - Enclosure Type: Reflex port
  - Height: 285 mm
  - Width: 189 mm
  - Depth: 178 mm
  - Weight: 5.1 kg (11.2 lb)
  - Power Over Ethernet: PoE+ (IEEE 802.3at, 30 W recommended) / PoE (IEEE 802.3af, 15 W)
  - Network Audio: AES67 / Dante over RJ45
  - Analog Input: Euroblock, 10 kOhm balanced
  - ISS Active Power Consumption: ≤4 W
  - Idle Power Consumption: ≤5 W
  - Full Output Power Consumption: 25.5 W
