description: Vintage Compressor with Blend 1962 British Amp – Katana Clean Boost
  Red Dirt – Mid-Voiced Saturation
details: |-
  The Tone Workstation is a three-section front-end pedal combining compression, a British amp style overdrive with a clean boost, and a mid-voiced overdrive, intended as the first stage of a pedalboard. The 2016 version is a re-engineered and smaller redesign of a small batch Keeley built a decade earlier.

  The first section is the Keeley Compressor. The Sustain control sets the amount of compression, so notes ring out longer as it is raised, and the Blend control mixes the compressed signal back against the dry guitar, from fully compressed at the counter-clockwise extreme up to a 50/50 ratio. Blend is offered as a way to return attack to high-output pickups or humbuckers, and a Treble Boost switch adds treble and sparkle under heavy compression. Attack and release times are fixed and set for either humbuckers or single coils.

  The second section is the 1962 and Katana Boost channel. The 1962 is a British amp style overdrive based on the Blues Breaker, full and even with moderate crunch, with Katana Boost stages on either side of it adding saturation through Keeley's JFET valve simulation. Flicking the channel switch to Katana mode gives the clean boost alone, where only the volume control is active and Tone and Drive are disabled.

  The last section is the Red Dirt overdrive, a tube-screamer derived circuit with a JFET front end, a pronounced midrange and a gain range running from clean to heavily saturated. The enclosure is 4.7 inches wide by 3.72 inches tall and the pedal needs a standard 9V negative-tip supply drawing under 50mA.
