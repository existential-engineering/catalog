description: >-
  The Suzuki QChord QC-1 is a digital electronic instrument from Suzuki's Omnichord series
  that combines a touch-sensitive strum plate, chord buttons, and a rhythm section into a
  portable, easy-to-play package. It offers 100 instrument voices, 84 chord combinations,
  and built-in accompaniment features, making it accessible to beginners while remaining
  expressive for experienced musicians.
details: |-
  The QChord QC-1 is the modern successor to Suzuki's iconic Omnichord line, designed as an electronic instrument that bridges the gap between a basic keyboard and an electric guitar. Its three distinct sections — a touch-sensitive strum plate, a rhythm section, and chord buttons — can be used independently or in combination, giving players a wide range of musical possibilities in a compact form factor.

    The strum plate is engineered so that it prevents wrong notes, meaning the instrument always sounds in tune regardless of the player's skill level. By pressing a chord button and strumming across the touch plate, users can produce soothing melodic sounds suitable for accompaniment. A pitch bend wheel adds further expressiveness to performances.

    With 100 selectable instrument voices and 84 chord combinations, the QChord provides considerable sonic variety. Songs can be customized using sustain, volume adjustments, different rhythms, and various voices. Suzuki also released dedicated song cartridges that allow users to play and sing along to a variety of popular songs. Despite its toy-like appearance, the QChord delivers surprisingly high sound quality and a rewarding playing experience, particularly for those with some understanding of music theory.
specs: |-
  - Polyphony: 2 voices
    - Multitimbral: 1 part
    - Oscillator: 1 VCO, ROM waveforms
    - Instrument Voices: 100
    - Chord Combinations: 84
    - Effects: Vibrato, Reverb, Fills
    - Keyboard: 37 keys
    - Memory: 100 patches (RAM)
    - Connections: MIDI In/Out, USB
    - Display: 2-digit LCD, 2-LED light bar, 12 LEDs
releaseDate: "2000"
