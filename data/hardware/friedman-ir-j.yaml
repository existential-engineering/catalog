description: The Jake E Lee signature dual-channel all-tube preamp and DI pedal,
  built around the JEL-100 and JEL-20 voices with impulse response cabinet and
  power amp simulation on board.
details: |-
  The Friedman IR-J dual-channel tube preamp is an entire Friedman rig in a compact pedalboard-friendly package. Powered by two high-voltage 12AX7 preamp tubes, each channel delivers the harmonic richness and touch response of Dave Friedman's finest designs, and the controls are kept simple, with no menus and no hundred-page manual to work through.

  Jake E Lee ranks high on the shortlist of influential guitarists who emerged as the heroes of a new generation in the early '80s, known for his burning guitar work and innovative songwriting on two of Ozzy Osbourne's most revered albums, 1983's Bark at the Moon and 1986's Ultimate Sin. Through Badlands and more recently Red Dragon Cartel, Lee's playing has embraced the athleticism of the '80s while staying rooted in the hard rock fundamentals of the '70s. Following the JEL-100 and JEL-20 signature heads, Lee and Dave Friedman worked together again on the IR-J, a signature all-tube direct solution that offers those tones in a pedalboard-friendly format.

  IR-J is not simulating a Friedman tube preamp, it is one. Where other preamp pedals use a tube to warm up a digital or solid-state circuit, two glowing 12AX7 preamp tubes running at over 300 volts are the IR-J's beating heart, so it delivers the tone, response, gain characteristics and harmonic complexity expected of a Friedman design. Two independent channels based on the JEL-100 and JEL-20 each carry their own TS-style boost.

  DSP impulse response cabinet and power amp simulation sends a studio-quality mic'd-up tone to a DAW or to front of house, and eighteen free Friedman IRs are included, with the option to load your own. The included editor software, powered by Synergy, tweaks each channel's power amp simulation through the Thump, Presence and low-pass filter controls, loads IRs, activates the Boost Lock feature, switches the effects loop on and off and saves it all to 128 MIDI presets.

  IR-J is MIDI-capable, so channels and presets can be recalled from a pedalboard controller or from a laptop running a whole show. Its transparent and programmable effects loop integrates favorite effects into anything from the most straightforward setup to a complex digitally controlled rig.
specs: |-
  - Jake E Lee signature
  - All-tube high-voltage preamp and DI
  - 2 x 12AX7 preamp tubes running at over 300 volts
  - Two independent channels with a TS style boost per channel, based on Friedman's JEL-100 and JEL-20 designs
  - MIDI programmable channel select and boost, IR select, Thump, Presence and low-pass filter, effects loop on/off and Boost Lock
  - Power amp simulation with software editable Presence, Thump and low-pass filter per channel
  - Low latency impulse response cabinet simulation, bypassable
  - Three position CAB/IR select switch per channel, programmable via software
  - 18 free Friedman IRs or load your own
  - Boost volume on top, with volume (gain amount) and tone controls per channel on the side panel
  - Volume and gain controls per channel
  - Full EQ consisting of bass, middle and treble per channel
  - 3-way Bright switch per channel
  - 2-way Gain switch on channel 2
  - Three multi-function foot switches
  - Ultra-transparent series FX loop, bypassable
  - TRS balanced output
  - Headphone output
  - MIDI 5-pin standard connector and USB MIDI
  - USB software editor, powered by Synergy
  - Universal 12V power supply included
  - 6 foot USB 2.0 A male to B male cable included
  - Limited 3-year warranty
  - Dimensions including knobs: 5.5 in (D) x 6.5 in (W) x 2.3 in (H)
  - Weight: 1.5 lbs
