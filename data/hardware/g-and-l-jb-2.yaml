details: |-
  Players fond of the old adage "if it ain't broke" have not played a JB•2. The G&L JB•2 is all about refinement, blending "holy grail" Alnico single-coil tone with modern Leo Fender improvements.

  The JB•2's classic Alnico V pickups have tone reminiscent of the best examples from the early '60s, thanks to the work of Paul Gagon, G&L VP Engineering. Gagon found his inspiration reviewing original prints stored in Leo Fender's private laboratory at G&L, but that was just the start. About 30 years ago, Gagon was an R&D engineer at another company when he was tasked with finding out what was so special about the early bolt-on basses many players raved about. Gagon tirelessly analyzed many examples of what were considered holy grail basses, spending time out on the shop floor talking to builders still working in the pickup department since the '50s, all on a quest to discover where the real mojo was, and was not. What he learned from the builders matched his own engineering analysis. Back in the day, the actual spec of pickups coming down that old production line varied considerably. That meant coming up with the right specs was more challenging than simply following the prints, and Gagon's persistence paid off as the JB-2 serves up delicious, classic tone.

  While the pickups are the origin of the tone, the JB•2 offers a clarity and sustain unmatched by old basses with their rudimentary bridge design. The JB•2 features an innovative G&L Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument, a brilliant mash-up of old-school and new-school Leo.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: 2x G&L Alnico single coil pickups
  - Body wood: Poplar, or Swamp Ash top over Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 1/2"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 21 medium jumbo, nickel
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: One volume control for each pickup, master tone
  - Available in: Sonic Blue over Poplar, Rosewood fingerboard
  - Available in: 3-Tone Sunburst over Swamp Ash top on Poplar, Maple fingerboard
  - Available in: Shell Pink over Poplar, Maple fingerboard
