description: MiniBrute 2 has evolved from the legendary monosynth that revolutionized the
  analog scene with its mixable waveforms, Steiner-Parker filter, and Brute
  Factor. Now with semi-modular architecture, you can splice its genome and
  expand its raw power into the world of Eurorack modular.
details: |-
  Born from the lineage of its predecessor, minibrute 2 is an adaptable, dynamic synth with semi-modular architecture and huge connectivity. A synthesizer that would sound huge and yet be compact, self-contained and versatile. An instrument that would be both comprehensive and evolving.

  Looking a bit further, beyond the usual modulation sources and controls, youll notice some exciting, unexpected features: a second vco; a second lfo; new vco and filter frequency modulation possibilities; modifier-related modulation destinations; a brand new, loopable ad envelope. Once tamed, this little beast will reveal the full range of its vocalizations, including raging leads and piercing sequences, as well as smooth pads and purring bass.

  Thanks to its massive CV/gate patch bay, you will be able to reinvent and restructure your minibrute 2 at any time. The synth is semi-modular, even with no patch leads connected, and each of its features has already been cleverly, inspiringly routed. If you want to start dissecting the sound and experimenting, you will find direct, 100% safe access to the minibrute 2s genetic code on the right of its front panel.

  Sporting a high quality, aftertouch-enhanced 25-key keyboard, an inspiring arpeggiator, and a smart and effective sequencer. Once minibrute 2 has staked its claim as head of the pack, you can use the exclusive link system to connect it to a rackbrute, set it up in different configurations, and start gathering eurorack modules within a perfectly fitted and ultra-solid case.
specs: |-
  - Vco1 with sawtooth, pulse, triangle waves
  - Ultra saw modifier
  - Metalizer modifier
  - Direct FM control
  - Vco2 with sine, saw, square waveforms
  - Three tuning ranges
  - VCO 2 to 1 hard sync
  - Vco1 linear and exponential FM
  - White noise generator
  - Steiner-parker multimode filter
  - Low pass, high pass, band pass, notch modes
  - 12db per octave filter
  - Resonance with self-oscillation
  - ADSR type envelope generator
  - Ad envelope with trig and gate modes
  - One shot or loop modes
  - Attack and decay times CV controllable
  - Brute factor modulator
  - Ad, ahr, or loopable envelope generation
  - 48-point CV and gate patchbay
  - Utility modules: inverter, attenuators, VCA
  - Two LFOs with 6 waveforms each
  - LFO sync to sequencer
  - 25-key velocity-sensitive keyboard
  - Aftertouch support
  - Octave buttons with up to 5 octaves transposition
  - Arpeggiator modes: up, down, inclusive, exclusive, random, note order, double up, double down
  - 8 step-sequences
  - Up to 64 steps per sequence
  - Rest, tie, and legato note entry
  - MIDI clock sync over USB and MIDI in
  - Mod wheel destinations
  - Aftertouch destinations
  - Pitch bend control
  - Line and headphones outputs
  - Semi-modular architecture
  - Eurorack modular compatibility
  - Size: 75 x 484 x 336 mm
  - Weight: 4.82 kg
