  - rack-mount
url: https://www.crownaudio.com/en-US/products/i-tech-9000hd
description: Two-channel, 3500W @ 4Ω touring power amplifier featuring BSS
  OMNIDRIVEHD DSP processing and advanced patented power supply design for
  professional live sound applications.
details:
  - The I-Tech 9000HD is Crown's flagship tour-sound power amplifier, delivering
    3500 watts per channel at 4 ohms in a 2RU chassis. It is designed for the
    most demanding professional touring and large-format installed sound
    applications, with five patents covering breakthroughs in power supply
    efficiency and reliability.
  - Integrated BSS OMNIDRIVEHD processing brings linear-phase FIR filters,
    multi-band crossovers, parametric EQ, and LevelMAX limiters directly into
    the amplifier, eliminating the need for an external loudspeaker controller
    in many systems. Onboard DSP is configured and monitored via HiQnet System
    Architect over Ethernet.
  - Multiple input options including analog, AES/EBU, and CobraNet (depending on
    configuration) feed the I-Tech 9000HD, making it equally at home in
    fixed-install and rapid-deploy touring rigs. A 20A IEC inlet keeps power
    distribution simple in large racks.
specs: |-
  - 2 channels
  - 3500W per channel @ 4Ω
  - Sensitivity: 1.4Vrms to 7.75Vrms
  - THD: <0.1%
  - Signal-to-Noise Ratio: >112dB
  - Frequency Response: ±0.25dB
  - Crosstalk: >80dB
  - Common Mode Rejection: >70dB typical
  - BSS OMNIDRIVEHD DSP with FIR filters and LevelMAX limiters
  - Network control via HiQnet System Architect (Ethernet)
  - Dimensions: 89mm × 483mm × 411mm (3.5" × 19" × 16.2")
  - Weight: 12.7kg (28 lbs)
  - Power: 20A IEC inlet
