details: |-
  This is the classic Keeley 4 Knob Compressor in an enclosure hand painted by Arlon Prince. The circuit is unchanged from the standard pedal, which is hand built in the USA and took Guitar Player magazine's Editor's Pick award along with a Reader's Choice award for stompbox. Keeley describes it as an audiophile and studio-grade compressor with rack mount quality in a stompbox enclosure.

  The compressor carries an internal Attack control intended for bass players with high-output active pickups or active pedalboards with buffers. A later revision of the design added an input sensitivity control, which allows the pedal to be used with keyboards, drum machines, drum mics, master recordings and other line-level sources.

  Switching is true bypass through a triple pole double throw switch, giving a clean unaffected signal in bypass, with an LED for effect indication. The circuit uses metal film resistors and capacitors, and transistors hand matched to better than 1% tolerance so the compressed signal stays free of unwanted distortion. It runs from a 9V battery or a standard 9V DC adapter at a 5mA current draw.
