description: The S12.4 powered studio subwoofer builds upon KRK's legacy for
  sonic accuracy and stellar performance. The custom-made, Kevlar woofer
  delivers ultra-tight, defined bass, while the Class-D power amplifier
  dramatically increases transient response, control, and punch.
details: |-
  The S12.4 powered studio subwoofer builds upon KRK's legacy for sonic accuracy and performance. The custom-made Kevlar woofer delivers ultra-tight, defined bass, while the Class-D power amplifier dramatically increases transient response, control and punch. The four-position selectable crossover lets you adjust the subwoofer setting easily to your existing monitors.

  Pairing the S12.4 with KRK or another studio monitor delivers an optimized listening and mixing experience with extended low end, while the exclusive bypass-control feature provides full range audio to the monitors without switching off the subwoofer.

  Bypass Footswitch

  The bypass footswitch control mutes the subwoofer and sends full-range audio to the monitors. The footswitch is optional and not included.

  Heavy Duty Enclosure

  Reinforced MDF construction for strength and durability.

  Front-firing Port

  The front-firing port provides low frequency extension while reducing boundary coupling, and its shape is optimized to avoid port turbulence.

  Crossover and High-pass Filter

  A dedicated crossover and optional high-pass filter bypass suit the subwoofer to powered monitors, for mixing and mastering, sound design, broadcast and production work.
specs: |-
  - Configuration: Front Loaded, Vented Subwoofer
  - System Type: Active Subwoofer
  - Low-Frequency Transducer: 12" Kevlar Aramid Composite Woofer
  - Frequency Response: 26Hz - 97Hz
  - Max Peak SPL: 119.9 dB
  - Amplifier: Class D
  - Power Output (Continuous): 220 Watts @ 1% THD+N @ 44Hz
  - Signal to Noise Ratio: 92 dB
  - Amplifier Distortion (THD + N): <= 0.3% @-3dB Of Max Power Output 29Hz-97Hz
  - Input Impedance: 9.4 KΩ Balanced, 9.2 KΩ Unbalanced
  - Ground Lift: On/Off
  - HPF Bypass: With Footswitch Only
  - Footswitch: Optional
  - Indicators: Power/Standby
  - Input Connectors: XLR, 1/4" TRS and RCA, left and right
  - Footswitch Input: 1/4"
  - LFE Input: Balanced TRS
  - Output Connectors: XLR, 1/4" TRS and RCA, left and right
  - AC Power Input: Selectable 110V-120V / 220V-240V
  - Four-position selectable crossover control
  - Polarity and input sensitivity controls
  - Enclosure: 18mm Reinforced MDF
  - Finish: Black Vinyl Wrap, Baffle - Black Paint
  - Hardware: EVA Isolation Pad
  - Dimensions (H x W x D): 16.375" (416 mm) x 23.875" (606 mm) x 14.375" (365 mm)
  - Weight: 62.5 lb. (28.3 kg.)
