details: |-
  The G&L ASAT Classic is Leo's final word on the traditional single-cutaway bolt-on axe, and the semi-hollow version takes it further with G&L's distinctive twin voice chambers and f-hole added to a beautiful swamp ash body. Framed in a classic boxed-steel bridge, the single-coil Magnetic Field Design bridge pickup created by Leo Fender delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the single-coil MFD neck pickup opens a delectably rich tonal palette, from round clean jazz tones to thick, gritty blues. The semi-hollow body brings a certain "hi-fi" quality to the tone, softening the attack and slightly scooping the mids for accentuated highs and lows. The ASAT Classic Semi-Hollow's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Semi-Hollow Swamp Ash
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
