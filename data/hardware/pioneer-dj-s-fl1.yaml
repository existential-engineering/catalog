details: |-
  Pioneer has created a slim design speaker by using NXT™ SurfaceSound™, based on Distributed Mode Loudspeaker technology.

  The S-FL1 flat panel speaker is designed for easy installation, providing high quality omni directional sound, making it ideal for architectural installations, stylish bars and cutting edge mobile DJs. 

  They're also ideal for press conferences, graduations and corporate events where a variety of people will make presentations to a large audience.
