description: Have an old-school, vintage look and the lightest trap case imaginable.
details: |-
  A scaled down version of the popular line-up of 6000 Series retro-styled, flush-base hardware, 6000 Series Ultralight stands utilize smaller diameter, lighter gauge steel tubing and a low mass tube joint for optimal portability.

  Other marquis features include a new Glide Tilter for exacting adjustment of cymbal and snare drum angles. An "old-school" snare basket design gets a modern, spring-loaded make over, and the hi-hat stand is as smooth and effortless as its 6000 cousin.

  Ultralight hardware is perfect for bop kits, vintage sets and gigging drummers everywhere.
