url: https://www.klarkteknik.com/en/products/0821-ABS
description: The DN3600 is a programmable, automation-capable graphic equaliser
  that brought the DN-series third-octave EQ into the era of recallable
  settings, MIDI control and venue-wide automation. It was aimed at touring
  engineers, theatre sound designers and installation specialists.
details: |-
  The DN3600 stores complete EQ snapshots that can be recalled instantly from the front panel, by MIDI, or remotely via the DN3603 docking station and the DN3698 handheld remote. For a touring engineer setting up six venues in nine days that is the difference between guessing and knowing, and for a theatre sound designer running cue-driven scene changes it supports repeatable scene recall.

  Programmability did not come at the cost of audio path quality. The DN3600's analogue signal path was built to the same Kidderminster tolerances as the non-programmable DN-series graphics, delivering the transparent, musical filter response the brand is known for.

  Engineered at the UK facility, the DN3600 remains a reference point for what a programmable analogue graphic equaliser can be.
specs: |-
  - Programmable third-octave graphic equaliser
  - Stores complete recallable EQ snapshots
  - Front-panel, MIDI and remote recall
  - Analogue signal path
  - Remote operation via DN3603 docking station and DN3698 handheld remote
