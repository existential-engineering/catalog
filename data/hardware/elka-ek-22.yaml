description: >-
  The Elka EK-22 is a six-voice analog polyphonic synthesizer with two DCOs per
  voice, six-stage envelope generators, and keyboard splitting, offering Italian
  analog character comparable to the Sequential Prophet 600.
details: |-
  Released in 1986, the EK-22 represents one of the more capable offerings from Italian synthesizer
  manufacturer Elka. Its cousin, the EK-44, took a digital approach and expanded on the concept,
  but the EK-22 stayed true to analog synthesis with digitally controlled oscillators providing
  enhanced tuning stability and programmability.

  The oscillator section is notably flexible, with two DCOs per voice offering square, sawtooth,
  triangle, and pulse waveforms along with oscillator sync, individual tuning, level control, and
  modulation options. Two six-stage envelope generators provide thorough dynamic control that goes
  beyond the typical four-stage ADSR design. The synth supports two-part multitimbral operation
  with keyboard splitting.

  The EK-22 ships with 64 preset patches and 32 user-programmable slots, along with 16 performance
  patches for storing split and layer configurations. The 61-key weighted keyboard with velocity
  and aftertouch response delivers a more substantial playing feel than many of its contemporaries.
  MIDI connectivity ensures integration with external gear.

  Frequently compared to the Sequential Prophet 600 in terms of programmability and to the Oberheim
  Matrix 6 in interface design, the EK-22 occupies an interesting niche in vintage analog synthesis.
  A desktop module version, the EM-22, was also available for keyboardless setups.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice (square, sawtooth, triangle, pulse)
  - Oscillator Features: Sync, individual tuning, level, modulation
  - Multitimbral: 2 parts with keyboard split
  - Envelopes: 2 six-stage envelope generators
  - Memory: 64 preset, 32 user patches, 16 performance patches
  - Keyboard: 61 weighted keys (velocity and aftertouch)
  - MIDI: Yes
