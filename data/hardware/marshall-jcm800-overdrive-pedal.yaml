description: Compact overdrive pedal voiced after Marshall's iconic JCM800
  amplifier, designed to replicate the distinctive roar and 80s rock/metal tone
  that made the JCM800 an amp-of-choice. Delivers a versatile range from rich,
  saturated distortion to cleaner, driven tones via simple but powerful tone
  controls. Runs on a 9V battery (approx. 35 hours) or an external 9V DC
  centre-negative PSU (not included).
details: |-
  - JCM800-voiced overdrive replicating the distinctive roar of the iconic amp
  - Captures the 80s rock and metal tone and dynamic response of the JCM800
  - Simple yet powerful tone controls for sculpting sound
  - Versatile range from rich, saturated distortion to cleaner, driven tones
  - 1/4" instrument input and 1/4" output
  - Runs on 9V battery (approx. 35 hours) or external 9V DC centre-negative PSU (not included)
