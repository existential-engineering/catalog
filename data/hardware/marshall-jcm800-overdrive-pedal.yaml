description: Compact overdrive pedal voiced after Marshall's iconic JCM800 amplifier, designed to replicate the distinctive roar and 80s rock/metal tone that made the JCM800 an amp-of-choice. Delivers a versatile range from rich, saturated distortion to cleaner, driven tones via simple but powerful tone controls. Runs on a 9V battery (approx. 35 hours) or an external 9V DC centre-negative PSU (not included).
details: |-
  Stomp into the realm of legendary tones with the roar power of Marshall's JCM800 Pedal. From rehearsals at home to live studio performances, this pedal can adapt seamlessly and effortlessly to suit your playing style. Designed and engineered in UK. Made in Vietnam.

  Replicate the distinctive roar of the JCM800 amp by bringing it to your pedalboard. This pedal not only elevates your sound, but also lets you unleash the 80s tone and dynamic response that made the JCM800 the amp of choice in rock and metal music.

  The JCM800 amp was celebrated for its unparalleled clarity, power, and ability to sustain the sound that's loved by showstopping guitarists like Kerry King, Lzzy Hale and Robin Trower.

  Effortlessly sculpt your sound using the intuitive controls masterfully engineered to ensure you never lose momentum. Dial up versatility by dialling in everything from rich, saturated distortion to cleaner, driven tones.
