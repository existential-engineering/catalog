details: |-
  Stand Tall with the Spector Euro5 LT Bass Guitar in a Chuck Levin's Exclusive Grand Canyon Gloss Finish

  Spector's handcrafted Euro Series has established itself as an icon in the world of Bass Guitar. That craftsmanship now expands to include their latest pro bass offering in a customized Euro LT version build made exclusively for Chuck Levin's. The European Swamp Ash body wings are carefully weight relieved before they are topped with highly figured Quilt Maple. The 3-piece Maple neck features a 24 fret Ebony fingerboard and carefully tapered neck profile that's fast and comfortable. These Euro LT basses also include the premium EMG "PJ" pickup set, to provide an articulate and versatile tonal palette, with tonal heft suitable for any stage. These Euro LT models include professional grade hardware, gloss finishes, and Spector's world class craftsmanship. SPECIFICATIONS

