description: >-
  An eight-voice programmable polyphonic synthesizer from 1983 that offered an
  affordable entry into analog synthesis with DCOs, a built-in sequencer, and a
  lightweight portable design.
details: |-
  Korg introduced the Poly-800 in 1983 as a direct response to Roland's popular Juno series,
  delivering a fully programmable polyphonic synthesizer at a price point that made analog synthesis
  accessible to a much wider audience. With eight voices of polyphony, 64 memory patches, and up to
  50 editable parameters, the Poly-800 packed a surprising amount of functionality into its
  lightweight plastic enclosure.

  Each voice features a single DCO, though a Double mode stacks two oscillators per voice at the
  cost of halving polyphony to four voices. All voices share a single 24dB/octave low-pass resonant
  filter, which gives the instrument a distinctive character but limits independent voice shaping. A
  joystick controller provides real-time access to pitch bend, modulation, and filter adjustments
  during performance.

  Weighing just 10 pounds and offering battery operation with guitar strap pegs, the Poly-800 was
  built squarely for the performing musician rather than the studio. Additional features include
  stereo chorus, chord memory, a 256-step polyphonic sequencer, and MIDI connectivity. The line
  expanded with the rackmount EX-800 in 1984 and the Poly-800 mkII in 1985, which added digital
  delay and MIDI SysEx support.

  Notable users include Orbital, Depeche Mode, Vangelis, Nick Rhodes of Duran Duran, and Sneaker
  Pimps.
specs: |-
  - Polyphony: 8 voices (4 in Double mode)
  - Oscillators: 1 DCO per voice, 1 noise generator
  - LFO: Sine wave with speed, delay, routing to oscillator and filter
  - Filter: 24 dB/oct low-pass resonant filter (shared)
  - Envelopes: 3 ADBSSR digital envelope generators (DCO, noise, VCF)
  - Effects: Stereo chorus, chord memory
  - Sequencer: 256-step polyphonic with MIDI sync
  - Keyboard: 49 keys
  - Memory: 64 patches
  - Control: MIDI In/Out/Thru, cassette tape interface
releaseDate: "1983"
