description: 6xMIX is a six channel AC coupled audio mixer in 6 HP, with its
  channels arranged in three groups that each have a separate output and can be
  cascaded into 2-2-2, 4-2 or 6 channel configurations.
details: |-
  6xMIX is a six channel audio (AC coupled) mixer, with the channels arranged in three groups with separate outputs having LED indicators.

  Each group can be switched to mix with the subsequent group, allowing for 2-2-2, 4-2 and 6 mix configurations. The module can also be used to mix two stereo channels plus a separate group of two mono channels.

  Perfect audio performance with the lowest noise and distortion amounts.

  The inner knobs control the A inputs, while the outer knobs control the B inputs.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - Six channel AC coupled audio mixer
  - Three groups of two channels, each with its own output and LED indicator
  - Each group can be switched to mix into the subsequent group for 2-2-2, 4-2 and 6 configurations
  - Can mix two stereo channels plus a separate group of two mono channels
  - Inner knobs control the A inputs, outer knobs control the B inputs
  - 50 mA +12V
  - 50 mA -12V
  - 35 mm depth
  - 6 HP wide
  - Reverse power protected
