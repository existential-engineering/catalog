description: A premium MJ Series Dinky with a mahogany body, figured walnut top
  in Natural finish, wenge neck, streaked ebony fingerboard and an HSH Seymour
  Duncan pickup configuration. Built for comfortable shred performance with a
  Gotoh Custom 510 tremolo and gold hardware.
details: |-
  The MJ DK24 HSH 2PT E Mahogany with Figured Walnut lies at the intersection of immaculate style and unmatched performance. The mahogany Dinky body with figured walnut top in a Natural finish shows off the distinguished wood grain and produces a punchy tone and solid high-end response with a touch of brightened treble.

  The scalloped lower back bout and sculpted shredder's cut heel have been engineered for comfortable upper fret access and lead playing. The bolt-on wenge neck features graphite reinforcement for rock-solid stability, hand-rubbed oil finish on the back for smooth playability and heel-mount truss rod adjustment wheel for quick and easy neck relief tweaks.

  Its 12"-16" compound radius streaky ebony fingerboard ups the style ante and features 24 jumbo frets, pearl dot inlays and Graph Tech TUSQ XL nut.

  An HSH pickup configuration consisting of a custom Seymour Duncan Full Shred TB-10 humbucking bridge pickup, Seymour Duncan Custom Flat Strat SSL-6 middle pickup and custom Seymour Duncan Alnico II Pro APH-1N humbucking neck pickup delivers focused humbucker tone with a nicely balanced treble and bass response and backed off midrange, along with a sparkly vintage snap.

  This exquisite DK24 model's other premium features include a five-way blade switch, dome-style knobs for no-load tone control and volume control, Gotoh Custom 510 recessed tremolo bridge, Charvel-branded Gotoh die-cast locking tuners and distinguished gold hardware.
