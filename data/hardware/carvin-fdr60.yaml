specs: |-
  - Overview
  - Reviews
  - The FDR60 - Filter Direct Box or DI box (Direct Injection Box) as it is sometimes called is a gig bag essential. Featuring a quarter inch input and balanced XLR outputs, the FDR60 is lightweight, compact, and built to last. It converts your instrument's line level signal into a balanced XLR signal to send to a mixing board. Need to route your bass to the front of house and your amp at the same time? Simply plug in your bass, connect one output to your bass amp and the other to the mixing board and you're good to go. It's also perfect for use with keyboards, synthesizers, and acoustic guitars equipped with piezo pickups. The FDR60 helps to eliminate ground buzz and hum and keeps your tone strong over long cable runs, ensuring that your performance goes off without a hitch. For added peace of mind, this unit also comes with an input attenuator and a ground lift. Features: 1/4-Input & 1/4-Output Adjustable Attenuator Balanced XLR 3-pin male output Ground Lift with on/off switch Road worthy black anodized housing FDR60 Specifications : Input: 1/4-Inch 50k ohm unbalanced Outputs: 1/4-Inch (parallel with input) , XLR 3-pin male 600 ohm Balanced Frequency Response: 30Hz – 20kHz Attenuation : Yes , -20dB or -40dB Dimensions: 3.3" W (85mm) x 3.6 D" (92mm) Warranty: 90 Days
  - Customer Reviews Bernie Hynson Jr "I Own the Carvin DI box…….Simple, Extremely quiet, light weight….and….COST EFFECTIVE!!!! Every guitarist, bassist and keyboard specialist should have AT LEAST one of these little 'BEAUTIES' in your gig wire bag…..for continuous use and for 'EMERGENCIES!!!'" Rob Julian, CA "The FDR60 is built like a rock, we've been using Carvin gear at our church for years. Our old Carvin direct boxes have been used and abused over the years and still work perfect. We needed to pick up a couple more (for added instruments, we're still using and loving the old ones), and we're going to Carvin to get theirs. This is solid gear that lasts." Ed Freitas Carson City, NV "I do pro sound and sound for my my own band and these are great for virtually any acoustic instrument, keyboard or any other instrument that sounds better with the DI boost that these offer. I recommend these highly, especially at this sale price range."
