details: |-
  DESCRIPTION

  The third DUOCATA model from Rivolta doubles up on the strings to add some long-awaited jangle to the Rivolta line. Introducing the DUOCATA DELUXE 12: the newest twelve-string model from the mind of Dennis Fano. This thin-line twelve string guitar features a double bound, semi-hollow Ash body with Rivolta F-Hole, set Maple neck construction, our new C++ chunky neck profile, Rosewood fretboard, 25" scale, 24 jumbo frets, tune-o-matic bridge with individual string saddles and an ultra smooth satin neck finish. Our new proprietary DUOCATA matched pickups (two Custom, chrome-covered P90s) offer clear, crisp articulation and balanced tone. The Rivolta DUOCATA DELUXE 12 is everything you're looking for in a 12-string guitar and more! FEATURES & SPECS

  Rivolta Premium Soft Case: Optional Add-On
