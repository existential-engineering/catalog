description: The 414ce is a Grand Auditorium acoustic-electric from Taylor's 400
  Series, pairing a solid Sitka spruce top with solid Indian rosewood back and
  sides for warm lows and pristine highs, with V-Class bracing and ES2
  electronics.
details: |-
  The 414ce pairs solid Sitka spruce with solid Indian rosewood in a Grand Auditorium body — a classic tonewood combination delivering balanced tone with warm low-end, pristine highs, and a slightly scooped midrange. The Venetian cutaway provides easy upper-fret access.

  Taylor's V-Class bracing increases volume and sustain while improving intonation across the neck compared to traditional X-bracing. The Neo-Tropical Mahogany neck with West African Crelicam Ebony fretboard and bridge add tonal density and tactile comfort.

  Expression System 2 behind-the-saddle electronics capture the guitar's natural acoustic resonance for amplified performance. The guitar ships with a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Indian Rosewood (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Tuners: Taylor Nickel
  - Body binding: White
  - Pickguard: Tortoise
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
