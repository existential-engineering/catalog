description: Expressive 2x12" straight-fronted base cabinet for the Origin range. Loaded with two 12" Celestion Seventy-80 speakers and rated at 160W with an 8Ω speaker input, the Origin 212B is designed to pair with Origin-series heads and deliver clean, harmonically rich tones in a compact straight-baffle format.
details: |-
  This cabinet's sleek, vintage-inspired design makes it the ideal complement to your Origin. With the strength of two Celestion Seventy-80 speakers, you can output the clear and harmonic tones of the Origin amplifiers.

  This cabinet is also available as an angled base cab, allowing you to create your own Marshall stack.

  Two 12-inch Celestion Seventy-80 speakers add a tight low-end and a punchy mid-range to your sound, with classic styling to match the vintage looks of the Origin range.

  Designed and engineered in UK. Made in Vietnam.
