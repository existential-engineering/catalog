details: |-
  4-channel performance DJ mixer.

  Take the step to the DJ booth seamlessly with the DJM-750MK2, a 4-channel mixer which inherits key features and design elements from the DJM-900NXS2 , creating a club-style setup when combined with our professional CDJ or XDJ multi players. You can perform seamless mixes on the DJM-750MK2 thanks to the smooth curves on the EQs and channel faders. The Magvel crossfader, inherited from the DJM-900NXS2, gives a precise response and assured feel during even the most complicated scratch techniques.

  Professional layout. Mixing on the DJM-750MK2 feels instinctive thanks to the layout design with 4 channels and a display that draws on traits from the DJM-900NXS2 professional mixer, allowing you to practice in club conditions.

  Pro FX with detailed control. Add texture and flair to your mixes with professional FX inherited from the DJM-900NXS2. 2 effects units combine Sound Color FX and Beat FX – including FX Frequency – giving you the freedom to be creative with sound while always in control.

  Independent send/return. Choose from Aux or Insert send/return to connect different types of FX units on iOS devices such as FX apps, synthesisers and samplers, and combine them with the mixer’s internal FX. A simple USB connection will ensure high-quality sound, which you can efficiently live stream or record and easily archive via the DJM-REC app on your iPhone or iPad .

  Professional sound quality. Whether you’re playing with digital or analogue sources, high-quality sound is created by the 64-bit digital signal processor and dithering technology.

  Smooth EQs & faders. The EQs and channel faders on the DJM-750MK2 feature curves equivalent to those on the DJM-900NXS2, which also inspired the Magvel cross fader. The latter is smooth, accurate and durable for more than 10 million movements and its cut lag has been improved for more assured and responsive performance

  Performance features. Unlock rekordbox performance features by simply connecting the unit to your PC/Mac. And, if you subscribe to the Creative plan, use Cloud Library Sync for seamless library management across multiple devices, and easily make custom versions of tracks in Edit mode.

  DVS control. Make full use of rekordbox's low-latency DVS control for intuitive, smooth scratching.
