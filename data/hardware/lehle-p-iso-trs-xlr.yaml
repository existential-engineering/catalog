details: |-
  The Lehle P-ISO TRS XLR combines passive isolation with the highest possible signal fidelity. Its applications range from isolation and eliminating hum, to balancing and live or recording situations, along with any signal routing that requires a clean signal free from noise.

  At its core is the high-end Lehle Transformer HZ, which galvanically isolates the signal and eliminates any possibility of ground loops. The transformer was specially designed for use with high-impedance signals but also processes low-impedance signals with uncompromising sound quality.

  The classic application is as a hum suppressor and for balancing signals. Background noise caused by ground loops frequently occurs when two grounded electronic devices are connected to each other, and the P-ISO TRS XLR provides a simple but extremely effective remedy when installed between the two units: using the isolator, the devices are galvanically isolated and the background noise goes away.

  Because it can be used in both directions and offers the choice of balanced or unbalanced processing, the P-ISO TRS XLR suits many signal types and numerous situations. It performs all of its functions without any need for a power supply, and its optimised size and low weight let it fit below a pedalboard or in a pocket.
specs: |-
  - Isolator and problem solver
  - Absolutely no signal loss or hum
  - High-impedance Lehle Transformer HZ galvanically isolates the signal
  - Suitable for balanced or unbalanced signals
  - Can be used in both directions
  - Passive, no power supply required
  - Optimised size and low weight, fits below a pedalboard
