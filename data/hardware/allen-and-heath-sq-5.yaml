description: Compact, powerful, and versatile, the Allen & Heath SQ-5 is a
  48-channel digital mixer designed for professionals who need exceptional
  performance in a portable format.
details: |-
  The Allen & Heath SQ-5 is a premium 48-channel digital mixer designed for professionals who need exceptional performance in a portable format. It features 16+1 motorized faders, 16+1 onboard preamps and 8 assignable SoftKeys, providing comprehensive control in a compact 19" rack-mountable design.

  SQ's dashboard is centred around a high-res 7" touchscreen, framed by an array of high-grip, illuminating encoders to create an intuitive, integrated blend of clear visual feedback and immediate, hands-on control. Channels and mixes can be dragged and dropped to any strip, with custom naming and colour coding on the displays, allowing you to build a mixing environment that works for you.

  Every input has HPF, a super-fast gate with sidechain and filter, a musical 4-band parametric equaliser with RTA, and Peak/RMS compressor for control and shaping of levels and transients. Mixes have both a parametric and 28 band graphic EQ along with compressor as standard, all ready to switch in when required. SQ is also armed with 8 stereo FX engines and comes complete with the acclaimed RackExtra library, featuring emulations of legendary classic reverbs, gated reverbs, delays, modulators and more.

  SQ's built-in 32x32 96kHz audio interface enables easy multitrack recording, backing-track playback, livestreaming and virtual soundcheck. The interface is class-compliant on Mac OS X making it truly plug 'n play, with ASIO and WDM compatible drivers available for Windows computers. You can also map the SQ's faders, rotaries, channel keys and softkeys to control your favourite DAW using the Allen & Heath MIDI Control app.

  An SLink port provides remote audio and expansion, while a 64x64 I/O option card slot supports audio networking cards (Dante, Waves, MADI, SLink). Each strip features Allen & Heath's patented Chromatic channel metering system, giving at-a-glance level indication via LEDs with variable brightness and colour. The SQ-5 is compatible with Harrison LiveTrax for live sound multitrack recording and virtual sound check.
specs: |-
  - 48 channel, 96kHz digital mixer for live sound, AV and installation
  - 96kHz XCVI FPGA processing
  - 48 input channels
  - 12 stereo mixes + LR
  - 3 stereo matrix
  - 8 stereo FX engines + dedicated stereo returns
  - DEEP processing ready
  - 16+1 built-in mic preamps
  - 2 stereo line inputs
  - 12 XLR line outputs
  - 2 TRS line outputs
  - AES output
  - 16+1 motorized faders / 6 layers
  - 7" capacitive touchscreen
  - 8 assignable SoftKeys
  - SQ-MixPad app
  - SQ4You app
  - SLink port for remote audio / expansion
  - 64x64 I/O port for audio networking cards (Dante, Waves, MADI, SLink)
  - SQ-Drive direct recording to USB
  - 32x32 96kHz USB interface (class-compliant macOS, ASIO/WDM Windows)
  - Chromatic patented channel metering
  - 19" rack-mountable (with optional rack ear kit, 12U)
  - RackExtra FX library (classic reverbs, gated reverbs, delays, modulators)
  - Compatible with Harrison LiveTrax
