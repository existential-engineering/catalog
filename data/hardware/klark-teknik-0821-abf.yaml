description: The DN22 is a dual-channel, 22-band graphic equaliser from the
  heritage DN-series, a compact-format Klark Teknik EQ for installed-sound,
  broadcast and touring applications. It offers two independent channels of
  22-band 2/3-octave equalisation with the brand's analogue Proportional-Q
  response in a more economical band count than the flagship DN360.
details: |-
  The DN22 is a compact-format member of the heritage DN-series, designed for installed-sound, broadcast and touring applications where the precision of the brand's analogue Proportional-Q response is required in a more economical band count than the flagship DN360.

  Two independent channels of 22-band 2/3-octave equalisation deliver the transparent British signal path and musical filter behaviour that earned Klark Teknik its reputation as the industry reference.

  The unit is now obsolete; legacy spares and service documentation remain available through Music Tribe Care.
specs: |-
  - Dual channel graphic equalisation, 22 bands per channel
  - 2/3-octave band spacing
  - Proportional-Q filter response
  - Compact-format DN-series chassis
