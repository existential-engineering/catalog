url: https://lexiconpro.com/en-US/products/qli-32
description: 32-channel QuantumLogic Immersion Processor that upmixes stereo,
  5.1, and 7.1 cinema sources to up to 32 discrete output channels over BLU
  link.
specs: |-
  - 32 discrete output channels via BLU link
  - Upmixes stereo, 5.1, and 7.1 cinema sources to immersive playback
  - Compatible with existing cinema processor systems
  - Flexible height channel placement
  - GPI control capability
  - Web-based control interface
  - 1/3-octave graphic EQ per output channel
  - Parametric EQ on low-frequency extension output
  - Signal-to-noise ratio: 110 dB (20 Hz-20 kHz)
  - Power supply: 100-240 VAC, 50/60 Hz
  - Dimensions: 1.67" H x 19" W x 10.5" D
  - 3-year warranty
