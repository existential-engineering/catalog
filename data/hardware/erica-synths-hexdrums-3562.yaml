description: Essence of analog drums in a practical form factor.
details: |-
  The industrial character of Erica Synths' techno instruments, fused with the DNA of Hexinverter's mutant circuits, is brought to life as the HexDrums, an analog drum machine built out of respect for traditional designs with innovative improvements from both makers. It combines the range and flexibility of Hexinverter's sounds with the hands-on, no nonsense layout and aesthetics of Erica Synths, offering the distilled essence of analog electronic drums in a practical form factor.

  The HexDrums has 10 sound sources, mostly based on the Hexinverter Mutant series of percussion modules: two kick drums for different or combined flavours (the BD9 and the Bass drum), an optimised Mutant Machine, a Snare drum, a Clap, a Rimshot and HiHats. Erica Synths Cymbals complete the setup, with 10 sets of crash and ride cymbal samples.

  All drums have individual outputs. In the master section they are panned in the stereo field before being sent into the Compressor and Master Drive, both derived from the Mutant Glue.

  A hands-on, easy to program X0X-style sequencer provides nuanced pattern design up to 64 steps, with accents, per-step microtiming, ratchets, rolls and per-step probability, plus a song mode and a memory of 16 banks with 16 patterns each that can be backed up over USB B.

  The unit ships with a universal 12VDC wall wart adapter and a user manual.
specs: |-
  - Fully analog Mutant voices
  - 10 sound sources
  - Versatile, hands-on X0X-style sequencer
  - Up to 64-step pattern design with accents, per-step microtiming, ratchets, rolls and per-step probability
  - Individual voice outputs
  - Stereo compressor
  - Stereo master drive
  - 16 banks of 16 patterns memory
  - Memory backup via USB B
  - Song mode
  - 10 sets of crash and ride cymbal samples
  - Dimensions: 45.5cm x 7.8cm x 21.5cm
  - Weight: 2.65kg
  - Includes universal 12VDC wall wart adapter and user manual
