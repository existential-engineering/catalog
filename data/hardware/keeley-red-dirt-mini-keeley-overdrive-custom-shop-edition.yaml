description: Keeley Baby Red Dirt – Mini Pedal 4 Drive Modes – Tube Screaming
  Heaven! All the Keeley Mods!
details: |-
  A Custom Shop edition of the Red Dirt in a mini enclosure, carrying the set of Tube Screamer modifications Keeley began offering for the TS9 in 2001. Those modifications covered increased bass response, a fine-tuned tone control, cleaner sounds at low settings and higher gain when wanted, and became known as the Mod Plus.

  The Red Dirt itself arrived in 2012 as all of those modifications in one pedal, with one addition that could not be retrofitted to an original screamer: a JFET input buffer, which the maker credits for the more open and dynamic response of both the Red Dirt and the Red Dirt Mini.

  Four modes of operation are new to the Red Dirt Mini. The pedal's baseline voicing is set by removing the bottom plate and adjusting DIP switches, which change the clipping diodes to give a more compressed sound, a more open tube-amp-like sound, or stages in between. The four overdrive styles are Distortion, Overdrive, Crunch and Amp, running from the high-gain Distortion mode with two to three times screamer gain through progressively cleaner, more open and bolder voicings.

  The enclosure measures 1.5 by 3.6 inches, and the pedal runs from a 9 volt negative-tip supply drawing 7.5 mA.
