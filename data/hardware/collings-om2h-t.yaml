description: The OM2H T is a Traditional Series Orchestra Model acoustic guitar
  designed to showcase the most desirable characteristics of coveted pre-war
  instruments. Its voicing delivers warm, rounded highs and a present low
  midrange while retaining a quick attack and strong projection. Built with a
  Sitka spruce top and East Indian rosewood back and sides, it combines vintage
  aesthetics with meticulous modern craftsmanship.
details: |-
  The OM2H T belongs to the Traditional Series, a line built to evoke the tone and feel of pre-war acoustic guitars. The body follows the Orchestra Model shape with a 15" width and 25 1/2" scale length. Construction centers on a custom Traditional Series pre-war scalloped X-brace with an abbreviated soundboard graft, contributing to the guitar's responsive, voice-forward tone. The neck joins the body via a mortise & tenon hybrid joint and carries a fully adjustable truss rod. Ivoroid binding with small brown herringbone purfling frames the body, while a custom wood rosette and 2-style zipper backstrip add visual depth. Ebony is used for both the belly-style bridge (2 5/16" spacing) and the fingerboard, which features gold mother-of-pearl short diamond and square inlays on a 14"-26" compound radius. Tuners are nickel Waverly. The body is finished in high-gloss ultra-thin nitrocellulose lacquer with a tortoise pickguard, and the neck in high-gloss polyester resin.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Brace Material: Sitka spruce
  - Brace Pattern: Custom Traditional Series pre-war scalloped X-brace (abbreviated soundboard graft)
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Fingerboard: Ebony
  - Fingerboard Inlays: Gold MOP short diamond & squares
  - Fingerboard Radius: 14" - 26" compound
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cutthrough
  - Bridge Pins/End Pin: Ivoroid with black dot
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Neck Joint: Mortise & tenon hybrid
  - Neck Profile: Traditional
  - Truss Rod: Fully adjustable
  - Peghead Profile: Square with volute
  - Peghead Veneer: Stained exotic ebony with gold MOP Collings logo
  - Body Binding: Ivoroid with small brown herringbone purfling
  - Rosette: Custom wood rosette
  - Backstrip: 2-style (Zipper)
  - Pickguard: Tortoise
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Scale Length: 25 1/2"
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Strings: D'Addario EJ-16 (.012" - .053")
