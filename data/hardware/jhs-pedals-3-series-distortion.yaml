details: |-
  The JHS Pedals 3 Series is a collection of pedals designed to give you affordability and simplicity without compromising quality. Each 3 Series pedal is made in Kansas City, MO, using high-quality parts, quality control, and attention to every detail.

  The JHS Pedals 3 Series Distortion is a massively versatile distortion pedal with the ability to achieve medium gain crunch, heavy overdrive, distortion, and even fuzz tones. The controls are Volume, Filter (or Tone), and Distort knobs that give you a wide range of usable sounds in any position.

  The Gain toggle gives you a choice between more saturated and compressed or a more open and crunchy distortion. This switch plays a big part in how the pedal responds to your playing and touch dynamics.
