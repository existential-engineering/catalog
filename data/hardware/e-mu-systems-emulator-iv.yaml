description: >-
  The fourth and final generation of E-mu's legendary hardware sampler line,
  offering up to 128-voice polyphony, Z-Plane morphing filters, and a powerful
  modulation matrix across multiple keyboard and rackmount configurations
  produced from 1994 to 1999.
details: |-
  The Emulator IV series represents the culmination of E-mu Systems' decade-long evolution of
  hardware sampling technology. Produced across three generations from 1994 to 1999, these
  instruments pushed the boundaries of what dedicated sampling hardware could achieve before
  the industry's eventual shift to software-based solutions.

  The original Series 1 models launched in 1994 with the flagship EIV offering 128-voice
  polyphony and up to 128 MB of sample memory using standard computer SIMMs. The Series 2
  followed in 1996 with rackmount models like the E4X Turbo and E6400, plus the E4K keyboard
  version featuring 76 velocity-sensitive keys. The final Ultra series of 1999 introduced a
  32-bit central processor, Beat Munging sample-slicing DSP, and models like the E4XT Ultra
  and E5000 Ultra.

  At the heart of the Emulator IV's sound design capability is its 24-point modulation matrix,
  three six-stage AADHRR envelope generators per voice, and the celebrated Z-Plane morphing
  filters inherited from the Morpheus and Ultra Proteus modules. These filters enable complex
  timbral transformations that go far beyond standard subtractive synthesis, giving sampled
  material an almost synthetic fluidity.

  The series competed directly with the Akai S6000 and Kurzweil K2500, and while E-mu's
  digital synthesis capabilities were often overlooked by users focused purely on sampling,
  the instruments offered a depth of sound sculpting that rivaled dedicated synthesizers. The
  E4 Platinum, the final model, shipped with all options factory-installed including the RFX32
  effects processing card.
specs: |-
  - Polyphony: Up to 128 voices (model dependent)
  - Sample Resolution: 16-bit
  - Memory: Standard SIMMs, up to 128 MB
  - Modulation: 24-point modulation matrix
  - Envelopes: 3x six-stage AADHRR per voice
  - LFO: 2 per voice
  - Filters: Resonant high-pass, low-pass, notch, parametric; Z-Plane morphing filters
  - Effects: RFX32 card (optional/included on Platinum)
  - Sequencer: 48-track
  - Arpeggiator: Programmable
  - Storage: Internal and external SCSI
  - DACs: Four 24-bit (Series 2+)
  - Keyboard: 76 keys on E4K model
