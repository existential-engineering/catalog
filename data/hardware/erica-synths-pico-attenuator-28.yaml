description: Erica Synths Pico Attenuator is a dual passive attenuator.
details: |-
  Pico Attenuator is a dual passive attenuator in a 3HP eurorack panel. Each of the two sections is fully independent, so two unrelated signals can be scaled at once.

  Being passive, the circuit draws no current from the bus at all, which the specification table records as +0mA and -0mA. The panel is also unusually shallow for the series at 10mm deep, so it fits skiffs and tightly packed cases.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel.
specs: |-
  - 2 independent passive attenuators
  - Power consumption +0mA, -0mA
  - Module width 3HP
  - Module depth 10mm
