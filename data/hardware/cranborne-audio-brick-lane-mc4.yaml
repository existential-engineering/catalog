description: Brick Lane MC4 is a 2u 19-inch rack, 4-channel Modal PWM Dynamics
  Processor with Mono, Stereo, Mid/Side, Series, Dual-Band, and De-Esser
  operation. An evolution of the Brick Lane 500 Modal PWM Compressor.
details: |-
  The World's Most Advanced Analogue Dynamics Processor. Brick Lane MC4 is a 2u 19-Inch rack, 4-channel Modal PWM Dynamics Processor with Mono, Stereo, Mid/Side, Series, Dual-Band, and De-Esser operation. An evolution of the Brick Lane 500 Modal PWM Compressor.

  Brick Lane MC4 represents a major leap forward in analogue dynamics design, combining pure analogue PWM compression (compression+gate), multi-band saturation, and analogue lookahead technology within a digitally controlled, recallable hardware platform. Each channel features a Brick Lane MC4 Modal PWM compressor with six distinct compression modes, alongside an enhanced noise gate with analogue lookahead.

  Each channel of Brick Lane MC4 is built around Cranborne Audio's Modal PWM compression architecture, a digitally controlled analogue dynamics system that enables multiple, fundamentally different compression behaviours within a single signal path. Modal PWM compression operates by modulating the dynamics control law, time constants, and harmonic behaviour of the analogue gain stage rather than simply changing ratios or thresholds.

  Brick Lane MC4 delivers exceptional flexibility with Mono, Stereo, and Mid/Side operation, allowing each of its four dynamics channels to adapt seamlessly to tracking, mix-bus, and mastering applications. Series Mode allows two dynamics channels to be chained internally for sophisticated multi-stage dynamics processing, while Dual-Band Mode provides powerful analogue multi-band compression by splitting the signal into low and high frequency bands. A dedicated De-Esser mode with analogue lookahead delivers smooth, accurate sibilance control.

  Brick Lane MC4 features bypassable TRS insert points on all four dynamics channels for integrating external analogue hardware, plus four assignable external sidechain inputs with flexible internal sidechain routing. All controls can be operated remotely via USB or Ethernet network using the included control plugin, which also facilitates independent saving and loading of presets.
specs: |-
  - Max Input Level: +24dBu (<0.003% THD)
  - Max Output Level: +26.5dBu (<0.003% THD)
  - Frequency Response: ±0.5dB, 2 Hz - 80 kHz
  - Noise Floor: <-100dBu (unweighted)
  - Dynamic Range: >118dB
  - Input Impedance: Line = 43 kOhms
  - Output Impedance: Line = 150 Ohms
  - Compression Element: Pulse Width Modulation
  - Switching Frequency: 250kHz
  - Distortion (THD) at 0dB Gain Reduction: <0.0006% THD+N, <0.00025% THD
  - Distortion (THD) at 5/10/20dB Gain Reduction: <0.00085% THD
  - Harmonics (Stress Control): <20% THD depending on conditions
  - Compression Frequency Range: 200Hz - 6.2kHz
  - Sidechain Detection HPF: Selectable - 60Hz, 100Hz, 200Hz, OFF
  - Minimum Attack Time (Standard): 6 nanoseconds (2 microsecond processing delay)
  - Minimum Attack Time (POLISH mode with Analogue Lookahead): 6 nanoseconds (0ns delay @ 20kHz)
  - 1/4" TRS Inserts: Balanced, dedicated send & return, normalled
  - Insert Max Input Level (return): +26.0dBu (<0.003% THD+N)
  - Insert Max Output Level (send): +26.0dBu (<0.003% THD+N)
  - Mid/Side Matrix: Sum-difference encoder/decoder
  - Operating Temperature: +1 to 35°C
  - Storage Conditions: -20 to 50°C
  - PSU Type: Internal Mains
  - Dimensions: 48.3cm (19") W x 8.9cm (3.5", 2U) H x 23.6cm (9.3") D
  - Unit Weight: 6kg (13lbs)
