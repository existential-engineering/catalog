url: https://rupertneve.com/products/5052
description: A vintage-inspired microphone preamp and 3-band inductor EQ
  Shelford Series module designed for the 5088 console. Combines classic
  1073-inspired design with modern features including variable Silk/Texture
  controls and simultaneous pre/post 'tape' operation, built with class-A
  discrete electronics, custom-wound transformers, and inductors using ±24V
  topologies.
details: |-
  The Shelford 5052 brings together the classic sound of Rupert Neve's vintage designs with modern features and the precision of contemporary manufacturing. Its mic preamp section delivers up to 72dB of discrete class-A gain through square-core transformers, while variable Silk Red/Blue and Texture controls allow tailoring of harmonic content from clean to up to 4-5% THD (primarily 2nd-order) when fully driven.

  The 3-band inductor EQ uses custom-designed inductors to provide musical harmonic saturation that is distinct from capacitor-based EQ designs. The low frequency band offers ±15dB of cut/boost selectable as shelf or peak at 35Hz, 60Hz, 100Hz, or 220Hz. The midrange band provides ±15dB at six center frequencies (200Hz, 350Hz, 700Hz, 1.5kHz, 3kHz, 6kHz) with a high-Q switch. The high frequency band is a hybrid vintage/modern design offering ±15dB selectable between 8kHz and 16kHz as shelf or peak.

  Additional features include a sweepable 20-250Hz high-pass filter (12dB/octave), Mic/Line selection, 48V phantom power, polarity reverse, and an eight-segment LED bar-graph level meter. The 5052 mounts within the Shelford 5088 console's penthouse section or can be used standalone with an external 25-way 2U rack-mount power supply.
specs: |-
  - Mic Pre Gain: 0 to +66dB in 6dB steps + ±6dB trim
  - Mic Pre Noise (Out @ unity): better than -102 dBV
  - Main Out Noise (@ unity): better than -103 dBV
  - Equivalent Input Noise: better than -126 dB
  - Max Output Level: 25 dBu (Mic Pre / Main Out); 26 dBu (EQ)
  - Frequency Response: ±0.1dB (10Hz-31.5kHz Mic Pre / 10Hz-40kHz Main Out & EQ)
  - THD+N @ 1kHz, +20dBu: better than 0.002%
  - HPF: 20Hz-250Hz sweepable, 12dB/octave
  - LF EQ: ±15dB, shelf/peak, 35/60/100/220Hz
  - MF EQ: ±15dB, 200Hz/350Hz/700Hz/1.5kHz/3kHz/6kHz, switchable Hi-Q
  - HF EQ: ±15dB, shelf/peak, 8kHz-16kHz
  - Source impedance: 40 Ohms balanced
  - Power: ±24VDC from external supply; 0.26A/0.20A max draw
  - Dimensions: 1.75"W × 8.75"D × 9.4"H (4.5cm × 22.2cm × 23.9cm)
  - Weight: 3.5 lbs (1.6kg)
  - Made in USA
