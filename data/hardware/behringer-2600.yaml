description: A semi-modular analog synthesizer with three VCOs and a multi-mode
  VCF in an 8U rack-mount format, recreating the ARP 2600 with a pure analog
  signal path built on the original 1970s circuitry using matched transistors
  and JFETs. It plays immediately with no patching, while 83 patch points allow
  it to be rewired freely.
details: |-
  Great care has been taken in engineering the 2600, including the true-to-the-original analog circuitry, semi-modular architecture and triple VCO designs that come together to recreate classic tones that are evocative of classic electronic music. This highly focused attention to detail is what gives the 2600 its ultra-flexible sound shaping capability, covering a lot of amazing tones from super-fat bass and tasty leads all the way to full on dreamy ambience.

  Just like the original, the 2600 is a semi-modular synthesizer which allows you to start making music without having to plug patch cables into different modules. But don't let that stop you, the 2600 features 83 patch cable ins and outs so you can configure it anyway you want.

  The 2600 features 3 VCOs with FM inputs. You can even patch the VCOs' default waveforms to square, triangle, saw, sine or pulse which allows for an awe-inspiring palette of tonal possibilities. Any of the VCOs can also be switched to operate as a low frequency oscillator, while the multi-mode VCF acts as the VCO mixer of the 2600 where VCOs one, two and three can be blended. Combine that with its integrated resonance control, filter mode switch and the ability to output to other areas of the synth, and the 2600 becomes a fantastic and flexible tool for creating a diverse palette of tones.

  To top off the already amazing array of waveforms and mixing capabilities of the 2600, an incredible range of modules and effects are at your disposal including a ring modulator, lag processor, sample and hold, Schmitt trigger, envelope follower, a noise generator with continuously variable color and even a realistic sounding digital spring reverb to add spaciousness and a sense of scale to your music. Two dedicated LFOs with pulse and sine wave outputs are included as well.

  With the integrated ADSR and AR envelope generators of the 2600, you can create some truly dynamic progressions in your songs. If simple ADSR controls are not enough, flipping the Time Factor switch to x2, x1 or x0.5 gives you more control over the shape of the envelope, so you can have notes that are short and percussive or long and atmospheric. The VCA section offers further tone shaping alongside the VCF, with differential inputs for both linear and exponential response which accept control voltage signals via 3.5 mm jacks.
specs: |-
  - Semi-modular analog synthesizer in 8U rack-mount format
  - Pure analog signal path based on the original 2600 circuitry, with matched transistors and JFETs
  - Semi-modular architecture requires no patching for immediate performance
  - 3 VCOs, each with LFO mode, FM inputs and multiple wave-shape outputs
  - VCO waveforms: square, triangle, saw, sine, pulse
  - Multi-mode VCF with dedicated low-pass output plus an additional switched high/notch output, with resonance control; the VCF also acts as the VCO mixer
  - ADSR and AR envelope generators with switchable Time Factor (x2, x1, x0.5)
  - 2 dedicated LFOs with pulse and sine wave outputs
  - Ring modulator, lag processor, sample & hold, Schmitt trigger and envelope follower
  - Noise generator with continuously variable colour
  - Digital spring reverb
  - Differential (+/-) input VCA with both linear and exponential control inputs, accepting control voltage via 3.5 mm jacks
  - Switched Post Filter Distortion (PFD) / Inverter option on the voltage processor
  - Additional utility modules: attenuator, mixer, inverter, slew rate limiter and 4-way multiple
  - External audio input for processing external sound sources
  - 58 faders and 15 buttons
  - 83 patch cable inputs/outputs, 3.5 mm
  - Headphone output with dedicated level control
  - MIDI implementation with MIDI channel and Voice Priority selection
