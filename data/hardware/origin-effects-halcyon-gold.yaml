description: "The Halcyon Gold Overdrive is an adaptive overdrive pedal
  featuring proprietary Adaptive Circuitry that adapts its voicing in response
  to pick attack and volume changes. Inspired by a rare and sought-after pedal,
  it is not a clone: Origin recreated the exact characteristics of unobtainable
  vintage diodes and added its own refinements."
details: |-
  The Halcyon Gold Overdrive's party trick is its ADAPT switch, allowing the pedal's mid-forward voicing to gradually fade away as the pedal cleans up, giving classic Klon tone with the guitar cranked but revealing the full spectrum of clean tone as the volume knob is rolled back.

  As the original's mid hump increases with the gain control, the Adaptive Circuitry allows higher-than-usual drive levels while still cleaning up to transparent boost tones. The DRY control adjusts the level of dry signal that makes up part of the classic drive tone.

  The VOICE switch selects either the classic mid hump (KLN) or a smoother, more balanced tone with a broader mid hump and softer, more compressed clipping (MOD), well suited to single coil pickups and higher gain tones with very clean amps.
