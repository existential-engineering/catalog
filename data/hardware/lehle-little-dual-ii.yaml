description: The Lehle Little Dual II is the successor to the Lehle Little Dual
  and is a maximum signal-fidelity amp switcher for two amps. By using the
  soft-touch switches you can switch between two connected amplifiers hum-free
  and without sound loss.
details: |-
  The Lehle Little Dual II is the successor to the Lehle Little Dual, a maximum signal-fidelity amp switcher for two amps. Soft-touch switches let you move between two connected amplifiers hum-free and without sound loss, and two operating modes are available: activate or deactivate every output individually, or switch between the amps so that the remaining one is activated.

  The switches work with a microcontroller and an intelligent true-bypass relay circuit with an active pop noise suppression circuit, so the Little Dual II switches even faster than mechanical switches and does so wear-free and noise-free. A control system with a self-developed spring sits between the mushroom-head footswitch and the sensing device on the circuit board, and an ARM Cortex-M processor controls the switching operation. Where a conventional switch handles a maximum of 20,000 switching operations, the components used here enable a service life of 2 million.

  The easy-action mushroom-shaped buttons are mounted in the cover, so foot pressure is transmitted indirectly via a spring and the electronics board is not exposed to mechanical loads. High-intensity LEDs make it easy to read off switching state A or B, or both, even under high-power spots.

  The centrepiece is the high-end Lehle Transformer HZ, which galvanically isolates output A from output B and makes history of hum loops permanently. The unit also features a gold-plated contact phase inverter and a gold-plated contact ground switch.

  The two inputs can be routed in stereo to outputs A and B, for example when using the stereo signal of an effects unit, and this also allows instruments with two pickup systems (many acoustic and hybrid guitars, and double basses) to be routed via two amplifier systems. A TRS switch additionally allows those stereo or dual-mono signals to be sent in over a single TRS jack, and the signals can be operated either in alternation or in parallel.
specs: |-
  - ABY switcher (A or B or both)
  - Hum and noise-free switching
  - High-impedance Lehle Transformer HZ with phase and ground switch
  - Two different operating modes
  - Stereo-routing option
  - Active pop suppression circuit
  - True-bypass relay circuit under microcontroller control
  - ARM Cortex-M based switching control, rated for 2 million switching operations
  - TRS switch for stereo or dual-mono input over a single stereo jack
