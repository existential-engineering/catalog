description: A developer board kit for building custom wireless switching or
  remote control projects, including a Bluetooth 5 PCB, lithium polymer battery,
  and membrane switch extension.
details: |-
  Want to add wireless switching to your own project? Need to create a custom remote control solution? Your options are endless! Our Bare Bones Developer Board has everything you need to get started. Kit Includes:

  Add your own power source (comes with lithium battery) and switching system. We also have other boards available.
specs: |-
  - Bluetooth 5 Connectivity
  - Open and Closed Pairing
  - Screw down terminals for up to 6 switches (4 available with this kit)
  - Header for power switching, battery status and Bluetooth signals
  - Rechargeable battery or alternate power source
  - GATT, HID, MIDI Modes capable
  - Over the Air programmable
  - PCB
  - Membrane Switch Extension with LED's for a ready to run system
  - Lithium Polymer Battery
  - USB Charging Cable
  - Quick Start Guide
