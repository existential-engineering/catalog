description: |-
  The KEF Reference 8b is a twin 9-inch force-cancelling subwoofer featuring
  dual long-throw, ultra-low distortion drivers mounted back-to-back in a
  heavily braced cabinet. Each driver is powered by its own dedicated 500W
  Class D amplifier with DSP control, delivering deep, accurate bass with
  minimal distortion down to 18Hz.
specs: |-
  - Drivers: 2 × 228mm (9") long-throw, ultra-low distortion
  - Amplification: 2 × 500W Class D with DSP control
  - Frequency Range: 18Hz (-6dB free field)
  - Maximum Output: 110dB SPL peak at 1m, 50Hz
  - Low Pass Filter: Variable 40–160Hz; LFE mode 350Hz at 18dB/oct
  - Cabinet Volume: 23 liters
  - Dimensions: 398 × 365 × 429mm
  - Weight: 34kg
  - Power: 100–120V / 220–240V, 50/60Hz
