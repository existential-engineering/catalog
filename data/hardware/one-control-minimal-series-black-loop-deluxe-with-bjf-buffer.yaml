specs: |-
  - Two independently controllable effects loops
  - Built-in BJF Buffer with switchable true bypass or buffered bypass operation
  - Dedicated TOGGLE footswitch instantly reverses the ON/OFF status of both loops
  - If both loops are ON, pressing TOGGLE turns both OFF.
  - If both loops are OFF, pressing TOGGLE turns both ON.
  - If only LOOP 1 is ON, pressing TOGGLE switches to LOOP 2 only.
  - If only LOOP 2 is ON, pressing TOGGLE switches to LOOP 1 only.
  - LOOP 1 is ON and you want both loops ON → Press the LOOP 2 footswitch.
  - LOOP 2 is ON and you want only LOOP 1 ON → Press the TOGGLE footswitch.
  - Both loops are ON and you want only LOOP 1 ON → Press the LOOP 2 footswitch.
  - Unity gain with no added boost
  - Input impedance that preserves the original character of your instrument
  - Strong output without excessive amplification
  - Extremely low noise
  - Clean, musical performance even under overload conditions
