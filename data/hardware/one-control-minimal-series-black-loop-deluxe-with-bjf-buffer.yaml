description: A two-loop switcher with a switchable BJF Buffer and a dedicated
  TOGGLE footswitch that instantly reverses the status of both effects loops.
details: |-
  The Black Loop Deluxe with BJF Buffer gives you complete control over two independent effects loops in a compact, easy-to-use switching system. Key Features:

  The One Control Minimal Series Black Loop Deluxe with BJF Buffer is a versatile two-loop switcher designed to make complex pedalboard routing simple and intuitive. The built-in BJF Buffer at the input can be switched on or off, allowing the pedal to operate as either a true bypass or buffered bypass loop switcher depending on your setup. Three footswitches provide immediate control. The left and right footswitches independently activate LOOP 1 and LOOP 2, while the center TOGGLE footswitch unlocks the pedal's unique functionality. TOGGLE Footswitch:

  The dedicated TOGGLE footswitch instantly reverses the current ON/OFF status of both effects loops with a single press. No matter what your current loop configuration is, a single press instantly recalls the opposite routing, making fast transitions effortless during performance. Examples

  The BJF Buffer:

  The BJF Buffer challenges everything players expect from a traditional buffer by delivering an exceptionally natural, transparent signal. Björn Juhl designed the BJF Buffer to meet several strict requirements:

  The result is a highly respected buffer trusted by professional musicians around the world to preserve the integrity of their guitar signal. Unlike most effects, whose influence becomes greater the later they appear in the signal chain, a buffer is most effective when placed at the very beginning. That's why the BJF Buffer is built directly into the input stage of the Black Loop Deluxe. Engaging it helps maintain a warm, natural, and consistent tone throughout your entire pedalboard. Specifications:

  Dimensions (excluding protrusions): 94 × 118 × 38 mm
  Dimensions (including protrusions): 97 × 126 × 55 mm
  Weight: 380 g

  Minimal Series:

  The One Control Minimal Series is built around a simple philosophy: eliminate everything unnecessary while retaining the features players actually need. The result is an incredibly compact pedal with refined functionality and exceptional reliability. Built for Efficiency

  One Control developed an innovative PCB layout that combines high production efficiency with outstanding durability. By eliminating unnecessary assembly steps and reducing manufacturing complexity, the Minimal Series achieves excellent build quality while keeping costs to a minimum. The compact enclosure also minimizes pedalboard space without sacrificing ease of operation. These pedals are designed to fit naturally into any rig, providing practical functionality in the smallest footprint possible. Every pedal in the Minimal Series delivers exactly what you need—nothing more, nothing less. When your pedalboard needs just one more essential function, the Minimal Series provides the perfect solution. Specifications:
  Type: Loop Switcher
  Power: 9V DC Center Negative
  Battery Operation: No
  Controls: LOOP 1, LOOP 2, TOGGLE, BJF Buffer

  ・ Minimal Series Black Loop Deluxe with BJF Buffer Manual.pdf

