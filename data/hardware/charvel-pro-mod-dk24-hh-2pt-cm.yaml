description: Charvel turns modern high performance on its head with the Pro-Mod
  DK24 HH 2PT CM, a brazen instrument for the progressive guitarist searching
  for an unparalleled spectrum of sound.
details: |-
  The Pro-Mod DK24 HH 2PT CM pairs a Dinky-shaped alder body in a gloss finish with a bolt-on caramelized maple neck featuring graphite reinforcement, a hand-rubbed urethane finish, and a Speed Neck profile with rolled fingerboard edges for a broken-in feel.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, all anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around a versatile HH configuration: a Seymour Duncan Full Shred TB-10 at the bridge and a Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch and a 2-position mini toggle for series/parallel switching. A 500K EVH Bourns Low Friction volume pot and no-load tone control round out the wiring.

  Hardware includes a Gotoh Custom 510 Tremolo with Gotoh tremolo arm, Charvel-branded die-cast locking tuning machines, chrome finish, Strat-style skirt knobs, and a black switch tip. The licensed Fender Stratocaster headstock, 4-bolt sculpted heel, and heel-mount truss rod adjustment wheel complete a thoroughly modern high-performance platform.
