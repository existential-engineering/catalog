description: 12-Input Digital Mixer for iPad/Android Tablets with 4 Midas PRO
  Microphone Preamplifiers, 8 Line Inputs, Integrated WiFi Module and USB Stereo
  Recorder. A compact, rack-mountable mixer for live and studio applications
  featuring 40-bit floating-point DSP, up to 4 onboard M32 effect engines,
  100-band Real Time Analyzer, and Midas M AIR Gain Sharing technology
  supporting up to 4 live microphones.
details: |-
  The Midas MR12 is a 12-input rack-mountable digital mixer designed to be controlled by iPad or Android tablets. It features 4 Midas PRO microphone preamplifiers on combo connectors with locking latches and 8 additional line inputs. The mixer is built around a 40-bit floating-point DSP and runs up to 4 onboard M32 effects engines (4 true-stereo / 8 mono). Each channel offers a low-cut filter, 4-band parametric EQ, gate, and compressor; main and aux buses have 31-band graphic EQ. The MR12 includes a 100-band Real Time Analyzer with a 10-second capture window and Midas M AIR Gain Sharing technology supporting up to 4 live microphones. Connectivity includes 2 aux buses, a main L/R bus, MIDI I/O (Mackie Control protocol), a USB stereo recorder for uncompressed WAV record/playback, an Ethernet LAN port (Cat 5e, up to 100m), and an integrated tri-mode WiFi router (Access Point, Client, dedicated router). Wireless control is provided by free apps: M AIR MIX for iPad, M AIR MIX for Android (2.2+), and M AIR EDIT for PC/Mac/Linux.
specs: |-
  - Input Channels: 12 (4 mic/line + 8 line)
  - Mic Preamps: 4 Midas PRO microphone preamplifiers
  - Mic Input Connectors: Combo connectors with locking latches
  - DSP: 40-bit floating-point
  - Effects Engines: Up to 4 onboard M32 effects engines (4 true-stereo / 8 mono)
  - Analyzer: 100-band Real Time Analyzer (RTA), 10 seconds capture window
  - Aux Buses: 2
  - Main Bus: Main L/R
  - Channel Processing: Low-cut filter, 4-band parametric EQ, gate, compressor
  - Bus Processing: 31-band graphic EQ on main and aux buses
  - M AIR Gain Sharing: Supports up to 4 live microphones
  - Latency: Near-zero overall latency
  - USB Recorder: Stereo, uncompressed WAV file record/playback
  - Wireless: Integrated tri-mode WiFi router (Access Point, Client, dedicated router)
  - Wired Network: Ethernet LAN (Cat 5e, max 100m)
  - MIDI Control: Mackie Control protocol
  - Form Factor: Rack-mountable stage box
