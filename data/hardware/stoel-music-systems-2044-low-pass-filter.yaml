details: |-
  The Stoel Music Systems 2044 Filter is a classic 24db/octave analog lowpass filter with voltage control over frequency and resonance. The 2044 filter was used in the Korg Polysix, Korg Monopoly, Korg Trident, PPG Wave 2.3, the Emu Drumulator, SP-12, Emulator, the Voyetra 8, and several other vintage synthesizers. Technical Specifications

