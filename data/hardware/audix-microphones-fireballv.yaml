details: |-
  The FireBall V, with a cardioid pickup pattern for isolation and feedback control, is equipped with a VLM diaphragm for natural sound reproduction with an exceptional transient response.

  Designed for harmonicas (both diatonic and chromatic) and beatbox, the FireBall V has the added feature of a volume control knob. The Fireball V has a wide frequency response of 50 Hz – 16 kHz and is lightweight, compact, and comfortable to hold.
  Because the FireBall V is a low impedance microphone, a quality, low-high impedance transformer (T50k is required when using a guitar amplifier).

  Designed, assembled, and tested by AUDIX in the USA.
specs: |-
  - Type: Dynamic instrument microphone (harmonica / beatbox)
  - Polar pattern: Cardioid
  - Diaphragm: VLM
  - Frequency response: 50 Hz - 16 kHz
  - Control: Onboard volume control knob
  - Output: Low impedance, balanced XLR
