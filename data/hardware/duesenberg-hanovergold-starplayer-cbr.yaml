description: An exclusive, limited-edition run featuring a
  metal-particle-infused finish. This unique coating forms a delicate metallic
  layer on the instrument's surface that will age gracefully with use,
  developing a one-of-a-kind patina over time.
details: |-
  The Hanover Gold Starplayer CBR is one of three special editions in Duesenberg's limited "Hanover Gold" series, alongside the Starplayer TV and the Paloma. It is built to order and limited for 2026. Each model in the series carries a distinctive gold paint finish infused with metal particles, hand-processed in multiple steps to achieve a naturally broken-in feel, while the entire back of the instrument is finished in a high-quality matte black for contrast with the bright gold top. The custom gold finish also covers the headstock, which the specifications list as Hanover Gold.

  Within the series the CBR is the chambered option: a chambered mahogany solidbody with an f-hole and a maple top, sitting tonally between the semi-hollow Starplayer TV and the solid alder Paloma. The body measures 46 x 34 cm (18.11" x 13.38") with sides 4.6 cm (1.8") deep, carries a single-layer cream binding and a black custom backprint Plexi pickguard, and is finished in PUR.

  The neck is a set neck in one piece of mahogany with a Medium D shape, measuring 42.5 mm (1.67") at the nut and 52 mm (2.05") at the 12th fret, with a depth of 21 mm (0.8") at the first fret and 24 mm (0.95") at the twelfth. The unbound Indian rosewood fingerboard has a 305 mm (12") radius, vintage pearloid dot inlays and 22 jumbo frets measuring 2.8 x 1.0 mm over a 648 mm (25.5") scale, and a steel dual-action truss rod sits inside. Duesenberg's Plek process levels the fretboard and frets as the basis for a multi-step fret polish and a hand-finished setup.

  Electronics pair a Duesenberg Domino P90 at the neck with a Duesenberg GrandVintage Humbucker at the bridge, wired to one volume, one tone and a 5-way pickup selector using Duesenberg's "Flextone +" wiring. Hardware comprises Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, a Duesenberg Diamond Prestige Tremola vibrato with a flat arm and Duesenberg Standard strap pins that are Straplock compatible, all in a nickel finish, strung with Duesenberg Custom 10/50 strings (010-013-017-028-042-050). The Z-Tuners are designed for a smooth, precise feel and allow the cut-off string end to be hidden inside the tuner shaft.

  The instrument ships with a Duesenberg Custom Line Case as standard, described as a handcrafted flightcase-quality case of classic shape, together with a signed certificate of authenticity and all required allen keys.
