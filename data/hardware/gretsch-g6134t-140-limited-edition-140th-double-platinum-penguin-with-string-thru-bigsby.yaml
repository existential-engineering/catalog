details: |-
  2023 marks the 'Double Platinum' Anniversary for the Gretsch brand. To commemorate 140 years of unmistakable sound, we proudly present the Limited Edition G6134T-140 Penguin — a guitar that honors its inspired past while providing the power and voice for the next generation of visionary players.

  Built around a chambered mahogany body with a solid Adirondack red spruce top in a striking Two-Tone Stone Platinum/Pure Platinum gloss nitrocellulose lacquer, this Penguin is bound in silver sparkle with W/B/W/B purfling. A set-neck 24.6"-scale maple neck with a Standard "U" profile carries a 12"-radius ebony fingerboard with 22 medium jumbo frets and mother of pearl Neo-Classic thumbnail inlays.

  FT-67 Filter'Tron neck and bridge pickups feed individual neck and bridge volumes, plus master volume and master tone, through a 3-position toggle. A chrome Adjusto-Matic bridge on an ebony base, Bigsby B3CP String-Thru tailpiece, and Grover Imperial locking tuners round out the package, which ships in a G6238XL Gretsch solid body hardshell case.
