description: >-
  The Korg MicroKorg XL is a compact virtual analog synthesizer and vocoder released in
  2009 as the successor to the popular original microKORG. Despite its small footprint and
  2kg weight, it delivers a powerful 8-voice sound engine with two oscillators, an
  integrated 16-band vocoder, and can run on six AA batteries for portable use.
details: |-
  Korg introduced the original microKORG in 2002, and it quickly became one of the company's most popular instruments. The XL followed in 2009 as what Korg termed "the big brother" of the original. While maintaining the microKORG name, the XL features a more retro aesthetic and an updated sound engine.

  The interface prioritizes simplicity with three knobs for filter cutoff, amp envelope attack, and resonance. A Full Edit mode provides access to comprehensive parameter controls for detailed sound design. USB connectivity allows computer connection for parameter adjustment using dedicated sound editor software.

  The 37-key natural touch waterfall mini-keyboard keeps the instrument compact and portable. The built-in step arpeggiator offers six distinct arpeggio types including up, down, random, trigger, and two alternating patterns. Two program banks provide 128 available programs organized by genre and category.

  The XL provides full vocoder functionality with sixteen filter bands, adding another dimension to its sound creation capabilities. Its lightweight molded construction and battery operation make it one of the most portable self-contained synthesizers available.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: 2 parts
  - Oscillators: 2
  - Waveforms: Sine, Triangle, Saw Down, Pulse, White Noise, ROM
  - LFOs: 2 (Key Sync, Sample & Hold, Saw Up, Square, Triangle)
  - Vocoder: 16 filter bands
  - Arpeggiator: 6 types (Up, Down, Random, Trigger, Alt 1, Alt 2)
  - Keyboard: 37 natural touch mini-keys
  - Programs: 128 (2 banks x 8 genres x 8 categories)
  - Connections: MIDI In/Out, USB
  - Weight: 2 kg
  - Power: External power supply or 6x AA batteries
releaseDate: "2009"
releaseDateYearOnly: true
