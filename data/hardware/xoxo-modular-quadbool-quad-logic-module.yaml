description: A Eurorack logic module with four independent quads, each applying
  AND, OR, NOR, XAND, XOR, or XNOR logical operators to two inputs. Lighted
  buttons mirror each output, and the module can lock its button states or save
  them, with alternative modes for normalization between inputs and outputs.
details: |-
  Please Note: While many Eurorack modules have un-shrouded power connectors, we prefer to have a connector that prevents you from plugging the power cable in backwards by mistake. Because of a slight mixup in the shop, the handful of modules left in this batch have an un-shrouded power connection instead of the normal shrouded one. If you prefer to wait for a QUADBOOL with the plastic shrouded connector send us an email and we'll get in touch when the next batch is ready. FYI all of the modules are clearly marked to show which direction the red stripe should face. QUADBOOL is the only logic module you'll ever need. Each of the four "quads" operates independently and can apply AND, OR, NOR, XAND, XOR, XNOR logical operators on its two inputs. This allows you to create infinite rhythmic variations, complex clocks, and strange patterns. (Check out this excellent video by DivKid to see the power of logic!)

  Each of the lighted buttons mirrors the output jack so you can see the effect that the selected logic operator is having. There are no menus to dive into - just the ability to lock all buttons to avoid accidental nudges and the ability to save the state of the module. A few alternative modes are available, allowing you to add some interesting normalizations between inputs and outputs. This module packs a lot of punch for creating rich patterns and rhythms. Width: 5hp

  Depth: 35mm (+9mm for the power cable)

  Current Draw on +12V Rail: 69.26mA Maximum (with all LEDs and outputs on)

  Also Includes: (1) 20cm IDC power cable; (1) quick reference sticker; (2) M3 x.5mm x 6mm mounting screws

  SKU: XM004
