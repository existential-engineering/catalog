url: https://bastl-instruments.com/eurorack/modules/wackel-kontakt
description: "Broken cable and bad contact emulator configured as 2×4-way
  passive multiples in 1HP. Wackel Kontakt (German: 'loose contact') introduces
  controlled glitchiness and signal interruption into Eurorack patches. Each of
  the eight jack positions can be individually calibrated for a different degree
  of contact degradation by physically manipulating a patch cable through the
  connector hole."
details: |-
  1HP. Passive — no power required. Configured as 2×4-way multiples with intentionally degraded contacts. Each jack calibrated individually outside the rack.
