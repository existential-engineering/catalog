description: HIGH SOUND QUALITY DIGITAL DELAY
details: |-
  The FLIGHT TIME FT-2Y is a high sound quality digital delay with a Realtime BPM Analyzer and a Delay Time Offset feature, both of which Free The Tone states were world firsts as of September 2014. It was introduced as the successor to the FT-1Y, with the analog, power supply and digital circuits and the firmware all redesigned for better sound quality.

  The Realtime BPM Analyzer trims the delay time automatically by analysing the tempo of the current performance, within plus or minus 20 percent of the BPM tapped in on a footswitch. The Delay Time Offset feature deliberately offsets the delay against the tune's BPM so that the repeats are not masked by on-beat sounds, with a shorter setting giving a high-speed impression and a longer one broader phrasing. The offset amount is stored per preset. The BPM analyzer was jointly developed with Faudio.

  A 32-bit high-precision DSP does the processing, aimed at the sonic quality of classic rack delay units rather than at simulation or modelling. Dry signals travel from input to output in the analog domain and are mixed with the delay at an internal analog mixer, and the HTS (Holistic Tonal Solution) circuit keeps the effect and bypass sounds the same texture.

  Per-preset settings include high-pass and low-pass filters, modulation applied to the delay sound, delay phase inversion, a subdivision setting for the beat count, a trail function that keeps the previous delay alive across a preset change, and up to 3 dB of output boost. A Rec and Repeat function records and loops up to 20 seconds of incoming signal, with the preset delay applied to both the loop and what is played over it, although layering is not possible. A Hold function triggers the stored delay sound from an external footswitch even with the effect switched off, and a rear switch turns the dry signal on and off for use with an external mixer.

  The FT-2Y adds instrument and line input level switching, instant switching between presets 1 and 2, and a MIDI OUT that can dump preset contents to a computer. Presets are recalled by MIDI program change and features can be remote-controlled by control change, across 99 presets made up of 90 user and 9 factory slots.
specs: |-
  - Number of presets: 99 (90 user, 9 factory)
  - Input impedance: min. 500 kOhm
  - Output load impedance: min. 1 kOhm
  - Max. input level: INST +2 dBu, LINE +13 dBu
  - 32-bit high-precision DSP
  - Realtime BPM Analyzer with plus or minus 20 percent automatic trimming
  - Delay Time Offset stored per preset
  - Rec and Repeat: up to 20 seconds, single phrase, no layering
  - Per-preset HPF and LPF, modulation, delay phase invert, subdivision, trail and boost up to +3 dB
  - Instrument and line input level switching
  - Dry on/off switch on the rear panel
  - MIDI program change preset recall, control change remote control and MIDI OUT preset dump
  - Terminals: standard 1/4 inch phone jacks (IN, OUT, HOLD)
  - Power supply: 9V DC centre negative polarity, no AC adapter included; the power supply specification changed in September 2024, so check the voltage marked on the rear panel
  - Power consumption: approx. 400 mA
  - Dimensions: 146 (W) x 120.5 (D) x 57 (H) mm including protuberances such as jacks
  - Weight: approx. 560 g excluding accessories
