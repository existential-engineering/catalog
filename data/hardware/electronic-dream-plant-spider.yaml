description: >-
  The EDP Spider is a 256-note digital step sequencer designed to control the Wasp and
  Gnat synthesizers, featuring both EDP's proprietary interface and CV/Gate outputs for
  compatibility with other analog gear.
details: |-
  The Spider is a compact digital sequencer built to complement EDP's range of synthesizers. It stores up to 256 notes in step mode or 84 notes in real-time recording mode, providing simple but effective sequencing for the Wasp and Gnat synthesizers.

  Controls are straightforward, covering note entry in both step and real-time modes along with transposition options at intervals of a semitone, whole tone, major third, or perfect fifth. Speed controls allow tempo adjustment for playback. The unit connects to other EDP gear via the company's proprietary pre-MIDI digital interface.

  Crucially, the Spider also includes CV/Gate outputs, making it compatible with analog synthesizers from other manufacturers beyond the EDP ecosystem. This flexibility gave it broader utility than a purely proprietary accessory.

  EDP also produced the Caterpillar, a related 3-octave master keyboard released in 1980 that could control up to four interconnected Wasp synthesizers polyphonically. The Caterpillar featured wood panels but did not respond to velocity or aftertouch.
specs: |-
  - Sequencer: 256-note step mode, 84-note real-time mode
  - Transposition: Semitone, whole tone, major 3rd, perfect 5th
  - Control: EDP proprietary digital sockets, CV/Gate outputs
  - Keyboard: None
  - Memory: None
