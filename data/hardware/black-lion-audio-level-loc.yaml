description: Classic effect compressor / saturation module
details: Black Lion Audio collaborated with Shure to revive the original 1960s
  Level-Loc compressor/limiter. Originally designed for speech reinforcement,
  the Level-Loc became a beloved studio tool for its aggressive, character-laden
  compression. The modern reissue preserves the original's sonic DNA while
  adding contemporary connectivity options including a combo jack input
  (XLR/¼"), a ¼" TRS output alongside the original XLR output, a Mix control for
  parallel compression blending, selectable high/low impedance, +48V phantom
  power, a -30 dB/-15 dB pad (A15LA), and a Distance Selector for setting the
  compression threshold. Pushed hard, the unit delivers saturation and
  overdrive, making it equally useful as a creative effect processor.
specs: |-
  - Input: Combo jack (XLR / ¼")
  - Output: XLR + ¼" TRS
  - Phantom Power: +48V
  - Pad: A15LA — -30 dB (low impedance) / -15 dB (high impedance)
  - Impedance: Selectable high / low
  - Mix Control: Parallel compression blend
  - Distance Selector: Sets compression threshold
