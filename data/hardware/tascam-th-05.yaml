description: Studio-grade closed-back monitoring headphones with 40mm dynamic
  drivers and a circumaural design for passive isolation. Features 180° rotating
  ear cups for single-ear monitoring and a lightweight manganese headband for
  extended wear. Includes a screw-on 1/4-inch adapter and a leatherette travel
  bag.
details: |-
  Closed-back circumaural headphones. 40mm dynamic drivers. Impedance 32Ω, sensitivity 95dB ±3dB, max input 400mW. Frequency response 15Hz–22kHz. Fixed 3m cable terminating in a gold-plated 3.5mm (1/8") plug; screw-on 6.3mm (1/4") adapter included. 180° rotating ear cups. Lightweight manganese headband with padded tightly-stitched ear cups and headband. Leatherette travel bag included.
