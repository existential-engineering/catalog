details: |-
  PHANTOM OPERATOR

  (Supernatural Random Flux Filter)

  This supernatural filter has a mind of its own. With its rhythmic paranormal activity, you may think there's a ghost at the helm. The haunted randomization makes you feel like you've entered the Twilight Zone. Plug into this pedal for endless inspiration that challenges you to compete against an otherworldly spirit! Achieve rhythmic patterns, complex tremolo, cadenced filters, and hard, glitched-out sounds with Sample and Hold mode. The Voltage Controlled Filter mode is an incredibly smooth, classic low-pass, conducted by the dynamics of the input. Controls allow manipulation of filter frequency, as well as resolution, attack, and decay. The Phantom Operator includes mode-changing via footswitch, with status and speed indicators. It's 100 percent analog and true bypass. Designed and assembled in Seattle, Washington. Operates on a standard 9Vdc Boss-style power supply (not included). Enclosure size: 4.67" x 3.654" x 1.547"

  . Phantom Operator manual

  . . Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
