description: With the Rusty Relic, Duesenberg brings you the ultimate experience
  in sophisticated craftsmanship. Constructed in the same complex way as the
  regular Starplayer TV, the surface on this Special Edition is coated with a
  thin layer of metal particles, which are then aged to achieve a unique rusty
  steel patina.
details: |-
  The Starplayer TV Rusty Relic is a Custom Shop special edition of the Starplayer TV, built to the same semi-hollow construction as the standard model: bent sides, a sustain block and an f-hole, with a laminated spruce top over laminated maple back and sides. The distinguishing feature is the finish, a real magnetic layer of metal particles applied over the wood and then aged, so the surface develops a rusty steel patina. Because the ageing is done entirely by hand, each instrument ends up with its own look and details, and the headstock and pickguard carry the same custom metal finish.

  The neck is a set one-piece maple neck in a Medium D shape, 42.5 mm at the nut and 52 mm at the 12th fret, with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays and 22 jumbo frets over a 648 mm / 25.5 inch scale. A steel dual-action truss rod runs through the neck. Every instrument receives Duesenberg's Plek treatment, in which the frets are levelled by a CNC based system before multi-step hand polishing and setup work.

  Electronics are an aged-nickel edition of Duesenberg's established pairing, a Domino P90 at the neck and a GrandVintage humbucker at the bridge, both aged to match the hardware. The middle position of the heavy duty three-way switch uses a special wiring that filters certain low-end frequencies out of the humbucker signal for a more open and versatile voice. Controls are one volume, one tone and the three-way pickup selector.

  Hardware is finished in aged nickel and comprises Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and the Diamond Deluxe Tremola vibrato, which the maker cites for its tuning stability and smooth action when bending chords.

  The instrument ships with a Duesenberg Custom Line Case as standard, described as flightcase quality and handcrafted, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42,5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
