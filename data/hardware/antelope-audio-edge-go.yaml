description: "Modeling bus-powered condenser microphone with integrated preamp,
  A/D converter, Synergy Core real-time mic emulations and effects over USB C."
details: |-
  Edge Go is positioned as the world's first Smart USB microphone, combining the ease and convenience of a digital mic with the flexibility and sound quality of an entire recording studio. It captures professional-fidelity audio for recording or live streaming, with authentic-sounding effects and presets done by top audio pros for polished, immediate results.

  With Antelope Audio's premium mic modeling technology, the Edge Go captures the personality and characteristics of classic condenser microphones from Germany, Japan, England, Austria, and America. Each microphone was meticulously analysed and measured in Europe's finest facility, then brought to life digitally with the power of Synergy Core processing. 18 vintage mic models are included.

  The Synergy Core effects processing platform is integrated in the mic. With 1xDSP and 1xFPGA running, the Edge Go captures high-resolution audio in crisp detail and also acts as a portable studio with built-in effects. The included 20 Synergy Core FX cover microphone and preamp models, iconic EQ and compressor emulations, reverb, tape saturation, and PowerGate for removing breaths and pops, all with real-time monitoring and imperceptible latency. Additional vocal-oriented effects (vibrato, synth-like effect, 1950s compressor, pitch effects, and more) are available via the Antelope Software Store.

  The Edge Go packs an entire recording studio - mics, preamps, converters, master clocks, equalizers, compressors, reverbs - into a desktop USB mic. The premium audio technology and Synergy Core FX platform recreate that gear in a lifelike, true-to-form manner, delivering a complete studio experience contained within a single microphone.

  The Edge Go uses USB-C connectivity but works just fine plugged into a standard USB Type-A port on a computer.

  Targeted at musicians (vocals and instruments), podcasters, vloggers, voice-over artists, educators, gamers, and live streamers. Low-latency mic models and effects make studio-quality live streaming possible with minimal effort.

  The software control panel makes loading effects, adjusting parameters, and browsing presets straightforward, with no studio experience required.
specs: |-
  - Capsule: large-diaphragm condenser
  - Diaphragm: double-sided 6u gold-sputtered membranes, 34 mm
  - Polar pattern: Multi-pattern (cardioid, figure-8, omnidirectional)
  - Frequency response: 20 Hz - 20 kHz
  - Self-noise: 19 dB(A)
  - SNR: 75 dB(A)
  - Maximum SPL: 116 dB
  - Microphone ADC: 117 dB dynamic range
  - Headphone DAC: SNR 112 dB
  - Sample rate: 44.1 kHz to 192 kHz
  - USB: Type-C (USB 2.0 compatible)
  - Headphone output: 1/8" (3.5 mm) stereo jack
  - Power: USB bus powered, 5 V / 500 mA
  - Dimensions: 8.6" x 2.1" (219 mm x 53 mm)
  - Weight: 1.21 lbs (550 g)
  - Onboard Synergy Core: 1x DSP and 1x FPGA
  - Included mic emulations: 18 vintage mic models
  - Included real-time effects: 20 Synergy Core FX (mic/preamp models, EQs, compressors, reverb, tape saturation, PowerGate)
  - Additional effects available via the Antelope Software Store
  - In the box: microphone, all required cables, rugged shockmount, adjustable pop filter, desktop mount, portable suitcase
