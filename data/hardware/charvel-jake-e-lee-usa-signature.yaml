details: |-
  The Jake E Lee USA Signature is a USA-built signature electric guitar modeled after the distinctive white 'Charvel-ized' instrument Jake E Lee has played since he bought it new in 1975, dating back to his work with Ratt, Rough Cutt, and his legendary tenure as Ozzy Osbourne's lead guitarist.

  It features an ash So-Cal Style 1 body with a gloss Pearl White with Lavender Hue iridescent finish, paired with a bolt-on quartersawn maple speed neck with rolled fingerboard edges and a hand-rubbed satin urethane finish. The 25.5" scale rosewood fingerboard carries a 12"-16" compound radius, 21 medium jumbo frets, white dot inlays, and a 1.6875" bone nut.

  Electronics are an HSS configuration with a Seymour Duncan JB SH-4 (Alnico II) humbucking bridge pickup and reverse-slanted DiMarzio SDS-1 DP111 single-coils in the middle and neck positions, all in black. Controls are kept simple with a single volume knob and a 5-position blade switch.

  Hardware includes a hardtail bridge with black base plate, Gotoh tuners with pearl buttons, and a chrome/black hardware finish. A 1-ply black pickguard, licensed Fender Stratocaster headstock, and Charvel hardshell case complete the package. Strung with nickel-plated steel .009-.042 strings.
