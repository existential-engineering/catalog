description: >-
  The Roland Jupiter-4 was one of the first polyphonic synthesizers, featuring four
  individual voices that could be synced together for a fat monophonic lead. It included
  an assignable pitch wheel, eight memory locations, and a distinctive arpeggiator most
  famously heard in Duran Duran's "Rio." Released in 1978, it represented an early
  milestone in Roland's iconic Jupiter synthesizer line.
details: |-
  The Jupiter-4 was the first in Roland's legendary Jupiter synthesizer series, released in 1978. It featured four independent analog voices that could operate polyphonically or be synchronized together to create a powerful monophonic lead sound. A notable control feature was its assignable pitch wheel, which could modulate the VCA, VCF, or VCO individually or in any combination.

  The arpeggiator became one of the Jupiter-4's most distinctive features, producing the iconic pattern heard in Duran Duran's "Rio." The synth also featured a slow LFO capable of producing extended filter sweeps, making it well-suited for creating evolving, trippy analog textures. The ensemble/chorus effect added lushness to its already warm analog sound.

  The instrument did have notable limitations for its era. Its ten preset sounds were considered poor approximations of their labeled piano, brass, and string designations. The placement of preset buttons below the keyboard proved inconvenient during live performance, and like most analog synthesizers of the late 1970s, tuning stability could be an issue.

  Notable users of the Jupiter-4 include Meat Beat Manifesto, Gary Numan, Thomas Dolby, Saint Etienne, the Cars, BT, Simple Minds, Moog Cookbook, Vangelis, The Human League, Duran Duran, Spandau Ballet, Heaven 17, and filmmaker Satyajit Ray.
specs: |-
  - Polyphony: 4 voices
  - Oscillators: 1 VCO per voice (triangle, square, square with PWM) with switchable sub-oscillator
  - LFO: 1 (sine, square, ramp up, ramp down)
  - Filter: High-pass filter, low-pass resonant filter
  - Envelopes: 2 ADSR (one for filter with invert option, one for VCA)
  - Effects: Ensemble/Chorus
  - Arpeggiator: Yes
  - Keyboard: 49 keys
  - Memory: 8 user patches, 10 presets
  - Control: Trigger input for arpeggiator
  - Date Produced: 1978-1979
releaseDate: "1978"
