details: |-
  The G&L Legacy HSS RMC delivers the performance of the Legacy HSS with a sleeker vibe, thanks to its Rear Mount Controls (RMC) and no pickguard to hide that gorgeous finish. Its G&L AW4470 Alnico 5 bridge humbucker has the perfect amount of heat to complement the vintage alnico G&L CLF-100 single coils in the neck and middle positions, plus its splittable bridge humbucker does a convincing job as a single coil with rich, ringing harmonics. All this adds up to an ideal balance that lets it play well in a variety of settings.

  The Legacy HSS RMC brings all of the Legacy features, starting with Leo's PTB (Passive Treble and Bass) system which functions on all three pickups for dramatically more variety than the vintage setup, while the treble pot has a push/pull coil-split for the bridge humbucker. The Legacy HSS RMC also features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm. The Legacy HSS RMC's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  For players looking for that extra power and stage presence to properly rock the house without straying too far from a traditional experience, the Legacy HSS RMC is worth a look.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: CLF-100 Alnico single coils in neck and middle position, AW4470 in bridge position
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble with push/pull coil split, bass (PTB system)
  - Includes: G&L Deluxe Gig Bag
