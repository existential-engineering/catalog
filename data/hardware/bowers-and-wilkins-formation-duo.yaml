details: |-
  Formation Duo is a network connected wireless active speaker system, sold as a stereo pair and configured and controlled using the Bowers & Wilkins Home app. Stands are not included.

  Each speaker features the patented Carbon Dome tweeter-on-top technology for crystal clear highs, and the same Continuum cone driver found on the 800 Series Diamond speakers. Coupled with the exclusive Formation wireless technology that produces an immersive, seamless, high-fidelity soundstage, Formation Duo is wired fidelity, wirelessly.

  A 25mm (1 in) Carbon dome high-frequency unit and a 165mm (6.5 in) Continuum cone bass midrange driver cover a 25Hz to 33kHz range, driven by digital amplification with Digital Signal Processing and Dynamic EQ.

  Sources reach Formation Duo over the network: Apple AirPlay 2, Spotify Connect, Roon and Bluetooth (aptX HD, AAC and SBC) are all supported. The only physical sockets are the network connection (RJ45 Ethernet, with WiFi as the alternative), a service-only USB socket, and the mains power inlet.
specs: |-
  - Description: Wireless High Performance Speaker System
  - Drive units: 1 x 25mm (1 in) Carbon dome high-frequency, 1 x 165mm (6.5 in) Continuum cone bass midrange
  - Frequency response: 25Hz to 33kHz
  - Input voltage: 100V - 240V - 50/60Hz
  - Power consumption: Below 6 Watts (Sleep)
  - Connections: Network (RJ45 Ethernet or WiFi), USB - service only
  - Technical features: Apple AirPlay 2 Technology, Spotify Connect, Roon Ready, Bluetooth In, Digital Signal Processing (DSP), Digital Amplifier, Dynamic EQ
  - Bluetooth: Bluetooth v4.1, Class 2, aptX HD, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Dimensions: Height 395mm (15.6 in), Width 197mm (7.8 in), Depth 305mm (12 in)
  - Net weight: 10.6kg (23.4 lb)
  - Cabinet finishes: Black, White
  - Stands are not included
