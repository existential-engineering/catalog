description: The Formation Duo speakers offer wireless hi-res audio, with Carbon
  Dome Tweeter-on-Top and Continuum drivers that deliver pristine sound.
details: |-
  Formation Duo is an elegant hi-res wireless speaker from the Bowers & Wilkins Formation range, sold as a stereo pair. It uses cutting-edge technologies like Carbon Dome Tweeter-on-Top and Continuum drivers to deliver the audio quality Bowers & Wilkins is renowned for: wireless hi-res sound, without compromise. Stands are not included.

  Each cabinet carries a 25mm (1 in) carbon dome high-frequency unit in the Tweeter-on-Top housing above a 165mm (6.5 in) Continuum cone bass midrange driver. Quoted frequency response runs from 25Hz to 33kHz. The product is a Wireless High Performance Speaker System.

  Streaming is handled natively: Apple AirPlay 2 technology, Spotify Connect, Roon Ready and Bluetooth In are all listed, and the hero feature list also names Dolby Digital. Bluetooth is v4.1 Class 2 with aptX HD, AAC and SBC codecs. AirPlay 2 compatibility covers iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th generation) with tvOS 11.4 or later, and Mac or PC with iTunes 12.8 or later.

  Amplification and tuning are digital, with Digital Signal Processing (DSP), a Digital Amplifier and Dynamic EQ listed among the technical features. Wired connectivity is limited to the network port: the speakers join a Formation system over RJ45 Ethernet or Wi-Fi, and the only other socket is a USB port marked service only.

  The speakers run from mains at 100V to 240V, 50/60Hz, and draw below 6 watts in sleep. Each cabinet measures 395mm (15.6 in) high, 197mm (7.8 in) wide and 305mm (12 in) deep, with a net weight of 10.6kg (23.4 lb). Two cabinet finishes are listed, Black and White.
specs: |-
  - Description: wireless high performance speaker system
  - Drive units: 1x 25mm (1 in) carbon dome high-frequency, 1x 165mm (6.5 in) Continuum cone bass midrange
  - Frequency response: 25Hz to 33kHz
  - Carbon Dome Tweeter-on-Top
  - Apple AirPlay 2 technology
  - Spotify Connect
  - Roon Ready
  - Bluetooth In: Bluetooth v4.1, Class 2, codecs aptX HD, AAC, SBC (wireless, not a physical port)
  - Dolby Digital
  - Digital Signal Processing (DSP)
  - Digital Amplifier
  - Dynamic EQ
  - Connections: Network (RJ45 Ethernet or Wi-Fi), USB (service only)
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: below 6 watts (sleep)
  - Dimensions: 395mm (15.6 in) high x 197mm (7.8 in) wide x 305mm (12 in) deep
  - Net weight: 10.6kg (23.4 lb)
  - Cabinet finishes: Black, White
  - Stands are not included
