description: The OD820 is a guitar overdrive pedal based on Maxon's classic 808
  circuit, running at an internal 18 volts for extra headroom and a fuller
  frequency response. It offers a dual-purpose Drive control that blends clean
  boost and overdrive tones.
details: |-
  *Please note: Maxon has discontinued the AC210 AC Adapter. Due to this, the Maxon Vintage series pedals will no longer ship with power supply included. The Maxon Vintage Series Pedals can be run with a standard 9vdc Center Negative Adapter. We recommend the PA-9 Power-All ECO-Dapter. With plenty of gain, a super-musical tone circuit and a transparency rarely found in a pedal, the OD820 takes Maxon's legendary 808 circuit and launches it into the 21st century. The OD820's voltage doubling circuit adds gain, girth and grit without desecrating your existing tone. Imagine the classic 808 sound with more output, more bottom and more drive and you've pretty much summed up the 820's sound. The circuit's additional headroom gives your playing a fluid, effortless feel: Notes jump off the fretboard with a noticeable yet controlled sustain. Though capable of heavier-than-usual overdrive, the OD820's dynamic response is amazing and the pedal cleans up beautifully by rolling back your guitar's volume control. The dual-ganged Drive pot blends clean and dirty tones, creating stunning clean solo boosts at lower settings and a buttery, light overdrive at high noon. Max it out for a full-bodied overdrive that's saucy and saturated while still retaining clarity and openness. The Maxon OD820 – the quest for the ultimate overdrive ends here. The OD820 shares many similarities with the fabled Klon Centaur, but at a fraction of the cost. TECH TALK:

  The OD820 circuit is basically a hot-rodded 808 with a few special tricks. After a JFET input buffer, the signal is sent a dual-gang Drive pot where it is split between a clean gain stage and the overdrive stage. As the Drive knob is turned up, more signal is sent to the overdrive stage while the drive of this stage is also turned up. If the Drive knob is turned down, more signal is sent to the clean gain stage and the drive of the overdrive stage is turned down. At 12 o'clock on the Drive knob, signal is split 50/50 clean/overdriven. The OD820 features a standard 808-style tone control. However, the entire pedal is running at 18 volts via an internal voltage doubler that bumps up the clean headroom and provides greater output and a fuller frequency response than the typical 808 circuit – in other words, no midrange spike! Even though the 820 circuit is running at 18 volts, it powers up off standard 9 VDC via battery or a standard external power adaptor. The OD820 features buffered, Mechanical bypass switching with a low impedance output, allowing it to drive long cable lengths or other effect units without loss of signal. Input Impedance : 500K Ohms

