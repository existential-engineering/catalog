details: |-
  The Sophie Lloyd signature model takes the form of the bolt-on Aries while adding Lloyd's preferred specs. Three options exclusive to the SL are the Iron Age killswitch, the Sustainiac system, and Sophie's signature truss rod cover.

  To accommodate the killswitch, the rear Aries bevel is reduced into a sleek, minimalistic contour, while a different control layout is utilized for the Sustainiac system. Various specs, such as fingerboard and top wood, finish, and headstock shape, are customizable to the customer's taste.

  Sophie Lloyd on the brand in 2023: "[Kiesel is] one of the most innovative and exciting brands out there, and their A6 model has become such an extension of me and my playing that I could never imagine playing anything else. They are really unlike any guitar I've ever played, and I think you guys are going to love them!"
specs: |-
  - Scale length: 25.5", 27" or 29" fixed, or 25.5" to 26.5", 25.5" to 27" and 26" to 27.5" multiscale
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: chambered black limba, 38.25" to 40.5" long, 1.65" thick, 12.5" wide depending on configuration
  - Top wood: flamed maple
  - Neck: tung-oiled walnut with 2-way adjustable truss rod and dual carbon-fiber rods, thinner profile
  - Neck width: 1.69" to 2.42" at nut depending on string count and scale
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: royal ebony with 14" radius
  - Headstock: pointed 3x3 headstock with flamed maple overlay painted to match body
  - Bridge: Hipshot fixed bridge or Hipshot Solo saddle bridge, .4125" (10.5mm) spacing
  - Pickups: direct-mount passive Kiesel Lithium humbuckers with black pole pieces, or Kiesel Lithium bridge humbucker with Sustainiac neck pickup
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector and Iron Age kill switch; a Sustainiac system version uses a different control layout
  - Finish: translucent purple
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Hardware: chrome
  - Inlays: white pearl staggered offset dots with standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: Sophie Lloyd signature truss rod cover
  - Strings: Elixir Nanoweb 1046E
  - Weight: 7.8 lbs, 7.9 lbs, 8 lbs or 9 lbs depending on configuration
  - Fingerboard and top wood, finish and headstock shape are customizable
