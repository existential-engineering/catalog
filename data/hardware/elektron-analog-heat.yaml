url: https://www.elektron.se/legacy
description: >-
  An eight-in-one stereo analog effects unit. Choose one of eight analog
  distortion circuits then customize the sound further through a multimode
  filter, LFO, envelope, and EQ.
details: |-
  The Analog Heat is a stereo analog sound processor featuring eight distinct distortion circuits ranging from subtle clean boost and saturation to aggressive fuzz and high gain distortion. Each circuit imparts a unique character to incoming audio: Clean Boost, Saturation, Enhancement, Mid-Drive, Crunch, Distortion, Harmonic Fuzz, and High Gain.

  A stereo multi-mode analog filter allows further tonal sculpting of the processed signal. The filter can be used independently or in combination with the distortion circuits to create complex timbral transformations.

  Modulation capabilities include an assignable envelope follower and LFO, enabling dynamic and evolving effects that respond to the input signal or run freely. A two-band parametric equalizer fine-tunes the frequency balance of the processed signal.

  Overbridge support enables seamless integration with DAW environments, allowing the Analog Heat to function as both a standalone hardware processor and a plugin-like insert effect. The unit features 48 kHz, 24-bit converters and balanced I/O.
specs: |-
  - 8 stereo analog distortion circuits
  - Stereo multi-mode analog filter
  - 2-band parametric EQ
  - 1 assignable envelope follower/generator
  - 1 assignable LFO
  - 48 kHz, 24-bit D/A and A/D converters
  - 128 x 64 pixel OLED display
  - Overbridge enabled for DAW integration
  - Class-compliant USB audio
  - Steel casing: 215 x 184 x 63 mm, ~1.5 kg
