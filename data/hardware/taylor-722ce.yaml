description: The 722ce is a Grand Concert acoustic-electric from Taylor's 700
  Series built entirely from select-grade Hawaiian koa, delivering a vibrant,
  articulate tone with crisp trebles and warm midrange, with V-Class bracing and
  ES2 electronics.
details: |-
  The 722ce is part of Taylor's 700 Series, showcasing select-grade Hawaiian koa on both the top and back/sides. Koa's naturally lively, articulate character is refined through Taylor's V-Class bracing, which improves intonation and sustain while coaxing out the wood's warm sonic complexity.

  The Grand Concert body is compact and comfortable — well-suited for fingerstyle players. The Venetian cutaway provides upper-fret access, while the 24-7/8" scale length and 1-3/4" nut width offer a comfortable playing feel.

  Premium appointments include an Indian rosewood binding, paua shell rosette, Mother-of-Pearl Fountain inlays on a West African Crelicam Ebony fretboard, and Taylor polished bronze tuners. Expression System 2 behind-the-saddle electronics provide natural amplified tone. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Hawaiian Koa (solid, gloss)
  - Back/sides: Hawaiian Koa (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Binding: Indian Rosewood
  - Rosette: Paua shell
  - Inlays: Mother-of-Pearl Fountain
  - Pickguard: Dark Stained Sycamore
  - Scale length: 24-7/8"
  - Nut width: 1-3/4"
  - Tuners: Taylor Polished Bronze
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
