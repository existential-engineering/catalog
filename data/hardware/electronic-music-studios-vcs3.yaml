description: >-
  The EMS VCS3, nicknamed the Putney, is a legendary British analog monosynth
  from 1969 that pioneered a distinctive pin-matrix patching system in place of
  traditional patch cables, housed in an iconic angled wooden case.
details: |-
  Created by Electronic Music Studios in England in 1969, the VCS3 stands as
  one of the most historically significant synthesizers ever produced. Its
  distinctive angled wooden case and unique approach to signal routing made it
  instantly recognizable and set it apart from the American modular systems
  that dominated the era.

  Instead of patch cables, the VCS3 uses a matrix-based patching system where
  signal routing is accomplished by placing small pins into a grid of slots.
  This elegant approach allows the three VCOs, low-pass filter, ring modulator,
  noise generator, spring reverb, and other components to be interconnected in
  countless configurations.

  The VCS3 became famous for its ability to generate otherworldly sounds,
  most notably providing the iconic sound effects for the BBC's Doctor Who.
  Its oscillators are known for drifting out of tune, a characteristic that
  contributes to its unpredictable, organic sonic personality. A joystick
  controller adds expressive real-time control over multiple parameters.

  EMS also offered the instrument in a portable plastic briefcase format known
  as the Synthi A. The VCS3 remained in production in various forms from 1969
  through 1994, and it continues to be one of the most coveted and collectible
  vintage synthesizers in existence.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs
  - Synthesis: Subtractive/FM analog
  - Filter: Low-pass VCF
  - Envelope: Trapezoid waveshape generator
  - Noise: Noise generator
  - Effects: Voltage-controlled spring reverb, ring modulator
  - Control: CV/Gate, pin-matrix patch system
  - Additional: 2 input amplifiers, joystick controller, 2 stereo output amplifiers
  - Keyboard: None (external DK2 keyboard optional)
