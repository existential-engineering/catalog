description: The 02H 12-Fret T is a vintage-inspired acoustic guitar from the
  Traditional Series, designed to showcase the most desirable characteristics of
  coveted pre-war instruments. It features a Sitka spruce top with East Indian
  rosewood back and sides, delivering warm, rounded highs and a present low
  midrange while retaining quick attack and strong projection. The 12-fret neck
  joint, ebony pyramid bridge, and nickel Waverly tuners contribute to its
  classic aesthetic and feel.
details: |-
  The 02H 12-Fret T is part of the Traditional Series, representing a vintage-inspired variation on the distinctive Collings sound. The guitar is crafted with a Sitka spruce top and East Indian rosewood back and sides, with a Honduran mahogany neck and ebony fingerboard featuring gold mother-of-pearl inlays. The pyramid-style ebony bridge and nickel Waverly tuners reinforce its pre-war aesthetic. The body measures 13 3/4" wide, 19" long, and 4" deep, with a total length of 37 3/4" and a 24 7/8" scale length. The 1 3/4" bone nut and 2 5/16" bridge spacing provide a comfortable playing feel. Medium 18% nickel-silver frets and a high gloss ultra-thin nitrocellulose lacquer finish complete the instrument.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: Gold mother-of-pearl
  - Bridge: Ebony, pyramid style
  - Tuners: Nickel Waverly
  - Nut: Bone, 1 3/4"
  - Bridge Spacing: 2 5/16"
  - Frets: Medium 18% nickel-silver
  - Scale Length: 24 7/8"
  - Body Width: 13 3/4"
  - Body Length: 19"
  - Body Depth: 4"
  - Total Length: 37 3/4"
  - Finish: High gloss ultra-thin nitrocellulose lacquer
  - Strings: D'Addario EJ-16 (.012"-.053")
