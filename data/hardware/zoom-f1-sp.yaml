description: The F1-SP pairs the F1 two-track portable field recorder with the SGH-6 shotgun microphone and a shock mount, recording WAV or MP3 at up to 24-bit/96 kHz. A 3.5 mm stereo output feeds a camera input while the F1 records its own file to a microSD card, and a 10-pin connector takes Zoom's interchangeable mic capsules.
details: |-
  The Zoom F1 Field Recorder + Shotgun allows you to capture professional audio everywhere your camera takes you. The F1-SP comes with the SGH-6 Shotgun Mic known for capturing pro-quality, hyper directional sound, and its aluminum body makes it extremely lightweight. Combined with the F1, you can record high-resolution audio up to 24-bit/96 kHz, providing high-impact audio for any video production.

  Connect the F1 and shotgun to the shock mount and attach it to your camera, then connect the F1's audio output to the camera's input using the 3.5mm stereo cable and you are ready to record. While recording to the camera, the F1 can also record to a microSD card, providing a stereo audio file which can be edited in post-production.

  Monitor your levels, battery life, lo-cut settings and more with the F1's monochromatic display, ensuring visibility even in bright sunlight. One-touch buttons make record levels, limiter settings, and volume output easily accessible.

  The F1's tone generator provides a test tone to assist in setting proper audio levels, and sound markers make aligning audio and video easy. An on-board limiter keeps your levels safe when spikes in loud volume occur. The F1 can be powered using two AAA batteries or with the optional AD-17 power adapter.

  USB connectivity transfers recordings to a computer in card reader mode, or records directly to a computer with the F1 in USB audio interface mode. The F1 records audio in WAV or MP3 formats, and WAV files are automatically time-stamped, making them Broadcast Wave Format (BWF) compliant. A proprietary 10-pin connector makes the F1 compatible with all of Zoom's interchangeable mic capsules: the SSH-6 stereo shotgun, XYH-6 stereo X/Y, MSH-6 mid-side, XYH-5 shock-mounted X/Y, EXH-6 dual combo input and SGH-6 mono shotgun.
specs: |-
  - Two-track recorder bundled with the SGH-6 mono shotgun capsule
  - Recording media: microSD/microSDHC cards, Class 4 or higher, up to 32 GB
  - WAV recording: 44.1 kHz/16-bit, 48 kHz/16-bit, 48 kHz/24-bit, 96 kHz/24-bit
  - MP3 recording: 48, 128, 192, 256 or 320 kbps, mono or stereo, ID3v1 tags supported
  - Display: 1.25 inch monochrome LCD
  - ZOOM mic capsule input accepts the interchangeable 10-pin capsules
  - SGH-6 shotgun capsule: super cardioid (3 directional mic units), -39 dB/1 Pa at 1 kHz, input gain minus infinity to +50 dB, 122 dB SPL maximum
  - Mic/line input: 3.5 mm stereo mini with screw lock, supports plug-in power (2.5 V), gain -12 dB to +36 dB, impedance 2 kilohms or more
  - Headphone output: 3.5 mm stereo mini with screw lock, 11 mW + 11 mW into a 32 ohm load
  - USB: microUSB, USB 2.0 High Speed mass storage, class-compliant audio interface at 44.1/48 kHz 16-bit, 2-in/2-out, asynchronous transfer
  - Power: 2 AAA batteries (alkaline, NiMH or lithium) or Zoom AD-17 DC 5 V/1 A AC adapter
  - Recording time with the SGH-6 at 48 kHz/24-bit mono: about 6.5 hours alkaline, about 6 hours NiMH (750 mAh), about 11 hours lithium
