description: Crush Delay is a special Echo-Delay unit based on the PT2399 IC,
  which is able to deliver clean delay and dirty repeats.
details: |-
  Crush Delay V3 is a special Echo-Delay unit based on the PT2399 IC, which is able to offer 400ms of clean delay and up to 2 seconds of dirty repetitions, having a special talent to generate noisy-glitch textures. This third version comes with redesigned VCA circuits, wider range for clean delay, and reduced depth to make it skiff friendly.

  The module has two inputs (In and Return) that go to the Delay circuit through a dedicated VCA for each one. The main difference between both inputs is the signal fed into In is going to the Dry/Wet circuit also, not only to the Delay, allowing you to control the balance between the original and the processed signal present at the main output (Out).

  The signal is processed by the Delay circuit, which is affected by the Crush section. It degrades the signal at slow rates in different ways, depending on the position of the three Crush switches or by the presence of gate signals at the Crush inputs.

  After being processed, the signal is routed to three different paths. The first one goes into Dry/Wet, where it is mixed with the original input signal (In) before going to the main output (Out). The second one is returned to the Delay circuit through another VCA (Feedback), controlling the number of repetitions of the wet signal. Finally, the last one goes directly to the Send output.
