description: >-
  The Dave Smith Instruments Poly Evolver is a four-voice analog/digital hybrid synthesizer combining Curtis analog filters
  with digital wavetable oscillators, dual feedback loops, and four independent 16-step sequencers in a 5-octave keyboard.
details: |-
  Released in 2005 as Dave Smith Instruments' flagship, the Poly Evolver essentially packs four complete Evolver synth voices into a single instrument with a 5-octave semi-weighted keyboard. It can function as a four-voice polysynth, four independent monosynths with individual sequencers, or any combination in between, making it one of the most flexible synthesizers of its era.

  Each voice contains four oscillators: two digitally controlled analog oscillators offering sawtooth, triangle, saw/triangle mix, and pulse waves with PWM and hard sync, alongside two digital wavetable oscillators drawing from the Prophet VS wave library with wave sequencing, FM, and ring modulation capabilities. This true analog/digital hybrid architecture produces a remarkably wide tonal palette spanning warm analog textures and complex digital timbres.

  The signal path features Curtis voltage-controlled analog low-pass filters selectable between 2-pole and 4-pole operation, paired with digital 4-pole highpass filters. Real analog VCAs, four LFOs per voice, three ADSR envelopes per voice, and dual tunable feedback loops with a "Grunge" distortion feature provide extensive sound-shaping possibilities. Three separate syncable stereo delay lines add spatial depth.

  With 512 fully editable programs and 384 combo presets, the Poly Evolver offers deep storage for its complex patches. MIDI In/Out/Thru, poly chain capability, and two pedal/CV inputs round out the connectivity. The clean front panel layout with dedicated knobs and switches keeps this powerful instrument accessible despite its depth.
specs: |-
  - Polyphony: 4 voices
  - 4 oscillators per voice (2 analog DCO + 2 digital wavetable)
  - Analog waveforms: Sawtooth, Triangle, Saw/Tri mix, Pulse (PWM), Hard Sync
  - Digital waveforms: Prophet VS waves, Wave sequencing, FM, Ring modulation
  - White noise generator
  - 4 LFOs per voice (Saw, Tri, Ramp, Pulse, Random; MIDI syncable)
  - 2 Curtis analog low-pass filters per voice (2/4-pole selectable)
  - 2 digital 4-pole highpass filters per voice
  - 1 analog VCA per voice with ADSR
  - 3 ADSR envelope generators per voice
  - 4 x 16-step analog-style sequencers (MIDI syncable)
  - 3 stereo delay lines (syncable)
  - Dual tunable feedback loops with Grunge feature
  - Digital distortion per channel
  - 5-octave semi-weighted keyboard with velocity and aftertouch
  - 512 programs (4 banks x 128), 384 combos (3 banks x 128)
  - MIDI In/Out/Thru
  - Poly Chain
  - 2 Pedal/CV inputs (0-5 VDC)
