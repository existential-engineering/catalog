description: The Cinema 60 is a premium 7.2 channel AV receiver powered by HEOS
  with Dolby Atmos, 100W per channel, 8K video support, and 6 HDMI inputs. It
  raises the standard of foundational luxury home theater with its timeless
  design and wide array of immersive audio formats, delivering warm, spacious
  sound and intuitive performance for apartments and family rooms alike. It
  supports 7.2-channel immersive audio at 100 watts per channel with streamlined
  HDMI connectivity and carefully selected components, including a Class A/B
  amplifier topology with current feedback and discrete power amplifier with
  HDAM circuitry.
details: |-
  CINEMA 60 raises the standard of foundational luxury home theater with its timeless design and wide array of immersive audio formats. Supporting 7.2-channel immersive audio at 100 watts per channel with streamlined HDMI connectivity and carefully selected components, it delivers warm, spacious sound and intuitive performance for apartments and family rooms alike.

  A modern expression of timeless design principles, CINEMA 60 includes the iconic Marantz porthole, symmetry, and visual cues representing legendary Marantz quality.

  Immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics are legendary hallmarks of Marantz sound, and the Marantz Sound Master tuned CINEMA 60 around proprietary HDAM amplification circuitry.

  CINEMA 60 comes complete with the latest immersive audio formats, 8K video, room optimization and streaming. Seven speaker terminals, a 7.2-channel pre-out, phono (MM), two coaxial and two optical digital inputs and a zone pre-out cover the system.
specs: |-
  - 7 powered channels, 100 W per channel (8 ohm, 20 Hz - 20 kHz, 0.08% THD, 2ch driven)
  - 140 W per channel (6 ohm, 1 kHz, 0.7% THD, 2ch driven), 200 W (6 ohm, 1 kHz, 10% THD, 1ch driven)
  - 7.2-channel pre-out with two subwoofer outputs
  - Class A/B discrete power amplifier with current feedback topology, assignable bi-amp drive
  - Seven speaker terminals, 4-16 ohm impedance
  - Six HDMI inputs (three 8K) and two HDMI outputs (ARC and eARC), HDCP 2.3
  - Dolby Atmos, Dolby Vision and DTS:X immersive audio and video formats
  - Audyssey MultEQ XT with Dynamic EQ and Dynamic Volume
  - HEOS built-in, AirPlay 2, Spotify Connect, Bluetooth with headphone retransmit
  - Zone 2 pre-out, DC trigger out, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 650 W, standby 0.2 W, weight 24 lbs., 17.4 x 13.5 x 6.5 in. without antenna
