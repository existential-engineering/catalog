name: Cinema 60
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/av-receivers/cinema-60/300617.html
description: The Cinema 60 is a premium 7.2 channel AV receiver powered by HEOS
  with Dolby Atmos, 100W per channel, 8K video support, and 6 HDMI inputs. It
  raises the standard of foundational luxury home theater with its timeless
  design and wide array of immersive audio formats, delivering warm, spacious
  sound and intuitive performance for apartments and family rooms alike. It
  supports 7.2-channel immersive audio at 100 watts per channel with streamlined
  HDMI connectivity and carefully selected components, including a Class A/B
  amplifier topology with current feedback and discrete power amplifier with
  HDAM circuitry.
details: |-
  The Marantz Cinema 60 is a premium 7.2-channel AV receiver designed for luxury home theater applications in apartments and family rooms. It delivers 100 watts per channel through a Class A/B amplifier topology with current feedback, featuring discrete power amplifier stages with proprietary HDAM (Hyper Dynamic Amplifier Module) circuitry.

  The receiver supports a comprehensive range of immersive audio formats including Dolby Atmos, Dolby TrueHD, Dolby Atmos Height Virtualization, Dolby Atmos Music, Dolby Surround, DTS:X, DTS HD Master, DTS Neural:X, and DTS Virtual:X. Audyssey MultEQ XT room correction with Dynamic EQ and Dynamic Volume helps optimize playback for any listening environment.

  Video capabilities include 8K/60Hz and 4K/120Hz pass-through across 6 HDMI inputs (3 with 8K support) and 2 HDMI outputs (one with eARC/ARC). HDR support encompasses HDR10+, HLG, Dolby Vision, and Dynamic HDR, with gaming-focused features like ALLM, VRR, and QFT.

  Streaming and connectivity are powered by HEOS multi-room technology, with built-in support for AirPlay 2, Spotify Connect, TIDAL, Amazon Music HD, and Roon Ready certification. The receiver supports Alexa, Google Voice, and Apple HomePod voice control, plus Bluetooth with retransmit capability for headphones. Lossless playback includes FLAC, WAV, and ALAC at 192/24 plus DSD 2.8/5.6 MHz.
specs: |-
  - 7.2 channel AV receiver
  - 100W per channel (8 ohm, 20Hz-20kHz, 0.08% THD)
  - 140W per channel (6 ohm, 1kHz)
  - 200W single channel (6 ohm, 1kHz)
  - Class A/B amplifier topology with current feedback
  - Discrete power amplifier with HDAM circuitry
  - Dolby Atmos, Dolby TrueHD, Dolby Atmos Height Virtualization, Dolby Atmos Music, Dolby Surround
  - DTS:X, DTS HD Master, DTS Neural:X, DTS Virtual:X
  - 6 HDMI inputs (3 support 8K), 2 HDMI outputs (1 with eARC/ARC)
  - 8K/60Hz and 4K/120Hz video pass-through
  - HDR10+, HLG, Dolby Vision, Dynamic HDR support
  - HDCP 2.3 support
  - ALLM, VRR, QFT for gaming
  - HDMI pass-through in standby
  - 4 analog line inputs
  - Phono (MM) input
  - 2 optical digital inputs
  - 2 coaxial digital inputs
  - 7.2 multichannel preamp outputs
  - 2 subwoofer outputs
  - 7 assignable speaker terminals
  - Multi-room analog output (Zone 2)
  - Front-panel USB-A input
  - Ethernet and Wi-Fi connectivity
  - Audyssey MultEQ XT room correction
  - Audyssey Dynamic EQ and Dynamic Volume
  - HEOS multi-room and streaming built-in
  - AirPlay 2, Spotify Connect, TIDAL, Amazon Music HD, Roon Ready
  - Alexa, Google Voice, and Apple HomePod voice assistant compatible
  - Bluetooth with retransmit for headphones
  - Lossless playback: FLAC HD 192/24, WAV 192/24, ALAC 192/24
  - DSD playback: 2.8 MHz / 5.6 MHz
  - Gapless playback support
  - MDAX2 compressed audio enhancer
  - Pure Direct mode
  - IP Control, RS232, Web Control, App Control
  - 1 DC Trigger output, IR Flasher input
  - Marantz Remote Bus
  - RC049SR system remote
  - Marantz AVR Remote App and HEOS app for iOS/Android
  - Active power consumption: 650W
  - Standby power consumption: 0.2W
  - Dimensions: 17.4" W x 6.5" H x 13.5" D (without antenna)
  - Weight: 24 lbs
  - Color: Black
  - 7 year warranty
