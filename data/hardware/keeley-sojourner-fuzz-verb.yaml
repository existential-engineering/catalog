description: A dual pedal pairing the Psi Fuzz circuit with an ambient reverb
  engine carrying reverse and shimmer algorithms, plus an insert jack between
  the two sides.
details: |-
  The Sojourner Fuzz Verb puts a thick, creamy fuzz alongside a set of ambient reverb soundscapes in a dual pedal format, built to let players create dreamy textures from fuzz and reverb together rather than from either alone.

  The fuzz side is Keeley's Psi Fuzz, a heavily modified take on the op-amp Pi. The layered op-amp circuit adds the warmth of a vintage germanium transistor output stage, giving a thick, full-range fuzz with enhanced midrange presence, tight bass and a compressed polish.

  The reverb side is based on the Aurora Reverb platform with new algorithms, including reverse and shimmer. Reverse reverb scatters the echoes, and shimmer adds a decay of high-octave trails. Decay, blend and warmth set whether the result is a long, expansive ambience or a subtle space around the dry sound. An insert jack allows other effects to be placed between the two sides.
