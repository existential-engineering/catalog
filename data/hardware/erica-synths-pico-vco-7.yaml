description: Digital VCO with 32 waves.
details: |-
  Erica Synths Pico VCO is a deep sounding digital oscillator with 32 selected waves, among them classical shapes, waves fattened with a sub-oscillator and FM synth tones. Generating similar sounds would typically take several rather expensive modules.

  There is an extra feature on top of that: flip a switch and the module becomes a versatile LFO, with wave morphing available in the LFO setting. The waves sit in two banks of 16, and wavesurfing between them is voltage controlled.

  The VCO frequency range runs from 30Hz to 5kHz and the LFO range from 0,1Hz to 20Hz, with a 1V/Oct input that takes +1V to +8V and an output amplitude of 10V peak to peak. The Pico Series set Erica Synths the challenge of fitting superior functionality into a 3HP panel at an affordable price, and this module is 3HP wide and 35mm deep.
specs: |-
  - 2 banks, 16 waves each
  - VCO/LFO mode
  - Voltage controlled wavesurfing
  - Wave morphing in LFO setting
  - VCO frequency range 30Hz to 5kHz
  - LFO frequency range 0,1Hz to 20Hz
  - 1V/Oct input signal amplitude +1V to +8V
  - Output amplitude 10V ptp
  - Power consumption +26 mA, -4 mA
  - Module width 3HP
  - Module depth 35 mm
