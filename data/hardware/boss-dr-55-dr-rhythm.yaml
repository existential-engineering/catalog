name: DR-55 Dr. Rhythm
manufacturer: boss
primaryCategory: drum-machine
description: >-
  The DR-55 Dr. Rhythm was one of the first step-write-style drum machines and
  the inaugural model in Boss' successful Dr. Rhythm series, designed for
  musicians seeking affordable drum accompaniment.
details: |-
  The DR-55 Dr. Rhythm was released in 1980 and represented a breakthrough in accessible rhythm programming. It was one of the first step-write-style drum machines, offering an incredibly basic yet intuitive interface that made it instantly popular with guitarists and musicians across skill levels. The device proved ideal for those seeking drum accompaniment for practice sessions and home recordings.

  The machine provided substantial pattern storage with capacity for six 16-step patterns plus two additional 12-step patterns. The 12-step patterns enabled musicians to program 3/4 and 6/8 time signatures. A variation switch allowed real-time pattern modifications during playback, adding flexibility to live performance and experimentation.

  The sonic palette consisted of four essential percussion sounds: Kick Drum, Snare Drum, Rim Shot, and Hi-Hat. These sounds compared favorably to Roland's CR-series rhythm machines and entry-level TR-machines like the TR-505 and TR-606. Global controls enabled adjustment of Volume, Tempo, Tone, and Accent across all drum sounds.

  Programming utilized straightforward step-mode methodology: users selected Write Mode, chose a sound, then used Start and Stop buttons to input notes and advance through the pattern sequence. Only Kick, Snare, Rim Shot, and Accent could be placed individually in step mode, while Hi-Hats operated through preset rhythmic divisions (8ths, 12ths, or 16ths).

  Notable artists including New Order, The Cure, Chris Carter, Sisters of Mercy, Chris & Cosey, Xeno & Oaklander, Soft Cell, and Thomas Dolby utilized this instrument. While contemporary sound sampling has diminished its practical value, the DR-55 retains historical significance as Boss' inaugural DR-machine and an important early programmable drum device.
specs: |-
  - Polyphony: 4 voices
  - Oscillators: 4 sounds (Kick, Snare, Rim, Hat)
  - Sequencer: 16-step sequencer
  - Memory: 8 patterns (six 16-step, two 12-step), no song mode
  - Control: CSQ sync
  - Date Produced: 1980
