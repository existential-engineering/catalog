description: The SC2070 is an active 2-way midfield studio monitor from EVE
  Audio that pairs the extra-large Air Motion Transformer RS7 with a 6.5"
  SilverCone woofer and 250 W of Class D amplification. Its crossover sits at
  1800 Hz, unusually low for a 2-way design, giving midrange imaging closer to
  that of a 3-way system.
details: |-
  The SC2070 combines the technologies of the SC3070 and the TEC Award-winning SC4070 in a compact 2-way system. The Air Motion Transformer RS7 has been specifically developed for the SC2070 to achieve a crossover frequency at 1800 Hz that is astonishingly low for a 2-way monitor. Its diaphragm area is 1.5 times larger than that of the tweeter membrane used in the SC207, and high and upper midrange frequencies are reproduced with precision and resolution that reveals the smallest nuances.

  An optimised, low-resonance enclosure with a reinforced front baffle houses the Air Motion Transformer RS7 and a 6.5" SilverCone woofer, as well as the amplifier unit with a total output power of 250 W. Intelligent protection mechanisms prevent the drivers from overload, and the bevelled cabinet edges reduce sound diffractions.

  All adjustments can be made via the SMART-knob, which is a trademark of all EVE Audio studio monitors. A variety of adaptations to the respective room situation can be made in the easiest way possible from the front of the studio monitor. On the strength of the combination of these technologies, the SC2070 offers performance for its compact size with maximum impulse fidelity.

  The Air Motion Transformer RS7 is the largest AMT used in a 2-way monitor. Its diaphragm area is 1.5 times larger than that of the AMT RS1, RS2, RS3 and RS3.1 used in other EVE Audio models, and almost as large as the AMT RS6 employed exclusively in the SC3010 and SC3012 main monitors. With a crossover frequency set as deep as 1800 Hz, the midrange imaging is assured at levels like those normally found in 3-way systems.

  The 6.5" SilverCone woofer is driven by an advanced, low distortion copper cap magnet system with a 1.5" voice coil. The combination of very light and extremely stiff honeycomb cone material enables this woofer to provide a solid base with low distortion and precise, dynamic bass. Two Class D amplifiers complete the system, and the maximum input level can be adjusted between 7 dBu and 22 dBu to ensure the best possible A/D converter resolution.
specs: |-
  - Frequency range: 38 Hz - 25 kHz
  - Woofer size: 6,5"
  - Max. SPL: 106 dB
  - Dimensions: 230x345x304 mm (9.1x13.6x12 inches, WxHxD)
  - Output power: 250 W per speaker
  - Tweeter: AMT RS7
  - Output power tweeter: 100 W
  - Output power woofer: 150 W
  - Cross-over frequency: 1800 Hz between drivers
  - Mid EQ: 1 kHz (-3 dB to +3 dB)
  - Weight: 9,4 kg (20.7 lb)
  - Input level dip switch: +7 dBu / +22 dBu
  - Power consumption: less than 1 W standby, 170 VA maximum
