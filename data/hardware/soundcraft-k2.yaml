details: |-
  Sometimes there's just no substitute for experience. Live sound puts special
  demands on both equipment and personnel, because there's no second take, and
  because anything less than total reliability can mean disaster. Then there's the
  physical punishment of touring, and the need to work in a wide variety of
  environments.

  After more than 25 years of designing and building mixers for professional live
  sound, Soundcraft has earned a reputation that's second to none. The K2 is the
  most cost-effective fully-featured 8-bus live console ever, delivering all the
  facilities needed for a first-rate production.

  The K2 includes many features expected only on a much bigger console — an
  advanced solo system, true left-centre-right bussing, a built-in matrix, and
  full 4-band EQ. Available in three frame sizes from 24 to 48 mono input
  channels, with an additional eight stereo input channels.
