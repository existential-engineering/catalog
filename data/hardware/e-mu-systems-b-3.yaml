description: >-
  The E-mu B-3 is a programmable rack module designed to authentically recreate the
  classic sound of the Hammond B-3 tonewheel organ. It uses 32MB of sampled B-3 sounds
  across various drawbar settings, combined with built-in distortion and rotary speaker
  emulation for a convincing organ experience.
details: |-
  The B-3 module features a sophisticated sound engine based on extensive sampling of original B-3 tonewheel organ sounds. The 32MB "Definitive B-3" soundset captures the instrument across multiple drawbar configurations, allowing users to access the full tonal palette of the classic Hammond organ. The module includes built-in distortion processing and a Leslie rotary speaker emulator with real-time controls, enabling authentic B-3 performance characteristics.

  The system offers significant expandability for users seeking additional sonic capabilities. The module ships with one 32MB soundset as standard, but users can expand capacity up to 128MB through three additional ROM slots. Expansion cards are available including options like the Pure Phatt soundset, Beat Garden, and Siedlaczek Orchestra samples. This interchangeable ROM approach allows users to combine the B-3 organ sounds with sounds from other E-mu modules like the Proteus, Orbit, and XK-6 series.

  The B-3 provides 64 voices of polyphony expandable to 128 with the optional Turbo upgrade, along with 12 assignable front-panel real-time controllers and a 24-bit dual stereo effects processor. With 384 ROM presets and 512 user preset slots, the module offered substantial sound design flexibility for both studio and live performance applications.

  As part of E-mu/Ensoniq's broader modular product ecosystem of the late 1990s, the B-3 represented one of the best dedicated hardware solutions for Hammond organ emulation available at the time, earning professional use from artists including Steve Walsh of Kansas.
specs: |-
  - Polyphony: 64 voices (expandable to 128 with Turbo upgrade)
  - Sound Engine: 32MB ROM "Definitive B-3" Soundset
  - Effects: 24-bit dual stereo effects processor
  - Presets: 384 ROM presets, 512 user presets
  - Real-time Controls: 12 assignable front panel controllers
  - MIDI: 32 channels
  - Expansion: 3 additional 32MB ROM slots (up to 128MB total)
  - Form Factor: 1U rack module
