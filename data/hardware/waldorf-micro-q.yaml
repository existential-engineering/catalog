description: >-
  The Waldorf Micro Q is a compact 2U rack module that delivers the full power of the
  Waldorf Q synthesizer in an affordable format. It features 25 voices of polyphony
  expandable to 75, five oscillators per voice with wavetable capabilities, and dual
  resonant filters. The Micro Q also includes a built-in stereo vocoder, ring modulator,
  and a versatile 16-slot modulation matrix.
details: |-
  The Micro Q brings the acclaimed sound engine of the Waldorf Q into a space-efficient 2U rack format without compromising on sound quality. Each voice offers five oscillators including pulse with PWM, sawtooth, triangle, sine, and two wavetables with 128 waves each, plus a sub-oscillator and noise generator.

  The dual filter architecture provides low-pass, band-pass, high-pass, notch, and comb filters at 12dB and 24dB slopes, all capable of self-oscillation. Four ADSR envelopes with loop and one-shot modes, three audio-rate LFOs, and a 16-slot freely routable modulation matrix offer deep sound design possibilities.

  Built-in effects include chorus, flanger, phaser, distortion, delay, and a stereo vocoder, with two effects available per program and up to five in multimode. The synthesizer stores 300 single programs, 100 multi programs, and 20 drum maps, and excels at punchy analog-style basses, leads, trance pads, and percussion.

  A keyboard version was also available featuring 37 keys, pitch and mod wheels, and pedal inputs. The Micro Q supports full 16-part multitimbral operation over MIDI.
specs: |-
  - 25-voice polyphony, expandable to 75 with voice expansion board
  - 5 oscillators per voice: Pulse with PWM, Sawtooth, Triangle, Sine, 2 wavetables with 128 waves each, sub-oscillator
  - Noise generator
  - 2 filters per voice: Low Pass, Band Pass, High Pass, Notch, Comb Filter (12dB/24dB slopes)
  - 4 ADSR envelopes with loop and one-shot modes
  - 3 LFOs with audio-rate capability
  - 16-slot modulation matrix with free routing
  - Effects: Chorus, Flanger, Phaser, Distortion, Delay, Vocoder
  - 2 effects per program, up to 5 in multimode
  - 16-step arpeggiator with presets and user patterns
  - 300 single programs, 100 multi programs, 20 drum maps
  - 16-part multitimbral over MIDI
  - MIDI In/Out/Thru
  - 2U rack format
