description: A passive 2hp Eurorack module combining a stereo mute,
  bidirectional A/B switch, and 3.5mm stereo TRS to mono TS integrator for
  stereo signal routing.
details: |-
  Hey there, Eurorack enthusiast! I can tell that you're into stereo signals, and I agree, they're cool - but you know what's not cool? The lack of stereo mutes and switches in Eurorack. Yes, that's right, I said it, someone had to: there is a severe lack of stereo performance mutes and switches in Eurorack, yes, even ways to integrate 3,5mm stereo TRS cables with your system. You may have bought an SFXI from Herzlich to integrate stereo signals, but now you're fiddling around with weird stereo Y-adapters, or maybe you bought an sOffset and wish there was a way to A/B switch the output with a single click? Maybe, you want your SFXI output to be routed to two different places? Whatever the case may be, the Stereo Apnea is your little problem solver: mute, bidirectional A/B switch and TRS stereo to TS mono adapter all in one module. So stereo system enjoyer: make your stereo system even more enjoyable today, with this little utility module in just 2hp that will help you route the things that really matter, and make things go quiet when you need to. You've earned it.
