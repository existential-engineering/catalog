description: The Epoch Bias expands upon the Epoch Boost with four controls —
  Preamp, Boost, Bias, and Filter — to faithfully replicate the preamp
  characteristics of the Maestro EP-3 solid-state Echoplex. The Bias knob
  simulates out-of-spec vintage components to shape gain and body, making it a
  versatile finishing touch anywhere in the signal chain.
details: |-
  The Epoch Bias is Catalinbread's most refined take on the legendary Maestro EP-3 Echoplex preamp circuit, building on the earlier Epoch Boost design with additional controls for greater tonal shaping.

  The Bias knob is the centerpiece of the design, simulating out-of-spec components found in aging original units. Adjusting it shifts the base gain and body of the signal, recreating the subtle harmonic character that made the Echoplex preamp so musically appealing.

  The Filter control provides a tasteful treble cut, allowing the pedal to integrate smoothly into a wide variety of rigs and signal chains. The Preamp knob offers gentle filtering that mimics the original Echoplex volume control behavior, while the Boost knob adds extra gain and volume to the circuit.

  Designed as a mastering tool, the Epoch Bias works well at any point in the signal chain — from first in line to add that classic EP-style push before other effects, to last in line as a tone-shaping finisher.
