description: A compact tube spot microphone based on the VM1 design, offering
  hyper-cardioid and omni polar patterns with exceptionally low self-noise and
  a finely balanced character. SSAIR Award winner 1999.
details: |-
  The Brauner Valvet is a tube microphone based on the VM1 design, engineered as a compact
  spot microphone. It features first-class components, excellent dynamics, and exceptionally
  low self noise, with a unique, finely balanced character that made it a standout in its
  class.

  The Valvet's directional characteristics lean toward hyper-cardioid, providing high back
  rejection that makes it well suited for use in acoustically challenging environments. An
  omni mode is also available for ambience recordings, giving the microphone versatility
  across different recording situations.

  A phase reverse switch is included to accommodate non-standard preamplifier configurations.
  The microphone features a compact construction paired with a newly developed microphone
  suspension system.

  The Valvet received the SSAIR Award in 1999 for Best Microphone in its category,
  recognizing its performance characteristics at its price point.
specs: |-
  - Equivalent Noise: < 11 dB(A) (IEC651)
  - Signal to Noise Ratio: > 83 dB (1 Pa / 1 kHz, Cardioid)
  - Sensitivity: 28 mV/Pa (Cardioid)
  - Polar Patterns: Omni, Cardioid
  - Frequency Range: 20 Hz - 22 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 115V or 230V external power supply
  - Phase reverse switch included
  - Award: SSAIR Award 1999 - Best microphone in its category
