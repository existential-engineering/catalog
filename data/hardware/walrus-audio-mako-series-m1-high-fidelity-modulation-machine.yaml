details: |-
  The M1 is a powerful multi-function modulation machine with six customized, studio-quality programs: Chorus, Phaser, Tremolo, Vibrato, Rotary, and Filter. Each program has a wealth of options to tune, tweak, customize and then save to one of nine onboard presets. A sound explorers delight, the M1 features a dedicated lo-fi knob allowing you to mix various lo-fi parameters to every program. Programs Chorus – Type I traditional chorus, Type II offset second chorus, Type III classic tri-chorus. Phaser - Type I 2-Stage, Type II 4-Stage, Type III Uni-Vibe modeled. Tremolo - Type I optical/bias, Type II harmonic, Type III patterned. Vibrato - Type I traditional, Type II vinyl RPM, Type III tape wow/flutter. Rotary - Leslie-style with horn/drum options. Filter - Type I lowpass, Type II highpass, Type III bandpass. Presets The M1 can save up to nine onboard presets, and 128 are accessible via MIDI. Tune and Tweak knobs give creative control over key modulation parameters and three lo-fi effects. Input/Output The M1 offers multiple input and output configurations. Momentary Functions Press and hold the TAP/SKIP to momentarily engage a skipping effect.
specs: |-
  - Six modulation programs: Chorus, Phaser, Tremolo, Vibrato, Rotary, Filter
  - Dedicated lo-fi knob mixing lo-fi parameters into every program
  - Up to nine onboard presets, 128 via MIDI
  - USB for firmware updates via walrusaudio.io
  - Input/Output: Mono In / Mono Out, Mono In / Stereo Out, Stereo In / Stereo Out
  - Shape (sine/triangle/square), Symmetry, Tone, Division controls
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
