description: The BAE 1073D is a Class A microphone preamplifier and equalizer in
  a 3-space wide 500 series format, combining the original 1073 design with
  enhanced high-frequency capabilities and a direct input option. It features
  premium Carnhill transformers, Elma gold-plated switches, Canford wire, and
  full point-to-point wiring.
details: |-
  The BAE 1073D (Deluxe) is a Class A microphone preamplifier and equalizer module built for the 500 series format, occupying 3 module spaces to accommodate premium components without compromise. It is based on the legendary 1073 circuit design, faithfully reproduced using point-to-point wiring and hand-soldered discrete electronics.

  The equalizer section provides three bands of control plus a high-pass filter. The high frequency band offers ±16dB of fixed shelving at 10kHz, 12kHz, or 16kHz. The low frequency band provides ±16dB of shelving at 35Hz, 60Hz, 110Hz, or 220Hz. The mid-range band delivers ±18dB of peaking at six frequency options: 0.36kHz, 0.7kHz, 1.6kHz, 3.2kHz, 4.8kHz, or 7.2kHz. A high-pass filter is switchable at 50Hz, 80Hz, 160Hz, or 300Hz.

  The preamplifier section provides 0–70dB of gain with a mic input impedance of approximately 1200/300Ω, a line input impedance of 10kΩ, and a DI input impedance of approximately 150kΩ. Equivalent input noise is -110dBu (unweighted, 300kHz bandwidth), and maximum output level is +27.4dBu at 600Ω.

  Construction uses Carnhill (St Ives) transformers, Elma gold-plated switches, and Canford wire throughout — the same premium parts philosophy applied across BAE's full 10-series line. A 180° phase reverse button is included. The unit requires ±16VDC at 120mA, supplied by a standard 500 series rack.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Gain Range: 0–70dB
  - Mic Input Impedance: ≈1200/300Ω
  - Line Input Impedance: 10kΩ
  - DI Input Impedance: ≈150kΩ
  - Output Impedance: 35Ω
  - Max Output Level: +27.4dBu @ 600Ω
  - CMRR: 100dB min @ 60Hz
  - Equivalent Input Noise: -110dBu (unweighted, 300kHz bandwidth)
  - Power Requirements: ±16VDC, 120mA (500 Series rack)
  - Format: 500 Series, 3-space wide
  - Dimensions: 4.5"W × 5.25"H × 5.5"D
  - Weight: 5 lbs / 2.72 kg
  - High Frequency EQ: ±16dB shelving at 10kHz, 12kHz, 16kHz
  - Low Frequency EQ: ±16dB shelving at 35Hz, 60Hz, 110Hz, 220Hz
  - Mid Range EQ: ±18dB peaking at 0.36kHz, 0.7kHz, 1.6kHz, 3.2kHz, 4.8kHz, 7.2kHz
  - High Pass Filter: 50Hz, 80Hz, 160Hz, 300Hz
  - 180° Phase reverse switch
  - Carnhill transformers
  - Elma gold-plated switches
  - Canford wire
  - Point-to-point wiring
  - Class A operation
