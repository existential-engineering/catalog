description: The Ferrofish PULSE8 AE is a compact AD/DA converter with 8
  balanced analog inputs, 8 balanced analog outputs and ADAT connectivity up to
  192 kHz. A high-resolution front display gives full visual control over levels
  and configuration.
details: |-
  The Ferrofish PULSE8 AE is a versatile and compact AD/DA converter designed to drop into a studio or live setup. Its 8 high-quality balanced analog inputs and outputs deliver precise and clean signal conversion, and the unit is built for professional workflows where reliable performance has to fit into a small space.

  The analog section carries 8 balanced TRS inputs and 8 balanced TRS outputs on quarter-inch jacks. Two ADAT input ports and two ADAT output ports handle the digital side, with SMUX support for higher sample rates: up to 192 kHz with 4 x 4 ADAT channels over SMUX/4, up to 96 kHz with 8 x 8 ADAT channels over SMUX/2, or up to 48 kHz with 16 x 16 ADAT channels.

  Clocking runs from a high-stability internal clock or from external sync over ADAT or word clock, with word clock input and output on BNC connectors. The high-resolution front display monitors input and output signal levels, and multi-coloured LED meters give clear visual feedback.

  A front-panel control knob and buttons handle navigation and configuration. USB-C allows remote configuration from the Ferrofish RemoteFish software, and MIDI input and output carry firmware updates. The unit runs from an external 12 V / 1 A power supply, in a compact housing suited to rack-mounted or desktop use.
specs: |-
  - 8 balanced TRS inputs (quarter-inch)
  - 8 balanced TRS outputs (quarter-inch)
  - 2 ADAT input ports
  - 2 ADAT output ports
  - SMUX support: up to 192 kHz with 4 x 4 ADAT channels over SMUX/4
  - Up to 96 kHz with 8 x 8 ADAT channels over SMUX/2
  - Up to 48 kHz with 16 x 16 ADAT channels
  - Word clock input and output on BNC connectors
  - High-stability internal clock, or external sync via ADAT or word clock
  - High-resolution front display for input and output level monitoring
  - Multi-coloured LED meters
  - Front-panel control knob and buttons for navigation and configuration
  - USB-C for remote configuration with Ferrofish RemoteFish software
  - MIDI input and output for firmware updates
  - External 12 V / 1 A power supply
  - Weight 2 kg
  - Dimensions 13 x 22 x 4.4 cm
