details: |-
  The ADX10 is a miniaturized condenser microphone designed for lavalier applications such as speech, presentation, and theatrical production. The ADX10 has the ability to accurately capture and reproduce vocals from a comfortable distance of 4″- 8″. This mic is clear, resistant to feedback, and easy to use.

  Designed with a uniformly controlled cardioid polar pattern, the ADX10 helps to isolate the area or section being miked from other vocals or instruments on stage. The ADX10 has a smooth, accurate frequency range of 50 Hz – 18 kHz. This mic is lightweight, low profile, and has a natural sound with an exceptional sound response.

  Primarily for use with AUDIX wireless systems, the ADX10 cardioid condenser microphone includes a tie-clip and a 3′ attached cable terminating to a mini-XLRf connector.
specs: |-
  - Polar pattern: Cardioid
  - Frequency response: 50 Hz - 18 kHz
  - Cable: 3' attached, mini-XLRf (TA3F) connector
  - Includes tie-clip
