description: The Kyber is Kiesel's modern, ergonomic model, the result of years
  of research and development and engineered for comfort and quick playing.
  Standard 6-string builds average 6 pounds or less.
details: |-
  With its modern performance specs and competitive pricing, the Kyber is the result of years of R&D. The guitar is Kiesel's most forward-thinking design, engineered for comfort, quick playing and precision with every note. Weighing in at 6 pounds or less on average for standard 6-strings, it was designed to be featherlight without compromising tone.

  The Kyber features Kiesel's most extreme arm contour and a uniquely shaped body that enhances classical position support while still excelling in standard position. A deep lower horn cutaway and sculpted neck heel give the player access across the entire fingerboard.

  The minimalist yet aggressive headstock pairs with the body's sleek lines for a balanced, modern silhouette. Rear-mounted strap buttons improve balance and remove visual clutter from the front.

  Each Kyber is available with a free roasted maple neck and black limba body, a combination chosen for both weight relief and resonant tone.
specs: |-
  - Configurations: 6-string and 7-string, in fixed and tremolo forms, with a multiscale option
  - Construction: bolt-on with radiused neck heel
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in, 1.71 in, 1.90 in or 1.92 in at nut depending on configuration
  - Fingerboard: ebony with 14 in or 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale lengths: 25.5 in, or 25.5 in to 26.5 in and 25.5 in to 27 in multiscale
  - Headstock: Kyber headstock
  - Bridge: Hipshot fixed or Hipshot Solo Saddle, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Bridge pickup: direct-mount passive Kiesel Thorium humbucker
  - Neck pickup: direct-mount passive Kiesel Empyrean humbucker
  - Electronics: master volume control with push-pull coil splitting, 3-way pickup selector, flush mount output jack
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Rear-mounted strap buttons
  - Body dimensions: 37.25 in long, 1.375 in thick, 12.6 in wide, or 39 in long, 1.65 in thick, 12.6 in wide
  - Weight: 6 lbs to 6.25 lbs
  - Strings: Elixir Nanoweb 1046E
  - A headless counterpart, the Kyber Headless, is a separate model
