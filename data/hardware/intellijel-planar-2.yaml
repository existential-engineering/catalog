description: Modulator Joy The most complex modulator is you. The Planar 2 puts
  macro control over six outputs—including a quad panning mixer—into your hands
  with a buttery smooth joystick. Record up to 30 seconds of your own movements,
  stretch it or mangle it with scan mode, use a trigger for playback, or just
  loop it—synced or not. Add yourself to your patch.
details: |-
  With its smoothly responsive precision joystick, Planar² facilitates hands-on vector control of two entirely independent sets of outputs (quadrants A-D, and axis X/Y), plus the ability to capture and playback your gestures. Recording your joystick movements enables the creation of organic and complex envelopes, wild and wobbly LFOs, or extended sonic evolutions.

  It mixes, morphs, routes and pans audio inputs, triggers gates, outputs control voltages, and is itself CV-controllable. Its multitasking and tactile interface makes it a flexible and unique control device, no matter what your musical genre.

  Quad mixing & crossfading: vector mixing and crossfading of four independent inputs (A, B, C, D) to either individual outputs or the mixed output. Quad panning: connect a mono source to Input A and use the joystick to pan it to any of the four outputs; connect a stereo signal to Inputs A and C to pan it in quadraphonic space.

  CV Gesture Recorder: record joystick motions (including gates) to play back either as 1-shot complex function generators or as looped, LFO-like functions. Start time and length can sync to an external trigger, and punch-in/out recording is supported.
specs: |-
  - Width: 14HP
  - Depth: 40mm
  - Power: 85mA @ +12V, 32mA @ -12V
  - Firmware: v1.3.1 (installed via web updater)
  - Vector control of two independent sets of outputs: quadrant-based (A, B, C, D) and dual-axis based (X, Y)
  - X/Y Controller: two-axis CV generator sends unipolar (0V to +10V) or bipolar (-5V to +5V) signal
  - External CV Inputs: two CV inputs allow external control of quadrant outputs A-D and axis outputs X/Y
