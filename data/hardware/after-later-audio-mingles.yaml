description: A dual 3-channel panning mixer with a built-in LFO, offering CV
  control over both level and panning on each channel.
details: |-
  The Mingles is a dual 3-channel panning mixer with a built in LFO. It provides
  two separate three-channel mixers, each with potentiometers for input level and
  panning, plus CV control over both.

  The built-in LFO is normalled to the panning CV inputs: channel 1 receives the
  LFO and channel 2 an inverted copy, so the two mixers pan against each other.
  A rear jumper switches the LFO waveform between triangle and square. Panning is
  equal-loudness and the VCAs have a linear response. All channels feed a main
  output carrying the full mix.

  Mingles can connect through pin headers into a Barback or Bartender without
  taking up a separate channel.
