url: https://tascam.com/us/product/us-4x4hr
description: 4-in/4-out USB audio/MIDI interface with four Ultra HDDA mic
  preamps (EIN −128dBu), +48V phantom power, 24-bit/192kHz resolution,
  zero-latency direct monitoring, loopback, and dual headphone outputs. Connects
  via USB-C and is compatible with Windows, macOS, iOS, and iPadOS. Bus-powered
  or optional DC adapter.
details: |-
  Desktop 4-in/4-out USB interface. Ultra HDDA preamps: EIN −128dBu, gain 56dB, switchable +48V phantom per channel. Inputs 1–2 also switchable to instrument Hi-Z (1MΩ) via the same combo jack. All 4 line outputs are balanced TRS. Dual independent headphone outputs (45mW+45mW at 32Ω), each with its own level control. USB-C at USB 2.0 Hi-Speed. 5-pin DIN MIDI IN/OUT. Bus-powered (2.25W) or optional PS-P1220E DC adapter (included). Loopback function for streaming. Compatible with Windows, macOS, iOS, iPadOS.
specs: |-
  - - Combo inputs: XLR/TRS; EIN ≤−128dBu; gain 56dB; +48V phantom; 2.2kΩ
  - Instrument inputs CH1–2: 1MΩ (shared combo jack)
  - Line outputs: 4× 1/4" TRS balanced; nom +4dBu; max +20dBu
  - Headphone: 2× 1/4"; 45mW+45mW @ 32Ω
  - USB: Type-C, USB 2.0 Hi-Speed
  - MIDI: 5-pin DIN IN + OUT
  - Sample rates: 44.1/48/88.2/96/176.4/192kHz; 24-bit
  - S/N: 110dB; THD+N: 0.0013%; freq response: 20Hz–20kHz +0/−0.4dB
  - Power: USB bus (2.25W) or DC adapter (PS-P1220E)
  - Dimensions: 296(W) × 65(H) × 160(D) mm; weight: 1.6kg
