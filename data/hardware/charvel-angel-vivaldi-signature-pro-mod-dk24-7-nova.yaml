details: |-
  The Angel Vivaldi Signature Pro-Mod DK24-7 Nova is a 7-string electric guitar developed in collaboration with instrumentalist Angel Vivaldi. Built around a Basswood Dinky body with a sculpted heel, the instrument is finished in Satin Black or Satin Sage Green and trimmed with gold hardware throughout, giving it a distinctive modern aesthetic that suits Vivaldi's flamboyant playing style.

  Playability is anchored by a three-piece bolt-on maple neck with graphite reinforcement and a satin finish. The neck features Angel Vivaldi's custom profile with rolled edges, a heel-mount truss rod adjustment wheel, and a 4-bolt sculpted heel that supports unrestricted upper-fret access for extended-range lead work.

  The maple fingerboard sports a 12"-16" compound radius, 24 jumbo frets, cascading black dot inlays, and Luminlay side dots for low-light visibility. A 25.5" scale length, paired with a 1.875" Graph Tech TUSQ XL nut, keeps string tension comfortable for 7-string tuning while preserving fast-playing feel.

  Tone is delivered by a pair of gold-bobbin DiMarzio pickups - a Tone Zone 7 in the bridge and an Air Norton 7 in the neck - routed through a 5-position blade switch with volume and tone controls (dome-style knobs). The Gotoh Custom 7-String 510 tremolo and Charvel-branded die-cast locking tuners provide reliable tuning stability for aggressive bends and whammy use.

  Topped with a reverse 7-string licensed Fender Stratocaster headstock and shipped with nickel-plated steel strings (.009-.054 gauges), the DK24-7 Nova is a signature instrument tailored to modern progressive metal and instrumental rock players.
specs: |-
