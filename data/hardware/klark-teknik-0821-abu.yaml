description: The DN3603 is the remote docking station that extends control of
  the DN3600 programmable graphic equaliser system out from the rack to the
  engineer at the listening position. It lets a touring engineer adjust EQ from
  front-of-house rather than walking back to the amp world.
details: |-
  The DN3603 docks the DN3698 handheld remote into a fixed-location interface that connects to the DN3600 master unit. The combination delivers full programme control, covering snapshot recall, scene management and parameter adjustment, from the engineer's mix position.

  The DN3603 is built for touring use, with connector strain relief, panel finish and electrical robustness in line with other Klark Teknik products. It is part of an integrated programmable-EQ system designed end to end at the Kidderminster facility.

  The design reflects the view that control belongs where the ears are, with the dock acting as the bridge between the mix position and the rack.
specs: |-
  - Remote docking station for the DN3600 programmable graphic equaliser system
  - Docks the DN3698 handheld remote
  - Fixed-location interface connecting to the DN3600 master unit
  - Provides snapshot recall, scene management and parameter adjustment
