description: As music has progressed, drummers have often gone from being just
  timekeepers to contributing more broadly to musical expression. This has led
  drummers to explore more flexible and creative setups enabling greater
  artistic freedom on the drum kit.
details: |-
  Quick-Set Hi-Hat Clutch (US.PAT.NO.9812101): With just one touch, the Quick-Set Clutch can be attached or removed - simply push the button on the side of the clutch. The clutch also allows the top hi-hat cymbal to float more freely, maximizing the natural resonance of the cymbals.

  Non-Loosening Tension Rod: Specially shaped plastic and metal nuts fit together perfectly to keep the cymbal rod from loosening while playing.

  JAGWIRE™ Triple-Layered Ultra-Smooth Cable: We developed this cable with the full cooperation of the JAGWIRE™ company, which produces brake cables for some of the world’s best mountain bikes. We started with a high strength stainless steel wire that has been proven effective in the most rigorous bike races. We then adopted a three-layer covering for the cable that boasts a very high flex resistance. To achieve the smoothest operation, we first polish the stainless steel wire, and then cover it with a lubricated tube, which reduces friction. Then we cover that tube with a circular hi-carbon coil, and finally wrap that protective covering made of PVC. This exclusive three layered construction leads to extreme durability without sacrificing smoothness or response… even for complex setups which require the cable to be bent in numerous places. We are confident we have produced a Remote Hi-Hat with playability and flexibility that is unparalleled by other products on the market.

  Exchangeable Cable: HH905RH comes with 2,300mm cable. Shorter 1,200mm cable is available separately. HH905RH2L (2,300mm) HH905RH2S (1,200mm)

  Clamp & Ratchet Arm: MC66 Universal Clamp and Ratchet Arm (Φ12mm, Arm Length: 200mm) are included.

  Lever Glide: The lever glide provides a versatile hi-hat for all style of playing. Even if you use a heavy bottom cymbal in the top position, you can still play astoundingly fast and powerfully. You will get a tight, crisp sound when the hi-hat is closed and be able to play with incredibly delicate nuances by half-opening and closing the hi-hat.
