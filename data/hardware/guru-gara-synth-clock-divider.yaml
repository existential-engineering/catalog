details: |-
  The Clock Divider Module (PCB and Front panel for Eurorack Moduler Synth)

  This versatile Eurorack Clock Divider module, powered by the iconic 4017 Decade Counter chip, is a must-have tool for creating complex and rhythmic sequences. With its simple yet powerful design, it offers a wide range of clock division options, opening up a world of rhythmic possibilities. Experiment with different divisions to create intricate polyrhythms, syncopated grooves, and evolving patterns. Whether you're building drum machines, sequencers, or other rhythmic devices, this module will help you bring your musical ideas to life. Key Features:

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
specs: |-
  - Versatile Clock Division: Select from 1/1, 1/2, 1/3, 1/4, 1/5, 1/6, or 1/7 clock divisions using the rotary switch.
  - Original Clock Output: Maintain the integrity of your original clock signal while deriving divided clocks.
  - Compact 6hp Eurorack Format: This module fits seamlessly into any Eurorack system, taking up minimal space while delivering maximum functionality.
  - Hand-Screened Front Panel: Each module features a unique, hand-screened front panel, adding a touch of artisanal craftsmanship to your Eurorack setup.
