name: VQ 60
manufacturer: tannoy
primaryCategory: speaker
url: https://www.tannoy.com/en/products/0312-aow
description: 3-way full-range large format loudspeaker for high-performance
  installation applications.
details: |-
  3-way full-range large format loudspeaker for high-performance installation applications. The VQ 60 is a self-powered, three-way loudspeaker system designed for applications requiring very high output capability with class-leading pattern control. Suited for use in arrays or singly in demanding applications; can produce enough power and clarity to be used individually or in paired clusters for wider coverage. Features dual 12" low-frequency transducers in a semi horn-loaded configuration with a Dual Concentric 3.5" and 1.75" diaphragm compression driver for mid and high frequency reproduction. Uses a patented PSW (Point Source Waveguide) technology providing acoustic centre alignment for a coherent wavefront. 60° conical dispersion allows tightly packed point-source clusters. Configurable for Bi-Amp or Tri-Amp operation in conjunction with Lake LM26/44 DSP or Lab Gruppen PLM+/D series platforms. Low-frequency extension to 90 Hz; can be combined with VSX series subwoofers for extended bandwidth. Enclosure is internally braced birch plywood with textured black paint finish and powder-coated perforated steel grille.
specs: |-
  - frequencyResponse: 115 Hz – 23 kHz (-3 dB)
  - frequencyRange: 90 Hz – 27 kHz (-10 dB)
  - sensitivity: 115 dB (1 W @ 1 m)
  - dispersion: 60° conical (-6 dB)
  - driverComponents: LF: 2 × 300 mm (12") low-frequency transducers, semi horn loaded; MF/HF: Dual Concentric 3.5" and 1.75" diaphragm compression drivers
  - crossover: Bi-amp: 450 Hz (active), 7 kHz (passive); Tri-amp: 450 Hz and 7 kHz (active)
  - directivityFactorQ: 21.2
  - directivityIndexDI: 13.3 dB
  - maximumSPL: 138 dB averaged, 144 dB peak
  - powerHandlingLF: 1,000 W continuous / 2,000 W peak @ 4 Ω
  - powerHandlingMF: 200 W continuous / 400 W peak @ 8 Ω
  - powerHandlingHF: 90 W continuous / 180 W peak @ 8 Ω
  - powerHandlingPassiveMFHF: 200 W continuous / 400 W peak @ 8 Ω
  - totalPower: 1,300 W continuous / 5,200 W peak
  - nominalImpedance: LF: 4 Ω, MF: 8 Ω, HF: 8 Ω
  - construction: 18 mm (0.71") plywood, internally braced
  - grille: Powder-coated perforated steel
  - finish: Textured black paint
  - fittings: 8 × recessed carrying handles, 12 × M10 flying inserts
  - dimensions: 925 × 694 × 515 mm (36.4 × 27.3 × 20.3")
  - weight: 77 kg (169 lbs)
