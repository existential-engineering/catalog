description: >-
  The Yamaha VSS-200 is a compact sampling keyboard from 1988, part of the
  PortaSound series, combining FM synthesis with sampling capabilities. It
  features a built-in microphone and line-in for recording samples, 100 presets,
  and a suite of DSP effects for creative sound manipulation. Despite its
  consumer-oriented design, it has become popular among lo-fi producers and
  circuit benders.
details: |-
  The VSS-200 was designed as an affordable, consumer-oriented instrument rather than a professional synthesizer. It operates across three functional sections: rhythm, preset, and sampler. The rhythm section provides 10 basic patterns with adjustable tempo and bass/chord accompaniment options. The preset section delivers 6-voice polyphony from its FM synthesis engine, though this is reduced when using accompaniment features.

  The device features a 49-key mini-keyboard without velocity sensitivity or aftertouch, paired with two built-in mono speakers. Sound recording utilizes either an onboard microphone, which requires loud input to trigger the gate, or a rear-panel line-in jack for superior results. Users can sample the internal sounds themselves and process them through the DSP effects suite.

  Despite its technical limitations, the VSS-200 has gained popularity among lo-fi music producers and circuit benders in recent years. The instrument represents an approachable entry point for experimentation with synthesis and sampling.
specs: |-
  - Polyphony: Up to 6 voices
  - Oscillator: 1 (sine waveform)
  - LFO: 1 (triangle waveform)
  - Envelope: ADSR volume envelope (VCA)
  - Arpeggiator: Single Finger A.B.C., Auto Bass Chord, Auto Bass modes
  - Rhythm Patterns: 10
  - Voice Presets: 100
  - Effects: 9 DSP effects (Loop, U-Turn, Echo, Fuzz, Reverse, AM, FM, Level Pitch)
  - Keyboard: 49 plastic mini-keys, non-weighted, no velocity or aftertouch
  - Sampler: 8-bit, 1.9 second maximum sample time at 16 kHz sample rate
releaseDate: "1988"
