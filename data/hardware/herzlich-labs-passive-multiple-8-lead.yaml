details: |-
  Oh no! You've spent so long crafting the perfect black and gold Eurorack system, and you realized that there is yet something missing - a 2 hp sized hole in need of a utility in black and beautiful gold! What ever shall you do! Worry not friend, Herzlich has your back once more. Not only is this beautiful multiple in black and gold, even the nuts are golden. Yes, the NUTS. Let that sink in. Do other manufacturers hand you gold nuts on a platter? No way! Only your friends at Herzlich do that. We are friends, right? Anyway, it's a passive multiple, you already know what it is and what it does - you know you need it, too. Just look at the gold! Not to mention, the topmost inputs are normalled to the lower inputs, so it serves both as a 1x8 mult as well as a 2x4 mult. Very nice. But if I were you, I wouldn't wait too long: it's a limited edition. I'm not going to do this forever you know, one day it'll be all gone! Then what are you gonna do, buy something else? I don't think so. Make a smart decision and buy my thing. Your friends will ooh and ahh when they see it, I promise. Are you still reading? Add me to the basket and buy me, this is not the time for thinking, it's time for action!
