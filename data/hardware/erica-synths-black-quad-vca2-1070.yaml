description: Quadrople VCA in compact size.
details: |-
  Erica Synths Black Quad VCA2, despite its compact size, is designed in line with the Black Series hi-fi philosophy, and custom pre-emphasis and de-emphasis circuits preserve all the nuances of the original signal.

  It is a versatile four channel voltage controlled amplifier and mixer module for use in complex modular systems. Each channel has a linear and logarithmic response selector and a signal level indicator LED. All outputs are sequentially mixed and the CV inputs are normalized to each other, so the module works in various configurations. If no CV is applied the Black Quad VCA2 performs as a signal mixer, and the fourth channel is DC coupled for controlling CV sources as well.

  Erica Black Series include high-end, unique functionality and superior quality modules. Only the best, highest-quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Black Series consist of a range of modules that are needed to put together an entire synth.

  CV level spans -10V to +10V, giving -80dB of attenuation at 0V and +3dB at +10V, with selectable linear or logarithmic response. The module occupies 10HP at a depth of 35mm.
specs: |-
  - 4 independent VCAs
  - Selectable lin/log response for each channel
  - Manual CV bias and signal level adjustment
  - Sequential output mixing
  - Signal level indicator LEDs
  - Fourth channel DC coupled for CV sources
  - CV level -10V to +10V
  - Attenuation -80dB at CV = 0V, +3dB at CV = +10V
  - Power consumption +64mA, -62mA
  - Module width 10HP
  - Module depth 35mm
