description: The 2CR is a two-channel module rack designed to house two 10
  series modules (such as 1073, 1084, 1066, and others). It features solid steel
  internal chassis that are custom molded for easy module insertion without
  guide rails. The unit includes separate output controls, phantom power
  capability, and two Carnhill OEP line transformers for direct instrument
  inputs.
details: |-
  The 2CR houses two 10 series BAE or vintage modules in a solid steel internal chassis with custom molding that allows easy module insertion without guide rails.

  Each channel includes a separate output knob and 48V phantom power. Two Carnhill OEP transformers provide high-impedance direct inputs suitable for bass and guitar.
