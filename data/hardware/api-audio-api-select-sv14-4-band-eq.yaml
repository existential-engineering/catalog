url: https://apiaudio.com/product/api-select-sv14-4-band-eq/
description: 500-series fully parametric 4-band EQ from API's value-tier Select
  line, re-engineered from the vintage APSI 562 circuit. Continuously variable
  frequency and gain per band, ±12 dB boost/cut, transformer-balanced output.
details: |-
  500-series fully parametric EQ based on the APSI 562 circuit
  (distributed by API in the 1970s–80s). 4 bands: Low (20–200 Hz), Low-Mid (100
  Hz–1 kHz), High-Mid (500 Hz–5 kHz), High (2–20 kHz). Dual concentric knobs per
  band for continuously variable frequency and gain. ±12 dB boost/cut per band.
  EQ in/out bypass switch. Transformer-balanced output. VPR Alliance compliant.
specs: |-
  - Input impedance: 15 kΩ (balanced)
  - Output impedance: 75 Ω (transformer balanced)
  - Frequency response: ±0.5 dB (20 Hz–50 kHz)
  - THD+N @ 1 kHz: <0.02%
  - Max level: +24 dBu
  - S/N ratio: 115 dB
  - Power: ±16V DC @ 35 mA
  - Dimensions: 1.5″ × 5.25″ × 7.0″
