description: Twin-channel guitar preamp faithfully recreating the sound of a legendary 5150 high-gain tube amp in a pedal, with independent channel controls, pre/post boost, optional cab simulation, and dedicated outputs for direct recording and live use.
details: |-
  Introducing the V550 preamp pedal that embodies a charismatic sonic profile reminiscent of the original tapping guitar god: Eddie van Halen.  The foundation of the V550 is rooted in a true modern amp classic from the 90s, and we went ‘that extra mile’ over and over again in our quest to model the essence of this amp. We were committed to reaching perfection, ensuring that every aspect of the sound, look, and feel was flawlessly executed before presenting you with this high-gain monster of a pedal.  Not only did we achieve that, but we also went above and beyond by incorporating a few additional features. In conclusion, we’re confident that once you plug into V550, you’re gonna love it!

  Not 100 Amps. Just One. But Captured to Perfection!

  In digital amp modeling, there are various approaches available. However, our primary objective was to marry accuracy with simplicity - to perfectly replicate just one iconic amplifier rather than overwhelming you with an excessive range of amp models and versions.  Our aim was to capture the very essence of this iconic amp with unparalleled precision, as well as keeping the control layout intuitive, allowing you to navigate your high-gain tone effortlessly. By eliminating unnecessary complexities, we enable you to focus entirely on making some of that (good) noise!  V550 simply distills the essential elements you expect from an authentic amp and presents them in a compact package with a small footprint. In short, you get a perfect balance of accuracy and simplicity, which lets you completely immerse yourself in your musical expression and nothing else.

  Two Ways to Stomp

  When you first connect to V550, its default mode is Dual Channel. In this mode, the pedal is always on, allowing you to effortlessly switch between the two channels and access their distinct sound profiles.  However, if you prefer a classic stompbox experience, we've also included a Bypass Mode. In this mode, you can simply stomp the pedal in and out, but you'll need to manually select which of the two channels you want to engage or disengage in your signal chain.  Whether you choose the versatile Dual Channel mode or prefer the familiar simplicity of the Bypass Mode, V550 guarantees uncompromising performance and power. The decision is entirely up to you - unleash your rock 'n' roll spirit any way you want!
