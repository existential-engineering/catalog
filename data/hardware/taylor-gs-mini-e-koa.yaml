details: |-
  The GS Mini-e Koa is Taylor's compact travel-friendly acoustic-electric, built around the GS Mini body shape with a reduced 23-1/2" scale length. The guitar features a solid Hawaiian koa top paired with layered koa back and sides, giving it a distinctive look and a clear, warm, punchy acoustic character that punches well above its size.

  Powered by Taylor's ES-B electronics system with a built-in digital chromatic tuner, the GS Mini-e Koa can be plugged directly into an amplifier or PA system. The tuner makes it an ideal instrument for travel, practice, and performance alike.

  The neck is crafted from neo-tropical mahogany with a West African Crelicam ebony fingerboard and matching ebony bridge. The nut is Nubone and the saddle is Micarta, while Taylor chrome tuners provide reliable tuning stability.

  A matte finish on the top and back/sides gives the GS Mini-e Koa a natural, understated appearance. A padded gig bag is included with purchase.
specs: |-
  - - Body Style: GS Mini
  - Top: Solid Hawaiian Koa (matte)
  - Back & Sides: Layered Koa (matte)
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale Length: 23-1/2"
  - Nut: Nubone
  - Saddle: Micarta
  - Electronics: ES-B with built-in digital chromatic tuner
  - Tuners: Taylor Chrome
  - Strings: D'Addario XS Coated Phosphor Bronze Medium (.013-.056)
  - Case: Padded gig bag included
