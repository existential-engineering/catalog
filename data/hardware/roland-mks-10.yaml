description: >-
  Roland's MKS-10 Planet-P is a 16-voice polyphonic piano sound module offering
  eight preset sounds across piano, clavinet, harpsichord, and electric piano
  categories.
details: |-
  The MKS-10 Planet-P delivers a focused set of keyboard sounds in a rack-mount format. Its eight presets cover two variations each of piano, clavinet, harpsichord, and electric piano timbres. Sound shaping is limited to a brilliance control for adjusting brightness and switchable short or long release time settings.

  Built-in effects include chorus, flanging, and two tremolo modes with adjustable rate and depth controls, adding some movement and character to the otherwise static presets. The unit is monotimbral, able to play sounds on only one MIDI channel at a time despite supporting all 16 channels for selection.

  Released in 1984, the MKS-10 was eventually replaced by the MKS-20, a digital piano module based on the Roland RD-1000. While the analog-generated sounds lack the realism of later digital offerings, the module holds some appeal as a vintage rack unit with a distinctive character of its own.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: Monotimbral
  - Oscillators: DCO
  - Modulation: Square or sine tremolo with rate and depth
  - Filter: Brilliance control
  - Envelope: Long or short release times
  - Effects: Chorus, flanger
  - Memory: 128 patches
  - Control: MIDI In/Out
