id: 75dVn9WR-a-xbp03zH4HH
name: ABM 1000
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-1000
description: The ABM 1000 is a professional 1000W bass amp head, delivering the
  acclaimed ABM sound through a lightweight Class D power amp. It pairs
  class-leading preamp sophistication with a variable Valve Drive control, the
  flexible ABM EQ (a 3-band layout supplemented by two pairs of sliders), a
  one-knob compressor and a sub-harmonic generator, all footswitchable via the
  FS-4 (not included). Professional connections include a sub-bass output, tuner
  output, transparent FX loop and a line input.
details: |-
  Professional Ashdown ABM bass head. 1000W Class D power amp (2000W peak power handling). Recognisable ABM VU meter with input-level control. Variable Valve Drive blends true valve overdrive into the signal, from a hint of hair to fat overdrive, presettable and footswitchable. ABM EQ: familiar Bass, Middle and Treble rotary controls plus two pairs of additional sliders; with sliders centred the knobs behave as a classic 3-band EQ, footswitchable in and out. One-knob compressor. Sub-harmonic generator adds an independently controllable octave below the played note. Professional connections: sub-bass output to feed the desk or a second amp, tuner output, transparent FX loop, and a line input for an external sampler or sound source; output muting cuts the DI output while leaving the tuner output live for silent tuning. Footswitchable Valve Drive, Compression, EQ and Sub-Harmonic Generator via the FS-4 footswitch (not included). One 12AX7 preamp tube. Power output: 1000W. Power handling: 2000W peak. Frequency response: -3dB @ 17Hz and 30kHz. High instrument input impedance: 3.9M Ohms. Low instrument input impedance: 10k Ohms. Line input impedance: 22k Ohms. Line output impedance: 10k Ohms. DI output: 600 Ohm. Tuner output impedance: 1k Ohms. Minimum impedance: 4 Ohm. FX send/return: 22k Ohms, 0dBu nominal. Dimensions (H x W x D): 134 x 474 x 315 mm. Weight: 9.6 kg.
specs: |-
  - Power output: 1000W
  - Power handling: 2000W peak
  - Speaker outputs: Speakon/Jack
  - Frequency response: -3dB @ 17Hz and 30kHz
  - High instrument input impedance: 3.9M Ohms
  - Low instrument input impedance: 10k Ohms
  - Line input impedance: 22k Ohms
  - Line output impedance: 10k Ohms
  - DI output: 600 Ohm
  - Tuner output impedance: 1k Ohms
  - Minimum impedance: 4 Ohm
  - FX send/return impedance: 22k Ohms, 0dBu nominal
  - Preamp tube: 1 x 12AX7
  - Dimensions (H x W x D): 134 x 474 x 315 mm
  - Weight: 9.6 kg
