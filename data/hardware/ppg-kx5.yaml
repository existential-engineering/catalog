description: >-
  The PPG KX5 is a 37-note remote MIDI keyboard controller with velocity and
  aftertouch sensitivity, designed for controlling synthesizers and modules from
  the stage. It features a ribbon controller for pitch and modulation effects,
  along with unison, sustain, and portamento buttons and a breath controller
  input.
details: |-
  The PPG KX5 was released in 1984 as a strap-on remote MIDI controller aimed at keyboardists who wanted to move freely on stage while controlling their synthesizer rigs. Built by PPG, the German company best known for their Wave series wavetable synthesizers, the KX5 offered a compact 37-note keyboard with both velocity and aftertouch sensitivity.

  A key feature of the KX5 is its ribbon controller, which provides continuous pitch bend and modulation control in a format well-suited to live performance. The controller also includes dedicated buttons for unison, sustain, and portamento, as well as a breath controller input for additional expressive control.

  Up to 64 patches can be accessed via a combination of 8 patch buttons, 4 bank buttons, and the sustain button. The KX5 supports 2 switchable MIDI channels, allowing performers to control multiple synthesizers or sound modules from a single controller. However, the buttons and ribbon control are non-assignable, which limits its flexibility compared to more modern MIDI controllers.
specs: |-
  - Keyboard: 37 notes with velocity and aftertouch sensitivity
  - Ribbon controller: Pitch bend and modulation
  - Controls: Unison, sustain, and portamento buttons
  - Breath controller: Input jack
  - Memory: 64 patches (8 patch buttons, 4 bank buttons, sustain button)
  - MIDI: 2 switchable channels
  - Limitations: Non-assignable buttons and ribbon control
