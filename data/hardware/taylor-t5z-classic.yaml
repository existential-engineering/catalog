description: The T5z Classic is a hybrid hollowbody guitar featuring a
  Neo-Tropical Mahogany top with Sapele back and sides, combining a concealed
  neck humbucker, middle humbucker, and acoustic body sensor with five-way
  switching for a wide range of acoustic and electric tones.
details: |-
  The T5z Classic is Taylor's entry-level hollowbody hybrid, designed to satisfy both electric and acoustic players. Its chambered Neo-Tropical Mahogany body with Sapele back and sides produces warm natural overtones while remaining lightweight, and the Venetian cutaway provides full upper-fret access.

  The three-pickup system combines two humbuckers with an acoustic body sensor, all routed through a five-way selector switch. This configuration spans pure acoustic warmth to full electric humbucker drive, or any blend between them — suited to recording, live performance, or practice.

  The T5 Carve neck profile is slender and fast-playing, capped with a West African Crelicam Ebony fretboard and jumbo frets. The 24-7/8" scale length and 1-11/16" nut width sit between traditional acoustic and electric dimensions.

  Finished in Classic Mahogany Stain satin finish. Ships with a gig bag.
specs: |-
  - - Body Type: Hollowbody electric/acoustic with Venetian cutaway
  - Top: Neo-Tropical Mahogany
  - Back & Sides: Sapele (multipiece back)
  - Neck: Neo-Tropical Mahogany, T5 Carve profile
  - Fretboard: West African Crelicam Ebony
  - Fretboard Inlay: Faux Pearl Small Diamonds
  - Fretboard Binding: Black
  - Frets: Jumbo
  - Scale Length: 24-7/8"
  - Nut Width: 1-11/16"
  - Nut: White TUSQ
  - Saddle: White Micarta
  - Bridge: West African Crelicam Ebony
  - Pickups: Two humbuckers + acoustic body sensor; 5-way switching
  - Tuners: Taylor Nickel with Nickel Buttons
  - Finish: Satin, Classic Mahogany Stain
  - Strings: D'Addario XS Coated Electric Medium (.011-.049)
  - Case: Gig bag included
