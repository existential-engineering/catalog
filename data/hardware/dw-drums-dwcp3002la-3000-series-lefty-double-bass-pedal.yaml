details: |-
  For over 50 years, DW has been the worldwide leader in hardware innovation. Every DW product launch has been followed with tireless development and the 3000 Series is no exception. The 3000 Series Lefty double bass pedal offers innovative features and enhanced player functionality making it a smart, versatile choice for drummers of all skill levels and playing styles.

  This all-metal, dual-chain double pedal has been updated with an Accelerator cam, adjustable footboard angle, and swivel toe clamp. The steel base plate also features an anti-skid rubber mat for greater stability.

  All-metal construction: DW design, precision, and durability for any drummer. Dual-Chain Accelerator Drive System: Increases velocity throughout the length of your pedal stroke.

  Two-Way DW 101 Beaters: These reversible beaters also feature adjustable shaft weight. Bearing Spring Rocker Assembly: A dual-bearing rocker allows the spring to follow the motion of each stroke.
specs: |-
  - Dual-Chain Accelerator Drive System
  - Delta stroke adjustment with ball bearing with detachable spring
  - Swivel toe-clamp
  - Two-Way DW101 beaters with memory lock
  - Steel base plates with anti-skid mats and included drum key
  - Left-footed configuration
