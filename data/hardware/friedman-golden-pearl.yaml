details: |-
  The Friedman Golden Pearl is a transparent, lower gain overdrive pedal designed to push already overdriven amps into seductive saturation. It can also be run into a clean amp to reach that elusive semi-broken-up tone.

  Designed to please the ultimate tone connoisseur, the responsive volume, gain and tone controls, along with the three-position high-frequency cut switch, let the pedal be tailored to the amp it sits in front of. Even greater refinement comes from the tri-mode clipping voice switch, which provides LED, diode, or no clipping voice options.

  True bypass switching keeps the pedal out of the way when it is off, and it runs on anything from 9 to 18 volts DC, with no battery compartment. Assembled in the USA and designed to withstand decades of abuse, the Golden Pearl is a pedal many players never want to turn off.
specs: |-
  - Transparent lower gain overdrive
  - Volume, gain and tone knobs
  - Three position high-frequency cut switch
  - Tri-mode clipping voice switch providing LED, diode, or no clipping
  - True bypass switching
  - Can be powered between 9 and 18V DC, no battery
  - Assembled in USA
  - Weight: 1 lbs
