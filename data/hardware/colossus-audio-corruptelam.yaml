description: A dual-feedback distortion Eurorack module built around a flexible,
  multi-stage gain architecture with switchable soft/hard clipping pre-amp, dual
  distortion circuits, voltage-controlled drive and blend feedback, and a
  post-EQ section.
details: |-
  CORRUPTELAM is a dual-feedback distortion module built around a flexible, multi-stage gain architecture. At its core is a pre-amplification stage equipped with a switchable soft or hard clipping mode, allowing the incoming signal to be shaped before it enters the main distortion paths. This pre-amp section feeds into two distinct distortion circuits:

  These two distortion styles can be selected either via the onboard toggle switch or through CV control. When a control voltage is present, the physical switch is overridden, allowing gates or triggers to morph the distortion character in real time. Both clipping circuits share a manual and voltage-controlled DRIVE stage, which pushes the signal into a BLEND control. This mixes the processed signal back into a feedback network —also manually and voltage controllable—before it reenters the amplification chain. The result is a highly interactive system capable of anything from gentle saturation to chaotic, self-oscillating textures. Following the gain and distortion stages, CORRUPTELAM provides a post-EQ section with Low, Mid, and High controls. Placed after a Pre-Gain knob, this EQ offers nuanced tone sculpting of the signal entering the parallel distortion paths. Designed for precision as well as extremity, CORRUPTELAM can deliver subtle coloration and refined amplification or unleash complete sonic devastation. The character is up to you. THIS IS A PRE ORDER, PLEASE ALLOW US 3/4 WEEKS FOR THE PRODUCTION

  English manual here
specs: |-
  - A cascading JFET topology, designed for dynamic, touch-sensitive saturation
  - A fourth-stage MOSFET and diode-clipping circuit, engineered for more aggressive, harmonically dense breakup
