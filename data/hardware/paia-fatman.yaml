description: >-
  The PAiA Fatman is a DIY analog monophonic synthesizer kit featuring two sawtooth oscillators,
  a 12dB resonant lowpass filter, and MIDI-to-CV conversion, available in both rack-mount and
  desktop module configurations.
details: |-
  First released in 1992 and still in production, the PAiA Fatman occupies a unique position as
  one of the longest-running DIY synthesizer kits on the market. Designed to be assembled by the
  user in approximately one day with basic soldering skills, it serves both as a functional
  instrument and an educational tool for understanding analog synthesis from the ground up.

  The sound architecture is straightforward but effective, built around two sawtooth oscillators
  feeding into a 12dB per octave resonant lowpass filter with an ASR envelope. The VCA has its
  own ADSR envelope for amplitude shaping, and portamento is available for smooth pitch glides.
  While it lacks an LFO, effects, or onboard sequencing, the simplicity of the design contributes
  to its character.

  The Fatman functions as a MIDI-to-CV converter as well as a sound source, outputting V/Hz
  control voltages compatible with Korg, Yamaha, and other PAiA equipment. It responds to MIDI
  velocity, pitch, and gate messages. Available as either a rack-mount or desktop module, the
  front panel provides 18 rotary knobs and 3 switches for hands-on control over all synthesis
  parameters.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth waveforms)
  - Filter: 1 lowpass resonant, 12dB/octave, ASR envelope
  - VCA: ADSR envelope
  - LFO: None
  - Effects: None
  - Controls: 18 rotary knobs, 3 switches
  - Portamento: Yes
  - MIDI: Basic implementation, functions as MIDI-to-CV converter
  - CV outputs: V/Hz compatible (Korg, Yamaha, PAiA)
  - Velocity/pitch/gate control: Yes
  - Memory: No patch storage
  - Keyboard: None (external controller required)
  - Form factor: Rack-mount or desktop module
  - Assembly: DIY kit, approximately one day build time
releaseDate: "1992"
releaseDateYearOnly: true
