description: The 314ce-N brings classical nylon-string tone to Taylor's
  versatile Grand Auditorium platform, with a Sitka spruce top, sapele back and
  sides, Venetian cutaway, and ES-N electronics for amplified performance.
details: |-
  The 314ce-N features a Grand Auditorium body shape with Venetian cutaway, delivering a snappy, classical-inspired voice well-suited to fingerstyle playing. The Sitka spruce top pairs with sapele back and sides for balanced, responsive tone.

  ES-N under-saddle transducer allows the guitar to perform through a PA or amplifier with natural acoustic character. Classical nickel tuners and a West African Crelicam Ebony fretboard with Gemstone inlays complete the refined aesthetic.

  The guitar includes a deluxe brown hardshell case and Taylor's Limited Lifetime Warranty.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Sitka Spruce (gloss)
  - Back/sides: Sapele (satin)
  - Bracing: Nylon Series
  - Cutaway: Venetian
  - Neck: Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Inlays: Gemstone
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Tuners: Classical Nickel
  - Electronics: ES-N under-saddle transducer
  - Strings: D'Addario Pro Arte Carbon (.024-.046)
  - Case: Deluxe hardshell case included
