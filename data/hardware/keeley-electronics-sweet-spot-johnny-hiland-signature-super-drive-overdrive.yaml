description: A signature overdrive designed with Johnny Hiland, built around a
  JFET discrete input stage and a 4558 op-amp with asymmetrical diode clipping,
  with a tone control and a two-position gain switch.
details: |-
  The Sweet Spot Super Drive is an overdrive designed with the guitarist Johnny Hiland. Its voicing is set for clarity and definition in the midrange, with a little bass cut, a midrange lift and the top end rolled back to avoid harshness, so that the pedal covers country, rock and blues while staying touch sensitive and easy to play.

  The circuit opens with a JFET discrete transistor input stage for a tube-like response that firms up when pushed, and a 4558 op-amp sits at the centre of the gain stage. The diodes around the op-amp are chosen for asymmetrical clipping, again in the manner of a valve amplifier.

  The Tone control is a circuit designed to deliver full-strength highs while reducing the load on the guitar's own tone control, which lets the midrange carry through evenly across the neck.

  A gain toggle switch sets the range, from light preamp clipping to heavier, power-valve style breakup, with compressed sustain for solos; the output level is enough to push the front end of the next pedal or amplifier. The pedal is true bypass and made in the United States.
