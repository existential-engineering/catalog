description: We’ve combined the popular features of the DDJ-SB2 with our leading
  Serato DJ controllers to make learning to DJ more accessible than ever. The
  ideal tool for beginners looking to hone their skills, this 2-channel
  controller is easy to navigate, featuring a professional-style layout inspired
  by our top DDJ-S range. Master Serato DJ Lite, then when you’re ready,
  purchase Serato DJ Pro to progress on the one machine. Transition between
  tracks with ease thanks to the added FX Fade feature and experiment with
  scratch effects without using turntables via the new Pad Scratch function.
  Co-developed with DJ Jazzy Jeff, this technique adds scratch recordings to
  tracks at a touch of the Performance Pads.
details: |-
  2-channel DJ controller for Serato DJ Lite. We’ve combined the popular features of the DDJ-SB2 with our leading Serato DJ controllers to make learning to DJ more accessible than ever. The ideal tool for beginners looking to hone their skills, this 2-channel controller is easy to navigate, featuring a professional-style layout inspired by our top DDJ-S range. Master Serato DJ Lite, then when you’re ready, purchase Serato DJ Pro to progress on the one machine. Transition between tracks with ease thanks to the added FX Fade feature and experiment with scratch effects without using turntables via the new Pad Scratch function. Co-developed with DJ Jazzy Jeff, this technique adds scratch recordings to tracks at a touch of the Performance Pads.
