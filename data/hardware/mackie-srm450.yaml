description: "The Mackie SRM is the most widely used portable loudspeaker ever.
  Its unparalleled ease-of-use, professional sound quality and indestructible
  portability has made it a live sound legend."
details: |-
  The SRM450 is a 1000W, 12-inch portable powered loudspeaker engineered to deliver gig-level volume with room to spare. Custom transducers paired with High-Definition Audio Processing produce professional sound with unmatched clarity across the room.

  A quick one-button Speaker Mode selector tunes the SRM450 for specific applications, including PA, DJ, Monitor, and Soloist voicings. Patented acoustic correction developed in partnership with EAW, a precision 2-way crossover, and driver time alignment with phase correction round out the system tuning.

  An integrated 2-channel mixer with dual Mackie Wide-Z inputs accepts mics, line-level sources, and instruments without needing an external mixer. Stereo RCA inputs make it easy to plug in a media player for music playback or DJ duties.

  A monitor-specific angle and voicing mode lets the SRM450 work as a wedge on stage, and the cabinet is flyable for permanent installation. Smart Protect DSP and Automatic Feedback Destroyer help keep the system reliable in demanding live environments.
specs: |-
  - 1000W system power
  - 12" high-output LF driver
  - 1.4" titanium dome compression driver
  - Patented acoustic correction developed with EAW
  - Precision 2-way crossover
  - Driver time alignment and phase correction
  - High-Definition Audio Processing
  - One-button Speaker Mode (PA, DJ, Monitor, Soloist)
  - Integrated 2-channel mixer with dual Mackie Wide-Z inputs
  - Stereo RCA inputs
  - Automatic Feedback Destroyer
  - Smart Protect DSP protection
  - Monitor-specific angle and voicing mode
  - Flyable for permanent install
