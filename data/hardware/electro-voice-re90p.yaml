description: Cardioid back-electret condenser gooseneck microphone built around
  the premium RE90 capsule and an in-line preamp. The ultra-thin, dual-section
  gooseneck is strutted yet flexible for stable podium and lectern positioning,
  with uniform frequency response and polar pattern across its pickup range.
details: >-
  The Electro-Voice RE90P is a cardioid back-electret condenser gooseneck
  microphone designed primarily for podium, lectern and conference table use,
  but built around the same premium RE90 capsule and in-line preamp electronics
  that the company uses across its instrument and broadcast gooseneck range. The
  mic pairs sonically transparent performance with a price point aimed at
  installed-sound applications.


  Mechanically, the RE90P uses an ultra-thin, dual-section gooseneck that
  Electro-Voice describes as "strutted yet flexible" - the gooseneck holds its
  shape under its own weight and resists slow droop while still allowing the
  user to position the capsule precisely. Two lengths are offered: a 12-inch
  version (RE90P12) and an 18-inch version (RE90P18). The body and gooseneck are
  finished in a non-reflective black, with a steel case that keeps the visual
  footprint low on camera.


  The cardioid polar pattern provides off-axis rejection in front of
  loudspeakers and rejects audience noise behind the mic. The capsule is voiced
  for uniform frequency response across its 70 Hz - 15 kHz range (-3 dB), which
  keeps speech and acoustic instrument capture natural without the colored
  midrange common in cheaper gooseneck designs.


  Electrically, the RE90P delivers a balanced low-impedance output (200 ohms) on
  a standard 3-pin XLR connector and runs on phantom power from 9 to 52 VDC, so
  it works with any standard phantom-equipped mixer or interface. Open circuit
  voltage is 4.5 mV/Pa. The mic is wired (no wireless variant).
specs: |-
  - Element: Back-electret condenser
  - Polar pattern: Cardioid
  - Form factor: Gooseneck (dual-section, strutted flexible)
  - Available lengths: 12-inch (RE90P12), 18-inch (RE90P18)
  - Frequency response: 70 Hz - 15,000 Hz (-3 dB)
  - Impedance (low-Z balanced): 200 ohms
  - Open circuit voltage: 4.5 mV/Pa
  - Power requirement: 9 - 52 VDC phantom power
  - Connector: 3-pin XLR
  - Maximum diameter: 6.4 mm
  - Net weight: 0.244 lbs (0.111 kg)
  - Case material: Steel
  - Finish: Non-reflective black
  - Wired/wireless: Wired
