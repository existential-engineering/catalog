description: The Zoom R8 combines multiple audio production tools in one compact
  device. In addition to being an 8-track recorder, it's a pad sampler and a
  rhythm machine, and can even serve as a DAW control surface and computer audio
  interface.
details: |-
  The R8 provides eight tracks for recording and playback (up to two tracks can be recorded simultaneously) in full fidelity WAV format, making it ideal for both professional production and for use as a musical sketchpad. Battery operation allows for field recording. External microphones or line-level sources connect directly to the R8, or the built-in stereo mic pair can be used for minimal setup. Instruments such as electric guitar or bass plug straight in. When a multitrack recording is complete, the R8's internal mixer, complete with real faders, equalization, panning, and over 140 built-in DSP effects including amp models and mastering effects like multi-band compression, creates a stereo mix.

  The R8 is a pad sampler and rhythm machine too. Eight velocity-sensitive pads allow the triggering of up to 24 samples, drum sounds, or loops. Custom samples and loops can be created from recorded audio tracks, with quantization and time-stretching to ensure synchronization. Three playback modes are available for each pad (Repeat, Gate, and 1Shot), and the onboard audio sequencer allows step entry when absolute precision is required. The multitrack recorder is fully integrated with the pad sampler and rhythm machine.

  Mackie Control emulation enables the R8 to act as a full-featured control surface for popular DAWs, adding physical faders and transport and status buttons. Five assignable function keys set marker points and initiate advanced editing operations.

  The R8 provides dual inputs on combo connectors which accept either XLR or 1/4-inch balanced or unbalanced cables. Both can handle mic and line level signals, and Input 1 can also handle instrument-level signals from passive or active electric guitars and basses. Phantom power of +24 or +48 volts can be applied to both inputs. There are also dual balanced 1/4-inch TRS output jacks and a headphone output with a dedicated volume control. Over 140 studio-quality DSP effects are provided, including insert effects such as equalization and dynamics processing and send-return effects such as reverb and chorus/delay, plus guitar amp, bass amp and mic preamp models and mastering algorithms like multi-band compression. A USB port lets the R8 send and receive digital data and act as a 2-input/2-output interface for DAW software.

  Four AA batteries, either alkaline or rechargeable NiMH, are all that is required for power, with alkaline battery life of more than 5 hours even during continuous recording. The included AD-17 AC adapter powers the R8 from a wall socket, and the R8 can also be powered via USB when connected to a computer. Recording goes directly to SD media, with support for both standard SD and SDHC cards up to 32 gigabytes, for a maximum of 100 track hours.
specs: |-
  - 8-track playback, 2-track simultaneous recording
  - Built-in stereo condenser microphones (omnidirectional)
  - Records to SD and SDHC cards up to 32 GB
  - Records 16 / 24-bit, 44.1 / 48 kHz mono and stereo WAV files
  - Dual mic/line/instrument level inputs on XLR/TRS combo connectors
  - Input 1 switchable to Hi-Z (470 kOhm) for passive or active electric guitar and bass
  - +24 and +48 V phantom power on both inputs
  - Dual balanced 1/4-inch TRS output jacks
  - Headphone output with dedicated volume control (20 mW x 2 into 32 Ohm)
  - Control input for an FS01 foot switch: start/stop/rewind, punch-in/out and patch up/down
  - Built-in metronome and chromatic tuner (chromatic, guitar, bass, open A/D/E/G, D modal)
  - Over 140 send-return and insert DSP effects: 310 insert and 60 send-return patches, 7 insert and 2 send effect modules, 370 patch memories
  - 8 effect algorithms: CLEAN, DISTORTION, ACO/BASS SIM, BASS, MIC, DUAL MIC, STEREO, MASTERING
  - 9 faders (8 mono plus master), 3-band EQ, pan and two effect sends per track
  - Stereo link selectable in pairs across tracks 1/2 to 7/8
  - Variable playback speed from 50% to 150% without affecting pitch
  - Up to 100 marks per project, 1000 projects
  - Trim and divide file editing. Punch-in/out (manual and auto), bounce, A-B repeat, undo/redo, invert track phase
  - 8-voice pad sampler with adjustable sensitivity (8 velocity-sensitive pads)
  - Rhythm machine with 160 drum and percussion sounds, 10 drum kits, 48 PPQN precision, 40.0 to 250.0 BPM, 511 patterns per project
  - 2-in/2-out USB audio interface, 24-bit, 44.1 / 48 / 88.2 / 96 kHz
  - 96 kHz 24-bit delta-sigma AD and DA conversion
  - Control surface functionality (Mackie Control emulation)
  - 128 x 64 pixel backlit LCD
  - Signal-to-noise ratio 93 dB
  - USB 2.0 operation as audio interface, control surface or mass storage, plus SD card reader function
  - Runs on 4 AA batteries (more than 5 hours alkaline), USB bus power, or the supplied AD-17 DC 5V 1A USB AC adapter
  - 257 mm (W) x 190 mm (D) x 51 mm (H), 780 g
