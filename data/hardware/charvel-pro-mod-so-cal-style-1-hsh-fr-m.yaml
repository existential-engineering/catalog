details: |-
  The Pro-Mod So-Cal Style 1 HSH FR M is a 6-string electric guitar built around an alder So-Cal Style 1 body with a gloss finish and 1-ply parchment pickguard, finished here in Cherry Kiss Burst.

  The bolt-on maple neck features graphite reinforcement, a hand-rubbed satin urethane finish, and the speed neck profile with rolled fingerboard edges for fast, comfortable playability. A 12"-16" compound radius maple fingerboard carries 22 jumbo frets with black dot position inlays and black side dots, and a Floyd Rose 1000 Series locking nut sits at the headstock end. A heel-mount truss rod adjustment wheel and 4-bolt serialized neck plate round out the neck.

  Pickups are a Seymour Duncan HSH set: a Distortion TB-6 humbucker at the bridge, a Custom Flat Strat SSL-6 single-coil in the middle, and a Distortion SH-6N humbucker at the neck, all in parchment. Controls consist of a master volume, a no-load tone, and a 5-position blade switch.

  Hardware is finished in chrome and includes a recessed Floyd Rose 1000 Series double-locking tremolo, Charvel-branded die-cast tuning machines, knurled flat-top control knobs, a parchment switch tip, and standard strap buttons. The guitar ships strung with nickel-plated steel strings (.009-.042). A case or gig bag is optional.
