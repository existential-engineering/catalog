id: M28uAJEFnzsg6dlaPa7Ly
name: Zen Tour Synergy Core
manufacturer: antelope-audio
primaryCategory: audio-interface
url: "https://en.antelopeaudio.com/products/zen-tour-synergy-core/"
description: "The Zen Tour Synergy Core desktop audio interface is all about
  making it easier for you to effortlessly enter the creative flow and make
  album-ready recordings. With connectivity options rarely accessible in a unit
  of this size, you can cover the needs of your small band and connect all your
  external gear simultaneously."
details: |-
  The Zen Tour Synergy Core desktop audio interface is all about making it easier for you to effortlessly enter the creative flow and make album-ready recordings. With connectivity options rarely accessible in a unit of this size, you can cover the needs of your small band and connect all your external gear simultaneously.

  The professional recording path is provided by 4 low-noise high-gain discrete ultra-linear preamps, high-spec AD/DA converters for artefact-free recording and signature clocking technology. Hand-assembled in Europe, using high-quality components, Zen Tour Synergy Core withstands the demands of your studio desktop, road rig and practice space.

  The Synergy Core platform combines 4 DSP and 2 FPGA processors delivering analog-modeled effects with imperceptible latency. Up to 112 instances of effects can run simultaneously per session, with 36 onboard effects included and an expanded library available via the Synergy Core Effects Store.
