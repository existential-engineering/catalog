description: The Denon DJ SC5000M PRIME is a Professional DJ Media Player with
  Motorized Platter and 7" Multi-Touch Display to bring that vinyl feeling home.
details: |-
  Motorized 7" / 178 mm die-cast aluminum platter driven by a brushless DC motor with adjustable high/low torque (3.3 kgf/cm instant high torque) delivers an authentic vinyl feel on a standalone digital DJ media player.

  7" HD multi-touch display with gesture-based library navigation, waveform interaction, and on-board crate/playlist management powered by Engine OS.

  Dual-layer playback lets a single SC5000M act as two independent players with discrete RCA and digital outputs per layer for back-to-back mixing without a second unit.

  Built-in Wi-Fi plus a hardwired Ethernet LINK port enable cloud streaming from Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, and Dropbox, with networking for up to four linked players.

  Media options include an SD card slot, three USB Type-A ports for thumb drives (two rear, one front), and a USB Type-B port for controller mode with Serato DJ Pro and VirtualDJ; 8 RGB performance pads handle cues, loops, rolls, and slicer functions.
specs: |-
  - Analog Output: 2.0 Vrms (0 dBFS, 1 kHz)
  - Dynamic Range: 116 dB
  - Distortion (THD+N): < 0.0015%
  - Frequency Range: 22 Hz to 22 kHz
  - Digital Output: 96 kHz / 24-bit
  - Motor Drive: Brushless DC electric
  - High Torque: 3.3 kgf/cm (instant) / 2.8 kgf/cm (stable)
  - Low Torque: 1.6 kgf/cm (instant) / 1.1 kgf/cm (stable)
  - Starting Time: 0.5 seconds
  - Braking: Electronic
  - Platter: 7" / 203.5 mm ±0.5 mm die-cast aluminum, 900 g ±5%
  - Main Display: 7.0" / 178 mm diagonal full-color LED-backlit touchscreen (152 x 91 mm active area)
  - Power Input: 110-240 VAC, 50/60 Hz
  - Dimensions: 320 mm x 419 mm x 135 mm (12.6" x 16.5" x 5.3")
  - Weight: 6.4 kg / 14.08 lbs (without cables)
  - Supported File Systems: exFAT, FAT32
  - Supported Audio Formats: AAC/M4A, AIF/AIFF, ALAC, FLAC, MP3, MP4, Ogg Vorbis, WAV (up to 192 kHz, 32-bit)
