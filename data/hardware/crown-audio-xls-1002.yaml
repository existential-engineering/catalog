description: Two-channel, 350W @ 4Ω power amplifier from Crown's XLS DriveCore 2
  Series. Lightweight Class D design with onboard DSP, large LCD display, and
  selectable input sensitivity for portable PA use.
details: |-
  The next generation of XLS got a makeover with a sleek new look, an LCD display that is three times larger, and more DSP with higher capabilities. The XLS 1002 builds on Crown's patented DriveCore technology to deliver clean, undistorted power in a remarkably light chassis — under 11 lbs.

  The XLS DriveCore 2 Series can drive 2400W at 4Ω bridged with tons of headroom, guaranteeing a clean, undistorted signal straight to your speakers. Combined with Class D efficiency, this makes the XLS 1002 well-suited to portable PA applications where weight, reliability, and audio quality all matter.

  Onboard DSP includes per-channel band-pass filtering, the integrated PureBand Crossover System, and Peakx Limiters for speaker protection. Selectable input sensitivity (1.4Vrms or 0.775Vrms) and a remote power-trigger input round out the system integration features. A sleep mode, security menu lock, and full system reset are exposed through the front-panel menu.
specs: |-
  - 2 channels
  - 350W per channel @ 4Ω
  - 2400W bridged @ 4Ω
  - Input Sensitivity: 1.4Vrms (selectable 0.775Vrms)
  - Frequency Response: +0dB, -1dB
  - Signal-to-Noise Ratio: >97dB (at 0.775Vrms sensitivity, 6dB lower)
  - THD: <0.5%
  - Intermodulation Distortion: <0.3%
  - Damping Factor: >200
  - Crosstalk: 1kHz >85dB; 20kHz >55dB
  - Onboard DSP: band-pass filter per channel, PureBand Crossover, Peakx Limiters
  - Selectable LED indicator lighting
  - Sleep mode, security menu lock, system reset
  - Remote power trigger
  - Dimensions: 19" W × 3.5" H × 7.7" D (48.3 × 8.9 × 19.6 cm)
  - Weight: 8.6 lbs (3.9 kg)
