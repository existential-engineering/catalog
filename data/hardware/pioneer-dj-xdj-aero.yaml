details: |-
  Wireless all-in-one DJ system for rekordbox

  The XDJ-AERO is the original Wi-Fi enabled all-in-one system, allowing you – or your audience – to load music wirelessly from smartphones, tablets, laptops and PCs. A multipurpose unit, the XDJ-AERO works with rekordbox and the rekordbox app, functions as a standalone mixer when connected to players or turntables, and can be used as a MIDI/HID controller.
