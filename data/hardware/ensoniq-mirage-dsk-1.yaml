description: >-
  The revised keyboard version of the Ensoniq Mirage sampler with a lighter
  plastic body, relocated disk drive, unweighted keys, and stereo outputs.
details: |-
  The DSK-1 arrived in 1986 as a cost-reduced revision of the original Mirage DSK-8 keyboard. It features a lighter plastic body replacing the steel chassis, a relocated 3.5-inch disk drive, unweighted keys instead of the original's weighted Pratt-Reed action, and the addition of stereo outputs.

  The core sampling engine remains the same: 8-bit sampling at up to 32 kHz with 128 KB of RAM, analog lowpass VCF with keyboard tracking, five-stage envelopes for both VCA and VCF, and an LFO. The keyboard splits into two independent halves for upper and lower sounds.

  Despite the cost reductions in build quality, the DSK-1 retains the same warm analog character and sample compatibility as the original DSK-8, making it an accessible entry point to the Mirage platform.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 8-bit, up to 32 kHz (6.5 seconds at 10 kHz)
  - Filter: Analog lowpass with 5-stage envelope
  - VCA: 5-stage digital envelope
  - Keyboard: 61 keys with velocity (unweighted)
  - Memory: 16 internal patches, 128 KB sampler RAM, 3.5-inch diskette
  - Sequencer: 333-note capacity
  - Outputs: Stereo
  - Control: MIDI
