supersedes: 2sz4RQnX2_dLTUAHQXUvj
url: https://intellijel.com/shop/legacy/rubicon-2/
description: This is not a set it and forget it oscillator. It’s an oscillator
  that demands to be tweaked, modulated and explored.
details: |-
  Our Flagship Analog Oscillator, Refined. Rubicon2 is a flexible, feature-rich, completely analog oscillator ready to scream or sing to meet the demands of your patch and the desires of your imagination.

  It features nine simultaneously available waveshape outputs; two sub-oscillators; three variations of a sine wave; a new Tri-State pulse circuit; exponential Frequency Modulation (FM); linear FM; hard and soft (flip) sync; pulse width modulation; CV control of FM index; a new foldable Warp circuit; and the ability to perform perfectly-symmetrical Thru-zero FM with no change in pitch or tracking accuracy.

  Rubicon2 is the second generation of the classic Rubicon triangle core analog VCO, designed in collaboration with David G. Dixon. It’s an oscillator that’s proudly analog and eschews all shortcuts. As such, it’s an oscillator that rewards you with sounds as boundless as your creativity.
specs: |-
  - Width: 20HP
  - Depth: 38mm
  - Power: 142mA @ +12V, 150mA @ -12V
  - Firmware: No Firmware
  - Nine simultaneous waveform outputs (Sine with 3 selectable types, Triangle, Saw, Double Saw, Zig-Zag, Pulse, Tri-State Pulse, Sub, and Warp)
  - Quick, accurate tuning via an 8-Octave switch, Pitch knob, LFO/VCO range switch, and front panel trimmer
  - Lock switch toggles symmetrical Thru-Zero Linear FM with stable pitch tracking
  - Wavefolding Warp Circuit blends a signal with the unique Tri-State Pulse wave
  - Hard or Soft Oscillator Sync and Exponential FM
  - VCO mode frequency range 8 Hz to 20 kHz; LFO mode runs at 1/100 the VCO frequency for cycles as slow as 12+ seconds
