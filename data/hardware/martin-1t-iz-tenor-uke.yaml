details: |-
  Created in tribute to legendary Hawaiian artist Israel Kamakawiwo'ole — known to the world as 'IZ' — the 1T IZ Tenor Uke is a beautifully crafted instrument that honors his enduring legacy. The quilted mahogany body delivers warm, resonant tone with the depth and soul worthy of the man whose music touched millions.

  Design elements include a rosewood fingerboard and bridge, faux tortoise binding, a multi-stripe rosette, and an East Indian rosewood headplate featuring a koa inlay of 'IZ' and a hibiscus flower in pink awabi pearl. The mahogany neck is finished in satin and connects to the body via an applied dovetail joint for stability and tonal transfer.

  PegHed black planetary tuners offer the smooth feel of geared tuners in a traditional friction-peg profile, while a compensated Black Tusq saddle and nut provide consistent intonation. The ukulele ships pre-strung with Martin Premium Polygut tenor strings.

  The package includes a waterproof soft-shell case with backpack straps and internal padding, plus two special paper labels: one featuring IZ's photograph and another signed and numbered by his widow, Marlene Kamakawiwo'ole.
specs: |-
  - Body size: Tenor Ukulele
  - Top: Dark Mahogany, Quilted
  - Back and sides: Genuine Mahogany, Quilted, Dark Mahogany finish
  - Rosette: Multi-Stripe
  - Bracing: Spruce, 1/4" size
  - Neck material: Genuine Mahogany, Satin finish
  - Neck shape: Tenor Ukulele with Standard Taper
  - Neck joint: Applied dovetail
  - Fingerboard: East Indian Rosewood
  - Fingerboard width: 1 11/32" at nut, 1 23/32" at 12th fret
  - Frets: 20 total, joins body at 14th fret
  - Inlay: 1/8" Mother-of-Pearl dots with white side dots
  - Bridge: East Indian Rosewood, Tenor Ukulele style, 1 5/8" string spacing
  - Saddle: Compensated Black Tusq, flat radius
  - Nut: Black Tusq
  - Headplate: East Indian Rosewood with koa 'IZ' and pink awabi pearl hibiscus inlay
  - Tuning machines: PegHed Black Planetary Gear (large knob)
  - Binding: Faux Tortoise (top)
  - Endpiece: Black
  - Strings: Martin Premium Polygut Tenor (pre-strung)
  - Case: Waterproof soft-shell with backpack straps and internal padding
  - Left-handed availability: Yes
  - Special labels: IZ photo label and label signed/numbered by Marlene Kamakawiwo'ole
