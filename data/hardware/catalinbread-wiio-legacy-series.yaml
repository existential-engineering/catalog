description: The WIIO is an amp-in-a-box overdrive pedal inspired by the tone of
  The Who on 'Live at Leeds' (1970), simulating Pete Townshend's custom Hiwatt
  CP103 amplifiers with a modified tone circuit. It features a wide-ranging Gain
  control, Baxandall-style EQ, and a tape echo preamp blend circuit that fattens
  the signal and adds extra volume.
details: |-
  One of Catalinbread's first amp-in-a-box foundation overdrives, the WIIO simulates the tone of Pete Townshend's custom Hiwatt CP103 amplifiers with modified tone circuit, as heard on 'Live at Leeds' (1970). The Legacy Series version refines the circuit for even closer approximation of the original tone.

  The Gain control stays clean until pushed hard. The Baxandall-style EQ has harmonious band overlap and minimal volume loss at center. The tape echo preamp blend circuit, inspired by the tape echo on the original recording's auxiliary bus, fattens the signal and provides a volume boost.
