details: |-
  RUSTY FUZZ delivers those vintage silicon-based fuzz tones of yesteryear that we’ve all come to know and love, but at a price point so low everyone can play along. From silky-smooth sustain to ripping velcro-fuzz tones, RUSTY FUZZ does it all! So whether you’re experienced or not (See what we did there?), this compact true bypass pedal is sure to cover your old-school fuzz craving.

  Welcome to Silicon Valley

  RUSTY FUZZ was inspired by the legendary 1960s silicon Fuzz Face circuits that helped shape the sound of rock ‘n’ roll as we know it today. RUSTY FUZZ’ ultra-smooth gain structure and dynamic character lets you tap into tons of unique tones, simply by the way you attack the strings or adjust your guitar’s volume pot. This all adds up to virtually endless tonal possibilities!

  The Sound of History

  Turning on RUSTY FUZZ is like traveling in a tonal time machine. One minute you’re rockin’ foxey velcro tones, the next you’re soaring over the White Cliffs of Dover with a sweet, harmonically-rich solo vibe. You can even push it really hard for a more modern, ferociously-gated fuzz tone. With RUSTY FUZZ in your setup, you are the captain on a fantastic sonic journey – so chart your own course!
