description: >-
  The Cheetah MD-16 is a budget drum machine released by UK-based Cheetah in 1991,
  featuring 16 velocity-responsive rubber pads and 41 editable 16-bit samples at 44kHz.
  With 142 programmable parameters, an expansion ROM cartridge socket, and 8-voice
  polyphony, it offered considerable flexibility for its price class.
details: |-
  The MD-16 entered the market in 1991 as an affordable alternative to competitors including the Akai XR10, Boss DR-550, and Alesis SR-16. Despite significantly larger dimensions than the SR-16, it presented musicians with a more feature-rich option at an entry-level price point.

  The device utilizes plastic construction throughout its casing, keeping weight to approximately 3 pounds. While the housing appears budget-oriented, the mechanical buttons provide a firmer tactile response compared to rubber alternatives found on competing models. The 16 rubber playing pads are positioned closely together, demanding user accuracy during performance.

  Programming the MD-16 requires substantial button interaction due to its 142 total parameters. A 2x16 character backlit LCD screen provides interface feedback. Internal memory holds 41 16-bit samples at 44kHz quality, all fully editable for pitch and reverse effects. An expansion socket accommodates ROM cartridges containing up to 192 additional sounds.

  The sound character presents a bright, sharp quality that held competitive merit among budget drum machines of that era. For dedicated users investing time in parameter exploration, the instrument delivered considerable programming flexibility and sound design possibilities.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: 16 parts
  - Pads: 16 velocity-responsive rubber pads
  - Internal Memory: 1MB containing 41 16-bit samples
  - Sample Rate: 44kHz
  - Pattern Memory: 254 patterns
  - Song Memory: 254 songs
  - Total Parameters: 142
  - Display: 2x16 character backlit LCD
  - Effects: Pitch, Reverse, MIDI Delay, Shuffle, Descending Pitch Echo
  - Expansion: ROM cartridge socket (up to 192 additional sounds)
  - Power: External power supply
  - Weight: Approximately 3 pounds
  - Casing: Plastic
releaseDate: "1991"
