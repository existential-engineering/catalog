details: |-
  PRO SERIES DL152 — 24 Output Stage Box.

  DL152 is a 2U 19" fixed-configuration rack I/O unit with 24 line level outputs and delivers legendary Midas sound quality utilising time-tested and road-proven technologies. Featuring 24 active servo-balanced low impedance line level outputs with high output current capability for driving long cable runs and two AES50 network ports providing dual redundancy, the DL152 is the ideal partner to all Midas PRO and M32 Series digital consoles, enabling a digital snake connection from Front of House to stage.

  Key features:
  - 24 active servo-balanced low impedance line level outputs with high output current capability for driving long cable runs
  - Outputs feature an automatic mute facility
  - 96 kHz or 48 kHz operation (96 kHz for Midas PRO Series, 48 kHz for Midas M32 Series)
  - All configuration settings can be set either remotely from the mixing console or directly via the intuitive front panel
  - Supports dual redundant AES50 networks
  - Rugged steel 2U rackmount enclosure designed for the rigours of live concert touring
  - Auto-ranging universal switch-mode power supply

  Digital Audio Networking: SuperMAC (AES50-Compliant) digital audio networking technology from Klark Teknik simultaneously provides high channel counts, ultra low and deterministic latencies, sample-synchronous and phase-aligned networked clock distribution, error detection and correction, network redundancy, and ease of deployment and use. DL152 is compatible with all Midas digital consoles and audio system engines, as well as with any other AES50-equipped devices.
specs: |-
  - Form Factor: 2U 19" rackmount
  - Line Outputs: 24 active servo-balanced low impedance line level outputs on XLR connectors
  - Output Drive: High output current capability for driving long cable runs
  - Output Mute: Automatic mute facility
  - Sample Rates: 96 kHz (Midas PRO Series) or 48 kHz (M32 Series)
  - AES50 Network Ports: 2 (dual redundancy)
  - Network Standard: AES50-compliant, SuperMAC (Klark Teknik)
  - Front Panel: LCD display with menu navigation and LED status indicators
  - Configuration: Remote (from console) or local (front panel)
  - Power Supply: Auto-ranging universal switch-mode
  - Power Requirements: 100 to 240 VAC, 50 to 60 Hz
  - Chassis: Rugged steel 2U rackmount enclosure
