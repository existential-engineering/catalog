details: |-
  The Hi-X65 is Austrian Audio's flagship open-back professional over-ear headphone, designed for mixing, mastering, and critical listening. It features a 44mm Hi-Xcursion driver with an advanced ring magnet system delivering superior airflow and a powerful magnetic field for neutral, honest reproduction. The open-back design produces a wide, natural soundstage with accurate imaging and depth.

  Two detachable cables included (3m coiled and 1.2m straight), both 3.5mm with a 6.3mm screw-on adapter. All-metal construction, memory foam pads, fully serviceable with up to 5-year warranty. Made in Austria.
