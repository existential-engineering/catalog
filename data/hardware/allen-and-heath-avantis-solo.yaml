url: https://www.allen-heath.com/hardware/avantis/
description: A compact single-screen 64-channel mixer, expandable to 96
  channels. Features the XCVI FPGA engine, ultra-low 0.7ms latency, and
  dLive-class processing.
details: |-
  Avantis Solo is the compact, single-screen sibling of the Avantis platform: a 64 channel / 42 configurable bus mixer, expandable to 96 channel / 56 configurable bus, featuring the 96kHz XCVI FPGA engine with class-leading 0.7ms latency plus add-on processing and effects from the flagship dLive mixing system.

  The console features a single 15.6" Full HD capacitive touchscreen, 12 faders across 6 layers (72 strip assignments), 18 assignable SoftKeys, and the Continuity UI which seamlessly connects the physical controls and touchscreen for fast, intuitive workflows. The screen features a Soft Rotary tab on the right-hand side, giving instant access to assignable parameters like aux sends, EQ, compressor and FX.

  The optional dPack software upgrade scales the mixer from 64 to 96 input channels and 42 to 56 mix busses, while unlocking the full DEEP processing suite: boutique preamp, compressor and expander models alongside the surgical precision of Dyn8 and NEQ12. The optional RackUltra FX Card (factory-fitted or installed via authorised service centre, requires dPack) adds 8 dedicated FX engines for premium reverbs, vocal tuning, harmonisers, distortion and saturation.

  Two I/O Ports allow Avantis Solo to benefit from the full range of dLive option cards including Dante (64x64 and 128x128), Waves, gigaACE, MADI and more, expanding system integration, FoH/monitor splits and multitrack recording. The SLink port connects to the entire Allen & Heath range of Everything I/O audio expander hardware, including Dante expanders DT168 and DT164-W.

  Avantis Solo can be controlled using Avantis Director (free Windows/Mac offline editor and online control), MixPad (iPad remote mixing), OneMix (personal monitoring), 4You (personal mixing app for performers), Custom Control (customisable cross-platform app), and a range of networkable PoE-compatible IP remote controllers.
specs: |-
  - 96kHz XCVI FPGA core with ultra-low latency (0.7ms)
  - 64 input channels (96 with dPack)
  - 42 configurable mix busses (56 with dPack)
  - Fully configurable mix bus architecture
  - 12 RackExtra FX slots with dedicated stereo returns
  - AMM (Automatic Mic Mixer) up to 64 channels across 1, 2 or 4 zones
  - 72 fader strips (12 faders, 6 layers)
  - Single 15.6" Full HD capacitive touchscreen with gesture control
  - 16 DCAs
  - Continuity UI seamlessly connects physical and touchscreen controls
  - Fully assignable layout
  - User configurable rotary controls
  - 18 assignable SoftKeys
  - SLink port for connection to Remote I/O Expanders and the ME Personal Mixing System
  - 6 analogue XLR Inputs
  - 6 analogue XLR Outputs
  - 1 Stereo AES In
  - 1 Stereo AES Out
  - 2 I/O Ports, both capable of 128x128 operation at 96kHz (optional cards including Dante, MADI, gigaACE)
  - BNC Word Clock
  - USB stereo playback
  - Internal storage for stereo playback and recording
  - Optional dPack upgrade: 96 channels, 56 busses, 24 Dyn8 instances, DEEP Compressors, NEQ12, RackUltra FX Suite (requires RackUltra FX Card)
  - Optional RackUltra FX Card: 8 RackUltra FX slots, PEQ and Dynamics on input and output of each slot, 8 stereo sends and returns
