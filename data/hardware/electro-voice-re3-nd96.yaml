description: UHF wireless handheld vocal system pairing the RE3-HHT metal-bodied
  handheld transmitter fitted with the ND96-RC3 thread-on dynamic supercardioid
  microphone head and an RE3-RX half-rack diversity receiver, intended for
  high-gain-before-feedback vocal performance and presentations on loud stages.
details: >-
  The RE3-ND96 is the high-output handheld vocal configuration of
  Electro-Voice's RE3 UHF wireless series. The set bundles the RE3-RX half-rack
  diversity receiver, the RE3-HHT metal-bodied handheld transmitter, and the
  ND96-RC3 wireless head, a thread-on capsule built around a large-diaphragm
  dynamic element with a supercardioid pattern, internal shock mount, and
  Memraflex grille. The ND96 is voiced to deliver powerful, rich, and detailed
  vocal sound with exceptionally high gain before feedback for acoustic control
  on very loud stages.


  The RE3-RX receiver provides true antenna diversity to minimize dropouts, with
  a built-in frequency scan, an LCD display, and an IR Sync function that
  transfers receiver settings to the transmitter in one step. Depending on band,
  the receiver offers up to 36 MHz of tuning bandwidth and as many as 1,440
  selectable frequencies. Two detachable BNC half-wave antennas mount on the
  rear, alongside a balanced XLR (line/mic-selectable) and unbalanced 1/4-inch
  audio output and a DC barrel jack fed from the supplied universal power
  supply. Rack-mount hardware ships in the box.


  The RE3-HHT handheld transmitter has a robust metal housing, selectable
  low/high RF output power (band-specific, 10/50 mW on most bands), an LCD
  display, and runs on two AA alkaline or NiMH rechargeable batteries with
  charging contacts on the body for use with a dock. Wideband FM modulation with
  ±48 kHz deviation and PLL frequency synthesis are used throughout the system.
specs: >-
  - System type: UHF wireless handheld system with dynamic supercardioid vocal
  microphone

  - Receiver: RE3-RX half-rack diversity receiver

  - Transmitter: RE3-HHT metal handheld

  - Microphone head: ND96-RC3 dynamic, large-diaphragm, shock-mounted, Memraflex
  grille

  - Polar pattern: Supercardioid

  - Tuning bandwidth: Up to 36 MHz (band-specific)

  - Selectable frequencies: Up to 1,440 (band-specific)

  - Frequency band 5L: 488-524 MHz, 1440 frequencies, 10/50 mW

  - Frequency band 5H: 560-596 MHz, 1440 frequencies, 10/50 mW

  - Frequency band 6M: 653-663 MHz, 400 frequencies, 10/20 mW

  - Frequency band 8M: 823-832 / 863-865 MHz, 440 frequencies, 10 mW

  - Frequency band T: 803-806 MHz, 120 frequencies, 10/50 mW

  - Transmitter output power: 10 mW or 50 mW selectable (band-specific)

  - Modulation: Wideband FM, ±48 kHz deviation

  - RF stability: <±10 kHz at center frequency

  - Harmonic radiation: <-50 dBc

  - Diversity: True antenna diversity

  - Sync: IR-based one-step transmitter setup

  - Frequency scanning: Yes (receiver scans for clean channel)

  - Receiver frequency response: 51 Hz-16 kHz ±2 dB (handheld)

  - Receiver signal-to-noise ratio: >100 dB(A)

  - Receiver THD: <0.6% at 1 kHz

  - Receiver XLR output level: -4 dBV (line) or -24 dBV (mic), 1400 ohm balanced

  - Receiver 1/4-inch output level: -10 dBV, 240 ohm unbalanced

  - Receiver antenna connector: BNC, detachable half-wave

  - Receiver antenna booster power: DC 12-15 V / 100 mA

  - Receiver power input: DC 12-15 V / 500 mA

  - Receiver dimensions: 8.27 x 1.85 x 6.89 in (210 x 47 x 175 mm) with feet and
  antenna jack

  - Receiver net weight: 2.71 lb (1.23 kg)

  - Transmitter battery: 2 x AA alkaline or NiMH rechargeable (with charging
  contacts)

  - Transmitter dimensions (without head): 7.52 in (191 mm) length, 1.46 in (37
  mm) max diameter

  - Transmitter net weight (without head): 12.2 oz (346 g)

  - Transmitter construction: Metal housing

  - Display: LCD on both receiver and transmitter

  - Included: RE3-RX receiver, RE3-HHT handheld transmitter, ND96-RC3 wireless
  head, microphone stand adapter, two receiver antennas, universal power supply,
  two AA batteries, receiver rack-mount hardware, owner's manual, documentation
  packet, declaration of conformity
