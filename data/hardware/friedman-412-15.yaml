details: |-
  The Friedman 412/15 is a large cabinet loaded with 2 x 12 inch Celestion G12H-30 Anniversary and 2 x 15 inch Celestion Fullback speakers. It is a closed-back speaker cabinet which utilizes tongue and groove Baltic birch construction to deliver the bass, mid response and great sound expected from a Friedman cab.

  At the heart of the cab are two different speaker models and sizes. The top speakers are Celestion 12 inch G12H-30 (16 ohms), which deliver strong, aggressive low-end and powerful low-mids. The G12H penetrates any mix with an attacking upper mid-range and an ice-cool top-end.

  Sitting beneath them is a pair of 15 inch Celestion 15G15V-100 Fullback speakers. The larger cone diameter of this speaker delivers an extended low end response, with a big, deep voice. The combination of these speakers delivers clean warm sounds all the way to all-out assault without unnecessary coloration, and brings drive and definition to modern high-gain amps.

  This cabinet suits all Friedman 100 watt heads and in particular the Butterslax, Bill Kelliher's signature amp from Friedman. As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, capturing every ounce of valuable tone. The cabinet is handcrafted in the U.S.A. and designed to withstand the rigors of the road.
specs: |-
  - Closed back 2x12 inch plus 2x15 inch speaker cabinet
  - 2 x Celestion G12H-30 Anniversary 12 inch 16 ohm speakers in the top slots
  - 2 x Celestion 15G15V-100 Fullback 15 inch speakers in the bottom slots
  - Tongue and groove Baltic birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Handcrafted in the USA
  - Dimensions: 14 in (L) x 33.75 in (W) x 34 in (H)
  - Weight: 102 lbs
  - Passive cabinet, no mains power connection
