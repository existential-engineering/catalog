description: >-
  Sequential's groundbreaking vector synthesizer combined four digital
  oscillators per voice with a joystick-controlled crossfade system and analog
  filters, producing an extraordinary range of evolving, cinematic textures.
details: |-
  The Prophet VS, released in 1986, represented a dramatic departure for
  Sequential Circuits. As the company's first foray into digital oscillator
  technology, it introduced vector synthesis — a method of blending four
  oscillators in real time using a joystick to sweep through a
  two-dimensional mix plane. This allowed players to create richly animated
  timbres that shifted and morphed in ways no purely analog instrument
  could achieve. It would prove to be Sequential's final synthesizer before
  the company closed its doors, but the vector synthesis concept lived on
  in instruments like the Korg Wavestation and Yamaha SY-22.

  Each of the eight voices draws from a library of 96 preset and 32
  user-definable waveforms spread across four oscillators. The joystick mix
  position can be programmed into the envelope system, allowing automated
  movement through the waveform space over the duration of a note. A
  Curtis analog lowpass filter with digital control provides warmth and
  familiar subtractive shaping, bridging the gap between the digital
  oscillator bank and the analog character players expected from a
  Sequential instrument.

  The feature set is generous for its time: five-stage envelopes for
  amplitude, filter, and oscillator mix, two LFOs each with their own
  envelope generator, a versatile user-definable arpeggiator, built-in
  twin chorus and stereo panning effects, and 100 patch memories. The
  61-key keyboard responds to both velocity and aftertouch, giving
  performers nuanced expressive control. A rackmount version was also
  produced and remains commonly found on the used market.

  The Prophet VS attracted artists drawn to its otherworldly palette,
  including Brian Eno, Trent Reznor, Kraftwerk, Vangelis, Depeche Mode,
  and John Carpenter. Its combination of digital complexity and analog
  warmth produced sounds that ranged from glassy digital pads to gritty,
  evolving textures. Today it is highly sought after by collectors, though
  finding qualified technicians to service its hybrid circuitry has become
  increasingly difficult.
specs: |-
  - Polyphony: 8 voices, 2-part multitimbral
  - Oscillators: 4 per voice with 96 preset + 32 user waveforms, vector joystick crossfading
  - LFO: 2, each with dedicated envelope generator
  - Filter: Curtis analog 4-pole lowpass (digitally controlled)
  - Envelopes: 5-stage envelopes for amplitude, filter, and oscillator mix
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 100 patches
  - Effects: Twin chorus, stereo panning
  - Arpeggiator: User-definable with versatile pattern options
  - Connectivity: MIDI
  - Produced: 1986–1987
