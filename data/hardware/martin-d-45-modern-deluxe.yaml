description: The D-45 Modern Deluxe pairs Martin's most ornate style with
  cutting-edge features like a VTS top, carbon fiber bridgeplate, and
  asymmetrical neck—blending vintage tone and modern performance in a
  showstopping flagship guitar.
details: |-
  The D-45 Modern Deluxe represents the pinnacle of Martin craftsmanship—where heritage tone meets modern luxury. A spruce VINTAGE TONE SYSTEM® (VTS) top and Golden Era–style Adirondack spruce X-bracing capture the depth and complexity of a nearly century-old Martin.

  Natural protein glue and a carbon-fiber bridge plate enhance resonance, while exclusive Liquidmetal® bridge pins reflect energy for remarkable projection. EVO gold frets and a slightly asymmetrical neck ensure effortless feel.

  European flamed-maple binding on the body and fingerboard, Waverly gold open-gear tuners, and ornate pearl bordering along the top, back, and sides define its dazzling elegance.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back & Sides: East Indian Rosewood
  - Bracing Pattern: Forward Shifted X Brace, GE-Scalloped
  - Brace Material: Adirondack Spruce with VTS
  - Scale Length: 25.4"
  - Total Frets: 20
  - Neck Join: 14th Fret
  - Neck Shape: Vintage Deluxe
  - Neck Taper: High Performance Taper
  - Neck Material: Genuine Mahogany
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Golden Era Style 45 Snowflake (Abalone/Mother of Pearl)
  - Frets: EVO Gold
  - Bridge Material: Ebony
  - Bridge Style: Modern Belly - Drop in Saddle
  - Bridge Pins: Liquidmetal® with Abalone dots
  - Saddle: Compensated Bone
  - Saddle Radius: 16"
  - Tuning Machines: Gold Open Gear (Waverly)
  - Nut Material: Bone
  - Binding: European Flamed Maple
  - Headplate Material: Ebony
  - Bridge Plate: Carbon Fiber
  - Case: Ply Hardshell
  - Pleking: Yes
  - Left-Handed Available: Yes
