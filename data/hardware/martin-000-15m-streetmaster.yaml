description: The Martin 000-15M StreetMaster pairs a comfortable Auditorium body
  with all-solid mahogany tone and a worn satin finish, delivering vintage style
  and warm, balanced sound with a broken-in look.
details:
  - The 000-15M StreetMaster is part of Martin's 15 Series, built around an
    all-solid mahogany Auditorium (000-14 fret) body. The tonewood choice gives
    the guitar a warm, balanced voice with strong midrange and clear note
    separation, while the smaller Auditorium body shape keeps it comfortable for
    fingerstyle players and seated playing alike.
  - Martin finishes the StreetMaster in a distinctive worn satin finish, giving
    the instrument a broken-in, road-tested look right off the bench. The
    Mahogany Burst top and dark mahogany back, sides, and neck reinforce the
    vintage aesthetic without any synthetic gloss.
  - 'Under the hood the guitar follows traditional Martin construction:
    non-scalloped X-bracing with 5/16" spruce braces, a simple dovetail neck
    joint, and a Modern Belly East Indian rosewood bridge with a compensated
    bone saddle. The neck has a Modified Low Oval profile with Standard Taper, a
    25.4" scale length, and a 1 11/16" bone nut.'
  - "Appointments stay understated but considered: an East Indian rosewood
    fingerboard with abalone diamonds-and-squares inlays, yellow side dots, a
    multi-stripe rosette, ebony bridge pins, and Ping aged nickel tuners. The
    instrument is Plek'd at the factory for precision-leveled frets, and ships
    pre-strung with Martin Authentic Acoustic Lifespan 2.0 Light gauge strings."
  - The 000-15M StreetMaster comes with a softshell case featuring waterproof
    protection, backpack straps, and internal padding, and is covered by
    Martin's Limited Lifetime Warranty.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Solid Mahogany, Mahogany Burst, satin finish
  - Back & Sides: Solid Mahogany, dark mahogany, satin finish
  - Neck: Select Hardwood, dark mahogany, satin finish
  - Neck Shape: Modified Low Oval with Standard Taper
  - Fingerboard: East Indian Rosewood
  - Bridge: East Indian Rosewood, Modern Belly with drop-in saddle
  - Scale Length: 25.4"
  - Nut Width: 1 11/16" (Bone)
  - Saddle: Compensated Bone, 16" radius
  - Bridge String Spacing: 2 1/8"
  - Total Frets: 20 (14th-fret body join)
  - Bracing: Non-scalloped X-Brace, 5/16" Spruce
  - Rosette: Multi-Stripe
  - Fingerboard Inlays: Abalone diamonds and squares
  - Tuning Machines: Ping Aged Nickel
  - Bridge Pins: Ebony
  - Strings: Authentic Acoustic Lifespan 2.0 Light
  - Construction: Simple Dovetail Neck Joint, Pleked
  - Electronics: None (optional factory upgrades available)
  - Case: Softshell (waterproof, backpack straps, internal padding)
  - Left-Handed: Available
  - Warranty: Limited Lifetime Warranty
