description: The PolarChoice Podium is a gooseneck condenser microphone designed
  for lecterns, conference tables, boardrooms, houses of worship, and broadcast
  applications. It is the first podium microphone to offer user-selectable polar
  patterns - omnidirectional, cardioid, supercardioid, and hypercardioid - via a
  switch on the base, allowing the mic to adapt to changing acoustics and talker
  positions without swapping capsules. A back-electret condenser element
  delivers smooth, uniform frequency response across all four patterns, with a
  switchable high-pass filter that tames podium and structural vibration noise
  while preserving extended low-frequency reproduction. The microphone is
  offered in three configurations - traditional XLR-mount, flange-mount for
  permanent install, and the enhanced PolarChoice Plus variant - all built on a
  sturdy steel base finished in semi-gloss camera black for low visual impact on
  stage.
details: >-
  First podium microphone with user-selectable polar patterns (omni, cardioid,
  supercardioid, hypercardioid)


  Back electret condenser element for smooth, uniform response across all
  patterns


  Gooseneck form factor for podium, lectern, and conference-table use


  Switchable high-pass filter for reduced podium/structural vibration noise


  Extended low-frequency response


  Sturdy steel base with semi-gloss camera black finish for low visual impact


  Available in three versions: XLR, Flange Mount, and PolarChoice Plus


  3-pin XLR balanced low-Z output


  Open circuit voltage 5.6 mV/Pa


  Output impedance 200 ohms (low-Z balanced)


  Height 299 mm, net weight 0.411 kg, max diameter 6.4 mm
