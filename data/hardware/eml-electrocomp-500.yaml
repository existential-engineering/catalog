description: >-
  The EML ElectroComp 500 is a compact monophonic analog performance synthesizer with dual VCOs and a multimode filter, known for its archaic, science-fiction-inspired sound character.
details: |-
  The ElectroComp 500 was EML's answer to the compact performance synthesizer trend established by the Minimoog and ARP Odyssey. Designed for hands-on playability, it features evenly distributed sliders and switches across the keyboard panel for accessible parameter editing during performance.

  Dual VCOs generate sawtooth, square, and noise waveforms, feeding into a 12dB per octave multimode resonant filter with switchable lowpass, bandpass, and highpass modes. An ADS envelope generator controls the VCA with an envelope repeat function that enables drone effects. The LFO provides six waveform shapes for modulation of oscillators, filter, or VCA. Additional features include ring modulation, amplitude modulation, octave switching, external audio inputs, sustain pedal input, and a controllable preamp stage.

  Built with EML's signature op-amp design rather than transistors, the 500 produces sounds often described as archaic and science-lab-like, evoking 1960s science fiction soundscapes. A scaling feature allows fine tuning adjustments between notes. The instrument is perhaps best known for its use by DEVO, who employed it to create the iconic sounds on "Whip It." CV/Gate connections provide external control, and a 44-key keyboard handles performance duties.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, square, noise)
  - LFO: 6 waveform shapes
  - Filter: 12dB/oct multimode resonant (lowpass, bandpass, highpass)
  - Envelope: 1 ADS envelope generator with repeat
  - Effects: Ring modulation, amplitude modulation
  - Keyboard: 44 keys
  - Memory: None
  - Control: CV/Gate
releaseDate: "1973"
releaseDateYearOnly: true
