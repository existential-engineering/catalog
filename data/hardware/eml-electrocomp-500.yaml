description: >-
  The EML Electrocomp 500 is a monophonic analog synthesizer created as a response to the
  compact performance synthesizer trend established by the Minimoog and ARP Odyssey. It
  features dual VCOs, a multimode resonant filter, and a hard-wired design with sliders
  and switches for accessible parameter control. Notably used by DEVO for their
  distinctive "Whip It" sound, it produces a uniquely different tone compared to ARP and
  Moog instruments due to its op-amp-based design.
details: |-
  The EML Electrocomp 500 represents a shift away from the modular synthesizer era toward more user-friendly performance instruments. Unlike its larger sibling the EML 101 and competitors like the ARP 2600 and Moog 3C, this synthesizer prioritized accessibility through an integrated design rather than patch cord configuration.

  The dual VCOs generate square, sawtooth, and noise waveforms, providing versatile tonal options. The filter section is particularly distinctive, offering switchable low-pass, band-pass, and high-pass filtering modes with resonance control at 12 dB per octave. The VCA envelope section includes attack, decay, and sustain controls plus envelope repeat capabilities for sustained drone effects.

  The LFO produces six different waveform shapes for modulation of oscillators, filter, or VCA. The synth incorporates ring modulation and amplitude modulation alongside sample-and-hold and track-and-hold functions. Additional features include octave shifting, external audio inputs, sustain pedal support, and CV/Gate external control compatibility.

  Internally designed around op-amps rather than transistors, the Electrocomp 500 produces a distinctly different sound compared to its ARP and Moog contemporaries. This design philosophy yields what many describe as an archaic, science-lab aesthetic reminiscent of 1960s science fiction sonics.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, square, noise)
  - LFO: 6 waveform shapes
  - Filter: 12 dB/octave multimode resonant (low-pass, band-pass, high-pass)
  - VCA: 1 ADS envelope generator
  - Keyboard: 44 keys
  - Memory: None
  - Control: CV/Gate
  - Production Years: 1973-1984
