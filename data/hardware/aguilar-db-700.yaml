details: |-
  Legendary DB tone. Modern power. Built for the road.

  The Aguilar DB 700 delivers the legendary, tube-driven tone of the DB 751 in a lightweight, 700-watt package built for today's bassist. Its dual 12AX7 tube preamp produces deep lows, rich mids, and articulate highs with signature Aguilar warmth and punch. Designed for the stage and beyond, it features universal mains for global touring and a rugged rack-mountable chassis. With seamless integration into the Aguilar Cabinet Suite, the DB 700 offers modern tonal flexibility without compromising its classic analog soul.
specs: |-
  - Preamp: 2x 12AX7 tube driven
  - Power section: Class D, 700 watts continuous
  - EQ: 3-band with Deep and Bright boost
  - Dual XLR outputs
  - Aguilar Cabinet Suite impulse response loading over USB-C
  - Effects loop send and return, tuner out
  - Headphone out and aux in for silent practice
  - Universal mains
  - Rack-mountable chassis, rack ears included
  - Weight: 11.2 lbs
  - Dimensions: 15.5" x 11.35" x 3.5" (39.4cm x 28.8cm x 8.89cm)
