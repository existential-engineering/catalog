  The EM Series EM-USB USB Condenser packs quality and convenience in an affordable package. Whether home recording, live streaming, podcasting, or creating online content, it's a perfect choice.

  The EM Series EM-USB USB Condenser is a standard in pro-quality, affordable USB recording. Whether you're looking for a great-sounding and convenient mic for your home studio, live streaming, podcasts, or online content creation, the EM-USB condenser's pristine sound, onboard control, and ease-of-use make it the perfect choice.

  Bright, refreshing, clean, ahhhh. Wanting a sleek, clean look for your monitors? Is the normal black too dark and brooding? Arctic White is here to make your icy dreams come true.
