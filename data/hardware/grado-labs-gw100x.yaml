details: |-
  The GW100x is Grado's wireless evolution of the GW100, the world's first open-back Bluetooth headphone. It is built around the 4th Generation X Series 44mm driver, featuring an enhanced magnetic circuit and reduced voice coil mass for improved detail and dynamics. Drivers are matched to 0.1dB precision.

  Bluetooth 5.2 enables stable wireless connectivity with support for aptX Adaptive, AAC, and SBC codecs. Battery life is rated at up to 46 hours at 50% volume, with a full charge in approximately 2 hours via USB-C. Working range is up to 10 meters.

  The open-back design retains Grado's signature acoustic character while reducing sound bleed by up to 60% compared to traditional open-back designs. Touch controls on the earcup handle playback, calls, and voice assistant activation, and an integrated microphone supports hands-free communication.

  The GW100x also functions as a wired headphone via the included 3.5mm cable, preserving Grado's heritage listening experience when paired with a traditional source.
