description: A rugged dynamic vocal microphone built for performing musicians.
  Designed for rehearsal rooms, small stages, and touring, the OD303 features
  modern Austrian voicing, high output, and real-world durability. Its almost
  indestructible die-cast housing, ergonomic hand-fit design, and 3D Pop Noise
  Diffuser make it a reliable choice for live performance.
details: |-
  The OD303 is Austrian Audio's dynamic vocal microphone for performing musicians. Supercardioid directional pattern with high output sensitivity and a well-balanced, open, and powerful sound profile.

  Rugged die-cast housing and ergonomic hand-fit design built for the rigors of touring. The 3D Pop Noise Diffuser reduces plosives and handling noise. Passive dynamic — no phantom power required.
specs: |-
