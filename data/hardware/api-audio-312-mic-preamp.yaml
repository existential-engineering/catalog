url: https://apiaudio.com/product/312-mic-preamp/
description: Classic 500 Series microphone preamp originally launched in the
  1970s. Combines API 2520 discrete op-amps and proprietary AP2516 transformer
  with vintage-style VU meter, up to 69 dB gain, 48V phantom power, 20 dB pad,
  and 3:1 output transformer tap selection.
details: |-
  500 Series mic preamp based on API's classic 312 circuit. Uses the API
  2520 discrete op-amp and proprietary AP2516 input transformer. Features
  vintage-style analog VU meter, peak LED, 20 dB pad, switchable 48V phantom
  power, 3:1 output transformer tap, and fully discrete circuit design.
  Five-year warranty.
specs: |-
  - Format: 500 Series
  - Gain: +34 to +69 dB (+14 to +49 dB with pad)
  - Max input: -4 dBu (+16 dBu with pad)
  - Max output: +31 dBu
  - Output impedance: <75 Ohms (transformer balanced)
  - Frequency response: ±0.5 dB, 20 Hz–40 kHz
  - S/N ratio: 120 dB
  - Power: ±16V DC @ 55 mA
  - Dimensions: 1.5" × 5.25" × 6.75" deep
  - Weight: 1.5 lb
