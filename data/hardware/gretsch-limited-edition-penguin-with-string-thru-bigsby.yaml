details: |-
  The Limited Edition Champagne Sparkle Penguin offers an elegant take on a classic Gretsch design. This Penguin features a chambered mahogany body with an arched maple top that is gloriously adorned in our exclusive Champagne Sparkle finish.

  TV Jones TV Classic and TV Classic Plus Filter'Tron pickups provide all the twang, growl, and power you need to cut through the mix, making this rare bird well suited for a wide range of musical styles.

  A mahogany set-neck with a Standard "U" profile and aged white binding carries a 12"-radius ebony fingerboard with 22 medium jumbo frets, mother of pearl thumbnail inlays, and Luminlay side dots at a 24.6" scale. Gold-finished hardware includes an Adjusto-Matic bridge, Bigsby B3GP String-Thru tailpiece, and Grover Imperial tuning machines. Ships in a G6238XL Gretsch deluxe hardshell case.
