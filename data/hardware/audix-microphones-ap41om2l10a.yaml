details: |-
  A combination system that allows for the flexibility of using either the OM2 handheld transmitter or the bodypack system with the ADX10 cardioid lavalier microphone. This package is designed for rental companies, hotels, presentation events, education, and applications where only one transmitter would be required at a time. (Please note: it is not possible to use both transmitters simultaneously – see the AP42 C210 combo pack where both transmitters can be used at the same time.)
specs: |-
  - Single-channel R41 receiver with two transmitters (OM2 handheld + B60 bodypack)
  - Mics: OM2 dynamic handheld and ADX10 cardioid condenser lavalier
  - One transmitter usable at a time (not simultaneous)
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - 106 pre-coordinated frequencies
