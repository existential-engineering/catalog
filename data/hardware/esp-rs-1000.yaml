description: The LTD Deluxe RS-1000 offers ESP's immediately-noticeable Random
  Star shape in a guitar designed for professional players who require the
  versatile tones, smooth playability, and complete reliability for serious
  recording and touring needs. Finished in gleaming Pearl White, the RS-1000 is
  packed with everything you need for your most exhilarating performances. That
  includes neck-thru-body construction at 24.75" scale, with mahogany body wings
  paired to an extra-thin U-shaped three-piece maple neck that offers a Macassar
  ebony fingerboard, 24 extra-jumbo stainless steel frets, and a reverse
  headstock with matching finish. Components on this metal machine include a
  Floyd Rose 1000SE double-locking tremolo with stainless steel screws, precise
  Grover tuners, and a set of super-aggressive direct-mount EMG 81 (bridge) and
  EMG 85 (neck) active pickups.
