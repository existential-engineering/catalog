id: FO3Yu4JCYI-Q-n2Rbwp4u
name: BO-16DX/IN
manufacturer: tascam
primaryCategory: utility
categories:
  - rack-mount
url: https://tascam.com/us/product/bo-16dx_in
description: Passive 1U rackmount audio adapter that bridges 16 front-panel
  balanced XLR inputs to dual D-Sub 25-pin outputs on the rear, compliant with
  the AES59-2012 wiring standard. Designed for professional installation and
  live sound environments as a breakout point between stage boxes, mixing
  consoles, and audio-over-IP converters. Compact 1.8-inch depth behind rack
  ears with flexible 180-degree mounting orientation.
details: |-
  Fully passive 1U rackmount XLR-to-D-Sub breakout adapter. 16 front-panel XLR inputs hardwired to two rear-panel D-Sub 25-pin female connectors (AES59-2012/TASCAM DA-88 pinout), each carrying 8 channels of balanced analog audio. No active electronics; requires no power. Multiple rackmounting orientations including 180° rotation. Companion to TASCAM ML-16D and ML-32D Dante converters for stage boxes and audio-over-IP systems.
specs: |-
  - - Front: 16× XLR 3-pin balanced inputs (pin 1: GND, pin 2: Hot, pin 3: Cold)
  - Rear: 2× D-Sub 25-pin female (AES59-2012, 8 channels each)
  - Dimensions: 482.6(W) x 44.1(H) x 54.5(D) mm; weight: 0.9 kg
  - Depth behind rack ears: ~45mm (1.8")
  - Form factor: 1U rackmount; passive (no power required)
  - Included: No.4-40 UNC rack screws ×4
