id: oFc9jPat12SzTcMTkPKbY
name: Model 24
manufacturer: tascam
primaryCategory: mixer
categories:
  - analog
  - digital
  - midi
url: https://tascam.com/us/product/model_24
description: 24-track live recorder, 22-channel mixing console, and 24-in/22-out
  USB audio interface. Features 16 Ultra HDDA mic preamps, 3-band EQ with
  sweepable mid on channels 1–12, 7-band graphic EQ, 16 preset effects,
  Bluetooth audio streaming, and records up to 24 tracks simultaneously to
  SD/SDHC/SDXC at 44.1/48kHz and 16/24-bit. Sub outputs available via XLR
  balanced and RCA unbalanced. Designed for rehearsals, live performance, and
  studio production.
details: |-
  22-channel desktop console with 24-track multitrack recorder and 24-in/22-out USB interface. CH1–12: XLR/TRS combo jacks (Ultra HDDA preamps, gain 0–50dB, +48V phantom), 3-band EQ (sweepable mid 100Hz–8kHz), 100Hz low-cut, 100mm faders. CH1–2 also have insert points and support Hi-Z instrument signals. CH13/14–19/20: four stereo pairs with separate rear-panel XLR mic jacks and TRS line jacks (both accessible simultaneously). CH21/22: stereo input via RCA or 3.5mm mini jack. Bluetooth (4.0, SBC/AAC) also routes to CH21/22. 7-band graphic EQ on master bus. 16 preset effects (reverb, delay, chorus, flanger). Sub output available as XLR balanced and RCA unbalanced. Two mono monitor sends and one FX send. Companion Settings Panel app with meter bridge (Windows/macOS). Compatible with RC-1F footswitch.
specs: |-
  - - Mic inputs: 16 total; CH1–12 XLR/TRS combo (top strip), CH13/14–19/20 separate XLR rear; gain 0–50dB; EIN −128dBu; +48V phantom
  - Line inputs: CH1–22 TRS balanced; max +22dBu (CH1–12), +16dBu (CH13–20); 22kΩ
  - Insert CH1–2: TRS; send max +18dBu 100Ω; return max +18dBu 10kΩ
  - Main out: XLR balanced +22dBu max 100Ω
  - Sub out: XLR balanced + RCA unbalanced (both L/R)
  - Monitor 1/2, FX: 1/4" TRS mono sends
  - Control room: 1/4" TRS L/R
  - Headphone: 1/4"; 80mW+80mW @ 32Ω
  - USB: Type-B, 2.0 High-Speed, Audio Class 2.0; 24-in/22-out; 44.1/48kHz 16/24-bit
  - Bluetooth: 4.0, A2DP/AVRCP, SBC/AAC (~10m)
  - Recording: WAV (BWF) 16/24-bit 44.1/48kHz; SD/SDHC/SDXC Class 10+ up to 512GB
  - Freq response: 20Hz–30kHz; THD ≤0.01%; EIN −128dBu; crosstalk −80dB
  - Power: AC 100–240V 50/60Hz 52W
  - Dimensions: 576(W) × 112.5(H) × 513(D) mm; weight: 10.2kg
