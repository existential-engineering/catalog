description: Digital mixer with built-in automated lighting controller
details: |-
  Drawing on the combined heritage of legendary Soundcraft quality and the powerful and intuitive Vi Series digital live sound mixers, the Si Performer brings unparalleled mix power and performance to small format digital live sound mixers. Sitting where a plethora of gear once was, the Si Performer delivers the equivalent of 448 rack units of DSP including sophisticated 4-band fully parametric EQ, full dynamics processing, a comprehensive range of output options, totally flexible routing and, as with all Soundcraft consoles, an unmatched range of options to fully integrate the Si Performer into an existing system or become the centre of a thriving new installation. The Si Performer also takes mixing out of the dark with powerful digital audio mixing facilities married to a DMX 512 controller allowing for the first time the mixing console to also run the lighting rig! 'Music & Lights; these have been partners in the entertainment and production industry since amplified sound met the electric light but until now even the simplest lighting setup would require a separate lighting controller console, road case and somewhere to put it; Soundcraft Si Performer changes everything. Empowering the console with a DMX interface, the Soundcraft Si Performer is able to utilize the power of motorised faders, Soundcraft FaderGlow and a console automation system to provide a flexible automated lighting controller ideal for schools, churches, touring theatre companies and conference productions. The Si Performer 2 features 24 local recallable mic pre amps and 8 stereo inputs along with two ViSi Connect option card slots with an additional 128x96 input/output paths (one 64x64 expansion slot and another 64x32 expansion slot). Able to utilise Si series ViSi Connect option cards, the Si Performer gives a large range of additional digital I/O connectivity including the MADI USB Combo, BSS Digital Audio Bus (BLU Link), Dante, CAT5 or optical MADI, AVIOM, CobraNet and others with a massive mix capacity of 64 mono inputs for a total of 80 inputs to mix. Each input channel has dedicated processing for high pass filter, input delay, gate, compressor and parametric EQ. Keeping you in control are 8 VCA busses, 8 mute groups, FaderGlow and colour backlit name displays on every channel so you are never lost. All Si Performer consoles have busses and output processing to match the versatility of the inputs; the 14 aux/group mixes can be configured as 14 mono mixes or 8 mono plus 6 stereo mixes, whilst the matrix mixes can be mono or stereo as needed. The bus and matrix mixes are complemented with four mix busses dedicated to the internal Lexicon FX processors and left, right and centre busses with options for mixing left/right + mono/centre or left/centre/right (LCR). Each bus features a compressor, 4 band fully parametric EQ, graphic EQ and delay always available all of the time. To complement the channel and bus processing all Si Performer consoles integrate four Stereo Lexicon FX processors based on the MX400 providing a wealth of sounds, user adjustable parameters and dedicated tap-tempo keys. As the FX are hardware based use of all the effects even on the most demanding programmes do not affect the processing in any way and all dynamics, PEQ and all bands of all 31 graphic EQs are available all of the time. Flexible onboard and expansion I/O options ensure the Si Performer integrates effortlessly with other system components; along with the 16 mic inputs there are eight analogue line inputs, AES in and out, 16 analogue line outputs, headphone monitor out, a 64x64 channel expansion slot and another 64x32 expansion slot each capable of utilising any of the Si series option cards including CAT5 or optical MADI. The MADI card, as well as being an interface to multi-track recording systems or plug-in systems like Waves, enables linking the Si Performer to any of the Soundcraft or Studer stageboxes to extend the I/O power and flexibility; but all this power is nothing without control and here the Si Performer excels with a comprehensive but 'simple to use' control surface. As you would expect from any Soundcraft digital mixer the facilities are extensive and include legendary audio quality courtesy of latest generation EMMA DSP processors, the same DSP platform that has helped propel the Si and Si Compact series to industry standard status; this power united with reliability and flexibility puts the Si Performer in a class of its own.
