url: https://bastl-instruments.com/eurorack/modules/quattro-figaro
description: Four-channel voltage-controlled amplifier with individual CV
  inverters per channel and mixed output combinations. Each channel provides
  signal input, signal output, CV input with attenuator knob, and an inverted CV
  output. Enables signal amplification with gain linear to the control voltage,
  plus panning and crossfading capabilities through internal routing via
  connector switches. Mixed outputs include sum and inverted-sum combinations
  across channel pairs. Maximum gain slightly above 2x with non-linear CV
  response above 6 volts.
details: |-
  10HP, 35mm depth (skiff-friendly). +12V <40mA, -12V <35mA. 16-pin power connector with PTC fuse and diode protection. Maximum gain slightly above 2x. CV response non-linear above 6V.
