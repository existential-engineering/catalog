details: |-
  The PRS Swamp Ash Special brings a unique look and sound to the PRS Bolt-On line up. Its swamp ash body is equipped with a versatile hum/“single”/hum pickup configuration. Two 58/15 LT pickups flank a PRS Narrowfield in the middle position, which adds a single-coil bite – without the hum. Paired with a volume, tone, 5-way blade switch, and dual mini-toggle coil-tap switches (for the first time on this model), the Swamp Ash Special has a total of twelve sound combinations. Roll back the tone control for added growl, turn it up for some shimmer, and have fun exploring this versatile tonal palette. The volume level between the humbucking and single-coil settings will remain even through it all.

  Additional specifications for the Swamp Ash Special Maple include a 22-fret 25” scale length mahogany neck, maple fretboard for an added bright touch, Phase III locking tuners with unplated brass shafts, and the PRS Gen III patented tremolo.

  Overall, the PRS Swamp Ash Special offers tight low-end, bright but mellow high-end, and a welcome twangy tone that can reach “hot country,” blues, and jazz territory. It is a versatile guitar to add to any arsenal.

  This model is also available with a rosewood fretboard. To explore that offering, please click here .
