description: Big OpAmp Fuzz Smashed Tuning Thick and Rotten
details: |-
  The Rotten Apple is an op-amp fuzz built on a heavily reworked high-sustain muff circuit, voiced for thick bass, a wide gain range and a deeply scooped midrange that recalls 1990s records.

  The Gain control covers a wide range and stays sensitive to the guitar and to picking attack, so the pedal can be rolled back from its loudest, most compressed setting with the guitar's own volume. The Tone control runs from submerged stoner-rock sludge to cutting highs.

  Keeley describes the pedal as carrying over what was learned from the Dark Side fuzz, with noise reduced and gain increased substantially. The op-amp generation it is based on has a reputation for harshness, and the maker attributes the smoother result to a rebuilt filtering stage rather than to the gain circuit alone. Testing was done with a Stratocaster fitted with Lace Sensor pickups.
