description: Handheld dynamic supercardioid vocal microphone with an on/off
  switch. Balanced frequency response and a tight-mesh Memraflex grille deliver
  controlled lows, articulate mid-range and smooth highs for live sound vocal
  applications.
details: >-
  The Electro-Voice PL-24S is a professional-grade handheld dynamic vocal
  microphone in the PL (Pro Line) series. It is the switched sibling of the
  PL-24, adding an on/off switch on the handle while keeping the same
  supercardioid capsule and voicing. The supercardioid polar pattern delivers
  tight off-axis rejection that helps the microphone resist feedback from wedge
  monitors and reject bleed from nearby sources on a loud stage.


  Voicing is tuned around a balanced frequency response from 80 Hz to 16 kHz,
  with controlled lows that keep proximity effect in check, a palatable
  mid-range for vocal presence, and a smooth high end that avoids harshness. A
  powerful neodymium magnet structure drives the dynamic element for solid
  output, and a tight-mesh Memraflex grille adds resistance to dents and dings
  without choking the top end. A shock-mounted capsule and the dynamic element
  keep handling noise low.


  The handheld body terminates in a standard 3-pin XLR connector at the bottom
  of the barrel with a low-impedance balanced output of 600 ohms, suitable for
  any professional mixer or preamp. The microphone is passive and requires no
  phantom power. It ships with a stand adapter that includes a Euro-thread
  insert and a soft zippered gig bag.
specs: |-
  - Element: Dynamic, neodymium magnet structure

  - Polar pattern: Supercardioid

  - Frequency response: 80 Hz - 16,000 Hz

  - Sensitivity: 2.2 mV/Pa (-53 dBV) at 1 kHz

  - Impedance: 600 ohms

  - Connector: 3-pin XLR

  - Polarity: Positive pressure on diaphragm produces positive voltage on pin 2
  relative to pin 3

  - Form factor: Handheld

  - Wired/wireless: Wired

  - On/off switch: Yes

  - Length: 184.0 mm (7.23 in)

  - Head diameter: 53.0 mm (2.10 in)

  - Shank diameter: 23.6 mm (0.93 in)

  - Net weight: 294 g (10.4 oz)

  - Shipping weight: 547 g (19.3 oz)

  - Grille: Tight-mesh Memraflex

  - Power requirement: Passive (no phantom power)

  - Included accessories: Stand adapter with Euro-thread insert, soft zippered
  gig bag
