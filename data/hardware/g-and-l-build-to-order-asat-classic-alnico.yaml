description: The ASAT Classic Alnico blends the single-cutaway ASAT Classic with
  a pair of Alnico V single-coil pickups refined by G&L's Paul Gagon. The bridge
  pickup delivers meaty twang while the neck pickup offers a fuller tone than
  traditional specs.
details: |-
  While the G&L ASAT Classic is Leo's final word on the traditional single-cutaway bolt-on axe with its Magnetic Field Design single-coil pickups, the ASAT Classic Alnico has arrived to blend latter-day-Leo with uncompromising Alnico sonic flavor. Framed in a classic boxed-steel bridge, the single-coil Alnico V bridge pickup belts out meaty twang, while individual brass saddles Leo upgraded for the ASAT Classic offer modern levels of intonation refinement. The Alnico V neck pickup is specified for a fuller tone that leaves anemic old pickups in the dust. The two pickups also pair beautifully for an exceptionally sweet, jangly tone bursting with harmonics.

  These Alnico pickups are not a flavor-of-the-week, having been carefully refined by G&L's Paul Gagon for personal guitars since the late 1970s. Back then, Gagon was an R&D engineer at another company when he was tasked with finding out what was so special about the early bolt-on guitars many players raved about. Gagon analyzed many examples of what were considered "holy grail" guitars, spending time out on the shop floor talking to builders still working in the pickup department since the '50s, all on a quest to discover where the real mojo was and was not. What he learned from the builders matched his own engineering analysis. Back in the day, the actual spec of pickups coming down that old production line varied considerably. The nagging imbalance between bridge and neck pickup was something he longed to improve on, and today Gagon's preferred pairing of Alnico V pickups has arrived to delight the ears of discerning guitarists.

  Like the G&L Legacy, the ASAT Classic Alnico combines best-of Alnico tone with modern Leo touches for a blend of vintage and contemporary.

  To commemorate the initial production of these Alnico pickups, G&L commissioned a special 100-instrument production of ASAT Classic Alnico Launch Edition guitars. The Launch Edition features a Sugar Pine body coated in a new Autumn Burst finish developed by veteran G&L painter Malcolm McLamore. The combination of a Sugar Pine body and Alnico magnet pickups harkens back to early prototype instruments created by Leo Fender, yet the Launch Edition is not a time-warp instrument: it is a thoughtful remix that blends old-school Leo with 21st century G&L quality and playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L Alnico single coils
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
  - Launch Edition: 100-instrument run with a Sugar Pine body in Autumn Burst finish
