details: |-
  RECOVERY RARE BIRD SALE

  (One-offs/Samples/Prototypes/Ready To Ship!)

  The RFZ-1 is Recovery's take on the original Vox Distortion Booster. Deceptively named, it became known for its classic garage and psych tones. The RFZ-1 stays tight and crunchy when the drive is cranked. Whether the drive is at 3 or 10, you will get a warm, compressed, fuzzed-out tone with plenty of bite. Hand-wired in Seattle, Washington. The RFZ-1 operates on a standard "Boss" style 9vdc power supply. True bypass switching. Enclosure size: 4.77" x 2.6" x 1.39"
