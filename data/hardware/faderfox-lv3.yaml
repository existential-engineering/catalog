description: LV3 is a very compact all-in-one controller for Ableton Live. The
  device controls track volumes by faders, rack parameters by encoders and
  joysticks, and global parameters like tempo, quantization and the cue and
  master volumes.
details: |-
  LV3 is a very compact all-in-one controller for Ableton Live, and the page notes it is also suitable for other DAW software. Control surface setup files for Live 8 ship with the controller, so no manual mapping is necessary.

  The device controls track volumes by faders, rack parameters by encoders and joysticks, and global parameters such as tempo, quantization and the master and cue volumes. It addresses 8 tracks at a time, with the possibility to shift the 8-track window to further tracks.

  Total track control comes from 24 programmable buttons organised in 3 rows, and a dedicated encoder selects and fires scenes and clips with clip-scroll in session view. Four multifunctional push-encoders and two non-centered joysticks control rack parameters in the selected track or in send tracks, and all controls carry a double function while the shift button is held down. About 280 commands are available, all freely reassignable, with each track sending on a separate MIDI channel.

  Feedback comes from 33 LEDs in different colours that display information such as clip states, alongside a 2-digit display showing the current scene number and track window.

  Connection is over a class-compliant USB interface that needs no driver, and the unit is USB bus powered with a consumption of less than 500 mW / 100 mA. The casing is a compact black plastic desktop format measuring 180 x 105 x 70 mm at 350 g, with a silver aluminium front plate carrying an anodised, abrasion-resistant coating and inscriptions, high-quality ALPS faders, pots and encoders, and new rubber knobs for tactile feel. The page states the product is discontinued and sold out.
specs: |-
  - Special controller for Ableton Live (also suitable for other DAW software)
  - Control surface setup for Live 8 shipped with the controller (no manual mapping necessary)
  - USB interface, class compliant, no driver necessary
  - USB bus powered
  - Controls 8 tracks with possibility to shift the 8-track window to further tracks
  - 24 programmable buttons for all track functions
  - About 280 commands, all freely reassignable (each track sends on a separate MIDI channel)
  - Select and start/stop of scenes and clips with dedicated encoder (clip-scroll in session view)
  - 4 multifunctional push-encoders to control rack parameters in the selected track
  - 2 non-centered joysticks to control rack parameters in the selected track or in send tracks
  - Global control of several global parameters like tempo, quantization and master / cue volumes
  - All controls with double function by holding down the shift button
  - 33 LEDs in different colours to display various information like clip states
  - 2-digit display to show current scene number and track window
  - USB bus powering, consumption less than 500 mW / 100 mA
  - Very compact design in a black plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - System requirements: PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - System requirements: Ableton Live (as of V.8.1.1) or software which allows user assignments of continuous parameters (CC) and note commands
