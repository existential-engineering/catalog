details: |-
  PRS HDRX speaker cabinets feature a closed-back design, delivering full-spectrum sound. The Celestion G12H-75 Creamback speakers bring girth and articulation, allowing plenty of “woof” without the boom, defined midrange, and clear high-end to push from these powerful cabs. With black tolex-wrapped poplar plywood, salt and pepper British-style knitted weave grill cloth, and PRS Signature logo, PRS HDRX cabinets are a handsome accompaniment to PRS HDRX amps.
