details: |-
  The JBL 705P is the self-powered reference monitor for critical music recording, film post and broadcast production applications. It leverages the same patented driver technologies and JBL's renowned Image Control Waveguide found in the 708P and the flagship M2, but with a smaller footprint. Despite its compact size, the 705P delivers an eye-opening level of output well beyond that of comparably-sized studio monitors, for greater dynamic range and greater working distances.

  The 705P features next-generation JBL driver technologies for greater dynamic range and superior frequency response. The 2409H high-frequency compression driver incorporates an innovative low-mass annular diaphragm to deliver smooth response beyond 36 kHz with very low distortion. The 725G low-frequency transducer provides 14mm peak-to-peak excursion with greater linearity, delivering exceptional low-frequency output below 39 Hz.

  First introduced in the JBL M2 Master Reference Monitor, the patented Image Control Waveguide ensures accuracy and neutrality while providing a wide sweet spot with increased sonic detail, enabling an acoustically seamless transition between the transducers across the entire frequency spectrum.

  A built-in dual amplification system provides 250W each to the HF and LF transducers (500W total), enabling exceptional output and greater listening distances ideal for post-production or mastering environments.

  The 705P features onboard DSP with twelve bands of Room EQ, eight bands of User EQ, 18 milliseconds of Room Delay, and 150 milliseconds of AV Sync Delay. AES/EBU digital inputs support sample rates up to 192 kHz, enabling connectivity with a broad range of professional production hardware.
specs: |-
  - LF Driver: JBL 725G – 5 in (127 mm)
  - HF Driver: JBL 2409H (low-mass annular diaphragm compression driver)
  - Crossover Frequency: 1.9 kHz
  - Amplifier: 250W Class-D HF + 250W Class-D LF (500W total)
  - Frequency Response (±3 dB): 45 Hz – 25 kHz
  - Frequency Range: 39 Hz – 36 kHz
  - Max Continuous SPL: >101 dB SPL @ 1m (80 Hz – 20 kHz)
  - Max Peak SPL: >107 dB SPL @ 1m (80 Hz – 20 kHz)
  - DSP: 192 kHz, 32-bit floating-point processing
  - Room EQ: 12 bands; User EQ: 8 bands
  - Factory presets: 6; User-defined presets: 6
  - Room Delay: 18 ms; AV Sync Delay: 150 ms
  - Dimensions (H×W×D): 268 × 151 × 274 mm (10.56 × 5.94 × 10.80 in)
  - Net Weight: 5.68 kg (12.5 lbs)
  - Enclosure: Birch plywood
