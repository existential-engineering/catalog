details: |-
  With some of the wildest finishes to come out of the Kiesel custom shop, the Dan Jacobs signature guitar sports both a flashy appearance and body shape based on the Hyperdrive. A few of the exclusive designs include the "Sushi" guitar and custom shop blood finish.

  The body is black limba, built neck-through, with a tung-oiled maple neck carrying a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, and a reverse pointed inline headstock painted to match the body.

  Pickups are a direct-mount Kiesel passive Lithium neck humbucker and a direct-mount Kiesel passive Thorium bridge humbucker, wired to a master volume with push/pull coil splitter and a 3-way toggle pickup selector.

  An Original Floyd Rose tremolo at .42 inch (10.7 mm) spacing sits under a 24.75 inch scale with 24 stainless steel jumbo frets on an ebony fingerboard, and the guitar carries a Dan Jacobs signature truss rod cover.
specs: |-
  - Body shape based on the Kiesel Hyperdrive
  - Body: black limba
  - Construction: neck-through
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius
  - Frets: 24 stainless steel jumbo, .110 inch wide x .055 inch tall
  - Scale length: 24.75 inch
  - Pickups: direct-mount Kiesel passive Lithium neck humbucker, direct-mount Kiesel passive Thorium bridge humbucker
  - Electronics: master volume control with push/pull coil splitter, 3-way toggle pickup selector
  - Bridge: Original Floyd Rose tremolo, .42 inch (10.7 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: reverse pointed inline headstock painted to match body
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: Dan Jacobs signature truss rod cover
  - Hardware: chrome
  - Neck width: 1.69 inch wide at the nut, 0.75 inch thick at the 1st fret, 0.85 inch thick at the 12th fret
  - Body dimensions: 41.75 inch long, 1.65 inch thick, 14.125 inch wide
  - Weight: 9.5 lbs
  - Strings: Elixir Nanoweb 1046E
  - Exclusive custom shop designs named on the page include the "Sushi" guitar and the custom shop blood finish
