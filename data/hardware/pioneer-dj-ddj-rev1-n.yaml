details: |-
  Scratch-style 2-channel DJ controller for Serato DJ Lite. The DDJ-REV1 matches perfectly with the free Serato DJ Lite software, boasting a brand-new battle-style layout that’s easy to use and perfect for playing like a pro. The design of this 2-channel DJ controller emulates a professional DJM-S mixer + PLX turntable setup, including specialized features for open-format and scratch DJs. *In the United States, DDJ-REV1-N is available exclusively at Guitar Center and Musician’s Friend. Key features: Key Features; Brand-new battle-style layout; Bigger jog wheels; Lever FX; Tracking Scratch: Get a helping hand with scratching; Mixed microphone audio: Easily add your voice while you’re streaming; Serato DJ Lite integration: Enjoy full use of the free software; Other Features.
