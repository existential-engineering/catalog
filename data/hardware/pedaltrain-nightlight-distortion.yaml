description: "An asymmetrical, full-bodied overdrive/distortion pedal with a
  detailed, controlled gain structure, designed and hand-built in Nashville,
  TN."
details: |-
  Nightlight Distortion ("Nightlight") is an asymmetrical, full-bodied overdrive/distortion. The structure of the gain is detailed and controlled, giving it a different character from Daylight Overdrive while sharing the same simple three-knob layout: Level, Tone, and Drive.

  The pedal was designed to work well across a wide range of guitar and amp combinations, then refined over a year of sharing it with session players in Nashville. The tone knob sweep stays musical and usable through its entire range, and backing off the guitar's volume pot cleans the pedal up without the sound collapsing at higher gain settings.

  Designed, built, and tested in Nashville, Tennessee, with true bypass switching and Switchcraft jacks.
specs: |-
  - Level: controls the volume of the output
  - Tone: controls the darkness/brightness of the tone
  - Drive: controls the amount of overdrive/distortion
  - True bypass switching
  - Switchcraft jacks
  - 9V DC power only, external power supply required (center-negative barrel, 2.1mm), no battery clip
  - Current draw: less than 10 mA
  - Dimensions (incl. sockets, knobs): 4.92" x 2.62" x 2.23" (125 mm x 66.5 mm x 56.6 mm)
  - Made in the USA
