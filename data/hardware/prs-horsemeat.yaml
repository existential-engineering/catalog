details: |-
  The PRS Horsemeat transparent overdrive pedal is designed to enhance your sound without coloring your tone. Horsemeat adds harmonic midrange richness and overdrives without cutting out your high notes – all while giving you more available headroom. It features a robust EQ section so you can dial in your tone and has a wide range of gain on tap. Depending on the setting, Horsemeat can be used as a clean boost, straight overdrive, or even enhance your amplifier’s distortion by slightly pushing the front end of the amplifier’s preamp section. PRS pedals were created to be high-end pieces of audio gear.
