description: The H1 XLR is the recorder for creators who know no limits. Capture
  audio for video, direct feeds from mixers, song ideas and more.
details: |-
  The H1 XLR is the recorder for creators who know no limits, capturing audio for video, direct feeds from mixers, song ideas and more. Two locking XLR/TRS combo inputs take microphones, stereo board feeds and instruments, and a 3.5 mm stereo input records on-camera mics, lavaliers, phones and other sources. A hardware mic/line switch per input changes level without changing cables.

  With 32-bit float and dual A/D converters, levels never need setting: the vast dynamic range preserves detail in both quiet and loud recordings. The preamps give -122 dBu equivalent input noise at sample rates up to 96 kHz, and +4 dBu professional line-level signals record clip-free from any mixer or line output. Files can be stereo or mono depending on the application.

  The H1 XLR suits a stereo feed from a mixing board at a live show or DJ set, mounting on a camera rig with shotgun or wireless mics, sound design where 32-bit float covers both the loudest engines and the quietest nature recordings, and podcasting with two microphones.

  Connected to a PC, Mac, iOS or Android device over USB-C, it works as a 32-bit float audio interface while simultaneously recording to the SD card, so professional audio can be recorded straight onto a phone's video. A high-contrast OLED screen carries a real-time waveform display, a built-in mixer sets each track's input level, and the onboard speaker handles quick reference playback and the accessibility voice guidance.

  Phantom power runs condenser microphones and plug-in power runs lavaliers. Storage is microSDHC and microSDXC up to 1TB, and power comes from two AA batteries or over USB-C, including bus power and external USB battery packs. The H1 XLR is designed with accessibility for the blind and visually impaired, navigating the menu with audible descriptions in English, Spanish, French, Japanese, German, Italian or Chinese.
specs: |-
  - 2-track 32-bit float recorder with dual A/D converters
  - Recording format: WAV at 44.1, 48 or 96 kHz, 32-bit float, stereo or mono, BWF and iXML supported
  - Recording media: microSDHC cards 4 to 32GB, microSDXC cards 64GB to 1TB
  - MIC/LINE inputs: 2 XLR/TRS combo jacks with locking connectors (XLR 2 hot, TRS tip hot), gain adjustment unnecessary thanks to dual A/D converter circuits
  - Hardware MIC/LINE input level select switch for each input
  - Input impedance: 2.7 kohms or more on mic, 1 kohm or more on line
  - Maximum input level: +4 dBu on mic, +24 dBu on line
  - Phantom power: +48 V, 10 mA or less channel total
  - Equivalent input noise: -122 dBu or less (IHF-A) at 150 ohm on mic, -100 dBu or less (IHF-A) at 600 ohm on line
  - MIC/LINE IN jack: stereo mini jack, input impedance 2 kohms, 2.5 V plug-in power
  - PHONE / LINE OUT jack: stereo mini jack with dedicated volume control, maximum output 20 mW + 20 mW into a 32 ohm load, output impedance 10 ohms or less
  - Built-in mono speaker: 20 mm x 30 mm elliptical dynamic, 250 mW effective maximum output
  - Display: OLED, 128 x 64, with real-time waveform display
  - USB: USB Type-C connector, USB Audio Class 1.0 audio interface, USB 2.0 High Speed file transfer
  - Audio interface: 2 in / 2 out stereo at 44.1 or 48 kHz, 16-bit or 32-bit float
  - Power: 2 AA alkaline, lithium or rechargeable NiMH batteries, USB bus power, or the ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Battery life on alkalines: about 12 hours with phantom power off, about 4 hours with phantom power on
  - Maximum power consumption: 2.5 W
  - Dimensions: 62.1 mm (W) x 107 mm (D) x 39.3 mm (H)
  - Weight: 164 g including batteries
  - 1/4-20 tripod mount
  - Built-in mixer to adjust each track's audio input level
  - Voice Guidance accessibility in English, Spanish, French, Japanese, German, Italian or Chinese
