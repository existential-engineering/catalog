description: >-
  The Moog Source is a monophonic analog synthesizer featuring two oscillators and Moog's
  legendary 24dB low-pass filter, with programmable patch memory for storing up to 16
  sounds. Released in 1981, it replaced traditional knobs and sliders with a membrane
  button interface and a single data wheel for parameter editing.
details: |-
  The Moog Source represented Moog's effort to modernize synthesizer design in the early 1980s by incorporating digital patch storage into an analog signal path. It replaced all buttons, knobs, and sliders with flat-panel membrane buttons and a single data-wheel assignment format, a forward-looking design choice that ultimately became the instrument's most divisive feature.

  Parameters are edited not with hands-on sliders and knobs but by assigning a selected parameter to the dedicated data wheel. This approach is tedious for real-time performance, as it does not allow for simultaneous adjustment of different parameters or tweaking while playing. Despite these interface limitations, the Source retained two fat analog oscillators and the legendary 24dB Moog filter, preserving the core sonic characteristics that made Moog synthesizers distinctive.

  The Source included 16 patch memory locations and the ability to save and load patches via cassette tape, making it one of the earlier programmable analog synthesizers. It also featured an arpeggiator/sequencer and CV/Gate connectivity for integration with other analog gear. Notable users include Tangerine Dream, Depeche Mode, New Order, The Cars, Phish, King Crimson, Blur, and Gary Numan.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs plus noise generator
  - Waveforms: Ramp, triangle, variable width pulse
  - Filter: 24dB Moog low-pass with cutoff, resonance, and ADSR envelope
  - LFO: Square and triangle waveforms
  - Memory: 16 patches with cassette tape save/load
  - Keyboard: 37 keys
  - Arpeggiator/Sequencer: Yes
  - Control: CV/Gate connectivity
  - Interface: Membrane buttons with single data wheel
