description: Leo Fender's lost design from '69 takes on a new vibe with twin
  humbuckers in the G&L Espada HH. It carries a set of G&L alnico humbuckers, an
  expansive control plate with volume, treble and bass plus a coil-split and an
  output kill-switch, and the G&L Saddle Lock hardtail bridge of 1979.
details: |-
  Leo Fender's lost design from '69 takes on a whole new vibe with twin humbuckers in the G&L Espada HH and Espada HH Active. The latest in double-hum guitars from G&L, they are wrapped in a gorgeous shape tucked away for decades at CLF Research.

  Espada HH features a set of G&L alnico humbuckers: clean and classic at the neck with a little more juice at the bridge, the same pairing found in other popular G&L HH models. The expansive Espada control plate houses volume, treble and bass controls, each capped by a beautiful chrome CLF Research knob, plus twin mini-toggles: a coil-split for both pickups and an output kill-switch. Then there is the legendary bridge design from '79, Leo Fender's G&L Saddle Lock hardtail, which delivers superb sustain with comfort and style.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L AS4255Z in neck position; AW4470Z in bridge position
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Rosewood or Maple fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 21 medium jumbo, nickel
  - Tuning keys: Kluson
  - Bridge: Leo Fender-designed G&L Saddle-Lock bridge with forged brass saddles
  - Controls: 3-position pickup selector, volume, treble, bass (PTB system), coil tap switch for both pickups, output kill-switch
  - Includes: G&L Deluxe Gig Bag
  - Available in: Jet Black over Alder, 3-ply black pickguard, Rosewood fingerboard
  - Available in: Vintage White over Alder, 3-ply black pickguard, Rosewood fingerboard
  - Available in: Honeyburst over Swamp Ash, 3-ply parchment pickguard, Rosewood fingerboard
  - Available in: Cherryburst over Swamp Ash, 3-ply black pickguard, Rosewood fingerboard
