description: >-
  The Roland RS-202 is a fully polyphonic string and brass synthesizer from
  1976, featuring a 61-key split keyboard with ensemble chorus and vibrato
  effects in a portable suitcase design.
details: |-
  Released in 1976 as the successor to the RS-101, the Roland RS-202 is a
  dedicated string and brass machine that uses divide-down oscillator
  technology to achieve full polyphony across its 61-key keyboard. While
  not dramatically different from its predecessor, it introduced two key
  improvements: user-controllable vibrato delay and an ensemble chorus
  effect.

  The RS-202 offers three preset sounds — Strings I, Strings II, and
  Brass — which can be layered together. The keyboard is split into a
  lower two-octave section and an upper three-octave section, allowing
  players to assign different sounds to each range for more expressive
  performances.

  The ensemble chorus effect is one of the instrument's standout features,
  adding the lush, shimmering quality that made string synthesizers so
  popular in the mid-1970s. Combined with the adjustable vibrato, these
  effects give the RS-202 a warm, atmospheric character that remains
  appealing for ambient and cinematic textures.

  Like other string machines of its era, the RS-202 uses simple sawtooth
  oscillators derived from an organ-style divide-down circuit rather than
  discrete voltage-controlled oscillators. This design choice enabled full
  polyphony but limited the tonal flexibility compared to true
  polysynths. The unit includes a gate output for basic external
  triggering.
specs: |-
  - Polyphony: Full (61 keys)
  - Oscillators: Divide-down sawtooth
  - Presets: 3 (Strings I, Strings II, Brass)
  - Effects: Ensemble/Chorus, Vibrato with adjustable delay
  - Keyboard: 61 keys, split (lower 2 octaves, upper 3 octaves)
  - Connections: Gate Out
  - Form Factor: Suitcase-style portable keyboard
