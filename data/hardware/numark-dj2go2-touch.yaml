url: https://www.numark.com/product/dj2go2-touch
description: A portable, pocket-sized DJ controller featuring capacitive touch
  jog wheels for scratching, a built-in sound card, and pre-mapped Serato DJ
  Lite software.
details: |-
  DJ2GO2 Touch is a portable, pocket-sized DJ controller featuring capacitive touch jog wheels for scratching. The device includes a built-in sound card, comes pre-mapped with Serato DJ Lite software, and is designed for DJs of all styles — suitable for prep work, small gigs, or as a secondary setup for larger events.

  The two-channel layout features a crossfader, pitch faders, and 8 pads with four pad modes covering cue points, looping, and samples. Backlit controls and a low-profile design support use on the go.

  The controller is USB-powered and class compliant for plug-and-play connectivity. It is iOS compatible via Algoriddim's DJay app (requires Apple Camera Connection Kit) and supports stream integration with SoundCloud and TIDAL within Serato DJ Lite.
specs: |-
  - Capacitive touch jog wheels for scratching and mixing
  - Two-channel configuration with crossfader and pitch faders
  - Built-in audio interface (class compliant, driverless)
  - 8 pads with four pad modes (cue points, looping, samples)
  - Serato DJ Lite compatible (software included); upgrade-ready for Serato DJ Pro
  - iOS compatibility via DJay app (requires Apple Camera Connection Kit)
  - Stream integration: SoundCloud and TIDAL within Serato DJ Lite
  - Backlit controls; low-profile design
  - USB-powered with plug-and-play connectivity
