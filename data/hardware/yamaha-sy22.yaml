description: >-
  The Yamaha SY22 is a digital vector synthesizer that combines FM synthesis
  operators with ROM-based samples, manipulated via an onboard joystick. It uses
  a synthesis method similar to the Sequential Prophet VS and Korg Wavestation,
  enabling complex evolving tones through real-time crossfading between sound
  sources. The SY22 is well suited for ambient, dub, and industrial styles.
details: |-
  The SY22 distinguishes itself through real-time joystick-controlled sound manipulation, integrating digital FM operators adapted from Yamaha's DX synthesizer line with ROM-based samples. This enables dynamic tonal morphing between sources, creating complex and evolving textures without traditional filtering elements.

  Notable limitations include the absence of traditional synthesis components such as filters, resonance, ring modulation, arpeggiator, or sequencer. However, these constraints complement the synth's strengths: multitimbrality across eight parts and joystick motion recording capabilities, a feature rarely seen until the Roland JP-8000 arrived years later.

  The SY22 includes sixteen digital reverbs and delays, plus an integrated drum kit sound library. A desktop module counterpart, the TG33, offers expanded memory. Professional users including Moby, Skinny Puppy, and Scanner have incorporated it into their productions.
specs: |-
  - Polyphony: 16 notes, 8-part multitimbral
  - Oscillators: 2 digital FM operators plus ROM samples, 2 per voice
  - LFO: Amplitude and pitch modulation with Saw Up, Saw Down, Triangle, Square, and Sample&Hold waveforms
  - Filter: None
  - Effects: 16 digital reverbs and delays
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 64 preset and 64 user patches
  - MIDI: IN/OUT/THRU, 8 channels
