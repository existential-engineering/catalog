id: rzQeIXL1xdK1tpNmFoWOH
name: HM-400
manufacturer: mackie
primaryCategory: headphone-amp
categories:
  - rack-mount
url: https://mackie.com/en/products/audio-tools/hm-series/HM_400.html
description: "4-Channel Headphone Amplifier. Perfect for studios, practice
  spaces, quiet stages, and more, the HM Series offers everything you need
  whether it is just splitting a single signal to your band, or more complex
  headphone distribution."
details: |-
  The 19" rackmount HM-400 offers an incredible amount of versatility and excellent sound quality in a single rack space. It serves professional applications in studios, Houses of Worship, and practice spaces.

  The unit provides main L/R stereo inputs with level control plus stereo outputs, auxiliary inputs, and EQ per channel with 12 total headphone outputs across 4 channels.

  Each channel features 3 headphone outputs, an aux input with balance control, mute and stereo/2-channel mode switches, and 7-segment LED metering. Built-Like-A-Tank construction ensures reliability for studios, Houses of Worship, and practice spaces.
specs: |-
  - L/R Main stereo inputs plus L/R stereo outputs
  - 7-segment LED metering per channel plus Main
  - 3 headphone outputs per channel
  - Aux input on each channel with balance control
  - Mute and stereo/2-ch mode switches per channel
  - 12 total headphone outputs
  - Built-Like-A-Tank construction
