description: The 19-inch rackmount HM-400 4-Channel Headphone Amplifier offers
  an incredible amount of versatility and excellent sound quality in a single
  rack space.
details: |-
  The 19" rackmount HM-400 4-Channel Headphone Amplifier offers an incredible amount of versatility and excellent sound quality in a single rack space. Perfect for professional applications including studios, Houses of Worship, practice spaces, and more. It also features a main input with level control plus stereo outs, aux inputs and EQ per channel with 12 total headphone outputs.

  Perfect for studios, practice spaces, quiet stages, and more, the HM Series offers everything you need whether it is just splitting a single signal to your band, or more complex headphone distribution.

  Each channel carries a stereo balance knob that doubles as a mix ratio control: with no aux input connected it balances left against right, and with an aux input connected it sets how much aux against main is heard in the headphones.

  Both the main inputs and main outputs carry XLR and 1/4" jacks. You can choose between the XLR or 1/4" inputs, but not both simultaneously.
specs: |-
  - L/R main stereo inputs plus L/R stereo outputs
  - 7-segment LED metering per channel plus main
  - Three headphone outputs per channel, 12 total
  - Aux input on each channel with balance control to mix main and aux signal
  - Bass and treble EQ knobs per channel
  - Mute and stereo/2-channel mode switches per channel
  - Built-Like-A-Tank construction
  - Frequency response 20 Hz to 20 kHz, +/-1 dB
  - Noise -66 dB
  - Distortion (THD) below 0.01% at +4 dBu, 1 kHz, unity gain
  - Maximum main input level +15 dBu balanced or unbalanced
  - Maximum aux input level +20 dBu unbalanced
  - Headphone output 550 mW per channel @ 47 ohms (+21 dBu)
  - Main input impedance 20 k ohm balanced, 10 k ohm unbalanced
  - Aux input impedance 10 k ohm unbalanced
  - Headphone output impedance 3 ohm unbalanced
  - CMRR (main input) above 42 dB @ 1 kHz
  - Gain range (main input) -66 to 18 dBu
  - Power: detachable line cord, ~100 to 120V or ~220 to 240V, 50/60 Hz, 24 W, with voltage selector switch
  - Dimensions 1.8 x 19.0 x 8.8 in / 46 x 483 x 224 mm
  - Weight 8.0 lb / 3.6 kg
