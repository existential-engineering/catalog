details: |-
  Envelop yourself with the most musical sound from the elegantly slim profile NR1711. This AV receiver drives warm, rich, and immersive high-fidelity audio from a compact chassis that is as discreet as it is powerful.

  The Marantz NR1711 7.2 channel 8K Ultra HD AV receiver drives immersive, high-fidelity audio from a compact chassis. With a slim profile that is half the height of a traditional AV receiver, it delivers exceptional performance and sound quality.

  Powering 50 W per channel (8 ohm, 20 Hz to 20 kHz, 0.08% THD, 2 channel drive), it handles movies in striking quality.

  It features one dedicated 8K input and one output for 8K quality video from 8K source devices, with 8K upscaling available on all six HDMI ports.

  The eARC HDMI output transmits uncompressed and object-based audio formats like Dolby Atmos and DTS:X directly from a smart TV app to the AV receiver.
specs: |-
  - 7.2 channels
  - 50 W per channel (8 ohm, 20 Hz to 20 kHz, 0.08% THD, 2 channel drive)
  - 6 HDMI inputs with 8K upscaling on all ports
  - one dedicated 8K input
  - 1 HDMI output with ARC and eARC
  - HEOS built-in
  - Dolby Atmos, Dolby Vision and DTS:X support
  - AirPlay, Bluetooth, Spotify, Amazon Music, Deezer, iHeartRadio, Pandora, Tidal, TuneIn
  - Roon and Josh.ai compatible
  - Control4 and OvrC integration
  - Siri voice control
  - Slim profile, half the height of a traditional AV receiver
