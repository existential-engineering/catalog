  - Five Analog Oscillators
  - 2x Saw or Pulse and 3x Saw Waves
  - Individual Pitch Controls
  - Single CV Pitch Input
  - Transpose all Oscillators
  - Internal Mixer
  - Individual Outputs
  - Pulse Width Control (OSC 1 & 2)
  - FM Inputs (OSC 3, 4 & 5)
  - Skiff friendly
  - Wrong polarity protection
