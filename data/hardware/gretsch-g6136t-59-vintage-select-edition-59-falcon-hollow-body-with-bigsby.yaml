details: |-
  The G6136T-59 Vintage Select Edition '59 Falcon Hollow Body is a sophisticated rendition of the original masterpiece, combining period-accurate features and appointments from the golden age of electric guitars to deliver golden tones and gleaming looks.

  TV Jones Classic pickups capture the open, chiming voice of the original Falcon, while Gretsch 'Squeezebox' capacitors provide an incredibly silky high end. The Bigsby B6GVT vibrato tailpiece adds expressive shimmer to every note.

  With its vintage white gloss nitrocellulose lacquer finish and gold hardware, this guitar offers stunning looks and huge sound — the crown jewel of Gretsch guitars.
