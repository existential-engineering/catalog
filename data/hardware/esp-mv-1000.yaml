description: The LTD Deluxe MV-1000 marks the long-awaited addition of the ESP Maverick shape to the LTD Series, and it comes in a design that’s perfect for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs.
details: |-
  The LTD Deluxe MV-1000 marks the long-awaited addition of the ESP Maverick shape to the LTD Series, and it comes in a design that’s perfect for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. The MV-1000 offers smooth, flowing curves and a slightly asymmetrical shape that truly stands out from the crowd of typical guitars. It offers bolt-on construction at 24.75” scale, making it incredibly easy to do huge string bends and dive-bombs with the Floyd Rose 1000SE double-locking tremolo with stainless steel screws. Crafted with an alder body and a three-piece extra-thin U-shaped roasted maple neck with Macassar ebony fingerboard, reversed matching-finish headstock, and 27 extra-jumbo stainless steel frets, this guitar is ready to assist you in doing the most expressive lead guitar work in your life. Components on the MV-1000 include black hardware, Grover tuners, and a uniquely superb direct-mounted Seymour Duncan pickup set with an ESP-exclusive Custom 14 TB in the bridge position, with coil-splitting via push-pull control, and a Hot Rails in the neck.
specs: |-
  - Construction: Bolt-On
  - Scale: 24.75"
  - Body: Alder
  - Neck: 3Pc Roasted Maple
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 350mm
  - Finish: Pearl White
  - Nut Width: 42mm
  - Nut Type: Locking
  - Neck Contour: Extra Thin U
  - Frets/Type: 27 XJ Stainless Steel
  - Hardware Color: Black
  - Strap Button: Standard
  - Tuners: Grover
  - Bridge: Floyd Rose 1000SE
  - Bridge PU: Seymour Duncan Custom 14 TB *(Pull Volume for Split)
  - Neck PU: Seymour Duncan Hot Rails
  - Electronics Layout: Master Volume(Push/Pull)/3-way Switch
  - Strings: D'Addario XL120 (.009/.011/.016/.024/.032/.042)
  - Case: ST-TE GUITAR FORM FIT CASE
  - Case Included: N
