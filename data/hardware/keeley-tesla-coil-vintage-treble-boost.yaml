details: |-
  The Tesla Coil Vintage Treble Booster is a hand-made boost pedal aimed at classic 1960s and 1970s tones. It is built around hand-selected NOS Tesla 106NU70 germanium transistors made in the mid 1970s in Bulgaria, and the measured gain of the individual transistor is hand-labelled on the back of each pedal.

  It is a treble booster by design rather than an overdrive or distortion pedal, so the higher the note played the more it is amplified and driven, while bass notes stay tight and defined. Keeley describes it as a neo-vintage effect intended for use with an amplifier already cranked to the point of breaking up, where pushing both amplifier and pedal produces a creamier, more sustaining distortion. Dark-voiced amplifiers are named as the best match.

  Keeley notes that treble boosters of this kind have long been associated with players including Tony Iommi, Brian May, Rory Gallagher, Eric Clapton, Ritchie Blackmore, Dweezil Zappa and Wolf Hoffmann, the last of whom is credited as a user of Keeley's own Java Boost rather than of this pedal.
