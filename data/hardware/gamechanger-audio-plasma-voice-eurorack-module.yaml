details: |-
  Plasma Voice is a synthesizer module that produces sounds by controlling high-voltage electrical discharges between two electrodes on a specially designed xenon-filled gas tube. These discharges are converted to analog audio using a specialized rectifier circuit. The result is mesmerizing electric sounds that match the visual intensity of the blue bolt of electricity.

  The electric discharges are driven by a proprietary ultrasound pulse-width oscillator. This oscillator is modulated by predefined samples and envelope shapes, called SOUNDS, which can be selected, triggered, waveshaped and modulated with sliders and CV inputs. That puts the player in control of the electrical discharges and the resulting sounds.

  Even though the selectable SOUNDS are organized into BANKS dedicated to specific musical parts, each one can be transformed well beyond its intended use.

  Plasma Voice is the latest addition to the Plasma product line. Although it shares the same technology, the previous products were designed specifically as distortion units, and most of their sound shaping parameters were set at optimal sweet spots to ensure stable distortion. By using the full potential of modulating the tube's driver, Gamechanger Audio created the first Plasma product that does not need an external sound source. It is a fully independent voice on its own.
specs: |-
  - Sound generated by high-voltage electrical discharges between two electrodes in a xenon-filled gas tube, converted to analog audio by a rectifier circuit
  - Proprietary ultrasound pulse-width oscillator, modulated by predefined samples and envelope shapes
  - Selectable SOUNDS organized into BANKS, triggerable, waveshapeable and modulatable from sliders and CV inputs
  - Bus-powered via a conventional Eurorack PSU ribbon cable, power cable included
  - Power draw: +12V 220 mA, -12V 35 mA, +5V none
  - Limited lifetime warranty
