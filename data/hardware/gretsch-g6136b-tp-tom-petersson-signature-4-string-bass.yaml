details: |-
  The members of Cheap Trick have reigned as the high priests of hard-rocking U.S. power pop for more than 40 years, with an impeccable playing of bassist and co-founder Tom Petersson.

  Gretsch proudly introduces the G6136B-TP-AWT Tom Petersson Signature 4-String Bass. Stunning in style and tone, it puts Petersson's distinctive stamp on the classic White Falcon Bass design, with premium features including a Gretsch Rumble'Tron neck pickup.
