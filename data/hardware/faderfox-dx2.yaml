description: Special DJ-controller optimized for Native Instruments Traktor DJ
  Studio, complementing the DJ2 by loop functions and an FX section.
details: |-
  DX2 is a special DJ-controller optimized for Native Instruments Traktor DJ Studio. Setup files for Traktor DJ Studio as of version 2.1 are shipped with the controller, and the unit is independent of operating system and computer type (PC or Mac) due to the midi interface, with no driver necessary.

  It is a complement to the DJ2 by loop functions and fx section. The FX section carries 4 pots and 4 buttons switchable to 2 groups FX1/FX2, optimised for Traktor 3.0 and also very suitable to the Traktor 2.x filter.

  Five push-encoders handle track browsing, seek/scratch and pitch functions, while 36 freely reassignable double-function buttons cover transport, pitch bend, FX and loop duties for each deck. A midi-merge function is included, the system is expandable by other micromodul controllers through easy chaining by midi connections, and it is compatible to the 1st micromodul line, using the same cc/note numbers as the DJ1.

  Power comes from an independent supply of 3 x AA cells, standard or rechargeable, with a lifetime of about 100 hours and an LED battery control. A socket for an external power adaptor (4.5-6V DC, min. 50 mA) is also fitted.

  The very compact design uses a black plastic casing in desktop format, 180x105x70 mm and 450 g, with a silver aluminium front plate carrying an abrasion-resistant anodised coating and inscriptions. Pots and encoders are high-quality parts from ALPS.
specs: |-
  - Special DJ-controller optimized for Native Instruments Traktor DJ Studio
  - Setup files for Traktor DJ Studio as of version 2.1 shipped with the controller
  - Independent of operating system and computer type (PC or Mac) due to the midi interface, no driver necessary
  - FX section with 4 pots and 4 buttons switchable to 2 groups FX1/FX2 (optimised for Traktor 3.0, also suitable to the Traktor 2.x filter)
  - 5 push-encoders for track browsing, seek/scratch and pitch functions
  - 36 freely reassignable double-function buttons (transport, pitch bend, FX and loop buttons for each deck)
  - Independent power supply by standard or rechargeable batteries, 3 x AA cell, lifetime about 100 hours
  - LED battery control
  - Socket for an external power adaptor (4.5-6V DC, min. 50 mA)
  - Midi-merge function
  - Very compact design in a black plastic casing, desktop format 180x105x70 mm, 450 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality pots and encoders from ALPS
  - Expandable system by other micromodul controllers (easy chaining by midi connections)
  - Compatible to the 1st micromodul line (same cc/note numbers like DJ1)
  - Requires a PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - Requires Native Instruments Traktor DJ Studio (as of version 2.1) or software which allows user assignments of continuous parameters (CC) and note commands
