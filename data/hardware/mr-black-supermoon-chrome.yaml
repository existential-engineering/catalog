description: The SuperMoon Chrome expands the original SuperMoon reverb with
  brighter early reflections, a 30-plus second reverb tail and a lossless full
  wet/dry mix that is 100% wet capable. It adds proprietary Sway modulation for
  ambience in a box.
details: |-
  A brighter, deeper take on the coveted SuperMoon Modulated Reverberator, the
  SuperMoon Chrome adds brighter early reflections, a staggering 30-plus second
  reverb tail and a lossless full wet/dry mix control capable of a fully wet
  signal. Add a touch, or a lot, of its proprietary Sway modulation and you have
  genuine ambience in a box.

  The Chrome is as tame or as dramatic as you need. With Decay and Sway set
  modestly it delivers just a hint of space, and it extends quickly into a lush,
  dramatic wash of delicate micro-reflections that seamlessly blend as they float
  away into the abyss.

  Like the standard SuperMoon, the Chrome sounds phenomenal with distortion,
  holding together where lesser reverbs smear. It is a powerful, expressive
  reverberator for ambient guitar, keys and studio work.

  Housed in a compact, daisy-chain-friendly enclosure with true-bypass switching,
  the SuperMoon Chrome is proudly made in the U.S.A.
specs: |-
  - Stunning, lush reverb
  - Dynamic, proprietary Sway modulation
  - Full, lossless wet/dry mix control (100% wet capable)
  - Up to >30 seconds of fluid reverb trails
  - Daisy Chain Friendly
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - Frequency Response: ~15.6Hz – ~22KHz
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9VDC battery (not included)
  - Current Draw: <60mA
