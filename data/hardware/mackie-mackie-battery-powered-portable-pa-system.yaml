description: "You've 'made it work' with portable speakers, but what if you
  could have the full experience of a professional live sound system, anywhere,
  no power outlet needed? Ready, set, GO with the Mackie complete
  battery-powered PA system."
details: |-
  The Mackie Battery-Powered Portable PA System is a complete bundle for professional live sound without a power outlet. The system includes two Thump GO battery-powered loudspeakers, two ThumpSub GO battery-powered subwoofers, a ProFX10 GO battery-powered mixer, and two SPM400 speaker mounting poles.

  Thump GO delivers signature thump and clarity for up to 12 hours on a single charge of the included GB-100 battery. Each speaker features an 8" woofer, 1" compression driver, and 200W amplifier, with Music Ducking, Feedback Eliminator, voicing modes, a built-in 2-channel mixer, Bluetooth streaming, and Thump Connect 2 app support.

  ThumpSub GO carries the bass like a briefcase with a built-in ergonomic handle. Thanks to the low-profile design, you can lay ThumpSub GO flat and slide it out of sight under tables, stages, DJ stands, tractors—you name it. Each sub has dual 8" woofers, a 400W Class-D amp, two hot-swappable battery compartments for up to 12 hours of runtime, and vertical or horizontal orientation.

  ProFX10 GO is a 10-channel battery-powered mixer with 4 Onyx preamps (up to 60 dB gain), 3-band EQ, compression, low-cut filters, a bi-directional Bluetooth channel, GigFX+ effects with LCD display, 3 USB-C recording modes including Loopback, 48V phantom power, and Hi-Z switches. It runs up to 8 hours on the included GB-10 battery.
specs: |-
  - Thump GO: 8" woofer, 1" compression driver, 200W amplifier
  - Thump GO: up to 12 hours battery life with included GB-100 battery
  - Thump GO: Music Ducking, Feedback Eliminator, voicing modes, Bluetooth streaming, Thump Connect 2 app
  - ThumpSub GO: dual 8" woofers, 400W Class-D amplifier
  - ThumpSub GO: up to 12 hours total runtime via two hot-swappable battery compartments (includes two GB-200 batteries)
  - ThumpSub GO: vertical or horizontal orientation, Bluetooth streaming
  - ProFX10 GO: 10 channels, 4 Onyx preamps (up to 60 dB gain), 3-band EQ, compression, low-cut filters
  - ProFX10 GO: up to 8 hours battery life (GB-10 included), bi-directional Bluetooth channel, GigFX+ effects with LCD
  - ProFX10 GO: 3 USB-C recording modes including Loopback, 48V phantom power, Hi-Z switches
  - Includes 2x SPM400 speaker mounting poles
