description: The world's most powerful, advanced DJ system — a 4-deck standalone
  DJ console with a 10.1" multi-touch display, multicore processor, and full
  Engine DJ workflow.
details: |-
  The PRIME 4 is the world's most powerful, advanced DJ system — a 4-deck standalone console with multicore processor technology that performs without a laptop and brings the full Engine DJ workflow to the booth.

  Centered on a vibrant 10.1" full-color multi-touch display, the PRIME 4 delivers intuitive library navigation, waveform analysis, and FX control in a single integrated surface.

  Read tracks from SD/SDHC cards, USB drives, an internal 2.5" SATA bay, or stream directly via built-in Wi-Fi from Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, and Dropbox.

  Studio-quality analog stage: dual combo mic inputs, two phono/line channels for turntables or external sources, balanced XLR Master/Zone/Booth outputs, plus dedicated RCA Master and dual 1/4"/1/8" headphone outputs.

  Doubles as a controller for Serato DJ Pro and Virtual DJ over the USB-B host port, making it equally capable as a software-driven setup as a fully standalone system.
specs: |-
  - Number of Decks: 4-deck
  - Channels: 4-channel
  - Display: 10.1" / 257mm full-color LED-backlit multi-touch (8.5" x 5.5" / 216 x 139mm)
  - Jog Wheel Displays: 2.2" / 56mm full-color LED-backlit
  - FX Display: 128 x 32 pixel black & white OLED
  - Bit Depth: 24-bit
  - Sampling Rate: 44.1 kHz
  - Dynamic Range: >117 dB (A-weighted)
  - Frequency Response: 20 Hz - 20 kHz (±1 dB)
  - Signal-to-Noise Ratio: >93 dB (A-weighted)
  - Channel Separation: <-90 dB (1 kHz, unity)
  - THD (Line/Phono): <0.01% (1 kHz, unity)
  - THD (Microphone): <0.02% (1 kHz, unity)
  - Line Headroom: >15 dB
  - Microphone Headroom: >20 dB
  - Output Headroom: >20 dB
  - Line Input: 0 dBV unity / +15 dBV max
  - Microphone Input: -40 dBu unity / -60 dBu min
  - Master Output (Balanced): +4 dBu unity / +24 dBu max
  - Master Output (Unbalanced): 0 dBu unity / +20 dBu max
  - Zone Output (Balanced): +4 dBu unity / +24 dBu max
  - Booth Output (Balanced): +4 dBu unity / +24 dBu max
  - Headphone Output: <150 mW
  - XLR Connectors: (6) Neutrik balanced outputs (Master, Zone, Booth pairs); (2) XLR + 1/4" combo mic inputs
  - RCA Connectors: (1) RCA Master output pair; (4) RCA input pairs (line/phono for ch 3 & 4)
  - Headphones: 1 x 1/4" (6.35mm), 1 x 1/8" (3.5mm)
  - Data Ports: 4 x USB Type-A media, 1 x USB Type-B host, 1 x SD card slot, 1 x Ethernet link, 1 x internal 2.5" SATA bay
  - Wireless: Built-in Wi-Fi (streaming + cloud storage)
  - Compatible Media: SD/SDHC, USB mass-storage, 2.5" internal SATA, external HDD enclosures
  - File Systems: exFAT, FAT32
  - Audio Formats: AAC/M4A, AIF/AIFF, ALAC, FLAC, MP3, MP4, Ogg Vorbis, WAV
  - Streaming Services: Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, Dropbox
  - Power Input: 110-240 VAC, 50/60 Hz
  - Power Consumption: 38-39 W (standard); 43-45 W (with USB device charging)
  - Dimensions: 728.47 x 496.82 x 103.63 mm (28.68" x 19.56" x 4.08")
  - Weight: 9.7 kg / 21.34 lb
