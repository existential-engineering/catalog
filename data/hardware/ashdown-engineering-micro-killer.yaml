details: |-
  The MICRO-KILLER is a 3W battery-powered guitar amp combo designed for musicians who demand portability, versatility, and sound quality in one compact package. Equipped with a custom 1 x 3 inch Ashdown speaker, it delivers clear, rich tones that defy its small size, making it ideal for practice sessions, busking, and intimate performances. A simple one-knob tone control lets you shape your sound quickly. With a line input for jamming, a headphone output for silent practice, and wireless audio streaming, the MICRO-KILLER adapts to any situation. Compact and lightweight at just 1kg and measuring 150 x 150 x 100mm, it is built to handle life on the move.
