details: |-
  The Catalinbread Bitters is a multi-effects pedal that reimagines the Alesis Bitrman, a cult-classic digital effects processor. Three effects run in series: a digital distortion stage, a phase shifter, and a user-selectable "Bitters" mode, with the ability to reverse the signal chain order for experimental results.

  The Distort knob controls digital distortion gain, while the Dual knob adjusts the phase shifter speed from 0 to 20Hz. The Mix knob blends the dry and wet signals, letting you dial in subtle coloration or full wet processing.

  The Bitters mode selector offers four program choices: Decimator (sample rate reduction), Bitcrusher (reduces to 1-bit fidelity with a built-in noise gate), Frequency Modulation (pitch vibrato), and Ring Modulator (tremolo-based modulation).

  The pedal accepts a center-negative DC power supply from 9 to 18 volts, and is compatible with guitar, bass, synthesizers, drum machines, and DAW audio interfaces.
