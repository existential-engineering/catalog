description: The CRUNCHY CHIME CC-1B is a booster pedal for guitar and bass with
  an equalizer function, offering a boost range of -16 dB to +17 dB.
details: |-
  The CRUNCHY CHIME is a booster unit with an equalizer function. Its boost circuit was developed out of the maker's research into the harmonic components of vintage guitars and amplifiers, with the aim of generating rich higher harmonics that are not strident.

  Because every amplifier has different characteristics, a booster can make the lower register sound dull, and ample harmonics sounded muddy on some of the amplifiers used in development when unnecessary harmonic components conflicted with each other. A new equalization circuit was therefore added so that the frequency characteristics can be matched to the rest of the rig, and the maker describes it as making tone adjustments for boost or cut sound natural rather than equalized. The response is flat with both the TREBLE and BASS knobs at the 12 o'clock position.

  A MODE switch selects the boost and cut frequency range of the BASS control, which is useful for the lower register of a 7-string guitar or a bass guitar. Setting both the TREBLE and BASS knobs to the cut position lets the unit work as a MID booster. The boost circuit for volume control covers a range from -16 dB to +17 dB.

  Free The Tone's HTS (Holistic Tonal Solution) circuit performs impedance conversion while bringing out the sound characteristics of the guitar or bass, and prevents degradation of the instrument's timbre even when the effect is switched off. The output signal is in the same phase as the input signal, so there is no phase reversal to allow for.
specs: |-
  - Input impedance: min. 500k Ohm
  - Output load impedance: min. 10k Ohm
  - Controls: BOOST (-16 dB to +17 dB), TREBLE, BASS, MODE switch
  - Terminals: 2 x 1/4 inch standard phone jacks (input, output), DC9V input jack (for AC adapter connection)
  - Power supply: 9-volt PP3 battery, or 9V DC center negative polarity
  - Current consumption: 7 mA
  - Dimensions (W x D x H): 72 x 115 x 50 mm including protuberances such as footswitches and jacks
  - Weight: approx. 230 g excluding accessories
  - Flat response with TREBLE and BASS at the 12 o'clock position
  - Output signal in the same phase as the input signal
