description: The Dude is a portable, battery-operated 5-channel monophonic audio
  mixer designed for mobile music-making. Each channel features up to +20dB gain
  and a dedicated mute button. It supports dual mono output for headphone
  driving and can function as a feedback tone generator by routing output back
  to input through passive EQ circuits.
details: |-
  The Dude is a compact, portable 5-channel monophonic audio mixer from Bastl Instruments, designed for musicians who need a simple, battery-powered mixing solution on the go.

  Each of the five channels features an individual gain control offering up to +20dB (10× amplification) and a dedicated mute button, allowing quick silencing of individual channels. The dual mono output is capable of driving headphones directly.

  A unique feature of the Dude is its ability to act as a feedback tone generator: routing the output back into an input through passive EQ circuits creates feedback loops useful for experimental sound design.

  Power is supplied by 4× AA batteries for portable use, or via an external 9–12VDC adapter. Dimensions: 75 × 70 × 45 mm. Also available as a DIY kit with PCB, assembly guide, and schematics.
