description: RANDOM8 is an eight-channel random voltage generator created in
  collaboration between Befaco and Mylar Melodies, packed into just 8HP. Each
  channel features independent looping controls, a pitch quantizer with 16 scale
  options, slide, probability, and offset controls. It functions simultaneously
  as a pitch sequencer, CV animator, and LFO, enabling performers to cycle
  between looping and evolving voltages with a single button press.
details: |-
  RANDOM8 is Befaco's first collaboration with Mylar Melodies, combining a deep feature set into a remarkably compact 8HP format. The module provides eight fully independent stepped or smooth random voltage generators, each producing 0–10V unipolar output. Eight cascading normalised trigger inputs allow the channels to share a single clock source or to accept individual triggers by breaking the normalisation chain, giving performers flexible rhythmic control over each channel.

  Each of the eight channels includes a per-channel looping system capable of locking phrases between 1 and 32 steps. Phrases can be set to loop indefinitely or to evolve over time, blurring the line between a static sequence and a constantly shifting generative voice. This makes the module equally suited to anchored melodic lines and slow, unpredictable modulation textures.

  Per-channel controls include a pitch quantizer with 16 selectable scales, a slide control for smooth voltage glides between steps, a probability setting that determines how often a step regenerates a new random value, an input trigger divider (1–8), and an offset and attenuator for shaping the output range. Eight random voltage distribution styles let the user tune the statistical character of the randomness, from uniform to weighted or bipolar profiles.

  The module stores up to eight preset configurations that can be saved and recalled instantly, supporting live performance workflows. All settings are accessible through a single-layer per-channel menu system using dedicated buttons and knobs on the panel. A free VCV Rack version is also available for users who want to explore the workflow in software before or alongside hardware use.
