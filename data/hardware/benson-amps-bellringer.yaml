  - Power: 35 watts, scalable to 0.5 watts
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Foot-switchable reverb
  - Dimensions (1x12 combo): 23.5"W x 17.5"H x 10"D, 44 lbs
  - Dimensions (reverb head): 21"W x 11"H x 8.5"D, 27 lbs
