description: A Butch Walker signature dual-channel pedal combining the JHS
  SuperBolt overdrive with a custom two-stage boost circuit, with switchable
  effect order and selectable gain modes.
details: |-
  The Ruby Red is a collaboration with artist, producer, and writer Butch Walker. He needed one pedal that could do everything he needed in the simplest way possible — primarily playing a cranked Deluxe Reverb and depending on his guitar's volume control for dynamics, the pedal had to respond like an amp. The left side is the SuperBolt overdrive with Volume, Tone, and Drive controls. The '+' toggle adds more sag, compression, and gain. The right side is a custom two-stage boost circuit with a Boost knob. The order toggle lets you choose SuperBolt > Boost or Boost > SuperBolt. Two independent footswitches provide True Bypass operation for each channel.
