description: The Baby 2H is Collings' smallest model and a rarity among
  fractional-size guitars, built as an approximately 3/4-size version of their
  OM. At 12 1/2 inches wide with a 24 1/8-inch scale, it delivers remarkably
  balanced tone with adequate volume for most applications. Equally at home as a
  travel guitar or a songwriter's tool, it brings Collings' hallmark
  craftsmanship to a compact, portable format.
details: |-
  The Baby 2H is Collings' smallest production acoustic model, approximately 3/4 the size of their OM guitar. Despite its compact dimensions (12 1/2" wide, 17 1/8" long, 3 15/16" deep, 36 1/2" total length), it is constructed with the same premium materials and meticulous craftsmanship the brand is known for. The top is Sitka spruce braced with pre-war scalloped X-bracing, while the back and sides are East Indian rosewood. The neck is Honduran mahogany, topped with an ebony fingerboard adorned with abalone short diamond & squares inlays. The bridge is an ebony small belly-style with 2 3/16" string spacing. Finish is high gloss nitrocellulose lacquer on the body and high gloss polyester resin on the neck. Tuners are nickel Waverly.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with abalone short diamond & squares
  - Scale Length: 24 1/8"
  - Nut Width: 1 11/16"
  - Bridge: Ebony small belly-style, 2 3/16" spacing
  - Bracing: Sitka spruce, pre-war scalloped X-brace
  - Tuners: Nickel Waverly
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 12 1/2"
  - Body Length: 17 1/8"
  - Body Depth: 3 15/16"
  - Total Length: 36 1/2"
  - Strings: D'Addario EJ-16 (.012"-.053")
