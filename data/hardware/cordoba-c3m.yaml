details: |-
  The C3M is one of Cordoba's most popular entry-level nylon string guitars. Lightweight and comfortable to play, the C3M features a solid Cedar top, Mahogany back and sides, and a matte finish. Handmade in traditional Spanish style, its fan bracing results in a beautiful, warm, and well-balanced tone. The C3M is hand-crafted and features a hand-inlaid wooden rosette, rosewood fingerboard, and bridge, Savarez strings, and nickel-plated tuning machines with pearl buttons.
