description: The VP4 VIRTUAL PEDALBOARD processor from Fractal Audio Systems is
  a compact multi-effects unit providing four simultaneous effects with a
  user-friendly experience inspired by traditional guitar pedals. Based on the
  award-winning Axe-Fx III, it includes hundreds of the best effects, classic
  stompbox and studio models including drives, delays, reverbs, choruses,
  flangers, phasers, pitch, plex, EQs, compressors, wah, tremolo, and many more.
details: |-
  The VP4 is a compact virtual pedalboard processor that runs four simultaneous effects with an experience modelled on traditional guitar pedals. Its effects are based on those of the Axe-Fx III, giving a choice of more than 400 classic stompbox and studio models covering drives, delays, reverbs, choruses, flangers, phasers, pitch, plex, EQs, compressors, wah and tremolo.

  The unit is designed to sit alongside a traditional amplifier and also works as a source of pre-effects or post-effects for any modeler. Four footswitches give classic on and off switching so the VP4 can be used like four separate pedals, while the factory default Gig Mode switching system puts Presets, Scenes, Effects, Channels, Tuner and Tap Tempo under foot.

  Each of the 104 presets behaves like a complete pedalboard built from a choice of four effects, with its own Noise Gate and Master EQ and level settings. For players who want to go further, the VP4 supports Scenes, Channels, Modifiers and Controllers, and up to two expression pedals or switches can be connected for real time control of effect settings.

  Connectivity covers mono and stereo analog I/O at unity gain with an ultra low noise floor, a 4CM Mode that divides effects between the front of an amp and its effects loop, buffered analog bypass, SPDIF digital I/O, MIDI I/O and USB audio and MIDI. A dedicated large display tuner mode and an always visible mini tuner both use the pitch detector from the Axe-Fx III.

  Firmware 3.0 adds an IR Player block that loads and mixes impulse responses inside the VP4, so the unit can perform speaker cabinet simulation, add acoustic body resonance or be used for other creative tones. The same release brings next generation pitch shifting from the Axe-Fx III, new drive models and Scene MIDI Sync. VP4-Edit is a free companion editor and librarian, and the firmware is user upgradeable.
specs: |-
  - Four simultaneous effects per preset
  - Over 400 effects based on those of the Axe-Fx III
  - 104 presets, each with its own Noise Gate and Master EQ and levels
  - Four footswitches with classic ON/OFF switching plus a Gig Mode switching system for Presets, Scenes, Effects, Channels, Tuner and Tap Tempo
  - 69 Drive pedal emulations, 78 reverbs, 16 compressors and 128+ delay effects across Delay, Multitap Delay, Plex Delay and Megatap Delay
  - IR Player block for speaker cabinet simulation, added in firmware 3.0
  - Support for Scenes, Channels, Modifiers and Controllers
  - Connection for up to two expression pedals or switches, such as the Fractal Audio EV-1 and EV-2
  - Dedicated large display tuner mode plus an always visible mini-tuner, using the Axe-Fx III pitch detector
  - Mono and stereo analog I/O at unity gain with an ultra-low noise floor
  - 4CM Mode divides effects between the front of the amp and its effects loop
  - Buffered analog bypass
  - SPDIF digital I/O, MIDI I/O and USB audio and MIDI
  - VP4-Edit free companion software editor and librarian
  - User upgradeable firmware
