description: The Martin D-42 Modern Deluxe fuses heritage craftsmanship with
  contemporary innovation, pairing a VTS spruce top and Adirondack X-bracing
  with luxury Style 42 appointments. A Dreadnought voiced for full, rich tone
  with notable clarity and projection.
details: |-
  The D-42 Modern Deluxe represents a fusion of heritage craftsmanship with contemporary innovation. It captures the resonant character of Martin's Golden Era while incorporating modern refinements. The guitar features a spruce top treated with the Vintage Tone System (VTS) and Golden Era–style Adirondack spruce X-bracing, engineered to deliver the sonic qualities of guitars nearly a century old.

  Modern enhancements include natural protein glue construction and a carbon-fiber bridge plate designed to increase sustain and projection. Exclusive Liquidmetal® bridge pins further boost the instrument's output. The neck design incorporates EVO gold frets and a slightly asymmetrical profile for enhanced playability and comfort.

  Aesthetically, the guitar emphasizes luxury appointments: European flamed-maple binding frames the body and fingerboard, complemented by brilliant pearl bordering on the top. The headplate features a pearl torch inlay, with Waverly gold open-gear tuners completing the elegant aesthetic. The iconic Dreadnought body shape delivers full, rich tone with notable clarity and power.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back & Sides: East Indian Rosewood
  - Neck Wood: Genuine Mahogany (Dark Mahogany)
  - Fingerboard: Ebony
  - Scale Length: 25.4"
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Neck Shape: Vintage Deluxe
  - Neck Taper: High Performance Taper
  - Total Frets: 20
  - Neck Join: Dovetail at 14th Fret
  - Bracing Pattern: Forward Shifted X-Brace (GE-Scalloped, Adirondack Spruce with VTS, 5/16")
  - Bridge: Ebony, Modern Belly Drop-in Saddle
  - Bridge Pins: Liquidmetal® with Abalone dots
  - Saddle: Compensated Bone (16" radius)
  - Bridge Spacing: 2 5/32"
  - Tuners: Waverly Gold Open-Gear
  - Nut Material: Bone
  - Headstock: Solid with Square Taper, Diamond and Square Corners
  - Headplate: Ebony with Torch Inlay (Pearl)
  - Binding: European Flamed Maple with Multi-Stripe
  - Top Inlay: Abalone with Multi-Stripe
  - Rosette: Abalone with Multi-Stripe
  - Fingerboard Inlay: Golden Era Style 45 Snowflake (Abalone/Mother of Pearl)
  - Back Purfling: Style 45 Golden Era
  - Pickguard: Tortoise Pattern
  - Finish: Gloss (top and back/sides)
  - Pleking: Yes
  - Electronics: None (factory pre-installed options available)
  - Case Included: Ply Hardshell
  - Left-Handed: Available
