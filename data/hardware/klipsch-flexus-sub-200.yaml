url: https://www.klipsch.com/products/flexus-sub-200
description: The Klipsch Flexus Sub 200 is a compact wireless 12" subwoofer
  delivering powerful, low-latency bass in a small footprint. It features
  Klipsch transport technology for wireless integration with the Flexus
  ecosystem and a sealed MDF enclosure with a Class D amplifier.
details: |-
  The Flexus Sub 200 packs a lot of punch per square inch thanks to careful Klipsch engineering. Its 12" long throw paper cone woofer in a sealed MDF enclosure delivers powerful bass with plenty of depth and musicality without latency.

  Klipsch transport technology built into every Flexus product means the whole home entertainment ecosystem functions fast and efficiently. Setup is simple, latency is low, and the subwoofer connects wirelessly via an included Flexus Transport dongle.

  For expanded bass performance, two Flexus Sub 200 units can be paired to smooth out the peaks and nulls typically experienced with a single subwoofer arrangement. The system is compatible with the Klipsch Connect Plus app, which provides custom EQ presets, Night Mode, Dialogue Boost, and volume control.

  The Flexus system was meticulously reviewed by engineers at sister company Onkyo and passed over 1,000 rigorous tests to ensure audio performance and interconnectivity.
