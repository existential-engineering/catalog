name: TX2152
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/tx2152/
description: Dual 15-inch two-way passive loudspeaker from EV's Tour-X series,
  designed as mains for small-to-medium clubs and live venues. Pairs two SMX2151
  15-inch low-frequency drivers with a 2-inch ND2 neodymium compression driver
  on a rotatable 60 x 40 degree constant-directivity horn, delivering 139 dB
  maximum SPL from a plywood and MDF enclosure with EVCoat finish.
details: >-
  Part of EV's Tour-X portable loudspeaker family, the TX2152 is a high-output
  passive full-range cabinet built around dual 15-inch woofers and a
  large-format 2-inch compression driver, intended for front-of-house mains in
  small-to-medium clubs where external amplification and processing handle drive
  and DSP.


  The rotatable 60 by 40 degree constant-directivity horn allows the cabinet to
  be flown or stacked in either orientation without changing coverage geometry,
  while an advanced 6th-order crossover at 1.75 kHz blends the two SMX2151
  low-frequency drivers with the ND2 neodymium HF driver and provides dedicated
  HF protection.


  The internally braced cabinet is finished in EVCoat over plywood and MDF, with
  six M10 threaded inserts for rigging and a flying-rated suspension system
  suitable for permanent install or touring use.
specs: |-
  - Configuration: 2-way passive full-range
  - LF transducers: 2 x SMX2151 15 in (381 mm) woofers
  - HF transducer: ND2 2 in (51 mm) neodymium compression driver
  - Horn: rotatable constant-directivity 60 x 40 degrees
  - Crossover: advanced 6th-order with HF protection
  - Power handling (continuous / peak): 1000 W / 4000 W
  - Frequency response (-3 dB): 55 Hz - 13 kHz
  - Frequency range (-10 dB): 50 Hz - 18 kHz
  - Maximum SPL: 139 dB
  - Axial sensitivity (1 W @ 1 m): 103 dB
  - Nominal impedance: 4 ohms
  - Minimum impedance: 3.1 ohms
  - Crossover frequency: 1.75 kHz
  - Horizontal coverage: 60 degrees
  - Vertical coverage: 40 degrees
  - Input connectors: 2 x Neutrik NL4 Speakon (parallel in/through)
  - Cabinet material: plywood and MDF with EVCoat finish
  - Color: black
  - Suspension: 6 x M10 threaded fly points
  - Dimensions (H x W x D): 1154 x 508 x 471 mm
  - Net weight: 42.8 kg
