description: This simple but essential expander can connect up to four Dixies
  via the supplied 6-pin ribbon cables.
details: |-
  DixieCTRL is an expander for connecting up to four Dixie oscillators via supplied 6-pin ribbon cables. It provides master 1V/oct control, master lin FM with attenuator, and master PWM with attenuator; the PWM modulation direction is inverted on every other Dixie to create extra-thick PWM. It also offers master pulse width control.

  This expander works with all versions of the Dixie (both the original Dixie and Dixie II).
specs: |-
  - Width: 6HP
  - Power: 7.5mA @+12V, 7.5mA @-12V
  - Connects up to 4 Dixie modules via supplied 6-pin ribbon cables
  - Master 1V/oct control
  - Master lin FM with attenuator
  - Master PWM with attenuator (inverted on alternating Dixies for extra-thick PWM)
  - Master pulse width control
  - Compatible with all versions of Dixie (v1 and Dixie II)
