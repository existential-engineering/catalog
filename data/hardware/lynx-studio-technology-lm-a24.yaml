details: |-
  The LM-A24 is a specialty analog module that provides line-level I/O on TRS connectors. Designed to the same exacting standards Lynx converters are known for, it offers pristine transparency, excellent imaging, and ruler-flat frequency response.

  Featuring two analog inputs and four analog outputs, all on balanced 1/4-inch TRS jacks, the LM-A24 is the perfect addition to your 8, 16 or 24 channel Aurora(n). The two analog inputs are switchable between +20 dBu and +24 dBu, making them more compatible with other professional equipment (mic pres, etc.). Outputs are identical to the LM-A4 module.

  The module provides an excellent solution for installations requiring a small number of dedicated I/O's without requiring an additional break-out cable. It also offers I/O levels up to +24dBu for extended compatibility with other pro studio equipment. An excellent example application is providing separate monitor outputs when other Aurora(n) line outputs are being fed to a summing mixer or to a patch-bay for inserts.

  The outputs can easily drive powered monitors and offer precise level control via a low-distortion, digitally-controlled analog attenuator. This analog-domain attenuator maintains a high signal-to-noise ratio over the adjustment range. Monitor speaker protection is provided by output anti-pop relays.

  Input trims, output levels, signal routing and mixing are easily controlled from the Aurora(n) front panel or using Lynx's NControl application on any Windows or Mac computer. The module is user-installable either in the top position of module 1 or below the LT-USB or LT-TB3. For Dante and Pro Tools HD connection methods the LM-A24 must be installed in the top position of module 1.
specs: |-
  - Two electronically balanced line inputs on 1/4-inch TRS jacks, accepting levels up to +24 dBu
  - Four electronically balanced line outputs on 1/4-inch TRS jacks
  - Lynx proprietary 24-bit A/D and D/A conversion
  - Input full-scale trim settings: +20 dBu and +24 dBu
  - Output level: -71.5 dBu to +24 dBu, adjustable in 0.5 dB increments in the analog domain
  - Line in THD+N: -113 dB at 1 kHz, -1 dBFS, 20 kHz filter, +20 dBu trim
  - Line in dynamic range: 119 dB, A-weighted, -60 dBFS signal method
  - Line in frequency response: plus or minus 0.010 dB, 20 Hz to 20 kHz
  - Line in crosstalk: -130 dB maximum at 1 kHz, -1 dBFS signal
  - Line in common mode rejection: greater than 80 dB
  - Line out THD+N: -108 dB at 1 kHz, -1 dBFS, 20 kHz filter, +20 dBu FS setting
  - Line out dynamic range: 120 dB, A-weighted, -60 dBFS signal method
  - Line out frequency response: plus or minus 0.025 dB, 20 Hz to 20 kHz
  - Line out crosstalk: -130 dB maximum at 1 kHz, -1 dBFS signal
  - Fully-differential transparent design; line level performance identical to the LM-AIO8E
  - Anti-pop relays on outputs for silent power-ups and power-downs
  - Seamless integration with the Aurora(n)'s mixing and routing engine
  - User-installable in the top position of module 1 or below the LT-USB or LT-TB3; the top position of module 1 is required for Dante and Pro Tools HD connection methods
  - Option module with no power connector of its own; powered by the host Aurora(n) chassis
