description: The Ashdown Rootmaster 112T EVO II is a 300-watt 1 x 12" bass
  cabinet at 8 ohms, driven by a specially crafted White Line 12" speaker for
  impeccable attack, clear clarity, and thunderous low-end. At just 12.2kg/26lbs
  it delivers heavyweight performance in a lightweight package, with an
  adjustable tweeter offering hi, low, or off settings. A top-mounted bar handle
  eases transport and stacking, genuine Neutrik Jack/Speakon combi jacks handle
  connectivity, and the Buffalo Tolex finish with black cloth grill gives a
  distinctive, durable look.
details: |-
  Super-lightweight 1 x 12" bass speaker cabinet in the Rootmaster EVO II range. It puts out 300 watts at 8 ohms through a specially crafted White Line 12" speaker engineered for attack, clarity, and low-end, weighing a mere 12.2kg/26lbs thanks to lightweight ply construction. An adjustable tweeter with three settings (hi, low, or off) tailors the top end. Practical touches include a top-mounted bar handle for transport and stacking and genuine Neutrik Jack/Speakon combi jacks, finished in Buffalo Tolex with a black cloth grill.
specs: |-
  - Power handling: 300 watts
  - Impedance: 8 Ohms
  - Speaker configuration: 1 x 12" White Line speaker
  - Adjustable tweeter: three-way switch (hi / low / off)
  - Weight: 12.2kg (26lbs)
  - Lightweight ply construction
  - Genuine Neutrik Jack/Speakon combi jacks
  - Top-mounted bar handle
  - Buffalo Tolex finish with black cloth grill
