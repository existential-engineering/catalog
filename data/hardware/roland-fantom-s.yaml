description: >-
  The Roland Fantom-S is a 61-note workstation keyboard released in 2003,
  designed as a complete solution for professional music production. It combines
  sampling capabilities with ROM-based synthesis, featuring 32MB expandable
  sample RAM, a 16-track sequencer, and multi-effects processing for studio and
  performance use.
details: |-
  The Fantom-S integrates both audio and MIDI by using ROM waves and sampling with realtime timestretch capability. The instrument supports WAV and AIFF format files and includes multisampling functions like Chop and Normalize that were previously limited to dedicated samplers. Users can expand onboard sounds through up to four wave expansion boards.

  The synthesizer earned praise for offering warm and realistic sounds expected from a Roland product. The 61-key keyboard features velocity and channel aftertouch sensitivity. A standout feature is V-LINK functionality, which allows real-time controllers to manipulate images during performance.

  The front panel incorporates a D Beam controller assignable as a pad trigger or monophonic synth voice. A large LCD with surrounding knobs and buttons dominates the center, with 16 velocity-sensitive pads on the right side. The expansion bay on the left accommodates additional hardware.

  The device includes 16MB flash RAM and supports optional SmartMedia cards. Sample memory begins at 32MB and is expandable to a maximum of 288MB.
specs: |-
  - 64-voice polyphony
  - 16-part multitimbral
  - 4 oscillators with ROM-based waveforms
  - Filter modes: 12dB slope, 24dB slope, High Pass, Low Pass, Band Pass, Comb, Resonance
  - 2 LFOs with Sample & Hold, sawtooth, sine, square, and triangle waveforms
  - 2 ADSR envelopes
  - 61-key keyboard with velocity and channel aftertouch
  - 16-track sequencer
  - Arpeggiator with 128 user and 128 rhythm patterns
  - 44.1kHz sampler with 32MB internal RAM, expandable to 288MB
  - 64MB wave memory
  - 16 velocity-sensitive pads
  - D Beam controller
  - V-LINK video control functionality
  - MIDI In/Out/Thru, USB, pedal jacks, audio outputs
  - SmartMedia card slot
