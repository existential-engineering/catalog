details: |-
  Axiom Pro 25 is a keyboard controller that includes trutouch action,
  proprietary hypercontrol MIDI mapping technology and other cutting-edge
  enhancements in a compact model designed for tight spaces.

  Hypercontrol automatically maps the keyboard's 28 controls to commonly
  accessed parameters in digital audio workstations as well as software
  instruments. The constant two-way link with the host DAW means the keyboard's
  controls are always in sync with a software application's active parameters.

  The graphic LCD constantly updates the current values, which ensures seamless
  editing and prevents parameter jumps even when plug-ins are closed. Toggle
  instantly between mixer and instrument control modes.

  Map buttons to send qwerty key commands right from the axiom pro 25. Save
  settings to 50 memory locations—each with four profiles of quick recall via
  the intuitive graphic LCD.
specs: |-
  - 25-note semi-weighted trutouch keybed
  - 28 controls
  - Hypercontrol MIDI mapping technology
  - Graphic LCD display
  - Two-way DAW link
  - Mixer and instrument control modes
  - 50 memory locations with four profiles
  - Qwerty key command mapping
  - Ascii keystroke support
  - Compatible with Pro Tools, Cubase, logic, and reason
