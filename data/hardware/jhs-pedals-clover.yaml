description: A FET preamp/boost based on the Boss FA-1 with a three-band EQ,
  three EQ mode settings, and an XLR output for direct use with acoustic,
  electric, or bass guitar.
details: |-
  In early 1984 BOSS released two strange new devices under the name "The Pocket Series". One of those devices was the FA-1 FET Preamp and it quickly found its rightful place among the legends of tone when The Edge of U2 used it on the recording of "Unforgettable Fire" as well as placing it in his following touring rigs. The Clover Preamp/Boost is our faithful interpretation of the FA-1 but with several additional features that we believe make this amazing circuit even better.

  The Clover has four standard controls and one rotary switch on the top. The Volume control allows you to set your volume at unity or as a boost to push your amp or dirt pedals. There are three EQ controls to give you tons of control to cut or boost Bass, Mids, and Treble. The rotary switch has three settings: Full EQ, No Mid, and No EQ.

  In addition to the standard 1/4" input and output, the Clover has an XLR output for using as an acoustic or bass preamp. These can be used individually or simultaneously. There is also a ground lift if you experience some hum when using the XLR output.
