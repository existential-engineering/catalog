description: Explore the Model 660 MG, featuring a charactered Maple cutaway
  body and vintage reissue-type pickups for exceptional sound.
details: |-
  The Model 660 and 660/12 feature a charactered Maple cutaway body based on
  an innovative design from the 1950's. A Rosewood fingerboard is punctuated
  beautifully with triangular pearloid inlay markers, while the maple double
  bound neck and body are solid through and through.

  Rickenbacker's trademark "checkered" black and white binding set off the
  body, while white binding graces the neck.

  The 660 is electronically engineered to the exacting standards of the
  vintage reissue series, complete with Rickenbacker's own vintage
  reissue-type pickups.
