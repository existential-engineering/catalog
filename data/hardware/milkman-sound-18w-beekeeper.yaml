details: |-
  18 watts of honey sweet tone

  ABOUT

  The Beekeeper is a single channel, low wattage amplifier inspired by the "tweed" era Bassman amplifier. In typical Milkman fashion, the focus of the circuit is on the pristine clean and punchy tones that ride the edge of saturation rather than high gain. The clean fatness of the B style amplifier is kept in place while the wattage, size and weight get reduced. The Beekeeper's custom Soursound transformer set utilizes the same winding structure as the venerable Triad 45249 transformer - easily the most defining component in the original 5F6 Bassman amplifier. The output transformer has been re-tooled to run a pair of 6V6 output tubes with cathode bias (rather than the original 5881 in grid bias) and the interleaving matches the original seven section buildup, contributing to its open top end, coupling efficiency, and airy response. 6V6 have more of a honey sweet tone and put out less wattage – they are the perfect tube to reduce a 45W circuit down to 18 watts. The Beekeeper will be aviable as a TV front 12" Combo with a Jupiter Ceramic or Alnico speaker, or as a TV front 4x8 with Jupiter Ceramic or Alnico speakers. Like all Milkman amplifiers, it is wired by hand with pushback cloth wire in San Francisco, CA with the highest quality components available. WATTAGE

  18W Class AB via 6V6 pair (cathode bias)

  SPEAKER

  12" Jupiter Ceramic, 8 ohm

  12" Jupiter Alnico, 8ohm

  4x8 Jupiter Ceramic 8ohm (2ohm total)

  4x8 Jupiter Alnico 8ohm (2ohm total)

  CONTROLS

  Volume, Treble, Midrange, Bass

  DIMENSIONS & WEIGHT

  12" Combo: 19-3/4" x 8-3/4" x 18" 32lbs

  4x8 Combo: 22" x 9-1/2" x 20-3/4" 37lbs

