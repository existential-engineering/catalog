description: >-
  The Yamaha V50 is a 4-operator FM synthesis workstation released in 1989, combining
  16-note polyphony with a built-in sequencer, drum machine, and dual effects processor.
  It shares its sonic engine with the DX11 and TX81Z, packaged in an all-in-one
  workstation format with a 3.5-inch floppy disk drive for storage. The DVA function and
  pitch delay make it particularly capable of generating percussive timbres and
  experimental ambient textures.
details: |-
  The V50 represents Yamaha's effort to create an integrated FM synthesis workstation. It leverages the sonic engine found in earlier models like the DX11 and TX81Z, offering similar 4-operator FM synthesis capabilities with 16-note polyphony across 8 parts.

  Notable characteristics include the DVA (Digital Voltage Amplifier) function and built-in voice-based pitch delay. These features excel at generating percussive timbres including short bass sounds, marimbas, and clavinets. The pitch envelope and pitch bender enable experimental ambient effects when operators are pitched high.

  The workstation includes a 16,000-note sequencer supporting 8 songs with 32-note polyphonic capacity, punch in/out recording, and both real-time and step programming modes. A dual effects processor with 16 different effects including distortion rounds out the onboard production capabilities.

  The V50 remains very rare yet affordable on the second-hand market, and benefits from pairing with external analog filters to enhance its digital FM character.
specs: |-
  - 5-octave touch-sensitive keyboard with pressure sensitivity
  - 16-note polyphony, 8 parts
  - 4-operator digital FM synthesis
  - 1 DVA envelope, 1 pitch envelope generator
  - 1 LFO
  - 2 effects units with 16 different effects
  - 100 preset voices, 100 user voices
  - 100 preset performances, 100 user performances
  - 16,000-note sequencer with 8 songs
  - 32-note polyphonic sequencer with punch in/out
  - Real-time and step programming
  - Integrated drum machine
  - 3.5-inch floppy disk drive
  - Backlit dual-line LCD display
  - MIDI control
