description: The Starclassic Maple snare drums combine incredible power with
  maple's intense and warm tone. Zinc die-cast hoops provide superior high-end
  "crack" and response.
details: |-
  Shells (All Maple): Exotic Finishes VGLM/VMMF 8ply Maple + 1 outer ply Movingui, 7mm LEWB/LNWB/LRWB 8ply Maple + 1 outer ply Pacific Walnut, 7mm Lacquer Finishes All Maple Shell 8ply, 7mm For the optimum transfer of vibrations from head to shell, a thinner shell is better. However, less thickness often equals less strength. Instead of simply making thinner shells by using fewer plies, TAMA slims down each ply and then cross laminates them into a 8ply 7mm. This combination results in a thinner shell that's actually stronger than others of greater thickness. Starclassic shells utilize maple, the most popular shell material today because of its warm clear sound.

  Bearing Edge: The shape of the edge is one of the most important factors which affect drum sound. Because the drumheads provide the important source of vibration, the shape of the contact point of the head and shell determines and defines the sound. This is why TAMA has worked so extensively on achieving the most functional shape for the drum head and edge. Picture shows a sectional view of the drum's bearing edge. As shown in Part A, the angle of the top edge is set 2.5mm inside from the outer surface of the shell. The edge is cut to a round collar so as to follow the natural shape of the drumhead (B). This design, which creates a better fit between the drumhead and bearing edge, maximizes the resonance of drum.This bearing edge shape is part of our TAMA tradition and is crucial in providing TAMA's unique drum sound.

  "Linear-Drive" Strainer (US.PAT.NO. 8017846): The "Linear-Drive" strainer is designed for greater control of the lever adjustment arm and more precise control of the strainer's deployment motion. The strainer movement works in a true linear motion. Even if the strainer is engaged rapidly, you will not hear the typical "slap" of the snare wires hitting the bottom drumhead. To prevent the snare wires from loosening, this strainer also has a ratchet system on its tension adjustment mechanism. Single click adjustments offer a vertical pull of 0.083mm in wire motion, which allows for ultra-sensitive micro adjustments.

  Shell Hardware Choice: When selecting professional drums, you want an appearance as distinctive as the sound. Starclassic Bubinga / Maple now offers the choice of shell hardware finished in Chrome, the Black Nickel, Smoked Black Nickel Plated. To order Starclassic Maple drums with Black Nickel Plated hardware simply add the letters "B". To order Starclassic Maple drums with Smoked Black Nickel Plated hardware simply add the letters "U".

  Super Sensitive Hi-Carbon Snare Wire: In order to provide a crisper and more sensitive sound, we redesigned our snappy snare using new materials and customizing the shape of the plate and the wire coil's winding pattern. As a result of these modifications, the new Super Sensitive Hi-Carbon Snappy Snare fits closer to the snare side head, providing greater sensitivity and a brighter, crisper sound.

  Die-Cast Hoops: Made of die-cast zinc, TAMA's die-cast hoops deliver an incredibly sharp, solid rim shot that cannot be found in any other hoop.
