url: https://dbxpro.com/en/products/di1
description: The dbx Di1 is a compact active direct injection box ideal for
  studios and live use, converting high-impedance instrument and line signals to
  balanced XLR output while rejecting noise. It operates on both +18V to +48V
  phantom power and a 9V battery, with ground lift, attenuation, and
  main/standby controls.
details: |-
  The dbx Di1 is a compact, high-quality active direct injection box designed for both studio and stage use. It connects electric guitars, bass amplifiers, keyboards, and similar instruments directly to console mixers without requiring microphones, delivering balanced, noise-free signals.

  The Di1 features two parallel 1/4" TS inputs alongside a parallel XLR input, giving maximum flexibility for different source connections. The balanced XLR output delivers a clean, professionally balanced signal to the mixing console. Ground lift, attenuation control, and main/standby switch provide essential tools for troubleshooting and noise management in complex stage environments.

  The unit operates on either +18V to +48V phantom power or a 9V battery, with separate LED indicators for battery and phantom power status. The frequency response extends to 70 kHz (-3 dB), ensuring transparent reproduction of even high-frequency instrument harmonics.
specs: |-
  - Input Impedance: >250 kΩ
  - Output Impedance: >600 Ω
  - Max Input Level (0 dB): +12 dBu
  - Max Input Level (-20 dB): +32 dBu
  - Max Input Level (-40 dB): +52 dBu
  - Output Noise: <-100 dB unweighted
  - THD: <0.005% at 1 kHz, 0 dBu
  - Frequency Response: 10 Hz – 70 kHz, +0 dB / -3 dB
  - Phantom Power: +18V to +48V DC
  - Battery Power: 9V battery
