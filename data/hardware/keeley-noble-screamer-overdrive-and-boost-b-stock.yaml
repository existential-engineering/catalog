details: |-
  This is the B-stock listing for the Noble Screamer Overdrive and Boost. The units are described as fully functional and covered by the maker's warranty, with the only difference being scuffed packaging, which the page says does not affect tone or performance.

  The Noble Screamer is a 4-in-1 overdrive and boost that combines two familiar drive circuits with two amp-like distortion voices. The tone-control section and the clipping section are each switchable, so the four combinations can be mixed, and the circuits are entirely analog rather than modelled. The control set stays at three knobs.

  Two tone-control circuits are available. With the Tone switch in the OD position a broad spectrum control runs from a flat EQ to one with boosted treble and bass response. In the TS position the control becomes a low-pass filter that rolls off the high frequencies only. Both styles of diode clipping are provided, hard clipping in the OD position for an edgier tone and soft clipping in the TS position, closer to a softly overdriven tube amplifier.

  The pedal carries a buffer for noise-free switching, and holding the footswitch for two seconds moves between true bypass (the LED flashes twice) and buffered bypass (the LED flashes three times). It is designed, engineered and manufactured in Oklahoma City and is the first Keeley pedal in the maker's aluminium enclosure.
specs: |-
  - Four overdrive and boost sounds, including two amp-like hybrid tones
  - Tone switch selects a broad spectrum tone control or a low-pass filter
  - Clipping switch selects hard or soft diode clipping
  - Silent buffered bypass or true bypass, changed by holding the footswitch for two seconds
  - All-analog signal path
  - Aluminium enclosure
  - Designed and manufactured in Oklahoma City, USA
  - B-stock unit with scuffed packaging, covered by the maker's warranty
