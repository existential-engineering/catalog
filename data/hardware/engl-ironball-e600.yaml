url: https://www.engl-amps.com/shop/combos/ironball-e600/
description: Four-channel 20 W all-valve guitar combo with a 12 inch Celestion
  Vintage 30, built-in reverb, a powersoak down to 1 W or speaker off, a
  headphone output and a balanced line output.
details: |-
  It's hard to believe how much you can fit into an amp in a compact lunchbox format. Twenty tube watts can still be mighty powerful, so with the Powersoak, the output power can be reduced to 1 watt, or the speaker can be completely deactivated, perfect for practicing with headphones or for recording sessions late at night.

  We've given the Ironball a frequency-corrected line output for this. The Master Volume Boost (M.V.B.) provides a footswitchable boost of the master volume, meaning you have a second master volume at your disposal.

  A Presence control and built-in reverb make this sound package ready, no matter whether you're headed to the stage or the studio.

  The combo runs four channels (Clean, Crunch, Soft Lead and Heavy Lead) from two EL84 output valves and four ECC83 (12AX7) preamp valves into a 12 inch Celestion Vintage 30 made in the UK, with a shared three-band EQ, a gain boost sound option and a valve-buffered serial FX loop.

  The powersoak steps through full power, 5 watts, 1 watt and speaker off, and channels, M.V.B. and reverb can be switched from the ENGL Z4 footswitch.
specs: |-
  - 4 channels: Clean, Crunch, Soft Lead, Heavy Lead
  - All-valve head section
  - Power soak: full power, 5 watts, 1 watt, speaker off
  - Headphones output
  - Valve-buffered serial FX loop
  - Master Volume Boost (M.V.B.)
  - Balanced line output, frequency corrected
  - Sound option: Gain Boost
  - Controls: Gain (Clean and Lead channels), 3-band EQ (shared), Reverb, Presence, Lead Volume, Master
  - Poweramp output: 1 x 8 ohm, 1 x 16 ohm, 2 x 8 ohm parallel
  - Footswitch: Z4 (channels, M.V.B., reverb)
  - Speaker: 12 inch Celestion Vintage 30, made in UK
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 2 x ENGL EL84
  - Output power: 20 W
  - Dimensions: 49 x 44 x 25 cm
  - Weight: 19 kg
