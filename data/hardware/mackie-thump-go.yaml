name: Thump GO
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/battery-powered/live-sound/thump_go.html
description: "Battery-powered loudspeaker that delivers professional live sound
  for concerts, events, road trips—wherever music goes."
details: |-
  A Little Thump Goes A Long Way. Battery-powered loudspeaker that delivers professional live sound for concerts, events, road trips—wherever music goes.

  No Power? No Problem: The removable lithium-ion battery pack is key to the ultra-portable, super-powerful design. Thump GO can deliver that signature 'thump' and clarity for up to 12 hours on a single charge.

  Ready to Go in Seconds: Music Ducking lowers the volume of channel 2 whenever you speak on channel 1. The Feedback Eliminator automatically cuts that unwanted squeal. Four application-specific voicing modes plus Outdoor mode tailor the sound to the situation.

  Getting Connected is Easy: Bluetooth streaming for wireless music from phones, a built-in 2-channel mixer with XLR/TRS combo inputs, and the Thump Connect 2 app for wireless control round out the connectivity.
specs: |-
  - Ultra-efficient 200W Class-D amplifier
  - 8" custom high-output woofer
  - 1" compression driver
  - GB-100 removable lithium-ion battery included
  - Up to 12 hours battery life per charge
  - Battery charges inside unit or via wall adapter
  - Supports spare GB-100 batteries (sold separately)
  - Feedback Eliminator mode
  - Music Ducking mode
  - Outdoor mode
  - Four voicing modes: Music, Speech, Monitor, Sub
  - Wireless Bluetooth streaming
  - Thump Connect 2 app control
  - EQ and custom presets via app
  - Dual speaker streaming (stereo/dual mono)
  - 2-channel digital mixer
  - Dual XLR/TRS combo inputs
  - Channel 1: switchable mic/line level
  - Channel 2: 3.5mm stereo aux input
  - XLR mix output for chaining
  - Dimensions: 18 x 9.1 x 11.2 in (457 x 230 x 285 mm)
  - Weight: 17.6 lb (8 kg)
  - Powder-coated steel grille
  - Compatible with ThumpSub GO
