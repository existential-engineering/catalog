description: Mackie Thump GO is an 8" portable battery-powered Bluetooth
  loudspeaker that delivers clear, punchy sound for a variety of performances
  and live events.
details: |-
  Thump GO is a battery-powered loudspeaker that delivers professional live sound for concerts, events, road trips, wherever music goes. The removable lithium-ion battery pack is key to the ultra-portable, super-powerful design, delivering that signature thump and clarity for up to 12 hours on a single charge.

  Thump GO has an integrated Music Ducking mode that lowers the volume of channel 2 whenever you speak on channel 1, so you can make announcements without messing with gain levels on the mixer or your equipment. A Feedback Eliminator mode automatically cuts unwanted squeal.

  Thump GO has powerful audio processing under the hood with four application-specific voicing modes, plus a dedicated Outdoor mode for ideal sound at beach weddings, spontaneous DJ sets in the desert and similar open-air shows.

  Easily stream music wirelessly from your phone to Thump GO via Bluetooth. You can even stream to two speakers at once, in stereo or dual mono. The built-in mixer has two XLR/TRS combo input jacks for easy plug-and-play, plus a 3.5 mm aux input on channel 2 for streaming from laptops, phones and other playback devices.

  Pair your phone via Bluetooth and control Thump GO with the Thump Connect 2 app. You can adjust anything from EQ and voicing modes to channel levels and custom presets. Connect to two Thump GO speakers at once to control both from a single app.
specs: |-
  - Ultra-efficient 200W Class-D amplifier
  - 8" custom high-output woofer
  - 1" compression driver
  - GB-100 removable lithium-ion battery included, up to 12 hours on a single charge
  - Battery charges inside unit or with included wall adapter
  - Swap with a spare GB-100 battery (sold separately) to extend battery life
  - Feedback Eliminator mode
  - Music Ducking mode automatically lowers channel 2 when channel 1 receives signal
  - Outdoor mode
  - Four application-specific voicing modes: Music, Speech, Monitor and Sub
  - Bluetooth streaming; stream to a second Thump GO in stereo or dual mono
  - Thump Connect 2 app with EQ, voicing modes and more
  - 2-channel digital mixer built in
  - Dual XLR / TRS combo inputs; first channel switchable between mic and line level
  - Second channel includes 3.5 mm stereo aux input
  - XLR mix output for chaining signal to another speaker
  - Dimensions: 18 x 9.1 x 11.2 in / 457 x 230 x 285 mm
  - Weight: 17.6 lb / 8 kg
  - Rugged, powder-coated steel grille
  - Compatible with ThumpSub GO
