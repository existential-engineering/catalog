description: A compact, lightweight 2-octave MIDI percussion mallet controller
  using FSR sensing technology, expandable to 4 octaves, with 127 programmable
  setups and splitting, layering, and hang modes. An optional GS Extended
  internal sound module version is also available.
details: |-
  PLEASE NOTE:

  There is currently a 2 week lead time on all controller only purchases

  There is an 2 week lead time on GS Extended Internal Sound Units

  No Built In Sounds (Controller Only) - The Express offers a compact and lightweight 2-octave design which can be expanded to 4 octaves. The malletKAT is the world's most powerful MIDI percussion mallet controller using true FSR sensing technology. It incorporates the same FSR technology as all of the KAT instruments, delivering superb feel and response. With 127 programmable setups and features like splitting, layering, poly/mono and "hang" modes, the malletKAT is an incredibly expressive and powerful alternative to traditional marimba and vibraphone instruments. We offer a 90 Day warranty for LABOR. All controllers are BUILT TO ORDER. Unit dimensions: 32" X 11" X 2.5"
  Weight: 9 lbs. The following features/accessories now ship "standard" with the malletKAT:

  About pre-configured sound modules:

  The 128 User Kits inside the malletKAT can be pre-configured for immediate use with the GIGKAT 2 or GIGKAT GS Extended sound modules. If you purchased one of these sound modules separately and would like your instrument to include pre-configured firmware, please include this in the comments when placing your order. With GS Extended Built In Sounds - The malletKAT Express GS EXT - in a 2 octave lightweight white textured frame - is the world's most powerful MIDI percussion mallet controller using true FSR sensing technology. The GS EXT model contains the same newly designed GS EXT amp and sound board used in our gigKAT GS EXT for true plug-and-play operation. We have even added controller features, up to 4 CC# per kit. The malletKAT Express offers a standard lightweight 2-octave design which can be expanded to 4 octaves. It incorporates the same FSR technology as all of the KAT instruments, delivering superb feel and response. With 127 programmable setups and features like splitting, layering, poly/mono and "hang" modes, the MalletKAT is an incredibly expressive and powerful alternative to traditional marimba and vibraphone instruments. Dimensions: 32" X 11" X 2.5"
  Weight: 9 lbs. We offer a 90 Day warranty for LABOR. All controllers are BUILT TO ORDER . **iOS compatibility requires an Apple Lightning to USB 3 Camera Adapter (sold separately)
  **Android compatibility requires a USB converter cable (sold separately)
specs: |-
  - Clambusters - to help silence the occasional "missed note"
  - Direct connection to your computer, DAW, phone** or tablet** apps with a MIDI-to-USB cable (sold separately)
  - Standard 5-pin MIDI cable - for direct connection to your external synth or audio card
  - Sustain pedal
  - Footswitch for configuring your personal sound directly on the malletKAT
