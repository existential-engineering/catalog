details: |-
  The M55 hanging ceiling microphone system is designed for applications where aesthetics, sound quality, and ease of installation are critical. The primary applications for the ceiling-mounted M55 include Video and Teleconference (VTC), distance learning, hospital rooms, surveillance, and ambient room miking.
  The M55 conferencing microphone accommodates interchangeable capsules with cardioid, hypercardioid, omnidirectional, and supercardioid (shotgun) coverage patterns. All electronics are fully integrated with high sensitivity and low noise. The signal output is balanced to eliminate RF interference caused by cell phones and mobile devices.
  Installing the M55 hanging microphone requires drilling just one 5/8-inch hole in the ceiling, with no additional tools needed. The M55's mounting hardware easily adjusts the hanging height up to four feet from the ceiling surface without removing ceiling tiles. An optional aiming clip (MCHANGER) easily makes any additional angular adjustments. The cable assembly, with a terminal block connector, is neatly housed in an airtight, plenum-rated junction box. A wire safety cable provides additional seismic restraint.
  Designed, machined, assembled, and tested by AUDIX in the USA.
specs: |-
  - Hanging ceiling / conferencing microphone
  - Interchangeable capsules: cardioid, hypercardioid, omnidirectional, supercardioid (shotgun)
  - Fully integrated electronics, high sensitivity, low noise
  - Balanced output via terminal block connector in plenum-rated junction box
  - Adjustable hanging height up to four feet from ceiling
