details: |-
  The Marantz Horizon is a reference wireless speaker powered by HEOS, combining innovative proprietary amplification with powerful driver technology to deliver a superior listening experience through an intuitive interface.

  Key technologies include the Marantz Rise Amplifier (GaN FET topology), Marantz Radiance 360-degree seamless fabric, Marantz AuraControl, Marantz Mirage DSP, and Marantz Gravity bass driver. The amplifier delivers 310W FTC, 745W peak, and 1160W peak raw power into a driver array of one 6.5-inch bass driver, three 2-inch wideband drivers, and two 1-inch high-frequency drivers. Frequency response is 30Hz to 20kHz (+/-3dB), extending to 22Hz at -10dB, with maximum SPL of 104dB and peak SPL of 114.5dB measured at 1 meter.

  Wireless connectivity covers dual-band Wi-Fi 6 (802.11 a/b/g/n/ac/ax), Bluetooth 5.4, AirPlay 2, and Spotify Connect, alongside HEOS multi-room streaming. Supported music services include Pandora, Spotify, TuneIn, SiriusXM, Amazon Music, TIDAL, iHeartRadio, Deezer, Deezer HiFi, Mood:Mix, Sony Hi-Res, AWA, Play, and SoundCloud. Decoding covers Dolby Atmos, Dolby TrueHD, DSD, Dolby Digital Plus, Dolby Digital, and LPCM, with PCM support up to 192kHz/24-bit (stereo and 7.1 multichannel) and DSD up to 5.6 MHz.

  Physical inputs comprise one TOSLINK optical digital input, one pair of RCA stereo analog inputs, one HDMI eARC/ARC port, one USB-C mass storage port, and Ethernet. User controls include volume up/down, play/pause, a multi-colored LED status indicator, and rear-panel Connect and Bluetooth buttons. Available in Midnight Sky, Moon Ray, and Marantz Champagne. Dimensions are 14.33 inches H by 8.27 inches W by 15.26 inches D (364 by 210 by 387.5 mm), weight 27.5 lbs (12.5 kg). Box contents include a Certificate of Authenticity, Quick Start Guide, power cable, and HDMI cable.

  Recognized with the Wallpaper Design Award 2025, iF Design Award 2025, and Red Dot Design Award 2025.
specs: |-
  - Total Power (FTC): 310W
  - Peak Power: 745W
  - Peak Raw Power: 1160W
  - Amplifier Topology: Marantz Rise GaN FET
  - Bass Driver: 1 x 6.5-inch Marantz Gravity
  - Wideband Drivers: 3 x 2-inch
  - High Frequency Drivers: 2 x 1-inch
  - Frequency Response: 30Hz to 20kHz (+/-3dB), 22Hz (-10dB)
  - Maximum SPL: 104dB (1M)
  - Peak SPL: 114.5dB (1M)
  - Analog Input: 1 pair RCA L/R
  - Digital Input: 1 TOSLINK Optical
  - USB: 1 USB-C (Mass Storage)
  - HDMI: 1 eARC/ARC
  - Ethernet: Yes
  - Wireless: Dual-band 802.11 a/b/g/n/ac/ax (Wi-Fi 6)
  - Bluetooth: 5.4
  - Streaming: AirPlay 2, Spotify Connect, HEOS
  - Decoding: Dolby Atmos, Dolby TrueHD, DSD, Dolby Digital+, Dolby Digital, LPCM
  - PCM Support: Up to 192kHz/24-bit stereo and 7.1 multichannel
  - DSD Support: Up to 5.6 MHz (DSD x2)
  - File Formats: WMA (192kbps), AAC/MP3 (320kbps), WAV, ALAC, FLAC (24-bit/192kHz), DSD (2.8/5.6 MHz)
  - Music Services: Pandora, Spotify, TuneIn, SiriusXM, Amazon Music, TIDAL, iHeartRadio, Deezer, Deezer HiFi, Mood:Mix, Sony Hi-Res, AWA, Play, SoundCloud
  - User Controls: Volume up/down, Play/Pause, Multi-colored LED status, Connect button (rear), Bluetooth button (rear)
  - Colors: Midnight Sky, Moon Ray, Marantz Champagne
  - Dimensions: 14.33 in H x 8.27 in W x 15.26 in D (364 x 210 x 387.5 mm)
  - Weight: 27.5 lbs (12.5 kg)
  - Included: Certificate of Authenticity, Quick Start Guide, Power Cable, HDMI Cable
