description: The Marantz Horizon is a reference wireless speaker powered by
  HEOS, combining innovative proprietary amplification with powerful driver
  technology to deliver a superior listening experience through an intuitive
  interface. Built around the Marantz Rise GaN FET amplifier, Marantz Radiance
  360-degree seamless fabric, Marantz AuraControl, and Marantz Mirage DSP,
  Horizon delivers 310W FTC (745W peak) into a multi-driver array featuring a
  6.5-inch Marantz Gravity bass driver, three 2-inch wideband drivers, and two
  1-inch high-frequency drivers. The speaker streams over Wi-Fi 6 (802.11
  a/b/g/n/ac/ax), Bluetooth 5.4, AirPlay 2, Spotify Connect, and HEOS, with
  native support for Pandora, Spotify, TuneIn, SiriusXM, Amazon Music, TIDAL,
  iHeartRadio, Deezer, Deezer HiFi, Mood:Mix, Sony Hi-Res, AWA, Play, and
  SoundCloud. Physical connectivity includes a TOSLINK optical input, RCA stereo
  analog input, HDMI eARC/ARC, USB-C for mass storage, and Ethernet. Available
  in Midnight Sky, Moon Ray, and Marantz Champagne finishes. Recognized with the
  Wallpaper Design Award 2025, iF Design Award 2025, and Red Dot Design Award
  2025.
details: |-
  The Marantz signature sound, embraced by music lovers and critical listeners around the world, is synonymous with texture, nuance, and authenticity. It's a sound like no other.

  Elements of the iconic Marantz design ethos are strikingly reimagined and complemented with luxurious materials to create Marantz Horizon's unique yet timeless silhouette.

  Marantz Horizon features Marantz Radiance 360 Seamless Fabric. This engineering feat balances a seamless, luxurious feel, visual impact, durability, and acoustic transparency.

  The Marantz Rise Amplifier is the next generation of Marantz amplification. It quickly and accurately amplifies audio signals for a superior listening experience. The Marantz Gravity Drivers use neodymium magnets to ensure powerful, distortion-free sound.

  The optional tripod stand, elegantly crafted from American walnut and robust cast iron with a luxurious satin black finish, and designed to achieve the ideal listening height, perfectly complements Marantz Horizon's luxurious materials.

  HEOS has a search feature that lets you find and stream from the world's leading music platforms, including TIDAL, Pandora, and Amazon Music HD. Devices Powered by HEOS allow you to control multiple rooms, all with the HEOS app.
specs: |-
  - Total amplifier power (FTC): 310W
  - Total amplifier power (peak): 745W (not tested under the FTC standard)
  - Total amplifier power (peak, raw amplifier power): 1160W (not tested under the FTC standard)
  - Amplifier topology: Marantz Rise GaN FET
  - Bass driver: 1 x 6.5 in Marantz Gravity
  - Wideband drivers: 3 x 2 in
  - High frequency drivers: 2 x 1 in
  - Frequency response: 30Hz to 20kHz (+/-3dB), 22Hz (-10dB)
  - Maximum SPL: 104dB (1m)
  - Peak SPL: 114.5dB (1m)
  - Analog audio: 1 pair RCA L/R
  - Digital audio: 1 x TOSLINK optical
  - USB: 1 x USB-C (mass storage)
  - HDMI: 1 x eARC / ARC
  - Decoding: Dolby Atmos, Dolby TrueHD, DSD, Dolby Digital+, Dolby Digital, LPCM
  - Max PCM sample rate / bit depth: stereo 192kHz / 24 bit, multi-channel 192kHz / 24 bit (7.1 channel)
  - Max DSD data rate: 5.6 MHz (DSD x2)
  - Stereo file formats (HEOS network share or USB): WMA up to 192 kbps, AAC and MP3 up to 320 kbps, WAV, ALAC and FLAC up to 24-bit/192kHz, DSD 2.8 MHz and 5.6 MHz
  - Bluetooth: BT 5.4
  - AirPlay 2
  - Spotify Connect
  - Wired connectivity: Ethernet
  - Wireless connectivity: dual band 802.11 a/b/g/n/ac/ax
  - Control system compatibility via TCP/IP: Crestron, Control4, AMX
  - HEOS app: iOS, Android, Kindle Fire
  - USB storage device playback: FAT32 and NTFS formatted drives
  - NAS: network share, UPnP
  - Product colors: Moon Ray, Midnight Sky, Marantz Champagne
  - In the box: Certificate of Authenticity, quick start guide, power cable, HDMI cable
  - User interface: volume up/down, play/pause, multi colored LED status indicator, connect button (rear), Bluetooth button (rear)
  - Dimensions (H x W x D): 14.33 x 8.27 x 15.26 in (364 x 210 x 387.5 mm)
  - Weight: 27.5 lbs (12.5 kg)
