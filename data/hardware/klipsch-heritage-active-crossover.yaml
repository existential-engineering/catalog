id: -xeY_ANuripNZKLhz189L
name: Heritage Active Crossover
manufacturer: klipsch
primaryCategory: outboard
url: https://www.klipsch.com/products/heritage-active-crossover
description: The Heritage Active Crossover is a DSP active crossover network
  designed specifically for Klipschorn AK7 and La Scala AL6 loudspeakers,
  delivering time and phase alignment, balanced EQ, and true-to-source response.
  Tuned by acoustician Roy Delgado, it builds on technology from the Klipsch
  Jubilee and offers user-adjustable LF and HF gain controls.
details: |-
  For over 75 years, the Klipschorn and La Scala have set the standard for high-efficiency home audio. The Heritage Active Crossover takes their performance to the next level with cutting-edge DSP active crossover technology designed specifically for the Klipschorn AK7 and La Scala AL6 models.

  Available in two distinct versions — one tuned for the Klipschorn AK7 and one for the La Scala AL6 — each uses advanced DSP to precisely manage crossover points, ensuring seamless transitions between frequency bands while preserving the power, detail, and realism these speakers are known for.

  The unit offers user-adjustable Low-Frequency (LF) and High-Frequency (HF) gain controls, allowing listeners to fine-tune the system for optimal performance across different audio setups. Input options include an Auto Power Switch, Balanced/Unbalanced Input Switch, and a -9–0 dB Pad Switch.

  Utilizing advanced signal processing, the Heritage Active Crossover delays signals to individual drivers, ensuring all frequencies arrive at the listener's ears in perfect alignment. The result is an immersive listening experience with unparalleled time and phase coherence.
