details: |-
  The Pro-Mod San Dimas Bass PJ V pairs a San Dimas Bass-shaped alder body in a gloss finish with a bolt-on caramelized maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 20 jumbo frets, cream dot inlays, and Luminlay side dots, all anchored by a 1.75" Graph Tech TUSQ XL nut and a 34" scale length.

  Electronics are built around a versatile PJ configuration: a Charvel 5-String Split-Coil P at the middle position and a DiMarzio Area J DP551 at the bridge, routed through active/passive electronics with a push/pull selector that eliminates the risk of losing sound due to a dead battery. Controls include volume (push/pull active/passive selector), blend, and a 3-band EQ (active only).

  Hardware includes a Charvel HiMass bridge, Charvel open-gear tuning machines, chrome finish, dome-style control knobs, and vintage-style disc string trees. The licensed Fender Precision Bass headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel complete a thoroughly modern high-performance platform.
