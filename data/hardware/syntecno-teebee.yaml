description: >-
  The Syntecno TeeBee is a monophonic analog synthesizer designed as a dedicated Roland
  TB-303 bass line emulator with additional features. It features a single VCO with
  sawtooth and square waveforms, an 18dB 2-pole filter, ring modulator, external audio
  input, and CV/Gate connectivity. The unit can also serve as an external audio filter for
  processing drum loops, vocals, and other sound sources.
details: |-
  The Syntecno TeeBee is a hardware 303 acid emulator that faithfully recreates the iconic squelchy bass tones of the Roland TB-303. Its control layout mirrors the original with tuning, cutoff, resonance, envelope modulation, and decay knobs, while adding modern conveniences like MIDI control with velocity sensitivity and SysEx parameter access.

  Beyond simple 303 emulation, the TeeBee distinguishes itself with a built-in ring modulator and an external audio input, allowing it to function as a powerful filter processor for external sound sources such as drum loops and vocals. While it lacks the TB-303's signature slide effect in its built-in sequencer, slide effects can be controlled externally through MIDI.

  The unit offers flexible connectivity options including MIDI in/out, Roland DIN Sync for integration with vintage Roland gear, and CV/Gate in/out for controlling or being controlled by modular and other analog synthesizers. It is regarded as one of the better TB-303 emulators available, comparable in quality to the Novation Bass Station.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth and square waveforms)
  - Filter: 18dB 2-pole with cutoff, resonance, envelope modulation, and decay
  - Modulation: Ring modulator
  - Sequencer: Built-in simple sequencer
  - Control: MIDI in/out, Roland DIN Sync, CV/Gate in/out
  - External Audio Input: Yes
  - MIDI: Velocity sensitive with full SysEx parameter control
  - Keyboard: None
  - Memory: None
