details: |-
  The PRS SE DGT Standard brings David Grissom’s signature model to a stripped-down, all-mahogany platform, delivering organic tone, rich resonance, and bold midrange presence. Built with a solid mahogany body and neck, the SE DGT Standard adds warmth and growl to the model’s signature clarity and articulation. Like the SE DGT, the SE DGT Standard offers a versatile control layout with individual volume controls for each pickup, a master tone control with push/pull coil tapping, and a satisfyingly smooth and responsive PRS tremolo. Moon inlays and two timeless finishes—McCarty Tobacco Sunburst, and Vintage Cherry—give this guitar an understated elegance that’s ready for the stage or studio. Whether you’re chasing vintage character, flexible tone, or modern reliability, the SE DGT Standard offers it all in a guitar designed to be played.
