description: >-
  The Ensoniq EPS is a performance-oriented 13-bit sampler with variable polyphony up to
  20 voices, 8-part multitimbrality, and the ability to load samples while playing.
  Released in 1988, it bridges sampling, synthesis, and live performance with dedicated
  instrument-switching buttons and an integrated sequencer.
searchTerms:
  - Ensoniq Performance Sampler
details: |-
  The EPS (Ensoniq Performance Sampler) was designed not just as a studio production tool but as a powerful live performance instrument. Its standout feature is the ability to load new samples while continuing playback, along with support for stacking up to 8 instruments and switching patches on the fly, making it exceptionally practical for stage use.

  The sampler section captures audio through a 13-bit A/D converter with 16-bit D/A stereo output, offering variable sample rates from 6.25kHz to 52kHz. Polyphony scales with the sample rate: 12 voices at 52kHz, 16 at 39kHz, and 20 at 31.2kHz. Sample time ranges from 5 seconds at the highest rate to 41 seconds at the lowest. Each WaveSample has an independent dynamic digital filter with multimode lowpass or variable-width bandpass options.

  The VCA section features 6-stage envelopes with preset templates for quick sound shaping. An 8-track sequencer with an 80,000-note capacity handles arrangement and composition duties. The 61-key keyboard provides velocity and aftertouch sensitivity for expressive playing. With 512KB of internal memory expandable up to 2.1MB via expanders, MIDI connectivity, disk drive, and SCSI interface, the EPS offered a comprehensive sampling platform at a competitive price point.

  The EPS gained popularity among a wide range of musicians, including notable users such as RZA of Wu-Tang Clan and filmmaker-composer John Carpenter, demonstrating its versatility across genres from hip-hop production to film scoring.
specs: |-
  - Polyphony: 12 voices at 52kHz; 16 at 39kHz; 20 at 31.2kHz
  - Multitimbral: 8 parts
  - Sampler: 13-bit A/D mono input, 16-bit D/A stereo output
  - Sample Rates: 6.25kHz to 52kHz
  - Sample Time: 5 seconds (52kHz) to 41 seconds (6.25kHz)
  - Filter: Independent dynamic digital filter per WaveSample (lowpass or bandpass)
  - VCA: 6-stage envelope with preset templates
  - Sequencer: 8 tracks (80,000 note capacity)
  - Keyboard: 61 keys (velocity and aftertouch)
  - Memory: 512KB (expandable to 2.1MB with 4x expander)
  - Control: MIDI, disk drive, SCSI
  - Weight: 29 lbs (13 kg)
