url: https://sonicware.jp/products/liven-texture-lab
description: LIVEN Texture Lab is a granular synthesizer and effects processor
  with a step sequencer. It samples, slices, and reconstructs audio into new
  sounds, doubles as a real-time granular effects processor on the line inputs,
  and includes six shimmer reverbs and a freeze function.
details: |-
  LIVEN Texture Lab is a granular synthesizer and effects processor with a sequencer for creating entirely new sounds. It samples, slices, transforms, and reconstructs audio to synthesize completely new sounds, and works as a granular synthesizer with a granular effects processor mode. Shimmer reverb builds fantastical, majestic sounding spaces, and a 128-step sequencer with parameter locking drives it all. World-famous sound designers have provided presets as results of their experiments.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - Granular processor
  - Synthesizer mode: Sampling up to 6 seconds per sample (16bit - 32kHz mono)
  - Maximum polyphony: 4 voices (Up to 16 grains per voice, internal sequencer records up to 3 voices of polyphony)
  - Effects processor mode: Real-time processing of stereo signals from the line inputs
  - Freeze function
  - 6 high-quality Shimmer reverbs: Hall Reverb, Room Reverb, Arena Reverb, Plate Reverb, Tunnel Reverb, Infinity Reverb
  - Sequencer: 1 track, up to 128 steps, 128 patterns, Parameter locking features
  - I/O : MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT , headphone out
  - Size : 11.7 inch (W) x 6.92 inch (D) x 1.89 inch (H), 297mm (W) x 176mm (D) x 48mm (H)
  - Weight : 1.74lb., 790g
  - Accessories: Warranty
  - Power supply: AA batteries x 6, or 9V DC output AC adapter (1A or higher, EIAJ3 standard inner diameter 1.7mm outer diameter 4.75mm, center +) *The AC adapter is not included.
