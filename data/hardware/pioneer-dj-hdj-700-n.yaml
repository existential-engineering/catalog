description: |-
  Whether you're DJing at home, in the club or auditioning your music on the go, the HDJ-700s are a versatile companion.

  Taking inspiration from our top-flight range, they are fine-tuned to reproduce rich, clear mid to low frequencies – and feature spin-finished aluminium hinges, a lightweight build, rotatable ear cup, and a sleek, stylish design.
details: |-
  ### Optimised for dance music

  The HDJ-700s have narrow ear pads and 40 mm driver units with rare earth magnets to give you a powerful bass and great sound insulation. A 19 µm diaphragm and copper-clad aluminium wire (CCAW) voice coil accurately reproduce kicks and snares.

  ### Solid build

  A rigid, stainless steel headband and 2 interchangeable side-mount cords - one 1.2-metre coiled cord (3 m extended length) and one 1-metre straight cord – ensure a long life of service.

  ### Comfortable fit

  The soft and textured polyurethane ear cups ensure a snug, comfortable fit – even during long DJ sets.

  ### 60-degree rotating arm

  Rotate the right earpiece by up to 60 degrees for easy one-ear monitoring, and grab the handy grip to quickly put the cup back to its original position.
