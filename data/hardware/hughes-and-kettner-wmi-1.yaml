name: WMI-1
manufacturer: hughes-and-kettner
primaryCategory: midi
categories:
  - remote-controlled
url: https://hughes-and-kettner.com/product/wmi-1/
description: The Hughes & Kettner WMI-1 enables you to wirelessly remote control
  all of the functions found in the GrandMeister app for iPad. Even on stages or
  in rehearsal rooms where Wi-Fi is not available, the WMI-1 creates its own
  Wi-Fi network!
details: |-
  The WMI-1 features two MIDI inputs and one MIDI output. It is easily connected in-between the GrandMeister and the FSM 432 MK III footswitch, and the GrandMeister even provides the WMI-1 with phantom power.

  To use the WMI-1, all you need to do is to select the WMI-1 as a Wi-Fi network in the Wi-Fi settings of your iPad, or connect it to your home network using the WPS function.
specs: |-
  - Wireless MIDI interface, creates its own Wi-Fi network
  - Connects to an iPad as a Wi-Fi network, or to a home network via WPS
  - Phantom powered by the amplifier, no separate power supply
  - Voltage: 9-25 V DC
  - Dimensions: 44 x 33 x 82 mm
  - Weight: 88.0 g
  - Connectivity: 2x MIDI In, 1x MIDI Out
  - Cable length: 20 cm
  - Works with any Hughes & Kettner amp featuring a 7-pin MIDI input (phantom powered) and any iPad app supporting CoreMIDI
  - For iOS only, not supported by Android
