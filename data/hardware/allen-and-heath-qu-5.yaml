url: https://www.allen-heath.com/hardware/qu/qu-5-qu-5d/
description: Compact 38in/24out 96kHz digital mixer with a 96kHz XCVI core for
  DEEP Processing capabilities, fully flexible patching across 4 customisable
  layers, a redesigned user interface, and optional Dante (Qu-5D).
details: |-
  The new Qu retains the much-loved appearance and form factor of the original Qu series, but with multiple hardware improvements to elevate the sonic performance and mixing experience. Updated microphone preamps and high-performance 96kHz AD/DA converters combine to deliver pristine audio to and from the XCVI core, preserving every detail of the source.

  Every channel now features a channel display - showing channel name, channel type, or socket number - and a chromatic channel meter for at-a-glance level information, and the new touchscreen accommodates a completely redesigned user interface. The Qu-5D adds a 16x16 Dante interface at 96kHz or 48kHz for integration into larger systems or installs.

  Every Qu model is packed with versatile recording and playback options, with an integrated 32x32 USB-C audio interface, 32-channel multitrack support via SD card, and simple stereo recording and playback through the USB-A port. Thanks to its SLink port, Qu can be connected to the Everything I/O family of rack and stage box expanders, or directly to other Allen & Heath consoles with up to 128x128 channels of 96kHz audio available for patching.

  Qu is DEEP Processing ready, bringing acclaimed add-ons from the flagship dLive system to the Qu platform for the first time. It also features Feedback and Gain Assistants from the CQ series to streamline soundchecks, plus a 32-channel Automatic Mic Mixer (AMM) for conferences, panel talks, and TV shows - fully integrated with no extra latency.

  The original Qu series was well loved for its ease and speed of use. The new Qu maintains a focus on "walk up and mix" usability while adding 4 fully customisable layers, more assignable SoftKeys for workflow optimisation, and flexible routing options in addition to the classic 1:1 Qu routing, accessible via a newly developed, fast and responsive user interface.
