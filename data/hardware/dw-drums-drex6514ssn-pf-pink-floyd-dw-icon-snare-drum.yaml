description: The Pink Floyd DW Collector's Series Icon was created to pay homage to legendary DW artist, Nick Mason.
details: |-
  Nick Mason joined the DW family in 1993. His Icon snare drum is a 6.5x14″ 10-ply Collector's Series Maple HVLT (Vertical Low Timbre with a horizontal outer ply).

  Each drum is protected with clear gloss lacquer and includes Collector's Series snare drum standard features such as the MAG throw-off system with 3P (3-position) butt-plate, True-Hoops, True-Tone snare wires, True-Pitch tuning, and DW Heads by Remo USA.

  Also included are a premium DW snare bag, certificate of authenticity, and a legend that describes the woods used for each specific drum.
specs: |-
  - 10-ply Maple HVLT shell
  - Laser-cut, hand-inlayed graphics made with Basswood, Ebony, and Maple
  - Black nickel hardware
  - MAG throw-off with 3P butt plate
  - True-Hoops, True-Tone snare wires, True-Pitch tuning
  - Limited to 250 drums worldwide
  - Size: 6.5x14
