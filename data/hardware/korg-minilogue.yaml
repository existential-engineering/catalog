description: >-
  The Korg Minilogue is a four-voice polyphonic analog synthesizer featuring two VCOs per
  voice, a switchable 2-pole/4-pole filter, and a 16-step polyphonic sequencer. Released
  in 2016, it was Korg's first keyboard-equipped polyphonic analog synthesizer since the
  Poly-800 MKII in the 1980s. Its compact form factor, 37 slim keys, and 41 dedicated
  panel controls make it accessible for both studio and live performance.
details: |-
  The Minilogue marked a significant moment in Korg's history as their first fully analog polyphonic keyboard synthesizer in over three decades. Combining a futuristic and retro aesthetic with a solid wood back panel, it delivers hands-on control through 14 metal paddle switches and 29 black plastic dials covering tempo, pitch, oscillator shape, ADSR envelopes, voice mode depth, resonance, and filter cutoff.

    Each of the four voices features two VCOs capable of generating sawtooth, square, triangle, and noise waveforms. The filter section offers both 12dB (2-pole) and 24dB (4-pole) slopes with resonance, while eight voice modes including mono, poly, unison, and duo provide versatile sound design options. A small OLED display shows parameter values, patch names, and doubles as a real-time oscilloscope for visual feedback of the sound.

    The built-in 16-step polyphonic sequencer can automate up to four parameters simultaneously, making it useful for creating evolving sequences and animated patches. An assignable slider replaces traditional pitch and modulation wheels, with 29 available destinations. The Minilogue ships with 100 factory presets and supports 100 user programs, with connectivity including MIDI in/out, USB, sync in/out, audio input, audio output, and a headphone jack.
specs: |-
  - Polyphony: 4 voices
    - Multitimbral: 4 parts
    - Oscillators: 2 VCOs per voice
    - Waveforms: Sawtooth, Square, Triangle, Noise
    - Filter: 12dB (2-pole) and 24dB (4-pole) with resonance
    - LFO: 1 with Sawtooth, Square, Triangle waveforms
    - Envelopes: 2 ADSR
    - Voice Modes: 8 (Mono, Poly, Unison, Duo, and more)
    - Sequencer: 16-step polyphonic with 4-parameter automation
    - Keyboard: 37 velocity-sensitive slim keys
    - Memory: 100 factory presets, 100 user programs
    - Controls: 41 dedicated panel controls (14 metal switches, 29 dials)
    - Display: OLED with oscilloscope mode
    - Connectivity: MIDI In/Out, USB-B, Sync In/Out, Audio In, Audio Out, Headphones
    - Weight: 6 lbs
