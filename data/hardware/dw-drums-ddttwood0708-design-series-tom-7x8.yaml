details: |-
  The DW Design Series raised the bar for DW and made custom-style drums available to more drummers than ever before. The Design Series features 100% North American maple shells that utilize HVLT (Vertical Low Timbre shell with a horizontal outer ply) construction for warm punch with satisfying resonance.

  This mounted tom features a 7-ply maple shell, mini-turret lugs, and an STM mount (Suspension Tom Mounts).
