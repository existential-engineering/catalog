details: |-
  The Martin D-45 is the pinnacle of acoustic elegance and craftsmanship, trusted by legendary artists and discerning everyday players alike. Joining the all-new OM-45 as one of the most ornate and prestigious models in the Standard Series lineup, the D-45 features stunning abalone pearl inlay throughout, adorning the top, sides, and back.

  Its Dreadnought body size delivers the bold, projective tone with strong bass, clear trebles, and rich overtones that Martin Dreadnoughts are known for, perfectly balanced for all playing styles. Handcrafted with a solid spruce top and solid East Indian rosewood back and sides, the D-45 produces a resonant, powerful voice.

  The gloss genuine mahogany neck, with a Golden Era (GE) Modified Low Oval profile, high-performance taper, and 25.4" scale length, ensures smooth, comfortable playability. Complete with antique white binding, a bound ebony fingerboard with hexagon inlays, an ebony bridge with bone pins, and gold open gear tuners, the D-45 is a guitar you can trust to inspire, impress, and unleash the artist within.

  Martin's refreshed Standard Series for 2025 enhances tone, comfort, and style. Sitka spruce GE top bracing, as featured on the Modern Deluxe Series, delivers vintage-inspired tone and sustain, while updates like a reimagined neck profile, thinner fingerboard, and refined bridge and heel improve playability and aesthetics. Each guitar includes a hardshell case.
specs: |-
  - Body Size: D-14 Fret Dreadnought
  - Top Material: Solid Spruce with Aging Toner
  - Back and Sides: Solid East Indian Rosewood
  - Bracing Pattern: Forward-Shifted X-Brace, GE-Scalloped (Sitka Spruce)
  - Brace Size: 5/16"
  - Construction: Dovetail Neck Joint
  - Neck Material: Genuine Mahogany (Dark Mahogany)
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Scale Length: 25.4"
  - Number of Frets: 20 (joins body at 14th)
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Style 45 Hexagon, Abalone
  - Fingerboard Binding: Antique White
  - Bridge Material: Ebony
  - Bridge Style: GE Modern Belly — Drop-in Saddle
  - Bridge String Spacing: 2 5/32"
  - Bridge Pin Material: Bone with Abalone Dots
  - Saddle: Compensated Bone, 16" Radius
  - Nut Material: Bone
  - Headstock: Solid with Square Taper and Diamond
  - Headplate: East Indian Rosewood, Block Inlay Golden Era logo
  - Tuning Machines: Gold Open Gear with Butterbean Knobs
  - Top Inlay: Abalone with Multi-Stripe
  - Rosette: Abalone with Multi-Stripe
  - Back/Side Inlay: Abalone with Multi-Stripe
  - Back Purfling/Strip: Style 45 with Black Stripe
  - Binding: Antique White
  - Pickguard: Faux Tortoise
  - Finish: Gloss (top, back/sides, neck)
  - Electronics: None
  - Case: Hardshell included
  - Pleked: Yes
  - Left-Handed Availability: Yes
