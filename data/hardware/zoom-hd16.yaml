description: The HD16 is a hard disk recording studio combining a 16-track recorder, a drum and bass machine, a digital mixer, effects and a bay for a CD-R/RW drive, with eight XLR and phone combo inputs carrying phantom power. It records 8 tracks at once and plays back 19, and can also act as a control surface for DAW software.
specs: |-
  - 16 physical tracks (8 mono, 4 stereo) with 160 virtual takes (10 V-takes per track)
  - Stereo drum track and mono bass track in addition to the audio tracks
  - 8 simultaneous recording tracks, 19 simultaneous playback tracks (16 audio plus stereo drum and bass)
  - 44.1 kHz 16-bit mono WAV recording format, approximately 3 hours per GB per mono track
  - 80 GB 3.5-inch E-IDE hard disk, 5-inch bay for a CD-R/RW drive
  - Eight XLR/standard phone combo input jacks, balanced 1 kOhm or unbalanced 50 kOhm, +48 V phantom power on all eight
  - Inputs 1 and 2 switchable to Hi-Z (1 MOhm)
  - Input level continuously variable from -50 dBm to +4 dBm
  - Master output on RCA phono jacks (L/R), 1 kOhm output impedance, -10 dBm rated level
  - Headphone output and a Stereo Sub-Out jack, each a standard stereo phone jack, 50 mW into 32 Ohm
  - Stereo Sub-Out can carry the master signal as a second headphone feed or a separate monitor or effect send
  - S/PDIF optical digital output (20-bit)
  - MIDI In and MIDI Out
  - USB 2.0 High Speed, mass storage class and USB MIDI operation
  - Control input for an FS-01 foot switch or an FP-01 / FP-02 expression pedal
  - Can act as a control surface for DAW software over MIDI or USB
  - 14 faders (8 mono, 4 stereo, master, rhythm), post-fader and pre-fader 5-segment level meters
  - 3-band equalizer, chorus/delay and reverb sends and panning per track. Stereo link on tracks 1/2, 3/4, 5/6 and 7/8
  - 100 scenes per project, 1000 projects, 100 markers per project
  - Track editing: copy, move, erase, exchange, trim, fade in/out, reverse, time stretch, pitch fix, harmony generate, duo harmony
  - Manual and auto punch in/out, bounce, scrub/preview, A-B repeat, capture/swap, phrase loop
  - 9 insert effect algorithms (CLEAN, DISTORTION, ACO/BASS SIM, BASS, MIC, DUAL MIC, LINE, 8xCOMP EQ, MASTERING), 330 insert and 60 send/return patches, 7 insert and 2 send/return modules
  - Chromatic, guitar, bass, open A/D/E/G and D modal tuner
  - Rhythm section: 9 voices (8 drum, 1 bass), 16-bit linear PCM, 20 drum kits, 27 drum sounds per kit over 9 velocity-sensitive pads in 3 banks, 11 bass programs
  - Sampling capacity 66 seconds per kit in mono (5.5 MB), maximum 22 seconds per pad
  - 511 rhythm patterns and 10 rhythm songs per project, 48 PPQN resolution, 40.0 to 250.0 BPM
  - 24-bit A/D (64x oversampling) and D/A (128x oversampling) conversion, 24-bit internal signal processing, 44.1 kHz
  - Frequency response 20 Hz to 20 kHz +/-1 dB, S/N 93 dB (IHF-A), dynamic range 97 dB (IHF-A), THD+N 0.02%
  - 16-digit 2-line backlit LCD
  - 482 mm (W) x 328 mm (D) x 84 mm (H), 6.0 kg with CD-R/RW drive installed, 5.3 kg without
  - DC 12V 3A from the supplied AD-0011 AC adapter, 30 W typical consumption
