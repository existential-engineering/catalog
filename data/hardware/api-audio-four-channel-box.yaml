id: yfCh84obulxkijb2hHdF2
name: Four Channel BOX
manufacturer: api-audio
primaryCategory: console
categories:
  - mixer
  - preamp
  - discontinued
url: https://apiaudio.com/product/four-channel-box/
description: Small-format recording and mixing console built on API's
  all-discrete circuitry, designed for professional project studios and DAW
  workflows. 4 input channels with mic/line/instrument preamps; ch 1–2 include
  integral 550A EQ, ch 3–4 have a 500-series module slot; two 527 compressors;
  16-input summing bus; full monitor section with two stereo speaker systems;
  cue and talkback.
details: 4 input channels with mic/instrument/line preamps and high-pass
  filters. Channels 1–2 have integral 550A 3-band discrete EQ. Channels 3–4 have
  a 500-series module slot. Two 527 compressors assignable to input channels or
  stereo program bus with stereo link. 16 summing inputs (expandable to 20
  during mixing) via two DB-25 connectors. Stereo program bus with master fader,
  insert, and external sum input. One stereo and two mono auxiliary sends/buses.
  Stereo cue send/bus with headphone system. PFL, AFL, and solo-in-place modes
  with stereo solo bus. Full monitor section supporting two stereo loudspeaker
  systems (main + alternate). Internal talkback electret microphone with routing
  to program bus, aux, and cue. Integrated power supply. Stereo VU meters (0 VU
  = +4 dBu).
specs: |-
  - Console width: 26.5" (673 mm)
  - Console depth: 23.3" (592 mm)
  - Console height: 13.2" (335 mm)
  - Weight: 80 lb (36.3 kg)
  - Shipping weight: 105 lb (47.6 kg)
  - Shipping dimensions: 30" × 29" × 24"
  - Input voltage: 90–264 VAC, 47–63 Hz
  - Max power: 175 W (convection-cooled)
  - 500-series slot supply: ±18 VDC, +48 VDC
  - VU meter reference: 0 VU = +4 dBu
  - Operating temperature: 0–40°C
