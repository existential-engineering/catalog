description: Chandler Limited's GAV19T is an all-tube, 19-watt guitar amp in the
  vein of such vintage English classics as Selmer, Watkins, Marshall and Vox,
  featuring bias-adjustable preamp stage, Baxandall tone control, and a
  power-section drive circuit. Discontinued effective January 5, 2022.
details: |-
  The GAV19T is an all-tube, 19-watt guitar amplifier drawing inspiration from vintage English classics such as Selmer, Watkins, Marshall and Vox. Its tube complement consists of two EL84s, an ECC83, ECC803, and EZ81, configured in a cathode-biased/Class A circuit topology. The product was discontinued effective January 5, 2022.

  The preamp features a five-position Bias control that adjusts only the bias of the preamp tube, allowing the player to independently tweak tone and responsiveness separate from the power section. Positions range from slightly over-biased (#1, similar to a Marshall) to under-biased (#4 and #5), which add sustain and character.

  The tone section uses a Baxandall-style EQ built around an ECC803 tube. This topology was chosen to preserve the natural tone of the amplifier, and the section is configured to function similarly to a treble boost pedal, with a considerable boost range capable of smoothly driving the amp.

  The Drive circuit operates exclusively on the power section of the amplifier rather than the preamp, exploiting the pleasing character of power-stage distortion. It offers four tonal modes — Treble Boost, Full Range, Aggressive, and Mids — plus a bypass, along with a Normal/Intense tone switch that unbalances the push-pull power section to increase aggression and grit.

  The amp gained endorsements from notable engineers including Vance Powell (Jack White, Chris Stapleton) and Ryan Hewitt (Red Hot Chili Peppers, Tom Petty), and received coverage in Tape Op Issue 96 and Guitar Player Magazine.
