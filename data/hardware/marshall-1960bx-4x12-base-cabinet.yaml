description: Instantly recognisable straight-fronted 4x12" guitar speaker cabinet — the base (bottom) half of a classic Marshall full stack. The BX variant is loaded with four 12" Celestion G12M-25 'Greenback' speakers for a warmer, more vintage-voiced character than the standard 1960B, and handles 100W. Designed for overdrive applications, it pairs with vintage-style and modern Marshall heads to deliver the iconic Marshall 4x12 tone.
details: |-
  This 100W 4x12" cabinet can provide you with that smooth sound you have been looking for. The four Celestion G12M-25 Greenbacks have exquisitely detailed highs as well as a powerful mid-range punch in their voice. Less headroom causes the speakers to softly distort the sound, adding depth to the overdrive.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack.

  Designed and engineered in UK. Made in UK.
