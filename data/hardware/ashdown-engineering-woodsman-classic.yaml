name: Woodsman Classic
manufacturer: ashdown-engineering
primaryCategory: guitar-amplifier
categories:
  - amplifier
  - acoustic
url: https://ashdownmusic.com/products/woodsman-classic
description: Woodsman Classic 40W acoustic combo. The Woodsman builds on a long
  legacy of acoustic amp design to deliver class-leading standards of vocal and
  instrument performance, combining a traditional wooden cabinet with modern
  features for live performance and recording.
details: |-
  Designed for the new wave of acoustic performers, the Woodsman family combines traditional, beautiful wooden cabinets with modern features for live performance and recording. With inputs for microphones and acoustic guitar, the amps are ideal for duos or solo singer/guitar players, delivering pure, clear acoustic tone with performance tuning features including phase reverse and feedback-eliminating notch filters. Each model features a custom-designed 8" Ashdown driver, and the Classic and Parlour also feature a horn for increased full-range sound. The 40W Classic builds on the Parlour, adding a Tone control for the Mic Channel, Active and Passive inputs on the guitar channel, a phase reversal switch, a notch filter, and an XLR DI out for recording or connecting to a PA. All models include an Aux In jack for connecting an MP3 player.
specs: |-
  - Power output: 40W
  - Speaker configuration: 1 x 8"
  - Frequency response: -3dB @ 28Hz and 28kHz
  - High Instrument Input: Impedance 10k Ohms, input range 300mV - 20V p-p
  - Low Instrument Input: Impedance 3.9M Ohms, input range 150mV - 10V p-p
  - Line Input: 10k Ohms, Level 0dBu
  - Line Output: 4.7k Ohms, Level 0dBu
  - Signal to noise: greater than 80dB (EQ flat)
  - EQ: +/-15dB @ 100Hz and 10kHz
  - Effects send: 10k Ohms, Level 0dBu
  - Distortion: less than 0.8% THD
  - H x W x D: 326 x 350 x 225 mm (H: +15mm for feet)
  - Weight: 8.54 kg
