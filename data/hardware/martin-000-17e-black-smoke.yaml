details: |-
  The 000-17E Black Smoke represents a fusion of classic aesthetics with contemporary playability, drawing inspiration from vintage Martin designs while incorporating modern engineering for today's musicians. Built with a solid spruce top and mahogany back and sides, it offers clear articulation with a touch of warmth, suiting a wide range of playing styles.

  A striking satin black finish is complemented by antique white binding and an ivoroid pickguard, giving the guitar an old-school visual presence. The tonal qualities benefit from scalloped X-bracing that brings out dynamic response and tonal nuance, while the 24.9-inch scale length and 1 3/4-inch nut width balance comfort with resonance.

  The Modified Low Oval neck profile with High-Performance Taper facilitates smooth fretting, while the East Indian rosewood fingerboard with 1955 Style 18 mother-of-pearl inlays adds vintage character. Hardware includes Ping aged nickel tuners and a modern straightline rosewood bridge with a compensated white Tusq saddle on a 16-inch radius.

  The instrument is built around the Auditorium 000-14 Fret body shape — a versatile size suited to fingerstyle, songwriting, studio work, and live performance. It ships with Retro Acoustic Guitar Strings (Light gauge) and a waterproof soft-shell case with backpack straps and internal padding.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Solid Spruce, Satin Black finish
  - Back & Sides: Mahogany, Satin Black
  - Bracing: Scalloped X-Brace (Spruce)
  - Scale Length: 24.9"
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Neck Shape: Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Fingerboard: Rosewood (East Indian)
  - Fingerboard Inlays: 1955 Style 18 Mother-of-Pearl
  - Frets: 20 total, 14th fret neck join
  - Bridge: Modern Straightline Rosewood (drop-in saddle)
  - Saddle: Compensated White Tusq, 16" radius
  - Tuners: Ping Aged Nickel
  - Binding: Antique White
  - Pickguard: Ivoroid
  - Finish: Satin
  - Electronics: None standard; optional LR Baggs Anthem, Fishman Gold Plus Natural, or Fishman Infinity Matrix
  - Case: Waterproof soft-shell with backpack straps and internal padding
  - Strings: Retro Acoustic Guitar Strings, Light gauge
