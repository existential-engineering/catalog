description: The 290 DC S is a solid body double cutaway electric guitar built
  for unhindered access to all 22 frets and a wide tonal range. It features a
  single Lollar P90 Overwound bridge pickup, Honduran mahogany body and neck,
  and 50s-style wiring. The simplified single-pickup format delivers focused,
  expressive tone in a lightweight, elegant package.
details: |-
  The 290 DC S strips the double cutaway formula down to its essentials: one pickup, one volume, one tone. Built around a Honduran mahogany body and neck with a 24.875" scale length, the guitar features a rosewood fingerboard with a 12" radius, 22 medium nickel-silver frets, and a 1.6875" nut width. The single Lollar P90 Overwound bridge pickup is wired in classic 50s style through CTS 500K pots and Jupiter Vintage Yellow caps. Hardware includes a Kluson ABR-1 bridge, stop tailpiece, and Nickel Gotoh tuners. The body is finished in high gloss nitrocellulose lacquer and available in a wide range of standard, non-standard, premium, and metallic colors. A deluxe hardshell case is included.
specs: |-
  - Body: Solid Honduran mahogany double cutaway
  - Body Width: 13.5"
  - Body Length: 16.5"
  - Body Depth: 1.625"
  - Total Length: 38.75"
  - Neck: Honduran mahogany, extra long mortise & tenon joint
  - Peghead: Haircut profile with ebony veneer and MOP Collings logo
  - Scale Length: 24.875"
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Frets: 22 medium 18% nickel-silver
  - Nut Width: 1.6875"
  - Inlays: 5mm ivoroid dots
  - Pickup: Lollar P90 Overwound (bridge)
  - Controls: 1 volume, 1 tone (CTS 500K pots, Jupiter Vintage Yellow caps)
  - Wiring: 50s-style
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Stop tailpiece (nickel-plated zinc)
  - Tuners: Nickel Gotoh with Collings logo
  - Pickguard: Black/Cream/Black
  - Knobs: Amber or black top hat
  - Pickup Rings: Black dogear
  - Binding: None
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1046
  - Case: Deluxe hardshell included
