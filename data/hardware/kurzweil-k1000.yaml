description: >-
  The Kurzweil K1000 is a 24-voice sample playback synthesizer featuring the
  same acclaimed orchestral samples as the K250, delivered through a 76-key
  semi-weighted keyboard at a far more accessible price point. Its sophisticated
  digital wave synthesis engine layers digitally coded waveforms called
  Soundfiles with integrated effects including vibrato, tremolo, Leslie, chorus,
  and echo. The K1000 series also spawned an extensive line of rack-mount
  expander modules, each focused on different sound categories.
details: |-
  Introduced in 1988, the K1000 brought Kurzweil's award-winning sample library to a broader audience. The instrument contained digitally coded waveforms called Soundfiles, which could be either sampled acoustic instruments from Kurzweil's renowned library or digitally produced waveforms like sine, sawtooth, and square waves. These Soundfiles were layered into programs with per-layer effects, creating a surprisingly deep synthesis architecture.

  The famous Kurzweil piano, strings, and brass were all present, reportedly recorded using members of the Boston Symphony Orchestra. The K1000 excelled at realistic orchestral emulations, covering nearly every acoustic instrument category. With 24-voice polyphony and 16-part multitimbral capability, it was remarkably powerful for its era.

  Programming was the K1000's weak point. The small LCD display made navigating the deep architecture frustrating, and the backlights were notoriously prone to failure. Third-party replacement kits became available but required electronics skills to install. Computer-based editors greatly improved the programming experience.

  Kurzweil expanded the platform with an extensive rack-mount series including the 1000 AX (Acoustic Expander, 185 presets), GX (Guitar Expander, 100 presets), HX (Horn Expander, 75 presets), SX (String Expander, 99 presets), and PX (Professional Expander, 120 presets). The K1000SE (Special Edition) added aftertouch sensitivity to the keyboard. Despite being available at very low prices on the used market, the K1000 remains a capable instrument with genuinely excellent acoustic sounds.
specs: |-
  - Polyphony: 24 voices
  - Multitimbral: 16 parts
  - Oscillators: Sample-based with digital wave synthesis
  - Waveforms: Sampled acoustic instruments plus digital sine, saw, square
  - Effects: Vibrato, tremolo, Leslie, chorus, echo
  - Keyboard: 76 semi-weighted velocity-sensitive keys (aftertouch on K1000SE only)
  - Memory: 115 preset, 64 user patches
  - Control: MIDI In/Out/Thru
  - Production period: 1988-1992
releaseDate: "1988"
