prices:
  - amount: 10899
    currency: USD
description: The Steelhead® RC features autoformer MC loading, 6922/7044 tubes,
  variable capacitive loading to 1100pF, and remote volume control. Direct amp
  drive.
specs: |-
  - Phono Inputs: 3 (2 Autoformer, 1 Resistive)
  - Gain: 50 dB, 55 dB, 60 dB, 65 dB (selectable)
  - Capacitance: 10 pF to 1100 pF (continuously variable)
  - Max Output: +27 dBm
  - Tubes: 2 x 6922, 4 x 7044 or 5682
  - Dynamic Range: 101 dB
  - Impedance Loading: Autoformer: 25-400 Ohms; Resistive: 100-47 kOhms
  - Frequency Response: RIAA deviation less than +/-0.5 dB from 20 Hz to 20 kHz
  - Variable Output Impedance: 75 Ohms (White Follower buffer)
  - Remote: REMORA RF (Radio-Frequency) Remote Control
