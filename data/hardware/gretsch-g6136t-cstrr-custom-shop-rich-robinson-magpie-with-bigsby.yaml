details: |-
  Rich Robinson has been at the forefront of rock 'n' roll for nearly three decades, ever since his high school days when he co-founded the Black Crowes. His signature Custom Shop Magpie pairs a Falcon-family hollow body with a solid spruce top, ebony fingerboard, and a TV Jones TV Classic Plus bridge pickup matched with a Broad'Tron BT-65 in the neck. Finished in Raven's Breast Blue Relic with a Bigsby B6CBST string-thru vibrato and a premium gray speckle hardshell case.
