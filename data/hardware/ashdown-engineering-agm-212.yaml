description: 'A 2x12" guitar cabinet from Ashdown''s Guitar Magnifier range,
  built in the UK Custom Shop from premium lightweight ply. It carries a pair of
  Celestion G12M-65 Creamback speakers, the pairing Ashdown found worked best
  with AGM amplifiers such as the AGM-484 head and the AGM 30-Offset. The
  Creamback delivers the familiar woody G12M tone with greater power handling:
  low-end grunt, a warm vocal mid-range, crunchy upper-mids and refined highs.
  The cabinet can run closed or semi-open back, is rated at 130 watts, 16 ohms,
  and is fitted with a leather handle.'
details: |-
  All AGM cabinets are constructed using premium lightweight ply to cut the weight but not the tone. After extensive testing we found that the Celestion 12" G12M-65 Creamback speakers sounded the best when paired with the AGM amplifiers such as the AGM-484 head and the AGM 30-Offset. The G12M-65 Creamback produces the familiar woody G12M tone, but handles greater power making it ideally suited for today's amps when a vintage tone is desired. The increased power handling brings with it low end grunt complementing the warm and vocal mid range, crunchy upper-mids and sweet, refined highs. Ashdown Guitar Magnifier 2 x 12 Cabinet.
