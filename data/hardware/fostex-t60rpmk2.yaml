name: T60RPmk2
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/t60rpmk2/
description: Evolution of the T60RP semi-open dynamic headphone, featuring a
  4th-generation full-field-driven RP planar diaphragm driver in a solid black
  walnut housing optimized for listening applications. Continues over 50 years
  of Fostex RP technology with a new housing design, refined acoustic
  adjustment, and dual-entry detachable cable. Includes a 2 m unbalanced Y cable
  with independent left/right 2-pole 3.5 mm connectors and a 3.5 mm stereo mini
  plug; an optional 4.4 mm balanced cable (ET-RP4.4BL2Y) and Ultrasuede ear pads
  (EX-EP-RP-SUEDE) are available.
details: |-
  Configuration: Semi-open, around-ear, planar magnetic headphones with detachable dual-entry cable

  Features:
  - 4th-generation full-field-driven RP planar diaphragm driver developed and manufactured in-house by Fostex
  - Solid black walnut wood housing tuned for listening applications
  - Independent left/right Y-cable connections (dual-entry detachable)
  - Low-resilience ear pads, replaceable with optional Ultrasuede ear pads (EX-EP-RP-SUEDE)
  - Semi-open design for expansive soundstage
  - Optional 4.4 mm balanced cable available (ET-RP4.4BL2Y)

  Series: RP Series
