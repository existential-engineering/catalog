description: Evolution of the T60RP semi-open dynamic headphone, featuring a 4th-generation full-field-driven RP planar diaphragm driver in a solid black walnut housing optimized for listening applications. Continues over 50 years of Fostex RP technology with a new housing design, refined acoustic adjustment, and dual-entry detachable cable. Includes a 2 m unbalanced Y cable with independent left/right 2-pole 3.5 mm connectors and a 3.5 mm stereo mini plug; an optional 4.4 mm balanced cable (ET-RP4.4BL2Y) and Ultrasuede ear pads (EX-EP-RP-SUEDE) are available.
details: |-
  This is the latest model of the RP technology headphones, which have been used in professional music studios around the world for over 50 years since their birth. The T60RP has evolved from the well-received T60RP for listening into the mk2 with the 4th generation RP driver, a full-field-driven planar diaphragm driver originally developed and manufactured in-house by Fostex, mounted in a solid black walnut housing. RP and RP Technology are Fostex's proprietary technologies that move the entire surface of the planar diaphragm in regular phase.

  The solid black walnut wood housing, with its beautiful grain and natural texture, allows a natural sound that is comfortable to listen to, from the rich and firm depth of the bass range to the extended high frequency range. Because the housing is made of solid natural wood, there may be differences in grain, bark, coloration and knots in each item, but this does not affect sound quality.

  The RP technology has been used in the 4th generation of RP drivers. The components of the magnetic circuit have been redesigned to optimize the magnetic flux distribution, suppressing unwanted resonance of the diaphragm and achieving a sharp response in the rise and fall of the sound. The fourth-generation driver simultaneously achieves improved sensitivity, smooth frequency response for easy monitoring, and excellent transient characteristics.

  Connectors are provided on both the left and right housings, and a newly developed Y-cable connection is used. The 2-pole 3.5 mm connectors improve re-cabling compatibility and increase versatility. The cable uses a high-quality sound OFC conductor, and an optional 4.4 mm balanced cable (ET-RP4.4BL2Y) is available.

  The earpads are low-resilience, around-the-ear earpads for a comfortable fit and can be used comfortably for extended periods of listening. They can be fitted with optional Toray Ultrasuede ear pads (EX-EP-RP-SUEDE), sold separately.
specs: |-
  - Type: Semi-open dynamic
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 96 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 360 g (cable not included)
  - Housing: Solid black walnut
  - Y-cable connection with 2-pole 3.5 mm connectors on both housings
  - Accessories: 3.5 mm (2-pole) mini plug x2 (L, R) to 3.5 mm (3-pole) stereo mini plug cable (2 m) x 1, 3.5 mm to 6.3 mm stereo phone conversion connector x 1, dedicated pouch x 1, safety precautions
  - Optional balanced cable: 4.4 mm ET-RP4.4BL2Y
  - Optional Toray Ultrasuede ear pads: EX-EP-RP-SUEDE
  - Passive wired headphones, no power supply required
  - Series: RP Series
