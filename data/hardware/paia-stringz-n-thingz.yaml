description: >-
  The PAiA Stringz 'n' Thingz is a fully polyphonic analog string and piano synthesizer
  released in 1978 as a DIY kit. It was the largest kit ever produced by PAiA Electronics,
  offering two tonal voicings with a 37-key keyboard in a rugged flight case.
details: |-
  Released in 1978 as model 1550, the Stringz 'n' Thingz represented the most ambitious kit synthesizer PAiA Electronics ever produced. It was available both as a build-it-yourself kit and in pre-assembled form, offering an affordable entry point to string synthesis using inexpensive components.

    The instrument features two tonal voicings, Strings and Piano, that can be played individually or together. The piano voice resembles a harpsichord, while the string voice delivers a softer attack with a built-in chorusing effect for a thicker, shimmering sound. Both voices use pulse-width waveforms with pure analog circuitry.

    Modulation and shaping capabilities are minimal, limited to modulation and sustain controls. The modulation section provides a simple LFO with rate and depth adjustment affecting only the string section. Sustain controls allow independent release envelope adjustment for both voices via jacks compatible with foot switches, pedals, or control voltages.

    The 3-octave keyboard supports full polyphony across all 37 notes. A split functionality divides lower strings (Cello) from higher strings (Violin), assignable to either side of a programmable split point. The instrument is housed in a rugged flight case with a cover that latches shut for transport. A variant model 1551 offered stereo output but remains less common.
specs: |-
  - Polyphony: 37 notes (fully polyphonic)
    - Multitimbral: 2 parts (Strings and Piano)
    - Oscillators: 4 VCOs
    - Waveforms: Pulse width only
    - LFO: 1 (Strings only, with Rate and Depth controls)
    - Filter: None
    - Envelope: Release only (separate for Strings and Piano, labeled Sustain)
    - Effects: Built-in chorusing on Strings voice
    - Keyboard: 37 keys, 3 octaves, no velocity or aftertouch
    - Keyboard Split: Cello/Violin split with programmable split point
    - Memory: None
    - Control: Sustain jacks (foot pedals, switches, control voltages), Gate trigger output
    - Model Variants: 1550 (mono), 1551 (stereo)
    - Housing: Rugged flight case with latching cover
