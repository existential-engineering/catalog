description: >-
  The Yamaha DX27 is a full-sized 61-key FM synthesizer and a keyboard version
  of the compact DX100. While not as flexible as the DX7, it offers 8-voice
  polyphony with 4-operator FM synthesis and is particularly renowned for its
  gritty, analog-quality bass sounds suited to electronic music genres.
details: |-
  The DX27 represents Yamaha's more accessible approach to FM synthesis, bringing the technology from their compact DX100 to a standard 61-note keyboard format. As an FM-based instrument, it shares the synthesis methodology with Yamaha's more expensive DX7, though with reduced capabilities.

  The standard DX27 model includes basic MIDI control but lacks several modern conveniences. The DX27S variant adds built-in speakers for home use, stereo chorus effects, pitch bend and modulation wheels, and breath controller support, making it more suitable for performers and composers seeking real-time expression.

  The instrument is particularly celebrated for its first preset patch, described as ideal for techno, house, jungle, and acid music styles with a characteristically gritty tone. However, most other preset sounds are considered less impressive, requiring users to program custom patches to achieve satisfactory results beyond the signature bass tone.
specs: |-
  - 8-voice polyphony
  - 4-operator digital FM synthesis
  - 61 keys (no velocity or aftertouch)
  - 192 presets, 24 user patches
  - 1 part multitimbral
  - No filter
  - Stereo chorus (DX27S only)
  - MIDI control
