description: iRig Mic HD 2 is a handheld digital condenser microphone with
  24-bit/96 kHz audio, a gold-sputtered electret condenser capsule, and built-in
  headphone output for recording on iPhone, iPad, Mac, and PC.
details: |-
  iRig Mic HD 2 features a gold-sputtered electret condenser capsule with 24-bit A/D and D/A conversion at sample rates up to 96 kHz. The low-noise, high-definition preamplifier includes onboard gain control for optimal signal levels, and handles a maximum SPL of 125 dB.

  An integrated headphone output with independent volume control enables real-time monitoring. The built-in multicolor LED indicates status and audio levels. A built-in windscreen reduces plosives and wind noise. Includes a custom ASIO driver for low-latency Windows operation.

  In the box: Lightning iOS cable, USB cable, compact table tripod, microphone stand adapter, 5/8" to 3/8" thread adapter, and carrying pouch.
specs: |-
  - Condenser electret, 0.55" gold-sputtered capsule
  - Polar pattern: cardioid
  - Frequency response: 20 Hz - 20 kHz (-3 dB)
  - Sensitivity: -40 dB, 10 mV/Pa (adjustable over 40 dB range)
  - Maximum SPL: 125 dB
  - 24-bit A/D and D/A conversion
  - Sample rates: 44.1, 48, 88.2, 96 kHz
  - Headphone output: 1/8" TRS jack
  - Connector: Micro-USB
  - Power: bus powered by connected device
  - Dimensions: 188 mm (7.4") x 49 mm (1.93")
  - Weight: 325 g (11.46 oz)
  - Cable length: 1.5 m (59")
