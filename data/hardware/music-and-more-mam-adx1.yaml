description: >-
  The ADX1 is a compact, all-analog drum synthesizer from German manufacturer Music And
  More (MAM). It features 50 knobs controlling five analog drum sounds (Bass, Synth,
  Snare, HiHat, and Metal) with ten dedicated parameters per voice. Rack-mountable and
  MIDI-controllable, it offers a characteristically noisy and dirty analog character
  without an integrated sequencer or patch memory.
details: |-
  The ADX1 takes a purely synthesis-based approach to drum sound creation, prioritizing sound design flexibility over pattern sequencing. Each of its five analog voices — Bass, Synth, Snare, HiHat, and Metal — receives ten dedicated rotary knobs for comprehensive parameter control including attack, decay, release envelopes, stereo panning, filter cutoff, resonance, volume, FM depth, and tuning.

  The Snare and HiHat offer open and closed variants, while the HiHat's envelope and filter controls enable animated pattern textures. The Metal sound functions more as an analog-explosion effect than traditional percussion. The overall character is described as noisy and dirty analog warmth, capable of emulating classic analog drum tones reminiscent of the Roland X0X series and Simmons machines, though the Bass voice lacks the punch of a 909 kick.

  MIDI I/O enables external control despite the absence of internal sequencing, and individual outputs accompany the stereo outputs. On-board trigger buttons facilitate real-time sound manipulation during sound design sessions. The metal faceplate was available in both blue and silver finishes.

  The ADX1 ceased production when MAM was acquired by Terratec. Its combination of modern MIDI implementation with old-school analog sounds and low-budget construction positioned it as an affordable entry-level analog drum synthesizer, comparable to the Vermona DRM but at a lower cost with a grittier character.
specs: |-
  - 5 analog drum voices (Bass, Synth, Snare, HiHat, Metal)
  - 50 front-panel knobs (10 per voice)
  - Bandpass filter plus up to 2 resonant filters (sound-dependent)
  - Attack, Decay, Release envelopes (sound-dependent)
  - FM modulation for filter cutoff or pitch
  - MIDI In and Thru
  - 5 trigger buttons
  - Individual audio outputs per voice
  - Stereo audio output
  - Rack-mount format
  - No built-in sequencer
  - No patch memory
  - No built-in effects
