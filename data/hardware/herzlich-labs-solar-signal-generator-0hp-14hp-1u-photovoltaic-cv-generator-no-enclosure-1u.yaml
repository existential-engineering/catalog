description: A passive photovoltaic CV generator that creates up to 5 volts of
  CV from ambient light, offered in a hybrid 0hp/1U format for use as an
  enclosed module or bare 1U panel.
details: |-
  Harness the power of a dying star

  It's not very often that you get something from nothing, but today, you just will. Create 5 volts of CV from nothing, with nothing other than the light shining warmly upon your face from the skies above, or the electric lights that illuminate your stage or studio. Liberate yourself from the constraints of power supplies, and create CV right where you are, with nothing more than the sweet photons that have traveled 8 minutes and 20 seconds at the speed of light to reach you, and create a sick filter sweep. Go outside, touch grass, and see what the deal is - now, you'll be well equipped to create CV (provided there is adequate daylight and/or a nearby artificial light source). No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Generate up to 5 volts of photovoltaic CV
  - Too much CV? Attenuate the solar panel with your hand
  - Create your own solar-powered envelopes
  - Passive design: no batteries required, just light
