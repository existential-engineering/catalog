description: "Compact enough to fit into the tightest of spaces - yet
  intelligent enough to adapt to your recording environment - the 8320A is your
  entry point into the world of Smart Active Monitoring."
details: |-
  The 8320A is Genelec's entry point into the Smart Active Monitoring (SAM) family, designed to bring intelligent, room-adaptive monitoring to compact installations and tight studio spaces. Its die-cast recycled aluminium enclosure houses a 105 mm bass driver and 19 mm metal dome tweeter, each driven by a 50 W Class D amplifier, producing transparent and truthful reproduction across a 66 Hz - 20 kHz (±1.5 dB) range.

  Despite its small footprint, the 8320A delivers a peak SPL of ≥107 dB and a wide, uncoloured sweet spot, giving engineers a stable reference for mix decisions. The curved Minimum Diffraction Enclosure (MDE) and integrated Directivity Control Waveguide (DCW) work together to provide precise, detailed performance both on and off axis, while a rear reflex port extends low-frequency response from the compact cabinet.

  As a SAM monitor, the 8320A integrates closely with Genelec's GLM software via two RJ45 network ports, allowing the AutoCal 2 algorithm to measure the room and apply compensation for detrimental acoustic influences. The system supports configurations from mono through stereo to immersive multichannel, with up to 60 dB of level alignment and around 200 ms of delay alignment available per monitor.

  The 8320A includes Genelec's Intelligent Signal Sensing (ISS) circuitry, dropping consumption below 0.5 W in sleep, alongside the Iso-Pod stand for decoupling and tilt adjustment, and versatile mounting options for installation flexibility. Time equalization above 400 Hz keeps input-to-output delay constant for predictable behaviour in calibrated systems.
specs: |-
  - Frequency response: 66 Hz - 20 kHz (±1.5 dB)
  - Low cutoff -6 dB: 55 Hz
  - High cutoff -6 dB: 23 kHz
  - Peak SPL: ≥107 dB
  - Short term max SPL: ≥100 dB
  - Long term max SPL: ≥94 dB
  - Self-generated noise: ≤5 dB SPL (A-weighted)
  - Harmonic distortion 50–200 Hz: ≤3%
  - Harmonic distortion >200 Hz: ≤0.5%
  - Group delay (Extended Phase Linearity OFF): 2.8 ms
  - Bass driver: 105 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Enclosure: Die cast aluminium, reflex port
  - Signal input: 1 x XLR (female, balanced, 10 kOhm)
  - Control: 2 x RJ45 (CAT5) GLM network connectors
  - Power consumption (sleep, ISS): <0.5 W
  - Power consumption (idle): ≤3 W
  - Power consumption (full output): 50 W
  - Mains: 100-240 VAC, 50/60 Hz
  - Height: 230 mm (242 mm with Iso-Pod)
  - Width: 151 mm
  - Depth: 142 mm
  - Weight: 3.2 kg (7.1 lb)
