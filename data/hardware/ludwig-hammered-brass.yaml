description: >-
  Having a similar sonic quality to the Black Beauty but at a higher pitch,
  Ludwig's Hammered Brass snare drums utilize the same hammering process as
  Ludwig Timpani to expand their playable range. Each shell has a similar
  hammering pattern, but no two are exactly alike and they vary slightly in
  tonality.
details: |-
  An Industry Standard Since 1911. The Hammered Brass snare features a 1.2mm seamless hammered brass shell paired with tube lugs and a Supraphonic-style snare system. Each shell is individually hammered, giving each drum a slightly unique tonal character.

  Available in 5x14" and 6.5x14" sizes with optional die-cast hoops in place of the standard 2.3mm triple flanged steel hoops.
specs: |-
  - 1.2mm seamless hammered brass shell
  - 2.3mm steel triple flanged hoops (die-cast optional)
  - Tube lugs
  - 10 lugs
  - P88AC throw off
  - P35P butt plate
  - Ludwig Weather Master medium coated batter head
  - Ludwig Weather Master clear snare-side head
  - Supraphonic snare system
  - Available sizes: 5x14", 6.5x14"
  - LB420BKT — 5x14" hammered brass, tube lugs
  - LB422BKT — 6.5x14" hammered brass, tube lugs
