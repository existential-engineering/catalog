description: Discover Mode USB-C wired earphones with built-in microphone,
  customisable fit, and tangle-resistant cord. Ideal for your on-the-go routine.
details: |-
  Mode USB-C delivers huge Marshall signature sound in a small, iconic package. Ideal for your on-the-go routine, just plug in and enjoy crystal-clear, powerful audio from dynamic, custom-tuned drivers. The classic in-ear design comes with a customisable fit and soft, specially selected materials for maximum comfort. Listen for hours with nothing to distract you from the music.

  Dynamic drivers: delivering rich bass, clear vocals and crisp details, Mode USB-C's 9 mm dynamic drivers ensure your music always sounds full and balanced.

  Customisable fit: find the ideal fit with four different-sized ear tip options (S, M, L, XL). The classic in-ear design anchors to your ear and stays just as comfortable for longer listening sessions.

  Tangle-resistant cord: built for life in motion, the cord is designed to minimise tangling and keep its shape, so you can grab the earphones and plug in without delays. The built-in microphone has been reworked for cleaner sound and reduced background noise.

  Mode USB-C connects through a USB-C port rather than a 3.5 mm jack, and works with any device with a functional USB-C port designed for audio output. No driver installation or setup is required: it is plug-and-play on most systems, including Android, ChromeOS and macOS. Designed and engineered in Sweden. Made in China.
