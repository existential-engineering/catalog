description: A single-slot 500-series shelving equalizer bringing Dangerous
  Music's Baxandall BAX EQ tone-shaping to a compact rack format.
details: |-
  The Dangerous Music BAX500 brings the legendary, ultra-musical Baxandall curves to a single-slot 500-series module. Broad shelves shape several octaves at once, so each small move delivers a big result: open top, solid bottom, and a polished sense of dimension.

  Built for tracking, mixing, and mastering, BAX500 delivers the classic Dangerous BAX tone-shaping workflow in a compact format, with High and Low shelves plus High Cut and Low Cut filters. Use one for single sources or run a pair for stereo buses.

  BAX500 follows the same core design principles as the rackmount BAX EQ, using identical exacting components selected for both performance and sound, tested to draconian tolerances to ensure consistency, reliability, and long-term stability.

  The signal path is DC-coupled up to the Low Cut filter and features a relay-controlled hard-wired bypass that physically removes the circuit from the signal path for true A/B comparisons. The steel enclosure is fully shielded.

  Each BAX500 is hand assembled in the USA using Mogami point-to-point wiring.
specs: |-
  - Format: 500-series module (single-slot)
  - EQ Type: Baxandall high and low shelving EQ
  - Shelving Gain Range: ±5 dB
  - Filters: High Cut and Low Cut frequency filters
  - Filter Slope: 12 dB per octave
  - Bypass: Relay-controlled hard-wired bypass (filters and full circuit)
  - Signal Path: DC-coupled up to the Low Cut filter
  - Assembly: Hand assembled in the USA
  - Frequency Response: ±0.1dB from 10Hz to 20kHz, ±0.2dB from 1Hz to 80kHz
  - THD + Noise: <0.0012%
  - IMD60 4:1: <0.002%
  - Dynamic Range: 113dB
  - Nominal Operating Level: +4dBu
  - Maximum Input Level: +23dBu
  - Input Impedance: 25K Ohms Balanced
  - Output Impedance: 50 Ohms Balanced
