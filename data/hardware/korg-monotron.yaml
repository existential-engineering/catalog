description: >-
  A pocket-sized monophonic analog synthesizer from Korg, roughly the size of a
  cassette tape, marking the company's return to analog synthesis after nearly
  three decades.
details: |-
  Released in 2010, the Monotron was Korg's first analog synthesizer in nearly thirty years. Marketed as the "Go-Anywhere Analog," this battery-powered device is roughly the size and shape of a cassette tape, making it one of the most portable true analog synths ever produced. At its core sits a single voltage-controlled oscillator producing a sawtooth waveform, routed through a filter based on the legendary MS-10/MS-20 design.

  The filter is a 12dB per octave lowpass type capable of self-oscillation, providing the characteristically aggressive Korg filter sound. A single LFO with sawtooth waveform can modulate either pitch or filter cutoff. Control is via a tiny one-octave ribbon keyboard spanning just 3.25 inches. The Monotron lacks a VCA envelope generator, memory, and any MIDI or USB connectivity, keeping things deliberately minimal.

  The success of the original spawned two variants in 2011: the Monotron Duo, which adds a second VCO with cross-modulation, and the Monotron Delay, which incorporates a digital space delay effect. Korg also expanded the concept into the Monotribe, adding square and triangle waveforms, a 16-step sequencer, and a drum machine section.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth)
  - LFO: 1 (sawtooth waveform)
  - Filter: 1 VCF 12dB/oct lowpass (MS-10/MS-20 based, self-oscillating)
  - Envelope: 1 VCA with gate trigger
  - Keyboard: Ribbon controller (1 octave)
  - Memory: None
  - Control: None
  - Power: Battery operated
releaseDate: "2010"
