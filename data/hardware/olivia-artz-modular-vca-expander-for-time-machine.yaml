description: An expander module that adds voltage control over the volume of the
  dry stereo signal and each of Time Machine's 8 stereo delay taps via 9 linear
  VCA inputs.
details: |-
  When we released Time Machine some said "the lack of cv control over the position of the individual sliders is a crime". As much as we enjoy crime, we've decided to address the situation. The VCA Expander for Time Machine gives you voltage control over the volume of the dry stereo signal sent into Time Machine and each of its 8 stereo delay taps. These 9 inputs act as linear VCAs (Voltage Controlled Amplifiers) that reach unity at +5V. Voltage above +5V is clipped, as are signals below 0V. This voltage clamping works with Time Machine's subtle volume normalization to turn complex modulation into original temporal phenomena. With cables patched into the VCAs the sliders become attenuators, meaning that they control volume levels and modulation depth simultaneously. When the taps are audible they also contribute to the feedback, making this more than a simple external VCA. This is a way to tap into the engine of a complex granular delay. It ships January, 2026

  VCA Expander on ModularGrid

  Note: This VCA expander works with the OAM Time Machine (DIY and assembled), Tiny Time Machine, and any other version of the Time Machine that runs the default firmware and has all of the expander pins. It cannot operate at the same time as Timo Rozendal's expander .
specs: |-
  - 2 HP
  - 37mm deep (from the back of the faceplate to the back of the power cable)
  - draws under 10ma from each of +12V and -12V rails
  - includes 16-pin to 2x 10-pin Eurorack cable to power both modules with one spot on your bus board
  - includes cable for connecting to Time Machine
