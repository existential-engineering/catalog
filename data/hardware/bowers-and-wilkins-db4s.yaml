description: A powerful, classically styled single-driver 10-inch subwoofer from
  the Bowers & Wilkins DB Series, designed as a perfect match for the 700 Series
  and for delivering impactful bass in home theater set-ups.
details: |-
  The DB4S is a member of the Bowers & Wilkins DB Series of subwoofers, built around a single 250mm (10") Aerofoil cone bass driver. The Aerofoil profile is intended to keep the diaphragm pistonic across its operating range, delivering deep, articulate low-frequency reproduction in support of music and film.

  Amplification is handled by an integrated digital preamplifier with Dynamic EQ, which adjusts the subwoofer's response according to listening level so that perceived bass weight remains balanced from low-volume background listening up to full home-cinema reference levels.

  The DB4S provides extensive line-level connectivity for both stereo and home theater use. Two XLR balanced inputs and two RCA unbalanced inputs accept line-level audio, while a pair of 3.5mm inputs and a 12V trigger support integration with control systems and source switching. An RS-232 (9-pin D) connector is included for advanced setup and third-party control.

  Set-up and tuning are handled wirelessly through a dedicated control app over Bluetooth Low Energy (BT-LE), allowing the user to configure crossover, level, EQ and room-correction parameters without needing physical access to the rear panel during placement.

  The cabinet measures 377mm (14.8") high by 360mm (14.1") wide by 368mm (14.5") deep and weighs 26kg (57.3 lb). It is offered in Gloss Black, Satin White, and Rosenut finishes.
specs: |-
  - Drive unit: 1x ø250mm (10") Aerofoil cone bass
  - Frequency response: 10Hz - 350Hz -3dB (centered at 100Hz)
  - Frequency range: -6dB at 8.5Hz - 500Hz
  - Power consumption: 1/8th rated 195W; Standby <0.5W
  - Input impedance: RCA 10 kOhm; XLR 20 kOhm
  - Signal/Noise ratio: 82 dB
  - Amplifier: Digital preamplifier with Dynamic EQ
  - Control: App-based set-up and BT-LE control
  - Inputs: 2x XLR, 2x RCA, 2x 3.5mm, 12V trigger, RS-232 (9-pin D)
  - Dimensions (HxWxD): 377mm x 360mm x 368mm (14.8" x 14.1" x 14.5")
  - Net weight: 26kg (57.3 lb)
  - Finishes: Gloss Black, Satin White, Rosenut
