description: Give your home theater set-up the bass impact it deserves with
  DB4S, a powerful, classically styled single driver subwoofer that's a perfect
  match for the 700 Series.
details: |-
  DB4S is the single-driver member of the Bowers & Wilkins DB Series, an active closed-box subwoofer built around one 250mm (10in) Aerofoil cone bass unit. The variable-thickness Aerofoil profile keeps the cone stiff and light so it stays pistonic across its working range, which is what gives the subwoofer its combination of depth and articulation. Bowers & Wilkins presents it as the match for the 700 Series loudspeakers.

  Because the cabinet carries a single forward-facing driver rather than the opposed pair of the DB1D, DB2D and DB3D, the DB Series manual recommends orienting it with the driver facing out into the room, and names DB4S as the model to use when a subwoofer has to be built into furniture.

  Amplification is digital, and a digital preamplifier with Dynamic EQ shifts the response with listening level so perceived bass weight holds up from quiet background listening to full cinema reference level. Preset EQ curves for music and movie material, a five-band custom equaliser, low-pass filter set-up and a Room EQ routine are all provided.

  Set-up and control happen entirely in the Bowers & Wilkins DB Subwoofers app over Bluetooth Low Energy, so crossover, level, EQ and room correction can be adjusted without reaching the rear panel once the subwoofer is positioned. The subwoofer switches on as soon as mains power is applied and drops to standby after 20 minutes unused, with the standby button on the rear panel on this model.

  The connection panel takes stereo balanced XLR and stereo unbalanced RCA phono line-level inputs, which can be wired simultaneously and selected independently, plus two 3.5mm 12V trigger sockets for remote switch-on and remote input selection and a 9-pin D RS-232 connector for home automation. The cabinet measures 377mm high including feet by 360mm wide by 368mm deep and weighs 26kg (57.3 lb), in Gloss Black, Satin White or Rosenut.
specs: |-
  - Description: active closed-box subwoofer system
  - Drive unit: 1 x 250mm (10 in) Aerofoil cone bass
  - Frequency response: 10Hz - 350Hz -3dB (centered on level at 100Hz)
  - Frequency range: -6dB at 8.5Hz - 500Hz
  - Technical features: digital preamplifier with Dynamic EQ, app-based set-up and BT-LE control
  - Inputs: 2 x XLR, 2 x RCA, 2 x 3.5mm 12V trigger, RS-232 9-pin D connector
  - Input impedance: RCA 10 kOhm, XLR 20 kOhm
  - Signal / noise: 82 dB
  - Power consumption: 195W at 1/8th of rated power; standby below 0.5W
  - Set-up and control: Bowers & Wilkins DB Subwoofers app over Bluetooth Low Energy (iOS/Android); the subwoofer can only be set up with the app
  - Room EQ and preset EQ for music and movie material, plus a five-band custom equaliser and low-pass filter set-up in the app
  - Auto-standby after 20 minutes unused; standby button on the rear panel
  - Dimensions: Height 377mm (14.8 in) including feet, Width 360mm (14.1 in), Depth 368mm (14.5 in)
  - Net weight: 26kg (57.3 lb)
  - Cabinet finishes: Gloss Black, Satin White, Rosenut
  - Grille finishes: Black, Grey
