description: The HRM-7 studio headphones are precision designed to deliver a
  clean, neutral sound to dance music producers. The fully enclosed design
  features dual airflow chambers and a damping structure to enhance the bass
  response and reduce resonance for accurate monitoring. And, thanks to the
  headband's freely adjustable headband and flexible, ergonomic design, you
  won't even notice wearing them, even during long recording sessions.
details: |-
  ### Accurate sound

  Dual air chambers in the housings improve airflow to deliver an improved bass response, while a 3-layer damping structure eliminates unwanted resonance for cleaner low to mid frequencies.

  ### Studio sound quality

  The unique 40 mm HD driver units faithfully reproduce frequencies of up to 40 kHz to guarantee a crystal clear, high-res sound.

  ### Fully enclosed pads

  The headphones' housings feature a large space around the ear for a wider sound stage and acoustic separation. The fully enclosed design improves sound insulation and reduces ambient noise.

  ### Comfortable monitoring

  The large ear pads are made with a hybrid memory foam and covered with soft velour fabric – providing a snug fit and ensuring enough airflow for accurate monitoring. The freely adjustable headband and flexible, ergonomic design on the ear pads mean you can find the best size and angle to suit you, ensuring comfort over long sessions in the studio.
