description: The DS1 is a 12-fret slope shoulder dreadnought based on the
  original dreadnought shape first designed as an oversized Hawaiian guitar
  almost a century ago. The wide neck and slotted headstock retain the vintage
  body shape while delivering an open, airy tone with smoothness and warmth
  suited to both flatpicking and fingerstyle playing. The 12-fret neck join
  positions the bridge further down the body for a uniquely resonant,
  vintage-voiced response.
details: |-
  The DS1 revives the original 12-fret dreadnought form, pairing a slope-shouldered body with a wide neck and slotted headstock. Its Sitka spruce top sits over Honduran mahogany back and sides, braced with a pre-war scalloped X-brace pattern for a resonant, vintage-voiced response. The ebony fingerboard and belly-style ebony bridge with 2 3/8" string spacing complement the modified V neck profile and 25 1/2" scale length. A mortise and tenon hybrid neck joint, fully adjustable truss rod, bone nut and drop-in saddle, and Nickel Waverly tuners round out a guitar built for players who want vintage aesthetics with Collings-level craftsmanship.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Neck Profile: Modified V
  - Scale Length: 25 1/2"
  - Nut: Bone, 1 13/16"
  - Saddle: Bone, drop-in
  - Fingerboard: Ebony with MOP long dots
  - Fingerboard Radius: 14" - 26" compound
  - Frets: Medium 18% nickel-silver
  - Bridge: Ebony belly-style, 2 3/8" spacing
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Brace Pattern: Pre-war scalloped X-brace
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Peghead: Tapered slotted square with volute
  - Tuners: Nickel Waverly
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Rosette: b/w purfling
  - Backstrip: 1-style (Walnut)
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20 7/8"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/8"
  - Strings: D'Addario EJ-17 (.013" - .056")
