description: A limited-edition tribute to the original 1937 D-45, individually
  linked by serial number to its pre-war counterpart. Features Adirondack Spruce
  top with VTS, Brazilian Rosewood back and sides, and period-correct
  appointments throughout.
details: |-
  The D-45 1937 Project 91-6 is part of an ultra-limited series of 91 instruments, each individually linked by serial number to one of the original pre-war D-45 guitars built in Martin's golden era. This particular instrument is #6, and ships with a framed Certificate of Authenticity poster connecting it to its historical counterpart (serial #67460).

  Built to period-correct specifications, the guitar features an Adirondack Spruce top treated with Vintage Tone System (VTS), paired with Brazilian Rosewood back and sides. The forward-shifted X-brace pattern is hand-shaped and scalloped in the original 1937 style, using Adirondack Spruce bracing material at 5/16" dimension.

  The D-12 Fret body shape with dovetail neck joint and 12-fret neck-to-body junction recreates the proportions and voice of the pre-war originals. The Genuine Mahogany neck features the Period Correct Barrel & Heel shape with Standard Taper, a 25.4" scale length, and an ebony fingerboard with Solid Abalone 45 Snowflake inlays.

  Appointments include grained Ivoroid binding throughout, Brazilian Rosewood headplate with Period Correct Solid Abalone CFM Block logo, Waverly Gold tuning machines with non-engraved Butter Bean knobs, and a period-correct non-compensated long bone saddle with 16" radius. The instrument ships in a 5 Ply D-12F Harptone case.

  This is a pure acoustic instrument with no onboard electronics. Released as part of the Project 91 series and listed as new for 2026.
