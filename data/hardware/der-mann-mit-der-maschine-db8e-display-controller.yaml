description: The DB8E is a Eurorack controller module featuring a display, eight
  push buttons and an endless encoder with push function, showing live
  information about the DROID patch.
details: |-
  The DB8E controller has a display, eight push buttons and an endless encoder with push function (knob). Unlike all other DROID controllers, it does one thing automatically as soon as you put it in your patch: It shows useful information of functions running in your DROID (note values, curve characteristics, BPM, values in cables, percentages, Volt, …). In this mode the buttons and the encoder are used to control the contents of the display. To help you navigate in this mode the DB8E comes with a small sheet of stickers. In addition, you can use the buttons and the encoder as regular controls in your patch. The DB8E is a great choice if it is your first or your only controller. With the buttons it is possible to "overlay" the encoder with various functions, so you are not limited to controlling just one parameter. Also you can inspect values throughout your system using the display. As example: There's a gauge with different visualizations you can use for reading notes from a tuner input or visualizing the depth of a modulation that you apply. Some circuits like the motoquencer, the calibrator or the vcotuner display custom information to help you make better decisions. The content on the display is to some extent customizable. Read more about that in the manual. Shipping includes a short ribbon cable for connecting the controller to the master or to the previous controller. If you want to place the controller further away from the master, you can purchase longer ribbon cables in the shop. Current Draw: 40 mA +12V (max. 103 mA) | 0 mA -12V | 0 mA 5V
