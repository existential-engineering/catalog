description: >-
  The Sequential Circuits Prophet 2000 is an early 12-bit sampler from 1985 featuring 8 voices
  of polyphony with analog VCFs and VCAs per voice, allowing hands-on analog processing of
  sampled sounds via a velocity-sensitive 61-key keyboard.
details: |-
  Released in 1985, the Prophet 2000 was Sequential Circuits' entry into the sampler market,
  offering a more affordable alternative to high-end sampling instruments of the era. Its
  distinguishing feature was the combination of digital sampling with analog signal processing,
  giving each of its eight voices a dedicated analog voltage-controlled filter and VCA with ADSR
  envelope shaping.

  The 12-bit sampler could record at three sample rates: 16 kHz, 32 kHz, and 42 kHz, with 256
  to 512 KB of onboard memory providing roughly 30 seconds of sampling time. Samples were stored
  on 3.5-inch floppy disks. While the sampling specifications were modest even by mid-1980s
  standards, the lo-fi character combined with analog filtering gave the instrument a distinctive
  sonic quality that remains appealing for creative sound design.

  A rackmount variant, the Prophet 2002, was also available for studio integration. The Prophet
  2000 found its way into the setups of notable artists including Depeche Mode, Hardfloor,
  Ultravox, Information Society, Mark Isham, John Carpenter, and D:ream, who valued its ability
  to add analog warmth and character to sampled material.
specs: |-
  - Polyphony: 8 voices
  - Sampling: 12-bit resolution at 16 kHz, 32 kHz, or 42 kHz
  - Memory: 256-512 KB (approximately 30 seconds)
  - Storage: 3.5" floppy disk
  - Filters: 8 analog VCFs (1 per voice)
  - Envelopes: 8 analog ADSR (1 per voice)
  - Keyboard: 61 keys, velocity-sensitive
  - Arpeggiator: Yes
  - Connectivity: MIDI
  - Rackmount variant: Prophet 2002
  - Date produced: 1985
releaseDate: "1985"
