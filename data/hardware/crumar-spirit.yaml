description: >-
  The Crumar Spirit is a fully featured analog monosynth designed by Bob Moog, Jim Scott, and Tom Rhea,
  offering two VCOs and a flexible multimode filter section that surpasses the Minimoog in versatility.
details: |-
  Released in 1983, the Crumar Spirit bears an impressive design pedigree. Bob Moog, Jim Scott, and Tom Rhea collaborated on its creation, bringing Moog-caliber analog engineering to Crumar's more affordable platform. While its two VCOs produce a slightly thinner tone than the three-oscillator Minimoog, the Spirit compensates with considerably greater flexibility.

  The oscillator section provides sawtooth, triangle, and square waveforms with oscillator sync capability across a range from 32' to 4'. A white and pink noise generator supplements the oscillators for percussive and textural effects. The filter section is particularly impressive, offering low-pass, high-pass, and band-pass modes with switchable 12dB and 24dB slopes, plus a dedicated overdrive circuit.

  Modulation is handled by two distinct sources: MOD-X offers triangle, square, random, sample and hold, red noise, and oscillator B modes, while SHAPER-Y operates as a free-running waveshaper or simple sine wave. A built-in ring modulator and three-pattern arpeggiator add further sonic possibilities.

  The hands-on control surface is generous for an instrument of this class, featuring 24 knobs, 10 switches, and 15 sliders, plus three performance wheels for pitch and modulation effects. The 37-key keyboard connects via CV/Gate for integration with other analog gear.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, square, triangle; 32' to 4')
  - Oscillator Sync: Yes
  - Noise: White and pink generator
  - Filter: 3 modes (Low Pass, High Pass, Band Pass); 12dB/24dB switchable slopes
  - Filter Features: Cutoff, resonance, keyboard tracking, overdrive
  - LFO/Mod: MOD-X (triangle, square, random, S&H, red noise, OSC B); SHAPER-Y (waveshaper or sine)
  - Effects: Ring modulator
  - Arpeggiator: 3 patterns
  - Keyboard: 37 keys
  - Controls: 24 knobs, 10 switches, 15 sliders, 3 performance wheels
  - Memory: None
  - Connections: CV/Gate
