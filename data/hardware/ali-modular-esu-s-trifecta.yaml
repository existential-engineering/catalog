details: |-
  Esu's Trifecta is a powerful stereo multi-effects Eurorack module designed to be the ultimate tool for shaping, manipulating, and transforming sound. Whether used as an end-of-chain effects processor, a sound design tool, or an all-around sound manipulator, Esu delivers creative possibilities for musicians, sound designers, and live performers alike. Inspired by the Orisha Esu

  Esu draws its essence from the African orisha Esu, the mischievous trickster and guardian of the crossroads. Known for bringing confusion and unpredictability, Esu ultimately works to promote balance, order, and harmony. This ethos is deeply embedded in the module's design: Esu's Trifecta creates opportunities for unpredictable sonic exploration while providing the tools to mold your sound into harmony and order. Just as Esu signifies infinite possibilities, this module opens up limitless pathways for creativity and sound sculpting. 16HP

