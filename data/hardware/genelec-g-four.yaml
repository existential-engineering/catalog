description: "If you're looking for higher playback levels and more low
  frequency extension, the G Four offers an exquisite balance of sonic purity
  and energy - making it perfect for larger spaces."
details: |-
  The G Four is an active two-way home audio loudspeaker from Genelec's G Series, positioned as the model for listeners who want higher playback levels and more low-frequency extension than the smaller G Three while keeping the same compact aluminium cabinet philosophy. Genelec frames it as 'an exquisite balance of sonic purity and energy', targeted at slightly larger living rooms, dedicated listening spaces, home theatres and gaming setups where headroom and bass authority matter as much as detail retrieval.

  Driver complement pairs a 165 mm cone bass driver with a 19 mm metal-dome tweeter, each driven by its own 90 W Class AB amplifier through an active crossover at 3000 Hz. Genelec specifies a frequency response of 48 Hz to 20 kHz (plus/minus 2.5 dB) with -6 dB points at 41 Hz and 25 kHz, short-term peak SPL of at least 105 dB and long-term SPL of at least 99 dB at 1 m, so the cabinet stays composed at the kind of levels that defeat smaller bookshelf speakers.

  The enclosure is Genelec's Minimum Diffraction Enclosure (MDE) cast in die-cast aluminium, with a rear reflex port and a Directivity Control Waveguide (DCW) shaped into the front baffle to control dispersion and reduce diffraction artefacts. The included Iso-Pod stand decouples the cabinet from the supporting surface and provides tilt adjustment, and the chassis carries integrated mounting points compatible with Genelec's wall, ceiling and stand accessories from the 8000-series mounting catalog.

  Rear-panel room compensation switches let the user adapt the loudspeaker to typical placement issues - bass tilt, bass roll-off, treble tilt and desktop controls - without external processing. Intelligent Signal Sensing (ISS) drops the speaker into a low-power standby (less than 0.5 W) after a configurable period of silence and wakes it instantly on signal return, while protection circuitry guards the drivers and amplifiers against overload.

  Connectivity is intentionally analog-only: a balanced XLR female input and an unbalanced RCA female input share the rear panel, both presenting 10 kOhm impedance, and the speaker accepts universal mains in 100, 120, 220 or 230 VAC variants at 50/60 Hz. The G Four is offered in three cabinet finishes - White (G4AWM), Black (G4AMM) and the unpainted RAW aluminium version - and slots in the G Series between the smaller G Three and the larger G Five.
specs: |-
  - Configuration: Active 2-way home audio loudspeaker
  - Frequency response: 48 Hz - 20 kHz (+/- 2.5 dB)
  - Frequency response (-6 dB): 41 Hz - 25 kHz
  - Short-term max SPL: >=105 dB
  - Long-term max SPL: >=99 dB
  - Self-generated noise: <=10 dB SPL (A-weighted at 1 m)
  - Harmonic distortion: <=2% (50-100 Hz), <=0.5% (>100 Hz)
  - Crossover frequency: 3000 Hz
  - Bass driver: 165 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 90 W Class AB
  - Treble amplifier: 90 W Class AB
  - Mains: 100, 120, 220 or 230 VAC, 50/60 Hz
  - Power consumption (ISS active): <=0.5 W
  - Power consumption (idle): <=10 W
  - Power consumption (full output): 110 W
  - Height (with Iso-Pod): 365 mm
  - Height: 350 mm
  - Width: 237 mm
  - Depth: 223 mm
  - Weight: 9.9 kg (21.8 lb)
  - Enclosure: Minimum Diffraction Enclosure (MDE), die-cast aluminium, reflex port
  - Analog input connector: XLR female, balanced, 10 kOhm
  - Analog input connector: RCA female, unbalanced, 10 kOhm
