description: >-
  The Roland TR-606 Drumatix is a compact analog drum machine that served as the rhythmic
  companion to the legendary TB-303, offering seven classic drum tones with a straightforward
  16-step pattern sequencer.
details: |-
  Released in 1982, the TR-606 was designed to pair with the TB-303 Bass Line, sharing a similar
  form factor and DIN sync connectivity. Together they became cornerstones of early acid house and
  electronic music, despite originally being marketed toward home musicians and guitarists seeking
  simple rhythm accompaniment.

  The 606 features seven analog drum voices including kick, snare, open and closed hi-hats, two
  toms, and a cymbal, each with individual level controls. Its 16-button step sequencer allows
  programming of up to 32 patterns and 8 songs, and uniquely among the x0x drum machines, the 606
  can be edited while running and switching between patterns in real time.

  While its sounds are often described as thin compared to its larger sibling the TR-808, the 606
  has found lasting appeal precisely because of its gritty, lo-fi character. Popular modifications
  from companies like Kenton Electronics and Analog Solutions add individual drum outputs and
  tunable parameters, greatly expanding the machine's versatility in modern studio setups.
specs: |-
  - Voices: 7 analog drum tones (kick, snare, closed hat, open hat, tom 1, tom 2, cymbal)
  - Polyphony: 7 voices
  - Sequencer: 16-step pattern sequencer
  - Memory: 32 patterns, 8 songs
  - Sync: DIN sync in/out, two trigger outputs
  - Output: Mono audio output (expandable via mods)
  - Controls: Individual drum tone level, accent, tempo
