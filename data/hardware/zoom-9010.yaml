description: The 9010 Advanced Sound Processor is a 1U rack digital effect unit with four discrete processors, four inputs and four outputs, able to run up to seven separate effects at once. A multi-routing function changes the internal connections of the unit rather than only the type and order of its effects.
details: |-
  The 9010 Advanced Sound Processor is a single-rack-space digital effect unit with four discrete processors, which Zoom's own copy sums up as four discrete digital processors in one rack space. It carries four independent effect channels, four in and four out, and can run up to seven separate effects at once. A/D and D/A conversion is 16-bit linear at 44.1 kHz, with four-times oversampling on the output filter, a frequency response of 16 Hz to 20 kHz and a dynamic range over 90 dB.

  What separates it from a conventional multi-effect of the period is the multi-routing function, which changes the internal connections and architecture of the device rather than only the type and order of the effects. One routing turns the unit into four independent processors. Another makes it a single multi-effect chain with an effect loop, with user-assignable send and return connections, aimed at guitar. Four routings are built in and more can be loaded from cards.

  Memory holds 60 preset and 60 user programs, and the front-panel card slot takes optional ROM cards for new effect programs and routings and RAM cards for user patches. The effect library is organised into four module types: 15 A-type programs (including Reverb, E/R, Echo, Chorus, Flanger, Phaser, Pitch Shifter, Auto Wah, Equalizer, Enhancer, Noise Gate, Distortion, Amp Simulator, Compressor and Limiter), 13 B-type (adding Gate Reverb, Bend Chorus and Tremolo), 10 C-type and 2 D-type (Reverb D and Multi Chorus).

  The front panel adds a high-impedance input jack with its own level control, mixed into rear input 1, so an electric guitar or keyboard can go straight in. Rear connections are four inputs that take balanced or unbalanced signals depending on the plug used, four outputs, switchable +4 dBm or -20 dBm levels in pairs on both sides, MIDI in and out (the output switchable to THRU), two assignable pedal/footswitch terminals and a terminal for an optional wired remote controller. MIDI covers patch changes by program change, real-time parameter control by control change and patch transfer by system exclusive. The chassis is a 19-inch 1U unit, 482 x 340.5 x 44 mm, 4.5 kg, drawing 25 W from AC mains.
specs: |-
  - Four discrete digital effect processors in one rack space, 4 in / 4 out, up to seven effects usable simultaneously
  - Frequency response 16 Hz to 20 kHz, dynamic range over 90 dB
  - A/D conversion 16-bit linear, D/A conversion 16-bit linear with 4x oversampling filter, sampling frequency 44.1 kHz
  - Inputs: 1 unbalanced high-impedance front panel input plus 4 balanced rear inputs (rear channel 1 can be mixed with the front input)
  - Rear inputs accept balanced or unbalanced signals depending on the plug used (mono plug unbalanced, wired stereo plug balanced)
  - Hi-Z input level -10 dBm to -40 dBm adjustable, front input impedance 470 kohm
  - Rear input impedance 10 kohm at +4 dBm and at -20 dBm, input level switchable per pair (+4 dBm / -20 dBm)
  - Outputs: 4 unbalanced, output impedance 300 ohm at +4 dBm and at -20 dBm, level switchable per pair (+4 dBm / -20 dBm)
  - All audio connectors are standard 1/4-inch phone jacks
  - Memory: 60 preset programs, 60 user programs (expandable by RAM card), 4 routings (expandable by ROM card)
  - A-type effects (15 programs): Reverb A, E/R A, Echo A, Chorus A, Flanger A, Phaser A, Pitch Shifter A, Auto Wah, Equalizer A, Enhancer, Noise Gate, Distortion, Amp Simulator, Compressor, Limiter
  - B-type effects (13 programs): Reverb 1 B, Reverb 2 B, E/R 1 B, E/R 2 B, Gate Reverb, Echo B, Chorus B, Bend Chorus, Flanger B, Phaser B, Pitch Shifter B, Tremolo, Equalizer B
  - C-type effects (10 programs): Chorus C, Flanger C, Phaser C, Pitch Shifter C, Equalizer C, Echo C, Reverb 1 C, Reverb 2 C, E/R 1 C, E/R 2 C
  - D-type effects (2 programs): Reverb D, Multi Chorus
  - Multi-routing function changes the internal connections and architecture, not only effect type and order (user-assignable send and return connections)
  - Front panel card slot for optional ROM cards (effect programs and routings) and RAM cards (user patches)
  - Display: backlit 24 character x 2 row LCD, 2-digit patch number LED, 1-digit group number LED, PEAK x 4 and function indicator LEDs
  - Rear terminals: INPUT 1-4, OUTPUT 1-4, MIDI IN, MIDI OUT (switchable to THRU), PEDAL/SW 1-2, REMOTE
  - MIDI: patch change by program change, real-time effect parameter control by control change, patch and bank transfer by system exclusive
  - Bypass key passes the dry signal only, and works in every mode
  - Power supply AC 50/60 Hz, power consumption 25 W
  - Dimensions 482 (W) x 340.5 (D) x 44 (H) mm (19 x 13-3/8 x 1-3/4 inch), EIA 19-inch 1 rack unit
  - Weight 4.5 kg (9 lb 14 oz)
