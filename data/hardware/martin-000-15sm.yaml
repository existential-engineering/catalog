details: |-
  The Martin 000-15SM is an Auditorium-sized acoustic guitar from the 15 Series, built with all-solid mahogany construction and finished in a warm satin. Its dark mahogany top, back, and sides produce the focused, woody midrange Martin's mahogany models are known for, while the simple appointments keep the instrument's voice and feel at the forefront.

  Vintage-inspired details set this model apart from the standard 000-15M. A 12-fret neck joint moves the bridge toward the center of the lower bout, and a slotted headstock with side-mount nickel tuners completes the period-correct look. An East Indian rosewood fingerboard with abalone dot inlays adds a touch of refinement to the otherwise understated aesthetic.

  Under the hood, non-scalloped spruce X-bracing supports the mahogany top for a balanced, articulate response that opens up with time and playing. The Modified Low Oval neck with standard taper and 1-3/4-inch nut width offers comfortable fingerstyle real estate while still feeling familiar to flatpickers.

  The 000-15SM ships in a softshell case with backpack straps, and is available in both right- and left-handed configurations. Optional onboard electronics (L.R. Baggs Anthem, Fishman Gold+Plus, or Fishman Matrix Infinity) can be added as a factory upgrade.
specs: |-
  - Body Size: 000-12 Fret (Auditorium)
  - Top: Solid Mahogany, satin finish
  - Back & Sides: Solid Mahogany, satin finish
  - Bracing: Non-scalloped Spruce X-brace
  - Scale Length: 25.4 inches
  - Neck Shape: Modified Low Oval, standard taper
  - Neck Joint: 12th fret
  - Fingerboard: East Indian Rosewood with abalone dot inlays
  - Nut Width: 1 3/4 inches
  - Total Frets: 20
  - Headstock: Slotted
  - Tuners: Golden Age bright nickel side-mount
  - Electronics: None (optional L.R. Baggs Anthem, Fishman Gold+Plus, or Fishman Matrix Infinity)
  - Case: Softshell with backpack straps
  - Handedness: Right- and left-handed available
