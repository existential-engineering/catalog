description: The 210ce pairs a Dreadnought body with a solid torrefied spruce
  top and layered walnut back and sides, delivering powerful acoustic tone with
  clarity, projection, and mature warmth alongside a Venetian cutaway and
  Expression System 2 electronics.
details: |-
  Part of Taylor's 200 Series, the 210ce features a Dreadnought body shape with a solid torrefied spruce top and C-Class bracing. The torrefied top delivers clarity, balance, and projection with aged-in warmth, while layered walnut back and sides provide crisp highs balanced by a deep, woody low end.

  The Neo-Tropical Mahogany neck features a Standard Carve profile, and the West African Crelicam Ebony fretboard offers smooth playability with faux pearl dot inlays. The 25-1/2" scale length and 1-11/16" nut width suit a wide range of playing styles.

  Taylor's Expression System 2 electronics use a behind-the-saddle pickup design that captures the guitar's full dynamic range for natural-sounding amplified tone. The guitar ships with a padded gig bag.
specs: |-
  - - Body shape: Dreadnought
  - Top: Torrefied Spruce (solid)
  - Back/sides: Walnut (layered)
  - Bracing: C-Class
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-11/16"
  - Electronics: Expression System 2 (ES2)
  - Finish: Matte
  - Strings: D'Addario XS Coated Phosphor Bronze Medium (.013-.056)
  - Tuners: Die-Cast Chrome
  - Case: Gig bag included
