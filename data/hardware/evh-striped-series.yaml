description: With a career of being copied, the EVH Striped Series guitars put
  Eddie Van Halen's historic and authentic style in your hands. These are high
  powered, high-performance machines as kickbutt to look at as they are to play.
  The Striped Series guitar features a basswood Stratocaster-style body decked
  out in Eddie's famed striped graphics - Red with Black Stripes, Black with
  Yellow Stripes and White with Black Stripes. These unique guitars also have a
  graphite-reinforced bolt-on quartersawn maple neck with a hand-rubbed oil
  finish on the back, 12"-16" maple fingerboard with 22 jumbo frets and black
  dot inlays and a thumbwheel truss rod adjustment wheel for convenient neck
  relief tweaks. Powered by a single ferocious direct-mount Wolfgang humbucking
  bridge pickup, the Striped Series guitars also feature a single skirted
  Strat-style volume control knob (labeled "tone") that houses a 500K EVH Bourns
  low friction pot with treble bleed circuit, single-ply black pickguard (White
  with Black Stripes model only), bar string retainer and Floyd Rose locking
  nut, EVH-branded Floyd Rose locking tremolo with EVH D-Tuna, EVH die-cast
  tuners, chrome hardware, vintage-style strap buttons, EVH neck plate and
  licensed Fender Strat headstock. The White with Black Stripes model also
  features a top-mount output jack.
