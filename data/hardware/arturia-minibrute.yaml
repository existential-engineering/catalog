description: >-
  The Arturia MiniBrute is an affordable, all-analog monophonic synthesizer
  announced in 2012, featuring VCO oscillators, a Steiner-Parker filter, and
  modern connectivity options.
details: |-
  Announced in January 2012, the MiniBrute created significant buzz at Winter NAMM 2012 as the first new mass-market analog VCO synth in years from a soft synth company. Priced at $499, it offered hands-on analog synthesis with features competitive with vintage equipment while remaining accessible to modern musicians.

  Sonically, the MiniBrute delivers an aggressive character that can be softened or pushed toward raunchy tones through the Brute Factor distortion control. The multimode Steiner-Parker filter provides versatility beyond typical vintage mono synths, while Ultrasaw and Metalizer controls allow creative waveform manipulation.

  The instrument features a VCO with sub-oscillator, waveform mixer for combining sounds, multimode arpeggiator, and dual envelope generators. Despite its single VCO design, the waveform flexibility and sub-oscillator enable sonic possibilities approaching polyphonic unison modes.

  Constructed with an aluminum body and rubber end caps, the MiniBrute is rugged and portable. It integrates seamlessly into various setups through CV, MIDI, and USB connectivity, making it suitable for vintage, modern MIDI, or modular environments.

  The design emphasizes hands-on control with no menus or presets, providing immediate tactile interaction with synthesis parameters through its knob-based interface.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1 part
  - Oscillators: 1 VCO, 1 Sub-Oscillator (square, sine, -1 or -2 Octave), White Noise, External Audio In, Pulse Width Modulation
  - Waveforms: Sub, Sawtooth, Square, Triangle, and White Noise
  - LFO: LFO1 (Sine, Triangle, Sawtooth, Square, Random Square, Random Sine); LFO2 (3 Vibrato modes)
  - Filter: Steiner-Parker 2-pole Multimode (12 dB/octave Low Pass, 6 dB/octave Band Pass, High Pass and Notch) with Keyboard Tracking
  - Envelope: 2 ADSR Envelope Generators
  - Effects: Ultrasaw, Metalizer, Brute Factor
  - Arpeggiator: 4 modes, 4 octave range control, 6 step divisions, 6 Swing modes, Hold
  - Keyboard: 25 note semi-weighted, with aftertouch (assignable to Cutoff or Vibrato amount)
  - Memory: None, patch sheets supplied
  - Control: CV In/Out (Pitch, Filter, Amp), MIDI In/Out, USB MIDI In/Out
  - Weight: 4 kg (8.8 lbs)
  - Date Produced: 2012
releaseDate: "2012"
releaseDateYearOnly: true
