details: |-
  The Germanium Compressor Pro is the Compressor Pro with a Mullard OC75 germanium transistor added to the output stage, configured for 1.5 times gain. A little of the regular Comp Pro's precise treble is taken out, and the germanium stage adds a harmonically richer, fatter finish, which is what makes this version a guitar companion rather than a strictly neutral compressor. The initial run was limited to 25 pedals, hand signed and numbered.

  The underlying pedal is a stompbox-sized compressor and limiter built in Oklahoma, designed to work as a studio compressor rather than a guitar-only pedal, accepting a wide range of input levels. It suits recording, polishing live performances, and protecting amplifiers and speakers from overload, across sources from voice and guitar to keyboard, bass or drums.

  Seven controls shape the compression. Threshold, with a bi-colour LED that turns red when the unit is compressing, adjusts between -50dBu and +10dBu. Ratio runs from no compression at 1:1 up to an infinite ratio for hard limiting. Attack covers 0.15ms to 150ms and Release 0.1s to 3s. Gain provides up to 20dB of make-up gain without touching the compression controls. A Knee switch chooses between hard-knee compression and a softer curve, and an Auto switch hands attack and release times to program-dependent detection.

  Metering is a seven-segment LED display reading gain reduction from -1dB to -20dB, driven by an exact RMS detector that senses the true RMS value of the input. The pedal is true bypass.
