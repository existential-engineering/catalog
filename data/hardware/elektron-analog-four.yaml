url: https://www.elektron.se/legacy
description: >-
  Four-voice polyphonic analog synthesizer with dual oscillators per voice, dual
  analog filters, CV/Gate outputs, and Elektron's step sequencer with parameter
  locks. Features Overbridge integration for DAW connectivity.
details: |-
  The Analog Four was a four-voice polyphonic analog synthesizer combining a fully analog signal path with digital precision and control. Each voice features dual analog oscillators with variable waveshapes, oscillator AM and sync modes, two sub-oscillators, and a noise generator.

  The signal path includes a 4-pole analog lowpass ladder filter and a 2-pole analog multi-mode filter with analog overdrive and filter feedback per voice. Modulation includes two assignable LFOs, dedicated vibrato and waveshape envelopes, two assignable envelopes plus an amp envelope per voice.

  Three individual send effects provide chorus, delay, and reverb processing. The built-in step sequencer offers 4 synth tracks, an FX track, and a dedicated CV/Gate track with up to 64 steps per pattern, parameter locks, trig conditions, and six arpeggiators.

  Storage includes 128 projects with 4096 sounds, 128 patterns per project, and 16 songs per project. Overbridge integration enables class-compliant USB audio and tight DAW connectivity. The latest shared firmware is OS 1.52.
specs: |-
  - 4 analog voices with up to 4-note polyphony
  - 2 analog oscillators per voice with variable waveshape, AM, and sync
  - 2 sub-oscillators and 1 noise generator per voice
  - 4-pole analog lowpass ladder filter per voice
  - 2-pole analog multi-mode filter per voice
  - Analog overdrive circuit with filter feedback
  - 2 assignable LFOs, 2 assignable envelopes, plus amp envelope per voice
  - 3 send effects: chorus, delay, reverb
  - Step sequencer: 4 synth tracks, 1 FX track, 1 CV/Gate track
  - Up to 64 steps per pattern
  - Parameter locks, trig conditions, 6 arpeggiators
  - 128 projects, 4096 sounds per project
  - 4 CV/Gate outputs, 2 CV/Expression inputs
  - Class-compliant USB 2.0 Hi-Speed audio
  - Overbridge enabled for DAW integration
  - 48 kHz, 24-bit D/A and A/D converters
  - OLED display
