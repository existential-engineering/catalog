  - amount: 1599.99
    currency: USD
details: |-
  The Tone Master Pro is a comprehensive multi-effects guitar workstation designed to deliver exceptional sound quality and versatility. It combines an intuitive interface with a powerful processing platform, offering musicians a professional-grade guitar processor with extensive tone-shaping capabilities. The device features a proprietary tone master modeling process that accurately replicates over 100 of the world's most popular amps and effects.

  The processor includes a large full-color touchscreen with stunning graphics and an intuitive user interface, making tone editing and preset creation remarkably straightforward. Musicians can create custom presets, customize footswitch assignments, and organize sounds into songs and setlists with remarkable ease. The 10 custom-designed footswitch encoders provide instant access to presets and parameters, allowing for real-time adjustments.

  The tone master pro offers extensive connectivity and integration options, including a USB connection to the tone master pro control app for creating, editing, and sharing presets. Users can access over 500 built-in user presets and download thousands more from the cloud. The device supports 3rd party impulse responses and includes 6000 fender-captured cabinet irs, providing musicians with unprecedented tonal flexibility.

  Advanced features include a 60-second stereo looper, four external effects loops for integrating additional pedals, and true preset spillover for delay and reverb tails. The processor supports Bluetooth wireless audio streaming and is compatible with the mission engineering sp1-tmp expression pedal for real-time parameter control.

  Designed for stage and studio use, the tone master pro is lightweight (under 9 lbs) and features a rugged, stage-friendly form factor. It provides comprehensive input and output options, including instrument and xlr mic inputs, stereo headphone output, and multiple line outputs with balanced and unbalanced configurations.
