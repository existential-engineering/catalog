specs: |-
  - Full-color 7-inch touch screen
  - 10 footswitch encoders with LCD scribble strips
  - Over 100 amp and effect models
  - 6000 Fender-captured impulse responses
  - 4 external effects loops
  - 60-second stereo looper
  - Instrument and XLR mic inputs
  - Bluetooth wireless audio streaming
  - Frequency response: 20 Hz - 20 kHz
  - USB firmware updates
  - Stereo headphone output
  - Compatible with expression pedal
  - Lightweight (under 9 lbs)
  - True preset spillover
  - 3rd party IR support
