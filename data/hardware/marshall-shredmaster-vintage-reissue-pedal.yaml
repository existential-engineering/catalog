  - Authentic reissue of the classic Marshall Shredmaster high-gain distortion pedal
  - Hand-built at Marshall's Bletchley factory in the UK
  - Five-knob layout: gain, bass, contour, treble, volume
  - Fully adjustable tone stack for searing solos and saturated rhythm tones
  - Robust steel chassis
  - 1/4" instrument input and 1/4" output
  - Powered by 9V battery or external 9V DC adaptor (not included)
