description: Authentic reissue of Marshall's classic Shredmaster high-gain
  distortion pedal, hand-built at Marshall's Bletchley factory in the UK.
  Delivers searing solos and saturated rhythm tones via a fully adjustable tone
  stack with gain, bass, contour, treble, and volume controls. Housed in a
  robust steel chassis and finished in the familiar black and gold livery. Runs
  on a 9V battery or an external 9V DC power adaptor (not included).
