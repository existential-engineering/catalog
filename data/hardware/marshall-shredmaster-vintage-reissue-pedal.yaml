description: Authentic reissue of Marshall's classic Shredmaster high-gain distortion pedal, hand-built at Marshall's Bletchley factory in the UK. Delivers searing solos and saturated rhythm tones via a fully adjustable tone stack with gain, bass, contour, treble, and volume controls. Housed in a robust steel chassis and finished in the familiar black and gold livery. Runs on a 9V battery or an external 9V DC power adaptor (not included).
details: |-
  The original Shredmaster was Marshall's first-ever high-gain pedal and has become synonymous with game-changing music throughout the 90s and beyond. The ultimate care has been taken to ensure that this reissue accurately recreates that iconic Shredmaster sound. The pedal casing is accurately modelled on the bespoke design of the original. The gold Shredmaster name, embossed Marshall logo and heavy-duty casing are all right here, exactly as you would expect. Designed and engineered in UK. Made in UK.

  Crafted with precision and care, this pedal is meticulously designed and hand-built at the Bletchley factory. Its authenticity is not only found in its sound but also in its robust construction. Every detail, from the circuitry to the exterior, reflects a commitment to quality and craftsmanship, ensuring that this pedal stands as a testament to the Marshall legacy.

  Faithfully recreate the signature tones that the Shredmaster is renowned for or forge your own path. This pedal offers a versatile platform with its fully adjustable tone control. This means you have the flexibility to dial in the precise tone you desire.

  The pedal opens the door to searing solos, providing a sonic landscape where every note pierces through with precision and power. Whether you are crafting a wall of sound or unleashing scorching solos, this pedal offers swathes of high gain distortion, perfect for saturated rhythm sounds.
