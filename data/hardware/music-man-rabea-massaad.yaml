details: |-
  The Rabea Massaad Artist Series Sabre is the inaugural collaboration between Ernie Ball Music Man and multi-talented musician Rabea Massaad. The guitar incorporates custom design elements tailored to Rabea's playing style: a thicker tapered neck carve, a recessed lower horn for enhanced fret access, and glow-in-the-dark side dot markers.

  Built on an alder body with a thick flame maple top, the guitar features a figured roasted maple neck with ebony fretboard, 22 stainless steel frets, and white Atlanté ring fret markers.

  Electronics include Rabea Massaad signature Bare Knuckle Silo humbuckers, a 5-way lever pickup selector with a push-push split-coil for single-coil access, and 500k volume and tone controls with a 0.022µF tone capacitor. The Music Man vintage rectangular tremolo bridge in black matte and Schaller M6-IND locking tuners round out the hardware. The body cavity is shielded with graphite acrylic resin coating, and the neck attaches via a 5-bolt sculpted joint.

  Available in Emerald Hill, Carian Burst, and Vileblood Burst finishes, with options for a figured roasted maple neck and either maple or ebony fretboard.
specs: |-
  - Body wood: Alder with thick flame maple top
  - Body finish: Satin
  - Body bindings: Natural wood
  - Body dimensions: 12-7/8" wide, 1-3/4" thick, 38-1/8" long
  - Colors: Emerald Hill, Carian Burst, Vileblood Burst
  - Neck wood: Figured roasted maple
  - Neck width: 1-11/16" at nut, 2-1/4" at last fret
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony
  - Fret markers: White Atlanté rings
  - Frets: 22 stainless steel (0.095" x 0.047")
  - Scale length: 25-1/2"
  - Pickups: Rabea Massaad signature Bare Knuckle Silo
  - Controls: 500k volume and tone (0.022µF tone cap)
  - Switching: 5-way lever pickup selector; push-push split-coil for single-coil access
  - Bridge: Music Man vintage rectangular tremolo (black matte)
  - Tuning machines: Schaller M6-IND locking
  - Electronic shielding: Graphite acrylic resin body cavity
  - Strings: 10p-13p-17p-30w-42w-52w
  - Neck options: Figured roasted maple with maple or ebony fretboard
