description: A fixed-cardioid tube microphone distilling the essence of the
  flagship VM1 into a single-pattern design, achieving lower self-noise than the
  variable-pattern original at a more accessible price.
details: |-
  The VM1 pure cardioid is part of Brauner's 'pure cardioid' series, introduced at
  Musikmesse 2009 alongside the VMX pure cardioid. It distills the essence of the successful
  VM1 tube microphone into a new model with a fixed cardioid pattern only.

  Keeping the well-known high-class look and feel, the VM1 pure cardioid shows its
  exceptional qualities in solo recordings and achieves an even better self noise due to its
  fixed pattern compared to the variable-pattern VM1.

  Its attractive price appeals to home studio enthusiasts all the way to the most demanding
  audio purists who do not require the variable patterns of the standard VM1.

  The VM1 pure cardioid ships in a sturdy aluminium case with power supply, VOVOX TubeLink
  cable, and an elastic suspension.
specs: |-
  - Equivalent Noise: < 9 dB A (IEC651)
  - Signal to Noise: > 85 dB (1 Pa/1 kHz-Cardioid)
  - Sensitivity: 28 mV / Pa-Cardioid
  - Pattern: Cardioid
  - Frequency Range: 20 Hz - 22 kHz
  - Max. SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 115 V or 230 V
