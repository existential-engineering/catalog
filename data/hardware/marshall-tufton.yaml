description: Portable Bluetooth speaker with 20+ hours of playtime.
details: |-
  Tufton packs 20+ hours of portable playtime, allowing you to go further for longer. Bluetooth 5.0 technology allows you to connect to a variety of wireless devices with a range of 10 m. Tufton's 3-way design and rear-facing driver produce a clear and articulate sound across all frequencies. Designed and engineered in Sweden. Made in Thailand.

  Marshall signature sound: Tufton is the mightiest portable speaker from Marshall. It is engineered as a 3-way system, producing sound from three separate drivers from the front of the speaker. An additional mid-range driver is located on the rear of the speaker, offering a clear and articulate sound across all frequencies.

  True Stereophonic (360 degree sound): Tufton utilises True Stereophonic, a unique form of multi-directional sound from Marshall. Experience absolute 360 degree sound where every spot is a sweet spot.

  Iconic and rugged design: echoing the legacy of rock and roll, Tufton features the iconic Marshall script and has a solid metal grille that pays homage to the steel mesh grille found on many microphones. It also has flush-mounted corner caps, making it a rugged and durable speaker, and a guitar-inspired carrying strap for easy portability.

  20+ hours of portable playtime: Tufton offers 20+ hours of portable playtime on a single charge, and the battery life can be tracked with the visual battery indicator on the top panel. Its IPX2 rating means it is able to withstand a little water.
specs: |-
  - Driver type: dynamic
  - Frequency range: 40 to 20,000 Hz
  - 3-way system with three front drivers plus a rear-facing mid-range driver
  - Stereo/mono: stereo
  - Maximum sound pressure level: 102 dB at 1 m
  - Cabinet principle: bass-reflex
  - Power amplifiers: one 40 W Class D amplifier for the woofer, two 15 W Class D amplifiers for the full range drivers, one 10 W Class D amplifier for the tweeters
  - Adjustable bass and treble controls via analogue controls on the speaker
  - Wireless connectivity: Bluetooth 5.0, with aptX support
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: 3.5 mm input
  - Top panel controls: Bluetooth button, power/volume knob, bass knob, treble knob, battery indicator
  - Wi-Fi: no
  - Microphone system: no
  - Voice command: no
  - Weight: 4.9 kg / 10.8 lb
  - Width: 229 mm / 9.02"
  - Height: 350 mm / 13.78"
  - Depth: 163 mm / 6.42"
  - Water resistance: IPX2
  - Play time: 20+ hours, approximately 20 hours at medium volume
  - Mains input voltage: 100 to 240 V
  - Mains frequency: 50 to 60 Hz
  - Network standby power consumption: no
  - Colorways: Black, Black and Brass
  - Country of origin: designed and engineered in Sweden, made in Thailand
  - Stand-alone speaker: cannot be paired or grouped with other Marshall speakers, and is not supported by any Marshall branded app
  - Box contents: Tufton portable stereo loudspeaker, mains lead, quick start guide, legal and safety information
