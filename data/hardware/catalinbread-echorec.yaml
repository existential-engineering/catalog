details: |-
  The Catalinbread Echorec is a compact stompbox recreation of the legendary Binson Echorec multi-head drum echo, the effect unit behind Pink Floyd's iconic Pompeii performance. Catalinbread miniaturized the original design into a standard stompbox form factor while significantly extending its capabilities.

  Unlike the original Binson Echorec which was limited to approximately 300ms of delay time, the Catalinbread Echorec offers variable delay from 40ms to 1000ms. Real-time delay time adjustment creates dramatic "spaceship warp" pitch-sweep effects as the delay time is changed on the fly.

  The unit replicates the four playback head concept of the original and makes all 12 program combinations accessible via a 12-position program select switch. Programs 7, 10, and 11 showcase novel rhythmic patterns that were unavailable on the original Binson unit.

  A tilt-style tone control allows shaping of the repeat timbre from dark to bright. The Swell control manages feedback from single repeats up to infinite swirling repeats, while the Mix control blends between dry signal and up to 100% wet.
