description: >-
  The Waldorf Q is a professional virtual analog synthesizer featuring up to 32 voices and
  16 multitimbral parts. It employs digital emulation to faithfully reproduce analog
  synthesizer sounds with state-of-the-art control and precision, offering 58 knobs for
  hands-on sound design.
details: |-
  The Waldorf Q was originally released in 1999 as a large, bright yellow instrument, though newer versions come in dark grey. It represents Waldorf's commitment to combining the raw power of analog synthesis with modern technology, stability, and creativity.

  The instrument features an impressive sonic architecture with three oscillators per voice offering sawtooth, triangle, sine, PWM, and innovative oscillator algorithms. Sound shaping is handled by two 12/24dB filters with multiple modes including lowpass, bandpass, highpass, notch, comb, and ring modulation, complemented by FM and distortion capabilities. Four envelope generators with ADSR, looping, and one-shot functions provide dynamic control.

  The Q boasts powerful sequencing capabilities with an arpeggiator supporting user patterns, accents, timing, swing, glide, and chord options. The onboard sequencer offers 100 user patterns with 32 steps per pattern and polyphonic capability. Professional-grade effects processing includes eight effect processors providing chorus, flanger, phaser, overdrive, AM, delay, reverb, and more.

  A variant called the Q+ adds 16 analog filters and supports up to 100 voices of polyphony, offering enhanced sonic possibilities for demanding users.
specs: |-
  - 16 to 32 voices of polyphony
  - 16 multitimbral parts
  - 3 oscillators per voice (sawtooth, triangle, sine, PWM, advanced algorithms, noise generator)
  - 2 filters per voice (12/24dB switchable; lowpass, bandpass, highpass, notch, comb, ring mod)
  - 4 envelopes (ADSR with loop and one-shot)
  - 3 LFOs with ramp, sine, square waveforms
  - 8 effect processors (chorus, flanger, phaser, overdrive, AM, delay, reverb)
  - 300 single programs, 100 multi programs
  - 58 knobs, all MIDI controllable
  - 61-key keyboard with velocity and aftertouch
  - Arpeggiator with user patterns
  - Polyphonic sequencer with 100 patterns, 32 steps
  - 2 analog audio inputs
  - 6 audio outputs plus S/PDIF (44.1kHz/48kHz)
  - MIDI with 16-part multitimbral support
  - CV control
  - Vocoding capability
