description: Langevin all-discrete Pultec style EQ
details: |-
  The Langevin All-Discrete Pultec EQP-1a is a single-channel, 1U program equalizer that reimagines the classic Pultec EQP-1A passive EQ circuit with an all-discrete, solid-state make-up gain stage rather than the tube amplifier of the original.

  It pairs the legendary Western Electric passive EQ topology with modern engineering for enhanced clarity, low noise, and stable operation. The input stage has a transformer-coupled option while the output stage is transformerless, distinguishing it from the Manley tube version. Continuously variable pots are used in place of stepped switches for silent adjustment, and the unit is hand-built in California.
specs: |-
  - Single-channel program equalizer (1U)
  - Passive EQ circuit (Western Electric Pultec EQP-1A topology)
  - All-discrete solid-state make-up gain stage
  - Transformer-coupled input (optional), transformerless output
  - Frequency Response: 10 Hz – 60 kHz
  - THD + Noise: < 0.04%
  - Max Output: +28 dBv
  - Continuously variable pots for silent operation
  - Dimensions: 19" x 1 3/4" x 10" (1U)
