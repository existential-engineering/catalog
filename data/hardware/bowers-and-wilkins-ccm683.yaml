details: |-
  The CCM683 is a true high performance ceiling-mount speaker. The speaker features a 200mm (8in) woven blue Aramid Fibre cone bass/midrange driver and an aluminium tweeter in a neat circular die-cast chassis.

  The tweeter’s housing pivots for adjustable off-axis treble response and the die-cast chassis provides extra rigidity that results in a cleaner, faster bass. The speaker also has a three-position EQ switch for a better off-axis response.

  The blue Aramid Fibre cone means that the unit is well hidden behind the grille but still produces a remarkably clear and dynamic sound. An in-ceiling speaker with 200mm Aramid mid/bass and 25mm aluminium-dome tweeter means big, precise sound.

  CCM6 Series ceiling mount speakers comprise a baffle carrying the speaker drivers and crossover, a mounting frame (with integrated bezel), and a magnetically secured grille. CCM683 requires a ceiling aperture diameter of 251mm (9.9in) and clear depth behind the sheetrock (plasterboard) of 140mm (5.51in).
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) Nautilus swirl loaded aluminium dome tweeter
  - Drive units: 1x ø200mm (8in) blue Aramid Fibre cone bass/midrange
  - Frequency range (-6dB): 35Hz – 50kHz
  - Recommended amplifier power: 25 – 130W
  - Sensitivity SPL (2.83V, 1m): 88dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 250mm (9.8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C8
  - Back box: 6C
  - Ceiling aperture diameter: 251mm (9.9in)
  - Required clear depth behind plasterboard: 140mm (5.51in)
  - Pivoting tweeter housing and three-position EQ switch
  - Finish: White
