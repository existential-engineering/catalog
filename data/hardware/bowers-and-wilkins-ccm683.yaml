description: An in-ceiling speaker with 200mm Aramid mid/bass and 25mm
  aluminium-dome tweeter means big, precise sound.
details: |-
  CCM683 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Performance Series, pairing a 25mm (1in) Nautilus swirl loaded aluminium dome tweeter with a 200mm (8in) woven blue Aramid Fibre cone bass/midrange driver in a circular die-cast chassis. Bowers & Wilkins presents it as a true high performance ceiling-mount speaker rather than a background-music fitting.

  The tweeter housing pivots, so treble can be aimed at the listening position and the off-axis response adjusted after the speaker is in the ceiling. A three-position EQ switch on the speaker gives a further off-axis correction, which is the usual answer to a ceiling speaker sitting well away from where people actually sit.

  The die-cast chassis of the bass/midrange driver is credited with the extra rigidity behind a cleaner, faster bass, and the blue Aramid Fibre cone is described as keeping the driver visually hidden behind the grille while still producing a remarkably clear and dynamic sound.

  It is a passive loudspeaker driven from an external amplifier: 8 ohms nominal with a 4.5 ohm minimum, 88dB sensitivity measured at 2.83V and 1m, and a recommended amplifier power of 25W to 130W. Its quoted frequency range is 35Hz to 50kHz at -6dB, the same reach as the larger CCM682 with 1dB less sensitivity and 20W less headroom.

  Installation figures match the other 8in models in the series: a 290mm (11.4in) frame over a 250mm (9.8in) cut-out, 133mm (5.2in) of depth needed behind the surface, and a 4mm (0.2in) protrusion once fitted. The matching pre-mount kit is the C8 and the matching back box the 6C. The speaker is offered in White only.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x 25mm (1in) Nautilus swirl loaded aluminium dome tweeter, 1x 200mm (8in) woven blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 35Hz to 50kHz
  - Recommended amplifier power: 25W to 130W
  - Sensitivity SPL: 88dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 250mm (9.8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C8
  - Back box: 6C
  - Pivoting tweeter housing for adjustable off-axis treble response
  - Three-position EQ switch for a better off-axis response
  - Die-cast bass/midrange chassis
  - Passive: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
