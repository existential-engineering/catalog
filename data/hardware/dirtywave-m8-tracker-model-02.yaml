details: |-
  The M8 Tracker Model:02 is a significant update to the M8 Tracker with the same brains and improved physical features: a machined aluminum design, a larger 3.5-inch IPS TFT display (up from the original 2.8-inch), improved battery life of up to 12 hours, a built-in microphone for sampling, and a USB-C port (device mode only).

  The M8 is a portable music workstation built around a tracker-style sequencer. It combines multiple synthesis engines with sample playback across 8 monophonic tracks, and its sequencer can also control external gear over MIDI.

  Stereo audio inputs and outputs, plus MIDI in and out, are on 3.5mm TRS jacks, all placed at the top of the unit. The line output doubles as a headphone output, and the USB-C port acts as a class-compliant stereo audio interface and MIDI device.

  The M8 Tracker Model:02 includes a soft microfiber bag, travel case, USB-C cable, MIDI TRS-A to MIDI DIN adapter, and a 64GB microSD card with song demos, presets, and samples. Manuals and firmware updates are available on the Dirtywave support page.
specs: |-
  - Portable synthesizer, sampler, and tracker-style sequencer
  - 8 monophonic sequencer tracks
  - Multiple synthesis engines plus sample playback
  - 3.5-inch IPS TFT display
  - Machined aluminum enclosure
  - Built-in microphone for sampling
  - Up to 12 hours of battery life
  - USB-C class-compliant stereo audio interface and MIDI device (device mode only)
  - microSD card storage (64GB card included)
  - 96 x 133 x 20 mm
  - Includes soft microfiber bag, travel case, USB-C cable, MIDI TRS-A to MIDI DIN adapter, and 64GB microSD card
