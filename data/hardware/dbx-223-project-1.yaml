details: |-
  The dbx 223 (Project 1) is a discontinued legacy crossover from dbx Professional Audio, designed for professional audio signal routing and frequency division. As a predecessor to the current 223 series, it shared the core function of splitting audio signals across frequency bands for more precise speaker management.

  This unit has been superseded by newer models in the dbx crossover lineup. Documentation remains available through the owner's manual.
