description: >-
  The Roland SC-88 is a 64-voice, 32-part multitimbral General MIDI/GS sound
  module from 1994, part of the Sound Canvas series that became the de facto
  standard for GM sound playback.
details: |-
  Released in 1994 as a half-rack unit, the SC-88 continued Roland's Sound Canvas series that had
  been introduced in 1991 and quickly established itself as the industry standard for General MIDI
  and GS Standard sound module playback. The series became so ubiquitous that GS-compatible
  arrangements were essentially written with the Sound Canvas voice set in mind.

  The SC-88 provides 654 high-quality preset sounds plus 24 drum sound sets, covering a
  comprehensive range of acoustic and electronic instruments. Users can further customize the
  palette through 256 user sounds and two user drum sets, with editable parameters including
  vibrato, filter, and envelope controls allowing meaningful personalization of the factory voices.

  With 64-voice polyphony and 32-part multitimbral capability, the SC-88 can handle complex
  arrangements without running out of resources. The effects section offers eight reverb types,
  eight chorus types, and ten delay types, complemented by a two-band equalizer for overall tonal
  shaping. A backlit LCD screen provides visual feedback for editing and patch selection.

  The unit features standard MIDI In, Out, and Thru connections along with a computer connection
  port for direct integration with sequencer software. Audio input and output jacks round out the
  connectivity, making the SC-88 a self-contained playback solution for MIDI-based music
  production and multimedia applications.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 32 parts
  - Sounds: 654 preset, 24 drum sets, 256 user sounds, 2 user drum sets
  - Effects: 8 reverb types, 8 chorus types, 10 delay types, 2-band EQ
  - Display: Backlit LCD (70.6 x 24.5mm)
  - MIDI: In, Out, Thru, computer connection port
  - Format: Half-rack
  - Audio I/O: Input and output jacks
