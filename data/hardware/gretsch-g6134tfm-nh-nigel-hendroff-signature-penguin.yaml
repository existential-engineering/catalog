details: |-
  Worship guitarist, songwriter and producer Nigel Hendroff has spent the last two decades developing a distinct playing style and sound. The G6134TFM-NH Nigel Hendroff Signature Penguin distills that voice into a stage-ready single-cutaway built for power, articulation and sustain.

  Chambered Mahogany Body with Flame Maple Top: A single-cutaway chambered mahogany body with a laminated flame maple top delivers a livelier, more articulate tone with the air, resonance and depth that define the Penguin family.

  Broad'Tron BT-65 Pickups: Dual Broad'Tron BT-65 humbuckers provide wall-shaking power and full-spectrum fidelity, equally at home for big chordal swells and articulate single-note work.

  Signature Appointments: Tortoise pickguard, mother-of-pearl Big Block fingerboard inlays, nickel hardware, jeweled Arrow knobs, Grover Imperial locking tuners and a Bigsby B7CP String-Thru tailpiece complete the signature look in Amber Flame.
