description: A downsized Audio Routing Controller that inherits the versatility,
  sonic quality and durability of the ARC-3, with the HTS (Holistic Tonal
  Solution) circuit driven by internal plus/minus 15 VDC and control of MIDI
  devices packed into a smaller housing.
details: |-
  The ARC-53M is a downsized Audio Routing Controller that inherits the versatility, high sonic quality and high durability of the Free The Tone ARC-3. The basic features of the larger unit, the HTS (Holistic Tonal Solution) circuit driven by an internal plus/minus 15 VDC supply and the control of MIDI devices, are carried over without compromise into a smaller housing, so professional quality routing fits on a smaller pedalboard.

  The HTS circuit handles the interface section of an effects unit, its input and output, and is built from three separate stages: an Input Circuit, a Noiseless Effect On/Off Circuit and an Output Driver Circuit. The input stage receives the signal according to the conditions of the source and strips noise from unnecessary frequency bands before the signal reaches the effect circuit. The on/off stage uses no switching element such as an FET, so it transfers the guitar sound without the dullness or distortion typical of electronic switching. The output driver keeps the output impedance fixed whether the unit is on or off, so the effected and bypassed sounds have the same sound quality.

  Routing is built around five loops, four in series and one separate, with 200 presets arranged as 20 banks of 10. Three control terminals are switchable between latch and momentary operation. Four MIDI program change numbers and four MIDI control change numbers can be sent in parallel, with send channels CH1 to CH4 fixed, and the display mode can be switched to show the program change number currently being sent on each channel at a glance.

  Silent-click custom footswitches respond quickly to fast operation and sit 70 mm apart, with the first and second rows mounted at different angles for playability on a compact body. Each footswitch LED is covered by a lens so sweat and other moisture cannot reach the internal circuits, and a felt sheet behind the display unit adds further protection. Preset and bank copy and delete functions are provided, and a dedicated panel keeps the edit menu shallow so that editing takes less time.

  The unit draws approximately 400 mA at most from a 12 VDC AC adapter, which is supplied, and measures 330 by 92.5 by 60.5 mm including protuberances such as footswitches and jacks at approximately 1.1 kg. A black version is manufactured to order.
specs: |-
  - Number of loops: 5 (series loop: 4, separate loop: 1)
  - Number of presets: 200 (20 banks x 10 presets)
  - Control terminals: 3 (latch/momentary switchable)
  - Input impedance: 1 MOhm (HTS-IN)
  - Output impedance: max. 200 Ohm (OUT)
  - Power supply: 12 VDC AC adapter
  - Current consumption: approx. 400 mA (max.)
  - Dimensions: 330W x 92.5D x 60.5H mm (incl. protuberances such as footswitches, jacks, etc.)
  - Weight: approx. 1.1 kg (excl. accessories)
  - Number of MIDI program change number parallel sends: 4 (MIDI send channels CH1 to CH4 fixed)
  - Number of MIDI control change number parallel sends: 4
  - Accessories: warranty card, manual, AC adapter (FA-1220D-JA/UK/EU), 4x rubber feet
