description: >-
  The Jazz Fest Series Snare Drum returns to market with the presence of a
  generation. A 5.5"x14" 3-ply Legacy Mahogany shell with a vintage '64 snare
  bed, 8 twin lugs, 3-step baseball bat tone-control, and a white Reso-Coat
  interior recreate the classic 1960s Ludwig sound.
details: |-
  Ludwig's Jazz Fest Series Snare Drum is a 'big fish' in the company's extensive collectible drum catalog, with origins tracing back to the 1950s Buddy Rich Model and evolving into its current form in the early 1960s. The reissue captures the look, feel, and tone of those iconic vintage snares that helped define the recorded drum sound of the era.
specs: |-
  - Size: 5.5" x 14"
  - Shell construction: 3-ply Legacy Mahogany
  - Snare bed: Vintage '64 snare bed
  - Lugs: 8 twin lugs
  - Tone control: 3-step baseball bat tone-control
  - Interior: White Reso-Coat
  - Available finishes: Vintage Black Oyster (LS9081Q), Vintage Blue Oyster (LS9082Q), Mod Orange (LS90851), White Marine Pearl (LS9080P), Silver Sparkle (LS9080S), Blue Sparkle (LS90832), Sky Blue Pearl (LS90852), Black Galaxy (LS908BG)
