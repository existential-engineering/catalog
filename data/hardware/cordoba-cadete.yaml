details: |-
  The Cadete is a handmade 3/4 size nylon string guitar built with a solid Cedar top and Mahogany back and sides. Its traditional 7-fan bracing produces a rich Spanish sound despite its reduced string length (615mm scale length). Beautiful hand-crafted elements such as an all-natural wood rosette, Indian Rosewood binding, and a lightweight gloss PU finish distinguish the Cadete from other entry-level guitars in its price range. Like all Córdoba guitars, a lightweight adjustable truss rod is built into the neck for stability.
