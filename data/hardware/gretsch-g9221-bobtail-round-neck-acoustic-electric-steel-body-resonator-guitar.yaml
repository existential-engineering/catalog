details: |-
  With innovation at its core, the Gretsch G9221 Bobtail Steel Round-Neck A.E. will impress your audience with its sweet quality of tone at cutting volumes. Features all-steel body with Gretsch Ampli-Sonic 'Spider' cone diaphragm hand-spun from nearly 99 percent pure aluminum, paired with a round mahogany neck and padauk fingerboard.

  Equipped with a Fishman Nashville Resonator Pickup for amplified performance, plus Grover Sta-Tite tuning machines and a weathered trapeze tailpiece. Part of the Gretsch Roots Collection, finished in weathered 'Pump House Roof'.
specs: |-
  - Series: Roots Collection
  - Body: Steel, Resonator shape, Non-Cutaway
  - Neck: Mahogany, open-pore semi-gloss urethane finish
  - Scale Length: 25"
  - Fingerboard: Padauk, 15.75" radius
  - Frets: 19 medium jumbo
  - Bridge: Spider - Fishman Nashville
  - Tailpiece: Weathered Trapeze
  - Tuning Machines: Grover Sta-Tite
  - Hardware: Chrome
  - Electronics: Fishman Nashville Resonator Pickup
  - Strings: D'Addario EJ16 Phosphor Bronze Light (.012-.053)
  - Color: Weathered Pump House Roof
