details: |-
  The RAH is Catalinbread's tribute to Jimmy Page's legendary 1970 performance at London's Royal Albert Hall. The pedal captures the broad tonal palette and giant dynamic range of Page's Gibson Les Paul running through Hiwatt and Marshall amplification — from clean sparkle to full saturation. Handmade in Portland, Oregon. Backed by a 3-year warranty.
