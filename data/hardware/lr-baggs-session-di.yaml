url: https://baggs.co/products/session-di
description: Most players dream of making their acoustic guitar sound the same
  as their favorite record, but those professional studio tools weren’t designed
  for live performance…until now.
details: |-
  Most players dream of making their acoustic guitar sound the same as their favorite record, but those professional studio tools weren’t designed for live performance…until now. The Session DI adds the depth, warmth, and character usually crafted by world-class engineers working with premium studio gear. With simplified, easy-to-use controls, you can bring the magic of the studio straight to your live rig.
specs: |-
  - Volume and Gain controls
  - Saturate control for harmonic saturation
  - Comp-EQ 3-band compressive equalizer
  - Garrett Null notch filter
  - Variable high-pass filter
  - Ground lift switch
  - VU meter for gain optimization
  - Mute footswitch for both 1/4" and XLR outputs
  - All-discrete, 100% analog signal path
  - 9V battery, 9V DC power supply, or 48V phantom power
  - Aluminum, steel, and ABS enclosure with custom carrying case
