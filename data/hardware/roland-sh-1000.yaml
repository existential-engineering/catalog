description: >-
  The SH-1000 was Roland's first-ever instrument, introduced in 1973 as one of
  the first compact affordable keyboard synthesizers in Japan. It is a
  monophonic analog synth with a single oscillator, lowpass filter, ADSR
  envelope, and two LFOs, designed to complement home organs with its wooden
  sheet music stand and organ-style preset selector tabs. Notable users include
  Vangelis, Human League, Blondie, The Band, and Jethro Tull.
details: |-
  The SH-1000 holds a special place in music history as the very first instrument produced by Roland, released in 1973. Designed as a complement to home organs, it featured a wooden sheet music stand above its keyboard and organ-style colored preset selector tabs below the keyboard, reflecting its target demographic of home organists looking to explore synthesis.

  Beneath its approachable exterior, the SH-1000 is a monophonic analog synthesizer with a single VCO feeding a lowpass VCF, an ADSR envelope generator, and two LFOs. It offers 10 preset sounds, though these are fairly basic. The real appeal lies in its ability to create custom sounds, delivering excellent mono-synth bass, lead, percussion, and effects patches. Basic square, ramp, and pulse-width waveforms are available from the oscillator, while the LFOs provide sine, square, and sample-and-hold modulation.

  Additional features include white noise, pink noise, portamento, octave transposition, and a Random Note Generator. The synthesizer also features distinctive Growl and Wow effects that produce a characteristically aggressive analog sound. Although there is no user memory for saving patches, the simple interface makes it easy to quickly recreate or discover unique sounds.

  A little later in 1973, Roland released the SH-2000 with up to 30 preset sounds but far less flexibility, controls, and features, possibly because the SH-1000 proved somewhat confusing to its target home organist demographic. Today, the SH-1000 is prized by synthesists for its unique sound and historical significance as Japan's first compact synthesizer.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (square, ramp, pulse-width)
  - LFO: 2 (sine, square, sample+hold)
  - Filter: 1 VCF lowpass with frequency and cutoff sliders
  - Envelope: 1 ADSR (VCA)
  - Presets: 10
  - Keyboard: 37 keys
  - Control: CV/Gate
  - Year Produced: 1973-1981
