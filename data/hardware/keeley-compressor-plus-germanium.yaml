details: |-
  Keeley Electronics began in 2001 with a compressor pedal, and that design grew over the years into the four knob Compressor and then the Compressor Plus, each version adding control while keeping the feel of the original. The Compressor Plus Germanium marks 25 years of the company by returning to that first product and moving the circuit forward.

  At the centre of the pedal is a Japanese-style germanium transistor, used in both the audio output section and the compressor's side-chain feedback circuit. The change is to the circuit rather than the finish, so the pedal keeps the control and versatility of a Keeley compressor while taking on the response of germanium.

  The control layout is the one the Compressor Plus established. Level sets output volume, Compression sets the amount of compression and sustain, Tone shapes the top end of the compressed signal, and Blend mixes the dry signal back in. Blend is the control that lets sustain and control be added without losing the natural attack of the instrument, covering everything from subtle compression to a heavily compressed sound.

  The pedal offers true bypass and buffered bypass, switchable on the fly, so it drops into a wide range of pedalboards. It runs on 9V to 18V DC with a standard centre-negative connection and draws 25mA, and it is built in Oklahoma. Two colourways are offered: a standard brushed aluminium and a Custom Shop exclusive transparent black.
