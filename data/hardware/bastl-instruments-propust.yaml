name: Propust
manufacturer: bastl-instruments
primaryCategory: filter
categories:
  - discontinued
capabilities:
  - filter
url: https://bastl-instruments.com/eurorack/modules/propust
description: Compact triple passive filter with fixed cutoff frequencies for
  highpass and lowpass stages. Features three highpass 2-pole filters (cutoffs
  ~7kHz, ~3.5kHz, ~220Hz) and three lowpass 1-pole filters (cutoffs ~1.5kHz,
  ~4.1kHz, ~880Hz). The passive design requires no power connection but produces
  signal attenuation. Can clean up a final mix and make room for each sound, or
  filter noise in drum synthesis. When signals pass through both HP and LP
  stages, they create bandpass filtering.
details: |-
  2HP, 15mm depth. Passive — no power required. Triple highpass 2-pole RC filters (~7kHz, ~3.5kHz, ~220Hz). Triple lowpass 1-pole RC filters (~1.5kHz, ~4.1kHz, ~880Hz). Chaining HP and LP outputs creates bandpass filtering.
