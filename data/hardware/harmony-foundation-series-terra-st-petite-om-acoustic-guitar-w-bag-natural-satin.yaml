details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra ST Petite OM's solid spruce top brings a trio of benefits: a well-balanced tone, enhanced dynamic response, and a sound that gets enriched over the years. Its okoume neck is notably light and ensures tonal clarity and resonance. Solid spruce X-bracing helps to deliver sound projection with remarkable depth, while rounded fret ends further add to the guitar refinement, removing any sharpness for a smoother playing experience. The Terra ST Petite OM comes pre-strung with D'Addario EXP16 coated strings, promising lasting bright tones for every performance. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
