description: A signature model created with Jason Becker, based on his DC200
  "Bluey" guitar and designated the JB200. Specifications such as the 14 in
  fingerboard radius, M22SD bridge humbucker and M22V neck pickup follow the
  original instrument.
specs: |-
  - Model designation: JB200
  - Construction: neck-through
  - Body: alder with flamed maple top
  - Neck: tung-oiled maple, thinner profile, 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69 in at nut, 0.75 in thick at 1st fret, 0.85 in thick at 12th fret
  - Fingerboard: flamed maple with 14 in radius
  - Frets: 24 stainless steel jumbo, .110 in wide x .055 in tall
  - Scale length: 25 in
  - Headstock: inline pointed with flamed maple overlay, painted to match body
  - Bridge: Original Floyd Rose tremolo, .42 in (10.7 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: M22SD bridge humbucker, M22V neck humbucker
  - Electronics: two volume controls, two tone controls, two dual/single coil switches, phase switch, 3-way pickup selector
  - Finish: translucent deep blue
  - Inlays: abalone dots, black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Body dimensions: 39.5 in long, 1.68 in thick, 12.75 in wide
  - Weight: 7.5 lbs
  - Strings: Elixir Nanoweb 1046E
  - Kiesel and Carvin logos available
