url: https://coleselectroacoustics.com/ce-3000-tweeter/
description: The CE 3000 is a tweeter drive unit from Coles Electroacoustics
  designed for use in speaker systems with a usable frequency response of 2.5kHz
  to 13kHz. It features a polyflex cone and paper coil former, available in 7
  ohm and 16 ohm impedance variants.
details: |-
  The CE 3000 Tweeter is a drive unit manufactured by Coles Electroacoustics, a British
  company with a long heritage in professional audio transducer design. It is intended
  for integration into loudspeaker enclosures where high-frequency reproduction is required.

  The tweeter covers a frequency range of 1.2kHz to 15kHz, with a recommended usable
  operating band of 2.5kHz to 13kHz (±3dB). Its free air resonance is 1.6kHz, making
  it suitable for crossover points in the 2.5kHz region.

  Two impedance variants are available: the /K variant at 7 ohms nominal and the /G
  variant at 16 ohms nominal, offering flexibility for different crossover and amplifier
  configurations. Non-standard impedances can also be specified on request.

  The driver uses a polyflex cone and a paper coil former with a 19mm coil diameter,
  mounted within a 22mm piston. Flux density is rated at 10,000 Gauss. Maximum
  continuous sine power handling is 7W RMS, with a system programme rating of 100W.

  The unit measures 95mm in diameter with a mounting hole of 73mm and a depth of
  31mm, weighing 353g. Front flush mounting on a baffle is recommended.
specs: |-
  - Frequency Range: 1.2kHz–15kHz
  - Usable Frequency Response: 2.5kHz–13kHz (±3dB)
  - Free Air Resonance: 1.6kHz
  - Nominal Impedance: /K = 7 ohm; /G = 16 ohm
  - DC Resistance: /K = 6 ohm; /G = 16 ohm
  - Max Continuous Sine Power: 7W RMS
  - System Programme Rating: 100W
  - Flux Density: 10,000 Gauss
  - Sensitivity: /K 87dB; /G 88dB (1W/1m)
  - Piston Diameter: 22mm
  - Coil Diameter: 19mm
  - Mounting Hole: 73mm
  - Overall Diameter: 95mm
  - Depth: 31mm
  - Weight: 353g
  - Cone Material: Polyflex
  - Coil Former: Paper
  - Mounting: Front flush on baffle (recommended)
