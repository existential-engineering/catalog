description: UK-built, ultra-compact 300-watt 1x12" combo finished in Ice Blue.
  Lightweight yet powerful, it features a responsive 5-band EQ, classic Shape
  circuit, FX Loop, and a premium Sica NEO 12" speaker housed in durable
  Charcoal Tweed with a Silver Weave grill. A clean, portable solution for
  rehearsals, small gigs, and home playing.
details: |-
  The Ashdown UK-OBM-C112-300 is a UK-built bass combo designed for players who need practical power, dependable tone, and true portability. Finished in bold Ice Blue and driven by a 300-watt power section, it provides ample volume and clarity for rehearsals, smaller venues, and home practice without the need for additional cabinets. At its centre is a high-quality Sica NEO 12" speaker with tweeter, chosen for balanced voicing and musical character. Tone shaping is handled by a responsive 5-band EQ and the familiar Shape function, while an integrated FX Loop allows external effects to be incorporated cleanly into the signal path. A headphone output supports silent practice.
specs: |-
  - Power output: 300 Watts
  - Power requirement: 115-230 Volts
  - Minimum impedance: 4 Ohms
  - Speaker configuration: 1 x 12" NEO + Tweeter
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.5kHz, Treble +/-15dB @ 7kHz
  - H x W x D: 470 x 606 x 381 mm
  - Net weight: 13.5 kg
