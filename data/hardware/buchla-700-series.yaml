description: >-
  The Buchla 700 Series, released in 1987, was the first Buchla synthesizer to implement
  MIDI control, featuring 12 voices and 48 digital oscillators with advanced computer
  integration.
details: |-
  The 700 was groundbreaking for its time, offering three sets of MIDI inputs/outputs alongside CV/Gate, SMPTE, and two RS232 ports, continuing Buchla's tradition of advanced computer control over analog circuitry. The instrument could manage up to 190 acoustic variables and introduced extensive touch-plate implementation across the keyboard and control surfaces for pressure and position sensitivity.

  The synthesizer boasted 12 voices with 4 digital oscillators per voice for a total of 48 oscillators, capable of FM synthesis, waveshape interpolation, and timbre modulation while maintaining analog filters, modifiers, and amplifiers.

  The 700 included sophisticated envelope capabilities with up to 15 envelopes per voice featuring as many as 96 break-points, along with up to 6 modifiers per voice. A centralized LCD display provided editing feedback without requiring an external monitor, and the system ran on MIDAS VII music programming language with built-in disk storage for up to 40 instrument definitions.
specs: |-
  - Polyphony: 12 voices
  - Keyboard: 24 pressure and position-sensitive touch plates
  - Oscillators: 48 digital (4 per voice)
  - Memory: External disk storage, up to 40 instrument definitions
  - Control: MIDI, CV/Gate, SMPTE, RS232
  - Modifiers: Up to 6 per voice
  - Envelopes: 15 per voice with up to 96 break-points
  - Display: Centralized LCD
  - Storage: Built-in 3.5 inch disk drive
