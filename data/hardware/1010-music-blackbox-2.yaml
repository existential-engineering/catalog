description: Born for DAWless music creation and performance, blackbox 2 is the
  professional standard for sample creation and manipulation. From loops to
  one-shots and slices to multisamples, a hi-resolution touchscreen lets you
  record, sequence, play and mix in living color.
details: |-
  Blackbox 2 is a compact, battery-powered sampling studio built for DAWless music creation and live performance. A 4-inch high-resolution color touchscreen drives four flexible tracks supporting Shredder, One-Shot, Loop, Slicer, Multisample, and External instrument types, with step, grid/piano-roll, and probability-based sequencing. Like 1010 Music's bento, it adds dedicated Launch, Scene, and Song screens for real-time clip and scene triggering, expressive pads, resampling tools, and new DJ effects (filter, echo, gater, flanger, bitcrusher, repeater) with XY control.

  The original blackbox has been a staple for producers and live electronic performers, and blackbox 2 is pitched as roughly 2x the power of the original, expanding on that legacy with a new Step Sequencer, Loop Groups for BPM-synced multi-loop playback, automated multisample instrument creation, a four-band EQ (Cut/Shelf/Parametric per band), and a modulation matrix. It streams multichannel USB audio and MIDI over USB-C host and device ports, supports TRS MIDI and analog clock in/out, and runs up to 3 hours on its internal battery for portable production anywhere.
specs: |-
  - 4 inch high-resolution color touchscreen
  - 24-bit ADC and DAC
  - Internal battery with 3-hour play time
  - USB-C host and device ports for multichannel USB audio and MIDI
  - TRS MIDI In and Out (TRS Type B standard, 5-pin DIN adapters included)
  - Analog Clock In/Out supporting 1, 2, 4, 8, 12, or 24 PPQ
  - 1 stereo audio in and 3 stereo outs, plus stereo headphone output
  - microSD card slot for projects, patches, and sample libraries
  - 4 flexible tracks: Shredder, One-Shot, Loop, Slicer, Multisample, or External instruments
  - 16 samples per Patch for One-Shot and Loop instruments
  - Four-band EQ with Cut/Shelf/Parametric settings per band
  - Records up to 4 hours in length
  - Weight: 1.35 lbs
  - Dimensions: 8.75 x 6.5 x 2.5 in
