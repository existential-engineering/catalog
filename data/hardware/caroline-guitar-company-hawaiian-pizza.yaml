description: >-
  The Hawaiian Pizza is a three-knob fuzz pedal from Caroline Guitar Company,
  built from a circuit discovered in the archives of the Caroline Corporation.
  Originally released in 2018 as a fundraiser for a local Girls Rock chapter,
  customer demand brought it into the permanent lineup.
details: |-
  The Hawaiian Pizza fuzz is Caroline Guitar Company's take on a classic fuzz
  circuit, described as capable of fulfilling and surpassing what players expect
  from a fuzz pedal. The company's playful copy frames it as 'the Komodo Dragon
  of the mariguanas' and 'the apex predator of the Planet of the Vapes.'

  The circuit was sourced from the archives of Caroline's predecessor entity, the
  Caroline Corporation, alongside what they describe as 'very 1970s corporate
  villainy and sci-fi plans for world domination.'

  The pedal was first released in 2018 as a fundraiser for a local Girls Rock
  chapter. Customer demand was strong enough that Caroline brought it into their
  permanent lineup shortly after the initial run.

  Two variants exist: the standard Hawaiian Pizza and a 'Soviet Pizza' variant.
  Both share the same three-knob control layout.

  The pedal is made at Caroline Guitar Company's facility in Columbia,
  South Carolina.
specs: |-
