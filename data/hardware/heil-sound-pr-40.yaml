details: |-
  Overview & Features

  The Heil PR 40 is a professional dynamic microphone designed for podcasting, broadcasting, studio and home recording, and live sound reinforcement. Renowned for its warm, articulate, studio-quality sound, the PR 40 effortlessly captures a wide range of voices and instruments without requiring external preamps or complex signal processing.

  Key Applications

  Included Accessories:
specs: |-
  - Podcasting & Voiceover: Offers superior studio-quality audio with excellent rear noise rejection (-40 dB @ 180° off-axis), isolating your voice in non-treated home studios.
  - Broadcast: Delivers traditional, warm broadcast sound trusted by satellite radio stations, major league sports announcers, and broadcast engineers worldwide.
  - Instruments & High SPL: Built to handle powerful sound sources with prominent low-end frequency output up to 148 dB Max SPL, ideal for kick drums, bass cabinets, floor toms, and heavy live amplification.
  - Padded zipper carrying case
  - Mic clip
  - Element Type: Dynamic.
  - Frequency Response: 28 Hz – 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off axis): -40 dB.
  - Impedance: 600 ohms balanced.
  - Output Level (@ 1 kHz): -53.9 dB.
  - Max SPL: 148 dB.
  - Output Connection: 3 pin XLR.
  - Weight: 13.5 oz.
