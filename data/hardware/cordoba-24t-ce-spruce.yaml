details: |-
  The new, 24 series ukuleles offer a combination of exotic tone woods. Spalted Maple back and sides offer a unique look and tone, while a solid Spruce top projects a voice much larger than its size suggests. Deep red, Padauk body, fingerboard binding, and a Padauk rosette add a beautiful pop of burgundy to their already striking appearance. Additional features include a Mahogany neck, and spalted Maple headstock veneer and a satin polyurethane finish. Available in soprano, (24S), concert (24C), tenor (24T), tenor with cutaway and electronics (24T-CE) and baritone (24B).
specs: |-
  - Construction: Solid Top
  - Size: Tenor Cutaway
  - Bridge Material: Rosewood
  - Fingerboard Material: Rosewood
  - Neck Material: Mahogany
  - Nut Material: Bone
  - Saddle Material: Compensated Bone
  - Back and Sides Wood: Spalted Maple
  - Body Top: Solid Spruce
  - Color: Natural (NAT)
  - Finish: Polyurethane
  - Frets to Body: 14
  - Neck Joint: Dowel Joint
  - Neck Shape: C Shape
  - Top Bracing Pattern: Fan
  - Fingerboard Inlays: 4mm Dots - Pearloid
  - Frets Total: 16
  - Headplate: Spalted Maple
  - Nut String Spacing: 29mm
  - Tuning Machines: Córdoba Vintage Open Gear
  - Electronics: Córdoba Active Ukulele Pickup with 2 Band EQ
  - Controls: Volume, Bass, and Treble
  - Nut Width: 38mm (1 1/2")
  - Number of Strings: 4
  - Rosette: Padauk
  - Tuning: G-C-E-A
  - Country of Origin: China
