description: Shorty Deluxe solid body travel guitar.
details: |-
  Offering versatility and convenience in the one compact package, the deluxe model offers the same full-scale length and small overall dimensions as the original model, making it ideal for playing anywhere at any time, whether on the couch or on the road.

  The Shorty Deluxe adds twin Humbucker pick-ups, with a headstock design reflecting the classic Hofner style. This guitar will fit in most overhead lockers in aircraft and comes with a padded Hofner gig bag.
