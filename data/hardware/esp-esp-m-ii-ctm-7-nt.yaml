description: All ESP Original Series instruments are hand-crafted, one at a
  time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan.
  The ESP M-II CTM 7 NT is a seven-string instrument with set-thru construction
  at 25.5" scale, providing extended low-end range and smooth access to the
  highest frets. It features an alder body and a three-piece maple neck, with an
  ebony fingerboard at a comfortable 305mm radius, 24 extra-jumbo stainless
  steel frets, and a graphite nut. Top-tier components include black hardware,
  Gotoh locking tuners, a Hipshot fixed bridge with string-thru body design, and
  a set of EMG 57-7H (bridge) and EMG 66-7H (neck) active humbucking pickups in
  brushed black chrome. Includes a deluxe MH form fit case.
