description: >-
  The Yamaha CS-10 is a single-oscillator analog monophonic synthesizer known
  for its warm, bubbly bass and lead tones, featuring a versatile multimode
  filter and external audio input.
details: |-
  Released in 1977, the CS-10 was part of Yamaha's CS series of analog synthesizers that helped establish the company as a serious contender in the synth market. Its simple, knob-heavy design makes it an immediately playable instrument well suited to electronic, dance, and trance music production.

  The sound engine centers on a single VCO offering sawtooth and variable pulse width waveforms, supplemented by a white noise generator. What the CS-10 lacks in oscillator count it makes up for with a versatile multimode filter switchable between low-pass, band-pass, and high-pass modes, each with resonance capable of self-oscillation.

  An LFO provides sine or sawtooth modulation that can be routed to filter cutoff, volume, pitch, or the VCO directly. Two ADSR envelopes handle amplitude and filter shaping. The 37-key keyboard includes portamento that stretches across one octave for expressive glides between notes.

  A particularly useful feature is the external audio input, which routes outside signals through the filter section for processing. CV/Gate connectivity allows MIDI conversion with the appropriate adapter. The CS-10 has been used by Depeche Mode, Astral Projection, the Propellerheads, and Moa.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO + white noise
  - Waveforms: Sawtooth, Variable Pulse Width
  - Filter: Multimode VCF (Low Pass, Band Pass, High Pass) with resonance
  - LFO: 1 (Sine, Sawtooth)
  - Envelopes: 2 ADSR
  - Keyboard: 37 keys
  - Memory: None
  - Control: CV/Gate
  - Features: External audio input through filter, portamento (1 octave range)
