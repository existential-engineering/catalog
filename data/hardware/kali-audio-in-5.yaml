description: Kali's IN-Series monitors are some of the most innovative studio
  monitors ever made. Combining the natural advantages of a 3-way design with
  hyper-realistic imaging of a co-axial mid-range and tweeter, they offer more
  transparency, lower distortion, and a soundstage that must be heard to be
  believed.
details: |-
  The IN-Series monitors are unlike anything you've ever heard. The three-way design lets both the woofer and the tweeter do less work, resulting in better headroom and lower distortion across the frequency spectrum.

  At the same time, the coaxial architecture of the midrange and tweeter result in hyper-realistic imaging. This means that you'll be able to hear subtle details in your mix with pinpoint precision.

  The design of the system comes together to allow the IN-Series monitors to act as acoustic point sources. They enjoy all the benefits of both traditional 3-way systems and traditional coaxial speakers, with none of the drawbacks traditionally associated with either.

  The IN-Series are an ideal solution for immersive mixing applications like Dolby Atmos. The coaxial architecture of the midrange and tweeter makes them an acoustic point source, allowing for hyper-realistic imaging in the 3-D soundfield.

  Kali Audio's speakers can be easily mounted for overhead use, or even to a wall, using Triad-Orbit and Triad-Orbit Precision products. Per-loudspeaker mounting plates are available for the LP-6 V2, IN-5, and IN-8 V2. Before mounting, check to make sure that it says "Wall/Ceiling Mountable" on the back of the speaker.

  The IN-5 and IN-8 are equipped with digital signal processing that controls the loudspeaker's tuning, the limiter function, the crossover, the boundary EQs, and user definable HF and LF trim. The limiter circuit protects the speakers from unsafe voltage levels, and is plainly audible as distortion when the speaker is receiving too much input signal. The boundary compensation EQ settings, set with DIP switches 1 to 3 on the rear panel, were worked out at The Village Studios in Los Angeles to compensate for low frequency interactions with the surfaces around common placements, and switches 4 to 7 add or subtract 2 dB of low and high frequency trim.
