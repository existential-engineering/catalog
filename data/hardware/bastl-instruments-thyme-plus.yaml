description: Thyme+ is a digital tape delay machine and multi-effect processor
  that uses the metaphor of an analog tape delay with adjustable tape speed and
  multiple read head positions.
details: |-
  Thyme+ is a digital tape delay machine that embraces the metaphor of analog tape delay: tape speed, multiple read heads, and all the sonic quirks that come with tape-based processing. Rather than a conventional delay pedal, it is a multi-effect instrument capable of transforming audio sources into richly textured, evolving soundscapes.

  At its core, Thyme+ offers 9 adjustable effect parameters, each paired with its own dedicated Robot — a modulation source that goes far beyond a standard LFO. These Robots allow complex, independent modulation of every parameter, enabling intricate rhythmic and timbral movement across the delay signal path.

  The device stores 64 presets organized across 8 banks. Presets can be triggered manually like an instrument or driven by the onboard 32-step sequencer with 4 patterns, enabling automated preset sequences and live performance applications. A freeze function allows capturing tape loops in real time.

  Additional tools include a low-pass and high-pass filter, Karplus-Strong synthesis for physical modeling-style tones, tap tempo, and rhythmical quantization of delay time.

  Thyme+ is an updated evolution of the original THYME (2017), featuring an improved audio codec, compact metal enclosure, larger knobs, redesigned faceplate, and expanded connectivity including stereo I/O and CV/Clock inputs.
