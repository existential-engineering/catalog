description: Multi-pattern condenser studio microphone with PAD switch.
details: |-
  The Black Hole BH1s is a premium 1" dual-diaphragm condenser microphone offering switchable cardioid, omnidirectional, and figure-8 polar patterns, built on JZ's Golden Drop Technology capsule and a Class A discrete amplifier circuit.

  A -10 and -20 dB PAD switch extends its headroom, and it includes advanced shock-mount technology to isolate the capsule from handling and stand-borne vibration.
specs: |-
  - Premium quality 1" multi-pattern condenser microphone
  - Golden Drop Technology
  - -10 & -20 dB PAD switch
  - Class A discrete amplifier circuit
  - Switchable cardioid, omnidirectional, and figure-8 patterns
  - Frequency response: 20 Hz - 20 kHz
  - Maximum SPL: 134.5 dB SPL (2.5kOhm, 0.5% THD)
  - Sensitivity: 18 mV/Pa at 1 kHz
  - Self-noise: 7.5 dB-A
  - Output impedance: 50 Ohm
  - Recommended load impedance: greater than 250 Ohm
  - Signal-to-noise ratio: 86.5 dB-A
  - Dynamic range: 127 dB
  - Current consumption: 1.5 mA
  - Dimensions: 190 x 48 x 22 mm
  - Weight: 590 g
  - Advanced shock-mount technology
  - Handcrafted
