description: The TX2181 is a passive dual-18 inch subwoofer designed as a
  high-power low-frequency supplement to the Tour X TX2152 system and other
  full-range loudspeakers. Two high-excursion EVS-18S 18-inch woofers are loaded
  into a braced plywood and MDF enclosure with a low-distortion port design,
  delivering 1000 W continuous (4000 W peak) handling and a maximum calculated
  SPL of 138 dB. Coverage is omnidirectional in both axes, with usable response
  from 40 Hz to 1.5 kHz (-10 dB) and a recommended low-pass between 80 Hz and
  120 Hz. The cabinet is finished in EVCoat and protected by a 16 GA black
  powdercoated steel grille with a rotatable logo. Operation requires a
  dedicated processor channel (Tour X presets for the DX38 are supplied) and an
  external amplifier; signal connections are made via two rear-panel Neutrik
  Speakon NL4 connectors.
details: |-
  Dual 18-inch passive subwoofer for high-power LF supplement

  Two EVS-18S high-excursion 18-inch low-frequency transducers

  Low-distortion port design

  Power handling: 1000 W continuous, 4000 W peak

  Maximum calculated SPL: 138 dB

  Axial sensitivity: 103 dB (1 W / 1 m)

  Frequency response: 50 Hz - 160 Hz (-3 dB); 40 Hz - 1.5 kHz (-10 dB)

  Recommended low-pass frequency: 80 Hz - 120 Hz

  Nominal impedance 4 ohms (minimum 2.9 ohms)

  Omnidirectional horizontal and vertical coverage

  Braced plywood and MDF enclosure with EVCoat finish

  16 GA steel grille with black powdercoat and rotatable logo

  Two rear-panel Neutrik Speakon NL4 connectors

  Tour X presets supplied for the DX38 system processor
