details: |-
  The Martin BC-16E is a full-scale acoustic-electric bass built on the M-14 Fret Cutaway (0000-14 fret cutaway) body, pairing a satin-finished spruce top with East Indian rosewood back and sides for a balanced, articulate voice with strong low-end projection.

  The bass neck is shaped from select hardwood with a standard taper and a 34-inch scale, topped with an ebony fingerboard across 23 total frets and a 1.58-inch nut. The ebony bridge uses a modern belly drop-in saddle made from compensated white Tusq for clean intonation under bass tension.

  For amplified performance, the BC-16E is fitted with Martin E1 electronics — onboard volume, tone, and phase controls plus an integrated chromatic tuner — making it stage-ready out of the box. Black enclosed-gear bass tuners keep the headstock tidy and stable.

  The instrument ships with Martin Authentic Acoustic SP Bass strings in Light gauge and a waterproof softshell case with backpack straps. A left-handed configuration is offered for the same model.
