description: Console 1 Channel Mk III is the mixing control surface of the Console 1 Mixing System, a knob-per-function channel strip controller that gives one-to-one control over EQ, compression, shape, drive and more with genuine analog console sounds. It is sold separately from Console 1 Fader Mk III, the fader bank that works alongside it.
details: |-
  Console 1 Channel Mk III is a mixing control surface that replaces mouse-driven mixing with a knob-per-function layout. Each parameter of the channel strip sits under its own physical control, so the sections of a large-format console (preamp and tape, filters, shape, EQ, compression and drive) are reached by hand rather than through a plug-in window.

  The surface carries 27 touch-sensitive high-resolution Analog Feel potentiometers. Softube states the resolution is more than ten times that of the previous generation, giving a weighted, precise turn intended to feel like expensive outboard gear rather than a generic controller encoder.

  Two high-resolution smart screens show EQ curves, compressor response, a VU meter and track information, so the current state of a channel is visible on the unit itself. Fifty-one RGB LEDs handle track selection and white LEDs give knob read-out.

  Core Mixing Suite ships with the unit. It provides a tape and preamp drive model, filters at 6, 12, 18, 24 and 48 dB slopes, a shape section with Dynamic Shaper, Panner and Dual Dynamics, two EQs (a modern precise one and a vintage passive parallel one), three compressors (FET Mk II, Opto and Bus Compressor) and a drive and character section. Additional console models such as SSL SL 4000 E-Series, SSL XL 9000 K-Series, American Class A, British Class A, Chandler Limited Zener-Bender, Empirical Labs Trak Pak, Summit Audio Grand Channel and Weiss Gambit Series are sold separately.

  The chassis is an anodized aluminium top with injection-moulded sides and back and integrated connectivity points. Dual USB-C ports allow up to four Fader units to be daisy-chained without a hub, and the unit runs bus-powered over USB-C or from the included power supply. Mounting is via a 100 mm M4 VESA pattern on the bottom or M4 threads on the sides, with an optional rack mount kit and mixing system stand. Channel Mk III is backward compatible with Console 1 Mk I and Mk II projects and works with Fader of either generation.
specs: |-
  - 27 touch-sensitive high-resolution Analog Feel potentiometers
  - More than ten times the knob resolution of the previous generation
  - 2 high-resolution screens showing EQ and compressor curves, VU meter and track information
  - 51 RGB LEDs for track selection, white LEDs for knob read-out
  - Knob-per-function 1:1 workflow, no DAW mapping required
  - Sections: Tape/Preamp, Filters, Shape (dual), EQ (dual), Compressor (dual), Drive/Character
  - DAW control: volume, pan, solo/mute, 6 sends, track select
  - Includes Core Mixing Suite software (tape/preamp, filters at 6, 12, 18, 24 and 48 dB, Dynamic Shaper, Panner, Dual Dynamics, 2 EQs, 3 compressors, drive/character)
  - Dual USB-C ports, daisy-chain up to 4 Fader units with no hub
  - Console 1 bus powered over USB-C, or powered by the included power supply
  - Mounting: 100 mm M4 VESA on the bottom, M4 threads on the sides; optional rack mount kit and stand
  - Construction: anodized aluminium top, injection-moulded sides and back with integrated connectivity points
  - Dimensions (W x H x D): 435 mm x 45 mm x 219 mm / 17.1 x 1.77 x 8.66 inches
  - Weight: 1.80 kg / 3.96 lbs
  - Backward compatible with Console 1 Mk I and Mk II, and with Fader of either generation
  - Requires macOS Sonoma 14, Sequoia 15 or Tahoe 26, or Windows 10 (64-bit) or Windows 11
  - Console 1 plug-in runs as VST3, AU (Logic Pro) or AAX (Pro Tools); the VST2 version is not supported
  - Requires a Softube account, an iLok account and internet access for installation and licensing
