description: The Kira takes features from Kiesel's modern Custom Shop and
  applies them to a single-cut guitar. A slight offset body, deeper cutaway,
  sleek horn and A2-style bevels give the model its shape.
details: |-
  The Kira takes the best features from the modern Custom Shop to bring a fresh spin on the single-cut guitar.

  The slight offset body contributes to both aesthetic and feel, with the lower half of the model similar to a headless guitar, bringing comparable comfort and feel into a headstock guitar. The deeper cutaway and sleek horn, alongside bevels akin to those of the A2, offer the bold appearance of the Kira.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in, 1.90 in or 1.92 in at nut depending on configuration
  - Fingerboard: ebony with 14 in or 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale lengths: 25.5 in, or 25.5 in to 27 in multiscale
  - Headstock: inline GT
  - Bridge: Hipshot fixed or Hipshot Solo Saddle, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Output jack: available flush mount or rear access
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Body dimensions: 39 in long, 1.65 in thick, 12.25 in or 12.45 in wide
  - Weight: 7.25 lbs to 7.45 lbs
  - Strings: Elixir Nanoweb 1046E
  - A multiscale option is offered
