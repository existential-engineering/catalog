details: |-
  The 165 is part of dbx's classic 160-series compressor/limiter family, delivering single-channel OverEasy® compression with a traditional complement of controls including threshold, compression ratio, attack, release, and output level. The unit provides transparent dynamics control suited to studio and broadcast environments.

  The OverEasy® soft-knee compression characteristic creates a smooth, gradual onset of gain reduction as signals approach the threshold, avoiding the abrupt gain change associated with hard-knee designs. This produces a natural, musical sound that works well across a wide range of program material.

  The 165 was designed for professional studio use, featuring balanced XLR and TRS connectivity and a quiet noise floor appropriate for high-quality recording applications.
