description: Satellite for Black HP and LP modules.
details: |-
  The Erica Synths Black Filter Coupler is a satellite module to the Black High Pass VCF and the Black Low Pass VCF. It adds bandpass and band reject filter functionality, both with adjustable center frequency and bandwidth, while both VCFs can still operate on their own.

  All three modules have manual and CV control over every parameter, which adds nuances in sound design to a modular system that neither filter reaches alone.

  The module is designed to work exclusively with both the Black High Pass VCF and the Black Low Pass VCF.

  CV level spans -5V to +5V, power consumption is 25mA on the +12V rail and 21mA on the -12V rail, and the module is 35mm deep.
specs: |-
  - Bandpass and band reject filters
  - Manually adjustable center frequency and bandwidth
  - Voltage control over center frequency and bandwidth
  - Works exclusively with both the Black High Pass VCF and the Black Low Pass VCF
  - CV level -5V to +5V
  - Power consumption +25mA, -21mA
  - Module depth 35mm
