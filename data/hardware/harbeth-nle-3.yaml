details: |-
  The NLE-3 is Harbeth's most advanced loudspeaker to date. It combines the full latent performance potential of the RADIAL cone technology with advanced DSP, delivering a truly exceptional audio experience.

  Each NLE-3 system includes two carefully crafted three-way loudspeakers, a Harbeth-designed and manufactured DSP controller, and a six-channel Class-D Ncore amplifier built to Harbeth specifications. Driven from the front end or streaming box of your choice, it is a complete ready-to-go listening solution.

  The DSP controller brings tone control, bass management, volume, slope and stage perspective, so the system can be fine-tuned to an exact preference.

  Each cabinet carries a three-way drive complement: a 300mm Harbeth-made bass unit, a 200mm Harbeth-made RADIAL drive unit and a 21mm ferrofluid-cooled tweeter, covering 35Hz to 20kHz within plus or minus 3dB free-space. Connection is by six 4mm binding posts per cabinet.

  The matching Harbeth-branded Class-D Hypex amplifier is factory-calibrated for seamless integration and matched exactly to Harbeth specifications. The NLE-3 is designed and handmade in the UK.
specs: |-
  - Description: NLE-3 digital loudspeaker
  - Complete package of two three-way loudspeakers, six-channel amplification and a DSP controller box
  - Drive units: 300mm Harbeth-made bass unit
  - Drive units: 200mm Harbeth-made RADIAL drive unit
  - Drive units: 21mm ferrofluid-cooled tweeter
  - Frequency range: 35Hz to 20kHz, plus or minus 3dB free-space
  - Inputs: six 4mm binding posts
  - Power: the loudspeaker cabinet is passive, with no mains inlet of its own, and is driven by the system's separate six-channel Class-D Ncore amplifier
  - Amplification: Class-D Ncore amplifier made to Harbeth specification
  - DSP controller with tone control, bass management, volume, slope and stage perspective
  - Dimensions: 610mm high, 313mm wide, 424mm deep
  - Weight: 40kg
  - Finishes: Walnut, Satin Black, Ivory Sand, Midnight Blue (not all finishes are available in all countries)
  - Designed and handmade in the UK
