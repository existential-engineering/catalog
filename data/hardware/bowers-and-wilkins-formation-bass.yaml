description: The Formation Bass subwoofer offers profound low-frequency presence
  that makes every song an occasion and every movie an event.
details: |-
  Formation Bass is an elegant compact wireless subwoofer and part of the Bowers & Wilkins Formation wireless system. Power is nothing without control, so Formation Bass digs deep and hits hard, but does so with complete command, giving the sort of profound low-frequency presence that makes every song an occasion and every movie an event.

  The cabinet holds two 165mm (6.5 in) long-throw bass units in an opposed arrangement, with a quoted frequency response of 20Hz to 150Hz. The product is a Wireless Subwoofer.

  Amplification and tuning are digital: the listed technical features are Digital Signal Processing (DSP), a Digital Amplifier and Dynamic EQ, the last of which adjusts equalisation with level.

  Connectivity is network-first. The subwoofer joins a Formation system over RJ45 Ethernet or Wi-Fi, and the only other socket is a USB port marked service only. AirPlay 2 compatibility covers iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th generation) with tvOS 11.4 or later, and Mac or PC with iTunes 12.8 or later.

  The unit is mains powered, accepting 100V to 240V at 50/60Hz, and draws below 6 watts in sleep. It measures 254mm (10 in) high, 281mm (11.1 in) wide and 260mm (10.2 in) deep, and weighs 12.5kg (27.6 lb). One cabinet finish is listed, Black.
specs: |-
  - Description: wireless subwoofer
  - Drive units: 2 x 165mm (6.5 in) long throw bass unit
  - Frequency response: 20Hz to 150Hz
  - Digital Signal Processing (DSP)
  - Digital Amplifier
  - Amplifier power output: 250W
  - Dynamic EQ
  - Connections: Network (RJ45 Ethernet or Wi-Fi), USB (service only)
  - Wi-Fi networking (wireless, not a physical port)
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: below 6 watts (sleep)
  - Dimensions: 254mm (10 in) high x 281mm (11.1 in) wide x 260mm (10.2 in) deep
  - Net weight: 12.5kg (27.6 lb)
  - Cabinet finishes: Black
