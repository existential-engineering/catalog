  low-frequency presence that makes every song an occasion and every movie an
  event.
details: |-
  Formation Bass is a network connected wireless subwoofer, and part of the Bowers & Wilkins Formation Suite. It is configured and controlled using the Bowers & Wilkins Home app, and joins the Formation mesh network alongside the other products in a Formation space.

  The wireless Formation Bass from Bowers & Wilkins puts even wired subwoofers to the test. Its unique patented cylindrical design enables the use of opposed dual driver technology to reduce distortion, while a powerful Class D amplifier with Dynamic EQ delivers crisp, clean sound.

  Formation Bass is more accurate, well-timed and more expressive than ever, creating a greater depth of sound you can not only hear, but also feel. It also pairs seamlessly with other speakers in the Formation Suite.

  Two 165mm (6.5 in) long throw bass units and 250W of amplification cover a 20Hz to 150Hz range. Connections are limited to a network socket (RJ45 Ethernet, with WiFi as the alternative) and a USB socket reserved for service use, alongside the mains power inlet.
specs: |-
  - Description: Wireless Subwoofer
  - Drive units: 2 x 165mm (6.5 in) long throw bass unit
  - Frequency response: 20Hz to 150Hz
  - Amplifier power output: 250W
  - Input voltage: 100V - 240V - 50/60Hz
  - Power consumption: Below 6 Watts (Sleep)
  - Connections: Network (RJ45 Ethernet or WiFi), USB - service only
  - Technical features: Digital Signal Processing (DSP), Digital Amplifier, Dynamic EQ
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Dimensions: Height 254mm (10 in), Width 281mm (11.1 in), Depth 260mm (10.2 in)
  - Net weight: 12.5kg (27.6 lb)
  - Cabinet finishes: Black
