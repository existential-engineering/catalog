description: The JS Series Dinky Minion JS1X is a compact, 2/3-scale (22.5")
  electric guitar designed for younger players and those seeking portability. It
  features a poplar body in the classic Dinky shape, a bolt-on maple neck with
  graphite reinforcement, and dual high-output humbucking pickups. A 6-saddle
  string-through-body hardtail bridge provides enhanced sustain and tuning
  stability.
specs: |-
  - Body: Poplar, Dinky shape, gloss finish
  - Neck: Maple with graphite reinforcement and scarf joint, bolt-on, satin finish
  - Fingerboard: Amaranth, 12" radius
  - Frets: 24 jumbo
  - Scale Length: 22.5"
  - Nut: Black plastic, 1.625" width
  - Inlays: Pearloid sharkfin
  - Pickups: Jackson high-output humbuckers (HH)
  - Controls: Volume, tone, 3-position toggle
  - Bridge: 6-saddle string-through-body hardtail
  - Tuners: Jackson sealed die-cast
  - Hardware Finish: Black
  - Strings: Nickel-plated steel (.009-.042)
  - Available Colors: Gloss Black, Neon Green, Metallic Blue Burst, Metallic Red, Pavo Purple, Safety Orange
