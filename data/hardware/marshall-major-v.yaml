description: Foldable wireless on-ear headphones with 100+ hours of playtime and
  a rugged, road-ready design.
details: |-
  From the explosive Marshall signature sound to the everlasting design, every detail of these headphones has been painstakingly refined. Featuring 100+ hours of wireless playtime combined with a rugged and foldable design, Major V is best paired with your next great adventure. Designed and engineered in Sweden. Made in China.

  Marshall signature sound: Marshall has fine-tuned the signature sound you know and love with custom-tuned dynamic drivers, and reduced distortion meaning you can hear your music with absolute clarity.

  100+ hours of wireless playtime: you can be gone for days and never be left without a soundtrack. Major V can be charged using the quick charge option, so you'll dive back into the session in no time. It takes a lot to wear Major V down thanks to its rugged design, and the headphones are also foldable so that you can easily pack them away.

  Customisable M-button: instantly access your favourite features thanks to Major V's M-button and the Marshall Bluetooth app. Just press the M-script logo to open the Spotify Tap default function, your EQ settings or voice assistant.

  Wireless charging and Bluetooth LE Audio-ready: rest your headphones on a charging pad and you're good to go, or recharge using the USB-C charging cable included in the box. Major V is geared up for Bluetooth LE Audio, which delivers superior sound quality and opens audio sharing with Auracast. An in-app battery preservation feature reduces how quickly the battery ages, and Major V is Marshall's first set of headphones included in its repair program.
