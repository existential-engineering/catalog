description: >-
  The Casio CZ-101 is a compact, affordable digital synthesizer featuring Phase Distortion
  synthesis with an 8-stage envelope design and mini keyboard, produced from 1985 to 1988.
details: |-
  The CZ-101 is a small, budget-friendly digital synthesizer that serves as the compact version of the CZ-1000. Despite its entry-level status and limited programming capabilities, it delivers numerous analog-like characteristics and high-quality sounds. The instrument employs Phase Distortion synthesis, Casio's proprietary digital synthesis method from the mid-eighties found across their CZ series, which modifies digital waveforms to create diverse tones, particularly strong in percussive sounds.

  The synthesizer utilizes three sets of 8-stage envelope sections for extensive sound modulation. The first modulates DCO pitches over time, while the DCW employs an 8-stage envelope to adjust the Phase Angle, functioning similarly to filtering. The DCA amplifier features its own 8-stage envelope controlling volume dynamics.

  Beyond envelopes, the CZ-101 incorporates surprisingly sophisticated analog-style effects including four vibrato types with adjustable waveforms, rate, depth, and delay settings, plus classic portamento glide functionality.

  With 4-note polyphony, the instrument features dual oscillators, built-in noise and ring modulation, and MIDI support with 4 monophonic multitimbral parts. Storage capacity is relatively limited at 32 total patches. The CZ-101's portability distinguishes it from competitors, with the ability to be guitar-strapped and battery-powered. Notable users include Cirrus, Moby, Jimi Tenor, Vince Clarke, Jimmy Edgar, and They Might Be Giants.
specs: |-
  - Polyphony: 8 note
  - Synthesis: Digital Phase Distortion (sine, saw, square, pulse, resonance, double-sine, saw-pulse waveforms)
  - Multitimbral: 4 part
  - DCW: 8-stage envelope generators with level and rate controls, Key Follow
  - DCA: 8-stage envelope generators with level and rate controls, Key Follow
  - Keyboard: 49 note mini keyboard (no Velocity or Aftertouch)
  - Memory: 16 preset, 16 user, 16 additional via external cartridge
  - Control: MIDI
  - Date Produced: 1985-1988
releaseDate: "1985"
