name: Model 330/12W
manufacturer: rickenbacker
primaryCategory: electric-guitar
url: https://www.rickenbacker.com/guitars/model-330-12w/
description: Discover the Model 330/12W, a stunning twelve string electric
  guitar with a walnut body and Maple fingerboard for easy play.
details: |-
  This W Series version of the world's most popular twelve string electric
  guitar offers the same deluxe features of its Model 360W cousin, now with
  the strength and character of walnut. This fresh spin on a classic comes
  with a Maple fingerboard and has a natural polished oil finish. Based on the
  standard for recording for more than fifty years, its haunting, melodic
  chorus has continued to benefit from evolution. The slimmed and re-contoured
  neck now makes the 330/12W easier to play than ever.
specs: |-
  - Body Type: Semi-Acoustic
  - No. Frets: 24
  - Scale Length: 62.9 cm (24 3/4")
  - Neck Width at Nut: 41.4 mm (1.63")
  - Neck Width at 12th Fret: 49.05 mm (1.931")
  - Crown Radius: 25.4 cm (10")
  - Body Wood: Walnut
  - Neck Wood: Maple
  - Fingerboard Wood: Maple
  - Weight: 3.6 kg (8.0 lbs.)
  - Overall Length: 100.3 cm (39 1/2")
  - Overall Width: 38.1 cm (15")
  - Overall Depth: 38.1 mm (1 1/2")
  - Neck Binding: Yes
  - Fret Marker Style: Triangle
  - Tailpiece: 'R'
  - Bridge: 6 Saddle
  - Neck Type: Set-in
  - No. of Pickups: 2
  - Type of Pickups: Hi-gain
  - Output Type: Mono and Stereo
  - Machine Heads: Schaller
