details: |-
  The Stirling III LZ Special Edition is a 2-way floorstanding HiFi loudspeaker featuring a 10" Dual Concentric transducer. A modern recreation of Tannoy's legendary 1967 III LZ (Monitor Red) with Pepperpot Waveguide and Alnico motor system. Aluminium-magnesium diaphragm and Mylar surround compression driver. Front-mounted 2-band energy control panel. DMT (Differential Materials Technology) bracing. Designed and manufactured in the UK, includes owner's care package and Birth Certificate.
specs: |-
  - type: 2-way passive floorstanding
  - driver: 10" Dual Concentric
  - motorSystem: Alnico
  - waveguide: Pepperpot Waveguide
  - controls: Front-mounted 2-band energy control (HF boost/cut)
  - connectivity: 4 signal binding posts + 1 RF ground (5th post)
