description: >-
  The SidStation is a MIDI-controlled desktop synthesizer built around the
  iconic SID chip from the Commodore 64 home computer. It combines classic 8-bit
  synthesis with modern MIDI control and real-time parameter manipulation
  through a rotary wheel and alphanumeric LCD display, offering a distinctive
  lo-fi digital character that stands apart from conventional analog-modeling
  synths.
details: |-
  Elektron's SidStation takes the legendary SID (Sound Interface Device) chip, originally designed by Bob Yannes at MOS Technology for the Commodore 64, and repurposes it as the heart of a dedicated musical instrument. Released in 1999, this bold design choice brought the distinctive character of Commodore 64 video game music into a professional studio environment.

  The instrument's architecture centers on three syncable oscillators capable of producing traditional waveforms including triangle, sawtooth, pulse with PWM, and noise. A resonant multimode filter offers lowpass, bandpass, and highpass modes along with combinations, giving solid sound-shaping options. Four individually routable LFOs add deep modulation possibilities, while dedicated arpeggiators for each oscillator make it well-suited for rhythmic electronic music.

  The SidStation's sound character is distinctly nostalgic yet capable of modern synthesis applications. Its particular strength lies in creating distinctive lead tones, percussive textures, and the characteristic 8-bit timbres that defined an era of electronic entertainment.

  Housed in a compact desktop enclosure, the SidStation features a rotary data wheel, backlit 2x16 LCD display, numeric keyboard, and large performance knobs for hands-on control. MIDI In, Out, and Through connections provide full integration with external gear. Despite its playful origins, the SidStation is a capable sound design tool that continues to attract producers looking for something genuinely different.
specs: |-
  - Polyphony: Monophonic (3 oscillators)
  - Oscillators: 3 syncable VCOs (triangle, sawtooth, pulse, mixed, noise; PWM)
  - LFO: 4 individually routable LFOs
  - Filter: 1 resonant multimode filter (lowpass, bandpass, highpass, combinations)
  - Effects: Portamento
  - Arpeggiator: One per oscillator
  - Keyboard: Numeric keyboard
  - Control: MIDI In/Out/Through
  - Display: 2x16 alphanumeric LCD with backlighting
  - Audio: Audio input and output
