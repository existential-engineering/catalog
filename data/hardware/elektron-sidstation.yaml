description: >-
  The SidStation is a MIDI-controlled desktop synthesizer built around the iconic SID chip from the Commodore 64 home computer, offering a distinctive lo-fi digital character
  that stands apart from conventional analog-modeling synths.
details: |-
  Elektron's SidStation takes the legendary SID (Sound Interface Device) chip, originally designed by Bob Yannes at MOS Technology for the Commodore 64, and repurposes it as the heart of a dedicated musical instrument. The result is a synthesizer with a raw, characterful digital sound that carries unmistakable 8-bit charm while offering serious musical capabilities.

  The SidStation provides three syncable oscillators with traditional waveforms including triangle, sawtooth, pulse with PWM, and noise. A resonant multimode filter offers lowpass, bandpass, and highpass modes along with combinations, giving solid sound-shaping options. Four individually routable LFOs add deep modulation possibilities, while dedicated arpeggiators for each oscillator make it well-suited for rhythmic electronic music.

  Housed in a compact desktop enclosure, the SidStation features a rotary data wheel, backlit 2x16 LCD display, numeric keyboard, and large performance knobs for hands-on control. MIDI In, Out, and Through connections provide full integration with external gear. Despite its playful origins, the SidStation is a capable sound design tool that continues to attract producers looking for something genuinely different.
specs: |-
  - Polyphony: Monophonic (3 oscillators)
  - Oscillators: 3 syncable VCOs (triangle, sawtooth, pulse, mixed, noise; PWM)
  - LFO: 4 individually routable LFOs
  - Filter: 1 resonant multimode filter (lowpass, bandpass, highpass, combinations)
  - Effects: Portamento
  - Arpeggiator: One per oscillator
  - Keyboard: Numeric keyboard
  - Control: MIDI In/Out/Through
releaseDate: "1999"
