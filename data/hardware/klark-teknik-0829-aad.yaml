details: |-
  The page describes the DM8000 host rather than this option: modern meetings and telephone or video conferencing require a flexible digital audio processor with user-configurable DSP and routing options, multiple inputs and outputs and auto mixing.

  The DM8000 processing modules listed on the page include input, output, Ultranet I/O digital audio transport output for use with compatible devices, AEC (Automatic Echo Cancellation) for up to 8 channels, USB in and out, mixers, auto mixer, equalisers, feedback suppression and a range of audio filters.
