details: |-
  FEATURING A SILVER ALUMINUM PANEL

  Rand is a 1:1 full-size replica of the Mutable Instruments Marbles random sampler, using the same circuit and firmware with identical functionality. Marbles generates two channels of random gates and three channels of random voltages, with control over rate, bias, jitter, spread and steadiness. Patterns can be locked into loops with the DEJA VU control, and voltages can be quantized to scales. Built by hand in California. With an anodized aluminum panel, genuine Rogan knobs, real Alpha pots and the same components as the original, it is as close as you can come in a new build. Manual: Mutable Instruments Marbles documentation
specs: |-
  - 18hp, 25mm deep — skiff friendly
  - Same circuit and firmware as the original
  - Runs any alternative firmware the original can
  - Anodized silver aluminum panel (also available in black)
  - Genuine Rogan knobs and Alpha pots
  - Fully tested and calibrated before shipping
  - 2-year Calsynth warranty
