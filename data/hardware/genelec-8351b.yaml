name: "8351B SAM Studio Monitor"
manufacturer: genelec
primaryCategory: studio-monitor
categories:
  - monitor
url: https://www.genelec.com/8351b
description: "A revolution in three-way monitor design, the 8351B boasts a
  unique look, compact size and a performance that has to be heard to be
  believed."
details: |-
  The 8351B is a three-way active coaxial studio monitor from Genelec's "The Ones" range, housed in a die-cast aluminium Minimum Diffraction Enclosure with a reflex port. It pairs two 218 × 101 mm obround bass cones with a coaxial mid/treble assembly using a 130 mm midrange and a 25 mm metal-dome tweeter, so that the entire front baffle acts as an acoustic waveguide for a stable point-source response.

  The driver complement is powered by dedicated Class D amplifiers — 250 W for the bass, 150 W for the midrange, and 150 W for the treble — delivering a peak SPL of 118 dB while reproducing 32 Hz to 43 kHz (-6 dB) with ±1.5 dB accuracy from 38 Hz to 20 kHz.

  As a Smart Active Monitoring (SAM) product, the 8351B integrates with Genelec Loudspeaker Manager (GLM) software for automatic room calibration, level, delay, and EQ management across stereo, surround, and immersive monitoring configurations.
specs: |-
  - Short Term Max SPL: 113 dB
  - Peak SPL: 118 dB
  - Frequency Response: 32 Hz - 43 kHz (-6 dB)
  - Accuracy: ± 1.5 dB (38 Hz - 20 kHz)
  - Amplifier Power: 250W Bass + 150W Midrange + 150W Treble (Class D)
  - Harmonic Distortion: 50-100 Hz <=2%; >100 Hz <=0.5%
  - Dimensions: H 454 x W 287 x D 278 mm (with Iso-Pod)
  - Weight: 14.3 kg (31.5 lb)
  - Mains Voltage: 100-240 VAC 50/60Hz
  - Power Consumption ISS Active: <=1W
  - Power Consumption Idle: <=16W
  - Power Consumption Full: 200W
