details: |-
  M-1 is a compact satellite speaker for home theater and stereo use, described by Bowers & Wilkins as equally suited to multi-channel or stereo sound and an outstanding listen with or without a subwoofer. It ships complete with a wall bracket and a table stand, so the same speaker can serve as a front, center or surround channel without additional hardware.

  Placement is the point of the design. The speaker sits equally well on a shelf or on a wall thanks to a swiveling multi-position foot, and the bespoke stand brings it up to listening height where a shelf will not. The manual covers 2-channel and 2.1-channel stereo layouts as well as 5.1, 6.1 and 7.1-channel home theater positions, and the ball socket position and stem can be rotated so the speaker angles correctly in any of them, with the badge rotating to stay upright.

  The driver complement is a two-way arrangement: a 25mm (1in) metal dome high-frequency unit and a 100mm (4in) woven glass fibre cone bass/midrange unit, crossing over at 4kHz. Sensitivity is 85dB spl at 2.83V and 1m, nominal impedance is 8 ohms with a 4.0 ohm minimum, and Bowers & Wilkins recommends amplifier power of 20W to 100W into 8 ohms on unclipped programme. Frequency response is quoted as 64Hz to 23kHz plus or minus 3dB on the reference axis, with a -6dB frequency range of 55Hz to 50kHz.

  It is a fully passive loudspeaker with no amplification, no processing and no mains supply. Connection is made with bare speaker cable: the table stand base takes stripped wires into spring terminals reached through holes in the back of the base, and the wall bracket uses screw terminals wired the same way, with the cable routed on the wall surface, chased into plaster, or run inside a hollow drywall construction.

  Both the cabinet and the perforated steel grille are offered in matte black or matte white, so the speaker can be specified to disappear into a wall or to stand against it. The cabinet measures 248mm (9.8in) high by 114mm (4.5in) wide by 162mm (6.4in) deep when mounted on the table stand, and weighs 2.3kg (5lb).
specs: |-
  - Drive units: 1x 25mm (1in) metal dome high-frequency, 1x 100mm (4in) woven glass fibre cone bass/midrange
  - Sensitivity: 85dB spl (2.83V, 1m)
  - Nominal impedance: 8 ohms (minimum 4.0 ohms)
  - Crossover frequency: 4kHz
  - Recommended amplifier power: 20W - 100W into 8 ohms on unclipped programme
  - Frequency range: -6dB at 55Hz and 50kHz
  - Frequency response: 64Hz - 23kHz plus/minus 3dB on reference axis
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m)
  - Height: 248mm (9.8in), mounted on table stand
  - Width: 114mm (4.5in)
  - Depth: 162mm (6.4in)
  - Net weight: 2.3kg (5lb)
  - Cabinet finishes: Matte Black, Matte White
  - Grille finishes: Matte Black, Matte White
  - Supplied with wall bracket and table stand; swiveling multi-position foot, rotatable stem and ball socket, rotatable badge
  - Connection: spring terminals in the table stand base, or screw terminals on the wall bracket (per the M-1 manual). Passive loudspeaker, no mains supply
