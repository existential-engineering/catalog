details: |-
  The M-1 is Bowers & Wilkins' compact satellite speaker designed to deliver high-fidelity performance from a discreet enclosure. It is positioned within the brand's Mini Theatre line and is intended to perform well as part of a multi-channel surround system or as a stereo pair, with or without an accompanying subwoofer.

  Acoustically, the M-1 is a two-way design pairing a 25mm (1in) metal dome high-frequency driver with a 100mm (4in) woven glass fibre cone bass/midrange driver, crossed over at 4kHz. Sensitivity is rated at 85dB SPL (2.83V, 1m) and nominal impedance is 8Ω (minimum 4.0Ω), with a recommended amplifier power of 20W to 100W into 8Ω on unclipped programme.

  Placement flexibility is a defining feature of the M-1. A swivelling multi-position foot allows shelf or table mounting, and the speaker ships with a wall bracket and a matching table stand so it can be positioned in a wide variety of room layouts without additional accessories.

  Industrial design is restrained, with the cabinet offered in matte black or matte white and a matching perforated steel grille for each finish. The compact 248mm tall by 114mm wide by 162mm deep cabinet weighs 2.3kg, intended to integrate non-intrusively into residential listening environments.
specs: |-
  - High-frequency driver: 1x 25mm (1in) metal dome
  - Bass/midrange driver: 1x 100mm (4in) woven glass fibre cone
  - Sensitivity: 85dB SPL (2.83V, 1m)
  - Frequency response: 64Hz - 23kHz ±3dB on reference axis
  - Frequency range: -6dB at 55Hz and 50kHz
  - Crossover frequency: 4kHz
  - Harmonic distortion: <1% (2nd and 3rd harmonics at 90dB, 1m, 120Hz - 30kHz)
  - Nominal impedance: 8Ω (minimum 4.0Ω)
  - Recommended amplifier power: 20W - 100W into 8Ω on unclipped programme
  - Height: 248mm (9.8in)
  - Width: 114mm (4.5in)
  - Depth: 162mm (6.4in)
  - Net weight: 2.3kg (5lb)
  - Cabinet finish: Matte Black or Matte White
  - Grille finish: Matte Black or Matte White (matching)
  - Included: Wall bracket, table stand with swivelling multi-position foot
  - Warranty: 5 years (passive loudspeaker)
