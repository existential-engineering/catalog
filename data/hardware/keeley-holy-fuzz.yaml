description: A limited-run germanium fuzz based on a Mark III style tone bender
  circuit with a Gate control for velcro-like, gated fuzz textures, built with
  NOS Mullard and Phillips OC75 transistors.
details: |-
  The Holy Fuzz was first built in 2014 as a gloss black and red pedal, the first to carry Keeley's circle K logo. That run used 86 hand-tested Matsushita germanium transistors chosen for low leakage and consistent behaviour in circuit. The design pairs a Mark III style tone bender with a Gate control developed alongside it, giving the gated, velcro-like fuzz the pedal is known for.

  The white Weiss version reissues that design after a stash of Mullard and Phillips OC75 germanium transistors was found. The board was updated and the circuit adjusted so the new transistors sit correctly in the mix, and the enclosure carries Keeley's signature logo. Keeley states the reissue is dialled in to behave the same way as the original.

  The reissue was a limited run, constrained by the number of OC75 transistors available, which Keeley put at fewer than 100.
