description: >-
  An experimental analog neural network synthesizer from JoMoX that uses interconnected analog
  layers and a digital sequencer to generate unpredictable, never-before-heard timbres.
details: |-
  The JoMoX Resonator Neuronium is one of the more unusual instruments to emerge from the boutique synthesizer world. Built around an analog neural network architecture, it combines two main analog layers with a digital layer containing sequencers to create sounds that are genuinely difficult to achieve with conventional synthesis methods.

  The instrument offers six voices of polyphony across six multitimbral parts, with six oscillators producing a mix of additive and ROM-based waveforms. Each voice has its own ADSR envelope, and 101 patches can be stored in RAM. A 24-character LCD display provides visual feedback for the menu-driven interface. The distinctive hexagonal layout of controls on the striking blue-coated iron angled casing gives it an immediately recognizable appearance.

  Originally released in limited quantities in the early 2000s, the Resonator Neuronium was reissued in 2018 due to continued customer demand. Even the reissue was produced in small numbers, and prices increased substantially due to the difficulty of sourcing obsolete or rare components required for manufacturing. MIDI in, out, and thru connections keep it integrated with modern setups despite its experimental nature.
specs: |-
  - Polyphony: 6 voices
  - Multitimbral: 6 parts
  - Oscillators: 6
  - Waveforms: Additive, ROM
  - Envelopes: 6 ADSR
  - Memory: 101 patches (RAM)
  - Display: 24-character LCD
  - Control: MIDI in/out/thru
  - Format: Desktop (iron angled casing)
releaseDate: "2001"
