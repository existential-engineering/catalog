url: https://dbxpro.com/en/products/120a
description: A discontinued subharmonic synthesizer that creates bass notes
  exactly one octave below the original audio using patented Waveform Modeled™
  synthesis technology.
details: |-
  The dbx 120A Subharmonic Synthesizer generates new bass frequencies through patented synthesis, producing smooth, musical low-end that doesn't interfere with mid and high frequencies. Optimized for audio professionals, it features two separate bands of bass synthesis and an independent Low Frequency Boost circuit designed for high-performance subwoofer systems.

  The device's patented process builds synthesized waveforms using the shape of the original bass material, distinguishing it from other bass synthesis attempts. This results in impactful low frequencies that listeners feel without requiring excessive system levels that could damage equipment or hearing.

  Flexible connectivity is provided through 1/4" balanced and RCA inputs, with selectable full-range or high-frequency-only main outputs plus a dedicated subwoofer output with independent level control. A built-in crossover offers 80Hz or 120Hz selection points.

  Ideal applications include nightclub and dance mixing, DJ work, theater and film sound, music recording, live performance, and broadcasting.
specs: |-
  - Two separate bands of subharmonic frequency synthesis (26-36Hz and 36-56Hz)
  - Patented Waveform Modeled™ synthesis process
  - Separate Low Frequency Boost circuit
  - Dedicated subwoofer output with level control
  - 1/4" TRS balanced inputs and outputs; RCA inputs
  - Input impedance: ≥40k ohm (balanced), 20k ohm (unbalanced 1/4"), 20k ohm (RCA)
  - Maximum input: +22dBu (1/4"), +8.5dBV (RCA)
  - Output impedance: 100 ohm, impedance balanced
  - Maximum output: +22dBu into 600 ohm
  - Frequency response: 20Hz-20kHz ±0.5dB (no synthesis); 15Hz-90kHz +0,-3dB
  - THD: 0.05% (no synthesis)
  - Noise: -88dBu (controls at max, 22Hz-22kHz unweighted)
  - Dynamic range: 112dB
  - Crossover: 12dB/octave high-pass; 6dB/octave low-pass; phase-coherent
  - Built-in crossover with 80Hz or 120Hz selection
  - Front panel LEDs for crossover status and synthesis activity monitoring
  - 1 rack unit (1.75"H × 19"W × 6.2"D)
  - Weight: 4.75 lbs (2.2 kg)
