  - discontinued
url: https://www.manley.com/products/legacy/pro/manley-hp-112
description: The Manley HP-112 is a powerful studio headphone mixer designed to
  solve the age-old problem of the "more me" mix. It's a dedicated control
  station that provides musicians with a custom, high-fidelity mix, freeing up
  the engineer to focus on the recording. With a robust feature set and pristine
  audio quality, the HP-112 ensures every artist hears exactly what they need,
  even at extreme volumes.
specs: |-
  - Inputs: 12 balanced, line-level
  - Outputs: Four 1/4″ stereo headphone jacks
  - Per-station controls: 8 mono faders with pan + 2 stereo feeds
  - Tone Controls: ±12 dB @ 100 Hz & 10 kHz
  - THD + Noise: < 0.03% / -70 dB
  - Headphone amp output: peak voltage equivalent to well over 100 watts per channel
  - Communication: Multimode Talkback (built-in microphone), Multi-mode Mute (panic-button)
  - "SIM" (Stereo Image Manipulation) mode monos bass on stereo feeds
  - Daisy-chain expansion via ELCO multi-connectors (wired to ADAT standard)
  - Dimensions: 16″ W × 7 ¾″ D × 2 ½″ H
