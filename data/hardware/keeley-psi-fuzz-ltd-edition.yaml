description: Thick sustain for creamy leads Hybrid Op-Amp + Germanium Transistor
  Fuzz Show stopper at Winter NAMM
details: |-
  A special-edition artwork run of the Psi Fuzz, limited to 30 pieces, with the page stating that the graphic will not be printed again. The circuit is the standard Psi Fuzz: an op-amp take on a classic high-sustain fuzz with one gain stage inverted, the midrange brought forward, the bass tightened and a germanium transistor output stage added, making it an op-amp and transistor hybrid aimed at thick sustain for lead playing.

  The second gain stage is a Sallen-Key filter whose roughly 1 kHz second-order corner is swept by the Voice control, so harmonics can be brought in or out, with a lower-noise op-amp chosen to keep noise down without dulling the guitar tone. The first stage is a non-inverting op-amp, so input and output remain in phase once the germanium gain stage is included.

  Six silicon diodes in the third stage's feedback path are replaced by two LEDs, one of which shows through a hole in the enclosure top as a visible clipping indicator. The germanium stage sits between the Voice and Voltage controls as a common-emitter amplifier built around an AC187, biased with its collector near 4.5 V for about 10 dB of gain, with a germanium diode fitted in reverse polarity across the base-emitter junction to offset the transistor's temperature coefficient. The whole circuit uses a single quad op-amp package plus that one transistor.
