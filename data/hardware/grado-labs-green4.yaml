details: |-
  The Green4 is part of Grado's Prestige Series, delivering core performance and musical character inherent to Grado cartridges. Built on decades of design expertise, it provides a stable and engaging presentation across various systems. Utilizing a moving iron design, Green4 offers consistent, reliable signal with low moving mass and long-term performance. The die-injection molded housing ensures dependable construction and ease of use, available in both standard mount and P-mount configurations.

  The cartridge delivers a balanced, musical presentation with clear detail and smooth treble. The midrange carries warmth and presence while low frequencies remain controlled and well-defined. Recordings are presented with coherence and stability, maintaining a natural, engaging character.

  Green4 features a bonded elliptical diamond on an aluminum cantilever, providing effective groove contact and reliable tracking. The stylus assembly is user-replaceable with interchangeable Prestige Series styli across models. The internal signal path uses ultra-high purity 5N OCC copper, undergoes cryogenic treatment, and features internal damping to reduce resonance and preserve signal integrity.
specs: |-
  - Output: 4 mV @ 5 CMV (45 degrees)
  - Frequency Response: 10-55,000 Hz
  - Channel Separation: Average 25 dB, 10-30,000 Hz
  - Stylus: Diamond - Elliptical
  - Input Load: 10k - 47k ohms
  - Induction: 50 mH
  - DC Resistance: 660 ohms
  - Cartridge Weight: 6 grams
  - Tracking Force: 1.6-1.9 grams
  - Compliance: 20 um/mN
  - Mounting: P-mount or 1/2" Screw Mount
