description: This single tom stand is heavy duty and ready for the road.
details: |-
  This single tom stand is heavy duty and ready for the road. Made from heavy-gauge tubing with oversized tube joints to minimize wobble, and armed with a ball-and-socket adjustment for easy positioning. It includes a 1/2″ diameter tom arm to work with DW TB12 brackets.

  Plastic Tube Insulators inside the heavy gauge tubing are a necessity in recording situations to avoid rattling when drum mics are placed close to stands.

  Hinged Memory Locks are included at tube joints, cymbal arms and tripod leg assemblies to guarantee 100% repeatable, precise height settings every time.

  Trusted by today's best drummers, DW's flagship 9000 Series hardware line is loaded with cutting-edge innovations for superb performance and durability, setting the standard for drummers who demand the best.
specs: |-
  - Heavy-gauge tubing with oversized tube joints
