description: The HD8 is a hard-disk recording workstation with 8 physical tracks plus stereo drum and mono bass tracks, a 9-fader mixer with per-track 3-band EQ, insert and send effects, and a rhythm section played from 9 velocity-sensitive pads. Recording is 44.1 kHz 16-bit WAV to an internal 80 GB hard disk, with a bay for an optional CD-R/RW drive.
specs: |-
  - 8 physical tracks (6 mono, 1 stereo) plus a stereo drum track and a mono bass track
  - 80 virtual takes (10 V-takes per track), 1000 projects, 100 markers and 100 scenes per project
  - 2 tracks recorded simultaneously, 11 played back simultaneously (8 audio plus stereo drum and bass)
  - 44.1 kHz 16-bit mono WAV recording, approximately 3 hours per GB on a mono track
  - Two XLR/standard phone combo inputs, input impedance 1 kilohm balanced and 50 kilohm unbalanced, pin 2 hot
  - Input 1 switchable to high impedance (1 megohm) for a passive guitar or bass pickup
  - 48V phantom power available on both inputs, input level -50 dBm to +4 dBm continuously variable
  - RCA phono master output (L/R), output impedance 1 kilohm, rated output level -10 dBm
  - Two standard stereo phone headphone outputs, 50 mW into a 32-ohm load
  - S/PDIF optical digital output (20-bit)
  - USB 2.0 High Speed, mass storage class and USB MIDI operation
  - 9 faders (6 mono, 1 stereo, master, rhythm) with post-fader and pre-fader 5-segment level meters
  - Per-track 3-band EQ, chorus/delay and reverb sends and pan, with stereo linking on tracks 1/2, 3/4 and 5/6
  - 8 insert effect algorithms (CLEAN, DISTORTION, ACO/BASS SIM, BASS, MIC, DUAL MIC, LINE, MASTERING)
  - 310 insert patches and 60 send/return patches, 7 insert modules and 2 send/return modules
  - Track editing: copy, move, erase, exchange, trim, fade in/out, reverse, time stretch, pitch fix, harmony generate, duo harmony
  - Manual and auto punch in/out, bounce, scrub/preview, A-B repeat, capture/swap and phrase loop
  - Rhythm section with 9 voices (8 drum, 1 bass), 20 drum kits, 27 drum sounds per kit and 11 bass programs
  - 9 velocity-sensitive pads, 48 PPQN resolution, 511 rhythm patterns and 10 rhythm songs per project
  - Sampling capacity of 66 seconds per kit in mono (5.5 MB), maximum 22 seconds per pad
  - Chromatic, guitar, bass, open A/D/E/G and D modal tuner
  - 3.5-inch E-IDE 80 GB hard disk with a 5-inch bay for a CD-R/RW drive
  - 24-bit 64-times oversampling A/D, 24-bit 128-times oversampling D/A, 24-bit internal signal processing
  - Frequency response 20 Hz to 20 kHz (+/-1 dB into 10 kilohms), S/N ratio 93 dB, dynamic range 97 dB, THD+N 0.02%
  - 16-digit 2-line backlit LCD
  - 382 (W) x 328 (D) x 84 (H) mm, 5.1 kg with CD-R/RW drive installed and 4.5 kg without
  - DC 12V 3A from the supplied AD-0011 AC adaptor, 30 W typical power consumption
  - Optional FS01 foot switch, FP01 or FP02 expression pedal and CD-02 CD-R/RW drive
