description: >-
  The E-mu Proteus is a pioneering 1U rack-mount sample playback module from
  1989 that packed 4MB of 16-bit sounds from E-mu's acclaimed EIII library into
  an affordable and fully multitimbral package.
details: |-
  The Proteus marked E-mu's first foray into rack-mount sound modules when it
  debuted in 1989, and it became a massive commercial success. Drawing from the
  company's prestigious Emulator III sample library, it delivered professional
  pianos, strings, horns, basses, drums, and percussion at a fraction of the
  cost of a full sampler.

  With 32-voice polyphony, 16-part MIDI multitimbrality, and six individual
  polyphonic outputs, the Proteus offered studio-grade flexibility. Its 192
  patches (64 user-programmable) provided extensive editing and modulation
  capabilities despite lacking traditional filters.

  E-mu expanded the line with several variants: the Proteus 1 Plus Orchestral
  with 8MB of sounds, the Proteus 2 Orchestral (1990), the Proteus 2 XR with
  extended ROM, the Proteus 3 World (1991) focusing on ethnic instruments, and
  the Proteus FX (1994) which finally added onboard digital effects processing.

  The Proteus series found its way into countless productions throughout the
  1990s, with artists like Pet Shop Boys, Vangelis, Genesis, and Astral
  Projection relying on its versatile sound palette. The line remained in
  production until 1995.
specs: |-
  - Polyphony: 32 voices
  - Sound source: 4MB 16-bit ROM samples (125 waveforms)
  - Multitimbral: 16 parts
  - Filter: None (FX model adds 2 digital effects processors)
  - Memory: 192 patches (64 user-programmable)
  - Outputs: 6 individual polyphonic outputs
  - Control: MIDI
  - Date produced: 1989-1995
releaseDate: "1989"
