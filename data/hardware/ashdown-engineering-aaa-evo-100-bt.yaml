description: A 100-watt bass combo in the AAA EVO range with a 1 x 12" speaker
  plus HF tweeter. It has High and Low instrument inputs, a line/Bluetooth input
  with mix control, Bass/Middle/Treble EQ, a balanced XLR DI output, and a 1/4"
  jack speaker output. Rated at 8 Ohms, dropping to a minimum of 4 Ohms with an
  extension cab added.
details: |-
  100-watt AAA EVO bass combo with a 1 x 12" speaker and HF tweeter. High and Low instrument inputs, a line/Bluetooth input with mix control, Bass/Middle/Treble EQ and a balanced XLR DI output. Speaker output on a 1/4" jack. 8 Ohm rating, minimum 4 Ohms with an extension cab added. No effects loop on this model.
specs: |-
  - Power output: 100 watts
  - Speaker configuration: 1 x 12" + HF tweeter
  - Speaker outputs: 1/4" jack
  - Frequency response: -3dB at 22Hz and 25kHz
  - High instrument input: 3.9M Ohm, input range 150mV to 20V p-p
  - Low instrument input: 10k Ohm, input range 300mV to 40V p-p
  - Line/BT input: yes, with mix control
  - DI output: balanced XLR
  - Impedance: 8 Ohm (minimum 4 Ohm with extension cab)
  - EQ: Bass, Middle and Treble
  - H x W x D: 420 x 410 x 325 mm
  - Weight: 14 kg
