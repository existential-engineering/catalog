description: The MMI Node is a single passive touch pad controller in a hybrid
  1U/0hp format, usable standalone or in combination with other MMI units to
  control CV and audio signal intensity via touch and pressure.
details: |-
  More than a passive touch controller

  Long ago, when I started this company, I had the idea for the original Man-Machine Interface . A touch and pressure controller that was both simple, intuitive and designed to inspire creativity, accidental patching, exploration and experimentation. Now, the MMI Node is the latest addition to the series - a single touch pad enclosed in a convenient box, or easily installed in 1U. Working both standalone or in combination with other MMI units, the Node is intended to give you many more options, from placing multiple Node controllers on a desk in front of you, or placing them strategically in 1U rows. Use your hands. Use your breath. Use fishing weights. Use pyrite. Use strategically cut fruits and vegetables. Anything conductive will work with the MMI Node , as you create beautiful reverb swells, modulations and even pass a sick drum beat right through it. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Accepts both CV and audio signals
  - Control signal intensity with touch and pressure
  - Multiple MMI Node work together, just touch two at the same time
  - Passive design: no external power, no batteries
