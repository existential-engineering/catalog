description: >-
  The Future Retro XS is a compact true analog synthesizer with semi-modular
  architecture, dual VCOs, a multimode filter, and 46 surface controls for
  hands-on sound design in desktop or rack-mount configurations.
details: |-
  Introduced in 2007, the Future Retro XS delivers an aggressive analog sound engine in a compact
  format that can be configured as either a desktop unit or rack-mount module. With 43 knobs and 46
  total surface controls, it prioritizes direct, immediate access to every synthesis parameter
  without menu diving.

  The voice architecture centers on two voltage-controlled oscillators generating sine, triangle,
  sawtooth, square/pulse, and noise waveforms, with frequency modulation capabilities between them.
  A dedicated LFO provides triangle, sawtooth, square, and random modulation shapes. The 12dB
  multimode filter supports lowpass, bandpass, highpass, and notch configurations and is capable of
  self-oscillation, adding another sound source to the palette.

  The semi-modular design is a key feature, with 7 inputs and 11 outputs allowing extensive signal
  routing customization beyond the default internal patching. Two velocity-sensitive ADSR envelopes
  control the dual VCAs, and the unit doubles as a CV/Gate to MIDI converter. MIDI In and Thru
  connections integrate the XS into both analog and digital studio environments, making it equally
  at home alongside vintage modular gear or modern DAW-based setups.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sine, triangle, saw, square/pulse, noise)
  - LFO: Triangle, sawtooth, square, random
  - Filter: 12dB multimode (lowpass, bandpass, highpass, notch) with self-oscillation
  - Envelopes: 2 velocity-sensitive ADSR
  - VCAs: 2
  - Patch Points: 7 inputs, 11 outputs
  - Surface Controls: 46 (43 knobs)
  - Control: MIDI In/Thru, CV/Gate (doubles as CV/Gate to MIDI converter)
  - Format: Desktop or rackmount
releaseDate: "2007"
