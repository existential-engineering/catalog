description: Compact overdrive pedal that recreates the legendary Marshall DSL amplifier voice in a stompbox format. The DSL Overdrive Pedal is built to deliver punchy, versatile crunch that cuts through the mix, with simple tone controls that mirror its amp counterpart for an intuitive playing feel. Designed for players who want the authentic DSL tone anywhere they go, it runs from a 9V DC (centre-negative) external power supply or an internal battery providing roughly 25 hours of use.
details: |-
  The DSL Pedal helps you unlock the legendary sound of the Dual Super Lead. Designed to deliver punchy overdrive that cuts through the mix, the DSL Pedal offers raw and focused tones.

  Featuring improved tonal flexibility, the DSL Pedal lets you recreate the legendary Marshall sound played by music icons such as Joe Bonamassa and Lita Ford. Now with a modernised touch and in a compact design.

  Built with the same diligence and attention to detail that goes into making our DSL amps, this pedal guarantees the authentic, beloved Marshall DSL sound experience every time you play.

  Each knob mirrors the straightforward design of its amp counterpart, letting you unleash your creativity with ease. Designed to deliver punchy overdrive that cuts through the mix, the DSL Pedal offers raw, focused tone. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Overdrive pedal inspired by the DSL (Dual Super Lead) amplifier
  - Simple tone controls mirroring the amp's own knob layout
  - Inputs: 1 x 1/4 inch jack input
  - Outputs: 1 x 1/4 inch jack output
  - Power: 9V DC (centre negative), external PSU not included
  - Battery play time 25 hours when no external PSU is used
  - Dimensions: 101 mm (3.97 in) wide, 52 mm (2 in) high, 131 mm (5.15 in) deep
  - Weight: 0.74 kg
