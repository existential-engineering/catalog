description: Compact overdrive pedal that recreates the legendary Marshall DSL
  amplifier voice in a stompbox format. The DSL Overdrive Pedal is built to
  deliver punchy, versatile crunch that cuts through the mix, with simple tone
  controls that mirror its amp counterpart for an intuitive playing feel.
  Designed for players who want the authentic DSL tone anywhere they go, it runs
  from a 9V DC (centre-negative) external power supply or an internal battery
  providing roughly 25 hours of use.
