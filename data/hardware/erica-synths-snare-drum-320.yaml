details: |-
  The Erica Synths Snare Drum is developed in collaboration with the French company e-licktronick, and it is Erica Synths' take on analogue snare drum circuits adapted for modular systems. The sounds are sharp and punchy.

  The panel carries Tune, Snappy, Noise tone and Decay controls, with attenuated CV control over Tune and Decay, an Accent input for extra expression and a manual trigger button. Together those make the module distinctively expressive in the studio and in live performance.

  The decay range runs from 150ms to 260ms, the audio output swings between -5V and +5V, CV inputs take -5V to +5V over their full span, the Accent CV level is 10V and the trigger level is 5V with a trigger time of 1ms. The module is 10HP wide and 35mm deep, drawing 37mA@+12V and 35mA@-12V.

  One production note from the page: on this run of modules the Pitch and Decay CV inputs are inverted, so a rising CV decreases pitch and a falling CV increases it.
specs: |-
  - Tune, Snappy, Noise tone and Decay controls
  - CV control with attenuators over Tune and Decay
  - Manual trigger
  - Accent for better expression
  - Decay range 150ms to 260ms
  - Audio output level -5V to +5V
  - CV level (full span) -5V to +5V
  - Accent CV level 10V
  - Trigger level 5V
  - Trigger time 1ms
  - Pitch and Decay CV inputs inverted on this run of modules
  - Power consumption 37mA@+12V, 35mA@-12V
  - Module width 10HP
  - Module depth 35mm
