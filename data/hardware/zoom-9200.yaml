description: The 9200 Advanced Reverberation Processor is a 1U 19-inch rack digital effect unit whose 99 preset programs are centred on reverb, with 32 effects spread across three module types. Four inputs and four outputs let one unit process two stereo signals, two mono plus one stereo, or four mono signals at once.
details: |-
  The 9200 Advanced Reverberation Processor is a 1U 19-inch rack digital effect unit whose 99 preset programs are centred on reverb, built around what Zoom described at the time as a newly developed reverb algorithm. Across its three effect module types it carries 32 effects: as many as six distinct reverbs plus early reflection programs, with echo, chorus, phaser, flanger, pitch shift, equalizer and a gate alongside them.

  Four inputs and four outputs, which Zoom called unprecedented in the class, let one unit process two stereo signals, two mono plus one stereo, or four mono signals at once. Each program sits in one of four architectures that fix how many effect modules it uses, and the modules in architectures II to IV can be linked. With the link off each input passes its own module straight to its output. A serial link mixes the inputs into two lines through modules in series to outputs 1 and 2 while outputs 3 and 4 carry the first module alone. A parallel mix link splits inputs 1 and 2 across modules in parallel and folds inputs 3 and 4 back in.

  Memory is organised as a read-only preset area of 99 programs, a read and write user area of another 99, and a further 99 on an optional RAM or ROM card in the front-panel slot. Cards can be loaded wholesale into the user area, saved back, verified and formatted. Editing runs from an analog-feel rotary dial with a backlit 24 character by 2 line LCD, with compare, last edit, duplicate, copy, swap and store utilities, and a MUTE key that bypasses all effects in any mode.

  Conversion is 16-bit linear at 44.1 kHz in both directions, with a frequency response of 16 Hz to 20 kHz and dynamic range of 90 dB or better. All four inputs are balanced XLR at a nominal +4 dBm into 10 kohm, and all four outputs are unbalanced XLR at +4 dBm from 300 ohm, with four 5-segment peak meters reading CLIP down to -30 dB. MIDI in and out handle program change with an assignable mapping table, bank select across internal, card and preset banks, real-time parameter control by data entry and NRPN messages that address a parameter and an effect module number, master effect level, effect mute and bulk dump, and the output doubles as MIDI THRU. The chassis measures 432 x 340.5 x 44 mm, weighs 4.5 kg and draws 28 W from AC mains.
specs: |-
  - 1U 19-inch rack digital reverberation and multi-effect processor, 4 in / 4 out
  - 99 preset programs centred on reverb-type effects, plus a 99-program read/write user area and 99 more on an optional RAM or ROM card
  - 32 effects across three module types
  - Effect Type A (1-in/1-out), 10 effects: Rev 1, Rev 2, E/Ref, Echo, Chors, Phase, Flang, Pitch, Equlz, Gate
  - Effect Type B (2-in/2-out), 14 effects: Rev 1, Rev 2, Rev 3, Rev 4, E/R 1, E/R 2, Echo 1, Echo 2, Chors, Phase, Flang, Pitch, Equlz, Gate
  - Effect Type C (2-in/2-out), 8 effects: Rev 1 to Rev 6, Echo, Chors
  - Four program architectures (I to IV) fix the module count per program. Architectures II to IV support serial, parallel-mix or no effect link between modules
  - Input modes allow two stereo, two mono plus one stereo, or four mono signals simultaneously
  - Frequency response 16 Hz to 20 kHz, dynamic range 90 dB or better
  - A/D and D/A conversion 16-bit linear, sampling frequency 44.1 kHz
  - Inputs: 4 channels, balanced XLR (pin 1 GND, pin 2 COLD, pin 3 HOT), nominal +4 dBm, 10 kohm
  - Outputs: 4 channels, unbalanced XLR (pin 1 GND, pin 2 COLD, pin 3 HOT), nominal +4 dBm, 300 ohm
  - Front panel card slot for optional RAM and ROM cards, with card load, save, verify and RAM formatting utilities
  - Display: backlit 24 character x 2 line LCD, 2-digit program number LED, 1-digit architecture number LED, 4 x 5-segment input level meters (CLIP to -30 dB), STEREO and MONO indicators
  - Edit utilities: compare, last edit, duplicate, copy, swap and store. MUTE key bypasses all effects in every mode
  - MIDI: program change with an assignable program-change map, bank select (internal memory, card, preset), data entry MSB/LSB, data increment and decrement, NRPN addressing a parameter number and effect module number, master effect level, effect mute, and system exclusive bulk dump. MIDI OUT doubles as MIDI THRU
  - Power requirements 100 V AC, 50/60 Hz. Power consumption 28 W
  - Dimensions 432 (W) x 340.5 (D) x 44 (H) mm, EIA 19-inch rack 1 unit
  - Weight 4.5 kg
  - Supplied with three manuals: Operation Manual, Parameter List and Program List
