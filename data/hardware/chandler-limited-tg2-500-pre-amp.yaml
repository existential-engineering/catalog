description: The Chandler Limited TG2-500 pre-amp is a recreation of the rare
  EMI TG12428 pre amp used in EMI/Abbey Road Studios recording and mastering
  consoles from the late 60s and early 70s. It features the same discrete,
  transformer-balanced amplifiers as the TG series and packages the microphone
  pre-amplifier and line amplifier from the TG2 Pre Amp/DI into the industry
  standard 500 Series format.
details: |-
  500 Series format microphone preamplifier based on the EMI TG12428. Mic/line only version of the TG2 Pre Amp/DI — no DI input on this 500-series format. Features coarse gain from +20 to +50 dB in 5 dB steps, fine gain ±10 dB continuous, switchable mic/line input, switchable input impedance (1200/300 Ω), +48V phantom power, and 0/180° phase switch. Maximum gain of +60 dB. Mono channel. Discrete, transformer-balanced circuit. Power: +/-16V via 500 Series frame; max current draw +16V @ +110mA / -16V @ -80mA.
