details: |-
  Era 2 is the second acoustic amplifier in Hughes & Kettner's Era acoustic series. Alongside extraordinary acoustic power, Era 2 gives you richly detailed definition for peerless authenticity and tonal brilliance, plus a bunch of remarkably innovative and intuitive features to make every performance better.

  Built in Germany to the highest quality standards, Era 2's extra power and low-end make it the perfect choice for players who require serious volume and bass for performance purposes.

  Painstakingly selected, top-drawer components. Excellent preamps. Premium-quality AD/DA converters. Custom-made power amp with massive headroom. Richly detailed definition, wonderfully dynamic response, plenty of headroom, it all adds up to a natural-sounding audio experience unrivaled in authenticity.

  Two fully featured, identical channels. Independent FX engine for each channel with 16 programs. Very effective Preshape and Mode buttons to voice channels to suit different instruments and vocal registers. As compact and light as conventional 60-watt combos.

  Developed by renowned acoustic amp designer Michael Eisenmann in a joint effort with the Hughes & Kettner team. Choice materials, handpicked for durability and ruggedness. Made in Germany to the most discriminating standards for quality.
specs: |-
  - Channels: 4
  - Notch filter: 40-180 Hz
  - EQ: 3-Band-EQ, 2 modes switchable
  - Internal FX: 16 FX programs (Reverb, Chorus, Flanger, Delay, Combinations), FX parameters adjustable
  - Switches CH1/CH2: -10dB, Shape, Mute
  - Control: Master Volume, Gain
  - Power amp: 400 watts
  - Speaker mid/low: 2x8-inch custom made
  - Speaker high: 1x1-inch dome tweeter
  - Footswitch: Hughes & Kettner FS-2 (optionally available), switching functions amp mute and internal FX mute
  - Dimensions: 350 x 475 x 290 mm
  - Weight: 14.10 kg / 31.1 lbs (wood), 14.45 kg / 31.9 lbs (black)
  - Tilt stand (included): 25 / 35 degrees
  - Pole mount: 35 mm
  - Protective cover (included): padded
