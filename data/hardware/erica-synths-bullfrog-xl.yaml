description: Educational synthesizer. Teachers edition.
details: |-
  Bullfrog invites the player to unlock musicality while combining the thrill of electronic music production with a comprehensive learning experience. Bullfrog XL is designed specifically for teachers to use in front of the classroom and it expands the concept of the regular Bullfrog by inflating its size by a factor of 3.

  With its expanded size and built-in oscilloscope, Bullfrog XL is not just for classrooms but will be a great addition to any studio.

  Created by Erica Synths and Richie Hawtin, Bullfrog is an educational electronic music instrument designed to captivate and inspire both youth and professionals alike. A comprehensive user manual accompanies the learning process, and further material is published on a designated Bullfrog website.

  The fully analog design covers a highly accurate voltage controlled oscillator that tracks over 8 octaves, a zener diode based noise generator, a resonant lowpass VCF, a VCA with adjustable offset, a delay with adjustable time and feedback, two looping attack-sustain-release envelope generators and a sample and hold circuit with its own clock. An attenuverter, a slew processor, two buffered splitter circuits and a two channel oscilloscope round out the panel, which uses 6.3 mm jack sockets throughout.

  The instrument ships with side panels, a universal 12VDC wall wart adapter with power cable, a user manual, 12 1/4 inch patch cables, Sequencer, Sampler/Looper, Acid Bassline, Hipass filter, LFO and Electric Organ voice cards, and three DIY voice cards.
specs: |-
  - Fully analog design
  - Highly accurate voltage controlled oscillator (VCO) that tracks over 8 octaves
  - Manually adjustable and voltage controlled waveshapes: sine-shark fin and pulse wave with pulse width modulation (PWM)
  - Zener diode-based noise generator
  - Resonant lowpass voltage controlled filter (VCF)
  - Voltage controlled amplifier (VCA) with adjustable offset
  - Delay effect with adjustable delay time and feedback amount
  - Two looping attack-sustain-release envelope generators (EG)
  - Sample & Hold circuit with an individual clock
  - Attenuverter
  - Slew processor with adjustable slew time
  - Two buffered splitter circuits
  - Two channel oscilloscope
  - 6.3 mm jack sockets
  - Manual gate button
  - Gate and Trigger out
  - Voice card slot
  - Built in speakers
  - DIN5 MIDI input
  - USB connector
  - Keyhole slots on the rear panel
  - Dimensions (mm): 820 x 505 x 65 (250 with the side panels)
  - Mass: 8.3 kg
