description: Full gloss oval hole A-style mandolin constructed with select
  Adirondack spruce and eastern maple, producing a warm, rich, and vibrant tone
  suited for celtic, old-time, classical, and jazz styles. Features high-gloss
  nitrocellulose lacquer finish and full ivoroid bindings.
details: |-
  The MT2-O is an A-style mandolin with an oval soundhole built with a select Adirondack spruce top and Eastern flamed maple back, sides, and neck. It features ivoroid binding with black/white top and side purfling on the body, fingerboard, and peghead. Construction includes X-bracing, a dovetail neck joint, and a fully adjustable truss rod. The ebony fingerboard has MOP dot inlays and a compound radius of 7" to 11 5/8", while the ebony bridge has an adjustable saddle. A rounded V neck profile with 13 7/8" scale length and 1 3/16" nut width suits a wide range of playing styles. Hardware includes nickel Gotoh tuners with ivoroid buttons and the Collings original tailpiece. The body is finished in high gloss nitrocellulose lacquer. Ships with a D'Addario EJ74 string set and a deluxe hardshell case.
specs: |-
  - Construction: A-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: Oval
  - Body Binding: Ivoroid with b/w purfling
  - Fingerboard Binding: Ivoroid with b/w side purfling
  - Peghead Binding: Ivoroid with b/w side purfling
  - Bracing: X-brace
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 3/16"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo and flourish
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 7" - 11 5/8" compound
  - Body Finish: High gloss nitrocellulose lacquer
  - Tailpiece: Original tailpiece
  - Pickguard: None
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 25 3/4"
