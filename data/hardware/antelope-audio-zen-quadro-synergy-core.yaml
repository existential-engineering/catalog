details: |-
  A revolutionary audio interface that stretches the limits of modern audio technology by implementing top-shelf components into an affordable price and portable form factor.

  With console-grade Discrete preamps, best conversion we've ever had in a bus-powered interface, and revolutionary dual-USB design, it is a no-brainer for all budding producers, musicians, and streamers looking to take their setup to the next level.

  Hear every detail with up to 130 dB dynamic range converters. Power any mic with 75 dB gain console-grade preamps. Record, stream and play live with Synergy Core real-time FX processing. Connect 2 computers or computer and phone simultaneously with USB OTG.
