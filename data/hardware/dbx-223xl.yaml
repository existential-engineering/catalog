url: https://dbxpro.com/en/products/223xl
description: Stereo 2-Way/Mono 3-Way Crossover with XLR balanced connectors and
  Linkwitz-Riley 24dB/octave filters.
details: |-
  The dbx 223XL is a professional-grade crossover featuring XLR balanced inputs and outputs with an internal power supply. The unit offers flexibility through a mode switch for stereo 2-way or mono 3-way operation, with individual gain controls on all outputs ranging from −∞ to +6 dB. Each channel includes a recessed 40 Hz high-pass filter to remove unwanted low frequencies, and phase reverse switches on all outputs for system configuration without recabling.

  Construction emphasizes durability with XLR connectors screwed directly to the chassis and precision controls throughout. The crossover employs Linkwitz-Riley 24 dB per octave filters, acknowledged as the professional standard. Back panel switches allow independent frequency range selection for both channels via ×1/×10 multipliers, with LED indicators confirming activation status.

  A low frequency summed output option enables mono subwoofer configurations typical in professional sound systems. CSA NRTL/C approved and CE compliant, backed by a 2-year parts and labor warranty.
specs: |-
  - Input Connectors: XLR
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+21 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >50 dB at 1 kHz
  - Output Connectors: XLR
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >114 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range: 45–960 Hz or 450 Hz–9.6 kHz (×10)
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100/120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 3.7 lbs (1.7 kg)
