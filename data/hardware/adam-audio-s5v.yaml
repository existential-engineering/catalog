description: The ADAM Audio S5V main monitor offers raw power, but also reproduces full-bandwidth, high-resolution audio with complete accuracy and clarity.
details: |-
  Designed for medium-sized and larger studio control rooms, the S5V offers the raw power professionals would expect from a reference speaker of its class, but also reproduces full-bandwidth, high-resolution audio with complete accuracy and clarity.

  ADAM Audio's Extended Linear Excursion (ELE) bass drivers and Symmetrical Magnet Assembly (SMA) technology were developed especially for the S Series, and the 12-inch bass driver on the S5V benefits from both concepts, offering a quality of reproduction without equal in terms of accuracy, dynamic range and freedom from coloration. The 4-inch DCH MF driver, with its unique hybrid dome/cone construction, handles the important mid-range information with extreme precision, while ADAM Audio's S-ART folded-ribbon tweeter, handmade in Berlin to the tightest possible tolerances, produces breathtaking highs and ensures the soundfield is presented in all of its most delicate, filigree detail.

  The off-axis responses of the treble and mid drivers remain extremely accurate thanks to the addition of high- and mid-frequency waveguides milled from solid aluminum: ADAM Audio's newly developed Mid-range and High-frequency Propagation Systems (MPS and HPS). The resultant stable, wide-ranging dispersion ensures that teams of more than one person can work in the loudspeakers' sweet spot simultaneously, as is often necessary in larger control rooms.

  The S Series' custom-designed DSP optimizes the loudspeaker crossovers to create linear responses for the entire range, as well as providing user equalization and in-room tuning/voicing functions. The DSP also handles the limiter-based high-frequency driver protection, processes the signals from the AES3 digital inputs, and will in time facilitate various expansion options. Software updates can be carried out with ease via the associated USB port, which also allows users to connect computers and control the speakers' DSP functions via a software front-end.

  A Class D 700 W amplifier drives the S5V's bass unit, with further Class D designs providing 300 W and 100 W to the DCH mid and S-ART treble drivers respectively. Combining the legendary precision of ADAM Audio's proprietary drivers with the power of the company's amplification, the S5V is a reference monitor for truly discerning audio professionals at work in the most expansive listening environments.
specs: |-
  - Frequency response: 25 Hz to 50 kHz (-20 dB)
  - Max. SPL per pair at 1 m: greater than or equal to 128 dB
  - THD above 100 Hz: less than or equal to 0.3 %
  - Crossover frequencies: 250 Hz, 3 kHz
  - Total RMS amplifier power: 1100 W
  - Woofer amplifier: PWM, 700 W RMS
  - Midrange amplifier: PWM, 300 W RMS
  - Tweeter amplifier: PWM, 100 W RMS
  - Woofer: 12-inch HexaCone cone, 3-inch (76 mm) voice coil
  - Midrange: 4-inch dome/cone hybrid, carbon composite cone, 2.4-inch (60 mm) voice coil, MPS waveguide
  - Tweeter: S-ART folded ribbon, 4 inch2 (2420 mm2) diaphragm area, 2-inch (56 mm) equivalent diaphragm diameter, 4:1 velocity transform ratio, 0.17 g diaphragm weight, HPS waveguide
  - Analog input: XLR, 48 kOhm input impedance, +24 dBu max. input level
  - Digital input: AES3
  - Control options: adjustable input sensitivity, 6 parametric EQs, 1 room compensation high-shelf EQ, 1 room compensation low-shelf EQ, 5 preset memories, delay 0 ms to 5 ms
  - Connection panel: rear
  - Max. power consumption: 650 W
  - Dimensions (H x W x D): 27.5 in (698 mm) x 15.4 in (390 mm) x 20.5 in (520 mm)
  - Weight: 114.5 lb (52 kg)
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
  - Delivery contents: power cord, manual
