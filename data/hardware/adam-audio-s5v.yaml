description: The ADAM Audio S5V main monitor offers raw power, but also
  reproduces full-bandwidth, high-resolution audio with complete accuracy and
  clarity.
details: |-
  The ADAM Audio S5V is a three-way active main monitor designed for medium-sized and larger studio control rooms. It pairs proprietary ELE bass drivers with the SMA (Symmetrical Midrange Arrangement) technology, delivering the raw power professionals expect from a reference speaker of its class while reproducing full-bandwidth, high-resolution audio with accuracy and clarity.

  The driver complement consists of a 12-inch HexaCone woofer with a 3-inch voice coil, a 4-inch Carbon Composite dome/cone hybrid midrange driver (2.4-inch voice coil) loaded by the custom MPS aluminum waveguide, and a handbuilt S-ART folded-ribbon tweeter (4 in² diaphragm, 2-inch equivalent diameter, 4:1 velocity transform ratio) loaded by the HPS waveguide. The aluminum waveguides deliver stable, wide-ranging dispersion so multiple team members can work in the optimal listening area simultaneously.

  Tri-amplification provides 700 W RMS to the woofer, 300 W to the midrange driver, and 100 W to the tweeter (1100 W total), enabling a maximum SPL of at least 128 dB per pair at 1 m with THD ≤0.3% above 100 Hz. Frequency response spans 25 Hz to 50 kHz (-20 dB) with crossovers at 250 Hz and 3 kHz. A custom DSP optimizes crossovers for linear response and provides user EQ, in-room tuning, and driver protection.

  Rear-panel connectivity covers a balanced analog XLR input and an AES3 digital input. Input impedance is 48 kOhm with a maximum input level of +24 dBu and adjustable input sensitivity. The DSP surfaces 6 parametric EQs, 1 high-shelf and 1 low-shelf room compensation filter, 0–5 ms of delay, and 5 preset memories for storing voicings per room or mix scenario.

  The cabinet measures 698 × 390 × 520 mm (27.5 × 15.4 × 20.5 in) and weighs 52 kg (114.5 lb). Maximum power consumption is 650 W. The S5V ships with a 5-year warranty (2 years standard plus 3 additional years with registration) and is intended for use in professional recording, mixing, and mastering environments where main-monitor performance is required.
specs: |-
  - Three-way active main studio monitor
  - 12" HexaCone woofer with 3" voice coil
  - 4" Carbon Composite dome/cone hybrid midrange with 2.4" voice coil and MPS waveguide
  - S-ART folded-ribbon tweeter (handbuilt in Berlin) with HPS waveguide
  - S-ART diaphragm area: 4 in², 2" equivalent diameter, 4:1 velocity transform ratio
  - Frequency response: 25 Hz – 50 kHz (-20 dB)
  - THD > 100 Hz: ≤0.3%
  - Max SPL per pair at 1 m: ≥128 dB
  - Crossover frequencies: 250 Hz, 3 kHz
  - Total RMS power: 1100 W (700 W woofer, 300 W midrange, 100 W tweeter)
  - Class D amplification
  - Analog input: XLR, 48 kOhm input impedance, max input level +24 dBu, adjustable sensitivity
  - Digital input: AES3
  - DSP controls: 6 parametric EQs, 1 high-shelf and 1 low-shelf room compensation EQ
  - 5 preset memories
  - Delay: 0–5 ms
  - Max power consumption: 650 W
  - Dimensions (H x W x D): 698 x 390 x 520 mm (27.5 x 15.4 x 20.5 in)
  - Weight: 52 kg (114.5 lb)
  - Warranty: 5 years (2 years standard + 3 years optional with registration)
