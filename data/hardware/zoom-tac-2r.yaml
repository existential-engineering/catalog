description: A compact, rugged Thunderbolt audio converter for studio and field
  recording of mics and instruments, onstage playback and audio streaming at up
  to 24-bit/192 kHz, which can also serve as a MIDI interface.
details: |-
  The TAC-2R is a compact 2-in/2-out Thunderbolt audio interface in a robust metal housing, running at up to 24-bit/192 kHz with ultra-low latency audio streaming. It is aimed at studio and field recording of mics and instruments, onstage playback and audio streaming, and also works as a MIDI interface.

  Two combo balanced XLR/TRS input connectors accept mic and line level signals, with Hi-Z switches for connecting an electric guitar or bass directly, switchable +48V phantom power, and an independent gain control and clip LED for each input. The mic preamps offer up to +60 dB of amplification.

  Two balanced TRS output jacks on the rear connect to amplifiers or self-powered speakers, a 1/4-inch headphone jack has its own level control, a large knob sets the output volume, and a Direct Monitoring switch gives zero-latency monitoring of the input in mono or stereo.

  MIDI In and Out on 5-pin DIN jacks make the TAC-2R an ultra-stable MIDI interface alongside its audio duties. Conversion uses a Burr Brown PCM4202 analog-to-digital converter and an AKM AK4396 digital-to-analog converter with 4x upsampling at 44.1 kHz and 48 kHz, and the asynchronous transfer system is unaffected by computer jitter. Typical round-trip latency is 4.17 ms at 44.1 kHz with a 64-sample buffer.

  The unit is bus powered over Thunderbolt, so no AC power is required. It is Mac only, working with Thunderbolt-equipped Macintosh computers running macOS 10.14 to 13 on Intel Macs.
specs: |-
  - 2-in/2-out Thunderbolt audio interface, 2 recording and 2 playback channels
  - Sampling frequencies: 192 / 176.4 / 96 / 88.2 / 48 / 44.1 kHz, 24-bit
  - Inputs 1/2: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain 0 to 60 dB in 1 dB steps
  - Inputs 1/2: input impedance 5 kOhm, or 1 MOhm with Hi-Z on. Max input level +12 dBu at 0 dBFS
  - Phantom power: +48V, switchable
  - L/R output: 1/4-inch TRS phone jacks (balanced), max output level +14 dBu at 0 dBFS, output impedance 100 Ohm
  - Phones output: 1/4-inch stereo phone jack, 20 mW + 20 mW into 32 Ohm, max output level +8 dBu, output impedance 33 Ohm
  - MIDI input and output: 5-pin DIN jacks
  - A/D and D/A conversion: 4x upsampling at 44.1 kHz or 48 kHz, Burr Brown PCM4202 (A/D) and AKM AK4396 (D/A)
  - Frequency response: -1.0 dB, 20 Hz to 60 kHz at 192 kHz. 20 Hz to 40 kHz at 96 kHz. 20 Hz to 20 kHz at 44.1 kHz
  - Dynamic range: A/D 118 dB typical (IHF-A), D/A 120 dB typical (IHF-A)
  - S/N ratio EIN: -125 dBu (IHF-A) at 60 dB gain, 150 Ohm input
  - Typical latency: 4.17 ms round trip at 44.1 kHz with a 64-sample buffer
  - Interface: Thunderbolt. Power: Thunderbolt bus power, no AC power required. Power consumption 10 W maximum
  - Dimensions: 113.9 mm (D) x 176.0 mm (W) x 46.2 mm (H), weight 714 g
  - Works with Thunderbolt-equipped Macintosh computers running macOS 10.14 to 13 (Intel Mac only)
