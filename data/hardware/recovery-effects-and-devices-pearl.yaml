details: |-
  PEARL EURORACK MODULAR DEVICE

  (Heavy Low-End Eurorack Fuzz)

  The Pearl Eurorack module is an adaption of our pedal bearing the same name. It's a classic fuzz at modular level, with CV control over the "Destroy" parameter. At the heart of the device is an all-analog silicon design that adds a wall of fuzz to your signal while remaining musical. The user interface includes intensity, tonality, compression, and output level. Pearl is an essential sound-shaping and destruction module. Designed and assembled in Seattle, Washington. . 4hp, 2mA, 25mm deep. . . Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
