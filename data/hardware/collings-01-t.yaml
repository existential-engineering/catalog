description: The 01 T is a Traditional Series 0 14-fret acoustic guitar built as
  a vintage-inspired variation on the distinctive Collings sound, designed to
  showcase the desirable characteristics of pre-war instruments. Its voicing
  delivers warm, rounded highs and a present low midrange while retaining a
  quick attack and strong projection. Featuring a Sitka spruce top over Honduran
  mahogany back and sides, the 01 T is braced with a custom pre-war scalloped
  X-brace and finished in an ultra-thin nitrocellulose lacquer.
details: |-
  The 01 T belongs to the Traditional Series, a line engineered to capture the spirit and tonal qualities of pre-war American acoustic guitars. The body is constructed with a Sitka spruce top and Honduran mahogany back, sides, and neck, delivering a warm and articulate sound character. Tortoise body binding with custom wood purflings adds a period-correct aesthetic, while the ebony belly-style bridge with 2 5/16" spacing and ebony fingerboard with gold MOP short dot inlays reinforce the vintage sensibility. A 14"-26" compound fingerboard radius and traditional neck profile make the instrument comfortable for a wide range of playing styles.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Neck Profile: Traditional
  - Fingerboard: Ebony with gold MOP short dots
  - Fingerboard Radius: 14"-26" compound
  - Scale Length: 24 7/8"
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cutthrough
  - Frets: Medium 18% nickel-silver
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Body Binding: Tortoise with custom wood purflings
  - Pickguard: Tortoise
  - Bracing: Custom Traditional Series pre-war scalloped X-brace
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Tuners: Nickel Waverly
  - Strings: D'Addario EJ-16 (.012"-.053")
  - Body Width: 13 7/16"
  - Body Length: 18 3/16"
  - Body Depth: 4"
  - Total Length: 38"
