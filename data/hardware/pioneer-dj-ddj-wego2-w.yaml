description: Compact, easy-to-carry 38 cm wide, with only 1.6 kg to carry, you
  could use this controller in the smallest spaces. Multi-coloured LED JOG
  lights Beside the 3 body colours available, you can also customize to your
  taste the colours of the JOG. Portable and multifunctional An ergonomic
  carrying grip, which doubles as an iPad stand, allows you to carry the WeGO2
  from party to after party. Designed for Algorridim's djay2 Simply use the
  provided Lightning to USB cable to connect the DDJ-WeGO2 to an iPhone/iPod
  touch/iPad running Algoriddim's djay2 app, and mash up tracks straight from
  iTunes. Soundcard inside No hassle with external soundcards. This controller
  connects straigt to your speakers or amp. Pulse Control The JOG lights, tell
  you what's going on. This allows you to visually check that beats are in sync
  and change the tempo as necessary.
