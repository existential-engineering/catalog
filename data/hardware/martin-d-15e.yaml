details: |-
  The Martin D-15E is part of the 15 Series, a solid wood acoustic-electric Dreadnought that delivers the warm, woody tone Martin's all-mahogany family is known for. Built around an Indian Plantation Mahogany top with Sapele back and sides in a satin finish, it offers a balanced midrange voice with the strong low-end projection expected of a D-14 Fret body.

  A PA (Performing Artist) neck profile with a High-Performance Taper and 1 3/4" nut width pairs with a 25.4" scale length and Katalox fingerboard for comfortable, modern playability. Non-scalloped Sitka Spruce X-bracing keeps the top responsive without sacrificing structural integrity.

  Onboard Martin E1 electronics provide volume, tone, and phase controls along with a built-in chromatic tuner, making the D-15E stage- and studio-ready out of the box. A compensated Tusq saddle on a Katalox bridge supports accurate intonation across the 20 frets.

  The guitar ships with Authentic Acoustic Lifespan 2.0 Medium strings pre-installed and includes a waterproof softshell case with backpack straps. A left-handed configuration is available, and the instrument is covered by Martin's Limited Lifetime Warranty.
specs: |-
  - Body size: D-14 Fret (Dreadnought)
  - Top: Indian Plantation Mahogany, satin finish
  - Back & sides: Sapele, satin finish
  - Bracing: Non-Scalloped X-Brace, Sitka Spruce
  - Scale length: 25.4"
  - Nut width: 1 3/4"
  - Neck shape: PA Profile with High-Performance Taper
  - Fingerboard: Katalox
  - Bridge: Katalox with compensated Tusq saddle
  - Frets: 20
  - Electronics: Martin E1 (volume, tone, phase, built-in chromatic tuner)
  - Strings: Authentic Acoustic Lifespan 2.0 Medium
  - Case: Waterproof softshell with backpack straps
