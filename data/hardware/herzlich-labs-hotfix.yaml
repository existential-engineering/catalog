description: A 4hp Eurorack utility module combining a buffered multiple, a
  three-to-one active mixer, and a signal inverter with half-wave and full-wave
  rectification.
details: |-
  Doctor, this patch isn't working! Get a buffered mult and an inverter, stat! It's dark, and the bass is thumping in your monitors. You wipe a bead of sweat from your forehead as you patch, quickly, furiously, but alas - just before you can finalize your magnum opus, you run out. Run out of buffered multiples, of mixers, of inverters. The one last thing that will make everything come together as one, and you find yourself in a utility shortfall. Don't let this happen to you! You need a Hotfix in your system, not when things start to go wrong, but before, as insurance against these kinds of situations. For a module meant to save the day once in a while, I use the Hotfix every time I play. Maybe I just need to check what a signal is doing, maybe I need the inverse function, but it is simply, consistently, the one module that I reach for every time I play.
specs: |-
  - Precise buffered multiple to make things play nice - and in tune
  - Three-to-one active mixer that reduces each input by a third
  - Signal inverter section with inverse output, half-wave and full-wave rectification
  - Three polarity indicator LED helps you keep an eye on things
  - High grade component selection and architecture
  - Built like a tank, skiff friendly rigid-chassis construction
