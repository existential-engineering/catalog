description: A 2x12" angled extension speaker cabinet voiced for the Origin range. Loaded with two 12" Celestion Seventy-80 speakers in an angled baffle for upward stage projection, the Origin212A handles 160W at an 8Ω mono speaker input and is intended to pair with Origin series heads (e.g. Origin50H, Origin20H) or expand an Origin combo, in Marshall's signature black-and-gold cosmetic.
details: |-
  Sleek and vintage styling makes this cabinet the perfect partner for your Origin. Two Celestion Seventy-80 speakers pack enough power for you to deliver the clean and harmonic tones of the Origin amps.

  This angled cabinet is perfect for projecting your sound and is also available as a straight base cab, allowing you to create your own Marshall stack.

  Classic styling matches the vintage looks of the Origin range, and the speakers add a tight low-end and a punchy mid-range to your sound.

  Designed and engineered in UK. Made in Vietnam.
