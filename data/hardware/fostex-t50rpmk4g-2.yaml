details: |-
  Configuration: Semi-open, around-ear, planar magnetic gaming headset with detachable microphone and bilateral cable connectors

  Features:
  - Semi-open housing for ventilation and natural soundstage
  - 4th generation RP planar magnetic driver
  - Detachable electret condenser microphone attachable to either ear cup
  - Inline microphone controller with mute switch and volume adjustment
  - Memory foam ear pads for extended-wear comfort
  - Symmetrical left/right housing design
  - Includes 2 m stereo cable (3.5 mm 3-pole to 3.5 mm 4-pole)

  Series: RP Series
