description: Erica Synths Black Hole DSP by default has 16 effects, each with 4
  adjustable and CV controllable parameters and CV controlled effect select.
details: |-
  The Black Hole DSP tops the Erica Black series with sound effects designed in close co-operation between the Erica Synths team rider KODEK and the Spin CAD software creator Gary Worsham. It carries 16 unique custom effects on a Spin FV-1 chip, with stereo inputs and outputs, a seven segment display for effect select indication and an audio clipping LED.

  Three parameters are controllable both manually and by CV, and effect select is CV controlled as well, so the module can be swept through its whole effect bank from a sequencer or an envelope. Clock rate reduction, also manual and CV controllable, takes the processor down into noisy bitcrush territory.

  Exchangeable external effect boards, sold separately, carry further sets of effects and adapt the module to a particular way of working. To install the FX expansion ROM, the patch knob has to be at its maximum level before the module is turned on. For more delicate CV control over parameters, the module pairs with the Erica Black CV Expander.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first.

  The panel is 14HP wide at a depth of 35mm. Audio inputs take up to 20V peak to peak, CV runs between -10V and +10V, signal attenuation reaches -80dB, and power draw is 112mA on the +12V rail against 32mA on the -12V rail.
specs: |-
  - Spin FV-1 chip
  - 16 unique custom effects
  - Stereo INs and OUTs
  - 3 manually and CV controllable parameters
  - CV controlled effect select
  - Manually and CV controllable clock rate reduction for noisy bitcrush
  - 7 segment display for effect select indication
  - Audio clipping LED
  - Exchangeable external effect boards
  - Audio input level up to 20V ptp
  - CV input level -10V - +10V
  - Signal attenuation -80dB
  - Panel width 14HP
  - Module depth 35mm
  - Power supply 112mA@+12V, 32mA@-12V
