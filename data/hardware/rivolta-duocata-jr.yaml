details: |-
  DESCRIPTION

  JR by name, JR by nature! The DUOCATA JR takes our new DUOCATA model and strips it down to its simplest form. Sporting an undersized Mahogany body, set Mahogany neck construction, our new C++ chunky neck profile, Rosewood fretboard, 25" scale, 24 jumbo frets, compensated aluminum wrap-around bridge, a single DUOCATA P90 pickup with 500K volume and tone controls. This simplicity offers amazing versatility for a single pickup guitar, allowing you to focus on what really matters….Rocking out! FEATURES & SPECS

  Rivolta Premium Soft Case: Optional Add-On
