description: A dynamic bass distortion pedal with a filter-keyed sidechain mode,
  advanced crossover routing, and MIDI/CV integration for parameter automation,
  built to add saturation without losing low end.
details: |-
  Pre-order for the next batch shipping from September 1, 2026. The Godeater+ turns everything you know about bass distortion pedals on it's head. It builds upon the celebrated sound of its predecessors and expands on it in unlike any other pedal out there. Designed for uncompromising bass, the Godeater+ adds weight to just about anything you can throw at it - bass, guitar, synths, drum machines, and even mixes. Improving on the massive saturation of the original pedal, the Godeater+ packs a filter-keyed sidechain, advanced routing possibilities and MIDI integration, allowing you to sculpt your tone with unmatched flexibility. We didn't just stop at the sound - built with high-quality parts into a heavy die-cast aluminium enclosure of our own design, this pedal is equally at home at your feet or your desktop. Key Features:

  Operates on 24V internally (using a regular 9-12V 500mA supply!) - because big bass needs room to breathe.
specs: |-
  - Signature Distortion Circuit: Go from a mild grunt to extreme saturation, while keeping your lows intact.
  - Filter Keyed Sidechain Mode: Moving, breathing, heaving distortion. Hear your sounds come alive in ways you've never heard before.
  - Advanced Crossover Mode: Mix clean lows with distorted highs - or vice versa.
  - MIDI & CV Integration: Automate and control up to three parameters externally.
