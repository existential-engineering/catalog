description: Polar Go is the studio-quality USB audio interface and stereo
  recorder that fits in your pocket. Designed for creators of all kinds —
  musicians, podcasters, live streamers, ASMR artists and content creators.
details: |-
  Polar Go is an all-in-one, pocket-sized stereo recording studio that lets you play, sing, and record with zero hassle. Whether you're a musician, singer-songwriter, live streamer, or podcaster, Polar Go makes creating content as easy as pressing 'record' — no bulky gear, no complex setups.

  Four audio inputs give maximum flexibility: built-in ProCapture™ Left and Right microphones, a headset mic input, and an XLR/jack combi input with +48V phantom power for connecting condenser mics. The advanced DSP engine combines reverb, compression, EQ and noise control to deliver polished, professional audio in any environment, while versatile presets and level controls keep things effortless.

  The Polar Go app pairs with the hardware to provide one-click 'Audio Magic Wand' enhancement, helpful presets, built-in video recording and an intuitive design — letting users test, practice and record video before livestreaming on TikTok, YouTube, Instagram, or Twitch. It connects seamlessly with GarageBand, BandLab and other audio apps on iPhone, Android, Mac and PC.

  A built-in rechargeable battery delivers up to 4 hours of recording, and dual USB-C sockets allow Polar Go to be powered while connected to a recording device. An internal metal base plate attaches to magnetic phone mounts for simple hands-free use.
specs: |-
  - 2 ProCapture™ built-in microphones
  - Internal battery: up to 4 hours
  - 1 microphone preamp
  - Phantom power: 48V
  - 1 instrument input
  - 1 headset input
  - 1 headphone output
  - Loopback supported
  - Connectivity: USB Type-C
  - Magnetic base
  - Simultaneous I/O: 4 x 4 (including Loopback inputs)
  - A/D resolution: 24-bit/96kHz
  - Dimensions: 41 H x 80 W x 65 D mm
  - Weight: 135g / 4.75 oz
  - Mic input frequency response: 20-20kHz ±0.1dB
  - Mic input dynamic range: 109dB (A-Weighted)
  - Mic input THD+N: -101dB (-103dB A-Weighted)
  - Mic input gain range: 53dB
  - Mic input impedance: 3.3kΩ
  - Instrument input frequency response: 20-20kHz ±0.2dB
  - Instrument input dynamic range: 112dB (A-Weighted)
  - Instrument input gain range: 46dB
  - Instrument input impedance: 500kΩ
  - Headphone output frequency response: 20-20kHz ±0.15dB @ 33Ω / 300Ω
  - Headphone output max power: 85mW @ 33Ω / 66mW @ 300Ω
