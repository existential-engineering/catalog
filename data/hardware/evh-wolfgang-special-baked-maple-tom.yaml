description: |-
  Road-tested in arenas around the world, the Wolfgang® Special is a purebred music-making machine, designed with stunning style, giant sound and high-speed playability.
  The Wolfgang Special T.O.M features a basswood body with an arched top and a robust graphite-reinforced bolt-on quartersawn baked maple neck. The neck is carved and rolled to Eddie Van Halen's exacting specifications and features a hand-rubbed satin urethane finish on the back. Primed for high performance, energetic riffing and blazing leads, the 12"-16" compound radius baked maple fingerboard has 22 jumbo frets and black dot inlays. Truss rod adjustments have also never been easier thanks to a spoke wheel conveniently located at the base of the neck.
  A pair of flagship custom-designed EVH® Wolfgang Alnico 2 humbucking pickups are mounted directly to the body, providing dynamic yet articulate voicing, as well as endless sustain for powerful chords and melody lines. A sturdy and dependable EVH compensated bridge and tailpeice w/ fine tuners keep you solid and in the mix. The volume knob with treble bleed circuit has a 500K EVH Bourns® low friction pot for smooth swells and a tone control knob with a 250K Bourns high friction tone pot that prevents accidental tone shifting.The EVH Wolfgang Special T.O.M is available in Gloss Black and Husk White with black hardware, Oxblood with gold hardware and Kandy Green with Chrome Hardware
