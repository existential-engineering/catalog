details: |-
  In its nearly 50-year history, the iconic Spector NS bass has been played by legendary bassists on countless recordings and stages. In the brand's storied history, no bassist has become more synonymous with Spector than Doug Wimbish. Upon receiving his first Spector NS basses in 1987, Doug has employed these instruments on legendary recordings and performances with the likes of Living Colour, Mick Jagger, Jeff Beck, Annie Lennox, Seal, Depeche Mode, Lee "Scratch" Perry, Madonna, and many, many more. Now, Spector's USA Custom Shop is proud to debut the Doug Wimbish USA Signature Series. The collection includes a four-string model, the DW-4, and a 5-string model, the DW-5. Each model has been carefully specified to match the unique properties of Doug's vintage instruments including unique neck carves, nut widths, pickup locations, and even custom-wound EMG pickups that have been voiced alongside the pickups in Doug's 1987 Spector instruments. Experience the sound and feel that inspired Doug's signature style with the new DW-4 and DW-5 models from the Spector USA Custom Shop. Contact an Authorized Spector dealer to purchase yours today.
