description: With a perfect blend of boutique, studio-grade effects, the
  Blackstar Amps Silverline Series will be your go-to amp for every situation.
details: |-
  From effortless control over an array of classic tones to their gig-ready power sections, the Silverline Series will be your go-to amp for every situation. Whether bathing in the boutique-level tone powered by the incredibly powerful SHARC processor and dual-patent design, recording via the onboard USB interface or dialling in the perfect blend of boutique, studio-grade effects, Silverline delivers.

  Silverline guitar amplifiers marry boutique character, effortless tonal tweaking and next-level digital processing power to create the most attractive, best sounding and most responsive digital amplifiers available to date. Powered by Blackstar's patented TVP (True Valve Power) technology, the Response controls deliver the nuanced feel, vibe, and response of six of the most coveted valve power sections in the world, including KT88 and 6L6.

  Six proprietary preamp voicings (Clean Warm, Clean Bright, Crunch, Super Crunch, OD 1 and OD 2) cover the full sonic range from pristine cleans to high-gain overdrive. The patented ISF (Infinite Shape Feature) tone control sweeps the whole tone stack response between USA-style clarity and UK-style midrange punch, while the tone controls remain fully functional throughout the sweep.

  Onboard modulation, delay and reverb effects are based on classic and boutique designs — four of each effect type with two knobs per effect for parameter control. All Silverline combos feature a Celestion V-Type speaker for authentic guitar amplifier voicing, and the entire range is equipped with an onboard USB recording interface for an all-in-one tracking solution.

  Deep editing, patch management and re-amping are available via the free Architect software. A 4-button FS-10 footswitch (sold separately) provides hands-free control over patches and effects. The series ranges from the 20W Silverline Standard for home and small venues, through the 50W Special and 100W Deluxe combos, up to the Stereo Deluxe 2x12 and the Deluxe Head, which can be paired with the matching Silverline 212 cabinet (2x12 Celestion V-Type, 140W, 4 Ohm Mono / 16 Ohm Mono / 8 Ohm Stereo).
specs: |-
  - SHARC DSP processor with patented Blackstar TVP (True Valve Power) technology
  - 6 proprietary preamp voicings: Clean Warm, Clean Bright, Crunch, Super Crunch, OD 1, OD 2
  - 6 Response settings emulating classic valve power sections (including KT88 and 6L6)
  - Patented ISF (Infinite Shape Feature) tone control
  - Onboard modulation, delay and reverb effects (4 of each type) based on boutique designs
  - Tap tempo
  - Onboard USB recording interface
  - Speaker emulated output / headphones
  - Line-in
  - Built-in tuner
  - Effects loop
  - Footswitchable via optional FS-10 4-button footswitch
  - Celestion V-Type speakers (combo models)
  - Free Architect software for deep editing and patch sharing
  - Silverline Standard: 20W, 10" Celestion V-Type
  - Silverline Special: 50W, 12" Celestion V-Type
  - Silverline Deluxe: 100W, 12" Celestion V-Type
  - Silverline Stereo Deluxe: 100W, 2x12" Celestion V-Type
  - Silverline Deluxe Head: 100W head
  - Silverline 212 cabinet: 2x 12" Celestion V-Type, 140W, 4 Ohm Mono / 16 Ohm Mono / 8 Ohm Stereo
