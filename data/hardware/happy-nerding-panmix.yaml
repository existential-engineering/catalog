description: PanMix is a 6 channel mixer with manual and CV panning and volume
  controls, with a total volume knob, headphone output and 10 segment LED
  metering.
details: |-
  PanMix is a 6 channel mixer with manual and CV panning and volume controls. Each of the six channels has manual panning and volume on dual concentric knobs, plus a bipolar CV knob with a switch that applies the CV to either amplitude or panning.

  A total volume knob controls the L+R output, there is a headphone output, and 10 segment LED indicators show the L and R channels. The module uses high quality parts for lowest noise and distortions, with an equal power pan law (3dB), exponential CV response for amplitude and linear CV response for pan.

  Inputs 3 and 6 have a mono/stereo switch on the module's backside, so each of these inputs can be optionally set to either stereo or mono operation. For stereo mode a standard 3.5 mm TRS plug should be used. The user can therefore set the module to 6 mono inputs, 5 mono inputs plus 1 stereo, or 4 mono inputs plus 2 stereo.

  The latest revision of PanMix has a stereo send connector available on the back side, allowing the PanMix total output to be internally sent to other Happy Nerding stereo modules. At the moment Isolator, PanMix Jr and 3xStereo Mixer can internally receive this stereo signal.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - 6 channel mixer with manual panning and volume for each of the 6 channels with dual concentric knobs
  - Bipolar CV knob per channel, switchable between amplitude and panning
  - Total volume knob (L+R)
  - Headphone output
  - 10 segment LED indicators for L and R channels
  - High quality parts for lowest noise and distortions
  - Equal power pan law (3dB)
  - Exponential CV response for amplitude
  - Linear CV response for pan
  - Mono/stereo switch on inputs 3 and 6 (backside), 3.5 mm TRS plug for stereo mode
  - Stereo send connector on the back side (latest revision)
  - 200 mA +12V
  - 200 mA -12V
  - 35 mm depth
  - 16 HP wide
  - Reverse power protected
