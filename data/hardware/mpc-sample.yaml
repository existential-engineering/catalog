details: |-
  Mpc sample is a portable standalone sampler, sequencer, and effects processor designed for beatmaking, sampling, and music creation without needing a computer.

  Inspired by the classic mpc60 design, this portable device puts the iconic workflow of vintage mpcs into a compact, modern format with features that empower limitless creativity.

  Comes loaded with over 100 artist and producer drum kits, four creative effect engines, and an intuitive chopping workflow to spark ideas immediately.

  Features 16 velocity and pressure sensitive rgb mpc pads, a full-color display, onboard sequencing, and real-time effects for sampling, chopping, and building beats anywhere.

  Designed for beatmakers, sample-based producers, singer-songwriters, live performers, dawless jammers, indie creators, and beginner/hobbyist musicians seeking a new form of inspiration and expression.
