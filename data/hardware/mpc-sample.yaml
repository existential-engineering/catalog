specs: |-
  - USB-c powered
  - Internal rechargeable lithium-ion battery (5 hours)
  - Instant sample chop mode
  - 4 internal effects processors
  - 16 rgb backlit mpc pads with poly aftertouch
  - Internal resampling with fx
  - 60 onboard effect types
  - 3 real-time control/effects knobs
  - Microsd card storage
  - Legacy mpc parameter slider
  - 1/8" trs headphones
  - New master compressor with retro color
  - MIDI in/out (requires 1/8" to MIDI din adapter)
  - USB-c audio/MIDI connectivity
  - Stereo in/out - 1/4" trs line-level
  - Internal disk-streaming sample engine
  - 8gb internal storage (including ~2gb factory data)
  - Maximum sampling time: 20 minutes per sample
  - Sampling frequencies: 24-bit or 16-bit, 44.1k, 48k, 96k
  - Built-in mic and 3-watt speaker
  - Dimensions: 23.6(l) x 19.4(w) x 5.0(h) cm
