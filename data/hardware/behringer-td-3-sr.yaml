description: An ultra-affordable analog bass line synthesizer built as a
  faithful homage to the Roland TB-303, with a pure analog signal path and
  authentic VCO, VCF and VCA designs. A 16-step sequencer, arpeggiator, onboard
  distortion circuit and 16-voice Poly Chain round out the monophonic voice.
details: |-
  Only produced from 1981 to 1984, the Roland TB-303 was a tremendous commercial flop as a replacement for the bass guitar, however it soon found its place as one of the most-loved synthesizers for what became known as Electronic Dance Music (EDM). An ultra-affordable and faithful homage to the iconic synthesizer that spawned house music, plus an all-new Distortion circuit, the TD-3-SR lets you conjure up virtually any sound with incredible finesse and ease. With its pure analog signal path, 16-step Sequencer and authentic VCO, VCF and VCA filters, the TD-3-SR is sure to become one of your favorite synthesizers.

  Great care has been taken in engineering the TD-3-SR, including the true to the original VCO, VCF and VCA designs and pure analog circuitry with matched transistors. This highly-focused attention to detail is what gives TD-3-SR its ultra-flexible sound shaping capability, which covers everything from super-fat bass and lead tones to stunning effects, all the way out to the otherworldly sounds of your imagination.

  The very heart of TD-3-SR's sound is its versatile 24 dB/octave filter, which lets you freely experiment with the low-pass Cutoff frequency and Resonance settings to dial in the perfect sound. TD-3-SR's authentic Voltage Controlled Oscillator (VCO) with transistor wave-shaping circuitry is ultra-easy to use and provides your choice of reverse-sawtooth or pulse waveforms for the ultimate in sound creation.

  The onboard sequencer with 7 tracks allows you to program up to 16 steps of notes and rests and save them as a Pattern. You can record, save and recall up to 250 patterns, all of which can be stored in the 4 Groups. Your sequences can be played either in Keyboard mode, where you create and store the pattern, or Step mode which allows you to interact while composing a pattern.

  While it is a monophonic instrument (one note at a time), TD-3-SR's 16-note Poly Chain function lets you combine multiple synthesizers for up to 16-voice polyphony, plus provides vastly improved reliability and stability over its 1970s and '80s predecessors.
specs: |-
  - Monophonic analog bass line synthesizer with true analog circuitry
  - Pure analog signal path based on the original VCO, VCF and VCA designs, with matched transistors
  - VCO with transistor wave-shaping circuitry, reverse-sawtooth or pulse (square) waveform
  - 24 dB/octave 4-pole low-pass resonant filter with Cutoff, Resonance, Envelope, Decay and Accent controls
  - 16-step sequencer with 7 tracks, 250 user patterns per track, stored across 4 Groups
  - Keyboard mode and Step mode sequencer programming
  - Arpeggiator with wide pattern selection
  - Analog distortion circuit modeled after the DS-1, with Drive control and On/Off switch
  - 16-voice Poly Chain for up to 16-voice polyphony across linked units
  - 11 controls and 28 switches for direct real-time parameter access
  - MIDI and USB implementation with MIDI channel and Voice Priority selection
  - Multi-I/O patchbay for external devices, with default signal routing that needs no patch cables
