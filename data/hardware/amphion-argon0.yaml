description: The Argon0 is a compact two-way bookshelf loudspeaker handmade in
  Finland, featuring a 1" titanium tweeter and 4½" aluminum woofer with 5th
  generation waveguide technology for natural sound reproduction and a room-wide
  sweet spot.
details: |-
  The Argon0 is a zero-compromise desktop loudspeaker handmade in Finland, designed to deliver natural, accurate sound reproduction in a compact bookshelf form factor.

  At the heart of the Argon0 is Amphion's 5th generation waveguide technology, which enables seamless driver integration between the 1" titanium tweeter and 4½" aluminum woofer crossed over at 1600 Hz.

  The two-way vented design produces a wide, room-filling sweet spot with even dispersion across the listening area, making the Argon0 easy to place and reliable even in challenging room acoustics.

  The Argon0 is available in a Walnut finish and supports optional color grids and wall mounting brackets with threaded inserts for flexible installation.
specs: |-
  - Operating Principle: Two-way, vented
  - Tweeter: 1" titanium
  - Woofer: 4½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 86 dB
  - Frequency Response: 50–25,000 Hz (-6dB)
  - Power Recommendation: 25–120 W
  - Dimensions (H×W×D): 260×132×220 mm
  - Weight: 5 kg (11 lbs)
  - Manufacturing: Handmade in Finland
