description: Three socket upgrade kit that fits CV, Gate and Filter input
  sockets to the Roland SH-1000, so the synthesiser can be played from a Kenton
  MIDI to CV converter.
details: |-
  This kit adds CV, Gate and Filter sockets to the Roland SH-1000. Used with a MIDI to CV converter such as the Pro-Solo mkII or the Pro-2000 mkII, the three extra sockets let the synthesiser be played from a MIDI keyboard or MIDI sequencer.

  The inputs sit on 3.5mm mono jack sockets. CV provides volt per octave control over oscillator frequency, Gate controls when notes play with 0 volts as note off and above 3 volts as note on, and Filter controls the cutoff frequency of the low pass filter from the aux output of the converter.

  Paired with a Pro Solo mk3 or a USB Solo mkII, the kit gives control over notes across at least five octaves, pitchbend with a range set in the converter, modulation from the converter's own LFO with speed and waveshape adjustable in real time, portamento with a rate adjustable in real time, filter cutoff from any continuous controller or from aftertouch or velocity, selectable low, high or recent note priority, and single or multiple note trigger modes.

  The kit contains a circuit board together with the components and diagrams needed for connecting the wires and components and for mounting the three 3.5mm mono jack sockets. A separate MIDI retrofit kit is available for the same instrument if MIDI sockets rather than CV sockets are wanted. Installation is a job for a competent synthesiser service engineer.
specs: |-
  - Adds three 3.5mm mono jack input sockets: CV, Gate and Filter
  - CV input is volt per octave over oscillator frequency
  - Gate threshold is 0 volts for note off and above 3 volts for note on
  - Filter input controls low pass filter cutoff from the converter aux output
  - Note range of at least five octaves, limited by the synthesiser rather than the kit
  - Intended for use with a Kenton MIDI to CV converter such as the Pro Solo mk3 or USB Solo mkII
  - Supplied with a circuit board, components, wiring diagrams and mounting hardware
  - Passive socket kit, so it has no power connection of its own
