details: |-
  Product Overview

  The Heil PR 37 is Heil Sound's next-generation dynamic vocal microphone, specifically engineered to deliver ultra-clear, transparent vocal reproduction that effortlessly cuts through high-volume, dense live instrument mixes. Built for lead vocalists, touring performers, and front-of-house engineers, the PR 37 combines smooth high-frequency response with a tailored upper-midrange presence that enhances vocal speech articulation and projection without adding artificial sibilance or harshness.

  Featuring a large dynamic element with a wide 40 Hz to 18 kHz frequency response, the PR 37 offers an elevated output sensitivity level (-48.9 dB) that ensures strong preamp drive and pristine signal-to-noise ratio. Its tight supercardioid polar pattern yields an industry-leading -40 dB of rear noise rejection at 180° off-axis , maximizing gain-before-feedback on loud stages and isolating vocals from monitor bleed and drum spill. Encased in a rugged zinc die-cast housing with a heavy-duty steel grille and internal element isolation, the PR 37 is built to handle the rigorous demands of professional touring while maintaining uncompromised sound quality.
specs: |-
  - Next-Generation Vocal Voicing: Engineered with an upper-midrange response curve that enables lead vocals to effortlessly cut through dense, high-volume stage mixes with modern clarity.
  - High Output Sensitivity (-48.9 dB): Provides higher signal output than traditional dynamic microphones, driving mixing consoles and wireless transmitters cleanly for optimal dynamic headroom.
  - Industry-Leading Rear Rejection (-40 dB): Tight supercardioid pickup pattern offers maximum off-axis rejection at 180°, virtually eliminating stage monitor feedback and instrument bleed.
  - Robust Zinc Die-Cast Housing: Built with a heavy-duty zinc-alloy metal body and protective steel grille to withstand harsh touring environments and accidental stage drops.
  - Internal Element Isolation: Advanced shock mounting and acoustic dampening reduce mechanical handling vibration and stand-transmitted rumble.
  - High SPL Handling (140 dB Max SPL): Effortlessly handles high acoustic sound pressure levels from powerful vocalists without clipping or mechanical distortion.
  - Passive Dynamic Operation: Operates via standard 3-pin XLR connection; requires no phantom power (+48V) or inline active preamp devices.
  - Element Type: Dynamic.
  - Frequency Response: 40 Hz – 18 kHz.
  - Polar Pattern: Supercardioid.
  - Rear Rejection (@ 180° off-axis): -40 dB.
  - Output Level (@ 1 kHz): -48.9 dB.
  - Impedance: 370 ohms balanced.
  - Max SPL: 140 dB.
  - Output Connection: 3-pin XLR.
  - Body Material: Zinc die-cast housing.
  - Weight: 12.25 oz (347 g).
  - Included Accessories: microphone clip, foam windscreen, and padded leatherette carrying case.
