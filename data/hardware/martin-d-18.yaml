details: |-
  The Martin D-18 is one of the most renowned dreadnought guitars in the world, used by professional musicians and enthusiasts for nearly a century. It delivers bold, projective tone and strong bass through its solid Sitka spruce top paired with solid mahogany back and sides.

  The instrument is known for bright trebles, a punchy midrange, and exceptional clarity, all wrapped in a straightforward, no-frills aesthetic that has come to define the standard for dreadnought acoustic guitars.

  The 2025 Standard Series refresh enhances this classic model with Sitka spruce Golden Era top bracing that provides vintage-inspired tone and sustain. Improvements include a redesigned neck profile, thinner fingerboard, and refined bridge and heel for better playability.

  The D-18 ships with Martin Authentic Acoustic Lifespan 2.0 phosphor bronze medium gauge strings and includes a hardshell case with brass or nickel-plated hardware.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Sitka Spruce
  - Back & Sides: Mahogany
  - Bracing Pattern: Forward-Shifted X-Brace (GE-Scalloped)
  - Scale Length: 25.4"
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Bridge Material: Ebony
  - Frets: 20 total
  - Electronics: None
  - Finish Options: Gloss and Satin
  - Case: Hardshell included
