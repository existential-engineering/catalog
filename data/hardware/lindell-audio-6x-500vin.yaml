details: |-
  The 6X-500VIN "Vintage Edition" juices your 500 Series rack with a single-channel transformer-coupled mic preamp along with a passive 2-band Pultec-style equalizer.

  This all-discrete design, based upon the highly respected Vintage 1731 amplifier, gives an EQ section with the sound of a classic Pultec: a 15dB boost of silky high end alongside punchy low end, in a single 500 Series module.

  Lindell Audio describes the 6X-500VIN as a fast, in-your-face sound at an affordable price.
specs: |-
  - Transformer coupled Balanced inputs and Balanced Outputs
  - Up to 65dB of Gain
  - Passive Pultec Equalizer. Inductor + 990 gain make-up amplifier
  - 3 Step Switched EQ Low Freq Boost 30Hz, 60Hz, 100Hz +/-10%
  - 3 Step Switched EQ High Freq Boost 6kHz, 10kHz, 16kHz +/-10%
  - Selectable High Boost Bandwidth on pcb
  - Polarity Reverse
  - Pin Compatible with 990 & 2520 type op-amps
  - 48V Phantom Power
  - All discrete Vintage OPA1731
  - 5-LED VU Meters
  - Gold Plated PCB
