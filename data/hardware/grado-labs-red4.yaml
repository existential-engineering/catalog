description: |-
  Red4 is part of the Grado Prestige Series, delivering a balanced and engaging presentation built on decades of cartridge design experience. It maintains the core performance principles that define Grado cartridges while offering broad system compatibility.

  Utilizing Grado's moving iron design, Red4 provides a stable and consistent signal with low moving mass and long-term reliability. The die-injection molded housing supports consistent construction and dependable performance. Offered in both standard mount and P-mount configurations, Red4 is designed for a wide range of systems.

  Red4 is a high output moving iron cartridge designed for compatibility with a wide range of phono stages. Its presentation is balanced and controlled, with clear detail and a smooth, natural top end. The midrange carries presence and body, while low frequencies remain defined and composed. Recordings are presented with stability and coherence, maintaining separation and imaging while allowing the character of the music to come through naturally.

  Red4 features a bonded elliptical diamond mounted to an aluminum cantilever. The elliptical profile provides effective groove contact and reliable tracking, while the aluminum cantilever contributes to a stable and controlled presentation. The stylus assembly is user-replaceable, allowing for easy maintenance and long-term ownership. All Prestige Series styli are interchangeable.
