description: >-
  The Yamaha CS-60 is an 8-voice polyphonic analog synthesizer released in 1977 as a more
  compact and affordable alternative to the flagship CS-80. It features 61 keys with
  aftertouch, a ribbon controller for pitch bends, and hands-on control via numerous
  sliders for crafting pads, drones, basses, and other analog sounds.
details: |-
  The CS-60 represents Yamaha's attempt to make analog polyphonic synthesis more accessible by creating a scaled-down version of the legendary CS-80. While it shares the DNA of that flagship instrument, the CS-60 makes significant compromises in programmability and sound depth.

  The instrument features 12 presets and one user patch, which are generally considered limited. However, the synth compensates through hands-on control with numerous sliders and parameters that enable interesting pads, drones, basses, and other analog synth sounds. A distinctive feature is a long velvet ribbon controller positioned between the keyboard and the preset switches, useful for expressive pitch bends.

  Each of the 8 voices has one VCO with square, sawtooth, and PWM waveforms, plus a sub-oscillator with four wave types and a noise generator. The filter section provides both high-pass and low-pass filters with resonance and an ADSR envelope. A ring modulator adds further timbral possibilities.

  Notable artists who used the CS-60 include Air, Jean-Michel Jarre, Oshe, and Bob Marley and the Wailers. Like many vintage analog instruments, the CS-60 can suffer from overheating, unstable tuning, and general maintenance challenges due to its age and weight.
specs: |-
  - 8-voice polyphony
  - 1 VCO per voice with square, sawtooth, and PWM waveforms
  - 1 sub-oscillator per voice with 4 wave types
  - Noise generator
  - High-pass and low-pass filters with resonance
  - Filter ADSR envelope
  - Ring modulator
  - 12 presets, 1 user patch
  - 61 keys with aftertouch
  - Velvet ribbon controller
  - CV/Gate inputs
