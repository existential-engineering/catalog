description: >-
  The Waldorf D-Pole is a VST plugin filter processor from 1999 that brings
  Waldorf's acclaimed analog-modeled filter designs from the Microwave, Pulse,
  and Miniworks into a software environment with additional delay, ring
  modulation, and overdrive capabilities.
details: |-
  Released in 1999, the Waldorf D-Pole was one of the early VST plugins to bring high-quality
  analog-modeled filter processing to the software domain. Drawing on filter designs proven in
  Waldorf's hardware synthesizers including the Microwave, Pulse, and Miniworks, it offered
  musicians a way to process audio tracks with the character of Waldorf's renowned filters.

  The plugin provides five filter modes: lowpass, highpass, bandpass, notch, and resonator, with
  selectable 12dB or 24dB slopes and a frequency range from 0 Hz to over 17,000 Hz. Resonance
  can be driven to self-oscillation. An integrated oscillator with sine, triangle, and sawtooth
  waveforms can be mixed with the input signal, and the LFO runs up to 7,000 Hz with tempo sync
  capability for rhythmic filter effects.

  Beyond filtering, the D-Pole includes a delay module with up to 2,000ms delay time, ring
  modulation, overdrive, sample rate reduction, and an envelope follower for dynamic control.
  Full parameter automation made it a versatile tool for both subtle tonal shaping and dramatic
  effects processing. It ran on Power Macintosh or Pentium systems in any VST-compatible host.
specs: |-
  - Type: VST plugin (filter processor)
  - Filter modes: Lowpass, highpass, bandpass, notch, resonator
  - Filter slopes: 12dB or 24dB selectable
  - Frequency range: 0 Hz to 17,000+ Hz
  - Resonance: With self-oscillation
  - Oscillator: 1 (sine, triangle, sawtooth)
  - LFO: Up to 7,000+ Hz, tempo-syncable (sine, triangle, saw)
  - LFO modulation: Filter cutoff and panning
  - Delay: Up to 2,000ms
  - Additional effects: Ring modulation, overdrive, sample rate reduction
  - Envelope follower: Yes
  - Memory: Unlimited presets, saves with sequences
  - System requirements (Mac): Power Macintosh 132 MHz+, 24 MB RAM, Mac OS 7.5+
  - System requirements (PC): Pentium 133 MHz+, 32 MB RAM, Windows 95/98/2000
