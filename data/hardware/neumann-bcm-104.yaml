url: https://www.neumann.com/en-us/products/microphones/bcm-104
description: The BCM 104 is a dedicated broadcast microphone for radio,
  streaming and podcast, designed to convey emotion with Neumann perfection. Its
  functionally optimized design features an integrated pop screen and a shock
  protected large diaphragm condenser capsule, specially developed for speech.
  Transformerless circuitry ensures a direct, noise-free sound.
details: |-
  Specially designed for broadcast, podcast & streaming

  All-new speech optimized condenser capsule

  Functionally optimized design

  Specially designed large diaphragm condenser capsule

  Tight cardioid pattern

  Integrated pop screen and shock mount

  Headgrille twists off easily for quick cleaning

  Internal pad and low cut switches
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional Pattern: Cardioid
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 22 mV/Pa = -33.1 dBV +/- 1 dB
  - Sensitivity at -14 dB attenuation: 4.4 mV/Pa
  - Rated Impedance: 50 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level, CCIR: 18 dB
  - Equivalent noise level, A-weighted: 7 dB-A
  - Maximum SPL for THD 0.5%: 138 dB
  - Maximum SPL for THD 0.5% with preattenuation: 152 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 76 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 87 dB
  - Maximum output voltage: 10 dBu
  - Supply voltage ( P48, IEC 61938): 48 V +/- 4 V
  - Current consumption ( P48, IEC 61938): 3.2 mA
  - Matching connector: XLR 3 F
  - Weight: 500 g
  - Diameter: 64 mm
  - Length: 85 mm
  - Height: 110 mm (without suspension)
