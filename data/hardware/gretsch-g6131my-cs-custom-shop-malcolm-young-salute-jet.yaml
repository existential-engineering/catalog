details: |-
  Malcolm Young, we salute you. At long last, Gretsch honors the guitarist whose rock-solid rhythm guitar swagger and songwriting provided the unshakable foundation for Australia's most beloved musical export, AC/DC, for more than 40 years.

  The G6131MY-CS Custom Shop Malcolm Young "Salute" Jet pays faithful homage to Young's famously battle-hardened instrument, which began life in 1963 as a red Gretsch Jet Firebird handed down to him by Harry Vanda and elder brother George Young (of Easybeats fame) and nicknamed "The Beast." Malcolm certainly made the instrument his own, not least by removing two of the three pickups, stripping away the finish, and pounding out some of the hardest rocking rhythm guitar ever heard in either hemisphere.

  The G6131MY-CS Custom Shop Malcolm Young "Salute" Jet is a meticulously crafted Gretsch Custom Shop recreation accurate down to every last nick, scratch and dent acquired over Young's long and raucously illustrious career.
