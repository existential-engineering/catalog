description: |-
  Gold4 represents the highest level of performance within the Grado Prestige Series. Built on decades of cartridge design and refinement, it delivers a balanced and highly musical presentation while maintaining the consistency and reliability that define Grado cartridges.

  Utilizing Grado's moving iron design, Gold4 provides a stable and responsive signal with low moving mass and long-term performance. The die-injection molded housing supports consistent construction while allowing the internal components to perform with precision.

  Offered in both standard mount and P-mount configurations, Gold4 is designed for a wide range of systems.

  Gold4 is a high output moving iron cartridge designed for compatibility with a wide range of phono stages. Its presentation is defined by clarity, control, and refinement. Detail is resolved with precision while maintaining a smooth and composed top end. The midrange carries natural presence and texture, while low frequencies are delivered with definition and authority.
