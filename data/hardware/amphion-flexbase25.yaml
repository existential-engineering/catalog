url: https://amphion.fi/products/flexbase25/
description: A stereo bass extension system that transforms two-way studio
  monitors into full-range, three-way systems, maintaining stereo information
  down to the lowest octave. Includes the FlexAmp1200 amplifier with adjustable
  crossover frequency (35–260 Hz) and bass level controls.
details: |-
  The FlexBase25 is a stereo closed-box bass extension system designed to extend two-way studio monitors into full-range, three-way systems. It features 2×10" aluminum drivers and transfers bass frequencies to improve midrange clarity and power-handling of paired monitors.

  An adjustable crossover frequency of 35–260 Hz and switchable 2-way/3-way configuration provide maximum flexibility for different monitor pairings. Fixed center-line placement design with wide adjustment range.

  The system is connected via 3.5 m cables with 4-pole Neutrik Speakon connectors and is compatible with all Amphion monitor sizes.

  The included FlexAmp1200 amplifier provides 700 W per channel at 4 Ω with a dynamic range of 127 dB (A-weighted). Universal mains voltage: 100–240 V, 50–60 Hz.
specs: |-
  - Operating Principle: One-way closed box, stereo
  - Drivers: 2×25 cm (10") aluminum
  - Frequency Response: 20–260 Hz ±3dB
  - Max SPL: 117dB
  - Dimensions: 854×340×320 mm
  - Weight: 45 kg (99.2 lbs)
  - Connection: 3.5 m cable with 4-pole Neutrik Speakon
  - FlexAmp1200 Output Power: 700W per channel @ 4Ω
  - FlexAmp1200 Dynamic Range: 127 dB (A-weighted)
  - FlexAmp1200 Mains: Universal 100–240 V
  - FlexAmp1200 Dimensions: 88×483×260 mm
