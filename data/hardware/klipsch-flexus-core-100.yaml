description: The Klipsch Flexus Core 100 is a 2.1-channel Dolby Atmos soundbar
  featuring two 2.25" aluminum drivers and dual built-in 4" subwoofers,
  developed in partnership with Onkyo. It serves as the entry-level foundation
  of the expandable Flexus ecosystem and is controlled via the Klipsch Connect
  Plus app with EQ presets, Night Mode, and Dialogue Boost.
details: |-
  The Flexus Core 100 is Klipsch's entry-level soundbar in the Flexus lineup, combining the company's acoustic heritage with Onkyo's manufacturing expertise. It delivers virtual Dolby Atmos spatial sound processing through two 2.25" aluminum full-range drivers paired with dual 4" subwoofers built directly into the bar, eliminating the need for a separate subwoofer for basic operation.

  The soundbar is designed as a starting point for a scalable home theater system. Users can expand the setup by adding a Flexus Sub 100 or Sub 200 subwoofer, or Flexus Surr 100 or Surr 200 surround speakers, all connected via Klipsch's proprietary wireless transport technology.

  Control is handled through the Klipsch Connect Plus app (iOS and Android), which provides access to custom EQ mixing, preset modes, Night Mode for reduced dynamic range, and Dialogue Boost for improved speech intelligibility. The unit is available in Black and Walnut finishes.
