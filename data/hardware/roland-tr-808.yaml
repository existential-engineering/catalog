description: >-
  An analog drum machine whose fully synthesized kick drums, snares, and
  percussion became the rhythmic foundation of hip-hop, R&B, dance, and techno,
  shaping popular music for decades after its discontinuation.
details: |-
  When Roland introduced the TR-808 Rhythm Composer in 1981, programmable drum machines were still a novelty, and the dominant expectation was that they should faithfully reproduce acoustic drum sounds. The 808 made no such attempt. Its voices are generated entirely through analog synthesis rather than sampled recordings, producing a palette of percussive tones that sounded artificial compared to competitors like the Linn LM-1. This perceived shortcoming led to modest sales, and Roland ceased production in 1984.

  The instrument's sonic character turned out to be its greatest asset. The deep, booming kick drum — capable of rattling speaker cones and shaking subwoofers — became the rhythmic backbone of an enormous swath of popular music. The crispy, metallic snare, the sharp handclap, the instantly recognizable cowbell, and the sizzling hi-hats each carved out their own space in musical history. Most of the sixteen sounds offer tuning and decay controls, and individual audio outputs allow external processing of each voice separately.

  The onboard step sequencer holds 64 patterns and 12 songs, with an auto fill-in function that adds variation during playback. Programming is handled through a row of sixteen buttons corresponding to steps in the pattern, a workflow that influenced virtually every drum machine and step sequencer that followed. The accent function allows dynamic emphasis on specific beats, adding groove and swing to otherwise rigid machine rhythms.

  The TR-808 found its true audience in the streets and studios of early hip-hop, where producers like Afrika Bambaataa and later Dr. Dre built entire sonic worlds around its distinctive tones. Simultaneously, it became foundational to Chicago house, Detroit techno, and Miami bass. The band 808 State even took its name from the machine. Kraftwerk, the Beastie Boys, Aphex Twin, and the Prodigy are among the many artists who incorporated its sounds into landmark recordings.

  Few instruments have had such a profound and lasting impact on popular music. The 808's sounds are so deeply embedded in contemporary production that they transcend genre boundaries entirely, appearing in everything from trap and reggaeton to mainstream pop. Its influence continues through countless drum machine descendants, sample packs, and plugin emulations.
specs: |-
  - Voices: 12 analog synthesized sounds
  - Sounds: Bass drum, snare, low/mid/hi toms, low/mid/hi congas, rimshot, claves, handclap, maracas, cowbell, cymbal, open and closed hi-hat
  - Sequencer: 64 patterns, 12 songs, auto fill-in
  - Features: Accent control, individual voice outputs, tunable and editable sounds
  - Keyboard: None
  - Connectivity: DIN Sync In/Out
  - Produced: 1981–1984
