id: RGZIw_OcsXbx3x3ez1bdn
name: CDMix USB
manufacturer: numark
primaryCategory: mixer
url: https://www.numark.com/product/cdmix-usb
description: Dual CD/USB media player with a built-in two-channel mixer, dual EQ
  bands, onboard effects, and balanced XLR outputs for self-contained DJ
  performance.
details: |-
  The Numark CDMix USB is a fully self-contained DJ system that combines dual CD/USB media players with an integrated two-channel mixer. It plays music from CDs, CD-Rs, MP3 CDs, USB flash drives, or an RCA auxiliary input, and includes a digital two-channel mixer with dual EQ bands and a bright, illuminated display for media switching. Built-in effects support smooth transitions, while the rubberized jog/shuttle wheels enable pitch bending and scratching.

  Housed in a solid steel chassis, CDMix USB is built for professional use in clubs, mobile DJ rigs, and similar environments. A backlit LCD provides high visibility in low- or no-light venues and displays track details such as BPM, total time, and ID3 tag. The unit can connect to a PA system via balanced XLR or unbalanced RCA outputs.

  CDMix USB automatically detects BPM and includes a Tap Tempo control for manual beat alignment. Users can monitor and control features such as master tempo, program playlist, reloop, and pitch range. An auxiliary RCA input plus XLR and 1/4-inch mic inputs handle additional sources, including connecting a phone for guest requests.
