details: |-
  The MID-500 is a classic passive equalizer, created to satisfy the requests of Lindell users. Based on the Pultec MEQ-5 filters, the MID-500 is completely discrete and uses hand-wound transformers, inductors, capacitors and transistors in the signal chain.

  Based on the classic Pultec MEQ-5 mid-band EQ, the MID-500 500-Series Passive EQ provides 3 bands of equalization centered on a selectable mid-frequency dip. Its construction includes hand-wound transformers, inductors, capacitors, and transistors, all geared towards supplying a vintage tone reminiscent of the MEQ-5.
specs: |-
  - Peak Boost: 200, 300, 500, 700, 1000 Hz, 0 to 10 dB
  - Peak Boost: 1.5, 2, 3, 4, 5 kHz, 0 to 8 dB
  - Dip Attenuate: 200, 300, 500, 700, 1000 Hz and 1.5, 2, 3, 4, 5, 7 kHz, 0 to 10 dB
  - Loss: none. Passive equalizer loss is restored by operational amplifier, with no overall loss and no gain
  - In-Out key switches equalization in and out without clicks
