description: Billie Joe Armstrong Signature 100W head handwired in the UK.
details: |-
  Built on the foundation of the legendary 1959, the 1959BJA offers more gain, more body and enhanced low mids in its signature form. Its distinctive design takes inspiration from Billie Joe Armstrong's first guitar, Blue. Featuring brass and silver panel details, custom Dookie branding, and Billie Joe's signature, this UK-made amp head serves as a tribute to the sound that defined an era.

  It's an unmistakable tone that has stayed with Billie Joe Armstrong since recording the monumental Dookie record. Developed with the Green Day frontman, the 1959BJA Artist Signature captures the authentic punk rock tone in a unique evolution of the legendary 1959.

  Building on the original 1959, the 1959BJA adds a master volume, cascaded input stages and additional gain for more saturated overdrive, while increased low-end response delivers added depth and a thicker, fuller tone.

  Proudly handwired in the Bletchley factory, this amp embodies Marshall's legacy of tone and quality. Decades of craftsmanship combine with modern artist collaboration to ensure legendary signature sound.

  Every detail carries Billie Joe's personal touch: the striking blue finish inspired by his first guitar that he still uses to this day, the renowned Dookie logo, and his very own signature as a stamp of approval.
