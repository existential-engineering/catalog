details: |-
  Released in 2020, the HEDDphone was designed to bring the clarity and accuracy of HEDD's Air Motion Transformer driver to the headphone world. Thanks to its open-back design and a redesigned AMT allowing the reproduction of frequencies from 10 to 40 kHz, it has won accolades from the likes of Sound on Sound and has been the choice for top engineers across genres.

  The high-definition HEDD AMT driver features Variable Velocity Transformation (VVT), which allows the reproduction of frequencies from 10 to 40 kHz. Its open-back design ensures an expansive sound stage and natural, honest sound.

  High-quality, durable components are used throughout for extended product life, and the ear pads are made from premium, vegan materials that are soft and durable. At 730g it is the heaviest of the HEDDphone line.
specs: |-
  - Type: Open-back over-ear headphone
  - Driver: AMT with full-range VVT technology
  - Frequency Range: 10 Hz - 40 kHz
  - Minimum Power: 200 mW
  - Recommended Power: ≥1000 mW
  - Weight: 730g
