description: A hand-wired 50 watt all-tube two channel 1x12 combo loaded with a
  Celestion G12H Redback, running from classic plexi cleans to Friedman's modern
  high gain voice.
details: |-
  Dave Friedman's Smallbox 50 watt 1x12 combo was designed for guitarists who want the classic tones reminiscent of great vintage plexis as well as Friedman's more modern high gain offerings.

  The Smallbox combo features two channels, running from classic plexi tones to modern high gain. A shared tone stack of bass, middle, treble and presence sits behind both, with a master volume and a gain control for each channel, and the clean channel adds a three-position bright switch.

  At the heart of the combo is a 16 ohm 12 inch Celestion G12H Redback speaker rated at 150 watts, which delivers the bass and mid response and the signature sound expected of a Friedman amp.

  The Smallbox combo was designed to take pedals and suits boosts, overdrives, phasers, flangers, tremolos and wahs, while the ultra-transparent series effects loop handles time-based effects pedals and rack units. A line out with its own level control, a 4, 8 and 16 ohm impedance selector switch and the included single button footswitch with LED complete the package.

  Baltic Birch construction and custom USA made transformers mean it is built to withstand the rigors of the road, and it carries a limited lifetime warranty.
specs: |-
  - 50 watt all-tube 1x12 combo
  - Two channels
  - Hand-wired in the USA
  - 2 x EL-34 power tubes
  - 3 x 12AX7 preamp tubes
  - Celestion 16 ohm G12H 12 inch Redback speaker, 150 watts
  - Two master volumes and two gain controls
  - Shared channel EQ consisting of bass, middle, treble and presence
  - Clean channel has a 3 position bright switch
  - Line out with level control
  - Ultra transparent series FX loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Baltic Birch construction
  - Single button footswitch with LED
  - Limited lifetime warranty
  - Dimensions: 9.5 in (D) x 24.25 in (W) x 22 in (H)
  - Weight: 52.5 lbs
