description: The Empress ZOIA Euroburo is a 34hp Eurorack-format digital modular
  effects and synthesis system based on the ZOIA platform. It can live in a
  Eurorack case or on a desktop via an optional slim enclosure, and adds
  extensive CV I/O, stereo 3.5mm audio and a headphone output to the ZOIA's 80+
  modules.
details: |-
  The ZOIA Euroburo brings the ZOIA modular effects and synthesis environment into Eurorack format. It is a 34hp, skiff-friendly module (28mm deep including the power cable) that can be placed in a Eurorack system, or run standalone on a desktop using an optional super-slim enclosure with its own power supply and a headphone output.

  Like the ZOIA it offers 80+ modules and growing, including 20+ ready-made effects (plate/hall/room/ghost reverbs, delays, chorus, flanger, phaser, distortion, compression, gate, cabinet simulator, vibrato, tremolo and more), alongside oscillators, filters, samplers, loopers, sequencers, LFOs, envelopes, quantizers and analysis modules. Up to 64 patches can be saved and recalled, an OLED screen handles editing, and an included SD card stores patches and firmware.

  Where it goes beyond the stompbox ZOIA is control-voltage integration: stereo 3.5mm audio in and out with dedicated patching buttons, a headphone output, four assignable CV inputs (editable ranges -5 to 5V, 0 to 5V or 0 to 10V), four CV outputs, and 1/8" MIDI in and out. Audio runs at 24-bit, 48kHz with 32-bit internal processing.
specs: |-
  - 34hp Eurorack-format module, skiff-friendly, 28mm depth (module incl. power cable)
  - Runs in a Eurorack case or standalone on desktop via optional slim enclosure
  - 80+ modules including 20+ ready-made effects (reverbs, delays, modulation, distortion, dynamics, cab sim, and more)
  - Up to 64 patches, included SD card for patches and firmware, OLED editing screen
  - Stereo 3.5mm audio in/out with dedicated patching buttons
  - 3.5mm headphone output with volume control
  - 4 CV inputs (editable ranges: -5 to 5V, 0 to 5V, 0 to 10V) and 4 CV outputs
  - 1/8" MIDI in and out
  - 24-bit, 48kHz conversion with 32-bit internal processing
  - Frequency response 10Hz-23.4kHz (-3dB), THD 0.22%, dynamic range 105.5 dBA
  - Input impedance >=1 MOhm, output impedance 100 Ohm
  - Power: desktop enclosure 9V 300mA; Eurorack case +12V 300mA
