description: Sound Explorer Since the dawn of time, humans have been hitting one
  thing with another, experimenting with materials and methods of striking them
  in order to find new percussive tones. Plonk allows you to explore this world
  of natural sounding timbres but it can also be used it to create brand new
  ones. Use quick strikes and long decays or hold the gate open and let the
  ever-evolving soundscapes through while you modulate and morph between presets
  with CV.
details: |-
  Plonk focuses on realistic percussion sounds, but it's equally capable of creating hyperreal unearthly tones with the ability to seamlessly morph between the two. Punchy kick drums, snappy snares, shimmering chimes, and deep biting bass tones are some of Plonk's specialties. Designed in collaboration with Canadian physical modelling experts Applied Acoustics Systems, Plonk is bound to be a crowd pleaser.

  Plonk uses a technique known as physical modelling to synthesize, with great realism, the way in which sound is produced by acoustic instruments. Plonk breaks sound creation into two distinct elements: the exciter and the resonator. The exciter is a mathematical model of the device used to strike a particular surface (a mallet model or a noise source); the resonator is a virtualization of the object being struck (beam, marimba, drumhead, membrane, plate, or string), which vibrates, resonates and creates the body of a sound.

  Any sound you design can respond dynamically to velocity, as well as four different modulation inputs, so the sound of Plonk can change completely from note-to-note (or strike-to-strike). Plonk is a duophonic (2-voice) module, which lets the sound of one note decay naturally when a second note (possibly employing an entirely different set of modelling values) is struck, so a new note does not choke the sound of the previously struck note.

  Plonk stores up to 128 patches in its internal memory and ships with many presets programmed by professional sound designers and composers, including Richard Devine and Applied Acoustics Systems. Banks of patches may be transferred via MIDI System Exclusive over Plonk's built-in mini-USB port to facilitate offline storage.
specs: |-
  - Width: 12HP
  - Depth: 38mm
  - Power: 170mA @ +12V, 6mA @ -12V
  - Two Voice Polyphonic at full resolution (16-bit, 44.1kHz)
  - 128 user preset slots with import/export management via USB
  - All synthesis parameters plus Saturation and Bitcrusher effects can be assigned to the X, Y and MOD controls
