details: |-
  The -22 series stands out as a timeless favourite in the Lowden lineup. Pairing a AAA grade mahogany back and sides with a Red Cedar top, the -22 delivers a rich, adaptable tone ideal for both strumming and fingerstyle. Renowned for its clarity and warmth, the -22 series is a top choice for studio recording, making it a trusted companion for songwriters and session musicians. The Original Series is built with AAA-grade tonewoods selected for tonal depth, balance and responsiveness, and carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - Mahogany back and sides
  - Red Cedar top
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Available in O, F, S and WL body shapes
  - Hardshell case included
