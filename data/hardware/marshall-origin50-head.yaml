description: An expressive 50W all-valve guitar amplifier head designed for home
  and stage use. The Origin50 features Powerstem power reduction technology
  (switchable between 50W, 10W and 5W), Marshall's multi-input Tilt control for
  blending normal and high-treble channel voicings, a footswitchable gain boost
  and a series FX loop.
details: |-
  This 50W head enables you to express your personality. The Origin50 Head delivers classic, rich and harmonic tones with a contemporary, sleek style. This all-valve amp has power reducing features making it ideal for different environments from performing on stage to recording in the studio.

  Powerstem, power reduction technology, allows you to have high or low power modes without compromising on sound quality. It works by reducing the voltage rails around the power amplifier rather than using traditional pentode or triode reduction methods, so power comes down without changing the sonic character.

  Using the tilt control, you can change the blend of your sound from normal to high treble. This is based on the multi-input technology of classic amps such as the 1959SLP and JTM45, but in a single controlled knob.

  With a 2-way footswitch you can turn the gain boost and the FX loop on and off. The gain boost integrates an extra layer of gain, introducing a unique crunch to the tone.

  Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: Origin50H
  - Range: Origin
  - Channels: 1
  - Technology: valve
  - Output wattage: high power 50W, mid power approx 10W, low power approx 5W
  - Outputs: 3 x 1/4" jack sockets (16 ohm load / 8 ohm load), DI (1/4" jack)
  - Inputs: 1 x 1/4" jack instrument input, footswitch
  - Controls: GAIN (PULL BOOST), TILT, BASS, MIDDLE, TREBLE, MASTER, PRESENCE, POWERSTEM POWER SCALING
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 11.8 kg / 26 lb
  - Width: 577 mm / 22.7"
  - Height: 228 mm / 9"
  - Depth: 225 mm / 8.9"
  - In the box: PEDL-90016 footswitch, detachable power cable
  - Colour: Black
  - Country of origin: designed and engineered in UK, made in Vietnam
