description: An expressive 50W all-valve guitar amplifier head designed for home
  and stage use. The Origin50 features Powerstem power reduction technology
  (switchable between 50W, 10W and 5W), Marshall's multi-input Tilt control for
  blending normal and high-treble channel voicings, a footswitchable gain boost
  and a series FX loop.
details: |-
  - 50W all-valve guitar amplifier head
  - Powerstem power reduction (50W / 10W / 5W) without sacrificing tone
  - Tilt control to blend normal and high-treble inputs in a single knob
  - Footswitchable gain boost
  - Series FX loop with FX Mix control
  - Designed for home and stage use
specs: |-
  - Model: Origin50 Head
  - Range: Origin
  - Output Wattage: 50W
  - Power Reduction: 50W / 10W / 5W via Powerstem
  - Channels: 1 (with footswitchable gain boost)
  - Technology: Valve
  - Controls: Gain, Bass, Middle, Treble, Tilt, FX Mix, Volume, Presence
  - Effects Loop: Yes, series with FX Mix control
  - Footswitch: 2-way footswitch for Gain Boost and FX Loop (PEDL-90010, sold separately)
