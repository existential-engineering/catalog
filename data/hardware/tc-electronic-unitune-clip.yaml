details: |-
  The Essential Clip-on Tuner

  The new UNITUNE CLIP offers uncompromised tuning quality and versatile tuning options. With high-quality construction, fast and responsive performance and the utmost accuracy, UNITUNE CLIP is the essential Clip-On tuner for any guitarist, bassist or ukulele player!With its elegantly simple and sturdy design, scorchingly bright display and quick responsive performance, UNITUNE CLIP is the obvious companion for serious musicians and bedroom heroes alike.It's elegant, intuitive to use, and sure to hold up for years and years of tune-ups.    •     Reliable and elegant Clip-On Tuner    •     Extremely accurate Strobe tuner with ± 0.02 cent accuracy    •     Ultra-fast Chromatic tuner with ± 0.05 cent accuracy

  The Power Couple of Tuning Modes

  UNITUNE CLIP features a light-speed chromatic tuning mode, that tunes your instrument in an instant with a scorchingly bright needle display to an accuracy of ± 0.05 cent. UNITUNE CLIP gives you an instant readout for those quick on-stage tune-ups where you don't want to hold up the gig for a bad pitch.If precision is of the utmost importance, go for the strobe tuning mode and literally get within two cents of your note. With an incredible ± 0.02 cent of tuning accuracy, UNITUNE CLIP is at home on the back of your headstock rocking out as well as for fine-tuning.

  Built To Last
