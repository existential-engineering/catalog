description: The MIC BOOSTER CM-2 is a two-channel mic booster for podcast,
  recording studio and stage setups, adding +25 dB of gain for a crisp, clean
  microphone signal. It runs on phantom power and needs no external power
  source.
details: |-
  Where more headroom is needed for a microphone in a podcast, recording studio or stage setup, the MIC BOOSTER CM-2 provides a crisp and clean microphone signal in a robust and simple package.

  Both channels of the CM-2 work with almost any dynamic or passive ribbon microphone. The high-quality preamp adds +25 dB of gain ahead of the mic preamp, which increases headroom and allows the mic level to be dialled in at a much lower gain setting on the mixer for a cleaner sound.

  The simplicity and size of the CM-2 allow it to be set up as close as possible to the microphone, in the studio or on stage, which minimises the risk of noise being picked up by long cable runs. It also runs on phantom power and needs no external power source.

  The MIC BOOSTER CM-2 is designed and engineered in the United Kingdom and built to withstand the rigours of the road.
specs: |-
  - 2 channels
  - +25 dB of gain
  - Works with almost any dynamic or passive ribbon microphone
  - Runs on phantom power, no external power source required
  - Designed and engineered in the United Kingdom
