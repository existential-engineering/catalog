description: An envelope vibrato pedal that masters the pitch vibrato with a
  touch-responsive, tipsy wobble, blending alcohol (intensity) and volume to
  taste. Production discontinued.
details: |-
  The Drunken Monkey is an envelope vibrato, a pitch-vibrato effect whose depth and behavior respond to your playing dynamics. Mr. Black frames it in kung-fu-movie language, casting the pedal as a pitch-vibrato master with a soft spot that gives its modulation a woozy, off-balance character.

  At its heart are two interacting controls, labeled Alc (alcohol) and Vol (volume), which let the player dial in anything from a subtle, seasick shimmer to a heavily inebriated warble. As the pedal puts it, you take what you want from the Alc/Vol blend and leave the rest, like a salad bar.

  The effect works on both guitar and bass, where the touch-responsive vibrato adds an organic, hand-vibrato-like movement.

  This pedal is no longer produced. The listing carries a "PRODUCTION DISCONTINUED" banner (sold out 02.09.2018), so it is included for catalog completeness rather than as a current product.
specs: |-
  - Envelope (touch-responsive) pitch vibrato
  - Alc/Vol blend controls
  - Works with electric guitar and bass
  - PRODUCTION DISCONTINUED (sold out 02.09.2018)
