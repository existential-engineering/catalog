description: Socket upgrade kit that adds a KADI port to the Roland CR-78, so
  ten of its individual sounds can be played from MIDI through a Kenton
  converter fitted with a KADI port.
details: |-
  This socket upgrade adds a KADI port to the Roland CR-78, enabling the drum machine's individual sounds to be played from the KADI port output of a Kenton device fitted with one. The compatible devices are the Pro-KADI, the Pro-4, and the Pro-2000 when it carries the optional KADI port.

  Ten sounds can be played individually, with or without accent, which is determined by a pre-set velocity level.

  While the KADI port is connected to a KADI device the sounds can only be played from MIDI. Unplugging the KADI cable, or switching the KADI device off, returns the CR-78 to normal operation. The separate retrofit kit for the CR-78 offers more control for anyone who needs it.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the 15 pin high density D socket. A KADI cable is not included, since one is supplied with the Pro-KADI and with the optional KADI add-on port for the Pro-2000, though not with the Pro-4.

  Installation is a job for a competent synthesiser service engineer. The product photograph on the page shows a typical socket upgrade rather than this specific kit.
specs: |-
  - Adds one KADI port on a 15 pin high density D socket
  - Ten CR-78 sounds playable individually
  - Accent level determined by a pre-set velocity threshold
  - Compatible with the Pro-KADI, the Pro-4 and a Pro-2000 fitted with the optional KADI port
  - KADI cable not included
  - CR-78 reverts to normal operation when the KADI cable is unplugged
  - Powered from inside the host CR-78, so the kit has no power connector of its own
