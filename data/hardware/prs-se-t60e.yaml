details: |-
  The PRS SE T60E pairs ziricote back and sides with a solid spruce top. The Tonare Grand body shape delivers a familiar feel and a thunderous tone with full bottom end and rolled-off highs, well suited for picking and fingerstyle playing. When matched with PRS hybrid “X”/Classical bracing, which allows the top to freely vibrate and project, the SE T60E’s voice projects with breathtaking volume and delicate nuance.

  Plugged in, the PRS-Voiced Fishman Presys VT pickup system delivers dynamic, organic tone and allows players to easily take this guitar from rehearsal to the stage. This electronics system features an undersaddle pickup and soundhole mounted preamp with easy-to-access volume and tone controls.

  The SE T60E is beautifully appointed with abalone and figured maple accents. Additional high-quality features include a solid spruce top, ebony fretboard and bridge, bone nut and saddle, as well as PRS trademark bird inlays and headstock design. Ships with a high-quality hardshell case.
