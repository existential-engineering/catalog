details: |-
  The original HALL OF FAME REVERB delivered some of the most-iconic reverb sounds of all time, but HALL OF FAME 2 REVERB extends that legacy of innovation dramatically. Essentially, HALL OF FAME 2 REVERB’s incredible MASH technology adds an expression pedal to a world-class reverb stompbox that not only responds to your touch and saves precious pedalboard space – but blends the celestial world of reverb with the ultimate in personal expression. Add a scintillating new Shimmer effect, and you've got a reverb pedal unlike any other – the awe-inspiring HALL OF FAME 2 REVERB!

  MASH – Heart of Innovation

  The HALL OF FAME 2 REVERB features groundbreaking new technology that brings a wide range of creative expression to the party, controlled solely by how much pressure you apply to the depressed footswitch. Years in the making, and only available in select TC ELECTRONIC products, this clever innovation elevates the common footswitch well above rather mundane duties, such as “On” and “Off”. More importantly – MASH elevates your performance to the next level.

  Shimmer Reverb

  With the HALL OF FAME 2 REVERB, your most transcendent shoe-gazing dreams are finally realized. An all-new Shimmer reverb algorithm provides an unearthly octave pitch shift, ensuring that your tone delivers spine-tingling euphoria in every single note. All of the onboard, next-generation algorithms give you phenomenally-realistic reverb sounds – making the revolutionary HALL OF FAME 2 REVERB the pedal with no limits!
