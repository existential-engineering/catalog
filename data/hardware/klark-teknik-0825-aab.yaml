description: The DN9848E is a professional 4-input, 8-output digital loudspeaker
  management system engineered for system designers, install integrators and
  touring engineers. It combines DSP processing, comprehensive matrix mixing and
  look-ahead limiting that protects transducers without audible artefacts.
details: |-
  Unlike controllers that lock the engineer into fixed routing presets, the DN9848E offers a preset-free routing structure with a full input-to-output matrix mixer. Any input can feed any output at any level, so main PA, delay stacks, fill systems, subwoofer arrays and monitor sends can all be configured from a single chassis.

  Each input carries 12 parametric EQs, 1000 milliseconds of delay and a full-range compressor to shape and protect source material before it reaches the matrix. Each output carries 2 all-pass filters, 6 parametric EQs, 300 milliseconds of delay, a full-range compressor and a look-ahead limiter. Crossover filters up to 48 dB per octave with Butterworth, Bessel and Linkwitz-Riley responses cover the standard topologies used in modern PA design.

  The look-ahead limiters anticipate signal peaks before they arrive at the loudspeaker, preventing overload while leaving the full available signal headroom usable.

  The unit accepts both analogue and AES3 digital inputs, with sample rate conversion on the AES3 path for integration with any source clock domain. Multi-mode high-resolution LED channel meters display signal level, internal clip status and gain reduction simultaneously.

  The DN9848E is housed in a rugged 1U rackmount chassis with an auto-ranging universal switch-mode power supply for global deployment, and is designed and engineered at the Kidderminster facility.
specs: |-
  - 4 inputs, 8 outputs
  - Preset-free routing with full input-to-output matrix mixer
  - Per input: 12 parametric EQs, 1000 ms delay, full-range compressor
  - Per output: 2 all-pass filters, 6 parametric EQs, 300 ms delay, full-range compressor, look-ahead limiter
  - Crossover filters up to 48 dB/octave, Butterworth, Bessel and Linkwitz-Riley responses
  - Analogue and AES3 digital inputs with sample rate conversion on the AES3 path
  - Multi-mode high-resolution LED channel metering for level, internal clip and gain reduction
  - 1U rackmount chassis
  - Auto-ranging universal switch-mode power supply
