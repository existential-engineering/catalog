description: "The Genelec GLM Calibration Kit enables Smart Active Monitors and
  Subwoofers (SAM™) to work with Genelec Loudspeaker Manager (GLM™), our
  award-winning monitoring calibration and management software offering precise
  automatic room adaption, advanced system control and highly detailed GRADE
  Room Acoustic Reporting."
details: |-
  The Genelec GLM Calibration Kit is the bridge between Genelec's Smart Active Monitoring (SAM™) loudspeakers and the Genelec Loudspeaker Manager (GLM™) software, the company's award-winning monitoring calibration and management environment. The kit makes it possible to bring SAM monitors and subwoofers under unified computer control, run automatic room adaption with the GLM AutoCal algorithms, and produce detailed GRADE Room Acoustic Reports that document the calibrated state of a monitoring system.

  The kit ships with four items: the GLM Network Adaptor, a reference measurement microphone, a microphone holder, a 1.8 metre USB cable, and a Quick Connection Guide. The Network Adaptor is the hub of a GLM session — it provides the USB connection to the host Mac or PC running the GLM software and the network interface that talks to the SAM monitors. The bundled omnidirectional reference microphone is the same capsule used in Genelec's higher-tier 9320A controller, and is what GLM uses to capture in-room measurements during calibration.

  Setting the Calibration Kit up to work with a SAM system is straightforward. SAM models are daisy-chained together using the 5 metre Ethernet cables included in each monitor's box. The user downloads the latest GLM software to their Mac or PC, connects the Network Adaptor to the computer over USB, and then connects the Adaptor to the SAM system using one of those Ethernet cables. From that point on, every monitor and subwoofer on the network is addressable from GLM, with full per-channel level, delay, room compensation EQ, and group management.

  Once connected, the Calibration Kit unlocks the full feature set of GLM: fully automated multi-monitor AutoCal calibration that compensates for room acoustics, the GRADE reporting workflow for documenting and sharing the acoustic state of a room, system layouts for stereo through to immersive monitoring configurations, and ongoing control of levels and presets during a session. Because all of the heavy lifting happens in the software, the hardware in the kit is intentionally minimal — a single adaptor and a single microphone that can travel with the engineer between rooms.

  For professionals who want a dedicated tactile interface, immersive monitoring management, reference-quality stereo and headphone outputs, and SPL/sound-exposure measurement, Genelec positions the 9320A SAM™ Reference Controller as an advanced alternative that includes the same reference microphone and holder while extending the functionality of the GLM Calibration Kit.
specs: |-
  - Function: GLM software interface for SAM monitors and subwoofers
  - Computer connection: USB (to Mac or PC running GLM software)
  - Monitor system connection: Ethernet to SAM network
  - Included: GLM Network Adaptor
  - Included: Reference measurement microphone
  - Included: Microphone holder
  - Included: 1.8 m USB cable
  - Included: Quick Connection Guide
  - Supported software: Genelec Loudspeaker Manager (GLM)
  - Compatible hosts: macOS and Windows
  - Compatible monitors: Genelec Smart Active Monitoring (SAM) series
  - Features enabled: GLM AutoCal automatic room calibration
  - Features enabled: GRADE Room Acoustic Reporting
  - Features enabled: System-wide level, delay, EQ and group control
