details: |-
  The 20 for 20 series was a line of Keeley Custom Shop finishes: twenty colourways, each carrying the 20 for 20 insignia and each limited to twenty units. This is the Super Phat Mod Full Range Overdrive in one of those colourways.

  The circuit is the standard Super Phat Mod, Keeley's Phat Mod modification built as a pedal using JFETs chosen to emulate old tube amps. It uses tube-like amp stages, tube amp tone stacks and a variety of tone shaping circuits intended to suit any guitar's pickups; the FET finally used is a Toshiba part found after years of searching for the right harmonic content and distortion grain.

  The result is full range and very responsive, and the phrase transparent overdrive came out of this design. It suits players who do not want the more refined sound of a common screamer: with the gain set high, the guitar's volume control and pick attack do the work. Modern refinements include true bypass.

  The lineage runs back to the Keeley BD-2, the first mod to carry a switch for two modes of bass response, the boosted setting being Phat mode. That switch survives as the micro toggle on the Super Phat Mod, which otherwise duplicates the Keeley Phat Mod part for part apart from the JFETs.
