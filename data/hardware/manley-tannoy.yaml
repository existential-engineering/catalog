description: The Tannoy ML10 is a legendary loudspeaker system, born from a
  collaboration to create the ultimate studio monitor. Combining a
  highly-sought-after Tannoy 10" Dual Concentric driver with an expertly
  designed, heavily braced Manley cabinet, the ML10 delivers an accurate,
  non-fatiguing, and musical sound that has made it a timeless classic among
  recording and mastering engineers.
details: |-
  Tannoy 10" Dual Concentric driver providing point-source imaging and time alignment

  Heavily braced, non-resonant Manley-designed cabinet

  Bi-wireable passive crossover hand-built by The Mastering Lab

  Front-mounted treble controls for fine-tuning high-frequency response

  Hand-built passive design

  Engineered for recording and mastering applications
