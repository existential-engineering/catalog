description: The LBB100 is a single-channel active direct injection box
  combining high-impedance active buffering with transformer isolation. The
  active stage handles instrument-level sources without loading them, while the
  output transformer provides galvanic isolation and the controlled saturation
  character favoured for electric bass and keyboard feeds.
details: |-
  The high-impedance active input accepts electric guitar and bass directly without tone loss. Phantom power from the console (+48 V) energises the active circuit.

  The output is a low-impedance (150 ohm) balanced XLR designed to drive a console microphone input. -15 dB and -30 dB pads accommodate line-level sources that would otherwise overload the input stage, and an earth-lift switch breaks ground continuity between input and output when required to defeat hum loops.

  Intended for stage and studio use on bass, keyboards, acoustic-electric instruments and line-level sources requiring isolation to FOH or recording. The combination of active buffering and transformer output suits a touring rack and a tracking date equally.
specs: |-
  - High-impedance active input
  - Transformer-isolated 150 ohm balanced XLR output
  - +48 V phantom powered (no battery, no external PSU)
  - -15 dB and -30 dB pad switches
  - Earth-lift switch for ground-loop defeat
  - Compact metal enclosure
