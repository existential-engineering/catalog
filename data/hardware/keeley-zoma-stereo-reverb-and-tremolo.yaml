description: True-stereo reverb and tremolo pedal with three paired modes,
  instant effect order switching and a choice of true bypass or buffered trails.
details: |-
  The ZOMA pairs Keeley's reverbs with its tremolos in a single true-stereo pedal, following the two effects that were first built into guitar amplifiers. It is presented as the maker's highest fidelity reverb and tremolo pedal.

  Three reverb and tremolo pairings are provided: spring reverb with sine wave tremolo, which follows the classic black panel amplifier arrangement, plate reverb with harmonic tremolo, and plate reverb with pitch vibrato. The reverb is digital while the dry signal path stays fully analog.

  Three large knobs cover reverb level, tremolo rate and tremolo depth, with alternate controls for reverb decay, reverb tone and tremolo boost volume reached by holding the reverb footswitch while adjusting a knob. The order of the two effects can be switched instantly, placing tremolo after reverb for a vintage-correct voicing or harmonic tremolo on top of reverb for a swampier tone, and the bypass can be set to true bypass or to a silent buffered bypass with trails.

  The circuitry is housed in an angled aluminium enclosure. The page links the instruction manual, notes that the pedal won a Premier Guitar Premier Gear Award, shows a Custom Shop Black finish, and states that every unit is hand assembled in Oklahoma, USA.
