details: |-
  ESP E-II instruments, formerly known as “ESP Standard Series,” are made in Japan at the ESP factory by highly skilled builders. Designed for professional players who require versatile, powerful tones, extraordinary playability, and rock-solid reliability for touring and recording needs, the ESP E-II Horizon HT-II is built with neck-thru-body construction at 25.5” scale for superior sustain and smooth, fast access to the highest frets. This guitar features an alder body, a thin U-shaped three-piece maple neck, and an ebony fingerboard with 24 extra-jumbo stainless steel frets. Components on the E-II Horizon HT-II include black hardware, a Hipshot fixed bridge with string-thru-body, a bone nut, ESP strap locks, Gotoh locking tuners, and a set of innovative, great-sounding Fishman Fluence Modern 3-Voice Humbucker active pickups — ceramic in the bridge, and alnico in the neck. Their multiple voicings are selectable via push-pull controls. Includes ESP form-fit case.
specs: |-
  - Construction: Neck-Thru
  - Scale: 25.5"
  - Body: Alder
  - Neck: 3Pc Maple
  - Fingerboard: Ebony
  - Fingerboard Radius: 305mm
  - Finish: Granite Sparkle
  - Nut Width: 42mm
  - Nut Type: Bone
  - Neck Contour: Thin U
  - Frets/Type: 24 XJ Stainless
  - Hardware Color: Black
  - Strap Button: ESP Strap Lock
  - Tuners: Gotoh Locking
  - Bridge: Hipshot Fixed w/ String Thru
  - Bridge PU: Fishman Fluence Modern Ceramic 3-Voice Black Nickel Direct-Mount *(Pull Volume for Voice 3 / Pull Tone for Voice 2)
  - Neck PU: Fishman Fluence Modern Alnico 3-Voice Black Nickel Direct-Mount *(Pull Volume for Voice 3 / Pull Tone for Voice 2)
  - Electronics Layout: Master Volume(Push/Pull)/Tone(Push/Pull)/Toggle Switch
  - Strings: Elixir Nanoweb Light (.010/.013/.017/.026/.036/.046)
  - Case: MH GUITAR FORM FIT CASE
  - Case Included: Y
