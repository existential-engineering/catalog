id: Se6LElXuHSBuN1Ub8Nfto
name: DN1414
manufacturer: klark-teknik
primaryCategory: di-box
categories:
  - rack-mount
  - routing
url: https://www.klarkteknik.com/en/products/0809-AAJ
description: The DN1414 is a 14-channel active DI module in a 3U rackmount
  chassis with an integral universal switch-mode power supply. It addresses
  stage-rack distribution for keyboard rigs, press bridges and multi-source
  instrument setups where one rack must convert and split many sources into
  balanced, transformer-isolated console feeds.
details: |-
  Ten mono channels each provide parallel-connected 1/4 inch TRS and XLR inputs, a link output for daisy-chaining and a transformer-balanced XLR output. Two further dual channels handle stereo sources through 1/4 inch inputs to transformer-balanced XLR outputs.

  Input impedance is a nominal 20 kilohm balanced and maximum level is +21 dBu unpadded, with -15 dB and -30 dB attenuation steps for line-level sources.

  Each channel uses a buffered preamplifier with low noise, low distortion and generous headroom. Outputs are transformer-isolated on 3-pin male XLR, which eliminates ground loops between stage and front of house, and earth-lift switches are provided per full-function channel.

  Typical applications are touring keyboard rigs, large press bridges, broadcast pool feeds and theatre installations where 14 sources must be presented to front of house as a clean, isolated XLR multicore.
specs: |-
  - 14 channels total: 10 mono channels plus 2 dual channels
  - Transformer-balanced XLR outputs throughout, 3-pin male
  - Nominal 20 kilohm balanced input impedance
  - Maximum input level +21 dBu unpadded
  - -15 dB and -30 dB pad steps and earth-lift switches per channel
  - Parallel-connected 1/4 inch TRS and XLR inputs with a link output on each mono channel
  - Buffered preamplifier per channel, low noise and low distortion
  - 3U rackmount chassis
  - Integral universal switch-mode power supply, 100 to 240 V
