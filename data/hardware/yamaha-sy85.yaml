description: >-
  The Yamaha SY85 is a 16-part multitimbral synthesizer workstation released in 1992,
  featuring a 61-note velocity and aftertouch-sensitive keyboard. It uses Yamaha's AWM2
  (Advanced Wave Memory) synthesis engine to produce both realistic acoustic and
  expressive synthetic sounds with comprehensive editing and sequencing capabilities.
details: |-
  The SY85 represents Yamaha's transition from FM synthesis to AWM2 sample-based technology during the early 1990s. Designed as the centerpiece of a MIDI studio, it combines a large waveform library with powerful sound-shaping tools including digital low-pass, high-pass, band-pass, and band-elimination filters.

  The interface features a 40-character by 2-line LCD display alongside a 5x5 mode selection matrix for quick navigation between functions. Eight slide controls provide real-time parameter manipulation during performance, making the SY85 well-suited for live use.

  The effects section is particularly comprehensive, offering two discrete effects units each with 90 effect types including chorus, flange, reverb, delay, exciter, parametric EQ, ring modulation, leslie simulation, and distortion. Effects can be routed in series or parallel through four separate busses for flexible signal processing.

  The built-in sequencer provides 9 tracks (8 normal plus 1 rhythm track) with a 20,000-note capacity, 100 patterns, and 10 songs. Storage is handled via a 3.5-inch floppy disk drive with additional external memory card slots, and the wave RAM is expandable from 0.5 MB to 3.5 MB for loading custom samples.
specs: |-
  - Polyphony: 32 voices
  - Synthesis: AWM2 (Advanced Wave Memory 2nd generation)
  - Keyboard: 61 keys with velocity and aftertouch
  - Multitimbral: 16 parts
  - Filters: Digital LPF, HPF, BPF, BEF
  - Effects: 2 discrete FX units, 90 types each
  - Sequencer: 9 tracks, 20,000 notes, 100 patterns, 10 songs
  - Wave ROM: 6 MB
  - Wave RAM: 0.5 MB (expandable to 3.5 MB)
  - Storage: 3.5-inch floppy disk drive
  - Outputs: Dual stereo
  - Controls: Pitch wheel, modulation wheel, 8 slide controls
  - Year released: 1992
