description: Active 2-way bass reflex personal monitor speakers featuring a 30W+30W high-performance digital amplifier in a rear bass reflex slim and compact design. Updated version of the PM0.4d with improved connectivity and operability. Two types of input cables (phone-RCA pin cable and stereo RCA pin cable) are included as standard accessories to support both RCA and phone terminals. Suitable for personal recording, DTM, and home theater playback. Equipped with an auto standby mode that activates after 15 minutes of inactivity.
details: |-
  The PM0.4d, a leading model of wired-connected active speaker with emphasis on sound quality, has undergone a model change. The PM0.4c is now available with improved connectivity and operability.

  The PM0.4c features a 30 W + 30 W high-performance digital amplifier in a rear bass reflex slim and compact enclosure. The amplifier that drives the speakers uses the same digital system as the PM0.4d but is mounted on one side, as proven in the PM0.3 and other models, which improves cable routing and centralizes the power switch and volume control.

  The woofer, which produces powerful sound, uses a glass fiber diaphragm and up-rolled rubber edges. The tweeter uses a silk diaphragm for clear sound quality. The wooden enclosure gives natural sound and the rear bass-reflex system delivers deep bass.

  Two types of input cable (phone to RCA pin cable, stereo RCA pin cable) are included as standard accessories, so the RCA jacks can be used for a wide range of applications, from personal recording to DTM and home theater playback. The power indicator uses a blue LED for visibility.

  An auto standby mode is fitted: when the input signal remains below a certain level for about 15 minutes the unit switches to standby, the power indicator changes from blue to red, and power consumption drops to about 0.5 W. A rear-panel switch turns the auto standby function on and off, so low-level playback does not trigger standby at an unintended moment. Two colours were offered, PM0.4c(B) black and PM0.4c(W) white.
specs: |-
  - Enclosure method: 2-way bass reflex system
  - Low frequency driver: 10 cm woofer
  - High frequency driver: 1.9 cm soft dome tweeter
  - Playback frequency band: 60 Hz to 20 kHz
  - Crossover frequency: 1.6 kHz
  - Amplifier section (R side only): input terminal RCA pin jacks, 320 mV input sensitivity
  - Rated output: 30 W + 30 W
  - Distortion (THD): less than 0.05% (2 W output)
  - Power: 100 to 240 V, 50/60 Hz
  - Power consumption: 15 W (normal operating state), 0.5 W or less (standby)
  - External dimensions: 130 (W) x 220 (H) x 169 (D) mm (excluding protrusions)
  - Mass: 2.4 kg (R side), 2.1 kg (L side)
  - Accessories: power cord (2.0 m) x 1, speaker cable (red/black, 1.5 m) x 1, phone to RCA pin cable (1.5 m) x 1, stereo RCA pin cable (1.5 m) x 1
  - Auto standby mode with rear-panel on/off switch
