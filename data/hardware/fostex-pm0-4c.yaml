description: Active 2-way bass reflex personal monitor speakers featuring a
  30W+30W high-performance digital amplifier in a rear bass reflex slim and
  compact design. Updated version of the PM0.4d with improved connectivity and
  operability. Two types of input cables (phone-RCA pin cable and stereo RCA pin
  cable) are included as standard accessories to support both RCA and phone
  terminals. Suitable for personal recording, DTM, and home theater playback.
  Equipped with an auto standby mode that activates after 15 minutes of
  inactivity.
details: |-
  Configuration: 2-way bass reflex (active R side + passive L side, connected via speaker cable)

  Features:
  - 30W+30W digital amplifier
  - 10cm glass fiber woofer with rubber edges
  - 1.9cm soft dome tweeter (silk diaphragm)
  - Rear bass reflex slim and compact design
  - Auto standby mode (15-minute inactivity threshold, 0.5W standby)
  - Blue/red LED power indicator
  - Wooden enclosure
  - Includes phone-RCA and stereo RCA input cables

  Colors:
  - Black
  - White

  Status: Discontinued (Black: while supplies last; White: discontinued)
