description: A DIY Eurorack polarizing mixer PCB and front panel kit that
  combines signals while accounting for phase, adding or subtracting voltage per
  channel. LED indicators show output polarity for monitoring signal behavior.
details: |-
  Key Features

  Mixing & Signal Control

  A polarizing mixer combines signals while taking into account the phase relationship between inverted and non-inverted versions of the input. Each channel can add or subtract voltage, making this module ideal for complex modulation shaping, offsetting CVs, and creative signal blending beyond standard mixers. The integrated LED indicators provide immediate visual feedback on output polarity, helping users monitor signal behavior during patching. DIY Build & Front Panel

  This DIY Eurorack polarizing mixer PCB and front panel kit is designed to be accessible for beginners. The front panel is made from durable PCB material and screen printed by hand, ensuring a cohesive look alongside other Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
specs: |-
  - Eurorack PCB and front panel kit
  - Four-input polarizing mixer
  - Individual polarity controls per input
  - Supports mixing of audio and CV signals
  - LED indicators to monitor output polarity
  - Compact 6HP Eurorack format
  - Beginner-friendly build
  - Format: Eurorack
  - Width: 6HP
  - Depth: 25mm
