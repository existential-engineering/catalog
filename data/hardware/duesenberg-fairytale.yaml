description: The Fairytale Lapsteel is one of the most desired instruments for
  lapsteel artists around the world. Its innovation on countless aspects from
  the integrated capo nut down to the versatile Multibender bridge system leaves
  this lapsteel without competition.
details: |-
  The Fairytale Lapsteel is built from Korina with a maple top on the headstock and finished in PUR lacquer. The body measures 94 x 19 x 4.2 cm (37" x 7.48" x 1.65") and carries a black anodized aluminium fingerboard, a 648 mm / 25.5" scale length, a 65 mm / 2.56" width at the nut and 54 mm / 2.13" string spacing.

  Hardware centres on the Duesenberg Multibender bridge, a user-configurable string bending device for semitone and whole-tone bends up or down, operated with the heel of the hand while playing. The Multibender accepts up to five levers, each configurable independently, with additional levers available separately. A Duesenberg Roller Nut and Z-Tuners complete the string path, and the hardware is nickel finished, which Duesenberg favours over chrome for its warmer sheen and the way it ages naturally with use.

  An integrated Easy-Shift Capodaster runs on a rail inside the fretboard, so it cannot be lost or misplaced: loosening the thumbscrew on top of the capo allows it to be positioned anywhere on the fretboard before being tightened again, which simplifies key changes on a lap steel.

  The electronics pair a hum-cancelling Duesenberg SingleTwin Domino P90 in the neck position, voiced warm and fat, with a classically voiced Duesenberg GrandVintage Humbucker in the bridge for cutting lead tones. Controls are one volume, one tone and a three-way pickup selector, and the tone control uses Duesenberg's short-range speed pot, which operates over a reduced 70 degree angle so tone swells can be made with a fingertip.

  The instrument ships with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case, along with all the allen keys required for setup.
specs: |-
  - Wood: Korina (+ Maple top on headstock)
  - Width at nut: 65 mm / 2.56"
  - Dimensions: 94 x 19 x 4.2 cm / 37" x 7.48" x 1.65"
  - Stringspacing: 54 mm / 2.13"
  - Fingerboard: Black anodized aluminum
  - Scale length: 648 mm / 25.5"
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Nut: Duesenberg Roller Nut
  - Bridge: Duesenberg Multibender
  - Plus: Duesenberg Easy Shift Capo
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 016/056 (016-018-026-036-046-056)
  - Pickup (neck): Duesenberg SingleTwin Domino
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
