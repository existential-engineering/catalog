details: |-
  The Icarus V2 is a multi-function pedal combining buffer, booster, and rich
  overdrive capabilities in a single unit.

  It features Russian germanium components that contribute to its characteristic
  tonal sweetness.

  The circuit is based on Caroline Guitar Company's PARABOLA and METEORE
  preamps. Available in two model variants: Standard and Alpha Gain.
