url: https://bastl-instruments.com/eurorack/modules/clutch
description: Quad attenuator and volume pedal to CV interface. Functions as a
  four-channel passive attenuator while also enabling foot pedal control of your
  modular synthesizer via volume or expression pedal inputs. Channel A can act
  as a voltage source with a maximum 9V output. Stereo jack inputs accept volume
  or expression pedals to generate CV; mono jack cables work for standard
  attenuation.
details: |-
  5HP, 35mm depth. +12V <25mA. 10-pin power connector with PTC fuse and diode protection. Inputs accept stereo plugs for volume/expression pedal CV generation or mono plugs for standard attenuation. Channel A can act as a voltage source (max 9V).
