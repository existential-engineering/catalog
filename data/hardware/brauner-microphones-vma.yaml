description: A dual-character large-diaphragm tube condenser combining two
  voicings in one body, switchable between the transparent VM1 and the
  full-character VMX, with infinitely variable polar patterns.
details: |-
  The Brauner VMA is a dual-mode large-diaphragm tube condenser microphone that combines two
  distinct sonic characters in a single body. Users can switch between the very natural,
  transparent sound of the VM1 and the markedly full character sound of the VMX, effectively
  providing two different Brauner microphones in one unit.

  The VMA features infinitely variable directional characteristics, giving engineers complete
  control over the polar pattern from omnidirectional through cardioid to figure-eight and
  every position in between. This flexibility makes it suitable for a wide variety of
  recording applications and acoustic environments.

  The microphone incorporates over 10 years of development experience from the VM1 flagship
  model, along with feedback from renowned sound engineers. Its self-noise of less than
  11 dB(A) and maximum SPL handling of 142 dB make it equally suitable for delicate acoustic
  sources and louder instruments.
specs: |-
  - Equivalent Noise: < 11 dB A (IEC651)
  - Signal to Noise Ratio: > 83 dB (1 Pa/1 kHz, Cardioid)
  - Sensitivity: 28 mV / Pa (Cardioid)
  - Frequency Range: 20 Hz - 20 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Polar Pattern: All patterns, infinitely variable
  - Power Supply: 115V or 230V (external power supply unit)
  - Dual sonic character: switchable between VM1 (transparent) and VMX (full character) voicings
