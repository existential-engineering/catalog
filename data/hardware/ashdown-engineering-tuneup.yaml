description: The Dr Green TuneUp is a compact, precise, high-visibility tuner
  pedal for guitar and bass with true bypass switching and mute-enabled tuning,
  housed in a robust custom steel casing built for the road or studio.
details: |-
  The Dr Green TuneUp is a compact, precise and easy to use tuner pedal for guitar and bass, with true bypass switching and mute-enabled tuning in a robust custom steel housing with heavy-duty switching. A smooth eleven-segment LED meter allows accurate visual tuning from any angle, with a green LED indicating on/off status, a large note-name display, and a sharp/flat tuning guide for quick tuning even on the darkest stages. It offers a tuning range of A0 (27.5Hz) to C8 (4,186Hz) and adjustable calibration between 436 and 445Hz.
specs: |-
  - Type: chromatic tuner pedal for guitar and bass
  - Tuning range: A0 (27.5Hz) - C8 (4,186Hz)
  - Accuracy: +/- 1 cent
  - Calibration: 436-445Hz (1 Hz step)
  - Flat display: b, bb, bbb
  - Notes: A, A#, B, C, C#, D, D#, E, F, F#, G, G#
  - Indicator: 39-segment FND & 1 LED
  - Input: 1/4" input jack
  - Output: 1/4" bypass jack
  - Power: 9V (6F22 battery, DC adapter)
  - Switching: true bypass, mute-enabled tuning
  - Housing: custom steel
