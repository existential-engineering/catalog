description: The perfect amp to meet you at home or on stage. The head version
  pairs with Benson 1x12 and horizontal 2x12 speaker cabinets.
details: |-
  Point-to-point construction on terminal strips (no circuit, eyelet, or turret
  board). Custom Sours transformer set including a wax-dipped output transformer.
  Jupiter Yellow Capacitors. All-tube power scaling from a JJ 6L6GC configured
  as a voltage regulator.

  Reverb heads fit Benson 1x12 and horizontal 2x12 cabinets. Handmade in
  Portland, OR.
specs: |-
  - Tubes: 2x JJ EL34, 2x JJ 12AX7, JJ 12DW7 (reverb driver), JJ 6L6GC (voltage regulator)
  - Power: 35 watts, scalable to 0.5 watts
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Foot-switchable reverb
  - Dimensions: 21"W x 11"H x 8.5"D, 27 lbs
