prices:
  - amount: 699
    currency: USD
description: MiniFreak Vocoder is a special edition of the fearless polyphonic hybrid
  synth. The same dual digital engines, analog filters, modulation and
  sequencing power, now with a vocoder and gooseneck mic. Get creative with
  vocal or external input - from talkbox growls to spectral drones.
details: |-
  Engine 1 - a typically freaky array of classic, quirky, and cutting-edge oscillator modes. Engine 1's selection includes arturia modes like granular, sample, superwaves, karplus strong, wavetable and audio in, mutable instruments open-source plaits modes like speech and modal, and 3 modes designed with la modular heavyweights noise engineering. Engine 2 - expanding on engine 1's selection, engine 2 can be used to process engine 1 itself, with modes like comb filter, destroy, and ring mod.

  Plug in the mic or any external source and reshape it with minifreak's vocoder fx, or apply the effect to your own synth sounds and unleash a full spectrum of vocodized textures. Swap between clean, vintage, narrow, or gated flavours, then tweak the three fx controls for anything from daft-punk gloss to hyper-resonant textures in seconds.

  Minifreak's sequencer and arpeggiator allows you to lock variety into your patterns, introduce dramatic octave jumps, and drop-in repeats and mutations on the fly. A sequence that never fully repeats, thanks to minifreak's spice & dice randomization and one-touch mutations.

  Minifreak v is a comprehensive standalone instrument, perfect for taking your freak-infused production on-the-go, as well as offering seamless integration between hardware and software for a workflow that can suit your every need. Simply click link to minifreak, and you're all set!
specs: |-
  - 6-voice polyphonic hybrid synthesizer
  - 37-note velocity-sensitive slim-key keybed with aftertouch
  - 2 sound engines with 31 oscillator modes in total
  - Engine 2 can be used to process engine 1
  - 1 cycling envelope per voice
  - Polyphonic analog filters and VCAs
  - 6-voice polyphonic, 12-voice paraphonic, unison, or mono configuration
  - 3 digital FX slots in insert or send mode, with 13 FX including ext vocoder & self vocoder FX
  - User-customizable LFO curves
  - Mod matrix with 7 sources and 13 potential destinations
  - OLED display for real-time visual feedback
  - Intuitive 64-step sequencer (4 pages of 16 steps)
  - 4 lanes of automated modulation
  - Performance arpeggiator controls including ratchet, octave randomize
  - Sustain, audio in, and clock in/out connectivity
  - Balanced stereo outputs
  - 244 user preset slots
  - 16-band vocoder
  - Polyphonic state-variable resonant filters with low-pass, band-pass, and high-pass modes
  - Standard ADSR envelope with 4 modes: polyphonic, monophonic, paraphonic, and unison
  - Shape-adjustable second envelope with run or loop modes
  - 2 LFOs with free-running or sync'd operation and custom LFO shaper
  - MIDI in, out, or thru connectivity
  - USB connectivity for updates and preset management
  - Audio in mode for processing incoming signals
  - Ext in vocoder and self vocoder FX modes
  - Clean, vintage, narrow, or gated vocoder flavours
  - Spice & dice randomization and one-touch mutations
  - Minifreak v VST software instrument with modeled analog filters
