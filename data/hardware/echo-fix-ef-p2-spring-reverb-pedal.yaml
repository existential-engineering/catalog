description: A spring reverb pedal featuring a three-spring reverb tank,
  adjustable spring drive, bass and treble EQ controls, and reverb volume
  control. It includes footswitches for reverb bypass and direct signal mute,
  and can accept audio from synths and other devices as well as guitar.
details: |-
  USA CUSTOMERS - Echo Fix covers the Tariff and custom charges via our express courier. This checkout price is an all inclusive price for USA customers. The Echo Fix EF-P2 is a real Spring Reverb pedal that packs a huge sound into a small enclosure. The EF-P2 features a three-spring reverb tank, adjustable Spring Drive, Bass / Treble EQ controls, and Reverb Volume control. With a footswitch for reverb bypass and also a direct signal mute footswitch, the EF-P2 can also be used as an outboard effect in recording studios. The EF-P2 can accept audio signal from synths and other audio devices, not just guitar.
specs: |-
  - Real spring reverb pan
  - 100% Analog Signal Path
  - Spring drive control
  - Bass control
  - Treble control
  - Reverb Level Control
  - Soft momentary switching for noiseless Bypass and Direct Mute switching
  - Increased internal power supply voltage rails for increased dynamic range
  - Illuminated reverb tank viewing window
