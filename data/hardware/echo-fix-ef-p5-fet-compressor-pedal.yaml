details: |-
  USA CUSTOMERS - Echo Fix covers the Tariff and custom charges via our express courier. This checkout price is an all inclusive price for USA customers. Echo Fix EF-P5 FET Compressor

  Studio-Grade Analog Compression with Modern Flexibility

  The Echo Fix EF-P5 FET Compressor is a premium, 100% analog dynamics processor built for audio professionals who demand precision, character, and control. Designed with high-quality input and output transformers, the EF-P5 delivers rich, warm compression with unmistakable FET-style punch. Perfect for tracking, mixing, or live use, the EF-P5 features a fully analog signal path with intuitive controls. It offers a broader range of Attack and Release times than traditional FET compressors, a Mix control for parallel compression, and a High-Pass Filter to maintain low-end clarity. Whether you're tightening a vocal, smoothing a bassline, or adding punch to drums, the EF-P5 adapts effortlessly with switchable 4:1, 8:1, 12:1, and 20:1 ratio settings. Engineered for real-world flexibility, it includes a rear side-chain input for ducking applications, a rear switch to boost input gain, and a programmable power-on state. Metering options include Gain Reduction, 0dBu, +4dBu, or full meter bypass. Key Features:

  All buttons in mode
  Input & Output Transformers for sonic character
  100% Analog Signal Path for authentic compression
  Combo XLR Input & XLR Output connectivity
  Variable Attack and Release
  Rear switch for increased Attack/Release times
  Rear Side-chain Input for ducking effects
  Mix Control for parallel compression
  High Pass Filter for frequency-selective compression
  Programmable Footswitch Power-On State
  Selectable 4:1, 8:1, 12:1, 20:1 compression ratios
  Flexible metering: Gain Reduction, 0dBu, +4dBu, Meter Off

  From subtle dynamic shaping to aggressive, vintage-style squash, the EF-P5 offers uncompromising analog tone and flexibility in a compact, pedal-friendly form.
