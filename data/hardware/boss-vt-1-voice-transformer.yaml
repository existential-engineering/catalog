description: >-
  The VT-1 Voice Transformer is a compact vocal effects processor combining
  vocoder, harmonizer, and pitch-shifting capabilities for creative voice
  manipulation.
details: |-
  The VT-1 Voice Transformer alters human voice through multiple effects including pitch shifting (±1 octave), formant shifting, and built-in digital reverb. It features a Robot button that produces vocoder-like sounds by fixing pitch and adding fuzzing effects. The unit accepts microphone input with adjustable trim levels, allowing creative processing of vocals or other audio sources.

  Beyond creative uses for DJs and electronic music producers, it serves professional broadcast applications for adjusting voice pitch or gender while maintaining natural sound quality. The device is compact, affordable, and user-friendly with straightforward controls.
specs: |-
  - Pitch Shift: ±1 Octave
  - Formant Shift capability
  - Robot Feature for vocoder-like effects
  - Built-in digital reverb
  - 4 Large sliders for effect control
  - Microphone input with adjustable trim level
  - 4 preset, 4 user patches (up to 40 patches total)
  - Desktop/Tabletop form factor
releaseDate: "1996"
