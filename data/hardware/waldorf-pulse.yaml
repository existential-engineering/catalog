description: >-
  The Waldorf Pulse is a monophonic analog synthesizer equipped with three oscillators, a
  24 dB lowpass filter with resonance, and a built-in arpeggiator. It offers 100 patch
  programs and a flexible modulation architecture with four freely routable modulation
  units, delivering powerful analog bass and lead sounds. The Pulse+ variant adds a
  MIDI-to-CV converter with dedicated CV/Gate inputs and outputs for interfacing with
  vintage analog equipment.
details: |-
  The Pulse represents Waldorf's approach to creating a compact, performance-oriented rack-mount synthesizer. Its sound engine centers on three voltage-controlled oscillators capable of producing pulse, sawtooth, and triangle waveforms with continuously variable parameters.

  The architecture includes a robust modulation system with four freely routable modulation units, allowing users to assign various sources to multiple destinations with adjustable amounts. Two LFOs and two envelopes with selectable trigger modes provide almost unlimited possibilities for shaping analog bass and lead synth sounds.

  The Pulse+ variant adds significant connectivity enhancements, including a built-in MIDI-to-CV converter with dedicated CV/Gate inputs and outputs for interfacing with vintage analog equipment. Parameter changes transmit and receive as MIDI controller messages, making it highly integrable with modern setups.
specs: |-
  - Monophonic
  - Three oscillators with variable waveforms (pulse, sawtooth, triangle)
  - 24 dB lowpass filter with resonance
  - Two LFOs with five waveforms (triangle, sine, sawtooth, pulse, sample & hold), 0.008 Hz to 261 Hz
  - Two envelopes with selectable trigger modes
  - Four freely routable modulation units
  - Arpeggiator with tempo control
  - 59 presets, 40 user programs, 1 random sound (100 total)
  - MIDI control (CV/Gate on Pulse+ model)
  - Rack-mount format, no keyboard
releaseDate: "1996"
