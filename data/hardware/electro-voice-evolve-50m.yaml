url: https://products.electrovoice.com/na/en/evolve-50m/
description: The EVOLVE 50M is a portable column-array PA system with an
  integrated 8-channel digital mixer, combining Electro-Voice loudspeaker
  engineering with Dynacord electronics. The system pairs eight 3.5-inch
  neodymium drivers in a slim composite column with a 12-inch subwoofer and a
  built-in 1000 W amplifier (500 W LF + 500 W HF), delivering 127 dB max SPL
  over a 120 x 40 degree asymmetric coverage pattern from 43 Hz to 20 kHz. The
  onboard mixer provides four XLR/TRS combo mic/line inputs, two XLR/TRS combo
  stereo line inputs, a 1/4-inch Hi-Z instrument input, RCA stereo, 3.5 mm
  stereo, and stereo Bluetooth audio streaming, plus XLR mix and aux outputs, a
  1/4-inch footswitch input, and an RJ45 QuickSmart Link port for chaining two
  units over Ethernet. DSP includes three-band system EQ, seven-band graphic EQ,
  30 effect presets across two FX channels, five user presets, and four system
  modes (Music, Live, Speech, Club). Full audio, effects, and mixer control is
  also available via the QuickSmart Mobile app for iOS and Android. Available in
  black or white finish; ships with an array/pole carry case.
details: |-
  Portable column-array PA with integrated 8-channel digital mixer

  Eight 3.5-inch neodymium drivers in slim composite column

  12-inch subwoofer with internal 1000 W amplifier (500 W LF + 500 W HF)

  127 dB max SPL; 120 x 40 degree asymmetric coverage

  Frequency response 43 Hz - 20 kHz (-3 dB); range 37 Hz - 20 kHz (-10 dB)

  4 XLR/TRS combo mic/line inputs with phantom power

  2 XLR/TRS combo stereo line inputs

  1 1/4-inch Hi-Z instrument input

  RCA stereo, 3.5 mm stereo, and Bluetooth stereo audio inputs

  XLR mix out and XLR aux out

  RJ45 QuickSmart Link for chaining two EVOLVE 50M units

  1/4-inch footswitch input

  30 effect presets (chorus, delay, flange, reverb) across two FX channels

  Three-band system EQ plus seven-band graphic EQ in mixer mode

  Music, Live, Speech, Club system modes; 5 user-programmable presets

  QuickSmart Mobile app control (iOS / Android)

  Internal pole wiring; aluminum pole and composite column

  15 mm plywood sub enclosure with steel grille

  Available in black or white; includes array/pole carry case
specs: >-
  - frequencyResponse: 43 Hz - 20 kHz (-3 dB)

  - frequencyRange: 37 Hz - 20 kHz (-10 dB)

  - maxSpl: 127 dB

  - amplifierPower: 1000 W (500 W LF + 500 W HF)

  - coverage: 120 x 40 degrees (H x V, asymmetric)

  - drivers: 8 x 3.5-inch neodymium (column array)

  - subwoofer: 1 x 12-inch

  - crossoverFrequency: 200 Hz

  - dimensionsColumn: 32.5 x 4.0 x 6.9 in (H x W x D)

  - dimensionsPole: 36.6 x 1.9 x 2.2 in (internal wiring)

  - dimensionsSub: 20.9 x 13.6 x 18.5 in (H x W x D)

  - dimensionsAssembled: 80.5 x 13.6 x 18.5 in (H x W x D)

  - weight: 57.75 lb total (Column 10.34 lb / Sub 44.66 lb)

  - enclosureMaterialColumn: Composite

  - enclosureMaterialSub: 15 mm plywood

  - poleMaterial: Aluminum (internal wiring)

  - grille: Powder-coated steel (black or white)

  - mixerChannels: 8-channel digital

  - phantomPower: Yes (switchable)

  - dsp: 3-band system EQ; 7-band graphic EQ in mixer mode; 30 FX presets across
  2 FX channels; 5 user presets

  - systemPresets: Music, Live, Speech, Club

  - wireless: Bluetooth stereo audio streaming

  - networkControl: RJ45 QuickSmart Link (Ethernet) for dual-unit chaining

  - appControl: QuickSmart Mobile (iOS / Android)

  - powerConsumption: 100-240 V AC, 50-60 Hz, 1.5-0.6 A

  - accessoriesIncluded: Array / pole carry case

  - colors: Black, White
