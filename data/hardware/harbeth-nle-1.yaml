description: The NLE-1 loudspeaker unlocks the full performance potential of
  Harbeth's RADIAL cone technology, combined with precision DSP, to deliver a
  truly exceptional listening experience.
details: |-
  The NLE-1 loudspeaker combines the full latent performance potential of Harbeth's RADIAL cone technology with DSP, delivering a truly exceptional audio experience. It is a pinnacle system crafted to meet the rigorous demands of recording engineers, mixers and producers.

  Compact in form, it is ideally suited to smaller control rooms, yet equally capable within larger immersive systems, where its resolution enables critical mix decisions to be made with absolute confidence.

  Both the mid/bass and treble drive units are individually controlled via an internal DSP crossover and powered by dedicated 50W ultra-low-distortion, high-damping-factor Class-D amplifiers.

  With the power and capability of Digital Signal Processing, the design team has adjusted the smallest of sonic details. A personality mode switch (described elsewhere on the page as a bass enhancer switch) permits an extra octave of bass when playing at lower volumes.

  Connect a streamer using the XLR input, or switch to the dedicated RCA input for a turntable, CD player or pre-amplifier. A discreet volume control is located on the back, keeping the design clean and minimalist. The NLE-1 is designed and handmade in the UK.
specs: |-
  - Description: NLE-1 digital loudspeaker
  - Drive units: 110mm Harbeth-made RADIAL mid/bass drive unit
  - Drive units: 19mm ferrofluid-cooled tweeter
  - Frequency range: 75Hz to 20kHz, plus or minus 3dB free-space
  - Inputs: XLR and RCA
  - Amplification: two 50W ultra-low-distortion, high-damping-factor Class-D amplifiers, one per drive unit
  - Internal DSP crossover with individual control of each drive unit
  - Personality mode switch adds an extra octave of bass at lower volumes
  - Rear-mounted volume control
  - Power consumption: 60mW idle, 50W maximum
  - Dimensions: 275mm high, 166mm wide, 230mm deep
  - Weight: 7.6kg each without packing, 11.2kg with packing
  - Finishes: Satin Black, Satin White, Titanium Grey, Ivory Sand, Midnight Blue, Racing Green, Crimson Red (not all finishes are available in all countries)
  - Designed and handmade in the UK
