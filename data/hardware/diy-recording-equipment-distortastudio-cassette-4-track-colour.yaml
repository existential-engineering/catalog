description: A Colour module inspired by the channel strip circuitry of a
  late-80's cassette 4-track recorder, producing solid-state dirt to trashy
  distortion with NOS opamps.
details: |-
  Do you ever pine for the cheap and dirty, but somehow musical and inspiring, sound of your old portable 4-track? The Distortastudio brings that sound to your Colour Palette without a big tape machine taking up space in your studio. The Distortastudio's circuitry is directly inspired by the channel strip of a late-80's TASCAM machine. Just like your old 4-track, you can run the Distortastudio at low gain for subtle solid-state dirt or at high gain for trashy distortion and hiss. FEATURES

  For more info, check out our series of posts about the Distortastudio design process:

  Samples

  Resources
