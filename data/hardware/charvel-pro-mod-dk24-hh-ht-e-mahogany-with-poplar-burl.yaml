description: A perfect fusion of elegance and high performance, designed for a
  new breed of player whose musical vision and versatility knows no boundaries.
details: |-
  The Pro-Mod DK24 HH HT E Mahogany with Poplar Burl pairs a Dinky-shaped mahogany body capped with a poplar burl top in a satin finish, featuring a sculpted shredder's cut heel and scalloped lower back bout for unhindered upper-fret access.

  A bolt-on maple neck with graphite reinforcement is finished in hand-rubbed satin urethane and shaped to a Speed Neck profile with rolled fingerboard edges. The ebony fingerboard carries a 12"-16" compound radius, 24 jumbo frets, offset white dot inlays, and white side dots, anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around an HH configuration: a Seymour Duncan Full Shred TB-10 at the bridge and a Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch with a 500K EVH Bourns low friction volume pot and a no-load tone control.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge, Charvel-branded die-cast locking tuning machines, a Fender standard string guide, and a heel-mount truss rod adjustment wheel. The licensed Fender Stratocaster headstock and black hardware finish complete a streamlined modern high-performance platform.
