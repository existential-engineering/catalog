url: https://bastl-instruments.com/eurorack/modules/dc-motor
description: Dual-channel bipolar DC motor driver module. CV inputs control
  speed and direction of each motor channel, with attenuators, a speed offset
  knob, and a directional offset knob per channel. Optical isolation between the
  CV and motor circuitry eliminates ground connections between the two systems.
details: |-
  6HP, 50mm depth. Requires +5V bus. Peak motor current: 1A; constant: 600mA. PTC fuse and diode-protected 16-pin power connector. Optically isolated motor and CV circuitry.
