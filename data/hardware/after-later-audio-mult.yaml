description: A buffered/active mult with LED indicator offering two channels of
  1-to-3 multiples in a 1U Intellijel format module, with channel 1 normalled to
  channel 2 for a 1-to-6 configuration.
details: |-
  This is a buffered/active mult with LED indicator. You get two channels of 1 to 3 multiples within a 2HP module. The output of channel 1 is normalled to channel 2 so it can also be treated as a 1 to 6 multiple as well. Active vs Passive mults:

  With a passive mult you are effectively just plugging multiple things into the same jacks. This will often cause some voltage drop in each of the signals. With an active (or buffered) mult you will not get any voltage drop from the original signal.
