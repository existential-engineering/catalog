description: The 03 is a compact Single 0 14-fret acoustic guitar that functions
  equally well as a travel instrument or a small OM-style stage guitar. Despite
  its modest size, it delivers a uniquely round, punchy tone with characteristic
  small-body warmth, strong volume, and responsive headroom. It features East
  Indian rosewood back and sides, an ebony fingerboard and bridge, and pre-war
  scalloped X-brace construction with premium appointments throughout.
details: |-
  The 03 is a Single 0 body acoustic guitar in a 14-fret configuration, designed to serve as both a travel instrument and a small OM-style guitar suitable for stage use. Its compact dimensions (13 7/16" body width, 18 3/16" body length, 4" depth, 38" total length) and 24 7/8" scale length make it an agile, easy-playing instrument. The top is Sitka spruce braced with pre-war scalloped X-brace construction, while the back and sides are East Indian rosewood. The neck is Honduran mahogany with a Modified V profile and a compound fingerboard radius (14" to 26"). The ebony fingerboard and belly-style ebony bridge with 2 3/16" spacing are paired with bone nut and saddle. Appointments include ivoroid body binding with b/w/b/w/b purfling, an abalone rosette, a chevron (3-style) backstrip, a tortoise pickguard, and gold Waverly tuners.
specs: |-
  - Body Style: Single 0 (14-fret)
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Bracing: Pre-war scalloped X-brace
  - Neck: Honduran mahogany
  - Neck Profile: Modified V
  - Fingerboard: Ebony
  - Fingerboard Radius: 14" - 26" compound
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Gold Waverly
  - Bridge Pins/End Pin: Ebony with abalone dot
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead: Square with volute
  - Peghead Veneer: Stained exotic ebony with mother-of-pearl logo
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Fingerboard Binding: .060" ivoroid
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Rosette: Abalone
  - Backstrip: 3-style (Chevron)
  - Pickguard: Tortoise
  - Body Width: 13 7/16"
  - Body Length: 18 3/16"
  - Body Depth: 4"
  - Total Length: 38"
  - Scale Length: 24 7/8"
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Strings: D'Addario EJ-16 (.012" - .053")
