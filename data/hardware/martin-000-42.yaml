details: |-
  The Martin 000-42 sits in Martin's Standard Series and combines the comfortable 000-14 Fret (Auditorium) body shape with Style 42 appointments. The result is a refined acoustic guitar that balances clarity, articulation, and rosewood warmth in a smaller-body footprint.

  The top is solid spruce paired with solid East Indian rosewood back and sides, producing the rich overtone content and shimmering trebles long associated with rosewood Martins. The Auditorium body keeps the response focused and comfortable for fingerstyle and recording use, while still offering strong projection.

  The genuine mahogany neck uses Martin's GE Modified Low Oval profile with the High-Performance Taper, joined to an ebony fingerboard inlaid with Style 45 snowflake abalone markers. A 24.9" scale length and 14-fret body join give the instrument a familiar Martin feel under the hand.

  Style 42 appointments include abalone purfling around the top, an ebony bridge with bone saddle and pins, and gold open-gear tuners. The guitar ships acoustic-only with no factory-installed electronics.

  A hardshell case is included.
specs: |-
  - Body: 000-14 Fret (Auditorium)
  - Top: Solid Spruce
  - Back & Sides: Solid East Indian Rosewood
  - Neck: Genuine Mahogany
  - Neck Shape: GE Modified Low Oval with High-Performance Taper
  - Fingerboard: Ebony with Style 45 Snowflake Abalone Inlays
  - Scale Length: 24.9"
  - Frets: 20 total (joins body at 14th fret)
  - Bridge: Ebony with Bone Saddle and Pins
  - Tuners: Gold Open Gear
  - Appointments: Style 42 Abalone
  - Electronics: None
  - Case: Hardshell included
