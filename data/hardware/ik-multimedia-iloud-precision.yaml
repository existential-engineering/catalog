description: "Professional studio monitor series with built-in ARC X room
  correction, linear phase digital crossovers, custom Class-D amplification, and
  bass extension down to 30 Hz. Available in 5-inch, 6-inch, and MTM
  configurations."
details: |-
  The iLoud Precision MKII series delivers professional studio monitoring with built-in ARC X room correction using an integrated MEMS microphone. Linear phase digital crossovers running at 96 kHz DSP and a time-coherent design ensure accurate reproduction across the frequency spectrum.

  Custom Class-D amplification drives a 1.5" high-output, low-distortion graphene-reinforced textile dome tweeter and ultralight coated paper mid-woofer(s). The HDF enclosure with internal bracing and controlled dispersion minimizes coloration. Bass extension reaches down to 30 Hz with ARC calibration enabled, and a selectable bass roll-off facilitates subwoofer integration.

  Each monitor includes iLoud Isolation Pods (aluminum supports) for decoupling from surfaces.
specs: |-
  - Built-in ARC X room correction with MEMS microphone
  - Linear phase digital crossovers at 96 kHz DSP
  - Time-coherent design
  - Custom Class-D amplification
  - 1.5" graphene-reinforced textile dome tweeter
  - Ultralight coated paper mid-woofer(s)
  - HDF enclosure with internal bracing and controlled dispersion
  - Bass extension down to 30 Hz (with ARC calibration)
  - Selectable bass roll-off for subwoofer integration
  - Includes iLoud Isolation Pods (aluminum supports)
