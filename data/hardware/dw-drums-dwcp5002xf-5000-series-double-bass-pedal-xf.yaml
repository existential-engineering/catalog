description: 5000 Series pedals are now fitted with more features and upgrades than ever before.
details: |-
  The 5002AD4XF takes the exact same feature set as the popular 5000 double pedal and adds an Extended Footboard and baseplate for increased leverage and power.

  The dual-chain Accelerator eccentric cam delivers a smooth and commanding stroke, while a host of professional-grade details comes standard: a Single Post Aux Pedal that allows plenty of room for close hi-hat stand or multi-pedal positioning, and a Delta Ball-Bearing Hinge whose tri-bearing design offers the smoothest pedal action possible.

  The Tri-Pivot Toe Clamp's three self-aligning rubber pads grip any diameter bass drum counter hoop, and a ballistic nylon deluxe carrying case with a rigid liner protects the pedal, beaters and universal assembly.
