description: >-
  The Akai MINIAK is a compact virtual analog synthesizer sharing its engine
  with the Alesis Micron, offering three oscillators per voice, dual multimode
  filters, an onboard vocoder with gooseneck microphone, and up to 1,000
  storable programs. Its 37-key semi-weighted keyboard and extensive modulation
  options pack serious synthesis power into a portable package.
details: |-
  The Akai MINIAK is essentially a rebranded and cosmetically updated version of the Alesis Micron, sharing the same Ion-derived virtual analog synthesis engine. With up to eight voices of polyphony and eight-part multitimbral operation, it punches well above its weight class for a compact keyboard synthesizer.

  Each voice features three oscillators feeding into two multimode resonating filters with 16 selectable filter types, providing a wide palette of timbral possibilities from classic analog emulations to more exotic digital textures. The dual LFOs, tracking generator, and sample-and-hold modulation sources offer deep sound design potential, while the built-in step sequencer, drum machine, and arpeggiator handle pattern creation duties.

  The onboard gooseneck microphone feeds a vocoder section that was a key selling point, making the MINIAK a self-contained performance instrument for electronic artists. Three modulation wheels plus pitch bend provide expressive real-time control, and the semi-weighted velocity-sensitive keys offer a more satisfying playing experience than many compact synths in its price range. With storage for up to 1,000 programs and multitimbral configurations, it serves as both a deep sound design tool and a capable live performance instrument.
specs: |-
  - Polyphony: Up to 8 voices
  - Multitimbral: Up to 8 parts
  - Oscillators: 3 per voice
  - Filters: 2 multimode resonating filters per voice (16 filter types)
  - LFO: 2 with multiple waveshapes, sample & hold, tracking generator
  - Effects: 4 drive effects (1 per part), master effects
  - Sequencer: Step sequencer, drum machine/rhythm sequencer
  - Arpeggiator: Yes
  - Vocoder: Yes (with gooseneck microphone)
  - Keyboard: 37-key semi-weighted, velocity sensitive
  - Controls: 3 modulation wheels, pitch bend, MIDI In/Out/Thru
  - Memory: Up to 1,000 programs and multis
releaseDate: "2009"
