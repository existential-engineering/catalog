url: https://www.klarkteknik.com/en/products/0811-AAF
description: The DI 22P PRO DI AV 2 is a passive direct injection box that
  combines features of the DI 20P and DI 10P in one unit, accepting dual
  instrument, line and speaker levels as well as MP3 and CD players, keyboard or
  drum submixers and other stereo sources. It needs no external power and
  carries custom-built MIDAS transformers with switchable input pads.
details: |-
  The DI 22P combines many of the features of the DI 20P and DI 10P direct boxes into one tool, reproducing the character of electric and acoustic instruments while also handling stereo playback sources.

  A custom instrumentation-grade input circuit uses advanced analogue design techniques to create the ideal input impedance match, giving a low noise, low harmonic and phase distortion input stage with a flat frequency response from 20 Hz to 30 kHz (±1 dB).

  Inputs are 2 x 1/4" TS, 2 x RCA and 1 x 1/8" TRS connectors, which between them accommodate most signal types. The industry-standard Output XLR jacks send balanced versions of the input signals to a mixing board or other processing device.

  A -15 dB input Pad lets the DI 22P accept a wide range of input signals including guitar, line and speaker levels, up to 30 dBu. The Earth Lift switches separate the input and output grounds, eliminating earth loops between equipment on different mains electricity supplies, and the fully transformer-isolated design is intended to hold up in large-scale production environments.

  The ultra-compact enclosure is a thick aluminium extrusion that protects the electronics, with sturdy rubber corner bumpers for road use.
specs: |-
  - Inputs: 2 x 1/4" TS, 2 x RCA, 1 x 1/8" TRS
  - Outputs: balanced XLR per channel
  - Frequency response: 20 Hz to 30 kHz (±1 dB)
  - Passive design, requires no external power
  - Input pad: -15 dB, accepts guitar, line and speaker levels up to 30 dBu
  - MIDAS custom-design transformers, fully transformer-isolated
  - Earth Lift switches separating input and output grounds
  - Aluminium extrusion enclosure with rubber corner bumpers
