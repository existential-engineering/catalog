id: hj94-5onLdOyTVoc5g9oV
name: SR-L700MK2
manufacturer: stax
primaryCategory: headphones
description: A push-pull electrostatic Lambda-frame earspeaker featuring an
  exchangeable cable structure and aluminum case holder for improved comfort and
  fit. The MK2 model includes a high-quality 6-strand silver-plated OFC cable
  and a curved case holder design that enhances low-frequency reproduction and
  wearing comfort.
specs: |-
  - Type: Push-pull electrostatic, oval sound element, rear open-air type enclosure
  - Frequency response: 7 – 41,000 Hz
  - Electrostatic capacitance: 110 pF (including attached cable)
  - Impedance: 145 kΩ (including attached cable, at 10 kHz)
  - Sound pressure sensitivity: 101 dB / input 100 Vr.m.s. / 1 kHz
  - Maximum sound pressure level: 118 dB / 400 Hz
  - Bias voltage: DC 580 V
  - Ear pad: Real sheep's leather (skin-touching portion), high-class artificial leather (surrounding portion)
  - Cable length: 2.5 m full length
  - Cable type: Parallel 6-strand, low-capacity special wide cable
  - Cable conductor: 6N (99.9999%) annealed OFC with silver coating
  - Weight: 508 g (including attached cable), 371 g (without cable)
