description: >-
  Roland's flagship 128-voice rack-mount sound module combining an extensive waveform library with
  sample playback, four expansion slots, and professional digital connectivity.
details: |-
  The XV-5080 represents the pinnacle of Roland's sample-based synthesis architecture, delivering 128-voice polyphony with genuine stereo waveforms and expressive Matrix Control for detailed sound design. Its 1,083 onboard waveforms draw from the legacy of the JV-2080 and JD-990, providing a broad palette of sounds right out of the box.

  Four expansion slots accept both SRX-series 64 MB waveboards and legacy SR-JV80 expansion cards, dramatically extending the available sound library. The built-in SCSI port enables loading of Roland S-700 series and Akai sample libraries, with user sample memory expandable up to 128 MB for custom sound integration alongside the factory content.

  Professional studio connectivity includes an R-Bus port for eight channels of 24-bit digital audio output alongside S/PDIF, making it straightforward to integrate into digital recording environments. The effects section derives from Roland's SRV-3030, V-Studios, and RSS technology, offering high-quality reverb, chorus, and multi-effects processing across 1,152 patches and 96 performances.
specs: |-
  - Polyphony: 128 voices
  - Waveforms: 1,083 onboard
  - Patches: 1,152; 96 performances
  - Expansion: 4 slots (SRX/SR-JV80 boards)
  - Sampling: Up to 128 MB expandable via SCSI
  - Effects: Reverb, chorus, multi-effects (derived from SRV-3030/RSS)
  - Digital I/O: R-Bus (8-channel 24-bit), S/PDIF
  - Control: MIDI
releaseDate: "2000"
