details: |-
  The 21" Anniversary Ride was launched to mark the 20th Anniversary of the A Custom cymbal line. This cymbal is extremely versatile, making it well suited for all types of musical settings. Retaining all of the A Custom cymbal line attributes, the 21" Anniversary Ride features symmetrical hammering, brilliant finish, and medium weight for a balanced sound that is neither too high nor too low. Known for its crisp, sweet sound, this cymbal's loud, penetrating bell is also ideal for Latin patterns. To commemorate the 20th Anniversary of the A Custom line, a cream-white logo and special trademark have been added to the cymbal.
