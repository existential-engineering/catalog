description: A dual-mono, three-band tube equalizer for mixing and mastering
  featuring a 12AT7 tube circuit, floating Q that self-adjusts to gain and
  program material, and a frequency range spanning 30Hz to 40kHz.
details: |-
  The Hammer 2 is a dual-mono, three-band tube equalizer designed for use on
  the mix bus as well as individual instruments. Each channel features six
  detented rotary controls providing continuously variable boost/cut of ±12dB
  per band across Low, Mid, and High frequency ranges.

  The equalizer uses a 12AT7 tube design with an innovative filtering system
  that passes musical 2nd order tube harmonics while eliminating unwanted noise.
  A floating Q self-adjusts based on gain and program material, allowing broad
  tonal shaping suited to tracking, mixing, and mastering.

  Frequency coverage spans from 30Hz to 40kHz (-3dB). Low band options include
  30Hz, 50Hz, 100Hz, 150Hz, 200Hz, 300Hz, 400Hz, 470Hz, and 560Hz (shelving
  at 30/60/125Hz). Mid band covers 125Hz through 4.7kHz, and High band covers
  1.8kHz through 40kHz (shelving at 4.8k, 12.5k, and 30kHz).

  Additional features include a Lo-Cut filter at 84Hz, a Hi-Cut filter at 8kHz,
  and EQ In/Out toggle switches per channel. The unit is housed in a
  custom-milled brushed aluminum faceplate and occupies 2U of rack space.
  Handmade in the USA with a full 1-year warranty.
specs: |-
  - Frequency Response: -3dB @ 5Hz and 40kHz
  - Overall Frequency Range: 30Hz to 40kHz
  - Noise Floor: -94dBm with 30kHz bandwidth
  - Boost/Cut: ±12dB per band (Low, Mid, High)
  - Low-Frequency Options: 30/50/100/150/200/300/400/470/560Hz
    (shelving @ 30/60/125Hz)
  - Mid-Frequency Options: 125Hz through 4.7kHz
  - High-Frequency Options: 1.8kHz through 40kHz
    (shelving @ 4.8k/12.5k/30kHz)
  - Lo-Cut Filter: 84Hz
  - Hi-Cut Filter: 8kHz
  - Floating Q (self-adjusting)
  - Tube Type: 12AT7
  - THD: >0.08% @ 1kHz
  - Power: 120/230 VAC, 42W
  - Dimensions: 19" W x 3.5" H x 10" D (2U)
  - Weight: 10 lbs
  - Handmade in the USA
  - 1-year warranty
