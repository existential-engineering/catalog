  - rack-mount
url: https://www.crownaudio.com/en-US/products/xti-2002
description: Two-channel, 800W @ 4Ω power amplifier from Crown's XTi 2 Series.
  Rack-mount design with onboard DSP, USB control via HiQnet System Architect,
  and advanced limiting for portable PA applications.
details: |-
  The XTi 2 Series represents powerful innovation in amplifier design. The XTi 2002 delivers unmatched performance and value, operating reliably night after night and setting industry standards with advanced features and robust construction.

  The amplifier is specifically recommended for portable PA applications where dependable performance meets innovative technology. Integrated cast-aluminum handles and a secure locking power-cord clip support life on the road, while onboard monitoring of AC line voltage and power-supply temperature surfaces operational data in real time.

  Control and configuration is handled through Crown's HiQnet System Architect / Band Manager software via the rear-panel USB port, including DSP, presets, and monitoring. The XTi 2002 supports up to 50 presets (49 user-definable) and three user-defined fan modes.
specs: |-
  - 2 channels
  - Rated Power Output (per channel): 1000W @ 2Ω, 800W @ 4Ω, 475W @ 8Ω
  - Input Sensitivity: 1.4V
  - Signal-to-Noise Ratio: 100 dB (A-weighted)
  - THD: <0.5%
  - Frequency Response: +0/-1 dB (1W, 20 Hz – 20 kHz)
  - Crosstalk: >70 dB (20 Hz – 1 kHz)
  - HiQnet System Architect software control via USB
  - Dimensions: 19" W × 3.5" H × 12.25" D
  - Weight: 18.5 lbs (8.4 kg)
  - Shipping Weight: 21.5 lbs (9.8 kg)
  - IEC Power Connector: 15A
