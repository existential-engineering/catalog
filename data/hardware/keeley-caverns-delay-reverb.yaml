description: Compact dual pedal pairing a 1 second 24-bit delay with a
  multi-mode reverb. Out of production, superseded by the Caverns Delay Reverb
  v2.
details: |-
  The first-generation Caverns Delay and Reverb combines a one second delay with a multi-mode reverb on a dual DSP platform designed in house. The reverb and delay can be used on their own or together, giving a compact pedal a wide range of time-based effects in a low-noise design.

  The reverb channel carries three modes. Modulation mode introduces pulsing modulation to the reverb, studio plate mode delivers a plate reverb with adjustable pre-delay reflections, and shimmer mode adds a prominent emphasis on octave-up voices. A Morph control then tailors each mode further, covering modulation pulse, pre-delay reflection and octave-up voice intensity.

  The delay channel offers one second of 24-bit delay and an inverse dynamic modulation feature: the repeats stay clean until they begin to decay, at which point modulation is added and grows in intensity as the note fades.

  This version is out of production and is superseded by the Caverns Delay Reverb v2.
specs: |-
  - Modulation Mode – Introduces pulsing modulation to the reverb to add musical inspiration and provide a different take on normal reverb effects
  - Studio Plate Mode – Delivers studio-quality reverb with adjustable pre-delay reflections for the ultimate enhancement
  - Shimmer Mode – Enables control over the reverb with an additional and prominent emphasis on octave-up voices for another unique creative twist
  - 1 second of 24-bit delay with inverse dynamic modulation
  - Morph control over modulation pulse, pre-delay reflection and octave-up voice intensity
  - Dual DSP platform
  - Out of production
