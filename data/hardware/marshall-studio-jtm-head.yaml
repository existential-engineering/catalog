description: "The Studio JTM Head (ST20H) is a compact 20W all-valve guitar
  amplifier head from Marshall's Studio range that reproduces the legendary,
  warm and smooth tones of the original 1962 JTM45. Meticulously crafted at
  Marshall's Bletchley, England factory, it pairs an era-defining
  single-channel-with-two-voices circuit (driven by two ECC83 preamp valves, an
  ECC83 phase splitter and two 5881 power amp valves) with modern
  rehearsal-to-stage flexibility: a power reduction switch drops the output from
  20W down to 5W, and a rear-panel series FX loop and DI out make recording and
  pedalboard integration easy. Aesthetics nod to the 1960s originals with a
  solid metal Marshall logo, gold piping and gold beading."
details: |-
  Built in the UK and inspired by Marshall's first ever amp, the Studio JTM Head can create any tone from smooth to crunchy. If you are looking for something unique, blend the two voices together and create your own sound.

  This amplifier provides you with the versatility to tailor your power output to suit your environment. Effortlessly select between 20W and 5W power output to seamlessly transition from the rehearsal room to the communal space and back again, without compromising on tone.

  Reproducing the legendary, warm and smooth tones of the original JTM45, the Studio JTM range looks as good as it sounds. Let the all-valve, era-defining sound of the JTM steal the show, whether playing at home or on stage.

  This instantly recognisable tone is driven by two ECC83 preamp valves, two 5881 power amp valves and one ECC83 phase splitter.

  Meticulously crafted in Marshall's Bletchley, England, factory the Studio JTM features classic Marshall touches such as a robust metal coffin logo with golden piping and beading that pays homage to the 1960s. After extensive years of development, the Studio JTM delivers the timeless and velvety tones reminiscent of the original JTM. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: ST20H
  - Range: Studio
  - Channels: 2, bridgeable
  - Technology: Valve
  - Output wattage: 20W (with power reduction option to 5W)
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4" jack)
  - Inputs: 4 x 1/4" jack instrument inputs (high/low sensitivity)
  - Controls: Normal/Loudness II, High Treble/Loudness I, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects loop: Yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x 5881
  - Weight: 9.25 kg / 20.4 lb
  - Width: 500 mm / 19.7"
  - Height: 240 mm / 9.4"
  - Depth: 230 mm / 9.1"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: Detachable power cable included, speaker cable included
  - Colour: Black
