description: "The Studio JTM Head (ST20H) is a compact 20W all-valve guitar
  amplifier head from Marshall's Studio range that reproduces the legendary,
  warm and smooth tones of the original 1962 JTM45. Meticulously crafted at
  Marshall's Bletchley, England factory, it pairs an era-defining
  single-channel-with-two-voices circuit (driven by two ECC83 preamp valves, an
  ECC83 phase splitter and two 5881 power amp valves) with modern
  rehearsal-to-stage flexibility: a power reduction switch drops the output from
  20W down to 5W, and a rear-panel series FX loop and DI out make recording and
  pedalboard integration easy. Aesthetics nod to the 1960s originals with a
  solid metal Marshall logo, gold piping and gold beading."
details: |-
  - All-valve, era-defining JTM45 voicing
  - Single channel with two voices
  - Power reduction switch (20W / 5W)
  - Series FX loop
  - DI out for direct recording / FOH
  - Two ECC83 preamp valves + ECC83 phase splitter
  - Two 5881 power amp valves
  - Built in Marshall's Bletchley, England factory
specs: |-
  - Model: ST20H
  - Range: Studio
  - Inspired By: JTM45
  - Output Wattage: 20W (switchable to 5W)
  - Power Reduction: 20W / 5W switch
  - Channels: Single channel with two voices
  - Technology: All-valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x 5881
  - Effects Loop: Yes (series), rear-panel send/return
  - Di Out: Yes
  - Inputs: 4 x 1/4" jack inputs (High/Low across two voicings)
  - Construction: All-valve, hand-wired heritage styling
  - Aesthetics: Solid metal Marshall logo, gold piping and gold beading
  - Country Of Origin: Designed and engineered in UK. Made in UK (Bletchley, England).
