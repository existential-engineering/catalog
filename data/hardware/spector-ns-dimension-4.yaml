details: |-
  The NS Dimension Series reimagines Spector's iconic design with multi-scale construction and offers players a new level of playability and tonality. In addition to the multi-scale, neck-thru construction, NS Dimension models also feature a variety of premium tonewoods and cutting-edge Fishman Fluence electronics. The fully curved body is carved from lightweight Swamp Ash and features a highly figured Poplar Burl top. The 5-piece neck is constructed from Maple and Wenge for enhanced stability and eye-catching looks. The 24 fret Wenge fingerboard also features illuminating side dots, allowing players to expertly navigate the fingerboard. New for 2022, the highly sought-after Spector NS Dimension basses are available in two all-new colors, Black & Blue and Inferno Red, each featuring a high gloss finish. Taking inspiration from Spector's USA Series, the new color options in the NS Dimension Series were carefully chosen to highlight the grain pattern of the highly figured woods, resulting in a striking look that's always one-of-a-kind.
