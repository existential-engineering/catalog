description: Compact 2x12" passive guitar speaker cabinet for the Studio Classic range, voiced to pair with the JCM800-style Studio Classic heads and combos. Loaded with two Celestion V-Type 12" speakers, rated 140W at 8Ω, with a single 1/4" input jack. Designed and made in the UK.
details: |-
  Recreate the unmistakable roar of the JCM800 by matching the Studio Classic Head or Studio Classic Combo with this handmade compact cabinet.

  Designed and built in Britain with two Celestion V-Type speakers to capture that authentic overdriven Marshall sound, yet constructed with a lightweight chassis allowing you to take it with you wherever you go.

  The pair of 12" Celestion V-Type speakers handle 140W in total, and the cabinet presents an 8 ohm load to the amplifier driving it.

  Compact and portable at 535 x 750 x 320 mm and 22.70 kg, it is sized to match the rest of the Studio Classic range. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: Studio Classic 2x12 Cabinet (SC212)
  - Speaker configuration: 2x12"
  - Speaker model: Celestion V-Type (16Ω, 70W)
  - Power handling: 140W
  - Unit impedance: 8Ω
  - Inputs: 1
  - Passive cabinet: no mains connection, driven by the amplifier feeding it
  - Weight: 22.70 kg / 50.1 lb
  - Width: 535 mm / 21.1"
  - Height: 750 mm / 29.5"
  - Depth: 320 mm / 12.6"
  - Colour: Black
  - Country of origin: Designed and engineered in UK. Made in UK.
