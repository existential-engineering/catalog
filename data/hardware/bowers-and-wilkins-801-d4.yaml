description: Flagship reference-quality tower loudspeaker representing 40 years
  of innovation. Positioned as the loudspeaker that sets the standard other
  high-end designs will be judged by for years to come.
details: |-
  The 801 D4 is the flagship reference model in the Bowers & Wilkins 800 Series Diamond range. It is a 3-way vented-box system pairing two 250mm Aerofoil cone bass units with a 150mm Continuum cone FST midrange housed in a Turbine Head, and a 25mm Diamond dome tweeter in a Solid Body Tweeter-on-Top assembly.

  Key technologies include the Diamond Tweeter, Solid body Tweeter-on-Top, Continuum Cone FST with Anti-Resonance Plug, Biomimetic Suspension, Turbine Head, Matrix internal bracing, Aerofoil Cone bass units, and Flowport.

  Available in Gloss Black, White, Satin Rosenut, and Satin Walnut finishes.
specs: |-
  - Drive units: 1x 25mm (1 in) Diamond dome tweeter, 1x 150mm (6 in) Continuum cone FST midrange, 2x 250mm (10 in) Aerofoil cone bass
  - Configuration: 3-way vented-box system
  - Frequency range: 13Hz to 35kHz
  - Frequency response: 15Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on-axis at 2.83Vrms at 1m)
  - Harmonic distortion (90dB, 1m on-axis): <1% 30Hz-20kHz, <0.3% 100Hz-20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W - 1000W into 8 ohms
  - Max recommended cable impedance: 0.1 ohms
  - Height: 1221mm (48.1 in)
  - Width: 451mm (17.8 in)
  - Depth: 600mm (23.62 in)
  - Net weight: 100.60kg (221.8 lb)
  - Finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
