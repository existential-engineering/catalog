description: The loudspeaker that sets the standard other high-end designs will
  be judged by for years to come. Endowed with every new technology the 800
  Series Diamond has to offer, the reference-quality 801 D4 is an instant icon.
details: |-
  The 801 D4 is the flagship and most powerful model in the 800 Series Diamond range, a passive three-way vented-box tower loudspeaker driven from an external amplifier. Bowers & Wilkins quotes a recommended amplifier power of 50W to 1000W into 8 ohms and the speaker has no mains connection of its own.

  The company frames the model as 40 years of excellence: in each of its incarnations the 801 has been the most advanced loudspeaker it knew how to make at that point in time, a showcase of its newest technologies and most original thinking.

  The all-aluminium Turbine Head houses the Continuum midrange cone in a stiff, critically damped enclosure to eliminate unwanted resonances, and is decoupled from both the bass enclosure and the tweeter body. Biomimetic Suspension replaces the traditional fabric spider to reduce the unwanted air pressure and coloration it generates.

  Drive units are a 25mm Diamond dome high-frequency unit, a 150mm Continuum cone FST midrange and two 250mm Aerofoil cone bass units, supported by an Anti-Resonance plug, Matrix bracing, the Solid body Tweeter-on-Top assembly and Flowport. Each cabinet stands 1221mm tall, is 451mm wide and 600mm deep, and weighs 100.60kg.

  Finishes are Gloss Black, White, Satin Rosenut and Satin Walnut, with black and grey grille options. Bowers & Wilkins describes the no-compromise design as including all its most advanced technologies in their purest, most optimized form alongside crossover components of the highest quality.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond tweeter, Solid body Tweeter-on-Top, Continuum cone FST, Matrix, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Aerofoil cone bass units, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 250mm (10in) Aerofoil cone bass units
  - Frequency range: 13Hz to 35kHz
  - Frequency response: 15Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 30Hz to 20kHz, less than 0.3% 100Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Speaker terminals: two pairs per cabinet for bi-wiring, accepting 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm (5/32in)
  - Dimensions: Height 1221mm (48.1in), Width 451mm (17.8in), Depth 600mm (23.62in)
  - Net weight: 100.60kg (221.8lb)
  - Cabinet finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
  - Grille finishes: Black, Grey
