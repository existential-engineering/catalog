details: |-
  The GS1 is an innovative flush-mount wall or ceiling microphone designed for distance miking. Features include a fully integrated preamp, an extremely high sensitivity rating of 38 millivolts, and complete immunity from RF interference caused by cell phones and GSM devices.

  The GS1 capsule is housed within a patented cradle that enables the microphone to be aimed up to an angle of 45 degrees towards the sound source. Its small footprint and flush-mount configuration allow the microphone to be unobtrusive without sacrificing sound quality.

  The GS1 terminates in a terminal block connector and is easy to install into a standard single gang box. A 2.75″ by 4.5″ mounting plate is included. The GS1 comes in a stock satin nickel finish and is also available in white.
specs: |-
  - Type: Flush-mount condenser installation microphone
  - Sensitivity: 38 mV (high output for distance miking)
  - Preamp: Miniaturized integrated preamp circuitry
  - Connector: Terminal block (single gang box install)
  - Immunity from RF interference
  - Includes 2.75" x 4.5" metal mounting plate
  - Designed, assembled and tested in the USA
  - 3-year warranty
