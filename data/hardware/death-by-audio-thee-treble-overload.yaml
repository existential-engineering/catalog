description: A dual-mono treble boost pedal reviving the treble boost circuit
  from Thee Fuzz War Overload, offering high-gain boost with a limiter and
  stereo TRS operation.
details: |-
  Legendary piercing tone, reimagined Thee Treble Overload revives the coveted treble boost circuit from the infamous limited-edition pedal, Thee Fuzz Warr Overload - this time packed with extra features and unleashed as its own weapon. It slices through any mix with razor-sharp precision, adding just the right edge to make your signal sound mean, bright, and alive. To achieve that bite, Thee Treble Overload carves away bass, tightening your tone and bringing definition to whatever sound you feed it. Need some stereo cables? --> Details Armed with nearly 60dB of gain and a LIMIT control, you can push it from a cutting boost to crispy obliteration while still keeping your output balanced with the rest of the band. Thee Treble Overload is dual mono, meaning it can process stereo chains, perfect for blasting your stereo reverbs, choruses, delays, keyboards, or drum machines straight into overdrive. Pair it with a Death By Audio Fuzz War to resurrect that revered Thee Fuzz War Overload sound without needing to hunt one down or drop collector dollars. Part of Death By Audio’s Destroyer Series, Thee Treble Overload sports the line’s signature look: a compact footprint, glowing vintage-style LED display, and minimal controls that conceal a world of sonic madness. Each Destroyer pedal delivers a distinct, over-the-top effect in a smaller, stage-friendly box - together forming a family of beautifully chaotic tone machines in stereo. Key Features: Legendary Sound of Thee Fuzz Warr Overload - The hyper-unique DBA treble booster is back from the dead and here to stay. Cut Like A Knife - Slice through the noise with a clear, piercing sound. Place before your overdrives and fuzzes to totally transform their distortion or place it after to totally annihilate your speaker. Big Character at Any Volume - Balance the BOOST and LIMIT for just the right amount of driven, boosted destruction at any volume you need. Now in Stereo - Add shine and punch after spatial effects, fully compatible with our whole collection of stereo TRS pedals in the Destroyer Series. Pedalboard-Friendly - A bite-sized package with a massive sound. Tour-Grade Build Quality - Rugged enclosure, quality components, hand-assembled, and built to last. Controls BOOST Adjusts the gain of the boost. Ranges from a sharp +17dB to an extreme +52dB blast - enough to hit distortion territory and deliver that signature gnarly edge. LIMIT Sets the maximum output volume. Crank the BOOST and turn the LIMIT down for a controlled output level with high distortion. Inputs and Outputs Features TRS INPUTS and OUTPUTS for mono or stereo operation. Use a standard TS cable for mono or a TRS cable for fully independent stereo. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel. We recommend Death By Audio’s RAW POWER power supply for optimal performance. Current Draw: 23 mA Physical Details Dimensions: 5.16” x 2.76” x 2.38” (including hardware). Weight: 9.1 oz. Sound Samples Guitar Classic Treble Treble Overload Fingerstyle Reverb (With Rooms) Crackle Fuzz (With Fuzz War) Sparkle Phaser (With Moonbeam Phaser) Bass Metal Distortion Punk Riff Garage Fuzz Destroyer Series Trio ( Thee Treble Overload , Moonbeam Phaser , and Dream Station ) Psych Country Punk Riff Digital Manual
