details: |-
  The Shigeharu IC Fuzz + Octave is a pedal born from a collaboration between
  Caroline Guitar Company and John Snyder at Electronic Audio Experiments. It
  combines classic Muff-style fuzziness with the punch of a classic overdrive
  through a cascading hybrid of op-amp and BC184 transistor gain stages.

  The pedal delivers sweet singing sustain and massive flamethrower gain with
  unprecedented clarity, improved punch, and definition. This hybrid topology
  gives it consistent performance across a variety of signal chains.

  A standout feature is the parallel octave-up voiced fuzz, activated via the
  Havoc stomp. An internal bias/gate control allows players to dial in broken,
  spitty sounds for added character.

  A slide switch provides additional flexibility by locking the octave-up circuit
  and converting the momentary Havoc switch into a kill/mute function.
specs: |-
  - Cascading hybrid gain stage: op-amp and BC184 transistors
  - Parallel octave-up voiced fuzz (Havoc stomp activation)
  - Internal bias/gate control for broken, spitty sounds
  - Slide switch locks octave-up and converts momentary to kill/mute switch
  - Designed in collaboration with John Snyder at Electronic Audio Experiments
