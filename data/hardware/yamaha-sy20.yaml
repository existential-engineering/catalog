description: >-
  The Yamaha SY20 was Yamaha's final analog synthesizer before the company shifted entirely to digital FM synthesis with the DX series. This Japan-only monophonic synth from 1982 features a VCO, VCF, and VCA signal path with aftertouch sensitivity, making it an exceptionally rare collector's item.
details: |-
  Released in 1982, the SY20 holds a unique place in Yamaha's history as the last analog synthesizer the company produced before fully committing to the FM synthesis technology that would define the DX7 and its successors. The instrument was never commercially sold outside of Japan, making it one of the rarest Yamaha synthesizers in existence.

  Despite its 20 preset sounds organized into two banks of ten, the SY20 is a genuine analog monosynth at heart. The presets are arranged as emulations of acoustic instruments including flute, oboe, clarinet, violin, trumpet, and harpsichord, but the real power comes from the independently toggleable VCO, VCF, and VCA sections. The oscillator provides sawtooth and square waveforms across five octave ranges with pulse width modulation and white noise.

  The 44-key keyboard supports aftertouch that can be routed to the VCF, VCA, or LFO, an expressive feature that was uncommon on budget monosynths of the era. The filter offers lowpass and two bandpass modes with full ADSR envelope control. Notably, the SY20 lacks both CV/Gate and MIDI connectivity, making it a completely self-contained instrument that cannot be externally sequenced without modification.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with saw and square waveforms (2', 4', 8', 16', 32')
  - Pulse Width Modulation: Yes
  - Noise: White noise generator
  - Filter: 1 VCF with lowpass, bandpass 1, bandpass 2 modes; ADSR envelope
  - LFO: 1 LFO routable to VCO, VCF, VCA
  - Envelopes: VCA ADSR, VCF ADSR
  - Keyboard: 44 keys with aftertouch (routable to VCF, VCA, LFO)
  - Presets: 20 (two banks of 10)
  - Effects: Portamento, sustain, transpose, brilliance
  - Output: Mono audio, headphone jacks (front and rear), built-in speaker
  - Weight: 11 kg (24 lbs)
  - Control: Foot pedal input only (no CV/Gate, no MIDI)
