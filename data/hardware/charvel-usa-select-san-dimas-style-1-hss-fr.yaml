description: "Charvel's flagship USA Select Series taps straight into
  original-era Charvel DNA for sleek, ferocious models with old-school throwback
  specs: 1980s-style body perimeters, finely shaped neck profiles, fast compound
  radius fingerboards with rolled edges, non-recessed Floyd Rose bridges and
  more."
details: |-
  The USA Select San Dimas Style 1 HSS FR is a flagship USA-made Charvel built around the classic San Dimas Style 1 silhouette with a scalloped lower bout. An alder body pairs with a bolt-on quartersawn maple Speed Neck profile finished in hand-rubbed satin urethane, with rolled fingerboard edges for a comfortable, broken-in feel.

  The maple fingerboard carries a 12"-16" compound radius and 22 jumbo frets over a 25.5" scale, with black dot inlays and a one-way vintage-style bullet truss rod adjustable at the nut. A Floyd Rose Original locking nut (1.6875" wide) anchors a non-recessed Floyd Rose Original double-locking 2-point tremolo with a 37mm block.

  Electronics are an HSS configuration: a DiMarzio Super Distortion DP100F humbucker at the bridge with DiMarzio HS-2 DP116 single-coils in the middle and neck positions, all in black. A single volume knob and 5-position Super Blade switch deliver an unusual range of voicings (bridge, bridge inner coil + middle, bridge inner coil + neck, middle + bridge outer coil, neck).

  Hardware appointments include Charvel-branded die-cast tuners, a Floyd Rose retainer bar, dome-style control knob, side-mount football-style output jack and 4-bolt serialized neck plate, all in black. A Charvel hardshell case (p/n 009-0915-000) is included; an optional gig bag (p/n 299-1414-006) is available.
