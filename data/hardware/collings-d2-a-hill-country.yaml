description: The D2 A Hill Country is a dreadnought acoustic guitar from the
  Hill Country series, designed to push the tonal spectrum toward a strong
  fundamental voice that is both warm and woody. It features an Adirondack
  spruce top with Hill Country scalloped X-bracing and an abbreviated soundboard
  graft, producing a dry character and full low end well suited for bluegrass
  and beyond. East Indian rosewood back and sides complement the Honduran
  mahogany neck and ebony fingerboard for a classic, resonant build.
details: |-
  The D2 A Hill Country (HC) is part of a series that takes the dreadnought format to the far end of the tonal spectrum. Its Hill Country scalloped X-brace with an abbreviated soundboard graft gives the instrument a particularly dry, woody character with a full low end and strong fundamental response. The Adirondack spruce top pairs with East Indian rosewood back and sides, while the Honduran mahogany neck carries an ebony belly-style bridge and ebony fingerboard inlaid with gold mother-of-pearl long diamond and squares. Finished in high gloss ultra-thin nitrocellulose lacquer on a 25 1/2" scale with a 1 3/4" nut width.
specs: |-
  - Body Style: Dreadnought
  - Top: Adirondack spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Inlays: Gold MOP long diamond & squares
  - Scale Length: 25 1/2"
  - Nut Width: 1 3/4"
  - Bridge: Ebony belly-style, 2 5/16" string spacing
  - Bracing: Hill Country scalloped X-brace (abbreviated soundboard graft)
  - Finish: High gloss ultra-thin nitrocellulose lacquer
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
