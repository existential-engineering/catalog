details: |-
  The PS-1 Pro-Shield microphone pop filter from Avantone Pro uses an
  acoustically transparent metal screen rather than traditional fabric or foam.
  This preserves high-frequency detail that softer materials can attenuate,
  while still effectively blocking the bursts of air that cause plosive
  distortion on T, K, and P consonants.

  The curved screen surface is designed to follow the contour of standard
  studio microphone grills, allowing for optimal positioning close to the
  capsule. A padded piping border protects against sharp edges. The 9mm
  flexible gooseneck is both sturdy and adjustable, and the clamp attaches
  to any standard microphone stand or boom arm.

  Because the screen is metal, it can be cleaned and sterilized with soap and
  water — more hygienic than fabric alternatives for shared studio
  environments.
