details: |-
  Inspired by the rich tones of the Bell and Howell Filmosound 385 projector, the reimagined 385 MKII Overdrive offers dynamic, responsive, tube-like drive with simple but effective controls. The MKII adds an A/B switch to toggle between two sets of volume and gain knobs that can be used like a preset to change volume and/or gain for specific parts, as well as a 385+ switch that slams the front end of the circuit for added high-gain saturation. For years, guitarists seeking pure tone have been taking the tube-powered audio sections of vintage film projectors and using them as guitar amps. We fell in love with the unique sound, and were inspired to capture it in a pedalboard-friendly box when we created the original 385 Overdrive pedal. The 385 was developed to have the same simple but effective tone control as its grandfather. While the amp stacks bass and treble behind a single knob, our design separates them, allowing for a much wider array of tones to be achieved. The user is able to boost and cut bass and treble, allowing them to be creative with mid-frequency scoops and bumps. When we released the 385 Overdrive in 2016, it was quickly adopted by guitar players for the amp-like dynamics you could get at lower gain settings. Soon though, players found that cranking the gain produced a distortion-esque drive that was unique to the 385. To accommodate both setups in a single pedal, we added an A/B switch along with a second set of Volume and Gain knobs that share a single set of tone controls. The pedal is internally running at 18v, which helps us nail the same dynamic feel of the amp in a stomp box. This means it is extremely sensitive to how hard you dig in – just like the amp.
