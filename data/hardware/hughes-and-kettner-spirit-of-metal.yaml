details: |-
  Sparkling clean tone that chimes like a glockenspiel. Smoky blues tones with the snarl of a junkyard dog. Lead sounds that wail as seductively as Siren's song. Expansive, enveloping arena rock tones. The malevolent grind of a chainsaw gnawing on heavy metal: iconic sounds such as these have been giving voice to new modes of musical expression and shaping the sound of entire genres for more than 60 years now. The new Spirit Nano Heads from Hughes & Kettner capture the spirit of each era of legendary guitar sounds in three amps with distinctive personalities.

  Don't be fooled by the miniature format. The Spirit Nano belies its diminutive dimensions with the impressive power of a full-fledged power amp rated for up to 50 watts. That's enough to rock even a 4x12" cab. Developed specifically for the Spirit line, the Ultra Response power amp behaves exactly like its tube-based cousins. It always sounds great at every volume and never grates at level, even at full tilt. This little beastie sends every single watt to the speaker, and every watt is translated into impressive sound pressure.

  At the heart of the Spirit Nano amps is the Spirit Tone Generator, a novel bionic design developed by Hughes & Kettner to replicate the analog processes of a tube circuit. This miniature masterpiece distills the essence of tube amps' magical physics and incomparable tone into a compact, strictly analog circuit that promises unbridled playing pleasure.

  You have to drive a conventional output stage very hard for the sound to acquire that magical energy that can not only be heard, but also felt. The Spirit Tone Generator lets you dial in that oh-so-sweet power amp saturation as easily and effectively as on a classic tube amp, but in a far more manageable way. That makes this a creative sound-shaping tool to rival any gain knob.

  The inconspicuous Line Out on the back of the amp feeds the Spirit Tone Generator's unfiltered, purely analog signal to an audio interface's line input via a standard instrument cable, taking full advantage of speaker emulations, microphone modeling, room simulation and effects. The Aux In jack lets players plug in an audio source and jam to backing tracks any time, blending the Aux In signal with the guitar's signal and routing the composite to the front-panel Phones jack in full stereo.
specs: |-
  - Channels: 1
  - Noise Gate (for each channel)
  - Controls: Master, Sagging, Gain
  - Pre Amp: Spirit Technology
  - Power Amp: 25 watts @ 8 ohms (up to 50 watts @ 4 ohms, depending on the speaker cabinet)
  - Dimensions: 9 x 9 x 19 cm
  - Weight: 1.1 kg with power supply, 725 g without power supply
