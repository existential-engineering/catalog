description: Professional-quality miniature cardioid electret condenser lavalier
  microphone designed for speech miking in houses of worship, broadcast,
  presentation, and theater applications.
details: >-
  The RE92L is a miniature cardioid electret condenser lavalier microphone from
  Electro-Voice's RE Series Installation line. It is designed for speech
  reinforcement in houses of worship, broadcast, presentation, and theater
  environments where a discreet, body-worn microphone is required.


  A tight cardioid polar pattern combined with a super-low-noise back-electret
  condenser capsule delivers a wide, smooth frequency response (40 Hz - 20 kHz,
  -3 dB) suitable for natural-sounding speech reproduction with strong
  gain-before-feedback. A 12 dB/octave switchable high-pass filter on the
  in-line preamp helps reduce low-frequency rumble, HVAC noise, and proximity
  effect when needed.


  The miniature capsule (24 mm max diameter, 10.5 mm height) weighs only 0.160
  oz and is finished in non-reflective black with a metal case for unobtrusive
  on-camera and on-stage use. The microphone terminates in a 3-pin XLR connector
  after a 4-foot attached cable and in-line preamp, and requires 24-52 V phantom
  power (6 mA) from a standard mixer or preamp.
specs: |-
  - Transducer type: Condenser (back-electret)
  - Polar pattern: Cardioid
  - Frequency response: 40 Hz - 20,000 Hz (-3 dB)
  - Maximum SPL: 135 dB (1% THD)
  - Impedance (low-Z balanced): 250 ohms
  - Open circuit voltage: 5.6 V
  - Power requirement: 24 - 52 V phantom
  - Current consumption: 6 mA
  - Connector: 3-pin XLR
  - Cable length: 4 feet
  - Maximum diameter: 24 mm
  - Height: 10.5 mm
  - Weight: 0.160 oz
  - Case material: Metal
  - Finish: Non-reflective black
  - Features: Switchable 12 dB/octave high-pass filter, in-line preamp
