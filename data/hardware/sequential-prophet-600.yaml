description: >-
  A six-voice analog polysynth that holds the distinction of being the first
  commercially released synthesizer with MIDI, offering Prophet 5-derived
  circuitry at a more accessible price point.
details: |-
  When the Sequential Circuits Prophet 600 appeared in 1982, it made
  history as the first synthesizer to ship with MIDI connectivity, helping
  to usher in the era of standardized digital communication between
  electronic instruments. Positioned as an affordable alternative to the
  flagship Prophet 5, it delivered genuine analog polyphony with six voices
  and a familiar two-oscillator-per-voice architecture that shared key
  design elements with its celebrated sibling.

  The oscillator section provides saw, pulse, and triangle waveforms on
  both VCOs, with pulse width modulation available on oscillator B. These
  feed into a resonant lowpass filter inherited from the Prophet 5 lineage,
  shaped by a dedicated ADSR envelope. The Poly-Mod section, also carried
  over from the Prophet 5, allows oscillator B and the filter envelope to
  modulate oscillator A's frequency and pulse width as well as the filter
  cutoff, opening up a wide range of timbral possibilities from metallic
  ring-mod effects to complex FM-like tones.

  Practical performance features include a built-in arpeggiator with up,
  down, and up/down modes, along with a two-track real-time sequencer for
  capturing musical phrases on the fly. The 61-key keyboard provides a
  full five-octave range, and later firmware revisions expanded the patch
  memory to 100 storage locations. The overall sonic character is brighter
  and more forward than contemporaries like the Roland Juno-106, lending
  itself well to cutting pad textures, analog effects, swells, and
  sustained drones.

  The Prophet 600 has found renewed interest in recent years, partly due
  to third-party firmware upgrades that unlock expanded modulation and
  improved tuning stability. Artists such as Hardfloor and Eat Static have
  put it to creative use, and its combination of genuine Prophet-family
  sound with an accessible price continues to make it a popular entry
  point into vintage analog polyphony.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 VCOs per voice — VCO A: saw/pulse/triangle, VCO B: saw/pulse/triangle with pulse width modulation
  - LFO: Pulse and triangle waveforms
  - Filter: Resonant lowpass with cutoff, resonance, envelope amount, and keyboard tracking
  - Envelopes: ADSR for filter and amplifier
  - Modulation: Poly-Mod section (oscillator B and filter envelope as sources)
  - Keyboard: 61 keys
  - Arpeggiator: Up, down, and up/down modes
  - Sequencer: 2-track real-time recording
  - Memory: Up to 100 patches (with latest firmware)
  - Connectivity: MIDI
  - Produced: 1982
releaseDate: "1982"
releaseDateYearOnly: true
