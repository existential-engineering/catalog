description: >-
  The Teisco Synthesizer 110F is an early 1980s analog synthesizer manufactured
  by Kawai under the Teisco brand name. It features dual VCOs and a 37-note
  keyboard, serving as an upgraded version of the S60-F model with an updated
  look and expanded sound design capabilities.
details: |-
  The 110F represents Kawai's early synthesizer designs from the beginning of the 1980s. The Synthesizer 110F is an upgraded S60-F, with dual analog VCOs and an updated look.

  The synthesizer offers substantial sound design capabilities with classic analog sawtooth, square, and triangle waveforms plus noise. These can be mixed with external audio routed through its filters and envelopes. The two oscillators support detuning for duophonic textures or fatter leads and bass sounds.

  Modulation and effects options are extensive. The instrument features an LFO which can modulate the VCO and VCF and can trigger the envelope generators, along with a resonant low-pass filter, a high-pass filter, portamento, ring modulator, vibrato, and sample-and-hold functionality. An 8-band filterbank adds further tonal shaping possibilities.

  With lots of blinking lights, a sleek and straightforward layout, and very nice analog bass, lead, and synth sounds, the 110F is a charming piece of early 1980s Japanese analog synthesis.
specs: |-
  - Polyphony: Monophonic/Duophonic
  - Oscillators: 2 VCOs with selectable pitches (2', 4', 8', 16', 32', 64' and low)
  - VCO 1 waveforms: Triangle, sawtooth, square
  - VCO 2 waveforms: Sawtooth, square, plus external audio input
  - Noise: White and pink noise generators
  - LFO: Ramp and square waveforms with adjustable rate
  - Low-pass filter: Resonant with ADSR envelope
  - High-pass filter: Non-resonant
  - 8-band filterbank
  - VCA with ADSR envelope
  - Ring modulator, portamento, vibrato, sample-and-hold
  - Keyboard: 37 keys
  - Memory: None
  - Control: CV/Gate
  - Date produced: 1980
