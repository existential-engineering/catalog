description: >-
  Roland's entry-level keyboard sampler from 1986 offering 12-bit sampling at 30 kHz with 256K of
  internal memory, four multitimbral parts, and a built-in Quick Disk drive for sample storage.
details: |-
  The Roland S-10 was designed as a consumer-grade introduction to sampling technology in the mid-1980s. With its 12-bit, 30 kHz sampling engine and just 256K of internal memory divided across four banks, it offered a maximum of 4.4 seconds of total sample time, or roughly 1.1 seconds per bank. While these specs were modest even by the standards of its day, the S-10 made sampling accessible to musicians who could not afford the professional-grade samplers of the era.

  Storage relied on Roland's built-in 2.8-inch Quick Disk floppy drive, a proprietary format that served its purpose but was far from speedy. The four sample banks doubled as a four-part multitimbral system, allowing users to play, split, and layer different samples across the 49-key velocity-sensitive keyboard simultaneously, providing more musical flexibility than the raw specs might suggest.

  Despite its limited sample time, the S-10 provided a surprisingly capable set of editing tools including sample trimming, looping, reverse playback, tuning, envelope editing, and both high-pass and low-pass filtering. An onboard arpeggiator added further creative potential for turning short samples into rhythmic or melodic patterns.

  The S-10 found a niche among budget-conscious musicians and electronic acts of the late 1980s, with notable use by the dance group D:ream. Its eight-voice polyphony and MIDI connectivity made it a viable addition to a larger studio setup, even if its sampling limitations meant it was better suited to short hits, loops, and textures rather than extended sample playback.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 12-bit, 30 kHz
  - Multitimbral: 4 parts
  - Memory: 256K (4 banks, 4.4 seconds total)
  - Filter: High-pass, low-pass
  - Keyboard: 49 keys with velocity
  - Arpeggiator: Yes
  - Storage: Built-in 2.8" Quick Disk drive
  - MIDI: Yes
