description: The 724ce is a Grand Auditorium acoustic-electric from Taylor's 700
  Series built entirely from select-grade solid Hawaiian koa, delivering bold
  attack with crisp trebles, rich midrange, and a low end that deepens over
  time, with V-Class bracing and ES2 electronics.
details: |-
  The 724ce is part of Taylor's 700 Series featuring all-solid Hawaiian koa for the top, back, and sides — selected for both striking appearance and tonal character. The Grand Auditorium body with Venetian cutaway offers versatility for fingerstyle, strumming, and everything in between.

  V-Class bracing provides improved intonation, sustain, and resonance. The all-koa construction produces bold attack with crisp trebles, rich midrange, and a low end that continues to develop and open with extended play.

  Fountain, Shell, and Mother of Pearl inlays on the West African Crelicam Ebony fretboard, Indian rosewood binding with paua rosette, and Dark Stained Sycamore pickguard reflect premium 700 Series aesthetics. Expression System 2 behind-the-saddle electronics deliver natural amplified tone. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Hawaiian Koa (solid, gloss)
  - Back/sides: Hawaiian Koa (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Binding: Indian Rosewood
  - Rosette: Indian Rosewood / Paua Single Ring
  - Inlays: Fountain, Shell, Mother of Pearl
  - Pickguard: Dark Stained Sycamore
  - Scale length: 25-1/2"
  - Nut width: 1-3/4"
  - Tuners: Taylor Polished Bronze with Polished Bronze Buttons
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
