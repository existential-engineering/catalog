name: "4435A"
manufacturer: genelec
primaryCategory: speaker
url: https://www.genelec.com/4435a
description: "The 4435A joins our Smart IP product line to provide an in-ceiling
  loudspeaker solution of the highest quality, with the added ease of
  installation, system scalability and simple operation of Smart IP's
  single-cable networked technology. Designed for discreet in-ceiling
  installation, the durable and functional 4435A provides exceptional long-term
  value for premium AV installations. The two-way 4435A is delivered with a
  choice of easy-fit round or square grilles in either a black or white finish."
details: |-
  The 4435A is Genelec's two-way active in-ceiling loudspeaker for the Smart IP family, engineered for premium fixed AV installations where audio, control and power all need to travel through a single network cable. Designed for discreet flush mounting, the 4435A pairs a 130 mm cone woofer with a 19 mm metal-dome tweeter to deliver a frequency response of 58 Hz to 39 kHz (-6 dB), a smoother 70 Hz - 20 kHz window (±2.5 dB), and a maximum short-term SPL of at least 104 dB measured on axis in half space. Wide dispersion of 120° horizontal by 100° vertical lets a small number of units cover meeting rooms, breakout spaces, hospitality areas and other ceiling-mounted applications evenly.

  Each loudspeaker carries its own electronics: separate 50 W Class D amplifiers for bass and treble sit directly behind the drivers and are matched to the cabinet via Genelec's active crossover and DSP. Power, audio and configuration arrive over one RJ45 PoE+ link, with an additional balanced analog input on a 10 kOhm Euroblock connector for sites that need a fallback or local source. Power consumption stays low — ≤4 W with Intelligent Signal Sensing (ISS) active and ≤5 W at idle — so dense ceiling deployments don't overwhelm a switch's PoE budget.

  Because every 4435A is individually addressable on the network, system designers calibrate, level-match and group units using Genelec's Smart IP Manager software, then operators run the room day-to-day from the Smart IP Controller app on Android or iOS. AES67 / Dante audio transport means the speaker integrates cleanly with most commissioned AV-over-IP infrastructures, and the same single cable handles firmware updates and health monitoring across the install.

  The cabinet is offered with a choice of round or square grilles, each available in black or white, so the speaker can blend into almost any ceiling treatment. Round and square variants share the same 288 mm exterior face; the round grille fits a Ø 288 mm aperture and protrudes 13 mm from the ceiling, while the square 288 × 288 mm grille sits flush to within 7 mm and uses a slightly shallower 159 mm chassis depth. Minimum installation depth is 162 mm including 10 mm clearance, and each unit weighs 3.5 kg (7.7 lb), keeping ceiling load light enough for standard backbox or tile-bridge mounting.

  As part of Genelec's broader Smart IP range, the 4435A is built around the principle that an installed AV system should sound as truthful and controlled as a studio monitor: matched drivers, room-aware DSP, low-distortion amplification and the same long-term reliability and serviceability the company is known for, packaged for permanent installation rather than the studio rack.
specs: |-
  - Frequency response: 70 Hz - 20 kHz (±2.5 dB)
  - Low cutoff -6 dB: 58 Hz
  - High cutoff -6 dB: 39 kHz
  - Short term max SPL: ≥104 dB (on axis in half space, averaged 100 Hz - 3 kHz at 1 m)
  - Dispersion angles: 120° horizontal, 100° vertical
  - Woofer: 130 mm cone
  - Tweeter: 19 mm metal dome
  - Bass amplifier: 50 W Class D
  - Tweeter amplifier: 50 W Class D
  - Mains voltage: PoE+/PoE
  - Power consumption (ISS active): ≤4 W
  - Power consumption (idle): ≤5 W
  - Audio input: 1 x RJ45 IP network interface (Power over Ethernet and Audio over IP)
  - Audio input: 1 x Euroblock analog input, 10 kOhm balanced
  - Dimensions with round grille: Ø 288 mm (11 3/8 in) x Depth 165 mm (6 1/2 in)
  - Dimensions with square grille: 288 mm x 288 mm (11 3/8 in x 11 3/8 in) x Depth 159 mm (6 1/4 in)
  - Round grille protrusion from ceiling surface: 13 mm (1/2 in)
  - Square grille protrusion from ceiling surface: 7 mm (1/4 in)
  - Minimum installation depth: 162 mm (6 3/8 in), 10 mm clearance included
  - Weight: 3.5 kg (7.7 lb)
