description: Professional closed-back over-ear headphones built for critical
  listening and precise decisions. High Excursion proprietary drivers with a
  ring magnet system deliver detailed mids, tight lows, and honest, revealing
  sound. The closed-back design with memory foam earpads supports extended
  mixing sessions without ear fatigue. Features all-metal hinges and bow,
  foldable construction, pressure-reducing headbow, and a detachable cable. 100%
  serviceable and made in Austria with up to 5 years warranty.
details: |-
  The Hi-X55 is Austrian Audio's professional closed-back over-ear headphone designed for critical listening and studio work. At its core is a 44mm High Excursion Driver using a proprietary ring magnet system, delivering a wide frequency response from 5Hz to 28kHz with sensitivity of 118 dB SPL/V and THD under 0.1% at 1kHz. The 25Ω impedance makes it compatible with a broad range of devices.

  Features all-metal construction for the hinges and bow, memory foam ear and headband pads for comfort during long sessions, and a foldable design for portability. The detachable 3m cable terminates in 3.5mm with a 6.3mm adapter included. 305g without cable. Manufactured in Austria, fully serviceable with up to 5-year warranty.
specs: |-
  - Transducer Type: 44mm High Excursion Driver
  - Frequency Response: 5 Hz – 28 kHz
  - Sensitivity: 118 dB SPL/V
  - THD (at 1 kHz): < 0.1%
  - Impedance: 25 Ω
  - Input Power: 150 mW
  - Weight (without cable): 305 g
  - Dimensions: 200 × 170 × 85 mm
  - Cable: 3 m (detachable)
  - Connector: 3.5 mm (1/8-inch)
  - Adapter included: 3.5 mm to 6.3 mm (1/4-inch)
