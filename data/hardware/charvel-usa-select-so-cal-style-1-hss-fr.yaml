description: "Charvel's flagship USA Select Series taps straight into
  original-era Charvel DNA for sleek, ferocious models with old-school throwback
  specs: 1980s-style body contours, finely shaped neck profiles, fast compound
  radius fingerboards with rolled edges, non-recessed Floyd Rose bridges and
  more."
details: |-
  The USA Select So-Cal Style 1 HSS FR is a flagship USA-made Charvel built around the classic So-Cal Style 1 silhouette. An alder body in a satin finish pairs with a bolt-on quartersawn maple Speed Neck profile finished in hand-rubbed satin urethane, with rolled fingerboard edges for a comfortable, broken-in feel.

  The maple fingerboard carries a 12"-16" compound radius and 22 jumbo frets over a 25.5" scale, with black dot inlays and a one-way vintage-style bullet truss rod. A Floyd Rose Original locking nut (1.6875" wide) anchors a non-recessed Floyd Rose Original double-locking tremolo with a 37mm block.

  Electronics are an HSS configuration: a DiMarzio Super Distortion DP100F humbucker at the bridge with DiMarzio HS-2 DP116 single-coils in the middle and neck positions, all in black. A single master volume knob and 5-way super blade switch deliver five distinct tonal configurations.

  Hardware appointments include Charvel-branded die-cast tuners, a Floyd Rose retainer bar, dome-style control knobs, a top-mount Strat-style output jack, a single-ply black anodized aluminum pickguard, a licensed Fender Stratocaster-design headstock and a 4-bolt serialized neck plate, all in black. A Charvel hardshell case (p/n 009-0915-000) is included; an optional gig bag (p/n 299-1414-006) is available.
