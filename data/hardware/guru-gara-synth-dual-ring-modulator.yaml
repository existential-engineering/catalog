details: |-
  Dual Ring Modulator

  The Dual Ring Modulator Eurorack PCB and Front Panel Kit is a compact DIY module designed for creative audio processing and synthesis experimentation. Built around the versatile LM13700 IC and inspired by its datasheet circuitry, this ring modulator offers straightforward operation with flexible tonal control. Key Features

  Modulation & Sound

  This dual ring modulator produces classic ring modulation effects ranging from subtle amplitude shaping to complex, inharmonic textures. The Symmetry trimmer allows fine adjustment of waveform offset for balanced or intentionally skewed modulation, while the Modulation Amount trimmer controls the intensity and overall gain of the modulation effect. DIY Build & Front Panel

  This DIY Eurorack ring modulator PCB and front panel kit is suitable for beginners and is easy to assemble, making it ideal for learning, experimentation, and educational projects. The front panel is made from durable PCB material and screen printed by hand, giving the finished module a distinctive and cohesive appearance. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
