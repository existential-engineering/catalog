name: Go Vocal
manufacturer: tc-helicon
primaryCategory: preamp
categories:
  - audio-interface
  - vocals
url: https://www.tchelicon.com/en/products/0802-aae
description: Pocket-sized microphone preamp for phones and tablets. A balanced
  XLR input with 48V phantom power and a gain control feed the device over a
  captive four-pole 1/8-inch cable, with a 1/8-inch headphone output for
  monitoring.
details: |-
  Go Vocal connects a standard XLR microphone to a phone or tablet so a rehearsal-room take can be captured on a real capsule rather than the device's built-in microphone.

  A female XLR socket sits on one end of the enclosure, with 48V phantom power for condenser microphones and an indicator LED on the face. A captive cable terminating in a four-pole 1/8-inch plug carries the signal to the mobile device, and a 1/8-inch headphone output beside it returns the device's output for monitoring. The unit draws its power from the connected device.

  A gain control sits on the side of the enclosure, which is small enough to leave in the front pocket of a gig bag.
specs: |-
  - Balanced XLR microphone input
  - 48V phantom power for condenser microphones, with an indicator LED
  - 1/8-inch headphone output
  - Captive cable with a four-pole 1/8-inch plug for the mobile device
  - Gain control
  - Bus-powered operation
