description: A powerful multi-delay pedal with unmatched tone and flexibility.
  The Nemesis does it all, from classic tape and analog inspired sounds to
  modern pitch-shifting and reverse delays.
details: |-
  The Nemesis Delay ADT is a powerful multi-delay pedal offering 26 delay engines in total: 12 accessible onboard via a center selector wheel, with 14 additional delays available through the Neuro App.

  It does it all, from classic tape and analog-inspired sounds to modern pitch-shifting and reverse delays. The pedal provides extensive tone-shaping including high/low cut filtering, diffusion, and distortion controls, plus wow and flutter effects that simulate aging tape.

  Specialized delay types include slapback, reverse, and pitch-shifting variants. Nemesis maintains an analog dry signal path alongside stereo processing and offers tap tempo with freeze control.

  It stores 128 presets (8 onboard, 128 via MIDI) and offers Universal Bypass (true bypass or transparent buffer). Connectivity includes 5-pin MIDI DIN, USB MIDI, MIDI clock sync, and TRS expression via the Neuro Hub.
specs: |-
  - 26 delay engines (12 onboard, 14 via Neuro App)
  - Tape and analog-inspired, plus pitch-shifting and reverse delays
  - Tone shaping: high/low cut, diffusion, distortion
  - Wow and flutter tape aging effects
  - Slapback, reverse, pitch-shift delay types
  - 128 presets (8 onboard, 128 via MIDI)
  - Stereo I/O with analog dry signal path
  - Universal Bypass (true bypass or transparent buffer)
  - Tap tempo with freeze control
  - MIDI PC/CC messages, clock sync
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 4.4" x 2.2"
  - Weight: 1 lb
  - Power consumption: 200 mA (1.8 watts)
