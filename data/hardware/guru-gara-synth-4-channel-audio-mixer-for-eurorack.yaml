details: |-
  4 Channel Audio Mixer for Eurorack Synthesisers (PCB and front panel only for DIY purposes)
specs: |-
  - Format: Eurorack
  - Size: 6HP
  - Skill Level: Beginner / Intermediate
  - This compact and versatile 4-channel mixer offers a straightforward design for combining your audio signals. Featuring four individual channel volume controls and a dedicated master volume, it provides precise control over your mix.
  - Despite its high-density layout, assembly is an accessible and rewarding build for those who approach it with care. It's ideally suited for blending multiple audio sources such as VCOs, noise generators, or VCA outputs into a single, cohesive signal.
  - This unit occupies 6HP in your Eurorack system. For channel volume control, we recommend using standard 9mm vertical potentiometers (often found as knob-less plastic shaft types for a low-profile aesthetic). The included PCB front panel is hand screen-printed, giving each unit a unique and tactile finish.
  - Please note: The current version of this module utilizes PJ301BM type jacks.
