description: The SFT is an Ampeg-inspired foundation overdrive pedal that
  bridges the tone of the Rolling Stones' 'Get Yer Ya-Ya's Out' era and the
  Desert Sound (Stoner rock) era. It features gain stages without cathode
  capacitors and Baxandall tone controls drawn from Ampeg's hi-fi design
  heritage.
details: |-
  The SFT is an Ampeg-inspired foundation overdrive pedal designed to evoke the classic Ampeg amplifier sound, with gain stages without cathode capacitors and Baxandall tone controls. Bridges tones from the Rolling Stones 'Get Yer Ya-Ya's Out' era through Desert Sound (Stoner rock). Supports 9-18V DC operation. Includes a 3-year warranty.
