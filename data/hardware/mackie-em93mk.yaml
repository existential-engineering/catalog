description: Complete Mobile Vlogger Kit for Smartphones and DSLRs.
details: |-
  The EM-93MK is a comprehensive mobile video production solution designed for content creators working on smartphones and DSLRs. The kit eliminates setup complexity by bundling professional-grade components in a portable package suitable for both stationary and on-location use.

  Users receive the EM-93M microphone with dual windscreen options, an adjustable-temperature LED light with diffuser, phone mounting hardware, a gimbal tripod with extension pole, and a custom carrying case.

  The system adapts to various lighting conditions through variable color temperature adjustment and delivers audio clarity across multiple content formats including live streams and vlogs.
specs: |-
  - Ultra-compact EM-93M microphone with dual windscreens (furry and foam)
  - Variable temperature LED video light with LCD display
  - Universal smartphone mount
  - Gimbal tripod with extension pole capability
  - Three cold shoe mounts on LED light
  - Included diffuser for softened lighting
  - Custom carrying case
