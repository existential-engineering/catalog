description: A hand-crafted UK-built Foundation range 8x10 inch bass cabinet
  designed to complement the ABM-EVO IV heads. Built from FSC-approved 18mm
  birch ply and loaded with custom high-powered BlueLine Plus drivers developed
  with Italian speaker maker SICA, each cabinet is tuned to match its drivers
  for maximum SPL and longevity. A bespoke Ashdown HF unit reproduces natural
  bass-guitar highs, and tilt-back heavy-duty casters, a protective kick plate,
  and ply runners aid transport.
details: |-
  Hand-built in the UK, the ABM 810H UK is part of Ashdown's Foundation range, featuring 18mm FSC-approved birch ply and custom high-powered BlueLine Plus drivers developed with Italian speaker manufacturer SICA (lifetime warranty). Each cabinet is tuned to match its drivers for the highest possible SPL and driver longevity, with a bespoke Ashdown HF unit for natural bass-guitar high frequencies. Tilt-back heavy-duty casters, a protective kick plate, ply runners, and T-nutted Allen-key-fitted grills and speakers ease transport and speaker replacement.
specs: |-
  - Power Handling: 1200 Watts continuous / 2400 Watts peak
  - Speaker Configuration: 8 x 10
  - Speaker Outputs: 2 x Speakon combi jack with HF switch
  - Frequency Response: 35Hz - 20kHz
  - Impedance: 4 Ohms
  - SPL: 100dB - 1W @ 1m @ 200Hz
  - Weight: 67 kg
  - Dimensions (H x W x D): 1168 x 609 x 441 mm (inc wheels)
  - Construction: 18mm FSC-approved birch ply, custom BlueLine Plus / SICA drivers
