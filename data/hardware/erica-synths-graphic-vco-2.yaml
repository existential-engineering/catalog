description: Erica Synths Graphic VCO allows you to draw your own waveforms,
  arrange them in wavetables and wavetable banks, morph between two selected
  waves and alter the resulting wave in advanced ways (FXes) – apply FM, phase
  distortion, ring modulation, wavefold/wavewrap, bitcrush.
details: |-
  The Graphic VCO is a waveform designer: custom waveforms are drawn on the module, arranged into wavetables and wavetable banks, and morphed between two selected waves. The resulting wave can then be altered with a set of effects, covering FM, phase distortion, ring modulation, wavefold and wavewrap, and bitcrush.

  Waves, wavetables, effects and other settings can be saved and recalled from memory instantly as snapshots, and 32 classic wavetables are included. The module has two outputs, the main output and an output carrying a configurable suboscillator, which can be tuned from -1 to -24 semitones and detuned within 50 cents.

  The unit runs at a 96kHz sample rate across an octave range of C0 to C8, takes both unipolar (0V to +10V) and bipolar (-10V to +10V) CV, and the panel is skiff friendly.

  Firmware can be upgraded over a miniUSB cable, with a standalone firmware updater available for Windows and macOS and the procedure documented in the user manual.
specs: |-
  - Versatile waveform designer
  - Morphing between two selected waves
  - Wavetable design and wavetable matrix design
  - Waveform alteration: FM, phase distortion, ring modulation, wavefold, wavewrap, bitcrush
  - 32 classic wavetables included
  - Module state saving (Snapshots)
  - Configurable suboscillator output
  - Suboscillator tuning from -1 to -24 semitones
  - Suboscillator detuning +/- 50 cents
  - Skiff-friendly design
  - Firmware upgrade via USB
  - Audio output amplitude 10Vptp
  - Octave range C0 to C8
  - Sample rate 96kHz
  - Unipolar CV input range 0 to +10V
  - Bipolar CV input range -10V to +10V
  - Panel width 16HP
  - Module depth 30mm
  - Power consumption 152mA@+12V, 20mA@-12V
