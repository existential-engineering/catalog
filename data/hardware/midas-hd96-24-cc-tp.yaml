url: "https://www.midasconsoles.com/en/products/0603-AED"
description: 'Live Digital Console Control Centre with 144 Input-Channels, 120
  Flexible Mix Buses, 96 kHz Sample Rate, 21" Touch Screen and Touring Grade
  Road Case. The HD96-24-CC-TP is built around the Graviton Mk 2 processing
  engine with 64-bit floating-point summing, 18 SHARC DSPs, 14 layer boards, 5
  eighth-generation FPGAs, and 2 GPU co-processors. It offers 144 flexi input
  channels, 96 flexi aux outputs, 24 matrices, stereo and mono buses, up to 96
  effects, Channel AI, Flexi-Aux, Variable Channel Phase per channel, True
  Preview and True Audition. The control surface features a 21" full-HD
  multitouch screen supporting up to 10 simultaneous touches, 41 colour LCD info
  displays, 28 motorized 100 mm faders, 66 touch-sensitive rotary controls, and
  an integrated 16-input / 12-output Shout Mixer. Connectivity includes 8 Midas
  microphone preamps, dual AES3 in/out, four AES50 ports (Klark Teknik
  SuperMAC), two HyperMac snake ports on copper (RJ45 XLR) and two on fibre
  (Opticon XLR), two CM1 expansion slots (AES50, DANTE, MADI, USB), two Ultranet
  ports, word clock and AES3 sync, MIDI In/Out/Thru on 5-pin DIN, dual HDMI
  monitor outputs, USB 3.0 / 2.0 hubs and fader-port expansion, and dual IEC
  mains inputs. Supplied with a touring-grade road case.'
details: |-
  The Midas HD96-24-CC-TP is the Touring Package variant of the HD96-24 Control Centre, a flagship live digital console control surface. It is built around the Graviton Mk 2 processing engine providing 64-bit floating-point summing, 144 flexi input channels, 96 flexi aux outputs, 24 matrices, stereo/mono buses, and up to 96 effects, powered by 18 SHARC DSPs, 14 layer boards, 5 eighth-generation FPGAs and 2 GPU co-processors. The control surface uses a 21" full-HD capacitive multitouch display (10-touch) and 41 dedicated colour LCD info strips, 28 motorized 100 mm faders (8+8+8+4), 66 touch-sensitive rotary encoders, and a 16-in/12-out Shout Mixer. Connectivity covers 8 Midas microphone preamps, dedicated talkback and talk XLR inputs, dual AES3 in/out, four AES50 SuperMAC ports, two HyperMac copper snake ports (RJ45 XLR) and two fibre snake ports (Opticon XLR) at 192 channels bi-directional, two CM1 expansion slots (AES50/DANTE/MADI/USB), two Ultranet ports, word-clock and AES3 sync I/O, MIDI In/Out/Thru on 5-pin DIN, dual HDMI monitor outputs, 4 USB 3.0 hub ports plus 4 USB 3.0 fader-expansion ports, 1 USB 2.0 front surface data port, a serial diagnostics port, two 12 V lamp outputs, and dual IEC mains inputs. Audio specs include 24-bit 96 kHz A/D and D/A with 128x oversampling, 1.34 ms surface-to-output latency, +24 dBu non-clip input, +48 V switchable phantom power per input, 106 dB dynamic range, and -100 dB adjacent-channel crosstalk at 1 kHz. The TP variant ships in a touring-grade flight case (43.2 kg surface; 147 kg with case).
specs: |-
  - Input Processing Channels: 144 flexi channels
  - Output Processing Channels: 96 flexi aux outputs, 24 matrices, stereo bus, mono bus
  - Mix Buses: 120 flexible mix buses
  - Point-to-Point Routing Matrix: 622 x 652
  - Signal Processing: 64-bit floating point
  - Processing Engine: Graviton Mk 2
  - DSP: 18 SHARC DSPs
  - Layer Boards: 14
  - FPGAs: 5 eighth-generation FPGAs
  - GPU Co-processors: 2
  - Effects: Up to 96 effects available
  - D/A Converter: 24-bit, 96 kHz, 128x oversampling
  - A/D Converter: 24-bit, 96 kHz, 128x oversampling
  - Sampling Frequency: 96 kHz
  - I/O Latency (Surface Input to Output): 1.34 ms
  - Output Audio Processing: Output 4-band parametric EQ with shelving/HP/LP options; 4-mode creative output dynamics; Insert point on/off with processing order change; Direct input with adjustable level and processing tap-off point
  - Mixing Control Assistance: 12 talk groups; 12 mute groups; 24 surface POPulation groups; 24 VCA associated population groups; Scene snapshot automation
  - Midas Microphone Preamplifier: 8 x XLR balanced
  - Talkback Connector: 1 x XLR balanced
  - Talk Connector: 1 x XLR balanced
  - Headphone Connector: 2 x 1/4" TRS (stereo)
  - Digital AES3 Input/Output (XLR): 2 / 2
  - AES50 Ports (Klark Teknik SuperMAC, 100 Mbit/s): 4
  - Snake (Copper): 2 x HyperMac (192 channels bi-directional digital audio) on RJ45 XLR
  - Snake (Fibre): 2 x HyperMac (192 channels bi-directional digital audio) on Opticon XLR
  - CM1 Expansion Slots: 2 slots (CM1 module for AES50, DANTE, MADI and USB)
  - Ultranet: 2 x Ultranet ports (up to 16 digital outputs per port)
  - Word Clock In: BNC, accepts TTL level, 96 kHz square wave, impedance 75 Ohms
  - Word Clock Out: BNC, provides TTL level, 96 kHz square wave
  - AES3 Sync In: 1 x 3-pin XLR
  - AES3 Sync Out: 1 x 3-pin XLR
  - External (Ethernet) Connector: RJ45 XLR
  - Monitor Output: 2 x HDMI (1920 x 1080p 59.94Hz/60Hz 16:9 & 720 x 480p 59.94Hz/60Hz 16:9 supported)
  - USB 3.0 Type A Hub: 4 x 5 V, 900 mA
  - USB 3.0 Type A (Fader Port Expansion): 4 x 5 V, 900 mA
  - USB 2.0 Type A (Front Surface Data): 1 x 5 V, 500 mA
  - Diagnostics Port: Serial port
  - MIDI: In, Out and Thru 5-pin MIDI DIN sockets
  - Lamp: 2 x 12 V DC, 5 W, 4-pin
  - IEC Mains Socket with Power Switch: 2
  - Surface Input Impedance: 10 kΩ
  - Non-clip Maximum Input Level: +24 dBu
  - Input Gain: Analogue stepped gain -2.5 dB to 45 dB plus -40 dB to +20 dB continuous digital trim
  - Phantom Power (switchable per input): +48 V
  - Talk Mic Impedance: 5 kΩ
  - Talk Mic Gain: +15 dB to +60 dB
  - Talk Mic Max Level: +6 dB
  - Talkback Impedance: 20 kΩ
  - Talkback Gain: -∞ to +10 dB
  - Talkback Max Level: +21 dBu
  - Surface Output Impedance: 50 Ω
  - Surface Output Gain: 0 dB
  - Surface Output Max Level: +21 dBu
  - Dynamic Range: 106 dB, 22 Hz to 22 kHz, unweighted
  - Maximum Voltage Gain: 100 dB inputs to subgroups and masters; 106 dB inputs to aux and matrix
  - Crosstalk at 1 kHz: -100 dB physically adjacent input channels
  - Crosstalk at 10 kHz: -90 dB physically adjacent input channels
  - Fader/Pan Cut Off at 1 kHz: -100 dB
  - Fader/Pan Cut Off at 10 kHz: -100 dB
  - Headphones Output Impedance: 10 Ω
  - Headphones Maximum Output Level: +21 dBu
  - Display Screen: 21" LCD high brightness, 1920 x 1080 px, capacitive touchscreen, up to 10 simultaneous touches
  - LCD Info Displays: 41 x full colour LCD info displays, 24 mm x 24 mm, 240 x 240 px
  - Input Meters: 30 x 12-segment, -35 dBu to +20 dBu
  - Output Meters: 7 x 20-segment, -36 dBu to +21 dBu
  - Channel Comp Meters: 28 x 5-segment, -24 dBu to -1 dBu
  - Channel Gate Meters: 28 x 5-segment, -34 dBu to -5 dBu
  - Comp Meter (Master): 12-segment, -23 dBu to -1 dBu
  - Gate Meter (Master): 12-segment, -34 dBu to -1 dBu
  - Motorized Faders: 100 mm; 8 + 8 + 8 + 4 (28 total)
  - Touch-Sensitive Rotary Controls: 66
  - Fully Assignable Rotary Controls: 28 + 8
  - Fully Assignable Backlit Buttons: 28 + 8 + 12
  - Shout Mixer: 16 inputs, 12 outputs
  - Operating Temperature Range: 5 °C to 45 °C (41 °F – 113 °F)
  - Storage Temperature Range: -20 °C to 60 °C (-4 °F – 140 °F)
  - Dimensions (H x W x D): 352 x 1028 x 719 mm (13.9 x 40.5 x 28.3")
  - Weight Without Flight Case: 43.2 kg (95.0 lbs)
  - Weight With Flight Case: 147 kg (103.6 lbs)
  - Notable Features: Channel AI; Flexi-Aux (aux to aux); Variable Channel Phase per channel; tap-off points at multiple signal-path locations; True Preview; True Audition
