name: Massive Passive EQ
manufacturer: manley
primaryCategory: equalizer
categories:
  - mastering
  - analog
  - rack-mount
  - outboard
url: https://www.manley.com/products/pro-audio/eqs/massive-passive-eq
prices:
  - amount: 6999
    currency: USD
description: The MASSIVE PASSIVE is a two channel, 4-band equalizer, with
  additional high pass and low pass filters. "Passive" refers to the
  tone-shaping section that uses passive components rather than active
  amplification.
details: |-
  Two-channel, 4-band passive tube equalizer with additional high-pass and low-pass filters, hand-built in California.

  Combines metal-film resistors, film capacitors, and hand-wound inductors with all-tube make-up gain stages for natural, musical tone shaping across overlapping bands suitable for mastering and tracking.
specs: |-
  - Two-channel passive tube EQ (3U)
  - 4 overlapping bands per channel with shelf/bell switching
  - 44 frequencies at roughly 1/4 octave spacing
  - Frequency Range: 22 Hz to 27 kHz
  - Boost/Cut Range: ±20 dB maximum
  - Additional high-pass and low-pass filters per channel
  - Tubes (current MANLEY POWER® version): 2 x 5751, 4 x 6922/ECC88
  - Earlier versions: 2 x 5751 or 12AX7; 4 x 6414, 12BH7, or 12AT7
  - Bandwidth: 10 Hz - 70 kHz
  - Frequency Response: -0.1 dB @ 10 Hz, -1 dB @ 60 kHz
  - THD+N: <0.01%
  - S/N Ratio: 116 dB
  - Dynamic Range: 123 dB
  - Max Output: +37 dBv (LF ~+26 dBv)
  - Max Input Level: +21 dBu
  - Input Impedance: 20 kOhm
  - Output Impedance: 150 Ohm
  - Nominal Level: +4 dBu
  - Power Consumption: 44 watts
  - Dimensions: 19"L x 10"W x 5.25"H (3U)
  - Unit Weight: 15.5 lbs
  - Shipping Weight: 26 lbs
