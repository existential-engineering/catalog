description: The CCM663SR ceiling speaker features a woven Aramid Fibre coned
  twin voice-coil 150mm (6in) bass/midrange driver with an offset array of two
  25mm (1in) soft dome tweeters. Thanks to its highly accurate and natural
  sound, Aramid Fibre features on the most advanced Bowers & Wilkins
  high-performance hi-fi speakers and it brings the same qualities to the
  CCM663SR.
details: |-
  CCM663SR is the dual-channel member of the Bowers & Wilkins Performance Series CCM6 in-ceiling range. A single 150mm (6in) woven Aramid Fibre cone bass/midrange driver carries twin voice coils, and an offset array of two 25mm (1in) soft dome tweeters sits alongside it, so one ceiling aperture can reproduce both channels of a stereo feed without losing an audio channel in a room that has space for only one speaker.

  It is a passive design with no amplifier and no mains connection. Two separate sets of red and black spring terminals on the side of the mounting frame accept the left and right speaker cables from an external amplifier, and a switch on the back of the unit selects between STEREO and SURROUND operation. In surround mode the installer connects a single cable to either the left or the right set of terminals and sets that switch to surround, which makes the CCM663SR usable as a dipole-style surround channel in a multi-channel system as well as a single-aperture stereo speaker.

  Unlike the single-channel CCM663, CCM664 and CCM662, the CCM663SR has neither a tilting tweeter nor equalisation options: the manual's tilt and EQ table records both as No for this model. The tweeters are instead fixed in their offset array, which is what gives the model its spread across a wide listening area.

  The speaker is a three-part assembly: a baffle carrying the drive units and crossover, a mounting frame with an integrated bezel, and a magnetically secured grille. The baffle connects automatically through a mating connector as it is pushed into the frame and is held by three push-lock fasteners, while four QuickDog spring clamps pull the frame flush against the ceiling.

  Installation is into conventional stud and sheetrock ceilings, requiring a 202mm (8in) round aperture and at least 140mm (5.51in) of clear depth behind the plasterboard. A cut-out template and a paint mask ship in the carton so the flange and grille can be painted in conventional domestic paint without contaminating the terminals or the grille magnets, and pre-mount kits, back boxes and an optional square grille are offered separately. The drive units create a stray magnetic field, so magnetically sensitive items should be kept at least 0.5m (20in) away; LCD, OLED and plasma screens are unaffected.
specs: |-
  - Drive units: 2x 25mm (1in) soft dome tweeter, 1x 150mm (6in) blue Aramid Fibre cone bass/midrange
  - Frequency range (-6dB): 48Hz to 30kHz
  - Recommended amplifier power: 25W to 80W per channel
  - Sensitivity SPL: 83dB per channel, 89dB both channels driven (2.83V, 1m)
  - Nominal impedance: 8 ohms (4 ohms minimum) per channel
  - Frame diameter: 240mm (9.5in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Dual-channel (twin voice coil) two-way passive in-ceiling speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Connection: two sets of red and black spring terminals (left and right) on the side of the mounting frame
  - STEREO / SURROUND switch on the rear of the unit; in surround mode one cable is connected to either terminal set
  - No tilting tweeter and no equalisation options
  - Required ceiling aperture: 202mm (8in) diameter
  - Required clear depth behind sheetrock: 140mm (5.51in)
  - Construction: baffle (drive units and crossover), mounting frame with integrated bezel, magnetically secured grille
  - Mounting: 4x QuickDog spring clamps; baffle held by three push-lock fasteners
  - Supplied in carton: speaker assembly, cut-out template, paint mask, document pack
  - Flange and grille may be painted with conventional domestic paint using the supplied paint mask
  - Optional square grille available (bezel must be removed)
  - Pre-mount kits and back boxes available for new-build installations
  - Stray magnetic field: keep magnetically sensitive items at least 0.5m (20in) away; LCD, OLED and plasma screens unaffected
  - Finish: White
  - RoHS and WEEE compliant
