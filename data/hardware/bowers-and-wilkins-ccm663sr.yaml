details: |-
  The combination of convenience and performance that is a feature of the entire custom installation range is no better demonstrated than by the CCM663SR ceiling speaker. It marries a woven Aramid Fibre coned twin voice-coil 150mm (6in) bass/midrange driver with an offset array of two 25mm (1in) soft dome tweeters.

  Thanks to its highly accurate and natural sound, Aramid Fibre features on the most advanced high performance hi-fi speakers Bowers & Wilkins makes, and it brings the same qualities to the CCM663SR.

  The twin voice coils and tweeters combine the stereo signal to enable the use of just one ceiling speaker in an installation zone without the loss of one audio channel. The CCM663SR also includes a two-position stereo/surround switch to instantly make the speaker very suitable to be used as a surround channel.

  The speaker is listed as a Performance two-way, dual-channel in-ceiling speaker in a White finish.

  CCM6 Series ceiling speakers install into a cut ceiling aperture using the supplied cut-out template. Speaker cable connects to the spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then lifted into the aperture and held by four QuickDogs spring clamps. The baffle carrying the drivers and crossover fits into the frame on three push-lock fasteners, and the grille is held magnetically. The CCM663SR carries left and right sets of terminals. In surround mode the cable connects to either set, with the switch on the back set to surround.
specs: |-
  - Description: 2-way dual channel in-ceiling system
  - Drive units: 2x ø20mm (1in) soft dome tweeter
  - Drive units: 1x ø150mm (6in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 48Hz to 30kHz
  - Recommended amplifier power: 25 to 80W (per channel)
  - Sensitivity SPL (2.83V, 1m): 83dB (per channel), 89dB (both channels driven)
  - Nominal impedance: 8Ω (minimum 4Ω) per channel
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - Twin voice coil bass/midrange driver, two-position stereo/surround switch
  - Left and right sets of red and black spring terminals on the frame
  - Finish: White
