details: |-
  The EL-8 represents a portable audiophile-grade headphone featuring planar magnetic drivers engineered for superior dynamics and frequency response. Premium faux leather construction combines with sleek contemporary industrial design by DesignWorks (a BMW group company) to deliver both style and durability.

  The lightweight, foldable design enables ultimate portability without compromising sound quality. The headphone incorporates Audeze's patented planar magnetic technology with ultra-thin diaphragms (thinner than human hair) for dramatically reduced distortion and improved imaging.

  Featured innovations include patented Uniforce voice-coil technology for uniform driving force, Fluxor Magnet Arrays for doubled magnetic flux, and Fazor Elements to guide internal soundwaves and prevent resonance.

  The EL-8 Titanium ships with the proprietary CIPHER Lightning cable (24-bit) for iPhone connectivity with integrated DAC/DSP.

  This is a legacy product and no longer available for sale.
specs: |-
