description: Instamic is an ultra-compact recorder that captures flawless 32-bit
  float audio anywhere, even in the harshest conditions.
details: |-
  Instamic is an ultra-compact recorder that captures 32-bit float audio even in the harshest conditions. Dual A/D converters with 32-bit float recording capture every detail, from whispers to roars and everything in between, without clipping or distortion. 32-bit float recording is available in MONO mode only.

  Waterproof construction handles rain, splashes, snow and even full submersion up to 1 meter for 30 minutes, and the IP67 rating keeps out water, dirt and dust. The patented MEMS microphone array delivers a wide signal-to-noise ratio and full-spectrum sound covering 40 Hz to 20 kHz up to 135 dB SPL, in a body measuring only 1.5 x 1 x 0.5 inches.

  A 2.5 ppm internal timecode clock syncs audio and video, with support for Atomos and Tentacle Sync wireless timecode. Instamic also works as a Bluetooth microphone for a phone or computer running iOS, Android, macOS or Windows, so video can be recorded with Instamic audio and no syncing afterwards, and it integrates with third-party apps such as Filmic and Blackmagic Camera.

  The Instamic Remote app for iOS and Android unlocks full feature control for up to 10 units from one device: power on with a tap, monitor live, sync timecode, set input gain or auto-gain, and shape the sound with a 3-band parametric equalizer. Instamic also connects wirelessly to action cameras and syncs its audio to the video with no post production, including the Insta360 One R, One Rs, X2, X3, X4, X5, Ace Pro and Ace Pro 2, the Garmin Virb Ultra 30, and GoPro 12 and GoPro 13.

  The Instamic Pro Plus C comes in stereo/mono and mono models, both with 16 GB of internal storage, enough for about 22 hours of recording in 32-bit float mono. Battery life is about 4.5 hours and the USB-C port makes it easily rechargeable. Three mounting options ship in the box (magnet clip, tape and nano suction tape), and optional color covers let the unit disappear into a scene by matching clothing, a vehicle or the background.
specs: |-
  - Microphones: 4 mics array (Mono model), 4 mics array plus 2 lateral mics (Stereo / Mono model)
  - Polar pattern: omnidirectional
  - Frequency range: 40 Hz to 20 kHz, maximum SPL 135 dB SPL
  - Signal-to-noise ratio: 72 dB(A) / 67 dB(A)
  - File format: WAV, file system FAT16/32
  - Sampling: 48/96 kHz, bit depth 32-bit float / 24-bit, with 32-bit float available in mono mode only
  - Recording media: 16 GB internal memory
  - Recording time: 22 hours 32-bit float mono, 29 hours 24-bit mono, 14 hours dual mono, stereo and mid-side
  - Recording modes: 32-bit float mono and 24-bit mono from the top microphone array, 24-bit dual mono (two independent channels, channel B settable to -9 dB, -15 dB or -24 dB), 24-bit stereo (Stereo model only, from the L and R side microphones), 24-bit MICRO Mid-Side (Stereo model only)
  - Connections: USB-C, wireless Bluetooth Low Energy and Bluetooth Classic
  - Bluetooth modes: high-quality audio monitoring (48 kHz), in-app video and audio recording to the phone (48 kHz), Hands-Free Profile (16 kHz)
  - Bluetooth compatibility: any app supporting Bluetooth audio via Hands-Free Profile (Facebook Live, Instagram Live, Blackmagic Camera, FilmicPro and others), iOS and Android mobile devices, Apple and Windows computers, Insta360 One R, Rs, X2, X3, X4, X5, Ace, Ace Pro and Ace Pro 2, GoPro 12, GoPro 13 and GoPro Max 2
  - Timecode: Atomos (UltraSync Blue Beta), Tentacle (Sync E / Sync E mkII), internal time reference from a mobile device. 2.5 ppm internal clock
  - Power: battery duration 4.5 hours, charging time 1.15 hours over the USB-C connector
  - Waterproof: IP67, 1 m deep for 30 minutes
  - Color: Soft-Touch Matte Black
  - LEDs: battery and charging level (green), VU meter recording level (red), internal storage available (yellow)
  - Weight: 18 grams, dimensions 1.5 x 1 x 0.5 inches (3.8 x 2.5 x 1.3 cm)
  - Dual A/D converters, 32-bit float recording available in MONO mode only
  - Parametric equalizer and manual or automatic input gain, set from the Instamic Remote app
  - Instamic Remote app controls up to 10 units from one device, with live monitoring, master-sync timecode, record lock and rename
  - Factory default settings: manual gain, 10 dB, mono
  - Included mounting options: magnet clip, tape, nano suction tape and quick release clip
  - Instamic Pro Plus Mono does not mount left and right microphones
