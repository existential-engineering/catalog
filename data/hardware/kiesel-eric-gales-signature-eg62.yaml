details: |-
  The Eric Gales Series comes in two different models: the EG61 and EG62. The base model, the EG61, comes with a swamp ash body, Mark Singles, and abalone inlays, while the decked-out EG62 is built with an alder body, Seymour Duncan pickups, and mirror gold inlays and pickguard. This entry is the EG62; the EG61 is a separate entry.

  Both guitars feature Eric Gales' signature inlay, stainless jumbo frets, a GT headstock, and a rosewood fingerboard.

  The EG62 specs listed on the page are an alder body in a satin matte Gold Top finish with bolt-on construction, a tung-oiled roasted maple neck with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, and a deleted truss rod cover.

  Electronics are master volume and tone controls with a 5-way blade-style pickup selector feeding three pickguard-mounted Eric Gales signature Seymour Duncan single coils, over a Gotoh 510 tremolo at .425 inch (10.8 mm) spacing with premium Kiesel locking tuners and gold hardware.
specs: |-
  - Decked-out model of the Eric Gales Series; the base EG61 is a separate entry
  - Construction: bolt-on
  - Body: alder
  - Finish: Gold Top, satin matte
  - Neck: tung-oiled roasted maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: rosewood with 14 inch radius
  - Frets: 22 stainless jumbo, .110 inch wide x .055 inch tall
  - Scale length: 25.5 inch
  - Pickups: 3 pickguard-mounted Eric Gales signature Seymour Duncan single coils
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Bridge: Gotoh 510 tremolo, .425 inch (10.8 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: GT-style inline headstock with drop shadow gold Kiesel logo
  - Inlays: mirror gold Eric Gales signature inlays and standard black-ring Luminlay Super Blue side dots
  - Pickguard: mirror gold
  - Truss rod cover: deleted
  - Hardware: gold
  - Neck width: 1.69 inch wide at the nut, 0.78 inch thick at the 1st fret, 0.88 inch thick at the 12th fret
  - Body dimensions: 39.5 inch long, 1.65 inch thick, 12.5 inch wide
  - Weight: 8 lbs
