description: A stompbox-sized studio-grade compressor and limiter with
  Threshold, Ratio, Attack, Release and Gain controls, a hard and soft knee
  switch, an Auto mode and seven-segment gain-reduction metering.
details: |-
  The Compressor Pro is a stompbox-sized compressor and limiter built in Oklahoma. It is designed to work as a studio compressor rather than a guitar-only pedal, accepting a wide range of input levels with a frequency response and noise floor aimed at studio units.

  The pedal suits recording at home or in the studio, polishing live performances, and protecting amplifiers and speakers from overload. It is intended for any source from voice and guitar to keyboard, bass or drums, and also for spoken-word and video work where consistent levels matter.

  Seven controls shape the compression. Threshold, with a bi-colour LED that turns red when the unit is compressing, adjusts between -50dBu and +10dBu. Ratio runs from no compression at 1:1 up to an infinite ratio for hard limiting. Attack covers 0.15ms to 150ms and Release 0.1s to 3s. Gain provides up to 20dB of make-up gain without touching the compression controls. A Knee switch chooses between hard-knee compression and a softer curve that keeps parts lively and avoids the phase issues of parallel or blend-style compression, and an Auto switch hands attack and release times to program-dependent detection.

  Metering is a seven-segment LED display reading gain reduction from -1dB to -20dB, driven by an exact RMS detector that senses the true RMS value of the input. The pedal is true bypass, with no tone or signal loss when off.
