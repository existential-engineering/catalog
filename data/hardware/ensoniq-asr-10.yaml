description: >-
  The Ensoniq ASR-10 is a 16-bit sampling workstation with 31-voice polyphony, a built-in
  effects processor with vocoder, and a 16-track sequencer, widely adopted in hip-hop
  production.
details: |-
  The ASR-10 (Advanced Sampling Recorder) functions as a complete digital music production studio, combining deep sampling capabilities with synthesizer architecture inherited from Ensoniq's classic synth line. Supporting up to 127 WaveSamples with eight layers per program, it offers sigma-delta 64x oversampling 16-bit sampling at rates of 30kHz or 44.1kHz.

  Sound shaping is handled by dual multimode digital filters with lowpass and highpass modes at selectable 6, 12, 18, and 24dB per octave slopes. Three envelope generators control pitch, filter cutoff, and amplitude independently. An LFO and noise generator add further modulation options. The integrated effects processor provides 50 to 62 effects including reverb, chorus, flange, phaser, distortion, delay, speaker simulation, and a vocoder.

  A 16-track sequencer supports up to 80 patterns with a 999-measure limit, while the Tape Recorder mode enables two-track audio recording to RAM or external SCSI hard drives via the optional SP-3 interface, supporting up to seven simultaneous drives and CD-ROMs. The keyboard version offers 61 velocity and aftertouch-sensitive keys, while the ASR-88 variant provides 88 weighted keys. With 2MB of RAM expandable to 16MB and 8-part MIDI multitimbrality, the ASR-10 became a staple of hip-hop production, used extensively by Timbaland, Kanye West, and Pharrell Williams.
specs: |-
  - Polyphony: 31 voices
  - Sampler: Sigma-Delta 64x oversampling, 16-bit
  - Sampling Rates: 30kHz or 44.1kHz variable
  - WaveSamples: 127 total, up to 8 layers per program
  - Filters: 2 digital (1 lowpass, 1 highpass) with 6, 12, 18, 24dB/oct slopes
  - Envelopes: 3 (pitch, filter, amplitude)
  - Sequencer: 16 tracks, 80 patterns (999 measure limit), 1 song
  - Effects: 50-62 effects including vocoder
  - Keyboard: 61 keys with velocity/aftertouch (88 weighted on ASR-88)
  - Memory: 2MB expandable to 16MB; 8 instruments
  - Control: MIDI (8-part multitimbral)
releaseDate: "1992"
