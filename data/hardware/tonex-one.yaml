description: "Ultra-compact AI-powered tone modeler that puts hyper-realistic
  modeled amps, cabs and stomps on any size pedalboard using IK Multimedia's AI
  Machine Modeling technology."
details: |-
  TONEX ONE puts IK Multimedia's revolutionary AI Machine Modeling technology on any size pedalboard, enabling performers to use the world's most sought-after tones in an ultra-compact format. The device stores up to 20 hyper-realistic modeled amps, cabs and stomps from a nearly infinite supply, and users can load models of their own gear captured with the included TONEX software.

  The compact design provides easy access to all major controls on stage, featuring a main knob for volume and gain, LED micro-knobs for EQ, noise gate, compressor and reverb, and a footswitch supporting two performance modes plus a built-in smart tuner. Customizable LED colors with 9 options allow quick visual identification of presets during live performances.

  TONEX ONE connects to any type of guitar or bass rig including real amps, PA systems and FRFR (Full Range, Flat Response) cabs. Two performance modes are available: Stomp mode for on/off switching, and Dual A/B mode for switching between two presets. The device features VIR multi-IR cabinets plus a custom IR loader for cabinet simulation.

  Studio-grade effects are built in, including 6 stereo reverbs, compressor, noise gate, 3-band EQ, 5 modulation types, and 2 delay types configurable via the editor software. The unit doubles as a USB-C audio interface for recording electric guitar or bass on Mac or PC at 24-bit/44.1 kHz.

  The hardware features 24-bit/192 kHz ultra-low noise converters with up to 123 dB dynamic range and a 5 Hz to 24 kHz frequency response. Over 250 premium tone models are included, with more than 56,000 additional models available on the ToneNET community. Included software comprises TONEX SE, TONEX Editor, and AmpliTube 5 SE.
specs: |-
  - Ultra-low noise 24-bit/192 kHz converters
  - Frequency response: 5 Hz - 24 kHz
  - Dynamic range: up to 123 dB
  - USB audio interface: 24-bit/44.1 kHz
  - 20 customizable presets
  - 250+ premium tone models included
  - 6 stereo reverbs, compressor, noise gate, 3-band EQ
  - 5 modulation types, 2 delay types
  - VIR multi-IR cabinet emulation with custom IR loader
  - Dimensions: 48 x 94 x 53 mm (1.89" x 3.7" x 2.09")
  - Weight: 160 g (5.6 oz)
  - Power: 9V DC, 120 mA or USB-C powered
