details: |-
  The Plasma Rack is a high voltage distortion 1U rack. It distorts the audio signal by transforming it into a visible high voltage electric discharge in a xenon tube. The wide frequency spectrum works well with various sound sources, and the rack has a gritty distortion with carefully designed controls. The naturally occurring noise gate effect interacts with the VOLTAGE knob and the input level, which combined with the DRY/WET mix knob makes the Plasma Rack suited to drum machines and FX tracks.

  Modulating the xenon lamp creates tremolo and ring modulation sounds. The CLEAN GATE effect adds the signature Plasma gating effect to the clean signal. The SUSTAINER circuit allows sputtery broken sounds to be dialled in without losing sustain. The OVERSATURE circuit overloads the tube, adds upper harmonics and changes the dynamic response. Together with the unit's I/O and full MIDI implementation, this makes for a powerful post-production machine.

  Distortion characteristics: the harmonic artifacts created as a byproduct of the high-voltage discharge are uncommon in traditional signal amplification. The Plasma Rack produces a large amount of non-linear harmonic saturation that causes extremely rich and responsive attacks and brings out screeching sharp overtones and harmonics. The way the Plasma tube reacts with different instruments and sound sources cannot be recreated with another analog machine, a plug-in or digital modeling. The scope of distortion intensity goes from sputtery broken sounds to full saturation and sustain, all the way to totally oversaturated tones. The level of distortion is controlled with the INPUT GAIN and VOLTAGE knobs, and the OVERSATURE mode overpowers the Plasma tube to enhance upper harmonics and overtones.

  Natural noise gate and CLEAN GATE: when the input level drops below the Plasma lamp's voltage threshold, the electrical discharge within the gas-filled tube is interrupted. This creates a gating effect unique to the Plasma distortion and a large part of its flavour. The extremely fast gate creates sputtering sounds with each attack and release of a sound, and creates strong contrasts between sounds, so it works well with beats and drum tracks. The gating effect interacts with INPUT GAIN and VOLTAGE, and the SUSTAIN mode prolongs the sustain at low VOLTAGE settings, where the gate threshold is high.

  CLEAN GATE applies the Plasma gating to the dry signal even when the distorted wet signal is not mixed in. This allows the same sputtering gate sounds to be used as a texture without distorting the signal, which has a wide range of applications such as crushing drums, removing sustain from cymbals or adding a flickering quality to melodic lines.

  Tremolo and ring modulation: the Plasma Rack features a tremolo section that affects both the dry and the wet signals, in or out of phase. The tremolo is achieved by modulating the Plasma tube, and its speed goes into ring modulation territory. The tremolo rate and ring modulation frequency can be controlled with a MIDI CC message and an expression pedal. The effect also has an envelope follower, which allows the tremolo and ring modulation depth to be controlled with the input level. The tremolo section interacts with the CLEAN GATE effect, so the flickering Plasma gate can be added to the clean sound at the rate of the tremolo.

  Signal routing: the Plasma Rack has balanced and unbalanced I/O and works with both instrument and line level signals. It is a mono unit, however it is designed to work in a master/slave configuration for stereo signal processing. There are three effect loops in different parts of the signal chain, which also work with both instrument and line level signals.

  Workflow: the signal processing is fully analog, but the parameters can be digitally controlled. The unit has a full MIDI implementation, each parameter can be controlled with MIDI CC and PC messages, and the rack has eight user preset slots plus a default boot-up preset and settings. The expression pedal input can be rerouted to any parameter and saved on a global or per-preset basis.
