url: https://www.chasebliss.com/reverse-mode-c-2025
description: A multidirectional delay pedal made with Empress Effects, featuring
  three distinct echo voices that move in different directions — forward,
  backward, and up — with six modulation types, a built-in sequencer, and
  advanced MIDI/CV/expression connectivity.
details: |-
  Reverse Mode C is a multidirectional delay made in collaboration with Empress Effects. Three echo voices move in different directions — forward, backward, and up — creating a unique spatial delay experience.

  Six modulation types are available: frequency shifting (x2), vibrato, chorus, tremolo (x2). A built-in sequencer provides dynamic control over stereo patterns.

  Internal modulation is assignable to any or all knobs. DIP switches on the rear panel allow further customization. Tap tempo with external tap input is supported.

  The pedal includes 2 onboard presets, trails mode, true bypass, analog dry thru, and mono splitting option. Part of the Small Batch Bliss collection made for Chase Bliss's 10th anniversary.
specs: |-
  - Three echo voices: forward, backward, up
  - Six modulation types
  - Built-in sequencer
  - Stereo I/O
  - 2 onboard presets
  - Tap tempo with external tap input
  - Trails mode and true bypass
  - Analog dry thru
  - MIDI: Program Change, CC, Clock Sync
  - CV and Expression control
  - DIP switches for customization
  - Power: 9V DC Center Negative, ~270mA
