description: Reverse Mode C is a fantastical mix of motion and space, an echo effects pedal composed of multiple distinct voices that move in different directions (forward, backward, and up) that you can blend, isolate, and sequence, all glued together by colorful modulation.
details: |-
  Reverse Mode C is a multidirectional delay pedal made in collaboration with Empress Effects. It contains three distinct echo voices, each moving in a different direction (forward, backward/reverse, and up/octave), that can be isolated, combined, and sequenced to create reflections that shift in all directions and span the stereo field. It is a tribute to a special mode found on the Empress Superdelay, released in 2008, made for Chase Bliss's 10th anniversary.

  Six varieties of modulation are available and can be pushed into audio rate, synced to the delay time or left free-running: frequency shifting (x2), vibrato, chorus, and tremolo (x2). A built-in sequencer cycles between the different voices to create rolling echoes and a shifting stereo image, either running continuously in sync (RUN mode) or triggered by playing dynamics (ENV, envelope-controlled mode).

  The pedal offers true stereo in and out, including mono-to-stereo splitting (MISO) and hard-panned stereo spreading (SPREAD) via rear dip switches. Internal modulation can be assigned to any or all of its knobs, and further customization (SWAP, REST/SKIP, FEED TYPE, FADE TYPE, LATCH) is available through hidden options and dip switches.

  Connectivity includes MIDI (via a Chase Bliss Midibox, for Program Change, CC, and clock sync), CV control, expression control, and external tap tempo, alongside 2 onboard presets, standard tap tempo, trails mode, analog dry-thru, and true bypass.

  Reverse Mode C is the first pedal in the Small Batch Bliss collection: a made-to-order line of special-edition pedals with no cap on quantity, sold only during a month-long preorder window.
specs: |-
  - Three echo voices: forward, reverse, and octave (up/down)
  - Six modulation types: frequency shifting (x2), vibrato, chorus, tremolo (x2)
  - Built-in sequencer (RUN / OFF / ENV)
  - True stereo in and out, with mono-to-stereo splitting (MISO) and stereo spread
  - 2 onboard presets
  - Tap tempo, plus external tap input
  - Trails mode
  - Analog dry thru
  - True bypass (mode dependent)
  - MIDI (Program Change, CC, clock sync) via Chase Bliss Midibox
  - CV control and expression control
  - Maximum delay time: 4.19 seconds (8.38 seconds at half sample rate)
  - Power: 9V DC, center negative, ~270 mA
