description: Reverse Mode C is a fantastical mix of motion and space. It's an
  echo effects pedal composed of multiple distinct voices that move in different
  directions, forward, backward, and up, that you can blend, isolate, and
  sequence, all glued together by some very colorful modulation.
details: |-
  Reverse Mode C is a multidirectional delay pedal made in collaboration with Empress Effects. It contains three different echo voices, each moving in a different direction (forward, reverse, and up/down reverse octave), that can be isolated, combined, and sequenced to create unique reflections that shift in all directions and span the stereo field, tied together by flexible modulation that can be synced or drifting.

  It is a tribute to a special mode found on the Empress Superdelay, released in 2008. Empress Effects' Superdelay was a sandbox of echoes, loops, and textures, and was a huge inspiration for Chase Bliss's approach; for their 10th anniversary, Chase Bliss teamed up with Empress to make a tribute to its most exciting mode.

  Six varieties of modulation are available and can be pushed into audio rate, synced to the delay time, or left free-running: frequency shifting (x2), vibrato, chorus, and tremolo (x2). A built-in sequencer cycles between the different voices to create rolling echoes and a shifting stereo image, either running continuously for an additional layer of synced motion or controlled by playing dynamics.

  The pedal offers true stereo in and out (mono and mono-to-stereo also supported), and features advanced connectivity and customization including MIDI, CV and Expression control, presets, and internal modulation of any or all of its knobs.

  Reverse Mode C is the first pedal in Chase Bliss's Small Batch Bliss collection: a made-to-order line of special edition pedals with no limit or selling out, available to order within a month-long preorder period.
specs: |-
  - Three echo voices: forward, reverse, and up/down reverse octave
  - Six modulation types: frequency shifting (x2), vibrato, chorus, tremolo (x2), pushable to audio rate
  - Modulation syncable to delay time or free-running
  - Built-in voice sequencer (RUN / OFF / ENV modes)
  - True stereo in/out (mono and mono-to-stereo supported)
  - 2 onboard presets
  - MIDI (Program Change, CC, clock sync) via 1/4-inch TRS jack
  - CV control and expression control
  - External tap tempo (shares MIDI jack)
  - Onboard tap tempo
  - Trails mode
  - Analog dry thru
  - True bypass (mode dependent)
  - Power: 9V DC, center negative, ~270 mA
