description: Designed to inspire and with four decades of experience, the
  Charvel Pro-Mod So-Cal Style 1 HSS FR is a slick performer with modern
  features and versatile sound every guitarist will appreciate.
details: |-
  The Pro-Mod So-Cal Style 1 HSS FR E pairs an alder So-Cal Style 1 solid body with a gloss finish. The bolt-on maple neck features graphite reinforcement and a hand-rubbed satin urethane finish. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Seymour Duncan Distortion TB-6 humbucker in the bridge position, a Seymour Duncan Flat Strat SSL-6 single-coil in the middle, and a Seymour Duncan Custom Flat Strat SSL-6 RWRP single-coil in the neck position. Controls include a volume knob, a no-load tone control (transparent at position 10), and a 5-position blade switch.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo, Charvel-branded die-cast tuning machines, knurled flat-top control knobs, and a 1-ply black pickguard in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build.
