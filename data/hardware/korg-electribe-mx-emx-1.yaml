description: >-
  The Korg Electribe MX (EMX-1) is a professional dance music production station combining
  a synthesizer, drum machine, and sequencer in a sturdy metal chassis. It features MMT
  (Multi Modeling Technology) synthesis with sixteen oscillator algorithms, vacuum tube
  circuitry for analog warmth, and extensive real-time performance controls. Released in
  2003, it represented a significant upgrade over earlier Electribe models with expanded
  sound design capabilities and motion sequencing.
details: |-
  The Electribe MX employs Korg's MMT (Multi Modeling Technology) synthesis engine with sixteen distinct oscillator algorithms, ranging from analog modeling to additive, PCM, chord, unison, wave shaping, and formant synthesis. The built-in PCM library provides 207 drum sounds and 76 synth waveforms at 16-bit, 44.1 kHz resolution. Users can create up to nine drum parts, five synth parts, and two accent parts across sixteen total voices, each with dedicated LFO and envelope generator modulation.

  A newly designed filter section offers four modes: Low Pass, High Pass, Band Pass, and Band Pass Plus. Three simultaneous stereo effect processors provide sixteen effect types including reverb, delay, flanger, chorus, talking modulator, grain shifter, and decimator, with each part independently routable to any processor. Effects can be linked in series using the Chain function for more complex processing.

  Two vacuum tubes implement Korg's Valve Force Circuitry, adding analog warmth and harmonic richness through a dedicated tube gain knob. This gives the EMX-1 a distinctively warm and present character that sets it apart from purely digital grooveboxes.

  The sequencer supports 256 patterns with up to 128 steps per part, and 64 songs combining patterns, mute data, and knob movements. Motion Sequencing captures real-time knob tweaks with up to 24 motion sequences per pattern, enabling complex parameter automation during performance. A ribbon controller and slider provide real-time arpeggiator access, while SmartMedia card storage enables quick data backup and transfer.
specs: |-
  - 16-voice polyphony
  - 16 parts: 5 synth, 9 drum, 2 accent
  - MMT synthesis with 16 oscillator algorithms
  - 207 PCM drum sounds, 76 synth waveforms (16-bit, 44.1 kHz)
  - 4 filter modes: Low Pass, High Pass, Band Pass, Band Pass Plus
  - 3 stereo effect processors with 16 effect types
  - 2 vacuum tubes (Valve Force Circuitry)
  - 256 patterns (192 pre-loaded), up to 128 steps per part
  - 64 songs, up to 256 patterns per song
  - 24 motion sequences per pattern
  - 16 velocity-sensitive pads
  - Ribbon controller and slider
  - SmartMedia card slot (4-128 MB, 3V)
  - Auto BPM detection and Tap Tempo
  - MIDI In, Out, Thru
  - Back-lit LCD display
  - Sturdy metal chassis
