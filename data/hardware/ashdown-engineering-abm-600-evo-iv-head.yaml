description: The Ashdown ABM EVO IV is a 600W bass head building on more than
  two decades of the ABM range. It features Variable Valve Drive Plus for
  clean-to-overdriven tones, a new 9-band EQ with precision controls, and an
  Input VU meter to streamline setup. Beloved ABM features carry over, including
  the one-knob Dynamic Compressor and the Sub-Harmonic Generator. Professional
  connectivity (tuner output, transparent FX loop, line input) plus flexible
  footswitching of Valve Drive, Compression, EQ, and Sub-Harmonic Generation
  make it stage- and studio-ready.
details: |-
  The ABM EVO IV is a 600W bass amplifier head. Variable Valve Drive Plus delivers an array of clean-to-overdriven tones, and a new 9-band EQ with precision controls shapes the sound. An Input VU meter aids gain setup. The one-knob Dynamic Compressor and Sub-Harmonic Generator add depth and character. Connectivity includes a tuner output, a transparent FX loop, and a line input, with flexible footswitching of Valve Drive, Compression, EQ, and Sub-Harmonic Generation.
specs: |-
  - Power Output: 600W
  - EQ: 9-band
  - Variable Valve Drive Plus
  - One-knob Dynamic Compressor
  - Sub-Harmonic Generator
  - Input VU meter
  - Footswitchable: Valve Drive, Compression, EQ, Sub-Harmonic Generator
