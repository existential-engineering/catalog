description: A passive dual CV/expression attenuator with normalled inputs that
  doubles as a passive mult, letting you tame modular-level signals before
  feeding them into expression or CV inputs on pedals.
details: |-
  Less & Less uses a linear 50k potentiometer to attenuate CV or expression signals.
  Both inputs are fully normalled so a signal on either input is distributed to both
  outputs at the dialled-in strength, effectively making it a passive buffered mult.

  Useful for getting LFOs and modular signals to behave politely with pedal
  expression inputs. Passive, no power required. Two 1/8" inputs and two 1/8"
  outputs on the right panel.
specs: |-
  - Uses a linear 50k potentiometer
  - Passive, no power required
  - Both inputs fully normalled (passive mult)
  - Enclosure dimensions: 3.6" x 1.5"
  - Made in Hull, Québec
