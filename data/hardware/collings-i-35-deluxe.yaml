description: The I-35 Deluxe is a semi-hollow electric guitar built as a modern
  tribute to the heritage of the double cutaway semi-hollow electric guitar. It
  features all-solid tonewoods including a Honduran mahogany body with a premium
  flamed maple top and maple center block. Lollar Low Wind Imperial humbuckers
  and 50s-style wiring deliver warm, articulate tone, while appointments like
  grained ivoroid binding and a high-gloss nitrocellulose lacquer finish reflect
  Collings' commitment to craftsmanship.
details: |-
  The Collings I-35 Deluxe is a semi-hollow double cutaway electric guitar that honors the classic heritage of the form while incorporating modern construction refinements. The body is crafted from Honduran mahogany with a premium flamed maple top and an internal maple center block for feedback resistance and sustain. The neck is also Honduran mahogany, joined to the body via an extra-long mortise & tenon joint, and topped with a rosewood fingerboard featuring a 12" radius and mother-of-pearl dot inlays. The 24 7/8" scale length and 1 11/16" nut width offer a comfortable playing feel. Electronics consist of Lollar Low Wind Imperial humbuckers wired in the vintage 50s style, with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware includes a Kluson ABR-1 nickel-plated bridge, Kluson stop tailpiece, and Gotoh tuners with the Collings logo. Appointments include grained ivoroid binding on the body, fingerboard, and peghead, custom ivoroid pickup rings and truss rod cover, an ebony peghead veneer with mother-of-pearl logo, and a high-gloss nitrocellulose lacquer finish. Comes with a deluxe hardshell case.
specs: |-
  - Body: Honduran mahogany semi-hollow with maple center block
  - Top: Premium flamed maple
  - Body Width: 15"
  - Body Length: 17 5/8"
  - Body Depth: 1 5/8"
  - Total Length: 40"
  - Neck: Honduran mahogany
  - Neck Joint: Extra-long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Nut Width: 1 11/16"
  - Scale Length: 24 7/8"
  - Frets: Medium 18% nickel-silver
  - Inlays: Mother-of-pearl dots
  - Pickups: Lollar Low Wind Imperial humbuckers
  - Wiring: 50s-style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Custom grained ivoroid
  - Bridge: Kluson ABR-1 (nickel-plated)
  - Tailpiece: Kluson stop tailpiece
  - Tuners: Gotoh with Collings logo (nickel)
  - Binding: Grained ivoroid (body, fingerboard, peghead)
  - Pickup Rings: Custom ivoroid
  - Truss Rod Cover: Custom ivoroid
  - Peghead Veneer: Ebony with mother-of-pearl logo
  - Peghead Profile: Haircut
  - Finish: High-gloss nitrocellulose lacquer
  - Case: Deluxe hardshell case included
