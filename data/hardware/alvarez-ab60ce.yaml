details: |-
  The AB60ce is a medium-scale acoustic bass designed to deliver a powerful,
  sonorous punch so clearly audible in acoustic ensembles. It is part of the
  Alvarez Artist Series, which represents a commitment to quality and care through
  meticulous design in bracing, voicing, and overall construction.

  The AB60ce is fitted with the LR Baggs StagePro Bronze, delivering wonderfully
  warm and full bass frequencies when plugged in. The StagePro Bronze is a
  small-footprint side-mounted EQ incorporating the renowned LR Baggs Element
  under-saddle pickup, featuring a large backlit tuner, volume, bass and treble
  controls, and phase. The battery box is built into the end pin jack compartment
  for easy access with a simple push to open and change batteries.

  The FST2 bracing finds the perfect harmony between rigidity and vibration,
  allowing the top to be both driven and controlled by the air volume this guitar
  creates. Delivering both balance and liveliness, the symmetry is inspiring for
  every player.

  Alvarez Artist Series guitars feature all-solid wood tops that go through the
  ATR (Advanced Tonal Response) curing process — a form of torrefaction using
  oxygen-controlled, vacuum curing at special temperatures to remove moisture and
  volatiles, enhancing wood stability and improving resonance.

  Every component of the AB60ce — from the bi-level Indian Laurel bridge to the
  solid bridge plates and neck block — is carefully considered to deliver the best
  response possible from solid-top construction.
