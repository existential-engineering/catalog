description: This boutique pedal shares many of the patented features and the build-quality of its Direct Drive cousin.
details: |-
  Building on the success of the MDD Machine Direct Drive Pedal, the MCD Machined Chain Drive Pedal is a boutique pedal that shares many of the patented features, industrial design and build-quality of its Direct Drive cousin. The most striking difference is an Adjustable, Sprocket-Less Cam that incorporates a gear shift-style lever. The lever allows players to quickly shift between the most popular chain-drive cam settings, and is easily accessible when mounted to a bass drum.

  DW Director of R&D, Rich Sikra, explains, "We knew this would be the next logical step when we were introducing the MDD pedals. So many of our artists absolutely love their 9000 pedals, but they're also enamored with the form and function of DW MFG. Plus, we knew that the direct drive feel wasn't for everyone. It's been a really fun and challenging project for the R&D team."

  Other notable features include a racing-style, all-aluminum, perforated footboard with matching, contoured heel plate, Tri-Pivot Swivel Toe-Clamp, V.E.R.T. Vertical Spring Adjustment, Control Weight/Impact Beater and more.

  The Shift Adjustable Cam adjusts between Accelerator and Turbo cam geometry, or anywhere in between. VERT Vertical Tension Adjustment is a patented feature that allows players to vertically tweak spring tension with the turn of a single Allen screw, and the Direct-to-Cam Spring Rocker tracks every pedal stroke through a threaded bearing connection.

  A DW MFG Lux Leather pedal bag is included: a soft faux leather bag with reinforced zippers, stitching, handle, and embroidered DW MFG logo, with an accessory pocket for extra beaters, drum keys, and other necessities.
specs: |-
  - Adjustable, Sprocket-Less Cam with Gear Shift-Style Lever
