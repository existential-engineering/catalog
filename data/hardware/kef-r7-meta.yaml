  - MF Driver: 125mm aluminium cone (Uni-Q)
  - LF Drivers: 2× 165mm hybrid aluminium cone
  - Crossover: 400Hz, 2.4kHz
  - Frequency Range (-6dB): 33Hz–50kHz
  - Frequency Response (±3dB): 48Hz–28kHz
  - Sensitivity: 88dB (2.83V/1m)
  - Nominal Impedance: 4Ω (min. 3.2Ω)
  - Maximum Output: 111dB
  - Amplifier Requirements: 15–250W
  - Dimensions (H×W×D): 1062×200×384mm (without plinth)
