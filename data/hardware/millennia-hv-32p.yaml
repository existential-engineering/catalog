description: The HV-32P is a portable two channel microphone preamplifier with
  continuously variable gain, a selectable DC coupled ribbon microphone path and
  48V phantom power. It runs on 12V to 15V DC from the included universal
  voltage line supply.
details: |-
  The HV-32P puts two channels of the HV-3 microphone preamplifier circuit in a small portable chassis measuring 5.67 inches wide by 1.69 inches high by 8.19 inches deep and weighing 3 pounds shipped.

  Each channel has continuously variable gain from 14.5 dB to 60 dB, dropping to 1 dB with the pad engaged, and a selectable DC coupled ribbon microphone path adds a 10 dB boost for a 70 dB maximum. A 14 dB pad and 48V phantom power are provided.

  The unit operates on 12V to 15V DC, and a line lump power supply with a 12V output that accepts 90V to 240V AC is included, so it travels without a voltage selector.

  Frequency response is quoted from below 10 Hz to above 200 kHz at the -3 dB points, equivalent input noise is -130 dB, and total harmonic distortion plus noise is typically under 0.001 percent. Rated operating range is 0 to +40 degrees C at 10 to 80 percent relative humidity up to 3,000 meters.
specs: |-
  - Minimum Gain: 14.5 dB, 1dB with Pad
  - Maximum Gain (continuously variable): 60 dB (70 dB in Ribbon Mode)
  - Frequency Response (-3 dB): < 10 Hz to > 200 kHz, typical -1.0 dB @ 10 Hz, typical -1.5 dB @ 200 kHz
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -130 dB EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +24 dBu Out): < .003%, Typical < .001%
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain): < .0006% +12 dBu Out, < .001% +20 dBu Out
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +24 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +12dBu @ 0.02% THD+N, +18dBu @ 0.02% THD+N with pad
  - Maximum Output Level (1 kHz @ 35dB of gain): THD+N < 0.001% at +26dBu output, < 0.05% at +28 dBu output
  - Phantom Input Impedance (1 kHz): 2,210 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - Phantom Powering: 48V dc +/- 2V dc
  - Power: 12VDC to 15VDC operation, 90VAC to 240VAC line lump power supply (12V output) included
  - Dimensions/Shipping Weight: 5.67" W x 1.69" H x 8.19" D, 3 lbs.
  - Environmental: 0 to +40 C / +32 to +104 F, 10% to 80% RH, maximum altitude 3,000 meters
