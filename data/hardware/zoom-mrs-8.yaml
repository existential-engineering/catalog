description: The MRS-8 combines an 8-track SD card recorder, effect device,
  digital mixer, and drum/bass machine in a single compact unit.
details: |-
  The MRS-8 MultiTrak Recording Studio puts four functions in one compact unit: an 8-track SD card recorder, an effect section, a digital mixer, and a drum and bass machine. It runs on four AA batteries or the ZOOM AD-0006 adaptor, weighs 1.1 kg without batteries, and measures 300 x 165 x 60 mm.

  The recorder section provides four mono tracks (1 to 4) and two stereo tracks (5/6 and 7/8), for eight tracks in total, each with ten switchable virtual takes. Two tracks record simultaneously and eleven play back at once (eight audio plus the stereo drum track and the bass track). A separate stereo master track is reserved for mixdown, and a bounce function plays every track and records the result onto an empty V-take. Range editing covers copy, move, erase, exchange, trim, fade-in and fade-out, and reverse.

  Two effect paths run in parallel. The insert effect can sit immediately after the input, on the output of any audio track or the drum and bass sound, or immediately before the master fader, and offers eight algorithms (CLEAN, DIST, ACO/BASS SIM, BASS, MIC, DUAL MIC, LINE and MASTERING) built from six modules, with 94 insert types and 300 patches. The send/return effect is wired into the mixer's send and return loop and carries hall, room, spring and plate reverbs, chorus and delay, with six types and 60 patches.

  The rhythm section runs in sync with the recorder, using PCM drum and bass sound sources across eight drum kits of 27 sounds each and five bass programs. It holds 511 rhythm patterns and ten rhythm songs per project, programmed in real time from the nine velocity-sensitive pads or step by step, at 40.0 to 250.0 BPM with 48 PPQN resolution. The MIDI OUT connector sends note, control change, Timing Clock, Song Position Pointer, Start/Stop/Continue and MIDI Time Code messages to external gear.

  Input 1 is a standard mono phone jack whose [INPUT 1 SELECT] switch chooses between MIC/LINE (10 kilohms) and GUITAR/BASS (470 kilohms), so a passive instrument can plug in directly. Input 2 is an XLR-3-31 and standard phone combo jack taking balanced or unbalanced sources. A chromatic, guitar, bass, open A/D/E/G and D modal tuner is reachable when the insert effect is bypassed.
specs: |-
  - Physical tracks: 8 (4 mono, 2 stereo pairs), plus 1 stereo drum track and 1 bass track
  - Virtual takes: 80 (10 per track)
  - Simultaneous recording: 2 tracks, simultaneous playback: 11 tracks
  - Recording media: SD card. 100 minutes on 256MB, 400 minutes on 1GB in mono, continuous recording capped at 180 minutes
  - Projects: 1000 per card, markers: 100 points per project
  - Track editing: copy, move, erase, exchange, trim, fade-in/out, reverse
  - Other recorder functions: punch-in/out, bounce recording, A-B repeat, capture/swap
  - Mixer: 8 faders, post-fader/pre-fader level meters, 2-band EQ, effect send level and panning per track, stereo link on tracks 1/2 or 3/4
  - Insert effect: 8 algorithms, 6 modules, 94 types, 300 patches
  - Send/return effect: 1 module, 6 types, 60 patches
  - Tuner: chromatic, guitar, bass, open A/D/E/G, D modal
  - Rhythm: 6 drum voices and 1 bass voice, 8 drum kits of 27 sounds, 5 bass sounds, 9 velocity-sensitive pads
  - Rhythm capacity: 511 patterns and 10 songs per project, 99 measures per pattern, approx. 20000 notes per song
  - Tempo: 40.0 to 250.0 BPM, 48 PPQN resolution, beats 1/4 to 8/4
  - A/D conversion: 24-bit, 64-times oversampling
  - D/A conversion: 24-bit, 128-times oversampling
  - Sampling frequency: 44.1 kHz
  - Display: 55 x 35 mm custom LCD with backlight
  - Input 1: standard mono phone jack, input impedance 10 kilohms (MIC/LINE) or 470 kilohms (GUITAR/BASS)
  - Input 2: XLR-3-31 and standard phone combo jack, balanced input impedance 1 kilohm pin 2 hot, unbalanced 10 kilohms
  - Input level: -50 dBm to +4 dBm, continuously variable
  - Master output: RCA phono jacks (L/R), output load impedance 10 kilohms or more, rated output level -10 dBm
  - Headphones output: standard stereo phone jack, 50 mW into 32-ohm load
  - MIDI: OUT only
  - Power supply: AC adaptor DC 9 V 300 mA (ZOOM AD-0006)
  - Battery: 4 x IEC R6 (size AA), approx. 4 hours with display backlight on, 5 hours with it off
  - Dimensions: 300 (W) x 165 (D) x 60 (H) mm
  - Weight: 1.1 kg without batteries
