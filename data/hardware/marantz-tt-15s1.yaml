description: Defined by its pristine sound, immaculate detailing, and superior
  quality cartridge, TT-15S1 reproduces immaculate high-fidelity.
details: |-
  The TT-15S1 is more than just incredible to look at; it has been expertly engineered to provide the perfect platform for your records to sound their best. This includes a low-resonance high-density acrylic chassis and platter.

  The Marantz Sound Master meticulously tuned TT-15S1 for amazing performance with careful parts selection to create the Most Musical Sound in your home.

  To avoid any performance-limiting chassis vibration, the TT-15S1's precision motor system has been designed to 'float' rather than sit on the acrylic chassis.

  TT-15S1 belt drive system features an endless silicon belt for the smoothest possible rotation of the platter, ensuring precision timing and sensational listening.
specs: |-
  - Manual operation belt-drive turntable
  - Non-servo AC motor with isolated 'floating' design
  - Endless silicone belt drive
  - 33 1/3 and 45 rpm speeds
  - Speed variation: ±0.2%
  - Low-resonance high-density acrylic chassis and platter
  - Includes Clearaudio Virtuoso MM (Moving Magnet) cartridge
  - Rated output: 3.6mV at 1kHz, 5cm/s
  - Frequency response: 20Hz–20kHz
  - S/N ratio (MM): 80dB
  - Channel separation: >30dB
  - Power consumption: 5W
  - Dimensions: 16.5" W x 5.4" H x 14.2" D (without tonearm)
  - Weight: 19.6 lbs (without tonearm and motor)
  - Platter height: 1.2"
