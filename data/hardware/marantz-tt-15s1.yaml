description: Defined by its pristine sound, immaculate detailing, and superior
  quality cartridge, TT-15S1 reproduces immaculate high-fidelity.
details: |-
  Masterfully crafted, and carefully curated with hand-selected materials, the TT-15S1 is as impeccable as they come, delivering the most authentic format with unprecedented clarity.

  The TT-15S1 is more than just incredible to look at. It has been expertly engineered to provide the perfect platform for your records to sound their best. This includes a low-resonance high-density acrylic chassis and platter.

  The Marantz Sound Master meticulously tuned TT-15S1 for amazing performance with careful parts selection to create the Most Musical Sound in your home.

  To avoid any performance-limiting chassis vibration, the TT-15S1's precision motor system has been designed to 'float' rather than sit on the acrylic chassis.

  The TT-15S1 belt drive system features an endless silicon belt for the smoothest possible rotation of the platter, ensuring precision timing and sensational listening.
specs: |-
  - Motor: Non Servo AC Motor
  - Drive system: Belt drive (silicone belt)
  - Operation: Manual
  - Speed: 33 1/3 and 45 rpm
  - Stylus: MM (moving magnet)
  - Cartridge: Clearaudio Virtuoso MM
  - Line output: 2 channel
  - Speed variation: +/- 0.2%
  - Rated output (1kHz, 5m/s): 3.6mV
  - Frequency response: 20Hz to 20kHz
  - S/N MM: 80dB
  - Channel separation: greater than 30dB
  - Color: Transparent White
  - Platter height: 1.2 in
  - Power consumption: 5W
  - Dimensions (W x H x D): 16.5 x 5.4 x 14.2 in (without tonearm)
  - Weight: 19.6 lbs (without tonearm and motor)
  - 5 year warranty (30 day cartridge and needle)
