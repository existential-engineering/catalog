id: xyn1iLDm-hOwBnOktV3Xa
name: Noise Square
manufacturer: bastl-instruments
primaryCategory: synthesizer
categories:
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/noise-square
description: "Noise Square is a discontinued 5HP Eurorack noise and square wave
  generator. It provides two analog noise sources (white and pink) alongside
  four digitally-generated outputs: tunable METALLIC noise (six square
  oscillators at 808-inspired frequency ratios), tunable DIGITAL noise, a SQUARE
  wave, and a COW output combining two square waves at a fixed ratio for
  cowbell-style sounds. Two CV inputs (0–10V) independently control the digital
  sources."
details: |-
  5HP width, 35mm depth. Power: +12V 15mA, -12V 15mA, +5V 20mA (requires +5V
  on bus board).
