details: |-
  The Super Phat Mod is Keeley's long-running Phat Mod modification built as a pedal of its own, using JFETs chosen to emulate old tube amps. The appeal of the original was the natural break-up and the dynamics, which is why the modified pedal stayed on players' boards for close to fifteen years.

  The underlying design uses tube-like amp stages, tube amp tone stacks and a variety of tone shaping circuits intended to suit any guitar's pickups. The difficulty in building one had always been finding a FET whose harmonic content and distortion grain were right; the device finally used is a Toshiba part found after years of searching.

  The result is full range and very responsive, and the phrase transparent overdrive came out of this design. It suits players who do not want the more refined sound of a common screamer: with the gain set high, the guitar's volume control and pick attack do the work. Modern refinements include true bypass.

  The lineage runs back to the Keeley BD-2, the first mod to carry a switch, which gave two modes of bass response with the boosted setting called Phat mode. That switch survives as the micro toggle on the Super Phat Mod. The Luna Overdrive and then the Katana Blue Drive followed, retaining active bass and treble controls while smoothing the highs and widening the gain range. The Super Phat Mod duplicates the Keeley Phat Mod part for part apart from the new JFETs.
