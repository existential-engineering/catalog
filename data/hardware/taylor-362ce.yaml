description: The 362ce is a 12-string Grand Concert acoustic-electric built from
  all-solid Neo-Tropical Mahogany, with V-Class bracing, a Venetian cutaway, and
  ES2 electronics — the compact 24-7/8" scale reduces string tension for more
  comfortable 12-string playability.
details: |-
  The 362ce is a 12-string acoustic-electric built around Taylor's compact Grand Concert body. Its 24-7/8" scale length reduces string tension compared to full-scale 12-strings, making chord voicings and bends more comfortable while retaining the characteristic octave shimmer.

  Constructed entirely from Neo-Tropical Mahogany — top, back, sides, and neck — the 362ce delivers a balanced, midrange-forward tone with warm low-end depth. Taylor's V-Class bracing improves intonation accuracy, sustain, and volume versus traditional X-bracing.

  The West African Crelicam Ebony fretboard and bridge complement the satin finish with Shaded Edgeburst. Expression System 2 behind-the-saddle electronics provide natural amplified performance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Configuration: 12-string
  - Top: Neo-Tropical Mahogany (solid, satin)
  - Back/sides: Neo-Tropical Mahogany (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Nut width: 1-7/8"
  - Tuners: Taylor Satin Black with Satin Black Buttons
  - Pickguard: Firestripe
  - Electronics: Expression System 2 (ES2)
  - Finish: Shaded Edgeburst, satin
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.010-.047)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
