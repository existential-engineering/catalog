details: |-
  The CT8.4 LCRS is a three-way closed-box Custom Theatre loudspeaker in the Bowers & Wilkins CT800 Series, the top of the Custom Theatre range, which brings the technology used in the company's 800 Series stand-alone speakers to a home theatre set-up. It is a passive design installed inside home theatre cabinetry and driven from an external power amplifier.

  Bowers & Wilkins offers it as an alternative to the CT8 DS side and rear channel speaker where space is at a premium. It is a smaller, more compact vertical surround speaker that the company states generates exactly the same authentically three-dimensional listening experience, and it packs enough power to act as a stand-alone loudspeaker positioned front, side or rear within a complete custom theatre system.

  The drive unit complement is a 32mm (1.25in) aluminium dome tweeter with Nautilus spiral tube loading, a 150mm (6in) Aramid Fibre FST midrange, and a single 200mm (8in) Carbon Aerofoil bass cone. Crossover points are 380Hz and 4kHz.

  Sensitivity is 88dB (2.83V, 1m) and nominal impedance is 8 ohms with a 3 ohm minimum. Bowers & Wilkins recommends 50W to 500W of amplifier power into 8 ohms on unclipped programme, and frequency response is quoted as 49Hz to 24kHz plus or minus 3dB on the reference axis.

  The sealed cabinet stands 630mm (24.8in) tall and weighs 21.0kg (46.3 lb). It is finished in black paint, which is the only finish offered.
specs: |-
  - Description: 3-way closed-box system
  - Drive units: 1x 32mm (1.25in) aluminium dome with Nautilus spiral tube-loaded high-frequency; 1x 150mm (6in) Aramid fibre FST midrange; 1x 200mm (8in) Carbon Aerofoil bass cone
  - Technical features: Nautilus spiral tube-loaded tweeter, Aramid fibre FST midrange, Carbon Aerofoil bass cone
  - Frequency range: -6dB at 39Hz to 40kHz
  - Frequency response: 49Hz - 24kHz +/-3dB on reference axis
  - Dispersion (within 2dB of reference response): horizontal over 60 degree arc, vertical over 10 degree arc
  - Sensitivity: 88dB (2.83V, 1m)
  - Harmonic distortion: <1% 80Hz - 20kHz; 2nd and 3rd harmonics (90dB, 1m) <0.5% 200Hz - 15kHz
  - Nominal impedance: 8 ohms (minimum 3 ohms)
  - Crossover frequencies: 380Hz, 4kHz
  - Recommended amplifier power: 50W - 500W into 8 ohms on unclipped programme
  - Max. recommended cable impedance: 0.1 ohms
  - Dimensions: height 630mm (24.8in), width 325mm (12.8in), depth 185mm (7.3in), depth with grille 227mm (9in)
  - Net weight: 21.0kg (46.3 lb)
  - Finish: cabinet black painted
  - Compact vertical surround speaker, offered as an alternative to the CT8 DS where space is limited; can also be used front, side or rear
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Rear panel connections: two pairs of binding post terminals and one Neutrik speakON socket; both methods allow bi-wiring
