details: |-
  LX1 - Extension controller for Ableton Live. It is one of the three Micromodul 1st generation controllers documented together on this page, alongside the LV1 and the DJ1.

  The LX1 controls 16 tracks. Unlike the LV1, which controls 16 tracks plus FX devices, the LX1 is listed for tracks only, which is the stated difference between the two.

  The unit carries MIDI sockets for in and out port. It is battery powered, with an external power supply possible.

  Downloads for the LX1 are the micromodul Live.zip settings file, holding all LV1/LX1/DJ1 settings for Live from version 2.0, plus the user manual in English and German.

  Faderfox marks the LX1 "discontinued / sold out" on this page.
specs: |-
  - Controls 16 tracks
  - MIDI sockets for in and out port
  - Battery powered (external power supply possible)
  - Settings file for Ableton Live from version 2.0 (micromodul Live.zip, shared with LV1 and DJ1)
