description: >-
  A hybrid digital synthesizer and sampler from Korg featuring eight-voice polyphony, dual
  oscillators per voice, analog filtering, and onboard sampling capabilities that bridged the
  gap between wavetable synthesis and early sampling technology.
details: |-
  Released in 1986, the Korg DSS-1 represented an ambitious fusion of digital synthesis and
  sampling in a single keyboard instrument. Building on the foundation of the popular DW-8000,
  it added the ability to sample external audio and integrate those recordings alongside its
  built-in waveforms, giving musicians an unusually flexible sound palette for the era.

  The synthesis architecture provides 16 oscillators across eight voices, with each voice
  accessing two oscillators simultaneously. Users can draw from 128 sine wave harmonics and
  reshape waveforms in real time using two data sliders, enabling a form of additive synthesis
  that was uncommon in mid-1980s keyboards. The sampler section offers 256k of memory supporting
  up to five seconds of recording time.

  What truly distinguishes the DSS-1 is its analog VCF section, switchable between 12 dB and
  24 dB per octave low-pass configurations. This gives sampled and synthesized sounds alike a
  warmth and movement that purely digital instruments of the period could not match. Twin
  digital delay effects and oscillator sync capabilities further expand the sonic range.

  The 61-key keyboard responds to both velocity and aftertouch, providing expressive playing
  control. Notable users include Jean-Michel Jarre, Joe Zawinul, Steve Winwood, and Michael
  Cretu of Enigma. A rackmount expansion, the DSM-1, followed in 1987 with additional memory
  and capabilities.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 16 total (2 per voice)
  - Waveforms: 128 sine harmonics, user-reshapeable
  - Sampler: 256k memory, 5-second capacity
  - Filter: Analog VCF, switchable 12 dB/24 dB low-pass
  - Effects: Twin digital delays, oscillator sync
  - Keyboard: 61 keys with velocity and aftertouch
  - Control: MIDI
releaseDate: "1986"
