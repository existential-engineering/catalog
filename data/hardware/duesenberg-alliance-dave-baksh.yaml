  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Sum41 Stars & "Magpie" at 12th fret
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: White-Sparkle
  - Body type: Solid-Body, Alder
  - Body dimensions: 46 x 34 cm / 18" x 13.4"
  - Height (sides): 4.2 cm / 1.7"
  - Binding: Cream
  - Pickguards: Black with custom white stripes
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg 3-Point Radius Bridge
  - Tailpiece: Duesenberg Wrapper
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Alnico Blade
  - Pickup (middle): Duesenberg Pearlito
  - Pickup (bridge): Duesenberg LittleToaster
  - Wiring: 1 Volume, 1 Tone, 4-Way Pickup Selector, Kill-Switch
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
