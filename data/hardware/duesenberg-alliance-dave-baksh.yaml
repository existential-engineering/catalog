description: Dave "Brownsound" Baksh is co-lead guitarist and background
  vocalist with SUM41. The Canadian band was formed in 1996 and went on to
  become one of the worlds leading rock/pop punk bands.
details: |-
  The Alliance Series Dave Baksh pairs a solid Alder body with a set one-piece Maple neck and an Indian Rosewood fingerboard of 305 mm / 12" radius, a combination Duesenberg credits with clarity, attack and a tight low-end response. The neck has a Medium D shape, 22 jumbo frets and a steel dual-action trussrod, the scale length is 648 mm / 25.5", and the body carries cream binding under a PUR lacquer finish.

  Three Duesenberg pickups cover the tonal range: a Duesenberg Alnico Blade at the neck and a Duesenberg Pearlito in the middle for transparency, with a Duesenberg LittleToaster mini-humbucker at the bridge for sparkling trebles and a wide tonal range. Wiring is one volume, one tone, a 4-way pickup selector and a kill-switch sited between the volume and tone controls, which can mute the instrument instantly or be used for stutter effects.

  Hardware is nickel plated rather than chrome, a finish Duesenberg describes as warmer in sheen and one that ages naturally unless cleaned regularly. It comprises Duesenberg Z-Tuners, the Duesenberg 3-Point Radius Bridge and a Duesenberg Wrapper tailpiece, which the maker credits with a tight attack and easy string changes, plus Straplock-compatible Duesenberg Standard strap pins. The guitar ships with Duesenberg Custom 10/50 strings.

  Cosmetic details reference the artist directly. The finish is White Sparkle with a matching White-Sparkle headstock, the control plates for volume, tone, rotary pickup selection and kill-switch are laser etched with lion heads, the fingerboard carries Sum41 star inlays with a CNC-machined Magpie at the 12th fret, and the black pickguard carries two custom white stripes.

  Every fingerboard passes through Duesenberg's Plek process so the frets are level, which the maker treats as the basis for its hand fret polishing and setup work. The instrument comes with a Duesenberg Custom Line Case as standard, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
