details: |-
  R42KIT is a two-channel true diversity wireless receiver kit. It ships with antennas, a power supply, a rack mount, and BNC cables for front mounting the antennas.

  Features include one-touch auto clear channel scan and transmitter sync, a 32 MHz wide-spectrum receiver, and 106 pre-coordinated frequencies for quick and easy setup. The receiver is compatible with the ADS48 antenna distribution system to expand capacity.

  Frequency Band
  522 MHz - 586 MHz (A: 522 - 554 MHz, B: 554 - 586 MHz)
specs: |-
  - Type: True diversity receiver, two channel
  - Frequency band: 522 MHz - 586 MHz (A: 522-554 MHz, B: 554-586 MHz)
  - Receiver bandwidth: 32 MHz wide spectrum
  - Pre-coordinated frequencies: 106
  - Includes: antennas, power supply, rack mount, BNC antenna cables
