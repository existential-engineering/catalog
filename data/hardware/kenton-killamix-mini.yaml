description: USB MIDI Controller providing 144 virtual encoders, 144 virtual
  push buttons and 16 virtual joysticks.
details: |-
  A compact USB MIDI controller with 9 endless encoders, 9 illuminated push buttons and a four way joystick, switchable across 16 MIDI channels so the physical controls address up to 144 virtual encoders, 144 virtual push buttons and 16 virtual joysticks. It is aimed at DAWs that can learn MIDI assignments.

  A single press on one of the 9 encoder knobs selects a MIDI channel from 1 to 9, and pressing two knobs together reaches channels 10 to 16. LEDs show which channel is currently active, and each encoder remembers where it was left on that channel and shows that position on the ring of LEDs around the knob, so changing channel does not produce a data jump.

  The self centering joystick sends on the currently selected channel and can be configured three ways: as two controllers (19 and 20) with a centre value of 64, as four controllers (19 to 22) with a centre value of zero, or as four switches sending value 127 at the extremes of controllers 19 to 22 depending on direction. The 9 push buttons also send on the selected channel, can remember their on or off status (shown by internal LEDs), and each can be set to one of three modes: on only, on and off, or toggle.

  A controller update mode lets values changed on the computer write back into the unit, so the stored positions follow the session. With 9 channels under a single knob press there are effectively 81 endless controllers and 81 buttons to hand, or 144 of each with a two knob press.

  The case is a sturdy aluminium box finished in brushed aluminium, with matching solid aluminium knobs.
specs: |-
  - 9 non-click endless encoders, 30, 60 or 180 increments per revolution depending on turn speed
  - 9 illuminated push buttons
  - Joystick with continuously variable X and Y axes and spring return to centre
  - MIDI transmit: CC 1 to 23 on any MIDI channel 1 to 16
  - Transmit map: knobs CC 1 to 9, buttons CC 10 to 18, joystick CC 19 to 22, knob press CC 23
  - MIDI receive: CC 1 to 18 on the current MIDI channel 1 to 16
  - Receive map: knobs CC 1 to 9, buttons CC 10 to 18
  - USB bus powered, no external power supply required
  - Supplied with a 1.8 metre USB Mini B to A cable
  - Windows XP and later (32 and 64 bit), macOS 10.2 and above, Linux kernel 2.4 and above
  - Dimensions: 320 x 64 x 46 mm (12.6 x 2.6 x 1.8 inches)
  - Weight: 413 grams
  - Aluminium enclosure with solid aluminium knobs
