description: >-
  The Roland Juno-Di is a lightweight, portable 61-key rompler synthesizer released in
  2009 as an update to the Juno-D. It features 128-voice polyphony, over 1,000 preset
  sounds drawn from 64 MB of waveform ROM, and a simplified front panel with five Sound
  Modify knobs for quick tweaking. Designed as an affordable entry-level keyboard, it
  includes a built-in vocoder, D-Beam controller, and USB song playback for live
  performance.
details: |-
  The Juno-Di is Roland's updated take on the Juno-D, bringing it closer in line with the Juno-G and Juno-Stage models while retaining its identity as a portable, budget-friendly keyboard. Roland doubled the polyphony from 64 to 128 voices and expanded the waveform ROM to 64 MB with 839 tones, resulting in over 1,000 preset sounds covering grand and electric pianos, strings, guitars, brass, percussion, exotic instruments, and modern synth patches.

  The front panel is designed for simplicity, featuring dedicated category buttons for quick sound selection and a large scroll dial for browsing patches. Five Sound Modify knobs provide immediate access to Envelope Attack, Release, Filter Cutoff, Resonance, and Reverb amount. For deeper editing, a Mac/PC software editor is available. Under the hood, the sound engine offers four tone generators, TVF digital resonant filters, two assignable LFOs per tone, and ADSR envelopes.

  Effects processing includes 79 multi-effects types alongside 3 chorus and 5 reverb types. Performance features include an arpeggiator with 128 patterns, 24 rhythm patterns, and 17 chord memory patterns. The built-in vocoder with microphone input and dedicated vocal reverb adds creative vocal processing capabilities. Roland's D-Beam controller provides gesture-based sound manipulation.

  The Song Player function allows playback of SMF, AIFF, WAV, and MP3 files from USB storage, making it useful for live performance jam sessions. Unlike the larger Juno-G and Juno-Stage, the Juno-Di omits workstation features such as a sequencer and audio recorder, keeping the focus on portability and ease of use. The keyboard can also run on battery power for maximum portability.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 16 parts
  - Waveform Memory: 64 MB (839 tones)
  - Tone Generators: 4 per patch
  - LFO: 2 per tone
  - Filter: TVF digital resonant filter (4 per patch)
  - Amplifier: TVA with ADSR envelope (4 per patch)
  - Effects: 79 multi-effects, 3 chorus types, 5 reverb types
  - Arpeggiator: 128 patterns
  - Rhythm Patterns: 24
  - Chord Memory Patterns: 17
  - Keyboard: 61 keys, velocity sensitive
  - Preset Patches: 1082 plus 256 GM2
  - User Patches: 128
  - Preset Rhythm Sets: 20 plus 9 GM2
  - User Rhythm Sets: 8
  - Preset Performances: 64
  - User Performances: 64
  - Controllers: D-Beam, pitch bend/modulation lever, 5 Sound Modify knobs
  - Connections: MIDI In/Out, USB, microphone input, external mini-jack input
  - Storage: USB memory stick
  - Power: AC adapter or battery operation
releaseDate: "2009"
