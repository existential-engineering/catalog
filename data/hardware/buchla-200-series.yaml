description: >-
  The Buchla 200 Series is an advanced modular voltage-controlled analog synthesizer
  system dubbed 'The Electric Music Box' for its ability to interface analog circuitry
  with digital computers.
details: |-
  When Buchla expanded into markets beyond educational institutions to serve performing musicians and sound designers, they introduced the far more advanced 200-series modules. The system's ability to interface voltage controlled analog circuitry with digital computers opened doors to complex programming and control previously unseen. A color-coded patch-cord system simplified patching and provided clear visualization of signal routing.

  The original 200 came in a large wood cabinet with a flat touch-plate keyboard. The System 101 was a compact polyphonic variant designed for mobile musicians. Notable variations include the Sili-Con Cello, a unique interactive synthesizer designed to respond to acoustic instrument performances, and the Music Easel, a rare briefcase-style portable unit with patch storage via resistor cards.
specs: |-
  - Voltage-controlled analog synthesizer modules
  - Color-coded patch-cord system
  - Touch-plate keyboard interface
  - VCO with multiple waveforms (rectangle, triangle, sawtooth, sine, square)
  - Dual low-pass voltage-controlled filters
  - Five-step by four-output sequencer
  - LFO and envelope generators
  - Sample-and-hold modules
  - Ring modulation and frequency shifting capabilities
  - Quad envelope generators with variable attack/decay
  - Programmable complex waveform generators
  - Envelope followers and preamplifiers
  - Quadraphonic spatial control
  - Multiple keyboard options (touch-plate, piano-style, pressure-sensitive)
  - Portable briefcase configurations available
  - Computer interface capabilities
  - Reversible battery power option for portable models
