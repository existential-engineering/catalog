description: The T5V is a highly affordable two-way nearfield monitor with excellent acoustic characteristics optimized for small control rooms.
details: |-
  With its 5" woofer the bass-frequency response of the T5V extends to 45 Hz. The new U-ART tweeter, a breakthrough solution for use in high-resolution recording and mixing on a budget, goes up to 25 kHz and is mated to a precision waveguide with the same dispersion-control attributes as the High Frequency Propagation (HPS) waveguide used in ADAM Audio's flagship S Series monitors. The waveguide's highly uniform dispersion of high frequencies provides an incredibly wide sweet spot that frees you from being glued to a rigid mix position while working.

  A beveled cabinet with a rear-firing bass reflex port and a small footprint allows placement anywhere in your room, no matter how small, and contains built-in DSP-controlled driver crossovers and equalization as well as multi-way analog connections. Powered with a 50 W Class D amplifier for the woofer and a 20 W Class D amplifier for the U-ART tweeter, the T5V produces SPLs of up to 106 dB per pair.

  Excellent acoustic characteristics, small dimensions and an outstanding cost/performance ratio make this studio monitor perfectly suited for use in small control rooms in music, video and broadcast production. If you need to hear more bottom end, the T5V is compatible with the ADAM Audio T10S subwoofer.

  The U-ART 1.9" tweeter design is based on that used in the X-ART and S-ART tweeters employed respectively in the AX Series and S Series monitors. ADAM units use PWM technology for both the amp and the power supply section (i.e. no more transformers) combined with state of the art input and filter stages.

  On the rear panel an XLR connector and RCA jack respectively accept balanced +4 dBu and unbalanced -10 dBV nominal input levels, with an associated 2-way switch selecting which is active. T Series monitors automatically accept AC mains voltages ranging from 100 to 240 V at 50/60 Hz, so no voltage switch setting is required. A 5 year warranty is standard across the portfolio (2 years warranty plus 3 years optional with product registration).
