description: The T5V is a highly affordable two-way nearfield monitor with
  excellent acoustic characteristics optimized for small control rooms.
details: |-
  The T5V is a highly affordable two-way nearfield monitor optimized for small control rooms. With its 5" woofer, the bass-frequency response extends to 45 Hz. The new U-ART tweeter provides high-resolution recording and mixing capability, reaching up to 25 kHz and paired with a precision waveguide offering the same dispersion-control attributes as ADAM Audio's flagship S Series monitors.

  The waveguide's uniform high-frequency dispersion provides an incredibly wide sweet spot, freeing users from rigid mix positioning. A beveled cabinet with rear-firing bass reflex port and small footprint allows placement in any room size.

  Built-in DSP-controlled driver crossovers and equalization, plus multi-way analog connections, are included. The T5V is powered by a 50 W Class D amplifier for the woofer and a 20 W Class D amplifier for the U-ART tweeter, producing SPLs up to 106 dB per pair.

  Excellent acoustic characteristics, compact dimensions, and an outstanding cost/performance ratio make this monitor ideal for small control rooms in music, video, and broadcast production. The T5V is compatible with the ADAM Audio T10S subwoofer for extended bass response.
specs:
  - 5" polypropylene woofer with 1" voice coil
  - U-ART 1.9" Accelerated Ribbon tweeter
  - "Tweeter diaphragm area: 4 in² (2420 mm²)"
  - "Tweeter diaphragm weight: 0.17 g"
  - HPS waveguide
  - "Velocity transform ratio: 4 to 1"
  - "Frequency response: 45 Hz – 25 kHz (-6 dB)"
  - "Max SPL per pair at 1 m: ≥106 dB"
  - "THD > 80 Hz: 0.5%"
  - "Crossover frequency: 3 kHz"
  - "Woofer amplifier: 50 W RMS, PWM (Class D)"
  - "Tweeter amplifier: 20 W RMS, PWM (Class D)"
  - "Total RMS amplifier power: 70 W"
  - "Max power consumption: 132 W"
  - "Input impedance: 10 kOhm (XLR), 20 kOhm (RCA)"
  - "Input sensitivity range: -10 to +4 dB"
  - Gain control on rear panel
  - "High shelf EQ (>5 kHz): -2 dB, 0 dB, +2 dB"
  - "Low shelf EQ (<300 Hz): -2 dB, 0 dB, +2 dB"
  - Rear-firing bass reflex port
  - Beveled cabinet
  - 'Dimensions: 298 mm H x 179 mm W x 297 mm D (11.7" x 7" x 11.7")'
  - "Weight: 5.7 kg (12.6 lbs)"
  - "Warranty: 5 years (2 years standard + 3 years optional with registration)"
