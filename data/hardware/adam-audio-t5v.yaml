  - Input Impedance: 10 kOhm / 20 kOhm
  - Woofer amplifier type: PWM
  - Woofer amp. power RMS: 50 W
  - Tweeter amplifier type: PWM
  - Tweeter amp. power RMS: 20 W
  - Total RMS Amp. Power: 70 W
  - Frequency Response: 45 Hz - 25 kHz (-6 dB)
  - THD > 80 Hz: 0.5 %
  - Max. SPL per pair at 1 m: >=106 dB
  - Crossover Frequency: 3 kHz
  - Woofer basket diameter: 5"
  - Woofer voice coil diameter: 1"
  - Woofer cone material: Polypropylene
  - Tweeter type: U-ART
  - Tweeter diaphragm area: 4 inch2 (2420 mm2)
  - Tweeter equiv. diaphragm diameter: 1.9" (48 mm)
  - Tweeter velocity transform ratio: 4 to 1
  - Tweeter diaphragm weight: 0.17 g
  - Waveguide: HPS
  - Input Sensitivity: -10 to +4 dB
  - Gain: Yes
  - High Shelf EQ > 5 kHz: -2 dB, 0 dB, +2 dB
  - Low Shelf EQ < 300 Hz: -2 dB, 0 dB, +2 dB
  - AC Mains Input Voltage: 100-240 VAC, 50/60 Hz, 132 W max.
