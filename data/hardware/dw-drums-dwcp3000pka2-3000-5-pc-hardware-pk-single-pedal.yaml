details: |-
  For over 50 years, DW has been the worldwide leader in hardware innovation. Every DW product launch has been followed with tireless innovation and the 3000 Series is no exception. This DW 3000 Series Hardware Pack includes two 3700A Boom Cymbal Stands, 3500A Hi-Hat Stand, 3300A Snare Stand, and an updated 3000 Series Bass Drum Pedal.

  The pack is designed utilizing a combination of tried-and-true, DW player-friendly features such as Infinite Tilters with Techlock adjustable cymbal seat and folding hi-hat stand base plate. Newer details include a Glide Tilter snare basket adjustment, Reso Pocket crutch tips and a redesigned tube joint with integrated memory lock.

  Furthermore, the all-metal, dual-chain 3000 Series single pedal has been updated with an Accelerator cam, adjustable footboard angle, and swivel toe clamp. The steel base plate also now features an anti-skid rubber mat for greater stability.

  Durable, Medium-Weight Construction: A balance of packable yet durable gear that travels and endures. Double-Braced Legs: Sturdy, reinforced legs keep these standing firm. Integrated Memory Locks: Save your adjustment settings to save on setup time.
