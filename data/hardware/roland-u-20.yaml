description: >-
  The Roland U-20 is a digital ROM-based synthesizer released in 1989, featuring
  4MB of onboard sample data covering pianos, brass, strings, bass, and drums.
  It offers 6-part multitimbrality with a dedicated drum part and 30-voice
  polyphony, making it a versatile workstation keyboard for live performance and
  studio use. The 61-key velocity and aftertouch sensitive keyboard includes
  built-in effects, an arpeggiator, and chord memory for expressive playing.
details: |-
  The Roland U-20 is a professional-grade digital synthesizer built around ROM-based sample playback. It provides 4MB of onboard PCM samples spanning a wide range of instrument categories including pianos, brass, strings, bass, and drum sounds. While the sounds may feel dated by modern standards, the build quality and construction are solid and reliable.

  The U-20 supports 6-part multitimbrality with a dedicated 7th drum part, allowing complex layered arrangements and ensemble performances. With 30-voice polyphony, it can handle demanding multitimbral setups without voice stealing becoming a significant issue. The synth stores 64 internal patches, expandable to 128 with an external RAM card, and accepts Roland SN-U110 sound library cards for further sonic expansion.

  Performance features include a full 61-note keyboard with both velocity and aftertouch sensitivity. An onboard arpeggiator and chord-memory function assist in creating dynamic performances. Built-in digital effects include reverb, chorus, and delay. The U-20 provides flexible audio routing with 2 direct outputs and 2 stereo outputs.

  Notable users of the U-20 include The Prodigy and Astral Projection. A rack-mount version of the instrument, the Roland U-220, offers identical sounds and features in a more compact form factor.
specs: |-
  - Polyphony: 30 voices
  - Sound Source: 4MB ROM samples
  - Multitimbral: 6 parts + 1 drum part
  - Filter: None
  - Effects: Reverb, Delay, Chorus
  - Arpeggiator: Yes
  - Chord Memory: Yes
  - Memory: 64 patches (expandable to 128 with external RAM card)
  - Expansion: Roland SN-U110 sound library cards
  - Keyboard: 61 keys with velocity and aftertouch
  - Outputs: 2 direct outputs, 2 stereo outputs
  - Control: MIDI
