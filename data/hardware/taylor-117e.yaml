details: |-
  The 117e is Taylor's first 100 Series guitar to feature the Grand Pacific round-shoulder dreadnought body shape, combining seasoned neo-vintage tone with modern playability.

  The torrefied spruce top undergoes Taylor's special roasting process, which adds mature, aged-in sweetness and accelerates the tonal development that typically comes with years of playing. Layered sapele back and sides contribute warmth and low-end power.

  Taylor's C-Class bracing system is tuned to emphasize volume, sustain, and bass presence. The slender neck profile makes the instrument approachable for beginners while remaining satisfying for experienced players.

  Expression System 2 (ES2) electronics feature a behind-the-saddle pickup design for natural amplified tone. The guitar ships with a gig bag included.
specs: |-
  - - Body shape: Grand Pacific (round-shoulder dreadnought)
  - Top: Torrefied Spruce (solid)
  - Back/sides: Sapele (layered)
  - Bracing: C-Class
  - Electronics: Expression System 2 (ES2)
  - Case: Gig bag included
