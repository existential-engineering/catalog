details: |-
  Meet Vulcan , the flagship from Hampshire Electronics — a fully polyphonic, 100% analog Eurorack synthesizer that brings classic warmth and power to the modular world. With up to eight discrete analog voices (or a fat 4-voice mode with dual oscillators, sub-oscillators, and filters per voice), Vulcan gives you the flexibility to go from lush polyphony to powerful layered monosynth textures. Control it your way — via MIDI or eight independent CV/Gate inputs — and integrate seamlessly with the rest of your system. Each voice offers dedicated patch points for VCF , FM , and VCA , opening the door to deep modulation and complex sound design possibilities. Featuring three LFOs , two ADSR envelopes , and a beautifully responsive analog signal path, Vulcan combines the immediacy of modular with the depth of a true polysynth. Hand-built in England, the Vulcan is designed for musicians who want real analog tone — without giving up modern control or Eurorack integration. Vulcan Manual: Download Vulcan Manual PDF

  Demo: THIS Eurorack Can Play Chords! (Analog Poly Synth)

  Key Features

  Dual Oscillator Section

  Flexible Filtering

  Full Modulation Architecture

  Presets & Performance Control

  MIDI and CV Integration

  Sound & Workflow

  The Vulcan's analog signal path delivers deep, rich harmonics and dynamic control. In 4-voice mode, its dual oscillators and filters create dense, evolving textures. Switch to 8-voice mode for lush pads, poly leads, and layered chords with precise tuning and per-voice modulation. Whether in a Eurorack system or standalone rig, the Vulcan bridges classic analog warmth with the flexibility of modern modular synthesis. Specifications

  Included
specs: |-
  - Switchable 4-Voice / 8-Voice Operation Choose between lush 8-voice polyphony or powerful 4-voice dual-oscillator mode.
  - 4-Voice Mode: 2 oscillators, 2 sub-oscillators, and 2 filters per voice for a massive stacked sound.
  - 8-Voice Mode: 1 oscillator, 1 sub-oscillator, and 1 filter per voice for full polyphony.
  - Each oscillator has separate tuning, allowing thick detuning, FM tones, or perfect interval tuning.
  - Controls include Level , Sub , Pulse Width , and Waveform selection (Triangle, Saw, Square, Tri/Saw blend).
  - Each oscillator has its own filter and resonance, or they can be twinned by setting OSC2 level to zero to share a single filter path.
  - 3 LFOs with 12 destinations for advanced motion and timbral animation.
  - Dedicated VCA envelope and VCF envelope with adjustable level control.
  - FM, VCA, and VCF modulation per voice — normalled for easy patching, or isolated using the included GND jack.
  - 99 programmable presets for instant recall.
  - Presets can be stored globally or per-voice, allowing up to 8 independent sounds at once — perfect for layered or multi-timbral setups.
  - TRS-A and TRS-B compatible MIDI input for easy DAW or controller connection.
  - CV/Gate inputs per voice enable the Vulcan to function as eight separate mono synths or one cohesive polyphonic instrument.
  - Blended output with master volume control.
  - Format: Eurorack module
  - Width: 56HP
  - Voices: 4 or 8 switchable
  - Presets: 99
  - LFOs: 3 (12 destinations)
  - Envelopes: VCA + VCF (with level)
  - Inputs: CV/Gate per voice, TRS-A/TRS-B MIDI
  - Outputs: Blended audio with volume
  - Construction: Hand-assembled in the UK
  - Hampshire Electronics Vulcan module
  - Power ribbon cable
