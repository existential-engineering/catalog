description: >-
  The Monologue is a compact monophonic analog synthesizer released by Korg in early 2017,
  featuring two VCOs, a 16-step motion sequencer, and battery-powered portability. It was
  the last synthesizer designed by Tatsuya Takahashi as Korg's Chief Engineer of Analog
  Synthesizers, and ships with 100 presets including patches designed by Aphex Twin.
details: |-
  Released in early 2017, the Korg Monologue holds the distinction of being the last synthesizer designed by Tatsuya Takahashi during his tenure as Chief Engineer of Analog Synthesizers at Korg. While often positioned as a trimmed-down version of the Minilogue, the Monologue brings its own character to the table at a very accessible price point, making it an attractive entry into hardware synthesis.

  The architecture centers on two oscillators offering saw, square, triangle, and white noise waveforms. While it lacks the Minilogue's cross-modulation, oscillator sync and ring modulation are present, along with independent VCO controls through the mixer section. The 2-pole (12dB/oct) filter provides capable sound shaping, and a simple attack/decay envelope keeps things straightforward.

  Korg's Motion Sequencing technology is a standout feature, allowing both notes and parameter values to be recorded and played back through the 16-step sequencer. Volca owners will find the sequencer workflow familiar, though the absence of a built-in arpeggiator means DAW integration via MIDI or USB is needed for that functionality.

  The Monologue shares its predecessor's real wood back panel and mini-key design, albeit with one fewer octave at 25 keys. Battery operation enables true portability. It ships with 80 ROM patches and space for 20 user patches, with some factory sounds courtesy of Aphex Twin lending the instrument considerable credibility.
specs: |-
  - Polyphony: 1 voice
  - Multitimbral: 1 part
  - Oscillators: 2 VCOs (Saw, Square, Triangle, White Noise)
  - Filter: 12dB/oct (2-pole)
  - LFO: 1 (Saw Up, Square, Triangle)
  - Envelope: 1 VCA with Attack, Decay
  - Sequencer: 16-step monophonic with motion sequencing
  - Keyboard: 25 mini-keys
  - Memory: 20 user patches, 80 ROM patches
  - Connectivity: MIDI In/Out, USB
  - Power: AC adapter or batteries
