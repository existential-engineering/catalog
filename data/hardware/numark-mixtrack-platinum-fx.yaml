description: Mixtrack Platinum FX 4-Deck Advanced DJ Controller with Jog Wheel
  Displays and Effects Paddles.
details: |-
  The Mixtrack Platinum FX has all the essentials you need to sound like a professional DJ. At its core, Mixtrack Platinum FX is a 24-bit 4-deck digital DJ controller with a dedicated software effects section, large 6-inch capacitive-touch jog wheels with built in hi-res displays and 16-multifunctional performance pads. Ready to take on any DJ style and perfect for small events, parties and developing your DJ skills, Mixtrack Platinum FX fuses in-demand functionality with all the tools to craft your signature style.

  Center stage on Mixtrack Platinum FX are two all-new premium paddle triggers for effortless command over Serato's built-in software effects; there's even quick access buttons to essential effects including Echo, Reverb, Flanger, Phaser, HPF (High Pass Filter) and LPF (Low Pass Filter) for creating build-ups, crafting transitions and adding your own unique spin to your mix.

  Mixtrack Platinum FX's rugged capacitive-touch jog wheel design has a large 6-inch surface for supreme reliability and total control of your mix. The bright, high-resolution jog wheel displays relay all critical song information, including Beats Per Minute (BPM), Platter Position, Time Remaining, Pitch adjustment and key.

  Get creative, remix and perform with Mixtrack Platinum FX's 16 multi-function backlit performance pads. Dedicated quick-access pad mode buttons per deck cover Hot Cues, Auto Loop, Sample and Fader Cuts (a signature crossfader effect that emulates a 1-4 click flare on the pads).

  Mixtrack Platinum FX comes with Serato DJ Lite, giving access to stream millions of songs via WiFi from TIDAL or SoundCloud, and includes a 2-month trial of SoundSwitch premium DJ lighting software for syncing lighting visuals with live audio. The controller features plug-and-play USB connectivity, a dedicated mixer section with full 3-band EQ, filter knobs, channel faders and a cross fader, plus an onboard microphone input, RCA outputs and a headphone output.
specs: |-
  - 4-deck layered DJ controller
  - 6 quick-launch effects with dual paddle triggers
  - 8 performance pads per deck (16 total) to access cues, loops, fader cuts and samples
  - Large 6-inch capacitive-touch jog wheels with built-in high-resolution displays
  - Jog wheel displays show BPM, platter position, time remaining, pitch and key
  - Full 3-band EQ and filter knobs
  - Dedicated auto loop with multiplier buttons
  - 24-bit audio output
  - Sample rate: 44.1 kHz
  - USB bus power
  - Dimensions (width x depth x height): 21.1" x 9.7" x 2.0" (53.6 x 24.6 x 5.1 cm)
  - Weight: 5.0 lbs (2.3 kg)
  - Includes Serato DJ Lite download
  - Includes 2-month trial of SoundSwitch premium DJ lighting software
