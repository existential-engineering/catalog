details: |-
  The first HOF Mini was an instant hit. To this day, so much tone in such a small and simple package is a rare thing.HALL OF FAME 2 MINI REVERB picks up where its predecessor left off, taking all the tricks you’d expect from a member of the Hall of Fame family and cramming it into a tiny pedal. The tone-to-weight ratio is simply out of this world!Drawing from our long history of crafting the finest, most natural studio reverbs for professionals, we’ve put our best minds to work on making HALL OF FAME 2 MINI sound every bit as exquisite as its heritage suggests.With an updated layout giving letting you adjust Decay, Tone and Level, we’ve managed to make HALL OF FAME 2 MINI even more useable while keeping the same pedalboard-friendly footprint.

  MASH – Heart of Innovation

  HALL OF FAME 2 MINI REVERB features groundbreaking new technology that brings a wide range of creative expression to the party, controlled solely by how much pressure you apply to the depressed footswitch.Years in the making, and only available in select TC Electronic products, this clever innovation elevates the common footswitch well above mundane duties, such as “On” and “Off”.More importantly – MASH elevates your performance to the next level.

  Infinite Reverbs, Limited Space

  If HALL OF FAME 2 MINI REVERB was proportionate to the amount of tone possibilities we packed in there, it would have its own moon orbiting around it.But, as you've probably noticed from the name "mini", it’s really small.Built on the renowned Mini platform that also spawned DITTO LOOPER and POLYTUNE MINI, there’s always room on your pedalboard for one of these, and the amount of tone choices are unlimited.
