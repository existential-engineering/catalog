description: A complete, modular, expandable recording and mixing console with
  world-class converters, a studio full of outboard gear and a professional
  Atmos capable analog monitor controller. It is integrated with a future-proof
  computer interface.
details: |-
  The LIO-8 mkIV is a single rack space audio interface built on Metric Halo's 3d core digital engine. It carries 8 channels of A/D conversion with digitally controlled analog input trim, 8 channels of D/A conversion with analog gain, a stereo headphone output fed by its own dedicated D/A and analog gain stage, and 2 channels of guitar or bass DI input. Microphone preamplification is not part of the base unit, which is what separates it from the ULN-8 mkIV. The fourth-generation mkIV analog and converter stages reduce converter latency by 85 percent against the previous generation, for a round trip through converters, mixer, DSP and monitor section of about 0.9 ms at 44.1 kHz and about 0.2 ms at 192 kHz. The A/D/A converters are DC coupled to the analog I/O stages, the D/A has no low-frequency filtering, and the A/D path uses an extremely low frequency DC blocking filter that removes DC offset with minimal phase shift.

  Up to 8 channels of ULN-R preamps can be added in 4 channel blocks at any time. Each ULN-R preamp provides up to 90 dB of digitally controlled analog gain in recallable 0.5 dB steps, with independently switchable P48 phantom power per input and DC blocking for the phantom supply, and accepts input levels up to +20 dBu without fidelity reducing pads, so a fitted mic input path doubles as an alternative line input path and can give the monitor controller a further 8 selectable analog sources. An integrated analog send ahead of the A/D converter allows the unit to be used as a remote controlled analog preamp up to 100 meters from the control interface, to patch outboard analog processing between preamp and converter in a send and return arrangement, or to feed a fully analog split to a backup recording or mixing system. Insertable Character component modeling processing sits alongside the preamp path for colouration ranging from a clean wire with gain to a tube style preamp.

  A digitally controlled analog monitor controller switches between multiple sources and multiple speaker output paths, from stereo up to 7.1.4 Dolby Atmos, with per speaker gain and delay, per speaker solo and mute, output path calibration, mono fold-down, mute and dim, talkback, listenback, multiple cue outputs and PFL or AFL integration with the mixer. Relay driven shunt mutes on every analog output keep transients out of power amplifiers and speakers and engage automatically during power cycles and sample rate changes. Each output path can carry its own signal processing, including EQ, bass management and protective limiting, even when two paths share the same speakers, and the headphone amplifier runs by default as a parallel cue output multed from the monitor controller.

  The hybrid FPGA and DSP engine runs a 128 channel by 64 bus mixer at sample rates up to 192 kHz with sample accurate gain interpolation, plus a programmable DSP for instantiable plug-in processing. Over 100 zero latency hardware plug-ins are included, among them the Metric Halo Production Bundle, the +DSP Bundle, the Make Believe Bundle and the Sontec MES-432D9D model, covering EQ, compression, expansion, limiting, gating, de-essing, transient control, reverb, delay and Character saturation. Session, an integrated tracking DAW supporting live, take-based and overdub workflows, runs as part of MIO Console 3d and time stamps BWF files from the sample accurate SMPTE LTC reader.

  Connectivity covers MHLink Gigabit Ethernet, which daisy chains units up to 100 meters apart over commodity Cat 5e cable and presents the whole system to the host as one aggregated interface carrying up to 256 channels at 192 kHz, and a USB-C port offering driverless USB Audio Class 2, USB MIDI Class and MIO control endpoints that also works as a Satellite Computer Port for a second host. The unit adds 8 channels of AES input and output, SMPTE LTC I/O, MIDI I/O and an open EdgeBus card slot that accepts AES, S/PDIF, ADAT, TOSLINK, MIDI and MADI expansion cards, all active simultaneously for use as a format converter. Boot states hold the full configuration of a multi-unit MHLink system in non-volatile memory for standalone operation as a converter, format converter or monitor controller. Power draw is 25 watts with every mic channel supplying 48 V phantom and under 21 watts without, so the chassis runs cool with no fans.
specs: |-
  - Metric Halo 3d core digital engine with MHLink
  - 8 channels A/D with analog trim
  - 8 channels D/A with analog gain
  - Stereo headphone output with dedicated HP D/A and analog gain
  - Converter latency reduced by 85 percent compared with previous generation
  - Round trip through converters, mixer, DSP and monitor: approx 0.9 ms at 44.1k, approx 0.2 ms at 192k
  - Optional ULN-R preamps, 0, 4 or 8 channels, addable in 4 channel blocks
  - 2 channels guitar/bass DI inputs
  - 8 channels AES input
  - 8 channels AES output
  - SMPTE LTC I/O
  - MIDI I/O
  - 128 channel x 64 bus mixer
  - Integrated DSP
  - Full support for 192k
  - Detailed front panel metering
  - Front panel control with dedicated gain knobs
  - IR remote control support
  - MH EdgeBus card slot
  - MHLink Gigabit Ethernet connectivity
  - USB-C connectivity
  - Low power, cool-running design with no fans
  - Monitor controller: multiple source selection
  - Monitor controller: multiple speaker output selection
  - Monitor controller: output paths can share speakers
  - Monitor controller: per speaker gain and delay
  - Monitor controller: per speaker solo and mute control
  - Monitor controller: output path calibration support
  - Monitor controller: multichannel support from stereo up to 7.1.4 surround (Dolby Atmos)
  - Monitor controller: mono fold-down
  - Monitor controller: mute and dim
  - Monitor controller: analog gain control
  - Monitor controller: talkback
  - Monitor controller: listenback
  - Monitor controller: multiple cue output support
  - Monitor controller: PFL/AFL integration with the mixer
