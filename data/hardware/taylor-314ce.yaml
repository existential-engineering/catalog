details: |-
  One of Taylor's most popular models, the 314ce Grand Auditorium features all-solid construction with a Sitka spruce top and sapele back and sides, producing a rich, sophisticated tone with punchy, shimmering midrange and a warm, woody low-end character.

  Taylor's V-Class bracing adds a boost to power and sustain while improving intonation across the neck. The Venetian cutaway provides easy access to upper frets, and the always-comfortable Taylor neck makes for a smooth feel for any playing style.

  The Expression System 2 pickup captures more of a guitar's dynamic properties using a behind-the-saddle design, enabling nuanced amplified performance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Sapele (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Inlays: Gemstone
  - Scale length: 25-1/2"
  - Binding: Black
  - Pickguard: Black with Firestripe detail
  - Tuners: Taylor Nickel
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
