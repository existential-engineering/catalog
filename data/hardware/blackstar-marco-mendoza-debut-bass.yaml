description: Affordable, compact and amazing sounding practice amps for the beginner.
details: |-
  Renowned for his work with Thin Lizzy, Whitesnake, The Dead Daisies, and SATCHVAI, Marco Mendoza is celebrated for his versatility, feel, and unmistakable stage presence. Having used the Debut Bass 25 from early prototypes, Marco quickly adopted it as his go-to backstage and home practice amp, valuing its tone, simplicity, and portability. The MM Debut Bass 25 brings his personal flair to the amp that supports his everyday playing.

  Debut Bass is the perfect choice for bass players looking for natural tone, no-fuss controls, and great feel. Designed by the same team behind our award-winning guitar amps, the Debut Bass series offers pro-quality tone in a compact, easy-to-use package.

  With a clean channel for warm, punchy tones and an overdrive channel for added grit and growl, the MM Debut Bass 25 makes it easy to find your sound fast. Jam along to your favourite songs via the Line In or get in some late night playing via the rich sounding headphone output.

  All this in a compact and portable package that's perfect for around the house or travelling. The MM Debut Bass 25 strips it back to what really matters - great tone, instant feel, and features that support your playing.

  Plug in your phone, laptop, or tablet via the Line In and play along with your favourite tracks or online lessons. The stereo headphone output gives you the full sound experience without disturbing the neighbours - ideal for late-night sessions or shared living spaces. Whether you're laying down smooth grooves or pushing your tone harder, you've got all the range you need.
specs: |-
  - Artist signature version of Blackstar's intuitive, analogue 25 Watt bass combo
  - Custom Marco Mendoza finish including Bird logo panel, bespoke tolex and fret cloth
  - Power: 25W
  - Speaker: 1 x 8"
  - Channels: Clean and Drive
  - EQ: LOW, MID and HIGH (3-band)
  - Line Out for silent headphone practice
  - Line In (stereo through headphones) for jamming along to music or backing tracks
  - Weight: 8.5kg
  - Dimensions: 350 x 370 x 250 mm
  - Compact, robust and ready for everyday playing
