description: HeadRush Flex Prime is a compact guitar and bass multi-effects
  processor and amp modeler with native Neural Amp Modeler (NAM) support and
  direct TONE3000 access through HeadRush Cloud, giving players a faster way to
  discover, download, and perform with premium amp captures from a global
  creator community.
details: |-
  Flex Prime packs HeadRush tone creation into a pedalboard-friendly format, with a 4-inch touchscreen, multi-core DSP, third-party IR loading, cloning, looping, a built-in drum machine, Bluetooth audio, USB recording and more than 600 amps, cabs, microphones and effects. Native Neural Amp Modeler support plays compatible NAM captures alongside the built-in amp models, HeadRush clones, SuperClones, third-party IRs and tones downloaded through TONE3000.

  Two NAM A2 full captures can play at the same time, through stereo doubling, switch doubling or two separate NAM blocks, and switching the models to A2 lite allows four in a single rig across two dedicated NAM blocks. Tones transfer over USB, Wi-Fi, Dropbox, HeadRush Cloud or direct TONE3000 access, and imported third-party cabinet impulse responses shape speaker, cabinet, microphone and recording character across custom rigs.

  Processing power matches the larger Prime and Core, with up to 14 DSP blocks covering effects, amps, cabs, clones and IRs per preset, in one of 5 signal path types. Presets, setlists, clones and SuperClones created on Prime and Core are compatible with Flex Prime, so sounds move between a main rig and a smaller or backup one. A free copy of the HeadRush ReValver Amp Cloner software, a $199 value, is included for creating clones and SuperClones using ACT (Audio Cloning Technology) Gen II, which can combine several amp or pedal clones into one SuperClone that morphs between them.

  At 3.5 lbs (1.59 kg) the unit fits on pedalboards, in backpacks or in instrument cases, and its chassis is built for rehearsals, recording and live use. Hands-free editing, global EQ, assignable footswitches and Setlists keep a compact rig organized, and the multi-core processor handles gapless preset switching with reverb and delay tail spillover so tails continue ringing when presets change or individual delay and reverb blocks are switched off.

  The looper holds loops of up to 5 minutes with up to 20 minutes of layered audio, saves finished loops as WAV files for export to a Mac or PC, imports WAV backing tracks, combines with the drum machine and syncs to external MIDI devices. The built-in drum machine is powered by Alesis Drums and BFD sounds, with 16 drum kits and 134 styles across 15 genres plus footswitchable fills, accents and transitions. The USB connection works as a 24-bit 96 kHz audio interface for recording and reamping a track back through the pedal.
specs: |-
  - More than 600 amps, cabs, microphones and effects
  - Native Neural Amp Modeler support, 2 NAM A2 full captures at once or 4 A2 lite models across 2 NAM blocks
  - Direct TONE3000 access through HeadRush Cloud
  - Up to 14 DSP blocks per preset across 5 signal path types
  - Preset, setlist, clone and SuperClone compatibility with HeadRush Prime and Core
  - 4-inch touchscreen
  - Third-party cabinet impulse response loading
  - Includes HeadRush ReValver Amp Cloner software with ACT Gen II, a $199 value
  - Looper with 5 minute maximum loop length and up to 20 minutes of layered audio
  - Looper WAV import and export plus MIDI sync
  - Built-in drum machine powered by Alesis Drums and BFD sounds
  - 16 drum kits and 134 styles across 15 genres, with footswitchable fills, accents and transitions
  - 24-bit 96 kHz USB audio interface for recording and reamping
  - Built-in Wi-Fi with HeadRush Cloud and TONE3000 access
  - Bluetooth audio streaming
  - Gapless preset switching with reverb and delay tail spillover
  - Hands-free editing, global EQ, assignable footswitches and Setlists
  - Weight 3.5 lbs (1.59 kg)
  - 1/4-inch instrument input for guitar and bass
  - Dual TRS outputs with amp or line-level operation
  - Stereo FX loop with four-cable method support
  - 1/8-inch MIDI input and output
