url: https://www.klipsch.com/products/flexus-core-300
description: The Klipsch Flexus Core 300 is a 5.1.2-channel Dolby Atmos sound
  bar powered by Onkyo, featuring built-in elevation and side-firing speakers
  for immersive home theater audio. It is the world's first sound bar with Dirac
  Live auto-room correction, delivering 43Hz–20kHz frequency response from a
  single all-in-one unit.
details: |-
  The Klipsch Flexus Core 300 powered by Onkyo is the first-ever sound bar with Dirac Live auto-room correction to create the perfect sound landscape for your space by correcting anomalies in the room. After a quick scan of your room using the Klipsch Connect Plus app, the Core 300 is ready to deliver lifelike audio unlike any other sound bar.

  The Flexus Sound System is a partnership of Klipsch's iconic American audio muscle with the technical precision of Japanese engineering from Onkyo. This collaboration infuses hundreds of years of expertise, innovation, and extensive testing protocols — with the system passing over 1,000 rigorous tests to ensure awesome audio performance and stellar interconnectivity.

  The Core 300 was built for processing the newest movies, shows, and games featuring Dolby Atmos technology via two 2.25" built-in elevation speakers and two 2.5" side-firing speakers. It also provides advanced DTS:X decoding, allowing the soundbar to decode all major audio formats via HDMI input for seamless playback of DTS:X-encoded content.

  The Klipsch Connect Plus app (iOS and Android) streamlines setup and control, offering custom EQ, Night Mode, Dialogue Boost, and firmware updates. The unit is compatible with Control4 and RTI control systems. Music streaming is supported via AirPlay, Google Cast, Spotify Connect, TIDAL Connect, and QPlay over a network connection.
