url: https://www.ibanez.com/usa/products/detail/ptgate.html
description: The Pentatone Gate — a standalone noise-gate pedal derived from the
  GATE section of the Pentatone Preamp, with a high/low threshold-mode switch
  and a dedicated send/return loop for chain-internal noise reduction.
details: |-
  The Pentatone Gate is a standalone version of the GATE section in the Ibanez Pentatone Preamp. This gate achieves a quick response and natural sustain and has an added threshold mode switch which allows you to adjust the threshold in the appropriate range.

  Simple operation is preserved via a single Threshold knob. Four I/O jacks (GUITAR IN/OUT and GATE IN/OUT) allow placing the gate's detection loop around any portion of the signal chain — for example, around a noisy high-gain stage — while keeping the rest of the rig out of the gating action.
specs: |-
  - Controls: Threshold
  - Switches: Threshold mode (High/Low)
  - True bypass
  - I/O: GUITAR IN, GUITAR OUT, GATE IN, GATE OUT
  - Size: 70(W) x 116(D) x 63(H) mm / 2.8 x 4.6 x 2.5 inches
  - Weight: 455g / 1.0 lb (including battery)
  - Required Current: 45mA@9V
  - Power Supply: One 9V battery (006P) or external AC adapter
