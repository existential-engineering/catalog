description: The CL-112H-NEO is a hand-built UK bass cabinet from Ashdown's
  Classic Custom Shop range, pairing a premium B&C 12-inch neodymium speaker
  with a high-frequency horn and three-way crossover for 700 watts of
  articulate, resonant tone. Its rigid birch ply cabinet with a tuned
  bass-reflex port delivers tight, dynamic lows, while Buffalo Tolex, silver &
  blue cloth, and chrome corners showcase Ashdown's heritage style. Lightweight
  construction and genuine Neutrik connectors make it a professional-grade cab
  for stage and studio.
