details: |-
  The world's greatest hollow body guitars just got even better. Designed from the ground up for modern players yet retaining all the timeless sound and style that made the 6120 famous, the G6120TG Players Edition Nashville Hollow Body with String-Thru Bigsby and Gold Hardware is a perfect pairing of art and performance.

  All-new FT-67 Filter'Tron humbucking pickups have been designed for authentic vintage Gretsch voicing but with a more well-rounded tone for modern playing styles. The innovative "ML" bracing delivers huge hollow body sound from the comfortable 2.5"-deep maple body. The control setup includes separate bridge/neck volume controls, three-way pickup toggle, no-load master tone, and master volume, along with a Squeezebox capacitor and treble bleed circuit.

  A 12"-radius ebony fingerboard with 22 medium jumbo frets top a 24.6"-scale maple neck with standard "U"-shaped profile. Luminlay side dots improve low-light fretting. The Bigsby B6GP string-through vibrato makes string changes quicker and easier, while the Adjusto-Matic bridge with Graph Tech TUSQ XL nut delivers maximum tuning stability.

  Gold hardware throughout includes Gotoh locking tuning machines and G-arrow control knobs. The white bound neck, body and F-holes are complemented by pearloid Neo-Classic thumbnail inlays and a gold plexi pickguard with black Gretsch logo and Nashville post sign.
