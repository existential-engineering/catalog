details: |-
  The GAV19T 2x12 speaker cabinet is a closed back British style enclosure, available as slanted or straight faced. This guitar speaker cabinet is constructed using Baltic Birch wood, 1/4" finger joints, and covered in the same rich Red Garnet Tolex as used on the GAV19T guitar amplifier. The speaker enclosure is elegantly lined with all black piping, and the grill cloth is a black cane small weave.

  Guitar amplifier speakers contribute to the experience. After thorough listening and testing sessions the following speaker options proved to offer great tonal combinations with the GAV19T amp: Celestion Vintage 30, Celestion Heritage G12H-30 watt 55 Hz, Celestion Alnico Gold, and Celestion G12M-65 Creamback.

  The two twelve inch guitar speakers are mounted in a diagonal configuration and wired in series as a 16 Ohm cabinet. The cabinet ships without speakers installed, allowing users to select their preferred Celestion speaker option.

  This product was discontinued effective January 5, 2022, and is listed under Chandler Limited's Legacy Products category. It was designed to pair with the GAV19T guitar amplifier head.
