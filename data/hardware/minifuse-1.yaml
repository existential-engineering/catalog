description: >
  Time to record the song, the beat, or the content you’ve always wanted to. MiniFuse 1 is the compact audio interface designed to work for you, whatever your style. Get your sound out there with simple recording, a fun workflow, and all the creative software you’ll ever need.
details: |-
  Minifuse 1 is a compact, portable solo audio interface designed for musicians, producers, podcasters, and content creators. It bridges the gap between creative ideas and finished products with straightforward connectivity and an intuitive workflow. The interface features a single combo xlr/1/4 jack input with 48v phantom power support, two balanced line outputs, and a stereo headphone output, all controlled through backlit knobs that provide real-time color-coded feedback when signal levels are too high.

  The audio quality is exceptional with a 110db dynamic range and class-leading -129db equivalent input noise, ensuring studio-grade recordings with rich dynamics and clear, noise-free signals. The interface includes a direct monitor switch for real-time input monitoring, an instrument level switch for consistent signal across different input types, and a vu meter for visual level feedback. Virtual loopback channels enable seamless audio capture for content creation, with windows users gaining access to three independent stereo loopback channels with individual mixers.

  Minifuse 1 connects via USB-c to both pc and mac computers, with full USB 2.0 compatibility and an additional USB-a hub port for connecting MIDI controllers and other devices. The rugged aluminium casing and compact design (43 x 154 x 100 mm, 0.34 kg) make it ideal for mobile production workflows, while the 5-year hardware warranty reflects arturia's confidence in its durability and reliability. The interface is backed by comprehensive support including video tutorials, a dedicated minifuse control center app for monitoring inputs, outputs, and firmware updates, and exclusive producer sessions.

  The software bundle includes ableton live lite for composition and production, analog lab intro with 500 vintage and modern keyboard presets, and four premium arturia fx plugins: rev plate-140 reverb, pre 1973 vintage preamp, delay tape-201 echo, and chorus jun-6 analog chorus. Additional subscriptions provide access to native instruments guitar rig for guitar processing, a 3-month subscription to auto-tune unlimited for vocal tuning, and a 3-month splice creator plan with royalty-free samples and tutorials. The included software represents professional-grade tools used by music and audio professionals worldwide.
specs: |-
  - 1x combo xlr/1/4 jack input with 48v phantom power
  - 2x 1/4 inch trs balanced line outputs
  - 1x stereo headphone output with 1/4 jack
  - 1x USB-c interface connection
  - 1x USB-a hub port (250ma max)
  - 110db dynamic range
  - -129db equivalent input noise
  - Gain control with backlit knobs
  - Instrument level switch
  - Direct monitor switch
  - Vu meter with color-coded feedback
  - Stereo virtual loopback channel
  - 3x stereo virtual loopback channels with independent mixer (windows-only)
  - USB 2.0 compatible
  - Pc and mac compatible
  - Windows 10+ or later (64-bit)
  - Macos 10.13 or later (64-bit)
  - 4gb ram minimum (8gb+ recommended)
  - 64-bit intel core or amd multi-core processor (i5 or faster recommended)
  - Rugged aluminium casing
  - Compact and lightweight design
  - Size: 43 x 154 x 100 mm (1.69 x 6.06 x 3.94 inches)
  - Weight: 0.34 kg (0.75 lb)
  - 5-year hardware warranty
  - Line input impedance: 16k
  - Line input maximum level: +22dbu
  - Line input gain range: 56db
  - Line input frequency response: 20hz to 20khz ±0.05db
  - Instrument input impedance: 1m on tip
  - Instrument input maximum level: +11.5dbu
  - Instrument input gain range: 56db
  - Instrument input frequency response: 20hz to 20khz ±0.06db
  - Microphone preamp input impedance: 2.5k
  - Microphone preamp maximum input level: +9dbu
  - Microphone preamp gain range: 56db
  - Microphone preamp frequency response: 20hz to 20khz ±0.06db
  - Speaker output impedance: 94
  - Speaker maximum output level: +12dbu
  - Speaker frequency response: 20-20khz ±0.09db
  - Headphone output impedance: 10
  - Headphone maximum output level: +11.4dbu
  - Headphone frequency response: 20-20khz ±0.09db
  - Headphone power at 33 ohm: 137mw
