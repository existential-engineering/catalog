details: |-
  Traditional, internal acoustic microphones have historically been trapped by physics. Enclosed inside your instrument, the sound reflections inside the guitar body make the mic sound boxy and sensitive to feedback, even at low volumes. The Lyric changed the rules. Built on the revolutionary technology of our Anthem System, the Lyric cancels out the internal reflections of the guitar, delivering a lifelike balanced sound, with stronger feedback resistance engineered for live stages.
specs: |-
  - Internal condenser microphone system with pro-grade capsule
  - Patented TRU-MIC noise-cancelling technology
  - Capsule suspended by a shock mount, positioned 3mm from the bridge plate
  - Active, High-Grade FET input, all-discrete preamp
  - Controls: Volume, Mic Presence
  - 9V battery
  - 1/4-inch endpin output jack
  - Steel-string / 12-string model and separate nylon-string model
  - U.S. Patent 8,989,399; requires professional installation
