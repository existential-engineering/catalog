description: The BE-100 Deluxe is a hand-wired three channel, 100 watt all-tube
  guitar head built around Dave Friedman's BE circuit. It adds a
  Smallbox-inspired plexi clean channel, separate gain and master controls for
  the BE and HBE channels, and power section tone shaping through response,
  frequency and thump controls.
details: |-
  For over a decade Dave Friedman's BE circuit has been hailed as the epitome of British tone. In recent years this tonal infusion has made the BE-100 the most popular and sought after 100 watt boutique amp by a mile. The BE-100 Deluxe, like its little brother the BE-50 Deluxe, takes the BE circuit to a whole new level.

  All of the astoundingly flexible and gorgeous-sounding tonal characteristics of the original BE-100 are on tap with the deluxe model, which is now a fully featured three channel amp. An additional gain and master for the HBE channel, a new plexi clean channel borrowed from the coveted Smallbox amp, and new tone shaping tools including a response switch, thump frequency switch and thump knob are just some of the features on Friedman's flagship amp.

  Friedman's BE and HBE drive channels have earned their reputation for high-gain crunch, clarity and nuance. The deluxe model doubles this up with two separate gain and master controls, so the wide spectrum of each circuit can be explored. The completely new clean channel is inspired by the plexi channel of the Smallbox amp: it cleans up nicely, and it can bring out that iconic plexi grit, shaped with the gain, volume and three band EQ controls.

  The BE-100 Deluxe grants complete control of the three preamp channels and of the critical power section as well. That flexibility starts on the front panel, where the amp's overall character is tuned with a presence knob, three position switches for frequency and response, and a thump knob control. These tools finely sculpt the overall tone of the power section, in effect an EQ for the power amp.

  Effects loops can suck tone. Friedman has un-sucked that problem with one of the most transparent effects loops in the business: plug into it and it is not noticeable at all.
specs: |-
  - 100 watt all-tube head
  - Three channels: BE, HBE and Smallbox-inspired Plexi
  - Hand-wired in the USA
  - 4 x EL34 power tubes
  - 5 x 12AX7 preamp tubes
  - BE channel: Gain, Master, Bass, Middle, Treble (EQ shared with the HBE channel)
  - HBE channel: Gain, Master, Bass, Middle, Treble (EQ shared with the BE channel)
  - Plexi channel: Gain, Volume, Bass, Middle, Treble and fat switch
  - C45 voicing switch for the BE and HBE channels
  - Saturation switch adds saturation
  - Voice switch varies top end response
  - Gain Structure switch lowers the gain of the BE and HBE channels
  - Presence knob
  - Response switch varies negative feedback
  - Frequency switch changes the frequency of the Thump knob
  - Thump knob varies the low end response of the amp
  - Ultra-transparent series effects loop
  - Two button footswitch for channel selection
  - 4, 8 and 16 ohm impedance selector switch
  - Dimensions 8.75 in (D) x 29.25 in (W) x 12.25 in (H)
  - Weight 43 lbs
  - Limited lifetime warranty
