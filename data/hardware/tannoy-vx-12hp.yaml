details: |-
  The VX 12HP is built around a single 300 mm (12") PowerDual driver mounted within a compact, rugged plywood cabinet, renowned for its exceptional performance and versatility. The latest high power-handling version of Tannoy's exclusive point source, constant directivity PowerDual technology ensures high power output with high sensitivity and exceptional efficiency. The point source driver technology delivers exceptionally smooth beam-width characteristics resulting in an even coverage pattern aiding predictable system design. Symmetrical dispersion characteristics enhance speaker placement flexibility, allowing vertical or horizontal mounting of single or multi-cabinet arrays without compromise in sound quality. The VX 12HP is ideally suited for complimenting much larger systems, making it an excellent choice for both installed and portable applications. The VX 12HP can also be configured for bi-amp operation.
specs: |-
  - frequencyResponse: 80 Hz – 25 kHz (±3 dB) / 60 Hz – 30 kHz (−10 dB)
  - powerHandlingPassive: 350 W continuous, 1,400 W peak
  - powerHandlingBiampLF: 350 W continuous, 1,400 W peak
  - powerHandlingBiampHF: 80 W continuous, 320 W peak
  - sensitivity: 97 dB (1 W @ 1 m)
  - maximumSplPassive: 123 dB continuous, 129 dB peak
  - nominalImpedanceLF: 8 Ω
  - nominalImpedanceHF: 8 Ω
  - crossoverType: Passive / Bi-amp switchable
  - dimensionsHxWxD: 487 × 371 × 361 mm (19.2 × 14.6 × 14.2")
  - netWeight: 20 kg (44.0 lbs)
  - construction: 15 mm (5/8") enclosure sides / 18 mm (3/4") front, plywood, vented and internally braced
