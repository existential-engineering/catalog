description: A plate reverb pedal whose proprietary algorithm models the soft,
  floaty character of a large steel plate. A Jack Deville original design,
  limited run of 65 pieces.
details: |-
  Plate reverb emerged in the late 1950s as an early outboard way to recreate
  natural reverberation without a dedicated echo chamber. A transducer drives a
  large slab of metal into vibration, and pickups capture the plate's movement,
  producing the soft, immediate and floaty sound that plate reverb is known for.

  The Black LTD. Plates recreates that behavior in a pedal roughly the size of a
  deck of cards. Its proprietary algorithm models the movement of a large piece of
  steel driven by the instrument at its input, capturing the hundreds of thousands
  of reflections that travel across and through the plate and gradually decay,
  recreating the feel of an 18-square-foot slab of metal vibrating with the
  instrument.

  Rather than mimic any one specific outboard unit, Plates captures plate reverb in
  general form so the player can tune it to taste. Because the process is complex
  and natural, no two notes ring exactly the same.

  Three simple controls give full command of the effect: WET/DRY sets the ratio of
  instrument to reverberations, DECAY sets how long the reverberations continue,
  and HF DAMP is a gentle high-frequency dampening circuit for softening the treble
  response. Powered by industry-standard 9V pedal power or an optional internal 9V
  battery. Jack Deville original design, limited run of 65 pieces.
specs: |-
  - Proprietary plate-reverb modeling algorithm
  - Controls: WET/DRY, DECAY, HF DAMP
  - Compact deck-of-cards-sized enclosure
  - Limited run of 65 pieces
  - Jack Deville original design
  - 9VDC 2.1mm negative center-pin power or internal 9V battery
