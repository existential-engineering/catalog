description: A feedback loop pedal that routes other pedals' output back into
  their input to create self-oscillating, boosted feedback effects.
details: |-
  TOTALLY SONICALLY ANNIHILATED ⇗⇗ the feedback looper of your dreams ⇘⇘ ⇖⇖ sǝɹɐɯʇɥƃᴉu ɹnoʎ ɟo ɹǝdool ʞɔɐqpǝǝɟ ǝɥʇ ⇙⇙ The TSA2 works on a simple premise: what if effect pedals were patched back into themselves? What does it sound like for a filter to be multiplied by infinity? Or if your modulator was modulating its own modulations? The TSA2 creates a controllable feedback loop, causing your pedals to cycle back on themselves, feeding the output back into the input as much or as little as you want. Experience true sonic exploration: every unique pedal array will produce a vast world of textures and possibilities. Details If you've used a feedback loop pedal before, (like the 1st edition of the Total Sonic Annihilation) then you know the vast world of insane and wild sounds you can get. With this new updated version of the original, the ACTIVE BOOST maximizes usability for many applications where the original fell short. For example, if the effect in the feedback loop is out of phase with itself, the loop would turn the pedal into a volume or blend pedal and be somewhat disappointing. With the TSA2, just flip the PHASE switch and all of a sudden those once dormant possibilities are awakened! The BOOST also has a boatload of gain to awaken even the faintest effect into an unearthly behemoth, and a LIMITER to tame the most unruly beast into a purring kitten. Experiment with as many different pedals in the FEEDBACK loop for unique and incredible results! Controls FEEDBACK The big knob. This controls the amount the SEND (external effect input) is forced back into the RECEIVE (external effect output). This creates feedback within the circuit to create new unbridled, experimental effects and results. The more this knob is turned up the more intense and explosive the effects will be. The ACTIVE BOOST is also in this loop and (if engaged) will be forced back into itself to create its own wild and interesting sounds if nothing is plugged into the loop. ON In the ON position, this toggle switch activates the ACTIVE BOOST circuit. PHASE Flips the phase of the effects loop, only when the ACTIVE BOOST is on. GAIN Controls the amount of gain of the ACTIVE BOOST circuit. LIMIT Limits the output volume of the entire pedal only when the ACTIVE BOOST is engaged. STOMP SWITCH Bypasses the effect. NOTE: When the TSA2 is turned off the TSA2 is bypassed but every pedal in the loop is still part of your signal chain. Any effect(s) in the loop works as usual. Connections INPUT Plug an instrument into this jack. OUTPUT The output of the Total Sonic Annihilation 2 is here. It connects to your amplifier. SEND Connect this to the input of the effect (or chain of effects) you would like to control and warp. If left unconnected it is connected internally to the receive jack. REVEIVE This is connected to the output of the effects in the feedback loop. 9V Plug a 9V Negative Tip Positive Ring DC adaptor in here. When plugged in it will bypass the internal battery. NOTE: When the ACTIVE BOOST is not engaged, the pedal is completely passive and can work without power. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 5 mA Physical Details Dimensions: 4.83" x 2.69" x 2.48" (including hardware) Weight: 11 oz.
