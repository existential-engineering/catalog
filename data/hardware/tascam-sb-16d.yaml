name: SB-16D
manufacturer: tascam
primaryCategory: audio-interface
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/sb-16d
description: 16-in/16-out Dante stage box featuring 16 XLR microphone/line
  inputs and 16 XLR line outputs with integrated 32-bit ADCs and Class 1 HDIA
  microphone preamps. Supports Dante Domain Manager, AES67, and SMPTE ST 2110
  with redundant etherCON Dante ports. Can be floor or 3U rack-mounted and
  controlled remotely via TASCAM IO Control app or Sonicview mixers.
details: |-
  The SB-16D is a 16-in/16-out Dante stage box featuring 16 Class 1 HDIA microphone preamps with +48V phantom power on each input. 32-bit ADC conversion supports sample rates up to 96kHz.

  Primary and secondary etherCON Dante ports (1000BASE-T) provide redundant network connectivity. The unit supports Dante Domain Manager, AES67, and SMPTE ST 2110 interoperability.

  GPIO expansion provides 8-in/8-out control signals via D-Sub 25-pin connector, expandable to 16-in/16-out with a second unit. Both AC (100–240V) and DC (11–27V) power inputs are available, supporting redundant power supply configurations.

  The SB-16D can be floor-mounted or installed in a standard 3U rack (brackets included). Remote preamp gain control is available via TASCAM IO Control app (macOS, Windows, iPadOS) and direct integration with TASCAM Sonicview 16XP and 24XP mixers.
specs: |-
  - - Mic preamp EIN: -128 dBu or less
  - Max input level: +32 dBu (PAD on), +12 dBu (PAD off)
  - Input impedance: 5.0 kΩ minimum
  - Nominal output level: +4 dBu / +6 dBu (switchable)
  - Max output level: +15 to +24 dBu
  - Output impedance: 100Ω or less
  - THD+N: 0.002% or less
  - Frequency response (48kHz): 20Hz–20kHz ±0.5dB
  - Frequency response (96kHz): 20Hz–40kHz ±1.0dB
  - Dynamic range (Mic→Dante): 110 dB or more
  - Crosstalk: 100 dB or greater
  - Dante channels (48kHz): 64; (96kHz): 32
  - Dante ethernet: 1000BASE-T (IEEE 802.3ab)
  - GPIO: 8-in/8-out (open collector out, pull-up 5V in, 35mA max)
  - AC power: 100–240V, 50/60Hz; DC power: 11–27V
  - Power consumption: 44W
  - Rack size: 3U
  - Dimensions (rack): 482.8(W) x 132(H) x 120(D) mm
  - Weight: 4.5 kg
  - Operating temp: 0–40°C
