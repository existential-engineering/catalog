details: |-
  The DP4 is a perfect complement of dynamic microphones for close miking of a variety of sources on-stage or in the studio. Included in the DP4 microphone package are the D6, AUDIX's flagship dynamic kick drum microphone, and three i5s, AUDIX's best-selling instrument microphone. Also included are three DFLEX mic mounts for easy attachment to a wide variety of instruments. All microphones and clips are conveniently packaged in a foam-lined aluminum carrying case for travel and safekeeping when the microphones are not in use. The case also features three additional expansion slots for vocal microphones.
specs: |-
