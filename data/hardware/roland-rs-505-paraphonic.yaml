description: >-
  The Roland RS-505 Paraphonic is a versatile keyboard from 1978 that combines a
  fully polyphonic string section with a basic polysynth and bass section,
  widely regarded as one of Roland's finest string synthesizers.
details: |-
  Released in 1978 as the successor to the RS-202, the Roland RS-505
  Paraphonic expanded the string machine concept by adding a basic
  synthesizer section and a dedicated bass section alongside the
  traditional strings. This three-section design gave players considerably
  more tonal range than a typical string machine of the era.

  The 49-key keyboard is split down the middle, allowing different sounds
  to be assigned to the upper and lower halves. The synth section includes
  its own VCO with four preset waveforms, a voltage-controlled filter with
  cutoff and resonance controls, an LFO for modulation, and a full ADSR
  envelope. The bass section offers three preset sounds with a simpler AR
  envelope.

  The strings section provides two preset string voices with the lush
  ensemble chorus effect that was a hallmark of Roland's string
  synthesizers. All three sections can be blended together, creating rich
  layered textures that range from pure string pads to more complex
  evolving sounds.

  An external audio input allows other instruments to be routed through
  the RS-505's ensemble effect, making it useful as a signal processor as
  well. CV and gate connections provide integration with other analog
  equipment. The combination of accessible preset sounds and hands-on
  synth controls made the RS-505 a practical and musical instrument that
  remains highly sought after by collectors and musicians.
specs: |-
  - Polyphony: Full (strings and bass), Paraphonic (synth)
  - Oscillators: 1 VCO per section (Synth, Bass, Strings)
  - Filter: VCF with cutoff and resonance (synth section)
  - LFO: 1 (synth section)
  - Envelopes: ADSR (synth), AR (bass)
  - Presets: 2 Strings, 3 Bass, 4 Synth waveforms
  - Effects: Ensemble chorus
  - Keyboard: 49 keys, split
  - Connections: VCF CV In, Trigger, Gate, External Audio In
  - Form Factor: Portable keyboard
