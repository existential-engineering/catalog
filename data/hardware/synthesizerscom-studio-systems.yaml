description: >-
  Synthesizers.com Studio Systems are custom analog modular synthesizers built in the USA
  using Moog-compatible form factors with modern reliability and upgraded power supplies.
  Available in QSS22 (22-space) and QSS44 (44-space) wood cabinet configurations with an
  optional 5-octave MIDI-to-CV keyboard, the systems feature hyper-modularity allowing
  unrestricted module placement. They deliver classic analog synthesis with modern
  engineering, making them a practical alternative to vintage modular systems.
details: |-
  The Synthesizers.com Studio Systems represent a contemporary approach to analog modular synthesis, combining traditional patching architecture with modern engineering and reliability. The company, established in 2000, manufactures these systems in the USA and offers two primary configurations: the QSS22 with a 22-space wood cabinet and the QSS44 with a 44-space cabinet, both featuring an optional QKB15S 5-octave keyboard providing MIDI-to-CV and Gate conversion.

    A key advantage of the Studio Systems is their form-factor compatibility with original Moog Modulars. Synthesizers.com modules integrate seamlessly into Moog systems with matching signal levels, making them ideal for expanding vintage setups or building new systems with proven architecture. The systems emphasize hyper-modularity, allowing unrestricted module placement without additional patching or power modifications.

    The module designs incorporate reversible attenuators and mixers to minimize patch cable clutter and make patching more intuitive. Oscillators provide stable tracking across multiple octaves, while the 24dB ladder filter, state variable filter, and 14-bank fixed filter options offer flexible tone-shaping capabilities. The 24-step analog sequencers support daisy-chaining for extended sequences.

    These systems appeal to synthesis educators and practitioners seeking reliable vintage-style systems without the instability of original equipment. Systems are fully expandable with additional modules and cabinets, and are comparatively affordable relative to vintage Moog modulars. Portable (QSP) and rack mount (QSR) configurations are also available.
specs: |-
  - Polyphony: Monophonic (duophonic with optional keyboard)
    - Oscillators (QSS22): 3x Q106 Analog Oscillator
    - Oscillators (QSS44): 6x Q106 Analog Oscillator
    - Waveforms: Sine, Triangle, Sawtooth, Ramp, Pulse
    - Noise Generator: Q110 (White, Pink, Low Frequency)
    - LFO: Q106 Oscillator, Q117 Sample and Hold
    - Lowpass Filter: Q150 Transistor Ladder Filter (24dB/oct)
    - Multimode Filter: Q107 State Variable (12dB/oct LP/BP/HP, 6dB/oct Notch)
    - Fixed Filter Bank: Q127 (14-band)
    - Ring Modulator: Q116
    - VCA: Q108 Amplifier
    - Envelope Generator: Q109 ADSR
    - Sequencer: Q119 24-step Analog (daisy-chainable)
    - MIDI Interface: Q104 (MIDI In, Gate Out, Trigger Out, Pitch Out, Velocity Out)
    - Keyboard: Optional QKB15S 5-octave (Mono/Duophonic)
    - Cabinet Options: QSS22 (22-space), QSS44 (44-space)
    - Utility Modules: Q105 Slew Limiter, Q112 Mixer, Q113 8-Channel Mixer, Q115 Reverb, Q124 Multiples
    - Memory: None
    - Country of Origin: USA
