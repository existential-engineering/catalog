details: |-
  The goal in creating the ZIO Analog Front End + Boost was simple yet ambitious: "Make Everything Sound Better!" ZIO is an all-analog preamp/boost pedal that includes a choice of four distinct preamp circuits, each with up to +20dB of additional output boost. It is Source Audio's first all-analog effects pedal, designed in collaboration with Christopher Venter of SHOE Pedals.

  ZIO is a deceptively flexible unit that can serve many purposes at various places in your signal path: at the front of your chain to shape outgoing tone, after your drive pedals as a tone sweetener or clean volume boost, at the end of your pedalboard to drive a long cable run, or in an amp's effects loop to drive the power amp harder. The name "ZIO" is an acronym for Impedance (Z), Input (I), and Output (O): the pedal takes a guitar's high impedance signal, sweetens the tone, and outputs a strong, low impedance signal.

  Its four preamp circuits are: JFET (a completely transparent signal boost with zero coloring), Low-Cut (reduces tubby bottom-end for a tighter sound), Studio (inspired by the "Pultec Trick" for added clarity), and E-Plex (captures the focused, subtle grit of vintage Echoplex Tape Delay preamps).

  The TONE toggle offers three levels of capacitance (simulated cable length): BRIGHT, MED (roughly 15 feet), and DARK. High-fidelity Burr-Brown op amps deliver clarity and responsive pick dynamics while maintaining body and warmth.
specs: |-
  - Four distinct preamp circuits: JFET, LOW-CUT, STUDIO, E-PLEX
  - High quality components and Burr Brown JFET op-amps
  - Output control with up to +20dB of signal boost
  - 3-way Tone toggle switch with bright/medium/dark cable capacitance voicing
  - 2-way Footswitch Action toggle switch (with always-on "Mute" option)
  - Extra Tuner/Line Output
  - True Bypass
  - Input Impedance: 1 Mega Ohm (1 MOhm)
  - Output Impedance: 150 Ohm
  - Power consumption: 9V DC center negative @ 20mA
  - Brushed anodized aluminum housing
  - Dimensions: L: 4.1 in./10.5cm x W: 2.36 in./6cm x H: 2.22 in./5.65cm (including knobs)
