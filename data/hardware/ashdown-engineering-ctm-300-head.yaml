description: Hand-built in the UK Custom Shop, the CTM-300 delivers 300 watts of
  all-valve power through six KT88 output tubes and a five-valve preamp,
  spanning smooth vintage warmth to modern punch. It features Deep, Mid Shift
  and Bright switches, a user-adjustable bias with a dual-function VU meter,
  individually fused tubes, a tube-driven DI output and a front-mounted FX loop,
  housed in marine-grade birch ply.
details: |-
  Hand-built in the UK Custom Shop, the CTM-300 is a 300 watt all-valve bass amplifier head driven by six KT88 output tubes and a five-valve preamp, offering everything from smooth 1960s warmth to 1970s growl and modern punch. It is housed in rugged marine-grade birch ply with heavy-duty handles and features Deep, Mid Shift and Bright switches, a user-adjustable bias with a dual-function VU meter, and individually fused tubes for easy maintenance. A tube-driven DI output and front-mounted FX loop combine vintage character with modern reliability. All UK-built products are made to order with an approximate 20-day lead time.
specs: |-
  - Power output: 300 watts (all-valve)
  - Output tubes: 6 x KT88
  - Preamp: five-valve
  - User-adjustable bias with dual-function VU meter
  - Individually fused tubes
  - Deep, Mid Shift and Bright switches
  - Tube-driven DI output
  - Front-mounted FX loop
  - Marine-grade birch ply enclosure with heavy-duty handles
