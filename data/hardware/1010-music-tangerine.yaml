description: Get powerful sampling capabilities in the nanobox form factor. With
  the sampling features of nanobox | tangerine, you can add interesting new ways
  of generating sound and music to your desktop or travel rig. Trigger one
  shots, play time synced loops or record live looping. The nanobox | tangerine
  can use one shots to play hip rhythms, or huge multi-samples to play soulful
  melodic tunes.
details: |-
  The nanobox | tangerine is a compact streaming sampler that plays up to 24 stereo polyphonic notes from 64 MB of internal memory, or up to 8 larger stereo samples streamed directly from a microSD card (max sample size 4 GB). It supports multi-sample banks with up to 16 velocity layers and 576 WAV files per preset, across 8 configurable stereo sample pads that can act as single/multi-samples, clips, slicers, or new recordings. Playback can be triggered via the touch screen or MIDI, using trigger, toggle, gate, or piano launch modes, with deep parameter control over start position, length, pitch, level, filter, loop mode, launch quantization, ADSR, exclusive grouping, clip synchronization, slice placement/sequencing, and MIDI note/channel mapping.

  Recording features include per-pad stereo or mono recording synced to clock inputs, level-threshold triggering, loop-length recording, immediate playback for live looping, and up to 16 recording sequence layers per preset with recordings up to 4 hours long. The device also supports master output resampling without external patching.
specs: |-
  - Power: USB-C connection, 5V, 500mA
  - Audio I/O: 3.5mm input and output
  - Maximum input and output level: 2Vrms
  - DAC and ADC resolution: 24-bit
  - Internal resolution: 32-bit
  - Sample rate: 48kHz
  - MIDI Input: 3.5mm Type A/B auto-sensing
  - MIDI Output: 3.5mm, Type A or Type B selectable
  - Clock Input: 1, 2, 4, 8, 12, or 24 PPQ selectable
  - MIDI support: Program Change, Note On/Off, Velocity, Mod Wheel, Aftertouch, CC mappings to common parameters, program changes, and clock
  - Dimensions (H x W x D): 1.5" x 3.75" x 3"
  - Weight: 0.25 lbs
  - Display: 2" touch screen, 2 knobs, and 4 buttons
