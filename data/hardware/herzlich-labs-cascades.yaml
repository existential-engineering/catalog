description: A compact 10hp 4x3 matrix mixer for routing up to four input
  signals to three destinations with simultaneous full mixdown.
details: |-
  Matrix mixing, but without the space commitment of a larger matrix mixer. You know what I love? Matrix mixers. But you know what problem I had? The whole size-and-shape aspect of introducing a matrix mixer into my system. I love these things, but they're often big, chunky apparatuses that demand an inordinate amount of space, even when their utility is taken into account. For that reason, and that reason alone, I stayed up many late nights to concoct a matrix mixer with a more humble footprint, yet one that also made no compromises on architecture or signal quality. I love matrix mixers so much, but I mentioned that already. Cascades is just another one of those - a particularly good one, of course, but importantly also one that will be very respectful of your limited rackspace, without compromising usability or, like, bowing or wobbling when you touch it or something, that would be weird.
specs: |-
  - Mix up to four input signals to three discrete destinations in any way you like
  - Independent full mixdown is simultaneously available
  - High grade component selection and architecture
  - Built like a tank, skiff friendly rigid-chassis construction
  - Your best friend for feedback patching
