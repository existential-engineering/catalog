details: |-
  DESCRIPTION

  It's finally here! One of the most requested new models over the past 5 years, and Dennis Fano really delivered on this one…Introducing the Mondata Bass. Featuring a slim taper set roasted maple neck with medium C profile, ultra lightweight Simarouba body with raised center block & 2 x Rivolta Fumante pickups. Based around the same 32" scale platform as our hugely successful Combinata Bass VII, the Mondata Bass is lean, mean and undeniably cool. The Rivolta Mondata Bass includes a Rivolta custom form-fitted hardcase, offering premium protection for your guitar. Case candy comes in the form of a Rivolta Guitars pick, sticker, pin badge, truss rod tool and warranty card. FEATURES & SPECS

  Rivolta Custom Hardshell Case - INCLUDED
