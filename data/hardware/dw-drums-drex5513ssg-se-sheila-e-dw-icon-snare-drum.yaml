description: This DW Collector's Series Icon was created to pay homage to legendary DW artist Sheila E.
details: |-
  DW is excited to announce the Sheila E. Collector's Series ICON Snare Drum. A groundbreaking, generational, and GRAMMY-winning percussionist, Sheila "Sheila E." Escovedo descended from the Escovedo musical family and rocketed to fame through collaborations with Prince and her seminal 1984 album, The Glamorous Life.

  Sheila's Icon 13″ snare is built with a handcrafted 12-ply North American Hard Rock Maple shell featuring HVLT grain orientation, which is enveloped in a veneer of hand-selected birdseye Maple. The striking exterior is fitted with gold inlays of Sheila's signature backwards "E." along with a kaleidoscope of laser-cut and dyed butterflies crafted from Basswood (blue, red, and purple), Pearwood (black), and Poplar (orange). These ornate multi-colored butterflies pay tribute to a personal symbol of Sheila's musical journey.

  This limited-edition 5.5x13″ snare drum is also fitted with premium gold DW hardware and features a patented MAG Throw-off, five-position (5P) butt plate, True-Hoops, and True-Pitch 50 tuning rods. The resulting performance features higher tonality with a classic punchy and warm character.

  Only 250 units of this remarkable drum will be produced, and each includes a deluxe 13″ DW snare bag and a signed certificate of authenticity from John Good.

  DW salutes "The Queen of Percussion," Sheila E., with this special snare drum.
