description: >-
  The Spectral Audio ProTone is a monophonic true analog synthesizer from the mid-nineties
  designed for the modern MIDI studio. It features two analog VCOs, a resonant
  high/low-pass filter with selectable slope, a flexible LFO, and both MIDI and CV/Gate
  connectivity. Every parameter is accessible via front-panel knobs and switches with no
  hidden menus, making it a hands-on sound design instrument.
details: |-
  The ProTone is a hands-on tweaker's synthesizer from Spectral Audio that emphasizes direct control over all sound parameters. Its architecture centers on analog circuitry paired with modern MIDI connectivity, making it suitable for integration into contemporary production setups. The unit has no on-board program memory, requiring real-time sound design rather than preset recall.

    Each of the two analog VCOs provides sawtooth and pulse waveforms with independent tuning, waveform selection, and level control. White noise generation is available from VCO1, and the oscillators support synchronization and ring modulation for complex tonal possibilities.

    The voltage-controlled filter allows selection between high-pass and low-pass filtering with switchable slopes of 12 or 24 dB per octave. An Accent feature provides a decay envelope specifically for filter modulation, enabling dynamic tonal sweeps. The LFO offers six waveforms including rectangle, impulse, triangle, sawtooth, and sine, plus noise and random options, with a range spanning 0.005 to 3800 Hz for both slow modulations and audio-rate effects.

    Connectivity includes MIDI In/Out for sequencer integration alongside traditional CV/Gate I/O for compatibility with vintage gear. External VCO and LFO inputs allow modulation from outboard sources. The ProTone produces fat analog bass and synth sounds with a squelchy filter, positioning it as a cost-effective, reliable, and unique dual-VCO analog mono-synth.
specs: |-
  - Polyphony: Monophonic
    - Oscillators: 2 analog VCOs with sawtooth and pulse waveforms
    - Noise: White noise generator on VCO1
    - Ring Modulator: True ring modulator
    - LFO: 1 LFO with 6 waveforms plus noise and random; range 0.005-3800 Hz
    - LFO Targets: VCO1, VCO2, VCO1 pulse width, cutoff, panorama
    - Filter: High-pass and low-pass with resonance, selectable 12 or 24 dB/octave
    - Filter Accent: Decay envelope for filter modulation
    - VCA Envelope: ADSR
    - Effects: Slide (portamento)
    - Memory: None
    - Keyboard: None
    - Arpeggiator/Sequencer: None
    - Control: MIDI In/Out, CV/Gate In/Out
    - External Inputs: VCO and LFO modulation inputs
    - Outputs: Stereo audio output
