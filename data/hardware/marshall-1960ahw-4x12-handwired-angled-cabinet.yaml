description: Handwired 4x12" angled guitar speaker cabinet — the angled (top) half of the handwired full stack and the dedicated companion to the 1959HW Super Lead 100 head. Loaded with four Celestion G12H-30 speakers, the 1960AHW handles 120W with a 15Ω mono speaker output, voiced to recreate the late-60s Marshall stack tone behind the era's defining rock and blues records.
details: |-
  Get that 60s feeling with the brilliantly retro 120W angled 1960 handwired cabinet. It's compatible with the affectionately handwired 1959HW. Four 12-inch Celestion G12H 30 speakers offer tight low-end frequencies, a mid-range punch and stunning highs to truly complement that 60s sound.

  This cabinet is also available as a straight base cab, allowing you to create your own Marshall stack.

  Designed and engineered in UK. Made in UK.
