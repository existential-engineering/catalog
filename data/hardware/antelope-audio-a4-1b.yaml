description: A4-1B combines the classic sound of an analog Opto-Tube compressor
  with modern enhancements for a unique audio experience.
details: |-
  Classic hardware compression with a modern twist. The A4-1B reimagines vintage opto-tube compression with a 100% purely analog audio signal path built around custom-designed UK transformers, hand-picked premium tubes, a pre-sorted opto-cell, and an all tube-based push-pull amplifier. A modern power supply provides tube longevity, reduces humming, and feeds DC heating to the tubes.

  Continuously variable Ratio, Attack and Release time controls cover the full musical range, with fixed, manual and hybrid timing modes. A built-in Opto-Cell Test System and calibration routines ensure compression precision over time and consistent stereo-link performance between paired units. A front-panel VU meter monitors input, compression and output, with multiple selectable reference levels for metering.

  A companion plugin in VST3, AU and AAX formats provides remote control, file-based preset management with quick A/B testing, and full automation of Attack, Release, Gain, Threshold and Ratio. Plugin changes are instantly applied on the hardware through proprietary motorized potentiometers. An extended side-chain filtering section adds low-pass, high-pass and band-pass filtering plus a de-essing mode using a narrow band-pass filter.
