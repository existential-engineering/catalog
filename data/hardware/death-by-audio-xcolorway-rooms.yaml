url: https://deathbyaudio.com/products/xcolorway-rooms
description: A stereo multi-function digital reverb pedal with six programmable
  algorithms including room, delay-verb, filtered reverb, gated reverb, pitch
  vibrato, and ring-modulated reverb, with expression pedal control.
details: |-
  SPACE REFLECTIONS ROOMS is a stereo, multi-function digital reverb capable of searing volume, gated walls of sound, and long, trailing reverberant ambiances with an intuitive array of controls designed with live mood-bending in mind. Over six meticulously programmed reverb algorithms; ROOM, DIGIT, PEAK, GATE, WAVE, and GONG. Each different verb is capable of a universe of sounds, and ROOMS is here to help you explore them. Algorithms 1 - ROOM A classic reverb that simulates many different rooms. FREQ: Tone of Decay DEPTH: Pre-Delay of Right Side 2 - DIGIT A delay and verb capable of creating otherworldly resonances and fractured repeats. FREQ: Delay Time DEPTH: Delay Feedback 3 - PEAK A super intense bandpass filter combined with an ambient reverb. FREQ: Filter Frequency DEPTH: Filter Resonance 4 - GATE A gated reverb. Short reverb times create a classic gate effect, long reverb times create a controllable freeze effect. FREQ: Decay Tone DEPTH: Gate Response Time 5 - WAVE Creates a pitch vibrato effect. Lowering TIME will blend out the reverb signal, allowing sweeps from chorus/vibrato to long modulated reverbs. FREQ: Modulation Speed DEPTH: Modulation Depth 6 - GONG Ethereal, crushed reverb sounds guaranteed to make you star in the upcoming remake of DUNE and live out your sci-fi fantasies of space travel and galactic domination. FREQ: Modulator Frequency DEPTH: Blends from Aliasing (left) to Ring Modulation (right) NOTE: Will sound most mellow when DEPTH is near the center. Controls Reverb Controls FREQ Controls the frequency parameter of the current mode. DEPTH Controls the depth parameter of the current mode. TIME Controls the reverb time in all modes. ALT Engages the ALT mode, switching between two sets of controls. When active, FREQ is controlled with the F knob, DEPTH with the D knob, and TIME with the T knob. The F and T settings can be controlled with an expression pedal as described below. Mixer Controls DRY Controls the volume of the dry signal, from -inf to +20 dB. FX Controls the volume of the reverb signal, from -inf to +20 dB. Expression Control/CV In Use any TRS expression pedal or 0-3.3 V control voltage to take control of the Time or Frequency setting while the pedal is in ALT mode. Using the "F ↔ T" Slider on the right side of the pedal, you can select the expression to control either the frequency or time control The small ALT control for the F or T control will now set the minimum value of the control. Set the corresponding knob all the way down for the full range of the knob to be controlled by the expression pedal. NOTE: The expression input is only active in ALT mode and will be deactivated when the ALT mode is off. Specifications Electrical Specs Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 80 mA Expression Voltage: 0-3.3 V Physical Specs Dimensions: 5.95" x 3.86" x 2.96" (including hardware) Weight: 13 oz.
