description: >-
  The Solina String Synthesizer is a rare hybrid instrument combining preset
  string and orchestral sounds with voltage-controlled synthesis capabilities,
  merging the String Ensemble's functionality with the Explorer synthesizer's
  sound-design features.
details: |-
  The Solina String Synthesizer represents an exclusive variation in ARP's string synthesis lineup, with approximately 100 units manufactured, making these instruments exceptionally challenging to locate. Unlike its more common sibling, the String Ensemble, this model featured a wood case finish as standard across its production run.

  This synthesizer bridged two distinct ARP philosophies by integrating preset orchestral timbres—including trumpets, flutes, and clarinets—alongside tools for creating custom sounds. The inclusion of a voltage-controlled oscillator, borrowed from the Explorer design, dramatically expanded sonic possibilities beyond the String Ensemble's fixed palette, enabling performers to craft diverse tonal characteristics.

  The instrument provided substantially greater sound-editing capabilities than its String Ensemble counterpart, allowing users to manipulate synthesis parameters for generating textures unavailable from preset selections alone. A 24dB/octave self-resonant filter, LFO, and full ADSR envelope gave players deep control over timbre and dynamics.

  This flexibility made the Solina String Synthesizer particularly valuable for session musicians and producers seeking both immediate orchestral textures and deep customization options within a single compact chassis. Its rarity and hybrid design have made it a highly sought-after collector's piece in the vintage synthesizer market.
specs: |-
  - 16-voice polyphony
  - One VCO plus preset oscillators (viola, violin, cello, contrabass, horn, trumpet)
  - 24dB/octave self-resonant filter
  - One LFO
  - One VCA with ADSR envelope
  - 49 keys
  - CV/Gate compatible
  - Approximately 100 units manufactured
  - Produced in 1975
releaseDate: "1975"
releaseDateYearOnly: true
