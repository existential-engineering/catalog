description: A mastering-grade analog compressor combining 100% analog signal
  path VCA compression with digital control, offering fast and precise recall
  and automation via DAW integration.
details: |-
  The Bettermaker Mastering Compressor is a professional 2U rack-mount analog compressor designed for mastering engineers. It features a 100% analog signal path with high-class VCA compression, combining the warmth of analog processing with modern digital control and recall capabilities via a 5-inch capacitive touchscreen and dedicated DAW plugin.

  The unit offers three compression modes (BM, SG, DX) and can operate in stereo, dual-mono, or mid-side configurations. Compression detection is switchable between peak and RMS modes with forward/backward feed options, giving engineers extensive control over the compression character.

  A parametric sidechain with LPF and hardware insert allows surgical frequency-dependent compression, while adjustable THD saturation and drive control add harmonic coloring options. Parallel compression is supported via a dry/wet mix control.

  The 400-slot preset memory with total recall functionality allows instant recall of settings, and DAW integration via USB with a dedicated plugin enables full automation of all parameters. The unit is protected by U.S. Patent No. 10,693,428 B2 for its analog device control system.

  Audio performance is specified at 106dB dynamic range with frequency response of 10Hz to 22kHz (±0.2dB). THD measures below 0.06% (2nd harmonic), with crosstalk at -83dB @ 1kHz, making it suitable for the most demanding mastering applications.
specs: |-
  - Frequency response: 10Hz to 22kHz (±0.2dB)
  - Dynamic range: 106dB
  - S/N ratio: 87dB (A-weighted)
  - THD: <0.06% (2nd), <0.01% (3rd), <0.006% (4th)
  - Crosstalk: -83dB @ 1kHz
  - Threshold: -35dB to +5dB
  - Attack: 0.1–250ms
  - Release: 10–2000ms
  - Ratio: 0.7:1–10:1
  - Knee: 0–20dB
  - Output: -5dB to +15dB
  - Max input level: 23dBu
  - Max output level: 23dBu
  - Input impedance: 48kΩ
  - Output impedance: 50Ω + 50Ω
  - Sidechain HPF: off–370Hz
  - Sidechain LPF: 2kHz–18kHz
  - Input HPF: 15–30Hz
  - Compression modes: BM, SG, DX
  - Operation modes: Stereo / Dual-Mono / Mid-Side
  - Detection: Peak or RMS, Forward/Backward feed
  - 5-inch capacitive touchscreen
  - 400-slot preset memory with total recall
  - DAW integration via USB
  - Parallel compression (dry/wet mix)
  - Adjustable THD saturation and drive control
  - Form factor: 2U rack-mount, 230mm deep
  - Power: 100–240V universal supply
  - Max power consumption: 25W
  - U.S. Patent No. 10,693,428 B2
