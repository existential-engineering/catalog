details: |-
  Not many more circuits have launched interest in guitar more than the humble delay, as one of the most easily identifiable sounds in effect history, even to non-musicians. However, that ubiquity demands a high price, and so delay effects are by far the most complicated out there. Fortunately, a Taiwanese chip manufacturer opened the DIY floodgates with a product called the PT2399, engineered for karaoke machines but used in countless low-part-count delay designs. The Knight School Delay is a simple delay effect that features the highest sound-to-parts-count ratio Catalinbread can muster. Featuring between 30 and 400 milliseconds of delay (and up to one second of lo-fi delay with a mod), you can dial in a simple yet powerful echo effect that you can proudly say you built yourself!
specs: |-
  - PT2399-based digital delay
  - Delay time: 30ms to 400ms
  - Up to one second of lo-fi delay with a higher-value pot mod
  - Controls: Time, Mix, Repeats
  - The PT2399 architecture makes the circuit incapable of self-oscillation
  - Accepts a 9V center-negative DC power supply
  - Sold as a DIY kit or fully assembled
