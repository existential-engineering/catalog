description: The SJ Mh is a Small Jumbo acoustic guitar with a 16-inch lower
  bout, slightly wider than a dreadnought yet with similarly deep sides. Its
  tight waist curve creates a distinct sound chamber with pronounced midrange
  response and strong treble clarity. Honduran mahogany back and sides pair with
  a Sitka spruce top and pre-war scalloped X-brace for a warm, articulate voice
  with substantial bass and volume.
details: |-
  The SJ Mh is the mahogany-sided variant of the Small Jumbo, a body style with a 16-inch lower bout that is slightly wider than a dreadnought yet retains similarly deep sides. The tight curve at the waist creates a very different sound chamber from a dreadnought, yielding more pronounced midrange response. Honduran mahogany back and sides give the guitar a warm, focused tone compared to the maple-sided SJ or rosewood-sided SJ Indian. Construction features a mortise and tenon hybrid neck joint, fully adjustable truss rod, and a high-gloss nitrocellulose lacquer finish. Finishing details include tortoise body binding with b/w/b/w top purfling, an ebony fingerboard with MOP Modern Diamond inlays, nickel Waverly tuners, and bone nut and drop-in saddle.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Brace Pattern: Pre-war scalloped X-brace
  - Bridge: Ebony modern-style, 2 3/16" spacing
  - Fingerboard: Ebony with MOP Modern Diamonds
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Frets: Medium 18% nickel-silver
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Fingerboard Binding: .100" Tortoise with b/w purfling
  - Peghead Binding: .100" Tortoise with b/w purfling
  - Fingerboard Radius: 14" - 26" compound
  - Neck Profile: C-shape
  - Peghead: Haircut
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Backstrip: 1-style (Walnut)
  - Rosette: Ivoroid with b/w purfling
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Scale Length: 25 1/2"
  - Body Width: 16"
  - Body Length: 20 1/8"
  - Body Depth: 4 1/2"
  - Total Length: 41"
  - Strings: D'Addario EJ-17 (.013" - .056")
