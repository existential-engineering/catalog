details: |-
  The Pro-Mod Relic San Dimas Style 1 HH FR PF brings Charvel's high-performance pedigree to a pre-aged platform, pairing an alder San Dimas body finished in distressed nitrocellulose lacquer with a bolt-on, graphite-reinforced maple neck wearing a hand-rubbed urethane gel finish. The 25.5" scale neck carries a pau ferro fingerboard with a 12" to 16" compound radius, 22 jumbo frets, cream position inlays, white side dots, and a Floyd Rose 1000 Series locking nut measuring 1.6875" wide. The headstock follows the Stratocaster profile and is mounted to a Charvel neck plate.

  Electronics center on a Seymour Duncan JB TB-4 in the bridge and a Seymour Duncan '59 SH-1N in the neck, both with black bobbins, wired to a single volume control and a 3-position toggle switch (bridge / bridge + neck / neck).

  Hardware is finished in black and includes a recessed Floyd Rose 1000 Series double-locking tremolo, Charvel-branded die-cast tuning machines, and dome-style control knobs. Strung with .009-.042 nickel plated steel strings, the guitar ships with a Charvel Multi-Fit Gig Bag (p/n 299-1414-006). Also offered in Vintage White and Weathered Orange.
