description: A large-diaphragm FET condenser based on the Phanthera, adding
  switchable omnidirectional, cardioid, and figure-eight polar patterns with an
  integrated 10 dB attenuator pad.
details: |-
  The Phanthera V is a professional large-diaphragm FET condenser microphone from Brauner
  Microphones, offering switchable directivity patterns for versatile recording applications.
  Building on the sonic character of the cardioid-only Phanthera, it brings the same lively
  and intense sound quality while adding pattern flexibility.

  The microphone supports three polar patterns: cardioid, omnidirectional, and figure-eight
  (bidirectional). This makes it suitable for a wide range of recording scenarios, from
  focused vocal and instrument capture in cardioid mode to immersive room and ambience
  recording in omnidirectional mode, and stereo techniques in figure-eight mode.

  With its figure-eight pattern, the Phanthera V is well-suited for XY and MS stereo
  configurations, enabling natural and accurate stereo image capture for orchestral,
  ensemble, and ambient recordings.

  The microphone features an integrated 10 dB attenuator pad, which extends its dynamic
  range and allows it to handle very high sound pressure levels without distortion. Powered
  by standard 48V phantom power, it delivers low self-noise of less than 11 dB(A) across
  its full 20 Hz to 22 kHz frequency range.
specs: |-
  - Equivalent Noise: < 11 dB(A) (IEC651)
  - Signal-to-Noise Ratio: > 83 dB (1 Pa / 1 kHz, Cardioid)
  - Sensitivity: 28 mV/Pa (Cardioid)
  - Polar Patterns: Omnidirectional, Cardioid, Figure-Eight
  - Frequency Response: 20 Hz - 22 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 48V phantom power
  - Switchable -10 dB attenuator pad
  - Suitable for XY and MS stereo configurations
