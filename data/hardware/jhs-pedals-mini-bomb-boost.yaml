description: Compact JFET clean boost pedal that adds volume and presence when
  placed before or after drive pedals, fitting a 1.5" x 3.5" footprint on the
  pedalboard.
details: |-
  A good booster is often the most underrated tool a guitarist can own. When placed before your overdrives or distortions, a thicker, stronger and more saturated tone can be achieved. When placed after, you get your exact same tone except louder. This is great for lead passages and for causing a tube amp to naturally overdrive due to its huge amount of headroom. You will notice a slight touch of presence that lets your tone cut through the mix for those passes that you really want to stand out. Chords are heard with clarity and subtle harmonics shine! The Mini-Bomb JFET boost can do all this and only takes up a small 1.5" x 3.5" spot on your pedal board!
