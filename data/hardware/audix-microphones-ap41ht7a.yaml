details: |-
  A professional diversity wireless system featuring the HT7 single ear miniaturized head-worn condenser microphone.

  The HT7 is a professional single ear head-worn condenser microphone designed for stage, presentation, and broadcast applications. With a miniaturized element of only 3mm, the HT7 is the smallest microphone in the AUDIX lineup. The omnidirectional HT7 features a comfortable earpiece that can be worn around the left or right ear and a durable adjustable length boom arm.
specs: |-
  - Mic: HT7 single-ear head-worn condenser (3mm element)
  - Polar pattern: Omnidirectional
  - System: R41 diversity receiver with B60 bodypack transmitter
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - 106 pre-coordinated frequencies
