details: >-
  The Electro-Voice RE20 is an industry-standard large-diaphragm dynamic
  cardioid microphone that has defined the sound of FM radio broadcasting for
  decades and remains a go-to choice in modern podcast, voiceover, and music
  production studios. Its Variable-D (variable distance) design dramatically
  reduces proximity effect, so announcers and vocalists can work close to the
  capsule for intimacy and presence without the bass build-up that plagues
  conventional cardioid dynamics.


  Acoustically, the RE20 offers a true cardioid polar pattern with minimal
  coloration even at 180 degrees off-axis, providing predictable rejection of
  background room sound and bleed. The voicing is tailored for the human voice:
  smooth, natural, and controlled, with a gentle presence lift that translates
  well across speech and singing. A heavy-duty internal pop filter helps tame
  plosives at close range, while an internal pneumatic shock mount isolates the
  element from handling and stand-borne vibration. A humbucking coil guards
  against electromagnetic line hum from nearby fluorescent lights and CRT
  monitors, and a mid-bass tone-shaping switch lets engineers tighten the low
  end when needed.


  Beyond broadcast and vocals, the RE20 is a studio workhorse on instrument
  sources where a dynamic with extended low-end response is required - kick
  drum, bass guitar cabinets, trombones, saxophones, and electric guitar amps
  among them. The microphone is built into a steel body with a fawn beige
  finish, terminating in a balanced 150-ohm output on a standard 3-pin XLR
  connector. It ships with the 81715 stand clamp; the popular 309A shock-mounted
  stand adapter is available as an optional accessory.
specs: |-
  - Element: Dynamic
  - Polar pattern: Cardioid (Variable-D)
  - Frequency response: 45 Hz - 18,000 Hz
  - Impedance: 150 ohms balanced
  - Sensitivity (1 kHz): 1.5 mV/pascal
  - Hum pickup (60 Hz): -130 dBm
  - Polarity: Pin 2 positive referenced to Pin 3
  - Connector: 3-pin XLR
  - Mid-bass tone-shaping switch
  - Internal pneumatic shock mount
  - Heavy-duty internal pop filter
  - Humbucking coil for line-hum rejection
  - Length: 8.53 in (216.7 mm)
  - Body diameter: 1.94 in (49.3 mm)
  - Maximum width: 2.14 in (54.4 mm)
  - Net weight: 1 lb 10 oz (737 g)
  - Shipping weight: 3 lb 4 oz (1,474 g)
  - Case material: Steel
  - Finish: Fawn beige
  - Included accessories: 81715 stand clamp
  - Optional accessories: 309A shock-mounted stand adapter
