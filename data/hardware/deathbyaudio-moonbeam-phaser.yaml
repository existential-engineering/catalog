description: A Mesmerizing Array of Phasers The Moonbeam Phaser has landed. A
  stereo, multi-stage phaser like no other, the Moonbeam Phaser lets you
  completely reshape your sound by choosing between one and six stages of phase
  shifting for any modulation occasion.
details: |-
  At its core, the Moonbeam Phaser houses two fully analog 6-stage phase shifter engines. You can tap into each stage individually and hear its unique movement as the display morphs through a spectrum of colors that mirror the sound. The FREQ control reaches far beyond the usual range, from 2-minute phase sweeps to liquid swirls to ring-modulated frequency shifts, and combined with the DEPTH control it opens a vast spectrum of refracted phasing tones from shimmering rotary warbles to deep resonant bends. Packing two phasers in one, it brings guitar, bass, synth, or anything you imagine into mesmerizing stereo with the click of a stomp.

  Part of Death By Audio's Destroyer Series, the Moonbeam Phaser sports the line's signature compact footprint, glowing vintage-style LED display, and minimal controls, offering ultra-high headroom, full stereo modulation, and tour-grade build quality.

  PHASE SELECTOR chooses the number of phaser stages from one to six, each with its own character: 1 (red) is a sweeping high pass filter and tremolo, 2 (yellow) a sweeping notch filter with resonant peaks, 3 (green) a cross between a phaser and harmonic tremolo, 4 (cyan) the classic phaser sound, 5 (blue) adds resonance and treble focus, and 6 (purple) is a full, bassy, chewy phaser. FREQ adjusts the movement speed from ultra-slow 0.006Hz drifts to 130Hz sweeps, and DEPTH controls the intensity and character of the stages. An internal INPUT CONFIGURATION SWITCH toggles between mono TS and stereo TRS input, lighting "M" or "S" on the faceplate, and the pedal supports mono, mono-to-stereo, and full stereo routing.
specs: |-
  - Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel. Death By Audio's RAW POWER power supply is recommended for optimal performance.
  - Current Draw: 72 mA
  - Dimensions: 5.16" x 2.76" x 2.38" (including hardware)
  - Weight: 10.3 oz.
