description: The Langevin ELOP® is a timeless stereo electro-optical limiter
  that makes flawless dynamics control effortless. Born from a legacy of classic
  'LA' series limiters, this all-discrete, Class-A unit uses a passive optical
  cell to act as a 'smart volume control,' delivering a transparent and musical
  compression that is both powerful and sonically beautiful.
specs: |-
  - Gain Reduction: 22 dB
  - Attack Time: 10 mS
  - Release Time: 2.5 Sec
  - THD+Noise: < 0.015%
  - S/N Ratio: 126 dB
  - Dimensions: 19″ × 1 ¾″ × 10″ (1U)
  - All-discrete, Class-A circuitry
  - Passive optical cell gain-reduction element
  - Balanced XLR and unbalanced 1/4" inputs and outputs
