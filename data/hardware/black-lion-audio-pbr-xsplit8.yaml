description: 8-channel passive XLR microphone splitter with transformer-isolated
  outputs for live and studio use
details: The PBR XSplit8 provides 8 channels of passive XLR splitting, with both
  a direct output and a transformer-isolated output per channel, delivering
  complete electrical separation between connected devices to eliminate ground
  loops. Each channel includes a ground lift switch and uses gold-plated XLR
  connectors with premium WIMA capacitors and Vishay resistors. Phantom power
  passes through direct outputs only; transformer-isolated outputs carry audio
  signal only, making the unit suitable for splitting microphone feeds between
  front-of-house consoles, monitor engineers, and recording interfaces
  simultaneously.
specs: |-
  - Channels: 8
  - Form Factor: 1U rack-mount
  - Connectors: Gold-plated XLR
  - Inputs: 8 × XLR (front panel)
  - Direct Outputs: 8 × XLR
  - Transformer-Isolated Outputs: 8 × XLR
  - Ground Lift: Per-channel switch
  - Phantom Power: Direct outputs only
  - Capacitors: WIMA
  - Resistors: Vishay
