name: VXP 6
manufacturer: tannoy
primaryCategory: speaker
categories:
  - amplifier
url: https://www.tannoy.com/en/products/0312-aoe
description: Compact powered PA loudspeaker featuring a 150mm (6") Dual
  Concentric drive unit with integrated Lab Gruppen Class-D amplification
  delivering 1,600W peak output.
details: |-
  Compact powered PA loudspeaker featuring a 150mm (6") Dual Concentric drive unit with integrated Lab Gruppen Class-D amplification delivering 1,600W peak output. Designed for small-scale performance reinforcement, background music, and high-intelligibility speech applications. Features constant directivity 90° conical dispersion, trapezoidal birch plywood enclosure, and switchable Full Range / Hi-Pass filter modes. Compatible with Lake LM Series DSP controllers.
specs: |-
  - frequencyResponseFullRange: 88 Hz – 35 kHz ±3 dB / 80 Hz – 45 kHz −10 dB
  - frequencyResponseHiPass: 120 Hz – 35 kHz ±3 dB / 100 Hz – 45 kHz −10 dB
  - nominalDispersion: 90° conical @ −6 dB point
  - directivityFactorQ: 5.6
  - directivityIndexDI: 7 dB
  - dynamicRange: 106 dB
  - maximumSPL: 123 dB peak
  - crossoverType: Passive 1.6 kHz with dynamic HF protection
  - transducers: 150 mm (6") constant directivity Dual Concentric™
  - maximumOutputPower: 1600 W
  - protection: Output current limiter, clip limiter, brownout protection and recovery, thermal
  - inputImpedance: 10 kΩ unbalanced / 20 kΩ balanced
  - maximumInputLevelForClip: +4.5 dBu (hard clip at +14.5 dBu input signal)
  - mainsSupply: Industry-standard twist-lock power 20A
  - levelControl: Recessed potentiometer
  - filterSwitch: Hi-pass (HPF) / Full range (FR), switchable
  - powerModeSwitch: Manual (MAN) / Auto (AUTO), switchable
  - powerSupplyType: Switch-mode autorange
  - mainsVoltage: 100–240 V~, 50/60 Hz
  - powerConsumption: 60 W @ 1/8 max power
  - dimensions: 334 × 226 × 216 mm (13.1 × 8.9 × 8.5")
  - netWeight: 7.2 kg (15.9 lbs)
  - construction: 12 mm (½") plywood, vented and internally braced
  - finish: Semi matt black paint (white optional)
  - grille: Powder coated perforated steel
  - flyingHardware: 2 × M6 yoke bracket inserts; blanking plate for optional VTH pole mount
