details: |-
  The Custom 24 Piezo is a 24-fret solidbody piezo-equipped guitar that effortlessly achieves classic humbucker tones and authentic acoustic sounds in one instrument. With classic PRS appointments, including a figured maple top, mahogany back, 24-fret, 25” scale length mahogany neck with rosewood fretboard, PRS’s patented Gen III tremolo, and Phase III tuners with wing buttons, the Custom 24 Piezo is a unique tool for musicians in the writing room, the studio, and on the stage.

  The Custom 24 Piezo boasts PRS DMO treble and bass pickups. PRS’s DMO (Dynamic, Musical, Open) pickups were personally designed by Paul Reed Smith and the PRS New Products Engineering team. From our own hands-on research into coveted vintage pickup models to advancements in signal analyzation and “tuning” technology, these pickups incorporate every detail of pickup knowledge PRS has gained in recent years of R&D. PRS DMO pickups have a “wide open” sound with vocal character, meaning they deliver clear, pleasant-sounding tones across a wide range of frequencies (bass to treble) in each pickup.

  Equipped with the traditional volume/tone/5-way blade switch, this model also features a 3-way selector to switch between or blend the magnetic pickups and piezo electronics. The two output jacks allow guitarists to plug into their favorite electric or acoustic guitar amp or DI into a soundboard. By utilizing the separate blend control, the tone of the PRS DMO pickups can also be combined with the piezo acoustic sounds through a single output. With a nearly infinite range of tones, the Custom 24 Piezo is a perfect “go-to” guitar for players of all kinds.
