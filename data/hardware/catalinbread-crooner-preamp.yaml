  UREI-style discrete op-amp. Spans clean boost, overdrive, distortion, and fuzz
  tones with dynamic-sensitive, vintage-flavored character.
details: |-
  The Crooner Preamp reimagines the classic RCA BA-31 studio microphone preamp in a compact, pedalboard-friendly format. Catalinbread combined germanium and transformer circuitry with a UREI-inspired discrete op-amp to capture the smooth, saturated compression that defined the vocal recordings of the 1940s and 50s.

  Four controls give players broad tonal range. The Push knob adjusts the UREI-style op-amp gain stage, moving from clean boost at low settings to syrupy compressed distortion when fully engaged. The Volume knob sets the output level, while Filter rolls off high-frequency content to tame harshness at high-gain settings. The Trim control manipulates the RCA preamp gain for extended transformer saturation.

  The pedal is designed to work equally well as an always-on coloring device or as a more aggressive saturation tool. Its dynamic sensitivity means picking attack translates naturally through the circuit.

  Catalinbread recommends running the Crooner at 18V DC for improved headroom and more of the pedal's character at every knob position.
