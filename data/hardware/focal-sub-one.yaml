name: Sub One
manufacturer: focal
primaryCategory: subwoofer
url: https://www.focal.com/products/sub-one
description: "Sub One, Active professional subwoofer: Our professional monitors
  are designed from the first stage to reproduce the sound signal without
  alteration. These monitors will meet the needs of both large studios and small
  listening rooms."
specs: |-
  - Active professional subwoofer
  - Drivers: 2 × 8" Slatefiber membrane
  - Frequency response (±3 dB): 32 Hz – 120 Hz
  - Maximum SPL (peak @ 1 m): 114 dB
  - Amplifier: 100 W class D (200 W RMS total)
  - Inputs: Left, Right, LFE — XLR symmetrical 10 kΩ
  - Controls: Sub level, Lo-pass frequency, Phase, Polarity switch, Mute, 2.1 bypass (footswitch), Hi-pass frequency selection
  - Local supply: 100–240 V (T2AL fuse/250 V)
  - Dimensions (H × W × D): 47.5 × 31 × 52 cm (18.7 × 12.2 × 20.5 in)
  - Weight: 18.5 kg (40.8 lb)
