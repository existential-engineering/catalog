description: This long-excursion active subwoofer offers high efficiency for the most demanding professionals and sound engineers. Rated at 200W RMS, Sub One is ideal for use with the Alpha Evo line, as well as the Shape line of monitors.
details: |-
  This long-excursion active subwoofer offers high efficiency for the most demanding professionals and sound engineers. Rated at 200W RMS, Sub One is ideal for use with the Alpha Evo line, as well as the Shape line of monitors.

  Discreet and versatile: for discreet, optimal studio integration, Sub One features a slim, space-saving profile. Added features include a low-pass crossover, a high-pass crossover for the monitor output, sound level control, a footswitch input and output for bass-management bypass, LFE input and output, and left and right inputs and outputs.

  Performance: the 20 cm (8") Slatefiber double-skin woofers offer neutrality, precision and sonic dynamics with low distortion. With a total power output of 200W RMS, Sub One covers a frequency range from 32 Hz to 120 Hz.

  Design: thanks to its elaborate full-width design and front-mounted air vents, this professional subwoofer fits discreetly and easily into a room along a wall or under a desk.

  Exclusive to Focal and made in France, the Slatefiber cone is made of recycled carbon fibers and thermoplastic polymer, using non-woven carbon fibers oriented in the same direction for greater rigidity, damping and lightness.
specs: |-
  - Product type: monitoring subwoofer
  - Loudspeakers: 2 x 8" Slatefiber membrane
  - Frequency response (+/- 3dB): 32 Hz - 120 Hz
  - Maximum SPL (peak @ 1m): 114 dB
  - Amplifier: 100 W, class D (200 W RMS total output)
  - Inputs: Left, Right, LFE; XLR symmetrical 10 kOhms
  - LEDs: power on, mute, hi-pass defeat
  - Indicators and controls: sub level (sensitivity) adjustment, low-pass frequency adjustment, phase adjustment, polarity switch, mute, 2.1 bypass (controlled by external footswitch), high-pass frequency selection, high-pass defeat
  - Local supply: 100 - 240V (T2AL fuse/250V)
  - On/Off switch on the rear panel
  - Height: 47.5 cm / 18.7 in
  - Width: 31 cm / 12.2 in
  - Depth: 52 cm / 20.5 in
  - Weight: 18.5 kg / 40.8 lb
