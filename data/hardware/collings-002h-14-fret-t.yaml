description: The 002H 14-Fret T is a Traditional Series 00-size acoustic guitar
  that finds the sweet spot between small- and mid-sized instruments, offering a
  vintage-inspired voice with dry articulation, warmer high-end response, a
  rounder high end, fuller low midrange, and a slightly looser, more broken-in
  feel and tone.
details: |-
  The 002H 14-Fret T combines East Indian rosewood back and sides with herringbone trim in the Traditional Series 00 14-Fret body style. It delivers the classic 00 14-Fret character — pleasing midrange resonance, articulate attack, and enhanced low-end definition — through a vintage-inspired lens with ultra-thin nitrocellulose lacquer finish and Traditional Series construction.

  The instrument features ivoroid body binding with small brown herringbone purfling, custom wood rosette, gold MOP diamond and square fingerboard inlays, stained exotic ebony peghead veneer with gold MOP logo, and Nickel Waverly tuners.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard inlays: Gold MOP diamond & square
  - Bridge: Ebony belly-style
  - Nut: Bone, 1 3/4"
  - Bridge spacing: 2 5/16"
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Scale length: 24 7/8"
  - Body width: 14 1/2"
  - Body length: 18 7/8"
  - Body depth: 4"
  - Total length: 39"
  - Body binding: Ivoroid with small brown herringbone purfling
  - Rosette: Custom wood
  - Peghead veneer: Stained exotic ebony with gold MOP logo
  - Body finish: High gloss ultra-thin nitrocellulose lacquer
  - Strings: D'Addario EJ-16 (.012"-.053")
