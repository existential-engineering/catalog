  dedicated analog bass tones.
details: |-
  Korg's Synthe-Bass was a purpose-built bass instrument aimed at keyboard players who needed a dedicated low-end voice. Despite its small two-octave range, the SB-100 delivered a surprisingly thick and powerful sound that earned it a loyal following among players seeking analog bass tones.

  The architecture is deliberately simple: a single oscillator feeds through a low-pass filter with an attack-decay envelope shaping the amplitude. There is no LFO, no effects processing, and no patch memory. This stripped-down signal path keeps the sound direct and punchy, well suited to bass duties.

  The briefcase-style enclosure with 25 full-size keys made the SB-100 genuinely portable, an appealing trait in an era when most synthesizers were large and heavy. Players could bring dedicated bass synthesis to a gig without hauling a full keyboard rig.

  As one of Korg's early monophonic instruments, the SB-100 reflects the company's practical approach to synthesis, offering a focused tool rather than a general-purpose instrument. Its simplicity is its strength, delivering reliable analog bass tones with minimal fuss.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1
  - Filter: Low-pass
  - Envelope: AD (Attack-Decay)
  - LFO: None
  - Effects: None
  - Keyboard: 25 full-size keys
  - Memory: None
  - Control: None
