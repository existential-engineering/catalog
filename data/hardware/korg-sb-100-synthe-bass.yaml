description: >-
  The Korg SB-100 Synthe-Bass is a compact monophonic analog bass synthesizer from 1975,
  housed in a portable briefcase design with full-size keys. It delivers a surprisingly
  fat and powerful low-end sound from its simple single-oscillator architecture. Despite
