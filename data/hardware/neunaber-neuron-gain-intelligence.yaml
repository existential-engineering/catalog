  *See User Guide for complete specifications. Specifications subject to change without notice. -
  Resources

  Presets

  Up to 6 Presets accessible via the Preset Footswitch. Up to 24 presets can be recalled via MIDI. Low Power Consumption

  Use a standard 9 V or 12 V pedal power supply. Or, connect Neuron to a 100 mA output on a brick supply. Neuron Commander Software

  Download free Neuron Commander Software to create and save unlimited presets. MIDI Input & Thru/Out

  Two 2.5 mm TRS to 5-pin DIN adapters included to connect your MIDI controller.
specs: |-
  - Features - Dynamic multistage gain architecture yields unparalleled control over the desired amount of distortion — producing harmonic structures that range from subtle to dense and complex. With its hyper-realistic feel, experience the joy of playing full-bore through an amp without the size, weight, cost and potential hearing damage.
  - Unique design, based on years of research into amps and pedal circuits, is not a model, emulation or simulation of any particular amp. A unique, versatile sound — your secret weapon.
  - Switchable Speaker Simulator for running direct or to a powered monitor/full-range powered cab, saving you the trouble of an outboard speaker sim.
  - Neuron Commander Software (macOS/Windows) makes setup even easier. Use a USB-MIDI adapter (not included) to connect Neuron Commander Software. Of course, you can perform all setup directly on the pedal itself.
  - True bypass switching ensures that Neuron is completely disconnected from your signal chain when not in use. It won't change your tone unless you want it to.
  - Small, pedalboard-friendly footprint. Neuron might be the most powerful guitar preamp for its size.
  - Powered from a standard 9V pedal power supply (not included) and drawing less than 100 mA. Just plug it in to your existing pedalboard's power supply. No need to run a separate power adapter or free up a high-current power port.
  - Manufactured locally in Orange County, California USA. Support a small family-owned and operated business.
  - Presets+MIDI - Store and recall up to 6 presets from the Preset footswitch
  - Up to 24 presets can be recalled via MIDI controller
  - MIDI controllable via MIDI's new micro-jack (2.5mm TRS) standard. Two adapter cables are included to connect to 5-pin DIN MIDI cables. Access Neuron's full capabilities with ease using any MIDI controller.
  - Send MIDI Program Changes to change presets
  - Use MIDI Contol Changes to adjust parameters
  - Download Neuron Commander software and connect Neuron to your computer via a USB-MIDI adapter to create and save unlimited presets
  - Controls - Primary
  - Gain - Over 60 dB of gain, clean to heavy distortion
  - Comp - single knob compressor
  - Level - output level of signal
  - EQ - Low, Mid, High - Three-band EQ designed so controls do not interact
  - Alternate - accessed by holding down Engage switch while turning knob
  - Gate - adjusts noise reduction threshold
  - Tightness - adjusts a pre-gain high-pass filter
  - Presence - adjusts a post-gain low-pass filter
  - Setup - accessed by holding down Engage switch while turning knob. Setup Controls are global settings, independent of preset selection.
  - Speaker Simulator - turns the internal speaker simulator on/off
  - Tilt EQ - one-knob compensation for a variety of output connections
  - Specifications I/O Nominal input level -10 dBV, instrument level Input impedance 1 MΩ Electrical Sample rate 96 kHz Minimum latency 0.315 ms Bypass relay, true bypass Power Input 9-12 V DC Current 70 mA Recommended adapter 9 V DC, 100 mA or greater pedal power supply Connector center-negative, 5.5 mm OD x 2.1 mm ID Physical Dimensions 4.6" W, 2.8" L, 1.9" H / 116 mm W, 68 mm L, 47 mm H Weight 0.564 lbs / 256 g *See User Guide for complete specifications. Specifications subject to change without notice.
  - Resources - Neuron User Guide contains detailed info for setup and technical specs.
  - Neuron Commander Software simplifies setup and preset creation for your Neuron Gain Intelligence pedal. A USB-to-MIDI adapter is required. Instructions and download package are available from the Software Downloads page. Login is required, but it is free to create an account.
  - Neuron Preset Exchange forum, where you can share your presets using Neuron Commander's import/export functions.
