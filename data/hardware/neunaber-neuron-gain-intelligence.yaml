details: |-
  Epic Guitar Tone Without an Amp

  The complexity of an amp modeler can feel overwhelming when all you want is awesome tone and feel that is easy to control. You want your guitar's sound to be as versatile and unique as you are. And, of course, you want a solution that is convenient, easily portable, and doesn't need to be turned up to 11 to sound great, whether you run direct or amplified. Introducing Neuron Gain Intelligence — a dynamic multistage guitar preamp with compressor, noise gate, speaker simulator, presets and MIDI in a compact pedal format. -
