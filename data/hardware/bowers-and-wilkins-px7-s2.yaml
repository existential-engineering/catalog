details: |-
  Px7 S2 is a Bluetooth wireless over-ear headphone, described by Bowers & Wilkins as a high-performance noise-cancelling wireless headphone. Its custom-designed 40mm drive units and 24-bit-capable wireless platform combine for a truly immersive listening experience that allows you to hear more of what the artist wants you to hear.

  Each earcup carries a 40mm dynamic full-range bio-cellulose driver. The wireless platform is Bluetooth 5.2 with aptX Adaptive, and the supported codec list runs aptX Adaptive, aptX HD, aptX, AAC and SBC. Supported Bluetooth profiles are A2DP, AVRCP, HFP, HSP and BLE GATT.

  Noise control is handled by Hybrid Noise Cancellation with an Ambient Pass-Through mode, fed by four microphones dedicated to ANC. A further two microphones handle telephony. A wear-detection sensor is built in, so the headphone can respond to being taken off and put back on.

  Power and wired connection both run through a single USB-C socket, a USB-C charging and audio interface. The headphone runs on a rechargeable lithium-ion battery quoted at 30 hours of playback, with a 15-minute charge giving 7 hours.

  The headphone weighs 307g without its carry case, and the supplied case measures 189mm wide by 63mm deep by 233mm high. In the box are a 1.2m USB-C to 3.5mm stereo jack audio cable, a 1.2m USB-C to USB-C cable and the carry case. The Bowers & Wilkins Music app connects and controls the headphone and streams from compatible streaming services. Listed finishes are Black, Blue and Gray.
specs: |-
  - Wearing style: Bluetooth wireless over-ear headphones
  - Drive units: 2 x 40mm dynamic full-range bio-cellulose driver
  - Hybrid Noise Cancellation
  - Ambient Pass-Through
  - Wear-detection sensor
  - Bluetooth audio: Bluetooth 5.2 with aptX Adaptive (wireless, not a physical port)
  - Bluetooth codecs: aptX Adaptive, aptX HD, aptX, AAC, SBC
  - Bluetooth profiles: A2DP, AVRCP, HFP, HSP, BLE GATT (Generic Attribute Profile)
  - USB-C charging and audio interface
  - Microphones: 4x mics for ANC, 2x mics for telephony
  - Battery type: rechargeable lithium ion (no mains inlet, charged over USB-C)
  - Battery life and charging: 30 hours playback, 7 hours from a 15-minute charge
  - Net weight: 307g (without carry case)
  - Carry case dimensions: 189mm (w) x 63mm (d) x 233mm (h)
  - In-box accessories: 1.2m USB-C to 3.5mm stereo jack audio cable, 1.2m USB-C to USB-C cable, carry case
  - Finishes: Black, Blue, Gray
  - Works with the Bowers & Wilkins Music app
