description: Px7 S2's custom-designed 40mm drive units and 24-bit-capable
  wireless platform combine for a truly immersive listening experience that
  allows you to hear more of what the artist wants you to hear.
details: |-
  Px7 S2 are high-performance noise-cancelling wireless over-ear headphones, built around custom-designed 40mm drive units and a 24-bit-capable wireless platform. The page headline set is hybrid noise cancellation, ambient pass-through, a wear-detection sensor, Bluetooth 5.2 with aptX Adaptive, and a USB-C charging and audio interface.

  The drivers are 2 x 40mm dynamic full-range bio-cellulose units, angled within the earcups, with an input impedance of 33Ω and distortion below 0.1% at 1kHz/10mW. Bluetooth 5.2 carries aptX Adaptive, aptX HD, aptX, AAC and SBC across the A2DP, AVRCP, HFP, HSP and BLE GATT profiles.

  Six microphones are fitted: four dedicated to active noise cancellation and two to telephony. Ambient pass-through lets external sound such as conversation or a safety announcement be heard without removing the headphones, and the wear sensor pauses and resumes playback as an earcup is lifted on or off the ear. Both are configured in the Bowers & Wilkins Music app, which also offers a Quick Action Button assignment and a 15-minute auto-standby.

  Wired use runs through a single USB-C socket on the right earpiece. The supplied USB-C to 3.5mm cable connects that socket to an analogue headphone output such as an aeroplane seat or a hi-fi, at which point the headphones disconnect from Bluetooth and the volume and play/pause buttons stop working. The supplied USB-C to USB-C cable instead lets the headphones act as a USB sound output device for a computer. In both cases the battery must have charge and the headphones must be switched on.

  Battery life is 30 hours of playback, with 7 hours returned by a 15-minute charge and 2 hours for a full charge. The headphones weigh 307g without the carry case, which measures 189 x 63 x 233mm. Finishes are Black, Blue and Gray.
specs: |-
  - Wearing style: Bluetooth wireless over-ear headphones
  - Drive units: 2 x 40 mm dynamic full range bio cellulose driver
  - Input impedance: 33 Ω
  - Distortion (THD): <0.1% (1 kHz / 10 mW)
  - Technical features: hybrid noise cancellation, ambient pass-through, wear-detection sensor, Bluetooth 5.2 with aptX Adaptive, USB-C charging and audio interface
  - Bluetooth codecs: aptX Adaptive, aptX HD, aptX, AAC, SBC
  - Bluetooth profiles: A2DP, AVRCP, HFP, HSP, BLE GATT
  - Microphones: 4 for ANC, 2 for telephony
  - Battery type: rechargeable lithium ion
  - Battery life: 30 hours playback, 7 hours from a 15-minute charge, 2 hours for a full charge
  - Inputs: Bluetooth, USB-C audio
  - In box accessories: 1.2 m USB-C to 3.5 mm stereo jack audio cable, 1.2 m USB-C to USB-C cable, carry case
  - Net weight: 307 g (without carry case)
  - Carry case dimensions: 189 mm (w) x 63 mm (d) x 233 mm (h)
  - Finishes: Black, Blue, Gray
