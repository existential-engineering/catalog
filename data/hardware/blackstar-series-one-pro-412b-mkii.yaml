description: 240W 4x12 extension cabinet matched to the Series One 100 MK II
  valve head, loaded with Celestion Vintage 30 speakers for a perfectly balanced
  mid-range response with superior articulation and power.
details: |-
  The Series One Pro 412B MK II is the matching extension cabinet for the Series One 100 MK II valve head. Featuring industry standard Celestion Vintage 30 speakers, the cabinet delivers a perfectly balanced mid-range response with superior articulation and power.

  Designed for the rigors of touring, the Pro 412B MK II uses special baffle construction and 18mm finger-jointed birch plywood for maximum strength and resonance. The cabinet can be operated in mono 8Ω or stereo 2x16Ω configurations to suit a variety of rig setups.
specs: |-
  - 240W power handling
  - 4x 12" Celestion Vintage 30 speakers
  - Mono 8Ω / Stereo 2x16Ω
  - Special baffle construction
  - 18mm finger-jointed birch plywood construction
  - Weight: 49kg
  - Dimensions: 755 x 761 x 356 mm
