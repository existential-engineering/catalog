name: dbx CT-2
manufacturer: dbx
primaryCategory: utility
url: https://dbxpro.com/en/products/ct-2
description: The dbx CT-2 is a portable cable tester with a 6-position rotary
  selector that tests a wide range of audio and data cable connector types.
  Well-illuminated LED indicators and a banana connector continuity tester with
  audible beeper provide fast, reliable cable diagnostics.
details: |-
  The dbx CT-2 addresses one of the most common issues in professional audio — cable failure diagnosis. Its 6-position rotary dial and individual LED indicators allow technicians to quickly evaluate cable functionality for a broad range of connector types, including cables with different connectors at each end (such as TRS to XLR).

  The CT-2 supports testing of Speaker Twist (4-pin), XLR (3-pin, male and female), RCA Phono, BNC, MIDI/DIN 5-pin, DMX 5-pin, 1/4" TRS, and Banana connectors. A dedicated banana connector continuity tester with audible beeper provides an additional quick-check option. A battery life check function ensures the tester itself is always ready.

  Compact dimensions and battery-powered operation make the CT-2 ideal for stage, studio, and touring use. The rugged construction is designed to withstand the rigors of professional touring environments.
specs: |-
  - Power: 9V battery (not included)
  - Width: 3.5" (8.9 cm)
  - Length: 5.5" (14 cm)
  - Height: 1.5" (3.7 cm)
  - Supported Connectors: Speaker Twist (4-pin), XLR 3-pin, RCA Phono, BNC, MIDI/DIN 5-pin, DMX 5-pin, 1/4" TRS, Banana
