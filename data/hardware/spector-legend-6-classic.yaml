description: The Legend 6 Classic is a 6-string bass guitar with a bolt-on ash
  body featuring a walnut burl top and Bartolini humbucker pickups with a
  TonePump Jr active preamp.
details: |-
  The Legend 6 Classic combines the iconic silhouette of the NS design with rock-solid bolt-on construction to provide a reliable and affordable instrument for all players. The extremely comfortable curved body is crafted from lightweight and resonant ash and features an exotic Walnut Burl top. These basses now include custom voiced pickups from Bartolini that aim to provide the warmth of a classic passive design, while preserving the clarity and definition Spector is known for. These pickups are perfectly complemented by Spector's TonePump Jr. active tone controls that offer interactive treble and bass controls for sculpting your sound.The Legend Classic also features a 3-piece maple neck, a 24 fret pau ferro fingerboard, and professional quality die-cast hardware. The Legend 6 Classic offers the looks, tone, and feel of basses twice its price.
