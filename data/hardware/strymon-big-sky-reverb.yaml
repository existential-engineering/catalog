id: GxleFr7QBgko0WdzhcmqO
name: Big Sky Reverb
manufacturer: strymon
primaryCategory: reverb
categories:
  - pedal
capabilities:
  - reverb
url: https://www.strymon.net/bigsky/
description: Plug into bigsky and instantly lift your sound into the
  stratosphere. The world below you fades into the distance, and you're elevated
  into a glow of lush, glorious, radiant reverbs. To create a reverb experience
  as natural, beautiful, and immersive as bigsky required tremendous feats of
  sound engineering and artistic imagination.
details: |-
  Plug into bigsky and instantly lift your sound into the stratosphere. The
  world below you fades into the distance, and you're elevated into a glow of
  lush, glorious, radiant reverbs. To create a reverb experience as natural,
  beautiful, and immersive as bigsky required tremendous feats of sound
  engineering and artistic imagination.

  Using the fundamentals of acoustical science as their beacon, strymon
  carefully studied and scientifically analyzed reverb technology from the past
  fifty years to faithfully capture the essence of these classic sounds, and
  forged ahead to dream up their own vision of reverbs from the future.

  Hand crafted, studio-class reverb algorithms deliver lush, gorgeous, and
  musically inspiring reverb experiences. Diffused reflections and
  slower-building density are the hallmarks of this beautiful and versatile
  reverb. The concert size is well-balanced, spacious and warm, while the arena
  size is huge, enveloping and booming.

  Additional menu parameters allow for easy customization of reverb sounds.
  Bigsky is intended to empower your creativity without getting in the way of
  it.
specs: |-
  - 12 unique reverb machines

  - Room, hall, plate, spring, swell, bloom, cloud, chorale, shimmer, magneto,
  nonlinear, reflections reverb types

  - Seven front-panel tone shaping knobs: decay, pre-delay, mix, tone, mod,
  param 1, param 2

  - 300 easily accessible and namable presets

  - Press-and-hold infinite sustain and freeze functions

  - Spillover and reverb persist modes

  - Selectable speaker cabinet emulation

  - +/- 3db boost/cut

  - Three rugged metal footswitches

  - LED display for preset info, reverb decay time, and extended parameter
  control

  - Multi-color preset leds

  - Full MIDI implementation

  - True bypass (electromechanical relay switching)

  - High quality, transparent analog buffered bypass mode

  - Optional kill dry mode

  - Analog dry path for zero latency dry signal

  - Premium analog front end and output section

  - 24-bit 96khz a/d and d/a converters

  - 115db typical signal to noise at 50% wet mix

  - 120db at 100% dry mix

  - 109db at 100% wet mix

  - 20hz to 20khz frequency response

  - +8dbu maximum input level

  - Studio-grade audio input and output jacks

  - Sturdy and lightweight light blue anodized aluminum chassis

  - Durable black anodized aluminum knobs

  - Dimensions: 6.75" (171mm) wide, 5.1" (130mm) deep

  - Designed and built in the usa
