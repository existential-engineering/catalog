description: The DW Design Series made custom-style drums available to more drummers than ever, with 100% North American 8-ply maple shells.
details: |-
  The DW Design Series raised the bar for DW and made custom-style drums available to more drummers than ever before. This Design Series shell pack features 100% North American 8-ply maple shells constructed with HVLT grain orientation technology that deliver warm punch and satisfying resonance.

  The chrome hardware features low-mass mini-turret lugs, triple-flange hoops, STM (Suspension Tom Mounts) for reduced tension on mounted toms, and True-Pitch Tuning for increased tuning control.

  This shell pack offers 8x10″ and 9x12″ mounted toms, 14x16″ floor tom, and an 18x22″ kick drum. Matching Design Series snare sold separately. Includes two-piece bass drum pillow set (DSCPBDP2W).

  Design Series features include eight-ply 100% American maple shells with classic warm tones and versatility, STM Suspension Tom Mounts, True Pitch Tuning with extra threads to dial in tuning while reducing unwanted slippage, and graduated chrome steel triple flange counter hoops.
