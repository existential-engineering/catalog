description: >-
  The Yamaha CS-5 is an affordable monophonic analog synthesizer from Yamaha's CS series, offering
  a single VCO with multimode filtering and an external audio input for vintage bass and synth
  effects.
details: |-
  Produced from 1978 to 1983, the CS-5 sits at the entry level of Yamaha's revered CS synthesizer
  lineup, yet it delivers a surprisingly capable analog voice for its modest positioning. While it
  lacks the polyphony and complexity of its larger siblings like the CS-60 and CS-80, the CS-5
  excels at warm analog bass lines and bubbly synthesizer effects that have kept it relevant among
  vintage synth enthusiasts.

  The single VCO generates pulse and sawtooth waveforms alongside a noise generator, routed through
  a multimode resonant filter offering 12dB/octave highpass or lowpass and 6dB/octave bandpass
  modes. An LFO with sine, sawtooth, and sample-and-hold waveforms provides modulation, while the
  external audio input allows routing outside signals through the filter and VCA sections for
  creative processing.

  The CS-5 found its way into the hands of notable artists including Siouxsie and the Banshees,
  Depeche Mode, Richard Barbieri, and the Sneaker Pimps. Its 37 full-sized keys and CV/Gate
  connectivity make it a straightforward instrument that rewards direct, hands-on playing. With no
  patch memory, every sound is dialed in from scratch, encouraging the kind of happy accidents that
  define the appeal of vintage analog synthesis.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (pulse, sawtooth) plus noise generator
  - Filter: Multimode resonant (12dB/oct highpass or lowpass, 6dB/oct bandpass)
  - LFO: Sine, sawtooth, sample and hold
  - Keyboard: 37 full-sized keys
  - External Input: Audio routable through VCF and VCA
  - Memory: None
  - Effects: None
  - Control: CV/Gate
releaseDate: "1978"
