description: Direct bolt-in replacement low-frequency woofer for Avantone CLA-10
  and Yamaha NS-10M studio monitors, with single continuous press-formed cone
  and updated materials for extended lifespan.
details: |-
  The AV10 MLF is a replacement low-frequency driver designed as a near-exact
  match for the CLA-10 and original Yamaha NS-10M studio monitors. It matches
  the original from 20Hz to the crossover frequency, featuring a single
  continuous press-formed cone rather than the lapped seam design used in the
  originals.

  The bolt-in design requires no changes to the cabinet, and upgraded materials
  provide an extended lifespan while maintaining full dimensional compatibility
  with the original equipment.
specs: |-
  - LF Driver Size: 7.3"
  - Voice Coil Diameter: 1.5"
  - Impedance: 8 Ohms
  - DC Resistance: 6.9 Ohms
  - Compatibility: Avantone CLA-10, CLA-10A; Yamaha NS-10M
