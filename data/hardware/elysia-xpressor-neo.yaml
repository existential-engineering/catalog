details: |-
  xpressor|neo is a discrete Class-A analog stereo compressor for recording, mixing and mastering. It is offered in three formats, a 19-inch rack unit, a 500 series module and an elysia qube desktop unit, and elysia states that the sound quality is the same for all variants whichever one is chosen.

  Auto Fast addresses the compromise involved in choosing an attack time. A very short attack catches short peaks but also processes the sustaining signal, which can result in audible distortion, while longer settings reduce distortion significantly but leave the compressor too slow for fast impulses. In Auto Fast mode the attack time shortens only on short and loud impulses and then returns directly and automatically to its original setting. In all other cases the setting of the controller has priority.

  Two release curves are available, logarithmic and linear. A logarithmic release shortens its time constant as the amount of gain reduction increases, so short and loud peaks such as drums release quickly while the remaining material is processed with a slower release, which makes it useful for mastering and stereo bus compression. The linear mode has a straight release profile without the slower tapering characteristic of the Log mode, and suits more aggressive dynamics control of dry signals. Warm Mode is a slew rate limiter that reduces the speed of the output amplifier stages and affects frequency spectrum, harmonics and transient response, so fast transients are slowed down and the overall sound appears more round and merged.

  A low cut filter with a selectable frequency sits in the sidechain, so it does not affect the audio signal itself but the way in which the signal is compressed, reducing the influence low frequencies have on overall compression. The Gain Reduction Limiter sits in the control path rather than the audio path and limits the control voltage, so the amount of gain reduction never exceeds the value set with the GR Limit controller. A Mix controller cross-fades between the unprocessed and the compressed signal, which allows parallel compression inside the unit and makes additional routings redundant.

  The 19-inch rack version adds an external sidechain, which lets the compressor control its processing independently of the audio material running through it. Its rear panel carries XLR inputs and outputs, 1/4-inch TRS inputs and outputs, the EXT 1 and EXT 2 sidechain jacks and a power switch. EXT 2 is a sidechain send output carrying a buffered mono signal generated by summing the left and right input signals, and the external sidechain is activated by inserting a 1/4-inch phone jack into the EXT 1 sidechain return input, then deactivated by removing that jack.
specs: |-
  - Analog stereo compressor for recording, mixing and mastering
  - Discrete Class-A circuit design
  - Soft knee compression with smooth control response
  - Dual release curves, logarithmic and linear
  - Auto Fast attack mode for short and loud impulses
  - Warm Mode slew rate limiter for a second sound flavor
  - Sidechain low cut filter with selectable frequency
  - Gain Reduction Limiter in the control path
  - Mix controller for parallel compression
  - External sidechain with EXT 1 return and EXT 2 send, 19-inch rack version only
  - Frequency response: <10 Hz to 400 kHz (-3.0 dB)
  - THD+N at 0 dBu, 20 Hz to 22 kHz: 0.003 % at Mix 0 %, 0.007 % at Mix 100 %
  - THD+N at +10 dBu, 20 Hz to 22 kHz: 0.003 % at Mix 0 %, 0.02 % at Mix 100 %
  - Noise floor, 20 Hz to 22 kHz (A-weighted): -91 dB
  - Dynamic range, 20 Hz to 22 kHz: 112 dB
  - Maximum input level: +21 dBu
  - Maximum output level: +21 dBu
  - Input impedance: 10 kOhm
  - Output impedance: 68 Ohm
  - Dimensions (W x H x D, including knobs), 1 RU rack: 19" x 1.75" x 9.4" (483 mm x 44.45 mm x 238 mm)
  - Weight, 1 RU rack: 3.88 lbs / 1.76 kg
  - Power consumption, 1 RU rack: 9 Watts
  - Potentiometers: 41 steps
