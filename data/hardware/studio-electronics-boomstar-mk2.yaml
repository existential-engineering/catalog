description: >-
  The Boomstar MK2 is a range of five single-voice monophonic desktop analog synthesizers
  from Studio Electronics, each differentiated by a distinct filter design. The five
  models -- 4072, SE80, 8106, 5089, and SEM -- reproduce the sonic character of classic
  filters from ARP, Roland, Yamaha, Moog, and Oberheim respectively. The MK2 revision
  features revoiced circuitry, improved panel layouts, and a diode-based feedback circuit
  for enhanced harmonic distortion and dynamic range.
details: |-
  Studio Electronics began building analog synthesizers in the mid-1980s, and the Boomstar MK2 range represents their modern reinterpretation of that heritage. Offered in five compact desktop models, each unit pairs a dual-VCO signal path with a different classic filter topology: the 4072 channels the ARP 2600, the SE80 draws from Roland, the 8106 from Yamaha, the 5089 from Moog, and the SEM from Oberheim.

  The signal architecture features two voltage-controlled oscillators feeding a mixer section that includes white noise and ring modulation. Two full ADSR envelope generators are provided -- one hardwired to the filter cutoff, the other handling amplitude. A single voltage-controlled amplifier and low-frequency oscillator complete the voice.

  For the MK2 revision, Studio Electronics addressed user feedback from the original Boomstar line. The front panels were redesigned for clarity of function with improved signal flow, printed section dividers, and clear legends. The synths were revoiced for purity of tone and include a new diode-based feedback circuit. Controls feature lined, fluted knobs and lined quick-turn pot shafts for precise programming, with metal-shafted potentiometers throughout. The wooden bookends are hand-picked and handcrafted from Bocote, Marblewood, and Pau Ferro, drilled internally to eliminate visible screw holes.
specs: |-
  - Polyphony: 1 voice, monophonic
  - Oscillators: 2 VCOs
  - Waveforms: Pulse (variable width), sawtooth, sine, square, sub oscillator, triangle
  - Filter: Model-dependent (12dB 2-pole high-pass and low-pass with resonance)
  - Envelopes: 2 full ADSR generators
  - Amplifier: 1 VCA
  - LFO: 1 low-frequency oscillator
  - Mixer: White noise, ring modulation
  - Front Panel I/O: CV in, gate in, filter FM in, amplifier mod in, oscillator out, external signal in
  - Rear Panel I/O: MIDI in, MIDI out, 1/4-inch audio out, DC power input
  - Dimensions: 206 x 180 mm
  - Filter Models: 4072 (ARP 2600), SE80 (Roland), 8106 (Yamaha), 5089 (Moog), SEM (Oberheim)
