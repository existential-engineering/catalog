description: The Round Rider features a traditional and gently rounded cushion
  shape that is very popular due to its versatility. This new extra large Round
  Rider XL seat provides the same classic shape with a wider surface area and a
  thicker seat.
details: |-
  Round Rider XL Seat: In order to support diverse playing styles and provide the maximum in playing comfort, Tama developed the extra large and super-padded Round Rider seat top.

  Seat Lock: This is a great design that utilizes two-piece locking hinge collar system for superior throne base to seat connection and oversized wing nut for easy and secure tightening. TAMA removed the "wobble" which can typically affect the seat to throne base connection.

  1st Chair Height Adjustment: 1st Chair thrones offer the best of both worlds-the exact height adjustment of threaded rod thrones with the fast adjustment of T-bolted systems: Loosen the bolt (A) and raise the threaded rod to the approximate desired height (it's not necessary to get the exact height at this point). Screw the Height lock (B) down to the top of the nylon bushing. If a minor adjustment is necessary, simply turn the Height lock or rotate the seat. Tighten the bolt (A) firmly.

  Super Stabilizer Design: By lowering the distance of the center throne pipe to the floor, a lower center of gravity was achieved. Additional stability improved by lengthening the tripod leg stabilizer bar and designing double-braced tripod legs that do not taper at the point they insert into the rubber feet.

  Glide-Tite Grip Joint (US.PAT.NO.9631656): This Glide-Tite Grip Joint allows for a more secure attachment by using a metal-to-metal contact point. It is an extremely solid base attachment, even for the heaviest hitters.

  Rocklok: TAMA's "Rocklok" features a specially designed Nylon Bushing at the bottom of the throne's threaded rod that prevents side-to-side motion within the base. This special feature provides exceptional durability and stability.
