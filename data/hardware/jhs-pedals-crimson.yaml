description: A replica of the rare 1991-1992 Mike Matthews Red Army Overdrive
  (Sovtek Big Muff), the Crimson is a fuzz pedal with Volume, Tone, and Distort
  controls plus a JHS Mode mid-boost toggle.
details: |-
  The Crimson is part of JHS Pedals' "Legends Of Fuzz" series — a collection of historically rare and sought-after fuzz circuits. It is an exact replica of the 1991-1992 Mike Matthews Red Army Overdrive, the very first Russian-made Big Muff ever produced. Only manufactured in small numbers from 1991-1992, this version shares characteristics with the later Sovtek Civil War Big Muff but is warmer, clearer, and more defined. Controls include Volume (overall output level), Tone (bright to dark sweep), and Distort (fuzz amount). A side-mounted Mode button engages the JHS Mode — a mid frequency boost to cut through the mix. Battery operation is supported via a 9V battery accessible by loosening two rear screws.
