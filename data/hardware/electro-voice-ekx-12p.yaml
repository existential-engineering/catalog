name: EKX-12P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/ekx-12p/
description: The EKX-12P is a 12-inch two-way powered loudspeaker designed for
  portable sound applications. A 1500 W Class D amplifier drives a 12-inch
  EVS-12M woofer and a 1-inch DH-1M titanium compression driver behind EV's
  Signal Synchronized Transducers (SST) waveguide, delivering up to 132 dB peak
  SPL with 90 x 60 degree coverage. QuickSmartDSP provides single-knob LCD-menu
  control over presets, EQ, sub/top crossover, and delay. The 15 mm plywood
  enclosure with EVCoat finish includes aluminum pole mounts, eight M10 rigging
  points, and all-metal handles.
details: >-
  Class D power amplifier rated at 1500 W


  EVS-12M 12-inch (300 mm) woofer with DH-1M 1-inch titanium compression driver


  EV Signal Synchronized Transducers (SST) waveguide design


  QuickSmartDSP with single-knob LCD menu interface for presets, EQ, and
  crossover


  Maximum SPL of 132 dB


  Frequency response 60 Hz - 18 kHz (-3 dB), 50 Hz - 20 kHz (-10 dB)


  Coverage pattern 90 x 60 degrees, crossover at 1.7 kHz


  Intelligent thermal management with variable-speed fan


  15 mm plywood enclosure with EVCoat finish and 18 AWG steel grille


  Eight M10 threaded suspension points for rigging


  Aluminum pole mounts and all-metal handles


  Suitable for use as full-range main or stage monitor
specs: |-
  - frequencyResponse: 60 Hz - 18 kHz (-3 dB)
  - frequencyRange: 50 Hz - 20 kHz (-10 dB)
  - maxSpl: 132 dB
  - amplifierPower: 1500 W Class D
  - coverage: 90 x 60 degrees (H x V)
  - woofer: EVS-12M 300 mm (12 inch)
  - tweeter: DH-1M 1-inch titanium compression driver
  - crossoverFrequency: 1.7 kHz
  - dimensions: 607 x 375 x 356 mm (24 x 15 x 14 in)
  - weight: 18.8 kg (41.4 lbs)
  - shippingWeight: 22.9 kg (50.4 lbs)
  - powerConsumption: 1.8 A at 1/8 power
  - enclosureMaterial: 15 mm plywood with EVCoat finish
  - grille: 18 AWG steel with powdercoat
  - suspension: 8 M10 threaded mounting points
