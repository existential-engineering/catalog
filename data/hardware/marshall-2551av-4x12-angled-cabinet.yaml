description: Silver Jubilee reissue 4x12" angled guitar speaker cabinet finished in silver vinyl, loaded with four 70W Celestion G12 Vintage speakers for an ultra-focused, late-1980s voicing. Designed as the matched companion to the 2555X Silver Jubilee head, the 2551AV combines the angled top-cab format of a classic Marshall stack with switchable mono/stereo wiring (16Ω or 4Ω mono, 8Ω stereo) and a total power handling of 280W. Built in Marshall's UK factory.
details: |-
  A super stylish angled 4x12 Silver Jubilee reissue in silver vinyl. This cabinet contains four 70W Celestion G12 Vintage speakers and can be partnered with the 2555X for a Silver Jubilee stack, perfect for anyone looking to recreate that 80s look.

  This cabinet is also available as a straight base cab, allowing you to create your own Marshall stack.

  Inspired by the Silver Jubilee, it delivers an ultra-focused sound, reminiscent of the late 1980s.

  Built in our UK factory. Designed and engineered in UK. Made in UK.
