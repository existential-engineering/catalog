details: |-
  The UK-ABM-410H-EVO IV is a powerful and efficient 4x10" bass cabinet designed to command the stage. Four CIARE ceramic 10" drivers generate a full 1000W AES at 8 Ohms, and its 102dB sensitivity ensures exceptional headroom and cut-through. The voicing is balanced, with tight, aggressive lows, clear mids and a defined high-end that supports both rhythmic and melodic styles. A 340mm front-to-rear depth optimises airflow for even response, and professional Neutrik SpeakOn connectivity plus a rugged housing make it a cornerstone of the UK ABM EVO IV range.
specs: |-
