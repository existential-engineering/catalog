description: The Hi-X60 is a professional closed-back over-ear headphone
  engineered for loud environments and critical monitoring decisions. It
  features Austrian Audio's proprietary High Excursion drivers with a ring
  magnet system and copper-clad aluminum voice coil, delivering detailed sound
  with tight low-end response and minimal distortion. The closed-back design
  provides isolation suited for tracking, front-of-house mixing, and content
  creation. All-metal hinges and bow structure, soft memory foam ear and bow
  pads, a foldable design, and fully detachable cables make it a durable,
  serviceable professional tool.
details: |-
  The Hi-X60 uses Austrian Audio's in-house 44mm High Excursion drivers featuring a ring magnet system and copper-clad aluminum voice coil, enabling a wide frequency response of 5Hz–28kHz with very low distortion (< 0.1% THD at 1kHz). At 25Ω impedance and 110 dB SPL/V sensitivity it is suitable for use with portable sources as well as professional interfaces.

  Fully serviceable with replaceable ear cushions, bow pads, cables, and hardware. All-metal construction in hinges and bow. Foldable design. Includes hard case and two detachable cables (3m + 1.2m). VGP Gold (Summer 2024 and 2025) and PAM Award winner.
specs: |-
  - Frequency Response: 5 Hz – 28 kHz
  - Sensitivity: 110 dB SPL/V
  - THD (at 1 kHz): < 0.1%
  - Impedance: 25 Ω
  - Input Power: 150 mW
  - Driver Size: 44mm
  - Weight (without cable): 320 g
  - Dimensions: 200 × 170 × 85 mm
  - Connector: 3.5 mm (1/8-inch)
  - Included Cables: 3 m + 1.2 m (detachable)
  - Adapter: 3.5 mm to 6.3 mm (included)
