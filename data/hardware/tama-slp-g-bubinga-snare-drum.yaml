description: TAMA is known for its mastery of Bubinga, and this 12-ply 10mm
  Bubinga drum is a stunning example of that expertise. 2.3mm flanged hoops, and
  separate low-mass lugs enable the shell to resonate more naturally, giving the
  G Bubinga an extraordinarily punchy sound with a large helping of low-end.
details: |-
  Steel Mighty Hoop: TAMA's triple flanged 2.3mm steel hoops provide a "wetter" sound than die-cast zinc hoops.

  "Linear-Drive" Strainer (US. PAT.NO.8017846): The "Linear-Drive" strainer is designed for greater control of the lever adjustment arm and more precise control of the strainer's deployment motion. The strainer movement works in a true linear motion. Even if the strainer is engaged rapidly, you will not hear the typical "slap" of the snare wires hitting the bottom drumhead. To prevent the snare wires from loosening, this strainer also has a ratchet system on its tension adjustment mechanism. Single click adjustments offer a vertical pull of 0.083mm in wire motion, which allows for ultra-sensitive micro adjustments.

  20 Strand Starclassic Carbon Steel Snare Wire: Starclassic snares offer several unique, highly useful features. When adding more tension to the wires, the strands press closer to the snare head. We've also redesigned the angle of the end plates and added thinner straps to obtain optimum response.
