url: https://www.klarkteknik.com/en/products/0811-AAD
description: The DI 10P PRO DI is a passive stereo to mono direct injection box
  for interfacing MP3 and CD players, keyboard or drum submixers and other
  stereo sources to mixing consoles. It needs no external power and carries a
  custom-built MIDAS transformer with fully adjustable independent level
  controls for the two input channels.
details: |-
  A custom instrumentation-grade input circuit uses advanced analogue design techniques to create the ideal input impedance match, giving a low noise, low harmonic and phase distortion input stage with a flat frequency response from 10 Hz to 91 kHz (±1 dB).

  Connectivity is unbalanced stereo Left and Right RCA plus 1/8" TRS input connectors, and an industry-standard XLR output jack that sends a balanced, summed mono version of the input to a mixing board or other processing device.

  High-precision Left and Right Level controls accommodate a wide range of input signals. The Earth Lift switch separates the input and output grounds, eliminating earth loops between equipment on different mains electricity supplies, and the fully transformer-isolated design is intended to hold up in large-scale production environments.

  The ultra-compact enclosure is a thick aluminium extrusion that protects the electronics, with sturdy rubber corner bumpers for road use.
specs: |-
  - Frequency response: 10 Hz to 91 kHz (±1 dB)
  - Passive design, requires no external power
  - Custom-built MIDAS transformer, fully transformer-isolated
  - Stereo to mono summing with independent Left and Right level controls
  - Earth Lift switch separating input and output grounds
  - Aluminium extrusion enclosure with rubber corner bumpers
