description: Synth-1 – Nick Reinhart Artist Series Edition Single Note Synth
  Fuzz Reverse Attack / Swell Bandpass Filter Control Begins shipping 03-22-2021
details: |-
  The Synth-1 is a guitar-triggered, single-note wave generator that produces fuzzed-out synth waves. The Filter control shapes the tone of the wave, the Attack knob sets the lead-in time or swell of the note, and the Blend control sets how much of the natural guitar tone remains alongside the synth wave. Sounds range from slow-gear reverse swells to sharp, sustained tones.

  A Wave Selector footswitch changes wave modes while playing and a Chaos switch alters the triggering and octave behaviour. A side-mounted expression jack takes TRS control of the Filter, which gives the pedal wah-like movement from an expression pedal. Jacks are top mounted and the pedal is true bypass.

  This listing is the Artist Series edition of the Synth-1, carrying an illustration by Nick Reinhart reproduced on Keeley's UV printers over a matte red powder coated enclosure, with an Artist Series bottom print. Reinhart is an American musician and songwriter, a founding member and frontman of Tera Melos, and a member of Big Walnuts Yonder and Bygones. Keeley stated that a portion of Artist Series sales went to supporting artists. The pedal is designed and made in the USA.
