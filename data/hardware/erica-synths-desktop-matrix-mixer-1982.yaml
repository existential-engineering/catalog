id: A6_bo72t5Hp0hPVCBZdAY
name: Desktop Matrix Mixer
manufacturer: erica-synths
primaryCategory: mixer
categories:
  - routing
  - utility
url: https://www.ericasynths.lv/desktop-matrix-mixer-1982/
prices:
  - amount: 490
    currency: EUR
    term: perpetual
description: 6 – input, 16 - output desktop patch matrix.
details: |-
  The Erica Synths Matrix Mixer is a 16 input, 16 output desktop patch matrix. It routes and mixes signals with high precision and can also create buffered multiples and random patches.

  The signal path is all analogue, with 16 buffered, DC coupled inputs and 16 independent, buffered, DC coupled outputs. The matrix offers 256 connections, each with three attenuation levels, and a random pattern mode whose randomization area and density can be defined. 254 patterns can be stored in memory.

  It interfaces external instruments with a Eurorack system and is not limited to Eurorack. The Matrix Mixer works with semi-modular synthesizers, and through adapter cards with the EMS Synthi and the Buchla Music Easel.

  Patches change from panel buttons or from MIDI program change messages, which makes the Matrix Mixer useful in performances that combine Eurorack with other instruments such as drums, guitars or wind instruments. The instrument measures 225 x 226 x 44mm, weighs 1.25kg and runs from 12V DC through a universal AC/DC converter that is included.
specs: |-
  - All analogue signal path
  - 16 buffered, DC coupled inputs
  - 16 independent, buffered, DC coupled outputs
  - 256 connections, each with 3 attenuation levels
  - Random pattern mode with definable randomization area and density
  - 254 pattern memory
  - Pattern change via MIDI program change messages
  - 32 3.5mm jack sockets
  - 4 6.3mm jack sockets
  - Audio level: 10V ptp
  - Attenuation levels: 1, 0.7, 0.3
  - Power supply: 12VDC (a universal AC/DC converter included)
  - Size of the instrument: 225 x 226 x 44mm
  - Net mass: 1.25kg
