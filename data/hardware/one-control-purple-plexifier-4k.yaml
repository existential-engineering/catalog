details: |-
  The One Control Purple Plexifier 4K pedal is designed to capture the legendary tone of classic British plexi amplifiers. This updated pedal from us has the features, performance, and overall sound quality to deliver vintage rock tones with modern versatility. The PP4K is a compact and robust pedal, featuring a 4-knob design that enhances operability compared to its predecessor. The knobs include GAIN, LEVEL, TREBLE, and a new versatile MID control that allows for precise tone shaping. Its small enclosure makes it easy to transport, fitting effortlessly into any pedalboard setup. Vintage Tones: The pedal aims to reproduce the iconic plexi sound, characterized by its rich, harmonic distortion and dynamic response. Whether you're aiming for a clean boost or full-on high-gain distortion, the Purple Plexifier 4K delivers with remarkable authenticity. The tone remains clear and articulate, even at higher gain settings, allowing for expressive playing. MID and TREBLE Control One of the standout features of the Purple Plexifier 4K is its MID knob, which offers a wide range of tonal possibilities. Turning the MID knob counterclockwise cuts the midrange for a sharper, more aggressive tone, while turning it clockwise boosts the mids for a warmer, more vintage sound. The TREBLE knob, which adjusts frequencies around 2kHz, provides fine-tuning to achieve the perfect balance, making it possible to dial in the exact tone you need. Dynamic Response: The Purple Plexifier 4K excels in its dynamic response, behaving much like a real amplifier. The pedal responds well to different playing dynamics, allowing guitarists to control the strength of the distortion based on their touch. This means that even with the gain cranked up, playing lightly results in a cleaner sound, while digging in produces rich, saturated distortion. Wide Gain Range: The PP4K covers a broad gain spectrum, from clean and bluesy crunch to high-gain overdrive suitable for hard rock and heavy metal. This versatility makes it a valuable addition to any guitarist's rig, whether they're seeking subtle overdrive or full-bodied distortion. Purple Plexifier 4K shines not only as a standalone pedal but also when combined with other effects and various guitars. Pairing it with a British vintage fuzz and a Stratocaster produces legendary psychedelic tones, while combining it with an American fuzz and a Jazzmaster yields grungy, alternative sounds. The pedal also complements traditional overdrive pedals and classic distortions, making it easy to replicate the tones of many iconic guitarists. The One Control Purple Plexifier 4K pedal is a powerful tool for any guitarist looking to capture the essence of the classic plexi amplifier sound. Its dynamic response, wide gain range, and precise tone controls make it a versatile addition to any pedalboard. Whether you're a fan of vintage rock tones or seeking modern high-gain sounds, the Purple Plexifier 4K offers a pathway to the iconic sounds of rock history. With its robust build and intuitive design, this pedal is a must-have for guitarists aiming for that timeless, revered plexi tone. ●Controls
  ・VOL: Adjusts the volume. ・TREBLE: Adjusts the tone from the middle to high range. ・DIST: Adjusts the strength of the distortion. ・MID: Adjusts the way out of the middle range. ●Character
  ・Overdrive/distortion pedal to replicate a vintage plexi amplifier
  ・High response to detailed expressions
  ・New 4-knob version and evolved into a more modern and balanced sound
  ・Can also be used in combination with other pedals, guitars, etc. ・High-quality mini-size case made of aluminum
  ・Built-in battery use is also possible
  ・True bypass switching

  ●Specifications
  Input impedance: 500K
  Output impedance: 50K
  Driving voltage: 9V
  Current consumption: 3mA
  S/N ratio: -73dB
  Size: 39Wx100Dx31H mm (not including protrusions)
  47Wx100Dx48H mm (including protrusions)
  Weight: Approximately 160 grams (200 grams when the battery is inserted)
  ※Batteries are not included. PURPLE PLEXIFIER 4K (PP4Kn) is a British AIAB (amp in a box) that makes the sound of rock that will last forever. It's a sound that any generation can play and enjoy. If used in combination with other distortion devices, the usage will also expand greatly. I use PP4Kn as a distortion box in combination with SROD4Kn and LYC4Kn. ───Bjorn Juhl

  Time trip AIAB

  We are fascinated by this sound. It's no exaggeration to say that I've started really playing the guitar. Guitar Heaven. Our new pedal, PURPLE PLEXIFIER 4K is here. I will give you a mysterious experience. Our new pedal is remembered by your ears, your mind, and your brain. It realistically reminds me of sounds like initial impulses. Invite you to the past in an instant, and the next moment
  The experience of creating inspiration for the tone of the future
  I promise you. When you get this pedal, your sound is time-tripping. It will play the sound of the future. ・ PURPLE PLEXIFIER 4K Manual.pdf

