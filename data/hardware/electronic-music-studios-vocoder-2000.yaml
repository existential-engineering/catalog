description: The EMS Vocoder 2000 is a British-made 16-channel voice synthesizer designed
  by Tim Orr at Electronic Music Studios. Manufactured from 1976 to 1979, this
  rack-mounted vocoder features a sophisticated filterbank and remains comparable to
  Roland's SVC-350 from the same era.
details: |-
  Designed by Tim Orr, the EMS Vocoder 2000 emerged from Electronic Music Studios, a British synthesizer manufacturer renowned for their VCS3 and other innovative instruments. The unit provides professional-grade vocal synthesis and processing through a 16-channel architecture.

  The filterbank comprises fourteen 6th-order active bandpass filters, plus one lowpass and one highpass filter. Each channel has its own dedicated envelope follower and modulator for precise control over the vocoded signal.

  Sound generation options include a white noise generator and a pulse oscillator operating in the 0-1 kHz range. Both sources can be gated through a voiced/unvoiced detector, and the oscillator frequency can remain fixed or be amplitude-modulated for dynamic tonal variation. Additional controls include slew and freeze parameters for expressive sound shaping.

  The unit accepts 1/4-inch inputs for both speech and excitation sound sources, making it flexible for various synthesis and processing applications in studio and live settings.
specs: |-
  - Channels: 16-band vocoder
  - Filters: 14 x 6th-order active bandpass, 1 x lowpass, 1 x highpass
  - Envelope Followers: 16 channels with modulators
  - Oscillators: White noise generator, pulse oscillator (0-1 kHz)
  - Voiced/Unvoiced Detector: Yes
  - Control: Slew and freeze functions
  - Inputs: 1/4-inch for speech and excitation sources
  - Keyboard: None
  - Memory: None
  - Date Produced: 1976-1979
