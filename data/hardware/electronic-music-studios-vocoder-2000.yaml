description: >-
  The EMS Vocoder 2000 is a 16-channel analog vocoder designed by Tim Orr, offering detailed
  voice synthesis with individual filter bands, built-in oscillator and noise sources, and
  voiced/unvoiced detection.
details: |-
  Designed by Tim Orr, the EMS Vocoder 2000 is one of the classic analog vocoders from the
  British synthesizer manufacturer known for the VCS3 and Synthi series. Available since the
  late 1970s and remaining in production for several years, it delivers professional vocoding
  comparable to the Roland SVC-350.

  The vocoder provides 16 channels of analysis and resynthesis through a filter bank comprising
  14 sixth-order bandpass filters, one lowpass filter, and one highpass filter. Each channel has
  its own envelope follower and modulator for detailed spectral processing. Quarter-inch inputs
  accept both speech and excitation sound sources.

  Built-in sound sources include a white noise generator and a pulse oscillator covering 0 to
  1 kHz, allowing the unit to produce vocoded sounds without an external carrier signal.
  Voiced/unvoiced detection helps maintain intelligibility by distinguishing between pitched and
  unpitched speech components, while slew and freeze controls offer additional creative options.

  EMS also produced the Vocoder 3000, which shares the 16-channel architecture but adds
  individual level controls for each filter band, updated knobs and switches, and an LED signal
  meter. Released in 1977, the 3000 was used by Jimmy Edgar and Vangelis.
specs: |-
  - Type: 16-channel vocoder
  - Filters: 14x 6th-order bandpass, 1x lowpass, 1x highpass
  - Envelope Followers: 16
  - Modulators: 16
  - Built-in Sources: White noise generator, pulse oscillator (0-1 kHz)
  - Detection: Voiced/unvoiced
  - Controls: Slew, freeze
  - Inputs: 1/4-inch for speech and excitation
  - Keyboard: None
  - Memory: None
