description: Ultra compact standard controller for Traktor Pro. DJ3 is the
  perfect solution if you want to use Traktor Pro's internal software mixer,
  controlling linefaders, crossfader, EQ's, filters, effects, loops, pitch, key,
  cues, transport and browser.
details: |-
  DJ3 is an ultra compact standard controller aimed at DJs who want to use Traktor Pro's internal software mixer. The device controls linefaders, crossfader, EQ's, filters, effects, loops, pitch, key, cues, transport and browser.

  It is a special controller for DJ software, optimised for Native Instruments Traktor Pro, and setup files for Traktor Pro and Duo are shipped with the controller. The USB interface is class compliant, so no driver is necessary.

  Up to four decks can be controlled, with easy switching between deck A-C and B-D on the fly. Four FX slots are available via pots, buttons, FX select and snapshot functions, and about 250 commands are all freely reassignable. Four multifunctional encoders offer seven switchable groups for deck, global and FX control, and all controls carry a double function when the shift button is held down.

  Twenty coloured buttons and 16 LEDs in different colours display various information, with play and sync states indicated by feedback data from the computer software. The unit is powered over the USB bus with a consumption of less than 500 mW / 100 mA.

  The casing is a very compact black plastic desktop format measuring 180 x 105 x 70 mm and weighing 350 g, with a silver aluminium front plate finished in an abrasion resistant anodised coating and inscriptions. Faders, pots and encoders are high-quality ALPS parts, fitted with new rubber knobs for the best tactile feeling.
specs: |-
  - Special controller for DJ software (optimised for Native Instruments Traktor Pro)
  - Setup files for Traktor Pro/Duo shipped with the controller
  - USB interface, class compliant, no driver necessary
  - Controls up to four decks, easy switching between deck A-C and B-D on the fly
  - Four FX slots available (pots, buttons, FX select, snapshot functions)
  - About 250 commands, all freely reassignable
  - 4 multifunctional encoders with 7 switchable groups for deck, global and FX control
  - 20 coloured buttons
  - All controls with double function by holding down the shift button
  - 16 LEDs in different colors to display various information
  - Indication of play and sync states by feedback data from computer software
  - USB bus powering, consumption less than 500 mW / 100 mA
  - Very compact design in a black, plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - System requirements: PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - System requirements: Native Instruments Traktor Pro/Duo (as of version 1.2.4) or software which allows user assignments of continuous parameters (CC) and note commands
