details: |-
  DISCONTINUED

  STAY TUNED FOR MORE DYNAMIC MIC MODELS COMING FROM AA IN 2021

  DM20

  The DM20 is a super cardioid dynamic microphone, based on the original RE20. The DM20 produces a vocal presence peak which can enhance the voice. It also has an internal windscreen and does not require a shock mount. It features two bass roll off switches and a high frequency filter. Capsule:

  The Advanced Audio DM20 features a high efficiency capsule with a 200ohm voice coil. The super cardioid pattern is optimal for rejection of room sound. Circuit:

  The DM20's high efficiency capsule requires no output transformer, which results in a much better transient response than most dynamic microphones. The left of the three switches rolls bass out 3db at 120Hz and 5dB at 50Hz. The center switch rolls out the bass 3dB at 210Hz and 10dB at 100Hz

  The switch on the right lowers 5kHz by 4dB. Specifications:

  - Sturdy molded plastic roadcase
