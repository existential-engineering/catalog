description: >-
  Novation's 8-voice analog-modeled synthesizer with a 25-key keyboard, featuring three
  oscillators, a 12-band vocoder, built-in effects, and an arpeggiator in a compact format.
details: |-
  The K-Station reimagines Novation's A-Station rack module as an accessible keyboard instrument, building on the legacy of the original Bass Station. It delivers 8 voices of analog-modeled synthesis through three oscillators offering sawtooth, triangle, sine, pulse width modulation, and additional waveforms, with oscillators capable of unison, sync, and FM operation plus a noise generator.

  The filter section provides a lowpass resonant design switchable between 12 dB and 24 dB per octave slopes, paired with dual ADSR envelopes and two LFOs featuring sample-and-hold and MIDI sync. Unlike the cramped A-Station interface, the K-Station spreads 25 knobs across a spacious layout with a large LCD display, making hands-on sound design far more intuitive.

  Built-in effects include reverb, delay, chorus, flanger, phaser, distortion, and an envelope filter, while a 12-band vocoder processes external audio such as vocals or drum loops. The programmable arpeggiator syncs to MIDI clock with sweep range storage across up to four octaves. With 400 program locations including 200 factory sounds, the K-Station packs professional synthesis features into a remarkably compact 2-octave keyboard.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 3 (sawtooth, triangle, sine, pulse, square, and variations)
  - LFOs: 2 (triangle, saw, square, sample-and-hold)
  - Filter: Lowpass resonant, switchable 12 dB/24 dB per octave
  - Envelopes: 2 ADSR + FM attack/decay
  - Vocoder: 12-band
  - Arpeggiator: Up/down/up-down, up to 4 octaves, latchable
  - Effects: Reverb, distortion, chorus, phaser, delay, panner, envelope filter
  - Keyboard: 25 keys, touch-sensitive, pitch/mod wheels
  - Memory: 400 programs (200 factory)
  - Control: MIDI In/Out/Thru
releaseDate: "2002"
