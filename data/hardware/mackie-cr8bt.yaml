description: Mackie CR8BT Creative Reference Powered Studio Monitors with
  Bluetooth combine professional-quality sound with a tone shaping knob for
  moving from studio reference to casual listening to party mode.
details: |-
  CR8BT is the 8 in / 203 mm model in Mackie's third-generation CR Series of Creative Reference powered studio monitors. The pair is sold with one powered speaker carrying the amplification and all connections, and one passive speaker driven from it over the powered cabinet's wire terminals.

  A tone control knob on the front of the powered speaker shapes the response, starting from the transparent setting expected of a studio monitor and progressively adding bass and high-end sparkle for casual listening or party playback. A rear location switch selects between desktop (near-field) and bookshelf (far-field) placement.

  Rear-panel connections cover balanced or unbalanced 1/4 inch TRS left and right line inputs, unbalanced RCA left and right line inputs, and an unbalanced 3.5 mm stereo input. The manual states that all inputs may be used simultaneously and sum together rather than overriding one another. A 1/8 inch headphone output on the front panel mutes the power amp when a plug is inserted.

  Bluetooth 5.0 audio streaming is paired from the Running Man button on the front of the powered speaker, so phones and laptops can play through the monitors without a cable.

  Amplification is 140 watts RMS of bi-amplified Class D amplification, driving a 8 in / 203 mm woven woofer and a 1 inch silk-dome tweeter with a protective grille, with the crossover at 2.0 kHz. The cabinet is solid MDF in a black vinyl wrap with a custom-tuned rear port tube.
specs: |-
  - Sound-shaping tone control
  - Location switch with desktop and bookshelf modes
  - TRS, RCA and 3.5 mm inputs
  - Bluetooth connectivity
  - Built-in headphone output
  - Silk dome tweeter with protective grille
  - 140 watts RMS of bi-amplified Class D amplification
  - 8 in / 203 mm woven woofer
  - 1 inch / 25 mm silk-dome tweeter with protective grille
  - Frequency response (-3 dB): 47 Hz - 20 kHz
  - Frequency response (-10 dB): 44 Hz - 20 kHz
  - Maximum SPL peak: 108 dB
  - Crossover frequency: 2.0 kHz
  - Size (H x W x D): 14.8 x 9.9 x 13.6 in / 376 x 251 x 345 mm
  - Weight: 35.3 lb / 16.0 kg
  - Line input power: detachable line cord, 100V-240V~, 50-60 Hz, 150W
  - Bluetooth protocol: 5.0 (audio streaming)
  - Input impedance: 10 kOhm
  - Output type: 1/8 inch stereo headphones
  - Enclosure: solid MDF, black vinyl wrap, custom-tuned rear port tube
  - Powered speaker position select switch (left or right placement)
