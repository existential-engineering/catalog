description: 8" powered studio monitors with tone control and Bluetooth.
details: |-
  CR8BT studio monitors have the clear, accurate sound you need to produce and record music. With the tone knob turned all the way left, you get a flat frequency response for tracking and mixing. Crank the tone knob to the right to hear more bass and sparkle.

  When your space serves as an office, recording studio, streaming den, living area and more, you need speakers that can do it all.

  Use the tone control knob to shape the sound, starting with the transparent response you expect from studio monitors.

  Flip the location switch between desktop speaker mode and bookshelf speaker mode to optimize CR8BT for wherever you place them.

  Enjoy true flexibility with wireless Bluetooth streaming.
specs: |-
  - 8" woven woofer
  - Silk dome tweeter with protective grille
  - 140 watts RMS bi-amplified Class D amplification
  - Size (H x W x D): 14.8 x 9.9 x 13.6 in / 376 x 251 x 345 mm
  - Weight: 35.3 lb / 16.0 kg
  - Sound-shaping tone control
  - Location switch (desktop and bookshelf modes)
  - Bluetooth connectivity
  - Built-in headphone output
