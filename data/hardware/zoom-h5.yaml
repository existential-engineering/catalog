description: Ideal for documentaries, podcasting, audio for video, and
  professional sound design, the Zoom H5 portable handheld recorder lets you
  quickly record up to four input signals regardless of your audio experience.
details: |-
  Four tracks of simultaneous recording and interchangeable mic capsules make the H5 flexible and powerful enough to meet the evolving needs of today's creators.

  The design of the XYH-5 mic capsule allows the H5 to handle up to 140 dB SPL, equivalent to the sound of a jet aircraft from less than 200 feet away, and to keep levels under control the H5 offers compression and limiting. The rubberized housing and shock-mounted microphones minimize vibration and handling noise, while a low-cut filter helps eliminate wind noise and other kinds of low frequency rumble. The H5 uses the same high-quality, low-noise preamps as the flagship H6.

  The Pre-Record function captures and saves two seconds of audio before you hit RECORD, perfect for unexpected starts. The Auto-Record function allows the H5 to automatically start and stop recording at predefined sound levels. The Backup-Record function automatically records a duplicate set of L/R tracks with 12 dB less input gain, a safety net for your recordings (44.1 and 48 kHz WAV files only).

  Six interchangeable mic capsules are available: XYH-5, XYH-6, MSH-6, SGH-6, SSH-6 and EXH-6. The H5's XLR/TRS combo inputs can handle both mic- and line-level signals for microphones, wireless receivers, mixers, keyboards and more, and each input has a dedicated gain control knob. The supplied XYH-5 capsule also provides an additional mic/line input via a 1/8-inch mini phone jack.

  A Line Out with adjustable volume allows you to send audio from the H5 to the input of a camera or other device without the need for an attenuator cable. In addition, there is a separate headphone output with a dedicated volume control. You can use both outputs simultaneously to route audio to a DSLR while monitoring with headphones.

  Record continuously for about 10 hours with just 2 AA batteries, or extend recording time with the optional AD-17 AC adapter. The H5 can record up to six monophonic WAV files, or up to three stereo files.
specs: |-
  - Includes detachable X/Y capsule (XYH-5) capable of handling 140 dB SPL
  - Shock-mounted mics for reduced handling noise
  - Compatible with all Zoom input capsules
  - Four-track simultaneous recording
  - Records directly to SD and SDHC cards up to 32 GB
  - Up to 24-bit/96 kHz audio in BWF-compliant WAV or a variety of MP3 formats
  - Two mic/line inputs with XLR/TRS combo connectors, each with selectable phantom power and -20 dB pad
  - Built-in effects, including low-cut filtering, compression, and limiting
  - Auto-Record, Pre-Record and Backup-Record functions
  - Multichannel and stereo USB audio interface for PC/Mac/iPad with Loop Back function
  - Powered by two AA batteries or via USB
  - About 10 hours of operation with alkaline batteries
  - Recording media: SD card 16 MB to 2 GB, SDHC card 4 GB to 32 GB
  - Display: backlit LCD, 128 x 64 pixels
  - Inputs L/R (XYH-5 X/Y mic): unidirectional, sensitivity -45 dB at 1 kHz and 1 Pa, input gain -inf to 52 dB, max sound pressure input 140 dB SPL
  - Phone Out: 1/8-inch stereo mini jack, output level 20 mW + 20 mW into 32 ohm load
  - Built-in speaker: 400 mW, 8 ohm, mono
  - Stereo mode WAV (BWF-compliant): 44.1/48/96 kHz at 16/24-bit, maximum 2 simultaneous tracks
  - Stereo mode MP3: 44.1 kHz at 32 to 320 kbps
  - Multitrack mode WAV (BWF-compliant): 44.1/48 kHz at 16/24-bit mono or stereo, maximum 6 simultaneous tracks (L/R + Input 1/2 + L/R backup)
  - USB mass storage class operation: USB 2.0 High Speed
  - USB audio interface, multitrack mode: USB 2.0 High Speed, 44.1/48 kHz at 16/24-bit, 4 in / 2 out
  - USB audio interface, stereo mode: USB 2.0 Full Speed, 44.1/48 kHz at 16-bit, 2 in / 2 out (iPad operation supported in stereo mode only)
  - USB bus powered operation possible
  - Battery operation in stereo file mode (X/Y mic, 44.1 kHz/16-bit): about 10 hours
  - Battery operation in multi file mode (X/Y mic plus Inputs 1 and 2, 48 kHz/24-bit): about 5 hours
  - Power requirements: 2 x AA (LR6) batteries, optional AD-17 AC adapter (DC 5V/1A, USB type), or USB bus power
