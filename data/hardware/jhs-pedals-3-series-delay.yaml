details: |-
  The JHS Pedals 3 Series is a collection of pedals designed to give you affordability and simplicity without compromising quality. Each 3 Series pedal is made in Kansas City, MO, using high-quality parts, quality control, and attention to every detail.

  The JHS Pedals 3 Series Delay lets you choose between rich and warm or clear and pristine echoes. The Delay knob gives you 80ms to 800ms of delay time, covering everything from slapback to long ambient washes of pad-like echo.

  The Type toggle allows you to select between a clearer digital-voiced delay and a darker analog-voiced delay. The Delay will give you classic bucket brigade runaway when you max out the Repeats knob in analog-voiced delay mode.
