description: The SM-8 is the 8-inch model in Kali Audio's Santa Monica Series, a
  self-powered 3-way studio monitor with 300 W of Class D power and 119 dB max
  SPL. The SM-Series features user-editable DSP to process room calibration
  profiles on board, for a perfect fit in your room.
details: |-
  The Santa Monica Series builds on Kali's founding principle of delivering the best possible product for the price, and incorporates the best available materials, components, and manufacturing. The result is a high performance studio monitor that is ready for the most demanding mixing and mastering applications.

  The SM-8 is self-powered by a 3-channel Class D amplifier with discrete LF, midrange, and HF sections totalling 300 W, driving a 1-inch metal dome tweeter, a 4-inch optimized profile paper cone midrange and an 8-inch optimized paper woofer in a front-ported enclosure. Crossover points sit at 280 Hz between the woofer and midrange and at 2800 Hz between the midrange and tweeter.

  With onboard processing for room calibration, each speaker can be programmed with delays, trims, and EQs to deliver accurate response in your room. Per loudspeaker the user-definable DSP offers 8 parametric EQs, 10 ms of delay and -12 to +6 dB of trim, with DSP latency under 3 ms.

  User-editable DSP is available using Kali Control Panel software, available for both Mac and Windows. Kali Control Panel works in both Online Mode, meaning that each speaker is connected to a network with an ethernet cable, or Offline Mode, meaning that a USB thumb drive is used to load files onto the speaker. Kali Control Panel is in beta at the time of writing, and not all features may work as intended.

  The SM-Series features mounting holes on both the top and bottom of the loudspeaker. Kali recommends using a speaker specific U-bracket from Triad-Orbit, but any speaker mount with a 4.25 x 2-Inch bolt pattern that is capable of holding the SM-Series' weight will also work.
