url: https://harbeth.co.uk/p3esr-xd-loudspeaker/
description: A compact use-anywhere loudspeaker whose redesign maximises the
  performance potential of the Harbeth exclusive 110mm RADIAL2 cone technology.
  Optimised to present an easy electrical load to even low powered amplifiers.
details: |-
  Harbeth's development team has, once again, redefined what is possible from this use anywhere loudspeaker, described on the page as the best iteration of the BBC mini-monitor by far.

  The completed redesign maximises the performance potential of the Harbeth exclusive 110mm RADIAL2 cone technology, delivering breathtaking transparency, accurate bass and dynamic integration across the audio spectrum.

  Arguably one of the most advanced speakers in its class, the P3ESR XD is capable of being used in a wide range of listening environments and is optimised to present an easy electrical load to even low powered amplifiers.

  The cabinets are handmade and feature veneers that vary in colour, shade and grain structure. Not all finishes are available in all countries.
specs: |-
  - Technical features: 110mm Harbeth RADIAL2 bass/mid, 19mm ferrofluid-cooled tweeter
  - Frequency response: 75Hz to 20kHz, +/-3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms, easy to drive
  - Sensitivity: 83dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 15W per channel
  - Power handling: 50W programme
  - Dimensions: 306 x 190 x 184 mm (+12mm for grille and binding posts)
  - Connectors: two 4mm Harbeth branded binding posts
  - Weight: 6.1kg each (without packing)
  - Space needs: ideally more than 0.30m from the rear wall
  - Stands: optimally to bring ears level with the tweeters (tweeter 230mm up from cabinet base)
  - Packing: pair per protective carton
  - Grille colour: black
  - Finishes: oak, walnut, cherry, rosewood, black ash, silver willow
