id: wFZMQZwA8KSRewlRlpr81
name: ABM 300 EVO II
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-300-evo-ii
description: The ABM 300 EVO II is a 325W RMS bass amp head designed for bass
  purists and tech-heads alike. Three rotary tone controls give 20dB of cut and
  boost at 60Hz, 660Hz and 5kHz, supplemented by two pairs of sliders. A
  switchable passive/active input blends solid-state and dual-triode tube preamp
  stages, and the amp adds a footswitchable sub-harmonic generator, a
  front-panel balanced DI with pre/post EQ switching, a sub-bass output, tuner
  output, FX loop and line input.
details: |-
  Ashdown ABM bass head. 325W RMS power stage. Three rotary tone controls give 20dB cut/boost at 60Hz, 660Hz and 5kHz, supplemented by two pairs of sliders giving 15dB cut/boost at 180Hz, 340Hz, 1.3kHz and 2.6kHz; EQ footswitchable in/out and flat/shaped. Single input switchable for passive and active instruments, blending solid-state and dual-triode tube preamp stages, presettable and footswitchable. Footswitchable sub-harmonic generator that tracks the main signal an octave lower with a level control. Front-panel balanced DI out with pre/post EQ switching, a sub-bass output, tuner output, FX loop and a line input; output muting cuts the DI while leaving the tuner output live for silent tuning. Power output: 325W. Frequency response: -3dB @ 17Hz and 30kHz. High instrument input impedance: 3.9M Ohms (150mV - 20V p-p). Low instrument input impedance: 10k Ohms (300mV - 40V p-p). Line input impedance: 22k Ohms, 0dBu. Sub output impedance: 1k Ohms, 0dBu nominal. DI output: 600 Ohms balanced, 0dBu nominal. Tuner output impedance: 22k Ohms, 0dBu. EQ: Bass +/-15dB @ 45Hz, Middle @ 660Hz, Treble +/-15dB @ 7kHz. FX send/return: 22k Ohms, 0dBu nominal. Minimum speaker impedance: 4 Ohms. Dimensions (H x W x D): 134 x 474 x 315 mm. Weight: 12 kg.
specs: |-
  - Power output: 325W RMS
  - Minimum speaker impedance: 4 Ohms
  - Frequency response: -3dB @ 17Hz and 30kHz
  - High instrument input impedance: 3.9M Ohms (150mV - 20V p-p)
  - Low instrument input impedance: 10k Ohms (300mV - 40V p-p)
  - Line input impedance: 22k Ohms, 0dBu
  - Sub output impedance: 1k Ohms, 0dBu nominal
  - DI output: 600 Ohms balanced, 0dBu nominal
  - Tuner output impedance: 22k Ohms, 0dBu
  - FX send/return impedance: 22k Ohms, 0dBu nominal
  - Dimensions (H x W x D): 134 x 474 x 315 mm
  - Weight: 12 kg
