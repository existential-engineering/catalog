name: Flexus Surr 200
manufacturer: klipsch
primaryCategory: speaker
url: https://www.klipsch.com/products/flexus-surr-200
description: The Flexus Surr 200 is a pair of wireless Dolby Atmos surround
  speakers featuring two 3" up-firing and two 3" side-firing drivers for
  immersive 3D audio. Each speaker is independently powered via a single AC cord
  with no speaker wires required, and communicates wirelessly via the included
  Flexus Transport dongle.
details: |-
  The Klipsch Flexus Surr 200 elevates home theater performance through immersive Dolby Atmos technology, creating a true multichannel surround sound setup that places audio in 3D around and above the listener. Each speaker in the pair houses two 3" up-firing drivers and two 3" side-firing paper cone drivers in a sealed plastic and metal enclosure with an ebony vinyl finish.

  Designed for simplicity, the system requires no junction boxes, power adapters, or speaker wire runs between speakers. Each unit plugs independently into a wall outlet, while wireless audio is handled by the included Flexus Transport dongle. Controls, LED indicators, and the power connection are positioned on the bottom surface to maintain a clean aesthetic in darkened rooms.

  Wall mounting is supported via a 1/4"-20 threaded insert on the rear, with the bottom-routed power cord allowing flush placement. The audio electronics were co-engineered with Onkyo and subjected to over 1,000 rigorous tests. USB ports are included for firmware updates and MP3 test/debug playback.
