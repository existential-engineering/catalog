details: |-
  Product Overview

  The Heil PR 22 UT (Utility) is the quintessential dynamic utility microphone in the Heil Sound lineup. Designed to deliver high vocal clarity, exceptional midrange presence, and natural frequency response, the PR 22 UT provides the exact same element and audio engineering as the standard PR 22 in a streamlined utility package with essential accessories. It serves as an all-around workhorse microphone for live vocal sound reinforcement, studio recording, snare drums, guitar speaker cabinets, hi-hats, and broadcast applications.

  Featuring a large dynamic element with a wide 50 Hz to 18 kHz frequency response, the PR 22 UT handles high sound pressure levels up to 145 dB SPL without distortion. Its tight cardioid polar pattern yields -30 dB of rear rejection at 180° off-axis , isolating the sound source while minimizing monitor feedback, stage bleed, and room reflections. Built with a specially designed internal shock mount, the PR 22 UT significantly reduces mechanical vibration and handling noise, delivering clean, professional audio for stage and studio engineers alike. Each model comes with a black grill, mic clip, windscreen, and zippered carrying bag.
specs: |-
  - Full PR 22 Performance in a Utility Package: Incorporates the identical dynamic element, internal diaphragm construction, and voicing of the flagship PR 22 at a budget-friendly utility price point.
  - Exceptional Rear Noise Rejection (-30 dB): Cardioid pickup pattern suppresses unwanted off-axis noise at 180°, reducing stage volume bleed and preventing monitor feedback.
  - Specialized Internal ISO Shock Mount: Advanced internal capsule mounting reduces mechanical vibration, stand thuds, and handling noise during live stage performances.
  - High SPL Handling (145 dB Max SPL): Handles high acoustic pressure without clipping, making it an ideal choice for loud snare drums, percussion, and guitar amplifiers.
  - Superior Vocal Articulation & Presence: Voiced with an upper-midrange presence that enhances vocal speech clarity and stick articulation on snare drums without requiring heavy EQ adjustments.
  - Versatile Utility Application: Excels across multiple sound sources including lead and backing vocals, snare drum (top or bottom), hi-hats, acoustic guitar, and brass.
  - Complete Accessory Set Included: Package includes a mic clip, foam windscreen, and a padded zipper carrying bag.
  - Element Type: Dynamic.
  - Frequency Response: 50 Hz – 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -30 dB.
  - Impedance: 600 ohms balanced.
  - Output Level (@ 1 kHz): -55 dB.
  - Max SPL: 145 dB.
  - Output Connection: 3-pin XLR.
  - Weight: 14 oz (396.8 g).
