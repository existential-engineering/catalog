description: An all-analogue JFET feedback compressor that works equally well on
  guitars, bass, vocals, synths, and whole mixes, with a simple three-control
  interface covering threshold pad, compression ratio, and makeup gain.
details: |-
  The Accountant uses all-analogue JFET feedback compression with fixed attack
  (5 ms) and release (500 ms) times. The PAD control attenuates the signal before
  compression, effectively setting at what level compression kicks in. RATIO selects
  3:1, 6:1, or 12:1 compression ratios. VOLUME controls post-effect output level.

  Protected against reversed polarity. No battery connection inside the pedal.
  True true bypass. Works with all signal sources: guitars, bass, vocals, synths,
  and whole mixes.
specs: |-
  - True true bypass
  - Dimensions: 3.7" x 1.5"
  - Input impedance: 1 MΩ
  - Output impedance: <5 kΩ
  - Power supply: 9 to 9.6 VDC center-negative
  - Current draw: 12 mA
  - Fixed threshold: 50 mVRMS
  - Attack time: 5 ms
  - Release time: 500 ms
  - Compression ratios: 3:1, 6:1, 12:1
  - 1/4" mono input and output jacks
  - 2.1mm DC connector
  - No battery connection
  - Made in Hull, Québec
