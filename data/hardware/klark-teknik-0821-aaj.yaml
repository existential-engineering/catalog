description: The DN370 is a dual channel 30 band graphic equaliser with enhanced
  Proportional-Q response, swept high-pass and low-pass filters and two swept
  notch filters per channel. The 3U rackmount unit is aimed at Front of House
  and stage monitoring work, and carries Phoenix-style connectors for
  installation use.
details: |-
  The enhanced Proportional-Q equalisation behaves differently from the Constant-Q graphic equalisers more common on the market. At low amounts of cut or boost the filter width is relatively broad, allowing gentle contouring of the frequency spectrum, and it becomes progressively narrower as the amount of boost or cut is increased, giving a more focused response so that problem frequencies can be attenuated quickly.

  The response used on the DN370 minimises interaction between adjacent frequency bands, allowing subtle tonal correction without frequency response ripple so that more of the musical content is preserved.

  The graphic equalisation section is augmented with a set of continuously swept filters. The control knobs incorporate a push function to switch a filter in and out whilst maintaining the frequency setting, and feature illuminated LED rings for status display at wide distances and viewing angles. The 12 dB/oct high-pass filter covers 20 Hz to 500 Hz for rejection of unwanted low and subsonic frequencies, and the 12 dB/oct low-pass filter covers 2 kHz to 20 kHz to tailor the upper frequency response to the monitor speaker.

  The two notch filters have overlapping frequency ranges of 20 Hz to 2 kHz and 200 Hz to 20 kHz, allowing surgical removal of resonances and feedback with minimal effect on the rest of the programme material. Overlapping the notch filters with each other and with the graphic equaliser bands allows up to 45 dB of attenuation. A channel gain control ranges from full mute to +6 dB, which can be used to mute the signal path immediately in the event of sudden on-stage feedback.

  Inputs are electronically balanced with common-mode rejection, and the electronic servo-balanced outputs have high-drive capability to cope with long cable runs. Power-off bypass relays preserve the signal path in the event of a power failure, and the recessed front panel power switch is designed to avoid accidental operation. Transformer balancing is available as an additional option on both the inputs and the outputs.
specs: |-
  - Dual channel, 30 band graphic equalisation per channel
  - Enhanced Proportional-Q filter response
  - Fader range: ±12 dB, switchable to ±6 dB
  - 45 mm centre-detented long-throw oil-damped precision faders with protective covers
  - High-pass filter: 12 dB/oct, 20 Hz to 500 Hz, continuously swept
  - Low-pass filter: 12 dB/oct, 2 kHz to 20 kHz, continuously swept
  - Two swept notch filters per channel, 20 Hz to 2 kHz and 200 Hz to 20 kHz
  - Up to 45 dB attenuation using notch filters with the graphic equaliser bands
  - Channel gain range: mute to +6 dB
  - Electronically balanced inputs, electronic servo-balanced outputs
  - Transformer balancing available as an option on inputs and outputs
  - Power-off bypass relays
  - Phoenix-style connectors provided for installation
  - 3U rugged steel rackmount enclosure
  - Auto-voltage-sensing universal switch-mode power supply
