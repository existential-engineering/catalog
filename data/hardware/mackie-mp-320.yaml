description: Triple Dynamic Driver Professional In-Ear Monitors.
details: |-
  Looking for a cleaner sound without sacrificing bass response? MP-320 could be the one for you. Featuring three dynamic drivers in a 3-way crossover configuration, MP-320 delivers excellent mix translation with plenty of punch, thanks to an all dynamic driver configration, and it won't break the bank either.
specs: |-
  - Frequency Response: 20 Hz - 20 kHz
  - Impedance: 15.5Ω±15%
  - Transducer Type: Triple Dynamic
  - Sensitivity: 100dB±3dB@1mW at 1KHz
  - Precision 3-way crossover ensures a balanced sound across the entire frequency range
  - Up to 40db of sound isolation
  - Equipped with a detachable MMCX connector that swivels
  - 4 different types of ear tips included and in three different sizes
