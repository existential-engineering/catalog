description: MP-320 In-Ear Monitors for precise and professional stage
  monitoring. These monitors feature three dynamic drivers for incredible punch.
details: |-
  Featuring three dynamic drivers in a 3-way crossover configuration, MP-320 delivers excellent mix translation with plenty of punch, thanks to an all dynamic driver configuration.

  The ergonomically molded low-profile enclosure offers maximum comfort, sound isolation and bass response, with up to 40 dB of sound isolation. The clear enclosure offers a streamlined onstage look.

  The shielded, braided cable is designed for extra durability and sonic performance, and is equipped with a detachable MMCX connector that swivels for increased comfort and durability. The over-ear design keeps the monitors securely in the ears and the cables behind the head.

  Four different types of ear tips are included in three sizes: foam, silicone, wide-bore silicone and triple flange. A hard molded case, a gold-plated 1/8 inch to 1/4 inch adapter, an additional cable with in-line remote and a cleaning cloth are also included.
specs: |-
  - Frequency Response: 20 Hz to 20 kHz
  - Impedance: 15.5 ohms +/-15%
  - Transducer Type: Triple Dynamic
  - Sensitivity: 100 dB +/-3 dB @ 1 mW at 1 kHz
  - Precision 3-way crossover
  - Up to 40 dB of sound isolation
  - Detachable, swiveling MMCX cable connectors
  - Passive design, no power supply or battery required
