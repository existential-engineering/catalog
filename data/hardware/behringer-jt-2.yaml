url: https://www.behringer.com/en/products/0718-aay
description: A compact monophonic analog synthesizer modelled on the Roland
  Jupiter-8, with dual VCOs offering saw, triangle/sine, square, noise and PWM
  plus oscillator sync and FM, a switchable 12/24 dB resonant lowpass filter and
  an additional highpass filter. A paraphonic two-note mode, a four-pattern
  arpeggiator and 16-voice Poly Chain extend it, and the main module can be
  transferred into a standard Eurorack case.
details: |-
  The Roland Jupiter-8 defined a sound that built careers, lush, powerful, instantly recognisable. The JT-2 captures that DNA in a compact Eurorack format. Dual VCOs deliver saw, triangle/sine, square, noise, PWM, oscillator sync and FM, everything you need to build the rich, complex patches the Jupiter is famous for.

  The switchable 12/24 dB resonant lowpass filter is the star of the show, giving you both the soft glassy sweeps and the punchier edge in one synth. An additional highpass filter adds fine-tuning headroom that the original never offered. Two ADSR envelopes with key follow modulate VCOs, VCF and VCA, while the LFO with sine, saw, square and random waveforms drives expressive modulation. Cross modulation and oscillator sync between VCOs unlock the gnarlier corners of analog sound design.

  Switch to paraphonic mode for two-note performances, or use the 16-voice Poly Chain to link multiple JT-2 units for true polyphonic firepower. The four-pattern arpeggiator (Up, Down, Up-Down, Random) ranges over four octaves for instant inspiration. External CV/gate, full MIDI implementation and a complete Eurorack-transferable layout make the JT-2 a no-compromise reissue.
specs: |-
  - Monophonic analog synthesizer with dual oscillator design
  - Pure analog signal path based on authentic VCO, VCF and VCA designs
  - Authentic reproduction of the original Jupiter 8 circuitry
  - 2 oscillators with saw, triangle/sine, square, noise, PWM, oscillator sync and FM
  - LFO and envelope control of VCO 1 and/or VCO 2, with FM cross modulation and oscillator sync between the VCOs
  - Switchable 12 dB / 24 dB resonating low-pass filter
  - Additional high-pass filter
  - LFO with sine, saw, square and random waveforms
  - 2 analog ADSR envelope generators with key follow, modulating VCOs, VCF and VCA
  - Arpeggiator with Up, Down, Up-Down and Random patterns, up to 4 octaves range
  - Paraphonic mode for 2-note performances
  - 16-voice Poly Chain for up to 16-voice polyphony across multiple units
  - Complete Eurorack solution: the main module can be transferred to a standard Eurorack case
  - 53 controls for direct real-time access to all important parameters
  - External CV and Gate input
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - Editable from the SynthTribe app (Windows and macOS), which connects over USB
