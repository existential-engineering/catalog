details: |-
  Fear Factory's Dino Cazares sees his next signature guitar in Kiesel's Dino. Based on the Kyber Headless shape, the model features an altered body, flush-mount strap buttons, and standard Raw Tone, with Digital Camo available for a limited time.

  The horns and bevels are reworked to shape a new upper body. The upper cuts are further reduced and are accompanied by slight yet defined contours.

  With the launch of the Dino comes the Ultra Thin Velocity Neck Profile. Shaving off nearly .1 of an inch from the 12th fret, the neck profile begins to rival thin necks from other manufacturers.

  The Dino features Cazares' signature Seymour Duncan, the Retribution, which is described as having the right amount of gain, enhanced attack definition and maximum string clarity. It is wired to a master volume control with push-pull coil splitting and a flush mount output jack.

  As the second camo seen from Kiesel, the Dino camo scheme differentiates itself with a digital appearance in red, grey, and black. Kiesel notes that the camo finishes are done by hydro dipping, a process that yields slightly different results, so small imperfections such as watermarks, drips, bubbles or smears can appear.
specs: |-
  - Based on the Kiesel Kyber Headless shape, with reworked horns and bevels
  - Available in multiple string counts, with headless and multiscale configurations
  - Construction: bolt-on with radiused neck heel
  - Body: swamp ash
  - Finish: Jet Black in Raw Tone standard; limited-time Digital Camo in red, grey and black applied by hydro dipping
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck profile: Ultra Thin Velocity, nearly .1 inch thinner at the 12th fret than the standard profile
  - Fingerboard: ebony with 14 inch radius, or ebony with 20 inch radius
  - Frets: 24 stainless steel jumbo, .110 inch wide x .055 inch tall
  - Scale length options: 25.5 inch, and multiscale 25.5 to 26.5 inch, 25.5 to 27 inch, 26 to 27.5 inch
  - Bridge pickup: Seymour Duncan Dino Cazares signature Retribution active humbucker, powered by an internal battery rather than an external supply
  - Electronics: master volume control with push-pull coil splitting, flush mount output jack
  - Bridge: Hipshot fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot fixed headless multiscale bridge, .4125 inch (10.5 mm) spacing
  - Headpiece: Kyber mini headpiece with ebony overlay and silver Kiesel logo
  - Inlays: no top inlays, with black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Flush-mount strap buttons
  - Neck width: 1.69 inch to 2.12 inch wide at the nut depending on configuration, 0.75 to 0.82 inch thick at the 1st fret, 0.76 to 0.90 inch thick at the 12th fret
  - Body dimensions: 33 inch, 33.5 inch or 34 inch long, 1.375 inch thick, 12.6 inch to 13.1 inch wide
  - Weight: 4.8 lbs, 5 lbs or 5.5 lbs depending on configuration
