description: >-
  The Roland D-20 is a 61-key digital workstation combining Linear Arithmetic Synthesis with an
  8-voice sequencer and rhythm track, serving as a more affordable alternative to the D-50.
details: |-
  Released in 1988, the Roland D-20 brought the company's Linear Arithmetic Synthesis technology
  into a self-contained workstation format. While more closely related to the D-10 and D-110 than
  the flagship D-50, the D-20 distinguished itself by integrating an 8-voice sequencer with a
  dedicated rhythm track, making it a complete composition tool in a single instrument.

  The LAS engine combines digital waveforms with ROM-based PCM samples, a synthesis method that
  requires some programming skill to unlock its full potential. The tonal architecture of tones,
  partials, and timbres can be confusing at first, but rewards exploration with sounds ranging from
  realistic acoustic emulations to distinctly digital textures. The 128 preset and 64 user patches
  provide a solid starting library, while 128 performance memories allow complex multitimbral setups.

  With 32-voice polyphony, 9-part multitimbrality, and a built-in drum kit with 63 sounds, the D-20
  was positioned as an all-in-one solution for bedroom producers and gigging musicians on a budget.
  Eight onboard effects, reverb processing, and support for both internal and external memory
  storage rounded out a capable if modestly specified package that remains a nostalgic favorite for
  its characteristic late-1980s digital sound.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 9 parts
  - Sound Engine: Linear Arithmetic Synthesis (LAS) with ROM samples
  - Memory: 128 preset patches, 64 user patches, 128 performances
  - Drums: 1 kit, 63 sounds
  - Effects: 8 effects
  - Sequencer: 8-voice with rhythm track
  - Keyboard: 61 keys with velocity
  - Control: MIDI
releaseDate: "1988"
releaseDateYearOnly: true
