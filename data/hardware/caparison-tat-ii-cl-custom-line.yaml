  Caparison Guitars – 30th Anniversary Custom Line

  Created to mark the 30th anniversary of Caparison Guitars, the Custom Line TAT II is released as a strictly limited-edition model in the iconic Red Sunset and Iceberg colours. These finishes are a direct tribute to the guitars shown in Caparison's first catalogue in 1996, and have been recreated by Itaru Kanno , the original designer responsible for hand painting those legendary instruments. The result is a faithful revival that captures the character and individuality of the original guitars—no two are exactly alike. The 2025 Custom Line TAT is an exclusive 30th anniversary model and a true collector's piece representing three decades of Caparison craftsmanship and design .
