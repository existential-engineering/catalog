description: >-
  The Akai AX80 is an 8-voice programmable analog synthesizer from 1984, Akai's
  first professional keyboard, featuring dual oscillators per voice, velocity
  sensitivity, and distinctive blue and orange LCD bar-graph displays.
details: |-
  Released in 1984, the AX80 holds the distinction of being the first
  professional keyboard instrument produced by Akai, a company better known at
  the time for its tape recording equipment. It arrived as a fully featured
  8-voice polyphonic analog synthesizer ready to compete with established
  instruments from Roland and Sequential Circuits.

  Each voice features two analog oscillators producing sawtooth or variable
  pulse-width waveforms, plus a sub-oscillator for added low-end weight.
  Individual VCFs and ADSR envelopes per voice ensure clean polyphonic
  articulation, while three LFOs provide modulation for the two oscillator
  banks and the filter independently.

  The AX80 is particularly noted for its punchy analog character, drawing
  favorable comparisons to the Rhodes Chroma Polaris and Roland Juno-106. It
  excels at bass, brass, and synthetic textures, though its string patches are
  considered average. The 61-key velocity-sensitive keyboard adds expressive
  nuance that many competing instruments of the era lacked.

  One of the AX80's most celebrated features is its blue and orange LCD
  bar-graph display system, widely regarded as one of the best on-board
  parameter displays of the 1980s. Mark Bell of LFO notably used the AX80
  extensively while producing Bjork's Homogenic album.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 per voice + sub-oscillator (sawtooth, variable pulse width)
  - Filter: 8 VCFs (1 per voice)
  - Envelopes: 8 ADSRs (1 per voice)
  - LFO: 3 (OSC 1, OSC 2, VCF)
  - Keyboard: 61 keys, velocity-sensitive
  - Memory: 96 patches (64 user, 32 preset)
  - Features: Chord memory, pitch/mod wheels
  - Control: MIDI
releaseDate: "1984"
