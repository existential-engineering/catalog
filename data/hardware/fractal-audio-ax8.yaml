url: https://www.fractalaudio.com/ax8-amp-modeler-multi-effects/
description: The AX8 is a powerful amp modeler and multi-Fx floor unit with
  incredible tone. It features the best amp and effects models from the Fractal
  Audio Axe-Fx, in a pedalboard format with 11 footswitches and hands-on
  controls for the amp modeler.
details: |-
  The AX8 is an all-in-one amp modeler and multi-effects pedalboard processor that brings many of the leading-edge technologies of the Axe-Fx II into a floor unit. Quantum Amp Modeling gives the AX8 over 222 modeled amps covering sparkling cleans, edge-of-breakup tones, touch-sensitive overdrive and high-gain distortion.

  Ultra-Res speaker simulations provide a range of cab tones, with factory cabs plus 512 user cab memory slots that hold entries from Fractal Audio Cab Packs. The AX8 can also output a second signal with no cab simulation, typically used to drive a power amp and conventional guitar speakers on stage while a fully simulated chain goes to front of house.

  The effects use the same core technology and algorithms as those of the Axe-Fx II: G3 drive pedals, HD reverbs, compressors, delays, EQs, choruses, phasers, flangers, rotary, tremolos, pitch shifting and wah. Every effect offers XY switching, giving each block two completely different sound settings from a single block instance, and there are 512 preset memory slots using a 4x12 layout grid with eight easy-access scenes per preset.

  The chassis is black steel with aircraft aluminum end panels, a top handle and guard, and eleven quiet solid-state stomp switches with no mechanical contacts to fail. Eight dedicated LED-ring knobs give direct access to Drive, Bass, Mid, Treble, Presence, Depth, Master and Level, joined by five soft knobs beneath the LCD display, six buttons including SHIFT, front-panel LED meters and 27 LEDs in three colors.

  The back panel carries an instrument input with Fractal Audio's Secret Sauce circuitry, stereo main outputs on XLR and 1/4-inch Humbuster, an S/PDIF output, and a stereo-in and stereo-out effects loop that can be repurposed as a utility input or output. USB, MIDI IN and MIDI OUT round out the set, and four onboard jacks accept external switches or expression pedals such as the Fractal EV-1. A precision full-screen tuner, two global equalizers and tap tempo are built in, the AX8-Edit software editor is included free, and the unit works with Fractal-Bot for preset sharing, backup and restore.
specs: |-
  - Quantum Amp Modeling with over 222 amp models
  - Ultra-Res speaker cab simulation with 512 user cab memory slots
  - Compatible with the full Fractal Audio Cab Pack library
  - 29+ drive pedal models
  - 19 reverb types
  - 7 filter types
  - 4 compressor types
  - Graphic and parametric EQs, plus two global equalizers
  - Limiter, gate and front-end noise gate
  - Customizable Wah and Whammy, fixed and intelligent harmony
  - Phaser, Uni-Vibe, flanger, chorus, panner/tremolo and rotary speaker
  - Mono guitar synth
  - Built-in looper
  - True tape echo
  - XY switching gives each effect block two independent sound settings
  - 512 preset memory slots with a 4x12 layout grid
  - Eight scenes per preset
  - Eleven solid-state stomp switches, eight for instant-access effects switching and three assignable Function switches
  - Eight LED-ring amp control knobs for Drive, Bass, Mid, Treble, Presence, Depth, Master and Level
  - Five soft knobs beneath the LCD display and six buttons including SHIFT
  - 27 LEDs in three colors with front-panel LED meters and indicators
  - Four onboard jacks for external switches or expression pedals
  - Precision full-screen tuner and tap tempo
  - Upgradeable firmware, compatible with Fractal-Bot and the free AX8-Edit editor
  - Black steel chassis with aircraft aluminum end panels and a top handle and guard
