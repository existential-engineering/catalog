details: |-
  The result of a unique collaboration between live sound mixing experts Soundcraft and renowned plug-in manufacturer, Universal Audio, the Soundcraft Realtime Rack brings industry-standard UAD studio plug-ins to the Soundcraft platform. The Realtime Rack hardware and software delivers tight integration of Soundcraft Vi consoles and UAD Powered Plug-Ins, with (48 kHz) sub-2 millisecond latency and full snapshot store and recall with Soundcraft’s CUE/Snapshot system. Realtime Rack’s robust SHARC-based processors run audio over standard Optical MADI connections and dual-redundant internal power supplies ensure that audio signals keep running, even in the event of a power supply failure. Soundcraft Realtime Rack brings the stability of DSP and the sound quality that Soundcraft and Universal Audio are known for in a scalable, low-latency processing environment. UAD Powered Plug-Ins. What Live Sound has been waiting for Combining the intuitive Vistonics operator interface with pristine sound quality and powerful mixing features, the Soundcraft Vi Series is already established as the first-choice live sound mixing console for touring and installed applications worldwide. Now the new Soundcraft Realtime Rack provides access to Universal Audio's acclaimed analogue audio processing emulations and award-winning UAD plug-ins. Realtime Rack software gives Vi console operators all the control they need to insert UAD plug-ins on individual channels, auxiliary channels, and master busses - just as easily as real hardware. A comprehensive snapshot system allows total recall of all plug-ins and their settings, while tight network integration with the Vi Series ensures that all settings of the application are stored inside the console. Two versions are available: The Realtime Rack Ultimate Live with 74 plug-ins available, and the Realtime Rack Core Live with 14 plug-ins. Additional UAD plug-ins can be purchased any time from UA's Online store. The 8.6.3 software update for Realtime Rack makes available a further 46 plug-ins which can be added to either the Ultimate or Core Live units. The UAD Powered Plug-Ins platform offers the world's most authentic analogue hardware emulations and award-winning audio plug-ins. Powered by Universal Audio's DSP Accelerator hardware, UAD Powered Plug-Ins deliver rich, analogue sound quality that would be difficult or impossible to achieve with native recording systems. From rare compressors and equalizers, to vintage reverb processors and tape machines, UAD Powered Plug-Ins inject three-dimensional 'out-of-the-box' analogue sound to your mixes. The Realtime Rack Ultimate Live (74 plug-ins available): including - • 1176 Classic Limiter Collection • 1176LN Legacy Limiter • 1176SE Legacy Limiter • API 500 Series EQ Collection • API Vision Channel Strip • dbx 160 Compressor • CS-1 Channel Strip • Cambridge Equalizer • Cooper Time Cube Delay/Modulation • DreamVerb Reverb • Empirical Labs Fatso JR/SR • EMT 140 Plate Reverb • EMT 250 Digital Reverb • EP-34 Tape Echo • Fairchild Tube Limiter Collection • Harrison 32C Equalizer • Helios 69 Equalizer • Lexicon 224 Reverb • Little Labs IBP • Little Labs VOG • Manley Massive Passive • Moog Filter • MXR Flanger Doubler • Neve 1073 • Neve 1081 • Neve 31102 • Neve 33609 • Neve 88RS • Oceanway Studios • Precision Buss Compressor • Precision De-Esser • Precision Enhancer Hz • Precision Enhancer kHz • Precision Equalizer • Precision K-Stereo • Precision Limiter • Precision Maximizer • Pultec Passive EQ Collection • Pultec EQP-1A Legacy Equalizer • Pultec Pro Legacy Equalizer • RealVerb Pro Reverb • Roland CE-1 • Roland Dimension D • Roland RE-201 • SPL Transient Designer • SSL E Channel Strip • SSL G Bus Compressor • Studer A800 Tape Machine • Teletronix LA-2A Limiter Collection • Teletronix LA-2A Legacy Limiter • Teletronix LA-3A Limiter • Trident A-Range Realtime Rack Core Live (14 plug-ins included): including - • 1176LN Legacy Limiter • 1176SE Legacy Limiter • dbx 160 Compressor • CS-1 Channel Strip • Lexicon 224 Reverb • Pultec EQP-1A Legacy Equalizer • Pultec Pro Legacy Equalizer • RealVerb Pro Reverb • Studer A800 Tape Machine • Teletronix LA-2A Legacy Limiter Any plug-ins from the Ultimate Live and Optional list can be added to the Core unit by purchasing from the Universal Audio website. Realtime Rack Optional Plug-ins for Ultimate Live and Core Live (46 plug-ins available) (Available with RTR software version 8.6.3 only) • UA 610-A Tube Preamp & EQ • UA 610-B Tube Preamp & EQ • Neve 1073 Preamp & EQ • Thermionic Culture Vulture • Manley Stereo Variable Mu Limiter Compressor • Ibanez Tube Screamer TS808 • Bermuda Triangle • Raw Distortion • Neve 88RS Channel Strip Collection • Precision Channel Strip (EX-1) • Precision Delay Modulation (DM-1) • Precision Delay Modulation Long (DM-1L) • Precision Reflection Engine (RS-1) • AKG BX 20 Spring Reverb • Oxide Tape Recorder • Fender '55 Tweed Deluxe • Dangerous BAX EQ Mix (Brainworx) • Dangerous BAX EQ Master (Brainworx) • Brainworx bx_refinement • Brainworx bx_saturator • Chandler Limited GAV19T Amplifier (Brainworx) • Valley People Dyna-mite (Softube) • Tonelux Tilt (Brainworx) • Tonelux Tilt Live (Brainworx) • elysia• mpressor (Brainworx) • elysia• alpha compressor (Brainworx) • AMS RMX16 Digital Reverb (AMS-Neve) • Summit Audio TLA-100A Compressor (Softube) • Vertigo Sound VSC-2 Compressor (Brainworx) • Vertigo Sound VSM-3 Mix Satellite (Brainworx) • MDWEQ5 Parametric Equalizer (MDW) • Friedman BE-100 • Friedman DS-40 • Sound Machine Wood Works • Marshall Plexi Super Lead 1959 (Softube) • Tube-Tech CL 1B Compressor (Softube) • Ampeg SVT-VR Bass Amplifier (Brainworx) • Ampeg SVT-3 PRO Bass Amplifier (Brainworx) • Tube-Tech EQ Collection (Softube) • Eventide H910 Harmonizer • Marshall Silver Jubilee 2555 (Softube) • Marshall Bluesbreaker 1962 (Softube) • Marshall JMP 2203 (Softube) • Brainworx bx_digital V3 • Brainworx bx_digital V3 Mix • Chandler Limited Curve Bender Mastering EQ (Softube) Plug-ins from this list can be added to both the Ultimate Live and Core Live units by purchasing from the Universal Audio website. A 14-day demo/evaluation mode is available for all of the above. Bundle contents are subject to change Get the Realtime Rack application software for Mac
specs: |-
  - Audio Connector Type: MADI - Dual Optical SC-Plug (ISO/IEC 9314-3) MADI Format:
  - MADI Format: AES10 (64 channels)
  - Supported Sample Rates: 44.1 kHz, 48 kHz, 88.2 kHz, 96 kHz (48kHz only, when used with Soundcraft Vi console)
  - Host Connector Type: Thunderbolt (Dual connectors)
  - Word Clock: BNC - One Input, One Output
  - Word Clock Input Termination: 75 Ohms, switchable
  - Supported Clock Sources: MADI, Word Clock, Internal (Thunderbolt/FireWire)
  - AC Connectors: 2
  - AC Connector Type: IEC Male with integrated switch POWER SUPPLY
  - Power Configuration: Two switching power supplies. Integrated failover circuit controls redundant power supplies
  - AC input Range: 100-240 VAC
  - Power Rating: Less than 30 Watts
  - Frequency: 50-60 Hz
  - Humidity: 60% maximum
  - Temperature: 0°C to +45°C
  - Rack Space: 1U
  - Chassis dimensions: 431.8 mm (17") W x 304.8 mm (12") D x 33.8 mm (1.3") H
  - Weight: 4.1 kg (9 lbs)
  - Shipping Weight: 6.3 kg (14 lbs)
