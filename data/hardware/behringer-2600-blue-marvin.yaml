description: A limited-edition semi-modular analog synthesizer with three VCOs
  and a multi-mode VCF in an 8U rack-mount format, its pure analog signal path
  based on the authentic ARP 2600 circuitry of the 1970s with matched
  transistors and JFETs. Against the standard Behringer 2600 it adds a
  mechanical spring reverb, hand-picked components and uni-color LEDs on every
  fader, with 93 patchable ins and outs.
details: |-
  Great care has been taken in engineering the BLUE MARVIN's true-to-the-original analog circuitry, semi-modular architecture and triple VCO design, all of which come together to recreate the classic tones evocative of classic electronic music. This highly-focused attention to detail gives the BLUE MARVIN its ultra-flexible sound-shaping capability, which then empowers you to recreate amazing tones, from super-fat bass and tasty leads all the way to full-on dreamy ambience from the far reaches of your imagination.

  Just like the original, the BLUE MARVIN is a semi-modular synthesizer that allows you to start making music without having to plug patch cables into different modules. But don't let that stop you, the BLUE MARVIN also features 93 patchable ins and outs, so you can configure the synthesizer any way you want.

  The BLUE MARVIN features 3 VCOs with FM inputs. You can even patch the VCOs' default waveforms to square, triangle, saw, sine or pulse which allows for an awe-inspiring palette of tonal possibilities. Any of the VCOs can also be switched to operate as a low frequency oscillator while the multi-mode VCF acts as the VCO mixer of the BLUE MARVIN where VCOs one, two and three can be blended. Combine that with its integrated resonance control, filter mode switch and the ability to output to other areas of the synth and the BLUE MARVIN becomes a fantastic and flexible tool for creating a diverse palette of tones.

  To top off the already amazing array of waveforms and mixing capabilities of the BLUE MARVIN, an incredible range of modules and effects are at your disposal including a ring modulator, lag processor, sample and hold, Schmitt trigger, envelope follower, a noise generator with continuously variable color and even a mechanical spring reverb to add spaciousness and a sense of scale to your music. Two dedicated LFOs with pulse and sine wave outputs are included as well.

  With the integrated ADSR and AR envelope generators of the BLUE MARVIN, you can create some truly dynamic progressions in your songs. If simple ADSR controls are not enough, flipping the Time Factor switch to x2, x1 or x0.5 gives you more control over the shape of the envelope, so you can have notes that are short and percussive or long and atmospheric. The VCA section offers further tone shaping alongside the VCF, with differential inputs for both linear and exponential response which accept control voltage signals via 3.5 mm jacks.
specs: |-
  - Special-edition semi-modular analog synthesizer in 8U rack-mount format
  - Pure analog signal path based on the authentic ARP 2600 circuitry of the 1970s, with matched transistors and JFETs
  - Reproduction of the ultra-rare ARP Blue Marvin circuitry, with specially selected opamps and transistors
  - Semi-modular architecture requires no patching for immediate performance
  - 3 VCOs, each with LFO mode, FM inputs and multiple wave-shape outputs
  - VCO waveforms: square, triangle, saw, sine, pulse
  - Multi-mode VCF with dedicated low-pass output plus an additional switched high/notch output, with resonance control; the VCF also acts as the VCO mixer
  - ADSR and AR envelope generators with switchable Time Factor (x2, x1, x0.5)
  - 2 dedicated LFOs with pulse and sine wave outputs
  - Ring modulator, lag processor, sample & hold, Schmitt trigger and envelope follower
  - Noise generator with continuously variable colour
  - Mechanical spring reverb
  - Differential (+/-) input VCA with both linear and exponential control inputs, accepting control voltage via 3.5 mm jacks
  - Switched Post Filter Distortion (PFD) / Inverter option on the voltage processor
  - Additional utility modules: attenuator, mixer, inverter, slew rate limiter and 4-way multiple
  - External audio input for processing external sound sources
  - 78 faders and buttons
  - Uni-color LED on each fader
  - 93 patchable inputs/outputs, 3.5 mm
  - Headphone output with dedicated level control
  - MIDI implementation with MIDI channel and Voice Priority selection
  - Blue painted finish
