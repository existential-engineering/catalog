description: Legendary FET Limiting Amplifier
details: Black Lion Audio's Bluey is a recreation of the 1176 Blue Stripe unit
  belonging to recording engineer Chris Lord-Alge — a unit that accumulated
  decades of modifications and component replacements creating unique sonic
  characteristics. Black Lion analyzed the original in detail to recreate its
  beast-like limiter qualities. Features custom Cinemag transformers, a
  recreated console insert path for the same 'console feel' CLA uses, active
  wet/dry mix control for easy parallel compression, and stereo link via RCA.
  Hand-assembled and tested in the USA with vintage-inspired PCB layout, 1%
  resistors, and polyester capacitors.
specs: |-
  - Type: FET Limiter (1176 Blue Stripe-inspired)
  - Number of Channels: 1
  - Transformers: Custom Cinemag
  - Ratio: 4:1, 8:1, 12:1, 20:1
  - Attack: Continuously variable 20µS to 800µS
  - Release: Continuously variable 50mS to 1200mS
  - Controls: Attack, Release, Mix, Input, Output
  - Form factor: 2U rackmount
  - Power Source: IEC AC cable
  - Made in USA
