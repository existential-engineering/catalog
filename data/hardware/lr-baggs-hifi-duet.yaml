details: |-
  Most acoustic pickups make you choose. You can get the tone you want, but fight feedback all night. Or you can get the volume you want, with a thin, plastic sound that leaves your performance feeling flat. With the HiFi Duet, you get the best of both worlds, with a system that’s just as feedback stable as a traditional undersaddle pickup. We spent 50 years obsessing over acoustic physics to create a system that captures the true voice of your guitar without the constant stress of feedback. It’s built to deliver the rich tone of a studio mic directly to your line-out, so your audience hears your guitar exactly the way you do.
specs: |-
  - Hybrid bridge-plate pickup + internal microphone blend system (guitar-mounted)
  - Pair of lightweight bridge-plate sensors
  - Silo Mic with new capsule and tuned suspension, internally mounted
  - Active, all-discrete Class-A FET input preamp
  - Controls: Volume, Mix (mic/pickup blend), Mic Level, Battery Check
  - 9V battery, 150-hour runtime
  - 1/4-inch endpin jack assembly included
  - For steel-string and 12-string guitars (not recommended for nylon)
  - Requires professional installation
