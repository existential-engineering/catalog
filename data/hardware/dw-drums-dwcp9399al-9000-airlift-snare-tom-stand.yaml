details: |-
  The AirLift version of the sturdy 9399 Tom/Snare Stand includes all of the features of the 9399 such as integrated crutch tip isolators, Mega Tripod Base and removable basket, with the added functionality of an internal AirLift shock (U.S. Patent No. 7,718,878).

  The stand is effortlessly height adjustable and extremely versatile, securely cradling drums from 10-16″ in diameter.

  Every piece of the AirLift hardware series is equipped with an internal pneumatic shock to expedite kit setup and height adjustments.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
  - Snare/tom stand with integrated neoprene isolators
  - AirLift shock for effortless height adjustment (U.S. Patent No. 7,718,878)
  - Mega-Tripod base for unsurpassed stability
  - Large reset handle and TechLock for easy and secure angle adjustments
  - Removable basket
  - Cradles drums from 10-16″ in diameter
