description: >-
  The Roland GR-300 is an analog guitar synthesizer released in 1980 that transforms
  guitar signals into rich, polyphonic synthesizer tones. Designed as a floor-mounted unit
  for live performance, it connects to a compatible Roland guitar controller and can
  output guitar, synth, or a mix of both signals. It was notably used by Pat Metheny, Andy
  Summers, Robert Fripp, Adrian Belew, and Pete Townshend.
details: |-
  The GR-300 represented a major advancement in guitar synthesis technology, succeeding the GR-500 which suffered from serious tracking issues that limited its usefulness. The new model could produce stable effects for virtually all styles of guitar playing, including hammering, chopping, harmonics, and glissandos—capabilities that were previously impossible to achieve with guitar synthesizers.

  Designed as a rugged floor-mounted unit, the GR-300 was built for live performance with major functions controlled via foot switches, eliminating the need for hand operation during performance. Users could output either the guitar signal, the synthesizer signal, or a mix of both, and connection to external amplifiers allowed the use of additional effects like chorus, flangers, and phase shifters.

  Pat Metheny is the most notable user of the GR-300, having made it a signature part of his sound. Other prominent users include Andy Summers of The Police, Robert Fripp and Adrian Belew of King Crimson, and Pete Townshend of The Who. The instrument remains a sought-after piece of vintage gear for its unique analog guitar synthesis tones.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 per voice
  - VCOs directly harmonically locked to each string, tunable separately
  - LFO for vibrato effects
  - Filter: -24 dB per octave with envelope modulation
  - Floor-mounted design with foot switch control
  - Outputs: Guitar, synth, or mixed signal
