details: |-
  A professional true diversity wireless system featuring the ADX20i clip-on cardioid condenser for sax, trumpet, and brass instruments.

  Designed for stage, broadcast, and recording, the ADX20i handles high sound pressure levels and provides natural sound reproduction at very close distances. The lightweight, compact, and easy-to-use ADX20i features a shock-mounted clip to help reduce noise and vibration. The spring tension clip makes for easy mounting on the bell of an instrument, and a flexible gooseneck allows for precise positioning.

  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include a rackmount kit for mounting two systems in one rack space, active directional antennas, and an antenna distribution system for up to four systems (4 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - RF frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum tuning
  - True diversity reception
  - Microphone: ADX20i clip-on cardioid condenser (bodypack transmitter)
  - Shock-mounted spring-tension instrument clip with gooseneck
