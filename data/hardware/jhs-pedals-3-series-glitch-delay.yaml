details: |-
  The 3 Series Glitch Delay is a delay pedal built around one singular obsession: time-based glitching. Inspired by the legendary Line 6 DL-4 and the ambient, smearing delay work of Bill Frisell, this pedal locks your core delay time in place while a randomized glitch event alters the playback speed in real time.

  This bends, drags, and warps repeats inside the delay circuit's feedback loop. The result is a living, breathing delay that moves with you without losing your tempo. With Glitch fully counterclockwise it's a warm, musical delay pedal — no glitch, just classic delay tones. Turn it clockwise and glitch probability increases up to 50% (when the knob is full clockwise), with the LED flashing in sync with each event.

  The Time control spans 20ms to 980ms, from tight slapback to long ambient pads. The Repeats control adds beautiful modulation as it climbs, and an internal limiter allows endless, never-runaway feedback. New notes stack on top of older, slowly dissolving repeats. The Mix toggle sets delay level at either a subtle 35% or a more present 80%.
