description: A bass preamp pedal designed to reproduce the sound of old school
  60s/70s bass amplification, adding low-end boost with extremely low
  distortion. It offers volume, brilliance, and gain controls to shape the tone.
details: |-
  Features The CRIMSON RED BASS PREAMP was designed to reproduce the iconic old school 60s / 70s electric bass sound by giving the bottom end a boost at an extremely low distortion level. Specifications Input impedance: 650K Output impedance: 25K Drive voltage: 9V～15V Current consumption: 1mA @ 9V S/N ratio: -80dBm Size: 39Wx100Dx31H mm (excluding protruding parts) 47Wx100Dx46H mm (including protruding parts) Weight: Approx. 160 grams True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply
  Bjorn's Description The CRIMSON RED BASS PREAMP allows us to relive the sounds of bass amplification before extreme clarity, thanks to 400W amps and tweeters, was a thing in the bass world. The CRB reproduces the sound similar to a single 15" or 18" setup. CRB allows you to control 3 main characteristics: Volume: Output volume Brilliance: Bandwidth control. At maximum, treble can pass. Whereas at the most counter-clockwise position, only bass is amplified. Gain: Boost control. The CRIMSON RED BASS PREAMP can be used as a preamp to modern bass amplification setups while bringing back that old school feel of a 60s upright bass and 70s electric bass. - Bjorn Juhl

