description: The BE-Mini is a compact 30 watt guitar head pairing Dave
  Friedman's BE preamp circuit with a travel-friendly chassis. Gain, level,
  three band EQ, presence, Cut and Tight switches and a series effects loop give
  it the British-voiced high gain of the BE-100 in four pounds.
details: |-
  The BE-MINI head combines a 30 watt power section and Dave Friedman's famous BE preamp circuit. The BE-Mini has the same signature British-voiced harmonics, grind and punch as the legendary BE amplifier's high-gain tones.

  The BE-MINI's compact size, light weight and included effects loop make it a killer companion whether onstage, at home or in the studio.

  The BE-MINI is loaded with player-friendly features including Gain, Level, three band EQ, a Presence control and powerful Cut and Tight switches. These tools allow the BE-MINI's character to be tailored to a player's preferences.

  On the back panel is a high-quality series effects loop, ideal for using time-based effects with high-gain tones. The included 24 V universal-voltage power supply means the BE-MINI travels anywhere.
specs: |-
  - 30 watt power section, ideal for most applications
  - Friedman BE preamp circuit, inspired by the BE-100 amplifier and the BE-OD overdrive pedal
  - Authentic Friedman high-gain, British-voiced tones
  - Controls: Gain, Level, three band EQ and Presence
  - Cut and Tight mini toggles
  - Onboard series effects loop
  - Signature Friedman BE look and style
  - Compact travel and studio friendly size
  - Included universal-voltage 24 V power supply
  - Dimensions 9.5 in (W) x 6.25 in (D) x 5.25 in (H)
  - Weight 4 lbs
