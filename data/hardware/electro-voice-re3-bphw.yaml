description: UHF wireless bodypack system pairing the RE3-BPT belt-pack
  transmitter with the HW3 supercardioid headworn microphone and an RE3-RX
  half-rack diversity receiver, intended for voice performance, presentations,
  and athletic instruction.
details: >-
  The RE3-BPHW is the bodypack/headworn configuration of Electro-Voice's RE3 UHF
  wireless series. The set bundles the RE3-RX half-rack diversity receiver, the
  RE3-BPT metal-bodied bodypack transmitter, and the HW3 supercardioid headworn
  microphone. The HW3 is a condenser element on a flexible gooseneck with a
  vibration-absorbing shock-mounted head, tuned for crisp and natural speech
  reproduction with strong acoustic isolation and feedback rejection in high-SPL
  environments. Its detachable cable terminates in a TA4F (mini-XLR 4-pin)
  connector that mates with the bodypack transmitter's input.


  The RE3-RX receiver provides diversity reception to minimize dropouts, with a
  built-in frequency scan, an LCD display, and a Sync function (over IR) that
  transfers receiver settings to the transmitter in one step. Depending on band,
  the receiver offers up to 36 MHz of tuning bandwidth and as many as 1,440
  selectable frequencies. Two detachable BNC antennas mount on the rear, along
  with a balanced XLR and unbalanced 1/4-inch audio output and a DC barrel jack
  fed from the supplied universal power supply. Rack-mount hardware ships in the
  box.


  The RE3-BPT bodypack transmitter has a robust metal housing, a unique magnetic
  latch and lock for fast battery access, selectable low/high RF output power
  (band-specific, 10/50 mW on most bands), and runs on two AA batteries. The HW3
  capsule is positioned via a flexible gooseneck to deliver consistent placement
  and reliable performance for presenters, instructors, and performers.
specs: >-
  - System type: UHF wireless bodypack system with supercardioid headworn
  microphone

  - Receiver: RE3-RX half-rack diversity receiver

  - Transmitter: RE3-BPT metal bodypack

  - Microphone: HW3 supercardioid headworn (condenser) with detachable TA4F
  cable

  - Polar pattern: Supercardioid

  - Tuning bandwidth: Up to 36 MHz (band-specific)

  - Selectable frequencies: Up to 1,440 (band-specific)

  - Frequency band 5L: 488-524 MHz, 1440 frequencies, 10/50 mW (global)

  - Frequency band 5H: 560-596 MHz, 1440 frequencies, 10/50 mW (global)

  - Frequency band 6M: 653-663 MHz, 400 frequencies, 10/20 mW (global)

  - Frequency band 8M: 823-832 / 863-865 MHz, 440 frequencies, 10 mW (Europe)

  - Frequency band T: 803-806 MHz, 120 frequencies, 10/50 mW (Thailand)

  - Transmitter output power: 10 mW or 50 mW selectable (band-specific)

  - Diversity: True antenna diversity

  - Sync: IR-based one-step transmitter setup

  - Frequency scanning: Yes (receiver scans for clean channel)

  - Receiver display: LCD

  - Transmitter battery: 2 x AA

  - Transmitter construction: Metal housing with magnetic battery latch

  - Headworn microphone element: Condenser, shock-mounted head, flexible
  gooseneck

  - Headworn connector: TA4F (4-pin mini-XLR) at transmitter input

  - Included: RE3-RX receiver, RE3-BPT bodypack, HW3 headworn microphone, two
  antennas, universal power supply, two AA batteries, rack-mount hardware,
  owner's manual, documentation packet, declaration of conformity
