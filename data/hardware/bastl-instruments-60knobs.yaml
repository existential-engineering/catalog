description: An advanced MIDI controller with 60 independently customizable
  potentiometers, designed for use with the Sonic Potion LXR drum machine but
  compatible with any MIDI equipment. Supports standard CC, NRPN, and Yamaha DX7
  SysEx protocols. Arduino-based and available as a DIY kit.
details: |-
  60Knobs is an advanced MIDI controller featuring 60 independently customizable potentiometers. Explicitly designed for the Sonic Potion LXR drum machine, it can control any MIDI-compatible equipment.

  The controller supports standard Control Change (CC), NRPN, and Yamaha DX7 SysEx protocols. A MIDI DUMP button reads out the current value state of all knobs. 5 user-customizable presets allow quick switching between configurations, with LED indication for setting changes.

  Arduino-based with an FTDI connector for firmware flashing. Laser-cut enclosure vectors are available in the GitHub repository. DIY kit only — requires assembly.
