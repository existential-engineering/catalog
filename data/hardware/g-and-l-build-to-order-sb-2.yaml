details: |-
  When Leo Fender launched the G&L SB•2 bass in 1982, he packed his latest innovations in pickup and bridge design into a straightforward, hard-working bass. For players who prefer a less-is-more aesthetic but want something meatier, the SB•2 is just the ticket.

  The SB•2 starts with a familiar shape, though subtle modifications to its sculpting make it more sleek and balanced. Strapped on, it immediately feels at home and more comfortable than expected. The slim, C-shaped neck falls immediately to hand, with a modern 9.5" radius and 22 medium-jumbo nickel frets ready to deliver silky playability.

  Once the SB•2 has nestled into the player's comfort zone, it shows just how far Leo evolved the classic duo of split-coil and single coil pickups. These Magnetic Field Design interpretations were created by Leo to give more gusto without losing detail and finesse. A simple dual-volume control setup allows any balance to be struck between the two, even backing off both volumes to dial in a more vintage flavor. The SB•2 also features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: Leo Fender-designed G&L MFD split-coil (neck) and single coil (bridge)
  - Body wood: Alder
  - Neck wood: Hard-Rock Maple with choice of Maple or Caribbean Rosewood fingerboard
  - Neck profile: G&L 1-1/2" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Electronics: volume-volume-tone
  - Includes: G&L Deluxe Gig Bag
