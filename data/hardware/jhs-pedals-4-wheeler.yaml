description: The JHS Pedals 4 Wheeler is a bass fuzz pedal offering everything
  from 1960s jam band tones to modern electronic fuzz, with Volume, Tone, Fuzz,
  Gate controls and a Hi/Lo toggle for bass-focused or standard voicing.
details: |-
  Bass fuzz has to be the sweetest thing ever. The 4 Wheeler V2 gives you the ability to do everything from 60s jam band to modern electronic fuzz.

  With Volume, Tone, Fuzz and a specially tuned Gate control, the ability to tweak away is at your fingertips. The gate control can give you those much desired synth break-offs or just the right amount of jab for that perfect riff.

  The Hi/Lo toggle switch lets you go from a deeper, more low-end focused range of tones to the normal V1 settings. Bass players and guitar players alike find many uses for this pedal.
