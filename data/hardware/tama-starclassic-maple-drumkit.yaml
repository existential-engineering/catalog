description: In the '80s TAMA's Superstars and Imperialstars reigned supreme -
  the perfect drums for the times. But TAMA's builders and designers wanted
  something that transcended trends, something timeless - drums that understood
  a player's passion and allowed the expression of every genre, style, mood, and
  technique.
details: |-
  Bearing Edges: The shape of the edge is one of the most important factors which affect drum sound. Because the drumheads provide the important source of vibration, the shape of the contact point of the head and shell determines and defines the sound. This is why TAMA has worked so extensively on achieving the most functional shape for the drum head and edge. Picture shows a sectional view of the drum's bearing edge. As shown in Part A, the angle of the top edge is set 2.5mm inside from the outer surface of the shell. The edge is cut to a round collar so as to follow the natural shape of the drumhead (B). This design, which creates a better fit between the drumhead and bearing edge, maximizes the resonance of drum.This bearing edge shape is part of our TAMA tradition and is crucial in providing TAMA's unique drum sound.

  Shells (All Maple): Exotic Finishes VGLM/VMMF TT/FT: 6ply Maple + 1 outer ply Movingui 5mm BD/SD: 8ply Maple + 1 outer ply Movingui 7mm LEWB/LNWB/LRWB TT/FT: 6ply Maple + 1 outer ply Pacific Walnut 5mm BD/SD: 8ply Maple + 1 outer ply Pacific Walnut 7mm Lacquer Finishes All Maple Shell TT/FT: 6ply 5mm, BD: 8ply 7mm For the optimum transfer of vibrations from head to shell, a thinner shell is better. However, less thickness often equals less strength. Instead of simply making thinner shells by using fewer plies, TAMA slims down each ply and then cross laminates them into a 6ply 5mm thick shell (8ply 7mm bass drum). This combination results in a thinner shell that's actually stronger than others of greater thickness. Starclassic shells utilize maple, the most popular shell material today because of its warm clear sound.

  Swivel-Wing Tom Holder (US.PAT.NO.9087498): This tom holder features our omni-ball system allowing for unparalleled angle adjustment of the toms. In addition, each ball can move around an arc backward and forward by 100mm, providing even greater positioning flexibility.

  EVANS® Heads: Evans® heads are featured on all Starclassic drums (except bass drum front heads). On the rack and floor toms, Genera G2 2-ply clear batter heads and Genera G1 1-ply clear bottom heads provide both durability and solid sound. Starclassic bass drums are fitted with Genera EQ4 clear batter heads.

  Air Cushioned Floor Tom Legs: Starclassic's Air Pocket™ rubber feet feature a special air chamber, that eliminates the transfer of vibrations to the floor (which chokes sustain and sound) and absorbs shock for better playing.

  Bass Drum Spur Bracket (Starclassic): TAMA's Starclassic die-cast bracket holds the spur bracket securely, thanks to the powerful hinge mechanism. Unique memory markers found on the folding spur bracket help simplify set up.
