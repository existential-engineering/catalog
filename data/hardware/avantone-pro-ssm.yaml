details: |-
  The SSM (Super Soft Mount) is a professional shockmount that delivers
  outstanding isolation and decoupling to eliminate vibrations and
  low-frequency transfer that contribute background noise to recordings.

  Constructed from cast zinc, the SSM matches the build quality of Avantone's
  C-series microphones. It includes four independently configurable O-Rings
  made from an Ethylene Propylene formula that resists cracking and elasticity
  loss even in demanding environments.

  Compatible with microphones from 19mm–22mm in diameter including: MXL
  603/604, Neumann KM-184/KM-84, Audix SCX-1/SCX-25/F-15/ADX-51, RODE NT5,
  Earthworks, AKG C451/C460/C60, Audio-Technica
  4041a/4049a/4051a/4053a, Beyer MC 930, Oktava MC 012/101, Sennheiser K6,
  Shure KSM137/KSM141/SM81, Samson CO2/CO2H, and more. Threaded mount
  compatible with standard boom stands and the PK1 drum rim mount.
