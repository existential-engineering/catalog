url: https://rupertneve.com/products/545
description: The 545 Primary Source Enhancer is a single-channel 500-series
  module that uses 100% analog processing to reduce microphone feedback and
  ambient bleed in live sound applications. Based on the circuitry of the
  Portico 5045, it can increase microphone signal levels by up to 20 dB before
  feedback.
details: |-
  The 545 is a single-channel feedback reduction device designed for live sound applications. Based on circuitry from the acclaimed Portico 5045, it increases microphone signal levels by up to 20 dB before feedback occurs through analog processing rather than filtering or digital methods.

  The device senses when someone speaks or sings into a microphone and allows the signal to pass through normally. When speech or singing stops, it reduces gain to minimize system feedback and reverberation issues. It features all-analog circuitry built around custom input and output transformers.

  The 545 features a minimal control set for intuitive operation. Controls include an illuminated Process Engage push-button, a Process Active LED indicator, a continuously variable Threshold control (-18 dBu to +12 dBu), a continuously variable Depth control (0 dB to -20 dB), an illuminated FAST mode button selecting between two time constants, an illuminated PEAK button toggling between RMS and Peak detection modes, and a Power Status LED.

  Made in the USA.
specs: |-
  - Maximum Input/Output Level: +24 dBu
  - THD & Noise (1 kHz, +20 dBu): better than 0.001%
  - Noise (bypassed): better than -100 dBu
  - Frequency Response: 30 Hz to 58 kHz (±0.25 dB); -3 dB at 18.5 Hz
  - Threshold Range: -18 dBu to +12 dBu (continuously variable)
  - Depth Range: 0 dB to -20 dB (continuously variable)
  - Attack/Release (RMS Slow): 100 ms
  - Attack/Release (RMS Fast): 200 ms
  - Attack (Peak Mode): 20 ms (fixed)
  - Release (Peak Slow): 1 s
  - Release (Peak Fast): 200 ms
  - Power Consumption: ±16 VDC @ 80 mA
  - Dimensions: 1.5" W x 5.9" D x 5.25" H
  - Weight: 1.5 lbs (0.7 kg)
  - Made in USA
