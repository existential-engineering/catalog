description: Cosmic Debris is a delay and reverb engine with 16 interactive
  delay lines and multiple performance modes for Eurorack, capable of moving
  from precise rhythmic repeats to infinite ambient washes. It includes a
  built-in band-pass filter, freeze function, tap tempo, and pitch-shifted delay
  modes.
details: |-
  A collaboration born in the Denver modular community

  Cosmic Debris began as a design by Nick Donaldson of Infrasonic Audio, a fellow Denver modular enthusiast we met through our monthly Freq Boutique gatherings. Nick approached WMD for advice on manufacturing, and as soon as we heard the sounds he was creating, we knew there was something special. From there, the collaboration took off. We worked closely with Nick to refine the design, bringing in ideas to expand the feature set, streamline performance controls, and ensure the module would be rock-solid for production. The process has been as rewarding as the results: not only has Cosmic Debris grown into a truly versatile delay and reverb processor, but we've had the joy of building a deeper friendship through the design journey. Cosmic Debris is a powerful delay and reverb engine built for modular explorers who want more than just echoes. With 16 interactive delay lines, multiple performance modes, and a design tuned for live use, Cosmic Debris can move from precise rhythmic repeats to infinite atmospheric washes in an instant. At the core, Spray transforms traditional delay taps into massive ambient reverbs, while Scatter reshapes the feedback paths and interactions between lines to create ever-changing textures. Time and it's shift function SLEW take traditional modulation and flip it on its head with huge risers, crossfading delay time changes, and hands on control over the energy of the sound caught in the buffers. A built-in band-pass filter l ets you carve space in the mix or push the signal into motion with CV modulation. Cosmic Debris is designed with performance at its heart. Blast delivers a momentary boost into the delay input as well as 100% send level (in send mode) for explosive bursts of sound with natural tails, while Send Mode turns the Mix control into a CV-controllable send/return level, perfect for insert-style processing. Flexible sync options include clock input, tap tempo, or free-running mode, keeping you locked in rhythm or drifting into uncharted time. A dedicated Freeze function captures audio into a timeless loop, letting you hold textures indefinitely. Three unique processing modes, Blur, Ratio, and Warp, expand the palette even further, from smearing reverbs to pitch-shifted delays. Combined with its intuitive interface and deep modulation capabilities, Cosmic Debris is equally at home in a live performance rack or a studio sound-design system.
