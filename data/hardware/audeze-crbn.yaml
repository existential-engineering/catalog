description: Innovative flagship open-back electrostatic headphones using
  patent-pending polymer film with suspended carbon nanotubes, originally
  developed for MRI medical applications.
details: |-
  Audeze CRBN is an electrostatic headphone featuring a patent-pending polymer film with suspended carbon nanotubes that eliminates problems found in previous electrostatic designs. The technology was originally developed for MRI medical applications in collaboration with Prof. Mark S. Cohen Ph.D. from the UCLA School of Medicine.

  The CRBN driver includes a revolutionary ultra-thin diaphragm with carbon nanotubes suspended throughout the material without coating. Because charge distributes uniformly across the film, this produces uniform driving force, reducing distortion while improving clarity, resolution and transparency.

  CRBN uses a lightweight construction at 470 grams with magnesium and carbon fiber materials. Extra plush, oversized earpads provide a comfortable seal. The design features smooth curves on the etched grill, finely polished marbled graphite acetate rings, hand-stitched premium leather, and a machined aluminum 5-pin connector.

  Compatible with 580 Volt Pro Bias amplifiers from manufacturers including Woo Audio, Linear Tube Audio, Mjolnir Audio, Headamp, and Stax.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Push-pull electrostatic
  - Functional bias voltage: 580 VDC Stax Pro Bias
  - Electrostatic capacitance: 100 pF (including cable)
  - Diaphragm type: Ultra-thin custom carbon nanotube
  - Transducer size: 120mm x 90mm
  - Frequency response: 20Hz - 40kHz
  - Maximum SPL: >120dB
  - THD: <0.1% @ 90dB
  - Attached cable: 2.5m OCC monocrystal copper, 5-pin Pro Bias
  - Housing: Magnesium, stainless steel and polymer acetate
  - Earpad material: Premium leather
  - Headband: Carbon fiber and premium leather
  - Weight: 470g
