details: The PBR TRS-BT is a professional 1U rackmount patch bay featuring 96
  audiophile-grade gold-plated 1/4" TRS connectors (48 front + 48 rear),
  mode-switching buttons for Normal and Half-normal operation, a black-anodized
  aluminum faceplate, and a custom Black Lion Audio-modified Bluetooth module
  supporting high-quality codecs for lossless wireless audio connectivity. Front
  panel labels are included.
