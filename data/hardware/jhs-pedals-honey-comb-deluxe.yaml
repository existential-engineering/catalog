description: A discontinued dual-speed vintage analog tremolo pedal with two
  independently controlled rate knobs and a second footswitch for on-the-fly
  speed switching.
details: |-
  Just like the discontinued Honey Comb Single, the Honey Comb Deluxe gives you true vintage analog tone and ease of operation reminiscent of early Fender blackface and vintage Vox tremolo circuits. The Deluxe adds an extra LED for constant rate monitoring (stays on in bypass), a second footswitch to alternate between two independently controlled speed knobs, and a third LED that is red when the red speed knob is active and green when the green speed knob is active. V2 units feature an internal dip-switch for dual speed range adjustment.
