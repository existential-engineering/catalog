description: Core 47 is the mid-size model of Dynaudio's flagship professional
  reference monitor series. This compact three-way nearfield monitor features
  500W + 500W + 150W of Class-D power from Pascal amplification, with all Core
  monitors calibrated to within a reference of 0.2dB at the factory in Denmark.
details: |-
  Core 47 is the mid-size model of our flagship professional reference monitor series. This compact three-way monitor features an eyebrow-raising 500W + 500W + 150W of Class-D power from Pascal amplification, delivering flat bass response down to 44Hz at -3dB and 37Hz at -6dB, with frequency response extending to 31kHz.

  Studio professionals need to trust the monitors they use every day. All Core monitors are calibrated to within a reference of 0.2dB at our factory in Denmark. You can install 100 and they'll all perform to the same high standard — extreme consistency, breathtaking accuracy, and nothing but the truth.

  The Esotar Pro tweeter takes the word 'revealing' to a new level. It features Hexis inner dome technology and innovative airflow technology, as well as a powerful neodymium magnet, to ensure that what went in, comes out. Paired with a 4-inch MSP midrange driver and a 7-inch MSP woofer, the Core 47 delivers exceptional resolution and dynamics.

  Advanced DSP-based crossover and processing provide three acoustic environment settings (Anechoic, Desk, Soffit) plus boundary filters for room compensation. Core 47 is suited for music recording studios, TV dub stages, edit suites, broadcast trucks, ADR facilities, game authoring suites, and surround monitor applications.
specs: |-
  - Type: Nearfield Monitor
  - Box principle: Front-loaded bass reflex
  - Crossover type: 3-way DSP-based
  - Crossover frequencies: 475 Hz / 5250 Hz
  - Tweeter: 1.1" Esotar Pro soft dome with Hexis
  - Midrange: 4" MSP
  - Woofer: 7" MSP
  - Amplifier power (woofer): 500W
  - Amplifier power (midrange): 500W
  - Amplifier power (tweeter): 150W
  - Maximum SPL (anechoic @ 1m): 113 dB
  - Maximum SPL (half space @ 1m): 118 dB
  - Lower cutoff (85 dB ±3 dB): 41 Hz
  - Upper cutoff (85 dB ±3 dB): 24 kHz
  - Lower cutoff (dynamic @ -6 dB): 35 Hz
  - Upper cutoff (dynamic @ -6 dB): 30 kHz
  - AC power input: 100-240V 50/60Hz
  - Weight: 15.6 kg (34.4 lbs)
  - Dimensions (W x D x H): 390 x 355 x 240 mm (15 3/8" x 14" x 9 7/16")
  - Finish: Dark Grey
