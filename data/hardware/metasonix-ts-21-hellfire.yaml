description: >-
  The Metasonix TS-21 HellFire Modulator is a tube-based analog distortion and waveshaping
  processor designed specifically for mangling synthesizer signals through vacuum tube circuitry.
details: |-
  Released around 2000, the TS-21 HellFire Modulator is a distinctive rack-mount analog processor from Metasonix, a company known for its unconventional vacuum tube designs. Built around approximately five tubes, the HellFire was designed specifically for processing synthesizer and bass signals, adding aggressive, unpredictable character through its all-analog tube circuitry.

  The HellFire contains three unique processing sections. The first is a pentode preamp with a VCA input stage that introduces distortion at the initial gain stage. The second is a metastable pulse-width modulator circuit based on a 6BQ7-family dual triode tube. The third is an LFO-controlled waveshaper and switcher built around a unique sheet-beam modulator television vacuum tube. Together, these sections can fold, distort, and radically transform incoming audio.

  All controls and connections are located on the front panel of the two-rack-space unit, with a small viewing window at center through which the glowing tubes are visible. The PWM and Beam controls shape the core distortion character, while L1, L2, and SPEED knobs control the built-in LFO that creates a pseudo-stereo panning effect with adjustable rate and beam width. CV inputs for the VCA and beam/PWM sections enable external voltage control.

  The HellFire accepts a mono input and produces mono or stereo output depending on the LFO configuration. Results are intentionally unpredictable and aggressive, making it a tool for sound designers and experimental musicians who want to push their synthesizer sounds into unusual sonic territory.
specs: |-
  - Input: Mono
  - Output: Mono/Stereo
  - Tubes: Approximately 5 vacuum tubes
  - Sections: Pentode preamp with VCA, metastable PWM (6BQ7 dual triode), LFO-controlled waveshaper (sheet-beam modulator tube)
  - LFO: Built-in with rate and stereo beam width controls
  - Keyboard: None
  - Memory: None
  - Control: CV input to VCA and beam/PWM
