description: A 40-watt, 5881 powered, dual channel hand-wired 1x12 combo based
  on a modified JTM 45. The tongue and groove Baltic Birch cabinet houses a 16
  ohm, 12 inch Celestion G12H Redback speaker rated at 150 watts.
details: |-
  Friedman's Dirty Shirley combo was designed for guitarists who wanted a vintage classic rock tone inspired by British tube amps from the 1960s and 1970s. The Twin Sister is two Dirty Shirleys in one chassis, a 40-watt, 5881 powered, dual channel amp based on a modified JTM 45 that still delivers the signature British tone Friedman has become known for.

  Handcrafted in the USA, the Twin Sister combo uses tongue and groove Baltic Birch construction and houses a 16 ohm, 12 inch Celestion G12H Redback speaker rated at 150 watts, which delivers the bass and mid response expected from a Friedman amplifier.

  The two channels are identical and extremely versatile, covering many styles of music from blues to rock and country by just adjusting the structure, gain and master controls.

  The Twin Sister carries the finishing and solid construction expected of a Friedman amplifier. It is designed to take pedals and loves boosts, overdrives, phasers, flangers, tremolos and wahs, while the ultra-transparent series effects loop handles time-based effects pedals and rack units.
specs: |-
  - 40 watt all tube 1x12 combo
  - Hand-wired in the USA
  - Two channels, identical circuits
  - 16 ohm, 12 inch Celestion G12H Redback speaker, 150 watt rating
  - Tongue and groove Baltic Birch cabinet construction
  - 2 x 5881 power tubes
  - 5 x 12AX7 preamp tubes
  - Gain, Master, Bass, Middle and Treble per channel
  - Bright switch and 3 position gain switch per channel
  - Three position gain structure switch
  - Global Presence and Deep knobs
  - Ultra transparent series effects loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Dimensions: 9.5 in (d) x 24.25 in (w) x 22 in (h)
  - Weight: 52 lbs
  - Limited lifetime warranty
