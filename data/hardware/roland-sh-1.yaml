description: >-
  The Roland SH-1 is a monophonic analog synthesizer from Roland's pioneering SH
  line, featuring one VCO with a sub-oscillator for classic analog basses,
  leads, and effects. Its architecture is similar to the SH-101, with a squelchy
  low-pass filter, flexible LFO modulation, and an auto-bend portamento effect,
  though it lacks an onboard sequencer or arpeggiator. The SH-1 has been used by
  Depeche Mode and Vince Clarke.
details: |-
  The SH-1 was among the first of Roland's revolutionary SH line of synthesizers that spawned such classics as the SH-101, SH-09, and SH-7. Despite being an earlier entry in the series, it is by no means less powerful or sophisticated than its successors.

  Its overall look, design, and architecture is very similar to the SH-101. One VCO plus one sub-oscillator provide simple but great analog basses, leads, and effects in classic Roland SH style. The VCO can be tuned over a 5-octave range (2', 4', 8', 16', 32') with saw, square, and pulse waveforms.

  The VCF, VCA, and LFO sections have adequate and flexible controls and can modulate or affect each other, just as on the other similar SH-type synths. A squelchy VCF filter section, plenty of LFO modulation capabilities, and an auto-bend portamento-type effect round out the sound-shaping options. However, unlike the SH-101, the SH-1 does not feature an onboard sequencer or arpeggiator.

  The SH-1 sounds excellent and makes a nice alternative to the more popular and plastic SH-101. It has been used by Depeche Mode and Vince Clarke.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (saw, square, pulse) plus sub-oscillator
  - VCO Range: 5 octaves (2', 4', 8', 16', 32')
  - Filter: High-pass and low-pass with resonance, cutoff; modulated by Envelope 1, LFO, keyboard tracking, envelope follower
  - LFO: 1 modulator (sine, square, random) with rate and delay; routes to VCO, Envelope 1, Envelope 2, VCF
  - VCA: Envelope 1 (ADSR), Envelope 2 (AR)
  - Keyboard: 32 keys
  - Memory: None
  - Control: CV/Gate, Trigger output
