description: Compact audio interface with advanced guitar tone shaping.
  Best-in-class guitar recording starts here.
details: |-
  AXE I/O Solo combines ik's two decades of innovation in analog modeling and
  hardware design to make recording guitar faster, easier and better than ever.
  AXE I/O Solo offers a triple-topology instrument input designed to preserve
  your guitar's unique character, combined with powerful tone-shaping features
  to adapt to any guitar or bass, and helps you coax a wider range of sounds
  from any instrument.

  Axe I/o solo also offers ik's patent pending z-tone circuit, letting you dial
  in impedance from 1 mohm ("sharp") down to 2.2 kohms ("bold") that interacts
  with your pick-ups. At the maximum impedance, you'll find your sound tighter,
  sharper and more precise. Increase the load and the sound becomes thicker and
  bolder.

  Axe I/o solo offers a high-definition, class a mic preamp designed for
  transparent and clean recording. An extended, flat frequency response captures
  the full tonal range of your voice or instrument without coloring the sound,
  and best-in-class dynamic range ensures ultra-quiet recordings.

  Axe I/o solo offers a dedicated amp out, with ground-isolated design and
  zero-latency routing, letting you ditch expensive and confusing reamping
  setups. It's simple: connect the amp out to your amp, then mic it up using axe
  I/o solo's microphone preamp. Now you can capture a clean copy of your signal
  while recording and feed it back to your amp afterwards to experiment with
  different amp, stompbox and microphone settings without re-recording countless
  takes.

  Axe I/o solo preserves the best-in-class dynamic range, ultra-low self noise
  and wide, extended frequency response essential to capturing the most accurate
  details of your performance, and for keeping your sound completely pure and
  transparent. Axe I/o solo offers separate master & headphone volume and a
  monitor knob to blend direct signals and the audio from your computer for zero
  latency monitoring. 24-bit, 192 khz conversion and an ultra-stable, low jitter
  internal clock ensures the highest fidelity, delivering truly
  professional-grade recordings for everyone.
specs: |-
  - 2-in / 3-out USB audio interface
  - Active/passive pick-up selector
  - Pure and jfet input stages
  - Z-tone impedance-adapting circuit
  - Amp out with ground loop interrupter
  - High-resolution class a mic preamp
  - 24-bit 192 kHz sound quality
  - Wide frequency response
  - Best-in-class analog/digital conversion
  - Ultra-low noise floor
  - Triple-topology instrument input
  - Patent pending z-tone circuit
  - Impedance range 1 mohm to 2.2 kohms
  - Separate master and headphone volume
  - Monitor knob for zero latency monitoring
  - Ultra-stable low jitter internal clock
  - Extended flat frequency response
  - Ground-isolated amp out design
  - Zero-latency routing
