details: |-
  The HD-28E is a legendary dreadnought acoustic-electric guitar that combines Martin's iconic tone with modern onboard electronics. Built with a solid Sitka spruce top and solid East Indian rosewood back and sides, it delivers bold, projective tone with strong bass, clear trebles, and rich overtones.

  Forward-shifted X-bracing with GE-scalloped Sitka spruce top bracing enhances the guitar's tonal response and sustain. Vintage-inspired appointments include herringbone top inlay and an ebony fingerboard with abalone diamond and square inlays, giving the instrument its classic Martin look.

  Part of the 2025 refreshed Standard Series, the HD-28E features a reimagined GE Modified Low Oval neck profile with High-Performance Taper, a thinner fingerboard, and a refined bridge and heel for improved playability across all playing styles.

  Onboard electronics — selectable Fishman Aura VT Blend or L.R. Baggs Anthem — make this dreadnought stage-ready while retaining the acoustic character Martin players expect. Includes a molded hardshell case and Authentic Acoustic Lifespan 2.0 medium strings.
specs: |-
  - Body size: D-14 Fret Dreadnought
  - Top: Solid Sitka Spruce with Aging Toner, Gloss finish
  - Back and sides: Solid East Indian Rosewood
  - Bracing: Forward-Shifted X-Brace, GE-Scalloped Sitka Spruce
  - Scale length: 25.4"
  - Neck profile: GE Modified Low Oval with High-Performance Taper
  - Fingerboard: Ebony with Abalone Diamond/Square Inlays
  - Nut width: 1 3/4"
  - Bridge: Ebony with GE Modern Belly Drop-in Saddle
  - Tuners: Nickel Open Gear
  - Electronics: Fishman Aura VT Blend or L.R. Baggs Anthem (selectable)
  - Strings: Authentic Acoustic Lifespan 2.0 (Medium)
  - Case: Molded Hardshell included
  - Top inlay: Herringbone
  - Left-handed: Available
