url: https://dbxpro.com/en/products/1231
description: Dual channel 31-band graphic equalizer designed for demanding sound
  reinforcement environments, with precise gain adjustments and switchable
  boost/cut ranges.
details: |-
  The 1231 provides dual-channel operation with 31 1/3 octave bands at ISO frequency centers, featuring switchable +/-6dB or +/-15dB boost/cut ranges for precise gain adjustments. The unit includes 45mm faders, XLR, barrier strip, and 1/4" TRS connectors for flexible installation.

  Engineered for years of maintenance-free operation, the 1231 incorporates a magnetically isolated transformer, electronically balanced/unbalanced inputs, and servo balanced/unbalanced outputs. RF-filtered inputs and outputs ensure compatibility across all installations, while power-off hardwire relay bypass with 2-second power-up delay provides protection.

  The 12 Series equalizer delivers exceptional audio performance with 10Hz to 50kHz frequency response, greater than 90dB SNR, less than 0.005% THD+Noise, and interchannel crosstalk of less than -80dB. All components are housed in a rugged 3U steel/aluminum chassis designed for portable and touring applications.
specs: |-
  - Dual-channel 31-band 1/3 octave equalizer with ISO frequency centers
  - Switchable ±6dB or ±15dB boost/cut range
  - 45mm faders for precise control
  - -12dB/+12dB input gain range
  - 18dB/octave 40Hz Bessel low-cut filter
  - XLR, 1/4" TRS, and barrier strip connectors
  - Electronically balanced/unbalanced inputs (40kOhm balanced, 20kOhm unbalanced)
  - Servo balanced/unbalanced outputs (200 ohm balanced, 100 ohm unbalanced)
  - RF filtered inputs and outputs
  - Chassis/signal ground lift capability
  - Frequency response: 10Hz to 50kHz (+0.5/-3dB)
  - Dynamic range: 109dB (±6dB), 115dB (±15dB)
  - Signal-to-noise ratio: 90dB (±6dB), 97dB (±15dB)
  - THD+Noise: <0.005%
  - Interchannel crosstalk: <-80dB (20Hz–20kHz)
  - Max input: >+21dBu balanced or unbalanced
  - Max output: >+21dBu balanced/unbalanced into 2kOhm or greater
  - 4-LED bar graph meter at -10, 0, +10, and +18dBu
  - Power-off hardwire relay bypass with 2-second power-up delay
  - Dimensions: 5.25"H × 19"W × 7.9"D
  - Weight: 10.6 lbs
  - Power consumption: 24W
  - 3U steel/aluminum chassis
