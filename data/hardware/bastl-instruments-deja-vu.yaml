description: A 4HP voltage utility module for attenuation, attenuversion, signal
  boosting, crossfading, and mixing. Two independent channels (A and B) each
  have a FADER input, ADD input, and output with LED polarity indication. When
  OUT A is unpatched it cascades into channel B, enabling 4-channel mixing.
  Three fader modes (Attenuvertor, Attenuator, Crossfader) and switchable
  1×/2×/10× gain make it useful as a pre-amplifier and stereo line-to-Eurorack
  booster.
details: |-
  Déjà vu is a 4HP voltage utility module that adds fader control to a modular system. It handles voltage processing, attenuation, attenuversion, signal boosting, crossfading, and mixing.

  Two independent channels (A and B) each provide a FADER input (scaled by fader position and mode), an ADD input (summed directly without fader influence), and an output with green/red LED polarity indication. If the channel A output is unpatched, it cascades into channel B, turning the module into a 4-channel mixer when all four inputs are used.

  Three fader modes: Attenuvertor (bipolar, −1× to +1×), Attenuator (unipolar, 0 to +1×), and Crossfader (blends FADER A and ADD A). Gain is switchable to 1×, 2×, or 10× — with a 5× option via back jumper — enabling use as a pre-amplifier and stereo line-level to Eurorack booster.

  Back jumpers allow chaining multiple units for expanded mixing. Power connector is PTC fuse and diode protected.
