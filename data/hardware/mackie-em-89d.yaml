description: The EM-89D Dynamic Vocal microphone combines reliability and
  performance that’s great for vocals, instruments, and beyond.
details: |-
  The EM Series EM-89D Dynamic Vocal microphone delivers reliability and sound quality without the hefty price tag. Its handheld design suits vocalists, and its road-worthy construction and precisely tuned response also make it well suited to miking a range of other instruments.

  Handheld dynamic microphones are the workhorses of the audio industry, and the EM-89D dynamic vocal mic is up to the task. It excels at onstage performance and studio recording alike.

  The cardioid polar pattern rejects peripheral noise to keep the performance clear.

  It pairs with the EM Wave XLR wireless system for an on-the-go setup. A mic clip, XLR cable and zipper pouch are included.
specs: |-
  - Element: dynamic
  - Polar pattern: cardioid (uni-directional)
  - Frequency response: 50 Hz - 16 kHz
  - Sensitivity: -52 dB +/-3 dB (0 dB = 1 V/Pa @ 1 kHz)
  - Output impedance: 600 ohm +/-30% (@ 1 kHz)
  - Passive dynamic microphone, requires no power supply and no phantom power
  - Output on XLR connector
  - Size (H x W): 7.3 in x 2.0 in / 185 x 51 mm
  - Weight: 0.66 lb / 0.30 kg
  - Included accessories: mic clip, XLR cable, zipper pouch
