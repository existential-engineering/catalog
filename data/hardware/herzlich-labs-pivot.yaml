description: A 2hp panner and balance control module with a long fader for
  smoothly panning or balancing between an input and two outputs, usable for
  panning, wet/dry control or as an attenuator.
details: |-
  The Pivot is a simple module, dedicated to doing one thing really well: panning and balancing. The long and smoothly controlled fader makes it easy to strike the right balance between the input and the two outputs, which continuously share each their portion of the input signal. With input buffering and a dual-gang potentiometer, the signal for one channel will fully close at either extreme end and perform with perfect consistency when you need it most. Use it for panning, wet/dry control, transitioning between different audio or CV destinations - or even just as an attenuator in a pinch. The Pivot isn't the most complicated panner and balance mixer on the market, but rock solid build quality, design and component choices make it a reliable companion in any performance setup.
