description: Synthbox is a 4 note polyphonic synthesizer for your Eurorack
  system. Connect your favorite MIDI controller or CV Generator to synthbox and
  start jamming with built in presets.
details: |-
  Synthbox is a 4 note polyphonic synthesizer for your Eurorack system. Connect your favorite MIDI controller or CV Generator to synthbox and start jamming with built in presets. Use the touchscreen to choose and shape the waveforms and to apply the built in sound effects. Modulate the waves and the effects using a combination of on screen controls of envelopes, low frequency oscillators, and sequencers together with hard wired CV inputs to tweak the sound to meet your creative vision.

  Features:
  - MIDI controllable with support for velocity, pitch bend, and modulation wheel
  - CV controllable with pitch, gate, and 3 assignable modulators per voice
  - 24 bit DACs and internal processing
  - 8 wavetable oscillators
  - 4 waveform oscillators
  - 2 filters, 2 envelopes, 2 LFOs, and a step sequencer per voice
  - Global flanger, distortion, and stereo delay effects
  - Semi-modular control
  - Stereo or individual voice outputs
  - Comes with 50 presets and 100 wavetables
  - Supports user wavetables from WAV file

  What is Included: a Series 1 eurorack module with a synthbox faceplate, a microSD card with synthbox firmware loaded on it, a eurorack power cable, a synthbox Quick Start guide, a MIDI Adapter.

  Series 1 Module Firmware Switching: Because synthbox is a Series 1 module, you can swap out the synthbox firmware for other Series 1 module firmware (bitbox or fxbox) by signing up at forum.1010music.com, downloading the new firmware and following the instructions on the forum. You can also download the latest synthbox firmware to get new features and updates.

  Discontinuation notice (on page): "We are no longer selling synthbox directly. You can get synthbox functionality by purchasing a bitbox mk2 and downloading the synthbox firmware from our forum. You must register for the forum in order to access firmware downloads."
specs: |-
  - 26 HP
  - Power: +12V 350mA, -12V 0mA, 5V 0mA
  - Weight: 0.78 lbs
  - Dimensions: 6.75 x 6.25 x 2.125 in (WooCommerce package dimensions; panel depth not separately stated)
  - SKU: 007
  - 4 note polyphony: 8 wavetable oscillators, 4 waveform oscillators, 2 filters/2 envelopes/2 LFOs/step sequencer per voice
  - 24-bit DACs and internal processing
  - 28 total 1/8-inch (3.5mm) I/O jacks: MIDI In, Clock In, In 1, In 2, Pitch CV In x4, Gate In x4, Ext1 CV In x4, Ext2 CV In x4, Ext3 CV In x4, FX Out x2, Out x2
  - MicroSD card slot for firmware storage
