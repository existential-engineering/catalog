description: GK Pro Negra is the ultimate gigging nylon string guitar for professional musicians.
details: |-
  The GK Pro Negra is the ultimate gigging nylon string guitar for professional musicians. All-solid with a European spruce top and Indian rosewood back and sides, it comes equipped with a soft cutaway and Fishman PreFix ProBlend preamp. When compared to the blanca version (GK Pro), the Negra offers a darker, bassier tone. Constructed with a slightly thinner body depth, neck, and nut width than a traditional Spanish guitar, the GK Pro Negra is extremely comfortable and easy to play. The neck is designed to have little or no relief, offering low action and a flamenco-style buzz and its Spanish heel provides maximum resonance and projection. Comes in a Cordoba humidified archtop case.
