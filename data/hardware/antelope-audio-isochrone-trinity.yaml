description: The best master clock for your studio. Sample rate up to 384 kHz.
  Oven Controlled Crystal Oscillator. 4th Gen Acoustically Focused Clocking.
details: |-
  In the fickle world of Audio & Video formats, Trinity is the Master Clock that stands out from the crowd, with the kind of features that others can only aspire to. With dedicated functions and controls, Trinity is the best sounding and most versatile Master Clock available anywhere.

  Installed in some of the most prominent audio and post production facilities around the globe, Trinity is in the roots of a great percentage of the contemporary music and movie productions. Trinity is also an integral component of some of the largest live concerts and events nowadays.

  Powered by an ultra stable oven controlled crystal oscillator, Trinity's completely redesigned timing engine with 4th generation 64-bit Acoustically Focused Clocking provides supremely low jitter and high stability, with distinct sonic advantages that are immediately apparent.

  An atomic input makes it a perfect match for the 10M Atomic Clock, while user re-calibration and dual redundant power supply will keep the unit running smoothly and prevent costly downtime.

  Trinity takes care of requirements that usually would have needed several units. With 3 HD and 2 SD generators the unit locks to and generates all known professional video formats, while simultaneously offering 3 independent audio channels capable of 384 kHz with varispeed adjustment in cents or percent. With its wealth of connectivity, flexibility, and ease of use, Trinity is the ideal linchpin for a modern studio.
specs: |-
  - Clocking system: 4th Generation Acoustically Focused Clocking, 64-bit DDS, Oven Controlled Crystal Oscillator (OCXO)
  - Stability: < +/-0.02 ppm @ 64.5°C
  - Ageing: < 1 ppm per year
  - Calibration: < +/-0.001 ppm
  - Atomic clock input: 10 MHz @ 1 Vpp, BNC
  - Basic sample rates: 32, 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384 kHz
  - Generators: 9 independent and simultaneous (3 audio, 3 HD, 3 SD)
  - Varispeed: +/-200 cents, +12.246%, -10.910%
  - Pull ups/downs: +/-0.1% NTSC and/or +/-4% PAL, -0.1% HD
  - Inputs: Universal video input on BNC (auto-recognizes all video formats), 2 selectable Word Clock on BNC (32 kHz - 384 kHz), 1 AES/EBU on XLR (32 kHz - 192 kHz, 110Ω terminated), 1 S/PDIF on RCA (32 kHz - 192 kHz, 75Ω terminated)
  - USB: 2.0 full-speed
  - Outputs: 6 x BNC HD Video @ 75Ω; SD1 BNC @ 75Ω NTSC Black Burst; SD2 BNC @ 75Ω PAL Black Burst; SD3 BNC @ 75Ω PAL 24/NTSC 30 selectable Composite Sync; SD4 BNC @ 75Ω PAL 48/PAL 47.95 selectable Composite Sync; 16 x BNC Word Clock outputs (3 Vpp @ 75Ω); 4 x AES/EBU on XLR @ 110Ω; 4 x S/PDIF on RCA @ 75Ω
  - Dual redundant power supply
  - User re-calibration capable
  - Operating temperature: 0-50°C (32-122°F)
  - Weight: 4 kg / 8.8 lb
  - Dimensions: 482 mm (W) x 89 mm (H) x 203 mm (D) / 19" (W) x 3.5" (H) x 8" (D)
