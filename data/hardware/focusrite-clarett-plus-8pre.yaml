url: "https://focusrite.com/products/clarett-plus-8pre"
prices:
  - amount: 1209.99
    currency: USD
description: Clarett+ 8Pre is a powerful studio-grade 18-in/20-out audio
  interface for the established producer. Bring pure analogue sound to your
  studio.
details: |-
  Studio-grade 18-in/20-out USB-C audio interface featuring eight Clarett+ mic preamps with all-analogue Air mode and impedance switching, two high-impedance JFET instrument inputs, ten balanced line outputs, two headphone outputs, ADAT (8-in/8-out), S/PDIF and MIDI I/O.

  24-bit/192 kHz converters with up to 124 dB dynamic range. Rack-mountable (19"). Bundled with Hitmaker Expansion software, Ableton Live Lite and Pro Tools Intro+. 3-year warranty.
specs: |-
  - 18-in / 20-out USB-C audio interface
  - 8 Clarett+ mic preamps with all-analogue Air mode and impedance switching
  - 2 high-impedance JFET instrument inputs
  - 10 balanced line outputs
  - 2 independent headphone outputs
  - ADAT: 8-in / 8-out expansion
  - S/PDIF I/O
  - MIDI In/Out
  - USB-C (Mac, Windows, iPadOS)
  - 24-bit / 192 kHz converters
  - Dynamic range: up to 124 dB (outputs), 118 dB (mic / line inputs)
  - Mic input EIN: -129 dBu
  - Gain range: +57 dB
  - Rack-mountable (19")
  - External PSU (not bus-powered)
  - 3-year warranty
