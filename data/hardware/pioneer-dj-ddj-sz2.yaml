description: The DDJ-SZ2 builds on the strong foundations of its predecessor,
  our flagship DDJ-SZ controller. This upgrade to our flagship Serato DJ Pro
  controller allows you to get hands on with the latest additions to Serato DJ
  Pro, including key shift, key sync, pitch play and Serato Flip. We’ve improved
  the jog wheel latency to make scratching more responsive and precise and the
  multi-coloured performance pads give you instant feedback on playing status
  and pad modes. The DDJ-SZ2 comes bundled with the latest version of Serato DJ
  Pro, the Pitch n’ Time and Serato Flip expansion packs are also included so
  you can use the new features straight out the box.
details: |-
  Flagship 4-channel controller for Serato DJ Pro. The DDJ-SZ2 builds on the strong foundations of its predecessor, our flagship DDJ-SZ controller. This upgrade to our flagship Serato DJ Pro controller allows you to get hands on with the latest additions to Serato DJ Pro, including key shift, key sync, pitch play and Serato Flip. We’ve improved the jog wheel latency to make scratching more responsive and precise and the multi-coloured performance pads give you instant feedback on playing status and pad modes. The DDJ-SZ2 comes bundled with the latest version of Serato DJ Pro, the Pitch n’ Time and Serato Flip expansion packs are also included so you can use the new features straight out the box.
