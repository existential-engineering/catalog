description: The Empress Phaser is an analog phaser pedal built around a unique
  VCA-based design for an unusually high signal-to-noise ratio. It offers 2, 3
  or 4 stage phasing, tap tempo, eight waveforms and a set of auto/envelope
  modes, all in a compact true-bypass enclosure.
details: |-
  Redefining the phaser from the ground up, the Empress Phaser employs a VCA-based design that delivers an unusually clean signal-to-noise ratio (around 104 dB) for an analog modulation pedal. It keeps an all-analog signal path while a microprocessor handles control, so it retains analog character while adding deep control and adaptability.

  Choose between 2 stage, 4 stage or an Empress-exclusive 3 stage mode, all controllable via tap tempo and sweepable through eight waveforms (sine, triangle, asymmetric sine, swung sine, sawtooth, reverse sawtooth, square and step). Beyond classic jet and Univibe-style sounds, it covers auto-wah, ring modulation and vibrato territory.

  What sets it apart are the auto modes: envelope following, audio-triggered sweeps, rhythms and direct control. The Universal Control Port accepts an expression pedal, external tap switch, control voltage, external audio input and MIDI, all over a single 1/4" jack. It ships in a die-cast aluminum enclosure with true bypass.
specs: |-
  - Signal-to-noise ratio around 104 dB (VCA-based analog design)
  - 8 auto modes: envelope follower, center & speed, speed (sine), speed (square), audio sweep trigger, random level trigger, rhythms, direct control
  - Tap tempo with ratio selection for fast and triplet-based phase times
  - Selectable 2, 3 or 4 stages (3-stage is an Empress exclusive)
  - 5 rhythm patterns
  - 8 waveforms: sine, triangle, asymmetric sine, swung sine, sawtooth, reverse sawtooth, square, step
  - Output gain: match bypass level or add up to 6 dB of boost
  - Universal Control Port: expression pedal, external tap, CV, external audio, MIDI over one 1/4" jack
  - True bypass
  - Power: 9 - 18 V DC (negative tip), 2.1mm barrel, ~120 mA
  - Die-cast aluminum enclosure, approx. 4.5" x 3.5" x 1.5", 1 lb
