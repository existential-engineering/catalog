description: A Eurorack filter module built around the original IG00156 VCF chip
  used in classic CS-series synthesizers, providing lowpass, bandpass, and
  highpass outputs with CV control over frequency and resonance.
details: |-
  The Stoel Music Systems Muahaha CS Filter provides the timeless filter sound of the CS series synthesizers in Eurorack format. This module uses the original IG00156 VCF chip, which was used in the CS-80, CS-60, CS-50, CS-15, and many others. The module features lowpass, bandpass, and highpass modes on individual output jacks. In addition, there is CV control over the frequency and resonance. The IG00156 is a very scarce, out-of-production part, so the module uses a special ZIF (zero insertion force) socket for this chip. This prevents damage from pressing a used chip with some solder remaining on the pins into a normal chip socket or heat damage from soldering. To install the chip, lift the lever on the socket to the vertical position, set it into the socket, then lower the lever until it latches. The notch on the chip goes towards the socket handle. The module is sold without the IG00156. Technical Specifications

  Width
  12 HP

  Depth
  28 mm

  Current Draw
  +12V: 15mA, -12V: 15mA, +5V: 0mA
