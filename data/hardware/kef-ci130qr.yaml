description: |-
  The Ci130QR is an in-ceiling speaker featuring KEF's patented Uni-Q driver
  technology. The design places a tweeter at the acoustic center of the
  bass/midrange cone, allowing both drivers to function as a single point
  source, dispersing sound widely and evenly throughout a room.
specs: |-
  - LF Driver: 130mm (5.25") Uni-Q array
  - HF Driver: 19mm (0.75") aluminium dome tweeter with tangerine waveguide
  - Nominal Impedance: 8 Ohm
  - Sensitivity: 87dB (2.83V/1m)
  - Crossover Frequency: 3.8kHz
  - Frequency Response: 45Hz–34kHz (±6dB) open-backed
  - Recommended Power: 10–100W
  - External Diameter: 193.4mm
  - Cutout Diameter: 158mm
  - Depth: 83mm
  - Mounting Depth: 77.8mm
  - Weight: 1.35kg
