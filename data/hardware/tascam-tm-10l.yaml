description: Compact lavalier condenser microphone for voice capture in film,
  video, live events, and lectures. Features an omnidirectional back electret
  condenser capsule (φ6.5 × 22 mm) with plug-in power. The 160 cm cable
  terminates in a 3.5mm mini plug with a Sennheiser-style screw-lock, compatible
  with wireless transmitters and the DR-10 series recorders.
details: |-
  Omnidirectional back electret condenser lavalier. Sensitivity −42dB (0dB=1V/Pa @ 1kHz), output impedance 1.8kΩ ±30%, max SPL 115dB, equivalent noise 36dB. Frequency response 50Hz–18kHz. Requires plug-in power DC 1.5–10V from host device. 160 cm cable with 3.5mm stereo mini plug + screw-lock. Body: φ6.5 × 22 mm, 24g. Available in black (TM-10LB) and white (TM-10LW). Includes soft case, lapel clip, and windscreen.
specs: |-
  - - Element: Back electret condenser; omnidirectional
  - Sensitivity: −42dB (0dB=1V/Pa @ 1kHz)
  - Output impedance: 1.8kΩ ±30%
  - Max SPL: 115dB
  - Equiv noise: 36dB
  - Freq response: 50Hz–18kHz
  - Power: Plug-in DC 1.5–10V (from host)
  - Cable: 160 cm
  - Connector: 3.5mm stereo mini plug with screw lock
  - Dimensions: φ6.5 × 22 mm; weight: 24g
