details: |-
  Pico EF is Erica Synths' take on the envelope follower module in 3HP. It features a preamp with up to +40dB of gain, enough to boost even guitar and dynamic microphone signals for use in a modular system.

  An envelope output with adjustable attack time and a gate output with adjustable threshold turn the incoming audio into control signals. The gate extractor's threshold is set by hand, so quiet material and hot material can both be made to trigger reliably.

  The module can be used as a preamp, as an overdrive unit, for controlling VCFs with an audio signal, or with external instruments to control a modular system in other creative and experimental applications.

  It is 3HP wide and 35mm deep. Audio output level is 10Vptp, the envelope output runs from 0 to +10V and the gate level is +5V, with input protection against overvoltage and protection against a reversed PSU connection.
specs: |-
  - Preamp with adjustable gain
  - Preamp boost up to +40dB
  - Audio overdrive possibility
  - Envelope follower with adjustable attack time
  - Gate extractor with adjustable threshold
  - Input protection against overvoltage
  - Protection against reverse PSU connection
  - Audio output level 10Vptp
  - Envelope output level 0 to +10V
  - Gate level +5V
  - Power consumption 25mA, -15mA
  - Module width 3HP
  - Module depth 35mm
