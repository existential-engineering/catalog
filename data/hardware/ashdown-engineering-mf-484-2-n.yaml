description: The MF-484 2.N is a 30-watt all-tube guitar amplifier head with
  built-in Two notes Torpedo cabinet emulation. Its preamp uses 1 ECC81, 1 ECC82
  and 2 ECC83 valves with a quartet of EL84s in the power section, delivering
  sparkling cleans with plenty of headroom and a switchable Boost for rock
  riffs. Bass, Middle, Treble and Presence controls shape the tone, while the
  Torpedo output offers six virtual Celestion-loaded cabinets mic'd with classic
  microphones, editable over USB, for direct connection to a PA, a full-range
  cabinet or a DAW.
details: |-
  A 30-watt all-tube guitar amp head. The preamp is powered by 1 ECC81, 1 ECC82 and 2 ECC83 valves, with a quartet of EL84s in the power section, giving clean tones with plenty of headroom plus a switchable Boost for rock-inspired riffs. The standout feature is Two notes Torpedo technology offering emulations of six classic mic'd guitar cabinets, so the amp can connect directly to a PA, a full-range on-stage cabinet, or a DAW/recording console. Front-panel Bass, Middle, Treble and Presence controls give full command over the tone. Plugging into a conventional cab yields tones from clean and chiming to rich saturation; the Torpedo output accesses six virtual cabinets loaded with Celestion speakers, mic'd with legendary microphones in ideal acoustic spaces, with mic selection and placement editable via the USB port on the back panel. Note: direct purchases are not available in the United States.
specs: |-
  - Power output: 30 watts
  - Preamp valves: 1 x ECC81, 1 x ECC82, 2 x ECC83
  - Power valves: 4 x EL84
  - Controls: Bass, Middle, Treble, Presence, switchable Boost
  - Two notes Torpedo cabinet emulation: 6 virtual Celestion-loaded cabinets
  - USB port for Torpedo mic selection/placement editing
