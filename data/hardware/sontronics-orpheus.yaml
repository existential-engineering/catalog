specs: |-
  - Dual-Diaphragm Condenser Mic : Features a dual-diaphragm design that provides versatility and superior sound capture, making it perfect for a wide range of recording applications.
  - Multi-Pattern Versatility : Offers three selectable polar patterns—omnidirectional, cardioid, and figure-8—allowing you to tailor the microphone's response to your specific recording needs.
  - Unique Retro-Futuristic Design : Combines vintage aesthetics with modern engineering, featuring a distinctive round grille and an eye-catching body that looks as good as it sounds.
  - Transparent, Detailed Sound : Captures vocals and instruments with exceptional clarity and detail, making it ideal for everything from vocals and acoustic instruments to drums and orchestral recordings.
  - High SPL Handling : Capable of handling high sound pressure levels (up to 125dB), allowing you to record loud sources like drums and brass without distortion.
  - Balanced Frequency Response : Provides a smooth and natural frequency response across the entire spectrum, delivering balanced and accurate sound reproduction.
  - Wide Dynamic Range : Offers an impressive dynamic range, capturing both the subtle nuances and the powerful peaks of any performance.
  - Low Self-Noise : Engineered with low self-noise circuitry, making it ideal for capturing quiet sources and adding depth to delicate recordings.
  - Perfect for Studio Use : Whether you're recording vocals, strings, piano, or even full orchestras, the Orpheus excels in studio environments, offering professional-grade sound quality and versatility.
  - Acoustic Guitar
  - Vocals
  - Voice Over
  - Speech
  - Woodwind
  - Strings
  - Overhead
  - Ambient Recording
