details: |-
  Multi-pattern condenser microphone offering outstanding precision, clarity and detail. The Sontronics ORPHEUS has established itself as an absolute must-have for vocal, instrument and ensemble recording, and has also become renowned as one of the best room/overhead mics at this or indeed at any price. ORPHEUS has three switchable polar patterns – cardioid, omni, figure-of-eight – making it fantastically versatile, while its unmistakable presence, defined clarity and incredibly low self-noise allow you to capture the subtlest of performances that will sit perfectly in the mix. Its classy sound and crystal clear delivery have resulted in Orpheus becoming a first choice for voiceover artists, while in pairs it is an absolute go-to for overhead drum and choir recording too. FEATURES

