description: A single channel vacuum tube equalizer that is smooth, sweet and
  very subtle at mild settings, but can also be aggressive when needed. Equally
  suited for gentle tone contouring as well as extreme sound sculpting, with no
  harsh artifacts.
details: |-
  The VT-4 uses passive LC circuitry with class-A triode vacuum tube stages for the input and output. The tube circuitry is largely derived from the VT Microphone Preamplifier design, ensuring that the equalizer has much the same sonic character as the preamps. Based on classic designs, the LC-style passive equalization circuitry is still the best-sounding way to achieve high-quality, musical tonal control.

  The input is line-level, transformer balanced-bridging and the active vacuum tube input section features adjustable gain to accommodate input signals as low as -10 dBm. The input transformer is custom made to D.W. Fearn's specifications and is the same model used on the VT-1 and VT-2 Microphone Preamplifiers.

  All controls are stepped for precise repeatability and uniform matching between units. High-quality rotary switches are used with 1% metal-film resistors. All of the audio capacitors are polystyrene or polypropylene, and the inductors are custom-made to D.W. Fearn's exacting specifications.

  The equalizer is constructed of heavy-gauge aluminum, with a 3RU (5.25 inch), 1/4-inch thick front panel, finished in D.W. Fearn red. It matches the VT-1/VT-2 series of mic preamps in appearance and construction.

  Like the VT series of Microphone Preamplifiers, the VT-4 has been designed to be an exceptional tool for audio professionals. The design frequencies and curves were determined by ear, after extensive listening to a variety of program material, both individual tracks and overall mixes. The result is a highly-musical equalizer with plenty of range for enhancing any track.
specs: |-
  - Frequency response: +/- 0.2 dB 20 Hz to 20 kHz
  - THD: less than 0.06%
  - Signal-to-Noise: better than 80 dB
  - All controls are independent and can be used in any combination
  - Low Cut at 30, 40, 100, or 400 Hz, 0 to -18 dB shelving in 2 dB steps
  - Low Boost at 20, 40, 60, or 140 Hz, 0 to 16 dB shelving in 2 dB steps
  - Mid Cut at 200, 300, 400, 500, 600, or 700 Hz, 0 to -16 dB in 2 dB steps
  - High Boost at 1.5, 3, 4, 5, 8, 10, 12, or 16 kHz, 0 to 12 dB in 2 dB steps
  - High Bandwidth Q of 0.6, 0.8, 1.0, 1.4, or 1.7
  - High Frequency Cut at 1.5, 3.5, 8, or 28 kHz, 0 to -14 dB shelving in 2 dB steps
  - Gain adjustable from -9 to +9 dB, referenced to +4 dBm, in 3 dB steps
  - NOTE: Frequency is specified in cycles per second (cps) or kilocycles per second (kc). These units correspond to Hz and kHz respectively. Measurements made with -50 dBm input and 50 dB gain in a 22 cps to 22 kc bandwidth.
  - Input 600 ohms
  - Input Load Impedance 40k ohms
  - Minimum Input Level -20 dBm nominal
  - Maximum Input Level @ 20 cps +25 dB 0 dB
  - Gain ± 0.5 dB 20 cps to 20 kc -3dB@0.5cps&80 kc
  - Frequency Response <0.10% 20 cps to 20 kc
  - Intermodulation Distortion SMPTE: <0.80%
  - Signal to Noise Ratio 82 dB minimum low-Z, transformer balanced
  - Output +22 dBm unterminated
  - Maximum Output Level 120 or 220 VAC 50/60Hz, 85 W
  - Dimensions 19" (48.26cm) W 5.25" (13.34cm) H 9" (22.86cm) D (VT-2 13" 22.9cm)
  - Weight 14 lbs (6.35 kg)
