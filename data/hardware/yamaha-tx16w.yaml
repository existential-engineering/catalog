description: >-
  Yamaha's 16-voice rack-mount sampler from the late 1980s with 12-bit sampling,
  8-part multitimbral operation, and eight individual outputs, greatly improved
  by the third-party Typhoon 2000 OS.
details: |-
  The Yamaha TX16W promised 16-voice polyphony and delivered, though its other specifications were less generous for the era. Despite the model number's suggestion, sampling resolution is 12-bit rather than 16-bit, and the unit shipped with just 1.5MB of expandable RAM. The original operating system had to be loaded from 720KB floppy disks in a non-DOS format that was prone to requiring frequent reloads.

  On the positive side, the TX16W offers flexible sampling rates including 50kHz mono and 33.3kHz stereo, along with 17 built-in filter types including resonant options assignable one per voice. Eight individual monophonic outputs plus a polyphonic stereo output provide detailed mixing control, and 8-part multitimbral operation over MIDI makes it a capable sound module for sequencer-driven production.

  The real transformation came with the Typhoon 2000 freeware operating system replacement, widely considered essential for any TX16W owner. This third-party OS dramatically improves the user interface, adds AIFF file support and RS-422 connectivity, and generally elevates the instrument from a frustrating experience to a genuinely useful sampling platform.

  Front-panel microphone and line inputs allow direct sampling without external routing, and the combination of affordable used prices with the Typhoon 2000 upgrade makes the TX16W an underrated option for producers interested in vintage digital sampling character.
specs: |-
  - Polyphony: 16 voices
  - Sampling: 12-bit; 50kHz mono, 33.3kHz stereo, variable rates
  - Memory: 1.5MB (expandable); up to 16.3 seconds at 16.7kHz mono
  - Multitimbral: 8 parts
  - Filters: 17 types including resonant (1 per voice)
  - Outputs: 8 monophonic, 1 stereo polyphonic
  - Input: Mic and line (front panel)
  - Storage: External 3.5" floppy disk
  - Control: MIDI IN/OUT/THRU
