details: |-
  The 707 S3 is the most compact stand-mount model in the third-generation Bowers & Wilkins 700 Series, engineered to deliver high-performance sound from a space-friendly footprint suited to smaller listening rooms.

  It is a 2-way vented-box system pairing a 25mm (1 in) Decoupled Carbon Dome tweeter with a 130mm (5 in) Continuum cone bass/midrange driver. The cabinet uses a curved baffle and Bowers & Wilkins' Flowport technology for low-port-noise bass tuning, with the tweeter housed in a Decoupled Carbon Dome assembly inspired by the 800 Series.

  Nominal impedance is 8 ohms (4.0 ohm minimum) with a sensitivity of 84dB and a recommended amplifier power range of 30W to 100W into 8 ohms. Despite its compact footprint, the cabinet engineering and driver technology allow it to deliver performance that exceeds what its size suggests.

  Available cabinet finishes are Gloss Black, Satin White, and Mocha, with a Black grille standard and a Grey grille option offered on the Satin White finish only.
specs: |-
  - System: 2-way vented-box system with Flowport technology
  - High-frequency driver: 1x 25mm (1 in) Decoupled Carbon Dome
  - Bass/midrange driver: 1x 130mm (5 in) Continuum cone
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz - 28kHz ±3dB
  - Sensitivity: 84dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: <1% (100Hz-22kHz), <0.5% (150Hz-20kHz)
  - Nominal impedance: 8Ω (minimum 4.0Ω)
  - Recommended amplifier power: 30W - 100W into 8Ω
  - Max cable impedance: 0.1Ω
  - Height: 300mm (11.8 in) cabinet only
  - Width: 165mm (6.5 in) cabinet only
  - Depth: 247mm (9.7 in) cabinet only; 284mm (11.2 in) with grille/terminals
  - Net weight: 6.16kg (13.6 lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
