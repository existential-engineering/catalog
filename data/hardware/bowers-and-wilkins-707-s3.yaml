description: 707 S3's space friendly design makes it easy to accommodate in
  smaller spaces, but thanks to its Carbon Dome tweeter, Continuum cone mid-bass
  and curved baffle, this outstanding loudspeaker provides proof positive than
  often, size can be deceptive.
details: |-
  707 S3 is the smallest loudspeaker in the Bowers & Wilkins 700 Series, a two-way vented-box bookshelf design pairing a 25mm Decoupled Carbon Dome high-frequency unit with a 130mm Continuum cone bass and midrange driver in a cabinet 300mm tall and 165mm wide. Bowers & Wilkins presents it as slimmer than ever and capable of performance above what its diminutive size suggests, and it is the range's bookshelf model where the 705 S3 and 706 S3 are stand-mounts.

  It carries the same Carbon Dome tweeter as the rest of the series, purpose-built for the 700 Series and raising the breakup threshold to 47kHz, but not the Solid Body Tweeter-on-Top housing: its technical features list names the Decoupled Carbon Dome tweeter, the Continuum cone bass and midrange and Flowport, and nothing else. The Continuum cone's composite construction avoids the abrupt transitions in behaviour that impair a conventional drive unit, and the new curved cabinet baffle with individual drive unit pods is inspired by the 800 Series Diamond and reduces cabinet coloration.

  The speaker is entirely passive and carries no amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional single-wire connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals accept 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins on delivery to satisfy European CENELEC safety rules.

  Installation is stand-mount or shelf rather than floor-standing. Stands are not included. The manual states that the 705 S3, 706 S3 and 707 S3 are primarily designed to be mounted on the dedicated FS-700 S3 floor stand but may be placed on a shelf, noting that a shelf offers less flexibility to optimise performance and that the four self-adhesive rubber feet should be fitted to the underside if a shelf is used. In either case the tweeter should sit at about ear height at the usual listening position. For stereo the manual suggests 1.5m to 3m between speakers in an equilateral triangle with the listening position, at least 0.5m from the back and side walls, and for home theatre use within roughly 0.5m of the sides of the screen. The drive units create stray magnetic fields, so magnetically sensitive items should be kept 0.5m away.

  Low-frequency output can be tuned with the supplied two-piece foam port plugs, using either the outer piece alone for gentler attenuation or the complete assembly, which is the manual's specific recommendation for shelf placement. At 84dB sensitivity this is the least sensitive model in the range and the one with the narrowest recommended amplifier window, 30W to 100W. Performance changes during the initial listening period: the manual asks for up to a week for temperature effects to stabilise and about 15 hours of average use for the drive unit suspensions and damping compounds to reach their intended mechanical characteristics.
specs: |-
  - Description: 2-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 130mm (5 in) Continuum cone bass / midrange
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz to 28kHz +/-3dB
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis)
  - Nominal impedance: 8 ohms (minimum 4.0 ohms)
  - Recommended amplifier power: 30W to 100W into 8 ohms on unclipped programme
  - Sensitivity: 84dB spl (2.83Vrms, 1m)
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Continuum cone bass / midrange, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 300mm (11.8 in) cabinet only; width 165mm (6.5 in) cabinet only; depth 247mm (9.7 in) cabinet only, 284mm (11.2 in) including grille and terminals
  - Net weight: 6.16kg (13.6lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
  - Bookshelf or stand-mount: designed for the FS-700 S3 floor stand or shelf placement, stands not included. Supplied with grille, two-piece foam plugs and self-adhesive rubber feet
