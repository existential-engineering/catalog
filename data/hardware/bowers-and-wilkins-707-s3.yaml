description: High-performance 700 Series bookshelf speakers featuring a
  space-friendly design suitable for smaller listening areas. Despite its
  compact footprint, the speaker delivers performance exceeding what its
  diminutive size suggests, thanks to advanced driver technology and cabinet
  engineering.
details: |-
  2-way vented-box system with Flowport technology. Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency tweeter and 1x 130mm (5 in) Continuum cone bass/midrange driver. Available cabinet finishes: Gloss Black, Satin White, and Mocha. Grille finishes: Black, with Grey available on Satin White only.
specs: |-
  - System: 2-way vented-box system with Flowport technology
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency tweeter
  - Drive units: 1x 130mm (5 in) Continuum cone bass/midrange driver
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz - 28kHz ±3dB
  - Sensitivity: 84dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: <1% (100Hz-22kHz), <0.5% (150Hz-20kHz)
  - Nominal impedance: 8Ω (minimum 4.0Ω)
  - Recommended amplifier power: 30W - 100W into 8Ω
  - Max cable impedance: 0.1Ω
  - Height: 300mm (11.8 in) cabinet only
  - Width: 165mm (6.5 in) cabinet only
  - Depth: 247mm (9.7 in) cabinet only; 284mm (11.2 in) with grille/terminals
  - Net weight: 6.16kg (13.6 lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
