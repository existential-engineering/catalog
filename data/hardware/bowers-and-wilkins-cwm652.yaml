details: |-
  The CWM652 is the smallest of the Performance Series two-way in-wall speakers, listed on the product page as a Performance two-way in-wall speaker in a White finish.

  The CWM652 features a 130mm (5in) bass/midrange driver housed in a die-cast chassis which provides the extra rigidity to provide a cleaner, faster bass. Its aluminium tweeter incorporates a Nautilus tube to absorb unwanted sonic radiation.

  The CWM652 also utilises a three-position high frequency switch to fine tune the sound. The incredibly easy to install frame includes QuickDogs and plug-and-play functionality.

  CWM6 Series wall mount speakers comprise a baffle carrying the speaker drivers and crossover, an integrated frame and front flange, and a magnetically secured grille. The frame is connected via side mounted terminals to the speaker cables, with the baffle connecting automatically as it is inserted in the frame. Speaker cable connects to the red and black spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then held in the aperture by QuickDogs spring clamps (four on the CWM652). The baffle carrying the drivers and crossover then fits into the frame and the grille is held magnetically.
