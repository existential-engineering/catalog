details: |-
  CWM652 is a two-way passive in-wall speaker in the Bowers & Wilkins Performance Series, pairing a 130mm (5in) blue Kevlar cone bass/midrange driver with a 25mm (1in) Nautilus tube loaded aluminium dome tweeter. It is a passive design with no on-board amplifier and no mains connection, driven from an external amplifier over ordinary speaker cable.

  The bass/midrange driver sits in a die-cast chassis, which Bowers & Wilkins describes as providing the extra rigidity needed for cleaner, faster bass. The aluminium dome tweeter carries a Nautilus tube behind it to absorb unwanted sonic radiation from the rear of the dome, the same principle the company applies across its loudspeaker range.

  A three-position high frequency switch on the baffle lets the installer fine-tune the treble balance to the room and the mounting position, which is the one adjustment the speaker offers.

  Installation uses the Bowers & Wilkins QuickDogs fixing system with plug-and-play connection, so the frame clamps itself to the plasterboard and the baffle mates with the frame without separate wiring at the baffle. The speaker needs a 228mm x 153mm (9in x 6in) cut-out and 95mm (3.7in) of clear depth behind the mounting surface, and protrudes 4mm (0.2in) from the wall. A PMK W5 pre-mount kit and a BB 6W back box are offered for new-build installations.
specs: |-
  - Description: 2-way in-wall system
  - Drive units: 1x 25mm (1in) Nautilus tube loaded aluminium dome tweeter, 1x 130mm (5in) blue Kevlar cone bass/midrange
  - Frequency range (-6dB): 54Hz to 50kHz
  - Maximum amplifier power: 25W to 100W
  - Sensitivity SPL (2.83V, 1m): 86dB
  - Nominal impedance: 8 ohms (minimum 4.5 ohms)
  - Frame height: 264mm (10.9in)
  - Frame width: 191mm (7.5in)
  - Cut-out height: 228mm (9in)
  - Cut-out width: 153mm (6in)
  - Depth behind surface: 95mm (3.7in)
  - Protrusion: 4mm (0.2in)
  - Three-position high frequency switch
  - QuickDogs fixing system with plug-and-play connection
  - Pre-mount kit: PMK W5
  - Back box: BB 6W
  - Passive two-way in-wall speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
