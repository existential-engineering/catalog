description: 4x St. Mixer is a 4 HP quad stereo mixer with right inputs
  normalled to left inputs for easy mono operation, and a DC coupled signal path
  that also works as a CV mixer.
details: |-
  4x St. Mixer is a 4 HP quad stereo mixer.

  Right inputs are normalled to Left inputs for easy mono operation.

  Several 4x St. Mixers can be chained together, or with other Happy Nerding stereo modules, via sockets on the back side.

  DC coupled signal pass, thus it can be used as a CV mixer too.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - 4 stereo input channels
  - Right inputs normalled to Left inputs for mono operation
  - Rear-side sockets for chaining with other Happy Nerding stereo modules
  - DC coupled signal path, usable as a CV mixer
  - +65 mA, -50 mA
  - 35 mm depth
  - 4 HP wide
  - Reverse power protected
