description: The RD Compact Hot Rod is a super-charged version of the
  RevivalDRIVE Compact pedal, paying homage to the heavily modified amps that
  came to define the sound of Hard Rock and Heavy Metal. Using all-analogue
  components and discrete transistor-based circuitry in place of valves, it
  reproduces the sound, response and circuit behaviour of these 'hot rods',
  delivering aggressive high gain and massive sustain.
details: |-
  With the ability to directly shape key amp properties like preamp voicing, break-up characteristics and low-frequency distortion, plus a built-in Blend control to mix in the dry signal, the RD Compact Hot Rod dials in a range of legendary 'hot-rodded' amp tones.

  Features include a Class-A preamp stage with realistic 'hot-rodded' amp gain-staging, phase inverter and push-pull output stages, variable negative feedback, a specially designed power supply emulating rectifier and mains transformer sag, and a reactive load simulating amp/speaker interaction.

  The built-in Post-Drive EQ tailors the output to work with any amp, flat-response power amp, cabinet simulator, or recording interface. Housed in a hand-polished, brushed stainless steel enclosure with Neutrik jack sockets.
