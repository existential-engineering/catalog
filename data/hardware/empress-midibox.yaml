description: A MIDI-to-control-port converter box that lets you control Empress
  pedals equipped with a control port over MIDI. It converts a standard 5-pin
  MIDI cable into simple guitar patch cables, with four control-port outputs to
  drive up to four pedals at once.
details: |-
  The Midibox connects Empress pedals equipped with a control port to MIDI. It converts the standard 5-pin MIDI signal into control-port outputs on 1/4" jacks, so any Empress pedal with a control port can be controlled from a MIDI source using ordinary guitar patch cables.

  Four control-port outputs let you control up to four Empress pedals simultaneously. The unit is housed in a die-cast aluminum enclosure and runs on a standard 9-12V DC supply. It has since been discontinued and replaced by the Midibox2.
specs: |-
  - Converts 5-pin MIDI to Empress control-port outputs (1/4" jacks)
  - 4 control-port outputs (control up to 4 pedals at once)
  - Power: 9-12V DC (negative tip), 2.1mm barrel connector
  - Power consumption: ~10mA
  - Enclosure: die-cast aluminum
  - Dimensions: 4.5" L x 2.5" W x 1.25" H
  - Weight: 0.5 lb
