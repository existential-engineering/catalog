description: Entry-level handheld dynamic vocal microphone with a supercardioid
  polar pattern. Balanced frequency response and a tight-mesh Memraflex grille
  deliver controlled lows, articulate mid-range and smooth highs for live sound
  vocal applications.
details: >-
  The PL-24 is a professional-grade supercardioid dynamic vocal microphone in
  Electro-Voice's PL (Pro Line) series, designed for live sound applications.
  The supercardioid pattern provides tight off-axis rejection that helps the mic
  resist feedback from wedge monitors and reject bleed from nearby sources on a
  loud stage.


  Voicing is tuned around a balanced frequency response from 80 Hz to 16 kHz,
  with controlled lows that keep proximity effect in check, a palatable
  mid-range for vocal presence, and a smooth high end that avoids harshness. A
  powerful neodymium magnet structure drives the dynamic capsule for solid
  output, and a tight-mesh Memraflex grille adds resistance to dents and dings
  without choking the top end.


  The handheld body is built from die cast zinc with a textured satin black
  finish, weighing 0.294 kg, and connects via a standard 3-pin XLR with a
  low-impedance balanced output of 600 ohms suitable for any professional mixer
  or preamp. The microphone is passive and requires no phantom power. A PL24S
  variant adds an on/off switch.
specs: |-
  - Element: Dynamic
  - Polar pattern: Supercardioid
  - Frequency response: 80 Hz - 16,000 Hz
  - Impedance (low-Z balanced): 600 ohms
  - Open circuit voltage: 2.2 mV/Pa
  - Connector: 3-pin XLR
  - Form factor: Handheld
  - Wired/wireless: Wired
  - Net weight: 0.294 kg
  - Case material: Die cast zinc
  - Finish: Textured Satin Black
  - Power requirement: Passive (no phantom power)
  - Magnet structure: Neodymium
  - Grille: Tight-mesh Memraflex
