name: Flamingo
manufacturer: crane-song
primaryCategory: preamp
url: http://cranesong.com/flamingo.html
description: A two-channel discrete class A microphone preamp that can operate
  as a musically transparent preamp or emulate vintage and distinctive new
  sounds via switchable IRON, SOUND, and TONE circuits.
details: |-
  Flamingo is a high quality two channel discrete class A microphone pre-amp. It can be operated as a musically transparent pre-amplifier, but is capable of emulating vintage sounds as well as creating distinctive new ones.

  The input gain is selected by a stepped switch for gain matching and repeatability, followed by a continuously variable attenuator for gain trim. Gain is adjustable in 6 dB steps to 66 dB, and down to off via the attenuator. Each channel has independently switchable phase and phantom power switches. Flamingo also contains a two channel 22 element VU meter with an overload indicator for accurate level monitoring.

  Unique to Flamingo are three switches that let the user select different sounds: IRON, SOUND, and TONE. The SOUND switch changes the type of amplifier and the IRON switch puts iron in the audio path. The TONE switch is a 3-position switch: the center position is the original Flamingo sound, the right position makes Flamingo operate as a transparent preamp, and the left position adds more color.

  Flamingo also includes an input impedance switch with two choices: the original Flamingo setting, or a setting to match large diaphragm condenser mics as recommended by David Bock of Bock Audio. It has transformer-less balanced inputs and outputs.

  Flamingo is designed to be flexible, giving the user a tool to solve real world recording, broadcast, and sound reinforcement problems, providing an artistic choice of sounds at the flip of a switch.
specs: |-
  - Two channel discrete class A microphone preamp
  - Stepped gain switch plus continuously variable attenuator; 6 dB steps up to 66 dB gain
  - Independently switchable phase and phantom power per channel
  - Two channel 22 element VU meter with overload indicator
  - IRON, SOUND, and TONE switches for selectable sonic character
  - 3-position TONE switch: standard, transparent, or colored
  - Input impedance switch with two settings (original Flamingo / large diaphragm condenser match)
  - Transformer-less balanced inputs and outputs
