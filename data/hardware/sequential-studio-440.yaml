description: >-
  The Sequential Circuits Studio 440 is a 12-bit sampling drum machine and music
  production workstation released in 1987. It features an analog lowpass filter, a
  50,000-note sequencer across 8 tracks, and was one of the first instruments to include
  built-in SCSI connectivity for external storage. As one of Sequential's final products,
  it remains a sought-after vintage instrument known for its lo-fi character and
  ahead-of-its-time production workflow.
details: |-
  The Studio 440 was Sequential Circuits' ambitious entry into the sampling drum machine and music production category. Released in 1987, it combined 12-bit sampling with an 8-voice polyphonic architecture, an analog lowpass filter, and a powerful built-in sequencer, making it a remarkably self-contained production tool for its era.

    The sampler operates at selectable rates of 16, 32, or 44 kHz with 512 KB of onboard memory. While the 12-bit resolution was modest compared to the 16-bit Akai MPCs of the time, the lower bit depth gives the Studio 440 a distinctive lo-fi character that many producers find musically appealing. The inclusion of an analog lowpass filter (non-resonant) with its own envelope adds warmth and shaping capability to the sampled sounds.

    The onboard sequencer is intuitive and capable, offering 50,000 notes of capacity across 8 separate tracks with adjustable swing from 50% to 75%. Notably for its time, the Studio 440 could transmit MIDI data from its sequencer to external MIDI instruments, functioning as the centerpiece of a larger studio setup.

    One of the Studio 440's most forward-thinking features was its built-in SCSI port, allowing users to save and load samples to external hard drives — a rarity in 1987. The unit was one of Sequential Circuits' final products before the company closed, and it commands high prices on the vintage market due to its rarity and the difficulty of servicing these aging units.
specs: |-
  - Polyphony: 8 voices
    - Sampler: 12-bit, selectable 16/32/44 kHz sampling rates
    - Memory: 512 KB with SCSI port for external storage
    - Filter: Analog lowpass (non-resonant) with envelope
    - Sequencer: 50,000 notes, 8 tracks, adjustable swing (50-75%)
    - Interface: 8 pads
    - Effects: None
    - Control: MIDI
    - Year Produced: 1987
