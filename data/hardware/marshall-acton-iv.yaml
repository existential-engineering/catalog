description: Bluetooth home speaker with spacious, room-to-room sound.
details: |-
  Acton IV's room-filling stereo sound has evolved thanks to its improved components and redesigned bass port. Built-in Auracast technology lets you seamlessly integrate this speaker into a multi-speaker set-up. With its classic and timeless look, you know it's Marshall.

  Wide soundstage: improved tweeters and waveguides help spread your favourite music across a larger area of the room. Enhanced stereo separation creates more expansive listening sessions, bringing you closer to the music you love.

  Enhanced bass: a redesigned bass port creates a cleaner and more powerful bass with tighter sound at higher volumes. It is also easier to place the speaker flush against walls. Dynamic loudness adapts the tonal balance so music sounds consistent at every volume.

  Analogue inputs: connect a record player using the new RCA input, or bring in other audio devices through the AUX input and a 3.5 mm stereo jack lead. Tactile heritage amp-inspired controls on the brass top panel handle volume, bass, treble and playback, alongside the customisable M-button.

  Marshall app: adjust EQ settings and use room calibration to achieve the acoustic fit for your space. Acton IV is compatible with Heddon. Designed and engineered in Sweden. Made in Thailand.
specs: |-
  - Driver type: Dynamic
  - Frequency range: 37 to 38,000 Hz
  - Drivers: one 4 inch woofer, two 0.75 inch tweeters with waveguides
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 95 dB SPL at 1 m
  - Cabinet principle: Bass-reflex
  - One 60 Watt Class D amplifier for the woofer
  - Two 25 Watt Class D amplifiers for the tweeters
  - Wireless connectivity: Bluetooth 5.3, Auracast
  - Bluetooth range: 10 m / 32.8 ft
  - Codecs: SBC, AAC (MPEG-2), LDAC, LC3
  - Bluetooth multipoint connectivity: Yes
  - Wired connectivity: AUX 3.5 mm and RCA inputs
  - Top panel controls: bass, treble, volume, power switch, media jog, M-button, source button
  - Microphone system: No
  - Mains input voltage: 100 to 240 V
  - Weight: 2.65 kg / 5.84 lb
  - Width: 171 mm / 6.73"
  - Height: 150 mm / 5.91"
  - Depth: 260 mm / 10.24"
  - Repairability: knobs, feet and grille available as spare parts, authorised repair service offered
  - Cabinet contains FSC 100 percent certified wood (FSC C225755)
  - Box contents: Acton IV speaker, mains lead, quick start guide, legal and safety information
  - Compatible app: Marshall app
