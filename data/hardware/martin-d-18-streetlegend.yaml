description: The D-18 StreetLegend pairs classic Martin tone with a top visually
  aged to echo museum-worthy guitars. With solid woods, vintage-style details,
  and bold Dreadnought sound, it's built to look-and sound-like a legend.
details: |-
  The D-18 StreetLegend combines trusted, legendary tone with a lived-in aesthetic. Its solid spruce top features visual wear inspired by historic guitars in the Martin Museum, giving a brand-new guitar the appearance of a well-loved heirloom. This vintage-inspired aesthetic is complemented by solid mahogany back and sides, aged open-gear tuners, and a satin-aged pickguard.

  The satin-finished Dreadnought delivers strong bass, bright trebles, and a punchy midrange. It features a neck with Golden Era Modified Low Oval profile, high-performance taper, and 25.4" scale length.

  Martin's refreshed Standard Series for 2025 enhances tone, comfort, and style through Sitka spruce GE top bracing, reimagined neck profile, thinner fingerboard, and refined bridge and heel for improved playability and aesthetics. Each guitar includes a hardshell case.
specs: |-
  - Body: D-14 Fret Dreadnought
  - Back & Sides: Solid Mahogany
  - Top: Solid Spruce, satin finish, aged color
  - Bridge: GE Modern Belly, Ebony bridge pins
  - Neck: GE Modified Low Oval profile, Select Hardwood
  - Neck Taper: High-Performance Taper
  - Scale Length: 25.4"
  - Fingerboard: Ebony
  - Nut Width: 1 3/4"
  - Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Old Style 18
  - Frets: 20 total, joins body at 14th fret
  - Bracing: Forward shifted X-brace, GE-scalloped spruce, 5/16" size
  - Tuners: Nickel open-gear with butterbean knobs
  - Nut & Saddle: Bone
  - Finish: Satin (body and neck)
  - Case: Hardshell included
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium
  - Plek'd: Yes
  - Left-Handed: Available
