description: An overdrive pedal that adds a mil-spec vacuum tube gain stage to
  Maxon's classic OD-9 circuit for extra warmth and saturation. A dedicated Tube
  knob blends in tube-driven tone on top of the standard overdrive controls.
details: |-
  Please note , Godlyke, Inc. is no longer Maxon's Distributor and will no longer be receiving inventory from Maxon Japan. If you're interested in the TOD9 please see Godlyke's new collaborations with Mr. Tamura (original Tube Screamer Engineer), the NEW designed from Mr. Tamura . The TOD-9 takes Maxon's classic OD-9 circuit and adds a tube gain stage at the front end to create an ultra-compact, tube-driven tone machine. The Maxon OD-9 circuit has achieved a legendary status among tone connoisseurs as the ultimate tool for driving a tube amp. Yet sometimes you need that little "something extra," and the TOD-9 provides this missing ingredient in spades. The TOD features a mil-spec 5703WB JAN Raytheon sub-miniature vacuum tube complete with its own separate Gain control (Tube knob). This tube stage is positioned at the front of the audio path, driving the OD-9 circuit. With the Tube knob at zero, the TOD sounds exactly like an OD-9. Engage this control and experience the unmistakable magic of tube tone – a big, FAT, natural-sounding bottom end and the characteristic tube "sag" that makes lead lines sing. With the Drive knob down, the Tube knob will add warmth and dimension to your tone. With Drive knob up you'll get all this extra girth as well as increased saturation as the tube drives the clipping stage of the pedal. If big, warm tube tones are your bag, the TOD-9 offers them up in a familiar package that continues to withstand the tests of time. The TOD-9 provides all the classic tonality of the Maxon OD-9 with the ability to blend in tube-generated warmth and additional saturation. TECH TALK:

  The TOD takes the classic OD-9 overdrive circuit and adds a mil-spec 5703WB JAN Raytheon sub-miniature vacuum tube positioned at the front of the audio path, driving the OD-9 circuit. The TOD-9 features internal voltage doublers that bump the incoming 9 VDC up to 30 VDC for stable tone with low distortion and increased headroom. The TOD also features Maxon's In-Rush Current Control system - As soon as power is applied to the pedal, a small current is applied to the tube and begins heating it at a very low voltage (much like a tube amp standby switch) - This system dramatically extends the tube life. The TOD-9 features Mechanical True Bypass switching via a Fujisoku 4PDT switch. NOTE ON POWERING THE TOD-9 - this pedal's voltage regulator IC requires a high inrush current of approximately 2000 mA upon startup. When using with a Power Brick such as the Voodoo Labs Pedal Power 2+, this pedal should be connected to a high current power jack when possible. Input Impedance : 500K Ohms

  Output Impedance : 10K Ohms or less

  Maximum Gain : 48.5 dB (1.6 KHz)

  Equivalent Input Noise : -106.8 dB or less (IHF-A)

  Controls : TUBE, DRIVE, TONE, LEVEL

  Switch : BYPASS/EFFECT (mechanical TBS)

  In/Out : INPUT, OUTPUT

  Indicator : BYPASS/EFFECT LED

  Internal Circuit Voltage : 30 VDC (DC-DC Converter)

  Current Consumption : 260 mA / 9 VDC

  Dimensions : 74 mm (W) x 124 mm (D) x 54 mm (H) / 2.9" (W) x 4.9" (D) x 2.13" (H)

  Weight : 560 g (excluding AC adaptor) / 19.75 Oz. Power Supply : Maxon AC2009 (no battery operation)

  Accessory : Maxon AC2009

  Option : Adaptor type (for foreign countries)

  *All specifications are subject to change for improvement without notice or obligation. All brand names and product names are trademarks or registered trademarks of their respective companies.
specs: |-
  - OD-9 circuit with added tube stage
  - Employs mil-spec sub-miniature vacuum tube
  - Tube control fills out lows and low mids
  - Internal voltage regulator runs 30 Volts to tube
  - Heater In-rush current control warms tube upon power-up
  - True Bypass Switching
