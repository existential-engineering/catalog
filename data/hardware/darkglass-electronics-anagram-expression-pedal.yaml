details: |-
  Made to express Anagram, the Anagram Press is a compact expression pedal designed for bass players who value reliability, simplicity, and precise control over their effects. Engineered for seamless integration with modern pedalboards, it delivers smooth, linear response for controlling expression-enabled devices.

  The pedal prioritizes intuitive control for shaping dynamics, sweeping filters, and morphing effect parameters. It includes an LED array that displays position information and operates on optional 9V battery power, with an integrated battery compartment in a pedalboard-friendly compact form factor.

  It connects via a standard 1/4-inch TRS jack (10 kohm linear) for general expression use, and also offers an RTS wiring mode for use with the Anagram multi-effects unit. The pedal measures 6.38 x 3.19 x 2.01 inches and weighs 0.95 lb.
specs: |-
  - Compact expression pedal with smooth, linear response
  - LED array position display
  - Optional 9V battery power with integrated battery compartment
  - TRS mode: 1/4-inch TRS, 10 kohm linear impedance
  - RTS mode (for Anagram): 1/4-inch RTS, 10 kohm linear impedance
  - Dimensions: 6.38 x 3.19 x 2.01 in; weight 0.95 lb
