description: The "Red Knob Mod" version of Tonal Recall is built around 4
  re-issued versions of the legendary MN3005 bucket-brigade delay chips. Its
  maximum delay time is increased to 1100ms and the unmistakable analog
  character of this delay is front and center.
details: |-
  Buckle up, it's time to go back to Mars. The "Red Knob Mod" version of Tonal Recall is built around 4 re-issued versions of the legendary MN3005 bucket-brigade delay chips, and its maximum delay time is increased to 1100ms. Tonal Recall expands upon the classic vintage sounds associated with analog delays of yesteryear while bringing modern amenities such as tap tempo, optional bypass with trails, expression control over any parameter, and the ability to save presets.

  Where the original Tonal Recall was built around a pair of MN3005 chips, the RKM runs four re-issued Xvive MN3005 chips. An S/L/B toggle controls how many chips the delayed signal passes through: S for "short" (1 MN3005, 20ms to 275ms delay), L for "long" (4 MN3005, 80ms to 1100ms delay), and B for "both", which creates more of a blurry, reverb-like wash.

  Every knob and switch is connected to a little digital brain while the guitar signal stays 100% analog and never gets digitally processed. Since the control of the effect is digital, it opens up unprecedented effects and features that have never been heard or offered in analog stompboxes. The Tone (Ramp) knob works as a low-pass tone filter for the repeats — from slightly brighter than an average analog delay to black-out murk oil delay darkness — or, via the rear DIP switches, controls ramping of any of the five parameters (mix, rate, time, regen, depth), either modulating or ramping-and-holding them.

  Rate and Depth set the LFO pitch modulation on the repeats, with a wave shape toggle selecting triangle, sine, or square. Regen controls the repeats and can regenerate seemingly forever or into self-oscillating madness, eventually devolving into a beautiful, smeary, tape-saturated blur; holding the Tap/Hold stomp puts the pedal into self-oscillating "runaway" mode. Two preset slots are recalled from a toggle and saved via the stomp switches.

  The TRS Tap/MIDI jack works as a tap input or output with a regular instrument cable and interfaces with a Chase Bliss Midibox for MIDI. The Exp/CV jack takes an expression pedal or 0-5V control voltage, with parameter assignment and sweep range set by the rear DIP switches, which also select true bypass (relay) or buffered bypass with trails and a momentary-to-bypass mode.
specs: |-
  - All-analog signal path with 100% digital control
  - 4x re-issued Xvive MN3005 bucket-brigade delay chips
  - Maximum delay time: 1100ms
  - S/L/B chip toggle: short (1 chip, 20-275ms), long (4 chips, 80-1100ms), both (reverb-like wash)
  - Tap tempo with selectable note divisions and self-oscillating hold/runaway mode
  - Pitch modulation on repeats with rate, depth, and wave shape (triangle, sine, square)
  - Ramping control over mix, rate, time, regen, and depth
  - 2 onboard preset slots
  - True bypass (relay) or buffered bypass with trails, plus momentary-to-bypass option
  - MIDI via TRS Tap/MIDI jack (with Chase Bliss Midibox)
  - Expression pedal or 0-5V CV control with configurable sweep range
  - Rear DIP switches for ramp/expression, bounce, trails, tap control, division, and sweep settings
  - Input impedance: 1M; output impedance: less than 5k
  - Power: 9V DC center negative, 2.1mm barrel, ~150mA (200mA supply recommended)
  - Weight: 1.9 lbs
