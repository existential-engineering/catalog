description: A 6hp four-channel stereo audio mixer with one knob per channel, a
  single output, and level-indicating LEDs. Mono signals input on the left
  channel are normalized to both channels.
details: |-
  Mixing in stereo, without getting things too mixed up. I don't have to explain this one. It's a stereo mixer. You have four channels, one knob per channel, one output, two level indicating LEDs and no crosstalk. The parts you want to mix will mix, the parts you would rather don't mix, will politely stay well away from each other. Single inputs in the left channel will be normalized to both channels as well, so your mono sources are welcome, too. The Quad Stereo Mixer will not judge your input. I know what you're about to ask, and yes, the capacitors are audio grade. Yes, the internal opamps are souped up. Yes, everything is nice and clean and plays nice and sounds good. If you want something else, if you want something that behaves unpredictably or doesn't work quite right or just plain sucks, maybe look somewhere else. This module does exactly what it should: not much, but the thing it does do, it does really well. If you think that sounds like something you would enjoy, you have found the exact right product for you, and I think you will be very pleased.
specs: |-
  - Clean, straightforward and well-behaved stereo mixing
  - High-grade component selection and quiet design
  - LEDs to visually indicate that something is going on
  - Mono signals are normalized to both channels
