description: The AV8805A is made for home cinema enthusiasts who seek
  versatility and flexibility, without sacrificing musicality. Marantz Sound
  Masters leveraged decades of experience in Hi-Fi to drive exceptional,
  audiophile-quality surround sound for all your entertainment.
details: |-
  The AV8805A is made for home cinema enthusiasts who seek versatility and flexibility, without sacrificing musicality. Marantz Sound Masters leveraged decades of experience in Hi-Fi to drive exceptional, audiophile-quality surround sound for all your entertainment.

  Created with attention to detail, this 13.2-channel pre-amplifier and processor is built around 15 single Marantz HDAM boards for reference-setting audio performance, a copper-plated chassis and a toroidal power transformer.

  Eight HDMI inputs and three outputs cover current sources, with eARC support, 8K pass-through and scaling, HDR, HLG, Dolby Vision, HDR10+ and Dynamic HDR, plus ALLM, VRR and Quick Frame Transport for gaming.

  Full 3D audio support covers Dolby Atmos, Dolby Atmos Height Virtualization, DTS:X, DTS Virtual:X, DTS:X Pro, IMAX Enhanced and Auro-3D, with Audyssey MultEQ XT32 room correction.

  Every one of the 15.2 pre-out channels is presented on both gold-plated RCA and balanced XLR connectors, alongside a 7.1-channel analog input, phono (MM), three component video inputs, RS-232C and Marantz Remote Bus.
specs: |-
  - 13.2 processing channels, 15.2-channel pre-out on both RCA and XLR
  - Eight HDMI inputs (seven rear, one front) and three HDMI outputs with eARC
  - 8K/60Hz and 4K/120Hz pass-through, HDCP 2.3, HDR/HLG/Dolby Vision/HDR10+/Dynamic HDR
  - Dolby TrueHD, Dolby Atmos, Dolby Atmos Music, DTS-HD Master, DTS:X, DTS:X Pro, DTS Neural:X (11ch), DTS Virtual:X, Auro-3D, IMAX Enhanced
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - 15 single Marantz HDAM boards, current feedback topology, copper-plated chassis, toroidal transformer
  - 7.1-channel analog input, six rear plus one front analog stereo inputs, balanced XLR input, phono (MM)
  - Three component video inputs and one component video output, five composite inputs, two composite outputs
  - HEOS built-in, AirPlay 2, Spotify Connect, Roon Tested, Bluetooth, Wi-Fi and Ethernet
  - Three multi-room zones, 2 DC triggers, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 90 W, standby 0.2 W, weight 30.4 lbs.
