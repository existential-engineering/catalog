description: Semi-open gaming headset that adds a dedicated microphone to the T50RPmk4g, using the 4th generation RP planar diaphragm driver for fast transient response. The microphone can be connected to either the left or right side, and its cable-mounted controller handles mute and volume.
details: |-
  The T50RPmk4g+ revolutionizes gaming experiences with RP technology, adding a dedicated microphone to the T50RPmk4g and featuring the 4th generation RP planar diaphragm driver that faithfully reproduces instantaneous sound contours with excellent transient characteristics. With a microphone that can be connected to either the left or right side, it enables comfortable voice chat.

  The RP technology planar diaphragm driver, improved over the past 50 years and evolved into the fourth generation, has undergone significant improvements including an increase in the number of magnets that sandwich the diaphragm and a new design for the pattern shape of the printed coil. This enables accurate and high-definition reproduction from the low to high frequency range and delivers an outstanding sense of localization and separation, an advantage in hearing minute sounds like footsteps and distinguishing targets against environmental sounds and background music.

  The dedicated microphone can be connected to either the left or right side according to the gaming environment. The controller on the microphone cable enables microphone mute on and off and volume adjustment. Using the same shape for both the left and right housing reduces sound quality differences caused by internal left and right variations due to the presence or absence of connectors, resulting in clearer sound positioning.

  The semi-open housing design provides adequate ventilation and clear sound quality with reduced stuffiness, while the around-ear memory foam ear pads ensure comfortable wear. This combination prevents heat buildup during extended gaming sessions.
specs: |-
  - Type: Semi-open
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 97 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 370 g (including approx. 40 g for the microphone cable)
  - Microphone polar pattern: Omnidirectional
  - Microphone type: Electret condenser
  - Microphone sensitivity: -37 +/-3 dB (0 dB = 1 V/Pa, 1 kHz)
  - Microphone impedance: 2.2 kohm
  - Inline controller with microphone mute and volume adjustment
  - Accessories: Stereo phone cable with microphone, 3.5 mm (3-pole) to 3.5 mm (4-pole) 2 m x 1
  - Passive wired headset, no power supply required
  - Series: RP Series
