description: The 02H is one of Collings' smallest acoustic offerings,
  functioning equally well as a travel instrument and a small OM-style guitar.
  It delivers a uniquely round, punchy tone with small body character, offering
  impressive volume and headroom despite reduced low-end response compared to
  larger models. Built with a Sitka spruce top and East Indian rosewood back and
  sides, it features ivoroid binding with herringbone purfling and a pre-war
  scalloped X-brace pattern.
details: |-
  The 02H is a single-0 14-fret acoustic guitar that occupies a unique space as both a compact travel companion and a serious small-body instrument. Despite its modest dimensions — 13 7/16" body width and 38" total length — the 02H produces impressive volume and headroom with a round, punchy character. The reduced low-end response relative to larger models is offset by a focused midrange clarity that suits fingerpicking and lighter flatpicking styles particularly well. Constructed with a Sitka spruce top braced in a pre-war scalloped X-brace pattern, paired with East Indian rosewood back and sides, the 02H balances warmth and articulation. The Honduran mahogany neck with its modified V profile and 24 7/8" scale length gives the instrument a comfortable, familiar feel. The compound radius ebony fingerboard (14"-26") features abalone short diamond and square inlays. Ivoroid body binding with herringbone purfling, a tortoise pickguard, and a zipper-style backstrip complete the classic appointments.
specs: |-
  - Body Style: Single 0, 14-fret
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Brace Material: Sitka spruce
  - Brace Pattern: Pre-war scalloped X-brace
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Fingerboard: Ebony
  - Fingerboard Inlays: Abalone short diamond & squares
  - Fingerboard Radius: 14" - 26" compound
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Bridge Pins/End Pin: Ebony with mother-of-pearl dot
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Scale Length: 24 7/8"
  - Neck Profile: Modified V
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Peghead Profile: Square with volute
  - Peghead Veneer: Stained exotic ebony with MOP Collings logo
  - Body Binding: Ivoroid with herringbone purfling
  - Rosette: Ivoroid/tortoise/ivoroid & black/white purflings
  - Pickguard: Tortoise
  - Backstrip: 2-style (Zipper)
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 13 7/16"
  - Body Length: 18 3/16"
  - Body Depth: 4"
  - Total Length: 38"
  - Strings: D'Addario EJ-16 (.012" - .053")
