details: |-
  The F-10 is an F-body Original Series model pairing East Indian Rosewood back and sides with a Red Cedar top. George Lowden describes a light weight 'bolt on' design neck joint with a 3-piece neck that allows transference of the neck's natural vibration, achieving a really solid joint without disturbing the natural balance of the instrument. The result aims for characteristic Lowden tone that works across bluegrass to fingerpicking to Celtic strumming. The Original Series is built with AAA-grade tonewoods selected for tonal depth, balance and responsiveness, and carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - East Indian Rosewood back and sides
  - Red Cedar top
  - F body shape
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Hardshell case included
