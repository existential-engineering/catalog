description: iRig Mic Studio XLR is a large-diaphragm analog studio condenser
  microphone with a 1-inch back electret condenser capsule and cardioid polar
  pattern, designed for vocal and instrument recording.
details: |-
  iRig Mic Studio XLR features a 1-inch back electret condenser capsule with a cardioid (unidirectional) polar pattern, delivering detailed and focused audio capture for studio vocal and instrument recording.

  Requires 48V phantom power from a mixer, preamp, or audio interface. The compact form factor makes it suitable for home studios and portable recording setups.

  Includes XLR connection cable (2m/6'), mic clamp, and tabletop tripod stand.
specs: |-
  - Back electret condenser, 1" capsule
  - Polar pattern: cardioid (unidirectional)
  - Frequency response: 20 Hz - 20 kHz
  - Maximum SPL: 142 dB
  - Sensitivity: -37.5 dB at 1 kHz
  - Equivalent noise level: 17 dB-A (A-weighted)
  - Connector: male 3-pin XLR
  - Requires 48V phantom power
  - Cable length: 2 m (6')
  - Dimensions: 45 mm (1.77") x 117 mm (4.61")
  - Weight: 218 g (7.69 oz)
