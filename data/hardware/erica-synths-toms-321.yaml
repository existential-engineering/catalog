details: |-
  Erica Synths Toms is Erica Synths' take on analogue toms circuits adapted for modular systems, developed in collaboration with the French company e-licktronic. The massive, punchy sound, with Accent and Tone CV, makes it expressive in the studio and in live performance.

  The 16HP module holds Low, Mid and High Tom on one panel, each with its own pitch and decay controls and its own output, with no on-board summing, so the three voices can be tuned to taste and mixed separately.

  Pitch is under CV control with an attenuator, a manual trigger fires the voices by hand, and an Accent input adds expression. The decay range runs from 370ms to 955ms.

  Audio output level runs from -5V to +5V and the CV level covers the same full span, accent CV is 10V, and the trigger level is 5V with a 1ms trigger time. The module is 16HP wide and 50mm deep, drawing 83mA on the +12V rail and 76mA on the -12V rail.
specs: |-
  - Low, Mid and High Tom in one module
  - Pitch and decay controls
  - Pitch CV control with attenuator
  - Manual trigger
  - Accent for better expression
  - Decay range 370ms - 955ms
  - Audio output level -5...+5V
  - CV level (full span) -5 - +5V
  - Accent CV level 10V
  - Trigger level 5V
  - Trigger time 1ms
  - Power consumption 83mA@+12V, 76mA@-12V
  - Module width 16HP
  - Module depth 50mm
