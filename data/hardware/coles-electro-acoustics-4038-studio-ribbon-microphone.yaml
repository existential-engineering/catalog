details: |-
  The 4038 Studio Ribbon Microphone is of British Broadcasting design (BBC) and used
  for broadcasting and recording such sounds where a clear smooth wide range frequency
  response, absent of transient distortion and relatively high sensitivity is essential.

  The 4038 has a proven reliable performance capability, being since its introduction,
  used by broadcasting networks throughout the world such as the BBC.

  The frequency response of the 4038 is exceptionally flat from 30 to 15,000 c/s and
  throughout this range the shape of the bi-directional (figure of eight) polar response
  is maintained substantially constant both in the horizontal and vertical planes, giving
  a natural smooth sonic quality textured response to sound signal being picked up.

  Studio microphones have now achieved a remarkable fidelity of reproduction. If the
  microphone is not close to perfection, there is no point in having expensive systems
  to take the sound the rest of the way to the audience's ears.

  In the world of sound, the BBC has always been the leader, and is still regarded as
  the 'setter of standards'.
specs: |-
  - Frequency response: 30–15,000 Hz (exceptionally flat)
  - Polar pattern: Bi-directional (figure of eight)
  - Polar response maintained substantially constant in both horizontal and vertical planes
  - BBC design — used by broadcasting networks worldwide
