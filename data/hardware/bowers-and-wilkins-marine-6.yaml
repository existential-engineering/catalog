details: |-
  Marine 6 is the smaller of the two Bowers & Wilkins Marine flush-mount loudspeakers, a two-way design pairing a 25mm (1in) soft dome tweeter with a 150mm (6in) polypropylene cone bass/midrange driver. It is the compact model of the pair, fitting into a mounting depth of 88mm (3.5in) behind a 200mm (7.8in) cut-out.

  Bowers & Wilkins pitches the model on weather survival, saying that whether it gets soaked, sprayed with salt water or hosed down the Marine 6 is designed to keep on bringing you superb sound, and crediting a marine-grade stainless steel chassis and grille together with polypropylene drivers for sounding great even in a storm. The speaker carries an IP66 rating when properly installed.

  The Marine 6 is a passive loudspeaker and needs an external power amplifier. Nominal impedance is 8 ohms, sensitivity is 89dB (2.83V, 1m), frequency range is 55Hz to 30kHz and Bowers & Wilkins recommends 20W to 80W of amplifier power. There is no on-board amplification and no mains connection of any kind.

  Installation is custom-install oriented and handled through Bowers & Wilkins custom installation experts, and the specifications name a C6 pre-mount kit and a 6C back box, with the back box explicitly noted as not suitable for marine applications. The shared Marine 6 and Marine 8 quick start guide dimensions the Marine 6 at a 200mm (7.8in) cut-out inside a 202mm (8in) aperture, an 84mm (3.3in) recess behind the baffle, 8mm (0.3in) of protrusion and a 243mm (9.6in) outer diameter within a 253mm (10in) clearance circle.

  Two finishes are offered, Black and White, and the speaker is quoted per pair at $1,000.
specs: |-
  - Description: 2-way system
  - Drive units: 1x 25mm (1in) soft dome tweeter, 1x 150mm (6in) polypropylene cone bass/midrange
  - Frequency range: 55Hz to 30kHz
  - Recommended amplifier power: 20W to 80W
  - Sensitivity: 89dB (2.83V, 1m)
  - Nominal impedance: 8 ohms
  - Net weight: 1.4kg (3.1lb)
  - Pre-mount kit: C6
  - Back box: 6C (not suitable for marine applications)
  - IP66 rated when properly installed
  - Marine-grade stainless steel chassis and grille, polypropylene drivers
  - Mounting depth: 88mm (3.5in)
  - Cut-out diameter: 200mm (7.8in)
  - Outer diameter: 243mm (9.6in) (quick start guide)
  - Protrusion: 8mm (0.3in) (quick start guide)
  - Finishes: Black, White
  - Passive loudspeaker: no on-board amplification and no mains connection
