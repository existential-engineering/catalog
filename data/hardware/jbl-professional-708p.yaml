description: >-
  8" bi-amplified master reference monitor for critical music recording, film
  post-production, and broadcast applications, featuring next-generation
  patented driver technologies and JBL's Image Control Waveguide for
  extraordinary output and accuracy.
details: |-
  The JBL 708P is the self-powered reference monitor for critical music recording, film post and broadcast production applications. It leverages next-generation patented driver technologies and JBL's renowned Image Control Waveguide to deliver extraordinary output, stunning detail, an expansive soundstage, and greater accuracy in a broad range of rooms. The 708P delivers several times the output of other comparably-sized studio monitors, providing significantly greater dynamic range and working distances.

  The JBL 2409H high-frequency compression driver incorporates an innovative low-mass annular diaphragm to deliver smooth response beyond 36 kHz with extraordinary output and very low distortion. The 728G low-frequency transducer leverages JBL's patented Differential Drive technology to reduce power compression for greater sustained output and extended low-frequency performance below 35 Hz.

  The JBL Image Control Waveguide ensures accuracy and neutrality while providing a wide sweet spot with increased sonic detail, enabling an acoustically seamless transition between the woofer and HF transducer. Smooth, neutral on- and off-axis frequency response allows the 708P to deliver consistent results regardless of listening position.

  A built-in dual amplification system provides 250W each to the HF and LF transducers (500W total). The system includes 192 kHz 32-bit floating-point DSP with 12 bands of Room EQ, 8 bands of User EQ, up to 18ms room delay, and up to 150ms AV sync delay.

  Analog and AES/EBU digital inputs support sample rates up to 192 kHz. An RJ-45 port provides HARMAN HiQnet network connectivity. The reinforced birch plywood enclosure includes integrated handles and multiple mounting points for post-production and mastering environments.
specs: |-
  - LF Driver: JBL 728G – 8 in (203 mm) with patented Differential Drive
  - HF Driver: JBL 2409H (low-mass annular diaphragm compression driver)
  - Dividing Network Transition Frequency: 1.7 kHz
  - Amplifier: 250W HF + 250W LF Class D (500W total)
  - Frequency Response (±3 dB): 41 Hz – 25 kHz
  - Frequency Range: 35 Hz – 36 kHz
  - Max Continuous SPL (80 Hz – 20 kHz): >108 dB SPL @ 1m
  - Max Peak SPL (80 Hz – 20 kHz): >114 dB SPL @ 1m
  - DSP: 192 kHz, 32-bit floating-point processing
  - Room EQ: 12 bands; User EQ: 8 bands
  - Presets: 6 factory, 6 user-defined
  - Room Delay: up to 18 ms; AV Sync Delay: up to 150 ms
  - Dimensions (H×W×D): 438 × 248 × 292 mm (17.25 × 9.75 × 11.5 in)
  - Net Weight: 11.5 kg (25.2 lbs)
  - Enclosure: Birch plywood, reinforced for mounting
