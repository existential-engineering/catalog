description: Requinto is a handmade 1/2 size nylon string guitar built with a solid Cedar top and Mahogany back and sides.
details: |-
  The Requinto is a handmade 1/2 size nylon string guitar built with a solid Cedar top and Mahogany back and sides. Its traditional 5-fan bracing produces a rich Spanish sound despite its reduced string length. Beautiful hand-crafted elements such as an all-natural wood rosette, Indian rosewood binding, and a lightweight gloss PU finish distinguish the Requinto from other entry-level guitars in its price range. Like all Cordoba guitars, a lightweight adjustable truss rod is built into the neck for stability.
