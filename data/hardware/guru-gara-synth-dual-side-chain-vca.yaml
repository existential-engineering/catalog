  sidechain-style ducking effects with adjustable attack and decay.
details: |-
  Sidechain VCA (Gain-Reduction VCA)

  The Sidechain VCA Eurorack PCB and Front Panel Kit is a dual voltage-controlled amplifier designed around a gain-reduction topology, operating in the opposite way of a traditional VCA. Instead of increasing level with control voltage, incoming CV or audio reduces the gain, making it ideal for sidechain-style dynamics commonly used in electronic music. Key Features

  Gain Reduction & Sidechain Behaviour

  This VCA is designed to emulate classic sidechain-style ducking techniques, where the level of one signal is reduced in response to another. An external audio signal—such as a kick drum—can be used to generate an internal control voltage, automatically reducing the gain of the main signal when the sidechain input is active. Alternatively, a control voltage or envelope can be patched into the CV input to shape gain reduction over time, allowing rhythmic pumping effects, subtle dynamic control, or creative modulation beyond traditional VCA behavior. Controls & Response

  Attack and decay controls shape how quickly the gain reduction responds and recovers, while the audio level control adjusts the depth of gain reduction when using the sidechain audio input. This allows precise tuning of the dynamic response for both subtle movement and pronounced rhythmic effects. DIY Build & Front Panel

  This DIY Eurorack VCA PCB and front panel kit is intended for intermediate builders. The front panel is made from durable PCB material and screen printed by hand, giving the finished module a distinctive and cohesive appearance within your modular system. Technical Specifications

  Skiff friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Videos
