description: Portable Bluetooth speaker with 15+ hours of playtime.
details: |-
  Willen is the mighty portable speaker that is made to go everywhere with you. A top-of-class IP67 dust and waterproof rating means it is always ready for the road, and Willen is ready to roll whenever you are with a hefty 15+ hours of portable playtime on a single charge. Designed and engineered in Sweden. Made in China.

  Marshall signature sound: built with one 2" full range driver and two passive radiators, Willen brings the heavy Marshall sound. High-fidelity Marshall tuning and solid instrument separation stand it head and shoulders above its competition.

  Iconic and rugged design: Willen brings together the iconic Marshall design with a ruggedness that dares you to push its limits. Its flexible positioning means you can stand it up, lay it down, fix it to an object or let it hang from its rubber back-mounted fastening strap.

  Built-in microphone: answer and reject calls using the front-mounted control knob and enjoy hands-free chat. The multi-directional control knob also plays, pauses, skips tracks, adjusts volume and turns the speaker on or off.

  App compatible: connect with Bluetooth 5.1 and control your music in the dedicated Marshall Bluetooth app, where three equaliser presets are available. Whenever you need to top up the battery, 3 hours of charging brings it back to full power, and 20 minutes gives 3 hours of playtime.
specs: |-
  - Driver type: dynamic
  - Frequency range: 100 to 20,000 Hz
  - Drivers: one 2" full range driver, two passive radiators
  - Power amplifiers: one 10 Watt Class D amplifier for the driver
  - Stereo/mono: mono
  - Maximum sound pressure level: 82 dB SPL at 1 m
  - Cabinet principle: sealed with passive radiator
  - Adjustable bass and treble controls: no
  - Customise sound: yes, equaliser presets in app
  - Wireless connectivity: Bluetooth 5.1
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: none
  - Top panel controls: multi-directional control knob, Bluetooth pairing button
  - Wi-Fi: no
  - Microphone system: yes
  - Voice command: no
  - Dimensions: 101.6 x 100.5 x 40.4 mm / 4 x 3.96 x 1.59"
  - Weight: 0.31 kg / 0.68 lb
  - Water resistance: IP67 dust and waterproof, tested for at least 30 minutes under 1 m of water
  - Battery type: built-in rechargeable Li-ion battery, no mains inlet
  - Play time: 15+ hours
  - Quick charging: 20 minutes charge gives 3 hours of playtime
  - Charging time: 3 hours
  - Colorways: Black and Brass, Cream
  - Country of origin: designed and engineered in Sweden, made in China
  - Compatible app: Marshall Bluetooth app (iOS and Android), with over-the-air software updates
  - Box contents: Willen speaker, USB-C charging cable, user manual and legal and safety information
