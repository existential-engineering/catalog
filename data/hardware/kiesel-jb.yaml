details: |-
  Kiesel's JB expands on the iconic J-style bass. The Kiesel design offers a natural flow from the horns to the body, not only complementing each other perfectly but shaping a comfortable body contour that is form-fitting to the player.

  The model offers classic and modern options, such as a 60s-Style Jazz Bass Bridge Pickup Position.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Scale length: 34" standard, with multiscale options of 33.5" to 34.5" and 33.5" to 35"
  - Frets: 22 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Body: alder
  - Pickups: two JVA single coil pickups
  - Electronics: 18V active/passive electronics, master volume, pickup blend, push-pull active/passive tone control, stacked concentric bass/treble frequency cut or boost
  - Bridge: Kiesel bass bridge, .748" (19mm) spacing
  - Tuners: Kiesel Guitars premium tuners, 20:1 ratio
  - Headstock: classic headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Dunlop Super Brights
  - Pickup position options include a 60s-style Jazz Bass bridge pickup position
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Dimensions: 44" to 44.25" long, 1.7" thick, 13.5" to 13.85" wide depending on configuration
  - Weight: 9.25 to 9.85 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts and in standard or multiscale layouts, configured to order; the gallery shows 4-string and 5-string builds, including a fretless build
  - Built to order with a choice of body, top, fingerboard, pickguard and finish options
