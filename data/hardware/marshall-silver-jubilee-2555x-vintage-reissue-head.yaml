description: Iconic 100W guitar amplifier head built in the UK at Marshall's Bletchley, England facility. A vintage reissue of the original 1987 Silver Jubilee, featuring distinctive silver aesthetics, switchable 100W/50W power reduction, dual channel design with Clean/Rhythm Clip and Lead modes (Crunch 1, Crunch 2), and an effects loop. Delivers the classic Marshall tone associated with the Silver Jubilee series.
details: |-
  Ideal for creating that classic 80s tone, the lead channel provides higher gain for that extra level of distortion. You can also add extra grit to your sound by using the pull rhythm clip. By engaging the power reduction feature, you can switch from 100W to 50W to suit your playing environment. Designed and engineered in UK. Made in UK.

  The dual channels on the Silver Jubilee 2555X Vintage Reissue Head offer an extended variety of tones and sounds. Each channel is customisable, allowing for distinct settings. Switching between the two channels is done seamlessly and with ease. This adaptability proves particularly helpful when exploring diverse genres of music.

  The Silver Jubilee Vintage Reissue Head gives you the flexibility to determine your preferred power level. Select between 100W and 50W power output with a simple switch, the ideal feature for transitioning effortlessly between the rehearsal room and the living room. Where you decide to take the stage is up to you.

  Add in extra grit and distortion to your sound by using the pull rhythm clip. At lower volumes you will be able to hear the higher dirty gains.

  Boasting distinctive silver aesthetics and delivering the classic Marshall tone, the Silver Jubilee has firmly secured its position in amplifier history. The Silver Jubilee Vintage Reissue Head is still expertly manufactured at the Bletchley, England facility, featuring the timeless Marshall signature details throughout.
specs: |-
  - Range: vintage reissue
  - Channels: 2
  - Technology: valve
  - Output wattage: 100W, with power reduction option to 50W
  - Outputs: 5 x 1/4-inch jack speaker outputs (16 ohm load / 8 ohm load / 4 ohm load), DI on 1/4-inch jack
  - Inputs: 1 x 1/4-inch instrument jack input, footswitch
  - Controls: input gain (pull rhythm clip), lead master, output master (pull channel), treble, middle, bass, presence
  - Effects: none
  - Effects loop: yes, 1 x series
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 4 x EL34
  - Weight: 22.1 kg / 49 lb
  - Width: 740 mm / 29.1 inches
  - Height: 315 mm / 12.4 inches
  - Depth: 222 mm / 8.7 inches
  - Country of origin: designed and engineered in UK, made in UK
  - In the box: PEDL-90003 footswitch, detachable power cable, speaker cable
  - Colour: Black
