description: >-
  The Novation Bass Station is a compact monophonic analog synthesizer with digitally controlled
  oscillators, designed for bass lines and lead synth duties with simple, intuitive controls
  and Moog-style pitch and mod wheels.
details: |-
  The Bass Station uses digitally synchronized analog oscillators to reproduce the sounds of a monophonic dual-oscillator analog synthesizer with 17 knobs, 10 switches, and 2 Moog-style pitch/mod wheels. It can faithfully reproduce analog bass sounds similar to a TB-303, Micromoog, or Pro One synthesizer.

  The small keyboard and monophonic architecture set this keyboard up for strict bassline, lead synth lines, and synth effects. MIDI continuous controller transmission is available from the pitch/mod wheels, frequency cutoff, resonance, filter modulation depth, and envelope parameters.

  Memory is limited to only 7 user patches and 1 manual patch, though external MIDI SysEx dump capability extends storage options. The Bass Station has been used by Apollo 440, RZA, and Lo Fidelity AllStars.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 DCOs with pulse and sawtooth; modulatable by Env2 or LFO
  - LFO: 1 LFO (random, triangle, sawtooth waveforms)
  - Filter: 2-pole or 4-pole switchable; 12dB resonant low-pass; modulatable by Env2 or LFO
  - Envelopes: 2 ADSR; Env1 controls VCA, Env2 controls VCF; auto-glide, single, multi modes
  - Keyboard: 25 velocity-sensitive keys (octave up/down over 8 octaves)
  - Memory: 7 user patches, 1 manual
  - Control: MIDI In/Out
releaseDate: "1993"
releaseDateYearOnly: true
