details: |-
  Ripley is a full-size replica of the Mutable Instruments Ripples 2020 filter, using the same circuit and components with identical functionality. Ripples is a liquid-sounding 4-pole analog filter with simultaneous 2-pole lowpass, 2-pole bandpass and 4-pole lowpass outputs, a resonance control that self-oscillates, and a built-in VCA on the 4-pole output. Built by hand in California. With an anodized aluminum panel, real Alpha pots and the same components as the original, it is as close as you can come in a new build. Manual: Mutable Instruments Ripples documentation
specs: |-
  - 8hp, 25mm deep — skiff friendly
  - Same circuit and components as the original
  - Anodized matte black aluminum panel (also available in silver)
  - Fully tested and calibrated before shipping
  - 2-year Calsynth warranty
