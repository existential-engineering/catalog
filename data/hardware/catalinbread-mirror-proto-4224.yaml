description: The Mirror is an experimental effects pedal that combines a clean
  swelling echo running in parallel with a powerful modulated low-pass filter.
  It features four controls — Feedback, Mix, Rate, and Depth — allowing the
  filter to sweep through the echo signal for evolving, textural soundscapes.
  Released as a limited Proto Club offering.
details: |-
  The Mirror (Proto 4224) is the fourth Proto Club release from Catalinbread Effects, built around an experimental concept pairing a swelling echo with a modulated low-pass filter running in parallel. The filter sweeps through the echo signal to create evolving, textural soundscapes.

  Feedback adjusts repeat quantity from single to infinite (self-oscillation at higher settings). Mix blends wet and dry signals. Rate controls filter oscillation speed from deep and slow to rapid. Depth sets filter cutoff frequency variance from narrow to wide.

  Limited availability window: December 2-16 only. Proto Club members receive a passport booklet and access to the Proto Portal for direct engineer feedback.
