description: A Eurorack dual vacuum-tube VCA and saturator module that can be
  used as a tube mixer or end-stage saturator, with CV control over tube grids
  and a feedback loop. This edition ships with 6J32P tubes equivalent to the
  EF86 pentode.
details: |-
  The signal routing possibilities and control offered by this module will open up a ton of usage possibilities - use it as a dual tube mixer, or an end stage saturator, for mild saturation or for severe wave-folding.
specs: |-
  - Two identical VCAs that can be connected in parallel, mono to dual mono or series.
  - Full range amplification for thick bass
  - Tubes operating at medium (yet safe!) voltages so that control voltages have a noticeable effect on tonal characteristics.
  - CV control over screen and suppressor grids for all kinds of weird modulation
  - CV controlled feedback loop
  - In-built self-patching!
  - Ships with 6J32Ps hand matched by us in-house on a uTracer 3+ !
  - Includes 12V power adapter for filaments.
