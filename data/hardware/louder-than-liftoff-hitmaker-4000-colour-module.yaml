description: The Hitmaker 4000 brings solid state British console sound to the Colour format, drawing inspiration from classic 1980s VCA console mixing amplifiers. Recreates the balanced summing architecture with a hybrid combination of a discrete quad-matched transistor input paired with carefully selected NE5534A op-amps to match vintage Signetics components.
details: |-
  Unity gain signal path with Mix Amp-inspired circuitry including VCA and summing amp. Features two selectable THD settings via jumper: Rich (enhanced 3rd order harmonics for forward, aggressive character) and Fat (increased 2nd order harmonics for rounder low end and refined top end). Includes a bypassable 8 kHz high-frequency shelving boost (+2.8 dB). Built with Panasonic bipolar capacitors matching original 1980s console specifications on a 4-layer PCB with most components on the bottom. Compatible with: Chroma 500 Series module, Mister Focus, DIY Recording Equipment (DIYRE) Colour Palette, Silver Bullet mk2, and Chroma+. Premium components from Nichicon, Panasonic, Vishay, Susumu, and Wima. All audio resistors are 0.5% or 0.1% thin-film types. High-temperature Tg 170 PCB material. RoHS compliant.
specs: |-
  - Unity gain signal path
  - Inspired by the complete the Mix Amp signal path of the vintage console including the VCA and summing amp
  - Two THD settings (via jumper): Rich and Fat
  - Rich: increased 3rd order harmonic for original console tone
  - Fat: increased 2nd order harmonic for alternate, fatter texture
  - Bypassable via jumper
  - +2.8 dB of boost
  - Recommended applications: bus sweetening, mix-ready vocal and guitar presence, snappy in-your-face drums
  - NE5534A op amps chosen for proper vintage tone closest to the famed Signetics 5534
  - Panasonic bipolar caps as originally spec'd in the 80's consoles
  - 4-layer PCB design (most parts on bottom of the PCB)
  - Analog plugin compatible with Chroma and Mister Focus
  - C-DRV knob on Chroma controls amount of drive into mix amp
  - C-MIX knob on Chroma blends effected signal with dry signal
  - If 8k Boost is enabled C-MIX knob will control the amount of boost applied
  - Compatible with DIYRE Colour
