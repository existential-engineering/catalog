description: "Big sound for small studios: The TLM 102 is Neumann's most
  affordable large diaphragm condenser microphone to date. Nonetheless it offers
  true Neumann quality, made in Germany."
details: |-
  Small size – big sound: Neumann's most affordable large diaphragm microphone

  The TLM 102 brings Neumann quality to even the smallest studio. Like its more expensive siblings, the TLM 102 combines technical excellence with a beautifully balanced sound for silky vocals, crisp guitars and powerful drums. With its cardioid pattern and an integrated pop screen the TLM 102 is a joy to use, even for novices.

  Features:
  - True Neumann quality at a very affordable price
  - Very low self-noise
  - Handles extreme SPLs without distortion
  - Integrated pop shield
  - Compact microphone with genuine Neumann large diaphragm capsule
  - Uniform cardioid pattern
  - Transformerless circuitry for high SPLs without distortion
  - Gentle treble lift for silky highs
specs: |-
  - Acoustical Operating Principle: Pressure gradient transducer
  - Directional Pattern: Cardioid
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity: 11 mV/Pa (at 1 kHz into 1 kohm)
  - Rated Impedance: 50 ohms
  - Rated Load Impedance: 1 kohms
  - Equivalent Noise Level C C I R: 21 dB
  - Equivalent Noise Level A Weighted: 12 dB-A
  - Max S P L: 144 dB (THD 0.5%)
  - Signal To Noise Ratio C C I R: 73 dB (re. 94 dB SPL)
  - Signal To Noise Ratio A Weighted: 82 dB (re. 94 dB SPL)
  - Maximum Output Voltage: 13 dBu
  - Supply Voltage: 48 V ± 4 V (P48, IEC 61938)
  - Current Consumption: 3.5 mA (P48, IEC 61938)
  - Matching Connector: XLR 3 F
  - Weight: approx. 210 g
  - Diameter: 52 mm
  - Length: 116 mm
