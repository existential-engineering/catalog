details: |-
  3340 VCO (Voltage Controlled Oscillator)

  The 3340 VCO Eurorack PCB and Front Panel Kit is a DIY voltage controlled oscillator based on the classic AS3340 integrated circuit. Designed for Eurorack format systems, this kit allows intermediate to experienced builders to assemble a powerful analog VCO with extensive modulation options and a professional finish. Key Features

  Modulation & Sound Design

  Whether you're aiming for aggressive, edgy tones or smooth and mellow sounds, the 3340 VCO offers a wide sonic range. The combination of sync options, linear FM, and precise pitch control makes this Eurorack VCO well suited for complex modulation and expressive patching. DIY Build & Front Panel

  This Eurorack PCB and front panel kit includes a clearly labeled PCB to simplify assembly and an AS3340 IC as the core oscillator component. The included front panel is made from durable PCB material and screen printed by hand, giving each module a unique and high-quality appearance. The DIY format allows for customization while maintaining reliable performance. Technical Specifications

  Skiff Friendly Module

  View Documents

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo

  Calibration
specs: |-
  - Based on the AS3340 analog VCO IC
  - Four waveform outputs: Square, Triangle, Ramp, and Sine
  - Hard Sync and Soft Sync inputs
  - Linear Frequency Modulation and accurate 1V/octave tracking
  - External CV control for pulse width modulation (PWM)
  - 10HP Eurorack format
  - Format: Eurorack
  - Width: 10HP
  - Current Draw: +12V: 15mA, −12V: 15mA
  - Depth: 25 mm
