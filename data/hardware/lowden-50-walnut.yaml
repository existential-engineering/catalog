description: A Lowden 50 Series acoustic guitar with the hardest grade of
  Mastergrade Walnut back and sides, highly responsive when paired with Sitka
  Spruce or warmer with cedar.
details: |-
  For our 50 Series Walnut guitars, we use the hardest grade of Mastergrade Walnut which often has quite a lot of figure and, if you pair it with Mastergrade Sitka spruce, the guitar will be very responsive - you wont have to dig in or play hard to get the response! If you pair it with cedar, the guitar will be slightly warmer, but the response is even faster.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Walnut back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 50 Series
  - Back and sides: Walnut
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tonewood grade: Master Grade
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
