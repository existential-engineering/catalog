details: |-
  The MG Series gooseneck system is equipped with sophisticated dual preamp circuitry – one circuit located in the capsule housing and the other built into the base of the XLR. This circuitry is internally balanced, ensuring the audio path will be isolated from hum and noise. In addition, this circuitry provides protection from RF interference and spurious emissions from cell phones and wireless GSM devices.

  The MG12, MG15, and MG18 are professional miniature gooseneck condenser microphones designed for applications such as podium, presentation, meetings, and teleconferencing. The MG condenser microphones are designed with a uniformly controlled cardioid polar pattern, helping to isolate the speaker from ambient noise. These models are also available in a hypercardioid polar pattern. With a wide frequency range of 60 Hz – 19 kHz, the MG provides natural sound with an exceptional vocal response.
specs: |-
  - Polar pattern: Cardioid (also available in Hypercardioid)
  - Frequency response: 60 Hz - 19 kHz
  - Output connector: XLR
