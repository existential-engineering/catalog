details: |-
  The EM Series EM-USB USB Condenser is a standard in pro-quality, affordable USB recording. Whether you're looking for a great-sounding and convenient mic for your home studio, live streaming, podcasts, or online content creation, the EM-USB delivers.

  This Green Lightning limited edition variant brings an exclusive colorway to the EM-USB lineup. You wear shorts in the winter. You don't settle for simple color schemes. You crave danger. You crave the unmistakable Green Lightning.

  The EM-USB features plug-and-play USB-C connectivity with no driver required, a built-in headphone output with independent volume control for zero-latency monitoring, an onboard gain control, and a convenient mute button. The cardioid polar pattern focuses on your voice and rejects off-axis noise, making it ideal for vocals, streaming, and podcasting.

  Included in the box: tripod stand, mic clip, and USB-C cable. The package also bundles Waveform OEM professional software with the DAW Essentials Bundle (16 plugins including Equaliser, Compressor, Reverber8, and Limiter) to get you producing right out of the box.
specs: |-
  - USB-C connectivity (plug-and-play, no driver needed)
  - Cardioid polar pattern
  - 16-Bit / 48kHz sample rate
  - Headphone output with independent volume control
  - Onboard gain control
  - Mute button
  - Tripod stand and mic clip included
  - Rugged construction
  - Waveform OEM software and DAW Essentials plugin bundle included
