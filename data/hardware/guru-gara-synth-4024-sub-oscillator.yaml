details: |-
  4024 Sub Oscillator

  The 4024 Sub Oscillator Eurorack PCB and Front Panel Kit is a DIY sub-octave generator designed for Eurorack modular synthesizer systems. Built around the classic 4024 CMOS IC, this module generates deep sub frequencies and provides flexible octave division for expanding the low-end of your patches. Key Features

  Sound & Application

  The 4024 Sub Oscillator divides an incoming signal into lower octaves, making it a powerful tool for reinforcing bass lines, adding weight to leads, or creating thick, layered textures. Octave switches allow quick selection of different sub-octave ranges for versatile sonic shaping. DIY Build & Front Panel

  This DIY Eurorack sub oscillator PCB and front panel kit is designed to be approachable for beginners. The module includes a high-quality PCB and a hand screen-printed front panel made from PCB material, ensuring both reliability and a distinctive visual finish. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo
