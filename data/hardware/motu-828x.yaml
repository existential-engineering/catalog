name: "828x"
manufacturer: motu
primaryCategory: audio-interface
url: https://www.motu.com/products/motuaudio/828x
description: The 828x is MOTU's most popular 28x30 audio interface upgraded with
  a thunderbolt connection to a pc. With Massive bandwidth, thunderbolt allows a
  user to connect displays, hard drives, and other peripherals to their
  computer, along with the 828x, up to six devices total (with the 828x at the
  end of the chain), and the thunderbolt bus won't even break a sweat.
details: |-
  The 828x is MOTU's most popular 28x30 audio interface upgraded with a
  thunderbolt connection to a pc. With Massive bandwidth, thunderbolt allows a
  user to connect displays, hard drives, and other peripherals to their
  computer, along with the 828x, up to six devices total (with the 828x at the
  end of the chain), and the thunderbolt bus won't even break a sweat.

  Thunderbolt combines plug-and-play convenience with massive bandwidth and low
  latency for truly professional audio interface performance.

  Highly-flexible 28-in/30-out audio interface with thunderbolt and USB
  connectivity. Easily manage complex routing configurations with cuemix fx
  software mixer.

  Built-in dsp includes high-quality reverb, eq, and compression on inputs,
  outputs, and headphone mixes. Can be used as a standalone mixer with complete
  front panel control.

  Separate xlr main outs and front-panel headphone jacks, each with independent
  volume control.
specs: |-
  - 28-in/30-out audio interface
  - Thunderbolt connectivity
  - USB 2.0 connectivity
  - 24-bit converters
  - Sample rates 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - 2 x XLR/TRS combo-style mic/guitar inputs
  - 8 x 1/4" TRS line inputs (balanced/unbalanced)
  - 2 x XLR balanced main out
  - 8 x 1/4" balanced TRS line out
  - 2 x 1/4" TRS stereo headphone
  - 16 channels adat optical at 1x sample rates
  - 8 channels smux optical at 2x sample rates
  - 2-channel toslink (optical s/pdif) up to 96 kHz
  - 2-channel rca s/pdif up to 96 kHz
  - 28 inputs and 30 outputs at 1x sample rates
  - 20 inputs and 22 outputs at 2x sample rates
  - 10 inputs and 10 outputs at 4x sample rates
  - 1 x thunderbolt (compatible with 1 and 2)
  - 1 x USB 2.0 (compatible with 3.0)
  - 1 x smpte time code in (ltc)
  - 1 x smpte time code out (ltc)
  - 1 x word clock in
  - 1 x word clock out
  - 2 x individual +48v phantom power
  - Cuemix FX software mixer
  - Built-in dsp with reverb, EQ, and compression
  - Standalone mixer with front panel control
  - Separate XLR main outs and front-panel headphone jacks with independent
  volume control
  - 2 x digital rotary encoders for phone/main volume
  - 2 x digital rotary encoders for mic trim
  - 4 x switches for pad and 48v phantom
  - 4 x digital rotary encoders for LCD control
  - 2 x 16 character LCD
  - 8 x 4-segment ladder LEDs for 1/4-inch analog in
  - 8 x activity LED for 1/4-inch analog out
  - 2 x 4-segment ladder LEDs for rca s/pdif in
  - 2 x activity LED for rca s/pdif out
  - 2 x 10-segment LEDs for mic in with v-limit
  - 2 x 5-segment ladder LEDs for main outs
  - 6 x LED sample rate indicator
  - 1 x LED lock/tach indicator
  - 2 x activity LEDs for optical bank a/b
  - 1 x activity LED for MIDI in/out
  - 1 x ac power switch
  - International 100-240v autoswitching power supply
  - 50-60 Hz, 20 watts
