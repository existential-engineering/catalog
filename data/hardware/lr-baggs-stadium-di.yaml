details: |-
  Most electric bass players are all too familiar with plugging directly into the PA and getting a flat, uninspiring sound from the speakers. The Stadium DI was designed by our bass-playing engineering team to solve that live-performance problem. With a blend of traditional and truly unique sound-shaping controls, the Stadium DI gives you a full range of features to transform your signal into a deeply expressive bass tone that fits effortlessly into any live mix.
specs: |-
  - For electric bass
  - High-Graded FET preamp
  - Controls: Volume, Gain, Attack, Growl, Comp-EQ, Fat, Drive, Pad, Ground/Lift, Engage/Bypass
  - 9V battery, 9V 500mA power supply, or 48V phantom power
  - Includes carrying case
