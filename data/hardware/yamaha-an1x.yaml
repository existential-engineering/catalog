description: >-
  Yamaha's virtual analog synthesizer from 1997, using DSP modeling to deliver classic analog tones
  with modern features like scene morphing, knob recording, and a versatile arpeggiator.
details: |-
  The AN1x arrived during the late-1990s virtual analog boom, when manufacturers were racing to recreate the character of classic analog synthesizers using digital signal processing. Yamaha's entry distinguished itself through thoughtful performance features and a sound engine that convincingly modeled the behavior of analog oscillators and filters without the tuning instability and maintenance headaches of actual analog circuits.

  At its core, the AN1x provides two oscillators per voice generating sawtooth and variable-width pulse waveforms, along with an FM mode that nods to Yamaha's heritage. The filter section is notably flexible, offering lowpass, bandpass, and highpass modes at 12, 18, and 24 dB per octave slopes, plus an additional highpass filter for sculpting the low end. Ten-voice polyphony keeps it competitive for pad and chord work, while the effects section — spanning reverb, delay, chorus, flanger, phaser, distortion, and more — provides studio-ready sound shaping without external processing.

  What set the AN1x apart from competitors was its focus on real-time control and morphing. Eight front-panel knobs invite hands-on tweaking, and their movements can be recorded directly into a patch as automation. The scene morphing system lets players store two complete parameter snapshots and smoothly interpolate between them during performance, creating evolving textures that would be difficult to achieve on a purely analog instrument. A ribbon controller adds another expressive dimension, and the arpeggiator offers dozens of rhythmic patterns plus a 16-step sequencer for melodic figures.

  Built on the same physical platform as the more consumer-oriented CS1x, the AN1x targeted serious synthesists who wanted deep programmability and analog-style immediacy. Artists including The Faint, Yes, and Phish adopted it, drawn to its combination of warm modeled tones and forward-thinking performance tools. It remains a sought-after instrument on the used market, valued for a sound character that holds up remarkably well against both its vintage inspirations and more recent virtual analog designs.
specs: |-
  - Polyphony: 10 voices
  - Oscillators: 2 per voice — sawtooth, variable-width pulse, FM mode
  - Filter: Resonant lowpass, bandpass, highpass at 12/18/24 dB per octave + additional highpass
  - Effects: Reverb, delay, 3-band EQ, chorus, flanger, phaser, enhancer, compressor, distortion, overdrive, amp simulator
  - Arpeggiator with multiple patterns + 16-step single-track sequencer
  - Scene morphing between two stored parameter sets
  - Ribbon controller and 8 real-time control knobs with motion recording
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 128 patches
  - Control: MIDI (2 parts)
  - Produced: 1997
