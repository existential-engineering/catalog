url: https://www.crownaudio.com/en-US/products/xli-1500
description: Two-channel, 450W @ 4Ω power amplifier from Crown's XLi series,
  designed as an affordable, reliable option for musicians, DJs, entertainers,
  houses of worship, discos, and pubs.
details: |-
  The XLi 1500 is a two-channel power amplifier delivering 450W per channel at 4Ω, sitting in the middle of Crown's XLi series. It targets working musicians, DJs, entertainers, houses of worship, discos, and pubs where reliable, straightforward power is the requirement.

  Inputs accept RCA or electronically balanced XLR signal with user-selectable sensitivity (0.775V or 1.4V). Outputs are provided on both Speakon and binding posts. Stereo, parallel, and bridge-mono modes cover most front-of-house and monitor wiring scenarios.

  Forced-air cooling prevents excessive thermal buildup under sustained loads, and full protection circuitry guards against shorts, no-load conditions, on/off thumps, and RF interference. Front-panel LEDs report power, signal, clip, and fault status.
specs: |-
  - 2 channels
  - 450W per channel @ 4Ω
  - Frequency Response: 20 Hz - 20 kHz, +0/-1 dB
  - THD: <0.5%, 20 Hz - 20 kHz
  - Slew Rate: >10V/μs
  - Damping Factor: >200 (8Ω, 10 Hz-400 Hz)
  - Signal-to-Noise Ratio: >100 dB (A-weighted)
  - Operating modes: stereo, parallel, bridge-mono
  - User-selectable input sensitivity (0.775V or 1.4V)
  - Forced-air cooling
  - Dimensions: 19" × 3.5" × 12.4"
  - Weight: 28 lbs
  - Power: IEC inlet (15A)
