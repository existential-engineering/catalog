details: |-
  The D-45 1937 Project 91-5 is part of Martin's Project 91 collection, a remarkable group of 91 limited-edition guitars, each faithfully tied to a specific pre-war D-45 serial number. This instrument recreates the legendary 1937 D-45 with period-correct construction and ornamentation.

  The guitar features a D-14 Fret (1937) body with an Adirondack Spruce top with VTS (Vintage Tone System) finished in natural gloss. Back and sides are crafted from Brazilian Rosewood with a thin finish gloss, joined by a dovetail neck joint. The forward-shifted X-bracing is hand-shaped and scalloped in period-correct fashion, also using Adirondack Spruce with VTS.

  The Genuine Mahogany neck has a period-correct Barrel & Heel shape with standard taper and a 25.4-inch scale length, joining the body at the 14th fret with 20 total frets. The Ebony fingerboard measures 1 3/4" at the nut and 2 1/4" at the 12th fret, decorated with period-correct solid abalone 45 snowflake inlays. Waverly Gold tuning machines and a bone nut complete the headstock, which features a period-correct solid/6 string diamond shape with Brazilian Rosewood headplate and solid abalone CFM block logo.

  The Ebony bridge features the period-correct belly style with 2 5/16" string spacing, faux ivory pins with 4.8mm abalone dots, a period-correct non-compensated long bone saddle with 16" radius. Ornamentation includes a solid abalone top inlay with multi-stripe, period-correct solid abalone 45-style rosette, grained ivoroid binding, and underfinish faux tortoise pickguards (qty. 2).

  The guitar ships with a 5 Ply D-14F Harptone case, Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium strings (pre-strung), a Certificate of Authenticity (#5, SN: 65265), and a framed commemorative poster.
