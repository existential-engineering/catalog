description: >-
  A fully polyphonic preset analog keyboard from Korg with seven orchestral sounds, a dedicated
  control mode for custom synthesis, and a separate oscillator for each of its 60 keys.
details: |-
  Produced from 1976 to 1979, the Korg Polyphonic Ensemble P (also sold as the PE-1000 by Korg and the K-4 by distributor Unicord) was a preset-based analog instrument aimed at keyboardists who wanted orchestral textures without the complexity of programming a full synthesizer.

  The instrument offered seven preset sounds including strings, pipe organ, brass, piano, electric piano, harpsichord, and clavichord. Beyond the presets, a Control mode opened up the filter and envelope parameters for custom sound design. With a dedicated oscillator for each of its 60 keys, it achieved full polyphony, making it one of the few truly paraphonic synthesizers of the 1970s.

  The control surface featured resonant lowpass and highpass filters (branded as the "Traveler"), along with attack, decay, and sustain envelope controls. A single LFO provided vibrato with adjustable depth and speed. Portamento (glide) was available via a dedicated pedal input, and a damper pedal connection added expressive sustain control.

  Released alongside its sibling, the Polyphonic Ensemble S (PE-2000/K-5), the instrument was manufactured in Japan by the Keio Organ Company. It found its way into the hands of prominent electronic musicians including Vangelis and Jean-Michel Jarre, who incorporated its rich ensemble textures into their landmark recordings.
specs: |-
  - Polyphony: Full 60 notes
  - Oscillators: 1 VCO per note
  - LFO: 1 with vibrato depth and speed
  - Filters: 1 resonant lowpass, 1 resonant highpass ("Traveler")
  - Envelope: Attack, decay, sustain
  - Effects: Portamento (glide)
  - Keyboard: 60 keys
  - Memory: None
  - Control: Traveler expression, damper pedal, glide pedal
releaseDate: "1976"
