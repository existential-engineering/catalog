description: The StarCrash Fuzz is a silicon-based fuzz pedal inspired by 1970s
  Fuzz Face designs, modernized with a Bias control that shapes texture from
  full and throaty to sputtery and velcro-esque, plus a Low-Cut filter for bass
  frequency shaping. The standard fuzz knob was omitted since most players maxed
  it out anyway.
details: |-
  The StarCrash Fuzz reimagines the classic Fuzz Face circuit with silicon transistors. The Fuzz knob was removed since most players maxed it out anyway. The Bias control simulates battery degradation to shape fuzz character: minimum yields full and throaty tone, noon matches standard Fuzz Face bias, and maximum creates sputtery velcro-like texture.

  The Low-Cut filter acts as a high-pass filter for bass frequency shaping, ranging from approximately 30Hz (minimum, essentially inactive) to 500Hz (maximum). Output volume is boosted to compensate for level loss from other controls. Requires standard 9V DC center-negative only; AC or center-positive supplies void the warranty.
