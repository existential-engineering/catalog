description: An expanded pedal-format studio preamp, EQ, overdrive, distortion,
  fuzz, and DI box inspired by Neve console circuitry, adding EQ shift knobs,
  Hi/Lo headroom switch, 48V phantom power, and an output transformer over the
  V1.
details: |-
  In 2012, Josh Scott had a crazy idea for a tone shaping device that had never been done before in the world of guitar pedals — to create an effects pedal that replicated the hard-to-achieve sounds of 'direct-in' electric guitar recordings. In 2014 the Colour Box was demoed at Abbey Road Studios in London. It became a full-fledged studio-grade preamplifier, EQ, and distortion generator with multi-instrument compatibility, heard on recordings by U2, Wilco, The National, Spoon, Collective Soul, Muse, the War on Drugs, Phantogram, and others.

  The V2 retains all V1 functionality and adds: an output transformer, safe 48V phantom power pass-through, EQ Shift knobs for precision EQ control, a Hi/Lo switch for ultra-clean headroom, 100% available clean signal on acoustic guitar, silent switching (no switch-pop), and runs on standard 9V DC negative power.

  Gain section (red): Master volume, Pre-Vol (gain/drive between two internal gain stages), and Step control (five gain stages: +18, +23, +28, +33, +39 dB). Hi/Lo switch controls clean headroom. -20dB pad switch (XLR input only).

  EQ section (blue): Treble (+/-15dB, flat at noon), Middle (+/-10dB, flat at noon), Bass (+/-15dB, flat at noon), each paired with a Shift knob (Treble Shift 2kHz-30kHz, Middle Shift 150Hz-2.4kHz, Bass Shift 20Hz-440Hz). Hi-Pass filter (toggle + knob, 2nd order 12dB/octave, 160Hz-650Hz).

  Input: combination XLR and 1/4" jack, selected via INST/XLR switch on right side.
