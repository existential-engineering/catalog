details: |-
  The Dual Band Compressor is a compression pedal for bass. Rather than standard single-band compression, it splits the signal into high and low frequency bands and applies compression independently to each, with fast attack and decay for the high frequencies and slow attack and decay for the deep bass. This lets the player fine-tune a punchy sound to exact requirements, increasing sustain, smoothing out dynamics, adding definition or boosting volume. An Ashdown VU meter combined with the input level knob helps find the sweet spot for both active and passive basses, and the output level control balances the effect against the true-bypass level. The pedal is built tough with a metal casing, premium controls, recessed knobs and kickguards.
specs: |-
  - High pass filter frequency: 225Hz, roll-off 12dB/octave
  - Low pass filter frequency: 900Hz, roll-off 12dB/octave
  - Composite crossover point: 350Hz
  - High compression: attack 1ms, decay 70ms, max ratio 8:1
  - Low compression: attack 22ms, decay 122ms, max ratio 8:1
  - Input impedance: 470k ohms, signal level -10dBv to 0dBv
  - Output impedance: 10k ohms, variable signal level -10dBv to 0dBv
  - Ashdown VU meter with input level control
  - Output level control
  - True bypass switching
  - Power: internal 9V battery or external 9V DC adaptor (centre pin negative)
