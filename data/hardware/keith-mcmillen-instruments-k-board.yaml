details: |-
  K-Board-C is a compact, portable MPE MIDI keyboard controller for producers and performers. It connects to a computer or mobile device over USB-C and works as a class-compliant USB MIDI device with music software.

  Its 25 touch-sensitive keys detect velocity, pressure and per-key tilt, so note, aftertouch and tilt data can be sent for expressive playing without any moving parts under the keys.

  The enclosure is ABS polycarbonate and is offered in five colours: Snow, Galaxy, Orchid, Lime and Aqua.
specs: |-
  - 25 touch-sensitive keys detect velocity, pressure, and per-key tilt
  - MPE compatible
  - Connects to a computer or mobile device over USB-C
  - USB bus powered, no external power supply
  - ABS polycarbonate enclosure
  - Five colours: Snow, Galaxy, Orchid, Lime, and Aqua
