description: The DCX Bass reimagines a classic studio preamp as a tone-shaper
  and drive pedal for bass guitar, with a wide range of clean and overdrive
  tones, EQ frequencies optimised for the instrument, and Adaptive Circuitry
  providing a treble response that reacts to playing dynamics.
details: |-
  The greatest pieces of studio gear are the ones that add something special to the sound of an instrument, going beyond the job they were designed for and enhancing anything that passes through the circuit. One such piece is the UA 610 preamp, which was the inspiration for the DCX Bass.

  The DCX Bass's EQ and OD modes provide a massive range of gain, ranging from clean boosts and direct-to-console sounds, through to edge-of-breakup and low gain drives, all the way to almost fuzz-like tones. It does all this with the ability to stay completely flat all the way across the frequency spectrum, just like a great recording preamp.

  In EQ mode, Adaptive Circuitry allows the top end response to stay completely flat with the pedal set clean, with a subtle treble roll-off gradually increasing as the tone begins to overdrive. When in OD mode, this top end roll-off is always active.

  The VOICE switch selects between three different amounts of treble roll-off. The L.F. and H.F. knobs give precise control over bass and treble at frequencies specifically chosen for bass guitar.

  The DCX Bass is the kind of pedal that really lets the player find their own use for it, from high-fidelity clean boosts to full-on retro saturation.
