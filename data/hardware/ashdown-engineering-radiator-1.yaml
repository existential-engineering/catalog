url: https://ashdownmusic.com/products/radiator-1
description: For the acoustic musician on the move, the Ashdown Acoustic
  Radiator 1 combines a 100-watt bridged power section, a fully-featured
  two-channel preamplifier, and an 8" driver with a dual tweeter array in a
  compact, portable cabinet. Facilities include a switchable input for active
  and piezo pickups with a phase switch, an XLR mic input with switchable
  phantom power, bass and treble controls with a shape switch, a switchable
  variable notch filter for feedback control, and an all-new digital reverb. The
  rear panel adds a balanced XLR DI output, an FX loop, and a line/link output.
  Available in cherry or black vinyl.
details: |-
  100-watt bridged combo for acoustic instruments, pairing a fully-featured preamplifier with an 8" driver and dual tweeter array. Two channels offer a switchable input for active and piezo pickups with a phase switch to eliminate standing-wave feedback, an XLR mic input with switchable phantom power, bass and treble controls with a shape switch for an instant optimum acoustic-guitar EQ setting, a switchable notch filter with variable frequency to tune out feedback, and a digital reverb. Rear-panel facilities include a balanced XLR DI output for recording or PA connection, an FX loop, and a line/link output. Available in cherry and black vinyl.
specs: |-
  - Power output: 100 watts (bridged)
  - Speaker configuration: 1 x 8" driver with dual tweeter array
  - Channels: 2
  - High instrument input: impedance 3.9M Ohms, input range 150mV to 10V p-p
  - Low instrument input: impedance 600 Ohms balanced, level -20dB to 0dB
  - Mic input: XLR with switchable phantom power
  - Line output: impedance 4.7k Ohms, level 0dBu
  - DI output: impedance 600 Ohms balanced, level -20dBu
  - Tuner output: impedance 22k Ohms, level 0dBu nominal
  - Output impedance: 4 Ohms
  - EQ: +/-15dB @ 100Hz and 10kHz
  - Effects send: impedance 10k Ohms, level 0dBu
  - Effects return: impedance 47k Ohms, level 0dBu
  - Notch filter: frequency 70Hz to 350Hz, 'Q' = 5
  - Switchable input for active/piezo pickups with phase switch
  - Shape switch and switchable notch filter
  - Digital reverb
  - Available in cherry and black vinyl
  - Dimensions (H x W x D): 440 x 490 x 325 mm
  - Weight: 11kg
