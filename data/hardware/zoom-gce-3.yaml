description: The ZOOM GCE-3 is a compact USB audio interface that puts ZOOM
  Guitar Lab's endless collection of guitar effects, amps and cabinets at your
  fingertips whenever and wherever inspiration strikes.
details: |-
  The GCE-3 Guitar Lab Circuit Emulator is a compact USB audio interface that puts Zoom Guitar Lab's collection of guitar effects, amps and cabinets at your fingertips. Small enough to fit in the pocket of a gig bag or backpack, the bus-powered unit is aimed at capturing ideas in the studio or on the go. Its panel is styled like a Zoom multi-effects pedal, but the page notes that all GCE-3 panel controls are for aesthetic design only and the unit is controlled from the connected computer.

  A built-in DSP processor handles the effects rather than the host, which takes the processing load off the computer and lets guitar tones be dialled in and recorded with near zero latency. Signal processing is 32-bit, with 24-bit 128x oversampling A/D and D/A conversion at a 44.1 kHz sampling frequency.

  Recording runs to the computer over USB-C. The AUX input plays external backing tracks straight to the headphones while only the guitar is recorded to the computer, which suits practice sessions, and a dedicated thumbwheel sets headphone volume. The input jack accepts a standard guitar cable and the stereo headphone output is a 3.5 mm mini jack.

  The free Zoom Guitar Lab app for Mac and Windows gives access to the same library of amp models, artist effects and patches available for all of Zoom's G-series pedals, and the DSP emulates the circuits of the G5n, G3n, G3Xn, B3n, G1 FOUR, G1X FOUR, B1 FOUR and B1X FOUR. Firmware v1.10 added A1 FOUR and A1X FOUR emulation. A Clipboard function memorizes up to four effects with custom parameters for copying and pasting onto other patches, the NEWS section carries downloadable patches, and the EFFECTS tab lists classic and boutique effects.

  The unit measures 80 mm deep by 106 mm wide by 29 mm high and weighs 90 g. It takes USB bus power over the Type-C port or 5 V DC through a separate Micro-B socket, and ships with a non-slip pad, a type A to C USB cable and the operation manual.
specs: |-
  - Sampling frequency: 44.1 kHz
  - A/D conversion: 24-bit 128x oversampling
  - D/A conversion: 24-bit 128x oversampling
  - Signal processing: 32-bit
  - INPUT: standard mono phone jack, rated input level -20 dBu, input impedance (line) 470 kohms
  - AUX IN: stereo mini jack, rated input level -10 dBu, input impedance (line) 1 kohm
  - PHONES: stereo mini jack, maximum output level 15 mW + 15 mW (typ. 32 ohm load)
  - Input S/N: 120 dB (typ)
  - Noise floor (residual noise): -96 dBu (typ)
  - USB: USB Type-C connector, USB 2.0
  - Power: USB bus power (Type-C) or 5 V DC power supply (Micro-B)
  - External dimensions: 80 mm (D) x 106 mm (W) x 29 mm (H)
  - Weight: 90 g
  - Built-in DSP processing for circuit emulation of the G5n, G3n, G3Xn, B3n, G1 FOUR, G1X FOUR, B1 FOUR and B1X FOUR
  - Dozens of effects including distortion, overdrive, EQ, compression, delay, reverb, flanger, phaser and chorus
  - Free Zoom Guitar Lab software for Mac and Windows for creating, editing and managing patches
  - Clipboard function memorizes up to four effects with custom parameters
  - All panel controls are for aesthetic design only. The unit is controlled over the computer connection
  - System requirements, Windows: Windows 8.1, 10 or 11 (32-bit/64-bit), Intel Core i3 or faster, USB 3.0 or USB 2.0
  - System requirements, Mac: Mac OS X 10.11 to macOS 15, Intel Core i3 or faster, USB 3.0 or USB 2.0
  - Operation is not guaranteed with Atom, Celeron or Pentium series CPUs or CPUs made by AMD, and only USB host controllers with Intel chipsets are supported
  - In the box: GCE-3, non-slip pad, USB cable (type A to C), operation manual
  - Note: 0 dBu = 0.775 V
