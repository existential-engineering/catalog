details: |-
  The Klipsch Detroit portable Bluetooth speaker channels Detroit's legacy of defiant rhythm and iconic soul. Its driver configuration — dual 1" tweeters paired with dual 3" woofers — is tuned to deliver full-range audio with the character of a live concert experience wherever you take it.

  Connectivity is handled by Bluetooth 5.3 true wireless technology with a 40-foot range, enabling seamless stereo playback between two Detroit units. Broadcast Mode extends this further, supporting synchronized playback across 10 or more compatible Klipsch speakers at once. A built-in microphone supports hands-free calls.

  The Klipsch Connect Plus app provides EQ customization across bass, mid-range, and treble frequencies. Battery life is rated at 20 hours per charge, with 18W USB-C input charging. A reverse USB-C output (10W) lets the Detroit charge other compatible devices.

  Built for outdoor and mobile use, the Detroit carries an IP67 rating — fully dustproof and submersible up to one meter for 30 minutes. A removable carrying strap is included.
