description: First in the NF series to adopt an aluminum die-cast body. The NF04R is a compact 2-way active monitor speaker featuring a newly designed 4-inch (100 mm) HR-shaped woofer and a 19 mm soft dome tweeter with UFLC diaphragm. The cabinet is an aluminum die-cast enclosure tuned with a bass reflex port, delivering tight, high-speed bass that transcends its size. A bi-amplified D-class amplifier section drives the woofer with 30 W and the tweeter with 20 W. Low-frequency, tweeter level, and input gain switches let the user tailor the monitor to its acoustic environment and to the level of connected sources.
details: |-
  Tagline: First in the NF series to adopt an aluminum die-cast body. The 4-inch HR-shaped woofer unit is mounted.

  Features:
  - Smallest 4-inch (10 cm) HR-shaped woofer unit in the NF Series, delivering tight, high-speed bass that transcends its size.
  - UDR Tangential Edge and Push-Pull Damper eliminate reverse resonance of the edge, resulting in a highly linear and responsive mid-low range.
  - 19 mm soft dome tweeter with UFLC (urethane film laminated to cloth) diaphragm for high tracking and reproducibility of micro-signals; magnetic fluid in the magnetic circuit ensures stable operation over long periods of use.
  - Bi-amplified design driven by a high-performance D-class amplifier with 30 W for the woofer and 20 W for the tweeter.
  - Adjustable sound pressure level to suit the listening environment: low-frequency characteristics can be attenuated by -2 dB, -4 dB, or -6 dB; tweeter level can be attenuated by -2 dB; input GAIN can be switched between 0 dB and +10 dB to match external audio equipment.
  - Aluminum die-cast enclosure (a first for the NF series).
