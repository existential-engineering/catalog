description: First in the NF series to adopt an aluminum die-cast body. The NF04R is a compact 2-way active monitor speaker featuring a newly designed 4-inch (100 mm) HR-shaped woofer and a 19 mm soft dome tweeter with UFLC diaphragm. The cabinet is an aluminum die-cast enclosure tuned with a bass reflex port, delivering tight, high-speed bass that transcends its size. A bi-amplified D-class amplifier section drives the woofer with 30 W and the tweeter with 20 W. Low-frequency, tweeter level, and input gain switches let the user tailor the monitor to its acoustic environment and to the level of connected sources.
details: |-
  The first compact active speaker in the NF series, and the first to adopt an aluminum die-cast body. The 4-inch (10 cm) HR-shaped woofer unit is the smallest in the NF Series and delivers tight, high-speed bass that transcends its size. UDR Tangential Edge and Push-Pull Damper are used to eliminate reverse resonance of the edge, resulting in a highly linear and responsive mid-low range.

  A soft dome tweeter with UFLC diaphragm provides high tracking and reproducibility of micro-signals. Magnetic fluid is used in the magnetic circuit to ensure stable operation over long periods of use. UFLC is a diaphragm made of polyurethane resin with urethane film laminated to a cloth material, allowing faithful reproduction of audio signals with natural extension to high frequencies.

  The speaker units are driven by a high-performance D-class amplifier with 30 watts for the woofer and 20 watts for the tweeter in a bi-amplified system.

  Sound pressure level is adjustable to suit the listening environment: low-frequency characteristics can be adjusted to -2 dB, -4 dB and -6 dB, tweeter level to -2 dB, and GAIN can be switched between 0 dB and +10 dB according to the output level of external audio equipment.

  HR (HP ROTATION) is a circumferential rotation of the HP (HYPERBOLIC PARABOLOIDAL) shape known in building structural mechanics. The shape is lightweight and highly rigid and disperses resonance caused by split vibrations, since only shear forces act as internal stresses. UDR (UP/DOWN ROLL) Tangential Edge combines up-roll and down-roll in a tangential plane, shaped from FEM modal analysis. Optional accessories include the SN04 speaker grille and the EB-6301 wall mounting bracket.
specs: |-
  - Enclosure type: 2-way bass reflex
  - Units: 100 mm HR shape woofer, 19 mm soft dome tweeter
  - Frequency response: 57 Hz to 36 kHz
  - Internal volume: 2.8 L
  - Amplifier rated output: woofer 30 W, tweeter 20 W
  - Input connector: XLR-3-31 type (No.2 HOT, balanced) / 6.3 mm (1/4 inch) TS phone (unbalanced) combo jack
  - Rated input level: -10 dBV (TS phone) / +4 dBu (XLR) with GAIN SW 0 dB; -20 dBV (TS phone) / -6 dBu (XLR) with GAIN SW +10 dB
  - Input impedance: 20 kohm min.
  - Volume: -infinity to 0 dB
  - LO FREQUENCY (80 Hz): 0 / -2 / -4 / -6 dB
  - Tweeter level: 0 / -2 dB
  - Gain: 0 / +10 dB
  - External dimensions: 120 (W) x 189 (H) x 157 (D) mm (excluding protrusions)
  - Weight: approx. 3.1 kg
  - Power supply (AC IN): 100 V, 50/60 Hz
  - Power consumption: 30 W
  - Aluminum die-cast enclosure
