description: MicroFreak Stellar is a limited edition of an acclaimed
  experimental synth that combines digital oscillators with an analog filter,
  boundless modulation with musical expression, and a sleek black finish with
  quirky space-age graphics - primed for your interplanetary sonic voyage.
details: |-
  Launched alongside microfreak stellar is another free firmware update for all microfreak users, introducing user sample import, a sampler engine and 3 granular engines.

  Microfreak stellar & the v5 firmware update brings 21 different oscillator modes to the table, so you can go bigger, deeper, and weirder with your sound than ever before.

  Beneath its space-age exterior, youll find sparkling digital and wavetable oscillators collide with a velvety analog filter. A unique poly-aftertouch pcb keyboard combines with a distinctly freaky arpeggiator & sequencer. Bathe your mix in sonic hysterics with the erratic mod matrix or the unique spice & dice randomizers.

  Microfreak is the hybrid desktop synth that refuses to stop evolving and continues to inspire with every update.
specs: |-
  - 21 digital oscillator modes
  - Wavetable synthesis
  - Sample playback
  - Granular processing
  - Mutable instruments engines
  - Noise engineering engines
  - Vocoder mode
  - Analog state variable filter
  - 12db/octave
  - Low pass
  - Band pass
  - High pass
  - Self-oscillating filter
  - LFO with sync
  - Sine
  - Triangle
  - Sawtooth
  - Square
  - Random
  - Slew
  - Cycling envelope
  - Monophonic mode
  - Paraphonic mode
  - Unison mode
  - Up to 4 voices
  - Chord mode
  - Scale quantize
  - 25-key capacitive keybed
  - Polyphonic aftertouch
  - Capacitive touch strip
  - OLED display
  - Polyphonic sequencer
  - 4 modulation tracks
  - Arpeggiator
  - Up mode
  - Order mode
  - Random mode
  - Pattern mode
  - Spice & dice gate randomizers
  - 2 patterns per preset
  - 4 automation tracks per preset
  - Modulation matrix
  - 5 modulation sources
  - 7 destinations
  - 3 custom destinations
  - 512 preset slots
  - 320 factory presets
  - 3.5mm headphone output
  - Trrs-compatible headphone output
  - Microphone input
  - 1/4 inch master output
  - Balanced line-level output
  - 3.5mm clock input
  - 3.5mm clock output
  - 24 ppq clock
  - 48 ppq clock
  - 2 ppq clock
  - Single pulse per step
  - MIDI in
  - MIDI out
  - 3.5mm MIDI connections
  - MIDI breakout cables included
  - CV outputs
  - Gate outputs
  - Pressure outputs
  - USB power
  - Psu included
  - Size: 55 x 311 x 233 mm
  - Weight: 1.02 kg
