description: Octagonal LFO with phase shift and CV control.
details: |-
  The Black OCTASOURCE is an LFO carried to its extremes. It features one of 8 waveforms available on 8 outputs phase shifted by 45 degrees, or all 8 waveforms simultaneously on all outputs, which turns a single modulation source into eight synchronized channels.

  Waveform selection, phase shift and LFO rate are all CV controlled, with dedicated phase shift, wave select and FM inputs, and the rate can be synched to an external clock signal. The direction of the phase shift is selected manually, and a freeze function holds the LFO where it stands.

  Morphing is available between the 8 waves rather than only switching, so the shape can be swept as part of a patch, and bipolar output signal level LEDs show what each of the eight channels is doing at a glance.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first.

  The LFO rate runs from 0.03Hz to 30Hz, output amplitude is 10V peak to peak and a full CV sweep is -5V to +5V. The panel is 12HP wide at a depth of 25mm, and power draw is 82mA on the positive rail against 44mA on the negative one.
specs: |-
  - LFO with manually and CV controlled rate
  - Manual selection of phase shift direction
  - 8 simultaneous outputs
  - Synchronization to an external clock
  - LFO freeze function
  - 8 waves with morphing between them
  - Phase shift, wave select and FM CV
  - Bipolar output signal level LEDs
  - LFO rate 0.03Hz - 30Hz
  - Output signal amplitude 10Vptp
  - CV input (full sweep) -5V - +5V
  - Power consumption +82mA, -44mA
  - Module width 12HP
  - Module depth 25mm
