description: The Empress Tape Delay is a compact digital delay that emulates
  rich, lush tape echo, with three tape-age flavors, filter and modulation
  controls, an analog dry path, tap tempo with ratio multiplier and presets
  recalled at the touch of a button.
details: |-
  The Empress Tape Delay delivers rich, lush tape-style echo in an unusually small enclosure. Three flavors of tape age let you dial how dark and gritty the repeats become, while filter and modulation controls allow further fine-tuning. Tap tempo with a ratio multiplier puts rhythms like dotted eighths at your fingertips.

  An analog dry path keeps the direct signal clean, and the pedal is packed with features accessible from an advanced configuration mode. Presets store all your settings and recall at the touch of a button for fast, easy switching live. Activating blips produces wild sounds when you move the tape head while playing.

  It supports true bypass or buffered bypass with trails, using a relay for quieter switching that also passes signal if the pedal loses power.
specs: |-
  - 3 tape-age flavors for darker, grittier repeats
  - Delay time 5 ms - 2.8 s
  - Analog dry signal path
  - Filter (hi-pass or low-pass) on the delayed signal
  - Adjustable modulation (none to heavy)
  - Blips mode for tape-head manipulation sounds
  - Presets: run with 0, 2 or 3 presets (advanced configuration)
  - Tap tempo with ratio selection
  - Relay bypass: quieter switching, passes signal on power loss; true bypass or buffered bypass with trails
  - Signal-to-noise around 102.7 dB, THD 0.40%
  - Input impedance 1 MOhm, output impedance 1 kOhm, frequency response 8Hz-18.5kHz (-3dB)
  - Power: 9 - 18 V DC (negative tip), 2.1mm barrel, ~280 mA
  - Die-cast aluminum enclosure, approx. 4.5" x 3.5" x 1.5", 1 lb
