details: |-
  The TC Electronic MAHI DRIVE is part of TC's mini pedal series — compact format, tour-grade construction, focused on doing one job exceptionally well. A distortion/overdrive pedal designed to fit the tightest pedalboard slots. True-bypass switching keeps your dry signal pristine when the pedal is off. Standard 9V DC power input compatible with common pedalboard PSUs. Heavy-duty die-cast metal housing built to survive years of stage use. Top-mounted jacks save horizontal pedalboard real estate. Behringer's parent group's TC Electronic line brings serious effects voicing to working musicians at a price that respects the budget. Visit tcelectronic.com for current specifications and audio demos.
