description: A limited edition OCD overdrive pedal finished in metallic gold,
  available in OCD V2 or OCD-Ge clipping diode variants offering slightly
  different dynamic and tonal characteristics.
details: |-
  OCD "Gold Standard" – Custom Shop Limited Edition

  The OCD has shaped the sound of countless records and stages for nearly two decades. This Limited Edition Gold Standard release elevates the classic with a refined aesthetic worthy of its reputation. The enclosure is finished in a Ultra-Premium Metallic Gold Finish paired with glass high-gloss text for maximum visual impact. Features

  OCD V2 or OCD-Ge? Both pedals share the same core OCD circuit, but the feel and response are distinct. OCD V2 delivers the familiar open, dynamic overdrive with strong note separation, tight low end, and excellent headroom. It feels immediate, punchy, and articulate, making it extremely versatile across a wide range of amps. OCD-Ge features germanium clipping diodes, giving it a softer attack, smoother top end, and a slightly more elastic feel under the fingers. It breaks up a bit earlier and has a touch more harmonic bloom, especially at lower to mid gain settings. If you want firm response and clarity, choose the V2. If you prefer warmth, softness, and a more vintage style feel, the Ge is the move. And if you have ever stacked two drives before, you already know the real answer might be both. Don't miss your chance to own one of the most striking OCDs ever produced.
