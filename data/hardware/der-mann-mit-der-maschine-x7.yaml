description: The X7 is a Eurorack expander module for the DROID system that adds
  MIDI and USB connectivity plus four gate outputs, supporting polyphonic MIDI
  in and out via DIN, TRS and USB.
details: |-
  Welcome to the DROID X7 expander. The X7 gives you USB and MIDI connectivity for your master and also four gate outputs with modular levels. You can process incoming and generate outgoing MIDI streams, both via classical DIN cables and via USB. Both the in and the out direction support polyphony with eight or even more voices in parallel. For size reasons the X7 uses 3.5 mm TRS jacks for MIDI instead of the classical DIN jacks. But it comes with two DIN to TRS adapters, so you are free to use either form factor. As a bonus feature, the X7 provides super fast loading of DROID patches via USB - without any need for putting the SD card in and out anymore. If you use the DROID Forge, deploying a new patch to your master just needs one single mouse click. Here are some examples of what you can do with the X7:

  The X7 comes with:

  Current Draw: 94 mA +12V | 0 mA -12V | 0 mA 5V

  Width: 4 HP

  Depth: 23 mm

  Link to the X7 MIDI and USB Expander on ModularGrid
specs: |-
  - Attach an external keyboard to your modular.
  - Use an external hardware sequencer for playing melodies and beats in your modular.
  - Use an external MIDI controller to influence your DROID patch.
  - Do the same with a MIDI controller app on your tablet or phone (via USB).
  - Use your modular for playing polyphonic music and beats on your hardware synths or software synth plugins in your DAW, tablet or phone.
  - Connect two DROIDs (both with X7) and exchange real time CVs and triggers.
  - Use the four additional gate outputs on the X7 for sending clocks, gates and triggers and free your valuable CV outputs for other things.
  - Access the SD card in your master just like a USB stick for direct access to it via your PC, Mac, phone or tablet.
  - Alternatively load new patches to your master via MIDI sysex from your PC - and get your new patch ideas up and running in less than a second.
  - one USB-A to USB-C cable (ca. 2m)
  - two DIN to 3.5 mm TRS MIDI adapters
  - a ribbon cable for connecting the X7 to your master
