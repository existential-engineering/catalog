details: |-
  The Friedman 4x12 Cabinet is a 4x12 inch, closed-back speaker cabinet which utilizes tongue and groove Baltic birch construction to deliver the bass, mid response and great sound expected from a Friedman cab.

  At the heart of the cab are two 16 ohm Celestion G12M-25 Greenback speakers placed strategically in the top two speaker slots of the cabinet. The G12M Greenback has evolved over the decades but still retains its essential sought-after tone. This model is voiced with additional broad mid-range attack and restrained top-end, giving a forward, punchy attitude to chords and a searing lead tone without fizz, and it brings drive and definition to modern high-gain amps.

  Loaded in the two bottom slots are two Celestion Vintage 30 speakers. The V30's sound has been captured on thousands of recordings from a diverse range of notable players. It features enormously detailed and complex overtones, a warm low-end, a famously rich vocal mid-range and a beautifully detailed top-end, so the cab delivers an intricate Vintage 30 crunch and reveals the complexities found in hand-wired boutique amps.

  The combination of these two different speaker models provides the warmth of the Greenbacks and the power and thump of the V30's, creating a speaker cabinet that is a match for the Friedman BE100 amplifier. As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, capturing every ounce of valuable tone. The cabinet is handcrafted in the U.S.A. and designed to withstand the rigors of the road.
specs: |-
  - 4 x 12 inch closed back speaker cabinet
  - 2 x Celestion G12M-25 Greenback 16 ohm speakers in the top two slots
  - 2 x Celestion Vintage 30 speakers in the bottom two slots
  - Tongue and groove Baltic birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Handcrafted in the USA
  - Dimensions: 14 in (L) x 30 in (W) x 30 in (H)
  - Weight: 86 lbs
  - Passive cabinet, no mains power connection
