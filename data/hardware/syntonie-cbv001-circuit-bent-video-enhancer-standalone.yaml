details: |-
  This listing is for the module + enclosure, making it standalone (no Eurorack case and power required). The module alone can be found here . CBV001 is a circuit bent video enhancer meant to process Composite video. It generates effects ranging from soft color shifts to heavy distortion, with a CV input and attenuator allowing to control the contrast with an external control voltage. NTSC/PAL compatible. Assembled standalone, module comes into an enclosure with a +12V DC wall wart. Documentation
