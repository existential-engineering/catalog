description: Hands on drum machine with 7 sample-based voices
details: |-
  The Bullfrog Drums is a versatile instrument, a drum machine, a sampler and a CV/gate sequencer, all optimized for a learning path in drum programming, sampling techniques, working with samples and integrating into various performance setups.

  Because it has sample-based voices, the instrument is not limited to percussion sounds. Samples can be made of any sound, from an abstract noise or a chord stab to drones and beyond.

  The Bullfrog Drums has a hands-on interface built into a signature Erica Synths aluminium enclosure and will feel intuitive to use in any setup, whether in the studio or on stage.

  Seven sample-based drum voices draw on seven banks of factory samples by Richie Hawtin and the Erica Synths team, with room for up to 16 banks of user samples in 64 Mb of total sample memory. A line input and a built-in microphone allow sampling, each voice has its own level control and seven parameters for sample sound design, and memory can be backed up over USB-C.

  The hands-on X0X-style sequencer runs up to 64 step sequences with ratchets, probabilities and microtiming, parameter locks and automations per track, plus a CV/gate track for controlling a synthesizer at 1V/Oct. Pattern and kit memory each hold 4 banks of 16.
specs: |-
  - 7 sample-based drum voices
  - 7 banks of factory samples by Richie Hawtin and Erica Synths team
  - Up to 16 banks for user samples
  - 64 Mb total sample memory
  - Line input for sampling
  - Built-in microphone for live sampling
  - Built-in speaker
  - 7 parameters for sample sound design
  - Individual level controls for each voice
  - Parameter locks and automations per track
  - CV/Gate sequencer for synthesizer control (1V/Oct gate)
  - Memory of 4 banks with 16 patterns each
  - Memory of 4 banks with 16 kits each
  - Memory backup via USB-C
  - Versatile, hands-on X0X-style sequencer
  - Sequencer with ratchets, probabilities and microtiming
  - Up to 64 step sequences
  - MIDI IN and MIDI OUT via DIN and USB-C
  - Stereo output
  - 3.5mm headphones output
  - Unit dimensions (including knobs): 40,5 x 18,5 x 6 cm
  - Weight: 2,7 kg
