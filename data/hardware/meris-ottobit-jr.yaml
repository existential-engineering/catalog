description: A Maniacal Little Machine, inspired by vintage gaming consoles.
details: |-
  Ottobit Jr. brings the stutter and crush sounds of an era when silicon defined sonics directly to the pedalboard. The triggered stutter and pitch, filter and crush sequencers lead to side-scrolling, coin-collecting maze worlds, and a resonant low-pass filter competes with the best analog synths.

  The pedal offers variable sample rate and bit crushing, a vintage synth inspired low-pass filter, triggered stutter effects, and a sequencer module for pitch, filter, or decimation pattern sequencing, with tap tempo for the sequencer and stutter.

  Ottobit Jr. provides stereo input and output, with switchable input/output headroom level for guitar, synthesizer or line levels. The multi-function EXP jack supports MIDI in/out via a compatible MIDI-to-TRS conversion box, preset switching, an expression pedal, or a tap switch, with remote tap tempo also available via the EXP jack.
specs: |-
  - Variable sample rate and bit crushing
  - Vintage synth inspired low-pass filter
  - Triggered stutter effects
  - Sequencer module for pitch, filter or decimation pattern sequencing
  - Tap tempo for sequencer and stutter
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Current draw: < 150 mA
  - Dimensions: 4.25" wide x 4.5" long x 2" tall
