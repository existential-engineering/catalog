name: MiBass 550
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/mibass-550
description: It fits in the pocket of a gig bag, yet it is big enough to fill a
  serious venue with warm authoritative Ashdown tone. The MiBass 550 packs 550W
  of Class D power and a plethora of pro features into a stylish, compact bass
  head with an internal power supply.
details: |-
  Designed from the ground up, the MiBass 550 packs 550W of Class D power and a plethora of pro features in a stylish, compact bass head measuring just 8.3 x 2.6 x 6.3 inches, and that includes an internal power supply. On the front you will find a switchable Active/Passive instrument input and an input level control that lets you match the input signal to your bass using the trademark Ashdown VU meter. The pre amp centers on a 7 band semi parametric EQ for precision tone shaping, with rotary controls to select frequency and sliders to cut or boost, plus 'Deep' and 'Shape' voicing buttons and an EQ In/Out bypass. A front panel line input with level control lets you connect an MP3 player for practice. Around the back, combination Jack/Speakon speaker outputs share panel space with a Pre/Post switchable balanced DI output for direct connection to a PA or recording console, an FX Send/Return loop, and a headphone jack for silent practice.
specs: |-
  - Power Output: 550 Watts
  - Speaker Outputs: 2 x Jack/Speakon Outputs
  - Line Input: Yes with level control
  - Line Output: Yes
  - DI Output: Yes with Pre/Post switch
  - Impedance: 4 Ohms minimum
  - Effects Send: Yes
  - Effects Return: Yes
  - Weight: 2.9 kg
  - H x W x D: 66 x 210 x 160 mm
