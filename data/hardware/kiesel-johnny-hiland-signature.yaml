description: The JH6 is Johnny Hiland's signature model, fitted with his Six
  Shooter Singles pickups to blend classic S-style and T-style tones. It uses a
  Solo body with a bolt-on neck joint and a control and pickup-switching layout
  particular to Hiland.
specs: |-
  - Model designation: JH6
  - Construction: bolt-on with radiused neck heel, Solo body
  - Body: swamp ash
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.68 in at nut, 2.22 in wide at 24th fret, .780 in thick at 1st fret, .870 in thick at 12th fret
  - Fingerboard: birdseye maple with 10 in radius
  - Frets: 22 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale length: 25.5 in
  - Headstock: GT-style
  - Bridge: Hipshot fixed bridge, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: cream coloured Kiesel Johnny Hiland Six Shooter single coils
  - Electronics: cream coloured master volume and tone controls, 5-way blade-style pickup selector
  - Output jack: available flush mount or rear access
  - Inlays: black acrylic diamond, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Dimensions: 38.25 in long, 1.65 in thick, 12.5 in wide
  - Weight: 7.75 lbs
  - Strings: Elixir Nanoweb 942E
  - Truss rod cover: Johnny Hiland signature
