description: Nu Mu features T-Bar tube front end with discrete FET output stage.
  HIP function, 10:1/3:1 ratios, MANLEY IRON® transformers. Fast, clean
  compression.
details: |-
  The Manley Nu Mu integrates the T-Bar modified all-tube variable-mu input stage from the classic Variable Mu® Limiter with a solid-state output stage, combining vacuum tube gain reduction characteristics with contemporary circuit performance.

  Hand-built in California with custom hand-wound Manley IRON® input transformers and Manley Power® supply technology, the Nu Mu delivers reliable, predictable and musical compression and limiting in demanding tracking and mixing sessions.
specs: |-
  - T-Bar modified all-tube variable-mu input stage (derived from the classic Variable Mu® Limiter)
  - Solid-state output stage (FET)
  - Custom hand-wound MANLEY IRON® input transformers
  - Manley Power® supply technology
  - Tubes: 4 × 6BA6 (hand-matched)
  - Frequency Response: 20 Hz – 50 kHz
  - THD & Noise: < 0.05%
  - Dynamic Range: 112 dB
  - Signal-to-Noise Ratio: 89 dB
  - Max Input: +25 dBu (-3), +21 dBu (0), +18 dBu (+3)
  - Max Output: +27 dBu (18 Vrms into 100K Ohm load)
  - Attack Range: 13–130 msec
  - Recovery Steps: 0.1 s, 0.16 s, 0.32 s, 0.64 s, 1.7 s
  - COMPRESS mode ratios: 1.2:1 – 3:1
  - LIMIT mode ratios: 1.5:1 – 12:1
  - HIP (High-Pass sidechain) function
  - Dimensions: 19" × 3.5" × 7" (2U rack space)
  - Weight: 8.5 lbs
  - Power Consumption: 35 watts
  - Hand-built in California
