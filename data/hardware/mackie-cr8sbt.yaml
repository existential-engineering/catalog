description: Powered Subwoofer with Desktop Remote and Bluetooth®.
details: |-
  With the Mackie CR8SBT subwoofer, you won't just hear the bass—you'll feel it, too. The CR8SBT houses an 8" polypropylene-coated woofer within an all-wood sealed enclosure. The result? You get powerful bass reinforcement that delivers the bottom end you've been dreaming of.

  Effortlessly pair your CR8SBT subwoofer with any Bluetooth® device for easy streaming. And get this: You can connect any powered speakers to the CR8SBT and play through the entire system from your Bluetooth® device, effectively adding Bluetooth® connectivity to any non-Bluetooth® speakers you may already own.

  How else are you going to hear those deep 808s when you're mixing or listening to music? Adding the CR8SBT to your setup brings powerful low-end to your studio or home audio system. You'll know it when you feel it.
specs: |-
  - Powerful CR Series sound for home studios, gaming and listening
  - Adds Bluetooth® connectivity to any non-Bluetooth® stereo speakers
  - 100 watts RMS of Class D amplification
  - 8" polypropylene woofer and custom-tuned ports for deep bass extension
  - Flexible inputs and outputs: 1/4" TRS and RCA, plus Bluetooth® connectivity
  - Adjustable crossover frequency that ranges from 40–180Hz
  - Polarity control
  - Included CRDV desktop volume remote to control your whole system
