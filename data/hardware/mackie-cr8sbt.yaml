description: Mackie CR8SBT Creative Reference Subwoofer with Bluetooth combines
  professional quality sound with powerful dedicated bass reinforcement for your
  studio or home.
details: |-
  CR8SBT is the powered subwoofer of Mackie's third-generation CR Series, built around an 8 inch polypropylene woofer in a solid MDF cabinet with custom-tuned porting, driven by 100 watts RMS of Class D amplification.

  It sits between the source and a pair of monitors: line-level signal arrives on balanced or unbalanced 1/4 inch TRS left and right inputs and unbalanced RCA left and right inputs, and passes back out on a matching set of 1/4 inch and RCA left and right outputs wired the same way. The manual states inputs and outputs may all be used simultaneously without interrupting one another.

  Rear-panel controls are an input level knob, a sub output level knob, a continuously variable crossover from 40 Hz to 180 Hz, and a polarity switch offering 0 or 180 degrees.

  Bluetooth 5.0 audio streaming is built in, so pairing a phone to the subwoofer adds wireless streaming to whatever powered speakers are connected downstream of it, including non-Bluetooth ones.

  A CRDV desktop volume control is included and connects to the rear CRDV jack on a 1/4 inch connector, giving remote control of overall system level and of the subwoofer level from the desk.
specs: |-
  - 100 watts RMS of Class D amplification
  - 8 in / 203 mm polypropylene woofer
  - Frequency response (-3 dB): 37 Hz - 400 Hz
  - Frequency response (-10 dB): 30 Hz - 400 Hz
  - Maximum SPL peak: 112 dB
  - Adjustable crossover frequency: 40 Hz - 180 Hz
  - Polarity switch: 0 degrees / 180 degrees
  - Input type: female 1/4 inch TRS balanced-unbalanced, RCA unbalanced
  - Output type: female 1/4 inch TRS balanced-unbalanced, RCA unbalanced
  - Input impedance: 10 kOhm balanced/unbalanced
  - Output impedance: 300 Ohm balanced / 150 Ohm unbalanced
  - Bluetooth protocol: 5.0 (audio streaming)
  - Adds Bluetooth connectivity to any non-Bluetooth stereo speakers
  - Included CRDV desktop volume remote to control the whole system
  - Enclosure: solid MDF, black vinyl wrap, custom-tuned bottom shelf port
  - Line input power: detachable line cord, 100V-240V~, 50-60 Hz, 150W
