description: Mackie ProFX6v3+ is a professional analog mixer and USB-C audio
  interface with powerful enhancements for studio-quality recordings and live
  streams.
details: |-
  Mackie ProFX6v3+ is a professional analog mixer and USB-C audio interface with powerful enhancements for studio-quality recordings and live streams. Capture your performance with Onyx preamps and channel EQ, add computer audio via loopback, bring in calls via Bluetooth and enhance your sound with upgraded GigFX+ effects on a color LCD screen.

  Two Onyx mic preamps offer up to 60 dB of gain with ultra-low noise, with Hi-Z switches for direct instrument connection, 100 Hz low-cut filters and 48V phantom power. One-button compression and 2-band EQ on channels 1 and 2 shape the sound before it reaches the mix.

  The high-resolution GigFX+ effects engine carries 12 presets that can be edited and saved on the fly through the full-color LCD display. Three USB recording modes (Standard, Loopback and Interface) run over a 24-bit / 192 kHz 2x4 USB-C audio interface, and a blend control moves the monitor feed between the computer output and a latency-free feed from the mixer.

  A dedicated bi-directional Bluetooth channel brings in music playback and phone callers, and a stereo 1/8" input on channel 5/6 adds a further playback source. The chassis is solid steel with ABS side protection.
specs: |-
  - 2 Onyx mic pres with up to 60 dB of gain and ultra-low noise performance
  - High-resolution GigFX+ effects engine with 12 editable presets
  - Full-color LCD display for editing and saving effects presets
  - 24-Bit / 192 kHz 2x4 USB-C audio interface
  - Three recording modes: Standard, Loopback and Interface
  - Bi-directional Bluetooth for music playback and caller integration
  - 2-band EQ on channels 1 and 2 (80 Hz, 12 kHz)
  - One-button compression on channels 1 and 2
  - Hi-Z switches allow direct connection of instruments
  - 100 Hz low-cut filter and 48V phantom power on all mic channels
  - Stereo 1/8" input on channel 5/6
  - Headphone output with separate level and blend control
  - GigFX+ presets include hall, room and plate reverb, chorus, flanger, delay and combined delay/reverb, delay/chorus and reverb/chorus
  - Waveform OEM recording software included
  - Solid steel chassis with ABS side protection
  - 12 VDC at 2A universal external power supply (100-240 VAC)
  - 7.5 x 8.4 x 2.9 in / 191 x 213 x 74 mm, 2.6 lb / 1.2 kg
