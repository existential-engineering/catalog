description: "6-Channel Analog Mixer with Enhanced FX, USB Recording Modes and
  Bluetooth, featuring Onyx mic preamps, GigFX+ effects engine, and a USB-C
  audio interface for live sound and live streaming."
details: |-
  LIVE SOUND MEETS LIVE STREAM. Capture your performance with Onyx preamps and channel EQ, add computer audio via loopback, and stream or record everything through the built-in USB-C audio interface.

  The ProFX6v3+ combines analog console warmth with modern digital workflows. Two Onyx microphone preamps deliver up to 60 dB of gain, channels 1–2 include 2-band EQ and one-button compression, and a stereo 1/8" input on channel 5/6 makes it easy to add a phone or media player.

  GigFX+ provides 12 editable effects presets with a full-color LCD display for editing and saving. Three onboard recording modes — Standard, Loopback, and Interface — cover everything from band rehearsals to podcast streams to multi-track recording at 24-bit/192 kHz.

  Built around a solid steel chassis with ABS side protection, the ProFX6v3+ keeps Mackie's "Built-Like-A-Tank" construction while adding Bluetooth and bundled Waveform OEM DAW plus the DAW Essentials Collection of 16 FX plug-ins.
specs: |-
  - 2 Onyx mic preamps with up to 60 dB gain
  - 6 total line inputs
  - 2-band EQ on channels 1–2
  - One-button compression on channels 1–2
  - 100 Hz low-cut filter on mic channels
  - 48V phantom power on mic channels
  - Hi-Z switches for direct instrument connection
  - Stereo 1/8" input on channel 5/6
  - Headphone output with separate level/blend control
  - Bi-directional Bluetooth
  - USB-C audio interface (2x4, 24-bit/192 kHz)
  - Three recording modes: Standard, Loopback, Interface
  - GigFX+ effects engine with 12 editable presets
  - Full-color LCD display for editing/saving presets
  - Solid steel chassis with ABS side protection
  - "Built-Like-A-Tank" construction
  - Includes Waveform OEM DAW (unlimited track count)
  - Includes DAW Essentials Collection (16 FX plug-ins)
