description: >-
  RANE DJ MP2015 is a premium rotary DJ mixer featuring five channels,
  high-resolution USB audio, and audiophile-grade sound, designed for
  professional club and rotary-mixer DJs.
details: |-
  The MP2015 is a 4-channel rotary DJ mixer with a wooden chassis, designed for professional club and rotary-mixer DJs. The Submix can also function as a 5th input channel by activating SUB on the Session In, which is the basis for the marketing claim of five channels.

  Each of the four Deck inputs selects between a turntable or CD deck (analog or S/PDIF), an Aux line, USB port A, or USB port B. S/PDIF inputs offer 128 dB dynamic range with ultra-low jitter and 16:1 SRC conversion. Phono response follows the RIAA curve (+0.1/-0.2 dB, 31 dB gain at 1 kHz) with Butterworth 3rd-order infrasonic and 2nd-order low-pass rumble filtering.

  Two independent USB 2.0 ports allow simultaneous connection of two computers, each supporting five stereo playback and seven stereo record channels. This enables back-to-back DJ sets between laptops running different software. The class-compliant Core Audio path needs no driver on macOS; a universal ASIO driver is provided for Windows.

  Tone shaping is layered: per-channel and Submix 3-band tone filters (+6 dB to full-cut, 12 dB/octave) with selectable 300/3k or 150/6k Hz crossover points, a per-channel sweepable HP/LP/BP filter (24 dB/octave) with Resonance, and a 3-band Isolator on the Main mix (+10 dB to full-cut 24 dB/octave) with fully adjustable crossover points.

  Audio quality is positioned at audiophile/studio grade: 32-bit floating-point DSP, 24-bit A/D and D/A conversion at 44.1, 48, or 96 kHz, 116 dB A-weighted dynamic range (digital/USB in to line out), and 0.0009% THD+N. The Mic input is a balanced XLR/TRS combo with switchable Line/Mic level and 48V phantom power, plus a DUCK switch that lowers the music by 10 dB while the mic is active.
specs: |-
  - 4 deck input channels (Phono/CD/S/PDIF switchable per deck) plus Submix usable as a 5th channel
  - Dual independent USB 2.0 ports — 5 stereo playback + 7 stereo record per port
  - 24-bit A/D and D/A conversion at 44.1, 48, or 96 kHz
  - 32-bit floating-point DSP
  - Dynamic range 116 dB A-weighted (digital/USB in to line out)
  - Line in to line out dynamic range 113 dB A-weighted
  - THD+N 0.0009%
  - S/PDIF inputs: 128 dB dynamic range with 16:1 sample-rate conversion
  - Phono response: RIAA +0.1/-0.2 dB, 31 dB gain at 1 kHz
  - Per-channel 3-band tone filters with switchable 300/3k or 150/6k Hz crossover
  - Per-channel sweepable HP/LP/Band-pass filter, 24 dB/octave, with Resonance
  - 3-band Isolator on Main, fully adjustable crossover points
  - Mic input: balanced 1/4-inch TRS + XLR combo jack with Line/Mic switch and +48V phantom
  - Main output: balanced XLR; Booth output: balanced 1/4-inch TRS
  - Class-compliant USB audio on macOS; universal ASIO driver for Windows
  - Traktor Scratch certified; Serato DJ + DVS upgrade-ready
  - Universal power supply: 100–240 VAC, 50/60 Hz, max 20 W
  - Dimensions: 35.5 × 33.3 × 8.3 cm (14 × 13.1 × 4.3 in)
  - Weight: 5.8 kg (12.7 lb)
