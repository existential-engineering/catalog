description: The Pro-Mod San Dimas Style 1 HH FR E Ash is a high-performance
  electric guitar built around a sandblasted ash body in a satin Sunburn finish.
  The San Dimas Style 1 shape pairs with a bolt-on maple speed neck featuring
  graphite reinforcement rods, a satin finish, and rolled fingerboard edges for
  fast, fatigue-free playing.
details: |-
  Sandblasted ash body for distinctive texture under the satin finish. Speed neck profile with rolled fingerboard edges for fast playability. Heel-mount truss rod adjustment wheel for quick setup without removing the neck. Push/pull volume coil split expands the HH layout into single-coil-style voicings. Recessed Floyd Rose 1000 Series double-locking tremolo with locking nut for stable, deep dive bombs. Licensed Fender Stratocaster headstock with 4-bolt serialized neck plate.
