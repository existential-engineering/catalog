description: The DELUXE55 is an all-analogue tribute to the legendary Fender 5E3
  Tweed Deluxe from 1955. With a complete valve amp signal path recreated in
  miniature using carefully crafted transistor-based circuitry, this compact
  pedal nails the sound, feel and personality of one of history's quirkiest
  combos.
details: |-
  The DELUXE55 recreates everything that's great about the Tweed Deluxe amp circuit. From articulate edge-of-breakup tones to thick lead sounds and all-out, about-to-explode fuzz, this no-nonsense tone fits into just about any genre. This compact pedal simulates 6V6 power amp overdrive, valve rectifier sag, ragged phase inverter distortion, and the fat gritty tone of the Tweed Deluxe's unconventional preamp, including different valve types.

  Starting with a real Tweed Deluxe, Origin Effects began an extensive process of testing and measurement to understand every detail of the circuit, then redesigned all-analogue Amp Recreation circuitry to mimic the exact behaviour of this amp. The DELUXE55's push-pull output stage overdrives in exactly the same way as the 6V6 power amp in the real amp, and includes a reactive load to simulate the interaction between the amp's power amp and speaker.

  The DELUXE55's Amp Recreation circuitry features a PREAMP switch, mimicking the effect of swapping a 12AY7 preamp valve for a 12AX7, a popular mod among Tweed Deluxe owners. This switch takes your tone from a bright, articulate crunch to a warmer, higher-gain tone.

  The DELUXE55 is equipped with a Post EQ circuit that comes after the Amp Recreation circuitry and ensures compatibility with traditional amps, modellers, power amps and cabinet simulators.

  Designed and built in the UK, and housed in a brushed stainless steel and aluminium enclosure, the DELUXE55 is ready for a life on the road, serving up vintage Tweed amp tone night after night.
