url: https://ashdownmusic.com/products/superfly-500
description: Ashdown Engineering's Superfly combines a sophisticated
  programmable bass preamplifier and a powerful 500 Watts RMS power section in a
  compact bass amp head that weighs just 10 pounds.
details: |-
  The Superfly is a compact bass amp head combining a programmable preamplifier with a 500-watt RMS digital power section, weighing just 10 pounds. Programming is intuitive: the user can store 69 programmes of input level, 7-band graphic equalisation and compression settings, and switch them via any MIDI-compatible pedal for a high degree of live performance control. It has a strong, controlled bottom end and clear, precise highs courtesy of an advanced digital power amp section.
specs: |-
  - Power output: 2 x 250W into 4 Ohms
  - Power requirement: 100mV - 5V
  - Line output: 10K Ohms, 0dB
  - DI output: 600 Ohms balanced, level -20dBu nominal
  - EQ: +/- 15dB at 60Hz, 180Hz, 340Hz, 660Hz, 1.3kHz, 2.6kHz, 5kHz
  - Notch filter: 10K Ohms, 0dB
  - H x W x D (mm): 220 x 86 x 360
  - Weight: 4.5kg
  - USB, MIDI
  - 30 factory, 69 user programmes
