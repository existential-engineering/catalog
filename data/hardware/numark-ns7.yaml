url: https://www.numark.com/product/ns7
description: Performance DJ controller with two motorized 7-inch turntable
  platters, designed by Numark in collaboration with Serato for use with Serato
  ITCH.
details: |-
  Designed by Numark in collaboration with Serato, NS7 combines two 7-inch motorized, high-torque aluminum turntable platters with a professional audio interface and premium controls for computer-based DJ performance using Serato ITCH software. The platters offer adjustable torque settings with modern and classic modes.

  The controller features Strip Search virtual needle-drop touch strip control, a CP-PRO digital-VCA crossfader (replaceable and customizable), D-TYPE replaceable line faders, five hot-cue-assign buttons per deck, an extensive loop section with manual and auto functions, and 100mm pitch sliders with +/- buttons. Over 100 LEDs and 100 hands-on controls give DJs deep tactile control over the software.

  NS7 includes an integrated laptop stand and ships fully pre-mapped to Serato ITCH. It is also compatible with the Serato Scratch LIVE library.
