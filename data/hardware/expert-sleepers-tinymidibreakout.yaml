id: QTSd4ktwU_sZmGBAZFj3r
name: Tiny MIDI breakout
manufacturer: expert-sleepers
primaryCategory: midi
categories:
  - modular
  - utility
hp: 2
url: https://www.expert-sleepers.co.uk/tinymidibreakout.html
description: The Tiny MIDI breakout is a 2HP Eurorack panel that carries six
  passive 3.5mm TRS MIDI sockets that can be shared among compatible modules and
  wired for Type A or Type B 3.5mm MIDI. It draws no current and connects to the
  module behind it with a four-way ribbon cable.
details: |-
  The Tiny MIDI breakout is a 2HP Eurorack panel carrying six passive jack sockets that can be shared among modules and wired for Type A or Type B 3.5mm MIDI, 30mm deep including its cables and drawing no current of its own. It is supplied with the module, two M3x6mm screws and one four-way ribbon cable.

  The cable colours may vary from those shown on the product page, and the cable may be split into two two-way cables if desired. Ordinary DuPont cables or jumper wires serve as replacements.

  In the wiring examples given, the breakout is connected with the uppermost socket as the MIDI input and the one below it as the MIDI output, wired for a Type A 3.5mm MIDI cable.

  Held with the rear facing the builder, the top of the PCB is the end where the connection header sits right on the edge of the board, so each connection header is above its corresponding jack socket rather than below. Oriented that way, the jack socket tip is the right pin on the 3-way header, the ring is the centre pin and the shield is the left pin. The shield pin typically does not need to be connected.

  For a Type A output, pins 1 and 2 from the attached module go to the ring and tip pins respectively, and for a Type A input pins 3 and 4 go to the tip and ring pins respectively. For Type B, ring and tip are swapped. On the disting EX, FH-2 and ES-9, pin 1 is the top pin of the four-way header, while on the disting mk4 pin 1 is the pin closest to the rear of the module.
specs: |-
  - Panel width: 2HP
  - Module depth: 30mm (including cables)
  - Current draw: none
  - Supplied with the module, two M3x6mm screws and one four-way ribbon cable
  - Six passive jack sockets, shared among modules and wired for Type A or Type B 3.5mm MIDI
  - Wiring example: uppermost socket as MIDI input, the one below as MIDI output
  - Ring and tip swapped for Type B wiring
  - Four-way ribbon cable to the host module, splittable into two two-way cables
  - Pin 1 is the top pin of the four-way header on the disting EX, FH-2 and ES-9, and the pin closest to the rear on the disting mk4
