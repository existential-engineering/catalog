description: The JHS Pedals Flight Delay is a multi-mode delay pedal offering
  analog, reverse, and digital modes with tap tempo, expression control, onboard
  modulation, and trails bypass in a straightforward interface.
details: |-
  The JHS Pedals Flight Delay was made with one goal in mind: to be everything you need in a delay and nothing you don't. In a world full of complex effects pedals, we worked hard to bring you the opposite - a beautifully simple stompbox that combines the most essential delay types with the features that matter. With three modes (Analog, Reverse, and Digital) inspired by all-time favorite delays - EHX Memory Man, Boss DD-5, and Line 6 DL4 "Reverse Mode" - the Flight Delay is familiar, inspiring, and versatile enough for players in any genre.

  Controls: MIX (dry/wet blend), REPEATS (feedback amount), EQ (tone/color of repeats), TIME (50ms to 1 second).

  Modes: ANALOG - filtered analog-style BBD delay inspired by EHX Memory Man and BOSS DM-2. REVERSE - plays delay signal backwards. DIGITAL - crisp DSP delay inspired by BOSS DD-5 and Ibanez DE7.

  Subdivision toggle sets repeat interval to quarter note, eighth note, or dotted eighth note relative to tapped tempo.

  Modulation path affects delayed signal only with toggle for chorus, vibrato, or off; Mod Depth and Mod Rate controls.

  Trails bypass mode retains repeats when pedal is bypassed (hold both footswitches for two seconds while on).
