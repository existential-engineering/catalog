description: Compact overdrive pedal voiced after Marshall's flagship JVM
  amplifier, delivering full-bodied, articulate high-gain overdrive ranging from
  clean harmonics to aggressive distortion. Features a built-in noise gate to
  keep high-gain settings tight and quiet, plus simple but powerful tone
  controls for shaping the response. Engineered by Marshall with the same tonal
  philosophy as the original JVM amp. Runs on a 9V battery (approx. 10 hours) or
  an external 9V DC centre-negative PSU (not included).
details: |-
  - JVM-voiced overdrive ranging from clean harmonics to aggressive high-gain distortion
  - Built-in noise gate keeps high-gain tones tight and quiet
  - Simple, powerful tone controls for shaping response
  - 1/4" instrument input and 1/4" output
  - Runs on 9V battery (approx. 10 hours) or external 9V DC centre-negative PSU (not included)
  - Engineered with the same tonal philosophy as the JVM amplifier
