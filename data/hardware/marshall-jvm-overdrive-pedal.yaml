description: Compact overdrive pedal voiced after Marshall's flagship JVM amplifier, delivering full-bodied, articulate high-gain overdrive ranging from clean harmonics to aggressive distortion. Features a built-in noise gate to keep high-gain settings tight and quiet, plus simple but powerful tone controls for shaping the response. Engineered by Marshall with the same tonal philosophy as the original JVM amp. Runs on a 9V battery (approx. 10 hours) or an external 9V DC centre-negative PSU (not included).
details: |-
  The JVM pedal puts the stadium-filling sound of the JVM amp at the soles of your feet. Combining multi-channel power with pedalboard precision, the JVM Pedal adapts seamlessly to your playing environment.

  Ideal for seasoned guitarists and tone enthusiasts alike, the JVM pedal delivers precise, full-bodied overdrive and articulate response. It features a built-in noise gate that eliminates unwanted noise in high-gain settings without compromising the sound.

  Crafted with the same expertise and commitment to quality that gave the JVM amp its versatility and power, the pedal delivers the distortions expected from Marshall.

  Engineered with simple controls, the JVM Pedal shapes the sound without hassle. Its design allows precise adjustments across a wide range of tones, from rich, clean harmonics to heavy, aggressive distortion.

  Designed and engineered in UK. Made in Vietnam.
