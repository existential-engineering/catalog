description: Big Time is a hybrid echo that revisits the mixed-up circuitry
  found in rackmount delays from the early 80s, pairing a stereo analog preamp
  and an analog feedback-loop limiter with a digital delay core.
details: |-
  Big Time is a hybrid analog/digital echo made by Chase Bliss in collaboration with Electronic Audio Experiments. It revisits the mixed-up circuitry of rackmount delays from the early 80s, where advanced analog engineering was used to prop up crude digital systems — the anything-is-possible of digital, the everything-sounds-good of analog. Inside you will find misbiased modulations, dissolving loops, sequenced echoes, and all of the space stuff you could ever want.

  The pedal has two separate sources of analog coloration: a stereo analog preamp at the input stage and a stereo analog limiter inside the delay's feedback loop. The preamp combines a voltage-controlled amplifier with a clipping diode arrangement wrapped in a matched emphasis/de-emphasis network, while the hybrid limiter pairs a voltage-controlled matrix mixer with sidechain compression and a nonlinear waveshaper with voltage-controlled bias shift. As the COLOR (preamp gain) and FEEDBACK (feedback-loop gain) faders rise, the echoes collide with the limiter and take on analog character, and four limiter states — Digital, Compressed, Saturated, and a misbiased "#!&%" state — decide whether repeats stay clean, sag, saturate, or fall apart, each with its own TEXTURE control.

  Four modes set the delay range and footswitch behavior: Mod (3–46 ms) for modulation, resonators, and doubling; Short (46–736 ms) for slapback through multi-tap; Long (736 ms–12.2 s) for ambience and composition; and Loop, a variable-length phrase looper that records up to 48 seconds at roughly 44 kHz or up to 3.2 minutes at reduced resolution. A CLUSTER fader gradually blends in additional delay taps and diffusion, MOTION adds sine, square, or envelope-controlled movement, and the SCALE button steps time changes through chromatic, octave+4th+5th, or octave intervals for harmonized pitch-shifting and melodic sequencing. Tone shaping comes from four voicings (HiFi, Focus, Warm, Analog) plus a studio-style tilt EQ with an adjustable crossover point, and a 0.5x control lowers the bit depth from 32 to 12 and halves the sample rate to replicate the digital sound of early 80s rackmount units.

  Big Time is a true stereo device that can run mono, stereo, or mono-in/stereo-out, with selectable ultra-low-noise balanced or unbalanced TRS operation, analog dry-through, and true bypass with an optional trails mode. It stores ten internal presets (127 via MIDI), and every aspect of the pedal can be controlled via MIDI — including syncing to an external clock or outputting Big Time's own clock. A dedicated EXP jack accepts an expression pedal or 0–5V CV to control any or all of the faders, and an AUX jack accepts a normally-open momentary footswitch for remote preset and performance gestures.
specs: |-
  - Analog/digital hybrid echo with stereo analog preamp and analog feedback-loop limiter
  - 32-bit, 48kHz A/D conversion
  - True stereo I/O: mono, stereo, or mono-in/stereo-out operation
  - Selectable TRS balanced or unbalanced I/O
  - Input impedance: 1M ohm (single-ended), 20k ohm (balanced, common-mode)
  - Output impedance: 50 ohms
  - Noise (RMS 20Hz-20kHz, A-weighted): dry path -100dBV, delay path -94dBV
  - Preamp gain (nominal): 0dB to +20dB, or +12dB to +32dB with +12dB mode active
  - Four modes: Mod (3-46 ms), Short (46-736 ms), Long (736 ms-12.2 s), Loop (variable length)
  - Loop mode: 48 seconds at ~44kHz, up to 3.2 minutes at ~11kHz, 12 seconds at ~172kHz
  - Four limiter states: Digital, Compressed, Saturated, and misbiased "#!&%", each with TEXTURE control
  - Four voicings: HiFi, Focus, Warm, Analog
  - Tilt EQ with adjustable crossover point
  - Cluster fader for multi-tap echoes, scattered ambience, and diffusion
  - Motion modulation: Sine, Square, and envelope-controlled types with Depth and Rate controls
  - Scales: Chromatic, Oct+4+5, Octave for harmonized pitch-shifting and sequencing
  - 0.5x control lowers bit depth from 32 to 12 and halves the sample rate
  - Motorized faders that jump to alt settings and snap to tap-tempo position
  - 10 internal presets, 127 via MIDI
  - MIDI In (clock, PC, CC) and MIDI clock output on 5-pin DIN
  - Expression and CV control (0-5V) of any or all faders
  - AUX jack for external normally-open momentary footswitch
  - Analog dry thru; true bypass with optional trails mode
  - Tap tempo
  - Made in collaboration with Electronic Audio Experiments
  - Power: 9V DC center negative, ~1A (400mA nominal; 1A required for startup surge and large slider movements)
  - Dimensions: 5.75" x 6.5" x 2.5"
