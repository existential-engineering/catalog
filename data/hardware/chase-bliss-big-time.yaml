description: Big Time is a hybrid echo that revisits the mixed-up circuitry found in rackmount delays from the early 80s. It blends the best of analog and digital, combining a stereo analog preamp and feedback-loop limiter with a digital delay core for modulation, echoes, ambience and loops.
details: |-
  Big Time is a hybrid analog/digital echo pedal made by Chase Bliss in collaboration with Electronic Audio Experiments (EAE). It replicates the signal flow of rackmount delays from the early 1980s, an era when analog circuitry was used to prop up the shortcomings of crude early digital delay chips, and pushes that hybrid relationship further than those original units ever could.

  The pedal has two sources of analog coloration: a stereo analog preamp at the input stage, controlled by the COLOR fader, and an analog limiter inside the delay's feedback loop, controlled by FEEDBACK. As repeats collide with the limiter they take on progressively more analog character, and a STATE button selects which of four limiter behaviors is in play: Digital (no limiter, clean digital feedback), Compressed (clean compression and sag), Saturated (distortion and deterioration, the pedal's default character), and a fourth, misbiased state for starved, mangled textures. Each state has its own TEXTURE alt-control.

  A MODE button sets both the delay range and footswitch behavior across four ranges: Mod (3-46 ms) for modulation and doubling, Short (46-736 ms) for slapback through multi-tap delay, Long (736 ms-12.2 s) for ambient and compositional use, and Loop, a variable-length phrase looper. TIME is a clock control whose behavior is shaped by MODE (range) and SCALE (smooth versus tuned-step movement across Chromatic, Oct+4+5, or Octave intervals), and MOTION layers Sine, Square, or envelope-controlled movement on top, with DEPTH and RATE alt controls. A CLUSTER fader gradually blends in additional synced or scattered delay taps and diffusion, and VOICING plus a TILT EQ with adjustable crossover shape the pedal's base tone.

  Big Time is a true stereo device usable in mono, stereo, or mono-in/stereo-out configurations, with selectable ultra-low-noise balanced or unbalanced TRS I/O. It stores ten internal presets (127 more via MIDI), and nearly every parameter can be controlled over MIDI, including sync to or output of MIDI clock. A dedicated EXP jack accepts an expression pedal or 0-5V CV to control any combination of faders, and an AUX jack accepts a normally-open momentary footswitch for remote preset recall and performance gestures. The pedal offers analog dry-through and true bypass with an optional trails mode, and runs on 9V DC center-negative power at up to 1A.
specs: |-
  - Hybrid analog/digital echo with stereo analog preamp and analog feedback-loop limiter
  - 32-bit, 48kHz A/D conversion
  - True stereo I/O: mono, stereo, or mono-in/stereo-out operation
  - Selectable TRS balanced or unbalanced I/O
  - Input impedance: 1M ohm (single-ended), 20k ohm (balanced, common-mode)
  - Output impedance: 50 ohms
  - Four delay ranges: Mod (3-46 ms), Short (46-736 ms), Long (736 ms-12.2 s), Loop (variable length)
  - Four limiter states: Digital, Compressed, Saturated, and misbiased, each with a TEXTURE control
  - Motion modulation: Sine, Square, and envelope-controlled types with Depth and Rate
  - Scales: Chromatic, Oct+4+5, Octave
  - Cluster fader for multi-tap echoes and diffusion
  - 10 internal presets, 127 via MIDI
  - MIDI In (Clock, PC, CC)
  - CV control (0-5V) and expression pedal control of any or all faders
  - AUX jack for external normally-open momentary footswitch
  - Analog dry thru; true bypass with optional trails mode
  - Made in collaboration with Electronic Audio Experiments
  - Power: 9V DC center negative, ~1A (400mA nominal, 1A required for startup surge)
  - Dimensions: 5.75" x 6.5" x 2.5"
