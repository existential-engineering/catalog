description: Big Time is a hybrid echo that revisits the mixed-up circuitry
  found in rackmount delays from the early 80s, blending a stereo analog preamp
  and feedback-loop limiter with a digital delay core for modulation, echoes,
  ambience and loops.
details: |-
  Big Time is a hybrid analog/digital echo pedal made by Chase Bliss in collaboration with Electronic Audio Experiments (EAE) and John Snyder, revisiting the mixed-up circuitry found in rackmount delays from the early 1980s where analog engineering was used to prop up crude early digital delay chips.

  It has two separate sources of analog coloration: a stereo analog preamp at the input stage (controlled by COLOR, which also intensifies the limiter's effect), and a stereo analog limiter within the delay's feedback loop (controlled by FEEDBACK, which increases the number of repeats and also intensifies the limiter over time). A STATE button governs the limiter's behavior, and TIME (a clock control shaped by MODE and SCALE), CLUSTER (additional delay taps and diffusion), a TILT EQ (with CROSSOVER alt control), and WET round out the fader/control set.

  Big Time is a true stereo device usable in mono, stereo, or mono-in/stereo-out (MISO) configurations, with selectable balanced or unbalanced TRS I/O. It stores 10 internal presets and 127 more via MIDI, and nearly every parameter can be controlled over MIDI, including syncing to or outputting MIDI clock. A dedicated EXP jack accepts an expression pedal or 0-5V CV to control any combination of faders, and an AUX jack accepts a normally-open momentary footswitch for remote preset recall and performance gestures such as preset up/down, 0.5x, buffer clear, tap/record, and bypass/stop.

  The pedal offers an analog dry-through path and true bypass, and runs on 9V DC center-negative power at up to 1A (400mA nominal, with the higher current needed for startup surges and large fader movements). It ships with the pedal, a current-doubler power cable, a 9V DC power supply, and a printed Field Guide.
specs: |-
  - Hybrid analog/digital echo with stereo analog preamp and analog feedback-loop limiter
  - 32-bit, 48kHz A/D conversion
  - True stereo I/O: mono, stereo, or mono-in/stereo-out (MISO) operation
  - Selectable balanced or unbalanced TRS I/O
  - Input impedance: 1M ohm (single-ended), 20k ohm (balanced, common-mode)
  - Output impedance: 50 ohms
  - Noise (RMS, 20Hz-20kHz, A-weighted): Dry path -100dBV, Delay path -94dBV
  - Preamp gain (nominal): 0dB to +20dB, or +12dB to +32dB in +12dB mode
  - 10 internal presets, 127 via MIDI
  - MIDI In (Clock, PC, CC), MIDI Out/Thru
  - CV control (0-5V) and expression pedal control of any or all faders via EXP jack
  - AUX jack for external normally-open momentary footswitch
  - Analog dry thru; true bypass
  - Made in collaboration with Electronic Audio Experiments
  - Power: 9V DC center negative, ~1A (400mA nominal, 1A required for startup surge)
  - Dimensions: 5.75" x 6.5" x 2.5"
