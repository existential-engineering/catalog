description: >-
  The Evolver is a monophonic desktop synthesizer module from Dave Smith Instruments,
  combining analog and digital synthesis with a true stereo signal path. Featuring four
  oscillators, dual filters per channel, and an integrated 16-step sequencer, it marked
  Dave Smith's return to hardware synthesis after his work at Seer Systems.
details: |-
  Dave Smith, founder of Sequential Circuits and designer of legendary synths like the Prophet 5 and Prophet VS, returned to hardware synthesis after working in software at Seer Systems. He collaborated with Roger Linn on the Adrenalinn before establishing Dave Smith Instruments. The Evolver, released in 2002, was the company's first instrument, incorporating many of Dave and Sequential's old secrets, circuits, and technologies into a modern format.

  Despite being monophonic, the Evolver offers stereo imaging capabilities through dual independent signal paths. Each channel contains its own analog oscillator, lowpass filter, highpass filter, VCA, and effects processing, essentially functioning as two independent synths operating in parallel.

  The Evolver's design philosophy embraces hands-on, real-time sound manipulation through its matrix-style interface and integrated sequencer. Four oscillators—two analog DCOs and two digital wavetable oscillators sourced from the Prophet VS—provide a wide timbral palette ranging from classic analog tones to complex digital textures.

  The instrument proved influential enough that Dave Smith Instruments subsequently developed keyboard variants including the Mono Evolver and Poly Evolver, plus a polyphonic rack module version, establishing a full product family around its core architecture.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 4 (2 analog DCOs, 2 digital wavetable)
  - Analog Waveforms: Sawtooth, triangle, saw/triangle mix, pulse with PWM and hard sync
  - Digital Waveforms: Prophet VS wavetables plus 32 user-loadable wavetables via MIDI
  - Noise: White noise generator
  - LFOs: 4 (sawtooth, triangle, ramp, pulse, random)
  - Lowpass Filters: 2 Curtis analog (2-pole or 4-pole switchable, self-resonating in 4-pole)
  - Highpass Filters: 2 digital 4-pole
  - VCAs: 1 analog per channel
  - Envelopes: 3 ADSR (filter, amplitude, user-assignable)
  - Sequencer: 16-step, 4-parameter, MIDI clock syncable
  - Effects: 3 stereo digital delays (syncable), feedback with grunge, distortion, glide
  - Memory: 512 programs (4 banks of 128)
  - MIDI: In, Out, Thru
  - Audio I/O: Stereo inputs for external audio processing
