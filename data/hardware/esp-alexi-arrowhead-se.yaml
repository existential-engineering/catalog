  - Tuners: Grover
  - Bridge: Floyd Rose 1000
  - Bridge Pickup: EMG HZ F-H2 (passive)
  - Electronics Layout: Volume
  - Strings: D'Addario XL120 (.009/.011/.016/.024/.032/.042)
  - Case: V-ALEXI Guitar Form Fit Case (included)
