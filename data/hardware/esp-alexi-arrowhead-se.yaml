details:
  - Twenty years ago in 2006, ESP Guitars produced the first two Signature
    Series guitars for Alexi Laiho, the frontman and lead guitarist in Finnish
    melodic death metal masters Children of Bodom. As a masterful musician and
    songwriter, Alexi influenced an entire generation of guitar players with his
    combination of mind-blowing neoclassical lead lines and pure blazing speed.
  - To commemorate this milestone anniversary of Alexi's relationship with ESP,
    ESP introduces the Special Edition Signature Series Alexi Laiho Arrowhead SE
    20th Anniversary. Based on Alexi's familiar offset V shape, this guitar is
    an homage to one of the first Alexi signature models offered by ESP, with
    its unmistakable yellow bevels atop a black finish.
  - Built with neck-thru-body construction at 25.5" scale, the Arrowhead SE
    pairs alder body wings to a thin U-shaped three-piece maple neck that
    features a Macassar ebony fingerboard (scalloped from frets 19-24),
    arrowhead-shaped pearloid inlays, and 24 extra-jumbo frets. The reverse side
    features an incredibly smooth and fast satin-finished neck, a matching
    yellow bevel finish, and the iconic COBHC logo.
  - Components on this outstanding guitar include gold hardware, precise Grover
    tuners, a double-locking Floyd Rose 1000 bridge, and a single EMG HZ F-H2
    passive pickup with volume control. Includes deluxe ESP hardshell V-ALEXI
    form-fit case.
specs: |-
  - Construction: Neck-Thru
  - Scale: 25.5"
  - Body: Alder
  - Neck: 3-piece Maple
  - Fingerboard: Macassar Ebony (scalloped frets 19-24)
  - Fingerboard Radius: 350mm
  - Finish: Black w/Yellow Pinstripe
  - Nut Width: 42mm
  - Nut Type: Locking
  - Neck Contour: Thin U
  - Frets: 24 Extra-Jumbo
  - Hardware Color: Gold
