description: >-
  The MC-303 is the original Roland groovebox for dance and techno music,
  featuring 303, 808, 909, Jupiter, and Juno sounds with a sequencer/arranger,
  real-time filter cutoff and resonance controls, panning, and an arpeggiator.
details: |-
  The MC-303 defined the groovebox category for dance and techno production. It combines classic Roland sounds from the 303, 808, 909, Jupiter, and Juno into a single performance-oriented unit with styling inspired by the original 303 and 808 hardware.

  The unit offers 28-voice polyphony with 448 tones and 12 drum sets including authentic 808 and 909 kits. Real-time controls for filter cutoff, resonance, and panning allow hands-on sound manipulation during performance. A 200-phrase Real-time Phrase Sequencer adds instant pattern generation.

  The 8-track sequencer supports 10 songs with 120 preset and 50 user patterns, providing a complete arrangement workflow. Effects include reverb, delay, chorus, and flange. Sixteen-part multitimbrality allows layering multiple sounds simultaneously.

  Though later superseded by the MC-505, JX-305, and competing units like the Yamaha RM1x, the MC-303 remains a solid entry-level machine for those starting out with hardware-based electronic music production. It has been used by ATB.
specs: |-
  - Polyphony: 28 voices
  - Multitimbral: 16 parts
  - Tones: 448
  - Drum Sets: 12 (including 808, 909)
  - Effects: Reverb, delay, chorus, flange
  - Arpeggiator: 200 RPS phrases
  - Sequencer: 8 tracks, 10 songs, 120 preset and 50 user patterns
  - Keyboard: 12 buttons
  - Control: MIDI
