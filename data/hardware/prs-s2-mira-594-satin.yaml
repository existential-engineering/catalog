details: |-
  A true rock and roll guitar, the PRS S2 Mira 594 Satin is a great addition to any musician’s arsenal. The PRS S2 Mira 594 Satin features a bound 22-fret Pattern Thin neck with a 24.594” scale length. Its “sinky” satin nitro finish makes for an instantly comfortable neck and brings a naturally cool, stripped-down look. The PRS stoptail bridge with brass inserts and PRS Phase III tuners with brass shafts anchor this guitar, promoting resonance and open tone while ensuring tuning stability. Pairing the Mira’s all-mahogany construction with PRS 58/15 LT vintage-voiced pickups means warm, focused midrange. The humbuckers are paired with two mini-toggle switches to individually tap the pickups, delivering both authentic humbucking and sweet, chimey single-coil sounds.

  An all-mahogany workhorse, the PRS S2 Mira 594 Satin covers a wide range of styles with ease, including rock, blues, garage, and punk.
