description: >-
  The Yamaha MX series is a lightweight digital workstation available in 49, 61,
  and 88-key versions, offering over 1,000 sounds derived from the flagship
  Motif XS and XF engines with 128-voice polyphony and USB audio/MIDI
  connectivity.
details: |-
  The Yamaha MX series brings the acclaimed Motif sound engine into a compact
  and affordable format available in three keyboard sizes. The MX49 and MX61
  feature synth-action keys while the MX88 provides a weighted graded hammer
  action, making the series accessible to both synth players and pianists.

  At its core, the MX series delivers over 1,000 sounds drawn directly from
  Yamaha's Motif XS and XF libraries, covering everything from concert pianos
  and organs to electric pianos, orchestral instruments, and classic synth
  tones from legendary Yamaha instruments like the DX7, CS-80, and SY22. Wave
  sequencing capabilities in the vein of the Korg Wavestation and Sequential
  Prophet VS add further sonic depth.

  The effects section is comprehensive, offering hundreds of processors
  including reverb, delay, chorus, distortion, wah, tremolo, and more. Three
  VCAs with ADSR envelopes provide flexible amplitude shaping across the
  16-part multitimbral architecture, and 100 user preset locations allow
  customized sound storage.

  All models function as class-compliant USB audio and MIDI interfaces,
  enabling direct connection to DAWs without additional hardware. The 61-key
  version adds aftertouch for extra expression. Pitch bend and modulation
  wheels are standard across the range.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 16 parts
  - Sound source: Motif XS/XF based
  - Sounds: 1,000+ presets, 100 user locations
  - VCA: 3 with ADSR envelopes
  - Effects: Hundreds (reverb, delay, chorus, distortion, wah, tremolo, etc.)
  - Keyboard: 49/61/88 keys (61-key adds aftertouch, 88-key has weighted action)
  - Control: MIDI, USB audio/MIDI
  - Controls: Pitch bend and modulation wheels
