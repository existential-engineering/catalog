  enclosure, driven by a built-in Class-D power amplifier, with a
  transformer-balanced XLR input plus an unbalanced 1/4" TS phone input.
details: |-
  The 6301NX is a compact active monitor speaker from Fostex, the latest revision of the 6301 series that has been used for more than 30 years in broadcast facilities and small-scale loudspeaker applications.

  It uses a 10 cm cone-type full-range driver mounted in an aluminum die-cast, closed-type enclosure, driven by a built-in Class-D power amplifier rated at 20 W.

  Inputs are provided on a transformer-balanced XLR-3P connector plus an unbalanced 1/4" (Φ6.3 mm) TS phone jack, with input sensitivity of +4 dBu (balanced) and -14 dBV (unbalanced) into an input impedance of 10 kΩ minimum.

  The amplifier delivers 85 dB/W SPL at 1 m with a maximum SPL of 98 dB, total harmonic distortion of 0.05% (1 kHz/1 W) and residual noise of -70 dBV, across a 70 Hz to 15 kHz frequency range.

  Power is supplied via a universal AC inlet (AC 100-230 V, 50/60 Hz), with consumption of 10 W in operation and under 0.5 W in standby. The unit measures 120 (W) x 189 (H) x 120 (D) mm and weighs 2.27 kg; an inlet-type power cable (2 m) is included.
specs: |-
  - Driver: 10 cm cone full-range unit x 1
  - Enclosure: aluminum die-cast, closed type
  - Amplifier: Class-D
  - Rated output: 20 W
  - Frequency response: 70 Hz to 15 kHz
  - Sound pressure level: 85 dB/W (1 m); maximum 98 dB
  - T.H.D.: 0.05% (1 kHz / 1 W)
  - Residual noise: -70 dBV
  - Balanced input: XLR-3P (transformer type)
  - Unbalanced input: Φ6.3 mm (1/4") TS phone jack
  - Input impedance: 10 kΩ min.
  - Input sensitivity (balanced): +4 dBu (1.2 Vrms)
  - Input sensitivity (unbalanced): -14 dBV (0.2 Vrms)
  - Power requirement: AC 100-230 V (50/60 Hz)
  - Power consumption: 10 W (standby: <= 0.5 W)
  - External dimensions: 120 (W) x 189 (H) x 120 (D) mm
  - Weight: 2.27 kg
  - Included accessories: power cable (2 m, inlet type)
