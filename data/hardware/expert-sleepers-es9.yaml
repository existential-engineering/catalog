name: ES-9
manufacturer: expert-sleepers
primaryCategory: audio-interface
categories:
  - modular
  - utility
hp: 16
url: https://www.expert-sleepers.co.uk/es9.html
description: The ES-9 is a Eurorack 16-in/16-out USB audio interface with
  DC-coupled inputs and outputs that can carry both audio and CVs. Balanced 1/4
  inch main outputs, a headphone socket, S/PDIF sockets and an internal 8x8
  crosspoint mixer make it a one-stop link between a modular synth and a laptop
  or tablet.
details: |-
  The ES-9 is a Eurorack 16-in/16-out USB audio interface, with DC-coupled inputs and outputs that can be used for both audio and CVs. Balanced 1/4 inch main outputs and a headphone socket make it a one-stop solution for integrating a modular synth and a laptop or tablet, in the studio or at a gig.

  The 14 analogue inputs allow simultaneous tracking or mixing of a large number of sound sources in a modular system, while the eight DC-coupled outputs suit controlling the modular from Silent Way, Max/MSP, Ableton CV Tools, Bitwig Studio or similar, or sending audio out to the modular for processing.

  For more outputs, up to 48 of them, the ES-9 can be expanded with the ES-5. The ES-9 has a dedicated pair of audio channels for the ES-5, so unlike the ES-3 or ES-8 no audio outputs are lost when an ES-5 is fitted, and the ES-5 outputs are not themselves audio outputs. A pair of S/PDIF sockets connects other digital audio gear, and a pair of MIDI sockets is provided by way of a breakout.

  The channel count is 16 in and 16 out at sample rates of 44.1kHz, 48kHz, 88.2kHz and 96kHz, with a 24 bit sample depth. The USB socket is Type C and the interface is class-compliant, needing no driver on macOS and iOS, with Windows drivers provided by Expert Sleepers. The panel carries a headphone volume control, and an internal 8x8 crosspoint mixer can be used with no USB connection at all for standalone operation.

  The box contains the ES-9 module, a keyed 16 way 200mm power cable and a bag of four M3x6mm mounting screws. A USB cable is not included, and either a USB C to USB C or a USB A to USB C cable is needed depending on what the ES-9 is connected to.
specs: |-
  - Panel width: 16HP
  - Module depth (including power cable): 50mm
  - Current draw: 451mA on the +12V rail, 133mA on the -12V rail (at 96kHz)
  - USB socket: Type C
  - Driver support: class-compliant USB 2.0, no driver required for macOS and iOS, Windows drivers provided
  - Channel count: 16 in, 16 out
  - Supported sample rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz
  - Audio sample depth: 24 bit
  - Analogue outputs: 8x 3.5mm TS jacks, DC-coupled, maximum output voltage approximately plus or minus 10V
  - Analogue outputs: 2x 1/4 inch TRS balanced jacks, AC-coupled (main outs)
  - Analogue outputs: 1x 1/4 inch TRS stereo jack, DC-coupled (headphones)
  - Analogue inputs: 14x 3.5mm TS jacks, DC-coupled, input voltage range approximately plus or minus 10V
  - Digital I/O: 1x S/PDIF input (TOSlink), 1x S/PDIF output (TOSlink)
  - MIDI I/O: 1 input, 1 output (on breakout)
  - Expansion headers: 1 for ES-5, 1 for MIDI breakout
  - Panel controls: headphone volume
  - Internal mixer: 8x8 crosspoint mixer, usable with no USB connection for standalone operation
