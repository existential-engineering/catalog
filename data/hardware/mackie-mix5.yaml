description: Ideal for musicians, streamers and other content creators, the
  Mackie Mix5 is a 5-channel compact mixer that delivers high-headroom,
  low-noise audio.
details: |-
  For more than 30 years, musicians and engineers have grown up mixing on a Mackie. You can find our mixers everywhere from major venues to small (but mighty) home studios. Now you can join that legacy with the Mackie Mix5 compact mixer.

  Featuring high-headroom preamps, a precision 2-band EQ and more, this 5-channel mixer has everything that musicians, content creators, gamers and podcasters need to get professional sound without the big price tag.

  Channel 1 is a mono channel with an XLR mic input and a 1/4 inch line input sharing one gain control. Channels 2/3 and 4/5 are stereo pairs with left (mono) and right 1/4 inch line inputs. A dedicated stereo RCA pair handles playback and recording.

  Outputs are main mix left and right on 1/4 inch jacks, a stereo RCA tape output and a 1/4 inch headphone jack with its own level control. All jacks sit on the top panel except the power connector, which is on the rear.

  Mix5 runs from a supplied external AC power supply and its XLR input always provides +15V for condenser microphones. The chassis is metal and the unit measures 5.5 x 7.7 x 1.7 inches at 1.4 lb.
specs: |-
  - 5-channel compact mixer with high-headroom, low-noise performance
  - 1 mic/line input with XLR and 1/4 inch jacks
  - 2 stereo 1/4 inch line inputs (channels 2/3 and 4/5)
  - 2-band EQ: low shelving +/-15 dB at 80 Hz, high shelving +/-15 dB at 12 kHz
  - Phantom power for studio condenser mics (+15V, always on at the XLR input)
  - Dedicated stereo RCA inputs/outputs for playback or recording
  - Main L/R outputs and headphone output with separate volume control
  - Equivalent input noise -125 dBu (150 ohm termination)
  - Mic input maximum level +18 dBu, all other inputs and outputs +21 dBu
  - Frequency response +0/-1 dB, 20 Hz to 30 kHz
  - External AC power supply, AC18V 600mA output (US)
  - Dimensions 5.5 x 7.7 x 1.7 in / 140 x 196 x 43 mm, weight 1.4 lb / 0.6 kg
