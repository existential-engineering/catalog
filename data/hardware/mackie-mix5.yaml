name: Mix5
manufacturer: mackie
primaryCategory: mixer
url: https://mackie.com/en/products/mixers/mix-series/mix5.html
description: Don't let its compact size fool you—the Mackie Mix5 compact mixer
  packs a punch. A 5-channel compact mixer with high-headroom preamps and a
  precision 2-band EQ.
details: |-
  For more than 30 years, musicians and engineers have grown up mixing on a Mackie. You can find our mixers everywhere from major venues to small (but mighty) home studios. Now you can join that legacy with the Mackie Mix5 compact mixer.

  Featuring high-headroom preamps, a precision 2-band EQ and more, this 5-channel mixer has everything that musicians, content creators, gamers and podcasters need to get professional sound without the big price tag.
specs: |-
  - 5-channel compact mixer with proven high-headroom, low-noise performance
  - 1 mic/line input with studio-level audio quality
  - 2-band EQ with clean, precise tone shaping
  - Phantom power for studio condenser mics
  - 2 stereo 1/4" line inputs
  - Dedicated stereo RCA inputs/outputs for playback or recording
  - Main L/R outputs
  - Headphone output with separate volume control
  - Rugged, reliable design built to last
  - Extremely compact and portable
