description: Bitbox Micro is an 18 HP Eurorack sampling module with a 2 inch
  touchscreen, offering sample, clip, slicer, and granular playback across 8
  stereo sample pads triggered by touch, CV gates, or MIDI. It streams samples
  up to 4 GB directly from a microSD card and records Eurorack-level audio
  through 8 configurable front-panel jacks.
details: |-
  Bitbox Micro packs the sampling features of the bitbox line into an 18 HP module for smaller racks and smaller budgets, equally at home in the studio or on stage for one-shots, time-synced loops, or live looping. It plays up to 24 stereo polyphonic notes when samples fit in the 64 MB of internal memory, or up to 8 larger stereo samples streaming directly from the microSD card (max sample size 4 GB, many hours of audio). Each of the 8 stereo sample pads per preset can be configured as a single or multi-sample, clip, slicer, granular pad, or new recording, triggered via touch screen, CV gate, or MIDI using one-shot, toggle, or gate launch modes, with tweakable start position, length, pitch, gain, filter, loop mode, launch quantization, ADSR, exclusive grouping, clip sync, slice placement/sequencing, and grain parameters. Five playback modes cover one-shots and loops, multi-sample chromatic/velocity playback, time-synchronized clips, slice-skipping, and granular textures.

  Sample recording captures Eurorack-level audio from a stereo input pair, with each pad configurable for mono or stereo recording and optional sync to clock inputs; recording can be triggered by audio threshold or MIDI, run up to 4 hours long, resample the master output without patching, and automate multi-sample bank recording via MIDI and CV, storing WAV files on the microSD card.

  The 8 front-panel input jacks (silkscreened IN A: 1-4 and IN B: 5-8) can each be individually assigned as a stereo audio input, a gate input, a CV input, or the clock input. Pad audio routes to the 8 front-panel output jacks, usable as 3 stereo pairs or 6 mono outputs plus a combined master stereo output, with all inputs and outputs DC-coupled so CV signals can be recorded and played back. Playback can run free or sync to internal clock, TRS clock in, or MIDI clock in/out over TRS MIDI In/Out jacks compatible with both Type A and Type B wiring. MIDI notes or CV can pitch-shift pads or trigger slices, and up to 8 CV signals plus MIDI can modulate sample parameters, with a Learn mode to skip manual CC mapping.

  Module features include a 2 inch diagonal touchscreen, double the processing power of the original bitbox, built-in reverb and delay, WAV import/export via microSD card, and multiple saved presets. Included in the box: a bitbox micro Eurorack module, a microSD card preloaded with demo presets and samples, a Eurorack power cable, a Quick Start guide, and a MIDI Adapter. Firmware updates are available from forum.1010music.com; the module has been shipping since August 10, 2023.
specs: |-
  - 18 HP Eurorack module
  - Module dimensions: 3.5 x 5 x 1.75 in; WooCommerce package dimensions: 6.9 x 6.75 x 2.4 in
  - Weight: 0.67 lbs
  - Power: +12V 400mA, -12V 0mA, 5V 0mA
  - 24-bit ADC and DAC
  - 2 inch diagonal touchscreen
  - 8 stereo sample pads per preset; 5 playback modes (sample, multi-sample, clip, slicer, granular)
  - 64 MB internal memory cache; microSD streaming up to 4 GB per sample file
  - Up to 24 stereo polyphonic notes from internal memory, or up to 8 larger stereo samples streamed from microSD
  - Supports 1- or 2-channel WAV files at 16/24/32-bit resolution, any sample rate (48kHz preferred)
  - microSD card slot for sample/firmware storage
  - MIDI: TRS mini-jack In/Out, compatible with both Type A and Type B wiring, no adapter needed
  - 8 configurable 1/8-inch input jacks (silkscreened IN A: 1-4, IN B: 5-8), individually assignable to stereo audio input, gate input, CV input, or clock input
  - 8 configurable 1/8-inch output jacks (silkscreened OUT 1-8), routable per pad as 3 stereo pairs or 6 mono outputs plus a combined master stereo output; DC-coupled for CV playback
  - Country of origin: China
  - HS Tariff Code (CAN): 8519.81.00.00
  - SKU: 021
  - Includes: bitbox micro Eurorack module, microSD card with demo presets/samples, Eurorack power cable, Quick Start guide, MIDI Adapter
