description: >-
  A phaser even for people who don't normally like phasers, Arigato delivers
  incredible modulation, range, and warmth, capable of airy psychedelia,
  rumbling wobbles, full wet vibrato sounds, and auto-wah sweeps through
  feedback manipulation.
details: |-
  Arigato neither seeks to recapture the sounds of the past, nor to be state of
  the art. It is a snapshot of a future we were promised as children — Caroline
  Guitar Company's way of saying thank you to customers who for years asked for
  a phaser.

  While capable of the airy psychedelia of classic units, this one is meant to
  rumble, wobble, shake, rattle, and roar. It is also capable of going fully wet
  for interesting vibrato sounds, max feedback for auto-wah sweeps, and a wide
  range of responsive shades throughout each control as they interact with the
  others.

  For those who didn't think they'd like a chorus, but fell in love with the
  Somersault pedal, Caroline believes you're going to really love this thing too.
  While classic one-knob units and their ALL CAPS WHOOSH approach to phasing
  have their place, there's a world of subtle shading and different movement to
  be explored, and Arigato is here for it.

  The first pedal Philippe ever owned was a phaser, and the Caroline team are a
  bunch of phase shifting nuts — releasing this feels like coming home.
specs: |-
  - Weight: 24 oz
  - Dimensions: 2 × 6 × 4 in
  - Full wet vibrato capability
  - Max feedback auto-wah sweep mode
  - Multiple interactive controls with wide range of responsive shading
