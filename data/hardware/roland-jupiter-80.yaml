description: >-
  The Jupiter-80 is a 256-voice polyphonic performance synthesizer featuring
  Roland's Supernatural sampling technology for realistic acoustic sounds
  alongside a Supernatural Synth virtual analog modeled component. Designed as a
  live performance powerhouse, it combines digital sampling and virtual analog
  technologies in a 76-key semi-weighted keyboard. It also incorporates Behavior
  Modeling Technology for enhanced expressive playing capabilities.
details: |-
  The Jupiter-80 represents Roland's modern interpretation of their classic Jupiter line, released over two decades after the original Jupiter-8. Rather than recreating an analog synthesizer, this is a completely digital instrument combining sampling and virtual analog technologies. It features a 76-note semi-weighted synth-action keyboard with pitch/mod wheels, D-Beam controller, four volume part sliders/switches, and four assignable dials.

  The synth employs Roland's proprietary Supernatural sampling technology to deliver extremely realistic and smooth acoustic sounds, alongside a Supernatural Synth virtual analog modeled component capable of generating various waveforms. It also incorporates Behavior Modeling Technology for enhanced expressive playing capabilities.

  The interface relies heavily on an 800 x 480 color LCD touchscreen rather than extensive hardware controls. The synth organizes sounds through Tone, Live Set, and Registration structures, which can initially confuse users familiar with traditional patch-based synthesizers. Effects processing includes 8 multi-FX units, 3 reverbs, 2 compressor-EQ-delay chains, and a global 4-band EQ.

  Although discontinued, the Jupiter-80 received free sound library updates including classic synth emulations. Its premium price placed it out of reach for many users, but it delivered exceptional acoustic sounds and unique performance-oriented features.
specs: |-
  - Polyphony: 256 voices (varies with sound generator load)
  - Multitimbral: 10 internally, 4 via external sequencer
  - Keyboard: 76 keys with velocity and channel aftertouch
  - Controls: Pitch/mod wheels, D-Beam, 4 volume sliders/switches, 4 assignable dials
  - Display: 800 x 480 color LCD touchscreen
  - Effects: 8 multi-FX (4 upper, 4 lower), 3 reverbs, 2 compressor-EQ-delay chains, global 4-band EQ
  - Arpeggiator: 128 preset styles, 128 user styles
  - Connectivity: MIDI In/Out/Thru, USB
  - Sound Engine: Supernatural sampling + Supernatural Synth virtual analog modeling
