description: Stereo reverb pedal from the AUTO Series, offering PLATE, SPRING
  and HALL algorithms with selectable stereo spread, whose parameters are
  automated by playing dynamics and note pitch through an attenuverter beside
  each effect knob.
details: |-
  The AUTO Series fuses classic pedal design with parameter automation. With every AUTO Series pedal the performance becomes an integral part of the effect: touch, playing dynamics and note choices shape the tones and textures, responding to the playing and evolving in real time, so the sound design is woven into the musical expression rather than set once and left alone.

  The automation is customised with the DYNAMICS and PITCH knobs and their dedicated mode switches, which set the DYNAMICS decay time, introduce glide to PITCH tracking and tailor the response curves to a playing style. Each of the primary effect knobs is paired with a corresponding smaller adjustment knob, an attenuverter, which dials in the variation amount and direction for that effect knob independently. A loud strum can turn one knob clockwise significantly while only slightly nudging another in the opposite direction, covering everything from gentle parameter shifts to sweeping, full-parameter transformations.
specs: |-
  - 3 algorithms: PLATE, SPRING and HALL
  - 4 streamlined controls: LEVEL, DECAY, TONE, DRIVE
  - 3 stereo spread settings: 0%, 50%, 100%
  - Stereo and mono signal processing. Stereo routing is possible both using regular TS mono cables or TRS stereo cables
  - Switchable input level: INSTRUMENT, LINE or EURORACK
  - Switchable LEVEL knob functionality: INPUT LEVEL + DRY SOUND, INPUT LEVEL + KILLDRY or DRY/WET MIX
  - TRACK input for routing an auxiliary signal for controlling the automation
  - TRACK output for passing the TRACK input further or for dry signal output
  - MIDI/CLK input for MIDI clock or analog trigger sync for time base effects
  - 9V DC center negative power inlet, power supply of at least 250 mA is required
  - USB-C input for MIDI and future updates
  - 4 patch cables included in the package
  - Pedal weight 600 g / 1.3 lbs
  - Pedal dimensions LWH 15.2 x 10.2 x 7.5 cm / 6 x 4 x 3 in
  - Made in the EU, Riga, Latvia
