url: https://products.electrovoice.com/na/en/zlx-g2-passive-loudspeaker/
description: Next-generation passive variants of Electro-Voice's bestselling ZLX
  professional loudspeaker series, offered in 8-inch, 12-inch, and 15-inch
  models with increased maximum SPL, extended frequency response, and a robust,
  ergonomic enclosure for portable live-sound and installation use.
details: >-
  The ZLX-G2 passive series is the second generation of Electro-Voice's ZLX
  loudspeaker line, comprising the ZLX-8-G2 (8-inch), ZLX-12-G2 (12-inch), and
  ZLX-15-G2 (15-inch) two-way passive cabinets. Each pairs a ferrite-magnet
  low-frequency transducer (WECA2088 / WECA2128 / WECA2158) with the DH-1K
  1.4-inch titanium-diaphragm compression driver, crossed over at 2 kHz behind
  Electro-Voice's patented Signal Synchronized Transducers (SST) waveguide for a
  uniform 90 degree horizontal by 60 degree vertical coverage pattern.


  All three models share an 8-ohm nominal impedance and 250 W continuous / 1000
  W peak power handling, with maximum SPL of 124 dB (8-inch), 125 dB (12-inch),
  and 126 dB (15-inch) measured at 1 m. Each cabinet supports a 55-degree
  floor-monitor tilt; the 12- and 15-inch models add a second 23-degree
  'kickback' monitor angle.


  Signal input is via two industry-standard NL4 (Speakon-compatible) connectors
  wired in parallel and passing through all pins, so a single jack can feed the
  speaker while the other daisy-chains to an additional cabinet. Electro-Voice
  recommends pairing ZLX-G2 with Dynacord DSP power amplifiers using the
  dedicated speaker presets in the SONICUE EV Speaker Database. Accessories
  include padded covers, the ZLX-G2-BRKT wall-mount bracket (12-/15-inch), a
  truss-clamp adapter for the 8-inch model, and the BRKT-POLE-L pole-mount
  bracket.
specs: >-
  - Configuration: 2-way passive loudspeaker series (8-/12-/15-inch)

  - ZLX-8-G2 frequency response (-3 dB): 67 Hz - 20 kHz

  - ZLX-12-G2 frequency response (-3 dB): 69 Hz - 18.5 kHz

  - ZLX-15-G2 frequency response (-3 dB): 68 Hz - 18 kHz

  - Maximum SPL @ 1 m: 124 dB (8-G2), 125 dB (12-G2), 126 dB (15-G2)

  - Axial sensitivity (1 W @ 1 m): 90 dB (8-G2), 93 dB (12-G2), 95 dB (15-G2)

  - Power handling: 250 W continuous / 1000 W peak (all models)

  - Nominal impedance: 8 ohms (all models)

  - Crossover frequency: 2 kHz

  - Coverage pattern: 90 degrees H x 60 degrees V

  - High-pass frequency (recommended preset): 60 Hz (8-G2), 48 Hz (12-G2), 40 Hz
  (15-G2)

  - LF transducer: WECA2088 8-inch (8-G2), WECA2128 12-inch (12-G2), WECA2158
  15-inch (15-G2), ferrite magnet

  - HF transducer: DH-1K 1.4-inch titanium-diaphragm compression driver

  - Waveguide: EV Signal Synchronized Transducers (SST)

  - Monitor angles: 55 degrees (all models); additional 23-degree 'kickback' on
  12-/15-inch

  - Connectors: Dual NL4 Speakon, wired in parallel (pass-through all pins)

  - DSP/preset support: SONICUE EV Speaker Database (recommended with Dynacord
  DSP amplifiers)

  - Dimensions ZLX-8-G2 (H x W x D): 459.6 x 289.9 x 280.5 mm (18.09 x 11.41 x
  11.04 in)

  - Dimensions ZLX-12-G2 (H x W x D): 621.1 x 356.2 x 356 mm (24.45 x 14.02 x
  14.01 in)

  - Dimensions ZLX-15-G2 (H x W x D): 697.6 x 422.8 x 383.1 mm (27.46 x 16.65 x
  15.08 in)

  - Net weight: 10.15 kg / 22.38 lb (8-G2), 14.26 kg / 31.44 lb (12-G2), 16.44
  kg / 36.24 lb (15-G2)
