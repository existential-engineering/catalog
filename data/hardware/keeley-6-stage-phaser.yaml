details: |-
  Keeley no longer produces this phaser, and the page states that a replacement design was due before the end of October 2014.

  The pedal is a 100 percent analog signal path design with modern control features including tap tempo. An Edge control sets the voicing, covering everything from mellow phasing through to aggressive, cutting settings, and the rate can be sped up or slowed down with a brake-like function or tapped in.

  The phasing circuit is a six-stage design based on OTA integrated circuits, which are known for rich, deep phasing that is less mechanical than JFET-based circuits. It has a resonant response at slow speeds and a shimmer at faster settings.

  The control circuitry is digital while the audio path is not: the signal is never sampled, and the digital section only adjusts the analog effect, in the manner of a technician turning the knobs. A ramp function merges between two different speeds, modelled on the brake of a Leslie cabinet. The design idea came from David Szabados, who also worked on the Time Machine Boost. Finishes offered were Translucent Blue, Black Sparkle and Classic Silver, with custom colours available.
