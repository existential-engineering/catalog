name: VQ 100
manufacturer: tannoy
primaryCategory: speaker
url: https://www.tannoy.com/en/products/0312-aoy
description: The VQ 100 is a full range, self-powered, three-way loudspeaker
  system designed for applications which require very high output capability
  with class leading pattern control.
details: |-
  The VQ 100 is a full range, self-powered, three-way loudspeaker system designed for applications which require very high output capability with class leading pattern control. The VQ 100 is perfectly suited for use in arrays or singly in demanding applications. Unlike line array solutions, the VQ 100 can produce enough power and clarity to be used individually, or in paired clusters for wider coverage, maintaining your building's aesthetics and sight lines. With low frequency extension to 90 Hz, the VQ 100 can be combined with various subwoofers from the VSX series for extended bandwidth. The Dual Concentric driver with PSW (Point Source Waveguide) achieves an optimum balance of extremely well controlled coverage, smooth frequency response, and natural sound character. The low frequency section, two 12" low frequency transducers, offers high power handling and low power compression for high continuous SPL capability.
specs: |-
  - frequencyResponse: 115 Hz – 23 kHz (-3 dB)
  - frequencyRange: 90 Hz – 27 kHz (-10 dB)
  - sensitivity: 111 dB (1 W @ 1 m)
  - dispersion: 100 degrees conical (-6 dB)
  - driverComponents: LF - 2 x 300 mm (12") low frequency transducers, semi horn loaded; Dual Concentric 3.5" and 1.75" diaphragm compression drivers (MF/HF)
  - crossover: N/A
  - directivityFactorQ: 8.5
  - directivityIndexDI: 9.3
  - maximumSPL: 135 dB averaged, 141 dB peak
  - powerHandlingLF: 1000 W continuous, 2000 W peak (@ 4 Ω)
  - powerHandlingMF: 200 W continuous, 400 W peak (@ 8 Ω)
  - powerHandlingHF: 90 W continuous, 180 W peak (@ 8 Ω)
  - powerHandlingPassiveMFHF: 200 W continuous, 400 W peak (@ 8 Ω)
  - totalPower: 1,300 W continuous, 5,200 W peak
  - nominalImpedance: LF - 4 Ω, MF - 8 Ω, HF - 8 Ω
  - construction: 18 mm (0.71") plywood, internally braced
  - grille: Powder coated perforated steel grille
  - finish: Textured black paint
  - connectors: 4-pole twist-lock and barrier strip connectors for input and link output
  - fittings: 8 x recessed carrying handles, 12 x M10 flying inserts
  - dimensions: 925 x 694 x 515 mm (36.4 x 27.3 x 20.3")
  - weight: 65 kg (143 lbs)
  - operatingModes: Bi-Amp or Tri-Amp capable; passive MF/HF mode available
  - compatibility: Lake LM26/44 DSP, Lab Gruppen platforms; pairs with VSX series subwoofers
