description: A dual-channel bass pedal combining the 4 Wheeler Fuzz on the right
  side with an SVT-inspired preamp/overdrive on the left, with an order toggle
  switch to select which circuit comes first.
details: |-
  One pedal that you can use in every gig for the rest of your life. The right side is the 4 Wheeler Fuzz that can dish out almost any fuzz tone your bass desires. The left side is a special preamp/overdrive based on the famous SVT tone. With Volume, Drive, Bass and Treble, the preamp side can serve as an always-on enhancement all the way to a tube-flavored distortion. On V3, an order toggle switch lets you choose what circuit comes first in the chain when run together, and the enclosure was shrunk to the standard Double Barrel/Sweet Tea 2-in-1 size.

  VERSION HISTORY:
  V1 = larger enclosure, brown transparent color
  V2 = current color, Panda Pre drive section adjusted for more clean headroom
  V3 = smaller enclosure, order toggle added, 4 Wheeler side has hi/low switch
