id: VWcpVh12-tjvKIXiFMf7G
name: CG-2000
manufacturer: tascam
primaryCategory: outboard
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/cg-2000
description: Professional 1U rack-mount master clock generator for broadcasting
  stations and post-production facilities, featuring an OCXO (±0.01ppm accuracy)
  with redundant power supplies and redundant A/B video/word clock inputs for
  mission-critical reliability. Distributes word clock, AES3/11, S/PDIF, and
  video sync across 12 BNC word clock outputs, 4 BNC video outputs, 2 AES XLR
  outputs, and 2 S/PDIF RCA outputs. Accepts 10MHz atomic/GPS calibration input.
details: |-
  1U rack-mount master clock generator for broadcast and post facilities. OCXO oscillator: ±0.01ppm accuracy, ±0.005ppm/day stability. Redundant A/B video reference inputs and redundant A/B word clock inputs with automatic failover. Calibration BNC accepts 10MHz or PPS signals from rubidium/GPS atomic references. Distributes via 12 BNC word clock outputs (1.0–3.5Vp-p adjustable, 32k–192kHz; outputs 11–12 support ¼Fs–256Fs), 4 BNC video outputs (SD black burst NTSC/PAL + HD Tri-level), 2 AES3/11 XLR outputs, 2 S/PDIF RCA outputs. Dual independent power supply circuits with dual IEC power cords. USB Type-B for firmware updates. Alarm output (6-pin Euroblock, open collector). 128×64 display, panel-lock switch. AC 100–240V, 14W.
specs: |-
  - - Oscillator: OCXO; ±0.01ppm; ±0.005ppm/day
  - Video in: 2× BNC redundant (NTSC/PAL/HD Tri-level); 75Ω
  - WC in: 2× BNC redundant; 32k–192kHz; 75/50Ω selectable
  - 10MHz in: 1× BNC; 50Ω
  - AES3/11 in: 1× XLR; 110Ω; 32k–192kHz
  - Video out: 4× BNC; 75Ω
  - WC out: 12× BNC; 1.0–3.5Vp-p; 75Ω; up to 256×Fs (ch11–12)
  - AES3/11 out: 2× XLR; 2.5Vp-p; 110Ω
  - S/PDIF out: 2× RCA; 0.5Vp-p; 75Ω
  - USB: Type-B; USB 2.0 Hi-Speed
  - Power: AC 100–240V; 14W; dual power supply circuits
  - Dimensions: 483×45×310mm (1U); weight: 3.3kg
