description: "The DN360-P2H-B combines two of the DN-series configuration
  options in one unit: pin 2 hot XLR wiring and balanced transformer outputs.
  The processing engine is the DN360 platform, dual 30-band Proportional-Q
  analogue graphic equalisation in a 3U rackmount chassis."
details: |-
  The pin 2 hot configuration aligns with current international standard practice, while the transformer output stage delivers the galvanic isolation that broadcast and fixed-install engineers depend on for clean signal distribution.

  The processing engine is the DN360 platform: dual 30-band Proportional-Q graphic equalisation. The curve characteristic is wide and musical at small excursions and surgical at large ones, which is what made Klark Teknik the global reference for live and installed equalisation.

  An 18 dB/octave low-cut filter per channel removes subsonic content before it impacts amplifier headroom.

  Mechanical execution matches the rest of the DN360 family: 3U rackmount chassis, 30 mm oil-damped faders with centre detents, channel bypass and scale-selection switches, power-off bypass relays, and industry-standard XLR connectors configured pin 2 hot with transformer-balanced outputs.

  The DN360-P2H-B is now obsolete; service and documentation remain accessible through Music Tribe Care.
specs: |-
  - Dual channel, 30 band 1/3 octave graphic equalisation per channel
  - Proportional-Q filter response
  - Transformer-balanced outputs
  - Low-cut filter: 18 dB/octave, one per channel
  - 30 mm oil-damped faders with centre detents
  - Channel bypass and scale-selection switches
  - Power-off bypass relays
  - XLR connectors wired pin 2 hot
  - 3U rackmount chassis
