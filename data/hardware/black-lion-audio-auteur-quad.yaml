name: Auteur Quad
manufacturer: black-lion-audio
primaryCategory: preamp
categories:
  - rack-mount
url: https://blacklionaudio.com/en/products/auteur-quad
description: 4-channel rack-mount mic preamp based on the Auteur mkII with Edcor
  transformers
details: The Auteur Quad is a 4-channel 1U rack-mount solid-state microphone
  preamplifier based on the Auteur mkII. It features a fast, transparent
  IC-based front end paired with a fat, colorful back end via Edcor
  transformers. Channels 1 and 2 feature front-panel Hi-Z DI inputs borrowed
  from the 500-series Auteur. VU meters on all four channels. Each channel
  includes +48V phantom power, -10dB pad, and polarity reverse. 10Hz-30kHz
  frequency response.
specs: |-
  - Preamp Type: Solid State
  - Number of Channels: 4
  - Transformers: Edcor
  - Phantom Power: Yes (+48V, per channel)
  - Pad: -10dB
  - Polarity Switch: Yes
  - VU Meters: Yes (4 channels)
  - Frequency Response: 10Hz-30kHz
  - Form factor: 1U rackmount
  - Power Source: 4-pin DIN external power supply (included)
  - Dimensions: 19" W x 1.8" H x 7.6" D
  - Weight: 6.1 lbs.
