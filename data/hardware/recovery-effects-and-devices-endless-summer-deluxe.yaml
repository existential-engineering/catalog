details: |-
  Endless Summer Deluxe

  The Endless Summer Deluxe is a majestic, lush-sounding, stereo spring reverb designed for studio use. Two separate reverb tanks have independent controls for various stereo sculpting options. Create infinite spatial possibilities by inserting a channel on individual instruments, using it as a mono or stereo aux, or inserting it on an entire mix. The Endless Summer Deluxe runs at line level and creates a bold tone with low noise. No plug-ins are necessary! Designed and assembled in Seattle, Washington. Endless Summer Deluxe manual

  Check out the review of the Endless Summer Deluxe in TapeOp Magazine . * Endless Summer Deluxe units are custom-made and take 8–10 weeks to produce. Some components may be subject to change based on availability. All sales are final.
