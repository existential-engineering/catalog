description: The P2 makes podcasting easy. With 2 USB mic inputs and 2 headphone
  outputs, the P2 lets you record high-quality podcasts anywhere.
details: |-
  The PodTrak P2 is a two-input podcast recorder built for USB microphones. Two USB Type-A mic ports supply bus power to the mics and feed dedicated volume knobs and level meters, and two headphone outputs let both speakers monitor. Recording goes to a microSD card, up to four tracks at 48 kHz 24-bit, as a ready-to-share stereo mix or as individual tracks for post-production.

  A call-in guest joins by connecting a phone or computer to the rear USB port, and the built-in mix-minus function removes echo and feedback from the call automatically. Connected to a phone, the P2 can record audio straight onto the phone's video, and it can stream to a phone or computer while recording to the card at the same time.

  Three processing blocks run on the inputs. AI Noise Reduction learns, analyses and reduces background noise during conversation and during quiet moments alike. The TONE feature applies EQ and de-essing. The built-in compressor smooths out sudden shouts, laughter and whispers.

  Over USB-C the P2 works as a 2-in/2-out audio interface at 48 kHz 24-bit, recording two USB mics to a computer, smartphone or tablet. The P2 Editor companion application for Windows and Mac opens up further recording and audio interface settings.

  Power comes from four AA batteries or over USB from a mobile battery, bus power or a 12 W or higher adapter. Audio notifications announce low battery, storage space and setting changes through the headphone output without interrupting the recording, and files auto-save every 10 seconds so a power loss does not cost a take.
specs: |-
  - 2 mono USB mic inputs (a stereo input and its mics are mixed to mono) and 2 stereo headphone outputs
  - USB mic connectors: USB Type-A, bus power 5 V at 700 mA maximum total for USB mics 1 and 2
  - Headphones: stereo mini jack x 2, maximum output level 20 mW + 20 mW per output into a 32 Ohm load, output impedance 10 Ohm or less, one volume knob shared by both outputs
  - Effects: TONE, AI NOISE REDUCTION, COMP
  - Maximum simultaneous recording tracks: 4, maximum simultaneous playback tracks: 4
  - Recording format: WAV 48 kHz / 24-bit, stereo or mono
  - Recording media: microSDHC and microSDXC cards, up to 1 TB
  - USB (for data): USB Type-C, USB 2.0 High Speed
  - Audio interface: 2 in / 2 out, 48 kHz, 24-bit, works with a computer, smartphone or tablet
  - Mix-minus on the call-in guest connected to the rear USB port
  - Auto-save every 10 seconds
  - Audio notifications for low battery, storage space and settings through the headphone output
  - P2 Editor companion software for Windows and Mac adds further recording and audio interface settings
  - Power: 4 AA batteries (alkaline, lithium or rechargeable NiMH), USB DC5V power port, or USB bus power from a 12 W or higher adapter (5 V, 2.4 A or higher)
  - Battery life recording a stereo mix with two ZOOM ZUM-2 mics: about 3.5 hours alkaline, about 5 hours NiMH 1900 mAh, about 10 hours lithium
  - Power consumption: 8 W maximum
  - Dimensions: 82 mm (W) x 116 mm (D) x 43 mm (H)
  - Weight including batteries: 226 g
