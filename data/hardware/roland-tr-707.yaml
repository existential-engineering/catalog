description: >-
  The Roland TR-707 is a digital drum machine released in 1985 that closely resembles the
  popular TR-909, sharing nearly identical hi-hat, cymbal, and clap sounds. It features 15
  sampled drum tones with 8-bit resolution (6-bit for crash and ride cymbals), a matrix
  display for pattern visualization, and individual outputs for each drum tone. The TR-707
  supports both MIDI and DIN sync control, making it a versatile and affordable
  alternative for classic Roland drum sounds.
details: |-
  The Roland TR-707 is a very underrated drum machine that shares a striking resemblance to the iconic TR-909. Its hi-hat, cymbal, and hand clap sounds are almost identical to those of the TR-909, making it an excellent and affordable source for classic 909-style samples.

    The TR-707 offers solid programming capabilities with built-in shuffle and flam effects. It provides individual outputs for each of its drum tones, which is particularly useful in a studio setting for processing each sound separately. However, the only adjustment available for each drum tone is volume, which limits real-time sound shaping.

    While the hi-hats, cymbals, and claps are highly regarded, some of the other drum tones—particularly the ride, kick, and snare—are considered less inspiring. Despite this limitation, the TR-707 has found favor with numerous notable electronic musicians including Aphex Twin, Laurent Garnier, Squarepusher, Luke Vibert, Freddy Fresh, Phil Collins, Marshall Jefferson, and Plastikman.
specs: |-
  - Sound Engine: Sample Playback / Acoustic Simulation
    - Bit Depth: 8-bit (drum sounds), 6-bit (crash and ride cymbals)
    - Tones: 15 sampled sounds (kick 1, kick 2, snare 1, snare 2, low tom, mid tom, high tom, rim shot, cowbell, hand clap, tambourine, open hi-hat, closed hi-hat, crash cymbal, ride cymbal)
    - Effects: Shuffle, Flam
    - Patterns: 64
    - Songs: 4
    - Sequencer: Built-in step sequencer
    - Display: Matrix display for pattern visualization
    - Outputs: Individual outputs for each drum tone
    - MIDI: MIDI In, MIDI Out
    - Sync: DIN Sync In, DIN Sync Out
    - Trigger: Trigger Out (outputs rim shot sound as trigger)
    - Keyboard: None
    - Year Produced: 1985
releaseDate: "1985"
