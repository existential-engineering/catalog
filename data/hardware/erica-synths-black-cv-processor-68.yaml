url: https://www.ericasynths.lv/black-cv-processor-68/
description: Erica Black CV Processor allows you to manage CV signal levels and polarity.
details: |-
  The Erica Black CV Processor manages CV signal levels and polarity. It works on audio signals as well as control voltages, offering attenuversion, boosting and offsetting.

  The module contains two parts. The input of the bottom one is normalled to the output of the top one, and if a signal is plugged into the input of the top part only, it is split into two signals, each of which can be independently altered.

  Each part offers direct and inverted signal outputs, a bicolour LED for signal state and diode protection on reversed power supply.

  CV input signal level spans -10V to +10V. The module is 6HP wide and 25mm deep, drawing +20mA and -20mA.
specs: |-
  - CV/audio signal attenuverter/booster
  - CV/audio signal offset
  - Direct and inverted signal outputs
  - Bicolour LED for signal state
  - Diode protection on reversed power supply
  - CV Input signal level -10V – +10V
  - Power consumption +20mA, -20mA
  - Module width 6HP
  - Module depth 25mm
