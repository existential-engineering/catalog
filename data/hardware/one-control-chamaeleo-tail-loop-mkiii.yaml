description: A programmable 5-program loop switcher featuring 4 series loops, 1
  separate loop, master bypass, mute/tuner out switch, and a BJF buffer, capable
  of storing 50 programs across 10 banks.
details: |-
  The Chamaeleo Tail Loop MKIII by One Control is a compact and lightweight 5-program loop switcher designed for enhancing the usability of effect pedals on your board while saving space. Equipped with 4 series loops, 1 separate loop, a tuner out-mute switch, and a power supply, the Chamaeleo Tail Loop MKIII offers versatility and control over your pedalboard setup. It can power up to 6 effectors and store 50 programs across 10 banks. Features at a Glance:

  50 Program Memory:
  Store up to 50 programs (10 banks x 5 programs). Bank Limiting: Limit the number of banks used for simpler navigation. 4 Series Loops + 1 Separate Loop: Flexibility for signal routing. Master Bypass: Bypass the entire switcher with a press of the PGM switch. Mute Switch with Tuner Out: Instant muting for tuning and stage use. BJF Buffer: Natural, transparent buffer circuit for signal integrity. 1. Powering the Unit:

  The Chamaeleo Tail Loop MKIII requires a DC 9V power supply (One Control EPA-2000 recommended) and can power up to 6 pedals through its 6 DC OUTs. Ensure all connected pedals use center-minus polarity and ensure the total current does not exceed 200mA. 2. Operating Modes

  2.1 Program Mode - In Program Mode, you can store and recall presets containing specific ON/OFF configurations of connected pedals. - The unit can store up to 50 programs (10 banks x 5 programs). 2.2 Direct Mode - Direct Mode allows for instant ON/OFF control of individual pedals, bypassing the programmed presets. - To switch between Program Mode and Direct Mode, press and hold the BANK foot switch for at least 2 seconds. Note: Any changes made in Direct Mode will not be saved into the preset. 2.3. Bank Selection - Banks are changed using the BANK foot switch on the far-right side of the unit. - Press the switch to cycle through the available banks. Once you reach the highest bank, the selection will loop back to the lowest bank (cycle selection). 3. To limit the number of banks you use:

  1. Enter Direct Mode by holding the BANK switch for 2 seconds. 2. Use the L1 button to set the maximum bank and the L2 button to set the minimum bank. 4. Series and Separate Loops:

  The unit features 4 series loops where pedals are connected in sequence. The separate loop is an independent loop that can be used for routing effects in different signal paths, such as running effects in an amplifier's effects loop or in front of the input buffer. By combining the series and separate loops, you can create more flexible configurations for your pedalboard. 5. Master Bypass:

  The Master Bypass allows you to bypass the entire switcher, deactivating all loops at once. To enable Master Bypass:
  1. Power on the unit while holding down the BANK foot switch. 2. Press the selected PGM switch to activate the Master Bypass. 6. Mute/Tuner Out Switch:

  The Chamaeleo Tail Loop MKIII has an independent MUTE/TUNER OUT switch. When engaged, the output is muted while simultaneously sending a signal to the tuner. This is useful for silent tuning on stage or muting the signal during breaks. 7. BJF Buffer:

  The BJF Buffer is designed for transparent signal integrity: - Gain set at exactly 1. - Input impedance to preserve tone. - Minimal noise and no signal degradation under overload. The BJF Buffer can be used independently of the switcher. To use only the buffer: - Connect the guitar or signal source to BUFF IN and the amplifier or next effect to BUFF OUT. 8. Lock Switch:

  Use the Lock Switch to limit bank access:
  1. Enter Direct Mode by holding the BANK switch for 2 seconds. 2. Use the L1 button to set the maximum bank (END BANK) and the L2 button to set the minimum bank (START BANK). - A dot will appear on the display when adjusting the END BANK. 9. Technical Specifications:

  Power Supply: DC 9V (center minus). Current Consumption: Up to 200mA. Size: - Without protrusions: 440mm (W) x 56mm (D) x 38mm (H). - With protrusions: 440mm (W) x 63mm (D) x 54mm (H). Weight: 740g. By utilizing the versatile features of the Chamaeleo Tail Loop MKIII, you can streamline your pedalboard setup, making it more efficient and manageable. Whether you're using a handful of pedals or managing a more complex rig, this loop switcher provides all the tools necessary for effective signal routing and control. We Make Switching Easy. ・ Chamaeleo Tail Loop MKIII Manual .pdf

