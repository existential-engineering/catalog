description: The 1023L is a 500 Series preamp/EQ module based on the classic
  1023, featuring the mic/line preamp from the 1073 with significantly expanded
  frequency options in the high and mid sections, allowing the mid bell curve to
  be played directly against the high and low shelves where they overlap.
details: |-
  The 1023L — based on the classic 1023 — takes the preamp and EQ from the 1073 and expands upon it with significantly more frequency options in the high and mid sections, even allowing users to play the mid bell curve directly against the high and low shelves where they overlap.

  The 1023L is completely handwired using Carnhill (St. Ives) transformers. It has the exact same mic/line preamp as the 1073, but with significantly more frequencies in the mid and high sections.

  Aside from simply offering more frequency settings to play with, these expanded EQ sections also allow you to play the mid bell curve directly against the high and low shelves where they overlap. This capability opens the tone shaping possibilities in very interesting and musical ways.

  The high frequency section offers ±16dB shelving at five selectable frequencies (10kHz, 12kHz, 16kHz, 20kHz, 24kHz), while the low frequency section provides ±16dB shelving at 35Hz, 60Hz, 110Hz, and 220Hz.

  The mid range section offers ±12dB or ±18dB peaking with 11 selectable centre frequencies spanning 160Hz through 10kHz, and a high pass filter at 18dB/octave slope switchable between 50Hz, 80Hz, 150Hz, and 300Hz.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Gain: 0 to 80dB
  - Equivalent Input Noise: -110dBu (Unweighted, 300kHz Bandwidth)
  - Maximum Output Level: +27.4dBu @ 600Ω
  - Mic Input Impedance: ≈1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ≈150k ohms
  - Output Impedance: 65 ohms
  - Common Mode Rejection Ratio: 100dB min @ 60Hz
  - High Frequency EQ: ±16dB shelving at 10kHz, 12kHz, 16kHz, 20kHz, 24kHz
  - Low Frequency EQ: ±16dB shelving at 35Hz, 60Hz, 110Hz, 220Hz
  - Mid Frequency EQ: ±12dB or ±18dB peaking at 160Hz, 270Hz, 360Hz, 510Hz, 700Hz, 1.6kHz, 3.2kHz, 4.8kHz, 7.2kHz, 8.2kHz, 10kHz
  - High Pass Filter: 18dB/octave slope, switchable at 50Hz, 80Hz, 150Hz, 300Hz
  - EQ on/off switch
  - Phase reversal button (180°)
  - Power: 115/230 VAC, 28W
  - Weight: 6 lbs / 2.72 kg
  - Dimensions: 45mm W × 8.75" H × 10.5" D
  - Transformers: Carnhill (St. Ives)
  - Construction: Completely handwired
