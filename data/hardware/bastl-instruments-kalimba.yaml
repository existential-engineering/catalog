details: |-
  Bastl Kalimba is a unique desktop instrument that combines microphones, touch sensors, and an accelerometer with a user interface inspired by the traditional kalimba and its main interaction element: the tines. Plucking the Kalimba's tines with varying intensity is captured by internal microphones and touch-sensitive areas, which then excite both the physical modelling engine and the FM engine. In certain settings, you can even excite the engine by knocking or strumming on the unit's casing or directly on the tines.

  Motion and expressiveness are central to this instrument. The internal accelerometer acts as an alternative exciter for the physical modelling engine, while also interacting with the FM engine by dynamically filtering the left and right channels as you move and rotate the device. The front panel features function-based touch points (for creating pads, pitch slides, and timbral modulation) and there are also 2 function-assignable ones on the back of the device.

  The instrument includes custom scales, octave shifting, an arpeggiator, presets, an internal layering looper, tempo/metronome, and built-in effects such as reverb, delay, bit-crush, overdrive, filtering, and modulation. With sensitivity of internal microphones well tuned to avoid feedback on a loud stage, a rechargeable battery via USB-C, and a built-in speaker, the Bastl Kalimba is designed as a great companion for both stage performance and outdoor/commuting adventures.

  The instrument comes with a compact protective hardshell carry case.
