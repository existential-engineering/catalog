description: The Chandler Limited TG12411 Channel (formerly TG Channel MKII)
  combines the TG2 preamp section with an equalizer redesigned from the EMI
  TG12410 Transfer Console — a recreation of the passive inductor EQ found in
  the Abbey Road mastering chain.
details: |-
  The Chandler Limited TG12411 Channel is a recreation of several classic EMI circuits, combining Wade Goeke's design of the TG2 preamp section with an equalizer redesigned from a circuit used in the TG12410 Transfer Console, the mastering counterpart to the original Beatles desks. The active portions use the same discrete amplifiers and transformers as the TG1 Limiter and TG2 Pre Amp. The TG12411's passive equalizer is an all-inductor design offering sweet high frequencies, large inductor-based lows, and a very high Q mid cut section, comparable to Pultec and Lang program EQs.

  As of late 2016, the TG Channel MKII was renamed the TG12411; there has been no modification to the MKII circuit. All TG units require the PSU-1, Chandler Limited power supply (purchased separately).
