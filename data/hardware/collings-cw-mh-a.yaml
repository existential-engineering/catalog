description: The CW Mh A (Collings Winfield) is a modified dreadnought acoustic
  guitar designed for flatpicking specialists, named after the Walnut Valley
  Festival in Winfield, Kansas. It features an Adirondack spruce top with an
  enlarged soundhole and a pre-war scalloped X-brace pattern for maximum
  projection and headroom. Honduran mahogany back, sides, and neck are paired
  with an ebony fingerboard and bridge for a focused, resonant tone suited to
  bluegrass performance.
details: |-
  The CW Mh A is the Collings Winfield model — a modified dreadnought built for aggressive flatpicking. The enlarged soundhole and pre-war scalloped X-brace (no soundboard graft or tongue brace) deliver plenty of headroom and projection while maintaining the signature Collings tone. Adirondack spruce is used for both the top and bracing, paired with Honduran mahogany back, sides, and neck. The ebony fingerboard has a 14"–26" compound radius and no inlay, reflecting a no-frills working-musician aesthetic. Hardware includes Nickel Waverly tuners, bone nut and saddle, and an ebony belly-style bridge with a 2 1/4" string spacing. Body binding is tortoise with b/w/b/w top purfling. Finish is high gloss nitrocellulose lacquer on the body and high gloss polyester resin on the neck.
specs: |-
  - Top: Adirondack spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony (no inlay)
  - Fingerboard Radius: 14" - 26" compound
  - Bridge: Ebony belly-style, 2 1/4" spacing
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Nut: Bone, 1 23/32"
  - Saddle: Bone, cutthrough
  - Neck Profile: Modified V
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Frets: Medium 18% nickel-silver
  - Tuners: Nickel Waverly
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Fingerboard Binding: .100" Tortoise with b/w purfling
  - Rosette: b/w purfling
  - Soundhole: Enlarged
  - Backstrip: 1-style (Walnut)
  - Pickguard: Dalmatian
  - Scale Length: 25 1/2"
  - Brace Material: Adirondack spruce
  - Brace Pattern: Pre-war scalloped X-brace (no soundboard graft/tongue brace)
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
  - Strings: D'Addario EJ-17 (.013" - .056")
