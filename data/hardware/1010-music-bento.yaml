description: Bento is a portable, all-in-one sampling production lab with a 7"
  touchscreen, 16 pressure- and velocity-sensitive pads, and 8 tracks that can
  each be configured as sample banks, multisamples, slicers, granular or
  wavetable synths, loops, or external MIDI, built around scene-based
  sequencing, modulation, and effects.
details: |-
  Bento is a portable, all-in-one sampling production lab that combines flexible sequencing, expressive performance tools, and pro-level connectivity. A 7" touchscreen, 16 pressure- and velocity-sensitive pads, and 8 context-sensitive endless encoders control 8 flexible tracks, each of which can be loaded as a sample bank (one-shot), multisample, slicer, granular synth, loop, wavetable synth, or external MIDI track.

  Recording is built in: capture loops synced to the internal clock or triggered by an audio-level threshold, record takes up to 4 hours long, and resample the master output internally without external patching. Scene-based sequencing (step, piano roll, and probability modes) and a modulation system of LFOs, envelopes, and step sequencers sit alongside an FX section (delay, reverb, chorus, flanger, phaser, overdrive) with per-track routing.

  Designed to replace a laptop in a live or mobile rig, bento provides 3 stereo audio inputs, 3 stereo audio outputs, a headphone output, dual TRS MIDI in/out, and USB-C host and device ports, powered by an internal battery rated for about 3 hours of mobile use. Everything is stored on a required microSD card (the unit has no internal memory or built-in speaker); the included card ships with 155 patches and over 5,000 sample files.
specs: |-
  - 8 flexible tracks: sample banks, multisamples, slicers, granular, loops, wavetable, or external MIDI
  - 16 pressure- and velocity-sensitive pads
  - 7-inch diagonal touchscreen
  - 8 context-sensitive endless encoders
  - 24-bit ADC/DAC
  - 3 stereo audio inputs, 3 stereo audio outputs, 1 stereo headphone output (3.5mm TRS, Eurorack-level +/-5V)
  - 2 TRS MIDI inputs and 2 TRS MIDI outputs (switchable Type A/Type B wiring)
  - USB-C host port (for USB MIDI controllers) and USB-C device port (power, data, firmware updates)
  - Internal lithium-ion battery: 3.8V, 5120mAh, 19.5Wh (about 3 hours in low power mode)
  - Requires a 30-Watt USB power supply providing at least 2000mA (2A) at 5V (not included)
  - microSD card required to operate (no internal memory or built-in speaker); included card has 155 patches and 5000+ sample files
  - Compatible with 100 x 100 VESA mounts
  - Product dimensions (per product page): 8 x 8.5 x 2 in (20.4 x 21.8 x 5.1 cm); weight 2 lbs (936 g)
  - Package dimensions (per product page): 10.25 x 8.5 x 2.75 in; weight 2.7 lbs (1.2 kg)
  - WooCommerce shipping-attribute table lists different figures: 11.25 x 10.25 x 3.75 in, 3.0 lbs
  - FX: delay, reverb, chorus, flanger, phaser, overdrive with per-track routing
  - Modulation: LFOs, envelopes, and step sequencers
  - Scene-based sequencing (step, piano roll, probability modes) and Song mode
  - Internal resampling of the master output without external patching
  - Recording length up to 4 hours per take
  - SKU 212; GTIN 00857665007352; Country of origin: China
  - Firmware v1.4.7 (current as of 2026-03-16) adds Song Export, Live Granular with Freeze, mixer solo/pan, slicer sequencing over MIDI, and Load All for one-shot/loop banks
