description: >-
  The EML ElectroComp 100 is a rare early-1970s semi-modular analog synthesizer with four oscillators and duophonic capability, built with op-amp circuitry for superior stability.
details: |-
  Electronic Music Laboratories (EML) was a Connecticut-based company that produced compact semi-modular synthesizers primarily for the educational market. The ElectroComp 100, produced from 1970 to 1972, was their first instrument and represented an early attempt at polyphonic synthesis with duophonic capability.

  The 100 distinguished itself from competitors like the Minimoog and ARP 2600 by employing op-amp circuitry rather than the transistor-based designs common at the time, resulting in superior temperature stability and reliability. Its four oscillators exceeded the Minimoog's count, each offering continuously variable waveform selection across sine, square, sawtooth, pulse, triangle, and random shapes.

  The multimode filter operates at 12dB per octave with switchable lowpass, bandpass, band reject, and highpass modes plus adjustable cutoff and resonance. Dual ADS envelope generators, white and pink noise sources, sample-and-hold functionality, and portamento round out the synthesis architecture. Housed in a portable wooden case with a 44-key keyboard and CV/Gate control, the ElectroComp 100 remains a genuinely rare instrument due to its limited two-year production run.
specs: |-
  - Polyphony: 2 voices (duophonic)
  - Oscillators: 4 VCOs, 1 noise generator (white/pink)
  - Waveforms: Sine, square, sawtooth, pulse, triangle, random
  - LFO: Use one of the oscillators
  - Filter: 12dB/oct multimode (lowpass, bandpass, band reject, highpass) with cutoff and resonance
  - Envelope: 2 ADS envelope generators
  - Effects: Portamento
  - Keyboard: 44 keys
  - Memory: None
  - Control: CV/Gate
releaseDate: "1970"
