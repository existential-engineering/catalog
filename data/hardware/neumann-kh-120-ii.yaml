description: Completely re-engineered active monitor with deeper bass, higher
  SPL and improved resolution. Available in anthracite and white.
details: |-
  The KH 120 II is based on the same concept as its acclaimed predecessor but completely re-engineered for improved performance in all parameters: deeper bass, higher SPL capability and even better resolution. Internal DSP power allows for phase linear crossovers and room adaptive alignment via Neumann's revolutionary MA 1 Automatic Alignment.

  Tonal compatibility with other KH line studio monitors makes it possible to use the KH 120 II in mixed setups e.g. in immersive setups. For flexible connectivity the KH 120 II features both analog and S/PDIF inputs.

  Additionally, the KH 120 II AES67 model variant offers integrated redundant AES67 audio network ports that are fully compliant with broadcast standards such as ST 2110, ST 2022-7 redundancy, and RAVENNA. At the same time, the KH 120 II AES67 is compatible with DANTE-generated AES67 network streams.

  Neumann engineers took great care to develop a patent pending amplifier technology which combines superior audio performance with the energy efficiency of Class D. Although the power amplifiers of the KH 120 II deliver up to 145 W to the 5.25" woofer and 100 W to the 1" tweeter, they only consume 17 W at idle. Auto-standby reduces power consumption to 0.3 W when the KH 120 II has not been used for a while, but can be deactivated.

  The KH 120 II is available in two color options, anthracite and white.
specs: |-
  - Acoustical Principle: Bassreflex, ports at the front
  - Woofer: 130 mm (5.25") with protecting black metal grille
  - Tweeter: 25 mm (1") with protecting black metal grille
  - Free Field Frequency Response6 dB: 41 Hz ... 21.4 kHz
  - Free Field Frequency Response3 dB: 44 Hz ... 21 kHz
  - Pass Band Frequency Response: 48 Hz ... 20.5 kHz, plus/minus 1.25 dB
  - Self Generated Noise: <20 dB(A) SPL at 10 cm
  - Max SPL Half Space: 116.8 dB SPL (3% THD, averaged 100 Hz to 6 kHz, at 1 m)
  - Max SPL Full Space: 110.8 dB SPL (3% THD, averaged 100 Hz to 6 kHz, at 1 m)
  - Recommended Listening Distance: 1.0 ... 2.0 m (3' ... 6')
  - Feasible Listening Distance: 0.75 ... 4.0 m (2'6" ... 12')
  - Analog Input: XLR: analog electronically balanced
  - Analog Input Impedance: 24k Ohms
  - Max Input Level: +24 dBu at 94 dB SPL setting; +14 dBu at 100 dB SPL setting; +9 dBu at 108 dB SPL setting; -1 dBu at 114 dB SPL setting
  - Cmrr: >56 dB @ 15 kHz
  - Volume Control: via MA 1 software, 0 ... -inf dB; 0.1 dB resolution
  - Analog Dynamic Range: 118 dB A-weighted; THD+N (A-D-A) 90 dB
  - Digital Input: RCA (75 Ohm): S/PDIF
  - Digital Output: RCA (75 Ohm): S/PDIF
  - Digital Converter Resolution: 24 Bit
  - Digital Converter Sampling Rate: 32 kHz ... 200 kHz
  - Internal Sampling Rate: 48 kHz
  - Dynamic Range A D: 121 dB(A)
  - Dynamic Range ADA: 118 dB(A)
  - Dynamic Range D A: 121 dB(A)
  - Digital Sensitivity: -18 dBFS = 100 dB SPL at 1 m
  - Latency: Analog Input: 2.6 ms; S/PDIF Input: 2.1 ms
  - User Delay Range: 0 ... 120 ms
  - Delay Resolution: 20.8 us
  - Input Gain Control: 0 dB ... -15 dB
  - Output Level Control: 94; 100; 108; 114 dB SPL (in 1 m based on 0 dBu input level)
  - Equalization Bass: 0; -2; -4; -6 dB
  - Equalization Low Mid: 0; -2; -4; -6 dB
  - Equalization Treble: +1; 0; -1; -2 dB
  - Input Select: Analog; S/PDIF L; S/PDIF R; Mono
  - Ground Lift: Yes
  - Control: Local; Network
  - Mains Switch: Yes
  - Mains Voltage: Universal Power Supply 100 V ... 240 V
  - Controller Design: Digital; active
  - Dsp Resolution: 32 Bit Audio, Processing 64 Bit double precision
  - Crossover Frequency: 1700 Hz
  - Crossover Slope: 48 dB / octave
  - Fir Phase Correction: Linear phase (120 Hz ... 16 kHz; +/- 45 deg)
  - Protection Circuitry: Independent soft clip, peak and thermo limiters for woofer and tweeter; woofer excursion limiter; thermo limiter for the electronics and amplifiers
  - Infrasonic Filter: 40 Hz; 12 dB / octave
  - Remote Control: MA 1 software via an RJ45 connector carrying standard IP data
  - Automatic Room Calibration: Yes (via MA 1)
  - Output Power Woofer: 145 W (THD+N with limiter deactivated: 10%); 120 W at 0.1%
  - Output Power Tweeter: 100 W (THD+N with limiter deactivated: 10%); 80 W at 0.1%
  - Mains Power Supply: 100-240 V; 50/60 Hz
  - Power Consumption Standby: 0.3 W
  - Power Consumption Idle: 15 W
  - Power Consumption Full Output: 320 W
  - Standby: Automatic, 90 mins (default); user defined in software
  - Cabinet Material: Composite polycarbonate front and rear, wooden sleeve
  - Cabinet Finish: Painted; metallic anthracite (RAL 7021) / Black (RAL 9005)
  - Operating Conditions: +10 C to +40 C (+50 F to +104 F); <75% RH, non-condensing
  - Mounting Points: 2 x M6 threaded inserts with 70 mm spacing on back panel; thread depth 15 mm (5/8")
  - Dimensions: 287 x 182 x 227 mm (11.3" x 7.16" x 8.94") (H x W x D)
  - Internal Net Volume: 6.0 L
  - External Net Volume: 11.3 L
  - Weight: 5.4 kg (11 lbs 14 oz)
  - Packed Weight: 6.6 kg (14 lbs 8 oz)
  - Packed Dimensions: 422 x 271 x 381 mm (16.6 x 10.7 x 15") (H x W x D)
  - Acoustical Axis Horizontal: 91 mm (3.6")
  - Acoustical Axis Vertical: 166 mm (6.5", from bottom)
