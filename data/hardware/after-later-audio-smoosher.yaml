details: |-
  Our smaller stereo compressor with threshold, ratio, and makeup gain controls, along with the ability to sidechain. Timing is purely automatic. For timing control, check out our Compactor module. The knob ranges are:

  Threshold – 10dbu to -30dbu
  Ratio – 0 to infinity
  Gain - -20db to 20db
