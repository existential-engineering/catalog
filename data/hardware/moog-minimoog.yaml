description: >-
  The instrument that brought synthesis out of the laboratory and onto the
  stage, pairing three powerful oscillators with the most celebrated lowpass
  filter in electronic music history.
details: |-
  When it arrived in 1970, the Minimoog represented a radical rethinking of what a synthesizer could be. Robert Moog and his team distilled the room-sized modular systems of the 1960s into a portable, self-contained instrument that a single musician could actually perform with. It was not the first portable synthesizer, but it was the one that convinced the world that synthesizers belonged in music.

  At the heart of the Minimoog sit three voltage-controlled oscillators capable of producing sawtooth, triangle, and pulse waveforms. The third oscillator can be switched to sub-audio rates for use as a modulation source. When all three are slightly detuned against one another and set to different waveshapes, the result is a monophonic sound of startling thickness and complexity that belies the instrument's single-voice architecture.

  The filter is the stuff of legend. A four-pole, 24dB-per-octave lowpass design with resonance driven to self-oscillation, it imparts a warmth and musicality that has been imitated countless times but never truly replicated. Combined with the ADS envelope generator and keyboard tracking, it gives the player expressive control over timbral movement that remains deeply satisfying decades later.

  The Minimoog established the basic front-panel layout — oscillators, mixer, filter, envelopes, output — that became the template for virtually every synthesizer that followed. Its influence stretches from the progressive rock of the 1970s through the electronic and dance music movements and into modern production, having been a trusted instrument for artists as varied as Kraftwerk, Herbie Hancock, Pink Floyd, Vangelis, and The Chemical Brothers.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs (sawtooth, triangle, pulse waveforms)
  - Filter: 24dB/oct 4-pole lowpass with cutoff, resonance, envelope amount, and keyboard tracking
  - Envelopes: ADS envelope generator
  - Keyboard: 44 keys, single-trigger, low-note priority
  - Control: CV/Gate
  - Memory: None
  - Produced: 1970–1982
