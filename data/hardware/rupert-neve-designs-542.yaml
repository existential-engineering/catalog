description: A 500 Series tape emulation module that delivers analog saturation
  and coloration. Features a true tape effect circuit with a custom interstage
  transformer mimicking a record head, switchable 15/30 IPS tape speed modes,
  soft-clipper, Silk circuit with variable Texture control, and a blend control
  to mix pre and post-tape effect signals.
details: |-
  The 542 packs Rupert Neve Designs' acclaimed True Tape emulation circuit into a single 500 Series slot, giving engineers an authentic taste of analog tape saturation in a compact, modular form factor. Built around a custom interstage transformer that mimics the magnetic behavior of a tape record head, the 542 produces the harmonic richness, transient softening, and head-bump character that define classic tape sound.

  Switchable 15 IPS and 30 IPS modes simulate different tape speeds — 15 IPS for warmer low-end and softer high-frequency response, 30 IPS for tighter low end and extended top end. Combined with a continuously variable Drive control, the module shifts smoothly from subtle warmth to aggressive saturation.

  The Silk circuit complements the tape effect with additional harmonic coloration. Red Silk emphasizes high-mid saturation; Blue Silk pushes low-mid saturation. The Texture control then dials the chosen flavor in continuously, letting engineers blend tonal character to taste.

  A Soft Clip switch engages at drive level 5 to tame transient peaks, and the Blend control mixes pre- and post-tape effect signals — making the module especially useful on drum buses, vocals, and full mixes where retaining clarity alongside saturation is critical. Trim provides ±12 dB of final level adjustment, and 8-segment LED meters display both signal level and tape drive.
specs: |-
  - Tape emulation: True Tape effect with custom interstage transformer
  - Tape speed: switchable 15 IPS / 30 IPS
  - Silk: Red (high/high-mid) or Blue (low/low-mid) with variable Texture
  - Soft Clip: engages at drive level 5
  - Blend: pre/post-tape effect mix
  - Trim: ±12 dB
  - Metering: 8-segment Level and Drive LED meters
  - THD+N (bypassed): <0.0025% @ 1 kHz, +20 dBu
  - Noise floor: better than -100 dBV (unity, bypassed)
  - Frequency response (bypassed): 5 Hz - 60 kHz ±0.25 dB; -2 dB @ 120 kHz
  - Frequency response (15 IPS): -3 dB @ 28 kHz min sat / -3 dB @ 20 kHz max sat
  - Frequency response (30 IPS): -3 dB @ 120 kHz min sat / -3 dB @ 100 kHz max sat
  - Power: 110-125 mA @ ±16VDC
  - Format: 1x 500 Series Module
  - Dimensions: 1.5" W x 5.9" D x 5.25" H (3.8 x 15 x 13.3 cm)
  - Weight: 1.5 lbs (0.7 kg)
  - Made in the USA
