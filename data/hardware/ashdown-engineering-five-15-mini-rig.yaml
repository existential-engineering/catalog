description: The Five 15 Mini Stack is a budget bass rig from Ashdown's All
  Access range, pairing a simplified 100 watt ABM-based head with a 2x10-inch
  cabinet. A seven-band ABM EQ allows precision tone sculpting, while the input
  level control takes the tone from clean to overdriven tube-like sounds. It
  adds a line input with level control for jamming and a headphone output for
  quiet practice.
details: |-
  The Five 15 Mini Stack is part of the Ashdown All Access range, a budget bass rig based on the legendary ABM range. It consists of a simplified 100 watt ABM head and a 2x10-inch cabinet. The seven-band ABM EQ section allows precision tone sculpting, while the 100 watt (RMS) power section puts out real low end despite its compact size. The input level control takes the tone from clean to overdriven tube-like tones and the output control sets the overall volume. Other features include a line input with level control so players can jam along to songs or backing tracks, plus a headphone output for late-night sessions or quiet practicing.
specs: |-
  - Power output: 100 watts (RMS)
  - Speaker configuration: 2 x 10 inch
  - Speaker outputs: jack
  - EQ: 7-band ABM EQ
  - Input level control (clean to overdriven)
  - Output level control
  - Line input with level control
  - Headphone output
  - Dimensions (H x W x D): 580 x 445 x 260 mm
  - Weight: 29 kg
