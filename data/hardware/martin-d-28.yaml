details: |-
  The Martin D-28 is widely regarded as the most iconic acoustic guitar in the world, trusted by generations of players and played by countless legends across genres. Its Dreadnought (D-14 Fret) body and scalloped bracing deliver bold, projective tone with strong bass, clear trebles, and rich overtones that have defined acoustic music for nearly a century.

  Handcrafted with a solid Sitka spruce top and solid East Indian rosewood back and sides, the D-28 produces a resonant voice suited for flatpicking, strumming, fingerstyle, and everything in between. A 25.4" scale length contributes to the instrument's signature power and projection.

  The satin-finished neck features a Golden Era Modified Low Oval profile with a High-Performance Taper for smooth playability. Appointments include antique white binding, an ebony fingerboard with mother of pearl dot inlays, an ebony bridge with bone pins and a compensated bone saddle, and nickel open-gear tuners with butterbean knobs.

  The 2025 Standard Series refresh enhances tone and comfort with Sitka spruce GE-scalloped top bracing, a reimagined neck profile, a thinner fingerboard, and a refined bridge and heel design. Like all Standard Series instruments, the D-28 is handcrafted in Nazareth, Pennsylvania and ships in a molded hardshell case, backed by Martin's limited lifetime warranty.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Solid Sitka Spruce (Aging Toner)
  - Back and Sides: Solid East Indian Rosewood
  - Bracing Pattern: Forward-Shifted X-Brace, GE-Scalloped (Sitka Spruce, 5/16")
  - Scale Length: 25.4"
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Neck Joint: Dovetail
  - Fingerboard Material: Ebony
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Mother of Pearl Dots
  - Total Frets: 20 (joins body at 14th fret)
  - Bridge Material: Ebony
  - Bridge Pins: Bone
  - Bridge String Spacing: 2 5/32"
  - Saddle: Compensated Bone
  - Nut Material: Bone
  - Binding: Antique White
  - Tuning Machines: Nickel Open Gear with Butterbean Knobs
  - Finish: Satin Neck
  - Setup: Plek'd
  - Case: Molded Hardshell
  - Electronics: None
  - Left-Handed Option: Available
