description: 6-in / 6-out USB audio interface / word clock / DAC / ADC with USB OTG
details: |-
  The Revolution 6x6 is an all-purpose studio dynamo that can serve as a master clock, a standalone DAC, and a 6-in, 6-out class-compliant USB interface with audio quality worthy of the Revolution name. Enjoy world-class clocking and low-noise conversion while tracking to the included Studio One Artist. Use the USB OTG connection to sample audio from your phone or tablet, or send audio from your laptop to your mobile device and stream your performance live online.

  Black Lion Audio has put everything learned about interfaces from years of boutique modding into the Revolution 6x6, featuring the Macro-MMC clock for maximum converter quality with reduced jitter and enhanced harmonics. Proprietary PG-i filtering technology and highly-filtered power rails work with full-circuit power decoupling to further reduce noise contamination. The unit sports over two dozen high-end Vishay, Wima, and Nichicon capacitors and Melf film resistors for the best possible capture and playback.

  Not every studio task requires a computer. The Revolution 6x6's DAC, word clock, and D/A conversion features can all be used without a computer by pressing and holding the Standalone button. Hook up a media player via S/PDIF for hi-fi listening, add two additional output channels from another audio interface or digital mixer, or use S/PDIF to connect synths and guitar processors with superior conversion quality.

  USB On-the-Go connectivity gives the Revolution 6x6 2-in, 2-out connectivity with Android and Apple mobile devices, perfect for livestreamers and mobile musicians. Connect two USB devices to the Revolution 6x6 simultaneously and send audio to and from either, sampling from a phone to a laptop or livestreaming from a tablet.

  The Macro-MMC (Master Music Clock) was developed from Black Lion's experience creating dedicated word clocks and modifying embedded clocks in other recording interfaces. It ensures best possible converter performance and allows connection of external gear via BNC connections for maximum sync and ultra-low jitter.
specs: |-
  - Mic Input Impedance: 2KΩ (balanced)
  - Mic Gain Range: 59dB
  - Mic Frequency Response: 20Hz–20KHz ±0.25dB
  - Mic THD+N: 0.01% (min gain)
  - Mic Dynamic Range: 112dB (A-weighted)
  - Line Input Impedance: 15KΩ (balanced)
  - Line Maximum Input: 21dBu
  - Line Dynamic Range: 112dB (A-weighted)
  - Instrument Input Impedance: 1MΩ (unbalanced)
  - Instrument Dynamic Range: 103dB (A-weighted)
  - Line Output Impedance: 47Ω (balanced)
  - Line Max Output Level: 12dBu
  - Line Output Dynamic Range: 106dB
  - Headphone Output Impedance: 10Ω
  - Headphone Maximum Signal Output: 9.3dBu
  - Macro-MMC proprietary clocking technology
  - PG-i proprietary power conditioning technology
  - Class-compliant USB (no driver required on Mac/Linux)
  - USB OTG: 2-in/2-out with Android and Apple mobile devices
  - Standalone DAC/ADC operation without computer
  - S/PDIF I/O for digital expansion
  - Word clock I/O via BNC
  - Bus-powered or 5V external power supply
