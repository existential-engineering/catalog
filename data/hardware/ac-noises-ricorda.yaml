description: >-
  RICORDA is a stereo granular reverb with freeze and loop functions, built
  around a DSP more commonly found in modular synthesizers than effect pedals.
details: |-
  Born from the collaboration between AC noises and Andrea Degli Esposti from BunkerNoise, RICORDA is the first stereo unit in AC noises' current catalog. This innovative effect pedal pushes the boundaries of sonic exploration, offering musicians and sound designers a powerful tool for crafting immersive soundscapes.

  At the heart of RICORDA lies an incredibly powerful DSP, more commonly found in modular synthesizers than effect pedals. This advanced processing unit enables RICORDA to provide an extensive array of parameters for sculpting and shaping reverberant spaces. Users can control everything from the density and size of the grains to their feedback and stereo spread, opening up virtually limitless possibilities for sonic experimentation.

  RICORDA's Freeze mode captures a momentary snapshot of the audio signal, sustaining it infinitely. This feature is ideal for creating drones or intricate sonic landscapes. The Loop function offers up to 2 minutes of recording time, with the ability to overdub layers infinitely.

  For maximum flexibility, RICORDA provides a USB-C port for future firmware updates, ensuring that the pedal can evolve alongside the needs of its users.
specs: |-
  - Mono/stereo input toggle switch
  - Reverb controls: mix, decay, size, tone
  - Granular parameters: mix, number, size, time
  - Octave selection (0 or +12 semitones)
  - Freeze/loop functionality with up to 2 minutes of recording time and infinite overdubs
  - Secondary mode: diffuse, LFO speed, LFO depth, pre-delay
  - Secondary mode: granular feedback, spray, stereo spread, pitch offset
  - Output configuration: true stereo or dual mono
  - Pre/post granular processing
  - USB-C port for firmware updates
