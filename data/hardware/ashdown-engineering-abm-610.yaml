description: A 6x10 inch bass cabinet designed to complement the wide tonal
  range and power of Ashdown's ABM heads. Rated at 800W RMS with a 4 Ohm load,
  the ABM-610 is loaded with six 10 inch Ashdown BlueLine drivers in a
  high-grade birch ply enclosure with metal corners, steel grilles, and
  heavy-duty rubber feet.
details: |-
  The ABM-610 is an 800W RMS, 4 Ohm bass cabinet loaded with six 10 inch Ashdown BlueLine drivers. It is constructed from high-grade birch ply and protected by a tough buffalo leather cloth covering, metal corners, and steel grilles, with high-quality handles (in place of rattle-prone flip handles) and heavy-duty rubber feet to reduce vibration. Ashdown BlueLine speakers are developed for a balance of power, transparency, and deep controlled low end without sacrificing mid-band attack or high-end brightness.
specs: |-
  - Power Output: 800 Watts RMS
  - Speaker Configuration: 6 x 10 Ashdown BlueLine drivers
  - Impedance: 4 Ohm
  - DI Output: 600 Ohms balanced, -20dBu nominal
  - Dimensions (H x W x D): 902 x 617 x 445 mm
  - Weight: 58 kg
  - Construction: high-grade birch ply, buffalo leather cloth, metal corners, steel grilles
