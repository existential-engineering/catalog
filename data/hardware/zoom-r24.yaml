description: "It provides everything you need to make professional
  studio-quality recordings: a 24-track recorder, a pad sampler, a rhythm
  machine, a DAW control surface and a computer audio interface, all in one
  portable unit."
details: |-
  The R24 provides 24 tracks for recording and playback (up to 8 tracks can be recorded simultaneously) in full fidelity WAV format (16 or 24-bit, at 44.1 or 48 kHz sampling rates), making it ideal for both professional production and for use as a musical sketchpad. Battery operation allows for field recording. External microphones or line-level sources connect directly to the R24, or the built-in stereo mic pair can be used for minimal setup. Instruments such as electric guitar or bass plug straight in. When a multitrack recording is complete, the R24's internal mixer, complete with real faders, equalization, panning, and more than 100 built-in DSP effects including amp models and mastering effects like multi-band compression, creates a stereo mix.

  The R24 is a pad sampler and rhythm machine too. Eight velocity-sensitive pads allow the triggering of up to 24 samples, drum sounds, or loops, and over 400 internal loops and drum patterns are provided. Custom samples and loops can be created from recorded audio tracks, with quantization and time-stretching to ensure synchronization. Three playback modes are available for each pad (Repeat, Gate, and 1Shot), and the onboard audio sequencer allows step entry of drum parts when absolute precision is required. The multitrack recorder is fully integrated with the pad sampler and rhythm machine.

  Mackie Control emulation enables the R24 to act as a full-featured control surface for DAWs such as Cubase, Logic, Ableton Live, and Sonar, as well as providing an audio editing platform for video software packages such as Final Cut Pro, adding real faders and transport, autolocate and status buttons. Five assignable function keys set marker points and initiate advanced editing operations.

  The R24 offers eight inputs on combo connectors that accept either XLR or 1/4-inch balanced or unbalanced cables. All inputs can handle mic, line and instrument level signals, and Input 1 can also handle low impedance signals from passive electric guitars and basses. Phantom power of +24 or +48 volts can be applied to up to six inputs. There are also dual balanced 1/4-inch TRS output jacks and a headphone output with a dedicated volume control.

  Over 100 studio-quality DSP effects are provided, including insert effects such as equalization and dynamics processing as well as send-return effects such as reverb, delay, chorus, flanging, and phasing. There are guitar amp, bass amp, and mic preamp models, effects designed for vocals and stereo instruments, and mastering algorithms such as multi-band compression. Effects can be applied during recording and mixdown, or used for playback only. A USB port lets the R24 send and receive digital data and act as an 8-input/2-output interface for DAW software. Two R24s, or an R24 and an R16, can be synchronized via USB for 16 tracks of simultaneous recording and 48 (or 40) tracks of playback.
specs: |-
  - 24-track playback, 8-track simultaneous recording
  - Built-in stereo condenser microphones (omnidirectional)
  - Records to SD and SDHC cards up to 32 GB, for up to 100 track hours
  - Records mono and stereo WAV files (16 / 24-bit, 44.1 / 48 kHz)
  - Eight balanced mic/line/instrument-level inputs on XLR/TRS combo connectors
  - 1 Low-Z input (Hi-Z 1 MOhm) for passive electric guitar and bass
  - +24 and +48 V phantom power on 6 channels
  - Dual balanced 1/4-inch TRS output jacks
  - Headphone output with dedicated volume control (20 mW x 2 into 32 Ohm)
  - Built-in metronome and chromatic tuner (chromatic, guitar, bass, open A/D/E/G, D modal)
  - More than 100 send-return and insert DSP effects: 330 insert and 60 send-return patches, 7 insert and 2 send-return effect modules
  - 9 effect algorithms: CLEAN, DISTORTION, ACO/BASS, BASS, MIC, DUAL MIC, STEREO, 8xCOMP, EQ, MASTERING
  - 9 faders (8 mono plus master), 3-band EQ, pan and two effect sends per track
  - Stereo link selectable in pairs across tracks 1/2 to 23/24
  - Variable playback speed from 50% to 150% without affecting pitch
  - Up to 100 marks per project, 1000 projects
  - File editing: divide and trim. Punch-in/out (manual and auto), bounce, A-B repeat, undo/redo
  - 24-voice pad sampler (3 banks of 8 velocity-sensitive pads)
  - Rhythm machine with 160 drum and percussion sounds, 10 drum kits, 48 PPQN precision, 40.0 to 250.0 BPM
  - 511 rhythm patterns per project
  - 8-in/2-out USB audio interface, 24-bit, 44.1 / 48 / 88.2 / 96 kHz
  - 96 kHz 24-bit delta-sigma AD and DA conversion
  - Control surface functionality (Mackie Control emulation)
  - 128 x 64 pixel backlit LCD, 4-segment LED metering
  - USB 2.0 Hi-Speed operation as audio interface, control surface, card reader or USB storage
  - Runs on 6 AA batteries (more than 4.5 hours alkaline) or the supplied AD-14 DC 5V 1A adapter, plus USB bus power
  - 376 mm (W) x 237.1 mm (D) x 52.2 mm (H), 1.3 kg
  - Steinberg Cubase LE DAW software included
