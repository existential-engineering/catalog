description: "The Delta series philosophy: reliability, trust and transparent
  amplification of your mix."
details: |-
  Clean power with a minimal rack footprint. Every model uses the highest-quality power-amplifier technology - so you know for a fact that what goes in, comes out exactly as intended. Only louder.

  The 1U Delta 20 amplifies either four channels of analogue audio, or four channels of networked audio via Dante; it's a future-proof system that can keep up with whatever your studio throws at it. When using Dante, your audio is converted by 24-bit/96kHz DACs.

  Depending on impedance, Delta 20 offers output power from 175W to 480W per channel - and you can run bridged channel pairs or link-adjacent inputs in either analogue or digital modes, for complete flexibility.

  On the power-supply side, Delta 20 features individual 70/100V line drive; auto-standby (with a sub-200ms wake-up); and a PFC-enabled universal mains supply for worldwide use. You also get GPIO for remote control and monitoring, back-up amp inputs, and even tuneable fans.

  Want a stereo four-way system? Just connect to a Delta DSP amplifier with a single Cat 5 cable to eliminate the need for external processing.
