description: 5000 Series pedals are now fitted with more features and upgrades than ever before.
details: |-
  An industry standard gets even better. The 5000 Series Bass Drum Pedals established DW's reputation for innovation and quality, and the line has since been re-engineered with a set of major improvements.

  Most notably, the toe clamp was upgraded. The Tri-Pivot Toe Clamp features three independent, 360-degree, rotating rubber pads that firmly grab almost any diameter and thickness of bass drum hoop, from the top and the bottom, with zero slippage, and it is combined with a textured rubber pad on the base plate.

  A Dual Bearing Spring Rocker makes the 5000 quicker and more responsive, and the dual-chain Accelerator drive system uses an eccentric motion that creates an indirect relationship between the sprocket and the footboard, shortening the length of the stroke and increasing velocity and sensitivity.

  The pedals still feature aluminum hex shafts, pedal plates and linkages, DW's patented Delta Ball-Bearing Hinge, and the Two-Way Beater. The 5002 double pedals also incorporate the patented Single Post Casting design, which places the auxiliary bass pedal closer to the hi-hat pedal. A ballistic nylon deluxe carrying case with a rigid liner is included.
