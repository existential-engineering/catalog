details: |-
  The Wake is an eight-voice chorus pedal designed as an always-on tonal thickener, inspired by '80s and '90s digital rack choruses and dream pop aesthetics. The octave-down circuit runs in parallel to the chorus engine independently, allowing either or both to be mixed in.

  Controls: OCTAVE (blends clean octave-down signal), MIX (chorus intensity; maximum creates pitch vibrato, minimum is dry), RATE (chorus modulation speed), DEPTH (chorus modulation depth). Power accepts 9-18V DC center-negative. Backed by a 3-year warranty.
