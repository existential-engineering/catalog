description: >-
  The PPG 1002 is a rare monophonic analog synthesizer designed by Wolfgang Palm
  in 1976. Only an estimated 25 to 100 units were manufactured, making it one of
  the scarcest vintage synthesizers on the market. Despite its simple
  architecture, the 1002 delivers a distinctive and highly sought-after analog
  sound.
details: |-
  The PPG 1002 was designed by Wolfgang Palm, the German engineer best known for inventing wavetable synthesis. Inspired by the Minimoog's design philosophy, the 1002 was an early effort from Palm's PPG (Palm Products GmbH) that employed traditional voltage-controlled oscillator technology rather than the digital wavetable approach he would later pioneer.

  Very few PPG 1002 units were produced, with estimates ranging from 25 to 100 total. As a result, surviving examples are extremely rare and command high prices when they appear on the secondhand market. Pre-release prototype models featured patch cables instead of the switch-based routing found on production units, making those variants even scarcer.

  Despite its monophonic architecture and relatively straightforward signal path, the PPG 1002 is praised for its wonderful and unique sound character. Its dual analog oscillators, 4-pole low-pass filter with resonance, and compact portable form factor gave it an appeal that endures among vintage synthesizer collectors and enthusiasts.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: No
  - Oscillators: 2 analog
  - Waveforms: Pulse (variable), Square, Sawtooth (up), Triangle
  - Filter: 24dB/oct low-pass (4-pole) with resonance
  - LFO: 1 (square and triangle outputs)
  - Envelopes: 2
  - Keyboard: 49 non-weighted plastic keys (4 octaves)
  - Connectivity: CV/Gate inputs, filter input, audio outputs
