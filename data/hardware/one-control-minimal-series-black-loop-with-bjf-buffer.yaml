description: A compact loop switcher with switchable BJF Buffer on the input and
  two DC outputs for powering other effects.
details: |-
  One Control Minimal Series Black Loop with BJF Buffer is an easy-to-use loop switcher that has the BJF Buffer-which can be bypassed on the input-and 2 DC outs to power other effects. It can be used as a loop switcher for true bypass or buffer bypass while supplying power to the effects connected to Loop-1 and Loop-2. The switching of each effect loop is standard true bypass style, and you can use it in the same way as the buffer bypass by turning on/off the buffer on the input. The Black Loop is effective when connecting multiple effects to one effect loop, or using old effects that may load or degrade the signal when bypassed. LOOP1: Turn on the LOOP on the right side. LOOP 2: Turn on the LOOP on the left. If the BJF Buffer in the input part is set to OFF, it can also be operated without power (the LEDs do not light up.)

  THE BJF BUFFER:

  This amazing circuit is installed in many of the switching products from One Control. It is one of the most natural-sounding buffer circuits ever created that changes the image people have from using old buffer circuits that degraded the tone of their instruments. Features:

  Precise Unity Gain setting to 1
  Input impedance will not change the tone
  Will not make output signal too strong
  Ultra-low noise output
  When the input is overloaded, will not degrade the output tone. Created at the request of many of the world's greatest guitarists by Björn Juhl­-one of the greatest amp and effects designers in the world-the BJF Buffer is the answer to keeping your tone pristine in all sorts of signal chains, from the stage to the studio. When more effects are connected later, the more critical a buffer is. This is the function of incorporating the BJF Buffer into the input. By turning on the BJF Buffer, you can stabilize the overall tone to a warm and natural sound with less signal loss and degradation. Black Loop with BJF Buffer works with a center-negative DC9V adapter. The capacity of the current supplied by DC Out depends on the adapter you are using. Batteries cannot be used. Size: 61D x 111W x 31H mm (not including protrusions)
  66D x 121W x 49H mm (including protrusions)
  Weight: 390g

  Minimal Series – "Sophisticated Functionality"

  The One Control Minimal Series eliminates all waste in the manufacturing process of pedals, achieves the most compact size, and consolidates simple but sophisticated functionality. These are pedals that have earned the name Minimal. For this series One Control has devised and realized an innovative PCB layout that can ensure both speed and precision in the manufacturing process, as well as strength in construction with high quality parts. Production efficiency has improved, reducing unnecessary hand labor and waste and helping to lower the price without lowering the quality. OC Minimal Series also achieves minimal size housings for the pedals so they can be used without taking up much space on your pedalboard or under your feet. Built to last, built to be stepped on, and built to fit anywhere you need them. Purpose-built solutions with exactly what you need, and nothing more. Switching is Easy with One Control! ・ Minimal Series Black Loop with BJF Buffer Manual.pdf

  Promotional Pictures（for dealers）
  2000pix×2000pix 350dpi
specs: |-
  - By connecting to the tuner from one effect loop SEND, it can be used as a mute switch and tuner out.
  - By connecting from the SEND of one effect loop to another amplifier, it can also be used as a switch to switch between multiple amplifiers.
