description: A compact 2x12" angled speaker cabinet from Marshall's Studio JTM
  range, designed to pair with the Studio JTM heads and combos. It houses two
  Celestion G12M-65 Creamback speakers for the warm low end, vocal mids, and
  refined highs associated with the original 1960s JTM voicing, in a smaller and
  more home- and studio-friendly footprint than a traditional 4x12. The angled
  baffle helps project sound upward on stage, and the cabinet is rated for 130W
  into 8Ω.
details: |-
  Expertly crafted in Bletchley, England, the Studio JTM 2x12 Angled Cabinet was designed to be paired with the Studio JTM Head. With Celestion Creamback speakers, this cab is ideal for creating that definitive vintage tone.

  Two Celestion G12M-65 Creamback speakers give the cabinet 130W of power handling into an 8 ohm load, in an angled enclosure inspired by the JTM45.

  Built in Marshall's UK factory, it is compact and portable while keeping the full handling of a pair of 12" speakers.

  Designed and engineered in UK. Made in UK.
