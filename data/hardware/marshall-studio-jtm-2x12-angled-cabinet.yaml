description: A compact 2x12" angled speaker cabinet from Marshall's Studio JTM
  range, designed to pair with the Studio JTM heads and combos. It houses two
  Celestion G12M-65 Creamback speakers for the warm low end, vocal mids, and
  refined highs associated with the original 1960s JTM voicing, in a smaller and
  more home- and studio-friendly footprint than a traditional 4x12. The angled
  baffle helps project sound upward on stage, and the cabinet is rated for 130W
  into 8Ω.
