description: An experimental MIDI looper that records and loops MIDI control
  information — notes, dynamics, and parameters — similarly to how audio loopers
  process sound.
details: |-
  The Midilooper is an experimental MIDI looper that records and loops MIDI control information — notes, dynamics, and parameters — in a manner similar to how audio loopers process sound. It features 3 independent voices, each assignable to a different MIDI channel, with overdub and overwrite recording modes.

  Real-time processing functions include quantize, velocity lock, shuffle, humanize, transpose, octave transpose, and time stretch. The device supports odd loop lengths, mute/clear/erase functions, pedal control, undo/redo, and aftertouch recording.

  Clock synchronization can be achieved via MIDI clock, analog clock input, tap tempo, or free-running mode. CV inputs allow external control of transpose, velocity, and re-trigger functions. USB MIDI support was added in firmware v1.1.0.

  Powered by 5V Micro USB. Dimensions: 125 × 80 × 35 mm.
