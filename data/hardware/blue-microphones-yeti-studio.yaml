description: Yeti Studio reinvents the traditional dynamic XLR mic with ClearAmp
  active preamp technology, a dual-diaphragm dynamic capsule that minimizes
  noise and vibration, and a sleek, gamer-first design for a true
  professional-level gaming experience.
details: |-
  Yeti Studio is an active dynamic XLR broadcast microphone from Logitech G, built around a dual-diaphragm dynamic capsule and a gamer-first industrial design. Logitech positions it as a remastered take on the traditional broadcast mic, aimed at streamers and gamers who want professional-grade voice capture through a standard XLR signal chain rather than a USB connection.

  The headline feature is ClearAmp, a built-in active preamp that adds +25 dB of additional gain so the mic does not need an external inline mic booster to reach usable level on a typical audio interface. That active circuitry is why the mic requires phantom power: the specifications list +24V or +48V phantom power as a hard requirement, supplied over the same XLR connection as the audio.

  A supercardioid pickup pattern and a heavy diaphragm keep the voice front and centre while rejecting room noise, game effects and background audio arriving off-axis. An internal shockmount isolates the capsule inside the body so desk bumps, keyboard strikes and cable movement do not reach the signal, and the mic ships with an additional windscreen alongside the fitted one.

  Mounting is handled by a 290-degree swivel yoke that lets the mic be angled into almost any streaming position, and a 3/8 inch mic stand adapter is included in the box for boom arms and stands. The body measures 6.5 x 2.64 x 7.28 in (165 x 67 x 185 mm) and weighs 21.69 oz (615 g).

  Because the output is XLR only, an audio interface or mixer and an XLR cable are required and are sold separately. Published performance figures are a 40 Hz to 18 kHz frequency response, -34 dBV/Pa sensitivity at 1 kHz, 0.05% THD at 1 kHz / 94 dBSPL, 69.5 dB A-weighted signal-to-noise, and a maximum SPL of 129 dBSPL at 1% THD (138 dBSPL at 5% THD). Logitech covers the mic with a 2-year limited hardware warranty.
specs: |-
  - Capsule type: dynamic, dual-diaphragm
  - Polar pattern: supercardioid
  - Frequency response: 40 Hz to 18 kHz
  - Sensitivity: -34 dBV/Pa @ 1 kHz
  - THD: 0.05% @ 1 kHz, 94 dBSPL
  - Signal-to-noise ratio: 69.5 dB A-weighted
  - Max SPL: 129 dBSPL @ 1% THD, 138 dBSPL @ 5% THD
  - ClearAmp built-in active preamp adds +25 dB of gain, no external mic booster required
  - Power: +24V or +48V phantom power required, supplied over the XLR connection
  - Connection: XLR analogue output only; audio interface and XLR cable sold separately
  - Internal shockmount isolates the capsule from bumps and vibration
  - 290-degree swivel mount
  - Dimensions: 6.5 x 2.64 x 7.28 in (165 x 67 x 185 mm)
  - Weight: 21.69 oz (615 g)
  - Colour: White
  - In the box: Yeti Studio microphone, additional windscreen, 3/8 inch mic stand adapter, quick start guide
  - 2-year limited hardware warranty
