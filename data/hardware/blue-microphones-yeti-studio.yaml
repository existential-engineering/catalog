details: |-
  Yeti Studio reinvents the traditional dynamic XLR mic with ClearAmp active preamp technology, a dual-diaphragm dynamic capsule that minimizes noise and vibration, and a sleek, gamer-first design for a true professional-level gaming experience.

  Built-in ClearAmp technology delivers strong, +25dB additional gain for exceptional sound quality, no external mic booster required.

  The supercardioid pickup pattern and heavy diaphragm deliver smooth, crisp detail that puts your voice front and center, even during games with intense effects or background audio.

  The internal shockmount isolates the microphone capsule and protects your stream from bumps and vibrations to ensure your voice is clean and impactful.

  An innovative 290-degree swivel mount lets you place the mic at virtually any angle for optimum play and streaming, and the XLR connection integrates with an audio interface or external mixer.
