description: A 500 Series microphone preamplifier featuring a big, bold preamp,
  a swept high-pass filter and the powerful saturation control of variable Silk.
  Combines legendary Rupert Neve tone with 500 Series value and delivers clean
  or vintage characters at will.
details: |-
  The 511 packs the legendary Rupert Neve preamp tone into a single 500 Series slot. Built around a custom-designed transformer-coupled topology, it delivers up to 72 dB of gain (66 dB switched plus 6 dB trim) with the harmonic warmth and dimensional depth Rupert Neve's circuits are known for. Whether tracking vocals, drums, acoustic instruments, or amps, the 511 brings character without sacrificing clarity.

  The centerpiece feature is variable Silk - a continuously adjustable harmonic saturation control that lets engineers dial in vintage warmth on demand. By reducing negative feedback across the output transformer, Silk adds sweet, musical 2nd and 3rd order harmonics. The Texture knob shifts the emphasis from silky high-end shimmer to richer low-mid saturation, giving the user complete and precise control over harmonic coloration reminiscent of Rupert's legendary vintage designs.

  A continuously variable swept high-pass filter (20-250 Hz, 12 dB/octave) helps tame low-end rumble and shape sources at the input stage, while an 8-segment LED meter provides clear visual feedback on signal levels with clip hold. Push-button controls for +48V phantom power and polarity inversion round out the front panel, along with an engagement switch for the Silk circuit.

  Designed to fit any 500 Series rack, the 511 is a workhorse preamp that bridges the gap between accessible 500 Series form-factor and the boutique, transformer-coupled sound of Rupert Neve's larger Portico and 5088 designs. It is equally at home on critical lead vocals, drum overheads, room mics, and DI signals routed through external direct boxes.
specs: |-
  - Gain: 0 to +66 dB in 6 dB steps (12-way precision rotary switch)
  - Trim: ±6 dB continuously variable
  - Unity gain handling: +20 dBu without input pad
  - Maximum Output Level: +23 dBu
  - Frequency Response: ±0.1 dB from 10 Hz to 31.5 kHz; -2.6 dB @ 120 kHz
  - Equivalent Input Noise: -125 dB
  - Noise at Unity Gain: better than -103 dBV
  - Noise at +66 dB: better than -60 dBV
  - THD+N (no Silk, 1 kHz, +20 dBu): better than 0.0025%
  - High Pass Filter: continuously variable 20-250 Hz, 12 dB/octave slope
  - Phantom Power: +48V switch-selectable
  - Polarity inversion: push-button with indicator
  - Level Meter: 8-segment LED bar-graph (green/yellow/red with clip hold)
  - Silk circuit: engagement button with continuously variable Texture knob
  - Power Requirements: ±16VDC, 100mA
  - Format: 1x 500 Series Module
  - Dimensions: 1.5" W x 5.9" D x 5.25" H (3.8 cm x 15 cm x 13.3 cm)
  - Weight: 1.5 lbs (0.7 kg)
