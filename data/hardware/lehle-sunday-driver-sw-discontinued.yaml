description: The LEHLE SUNDAY DRIVER SW is a compact-format high-end preamp for
  all types of electrical and acoustic instruments. The switchable version
  expands the classical LEHLE SUNDAY DRIVER's features by an On/Off footswitch.
details: |-
  The Sunday Driver SW is a compact-format high-end preamp for electrical and acoustic instruments, from electric guitars and basses to acoustic guitars and other stringed instruments such as violins, cellos and double basses. The switchable version adds an On/Off footswitch to the classical Sunday Driver.

  JFET technology provides two operating modes. In mode D, for Driver, the input signal is amplified with zero modification, eliminating the signal losses that long cable routings or effects chains can cause, so the signal stays powerful and clear and retains its dynamics. Mode S, for Sunday, multiplies input impedance by four and brings out previously inaudible details, and as gain increases the guitar takes on a characteristic warmth.

  There is no distortion at any stage and the signal always stays clean, even at a maximum gain setting of 15 dB. A studio-standard signal-to-noise ratio of better than -100 dB keeps the unit free of background noise, and the input voltage is rectified from the power supply socket, then filtered, stabilized and doubled to 18 V.

  In OFF status there are two modes of operation. In TB, for True Bypass, input and output are linked with zero losses through a switch with gold-plated contacts, which suits a small set-up with short cable routings or a treble-booster or classical fuzz pedal looped in after the unit. In TS, for True Sound, the unit stays active as a buffer without amplifying or modifying the signal, acting as a neutral line-driver equivalent to mode D with the gain pot turned fully down, which suits long cables and complex effect board configurations.
specs: |-
  - JFET-based preamp circuitry
  - On/Off footswitch
  - Two operating modes: D (Driver) and S (Sunday)
  - Mode S multiplies input impedance by four
  - Two bypass modes: TB (True Bypass) through gold-plated contacts and TS (True Sound) buffered
  - Maximum gain 15 dB with no distortion at any stage
  - Signal-to-noise ratio better than -100 dB
  - Input voltage rectified, filtered, stabilized and doubled to 18 V internally
  - Runs as a battery-operated stand-alone unit or from an external power supply
