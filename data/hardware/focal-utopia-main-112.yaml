name: Utopia Main 112
manufacturer: focal
primaryCategory: studio-monitor
categories:
  - monitor
url: https://www.focal.com/products/utopia-main-112
description: UTOPIA MAIN 112 is the ultimate studio monitor, setting an
  unrivalled standard for recording, mixing and mastering.
specs: |-
  - 3-way main/mastering monitor with remote amplification
  - Subwoofer: 13" W membrane
  - Woofer: 5" W membrane with M profile
  - Tweeter: 1.5" Beryllium with M profile
  - Frequency response (±3 dB): 28 Hz – 40 kHz
  - Maximum SPL (peak @ 1 m): 120 dB
  - Bass amplifier: 500 W RMS Class D
  - Midrange amplifier: 180 W RMS Class H Current Mode
  - High frequency amplifier: 90 W RMS Class H Current Mode
  - Inputs: XLR symmetrical 10 kΩ
  - High-pass filter: Full range, 30 Hz, 40 Hz, 50 Hz
  - Bass level (>250 Hz): adjustable ±3 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - Local supply: 100–120 V or 220–240 V (50/60 Hz)
  - Dimensions (H × W × D): 94 × 53 × 46 cm (37 × 20.8 × 18.1 in)
  - Weight: 77.6 kg (171 lb)
  - Bundle includes a pair of speakers and a pair of remote amplifiers
