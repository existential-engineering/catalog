description: UTOPIA MAIN 112 is the ultimate studio monitor, setting an
  unrivalled standard for recording, mixing and mastering.
details: |-
  UTOPIA MAIN 112 is a studio monitor that sets an unmatched standard for recording, mixing and mastering. Innovative drivers, patented Focal technologies, power, accuracy and on-site fine tuning: this monitor redefines the landscape of main monitoring.

  A technological triumph: the UTOPIA MAIN range inherits over forty years of Focal know-how and twenty years of innovation in the development of studio monitors. Each component has been meticulously thought out to design exceptional main monitors, delivering a very high level of accuracy, even at high SPL.

  Absolute precision: the 'M'-shape concept was introduced to both the all-new 5" midrange with a 'W' membrane and the 1.5" Beryllium tweeter, for increased rigidity. The 'M' shape moving in and out in a perfect pistonic movement provides a strong planar waveform and gives a true phantom centre. Those drivers deliver exceptional transient reproduction without causing hearing fatigue.

  Significant bass extension: the 13" long-excursion subwoofer offers excellent definition and significant extension in the sub-bass, an essential element for main monitors. The cabinet is made from MDF panels reinforced by a bracing network specially designed to eliminate any cabinet warping.

  Unique external amplification: the patented amplifiers of the UTOPIA MAIN 112 and UTOPIA MAIN 212 use a combination of a class H design with current-mode amplification. Combined with analogue filtering, it achieves the lowest level of harmonic distortion ever measured by Focal in an anechoic chamber.
specs: |-
  - Product type: 3-way monitor
  - Subwoofer: 13" W membrane
  - Woofer: 5" M-shaped W membrane
  - Tweeter: 1.5" M-shaped Beryllium
  - Frequency response (+/- 3dB): 28 Hz - 40 kHz
  - Maximum SPL (peak @ 1m): 120 dB
  - High frequency amplifier: 90 W RMS class H current mode
  - Bass amplifier: 500 W RMS class D; midrange amplifier: 180 W RMS class H current mode
  - Inputs: XLR symmetrical 10 kOhms
  - High-pass filter: full range, 30 Hz, 40 Hz, 50 Hz
  - Bass level (>250Hz): adjustable +/-3 dB
  - Treble level (< 4.5kHz): adjustable +/-3 dB
  - Indicators and controls: sensitivity, auto standby, LED logo on/off, HPF, LF Shelving, LF EQ, LMF EQ, HF Shelving, subwoofer/midrange/tweeter trims, soffit filter, sealed port filter
  - LEDs: loudspeaker power on and clipping; remote amplifier power on
  - Local supply: ~100-120 V 50/60 Hz; ~220-240 V 50/60 Hz
  - On/Off switch on the remote amplifier
  - Height: 94 cm / 37 in
  - Width: 53 cm / 20.8 in
  - Depth: 46 cm / 18.1 in
  - Weight: 77.6 kg / 171 lb
