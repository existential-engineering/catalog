description: Guitar/instrument amplifier and interface for external effects
  processors with CV-controllable crossfader between output signal and return
  from effects chain. Buffered output level control with clipping LEDs, input
  gain adjustment with modular level indication (5V peak-to-peak). 6.3mm Neutrik
  connectors.
details: 5HP, 45mm depth. +12V <40mA, -12V <35mA. 10-pin, PTC fuse. 1/4-inch
  Neutrik jacks.
