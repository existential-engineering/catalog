description: The DSL5 Combo is an all-valve 5W guitar amplifier from Marshall's
  DSL (Dual Super Lead) range, designed for home studio use and portable band
  practice. It features two switchable gain channels — classic gain and ultra
  gain — that cover everything from ultra-clean tones to powerful distortion,
  plus a power reduction switch that drops the output from 5W down to 0.5W for
  lower-volume playing without sacrificing valve character. Sound is delivered
  through a single 10" Celestion Ten-30 speaker that provides authentic British
  tone with strong mids, highs, and bass. A series effects loop allows external
  pedals and processors to be patched in after the preamp.
details: |-
  With a speaker perfectly chosen for great sound at low levels, this 5W amp provides you with the chance to experiment with your sound at home or at rehearsals. The variety of features mean that it can be used for multiple genres, anything from blues to heavy metal. Designed and engineered in UK. Made in Vietnam.

  Power reduction from 5W to 0.5W at the flick of a switch: choose the power that suits you. Toggle between a robust 5W or a softer output by simply flicking a switch. Whether you're recording your latest masterpiece in the studio or the comfort of your bedroom, the DSL5 Combo has got you covered.

  10" Celestion Ten-30: the 10" Celestion Ten-30 speaker offers authentic British tone and well-balanced sound, providing strong mids, highs and powerful bass. Using this speaker inside the DSL5 Combo adds extra depth and punch to your tone.

  Two gain channels: the DSL5 Combo boasts two gain channels, ultra gain and classic gain, controlled by a footswitch. Now you can immerse yourself in sonic exploration by effortlessly transitioning from ultra-clean tones to powerful distortion and uncover all the subtle shades in between.

  Compact and portable: play where you want, when you want, thanks to this compact, conveniently sized amplifier. Its design is tailored for practicality. It not only suits home use but also extends its functionality by being portable enough to effortlessly join you during band practice sessions.
specs: |-
  - All-valve
  - 5W to 0.5W at the flick of a switch
  - 10" Celestion Ten-30 speaker
  - Compact and portable
  - Suitable for a variety of genres
  - Model: DSL5CR
  - Range: DSL
  - Channels: 2
  - Technology: Valve
  - Output wattage: 5W (with power reduction option, 0.5W)
  - Outputs: 1 x 1/4" jack speaker output, 16 ohm load only; 1 x 3.5 mm jack emulated out
  - Inputs: 1 x 1/4" jack instrument input; 3.5 mm jack aux in, footswitch
  - Controls: classic gain channel (gain, volume), channel select, ultra gain channel (gain, volume), tone shift button, treble, middle, bass, deep EQ shift, reverb
  - Effects: digital reverb
  - Effects loop: yes, 1 x series
  - Speaker configuration: 1x10"
  - Speaker model: Celestion Ten-30 speaker (16 ohm, 30 W)
  - Unit impedance: 16 ohm
  - Preamp valves: 2 x ECC83
  - Power amp valves: 1 x 12BH7
  - Weight: 12.7 kg / 28 lb
  - Width: 455 mm / 17.9"
  - Height: 425 mm / 16.5"
  - Depth: 240 mm / 9.4"
  - Country of origin: designed and engineered in UK, made in Vietnam
  - Box contents: PEDL-90012 footswitch included, detachable power cable included
