description: Fusion 5 features a solid Spruce top, Mahogany back and sides, a full body with cutaway for extended playing range and more.
details: |-
  The Fusion 5 Natural is a nylon-string acoustic guitar that offers a familiar feel for steel-string players, making it a seamless bridge into the world of nylon. It features a solid spruce top with mahogany back and sides for a balanced voice with bright, articulate highs and warm, resonant lows, along with a cutaway for extended playing range.

  The Fusion-style neck with a 16 inch radius fretboard and 1 7/8 inch (48mm) nut width closely mirrors the feel of a steel-string guitar, offering ease of play for those with smaller hands or those new to nylon strings. Side dot markers provide clear fretboard reference, departing from traditional nylon-string designs. Equipped with the Fishman Presys VT Pickup System, the Fusion 5 Natural is ready to plug in and play.
