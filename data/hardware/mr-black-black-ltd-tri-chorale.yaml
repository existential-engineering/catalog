name: Black LTD. Tri-Chorale
manufacturer: mr-black
primaryCategory: pedal
categories:
  - chorus
url: https://www.mrblackpedals.com/products/black-ltd-tri-chorale
description: A tri-chorus pedal using three independent modulated delay lines
  sharing one LFO for deep dimension and sparkle. A Jack Deville original
  design, limited run of 63 pieces.
details: |-
  Chorus, or the ensemble sound, emerged in the mid-1970s as a lustrous shimmer
  built from a short modulated delay mixed back with the original signal. Within a
  decade a few designers in southern California asked what would happen if two more
  modulated delay lines were added at different times and mixed together, and the
  tri-chorus was born.

  Mr. Black's chief engineer Jack Deville revisited that idea and the Black LTD.
  Tri-Chorale is the result. Three independent delay lines modulate in concert, all
  sharing a common LFO but running at independent delay times and phase angles. The
  way those delay triplets interact with each other and the dry signal forges a
  sound that is organic and beautifully unpredictable, bringing new depth and life
  to a classic tone.

  The effect is refined to three simple controls that carve out the width of the
  sweeps, how fast those sweeps occur, and how much of the modulated delay triplet
  is blended in, from zero to 100 percent. It ranges from a soft summer breeze to
  wild and lush, and the compact box hides far more sounds than its simple face
  suggests.

  True-bypass switching, industry-standard pedal power and matched impedances make
  it easy to add to a pedalboard. Jack Deville original design, limited run of 63
  pieces.
specs: |-
  - Three independent modulated delay lines sharing one LFO (tri-chorus)
  - Controls: Width, Speed, Mix (0-100%)
  - Input Impedance: ~470KΩ
  - Output Impedance: ~2KΩ
  - True-bypass
  - 9VDC 2.1mm negative center-pin power (>100mA regulated supply recommended) or internal 9V battery
  - ~59mA current draw at 9VDC
  - 2.65" x 4.45" x 1.85" (67.3mm x 113mm x 47mm)
  - 9.0oz (255g)
  - Limited run of 63 pieces
  - Jack Deville original design
