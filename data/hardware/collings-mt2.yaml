description: The MT2 is a fully-appointed A-model mandolin with a seasoned
  Adirondack (Red) spruce top and premium maple back and sides. With superb
  tone, elegant stylings, and unmatched playability, it is built to please the
  most discerning players. Ivoroid binding with black/white purfling and high
  gloss nitrocellulose lacquer finish distinguish it from the entry-level MT.
details: |-
  The MT2 is Collings' fully-appointed A-style mandolin, featuring an Adirondack spruce top and Eastern flamed maple back, sides, and neck. Construction uses tone-bar bracing, a dovetail neck joint, and a fully adjustable truss rod. Ivoroid binding with black/white top and side purfling adorns the body, fingerboard, and peghead. The ebony fingerboard features MOP dot inlays and a compound radius (5 1/2" to 11 5/8"), with a 1 1/8" nut width and 1 9/16" string spacing. An ebony bridge with adjustable saddle provides precise intonation, and nickel Gotoh tuners with ivoroid buttons offer reliable tuning. The ebony peghead veneer carries the MOP Collings logo and flourish. The instrument ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Construction: A-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Ivoroid with b/w purfling
  - Fingerboard Binding: Ivoroid with b/w side purfling
  - Peghead Binding: Ivoroid with b/w side purfling
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo and flourish
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: High gloss nitrocellulose lacquer
  - Tailpiece: Original tailpiece
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 26 3/8"
