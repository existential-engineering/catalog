details: |-
  The RM-6 is Latvian microphone designer Artur Fischer's new flagship ribbon mic. The RM-6 achieves exceptional clarity and detail while maintaining the warmth and musicality that ribbons are known for. The RM-6's 1.2 micron ribbon is hand tuned and paired with a custom transformer for the lowest distortion and greatest presence. Please read Artur's design notes for more details and check out the audio samples to hear the RM-6 for yourself. To purchase the RM-6 outside of the US and Canada, please visit the DIY Audio Components Store . Features:

  DIY Friendly

  The RM-6 kit is accompanied by photo, step-by-step assembly instructions. It's a great kit for beginners, as the ribbon motor comes pre-assembled and there are six solder joints to complete. The required tools are a soldering iron, some solder, and a hex wrench (Allen Key) set. Kit Includes:

  A shock mount is not included. The SM-28 is sold separately here. What is the difference between the RM-5 and RM-6 DIY Ribbon Mic kits? The RM-5 and RM-6 are two different designs, they just share the same type of body. The main differences are:

  Hear a pair of RM-6s in a Blumlein setup below. Check out more audio samples under the "Audio" tab above. Audio

  The instruments (and vocals) in these videos were recorded using RM-6 Ribbon Microphones in Blumlein setup. Switch to HD video for higher audio quality. Design Notes

  RM-6 Ribbon Microphone is the result of all the experience and knowledge we have gained during the years of manufacturing and improving our parts and kits. The development process of RM-6 took nearly two years starting from the first sketches and ending with the units of the first prototype run. The RM-6 Ribbon Mic Kit features precision machined and individually hand-tuned RE-323 ribbon microphone motor with a 1" long ribbon made from highest quality Japanese aluminum foil and high-grade NdFeB magnets. The motor was designed with the help of magnetic flux analysis software in order to prevent the excessive saturation, reduce the flux leakage by around ten times comparing to RE-254 motor (RM-5 kit) and increase the flux density in the ribbon gap resulting in significantly higher output signal level. The RTP-28 toroidal transformer of our own design tuned for the higher impedance of thinnest foils gauges makes a perfect match with the motor revealing the great presence effect and preserving the clarity of sound. Bodies are individually machined by a local company from hand selected stainless steel tubing of finest grades with attention to the details and mechanically matte-brushed for our signature appearance. Our own original XLR receptacle is CNC carved right in the bottom cap and male XLR insert with gold-plated pins is included. The Bumblebee logo is engraved with a fiber laser, so it's nearly impossible to damage it. -Artur Fischer, Designer

