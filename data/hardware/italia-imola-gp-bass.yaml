details: |-
  The Imola GP was an idea brought to Italia by Styx rockstar bassist Ricky Phillips. Ricky had been playing an Imola 5 String that he loved, but wanted to try something a little different. We created a bass that gave Ricky a wide range of tone options to cover rock, funk, jazz, punk, all due to the specialized active pickup system on the GP. The Chambered Alder body, maple set neck and unique style put an arsenal of sound in your hands.
