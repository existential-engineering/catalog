description: The original Colour Box pedal format preamp, EQ, overdrive,
  distortion, fuzz, and DI box — a studio-grade Neve-inspired signal processor
  in a compact pedal enclosure with seven controls and no shift EQ knobs.
details: |-
  The original Colour Box pedal, first released in 2013/2014. A full-fledged studio-grade preamplifier, EQ, and distortion generator with multi-instrument compatibility. The V1 features a smaller enclosure with seven knobs total and no separate shift EQ knobs. Inspired by the idea of replicating the sound of plugging directly into a vintage Neve studio console. Used on recordings by U2, Wilco, The National, Spoon, Collective Soul, Muse, the War on Drugs, Phantogram, and others. Superseded by the V2 which added shift EQ knobs, Hi/Lo switch, phantom power, and an output transformer.
