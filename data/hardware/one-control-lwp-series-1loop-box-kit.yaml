description: A DIY effects loop box kit that can function as an A/B box, mute
  switch, or instrument input selector.
details: |-
  The 1Loop box is an effects loop box that can be used in various ways. If you use it as an effects loop, you will be able to turn on/off multiple effects at once and vintage effectors that alter your tone greatly when in bypass mode will become true bypass pedals. It can also be used as an A/B Box. If you step on the foot switch, you can switch the output to SEND or OUTPUT, so you can use it for a tuner out or an amplifier switcher. 1Loop is also a convenient input selector for switching between multiple instruments. By connecting instruments from the INPUT side and the RETURN side, you can switch between instruments with the foot switch. If you use only the INPUT and OUTPUT, this pedal can be a mute switch. You can mute the output by stepping on the foot switch; and if you step on it again, you can restore the output. This is a kit that allows you to make the 1Loop box yourself easily! It's mini-size and easy to handle and doesn't take up much space on your board. The power supply is only used to light the LED, so if you don't use the LED, it will work even if there is no power supply. The 1Loop Box Kit is easy to build, perfect for first time effects builders. All you need is solder, a soldering iron, a screwdriver, and a diagonal cutter/nipper for production. Production time: about 40 minutes

  ・ LWP Series 1Loop Box Kit Manual.pdf
