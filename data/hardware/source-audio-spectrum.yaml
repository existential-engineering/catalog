details: |-
  Building on years of envelope filter know-how, the Spectrum Intelligent Filter marries the legendary tones of vintage envelope filter pedals with modern ingenuity. It combines classic envelope filter characteristics with contemporary technology, offering extensive customization through dual filter effects, multiple envelope followers, and comprehensive sound design options.

  The Spectrum offers 25 different filter types (low-pass, band-pass, multi-pole, phaser effects), 11 envelope follower variations with adjustable attack/decay and ADSR triggering, 13 distortion types, 14 LFO wave shapes for filter modulation, and dual octave voices (one or two octaves down, one octave up).

  It stores 128 presets (6 accessible via pedal toggle, 128 via MIDI). Dual filter effects operate simultaneously with independent parameters, with supreme tracking and minimal latency. Universal bypass offers signal relay true bypass or a transparent buffer, and stereo I/O with panning controls is available via the Neuro 3 Editor.

  MIDI and control connectivity comes via USB-MIDI (Mini USB), with PC message support for preset recall, CC message mapping through the desktop editor, and MIDI clock synchronization for LFO rate.
specs: |-
  - 25 different filter types (low-pass, band-pass, multi-pole, phaser)
  - 11 envelope follower variations with adjustable attack/decay and ADSR triggering
  - 13 distortion types
  - 14 LFO wave shapes for filter modulation
  - Dual octave voices (one/two octaves down or one octave up)
  - 128 presets (6 accessible via pedal toggle; 128 via MIDI)
  - Dual filter effects operating simultaneously with independent parameters
  - Universal bypass: signal relay true bypass or transparent buffer
  - Stereo I/O with panning controls via Neuro 3 Editor
  - USB-MIDI connectivity (Mini USB)
  - MIDI clock synchronization for LFO rate
  - Housing: brushed anodized aluminum
  - Weight: 0.625 lb
  - Dimensions: 4.6 in. x 2.75 in. x 2.2 in.
  - Power consumption: 165 mA
