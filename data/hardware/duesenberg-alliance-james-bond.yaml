description: Introducing the James Bond 007 Guitar - Signed & Numbered David
  Arnold Edition - by Duesenberg. German guitar maker Duesenberg joins forces
  with James Bond and long-term collaborator and five-time 007 composer David
  Arnold to make a unique guitar.
details: |-
  The Alliance Series James Bond 007 / David Arnold Edition is based on Duesenberg's Paloma and is strictly limited to 75 pieces worldwide, each individually numbered, handmade and personally signed by composer David Arnold. The run is drawn from a custom Duesenberg guitar co-created with Arnold for the Sound of 007 in Concert in October 2022.

  Construction is a solid Alder body with a set one-piece Maple neck and an Indian Rosewood fingerboard of 305 mm / 12" radius. The neck has a Medium D shape, 22 jumbo frets, pearloid diamond inlays and a steel dual-action trussrod, and the scale length is 648 mm / 25.5". The body measures 46 x 34 cm / 18" x 13.4" with 4.2 cm / 1.7" sides, carries multi-ply black and white binding, and is finished in PUR lacquer.

  The cosmetic treatment is monochrome black and white, with the gun barrel design on the front of the body and a graphic layout of the 25 James Bond film titles on the back. The headstock carries a vintage 007 gun logo, the volume and tone knobs are engraved with 007, and the black pickguard is signed by David Arnold.

  Electronics are a Duesenberg Alnico Blade Singlecoil at the neck, a Duesenberg Pearlito Singlecoil in the middle and a Duesenberg GrandVintage Humbucker at the bridge, wired to one volume, one tone and a 4-way rotary switch. Hardware is nickel finished and includes Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, a Duesenberg Diamond Deluxe Tremola vibrato in the short version and Straplock-compatible Duesenberg Standard strap pins. The guitar is strung with Duesenberg Custom 010/050.

  The edition ships in a 007 Duesenberg deluxe black hardcase with a secret pull-out leather drawer concealed under the 007 lid of the accessory compartment, which holds four limited edition 007 Duesenberg picks. Also included are a limited edition fine art print signed by Arnold and Duesenberg's CEO Ingo Renner, a numbered gold embossed certificate in a black envelope, a welcome letter on linen paper and all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Pearloid diamonds
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black, Vintage 007 Logo
  - Body type: Solidbody, Alder
  - Body dimensions: 46 x 34 cm / 18" x 13.4"
  - Height (sides): 4.2 cm / 1.7"
  - Binding: Multi-ply Black/White
  - Pickguard: Black, signed by David Arnold
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Diamond Deluxe Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 010/050 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Alnico Blade Singlecoil
  - Pickup (middle): Duesenberg Pearlito Singlecoil
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 4-Way Rotary Switch
  - Case: Duesenberg Custom Line Case
  - Tools: All required allen keys included
