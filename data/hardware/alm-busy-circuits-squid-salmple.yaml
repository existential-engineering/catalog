description: >-
  The SQUID SALMPLE is an 8-channel Eurorack audio and CV sampler designed for
  immediate real-time sampling, editing, and mangling within a modular context.
  Taking influence from early hardware samplers, it combines hands-on usability
  with a Pamela's Workout-style interface and supports sampling and playback of
  both audio and CV signals with full CV control of all parameters.
details: |-
  The SQUID SALMPLE is ALM's flagship 8-channel Eurorack sampler, purpose-built for live performance and real-time sound design. Drawing inspiration from early hardware samplers, the module prioritises tactile, intuitive operation through a Pamela's Workout-style interface.

  Each of the eight independent channels holds approximately 11 seconds of 16-bit / 44.1kHz audio with a trigger response time of just 1–2ms. All key parameters — bit depth, playback rate and direction, pitch, amplitude, filter, looping, and cue positions — can be edited in real time.

  The module ships with a USB stick containing approximately 90 banks of royalty-free samples curated by ALM and collaborating artists. The Axon-1 and Axon-2 expander modules add up to 8 additional CV and control inputs. Free community banks can be downloaded from squidbanks.com.
specs: |-
  - Format: Eurorack
  - Width: 21HP
  - Depth: 38mm
  - Power: +12V 300mA max / -12V 35mA
  - Channels: 8
  - Sample quality: 16-bit / 44.1kHz
  - Sample time: ~11 seconds per channel
  - Trigger latency: 1–2ms
  - Outputs: 4× DC-coupled stereo pairs + 1× AC-coupled mix
  - Record input: 1× mono
  - CV inputs: 3× assignable + 3× dedicated 1V/oct (Ch 6, 7, 8)
  - Expander support: Axon-1, Axon-2
  - Storage: USB (WAV banks of 8)
  - Reverse power protection: Yes
  - Made in England
