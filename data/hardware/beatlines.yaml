description: BeatLines 2 is a sample based step sequencer. Redesigned gui | new
  dsp beat engine | new features.
details: |-
  BeatLines 2 is a sample based step sequencer with a redesigned gui and new dsp
  beat engine offering maximum accuracy and new layers of polyphony.

  You can now create up to 32 beat and 32 MIDI lines (total of 64), each one
  completely independent. Every line can be closed if not used to lighten the
  cpu load, or just to manage your thoughts when looking the beat area.

  Time signatures is fully flexible. From 1/32nd to 32/4ths. Use time signatures
  multiple of a whole (8/4,16/8, etc...) to create 2 or more bar grooves.

  The level and pitch controls are now show in each beat, no need for overlaying
  sliders! Cmd / ctrl + drag to change the values.

  We partnered with realdrumsamples.com, so beatlines now include two great drum
  sample libraries with over 90 drum samples.
specs: |-
  - Sample-based step sequencer
  - Up to 32 beat lines
  - Up to 32 MIDI lines
  - Total of 64 independent lines
  - Flexible time signatures from 1/32nd to 32/4ths
  - Redesigned gui
  - New dsp beat engine
  - Mixer interface
  - Included audio effects
  - Level and pitch controls per beat
  - Humanize time and dynamics separately
  - Drum sample libraries with over 90 drum samples
