description: "- Our most bombastic fuzz ever! - Tons of gain and volume on tap -
  Refined Filter controls – 3 distinct EQ profiles - Available exclusively
  through Quimper Sound Records & Guitars - Click here to buy now !"
details: |-
  The Moon Op Amp Fuzz is Keeley's heaviest op amp fuzz, with a deep bass response and a large amount of gain and output volume on tap. A filter control covers a wide range of usable tones and a filter switch selects three EQ profiles: scooped mids, which the maker calls the classic voicing, flat EQ, and full range. It is intended to take drive pedals in front of it for more complex tones.

  The sound comes from a quad op amp providing four stages of gain and fuzz. The circuit has its roots in the Keeley Dark Side, which was voiced as a vintage sounding lead fuzz; the Moon was deliberately voiced in the opposite direction, extending guitar or bass frequencies as low as possible for a deep, sustaining fuzz whose notes peak into feedback, while keeping lead tones harmonically rich.

  Robert Keeley describes the design as a heavily modified Rotten Apple or Dark Side that changed enough to become a different circuit: the gain stages are stacked differently and the low end is added at a different point, so the pedal gains more gain without the bass eating the headroom, and the tone control was reworked to tighten its range.
specs: |-
  - Quad op amp providing four stages of gain and fuzz
  - Filter control with a wide tone range
  - Filter switch with three EQ profiles: scooped mids, flat EQ and full range
  - Voiced to extend guitar or bass frequencies as low as possible
