name: SR24 EQ
manufacturer: api-audio
primaryCategory: eq
categories:
  - rack-mount
capabilities:
  - equalization
url: https://apiaudio.com/product/sr24-eq/
description: 2-channel 2U rackmount 4-band parametric EQ based on the vintage
  APSI Model 562 circuit. Continuously variable frequency and gain per band, ±12
  dB boost/cut, transformer-balanced outputs, and both XLR and 1/4-inch I/O.
details: |-
  2-channel 4-band fully parametric EQ re-engineered from the APSI Model
  562 (late 1970s–early 1980s). All four bands: peak/dip, ±12 dB boost/cut,
  continuously variable frequency — Low (20–200 Hz), Low-Mid (100 Hz–1 kHz),
  High-Mid (500 Hz–5 kHz), High (2–20 kHz). Custom transformer-balanced outputs.
  Fully balanced XLR and 1/4-inch I/O. +24 dB headroom. Weight: 13 lb.
specs: |-
  - Input impedance: 12 kΩ
  - Output impedance: 300 Ω (transformer balanced)
  - Bandwidth: ±0.5 dB (20 Hz–20 kHz)
  - THD+N @ 1 kHz, +4 dBu: 0.01%
  - S/N ratio: −100 dB
  - Max level: +23 dBu
  - Headroom: +24 dB
  - Power: 10 W
  - Rack format: 2U EIA 19"
  - Dimensions: 19" × 3.5" × 10" D
  - Weight: 13 lb
