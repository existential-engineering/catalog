details: |-
  Product Overview

  The Heil RC 22 is a professional dynamic wireless replacement microphone capsule designed to bring the pristine audio performance, clarity, and articulation of the hardwired Heil PR 22 microphone to wireless handheld transmitters. Built specifically for live vocal sound reinforcement, the RC 22 delivers exceptional vocal presence and high gain-before-feedback on loud stages, ensuring lead and backing vocals cut effortlessly through dense live instrument mixes.

  Engineered with a wide 50 Hz to 18 kHz frequency response and a specialized dynamic element structure, the RC 22 handles high sound pressure levels up to 145 dB SPL without distortion. Featuring a cardioid polar pattern with -30 dB of rear rejection at 180° off-axis , it minimizes monitor bleed, drum spill, and stage ambient noise. The RC 22 utilizes industry-standard threading, making it compatible with major professional wireless handheld transmitters (such as Shure, Lectrosonics, Audio Technica and Line 6 models with removable capsules) for an instant upgrade in live vocal performance.
specs: |-
  - PR 22 Sound Quality for Wireless Systems: Translates the sound and vocal articulation of the wired PR 22 dynamic microphone into a convenient wireless capsule format.
  - Universal Wireless Transmitter Compatibility: Threaded mount attaches directly to popular industry-standard handheld wireless transmitters featuring 31.3 mm / 1.0 thread diameter (including compatible Shure, Lectrosonics, Line 6, and Sony systems).
  - High Gain-Before-Feedback: Designed to provide maximum volume in stage monitors and PA systems without feeding back, making it ideal for high-volume live concerts.
  - Exceptional Rear Noise Rejection (-30 dB): Cardioid pickup pattern effectively rejects off-axis stage noise at 180°, isolating the lead vocal from loud guitar cabinets, drums, and monitor bleed.
  - High SPL Capability (145 dB Max SPL): Handles powerful vocalists and loud SPL conditions without clipping, distortion, or mechanical overload.
  - Internal Shock Mounting: Integrated element isolation protects against handling noise and transmitter body vibration during live stage movements.
  - Durable Mesh Grille & Replaceable Windscreen: Rugged metal screen construction protects the internal element while reducing breath plosives and sibilance.
  - Element Type: Dynamic.
  - Frequency Response: 50 Hz – 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -30 dB.
  - Impedance: 370 ohms balanced.
  - Max SPL: 145 dB.
  - Threading / Interface: industry-standard 31.3 mm diameter / 1.0 thread pitch wireless mount.
  - Weight: 4.9 oz (138.9 g).
  - Passive dynamic element, draws no power from the transmitter battery.
  - Not directly compatible with Sennheiser handheld transmitters without a third-party thread adapter.
