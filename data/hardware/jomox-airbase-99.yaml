description: >-
  The JoMoX AirBase 99 is a 1U rack-mount analog/digital drum tone module based on the
  XBase 09, offering 9-voice polyphony with authentic 808, 909, and CR-78 style sounds. It
  combines true analog circuits for kick, snare, and toms with high-quality samples for
  hi-hats, cymbals, clap, and rimshot. Designed for MIDI-driven programming, it provides
  extensive parameter control far beyond the original drum machines it emulates.
details: |-
  Released in 1998, the JoMoX AirBase 99 takes the acclaimed sounds of the XBase 09 and packages them into a 1U rack-mount MIDI module designed for use as a drum tone module with external sequencers. It improves on its predecessor with increased 9-voice polyphony and the addition of tom sounds.

  The AirBase faithfully emulates 808, 909, and CR-78 style drum sounds with excellent quality. Kick, snare, and toms are generated by true analog circuits with various tune and envelope controls, while hi-hats, cymbals, clap, and rimshot are high-quality samples that can still be tuned and even reversed. Resonant highpass and lowpass filters plus a bandpass filter can be applied to the hi-hat sounds.

  The front panel is intentionally minimal, featuring just two knobs and a few buttons and LEDs, as the AirBase is designed to be programmed primarily through MIDI parameter control. Each drum tone offers more editable parameters than the original beat boxes it emulates. Two global LFOs can modulate the pitch of any sounds and sync to MIDI.

  With 1,024 user and 500 preset drum kit settings, the AirBase 99 provides roughly 38 times more patch memory than competing products like the Novation Drum Station. Individual outputs for each drum sound and a stereo output provide flexible routing options for studio use.
specs: |-
  - Polyphony: 9 voices
  - Drum Tones: 808/909 kicks, snare, clap, rimshot, toms, cymbals, hi-hats, ride, noise
  - Synthesis: Analog circuits (kick, snare, toms), sample-based (hats, cymbals, clap, rimshot)
  - Filter: Resonant HP and LP filters for hi-hats, bandpass filter
  - LFO: 2 global (MIDI syncable, pitch modulation)
  - Effects: None
  - Memory: 1,024 user kits, 500 preset drum kits
  - Outputs: Individual outs per sound, stereo out
  - Control: MIDI (9 parts)
  - Form Factor: 1U rack-mount
