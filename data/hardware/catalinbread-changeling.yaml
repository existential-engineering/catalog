details: |-
  The Changeling Envelope Filter is Catalinbread's reimagining of the Seamoon Funk Machine, a beloved envelope filter from the 1970s. Rather than cloning the original outright, Catalinbread retained the core circuit while incorporating the best changes from later revisions, resulting in a pedal that captures the character of the original with significantly improved usability.

  A key addition is a JFET input buffer circuit, originally designed with Rhodes piano players in mind but equally suited to bass, guitar, and keyboards. This buffer ensures the pedal responds cleanly and consistently regardless of the instrument plugged in.

  The FREQUENCY knob sweeps the filter across a refined range, delivering everything from low rumble to high-pitched vowel tones without the excessive resonance that could make the original difficult to dial in. The DEPTH knob controls filter intensity and touch sensitivity, making it easy to adjust the pedal's responsiveness for fingerstyle playing or pick attack.

  The pedal draws only 1mA of current, making it very power-supply friendly, and requires a standard 9V center-negative adapter.
