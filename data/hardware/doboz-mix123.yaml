description: MIX123 is a three channel audio and/or control voltage processor
  for Eurorack systems, where each channel can be configured as an active
  attenuverter or attenuator to mix, combine, offset or invert signals.
details: |-
  A three channel audio and/or control voltage processor. Each channel can be configured as an active attenuverter or attenuator. When an output is left unpatched, the signal from that channel is routed to the next channels output. Mix audio signals, combine, offset or invert CVs.
