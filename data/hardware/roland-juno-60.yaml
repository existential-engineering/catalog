description: >-
  The Roland Juno-60 is a six-voice analog polyphonic synthesizer released in
  1982 as an evolution of the Juno-6, adding 56 patches of memory storage. It
  remains highly regarded for its punchy, warm sound character and is often
  considered superior in tone to its successor, the Juno-106.
details: |-
  The Juno-60 was among the first in Roland's acclaimed Juno family of synthesizers, building on the foundation of the Juno-6 with the critical addition of patch memory. With 56 standard patches and up to 76 accessible via a button combination, performers could save and recall custom sounds instantly, making it far more practical for live use and studio sessions.

  Sonically, the Juno-60 is still popular due in part to opinions that it sounds better and punchier than the Juno-106. Its DCO-based architecture delivers the richness and warmth of analog synthesis while maintaining tuning stability. The resonant low-pass filter and non-resonant high-pass filter provide versatile tonal shaping, and the built-in chorus effect contributes to the lush, wide sound the Juno series is known for.

  Like the Juno-6, the Juno-60 lacks MIDI, instead using Roland's proprietary DCB interface for external communication. An MD-8 converter can be used to bridge DCB to MIDI. The optional JSQ-60 sequencer provided basic sequencing capabilities. Notable users of the Juno-60 include Enya, The Cure, Vince Clarke, Faithless, and Astral Projection, cementing its place across pop, rock, and electronic music genres.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: DCO with pulse, saw, and square waveforms
  - LFO: Rate and delay controls
  - Filter: Non-resonant high-pass and resonant low-pass
  - VCA: Level, ADSR envelope, and gate
  - Keyboard: 61 keys (no velocity or aftertouch)
  - Memory: 56 patches (76 accessible via button combination)
  - Control Interface: DCB (Roland-to-Roland sync; MD-8 converts to MIDI)
  - Sequencer: External JSQ-60 support
