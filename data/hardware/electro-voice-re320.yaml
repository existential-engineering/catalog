description: Variable-D dynamic vocal and instrument microphone designed for
  broadcasting, podcasting, recording, and sound reinforcement. A dual-voicing
  switch selects between a general-purpose response for voice and most
  instruments and a dedicated kick-drum curve tailored for bass drums and some
  baritone voices.
details: >-
  The Electro-Voice RE320 is a large-diaphragm cardioid dynamic microphone built
  around an N/Dym neodymium magnet structure, delivering high sensitivity,
  extended low-frequency reach, and the smooth, controlled transient response
  associated with Electro-Voice's broadcast pedigree. Like the RE20 before it,
  the RE320 uses Variable-D (variable distance) acoustic porting to virtually
  eliminate proximity effect, so close-mic vocal and instrument work stays
  tonally consistent as the source moves toward or away from the capsule and
  off-axis sources do not color the sound.


  The defining feature of the RE320 is its dual-voicing switch on the body,
  which toggles between two distinct response curves. The general-purpose curve
  (45 Hz - 18 kHz) is tuned for broadcast, podcast, voiceover, vocals, and most
  instrument sources, with a smooth midrange and a controlled presence lift that
  translates well to spoken word and singing alike. The kick-drum curve (30 Hz -
  18 kHz) introduces an aggressive low-end extension and a scooped midrange with
  a pronounced upper-mid attack peak, ready-EQ'd for bass drum, low toms, and
  some baritone voices that benefit from added weight and beater click.


  An integrated humbucking coil rejects line hum from nearby lighting and video
  gear, and an integral pop filter helps tame plosives at close range. The
  microphone is housed in a steel body with a semi-gloss black finish and
  terminates in a balanced 150-ohm output on a standard 3-pin XLR connector. It
  ships with the 81715 stand clamp; the WSPL-2 foam wind screen and 309A
  isolation mount are available as optional accessories.
specs: >-
  - Generating element: Dynamic, N/Dym (neodymium) magnet structure

  - Polar pattern: Cardioid (Variable-D)

  - Frequency response (general curve): 45 Hz - 18,000 Hz

  - Frequency response (kick curve): 30 Hz - 18,000 Hz

  - Dual-voicing switch: general purpose / kick drum

  - Impedance: 150 ohms balanced

  - Sensitivity (open-circuit voltage, 1 kHz): 2.5 mV/pascal

  - Hum pickup (60 Hz, 1 millioersted field): -130 dBm typical

  - Polarity: Pin 2 positive referenced to Pin 3 with positive pressure on
  diaphragm

  - Connector: 3-pin XLR

  - Integrated humbucking coil

  - Integral pop filter

  - Length: 8.53 in (216.7 mm)

  - Widest diameter: 2.14 in (54.4 mm)

  - Body diameter: 1.94 in (49.2 mm)

  - Net weight: 1 lb 8 oz (681 g)

  - Shipping weight: 3 lb 5 oz (1,503 g)

  - Case material: Steel

  - Finish: Semi-gloss black

  - Included accessories: 81715 stand clamp

  - Optional accessories: WSPL-2 foam wind screen, 309A isolation mount
