details: |-
  A professional diversity wireless system featuring the B60 bodypack transmitter.

  This bodypack may be used with any lavalier, head-worn, or instrument microphone in the AUDIX line, as well as guitar and bass. Optional accessories include a single space rack mount kit with BNC cables for front mounting antennas, rackmount kit for mounting two systems in one rack space, active directional antennas, and antenna distribution system for up to four systems (4 channels)
specs: |-
  - System: R41 diversity receiver with B60 bodypack transmitter
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - 32 MHz wide spectrum receiver
  - 64 MHz wide spectrum transmitter
  - 106 pre-coordinated frequencies
  - Durable metal housing
