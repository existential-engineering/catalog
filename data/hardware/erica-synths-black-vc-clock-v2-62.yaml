description: Erica Synths Black VC Clock is the beating heart of your modular system.
details: |-
  The Black VC Clock V2 generates several clock signals simultaneously and carries advanced features such as tap tempo, shuffle and divide, both for controlled rhythmic music production and for experiments with a high level of uncertainty. The adjustable and even random duty cycle of the shuffling and random clock outputs opens up further rhythmic territory, and the module doubles as a performance time stopwatch.

  BPM is set manually or by CV and shown on a three digit indicator, clock division and multiplication are on hand, an external clock input locks the module to another source, and a sequencer reset output can be fired manually or programmed.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  Maximum input level spans -10V to +10V, clock signals leave at 0V to +5V, the clock rate runs from 30 to 400BPM, and CV inputs sweep fully across -5V to +5V. The module occupies 10HP at a depth of 25mm.
specs: |-
  - Manually and CV adjustable BPM
  - Clock division and multiplication
  - External clock input
  - 3 digit BPM indicator
  - Manually and CV controllable shuffle amount
  - Manual and programmable sequencer reset output
  - Adjustable duty cycle of shuffling and random clock
  - Performance time stopwatch
  - Max input level -10V to +10V
  - Clock signal level 0 to +5V
  - Clock rate 30 to 400BPM
  - CV input level (full sweep) -5V to +5V
  - Power consumption 40mA@+12V, 5mA@-12V
  - Module width 10HP
  - Module depth 25mm
