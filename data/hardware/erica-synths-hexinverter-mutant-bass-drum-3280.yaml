description: New take on the 808 bassdrum.
details: |-
  Hexinverter took one of the most revered bassdrum synthesis designs of all time, the TR-808, and completely redesigned it for use in a modular analogue synthesizer, combining it with voltage controlled distortion.

  The analogue bassdrum circuitry is capable of vanilla TR-808 sounds, and the built in voltage controlled distortion (batteryACID distortion) adds the grit. The distortion accepts external inputs when it is not being used with the kick drum, which makes it useful for acid synth leads on its own.

  Voltage control covers the distortion amount, the decay from short kicks to long sustained tones, and the pitch, which approximates a V/oct response without being musically tuned. Non-invasive analogue optocouplers are used for the voltage control, so completely vintage sounds are still available.

  The signal chain was completely redesigned, replacing cheap transistor amplifiers with low noise opamp equivalents.

  The module is a reissue redesigned by Erica Synths in close collaboration with Hexinverter. In September 2022 Stacy Gaudreau, the founder of Hexinverter Électronique, announced the closing of its operations, and Erica Synths took over the manufacturing, sales and support of several of those modules, retaining all functionality while redesigning the hardware, with support provided for the reissue modules only.
specs: |-
  - Analogue bassdrum circuitry capable of vanilla TR-808 sounds
  - Built in voltage controlled distortion (batteryACID distortion)
  - Distortion accepts external inputs when not used with the kick drum
  - Voltage control of distortion amount
  - Voltage control of decay
  - Voltage control of pitch (approximates V/oct response, not musically tuned)
  - Non-invasive analogue optocouplers used for voltage control
  - Low noise opamp based signal chain
  - Audio output 10Vptp
  - CV levels -5V to +5V
  - Power consumption +21mA, -16mA
  - Module width 13HP
  - Module depth 20mm
