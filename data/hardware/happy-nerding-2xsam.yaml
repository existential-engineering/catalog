description: 2xSAM is a 4 HP dual stereo attenuator-mixer with separate stereo
  outputs for attenuator duties, a stereo mixer output, and optional 5x input
  gain to raise line levels to modular amplitude.
details: |-
  2xSAM is a 4 HP dual stereo attenuator-mixer with separate stereo outputs for attenuator duties and a stereo mixer output.

  An optional 5x gain is available for each input to raise line levels to modular amplitude, set by jumpers on the backside, with clean low noise and distortion performance. The inputs are AC coupled, and the right inputs are normalled to the left inputs for easy mono operation.

  Several 2xSAMs can be chained together or with other Happy Nerding stereo modules via sockets on the back side. The total mix stereo output can be internally sent to the Isolator, PanMix Jr or 3xStereo Mixer, or can be received from OUT, PanMix, PanMix Jr, 3xStereo Mixer or another 2xSAM.

  If the jumpers are not installed, placed on one pin only by default, the max gain is 1x. When a jumper is properly placed on both pins the gain is 5x. There are four inputs thus four jumpers, and each jumper is relevant to its channel.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - Dual stereo attenuator-mixer
  - Separate stereo outputs for attenuator duties
  - Stereo mixer output
  - Optional 5x gain per input via backside jumpers, one jumper per input
  - AC coupled inputs
  - Right inputs normalled to left inputs for mono operation
  - Rear sockets for chaining with other Happy Nerding stereo modules
  - 27 mA +12V
  - 27 mA -12V
  - 35 mm depth
  - 4 HP wide
  - Reverse power protected
