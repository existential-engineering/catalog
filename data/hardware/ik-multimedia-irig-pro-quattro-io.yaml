description: "4-input professional field recording interface and mixer"
details: |-
  The interface supports multichannel, stereo, and mono operation modes with a built-in limiter featuring a -12 dB safety mode. Direct monitoring via the headphone output, Loopback and Loopback+ for app audio routing, and standalone mixer/preamp operation provide flexible workflow options. It is MFi-certified for iOS devices and compatible with iPhone, iPad, Android, Mac, and PC.

  Flexible power options include 4x AA batteries, USB bus power, and 9VDC external power supply. Battery life ranges from 1.5 hours recording with alkaline batteries to 4 hours playback with NiMH. Included cables cover Lightning, USB-C, and USB-A to Mini-DIN connections plus a 2.5mm TRS to MIDI adapter.
specs: |-
  - 24-bit A/D and D/A conversion
  - Sample rates: 44.1, 48, 88.2, 96 kHz
  - 4x XLR/TRS combo inputs with 48V phantom power
  - Balanced XLR stereo outputs
  - 3.5mm TRS stereo line output
  - 3.5mm TRS headphone output with direct monitoring
  - RCA stereo line inputs
  - 3.5mm TRS stereo line input
  - Built-in omnidirectional MEMS microphone (DSP-controlled)
  - MIDI In/Out via 2.5mm TRS
  - Dimensions: 172 x 105 x 47 mm (6.77" x 4.13" x 1.85")
  - Weight: 330 g (11.64 oz) without batteries
