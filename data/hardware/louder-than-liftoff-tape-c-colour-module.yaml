description: A fully analog tape machine emulation module for the DIYRE Colour format (Chroma, Mister Focus, DIYRE Colour Palette, Silver Bullet mk2) that captures the character of 15 IPS tape recording — including distortion, saturation, low-frequency head bump, high-frequency response shifts, and phase shifts. Single-channel, simplified sibling of the TAPE•79 Mojo Module for the Silver Bullet mk2.
details: |-
  TAPE•C is a fully analog tape machine emulation module for the Colour format that convincingly captures the magnetic magic of 15 IPS tape. Drawing upon many years of combined experience working with real tape decks our team set out to capture the essence of how tape transforms sounds during tracking and mixing. We realized this would be no easy feat so we spent almost two years developing a design that would be an idealized emulation inspired by the hot-rodded Studer and MCI decks in my own personal studio. This is a design which combines all our favorite aspects of recording to tape without any of the calibration, maintenance, or noise floor frustrations.

  We wanted to create a module that embodied the subtle nuances of distortion, saturation, frequency shifts (including low frequency head bump), and most importantly phase shifts that occur when a signal is recorded and played back from real tape. Our goal was to create a tool that was simple in operation, but complex in sonic result, unlike many plugin emulations which offer cartoonish or overly effected results. We believe TAPE•C truly delivers the essence of tape.

  With real tape one would align and calibrate the tape machine for optimal response and simply roll tape. This module embraces that same set-it-and-forget-it approach so you focus more on recording amazing tones, and less on tweaking knobs. A set of dip switches on the module allows the user to fine-tune the head bump and high frequency response of TAPE•C to emulate different types of tape decks. This Colour module is a single channel, simplified version of our beloved TAPE•79 Mojo Module for the Silver Bullet mk2.
