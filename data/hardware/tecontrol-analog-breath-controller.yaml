description: The TEControl bca is an Analog Breath Controller, signal compatible
  with Yamaha's discontinued breath controllers.
details: |-
  Compared to yamaha's bc3 breath controller, the bca contains a modern
  piezoelectric pressure sensor and a much improved signal conditioning circuit.
  The sensor is not only more sensitive but also free from drifts and
  hysteresis, which plagued the membrane sensor of the bc3.

  The offset and gain controls are more precise and, unlike the bc3, they are
  independent from each other: this means that changing gain does not affect
  offset and vice-versa.

  The bca is delivered with a flexible headset which allows bending to a
  comfortable shape and yet is springy enough to clamp around the head. The
  headset also includes a yamaha bc3-style mouthpiece with adjustable bleed
  valve that can be rotated away from the mouth when not in use.
specs: |-
  - Piezoelectric pressure sensor
  - Signal conditioning circuit
  - 3.5 mm breath input jack compatibility
  - Independent offset and gain controls
  - Flexible headset
  - Yamaha bc3-style mouthpiece
  - Adjustable bleed valve
