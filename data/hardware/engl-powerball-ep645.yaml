description: Fully analog true-bypass distortion pedal voiced after the Lead 2
  channel of the ENGL Powerball II, with gain, volume and a three-band EQ
  offering 7.5 dB of cut and boost per band.
details: |-
  The Powerball pedal is tonally based on the Lead 2 channel of the ENGL Powerball II, recreating the gain stages of the amp itself.

  True bypass and completely analog, the pedal's specially selected components offer up a particularly high level of sound quality. The electronics assembly is protected by a highly durable housing, meaning you get a pedal that's going to deliver for a lifetime.

  Gain sets the amount of gain, Volume sets the output level, and Bass, Middle and Treble each cut or boost their band by up to 7.5 dB. The true bypass footswitch turns the effect on and off, routing the signal straight from the input to the output jack when it is off.

  The pedal runs on 9 V DC with a negative center and is protected by a zero loss reverse polarity protection circuit. A second DC jack can supply additional effect devices for daisy chaining. For ecological reasons the pedal does not accept batteries, and power consumption is 18 mA.
specs: |-
  - Fully analog signal path
  - True bypass footswitch: signal routed directly from input to output when the effect is off
  - GAIN: controls the amount of gain
  - BASS: controls the amount of low frequencies, -7.5 dB to +7.5 dB
  - MIDDLE: controls the amount of middle frequencies, -7.5 dB to +7.5 dB
  - TREBLE: controls the amount of treble frequencies, -7.5 dB to +7.5 dB
  - VOLUME: controls the output volume
  - Power: 9 V DC negative center, with zero loss reverse polarity protection
  - Second DC jack for daisy chaining additional effect devices
  - Does not accept batteries
  - Power consumption: 18 mA
