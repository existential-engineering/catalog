details: |-
  The T5z Pro is Taylor's mid-tier hybrid hollowbody, bridging acoustic and electric with a three-pickup system: a concealed neck humbucker, a visible middle humbucker, and an acoustic body sensor. Five-way switching and active tone controls deliver everything from warm acoustic sounds to electric tones.

  Built with a Big Leaf Maple top and Shamel Ash back and sides, the body is contoured with an integral armrest, Venetian cutaway, and rosette f-holes. The Neo-Tropical Mahogany neck in T5 Carve profile is topped by a West African Crelicam Ebony fretboard with jumbo frets. At 24-7/8" scale length and 1-11/16" nut width, it plays like a traditional electric guitar.

  Ships with D'Addario XS Coated Electric Medium strings (.011-.049) and a deluxe hardshell case. Offered in a range of Shaded Edgeburst colorways.
specs: |-
  - Body: Thinline Hollowbody with Venetian Cutaway
  - Top: Big Leaf Maple
  - Back & Sides: Shamel Ash
  - Neck: Neo-Tropical Mahogany, T5 Carve profile
  - Fretboard: West African Crelicam Ebony
  - Scale Length: 24-7/8"
  - Nut Width: 1-11/16"
  - Frets: Jumbo
  - Pickups: Concealed neck humbucker, visible middle humbucker, acoustic body sensor
  - Switching: 5-way; Active tone controls
  - Bridge: West African Crelicam Ebony
  - Strings: D'Addario XS Coated Electric Medium (.011-.049)
  - Case: Deluxe hardshell case included
