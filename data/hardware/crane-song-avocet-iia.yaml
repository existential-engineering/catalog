name: Avocet IIA
manufacturer: crane-song
primaryCategory: monitor
url: http://cranesong.com/avocet.html
description: Avocet IIA is a stereo monitor controller with three digital
  inputs, three analog inputs, and a built-in headphone system, designed to
  solve problems of accurate monitoring and volume control for workstation
  users, studios, and mastering rooms.
details: |-
  Avocet IIA is designed to solve the problems of accurate monitoring and volume control as required by workstation users, studios and mastering rooms alike. It is a stereo controller with three digital inputs, three analog inputs and a headphone system, comprised of a rack mounted unit and table top remote control. It includes dim, mute, phase, mono, and 16 bit truncation functions, plus a speaker select switch that sends line level balanced audio to one of three outputs. The six input sources have on-the-fly gain trim capability and all digital signals are up-sampled and jitter reduced to ensure highest accuracy during D/A conversion.

  The unit uses the Quantum DAC, described as the 5th generation design from Crane Song with less than 1pS of jitter. The Quantum DAC uses a 32 bit converter and ASRC for jitter reduction, up-sampling to 211KHz (a behavior Avocet has always had). The reference clock has less than 1pS jitter (0.5pS typical) from 1Hz to 100KHz, and uses a proprietary reconstruction filter for accurate time domain response.

  Direct subwoofer outputs have been added for each of the three outputs, and output levels are now programmable in 0.25db steps for speaker level matching.

  The internal headphone amplifier can be fed from the program source or an external input, and provisions for a talk back function are included.

  Avocet IIA can operate in surround up to 7.1, with the appropriate number of audio boxes in the system.
specs: |-
  - Quantum DAC: 5th generation Crane Song DAC design with less than 1pS jitter
  - 32 bit converter with ASRC for jitter reduction, up-samples to 211KHz
  - Reference clock jitter: less than 1pS (0.5pS typical), 1Hz to 100KHz
  - Proprietary reconstruction filter for accurate time domain response
  - Direct subwoofer outputs for each of the three outputs
  - Output levels programmable in 0.25db steps for speaker level matching
  - Three digital inputs, three analog inputs
  - Six input sources with on-the-fly gain trim
  - Dim, mute, phase, mono, and 16 bit truncation functions
  - Speaker select switch for one of three line-level balanced outputs
  - Internal headphone amplifier, switchable between program source and external input
  - Talk back function provisions
  - Surround operation up to 7.1 with appropriate number of audio boxes
  - Rack mounted unit with table top remote control
