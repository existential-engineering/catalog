details: |-
  These two Fuzz Bender Custom Shop editions were offered in a Bubblegum Pink or a Surf Green finish, each carrying the Custom Shop insignia.

  The Fuzz Bender is a five-knob, three-transistor fuzz that combines high-gain silicon with germanium. Two gyrators work as an active EQ, giving over 20 dB of boost or cut at 100 Hz and 10 kHz, which allows fuzz voicings that a typical square-wave circuit cannot reach.

  The circuit is built around vintage Japanese germanium transistors. A Bias control sets the attack and decay of each note, covering fat square waves, angular fuzz and glitchy, velcro-like attacks. Input and output jacks are top mounted and the bypass is true bypass.
