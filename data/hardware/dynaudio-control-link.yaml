name: Control Link
manufacturer: dynaudio
primaryCategory: control-surface
url: https://dynaudio.com/professional-audio/dynaudio-control/control-link
description: Control Link is the perfect companion to a Control 01 or Control 02
  rack-mount studio interface.
details: |-
  Control Link is the perfect companion to a Control 01 or Control 02 rack-mount studio interface. This solid, tidy remote control is freely programmable in layers to provide 40 customised keys that sit alongside a top-quality rotary volume control. Switch quickly between various speaker systems, downmix presets, external inputs or complex routings - all at the touch of a button.

  With the Dynaudio controllers and Control Link, you can combine any number of Dynaudio Core or other studio monitors to create a tailor-made solution for your studio.

  If you're mixing in Dolby Atmos, Control 01 and Control 02 have eight AES3 outputs (16 digital audio channels) right out of the box for a 9.1.6 speaker array. Two headphone outputs are available for monitoring stereo or immersive material. The additional eight analogue outputs included on Control 02 allow for connectivity to LYD and BM monitors, as well as any other studio monitors with analogue inputs. With Thunderbolt, you already have enough outputs to easily handle monitor outputs - and the SPQ lets you align and tune all those speaker channels to meet Dolby specs.

  Control Link connects to the host Control 01 or Control 02 interface over a single RJ45 Ethernet/PoE cable, with a 3.5mm mini-jack GPI input available for hands-free triggering such as a foot switch.
specs: |-
  - Networking: 1x RJ45, Ethernet/POE
  - GPI input: 3.5mm mini jack (e.g. Foot Switch)
  - External power adapter: 100-240 VAC, 50/60 Hz, 0.18A
  - Depth: 108 mm / 4.25"
  - Width: 172 mm / 6.8"
  - Height: 43 mm / 1.7"
  - Weight: 0.95 kg / 2 lbs
