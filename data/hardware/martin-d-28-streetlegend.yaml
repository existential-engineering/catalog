details: |-
  The Martin D-28 StreetLegend is a tribute to the worn, road-tested dreadnoughts that helped shape modern American music. It pairs Martin's iconic D-28 voice with an aged satin finish and vintage-inspired details that recall guitars seen behind museum glass.

  Built around a D-14 Fret dreadnought body, the StreetLegend features a solid spruce top with an aged finish over solid East Indian rosewood back and sides. Forward-shifted GE-scalloped X-bracing in spruce supports a bold, projective tone with strong bass, clear trebles, and rich overtones that responds well to both flatpicking and fingerstyle playing.

  The neck is shaped to Martin's GE Modified Low Oval profile with a High-Performance Taper, paired with an ebony fingerboard, 1 3/4 inch nut width, and a 25.4 inch scale length. Antique white binding, nickel open-gear tuners, and a satin finish throughout reinforce the vintage character of the instrument.

  The guitar ships pre-strung with Authentic Acoustic Lifespan 2.0 phosphor bronze medium strings and includes a molded hardshell case, along with Martin's Care and Feeding Guide, electronics documentation, and humidification bulletin. It is backed by Martin's Limited Lifetime Warranty.
specs: |-
  - Body size: D-14 Fret Dreadnought
  - Top: Solid Spruce, Aged finish, Satin
  - Back and sides: Solid East Indian Rosewood, Natural, Satin
  - Bracing: Forward Shifted X-Brace, GE-Scalloped, Spruce
  - Neck shape: GE Modified Low Oval with High-Performance Taper
  - Scale length: 25.4 inches
  - Nut width: 1 3/4 inches
  - Fingerboard: Ebony
  - Frets: 20 total, joins body at 14th fret
  - Binding: Antique White
  - Tuners: Nickel Open Gear
  - Finish: Satin throughout
  - Electronics: None
  - Case: Molded Hardshell Case included
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze, Medium
