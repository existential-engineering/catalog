description: >-
  The Korg M3 is a third-generation music workstation released in 2007 that combines
  synthesis, sampling, sequencing, and effects processing in an all-in-one hardware
  solution. It incorporates an Enhanced Definition Synthesis chip derived from the OASYS's
  HD-1 sound system, offering over 1,000 multi-samples and 1,500 drum samples. Available
  in 61-key, 73-key, 88-key, and rackmount (M3M) configurations, it bridges the gap
  between Korg's flagship OASYS and more affordable workstations.
details: |-
  Released in 2007, the M3 follows in the footsteps of the legendary M1 and Trinity workstations. Though Korg's OASYS (launched 2005) was groundbreaking, it lacked affordability. The M3 successfully bridges accessibility and capability, demonstrating Korg's confidence in hardware solutions despite the DAW revolution.

  The M3 incorporates an Enhanced Definition Synthesis chip derived from the OASYS's HD-1 sound system. The instrument features over 1,000 multi-samples and 1,500 drum samples, providing extensive sound design possibilities. Each voice includes dual oscillators capable of feeding into two filters per voice, with four filter routing options available. Polyphony reaches 120 voices in single mode or 60 voices in double mode, with up to 16 multitimbral parts.

  The M3 integrates KARMA technology for generative performance. An intuitive touchscreen enables straightforward editing and sound manipulation. Eight velocity-sensitive assignable pads enhance playability. USB connectivity allows integration with computer-based studios. The device offers quality on-board effects including 3-band EQ on each of 16 timbres, five insert effects, two master effects, and one total effect.

  Four versions accommodate different preferences: 61-key and 73-key models feature semi-weighted keyboards, while the 88-key version includes weighted hammer action. An M3M module variant serves rack-mount applications. The built-in sampler records at 16-bit/48kHz with 64 MB of RAM expandable to 320 MB, and supports extended sampling to USB storage devices for up to 80 minutes of audio.
specs: |-
  - 120-voice polyphony (single mode), 60-voice (double mode)
  - 16-part multitimbral
  - Dual oscillators per voice with triangle, sine, square, guitar, and sawtooth waveforms
  - Two multi-mode filters per voice with four routing options
  - Two LFOs per oscillator plus shared common LFO
  - 16-track sequencer with 617 preset and 100 user patterns per song
  - KARMA generative arpeggiator technology
  - 3-band EQ per timbre, 5 insert effects, 2 master effects, 1 total effect
  - 16-bit/48kHz sampler with 64 MB RAM (expandable to 320 MB)
  - Touchscreen display
  - 8 velocity-sensitive assignable pads
  - MIDI In/Out/Thru
  - USB connectivity for computer integration and storage expansion
  - Available in 61-key, 73-key, 88-key, and rackmount (M3M) configurations
