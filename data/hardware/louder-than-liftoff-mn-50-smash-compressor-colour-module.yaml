description: Aggressive FET compressor Colour Module based on the Fostex MN-50 mixer, modified by Louder Than Liftoff and Avenson Audio. Designed for heavy-handed dynamic control with character — excels at smashing drum room mics and turning peaky bass tracks into thick, flat lines of crunchiness.
details: |-
  The MN-50 Smash Compressor is not for transparent compression. It excels at smashing drum room mics into oblivion and turning peaky bass tracks into thick, flat lines of crunchiness. Originally designed by Avenson Audio based on the Fostex MN-50 mixer circuit, Louder Than Liftoff's version includes exclusive modifications: an adjusted threshold for optimal gain staging, a modified release time constant for more explosive compression, and IC upgrades for enhanced punch and transient response. The module features an adjustable release via onboard trimmer, adjustable FET bias for fine-tuning compression and distortion characteristics, and high/low input gain selectable via solderless jumper. Built with premium components from Nichicon, Panasonic, Vishay, Susumu, Wima, and TI, with high-end thin film resistors at 0.5% or 0.1% tolerance. Fully assembled and tested by Avenson Audio.
