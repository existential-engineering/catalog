details: |-
  Alive and loud, Electromatic Center Block guitars are designed for that pure and powerful Gretsch sound at high volume. The G5622LH Electromatic Center Block with V-Stoptail features a double-cutaway maple body with chambered spruce center block for dynamic resonance, high gain power and lightweight comfort.

  Dual Black Top Broad'Tron humbucking pickups deliver chiming highs with dynamic and articulate tone for enhanced sonic punch. Flexibly harness its sonic power with a versatile control layout consisting of a master volume control with treble bleed circuit, master tone, bridge and neck pickup volume controls and three-position pickup toggle switch.

  Other features of the G5622LH include an anchored Adjusto-Matic bridge, V-Stoptail, Graph Tech NuBone nut and G-arrow knobs. This lefty model sports a lush Georgia Green finish adorned with a silver pickguard, aged white body binding with multi-ply purfling and nickel hardware.
