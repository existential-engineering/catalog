description: The CCM684 is a high-performance ceiling speaker that’s simple to
  install and use. Its two-way design features a 200mm (8in) woven glass fibre
  cone bass/midrange driver and a soft dome tweeter in a neat circular ceiling
  mount chassis.
details: |-
  CCM684 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Performance Series, pairing a 25mm (1in) soft dome tweeter with a 200mm (8in) woven black glass fibre cone bass/midrange driver in a circular ceiling mount chassis. It is the 8in counterpart to the 6in CCM665, sharing that model's soft dome tweeter and glass fibre cone rather than the aluminium dome and Aramid cone of the CCM682 and CCM683.

  The tweeter housing pivots, so treble can be aimed at the listening position and the off-axis response adjusted after the speaker is in the ceiling. A three-position EQ switch on the speaker gives a further off-axis correction, which is the usual answer to a ceiling speaker sitting well away from where people actually sit.

  It is a passive loudspeaker driven from an external amplifier: 8 ohms nominal with a 4.5 ohm minimum, 88dB sensitivity measured at 2.83V and 1m, and a recommended amplifier power of 25W to 130W. Its quoted frequency range is 35Hz to 35kHz at -6dB, reaching lower than the 6in CCM665 at the bottom and the same 35kHz at the top.

  Bowers & Wilkins pitches it as a high performance ceiling speaker that is simple to install and use, with the QuickDogs fixing system and plug-and-play wiring doing the work of getting it into the ceiling.

  Installation figures match the other 8in models in the series: a 290mm (11.4in) frame over a 250mm (9.8in) cut-out, 133mm (5.2in) of depth needed behind the surface, and a 4mm (0.2in) protrusion once fitted. The matching pre-mount kit is the C8 and the matching back box the 6C. The speaker is offered in White only.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x 25mm (1in) soft dome tweeter, 1x 200mm (8in) black glass fibre cone bass/midrange driver
  - Frequency range (-6dB): 35Hz to 35kHz
  - Recommended amplifier power: 25W to 130W
  - Sensitivity SPL: 88dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 250mm (9.8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C8
  - Back box: 6C
  - Pivoting tweeter housing for adjustable off-axis treble response
  - Three-position EQ switch for a better off-axis response
  - QuickDogs fixing system with plug-and-play wiring
  - Passive: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
