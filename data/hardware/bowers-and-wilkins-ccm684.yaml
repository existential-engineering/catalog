details: |-
  The CCM684 is a high performance ceiling speaker that’s simplicity itself to install and use. A two-way design, featuring a 200mm (8in) woven glass fibre cone bass/midrange driver and a soft dome tweeter in a neat circular ceiling mount chassis.

  The tweeter housing pivots for adjustable off-axis treble response and the speaker also features a three-position EQ switch for a better off-axis response.

  Incorporating QuickDogs and a plug-and-play functionality it is quick and easy to install.

  CCM6 Series ceiling mount speakers comprise a baffle carrying the speaker drivers and crossover, a mounting frame (with integrated bezel), and a magnetically secured grille. CCM684 requires a ceiling aperture diameter of 251mm (9.9in) and clear depth behind the sheetrock (plasterboard) of 140mm (5.51in).
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) soft dome tweeter
  - Drive units: 1x ø200mm (8in) black glassfibre cone bass/midrange
  - Frequency range (-6dB): 35Hz – 35kHz
  - Recommended amplifier power: 25 – 130W
  - Sensitivity SPL (2.83V, 1m): 88dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 250mm (9.8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C8
  - Back box: 6C
  - Ceiling aperture diameter: 251mm (9.9in)
  - Required clear depth behind plasterboard: 140mm (5.51in)
  - Pivoting tweeter housing and three-position EQ switch
  - Finish: White
