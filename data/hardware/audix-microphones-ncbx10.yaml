details: |-
  The NCB X10 is a complete single-channel Novacore digital wireless lavalier system for clergy, presenters, performers, and broadcast talent - everything needed for professional hands-free wireless audio in a single purchase. It pairs the NCR1 Single-Channel Digital Receiver with the NCB P Digital Bodypack Transmitter and AUDIX ADX10 Cardioid Lavalier Condenser Microphone, delivering discreet, natural-sounding vocal clarity on a professional AES-256 encrypted UHF digital wireless platform.

  The ADX10 miniature cardioid lavalier delivers natural vocal clarity with strong off-axis rejection, making it well suited for podium applications, theatrical productions, and houses of worship where clean, unobtrusive placement and consistent feedback control are equally important. The NCB P transmitter and NCR1 receiver are pre-matched on the Novacore RF platform and pair via one-touch IR sync. Variable input gain from –12 to +18 dB at the transmitter and a dedicated 3.5 mm remote mute input for external switch control round out the system's flexibility for installed-sound applications.

  The system operates across a 48 MHz UHF tuning range with less than 3 ms latency and 9+ hours of transmitter battery life on 2× AA alkaline or 1× NCLB rechargeable lithium-ion. USB-C charging is built into the NCB P transmitter body. The NCB P is also compatible with other AUDIX lavalier and headset microphones — including the L5, L5O, HT5, HT7B3P, and HT7BG3P — and any third-party TA3F-terminated mic, allowing the system to adapt as application needs evolve . The system is fully expandable within the Novacore ecosystem by adding channels, transmitters, or receivers as needs grow .
specs: |-
  - System: NCR1 single-channel receiver + NCBP bodypack transmitter + ADX10 cardioid lavalier
  - Receiver output: balanced XLR, line level
  - Receiver control ports: dual RJ11 (frequency coordination)
  - Transmitter mic input: TA3M (3-pin mini)
  - Transmitter input gain: -12 to +18 dB
  - Remote mute input: 3.5 mm TRS
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Encryption: AES-256
  - Transmitter power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours, USB-C charging
