description: Quad log/lin attenuator in 4HP. Simple but essential module for all
  your attenuation needs (audio, cv etc.).
details: |-
  Simple but essential module for all your attenuation needs (audio, cv etc.).

  On the back of the module are 4 jumpers. Each one allows you to select if that channel has a log or linear response (log is nicer for controlling audio volume while linear is better for cv levels).

  At 4HP wide and only 15mm deep with zero current draw, it fits in virtually any case.
specs: |-
  - Width: 4HP
  - Max Depth: 15mm
  - Power: 0 mA (passive)
  - Four attenuation channels (A-D) for audio or CV
  - 4 rear jumpers select log or linear response per channel
