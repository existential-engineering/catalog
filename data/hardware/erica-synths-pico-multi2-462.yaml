description: Active buffered multiple.
details: |-
  Pico Multi2 is an advanced replacement for stackable patch cables, a highly accurate active buffered multiple for signal splitting in any circuit.

  Buffering is what separates it from a passive split. Each copy holds its level and its tuning, so one CV source can drive several VCOs and keep them in tune with each other.

  The 3HP panel carries two independent active buffered multiples, usable as a 1 to 3 plus a 1 to 2 split or chained into a single 1 to 5 split. Inputs accept anything from -10V to +10V, which covers audio, clock and control voltages alike.

  The module is 3HP wide and 35mm deep, and draws +20mA on the positive rail and -14mA on the negative one.
specs: |-
  - Two independent active buffered multiples
  - 1-3+1-2 or 1-5 configuration
  - Max input level -10V to +10V
  - Power consumption +20mA, -14mA
  - Module width 3HP
  - Module depth 35mm
