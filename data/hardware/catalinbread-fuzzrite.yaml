description: The Fuzzrite is a classic silicon-based garage fuzz pedal with a
  storied history in rock music, famously used on recordings by The Ventures,
  Iron Butterfly, and The Black Keys. Catalinbread has brought the classic
  silicon circuit back and added a modern 9V power supply, delivering
  aggressive, saturated fuzz tones.
details: |-
  The Catalinbread Fuzzrite is a faithful recreation of the classic silicon Fuzzrite circuit, handmade in Portland, Oregon. The original Fuzzrite was a staple of 1960s garage rock and surf, appearing on recordings by The Ventures, Iron Butterfly, and later championed by Dan Auerbach of The Black Keys.

  Catalinbread's recreation preserves the original silicon circuit's aggressive, compressed fuzz character while adding a modern 9VDC power input so it works on any standard pedalboard power supply. It also accepts a 9V battery. Backed by a 3-year warranty.
