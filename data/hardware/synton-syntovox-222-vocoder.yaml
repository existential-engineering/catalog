  Dynacord SRV66 in Germany.
details: |-
  The Syntovox 222 was released in 1981 by Synton, the Dutch brand also responsible for the Syrinx synthesizer as well as the Fenix I and Fenix II. Synton advertised it as a simplified, yet versatile adaptation of the larger Syntovox 221 studio vocoder.

    As a vocoder, the Syntovox 222 imparts vocal articulation to musical signals. This is accomplished via two inputs: one for balanced microphone signals and another for line-level signals. The device uses the articulated carrier analog with adjustable amounts of straight speech and carrier signals. For increased intelligibility, Synton included an internal unvoiced sound synthesizer.

    The front panel features Speech and Carrier knobs on the left of the module for level control, along with Cleanfeed Speech, Cleanfeed Carrier, and Noise/HF Syn knobs. Effects can be engaged via panel switches or an external footswitch. The unit produces very smooth vocoder sounds, which made it one of the best-selling vocoders in the Synton lineup.

    Since the Syntovox 222 was handbuilt in the Netherlands, it can be difficult to track down in some parts of the world. The unit also appeared under different brandings in various markets, such as the Dynacord SRV66 in Germany.
specs: |-
  - Type: 1U rack-mounted vocoder module
    - VCO: 1 oscillator
    - Filters: 10 band filters
    - Effects: White noise generator, unvoiced sound synthesizer
    - Inputs: MIC (balanced), LINE (line-level), CARRIER (line-level)
    - Output: Single output jack
    - Controls: Speech level, Carrier level, Cleanfeed Speech, Cleanfeed Carrier, Noise/HF Syn, Master OUT
    - Switching: Panel switches for articulated carrier and unvoiced sound; external footswitch jack
