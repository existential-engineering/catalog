details: |-
  The LEHLE P-ISO TRS XLR STEREO brings you closer to the main mixing system. It converts your stereo audio signal not only to balanced XLR but lifts the ground so there's no chance of unwanted noise or humming loops. Perfect for your pedal board, modeler and amp simulation in studios, clubs, bars or stadiums, all fitted into a handy size.

  The combination of passive isolation with highest possible signal fidelity is only realisable thanks to its core, existing of two LEHLE TRANSFORMER HZ, which galvanically isolate the signals. While being designed especially for high impedance signals, they process low impedance signals with the same uncompromising sound quality as well. The high coupling and flat frequency response won't let you miss any detail in the signal.

  The classic application for the LEHLE P-ISO TRS XLR STEREO is the connecting link in between your stereo device and the professional world of mixers, FOH and DAW recording systems. It lifts the ground in between those worlds, so the devices are galvanically isolated, and any hum or noise caused by a ground loop becomes a thing of the past. Offering balanced audio signals at the two male XLR sockets by Neutrik gets you protected even closer to the mixer while using simple standard XLR cables.

  Not only for stereo effects, digital modeler and amp simulation devices, even keyboards, synths, playback systems or audio interfaces are in safe hands of the LEHLE P-ISO TRS XLR STEREO.

  You won't find a power connection as you get all the performance of that compact box passively, without the need for a power supply. And due to its optimised size and low weight, it fits easily below your pedalboard or in any pocket, always installed or as flexible tool to share.
specs: |-
  - Stereo isolator and problem solver in a compact format
  - Absolutely no signal loss or hum
  - Comes with two high-impedance LEHLE TRANSFORMER HZ and ground switch
  - Suitable for balanced or unbalanced signals with TRS and XLR sockets
  - Male XLR sockets by Neutrik with gold-plated contacts for balanced output
  - Passive, no power connection and no need for a power supply
