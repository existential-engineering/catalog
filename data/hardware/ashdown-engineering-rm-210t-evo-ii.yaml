description: The Ashdown Rootmaster EVO II 210T is a 300-watt 2 x 10" bass
  cabinet at 8 ohms, a lightweight marvel at just 15.5kg (34lbs). Dual White
  Line Ashdown 10" speakers deliver punchy output that keeps bass lines loud and
  clear, and an integrated tweeter with a three-way switch (hi, low, or off)
  tailors the top end. A top-mounted bar handle eases transport and stacking,
  genuine Neutrik Jack/Speakon combi jacks ensure secure connections, and the
  Buffalo Tolex finish with metal corners and black cloth grill gives a durable,
  professional look.
details: |-
  Super-lightweight 2 x 10" bass speaker cabinet in the Rootmaster EVO II range, producing 300 watts at 8 ohms while weighing just 15.5kg (34lbs). Dual White Line Ashdown 10" speakers give punchy output, and an integrated tweeter with a three-way switch (hi, low, or off) adds high-end zing or a warmer vintage tone. Built with weight-saving construction, it carries a top-mounted bar handle for transport and stacking, genuine Neutrik Jack/Speakon combi jacks, metal corners, and a Buffalo Tolex finish with black cloth grill.
specs: |-
  - Power handling: 300 watts
  - Impedance: 8 Ohms
  - Speaker configuration: 2 x 10" White Line Ashdown speakers
  - Integrated tweeter: three-way switch (hi / low / off)
  - Weight: 15.5kg (34lbs)
  - Genuine Neutrik Jack/Speakon combi jacks
  - Top-mounted bar handle
  - Buffalo Tolex finish with metal corners and black cloth grill
