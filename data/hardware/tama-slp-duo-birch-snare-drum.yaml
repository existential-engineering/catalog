details: |-
  Sound Arc Hoop: S.L.P. Duo Birch snare drum will be fitted with our Sound Arc Hoops, inspired by the so-called "stick saver hoops" which were used on select vintage snare drums. The edges of the Sound Arc Hoops bend inward to enhance the natural tone of the drum and offer increased sensitivity, precision, and control.

  Floor Tom Bracket & Leg: The Duo Birch snare drum is equipped with floor tom legs and brackets. You can tune this drum low and place it where the first floor tom would traditionally go. As such, the snare can function as a low/deep snare with the snare wires engaged, or as a 14" floor tom with the snares off. This can lead to many unique phrasing opportunities
