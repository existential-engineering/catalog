details: |-
  This instrument marks the 30th anniversary of the creation of the original Starplayer design, which the page places in 2025, with a limited run of the Starplayer CBR finished in a Gold-Leaf and black checkerboard design. The run is strictly limited to 30 pieces worldwide.

  The 30th Anniversary Checkerboard design is part of the new Starplayer CBR line, which the maker describes as extending the tonal range and aesthetics of the Starplayer family. The CBR takes the established Starplayer look and gives it a different tonal character through a chambered mahogany body paired with a flat flamed maple top and a one-piece mahogany neck.

  Each guitar is supplied with a Duesenberg Custom Line Case and a Certificate of Authenticity.
