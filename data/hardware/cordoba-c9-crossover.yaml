details: |-
  The all-solid C9 Crossover offers a new spin on a Córdoba classic. Built with solid Canadian Cedar top and solid Mahogany back and sides, this nylon-string guitar's main standout feature is its steel-string style neck. A reduced 48mm nut width, 16" radius fingerboard, and thin-profiled hand-carved Mahogany neck will feel familiar for steel-string or electric players who are just getting into nylon-string guitar.
