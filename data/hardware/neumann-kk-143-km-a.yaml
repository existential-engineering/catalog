name: KK 143 / KM A
manufacturer: neumann
primaryCategory: microphone
categories:
  - condenser
  - cardioid
url: https://www.neumann.com/en-us/products/microphones/kk-143--km-a
description: The combination of the capsule KK 143 with the output stage KM A is
  only one of the numerous options within the Neumann KM A/D small diaphragm
  microphone system.
details: |-
  Directional characteristic: wide-angle cardioid

  Part of the modular microphone system KM A/D

  Comprehensive range of accessories

  Modular small diaphragm capsule with analog output stage

  Pressure gradient transducer with wide-angle cardioid characteristic

  Attenuation: 4 dB at 90°, 8 dB at 135°, and 11 dB at 180°

  Frequency response parallel up to 12 kHz for sources within ±90° (off axis)

  Switchable -10 dB preattenuation allows SPL up to 152 dB (depending on capsule)

  Transformerless analog output stage operating on P48 phantom power

  Capsule may be detached up to 100 m (330 ft) from output stage via special cable

  Output stage dimensions: 22 mm diameter, 93 mm length

  Available in nickel or Nextel black (nx)
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional Pattern: Cardioid wide
  - Frequency Range: 20 Hz...20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 15 mV/Pa
  - Rated Impedance: 50 ohms
  - Rated load impedance: 1000 ohms
  - Equivalent noise level, CCIR: 22 dB
  - Equivalent noise level, A-weighted: 13 dB-A
  - Maximum SPL for THD 0.5%: 138 dB
  - Maximum SPL for THD 0.5% with preattenuation: 148 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 70 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 81 dB
  - Supply voltage ( P48, IEC 61938): 48 V
  - Current consumption ( P48, IEC 61938): max. 3.5 mA
  - Matching connector: XLR 3 F
  - Weight (output stage): 70 g
  - Weight (capsule only): 15 g
  - Diameter: 22 mm
  - Length (capsule only): 18 mm
  - Length (microphone): 108 mm
