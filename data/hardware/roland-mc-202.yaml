description: >-
  A monophonic analog synthesizer and sequencer from 1983 with a sound engine
  closely related to the TB-303 and SH-101, featuring a 2-channel CV/Gate
  sequencer and DIN sync capabilities.
details: |-
  The Roland MC-202 combines a monophonic analog synthesizer with an internal pattern sequencer, representing a next-generation evolution of the TB-303. Its sound engine shares DNA with both the TB-303 and SH-101, producing the characteristic acidic bass tones that would later define entire genres of electronic music.

  The synthesis section offers a single VCO with simultaneous sawtooth and square/pulse-width waveforms plus a sub-oscillator. A resonant 24dB low-pass filter with cutoff, resonance, envelope modulation, and keyboard tracking shapes the tone, while a sine-wave LFO with delay and rate controls adds movement. The VCA can be switched between ADSR envelope or gate modes.

  The built-in 2-channel CV/Gate sequencer can store up to 2,729 notes, with both channels capable of driving separate external synthesizers. Programming follows an evolved form of TB-303-style step entry combined with SH-101-like synthesis controls, aided by an LCD display for visual feedback. DIN sync support allows the MC-202 to receive on one port and send over two, making it valuable for multi-device setups.

  When controlled externally via MIDI-CV/Gate converters, the MC-202 essentially functions as an SH-101 synthesizer. Its cultural significance is well established through adoption by Autechre, Aphex Twin, Underworld, and The Human League.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth, square/pulse width), 1 sub-oscillator
  - LFO: 1 (sine wave with delay and rate)
  - Filter: 24dB resonant low-pass
  - VCA: ADSR envelope or gate
  - Sequencer: 2 tracks, 2,729 notes
  - Control: CV/Gate, DIN Sync
  - Memory: Volatile (battery or cassette tape)
releaseDate: "1983"
