details: |-
  Released in 1998, the MF-102 Ring Modulator was part of Moog's Moogerfooger line of analog effects processors. Designed personally by Bob Moog, it brought the wild, metallic textures of ring modulation into a compact desktop and pedalboard-friendly format built with genuine Moog analog circuitry.

  The circuit works by multiplying a mono audio input with an internal carrier oscillator, producing the sum and difference frequencies that give ring modulation its characteristic clangorous, bell-like tones. The carrier oscillator covers a wide range from 2Hz to 4kHz, switchable between low and high modes. A dedicated LFO running from 0.1Hz to 25Hz offers sine and square waveforms for animated, evolving textures.

  Front panel controls include knobs for LFO amount, LFO rate, modulator frequency, and modulator mix. The mix control allows blending between the dry signal and the modulated output for subtle or extreme effects. Four expression pedal inputs enable remote real-time control of all major parameters during performance.

  External CV inputs make the MF-102 a natural companion for analog synthesizers, allowing voltage control over its parameters for tight integration into modular and semi-modular setups. Notable users include Fatboy Slim and The Crystal Method.
specs: |-
  - Type: Analog ring modulator
  - Carrier Oscillator: 2Hz to 4kHz (switchable low/high)
  - LFO: 0.1Hz to 25Hz (sine, square)
  - Controls: LFO Amount, LFO Rate, Modulator Frequency, Modulator Mix
  - Audio: Mono input/output
  - Expression Inputs: 4 (for pedal control)
  - CV: External CV input for analog synth integration
  - Construction: Moogerfooger series analog circuitry
