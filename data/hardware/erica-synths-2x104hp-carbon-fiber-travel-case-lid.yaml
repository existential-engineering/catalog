details: |-
  The Erica Synths Carbon Fiber Travelcase is one of the lightest and most durable eurorack travel cases available. Weighing just 3.2kg it houses 2x104HP of eurorack modules, and the lid is deep enough to transport a modular system with a patch left ready for performance.

  The case comes with a built in universal PSU that provides 2.5A@+12V, 2.5A@-12V and 0.4A@+5V, fed from a 3.5A universal external PSU through built in voltage converters. Eurorack distribution boards inside the case carry 60 module connectors.

  Outer dimensions are 570x280x140mm. Usable case depth is 67mm at most and 54mm at minimum over the PSU connectors, and the lid adds a further 59mm of depth. Fitted with modules the case weighs around 5kg.
specs: |-
  - Capacity 2x104HP
  - Mass without modules 3.2 kg
  - Mass with modules approximately 5 kg
  - Dimensions 570x280x140mm
  - Case depth max 67mm, min 54mm over the PSU connectors
  - Lid depth 59mm
  - 3.5A universal external PSU and built in voltage converters
  - Built in universal PSU provides 2.5A@+12V, 2.5A@-12V and 0.4A@+5V
  - Eurorack distribution boards with 60 module connectors
