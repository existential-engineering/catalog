description: Connectivity Conduit Take your clock signal to three different
  modules, then split an audio signal into a crazy mix of filters and effects.
  The Mult takes one audio or CV signal, and routes it to up to three outputs.
  Because the Mult is passive, it requires no power to operate. Multiply
  anything by three, twice.
details: |-
  Mult is a dual 4-way passive signal multiplier. It takes one audio or cv signal, and routes it to up to three multiple unbuffered outputs. It requires only 2HP of width, and because the Mult is a passive module, it requires no power to operate.

  Mult is divided into two sections — upper and lower. Each section is its own 4-way passive multiplier, completely independent of the other. Plug an audio or CV signal into any of the four jacks in a section, and Mult sends an unbuffered version out the other three jacks in that group.
specs: |-
  - Width: 2HP
  - Depth: 18mm (per current product page; the 2018 manual PDF lists 27mm)
  - Current Draw: Passive, no power required
  - Two independent 4-way passive multiplier sections (upper and lower)
