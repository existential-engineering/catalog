description: The SuperMoon is a cavernous, orbital ambient reverb pedal with
  proprietary Sway modulation and reverb trails of up to 30 seconds. It plays
  especially well with distortion.
details: |-
  Imagine your sound drifting boundlessly through the galaxy: a celestial body
  warped into momentary orbit as millions of microscopic echoes converge into
  fluid dark matter, then gently evaporate into the black abyss. That is the
  character Mr. Black set out to capture with the SuperMoon, a stompbox built
  around lush, vast, orbital reverb.

  At the heart of the pedal is a proprietary Sway modulation that stirs gentle
  movement into the reverb tail, keeping long washes alive rather than static.
  Decay can be dialed back for a subtle sense of space or pushed out to reverb
  trails of up to 30 seconds.

  The SuperMoon is voiced to sit well in front of, or behind, dirt. It holds
  together with distortion where many reverbs turn to mush, making it a versatile
  ambient tool for guitar, keys and beyond.

  Housed in a compact, daisy-chain-friendly enclosure with true-bypass switching,
  the SuperMoon is proudly made in the U.S.A.
specs: |-
  - Stunning, lush reverb
  - Dynamic, proprietary Sway modulation
  - Plays very well with distortion
  - Up to 30 seconds of fluid reverb trails
  - Daisy Chain Friendly
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - Frequency Response: ~15.6Hz – ~22KHz
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9VDC battery (not included)
  - Current Draw: <60mA
