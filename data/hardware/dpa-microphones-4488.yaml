details: |-
  The 4488 CORE Directional Headset Microphone combines DPA's renowned 5 mm capsules with CORE by DPA technology and the Red Dot award-winning headset. These are the most advanced headsets – secure, durable and flexible – for segments including: Theatre, Broadcast, House of Worship and Conferencing.
specs: |-
  - Directional pattern: Cardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Sensitivity: 6 mV/Pa; -44 dB re. 1 V/Pa (nominal, ±3 dB at 1 kHz)
  - Equivalent noise level, A-weighted: Typ. 26 dB(A) re. 20 µPa (max. 28 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 38 dB (max. 40 dB)
  - Distortion, THD < 0.5%: 137 dB SPL RMS, 140 dB SPL peak
  - Distortion, THD < 1%: 139 dB SPL RMS, 142 dB SPL peak
  - Dynamic range: Typ. 116 dB
  - Max. SPL, THD 10%: 146 dB SPL peak
  - Rated output impedance: 30 - 40 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001 XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD9001: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001 XLR Adapter
  - Connector: MicroLock, TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - Weight: 18 g (0.4 oz) incl. cable and MicroLock connector
  - Microphone diameter: 5.4 mm (0.21 in)
  - Cable length: 1.3 m (4.3 ft)
  - Cable diameter: 1.6 mm (0.06 in)
  - Polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black, Beige, Brown
