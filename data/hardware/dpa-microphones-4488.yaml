details: |-
  The 4488 CORE Directional Headset Microphone combines DPA's renowned 5 mm capsules with CORE by DPA technology and the Red Dot award-winning headset. These are the most advanced headsets – secure, durable and flexible – for segments including: Theatre, Broadcast, House of Worship and Conferencing.
specs: |-
  - directionalPattern: Cardioid
  - principleOfOperation: Pressure gradient
  - cartridgeType: Pre-polarized condenser
  - frequencyResponse: 20 Hz - 20 kHz
  - sensitivity: 6 mV/Pa; -44 dB re. 1 V/Pa (nominal, ±3 dB at 1 kHz)
  - equivalentNoiseLevelAWeighted: Typ. 26 dB(A) re. 20 µPa (max. 28 dB(A))
  - equivalentNoiseLevelITU: Typ. 38 dB (max. 40 dB) (ITU-R BS.468-4)
  - distortionTHDUnder0_5Percent: 137 dB SPL RMS, 140 dB SPL peak
  - distortionTHDUnder1Percent: 139 dB SPL RMS, 142 dB SPL peak
  - dynamicRange: Typ. 116 dB
  - maxSPL: 146 dB SPL peak (THD 10%)
  - ratedOutputImpedance: 30 - 40 Ω
  - cableDriveCapability: Up to 300 m (984 ft) with DAD9001 XLR Adapter
  - powerSupply: For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD9001: P48 (Phantom Power). Will work from 12 V
  - currentConsumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001 XLR Adapter
  - connector: MicroLock, TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - weight: 18 g (0.4 oz) incl. cable and MicroLock connector
  - microphoneDiameter: 5.4 mm (0.21 in)
  - cableLength: 1.3 m (4.3 ft)
  - cableDiameter: 1.6 mm (0.06 in)
  - polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - temperatureRange: -40°C to 45°C (-40°F to 113°F)
  - relativeHumidity: Up to 90%
  - colors: Black, Beige, Brown
