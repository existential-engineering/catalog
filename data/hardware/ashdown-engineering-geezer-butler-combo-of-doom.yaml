description: The Geezer Butler Combo of Doom is a UK-built, 200-watt 1x12" bass
  combo created in collaboration with legendary Black Sabbath bassist Geezer
  Butler. Part of the Ashdown Artist Editions range, it delivers massive tone in
  a compact, lightweight format built around a premium 12" Sica Neo speaker, a
  5-band EQ with Shape control, an FX loop, a balanced XLR DI output and a
  headphone output that mutes the speaker. A tube-emulated Drive control and
  pre-gain input matching handle both active and passive basses, and the amp
  ships in a striking purple Tolex finish with a black grille.
details: |-
  UK-built 200-watt 1x12" bass combo created with Black Sabbath's Geezer Butler, part of the Ashdown Artist Editions range. Loaded with a high-quality Sica NEO 12" speaker. Front-panel Pre-Gain control matches input sensitivity, with a Passive/Active switch providing a -15 dB pad and an input range of 100 mV to 10 V. Tube-emulated Drive control. 5-band EQ (Bass, Lo-Mid, Middle, Hi-Mid, Treble, all +/-15 dB) with a Shape control and pre-shape EQ switch, plus Master Volume. FX loop uses a TRS jack for a Y cable. Balanced XLR DI output, line input, footswitch output for the Drive control (FS-1 sold separately), and a 1/4" headphone output that mutes the speaker. Auto-voltage power supply. Purple Tolex finish with black grille. Weight 10.5 kg.
specs: |-
  - Power output: 200 watts (at 4 Ohms)
  - Speaker: 1 x 12" Sica NEO
  - 5-band EQ: Bass / Lo-Mid / Middle / Hi-Mid / Treble (+/-15 dB) with Shape control and pre-shape EQ switch
  - Tube-emulated Drive control
  - Pre-Gain input sensitivity control; Passive/Active switch with -15 dB pad (input range 100 mV to 10 V)
  - Balanced XLR DI output
  - FX loop (TRS jack for Y cable)
  - Line input
  - 1/4" headphone output (mutes speaker)
  - Footswitch output for Drive control (FS-1 sold separately)
  - Auto-voltage power supply
  - Purple Tolex finish with black grille
  - Weight: 10.5 kg
