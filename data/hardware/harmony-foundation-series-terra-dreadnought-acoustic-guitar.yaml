details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable acoustic companion to weave tales out of every path of the journey. The Terra Dreadnought features a robust design that resists warping, with a laminated spruce top, paired with sapele sides and back, it delivers warm and rich tones fit for every genre. Crafted with a lightweight okoume neck, this guitar ensures a comfortable and stable playing experience, prioritizing note clarity so you can fully immerse yourself in the music. Solid spruce X-bracing optimizes top vibration for superior sound projection and tonal depth, ensuring your music resonates true. The Terra Dreadnought comes pre-strung with D'Addario EXP16 coated strings for lasting bright tones. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
