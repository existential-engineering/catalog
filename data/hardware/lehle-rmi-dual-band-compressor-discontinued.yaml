description: The BASSWITCH DUAL BAND COMPRESSOR is a high-end compressor in
  pedal size built especially for bass instruments. Equipped with two fully
  fledged high-end compressors working in two adjustable frequency-ranges, it
  allows effective and harmonious compression of bass signals.
details: |-
  The BASSWITCH DUAL BAND COMPRESSOR is a high-end compressor in pedal size built especially for bass instruments. By intelligently linking parameters like attack and release, the amount of controls could be reduced whilst those parameters are dynamically adjusted to the bass-signal. So, operating this device becomes an intuitive, simple and fast act, a clear benefit for live performances.

  Equipped with two fully fledged high-end compressors working in two adjustable frequency-ranges, the BASSWITCH DUAL BAND COMPRESSOR allows effective and harmonious compression of bass signals. This includes contouring fast staccato-passages, well-defined slapping-lines and a smooth concentration of the sound.

  Whether a function similar to a limiter is required or only small peaks shall be balanced out, the variable compression ratios from 1:1 up to 10:1 create the preconditions for a variety of possible sounds. At this the blue LED shows the intensity of the compression, the harder the two VCA feed forward compressors work, the brighter it glows. Due to its soft knee-characteristics the BASSWITCH DUAL BAND COMPRESSOR provides a smooth and subtle transition to the compressed sound.

  The bypass mode of the BASSWITCH DUAL BAND COMPRESSOR can easily be changed from Buffered-Bypass, where the device acts as a totally neutral line-driver to True-Bypass, where the input and output are linked with zero losses to one another via a relay with gold-plated contacts.

  The input voltage is rectified, then filtered stabilized and doubled to 18V. This guarantees the necessary headroom to handle high peak levels and makes an active/passive switch redundant. The extremely robust construction with its protected controls and indestructible switching mechanism will provide many years of joy with the BASSWITCH DUAL BAND COMPRESSOR.
specs: |-
  - Two fully fledged high-end compressors working in two adjustable frequency ranges
  - VCA feed forward compressors with soft knee characteristics
  - Variable compression ratios from 1:1 up to 10:1
  - Attack and release parameters intelligently linked and dynamically adjusted to the bass signal
  - Blue LED showing the intensity of the compression
  - Switchable bypass mode: buffered bypass acting as a neutral line driver, or true bypass via a relay with gold-plated contacts
  - Input voltage rectified, filtered, stabilized and doubled to 18 V internally
  - No active/passive switch needed thanks to the internal headroom
  - Pedal-sized housing with protected controls
