description: >-
  A consumer-oriented portable FM synthesizer from Yamaha with 49 mini keys,
  built-in speakers, and a Digital Synthesizer editing mode derived from the DX
  series heritage.
details: |-
  Released in 1987, the Yamaha PSS-470 was aimed squarely at the casual musician and home market. Built in a lightweight plastic case with 49 mini-sized keys and built-in stereo speakers, it was the kind of keyboard commonly found in toy store music sections. Despite its modest positioning, it carried genuine Yamaha FM synthesis technology under the hood.

  The PSS-470 offers 21 preset sounds along with a Digital Synthesizer mode that provides six sliders for hands-on sound shaping: Wave, Spectrum, Modulation, Attack, Decay, and Volume. A built-in rhythm section features 12 drum patterns spanning styles from Bossa Nova to Disco, with a Custom Drummer feature for adding drum hits in real time. The Auto-Bass-Chord accompaniment section generates automatic bass and chord backing.

  Eight voices of polyphony plus a five-sound drum kit give the PSS-470 reasonable capability for its class. The inclusion of stereo outputs alongside the built-in speakers makes it usable in a studio context, and circuit-bending enthusiasts have embraced it as a popular platform for experimental modification.
specs: |-
  - Polyphony: 8 voices + 1 drum kit (5 drum sounds)
  - Oscillators: 2 FM operators
  - Filter: Spectrum and Modulation sliders
  - Envelope: Attack and Decay sliders
  - Effects: Sustain, Vibrato, Duet
  - Keyboard: 49 mini keys
  - Memory: 21 preset synth sounds, 12 drum rhythm patterns
  - Audio: Built-in stereo speakers, stereo outputs
