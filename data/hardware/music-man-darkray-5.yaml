description: >-
  Designed in collaboration with world-renowned bass accessory manufacturer
  Darkglass Electronics, the DarkRay 5 brings a custom 2-band EQ preamp with
  three voicings — Clean, Alpha (distortion), and Omega (fuzz) — to the StingRay
  Special 5 platform.
details: |-
  Crafted in partnership with Darkglass Electronics, renowned for their expertise in bass accessories, the DarkRay 5 unleashes a universe of sonic innovation. At its core lies a cutting-edge 2-band EQ preamp, custom-crafted by Darkglass, offering three distinct modes: Clean, Alpha (distortion), and Omega (fuzz).

  Players blend tones using the gain knob and blend control, mixing clean sounds with aggressive fuzz while maintaining low-end power. Mode selection uses an LED ring and 3-way lever switch for instant access to each voice.

  The bass maintains core StingRay Special 5 features including a neodymium humbucking pickup, roasted maple neck, contoured body, 22 stainless steel frets, and a 4+1 headstock configuration.
specs: |-
  - Body: Select hardwoods; 13-3/8" wide, 1-5/8" thick, 45-3/4" long
  - Body finish: High gloss polyester (except Stealth Black)
  - Neck: Roasted maple
  - Neck finish: Gunstock oil and hand-rubbed wax blend
  - Neck width: 1-3/4" at nut, 2-3/4" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony (Roasted Maple on Gold Bar)
  - Fret markers: Dot
  - Frets: 22 high-profile wide stainless steel
  - Scale length: 34"
  - Pickup: Single humbucking with neodymium magnets
  - Electronics: Darkglass 2-band EQ preamp (Clean / Alpha / Omega modes)
  - Controls: Volume, gain, blend, treble, bass
  - Switching: 3-way lever distortion selector
  - Bridge: Vintage Music Man top-loaded, black-plated steel
  - Pickguard: Black
  - Tuning machines: Custom Music Man lightweight
  - Electronic shielding: Graphite acrylic resin coated cavity
  - Strings: 45w-65w-80w-100w-130w (Regular Slinky Bass)
