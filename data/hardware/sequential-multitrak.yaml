description: >-
  The Sequential Circuits MultiTrak is a six-voice analog synthesizer released in 1985 as
  an overhaul of the SixTrak, featuring sophisticated onboard sequencing and a 61-note
  velocity-sensitive keyboard. It combines classic analog synthesis with 99 memory
  patches, split/layer modes, stereo chorus, and a polyphonic sequencer with 1600-note
  memory.
details: |-
  The MultiTrak represented Sequential Circuits' evolution of the SixTrak platform, offering a more capable and performance-oriented analog synthesizer. It featured a matrix keypad programming interface that assigned parameters to a rotary knob, with dedicated controls for sequencer volume and speed, chorus depth and rate, master tune, and master volume.

  The onboard sequencer was a standout feature for its time, capable of storing up to four polyphonic sequences with a metronome, 1600-note memory, overdubbing mode, and quantizing (autocorrect) functions. Sequences were recorded in real-time only, with no step-time mode available. Individual track volume and speed controls allowed for flexible arrangement, and sequences could be chained together with real-time patch changes.

  The keyboard section offered 61 velocity-sensitive keys with split and stack modes, allowing up to six different patch sounds to be layered onto a single note. Each of the six voices had its own separate audio output in addition to the stereo main output, providing extensive mixing flexibility in the studio.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 1 VCO per voice (saw, triangle, pulse width modulation, noise)
  - LFO: 1 (square and triangle waveforms)
  - Filter: Low-pass with cutoff, resonance, key follow, and dedicated ADSR
  - Envelopes: 3 ADSRs per voice
  - Memory: 99 patches
  - Effects: Stereo chorus
  - Sequencer: 4 polyphonic sequences, 1600-note memory, real-time recording, overdub, quantize
  - Keyboard: 61 keys, velocity sensitive, split/layer modes
  - Outputs: 6 individual voice outputs plus stereo output
  - MIDI: In/Out
  - Sync: Pulse In/Out
releaseDate: "1985"
