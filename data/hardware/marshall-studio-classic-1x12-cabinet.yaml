description: Compact 1x12" passive guitar speaker cabinet for the Studio Classic range, inspired by the legendary JCM800. Loaded with a single Celestion V-Type speaker, it handles 70W at 16Ω and pairs with the Studio Classic head or combo to deliver authentic JCM800 tone in a small, gig-friendly footprint.
details: |-
  The classic rock tone that put British music on the map is back. Designed to be united with the Studio Classic Head or used as an extension cabinet for the Studio Classic Combo, the Studio Classic 1x12 Cabinet brings those timeless overdriven tones to life.

  Hand-manufactured in Britain and housing a Celestion V-Type speaker, the Studio Classic 1x12 Cabinet is equally at home when rehearsing or unleashed on the stage.

  The single 12" Celestion V-Type handles 70W at 16 ohms, and the cabinet is inspired by the original JCM800 in both looks and voicing.

  Compact and portable at 510 x 480 x 250 mm and 12.05 kg, it is sized to match the rest of the Studio Classic range. Designed and engineered in UK. Made in UK.
