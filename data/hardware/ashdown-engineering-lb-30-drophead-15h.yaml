name: LB-30 Drophead 15H
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/lb-30-drophead-15h
description: Based on the all-valve CTM-30 head, the LB-30 Drophead 15H
  (Drophead 30 C115H) brings classic all-tube tone in a retro combo format
  suited to studio recording and small gigs, pairing the CTM-30 amp with a
  boutique-style 1x15" plus HF horn cabinet. It offers hi and low inputs for
  active or passive basses, Bass/Mid/Treble EQ with Mid Shift, Bass Shift and
  Bright switching, a balanced DI, a front-mounted effects loop, and a flip-up
  drophead design.
details: |-
  All-valve bass combo based on the CTM-30 head in a retro drophead combo format, paired with a boutique-style 1x15" plus HF horn cabinet. Hi and low instrument inputs for active or passive basses. Traditional Bass, Middle and Treble EQ (simple passive controls) with Mid Shift, Bass Shift and Bright switching. ECC83 and ECC82 preamp tubes and a 30W EL84 power section (4 x EL84). Balanced DI output at line level (1k impedance) for studio recording or larger gigs. Front-mounted valve-driven effects loop (send instrument level, return valve recovered). Speaker outputs on jack socket. Frequency response 30 Hz to 16 kHz. High instrument input 450 mV; low instrument input 150 mV. Minimum load 4 Ohms. Flip-up drophead design: unclip the top, flip the head into position and clip back down.
specs: |-
  - Power output: 30 watts (all-valve)
  - Preamp tubes: 1 x ECC83, 1 x ECC82
  - Output tubes: 4 x EL84
  - Speaker: 1 x 15" plus HF horn
  - EQ: passive Bass, Middle, Treble with Mid Shift, Bass Shift and Bright switching
  - High instrument input: 450 mV
  - Low instrument input: 150 mV
  - Balanced DI output: line level, 1k impedance
  - Effects loop: valve-driven send (instrument level), valve-recovered return
  - Speaker outputs: jack socket
  - Frequency response: 30 Hz - 16 kHz
  - Minimum load: 4 Ohms
  - Flip-up drophead combo design
