description: A Eurorack sub-harmonics generator with two independently clocked
  sections producing odd and even sub-harmonics, crossfaded together for use as
  audio or CV sources.
details: |-
  This works with our COCO system and can also be used as a standalone module. Canyon

  Canyon is a sub-harmonics generator with two sections fed by two different clock sources. The first section offers odd sub harmonics, dividing the clocks by 1, 3, 5, and 7. The second section offers even sub harmonics, dividing the clocks by 2, 4, 6, and 8. These two section outputs are then mixed together via a voltage controlled crossfader. The outputs can either be used in the audio range to create rich sounds or used at slower rates as CV sources, even patched back into one of the oscillators. Each side of Canyon can also be clocked independently, which can lead to some rich tones. Note - The tracking switch is labelled backwards on Canyon so it tracks OSC2 and OSC3 in the up position.
