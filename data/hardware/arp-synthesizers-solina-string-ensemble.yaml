description: >-
  The Solina String Ensemble is a multi-orchestral string machine with Violin, Viola,
  Trumpet, Horn, Cello, and Contra-Bass voices that produces lush, shimmering string
  tones, particularly when its distinctive chorus effect is engaged.
details: |-
  The Solina String Ensemble is one of the most iconic string machines of the late 1970s. Individual orchestral voice switches for Violin, Viola, Trumpet, Horn, Cello, and Contra-Bass allow for varied ensemble configurations. The lower 20 keyboard keys provide monophonic Cello and Contra-Bass sounds, while the remaining four voices offer polyphonic playback across the full keyboard range. Though individual sounds are quite unrealistic on their own, their combination creates an especially rich, animated texture.

  The instrument employs divide-down technology, typical of organs of the era, to achieve full polyphony. Its distinctive Chorus/Ensemble effect uses three modulated delay lines producing phase-shifting that enhances thickness and movement. Additional controls include Crescendo (attack) and Sustain Length (decay) sliders, volume controls, and a global tuning adjustment. Gate and Trigger outputs support polyphonic keyboard connectivity.

  Notably, ARP did not originate the Solina. The Dutch company Eminent created it in 1974, deriving it from their 310U Organ's string section. ARP acquired re-branding rights for the US market. Four production versions existed: SE-I (monoaural with permanent chorus), SE-II (switchable chorus), SE-III (stereo output), and SE-IV (with LED indicators).

  Prominent users include Air, The Eagles, Elton John, Pink Floyd, The Cure, Joy Division, OMD, Josh Wink, STYX, Tangerine Dream, Keane, Japan, and New Order.
specs: |-
  - Polyphony: Full (divide-down)
  - Voices: Viola, Violin, Cello, Contra-Bass, Horn, Trumpet
  - Keyboard: 49 keys
  - VCA: Crescendo (attack) and Sustain (decay) sliders
  - Effects: Chorus/Ensemble (three modulated delay lines)
  - Control: CV/Gate outputs
  - Production period: 1974-1981
