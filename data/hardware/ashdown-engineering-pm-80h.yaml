description: A hand-built UK 80-watt valve guitar head that captures classic
  British tone, powered by 4 x EL34 for rich harmonics and dynamic response. Its
  dual-channel design, Dark/Light voicings, and foot-switchable Boost move
  seamlessly from chiming cleans to roaring drive. A rear channel-link unlocks
  greater flexibility, while a built-in load makes silent recording effortless.
  Meticulously built in the UK, the PM-80H is a studio and stage workhorse with
  timeless character.
