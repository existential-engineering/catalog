name: Go Guitar
manufacturer: tc-helicon
primaryCategory: audio-interface
categories:
  - guitar
  - preamp
url: https://www.tchelicon.com/en/products/0802-aad
description: Pocket-sized guitar interface for phones and tablets. A 1/4-inch
  instrument input and a gain control feed the device over a captive four-pole
  1/8-inch cable, with a 1/8-inch headphone output for monitoring.
details: |-
  Go Guitar connects an electric or acoustic guitar to a phone or tablet so the device can run an amp simulator, a practice tool or a recording app. It replaces the plain headphone-jack adapter route, which brings hum, hiss and an impedance mismatch with it.

  The guitar plugs into a 1/4-inch jack on one end of the enclosure and headphones into a 1/8-inch jack beside it. A captive cable terminating in a four-pole 1/8-inch plug carries the signal to the mobile device and returns the device's output to the headphone jack, so the unit draws its power from the device rather than from a battery or a supply.

  A gain control sits on the side of the enclosure and a clip on the back attaches it to a strap or a pocket. The enclosure is small enough to live in a gig bag pocket.
specs: |-
  - 1/4-inch instrument input
  - 1/8-inch headphone output
  - Captive cable with a four-pole 1/8-inch plug for the mobile device
  - Gain control
  - Bus-powered from the connected device
  - Clip on the rear of the enclosure
