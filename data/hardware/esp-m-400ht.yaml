description: The LTD M-400HT takes the speedy, flat-topped ESP M/Mirage shape and offers it with professional components and build quality at a price that musicians can afford.
details: |-
  The LTD M-400HT takes the speedy, flat-topped ESP M/Mirage shape and offers it with professional components and build quality at a price that musicians can afford. This guitar is designed for your most brutal chugs and fluid leads, using bolt-on construction at 25.5” scale that pairs a mahogany body to a three-piece roasted maple neck with a reversed matching-finish headstock, rosewood fingerboard, and 24 extra-jumbo frets. Details like black hardware and single-ply black binding help impart this guitar’s tough aesthetic. Components on the M-400HT include LTD locking tuners, an LTD hardtail bridge with string-thru-body, and a set of powerful and aggressive EMG 81 (bridge) and EMG 85 (neck) active pickups.
specs: |-
  - Construction: Bolt-On
  - Scale: 25.5"
  - Body: Mahogany
  - Neck: 3Pc Roasted Maple
  - Fingerboard: Rosewood
  - Fingerboard Radius: 350mm
  - Finish: Scarlet Metallic
  - Nut Width: 43mm
  - Nut Type: Molded
  - Neck Contour: Extra Thin U
  - Frets/Type: 24 XJ
  - Hardware Color: Black
  - Strap Button: Standard
  - Tuners: LTD Locking
  - Bridge: LTD Fixed Bridge w/ String Thru
  - Bridge PU: EMG 81 Black
  - Neck PU: EMG 85 Black
  - Electronics Layout: Volume/Tone/3-way Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
  - Case: MH GUITAR FORM FIT CASE
  - Case Included: N
