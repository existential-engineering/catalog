description: A three-in-one drive pedal that blends overdrive, distortion and
  fuzz in parallel, recreating the studio trick of layering multiple amps. Let
  the sustain of fuzz, the bite of distortion and the clarity of overdrive work
  together in a single box.
details: |-
  Blending amps together to combine their strengths is a long-standing studio technique, and the Multidrive brings it to the pedalboard. It gives independent control over how much overdrive, distortion and fuzz get added in parallel, each with a switchable high-pass or low-pass filter, creating a full, rich array of tones. It is effectively an overdrive, fuzz and distortion pedal in one.

  An innovative all-analog signal path harnesses germanium diodes, class-A BJT amplifiers, FET distortion and soft LED clipping curves for amp-like tones. The distortion has three modes ranging from controlled to sizzling with a tight low end, the overdrive has a smooth germanium break-up with tube-like compression, and the fuzz delivers smooth, rich sustain. A comprehensive EQ pairs high and low shelving with a frequency-selectable mid bell, and a select switch toggles between two preset combinations. Multi-colour display LEDs always show what the pedal is doing.
specs: |-
  - Controls: independent Overdrive, Distortion and Fuzz amounts (each with switchable high-pass/low-pass filter), high/low shelving EQ, frequency-selectable mid bell, 2-preset select switch
  - Three distortion modes
  - Blends overdrive, distortion and fuzz in parallel
  - Multi-colour display LEDs
  - All-analog signal path
  - True bypass
  - Power: 9-18V DC (negative tip), 2.1mm barrel connector
  - Power consumption: 180mA
  - Enclosure: die-cast aluminum
  - Dimensions: 3.5" L x 4.5" W x 1.5" H (enclosure), 2" H including controls
