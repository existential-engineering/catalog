url: https://www.engl-amps.com/shop/heads/savage-120-mark-ii-e610ii/
description: Four-channel 120 W all-valve guitar amplifier head with two
  valve-buffered FX loops, a reworked three-band EQ with Lean and Bold mid
  characters, a noise gate and full MIDI programmability.
details: |-
  A true classic in the world of amp heads in its latest and best reincarnation, this amp is simply incomparable when it comes to dynamics and flexibility. The Mark II includes some incredible new inner developments, as well as a bunch of new features. The MIDI port is now included as standard, as well as a finely tuned and sensitive-responding noise gate, so you'll not be disrupted by extraneous noise, even at extreme gain settings.

  Our iconic amplifier designer, Horst Langer, has also reworked the 3-band EQ from Channel 1 and Channel 2, which come freshly voiced and equipped with Lean/Bold circuits for two different mids characters.

  Also new is the Gain Lo/Hi circuit, where the Clean channel becomes Crunch in Hi mode, and the Lead channel gets even fatter and heavier. Four channels, tons of sound-shaping features and truly thunderous tones make the SAVAGE Mark II the perfect sound center for a modern guitar rig.

  The 120 watts come from two ENGL 6550 output valves and six ENGL ECC83 (12AX7) preamp valves, running four channels (Clean, Crunch I, Crunch II and Lead) into two valve-buffered FX loops, each with its own balance control.

  Every function accessible on the front panel is MIDI programmable, over MIDI In and MIDI Thru with write and copy functions, channel assignment and controller enable switches, and a phantom power switch for an ENGL MIDI foot controller. Switching is also available over the footswitch jack and the S.A.C. port for the Z4, Z9, Z12 and Z15 controllers.
specs: |-
  - 4 channels: Clean, Crunch I, Crunch II, Lead
  - All-valve head
  - 2 valve-buffered FX loops, each with a balance control
  - Noise gate with rear-panel threshold control
  - Master A/B
  - Power valve monitor
  - MIDI In / MIDI Thru, with all front-panel functions MIDI programmable
  - MIDI channel assignment and controller enable switches, write / copy for MIDI programming
  - ENGL MIDI foot controller phantom power switch
  - S.A.C.: Serial Amp Control
  - Sound options: Input Lo/Hi, Bright, Preshape, Contour (Clean, Crunch I), Mid Lean/Bold, Depth Boost, Gain Lo/Hi, Contour (Crunch II, Lead), Rough / Smooth
  - Controls: Gain (per channel), Bass / Mid Lean / Mid Bold / Treble (Clean, Crunch I), Bass / Middle / Treble / Tone Balance (Crunch II, Lead), Volume (per channel), Presence A, Presence B, Master A, Master B, Noise Gate threshold, FX Loop I and II balance
  - Poweramp output: 1 x 4 ohm, 1 x 8 ohm, 1 x 16 ohm, 2 x 8 ohm parallel, 2 x 16 ohm parallel
  - Line out
  - Footswitch: Z4, Z9, Z12, Z15
  - Preamp valves: 6 x ENGL ECC83 / 12AX7
  - Output valves: 2 x ENGL 6550
  - Output power: 120 W
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 22.5 kg
