details: |-
  The Martin OM-45 sits at the pinnacle of the Standard Series, a flagship Orchestra Model that has long represented the company's most ornate take on the 000-14 fret platform. Solid Sitka spruce with an Aging Toner finish tops a body of solid East Indian rosewood, paired with GE-Scalloped Golden Era X-bracing for a clear, complex voice that balances note separation with a powerful low end.

  The neck is genuine mahogany carved to a GE Modified Low Oval shape with a High-Performance Taper, joined to the body at the 14th fret with a 25.4-inch scale length. A thinner ebony fingerboard with beveled edges and a 1 3/4-inch nut width gives the OM-45 a fast, modern playing feel under fingerpickers and hybrid pickers alike.

  The Style 45 appointments are the visual signature: hexagon abalone fingerboard inlays, an abalone multi-stripe running around the top, back, sides, and rosette, and bone bridge pins with abalone dots. Gold open-gear tuners and an ebony GE Modern Belly bridge with a drop-in saddle complete the ornate look while keeping the instrument easy to set up and service.

  Each OM-45 ships pre-strung with Authentic Acoustic Lifespan 2.0 Light gauge strings and arrives in a plush-lined hardshell case. There are no factory electronics — this is a pure acoustic instrument backed by Martin's Limited Lifetime Warranty and is available in both right- and left-handed configurations.
specs: |-
  - Body Size: 000-14 Fret (Auditorium / OM)
  - Top: Solid Sitka Spruce with Aging Toner finish
  - Back and Sides: Solid East Indian Rosewood
  - Bracing: X-Brace, GE-Scalloped, Golden Era pattern
  - Scale Length: 25.4 inches
  - Nut Width: 1 3/4 inches
  - Neck: Genuine Mahogany, GE Modified Low Oval shape, High-Performance Taper
  - Fingerboard: Ebony, thinner profile with beveled edges
  - Inlays: Style 45 Hexagon (Abalone)
  - Bridge: Ebony GE Modern Belly with drop-in saddle
  - Bridge Pins: Bone with Abalone dots
  - Tuners: Gold Open Gear
  - Frets: 20 total, body joins neck at the 14th fret
  - Strings: Authentic Acoustic Lifespan 2.0, Light gauge
  - Trim: Abalone multi-stripe throughout
  - Electronics: None
  - Case: Hardshell with plush lining
  - Handedness: Right- and Left-handed available
