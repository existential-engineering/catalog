description: |+
  The One That Started It All

  Since its launch in 2007, the EVH brand has had one mission - to take the tools Eddie Van Halen uses to create his groundbreaking guitar work and place them in your hands.

  Over 35 years of innovation and experience were injected into the creation of the original Wolfgang USA, which continues to unleash pure unadulterated rock 'n' roll power, titanic sound, speedy playability and stunning spotlight-ready style.

