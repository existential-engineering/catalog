name: ZX1i
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/zx1i/
description: The ZX1i is an 8-inch two-way passive full-range loudspeaker
  engineered for fixed-install indoor and outdoor applications. An EV8L 203 mm
  (8-inch) woofer and DH2005 25 mm (1-inch) exit compression driver crossed over
  at 1.7 kHz deliver 123 dB maximum SPL with a 90 x 50 degree coverage pattern.
  Patented Automatic Saturation Compensation (ASC) protects the system at high
  drive levels, and an optional 70/100 V transformer version (ZX1i-100T) is
  available for distributed audio installs. The ABS resin enclosure with
  polyester powder-coated 18 GA galvanized steel grille is paired with an
  integrated QuickSAM heavy-duty Strong-Arm mounting bracket. Connections are
  made via a single 4-pin Phoenix-style terminal. The transformer version is
  rated IP-55 and the system is EN54-24 type B compatible with the optional
  TC-ZX1i cover.
details: |-
  8-inch (203 mm) two-way passive full-range install loudspeaker

  EV8L 8-inch woofer with DH2005 1-inch exit compression driver

  Crossover frequency 1.7 kHz

  Maximum SPL 123 dB

  Coverage pattern 90 degrees horizontal x 50 degrees vertical

  Rated 200 W continuous, 400 W program, 800 W peak (8 ohm nominal)

  Patented Automatic Saturation Compensation (ASC) for high-level protection

  Optional 70/100 V transformer version (ZX1i-100T) for distributed systems

  Integrated QuickSAM heavy-duty Strong-Arm mounting bracket

  ABS resin enclosure with polyester powder-coated 18 GA galvanized steel grille

  Transformer version is IP-55 rated for outdoor use

  EN54-24 type B compatible with optional TC-ZX1i cover (select regions)
specs: >-
  - frequencyResponse: 60 Hz - 20 kHz (-3 dB)

  - frequencyRange: 48 Hz - 20 kHz (-10 dB)

