  - transformerTaps70V: 6, 12.5, 25, 50, 100 W, 8 ohm bypass (ZX1i-100T)

  - transformerTaps100V: 12.5, 25, 50, 100 W, 8 ohm bypass (ZX1i-100T)

  - enclosureMaterial: ABS resin

  - grille: Polyester powder-coated 18 GA galvanized steel

  - mounting: Integrated QuickSAM heavy-duty Strong-Arm bracket

  - dimensions: 451 x 282 x 263 mm (18 x 11 x 10 in) H x W x D

  - weight: 8.4 kg (18.5 lb) without transformer; 10.4 kg (23.0 lb) with
