description: The H4essential offers 4 tracks and more options. With 32-bit
  float, X/Y mics, and 2 XLR/TRS inputs, easily record your music, podcasts, and
  video audio.
details: |-
  With four tracks, 32-bit float recording, advanced X/Y mics and 2 XLR/TRS inputs, creators have more ways to record their music, podcasts and audio-for-video. 32-bit float recording means levels never have to be adjusted, so the H4essential captures every nuance while staying clip-free on every take.

  The 2 XLR/TRS combo inputs use ultra-clean Zoom preamps with phantom power and +4 dBu professional line-level support, and the onboard X/Y microphones capture up to 130 dB SPL. A 3.5 mm mic/line input takes lavalier mics and line-level sources through plug-in power.

  Connected to a PC, Mac, iOS or Android device over USB-C, the H4essential works as a 4-in/2-out audio interface, streaming in 32-bit float while simultaneously recording to the SD card. The built-in mixer adjusts each track's level and the full-color LCD carries a waveform display so audio is visible as it records.

  Recording and rotary controls are designed for quiet operation, a built-in speaker gives quick reference playback, and the 3.5 mm output feeds headphones or a camera. Storage runs to microSDXC cards up to 1TB. The Essential Series was the first Handy Recorder line designed with accessibility for the blind and visually impaired, with audible menu descriptions in English, Spanish, French, Japanese, German, Italian or Chinese.

  A firmware update for the Essential Series added AI Noise Reduction to lower the noise floor by removing steady background noise, gain adjustment during recording, and MP3 recording for smaller files. The BTA-1 Bluetooth Adapter pairs with an iOS device to start recording, adjust the mix, view waveforms and change settings remotely, and receives wireless timecode from the ATOMOS UltraSync BLUE. The TCA-1 adapter generates and jams timecode within 0.5 frames over 24 hours.
specs: |-
  - 4 simultaneous recording tracks and 4 simultaneous playback tracks
  - Recording formats: WAV at 44.1/48/96 kHz, 32-bit float, mono or stereo, BWF and iXML supported. MP3 recording added by firmware
  - Recording media: microSDHC cards 4 to 32GB, microSDXC cards 64GB to 1TB
  - Built-in mic: 90 degree XY stereo format, unidirectional, -43 dB/1 Pa at 1 kHz sensitivity, 130 dB SPL maximum sound pressure input
  - INPUT 1-2: 2 XLR/TRS combo jacks with locking connectors (XLR 2 hot, TRS tip hot), gain adjustment unnecessary
  - Input impedance: 3.8 kohms or more on XLR mic, 39 kohms or more on TRS line
  - Maximum input level: +4 dBu on XLR mic, +24 dBu on TRS line
  - Phantom power: +48 V, 10 mA or less channel total
  - Equivalent input noise: -120 dBu or less (IHF-A) at 150 ohm on XLR mic, -95 dBu or less (IHF-A) at 600 ohm on TRS line
  - MIC/LINE IN: stereo mini jack with plug-in power, input impedance 2 kohms or more, gain adjustment unnecessary
  - Headphone out: stereo mini jack, maximum output 20 mW + 20 mW into a 32 ohm load, output impedance 10 ohms or less, also usable as a line output to a camera
  - Built-in mono speaker: 20 x 30 mm elliptical dynamic, 250 mW effective maximum output
  - Display: 2.0 inch full-color LCD, 360 x 240
  - USB: USB Type-C connector, USB 2.0 High Speed for audio interface and file transfer
  - Audio interface: 4 in / 2 out (multi) or 2 in / 2 out (stereo), 44.1/48/96 kHz interface only, 44.1/48 kHz with onboard recording, 24-bit and 32-bit float
  - Remote: dedicated ZOOM BTA-1 wireless adapter
  - Power: 2 AA alkaline, lithium or rechargeable NiMH batteries, USB bus power, or the ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Battery life on alkalines: about 9 hours 2-track with the built-in XY mic, about 2 hours 30 minutes 4-track, about 40 minutes 4-track with a plug-in power mic
  - Maximum power consumption: 3 W
  - Dimensions: 66.9 mm (W) x 156.1 mm (D) x 38.0 mm (H)
  - Weight: 243 g including batteries
  - AI Noise Reduction to lower the noise floor by removing steady background noise
  - Gain adjustment during recording and a built-in mixer for per-track levels
  - Timecode generation and jam sync via the TCA-1 adapter, wireless timecode from the ATOMOS UltraSync BLUE with the BTA-1
  - Voice Guidance accessibility in English, Spanish, French, Japanese, German, Italian or Chinese
