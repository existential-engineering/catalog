description: Function Junction is a modulation hub combining four independent
  sections into a single intertwined module that offers much more than the sum
  of its parts.
details: |-
  Function Junction combines three classic analog modulation sources — ADSR envelope, function generator, and LFO — all fed into an attenuverting mixer to create a complex modulation junction that can be used as 4 independent sections or in conjunction with each other.

  Each section can be patched by itself. The ADSR, function generator, LFO, and mixer never need to interact. The mixer is perfectly happy to mix external signals instead of the modulation sources. Each section uses switched jacks to normal internal connections, which can easily be patched over to create custom signal paths.
specs: |-
  - Width: 16 HP
  - Depth: 30mm
  - Power draw: 130mA (+12V rail), 70mA (-12V rail)
  - ADSR: fully analog 4-stage envelope circuit, independent Attack, Decay, Sustain and Release controls, 0V-10V output range
  - ADSR Loop button enables/disables envelope cycling; A Loop jack accepts external gate to flip loop mode state
  - Function Generator: variable modulation source, +/-5V output range, Attack/Decay/Curve/Mod knobs, exponential/linear/logarithmic response curve
  - Function Generator has 3 response modes: Sustain Mode, Trigger Mode, and Loop Mode
  - LFO: triangle and square wave outputs, dedicated rate knob, +/-8V output voltage
  - Mixer: 3-channel attenuverting mixer with OR (analog logic) circuit
