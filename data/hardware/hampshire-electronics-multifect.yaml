details: |-
  The Multifect from Hampshire Electronics is a modular multi-effects processor designed for creative sound shaping inside your Eurorack system. Combining delay, chorus, and reverb in one powerful, patchable unit, Multifect brings studio-quality processing and total CV control to your modular setup. With its intuitive interface, 7-segment display, and full voltage control over every parameter, Multifect turns time, space, and modulation into instruments of their own. Built for musicians who demand flexibility, immediacy, and sonic depth — all in the modular domain. Hand-assembled in England , the Multifect pairs high-resolution digital effects with an analog signal path for warm, musical response and effortless integration into any Eurorack system. Multifect Manual: Download Multifect Manual PDF

  Effects Overview

  Echo / Delay

  Chorus

  Reverb

  Creative Control

  Specifications

  Included

  Multifect brings the precision of digital control and the warmth of analog sound into a single, performance-ready Eurorack module — your effects, your way.
specs: |-
  - Controls: Wet/Dry, Regen, Time, Tap Tempo, Reverse
  - Time Sync: Clock input for tempo-based delay timing
  - Display: 7-segment readout for delay time and feedback
  - Controls: Wet/Dry, Speed, Depth
  - Classic analog-style chorus with smooth modulation and stereo movement
  - Controls: Wet/Dry, Size, Damp, Gain, Shimmer, Shimmer HPF, Regen
  - Rich, spacious reverb with adjustable tonal shaping and ethereal shimmer
  - Full CV control of all parameters for total modulation freedom
  - 99 programmable presets with instant recall
  - Supports manual and voltage-based control for real-time performance
  - Perfect for ambient textures, rhythmic effects, and evolving soundscapes
  - Format: Eurorack module
  - Effects: Echo/Delay, Chorus, Reverb
  - Presets: 99
  - CV Inputs: Full control for every parameter
  - Display: 7-segment numeric readout
  - Width: 28HP
  - Construction: Hand-assembled in England
  - Power: ±12V Eurorack standard
  - Hampshire Electronics Multifect module
  - Power ribbon cable
