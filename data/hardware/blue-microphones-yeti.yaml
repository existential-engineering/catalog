description: Multi-pattern USB microphone with a three-capsule condenser array,
  Blue VO!CE filters, onboard studio controls, and a headphone output.
details: |-
  The Logitech Yeti microphone allows you to create an immersive sound experience that takes gaming, podcasting, and streaming to the next level. Featuring multiple pickup patterns and Blue VO!CE filters and effects, Logitech's Blue Yeti mic is a tried-and-true choice that enables you to sound your best. The Blue VO!CE filters and effects require download and installation of the free G HUB software.

  Exclusive to Logitech G, Blue VO!CE software helps you develop your own signature vocal sound. Dial in your EQ, protect against clipping with the Limiter and remove pops with the Depopper. Add flavor to your stream (or pester your squadmates) with fun vocal effects like pitch shifter, echo, reverb or chorus. Find new ways to express yourself with the included HD audio samples, or even use Yeti to record your own.

  The Logitech Yeti microphone features studio controls that put you in charge of every level of the recording process. Monitor your voice through the microphone, latency-free, with the headphone output. Adjust the microphone's sensitivity with the gain control, or, when you don't want your teammates hearing you sneeze, take a quick break from the action by tapping the instant mute button.

  Yeti's internal shockmount protects the 3-capsule array and helps keep your content clean and focused on your voice. When inspiration strikes, Yeti is ready to capture it: just plug your Yeti microphone straight into your computer or laptop with the included USB cable, and you're all set to record or stream, right away. No drivers required.

  Yeti's sleek but simple desktop stand enables you to set the ideal angle to pick up your voice. Or, you can remove the stand and mount Yeti to a desktop boom arm like Compass. Whether you are streaming PvP battles, recording a video essay about the latest season of Warzone, or just chatting, Yeti's iconic shape is instantly recognizable on camera and provides your setup with a professional touch.
specs: |-
  - Three 14 mm condenser capsules
  - Polar patterns: cardioid, bidirectional, omnidirectional, stereo
  - Frequency response: 20 Hz to 20 kHz
  - Sample rate: 48 kHz
  - Bit rate: 16-bit
  - Max SPL: 120 dB (THD 0.5% at 1 kHz)
  - Bus-powered over USB, 5V 150mA required
  - Onboard gain control, pattern selector and instant mute button
  - Internal shockmount
  - Latency-free headphone monitoring output with onboard headphone amplifier
  - Headphone amplifier: 16 Ohms impedance, 130 mW RMS output, 0.009% THD, 15 Hz to 22 kHz, 100 dB signal to noise
  - Removable desktop stand, mountable on a desktop boom arm
  - Blue VO!CE filters and effects via the free G HUB software (EQ, limiter, depopper, pitch shifter, echo, reverb, chorus, HD audio samples)
  - Plug and play, no drivers required
  - Dimensions extended in stand: 12 cm x 12.5 cm x 29.5 cm (4.72 in x 4.92 in x 11.61 in)
  - Weight: 0.88 kg (1.94 lbs) microphone, 0.5 kg (1.1 lbs) stand, 1.4 kg (3.09 lbs) combined
  - System requirements: Windows 10 or later, or macOS 10.14 or later, with USB 1.1/2.0/3.0
  - In the box: Yeti USB microphone (including desktop stand), USB cable, user documentation
  - 2-year limited hardware warranty
