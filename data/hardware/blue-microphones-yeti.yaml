description: Multi-pattern USB microphone with a three-capsule condenser array,
  Blue VO!CE filters, onboard studio controls, and a headphone output.
details: |-
  Yeti is Blue's multi-pattern USB condenser microphone, now sold under Logitech G. Three 14 mm condenser capsules give it four pickup patterns (cardioid, bidirectional, omnidirectional and stereo), and it records at 48 kHz / 16-bit over a single USB connection with no drivers required.

  Studio controls sit on the microphone body: a gain control, a pattern selector, an instant mute button and a headphone volume control. The headphone output monitors the microphone with no latency through an onboard amplifier rated at 130 mW into 16 ohms. An internal shockmount isolates the 3-capsule array from desk and stand vibration.

  Blue VO!CE filters and effects run in the free Logitech G HUB software on the host computer. They cover EQ, a limiter against clipping and a depopper, along with pitch shifter, echo, reverb and chorus effects and HD audio samples for stream playback.

  The microphone ships on a removable desktop stand that sets its angle, and without the stand it mounts on a desktop boom arm such as Compass. Extended in its stand it measures 12 x 12.5 x 29.5 cm, and it weighs 0.88 kg without the 0.5 kg stand.
specs: |-
  - Three 14 mm condenser capsules
  - Polar patterns: cardioid, bidirectional, omnidirectional, stereo
  - Frequency response: 20 Hz to 20 kHz
  - Sample rate: 48 kHz
  - Bit rate: 16-bit
  - Max SPL: 120 dB (THD 0.5% at 1 kHz)
  - Bus-powered over USB, 5V 150mA required
  - Onboard gain control, pattern selector and instant mute button
  - Internal shockmount
  - Latency-free headphone monitoring output with onboard headphone amplifier
  - Headphone amplifier: 16 Ohms impedance, 130 mW RMS output, 0.009% THD, 15 Hz to 22 kHz, 100 dB signal to noise
  - Removable desktop stand, mountable on a desktop boom arm
  - Blue VO!CE filters and effects via the free G HUB software (EQ, limiter, depopper, pitch shifter, echo, reverb, chorus, HD audio samples)
  - Plug and play, no drivers required
  - Dimensions extended in stand: 12 cm x 12.5 cm x 29.5 cm (4.72 in x 4.92 in x 11.61 in)
  - Weight: 0.88 kg (1.94 lbs) microphone, 0.5 kg (1.1 lbs) stand, 1.4 kg (3.09 lbs) combined
  - System requirements: Windows 10 or later, or macOS 10.14 or later, with USB 1.1/2.0/3.0
  - In the box: Yeti USB microphone (including desktop stand), USB cable, user documentation
  - 2-year limited hardware warranty
  - Carbon footprint: 26.61 kg CO2e
