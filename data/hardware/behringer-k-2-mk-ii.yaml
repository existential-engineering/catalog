description: Analog semi-modular monophonic synthesizer with dual authentic
  VCOs, a 6 dB high-pass / 12 dB low-pass VCF, ring modulation and a multi-I/O
  patch bay, built as a modern homage to the iconic Korg synthesizer produced
  from 1978 to 1983. The MK II revision adds OSC sync, FM and PWM plus V/Oct
  tracking on all CV/Gate ins and outs, with 16-note Poly Chain and a main
  module that transfers into a standard Eurorack case.
details: |-
  Pure Analog Signal Path

  Great care has been taken in engineering the K-2 MK II, including the true to the original VCO, VCF and VCA designs and pure analog circuitry with matched transistors and JFETs. This highly-focused attention to detail is what gives K-2 MK II its ultra-flexible sound shaping capability, which covers everything from super-fat bass and lead tones to stunning effects, all the way out to the otherworldly sounds of your imagination.

  Versatile VCF

  The very heart of K-2 MK II's sound is its versatile 6 dB High/12 dB Low filter. The high-pass filter sets the level of signals below the cutoff frequency, effectively reducing the fundamental and lower-order harmonics levels. The low-pass filter controls the level of signals above the cutoff, which reduces higher-order harmonic content. K-2 MK II's VCF Peak controls provide emphasis to the signals at the crossover frequency.

  Vintage Oscillators

  K-2 MK II's authentic Voltage Controlled Oscillators (VCOs) provide an incredible range of 4 variable oscillator shapes with variable pulse widths and ring modulation for the ultimate in sound creation. VCO 1 waveform choices include triangle, reverse-sawtooth, noise and pulse. VCO 2's waveform can be selected from reverse-sawtooth, square, narrow pulse and ring, where both oscillators are operating. The VCO Mixer allows you to adjust the levels of VCO 1 and VCO 2 to create an overall mix and a wide range of amazing effects.

  The Envelope, Please...

  K-2 MK II's Low Frequency Oscillator (LFO), the Modulation Generator, features a selectable Waveform (reverse sawtooth, triangle, sawtooth) and 2 separate Envelope generators to help you craft incredible sounds. Envelope Generator 1 has controls for Delay, Attack and Release Time, while generator 2 adjusts the cutoff frequency modulation, as well as amplitude modulation of the Voltage Control Amplifier (VCA). Dials for this generator include Hold, Decay, Attack, Sustain, and Release for unparalleled envelope-shaping control.

  16-Note Poly Chain Ready, and Eurorack Ready

  While it is a monophonic instrument (one note at a time), K-2 MK II's 16-note Poly Chain function lets you combine multiple synthesizers for up to 16-voice polyphony, plus provides vastly improved reliability and stability over its 1970s and '80s predecessors. Designed to handle the rigors of life on the road or in the studio, the K-2 MK II can easily be transferred into a standard Eurorack case for integration into an existing system. For those who want the numbers, K-2 MK II has 36 controls, all laid out in a highly intuitive format, and its tone-sculpting capabilities can be expanded by using the multi-I/O patch bay to connect external devices at virtually any point in the signal path.
specs: |-
  - Monophonic analog synthesizer, with 16-note Poly Chain for up to 16-voice polyphony across multiple units
  - Pure analog signal path based on authentic VCO, VCF and VCA designs, with matched transistors and JFETs
  - Semi-modular architecture with default routings, so no patching is required for immediate performance
  - 2 authentic VCOs with 4 variable oscillator shapes and variable pulse widths
  - VCO 1 waveforms: triangle, reverse sawtooth, noise, pulse
  - VCO 2 waveforms: reverse sawtooth, square, narrow pulse, ring
  - VCO Mixer for balancing the levels of VCO 1 and VCO 2
  - MK II additions: OSC sync, FM and PWM, plus V/Oct. on all CV/Gate ins and outs
  - Ring modulation
  - VCF: 6 dB high pass and 12 dB low pass (first and second-generation filter design) with Peak / resonance controls
  - Dedicated, fully analog triangle/square wave LFO
  - Modulation Generator (LFO) waveform selectable between reverse sawtooth, triangle and sawtooth
  - 2 analog envelope generators: EG 1 with Delay, Attack and Release Time; EG 2 with Hold, Decay, Attack, Sustain and Release, modulating VCF cutoff and VCA amplitude
  - External audio input for processing external sound sources
  - Multi-I/O patch bay for connecting external devices at virtually any point in the signal path
  - 36 controls
  - Comprehensive USB / MIDI implementation with MIDI channel and Voice Priority selection
  - Main module can be transferred into a standard Eurorack case
