description: The Organelle is a synthesizer with a library of instruments
  inside. Flip through and choose one, turn the knobs, and play. Maple keys and
  four knobs give you immediate, tactile control over every sound.
details: |-
  The Organelle is a synthesizer with a library of instruments inside. Flip through and choose one, turn the knobs, and play. Maple keys and four knobs give you immediate, tactile control over every sound. It comes loaded with instruments ready to go. New PLAY patches are designed for immediate use: pick one and you're making music. Want to go further? The EXPLORE library opens up over a hundred more sounds, effects, and experimental patches built by Critter & Guitari and the Organelle community.
specs: |-
  - Sampling rate: 44.1kHz, 16-bit (in & out)
  - High-contrast OLED display screen
  - Four parameter knobs, rotary selection knob with push-button select, volume knob
  - 25x maple keys
  - RGB LED
  - 1.8GHz ARM Cortex A53 processor (quad-core, 64-bit), 1GB RAM, Linux operating system
  - 8GB microSD card installed, split into OS and patches/samples partitions
  - Weight: 1.09 lbs (495g)
  - Size: 10.625 x 3.36 x 2.175 in (27 x 8.53 x 5.52 cm)
  - Enclosure: powder-coated aluminum top and bottom, screen-printed ink, rubber foot pads
  - Made in the USA
