description: >-
  The Ensoniq EPS-16 Plus is a 16-bit sampler workstation released in 1990, combining
  sampling, synthesis, and an 8-track sequencer in a single integrated instrument. It
  features variable sample rates up to 44.6kHz, dual switchable filters, onboard effects
  with resample capability, and a 61-key velocity and pressure sensitive keyboard.
details: |-
  The EPS-16 Plus represented a significant advancement in sampler technology when it was introduced in 1990. As a dedicated sampler workstation, it delivered impressive specifications for the era: 16-bit mono sampling at variable rates from 11.2kHz to 44.6kHz, providing approximately 11.5 seconds of sampling time at maximum quality in mono mode. The device included sophisticated editing capabilities such as normalizing, sample splicing, merging, phase switching, auto-looping, auto-truncating, and sample rate conversion.

  On the synthesis side, the instrument featured two filters with switchable high, low, and band-pass modes ranging from 6dB to 24dB slopes, though notably without resonance capability. The keyboard offered velocity and pressure sensitivity with full MIDI implementation, making it compatible with external controllers and sequencers. A variable LFO with seven distinct waveform shapes provided modulation possibilities for dynamic sound creation.

  The sequencer proved particularly noteworthy as an 8-track sequencer that performers could operate in real-time during live performances. The comprehensive onboard effects suite included reverb, delay, chorus, flange, phaser, Leslie simulation, distortion, and wah-wah, with the unique capability to resample effects back into the audio material. The instrument could even play while loading new samples, enhancing workflow efficiency.

  The EPS-16 Plus gained recognition among notable electronic musicians including Autechre, LFO, Massive Attack, and Slam. Memory could be expanded from 1MB to 2MB through third-party upgrades, and firmware updates via flash ROM allowed users to access additional effects and expanded capabilities throughout the device's lifetime.
specs: |-
  - Polyphony: 7 to 20 voices
  - Sampling: 16-bit mono, 11.2kHz to 44.6kHz
  - Max Sample Time: 11.5 seconds at 44.6kHz (mono)
  - LFO: 7 waveform shapes
  - Filters: 2 filters, high/low/band-pass, 6dB to 24dB slopes
  - Keyboard: 61 keys, velocity and pressure sensitive
  - Memory: 1 MB (expandable to 2 MB)
  - MIDI: Full implementation
  - Sequencer: 8-track
  - Effects: Reverb, delay, chorus, flange, phaser, Leslie sim, distortion, wah-wah
