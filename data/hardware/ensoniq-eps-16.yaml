description: >-
  The Ensoniq EPS-16+ is a 16-bit sampler workstation with switchable multimode filters, a built-in effects suite, and an 8-track sequencer, known for its crunchy early-digital sampling character.
details: |-
  The EPS-16+ was Ensoniq's innovative sampler workstation designed for the early 1990s, offering 16-bit sampling at variable rates from 11.2kHz to 44.6kHz with approximately 11.5 seconds of mono recording time at maximum quality. Its polyphony scales dynamically from 7 to 20 voices depending on the sample rate used.

  Sound shaping comes from two filters with switchable highpass, lowpass, and bandpass modes at selectable 6dB to 24dB cutoff slopes, though they lack resonance. An LFO with seven waveform shapes adds modulation possibilities. The built-in effects processor provides reverb, delay, chorus, flange, phaser, Leslie simulation, distortion, and wah-wah, with the ability to resample processed audio back into memory for creative layering.

  A sophisticated 8-track sequencer handles arrangement duties, while the 61-key velocity and pressure-sensitive keyboard supports expressive performance. The instrument can load new samples while continuing playback, a practical feature for live use. With 1MB of RAM expandable to 2MB and full MIDI implementation, the EPS-16+ brings what many describe as an appealing early crunchy sampler character. A rack-mount version was also produced. Notable users include Autechre, LFO, Massive Attack, and Slam.
specs: |-
  - Polyphony: 7 to 20 voices (rate dependent)
  - Sampler: 16-bit mono; 11.2kHz to 44.6kHz
  - Sample Time: Up to 11.5 seconds at 44.6kHz (mono)
  - Memory: 1MB expandable to 2MB
  - Filters: 2 multimode (highpass, lowpass, bandpass); 6dB to 24dB slopes (non-resonant)
  - LFO: 7 waveform shapes
  - Effects: Reverb, delay, chorus, flange, phaser, Leslie sim, distortion, wah-wah
  - Sequencer: 8-track
  - Keyboard: 61 keys with velocity and pressure sensitivity
  - Control: Full MIDI implementation
