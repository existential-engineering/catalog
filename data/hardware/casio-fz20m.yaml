description: >-
  The Casio FZ20M is a rack-mount 16-bit sampler released in 1988, building upon the FZ1 and FZ10M
  with improved capabilities including SCSI connectivity for hard drive integration.
details: |-
  Arriving about three years after its predecessors, the FZ20M represented Casio's continued push
  into professional sampling territory. The unit offered 16-bit sampling at rates of 9kHz, 18kHz,
  and 36kHz with 2MB of sample memory, capable of storing up to 64 samples simultaneously and
  providing roughly 30 seconds of sampling time at the highest rate.

  The FZ20M is an eight-voice, eight-part multitimbral instrument with two oscillators per voice.
  Its waveform capabilities extend beyond simple sample playback to include additive synthesis,
  pulse, sawtooth, sine, square, user-drawn waveforms, white noise, and wavetable options, giving
  it surprising versatility for a sampler of its era.

  Filtering is handled by a two-pole (12dB/octave) resonant low-pass filter, while a single LFO
  offers multiple waveshapes including saw up, saw down, sine, square, and triangle with delay and
  key sync options. Two VCA envelope generators provide dynamic shaping of the sound.

  The addition of SCSI connectivity was a significant improvement over earlier models, freeing users
  from the limitations of floppy disk storage and enabling faster, more practical workflow with
  external hard drives.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: 8 parts
  - Oscillators: 2 per voice
  - Waveforms: Additive, pulse, saw, sine, square, user-drawn, white noise, wavetable
  - Filter: 12dB/octave (2-pole) resonant low-pass
  - LFO: 1 (saw up/down, sine, square, triangle with delay and key sync)
  - Envelopes: 2 VCA
  - Sampling: 16-bit at 9kHz, 18kHz, or 36kHz
  - Sample Memory: 2MB (up to 64 samples)
  - Sample Time: ~30 seconds at 36kHz
