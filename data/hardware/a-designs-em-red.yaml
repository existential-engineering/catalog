description: A 500-series microphone preamplifier voiced as the mid-forward
  member of the A-Designs EM family, pairing a proprietary input transformer
  with a custom-wound steel and nickel output transformer for present midrange
  on drums, guitar and acoustic instruments. No longer in production.
details: |-
  The EM-Red is the mid-forward member of A-Designs Audio's 500-series EM family, a line of transformer I/O mic preamp modules each voiced with a distinct sonic character through custom-wound transformers. It derives its distinctive tone from a combination of an A-Designs proprietary input transformer featuring a unique winding and a custom-wound steel/nickel output transformer, also built to a proprietary A-Designs alloy ratio.

  The extra midrange push suits a microphone that lacks present mids, or any source that needs to come forward in the mix. A-Designs name drums, guitar, bass guitar and acoustic instruments as its strongest applications, and single out acoustic guitar recorded with a condenser microphone, along with bringing out the resonance and character of rack and floor toms.

  Like the rest of the EM series, the module is physically compatible with any API or VPR Alliance 500-series mounting device and meets the power rating those racks require. Within the family it sits between the darker EM-Silver and the brighter EM-Blue, and its input transformer is also used in the hybrid EM-Gold. A-Designs no longer offer the module: only the P-1 and the EM-PEQ remain available from the 500-series line.
specs: |-
  - Format: 500-series (API/VPR Alliance compatible)
  - Input transformer: proprietary A-Designs, unique winding
  - Output transformer: custom-wound steel/nickel proprietary alloy
  - Sonic character: mid-forward, present midrange
  - Ideal sources: drums, guitar, bass guitar, acoustic instruments, rack and floor toms
  - Availability: no longer offered by A-Designs
