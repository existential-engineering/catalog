details: |-
  The Phantom Classic is a large diaphragm FET condenser microphone from Brauner Microphones,
  designed around the philosophy of reduction to the absolutely essential without compromise
  in performance. Operating exclusively in cardioid mode, it delivers sound quality otherwise
  found only in tube microphones, making it a standout offering in the solid-state microphone
  segment.

  Its capsule design draws direct inspiration from the VM1, Brauner's flagship tube
  microphone, resulting in a very natural and pristine sound character. This pedigree gives
  the Phantom Classic a tonal quality that belies its FET-based circuitry, bridging the gap
  between solid-state reliability and tube-like warmth.

  The Phantom Classic is the successor to the Phantom C and the legitimate follow-up to the
  limited-edition Phantom AE (Anniversary Edition), which was produced in a run of 1,000
  nickel and 1,000 black units. The AE earned the KEYS Reader Award 2006 for Best Microphone,
  establishing the lineage the Phantom Classic continues.

  With an equivalent noise floor below 11 dB(A) and a maximum SPL handling of 142 dB at
  0.3% THD, the microphone is suited for demanding recording applications. It operates on
  standard 48 V phantom power, requiring no external power supply.
specs: |-
  - Transducer type: large diaphragm FET condenser
  - Polar pattern: cardioid (fixed)
  - Equivalent noise: < 11 dB(A) (IEC651)
  - Signal-to-noise ratio: > 83 dB (1 Pa / 1 kHz, cardioid)
  - Sensitivity: 28 mV/Pa (cardioid)
  - Frequency range: 20 Hz - 22 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power supply: 48 V phantom power
  - Capsule inspired by the VM1 tube microphone design
