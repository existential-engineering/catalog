description: >-
  The Korg MS-50 is a keyboard-less monophonic analog expander module from 1978, offering
  the most extensive patchability of any instrument in Korg's MS series. It features a
  single VCO, dual highpass/lowpass filters, a ring modulator, sample and hold, and two
  ADSR envelope generators, all accessible through an extensive patch bay. Designed as a
  companion to the MS-20 and SQ-10 sequencer, it bridges the gap between Korg's affordable
  semi-modular synths and larger fully modular systems.
details: |-
  The Korg MS-50, released in 1978, sits at the top of the MS-series hierarchy in terms of patching flexibility. As a keyboard-less expander module, it was designed to be controlled externally via Korg's Hz/V CV and Gate standard, making it a natural companion to the MS-20 or the SQ-10 sequencer.

  Despite being a single-VCO monophonic instrument, the MS-50 packs significantly more routing options than its siblings. It features both highpass and lowpass VCFs, two ADSR envelope generators, a ring modulator, a voltmeter, and sample and hold — all accessible through an extensive patch bay using standard connectors.

  The combination of pink and white noise generators alongside the single oscillator provides a broader tonal palette than the spec sheet might suggest. When patched creatively, the MS-50 can produce everything from thick bass tones to complex percussive textures and experimental sound design.

  The MS-50 represents the most modular-oriented thinking in Korg's compact MS line, bridging the gap between their affordable semi-modular synths and larger fully modular systems. It has been used by The Chemical Brothers among others.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with pink and white noise
  - LFO: 1
  - Filter: 2 VCFs (highpass and lowpass)
  - Envelope: 2 ADSR envelope generators
  - Extras: Ring modulator, voltmeter, sample and hold
  - Keyboard: None (expander module)
  - Memory: None
  - Control: CV/Gate (Hz/V)
releaseDate: "1978"
