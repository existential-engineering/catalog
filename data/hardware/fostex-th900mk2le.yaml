name: TH900mk2LE
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th900mk2le/
description: Premium closed-back dynamic headphones made in Japan, a simplified
  packaging edition of the TH900mk2. Features traditional Japanese Bordeaux
  urushi lacquer finish on premium Mizume-zakura wood housing by Sakamoto Otsuzo
  Shoten, a 50mm Biodynamic diaphragm driver with 1.5 Tesla magnetic flux
  density, low-rebound protein leather ear pads, and a 7N grade high-purity OFC
  cable. Excludes the headphone stand and uses reduced packaging materials
  compared to the standard TH900mk2.
details: |-
  Fostex's highest-rated lacquer-finished housing is featured in these high-end closed-back headphones. The lacquer and Bordeaux finished housing delivers premium sound quality and the joy of ownership. These closed-back stereo headphones feature a driver unit with 1.5 Tesla magnetic flux density, a BioDynamic diaphragm, and a 7N OFC cable with optimized wire diameter. This product is the simplified packaging edition of the TH900mk2, it does not include a headphone stand, and the included cable is 2 m with PVC sheathing, the same cable as the TH910.

  The housing cover carries a lacquered Bordeaux finish crafted by Sakamoto Otsuzo Shoten, a company with 110 years of history, giving a premium feel befitting a Made in Japan product. The housing is crafted from premium Mizume-zakura wood, renowned for its fine, dense grain, hardness and beautiful surface finish.

  The magnetic circuit with a repulsive magnetic field incorporates a 50 mm driver unit with a magnetic flux density of 1.5 Tesla, delivering an expansive dynamic range with low distortion.

  The diaphragm employs Biodyna technology, delivering rich sound in the ultra-low frequencies, a natural midrange, and high frequencies reproduced with excellent presence. Bio-cellulose fiber is produced using advanced biotechnology, each fiber being 20 to 50 nm in diameter, roughly one thousandth the thickness of natural plant fibers such as cotton, with high purity alpha-cellulose and the highest level of crystallinity.

  The headphones include a 7N (99.99999%) grade high-purity OFC unbalanced cable. The ear pads feature protein leather and low-rebound cushioning, incorporating egg-derived protein for a pleasant feel against the skin, and achieve a 60% weight reduction compared to genuine leather.
specs: |-
  - Model: Closed-back dynamic type
  - Driver: 50 mm neodymium magnet / Biodynamic diaphragm
  - Playback frequency range: 5 to 45,000 Hz
  - Impedance: 25 ohm
  - Sensitivity: 100 dB/mW
  - Maximum input: 1,800 mW
  - Weight of main unit: Approx. 390 g (excluding cord)
  - Housing: Mizume cherry wood with lacquered Bordeaux finish
  - Cable: 3.5 mm (2-pole) mini plug x2 (L, R) to 6.3 mm gold-plated stereo plug, 7N (99.99999%) grade high-purity OFC, 2 m x1
  - Accessories: Leather-like pouch
  - Simplified packaging edition, no headphone stand included
  - Replacement ear pads: EX-EP-91
  - Complies with the European RoHS Directive
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
