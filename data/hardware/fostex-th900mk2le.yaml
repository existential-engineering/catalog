description: Premium closed-back dynamic headphones made in Japan, a simplified
  packaging edition of the TH900mk2. Features traditional Japanese Bordeaux
  urushi lacquer finish on premium Mizume-zakura wood housing by Sakamoto Otsuzo
  Shoten, a 50mm Biodynamic diaphragm driver with 1.5 Tesla magnetic flux
  density, low-rebound protein leather ear pads, and a 7N grade high-purity OFC
  cable. Excludes the headphone stand and uses reduced packaging materials
  compared to the standard TH900mk2.
details: |-
  Features:
  - Bordeaux urushi lacquer-finished housing by Sakamoto Otsuzo Shoten
  - Premium Mizume-zakura wood housing
  - 50mm Biodynamic diaphragm driver
  - 1.5 Tesla magnetic flux density
  - Protein leather ear pads with low-rebound cushioning (60% weight reduction vs. genuine leather)
  - 7N grade high-purity OFC cable
  - Simplified packaging edition of TH900mk2 (no headphone stand)

  Weight: Approx. 390 g (excluding cable)

  Accessories: Leather-like pouch
