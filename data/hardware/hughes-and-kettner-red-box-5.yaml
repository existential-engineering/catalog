  loose/tight response of the cabinet.
details: |-
  The Red Box 5 is the latest version of the award winning speaker simulation, now with new filtering options for small/large housings, modern/vintage speakers, and loose/tight response of the cabinet.

  The Red Box does not sound like a mic'ed cab, it sounds like the cab itself. Thanks to this clear, direct sound, a Red Box will endear you to every seasoned PA tech and studio engineer. The secret behind many of today's best sounding guitar tracks is that they are double-tracked with a microphone and a Red Box, or that the pure Red Box signal is run through microphone and room emulating software plug-ins, enabling a mix of ambience and ultra-direct attack.
specs: |-
