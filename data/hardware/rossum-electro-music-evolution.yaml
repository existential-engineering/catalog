description: A variable character analog ladder filter for Eurorack based on the
  classic Moog/E-mu 2100 ladder topology, with voltage-controllable pole count,
  drive, and resonance.
details: |-
  At the core of the EVOLUTION Variable Character Ladder Filter is Dave Rossum’s enhancement of the iconic Moog ladder filter from the original E-mu Systems 2100 LPF module (which, incidentally, Dave counts as his favorite sounding of all of the analog filters he designed). For EVOLUTION , Dave has designed new capabilities that not only allow you to dial in all of the outstanding qualities of the original 2100, but combine to let you create the sonic characteristics of a wide variety of other filter types. They include: Taken together, EVOLUTION gives you everything from the platonic ideal of the classic ladder filter to a vast selection of alternative filter characteristics. And like all Rossum Electro-Music modules, it’s solidly built, with machined aluminum knobs and high quality components throughout. Evolution Quickstart Guide (PDF) Evolution Owners Manual (PDF)
specs: |-
  - A Genus control that allows continuous voltage control of the number of filter poles (from 3 to 6 poles), essentially allowing real-time variation of Evolution’s effective cutoff slope from 18dB/oct to 36dB/oct. LEDs give continuous indication of the current slope.
  - A Species control that lets you vary the signal level into the ladder, letting you control the intensity of the filter’s characteristic distortion. When in self-oscillation mode, this control modulates the amplitude of Evolution’s output.
  - Voltage controlled resonance with a variable Q Level Compensation control that controls the balance of the resonant peak and the frequencies below the cutoff frequency (which would otherwise be attenuated as the resonance is increased).
  - An extremely accurate and temperature-stable frequency control exponential generator (accurate over 10 octaves), rivaling the specifications of the best analog VCOs.
