description: Miniature boundary microphone with a half-cardioid polar pattern
  and built-in equalization, designed for video conferencing, boardrooms,
  classrooms, and houses of worship. The ultra-thin profile and integrated pop
  filter deliver natural, intelligible speech pickup directly from a tabletop or
  podium surface.
details: >-
  The Electro-Voice RE90B is a miniature boundary layer microphone built around
  a back-electret condenser element with a half-cardioid pickup pattern. It is
  intended for installed-sound speech reinforcement and conferencing
  applications such as boardrooms, classrooms, courtrooms, and houses of
  worship, where it sits unobtrusively on a flat surface and captures talkers
  across the table or platform.


  The housing is just 16 mm tall, with a footprint of 94 mm by 123 mm, and uses
  a die cast zinc case with a non-reflective black finish for low visual profile
  on a conference table or lectern. A rubber non-slip bottom pad keeps the mic
  in place on smooth surfaces, and a strong steel screen with an integrated pop
  filter protects the capsule from plosives and physical contact. A white-finish
  variant, the RE90BW, is available for installations where black is not
  desirable.


  The microphone operates from standard 9 to 52 V phantom power and delivers a
  low-impedance balanced output (200 ohms) on a 3-pin XLR connector, making it a
  drop-in source for any professional mixer, audio matrix, or DSP-based
  conferencing system. Built-in equalization tailors the response of the capsule
  for clear speech pickup over the 80 Hz to 15 kHz range.
specs: >-
  - Mic type: Boundary

  - Element: Condenser (back-electret)

  - Polar pattern: Half-cardioid

  - Frequency response (-3 dB): 80 Hz - 15,000 Hz

  - Power requirement: 9-52 VDC phantom

  - Impedance (low-Z balanced): 200 ohms

  - Open circuit voltage: 25 mV

  - Connector: 3-pin XLR

  - Wired/wireless: Wired

  - Height: 16 mm

  - Width: 94 mm

  - Depth: 123 mm

  - Net weight: 0.358 kg

  - Case material: Die cast zinc

  - Finish: Non-reflective black (RE90BW available in white)

  - Features: Built-in equalization, integrated pop filter, strong steel screen,
  rubber non-slip bottom pad
