description: A do-it-all analog drive, filtering, and fuzz pedal built around
  Benson amplifier circuitry, featuring variable diode clipping, resonant
  routable mids, two fuzz modes, motorized faders, and 30 internal presets with
  MIDI/CV/expression control.
details: |-
  Preamp MKII is a do-it-all analog drive, filtering, and fuzz pedal built in collaboration with Benson Amps. The circuit is based on the Benson Chimera tube amp front-end, recreated using FET transistors for an all-analog signal path.

  Variable diode clipping offers three options — transistor-only, silicon, and germanium — each providing distinct harmonic character. Resonant routable mids allow precise frequency shaping.

  Two fuzz modes are available: Open (classic, powerful) and Gated (squished, zippy). Input impedance is 1 Megaohm, switching to low impedance when fuzz is engaged.

  As part of the Automatone series, the Preamp MKII features motorized faders for precise and recallable control. It includes 30 internal presets, MIDI support, CV and expression control, and DIP switches for further customization.
specs: |-
  - All-analog signal path
  - Benson Chimera tube amp circuit (FET recreation)
  - Variable diode clipping: Transistor-only, Silicon, Germanium
  - Two fuzz modes: Open, Gated
  - Resonant routable mids
  - Motorized faders (Automatone series)
  - 30 internal presets
  - Mono I/O
  - True bypass
  - MIDI, CV, Expression control
  - DIP switches for customization
  - Power: 9V Center Negative, ~500mA
  - Dimensions: 5.75" x 6.5" x 2.5"
