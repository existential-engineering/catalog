  - utility
url: https://www.befaco.org/hexmix-vca/
description: Hexmix VCA is a compact six channel VCA with a unique response
  curve range from logarithmic to linear and to exponential using a pot. All
  outputs are routed to output six to act as a mixer, with a normalization of
  each one to remove each channel from the Mix.
details: |-
  The Hexmix VCA is a 6-channel voltage-controlled amplifier module designed for Eurorack modular synthesis systems. Each channel features an adjustable response curve that spans from logarithmic to linear to exponential, selectable via a single potentiometer per channel.

  All six channel outputs are normalized together into output six, allowing the module to function as a VCA-equipped mixer. Individual channels can be broken out of the mix by patching into their dedicated output jacks, which removes them from the summed output.

  The module features normalized inputs that default to 10 volts when no CV signal is present, enabling it to be used as a straightforward level-controlled mixer without requiring a separate CV source. Each channel also has a dedicated level potentiometer for manual control.

  Hexmix VCA is part of Befaco's Hexmix ecosystem and can be connected to other Hexmix VCA units via an expander connection, allowing for larger mixing configurations. The front panel is made from heat-treated aluminum and the module is manufactured in Barcelona.
