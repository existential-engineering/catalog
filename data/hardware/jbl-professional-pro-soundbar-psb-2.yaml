details: |-
  The JBL Professional Pro SoundBar PSB-2 is a 2.0 channel commercial-grade soundbar designed for hospitality, education, and meeting space applications. Its front-facing speaker configuration is optimized for human speech intelligibility while minimizing sound bleed to adjacent rooms — a critical requirement in hotel and stateroom deployments.

  To support the most popular sources, HDMI and Bluetooth digital inputs are included, and a single source control button on the top of the unit makes switching between sources simple. Automatic Bluetooth pairing management allows the PSB-2 to unpair and forget devices after a configurable time, keeping future pairing available. The Bluetooth beacon ID can also be customized to match the room it is installed in — useful when managing multiple units across a property.

  The PSB-2 supports HDMI CEC control, allowing the soundbar to control TV power, mute, and volume without additional setup. It can be configured for audio passthrough from the source device to the TV or for ARC audio directly from the TV, offering flexible integration with display equipment.

  Powered by a Class D amplifier delivering 20W per channel, the PSB-2 drives two 19mm soft dome tweeters and four 51mm low-frequency drivers, achieving a peak SPL of 101 dB at 1 meter and a frequency range of 62 Hz–20 kHz. Its injection-molded ABS and polycarbonate enclosure is built for durability and easy cleaning in commercial environments.
specs: |-
  - Frequency Range (-10 dB): 62 Hz – 20 kHz
  - Frequency Response (±3 dB): 100 Hz – 20 kHz
  - Maximum Peak SPL: 101 dB-SPL at 1m
  - HF Drivers: 2 × 19mm Soft Dome Tweeters
  - LF Drivers: 4 × 51mm Low-Frequency Drivers
  - Power Amplifier: 20W per channel, Class D
  - Connectivity: HDMI 2.1 Input, HDMI 2.1 Output/ARC, Bluetooth 5.3
  - CEC: TV power, mute, and volume control
  - Dimensions: 90 × 897 × 63 mm (3.54 × 35.3 × 2.48 in)
  - Weight: 2.0 kg (4.4 lbs)
  - Enclosure: Injection-Molded ABS + PC, Black
