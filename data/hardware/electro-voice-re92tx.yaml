description: Miniature professional-quality cardioid electret condenser lavalier
  microphone terminated with a TA4F connector for use with Electro-Voice
  wireless bodypack transmitters. The directional capsule and integrated 6-foot
  cable suit presentations, houses of worship, broadcast, and theater
  applications.
details: >-
  The Electro-Voice RE92Tx is a miniature lavalier microphone designed for
  speech reinforcement and broadcast applications where directional pickup is
  preferred over an omnidirectional capsule. Its cardioid polar pattern rejects
  sound arriving from the rear, helping reduce feedback and ambient noise pickup
  in houses of worship, conference rooms, and theaters.


  At the heart of the microphone is a back-electret condenser element with a
  cardioid polar pattern, capable of handling up to 135 dB SPL at 1 percent THD
  with an open-circuit sensitivity of 5.6 mV. Current consumption is less than
  500 microamps, keeping demand on the host transmitter's battery minimal. The
  metal capsule has a non-reflecting black finish to remain visually unobtrusive
  on camera or under stage lighting.


  The microphone is terminated with a 6-foot (180 cm) integrated cable and a
  TA4F mini-XLR connector that mates directly with all Electro-Voice bodypack
  wireless transmitters. For wired XLR applications, the same TA4F termination
  can be paired with the EV TXA adapter to convert the lavalier to a
  phantom-powered 3-pin XLR output. The capsule measures 24 mm in diameter and
  10.5 mm in height and weighs just 23 g.
