details: |-
  The 354ce is a 12-string acoustic-electric built around the Grand Auditorium body with Venetian cutaway, part of Taylor's 300 Series. It pairs a solid Sitka spruce top with solid sapele back and sides for bold midrange character with articulate note definition across all 12 strings.

  Taylor's V-Class bracing improves volume, sustain, and intonation compared to traditional X-bracing. The Neo-Tropical Mahogany neck with West African Crelicam Ebony fretboard provides a smooth playing feel at a 1-7/8" nut width and 25-1/2" scale length.

  Expression System 2 behind-the-saddle electronics capture the natural acoustic resonance for amplified performance. The guitar ships with a deluxe hardshell case.
specs: |-
