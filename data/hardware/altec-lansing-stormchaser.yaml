details: |-
  Be prepared in the event of severe weather or other natural disasters with the Altec Lansing StormChaser Emergency Weather Speaker. This speaker features a hand crank, a 10-hour rechargeable lithium-ion battery and solar energy options, keeping you connected if the power goes out or you're away from an electrical outlet. The StormChaser charges devices so you can make calls when in need. A built-in flashlight, emergency lights and area panel light bring assistance when in distress. NOAA Weather & S.A.M.E Alerts sound when severe weather is issued on local channels. A built-in AM/FM tuner and Bluetooth capabilities allow you to enjoy music wherever you go. Designed with a carry handle for ultra-portability during everyday use.
