details: |-
  The 7U Audio Jacks Board v2 is the second-generation audio jacks board that comes pre-installed in every Intellijel 7U case manufactured since early 2019, and is also sold standalone for owners of older 7U cases who want to upgrade.

  The board holds four Neutrik TRS jacks, each of which can be independently configured as an input or an output depending on which modules are connected.

  The board is passive and is not compatible with the newer 7U Performance Case Gen-2, which uses its own audio/MIDI board.
specs: |-
  - Power: Passive
  - 4x Neutrik TRS jacks, each independently configurable as input or output
  - 2021 revision uses a black PCB
  - Not compatible with the 7U Performance Case Gen-2
