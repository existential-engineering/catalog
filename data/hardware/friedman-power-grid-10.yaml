description: The Power Grid 10 is an isolated, high-current 9V pedal power
  supply with ten outputs and a universal 100-240Vac input. Its housing doubles
  as a riser, so pedals can be mounted on top of it.
details: |-
  The Power Grid 10 was designed to address the deficiencies Dave Friedman encountered with power supplies from other brands over 27 years of designing and building pedal boards for touring guitarists and studio producers. It is aimed at any player who wants a dead quiet pedal board that can be taken anywhere and is tour ready.

  Universal power from 100-240Vac means it can be plugged in anywhere in the world, with no switches to flip and no step-up or step-down transformer to worry about.

  The supply produces no field hum, which plagues many other power supplies built around traditional toroidal transformers. Ten isolated outputs deliver 350mA each at 9Vdc, enough for virtually any pedal, and all the cables needed to power them are included.

  For boards with no room to mount a power supply underneath, the Power Grid 10 was designed as a riser, so pedals can be mounted right on top of the housing. That includes fuzz pedals, which are known to cause proximity hum that infiltrates other pedals.
specs: |-
  - Isolated high current 9V pedal power supply
  - 10 isolated outputs, 350mA per output at 9Vdc
  - Universal input, 100-240Vac
  - No field hum
  - Housing doubles as a pedalboard riser
  - Included cables: 2 x 2.1mm black connector to 2.5mm blue connector, reversed polarity, 20 inches, right angle connector both ends
  - Included cables: 10 x 2.1mm black connector to 2.1mm black connector, regular polarity, 20 inches, right angle connector
  - Dimensions: 4.5 inches x 6.75 inches x 1.75 inches
  - Weight: 1.5 lbs
