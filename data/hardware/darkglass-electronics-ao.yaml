details: |-
  The Alpha Omega is a collaborative bass distortion pedal co-designed by Darkglass Electronics and bassist Jon Stockman. This fully operational-amplifier-based unit features two distinct distortion circuits, Alpha and Omega, that can be selected or blended using the Mod knob. The Alpha circuit delivers punchy, tight tone with definition, while Omega provides a more aggressive, raw character.

  The pedal offers extensive tone-shaping through a 3-band active equalizer (Bass, Mid, Treble at plus or minus 12 dB), plus dedicated Bite (high-mid boost at 2.8 kHz) and Growl (bass shelving boost) controls. A Blend knob mixes clean and processed signals independently, allowing users to layer their original tone with the distorted effect. This combination of controls and toggle switches makes it the most flexible among Darkglass's designs.

  The unit is compact and portable, measuring 94 mm x 120 mm x 30 mm and weighing 320 g. It draws 30 mA and requires a regulated 9V DC center-negative power adapter. Connectivity includes a 1/4-inch input and output, a parallel output passthrough, and a balanced XLR direct output with ground lift.
specs: |-
  - Two distinct distortion circuits (Alpha and Omega), selectable or blendable via Mod knob
  - 3-band active EQ (Bass, Mid, Treble; +/-12 dB)
  - Bite (high-mid boost at 2.8 kHz) and Growl (bass shelving boost) controls
  - Blend knob mixes clean and processed signals
  - Balanced XLR direct output with ground lift
  - Parallel output passthrough for parallel processing
  - Requires regulated 9V DC center-negative supply (30 mA)
  - Dimensions: 94 mm x 120 mm x 30 mm; weight 320 g
