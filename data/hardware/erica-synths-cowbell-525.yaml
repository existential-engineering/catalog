description: Erica Synths Cowbell module is an extended, modular version of
  Yocto (808) cowbell. For more sonic versatility we have added Tune and Decay
  controls, as well as Tune CV with an attenuator for nice vibratos.
details: |-
  Cowbell is an extended, modular version of the Yocto (808) cowbell, developed in collaboration with the French company e-licktronic. Erica Synths added Tune and Decay controls for more sonic versatility, along with a Tune CV input and attenuator for vibratos.

  Tune can be set by hand or voltage controlled, and decay reaches from 120ms to 1100ms. A manual trigger button fires the voice from the panel, and an accent input raises the level of individual hits.

  The trigger input responds to a 5V pulse of about 1ms and the accent input takes up to 10V. The audio output swings between -5V and +5V and CV inputs take a full span of -5V to +5V.

  The module is 6HP wide and draws 14mA from the +12V rail and 10mA from the -12V rail.
specs: |-
  - Manually and CV controlled tune
  - Decay control
  - Manual trigger
  - Accent input
  - Decay range: 120ms to 1100ms
  - Audio output level: -5V to +5V
  - CV level (full span): -5V to +5V
  - Trigger level: 5V
  - Trigger time: 1ms
  - Accent CV level: 10V
  - Power consumption: 14mA@+12V, 10mA@-12V
  - Module width: 6HP
  - Module depth: 40mm
