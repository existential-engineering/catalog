description: 10-inch two-way passive loudspeaker from the Electro-Voice ELX200
  Series, delivering 1200 W peak / 127 dB peak SPL through a high-output EVS-10M
  woofer and DH-1L titanium compression driver behind EV's Signal Synchronized
  Transducers (SST) waveguide for consistent 90 x 60 degree coverage.
details: >-
  The ELX200-10 is the 10-inch passive model in Electro-Voice's ELX200 Series of
  portable loudspeakers. It pairs a high-output EVS-10M 254 mm (10 in)
  low-frequency driver with a DH-1L 1-inch exit titanium compression driver on a
  1.4-inch diaphragm, crossed over at 2 kHz behind EV's patented Signal
  Synchronized Transducers (SST) waveguide that produces uniform 90 degree
  horizontal by 60 degree vertical coverage with minimal distortion.


  The low-profile polypropylene composite enclosure is engineered to balance
  weight, manageability and structural integrity, and includes three M10
  threaded suspension points for use with forged eyebolts. An integrated
  pole-mount socket and the ZLX-style dual-handle design support portable use,
  and the cabinet is offered in black or white finishes with an 18 AWG
  powdercoated steel grille. EV validates the series with over 500 hours of
  accelerated abuse testing, exceeding four times typical industry standards.


  As a passive loudspeaker the ELX200-10 requires external amplification, with
  signal connected via dual Neutrik NL4 Speakon connectors (one input, one
  parallel through) on the rear panel.
specs: |-
  - Configuration: 2-way passive loudspeaker
  - LF driver: EVS-10M 254 mm (10 in) woofer
  - HF driver: DH-1L 1.4-inch titanium compression driver (1-inch exit)
  - Crossover frequency: 2 kHz
  - Recommended high-pass filter: 55 Hz
  - Frequency response (-3 dB): 65 Hz - 20 kHz
  - Frequency range (-10 dB): 49 Hz - 22 kHz
  - Maximum SPL: 127 dB peak
  - Power handling: 300 W continuous / 1200 W peak
  - Nominal impedance: 8 ohms (7.2 ohms minimum)
  - Axial sensitivity: 90 dB SPL (1 W @ 1 m)
  - Coverage pattern: 90 degrees H x 60 degrees V (nominal -6 dB)
  - Waveguide: EV Signal Synchronized Transducers (SST)
  - Connectors: Dual NL4 Speakon (input + parallel)
  - Enclosure: Polypropylene composite
  - Grille: 18 AWG steel with powdercoat
  - Finish: Black or White
  - Suspension: Three M10 threaded points for forged eyebolts
  - Mounting: Integrated pole-mount; ZLX dual-handle design
  - Dimensions (H x W x D): 531 x 330 x 319 mm
  - Net weight: 13.4 kg
  - Shipping weight: 15.3 kg
