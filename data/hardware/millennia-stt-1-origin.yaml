description: The STT-1 Origin is a single-channel recording channel strip in a
  19 inch rack chassis, combining twin microphone preamplifiers, a
  mastering-grade parametric equalizer, an optoelectronic compressor and limiter
  and a de-esser. Twin Topology switches each stage between a vacuum tube path
  and a discrete solid state path, giving over 130 signal topologies.
details: |-
  The STT-1 Origin is a recording channel strip whose every stage is doubled, so more than 130 signal topologies can be selected. The microphone preamplifier is either an M-2B vacuum tube design or an HV-3 discrete solid state design, the parametric equalizer is the NSEQ-2 circuit in vacuum tube or discrete solid state form, and the line level path can likewise be tube or solid state. Input coupling runs with or without the MIT-01 audio transformer, and a 1/4 inch vacuum tube DI input can be routed through either gain path.

  Dynamics are optoelectronic, with three compressor and limiter paths, TCL vacuum tube, discrete solid state and passive, alongside twin de-esser paths in vacuum tube or discrete solid state form. The de-essing frequency switch offers off, 4.9 k, 6.8 k, 8.2 k, 10.7 k and 12.0 k, and a true audio VU meter reads either output level or dynamics gain reduction.

  The parametric equalizer gives plus or minus 15 dB of boost and cut across 21 detented steps, with peak or shelf selectable low and high ranges, sweepable low mid and hi mid bands with a 10X range switch, and a Q range of 0.4 to 4.0 on the middle ranges. The compressor runs from a threshold of infinity to +20 dBu at ratios from 1.4:1 to 30:1, with attack from 2 to 100 ms and release from 80 ms to 3 seconds.

  Construction includes gold audio connectors, tube sockets, relays and switches, a 3/8 inch thick radius extruded aluminium face plate with a laser-etched anodized finish, a 16 gauge cold-rolled steel chassis, hand machined aluminium knobs with illuminated push-buttons and a toroid power supply on an internal sub-chassis. Assembly is in Northern California.
specs: |-
  - Twin Topology Mic Preamplifier Selection: Switchable, vacuum tubes or solid-state
  - Twin Topology EQ and Compressor: Switchable, vacuum tubes or solid-state
  - Twin Topology Input Coupling: Switchable, transformer or transformerless
  - Maximum Output Level (Balanced): +32 dBu
  - Frequency Response (+0 / -3 dB, S/S): sub 5 Hz to beyond 300 kHz
  - Equivalent Input Noise: -131 dBu (SS, common source, direct out)
  - THD + Noise (20 Hz to 22 kHz, S/S): < 0.05%, typ < 0.003%
  - Common Mode Rejection Ratio (S/S): > 40 dB, typ > 70 dB at 60 Hz
  - Input Impedance (Mic): 6,200 ohms
  - Input Impedance (Line): 2,200 ohms (x2)
  - Input Impedance (DI, Instrument): > 1 megohm
  - Output Impedance (Balanced): 24.3 ohms (x2)
  - Maximum EQ Boost/Cut Range (21 Step Detented): +/- 15 dB
  - EQ Low Range Switch Centers (Peak/Shelf Selectable): 20, 34, 56, 100, 180, 270 Hz
  - Low Mid Sweep: 20 Hz to 220 Hz or 200 Hz to 2.2 kHz, 10X range switch selectable
  - Hi Mid Sweep: 250 Hz to 2.5 kHz or 2.5 kHz to 25 kHz, 10X range switch selectable
  - High Range Switch Centers (Peak/Shelf Selectable): 4.8 k, 5.8 k, 8.0 k, 10 k, 16 k, 21 k
  - "Q" Range: Q = 0.4 to 4.0 adjustable on middle ranges, Q = 1.0 fixed on low and high ranges
  - Compressor Threshold Range: Infinite to +20 dBu
  - Compressor Attack Range: 2 ms to 100 ms
  - Compressor Release Range: 80 ms to 3.0 s
  - Compression Ratio Range: minimum 1.4 : 1, maximum 30 : 1
  - De-Essing Frequency Switch: OFF, 4.9 k, 6.8 k, 8.2 k, 10.7 k, 12.0 k
  - Power Consumption: 50 watts maximum
  - Power Requirements: Selectable 100-120, 200-240 V ac, 50/60 Hz
  - Environmental: 0 to +40 C / +32 to +104 F, 10% to 80% RH, maximum altitude 3,000 meters
  - Dimensions/Shipping Weight: 19 in W x 3.5 in H x 15.5 in D, 25 lbs
