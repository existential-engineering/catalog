description: A stunning summit of modern Charvel vibe, power and performance,
  the Pro-Mod So-Cal Style 2 24 HH HT CM features an alder body with a scalloped
  lower back bout and shredder's cut heel for easier upper fret access. A
  graphite-reinforced bolt-on caramelized maple neck supports a 24-fret
  caramelized maple fingerboard, while Fishman Fluence Open Core pickups deliver
  layered, dynamic tone with multiple voicing options.
details: |-
  The Pro-Mod So-Cal Style 2 24 HH HT CM pairs an alder body in a Satin Black finish with a bolt-on caramelized maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. The body includes a scalloped lower back bout and shredder's cut heel for easier upper fret access.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets and 4mm pearloid dot inlays, anchored by a Graph Tech TUSQ XL nut (1.6875" width) and a 25.5" scale length. Luminlay side dots and a heel-mount truss rod adjustment wheel round out the neck, which terminates in a reverse licensed Fender Telecaster headstock.

  Electronics are built around dual Fishman Fluence Open Core PRF-COC humbuckers in black, routed through a 3-position blade pickup switch, master volume, and master tone with push/pull activation. A 2-way mini toggle provides Voice 1/Voice 2 switching for the Fluence pickups.

  Hardware is finished in black throughout, including a Charvel HT6 string-through-body hardtail bridge with brass saddles, Charvel-branded die-cast locking tuning machines, dome-style control knobs, and a 1-ply black pickguard.
