description: Handheld headset microphone enhancer and vocal effects processor
  for gaming consoles, Android, iOS, PC and Mac. It connects over USB as a
  digital audio interface or over a 1/8 inch TRRS cable to a console controller
  or phone.
details: |-
  FUSE is a handheld processor that sits between a headset and a host, enhancing the headset microphone and adding vocal effects before the audio reaches a stream or a party chat. It is aimed at gaming consoles, mobile phones, PC and Mac.

  It connects two ways. Over USB it works as a digital audio interface for a computer or a PlayStation console, and over a 1/8 inch TRRS cable it plugs into the headset jack of a console controller or a phone. The two connections are not meant to be used at the same time, since doing so can introduce ground loop noise.

  A headset with a single TRRS connector plugs into the headphone/headset jack. A split-connector headset uses that same jack for its headphones and the auxiliary microphone input for its microphone, so no headset adapter is needed, and a lavalier microphone can use the auxiliary input in the same way.

  Four buttons cover megaphone distortion, a mute whose tone presets combine equalization and gate settings, pitch shift with auto-tune, and echo. Two touch sliders set headphone level and the balance between microphone and game audio, each with its own LED segment display. The unit is battery powered from an internal rechargeable cell charged over USB.
specs: |-
  - Megaphone distortion, pitch shift with auto-tune, and echo effects, each with selectable presets
  - Tone presets combining equalization and gate settings, selected from the mute button
  - Mute button and censor (bleep) button for the microphone
  - Touch sliders for headphone level and microphone/game balance, with LED segment displays
  - Battery powered from an internal rechargeable cell, charged from a powered USB port, a USB charger or a computer
  - Charging LED and on-demand battery level readout on the slider displays
  - Selectable LED colour options, cycled from the power button
  - Supplied with a USB cable and a 1/8 inch TRRS cable
