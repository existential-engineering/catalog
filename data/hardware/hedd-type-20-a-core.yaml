name: TYPE 20 A-CORE
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-20-a-core
description: A 3-way active monitor with a pure analog signal path, the TYPE 20
  A-CORE brings extended headroom, depth, and full-range clarity to professional
  studios, mastering rooms, and discerning listeners.
details: |-
  The TYPE 20 A-CORE expands the A-CORE range into a larger three-way format, combining the premium components found in HEDD's MK2 monitors and Tower Mains system. It provides extended headroom and exceptional clarity suited to professional environments and demanding listeners.

  Every element is engineered for long-term accuracy, from the handcrafted Air Motion Transformer tweeter to the custom honeycomb composite woofers and amplification system. The design emphasizes reliability and precision without compromising quality.

  A standout feature is the pure analog signal path architecture with no DSP, software reliance, or converters. This analog-first design ensures low-latency performance and a natural signal path that translates truthfully in any environment. An analog filter board provides phase-coherent reproduction and continuously variable high/low shelving EQ (±6 dB) for room and taste adjustment.

  Built with multiple balanced and unbalanced input options, the TYPE 20 A-CORE prioritizes compatibility and convenience. Each unit is thoroughly tested before shipment and is designed for flexible Atmos installation.
specs: |-
  - Configuration: 3-way active monitor, pure analog signal path
  - Woofers: 7" and 4" honeycomb
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequencies: 250 Hz / 3,200 Hz
  - Frequency response: 32 Hz - 40 kHz
  - Maximum SPL: 120 dB per pair at 1 m
  - Amplification: 3 x 300 W ICEpower Class D (85-264 V)
  - Cabinet: heavy-duty MDF, black satin finish
  - Dimensions: 280 x 358 x 338 mm
  - Weight: 15.4 kg per unit
