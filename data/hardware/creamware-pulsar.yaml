description: >-
  A DSP-based music production environment on a PCI card with four SHARC processors, integrating
  modular synthesis, sampling, mixing, and effects processing with zero audible latency.
details: |-
  The Creamware Pulsar bridges the gap between traditional hardware synthesis and computer-based production. Built around a PCI card with four dedicated SHARC processors, it handles all audio processing independently of the host computer, delivering professional-grade synthesis, sampling, mixing, and effects with no audible latency and no CPU drain.

  The included modular synthesizer section offers over 100 freely connectable modules for custom sound design, along with a Waldorf 2-oscillator wavetable synthesis module. A professional digital sampler supports up to 64 stereo voices and accepts Akai-compatible sound CDs, complete with envelope and filter controls for detailed sample manipulation.

  At the core sits a 32-channel digital mixer featuring 4-band parametric EQ per channel, four effect insert slots, and eight auxiliary busses. The master section includes dithering from 24-bit to 16-bit for high-quality final output. The system accommodates 20 input channels for connecting external synthesizers, effects units, and other hardware as insertable modules within the Pulsar environment.

  I/O options include dual ADAT ports, S/PDIF, and analog connections, all operating at up to 24-bit/96kHz resolution. A total recall feature stores and retrieves complete setup configurations. The Pulsar was compatible with both PC and Mac systems, supporting MME and ASIO drivers.
specs: |-
  - Polyphony: Up to 20 voices (synthesis-dependent)
  - Sampler: Up to 64 stereo voices
  - Synthesis: 100+ modular components, Waldorf wavetable module
  - Mixer: 32-channel with 4-band parametric EQ
  - Effects: Delays, reverbs, limiting, compression, distortion
  - Resolution: 24-bit, 96kHz
  - I/O: 20 channels, 2x ADAT, S/PDIF, analog
  - Processors: 4 dedicated SHARC DSPs
  - Platform: PCI card (PC/Mac)
  - Drivers: MME, ASIO
