details: |-
  The AUDIX Novacore NCHH is a professional-grade UHF digital handheld transmitter built for vocalists, presenters, and performers. Constructed from durable aluminum with a black finish, it features an interchangeable "S" thread capsule mount compatible with AUDIX NCEC and NCTH Novacore capsules as well as other S-thread capsules, delivering the transient response and vocal clarity AUDIX microphones are known for in a fully wireless format.

  AES-256 encrypted digital transmission is synchronized to the receiver via one -touch IR sync. On-board controls — power switch, mute button, and internal SET/MODE buttons and lock switch located beneath the battery cover — provide access to input gain, low-cut filter, limiter, RF power level, mute mode, and encryption settings. All key parameters display on the front-panel LCD, with additional real-time parameters accessible through the MODE menu.

  The NCHH operates on 2× AA alkaline batteries or 1× NCLB rechargeable lithium-ion battery with 9+ hours of runtime. A built-in USB-C port supports direct cable charging, and the optional NCC2 charging station enables managed multi-unit charging workflows for venues with high weekly usage. Sold as body only; compatible capsule bundles available as NCHHEC and NCHHTH.
specs: |-
  - Type: UHF digital handheld transmitter (body only)
  - Capsule mount: interchangeable "S" thread (NCEC, NCTH, other S-thread capsules)
  - Encryption: AES-256
  - Controls: input gain, low-cut filter, limiter, RF power level, mute mode
  - Power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours
  - Charging: built-in USB-C
