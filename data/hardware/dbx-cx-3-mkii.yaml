  and distribution of audio signals.
details: |-
  The dbx CX-3 mkII is a discontinued professional audio signal routing unit from dbx's installed sound product line. An enhanced version of the CX-3, it was used in installed, portable, and touring applications for routing audio signals between sources and destinations.

  Full technical specifications are available in the CX-3 mkII Owner's Manual available from dbx.
