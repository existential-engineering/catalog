description: Ultra limited Custom Shop edition of the Dark Side workstation,
  combining analog fuzz with a multi-head tape delay and four modulation effects
  in one stompbox.
details: |-
  The Dark Side is a workstation pedal built from three parts: fuzz, delay and modulation. This is the ultra limited Custom Shop Dank Side edition of it. The fuzz side is a big fuzz style distortion based on a 1977 op-amp design, related to the one used in the Psi Fuzz but reworked extensively to recover the nuances of earlier transistor-based fuzzes. Gain is set low to suit the period and style, giving a more transparent big fuzz that sustains while keeping the character of the guitar, single coil or humbucker.

  The delay and modulation side is selectable between a multi-head tape delay effect and a combination of four modulation sounds. The delay offers twelve syncopated settings, rhythmic and voiced after old spinning drum tape delays, with subtle filtering for the warmth of the original machines and subtle modulation in the repeats. The number of repeats can be controlled from an expression pedal, including into feedback oscillation.

  The modulation section has four parts: flanger, rotary speaker cabinet, uni-vibe and phaser. The flanger and rotary cabinet can be blended against each other, as can the opto-coupler based uni-vibe and the phaser. The rotary is voiced slightly differently from the one in the Monterey and is more chorus-like, the flanger differs from the one hidden in the Bubble Tron, and the uni-vibe is deeper and more intense.

  An expression pedal port takes a TRS style expression pedal and allows adjustments on the fly. Newer units carry a push button switch to change the order of the effects; older units instead have a TRS insert for patching another pedal between the fuzz and the delay and modulation side. At the centre of the pedal is a hand built board carrying the analog fuzz and a 24-bit DSP engine, with the whole unit hand assembled and soldered.
