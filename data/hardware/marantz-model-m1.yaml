description: |-
  The Marantz Model M1 is a 2-channel wireless streaming amplifier powered by HEOS, delivering 100W per channel (8Ω) in a compact Class D design. Engineered with Japanese craftsmanship from Shirakawa, it combines high-performance amplification with seamless access to smart music sources and movies. HDMI eARC support enables easy TV connection with Dolby Digital+ processing, while integrated HEOS, AirPlay 2, Spotify Connect, and Bluetooth provide flexible streaming options.

  The M1 supports a wide range of audio formats including DSD, FLAC, ALAC, and WAV at up to 24-bit/192kHz. Sound modes include Stereo, Direct, Virtual, Dialog Enhancer, and Night Mode, with adjustable bass, treble, balance, and high/low pass filters. The compact chassis (8.54" × 9.41" × 3.31") makes it ideal for desktop or shelf placement while delivering room-filling sound through 4-16Ω speakers.
details: |-
  The MODEL M1 is a wireless streaming amplifier engineered with performance and versatility in mind. Compatible with music streaming via HEOS and easily linked to your TV, it delivers powerful, high-quality amplification in a compact design, allowing seamless access to smart sources for music and movies with precision and ease.

  MODEL M1's 100W per channel of high-quality, low-distortion amplification delivers pristine sound anywhere, while a subwoofer output delivers room-filling scale in larger spaces.

  However you choose to stream your high-resolution music, MODEL M1 has you covered, with support for HEOS, AirPlay 2, Bluetooth, Spotify Connect, and more. The expansive feature set yet diminutive size of M1 makes it the ideal partner for multi-room listening.

  Marantz Musical Digital Filtering is a unique and sophisticated digital filtering technology that reveals the natural detail and tonality in sound.

  Unveil superb sound from movies and TV programs with MODEL M1 using HDMI eARC and onboard Dolby Digital+ processing. Crafted in Shirakawa, Japan.
specs: |-
  - 2.1 channels, Class D amplifier topology
  - Power amplifier rated output: 100 W + 100 W (8 ohm, THD 0.05%)
  - Power amplifier rated output: 125 W + 125 W (4 ohm, 1 kHz, THD 0.05%)
  - Frequency response: 20 Hz to 20 kHz, plus/minus 1 dB
  - Connected loudspeaker impedance: 4 to 16 ohm
  - Loudspeaker binding posts: 4-way binding posts
  - Digital inputs: HDMI (eARC), TOSLINK
  - analog inputs: RCA L/R
  - subwoofer out: RCA mono
  - Channel assignments: Stereo (default), Dual Mono
  - volume limit 80-100%
  - Adjustable high pass / low pass filters: 40-250 Hz / 40-120 Hz
  - EQ: bass and treble -5 dB to +5 dB
  - balance -15 dB to +15 dB
  - Sound modes: Stereo, Direct, Virtual, Dialog Enhancer, Night Mode
  - Decoding: Dolby Digital+, Dolby Digital, LPCM, DSD
  - Stereo file formats: WMA up to 192 kbps, AAC and MP3 up to 320 kbps, WAV, ALAC, FLAC up to 24-bit/192 kHz, DSD 2.8 MHz and 5.6 MHz
  - Bluetooth receive 4.2.X, AirPlay 2, Spotify Connect, HEOS built-in
  - Wired connectivity: Ethernet
  - wireless: dual band 802.11 a/b/g/n/ac
  - IR input: 3.5 mm
  - IR learning supported
  - Control system compatibility via TCP/IP: Crestron, Control4, AMX
  - User interface: volume up/down, play/pause, multi-coloured LED status indicator, rear Connect and Bluetooth buttons
  - Dimensions (W x D x H): 8.54 x 9.41 x 3.31 in (217 x 239 x 84 mm)
  - Weight: 4.84 lbs (2.2 kg)
