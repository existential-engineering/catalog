specs: |-
  - Rated output: 100W + 100W (8Ω, THD 0.05%)
  - Rated output: 125W + 125W (4Ω, 1kHz, THD 0.05%)
  - Amplifier class: Class D
  - Frequency response: 20Hz-20kHz ±1dB
  - Speaker impedance: 4-16Ω
  - Channels: 2.1
  - Channel assignments: Stereo (default), Dual Mono
  - Volume limit: 80-100%
  - Balance: -15dB to +15dB
  - High pass filter: 40-250Hz
  - Low pass filter: 40-120Hz
  - EQ: Bass and Treble -5dB to +5dB
  - Sound modes: Stereo, Direct, Virtual, Dialog Enhancer, Night Mode
  - Decoding: Dolby Digital+, Dolby Digital, LPCM, DSD
  - File formats: WMA (up to 192kbps), AAC/MP3 (up to 320kbps), WAV, ALAC, FLAC (up to 24-bit/192kHz), DSD (2.8MHz, 5.6MHz)
  - Bluetooth: 4.2 (receive only)
  - Streaming: AirPlay 2, Spotify Connect, HEOS
  - Music services: Pandora, Spotify, TuneIn, SiriusXM, Amazon Music, Tidal, Tidal HiRes, iHeartRadio, Deezer, Deezer HiFi
  - Wired networking: Ethernet
  - Wireless networking: Dual band 802.11 a/b/g/n/ac
  - Control: iOS, Android, Kindle Fire via HEOS app
  - Integration: Crestron, Control4, AMX via TCP/IP
  - HDMI eARC support
  - Dimensions: 8.54"W × 9.41"D × 3.31"H (217 × 239 × 84mm)
  - Weight: 4.84 lbs (2.2kg)
  - Color: Black
