description: |-
  The Marantz Model M1 is a 2-channel wireless streaming amplifier powered by HEOS, delivering 100W per channel (8Ω) in a compact Class D design. Engineered with Japanese craftsmanship from Shirakawa, it combines high-performance amplification with seamless access to smart music sources and movies. HDMI eARC support enables easy TV connection with Dolby Digital+ processing, while integrated HEOS, AirPlay 2, Spotify Connect, and Bluetooth provide flexible streaming options.

  The M1 supports a wide range of audio formats including DSD, FLAC, ALAC, and WAV at up to 24-bit/192kHz. Sound modes include Stereo, Direct, Virtual, Dialog Enhancer, and Night Mode, with adjustable bass, treble, balance, and high/low pass filters. The compact chassis (8.54" × 9.41" × 3.31") makes it ideal for desktop or shelf placement while delivering room-filling sound through 4-16Ω speakers.
details: |-
