url: https://www.mrblackpedals.com/products/black-ltd-distortion
description: A high-gain distortion with three simple controls, well suited to
  heavy playing, baritones, and bass guitars.
details: |-
  The Black LTD. Distortion is high-gain distortion with three simple controls
  and plenty of tone. Mr. Black calls it balls-out high-gain heaven and
  recommends playing it loud.

  It is especially well suited to heavy styles and is extra rad with baritones or
  bass guitars.

  The Black LTD. Distortion is a Jack Deville original design, produced as a
  limited run of 50 pedals.
specs: |-
  - High-gain distortion
  - Three simple controls
  - Well suited to heavy styles, baritones, and bass guitars
  - Limited run of 50 pedals
