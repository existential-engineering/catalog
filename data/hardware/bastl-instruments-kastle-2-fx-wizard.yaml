description: A compact patchable stereo multi-effects unit with USB MIDI,
  featuring nine distinct effect modes with extensive modulation capabilities
  including a built-in LFO, pattern generator, envelope follower, and tempo
  generator.
details: |-
  The Kastle 2 FX Wizard is a compact, patchable stereo multi-effects unit with nine distinct effect modes: Delay, Flanger, Freezer, Panner, Crusher, Slicer, Pitcher, Replayer, and Shifter. Each mode offers attenuverting modulation on Time, Feedback, and Amount parameters.

  The unit features a built-in LFO with triangle and pulse waveforms (synced or free-running), a pattern generator with gate/CV outputs, an envelope follower, and a tempo generator with tap tempo. USB MIDI input and output allow clock, note, and CC control.

  Stereo audio processing runs at 44kHz/16-bit with maximum delay time of 1.15 seconds stereo (firmware v1.1+). The input accepts signals up to 6Vpp with +12dB gain, and the headphone output supports up to 250 Ohm impedance.

  Powered by 3x AA batteries (15–18 hours) or USB-C. Open-source firmware allows user-programmable rhythms via the FX Wizard Chamber web app (v1.6+). Available as both a completed unit and a DIY kit. Includes 10 patch cables, a quickstart guide, and a sticker.
