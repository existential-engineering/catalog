specs: |-
  - JMP : Experience the raw power and punch of this iconic '70s rock amplifier.
  - AC Normal : Enjoy the chime and clarity that defined the British Invasion.
  - AC Top Boost : Revel in the enhanced treble and rich harmonics that made this amp a favorite among rock legends.
  - Three classic British amp voicings: JMP, AC Normal, and AC Top Boost
  - 25 watts of power with 24-volt power supply, 1 watt with 9-volt power supply
  - Two Cab Sims and FRFR mode on XLR Out and headphone out
  - Built-in reverb and effects loop
  - Compact, pedalboard-friendly design
  - Features - Up to 25 watts
  - 3 Classic Voices
  - 3 band EQ (Bass/Mid/Treble)
  - Gain
  - Limiter
  - Reverb
  - Effects Loop
  - Cab Sim
  - Headphone Out
  - Controls - Primary Controls
  - GAIN adjusts the distortion from clean to overdrive.
  - LIMITER reduces gain just enough to prevent overdrive, and then restores gain as the note dies away.
  - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies.
  - 3-Voice Switch: 1979 JMP, AC Norm and AC TOP Boost voicings.
  - Cab Sim Switch
  - Effects Controls
  - EFFECTS LOOP send and return jacks.
  - REVERB
  - Volume Controls
  - MASTER controls power amp volume as well as LINE OUT volume.
