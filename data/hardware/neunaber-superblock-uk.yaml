  mode, reverb, and effects loop.
details: |-
  Unleash the Power of Classic British Tones

  Introducing the Quilter SuperBlock UK, your ultimate pedalboard amplifier for capturing the essence of legendary British amplifiers. This compact powerhouse brings the iconic sounds of JMP, AC Normal, and AC Top Boost into a single, portable unit. Whether you're performing live, recording in the studio, or practicing at home, the SuperBlock UK delivers the authentic British tones you crave with unmatched versatility. Three Classic Voices

  The SuperBlock UK features three distinct voicings that capture the essence of classic British amplifiers:

  Versatile Power Options

  Designed for ultimate flexibility, the SuperBlock UK can be powered by a 24-volt power supply for a full 25 watts of tube-like power, or by a conventional 9-volt power supply for 1 watt of power—perfect for quieter applications and home practice. Cab Simulations and FRFR Mode

  The SuperBlock UK includes two Cab Sims and an FRFR mode on the XLR Out and headphone out, ensuring your tone is always dialed in, whether you're recording direct or monitoring through headphones. The built-in reverb and effects loop further enhance your sound, making the SuperBlock UK a complete solution for any guitarist. Compact and Portable

  Fitting into a slot about the size of a double-width pedal, the SuperBlock UK is the most extensible system you can fit on your pedalboard. It's perfect for fly dates, commutes, or as a replacement for your traditional amp setup. Key Features:

  Your Tone, Your Way

  With the Quilter SuperBlock UK, you have the power to shape your sound with precision and authenticity. Whether you're chasing the vintage tones of yesteryear or crafting your own signature sound, the SuperBlock UK is your ticket to tonal paradise. -
