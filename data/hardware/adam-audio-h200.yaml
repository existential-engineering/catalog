description: The H200 closed-back studio headphones are ready to transform both reference monitoring and everyday music enjoyment.
details: |-
  The H200 is a versatile, closed-back headphone designed from the ground up to benefit from ADAM Audio's 25 years' experience in studio monitoring solutions. Patent-pending industrial design meets quality components to deliver uncompromising audio quality and functional utility.

  Premium PEEK diaphragm drivers and well-damped acoustical earcups deliver exceptional sound quality, along with a comfortable fit and excellent sound isolation. Replaceable components and general robustness ensure a long life, whether in rough studio environments or out on the road, while a suite of accessories completes the package.

  Beyond hardware, the H200 comes with the purpose-built ADAM Audio Headphone Utility DAW plug-in. This software offers a range of optimizations and the Externalization feature to better translate loudspeaker mixes to headphones. The plug-in is available to registered H200 customers as a free download in the MyADAM user area.

  The carefully considered architecture and materials of the earcups resulted in a patent-pending Internal Airflow design for reference-grade audio reproduction. With dual-sided cable connectivity, exchangeable earpads and headband padding, the H200 was designed with decades of use in mind.

  Developed for strength and durability, the H200 headband components offer a firm but not excessive clamping force, and the headphone ships with memory foam earpads for a molded fit and maximum comfort over long listening sessions.
specs: |-
  - Design: closed back, circumaural dynamic headphone with detachable cable
  - Transducer: 40 mm PEEK Performance with neodymium magnet
  - Transducer protection: cloth and felt covered grille
  - Impedance: 32 Ohm
  - Frequency response, re 1 kHz and -3 dB: 2 Hz to 23.5 kHz
  - Max. sound pressure level @ 1 kHz and 0.04 % THD: 112.5 dB SPL
  - THD @ 1 kHz and 100 dB SPL: <0.02 %
  - Passive attenuation, averaged >4 kHz: 40 dB
  - Sensitivity: 112.5 dB SPL @ 1 Vrms, 97.5 dB SPL @ 1 mW
  - Max. input power handling: 30 mW (0.98 V)
  - Continuous input power handling: 20 mW (0.8 V)
  - Ear cup connectivity: 2.5 mm (1/10") TRS jack plugs
  - Source connectivity: 3.5 mm (1/8") TRS jack plug (straight), adapter for 6.3 mm (1/4")
  - Cable entry: left or right side with collar resistance lock
  - Ear cup material: PC-ABS (85 % recycled)
  - Ear pad material: memory foam with artificial leather, replaceable
  - Replaceable head band pad
  - Foldable: no
  - Operating conditions: -30 C to +50 C, <85% RH, non-condensing
  - Weight (excl. cable): 0.25 kg
  - Warranty: 2 years
  - Delivery contents: H200 headphone, 3 m straight cable, soft carry bag
  - Includes ADAM Audio Headphone Utility DAW plug-in with Externalization feature (free download for registered customers)
