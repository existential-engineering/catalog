description: The H200 closed-back studio headphones are ready to transform both
  reference monitoring and everyday music enjoyment.
details: |-
  The H200 is a versatile, closed-back headphone designed from the ground up to benefit from ADAM Audio's 25 years' experience in studio monitoring solutions. Patent-pending industrial design meets quality components to deliver uncompromising audio quality and functional utility.

  At the heart of the H200 are 40mm PEEK Performance drivers paired with neodymium magnets, delivering an extended frequency response from 2 Hz to 23.5 kHz (-3dB) and a maximum SPL of 112.5 dB. Well-damped acoustical earcups and an internal airflow design help control resonance for a clean, accurate listening experience.

  Built for everyday studio use, the H200 features replaceable ear pads and headband padding, a detachable cable, and serviceable construction. The ear cups are made from 85% recycled PC-ABS, with memory foam ear pads covered in artificial leather, all rated for operation from -30 to +50 degrees Celsius.

  The included 3m straight cable terminates in a 3.5mm (1/8") TRS jack with a 6.3mm (1/4") screw-on adapter, while 2.5mm TRS plugs connect to the ear cups via a collar resistance lock that allows left- or right-side cable entry.

  Registered H200 owners can download the ADAM Audio Headphone Utility — a Sonnox-developed DAW plug-in — free of charge via the MyADAM user area, providing optimization tools tailored to the closed-back design of the headphones.
