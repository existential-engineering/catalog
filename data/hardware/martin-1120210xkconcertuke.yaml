details: |-
  The 0XK Concert Uke combines classic Martin tone with eye-catching style and everyday durability. Built with high-pressure laminate (HPL) and patterned after premium Hawaiian koa, it delivers the rich look of fine tonewood with the ruggedness to go wherever the music leads.

  Whether you're headed to the beach, the backyard, or a last-minute gig, this uke is built to travel light and play easy. The concert body size offers a bit more volume and playing room than a soprano, and the striking koa grain pattern gives it a visual pop that stands out in any setting.

  The 0XK ships with a soft gig bag and is available in a left-handed configuration, making it an accessible option for players seeking a road-ready Martin ukulele with distinctive figured koa styling.
specs: |-
  - Body Size: Concert Ukulele
  - Top: HPL with Figured Koa Pattern
  - Back & Sides: HPL with Figured Koa Pattern
  - Braces: Spruce (1/4")
  - Bridge: Morado with Compensated White Tusq saddle
  - Neck Material: Brown Birch Laminate
  - Fingerboard: Sipo with white plastic dots
  - Frets: 17 total
  - Nut Width: 1 13/32"
  - Fingerboard Width at 12th Fret: 1 13/16"
  - Tuning Machines: Nickel Uke Pegs
  - Nut & Saddle: White Tusq
  - Case: Soft Gig Bag
  - Left-Handed Availability: Yes
