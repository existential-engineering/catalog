description: The 73EQL is a 500 Series equalizer module sharing heritage with
  BAE Audio's classic 1073 lineup. It features a 3-band EQ section with highpass
  filter, delivering vintage BAE sound in a compact 500 Series form factor.
details: |-
  The 73EQL brings the character of BAE Audio's legendary 1073 lineage into the 500 Series format, delivering world class vintage BAE sound in a compact form factor.

  The module offers a 3-band EQ with five high-frequency shelving points (8 kHz, 10 kHz, 12 kHz, 16 kHz, 20 kHz), eleven mid-range peaking points (270 Hz, 360 Hz, 500 Hz, 700 Hz, 1.1 kHz, 1.6 kHz, 2.3 kHz, 3.2 kHz, 4.8 kHz, 7.2 kHz, 10 kHz), and five low-frequency shelving points (20 Hz, 35 Hz, 60 Hz, 110 Hz, 220 Hz). A highpass filter with five selectable corner frequencies (25 Hz, 45 Hz, 70 Hz, 160 Hz, 360 Hz) is also included.
specs: |-
  - High Frequencies (shelving): 8 kHz, 10 kHz, 12 kHz, 16 kHz, 20 kHz
  - Mid-Range Frequencies (peaking): 270 Hz, 360 Hz, 500 Hz, 700 Hz, 1.1 kHz, 1.6 kHz, 2.3 kHz, 3.2 kHz, 4.8 kHz, 7.2 kHz, 10 kHz
  - Low Frequencies (shelving): 20 Hz, 35 Hz, 60 Hz, 110 Hz, 220 Hz
  - Highpass Filter: 25 Hz, 45 Hz, 70 Hz, 160 Hz, 360 Hz
