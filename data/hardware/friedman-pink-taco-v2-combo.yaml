description: The Pink Taco V2 Combo is a hand-wired, 20-watt, EL84 powered
  single channel 1x12 inch combo that puts the Friedman BE-100 sound in a small,
  lightweight format.
details: |-
  The Pink Taco V2 is Dave Friedman's latest version of this hand-wired, 20-watt, EL84 powered amp. It is capable of producing many styles of music, from blues and classic rock through heavy rock and metal, by adjusting the gain and master controls and the newly added switches.

  The Pink Taco V2 is the little baby sister to the critically acclaimed BE-100 and was created for the many musicians asking for the Friedman sound in a small, compact, lightweight and simplified format.

  Handcrafted in the USA, the Pink Taco V2 combo uses tongue and groove Baltic Birch construction and houses a 16 ohm, 12 inch Celestion Creamback G12M-65 speaker that delivers the bass and mid response expected from a Friedman amplifier.

  A lot of players do not believe an EL84 amp can deliver the tight bottom end and midrange an EL34 amp produces. The Pink Taco V2 was designed to sound like a 100-watt EL34 amp, using custom transformers and the clearest signal path possible.

  Plugging into the Pink Taco V2 reveals a tight bottom end and rich, harmonically detailed chords and single notes. The amp cleans up remarkably well with the guitar's volume control, even on higher gain settings.
specs: |-
  - 20-watt EL84 cathode biased 1x12 inch combo
  - Single channel all-tube combo
  - 2 x EL84 power tubes
  - 3 x 12AX7 preamp tubes
  - Master volume and gain controls
  - Full EQ consisting of bass, middle and treble
  - S-Switch (gain structure switch)
  - Sat switch
  - Fat switch
  - Ultra-transparent series FX loop
  - 4, 8 and 16 ohm speaker jacks
  - Celestion 16 ohm 12 inch G12M-65 Creamback speaker
  - Custom made transformers
  - Tongue and groove Baltic Birch cabinet
  - Dimensions: 9.5 inches (D) x 24.25 inches (W) x 22 inches (H)
  - Weight: 45 lbs
  - Assembled in Los Angeles, CA
  - Limited lifetime warranty
