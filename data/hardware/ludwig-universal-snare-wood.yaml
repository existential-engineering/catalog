details: |-
  An incredible lineup of wood drums for the most demanding drummer! This unique selection of snares has been designed to find a place in nearly any drum set.

  Lock into fantastic tone and stunning finishes with 4 new models! Take a tour of the new sonic collection with Ludwig Artist Jason Smay, drummer for McKinley James.

  Four distinct models available: Universal Mahogany (LU6514MA), Universal Walnut (LU6514WA), Universal Beech (LU6514BE), and Universal Cherry (LU6514CE).
specs: |-
  - Universal Mahogany (LU6514MA): 6.5x14" 6-ply 7.5mm Mahogany shell with Maple re-rings
  - Universal Walnut (LU6514WA): 6.5x14" 6-ply 7.5mm Walnut shell with an outer ply of exotic Walnut Burl
  - Universal Beech (LU6514BE): 6.5x14" 6-ply 7.5mm Beech shell with an outer ply of exotic Sapele
  - Universal Cherry (LU6514CE): 6.5x14" 6-ply 7.5mm Cherry shell
  - Hardware: Triple flange hoops, tube lugs, P88i throw-off, P35 butt plate
  - Snares: 18 strand wires
