details: |-
  The AV10 MXO is a direct bolt-in replacement crossover for the Yamaha NS-10M
  studio monitor. Avantone reverse-engineered the original design to recreate
  this discontinued component with improved materials throughout.

  The crossover features an upgraded aluminum rear panel for improved rigidity
  versus the original plastic construction. It ships with a replacement gasket
  for an airtight seal and pre-assembled wires with spade connectors for
  straightforward installation requiring minimal tools.

  Capacitors match original circuit values but use higher-grade materials.
  Inductors precisely match original specifications in DC resistance, winding
  dimensions, and value.
specs: |-
  - Musical Power: 60W
  - Maximum Power: 120W
  - Nominal Impedance: 8 Ohms
  - Rear Panel: Aluminum (upgraded from original plastic)
  - Includes: Replacement gasket, pre-connected wires with spade connectors
