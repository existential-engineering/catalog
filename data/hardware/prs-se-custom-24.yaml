details: |-
  The SE Custom 24 brings the original PRS design platform to the high-quality, more affordable SE Series of instruments. Played by internationally touring artists, gigging musicians, and aspiring players, the SE Custom 24 is a modern classic with roadworthy durability, addictive playability, and wide array of tones.

  Featuring a maple top, mahogany back, wide thin maple neck, rosewood fretboard with bird inlays, and the PRS patented tremolo, the PRS SE Custom 24 boasts many familiar appointments. Its versatile sounds come from the 85/15 “S” pickups paired with a volume, push/pull tone control, and 3-way blade pickup selector. Now with ergonomic lampshade knobs and PRS's flat-grip switch tip design, the PRS SE Custom 24 is more performance-ready than ever.
