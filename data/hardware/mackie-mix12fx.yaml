description: Loaded with immersive onboard effects, the Mackie Mix12FX is a
  12-channel compact mixer that delivers high-headroom, low-noise audio for
  recording and mixing.
details: |-
  Mix Series compact mixers are reliably rugged, with the proven quality you expect from the world leader in compact mixer design. Mix12FX is the largest of the three, with 12 channels in a metal chassis measuring 11.7 x 9.6 x 2.1 inches.

  Four mono channels each pair an XLR mic input with a 1/4 inch line input, a 75 Hz low-cut filter and 3-band EQ. Four stereo 1/4 inch line channels follow, each with a +4/-10 dB level switch for professional or consumer gear.

  A 12-preset effects processor is built in, covering small stage, small and large room, warm and bright hall, classic, bright and vocal plate reverbs, chorus, flanger, slapback and space echo. An FX send jack carries the same mix to an external processor.

  Outputs are main mix left and right, stereo control room outputs, a stereo RCA tape output and a headphone jack, all with the tape-to-main and tape-to-control-room routing switches of the series.

  Every feature is on the top of the mixer except the power connector, which takes the supplied external AC power supply.
specs: |-
  - 12-channel compact mixer with high-headroom, low-noise performance
  - 4 mic/line inputs with XLR and 1/4 inch jacks
  - 4 stereo 1/4 inch line inputs with +4/-10 dB and balance operation
  - 3-band EQ: low shelving 80 Hz, mid peaking 2.5 kHz, high shelving 12 kHz, +/-15 dB each
  - 75 Hz low-cut filter at 18 dB/octave on channels 1-4
  - Globally switched 48V phantom power for studio condenser mics
  - 12 integrated effects presets including reverbs, chorus, flanger and delays, with an FX send output
  - Dedicated stereo RCA inputs/outputs for playback or recording
  - Main L/R outputs, stereo control room outputs and headphone output
  - Equivalent input noise -122 dBu (150 ohm termination)
  - Mic input maximum level +19 dBu, all other inputs and outputs +21 dBu
  - External AC power supply, AC18V 1000mA output (US)
  - Dimensions 11.7 x 9.6 x 2.1 in / 297 x 244 x 53 mm, weight 3.7 lb / 1.7 kg
