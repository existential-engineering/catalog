description: "Loaded with immersive onboard effects, the Mackie Mix12FX is a
  12-channel compact mixer that delivers high-headroom, low-noise audio for
  recording and mixing."
details: |-
  When you need to take your mix to the next level, reach for the Mackie Mix12FX. Our 12-channel compact mixer features high-headroom, low-noise preamps, onboard mixer effects and flexible I/O, helping you turn the music in your head into a reality.

  Adding depth and dimension to your mixes has never been easier-or more affordable. With 12 onboard effects, the Mackie Mix12FX makes adding depth to your vocals, drums, keyboards and more a breeze. Our 12-channel mixer features four microphones/line inputs that are equipped with our low-noise, studio-quality preamps, a high-pass filter and 3-band EQ to fine-tune your sound. Plus, it offers four stereo channels for keyboards and other line-level instruments and gear.
specs: |-
  - 12-channel compact effects mixer with proven high-headroom, low-noise performance
  - 4 mic/line inputs with studio-level audio quality
  - 3-band EQ with clean, precise tone shaping
  - Low cut filter (75Hz)
  - Pan, level and overload indication
  - Phantom power for studio condenser mics
  - 4 stereo 1/4" line inputs
  - +4/-10dB operation
  - Balance, level and overload indication
  - 12 great-sounding integrated effects including reverbs, choruses and delays
  - Dedicated stereo RCA inputs/outputs for playback or recording
  - 60mm fader for Main L/R outputs
  - Headphone and stereo control room outputs
  - Rugged, reliable design built to last
  - Extremely compact and portable
