description: Martin's first double-neck in over a century combines 28-style tone
  with six- and twelve-string necks, premium tonewoods, and electronics.
details: |-
  The Grand J-28E DN marks Martin's return to double-neck guitar building for the first time in over a century. Pairing a six-string and twelve-string neck on a single Grand Jumbo 14-fret body, the instrument is designed to give players the tonal range of two guitars in one performance-ready package.

  The body features a solid spruce top with an aging toner gloss finish over solid East Indian rosewood back and sides — Martin's signature 28-style tonewood pairing. A unique double-neck X-brace pattern, combining a non-scalloped X with scalloped tone bars, supports the dual-neck construction while preserving acoustic projection. An ebony bridge with a modern belly drop-in saddle completes the body.

  Both necks are built from select hardwood with a satin dark mahogany finish. The six-string neck uses Martin's Modified Low Oval profile with a 1-11/16" nut width, while the twelve-string neck has a 1-13/16" nut. Both share a 25.4" scale length, 20 frets, and ebony fingerboards with Style 28 mother-of-pearl inlays. Nickel open-gear tuners and a Fishman Double Neck electronics system make the guitar ready for stage and studio.

  The instrument ships pre-strung with Martin Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings and includes a molded hardshell case.
specs: |-
  - Body Size: Grand J-14 Fret
  - Top: Solid Spruce, Aging Toner, Gloss finish
  - Back & Sides: Solid East Indian Rosewood
  - Bracing: Unique Double Neck X-Brace (non-scalloped X with scalloped tone bars)
  - Bridge: Ebony, Modern Belly Drop-in Saddle
  - Neck Material: Select Hardwood, Dark Mahogany finish, Satin
  - 6-String Neck Shape: Modified Low Oval
  - Scale Length: 25.4"
  - Frets: 20 total, joins body at 14th fret
  - Fingerboard: Ebony with Style 28 Mother of Pearl inlay
  - Nut Width (6-string): 1 11/16"
  - Nut Width (12-string): 1 13/16"
  - Tuning Machines: Nickel Open Gear
  - Electronics: Fishman Double Neck System
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
  - Case: Molded Hardshell (included)
