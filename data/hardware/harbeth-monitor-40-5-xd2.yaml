description: The Monitor 40.5 XD2 is Harbeth's flagship three-way loudspeaker,
  built on the M40.3 XD and offering deep bass, high transparency and an easy
  load for the amplifier across the audio spectrum.
details: |-
  The M40.5 XD builds on the success of the globally acclaimed M40.3 XD, delivering a leap in performance. With realism, deep bass and transparency, these loudspeakers offer a listening experience aimed at the most discerning ears.

  Precise throughout the audio spectrum, emotionally captivating and effortlessly driven, the M40.5 XD2 takes the Harbeth sound to new heights.

  At the core of the speaker is Harbeth's RADIAL4 cone technology. Pioneering work in loudspeaker diaphragm material science set the benchmark for the acclaimed RADIAL cone, a revolution in clarity and detail from a drive unit, here paired with a 300mm bass driver and a 25mm ferrofluid-cooled tweeter.

  Each speaker in the XD2 series incorporates a newly refined crossover design. The result is a speaker that excels in tonal accuracy and is more open and clear, immersing listeners in a more lifelike musical experience.

  The cabinets are handmade from carefully selected high-quality veneers, which vary in colour, shade and grain structure, and not all finishes are available in every country. The Monitor 40.5 XD2 is designed and handmade in the UK.
specs: |-
  - Description: stand-mount loudspeaker
  - Bass drive unit: 300mm Harbeth-made
  - Mid drive unit: 200mm Harbeth-made RADIAL4
  - Tweeter: 25mm ferrofluid-cooled
  - Frequency range: 35Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 to 8 ohms
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 35W per channel
  - Power handling: 650W programme
  - Connectors: 4mm Harbeth-branded binding posts
  - Space needs: ideally free-space away from walls
  - Stands: optimally to bring ears level with tweeters (tweeter 660mm up from cabinet base)
  - Dimensions: 750mm high, 432mm wide, 388mm deep (plus 12mm for grille and binding posts)
  - Packing: single speaker per protective carton
