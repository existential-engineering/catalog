details: |-
  The Bettermaker C502V is an advanced 500-series analog stereo VCA compressor featuring three distinct compression modes and digital recall capability. It offers three compression characters: BM (a gentle, versatile mastering mode), SG (British VCA-inspired design), and DX (an aggressive American-style circuit based on the 160A). Each mode delivers a unique sonic character, making the C502V a versatile tool for a wide range of compression tasks.

  The unit supports stereo, dual mono, and mid-side (M/S) matrix operation, with a solo function for monitoring each configuration. It includes 399 onboard presets and an onboard undo function for recalling previous settings. A high-pass sidechain filter with 60Hz, 120Hz, and external options provides additional control over the compression response.

  Digital recall is enabled via a free plugin controller available in AU, VST, RTAS, and AAX formats (32/64-bit) for both macOS and Windows. This allows users to automate and save settings from their DAW. Firmware updates and demo files are also available for download from the manufacturer.

  The C502V is a 500-series module designed for 500-series rack enclosures. It is covered under U.S. Patent No. 10,693,428 B2.
specs: |-
  - Operating Level: +4 dBu
  - Maximum Input/Output: +22 dBu
  - Max Gain Reduction: 25 dB
  - Compression Ratios: 1.5, 2, 4, 6:1 plus expander (1:2)
  - Makeup Gain: -10 dB / +20 dB
  - Attack: 0.1–250 ms (mode dependent)
  - Release: 0.01–1.3 s plus auto
  - THD+N: <0.01%
  - Input Impedance: 10 kΩ + 10 kΩ (balanced)
  - Output Impedance: 75 Ω + 75 Ω (quasi-floating balanced)
  - Dimensions: 13.3 cm × 7.6 cm × 15.8 cm
  - Weight: 1.3 kg
  - Compression Modes: BM, SG, DX
  - Sidechain High-Pass Filter: 60 Hz, 120 Hz, external
  - Wet/Dry controls per channel
  - Onboard presets: 399
  - Plugin formats: AU, VST, VST3, RTAS, AAX (32/64-bit)
  - 500-series form factor
  - U.S. Patent No. 10,693,428 B2
