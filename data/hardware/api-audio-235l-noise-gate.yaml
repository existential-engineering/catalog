url: https://apiaudio.com/product/235l-noise-gate/
description: Noise gate/expander module with fast operation for studio, live
  sound, and broadcast. Features threshold from -45 to +25 dBu, variable depth
  to -80 dB, adjustable release/hold (50 ms–3 s), 2:1 expander and noise gate
  modes, and API 2510/2520 op-amps.
details: |-
  200 Series noise gate/expander module. Two selectable attack modes:
  Fast (100 µs) and Normal (25 ms). Release/Hold switch changes timing control
  behavior. Operates at unity gain regardless of settings. Compatible with
  Legacy, Legacy Plus, and Vision Series Consoles and the L200 Rack.
specs: |-
  - Format: 200 Series
  - Threshold: -45 to +25 dBu
  - Depth: variable to -80 dB
  - Attack: Fast (100 µs) or Normal (25 ms)
  - Release/Hold: 50 ms–3 s
  - Modes: 2:1 expander or noise gate
  - Input impedance: >10 kΩ (unbalanced)
  - Output impedance: 85Ω (transformer-coupled, balanced)
  - Clipping level: +28 dBu
  - Noise (closed): -102 dBu unweighted
  - THD: 0.008% at +4 dBu
  - Power: ±16V DC, 100 mA max
  - Dimensions: 1.25" × 2.65" × 6.5" deep
  - Weight: 0.61 lb
