description: Limited-Edition Active Classic Reference Studio Monitor System — a
  powered recreation of the iconic 'white cone' studio monitor in North American
  black walnut veneer finish.
details: |-
  The CLA-10A Limited Edition is a powered recreation of the iconic 'white
  cone' reference studio monitor, finished in North American black walnut
  veneer. It is designed for professional studio use and delivers the classic
  near-field monitoring sound that has been used on countless recordings.

  The system features a 200W Class AB linear supply amplifier driving an 18 cm
  AV10-MLF cone low-frequency driver and a 3.5 cm AV10-MHF soft dome
  high-frequency driver, housed in a 10.4-liter sealed MDF cabinet with real
  wood veneer.

  Frequency response reaches from 60 Hz to 20,000 Hz with a peak musical
  output of 104 dB SPL (110 dB peak). Total harmonic distortion is rated at
  0.05% at 1 kHz, 1W, with power consumption of 3W in standby and up to 250W
  at full output.

  The CLA-10A Limited Edition includes a Variable Tissue Paper Control (VTPC)
  high-frequency adjustment centered at 1.8 kHz (±6/−20 dB), a ground lift
  switch, and selectable 115V/230V AC power. It accepts balanced XLR/TRS
  combination and unbalanced RCA inputs, sold as a stereo pair.
specs: |-
  - System Type: Active Full-Range Two-Way Stereo Pair
  - Frequency Response: 60 Hz–20,000 Hz
  - Low Frequency Driver: AV10-MLF 18 cm Cone
  - High Frequency Driver: AV10-MHF 3.5 cm Soft Dome
  - Cabinet: 10.4 Liter Sealed Design, 18mm MDF with Real Wood Veneer
  - Cabinet Dimensions: 381.5 × 215 × 197.5 mm (15" × 8½" × 7¾")
  - Weight: 8.2 kg / 18 lbs (each)
  - SPL: 104 dB
  - Peak Musical Output: 110 dB
  - Amplification: 200W Class AB Linear Supply
  - THD: 0.05% at 1 kHz, 1W
  - Power Consumption: 3W standby / 250W full output
  - VTPC (Variable Tissue Paper Control): Fc 1.8 kHz ±6/−20 dB
  - Selectable 115V/230V AC power
  - Ground lift switch
  - Volume control: +0 dB to −120 dB
  - Finish: North American black walnut veneer
