description: A compact distribution amplifier with four channels, DSP for
  product optimization and dynamic EQ for subwoofers.
details: |-
  CDA-4D is a four-channel distribution power amplifier for custom installation, carrying DSP for product optimisation and dynamic EQ for subwoofers. Bowers & Wilkins positions it as the compact member of the CDA range: a full-rack-width 1U chassis just 42.5mm high that still delivers four channels of Class D amplification, rated at 125W per channel into 4 ohms.

  Channels can be bridged in pairs, giving 250W into 8 ohms per bridged pair and allowing a powerful 2-channel or 2.1 setup from the same box. Two stereo outputs are provided on 5.08mm-pitch 4-way Phoenix Combicon style terminal blocks, and a bridge-tied-load subwoofer is wired across the marked + BRIDGE - terminals after selecting Subwoofer in the configuration page. Minimum load impedance is 3 ohms per channel, or 8 ohms in bridge mode.

  Configuration is entirely browser-based. A network connection is mandatory for setup: the amplifier ships with DHCP on and is reached at a hostname built from the product name and serial number, which opens the Product Configuration Page. From there the installer routes any input to any output, sets trim from -5dB to +19dB, names inputs and outputs, groups channels into zones, and sets output, turn-on and maximum volume. Presets and complete settings can be imported, exported and copied, firmware updated, settings locked, and email alerts configured.

  Per-output DSP provides an 8-band parametric EQ over 20Hz to 20kHz with parametric, high shelf and low shelf filter types, high-pass and low-pass crossover filters at -6, -12, -18 or -24dB per octave, 180-degree phase invert, and a delay adjustable from 0.01 to 20 milliseconds entered in milliseconds, feet or metres. Selecting a Bowers & Wilkins speaker loads a named preset with listening modes and tone control instead of the raw parametric set. A pink noise generator is built in for measurement with a spectrum analyser.

  Power mode can be set to always-on, auto-detect signal sensing or 12V trigger, with an auto-on delay of 0 to 20 seconds for sequencing and Wake on LAN for control-system integration; standby draw is under 0.5W and the amplifier sleeps after 15 minutes without signal. Two or more CDA amplifiers on the same AVB-enabled wired network can share analogue or digital input sources. The chassis measures 42.5mm (1.7in) high, 437mm (17.2in) wide and 310mm (12.2in) deep, weighs 4.1kg, ships with rack ears and feet, and is finished in black.
specs: |-
  - 4 channels of Class D amplification
  - Output power per channel, non-clipped: 60W into 8 ohms, 125W into 4 ohms
  - Output power bridge mode, non-clipped: 250W into 8 ohms
  - Output power total, all channels: 500W short term, >125W continuous
  - Load impedance range: >3 ohms per channel (>6 ohms in bridge mode); minimum load in bridge mode is 8 ohms
  - Bridgeable for a 2-channel or 2.1 setup
  - Frequency response (-3dB): <10Hz to >30kHz, any load impedance
  - Frequency response accuracy 20Hz-20kHz: +/-1dB
  - Dynamic range: >85dB A-weighted
  - THD+N (1kHz, 500W, 4 ohms): less than 1%
  - Voltage gain: 15dB to 39dB, adjustable
  - Input impedance: 10k ohms; maximum input voltage 4 Vrms
  - DC offset voltage: <50mV
  - Input trim: -5dB to +19dB in 1dB steps
  - Signal sense threshold: 2.5mV (independent of gain setting)
  - 12V trigger input threshold: typically 3V (recommended input 5-15V)
  - Three power mode options: on, auto detect or 12V trigger, with 0-20s auto-on delay and Wake on LAN
  - Turn-off time: 15 minutes from last signal detected
  - 8-band parametric EQ per output (20Hz-20kHz), filter types parametric, high shelf or low shelf
  - High-pass and low-pass crossover filters, filter order -6, -12, -18 or -24dB/octave
  - Delay 0.01ms to 20ms, enterable in milliseconds, feet or metres; phase invert 180 degrees
  - Built-in pink noise generator for speaker measurement
  - Browser-based Product Configuration Page; DHCP on by default, static IP supported
  - Audio Video Bridging (AVB) compatible between CDA amplifiers on an AVB-enabled wired network
  - Connectors, input: 2x RCA (pair) phono socket analogue line in, 2x RCA phono socket digital line in, 1x Ethernet
  - Connectors, output: 2x 5.08mm pitch 4-way Phoenix Combicon style terminal block
  - 12V trigger control: 1x 3.5mm jack in, 1x 3.5mm jack out (maximum 100mA pass-through)
  - Front panel: power LED, network status LED, 2x zone status LEDs. Rear panel: reset button
  - AC supply: 100-240V 50/60Hz; AC inlet IEC C14, switched
  - Power consumption: <0.5W standby (WoL enabled or disabled), 130W maximum average, 1,600W peak
  - Thermal dissipation: 1.7 BTU/hr standby, 130 BTU/hr idle, 500 BTU/hr maximum
  - Height: 42.5mm (1.7in) 1U [55.5mm (2.2in) plus feet per the manual, 57.5mm (2.3in) per the product page]
  - Width: 436mm (17.2in) per the product page; 437mm (17.2in) per the manual specification table
  - Depth: 300mm (11.8in) per the product page; 310mm (12.2in) per the manual specification table
  - Net weight: 4.1kg (9.0lb)
  - Finish: Black
  - Supplied with rack-mount ears and feet; full-rack-width 1U design
