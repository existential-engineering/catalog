description: Fusion 5 features a solid Spruce top, flamed Mahogany back and sides, full-size body with cutaway for extended playing range and a steel string-inspired rosette.
details: |-
  Cordoba's entry into the fusion line! The perfect choice to transition from steel string to nylon string guitar, the Cordoba Fusion 5 features a solid Spruce top, flamed Mahogany back and sides, full-size body with cutaway for extended playing range and a steel string-inspired rosette. The fusion neck with a 16 inch radius fretboard and smaller, 1 7/8 inch (48mm) nut width provides a playing experience very close to that of a steel string guitar. Added side dot markers also depart from traditional nylon string guitar construction, providing players reference for their position on the fingerboard. Equipped with the Fishman Presys VT Pickup System, the Fusion 5 is ready to plug in and play. Available in Edge Burst gloss finish.
