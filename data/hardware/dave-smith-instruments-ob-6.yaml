description: >-
  The OB-6 is a six-voice polyphonic analog synthesizer born from a collaboration between
  Dave Smith and Tom Oberheim. It combines a classic SEM-based Oberheim sound engine with
  the modern architecture of the Prophet 6, delivering authentic vintage Oberheim tone
  with contemporary reliability and features.
details: |-
  The OB-6 was conceived by Dave Smith after recognizing that the Prophet 6's hardware and software architecture already had everything needed for a new version of the original OB polysynth. Both instruments share the same motherboard, differentiated only by voice cards that are not interchangeable between models. This design decision enabled rapid development while maintaining sonic distinction between the two instruments.

  The sound engine reflects Tom Oberheim's influence through two discrete VCOs along with a sub-oscillator per voice. The two-pole, state-variable, resonant filter draws directly from classic Oberheim designs, offering low-pass, high-pass, band-pass, and notch modes. An all-analog signal path completed by VCAs ensures authentic analog character throughout.

  The front panel provides comprehensive access to sound-shaping controls in a relatively compact form factor. A four-octave semi-weighted keyboard with aftertouch gives players expressive control, while storage includes 500 permanent and 500 user-editable programs for a total of 1,000 patches.

  Additional performance features include a polyphonic 64-step sequencer and a versatile arpeggiator with up, down, up/down, random, and assign modes. MIDI I/O is provided via traditional DIN connectors and USB, making the OB-6 easy to integrate into both modern and vintage studio setups.
specs: |-
  - Polyphony: 6 voices
  - Multitimbral: 1 part
  - Oscillators: 2 VCOs per voice
  - Sub-oscillator: 1 per voice
  - Filter: 2-pole state-variable, resonant (12dB/oct)
  - Filter modes: Low-pass, high-pass, band-pass, notch
  - LFO: 1 (sine, saw up, saw down, square, sample & hold)
  - Envelopes: 2 ADSR
  - Sequencer: 64-step polyphonic
  - Arpeggiator: Up, down, up/down, random, assign
  - Keyboard: 49 keys, semi-weighted with aftertouch
  - Memory: 500 user / 500 factory patches
  - Connectivity: MIDI In/Out/Thru, USB
