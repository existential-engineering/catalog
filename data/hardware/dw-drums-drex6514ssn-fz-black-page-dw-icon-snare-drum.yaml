description: The Black Page DW ICON Snare was crafted to pay homage to legendary DW artist Terry Bozzio and Frank Zappa.
details: |-
  This DW Collector's Series ICON Series Snare was created to pay tribute to longtime DW artist Terry Bozzio and Frank Zappa's avant-garde composition "The Black Page". Terry cut his teeth in Zappa's band in the 1970s, during which time he recorded the notoriously complex song. The resulting track and Terry's solo have become legendary due to their complexity and "statistical density".

  This snare drum is built on an 11-ply HVLT (Horizontal Vertical Low Timbre) shell made from 100% North American Hard Rock Maple for punchy attack and classic warm tone. The exterior Birdseye Maple veneer features a laser-etched, note-by-note recreation of Bozzio's original solo, which is flanked by dyed-black Pearwood inlays of Zappa's iconic mustache and the song title.

  This limited 6.5x14″ snare is crowned with DW's highest grade of hardware, all plated in black nickel. This includes DW's patented MAG throw-off, three-position butt plate, True-Tone Snare Wires, True-Hoops, and DW Heads by Remo U.S.A.

  The snare includes a heavy-duty DW snare bag and certificate of authenticity signed by John Good.
specs: |-
  - 11-ply North American Hard Rock Maple HVLT shell
