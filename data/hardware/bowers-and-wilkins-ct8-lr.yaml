description: Designed to sit on the left and right of your cinema screen, the
  CT8 LR features a spherical midrange/tweeter head that can be tilted towards
  the listener to retain a focused delivery, plus twin 10in bass units, as in
  the surround speaker.
details: |-
  CT8 LR is the left and right front speaker of the Bowers & Wilkins CT800 Custom Theater range, described by the manual as a three-way closed-box system. It carries a 32mm metal dome tweeter, a 150mm Aramid Fibre cone FST midrange driver and two 250mm Rohacell bass drivers in a tall cabinet intended to flank a cinema screen. The midrange and tweeter sit in a spherical head that can be tilted towards the listening position so the delivery stays focused when the speaker is installed high or low relative to the seats.

  Custom Theater speakers are made to be built into the fabric of the listening room or into custom furniture as part of a designed theater, so they deliberately leave out features that only suit free-standing speakers, such as a tweeter-on-top arrangement. Because installers normally hide built-in speakers behind acoustically transparent cloth that matches the decor, every model in the range except the CT8 DS surround is supplied without a grille.

  The speaker is semi-active and requires an active crossover, the CT8 XO bass management controller, but carries no amplification of its own: all power amplification must be sourced separately. Each CT8 LR needs two channels of power amplification, one for the bass section and one for the midrange and high-frequency section, or three channels when a CT8 SW subwoofer is assigned to that channel. The quoted crossover points are 300Hz and 4kHz.

  Bowers & Wilkins recommends 500W to 1000W into 8 ohms on unclipped programme. The lower figure is the minimum considered necessary for reasonable levels without audible distortion in a room under 60 cubic metres, and the upper figure is set by the power handling of the speaker rather than by what it needs. Speaker cable impedance should be kept below 0.1 ohm over the full run, and an amplifier whose 4 ohm and 8 ohm ratings approach a 2:1 ratio indicates the current capability this load wants.

  Performance changes over the first period of use. The manual asks for roughly a week for temperature effects to stabilise and about 15 hours of average use for the drive unit suspensions and damping compounds to reach their intended mechanical characteristics. Cabinet surfaces normally need only dusting; any aerosol cleaner should be sprayed onto the cloth rather than onto the cabinet, and the drive unit diaphragms, the tweeter above all, should not be touched.
specs: |-
  - Description: 3-way closed-box system
  - Drive units: 1x ø32mm (1.25in) metal dome tweeter, 1x ø150mm (6in) Aramid Fibre cone FST midrange driver, 2x ø250mm (10in) Rohacell bass drivers
  - Frequency range: -6dB at 23Hz and 40kHz
  - Frequency response: 29Hz to 24kHz +/-3dB on reference axis
  - Dispersion: within 2dB of reference response, horizontal over 60 degree arc, vertical over 10 degree arc
  - Sensitivity: 93dB spl (2.83V, 1m) (mf/hf)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) under 1% 45Hz to 20kHz, under 0.5% 55Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 4 ohms)
  - Crossover frequency: 300Hz, 4kHz
  - Recommended amplifier power: 500W to 1000W into 8 ohms on unclipped programme
  - Maximum recommended cable impedance: 0.1 ohms
  - Semi-active: requires the CT8 XO active crossover and two channels of external power amplification (three when a CT8 SW is assigned to the channel). No on-board amplifier and no mains connection
  - Dimensions: height 1100mm (43.3in) without spike feet, width 325mm (12.8in), depth 550mm (21.65in)
  - Weight: 85kg (187lb)
  - Supplied without a grille, for installation behind acoustically transparent cloth
  - Finish: Black
