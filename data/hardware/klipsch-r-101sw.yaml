description: The Klipsch R-101SW is a compact powered subwoofer featuring a
  front-firing 10" spun-copper TCP woofer in a bass-reflex enclosure. It is
  driven by a 150W continuous / 300W peak all-digital amplifier with low-pass
  crossover and phase control.
details: |-
  The R-101SW is part of Klipsch's Reference series and delivers deep, accurate bass through its 10" high-excursion spun-copper TCP woofer. The Thermoformed Crystalline Polymer cone is exceptionally light while being extremely rigid, providing remarkable low-frequency response with minimal cone breakup and distortion.

  The built-in all-digital amplifier delivers 150W continuous / 300W peak power with high efficiency and true-to-source accuracy. Amplifier controls include volume, low-pass crossover frequency, 0/180-degree phase switch, and auto power-on.

  The bass-reflex enclosure uses a rear-firing port and is constructed from reinforced 3/4" MDF with an all-new bracing design that reduces cabinet vibration for less audible coloration and improved sonic accuracy. The exterior is finished in a scratch-resistant black textured wood grain vinyl.

  Additional features include a low-profile acoustically transparent grille and a front-mounted LED power indicator. LINE/LFE RCA inputs ensure compatibility with standard home theater receivers.
