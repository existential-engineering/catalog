  - Channels: 2
  - Output wattage: 20W (with power reduction option to 5W), <1W
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), DI output, Compensated DI output
  - Controls: Treble, middle, bass and presence
  - Effects: Integrated spring reverb
  - Effects loop: Built-in effects loop
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x 5881
