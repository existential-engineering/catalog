description: Compact 20W hybrid valve guitar amplifier head delivering the
  iconic JCM900 crunch in a portable studio-friendly form. Combines valve warmth
  with the reliability and versatility of solid-state components, featuring two
  channels (clean and lead), built-in spring reverb, and a series effects loop.
  A power-attenuation switch lets you select 20W, 5W, or <1W output for any
  venue or recording environment. Hand-built at Marshall's factory in Bletchley,
  England.
details: |-
  - Iconic JCM900 crunch tone in a compact 20W package
  - Two channels (Clean and Crunch/High Gain) for versatile tone shaping
  - Hybrid design: valve warmth combined with solid-state reliability
  - Power attenuation switch: 20W, 5W, and <1W output settings
  - Built-in spring reverb
  - Built-in series effects loop
  - Two ECC83 preamp valves, two 5881 power amp valves, one ECC83 phase splitter
  - Treble, middle, bass and presence EQ controls
  - Hand-built in the UK at Marshall's Bletchley factory
specs: |-
  - Model: SN20H
  - Range: Studio
  - Output Wattage: 20W (with power reduction to 5W), <1W
  - Channels: 2 (Clean and Crunch/High Gain)
  - Technology: Hybrid (valve preamp/power section with solid-state components)
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x 5881
  - Controls: Treble, middle, bass and presence
  - Effects: Built-in spring reverb
  - Effects Loop: Yes (built-in effects loop)
  - Country Of Origin: Designed and engineered in UK. Made in UK.
