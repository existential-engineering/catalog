description: Compact 20W hybrid valve guitar amplifier head delivering the
  iconic JCM900 crunch in a portable studio-friendly form. Combines valve warmth
  with the reliability and versatility of solid-state components, featuring two
  channels (clean and lead), built-in spring reverb, and a series effects loop.
  A power-attenuation switch lets you select 20W, 5W, or <1W output for any
  venue or recording environment. Hand-built at Marshall's factory in Bletchley,
  England.
details: |-
  Featuring two ECC83 preamp valves, two 5881 power amp valves, and one ECC83 phase splitter, the Studio 900 Head faithfully captures the original 100W amp in a 20W output. Effortlessly switch between 20W, 5W, and <1W power attenuation settings and adapt the amp's output to any venue or recording environment.

  Combining the warmth and responsiveness of traditional valve amps with the reliability of modern technology, the Studio 900 Head delivers everything from sparkling cleans to screaming leads. Enjoy playing the authentic tones that made the original a legend.

  Crafted at Marshall's workshop in Bletchley, England, the Studio 900 is built to Marshall's standard of craftsmanship and passes the company's testing process before it ships.

  Small in stature, iconic in sound, the Studio 900 Head comes packed with features including a built-in effects loop and straightforward controls so you can effortlessly adjust gain, EQ, and volume. Dual channels offer an extensive array of tones, and you can configure each channel with different settings and switch between distinct sounds and styles.

  Add rich, dynamic layers to your sound with the Studio 900 Head's integrated spring reverb, enhancing the depth of your tone. Designed and engineered in UK. Made in UK.
specs: |-
