details: |-
  KRK KNS 8402 headphones provide an accurate listening experience in a highly durable package that is suited to a variety of uses. The closed-back, circumaural ("around the ear") design provides up to 30 dBA of isolation, which significantly reduces headphone bleed into the microphones when recording, and reduces distraction from external sounds while listening. Maximum SPL is 124 dB, with wide dynamic range and consistent low-distortion performance. The impact-resistant plastic construction is lightweight yet durable, a self-aligning yoke system sets the fit, and the form-fitting memory foam pads, head cushion and cable are field-replaceable. Supplied accessories include a connection cable with screw-in adapter fitted and an in-cord volume control slider, a protective soft bag, an anti-microbial cleaning cloth and a user manual.
specs: |-
  - Configuration: Closed Back, Circumaural
  - System Type: Dynamic Headphones
  - Cable: 2.5 m (8.2 ft), 99.99% OFC, Detachable
  - Ear Cushion Type: Acoustic Memory Foam
  - Head Pad Finish: Premium Leatherette
  - Nominal Headband Pressure: 4N (Based on Average Head Size)
  - Ambient Noise Isolation: Up to 30 dBA
  - Transducer: 40mm Neodymium
  - Nominal Impedance: 36 ohms
  - Frequency Response: 5Hz - 23kHz
  - Sensitivity (1mW): 97 dB SPL
  - Calculated Max SPL: 124 dB SPL
  - Connector: Gold-Plated Stereo 1/8" (3.5mm)
  - Volume Control: Detachable / Replaceable Low-Profile Inline Control
  - Finish: Black Impact Resistant Plastic
  - Dimensions: 3.7" (94mm) x 10.5" (268mm) x 9.6" (245mm)
  - Weight: 0.54 lb (0.247 kg)
