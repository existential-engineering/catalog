details: |-
  Few bassists have covered more ground over the years than Rudy Sarzo. When it came time for Rudy to update his signature instrument, Rudy worked very closely with Spector to ensure that the Euro4 LT RS would supply him with the feel and tone that his craft commands. Rudy's reimagined signature model was designed to be lightweight and comfortable for long gigs and sessions. As such, the fully carved body is crafted from chambered Empresswood and adorned with a unique Figured Maple top. The three-piece maple neck is complemented with a 24 fret Ebony fingerboard, adorned with Spector's signature Crown inlays. Additionally, the Euro4 LT Rudy Sarzo is outfitted with Spector's lightweight locking bridge and nut and Gotoh GB-350 tuners to keep the weight to a minimum. To make the most of this instrument, the Euro4 LT RS is equipped with the impressive Fishman Fluence electronics system, which offers an incredible array of tones for any situation. To top it off, Rudy's new bass features a high gloss Scarlett Red finish, which is exclusive to this model.
