description: Control every aspect of your playing with the 50W JVM205C. Two
  channels, each featuring three gain modes, mean this JVM is equally adept at
  playing cleans, metal, or anything in between. Add in the three-way EQ in each
  channel, the presence and resonance controls, and studio quality reverb, and
  you can expertly shape your tone and store it in the optional footswitch.
  Hand-built in Marshall's UK factory, the JVM is the ultimate toolbox for
  guitarists needing power, options and control. This 2x12" combo combines one
  Celestion Heritage G12H speaker and one Celestion Vintage speaker, creating
  the perfect blend to complement the voicing of the amp.
details: |-
  Intensify your tone with the JVM205 Combo. With two channels, each with three different modes, this amp can take you from clean to high-gain overdrive and anything in between.

  Whether you are experimenting, performing or recording, this versatile amp is the complete package. The two channels carry individual master volume controls, so a solo can be set apart from the rhythm sound.

  Built-in reverb controls are independent per channel, and the whole front panel can be stored and recalled from the programmable footswitch included in the box.

  The combo loads a Celestion Heritage G12H and a Celestion Vintage speaker, and carries two effects loops, an emulated XLR line out and MIDI in and thru for external switching.

  The JVM205 Combo is crafted in the traditional manner at the UK factory, from loading the circuit boards to the black and gold finish, with every amplifier in the series assembled by hand. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: JVM205C
  - Range: JVM
  - Channels: 2 (multi), each with three modes
  - Technology: Valve
  - Output wattage: 50W
  - Outputs: 5 x 1/4-inch jack speaker sockets (16 ohm load / 8 ohm load / 4 ohm load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4-inch jack instrument input, MIDI In, Footswitch
  - Controls: channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Speaker configuration: 2x12 inch
  - Speaker model: 1 x Celestion Heritage G12H (8 ohm, 80W), 1 x Celestion Vintage (8 ohm, 70W)
  - Unit impedance: 16 ohm
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 29.5 kg / 65 lb
  - Width: 690 mm / 27.2 inches
  - Height: 510 mm / 20.1 inches
  - Depth: 265 mm / 10.4 inches
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: Footswitch PEDL-91006 included, detachable power cable included
  - Colour: Black
