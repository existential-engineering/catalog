description: Control every aspect of your playing with the 50W JVM205C. Two
  channels, each featuring three gain modes, mean this JVM is equally adept at
  playing cleans, metal, or anything in between. Add in the three-way EQ in each
  channel, the presence and resonance controls, and studio quality reverb, and
  you can expertly shape your tone and store it in the optional footswitch.
  Hand-built in Marshall's UK factory, the JVM is the ultimate toolbox for
  guitarists needing power, options and control. This 2x12" combo combines one
  Celestion Heritage G12H speaker and one Celestion Vintage speaker, creating
  the perfect blend to complement the voicing of the amp.
details: |-
  - All-valve 50W 2x12" guitar combo
  - Two independent channels with three gain modes each (six total voicings)
  - Per-channel gain, three-band EQ, reverb, and master volume select
  - Shared presence and resonance controls
  - Studio-quality digital reverb (per channel)
  - Two effects loops: one series/parallel, one series
  - Emulated XLR line out for silent recording / direct to mixer
  - MIDI In and MIDI Thru for full channel/mode/effects recall
  - Programmable footswitch (PEDL-91006) included
  - 1 x Celestion Heritage G12H + 1 x Celestion Vintage speakers
  - Hand-assembled at Marshall's UK factory
specs: |-
  - Output Wattage: 50W
  - Channels: 2 (Multi)
  - Gain Modes: 3 per channel (green / orange / red) = 6 total voicings
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects Loop: 2, 1 x series parallel, 1 x series
  - Preamp Valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Speaker Configuration: 2x12"
  - Speaker Model: 1 x Celestion Heritage G12H (8Ω, 80W), 1 x Celestion Vintage (8Ω, 70W)
  - Unit Impedance: 16Ω
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Width: 690 mm / 27.2"
  - Height: 510 mm / 20.1"
  - Depth: 265 mm / 10.4"
  - Weight: 29.5 kg / 65 lb
