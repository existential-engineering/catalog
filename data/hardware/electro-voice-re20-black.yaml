description: Dynamic cardioid broadcast and vocal microphone in a dark charcoal
  finish. Variable-D design minimizes proximity effect, delivering the smooth,
  natural, controlled sonic character associated with the classic sound of FM
  radio voices.
details: >-
  The RE20 Black is the dark-charcoal, low-reflection edition of Electro-Voice's
  industry-standard RE20 dynamic cardioid microphone. Long a favorite for
  broadcasting, podcasting, and sound engineering worldwide, the RE20 has also
  become a premium choice for instrument recording — particularly kick drum,
  bass cabinets, and brass — thanks to a frequency response that holds up under
  high SPL while keeping a natural tonal balance.


  The defining feature is Variable-D: ports along the body of the microphone
  minimize proximity effect so the low end stays even as the talent works in
  close to the grille. A heavy-duty internal pop filter, internal element
  shock-mount, and humbucking coil further suit the mic to close voice work,
  rejecting plosives, mechanical vibration, and line hum. A mid-bass
  tone-shaping switch on the body lets the user tailor the low end without
  external EQ.


  Mechanically, the RE20 Black is built from steel and finished in dark charcoal
  — visually low-profile in on-camera environments. It measures 8.53 in (216.7
  mm) long with a maximum diameter of 2.14 in (54.4 mm), and weighs 1 lb, 10 oz
  (737 g). Output is a balanced 3-pin XLR connector at 150 ohms (Pin 2 hot). The
  microphone ships with an 81715 stand clamp; the 309A shock-mounted stand
  adapter is available separately for floor stand or boom mounting.
specs: |-
  - Element: Dynamic
  - Polar pattern: Cardioid
  - Frequency response: 45 Hz - 18,000 Hz
  - Impedance: 150 ohms balanced
