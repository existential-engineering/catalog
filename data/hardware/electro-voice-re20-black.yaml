  - Net weight: 1 lb 10 oz (737 g)
  - Shipping weight: 3 lb 4 oz (1474 g)
  - Case material: Steel
  - Finish: Dark charcoal (low reflection)
  - Included accessories: 81715 stand clamp
  - Optional accessories: 309A shock-mounted stand adapter
