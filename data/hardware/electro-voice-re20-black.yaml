  - Hum pickup: -130 dBm typical (60 Hz / 1 millioersted)
  - Polarity: Pin 2 positive referenced to Pin 3
  - Connector: 3-pin XLR
  - Variable-D design (minimizes proximity effect)
  - Internal pop filter
