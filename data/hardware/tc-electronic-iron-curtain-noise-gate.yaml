details: |-
  Has your guitar signal gotten a bit overcrowded due to noisy electrical wiring or Radio Frequency Interference (RFI)? IRON CURTAIN NOISE GATE is the no-nonsense way to banish your sound gremlins with its simple and intuitive 2-knob operation. Thanks to an all-analog design that features only the highest-quality components, and a zero-tolerance policy for unwanted noise – only the purest signal gets past the IRON CURTAIN!

  Stray noise can come from a variety of places: vintage amplifiers; single-coil pickups; light dimmer circuits – plus some venues just have a lot of inherent noise. If your performance calls for everything from sweet and soft passages with barely audible notes to wailing like there’s no tomorrow, IRON CURTAIN NOISE GATE’s all analog circuit blocks the noise and lets your tone through in all its glory.

  With only a Threshold and Decay knob to master, IRON CURTAIN NOISE GATE is simpler to operate than most overdrive pedals. The 2-knob layout makes it easy to dial in a superbly-responsive guitar sound, whether you’re grinding massive-gain metal, or playing blues on single coil pickups in a building that was handwired by Thomas Edison!

  As you might expect, IRON CURTAIN NOISE GATE is made out of iron. This sturdy little box is built to stand up to a full-frontal assault, so a little time on the road is easy. The top-mounted jacks make it ideal for the most compact pedal board, plus the true bypass design respects your tone – even when the pedal is off.
