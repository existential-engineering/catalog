details: |-
  The VSX118B is a direct radiating passive 18" subwoofer delivering 1,000 W continuous / 4,000 W peak power handling, ideally suited for speech and music sound reinforcement in fixed, portable, and touring audio systems. Its ported bass reflex design with a high-powered 18" low frequency driver provides extended low-frequency response to below 40 Hz with minimal distortion. The internally braced plywood enclosure features integral M10 rigging points, an optional VTH pole mount blanking plate, Integrip handles, and a rear connector plate with 4-pole industry-standard twist-lock speaker connectors plus barrier strip connectors for input and link output.
specs: |-
  - powerHandling: {'continuous': '1,000 W', 'peak': '4,000 W'}
  - driver: 18" low frequency driver
  - systemType: Ported bass reflex
  - frequencyResponse: below 40 Hz (low-end extended; upper limit not specified on page)
  - cabinet: Internally braced plywood
  - finish: Semi-matte black paint
  - grille: Powder-coated perforated steel mesh with reticulated foam backing
  - rigging: Integral M10 rigging points
  - handles: Integrip ergonomic handles (top of cabinet)
