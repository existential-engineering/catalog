details: |-
  Kaamos is a bass distortion and octaver pedal designed in collaboration with bassist and producer Amos Heller. It blends a powerful distortion with roaring octave-down tones, combining the signature voicing of the Alpha Omicron pedal with a dedicated sub-octave effect. A dedicated Sub output carries the low-octave signal on its own, and the signal path can be configured in series or parallel. A movable effects loop can be placed in six different positions in the chain for flexible routing, and a balanced XLR Direct Output feeds a mic preamp or PA. The pedal runs on standard 9V DC (center-negative) power.
specs: |-
  - Dedicated sub-octave output
  - Combines the signature tones of the Alpha Omicron pedal with a roaring octave-down effect
  - Series or parallel signal path options
  - Movable effects loop that can be placed in 6 different positions
  - Balanced XLR Direct Output
  - Standard 9V DC power (center-negative plug)
