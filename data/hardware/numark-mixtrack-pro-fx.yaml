description: Mixtrack Pro FX 2-Deck DJ Controller with Effects Paddles.
details: |-
  The Mixtrack Pro FX is a Serato DJ controller designed to inspire, develop and hone your DJ skills. It has everything you need to sound professional from the get-go: large 6-inch jog wheels, a 24-bit digital audio interface for pristine sound quality, six dedicated software effects buttons for easy transitions, 16 performance pads for hot cues, auto loop, fader cuts and sampling. Plus, you can even stream the music you love direct from TIDAL or SoundCloud via Serato DJ Lite! With Mixtrack Pro FX, everything the modern DJ demands is here - entering a world of pro DJ performance has never been simpler. Mixing Starts Here!

  Center stage on Mixtrack Pro FX are two all-new premium paddle triggers for effortless command over Serato's built-in software effects; there's even quick access buttons to essential effects including Echo, Reverb, Flanger, Phaser, HPF (High Pass Filter) and LPF (Low Pass Filter) - a sure-fire guarantee that everything you need for creating build-ups, crafting unforgettable transitions and adding your own unique spin to your mix is only a touch away!

  Mixtrack Pro FX's large 6-inch capacitive-touch jog wheels emulate an authentic turntable feel for scratching and precise cue placement, while the rugged grooves on the platters side enables you to nudge your mix perfectly into place.

  Get creative, remix and perform unforgettable mixes with Mixtrack Pro FX's 16 multi-function backlit performance pads! With dedicated quick-access pad mode buttons per deck for Hot Cues, Auto Loop, Sample and Fader Cuts (a signature crossfader effect that emulates a 1-4 click flare on the pads), reimagine and reinterpret your favourite tracks, creating something totally unique!

  Mixtrack Pro FX comes pre-mapped with Serato DJ Lite for Mac & PC (software included) and is upgrade-ready to the full version of Serato DJ. Fusing plug and play high speed USB connectivity, a dedicated mixer section outfitted with a full 3-band EQ, filter knobs, channel faders and a cross fader, plus an onboard microphone input, RCA outputs and a headphone output, Mixtrack Pro FX covers all your bases, catering for anything your next DJ set demands!
specs: |-
  - 2-deck DJ controller
  - (6) Fun, quick-launch effects with dual paddle triggers
  - Large 6-inch, high-resolution capacitive-touch jog wheels
  - Stream millions of tracks within Serato DJ Lite from leading providers including SoundCloud and TIDAL
  - Dedicated instant loop control with multiplier buttons
  - Full 3-band EQ and filter knobs to create audio sweeps
  - (8) Performance pads per deck to access cues, loops, fader cuts and samples
  - 24-bit audio output
  - Microphone input, RCA output and headphone output
  - Includes Serato DJ Lite download
  - Two months free access to SoundSwitch lighting software
  - Audio: 44.1 kHz, 24-bit
  - Power: USB bus power
  - Dimensions (width x depth x height): 21.1" x 9.7" x 2.0" (53.6 x 24.6 x 5.1 cm)
  - Weight: 5.35 lbs. (2.4 kg)
  - Mac system requirements: macOS Catalina 10.15, macOS Mojave 10.14, macOS High Sierra 10.13
  - PC system requirements: Windows 10 (64-bit only; 32-bit operating systems not supported)
