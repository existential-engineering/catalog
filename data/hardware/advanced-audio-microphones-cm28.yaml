  - Pad: -15dB (Via Switch)
  - Filter: HPF @ 80Hz (Via Switch)
  - Weight: 4.2 oz (119 g.) Size: 5 1/2" (140mm) length x 13/16" (21mm) diameter
  - Robust shock mount
  - Power Supply: 120/220VAC, 7-pin Neutrik supplying 6VDC & 125VDC
  - 30' 7-Pin Microphone cable
  - Aluminum Road case
