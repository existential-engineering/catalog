  - Circuit: Class A fet/tube hybrid featuring a 6J1b tube
  - Frequency Response: 20Hz to 20kHz (response relates to pattern type)
  - Impedance: 200 ohms(load impedance < 1.2K).
  - Max SPL: 124 dB/139dB with -15dB pad.
  - Distortion: < 1% THD @ 1KHz) 120dB, or at 135dB w/-15dB pad
  - Equivalent Noise: 14dB (A-weighted)
