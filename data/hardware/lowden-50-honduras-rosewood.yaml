details: |-
  Honduran Rosewood is renowned for its rich tonal depth, clarity, and sustain, making it a favourite among players who demand exceptional sound. Its natural density and smooth grain produce a balanced tonal profile with warm lows, articulate mids, and sparkling highs. Perfect for both fingerstyle and dynamic strumming, Honduran Rosewood delivers a truly versatile and responsive playing experience. During a talk by a wood scientist in Belgium some years ago George learned that, from the scientific point of view, Honduras rosewood is the best of the rosewoods as a tone wood because of its combination of density, fibre structure, and surface quality.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Honduran Rosewood back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
