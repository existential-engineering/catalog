url: https://www.allen-heath.com/hardware/everything-i-o/dt168/
description: The DT168 is a rugged, 96kHz portable expander for adding remote
  I/O to a Dante equipped dLive, Avantis, SQ, Qu, or AHM system.
details: |-
  The DT168 is a rugged, 96kHz portable expander for adding remote I/O to a Dante equipped dLive, Avantis, SQ, Qu, or AHM system.

  Provides 16 microphone preamps and 8 line outputs in a convenient stagebox form factor.

  16 Mic Preamps with +60dB of gain, Phantom Power indicators and -20dB pad for line level sources.

  8 Balanced, relay protected Line Outs on XLR.

  Choose between standard 48kHz operation and high-fidelity 96kHz operation.

  Primary and Secondary Dante ports on locking EtherCon connectors for daisy-chain or redundancy.

  Up to 32 DT168 expanders can be added to a Dante-equipped AHM, Qu, SQ, Avantis or dLive system.

  Direct preamp control from dLive, Avantis, AHM-64 and SQ; also remote preamp control via DT Preamp Control software (Windows / macOS) for integration with 3rd party Dante systems.

  Rugged stagebox design with hard-wearing rubber bumpers and a sturdy carry handle for portable use in rental, education, houses of worship and other environments.

  Weighs 4.8kg. Optional 4U 19-inch rack mounting kit available for installation in standard racks.

  AES67 compatible and Dante Domain Manager ready.
specs: |-
  - 16 in / 8 out over Dante
  - Dante audio expander (96kHz / 48kHz operation)
  - 16x Mic Preamps on XLR with +60dB gain, Phantom Power status LEDs and -20dB pad
  - 8x Balanced, relay protected Line Outs on XLR
  - Primary and Secondary Dante ports with locking EtherCon connectors
  - Redundant or Switched Dante mode
  - Direct preamp control from dLive, Avantis, AHM-64 and SQ
  - Remote preamp control via DT Preamp Control software (Windows / macOS)
  - AES67 compatible
  - Dante Domain Manager ready
  - Portable stagebox design with rubber bumpers and carry handle
  - Weight: 4.8kg
  - Optional 19-inch 4U rack mount kit available
