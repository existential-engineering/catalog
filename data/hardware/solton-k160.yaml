description: >-
  The Solton K160 is a digital-analog hybrid preset synthesizer developed by
  Italian company Ketron Laboratories in 1990. It features 8-voice polyphony
  with 16 digital oscillators routed through eight CEM 3389 analog filter chips,
  housed in a 61-key velocity-sensitive keyboard. The 128 factory presets cover
  pianos, strings, brasses, organs, guitars, and basses, with 32 user Programs
  allowing up to 8 presets to be layered or split across the keyboard.
details: |-
  The K160 represents an interesting approach to synthesizer design from the early 1990s, combining digital oscillators with analog signal processing via eight CEM 3389 chips. This hybrid architecture allowed the manufacturer to reduce costs while maintaining analog character in the signal path. The instrument was positioned as an affordable option with a plastic body construction.

  The control layout reflects budget-conscious design priorities. Pitch bend and modulation wheels are positioned at the very top of the panel, while separate volume sliders enable real-time MIDI control of external instruments. A small LCD display sits behind a metal strip, with tuning and brightness adjustment knobs located on the rear panel.

  Sound editing capabilities are intentionally limited. The 128 factory presets across four banks cannot be modified, but the user section contains 32 Programs (called Performances) that allow up to 8 presets to be freely layered or split across the keyboard. Per-preset parameters include oscillator allocation, filter cutoff, resonance, portamento speed, velocity response toggle, and note shifting.

  The pipe organ emulation is notably impressive and considered better than many later keyboards, though acoustic instrument reproductions sound dated by modern standards. Programs support individual MIDI channel assignment and can be stored via memory dump to external sequencers, as there is no internal storage media. No effects processing is included. Solton also offered the cheaper K80 with 64 presets, 16 programs, and monophonic output, as well as rack versions (M160 and M80) for studio integration.
specs: |-
  - Keyboard: 61 velocity-sensitive keys
  - Polyphony: 8 voices
  - Multitimbral: 8 parts
  - Oscillators: 16 digital oscillators
  - LFO: Yes
  - Filters: 8 VCFs (CEM 3389 chips)
  - Envelope: VCA with envelope (fixed/non-editable)
  - Effects: None
  - Arpeggiator/Sequencer: None
  - Memory: 128 Presets (4 banks), 32 Programs/Performances
  - Control: MIDI In/Out/Thru
  - Outputs: Stereo Left & Right, Phones
  - Pedal Input: Release Pedal
  - Year Produced: 1990
  - Manufacturer: Ketron Laboratories (Italy)
