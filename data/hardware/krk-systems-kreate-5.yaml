description: The Kreate 5 is a bi-amplified two-way active studio monitor with a
  5-inch woven glass fibre composite woofer and a 1-inch textile dome tweeter.
  It takes a balanced XLR / 1/4-inch TRS combo input, an unbalanced RCA input
  and Bluetooth.
details: |-
  The KRK KREATE SERIES monitors bring KRK studio monitoring performance to musicians, engineers, producers and content creators. Available in three sizes, these two-way studio monitors are designed for the needs of creative professionals.

  KREATE SERIES monitors offer acoustic boundary condition and tuning EQ combinations to help correct problems in the room and dial in the voicing. Composite woven glass fibre cone woofers provide dynamics with good damping and modal breakup control. High frequency reproduction comes from a woven textile dome tweeter with a neodymium motor.

  For transient response and dynamics reproduction, the amplifiers drive the transducers efficiently at reduced operating temperatures to maintain audio integrity during long sessions.
specs: |-
  - Configuration: 2-way bass reflex
  - System type: active studio monitor
  - Low-frequency driver: woofer, 5-inch, woven glass fibre composite cone, ferrite magnet
  - High-frequency driver: tweeter, 1-inch, textile dome, neodymium magnet
  - Frequency response (+/- 3 dB): 58 Hz to 40 kHz
  - LF frequency range (-10 dB): 46 Hz
  - Crossover frequency: 2.56 kHz
  - Amplifier configuration: bi-amplified, LF Class D, HF Class A/B
  - LF amp power output: 45 W
  - HF amp power output: 15 W
  - Total power: 60 W
  - Total dynamic power output: 128 W
  - Max SPL: 105 dB
  - Coverage angles: 135 degrees horizontal x 90 degrees vertical
  - Analog audio inputs: balanced XLR / 1/4-inch TRS combo, unbalanced RCA
  - Wireless input: Bluetooth Classic 5.3 TWS A2DP
  - Signal to noise ratio: >94 dB
  - AC input voltage: 100 to 240 VAC (+/- 10%), 50/60 Hz
  - Fuse type: T4AL/250 V, not user serviceable
  - Enclosure construction: PVC vinyl wrapped MDF
  - Baffle construction: MDF with reinforced high impact polystyrene faceplate
  - Product dimensions each (H x W x D): 10.20 in (259 mm) x 7.28 in (185 mm) x 9 in (229 mm)
  - Product weight: 9.5 lb (4.3 kg)
