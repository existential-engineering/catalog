description: A Lowden 50 Series acoustic guitar with Macassar Ebony back and
  sides, producing crisp, articulate treble with rich, full, resonant bass.
details: |-
  Macassar Ebony produces a crisp, articulate treble that shines through without being harsh. The high end is clean and open, providing excellent note definition, which is especially noticeable in fingerstyle playing and light strumming. The bass tones from Macassar Ebony are rich, full, and resonant. While not as boomy as some other hardwoods, the bass has a solid foundation that complements the overall balance of the instrument. It provides warmth and depth, making the guitar versatile for different playing styles.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Macassar Ebony back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 50 Series
  - Back and sides: Macassar Ebony
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
