details: |-
  The ADX40 is a miniaturized condenser microphone designed to hang from an overhead position for applications such as group vocals, choir, theatrical production, and room ambiance.

  Having a uniformly controlled cardioid polar pattern, the ADX40 helps isolate the area or section being miked from other vocals or instruments on stage. The ADX40 is also available in a hypercardioid polar pattern for tighter pick-up control. With a wide frequency range of 40 Hz – 20 kHz, the ADX40 provides natural sound with an exceptional sound response.

  The ADX40 miniature hanging condenser microphone is supplied with an attached 30′ shielded cable, external windscreen, wire hanger for positioning, and phantom power adapter. 9 – 52 V phantom required.
specs: |-
  - Polar pattern: Cardioid or Hypercardioid
  - Frequency response: 40 Hz - 20 kHz
  - Cable: 30' attached shielded, to XLR via external phantom power adapter
  - Phantom power: 9-52 V required
  - Includes wire hanger and external windscreen
