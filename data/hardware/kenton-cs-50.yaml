details: |-
  A MIDI retrofit kit for the Yamaha CS-50. It adds MIDI reception for notes, program change, pitchbend, modulation, low pass filter cutoff, portamento, sustain and volume. The kit receives MIDI only, and no MIDI can be sent from the instrument.

  Any MIDI channel can be selected. Notes cover MIDI note numbers 36 to 96 and can be transposed. Program change responds to numbers 1 to 14 on the top row and 17 to 30 on the bottom row, and pitchbend bends up and down a fifth. The mod wheel has a switch to enable it.

  By default pitchbend follows pitchbend messages, the mod wheel follows CC#1 and aftertouch, filter cutoff follows CC#16, resonance follows CC#17, volume follows CC#7, sustain follows CC#64 and portamento follows CC#65. Any controller, aftertouch or velocity can be mapped to control something else, so velocity could be mapped to volume for example.

  Added hardware consists of MIDI In and MIDI Thru DIN sockets and a push button for programming the MIDI setup. Setups are held in non-volatile EEPROM memory.

  The kit comprises a circuit board that fits in the base of the CS-50, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions and a step by step fitting guide with diagrams. All kits are checked and tested before despatch. The kits are not intended for installation by the end user and should always be fitted by an experienced synthesiser engineer, this model being the hardest of the range to fit.
specs: |-
  - Fits the Yamaha CS-50
  - Receives MIDI only; the instrument cannot send MIDI
  - Adds MIDI In and MIDI Thru DIN sockets plus a programming push button
  - Any MIDI channel can be selected
  - Note range: MIDI note numbers 36 to 96, transposable
  - Program change: numbers 1 to 14 on the top row and 17 to 30 on the bottom row
  - Pitchbend bends up and down a fifth
  - Default assignments: CC#1 mod wheel, CC#7 volume, CC#16 filter cutoff, CC#17 resonance, CC#64 sustain, CC#65 portamento
  - All controller assignments are remappable
  - Setups stored in non-volatile memory (EEPROM)
  - Circuit board fits in the base of the CS-50
  - Powered from the host synthesiser, so the kit has no power input of its own
