description: Jim Root's punishing six-string barrage has been synonymous with
  Iowa metal institution Slipknot for over 20 years, and Charvel is honored to
  present the towering guitarist with his own super-heavy sounding,
  high-performance signature model.
details: |-
  The Jim Root Signature Pro-Mod San Dimas Style 1 HH FR E pairs a mahogany San Dimas Style 1 body featuring a scalloped lower back bout with a Satin White finish. The bolt-on maple neck includes graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays and Luminlay side dots, anchored by a Floyd Rose 1500 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a pair of white-bobbin EMG Jim Root Signature Daemonum open-coil active humbuckers in the bridge and neck positions, routed through a 3-position blade switch (bridge, bridge + neck, neck) with a single Strat-style skirted volume knob.

  Hardware includes a Floyd Rose 1500 Series double-locking tremolo with a locking tremolo arm, Charvel-branded die-cast locking tuning machines, a Floyd Rose retainer bar string tree, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build. Ships with an included Charvel Multi-Fit Hardshell Gig Bag.
