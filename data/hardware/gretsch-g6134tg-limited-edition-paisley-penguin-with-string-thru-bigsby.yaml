details: |-
  The Limited Edition Paisley Penguin offers an elegant take on a classic Gretsch design. This Penguin features a chambered mahogany body with arched maple top that is gloriously adorned with a black edge burst finish over a black paisley and silver sparkle top.

  A pair of TV Jones TV Classic pickups provides cutting, twangy notes with a hint of growl similar to vintage late-1950s Filter'Trons, making it ideal for distinctive rock 'n' roll licks, chiming country rhythms, and everything in between.

  The chambered mahogany body wears aged white binding with B/W/B purfling and a 2" depth, while the set mahogany neck with Standard "U" profile carries a 12"-radius ebony fingerboard with 22 medium jumbo frets, mother of pearl Neo-Classic thumbnail inlays, and a 24.6" scale. Gold-finished hardware includes an Adjusto-Matic bridge, Bigsby B3GP String-Thru vibrato, and Grover Imperial locking tuners. Ships in a G6238XL Gretsch solid body hardshell case.
