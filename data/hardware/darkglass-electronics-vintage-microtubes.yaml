details: |-
  The Vintage Microtubes is a bass overdrive pedal from Darkglass's Core series, a tribute to legendary rock sounds. It delivers warm tube-like tones with a natural dynamic response that emulates vintage tube amps and reel-to-reel tape machine compression.

  The Level control sets the volume of the overdriven signal and Drive controls the amount of saturation. Blend mixes the clean input signal with the overdriven signal while maintaining unity gain on the clean channel.

  The Era control shapes the pedal's character by interacting with the Drive knob: lower settings yield warm 70s midrange tones, while higher settings produce punchy 80s and 90s metallic tones.

  The pedal runs on a regulated 9V DC adapter with a center-negative plug.
specs: |-
  - Bass overdrive pedal, vintage tube and tape voicing
  - Level: sets the volume of the overdriven signal
  - Drive: sets the amount of saturation
  - Blend: mixes the clean input with the overdriven signal at unity gain
  - Era: interacts with Drive to shape character (70s warmth to 80s/90s bite)
  - Dimensions: 75mm W x 111mm L x 43mm H, 250g
  - Power: regulated 9V DC, center-negative, 20mA
