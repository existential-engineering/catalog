description: MiniFreak Stellar is a special edition of the mighty polyphonic hybrid
  keyboard. The same dual digital sound engines, gnarly analog filters, advanced
  modulation, sequencing and stereo effects, but with a dark intergalactic edge
  that will take your sound into deep space and beyond.
details: |-
  With 2 engines, 6 voices and 23 oscillator modes, minifreak stellar is a compact synth powerhouse that just keeps getting better with ongoing free firmware updates.

  Includes arturia modes like granular, sample, superwaves, karplus strong, wavetable and audio in, mutable instruments open-source plaits modes like speech and modal, and 3 modes designed with la modular heavyweights noise engineering.

  Minifreak stellar comes with a free sound bank designed for outer space sonic exploration. Featuring a range of synths, leads, sequences and sfx - travel beyond the event horizon and discover an otherworldly realm of ambient and atmospheric sounds.

  Enjoy the same wild hybrid sound in your DAW of choice, complete with modeled analog filters, with minifreak v, a like-for-like VST. Use the same presets physically or virtually, and tweak the VST with minifreak stellars controls for a seamless creative flow.
specs: |-
  - 6-voice polyphonic hybrid synthesizer
  - 37-note velocity-sensitive slim-key keybed with aftertouch
  - 2 sound engines with 31 oscillator modes in total
  - Virtual analog oscillator mode
  - FM oscillator mode
  - Additive oscillator mode
  - Granular oscillator mode
  - Wavetable oscillator mode
  - Sample oscillator mode
  - Karplus strong oscillator mode
  - Speech oscillator mode
  - Modal oscillator mode
  - Comb filter mode
  - Filter mode
  - Destroy mode
  - Ring mod mode
  - Polyphonic state-variable resonant filters with low-pass, band-pass, and high-pass modes
  - Self-oscillating filters
  - ADSR envelope with 4 modes: polyphonic, monophonic, paraphonic, and unison
  - Shape-adjustable second envelope with run or loop modes
  - 2 LFOs with free-running or synced operation
  - Custom LFO shaper
  - 7 modulation sources with dozens of destination combinations
  - 3 FX engines with 13 FX to choose from on each engine
  - Ext vocoder FX
  - Self vocoder FX
  - Single-knob operation with crystal-clear display
  - Shift secondary settings
  - Pitch bend and mod touch strips
  - Macro controls
  - Spice & dice randomization
  - Sequencer with octave shifting and ratchets
  - Arpeggiator
  - MIDI in/out/thru connectivity
  - USB connection for updates and preset management
  - Analog sync connectivity
  - Audio in mode for processing external signals
  - Minifreak v VST software instrument
  - Firmware 3.0 with sampling capability
  - All-black exterior with intergalactic graphics
  - Free outer space sound bank
