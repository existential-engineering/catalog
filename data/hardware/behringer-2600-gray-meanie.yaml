description: A limited edition homage to the ARP 2600, the 2600 GRAY MEANIE is a
  semi-modular analog synthesizer with 3 VCOs, a multi-mode VCF and a mechanical
  spring reverb in an 8U rack-mount format. Compared to the standard Behringer
  2600 it adds hand-picked components and uni-color LEDs on each fader behind a
  gray face plate.
details: |-
  Great care has been taken in engineering the GRAY MEANIE's true-to-the-original analog circuitry, semi-modular architecture and triple VCO design, all of which come together to recreate the classic tones evocative of classic electronic music. This highly-focused attention to detail gives the GRAY MEANIE its ultra-flexible sound-shaping capability, which then empowers you to recreate amazing tones, from super-fat bass and tasty leads, all the way to full-on dreamy ambience from the far reaches of your imagination.

  Just like the original, the GRAY MEANIE is a semi-modular synthesizer that allows you to start making music without having to plug patch cables into different modules. The GRAY MEANIE also features 93 patchable ins and outs, so you can configure the synthesizer any way you want.

  The GRAY MEANIE features 3 VCOs with FM inputs. The VCOs' default waveforms can be patched to square, triangle, saw, sine or pulse, which allows for an awe-inspiring palette of tonal possibilities. Any of the VCOs can also be switched to operate as a low frequency oscillator, while the multi-mode VCF acts as the VCO mixer of the GRAY MEANIE where VCOs one, two and three can be blended. Combined with its integrated resonance control, filter mode switch and the ability to output to other areas of the synth, the GRAY MEANIE becomes a flexible tool for creating a diverse palette of tones.

  An incredible range of modules and effects are at your disposal including a ring modulator, lag processor, sample and hold, Schmitt trigger, envelope follower, a noise generator with continuously variable color and even a mechanical spring reverb to add spaciousness and a sense of scale to your music. There are also 2 dedicated LFOs with pulse and sine wave outputs.

  The VCA section of the GRAY MEANIE offers even more tone-shaping possibilities alongside the VCF, which can then be blended in the Mixer section. Within the VCA section, you can set the initial gain of the circuit and route signals to any of the input jacks and adjust the gain using the sliders. The VCA also features differential inputs for both linear and exponential response, which accept control voltage signals via 3.5 mm jacks.
specs: |-
  - Semi-modular analog synthesizer in 8U rack-mount format
  - Pure-analog signal path based on authentic ARP 2600 circuitry from the 1970s with matched transistors and JFETs
  - Authentic reproduction of the ARP Gray Meanie circuitry with specially selected opamps and transistors
  - 3 VCOs, each with LFO mode, FM inputs and multiple wave-shape outputs (square, triangle, saw, sine, pulse)
  - Multi-mode VCF with resonance control, dedicated low-pass output and additional switched high/notch output
  - VCF doubles as the VCO mixer, blending VCOs 1, 2 and 3
  - Mechanical spring reverb
  - Ring modulator, lag processor, sample and hold, Schmitt trigger and envelope follower
  - Noise generator with continuously variable color
  - 2 dedicated LFOs with pulse and sine wave outputs
  - ADSR and AR envelope generators with switchable Time Factor (x2, x1, x0.5)
  - Differential (+/-) input VCA with both linear and exponential control inputs via 3.5 mm jacks
  - Switched Post Filter Distortion (PFD) / Inverter option on voltage processor
  - Additional attenuator, mixer, inverter, slew rate limiter and 4-way multiple
  - External audio input for processing external sound sources
  - 78 faders and buttons
  - 93 patchable inputs/outputs
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - Uni-color LEDs on each fader
