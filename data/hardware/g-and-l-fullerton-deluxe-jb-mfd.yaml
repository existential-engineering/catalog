details: |-
  The 2025 Fullerton Deluxe JB MFD combines the classic JB platform with G&L's powerful Magnetic Field Design (MFD) pickups, delivering exceptional tone, clarity, and versatility. Built for musicians who value timeless aesthetics blended with modern sonic capabilities, the JB MFD provides a dynamic range of sounds suitable for any style or setting.

  Designed for players seeking advanced playability and classic style, the Fullerton Deluxe JB MFD is available with an alder or swamp ash body. Leo Fender's innovative MFD pickups offer increased output and tonal depth, while the slim, hard-rock maple neck is finished with a comfortable vintage gloss. A 9 1/2" radius fingerboard and Jescar 57110 medium-jumbo nickel-silver frets ensure smooth and effortless performance.

  Additionally, Leo Fender's acclaimed Saddle-Lock bridge enhances sustain by efficiently transferring string vibration directly into the body end-grain, maximizing resonance and clarity.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be meticulously crafted at the historic CLF Research facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Pickups: Two G&L vintage MFD jazz pickups
  - Body wood: Alder or Swamp Ash
  - Neck wood: Natural Satin Hard Rock Maple with Rosewood or Maple
  - Neck profile: G&L 1 1/2" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: Dual volume controls, one tone control
  - Includes: G&L Deluxe Gig Bag
  - Available in: Silver Metallic over Alder, 3-ply Mint pickguard, Rosewood fingerboard
  - Available in: Vintage Natural over Swamp Ash, 3-ply Black pickguard, Maple fingerboard
