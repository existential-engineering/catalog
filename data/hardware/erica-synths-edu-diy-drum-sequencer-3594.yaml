description: Hands-on rhythm engine.
details: |-
  Most drum sequencers are complex machines, packed with buttons and LEDs and all driven by a microcontroller. The mki x es.edu DIY Drum Sequencer kit takes the opposite approach: a hands-on rhythm engine with a minimalist interface, built from just a handful of logic chips.

  Each of the sequencer's four channels is programmed in real time using a single button. Patterns loop automatically, can be shortened on the fly, and support half-time playback for slower, evolving grooves.

  Accents are handled using synced LFOs, while a simple resistor-DAC turns patterns into stepped control voltages, which suits modulating pitch, decay or other parameters.

  The kit suits anyone looking to learn about sequencer design, sharpen soldering skills, or simply wanting a drum sequencer that plays like an instrument. It packs surprising depth into a refreshingly simple interface.

  The panel is 34HP wide and power draw is 27mA on the +12V rail and 20mA on the -12V rail.
specs: |-
  - 4 independent channels with one-button step input/removal
  - 16 steps per channel, individually reducible to 12 or 7
  - Optional half-time mode per channel
  - Two syncable analog LFOs for dynamic accents
  - Resistor-DAC output for pitch or decay modulation
  - Internal clock with 16th, 8th, and quarter note outputs, syncable to external gear
  - Module width: 34HP
  - 27mA @+12V; 20mA @-12V
