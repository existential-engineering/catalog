description: |-
  The MUON represents a triumph of form marrying function — perhaps the most
  extraordinary loudspeaker ever conceived. A collaboration between KEF's
  engineering expertise and industrial design by Ross Lovegrove, each unit is
  individually crafted and carefully measured in KEF's highly accurate anechoic
  chambers, with a certificate displaying its unique frequency response curve.
  Limited to 100 pairs.
specs: |-
  - Design: Four-way closed box floorstanding loudspeaker
  - Construction: Super-formed aluminium (6mm shell) with ACE enclosure
  - Drive Units: 6 × 250mm LF; 1 × 250mm lower mid; 1 × 125mm Uni-Q midrange;
    1 × 25mm Uni-Q tweeter
  - Frequency Response: 25Hz–60kHz (±3dB)
  - Sensitivity: 90dB (2.83V/1m)
  - Impedance: 4 Ohms
  - Amplifier Power: 100–400W
  - Maximum Output: 118dB
  - Crossover: 120Hz, 300Hz, 2.3kHz
  - Dimensions: 2000 × 600 × 380mm
  - Weight: 115kg
  - Edition: Limited to 100 pairs
