description: A dual-channel Eurorack module offering function generator,
  oscillator, slew limiter, envelope, and VCA functionality per channel,
  cascadeable for more channels.
details: |-
  DARV - Dual Attack, Release, & VCA

  Two channels of function generator, oscillator, slew limiter, envelope, and VCAs. This is half of our QARV module but is cascadeable. So you get two channels of modulation or a two channel envelope generator w/ mixer. You can then connect multiple units together to cascade to get 4, 6, or 8 channels. It can also be connected to our Mixer lineup (Bartender/Barback) so you don't have to use a channel on your final mixer. Both channels have the following features:

  Channel 1

  Channel 2:

  QARV patch guide by Robots Are Red - Patch Guide
specs: |-
  - Uni-polar oscillator mode
  - Attack and release time control via potentiometer and via input jack
  - Shape control that controls shape for both attack and release
  - Output attenuverter
  - VCAs that normal to each subsequent channel (CH1 -> CH2, etc.). So you can get a mix of all channels out of the CH2 VCA output (unless you patch a VCA output from an earlier channel)
  - Voltage source (5V)
  - Can be switched between IN (slew mode) and TRIG (envelope) mode
  - RISE and FALL gates. You can use our G&T module to turn these gates into triggers.
  - Cycle times 50sec - 1kHz (0.5ms)
  - Bi-polar oscillator mode
  - Dedicated IN and TRIG jacks (helpful for adding offset to a triggered ENV)
  - BOTH input jack to simplify patching both the attack and release (also inverts the input to give more standard pitch tracking of higher voltage equals higher pitch)
  - Cycle times 200sec - 1kHz (0.5ms)
