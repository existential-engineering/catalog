description: Modular Instrument Synthesizer with analog and digital synth
  heritage, advanced processing and high performance signal path.
details: |-
  Enzo X is an expansion from the original Enzo into a polyphonic synthesizer in a pedal format, requiring no pickup installation. It uses the UI first developed for LVX, with 5 synth modes including a 6-voice polyphonic synth and modules covering ambience, modulation, filters, drives and more.

  Enzo X combines 5 synth modes into a modular system UI and architecture adapted from the LVX and MercuryX pedals: 6 polyphonic voices, each with 2 oscillators, a filter, a filter envelope and an amplifier envelope, plus 3 reverbs adapted from MercuryX's Prism algorithm, 5 drive types including bit crush, a full stereo 2.5 second delay, and 5 modulation types.

  Enzo X provides stereo input and output with separate jacks for each, MIDI in and out over standard five-pin DIN jacks, a dedicated expression pedal jack, and a USB-C port for firmware updates and MIDI over USB. Switchable input and output headroom accommodates instrument or line/synth levels, and the unit runs on 9V DC power.
specs: |-
  - 5 synthesizer modes including Mono, Polyphonic and Dry Processing modes
  - 6 fully polyphonic voices available simultaneously
  - Polyphonic pitch detection with no special pickup necessary
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Sample Rate: 48000 Hz
  - Input Impedance: 1 Meg Ohm
  - SNR: 115 dB Typical
  - Frequency Response: 20Hz-20kHz
  - Max Input Level: +9 dBu (instrument level setting), +12.5 dBu (line/synth level setting)
  - Power: 9V DC center-negative, 300mA, 2.1mm jack
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Dimensions: 7.25" wide x 4.5" long x 2" tall
  - Weight: 24 ounces
