description: The Double Cat sounds like nothing else. It is made from solid
  alder featuring large sound chambers, fitted with a flat maple top featuring a
  Cat Eye styled F-Hole.
details: |-
  The Double Cat is a chambered instrument, made from solid American alder with large sound chambers routed into it, which Duesenberg describes as giving a tone between a solid and a semi-hollow construction while reducing weight. The body is fitted with a laminated maple top carrying a Cat Eye styled f-hole, cream binding with three-layer purfling, a cream pickguard and a PUR lacquer finish. The maker credits that combination of a chambered alder body, flat top and one-piece maple neck for the model's particular voice.

  The neck is a set one-piece maple neck in a Medium D shape with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets and a 648 mm / 25.5 inch scale length, over a steel dual-action truss rod and under a black headstock. Every instrument is Plek processed so the frets are perfectly level, then finished by hand and set up by a luthier, who signs the inside of the instrument.

  The pickup set pairs a Duesenberg Domino P90 single coil at the neck with a classically wound GrandVintage humbucker at the bridge. The middle position of the heavy duty three-way switch uses a special wiring that splits certain low-end frequencies out of the humbucker signal for a more open and versatile sound. Duesenberg uses German silver for the pickup baseplate and cover, on the grounds that it is the one material that does not affect the frequencies the pickup transmits, and winds the coil slowly with insulated wire from an old German copper wire factory to imitate hand winding. Controls are one volume, one tone and the three-way selector.

  Hardware is nickel finished. The six-string carries Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and the Diamond Deluxe Tremola vibrato, which the maker cites for its tuning stability and its suitability for subtle or dramatic chord modulation. The Z-Tuners are designed for a smooth, precise tuning feel and let the cut-off end of each string be hidden inside the tuner shaft.

  A Duesenberg Custom Line Bag is included, with internal high impact padding, a black plush lining, external storage pockets, an adjustable neck pillow and shoulder straps that tuck away so the bag can be carried like a case. A Duesenberg Custom Line Case for Double Cat is available separately, and all required allen keys are included.
