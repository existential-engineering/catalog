  - name: Word Clock Output 1
    signalFlow: output
    category: digital
    type: word clock
    connection: bnc
    maxConnections: 1
    position: Right
  - name: Word Clock Output 2
    signalFlow: output
    category: digital
    type: word clock
    connection: bnc
