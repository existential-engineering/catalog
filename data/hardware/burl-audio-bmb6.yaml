name: BMB6 AES/EBU
manufacturer: burl-audio
primaryCategory: audio-interface
categories:
  - rack-mount
  - digital
url: "https://www.burlaudio.com/products/motherboards/bmb6"
description: "AES/EBU motherboard exclusively for the B16 Mothership, providing
  8 channels of AES/EBU I/O via DSUB25 connector for easy interfacing with any
  AES/EBU device at all sample rates."
specs: |-
  - 8 channels AES/EBU I/O via DSUB25 (Tascam format)
  - 1 BNC word clock input
  - 2 BNC word clock outputs
  - 8-channel IO at all sample rates
  - Designed exclusively for B16 Mothership (not compatible with B80)
io:
