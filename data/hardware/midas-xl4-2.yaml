url: "https://www.midasconsoles.com/en/products/0838-ABB"
description: "XL4-2 is a classic 2-channel vacuum tube mic preamp. It's designed
  to work great with vocals, instruments and any line-level source while also
  giving you that rich vacuum tube sound in any kind of studio setup, modern or
  vintage, thanks to its premium 12AX7s that provide exceptional warmth and
  dynamic response."
details: |-
  Versatile Tube Preamp: XL4-2 is a classic 2-channel vacuum tube mic preamp designed to work great with vocals, instruments and any line-level source, thanks to its premium 12AX7s that provide exceptional warmth and dynamic response. Intuitive Control Layout: Each channel features a wide-range, precision gain control that lets you adjust input gain between 20 dB and 72 dB. Front panel switches include toggles for Pad, 48 V, Low Cut and Phase Reverse. The AIR setting boosts a specific frequency to add more presence and clarity to the signal when you need it. Functional Visual Design: The vintage-style VU meters allow you to check levels of each channel while XL4-2's 12AX7s are visible from the front panel for easy monitoring. Warmth and Durability: XL4-2 can imbue any recording with a warmth and richness that can only be heard from a classic tube circuit thanks to its premium, hand selected 12AX7s. Its rugged enclosure also ensures that it will survive any touring rig or studio setup for many performances and recordings to come.
specs: |-
  - Input Type: 2 x XLR, balanced
  - Input Impedance: 3 kΩ
  - Max. input level: +7 dBu pad out, +37 dBu pad in.
  - Gain: +20 to +72 dB
  - Mic EIN @ 72 dB gain: -128 dBu, 22 Hz to 22 kHz unweighted
  - CMRR @ 72 dB gain: Typically >80 dB
  - PAD: -30 dB
  - Output Type: 2 x XLR, 2 x 1/4" TRS, balanced
  - Output Impedance: < 50 Ω balanced
  - Max. output level: +27 dBu
  - Frequency response (microphone): 10 Hz to 50 kHz, ±0.5 dB
  - Distortion (THD+N): < 0.4% typical, 20 Hz to 20 kHz @ +20 dB gain
  - EIN Noise: < -100 dBu, 20 Hz - 20 kHz unweighted @ +20 dB gain
  - Dynamic range: > 107 dB typical (20 Hz to 20 kHz unweighted)
  - Crosstalk: < 100 dB @ 1 kHz, +20 dB gain
  - Buttons: 2 x Pad, 2 x +48 V Phantom power, 2 x Low cut filter (12 dB per octave, 50 Hz), 2 x Polarity reverse, 2 x Air (+3 dB boost at 6 kHz), 1 x GND lift (rear panel)
  - Controls: 2 x Gain, +20 to +72 dB
  - Meters: 2 x Output level meters, -30 to +10 dBu
  - Switch: On/off power switch with LED indicator
  - Mains voltage: 100 - 240 V~, 50/60 Hz
  - Power consumption: 30 W max
  - Fuse: T 1A H 250 V
  - Mains connection: Standard IEC receptacle
  - Standard operating temperature range: 5° C – 45° C (41° F – 113° F)
  - Dimensions (H x W x D): 88.0 x 482.6 x 159 mm (3.5 x 19 x 6.3")
  - Weight: 2.74 kg (6.03 lbs)
