details: |-
  The 2011 Twin Diaphragm Cardioid Mic is a directional microphone. The distinctive sound of this microphone is well balanced. It bridges the gap between the extreme sound quality of our pencil microphones and our well-known Lavalier microphones.

  Two opposite-facing miniature capsules are custom rebuilt inside this microphone. They are placed into a double-diaphragm, one-capsule composition. This combines the advantages of small capsules with the lower inherent noise achieved from a larger diaphragm area. These capsules provide fast impulse response and large frequency bandwidth. The capsules are loaded to our supreme preamps, which gives the sound more air and precision.

  As with all of DPA's modular pencil microphones, the 2011 Twin Diaphragm Cardioid Mic Capsule can be combined with any of their preamps. The MMP-A Mic Preamp is an ultra-transparent, transformerless preamplifier with active drive for impedance balancing. The MMP-C Compact Mic Preamp is an ultra-compact preamplifier with active drive for impedance balancing and a slightly softer character. Other preamps include the small form factor MMP-E Modular Active Cable (XLR output) and MMP-G Modular Active Cable (MicroDot output), allowing for very slim set-ups.

  The 2011A Twin Diaphragm Cardioid Mic is acclaimed for its close-miking excellence and hi-SPL handling. Optimized for onstage use, it has been used on many stages as well as recording sessions, exhibiting a blend of clarity, richness and dynamic range. The 2011C Compact Twin Diaphragm Cardioid Mic offers a subtle character alteration with a bit more body to the low end than the 2011A, and is much easier to position than other cardioid mics.

  At any time, and with no tools needed, it is possible to transform the 2011 Twin Diaphragm Cardioid Mic into a new configuration. The 2011 is very widely used as a snare drum mic but fits well on many other instruments.
specs: |-
  - Directional pattern: Cardioid
  - Principle of operation: Pressure gradient, with interference tube
  - Cartridge type: Pre-polarized condenser, Twin Diaphragm Capsule
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range, ±2 dB, at 30 cm (11.8 in): 50 Hz - 17 kHz with 3 dB soft boost at 12 kHz
  - Sensitivity, nominal, ±2 dB at 1 kHz: 10 mV/Pa; -40 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 20 dB(A) re. 20 µPa (max. 23 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 33 dB (max. 36 dB)
  - Distortion, THD < 1%: 134 dB SPL RMS, 137 dB SPL peak
  - Dynamic range: Typ. 117 dB
  - Max. SPL, THD 10%: 153 dB SPL peak
  - Switchable attenuator: 0 dB / -20 dB
  - Rated output impedance: 200 Ω
  - Cable drive capability: 100 m (328 ft)
  - Output balance principle: Impedance balancing with Active Drive
  - Common mode rejection ratio (CMRR): > 60 dB
  - Power supply: P48 (Phantom Power)
  - Current consumption: 2.8 mA
  - Connector: XLR-3M. Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase
  - Weight: 164 g (5.8 oz)
  - Microphone diameter: 19 mm (0.75 in)
  - Microphone length: 198 mm (7.8 in)
  - Maximum output voltage, RMS: > 5 V
  - Polarity: +V at pin 2 for positive sound pressure
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Sensitivity selection tolerance (at 1 kHz): ±1.5 dB
  - Color: Matte black
