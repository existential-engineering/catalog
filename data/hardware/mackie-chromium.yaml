description: The Chromium Premium USB Condenser Microphone delivers professional
  quality and incredible versatility in an all-in-one design for modern
  musicians, content creators, singer-songwriters, and beyond. Built right into
  the stand, the 2-channel mixer includes Instrument and stereo 1/8" inputs and
  has controls for gain, mute, and headphone monitoring plus professional
  metering and Blend control.
details: |-
  Chromium is a premium USB condenser microphone with a 2-channel mixer built into its stand. Onyx mic preamp circuitry provides clear sound and ultra-low noise, and main meters show input and output levels at a glance.

  Four selectable polar patterns, chosen with the pattern knob, cover stereo, cardioid, bi-directional (figure 8) and omni, so one mic covers vocals, rooms, stereo and two person interviews.

  The instrument input takes a balanced or unbalanced instrument or line-level signal on a 1/4 in connector, so a guitar can be recorded alongside the vocal, and the aux input takes a line-level 1/8 in signal from a phone or media player for singing along with backing tracks. Each has its own sensitivity knob.

  The headphone output has an independent phones knob, and a blend knob sets the balance between the incoming USB signal and the mic for zero-latency monitoring. The mute switch mutes only the mic input.

  Waveform OEM professional software and plugin package is included. The DAW Essentials Bundle for Waveform OEM includes 16 plugins such as Equaliser, Compressor, Reverber8 and Limiter.
specs: |-
  - Built-in 2-channel mixer in the stand
  - Onyx mic preamp circuitry
  - 4 selectable polar patterns: stereo, cardioid, bi-directional (figure 8), omni
  - Sample rate: up to 16-bit / 48 kHz
  - Connection: USB-C, class compliant, no driver required
  - Bus powered over USB, no external power supply
  - Instrument / line input on 1/4 in connector with instrument sensitivity knob
  - Stereo aux input on 1/8 in connector with aux sensitivity knob
  - Headphone output on 1/8 in connector with phones level knob
  - Blend knob for zero-latency mix of USB playback and mic signal
  - Main meters for input and output levels
  - Onboard gain knob and illuminated mute switch
  - Desktop only mounting, mixer stand built in
  - Included accessories: built-in mixer stand, USB-C cable
  - Waveform OEM software and DAW Essentials plugin bundle included
