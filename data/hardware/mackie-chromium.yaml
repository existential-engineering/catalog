description: "Premium USB Condenser Microphone with Built-in 2-channel Mixer.
  From going for a flawless run on your latest stream to leading an online
  meeting, Chromium offers a ton of ways for you to get creative and sound
  amazing doing it."
details: |-
  The Chromium is engineered for home studios, singer-songwriters, content creators, and live streamers seeking professional-quality audio. Its legendary Onyx mic preamp circuitry delivers crystal-clear sound with ultra-low noise performance.

  The microphone features four selectable polar patterns—stereo, cardioid, bi-directional (figure-8), and omnidirectional—providing versatility across recording applications. A built-in 2-channel mixer with direct/USB monitor blend control allows seamless integration of instrument and stereo 1/8" inputs for multi-source recording.

  Onboard monitoring includes a dedicated headphone output with independent volume control, enabling convenient real-time audio feedback. The rugged construction ensures reliable performance for demanding production environments.

  Setup is plug-and-play via USB-C connectivity with no driver required. The package includes Waveform OEM professional software with the DAW Essentials Bundle featuring 16 plugins (Equaliser, Compressor, Reverber8, Limiter).
specs: |-
  - Legendary Onyx mic preamp circuitry provides crystal clear sound and ultra-low noise
  - Professional metering shows your levels at a glance
  - 4 selectable polar patterns: Stereo, Cardioid, Bi-directional (Figure 8), Omni
  - USB-C connectivity (plug and play, no driver needed)
  - Built-in 2-channel mixer with direct/USB monitor blend control
  - Instrument input (1/4") and stereo 1/8" input
  - Headphone output with independent volume control
  - Onboard gain control and mute button
  - Sample rate: 16-Bit / 48kHz
  - Rugged construction
  - Includes USB-C cable and Waveform OEM software with DAW Essentials Bundle (16 plugins)
