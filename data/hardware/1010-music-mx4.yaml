description: MX4 is a Eurorack Buffered MIDI Multiple module that takes in a
  single MIDI input and repeats it in real time to four MIDI outputs, letting
  one MIDI source control up to four devices at once.
details: |-
  The MX4 Buffered MIDI Multiple by 1010music takes in a single MIDI input and repeats it in real time to four MIDI outputs, so one MIDI source can control four times as many devices. It uses 1/8-inch (3.5mm) TRS minijacks for direct connection to all 1010music modules (including bitbox and fxbox), the Arturia BeatStep Pro, and Novation products such as the Launchpad Pro.

  Included: two MIDI adapters for standard 5-pin DIN connectors, two TRS patch cables, and a Eurorack power ribbon cable.
specs: |-
  - Eurorack format: 3 HP
  - Weight: 0.4 lbs
  - Package dimensions: 6.7 x 3.4 x 2.25 in (WooCommerce shipping dimensions)
  - Power: +12V 4mA, -12V 0mA, 5V 0mA
  - SKU: 003
  - 1 MIDI input, 4 MIDI outputs via 1/8-inch (3.5mm) TRS minijacks
  - Includes 2x 5-pin DIN MIDI adapters, 2x TRS patch cables, and a Eurorack power ribbon cable
