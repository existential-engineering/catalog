  A/V receivers, and other entertainment systems, the MM-6 brings studio quality
  sound into your living room.
details: |-
  The MM-6 is a bi-amped, 80W Class D powered multimedia speaker with a 1-inch textile dome tweeter and a 6.5-inch optimized paper woofer crossed over at 1500 Hz. It is front ported, covers 39 Hz to 25 kHz at -10 dB, and is specified for a listening distance of 0.5 to 2.5 meters.

  The MM-6 is acoustically identical to Kali's best-selling studio monitor, the LP-6. Kali's studio monitors can be found in studios across the globe, and their precision, power and detail make them a choice for GRAMMY-winning musicians and producers, film and television studios, and creators working in immersive formats like Dolby Atmos.

  Four input options cover home entertainment gear. Optical is for televisions, gaming systems and high-end audio equipment. RCA connects almost any device with an analog audio output. S/PDIF is for computers and home theater equipment. The XLR input connects professional audio equipment, and also links a pair of MM-6s together for stereo, with a 10-foot XLR cable included when the units are bought as a pair.

  Boundary EQ settings let the sound be dialed in whether the speakers sit on stands, on a desk, on a credenza or on a bookshelf, against a wall or in the middle of a room. Bass and treble can also be added or subtracted to further fine tune the sound.

  The included remote control works on the digital inputs, so volume can be adjusted even when the connected device offers no level control of its own.
