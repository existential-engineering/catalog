description: Inspired by the vintage hi-hat stands of the 1960s, we are proud to
  announce our new extremely lightweight and compact The Classic Hi-Hat Stand.
  This hi-hat stand is not merely a rehash of old designs, but a beautiful blend
  of vintage style with the strength, adjustability, and reliability of modern
  construction.
details: |-
  Single Braced Flat Base Tripod Legs: This hi-hat stand features a flat base with single braced legs making for a sleek, lightweight design that's very easy to transport.

  Smooth Surface Footboard: The newly designed classic style footboard takes advantage of both a lightweight construction and smooth surface, making it a great choice for any drumming style.

  Individual Adjustment of Spring Tension & Footboard Angle: The spring tension and footboard angle can be adjusted individually using a drum key. -Spring Tension While loosening the square head bolt A, move the footboard up and down to adjust the spring tension. -Footboard Angle Adjustment While loosening the square head bolt B, slide the center pipe up and down to adjust the footboard angle.

  Knurling on Base Pipe (US.PAT.NO.10235979): This knurling surface prevents the T-bolt from slipping off, which is the typical problem for flat base hi-hat stand. (Pat.pending)

  Die-Cast Pipe Joint / Memory Lock: The new Die-Cast Joint design provides a secure attachment by, tightly gripping the tube with a metal plate that is held in place by the T-bolt. In addition, a memory lock prevents the pipe from any unwanted rotation or sliding.

  Easy Store Radius Rod: Hook the wire rods to the protrusions on the bottom of the footboard for quick and easy storage and transport.
