id: 9EfkHZZsNP3ACioPTSVcC
name: TranZformer CMP
manufacturer: api-audio
primaryCategory: compressor
categories:
  - pedal
url: https://apiaudio.com/product/tranzformer-cmp-guitar-pedal/
description: Guitar effects pedal incorporating API's VCA compressor circuit
  with a signature output transformer, selectable feedback/feedforward
  compressor styles, wet/dry blend, adjustable attack/release, and buffered
  bypass. Operates on 9–18VDC.
details: "API VCA compressor in guitar pedal format. Signature API output
  transformer. Selectable feedback or feedforward compressor styles. Wet/dry
  blend control. Attack: FAST (1 ms) or SLOW (10 ms). Release: FAST (300 ms) or
  SLOW (1 s). Variable input gain (9–30 dB) and output level. Buffered bypass.
  9–18VDC power supply (higher voltage increases headroom)."
specs: |-
  - Input impedance: 1 MΩ
  - Output impedance: <1 kΩ
  - Input gain: 9–30 dB (variable)
  - Max output: +15 dBu @ 9V / +22 dBu @ 18V
  - Frequency response: +0/−1 dB (20–20 kHz)
  - Compressor ratio: 1:1 to 20:1
  - Attack: FAST (1 ms) or SLOW (10 ms)
  - Release: FAST (300 ms) or SLOW (1 s)
  - Power: 9–18VDC @ 100 mA
  - Dimensions: 4.6" × 3.8" × 3"
  - Weight: 1.5 lb
