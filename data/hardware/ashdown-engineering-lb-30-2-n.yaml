description: The LB 30 2.N delivers 30 watts of EL84-driven valve warmth with
  modern flexibility thanks to built-in Two Notes Torpedo cabinet simulation.
  Choose from six Ashdown cab models via a rotary selector, edit or update IRs
  over USB, and integrate seamlessly with a balanced DI, MIDI control, and full
  I/O for studio or stage. Lightweight at 10 kg, with ECC81/82/83 preamp valves
  and both active and passive inputs, it blends vintage tone with cutting-edge
  control.
details: |-
  30-watt all-valve bass head with onboard Two Notes Torpedo dynamic cabinet IR simulation. Valve complement: 1 x ECC81, 1 x ECC82, 2 x ECC83, 4 x EL84. The built-in Two Notes Torpedo offers IR cabinet emulators modelled on six Ashdown cabinets (ABM-810H-EVO IV, ABM-410H-EVO IV, ABM-210H-EVO IV, ABM-115-EVO IV, RM-212-EVO II, CL-310 DH) selectable by rotary control, and acts as a load box so no cabinet is needed in the studio. Two inputs accept active or passive instruments. USB input edits and updates the onboard IR cabinets; a separate USB CHARGE socket powers devices. MIDI In and Out control the amp's IRs and effects via a MIDI footswitch (available separately). A direct balanced Torpedo IR output feeds a studio interface or front of house, and a Torpedo line-in XLR allows re-amping recordings back into the Torpedo. Both 4 and 8 Ohm speaker outputs are provided, plus a direct DI output and a headphone output. Size 360 x 170 x 243 mm (WxHxD). Weight 10 kg / 22 lbs.
specs: |-
  - Power output: 30 watts (all-valve)
  - Valves: 1 x ECC81, 1 x ECC82, 2 x ECC83, 4 x EL84
  - Onboard Two Notes Torpedo dynamic cabinet IR simulation (also a load box)
  - Six Ashdown cab IR models via rotary selector
  - Two inputs for active or passive instruments
  - USB input for editing/updating IR cabinets
  - USB CHARGE socket for powering devices
  - MIDI In and Out for IR and effects control
  - Balanced Torpedo IR output (to interface or FOH)
  - Torpedo line-in XLR for re-amping
  - 4 Ohm and 8 Ohm speaker outputs
  - Direct DI output
  - Headphone output
  - Size: 360 x 170 x 243 mm (WxHxD)
  - Weight: 10 kg / 22 lbs
