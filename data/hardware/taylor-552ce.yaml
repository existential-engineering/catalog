description: The 552ce is a 12-string Grand Concert acoustic-electric from
  Taylor's 500 Series, featuring a torrefied spruce top with solid red ironbark
  back and sides, V-Class bracing, Venetian cutaway, and ES2 electronics.
details: |-
  The 552ce is a 12-string acoustic-electric built on the compact Grand Concert body with a 12-fret neck join. The torrefied spruce top paired with solid red ironbark back and sides delivers balanced tonal character with pronounced clarity across all 12 strings, emphasizing midrange warmth.

  Taylor's V-Class bracing improves intonation, sustain, and volume consistency. The Venetian cutaway provides upper-fret access. The Neo-Tropical Mahogany neck with West African Crelicam Ebony fretboard and 24-7/8" scale length makes 12-string playability comfortable.

  Expression System 2 behind-the-saddle electronics capture the guitar's natural acoustic resonance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Configuration: 12-string
  - Neck join: 12-fret
  - Top: Torrefied Spruce (solid, gloss)
  - Back/sides: Red Ironbark (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Tuners: Taylor Nickel
  - Body binding: Sapele
  - Pickguard: Tortoise
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.010-.047)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
