description: Erica Synths Drum Mixer with extended headroom and a dedicated drum
  compressor of unique design keeps each drum sound clearly distinguishable and
  adds power to the final mix. Bonus feature - effects send output allows to
  apply external effects to the signals on the first three inputs. LEDs next to
  each input give visual feedback on the signal level.
details: |-
  The Drum Mixer is the mixing stage of the Erica Synths Drum series, a 14HP module with seven inputs and extended headroom for the high level transients a drum module puts out.

  A drum compressor of Erica Synths' own design is built in, using vactrols and offering Amount and Decay controls. Its job is to keep each drum sound clearly distinguishable while adding power to the finished mix, and 6dB of signal boosting is available on top of it.

  Three of the seven inputs can be assigned either to the main output or to the aux send output, so external effects can be applied to those signals and returned elsewhere in the system. Main and Aux Send outputs leave the panel separately.

  LEDs next to each input give visual feedback on signal level, which matters on a module whose headroom is the point. Mixer gain runs to plus and minus 6dB, the module is 35 mm deep and draws 65mA from the positive rail and 41mA from the negative rail.
specs: |-
  - 7 inputs
  - Built in vactrol based drum compressor with Amount and Decay control
  - +6dB signal boosting
  - Three inputs assignable to main or aux send outputs
  - Main and Aux Send outputs
  - Signal level indicator LEDs
  - Mixer gain -+6dB
  - Module width 14HP
  - Module depth 35 mm
  - Power consumption 65mA@+12V, 41mA@-12V
