details: |-
  Doug Wimbish's signature Spector Euro is based on his classic 80's NS-2 and is custom tailored to his exact specifications. The extremely comfortable, fully carved body is crafted from carved European alder body and is topped off with a stunning USA maple top. The neck is carefully tapered based on Doug's personal Spector. The result is a thinner, faster neck profile that's a joy to play. The 1.5″ narrow nut is reminiscent of classic bass design, providing an instantly familiar playing experience for many bassists. Doug's signature Euro is outfitted with EMG P/J pickups and Spector's coveted TonePump active circuit for a powerful & versatile sound that will cut through any mix. Discover the inspiration behind decades of unforgettable bass lines with the Euro 4 Doug Wimbish model.
specs: |-
  - Powered by an onboard battery for the active electronics, no external power connector
