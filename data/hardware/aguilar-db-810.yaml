name: DB 810
manufacturer: aguilar
primaryCategory: speaker
url: https://aguilaramp.com/products/db-810-bass-cabinet
description: A thunderous combination of aggressive midrange with extended lows
  for a ferocious low-B string. One of the loudest bass cabinets on the market,
  the DB 810 features a custom Aguilar tweeter that can be rolled off for a more
  aggressive tone.
details: |-
  The DB 810 is Aguilar's flagship bass speaker cabinet, delivering 1400 watts
  RMS power handling across eight custom ceramic Eminence drivers. Its thunderous
  combination of aggressive midrange and extended lows is designed for bassists
  who need maximum volume and headroom.

  The cabinet features a custom Aguilar tweeter with an integral phase plug,
  paired with a custom crossover featuring variable tweeter level control. The
  tweeter can be rolled off for a more aggressive, vintage tone, or boosted for
  clear high-frequency articulation.

  Constructed from 13-ply Baltic Birch, the enclosure is extremely rigid and
  well-damped. At 104 dB sensitivity (1W/1M) and a max SPL of 136 dB, the
  DB 810 is capable of stage-filling volume even with modest amplifier power.

  Despite its 184 lb weight, the DB 810 is designed for practical transport with
  tilt-back handles, rear wheels, and skid rails built into the bottom of the
  enclosure. The cabinet operates at 4 ohms impedance and spans a frequency
  response of 40 Hz to 16 kHz.

  The DB 810 is covered by Aguilar's three-year limited warranty to the original
  owner.
specs: |-
  - Power Handling: 1400W RMS
  - Impedance: 4 ohms
  - Frequency Response: 40 Hz – 16 kHz
  - Sensitivity: 104 dB (1W/1M)
  - Max SPL: 136 dB
  - Drivers: 8x custom Ceramic Eminence + phenolic tweeter with integral
    phase plug
  - Crossover: Custom with variable tweeter control
  - Construction: 13-ply Baltic Birch
  - Height: 46"
  - Width: 24.5"
  - Depth: 18"
  - Weight: 184 lbs
  - Transport: Tilt-back handles, rear wheels, skid rails
