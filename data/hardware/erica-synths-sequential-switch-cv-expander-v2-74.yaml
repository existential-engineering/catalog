details: |-
  The Sequential Switch CV Expander turns the Sequential Switch into a CV and gate sequencer. It connects to the host module via a ribbon cable supplied with it.

  The expander does not require a power supply of its own, drawing power from the Sequential Switch instead. The connection is made through the IN/OUT jack switching lugs of the host, which means that patching anything into an IN/OUT jack disconnects the relevant input from the CV Expander.

  One caution applies when a Sequential Switch with the CV Expander attached is used to sequence sound sources: skip all steps that are not in use, with no patch cable connected. Leaving them in circuit lets DC from the CV Expander into the audio path, which is heard as an undesired click.
specs: |-
  - Expander for the Sequential Switch, connects by supplied ribbon cable
  - Draws power from the Sequential Switch, no PSU connection of its own
  - Connects through the host's IN/OUT jack switching lugs
  - Turns the Sequential Switch into a CV and gate sequencer
