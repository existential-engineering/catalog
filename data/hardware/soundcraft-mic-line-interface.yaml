details: |-
  The Mic/ Line interface converts the digital TDIF port on the rear of all Soundcraft digital consoles into 8 true mic/line inputs. It also provides 8 balanced outputs. The mic preamp is designed with exactly the same characteristics as those found on the Digital 328 and 324.
