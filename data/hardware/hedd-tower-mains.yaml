description: HEDD's full-range main monitoring system, the Tower Mains pairs a
  3-way TM 80 main unit with one or two closed TMS 36 subwoofers per channel for
  powerful, uncolored reproduction in professional studios and audiophile rooms.
details: |-
  The Tower Mains System is a custom-built, full-range monitoring solution available as a standard pair of 3-way monitors with integrated subwoofers or in extended configurations. Each channel combines one TM 80 main unit with one or two TMS 36 subwoofers, all in fully closed cabinets with footprints identical to standard studio monitors.

  The system combines HEDD's proprietary Air Motion Transformer tweeter with custom 7-inch and 4-inch woofers, delivering realistic yet powerful audio across the full frequency spectrum. The closed-cabinet design enables sophisticated filter engineering for accurate monitoring in recording studios, post-production suites, and audiophile listening environments.

  With three 300 W amplifiers in the main unit and up to 1,200 W per subwoofer channel, the Tower Mains reaches a maximum output of 128 dB SPL per pair at one meter. Broad horizontal dispersion and controlled vertical directivity are maintained through solid metal brackets and feet, ensuring consistent sound across varied spatial configurations.
specs: |-
  - Configuration: full-range main system, 3-way TM 80 main unit plus TMS 36 subwoofer(s) per channel, fully closed cabinets
  - Drivers: proprietary 7" and 4" woofers, HEDD Air Motion Transformer tweeter
  - Frequency response: 20 Hz - 50 kHz
  - Maximum SPL: 128 dB per pair at 1 m
  - Amplification (TM 80): 3 x 300 W ICEpower
  - Amplification (TMS 36): 2 x 1,200 W ICEpower
  - Dimensions: 280 x 835 x 400 mm
  - Weight: 35 kg
  - Configurations: Standard Pair (main + 1 sub/channel), Extended Pair (main + 2 subs/channel), Single Extended
