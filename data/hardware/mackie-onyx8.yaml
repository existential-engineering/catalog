description: "Mackie Onyx8 is an 8-channel premium analog USB mixer with Onyx
  mic preamps, Perkins British-style EQ, built-in dynamic FX, multitrack USB/SD
  recording, and Bluetooth streaming."
details: |-
  The Onyx8 is a compact 8-channel premium analog USB mixer designed to elevate the quality of creative projects in home studios, live audio, and mobile sound applications. It pairs Mackie's award-winning Onyx mic preamps with Perkins British-style EQs inspired by classic desks from the '60s and '70s for a musical, vintage-flavored tonal palette.

  Multitrack recording up to 24-bit/96 kHz is available over USB to Mac/PC, with additional stereo recording directly to SD card. A full-color Studio Command LCD provides easy access to professional, customizable Dynamic FX and SD card management, while Bluetooth streaming makes it simple to pull in backing tracks or wireless sources.

  Built-Like-A-Tank steel chassis construction, switchable hi-Z inputs for guitar and bass, and an 8x4 USB configuration round out a versatile mixer aimed at recording, mixing, and small-format live work.
specs: |-
  - 8x4 analog mixer configuration
  - 4 low-noise Onyx mic preamps with 60dB of gain
  - 3-band British-Style Perkins EQ with on/off hard bypass switch
  - High-resolution multitrack recording to Mac/PC via USB at up to 24-bit / 96 kHz
  - Stereo recording directly to an SD card
  - Professional customizable Dynamic FX with Multi-Parameter Adjustment
  - Studio Command full-color LCD for easy FX control and SD card management
  - Bluetooth streaming
  - Switchable hi-Z inputs for guitars, bass, and other instruments
  - 5 line inputs (3 stereo)
  - 4 mic inputs
  - 1 Aux send plus FX send
  - Built-Like-A-Tank rugged steel chassis
