description: QuNexus is a 25-key MPE keyboard controller with a three track
  arpeggiator and step sequencer, USB-C MIDI, a mini-USB Expander port for DIN
  MIDI and CV and gate jacks for modular rigs.
details: |-
  QuNexus is a 25-key MPE keyboard controller. The touch-sensitive keys detect velocity, polyphonic aftertouch and per-key tilt, using a key and pitch bend algorithm derived from the K-Board Pro 4, and velocity and expression curves are selectable, customizable and adjustable per key.

  Three tracks are each switchable between arpeggiator and step sequencer mode. A pattern holds up to 32 quantized steps, with eight slots for saving and recalling patterns, playback divisions from whole notes to 32nd notes in dotted or triplet form at 5 to 255 bpm, and 10 arpeggiator playback modes including pendulum, random and brownian motion. Each track is independently assignable to MIDI channels and to the USB, DIN and CV outputs, and track 1 supports MPE playback with each key transmitting aftertouch and tilt. Blue and white LEDs light the keys during arpeggiation, sequencing and playback.

  Connectivity covers USB MIDI with three ports (keyboard, expander and CV) over USB-C, and a mini-USB Expander port on the right side that carries MIDI DIN out through the included MIDI Out Adapter Cable, or MIDI DIN in and out through the optional KMI MIDI Expander, sold separately. Two 1/8-inch stereo TRS jacks on the left side carry one gate output and three CV outputs, Gate and CV1 on the first jack and CV2 and CV3 on the second, and one 1/8-inch TRRS jack on the right side carries the two CV inputs plus 5 V to power an expression pedal. Breakout cables split each jack into mono connections for modular synthesizers.

  A separate control layer maps each key to its own notes or CCs. Common parameters can be edited and saved on the unit, and deeper configuration is handled by the QuNexus Editor on macOS and Windows.
specs: |-
  - 25 touch-sensitive keys detect velocity, polyphonic aftertouch, and per-key tilt
  - Key and pitch bend algorithm derived from the K-Board Pro 4
  - Selectable and customizable velocity and expression curves with per-key sensitivity adjustment
  - Three tracks switchable between arpeggiator and step sequencer mode
  - Up to 32 quantized steps per pattern, 8 pattern slots
  - Playback divisions from whole notes to 32nd notes, dotted or triplets, 5 to 255 bpm
  - 10 arpeggiator playback modes including pendulum, random, and brownian motion
  - Each track independently assignable to MIDI channels and to USB, DIN, and CV outputs
  - Track 1 supports MPE playback with per-key aftertouch and tilt
  - USB MIDI with three ports (keyboard, expander, and CV) over USB-C
  - Mini-USB Expander port carries MIDI DIN out through the included KMI MIDI Out Adapter Cable
  - MIDI DIN in and out through the optional KMI MIDI Expander (sold separately)
  - 1 gate output and 3 CV outputs on two 1/8-inch TRS jacks (Gate/CV1 and CV2/CV3)
  - 2 CV inputs on one 1/8-inch TRRS jack, with 5 V for an expression pedal
  - Separate control layer maps each key to its own notes and CCs
  - Standalone editing and saving of common parameters
  - Advanced configuration with the QuNexus Editor
  - USB bus powered, no external power supply
  - Compatible with macOS and Windows
