details: |-
  Eurorack Reverb Module

  The Eurorack Reverb Module PCB and Front Panel Kit is a DIY effects module designed to add rich, immersive spatial depth to your modular synthesizer. Built around the well-known Belton BTDR-2H reverb brick and paired with a dual VCA stage on the wet signal, it offers both classic reverb tones and advanced voltage-controlled effects. Key Features

  Reverb & Voltage-Controlled Effects

  At the core of the module is the BTDR-2H reverb brick, delivering lush and musical digital reverb. The wet signal is routed through a dual VCA stage, allowing the reverb level to be dynamically controlled with control voltage. By modulating the wet level:

  The VCA stage is based on a 3360 VCA design, ensuring smooth, musical amplitude control over the reverb signal. Creative Patch Possibilities

  The voltage-controlled wet path opens up expressive sound design techniques that go beyond static reverb:

  This makes the module equally useful for subtle ambience and more experimental, performance-oriented effects. DIY Build & Front Panel

  This PCB and front panel only Eurorack kit is intended for intermediate builders. Assembly follows standard through-hole construction. The front panel is crafted from durable PCB material and meticulously screen printed by hand, ensuring a professional finish and visual consistency across Guru Gara Synth modules. Technical Specifications

  Compatible components such as knobs, potentiometers, jack sockets, and other build parts can be found in the Synth Parts category. Video Demo
specs: |-
  - Eurorack PCB and front panel kit
  - Based on the Belton BTDR-2H reverb brick
  - Dual VCA on the wet signal, based on a 3360 VCA design
  - CV control over reverb (wet) level
  - Enables gated reverb, rhythmic modulation, and delay-like effects
  - Suitable for a wide range of modular audio sources
  - Intermediate-level DIY build
  - Front panel made from high-quality PCB material, screen printed by hand
  - Use an envelope to create classic gated reverb effects
  - Apply an LFO for rhythmic modulation or tremolo/delay-like textures
  - Dynamic reverb swells synced to envelopes
  - Rhythmic spatial modulation
  - Percussive reverb shaping
  - Animated ambient textures
  - Format: Eurorack
  - Width: 8HP
  - Reverb Core: Belton BTDR-2H
  - VCA Design: 3360-based (dual VCA (for stereo output) on wet signal)
  - Power Requirements: Requires +12V, -12V, and +5V from the power bus.
  - Documents
