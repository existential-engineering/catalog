description: A sweepable-mids EQ preamp pedal with +/-15dB boost/cut, a
  frequency sweep from 400Hz to 7.5kHz, switchable Q width, and a volume control
  for boosting overall signal.
details: |-
  The Haunting Mids is a sweepable-mids EQ preamp. Controls: Volume (standard volume/boost control), Mids (boost or scoop midrange frequencies; noon is flat, left scoops, right boosts), Sweep (selects affected frequency range; left = low mids, right = hi mids), Lo/Hi toggle (Q width — Lo is soft/wide peak, Hi is sharp/steep peak). Can boost +10dB with EQ flat. Excellent for cutting through a mix, taming a mid-heavy amp, or pushing an almost-breaking-up amp into midrange overdrive.
