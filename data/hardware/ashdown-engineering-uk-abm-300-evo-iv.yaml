description: The UK-built UK-ABM-300-EVO IV delivers 300 watts of classic
  Ashdown bass tone with tonal flexibility. It features a foot-switchable
  Variable Valve Drive Plus, a precision 9-band EQ, a One Knob Compressor, and a
  Sub-Harmonic Generator, with comprehensive connectivity including an FX loop,
  tuner out, DI out, and line input.
details: |-
  The UK-ABM-300-EVO IV is a UK-built 300-watt bass head combining classic warmth with tonal flexibility. An upgraded Variable Valve Drive Plus preamp delivers more current to a 12AX7 tube for richer drive and harmonics, footswitchable from pristine cleans to gritty overdrive. The EQ pairs Bass, Middle and Treble controls with a 6-band slider section (100Hz, 180Hz, 340Hz, 1.3kHz, 2.6kHz, 5kHz) and an illuminated VU meter, with footswitchable flat/sculpted transitions. Ashdown's One Knob Compressor keeps the sound tight and consistent, while the Sub-Harmonic Generator adds an octave below the played notes. A transparent FX loop, line input, DI output, tuner output and output muting for silent tuning round out the connectivity, with two Neutrik Jack/Speakon outputs down to a 4-ohm load.
specs: |-
  - Power output: 300 Watts
  - Power requirement: 115-230 Volts
  - Impedance: minimum 4 Ohms
  - Preamp tube: 1 x 12AX7
  - EQ: Bass, Middle, Treble plus 6-band slider (100Hz, 180Hz, 340Hz, 1.3kHz, 2.6kHz, 5kHz)
  - Variable Valve Drive Plus (footswitchable)
  - One Knob Compressor
  - Sub-Harmonic Generator
  - Illuminated input VU meter
  - Speaker outputs: 2 x Neutrik Jack/Speakon
  - Line input: 22k Ohms, 0dBu nominal
  - DI output: 600 Ohm balanced, 0dBu nominal
  - Tuner output: 22k Ohms, 0dBu nominal
  - Effects send: 22k Ohms, 0dBu nominal
  - Effects return: 22k Ohms, 0dBu nominal
  - High instrument input: 3.9M Ohms, 150mV
  - Low instrument input: 10k Ohms, 300mV-40V p-p
  - Frequency response: -3dB @ 17Hz and 30kHz
  - Height x Width x Depth: 617 x 475 x 227 mm
  - Weight: 11.60 kg
  - Made in the UK, built to order
