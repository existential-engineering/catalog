details: |-
  The K Constantinople Bounce Ride is the result of a collaboration with jazz artist Kenny Washington, and recreates the specs of an old, classic K gifted to him in the 1970's by late jazz great Mel Lewis. While replicating the higher curvature and narrower, wider spaced lathing style, a new cup design was created to best resemble that of Kenny's old K. The 22" offers plenty of wash and sustain that rides over the band and cuts through most small-to-big band settings.
