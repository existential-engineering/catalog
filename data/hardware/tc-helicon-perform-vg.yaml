description: Mic-stand mounted processor for voice and acoustic guitar. It reads
  the chords played on the connected guitar to key two voices of harmony, runs
  Adaptive Tone on the vocal and an acoustic voicing engine on the guitar, and
  carries XLR mic in and out, a guitar in and thru, aux in and USB.
details: |-
  Perform-VG clamps to a microphone stand and takes both a vocal and an acoustic guitar, processing each on its own side of the same unit. One footswitch jack and a single row of lit buttons cover both signal paths.

  The guitar connects directly and sets the key for the harmonies: the unit reads the chords being played, so no tap tempo, MIDI foot controller or manual key entry is involved. The harmony voices sit above the lead vocal, change as the chords change and stop when the singing stops. Adaptive Tone handles EQ, compression, de-essing and gating on the vocal in real time.

  The guitar side runs a voicing engine made up of body resonance restoration, anti-feedback and light compression, aimed at the thin sound an under-saddle pickup sends to a PA. Chorus, reverb and echo are available on the guitar channel, with reverb, a doubler, megaphone and HardTune on the vocal channel.

  The rear panel carries an XLR microphone input with switchable 48V phantom power, an XLR mic output, a 1/4-inch guitar input and a 1/4-inch guitar thru, a 1/8-inch aux input for backing tracks, a 1/4-inch pedal jack, USB for recording to a computer and a ground lift. A 1/8-inch headphone output sits on the front edge.
specs: |-
  - Two-part harmony keyed automatically from the chords played on the connected guitar
  - Adaptive Tone sweeps EQ, compression, de-essing and gating on the vocal
  - Acoustic guitar voicing engine with BodyRez body resonance, anti-feedback and compression
  - Reverb, doubler, megaphone and HardTune on the vocal channel
  - Chorus, reverb and echo on the guitar channel
  - Built-in tuner reached from the Mix button
  - XLR microphone input with switchable 48V phantom power
  - Ground lift switch
  - Mic-stand mount
  - External DC power supply
