description: Fitting the looks of the 80s, the Ultra-V stands alongside the V220
  as the embodiment of the decade. Since its introduction the model has made
  strides, and it can be customized to the player's taste in many aspects,
  including bridge type and pickup models.
specs: |-
  - Scale length: 25"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder, 43" long, 1.68" thick, 15" wide
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: neck-through
  - Fingerboard: ebony with 14" radius
  - Headstock: 3x3 pointed headstock
  - Bridge: Tune-O-Matic, .4125" (10.5mm) spacing; bridge type is customizable
  - Pickups: direct-mount passive Kiesel Lithium humbuckers; pickup models are customizable
  - Electronics: master volume and tone, 3-way pickup selector, push/pull coil tap
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Hardware: chrome
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 7.5 lbs, roughly a pound lighter than the V220
