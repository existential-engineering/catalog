description: The 19-inch rackmount HM-800 8-Channel Headphone Amplifier offers
  up to 10 available mixes with a total of 16 headphone outputs.
details: |-
  The 19" rackmount HM-800 8-Channel Headphone Amplifier offers up to 10 available mixes with a total of 16 headphone outputs. Perfect for professional applications including studios, Houses of Worship, practice spaces, and more. Featuring 2 discrete main inputs with level control plus stereo outs, aux inputs per channel.

  Perfect for studios, practice spaces, quiet stages, and more, the HM Series offers everything you need whether it is just splitting a single signal to your band, or more complex headphone distribution.

  The front panel carries eight headphone output jacks, one per channel, and the rear panel carries a second set of eight. Above each rear headphone jack is an aux input jack, fed from a mixer's aux sends.

  Each channel has an input 1/2 switch to choose between the two main inputs and a stereo/mono switch. Once an aux source is plugged in it overrides both main inputs and is the only available source until the aux cable is removed.
specs: |-
  - 2 discrete main stereo inputs with separate level control plus stereo outputs
  - 7-segment LED metering per channel plus main
  - Two headphone outputs per channel, 16 total
  - 8 independent aux inputs for up to 8 individual stereo mixes
  - Input Select and Stereo/Mono switches per channel
  - Built-Like-A-Tank construction
  - Frequency response 20 Hz to 20 kHz, +/-1 dB
  - Noise -70 dB
  - Distortion (THD) below 0.005% at +4 dBu, 1 kHz, unity gain
  - Maximum main input level +19 dBu balanced or unbalanced
  - Maximum aux input level +20 dBu unbalanced
  - Headphone output 550 mW per channel @ 47 ohms (+21 dBu)
  - Main input impedance 40 k ohm balanced, 20 k ohm unbalanced
  - Aux input impedance 13 k ohm unbalanced
  - Headphone output impedance 3 ohm unbalanced
  - CMRR (main input) above 52 dB @ 1 kHz
  - Gain range (main input) -67 to 19 dBu
  - Power: detachable line cord, ~100 to 120V or ~220 to 240V, 50/60 Hz, 24 W, with voltage selector switch
  - Dimensions 1.8 x 19.0 x 8.8 in / 46 x 483 x 224 mm
  - Weight 8.0 lb / 3.6 kg
