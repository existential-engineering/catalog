description: "Perfect for studios, practice spaces, quiet stages, and more, the
  HM Series offers everything you need whether it is just splitting a single
  signal to your band, or more complex headphone distribution."
details: |-
  The 19" rackmount HM-800 8-Channel Headphone Amplifier offers up to 10 available mixes with a total of 16 headphone outputs. Perfect for professional applications including studios, Houses of Worship, practice spaces, and more. Featuring 2 discrete main inputs with level control plus stereo outs, aux inputs per channel.
specs: |-
  - 2 discrete main stereo inputs with separate level control plus stereo outputs
  - 7-segment LED metering per channel plus Main
  - 2 headphone outputs per channel
  - 8 independent Aux inputs for up to 8 individual stereo mixes
  - Input Select and Stereo/Mono switches per channel
  - 16 total headphone outputs
  - Built-Like-A-Tank™ construction
