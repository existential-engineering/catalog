description: The Erica Synths Black Low Pass VCF is designed for analogue
  purists, who take sound design seriously. It’s highly stable, 24dB/oct
  resonant low pass VCF with voltage control over cutooff and resonance. Bonus
  features are post-filter overdrive circuit with user adjustable drive amount
  and the Black Filter Coupler connector.
details: |-
  The Black Low-Pass Filter is a highly stable 24dB/oct resonant low pass VCF aimed at analogue purists who take sound design seriously. Cutoff and resonance are both under voltage control.

  A post-filter overdrive circuit with a user adjustable drive amount sits after the filter core, so the module can be pushed from a clean sweep into saturated territory. Gain loss compensation holds the level up at high resonance settings, and a cutoff CV attenuverter sets the depth and the polarity of incoming modulation.

  The panel carries a Black Filter Coupler connector. Used in combination with the Black High Pass VCF and the Black Filter Coupler, the module forms what Erica Synths describes as a Holy Trinity of VCFs for an ultimate analogue modular system.

  CV level runs from -10V to +10V. The module is 35mm deep and power consumption is +25mA and -29mA.
specs: |-
  - 24dB/oct resonant low pass VCF
  - Voltage control over cutoff and resonance
  - Gain loss compensation on high resonance
  - Cutoff CV attenuverter
  - Adjustable post-filter overdrive circuit
  - Filter coupler connector
  - CV level -10V to +10V
  - Power consumption +25mA, -29mA
  - Module depth 35mm
