description: A compact 20W all-valve guitar amplifier head inspired by the
  original 1987 Silver Jubilee. Two channels (Clean / Crunch / Lead behaviour
  via Rhythm Clip and pull-channel controls) with switchable power reduction
  from 20W down to 5W for studio and lower-volume use. Hand-soldered and built
  at Marshall's Bletchley, England factory as part of the Studio series.
details: |-
  With clean, lead and rhythm sounds, three-band EQ, presence and gain controls, you can effortlessly move between pristine cleans, modern crunch and gritty distortion. Play in a variety of environments from rehearsal rooms to the small venues.

  Find the right power for the right environment without compromising on tone. A simple flip of a switch allows you to opt for a power output of either 5W or 20W. Ideal for effortlessly moving between the bedroom and the studio.

  Experience the versatile tones of the Silver Jubilee, in a smaller package. Originally released in 1987 to mark 25 years of Marshall, the Silver Jubilee became a quick favourite with guitar legends, such as Slash and John Frusciante, for its ferocious tone and split-channel design. You can now take the celebration with you, wherever you choose to play.

  This instantly recognisable tone is driven by two ECC83s in the preamp along with an ECC83 phase splitter and two EL34s in the power amp, and the head carries the same familiar EQ found on the Silver Jubilee 2555X Vintage Reissue Head.

  Meticulously crafted at our Bletchley, England facility, the Studio Jubilee Head is built on our unrivalled expertise in creating legendary sound. Rooted in our heritage but made for today, the studio series incorporates elements of hand-soldering and mirrors the circuit design of its larger, older counterparts. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: 2525H
  - Range: Studio
  - Channels: 2
  - Technology: Valve
  - Output wattage: 20W (with power reduction option to 5W)
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4" jack)
  - Inputs: 1 x 1/4" instrument input jack, footswitch
  - Controls: Input gain (pull rhythm clip), lead master, output master (pull channel), treble, middle, bass, presence
  - Effects: None
  - Effects loop: Yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 10 kg / 22 lb
  - Width: 510 mm / 20.1"
  - Height: 232 mm / 9.1"
  - Depth: 220 mm / 8.7"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-90003 footswitch included, detachable power cable included
  - Colour: Silver
