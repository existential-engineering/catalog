description: A compact 20W all-valve guitar amplifier head inspired by the
  original 1987 Silver Jubilee. Two channels (Clean / Crunch / Lead behaviour
  via Rhythm Clip and pull-channel controls) with switchable power reduction
  from 20W down to 5W for studio and lower-volume use. Hand-soldered and built
  at Marshall's Bletchley, England factory as part of the Studio series.
details: |-
  - All-valve construction
  - Two channels with Rhythm Clip and pull-channel switching
  - Power reduction switchable from 20W to 5W
  - Series FX loop, switchable
  - DI output for direct recording / FOH feeds
  - Hand-soldered in Bletchley, UK
  - Inspired by the 1987 Silver Jubilee 2555
specs: |-
  - Model: 2525H
  - Range: Studio
  - Output Wattage: 20W (with power reduction option to 5W)
  - Channels: 2
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Controls: Input Gain (pull Rhythm Clip), Lead Master, Output Master (pull Channel), Treble, Middle, Bass, Presence
  - Effects: None
  - Effects Loop: Yes, 1 x series switchable
  - Inputs: 1 x 1/4" instrument input jack, footswitch
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω / 8Ω / 4Ω load), DI (1/4" jack)
  - Product Height: 232 mm / 9.1"
  - Product Width: 510 mm / 20.1"
  - Product Depth: 220 mm / 8.7"
  - Weight: 10 kg / 22 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
