description: VU001C is a triple video distribution amplifier module aimed at
  distributing Component video to multiple monitors/capture devices, or three
  independent Composite or sync signals.
details: |-
  Now with DC barrel power input
  (Check here to get the board separately and upgrade your module)

  VU001C features 3 video distribution amplifier channels, aimed towards distributing Component video to multiple monitors/capture devices, but can also be used to distribute 3 independents Composite or sync signals. Inputs:

  – 75 ohm, RCA

  Outputs:

  – 75 ohm, RCA

  Specs:

  - 8HP
  - 55mA +12V
  - 15mA -12V
  - 0mA +5V
  - 20mm deep

  Documentation
