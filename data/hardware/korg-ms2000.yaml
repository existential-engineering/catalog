description: >-
  The Korg MS2000 is a 4-voice analog modeling synthesizer released in 2000, inspired by
  Korg's legendary MS-series monosynths. It features two oscillators with eight waveforms
  plus 64 DWGS waves, a 16-band vocoder, onboard effects, and a Virtual Patch system for
  flexible signal routing through its LCD interface.
details: |-
  The MS2000 draws inspiration from Korg's legendary MS-series synthesizers (MS-10, MS-20, MS-50), which were sought-after compact patchable monosynths. Rather than using traditional patch cables, the MS2000 employs a Virtual Patch mode that allows signal routing through an LCD interface to sections like LFO, filter, and keyboard velocity.

  The sound engine uses analog modeling synthesis with two oscillators plus a noise generator, offering eight waveforms including sine, triangle, saw, pulse, and human voice, along with 64 DWGS waves. The filter section provides 12dB high and bandpass filtering with switchable 12 or 24dB lowpass filtering and resonance, modulated by ADSR envelopes. Two LFOs with sample-and-hold capability provide additional modulation options.

  Onboard effects include three modulation types, three delay types, and EQ. A built-in 16-band vocoder and a 6-pattern arpeggiator expand the sonic palette further. The Modulation Sequence mode enables 16-step patterns with real-time recording of parameter tweaks.

  Notable users include BT, Depeche Mode, Apollo 440, The Crystal Method, Placebo, The Faint, Royksopp, Klaus Schulze, and Rick Wakeman. A rackmount version (MS2000R) and updated black colorway variants (MS2000B/MS2000BR) with a dedicated vocoder microphone were also produced.
specs: |-
  - Polyphony: 4 voices
  - Oscillators: 2 oscillators plus 1 noise generator
  - Waveforms: 8 types (sine, triangle, saw, pulse, human voice) plus 64 DWGS waves
  - LFO: 2 with sample and hold
  - Filter: 12dB high-pass and band-pass; switchable 12/24dB low-pass with resonance and ADSR envelope
  - Effects: 3 modulation types, 3 delay types, EQ
  - Vocoder: 16-band
  - Arpeggiator: 6 patterns
  - Modulation Sequencer: 16-step with real-time recording
  - Keyboard: 44 keys with velocity sensitivity
  - Memory: 128 programs
  - MIDI: Yes, 2-part multitimbral
  - Virtual Patch system for flexible signal routing
