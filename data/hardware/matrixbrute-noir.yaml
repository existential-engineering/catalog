description: >
  The most powerful analog monophonic synthesizer, now covered in a sleek black
  coat. Made for those who shoot in the dark, and never miss.
details: |-
  With its sleek design and powerful build, this machine is both the beauty and the beast. With the new paint job, the new knob caps, and the black ionized parts, this limited edition synth has a commanding presence in any space. It offers a 100% analog audio signal with true analog effects, perfect for those who like ultimate control over their sound.

  Meet your future sound head-on with three brute oscillators, a steiner-parker filter and a ladder filter, and the unstoppable modulation matrix. At the heart of this instrument, the modular synth setup is combined with a matrix, allowing you to carve your own sonic path in exquisite, intricate, complex detail.

  Explore unborn soundscapes with 64 additional presets; whether you want to cry out or whisper with your sound, matrixbrute noir can satisfy any musical cravings you might have. With instant preset recall, true invention in a live setting awaits at your fingertips. Choose from an expanded sonic palette of 320 presets in total, and let the ride begin.

  Combined with an impressive arpeggiator and sequencer, you can evolve your melodies and textures with power and deep originality. On stage, the matrixbrute noir is deadly, elegant, and fierce - what more is there to want?

  The matrixbrute noir is here to read your mind - everything you need is a single-touch away. Sizzle with the filter knob, shake it with the sub osc slider, and release the beast with the brute factor control.
specs: |-
  - 100% analog audio signal
