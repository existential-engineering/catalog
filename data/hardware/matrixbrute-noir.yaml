description: >
  The most powerful analog monophonic synthesizer, now covered in a sleek black coat. Made for those who shoot in the dark, and never miss.
details: |-
  The matrixbrute noir edition is a limited edition analog synthesizer featuring a sleek design with new paint job, knob caps, and black ionized parts that deliver a commanding presence. It combines 100% analog audio signal with true analog effects, providing ultimate control over sound. The instrument features three brute oscillators, a steiner-parker filter, a ladder filter, and an unstoppable modulation matrix for comprehensive sonic shaping.

  At its core, the modular synth setup integrates a matrix that allows musicians to carve their own sonic path with exquisite detail and complexity. The instrument delivers rich, warm, and responsive analog synthesis capabilities. With 320 presets in total (including 64 additional presets), users can explore diverse soundscapes and satisfy varied musical requirements.

  The matrixbrute noir is designed for hands-on control with everything accessible via single-touch interface, eliminating menu browsing and screen time. Key controls include the filter knob, sub osc slider, and brute factor control for direct sonic manipulation. An impressive arpeggiator and sequencer enable musicians to evolve melodies and textures with power and originality.

  Instant preset recall functionality allows true invention in live settings, making the matrixbrute noir stage-ready and deadly in performance. The instrument combines elegant design with fierce sonic capabilities, delivering both visual and sonic impact for professional musicians and performers.
