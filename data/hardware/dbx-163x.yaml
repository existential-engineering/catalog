description: The dbx 163X is a discontinued single-channel compressor/limiter
  featuring dbx's OverEasy® compression and a single-knob "X Over Easy" control
  for intuitive operation. It delivered transparent, program-dependent
  compression in a half-rack 1U format.
details: |-
  The 163X simplified professional compression to its essentials with a single-knob "X Over Easy" control that simultaneously adjusts threshold, ratio, and makeup gain. This program-dependent approach made it accessible for engineers who wanted reliable dynamics control without complex parameter interaction.

  dbx's OverEasy® soft-knee compression characteristic ensured smooth, transparent gain reduction that adapted to program content, avoiding the harsh pumping artifacts of hard-knee designs. A PeakStop™ limiter circuit provided absolute peak protection above a fixed threshold.

  The 163X was widely used for vocals, instruments, and general mixing tasks, earning a reputation for its musical, non-intrusive compression character. It processed one channel in a half-rack enclosure that could be paired with a second unit in a standard 1U rack space.
