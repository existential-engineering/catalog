description: Portable Bluetooth speaker with 20+ hours of playtime.
details: |-
  Stockwell II utilises True Stereophonic (360 degree sound), a unique form of multi-directional sound from Marshall. This compact portable speaker offers 20+ hours of playtime. Weighing only 1.4 kg, Stockwell II packs a solid punch despite its pint-sized frame. Bluetooth 5.0 technology allows you to connect to a variety of wireless devices with a range of 10 m.

  Marshall signature sound: Stockwell II has three Class D amplifiers to power its subwoofer and its front and rear facing tweeters, for a sound that is powerful and clear. The cabinet is constructed with a bass reflex system that improves bass efficiency and extends the frequency response while lowering distortion.

  True Stereophonic: the multi-directional design immerses you in your music indoors or out, delivering 360 degree sound where every spot is a sweet spot.

  Iconic and rugged design: a solid metal grille pays homage to the steel mesh grille found on many microphones, and analogue control knobs fine-tune the music. The roadworthy construction with a silicone exterior makes it rugged and durable, and an IPX4 rating lets it withstand splashes of water.

  Portable playtime and carrying strap: quick charging means 20 minutes of charge returns hours of playtime, and a guitar-inspired carrying strap makes it easy to take along. Designed and engineered in Sweden. Made in China.
specs: |-
  - Driver type: Dynamic
  - Frequency range: 60 to 20,000 Hz
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 80 dB at 1 m
  - Cabinet principle: Bass-reflex
  - Amplifiers: digital Class D, 1 x 10 W + 2 x 5 W
  - Drivers: one 3 inch woofer, two 2 inch full range drivers
  - Adjustable bass and treble controls via analogue controls on the speaker
  - Wireless connectivity: Bluetooth 5.0
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: 3.5 mm input
  - Top panel controls: Bluetooth button, power/volume knob, bass knob, treble knob, battery indicator
  - Wi-Fi: No
  - Microphone system: No
  - Voice command: No
  - Battery type: built-in rechargeable Li-ion battery
  - Play time: 20+ hours
  - Quick charging: 20 minutes of charge time gives 6 hours of playtime
  - Charging time: 2.5 hours
  - Power input: USB-C, 5 to 12 V (12 V, 3 A adapter recommended, not included)
  - USB-C also charges a phone or other device from the speaker's battery
  - Weight: 1.38 kg / 3.04 lb
  - Width: 161 mm / 6.34"
  - Height: 180 mm / 7.09"
  - Depth: 70 mm / 2.76"
  - Water resistance: IPX4
  - Box contents: Stockwell II portable stereo loudspeaker, USB-C cable, quick start guide, legal and safety information
  - Not supported by any Marshall branded app
