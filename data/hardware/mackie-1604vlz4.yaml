description: Mackie 1604VLZ4 16-Channel 4-Bus Compact Analog Mixer for live
  sound, broadcast, and recording.
details: |-
  With 16 discrete Onyx mic preamps, the 1604VLZ4 suits a host of applications like home and professional studios, broadcast, utility mixing and complex synth rigs.

  Each of the sixteen boutique-quality Onyx mic preamps offers an ultra-wide 60 dB gain range, 128.5 dB dynamic range, +22 dBu line input handling and distortion under 0.0007% from 20 Hz to 50 kHz, with improved RF rejection for broadcast work and phantom power for studio condenser mics.

  Sixteen high-headroom line inputs with +4/-10 operation control and sixteen balanced inserts handle the front end, while 3-band EQ with sweepable midrange and an 18 dB/oct 75 Hz low-cut filter shape each channel.

  Routing is built out with four aux sends, four stereo returns, eight direct outs and four group/bus outputs, plus a control room / phones multi-input source matrix and high-resolution 12-segment stereo meters.

  The chassis is a rugged solid-steel Built-Like-A-Tank design with a powder-coat finish, 60 mm long-wearing log-taper faders and sealed rotary controls that resist dust and grime. The optional Rotopod accessory offers three physical rack configurations, and the multi-voltage power supply suits worldwide use.
specs: |-
  - 16 boutique-quality Onyx mic preamps
  - Ultra-wide 60 dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20 Hz - 50 kHz)
  - Phantom power for studio condenser mics
  - Improved RF rejection perfect for broadcast applications
  - 16 high-headroom line inputs with +4/-10 operation control
  - 16 balanced inserts perfect for integrating outboard gear
  - 3-band EQ with sweepable midrange
  - 18 dB/oct 75 Hz low-cut filter on mic input channels
  - 4 aux sends, level, pan, solo and overload/mute LEDs on each channel
  - 4 stereo returns, 8 direct outs and 4 group/bus outputs
  - Six 1/4" aux send output jacks on the rear panel
  - 60 mm long-wearing log-taper faders
  - Control room / phones multi-input source matrix
  - High-resolution 12-segment stereo meters
  - Sealed rotary controls resist dust and grime
  - Built-Like-A-Tank rugged steel chassis with powder-coat finish
  - Rack-mountable design with three physical configurations via Rotopod accessory (sold separately)
  - Multi-voltage power supply for worldwide use
