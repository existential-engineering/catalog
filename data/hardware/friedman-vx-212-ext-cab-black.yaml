details: |-
  The Friedman VX-212 extension cab is designed to match and complement the Vintage Series VX-30 all-tube head, delivering a dampened attack, warm lows, mellow upper-mids and a bell-like top end.

  The VX-212 is an open back 2x12 inch extension cabinet which uses tongue and groove Baltic Birch construction, and coupled with the VX-30 head it evokes rich definition and develops musical compression when pushed. At the heart of the cab are dual Celestion Alnico Blue speakers, a benchmark for tone connoisseurs who want to bring out the chime, harmonic complexity and touch sensitivity of the VX-30 head.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and the terminal. The Friedman VX-212 cab is handcrafted in the USA and designed to withstand the rigors of the road.
specs: |-
  - 2 x Celestion Alnico Blue 12 inch speakers
  - Nominal impedance: 16 ohms
  - Open back cabinet design
  - Tongue and groove Baltic Birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Designed to match the VX-30 Head
  - Available in Black or Ivory cosmetics
  - Dimensions: 10.25 in (d) x 27.25 in (w) x 21 in (h)
  - Weight: 45 lbs
  - Hand crafted in the USA
  - Limited lifetime warranty
