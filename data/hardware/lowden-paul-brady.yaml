details: |-
  Paul Brady is a renowned singer-songwriter and musician from Northern Ireland whose work fuses folk and pop. The Lowden Paul Brady Signature model is an O-shaped body handcrafted with AAAA grade Figured Bubinga and Sitka Spruce, featuring Maple body bindings and a 5-piece figured Maple neck with Rosewood splices. This artist signature model was created in collaboration with the musician and reflects his playing style and tonal preferences. As this guitar is an artist signature model, it is not configurable except for being available left- or right-handed. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - O-shaped body
  - AAAA grade Figured Bubinga back and sides
  - Sitka Spruce top
  - Maple body bindings
  - 5-piece figured Maple neck with Rosewood splices
  - Handcrafted construction
  - Hardshell case included
