details: |-
  CONTROLLER 01

  (Bus-powered Studio DAW Controller)

  Controller 01 is a simple, low-profile controller for Ableton Live, Logic, and other software. It's a slim, rack-mountable unit that allows for basic controlling of any DAW without giving up valuable space on your desk. 6 knobs and 3 buttons are assignable to any parameter, allowing you to easily control transport, write automation and perform fades with studio-quality buttons and pots topped with Neve-style Marconi knobs in black or oxblood color. Controller 01 is the perfect device for studio users with Output, Argosy, or similar mixing consoles wanting tactile control of their software without a plastic neon grid! Dimensions: 1U

  Designed and assembled in Seattle, Washington. Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
