description: >-
  The Crumar Multiman-S is a fully polyphonic orchestral string machine
  featuring five basic instrument sounds with a split keyboard design. Known as
  the Orchestrator in North America, it allows players to combine different
  instrument timbres independently on the left and right keyboard sections to
  create custom ensemble blends.
details: |-
  In 1977, Crumar introduced the Multiman-S as a response to the growing demand for accessible polyphonic synthesizers. The dual-section keyboard allowed performers to play contrasting instrumental combinations simultaneously, a feature that appealed to working musicians who needed versatility without the complexity of modular systems.

  The device was engineered for stage performance, featuring a robust flight-case design with carrying handles and protective cover. This practical construction reflected the era's emphasis on instruments built for touring musicians rather than studio-only use.

  The string sounds earned particular praise for their quality, drawing comparisons to the renowned ARP Solina String Ensemble. However, the instrument lacked built-in ensemble effects that could enhance these sounds further, requiring external gear for additional processing and sweetening effects.

  Optional accessories expanded its capabilities, including a 13-note foot pedal keyboard, sustain pedal, and foot expression controller that manipulated the brass filter's cutoff frequency, accommodating various performance styles and controller preferences.
specs: |-
  - Polyphony: 49 notes
  - Multitimbral Sounds: 6 (Brass, Piano, Clavichord, Cello, Violin, Bass)
  - LFO: Vibrato with Speed and Depth controls
  - Filter: Brass Filter with Attack, Decay, Cutoff, Resonance; Highpass String Filter
  - Envelope: Sustain length control
  - Effects: None
  - Arpeggiator/Sequencer: None
  - Keyboard: 49 keys
  - Memory: None
  - Control: Expression Pedal for filter; accepts Crumar's 13-note Foot Pedal keyboard
  - Date Produced: 1977
releaseDate: "1977"
releaseDateYearOnly: true
