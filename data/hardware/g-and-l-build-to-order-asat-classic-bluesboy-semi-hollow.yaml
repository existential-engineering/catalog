details: |-
  The G&L ASAT Classic Bluesboy is a factory-modded version of Leo's final word on the traditional single-cutaway bolt-on axe, and the semi-hollow version takes it further with G&L's distinctive twin voice chambers and f-hole added to a beautiful swamp ash body. For players looking for the unmistakable warmth of a classic humbucker in the neck position, the Bluesboy delivers with a well-balanced pairing of a G&L A2S4248N Alnico II magnet humbucker and a single-coil G&L Magnetic Field Design bridge pickup designed by Leo Fender. Framed in a classic boxed-steel bridge, the single-coil MFD bridge pickup delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the neck humbucker reveals all the charismatic warmth a player could ask for. Together the two pickups open up the limits of this guitar's surprising versatility. The semi-hollow body brings a certain "hi-fi" quality to the tone, softening the attack and slightly scooping the mids for accentuated highs and lows. The Bluesboy's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coil in bridge position, G&L A2S4248N Alnico II magnet humbucker in neck position
  - Body wood: Semi-Hollow Swamp Ash
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
