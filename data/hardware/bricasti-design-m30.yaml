url: https://bricasti.com/en/consumer/m30.php
description: The Bricasti M30 is a compact monoblock amplifier that brings the
  current delivery of the M28 into a rack-friendly 10.5-inch by 17-inch chassis.
  Its fully differential, bipolar design delivers 200W into 8 ohms with
  Stillpoints isolation integrated into the feet. Handcrafted in the USA.
specs: |-
  - Power output: 200W into 8Ω, 400W into 4Ω, 800W into 2Ω
  - THD+N: <0.005% (20Hz–20kHz, full rated power, 8Ω, 4Ω, and 2Ω)
  - Frequency response: 10Hz–150kHz, ±0.5dB
  - Signal-to-noise ratio: >95dB at full rated
  - Topology: fully differential, bipolar
  - Balanced input impedance: 200kΩ
  - Unbalanced input impedance: 100kΩ
  - Input trim: 0dB, -6dB, -12dB, -18dB
  - Chassis height: 10.5 inches
  - Chassis width: 17 inches
  - Mains voltage: 100, 120, 220, 230, 240 VAC, 50–60Hz (factory-set)
  - Power consumption: 60W standby, 2W idle
  - Finish: anodized aluminum
  - Stillpoints isolation devices integrated into feet
  - Monoblock configuration
  - Handcrafted in the USA
