details: |-
  Dynamics Distilled

  SPECTRACOMP BASS COMPRESSOR is the tiniest big thing to hit the world of bass in a long time. This ultra-compact and highly intuitive multiband compressor, is made to bring out all of the glorious low-end punch and presence of your beloved bass in the most transparent and musical way you’ve ever heard. Just turn it on and take charge of the groove.    •    Studio-quality multiband compressor -  perfectly tuned for bass    •    TonePrint enabled    •    Ultra-small footprint

  A Multiband Marvel

  We first introduced the magic of multiband bass compression in our innovative RH-series bass amps, which made dialing in super-smooth compression an absolute breeze. With SPECTRACOMP BASS COMPRESSOR we’ve kept the simplistic one-knob approach from the amps, while greatly improving the compression algorithm. This gives you access to studio-quality compression tones, in a stompbox so small that you can’t afford not to have it on your board.

  Honey, We Shrunk the Studio
