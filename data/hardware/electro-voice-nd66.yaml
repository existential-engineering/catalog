description: Small-diaphragm cardioid condenser instrument microphone designed
  for percussive and stringed instruments, including drum overheads, cymbals and
  acoustic guitar. The self-biased condenser element captures transient detail
  with a clean, crisp character, and a locking pivoting head allows precise
  placement in tight overhead and stand-mounted positions.
details: >-
  The ND66 is a small-diaphragm condenser microphone in Electro-Voice's ND
  Series, voiced for percussive and stringed instruments such as drum overheads,
  cymbals, hi-hats, hand percussion and acoustic guitars. A self-biased
  condenser element delivers fast transient response with clean, detailed
  high-frequency reproduction, giving cymbals shimmer and stringed instruments
  articulation without sounding brittle.


  The capsule sits in a locking pivoting head that lets the user angle the
  element independently of the body, which is useful for overhead and
  stand-mounted placements where the mic body would otherwise have to be twisted
  into awkward positions. Two selectable pads (-10 dB and -20 dB) and two
  selectable high-pass filters (75 Hz and 150 Hz) are built into the body, so
  loud sources and low-end rumble can be handled at the mic without relying on
  console processing.


  The ND66 has a cardioid polar pattern, a 50 Hz to 20 kHz frequency response
  and handles up to 146 dB SPL. It runs on 48 V phantom power and outputs a 200
  ohm balanced signal over a standard 3-pin XLR. The body is die cast zinc with
  a black polyurethane finish; the microphone is 143 mm tall, 21 mm in maximum
  diameter and weighs 0.179 kg.
