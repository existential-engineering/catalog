description: The S10 is a Eurorack controller module for the DROID system with
  two eight-position rotary switches and eight three-position toggle switches,
  providing direct haptic feedback for controlling patch parameters.
details: |-
  The S10 controller contains ten switches: the two big rotary switches at the top have eight positions each. The small switches on the bottom have three positions: top, middle, bottom. The rotary switches yield the numbers 0, 1, 2, ... 7, the small switches yield 0, 1 or 2. You can use these values to directly control parameters in your DROID patch. The special advantage of switches as opposed to buttons is the direct haptic feedback. So with the S10 you can create very intuitive playing interfaces for your own modular instrument. Also the S10 is very dense in functionality. The switches have a total of 40 different positions, at just 5 HP. The S10 is also part of the Live Kit . Current Draw: 10 mA +12V | 0 mA -12V | 0 mA 5V

  Width: 5 HP
  Depth: 25 mm

