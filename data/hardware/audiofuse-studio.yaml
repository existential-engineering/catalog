name: AudioFuse Studio
manufacturer: arturia
primaryCategory: audio-interface
website: https://www.arturia.com/products/audio/audiofuse-studio/overview
prices:
  - amount: 1299
    currency: USD
description: >
  A cutting edge interface for the modern producer, combining 4 exceptionally detailed preamps, perfect conversion, a total monitor solution, and even Bluetooth audio. Whatever creative challenge you face, AudioFuse Studio will help you master it.
details: |-
  The audiofuse studio is a premium desktop audio interface designed for modern producers, combining 4 exceptionally detailed discrete pro preamps with perfect conversion, a total monitor solution, and Bluetooth audio capability. It transforms musical ideas into world-class recordings and connects every aspect of a studio to a computer with world-class preamps, incredible connectivity, a versatile feature set, hands-on control, and clever design features. The interface delivers superb preamps, rock-solid performance, and low latency, making it suitable for bedroom production, mobile sound recording, and tracking live bands at full volume.

  The audiofuse studio features a superb analog signal path that reveals every nuance of audio with super-low equivalent input noise (ein) for capturing subtle details and 72db input gain to drive even the quietest ribbon microphones. Perfectly transparent ad/da conversion ensures practically zero-noise preamps with loads of gain, while the silky-smooth audiophile listening experience is maintained through highest quality components in the input and output signal paths. The interface includes a built-in phono preamp for vinyl sampling, Bluetooth streaming to monitors or DAW channels, and robust USB-c, adat, MIDI, and word clock connectivity.

  The complete monitoring section provides direct access to mono, mute, and dim functions with the ability to switch between 2 sets of speakers and select between 3 audio sources or mixers for instant a/b control. Two fully independent headphones outputs feature source selection and mono switches on both 6.35 and 3.5mm trs connectors, while a talkback feature with built-in microphone and pfl (pre fader listen) for each analog input are directly accessible on the interface. Reliable USB-c connectivity ensures low-latency performance for demanding sessions, and the Bluetooth receiver allows listening to and recording wireless audio streams from phones or tablets into the DAW without requiring a computer in standalone mode.

  The audiofuse studio includes the audiofuse creative suite, an ever-evolving selection of creative plugins curated from arturia's award-winning fx collection. This professional bundle features vintage studio tools to color pristine inputs, contemporary effects to expand sonic horizons, and inspiring presets across synthesis and effects categories. The included plugins provide comprehensive creative possibilities for professional music production and mixing workflows.

  Each audiofuse studio unit comes with a discrete pro individual audio performance certificate, a robust metal desktop chassis, and a complete box containing the interface unit, power supply, 2 MIDI jack adaptors, USB-c to USB-a cable (1.5m), USB-c to USB-c cable (1.5m), and the discrete pro achievement certificate. The interface is compatible with windows 7+ and apple 10.10+ systems with intel i5 cpu or faster, 4gb ram, 1gb free hard disk space, and opengl 2.0 compatible gpu.
specs: |-
  - 4 discrete pro preamps
  - 8 analog inputs + digital I/o
  - 18 inputs, 20 outputs channels
  - 4 mic/instrument/line preamps with discrete pro technology
  - 4 additional line inputs with inputs 5-6 commutable to phono
  - 4 analog inserts on channels 1-4
  - Bluetooth audio receiver supporting aptx and aac
  - 2 pairs of speaker analog outputs on balanced trs jack
  - 2 independent stereo headphones outputs on 6.35 and 3.5mm trs
  - 2 independent analog line outputs with reamp capability
  - USB-c interface compatible with pc and mac, fully USB 2.0 compatible
  - 8 digital adat inputs/outputs up to 96khz
  - S/pdif inputs/outputs or word clock input/output/thru on cinch rca
  - 24-bit latest generation ad/da converters at up to 192khz sampling rate
  - 72db input gain
  - Super-low equivalent input noise (ein)
  - Practically perfect flat frequency response
  - Transparent ad/da conversion
  - Built-in phono preamp for vinyl sampling
  - Direct monitoring with ultra-low latency internal mixers
  - Discrete pro individual audio performance certificate delivered with each unit
  - Robust metal desktop chassis
  - Low latency performance
  - Standalone mode capability for wireless audio streaming
  - Complete monitoring section with individual level control for speakers and phones
  - Direct access to mono, mute, dim functions
  - Switch between 2 sets of speakers and select between 3 audio sources or mixers for a/b control
  - Talkback feature with built-in microphone
  - Pfl (pre fader listen) for each analog input
  - Quick-access button for audiofuse control center software
  - Power up/shutdown control via long press
  - Premium discrete pro preamps with separated mic/instruments/line circuits
  - Audiofuse creative suite included
categories:
  - preamp
