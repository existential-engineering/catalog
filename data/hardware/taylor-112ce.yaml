description: Players love our cutaway Grand Concert acoustic guitars for their
  articulate sound and compact dimensions, and the 112ce fits the bill at a
  price point that's especially ideal for new players. A solid spruce top
  delivers bold, punchy sound with a balanced, clean character, making it a
  great choice for fingerstyle players as well as flatpickers and strummers.
details: |-
  The 112ce is a cutaway Grand Concert acoustic-electric guitar from Taylor's 100 Series, designed to be accessible for new players while remaining appealing to experienced ones. Its compact Grand Concert body shape is well-suited to fingerstyle playing and offers comfortable dimensions for a wide range of players.

  The top is made from solid torrefied spruce, a roasting process that replicates the aged-wood tonal characteristics of vintage instruments — delivering sweetness, clarity, and projection. The back and sides use layered sapele construction, which provides durability and consistent tone at an affordable price point.

  Taylor's Expression System 2 (ES2) electronics are built in, featuring a behind-saddle pickup design that captures the natural acoustic resonance of the guitar. This allows players to plug into an amplifier or PA system with authentic acoustic tone reproduction.

  The neck features Taylor's Standard Carve profile with a slim, low-action setup designed for easy fretting. The nut width of 1-11/16" is suited to both fingerstyle and flatpicking approaches.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Spruce (solid)
  - Back/sides: Sapele (layered)
  - Bracing: X Bracing
  - Cutaway: Venetian
  - Neck profile: Standard Carve
  - Scale length: 24-7/8"
  - Nut width: 1-11/16"
  - Electronics: Expression System 2 (ES2)
  - Finish: Matte
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Gig bag included
