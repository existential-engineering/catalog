description: PanMix Jr is a high quality 3 channel AC coupled mixer with manual
  panning and volume controls of mono sources with dual concentric knobs.
details: |-
  PanMix Jr is a high quality 3 channel AC coupled mixer with manual panning and volume controls of mono sources with dual concentric knobs. Each channel's output is separately available.

  Channels 1 and 2 can be switched to be mixed with the subsequent channel, allowing for 1-1-1, 1-2 and 3 mix configurations. Equal power pan law (3dB) is provided, and left and right LED indicators are available for all three channels.

  Several modules can be chained together via IN and OUT connections on the back side. This connection is possible with other Happy Nerding stereo modules too.

  At the moment the PanMix Jr stereo output can be internally sent to another PanMix Jr, 4x Stereo Mixer or 2xSAM module. A stereo signal can also be received from another PanMix Jr, 4x Stereo Mixer, 2xSAM, or the latest revision of PanMix.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - 3 channel AC coupled mixer
  - Manual panning and volume per channel with dual concentric knobs
  - Each channel output separately available
  - Channels 1 and 2 switchable to mix with the subsequent channel (1-1-1, 1-2, 3 configurations)
  - Equal power pan law (3dB)
  - Left and right LED indicators for all three channels
  - Internal stereo chaining via IN and OUT connections on the back side
  - 55 mA +12V
  - 55 mA -12V
  - 35 mm depth
  - 6 HP wide
  - Reverse power protected
