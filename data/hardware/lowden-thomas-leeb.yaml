details: |-
  Thomas Leeb is an Austrian fingerstyle guitarist and faculty member at the California Institute of the Arts. His unique playing style combines unusual techniques, ideas and harmonies, all played with a disarming sense of humour. His close friend, the late, great Eric Roche called Thomas his 'brother in strings'. The Lowden Thomas Leeb Signature model is an O-shaped cutaway handcrafted with AAAA grade Bastone Walnut and Sitka Spruce, featuring Sycamore body bindings and a 5-piece Mahogany neck with Rosewood splices. As this guitar is an artist signature model, it is not configurable except for being available left- or right-handed. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - O-shaped body with cutaway
  - AAAA grade Bastone Walnut back and sides
  - Sitka Spruce top
  - Sycamore body bindings
  - 5-piece Mahogany neck with Rosewood splices
  - Handcrafted construction
  - Hardshell case included
