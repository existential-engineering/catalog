details: |-
  The T5 II True Wireless Sport earphones from Klipsch are built for all-day comfort and durability during active use. Featuring a dynamic transducer with closed in-ear coupling, these earbuds deliver the clarity and detail Klipsch is known for, with support for the aptX, AAC, and SBC Bluetooth codecs over Bluetooth 5.0.

  The earphones are rated IP67, making them resistant to dust and capable of withstanding temporary submersion — suitable for intense workouts and outdoor activities. The ergonomic design comes with six ear tip sizes (Small through Large+) and three ear hook sizes to ensure a secure, comfortable fit for a wide range of users.

  Each earpiece provides up to eight hours of playback. The included charging case holds an additional three full charges, bringing total runtime to approximately 24 hours. The case charges via USB-C and also supports wireless induction charging. The package includes a USB-C cable with a USB-A adapter.

  Bluetooth profiles supported include A2DP 1.3, AVRCP 1.6, HSP 1.2, and HFP 1.7, enabling high-quality audio streaming as well as hands-free call handling. The T5 II True Wireless Sport is available in Black, White, and Green.
