description: >-
  Roland's first fully digital sample-based rack module from 1988, offering 2MB of PCM ROM sounds
  expandable via plug-in cards across 6 multitimbral parts with 31-voice polyphony.
details: |-
  The Roland U-110 marked the company's initial foray into entirely digital sample-based synthesis. As a 1U rack module, it was aimed squarely at studio musicians and producers who needed a broad palette of acoustic-oriented PCM sounds without the bulk of a keyboard workstation.

  Under the hood sits 2MB of ROM samples expandable to 4MB via up to four PCM expansion cards. The 31-voice polyphony spread across 6 multitimbral parts was generous for its time, though the sound-shaping tools are spartan. There are no filters to speak of, and the envelope controls are limited to basic attack and release parameters on the amplitude stage.

  Effects processing consists of chorus and auto-pan, which help add some dimension to the otherwise dry and somewhat static preset sounds. The expansion card system was a notable feature, allowing users to bolt on additional sound libraries covering everything from orchestral instruments to ethnic percussion.

  The U-110 is very much a product of its era. Its sounds defined the late-80s studio palette and while they may lack the depth of later sample-playback engines, they carry an unmistakable period character that still finds use in retro-flavored productions.
specs: |-
  - Polyphony: 31 voices
  - Multitimbral: 6 parts
  - Sound source: 2MB PCM ROM (expandable to 4MB via cards)
  - Expansion: Up to 4 PCM cards simultaneously
  - Filter: None
  - Envelopes: Amplitude attack/release only
  - Effects: Chorus, auto-pan
  - Control: MIDI
  - Keyboard: None (rack module)
releaseDate: "1988"
releaseDateYearOnly: true
