description: The Mana DW Collector's Series Icon was created to pay homage to legendary DW artist Alex Gonzalez.
details: |-
  The Alex Gonzalez DW ICON snare was created as a tribute to Latin pop rock icons Mana and their legendary drummer. After joining Mana at the age of 15, Alex's backbeat has helped power the band to the incredible international success of a dozen GRAMMYs and over 40 million albums sold.

  Alex's ICON snare features an 11-ply HVLT North American Hard Rock Maple shell with a Birdseye Maple outer veneer that is dyed gray and features laser-cut wood inlays of the Mana logo, Alex's iconic rose logo, and his recognizable portrait. The intricate inlays are crafted from dyed Pearwood, Koto, and Tulipwood.

  This limited edition 6.5 x 14″ snare drum is also fitted with premium black nickel DW hardware featuring a MAG throw-off, five-position (5P) butt plate, True-Hoops, True-Pitch tuning, DW Heads by Remo and more. DW will only be producing 250 of this remarkable snare and each includes a deluxe DW carrying case and a signed certificate of authenticity from John Good.
specs: |-
  - 11-ply North American Hard Rock Maple HVLT shell
