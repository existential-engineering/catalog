details: |-
  The Legacy Series EATON is a bookshelf 10" Dual Concentric Hi-Fi loudspeaker elevating the HPD heritage with upscaled drivers. The 400-Watt 10" Dual Concentric driver delivers breathtaking dynamics and unparalleled realism. Features a 2-band front-mounted energy control panel, 2 independent crossover channels, heavy-duty 24-carat gold-plated binding posts (including a fifth RF-ground post), DMT (Differential Materials Technology) bracing, and 12 mm rubber pads at the base. Ships with owner's care package and Birth Certificate of authenticity.
specs: |-
  - driver: 10" Dual Concentric
  - powerHandling: 400 W
  - crossover: 2-channel independent crossover
  - bindingPosts: 24-carat multi-layer gold-plated (x5 including RF ground)
  - frontPanel: 2-band energy control (LF/HF boost/cut)
