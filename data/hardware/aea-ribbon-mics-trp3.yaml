description: A two-channel half-rack microphone preamp with AEA's 3rd-generation
  JFET circuit design, providing high-output, high-impedance, and low-noise gain
  with a universal power supply for worldwide use.
details: |-
  Specifically designed for ribbon microphones, the TRP3 excels at drawing out the warmth and lush sound that ribbons are uniquely known for. Its 3rd generation circuitry is the cleanest and most musical design AEA has produced yet.

  Passive ribbons and other low-level sources require preamps that supply a high level of output. Without enough clean gain, low-level mic signals can sound too soft or too noisy. With the TRP3, you will never consider a source too quiet to record with a ribbon mic ever again.

  The TRP3 features a universal power supply that allows it to be used in any country without any modifications made to the unit. A single TRP3 can be easily racked with TRP3 Rack Ears, or two TRP3s racked side by side with a TRP3 Rack Shelf.

  All AEA Ribbon Preamps share the same topology and sound — the differences between each unit come down to extra EQ features and form factor.
specs: |-
  - 3rd generation circuit design
  - Two channels of microphone preamplification
  - High-output, high-impedance, low-noise gain
  - Half-rack form factor
  - Optimized for ribbon microphones and other low-level sources
  - Universal power supply for worldwide use
  - Rack-mountable with optional TRP3 Rack Ears or TRP3 Rack Shelf
