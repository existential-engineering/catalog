description: The D-28 Authentic 1937 combines vintage specs, VTS-aged Adirondack
  spruce, and lush Guatemalan rosewood for rich pre-war tone.
details: |-
  Few guitars are as celebrated as the D-28s built in 1937—a year that marked a high point in Martin's pre-war craftsmanship. The D-28 Authentic 1937 stays true to that legacy, featuring an Adirondack spruce top, forward-shifted hand-scalloped X-bracing, and historically accurate detailing throughout.

  This updated version includes Guatemalan rosewood back and sides for a lush, complex tone, along with subtle refinements that bring it even closer to the originals. The body profile is modeled after Dreadnoughts from the 1930s and '40s for enhanced historical accuracy, and the neck features the Authentic 1937 barrel and heel for the feel of a true vintage instrument.

  Martin's Vintage Tone System (VTS) is used to thermally age both the top and braces, delivering the rich, open sound of a well-loved pre-war guitar. Built entirely with hide glue and constructed by hand, the D-28 Authentic 1937 isn't just a tribute to the Golden Era—it's a direct line back to it.
specs: |-
  - Body Size: Authentic D-14 Fret (Dreadnought)
  - Top: Adirondack Spruce with VTS (Vintage Tone System)
  - Back: Guatemalan Rosewood
  - Sides: Guatemalan Rosewood
  - Bracing Pattern: Forward Shifted X Brace (Scalloped)
  - Construction: Dovetail Neck Joint - Hide Glue
  - Finish: Vintage Gloss
  - Top Inlay: Bold Herringbone
  - Binding: Antique White
  - Bridge: Ebony (Authentic Belly - Glue in Long Saddle)
  - Neck Shape: Authentic 1937
  - Neck Material: Genuine Mahogany
  - Scale Length: 25.4"
  - Frets Total: 20 (joins body at 14th fret)
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/4"
  - Fingerboard Inlay: 1937 Diamonds and Squares Long Pattern (Abalone)
  - Headstock: Solid with 1937 Taper and Diamond
  - Headstock Material: Guatemalan Rosewood
  - Tuning Machines: Waverly Nickel Open Back
  - Saddle: Bone (16" radius)
  - Bridge Pins: Faux Ivory with Black Plastic dots
  - Pickguard: Tortoise Pattern
  - Electronics: None
  - Case: Ply Hardshell Case
