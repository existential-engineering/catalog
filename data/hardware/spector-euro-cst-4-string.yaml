details: |-
  The Euro CST draws inspiration from our Woodstock, NY-based Custom Shop, introducing all-new tonewoods, electronics, and finish combinations never seen in the Euro Series. The Euro CST draws inspiration from our Woodstock, NY-based Custom Shop, introducing all-new tonewoods, electronics, and finish combinations never seen in the Euro Series. Each Euro CST instrument is meticulously crafted using premium materials, featuring a striking, highly figured Poplar Burl top, a resonant European Ash body, and a 3-piece North American Maple neck paired with an Ebony fingerboard adorned with laminated Abalone Crown inlays. These basses are equipped with a lightweight aluminum bridge for precise and reliable intonation. Premium active EMG X Series pickups deliver the exceptional clarity, attack, and silent operation that defines the Spector sound.? Spector is proud to offer the all-new Spector Legacy preamp for the Euro CST range. Developed in collaboration with Darkglass Electronics, this preamp captures the classic 'Spector growl' heard on countless iconic recordings with added versatility. Elevate your Spector experience with the all-new Euro CST lineup.
specs: |-
  - Figured Poplar Burl Top; European Ash Body
  - 3-pc Maple Neck; Neck-thru construction
  - 24 fret Ebony fingerboard; Laminated Abalone Crown inlays
  - Active EMG X Series Pickups; Spector Legacy Preamp
  - Natural Black Burst Gloss Finish
  - Gig bag included
  - Powered by an onboard battery for the active electronics, no external power connector
