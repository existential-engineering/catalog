  - distortion
url: https://ashdownmusic.com/products/aaa-perfect-10
description: A 60-watt bass practice combo in the AAA range, driving a custom
  10" Ashdown speaker. It has High and Low impedance inputs, a 3-band EQ,
  tube-emulated drive, a line input, a headphone output with speaker mute, an
  XLR DI, an extension speaker output, and an AppTek socket for iOS amp-sim
  integration.
details: |-
  60-watt AAA bass practice combo with a custom 10" Ashdown speaker. High and Low impedance inputs suit active or passive basses. Tube-emulated drive control from clean to distortion. 3-band EQ (Bass, Middle, Treble). Line input for an mp3 player, headphone connection with speaker mute for silent practice, a DI output for recording or a mixer, and an extension speaker output that works alongside the internal speaker. AppTek socket (4-pole mini jack) for iOS amp-sim and FX apps, including Ashdown's ABM Pre App via Agile Partners Amp Kit.
specs: |-
  - Power output: 60 watts
  - Speaker configuration: 1 x 10" custom Ashdown
  - EQ: Bass, Middle and Treble
  - High and Low impedance inputs
  - Tube-emulated drive control
  - Line input with mix control
  - DI output: XLR
  - Headphone output with speaker mute
  - Extension speaker output
  - AppTek socket (iOS amp-sim integration)
  - H x W x D: 440 x 410 x 335 mm
  - Weight: 15 kg
