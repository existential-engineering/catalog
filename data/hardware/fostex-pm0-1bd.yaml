description: Compact active speaker pair with a newly designed 75 mm full-range single driver, Bluetooth and analog AUX input, allowing subscription music and video streaming to be enjoyed in high sound quality.
details: |-
  The PM0.1BD allows users to enjoy subscription music and video streaming in high sound quality in a compact size. The single-driver speaker unit reproduces a sharp sound image with excellent localization and provides a wide range with total sound tuning.

  Newly designed 75 mm (3 inch) full-range single driver. The full-range driver reproduces a sharp sound image with straightforward sound quality from low to high frequencies. Combined with the compact size of the main unit, point source reproduction is easily realized and a realistic sound field can be felt.

  Bluetooth and analog (AUX) input support. The input can be switched between Bluetooth for smartphones and analog for audio interfaces (Bluetooth 5.0, SBC).

  Wooden enclosure with isolated structure. The natural-sounding wooden enclosure separates the enclosure from the amplifier section, eliminating the effect of sound pressure from the back of the driver on the amplifier's electronic circuitry. The R channel (active side) and L channel (passive side) share the same construction to minimize differences in sound quality between left and right. The amplifier section is a D-class 15 W + 15 W amplifier that drives both the R and L channels.

  Volume adjustment and input source selection are on the front panel, and a power-saving mode reduces power consumption when no signal is input for a certain period.
specs: |-
  - Enclosure type: bass reflex system
  - Unit: 75 mm cone full range
  - Amplifier output: 15 W + 15 W
  - Frequency response: 110 Hz to 20 kHz
  - External dimensions: 110 mm (W) x 153 mm (H) x 150 mm (D)
  - Weight: 2.4 kg (1 pair)
  - Bluetooth: standard Ver. 5.0, Power Class 1, approx. 10 m communication distance, 2.4 GHz band, A2DP profile, SBC codec, SCMS-T content protection, 20 Hz to 20 kHz transmission bandwidth
  - AUX connector: stereo mini jack, input sensitivity 500 mVrms, maximum input 2 Vrms
  - Power supply unit / AC power adapter: input AC 100 V to 240 V (50/60 Hz), output DC 15 V 3.2 A
  - Accessories: AC power adapter, speaker cable (1 m), safety precautions, operating instructions
  - Power-saving mode after a period of silence
