description: The PM0.1BD allows users to enjoy subscription music and video streaming in high sound quality in a compact size. The single-driver speaker unit not only reproduces a sharp sound image with excellent localization, but also provides a wide range with total sound tuning, offering a sound space beyond its size anywhere with ease.
details: |-
  The PM0.1BD is a compact active personal speaker system from Fostex designed to deliver high-quality audio playback for music and video streaming. Built around a newly designed 75 mm (3-inch) full-range single driver, it produces a sharp sound image with straightforward sound quality from low to high frequencies, and its compact form factor makes point-source reproduction straightforward to achieve.

  Inputs include both Bluetooth 5.0 (SBC, A2DP) for wireless playback from smartphones and an analog AUX stereo mini jack for connecting an audio interface or other line-level source. Source selection and volume are handled with knobs on the front panel of the R (active) channel for ease of operation.

  The wooden enclosure uses a bass-reflex design with an isolated structure that separates the cabinet from the amplifier section, reducing the effect of back-driver sound pressure on the electronics. The R (active) and L (passive) channels share the same enclosure construction to minimize sound differences between left and right, and a Class D 15 W + 15 W amplifier powers both channels.

  A power-saving mode is included that reduces consumption when no signal has been detected for a set period of silence. Frequency response is 110 Hz to 20 kHz, and the system is powered by the included AC adapter (AC 100 V to 240 V input, DC 15 V 3.2 A output).
specs: |-
  - Enclosure: bass reflex system
  - Driver: 75 mm cone full-range unit
  - Amplifier output: 15 W + 15 W (Class D)
  - Frequency response: 110 Hz to 20 kHz
  - External dimensions: 110 mm (W) x 153 mm (H) x 150 mm (D)
  - Weight: 2.4 kg per pair
  - Bluetooth: Ver. 5.0, Power Class 1, A2DP, SBC, SCMS-T
  - Bluetooth communication distance: approx. 10 m (no obstacles)
  - Bluetooth frequency band: 2.4 GHz (2400 MHz to 2483.5 MHz)
  - Bluetooth transmission bandwidth: 20 Hz to 20 kHz
  - AUX input: stereo mini jack, 500 mVrms sensitivity, 2 Vrms maximum
  - Power supply: AC 100 V to 240 V (50/60 Hz) input, DC 15 V 3.2 A output
  - Includes: AC power adapter, speaker cable (1 m), safety precautions, operating instructions
