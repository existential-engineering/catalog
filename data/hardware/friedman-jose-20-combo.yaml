details: |-
  The JOSE 20 Combo captures the hot-rodded British high-gain sound of the Friedman JOSE 100 in a versatile, compact 20-watt 1x12 format. Developed by Dave Friedman in close collaboration with Marisol Arredondo, daughter of amp modifier Jose Arredondo, the JOSE 20 Series delivers the voice, harmonic complexity and touch-sensitive response that defined generations of rock history, for the studio, the stage or home.

  Jose Arredondo's amplifier modifications helped define the sound of high-gain rock. His hot-rodded British amplifiers delivered greater sustain, richer harmonics, tighter low end and a more responsive feel than players had experienced before. They were not production amplifiers, they were individually modified instruments that became the secret weapon of countless professional guitarists and inspired generations of players, builders and tone chasers.

  Internally bridged Volume I and Volume II recreate the classic channel-jumping technique players once achieved with patch cables, blending bright attack with warm body to create the rich harmonic foundation at the heart of the Jose sound. The Plexi/Gain switch introduces a true additional gain stage, moving from classic Plexi response into the aggressive saturation that defined Arredondo's most celebrated modifications, while the Fat switch adds body, low-end authority and punch without losing articulation. The three-position Gain Style switch repositions the master volume within the circuit and introduces diode clipping, so each position reshapes the amplifier's response rather than simply adding more gain.

  The combo is loaded with a Celestion G12M-65 Creamback, selected by Dave Friedman for its warm midrange, smooth top end and dynamic response, which complements the amp's rich harmonics and expressive playing feel.

  A transparent series effects loop and a System Master Volume make the JOSE 20 as practical as it is inspiring, so authentic Jose dynamics are available at virtually any playing level. It is handcrafted in Los Angeles, and the series is also offered as a 20-watt head for players who prefer to choose their own cabinet.
specs: |-
  - 20-watt all-tube 1x12 combo
  - 2 x EL84 power tubes
  - 4 x 12AX7 preamp tubes
  - Loaded with a Celestion G12M-65 Creamback speaker
  - Developed by Dave Friedman in collaboration with Marisol Arredondo
  - Inspired by the amplifier modifications of Jose Arredondo
  - Internally bridged Volume I and Volume II recreate classic channel jumping
  - Plexi/Gain switch introduces a true additional gain stage
  - Fat switch adds body, punch and low-end authority
  - Three-position Gain Style switch revoices the circuit for three distinct Jose-inspired gain structures
  - System Master Volume
  - Transparent series effects loop
  - Custom made transformers
  - Handcrafted in Los Angeles, California
  - Limited 5-year warranty
  - Dimensions: 11.5 in (D) x 18.75 in (W) x 16.75 in (H)
  - Weight: 45 lbs
