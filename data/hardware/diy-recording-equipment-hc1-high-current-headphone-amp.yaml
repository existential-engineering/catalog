description: An expandable, high-powered headphone amplifier kit designed for
  critical studio monitoring, using a parallel dual-opamp design for low
  distortion and high current output into low-impedance headphones.
details: |-
  The HC1 is an expandable, high-powered headphone amp designed specifically for critical studio monitoring. The HC1's circuit employs parallel amp stages for greater power and lower distortion. This parallel-opamp concept has been known in theory for decades and was put to practical use in Douglas Self's "5532 OpAmplifier" power amplifier. As a result, the HC1 sounds clean and clear even at high gain and when driving low-impedance headphones. Because everyone's monitoring needs are different, the HC1 is designed to be customized. The power and audio input connectors are screw terminals, so you can attach whichever jacks you need without soldering. You can also daisy chain multiple HC1s to make a multi-channel headphone amp. The HC1 is a great project for intermediate builders who enjoy the challenge of choosing their own chassis and inputs. Features

