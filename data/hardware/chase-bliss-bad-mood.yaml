description: Bad Mood is a two-channel ambient multi-effect pedal pairing a
  micro-looper channel with a collection of real-time spatial effects, where the
  two channels can interact and interfere with each other.
details: |-
  Instant trouble: two interconnected channels of ambient mischief. Bad Mood is a romping return to the two-channel "instant bliss" workflow found in MOOD MKII, with a batch of new moods that explore the wild side of ambience. It's built to explore musical disguises, radio loops, and splintered harmonies, with two stereo channels that can interact and interfere with each other.

  Bad Mood is a two-channel multi-effect. One half samples and loops brief moments (the Micro-Looper Channel); the other is a collection of real-time spatial effects (the Wet Channel). Both sides can be fed through a global "Glue" effect to bond or obliterate them together. The two channels are aware of each other and can interact in a variety of ways: process the micro-loops with the spatial effects, record those effects into the loops, or use either side to modulate and interfere with the other.

  Bad Mood is the third pedal in the Small Batch Bliss collection: a made-to-order line of special-edition pedals with no unit limit. Anyone who orders within the month-long preorder window gets one built for them; after the preorder window closes, Chase Bliss continues to make and ship them.

  Control comes from onboard presets, MIDI, CV, or expression. Two presets store directly on the pedal, with up to 122 more accessible via MIDI, alongside internal ramping modulation and dip-switch-configurable options such as MISO (mono-to-stereo) and SPREAD (unique stereo processing).
