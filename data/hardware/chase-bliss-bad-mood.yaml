description: Bad Mood is a romping return to the two-channel "instant bliss"
  workflow found in MOOD MKII, a batch of big new moods that explore the wild
  side of ambience. Explore musical disguises, radio loops, and splintered
  harmonies, with two stereo channels that can interact and interfere with each
  other.
details: |-
  Bad Mood is a two-channel multi-effect. One half samples and loops brief moments (the Micro-Looper Channel), the other is a collection of real-time spatial effects (the Wet Channel). Both sides can be fed through a global "Glue" effect to bond or obliterate them together.

  What makes Bad Mood unique is that its two channels are aware of each other and can interact in a variety of ways. Micro-loops can be processed with the spatial effects, those effects can be recorded into the loops, or either side can be used to modulate and interfere with the other.

  Shared controls include MIX (blends input and processed signal, or sets ramp speed when ramping is engaged), CLOCK (sets the sample rate, controlling the length and resolution of the Micro-Looper Channel and the quality and time of the Wet Channel), ROUTING (controls what gets processed by the Wet Channel when both channels are on), and a PRESETS toggle for two internal preset slots. The Wet Channel offers Soup, Relay, and Flip modes (decay/size, delay time, and lag/spacing respectively on the TIME knob, with character, feedback, and harmony on MODIFY), while the Micro-Looper Channel offers Burst, Radio, and Mask modes with independent LENGTH and MODIFY controls.

  Bad Mood is a true stereo device that can also be used in mono, or mono to stereo, with a MISO dip switch to split a mono input into a stereo output and a SPREAD dip switch for unique stereo processing. It can be controlled with MIDI (note, PC, CC, and clock sync via a Chase Bliss MIDIbox), CV (0-5V), an expression pedal, or an external footswitch. Additional dip switches offer DRY KILL, TRAILS, LATCH, HALF, SMOOTH, and DRY GLUE behaviors, and internal ramping/bounce modulation can automate the knobs.

  Bad Mood is part of the Small Batch Bliss collection, a made-to-order line of special-edition pedals with no unit limit, available in Xtreme Red and Grey (Ink Edition) colorways. Each pedal ships with a Field Guide, a temporary tattoo, and a comic.
specs: |-
  - Stereo I/O, mono and mono-to-stereo compatible (MISO dip switch)
  - 2 internal presets, up to 122 via MIDI
  - Internal modulation (ramping and bounce)
  - MIDI control (note, PC, CC, clock sync) via MIDI/EXT jack, requires Chase Bliss MIDIbox
  - CV control (0-5V) via EXP/CV jack
  - Expression pedal control via EXP/CV jack
  - External footswitch control via MIDI/EXT jack
  - Micro-Looper Channel with Burst, Radio, and Mask modes
  - Wet Channel with Soup, Relay, and Flip modes
  - Global "Glue" saturation/output effect
  - CLOCK knob sets sample rate for both channels
  - Cross-channel routing and interaction
  - Trails mode
  - Analog dry thru
  - Buffered bypass
  - Dip switches: MISO, SPREAD, DRY KILL, TRAILS, LATCH, HALF, SMOOTH, DRY GLUE
  - Power: 9V DC center negative, ~200 mA
