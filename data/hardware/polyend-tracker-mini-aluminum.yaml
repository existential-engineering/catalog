description: A limited 10th-anniversary edition of the compact 16-track Tracker
  Mini sampler and step sequencer, housed in a precision-machined aluminum body
  with redesigned buttons and a high-contrast glass screen.
details: |-
  It preserves the classic Tracker Mini experience with a new look, encased in a solid, precision-machined aluminum body with redesigned buttons and a high-contrast glass screen. It was designed and assembled at Polyend's headquarters in Poland.

  The edition is offered in two finishes: a Raw Silver (Light) for a clean, modern look and a Mat Black (Dark) for a timeless appearance. Both share the same durable all-aluminum enclosure.

  This special edition maintains the original Polyend Tracker Mini workflow and functionality. All Tracker Minis share the same hardware interface, including the d-pad navigation, master controls, I/O, function buttons, and the same continually evolving firmware. It offers stereo sampling, a built-in microphone, a rechargeable battery with roughly eight hours of runtime, five synth engines (ACD, FAT, VAP, WTFM plus a PERC drum synth), USB multi-track audio, and full compatibility with Tracker+ projects.

  Units were made to order: Polyend produced only the number reserved during the campaign, with no additional batches planned.
specs: |-
  - 16-track sampler and step sequencer
  - Stereo sampling with built-in microphone
  - Five synth engines: ACD, FAT, VAP, WTFM plus PERC drum synth
  - USB multi-track audio
  - Battery-powered (rechargeable, approximately 8 hours of runtime)
  - Precision-machined all-aluminum enclosure
  - Redesigned buttons and high-contrast glass screen
  - Full compatibility with Tracker+ projects
  - Height (with buttons): 0.73 in (1.84 cm)
  - Width: 6.70 in (17 cm)
  - Depth: 5.12 in (13 cm)
  - Weight: device 0.96 lbs (435 g), incl. hard case 1.61 lbs (730 g)
