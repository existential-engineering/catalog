details: |-
  The HYDRA pairs high-fidelity reverb and tremolo in stereo, intended as an end-of-pedalboard unit for guitar, bass or keyboard. It was designed as a companion to the maker's ECCOS delay. This Ariel Posen Artist Series edition carries artwork by Sebastian White, an Artist Series bottom print, and the artist's own settings stored on preset 1; it was a limited second run of 50 pieces.

  The reverb side offers spring, plate and room voices, and the tremolo side offers harmonic, vibrato and sine wave shapes with tap tempo. Alt controls reach further parameters, including shimmer, spring age and room or hall size, and an infinite hold can be used to sustain a reverb trail indefinitely.

  Up to three presets can be saved from the front panel. Reverb trails can be engaged on the fly rather than through internal dip switches, the order of the two effects can be swapped while playing, and the pedal switches between true bypass and trails the same way. It works with remote switching systems and carries both a TRS expression pedal input and an external tap tempo input, with the expression pedal assignable to any knob.

  The pedal runs on 9 volt DC, drawing 146mA, and is made in Edmond, United States.
