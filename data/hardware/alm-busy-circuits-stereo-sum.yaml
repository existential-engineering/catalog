    currency: GBP
description: >-
  The STEREO SUM is a compact 4HP unity gain summing mixer featuring four stereo
  input pairs that can be combined to two independent stereo mix outputs or
  merged into a single combined mix. It is DC coupled for mixing both audio and
  CV signals, with normalization between the two mixer sections for flexible
  single-cable routing.
details: |-
  The STEREO SUM is a passive-style unity gain stereo summing module in a highly compact 4HP format. It takes four stereo input pairs and routes them to two independent stereo mix outputs (Mix A and Mix B), with each section summing two stereo pairs.

  The module is DC coupled throughout, meaning it handles both audio signals and CV voltages equally well. The two mixer sections are normalized to each other: if Mix A's output jacks are left unpatched, inputs 1–2 are automatically added into Mix B along with inputs 3–4, effectively creating a single four-pair summed output from one cable.

  A fully featured VCV Rack emulation is also available free from the VCV Rack library.
specs: |-
  - Width: 4HP
  - Depth: 32mm
  - +12V current draw: 8mA
  - -12V current draw: 8mA
  - Inputs: 4 stereo pairs (8 x 3.5mm jacks)
  - Outputs: 2 stereo pairs (4 x 3.5mm jacks)
  - Unity gain (no attenuation controls)
  - DC coupled (audio and CV compatible)
  - Reverse power protection
  - Made in England
