description: Alter X is the pedal version of the Alter 1 Eurorack module,
  offering seven DSP effects including delay, reverb, distortion and glitch with
  quarter-inch and 1/8-inch jacks and buffered relay-based bypass for trails.
details: |-
  The Alter X is temporarily unavailable. It will be available for purchase again in late June. We apologize for the inconvenience. Alter X is the pedal version of Alter 1 eurorack module featuring four 1/4" jacks in addition to 1/8" as well as buffered switching that allows for trails. Though it functions the same as other pedals, this pedal is a little different. Most pedals are made for guitars and then artists may choose to use them in different ways. We made this pedal to work with either standard ¼" jacks (for both input and output) or 1/8" (3.5mm) jacks for use with anything else. For those who like to use CV (control voltage) for any eurorack format, cv keyboard, or pedals which output cv (eg. expression or sequencing), all four of the main knobs have cv inputs (mix, x, y, filter) so you can control your knobs without touching if the desire strikes you. These pedals accept guitar, line or eurorack levels. The enclosure is very thick, gold plated PCB (it's very, very tough). Included power is standard for most pedals (2.1mm, -tip)

  We wanted a broad array of effects in each X and Y pedal so each is a mashup of effects which we thought complimented one another when used together. Running X into Y or vis versa creates some powerful changes. CONTROL

  - Controls for Mix, X, Y and Sift as well as clock. - All effects have a variation of a filter which may change effect to effect. - X and Y control various rates, feedback and time over the different effects (note that some of the images shows a prototype which says "rate" under two of the pots. The faceplate has been changed to "X" and "Y"). - Clock control adjusts the bitrate which controls the DSP which can drastically change the effect. In doing so it does slightly lower the quality of the output signal but the results are fantastic. This clock is not for synchronization. - Mix, X, Y and filter all have CV control inputs. - Each control level or cv input is visualized on the control panel. - Buffered relay-based bypass over 1/4" ins and out. INS AND OUTS

  - Stereo 1/4" ins and outs. - Stereo 3.5mm inputs with separate level/gain control for right and left channels. These levels can also act as mute as it can take the signal to 0. They can also add gain to a quiet signal. - Peak level indicator for clipping levels at the input. -Mono input is made stereo within the DSP and outputs to both left and right channels. - Stereo outputs for right and left channels. EFFECTS

  1 - long delay
  2 - notated granular delay
  3 - plate reverb
  4 - shimmering reverb
  5 - distortion and multi-filter
  6 - pitch delay
  7 - stutter glitch

  SPECS

  - power: 12v negative tip AC Adapter (included) - US - 100-240V ~ 50/60Hz 0.6A
  - dimensions: 6" x 5.1" x 2.2" (152.7mm x 128.5 x 56mm)

  SHIPPING, FULFILLMENT & DELIVERY

  We are a small company and strive to fulfill orders as quickly as possible. During busy times, please allow up to several business days for order fulfillment. International Shipments (delivery address outside the U.S.) may be subject to import duties, value added taxes (VAT), and long customs clearance times. Tariff rates vary from country to country. Folktek does not collect VAT on behalf of the customer. Folktek is not responsible for payment of import taxes. Please check with your local customs agency for rates and more information. **Note: There may be tiny scratches or blemishes on the faceplates from the manufacturing process. These scratches are unavoidable.
