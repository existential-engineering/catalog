details: |-
  QUAD BROWNIAN ACCUMULATOR 10 HP | +12: 105 mA, −12: 85 mA | JORW4 User Manual (PDF) | ModularGrid Available exclusively through our authorised dealer network . A ‘battery for CV’, an analogue accumulator is a circuit which stores a voltage, and then charges or discharges it in discrete steps according to a trigger signal. Walk 4 combines four such accumulators with a clock generator, four white noise sources and an auto reset system to create a 10 HP voltage stepping juggernaut. The accumulators are principally used to create staircase waveforms. At each trigger, the stored voltage changes by a certain amount. This value can be set directly through an input, by the module’s shared parameters trend, volatility and constrain, or any combination thereof. Trend provides a fixed value input to all accumulators, while constrain prevents them from straying too far away from the baseline. Volatility brings the noise generators into play, adding an element of chance at every trigger. This elevates Walk 4 from not just a quad arpeggiator or subharmonics generator, but also a fourfold random walk CV or coloured noise source. With full voltage control and independent value and trigger inputs for each accumulator, there’s always more stochastic patching to explore ahead. And if you need a reliable master clock source with a huge range, 1 volt per octave tracking and external reset—that’s covered, too. Like a sample-and-hold with a master’s degree, Walk 4 brings a welcome touch of vintage analogue computing to any Eurorack system.
specs: |-
  - 4 high-precision analogue voltage accumulators.
  - Integrated wide-range clock trigger generator with 1 volt per octave tracking.
  - Trend parameter for simultaneous modulation of all accumulator values.
  - 4 white noise generators add adjustable volatility.
  - Constrain provides counteracting force, preventing voltages from accumulating too quickly.
  - Automatic and trigger-driven reset functions.
  - Add input adds a continuous external signal to all accumulator outputs.
  - Impedance-compensated outputs with dual-colour vari-wave LEDs.
  - Trim potentiometers accessible from the front panel.
  - Precision-milled 2 mm anodised aluminium front panel with high-resolution, non-erasable graphics.
  - Bullet-proof design: polarised power header and MOSFET protection circuit.
  - Includes 16-to-10-pin Eurorack power ribbon cable.
  - Premium mounting hardware: black screws, black nylon washers and matching hex key.
  - High-quality components and assembly; designed and made in Belgium.
