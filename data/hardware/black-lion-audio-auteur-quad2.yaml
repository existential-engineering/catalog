description: A boutique mic preamp — four times over! Auteur Quad² is a
  four-channel rackmount edition of our lauded Auteur mic preamp. Auteur preamps
  are known for their snappy, transparent, American-style IC-based input stage
  while also providing a fat, colorful British-style output stage via US-made
  Cinemag transformers.
details: The Auteur Quad² is a four-channel rackmount microphone preamplifier,
  representing an updated version of the original Auteur Quad. It pairs a
  snappy, transparent American-style IC-based input stage with a fat, colorful
  British-style output stage via US-made Cinemag output transformers — one per
  channel. Each channel has independent +48V phantom power, polarity reverse,
  and -10dB pad. Front-panel 1/4" DI inputs on all four channels handle
  instrument and line-level signals. Rear-panel XLR inputs, parallel XLR and TRS
  outputs per channel. Analog VU meters for level monitoring. Gain range +10 to
  +66dB. Max input +19dBu, max output +29dBu.
specs: |-
  - Preamp Type: Solid State
  - Number of Channels: 4
  - Transformers: 4 x Cinemag (output, US-made)
  - Phantom Power: Yes (+48V, per channel)
  - Pad: -10dB (per channel)
  - Polarity Switch: Yes (per channel)
  - Input gain: +10 to +66 dB
  - Max input level: +19 dBu
  - Max output level: +29 dBu
  - Noise: -92 dBu (20kHz unweighted)
  - THD+N: 0.003% minimum at +4 dBu
  - Frequency response: 20Hz-20kHz ±0.003 dB
  - Analog VU meters
  - Form factor: 1U rackmount
