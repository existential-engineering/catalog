description: The DAC3 B is a professional-grade digital-to-analog converter
  designed for studio monitoring and high-fidelity audio applications, featuring
  fixed output levels without built-in volume control. It offers jitter-immune
  UltraLock3 clocking, linear-phase filters, and high-headroom DSP.
details: |-
  The Benchmark DAC3 B is a half-rack, 1U digital-to-analog converter built for professional studio monitoring and audiophile listening. It provides fixed output levels, making it ideal as a source-level DAC feeding a separate preamplifier or power amplifier. The unit accepts five digital inputs: one USB Audio 2.0 port (supporting up to 192 kHz PCM and native DSD), two optical TOSLINK inputs (up to 96 kHz), and two coaxial S/PDIF inputs.

  At the analog output stage, the DAC3 B delivers balanced XLR and unbalanced RCA outputs simultaneously. Balanced output level is +24 dBu at 0 dBFS with attenuators off, or 4 Vrms with the 10 dB attenuator engaged. Unbalanced RCA outputs are fixed at 2 Vrms at 0 dBFS. The unit can be configured for studio or hi-fi output level conventions.

  The UltraLock3 clock system renders incoming jitter inaudible, re-clocking all digital inputs with a low-noise internal oscillator. Linear-phase reconstruction filters preserve transient accuracy and produce accurate analog waveforms.

  The DAC3 B is built around the ESS ES9028PRO converter chip and achieves a signal-to-noise ratio of 128 dB A-weighted, THD+N of -113 dBFS at 1 kHz, and crosstalk of -137 dB at 20 Hz. Frequency response is flat within 0.015 dB from 20 Hz to 20 kHz at standard sample rates.

  The chassis is half-rack wide at 1U height (9.5" W × 1.725" H × 8.5" D). Power consumption is under 0.5W at idle and 12W typical.
specs: |-
  - SNR: 128 dB A-weighted (relative to intersample peaks) at 44.1–96 kHz
  - THD+N at 1 kHz: -113 dBFS (0.00022%)
  - Frequency response: +0 dB / -0.015 dB (20 Hz – 20 kHz)
  - Crosstalk: -137 dB @ 20 Hz
  - Balanced XLR output: +24 dBu @ 0 dBFS (attenuators off); 4 Vrms with 10 dB attenuator
  - Unbalanced RCA output: 2 Vrms @ 0 dBFS
  - Supported sample rates via USB: 44.1, 48, 88.2, 96, 176.4, 192 kHz; native DSD
  - Supported sample rates via optical: up to 96 kHz
  - Group delay: 1.36 ms @ 44.1 kHz; 0.47 ms @ 192 kHz
  - Converter chip: ESS ES9028PRO
  - UltraLock3 jitter-immune clock system
  - Linear-phase reconstruction filters with 3 dB headroom above 0 dBFS
  - Form factor: half-rack wide, 1U height
  - Dimensions: 9.5" W × 1.725" H × 8.5" D
  - Weight: 3 lbs (unit); 4 lbs with accessories
  - Power consumption: <0.5W idle, 12W typical
  - Available in silver or black faceplate
  - Windows USB Audio 2.0 driver required; Mac and Linux driverless
