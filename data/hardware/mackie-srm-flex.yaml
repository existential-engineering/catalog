url: https://mackie.com/en/products/loudspeakers/srm-flex/srm_flex.html
description: "Legendary SRM Series sound quality in an ultra-portable design
  that is flexible, reliable, and easy to control."
details: |-
  Ultra-portable all-in-one portable column PA system featuring 1300W of power with a custom wide-dispersion array that delivers room-filling sound for audiences up to 100 people. The 6-driver wide-dispersion array pairs with an integrated 10" subwoofer for full-range performance.

  Built-in 6-channel digital mixer with physical knobs gives hands-on control plus wireless control via the SRM-Flex Connect app for iOS and Android. Inputs accommodate mics, instruments, and media players, with a professional XLR output for connecting an additional SRM-Flex or front-of-house mixer.

  Bluetooth streaming lets users play music and backing tracks from any Bluetooth-enabled device. Application-specific voicing modes (Music, Speech, Live) along with three reverb options and 2-band EQ make it easy to dial in the right sound for any situation.

  Designed for portability, the system weighs 29.6 lb (13.4 kg) and includes a universal 100-240 VAC power supply with Power Factor Correction for reliable performance worldwide.
specs: |-
  - 1300W power
  - 6-driver wide-dispersion array with 10" subwoofer
  - Built-in 6-channel digital mixer
  - SRM-Flex Connect app for iOS and Android wireless control
  - Bluetooth audio streaming
  - Application-specific voicing modes (Music, Speech, Live)
  - 3 reverb options and 2-band EQ
  - Professional XLR output for daisy-chaining or FOH
  - Universal 100-240 VAC power supply with Power Factor Correction
  - Weight: 29.6 lb (13.4 kg)
  - Dimensions with extenders: 78.8 x 13 x 14.4 in (2002 x 330 x 366 mm)
  - Supports audiences up to 100 people
