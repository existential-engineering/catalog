description: Legendary SRM Series sound quality in an ultra-portable design that
  is flexible, reliable, and easy to control.
details: |-
  The ultra-portable Mackie SRM-Flex Portable Column PA System features 1300W of power and a custom wide-dispersion array ensuring plenty of headroom for crystal-clear, room-filling sound. A 6-driver array pairs with a 10" subwoofer, and the adjustable height directs the sound at ear level for optimal coverage.

  The built-in 6-channel digital mixer offers control through physical knobs or wirelessly on a phone via the SRM-Flex Connect app on iOS and Android. Music or backing tracks can be streamed from any Bluetooth enabled device.

  Inputs cover mics, instruments and media players, and a professional XLR out connects to an additional SRM-Flex or a front-of-house mixer. 2-band EQ on channels 1 and 2 adjusts the tone of a mic, guitar or keyboard, and application voicing modes tailor the system to the venue with a choice of Music, Speech and Live.

  Three reverbs are available to finish the sound, and tactile knobs for every critical function avoid menu navigation on a small screen. A carry bag for the array module and extenders plus a protective cover for the subwoofer and mixer module are included.
specs: |-
  - 1300W peak system power (LF 1000W peak, HF 300W peak, both Class-D with active cooling)
  - 10" / 254 mm low-frequency driver with ferrite magnet
  - 6x 2.0" / 51 mm silk dome tweeters in a wide-dispersion array
  - Frequency range (-10 dB): 40 Hz - 20 kHz
  - Frequency range (-3 dB): 50 Hz - 20 kHz
  - Maximum SPL peak: 118 dB
  - Coverage: 90 degrees horizontal, 50 degrees vertical
  - Crossover frequency: 600 Hz, 18 dB Butterworth
  - Built-in 6-channel digital mixer
  - 2-band EQ on channels 1 and 2 (+5 / -15 dB at 90 Hz and 6.0 kHz)
  - 3 speaker voicing modes: Music, Speech and Live
  - 3 reverb programs (short, medium, long)
  - Bluetooth 4.2 Class 1 for audio streaming and user interface control
  - SRM-Flex Connect app for iOS 11 or later and Android 6 or later
  - Professional male XLR Mix Out, 600 ohm balanced
  - Peak and RMS limiting, power supply and amplifier thermal protection
  - Universal power supply 100-240 VAC, 50-60 Hz, 110W with Power Factor Correction
  - Black polypropylene enclosure with polyurea finish and powder-coated perforated steel grille
  - Total size with extenders (H x W x D): 79.0 x 13.0 x 14.2 in / 2007 x 330 x 361 mm
  - Weight: 29.6 lb / 13.4 kg
  - Included: carry bag for array module and extenders, protective cover for subwoofer/mixer module
