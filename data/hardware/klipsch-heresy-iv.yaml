description: The Heresy IV is a three-way floorstanding speaker from Klipsch's
  Heritage Collection, originally introduced in 1957 and redesigned with an
  all-new high-fidelity crossover network and rear Tractrix port for improved
  low-frequency extension. Designed and assembled in Hope, Arkansas, it features
  book-matched wood veneers and is available in multiple premium finishes.
details: |-
  The Heresy IV is part of Klipsch's iconic Heritage Collection and represents the fourth generation of the original Heresy design dating back to 1957. It is a three-way floorstanding speaker built around Klipsch's signature horn-loaded technology.

  The high-frequency section uses a K-107-TI compression driver with a titanium diaphragm paired with a newly designed phase plug for wide, controlled dispersion. The midrange is handled by a K-702 compression driver with a polyimide diaphragm loaded by the K-704 Tractrix horn, delivering efficiency and dynamics characteristic of the Heritage lineup.

  A major update in the IV generation is the addition of a rear-facing Tractrix port with custom inner port flares designed to reduce turbulence and port noise, extending low-frequency performance by approximately 10 Hz compared to the previous generation. The all-new crossover network was designed from scratch to complement the updated driver complement.

  The cabinet is available in four premium finishes — Satin Black Ash, Distressed Red Oak, American Walnut, and American Auburn — all featuring book-matched wood veneer panels. Every Heresy IV is designed and assembled in Hope, Arkansas, USA, and backed by a 10-year warranty.
