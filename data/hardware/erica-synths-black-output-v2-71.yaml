description: Output mixer and a stereo panner with balanced outputs.
details: |-
  Erica Synths Black Output is a high quality output mixer and a stereo panner with balanced outputs and a headphone amplifier for monitoring a modular system.

  All inputs are buffered, and the panning uses stereo potentiometers similar to those fitted in high quality studio mixers. IN4 is a stereo input with simultaneous level adjustment for both channels, and IN3 has a CV controlled autopan function. A 6.3mm jack carries the balanced outputs and the headphones.

  Input and pan CV signal levels both span -10V to +10V, the headphone amplifier delivers 100mW, and the module occupies 14HP at a depth of 35mm.
specs: |-
  - Input signal level -10V to +10V
  - Pan CV input signal level -10V to +10V
  - Headphone amplifier output power 100mW
  - Power consumption +52mA, -43mA
  - Module width 14HP
  - Module depth 35mm
