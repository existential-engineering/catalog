details: |-
  The XIX Anniversary GEx2 is the nineteenth anniversary black edition of Keeley's dual germanium compressor and germanium overdrive, limited to 100 units.

  The overdrive half offers two germanium voicings, a tighter low gain mode and a higher gain, more saturated mode. The compressor half is germanium-powered and carries the Compressor Plus style Blend and Tone controls, so clean signal can be mixed back in for chord work and the high end brightened.

  The two halves are independently routable. The order of compressor and drive can be swapped instantly, which the page frames against the usual trade-off: compression before drive gives a consistent gain level and less idle noise, while compression after drive gives a warmer, rounder tone with more sustain. Each half provides enough output volume to boost and push an amplifier, with its own tone shaping controls.

  TRS insert jacks divide the pedal into two separate units, so other effects can be placed between the compressor and the drive, and the same jacks let a pedal switcher control each side independently with TRS cables. The page embeds a demo video and links the instruction sheet.
