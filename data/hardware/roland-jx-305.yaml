description: >-
  A 61-key groovebox synthesizer from 1998 that combined Roland's dance-oriented sound engine with
  real-time performance controls and an eight-track pattern sequencer.
details: |-
  The Roland JX-305 occupies a unique space as a hybrid between a keyboard synthesizer and a
  groovebox, designed specifically for electronic music performance and production. Released in 1998,
  it builds on the MC-505's sound engine with an additional 4MB of sample memory, offering 640
  patches across 28 drum kits and 768 dance patterns.

  Nine real-time control knobs provide immediate access to filter, envelope, tempo, arpeggiator, and
  LFO parameters, making the JX-305 a hands-on performance instrument. The digital resonant filter
  supports both low-pass and band-pass modes with full MIDI control. Twenty-four built-in effects
  including reverb, delay, and chorus round out the sound-shaping options.

  The eight-track sequencer with quantize and edit functions can record all knob tweaks, pattern
  changes, and keyboard playing in real time. With 256 user-programmable patterns and 64 voices of
  polyphony, the JX-305 provided a complete production environment in a single 61-key instrument.

  The velocity-sensitive keyboard and comprehensive MIDI implementation made it equally suited for
  studio work and live electronic performance.
specs: |-
  - Polyphony: 64 voices
  - Keyboard: 61 keys, velocity sensitive
  - Patches: 640 presets, 28 rhythm kits
  - Patterns: 768 dance patterns (256 user-programmable)
  - Filter: Digital resonant low-pass and band-pass
  - Effects: 24 types including reverb, delay, chorus
  - Sequencer: 8-track with arpeggiator and phrase sequencer
  - Controls: 9 real-time knobs
  - Control: MIDI In/Out/Thru
releaseDate: "1998"
releaseDateYearOnly: true
