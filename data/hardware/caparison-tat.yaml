details: |-
  The original TAT model was among the first ground-breaking designs that established the core vision behind the conception of Caparison guitars. This classic model has now been reintroduced as a 2025 version, featuring the original neck-through design with a 648mm scale length, 24 frets, and an SSH pickup configuration. Crafted from Alder, the body mirrors the inaugural TAT, delivering a versatile and expansive tonal range. The distinctive curved top enhances playability while maintaining the exceptional sound quality. For the 2025 edition, the neck features a robust 5-piece blend of maple and walnut, complemented by an Ebony fingerboard and stainless-steel jumbo frets. The high-output "PH-R" bridge pickup is direct mounted for optimal clarity and responsiveness, complimented with Caparison "SH-NC" single-sized humbucking pickups for the middle and neck positions. A 5-way Schaller Megaswitch provides an extensive array of unique tonal options. The Caparison TAT is available in 4 finishes: "Interstellar Black", "Frozen White", "Light Blue Pearl" and a late addition, "Crimson Purple". All feature a vibrant metallic finish with unmistakable 80s character, combining vintage appeal with a bold, modern edge.
