description: Supercardioid condenser microphone head optimized for speech and
  vocals. Designed for Sennheiser wireless systems with high feedback rejection.
details: |-
  Supercardioid pattern with high feedback resistance

  Studio grade Neumann condenser capsule

  For Sennheiser SKM 5000 and 5200 handheld transmitters

  Neumann sound for or Sennheiser SKM 5000/5200 wireless systems

  Tight supercardioid pattern without off-axis coloration

  Feedback resistant, high rejection of rearward sound (120°)

  Unaffected by extreme sound pressure levels

  Built-in pop protection, low handling-noise

  Easy cleaning
specs: |-
  - Directional Pattern: Supercardioid
  - Frequency Range: 80 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 1.3 mV/Pa ± 1 dB equ. -58 dBV
  - Equivalent noise level, CCIR: 44 dB
  - Equivalent noise level, A-weighted: 33 dB-A
  - Maximum SPL for THD 0.5%: 150 dB
  - Maximum SPL for THD 3%: 155 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 50 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 61 dB-A
  - Weight: approx. 325 g (incl. Transmitter + power supply unit)
  - Diameter: 48 mm
  - Length: 257 mm (incl. Transmitter)
