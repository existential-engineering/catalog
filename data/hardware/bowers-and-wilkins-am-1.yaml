description: The AM-1 architectural monitor speaker is designed to be used
  anywhere. It's perfect for use around the pool or mounted outdoors year-round.
details: |-
  The AM-1 is a compact weather-resistant outdoor loudspeaker, a versatile architectural monitor that can be positioned vertically or horizontally thanks to its aluminium wall bracket and is resistant to dust, moisture and UV.

  Bowers & Wilkins says the AM-1 is entirely sealed in order to keep the elements at bay, and that it is tough and hard-wearing, with a one-piece mounting system offering 220-degree rotation so it is ready to perform wherever you want it to, come rain or shine.

  A one-plug, simple-to-install mounting system leaves the AM-1 happy vertically or horizontally, and its engineering means it sounds good whichever way you choose to mount it.

  Acoustically it is a two-way system with an auxiliary bass radiator. Bowers & Wilkins pairs its trademark Nautilus tube-loaded 25mm aluminium dome tweeter with a 130mm glassfibre mid/bass driver, supplemented by the auxiliary bass radiator for solid, powerful bass, giving sound and scale way beyond its compact dimensions.

  The AM-1 is passive and needs an external amplifier. Nominal impedance is 8 ohms with a 5.2 ohm minimum, sensitivity is 86dB (2.83V, 1m), frequency response is 51Hz to 22kHz on the reference axis when wall mounted, and the recommended amplifier power is 20W to 100W into 8 ohms on unclipped programme. It measures 310mm high by 180mm wide by 210mm deep including the wall bracket, weighs 4kg, and is offered in matte black and matte white.
specs: |-
  - Description: 2-way system with Auxiliary Bass Radiator (ABR)
  - Technical features: Nautilus tube loaded aluminum dome tweeter, Glassfiber cone bass/midrange, Auxiliary Bass Radiator (ABR)
  - Drive units: 1x 25mm (1in) aluminum dome high-frequency, 1x 130mm (5in) glassfiber cone bass/midrange
  - Frequency range: -6dB at 46Hz and 50kHz (wall mounted)
  - Frequency response: 51Hz to 22kHz on reference axis (wall mounted)
  - Sensitivity: 86dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (5.2 ohms minimum)
  - Recommended amplifier power: 20W to 100W into 8 ohms on unclipped program
  - Dimensions: Height 310mm (12 1/4in), Width 180mm (7in), Depth 210mm (8 1/4in)
  - Net weight: 4kg (8.8lb)
  - Finishes: Matte white, Matte black
  - Sealed cabinet, resistant to dust, moisture and UV
  - One-piece aluminum wall bracket with one-plug mounting system and 220-degree rotation, mounts vertically or horizontally
  - Passive loudspeaker: no on-board amplification and no mains connection
