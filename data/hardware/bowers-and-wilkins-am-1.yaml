description: The AM-1 architectural monitor speaker is designed to be used
  anywhere. Position vertically or horizontally thanks to the elegant aluminum
  wall-bracket, and resistant to dust, moisture and UV, the AM-1 is far tougher
  than it looks.
details: |-
  Performance that endures. AM-1 is entirely sealed, in order to keep the elements at bay. It's tough and hard-wearing too, and its clever one-piece mounting system with 220-degree rotation means it's ready to perform wherever you want it to, come rain or shine.

  Easy to install, great to listen to. A one-plug, simple-to-install mounting system means AM-1 is happy vertically or horizontally. Plus, smart engineering means AM-1 sounds great whichever way you choose to mount it.

  Specified and built without compromise. With the trademark Bowers & Wilkins Nautilus tube-loaded 25mm aluminium dome tweeter and 130mm glassfibre mid/bass driver supplemented by an auxiliary bass radiator for solid, powerful bass response, AM-1 has sound and scale way beyond its compact dimensions.

  Instead of the Flowport found in traditional Bowers & Wilkins speakers, AM-1's cabinet integrates a rear-mounted auxiliary bass radiator (ABR). As well as maintaining the cabinet's weather-tight seal, the ABR gives the AM-1 remarkable bass response for a speaker of its kind. With its rust-proof aluminium grille and super-rigid cabinet, every AM-1 must pass a range of weather tests, including UV exposure and testing inside an accelerated salt-spray chamber.
specs: |-
  - Description: 2-way system with Auxiliary Bass Radiator (ABR)
  - Technical features: Nautilus tube loaded aluminum dome tweeter, Glassfiber cone bass/midrange, Auxiliary Bass Radiator (ABR)
  - Drive units: 1x 25mm (1in) aluminum dome high-frequency, 1x 130mm (5in) glassfiber cone bass/midrange
  - Frequency range: -6dB at 46Hz and 50kHz (wall mounted)
  - Frequency response: 51Hz to 22kHz on reference axis (wall mounted)
  - Sensitivity: 86dB (2.83V, 1m)
  - Total harmonic distortion: <1% 200Hz to 20kHz (86dB, 1m)
  - Nominal impedance: 8 ohms (5.2 ohms min)
  - Recommended amplifier power: 20W to 100W into 8 ohms on unclipped program
  - Dimensions (includes wall bracket): Height 310mm (12 1/4in), Width 180mm (7in), Depth 210mm (8 1/4in)
  - Net weight: 4kg (8.8lb)
  - Finishes: Matte white, Matte black
  - Sealed, weather-resistant cabinet, cast aluminium wall bracket with one-plug mounting system and 220-degree rotation, mounts vertically or horizontally
