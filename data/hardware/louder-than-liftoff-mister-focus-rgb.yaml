description: Mister Focus - RGB is a customizable platform for building your dream channel using analog plugins (Colour modules). The first slot has separate controls for Colour drive and wet/dry mix. Configure vintage-flavored line amps, compressors, EQs, or saturators. At the end of the signal chain a second analog plugin slot, TWO-TONE, allows you to add another shade of coloration for a layered analog patina. Add filters, HF boosts, or transformer-coupled output stages, all at the press of a button.
details: |-
  Two Colour Module-compatible analog plugin slots. Slot 1 has separate controls for drive (-6 to +18 dB) and wet/dry mix. Slot 2 (TWO-TONE) provides simple in/out operation. Focus EQ (adapted from Chop Shop) is switchable pre/post Colour Slot 1. PRE-C switch for signal path flexibility. Jumper-selectable boost mode and corner frequency options. Premium components include Nichicon and Panasonic capacitors, Wima film capacitors, 0.5% thin film resistors, class A-biased audiophile op amps (OPA1602), and Alps pushbutton switches. Designed and assembled in Silicon Valley, California.
