description: Manley OASIS delivers 6922 tube amplification with MANLEY POWER®,
  passive RIAA, and variable MM/MC loading. No ICs in signal path.
  California-made.
details: |-
  The Manley Oasis Phono Stage represents the evolution of the acclaimed Chinook design, incorporating proprietary Manley Power® supply technology for exceptional noise floor performance and dynamic resolution. This all-tube reference phono preamplifier is engineered for both Moving Magnet (MM) and Moving Coil (MC) cartridges, delivering the dimensional imaging and harmonic accuracy that define reference-grade phono amplification.

  Four 6922 dual triode tubes form the core amplification stages, providing two gain stages followed by a White Follower output driver for exceptionally low output impedance and superior linearity. This all-tube topology maintains signal integrity from input to output while the passive RIAA equalization network ensures accurate frequency compensation across the entire audio spectrum.

  The output stage is handled by a 6922 dual triode operating in Manley's favored White Follower configuration, providing low output impedance (104 Ohms) and beefy current-driving capabilities to deliver the pristine signal from the gain stages with authority and fidelity to the next component in the audio chain.

  Four selectable gain settings (45 dB, 50 dB, 60 dB, and 65 dB) accommodate the wide range of output levels of virtually any cartridge type. Rear-panel input loading DIP switches provide ideal resistive and capacitive loading options for both MM (typically 47k Ohms plus capacitance) and MC (numerous choices from 26 Ohms to 800 Ohms) cartridges. Thirty-one resistive loading options from 26 Ohms to 800 Ohms (plus 47k Ohms), combined with seven capacitive loading choices from 50 pF to 350 pF, enable comprehensive setup flexibility with exceptional sonic fidelity.

  Manley Power® supply technology provides highly regulated and stable B+ voltage so the tubes operate optimally, yielding quicker sonic extremes, enhanced dynamic resolution, and an exceptionally low noise floor — critical for a phono stage dealing with extremely low-level signals from a cartridge.
specs: |-
  - All-tube MM/MC phono preamplifier with passive RIAA equalization
  - Tubes: 4 × 6922 dual triodes
  - Manley Power® regulated B+ supply technology
  - White Follower output stage (6922 dual triode)
  - Selectable gain: 45 dB, 50 dB, 60 dB, 65 dB
  - Resistive loading: 31 options (26 Ω – 800 Ω, plus 47 kΩ)
  - Capacitive loading: 7 choices (50 pF – 350 pF)
  - RIAA deviation: < ±0.5 dB (20 Hz – 20 kHz)
  - Crosstalk: 82 dB (at 1 kHz or 10 kHz)
  - Dynamic range: 102 dB typical (A-weighted)
  - Output impedance: 104 Ω
  - No ICs in the signal path
  - Rear-panel DIP-switch cartridge loading
  - Hand-assembled in Southern California
