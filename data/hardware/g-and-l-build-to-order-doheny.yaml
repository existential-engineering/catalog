details: |-
  Inspired by the classic surf sound born in Southern California, the G&L Doheny takes its name from the iconic beach in the heart of Orange County where '60s surf pioneers became legends. Since those halcyon days, both music and surfing have evolved far beyond their roots, and so has the performance of the gear.

  Doheny takes the bolt-on offset-body into new sonic territory with newly developed Magnetic Field Design jazz pickups, the first on any production G&L. Naturally, these new pickups will invite comparison to Leo's jumbo MFD ASAT Special pickups, given they employ a narrow bobbin aperture and broad coil splay. But Doheny's MFD pickups are more about jangle than twang, just as they should be for a guitar like this. With a classic jazz bobbin aperture wrapped with traditional Formvar wire, these pickups just might be the approach Leo would have taken had he been alive a few years longer.

  So what is it like? The sound is rich in harmonics yet surprisingly full, the result of carefully researching and applying Leo's creative work across the decades. The Doheny pickups deliver the experience fans have hoped for, with their flexibility maximized by the PTB tone system that allows echoes of yesteryear while delivering more output and range for today's music. Add in Leo's finest vibrato for enhanced tuning stability and improved sustain, and the results are astounding.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), mini-toggle expander switch enabling additional pickup combinations of neck+bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
