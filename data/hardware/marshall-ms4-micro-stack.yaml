description: A pocket-sized battery-powered micro stack styled as a miniature Marshall full stack (head plus two cabs). Driven by a single 2.7" speaker and a small onboard amp with gain, tone and volume controls, the MS-4 is designed for ultra-portable practice and novelty desktop use. Runs from a 9V battery or an optional 9V power adapter, with a 1/4" instrument input and a 1/8" headphone output for silent practice.
details: |-
  The MS-4 is a 1W micro stack that is the ultimate in micro rock n' roll. With adjustable gain, tone and volume controls you can deliver that extra distortion anywhere.

  The MS-4 is battery-powered and can be plugged into a mains power supply, so it is versatile enough to play on the move or for practice in your bedroom. Power comes from a 9V battery or a 9V power adapter, which is not included.

  The miniature full stack carries a head over two cabinets, with a 2x2" speaker configuration and a 2W output. A 1/4-inch headphone output on the lower cabinet allows silent practice.

  Designed and engineered in UK. Made in Vietnam.
