description: A pocket-sized battery-powered micro stack styled as a miniature
  Marshall full stack (head plus two cabs). Driven by a single 2.7" speaker and
  a small onboard amp with gain, tone and volume controls, the MS-4 is designed
  for ultra-portable practice and novelty desktop use. Runs from a 9V battery or
  an optional 9V power adapter, with a 1/4" instrument input and a 1/8"
  headphone output for silent practice.
