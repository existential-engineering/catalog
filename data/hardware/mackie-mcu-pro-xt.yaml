description: The MCU XT Pro is an eight-channel expansion unit for the MCU Pro
  control surface, adding eight more motorized touch-sensitive faders, V-pots,
  and channel controls for larger DAW mixing sessions.
details: |-
  The MCU XT Pro is an extender unit that expands the MCU Pro control surface with an additional eight channels of hands-on DAW control. It adds eight more real motorized, touch-sensitive faders along with assignable V-pots and channel buttons, letting you mix larger sessions with the same organic feel as the main unit.

  Multiple XT Pro units can be chained alongside an MCU Pro for major projects, with the same USB plug-and-play setup and DAW compatibility — no MIDI mapping required.
specs: |-
  - Control surface extender for the MCU Pro, expandable with multiple MCU XT units
  - Motorized, touch-sensitive faders
  - Assignable V-Pots
  - Plug-and-play setup with nearly any DAW, no MIDI mapping required
  - Real-time visual feedback
  - Bundled software: Waveform OEM DAW and DAW Essentials Collection (16 FX plug-ins)
  - External power: 7.5V DC, 3.0A-4.0A
  - Kensington security lock slot
