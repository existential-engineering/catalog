details: |-
  Modern DAW software has given us virtually unlimited possibilities for manipulating audio, but sacrifices the organic feel of faders and knobs at our fingertips. Reclaim that experience without losing the power of software with the expandable MCU Pro control surface. With simple USB plug-and-play setup with nearly any DAW, you will be mixing like a pro with real motorized touch-sensitive faders, buttons and assignable V-pots in no time.

  NO MORE POINT AND CLICK

  With MCU Pro, you get deep, intuitive control of mix and plug-in parameters, real-time visual feedback and set up is plug-and-play, without any MIDI mapping whatsoever. Streamline mixing in your project studio or scale up with multiple MCU XTs to mix major projects. With the push of a button, writing automation on dozens of tracks in a large music project or even mixing for film and television is now effortless.

  Waveform OEM DAW

  Waveform OEM is a multi award-winning workstation, featuring powerful and creative tools to inspire the modern musician. Unlike typical 'Lite' versions, it does not impose any restrictions, you get unlimited track count, powerful features, compatibility with all popular plug-ins and efficient performance on macOS, Windows, and Linux operating systems.

  DAW Essentials Collection

  A collection of 16 contemporary FX plug-ins for use with any DAW. These plug-ins utilize the very latest algorithms and coding techniques to deliver extraordinary sound quality in an extremely efficient package, allowing the plug-ins to be used liberally across a wide range of native computer systems. Included: Equaliser, Compressor, Reverber8, Delay Studio, Stereo Delay, Tape Delay, Crossover, Limiter, Gate / Expander, Ducker, Flanger, Crusher, Chorus, Bus Compressor, Phaser, and Auto Filter.
specs: |-
  - Control surface extender for the MCU Pro, expandable with multiple MCU XT units
  - Motorized, touch-sensitive faders
  - Assignable V-Pots
  - Plug-and-play setup with nearly any DAW, no MIDI mapping required
  - Real-time visual feedback
  - Bundled software: Waveform OEM DAW and DAW Essentials Collection (16 FX plug-ins)
  - External power: 7.5V DC, 3.0A-4.0A
  - Kensington security lock slot
