url: https://mackie.com/en/products/controllers/mcu-pro-and-xt-pro/mcu_pro_xt.html
description: "Modern DAW software has given us virtually unlimited possibilities
  for manipulating audio, but sacrifices the organic feel of faders and knobs at
  our fingertips. Reclaim that experience without losing the power of software
  with the expandable MCU Pro control surface."
details: |-
  Modern DAW software has given us virtually unlimited possibilities for manipulating audio, but sacrifices the organic feel of faders and knobs at our fingertips. Reclaim that experience without losing the power of software with the expandable MCU Pro control surface. With simple USB plug-and-play setup with nearly any DAW, you will be mixing like a pro with real motorized touch-sensitive faders, buttons and assignable V-pots in no time.

  With MCU Pro, you get deep, intuitive control of mix and plug-in parameters, real-time visual feedback and set up is plug-and-play — without any MIDI mapping whatsoever! Streamline mixing in your project studio or scale up with multiple MCU XTs to mix major projects.
specs: |-
  - Real motorized touch-sensitive faders
  - Assignable V-pots
  - USB plug-and-play connectivity
  - Compatible with nearly any DAW
  - Real-time visual feedback
  - Expandable with multiple MCU XT Pro extension units
