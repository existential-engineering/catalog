description: >-
  Oberheim's first official synthesizer, the Synthesizer Expander Module is a
  compact keyboardless analog voice module originally designed for layering with
  other monophonic synthesizers or serving as a versatile backup sound source.
searchTerms:
  - Synthesizer Expander Module
details: |-
  Produced from 1974 to 1979, the Oberheim SEM (Synthesizer Expander Module) holds a
  foundational place in synthesizer history as the building block that launched Oberheim's
  entire product line. Conceived as a standalone monophonic voice without a keyboard, it was
  intended to augment existing setups by adding another layer of analog sound.

  The SEM's distinctive character comes largely from its 2-pole multimode filter operating at
  12 dB per octave. Unlike the more common 4-pole ladder designs used by Moog and others, this
  filter offers low-pass, band-pass, high-pass, and band-reject modes, giving it a brighter,
  more open quality that became a signature of the Oberheim sound. Two VCOs provide sawtooth
  and variable-pulse waveforms, while a triangle-wave LFO adds modulation.

  The module's envelope design uses an ASR (Attack, Sustain, Release) configuration for the
  filter and two ADR generators for the VCA. While relatively simple compared to full ADSR
  implementations, this approach proved musically effective and contributed to the SEM's
  characteristically punchy response.

  Multiple SEM modules were later combined with keyboards and sequencers to create Oberheim's
  Two Voice, Four Voice, and Eight Voice polyphonic systems. An external Polyphonic Synthesizer
  Programmer module could store settings for up to eight SEMs simultaneously. Notable users
  include Jan Hammer, Josef Zawinul, and John Carpenter. Collectors should be aware that early
  units marked "1080" internally feature different envelope and filter circuits compared to the
  standard "1180" revision.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, variable-pulse)
  - Filter: 2-pole multimode VCF, 12 dB/oct (low-pass, band-pass, high-pass, band-reject)
  - Envelopes: ASR (filter), 2x ADR (VCA)
  - LFO: 1 (triangle wave)
  - Keyboard: None (module only)
  - Memory: External PSP module stores settings for up to 8 SEMs
  - Control: CV/Gate
releaseDate: "1974"
releaseDateYearOnly: true
