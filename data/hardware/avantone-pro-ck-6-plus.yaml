description: Affordable full-range large-capsule FET condenser microphone with a
  32mm gold-sputtered capsule for enhanced low-end, transformer-less circuit
  design, cardioid polar pattern, 80Hz high-pass filter, and -10dB pad.
details: |-
  The CK-6 Plus is Avantone Pro's affordable full-range studio workhorse
  large-capsule FET condenser microphone. Its transformer-less condenser
  circuit delivers accurate, colorless sound reproduction, while the cardioid
  polar pattern focuses on the source and produces a clean sonic signature.

  Suitable for vocals, acoustic instruments, and high-volume amplified sources,
  the CK-6 Plus offers solid low end, full midrange, and smooth, airy highs. A
  switchable 80Hz high-pass filter reduces low-frequency rumble, and a -10dB
  pad handles high-SPL sources. Its 32mm capsule adds enhanced bass response
  over the Classic model.

  The CK-6 Plus upgrades the package with a retro shock mount, a protective
  foam-lined steel mic case, and a wooden storage/transport box.
specs: |-
  - Type: True Transformer-less FET Condenser
  - Polar Pattern: Cardioid
  - Capsule: 32mm single-sided gold-sputtered Mylar
  - Frequency Response: 35–20,000 Hz ±3.5dB
  - Output Impedance: ≤200 Ohms
  - Maximum SPL: 136dB (0.5% THD @ 1kHz)
  - Equivalent Noise Level: <17dB
  - Output Connector: Male XLR 3-pin
  - Power Requirement: 48V Phantom Power, 5mA
  - Dimensions: 155mm × 46mm
  - Weight: 0.4 kg (0.9 lbs)
  - Includes: Retro shock mount, foam-lined steel mic case, wooden storage box
