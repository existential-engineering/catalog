description: Providing his fans the ability to own reproductions of his most
  notable guitars, the Phillip McKnight Delos Edition is outfitted with a range
  of options and an exclusive spec. The brand-new, exclusive Copper Penny
  Metallic finish is available on the signature package, as well as a
  coil-splitting switch that splits only the neck pickup of the dual
  humbuckers.
specs: |-
  - Scale length: 25.5"
  - Frets: 22 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder, 39.5" long, 1.65" thick, 12.5" wide
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: rosewood with 12" radius
  - Headstock: GT-style inline headstock painted to match body
  - Bridge: Hipshot fixed bridge, .4125" (10.5mm) spacing
  - Bridge pickup: Kiesel Lithium with chrome cover
  - Neck pickup: Kiesel Beryllium with chrome cover
  - Electronics: passive electronics with master volume and tone controls, 5-way lever switch, and neck pickup coil splitter
  - Finish: exclusive Copper Penny Metallic available on the signature package
  - Hardware: chrome with white plastic control knobs
  - Inlays: mother of pearl dot inlays with standard black-ring Luminlay Super Blue side dots
  - Pickguard: white pearloid
  - Strings: Elixir 942E super light gauge
  - Weight: 8.25 lbs
