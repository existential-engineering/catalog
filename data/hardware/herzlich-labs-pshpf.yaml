description: A passive dual stereo high-pass filter module in 2hp Eurorack
  format, useful for EQ'ing and small filtering tasks such as cutting rumble
  before a reverb.
details: |-
  Let's talk about filters - not your usual, souped up, CV controlled stereo-enabled monstrosity, but just regular old filters for EQ'ing and smaller filtering duties. That's this, right here - but in stereo, with a wide range and with a highly useful slide pot. What's it useful for, you ask? Any task where you'd like to user a filter, but sacrificing an entire filter module might be overkill. For instance, running your sound through a high pass filter before passing it into a reverb, will cut down on the bottom end rumble and allow you to enhance the sparkle of the reverb. And here you get two! Either one for your left and right input, or one for two different but linked mono inputs. Neat! This filter is fully passive, only 2hp and skiff friendly with a very shallow installation depth. It's also particularly good looking in black and gold.
specs: |-
  - Dual 1-pole passive filter units
  - Internal normalization allows use as mono 2-pole filter
  - Approximate frequency range (dependent on signal chain): 33 Hz to 33 kHz
  - High quality components and analog design
  - Passive design: no power required
