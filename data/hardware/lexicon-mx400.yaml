description: Lexicon MX400 is a 4-in/4-out reverb/effects processor with USB
  "hardware plug-in" capability, delivering classic Lexicon reverbs, delays, and
  modulation effects with DAW integration. This product is discontinued.
details: |-
  The MX400 combines the rich, luscious sound that's defined Lexicon studio reverb for three decades with DAW integration via USB. It offers four inputs and four outputs in a 1U rackmount chassis, supporting mono, stereo, dual-stereo, and surround processing paths.

  The unit hosts 17 Lexicon reverbs, delays, and modulation effects, plus dbx compression and de-essing. 223 factory programs are included (25 of them surround-specific), and the MX-Edit Librarian software allows visual editing and preset management from a computer.

  The MX400 can act as a "hardware plug-in" inside 32-bit AU-compatible DAW software over USB, so MX400 effects can be inserted and automated from a session. The front panel features a generous LCD display with three assignable parameter controls and large, hands-on knobs in a road-rugged chassis.
specs: |-
  - 4 inputs / 4 outputs (mono, stereo, dual-stereo, and surround routings)
  - 17 Lexicon reverbs, delays, and modulation effects
  - dbx compression and de-essing
  - 223 factory programs (25 surround-specific)
  - USB "hardware plug-in" operation in 32-bit AU-compatible DAWs (PC/Mac)
  - MX-Edit Librarian software for preset management
  - Generous LCD display with three assignable parameter controls
  - 1U rackmount chassis
