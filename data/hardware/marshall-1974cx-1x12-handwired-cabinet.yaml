description: A passive 1x12" extension cabinet handwired to match the 1974X Handwired Combo, offering the same creamy 60s tones in an expanded rig. Loaded with a single 12" Celestion G12M-20 Greenback speaker rated at 20W and voiced at 16Ω, the 1974CX captures the warm, dynamic break-up of the original 18-watt 1974 circuit and provides a period-correct extension solution for the 1974X reissue.
details: |-
  This beautifully hand-soldered 20W extension cabinet pairs perfectly with the handwired 1974X combo. It features a single 12" Celestion G12M-20 Greenback speaker, specially aged to flawlessly capture that vintage 60s vibe.

  With its old-school fret and classic piping, you will look and feel like you are playing an original 1974.

  Designed and engineered in UK. Made in UK.
