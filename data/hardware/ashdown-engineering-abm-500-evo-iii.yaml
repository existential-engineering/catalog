id: KE7_kheIfh6V3ZocCczLb
name: ABM 500 EVO III
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-500-evo-iii
description: The ABM 500 EVO III teams Ashdown's acclaimed ABM preamp with a
  575W power stage. Its signature VU meter, Variable Valve Drive (from pristine
  solid-state clean to fat valve overdrive via a single 12AX7), and famous
  three-band-plus-sliders EQ give a huge range of tones, while a one-knob
  compressor and independently controllable Sub-Harmonic Generator add fullness.
  Footswitchable Valve Drive, Compression, EQ, and Sub-Harmonic Generator (via
  the optional FS-4) plus pro connectivity make it a gigging professional's amp
  of choice.
details: |-
  The ABM 500 EVO III bass head pairs the ABM preamp with a 575W power stage. Variable Valve Drive blends true valve overdrive (one 12AX7 tube) into the signal from clean to driven. The ABM EQ combines Bass, Middle, and Treble rotary controls with two pairs of sliders for graphic-EQ-style shaping. A one-knob compressor and an independently controllable Sub-Harmonic Generator (adds an octave below the played note) round out the tone tools. Connectivity includes a balanced DI output with ground lift, a sub-bass output, a tuner output with silent-tuning output mute, a transparent FX loop, and a line input. Footswitchable Valve Drive, Compression, EQ, and Sub-Harmonic Generator via the optional FS-4 footswitch (not included).
specs: |-
  - Power Output: 575W
  - Power Requirement: 230V
  - Speaker Outputs: 2 x Jack/Speakon outputs
  - Minimum Impedance: 4 Ohm
  - Frequency Response: -3dB at 17Hz and 30kHz
  - High Instrument Input: 3.9M Ohms, 150mV - 20mV p-p
  - Low Instrument Input: 10K Ohms, 300mV - 40V p-p
  - Line Input: 22K Ohms, 0dBu nominal
  - Tuner Output: 22K Ohms, 0dBu nominal
  - DI Output: 600 Ohms balanced, -20dBu nominal with ground lift
  - Sub Output: 1k Ohm, 0dBu nominal
  - Effects Send: 22k Ohm, 0dBu nominal
  - Effects Return: 22K Ohm, 0dBu nominal
  - EQ: Bass +/-15dB @ 45Hz, Middle +/-15dB @ 660Hz, Treble +/-15dB @ 7kHz shelving; Slider 1 +/-15dB @ 180Hz, Slider 2 +/-15dB @ 340Hz
  - Pre-amp Tubes: 1 x 12AX7
  - Dimensions (H x W x D): 134 x 474 x 315 mm
  - Weight: 14 kg
