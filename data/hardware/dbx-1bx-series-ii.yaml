details: |-
  The 1BX Series II is an improved revision of dbx's 1BX Dynamic Range Expander, updating the circuit design to enhance performance while maintaining the same fundamental function of restoring dynamic range to compressed audio sources. The Series II designation indicates a second-generation circuit with refined specifications.

  Like the original 1BX, the Series II uses dbx's expansion technology to increase the contrast between loud and soft passages in program material that has been dynamically compressed during FM broadcasting, tape duplication, or disc mastering. Adjustable expansion controls allow the user to tune the effect for different source types.

  The Series II version was positioned as a refined audiophile and professional tool for improving the perceived quality of dynamically limited audio from consumer and semi-professional sources.
