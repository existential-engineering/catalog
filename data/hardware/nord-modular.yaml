description: >-
  The Nord Modular is a virtual modular synthesizer from Clavia that combines a compact
  25-key velocity-sensitive keyboard with a computer-based patch editor offering over 100
  modules. Patches are created graphically on a connected PC or Mac using the Nord Modular
  Editor, then stored in the keyboard's internal memory for standalone performance.
details: |-
  The Nord Modular, released by Clavia in 1998, pioneered the concept of combining hardware DSP power with software-based modular patch design. The compact keyboard houses the synth engine and all DSP processors, while a connected computer running the Nord Modular Editor provides the graphical interface for building patches from over 100 available modules.

    The Editor allows users to visually connect modules and synthesize sounds in a true modular fashion, bridging the gap between traditional modular synthesis and computer-based sound design. Once patches are programmed, the keyboard stores up to 9 banks of 99 memories each, allowing fully standalone operation without a computer.

    Software updates expanded the instrument significantly over its lifespan. Version 2.1 added a Ring Modulator, 14-Band FilterBank, Vocal Filter, FM Sine wave, and a Digitizer module for sampling capability. Version 3 introduced a 16-band vocoder and Mac compatibility, broadening the user base considerably.

    The Nord Modular found favor with a wide range of electronic music artists including Autechre, The Chemical Brothers, BT, The Crystal Method, Junkie XL, Mouse on Mars, Nine Inch Nails, and Astral Projection.
specs: |-
  - 32-voice polyphony
    - 6 VSM oscillators (triangle, sawtooth, pulse) plus noise and additional sound sources
    - 8 LFOs with 4 random pattern generators and 16,000 patterns
    - 6 filters including parametric and shelving EQs (highpass, lowpass, bandpass, notch; 12 or 24 dB/Oct, resonant)
    - ADSR, AD, and attack-hold-decay envelope types
    - Over 100 software modules available via Nord Modular Editor
    - 25 velocity-sensitive keys
    - 9 banks x 99 patch memories (891 total)
    - Multiple audio outputs
    - Pedal input
    - MIDI in/out
    - LCD screen
    - Built-in sequencer
    - Requires Pentium 90MHz PC (Windows 95/98) or PowerMac (MacOS 8) for editing
    - Latest OS version: 3.03
