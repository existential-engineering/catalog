description: The Topanga is a spring reverb pedal inspired by the classic Fender
  6G15 outboard spring reverb unit, delivering the big, wet, splashy reverb
  tones of 1960s surf guitar and Spaghetti Western soundtracks. Unlike studio
  rack reverbs, it runs in front of the amp so the reverb signal distorts for a
  more intense, complex sound. An added discrete preamp with a Volume knob
  provides clean boost capability beyond the classic Dwell and Tone controls.
details: |-
  The Topanga is inspired by the Fender 6G15 outboard spring reverb unit, capturing the dripping, splashy tones of '60s surf guitar and Spaghetti Western soundtracks. Designed to run in front of the amp so the reverb signal distorts rather than being clean after the amp — the same approach as the original hardware unit.

  Controls: Volume (discrete preamp clean boost), Dwell (input drive), Tone. Internal bypass mode switch. Handmade in Portland, Oregon. Backed by a 3-year warranty.
