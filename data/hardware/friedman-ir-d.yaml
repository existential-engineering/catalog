description: A dual-channel all-tube preamp and DI pedal that puts an entire
  Friedman rig, with impulse response cabinet and power amp simulation, in a
  pedalboard-friendly package.
details: |-
  The Friedman IR-D dual-channel tube preamp is an entire Friedman rig in a compact pedalboard-friendly package. It carries two fully independent, identical foot-switchable channels based on Friedman's Dirty Shirley and Twin Sister designs, a Dave Friedman modified JTM45 circuit that delivers the British tone the brand is known for.

  IR-D is not simulating a tube preamp, it is one. Two 12AX7 preamp tubes running at the proper high voltage are the pedal's beating heart, so each channel delivers the harmonic richness and touch response of Dave Friedman's finest designs. Both channels also carry their own independent and highly tweakable boost circuits, which effectively gives four voices accessible with the tap of a toe.

  DSP impulse response cabinet and power amp simulation sends a studio-quality mic'd-up tone to a DAW or to front of house, whether through the balanced output or the onboard headphone output. The IR per channel is picked with a three-position mini toggle, custom IRs load over the editor software, and the onboard IRs can be disengaged entirely so the tube preamp feeds another IR loader.

  The included editor software, powered by Synergy, tweaks each channel's power amp simulation through the Thump and Presence controls, loads IRs, activates the Boost Lock feature, switches the effects loop on and off and saves it all to 128 MIDI presets. Thirteen Friedman cabinet IRs are included, three of them factory set to the hardware, and the editor adds a five-band parametric EQ and phase control per IR.

  IR-D is MIDI-capable, so channels and presets can be recalled from a pedalboard controller or from a laptop running a whole show. Its ultra-transparent series effects loop takes time-based effects, the loop send can feed a power amp for players who prefer a live cabinet on stage, and the loop return on its own turns the pedal into a standalone IR loader.
specs: |-
  - All-tube high-voltage preamp and DI
  - 2 x 12AX7 preamp tubes
  - Two independent identical channels plus boost, based on Friedman's Dirty Shirley and Twin Sister designs
  - MIDI programmable channel select and boost, IR select, Thump and Presence, effects loop on/off and Boost Lock
  - Power amp simulation with software editable Presence and Thump per channel
  - Low latency impulse response cabinet simulation, bypassable
  - Three position CAB/IR select switch per channel, programmable via software
  - 13 free Friedman IRs or load your own
  - Boost volume and gain controls per channel
  - Volume and gain controls per channel
  - Full EQ consisting of bass, middle and treble per channel
  - 2-way Bright switch per channel
  - 3-way Structure switch per channel
  - Three multi-function foot switches
  - Ultra-transparent series FX loop, bypassable
  - TRS balanced output
  - Headphone output
  - MIDI 5-pin standard connector and USB MIDI
  - USB software editor, powered by Synergy
  - Universal 12V power supply included
  - 6 foot USB 2.0 A male to B male cable included
  - Limited 3-year warranty
  - Dimensions including knobs: 5.5 in (D) x 6.5 in (W) x 2.3 in (H)
  - Weight: 1.5 lbs
