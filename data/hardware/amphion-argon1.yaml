url: https://amphion.fi/products/argon1/
description: The Argon1 is an affordable reference bookshelf loudspeaker that
  provides a large, clean window into sound with reference-quality midband
  performance and surprisingly low-reaching bass response, handmade in Finland.
details: |-
  The Argon1 is a two-way vented bookshelf loudspeaker featuring a 1" titanium tweeter and a 5¼" aluminum woofer, with a crossover point set at 1600 Hz. It is handmade in Finland and represents Amphion's 'affordable reference' philosophy.

  The speaker features Amphion's 5th generation waveguide, enabling seamless driver integration and a notably low crossover point. This design delivers unrivalled midrange clarity with exceptional naturalness when presenting nuances of human voice and instruments.

  The Argon1 provides a room-wide sweet spot through even dispersion, allowing listeners to enjoy the sound throughout the room rather than being limited to a single sweet spot. It performs well even at low volumes and under challenging acoustic conditions.

  Available in four finishes — Full White, Standard White/Black, Full Black, and Walnut — the Argon1 can be customized with color grids and mounted with optional wall brackets. It supports a recommended amplifier power range of 25 to 150 watts.
specs: |-
  - Operating Principle: Two-way, vented
  - Tweeter: 1" titanium
  - Woofer: 5¼" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 86 dB
  - Frequency Response: 45–25,000 Hz (-6dB)
  - Power Recommendation: 25–150 W
  - Dimensions (H×W×D): 316×160×265 mm
  - Weight: 7 kg (15.4 lbs)
  - Manufacturing: Handmade in Finland
