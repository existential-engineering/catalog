description: >-
  An organismic analog drum machine from SOMA Laboratory featuring 23
  independent modules, four synthesis channels, and over 100 patch points for
  creating complex percussive and melodic textures.
details: |-
  Designed by Vlad Kreimer and described as an "organismic drum machine," the SOMA Pulsar-23 takes a radically different approach to rhythm synthesis. Rather than relying on traditional step sequencing, it uses a touchpad-based internal looper and recorder to capture performances, resulting in organic and human-feeling rhythmic patterns. MIDI and CV support are available for those wanting tighter synchronization with other gear.

  The instrument consists of 23 independent modules organized across four synthesis channels. While optimized for percussion, the channels are equally capable of generating bass lines, melodic sequences, effects, and atmospheric soundscapes. The physical interface is expansive, with 55 knobs, 11 switches, and over 100 inputs and outputs for patching using the included 30 crocodile clip cables. This open architecture encourages experimentation and live circuit-bending techniques.

  Integration possibilities are extensive, with Eurorack-compatible connections and the ability to process external audio through the synthesis channels. The Pulsar-23 includes a clock generator, wide-range LFO, pseudo-random generator, two CV-controlled gates, two CV-controlled VCAs, and two controllable inverters, making it as much a modular sound design tool as a drum machine.
specs: |-
  - Polyphony: 4 voices
  - Multitimbral: 4 parts
  - Oscillators: 4
  - LFO: 1 (variable waveform)
  - Envelopes: 4 envelope generators
  - Effects: Distortion, 2 CV-controlled gates, 2 CV-controlled VCAs, 2 controllable inverters
  - Control: MIDI In/Out, CV In/Out, Gate In/Out
  - Additional: Clock generator, wide-range LFO, pseudo-random generator
  - Included: 30 crocodile clip cables, power supply, transport bag
