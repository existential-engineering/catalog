details: |-
  DJ1 is the controller for NI Traktor (Pro) in the Micromodul 1st generation line, which the page documents alongside the LV1 and LX1.

  It controls 2 decks, carries MIDI sockets for in and out port, and is battery powered, with an external power supply possible.

  The downloads are the controller's settings files. micromodul Traktor.zip holds all DJ1 settings for Traktor DJ Studio from version 2.1, micromodul DJ1 V01 TraktorPro10.zip holds all DJ1 settings for Traktor Pro, and micromodul Live.zip holds all LV1, LX1 and DJ1 settings for Live from version 2.0.

  User manuals are published in English (DJ1 User manual V01) and German (DJ1 Bedienungsanleitung V01).

  The page marks the DJ1 as discontinued / sold out.
specs: |-
  - Controls 2 decks
  - MIDI sockets for in and out port
  - Battery powered (external power supply possible)
  - Settings available for Traktor DJ Studio from version 2.1
  - Settings available for Traktor Pro
  - Settings available for Ableton Live from version 2.0
