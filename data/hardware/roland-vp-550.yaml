description: >-
  The Roland VP-550 Vocal & Ensemble Keyboard uses breakthrough vocal-modeling
  technology to create interactive vocal sounds in real time, including
  classical choirs, gospel choirs, pop and jazz voices, male and female
  ensembles, vintage vocoders, and string/vocal hybrids. It features a 49-key
  velocity-sensitive keyboard with two main sections — Vocal Designer and
  Ensemble — plus a D-Beam controller and 128-voice polyphony.
details: |-
  Released in 2006, the Roland VP-550 goes beyond traditional vocoder and harmonizer concepts by using Roland's vocal-modeling technology to let performers create virtual choirs, solo vocal tracks, and background vocal parts using their own voice. Users simply connect a microphone, select a sound, and play the keyboard to generate expressive, interactive vocals in real time.

  The instrument is built around two main sections. The Vocal Designer section offers six vocal types including Classical, Gospel, Pops, Male/Female, and two Vocoder modes, providing a wide palette of vocal textures. The Ensemble section complements this with Mixed Chorus, Jazz Scat, Boy's Choir, Humming, Full Strings, and Slow Strings sounds that can be layered with the vocal processing.

  Performance controls include a D-Beam controller for gestural sound manipulation, pitch bend and modulation wheels, and a Depth control for adjusting vocal processing intensity. A Sound Check function allows recording up to 10 seconds of output for quick monitoring. The VP-550 includes ambience effects with three types: Hall 1, Hall 2, and Studio. Four registration memories allow quick recall of favorite settings during live performance.

  The VP-550 accepts both XLR microphone input and a quarter-inch external input, making it flexible for various vocal sources. It served as the predecessor to the more advanced VP-770, which expanded upon its vocal processing capabilities with additional features like auto-harmony and a sound looper.
specs: |-
  - Polyphony: 128 voices
  - Vocal Designer Types: Classical, Gospel, Pops, Male/Female, Vocoder 1, Vocoder 2
  - Ensemble Types: Mixed Chorus, Jazz Scat, Boy's Choir, Humming, Full Strings, Slow Strings
  - Effects: Ambience (Hall 1, Hall 2, Studio)
  - Memory: 4 Registrations
  - Keyboard: 49 keys with velocity
  - Controllers: D-Beam, Pitch Bend, Modulation, Depth
  - Sound Check: Records output signal for 10 seconds
  - Inputs: XLR microphone, 1/4-inch external input
  - Control: MIDI In/Out
  - Date Produced: 2006
