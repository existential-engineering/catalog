  beautifully responsive analog format that feels as good as it sounds.
details: |-
  Sculpt your sound with uncompromising precision using the Highpoint Analog Optical Compressor. Designed for players who live in the details, the Highpoint brings dynamic control and console style LED VU monitoring into a beautifully responsive analog format that feels as good as it sounds. The Highpoint is built to be your always-on foundation, delivering depth, control, and refinement even at conservative settings. Elevate the feel of your instrument to its highest potential with the Highpoint Analog Optical Compressor. The Highpoint delivers rich analog optical compression with expansive sustain, articulate transient response, and an exceptionally smooth attack and release curve that helps notes bloom and chords breathe. From subtle dynamic refinement to expressive sustain, the Highpoint responds with the depth, warmth, and dimensionality expected from high-end studio hardware. A comprehensive control set lets you shape your compression exactly to your taste. True parallel compression via the Blend control allows you to preserve the integrity of your transients while layering in harmonic density and sustain. Dedicated Attack, Release, and Ratio controls offer the kind of shaping precision normally reserved for high-end studio rack gear. A carefully tuned Make-Up control ensures seamless gain staging, keeping your signal balanced and authoritative. Internally operating at ±15VDC for increased headroom and dynamic range, the Highpoint maintains exceptional clarity even under aggressive settings, retaining punch, articulation, and harmonic detail without collapse or congestion. The result is compression that is not only accurate but unmistakably musical. A refined 10-LED metering array gives you clear visual insight into your signal’s behavior. Instantly toggle between Input, Output, and Gain Reduction monitoring to see exactly how your dynamics are evolving in real time, like a miniature mastering console beneath your feet. For advanced tone shaping, the Highpoint includes a selectable High-Pass Filter in the sidechain circuit. By preventing frequencies at 160Hz and below from disproportionately triggering compression, low-end clarity remains tight and controlled. The result is articulate bass response, preserved punch, and dramatic low-frequency dynamics, ideal for both bass guitar and extended-range electric guitar applications. The Highpoint joins the Monarch series alongside the Meraki Analog Stereo Delay and the Mantle Bass Preamp//DI.
specs: |-
  - True Bypass
  - Mono in / mono out
  - 10-LED VU metering (Input / Output / Gain Reduction)
  - Selectable sidechain High-Pass Filter (160Hz)
  - Internally operates at ±15VDC
  - Input Impedance: 1 MΩ, Output Impedance: 300Ω
  - Frequency Response: 20 Hz - 20 kHz
  - Power: 9V DC, 500mA, center negative (2.1mm)
  - Dimensions: 4.78" x 3.62" x 2.23"
