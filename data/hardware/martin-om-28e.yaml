details: |-
  The OM-28E represents a synthesis of iconic Martin tone with modern upgrades. This auditorium-sized instrument employs a solid spruce top paired with solid East Indian rosewood back and sides, delivering the rich, balanced voice that has defined Martin's Style 28 for over a century.

  The extended 25.4" scale length generates increased string tension, yielding brighter tones and enhanced projection and sustain. The instrument is built around a Golden Era Modified Low Oval neck profile with high-performance taper, giving players a comfortable hand-feel while preserving traditional playability.

  Electronics are factory-installed and offered with either a Fishman Aura VT Blend or LR Baggs Anthem system, making the OM-28E equally at home in the studio and on stage. An ebony bridge with bone pins, ebony fingerboard, and nickel open-gear tuners round out the appointments.

  The 2025 refresh of the Standard Series brought Sitka spruce Golden Era top bracing, refined neck profiles, and thinner fingerboards to the OM-28E, sharpening its responsiveness while preserving the model's signature character. A molded hardshell case is included.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Solid Spruce
  - Back & Sides: Solid East Indian Rosewood
  - Scale Length: 25.4"
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Neck Shape: Golden Era Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Bracing Pattern: X-Brace, GE-Scalloped (Sitka spruce, Golden Era)
  - Electronics: Fishman Aura VT Blend or LR Baggs Anthem
  - Bridge: Ebony with bone pins
  - Frets: 20 total
  - Finish: Gloss (top, back, sides)
  - Tuning Machines: Nickel open gear
  - Case: Molded hardshell included
