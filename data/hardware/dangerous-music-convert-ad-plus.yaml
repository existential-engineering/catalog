name: CONVERT-AD+
manufacturer: dangerous-music
primaryCategory: outboard
categories:
  - rack-mount
url: https://www.dangerousmusic.com/product/convert-ad-plus
description: Packed into a single rack space with next-generation conversion for
  the ultimate in musicality and transparency, the CONVERT-AD+ is an advanced
  stereo analog-to-digital converter.
details: |-
  The CONVERT-AD+ has five features previously never seen on an analog-to-digital converter, continuing Dangerous Music's tradition of smart, well-executed innovations.

  Switchable Dual Inputs: with the push of a button, switch between any two balanced line input sources, instantly comparing different mastering chains or A/B-ing mic/preamp scenarios.

  Proprietary Clip Guard Technology: disables the destination's clip indicator LED while the signal is still audibly clipping, without acting as a limiter.

  Zoomable Meters: meter magnification lets you zoom in on just the top 10dB of dynamic activity for a finer-resolution view of crest factor.

  Switchable Transformers: engaging the X-FORMER insert wires in a pair of Hammond transformers in series (true hardwire bypass when disengaged) for heft and character.

  Emphasis Control: when transformers are engaged, adds a proprietary shelving EQ/compressor combo for 2nd order harmonic distortion.

  Analog design by Chris Muth, whose circuits have been used on hit records and classic reissues at facilities including Hit Factory, Masterdisk, Absolute Audio and Sterling Sound Mastering.
specs: |-
  - Adjustable sample rate: 6 selectable rates (44.1/48/88.2/96/176.4/192kHz) plus auto-sensing
  - Three selectable calibration levels: -14dBFS, -16dBFS, -18dBFS
  - Two switchable stereo analog input paths (4 balanced XLR inputs total)
  - Clip Guard: disables destination clip/over LED without altering the audio
  - Zoom view: magnified 10dB resolution metering
  - Word Clock with Internal, External and Master modes
  - X-FORMER insert: pair of custom Hammond transformers, true hardwire bypass
  - Emphasis: shelving EQ/compressor for 2nd-order harmonic distortion
  - JetPLL patented jitter-elimination clocking technology
  - Signal to Noise Ratio: A-weighted, 20Hz-20kHz: <121dB
  - THD+N, 1kHz, unweighted, 20Hz-20kHz, +4dBu in: <0.0011%
  - Frequency response @ 96kHz sample rate, 20Hz-40kHz: +0, -0.035dB
  - Jitter: 16ps (100Hz-40kHz), 18ps (100Hz-1MHz)
  - Crosstalk rejection: >118dBu @ 15Hz-40kHz
