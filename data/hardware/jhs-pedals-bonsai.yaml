description: A nine-mode overdrive pedal that exactly replicates nine classic
  and rare Tube Screamer variants using a rotary selector, from a 1977 OD-1
  through a 2008 JHS Strong Mod.
details: |-
  In the late 1970's the overdrive pedal was arguably perfected when Japanese engineers designed the sound that we now know as the heart and soul of so many of our favorite artists, recordings and sounds. Players ranging from The Edge, Trey Anastasio, Buddy Guy, Kirk Hammett, John Mayer, SRV, Carlos Santana and thousands more from every possible genre have utilized and depended on this classic iconic green box. The Bonsai is our tribute to one of the greatest pedals ever created.

  Following in the steps of our Muffuletta (released 2015), the Bonsai utilizes a simple rotary knob to switch through nine classic, vintage, rare, or hard to find variations of the Screamer. Each pedal was individually replicated using our Audio Precision analyzer and various other methods that allowed us to perfectly replicate every aspect of the sound and feel of the unit. The Bonsai is exact replication, not emulation.

  The Bonsai Modes:
  - OD-1 (1977): Brighter and slightly higher gain, no Tone knob, inverts signal, asymmetrical clipping.
  - TS-808 (1979): Classic low gain with signature pronounced mid range.
  - TS-9 (1982): Nearly identical to TS-808 but with slightly more pushed low-mid range.
  - MSL, Power or L Series (1985): Higher gain with more low end and gooey feel.
  - TS-10 (1986): Made famous by John Mayer — bluesy, crisp, more low end roll off, low gain.
  - EXAR OD-1 (1989): Polish-made TS-style with slightly different drive character and more transparency.
  - TS-7 (+Mode) (1999): Highest gain in the Bonsai, more low end and dirt.
  - Keeley Mod Plus (2002): Robert Keeley's classic mod — smoother mids/highs, increased bass.
  - JHS Strong Mod (2008): Cleaner and more powerful, pronounced high and low end drop offs.
