description: Introducing the Alliance Series Paul Sidoti. On tour with one of
  the most successful artists of our time.
details: |-
  The Alliance Series Paul Sidoti is a special Alliance edition of the Paloma Custom, built on a solid alder body measuring 46 x 34 cm with sides 4.2 cm high. Duesenberg pairs that body with a one-piece maple neck and a rosewood fretboard for clarity, attack and a tight low-end response. The body carries cream multi-layer binding, a 5-ply black pickguard and a PUR finish in Catalina Blue.

  The set neck is one-piece maple in a medium D shape, with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, Duesenberg Wings inlays, 22 jumbo frets, a steel dual-action trussrod and a 648 mm / 25.5 inch scale. The headstock is black and carries a signature. Every Duesenberg is Plek processed for level frets and buzz-free playability across the neck, then hand finished and set up by a luthier who signs the instrument inside.

  Two Duesenberg SplitKing pickups sit at the neck and bridge with a Duesenberg Pearlito single coil in the middle. Duesenberg describes the Split/King as more than a splittable humbucker: it houses a full-size single coil extended to a complete humbucker by a separate fine-tuned coil, so both pickup voices are available with the flick of a switch. Controls are one volume, one tone, a 5-way blade switch and two mode switches, running custom SplitKing wiring; the two mode-select switches sit on the custom pickguard and can be raised or lowered into it to suit playing style.

  Hardware is nickel finished, which Duesenberg prefers to chrome for its warmer sheen and natural ageing. The guitar carries Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, the short version of the Duesenberg Sapphire Deluxe Tremola vibrato and Duesenberg Standard Straplock-compatible strap pins, and is strung with Duesenberg Custom 010/050.

  The instrument ships with the Duesenberg Custom Line Case as standard, a signed Certificate of Authenticity and all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Duesenberg Wings
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black, with Signature
  - Body type: Solidbody, Alder
  - Dimensions: 46 x 34 cm / 18" x 13.4"
  - Height (sides): 4.2 cm / 1.7"
  - Binding: Cream, multi-layer
  - Pickguard: 5-Ply Black
  - Finish: PUR, Catalina Blue
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Sapphire Deluxe Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 010/050 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg SplitKing
  - Pickup (middle): Duesenberg Pearlito Singlecoil
  - Pickup (bridge): Duesenberg SplitKing
  - Controls: 1 Volume, 1 Tone, 5-Way Blade Switch, 2 Mode Switches
  - Wiring: Custom SplitKing Wiring
  - Case: Custom Line Case (included)
  - Authenticity: Signed Certificate of Authenticity
  - Tools: All required allen keys included
