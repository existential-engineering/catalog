description: A 1U Eurorack module offering rectification, distortion, waveform
  generation and frequency/clock doubling. It has two sections, each with one
  input and three outputs for inverted, half-rectified, and full-rectified
  signals.
details: |-
  Dual Rectifier II - S is a small yet versatile and essential module for any Eurorack system. It can be used as an AC to DC converter, a distorsion, a complex waveform generator, a frequency doubler, a clock doubler or a enveloppe follower and more. Like all our modules, Dual Rectifier II is built with high-quality components only and designed to offer the best performance. Whether you're starting a small system or have a wall full of modules, Dual Rectifier II - S is a must-have for any eurorack system. DUAL RECTIFIER II - S is divided into two sections:
  On top section the Positive Rectifier offer 1 input and 3 outputs :
  -Output 1 is a Inverted copy of input 1. -Output 2 Half-rectified , signal from input 1 below 0V will be remove . -Output 3 Full-rectified , signal from input 1 below 0V will be rectified . On bottom section the Negative Rectifier offer 1 input and 3 outputs :
  -Output 1 is a Inverted copy of input 2. -Output 2 Half-rectified , signal from input 2 above 0V will be remove . -Output 3 Full-rectified , signal from input 2 above 0V will be rectified . By default input 2 is normaled to output 1 (inverted) of the top section.
