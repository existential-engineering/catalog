description: The 352ce is a 12-string Grand Concert acoustic-electric from
  Taylor's 300 Series, featuring a solid Sitka spruce top with sapele back and
  sides, V-Class bracing, and ES2 electronics.
details: |-
  The 352ce brings the shimmering, lush character of a 12-string guitar into a compact Grand Concert body with Venetian cutaway. Constructed with a solid Sitka spruce top and sapele back and sides, it delivers warm, full-bodied tone with clear note definition.

  Taylor's patented V-Class bracing enhances volume, sustain, and intonation. The Neo-Tropical Mahogany neck with West African Crelicam Ebony fretboard and the 1-7/8" nut width at 24-7/8" scale length keep playability comfortable despite the 12-string configuration.

  Expression System 2 behind-the-saddle electronics capture the guitar's natural acoustic character for amplified performance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Configuration: 12-string
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Sapele (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Inlays: Faux Pearl Gemstone
  - Scale length: 24-7/8"
  - Nut width: 1-7/8"
  - Tuners: Taylor Nickel with Nickel Buttons
  - Pickguard: Firestripe
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
