details: |-
  The PRS Swamp Ash Special brings a unique look and sound to the PRS Bolt-On line up. Its swamp ash body is equipped with a versatile hum/“single”/hum pickup configuration. Two 58/15 LT pickups flank a PRS Narrowfield in the middle position, which adds a single-coil bite – without the hum. Paired with a volume, tone, 5-way blade switch, and dual mini-toggle coil-tap switches (for the first time on this model), the Swamp Ash Special has a total of twelve sound combinations.
