details: |-
  DISCONTINUED

  Warp Core is a complex stereo oscillator for the Eurorack modular synthesizer format, designed for deep and uniquely digital timbral exploration. Unlike traditional oscillators, Warp Core does not produce perfect geometric wave shapes (triangle, saw, square, etc), but instead uses a digital synthesis technique called phase distortion to produce variably complex waveforms with rich harmonic content from a pure sine wave lookup table. PHASE DISTORTION

  The phase distortion engine features 8 different continuously variable algorithms assignable to two slots routed in series, for a total of 64 possible combinations. Because these algorithms are almost all nonlinear, in most cases different timbres will be produced when swapping the order of the selected algorithms. PHASE MODULATION

  Warp Core also features phase modulation pre- or post- phase distortion via an internal sine modulation oscillator with a configurable frequency ratio relative to the main oscillator. For even more phase modulation possibilities, there is also an audio-rate external PM input. TONE THICKENING

  Two configurable "thickness" parameters serve to reinforce the fundamental and/or sub-octave of the oscillator output and provide slight detuning on the 90° output for thicker stereo or unison sounds. INNOVATIVE, PRECISE TUNING

  Last but not least, Warp Core's calibrated tuning controls enable quickly and easily tuning the oscillator to arbitrary frequencies or perfectly tuned (A=440Hz 12-TET) semitones in multiple octaves as well as locking the tuning knob to preserve perfect tuning for a live performance. DIVERT ALL POWER TO WARP CORE

  For even more utility, the WC:EX Expander gives you the option to convert Warp Core from a free-running oscillator to a dedicated PD/PM monophonic synth voice, with an envelope generator, internal VCA, and smart CV normalizations to shape your sound – all in just 4hp. VIDEOS
