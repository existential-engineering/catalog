details: |-
  The Chandler Limited Germ 500 MKII preamp is a discrete, transformer balanced 500 Series module that combines Wade Goeke's designs with recording studio favorites of the past. It uses classic germanium transistors in all Class A, transformer balanced circuits.

  The Germ 500 MKII is an updated version of the original Germ 500 with an improved faceplate layout. It is Chandler's well-known Germanium Preamp adapted for 500 series racks, using the same transformers and amp blocks to assure the sound is consistent with the rack version.

  The MKII has updated power circuitry so there are no known power-up issues with current lunchboxes and rack systems. All Chandler 500 series units have been tested and proven to have no power issues in a wide range of compatible racks including API, BAE, A-Designs, Purple, and Empirical Labs systems.

  The unit features a stepped gain control ranging from -5 to +65 dB, adjustable feedback, a PAD, Thick mode, switchable phantom power (+48V), and switchable phase (0/180°). The DI input is a 1/4-inch mono jack with 100kΩ input impedance, and the mic input impedance is 200Ω.

  The Germ 500 MKII has been heard on recordings by artists such as Courtney Love, where it was used on bass guitar tracks by engineer Michael Beinhorn.
