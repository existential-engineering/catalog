description: The Academy 12e-N is a nylon-string acoustic-electric from Taylor's
  Academy Series, featuring a solid torrefied spruce top, layered walnut back
  and sides, Grand Concert body, carved armrest, and ES-N electronics for
  amplified classical performance.
details: |-
  The Academy 12e-N brings classical nylon-string tone to Taylor's Academy Series, built on a Grand Concert body with a 1-7/8" nut width that provides comfortable string spacing for fingerstyle technique. The solid torrefied spruce top delivers extra warmth and played-in depth, while layered walnut back and sides contribute crisp highs and a woody low end.

  The Mahogany neck and West African Crelicam Ebony fretboard offer a smooth, stable playing surface, complemented by classical nickel tuners and D'Addario Pro Arte Carbon strings. A carved armrest reduces forearm fatigue during extended sessions.

  ES-N electronics are designed specifically for nylon strings with a built-in digital chromatic tuner for convenient on-stage use. Ships with a lightweight gig bag.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Spruce (solid, varnish)
  - Back/sides: Walnut (layered)
  - Neck: Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Armrest: Carved
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Tuners: Classical Nickel
  - Electronics: ES-N (nylon-string pickup with digital tuner)
  - Strings: D'Addario Pro Arte Carbon (.024-.046)
  - Case: Lightweight gig bag included
