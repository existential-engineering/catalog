description: >-
  The Oberheim Xpander is a six-voice analog synthesizer module and the desktop version of
  the Matrix-12, sharing an identical voice architecture. Widely regarded as one of the
  most flexible non-modular analog synthesizers ever built, it excels at producing thick
  analog basses, pads, and complex evolving textures through its extensive modulation
  routing capabilities.
details: |-
  The Xpander represents one of the pinnacles of 1980s analog synthesizer design. Released in 1984, it brought the powerful voice architecture of the Oberheim Matrix-12 into a more compact and affordable desktop format. Each of its six voices features two VCOs with linear FM, a multimode filter with 15 selectable modes, and an extraordinarily deep modulation system.

    The modulation architecture is what truly sets the Xpander apart from its contemporaries. Each voice has five LFOs with multiple waveforms and the ability to sample other modulators, five ADSR envelope generators that can repeat and sync to LFOs, a lag processor for portamento-like effects, and three tracking generators that apply linear functions across value ranges. This gives the synthesizer a level of sound design flexibility that rivals modular systems.

    The Xpander has been embraced by a wide range of electronic music artists including Vince Clarke, Chemical Brothers, Nine Inch Nails, DJ Sasha, Josh Wink, Astral Projection, Meat Beat Manifesto, and Cirrus. Its combination of rich analog sound and sophisticated programmability has ensured its continued desirability decades after production ended in 1988.
specs: |-
  - Polyphony: 6 voices
    - Oscillators: 12 VCOs (2 per voice) with linear FM
    - Filter: Multimode with 15 modes including 1/2/3/4-pole low pass, 1/2/3-pole high pass, bandpass, notch, and phase shift
    - VCAs: 15 per voice
    - Envelopes: 5 ADSR envelope generators per voice
    - LFOs: 5 per voice with approximately 5 waveforms each
    - Modulation: Lag processor, 3 tracking generators per voice
    - Memory: 100 single patches, 100 multi patches
    - Keyboard: None (desktop module)
    - Audio Outputs: Stereo and mono outputs plus 6 individual voice outputs
    - Control: MIDI In/Out/Thru, 6 CV/Gate inputs, trigger input, 2 pedal inputs
    - Production Years: 1984-1988
