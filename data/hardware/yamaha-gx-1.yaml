description: >-
  Yamaha's first major polyphonic analog synthesizer, featuring a distinctive
  triple-tiered keyboard design with a pedalboard. Fewer than 10 units were ever
  manufactured, making it one of the rarest professional synthesizers ever
  built. Notable owners included Keith Emerson, John Paul Jones, Stevie Wonder,
  and Hans Zimmer.
details: |-
  The GX-1 emerged in the early 1970s as an ambitious attempt to create a comprehensive performance synthesizer. Priced at over $50,000, it was designed exclusively for professional musicians and studios. Its construction utilized analog circuitry throughout, with two analog oscillators per voice that were essentially the same ones later used in the CS-80.

  The instrument's keyboard configuration was unprecedented for its time. It featured two 61-key velocity-sensitive keyboards, a smaller 37-note pressure-sensitive keyboard, and a 25-note pedalboard, totaling 184 keys. This multi-keyboard approach enabled sophisticated layering and splitting of sounds across different registers.

  Sound design capabilities included organ-style drawbars, a ribbon controller, two swell pedals, and a spring-loaded knee controller, allowing expressive real-time manipulation of timbres and dynamics. Ownership of the GX-1 became a hallmark of legendary status in progressive rock and electronic music, cementing its place in music history despite its extreme rarity.
specs: |-
  - 8-voice polyphony plus 1 monophonic voice
  - 2 VCOs per voice
  - 2-pole low-pass voltage-controlled filter
  - 1 voltage-controlled LFO
  - 2 ADSR envelope generators
  - Two 61-note velocity-sensitive keyboards
  - One 37-note pressure-sensitive keyboard
  - 25-note pedalboard (184 keys total)
  - Ribbon controller, organ drawbars, swell pedals, knee controller
  - No memory/patch storage
  - Weight: 300 kg (synth) + 87 kg (pedalboard)
  - Produced 1973-1977
