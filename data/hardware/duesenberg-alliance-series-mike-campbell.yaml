description: The Alliance Series Mike Campbell is based on Duesenberg's
  versatile Starplayer TV design, finished in metallic light blue with added
  white twinstripes on top and a pickguard carrying Mike Campbell's signature.
details: |-
  The Alliance Series Mike Campbell is based on Duesenberg's Starplayer TV design and uses the maker's semi-hollow construction: bent sides with a solid centerblock, a laminated spruce top, laminated flamed maple back and sides and an f-hole. The body measures 46 x 34 x 7 cm with sides 4.5 cm high, is bound in cream and finished in PUR lacquer with a matching colour headstock, and its nickel pickguard is signed by Mike Campbell. Duesenberg describes the semi-hollow build as combining hollow tone with the feedback resistance of a solid body.

  The set neck is one-piece maple in a medium D shape with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets, a steel dual-action trussrod and a 648 mm / 25.5 inch scale. Duesenberg's Plek machine levels every fret to a hundredth of a millimetre, measuring and cutting each one individually, which the maker says allows an unusually low action without string buzz; the frets are then polished and the fretboard edges rounded off by hand.

  Electrics pair a Duesenberg Domino P90 at the neck with a Duesenberg GrandVintage Humbucker at the bridge, wired to one volume, one tone and a Heavy Duty 3-way switch. The middle position carries a special wiring that filters some low-end frequencies out of the humbucker signal, which Duesenberg describes as an open and funky addition to the tonal range.

  Hardware is nickel finished, which Duesenberg prefers to chrome for its warmer sheen and because it ages naturally. The guitar carries Duesenberg Z-Tuners, which let the cut-off string end be hidden inside the tuner shaft, a Duesenberg Steel Saddle Bridge and the Duesenberg Diamond Deluxe Tremola vibrato, built on heavy duty needle and nylon bearings with an arm that turns freely through 360 degrees and adjusts for angle and length. Strap pins are Duesenberg Standard and Straplock compatible, and the guitar is strung with Duesenberg Custom 10/50.

  The instrument comes with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case, plus all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching body colour
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated Spruce
  - Back, sides: Laminated flamed Maple
  - Dimensions: 46 x 34 x 7 cm / 18.11" x 13.38" x 2.75"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream
  - Pickguard: Nickel, signed by Mike Campbell
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Diamond Deluxe Tremola
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Case: Custom Line case (included)
  - Tools: All required allen keys (included)
