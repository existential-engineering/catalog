description: The CWM7.3 S2 features an integrated backbox that optimises its
  performance, cuts down on sound transference through walls and also makes it
  easy to retrofit. Its design incorporates twin 150mm (6in) Aerofoil profile
  bass drivers, a 100mm (4in) Continuum cone FST™ mid-range driver and a Carbon
  Dome 25mm (1in) tweeter.
details: |-
  CWM7.3 S2 is the three-way in-wall model in the Bowers & Wilkins Reference Series, a four-driver array derived from the 700 Series. It carries a 25mm (1in) Carbon Dome tweeter, a 100mm (4in) Continuum cone FST midrange driver and a pair of Aerofoil profile bass drivers, with Flowport bass loading.

  Its defining feature is an integrated back box. That fixes the rear volume the drivers work into, so performance does not depend on the wall cavity, cuts down on sound transference through the wall into the next room, and makes the speaker straightforward to retrofit into an existing build.

  The baffle is critically formed from glass reinforced ABS and the crossover uses high-quality optimised components. Bowers & Wilkins quotes -6dB points at 43Hz and 33kHz, a 45Hz to 28kHz +/-3dB response, 90dB sensitivity at 2.83Vrms and 1m, second and third harmonics under 1% from 80Hz to 33kHz, and a nominal 8 ohm impedance with a 3.1 ohm minimum.

  It is a passive loudspeaker: no on-board amplifier and no mains connection, driven from an external power amplifier rated 25W to 200W into 8 ohms on unclipped programme.

  The frame is 736mm (29in) high by 276mm (11in) wide and sits 102mm (4.02in) behind the wall surface, needing a 711mm by 251mm cut-out (715mm by 256mm with the 7.3W pre-mount kit). The internal reservoir box measures 460mm by 220mm, protrusion is 7mm (0.28in) and net weight is 12.4kg (27.32lb). Back box and grille are finished in White.
specs: |-
  - 3-way in-wall system with integrated back box
  - Drive units: 1x ø25mm (1in) Carbon Dome tweeter, 1x ø100mm (4in) Continuum cone FST midrange, 2x ø150mm (6in) Aerofoil profile bass drivers
  - Technical features: Carbon Dome tweeter, Continuum cone FST midrange, Aerofoil profile bass cones, Flowport
  - Frequency range: -6dB at 43Hz and 33kHz
  - Frequency response: 45Hz to 28kHz +/-3dB (-3dB)
  - Sensitivity: 90dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) under 1% from 80Hz to 33kHz, under 0.5% from 120Hz to 33kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 25W to 200W into 8 ohms on unclipped programme
  - Frame: 736mm (29in) high x 276mm (11in) wide
  - Depth behind surface: 102mm (4.02in)
  - Cut-out: 711mm (28in) high x 251mm (9.9in) wide
  - Cut-out with pre-mount kit: 715mm (28.1in) high x 256mm (10.1in) wide
  - Reservoir box: 460mm (18.1in) high x 220mm (8.7in) wide
  - Protrusion: 7mm (0.28in)
  - Pre-mount kit: PMK 7.3W
  - Net weight: 12.4kg (27.32lb)
  - Baffle critically formed from glass reinforced ABS
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Finishes: back box White, grille White
