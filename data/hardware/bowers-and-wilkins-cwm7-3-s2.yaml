details: |-
  The CWM7.3 S2 is a Reference Series three-way in-wall speaker. An integrated back-box and a 700 Series-derived four-driver array make for a high-performance in-wall speaker, as the product page puts it, under the series line "See nothing, hear everything".

  The integrated backbox optimises its performance, cuts down on sound transference through walls and also makes it easy to retrofit. The driver array is twin 150mm (6in) Aerofoil profile bass drivers, a 100mm (4in) Continuum cone FST midrange driver and a 25mm (1in) Carbon Dome tweeter, all proven technologies shared with the 700 Series range of loudspeakers.

  Those transducers, combined with high-quality optimised components on the crossover and a critically formed baffle constructed from glass reinforced ABS, produce a remarkable in-wall speaker. A Flowport is among the technical features.

  The frame measures 736mm by 276mm and protrudes 7mm from the wall, sitting 102mm behind the surface, and the matching pre-mount kit is the 7.3W. Back box and grille are finished in White.
specs: |-
  - Description: 3-way in-wall system
  - Technical features: Carbon Dome tweeter, Continuum cone FST midrange, Aerofoil profile bass cones, Flowport
  - Drive units: 1x ø25mm (1in) Carbon Dome high-frequency
  - Drive units: 1x ø100mm (4in) Continuum cone FST midrange
  - Drive units: 2x ø150mm (6in) Aerofoil profile bass
  - Frequency range (-6dB): 43Hz to 33kHz
  - Frequency response: 45Hz to 28kHz ±3dB
  - Sensitivity: 90dB spl (2.83Vrms, 1m)
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <1% 80Hz to 33kHz, <0.5% 120Hz to 33kHz
  - Nominal impedance: 8Ω (minimum 3.1Ω)
  - Recommended amplifier power: 25W to 200W into 8Ω on unclipped programme
  - Frame height: 736mm (29in)
  - Frame width: 276mm (11in)
  - Depth behind surface: 102mm (4.02in)
  - Cut-out height: 711mm (28in)
  - Cut-out width: 251mm (9.9in)
  - Cut-out height with PMK: 715mm (28.1in)
  - Cut-out width with PMK: 256mm (10.1in)
  - Reservoir box height: 460mm (18.1in)
  - Reservoir box width: 220mm (8.7in)
  - Protrusion: 7mm (0.28in)
  - Pre-mount kit: 7.3W
  - Net weight: 12.4kg (27.32lb)
  - Finishes: Back box White, Grille White
