description: Compact 2x12" guitar speaker cabinet loaded with two 12" Celestion G12T-75 speakers for a tighter, more focused high-end response well suited to high-gain tones. The 1936 is wired for selectable mono or stereo operation via two 1/4" inputs, with power handling of 150W in mono (8Ω) or 75W per side in stereo (16Ω per side). A straight-fronted alternative to Marshall's 4x12 cabinets, designed to pair with Marshall heads from across the range.
details: |-
  This understated 150W, 2x12" cabinet is designed with space in mind without losing that iconic Marshall look or sound.

  The Celestion G12T-75 speakers deliver a softened high-end response, brilliant for higher gain tones. The 1936 can be used in mono or stereo mode, without the need to switch.

  Built in Marshall's UK factory, it is compact and portable while keeping the full 150W handling of a pair of 12" speakers.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Model: 1936 2x12 Cabinet
  - Speaker configuration: 2x12"
  - Speaker model: Celestion G12T-75 (16 ohm, 75W)
  - Power handling: 150W mono, 75W stereo
  - Unit impedance: 8 ohm mono, 16 ohm stereo
  - Inputs: 2
  - Passive cabinet: no mains connection, driven by the amplifier feeding it
  - Weight: 25 kg / 55.1 lb
  - Width: 740 mm / 29.1"
  - Height: 600 mm / 23.6"
  - Depth: 305 mm / 12"
