description: Compact 2x12" guitar speaker cabinet loaded with two 12" Celestion
  G12T-75 speakers for a tighter, more focused high-end response well suited to
  high-gain tones. The 1936 is wired for selectable mono or stereo operation via
  two 1/4" inputs, with power handling of 150W in mono (8Ω) or 75W per side in
  stereo (16Ω per side). A straight-fronted alternative to Marshall's 4x12
  cabinets, designed to pair with Marshall heads from across the range.
