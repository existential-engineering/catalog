description: |-
  An all-in-one wireless bookshelf speaker system featuring a 12th generation
  Uni-Q driver array with built-in phono preamp, HDMI ARC, and Bluetooth 5.4
  with aptX Lossless. Designed for turntables, TVs, and computers with 70W +
  30W Class D amplification per speaker.
specs: |-
  - 12th-gen Uni-Q Driver: 25mm aluminium dome HF, 130mm magnesium/aluminium alloy cone LF/MF
  - Frequency Range (-6dB): 38Hz–20kHz
  - Frequency Response (±3dB): 41Hz–20kHz
  - Amplification: 70W Class D LF + 30W Class D HF per speaker
  - Maximum SPL: 102dB at 1m
  - Dimensions (per speaker, H×W×D): 285×168×268mm
  - Weight (pair): 11.3 kg
  - Bluetooth 5.4 with aptX Adaptive and aptX Lossless
  - Music Integrity Engine DSP
  - Power: 100–240VAC 50/60Hz
  - Colors: Vintage Burgundy, Nickel Grey, Moss Green, Midnight Blue, Dark Titanium
