details: |-
  Product Overview

  The Heil PR 20 UT (Utility) is a versatile dynamic utility microphone engineered to deliver outstanding frequency response, vocal speech clarity, and instrument articulation across live sound reinforcement and studio recording applications. Designed as a significant performance upgrade over traditional industry-standard ball microphones, the PR 20 UT brings Heil Sound's signature wide dynamic range and linear reproduction to an accessible utility package.

  Featuring a large dynamic element with a wide 50 Hz to 18 kHz frequency response, the PR 20 UT handles extreme sound pressure levels up to 145 dB SPL without distortion. Its tight cardioid polar pattern yields -30 dB of rear noise rejection at 180° off-axis , suppressing ambient stage bleed, drum spill, and monitor feedback. Whether used for lead or backing vocals, snare drums, hi-hats, acoustic instruments, or guitar cabinets, the PR 20 UT serves as an indispensable, durable workhorse microphone for audio engineers, performers, and venues.
specs: |-
  - Superior Audio Clarity Over Standard Mics: Outperforms traditional handheld ball dynamic microphones with an extended frequency response (50 Hz – 18 kHz) and higher clarity in the mid-to-high frequencies.
  - Exceptional Rear Noise Rejection (-30 dB): Cardioid pickup pattern effectively rejects off-axis stage noise at 180°, reducing monitor bleed and allowing higher gain-before-feedback on loud stages.
  - High SPL Capacity (145 dB Max SPL): Effortlessly handles high sound pressure levels without clipping or distortion, making it an ideal choice for loud snare drums, percussion, and guitar amplifiers.
  - Multi-Purpose Utility Versatility: Excels across a diverse spectrum of sound sources including live stage vocals, snare drums (top or bottom), hi-hats, brass, and electric guitar speaker cabinets.
  - Durable All-Metal Construction: Engineered to withstand demanding touring conditions, stage drops, and rigorous live performance environments.
  - Passive Dynamic Operation: Connects via standard 3-pin XLR with balanced 600-ohm impedance; requires no phantom power (+48V) or inline preamp boosters.
  - Complete Accessories Package Included: Includes a padded zipper carrying case, foam windscreen, and durable black mic clip.
  - Element Type: Dynamic.
  - Frequency Response: 50 Hz – 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -30 dB.
  - Impedance: 600 ohms balanced.
  - Output Level (@ 1 kHz): -55 dB.
  - Max SPL: 145 dB.
  - Output Connection: 3-pin XLR.
  - Weight: 14 oz (396.8 g).
