details: |-
  Altec Lansing HydraMini 2.0 EVERYTHINGPROOF Speaker

  Take your music anywhere with the Altec Lansing HydraMini 2.0 EVERYTHINGPROOF Speaker. Designed for life on the go, this compact Bluetooth speaker is IP67 waterproof, dustproof, and floats in water, making it perfect for the beach, pool, camping, hiking, and outdoor adventures. Featuring a built-in magnet, speaker mount, and carabiner, the HydraMini 2.0 can be mounted, clipped, or attached to most metal surfaces for convenient listening anywhere. Enjoy up to 12 hours of playtime and pair two Hydra speakers together for immersive stereo sound. With a 100-foot Bluetooth wireless range and USB-C quick charging, you'll have reliable audio wherever your adventures take you.
