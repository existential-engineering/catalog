description: "A compact studio subwoofer featuring automatic room calibration
  via ARC X technology, delivering deep bass extension down to 25 Hz with a
  6.5-inch aluminum woofer, dual passive radiators, and 160 W RMS power in the
  smallest footprint on the market."
details: |-
  The iLoud Sub is a compact studio subwoofer built around a 6.5" high-performance aluminum woofer and 2x 6.5" aluminum passive radiators. Digital amplification delivers 160 W RMS (200 W peak) with a crossover range of 50 Hz to 150 Hz and a system latency of just 1.42 ms.

  Built-in ARC X automatic room calibration with included measurement microphone optimizes bass response for any listening environment. The digital processing supports sample rates of 44.1, 48, 88.2, and 96 kHz. Bluetooth connectivity supports SBC and AAC codecs.

  Designed for use with iLoud Micro Monitor, iLoud MTM, and other compact studio monitors to extend bass response down to 25 Hz.
specs: |-
  - 6.5" high-performance aluminum woofer
  - 2x 6.5" aluminum passive radiators
  - 160 W RMS / 200 W peak digital amplification
  - Crossover range: 50 Hz - 150 Hz
  - System latency: 1.42 ms
  - Sample rates: 44.1, 48, 88.2, 96 kHz
  - ARC X automatic room calibration (mic included)
  - Bluetooth: SBC, AAC
  - Operating temperature: 0 to 45 °C (non-condensing)
