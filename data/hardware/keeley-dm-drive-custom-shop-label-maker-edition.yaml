details: |-
  The Label Maker Edition is a Custom Shop finish of the D&M Drive, the dual boost and drive pedal developed with Dan and Mick of That Pedal Show. The orange paintwork and D&M graphics of the standard pedal give way to pared-back styling: a bare metal enclosure finished in clear lacquer with matte black screen-printed labelling, and Marshall-style knobs. The circuit inside is the standard D&M Drive. Twenty units of this finish were offered.

  The high-voltage boost side is built to push an amp, delivering a large amount of headroom with a distinct midrange voice that can be dialled in for lead work, and it saturates smoothly as it is turned up. The drive side runs multiple gain stages, from a low-gain overdrive for chord work through to a heavily saturated, sustaining lead tone.

  A toggle sets which side comes first when both are engaged. TRS insert cabling allows the pedal to be integrated into a professional switching system and the two sides addressed as independent effects. The design holds a 2017 Guitar Player Magazine Editor's Pick award and a Guitar Magazine Gear of the Year 2017 award.
