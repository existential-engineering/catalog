description: Utilizes a patented Double Eccentric Cam that increases the sensitivity of the footboard.
details: |-
  DW 9000 Series Hi-Hats utilize a patented Double Eccentric Cam that increases the sensitivity of the footboard in relation to cymbal movement, resulting in a unique, incredibly fast and responsive feel. The Infinitely Adjustable Locking Spring Tension feature allows for precise adjustment to offset the weight of the top cymbal, creating a customized feel.

  The Lateral Cymbal Seat allows the bottom cymbal angle to be set to precise preferences, and the uni-body folding footboard stays attached to the base when folded.

  Heavy double-braced legs swivel and keep the stand from toppling or rocking, while the locking clutch holds the hi-hats in place with sizzle and sway. A ball bearing hinge adds to the responsiveness.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
  - Heavy duty 2-legged hi-hat stand
  - Double Eccentric Cam for fast and responsive performance
  - Lateral Cymbal Seat for adjusting the bottom cymbal angle
  - Uni-body folding footboard stays attached to the base
  - Ball bearing hinge
  - Locking clutch
  - Swivel, double-braced legs
  - Infinitely Adjustable Locking Spring Tension
