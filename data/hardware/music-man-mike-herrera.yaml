description: >-
  Mike Herrera signature StingRay bass — an ash-body, Seafoam Green artist
  series with matching headstock, engraved white pearloid pickguard, and passive
  electronics wired straight to the jack.
details: |-
  For more than two decades MXPX frontman and bassist Mike Herrera has wielded a custom StingRay, modified to his unique specifications. Now Herrera's signature instrument is available to the public.

  The Mike Herrera StingRay features an ash body with Seafoam Green finish, a matching headstock, an engraved white pearloid pickguard, passive electronics (no battery required), and a custom laser-engraved Artist Series neckplate.

  With the appearance of a traditional 2-band EQ StingRay, the Herrera StingRay's pickup is actually wired straight to the jack, with three dummy knobs for visual consistency.

  Additional features include a maple neck and fretboard, 21 nickel frets, a six-bolt neck, and alnico magnets.
specs: |-
  - Body wood: Ash
  - Finish: Seafoam Green
  - Neck: Maple with matching headstock
  - Fingerboard: Maple
  - Frets: 21 high-profile wide, nickel silver
  - Scale length: 34"
  - Pickup: Music Man humbucking with alnico magnets
  - Electronics: Passive (pickup wired directly to jack; three dummy knobs)
  - Bridge: Music Man chrome-plated hardened steel plate with stainless steel saddles
  - Tuning machines: Schaller BM with tapered posts
  - Neck attachment: 6-bolt
  - Pickguard: Engraved white pearloid, 3-ply with black center layer
  - Strings: 50w-70w-85w-105w (Regular Slinky Bass #2832)
