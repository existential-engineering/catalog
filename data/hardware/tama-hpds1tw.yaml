description: At TAMA, our tireless product team has immersed their activity in
  direct drive bass drum pedals. Direct drive pedals provide a unique benefit -
  immediate energy conversion and accelerated beater movement.
details: |-
  Optimized Transmission Design (US.PAT.NO.12327536): By precisely positioning and aligning the contact point transmission angles between the cam, direct link and footboard, we achieved the perfect overall balance of power-speed-feel.

  Dual Linkage: To convert rotational motion force from footboard to cam, we developed a sturdy double-link cam connection system that holds the rotation axis bearings equally from both sides. This produces almost perfect energy transfer from the footboard-to-cam and creates phenomenal reaction speed and power.

  Slidable Cam: The upper cam section slides back and forth in a "non-step" action to adjust the cam-turning radius. A larger turning radius provides for a more linear motion between footboard and beater and results in a high-degree of sensitivity for nuanced performance. The smaller turning radius results in a more dynamic (non-linear) motion. The Slidable Cam promotes a highly personalized and "connected" feel tailored to widely diverse playing styles.

  Footboard Angle Adjustment (US.PAT.NO.10475423): Drummers have come to recognize and appreciate independent bass drum footboard angle adjustment as an important function to help customize a personal feel. This inspired us to focus on the Dyna-Sync design and create a completely new and unique footboard angle adjustment. The Dyna-Sync footboard angle design integrates into the clam-shaped connection point between linkage and footboard and is fully adjustable to deliver a totally personalized pedal angle adjustment.

  Sync-Coil (US.PAT.NO.7408104): The Sync-Coil is a 1.5x heavier gauge steel spring compared to our established Cobra Coil. The Sync-Coil assists the return of the footboard to the original position to provide an extra element of quickness to the pedal and slides on the bass plate so drummers can customize their own level of pedal return assistance.

  Dyna Beater: Featuring black felt and a slightly tapered shape, this traditional style beater provides impact to the bass drum head surface evenly to maximize clear, dynamic articulation.
