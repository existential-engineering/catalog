description: Parallel Stereo and Surround Reverb/Effects Processor with Digital I/O.
details: |-
  The PCM96 Surround (Digital) is the all-digital configuration of Lexicon's reference-class stereo and surround reverb/effects processor. It delivers parallel stereo and surround reverb and effects for high-end music production, post-production, and live sound, with connectivity tailored to fully digital rigs.

  The processor runs 32-bit floating-point internal audio at sample rates up to 96 kHz and ships with more than 2,200 factory presets plus 768 user preset locations. A Compact Flash slot supplements onboard storage. The algorithm library spans 50 reverb and effects programs, including Room, Hall, Chamber, Plate, Random Delay, Dual Delay, Ambience, Resonant Chords, Chorus/Flange, Concert Hall, Pitch, and Signal Generator, with dedicated stereo, surround, and mono variants.

  Unlike the standard PCM96 Surround, which uses DB25 connectors for 6-channel analog and AES/EBU I/O, this digital variant exposes six XLR pairs of AES/EBU stereo I/O. BNC word clock input, MIDI In/Out/Thru, and an Ethernet port for remote control are shared across both configurations.

  Remote control, preset management, and DAW automation are handled via the bundled PCM Control & Plugin software (Mac OS X) and HiQnet System Architect (Windows).
specs: |-
  - 32-bit floating-point internal processing
  - Sample rates up to 96 kHz
  - Over 2,200 factory presets
  - 768 user preset locations
  - Compact Flash storage support
  - 50 reverb/effect algorithms (stereo, surround, and mono variants)
  - 6 XLR AES/EBU stereo I/O pairs
  - BNC word clock input
  - MIDI In / Out / Thru
  - Ethernet remote control
  - 1U rack-mountable chassis
  - PCM Control & Plugin software (Mac)
  - HiQnet System Architect support (Windows)
