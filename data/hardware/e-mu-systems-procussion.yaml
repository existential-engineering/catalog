description: >-
  The E-mu Procussion is a 32-voice rack-mount percussion sound module from 1991 featuring
  4MB of 16-bit ROM samples drawn from the Emulator III library, with fully editable drum
  kits and multi-sample layering capabilities.
details: |-
  Released in 1991 as part of E-mu's Proteus-era product line, the Procussion is a dedicated percussion MIDI sound module built around 4MB of 16-bit samples recorded at 39kHz. The sample library was carefully selected from the acclaimed Emulator III sound library, covering hundreds of drums, percussion instruments, mallets, vibes, and more across both acoustic and electronic categories.

  Sound design capabilities go well beyond simple sample triggering. Users can combine up to four samples into a single drum sound or blend percussion samples with digital waveforms for hybrid textures. Each instrument offers individual control over tuning, volume, pan, and other attributes, while Stacks of up to four percussion instruments can be modulated based on velocity and pedal parameters for expressive, dynamic performance.

  The unit organizes sounds into 128 drum kits, with 64 factory ROM presets and 64 user-programmable slots. Each kit supports up to 24 drum samples, and many of the included sounds feature stereo effects built into the sample data itself. The G-chip processor handles all synthesis duties, though the sound ROM cannot be expanded.

  Operating across 16 MIDI channels with 32-voice polyphony, the Procussion functions purely as a sound module with no onboard sequencer or pattern storage. Notable users include Front 242 and KMFDM, reflecting the module's strength in delivering punchy, aggressive electronic percussion alongside more traditional drum sounds.
specs: |-
  - Polyphony: 32 voices
  - Drums: 4MB ROM, 220 samples, 16-bit at 39kHz (G-chip)
  - Sound ROM: Not expandable
  - Keyboard: None
  - Memory: 64 ROM kits, 64 user kits (24 samples per kit)
  - Control: MIDI (16 channels)
