url: https://bastl-instruments.com/eurorack/modules/grandpa
description: >-
  grandPA is a discontinued dual granular sampler Eurorack module inspired by
  microGranny, featuring two independent sample channels with trigger inputs, a
  shared assignable CV input, and a 12-bit audio output. It reads from a
  front-accessible microSD card and allows per-channel adjustment of sample
  rate, crush, grain size, shift speed, attack, release, start, and end
  position.
details: |-
  5HP width, 35mm depth. Power: +12V 50mA. SPA expander available for
  additional CV control.
