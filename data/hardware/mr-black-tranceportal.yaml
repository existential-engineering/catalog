description: The TrancePortal is a shimmer echo pedal that layers an octave-up
  choir shimmer and modulation onto a short digital delay for a mesmerizing,
  ethereal ambience.
details: |-
  The TrancePortal is a shimmer echo, a short modulated delay with an octave-up
  choir shimmer blended in for a spacious, three-dimensional ambience. Mr. Black
  describes its sound simply: words cannot be found to express it, it is
  breathtaking and entirely unique.

  The pedal runs delay times in the short range with the shimmer and modulation
  woven into the repeats throughout, giving a nearly octave-up, ethereal quality
  that cannot be switched off but can be shaped with a small set of controls
  covering level, regeneration and time.

  The result sits between a reverb, a delay and a pitch effect, producing lush,
  cascading, angelic tails that made the TrancePortal a sought-after ambient
  pedal.

  TrancePortal production has been discontinued and the pedal sold out in 2018.
  It remains proudly made in the U.S.A.
specs: |-
  - Shimmer echo: short modulated delay with octave-up shimmer
  - Three controls: Level, Regen and Time
  - Shimmer and modulation inherent across the delay range
  - True-Bypass
  - 9VDC pedal-board friendly power
