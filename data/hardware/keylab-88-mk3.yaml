description: >
  Take command of your sound, and perform with elegance and precision. KeyLab 88 mk3 is an advanced MIDI controller with a fully-weighted hammer-action keybed and innovative creative features - offering an uncompromising playing experience in a robust, high-quality design.
details: |-
  The keylab 88 mk3 is an advanced MIDI controller featuring a fully-weighted 88-note fatar tp/110 hammer-action keybed with aftertouch, designed to deliver authentic piano-like response and expressive performance. It combines premium hardware construction with innovative creative features, offering an uncompromising playing experience in a robust, high-quality design. The controller seamlessly integrates with all major daws and supports musical ideation through its comprehensive control surface, making it ideal for both studio production and live performance.

  The keyboard features powerful creative tools including a multi-mode arpeggiator with hold function, chord mode with smart voicing for quick chord creation, and scale mode that locks the keybed to built-in scales to prevent wrong notes. The 3.5-inch full-color display provides real-time feedback on your DAW and sound parameters, while 8 contextual buttons enable intuitive navigation of sounds and projects. Nine 360-degree rotary encoders and nine 50mm faders provide precise control over crucial parameters, and 12 velocity and pressure-sensitive rgb pads with 4 banks allow for MIDI note playing, drum triggering, and clip launching.

  Control connectivity is extensive, featuring MIDI 5-pin din I/o for external gear synchronization, USB-c bus-powered connectivity for modern setups, and four pedal inputs supporting sustain, modulation, expression, and an additional auxiliary input. The keyboard includes pitch bend and modulation wheels for expressive sound manipulation, transpose controls for semitone and octave adjustments, and dedicated buttons for program selection, pad bank switching, and MIDI channel control. Advanced DAW integration includes custom scripts for ableton live, logic pro, cubase, fl studio, and bitwig studio, plus nks-compatibility with the native instruments ecosystem and mcu/hui protocol support for virtually any DAW.

  The included software suite provides immediate creative possibilities with analog lab pro featuring 2000+ sounds, ableton live lite for music production, and premium instruments including mini v, augmented strings, piano v, and rev plate-140 reverb. Additional services include a 2-month loopcloud subscription with millions of royalty-free samples and a melodics subscription offering 40 keyboard lessons. The controller supports up to 6 user presets for customizable workflows and is available in 49, 61, and 88-key configurations in black or white finishes.

  The keylab 88 mk3 is constructed with high-density plastic, ruggedized knobs, and real-wood paneling for durability and aesthetic appeal. Each unit undergoes 180 individual quality tests to ensure flawless performance and long-lasting reliability. The package includes a laptop plate, musical sheet holder, USB-c to USB-a cable, and registration card, making it ready for immediate use in studio or stage environments.
specs: |-
  - 88-note fully-weighted fatar tp/110 hammer-action keybed with aftertouch
  - Velocity and pressure sensitivity
  - 3.5-inch full-color display (320x480px)
  - 9 rotary encoders (360-degree touch-sensitive)
  - 9 faders (50mm touch-sensitive)
  - 12 velocity and pressure-sensitive rgb pads with 4 banks
  - 1 clickable encoder
  - Pitch bend and modulation wheels
  - Transpose controls (semitones and octaves)
  - Multi-mode arpeggiator with hold function
  - Chord mode with smart voicing
  - Scale mode with built-in scales
  - 8 contextual buttons for DAW control
  - 4 pedal inputs (sustain, modulation, expression, aux)
  - MIDI 5-pin din I/o
  - USB-c connectivity (bus-powered)
  - Mcu/hui protocol support
  - Nks-compatible (native instruments komplete kontrol)
  - Custom DAW scripts for ableton live, logic pro, cubase, fl studio, bitwig studio
  - Up to 6 user presets
  - Windows 10+ (64-bit), 4gb ram, 4-core cpu 3.4ghz, 3gb free disk space, opengl 2.0 gpu
  - Mac os 11+, 4gb ram, 4-core cpu 3.4ghz or m1 cpu, 3gb free disk space, opengl 2.0 gpu
  - Works in standalone, VST, AAX, audio unit formats
  - Dimensions: 323 x 1295 x 113 mm (12.72 x 50.98 x 4.45 in)
  - Weight: 15.7 kg (34.61 lb)
  - High-density plastic construction with ruggedized knobs and real-wood paneling
  - 180 individual quality tests per unit
