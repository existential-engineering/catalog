description: Erica Synths Pico Mask is an advanced random CV signal generator
  that generates sample and hold CV signal within user defined mask.
details: |-
  Pico MASK is an advanced random CV signal generator that produces a sample and hold CV signal within a user defined mask. Two CV inputs set the boundaries of that area and two manual controls define the sample and hold parameters, which is what gives a certain amount of control over randomness.

  An external sample and hold trigger input sets the rate at which new values are taken, and two selectable CV distribution modes change how values fall within the mask. LEDs indicate the incoming trigger and the output CV.

  Pico MASK can play a key role in self-generating music and also works as a CV processor, a waveshaper and a bitcrusher.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep, handling CV from -5V to +5V in and out.
specs: |-
  - User defined S&H area with 2 CV inputs
  - External S&H trigger
  - Two manual controls to define S&H parameters
  - 2 selectable CV distribution modes
  - S&H trigger in and output CV control LEDs
  - Incoming CV amplitude -5V, +5V
  - Output CV amplitude -5V, +5V
  - Power consumption +12mA, -6mA
  - Module width 3HP
  - Module depth 35mm
