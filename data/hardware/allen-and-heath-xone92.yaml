description: The legendary Xone:92 is a versatile six-channel analogue mixer,
  renowned for its warm, punchy sound with unsurpassed EQ and filter sections.
details: |-
  The Xone:92 defined club music for a generation. Now, it's back to set new standards. Analog warmth, precision control, and bulletproof reliability — elevated for the next generation of underground innovators and Big Room stars.

  Building on the Xone:92's revered legacy and featuring hardware enhancements from the acclaimed Xone:92 Limited Edition, the new mixer adds silent VCF switching, a new custom innoFADER crossfader, and a collection of precision upgrades that preserve the legendary 92 DNA while improving performance.

  For two decades, the Xone:92 set the sonic standard for dance music with its all-analogue signal path. The new Xone:92 delivers the iconic sound that DJs and clubbers have come to love, but with the latest high-performance analogue components in the audio path.

  The Xone:92 filter changed the game when it made its debut in 2004. Twenty years on, it's still the benchmark, and the new Xone:92 takes it further with dual analogue VCF filters featuring silent switching and refined tapers for enhanced control.

  All phono/line channels feature the renowned 4-band EQ with total kill on HF and LF bands, plus dual mid-frequency controls for the ultimate in tonal control. Mic channels include a 4-band EQ with ±15 dB on all bands.

  Built to withstand the rigours of clubs, festivals, and relentless touring thanks to a rugged, tried and tested chassis designed for night after night of high-energy sets. The new Xone:92 revamps the classic Storm Grey colourway with enhanced UV printing for low light legibility, and a refocused legend for increased visibility of key controls, with recessed Filter and XFade assign switches further improving ergonomics.

  The Xone:92 phono preamp has been fine-tuned to get the best out of vinyl with an RIAA curve tailored specifically for techno and house, and improved Line/Phono source matching for easy integration of analogue and digital sources.
specs: |-
  - 4 Phono/Line Channels + 2 Mic/Line Channels
  - 100% analogue circuitry and mix bus summing
  - Dual analogue VCF Filters with silent switching
  - Precision 4-band EQ control
  - Custom mini innoFADER Pro crossfader for smoother mixing
  - Updated storm grey colourway and refocused UV legend
  - New 3-way, global Channel fader curve switch
  - Improved Channel 1–4 Input Level and source-matching
  - Refined Xone:VCF tapers for enhanced control
  - Optimized RIAA preamps
  - Removable dual-ground adaptor
  - Rear panel Mic clean feed switches
