description: FELT is a Eurorack module that filters video signals, providing
  simultaneous High-Pass and Low-Pass outputs for edge extraction and image
  smearing. Its cutoff frequency is voltage controlled over a wide range.
details: |-
  FELT is a filter for video with simultaneous High- and Low-Pass outputs for edge extraction and variable smearing respectively. The cutoff frequency is voltage controlled over a wide range. The High-Pass output is a bipolar signal meaning rising edges are provided above zero volts and falling edges are below zero. Accessing falling edges is as simple as inverting the output, or patching through an "absolute value" function to mix both rising- and falling-edges together. The Low-Pass output delays the rise and fall time of provided luma signals to blur them from left to right as they appear on your display. One FELT module is all you need to begin extracting edge maps or smearing any video rate luma signal. Three FELT modules can be used in parallel for full-color RGB patches.
