details: |-
  The KAT ktmp1 is the quick and easy solution to expand any setup. Playable with both hands or sticks, this single module adds electronic drum, dance, and percussion sounds immediately to your fingertips. This compact and affordable module features 50 high-quality, fully-adjustable, multi-purpose sounds. Sounds can be tuned, panned and assigned to one of the four highly-responsive pads. Additionally, you can fine-tune reverb, sensitivity and level control to shape every sound to perfectly suit your needs. The KAT ktmp1 is a great addition to any drum set, percussion rig, DJ set-up and is also the perfect tool for laying down studio tracks. The KT Series Digital Drumsets , KTMP Multipads , and KA Series Drum Amplifiers are manufactured and warrantied under license by Hal Leonard. For more information on support and warranties, please visit http://www.katpercussion.com
