url: https://dbxpro.com/en/products/1215
description: Dual Channel 15-Band Graphic Equalizer designed for demanding sound
  reinforcement with dual channels, 15 2/3 octave bands, and ISO frequency
  centers.
details: |-
  The 1215 is part of the dbx 12 Series, engineered to meet the needs of the most demanding sound reinforcement environments while offering straightforward controls. It features dual channels with 15 2/3 octave bands, ISO frequency centers, +/-12 dB input gain range, and switchable 40Hz/18 dB per octave low-cut filters. The unit includes 45 mm faders, selectable +/-6dB or +/-15dB boost/cut ranges, and multiple connector options including XLR, barrier strip, and 1/4" TRS for installation flexibility.

  Precision engineered for maintenance-free operation, the 1215 incorporates a magnetically isolated transformer, electronically balanced/unbalanced inputs, servo balanced/unbalanced outputs, RF-filtered inputs and outputs, and power-off hard-wire relay bypass with 2-second power-up delay. The unit delivers a 10Hz to 50kHz frequency response, greater than 90dB SNR, less than 0.005% THD+Noise at 1kHz, and interchannel crosstalk less than -80dB. All components are housed in a 2U steel/aluminum chassis.
specs: |-
  - Dual channel 15-band equalizer
  - 15 2/3 octave bands with ISO frequency centers
  - Switchable +/-6dB or +/-15dB boost/cut ranges
  - +/-12dB input gain range
  - 40Hz 18dB/octave Bessel high-pass filter
  - 45mm faders
  - Electronically balanced/unbalanced inputs
  - Servo balanced/unbalanced outputs
  - RF filtered inputs and outputs
  - XLR, barrier strip, and 1/4" TRS connectors
  - Chassis/signal ground lift capability
  - Power-off hardwire relay bypass with 2-second delay
  - Frequency response: 10Hz to >50kHz (+0.5/-3dB)
  - Signal-to-noise ratio: >90dB
  - THD+Noise: <0.005%
  - Interchannel crosstalk: <-80dB (20Hz-20kHz)
  - 4-LED bar graph input/output meter
  - Max input: >+21dBu balanced or unbalanced
  - Max output: >+21dBu into 2kOhm or greater
  - 2U steel/aluminum chassis
  - Dimensions: 3.5"H x 19"W x 7.9"D
  - Weight: 8.5 lbs
  - Power consumption: 24W
  - Operating voltage: 100/120/230VAC 50/60Hz
  - Input impedance: 40kOhm balanced, 20kOhm unbalanced
