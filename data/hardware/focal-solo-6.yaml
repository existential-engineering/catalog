description: The versatile Solo6 2-way monitor offers unrivalled definition, transparency, dynamics and soundstage precision. Thanks to its Focus Mode, it forms two monitors in one, keeping you in the sweet spot when mixing.
details: |-
  The versatile Solo6 2-way monitor offers unrivalled definition, transparency, dynamics and soundstage precision. Thanks to its Focus Mode, it forms two monitors in one, keeping you in the sweet spot when mixing, saving console space and simplifying cabling and monitor changes.

  Cutting-edge technologies: the ST6 line (Solo6, Trio6 and Twin6) features high-performance Focal technologies: Beryllium tweeter, "W" diaphragm woofer and TMD speaker suspension technology, which reduces distortion in the 1 kHz to 3 kHz frequency range by 50%.

  Two monitors in one: the switchable Focus Mode lets you switch from 2-way monitor to 1-way monitor from the woofer only.

  Multiple functions: Solo6 features a variable high-pass crossover and a 160 Hz parametric crossover to reduce reflections from the console or desk. It also features a disengageable automatic standby mode accessible via a switch, offering a simple and essential option for loudspeaker control.

  Dolby Atmos installation: for immersive listening with Dolby Atmos and Sony 360RA installations, Solo6 includes inserts for wall and ceiling mounting.
specs: |-
  - Product type: 2-way monitor
  - Woofer: 6.5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (+/- 3dB): 2-way mode 40 Hz - 40 kHz; 1-way Focus mode 110 Hz - 10 kHz
  - Maximum SPL (peak @ 1m): 110 dB
  - High frequency amplifier: 50 W, class AB
  - Mid-range and low frequency amplifier: 80 W, class G
  - Inputs: XLR symmetrical 10 kOhms
  - High-pass filter: full range, 45 Hz, 60 Hz, 90 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-3 dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, HPF, LF Shelv, LMF EQ, HF Shelv
  - LEDs: power on, Focus mode, clipping/default/stand-by
  - Local supply: ~100-120 V T2.5AL/250 V; ~220-240 V T1.25AL/250 V
  - On/Off switch on the rear panel
  - TMD suspension technology
  - Height: 33.4 cm / 13.1 in
  - Width: 24.6 cm / 9.7 in
  - Depth: 29.5 cm / 11.6 in
  - Weight: 13 kg / 28.6 lb
