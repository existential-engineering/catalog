url: https://www.focal.com/products/solo-6
description: 2-way active studio monitor with a 6.5" W cone woofer, 1"
  Beryllium inverted dome tweeter, and a Focus mode that switches the speaker
  into a single-driver mini reference for cross-checking mixes.
specs: |-
  - 2-way monitor with Focus mode
  - Woofer: 6.5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (2-way mode, ±3 dB): 40 Hz – 40 kHz
  - Frequency response (1-way Focus, ±3 dB): 110 Hz – 10 kHz
  - Maximum SPL (peak @ 1 m): 110 dB
  - Bass/midrange amplifier: 80 W class G
  - High frequency amplifier: 50 W class AB
  - Input impedance: 10 kΩ
  - High-pass filter: Full range, 45 Hz, 60 Hz, 90 Hz
  - Bass level EQ: ±3 dB @ >250 Hz
  - Treble level EQ: ±3 dB @ <4.5 kHz
  - Midrange level EQ: ±3 dB @ 160 Hz
  - Auto standby; Focus mode switch; clipping indicators
  - Power supply: 100–120 V or 220–240 V
  - Dimensions (H × W × D): 33.4 × 24.6 × 29.5 cm (13.1 × 9.7 × 11.6 in)
  - Weight: 13 kg (28.6 lb)
