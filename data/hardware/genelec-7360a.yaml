description: "Equipped for both stereo and multi-channel audio, the 7360A
  intelligently adapts to your space to deliver absolute accuracy at low
  frequencies."
details: |-
  The 7360A is a compact Smart Active Monitoring (SAM) studio subwoofer built around Genelec's Laminar Spiral Enclosure (LSE) technology, which routes the rear of the driver through a long spiral path before the reflex port. The result is exceptionally clean, low-distortion bass extension down to 19 Hz from a relatively small cabinet, with a short-term maximum SPL of at least 109 dB and a peak SPL of at least 114 dB. The subwoofer is designed as a low-frequency monitoring tool for small to mid-sized music, post-production, and broadcast rooms, as well as OB vehicles where space is at a premium.

  Drive is provided by a 250 mm magnetically shielded cone in a reflex-ported enclosure powered by a 300 W Class D amplifier. The frequency response is rated 19 Hz - 100 Hz (+/- 3 dB) with low cutoff at 19 Hz and high cutoff at 150 Hz (-6 dB), and harmonic distortion stays at or below 3% across the 30 - 85 Hz range. Self-generated noise is specified at <= 5 dB SPL, supporting the low noise floor expected of a reference subwoofer.

  The 7360A includes onboard bass management for 7.1 multi-channel systems. Seven XLR analog inputs and seven XLR analog outputs allow the subwoofer to sit in-line with up to a 7.0 main-channel feed, while dedicated analog LFE input and output XLRs handle the .1 channel, including options for daisy-chaining LFE between subwoofers. A single AES/EBU XLR input and an AES/EBU XLR output/thru provide a digital path on the same connector format.

  As part of the SAM range, the 7360A integrates with Genelec Loudspeaker Manager (GLM) software via two RJ45 CAT5 control ports. GLM measures room acoustics and adjusts frequency response, level, delay, and crossover phase so that monitors and subwoofer integrate as a calibrated system. The subwoofer is suited to stereo, multi-channel surround, and immersive workflows in music, post, broadcast, and game audio.

  The cabinet measures 527 x 462 x 363 mm (H x W x D) and weighs 27 kg (59.5 lb). A universal mains supply accepts 100 - 240 VAC at 50/60 Hz, with idle consumption <= 15 W and Intelligent Signal Sensing (ISS) dropping standby draw to <= 1 W. The 7360A typically sits in larger SAM systems alongside Genelec mains and is documented in the same operating manual as the larger 7370A sibling.
specs: |-
  - Smart Active Monitoring (SAM) studio subwoofer
  - Laminar Spiral Enclosure (LSE) technology
  - Short term maximum SPL >= 109 dB
  - Peak SPL >= 114 dB
  - Frequency response: 19 Hz - 100 Hz (+/- 3 dB)
  - Low cutoff (-6 dB): 19 Hz
  - High cutoff (-6 dB): 150 Hz
  - Self-generated noise: <= 5 dB SPL
  - Harmonic distortion (30-85 Hz, 2nd and 3rd): <= 3%
  - Driver: 250 mm cone, magnetically shielded
  - Enclosure: reflex port
  - Bass amplifier: 300 W Class D
  - Analog signal inputs: 7 x XLR female, balanced 10 kOhm
  - Analog signal outputs: 7 x XLR male
  - Analog LFE input: 1 x XLR female, balanced 10 kOhm
  - Analog LFE output: 1 x XLR male
  - AES/EBU input: 1 x XLR female, 110 Ohm
  - AES/EBU output/thru: 1 x XLR male, 110 Ohm
  - GLM control network: 2 x RJ45 (CAT5)
  - Onboard bass management for 7.1 multi-channel systems
  - Mains voltage: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): <= 1 W
  - Power consumption (idle): <= 15 W
  - Power consumption (full output): 300 W
  - Dimensions (H x W x D): 527 x 462 x 363 mm
  - Weight: 27 kg (59.5 lb)
  - Intelligent Signal Sensing (ISS) auto power management
  - GLM (Genelec Loudspeaker Manager) network calibration support
