description: >-
  The Sequential Circuits Split-8 is an 8-voice programmable polyphonic analog
  synthesizer released in 1985, featuring Curtis 3394 SENTE chips and complete
  MIDI implementation. It offers flexible voice allocation modes from 8-voice
  polyphony down to unison, a built-in chorus effect, and a 61-key keyboard with
  split and layer capabilities. While its programming is limited to one
  parameter at a time via a single data knob, it delivers a characteristically
  thin Sequential sound that stands apart from competitors like the Roland
  Juno-106.
details: |-
  The Split-8 was Sequential Circuits' entry into the competitive mid-1980s polysynth market, positioned as a rival to the Roland Juno-106. It features eight voices powered by Curtis 3394 SENTE chips, providing a range of classic analog waveforms including sawtooth, triangle, and square waves.

  Programming is straightforward and intuitive, though limited to adjusting one parameter at a time using a single Data knob. While this restricts live tweaking, it poses no issue for studio work where patches can be carefully crafted and stored. The keyboard supports split and layer configurations, all saveable as part of the patch data.

  The synthesizer offers four distinct operating modes: 8-voice polyphony with one oscillator per voice, 4-voice with dual oscillators per voice, 2-voice with four oscillators per voice, or full unison mode stacking all eight oscillators for massive solo synthesis. A built-in chorus effect adds width and movement to the sound.

  The instrument includes 64 patch memories and 64 performance memories, along with MIDI In/Out with 2-part multitimbral capability and SysEx dumping. The Split-8 sounds thinner than a Roland Juno-106, but this characteristic Sequential sound is quite appealing in its own right, complemented by attractive wooden side panels.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 8 (Curtis 3394 SENTE; sawtooth, triangle, square waveforms)
  - LFO: 1 programmable (0.25-20 Hz; triangle/square; routes to VCO, VCF, or PWM)
  - Filter: 24dB/octave 4-pole lowpass with resonance, cutoff, keyboard tracking, ADSR envelope
  - Envelopes: 2 ADSR
  - Effects: Chorus
  - Keyboard: 61 keys (no velocity or aftertouch), split/layer capable
  - Memory: 64 patches, 64 performances
  - Control: MIDI In/Out (2-part multitimbral), SysEx
  - Year Produced: 1985
releaseDate: "1985"
