details: |-
  The ~900 is a ferocious fuzz pedal featuring two cascading JFET gain stages.
  Tracing its lineage back to the discontinued Four Eyes Fuzz, it offers a very
  wide range of gain, adds delicious harmonics, and will slap the ice cream cone
  right out of your hand.

  The four highly interactive controls are: INPUT (input gain), FUZZ (second stage
  gain), BIAS (second stage bias and gain), and VOLUME (output level). The INPUT
  section uses a mu-amp design allowing range from clean with lots of headroom to
  completely slammed and distorted. The BIAS knob adjusts the bias of the second
  gain stage, controlling saturation symmetry and enabling gating at high settings.
