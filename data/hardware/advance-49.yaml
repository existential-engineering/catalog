details: |-
  The Advance 49 gives you unprecedented playability and unrestricted
  manipulation of any virtual instrument with an exclusive interactive,
  full-color display, complemented by performance-friendly hardware controls.
  Available in 25-, 49-, and 61-key sizes, the advance keyboards deftly fuse the
  power of software instruments with the live playability of a keyboard
  workstation.

  The keyboard surface features an integrated high-resolution full-color
  4.3-inch display, providing real-time control and feedback of all virtual
  instruments. The screen instantly adapts itself to the selected plugin's
  controls, delivering immediate 1:1 access to the instrument and various
  editable functions.

  Dedicated physical controls are thoughtfully included, with rgb backlit,
  velocity- and pressure-sensitive pads on each keyboard surface. Rubberized
  pitch and modulation wheels provide simple, direct note manipulation with
  musically natural action. Easily-gripped, continuously-variable endless knobs
  let you make adjustments with granular or dramatic effect. The custom
  semi-weighted, velocity-sensitive keybed supports aftertouch, making it the
  ideal keyboard for seasoned live performers and studio producers alike.

  Included with each advance keyboard is the virtual instrument player (vip)
  application. Vip gives you immediate access to any virtual instrument in your
  collection—with or without a DAW—a powerful way to play virtual instruments
  live or integrate them into a recording session. Vip software users can also
  create setlists that provide on-demand access to your customized instruments
  for stage performance and studio work.

  Vip runs as a vsti, AU, or AAX plugin, allowing you access to vsti's in
  virtually any DAW, such as pro tools, logic pro x and ableton live. You'll
  also enjoy vip's facilities for hyper-fast instrument and patch browsing, key
  zone splitting, layering of up to 8 instruments per vip instance, expansive
  custom mapping capabilities, and support for any vsti plugin.
specs: |-
