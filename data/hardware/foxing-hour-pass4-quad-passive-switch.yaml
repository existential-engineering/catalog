description: A simple quad passive switch module for switching between sets of 4
  signals, either 2:1 or 1:2 configuration. It requires no power to operate.
details: |-
  Quad 2:1 or 1:2 Passive Switch

  This is a simple quad 2:1 or 1:2 passive switch for easily switching between sets of 4 signals. Switch one set of 4-inputs to 2 sets of 4-outputs or switch between two sets of 4-inputs to 1 set of 4-outputs. The simple shapes on the faceplate illustrate the connections made by the switch and allow users to orient the module in their racks any way they wish without having upside-down text. Dimensions:

  6 HP

  14 mm deep

  Current Draw:

  Module does not draw current
