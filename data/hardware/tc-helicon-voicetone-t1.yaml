description: Single-button vocal tone stompbox whose Adaptive Tone processing
  sets EQ, compression, de-essing and gating automatically as the singer
  performs, with Warmth and Presence switches for manual shaping.
details: |-
  The VoiceTone T1 addresses the technical rather than creative problems of a live vocal: a level that is too quiet or too loud, harsh sibilance, a thin tone in the chorus, and feedback drifting in on high notes. The processing engages with a single footswitch.

  Adaptive Tone analyses the incoming voice and shapes EQ, compression, de-essing and gating in real time, in the manner of a studio engineer's treatment but adjusted continuously rather than set once. It keeps adapting as the room fills, as the voice warms up, and as the singer moves closer to or further from the microphone.

  Warmth and Presence switches shape the vocal further when a room sounds boxy or a song needs more clarity. Connections are an XLR input and an XLR output, with phantom power for condenser microphones and a DC power input, in a footprint small enough to share a pedalboard with a tuner.
specs: |-
  - Adaptive Tone processing of EQ, compression, de-essing and gating in real time
  - Warmth and Presence switches
  - Single-footswitch operation
  - Phantom power for condenser microphones
  - Pedalboard-sized chassis
