description: VCO340 is a triangle core analog voltage controlled oscillator
  based around the CEM3340/AS3340 VCO chip, offering traditional and morphing
  waveforms plus a switchable sub-octave output for Eurorack systems.
details: |-
  Triangle core analog voltage controlled oscillator based around the famous CEM3340/AS3340 VCO chip. Alongside traditional wave shapes two more variable, morphing waveforms (saw to inverted saw, sine to triangle) and a bi-mode sub-octave output were added.
specs: |-
  - pulse width control ( SHAPE ) with CV input and attenuator
  - linear or exponential FM input with attenuator
  - 8-position octave switch for quick and precise coarse tuning
  - tune knob controls the pitch continuously over one octave
  - external sync input
  - six waveform outputs
  - sub-octave with switchable range
