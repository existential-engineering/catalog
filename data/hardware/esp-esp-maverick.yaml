description: All ESP Original Series instruments are hand-crafted, one at a
  time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan.
  The ESP Maverick is a special guitar by every definition… most notably being
  one of the most eminently comfortable, perfectly balanced, and smoothly
  playable guitars you'll ever have the pleasure of rocking. Offered in the
  outstanding Andromeda-II finish that iridescently changes colors based on the
  angle of light, it's built with bolt-on construction at 25.5" scale, with a
  black cherry body paired with a thin u-shaped three-piece maple neck. The ESP
  Maverick includes an ebony fingerboard with offset dot inlays, Luminlay side
  dots, a reverse headstock with matching finish, and a slanted end to
  accommodate 27 extra-jumbo stainless steel frets. World-class components on
  this guitar include black hardware, a Floyd Rose Original double-locking
  tremolo bridge, ESP strap locks, Gotoh locking tuners, and a terrific set of
  Seymour Duncan pickups — a TB-14 Custom 5 trembucker in the bridge, and an
  SCR-1 Cool Rails in the neck position — offering a huge range of powerful
  tones. Includes a deluxe ESP form fit case.
