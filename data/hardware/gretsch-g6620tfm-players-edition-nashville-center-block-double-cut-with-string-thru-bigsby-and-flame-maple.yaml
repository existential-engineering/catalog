details: |-
  For full-throttle Nashville class, the double-cutaway G6620TFM Players Edition Nashville Center Block Double-Cut with String-Thru Bigsby and Flame Maple nails it with the time-honored Gretsch model's classic style. This model features a beautiful tiger flame maple top, body and headstock finished in orange stain, with a chambered spruce center block that enhances body resonance for more organic tone and comfortably lighter weight.

  Built to perform, its elegant features also include gold hardware, an ebony fingerboard and the classic Gretsch horseshoe headstock inlay. For the sonic muscle and finesse, two High-Sensitive Filter'Tron pickups deliver authentic Gretsch power and articulation.
