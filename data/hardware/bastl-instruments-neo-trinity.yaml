id: yu4ZOXCUYYtBwq-0iBGWB
name: Neo Trinity
manufacturer: bastl-instruments
primaryCategory: modulation
url: https://bastl-instruments.com/eurorack/modules/neo-trinity
description: A 6-channel compact modulation hub for Eurorack. Each independent
  channel operates as an LFO, envelope generator, or CV knob recorder with
  automatable parameters and recordable trigger sequences. Features
  unipolar/bipolar output modes, an algorithmic trigger fill generator with 6
  algorithms, 6 preset banks, clock sync (35–420 BPM), and USB-C firmware
  updates.
details: |-
  Neo Trinity is a performance-focused modulation platform offering gestural control with substantial musical complexity. Each of its six independent channels can be configured as an LFO, envelope generator, or CV knob recorder, with automatable RATE knobs and recordable trigger sequences of 2 to 64 steps per channel.

  LFO mode offers five shapes (saw, triangle/sine, ramp, pulse, smooth random) with a range from 260 seconds to 180 Hz. Envelope mode provides four shapes (decay, attack, variable, pulse) with a range of 1 ms to 8 seconds, supporting retrigable, non-retrigable, and slew limiter modes. CV mode includes 8 selectable quantization scales, a 2V or 5V range switch, and optional smoothing.

  The META In jack is assignable to any or all channels. Channels E and F have dedicated individual CV inputs, configurable per channel as rate modulation, bipolar VCA, trigger input, or sample-and-hold. An algorithmic trigger fill generator with 6 algorithms and 6 preset banks enable deep performance-time control. Clock sync: internal or external, 35–420 BPM. Firmware updateable via USB-C.
