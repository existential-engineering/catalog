description: Charvel's Guthrie Govan USA Signature model, developed over two
  years with the U.K. virtuoso, pairs a caramelized ash San Dimas body with a
  versatile HSH pickup configuration and a contoured heel for unobstructed
  upper-fret access.
details: |-
  The Guthrie Govan USA Signature HSH Caramelized Ash is a 25.5" scale guitar built around a caramelized ash San Dimas Style 1 body finished in thin satin lacquer, with a specially contoured heel (no neck plate) for easy access to the upper reaches of the fingerboard.

  The bolt-on caramelized flame maple neck features graphite reinforcement, a hand-rubbed satin urethane finish on the back, and a heel-mount truss rod adjustment wheel. The Speed Neck profile is paired with rolled fingerboard edges and the caramelized heat-and-drying treatment that makes the neck sound and feel much older.

  The 12" to 16" compound radius caramelized flame maple fingerboard spans two octaves with 24 extra jumbo stainless steel frets, ebony-bordered maple dot inlays, and Luminlay side dots that emit light for dark stages. The headstock is a licensed Fender Stratocaster shape, with a bone nut measuring 1.6875".

  Electronics include three specially wound Charvel Custom MF pickups in an HSH configuration (Custom MF Humbuckers at bridge and neck, Custom MF Single-Coil in the middle), controlled by volume and tone, a 5-position blade switch, and a 2-way mini-toggle that engages single-coil simulation in the bridge and neck humbucker positions. Two Luminlay numbered dome knobs handle volume and tone.

  Hardware includes a U.S.-made recessed Charvel locking tremolo bridge with Tremol-No unit and oversized brass block, Gotoh MG-T locking tuning machines, chrome finish throughout, a side-mount oval output jack, and brass control-position marker inlays in the body. The guitar ships with a Charvel hardshell case and truss rod wrench; an optional gig bag is available.
