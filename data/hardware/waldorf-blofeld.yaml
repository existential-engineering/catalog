name: Blofeld
manufacturer: waldorf
primaryCategory: synthesizer
categories:
  - digital
description: >-
  The Blofeld is a compact, affordable wavetable synthesizer from Waldorf Music, released
  in 2007, that helped revive the company from near extinction. It offers a sophisticated
  digital synthesis engine with three oscillators per voice, 68 wavetables inherited from
  classic Waldorf instruments, and dual multi-mode filters. Available as both a desktop
  module and a 49-key keyboard version, it delivers complex metallic and digital timbres
  suited to a wide range of electronic music production.
details: |-
  The Blofeld represents an evolution of Waldorf's wavetable synthesis lineage, building upon earlier models including the Q, Micro Q, Microwave II, and the classic PPG Wave. Its architecture incorporates three oscillators per voice with both analog-modeled waveforms and advanced wavetable functionality. Users can load custom wavetables via third-party software, significantly expanding sonic possibilities beyond the built-in 68 wavetables sourced from previous Waldorf instruments.

  The synthesis engine supports oscillator syncing, ring modulation, and frequency modulation between oscillators and filters. The dual multi-mode filters, configurable in series or parallel, provide 2-pole or 4-pole lowpass, bandpass, highpass, notch, and comb filtering options. A powerful 16-slot modulation matrix enables complex control routing, supplemented by three LFOs and four customizable envelopes.

  The keyboard version includes sample RAM functionality, available as an option on the desktop module, allowing oscillators to operate as sampler sources. An extensive 16-step programmable arpeggiator compensates for the absence of an internal sequencer. Sonically, the instrument gravitates toward metallic digital timbres and overdriven electric textures, though its deep programming engine can approximate nearly any sound through careful parameter manipulation.
specs: |-
  - 3 oscillators per voice with classic waveforms and 68 digital 16-bit wavetables
  - 2 multi-mode filters per voice (lowpass, highpass, bandpass, notch, comb; 12/24 dB/oct)
  - Up to 25 voices of polyphony (varies with patch complexity)
  - 16-part multitimbral
  - 3 LFOs per voice
  - 4 envelopes per voice (ADSR, AD1-S1-D2-S2-R, one-shot, loopable modes)
  - 16-slot modulation matrix
  - 2 effect units (chorus, flanger, phaser, overdrive, decimator, delay, reverb)
  - Programmable arpeggiator with up to 16 steps, swing, glide, accent, and note length
  - 1,024 sound presets, 128 multi sets
  - Optional sampler: 44.1kHz mono, 60MB RAM
  - MIDI IN (MIDI OUT on keyboard version)
  - Stereo output and headphone output
  - Keyboard version: 49 keys with velocity and aftertouch, pitch and mod wheels
releaseDate: "2007"
