description: "The perfect solution for mastering, recording and project studios,
  film-scoring, post-production and live sound."
details: |-
  For over a decade, Antelope's legendary OCX Master Clock has been a dominant force in the audio world. The OCX HD raises the bar yet again, delivering sample rate support of up to 768 kHz, Antelope's best-in-class 4th generation Acoustically Focused Clocking (AFC) jitter management algorithm and oven-controlled crystal oscillator.

  OCX HD Master Clock offers a great variety of clocking options - 10 configurable in pairs Word Clock Outputs on BNC, four AES/EBU Outputs and two more on S/PDIF. This vast assortment of connectivity makes the OCX HD the most versatile audio master clock on the market, while proven, proprietary clocking technology delivers the most musical and reliable audio sync generation on the market.

  All that you love about Antelope's cult Trinity Master Clock now in just 1U. OCX HD offers two Word Clock Inputs and a Video Sync Input, which can resolve to a huge variety of SD and HD formats, as well as clock distribution with gear-boxing, and pull-up and pull-down rates, as featured in the triple clock powerhouse, Trinity Master Clock. A 10 MHz Input allows for syncing with Antelope's newest Atomic Clock - 10MX.

  Access all OCX HD features via Antelope Audio's flexible software control panel. The desktop app provides convenient remote control to simplify project workflow. The device is also easily configurable from an elegant front panel, which will add a futuristic aesthetic to any gear rack.
specs: |-
  - 768 kHz HD Master Clock
  - 4th generation Acoustically Focused Clocking (AFC) jitter management algorithm
  - 64-bit DDS
  - Oven Controlled Crystal Oscillator
  - Sample Rates: 32, 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384, 705.6, 768 kHz
  - 10x Word Clock Outputs on BNC (up to 768 kHz), configurable in pairs
  - 4x AES/EBU Outputs (up to 192 kHz)
  - 2x S/PDIF Outputs (up to 192 kHz)
  - 2x Word Clock Inputs (up to 768 kHz)
  - 1x Video Sync Input (wide range of SD and HD video signals)
  - 1x 10MHz Atomic Clock Input @ 75 Ohms 3Vpp on BNC
  - 1x AES/EBU Input (up to 192 kHz)
  - 2x S/PDIF Inputs (up to 192 kHz)
  - 1x USB Input for control
  - Clock distribution with gear-boxing, pull-up and pull-down rates
  - Clock Calibration: < +/-0.001 ppm
  - Clock Stability: < +/-0.02 ppm, oven controlled at 64.5 C / 148.1 F
  - Clock Aging: < 1 ppm per year
  - Operating Temperature: 0 - 50 C / 32 - 122 F
  - Humidity: 30 - 80% RH, non-condensing
  - Power Supply: AC Universal Input ~95-245V, 20 Watts Max
  - Dimensions: 482.6 (W) x 230 (D) x 44 (H) mm / 19 x 9.05 x 1.75 inches
  - Weight: 2.65 kg / 5.84 lb
  - 1U rack-mount chassis
  - Software control panel for macOS and Windows
