description: The Academy 22e is a Grand Concert acoustic-electric from Taylor's
  Academy Series, featuring a solid walnut top, layered walnut back and sides,
  integrated walnut armrest bevel, and ES-B electronics with built-in chromatic
  tuner.
details: |-
  The Academy 22e is a compact Grand Concert acoustic-electric built for beginners. The solid walnut top with layered walnut back and sides delivers warm, focused tones, while the integrated walnut armrest bevel and narrow body depth make extended playing more comfortable. The Hard Rock Maple neck with Taylor's signature design reduces hand fatigue.

  ES-B electronics with a built-in digital chromatic tuner make the guitar immediately stage-ready. The 24-7/8" scale length and Grand Concert body contribute slightly reduced string tension for developing players. West African Crelicam Ebony fretboard and bridge provide a smooth playing surface.

  Matte finish throughout, die-cast chrome tuners, and Nubone nut with Micarta saddle. Ships with a padded gig bag.
specs: |-
  - - Body shape: Grand Concert
  - Top: Walnut (solid, matte)
  - Back/sides: Walnut (layered, matte)
  - Neck: Hard Rock Maple (matte)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Armrest: Walnut bevel
  - Scale length: 24-7/8"
  - Inlays: 4mm dots (Italian Acrylic)
  - Tuners: Die-Cast Chrome
  - Electronics: ES-B with built-in digital chromatic tuner
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Padded gig bag included
