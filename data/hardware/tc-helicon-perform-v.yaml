description: Mic-stand mounted vocal processor with two voices of harmony keyed
  from a connected instrument or backing track, Adaptive Tone, reverb, doubling,
  echo and HardTune. The rear panel carries an XLR microphone input with phantom
  power, an XLR mic output, aux in, USB and a pedal jack.
details: |-
  Perform-V is a vocal processor that clamps to a microphone stand so its controls stay within reach of the singer rather than at their feet. Three knobs and a ring of lit buttons cover the whole feature set, and the enclosure is small enough to sit below eye level.

  Two voices of harmony follow the song being played. A guitar, a phone or a backing track fed to the aux input sets the key, and the harmony parts track the material bar by bar. Adaptive Tone reads the voice and the microphone in use and sweeps EQ, compression, de-essing and gating so the vocal sits the same way across a full set.

  Reverb, a doubler, echo, megaphone and HardTune pitch correction each sit on their own button, with three preset slots for recalling a combination. A Talk button drops the effects for speech between songs, and an anti-feedback control works on the vocal channel.

  Connections sit on the rear panel: an XLR microphone input with switchable 48V phantom power, an XLR mic output to the house, USB for recording to a computer, a 1/8-inch aux input for playback and a 1/4-inch pedal jack. A 1/8-inch headphone output on the front edge carries a private monitor mix for practice.
specs: |-
  - Two-part harmony with the key set from a connected instrument, phone or backing track
  - Adaptive Tone sweeps EQ, compression, de-essing and gating automatically
  - Reverb, doubler, echo, megaphone and HardTune effects on dedicated buttons
  - Three preset buttons
  - Anti-feedback and Talk controls on the top panel
  - XLR microphone input with switchable 48V phantom power
  - Mic-stand mount
  - External DC power supply
