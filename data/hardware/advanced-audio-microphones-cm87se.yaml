details: |-
  THE CM87 HAS BEEN REPLACED BY THE CM87SE

  THE CM87SE will sell for $465 USD

  CM87SE

  The CM87 is a large-diaphragm, 3-pattern, dual back-plate, fet condenser microphone that features a dual diaphragm capsule with 6-micron diaphragms. It incorporates a Class "A" dual stage fet/discrete transformer coupled amplifier design with high quality through-hole components. It is well suited for a variety of recording applications such as vocals or instruments in any studio or live application. It can handle extreme sound pressure levels with ease. The CM87 is built to a very high standard and offers a remarkably full yet well-defined and ultra-clean sound that is perfectly suited to the most demanding radio, dialogue and recording tasks. Its pickup pattern can be configured in omni, cardioid, or Fig-8. The CM87 has at least 10db more headroom than the venerable U87 circuit while retaining the same sonic response and reliability. The CM87 excels as an affordable replacement for the expensive U87. Recently, Sirius Satellite XM in Nashville bought over 2 dozen -CM87 microphones for their On Air Studios. Warner Brothers and Marvel Comics also use CM87 microphones to capsule vocals from voice actors on many animation series. Specifications:
specs: |-
  - 35mm capsule with dual 6-micron skinned center-fed diaphragms
  - Capsule polarized at a maximum of 60v in Cardiod
  - High quality dual bobbin custom transformer with bi-metal laminations
  - Class "A" fet/discrete transformer-coupled circuit.
  - 3 pickup patterns via a toggle switch on body. Omni, Card & Fig 8.
  - maximum output level > +10dbu
  - 100hz roll-off, switched from the body
  - -10db pad, switched from the body
  - Noise: <12dB (A-weighted)
  - Distortion: 0.5% @ 126dB, and 0.5% at 136dB with -10dB pad engaged
  - Impedance: <200 ohms (load impedance<1.2K)
  - 48V requirement
  - Robust shock mount
  - Aluminum road case
