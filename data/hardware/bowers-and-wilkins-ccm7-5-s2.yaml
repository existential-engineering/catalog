details: |-
  Designed for down-firing, in-ceiling use, CCM7.5 S2 can be used as the left, centre, right and rear-channel rear speakers in a discreet home cinema system.

  Its configuration includes a 25mm (1in) Carbon Dome tweeter and a 180mm (7in) Continuum cone mid/bass cone angled to the mounting surface, allowing for easy direction of the whole array towards the listener to ensure they hear the correct balance of sound. That way, dialogue is crystal clear and special effects come across accurately.

  Thanks to Bowers & Wilkins unique QuickDogs fixing method, installation is simple and if preferred, the supplied round grille can be replaced with an optional, square grille (GR68SQ).

  CCM7.5 S2 is part of the Reference Series of in-wall and in-ceiling speakers, and is supported by the PMK C8 pre-mount kit and the BB 6C back box.
specs: |-
  - Description: 2-way in-ceiling system
  - Technical features: Carbon Dome tweeter, Continuum mid/bass
  - Drive units: 1x ø25mm (1in) Carbon Dome high-frequency
  - Drive units: 1x ø180mm (7in) Continuum cone mid/bass
  - Frequency range (-6dB): 25Hz – 33kHz
  - Frequency response: 32Hz – 28kHz ±3dB (-3dB)
  - Sensitivity: 90dB SPL (2.83Vrms, 1m)
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <1% 70Hz – 33kHz, <0.5% 100Hz – 28kHz
  - Nominal impedance: 8Ω (minimum 4.8Ω)
  - Recommended amplifier power: 25W – 150W into 8Ω on unclipped programme
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 254mm (10in)
  - Depth behind surface: 128mm (5in)
  - Protrusion: 8.5mm (0.33in)
  - Pre-mount kit: PMK C8
  - Back box: BB 6C
  - Square grille option: GR68SQ
  - Net weight: 3.1kg (6.83lb)
  - Finishes: Grille White
