description: Designed for down-firing, in-ceiling use, CCM7.5 S2 can be used as
  the left, centre, right and rear-channel rear speakers in a discreet home
  cinema system. It features a 25mm (1in) Carbon Dome tweeter and a 180mm (7in)
  Continuum cone mid/bass cone angled to the mounting surface to ensure you hear
  the correct balance of sound.
details: |-
  CCM7.5 S2 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Reference Series, pairing a 180mm (7in) Continuum cone mid/bass driver with a 25mm (1in) Carbon Dome tweeter. It is a passive design with no on-board amplifier and no mains connection, driven from an external amplifier over ordinary speaker cable.

  The speaker is designed for down-firing installation, and Bowers & Wilkins positions it as usable for the left, centre, right and rear channels of a discreet home cinema system. Both drive units are angled to the mounting surface rather than firing straight down, so the whole array can be aimed at the seating position and the listener hears the intended tonal balance, with dialogue clear and effects placed accurately.

  The Continuum cone is Bowers & Wilkins' own woven mid/bass material, fitted here with an anti-resonance plug, and the Carbon Dome tweeter is the Reference Series high-frequency unit. Measured harmonic distortion is quoted below 1% from 70Hz to 33kHz and below 0.5% from 100Hz to 28kHz at 90dB, 1m.

  Installation uses the Bowers & Wilkins QuickDogs fixing method. The speaker needs a 254mm (10in) round cut-out and 128mm (5in) of clear depth behind the ceiling surface, and protrudes 8.5mm (0.33in). A round grille is supplied and an optional square grille (GR68SQ) can be fitted in its place; a PMK C8 pre-mount kit and a BB 6C back box are offered for new-build installations.
specs: |-
  - Description: 2-way in-ceiling system
  - Technical features: Carbon Dome tweeter, Continuum mid/bass
  - Drive units: 1x 25mm (1in) Carbon Dome high-frequency, 1x 180mm (7in) Continuum cone mid/bass
  - Frequency range (-6dB): 25Hz to 33kHz
  - Frequency response (-3dB): 32Hz to 28kHz +/-3dB
  - Sensitivity: 90dB SPL (2.83Vrms, 1m)
  - Harmonic distortion, 2nd and 3rd harmonics (90dB, 1m): less than 1% from 70Hz to 33kHz, less than 0.5% from 100Hz to 28kHz
  - Nominal impedance: 8 ohms (minimum 4.8 ohms)
  - Recommended amplifier power: 25W to 150W into 8 ohms on unclipped programme
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 254mm (10in)
  - Depth behind surface: 128mm (5in)
  - Protrusion: 8.5mm (0.33in)
  - Net weight: 3.1kg (6.83 lb)
  - Drive units angled to the mounting surface for down-firing installation
  - QuickDogs fixing method
  - Pre-mount kit: PMK C8
  - Back box: BB 6C
  - Optional square grille: GR68SQ (replaces the supplied round grille)
  - Passive two-way in-ceiling speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: Grille White
