description: A 2-channel Thunderbolt audio converter for Mac, lightweight and
  bus-powered, recording and playing back at up to 24-bit/192 kHz with every
  parameter controlled from a single large rotary knob.
details: |-
  The TAC-2 is a 2-in/2-out Thunderbolt audio interface for Thunderbolt-equipped Macintosh computers, running at up to 24-bit/192 kHz with ultra-low latency audio streaming. It is lightweight and portable but built ruggedly enough for the road, and a single large rotary knob controls every parameter.

  Two combo balanced XLR/TRS input connectors sit on the rear with +48V phantom power available for each, driven by Burr Brown mic preamps offering up to +60 dB of amplification. A separate Hi-Z 1/4-inch input jack on the front takes an electric guitar or bass directly, and 7-position LED metering covers input, output and headphone volume.

  Two balanced TRS output jacks connect to amplifiers or self-powered speakers, and a dedicated headphone jack with independent level control sits beside the Hi-Z input on the front panel.

  Conversion uses a Burr Brown PCM4202 analog-to-digital converter and an AKM AK4396 digital-to-analog converter with 4x upsampling in both directions for reduced noise and higher fidelity, and the asynchronous transfer system is unaffected by computer jitter. The unit draws its power over Thunderbolt bus power, so no AC connection is required.

  The TAC-2 is Mac only, supported on macOS 10.14 to 13 on Intel Macs, with a Zoom driver and the TAC-2 MixEfx application published on its support page.
specs: |-
  - 2-in/2-out Thunderbolt audio interface, 2 recording and 2 playback channels, Mac only
  - Sampling frequencies: 192 / 176.4 / 96 / 88.2 / 48 / 44.1 kHz, 24-bit
  - Inputs 1/2: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain 0 and 9 to 60 dB in 3 dB steps
  - Inputs 1/2: input impedance 3 kOhm, max input level +12 dBu at 0 dBFS, +48V phantom power
  - Hi-Z (Input 1): 1/4-inch phone jack, input impedance 1 MOhm, max input level +10 dBu at 0 dBFS
  - L/R output: 1/4-inch TRS phone jacks (balanced), max output level +15 dBu at 0 dBFS, output impedance 100 Ohm
  - Phones: 1/4-inch stereo phone jack, 20 mW + 20 mW into 32 Ohm, output impedance 30 Ohm
  - A/D and D/A conversion: 4x upsampling, Burr Brown PCM4202 (A/D) and AKM AK4396 (D/A)
  - Frequency response: -2.0 dB, 20 Hz to 50 kHz at 192 kHz. -1.0 dB, 20 Hz to 34 kHz at 96 kHz. -0.4 dB, 20 Hz to 20 kHz at 44.1 kHz
  - Dynamic range: A/D 118 dB typical (IHF-A), D/A 120 dB typical (IHF-A)
  - S/N ratio EIN: 125 dB (IHF-A) at 60 dB gain, 150 Ohm input
  - 7-position LED metering for input, output and headphone volume
  - Interface: Thunderbolt. Power: Thunderbolt bus power, no AC power required
  - Dimensions: 129.5 mm (D) x 120.0 mm (W) x 51.3 mm (H), weight 420 g
  - Works with Thunderbolt-equipped Macintosh computers running macOS 10.14 to 13 (Intel Mac only)
