description: >-
  The Ensoniq ASR-X is a tabletop sampler and sequencer workstation with
  pressure-sensitive pads and Transwave synthesis, designed as an alternative to
  the Akai MPC series for beat-driven production.
details: |-
  The ASR-X combines sampling, synthesis, sequencing, and effects processing in a compact tabletop unit, positioning itself as a direct competitor to the Akai MPC line. Its 13 velocity-sensitive trigger pads form the centerpiece of the workflow, enabling real-time pattern creation and step-by-step programming for drum sounds, percussion, vocal samples, and short audio clips.

  The sampler captures stereo audio at 44.1kHz with 20-bit A/D and 18-bit D/A conversion to 2MB of standard RAM, providing approximately 20 seconds of maximum sample time. Beyond sampling, the built-in synthesizer uses Ensoniq's Transwave technology to generate distinctive synth tones and realistic instrument emulations. Resonant lowpass, highpass, and bandpass filters shape the sound, while a dual-processor effects unit handles processing for both samples and synthesized sounds.

  The sequencer sits at the heart of the ASR-X experience, designed around the pressure-sensitive pads for intuitive beat creation. Early firmware versions had notable bugs that were addressed through OS updates. The original ASR-X was later succeeded by the ASR-X Pro, which added enhanced expandability. Both models found a strong following in hip-hop and rap production, where the pad-based workflow and Transwave synthesis offered a distinctive alternative to competing hardware.
specs: |-
  - Polyphony: 32 voices
  - Sampler: 44.1kHz; 20-bit A/D, 18-bit D/A, 16-bit memory
  - Sampling: Stereo or mono; max 20.5 seconds
  - Memory: 2MB standard (expandable)
  - Filters: Lowpass, highpass, bandpass (resonant)
  - Effects: 2 effect processors
  - Pads: 13 velocity-sensitive trigger pads
  - Storage: 1.4MB 3.5" micro-floppy disk
  - Control: MIDI
releaseDate: "1997"
releaseDateYearOnly: true
