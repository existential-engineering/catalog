url: https://www.dangerousmusic.com/product/convert-2
description: Eager to develop a new and better DAC, we designed the CONVERT
  series converters from the ground up, utilizing cutting-edge digital
  technology.
details: |-
  Dangerous has been building award-winning, standard-setting converters since 2002 when the Dangerous Monitor's onboard digital-to-analog converter (DAC) swiftly became the industry reference. The CONVERT series was designed from the ground up, coupled to a Chris Muth designed analog circuit that delivers the Dangerous signature sound: open, articulate and powerful from top to bottom.

  A legend among mixing and mastering engineers for decades, Chris Muth designed the audiophile-grade analog audio path and meticulously fine-tuned the low-pass reconstruction filters that are mandatory to implementing any DAC.

  Digital guru Paul Messick rigorously refined the CONVERT-2's JetPLL ultra-low jitter clocking technology until it surpassed the JET's stated specs, resulting in virtual elimination of jitter throughout the audio band and beyond.

  The front panel offers a rich feature set: dedicated volume control with hard-bypass, instant input calibration at industry-standard reference levels, automatic sample rate detection, on-the-fly input switching among five digital inputs, USB Uplink routing of AES/SPDIF-2 back into the DAW, custom peak-over-average metering, and word clock output allowing the unit to serve as studio master clock.
specs: |-
  - Signal to Noise Ratio, A-weighted, 20Hz-20kHz: < 114dB
  - Dynamic Range, A-weighted, 20Hz-20kHz: < 114dB
  - THD+N, 1kHz, unweighted, +4dBu out: < 94.5dB (0.00188%)
  - Frequency Response @ 96kHz sample rate: DC to 20kHz +0/-0.25dB
  - Jitter: 16ps (100Hz-40kHz), 18ps (100Hz-1MHz)
  - Crosstalk rejection: > 114dBu @ 1kHz
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192kHz plus Auto detection mode
  - Calibration reference levels: -14, -16, -18dBFS, selectable on the fly
  - Word Clock modes: Normal, External, Master
  - Power: 100-240VAC, 47-63Hz, auto-switching
