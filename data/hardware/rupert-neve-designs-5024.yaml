name: Portico II 5024 Quad Mic Pre
manufacturer: rupert-neve-designs
primaryCategory: preamp
categories:
  - outboard
  - rack-mount
  - discontinued
url: https://rupertneve.com/products/5024
description: The Portico II 5024 is a four-channel microphone preamplifier
  featuring 72dB of gain, custom transformers, and Rupert Neve's Silk circuit
  for vintage-style harmonic saturation. Channels 1 and 2 include
  transformer-isolated high-impedance DI inputs with parallel THRU outputs,
  while channels 3 and 4 include a built-in Mid-Side (M/S) decoder, combining
  four channels of legendary front-end tone into a single 1U enclosure.
details: |-
  Four channels of legendary front-end tone in a single 1U rack space.

  Each channel provides 72dB of gain, individually selectable polarity reverse, mute, phantom power, a selectable high-pass filter (30Hz or 90Hz), custom Rupert Neve-designed transformers, and the Silk circuit for harmonic coloration. The Silk circuit reduces negative feedback across the output transformer and adjusts its frequency response, providing the sweet, musical saturation found in Rupert's legendary vintage designs.

  Channels 1 and 2 add transformer-isolated high-impedance DI inputs (with ground lift) and parallel THRU outputs for re-amping or feeding an external amplifier. Channels 3 and 4 add a built-in Mid-Side (M/S) decoder, enabling stereo recording without external devices.

  This product is discontinued.
specs: |-
  - Frequency response: -0.2 dB @ 10 Hz, -3 dB @ 160 kHz
  - Gain: 0 to 66 dB in 6 dB steps via 12-way rotary switch
  - Trim: ±6 dB continuously variable
  - Equivalent Input Noise: better than -128 dBu
  - THD+N @ 1 kHz, +20 dBu: better than 0.001%
  - Maximum output level: +26 dBu (20 Hz to 40 kHz)
  - High-pass filter: 12 dB/Octave Bessel, selectable 30 Hz or 90 Hz
  - Phantom power: +48 V DC ±1%
  - Power: 100-240 VAC, 50/60 Hz, 0.5 A (3-pin IEC)
  - Form factor: 1U rackmount
