description: A 2hp Eurorack module with three manual push-button gate
  generators, each outputting a 5v gate signal, available in latching or
  momentary switch action.
details: |-
  Bartender? The power of gate signals at the touch of a button, please - but make mine a narrow one! You already know what this is: it's a gate signal generator, and it generates gate signals. That's all there is to it. You press the button, the LED indicator lights up, and you get a 5v gate signal! Brilliant! Did I mention you get three? In just 2hp! That's 1½ gate signal generators per hp! That's more than [competing product] from [competing brand]! You knew you made a good decision when you decided to look at this product. All that remains now is to open your heart, and your wallet. Buy my gate generator - it's available in a latching model (stays on or off after pressing) and a momentary model (is normally off, and temporarily on when you press it). You should definitely get both, if you know what's good for you. In fact, it also works really well with the Quad Gate to Trigger Converter, also from Herzlich Labs - now you can generate both gates and triggers with ease! And in such little hp! Oh, one more thing? Your friends are going to be very envious of this, when you show it off. Gold plated nuts, gold plated front panel, tastefully matte indicator LEDs, pleasantly tactile buttons, black hardware. All the details have received our closest care and attention, so you'll certainly wow your friends (and potential lovers) at future modular luncheons. That's all there is to say about the Micro Gate. I think you know as much as I do now. If you're still reading you should consider heading over to www.herzlichlabs.com to see what the deal is with this brand. Did I mention you get a free sticker with purchase? You do. Why are you still reading. Have I not done enough to convince you? What more do you want? It's a gate generator, it's not that complicated, you need this and that's that. Go! Buy!
