description: >-
  The Yamaha DX100 is a compact, portable FM synthesizer featuring four-operator
  digital synthesis with 192 preset and 24 user patches, known especially for
  its excellent analog-style bass sound.
details: |-
  Released in 1985, the DX100 was Yamaha's budget entry in the DX family of FM synthesizers. Like
  all instruments in the series, it employs frequency modulation synthesis to generate its sounds,
  using a four-operator architecture that trades some of the complexity of the six-operator DX7
  for greater affordability and portability.

  Despite its budget positioning, the DX100 earned a devoted following thanks in large part to its
  first preset patch, a punchy analog-style bass sound that became a staple in techno, house,
  jungle, and acid music. The instrument ships with 192 preset patches and 24 user-programmable
  slots, offering a broad palette of FM tones out of the box.

  The 49-key mini keyboard with velocity and aftertouch response provides expressive control in a
  compact form factor, making the DX100 appealing for both studio work and live performance.
  Eight-note polyphony handles most playing situations adequately, though the lack of any onboard
  filter or effects means the raw FM engine must do all the tonal heavy lifting.

  MIDI connectivity with velocity and aftertouch transmission ensures the DX100 can serve as both
  a sound source and a controller in larger setups. Its small size, light weight, and distinctive
  sonic character have kept it relevant as an affordable entry point into classic FM synthesis.
specs: |-
  - Polyphony: 8 voices
  - Synthesis: 4-operator FM
  - Timbral: Monotimbral
  - Filter: None
  - Effects: None
  - Memory: 192 preset, 24 user patches
  - Keyboard: 49 mini keys (velocity and aftertouch)
  - MIDI: Yes (velocity and aftertouch)
