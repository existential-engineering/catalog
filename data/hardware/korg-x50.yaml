description: >-
  The Korg X50 is a lightweight 61-key digital synthesizer released in 2007,
  based on the Triton's Hyper Integrated (HI) synthesis engine. It offers
  62-voice polyphony, 64 MB of PCM ROM with 470 multisamples and 518 drum
  samples, and 512 sound programs at an entry-level price point. Designed for
  portability and affordability, it brings Triton-quality sounds to
  budget-conscious musicians.
details: |-
  Released in 2007 alongside the MicroX, the Korg X50 brought the Triton's Hyper Integrated synthesis system to the budget end of the market. With 512 sound programs drawn from 470 multi-samples and 518 drum samples stored in 64 MB of PCM ROM, it offered a substantial sound library for its price class.

  The synthesis engine provides 62-voice polyphony in single mode or 31 voices in double mode, with two oscillators per voice. Filter options include both 12dB and 24dB slopes in high-pass and low-pass configurations with resonance. Two LFOs with sample and hold, saw, and sine waveforms plus two ADSR envelopes handle modulation and amplitude shaping.

  Four effects processors run simultaneously, covering insert effects, two master effects, and a master EQ drawn from 89 effect types. A dual polyphonic arpeggiator adds rhythmic and melodic patterns. Sixteen-part multitimbrality allows complex layered and split configurations for live performance.

  The X50 prioritizes portability and accessibility over build quality. Its 61 velocity-sensitive keys lack aftertouch and resistance, and the plastic construction has drawn criticism for durability. However, the sound quality punches well above its weight class thanks to the proven Triton engine underneath. MIDI and USB connectivity provide flexible integration with external gear and computers.
specs: |-
  - Polyphony: 62 voices (single), 31 voices (double)
  - Oscillators: 2 per voice
  - PCM ROM: 64 MB (470 multi-samples, 518 drum samples)
  - Programs: 512
  - Multitimbral: 16 parts
  - Filter: 12dB/24dB slope, high-pass/low-pass with resonance
  - LFOs: 2 (sample & hold, saw, sine)
  - Envelopes: 2 ADSR
  - Effects: 89 types across 4 processors (insert, 2 master, master EQ)
  - Arpeggiator: Dual polyphonic
  - Keyboard: 61 keys, velocity-sensitive (no aftertouch)
  - Audio Outputs: 4 channels (2 main, 2 individual)
  - Connectivity: MIDI In/Out, USB
