description: A single-knob analog phaser pedal reissuing the original 1974
  circuit unchanged, offering classic 70's-era phasing effects with buffered
  JFET bypass switching.
details: |-
  With its single knob, the PT999 Phase Tone looks deceptively simple. Yet packed into this tiny blue box is a host of the most authentic 70's-era phasing effects available in a current production unit. The secret behind the PT999's timeless tone lies in the fact that its circuit is exactly the same as it was when first introduced in 1974. While many "reissue" effects are far from true to the original designs, Maxon has taken great pains to keep the Phase Tone unchanged for close to 45 years. By adjusting the lone Rate control, a wide variety of expressive phasing nuances can be coaxed from the PT999 - all of them whisper quiet and amazingly transparent. Its minimalist circuit doesn't get in the way of your guitar tone – it simply accentuates it, working equally well to spice up clean or distorted sounds. If you demand classic phase shifting effects without compromising your guitar's signature tone, the PT999 Phase Tone has no equals. The PT999 is the easiest way to replicate classic 70's phasing tones without dropping $300-500 (or more!) for a vintage Phase 90. TECH TALK:

  The PT999's four-stage phasing circuit offers 720 degrees of phasing sweep variable from .2 to 14 Hz (cycles per second). The PT999's FET's (Toshiba #2SK246) are carefully sorted and matched by hand to produce the smoothest phasing sweep possible with low noise. Unlike some phasers, the PT999 runs negative feedback of the signal to each phase-shifting FET for less signal distortion. The four-pole shift of the PT999 creates a chewy, organic phase with a subtle drive to the signal. The 4 phasing Op Amps work together to emphasize this phase point, as each successive one accentuates the notch of the previous, creating a very resonant effect. The subtle drive and resonance really bring out pick attack and add a degree of real, dirty dimensionality. Internal trimmers adjust center frequency and width of the phasing sweep (factory calibrated, we recommend adjustment of these trimmers be left to a qualified technician). The PT999 features buffered, JFET bypass switching with a low impedance output, allowing it to drive long cable lengths or other effect units without loss of signal. Input Impedance : 500K Ohms

