details: |-
  The KILT V1, STUG is a discontinued pedal from JHS's collaboration with Stu G (legendary guitarist, writer, producer, and founding member of UK band Delirious). It features a larger enclosure than the V2 with two footswitches, an independent boost on the right side, four knobs and four toggles. Based on the Expandora-style circuit.
