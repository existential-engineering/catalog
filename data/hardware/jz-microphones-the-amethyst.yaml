details: |-
  The Amethyst is a premium class large-diaphragm condenser microphone featuring JZ's Golden Drop Technology capsule and a Class A discrete amplifier circuit, tuned for a full, rich vintage tone that sits in the mix without additional EQ.

  It uses a handcrafted 1" pressure-gradient electrostatic capsule with a fixed cardioid pattern and extremely low self-noise.
