description: >-
  One of the first keyboard samplers ever produced, featuring 88 weighted keys,
  16-bit sampling, a 12-track sequencer, and an extensive ROM sound library that
  set new standards for realistic instrument emulation.
details: |-
  The Kurzweil K250 was one of the pioneering keyboard samplers when it debuted in 1984, establishing a new benchmark for realistic sampled instrument sounds. Its 88 weighted keys with velocity sensitivity and split zones made it a serious performance instrument, while 16-bit sampling at adjustable rates from 5 kHz to 50 kHz provided between 10 and 100 seconds of sampling time depending on the quality setting.

  The onboard sound library was remarkably comprehensive for its era, with 36 ROM sounds, 96 acoustic instrument samples, and 341 presets covering a wide range of orchestral, keyboard, and percussion timbres. A built-in 12-track sequencer capable of storing over 12,000 notes across 40 songs added workstation-like functionality. Two effects processors and chorus rounding out the feature set.

  While the K250 had limitations typical of early samplers, including the restriction of storing samples only on Apple Macintosh disks, its sound quality attracted high-profile users including Stevie Wonder, Vangelis, Kitaro, and John Carpenter. Production continued until 1990, when it was succeeded by the K2000 series. The K250's combination of playability and sonic realism made it a landmark instrument in sampling history.
specs: |-
  - Polyphony: 12 voices
  - Sampling: 16-bit, 1-4 MB (5-50 kHz adjustable rate)
  - Sequencer: 12 tracks, 12,012 notes, 40 songs
  - Effects: 2 processors, chorus
  - Keyboard: 88 weighted keys with velocity and split zones
  - Memory: 36 ROM sounds, 96 instruments, 341 presets
  - Control: MIDI
