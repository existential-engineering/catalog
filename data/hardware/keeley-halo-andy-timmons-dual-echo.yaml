description: A true-stereo dual delay developed with Andy Timmons, carrying his
  modulated Halo echo plus four further delay rhythms, up to 1500 ms of delay
  time, eight presets, tap tempo and infinite hold.
details: |-
  The HALO is built around Andy Timmons' Halo effect, a modulated dual echo he developed over several decades. The repeats move rhythmically, approaching reverb diffusion, and are held together by tape-style modulation, saturation and compression. The pedal ships loaded with that signature delay tone, and further settings can be programmed and stored as presets.

  Alongside the Halo voicing, the Rhythm control selects four more delay types: quarter note, dotted eighth, a stereo rack-mount analog delay and a vintage multi-head tape echo. A Saturate control adds tape compression texture, while Tone, high-pass filter and shelving filter controls shape the delay and its balance against the dry signal. With Time and Feedback set low the delay produces ambient chorus and flanger effects. Run in stereo the pedal gives true-stereo imaging.

  The two sides, A and B, work as two delay pedals in tandem, each with its own settings and up to 1500 ms of delay, switched by foot. Keeley's Smart Stomp System puts tap tempo on a press and hold of either stomp switch, and infinite repeat or hold on a press and hold of the alternate switch. Each preset bank stores two delay settings, for eight user-storable effects in total. A status light shows when a knob has been moved away from the stored setting. Processing is handled by a DREAM multi-core DSP, bypass is switchable between true bypass and trails, and remote switching and programmable expression pedal control are supported.
