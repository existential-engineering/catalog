details: |-
  Platinum4 is part of the Grado Timbre Series, offering a balanced and accessible entry into Grado's wood body cartridge designs. Built on decades of cartridge development, it delivers clarity, stability, and musicality while maintaining the tonal character that defines Grado cartridges.

  Utilizing Grado's moving iron design, Platinum provides a consistent and reliable signal with low moving mass and long-term performance.

  Offered in both stereo and mono configurations, Platinum continues the tradition of Grado's wood body cartridges.
