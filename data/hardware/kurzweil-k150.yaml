description: >-
  The Kurzweil K150 is a rack-mount additive synthesizer offering 240 oscillators and 16-voice
  polyphony, capable of manipulating sounds at the harmonic level for unique timbral creation.
details: |-
  Released in 1986, the K150 was a genuinely unique instrument in Kurzweil's lineup. Rather than relying on sample playback, it implemented real-time additive synthesis with up to 240 sine and noise oscillators, allowing users to build and sculpt sounds at the individual harmonic level. This approach gave it creative potential far beyond typical digital synths of the era.

  The K150's editing method was distinctive. Users mixed, combined, and altered 22 resident voices and 69 preset programs by manipulating harmonic content directly. The keyboard could be split into three regions with up to seven layers, enabling thick and complex textures. A digitally controlled filter and 256-stage DCA envelopes provided additional shaping tools.

  An optional Fourier Synthesis upgrade interfaced with an Apple IIe computer running Kurzweil's SOUNDLAB or Sound Modeling Program software, enabling fully custom instrument definition at the harmonic level. This was remarkably forward-thinking for 1986 and represented one of the earliest practical implementations of computer-assisted additive synthesis.

  The K150's sound had a characteristically digital quality, partly due to its anti-aliasing filter rolling off around 9-10 kHz, which could make patches sound somewhat thin. Despite this limitation, the instrument offered a level of timbral programming depth that few contemporaries could match, making it a fascinating piece of synthesis history.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: 240 (sine and noise)
  - LFO: Yes
  - Filter: DCF (Digitally Controlled Filter)
  - Envelopes: 256-stage DCA envelopes
  - Keyboard: None (rackmount module)
  - Memory: 186 patches (expandable to 255)
  - Control: MIDI (16 parts)
