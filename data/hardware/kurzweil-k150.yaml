description: >-
  The Kurzweil K150 is a professional digital additive synthesizer rack module
  featuring 240 sine and noise oscillators with 16-voice polyphony. It allows
  musicians to sculpt sounds at the individual harmonic level, mixing and
  altering 22 resident voices and 69 preset programs to create unique timbres.
  An optional Fourier Synthesis upgrade connected to an Apple IIe computer for
  advanced sound modeling.
details: |-
  Released in 1986, the K150 was a genuinely unique instrument in Kurzweil's lineup. Rather than relying on sample playback, it implemented real-time additive synthesis with up to 240 sine and noise oscillators, allowing users to build and sculpt sounds at the individual harmonic level. This approach gave it creative potential far beyond typical digital synths of the era.

  The K150's editing method was distinctive. Users mixed, combined, and altered 22 resident voices and 69 preset programs by manipulating harmonic content directly. The keyboard could be split into three regions with up to seven layers per region, enabling thick and complex textures. A digitally controlled filter and 256-stage DCA envelopes provided additional shaping tools, and everything was controllable via a full 16-channel MIDI implementation including pitch bending, vibrato, EQ, chorusing, and polyphonic after-pressure.

  An optional Fourier Synthesis upgrade (the K150-FS) interfaced with an Apple IIe computer running Kurzweil's SOUNDLAB or later Sound Modeling Program (S.M.P.) software, enabling fully custom instrument definition at the harmonic level. Users could define new instrument models by editing velocities, envelopes, and tuning intervals. This was remarkably forward-thinking for 1986 and represented one of the earliest practical implementations of computer-assisted additive synthesis.

  The K150's sound had a characteristically digital quality, partly due to its anti-aliasing low-pass filter rolling off around 9-10 kHz rather than offering a user-controllable filter, which could make patches sound somewhat thin. Despite this limitation, the instrument offered a level of timbral programming depth that few contemporaries could match, making it a fascinating and collectible piece of synthesis history.
specs: |-
  - Type: Digital additive synthesizer rack module
  - Polyphony: 16 voices
  - Oscillators: 240 (sine and noise)
  - LFO: Yes
  - Filter: DCF (Digitally Controlled Filter)
  - Envelopes: 256-stage DCA envelopes
  - Keyboard: None (rackmount module)
  - Memory: 186 patches (expandable to 255)
  - Voices: 22 resident voices, 69 preset programs
  - Layers: Up to 7 per region, 3 keyboard regions
  - Control: Full MIDI implementation (16 channels)
  - MIDI Features: Pitch bend, vibrato, EQ, chorusing, polyphonic after-pressure
