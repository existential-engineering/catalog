description: >-
  The Yamaha Portasound PSS-480 is a compact, portable digital synthesizer
  keyboard featuring a 2-operator FM-like synthesis engine. Based on the PSS-470
  architecture, it offers deep sound control through detailed parameter editing,
  accompanied by built-in drum patterns and accompaniment features. Despite its
  budget price point, it delivers surprisingly sophisticated sound design
  possibilities.
details: |-
  The PSS-480 distinguishes itself through its approach to sound synthesis, described as almost a limited 2-operator FM synth with capabilities that produce results distinct from traditional FM synthesis. The instrument prioritizes deep sonic exploration over intuitive programming, rewarding users who invest time experimenting with its architecture. Each of the two operators can be manipulated independently in terms of frequency (adjustable in 1-15 multiples) and feedback depth (0-99 range), enabling substantial tonal variation.

  The synth section employs primitive yet capable digital envelope generators with attack-decay curves, lacking true release control. Despite this limitation, the envelope's decay manipulation allows creation of diverse percussion sounds when paired with external samplers. The polyphonic capacity supports complex textures, though the instrument lacks dedicated monophonic or unison modes.

  Beyond synthesis, the PSS-480 integrates a practical accompaniment system offering bassline and chord accompaniment across various musical styles and patterns. These elements layer effectively with the synth section, creating a big, full synth sound suitable for songwriting or recording applications.
specs: |-
  - 12-voice polyphony
  - 41 mini keys, 4 octaves
  - 2-operator digital FM-like synthesis
  - 2 digital AD (attack-decay) envelopes
  - Parameter-by-parameter sound editing
  - 5 saveable user patches with memory retention
  - Loop sequencer with built-in patterns
  - 99 preset patterns plus 5 user patterns
  - Vibrato and sustain effects
  - MIDI In/Out
  - 1-part multitimbral
