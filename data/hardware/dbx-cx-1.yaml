details: |-
  The dbx CX-1 is a discontinued professional audio signal routing unit from dbx's installed sound product line. Designed to route audio signals flexibly between multiple sources and destinations, it was used in installed, portable, and touring applications.

  Full technical specifications are available in the CX-1 Cut Sheet available from dbx.
