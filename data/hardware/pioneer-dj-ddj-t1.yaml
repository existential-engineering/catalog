description: The DDJ-T1 offers the same operability and layout as our pro-DJ
  equipment, whilst enabling DJs to play music files from the computer via
  dedicated TRAKTOR DDJ-T1 edition software (which is included). DDJ-T1 edition
  1.2.8 users can update to version DDJ-T1 edition 2.0.1 (July 2011) for free. A
  Plug and Play connection via USB and a space for laptop keyboards under the
  controller that places the screen in the DJ’s line of sight at all times, make
  the DDJ-T1 the perfect home or mobile DJ set-up. The controller’s layout
  inherits tried and tested Pioneer functionality , offering excellent
  operability. And the effect area exactly mirrors the software interface,
  delivering the same look and feel. A 115 mm jog wheel, 4-channel deck control
  (with a master/sync button to match song speed and tempo), 6 effects and
  recording help you unlock the full potential of the software at no extra cost.
  Other performance features include loop editing and quantising functions.
  Optimised audio circuitry in the master output area, borrowed from Pioneer
  pro-DJ equipment, ensures high quality sound that has beaten the competition
  hands down in listening tests. This, coupled with audio characteristics
  optimised for TRAKTOR software , ensure superior sound delivery. All buttons
  are pre-assigned to the software functions, and the controller can be
  connected to the computer via USB cable, meaning DJs can truly “Plug and
  Play”. The DDJ-T1 can also be powered by the USB port of a computer.
details: |-
  DJ controller for TRAKTOR. The DDJ-T1 offers the same operability and layout as our pro-DJ equipment, whilst enabling DJs to play music files from the computer via dedicated TRAKTOR DDJ-T1 edition software (which is included). DDJ-T1 edition 1.2.8 users can update to version DDJ-T1 edition 2.0.1 (July 2011) for free. A Plug and Play connection via USB and a space for laptop keyboards under the controller that places the screen in the DJ’s line of sight at all times, make the DDJ-T1 the perfect home or mobile DJ set-up. The controller’s layout inherits tried and tested Pioneer functionality , offering excellent operability. And the effect area exactly mirrors the software interface, delivering the same look and feel. A 115 mm jog wheel, 4-channel deck control (with a master/sync button to match song speed and tempo), 6 effects and recording help you unlock the full potential of the software at no extra cost. Other performance features include loop editing and quantising functions. Optimised audio circuitry in the master output area, borrowed from Pioneer pro-DJ equipment, ensures high quality sound that has beaten the competition hands down in listening tests. This, coupled with audio characteristics optimised for TRAKTOR software , ensure superior sound delivery. All buttons are pre-assigned to the software functions, and the controller can be connected to the computer via USB cable, meaning DJs can truly “Plug and Play”. The DDJ-T1 can also be powered by the USB port of a computer.
