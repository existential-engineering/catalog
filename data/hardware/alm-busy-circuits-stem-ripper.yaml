description: >-
  The Stem Ripper is a compact 6HP 8-channel audio recorder designed for
  immediate full patch recording to a micro SD card as individual tracks in a
  multichannel, date-stamped WAV file.
details: |-
  The Stem Ripper (ALM050) is a 6HP Eurorack module that enables complete patch recording directly to a micro SD card. Each of the 8 audio inputs is captured as an individual track in a multichannel WAV file, making it straightforward to transfer stems to a computer for mixing, editing, or archiving patches.

  The module supports recording at 44.1kHz or 48kHz in both 16-bit and 32-bit float formats. Each input channel features generous 20Vpp headroom with LED clip indication. A battery-backed real-time clock ensures all recordings are automatically date-stamped.

  Two additional stereo mix-down tracks are included in each output WAV file, with user-configurable levels, providing an immediate stereo reference mix alongside the individual stems.

  The module includes a 64GB micro SD card and supports cards up to 1TB. It is skiff-friendly at 32mm depth and features reverse power protection.
specs: |-
  - 6HP width, 32mm depth
  - +12V: 150mA, -12V: 20mA
  - 8 audio inputs (20Vpp headroom each)
  - Records at 44.1kHz or 48kHz, 16-bit or 32-bit float
  - Multichannel WAV with 2 stereo mix-down tracks
  - Micro SD card (up to 1TB; 64GB included)
  - Battery-backed RTC with date stamping
  - Reverse power protection
