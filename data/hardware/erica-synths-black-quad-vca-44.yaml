name: Black Quad VCA
manufacturer: erica-synths
primaryCategory: utility
categories:
  - discontinued
  - modular
  - gain
hp: 10
url: https://www.ericasynths.lv/black-quad-vca-44/
description: Erica Synths Black Quad VCA, despite its compact size, is designed
  in line with the Black Series Hi-Fi philosophy, our custom pre-emphasis –
  de-emphasis circuits preserve all the nuances of the original signal.
details: |-
  The Black Quad VCA shapes sound in advanced ways while saving rack space. Erica Synths introduced a unique automatic mixing of outputs and configurable CV addressing, and if no CV is applied the module performs as a signal mixer as well. Paired with the Erica Synths Black Dual EG/LFO it makes a compact setup.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  Four independent VCAs each take manual signal and CV level adjustment, and custom pre-emphasis and de-emphasis circuits on all four channels preserve the nuances of the original signal.

  CV level spans -10V to +10V, giving -80dB of attenuation at 0V and unity gain at +10V with a logarithmic response. The module occupies 10HP at a depth of 25mm.
specs: |-
  - 4 independent VCAs
  - Manual signal and CV level adjustment
  - Pre-emphasis and de-emphasis circuits on all 4 channels
  - Automatic output mixing
  - Configurable CV addressing
  - CV level -10V to +10V
  - Attenuation -80dB at CV = 0V, 0dB at CV = +10V
  - Logarithmic response
  - Power consumption +62mA, -60mA
  - Module width 10HP
  - Module depth 25mm
