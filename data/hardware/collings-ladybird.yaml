  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Davies Radio
  - Bridge: Indian rosewood
  - Tailpiece: Trapeze
  - Tuners: Kluson (Waverly available)
  - Pickguard: Single-ply tortoise
  - Strings: D'Addario flatwound .011s with wound G
  - Finishes: Antiqued Jet Black, Satin Teal
  - Case: Deluxe hardshell included
