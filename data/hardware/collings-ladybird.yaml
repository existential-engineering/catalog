description: The Ladybird is a fully hollow electric guitar combining
  mid-century soul with modern Collings craftsmanship. Its compact 24 1/8" scale
  length is the shortest in the Collings electric lineup, delivering vintage
  character reminiscent of 1960s single-cut instruments. Available in Antiqued
  Jet Black and Satin Teal finishes, it ships with D'Addario flatwound .011s and
  a deluxe hardshell case.
details: |-
  The Ladybird is Collings' fully hollow electric guitar, built around a compact 24 1/8" scale length designed to evoke the feel and tone of classic 1960s single-cutaway instruments. The body is constructed from poplar with leopard tortoise binding and measures 15" wide, 19 3/16" long, and 1 3/4" deep. The neck is also poplar, joined to the body via a mortise & tenon joint, with a comfortable C-shape profile (approximately 0.860" at the 1st fret and 0.969" at the 9th fret) and a 1 11/16" nut width. The rosewood fingerboard features a 12" radius, medium 18% nickel-silver frets, and MOP Ladybird dot inlays. Electronics consist of custom Righteous Sound Cathedral or Bishop pickups wired in a 50s-style configuration with 500K pots and Jupiter Vintage Yellow capacitors, controlled via Davies Radio knobs. Hardware includes an Indian rosewood bridge with trapeze tailpiece, Kluson tuners (Waverly available as an upgrade), and a single-ply tortoise pickguard.
