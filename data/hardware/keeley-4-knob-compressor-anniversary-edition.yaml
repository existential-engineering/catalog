details: |-
  This is the Anniversary Edition of the Keeley Compressor, a limited run marking the company's thirteenth anniversary, finished in black sparkle with special markings. The underlying pedal is the compressor that set the tone standard in the boutique pedal world, built in the USA, which took Guitar Player magazine's Editor's Pick award and a Reader's Choice award for stompbox. At the time of the page, production was approaching 40,000 units.

  The pedal carries four controls: Sustain, Level, Attack and Input Clipping. Sustain sets the amount of compression. Set low it gives a soft always-on setting that keeps playing even; turned up it gives chicken picking and heavy funk sounds, and at the top of its range it becomes a sustain tool for leads.

  The Attack control is used to adapt the pedal between pickup types, turned down for a slow attack and release suited to single coils and turned up for humbuckers. Input Clipping should be set as high as it will go without audible unwanted distortion from high-output or active pickups, then backed off for a clear tone.

  Switching is true bypass through a triple pole double throw switch, with an LED for effect indication. The circuit uses metal film resistors and capacitors and transistors hand matched to better than 1% tolerance. It runs from a 9V battery or a standard 9V DC adapter at a 5mA current draw.
