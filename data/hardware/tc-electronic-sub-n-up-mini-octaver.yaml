details: |-
  Pocket-Sized Pitch Shifting

  SUB ’N’ UP MINI OCTAVER features the same state-of-the-art octave-engine found in it’s raved-about bigger brother for awesome octave sounds, including your choice of the amazing SUB ’N’ UP TonePrint octave tones. Add to this pitch perfect accuracy, flawless polyphonic tracking, an authentic old-school monophonic algorithm – and you've got the impossibly small, penultimate octaver for your crowded pedal board.

  Precocious Polyphony

  Don’t let its diminutive size fool you. SUB ’N’ UP MINI OCTAVER’s advanced polyphonic pitch technology gives you lightning-fast note tracking and glitch-free octaving even when playing complex chords. And with TC’s proprietary TonePrint technology, SUB ’N’ UP MINI OCTAVER is capable of delivering everything from shimmery octave-up tones for swells, a sweet 12-string ring or earthquake-inducing subsonic riffs.

  TonePrint – DIY
