id: a5xmPGbIlU3SQKZQWmlhr
name: 550A Special Edition
manufacturer: api-audio
primaryCategory: eq
categories:
  - rack-mount
url: https://apiaudio.com/product/550a-special-edition/
description: Reissued discrete 3-band proportional Q equalizer based on Saul
  Walker's original late-1960s design. Specifications identical to the standard
  550A with the same three overlapping bands, 7 frequency centers per band, and
  Proportional Q circuitry.
details: |-
  500-series 3-band proportional Q equalizer. Three overlapping bands
  with 7 frequency centers each. ±12 dB boost/cut in 2/4/6/9/12 dB steps. Bands
  1 and 3 shelf/peak switchable. Band-pass filter (50 Hz–15 kHz). +30 dBu clip
  level. Transformer-isolated balanced output.
specs: |-
  - Input impedance: 66 kΩ (high) / 17 kΩ (low)
  - Output impedance: <85 Ω (transformer isolated)
  - Frequency response: ±0.5 dB (30 Hz–20 kHz)
  - Noise: −90 dBm (high) / −98 dBm (low)
  - THD: 0.05% @ +4 dBm; 0.07% @ +18 dBm
  - Power: ±15–18V @ 70 mA
  - Dimensions: 1.5″ × 5.25″ × 7.75″
  - Weight: 2 lb
