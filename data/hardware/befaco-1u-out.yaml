description: Out is a 1U stereo output module designed to convert audio signals
  from your modular to line levels. Intellijel case's fully compatible.
details: |-
  1U OUT is a stereo output module in Intellijel 1U format that converts Eurorack modular audio signals to line levels. It is designed and assembled in Barcelona by Befaco and is fully compatible with Befaco 7U cases as well as Intellijel 7U and Palette cases.

  The module features a high-quality headphone amplifier for direct monitoring, allowing users to listen to their modular output through headphones without additional equipment.

  A dedicated CUE input with source selector enables auxiliary monitoring, making it possible to route separate signals to the headphone output for pre-mix monitoring or A/B comparison.

  The module is available both as a fully assembled unit and as a DIY kit. A Pulp Logic panel format is also available upon request for users with Pulp Logic-format 1U rows.
