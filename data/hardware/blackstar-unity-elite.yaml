versions:
  - name: Unity Elite 700H
    description: 700W bass head with 3 Voices (Classic, Modern, Flat), 3
      footswitchable drives (Overdrive/Distortion/Fuzz), 3-band EQ with
      semi-parametric mid, Response control (Linear/6L6/6550), Compressor,
      Chorus, Octave, USB audio, XLR DI/emulated out, series FX loop. Includes
      FS-13 footswitch and GB-2 gigbag.
  - name: Unity Elite 115C
    description: Passive bass speaker cabinet with 1x15-inch Eminence Cast Frame
      ceramic driver and APT:80 tweeter (High/Low/Off), 400W, 8 Ohm, combi
      1/4-inch + speakON input and thru, ultra-lightweight solid wood
      construction.
  - name: Unity Elite 210C
    description: Passive bass speaker cabinet with 2x10-inch Eminence Beta-10B
      ceramic drivers and APT:80 tweeter (High/Low/Off), 400W, 8 Ohm, combi
      1/4-inch + speakON input and thru, ultra-lightweight solid wood
      construction.
  - name: Unity Elite 410C
    description: Passive bass speaker cabinet with 4x10-inch Eminence Beta-10A
      ceramic drivers and APT:80 tweeter (High/Low/Off), 800W, 8 Ohm, combi
      1/4-inch + speakON input and thru, ultra-lightweight solid wood
      construction.
