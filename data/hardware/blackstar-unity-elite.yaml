description: Our flagship 700W bass heads and cabs with all the flexibility of Unity Pro.
details: |-
  The Blackstar Unity Pro Bass System has set the standard for power and flexibility in compact bass combos. The new top-of-the-range Unity Elite 700W head and cabinets deliver stadium-filling tone in a convenient, lightweight format.

  The high-headroom Elite Head delivers 700W of power; enough tonal clarity for any live situation. The Elite cabinets use an incredibly strong, lightweight solid-wood construction combined with premium Eminence ceramic drivers as standard, for authentic sounds and class-leading lightness.

  The Unity Elite 700W head packs all the pro features needed for the working bass player including the Response control (Linear, 6L6, 6550), Compressor, built-in effects, Chorus, Octaver and 3 types of Overdrive, with market-leading tonal flexibility from dynamic clean, through valve growl to full-on distortion, all footswitchable.

  The Response feature accurately recreates the response of two revered output valves, the 6550 and 6L6. The studio-quality overdrive and effects are footswitchable using the included 2-button FS-13 footswitch, or the optional FS-12 footcontroller with extended functionality and tuner.

  Designed for the studio or stage with balanced XLR, USB connectivity and more. The included GB-2 U700H gigbag provides protection and portability, and the U700H can be rack-mounted in a standard 19-inch rack case using the optional 2U RA-1 rack adaptor.
specs: |-
  - 700W power amplifier (U700H head)
  - 3 Voices: Classic, Modern, Flat
  - 3 Footswitchable Drives with user-controllable blend: Overdrive / Distortion / Fuzz
  - Semi-parametric EQ: Low, Mid, Mid Frequency, High
  - Unique Response control: Linear, 6L6, 6550
  - Footswitchable Chorus and Octave (Up/Down) with adjustable level control
  - Compressor with level control and on/off
  - Input Gain with clip indication
  - Pad switch for active / passive instruments
  - Master Volume
  - USB audio out for direct recording
  - Series effects loop
  - MP3 / Line in
  - XLR + 1/4-inch Line Out / Headphones with independent level control
  - D.I. / cabinet emulated line outputs
  - Link to Unity Bass Series Active Cabinet
  - Footswitch: FS-13 supplied, FS-12 optional
  - Speaker Outputs: SpeakON (Passive Cabs) or Cab Link XLR (U250ACT Active Cab)
  - U700H dimensions: 378(W) x 77(H) x 245(D) mm
  - U700H weight: 4.2 kg
  - U115C: 1x 15-inch Eminence Cast Frame Driver + Eminence APT:80 tweeter, 400W, 8 Ohm, 25.2 kg
  - U210C: 2x 10-inch Eminence Beta-10B drivers + Eminence APT:80 tweeter, 400W, 8 Ohm, 25.1 kg
  - U410C: 4x 10-inch Eminence Beta-10A drivers + Eminence APT:80 tweeter, 800W, 8 Ohm, 33.9 kg
  - Cabinet tweeter level: High/Low/Off
  - Combi 1/4-inch + speakON input and thru on cabinets
  - Ported cabinet for extended bass response
  - Ultra-lightweight solid wood pro construction
  - GB-2 U700H gigbag included
  - FS-13 2-button footswitch included
