description: The OD505WL1 is an active dynamic wireless microphone capsule
  designed for live vocal performance. It delivers supercardioid focus with
  condenser-like clarity — punchy and precise — while maintaining the authentic
  Austrian Audio sound in wireless applications. Compatible with Shure, Sony,
  and Lectrosonics wireless systems. Made in Vienna.
details: |-
  Active dynamic wireless microphone capsule with a supercardioid polar pattern, engineered for live stage vocal performance. Active dynamic circuitry provides condenser-like clarity with the robustness of a dynamic microphone.

  Strong spill rejection and high feedback stability for demanding live environments. Compatible with Shure, Sony, and Lectrosonics wireless transmitter bodies. Supply voltage 5–10 V at less than 1 mA, sourced from the wireless transmitter.

  Made in Vienna.
specs: |-
  - Directional Pattern: Supercardioid
  - Frequency Range: 35 Hz – 16 kHz
  - Sensitivity: 4.6 mV/Pa
  - Equivalent Noise Level: 26 dB SPL (A)
  - Maximum SPL: 150 dB SPL
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 5–10 V (< 1 mA, from transmitter)
  - Compatibility: Shure, Sony, Lectrosonics wireless systems
  - Dimensions: 92 × 53 × 53 mm
  - Weight: 195g
