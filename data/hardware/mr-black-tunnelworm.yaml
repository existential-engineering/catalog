description: The TunnelWorm is a compact through-zero flanger that also covers
  classic flanger, airy chorus and watery rotary tones via its Zero knob.
details: |-
  The elusive, haunting, tubular sound known as through-zero flanging, once only
  possible with a pair of outboard reel-to-reel decks and just the right touch,
  has been captured and packed into the compact TunnelWorm TZF.

  The TunnelWorm does far more than through-zero flanging. A quick turn of the
  Zero knob moves it from true through-zero sweeps into classic pedal flanging,
  airy chorus and even watery rotary tones, all from a small enclosure.

  With a wide Rate range and high input headroom, it works equally well on
  electric guitar, bass and keys, delivering everything from subtle movement to
  dramatic jet-plane sweeps.

  TunnelWorm production has been discontinued. It remains true-bypass and proudly
  made in the U.S.A.
specs: |-
  - Through-Zero Flanging (Zero knob set high)
  - Traditional pedal flanging (Zero knob set low)
  - Airy chorus and watery rotary tones via the Zero knob
  - Wide Rate control range
  - High input headroom (3V peak-to-peak max input signal)
  - Great on electric guitar, bass and keys
  - Compact footprint (2.4" x 4.5" x 1.8")
  - True-Bypass
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - 9VDC 2.1mm negative center-pin power
  - <60mA Current Draw (≥100mA supply recommended)
