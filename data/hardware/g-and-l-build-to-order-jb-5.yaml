details: |-
  In the decade since G&L began offering bassists a made-in-Fullerton jazz style bass, the G&L JB has delighted players with classic Alnico tones served up with more attack and sustain thanks to its G&L Saddle Lock bridge designed by Leo Fender. Today, the G&L JB•5 applies this formula to a five-string platform with an easy-playing neck featuring 1.750" nut width and slim rear profile for enhanced comfort.

  This JB•5 projects a time-honored yet subtly progressive vibe, embracing the past yet unafraid of moving forward. The slim, hard-rock maple neck features an easy-playing satin finish, while its comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets deliver silky playability. Its Leo Fender-designed Saddle-Lock bridge transfers string energy right into the body end-grain for an incredibly resonant instrument.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Strings: 5
  - Pickups: Two G&L vintage Alnico jazz pickups
  - Body wood: Alder on Standard and all solid finishes, Swamp Ash on Premier Finishes
  - Neck wood: Hard Rock Maple with Rosewood or Maple fingerboard
  - Neck profile: G&L 1 1/2" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L Ultra-Lite with aluminum tapered string posts
  - Bridge: G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: Dual volume controls, one tone control
  - Includes: G&L Deluxe Gig Bag
