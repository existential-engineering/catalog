details: |-
  One Expression pedal shouldn’t limit what you can control. Canvas Expression reimagines what an expression pedal can be: two independently configurable outputs capable of Expression, Switch, or Control Voltage (CV), plus deep MIDI control over products via ⅛” TRS output and USB-C. Canvas Expression is your command center for manipulating parameters in real-time that adapts to nearly any pedalboard, synth, or desktop setup. Whether you're sweeping delay repeats, switching presets mid-song, controlling modular synths, or automating plugin parameters inside your DAW, Canvas Expression gives you flexible control without compromise. Configure every output exactly how your rig demands and save yourself from carrying multiple dedicated controllers. Traditional expression pedals do one job. Canvas Expression was designed to do nearly all of them. Dual Independent Outputs Each of its two independent outputs can function as a standard expression output, a programmable switch output, or a control voltage (CV) source, allowing a single pedal to control multiple devices across nearly any setup. Whether you're connecting to pedals, amplifiers, synthesizers, modular systems, or your computer, Canvas Expression adapts to the gear you're using instead of forcing your rig to work around it. Customize Your Way Built-in automatic expression wiring detection removes the guesswork of compatibility, while adjustable tapers, sweep direction, switching thresholds, and output behavior let you fine-tune exactly how your expression signals respond to the movement of the treadle. MIDI Control Beyond analog control, Canvas Expression becomes a powerful MIDI controller capable of sending up to 16 independently assignable MIDI messages over both USB-C and TRS MIDI. Using the Canvas Expression web editor at https://canvasexp.walrusaudio.io, assign control to pedals, processors, DAWs, virtual instruments, and plugins with smooth, high-resolution parameter sweeps or instant preset changes. With customizable treadle tension, onboard configuration, and an intuitive web editor for advanced setup, Canvas Expression is designed to become the central control point for virtually any modern rig. Dual Independent Outputs Configure Jack A and Jack B independently. Each output can function as one of the following: Control two completely different devices simultaneously with one pedal. Universal Expression Compatibility Designed to work with a wide range of expression-enabled gear, Canvas Expression supports multiple wiring configurations and automatic wiring detection for quick setup. Simply connect your pedal, and with a few button presses, Canvas Expression determines the proper wiring automatically. Programmable Switch Control Need more than expression? Assign either output as a switch output for controlling amp channels, pedal functions, preset changes, or any compatible switching device. Customize: Built for Synths & Modular Generate control voltage directly from either output. Selectable voltage ranges include: Perfect for Eurorack systems, desktop synthesizers, and CV-enabled effects. Deep MIDI Control Canvas Expression transforms into a flexible MIDI controller capable of controlling both hardware and software simultaneously. From pedalboards to DAWs, Canvas Expression fits naturally into MIDI-based workflows. Powerful Web Editor Advanced setup is handled through the Canvas Expression web app. Configure: Make changes in seconds without navigating complicated menus. Adjustable Feel Dial in the treadle exactly how you like it. A simple drag adjustment lets you increase or decrease pedal resistance for a lighter or firmer sweep depending on your playing style. Built to Last Like our Canvas Volume pedal, Canvas Expression has no strings, pots, or gears to wear out, get scratchy, or fail mid-set and is backed by our Limited Lifetime Warranty.
specs: |-
