  - Up to 16 assignable MIDI messages
  - Control Change (CC)
  - Program Change (PC)
  - Independent TRS MIDI and USB MIDI outputs
  - High-resolution 14-bit USB MIDI
  - MIDI input for remotely enabling or disabling outputs
  - MIDI assignments
  - Switch behavior
  - TS resistance values
  - Global settings
  - Firmware updates
