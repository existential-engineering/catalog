  - Video/Reviews
  - Features: • CRYSTAL CLEAR PERFORMANCES • RUGGED METAL HOUSING • 4 CHANNELS • PEAK LIMITING • TRANSMITTER FOR HANDHELD MICS • RECEIVER FOR ALL MIXERS & AMPLIFIERS • UNCROWDED 5 GHz BAND • EXTREMELY LOW NOISE -110 dBm • UP TO 200' RANGE* • 6.5 HOURS OF CONTINUOUS USE • USB CHARGING The WM5 Wireless Microphone System will transform your existing wired microphone into a wireless microphone, giving you the freedom and the simplicity you are looking for. The 5GHz frequency band offers excellent range up to 200 ft* and is less crowded than the 2GHz band, reducing your chances of interference from other wireless audio gear. The extremely low noise design and compact size coupled with an intuitive set up makes going wireless an easy process. *Note: Range is dependent on RF environment including RF reflections, interference and absorption.
  - WM5 SPECIFICATIONS » Number of Channels: 4 » RF Power: 5mW » Max Input: -10dB » Max Output: -15dB » Frequency Response: 20Hz-20kHz » Signal to Noise Ratio: 110dB » Operating Band: 5.6-5.8GHz » Sample Rate: 24bit/48kHz » Latency: Less than 5ms » Range: 200' Feet* » Battery: Rechargeable Internal Lithium » Connector: XLR Female - Transmitter XLR Male - Receiver » Continuous Run Time: 6.5hrs. » Charge Time: Approximately 3.5hrs for full charge » Charging: USB » Charging Cable Included. Replacement cable, use USBWG5 » Color: Black/Silver » Dimensions: Trans: 3.7"L x 1.2"W Rec: 3.5"L x 1.2"W Wt: 2oz. » *Note: Range is dependent on RF environment including RF reflections, interference and absorption.
  - The system works great. To be honest, I'm more of a phantom power guy but I've got many other mics that the band uses. Those guys will eat it up. I can't tell you how many guitar players have truly enjoyed the sound of the Carvin Nomad (amp) I bought 4-5 years ago. Actually, all the Carvin products I've bought have been terrific. Soon I'll be ordering a AC120 sequencer. P.S. Another great use of the WMS. Let's say you have a guitar player (keyboards too) that forgets his cables or they won't work well. With a WMS unit you can use it as the wireless system. For that matter, they also work great with my V-Drums. Erik E.- Fraser,MI
