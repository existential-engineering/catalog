details: |-
  Inspired by the pivotal and prolific years of Gretsch's 1950s and early '60s golden age, Vintage Select Edition guitars are designed for the player who appreciates the finest in musical instrument heritage. The new G6128T-59 Vintage Select '59 Duo Jet with Bigsby rocks that legacy to perfection.

  The Duo Jet is the Gretsch flagship "solid body" guitar, with signature power and punch coming from its chambered mahogany construction, which magnifies harmonic richness by letting air resonate between the top and body for livelier and more articulate tone. 1959 marked the first year that Filter'Tron pickups appeared on the Jet, and the dual TV Jones Classic pickups on this vintage-style baby replicate that unmistakable vintage Filter'Tron sound to fabulous sonic effect.
