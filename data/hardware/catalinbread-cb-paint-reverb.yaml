details: |-
  The CB Paint Reverb is Catalinbread's tribute to the Alesis Microverb, a late-1990s digital reverb unit that democratized studio-quality reverb by making it affordable and accessible. The Microverb's cost-cutting design choices resulted in distinctive reflection filter characteristics that gave it a unique sonic personality, and the CB Paint captures that character faithfully.

  The pedal offers eight modes via a rotary switch: six patches drawn from the original Microverb's most memorable settings (arranged from smallest to largest room size and decay time), a gated reverb mode, and a reverse reverb mode.

  Beyond the core patches, Catalinbread added several modern controls absent from the original unit. The Mix knob blends the dry and wet signals. The Tone control is a 2-pole low-pass filter for dialing in the brightness or darkness of the reverb tail. The Onset control introduces a pre-delay of up to approximately 200ms before the reverb kicks in, and also functions as gate time control in gated mode and reverse smearing control in reverse mode.
