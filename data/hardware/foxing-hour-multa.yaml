description: MULTA is a Dual 1-to-3 buffered multiple Eurorack module that
  duplicates an input signal into three identical unity gain outputs. The first
  input is normalled into the second input, allowing up to six identical outputs
  from a single source.
details: |-
  MULTA is a Dual 1-to-3 Buffered Multiple. Input is buffered to provide three identical unity gain outputs. Using a buffered multiple instead of stackable cables prevents unwanted attenuation as well as potential crosstalk from modules without input buffers. The first input is normalled into the second input so using only one input will provide a user with six identical unity gain outputs. Inputs are terminated with a 100Kohm resistor and each output has a series resistance of 499ohms. Dimensions:
  * 4 HP
  * 41 mm deep

  Current Draw:
  * 6 mA +12V
  * 6 mA -12V
  * 0 mA 5V

  BOM & Guide
