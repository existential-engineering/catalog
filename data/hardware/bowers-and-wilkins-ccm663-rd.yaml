details: |-
  RD stands for Reduced Depth, so this speaker will fit into tighter spaces than the standard CCM663. A shallower cone and a redesign of the easy-fit QuickDogs frame reduce depth to a more usable 92mm, while retaining everything that makes the CCM663 such a great in-ceiling speaker.

  The familiar, yet discreet, dark blue Aramid Fibre (Kevlar) cone of the bass/midrange driver delivers a stunningly clean, detailed response. This, combined with the pivoting aluminium dome tweeter for adjustable off-axis treble response and three-position EQ, make this one of the most versatile custom speakers around.

  If preferred, the supplied round grille can be replaced with an optional, square CCM663 grille. The speaker is listed as a Performance two-way, reduced-depth in-ceiling speaker in a White finish.

  CCM6 Series ceiling speakers install into a cut ceiling aperture using the supplied cut-out template. Speaker cable connects to the spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then lifted into the aperture and held by four QuickDogs spring clamps. The baffle carrying the drivers and crossover fits into the frame on three push-lock fasteners, and the grille is held magnetically.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) Nautilus swirl loaded aluminium dome tweeter
  - Drive units: 1x ø150mm (6in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 35Hz to 50kHz
  - Recommended amplifier power: 25W to 100W
  - Sensitivity: 86dB (2.83V, 1m)
  - Nominal impedance: 8Ω (4.8Ω minimum)
  - Frame: ø240mm (9.4in)
  - Cut-out: ø202mm (8in)
  - Depth behind surface: 92mm (3.6in)
  - Protrusion: 7mm (0.3in)
  - Net weight: 2.3kg (5 lb)
  - Pre-mount kit: PMK C6
  - Back box: BB6W or BB125C
  - Supplied round grille, optional square CCM663 grille
  - Pivoting aluminium dome tweeter and three-position EQ
  - Red and black spring terminals on the side of the frame
  - Finish: White
