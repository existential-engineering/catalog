description: RD stands for Reduced Depth, so this speaker will fit into tighter
  spaces than the standard CCM663. A shallower cone and a redesign of the
  easy-fit QuickDogs frame reduce depth to a more usable 92mm, while retaining
  everything that makes the CCM663 such a great in-ceiling speaker.
details: |-
  CCM663 RD is the reduced-depth version of the Performance Series CCM663 in-ceiling speaker. A shallower cone and a redesigned QuickDogs frame bring the depth behind the ceiling surface down to 92mm (3.6in), so it fits into voids that will not take the standard model, while the rest of the design is carried over.

  It is a two-way system: a 25mm (1in) Nautilus swirl loaded aluminium dome tweeter above a 150mm (6in) blue Aramid Fibre cone bass/midrange driver. Bowers & Wilkins describes the cone, which its older literature calls blue Kevlar, as delivering a stunningly clean and detailed response while staying discreet behind the grille.

  The tweeter pivots for adjustable off-axis treble response and a three-position EQ switch gives a further correction, which Bowers & Wilkins offers as what makes the speaker versatile across awkward ceiling positions.

  The frame measures 240mm (9.4in) across with a 202mm (8in) cut-out, the speaker protrudes 7mm (0.3in) into the room and weighs 2.3kg (5lb). The matching pre-mount kit is the PMK C6 and the back box options are the BB6W and the BB125C. A round grille is supplied and can be swapped for the optional square CCM663 grille.

  It is a passive loudspeaker: 8 ohms nominal with a 4.8 ohm minimum, 86dB sensitivity, and a recommended amplifier power of 25W to 100W, driven from an external amplifier.
specs: |-
  - Description: 2-way in-ceiling system, reduced depth
  - Drive units: 1x 25mm (1in) Nautilus swirl loaded aluminium dome tweeter, 1x 150mm (6in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 35Hz to 50kHz
  - Recommended amplifier power: 25W to 100W
  - Sensitivity: 86dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.8 ohms minimum)
  - Frame: 240mm (9.4in) diameter
  - Cut-out: 202mm (8in) diameter
  - Depth behind surface: 92mm (3.6in)
  - Protrusion: 7mm (0.3in)
  - Net weight: 2.3kg (5lb)
  - Pre-mount kit: PMK C6
  - Back box: BB6W or BB125C
  - Pivoting aluminium dome tweeter for adjustable off-axis treble response
  - Three-position EQ switch
  - Redesigned easy-fit QuickDogs frame
  - Round grille supplied, optional square CCM663 grille available
  - Finish: White
