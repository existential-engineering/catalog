description: Boost your creativity with the DDJ-SX3 4-channel DJ controller for
  Serato DJ Pro . Expanding on the features of our popular DDJ-SX2 controller ,
  the DDJ-SX3 is strong yet portable with a familiar layout and lower latency
  jog wheels. Loaded with advanced features, this controller is ideal for
  professional mobile DJs performing at club nights, parties, weddings and
  corporate events. Collaborate with MCs, rappers or singers by plugging in 3
  different microphones at once via the 3 Mic inputs, then control EQs and apply
  FX to each. Connect 2 computers at the same time for easy DJ changeovers via
  the dual USB ports. Coming with free Pitch ‘n Time DJ and Serato Flip
  Expansion Packs, you can stretch, mix and cut with precision.
