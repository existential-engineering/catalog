description: Custom Shop edition of the Fuzz Bender, a five-knob
  three-transistor hybrid fuzz with silicon and germanium gain stages,
  gyrator-based active bass and treble controls, and a Bias control.
details: |-
  The Fuzz Bender is a five-knob, three-transistor fuzz that combines high-gain silicon with germanium gain stages, built around vintage Japanese germanium transistors. This Tuxedo Custom Shop edition carries a flat white top, a matte black backplate and a Custom Shop insignia.

  What separates it from a plain square-wave fuzz is the active EQ. Two gyrators provide bass and treble controls with over 20dB of boost or cut at 100Hz and 10kHz, which allows fuzz voicings a passive tone stack cannot reach.

  The Bias control sets the attack and decay of each note, covering fat square waves, angular fuzz and glitching, Velcro-like attacks. The Level and Fuzz knobs are oversized so they can be adjusted by foot.

  Jacks are simple top-mounted in and out, the pedal is true bypass, and it runs on 9V DC at 20mA with no battery option. It is designed and made in the United States.
