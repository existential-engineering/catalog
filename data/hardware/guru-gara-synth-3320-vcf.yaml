details: |-
  3320 VCF (Voltage Controlled Low Pass Filter)

  The 3320 VCF Eurorack PCB and Front Panel Kit is a classic analog voltage-controlled filter designed for DIY builders seeking authentic vintage character and hands-on sound shaping. Built around the legendary CEM3320 or AS3320 filter IC, this module delivers rich, musical filtering with a distinctly analog response. Well known from classic synthesizer designs, the 3320 filter topology offers a powerful and expressive low-pass filter, capable of everything from smooth, rubbery bass tones to aggressive, high-resonance sweeps. Key Features

  Filter Character & Control

  At its core, the 3320 VCF provides a smooth yet powerful low-pass response that excels at both subtle tone shaping and dramatic filtering effects. The filter reacts musically to modulation, making it ideal for:

  With control voltage input, the cutoff frequency can be dynamically modulated using envelopes, LFOs, or sequencers, allowing expressive and evolving filter movement within your patch. DIY Build & Customization

  This module is designed for intermediate-level builders and offers flexibility in component choice by supporting both CEM3320 and AS3320 ICs. This allows builders to experiment with slight tonal variations depending on chip availability and preference. The PCB layout is optimized for reliability and ease of assembly while maintaining an authentic analog signal path. Technical Specifications

  View Documents

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video

  The Sound of 3320 VCF - A quick demo of a DIY unit built with AS3320
