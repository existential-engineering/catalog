name: 160SL
manufacturer: dbx
primaryCategory: compressor
categories:
  - limiter
  - rack-mount
  - outboard
url: https://dbxpro.com/en/products/160sl
description: A discontinued Blues Series compressor/limiter featuring
  patent-pending AutoVelocity technology and dual V8 VCA modules with 127dB
  dynamic range, housed in an aircraft aluminum chassis with Jensen
  transformers.
details: |-
  The 160SL represents the evolution of dbx's legendary 160S compressor line, introducing innovative AutoVelocity circuitry for program-dependent attack and release control. It combines features from classic dbx compressors including auto mode, OverEasy compression, and the advanced PeakStopPlus limiting algorithm. The unit features a striking blue front panel machined from aircraft aluminum with handcrafted knobs and custom VU meters.

  Premium components throughout — including Jensen transformers, Neutrik XLRs, and military-grade circuit boards — deliver exceptional audio quality with ultra-low distortion and superior performance in demanding environments. Equipped with dual proprietary dbx VCA modules based on the original Blackmer decilinear design, the unit delivers exceptional dynamic range suitable for both studio and live use.
specs: |-
  - VCA: Dual dbx V8 modules
  - VCA Dynamic Range: >127dB
  - Input Connectors: Female XLR, Pin 2 hot
  - Output Connectors: Male XLR, Pin 2 hot
  - Max Input Level: >+30dBu balanced, >+26dBu unbalanced
  - Max Output Level: >+30dBm balanced, >+24dBm unbalanced
  - Input Impedance: >20kΩ balanced, >10kΩ unbalanced
  - Output Impedance: 50Ω balanced, 25Ω unbalanced
  - Frequency Response: <2Hz to >200kHz +0/-3.0dB
  - Bandwidth: 20Hz to 20kHz +0/-0.1dB
  - Noise: <-92dBu unweighted
  - THD+Noise at Unity Gain: 0.008% typical at +4dBu
  - THD+Noise at Max Output: 0.05% typical at +30dBu
  - Compressor Threshold Range: -40 to +30dBu
  - Compressor Ratio: 1:1 to Infinity:1
  - Compressor Modes: Manual or Auto with OverEasy or hard knee
  - Limiter Type: PeakStopPlus two-stage limiter
  - Limiter Threshold Range: +4dBu to >+30dBu
  - Limiter Ratio: 4:1
  - Sidechain Input: Female XLR, Pin 2 hot
  - Output Gain Range: -20 to +20dB
  - Dimensions: 3.5"H × 19"W × 11.25"D
  - Weight: 20.5 lbs (9.3 kg)
