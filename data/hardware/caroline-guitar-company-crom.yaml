details: |-
  The CROM is a BC184 Supa Tone Bender style fuzzstortion from Caroline Guitar
  Company, drawing inspiration from their original Olympia pedal while refining
  the circuit with a classic tweed amp style tone control.

  The MOUNTAIN control shapes tone in a way that actively interacts with the
  SWORD (gain) control, creating a more dynamic and responsive feel than
  conventional tone stacks found in Muff-style circuits.

  Compared to classic Muff-style designs, the CROM is notably less lossy and
  less scooped in the mids, resulting in an immediate and punchy response that
  sits well in a mix.

  A TURBO button adds additional power and gain for players who need an extra
  push, making the pedal versatile across clean boost to full fuzzstortion tones.

  The CROM is made by Caroline Guitar Company in Columbia, South Carolina, and
  is available in Standard Black and Special Bronze finishes.
specs: |-
  - Circuit: BC184 Supa Tone Bender style fuzzstortion
  - Controls: MOUNTAIN (tone), SWORD (gain), TURBO (button)
  - Finishes: Standard Black, Special Bronze
