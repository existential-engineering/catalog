details: |-
  The Stealth Edition is a Custom Shop blackout finish of the D&M Drive, the dual boost and drive pedal developed with That Pedal Show. It carries a flat black textured enclosure, flat black knobs and the Custom Shop insignia.

  The high-voltage boost side is built to push an amp, delivering a large amount of headroom with a distinct midrange voice that can be dialled in for lead work, and it saturates smoothly as it is turned up. The drive side runs multiple gain stages, from a low-gain overdrive for chord work through to a heavily saturated, sustaining lead tone with quick attack and plenty of high and low end.

  A toggle sets which side comes first when both are engaged, so a round boost can feed a driven gain stage or a driven tone can be boosted afterwards. TRS insert cabling allows the pedal to be integrated into a professional switching system and the two sides addressed as independent effects. The design holds a 2017 Guitar Player Magazine Editor's Pick award.
