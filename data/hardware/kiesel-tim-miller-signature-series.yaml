details: |-
  The Tim Miller Signature Model, the M6, is a headless instrument with a semi-hollow, chambered body that excels in both acoustic volume and feedback resistance at higher volume and distorted tones.

  The neck heel is further sculpted to accommodate a custom strap button positioning, which, in turn, achieves the perfect balance when playing standing up.

  Tim Miller on the design: "My vision for the Kiesel M6 was to combine semi-hollow electric guitar tones with the balance, portability and tuning stability of a headless design. Working closely with Jeff Kiesel and the entire team brought this vision to a reality. We have created a unique design that sounds and feels amazing to play!"
specs: |-
  - Scale length: 25.5"
  - Frets: 22 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: semi-hollow, chambered mahogany, 30.8" long, 1.66" thick, 12.5" wide
  - Top wood: flamed maple top
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: neck-through, with a sculpted neck heel for custom strap button positioning
  - Fingerboard: ebony with 14" radius
  - Bridge: Hipshot fixed bridge, .4125" (10.5mm) spacing
  - Pickups: bezel-mount passive Kiesel Beryllium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Hardware: black
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 6.3 lbs
