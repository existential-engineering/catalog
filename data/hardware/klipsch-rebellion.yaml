details: |-
  The Rebellion is Klipsch's newest addition to their Heritage Collection, a premium bookshelf loudspeaker that draws on Paul W. Klipsch's original 1958 design philosophy. It features the brand's hallmark horn-loaded tweeter technology for high efficiency and dynamic range from a compact cabinet form factor.

  Manufactured in Hope, Arkansas, the Rebellion uses real wood veneers with luxury finish details and is available in multiple wood finish options including American Walnut, American Auburn, and Black Ash. Like all Heritage Series speakers, it carries a 10-year warranty and reflects Klipsch's commitment to American craftsmanship.
