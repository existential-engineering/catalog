description: The BM5 MkIII monitors with ultra-high dynamic range and
  hand-crafted drivers deliver performance superior to many larger and more
  expensive monitors.
details: |-
  The BM5 mkIII is the next generation of the tremendously successful BM5A MKII. With greater SPL, broader frequency and power response compared to the previous model, its ultra-high dynamic range and hand-crafted drivers deliver performance superior to many larger, more expensive monitors.

  Large diameter voice coil surrounds the magnet for superior linearity. Aluminum voice coil former and wire are low mass so transient response is quick and accurate.

  Diaphragm and dust cap are moulded as one piece in patented low-mass, highly rigid Magnesium Silicate Polymer providing unrivaled accuracy.

  Configured as a rear-loaded bass reflex 2-way nearfield monitor with DSP-based crossover, the BM5 mkIII pairs a 6.5-inch MSP midrange/woofer with a 1.1-inch soft dome tweeter, each driven by a dedicated 50W amplifier.
specs: |-
  - Type: Nearfield Monitor
  - Series: BM mkIII
  - Box Principle: Rear-loaded bass reflex
  - Crossover: 2-way DSP-based
  - Crossover Frequency: 1900 Hz
  - Tweeter: 1.1in soft dome
  - Midrange/Woofer: 6.5in MSP (Magnesium Silicate Polymer)
  - Amplifier Power (Woofer): 50W
  - Amplifier Power (Tweeter): 50W
  - Maximum SPL (1m, pair): 118 dB
  - Lower Cutoff (@85 dB +/- 3 dB): 42 Hz
  - Upper Cutoff (@85 dB +/- 3 dB): 24 kHz
  - AC Power Input: 100-240V 50/60Hz
  - Max Power Consumption: 94W
  - Max Standby Power Consumption: 0.3W
  - Dimensions (W x D x H): 186 x 296 x 320 mm (7 3/8 x 11 5/8 x 12 5/8 in)
  - Weight: 7.7 kg (17 lbs)
  - Speakers per packaged box: 1
