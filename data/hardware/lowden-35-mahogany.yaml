details: |-
  Delivering a rich, adaptable tone, Mahogany is widely regarded as one of the most balanced and versatile of tonewoods. Lowden's Mahogany guitars boast exceptional clarity and warmth across a broad spectrum of playing styles. Its natural sonic balance makes it a go-to choice for vocal accompaniment, studio work, and songwriting.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Mahogany back and sides can be paired with Red Cedar, Sitka Spruce, Alpine Spruce, or Sinker Redwood soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Mahogany
  - Soundboard options: Red Cedar, Sitka Spruce, Alpine Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
