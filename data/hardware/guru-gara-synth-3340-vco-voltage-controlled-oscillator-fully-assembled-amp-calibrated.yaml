details: |-
  The 3340 VCO Eurorack module is a fully assembled and professionally calibrated voltage controlled oscillator based on the classic AS3340/CEM3340 design. This ready-to-use module requires no DIY work and is delivered fully tested, making it ideal for musicians who want reliable analog performance straight out of the box. Built using the same high-quality PCB design as the DIY kits, this version features factory-assembled SMD components and carefully installed through-hole parts. Each unit is individually calibrated to ensure accurate 1V/octave tracking, stable tuning, and consistent waveform performance. Key Features

  Sound & Performance

  The 3340 VCO delivers a wide sonic range, from aggressive, harmonically rich analog tones to smooth and precise waveforms. Linear FM, PWM, and dual sync options allow for expressive modulation and complex patching, making this oscillator suitable for both classic subtractive synthesis and advanced modular systems. Build Quality & Design

  This module is built on a high-quality PCB with a black PCB front panel featuring factory-printed white graphics and gold-plated exposed copper. The PCB panel construction ensures durability while giving the module a clean, modern appearance that integrates seamlessly into any Eurorack system. All components are securely mounted, and the module is carefully inspected and tested before shipping. Calibration & Testing

  Each unit is:

  Technical Specifications

  The fully assembled and calibrated 3340 VCO is a dependable, high-quality analog oscillator that delivers classic sound, modern reliability, and immediate playability - perfect for performers, studio users, and modular enthusiasts who prefer a plug-and-play solution. Skiff Friendly Module

  Videos
specs: |-
  - Fully assembled and calibrated Eurorack VCO
  - Classic AS3340 oscillator core
  - Square, Triangle, Ramp, and Sine waveform outputs
  - Hard Sync and Soft Sync inputs
  - Linear FM input with precise 1V/octave tracking
  - External CV control for pulse width modulation (PWM) (0 to +5V)
  - Stable tuning
  - 10HP Eurorack format
  - Fully assembled
  - Individually calibrated for accurate pitch tracking
  - Tested for waveform integrity and stable operation
  - Format: Eurorack
  - Width: 10HP
  - Current Draw: +12V: 15mA, −12V: 15mA
  - Depth: 25mm (Skiff Friendly)
