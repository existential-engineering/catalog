description: Motorized Turntable Software Controller — a single-platter digital
  DJ controller with a direct-drive 7-inch motorized aluminum platter, real
  vinyl and slipmat, and bundled Serato ITCH software.
details: |-
  V7 is the turntable for today's DJ. V7 delivers outstanding feel and unprecedented power in a single-platter digital DJ controller. V7 is based around the acclaimed adjustable torque, motorized-platter design from Numark's NS7 and delivers a host of professional features including real vinyl and a slipmat that analog turntablists will love, plus turntable control at ten times the resolution of standard MIDI, mouse-less library navigation, and Strip Search virtual-needle drop.

  V7's link function enables you to combine two V7s with your choice of any mixer and your Mac or PC for a completely customizable, totally seamless performance environment. Grab a pair of V7s and your favorite mixer and you're ready to rock — V7 has right and left deck audio outputs to connect directly to your mixer.

  V7 sends control information over USB at more than ten times the standard MIDI rate. This innovative communication technique yields extremely high-precision, low-latency control. The unit contains a multichannel, high-resolution 24-bit USB digital-audio interface with an audiophile-grade, minimized analog signal path for tight, punchy audio.
