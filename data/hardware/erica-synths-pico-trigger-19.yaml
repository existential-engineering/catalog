description: Clock & trigger generator.
details: |-
  The Erica Synths Pico Trigger module provides the master clock for a Pico system and generates up to 16 step patterns across four triggers, from simple clock divider patterns through to polyrhythmic patterns of differing step length for triggering drums.

  The clock is selectable between internal and external, the internal one running from 20BPM to 420BPM, with adjustable shuffle. A clock output passes it on to the rest of the system, and four trigger outputs carry the patterns, at 5V and 10ms per trigger.

  Eight patterns are held in memory. Patterns are designed in a custom web interface, or in desktop software for Windows and macOS, and then uploaded to the module through the 3,5mm CLK input jack, so no data connector is needed.

  The panel is 3HP wide and the module is 35mm deep, part of the Pico Series brief Erica Synths set itself, to fit superior synth functionality into 3HP at an affordable price.
specs: |-
  - Selectable internal clock or external clock
  - Clock output
  - Polyrhythmic patterns
  - Adjustable shuffle
  - 4 trigger outputs
  - 8 pattern memory
  - Web-based pattern design interface
  - Pattern upload via CLK input
  - Clock rate 20BPM to 420BPM
  - Trigger amplitude 5V
  - Trigger duration 10ms
  - Power consumption +20mA, -5mA
  - Module width 3HP
  - Module depth 35mm
