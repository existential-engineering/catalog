description: The Empress Bass Compressor is a transparent, all-analog compressor
  pedal built for bass. It carries studio-grade controls (three ratios,
  independent attack and release, a mix knob for parallel compression, input and
  gain-reduction metering, external sidechain insert) plus a fully variable
  sidechain high-pass filter, a two-position tone-and-colour circuit, and
  improved low-end response flat down to 20Hz.
details: |-
  When Empress released their original Compressor back in 2011, it quickly became a favourite among guitar and bass players alike. Although that original sounded great on bass (and still does), Empress set out to do even better for bassists specifically.

  On top of the full range of features and controls normally only seen in high-end studio equipment, such as input and gain-reduction metering, independent attack and release controls, a mix knob for parallel compression, and an external sidechain insert, the Bass Compressor adds a fully variable sidechain high-pass filter (20Hz to 400Hz) and a two-position tone-and-colour circuit that adds gentle tone sculpting and harmonic distortion for extra character.

  The low-end frequency response is improved to be completely flat down to 20Hz to handle the lowest bass sounds. It ships in a half-size die-cast enclosure, available in blue sparkle or silver sparkle.
specs: |-
  - All-analog signal path
  - Extremely transparent dynamic control
  - 3 compression ratios: 2:1, 4:1, 10:1
  - Independent attack and release controls
  - Mix knob for parallel (New York style) compression
  - Separate input and gain-reduction meters
  - Two-position tone + colour circuit (mid cut or upper-mid boost with mild harmonic distortion)
  - Sidechain send/return via 3.5mm TRS jack
  - Variable sidechain high-pass filter, 20Hz to 400Hz
  - Improved low-end response, flat down to 20Hz
  - True bypass
  - Available in blue sparkle or silver sparkle
  - Input impedance 1M, output impedance 2.2k
  - Frequency response (-3dB) 10Hz - 20kHz
  - Distortion less than 0.1%, noise -101dB
  - Power 9V DC (negative tip), 2.1mm barrel connector, ~100mA draw
  - Die-cast aluminum enclosure
  - Dimensions 4.8" (L) x 2.6" (W) x 2.5" (H with controls), weight 1 lb
