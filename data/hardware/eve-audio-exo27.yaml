description: The EXO 27 is the all-rounder of the EVE Audio EXO Series, an
  active 2-way studio monitor with a 6.5" coated aluminium woofer, the Precision
  AirMotion Tweeter and the GDC waveguide. It covers 41 Hz to 24 kHz at 116 dB
  maximum SPL in full space, with Ethernet access to the EVE Origin control
  software and a rear OLED display with a SMART Control Knob.
details: |-
  The EXO 27 is the powerful all-rounder of the EXO Series, intended for demanding producers, audio engineers and professional control rooms where output, linear sound and reliability matter. Its precise directivity also suits immersive formats like Dolby Atmos and other multi-channel applications. Four M6 threaded mounting points on the underside of the enclosure simplify mounting.

  The EXO 27 combines the EXO Precision AirMotion Tweeter with the GDC Waveguide (Guided Directivity Control) for controlled, wide dispersion, giving a precise stereo image with stable localization across the frequency range and better spatial coherence in setups like Dolby Atmos. Constructed from ultra-lightweight polyamide, the AMT delivers rapid transient response, high efficiency and accurate high-frequency reproduction with minimal distortion.

  The larger 6.5" CAL woofer (Coated Aluminium) delivers deep, punchy bass while keeping clarity in the mids, which suits detailed mixes that need to translate to larger systems. The lightweight aluminium cone, a resonance-damped dust cap and an optimized magnet system keep playback precise and dynamic with minimal distortion.

  The specially shaped, airflow-optimized LDE enclosure (Low Diffraction Enclosure) has rounded edges that minimize unwanted reflections and support smooth dispersion. Enhanced rear-facing bass reflex ports with optimized aerodynamics allow deeper low-end extension while minimizing port noise.

  The rear-mounted OLED display, paired with the integrated SMART Control Knob, keeps the system parameters visible and allows precise adjustment of output level, room adaptation filters and input source selection. The Ethernet connection gives access to the EVE Origin control software, calibration and firmware updates, and Wake-on-Signal and Wake-on-LAN bring the monitor out of standby. The illuminated eve audio logo on the front panel functions as a multi-color status indicator for overload protection, firmware updates and other system states, glowing warm white in normal operation, with adjustable brightness.
specs: |-
  - Frequency range (-3 dB at 1 m, full space): 41 Hz - 24 kHz
  - Woofer diameter: 6.5"
  - Max. SPL (full space, above 100 Hz): 116 dB
  - Max. SPL (half space, above 100 Hz): 122 dB
  - Cross-over frequency: 2200 Hz
  - Output power per speaker: 280 W
  - Tweeter: Precision AirMotion Tweeter (PAMT)
  - Waveguide technology: Guided Directivity Control (GDC)
  - Tweeter output power: 140 W / 1%
  - Woofer output power: 140 W / 1%
  - Woofer diaphragm material: Coated aluminum
  - Woofer voice coil: Air Stream Optimized Voice Coil Design
  - Dimensions: 234 x 344 x 280 mm (9.2 x 13.5 x 11 inch)
  - Weight: 8.1 kg (17.9 lb)
  - Protection limiter: Yes
  - User interface: Rear OLED display with SMART Control Knob
  - Volume: minus infinity to +10 dB
  - High-shelf filter (-5 dB to +3 dB): above 3 kHz
  - Mid EQ (-3 dB to +3 dB): 2.6 kHz
  - Desk filter cut (-5 dB to 0 dB): 470 Hz
  - Low-shelf filter (-5 dB to +3 dB): below 300 Hz
  - Max. input level: -10 dBV (max. 16.5 dBu) / +4 dBu (max. 20 dBu)
  - Input select: Balanced, Unbalanced, S/PDIF L/R/Mono
  - Standby mode: 15 min / 30 min / 60 min / off
  - Mounting point: Bottom side M6 mounting hole pattern of 50.8 x 107.9 mm
  - Standby power consumption: below 1 W
  - Idle power consumption: 7 W
  - Peak power consumption: 400 W
