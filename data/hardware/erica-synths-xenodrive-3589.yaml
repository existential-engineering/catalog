description: Unique stereo distortion and waveshaper.
details: |-
  The Xenodrive is a stereo distortion, overdrive and waveshaper FX unit with an algorithm developed by 112db and Erica Synths. It is a hands-on tool for shaping sounds in the studio or during live shows, covering ground from nuanced harmonic enhancement to total sonic destruction.

  Three distortions sit in the one unit, with an analog pre-gain stage, a germanium diode distortion emulation and a unique waveshaper algorithm, across a true stereo signal path.

  Twelve hands-on parameters are laid out for detailed sound design, with save and recall functions for all of them and full MIDI control over every parameter. A configurable footswitch input brings the unit under foot control.

  The enclosure is premium aluminium, matching the rest of the compact desktop lineup. It measures 23cm x 14.5cm x 7cm including knobs and weighs 833g.
specs: |-
  - 3x Distortions in one unit
  - Analog pre-gain
  - Germanium diode distortion emulation
  - Unique waveshaper algorithm
  - 12 hands-on parameters
  - Full MIDI control
  - Configurable footswitch input
  - Save & recall functionality
  - True stereo signal path
  - Premium aluminum enclosure
  - Dimensions: 23cm x 14,5cm x 7cm (including knobs)
  - Weight: 833g
