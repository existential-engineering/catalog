description: THE ULTIMATE IN REVERB AMBIENCE
details: |-
  The AMBI SPACE is a compact stereo reverb built on Free The Tone's own algorithm, running on a dual core chip with a 32-bit main CPU and a 32-bit co-processor plus a 32-bit high precision DSP. The combination is aimed at the kind of complex reverberation normally found in rack mount units. The reverb suits electric guitar and bass, acoustic guitar and vocals, and is equally at home in recording and mixing.

  Six reverb modes are provided: SPRING, PLATE, ROOM, HALL, CAVE and SERENE. CAVE and SERENE are the maker's own designs, in which early reflections and late reverberation are layered in multiple stages to build a complex harmonic structure, producing a transparent and spatial reverb.

  Dry signals pass through the unit from input to output as analog signals and are mixed with the reverb at an internal analog mixer, so the original sound quality is preserved at the output. The HTS (Holistic Tonal Solution) circuit manages the signal comprehensively from input to output, so the sound character does not change when the effect is switched on or off.

  Up to four settings of all the knobs can be stored as presets, and those four presets can be recalled by MIDI program change numbers. Controls are PRE DELAY, DECAY, TONE, MIX and MODE, with an INST (-10 dB) / LINE (+4 dB) level select switch and a KILL DRY switch.

  The unit takes stereo or mono input and output on four 1/4 inch jacks and fits in a 120 x 102.3 x 58.5 mm enclosure at around 385 g.
specs: |-
  - Number of presets: 4
  - Six reverb modes: SPRING, PLATE, ROOM, HALL, CAVE, SERENE
  - Input impedance: INST min. 1 MOhm, LINE min. 300 kOhm
  - Output load impedance: min. 10 kOhm
  - Maximum input level: INST +3 dBu, LINE +11 dBu
  - Controls: PRE DELAY, DECAY, TONE, MIX, MODE, INST (-10 dB) / LINE (+4 dB) level select switch, KILL DRY switch
  - Terminals: 4 x 1/4 inch phone jacks for L (mono) / R input and L (mono) / R output, 1 x DIN 5-pin MIDI IN, 1 x DC 9V input jack for AC adapter
  - Power supply: 9V DC centre negative polarity
  - Current consumption: approx. 280 mA
  - Dimensions: 120 x 102.3 x 58.5 mm or 4.72 x 4.03 x 2.3 inches including protrusions such as footswitches and jacks
  - Weight: approx. 385 g or 0.85 lbs excluding accessories
  - 32-bit dual core chip with 32-bit high precision DSP
  - Analog dry path with internal analog mixer
  - HTS (Holistic Tonal Solution) circuit
  - Four presets recallable by MIDI program change
  - Accessories: warranty card, owner's manual, 4 rubber feet
