details: |-
  The 2025 Fullerton Deluxe JB bundles classic combinations from the G&L Option Order menu, each with an alder body for rich, traditional tone and paired with a pickguard that sets off the color just right. That elegance continues up the neck with the G&L polished Natural Satin neck.

  Players fond of the old adage "if it ain't broke" have not played a JB. The G&L JB is all about refinement, blending "holy grail" Alnico single-coil tone with modern improvements and superb craftsmanship.

  This JB projects a time-honored yet subtly progressive vibe, embracing the past yet unafraid of moving forward. The slim, hard-rock maple neck features an easy-playing vintage gloss finish, while its comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets deliver silky playability. What's more, the JB features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
