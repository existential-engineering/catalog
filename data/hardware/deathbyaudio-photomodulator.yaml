description: Stick it where the sun does shine! The PHOTO MODULATOR is a
  compact, light-sensitive controller that allows you to manipulate expression
  pedal-compatible effects using any light source.
details: |-
  The PHOTO MODULATOR is a compact, light-sensitive controller that manipulates expression pedal-compatible effects using any light source. Shine a bright light such as a strobe, flashlight, stage light, or lava lamp onto the sensor to sweep your effect one way, and cover it in shadow to sweep the other. It works just like an expression pedal, where light is toe down and dark is heel down, and it requires no batteries. Housed in a right-angle 1/4" jack for an ultra-small footprint, it is easy to aim the sensor at your desired light source.

  Using a passive photoresistor circuit, it lets almost any expression pedal-compatible pedal be manipulated by light, so it can connect to the ROOMS, EVIL FILTER, the CROSSOVER FUZZ, and many other expression-control pedals.

  Regulatory Notice: The PHOTO MODULATOR contains a cadmium-sulfide-based photoresistor. Due to the presence of this material, it is not compliant with EU Directive 2011/65/EU (RoHS), UK RoHS, China RoHS, K-RoHS (Korea), or Taiwan RoHS, and as a result it cannot be sold, shipped, or distributed in the European Union, the United Kingdom, China, Korea, or Taiwan. It is also not covered by the lifetime warranty, as it is not an effect pedal, but it is eligible for the standard 30-day return policy.
specs: |-
  - Photoresistor: cadmium-sulfide, connected between the tip and ring of the 1/4" jack
  - Resistance: <1k in bright light, >1MΩ in complete darkness
  - A 47kΩ resistor connects the ring to the sleeve, mimicking a passive expression pedal potentiometer
  - Dimensions: 2.6" x 1.9" x 0.6"
  - Weight: 0.09 oz.
