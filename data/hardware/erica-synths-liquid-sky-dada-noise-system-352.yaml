details: |-
  The Liquid Sky Dada Noise System is an experimental sound-lab for musique concrete, ambient noise, abstract sound and sound design, created in cooperation with the Liquid Sky artist collective of Berlin and Portugal. It suits processing field recordings, pads and experimental vocals, building extra terrestrial atmospheres, and generating noise patterns and pads.

  The system is a complete eurorack instrument rather than a single module. Sound sources come from the Black Octasource, the Pico VCO, two Black Code Sources with a Code Source Expander, and Pico Drums, which between them cover conventional oscillators, complex multi-output modulation and percussive material.

  Shaping and modulation are handled by the Black Modulator, the Multimode VCF, the Black Dual EG/LFO, the Black Quad VCA and the Black Joystick, so several voices can be filtered, enveloped and performed by hand at once.

  Processing and routing come from the Fusion Ringmodulator, the Black Mixer, a Mixer/Splitter, the Fusion Delay and the Black Hole DSP2, with the Black Output module providing the interface out of the system.

  Everything ships in a 2x84HP skiff case with an integrated PSU, together with 20 patch cables.
