description: >-
  The DX200 is a programmable desktop synthesizer combining a 6-operator FM
  synthesis engine based on the classic DX7 with a 16-step groove-box sequencer.
  It delivers 16-voice polyphonic FM synth sounds alongside 32 voices of AWM2
  sample-playback for drums, percussion, bass, and rhythm sounds. Designed for
  musicians and DJs, it offers over 120 sounds primarily geared toward
  dance-oriented electronic music production.
details: |-
  The DX200 represents Yamaha's modern take on FM synthesis, incorporating lessons from successful groove machines by Korg and Roland. It combines a 6-operator FM engine with 32 algorithms and an AWM2 sample-playback system, offering a total of over 120 sounds across both engines.

  A significant advancement over classic DX synthesizers is the inclusion of an advanced resonant multi-mode filter with variable 12, 18, or 24 dB/oct slopes and lowpass, highpass, bandpass, and band-reject modes. The filter includes a dedicated envelope generator, with ADSR envelopes controlling both filter and amplitude.

  The sequencer architecture provides one track for FM sounds and three additional tracks for AWM2 rhythms. Patterns can be created live in realtime or carefully programmed in step mode, with the capability to chain patterns into up to 10 songs. Motion control functionality uses a Free EG envelope generator allowing up to 4 tracks of parameter automation, enabling complex, evolving motion.

  The unit also features 13 built-in effects including distortion, delays, reverb, flangers, chorus, phasers, and overdrive, along with 16 rubber pads for hands-on performance and pattern programming.
specs: |-
  - 6-operator FM synthesis engine with 32 algorithms
  - AWM2 sample-playback engine for drums and rhythm sounds
  - 16-voice polyphony (FM), 32-voice polyphony (AWM2)
  - Multi-mode resonant filter (LP, HP, BP, BR) with 12/18/24 dB slopes
  - 16-step sequencer with 4 parts (1 FM + 3 AWM2)
  - 256 preset patterns, 128 user patterns
  - Scene memory (2 per pattern)
  - LFO with 6 waveform types
  - 13 effect types (distortion, delay, reverb, flanger, chorus, phaser, overdrive)
  - Free EG with 4 tracks of parameter automation
  - 16 rubber pads
  - 10 song capacity
  - MIDI IN/OUT with internal/external clock sync
