details: |-
  The 2024 Fullerton Deluxe LB•100 bundles classic combinations from the G&L Option Order menu, each with an alder body for rich, traditional tone and paired with a pickguard that sets off the color just right. That elegance continues up the neck with the G&L polished Natural Satin neck.

  Players fond of the old adage "if it ain't broke" have not played an LB•100. The G&L LB•100 is all about refinement, blending "holy grail" Alnico split-coil tone with modern improvements and superb craftsmanship.

  This LB•100 projects a time-honored yet subtly progressive vibe, embracing the past yet unafraid of moving forward. The slim, hard-rock maple neck features an easy-playing vintage gloss finish, while its comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets deliver silky playability. What's more, the LB•100 features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Pickups: One G&L vintage split-coil Alnico pickup
  - Body wood: Alder
  - Neck wood: Natural Satin Hard Rock Maple with Rosewood and Maple fingerboards
  - Neck profile: G&L 1 5/8" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: One volume control, one tone control
  - Includes: G&L Deluxe Gig Bag
  - Available in: 3-Tone Sunburst over Alder, 3-ply tortoise pickguard, Maple fingerboard
  - Available in: Fullerton Red over Alder, 3-ply tortoise pickguard, Rosewood fingerboard
  - Available in: Jet Black over Alder, 3-ply parchment pickguard, Maple fingerboard
  - Available in: Old School Tobacco over Swamp Ash, 3-ply black pickguard, Rosewood fingerboard
