description: This DWe snare features a 9-ply American Maple shell, wireless triggers, and a digiMAG throw off.
details: |-
  DWe is the first acoustic-electronic, convertible drum set that is playable as both a wireless electronic or a boutique-quality acoustic kit. Built on U.S.-made 100% Maple shells with wireless triggers, DWe is powered by the patented and expandable DrumLink ecosystem that gives drummers and producers the ability to build a hybrid setup one component at a time.

  This 6.5x14″ snare drum ships with a DW Soundworks license, snare wires, and both mesh and mylar drum heads for rapid conversion between electronic and acoustic play. Each wireless trigger is powered by two alkaline AA batteries.

  The shell is a Collector's 333 Maple shell handcrafted from 100% North American Hard Rock Maple, built with DW's patented 333 technique that orients Maple plies in horizontal and vertical grain patterns for low, punchy fundamentals. Converting from electronic to acoustic means removing the DWe trigger star plates with drum key screws and changing the batter head from mesh to the included mylar head.

  The drum carries five zones, and disengaging the digiMag throw-off gives access to five more, for ten sounds in all. Pressure-sensing cross-stick detection allows cross-stick playing to be read naturally, and snare triggering includes positional sensing from the centre of the head to the edge. Triggers combine pressure-sensitive FSRs and piezos, and battery life runs up to a year depending on how often the drum is played.

  DrumLink is a proprietary 2.4GHz wireless protocol designed exclusively for drums, sending small micro packets of data so it is not affected by RF interference, with total system latency measured under 8ms. Sound sources are either a computer running DW Soundworks or a compatible Roland drum module, and the drum also works as a wireless MIDI controller with AAX, AU and VST hosts.
specs: |-
  - 6.5x14″ acoustic-electronic convertible snare drum
  - Collector's 333 Maple shell, 9-ply 100% North American Hard Rock Maple
  - Proprietary DrumLink 2.4GHz wireless system (Patent No. 12,033,604)
  - 5 zones, with 10 sounds available via the digiMag throw-off
  - Pressure-sensing cross-stick detection
  - Positional sensing from centre to edge of the head
  - Triggers combine pressure-sensitive FSRs and piezos
  - Mesh and mylar batter heads included for rapid conversion
  - Chrome graduated triple-flange counter hoops, 3mm on snares
  - Snare wires included
  - Includes DW Soundworks license
  - Powered by two alkaline AA batteries per trigger, battery life up to one year
  - Total system latency measured under 8ms
  - Functions as a wireless MIDI controller with AAX, AU and VST hosts
  - Made in Oxnard, California, USA
