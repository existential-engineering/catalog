details: |-
  A big-sounding microphone module in a small 1U package. Turn your voice, instruments, environmental sounds, or even wild feedback experiments into audio for your Eurorack system.

  MEMS Microphones are constructed with a Micro-Electro-Mechanical System (aka MEMS) component, placed on a printed circuit board and protected by a mechanical cover. They are extremely small, and can be found in many modern electronic devices e.g. phones, tablets, cameras etc. Despite their compact size, they have a very flat response across a large frequency range (~6Hz to 20kHz) which makes them excellent for musical applications.

  Identical features and functionality to the 3U version but in 1U format. MEMS omni microphone with flat frequency response. Output level can be controlled via slider and/or CV input; when modulating with CV, the slider becomes an attenuator. Patch and modulate two independently for stereo effects. Activity (green) and overload (red) indicator LEDs. Fixed low-frequency roll-off switch (180Hz, 6dB/oct).
specs: |-
  - Width: 10HP
  - Depth: 35mm
  - Power: 19mA @ +12V, 19mA @ -12V
  - Capsule: MEMS
  - Pattern: Omni
  - Range: 6Hz ~ 20kHz
  - SNR: 63dBA
  - Sensitivity: -45dB ±2dB @ 94dB SPL, 130dB SPL Acoustic Overload Point
  - Fixed low-frequency roll-off switch (180Hz, 6dB/oct)
