description: The Fractal Audio FM3 is an all-in-one Amp Modeler, Multi-FX
  Processor and Foot Controller featuring Fractal Audio Amp Models, Cab Sims,
  and Effects.
details: |-
  The FM3 is a compact all-in-one processor for guitar, bass, and other instruments. It features Fractal Audio's industry-leading Cygnus X2 amp modeling, UltraRes and DynaCab speaker cab simulation, plus an incredible collection of legendary stompbox and studio effects, all based on the award-winning flagship Axe-Fx III. The unit is also a powerful foot controller with all of the programmable features of the larger FC controllers, plus a 4x4 USB audio interface, all in a compact, rugged, floor unit designed for the studio or stage.

  The FM3 Mark II Turbo was released in July 2023. This advanced and compact floor unit builds on the success of the original FM3, now boasting over 10% more DSP power and larger, easier-to-read footswitch displays. The Turbo DSP allows the creation of more complex presets, going beyond the limits of the standard FM3. The footswitch display size upgrade is significant, with the height of individual characters of text doubling, as well as being presented in a bolder and more readable font. Overall product dimensions and weight remain the same as the original version.

  CYGNUS X2 Amp Modeling, a technology developed for the Axe-Fx III, captures the sound and the feel of real tube amps, with 300+ models offering a range of clean tones, edge of breakup, and everything from warm, touch-sensitive overdrive to modern distortion. The FM3 also includes the entire speaker cab impulse response collection from the Axe-Fx III, with 2,200+ factory choices and 1,024 user locations to store custom cabs. Firmware 7 adds DynaCab technology, giving a visual mic-on-cab tone shaping experience.

  As a multi-effects unit the FM3 includes a selection of Fractal Audio's effect algorithms: drive pedals, dozens of delays, reverbs, compressors, EQs, phasers, flangers and other modulation effects, a looper, and more. The block inventory of the FM3 is based on that of the Axe-Fx III.

  With a USB connection to a Mac or PC the FM3 works as a 4x4 audio interface for playback, recording, and re-amping, letting it double as the hub of a portable recording studio. USB channels are mapped for ease of use: to record the processed stereo output, record inputs 1 and 2 in the computer, while computer inputs 3 and 4 can capture a DI or record input 2 L+R in stereo. USB also allows 2-way communication with the companion FM3-Edit and Fractal-Bot software.

  The FM3 is housed in a durable steel chassis with protective endcaps designed to withstand the rigors of touring. Three onboard footswitches, each with a variable-color LED ring and mini LCD display, provide tap and hold functions that can be customized across eight switch layouts, and the Views feature creates a virtual 12-button controller with a 3-button footprint. A FASLINK II port allows up to two FC-12 or FC-6 foot controllers to be connected. The unit is powered by a 3-Core Griffin DSP with one ARM and two SHARC+ cores, plus a dedicated graphics processor so the main DSPs stay focused on audio tasks.
specs: |-
  - Compact floor unit with three onboard footswitches
  - 3-Core Griffin processor (one ARM, two SHARC+ cores) plus dedicated GPU
  - Over 10% more DSP power than the standard FM3 (Turbo configuration)
  - Cygnus X2 amp modeling developed for the Axe-Fx III, 300+ amp models
  - UltraRes and DynaCab speaker cab simulation
  - 2,200+ factory cab impulse responses plus 1,024 user cab slots
  - Multi-effects block inventory based on the Axe-Fx III
  - Looper, drives, delays, reverbs, compressors, EQs, phasers, flangers and other modulation effects
  - Ultra-low noise instrument input plus XLR stereo main outputs
  - Additional stereo I/O pair, plus headphone and S/PDIF outputs
  - 4x4 USB audio interface for playback, recording and re-amping
  - 2 onboard switch/pedal jacks
  - MIDI In and MIDI Out/Thru
  - FASLINK II port for up to two FC-12 or FC-6 foot controllers
  - Three footswitches with variable-color LED rings and mini LCD displays, eight switch layouts plus Views
  - Precision tuner with graph and virtual strobe displays
  - Rugged steel chassis with protective endcaps and handles
  - Upgradeable firmware
  - Free FM3-Edit editor software and Fractal-Bot over USB
