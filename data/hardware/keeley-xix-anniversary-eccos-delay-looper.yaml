details: |-
  The XIX Anniversary ECCOS Delay Looper is the nineteenth anniversary edition of the ECCOS, offered for the first time in a black reverse colourway and limited to 100 units.

  The ECCOS pairs a true-stereo delay with a looper. The delay is a neo-vintage design offering detailed control over tape-style echoes, including long tape flanged delay lines, and runs on a Quad 24/56-bit Dream DSP developed over four years. Dual footswitches serve true bypass, tap tempo and runaway feedback in delay mode, and record, play, reverse, half-speed and play-once functions in looper mode.

  Sound on Sound mode records new layers without erasing the original loop, with loop volume degrading over time in the manner of reel to reel tape. The decay amount is set by holding the FDBK knob while adjusting the Depth control.

  Switching between the two halves is independent, so the delay and the looper can each be turned on and off separately and the looper can run with no delay set. The page links the updated ECCOS manual, dated May 26, 2020, and embeds a number of third-party demo videos plus a photo diary of the first production run.
