url: https://www.herzlichlabs.com/products/dual-tachycardia-passive-dual-gate-to-62960
description: A passive Eurorack module with two independent gate-to-trigger
  generators and bypass switches. It truncates gate or other signals into short
  trigger pulses.
details: |-
  You've been here before - it's like unwrapping a gift that's nearly, but not quite what you wanted. You wanted triggers, and you got gates. But now, there is finally a solution - the Herzlich Labs Dual Tachycardia. Borrowing from the 1U format, this new line of 0hp (and of course also 1U) products seek to improve upon the 0hp formula in several ways. The products are first of all fully enclosed, eliminating the risk of shorting exposed pins to something important, as well as offering a more pleasant device to hold. The format also allows for larger knobs to improve control and precision in use, and can flexibility be integrated in large or small setups, or even expanded into larger rows of units. The Dual Tachycardia is an evolution of the old 0hp Tachycardia module, with no less than two independent gate to trigger generators and bypass switches to interrupt the trigger generation at any given time, to resume enjoying those gate signals. Quickly and brutally truncate a signal or sound into a short blip rather than a prolonged bleep. The Dual Tachycardia only permits signals to pass for a brief moment, before rejecting it outright, allowing you to generate trigger signals from almost any source! Why not generate a drum pattern from a protracted math lecture, or perhaps use sounds in your system as triggers for other things? It is incidentally also the perfect companion to the Behringer 2600, and is beloved by many users of this device - in fact, I'm quite sure I once heard someone whisper "the one thing they forgot to ship with the unit." Close those gates, get trigger happy and set your heart aflutter with Herzlich Labs.
