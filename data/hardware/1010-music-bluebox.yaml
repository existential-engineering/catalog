description: Bluebox is the portable digital audio mixer that integrates your
  electronic music gear. Connect your eurorack, sampler, drum machine and
  synthesizer outputs to 6 stereo, 3.5 mm TRS inputs and map them to 12 mono
  tracks or 6 stereo tracks, all with independent control for recording and
  playback. It's that keyboard mixer with live performance features that you
  always hoped someone would make.
details: |-
  Connect the output of your electronic music gear to bluebox, and then route each track independently to three outputs and effects sends. Each track offers control of volume, gain, 4-band parametric EQ, pan, mute and solo functions. Apply high-quality global reverb and delay effects along with 4-band EQ per track to add new depth to your sound, with total control to quickly tweak incoming audio or track playback as needed.

  With bluebox you can record independent tracks or the Main mix to a standard microSD card, capturing a jam session for later review or recording the ultimate mix of the tracks for a song. Its compact 5.5" x 5" x 2" case tucks into a crowded tabletop studio or a gig bag for travel.

  A dynamic 3.5" touch screen interface works alongside physical knobs, navigation buttons and transport buttons for quick access to the most important functions, and MIDI input/output lets you sync the clock with external gear for synchronized effects and metronome.
specs: |-
  - Mixes 12 mono or 6 stereo tracks (or a mix of both)
  - 6 stereo 3.5mm TRS inputs
  - 3 stereo 3.5mm TRS outputs: Main mix, Assignable sub-mix, and Headphone
  - Supports Eurorack levels up to +/-5V on inputs and outputs
  - MIDI control via TRS or USB-A host input
  - USB class-compliant stereo audio interface over USB-B (no driver needed for Mac, PC, iOS, Android)
  - 3.5-inch touch screen, 4 knobs, 8 navigation buttons, 3 transport buttons
  - Built-in reverb, delay, and global compressor
  - Records and plays back 48kHz, 24-bit WAV files to microSD card
  - 4-band parametric EQ per track (Low Cut/Low Shelf, Parametric, High Shelf/High Cut)
  - Dimensions: 5.5" x 5" x 2" (14 x 13 x 5 cm)
  - Weight: 1 lb (450 g)
  - Durable metal case
  - Current firmware: version 1.2.33
