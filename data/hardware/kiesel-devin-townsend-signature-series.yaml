details: |-
  Working with the acclaimed Devin Townsend, Kiesel Guitars meticulously designed and crafted the guitar into a compact, unique, headless instrument. The model is offered on one page in two editions, the Neo (also presented as the Circle) and the Om; this entry is the Neo.

  The Neo is a color-finished, 27-fretted guitar with a single Devin Townsend Fishman pickup and the circle inlay. Both Neos feature a counterweight, custom-covered Hipshot bridge, Dunlop flush-mounted strap locks, and a recessed jack.

  The body is mahogany with a carved plain maple top, carried on bolt-on construction, over a short 29 inch overall length, 1.66 inch body thickness and 11.25 inch body width, for a 6.6 lbs instrument.

  The neck is tung-oiled roasted maple with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, over a Richlite Diamond Black fingerboard at a 14 inch radius.

  Electronics are active with push/pull voicing, driving a direct-mount active Devin Townsend signature Fishman bridge pickup.
specs: |-
  - Headless signature instrument, the Neo edition; the Om edition is a separate entry
  - Construction: bolt-on
  - Body: mahogany with a carved plain maple top
  - Neck: roasted maple, tung-oil finish, with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: Richlite Diamond Black with 14 inch radius
  - Frets: 27 stainless jumbo, .110 inch wide x .055 inch tall
  - Scale length: 24.75 inch (6-string) or 25.5 inch (7-string) as listed on the page
  - Pickups: direct-mount active Devin Townsend signature Fishman bridge pickup
  - Electronics: active electronics with push/pull voicing; active circuits run on an internal battery rather than an external supply
  - Output jack: recessed
  - Bridge: custom covered Hipshot fixed bridge, .4125 inch (10.5 mm) spacing (6-string), or Hipshot/Kiesel tremolo system (7-string) as listed on the page
  - Inlays: custom Neo circle inlay with standard black-ring Luminlay Super Blue side dots
  - Logo: red Kiesel logo
  - Hardware: black with satin red knob
  - Strap locks: Dunlop flush mount
  - Neck width: 1.69 inch wide at the nut, 0.76 inch thick at the 1st fret, 0.85 inch thick at the 12th fret
  - Dimensions: 29 inch long, 1.66 inch body thickness, 11.25 inch wide body
  - Weight: 6.6 lbs
  - Strings: Elixir Nanoweb 1046E
  - Counterweight fitted
