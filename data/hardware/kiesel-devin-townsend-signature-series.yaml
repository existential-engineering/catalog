details: |-
  Working with the acclaimed Devin Townsend, Kiesel Guitars meticulously designed and crafted the guitar into a compact, unique, headless instrument.

  The Om highlights a natural aesthetic and features 32 frets, three Kiesel S60A pickups paired with custom switching, and the Om inlay. The Neo features a counterweight, custom-covered Hipshot bridge, Dunlop flush-mounted strap locks, and a recessed jack.

  The body is mahogany, carried on bolt-on construction, with a carved plain maple top on the Neo and a carved poplar burl top on the Om, over a short 29 inch overall length, 1.66 inch body thickness and 11.25 inch body width, for a 6.6 to 6.75 lbs instrument.

  Necks are roasted maple on the Neo and roasted flamed maple on the Om, both tung oiled with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, over a Richlite Diamond Black fingerboard on the Neo and an ebony fingerboard on the Om, each at a 14 inch radius.

  Electronics are active with push/pull voicing, a stacked volume and tone control and a 5-way Super Switch, driving a direct-mount active Devin Townsend signature Fishman bridge pickup on the Neo and direct-mount passive Kiesel S60A single coils in a stacked single-single-single configuration on the Om.
specs: |-
  - Headless signature instrument offered in two forms on one page, the Neo and the Om
  - Construction: bolt-on
  - Body: mahogany with a carved plain maple top (Neo) or mahogany with a carved poplar burl top (Om)
  - Neck: roasted maple (Neo) or roasted flamed maple (Om), tung-oil finish, with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: Richlite Diamond Black with 14 inch radius (Neo) or ebony, less color variation, with 14 inch radius (Om)
  - Frets: 27 stainless jumbo (Neo) or 32 stainless jumbo (Om), .110 inch wide x .055 inch tall
  - Scale length: 24.75 inch (Neo) or 25.5 inch (Om)
  - Pickups: direct-mount active Devin Townsend signature Fishman bridge pickup (Neo) or direct-mount passive Kiesel S60A single coils in a stacked single-single-single configuration (Om)
  - Electronics: active electronics with push/pull voicing, stacked volume and tone control, 5-way Super Switch; active circuits run on an internal battery rather than an external supply
  - Output jack: recessed
  - Bridge: custom covered Hipshot fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot/Kiesel tremolo system
  - Inlays: custom Neo circle inlay with standard black-ring Luminlay Super Blue side dots (Neo), or roasted flamed maple Om inlay with roasted flamed maple 2 mm side dots (Om)
  - Logo: red Kiesel logo (Neo) or engraved Kiesel logo (Om)
  - Hardware: black with satin red knob (Neo) or black (Om)
  - Strap locks: Dunlop flush mount
  - Neck width: 1.69 inch wide at the nut, 0.76 inch thick at the 1st fret, 0.85 inch thick at the 12th fret, on both forms
  - Dimensions: 29 inch long, 1.66 inch body thickness, 11.25 inch wide body
  - Weight: 6.6 lbs or 6.75 lbs depending on form
  - Strings: Elixir Nanoweb 1046E
  - The Neo adds a counterweight
