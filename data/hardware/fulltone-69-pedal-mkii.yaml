description: A germanium fuzz pedal with two hand-picked transistors offering
  fat, harmonic tone that cleans up with the guitar's volume control. It
  features a Contour knob for midrange, harmonics and sustain, plus an internal
  trimmer for clipping symmetry.
details: |-
  This is how you wished your Fuzzface sounded... Fat and Harmonic. And it cleans up like a vintage Fender amp when you turn down your guitar's volume control. The Rolling Stones and the Black Crowes have discovered this trick. If you love the first 2 Hendrix releases then you'll love this pedal, with 2 Germanium transistors hand-picked and tested for optimum performance. A Contour Knob lets you dial in Midrange, Harmonics and Sustain, also an Input Bias knob that takes out the "woofiness" and gives great Overdrive/Distortion sounds when its level is reduced. An Internal Trimmer allows for adjustment of Clipping Symmetry, Harmonics, and Tracking. Specifications subject to change at any given moment due to availability... and whimsy. True-Bypass w/LED is standard equipment to preserve tone when the pedal is off! Eric Johnson says of his '69... "Of all the pedals I've been sent... I like this one the best!" (Guitar World magazine)
