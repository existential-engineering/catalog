description: Wired in-ear headphones on a 3.5 mm cable, with a built-in microphone
  and remote for calls.
details: |-
  Mode delivers huge sound in a small package. Custom-tuned dynamic drivers produce rich, powerful audio. Mode's unique design anchors to your ear and the four ear tip sizes allow you to find the right fit for you. Mode headphones also come equipped with a built-in microphone and remote.

  The feature set is deliberately simple: iconic Marshall design, a built-in microphone and remote, a customisable fit, a tangle-resistant cable and a durable connection.

  These are wired headphones, and the microphone for phone calls sits on the 3.5 mm cable, so calls can be answered without reaching for the phone.

  Ear tips are supplied in S, M and L so the in-ear fit can be matched to the wearer, and replacements can be requested from Marshall customer support.

  Designed and engineered in Sweden. Made in China.
specs: |-
  - Headphone type: In-ear, wired
  - Driver type: Dynamic
  - Drivers: 9 mm
  - Driver sensitivity: 97 dB SPL
  - Driver impedance: 34 Ohm
  - Frequency range: 20 to 20,000 Hz
  - Connectivity: wired
  - Wired connectivity: 3.5 mm input
  - Microphone and remote: Yes, on the 3.5 mm cable
  - Passive, unpowered design: no battery and no power input
  - Weight: 17 g / 0.60 oz
  - Water resistance: No
  - Foldable design: No
  - Interchangeable ear tips supplied in multiple sizes
