description: >
  The KeyLab mk3 combines a professional, human-centered design with all the benefits of a fully-featured MIDI controller.
details: |-
  Keylab mk3 is an advanced MIDI controller designed for professional music production and live performance, featuring a pro-grade 61-note semi-weighted keybed with redesigned aftertouch, touch-sensitive controls, and innovative creative features. The keyboard combines durable high-quality construction with an elevated playing experience, offering seamless integration with software and hardware instruments. Whether used in the studio or on stage, keylab mk3 delivers a high-quality instrument built without compromise that musicians can rely on for every creative endeavor.

  The controller features nine touch-sensitive 360-degree rotary potentiometers and nine touch-sensitive 50mm faders for precise sound manipulation and DAW control, complemented by 12 velocity and pressure-sensitive rgb pads for triggering clips, drums, and samples. A bright 3.5-inch full-color display with 8 contextual buttons provides real-time feedback and intuitive navigation of sounds and projects. Advanced creative tools include a multi-mode arpeggiator with hold function, chord play mode with smart voicing for creating rich chords with single keys, and scale mode that locks the keybed to built-in scales to prevent wrong notes.

  Keylab mk3 offers deep software integration with all major daws through advanced connectivity and custom scripts, including seamless integration with analog lab v and v collection instruments for sound selection and preset browsing. The controller supports mcu/hui protocols for compatibility with virtually any DAW, plus nks-compatibility with the native instruments komplete kontrol ecosystem. Adaptive mapping allows real-time tweaking of sound settings, launching clips and scenes, and project navigation without leaving the controls, enabling musicians to stay in creative flow.

  Performance controls include pitch bend and modulation wheels for expressive sound manipulation, transpose controls for shifting by semitones or full octaves, and a hold function for sustaining notes, chords, or arpeggios after key release. Bank, program, and MIDI channel switching buttons provide quick access to different sounds and settings, while transport controls and DAW commands offer full recording software control. The redesigned keybed features hybrid-feel keys with release-velocity sensitivity and optimized weighting and spring tension for capturing every nuance of performance.

  Connectivity options include USB-c for bus-powered connection to computers, MIDI 5-pin din output for controlling external MIDI-compatible gear like synths and drum machines, and a pedal input supporting sustain, modulation, expression, and auxiliary functions. The construction utilizes high-density plastic with ruggedized knobs and real-wood paneling as standard, designed to withstand professional use and stand the test of time. Every unit undergoes 180 individual tests to guarantee impeccable, long-lasting performance, with available 49-key and 61-key options in black or white finishes for different studio and stage setups.
specs: |-
  - 61-note semi-weighted keybed with aftertouch
  - 9 touch-sensitive 360-degree rotary potentiometers
  - 9 touch-sensitive 50mm faders
  - 12 velocity and pressure-sensitive rgb pads
  - 1 clickable encoder
  - 8 transport switches
  - 4 command switches
  - Pitch bend and modulation wheels
  - Transpose controls (semitones and octaves)
  - Full-color 3.5-inch 320x480px display with 8 contextual buttons
  - Multi-mode arpeggiator with hold function
  - Chord play mode with smart voicing
  - Scale mode with built-in scales
  - Adaptive mapping for real-time control
  - MIDI 5-pin din output
  - Pedal input (sustain, modulation, expression, aux-in)
  - USB-c connectivity (bus-powered)
  - Mcu/hui protocol support
  - Nks-compatible (native instruments komplete kontrol)
  - Advanced integration with fl studio, logic pro, ableton live, cubase, bitwig studio
  - Up to 6 user presets
  - Hybrid-feel release-velocity-sensitive keys
  - High-density plastic construction with ruggedized knobs and real-wood paneling
  - Dimensions: 787 x 72 x 280 mm (30.98 x 2.83 x 11.02 inches)
  - Weight: 6.1 kg (13.45 lb)
  - Windows 10+ (64-bit) compatible
  - Macos 11+ compatible
  - 4gb ram minimum
  - 4-core cpu 3.4 ghz (4.0 ghz turbo-boost) or m1 cpu
  - 3gb free hard disk space
  - Opengl 2.0 compatible gpu
