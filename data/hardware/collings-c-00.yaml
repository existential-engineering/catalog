description: The C-00 is a soulful, vintage-inspired 14-fret parlor acoustic
  guitar influenced by iconic 00 models from the early-to-mid 1930s. It delivers
  a drier, more fundamental tone with honky, punchy midrange suited for blues,
  folk, and fingerstyle playing. The instrument emphasizes raw character over
  polish, featuring woody thump and exceptional note separation.
details: |-
  The C-00 is a 14-fret parlor acoustic guitar that draws inspiration from iconic 00-style instruments of the early-to-mid 1930s. It is voiced to produce a drier, more fundamental tone with a honky, punchy midrange that excels in blues, folk, and fingerstyle contexts. The top is hand-voiced Sitka spruce backed by Honduran mahogany back and sides, braced with a custom C-00 X-brace pattern featuring an abbreviated soundboard graft (tongue brace). The mahogany neck features a full V profile with a compound 14"-26" fingerboard radius and a 24 7/8" scale length. Construction uses a mortise & tenon hybrid neck joint and fully adjustable truss rod. Appointments lean vintage throughout: nickel Waverly tuners with oval ivoroid buttons, bone nut and saddle, ivoroid bridge pins and end pin, tortoise pickguard, ivoroid body binding, and a haircut peghead profile with an ebony veneer and gold MOP Collings logo.
specs: |-
  - Top: Sitka spruce (hand-voiced)
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Rosewood with MOP dots
  - Bridge: Rosewood straight-style, 2 5/16" spacing
  - Tuners: Nickel Waverly with oval ivoroid buttons
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cut-through
  - Bridge Pins/End Pin: Ivoroid
  - Pickguard: Tortoise
  - Frets: Medium 18% nickel-silver
  - Neck Profile: Full V with rounded fingerboard edge
  - Fingerboard Radius: 14" - 26" compound
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Brace Pattern: Custom C-00 X-brace with abbreviated soundboard graft (tongue brace)
  - Brace Material: Sitka spruce
  - Peghead Veneer: Ebony with gold MOP Collings logo
  - Peghead Profile: Haircut
  - Body Binding: Ivoroid
  - Rosette: Ivoroid with b/w purfling
  - Backstrip: 1-style (Walnut)
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Scale Length: 24 7/8"
  - Body Width: 14 3/4"
  - Body Length: 19 1/4"
  - Body Depth: 4 1/4"
  - Total Length: 40"
  - Strings: D'Addario EJ-16 (.012" - .053")
