description: Jellymix is a compact stereo performance mixer designed for
  electronic musicians. Connect your favourite synths, drum machines, modules,
  and grooveboxes to the five stereo input channels. Shape your sounds live with
  channel EQ, the dual stereo resonant filters, and stereo effects on the two
  stereo AUX busses. The tactile and inviting interface of Jellymix is perfect
  for knob twiddling, switch flicking, and/or button pushing your way to new
  sonic joys and dubby dreams; live on stage, your living room, or in the
  studio.
details: |-
  Jellymix is a compact stereo performance mixer designed for electronic musicians. Connect your favourite synths, drum machines, modules, and grooveboxes to the five stereo input channels. Shape your sounds live with channel EQ, the dual stereo resonant filters, and stereo effects on the two stereo AUX busses.

  Five Stereo Channel Strips: Input gain up to +26dB, Eurorack levels welcome, Hi-Z Instrument mode (Channel 1 only), switchable 150Hz LO CUT, Tilt EQ with 810Hz center (±10dB), dual stereo aux sends with selectable PRE/OFF/POST routing, MAIN/FILTER routing switch, and clickless MUTE with LED indicator.

  Main / Filter Bus: Dual stereo SVF MAIN filters with clickless bypasses, Low Cut (HPF) and High Cut (LPF) controls, assignable filter resonance (Low/High/Both), MAIN level control with soft clipping and LED meter, and a headphone output with selectable source (MAIN or MUTED bus).

  Eurorack Levels Accepted: Stop mixing on tiny controls in the rack, regain the space and add dual stereo sends to your modular patching. Intellijel 1/4" to 3.5mm patch cables available separately.

  All-analog design with high-quality, durable construction: Neutrik jacks, Alpha pots, Salecom sealed switches, Sound Semiconductor VCAs, and low-noise/low-distortion op-amps throughout.
specs: |-
  - 5 stereo channel strips with balanced 1/4" line inputs and clickless mutes (mono L>R normalling)
  - 2 stereo balanced AUX Sends (PRE/POST w/ mono sum normalling)
  - 2 stereo balanced EXT inputs (summed to MAIN bus, usable as AUX Returns)
  - Hi-Z Instrument input mode on Channel 1
  - Stereo SVF master filters with separate LO CUT/HI CUT, dedicated resonance (Q), clickless bypass
  - All-analog: Neutrik jacks, Alpha pots, Salecom sealed switches, Sound Semiconductor VCAs, low-noise/low-distortion op-amps
  - Dimensions: 277mm x 122mm x 66mm (10.9" x 4.8" x 2.6"), including feet/knobs
  - Power: 12V DC/2A min., 2.1mm center-pin-positive (DC PSU included: MEAN WELL 30W 12VDC/2.5A)
  - Maximum Output Level: +26dBu Balanced / +20dBu Unbalanced
  - Residual Noise (all channels muted): -100dBu A-weighted, 20Hz–20kHz
  - Frequency Response: ±0.5dB 20Hz–20kHz
  - Inter-channel Crosstalk: <-94dB (1kHz +4dBu)
