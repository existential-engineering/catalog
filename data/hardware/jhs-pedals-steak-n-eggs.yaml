description: The JHS Pedals Steak & Eggs is a 2-in-1 collaboration with Keeley
  Electronics pairing a high-gain modified Morning Glory overdrive with a
  three-knob Keeley Compressor featuring a blend control, with a center toggle
  to select signal chain order.
details: |-
  JHS Pedals and boutique guitar pedal legend Keeley Electronics have teamed up to bring you a 2-in-1 collaboration of two essential circuits with a few delicious surprises.

  The Steak & Eggs is a perfect pairing of overdrive and compression that you may never turn off. The ingredients of the dish are a modified JHS Pedals Morning Glory and a modified Keeley Electronics Compressor, both of which can only be found in this offering.

  The left side is the JHS Pedals Morning Glory circuit with a new gain setting that has never before been available in a previous version of the circuit. The gain switch works two different ways in correspondence with the drive control. When the drive control is below 80% the toggle adds headroom and punch, when the drive control is maxed it adds more dirt, saturation and gain to the circuit for the most available drive ever in the circuits history. The standard bright cut toggle everyone is familiar with is still available via an internal dip switch.

  The right side of the Steak & Eggs is a new three knob version of the classic Keeley Electronics Compressor. The Compressor features a blend control which allows players to blend back in their original unaffected signal for very punchy tones and the tenderest compression available. An all new mid and treble emphasis circuit has been incorporated in this design as well. The "Bright Switch" is also new to the Keeley Compressor. The compressor also features a fast release time allowing players to experience all the warmth and sustain of the earlier Keeley designs yet retain clarity in note definition. An internal DIP switch gives the classic Keeley spongy, tube-like compression sound.

  In the center you will find a toggle to select the order of the effects. When the toggle is to the right, the Compressor is first. When the toggle is to the left, the Morning Glory is first.

  Modifications by Josh Scott and Robert Keeley. PCB layout, powder coating, printing and drilling by Keeley Electronics in Edmond, OK. PCBs populated by Cusack Music in Holland, MI. Final assembly by JHS Pedals in Kansas City, MO. 100% made-in-USA.
