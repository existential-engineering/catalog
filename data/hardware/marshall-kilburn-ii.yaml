details: |-
  Kilburn II offers 20+ hours of portable playtime on a single charge and utilises True Stereophonic, a unique form of multi-directional sound from Marshall. This stout-hearted hero weighs only 2.5 kg and is the loudest speaker in its class. Kilburn II has a solid metal grille and a guitar-inspired carrying strap for easy portability. Designed and engineered in Sweden. Made in Thailand.

  Marshall signature sound: Kilburn II produces a clear midrange, deep bass and extended highs. Its top panel features analogue control knobs for bass, treble and volume, allowing you to fine-tune to the exact sound you desire.

  True Stereophonic (360 degree sound): this stout-hearted hero utilises True Stereophonic, a unique form of multi-directional sound from Marshall. Experience absolute 360 degree sound where every spot is a sweet spot. Powered by 36 watts, its pronounced and articulate sound pushes the boundaries for a speaker of this size.

  Iconic and rugged design: Kilburn II features flush-mounted corner caps and a water-resistant design that make it rugged and durable, perfect for whatever adventure comes your way. It is encased in vinyl and features a solid metal grille and the iconic Marshall script.

  20+ hours of portable playtime: Kilburn II weighs just 2.5 kg and offers 20+ hours of portable playtime on a single charge. You can track the speaker's battery life with the visual battery indicator located on the top panel of the speaker. Its IPX2 rating means it is able to withstand a little water, and its compact size and guitar-inspired carrying strap make it easy to take with you.
specs: |-
  - Marshall signature sound
  - True Stereophonic (360 degree sound)
  - 20+ hours of portable playtime on a single charge
  - Water-resistant: IPX2
  - Iconic and rugged design with carrying strap
  - Driver type: dynamic
  - Frequency range: 52 to 20,000 Hz
  - Adjustable bass and treble controls: analogue controls on the speaker
  - Stereo/mono: stereo
  - Maximum sound pressure level: 100.4 dB at 1 m
  - Cabinet principle: bass-reflex
  - Power amplifiers: one 20 W Class D amplifier for the woofer, two 8 W Class D amplifiers for the tweeters
  - Wireless connectivity: Bluetooth 5.0
  - Wired connectivity: 3.5 mm input
  - Bluetooth range: 10 m / 30 ft
  - Supports aptX, does not support AAC
  - Top panel controls: Bluetooth button, power/volume knob, bass knob, treble knob, battery indicator
  - Wi-Fi: no
  - Microphone system: no
  - Voice command: no
  - Not supported by any Marshall branded app, and cannot be paired with other Marshall speakers
  - Weight: 2.5 kg / 5.5 lb
  - Width: 243 mm / 9.57"
  - Height: 162 mm / 6.42"
  - Depth: 140 mm / 5.51"
  - Mains input voltage: 100 to 240 V
  - Mains frequency: 50 to 60 Hz
  - Country of origin: designed and engineered in Sweden, made in Thailand
  - Box contents: Kilburn II portable stereo loudspeaker, power cord, quick start guide, legal and safety information
