details: |-
  [em-uh-ser-ee] Anatomy. Sending or coming out, as certain veins that pass through the skull and connect the venous sinuses inside with the veins outside. Built from the ground up, Walrus Audio has developed a new 2-in-1 boost to help make leads stand out, slides sing, finger picking come to life and push tube amps into great natural breakup. Like the veins it's named after, the Emissary Parallel Boost features two independent boost circuits running in parallel to work together to help give your tone a real “sinus clearing experience”. Use one or the other by itself, or mix any combination of both by turning up each knob to the desired level. The top knob controls the volume for the “bright” boost circuit. This is a clean, high headroom JFET boost, with a slight emphasis on higher frequencies to liven up your tone. The bottom knob controls the volume for the “mid” boost circuit. This circuit features a targeted boost at either 1kHz or 800Hz selected by the toggle switch. The bypass switch also features a momentary function. When the bypass switch is in the off position, press and hold to temporarily activate the effect. Releasing the switch turns the effect off.
