url: https://www.engl-amps.com/shop/heads/engl-e633bo-kt77-fireball-25-blackout/
description: All-valve 25 W two-channel high-gain guitar amplifier head in the
  all-black Fireball Blackout series, fitted with KT77 output valves, a
  valve-buffered serial FX loop, noise gate and powersoak.
details: |-
  The Fireball has long been a benchmark for high-gain guitar tone. Now, ENGL Amplifiers introduces the Fireball Blackout Series, a striking new all-black edition of one of its most iconic amplifiers.

  Combining the legendary Fireball sound with a bold new aesthetic, the Blackout Series delivers the tight low end, cutting mids, and articulate high-gain performance that have made the Fireball a favorite among guitarists worldwide.

  Hand-crafted in Germany and built to ENGL's uncompromising standards, the Fireball Blackout Series is designed for players who demand both exceptional tone and unmistakable style.

  This configuration delivers 25 watts from two KT77 output valves and four ECC83 (12AX7) preamp valves, over two channels (Clean and Lead) with per-channel gain, a three-band EQ, Presence, Lead Volume and Master controls, and a Mid Boost voicing option. Rear-panel controls cover the powersoak (Full, Mid and Low power, or speaker off) and the noise gate threshold, alongside a line output and a dual footswitch jack for the ENGL Z4.
specs: |-
  - Two channels: Clean, Lead
  - All-valve 25 W
  - Valve-buffered serial FX loop
  - Noise gate with rear-panel threshold control
  - Powersoak: Full / Mid / Low power, speaker off
  - Sound shaping option: Mid Boost
  - Controls: Gain (per channel), Bass, Middle, Treble, Lead Volume, Presence, Master
  - Outputs: 1 x 8-16 ohm or 2 x 16 ohm, plus line output
  - Dual footswitch jack for ENGL Z4
  - Preamp valves: 4 x ECC83 (12AX7)
  - Poweramp valves: 2 x KT77
  - Output power: 25 W
  - Made in Germany
  - Dimensions: 23 x 42 x 20 cm
  - Weight: 11 kg
