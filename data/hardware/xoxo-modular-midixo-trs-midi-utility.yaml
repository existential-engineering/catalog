description: MIDIXO is a Eurorack utility module that converts MIDI signals
  between TRS "Type A" and "Type B" 3.5mm stereo jacks, and can serve as a TRS
  MIDI breakout for compatible Expert Sleepers modules using an included ribbon
  cable.
details: |-
  MIDIXO is a TRS MIDI Swiss Army Knife for your Eurorack synth. It's a simple, functional utility module that can help you use MIDI over 3.5mm stereo cables in one of several ways, depending on how its jumpers are configured: At its simplest, MIDIXO can serve as a TRS MIDI A/B converter, allowing devices from manufacturers that use TRS MIDI "Type A" (eg: Make Noise, Korg, Akai) to talk with devices from manufacturers that use TRS MIDI "Type B" jacks (eg: Arturia, Malekko, Novation, Pittsburgh). This allows you to skip the MIDI 5-pin DIN cables and MIDI dongles that manufacturers include, and just use standard 3.5mm stereo cables everywhere. MIDIXO is friends with some excellent Expert Sleepers modules. By using the included 4-pin ribbon cable, MIDIXO can serve as a TRS MIDI breakout for disting EX, disting mk4, ES-9, FH-2, or General CV modules. The input and output jacks are each independently switchable to allow maximum compatibility with your other gear. MIDIXO is best-est friends with disting EX and Mk4. If you turn on "MIDI Thru" in disting's settings, MIDIXO will function as its MIDI breakout when you're using algorithms that accept or generate MIDI. When you're in any "non-MIDI" disting algorithms, MIDIXO goes back to being a TRS MIDI A/B converter - without having to reconfigure the jumpers. Thanks, Expert Sleepers! Finally, you can pair MIDIXO with the Expert Sleepers MIDI breakout – again using the included 4 pin ribbon cable – to have two independent TRS MIDI / MIDI 5-pin DIN converters! MIDIXO is only 2hp wide and doesn't require any power or connections on your busboard. It's a perfect utility for Expert Sleepers fans and for anyone using MIDI gear that has 3.5mm TRS jacks. Width: 2hp

  Depth: 17mm

  Also Includes: (1) 20cm 4-pin cable; (3) 2mm jumpers; (2) M3 x.5mm x 6mm mounting screws

  Not included, but useful, is our 3.5mm TRS to 5-pin MIDI Adapter . A complete user's manual can be found in the Downloads section of this site. SKU: XM001
