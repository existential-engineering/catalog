description: The U-24 is a compact, 2-in/4-out audio interface that provides all
  of the essential tools you need for recording and performing with high
  resolution, 24-bit/96 kHz audio anywhere you go.
details: |-
  The U-24 is a compact 2-in/4-out audio interface that fits in the palm of a hand and records and plays back at up to 24-bit/96 kHz. An asynchronous transfer system keeps it clear of computer jitter. Its mic preamps are the same low-noise design found on the H5 and H6 Handy Recorders, measuring -119.5 dB EIN, and the U-24 is the more streamlined sibling of the U-44 with the same sound.

  It runs on USB bus power from a computer, on two AA batteries for about 4 hours with phantom power off, or from the Zoom AD-17 adapter or any 5 V DC supply. Connecting to an iPhone or iPad needs battery or adapter power plus an Apple iPad Camera Connection Kit or Lightning-to-USB Camera Adapter.

  Two XLR/TRS combo inputs have independent gain knobs and multi-color level indicators, with +48 V phantom power available to both and a Hi-Z switch on input 1 for guitars, basses and other passive instruments. MIDI IN and OUT jacks on 5-pin DIN connect keyboards, controllers, synthesizers and drum machines.

  Outputs cover both monitoring and DJ use: MAIN OUT L/R on unbalanced TRS phone jacks, two RCA pairs as LINE OUT 1 and LINE OUT 2, and a standard stereo phone jack for headphones with its own volume control. The U-24 can also serve as a studio-quality headphone amp.

  Monitoring is handled in hardware with zero latency. A DIRECT MONITOR knob blends the input against the computer playback signal, a BALANCE knob sets the PHONES and LINE OUT 2 mix between computer playback signals 1-2 and 3-4 so that a click can be balanced against the main output during a performance or a cue against the main output while DJing, and MUTE switches silence the A and B output groups. Each connector and knob is positioned for fast access. A download code for Ableton Live 9 Lite is included, and Steinberg Cubasis LE, a 4-track recording, editing and mixing app for iPad, is a free App Store download for U-24 owners.
specs: |-
  - 2-in/4-out USB audio interface for PC, Mac, iPhone and iPad
  - ANALOG IN, INPUT 1/2: TRS/XLR combo jacks (XLR 2 hot, TRS tip hot)
  - Input gain: 0 to 43 dB
  - Input impedance: 2.6 kohms (MIC IN), 1.1 Mohm with Hi-Z on
  - Maximum input level: +2.7 dBu (MIC IN), +20.7 dBu (TRS IN)
  - Phantom power: +48 V, available to inputs 1 and 2
  - ANALOG OUT, MAIN OUT L/R: TRS phone jacks (unbalanced), maximum output level +10 dBu at 0 dBFS, output impedance 330 ohms
  - ANALOG OUT, LINE OUT 1/2: RCA (coaxial), maximum output level +8 dBu at 0 dBFS, output impedance 1 kohm
  - ANALOG OUT, PHONES: standard stereo phone jack, 30 mW x 2 into a 32 ohm load, maximum output level +10 dBu at 0 dBFS, output impedance 33 ohms
  - Frequency characteristics: at 44.1 kHz -1.0 dB (20 Hz to 20 kHz), at 96 kHz -3.5 dB (20 Hz to 40 kHz)
  - Input conversion noise: measured EIN -119.5 dB (IHF-A) at 43 dB with 150 ohm input
  - Audio recording and playback channels: 2 recording, 4 playback
  - Sampling frequencies: 44.1, 48, 88.2 and 96 kHz
  - Bit depth: 24-bit
  - Interface: USB 2.0
  - MIDI IN/OUT: 5-pin DIN jacks
  - Power source: USB bus power (Type B), ZOOM AD-17 (Micro-B), DC 5 V power supply (Micro-B), or 2 AA batteries for about 4 hours continuous operation with phantom power off
  - Accepts standard AA alkaline or NiMH rechargeable batteries
  - Power consumption: 5 W maximum
  - Dimensions: 191.8 mm (D) x 92.3 mm (W) x 42.7 mm (H)
  - Weight (main unit only): 285 g
  - Zero-latency direct monitoring with a DIRECT MONITOR blend knob
  - BALANCE knob for the PHONES and LINE OUT 2 mix between computer playback signals 1-2 and 3-4
  - MUTE switches for output groups A and B
  - Includes a download code for Ableton Live 9 Lite
  - System requirements, Windows: Windows 10 or 11 (64-bit), Intel Core i3 or faster, USB 3.0 or 2.0
  - System requirements, Mac: Mac OS X 10.9.5 to macOS 26, Intel Core i3 or faster, USB 3.0 or 2.0
  - System requirements, iPhone and iPad: iOS 7.1 to 26, iPadOS 15 to 26, with batteries or AC adapter for power plus an Apple Camera Connection Kit or Lightning-to-USB Camera Adapter
  - Note: 0 dBu = 0.775 Vrms
