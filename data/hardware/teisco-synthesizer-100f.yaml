description: >-
  The Teisco Synthesizer 100F is a compact monophonic analog synthesizer featuring a
  single VCO and a 37-note keyboard. Originally produced under the Teisco brand and later
  relabeled by Kawai, it delivers classic analog bass, lead, and synth sounds through its
  resonant low-pass filter and versatile modulation routing. It also accepts external
  audio input for processing through its filters and envelopes.
details: |-
  Kawai initially produced synthesizers under the Teisco brand name before transitioning to the Kawai label. This transitional period resulted in units appearing with either manufacturer's branding, despite being the same instrument.

  The 100F represents a straightforward analog synthesizer design built around a single voltage-controlled oscillator offering sawtooth, square, and noise waveforms across an unusually wide pitch range from 2' to 64' plus a low setting. While limited to one oscillator, the synth compensates through extensive modulation routing options and the ability to process external sounds through its filters and envelopes.

  The resonant low-pass filter responds to multiple modulation sources including the LFO, envelope, external input, and the VCO itself, while a secondary high-pass filter provides additional tonal sculpting. The LFO offers sawtooth, triangle, and square waveforms and can modulate the VCO, VCF, and VCA for dynamic tonal variation. Classic wood side panels and a straightforward front panel layout complete the design.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with sawtooth, square, noise, and external audio input
  - Pitch Range: 2', 4', 8', 16', 32', 64', and low settings
  - LFO: Sawtooth, triangle, square waveforms with adjustable rate
  - Filter: Low-pass resonant filter with multiple modulation sources
  - High-Pass Filter: Non-resonant
  - Envelope: AD, ADS, or ADR modes
  - Keyboard: 37 notes
  - Memory: None
  - Control: CV/Gate
  - Portamento: Yes
releaseDate: "1977"
