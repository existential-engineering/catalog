description: Sample Drum is 14HP eurorack sample player module with
  straight-forward, intuitive interface, functionality and great sound quality,
  designed with live performance use in mind.
details: |-
  The Sample Drum is a 14HP eurorack sample player with a straightforward interface, designed with live performance in mind. It is composed of two identical parts and lets you play back, record and slice up samples or loops directly in a modular system.

  For processing there are different play modes, tuning functions including 1V/Oct pitch tracking, virtual VCAs plus AD envelopes and realtime effects. Three freely assignable CV inputs per channel give a lot of expression during performance, and slicing can be done manually or automatically, with cue points also read from WAV files.

  16bit mono wav samples are loaded into RAM, 32MB or around five minutes of sampling time, from an SD card for instantaneous playback response, and trigger response is about 1ms. A 16 GB SD card with factory preset samples comes with the module. All settings can be saved and recalled during live performance.

  The factory preset sample pack was developed by producers Pitch Black, Nero Bellum, T.Raumschmiere, Otto von Schirach and Raitis AG. The module is 14HP wide, 30mm deep, and draws 65mA@+12V and 2mA@-12V from the bus.
specs: |-
  - Two identical sample playback channels
  - Sample playback with fast trigger response (~1ms)
  - Various effects for real time sample processing
  - Sample recording functionality
  - Manual and automatic sample slicing
  - Cue point loading from WAV files
  - 1V/Oct tracking
  - 3 assignable CV inputs per channel
  - Virtual VCAs and AD envelopes
  - Preset memory
  - Performance mode
  - 16 GB SD card with factory preset samples included
  - RAM size 32Mb, 5 minutes of samples
  - Sample rate 48kHz, 16bit
  - Sample recording rate 48kHz, 12bit
  - Audio output amplitude 10Vptp
  - Octave range C0 to C8
  - CV input range (configurable) -5V to +5V
  - Panel width 14HP
  - Module depth 30mm
  - Power consumption 65mA@+12V, 2mA@-12V
