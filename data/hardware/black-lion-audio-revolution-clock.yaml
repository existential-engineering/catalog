description: Portable word clock with Macro MMC, 4 BNC outs plus S/PDIF,
  optical, and AES/EBU outs
details: The Revolution Clock synchronizes multiple digital audio devices across
  various connection types, supporting sample rates from 44.1kHz to 384kHz on
  BNC outputs. The device features exceptionally low jitter specifications
  (0.5pS RMS at BNC outputs), which manufacturers claim enhances stereo imaging,
  spatial depth, and reverb accuracy in professional audio productions. The unit
  leverages patented Macro-MMC technology and MEMS oscillators for superior
  stability and shock resistance compared to traditional quartz crystal
  alternatives. It provides up to seven simultaneous clock outputs (four BNC
  outputs plus S/PDIF, optical, and AES/EBU), enabling synchronization of
  multiple studio devices.
specs: |-
  - Jitter: 0.5 pS RMS (BNC outputs)
  - BNC Output Impedance: 75Ω, 5V unterminated
  - RCA S/PDIF Output Impedance: 75Ω, unbalanced
  - AES/EBU XLR Output Impedance: 110Ω, balanced
  - BNC Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384 kHz
  - RCA S/PDIF & AES Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Optical S/PDIF Sample Rates: 44.1, 48, 88.2, 96 kHz
  - Power: 9V DC, 6W
  - Power Connector: 2.5mm barrel, center pin positive
  - Dimensions: 7" W x 1.75" H x 6.5" D (without rack ears)
  - Weight: 2.5 lbs (without rack ears)
