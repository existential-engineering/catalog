description: VCF and VCA combo with that classic sound.
details: |-
  The Erica Synths Black 3109 VCF/VCA is a lowpass filter and voltage-controlled amplifier combo built around the AS3109 VCF integrated circuit, a contemporary version of the IR3109 chip found on vintage Roland synths such as the Jupiter series, Juno series and the SH-101.

  The 3109 VCF/VCA is Erica Synths' attempt to recreate the iconic sound of these synths, and also to improve on it. Filters based on the IR3109 had several drawbacks, including a volume drop when resonance is increased, so volume drop compensation was added along with a built-in VCA for more versatility in compact setups. Additionally, 1V/oct tuning is implemented, so the module can be used for perfect VCF keyboard tracking and also as a VCO.

  The filter is a 24dB/oct lowpass design with a cutoff level attenuverter. Audio level is 10V peak to peak, cutoff CV spans -5V to +5V across the full range and VCA CV runs 0V to +10V.

  The module is 10HP wide and 35mm deep, with a maximum power consumption of 25mA@+12V and 25mA@-12V.
specs: |-
  - 24dB/oct lowpass VCF
  - Volume drop compensation
  - Built-in VCA
  - Cutoff level attenuverter
  - 1V/oct tracking
  - Audio level 10Vptp
  - Cutoff CV level (full span) -5V - +5V
  - VCA CV level 0 - +10V
  - Max power consumption 25mA@+12V, 25mA@-12V
  - Module width 10HP
  - Module depth 35mm
