description: A MIDI mediator module that interfaces the Assimil8or sampler with
  MIDI instruments, controllers, and sequencers, enabling parameter modulation,
  preset selection, and channel triggering via MIDI.
details: |-
  Locutus interfaces Assimil8or with MIDI instruments, controllers, and sequencers to provide multichannel modulation and new polyphonic possibilities. It includes a special attached cable that connects to the Assimil8or CPU behind the panel. MIDI sources enable modulation of Assimil8or parameters through velocity, channel pressure, and MIDI CC messages; preset selection via MIDI Program Change; and optional channel triggering using customizable assignment modes, including Dynamic mode for intelligent polyphonic patching, Multi modes for multitimbral sequencer integration, and SP-1200 modes. The MIDI OUT port transmits program messages during preset changes and MIDI CC data from analog control voltages patched to any of Assimil8or’s 24 CV inputs, letting a eurorack modular system control external MIDI equipment.
