description: >-
  The Roland SVC-350 is a keyboard vocoder from 1979 that combines three VCOs, a
  string section, and a sophisticated multi-band vocoder with 20 envelope
  followers, closely related to the VP-330 Vocoder Plus.
details: |-
  Released in 1979, the Roland SVC-350 is essentially a keyboard-equipped
  version of the vocoder technology found in the VP-330 Vocoder Plus,
  presented with a modernized look and an added graphic EQ section. It
  stands as one of the most capable and sought-after analog vocoders ever
  produced.

  The vocoder section is built around an impressive array of filters and
  envelope followers. Twenty envelope followers analyze the incoming audio
  signal, which is then applied to 18 bandpass VCFs with steep 54dB per
  octave slopes. An additional VCF handles both low-pass and high-pass
  filtering at 54dB per octave, while 20 more VCFs with 18dB per octave
  slopes and 60dB dynamic range reconstruct the output signal.

  Beyond the vocoder, the SVC-350 includes three VCOs for generating
  carrier tones, a string section for lush pad sounds, and a separate
  voice section. Each section has independent mix level controls, and an
  ensemble chorus effect adds the warm, shimmering character that Roland's
  string machines are known for. A vibrato section with depth, delay, and
  rate controls provides additional modulation.

  The 49-key keyboard makes the SVC-350 a self-contained performance
  instrument rather than just a rack processor. CV and gate connections
  allow integration with other analog gear. While it has no patch memory,
  the hands-on controls make it straightforward to dial in sounds during
  performance.
specs: |-
  - Oscillators: 3 VCOs
  - Vocoder: 20 envelope followers
  - Filters: 18 VCFs at 54dB/oct bandpass, 1 VCF at 54dB/oct low-pass and high-pass, 20 VCFs at 18dB/oct low-pass (60dB dynamic range)
  - Sections: Vocoder, Strings, Voice with independent mix levels
  - Effects: Ensemble chorus
  - LFO: Vibrato with depth, delay, and rate
  - Memory: None
  - Keyboard: 49 keys
  - Connections: CV/Gate
