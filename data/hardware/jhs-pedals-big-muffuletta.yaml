description: An oversized fuzz/distortion pedal from JHS Pedals' BIG series
  featuring 4x the size and 8x the outputs of a standard pedal, delivering a
  larger-than-life tone with multiple output options.
details: |-
  In a world where everybody's trying to make their pedals smaller we've decided to do something different and bold. The JHS BIG series harkens back to the day where pedals were big and so was the tone. The Big Muffuletta is the first in a new series of larger than life pedals. 4X the size 8X the outputs. Bigger IS better.
