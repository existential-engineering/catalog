details: |-
  The CB Tap is an external tap tempo mechanism from Catalinbread, designed primarily to add tap functionality to the Belle Epoch Deluxe delay pedal.

  It connects via a Catalinbread-branded 6-inch 1/4" TRS patch cable and features two inputs: a DLX input for the Belle Epoch Deluxe and a Tap input for other compatible pedals.

  An LED indicator on the unit follows tempo when connected to a Deluxe-series pedal, providing visual feedback. The CB Tap sets a delay time that can then be multiplied into uniform subdivisions via the Echo Delay knob.

  Compatible with non-Boss, normally-open tap tempo pedals. Both inputs can be used simultaneously. Note that it operates within the Belle Epoch Deluxe's delay range and will not tap slower than 800ms.
specs: |-
  - External tap tempo footswitch for the Belle Epoch Deluxe, and for any pedal expecting a normally-open tap tempo device
  - Not compatible with Boss pedals or other non normally-open tap inputs
  - Ships with a Catalinbread-branded six-inch 1/4" TRS patch cable
  - LED indicator follows the tap only when connected to a Belle Epoch Deluxe
  - Will not tap slower than 800ms when driving a Belle Epoch Deluxe
