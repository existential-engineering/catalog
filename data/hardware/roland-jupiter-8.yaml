description: >-
  Roland's flagship eight-voice analog polysynth from the early 1980s, featuring
  dual VCOs per voice, switchable filter modes, and a warm, expansive sound that
  defined an era of electronic music.
details: |-
  Introduced in 1981, the Jupiter-8 represented Roland's most ambitious analog synthesizer to date. It arrived at a moment when polyphonic synthesis was rapidly evolving, and it immediately established itself as a serious competitor to the Prophet-5 and Oberheim OB-series instruments. Production continued through 1984, placing it squarely in the golden age of analog polysynths.

  The sonic architecture is built around sixteen voltage-controlled oscillators arranged as two per voice across eight voices of polyphony. Each oscillator offers selectable triangle, sawtooth, pulse, and square waveforms, with the second oscillator adding a noise generator. Cross-modulation and oscillator sync open the door to harmonically rich, aggressive timbres that sit well above the typical poly pad territory.

  One of the Jupiter-8's most distinctive features is its switchable filter topology. Players can choose between a 12dB-per-octave two-pole mode that lets more harmonic content pass through, yielding a brighter and more open character, or a steeper 24dB-per-octave four-pole mode for classic deep sweeps. A separate highpass filter at 6dB per octave provides additional sculpting. The combination gives the instrument a tonal range that few of its contemporaries could match.

  The keyboard section supports both split and layer modes, which was a forward-thinking inclusion for its time, allowing performers to create complex patches without external routing. An onboard arpeggiator and 64 patch memories round out the feature set. Connectivity is limited to DCB sync on certain units, as the instrument predates the MIDI specification.

  The Jupiter-8 became a staple for artists spanning synthpop, new wave, and electronic experimentation. Tangerine Dream, Duran Duran, Prince, Depeche Mode, and Vince Clarke all relied on its rich oscillators and flexible voicing. Decades later, it remains one of the most revered analog synthesizers ever produced, commanding significant prices on the vintage market and inspiring multiple software and hardware recreations.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 VCOs per voice (16 total), switchable triangle/sawtooth/pulse/square waveforms, noise on oscillator 2
  - LFO: 1 with 4 waveforms (sine, triangle, ramp, random)
  - Filter: Switchable 2-pole (12dB/oct) and 4-pole (24dB/oct) lowpass, plus 6dB/oct highpass
  - Envelopes: Standard ADSR
  - Features: Oscillator sync, cross-modulation, arpeggiator, keyboard split and layer modes
  - Memory: 64 patches, 8 presets
  - Keyboard: 61 keys
  - Connectivity: DCB sync (select models), no MIDI
  - Produced: 1981–1984
