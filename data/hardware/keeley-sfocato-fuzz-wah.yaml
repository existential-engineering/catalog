details: |-
  The Sfocato Fuzz Wah is a two-transistor BC109 fuzz with an Italian-inspired wah pedal dropped into the tone control, so the wah voicing sits inside the fuzz circuit rather than before or after it. It is aimed at neo-vintage rock sounds, from a sharp bite to a thick, wooly fuzz, with those tones available instantly from the controls rather than from foot-sweeping to find them.

  Each unit is hand built in Edmond, Oklahoma, USA. It is the first Keeley pedal since 2008 whose enclosure was made in-house: the cases are cut on the shop's own CNC machine and the graphics printed on its UV LED printer.
