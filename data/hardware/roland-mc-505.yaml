description: >-
  The Roland MC-505 is an all-in-one groovebox designed for electronic music
  production, succeeding the MC-303 with significantly enhanced capabilities. It
  features a massive collection of professional synth and drum sounds, a
  real-time resonant filter, D-Beam infrared controller, phrase sampler, and
  arpeggiator. Notable users include Beck, Peaches, Cibo Matto, and Freddy
  Fresh.
details: |-
  The MC-505 was Roland's follow-up to the popular MC-303 Groovebox, expanding on the concept of a self-contained dance music production workstation. It provides 64-voice polyphony with acoustic simulation and ROM-based oscillators, giving producers access to a wide palette of electronic synth and drum sounds without needing external gear.

  A standout feature is the D-Beam controller, an infrared beam that allows performers to manipulate sounds in real time by passing their hand over the sensor. Combined with real-time resonant filter knobs and envelope controls, the MC-505 offers hands-on sound shaping that made it a popular choice for live electronic performance.

  The built-in sequencer supports up to 95,000 notes with groove quantize, and includes part-level faders for mixing. A phrase sampler and arpeggiator round out the creative tools. While originally designed as a standalone production machine rather than a component in a larger keyboard rig, the MC-505 established itself as a capable and affordable entry point into electronic music production during the late 1990s.
specs: |-
  - Polyphony: 64 voices
  - Sound Engine: Acoustic simulation and ROM samples
  - Filter: Real-time resonant filter
  - Drum Kits: 26
  - Effects: 24
  - Sequencer Capacity: 95,000 notes
  - Keyboard: 16 velocity-sensitive buttons
  - Features: D-Beam infrared controller, phrase sampler, arpeggiator, groove quantize
  - Control: MIDI
