description: "An 8HP drum voice and sound design tool built on the Bastl Pizza
  platform with two layers: a noise source (white, clap, bit, metallic modes
  with LP/HP filter) and a dual oscillator tone generator (FM, FM2, dual, ring
  modulation). Crossfader with envelope control blends the layers. Pitch
  envelope, FM envelope, and transient shaping. Clip/distortion section: soft
  clipping with bass boost or hard clipping. Per-input sample-and-hold on all CV
  inputs. Assignable CTRL knob with CV, V/OCT with calibration. Firmware updates
  via micro USB."
details: |-
  CRUST is an 8HP Eurorack drum voice and sound design tool built on the Bastl Pizza platform. It features two independent layers: a noise source and a dual oscillator tone generator.

  The noise layer provides four modes — white, clap, bit, and metallic — each with its own character, and an integrated lowpass/highpass filter. The tone layer offers four oscillator configurations: FM, FM2, dual oscillator, and ring modulation, all with V/OCT pitch tracking and calibration.

  A crossfader blends the two layers with dedicated envelope control over the crossfade position. The pitch envelope and FM envelope add punchy transient character. All audio passes through a clip/distortion section switchable between soft clipping (with bass boost) for warmth and hard clipping for aggressive tones.

  Every CV input features per-input sample-and-hold for stepped modulation from any source. The assignable CTRL knob maps to a user-selected parameter with dedicated CV input. Velocity input doubles as an external envelope input when no trigger is connected. Preset storage and firmware updates via micro USB. Open-source DIY resources on GitHub.
