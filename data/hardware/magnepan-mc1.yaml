details: |-
  MC1: BIG Magneplanar Sound in a New Smaller Package

  This Multi-Channel, 2-way planar/Quasi Ribbon speaker is designed to be attached to or placed next to a wall or cabinet. Optional floor stands are available. These speakers will normally be used in conjunction with one of the Magneplanar model Woofers or a self-powered subwoofer in a serious music or home theater system ... or both. The MC1 can be attached to a wall or cabinet and folded out of the way when not in use. It is the perfect solution for rooms which cannot accommodate floor standing models. For serious audio/video systems... we encourage you to compare the MC1 to conventional speakers costing many times more. The MC1's small size and low frequency response to 80Hz is made possible by attaching the speaker to a wall or to the side of a cabinet, which enhances the lower frequencies ... from 80Hz up, the MC1 is pure Magneplanar. The midbass to midrange and quasi ribbon high frequencies have the amazing speed and definition of all Magneplanars... The speakers are small, but the sound is big. Although home theater is an obvious application for these speakers, they really show their stuff when used in a system that is demanding for both home theater and serious music listening. Generally, home theater sound has not been as demanding (in the purist sense) as dedicated music systems. Listen to music through the typical home theater system and you will hear what we mean. The MC1 works very well for both and enables your system to be ready for all levels of future technology for all types of listening... 2-channel Stereo, multi-channel surround music, and the best of home theater. No place for a center channel speaker? The photo below is of a demonstration in a hotel during a Consumer Electronic Show. The MC1s immediately flanking the on-wall video monitor provide a dual center channel array which can outperform a single center channel speaker. A pair of our on-wall speakers achieves a center channel image in the same manner as a stereo system achieves a center image. By angling the speakers approximately 30 degrees to the wall, the center channel speaker on the left of the video monitor is on-axis with the viewer off to the right--- and consequently is louder than the center channel speaker on the right of the monitor (which is closer to the viewer). This "pulls" the audio image to the left and keeps the dialog centered on the screen better than point source speakers. It also raises the center channel image to the same height as the screen. Finally, when the Magneplanar on-wall speaker is used with a flexible bass management system, a large, full-range Magneplanar sound in the middle can be achieved with our on-wall design. Once you have heard this concept, you won't be tempted to buy one of those sleek center channel speakers designed for flat panel video monitors. And there is a bonus for those willing to install this unorthodox concept. In blind-fold testing, listeners found that center channel dialog and information was easier to understand with a "Maggie" dual center than with a conventional single center channel speaker. Extensive research on speech intelligibility is available on the internet. A word of caution-- Happy customers are our best means of advertising (word-of-mouth). If you are considering MC 1s, they will sound much better if kept away from corners-- especially for front channel applications. Speakers never sound best in corners and if you need help, please feel free to call us for specific advice. If you have the option, side-wall placement of the MC 1s will give the best performance in a shoe-box shaped room. Place the speakers on the side-wall, about 4 to 6 feet from the front wall.
