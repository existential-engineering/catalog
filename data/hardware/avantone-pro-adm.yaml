details: |-
  The Avantone Pro ADM is a second-generation dynamic cardioid microphone
  purpose-built as a snare drum solution for both studio recording and live
  performance environments. Originally introduced in 2007, the updated design
  brings improved upper-range smoothness and tighter low-end definition
  compared to its predecessor.

  Its cardioid polar pattern and 145 dB maximum SPL handling make it well
  suited not only for snare drums but also for rack toms, hand percussion, and
  guitar cabinets — any high-SPL source that demands controlled pickup with
  minimal bleed.

  Avantone Pro emphasizes build quality throughout the ADM, using precision
  dye-cast housings with brass and steel grills rather than plastic components.
  Precision-machined inserts lock securely into the included SSM shockmount,
  maintaining microphone positioning even during heavy playing.

  The ADM ships as a complete kit including the SSM shockmount and PK1 Pro
  Klamp, giving drummers and engineers everything needed to position the
  microphone on a snare rim straight out of the box.

  With a passive design requiring no phantom power, a compact form factor
  weighing just 11 oz (0.35 kg), and a distinctive cabernet red finish with
  polished nickel trim, the ADM is designed to stand out visually while
  delivering reliable, focused sound capture in demanding stage and studio
  conditions.
