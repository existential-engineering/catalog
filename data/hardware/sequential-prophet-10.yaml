description: >-
  A rare and imposing ten-voice analog polysynth that doubled the Prophet 5's
  architecture, pairing twenty oscillators with a polyphonic sequencer in one
  of the most ambitious synthesizers of the early 1980s.
details: |-
  The Sequential Circuits Prophet 10, introduced in 1980, was born from an
  ambitious idea: take the already acclaimed Prophet 5 and double
  everything. With ten voices driven by twenty oscillators, it was among
  the most powerful polyphonic analog synthesizers available at the time.
  The instrument went through three distinct revisions, each addressing
  reliability and design challenges that came with pushing so much analog
  circuitry into a single instrument.

  Version 1 used a standard 61-key single-manual layout but suffered from
  overheating and persistent tuning instability — unsurprising given the
  sheer density of analog components. Version 2 tackled the thermal issues
  by splitting the instrument into a striking dual-manual configuration
  with two stacked 61-key keyboards, effectively separating the two
  Prophet 5 circuits physically. Version 3, the most refined iteration,
  adopted CEM integrated circuits for improved tuning stability and
  introduced multiple keyboard modes that let players split, layer, or
  independently control the two five-voice halves.

  The voice architecture mirrors the Prophet 5 on each side: two VCOs per
  voice with Poly-Mod for cross-modulation, a resonant lowpass filter with
  its own ADSR envelope, a noise generator, and an LFO. What set the
  Prophet 10 apart beyond sheer voice count was its built-in polyphonic
  sequencer, capable of recording across six tracks with a capacity
  ranging from 4,000 to 10,200 notes depending on the revision.
  Thirty-two patch memories stored complete voice configurations. Original
  units used CV and gate connectivity, though MIDI retrofit kits have
  since become available.

  Production numbers were low, making the Prophet 10 one of the rarest
  instruments in the Sequential catalog. It found its way into the hands
  of artists including Tangerine Dream, The Who, Pet Shop Boys, Genesis,
  Vangelis, and John Carpenter, who exploited its massive polyphony for
  rich orchestral pads and layered textures. Today it remains a prized
  collector's piece, valued as much for its historical significance as for
  its enormous, enveloping sound.
specs: |-
  - Polyphony: 10 voices
  - Oscillators: 2 VCOs per voice (20 total) with Poly-Mod and noise generator
  - LFO: 1 with adjustable rate
  - Filter: Resonant lowpass with dedicated ADSR envelope
  - Keyboard: Version 1: 61 keys / Versions 2 & 3: dual manual (122 keys total)
  - Sequencer: Polyphonic 6-track (4,000–10,200 note capacity)
  - Memory: 32 patches
  - Connectivity: CV/Gate (MIDI retrofit available)
  - Versions: V1 (SSM chips, single manual), V2 (SSM chips, dual manual), V3 (CEM chips, dual manual)
  - Produced: 1980
releaseDate: "1980"
releaseDateYearOnly: true
