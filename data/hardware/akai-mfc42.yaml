description: >-
  Akai's true analog filter module designed as a companion to their MPC series,
  featuring mono and stereo filter sections with up to 8-pole slopes, a phase
  shifter, and comprehensive MIDI control.
details: |-
  The Akai MFC42 was designed primarily as an analog filter companion to Akai's MPC-series samplers, but its standard quarter-inch and RCA connectivity makes it equally useful as a standalone effects processor for any audio source. Its genuine analog filter circuit delivers the warm, musical character that digital filters often struggle to replicate.

  The filter section offers low-pass, high-pass, band-pass, and notch modes. In mono operation, slopes range from 2-pole through 4-pole up to a steep 8-pole configuration, while stereo mode provides 2-pole and 4-pole options. The mono and stereo sections can be linked for more complex processing chains. An ADSR envelope responds to MIDI note triggers and the front-panel TRIGGER control for dynamic filter sweeps.

  Additional processing includes distortion, a stereo analog phase shifter, and EQ. The LFO syncs to MIDI with sawtooth, square, triangle, and random waveforms across timing divisions from sixteenth notes to double whole notes. A tap tempo button offers quick sync without MIDI, and a large numeric display keeps parameters visible at a glance.

  Every knob and button sends and receives MIDI control data, making the MFC42 thoroughly automatable in a DAW environment. Three quarter-inch inputs, stereo phono inputs and outputs, and stereo quarter-inch outputs provide flexible routing for both studio and live performance applications.
specs: |-
  - Type: Analog filter module
  - Filter types: Low-pass, high-pass, band-pass, notch
  - Filter slopes: Mono 2/4/8-pole; stereo 2/4-pole
  - Envelope: ADSR (MIDI note and front-panel TRIGGER capable)
  - LFO: MIDI-syncable (sawtooth, square, triangle, random); 16th note to double whole note
  - Effects: Distortion, stereo analog phase shifter, EQ
  - Inputs: 3x 1/4", stereo phono (RCA)
  - Outputs: Stereo 1/4", stereo phono (RCA)
  - Control: MIDI IN/OUT/THRU; tap tempo
