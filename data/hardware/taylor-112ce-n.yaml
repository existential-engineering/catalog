description: The 112ce-N is our first 100 Series nylon-string cutaway Grand
  Concert, blending the warm, snappy sound of nylon strings with a comfortable,
  compact body shape. It offers an outstanding value for players of all skill
  levels.
details: |-
  The 112ce-N pairs a solid torrefied spruce top with layered sapele back and sides, producing a clear, balanced voice well-suited to fingerstyle playing and light strumming. Torrefaction enhances the spruce's warmth and depth, giving a played-in resonance from the start.

  Its Grand Concert body shape with a Venetian cutaway offers a compact, comfortable feel. The 12-fret neck join and 1-7/8-inch nut width — narrower than a traditional classical guitar — make it especially approachable for players transitioning from steel-string instruments.

  A specialized internal voicing architecture with fan-style bracing is tuned for nylon strings, enhancing natural warmth and clarity. The ebony fretboard is inlaid with 4mm Faux Pearl dots, and the slotted peghead carries classical nickel tuners with faux pearl buttons.

  Onboard Expression System 2 (ES-N) electronics deliver reliable amplified tone for both studio and live settings. The matte-finished body features black binding, a white plastic 3-ring rosette, and a West African Crelicam ebony bridge.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Spruce (solid)
  - Back/sides: Sapele (layered)
  - Cutaway: Venetian
  - Neck profile: Standard Carve
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Peghead type: Slotted
  - Tuners: Classical Nickel with Faux Pearl Buttons
  - Electronics: Expression System 2 ES-N
