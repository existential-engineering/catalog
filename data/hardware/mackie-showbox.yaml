description: Mackie ShowBox is a battery-powered live performance rig that makes
  it easy to get great live sound anywhere. It's a portable PA, acoustic guitar
  amp, 6-channel mixer, effects rack and USB-C interface, all in a single
  device.
details: |-
  Mackie ShowBox delivers up to 12 hours of powerful live sound thanks to a 400W amp, custom drivers and the included battery. With 6 input channels for mics and instruments, ShowBox is the complete solution to portable live sound for singers, guitarists, keyboardists and more.

  Mackie ShowBox connects you with your audience, wherever they are. Simplify your live setup while adding the ability to record with an SD card, stream with USB-C, and use Bluetooth to play backing tracks.

  With switchable PA and amp voicing modes, internal effects for guitar and vocals, an FX loop for your pedals, and settings for indoor and outdoor performance, ShowBox can replace your amp and your PA system while opening up new creative possibilities for solo artists and small bands.

  Keep everything at your fingertips with the breakaway mix control, including levels for mics and instruments, effects, tone shaping, snapshots, looper, tuner and more. The controller mounts to your mic stand and slides into the ShowBox for storage.

  Insert separate effects on each of the four mic and instrument channels, including fuzz, overdrive, tube model, acoustic amp, tremolo and more. Then, bring it all together with two additional effects engines for time-based effects like delay and reverb. ShowBox goes beyond the typical portable PA speaker with precise tools for shaping your tone, including separate 3-band parametric EQ and single-knob compression on each channel.
specs: |-
  - 400W amplifier with custom drivers and up to 12 hours of battery life
  - 6 input channels for mics and instruments
  - Breakaway mix control that mounts to a mic stand and stores in the unit
  - Six effects engines: four channel inserts plus two time-based engines
  - 3-band parametric EQ and single-knob compression on each channel
  - Built-in tuner and looper accessible from the breakaway controller
  - User snapshots for recalling settings
  - Feedback Eliminator
  - Indoor and Outdoor voicing modes
  - Amp and PA voicing modes
  - USB-C interface for live streaming and recording; Micro SD recording
  - 2x XLR mic inputs
  - 2x 1/4" instrument inputs
  - Stereo 1/4" line input
  - External FX loop send and return
  - Bluetooth streaming
  - 3.5 mm aux input
  - 2-button footswitch port
  - 1/4" headphone output
  - XLR mix output
  - AC inlet rated 100-240V, 50-60 Hz, 75W
