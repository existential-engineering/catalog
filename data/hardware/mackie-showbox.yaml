url: https://mackie.com/en/products/battery-powered/live-sound/showbox.html
description: "Battery-powered live performance rig that makes it easy to get
  great live sound anywhere — a portable PA, acoustic guitar amp, 6-channel
  mixer, effects rack and USB-C interface, all in a single device."
specs: |-
  - 400W amplifier
  - Up to 12 hours battery life
  - Swappable GB-100 battery
  - 8" woofer
  - 6 input channels
  - 2x XLR mic inputs
  - 2x 1/4" instrument inputs
  - Stereo 1/4" line input
  - 3.5mm aux input
  - XLR mix output
  - 1/4" headphone output
  - External FX loop (send & return)
  - USB-C interface for streaming/recording
  - Micro SD card recording
  - Bluetooth streaming
  - 2-button footswitch port
  - Six effects engines (per-channel + time-based)
  - 3-band parametric EQ per channel
  - Single-knob compression per channel
  - Built-in tuner and looper
  - Feedback eliminator
  - Indoor & outdoor voicing modes
  - Amp & PA voicing modes
  - Breakaway mix controller
