details: |-
  The G&L Comanche is Leo's final word on the traditional double-cutaway bolt-on axe, and the ASAT Z-3 is like packing a Comanche into an ASAT body. Like the Comanche, the first thing to notice about the ASAT Z-3 is the distinctive shape of the Magnetic Field Design Z-Coil pickups designed by Leo Fender himself. These pickups deliver a bright and sparkly top end while offering a robust bottom end, all without any 60-cycle hum.

  There is plenty of power in the Z-Coil pickups, but what is surprising is how glassy and detailed they become as the volume is rolled back. What's more, the ASAT Z-3 includes a push/pull tone pot to allow neck+bridge or all three pickups together. In a pinch, the neck+bridge combo does a convincing faux ASAT Special. Talk about versatile! And like the ASAT Special, the Z-3 maximizes sustain with Leo's Saddle-Lock bridge which transfers string energy right into the body end-grain for an incredibly resonant instrument.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.

  Due to the offset pickup design, the ASAT Z-3 is available in Right-Hand only.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD Z-Coil hum-cancelling
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Controls: 5-position pickup selector, volume, treble with push/pull enabling additional pickup combinations of neck+bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
  - Handedness: right-hand only, due to the offset pickup design
