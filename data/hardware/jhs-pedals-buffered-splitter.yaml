description: A compact buffered signal splitter that converts your guitar's hi-Z
  signal to lo-Z and sends it to two outputs without tone loss, ideal for
  dual-amp rigs or routing a tuner out of line.
details: |-
  There are so many reasons to add the JHS Pedals Buffered Splitter to your pedalboard. But the most important one is great tone. If you've ever split your guitar's signal with a passive device, adapter, or even certain effects pedals, you know that the results can sometimes be less than stellar. This happens because many of those products simply cut your tone in two, sending one half one way and the other half the other way. You can end up with a tone that is muddy and lifeless. Adding our Buffered Splitter to your chain not only avoids these issues, but it will perfectly drive your long cable runs and pedalboard chains as well.

  Simple and Effective Signal-Splitting Device:
  - Send one signal to a tuner that is out of the signal chain while retaining your full tone
  - In a dual-amp setup, both amplifiers will see a powerful, clean signal

  Keeps Your Tone Clear, Powerful, and Pristine:
  - Converts your guitar's hi-Z signal to lo-Z for driving long cables and pedal chains
  - Retains the original tone of your guitar without coloration from the other gear in your signal chain

  Convenient Low-Profile Design:
  - Small size is ideal for saving pedalboard space
  - Can easily be mounted underneath your board
  - Built rugged
  - Black powder coating keeps the buffer hidden in the background

  Note: Designed to work with signal levels up to +4dBu. Exceeding +4dBu will cause clipping!
