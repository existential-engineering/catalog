details: |-
  Part of Taylor's 200 Series, the 217e Plus SB features a Grand Pacific round-shoulder dreadnought body shape with a torrefied Sitka spruce top and layered Indian Rosewood back and sides. The tobacco sunburst finish is applied to the top only, giving it a warm vintage aesthetic.

  Built with a Neo-Tropical Mahogany neck and West African Crelicam Ebony fretboard and bridge, the guitar delivers a rich, powerful voice supported by Taylor's C-Class internal bracing. Faux Pearl 50th Anniversary Diamond inlays and a single-ring rosette add refined visual detail.

  The Expression System 2 electronics provide reliable amplified tone. The guitar ships with D'Addario XS Coated Phosphor Bronze Light strings and an AeroCase for protection.
specs: |-
  - - Body shape: Grand Pacific (round-shoulder dreadnought)
  - Top: Torrefied Sitka Spruce (gloss)
  - Back/sides: Indian Rosewood (layered, gloss)
  - Bracing: C-Class
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-11/16"
  - Tuners: Taylor Nickel with Nickel Buttons
  - Electronics: Expression System 2 (ES2)
  - Color: Tobacco Sunburst (top only)
  - Inlays: Faux Pearl 50th Anniversary Diamonds
  - Binding: Black
  - Pickguard: Black
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: AeroCase included
  - Series: 200
