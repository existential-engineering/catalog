details: |-
  CINDERS OVERDRIVE is the ideal tool for blues shredders and retro rockers. Its all-analog circuit convincingly recreates the warm harmonic distortion associated with a hard-driven tube amplifier. Is it responsive? You bet it is; whether you pick the strings with a dust broom or with a fire iron, CINDERS OVERDRIVE tracks perfectly to ignite your sound. And thanks to its super-wide gain range, your tone remains incredibly transparent at all times.

  If you long for the roar of a maxed-out tube amp, you’re gonna love CINDERS OVERDRIVE. Even if you play late all night at bedroom levels, you always get that hard-rockin’ warm tube sound that drives your soul and your music. There’s just something about the big, warm sound of tube breakup that has inspired legions of rock guitarists for decade after decade.

  While some of our competitors’ overdrive pedals turn your rhythm playing into little more than indistinct clouds of mush, CINDERS OVERDRIVE always keeps your playing from getting lost in the mix. Carefully-engineered circuitry, designed by guitarists, cradles your playing in your desired level of overdrive, warmth and definition in a way that elevates your creativity – just like a real tube amp!

  A sturdy metal chassis with dedicated Input, Output and True Bypass means that CINDERS OVERDRIVE is equally roadworthy and pedalboard friendly. You can power it with a 9V battery, or use our convenient POWERPLUG 9V adapter.

  Capable of a tremendous range of classic tube amp tones, CINDERS OVERDRIVE sports an easy-to-use control layout including: Drive, which controls the amount of overdrive; Volume, controls the output level; and Tone, for setting the amount of high-end content in your signal. Nothing is easier!Check out CINDERS OVERDRIVE at your local TC ELECTRONIC dealer today, or get yours online – and turn your tone up to eleven!
