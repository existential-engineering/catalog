description: Robust UHF wireless lavalier microphone system pairing a metal
  BP-300 bodypack transmitter and ULM18 cardioid condenser lapel microphone with
  a true-diversity half-rack receiver, offering 32 selectable channels,
  ClearScan automatic channel detection, and EZsync one-step transmitter setup
  for presentation, broadcast, and live speech applications.
details: >-
  The R300-L is the lavalier configuration of Electro-Voice's R300 UHF wireless
  series. The system pairs a half-rack diversity receiver with the BP-300
  metal-bodied bodypack transmitter and the ULM18 directional (cardioid)
  condenser lapel microphone, which Electro-Voice sells as the Lapel System with
  ULM18 Directional Microphone for presenters, instructors, and broadcast use.


  The receiver is a synthesized PLL design with true antenna diversity to
  mitigate dropouts, offering 32 user-selectable channels per band with up to 8
  simultaneous channels. ClearScan automatically scans for the cleanest
  available channel, and EZsync transfers the receiver's channel selection to
  the transmitter in one step via an infrared link. Both transmitter and
  receiver have back-lit LCDs that display channel, frequency, mute status, and
  battery level.


  The receiver provides both a balanced 3-pin XLR output and an adjustable
  unbalanced 1/4-inch output, runs on an external 12-16 VDC supply (500 mA max),
  and uses two flexible TNC half-wave antennas for diversity reception. The
  BP-300 bodypack transmitter is powered by two AA batteries for approximately
  14 hours of operation, radiates 8 mW typical, and accepts the included ULM18
  cardioid condenser lavalier via a locking connector. Optional rack-mount
  hardware is available for fixed installations.
specs: |-
  - System type: UHF wireless lavalier microphone system
  - Transmitter: BP-300 bodypack
  - Microphone element: ULM18 cardioid condenser lavalier
  - Polar pattern: Cardioid
  - Receiver type: Synthesized PLL, half-rack
  - Channels: 32 per band; up to 8 simultaneous
  - Diversity: True antenna diversity
  - RF sensitivity: <1.0 uV for 12 dB SINAD
  - Squelch: Tone code plus amplitude
  - Audio frequency response: 80 Hz - 18 kHz, +/-2 dB
  - Distortion: <1.0% (0.4% typical at 1 kHz, 40 kHz deviation)
  - Signal-to-noise ratio: >100 dB
  - Dynamic range: >95 dB
  - Balanced output: 3-pin XLR
  - Unbalanced output: 1/4-inch (RMS adjustable)
  - Receiver antennas: Flexible TNC 1/2 wave
  - Transmitter RF power: 8 mW typical
  - Transmitter power: 2 x AA batteries
  - Transmitter battery life: ~14 hours (AA alkaline, typical)
  - Channel setup: ClearScan automatic + EZsync one-step sync
  - Receiver power: 12-16 VDC, 500 mA max (external supply)
  - Operating temperature: 5 C to 45 C (41 F to 113 F)
  - Chassis: Metal (transmitter and receiver)
  - Mounting: Optional rack-mount hardware available
