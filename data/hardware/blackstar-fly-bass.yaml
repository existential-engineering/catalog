description: The battery powered mini amp for bass that gives you HUGE tone on the go.
details: |-
  The FLY 3 Bass is a 3 Watt compact mini bass amp that delivers huge tone on the go. Designed by the team behind Blackstar's award-winning amps, it pairs a Clean channel with a switchable Overdrive channel so bass players can dial in punchy, warm tones or grittier, more aggressive sounds wherever they are.

  A dedicated Sub control sets the level of a harmonic generator that produces an additional low frequency tone mixed in with the normal signal. This gives the perception of increased low-end girth and incredible bass response from a mini amp — a feature usually associated with much larger cabinets.

  Countless hours went into the design of the cabinet to achieve a sonic performance not normally found in a mini amp. The housing is sealed and tuned to ensure optimum tonal response, and the material used has been mathematically modelled to have the Young's Modulus of wood, retaining the bass response usually associated with a wooden cabinet.

  The FLY 3 Bass also features an Emulated Line Out, perfect for silent practice or home recording, letting you keep your Blackstar tone no matter the volume. A Line In allows phones, laptops or media players to be plugged in for jamming along to music playback through the same speaker.

  Powered by 6x AA batteries or an optional DC power supply, the FLY 3 Bass runs for around 55 hours of performance time on a single set of batteries. An external speaker output also allows the FLY 3 Bass to be paired with the FLY 103 extension cabinet for a 6W stereo setup.
specs: |-
  - 3 Watt compact mini bass amp
  - 2 Channels - Clean, Overdrive
  - Speaker: 1 x 3" Full Range
  - Controls: Gain, EQ, Comp, Volume, Sub Level, OD Engage
  - Emulated Line Out for 'silent' practice or recording
  - Line In for music playback
  - External speaker output for use with FLY 103 extension cabinet
  - Power: 6x AA Batteries or DC (approx. 55 hours runtime on AA)
  - Weight: 0.9kg
  - Dimensions: 170 x 126 x 102 mm
