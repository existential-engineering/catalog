description: The LTD Arrow-400 offers the bold, angular Arrow shape with professional features, components, and build quality while still remaining accessible to musicians. Features set-thru construction, a fast 3-piece maple neck, mahogany body, Floyd Rose Special locking tremolo, and EMG 81/85 active pickups for aggressive tones. Finished in Charcoal Metallic with black hardware.
details: |-
  The LTD Arrow-400 offers the bold, angular Arrow shape with professional features, components, and build quality while still remaining accessible for most musicians. This guitar offers set-thru construction at 25.5” scale, pairing a fast, extra-thin U-shaped three-piece maple neck with a mahogany body. It offers a rosewood fingerboard with 24 extra-jumbo frets, and black binding on the neck and headstock. Components on the Arrow-400 include a Floyd Rose Special double-locking tremolo bridge, Grover tuners, and the time-tested, aggressive tones from a set of EMG 81 (bridge) and EMG 85 (neck) active pickups.
