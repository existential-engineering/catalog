details: |-
  The 424 Gain Stage is a faithful recreation of the preamp circuit found in the TASCAM 424 MKI Portastudio. This compact cassette recorder became iconic for its warm, lo-fi character and is still sought after for the way it makes recordings sound.

  The pedal captures that same character and makes it available in real time. Use it to add warmth and vintage character to your signal chain, or use the XLR DI output to record direct with the same tone. Works as an overdrive, a DI box, or a combination of both.
