details: |-
  Every guitar player recognizes the thick, syrupy tones of their favorite ‘60s guitar heroes blasting their signature licks through a rotating speaker cone. Hendrix, Harrison, Trower, Gilmour, and too many others to list here – they all mastered the unique tone of the original rotating speaker. Now VIBRACLONE ROTARY brings that same lush, whirling effect to your pedal board, allowing you to explore everything from earthy and swampy to ethereal and spacy ambient sounds – all the way up to kaleidoscopic psychedelia!    •    Vintage style rotary pedal with drive     •    Choose between Chorale and Tremolo    •    True Bypass

  Vintage Tone Spinner

  The classic sound of those old rotating speaker systems may have life as an effect designed for the electric organ, but guitarists have always pushed the envelope when it comes to finding new tones. They soon found that when they plugged a guitar in and turned up the tone cabinet tube amps, a surprisingly sweet and dynamic overdrive sound was created – one that has been immortalized on myriad classic rock recordings.

  Simple Controls – Authentic Response

  VIBRACLONE ROTARY’s Drive knob lets you dial-in that same sweetly organic and rich tube amp sustain accompanied by the lush modulation of a rotating speaker. You have the choice of either the slow and rich Chorale setting, or the fast, almost watery-sounding Tremolo setting – just like the original. Turn the Speed knob to adjust the delayed response from the pedal, which simulates the acceleration/deceleration of the speaker cone – once again, just like the real thing.
