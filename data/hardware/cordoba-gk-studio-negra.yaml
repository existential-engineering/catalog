description: GK Studio Negra is the ultimate gigging instrument and a Cordoba best seller.
details: |-
  Built with a solid European Spruce top, Rosewood back and sides, soft cutaway and Fishman Presys Blend preamp, the GK Studio Negra is the ultimate gigging instrument and a Cordoba best seller. Made for the stage, the GK Studio Negra is constructed with a slightly thinner body depth, neck, and nut width than a traditional Spanish guitar. The neck is designed to have little or no relief, offering low action for ease of comfort and quick playability. Flamenco players choose this model for a bassier and more robust tone in contrast to the bright, snappy sound of 'blanca' flamenco guitars. However, any guitarist looking for a new tone will feel right at home. Like every Cordoba guitar, this model has a two-way truss rod built into the neck. Other premium features include a high gloss finish, clear flamenco-style tap plate, and Savarez strings.
