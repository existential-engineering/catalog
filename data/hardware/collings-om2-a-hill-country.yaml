description: The OM2 A Hill Country is an orchestra model acoustic guitar built
  around Collings' Hill Country voicing, delivering a strong fundamental voice
  that is both warm and woody with a dry character and full low end. Featuring
  an Adirondack spruce top over East Indian rosewood back and sides, it appeals
  especially to bluegrass players while remaining versatile across styles.
  Appointments include ivoroid binding, an ebony fingerboard and bridge, and
  Relic Nickel Waverly tuners.
details: |-
  The OM2 A Hill Country is part of Collings' Hill Country series, which emphasizes a dry character and full low end with a strong fundamental voice that is both warm and woody. The orchestra model body measures 15" wide by 19 1/4" long and 4" deep, with a 25 1/2" scale length. The top is Adirondack spruce braced with a Hill Country scalloped X-brace pattern in Sitka spruce. Back and sides are East Indian rosewood. The neck is Honduran mahogany with a mortise and tenon hybrid joint, topped with an ebony fingerboard featuring gold MOP short diamond and squares inlays and a 14"-26" compound radius. The nut is aged bone at 1 3/4" width, and the saddle is aged bone cutthrough style. The belly-style ebony bridge has 2 5/16" string spacing. Tuners are Relic Nickel Waverly. The body is bound in ivoroid with a hand-poured tortoise pickguard set featuring matching rosette ring, wedge, and heel cap.
specs: |-
  - Body Size: Orchestra Model (OM)
  - Top: Adirondack spruce
  - Back & Sides: East Indian rosewood
  - Bracing: Sitka spruce, Hill Country scalloped X-brace
  - Neck: Honduran mahogany
  - Neck Joint: Mortise & tenon hybrid
  - Fingerboard: Ebony
  - Fingerboard Radius: 14" - 26" compound
  - Fingerboard Inlays: Gold MOP short diamond & squares
  - Fingerboard Binding: Ebony
  - Nut: Aged bone, 1 3/4"
  - Saddle: Aged bone, cutthrough
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Frets: Medium 18% nickel-silver
  - Tuners: Relic Nickel Waverly
  - Body Binding: Ivoroid
  - Pickguard: Hand-poured tortoise
  - Rosette: Hand-poured ring from matching pickguard set
  - Backstrip: 2-style (Zipper)
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss ultra-thin nitrocellulose lacquer
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Scale Length: 25 1/2"
  - Strings: D'Addario EJ-16 (.012"-.053")
