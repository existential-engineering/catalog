url: https://www.ibanez.com/usa/products/detail/trmini_01.html
description: Made in Japan tremolo mini-pedal with Wave, Speed, and Depth knobs
  plus an internal Level trim. 100% analog circuitry delivers warm, natural
  tremolo tones in a small footprint.
details: |-
  Part of the MINI pedal family, the Made in Japan TRMINI Tremolo features a three-knob configuration: Wave, Speed, and Depth. It also features a Level trim pot which enables boosting the overall affected sound.

  A true bypass switch provides the shortest, most direct signal path as well as the cleanest tone. The 100% analog circuitry offers amazingly natural tremolo tones. The TRMINI is a classic, warm, and full-sounding tremolo pedal that's also economical on pedalboard space!
specs: |-
  - Controls: Wave, Depth, Speed
  - Level trim pot
  - True Bypass
  - Required Current: 13mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - 100% analog circuitry
  - Made in Japan
