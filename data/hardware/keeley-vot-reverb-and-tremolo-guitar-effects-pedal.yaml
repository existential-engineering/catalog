description: Compact reverb and tremolo combination, with switchable two spring
  or plate reverb and three tube amp style tremolo modes covering volume, pitch
  and harmonic tremolo.
details: |-
  The VoT, or Verb o Trem, is a reverb and tremolo combination designed with session guitarist Eddie Heinzelman for the end of a compact pedalboard, where both effects usually sit after compression, fuzz and overdrive. It pairs Keeley's spring and plate reverbs with tube amp style tremolos in one small enclosure.

  A switch selects between the Keeley two spring reverb, for a splashy spring sound, and a smoother plate reverb with a longer sheen. The same spring reverb is used in Keeley's own amplifier.

  Three tremolo modes are on offer. R plus T is a tube bias tremolo, where the bias shift modulates volume. Mack is a MagnaAmp style pitch vibrato produced by shifting phase. HAR is a harmonic tremolo, sweeping two filters against each other to form a moving notch.

  The two sections can be used together or separately: turning the Depth control down leaves reverb alone, and rolling the Reverb control off leaves tremolo alone.
specs: |-
  - Switchable two spring or plate reverb
  - Three tremolo modes: tube bias volume tremolo, MagnaAmp style pitch vibrato, harmonic tremolo
  - Reverb and tremolo usable together or individually by backing off Depth or Reverb
  - Designed in collaboration with Eddie Heinzelman
