details: |-
  DPK4011 Piano Stereo Kit is a versatile, compact piano kit, which is tailored specifically to accommodate the need for clean sound and limitless creativity. We have collected our award-winning pencil mics - 4011 Cardioid Microphones, renowned in recording studios and live applications around the world. This specialized stereo kit holds the mics and accessories you need to capture fantastic sound no matter what you need. The microphones are matched within ±1 dB. This kit was previously known as 3511ES Stereo Kit with Matched 4011ES Cardioid Microphones.
