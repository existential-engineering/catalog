description: The LB•100 is G&L's subtle evolution of the p-style bass platform,
  with a streamlined body shape and the G&L Saddle Lock bridge for richer note
  definition and sustain.
details: |-
  The G&L LB•100 made its debut in the early '90s in response to bassists asking for a more subtle evolution of the p-style platform, as compared to the SB•1 and L•1000. With a slightly streamlined body shape for improved comfort and balance, the LB•100 also brought the G&L Saddle Lock bridge for richer note definition and sustain. The Tribute Series LB•100 hits the mark, with an ideal balance to the pickup spec for vintage flavor with solid punch.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: G&L Alnico split-coil pickup
  - Body wood: Poplar & Ash Top over Poplar
  - Neck wood: Hard Rock Maple with vintage tint satin finish and Maple or Rosewood fingerboard
  - Neck width at nut: 1 3/4"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: medium jumbo, nickel
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: master volume, master tone
  - Available in: Olympic White over Poplar, 3-ply black pickguard, Maple fingerboard
  - Available in: 3-Tone Sunburst over Swamp Ash Top on Poplar, tortoise pickguard, Rosewood fingerboard
  - Available in: Emerald Blue Metallic over Poplar, tortoise pickguard, Rosewood fingerboard
