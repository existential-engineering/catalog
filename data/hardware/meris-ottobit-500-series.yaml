  and 16-bit video game soundtracks.
details: |-
  Ottobit is designed to give musicians and sound designers tools to sculpt any source into audio reminiscent of early 8 and 16-bit video game soundtracks.

  The unit combines sample rate decimation, from 0.1 Hz to 48 kHz, with bit reduction from 1 bit to 24 bits, and a pitch tracked ring modulator whose carrier frequency can be linked to the pitch of the input signal.

  Tap tempo controlled triggered envelopes and an LFO modulate the sample rate and bit depth, each with selectable waveshapes, while a blendable AM/FM ring modulator rounds out the sound-sculpting palette.
specs: |-
  - Sample Rate Decimation
  - Bit Reduction
  - Pitch Track Enabled Ring Modulator
  - Tap Tempo controlled Triggered Envelopes and LFO Modifiers
  - Selectable LFO and Ring Mod Waveshapes
  - Blendable Ring Mod AM/FM Modulation
  - Premium analog signal path and 24-bit AD/DA with 32-bit floating point DSP
  - Designed and Built in California, U.S.A.
  - Burr-Brown precision balanced input and output drivers
  - Stereo Linkable
  - 100% Analog bypass
