description: The SC4070 is EVE Audio's TEC Award winning active 4-way midfield
  studio monitor, with two 6,5" SilverCone woofers, a 4" SilverCone midrange
  unit and the AMT RS3.1 tweeter, each chassis on its own PWM amplifier. Its
  rotatable central plate lets the monitor stand vertically or horizontally.
details: |-
  The SC4070 is an active 4-way midfield studio monitor that EVE Audio positions for sound balance, precision and bass reproduction in a no-compromise monitoring system. It continues to build on the SC407 it replaces, with an advanced tweeter and midrange section and the capability to reproduce low frequencies through two 6,5" woofers connected to a very powerful amplifier array. Twin woofers reduce distortion even at high SPL and are credited with tight, homogenous bass reproduction and a very linear overall response.

  The two 6,5" SilverCone woofers use a specially made 1.5" voice coil to extend the bass frequency response down to 32 Hz, and both work simultaneously up to 280 Hz. An especially developed 4" SilverCone midrange unit joins them, giving the speaker greater linear excursion and a clear, accurate midrange. The bass and mid woofers use the maker's very low distortion copper cap magnet system, and the combination of a glass fiber coated diaphragm with a very stiff but light honeycomb structure is credited with detailed and clear reproduction.

  The proprietary Air Motion Transformer AMT RS3.1 completes the system. The core of those AMT tweeters is a folded membrane working in the powerful magnetic field of a large neodymium magnet. Design changes such as new materials, an improved inner damping construction and a more efficient magnet field let the SC4070 deliver a higher sound pressure level with virtually no distortion even at high output levels, and EVE Audio states the AMT RS3.1 reaches a frequency response up to 40 kHz.

  Each chassis in the SC4070 is fitted with its own PWM amplifier, for a total short-term output power of 1000 W. With a stated maximum output level of 126 dB (SPL at 1 m, half space, pair), mixes can be judged precisely whatever their intended output level is. As with every other EVE Audio studio monitor, both a balanced XLR input and an unbalanced RCA input are provided. EVE Audio places the SC4070 in mid to large size control rooms where quality and consistent power output matter.

  These 4-way monitors are symmetrically designed. The central, massive silver aluminum plate houses the midrange woofer and the AMT tweeter and is rotatable, which makes the monitor equally suitable for vertical or horizontal positioning. Room adaption filters and volume control are reached through the SMART-knob with its LED ring, which indicates all settings, and a sophisticated cabinet with a beveled, ultra-stiff front plate reduces unwanted resonances and diffraction.
specs: |-
  - Frequency range: 32 Hz - 25 kHz
  - Woofer size: 6,5"
  - Max. SPL: 116 dB
  - Configuration: active 4-way midfield studio monitor
  - Frequency range measured at -3 dB at 1 m distance
  - Sound pressure level: 116 dB max. SPL per pair
  - Max. output level: 126 dB (SPL at 1 m, half space, pair)
  - Output power: 1000 W per speaker
  - Tweeter: AMT RS3.1
  - Output power tweeter: 250 W
  - Mid-driver: 4"
  - Output power mid-driver: 250 W
  - Woofer: 2 x 6,5"
  - Output power woofer: 2 x 250 W
  - Passive radiator: 6,5" diameter
  - Cross-over frequency: 280 & 3000 Hz
  - Protection limiter: Yes
  - Volume range: minus infinity to +6 dB
  - High-shelf filter: -5 dB to +3 dB above 3 kHz
  - Mid EQ: -3 dB to +3 dB at 1 kHz
  - Desk filter cut: -5 dB to 0 dB at 160 Hz
  - Desk filter boost: 0 dB to +3 dB at 80 Hz
  - Low-shelf filter: -5 dB to +3 dB below 300 Hz
  - Input level dip switch: +7 dBu / +22 dBu
  - Phase inversion: 0 degrees / 180 degrees
  - Input impedance: 10 kOhm
  - Power consumption: less than 1 W standby, 500 VA maximum
  - Dimensions: 600 x 260 x 320 mm (23.6 x 10.2 x 12.6 inches, WxHxD)
  - Weight: 18 kg (39.7 lb)
