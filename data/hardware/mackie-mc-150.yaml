details: |-
  Bass that doesn't quit

  Building on the Mackie studio monitor legacy, MC-150 headphones offer the audio performance Mackie is known for in a professional, closed-back design. They feature a precision 50mm driver for clear, dynamic sound and low-end response that can keep up with the most demanding applications, plus an ergonomic headband and ear pads for hours of listening comfort.

  High-Performance Studio Headphones

  Featuring precision 50mm transducers, MC-150 headphones deliver clarity across the entire frequency range for an immersive listening experience. Increased bass response means you feel every note, kick drum, and deep synth in your music.

  Professional Design

  The soft padded adjustable headband and conforming ear pads provide an ergonomic fit for hours of comfort while ensuring optimal low-end and sound isolation. The rugged design is built to last and meet the demands of professionals in the studio or on location.

  Take Them Anywhere

  A collapsible fold-up design allows for easy storage and compact portability when traveling, making the MC-150 suited to studio monitoring, DJs, field recording and personal listening. A 9.8 ft detachable straight cable with locking bayonet connector, a gold-plated 1/4-inch adapter and a carry bag are included.
specs: |-
  - Type: Closed-Back
  - Frequency Response: 15Hz - 20kHz
  - Impedance: 33 Ohms
  - Transducer size: 50 mm
  - Sensitivity: 93 dB
  - Weight: 265 g / 9.35 oz
  - 9.8 ft detachable straight cable with locking bayonet connector
  - Gold-plated 1/4-inch adapter and carry bag included
  - Collapsible fold-up design
