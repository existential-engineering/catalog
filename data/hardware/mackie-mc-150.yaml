details: |-
  Building on our studio monitor legacy, MC-150 headphones offer the audio performance Mackie is known for in a professional, closed-back design. Featuring a precision 50mm driver for clear, dynamic sound and low-end response that can keep up with the most demanding applications, plus an ergonomic headband and ear pads for hours of listening comfort.

  Experience the signature Mackie studio sound in headphones that reveal every detail. Featuring precision 50mm transducers, MC-150 headphones deliver incredible clarity across the entire frequency for an immersive listening experience. Increased bass response means you feel every note, kick drum, and deep synth in your music.

  The soft padded adjustable headband and conforming ear pads provide an ergonomic fit for hours of comfort while ensuring optimal low-end and sound isolation. Rugged design is built to last and meet the demands of professionals in the studio or on location.

  Collapsible fold-up design allows for easy storage and compact portability when traveling.
specs: |-
  - Frequency Response: 15Hz – 20kHz
  - Impedance: 33 Ohms
  - Transducer size: 50 mm
  - Sensitivity: 93 dB
  - Weight: 265g / 9.35 oz
  - Cable: 9.8 ft. detachable, high-quality, straight cable with locking bayonet connector
  - Gold-plated 1/4" adapter included
  - Carry bag included
