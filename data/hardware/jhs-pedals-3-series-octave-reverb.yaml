description: The JHS Pedals 3 Series Octave Reverb is a shimmer-style effect
  inspired by Brian Eno's 'Shimmer' technique from the early 1980s, blending
  ambient reverb with octave effects in the reverb's decay. It offers
  toggle-switchable upper or lower octave layering for creating pads and
  textures that fill out ambient space.
details: |-
  The JHS Pedals 3 Series is a collection of pedals designed to give you affordability and simplicity without compromising quality. Each 3 Series pedal is made by us in Kansas City, MO, using high-quality parts, quality control, and attention to every detail. Each pedal has three simple controls and one toggle that offer a wide range of sounds, perfect for beginners and professionals alike.

  In the early 1980s, Brian Eno invented an effect called 'Shimmer,' which was popularized in U2's The Unforgettable Fire (1984). The effect mixed ambient reverb and octave effects in the reverb's decay. The 3 Series Octave Reverb is JHS's take on this classic effect that has been used for decades to allow the guitar to create pads and textures that fill out ambient space.

  Toggle up layers in upper octave sounds, while toggle down layers in lower octave sounds. The pedal runs on 9V DC Negative Center power and consumes 65mA. Dimensions: 4.42" x 2.38" x 1.22".
