description: All-in-one Controller Solution for Serato DJ.
details: |-
  Here it is—the Amazing Mixtrack Pro 3 DJ controller. From Numark the world's leading innovator of DJ equipment and technologies, the Special Edition of the Mixtrack Pro 3 is designed with the skilled, professionally-aspiring DJ in mind. It's the latest addition to the Numark family of industry-leading DJ solutions, featuring 5-inch high-resolution metal jog wheels, 16 multi-function performance pads, and a built-in audio interface for headphone cueing.

  Mixtrack Pro 3 keeps everything you loved about the Mixtrack Pro II and adds 100mm pitch sliders that make it easy to perform even the finest pitch adjustments, so it's easy to keep two cuts in perfect beat sync without any drift. The 16 multi-function backlit performance pads let you add loops, launch samples, and control hot cues, while a multi-function touch strip handles dynamic FX control and track search operation. Dedicated filter knobs per channel give precise tonal control.

  The advanced low-profile rugged metal platters are capacitive and dual-zone, giving you the ability to scratch or stop a track simply by touching the top of the platter, while at the same time allowing you to adjust the pitch by manipulating the platter from the side.

  Mixtrack Pro 3 includes a built-in audio interface that frees you from carrying around an external sound card. Plug your headphones directly into the controller for pre-cueing the next track while another is playing through the master output, and connect a microphone for announcements.

  Includes Serato DJ Intro software, a Prime Loops remix tool kit with 6 sample packs and over 380 premium instrumental loops, drum kits, one-shots, and more (a $200 value), plus exclusive access to download studio-grade audio stems from the Toolroom Records catalog.
specs: |-
  - Built-in 24-bit audio interface
  - 5-inch high-resolution metal jog wheels (capacitive, dual-zone)
  - 100mm pitch sliders
  - 16 multi-function backlit performance pads
  - Multi-function touch strip for dynamic FX control and Strip Search
  - Dedicated filter knob for each channel
  - Ultra-bright LED volume meters
  - Headphone cue with 1/4-inch and 1/8-inch outputs
  - Microphone input with master-only routing
  - Includes Serato DJ Intro software
  - Includes Prime Loops remix tool kit (6 sample packs, 380+ loops)
  - Exclusive Toolroom Records audio stem downloads
  - Class-compliant: no driver installation required on Mac or PC
  - Mac system requirements: OS X 10.6 – macOS 10.13 High Sierra, 1.6GHz Intel Core Duo (i3/i5/i7 supported), 1GB RAM minimum, 1024x768 screen resolution, available USB 2.0 port
  - Windows system requirements: Vista SP1, 7 SP1, 8, 8.1, or 10; 2GHz Intel Core 2 Duo; available USB 2.0 port
