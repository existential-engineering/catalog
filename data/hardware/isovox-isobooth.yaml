details: |-
  The ISOVOX IsoBooth is a premium, fully portable isolation booth engineered for musicians, vocalists, and producers who need professional studio control in any environment. Designed in Sweden, it combines precision-tuned acoustics with a modular construction that allows you to create a complete studio room anywhere without permanent construction or soundproofing headaches. Unlike traditional booths that can weigh over 400 kg (880+ lbs), the IsoBooth weighs only ≈110 kg (≈242 lbs) and assembles in approximately 15 minutes with just a standard screwdriver.
