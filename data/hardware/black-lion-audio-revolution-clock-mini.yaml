description: Portable word clock with Macro MMC and 3 BNC outs
details: The Revolution Clock Mini is a compact, world-class word clock in a
  small-footprint enclosure designed for portable studio and live sound
  applications. It synchronizes multiple digital audio devices using Black Lion
  Audio's patented Macro MMC technology, delivering 0.5 pS RMS of jitter at the
  BNC outputs. MEMS oscillators provide superior stability over traditional
  quartz crystals. Supports sample rates from 44.1 kHz to 192 kHz and can sync
  up to three devices simultaneously, making it ideal for touring professionals
  and mobile setups.
specs: |-
  - Jitter: 0.5 pS RMS (BNC outputs)
  - Outputs: 3x BNC
  - Output Impedance: 75Ω, 5V unterminated
  - Clock Frequencies: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Power: 9V DC, 6W consumption
  - Power Connector: 2.5mm barrel, center pin positive
  - Dimensions: 6" W x 1.75" H x 5.5" D
  - Weight: 2 lbs (0.91 kg)
