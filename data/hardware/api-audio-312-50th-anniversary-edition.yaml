url: https://apiaudio.com/product/312-50th-anniversary-edition/
description: Limited-edition reproduction of the original 1970s API 312
  microphone preamp redesigned for 500 Series format. Faithfully recreates Saul
  Walker's original PCB design with hand-wired components. Only 150 individually
  serialized units produced.
details: Faithful reproduction of the original 312 PCB design with proprietary
  AP2516 input transformer, 65 dB gain range, 20 dB pad switch, switchable 48V
  phantom power, vintage analog VU meter, and peak LED indicator. Each unit
  individually serialized (1–150).
specs: |-
  - Format: 500 Series
  - Gain range: +34 to +69 dB (+14 to +49 dB with pad)
  - Max input: -4 dBu (+16 dBu with pad)
  - Max output: +31 dBu
  - Peak LED threshold: +18 dBu
  - Output impedance: <75 Ohms (transformer balanced)
  - Frequency response: ±0.5 dB, 20 Hz–40 kHz
  - S/N ratio: 120 dB
  - Dimensions: 1.5" × 5.25" × 7" deep
  - Weight: 1.5 lb
