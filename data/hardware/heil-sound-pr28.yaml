details: |-
  Product Overview

  The Heil PR 28 is a small form-factor dynamic microphone specifically designed and engineered to perfectly capture toms, snare drums, and Latin percussion instruments. Built to handle the extreme sound pressure levels and fast transient spikes of hard-hitting drummers, the PR 28 delivers pristine stick attack, deep low-end resonance, and articulate drumhead tone without requiring heavy outboard EQ processing.

  Featuring a dynamic element isolated by a unique dual-suspension system between the element, grille, and body, the PR 28 eliminates unwanted mechanical vibrations, drum shell resonance, and stand rumble. Its tight cardioid polar pattern yields -35 dB of rear rejection at 180° off-axis , isolating each drum from surrounding cymbal bleed, hi-hat spill, and stage volume. Equipped with an integrated threaded mounting clip that pairs seamlessly with the Heil HH-1 drum rim mount, the PR 28 is the ultimate drum-tracking microphone for live stages and recording studios.
specs: |-
  - Purpose-Built for Percussion: Engineered specifically for rack toms, floor toms, snare drums, bongos, congas, timbales, and djembes.
  - Unique Dual-Suspension Isolation: Internal dual shock-mounting system decouples the dynamic element from the grille and die-cast housing to eliminate mechanical rumble and drum ring.
  - High SPL Handling (142 dB Max SPL): Withstands extreme sound pressure levels from heavy hitters without clipping, distortion, or capsule overload.
  - Stellar Off-Axis Rejection (-35 dB): Tight cardioid pattern isolates the target drumhead and suppresses cymbal bleed, monitor spill, and ambient stage noise at 180°.
  - Robust Compact Die-Cast Housing: Small form-factor body fits easily between tight cymbals and drum setups while enduring accidental stick hits.
  - HH-1 Rim Mount Compatible: Built-in threaded mount attaches directly to standard mic boom arms or the Heil HH-1 drum rim mounting system.
  - Element Type: Dynamic.
  - Frequency Response: 55 Hz – 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -35 dB.
  - Impedance: 600 ohms balanced.
  - Output Level (@ 1 kHz): -51 dB.
  - Max SPL: 142 dB.
  - Output Connection: 3-pin XLR.
  - Weight: 9.6 oz (272.1 g).
  - Included Accessories: built-in integrated threaded mount and mic screw adapter.
