description: The DM8000 is a flexible digital audio processor for meetings and
  telephone or video conferencing, with user-configurable DSP and routing,
  multiple inputs and outputs and auto mixing. Designed for installation in
  boardrooms, council chambers and courtrooms, it also provides 8 channels of
  wide band Acoustic Echo Cancellation and integrates with computer-based
  conferencing systems and audio networks over USB, Ethernet and RS232.
details: |-
  At the heart of the DM8000 is a digital audio processor designed around an open architecture format, so system integrators can configure it to meet a customer's requirements and build systems that remain expandable.

  The DSP carries a library of processing modules deployed and configured with the free DM8000 DSP Designer software, which defines and compiles the whole signal and processing structure on a PC before it runs on the onboard DSP. Modules include input, output, Ultranet digital audio transport output, AEC for up to 8 channels, USB in and out, mixers, auto mixer, equalisers, feedback suppression and a range of audio filters.

  Office spaces, boardrooms and conference centres are often built with hard surfaces such as glass, painted or hardwood walls, steel and stone, which trigger reverberation and echoes that degrade a teleconference. The wide band AEC module detects and eliminates secondary room reflections from the signal path for speech, music and multimedia alike.

  Applications such as council meetings and courtrooms use multiple open microphones, which demands attention to input gain and feedback. The Auto Mixer modules automatically adjust and balance levels for up to 8 inputs and combine them into a single output, while the onboard Feedback Suppressor behaves like a highly surgical parametric equaliser, detecting and removing feedback frequencies before they become an issue.

  Using the built-in Ethernet connection, multiple DM8000 devices can be linked into a network for system-wide programming and control, with PC-based software providing configuration and remote control up to 100 m (328 feet) over CAT5 or CAT5e cable. The network can accommodate multiple mic inputs, a live band or stereo music source and telephony, and send the resulting mixes to up to 6 destinations.
specs: |-
  - 10 high-headroom analogue universal mic/line inputs
  - 6 electronically balanced low impedance line level outputs
  - USB audio for computer-based conferencing systems
  - Optional Ultranet digital audio transport output
  - RS232 connector for third-party control systems
  - Ethernet for device linking, programming and remote control
  - Remote control up to 100 m (328 feet) over CAT5/5e cable
  - 8 channels of wide band Acoustic Echo Cancellation
  - Auto Mixer balances up to 8 inputs into a single output
  - Mixes can be sent to up to 6 destinations
  - Configured with the free DM8000 DSP Designer software
