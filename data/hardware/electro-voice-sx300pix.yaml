name: Sx300PIX
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/sx300pix/
description: Weather-resistant 12-inch two-way passive full-range install
  loudspeaker delivering Sx300-series performance (131 dB peak SPL, 65 x 65
  degree coverage) in a polypropylene composite enclosure with Phoenix-style
  terminal-block connectors and rigging points for fixed indoor/outdoor
  installations.
details: >-
  The Sx300PIX is the install/weather-resistant variant of Electro-Voice's Sx300
  two-way passive loudspeaker, configured with Phoenix-style euroblock terminal
  connectors for permanent installations where Neutrik Speakon is not preferred.
  It pairs a 12-inch DL12BFH low-frequency woofer with a 1.25-inch DH3/2010A
  titanium compression driver mounted to a Varipath constant-directivity horn
  that produces a symmetrical 65 degree horizontal by 65 degree vertical
  pattern. EV's Ring-Mode Decoupling (RMD) construction is applied to improve
  clarity and intelligibility at high SPL.


  The enclosure is molded high-impact polypropylene composite with
  weather-resistant treatment for permanent outdoor use, available in black or
  white. Integral handles, a 35 mm pole socket, and multiple M8/M10 suspension
  points enable stand mounting, flying, and array configurations, while rubber
  feet with mating sockets allow stable cabinet stacking.


  The PIX version provides two Phoenix-style terminal-block connectors wired in
  parallel for input and loop-through; the related PI version substitutes NL4
  Speakon jacks for the same connections. As a passive loudspeaker the Sx300PIX
  requires external amplification.
specs: >-
  - Configuration: 2-way passive install loudspeaker

  - LF driver: 12-inch DL12BFH woofer

  - HF driver: 1.25-inch DH3/2010A titanium compression driver

  - Horn: 65 x 65 degree constant-directivity Varipath

  - Crossover frequency: 1.5 kHz

  - Frequency range (-10 dB): 50 Hz - 20 kHz

  - Coverage pattern: 65 degrees H x 65 degrees V

  - Directivity index (Q): 11.1

  - Axial sensitivity: 99 dB SPL (1 W @ 1 m)

  - Maximum SPL: 131 dB calculated / 123 dB axial

  - Power handling: 300 W continuous / 1200 W peak

  - Nominal impedance: 8 ohms

  - Minimum impedance: 5 ohms

  - Connectors: 2 x Phoenix-style terminal blocks (parallel input +
  loop-through)

  - Enclosure: High-impact polypropylene composite, weather-resistant

  - Color: Black or white

  - Suspension: Integral suspension points, 35 mm pole socket, handles

  - Stacking: Rubber feet with mating sockets

  - Dimensions (H x W x D): 586 x 429 x 312 mm

  - Net weight: 17.7 kg
