description: >-
  The Synton Fenix is a rare Dutch analog synthesizer hand-built in limited quantities,
  with only 75 units produced between 1997 and 2000. Designed by Marc Paping and Bert
  Vermeulen, it features 31 semi-modular modules including three VCOs, three VCFs, and
  three LFOs. Notable users include Martin Gore, Aphex Twin, and David Morley.
details: |-
  Synton initially gained recognition in the Netherlands as a manufacturer and distributor of high-end electronic music equipment, importing products from companies like Fairlight, E-Mu, and Ensoniq. Following the company's bankruptcy in 1989, product specialist Marc Paping and designer Bert Vermeulen—who had created Synton's earlier monophonic Syrinx synthesizer—reunited in 1997 to develop the Fenix. Dissatisfied with available synthesizers at the time, they aimed to create something superior.

  The Fenix represents a labor of love with meticulous attention to detail. Initially, only 25 units were hand-built and distributed among close associates and company enthusiasts. Due to strong word-of-mouth demand, an additional 50 units were produced, bringing the total to 75 before production ended in 2000.

  While containing 31 modules, the Fenix employs predetermined architectures rather than full modularity, offering more flexibility than pre-patched instruments but less than fully modular systems. Key components include three voltage-controlled oscillators, three low-frequency oscillators, three voltage-controlled filters, three envelope generators, two CV mixers, three general-purpose mixers, and four voltage-controlled amplifiers.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs
  - Waveforms: Pulse, Pulse Variable, Saw Down, Sine, Square, Sub Oscillator, Triangle
  - Filters: 3 VCFs
  - LFOs: 3
  - Envelope Generators: 3
  - VCAs: 4
  - CV Mixers: 2
  - General Purpose Mixers: 3
  - Total Modules: 31
  - Controls: CV IN, CV OUT
