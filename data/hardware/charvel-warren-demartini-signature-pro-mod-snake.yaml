description: The Warren DeMartini Signature Pro-Mod Snake pays homage to the
  Ratt guitarist's iconic snakeskin-graphic instrument, pairing a Dinky-shaped
  alder body with a Floyd Rose-equipped Speed Neck and a signature Seymour
  Duncan humbucker built for his vibrato-heavy lead style.
details: |-
  The Warren DeMartini Signature Pro-Mod Snake combines an alder Dinky body in a gloss Snakeskin Graphic finish with a bolt-on quartersawn maple neck, hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A maple fingerboard with a 12"-16" compound radius hosts 22 jumbo frets and black dot inlays, anchored by a Floyd Rose locking nut (1.6875") and a 25.5" scale length.

  Electronics feature an HS configuration: a Seymour Duncan Custom Warren DeMartini RTM (Rattus Tonus Maximus) humbucker at the bridge paired with a Seymour Duncan Quarter Pound SSL-4 single-coil at the neck, controlled by a single volume knob and a 3-way toggle switch (bridge / bridge + neck / neck).

  Hardware includes a non-recessed, top-loaded Floyd Rose 1000 Series double-locking tremolo with a Floyd Rose Original arm, Charvel-branded die-cast tuning machines, dome-style knobs, and a licensed Fender Stratocaster headstock, all in a chrome finish.
