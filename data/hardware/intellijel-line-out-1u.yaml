description: Go Out And Play Get your signal out of your modular and into your
  favorite effects boxes, daw, sampler or any other line level device. No fuss
  patching and level control.
details: |-
  This module completes the connection between your Eurorack modular system and the audio world outside it. Convert modular signal levels to balanced, line-level audio and route it into rack-mount or desktop FX units, mixing consoles, digital audio workstations, and so on. Simply connect the desired output of your Eurorack patch to the 1/8″ jack, connect the 1/4″ jack to your destination of choice, and adjust the volume as required.

  The output path steps a nominal Eurorack level (10 Vpp) down to +4 dBu with up to +6 dB gain via a balanced TRS 1/4″ output path, using a high quality THATCorp balanced line driver IC.
specs: |-
  - Width: 10HP
  - Depth: 27mm
  - Power consumption: 9mA @ +12V, 9mA @ -12V
  - Balanced TRS 1/4″ output path
  - Output level: nominal Eurorack level (10 Vpp) down to +4dBu, up to +6dB gain
  - Uses a THATCorp balanced line driver IC
