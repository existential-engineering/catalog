description: An 8hp version of Time Machine, a tactile delay-mixing module that
  creates clocked rhythmic glitch effects, reverbs, and chaos.
details: |-
  Short version: It's Time Machine but 8 HP! Long version: Dan at Tall Dog Electronics makes the best Mutable clones. I mean, that's my opinion, but that's why I was honored when he showed me renderings of Tiny Time Machine. What I didn't expect was how tactile these small knobs would be. Rolling several between your fingers lets you turn up or down regions time. It's a truly powerful interface in a weirdly small package. This is the same exact engine that howls like guitar feedback while granulizing like the grey goo at the end of the universe . Tiny Time Machine can create clocked rhythmic glitch effects, reverbs, chaos, and ego-death. Time Machine Manual

  Download Firmware v1.0.1
