description: The Rumours DW Collector's Series ICON was created to pay homage to legendary DW artist, Mick Fleetwood.
details: |-
  This Collector's Series Icon snare pays homage to a legendary drummer that earned a seat in the Rock and Roll Hall of Fame with his namesake band, Fleetwood Mac.

  The Mick Fleetwood "Rumours" DW ICON snare drum features an 11-ply HVLT shell made from North American Hard Rock Maple with a background of highly figured Curly Maple, meticulously hand-inlaid with multiple John Good-selected exotic woods.

  This limited 6.5x14 snare offers the highest quality of hardware that DW offers. This includes a famed MAG throw-off, three-position butt plate, True-Tone Snare Wires, True-Hoops, and DW Heads by Remo U.S.A.

  Proceeds from the sale of this drum are donated to the International Fund for Animal Welfare (IFAW). Includes a heavy-duty DW snare bag and certificate of authenticity signed by John Good.
specs: |-
  - 11-ply North American maple shell
  - Highly figured Curly Maple background with hand-inlaid exotic woods
  - Laser-cut inlays
