description: A hands-free lavalier microphone designed to expand the MiCreator
  Studio setup. Enables clip-on operation for interviews, content creation, and
  on-the-move recording with integrated headphone passthrough. Features
  omnidirectional pickup pattern, integrated wind protection, and matched
  sensitivity to the MiCreator Studio.
details: |-
  The MiCreator Y-Lav is a lavalier microphone accessory for the MiCreator Studio system. Connects via 3.5mm TRRS and includes a 3.5mm TRS headphone output passthrough for simultaneous monitoring while recording.

  Designed for content creators, podcasters, and journalists who need hands-free recording on the move. Omnidirectional capsule, integrated wind protection, and sensitivity-matched to the MiCreator Studio for consistent audio levels without manual adjustment.
specs: |-
  - Pickup Pattern: Omnidirectional
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity: 5 mV/Pa
  - Maximum SPL: 120 dB SPL
  - Cable Length: 2 m
  - Input Connection: 3.5mm TRRS
  - Output Connection: 3.5mm TRS (headphone)
  - Dimensions: 35 × 17 × 17 mm
  - Weight: 30g
