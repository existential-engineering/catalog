description: A headless model reminiscent of the Zeus in design and the Vader in
  construction, pairing a modern layout with traditional aesthetic ties. Its
  compact body is one of the smallest in the Kiesel line, with reduced weight
  and an optional 24.75 in scale length.
specs: |-
  - Model code: L6 in the gallery, with a tremolo L6X variant
  - Construction: neck-through, headless
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in or 1.90 in at nut depending on configuration
  - Fingerboard: ebony with 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale length: 25.5 in standard, with an optional 24.75 in
  - Bridge: Hipshot headless fixed bridge, .4125 in (10.5 mm) spacing
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 3-way pickup selector
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Body dimensions: 30.4 in long, 1.66 in to 1.68 in thick, 11 in or 11.2 in wide
  - Weight: 6 lbs to 6.2 lbs
  - Strings: Elixir Nanoweb 1046E
