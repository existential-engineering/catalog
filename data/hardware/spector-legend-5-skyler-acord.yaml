details: |-
  Skyler Acord is the bassist of Issues, whose genre-bending approach to metal has propelled them to the forefront of modern rock. Skyler's animated and eclectic approach to bass-playing is matched by his signature bass, which features a stunning flame top, violet stain finish, and unmistakable bright green inlays. A longtime Spector player, Skyler modeled his signature model after his custom-built instrument. The body wings are carved from Alder and adorned with a Figured Maple top for a balanced tone with plenty of attack. The 3-piece Maple neck is glued directly to the body wings, completing the neck-thru construction. The Rosewood fingerboard features 24 frets, with Skyler's preferred bright green Crown inlays. For electronics, the Skyler Acrod model is equipped with a pair of custom-wound Bartolini humbuckers and a TonePump Jr. active circuit. Together, these electronics deliver a powerful range of tones, perfect for cutting through the mix or laying back on the groove. Whether you're a fan of Issues or a bassist yourself looking for an instrument that's sure to stand out, Skyler Acord's signature Spector is an excellent choice for your next 5-string.
