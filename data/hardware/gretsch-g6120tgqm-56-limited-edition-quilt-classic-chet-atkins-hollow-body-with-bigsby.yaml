details: |-
  Gretsch Quilt Classics are stylish renditions of classic vintage models, reborn with stunning highly figured quilt maple.

  Co-designed with the guitarist's guitarist, Chet Atkins, the venerable 6120 is one of the most widely heard Gretsch instruments. The G6120TGQM-56 Limited Edition Quilt Classic Hollow Body stays true to the early design with classic aesthetics that are further elevated by the use of highly figured quilt maple. A veritable tonal multi-tool, this hollow body has an easy-playing, comfortable feel and rings out proudly with That Great Gretsch Sound!
