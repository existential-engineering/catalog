details: |-
  Arguably the most important pedal on your board, the Canvas Tuner ensures that your instrument is ready to sound its best with the perfect meld of versatility and precision. Packaged in the same tough-as-nails, tour-ready enclosure as all Walrus pedals, the Tuner features a bright 2.8” TFT LCD display that can be viewed under just about any stage lighting conditions, multiple screen orientations, ±0.1 cent accuracy, buffered or true bypass options and more. The Canvas Tuner ensures that you have the most accurate brush to paint your sonic picture. Uncompromising Accuracy Precise and accurate tuning you expect with ±0.1 cent accuracy and multiple tuning presets. Tune with confidence, allowing your music to shine with clarity. A World of Sound at Your Fingertips With a flat frequency range spanning from 20Hz to 20KHz, the Walrus Audio Tuner is ready to handle tuning for low bass notes to high-strung acoustics. Even bassists needing that low B rumble can tune with confidence. See the Music Come to Life The 2.8” TFT LCD display is your window to pitch-perfection. Its crystal-clear quality ensures your tuning is always on point, even under the blazing stage lights or glaring sunlight. Tailored to Your Preferences Tailor your tuning experience to your liking with multiple screen orientation options and six selectable tuning modes including Strobe and Needle. Your preferences, your performance. Rehearsal Timer Keep track of your show run time with a timer on the tuner screen, standby screen or both. Your Aesthetic, Your Way Match your style with ease. The Walrus Audio Tuner comes with eight color themes and multiple screen savers including a custom picture mode* allowing you to personalize your tuner to fit your unique aesthetic. *Photos can be uploaded to the tuner via walrusaudio.io. Tune Faster with Tune Assist Let Tune Assist guide you swiftly and accurately through your tuning process. Quick and easy tuning has never been so effortless. With Tune Assist, once your note stays in tune longer than a pre-determined threshold, a border outlining the display will flash letting you know that you are in tune and can move to the next string. Versatile Bypass Options Enjoy ultimate flexibility with buffered bypass which routes your audio through our clean, low-noise, high headroom audio buffer with a Total Harmonic Distortion ratio of.001%. This buffer offers a high input impedance of 1M Ohms and low output impedance of 400 Ohms to maintain the highest level of single integrity. Other available bypass modes include relay bypass, monitor mode, and pass-thru. Customize Your Reference Pitch Adjust the reference pitch from 390Hz to 490Hz to suit your musical needs. Precision tuning for any style of music. Additional Features: -Upload up to 12 photos to choose from on your standby screen. -Multiple tuning modes. -Choose to display sharps or flats as your accidental when tuning. Stay Current with Firmware Updates Keep your tuner up to date with firmware updates via www.walrusaudio.io. Experience continuous improvement and new features as they become available.
