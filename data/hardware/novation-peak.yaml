description: >-
  An 8-voice polyphonic hybrid synthesizer combining FPGA-based digital oscillators with analog
  filters, designed by Chris Huggett and announced at SuperBooth 2017.
details: |-
  The Novation Peak was designed by Chris Huggett, the engineer behind the EDP Wasp, OSCar, Akai S-series samplers, and Novation's Bass Station and original Supernova. It pairs FPGA-based digital oscillators with an analog signal path, creating a hybrid architecture that draws on both worlds for its sonic character.

  At the heart of the Peak are three New Oxford Oscillators, named in reference to Huggett's residence and the OSCar legacy. Running on an FPGA at 24 MHz, these numerically controlled oscillators generate analog-style waveforms with exceptional precision while avoiding typical sample-rate limitations. The saw wave can multiply and detune on the FPGA to create triple saws without consuming additional polyphony. Seventeen wavetables with five waveforms each blend smoothly between positions, complemented by oscillator sync and linear FM cross-modulation.

  The multimode analog filter derives from the Bass Station II, offering 12dB and 24dB slopes in low-pass, band-pass, and high-pass configurations with self-resonance capability. Pre- and post-filter analog distortion adds further tonal shaping. Three FPGA-based digital effects — reverb, delay, and chorus — process audio at over 90 kHz, or the ADC/DAC stage can be bypassed entirely for a pure analog path.

  Controls use 8-bit resolution rather than standard 7-bit MIDI CCs, resulting in smoother filter sweeps and parameter changes. A 16-slot modulation matrix, 33-pattern arpeggiator, 512 patch locations, and connectivity including USB MIDI, DIN MIDI, stereo outputs, and a 1/8-inch CV input for modular integration round out a thoroughly modern feature set.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 3 FPGA-based (saw, triangle, square/pulse, 17 wavetables)
  - LFO: 2 MIDI-syncable (triangle, square, saw, S&H)
  - Filter: Multimode analog, 12/24dB, LP/BP/HP, self-resonating
  - Modulation: 16-slot matrix
  - Effects: Analog distortion, syncable delay, chorus, reverb
  - Arpeggiator: 33 patterns, 7 modes, latch
  - Memory: 512 patches (256 factory presets)
  - I/O: USB MIDI, DIN MIDI In/Out/Thru, stereo out, headphones, 2 pedal inputs, 1/8" CV in
  - Control Resolution: 8-bit
releaseDate: "2017"
