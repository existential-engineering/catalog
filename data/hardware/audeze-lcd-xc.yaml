details: |-
  The LCD-XC represents the gold standard closed-back of the professional audio world. It shares drivers and construction with the LCD-X while adding isolation benefits, making it ideal for tracking, monitoring in noisy environments, and preventing microphone bleed.

  The headphones leverage patented Audeze technologies, including Ultra-Thin Uniforce diaphragms, Fazor waveguides, and powerful neodymium N50 magnets in a 106mm planar magnetic driver.

  Highly efficient at 20-ohm impedance, the LCD-XC is easy to drive from most interfaces while offering exceptional clarity and detail.

  The headphones ship with a braided OCC copper 4-pin XLR combo cable with 1/4 inch single-ended adapter, 1/4 inch to 3.5mm adapter, and standard LCD travel case.
specs: |-
  - Style: Over-ear, closed-back
  - Transducer Type: Planar Magnetic
  - Magnetic Structure: Proprietary magnet array
  - Phase Management: Fazor
  - Magnet Type: Neodymium N50
  - Diaphragm Type: Ultra-Thin Uniforce
  - Transducer Size: 106 mm
  - Maximum SPL: >130 dB
  - Frequency Response: 10 Hz - 50 kHz
  - THD: <0.1% @ 100 dB SPL
  - Sensitivity: 100 dB/1mW (at Drum Reference Point)
  - Impedance: 20 ohms
  - Max Power Handling: 5W RMS
  - Minimum Recommended Power: >100mW
  - Recommended Power Level: >250mW
  - Cable Length: 1.9m (6.2ft)
