description: The Empress Echosystem is a dual-engine stereo delay pedal with 42+
  studio-quality algorithms across 12 delay types plus reverb and specialty
  modes. Its dual-engine design lets any two delays run together in parallel,
  series, or left/right, with an analog dry path, up to 35 presets, and a
  universal control port for expression, tap, CV, and MIDI.
details: |-
  The Echosystem is built to span the gamut of known delay possibilities and beyond. It offers 42+ studio-quality algorithms across 12 algorithm types (Digital, Tape, Analog, Multi, Mod, Filter, Ambient, Delay + Reverb, Reverse, Stutter, Lo-fi, and Whisky), including emulations of classic tape and analog delays alongside Empress's own proprietary designs.

  A dual-engine architecture lets any two delays be used together, in parallel, series, or left/right configurations, plus reverb combinations and specialized modes. An analog dry path with VCA blending keeps the dry signal pristine, while 48kHz sampling, 24-bit conversion, and 32-bit internal processing handle the wet path.

  The pedal supports true and buffered bypass, up to 35 presets with bank or scrolling modes, a cabinet simulator, and an output transformer for stereo operation without ground loops. A universal control port accepts an expression pedal, external tap switch, control voltage, external audio input, and MIDI, all through a single 1/4" jack.
specs: |-
  - Dual-engine stereo delay with 42+ algorithms across 12 types
  - Delay types: Digital, Tape, Analog, Multi, Mod, Filter, Ambient, Delay + Reverb, Reverse, Stutter, Lo-fi, Whisky
  - Engines run in parallel, series, or left/right
  - True and buffered bypass
  - Up to 35 presets with bank or scrolling modes
  - Cabinet simulator (3 variations)
  - Analog dry path with VCA blending
  - 48kHz sampling, 24-bit conversion, 32-bit internal processing
  - Output transformer for stereo operation without ground loops
  - Universal control port: expression, external tap, CV, external audio, and MIDI over a single 1/4" jack
  - Input impedance 1MOhm, output impedance 100Ohm (600Ohm with transformer)
  - Frequency response (-3dB) dry 10Hz-50kHz, wet 10Hz-23.4kHz
  - THD dry 0.09%, wet 0.22%; dynamic range dry 106.9dBA, wet 105.5dBA
  - Power 9V DC, 2.1mm barrel connector, 300mA draw
  - Dimensions 5.7" (L) x 3.75" (W) x 2.25" (H with controls), weight 1.5 lbs
