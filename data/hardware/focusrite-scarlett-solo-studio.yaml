description: "Focusrite Scarlett Solo Studio is everything you need to make your
  first hit record, right now. Shop direct with Focusrite today."
details: |-
  All-in-one home studio bundle built around the Scarlett Solo 4th Gen audio interface. Connect the included condenser mic to Solo's detailed, ultra-low-noise mic preamp and it sounds great right away. Plug a guitar into the instrument input. Then listen in stunning clarity with the included SH-450 closed-back headphones.

  Bundle includes: Scarlett Solo 4th Gen audio interface, CM25 MkIII condenser microphone with pop filter, SH-450 closed-back headphones, USB Type-A to Type-C cable, and 3m XLR cable. Comes with the Hitmaker Expansion software bundle plus Pro Tools Intro+, Ableton Live Lite, and Cubase LE.
specs: |-
