description: >-
  The Korg KARMA is a music workstation featuring revolutionary real-time phrase
  generation technology developed by Stephen Kay. Built on the Triton platform with
  62-voice polyphony, it generates complex grooves, arpeggios, and animated effects by
  separating musical phrases into independently controllable parts. Over 1000 Generated
  Effects and eight real-time control knobs allow performers to play intricate synth parts
  that would normally take hours of programming.
searchTerms:
  - Kay Algorithmic Realtime Music Architecture
details: |-
  The KARMA, which stands for Kay Algorithmic Realtime Music Architecture, represents seven years of development by Stephen Kay. It builds upon the proven Korg Triton platform while introducing a groundbreaking approach to real-time musical phrase generation. Musicians can play complex moving synth parts by simply holding chords and adjusting control knobs, making it a powerful tool for both live performance and studio production.

  At the heart of the instrument is the KARMA function, which offers over 1000 Generated Effects with more than 400 parameters per effect. These generate notes and control synthesizer parameters in real-time to produce techno arpeggios, natural sounding glissandos, and many other animated sounds and dynamic effects. Eight knobs and two switches provide real-time control of up to 10 of 16 KARMA parameters, while two Scene memories allow instant recall of current settings.

  The sound engine features HI (Hyper Integrated) synthesis with 425 PCM multi-samples and 413 drum sounds from 32 MB of PCM ROM, expandable to 64 MB via optional EXB-PCM cards. Available expansions include Pianos/Classic Keyboards, Studio Essentials, Future Loop Construction, Dance Extreme, Vintage Archives, and the EXB-MOSS 6-voice DSP tone generator. The studio-quality effects section provides 102 effect types including 2 master effects, 5 insert effects, and 1 master EQ, all with Dynamic Modulation and tempo-syncable LFO.

  A built-in 16-track sequencer accommodates up to 200 songs with 999 measures per song and a maximum of 200,000 notes. It includes 150 drum and percussion patterns, a Realtime Pattern Play/Recording function, and Cue List arrangement for up to 99 sequences. Standard MIDI File compatibility and a 3.5-inch floppy disk drive round out the storage and connectivity options. A free Version 2.0 OS update was released with enhanced features and the KARMA MW companion software.
specs: |-
  - 62-voice polyphony (31 in double mode)
  - 61-key keyboard with velocity and aftertouch sensitivity
  - HI (Hyper Integrated) synthesis engine
  - 32 MB PCM ROM (expandable to 64 MB)
  - 425 PCM multi-samples, 413 drum samples
  - 48 kHz sampling rate
  - 24dB/octave resonant lowpass filter
  - 12dB/octave resonant lowpass and highpass filters
  - Over 1000 KARMA Generated Effects
  - 640 user programs plus 256 ROM programs
  - 768 user drum combinations
  - 64 user drum kits, 16 preset kits, 9 GM drum kits
  - 102 effect types (2 master, 5 insert, 1 master EQ)
  - 16-track sequencer with 1/192 ppq resolution
  - Up to 200 songs, 999 measures each, 200,000 notes maximum
  - 150 built-in drum and percussion patterns
  - 3.5-inch floppy disk drive
  - MIDI with 16-part multitimbral control
