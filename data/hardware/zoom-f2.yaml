description: The F2 is a compact field recorder supplied with the LMF-2 omnidirectional lavalier microphone, recording 32-bit float mono WAV at 44.1 or 48 kHz to microSD cards of up to 1 TB. A dual AD conversion system means there is no gain to set, and screw-lock connectors and a HOLD switch guard against the lavalier being unplugged or the recording being stopped by accident.
details: |-
  The F2 features 32-bit float recording technology, allowing you to record the loudest audio signals without worrying about clipping. It will also record the quietest signals in beautiful detail. There is no gain to set, because the recorder uses a dual AD conversion system: plug in the lav and hit record.

  The F2 Field Recorder gives you the option to choose the recording format that works best for your projects. Choose from 44.1 kHz/32-bit float or 48 kHz/32-bit float mono WAV files, recorded on microSD, microSDHC and microSDXC cards up to 1 TB. Once a recording has started, the HOLD switch keeps it from being stopped accidentally, and screw-lock connectors keep the lav plugged in securely no matter the situation.

  The included LMF-2 omnidirectional lavalier microphone has a low-profile design, captures high-quality audio, and includes a windscreen and lapel mic clip. The F2 can record up to 15 hours (14 hours on the F2-BT) with two AAA batteries.

  The F2-BT comes with built-in Bluetooth. With the free Zoom F2 Control app, the F2-BT can wirelessly start and stop recordings, display battery levels, adjust output volume, control lo-cut and more. The F2-BT can also be paired with a Bluetooth timecode synchronization device to receive and write timecode to recorded files.

  The F2 Editor for PC and Mac allows you to adjust settings, format SD cards and more. Connect the F2 or F2-BT with a USB cable and launch the editor. The USB connection also makes it easy to transfer files to a computer.
specs: |-
  - 32-bit float recording with no input gain setting (dual AD conversion system)
  - WAV: 44.1 kHz/32-bit float or 48 kHz/32-bit float, mono, BWF format supported
  - Mic input: 3.5 mm stereo mini with screw lock, supports plug-in power (2.5 V)
  - Mic input impedance 2 kilohms or more, maximum input level -5.5 dBu
  - Headphone/line output: 3.5 mm stereo mini with screw lock, 20 mW + 20 mW into a 32 ohm load
  - Storage: microSD, microSDHC and microSDXC cards, Class 4 or higher, up to 1 TB
  - USB Type-C, USB 2.0 High Speed for mass storage and PC app operation
  - Power: 2 AAA batteries (alkaline, lithium or rechargeable NiMH) or Zoom AD-17 DC 5 V/1 A AC adapter
  - Continuous recording with lavalier mic at 48 kHz/32-bit float: about 14 hours alkaline, about 10 hours NiMH (750 mAh), about 18 hours lithium
  - Bluetooth Ver 4.2 (F2-BT only)
  - Dimensions: 57.5 mm (W) x 46.4 mm (H) x 22.4 mm (D)
  - Weight: 32 g, main unit only
  - Included LMF-2 lavalier microphone: omnidirectional, -32 dB/Pa at 1 kHz, 115 dB SPL maximum, 160 cm cable, 3.5 mm stereo mini with screw lock
