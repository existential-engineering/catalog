description: A 100-watt EL34-powered all-tube head built as a tribute to Jose
  Arredondo's amplifier modifications, with a three-way Gain Style switch, a Fat
  switch and dual switchable Presence controls.
details: |-
  Jose Arredondo (1923 to 1994) stands as a true pioneer, whose work on classic British amplifiers ignited the high-gain revolution and continues to inspire players worldwide. For years, Dave Friedman has admired and studied the nuances of those celebrated modifications, and the Friedman / Arredondo JOSE head is the culmination of that admiration, capturing the essence of Arredondo's sonic magic within a brand-new Friedman design.

  The JOSE is not just a recreation, it is a tribute developed in partnership with Jose's daughter Marisol Arredondo, and it represents the definitive realization of the iconic Jose mod. Using modern construction techniques and premium components, the JOSE delivers the high-gain tones that defined an era. In Dave Friedman's own words, the JOSE is "a tribute to a true legend in amp modification."

  The JOSE is a 100-watt, EL34-powered head designed to faithfully deliver the high-gain tone and feel associated with Arredondo's amp mods. A three-way Gain Style switch offers access to three distinct Jose-style gain structures, taking the amp into the tonal realms once dreamed of by the guitar heroes of the high-gain rock era. Combined with a Fat switch and dual Presence controls, it offers deep tonal sculpting and unmistakable Jose mod character, harmonically rich, saturated and fiercely articulate.

  While rooted in Arredondo's original design ethos, the JOSE brings those classic tones into the modern era. An internally jumped input stage simplifies gain staging, a bypassable effects loop allows seamless integration of modern pedals and processors, and the two switchable Presence controls shift the amp's voice between vintage and modern tones with precision.

  Built to Friedman's exacting standards, the JOSE is engineered for the demands of any stage or studio, a modern high-gain workhorse that honors the legacy of an amplifier pioneer and acknowledges the influence of classic modified amplifiers on Dave Friedman's own tonal signature.
specs: |-
  - 100-watt all-tube head
  - 4 x EL34 power tubes
  - 4 x 12AX7 preamp tubes
  - Inspired by the amplifier mods of Jose Arredondo
  - Gain control
  - Channel 1 volume (lead spec channel)
  - Channel 2 volume (normal spec channel)
  - Internal channel jumpering
  - 2 styles of master volume control
  - Plexi, Fat and Gain Style switches
  - Bass, middle and treble EQ controls
  - 2 different switchable global Presence controls
  - Bypassable transparent effects loop
  - 4, 8 and 16 ohm impedance jacks
  - Custom, USA-made transformers
  - Dimensions: 29 in x 8.5 in x 11.5 in
  - Weight: 47 lbs
