description: >-
  An optional extra for the Stem Ripper which adds a passive mult for all 8
  channel inputs, allowing a full mix to be recorded without the Stem Ripper
  being the sole output, or to avoid using stacking cables.
details: |-
  The Stem Ripper Thru is an optional 2HP passive output expander for ALM Busy Circuits' Stem Ripper eight-channel audio recorder. It duplicates all eight of the Stem Ripper's channel inputs to a row of unbuffered 'thru' outputs, effectively acting as a passive mult for the whole patch.

  This allows a full mix to be recorded while the same eight signals still pass on to other destinations, so the Stem Ripper does not have to be the sole endpoint of the patch and stacking cables can be avoided. Being passive, the module draws no power and connects to the Stem Ripper via its expander connection.
specs: |-
  - Format: Eurorack, 2HP
  - Depth: 32mm
  - Power: passive (0mA — draws no power)
  - Passive mult of all 8 Stem Ripper channel inputs to 8 thru outputs
  - Unbuffered outputs
  - Warranty: 2 years
