hp: 4
url: https://www.expert-sleepers.co.uk/cvm8.html
description: The CVM-8 is an eight channel CV to MIDI and CV to I2C converter in
  a 4HP Eurorack module, with two independent MIDI ports and Select Bus
  transmission.
details: |-
  The CVM-8 is an eight channel CV to MIDI and CV to I2C converter in a 4HP Eurorack module.

  Its two independent MIDI ports can be used with any MIDI device via 5 pin DIN or TRS 3.5mm jack breakouts, or connected directly to other Expert Sleepers modules through their MIDI breakout headers. Compatible Expert Sleepers modules include the disting mk4, FH-2 and ES-9 for MIDI, and the disting EX for both MIDI and I2C. Compatible breakouts include the MIDI Breakout and the Tiny MIDI Breakout.

  The CVM-8 also sends on the Select Bus, so no wiring is required to drive a module such as the disting EX.

  A number of standard configurations can be selected using DIP switches on the PCB, and full configuration and firmware update is possible through a browser-based tool. As an added bonus, the module also provides I2C-to-MIDI functionality.
specs: |-
  - Panel width: 4HP
  - Eight CV input channels
  - Two independent MIDI ports
  - MIDI via 5 pin DIN or TRS 3.5mm jack breakouts
  - Direct connection to Expert Sleepers MIDI breakout headers
  - Select Bus transmission
  - I2C-to-MIDI conversion
  - Standard configurations selected by DIP switches on the PCB
  - Browser-based configuration and firmware update
