description: Control your Bullfrog without touching it.
details: |-
  The GESTURE CONTROLLER voice card gives a new type of control over the Bullfrog, allowing it to be played like a Theremin with some handy extras. The PITCH and VCA/VCF sensors are internally routed to the VCO pitch and to the VCA level and VCF cutoff parameters of the Bullfrog once the card is connected.

  The card carries a built-in pitch quantizer that can be turned on or off as desired and an adjustable pitch range for the sensors of 1V, 3V or 5V. Another toggle switch adds an internal connection that sends gates to the Bullfrog's envelope generators from the VCA/VCF sensor.

  Besides those internal connections, the card has separate outputs for PITCH CV and for VCA/VCF CV taken from the sensors, so the gesture control can be patched elsewhere.
specs: |-
  - Instant Theremin feature
  - Built in pitch quantizer
  - Adjustable pitch range (1V, 3V or 5V)
  - PITCH and VCA/VCF sensors internally routed to the Bullfrog
  - Switchable gate connection from the VCA/VCF sensor
  - Separate PITCH CV and VCA/VCF CV outputs
