details: |-
  The coolest short scale bass on the block is now available from G&L.

  The Fullerton Deluxe Fallout Bass is available in several colors. This 30" short scale powerhouse features a G&L Magnetic Field Design humbucking pickup controlled by a 3-position mini-toggle switch for parallel, split and OMG modes, just like an L•1000, bringing anything from modern to old school tones to the player's fingertips. What is more, players used to a traditional 34" scale will find this pint size puncher super easy to play.

  Other features include an Alder body, Maple bolt-on neck, Maple or Rosewood fingerboard, Saddle-Lock Bridge and G&L Ultra Lite tuners.
specs: |-
  - Pickups: G&L Magnetic Field Design humbucking pickup
  - Body wood: Alder
  - Neck wood: Natural Satin Hard Rock Maple with Rosewood fingerboard
  - Neck profile: 1 5/8" slim C with 12" radius 30" Scale length
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock bridge
  - Electronics: 3-position mini toggle for parallel/split/OMG pickup modes, volume, tone
  - Includes: G&L Deluxe Gig Bag
  - Available in: Himalayan Blue over Alder, 3-ply parchment, Rosewood fingerboard
  - Available in: Shell Pink over Alder, 3-ply parchment, Rosewood fingerboard
  - Available in: 3-Tone Sunburst over Alder, 3-ply tortoise pickguard, Rosewood fingerboard
  - Available in: 3-Tone Sunburst over Alder, 3-ply black pickguard, Maple fingerboard
  - Available in: Purpleburst over Swamp Ash, 3-ply black pickguard, Maple fingerboard
  - Available in: Alpine White over Alder, 3-ply pearloid pickguard, Rosewood fingerboard
