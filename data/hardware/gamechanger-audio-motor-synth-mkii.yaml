description: Hybrid electromechanical synthesizer whose oscillators are spinning
  electro-motors, read as sine, saw and square waveforms by optical discs and
  infra-red sensors and as an M waveform by electromagnetic pickups. It carries
  two four-oscillator motor voices, a third digital DCO voice, independent
  analog multimode filters, three assignable LFOs, cross-modulation and detune,
  an arpeggiator, a sequencer, motion recording and an eight key performance
  keyboard.
details: |-
  MOTOR Synth MKII is the second iteration of Gamechanger Audio's idea of electromechanical synthesis, and the result of years of development on the original MOTOR Synth design.

  The instrument is based on a motor oscillator engine, a system of electro-motors that change their rotation speed instantly and precisely in order to produce musical notes. These motor oscillators produce four distinct waveforms: Sine, Saw, Square and the so-called M waveform. The M waveform comes from a set of electromagnetic pickups placed next to each motor's rotating inner coils, whose electromagnetic fluctuations are amplified into a motor waveform. The Sine, Saw and Square waveforms come from specially designed optical discs mounted to each motor's shaft, each disc carrying three tracks engraved onto its reflective surface as circular optical representations of those waveforms. Each reflective track is paired with a separate infra-red laser and sensor that picks up the reflected beam, so that as the disc rotates and brings the differently shaded areas into circular motion the reflectivity sensor outputs an optical waveform, a technology Gamechanger Audio developed specifically for the MOTOR Synth.

  There are two separate motor voices with four electromotor oscillators each, and either voice can operate in mono, unison or four-note polyphonic mode. Each has its own controls for volume, scale and waveshape, individual amp envelope engines per note, and detailed control over a portamento and pitch modulation section called Acceleration / Brake. Each motor voice also has its own analog multimode filter section with adjustable drive, cutoff, resonance, envelope shape and amount, and filter type, across four analog filter types. The MKII filter circuits have increased headroom, improved envelope response speed and a precise analog keytrack mode with adjustable depth, direction and filter glide.

  The MKII adds a third voice, a digital engine (DCO) that can be used independently or to augment the raw sound of the motor voices, producing classic waveforms with waveshaping or acting as a noise generator. It has its own amp envelope, portamento section and digital multimode filter designed to reproduce the four analog filter modes.

  The modulation section carries three individual LFOs with adjustable positive and negative depth, each assignable to almost any knob or encoder value across two independent modulation slots. A dedicated center indent potentiometer creates amplitude cross-modulation with either voice, and a Detune / Drift knob offers two kinds of oscillator detune. An arpeggiator, multiple motion record lanes and a monophonic sequencer handle pattern work, and notes can be played from the eight key performance keyboard or from external MIDI and CV gear.
specs: |-
  - Improvements over the original MOTOR Synth: lower mechanical noise, from a custom motor engine, soft-mounting and sound panels
  - Upgraded filter and VCA section
  - Expanded controls for portamento, detune and cross-mod
  - 3 fully assignable LFOs
  - Added digital voice (DCO)
  - Improved sequencer, arpeggiator and motion record
  - Improved user interface
  - Two independent MOTOR voices with 4 electromotor oscillators each, both able to operate in mono, unison or four-note polyphonic mode
  - Four motor oscillator waveforms: Sine, Saw, Square and the M waveform
  - Per-voice controls for VOLUME, SCALE and WAVESHAPE, individual AMP ENVELOPE engines for each musical note, and a PORTAMENTO / PITCH MOD section called Acceleration / Brake
  - Separate analog multimode filter section per motor voice, with adjustable DRIVE, CUTOFF, RESONANCE, ENVELOPE SHAPE and AMOUNT, and FILTER TYPE
  - Four analog filter types: 24 dB LP, 12 dB BP, 12 dB HP and 12 dB AP (all-pass), with a precise analog keytrack mode with adjustable depth, direction and filter glide
  - Third digital voice (DCO), usable independently or alongside the motor voices, producing classic waveforms with waveshaping or acting as a noise generator, with its own AMP ENVELOPE, PORTAMENTO section and digital multimode filter reproducing the 4 analog filter modes
  - Single output jack configurable as mono or as stereo, routing the two motor voices to separate channels. The digital voice can be routed to the V1 or V2 outputs, or to both
  - Modulation section with 3 individual LFOs with adjustable positive and negative depth controls, each assignable to almost any knob or encoder value across two independent modulation slots, A and B
  - Five independent modulation waveforms per LFO, each with a waveshaping engine
  - Dedicated center indent potentiometer for amplitude cross-modulation with either Voice 1 or Voice 2
  - Detune / Drift knob with two kinds of oscillator detune effects
  - Arpeggiator engine with control over note accent, pattern shift, note repeat and more
  - Multiple independent motion record lanes assignable to all sound parameters
  - Built-in monophonic sequencer with controls for micro-timing, probability, ratchets, pattern length, and pattern saving and chaining
  - Non-velocity-sensitive 8 key keyboard with 4 pitch shift encoders
  - Fully MIDI and CV compatible, for use with external keyboards (including poly-aftertouch), controllers and sequencers
  - Made in the EU, Riga, Latvia
