details: |-
  The Baby 1 is Collings' smallest production guitar, offering remarkably balanced tone with adequate volume for its compact form. While it lacks the deep bass response of larger models, it is equally useful as a travel guitar and as a songwriter's instrument, playable comfortably in any seated position. The guitar features a Sitka spruce top paired with Honduran mahogany back, sides, and neck, with an ebony fingerboard sporting MOP short-dot inlays and a small belly-style ebony bridge. Construction details include a pre-war scalloped X-brace pattern in Sitka spruce, a mortise & tenon hybrid neck joint, a fully adjustable truss rod, and a 14"-26" compound fingerboard radius. The body is bound in tortoise with b/w/b/w top purfling. Finishing is high-gloss nitrocellulose lacquer on the body and high-gloss polyester resin on the neck.
specs: |-
  - Body Width: 12 1/2"
  - Body Length: 17 1/8"
  - Body Depth: 3 15/16"
  - Total Length: 36 1/2"
  - Scale Length: 24 1/8"
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with MOP short dots
  - Bridge: Ebony small belly-style, 2 3/16" spacing
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Bridge Pins & End Pin: Ebony with MOP dot
  - Tuners: Nickel Waverly
  - Neck Profile: Modified V
  - Peghead Profile: Square with volute
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Frets: Medium 18% nickel-silver
  - Fingerboard Radius: 14" - 26" compound
  - Brace Material: Sitka spruce
  - Brace Pattern: Pre-war scalloped X-brace
  - Backstrip: 1-style (Walnut)
  - Rosette: b/w purfling
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Peghead Veneer: Ebony with MOP Collings logo
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Strings: D'Addario EJ-16 (.012"-.053")
