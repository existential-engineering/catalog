description: >-
  The Roland XP-50 is a 64-voice digital synthesizer workstation built around
  the same sound engine as the JV-1080, featuring 8MB of sampled ROM waveforms
  and 512 onboard waveforms processed by 32-bit custom RISC chips. It combines a
  61-note velocity- and aftertouch-sensitive keyboard with a 16-track MRC-PRO
  sequencer, making it a capable all-in-one music production workstation. The
  XP-50 supports up to four SR-JV80 expansion cards for a maximum of 42MB of
  sounds, and has been used by artists including The Cure.
details: |-
  The XP-50 is essentially a JV-1080 module with a built-in keyboard and 16-track sequencer. It delivers superb sound quality capable of emulating most any instrument imaginable, from totally fat analog synth-type sounds to loads of percussion. With 64 voices of polyphony and 16-part multitimbrality, it provides ample capacity for complex arrangements.

  The onboard MRC-PRO 16-track sequencer features a 60,000-note capacity and can hold 100 patterns and 1 song, making it a self-contained composition tool. A built-in 3.5-inch disk drive allows for convenient storage and loading of sequences and sound data.

  Expandability is a key strength of the XP-50. It ships with 8MB of sounds and offers four SR-JV80 expansion slots plus two data card memory slots, allowing users to grow the sound library up to 42MB with any of the popular SR-JV80 expansion cards. This makes the XP-50 an excellent beginner's pro-quality workstation that can scale with a musician's needs.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 32-bit custom RISC chips, 512 onboard waveforms
  - LFO: Up to 8 MIDI-syncable LFOs
  - Filter: TVF (lowpass, bandpass, highpass, peak)
  - Effects: 40 multi-effects, reverb, chorus
  - Memory: 640 patches, 128 performances
  - Sound Memory: 8MB onboard, expandable to 42MB
  - Expansion: 4 SR-JV80 expansion slots, 2 data card memory slots
  - Sequencer: MRC-PRO 16-track, 60,000-note capacity, 100 patterns, 1 song
  - Keyboard: 61 keys with velocity and aftertouch
  - Storage: Built-in 3.5-inch disk drive
  - MIDI: 16-part multitimbral
