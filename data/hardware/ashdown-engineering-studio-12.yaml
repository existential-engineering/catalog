description: Weighing just 13.11kg, the Studio 12 delivers 100 watts of classic
  Ashdown tone through a custom lightweight 12" speaker, combining portability
  with punch.
details: |-
  The Studio 12 is a 100-watt bass combo with a custom lightweight 12" speaker, a 5-band EQ, foot-switchable valve-emulated overdrive, a Line In, an XLR DI output and a headphone out. Rugged tolex and chrome corners suit practice, rehearsal and small gigs alike.
specs: |-
  - Power output: 100W
  - Speaker: 1 x 12" Ashdown
  - Weight: 13.11kg (28.9lbs)
  - Size (mm): H-408 W-357 D-500
  - 5-band EQ: Bass, Low Mid, Middle, Hi-Mid, Treble
  - Pre shape
  - Valve-emulated drive
  - Line input
  - Headphone out
  - Line mix control
  - XLR DI output
  - Footswitchable drive
