details: |-
  After the success of the Kyber series in 2025, there were immediate calls for a bass version. In response, the Kyber Headless Bass was created. Following the same cues as its guitar counterpart, the HKBM takes an ultra-modern approach in design, playability, and comfort.

  Designed for the modern player, the Kyber Bass is exclusively available in a 5-string, multiscale configuration. The electronics featured on the bass are the Darkglass pre-amp, most notably used in the A2, and two Tritium pickups with the option for three.

  Following in the footsteps of the Kyber Headless guitar, the bass iteration equips a new locking nut developed by Kiesel and a headless headpiece compatible with standard hangers. Due to the naturally thin body of the Kyber shape, the Kyber Headless Bass offers reduced weight on the player, further enhancing comfort and reducing fatigue.

  The Kiesel bass line hasn't seen an addition this dramatic since the introduction of the A2 in 2023, introducing bold new concepts to Kiesel basses like the headpiece and new nut. Some of the benefits introduced in the original Kyber carry over, including increased upper fret access, the extreme arm contour, and rear-mounted strap buttons for balance.
specs: |-
  - Exclusively available in a 5-string, multiscale configuration
  - Headless design with a Kyber headpiece compatible with standard hangers and a locking nut developed by Kiesel
  - Construction: bolt-on with radiused neck heel
  - Scale length: multiscale, 34" to 35.5", 33.5" to 35" or 34" to 37" depending on configuration
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" or 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Body: alder
  - Pickups: dual Kiesel Tritium humbuckers, with the option for three
  - Electronics: Darkglass preamp, master volume/push-pull active-passive switch, pickup blend, stacked concentric bass/treble
  - Bridge: Hipshot multiscale headless bridge, .748" (19mm) spacing
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Dunlop Super Brights
  - Rear-mounted strap buttons for balance, extreme arm contour and increased upper fret access
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Body dimensions: 45.5" to 46.75" long, 1.7" to 1.75" thick, 12.5" to 13" wide depending on configuration
  - Weight: 7.5 to 8.15 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Built to order with a choice of body, top, fingerboard and finish options
