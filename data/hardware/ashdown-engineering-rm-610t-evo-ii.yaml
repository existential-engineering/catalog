details: |-
  The Ashdown Rootmaster EVO 610T is a commanding 900W 6x10 inch cabinet, delivering a rumbling 900 watts at 4 ohms through six White Line Ashdown 10 inch speakers. Tonally it offers a dynamic, punchy mid-range while maintaining its signature low-end response, and the tweeter's three-way switch lets you fine-tune the high-end frequencies to suit your playing style. Crafted from lightweight ply for portability, it features rear handles, castors and a kick-back design, and connects via genuine Neutrik Jack/Speakon combi jacks. Finished in Buffalo Tolex with a black cloth grille, it is built to be durable and stylish.
specs: |-
  - Power Handling: 900 Watts
  - Impedance: 4 Ohms
  - Speaker Configuration: 6 x 10 inch + 3-way switchable tweeter
  - Connectors: Neutrik Jack/Speakon combi jacks
  - Construction: Lightweight ply, Buffalo Tolex, rear handles, castors, kick-back design
