description: A digital delay with up to 900mS of crisp, articulate repeats,
  subtle modulation, and self-oscillation on demand.
details: |-
  What started as a simple concept morphed into the perfect digital delay. After
  getting lost in the prototype, Mr. Black decided to do a short run.

  The Digi-Delay offers up to 900mS of delay time with crisp, articulate repeats
  and just a hint of subtle modulation that only appears when desired. It is
  excellent on bass and baritone guitars and offers self-oscillation on demand.

  The Black LTD. Digi-Delay is a Jack Deville original design, produced as a
  limited run.
specs: |-
  - Digital delay, up to 900mS delay time
  - Crisp, articulate repeats with subtle modulation
  - Self-oscillation on demand
  - Well suited to bass and baritone guitars
  - Limited run
