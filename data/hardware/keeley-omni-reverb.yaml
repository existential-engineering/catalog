description: A three-mode reverb with Room, Spring and Plate voices and two
  controls, Dwell and Level.
details: |-
  The Omni Reverb is a simple three-mode reverb intended to be set once and left alone. A mode switch selects Room, Spring or Plate, and the only other controls are Dwell, which sets the length of the decay, and Level, which sets how much reverb is added.

  The Room setting is voiced for a small club or living-room space, including the reflections of hard wood floors, windows and drywall surfaces. The Spring setting emulates a two-spring tank, with enough splash for surf playing and enough depth for slower blues phrasing.

  The Plate setting takes the classic EMT 140 as its reference, with low-end resonance and a high end that decays away as the reverb settles. The page notes plate reverb sits well behind gain and distortion tones because of its frequency balance.

  The page states that the Omni Reverb is a Sweetwater exclusive.
specs: |-
  - Three reverb modes: Room, Spring and Plate
  - Controls: Dwell and Level
  - Spring mode emulates a two-spring reverb tank
  - Plate mode references the EMT 140 plate reverb
