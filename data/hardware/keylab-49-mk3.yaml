description: >
  KeyLab mk3 is an advanced MIDI controller designed to meet the demands of professional use and integrate seamlessly with software and hardware instruments. With a pro-grade semi-weighted keybed, touch-sensitive controls and innovative creative features encased in a durable, high-quality construction - discover a keyboard built without compromise that you can rely on at every turn.
details: |-
  Keylab mk3 is an advanced MIDI controller designed for professional music production and live performance, featuring a pro-grade 49-note semi-weighted keybed with redesigned aftertouch, touch-sensitive controls, and innovative creative features. The keyboard combines durable high-quality construction with an elevated playing experience, offering seamless integration with software and hardware instruments. Whether used in the studio or on stage, keylab mk3 delivers a high-quality instrument built without compromise that musicians can rely on for every creative endeavor.

  The controller features nine touch-sensitive 360-degree rotary potentiometers and nine responsive 50mm faders for precise sound manipulation and DAW control. Twelve velocity and pressure-sensitive rgb pads enable MIDI note triggering, drum and sample playback, and clip launching with visual feedback. A full-color 3.5-inch display with 8 contextual buttons provides real-time feedback on projects and sounds, while the redesigned keybed with reworked balance, weighting, and spring tension delivers unparalleled control of synth and piano sounds.

  Advanced creative features include a multi-mode arpeggiator with hold function for sustaining notes and chords, chord play mode with smart voicing for playing rich chords with single keys, and scale mode that locks the keybed to built-in scales to prevent wrong notes. Adaptive mapping allows real-time tweaking of sound settings, launching clips and scenes, and navigating projects without leaving the controls. The keyboard integrates seamlessly with favorite software through custom scripts and advanced user programs, supporting fl studio, logic pro, ableton live, cubase, and bitwig studio with nks compatibility and mcu/hui protocol support.

  Connectivity options include USB-c for computer and MIDI control center connection with bus-powered operation, MIDI 5-pin din output for external instruments and gear synchronization, and a pedal input supporting sustain, modulation, expression, and auxiliary functions. The construction features high-density plastic with ruggedized knobs and real-wood paneling as standard, designed to withstand professional use in both studio and stage environments. Every unit undergoes 180 individual tests to guarantee impeccable, long-lasting performance and reliability.

  Keylab mk3 includes comprehensive pro software: analog lab pro with 2000+ sounds, ableton live lite, mini v, augmented strings, piano v, rev plate-140 reverb, a 2-month loopcloud subscription with millions of royalty-free samples, and melodics subscription for 40 keyboard lessons. The keyboard is available in 49, 61, and 88-key configurations in black or white finishes, allowing users to choose the option that best fits their desk space and aesthetic preferences.
specs: |-
  - 49-note semi-weighted keybed with aftertouch
  - 9 touch-sensitive 360-degree rotary potentiometers
  - 9 touch-sensitive 50mm faders
  - 12 velocity and pressure-sensitive rgb pads
  - 1 clickable encoder
  - 8 transport switches
  - 4 command switches
  - Pitch bend and modulation wheels
  - Transpose controls (semitones and octaves)
  - Full-color 3.5-inch 320x480px display with 8 contextual buttons
  - Multi-mode arpeggiator with hold function
  - Chord play mode with smart voicing
  - Scale mode with built-in scales
  - Adaptive mapping for real-time control
  - MIDI 5-pin din output
  - Pedal input (sustain, modulation, expression, aux-in)
  - USB-c connectivity (bus-powered)
  - Mcu/hui protocol support
  - Nks-compatible (native instruments komplete kontrol)
  - Advanced integration with fl studio, logic pro, ableton live, cubase, bitwig studio
  - Up to 6 user presets
  - Hybrid-feel release-velocity-sensitive keys
  - High-density plastic construction with ruggedized knobs and real-wood paneling
  - Dimensions: 787 x 72 x 280 mm (30.98 x 2.83 x 11.02 in)
  - Weight: 6.1 kg (13.45 lb)
  - Windows 10+ (64-bit) compatible
  - Macos 11+ compatible
  - 4gb ram minimum
  - 4-core cpu 3.4 ghz (4.0 ghz turbo-boost) or m1 cpu
  - 3gb free hard disk space
  - Opengl 2.0 compatible gpu
