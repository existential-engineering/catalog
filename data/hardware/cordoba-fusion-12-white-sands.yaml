description: A Fusion 12 Exotic Top guitar with beautifully flamed maple back
  and sides and a matching flamed maple veneer overlay on the solid-spruce top,
  producing a bright sound with an integrated Fishman Presys Blend pickup
  system.
details: |-
  Fusion 12 Exotic Top guitars deliver traditional nylon-string tone while also featuring distinctive modern aesthetics. An ultra-thin layer of genuine exotic wood veneer is applied to their solid-spruce tops, resulting in a dramatic appearance without adversely affecting the tone. The Fusion 12 White Sands guitar features a beautifully flamed maple back and sides, complemented by a matching flamed maple veneer overlay. Padauk binding and a hand-inlaid wooden rosette further enhance its unique aesthetics. The guitar produces a bright sound with sweet highs and a snappy response, and its integrated Fishman Presys Blend pickup system maintains that tone when the instrument is amplified.
