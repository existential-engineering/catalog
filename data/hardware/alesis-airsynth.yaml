description: >-
  The Alesis airSynth is a gesture-controlled synthesizer that uses a 3D infrared beam interface
  to trigger and shape sounds through hand movements, modernizing the theremin concept for DJs and
  home musicians.
details: |-
  Released around 2000, the Alesis airSynth took the fundamental idea behind Leon Theremin's
  century-old electromagnetic instrument and reimagined it with modern infrared technology. Its Axyz
  3D controller detects hand position and movement in three dimensions, allowing players to trigger
  and manipulate sounds through intuitive gestures without touching the device.

  The airSynth ships with 50 preset patches spanning synthesizer sounds, musical instrument
  emulations, ambient textures, and sound effects. It was designed for immediate playability rather
  than deep programming, with no editing or patch creation capabilities. This plug-and-play
  philosophy targeted DJs looking for a performance novelty and home users wanting an accessible
  entry point into electronic sound.

  The hardware design reflects its consumer orientation, featuring stereo RCA inputs and outputs
  but no MIDI connectivity, which limited its integration into professional studio setups. As a
  monophonic instrument with no sequencer, arpeggiator, or effects processing, the airSynth was
  more of a performance curiosity than a serious production tool, though its unique control method
  made it a memorable entry in early 2000s electronic music gear.
specs: |-
  - Polyphony: Monophonic
  - Controller: Axyz 3D infrared beam
  - Presets: 50 patches
  - Sound Types: Synth, instruments, ambient/natural, effects
  - Connectivity: Stereo RCA inputs and outputs
  - MIDI: None
  - Sequencer: None
  - Effects: None
