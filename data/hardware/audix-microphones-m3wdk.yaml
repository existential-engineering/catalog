details: |-
  The M3DK is a convenient kit that pairs the AUDIX M3 hanging ceiling microphone with the AUDIX DN43 Dante | AES67 microphone interface, providing a simple to install, network-ready way to stream AUDIX audio performance through Ethernet networks.

  The M3 is an innovative, tri-element hanging microphone designed for applications where aesthetics, sound quality, and ease of installation are critical. The frequency response and polar pattern of its three phase-coherent hypercardioid capsules are tailored for voice clarity and rejection of extraneous noise.

  The AUDIX DN43 interface features one microphone port engineered exclusively for the AUDIX M3 tri-element microphone and one port for AUDIX RJ45-equipped single-element microphones. Each channel has selectable, independently controlled pre-amp gain, as well as low- and high-pass filters. It features balanced audio inputs with RFI filtering and delivers high-fidelity 24-bit, 48KHz audio.
specs: |-
  - 100% RF shielding and immunity
  - Very high output, low self-noise
  - Frequency and pattern tailored for voice clarity and rejection of extraneous noise
  - Evenly dispersed sound with undetectable phase
  - High-quality silicone jacketed microphone cable with adjustable length and position
  - Plenum-rated junction box with RJ45 connector
  - TAA compliant
  - Balanced audio inputs with RFI filtering
  - High-fidelity 24-bit, 48KHz audio
  - Each channel has selectable pre-amp gain, as well as low- and high-pass filters
  - Two 5V logic outputs per port, with source/sink capability, for LEDs
  - One logic input per single-element microphone port for buttons
  - 48V phantom power output
  - Operates on PoE from any IEEE 802.3af compliant equipment
  - Dante Domain Manager (DDM) ready
