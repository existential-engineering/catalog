name: Sub2100
manufacturer: adam-audio
primaryCategory: subwoofer
url: https://www.adam-audio.com/en/subwoofers/sub2100/
description: The Sub2100 is capable of reaching the highest SPLs in the lowest
  frequencies establishing a new benchmark in subwoofer technology.
details: |-
  ADAM Audio developed the Sub2100 to meet the special requirements of large control rooms and studios. It pairs a 21.5" (543 mm) paper-cone woofer with a PWM amplifier rated at 1000 W RMS (1200 W music) in a bass-reflex enclosure tuned to reproduce frequencies down to 18 Hz.

  The combination of sheer amplifier power and exceptionally high driver efficiency (99 dB/W/m) lets the system deliver linear SPL peaks of ≥128 dB at 1 m without significant compression, supporting full-range monitoring in rooms that would overwhelm smaller subwoofers.

  Central to the woofer's performance is a 6" (150 mm) voice coil. The oversized coil keeps the driver linear at extreme excursion, enabling the Sub2100 to reproduce the lowest audible frequencies at very high SPLs while keeping THD above 60 Hz at ≤1%.

  Rear-panel I/O is straightforward: balanced XLR and unbalanced RCA analog inputs share a 10 kOhm input impedance. The crossover is adjustable between 50 Hz and 150 Hz, allowing the subwoofer to integrate with a wide range of main monitors.

  The cabinet measures 850 × 600 × 705 mm (H × W × D) and weighs 85 kg (187.4 lb). The Sub2100 ships with a power cord and manual and is covered by a 5-year warranty.
specs: |-
  - Active subwoofer for large control rooms and studios
  - 21.5" (543 mm) basket diameter woofer
  - 6" (150 mm) voice coil
  - Paper cone material
  - Bass-reflex enclosure
  - Frequency response: 18 Hz – 150 Hz
  - THD > 60 Hz: ≤1%
  - Max peak SPL at 1 m: ≥128 dB
  - Crossover frequencies: 50 – 150 Hz
  - Amplifier type: PWM
  - Amplifier power: 1000 W RMS / 1200 W music
  - Driver efficiency: 99 dB/W/m
  - Analog inputs: XLR and RCA
  - Input impedance: 10 kOhm
  - Dimensions (H x W x D): 850 x 600 x 705 mm (33.5 x 23.5 x 28 in)
  - Weight: 85 kg (187.4 lb)
  - Delivery contents: Power cord, manual
  - Warranty: 5 years
