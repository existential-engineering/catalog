description: The Sub2100 is capable of reaching the highest SPLs in the lowest frequencies establishing a new benchmark in subwoofer technology.
details: |-
  ADAM Audio has developed the unique Sub2100 subwoofer for the special requirements of large control rooms and studios. The Sub2100 combines a huge 21.5" woofer and an amplifier capable of 1000W continuous power housed in a bass reflex enclosure tuned for reproducing frequencies down to 18Hz. The sheer power and extremely high efficiency (99dB/W/m) enable this system to produce linear SPL peaks of >=128dB without any significant compression.

  Essential to the volume of this woofer is the gigantic 6" voice coil. Equipped with this voice coil, the Sub2100 is capable of reaching the highest SPLs in the lowest frequencies that can be perceived by the human ear. On every level, the Sub2100 establishes a new benchmark in subwoofer technology.

  On the rear side of the speaker you can find balanced (XLR) and unbalanced (RCA) connectors. For professional use the XLR connectors will be the first choice. The left and right line-level signal from your signal source (audio interface, mixer, etc.) is connected to the LEFT and RIGHT INPUT jacks using either XLR (balanced) or RCA (unbalanced) cables. The LEFT and RIGHT SATELLITE OUT jacks connect to the inputs of the left and right main powered speakers, or to the inputs of the amps powering the main speakers. A balanced SUB OUT mirrors the input signal, enabling subwoofers to be daisy-chained in a row, with the Sub Level affecting the output so that all subs in the chain can be levelled at once.

  Controls for the satellite filter, phase switch and Sub Level/Filter are located on the rear panel. The Phase Switch alters the phase of the subwoofer relative to the satellites (0 degrees or 180 degrees). The satellites can be driven full range or with an 85Hz high pass as recommended by Dolby laboratories for use in surround setups. The Input Sensitivity can be adjusted from -60dB to +6dB, and the upper frequency limit is variable between 50 and 150Hz, with the 85Hz marker indicating the Dolby recommendation for surround sound settings. Two LEDs on the front indicate operating mode, with the lower LED flashing red to show the protective circuit has engaged on overload.
specs: |-
  - 21.5" Subwoofer (paper)
  - Panel: Rear
  - Amplifier Type: PWM
  - Amp. Power RMS / Music: 1000 W / 1200 W
  - Frequency Response: 18 Hz - 150 Hz
  - THD > 60 Hz: <=1 %
  - Max. peak SPL at 1 m: >=128 dB
  - Crossover Frequencies: 50 - 150 Hz
  - Efficiency: 99 dB/W/m
  - Driver Basket Diameter: 21.5" (543 mm)
  - Driver Voice Coil Diameter: 6" (150 mm)
  - Driver Cone Material: Paper
  - Audio Input Connectors, Analog: XLR / RCA
  - Input Impedance: 10 kOhm
  - Input Sensitivity / Sub Level range: -60 dB to +6 dB
  - Satellite high pass filter: 85 Hz (or full range)
  - Subwoofer phase switch: 0 degrees / 180 degrees
  - Weight: 187.4 lb (85 kg)
  - Height x Width x Depth: 33.5" (850 mm) x 23.5" (600 mm) x 28" (705 mm)
  - Operating temperature: 0 C to 40 C (32 F to 104 F)
  - Storage temperature: -30 C to 70 C (-22 F to 167 F)
  - Humidity: Max. 90 % not condensing
  - Mains: 100-120 V~ 50/60 Hz / 200-240 V~ 50/60 Hz, max. 1000 W
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery Contents: Power cord, manual
