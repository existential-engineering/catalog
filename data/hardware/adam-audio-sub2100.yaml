description: The Sub2100 is capable of reaching the highest SPLs in the lowest frequencies establishing a new benchmark in subwoofer technology.
details: |-
  ADAM Audio has developed the unique Sub2100 subwoofer for the special requirements of large control rooms and studios. The Sub2100 combines a huge 21.5″ woofer and an amplifier capable of 1000W continuous power housed in a bass reflex enclosure tuned for reproducing frequencies down to 18Hz. The sheer power and extremely high efficiency (99dB/W/m) enable this system to produce linear SPL peaks of ≥128dB without any significant compression.

  The world's largest voice coil: essential to the volume of this woofer is the gigantic 6” voice coil. Equipped with this voice coil, the Sub2100 is capable of reaching the highest SPLs in the lowest frequencies that can be perceived by the human ear. On every level, the Sub2100 establishes a new benchmark in subwoofer technology.

  A 5 year warranty is standard across ADAM Audio's portfolio of loudspeakers (2 years warranty plus 3 years optional with product registration). Delivery contents are the power cord and manual.
specs: |-
  - Driver: 21.5″ (543 mm) basket diameter, paper cone, 6″ (150 mm) voice coil diameter
  - Amplification: PWM type, 1000 W RMS / 1200 W music power
  - Frequency response: 18 Hz – 150 Hz
  - Crossover frequencies: 50 – 150 Hz
  - Max. peak SPL at 1 m: ≥128 dB
  - THD > 60 Hz: ≤1 %
  - Audio input connectors, analog: XLR / RCA
  - Input impedance: 10 kOhm
  - Panel: rear
  - Height x Width x Depth: 33.5″ (850 mm) x 23.5″ (600 mm) x 28″ (705 mm)
  - Weight: 187.4 lb (85 kg)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
