name: MM-4D/IN-X
manufacturer: tascam
primaryCategory: audio-interface
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/mm-4d_in-x
description: Compact half-rack 4-channel mic/line to Dante converter for
  professional installation. Accepts four balanced XLR mic/line inputs with +48V
  phantom power and converts them to Dante network audio with 4-channel output.
  Features a built-in 8-in/4-out DSP matrix mixer with ducking, ambient noise
  compensation, compressor, 4-band parametric EQ, and auto-level. Supports up to
  50 scene presets, Dante daisy-chain, and PoE Class 0 power. North American and
  global XLR variant.
details: |-
  Half-rack Dante mic/line input converter (214×44.45×136.1mm, 885g) with XLR connectors for North American and global markets. Four XLR-3-31 mic/line inputs (pin 1=GND, 2=HOT, 3=COLD; +48V phantom; adjustable gain -70 to +26 dBu; EIN -125 dBu). Built-in 8-in/4-out DSP matrix mixer combines 4 local inputs + 4 Dante receive channels, outputs 4 Dante send channels. Per-input DSP: compressor, 4-band parametric EQ, ducking, ambient noise compensation, auto-level. Up to 50 scene presets. Dante daisy-chain via dual RJ-45. Controlled via DCP CONNECT or EZ CONNECT. Primary power via PoE Class 0; optional PS-P1220E DC adapter.
specs: |-
  - - Analog inputs: 4× XLR-3-31, balanced mic/line; range -70 to +26 dBu; impedance ≥2kΩ; +48V phantom; EIN -125 dBu (150Ω)
  - Dante: 2× RJ-45 Gigabit Ethernet (1000BASE-T, Cat5e STP+); 4-in/4-out channels
  - Sample rates: 44.1/48/88.2/96kHz; bit depth: 16/24-bit
  - Freq response: ±0.5dB, 20Hz–20kHz (44.1/48kHz); 20Hz–40kHz (88.2/96kHz)
  - THD+N: 0.003%; S/N: 108dB; crosstalk: 100dB; dynamic range: 108dB
  - Power: PoE Class 0 (primary) or optional PS-P1220E DC adapter; consumption: 7.5W
  - Dimensions: 214(W) x 44.45(H) x 136.1(D) mm; weight: 885g
  - Operating temperature: 0–40°C
