details: |-
  LARKING

  (A four-voice instrument for harmonic exploration, layered textures, and hands-on ambient performance.)

  Please note: Larking is built to order. Due to the incredible response to this new instrument, current lead times may be longer than our typical turnaround. We are building and shipping units as quickly as possible. We really appreciate your support and are excited to get Larking into your hands! - Graig & Zera

  _______________________________________________________________

  Larking is a 4 voice polyphonic ambient drone synthesizer that redefines what a playable synth can be. Pitch is quantized, with each voice locking to a selectable key and one of eight musical modes for consistent harmonic control. It is built for immediate tactile performance and sound exploration, functioning as a sound design tool, performance instrument, and central voice in effects-based setups. It integrates easily into pedalboard systems and complex signal chains. Without traditional keys, it shifts focus from fixed patterns to guided harmonic discovery. Voices can be triggered via onboard controls, MIDI, or CV/gate triggering, supporting hands-on playing, modular systems, and sequencing. Each voice features independent pitch control that snaps to scale degrees, enabling open-ended melodic movement within a stable musical framework. At its core is a morphing tonal engine. The Shape control moves each voice from a warm sine-like foundation into harmonic saturation with analog style overtones, grit, and complexity, delivering a deep resonant low end with strong weight and bass response. Attack and Decay shape voice response from percussive rhythmic strikes to slow evolving swells that dissolve into space. A global LFO modulates pitch across all voices, from subtle drift to extreme instability. Onboard reverb expands everything into a deep spatial field and atmospheric wash. The result is an instrument between a melodic synth, drone machine, and experimental performance tool, grounded in musical structure and open to pitch-based exploration. Designed and assembled in Seattle, Washington. This device requires an isolated, regulated 9V DC power supply (not included). Using any other type of power supply may damage the unit. Enclosure size: 5.625" x 4.625" x 1.563"

