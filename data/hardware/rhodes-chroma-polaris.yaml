description: >-
  A six-voice analog polyphonic synthesizer from 1984 with ARP-derived character, velocity-sensitive
  keyboard, 132 patch presets, and full MIDI implementation.
details: |-
  The Rhodes Chroma Polaris was the company's second synthesizer following their acquisition of ARP,
  and it carries forward the distinctive ARP tonal character in a more accessible package. Released
  in 1984, it delivers a sound described as both tinny and fat, with polyphonic layering capabilities
  across its six voices creating a rich and distinctive sonic palette.

  Two VCOs per voice produce sawtooth and pulse width waveforms, processed through a four-pole
  low-pass VCF with cutoff, resonance, envelope modulation, keyboard tracking, and a dedicated sweep
  knob for LFO and filter cutoff modulation. The envelope section offers an unusual five-stage
  configuration with attack, decay, sustain, sustain decay, and release parameters, providing more
  nuanced amplitude shaping than standard ADSR designs.

  The 61-note velocity-sensitive keyboard and colorful slider layout give the Chroma Polaris a visual
  and functional resemblance to Roland's Juno series, though membrane push-buttons handle patch
  selection and mode switching. A simple real-time sequencer and 132 patch memories round out the
  feature set. Full MIDI implementation allows the instrument to transmit and receive edit controls
  and play up to three patches simultaneously.

  The Chroma Polaris remains rare and difficult to find. Notable users include Leftfield and Jimmy
  Edgar.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 VCOs per voice (sawtooth, pulse width)
  - LFO: Sine or square
  - Filter: 4-pole low-pass VCF with cutoff, resonance, envelope, keyboard tracking, sweep
  - Envelope: ADSDR (attack, decay, sustain, sustain decay, release)
  - VCA: ADR
  - Keyboard: 61 keys, velocity sensitive
  - Memory: 132 patches
  - Sequencer: Real-time
  - Control: MIDI (supports 3 simultaneous patches)
releaseDate: "1984"
releaseDateYearOnly: true
