id: 1FC-iUf9fLLJUCKtbJu3Y
name: THE BOX Console
manufacturer: api-audio
primaryCategory: console
categories:
  - mixer
url: https://apiaudio.com/product/the-box-console/
description: 8-channel compact recording console with API mic preamp circuitry,
  one 500-series slot per channel, on-board stereo bus compressor, 16-channel
  summing bus (24 during mix), full monitor section, cue/talkback, and
  integrated PSU. Entry point to the API console lineup.
details: "8 input channels, each with mic preamp, line input, high-pass filter,
  and one 500-series module slot. Instrument direct inputs on channels 1–4.
  On-board stereo bus compressor (assignable to program bus or channels 1–4). 16
  summing channels (24 during mix) with 0 dB bypass and 4-segment LED metering.
  Stereo program bus: master fader, insert, external input. Aux routing: 1
  stereo + 2 mono sends/buses. Stereo cue send/bus with headphone. PFL, AFL, SIP
  solo modes with stereo solo bus. Two stereo monitor systems. Talkback.
  Integrated PSU."
specs: |-
  - Input channels: 8
  - 500-series slots: 8 (one per channel)
  - Summing channels: 16 (24 during mix)
  - Instrument inputs: channels 1–4
  - Aux sends: 1 stereo + 2 mono
  - Monitor systems: 2 stereo
  - Solo modes: PFL, AFL, Solo-In-Place
  - Metering: 4-segment LED per summing channel
  - Power: integrated
