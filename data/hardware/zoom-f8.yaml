description: The F8 is made for serious filmmakers and sound designers. With
  8-input/10-track recording, super low-noise preamps, and support for
  24-bit/192 kHz audio, the F8 captures the highest-quality audio.
details: |-
  Advances in video have made filmmaking accessible to creators everywhere, but the accessibility of professional audio devices has not kept pace: field recorders with essential features such as time code have been unobtainable for most. The F8 is an 8-channel/10-track field audio recorder and mixer made for serious filmmakers and sound designers, with 8-input/10-track recording, super low-noise preamps, and support for 24-bit/192 kHz audio.

  Eight discrete inputs use locking Neutrik XLR/TRS combo connectors, each with a dedicated gain control knob, a 6-segment LED level meter, a PFL/Solo switch and phantom power (+48V/+24V) on every preamp. The high-quality mic preamps offer up to 75 dB of gain, less than -127 dBu EIN and +4 dB line inputs. A dedicated PFL display shows trim settings.

  Accurate time code (0.2 ppm) I/O arrives on standard BNC connectors, with drop-frame and non-drop formats and Jam Sync. Recording supports up to 24-bit/192 kHz as well as 96, 88.2, 48 and 44.1 kHz, plus 47.952 kHz and 48.048 kHz for HD video compatibility, in BWF-compliant WAV or MP3 file formats with extensive BWF and iXML metadata.

  Advanced onboard limiters cover both input and output, alongside a high pass filter, phase invert and a Mid-Side decoder. Input delay runs up to 30 msec per channel and output delay up to 10 frames per output. Dual mini-XLR (TA3) balanced Main Outs sit beside a 1/8 inch stereo mini-jack Sub Out, with a dedicated 100 mW headphone output and front panel volume control.

  Three power supply options are available: 8 AA batteries, an external DC battery pack with a Hirose connector, or a 12V AC adapter, with automatic switching from DC to batteries at user-defined voltage levels. Dual SD/SDHC/SDXC card slots take up to 512 GB each, the compact aluminium chassis weighs just 2 pounds without batteries, and the unit can also serve as an 8-in/4-out USB audio interface at 96 kHz.
specs: |-
  - 8-channel/10-track field audio recorder and mixer
  - Dual SD card slots: SD 16 MB to 2 GB, SDHC 4 to 32 GB, SDXC 64 to 512 GB
  - Inputs 1-8: XLR/TRS combo jacks (XLR 2 hot, TRS tip hot)
  - XLR mic input gain +10 to +75 dB, impedance 3.3 kilohms, maximum level +14 dBu at 0 dBFS with limiter on
  - TRS line input gain -10 to +55 dB, impedance 28 kilohms, maximum level +34 dBu at 0 dBFS with limiter on
  - Phantom power: +24V/+48V, 10 mA maximum per channel
  - Equivalent input noise: -127 dBu or less (A-weighted, +75 dB input gain, 150 ohm input)
  - THD 0.009% max on XLR mic inputs, 0.010% max on TRS line inputs
  - Frequency response: 10 Hz to 80 kHz +0.5 dB/-1 dB at 192 kHz
  - A/D dynamic range 120 dB typical, D/A dynamic range 106 dB typical
  - Crosstalk: -90 dB or less between adjacent channels at 1 kHz
  - ZOOM mic capsule input (use disables Inputs 1/2)
  - Built-in slate mic for voice memos, freely assignable to tracks, plus slate tone with front panel switch
  - Main Out 1/2 on TA3 connectors, balanced, output impedance 150 ohms or less
  - Sub Out 1/2 on a 3.5 mm stereo mini unbalanced jack, output impedance 100 ohms or less
  - Headphone output: 1/4 inch unbalanced stereo jack, 100 mW + 100 mW into a 32 ohm load
  - WAV recording: 44.1/47.952/48/48.048/88.2/96/192 kHz, 16/24-bit, mono, stereo or 2 to 10 channel poly, BWF and iXML
  - Maximum simultaneous WAV tracks: 10 (8 inputs plus stereo mix), 8 at 192 kHz
  - MP3 recording: 128/192/320 kbps, 44.1/48 kHz, ID3v1 tags
  - Time code precision 0.2 ppm, frame rates 23.976ND, 24ND, 25ND, 29.97ND, 29.97D, 30ND, 30D, BNC input 0.2 to 5.0 Vpp, output 3.3 Vpp
  - Display: 2.4 inch full-colour LCD, 320x240, with monochrome mode
  - USB 2.0 High Speed multitrack audio interface: 44.1/48/96 kHz, 16/24-bit, 8-in/4-out
  - USB 2.0 Full Speed stereo mix audio interface: 44.1/48 kHz, 16-bit, 2-in/2-out, iPad operation supported
  - Power: 8 AA batteries, AD-19 DC 12V 2A adapter, or external DC 9 to 16 V on a HIROSE HR10A-7R-4S 4-pin connector, with automatic DC to battery switching
  - Continuous recording of 2 channels at 48 kHz/16-bit without headphones: 8.5 hours or more alkaline, 10 hours NiMH (2450 mAh), 12.5 hours lithium
  - Built-in tripod mount, camera mount adapter included
  - Dimensions: 178.2 mm (W) x 140.3 mm (D) x 54.3 mm (H)
  - Weight: 960 g (2.1 pounds), main unit only
