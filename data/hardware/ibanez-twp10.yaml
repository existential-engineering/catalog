description: Twin Peaks — a wah-wah pedal with dual inductor circuitry and two
  peak points (one higher, one lower), a Balance knob to mix the peaks, a
  Tone-mode switch, and a Master Level with up to +6dB of boost.
details: |-
  Twin Peaks is a new wah-wah pedal from Ibanez unlike any other before it. Most conventional wah-wah pedals utilize a single peak point to achieve the effect, but Twin Peaks doubles down on this sound by utilizing dual peak points at a higher and lower frequency.

  A Balance knob mixes the two frequency peaks, while the Master LEVEL control sets unity gain at 12 o'clock and offers up to +6dB of boost at maximum. A TONE mode switch (HIGH/LOW) selects between two sweep frequency ranges, and true bypass switching keeps the signal clean when the pedal is disengaged.
specs: |-
  - Controls: Master level, Balance
  - Switches: Tone mode (High/Low)
  - True Bypass
  - I/O: Input, Output
  - Size: 96(W) x 202(D) x 84(H) mm
  - Weight: 815g
  - Required Current: 15mA@9V
  - Power Supply: One 9 volt battery or external DC 9 volt AC adapter
  - Dual inductor circuitry with dual peak points
