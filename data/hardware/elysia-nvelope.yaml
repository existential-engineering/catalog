description: Enhance transients and shape dynamics, unlocking your creative
  possibilities. Unleash the power of transient shaping - especially on drums!
details: |-
  nvelope is a two-channel analog stereo impulse shaper for recording, mixing and mastering, built on Class-A topology. It is described as an evolution of the original Transient Designer, which was originally developed by elysia CEO Ruben Tilgner while he worked at SPL. Where the predecessor worked full range only, nvelope adds a Dual Band mode that confines attack and sustain processing to a chosen frequency range, for a more natural response with fewer unwanted artifacts.

  In Full Range mode the unit works independently of signal level: attack and sustain are dialled in by turning each control left to reduce or right to increase. As on a compressor, the Freq A control reduces the influence of low frequencies on the attack processing, with a higher frequency setting meaning less bass influence.

  In Dual Band mode the Freq A control sets the start frequency for attack processing and the Freq S control sets the end frequency for sustain processing, while Attack and Sustain behave as they do in Full Range mode. This selective processing suits material that produces artifacts when treated full range.

  EQ mode deactivates the dynamics sections while keeping the filter stages active, turning nvelope into a shelving equalizer. Freq A sets the high shelf frequency with Attack setting cut or boost, and Freq S sets the low shelf frequency with Sustain setting cut or boost. The two channels can run as two separate equalizers or be linked for stereo material.

  The two channels can be stereo linked or run dual mono, and in Mixed mode each channel can carry a different task: one signal in Dual Band mode on the left channel and another in Full Range mode on the right, or the left output patched into the right input to shape frequency response with the EQ before Dual Band impulse shaping. An Auto Gain button compensates for the stronger level peaks that attack boosting can create in Full Range mode, and is not offered in Dual Band or EQ operation because it is not needed there.
