description: A lightweight, punchy 60-watt bass combo with a single 10" speaker
  and pro features. It offers passive and active inputs, a 3-band EQ,
  valve-emulated overdrive, a balanced XLR DI output, an aux mix level control
  for the line input, a headphone output, an 8 Ohm extension speaker output, and
  an AppTek socket for iOS amp-sim integration.
details: |-
  Lightweight 60-watt bass combo with a single 10" speaker. Passive and active inputs, a 3-band EQ and valve-emulated overdrive. Balanced XLR DI output for connecting to a PA, an aux mix level control for the line input, a headphone output for silent practice and an 8 Ohm extension speaker output. Premium heavy-duty buffalo Tolex with a vintage red grille. Supplied with an AppTek cable for iOS amp-sim and FX apps (ABM Pre App via Agile Partners Amp Kit).
specs: |-
  - Power output: 60 watts
  - Speaker configuration: 1 x 10"
  - Passive and active inputs
  - 3-band EQ
  - Valve-emulated overdrive
  - Balanced XLR DI output
  - Aux mix level control for line input
  - Headphone output
  - 8 Ohm extension speaker output
  - AppTek socket (iOS amp-sim integration)
  - Heavy-duty buffalo Tolex with vintage red grille
