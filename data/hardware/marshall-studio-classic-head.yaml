description: Compact 20W all-valve guitar amplifier head built in the UK that captures the iconic JCM800 2203 tone in a smaller, lighter, lower-wattage package suitable for rehearsals, studios and home use. Single channel with a four-knob EQ (Treble, Middle, Bass, Presence), Preamp Volume and Master Volume controls drive the unmistakable JCM800 roar from warm cleans to barky overdrive. A power reduction switch drops output from 20W down to 5W, and a series effects loop plus DI output make it stage- and studio-ready.
details: |-
  From warm cleans to barky overdrive, the Studio Classic Head features a master volume control for those who want to ramp up the sound. There is also an effects loop to easily personalise your sound as well as a high and low input to suit your guitar and style.

  Power reduction takes the amp from 20W to 5W at the flick of a switch, so the same power setting can move between a rehearsal space and a home environment.

  A portable replica of the classic JCM800, which was originally introduced in the 80s. It offered more gain, taking you from clean to barking overdrive and soaring solos, and is played by some of the greatest rock musicians of all time.

  The tone is driven by two ECC83 preamp valves, an ECC83 phase splitter and two EL34 valves in the power amp.

  Made in Marshall's Bletchley, England facility, the Studio range shares a circuit design with its larger, older counterparts and incorporates elements of hand-soldering. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: SC20H
  - Range: Studio
  - Built in our UK factory
  - All-valve
  - Single-channel simplicity
  - Same legendary tone as the original JCM800
  - Smaller and lighter than the original
  - Output wattage: 20W (with power reduction option to 5W)
  - Outputs: 5 x 1/4-inch jack speaker sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4-inch jack)
  - Inputs: 2 x 1/4-inch jack instrument inputs (high/low sensitivity)
  - Controls: preamp volume, master volume, treble, middle, bass, presence
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 9.4 kg / 20.7 lb
  - Width: 510 mm / 20.1 inches
  - Height: 240 mm / 9.4 inches
  - Depth: 240 mm / 9.4 inches
  - Country of origin: designed and engineered in UK, made in UK
  - Box contents: detachable power cable included, speaker cable included
  - Colour: Black
