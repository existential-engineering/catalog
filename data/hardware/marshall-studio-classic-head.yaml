description: Compact 20W all-valve guitar amplifier head built in the UK that
  captures the iconic JCM800 2203 tone in a smaller, lighter, lower-wattage
  package suitable for rehearsals, studios and home use. Single channel with a
  four-knob EQ (Treble, Middle, Bass, Presence), Preamp Volume and Master Volume
  controls drive the unmistakable JCM800 roar from warm cleans to barky
  overdrive. A power reduction switch drops output from 20W down to 5W, and a
  series effects loop plus DI output make it stage- and studio-ready.
details: |-
  - Compact 20W head built in Bletchley, UK — a portable replica of the classic 1980s JCM800 2203
  - All-valve circuit: 2 x ECC83 preamp valves, 1 x ECC83 phase splitter, 2 x EL34 power amp valves
  - Switchable power reduction from 20W to 5W for lower-volume practice and recording
  - Single channel with Preamp Volume and Master Volume for clean-to-overdrive range
  - Classic four-knob EQ: Treble, Middle, Bass, Presence
  - Series, switchable effects loop
  - DI output on 1/4" jack for direct recording or FOH feed
  - Five 1/4" speaker jacks supporting 16Ω, 8Ω or 4Ω cabinet loads
  - High and low sensitivity instrument inputs
  - Smaller and lighter than the original JCM800 — suitable for rehearsal, studio and home use
specs: |-
  - Model: SC20H
  - Range: Studio
  - Output Wattage: 20W (with power reduction option to 5W)
  - Channels: 1
  - Technology: All-valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Controls: Preamp Volume, Master Volume, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects Loop: Yes, 1 x series switchable
  - Inputs: 2 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω / 8Ω / 4Ω load), DI (1/4" jack)
  - Product Width: 510 mm / 20.1"
  - Product Height: 240 mm / 9.4"
  - Product Depth: 240 mm / 9.4"
  - Weight: 9.4 kg / 20.7 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
