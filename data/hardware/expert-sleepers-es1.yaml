id: -VLtVy8tY2xDquj-aRZqe
name: ES-1
manufacturer: expert-sleepers
primaryCategory: modular
categories:
  - utility
  - discontinued
hp: 12
url: https://www.expert-sleepers.co.uk/es1.html
description: The ES-1 is a Eurorack audio to CV interface designed for use with
  software such as Expert Sleepers Silent Way. It takes eight channels from a
  computer audio interface on balanced 1/4" jacks or a DB25 socket and outputs
  control voltages to analogue synths and effects on 3.5mm jacks.
details: |-
  The Expert Sleepers ES-1 Audio/CV Interface is a Eurorack module designed for use with software such as Expert Sleepers Silent Way. It connects to an audio interface using standard 1/4" jacks, balanced or unbalanced, or DB25 (also known as DSub) connectors, and outputs CVs to analogue synths and effects on standard 3.5mm jacks. Used with the Silent Way AC Encoder software, it does not require the audio interface to be DC-coupled.

  Compared with connecting an audio interface directly to analogue gear for CV control, the ES-1 removes the need for a DC-coupled interface and for special cables such as TRS to TS floating ring leads. Its inputs are completely standard balanced audio inputs, so there is no danger of damage to the interface, and its output voltage range is much greater, up to nine times that of a DC-coupled interface driven through a floating ring cable.

  Two standard configurations are offered. In the jack version the eight inputs are presented on 1/4" sockets that accept balanced or unbalanced leads, on a 12HP front panel. In the DB25 version the eight inputs are presented on a single Tascam TA88 standard DB25 socket, on an 8HP front panel. Both are 70mm deep, the front panel is drilled for both Doepfer and Analogue Systems mounting holes using a slot rather than a single round hole, and the power connector is a Doepfer standard 16 way IDC with -12V at the bottom edge of the board.

  The unit consists of eight identical channels. Each channel has a balanced input stage that accepts balanced or unbalanced signals, which for interfaces with differential balanced outputs gives double the voltage range of a direct DC connection, an optional rectifier circuit for use when the audio interface is not DC-coupled, connected or disconnected by a jumper on the PCB, and an output amplifier and DC offset circuit with a gain range of approximately 1x to 4.5x and an adjustable offset to centre the rectifier output around 0V.

  The ES-1 is also offered without a front panel, for mounting to a user's own design, for example routing the inputs to the rear of a modular case, or for building into non-Eurorack formats. The circuit works unmodified with plus and minus 15V supplies.
specs: |-
  - Eight channels of audio to CV conversion
  - Jack version: eight inputs on 1/4" sockets, balanced or unbalanced, 12HP panel
  - DB25 version: eight inputs on a single Tascam TA88 standard DB25 socket, 8HP panel
  - CV outputs on 3.5mm jacks
  - Module depth: 70mm
  - Output amplifier gain range: approximately 1x to 4.5x, with adjustable DC offset
  - Optional rectifier circuit per channel, jumper selectable, for AC-coupled interfaces
  - Current draw: 43mA on each of the plus and minus 12V rails (86mA total)
  - Power connector: Doepfer standard 16 way IDC, -12V at the bottom edge of the board
  - Works unmodified with plus and minus 15V supplies
  - Offered without a front panel for non-Eurorack mounting
