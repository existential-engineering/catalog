description: The OC7 is a true condenser instrument microphone featuring a 220°
  swivel head design for flexible positioning in tight studio and stage setups.
  It utilizes Austrian Audio's proprietary OCC7 small-diaphragm condenser
  capsule, delivering crisp transients, wide frequency response, and high SPL
  handling. The microphone features a rugged metal body suitable for both studio
  and live applications, with a transformerless output, dual low-cut filter
  settings, and switchable -10 dB pad.
details: |-
  The OC7 uses Austrian Audio's OCC7 small-diaphragm condenser capsule in a 220° swivel-head body, enabling flexible positioning in tight studio and live setups. Transformerless output for clean, transparent audio.

  Features dual low-cut filters at 40 Hz and 80 Hz (2nd order), and a switchable -10 dB pad. Maximum SPL of 154 dB (160 dB with pad).

  Recognized as a TEC Finalist and Sound on Sound 2024 Nominee.
specs: |-
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity: 10 mV/Pa
  - Equivalent Noise Level: 19 dB SPL (A)
  - Maximum SPL: 154 dB SPL (160 dB SPL with pad)
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 2 mA)
  - Connector: XLR 3-pin
  - Dimensions: 147 × 82 × 54 mm
  - Weight: 275g
  - Polar Pattern: Cardioid
  - Swivel head rotation: 220°
  - Low-cut filter: 40 Hz, 80 Hz (2nd order) switchable
  - Pad: -10 dB switchable
  - Capsule: OCC7
  - Output: Transformerless
