details: |-
  Erica Synths Black 8-splitter is an advanced replacement for stackable patch cables. It is an active buffered multiple with signal status LEDs.

  Use it for splitting CV, audio and clock signals without interference among the output signals and without losing signal strength.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. The Black Series design did not economize on module width, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  The module is 4HP wide and 25mm deep, accepts input signals from -10V to +10V and draws +25mA and -15mA.
specs: |-
  - Active buffered multiple with signal status LEDs
  - Splits CV, audio and clock signals
  - Input signal level -10V – +10V
  - Power consumption +25mA, -15mA
  - Module width 4HP
  - Module depth 25mm
