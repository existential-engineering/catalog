description: A simple three-mode digital reverb pedal with Soft Focus, Spring
  and Plate voices, controlled by Dwell and Level.
details: |-
  The Soft Reverb is a pared-back reverb pedal: one footswitch, three modes and two knobs, with the costlier features of a larger unit left out. It was engineered with revamped algorithms to carry its reverb effects both in the studio and as a wide sound on stage.

  Three modes are on board. Soft Focus is for dreamier reverb scapes, Spring gives the boing of old-school amps, and Plate is a vintage-inspired studio reverb. A toggle selects the voice, and the Dwell and Level controls set how far the chosen effect sits into the mix.

  The pedal is digital, takes a single 1/4-inch input and output, and runs from a 9 V DC supply that is not included. It is made in the USA alongside the rest of Keeley's stompboxes.
