name: AudioFuse X8 IN
manufacturer: arturia
primaryCategory: audio-interface
website: https://www.arturia.com/products/audio/audiofuse-x8/audiofuse-x8-in
prices:
  - amount: 399
    currency: USD
description: >
  AudioFuse X8 IN enhances the flexibility of your studio with 8 premium line- level inputs. Link to any ADAT-compatible audio interface and accommodate more instruments and outboard gear.
details: |-
  The audiofuse x8 in is an audio interface expander that adds 8 premium line-level inputs to existing adat-compatible audio interfaces. It enables accommodation of multiple instruments and outboard gear while maintaining the highest audio fidelity with latest generation ad converters supporting up to 96 khz sampling rate. The unit delivers 119 db dynamic range and -112 db harmonic distortion, ensuring every nuance of recordings and performances is captured without unwanted distortion.

  The input section features 8 high-quality trs line-level inputs ideal for connecting synthesizers, drum machines, external preamps, and other audio sources. Each input can be selected using arrow buttons (1-8), with a pad switch to attenuate high-level signals and prevent clipping, and a link function for stereo channel pairing. The integrated vu meter provides real-time visual feedback for monitoring and editing channels.

  The master section provides comprehensive clock and sync control with selectable sample rates (44.1 khz, 48 khz, 88.2 khz, 96 khz) and synchronization options between internal and word clock sources. Status indicators display current sample rate and sync status for reliable timing across multiple connected devices. The rear panel features two adat output ports for transmitting the 8 input channels to compatible audio interfaces or digital mixers, with smux protocol support for higher sample rates.

  Word clock in connectivity allows the unit to sync to external word clock sources with switchable hi-z and 75 ohm impedance options to match various configurations. The robust half 1-u aluminum rack chassis with removable rack ears provides flexible installation for studio and live setups. A 15v 2a power supply is included, and the audiofuse creative suite is provided to explore and alter sound.
specs: |-
  - 8 line-level analog inputs (1/4" trs)
  - Latest generation ad converters up to 96 khz sampling rate
  - 119 db dynamic range
  - -112 db harmonic distortion
  - Adat outputs (2 ports)
  - Word clock in with hi-z and 75 ohm switchable impedance
  - Smux support for higher sample rates
  - Sample rate selection: 44.1 khz, 48 khz, 88.2 khz, 96 khz
  - Pad switch for input attenuation
  - Channel linking for stereo input
  - Vu meter for real-time monitoring
  - Internal and word clock synchronization options
  - 15v 2a power supply (included)
  - Half 1-u aluminum rack chassis
  - Removable rack ears for flexible installation
  - Audiofuse creative suite included
categories:
  - preamp
