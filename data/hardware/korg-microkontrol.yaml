description: >-
  The Korg microKONTROL is a compact USB MIDI keyboard controller combining 37 mini
  velocity-sensitive keys with 16 velocity-sensitive trigger pads for software-based music
  production. It provides physical access to functions normally found on keyboards,
  mixers, and effects units, with eight sliders, eight rotary encoders, and a combined
  modulation/pitch bend joystick. The unit ships with factory presets for popular DAWs
  including Cubase, Logic, and Reason, and works well with the Korg Legacy software
  package.
details: |-
  The microKONTROL addresses the space constraints common in desktop and laptop-based music production setups. It combines three octaves of mini velocity-sensitive keys with a comprehensive set of real-time controllers, making it a versatile hub for controlling software instruments and effects.

  The control surface features eight sliders with matching rotary encoders, each paired with small LCD displays for visual feedback. A combined modulation and pitch bend joystick replaces the traditional mod and pitch wheels, saving additional space. The 16 velocity-sensitive pads serve double duty as drum triggers, setup selectors, edit function keys, and transport controls for sequencer operations including Play, Stop, and Record.

  The microKONTROL stores up to 12 setup memories internally, and the included editing software allows users to define, load, and save custom configurations. The bundled CD-ROM provides 50 additional setups for third-party products from Waldorf, Steinberg, Arturia, and many more. Power can be drawn from USB, batteries, or an external 9V AC adapter, giving users flexibility for both studio and mobile use.
specs: |-
  - 37 mini velocity-sensitive keys
  - 16 velocity-sensitive trigger pads
  - 8 rotary encoders
  - 8 control sliders
  - 4-way joystick (modulation/pitch bend)
  - Value dial
  - Small LCD displays per encoder/slider pair
  - 12 internal setup memories
  - MIDI In/Out/Thru
  - USB connector
  - Power via USB, battery, or 9V AC adapter
  - Includes setup editor software
  - 50 factory presets for third-party software
