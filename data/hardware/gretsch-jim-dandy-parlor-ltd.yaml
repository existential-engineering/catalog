details: |-
  Inspired by the historic 'Rex' line of instruments offered by mail-order catalog in the 1930s, '40s and '50s, Jim Dandy models embody the charm and spirit of those early Gretsch flat-top guitars with superior playability and best-in-class-tone to boot.

  Featuring a petite and portable parlor body shape and a short 24" scale length, the Jim Dandy Parlor punches above its weight with a distinct tonal clarity and throaty midrange for which parlor guitars are so beloved.

  The X-braced body is crafted with select lightweight laminate tonewoods for an optimal balance of woody vintage tone and reliable durability, while the "C"-shape neck presents an inviting feel for hours of old-timey inspiration.
