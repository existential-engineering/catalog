  - ipRating: IP43
  - mixerChannels: 4-channel digital with studio-quality FX
  - phantomPower: 48 V
  - wireless: Bluetooth audio streaming + control; true wireless stereo pairing
  - appControl: QuickSmart Mobile (iOS / Android)
  - colors: Black, White
