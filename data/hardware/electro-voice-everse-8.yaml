name: EVERSE 8
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/everse-8/
description: The EVERSE 8 is a weatherized battery-powered loudspeaker with
  Bluetooth audio streaming and control. A 400 W Class-D amplifier drives an
  8-inch woofer and a 1-inch titanium dome compression driver, delivering 121 dB
  max SPL with 100 x 100 degree coverage. The integrated 86.4 Wh lithium-ion
  battery runs 12+ hours at moderate output and 6+ hours at maximum output. A
  4-channel digital mixer offers studio-quality effects, 48 V phantom power,
  feedback suppression, and audio ducking. Inputs include two XLR/TRS combo
  jacks, a 3.5 mm stereo aux, and Bluetooth (true wireless stereo when paired
  with a second unit). Additional features include a 12 V DC accessory output
  for wireless microphone systems, a USB charging port, weatherized IP43
  connector cover, and QuickSmart Mobile app control via iOS and Android.
  Available in black or white finish.
details: |-
  Battery-powered with 86.4 Wh Li-ion pack (12+ hours moderate, 6+ hours max)

  Weatherized IP43 design with protective connector cover

  Bluetooth audio streaming and true wireless stereo (TWS) pairing

  Bluetooth-controlled QuickSmart Mobile app (iOS / Android)

  400 W Class-D amplifier, 121 dB max SPL

  8-inch ferrite woofer + 1-inch titanium dome compression driver

  100 x 100 degree (H x V) coverage pattern

  4-channel digital mixer with studio-quality FX

  48 V phantom power, feedback suppression, audio ducking

  12 V DC accessory output (powers EV wireless mic receivers)

  USB charging port (1.5 A max, device-dependent)

  TRS footswitch input for remote control

  Polypropylene enclosure with powder-coated steel grille

  Ergonomic soft-touch handle, 16.8 lb (7.6 kg) net weight

  Available in black or white
specs: |-
