description: The 801 D4 Signature is an optimized version of our most advanced
  loudspeaker. It features meticulously evolved technology, carefully crafted
  design and unique finishes that culminate in the pinnacle of performance.
details: |-
  The 801 D4 Signature is the flagship of Bowers & Wilkins' 800 Series Diamond Signature range, an optimized version of the reference 801 D4 floor-standing loudspeaker. It is a 3-way vented-box system engineered around a Diamond Dome tweeter, Continuum cone FST midrange housed in a dedicated Turbine Head, and dual Aerofoil Profile bass drivers.

  Signature treatments include an upgraded cabinet with an optimized aluminum top section for increased stiffness, rear-mounted crossover designs on stiff aluminum spines, and Leather by Connolly detailing. The Midnight Blue Metallic finish is paired with full-grain blue leather and the California Burl Gloss finish is paired with full-grain black leather.

  Driver complement comprises a 25mm Diamond Dome high-frequency tweeter mounted in a Solid Body Tweeter-on-Top enclosure, a 150mm Continuum cone FST midrange, and two 250mm Aerofoil Profile bass drivers. The cabinet incorporates Matrix bracing, an Anti-Resonance plug, Biomimetic Suspension, and a Flowport-loaded bass alignment.

  Specified sensitivity is 90dB SPL (2.83Vrms at 1m) with a nominal 8Ω impedance (3.0Ω minimum) and a recommended amplifier power range of 50W to 1,000W into 8Ω. Frequency range extends from 13Hz to 35kHz (-6dB) with a quoted response of 15Hz to 28kHz ±3dB. Harmonic distortion is rated below 1% from 30Hz to 20kHz and below 0.3% from 100Hz to 20kHz at 90dB, 1m on-axis.

  Each cabinet stands 1,221mm (48.1in) tall, measures 451mm (17.8in) wide and 600mm (23.6in) deep, and weighs 100.60kg (221.8lb) net. The 801 D4 Signature is sold per pair.
specs: |-
  - System: 3-way vented-box
  - Tweeter: 1× 25mm (1in) Diamond Dome
  - Midrange: 1× 150mm (6in) Continuum cone FST
  - Bass: 2× 250mm (10in) Aerofoil Profile
  - Frequency range: 13Hz–35kHz (−6dB)
  - Frequency response: 15Hz–28kHz ±3dB
  - Sensitivity: 90dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: <1% (30Hz–20kHz); <0.3% (100Hz–20kHz) at 90dB, 1m on-axis
  - Nominal impedance: 8Ω (minimum 3.0Ω)
  - Recommended amplifier power: 50W–1,000W into 8Ω
  - Max recommended cable impedance: 0.1Ω
  - Height: 1,221mm (48.1in)
  - Width: 451mm (17.8in)
  - Depth: 600mm (23.6in)
  - Net weight: 100.60kg (221.8 lb)
  - Technical features: Diamond tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, Matrix, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Aerofoil Profile bass cones, Flowport
  - Finishes: California Burl Gloss, Midnight Blue Metallic
