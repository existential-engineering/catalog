description: The 801 D4 Signature is an optimized version of the most advanced
  Bowers & Wilkins loudspeaker. It features meticulously evolved technology, carefully crafted
  design and unique finishes that culminate in the pinnacle of performance. This
  is Bowers & Wilkins 800 Series Signature flagship loudspeaker.
details: |-
  The 801 D4 Signature is the flagship of the Bowers & Wilkins 800 Series Signature range, an optimized version of the 801 D4 reference tower loudspeaker. It is a passive three-way vented-box design driven from an external amplifier, with a recommended amplifier power of 50W to 1,000W into 8 ohms and no mains connection of its own.

  Bowers & Wilkins describes the Diamond Dome tweeter as one of its most significant accomplishments of the past two decades, combining low mass, exceptional stiffness and accuracy. The Solid Body Tweeter-on-Top housing has an elongated form with a longer tube-loading system and a new design of tweeter grille, which the company says produces an even more free and open sound at high frequencies.

  The Signature treatment centres on an upgraded rear-mounted crossover mounted on stiff aluminium spines. The company says this isolates the sensitive capacitors from the unwanted effects of air pressure inside the enclosure and acts as an effective heatsink, so the crossover performs optimally in use.

  Every 800 Series Signature model also carries a significantly upgraded cabinet with an all-new optimized aluminium top section for greater stiffness, which doubles as the mounting point for Leather by Connolly detailing: full-grain blue leather on Midnight Blue Metallic cabinets and full-grain black leather on California Burl Gloss.

  Drive units are a 25mm Diamond Dome high-frequency unit, a 150mm Continuum cone FST midrange in the Turbine Head, and two 250mm Aerofoil Profile bass cones, supported by an Anti-Resonance plug, Biomimetic Suspension, Matrix bracing and Flowport. Each cabinet stands 1221mm tall, is 451mm wide and 600mm deep, and weighs 100.60kg.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, Matrix, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Aerofoil Profile bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond Dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 250mm (10in) Aerofoil Profile bass
  - Frequency range: -6dB 13Hz to 35kHz
  - Frequency response: 15Hz to 28kHz (+/-3dB)
  - Sensitivity: 90dB spl (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 30Hz to 20kHz, less than 0.3% 100Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1,000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Speaker terminals: two pairs per cabinet for bi-wiring, accepting 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm (5/32in)
  - Dimensions: Height 1221mm (48.1in), Width 451mm (17.8in), Depth 600mm (23.6in)
  - Net weight: 100.60kg (221.8lb)
  - Cabinet finishes: California Burl Gloss, Midnight Blue Metallic
  - Grille finishes: Black
