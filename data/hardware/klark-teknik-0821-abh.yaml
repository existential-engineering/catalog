details: |-
  The DN60 is a real-time audio analyser from the heritage DN-series, engineered to give system engineers an immediate and accurate visual representation of a sound system's frequency response.

  RTA-class measurement was a non-negotiable part of the live and installed sound engineer's workflow, and the DN60 was the Klark Teknik reference for that discipline.

  Used alongside DN-series graphic equalisers in countless touring racks and broadcast control rooms, the DN60 provided the visual feedback that informed equalisation decisions during system tuning.

  Although now obsolete, its role has been carried forward by software-based measurement platforms and the unit remains a historical reference. Service documentation continues through Music Tribe Care.
specs: |-
  - Real-time audio analyser (RTA) for sound system frequency response measurement
  - Designed for use alongside DN-series graphic equalisers during system tuning
  - Rackmount DN-series chassis
