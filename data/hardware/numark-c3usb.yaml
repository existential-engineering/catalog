name: C3USB
manufacturer: numark
primaryCategory: mixer
categories:
  - discontinued
url: https://www.numark.com/product/c3usb
description: 5-channel mobile DJ rack mixer with USB I/O, enabling DJs to mix
  vinyl, CD, MP3, and laptop sources via plug-and-play USB connectivity.
details: |-
  The Numark C3USB is a five-channel rack-mount DJ mixer designed for mobile DJs working across multiple media types. It enables mixing of vinyl, CD, MP3, and hard disk content while incorporating USB connectivity for laptop integration. The mixer supports plug-and-play USB operation without requiring driver installation on most systems.

  The C3USB features two assignable USB ports capable of acting as either input or output, a three-band EQ on each channel plus a dedicated EQ for the microphone channel, and a replaceable, assignable crossfader. It is compatible with Mac OS X, iOS, and Windows (98SE and later), and works with most audio recording software.
