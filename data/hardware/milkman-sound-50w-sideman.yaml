details: |-
  The ultimate working amp

  ABOUT

  I designed the Sideman amplifier about 4 years ago as the only two channel Milkman amplifier. It served as a go between for guitar and pedal steel players. However, I decided to introduce a brand new single channel version that I consider to be the "full featured" version of the 40W Pedal Steel Mini. Many guitar players were asking if the Mini could have this feature or that - why not just throw the kitchen sink into the Sideman? Well, thats exactly what I did! The preamp circuit and overall voicing is the same as the 40W Mini, however the Sideman has larger transformers and runs at slightly higher voltages inside. That, coupled with its larger speaker baffle gives the Sideman an impressive amount of power for how small and light it is. Similar to the Mini, you can run a 5AR4 rectifier or a solid state plug in rectifier in place. The Sideman has gotten a total makeover from its original form: it has shrunk down into a 1x12" combo that weighs about 41lbs, features a 3 band EQ with bright switch, and has a 2 knob reverb system with dwell and blend controls. Dwell allows you to lightly drive the tank when running the preamp hot. Another addition to the Sideman is rich, deep, bias modulating tremolo. The amplifier comes with the custom Milkman two button foot switch, and a removable IEC type power cord. The Sideman is hand wired onto a turret board with Mercury Magnetics transformers and Jupiter capacitors. The combination of a pine cabinet and efficient speakers keeps the weight down to about 41lbs while putting out a considerable amount of volume, and fantastic guitar tone. For customers who are interested, I will still build a custom two channel Sideman as a dual channel Steel/Guitar amplifier. Please contact me through the contact page. WATTAGE

  50W Class AB

  SPEAKER

  1x12" Jupiter Ceramic or Alnico, 8 ohm

  1x12" Celestion Alnico Cream, 8ohm

  15" Telonics Neo Speaker, 4 ohm

  EFFECTS

  Tube driven spring reverb with dual knob control

  Bias modulating tube tremolo

  DIMENSIONS & WEIGHT

  Head 23-7/8" W x 10" H x 9" D 30lbs

  12" Combo 23-7/8" W x 19-3/4" H x 9-1/2" D 41lbs

  15" Combo 23-7/8" W x 19-3/4" H x 9-1/2" D 40lbs

  Demo

  50W Sideman 1x12 Demo

  James Deprato demos the new Sideman

  SOUNDS

  Listen

  Reviews

  John Neff

  Winterville, GA

  www.allmusic.com

  Really digging the amp. The bright switch is a great feature, at least it is with this D130. It's like a huge vibro-champ which is a great thing! Sam Wilson

  Charlottesville, VA

  www.sonsofbill.com

  Loving my steel through the milkman! Since my shobud has a woody sound, I have the bright switch on and it sounds just right. Gets a little more twang. Incredible tone! Reverb is gorgeous. And such low noise!
