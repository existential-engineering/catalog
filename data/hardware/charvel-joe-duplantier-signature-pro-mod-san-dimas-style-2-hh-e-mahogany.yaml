description: Charvel's signature model honoring Gojira frontman Joe Duplantier
  brings together all of his preferred style and specs, including an all-new
  pickup pairing designed for both crushing heavy riffs and delicate clean
  soundscapes.
details: |-
  The Joe Duplantier Signature Pro-Mod San Dimas Style 2 HH E Mahogany pairs a mahogany San Dimas Style 2 body in a Natural satin finish with a specially contoured heel for improved upper-fret access. The bolt-on mahogany neck includes graphite reinforcement, an oiled finish, and a Speed Neck profile with rolled fingerboard edges. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with pearloid big block inlays, anchored by a black plastic nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Joe Duplantier Signature DiMarzio Fortitude humbucker in the bridge and a DiMarzio PAF 36th Anniversary humbucker in the neck, both wearing worn-nickel covers. A 3-position toggle switch (bridge / both / neck) is routed through a single, specially-positioned knurled flat-top volume knob.

  Hardware includes a Charvel fully adjustable radius-compensated bridge with anchored tailpiece, Charvel-branded die-cast locking tuning machines, dual-wing string trees, a black switch tip, and standard strap buttons in a chrome hardware finish. The licensed Fender Telecaster headstock and heel-mount truss rod adjustment wheel round out the build.
