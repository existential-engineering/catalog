description: >-
  The Ensoniq KT-88 is a MIDI synthesizer workstation released in 1994 that combines
  synthesizer capabilities with the feel and sound of an acoustic piano. It features
  64-voice polyphony and comes equipped with two sampled pianos, organs, vintage synths,
  and electric pianos in ROM, with a weighted 88-key action keyboard providing dynamic
  response comparable to a real piano.
details: |-
  The KT-88 was designed as a comprehensive instrument suitable for both stand-alone use and as a MIDI controller for other gear. Its sound engine draws from a 211 PCM wavetable that is multi-sampled at 16 bits, with each of the 64 voices capable of utilizing up to 3 PCM samples. This architecture allows for rich, realistic instrument emulations and complex layering possibilities.

  Performance features are comprehensive, including 30 tuning scales, two mono modes with glide and legato capabilities, and 13 algorithm effects covering reverb, phaser, chorus, and additional processing. The instrument includes a 16-track internal sequencer for composition and arrangement, though sequencer memory expansion via PCMCIA RAM cards may be difficult to source today.

  The keyboard is a standout feature, offering weighted action that simulates acoustic piano response. Players can customize their feel through 14 velocity curves and four pressure settings. The control interface includes pitch and mod wheels, plus support for optional control voltage pedals or dual foot switches for enhanced expression.

  The rear panel provides full MIDI connectivity with In, Out, and Thru ports, along with stereo output jacks. The instrument operates in multiple modes including Edit Sound, Edit Track, General MIDI, and Sequence/Preset modes, with a 32-character LCD display for navigation and parameter display. The synth employs Ensoniq's Transwave technology for enhanced sound design.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 3
  - Waveforms: ROM, Wavetable
  - VCF: 24dB slope, high pass, low pass, resonance
  - LFO: 4 LFOs with noise, saw up/down, sine, square, triangle, sample & hold
  - Control: MIDI In/Out/Thru
  - Sequencer: 16-track
  - Effects: 13 algorithm effects
  - Keyboard: 88 keys with velocity and aftertouch
  - Memory: 100 RAM + 80 ROM sounds
