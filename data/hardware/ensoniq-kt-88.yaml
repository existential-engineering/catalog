description: >-
  The Ensoniq KT-88 is a 64-voice workstation with an 88-key weighted action keyboard, designed
  to deliver realistic piano feel alongside a full complement of sampled instruments and Transwave
  synthesis capabilities. It includes a 16-track sequencer and 13-algorithm effects processor.
details: |-
  Released in 1994, the KT-88 combined weighted hammer-action keys with a broad ROM sound set
  covering sampled pianos, organs, vintage synths, and electric pianos. The weighted keyboard was
  specifically designed to match the feel of an acoustic piano, making it suitable for players who
  needed authentic piano response alongside synthesizer functionality.

  The sound engine provided 64 voices of polyphony across 16 multitimbral parts, with three
  oscillators per voice drawing from 211 PCM multi-sampled waveforms at 16-bit resolution. Ensoniq's
  Transwave technology added wavetable-style timbral animation to the otherwise sample-based
  architecture.

  Sound shaping included a 24 dB slope filter with highpass, lowpass, and resonance modes, plus
  four LFOs per voice with multiple waveform options including sample-and-hold. The 13-algorithm
  effects section covered reverb, phaser, and chorus, while 30 built-in tuning scales and two mono
  modes with glide and legato expanded its versatility.

  The integrated 16-track sequencer made the KT-88 a self-contained production tool, though
  the instrument's substantial weight was a notable consideration for gigging musicians.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 3 per voice, 211 PCM multi-sampled waveforms at 16-bit
  - Waveforms: ROM, wavetable (Transwave)
  - Filter: 24 dB slope with highpass, lowpass, resonance
  - LFO: 4 per voice (noise, saw, sine, square, triangle, sample & hold)
  - Effects: 13 algorithms (reverb, phaser, chorus)
  - Keyboard: 88 weighted keys with velocity and aftertouch
  - Memory: 100 RAM + 80 ROM sound patches
  - Sequencer: 16 tracks
  - Control: MIDI In/Out/Thru
