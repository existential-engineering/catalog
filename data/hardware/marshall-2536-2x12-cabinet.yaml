description: An iconic 2x12" straight speaker cabinet from Marshall's Studio
  Jubilee range, designed to pair with the 2525H Mini Jubilee head and 2525C
  combo. Loaded with two 12" Celestion G12 vintage speakers in a straight
  (front-firing) baffle, the cabinet handles 140W in mono operation (70W per
  side stereo) and can be wired for 8Ω mono or 16Ω stereo via its two 1/4-inch
  inputs — voiced to deliver the classic Silver Jubilee tone of the original
  2555 from 1987 in a more compact, home- and studio-friendly format than a full
  4x12.
