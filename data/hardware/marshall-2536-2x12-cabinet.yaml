description: An iconic 2x12" straight speaker cabinet from Marshall's Studio Jubilee range, designed to pair with the 2525H Mini Jubilee head and 2525C combo. Loaded with two 12" Celestion G12 vintage speakers in a straight (front-firing) baffle, the cabinet handles 140W in mono operation (70W per side stereo) and can be wired for 8Ω mono or 16Ω stereo via its two 1/4-inch inputs — voiced to deliver the classic Silver Jubilee tone of the original 2555 from 1987 in a more compact, home- and studio-friendly format than a full 4x12.
details: |-
  The space-conscious design of these little 140W cabinets preserves the iconic Marshall look and sound. The much-loved high-end response is produced by the two Celestion G12 vintage speakers.

  The 2536 2x12 Cabinet can be used in mono or stereo mode and matches with either the 2555X or Studio Jubilee Head.

  Inspired by the Silver Jubilee, it delivers an aggressive Marshall sound with dynamic lows and creamy highs.

  Built in our UK factory. Designed and engineered in UK. Made in UK.
