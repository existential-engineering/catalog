name: LT-MADI
manufacturer: lynx-studio-technology
primaryCategory: audio-interface
categories:
  - digital
  - discontinued
url: https://www.lynxstudio.com/products/lynx-lt-madi/
description: The LT-MADI is an LSlot interface for the Aurora 8 and Aurora 16
  A/D D/A converters that provides digital input and output in MADI
  (Multichannel Audio Digital Interface) format. Up to four Aurora converters,
  using four LT-MADI cards, can be combined for up to 64 channels of input and
  output.
details: |-
  MADI is a proven technology for distributing multichannel audio in large venues, live recording and multiroom studios with the convenience of either optical fiber or coaxial cabling.
specs: |-
  - LSlot interface card for the Lynx Aurora 8 and Aurora 16 A/D D/A converters
  - Two MADI optical ports and two MADI coaxial ports
  - Supports 64 channels at 44.1 / 48 kHz, 32 channels at 88.2 / 96 kHz and 16 channels at 176.4 / 192 kHz, all bidirectional
  - Up to four Aurora converters, using four LT-MADI cards, can be combined for up to 64 channels of input and output
  - Coaxial I/O supported for up to 100 meter distance
  - Optical I/O supported for up to 2000 meter distance
  - Allows daisy-chaining of up to four Aurora converters and other MADI devices on a single MADI link
  - Lynx proprietary SynchroLock technology virtually eliminates jitter when Aurora is a clock slave or used to provide stable, low jitter clock to downstream devices
  - Draws power from the host Aurora chassis through the LSlot bay; the page documents no power connector of its own
  - Discontinued (the page states no month or year)
