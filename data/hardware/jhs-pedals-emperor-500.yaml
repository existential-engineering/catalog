description: A 500-series rack module offering true analog bucket brigade chorus
  and pitch vibrato with tap tempo, expression control, and three waveform
  options, built on the 1980s Arion SCH-1 topology using a 3207 BBD chip.
details: |-
  The Emperor 500 is a 500-series lunchbox module and JHS Pedals' first entry into the 500-series world. Starting with the 1980s Arion SCH-1 chorus topology, the Emperor 500 expands on that circuit using a 3207 bucket brigade chip to deliver pure analog modulation. It covers everything from sea-sick vibrato to classic chorus and Leslie organ tones and is suitable for keys, drums, guitar, bass, vocals, and more. Five knob controls: Volume (input cut/boost), Mix (wet/dry blend), Tone (improved SCH-1 tone stack with better sweep and range), Speed (LFO rate), and Depth (modulation depth). The Tap Tempo switch sets Speed by pressing in rhythm. An EXP/TAP toggle switches the TAP/EXP jack between expression pedal input (for LFO speed ramping) and tap tempo footswitch. Four toggle switches: Engage/Bypass (on/off), Chorus/Vibrato (mode select), Waveform (Sine/Square/Triangle), and EXP/TAP (jack function). Six total modulation modes: three waveforms x two effect types (chorus and vibrato).
