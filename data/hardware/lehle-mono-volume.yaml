description: The Lehle Mono Volume is a volume pedal equipped with a precise
  magnetic sensor enabling it to operate almost wear-free. A Blackmer VCA
  replaces the mechanical potentiometer, so the pedal transmits the full sound
  spectrum of the connected instrument over the entire control range.
details: |-
  The Lehle Mono Volume is a volume pedal equipped with a precise magnetic sensor enabling it to operate almost wear-free. The sensor uses the Hall effect, named after Edwin Hall, to measure the strength of magnetic fields. The German-made Hall sensor is accurately calibrated to the built-in magnet and to the control range of the pedal, so the pedal moves only the magnet while the sensor measures the distance and controls a VCA.

  A premium Blackmer VCA (Voltage Controlled Amplifier) from the THAT Corporation replaces the mechanical potentiometer. The principle of the voltage-controlled amplifier is that gain is varied by the control voltage coming from the Hall sensor, which operates more precisely than the conventional mechanical potentiometers or optical sensors used by standard volume pedals. Potentiometer-typical noise and complicated adjustment are eliminated.

  Over the entire control range the Mono Volume transmits the full sound spectrum of the connected instrument. Input and output impedance always stay the same, ensuring that there is no damping of higher frequencies as with potentiometers. Internally, the input voltage coming from the power supply socket is rectified, then filtered, stabilized and doubled to 18 V, achieving a total dynamic range of 110 dB.

  The volume control ranges from -92 dB to 0 dB, from a virtually muted level to the same volume as the input. A potentiometer adds up to +10 dB of boost on top of that.

  The pedal runs mechanically smooth and steady, as it is equipped with low-friction bearings of a high-performance polymer and there is no mechanical transmission from the pedal to other components. An adjusting screw modifies the mobility of the pedal very precisely. A buffered direct out can supply a tuner, a DAW or a second amp without affecting the sound.
specs: |-
  - Weight: 1480 g
  - Length: 260 mm / 10.2"
  - Width: 100 mm / 3.9"
  - Overall height: 66 mm / 2.6"
  - Supply voltage: 9 to 15 V DC
  - Current consumption: 50 mA
  - Total harmonic distortion: < 0.05 % (-10 dBu, 1 kHz)
  - Impedance input: 2 MOhm
  - Impedance output: 500 Ohm
  - Max. level: 3 V RMS / 11.8 dBu (at 12 V input voltage)
  - Level noise floor: -102 dBu (A-weighted)
  - Volume control range: -92 dB to 0 dB, with up to +10 dB additional gain
  - Total dynamic range: 110 dB, input voltage internally doubled to 18 V
  - Magnetic Hall sensor with Blackmer VCA, no potentiometer
  - Buffered direct out for a tuner, DAW or second amp
