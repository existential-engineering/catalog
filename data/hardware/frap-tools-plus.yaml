details: |-
  The PLUS is the first modular-modular case for Eurorack synthesizers. It is built of practical 42-HP units that can be assembled together in almost infinite configurations.

  A modular synthesizer is a liquid instrument: it does not have a fixed shape, it is molded by the musician's needs and by the case it is mounted in, and it can change over time. One of the struggles of modular synthesists is that their case may become too small or too large for the instrument they have in mind. PLUS was designed to solve this problem, growing or shrinking according to the shape of the modular synthesizer it hosts.

  Problem-solving was not the only reason behind PLUS. It is also designed to be solid and elegant, through extruded aluminum pieces joined together with no visible screws. All the screws and joints sit inside the case, leaving the exterior a neat material surface. The Row Extension units are single-body extruded-aluminum profiles that host modules up to 43 mm deep, and the sides can be made of premium wood or extruded aluminum.

  Four parts can compose a PLUS case: two kinds of units, which are the main body of the case, and the sides that close it. A PLUS case can only be used once it is closed by its sides, because using an open case may damage the modules and voids the warranty.
specs: |-
  - Modular case system for Eurorack, built from 42-HP units
  - Row Extension units are single-body extruded-aluminum profiles
  - Hosts modules up to 43 mm deep
  - Sides available in premium wood or extruded aluminum
  - Screws and joints are internal, so no fixings are visible on the exterior
  - Composed of four part kinds: a solid Single Unit, windowed Row Extension units, and the Thin Sides that close the case
  - Windowed Row Extension units carry a side window that lets a power distribution pass between rows
  - Must be closed by its sides before use
