details: |-
  Introducing PDX520, the latest addition to the PDX family, AUDIX's line of premium dynamic microphones for broadcast, podcasting and studio work.

  PDX520 has been carefully designed to provide a true-to-life, full and accurate spoken voice capture. It portrays a natural, pleasingly warm sound that lends itself to long-format content where intelligibility and auditory comfort are paramount.

  PDX520 features a Cardioid polar pattern to ensure isolation even in sub-optimal acoustic environments, and its default gain level eliminates the need for preamp boosts or cloud lifters.
  The microphone also features two, 2-position switches that enable users to quickly modify sound by adjusting the low cut and presence boost, minimizing the post-production work.

  The unique design is directly influenced by PDX720, featuring an internal vibration dampening system for the capsule, all housed in a solid metal body with integrated attachment arm for both mic stand and XLR connector.

  Designed and Crafted in the USA.
specs: |-
  - Polar pattern: Cardioid
  - Type: Dynamic
  - Low-cut switch: 2-position
  - Presence boost switch: 2-position
