description: For those wishing to configure their own rack-mounting bass rigs,
  the ABM-RPM-JE preamp puts all the ABM facilities in a convenient
  rack-mounting package. Three rotary tone controls give 20dB of cut and boost
  at 60Hz, 660Hz and 5kHz, supplemented by two pairs of sliders (15dB at 180Hz,
  340Hz, 1.3kHz and 2.6kHz), with the EQ switchable in/out and flat/shaped by
  footswitch. A single input is switchable for passive and active instruments
  and blends solid-state and dual-triode tube preamp stages, footswitchable for
  clean, warm and overdriven tones. A footswitchable sub-harmonic generator
  tracks the signal an octave lower, and a variable crossover (35Hz to 160Hz)
  enables bi-amped systems. Connections include a balanced DI out with pre/post
  EQ switching, a sub-bass output, a tuner output, an FX loop and a line input.
details: |-
  For those wishing to configure their own rack-mounting bass rigs, the Ashdown RPM-1-JE preamp puts all the ABM facilities in a convenient rack-mounting package. Three straightforward rotary tone controls provide 20dB of cut and boost at 60Hz, 660Hz and 5kHz, and are supplemented by two pairs of additional sliders giving 15dB cut and boost at 180Hz, 340Hz, 1.3kHz and 2.6kHz. The EQ can be switched in/out, and flat/shaped by footswitch, enabling players to go from a flat fretless sound to a boosted sound via a favourite EQ setting. A single input is switchable for passive and active instruments with a blend of solid state and dual triode tube preamps stages which can be preset and selected by footswitch, providing access to a massive range of clean, warm and overdriven tones. Also footswitchable is the mighty Ashdown sub-harmonic generator which precisely tracks the main signal and reproduces it an octave lower. The ABM RPM-JE preamp features a balanced DI out with pre or post EQ switching, a sub-bass output, a tuner output, an FX loop and a line input for the connection of an external sampler or sound source. Output muting cuts the signal from the DI output but leaves the tuner output 'live', allowing the player to tune up in silence. The addition of a high-precision crossover with variable frequency from 35Hz to 160Hz and a level control for the low-pass output, enables the configuration of sophisticated bi-amped systems.
specs: |-
  - Rack-mounting bass preamplifier (1U)
  - Power requirement 115/230V
  - Frequency response -3dB at 17Hz and 30kHz
  - High instrument input impedance 3.9M Ohms, input range 150mV - 20mV p-p
  - Low instrument input impedance 10k Ohms, input range 300mV to 40V p-p
  - Line input impedance 22k Ohms, input level 0dBu nominal
  - Sub output impedance 1k Ohms, level 0dBu nominal
  - DI output 600 Ohms balanced, level 0dBu nominal
  - Tuner output impedance 22k Ohms, level 0dBu nominal
  - EQ: Bass +/-15dB @ 45Hz, Middle +/-15dB @ 660Hz, Treble +/-15dB @ 7kHz
  - Effects send/return impedance 22k Ohms, level 0dBu nominal
  - Variable crossover 35Hz to 160Hz
  - Dimensions (H x W x D) 90 x 483 x 267 mm
  - Weight 6 kg
