description: "We give you the two most quintessential effects that yield unruly
  amounts of power and influence to an instrumentalist: reverb and distortion.
  They have been harnessed and woven together for an eternity of ethereal power
  with The Melee: Wall of Noise."
details: "We give you the two most quintessential effects that yield unruly
  amounts of power and influence to an instrumentalist: reverb and distortion.
  They have been harnessed and woven together for an eternity of ethereal power
  with The Melee: Wall of Noise. The Melee unapologetically uses a joystick to
  meld reverb and distortion into one massive blaze of sound. With the flip of
  the order switch, run the distortion into the reverb or reverb into
  distortion; signal chain is your call now. For the explorer, the Melee can run
  one of three different reverb programs Ambient, Octave, and Reverse. In a less
  is more approach, we’ve intentionally decided on controls that are fun to use
  and will inspire a wealth of creative output. Use the joystick to control the
  amount of distortion by moving it up and down. Moving the joystick left and
  right will adjust your reverb mix. The tone and decay toggles have low,
  medium, and high settings. Modulation can be added to the wet signal by
  holding down the bypass switch and moving the decay toggle. The left position
  is no modulation, the middle is a slight modulation, and the right is a high
  modulation. ALGORITHMS The Melee is equipped with three different reverb
  programs, which can be changed by simultaneously pressing the bypass and
  sustain stomp switches. Experiment with the order toggle switch to hear how
  differently these all react in front and after the distortion! • Ambient
  Reverb (Pink LED) - Huge reverb capable of massive trails and engulfing your
  chords into an angry wash of sound. Great for soaring melodic lines or
  shoegaze-driven chord progressions. • Octave Down Reverb (Yellow LED) -
  Similar to the Dark mode in the Slö , you’ll find an eerie lower octave
  hovering in the reverb trail for a nice and dark atmospheric touch. • Reverse
  Reverb with Feedback (Blue LED) - Add reversed reverb trails back into your
  signal, create gentle melodies or push into reverse feedback overload. Big,
  slow, and sad chords love to hang out here. MOMENTARY Press and hold the
  sustain switch to ramp up the reverb trails. Release and the trails will ramp
  back down to where the decay switch is currently set. The sustain switch can
  also latch in all three programs. Press and release the Sustain switch to
  capture and sustain the current reverb decay for long pad-like sounds in your
  wet mix. Press again to release the latch, and the reverb trail will taper off
  based on the position of the decay knob."
