description: Twin-channel guitar preamp faithfully recreating the sound of a 1965 Blackface Reverb Deluxe tube amp in a pedal, with independent channel controls, built-in spring reverb, optional cab simulation, and dedicated outputs for direct recording and live use.
details: |-
  As Classic As It Gets

  This original tube amp with legendary reverb ranks among the world’s most sought-after vintage combos and is likely one of the most recorded amps in music history – for good reason. It sounds amazing! But it’s rare, and if you find one it likely comes with a price tag to match. However, there are other ways for you to get your hands – and feet – on this iconic guitar tone: Enter COMBO DELUXE 65’!

  As Precise As It Gets

  Our passionate and guitar-playing team of engineers set out to faithfully recreate the original amp with the painstaking accuracy and attention to detail that only guitar players with actual hands-on experience with the original amp can achieve. At the heart of COMBO DELUXE 65’, our AMPWORX modeling technology works its magic, carefully recreating the classic guitar tone that’s the sum of each and every component from the circuit of the original. The result? The best and most precise digital amp modeling of this famous amp you have ever run your guitar through.

  Reverb Revelation
