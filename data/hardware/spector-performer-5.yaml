details: |-
  Spector's Performer Series offers classic Spector style at price that is well within the reach of beginning bassists. Inspired by the legendary NS body design, these basses have been crafted with precision and care and feature the tone and playability that has made the Spector one of the most respected names in bass guitars. The Spector Performer 5 is an versatile bass designed specifically for the beginning bassist. The instantly recognizable Spector NS body outline is a joy to play, resulting in a uniquely comfortable and natural playing experience. A three-piece rock maple neck and amara fingerboard make for exceptional playability. The Performer 5 also features a 35" scale length and custom pickups for enhanced playability and clarity.
