description: The most powerful and advanced equalizer pedal on the planet. The
  EQ2 is a stereo graphic and parametric equalizer with full MIDI control, 128
  presets, and a tuner.
details: |-
  The EQ2 is a stereo graphic and parametric equalizer pedal with full MIDI control, 128 presets, and a built-in chromatic tuner.

  It features a 10-band graphic equalizer with adjustable frequencies from 31Hz to 16kHz offering plus/minus 18dB of boost and cut. Each band operates as a fully parametric control, allowing repositioning across the full 20Hz to 20kHz spectrum with adjustable Q-factor bandwidth per band.

  The pedal includes independent channel gain controls (plus/minus 12dB), stereo input and output capability, an optional noise gate and limiter, and 128 preset memory.

  EQ2 integrates with Neuro 3 software and mobile apps for enhanced customization, and supports MIDI control via PC messages and CC message mapping.
specs: |-
  - 10-band graphic EQ, 31Hz to 16kHz, +/-18dB boost/cut
  - Fully parametric bands positionable across 20Hz to 20kHz
  - Adjustable Q-factor bandwidth per band
  - Independent channel gain controls (+/-12dB)
  - Built-in chromatic tuner
  - Optional noise gate and limiter
  - Stereo input/output
  - 128 preset memory
  - Full MIDI control (PC messages, CC mapping)
  - Neuro 3 software integration
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 180 mA
