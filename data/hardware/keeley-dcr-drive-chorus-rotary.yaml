description: "- Two Effects – One Pedal – Any Gig - Crunch or Lead DRIVE Channel
  - Chorus or Rotary MODULATION Channel - TRS Effects Loop – True Bypass"
details: |-
  The DCR puts a drive channel and a modulation channel in one compact pedal, built around the pairing of overdrive with chorus, flanger or rotary speaker voices. It is aimed at rhythm and chord work, with a saturated and compressed tube-style gain.

  The drive section offers two profiles. One is full range and highly saturated, the other combines a slight shelf filter with a low-pass filter to warm or thicken the guitar. A Style switch chooses between tube-amp crunch and lead-channel sustain, with Volume, Drive and Tone controls. The input and output jacks double as TRS inserts, so another effect can be placed between the drive and the modulation section.

  The drive feeds one of two modulation types: a chorus and flanger voice, or a rotary speaker swirl. Chorus mode gives a thick doubling chorus and flange mode a slicker sweep, while the rotary side selects between Vibra and Les voicings for a vintage organ style cabinet tone. The pedal is designed and manufactured in Oklahoma.
specs: |-
  - DRIVE Channel – High Saturation Stacked Drive. Volume, Drive and Tone.
  - STYLE Switch – Tube-amp Crunch or Lead-channel Sustain
  - WET Channel – Chorus OR Rotary with Chorus/Flange and Vibra/Les Rotary swirl.
  - Top-mounted jacks
  - TRS Insert Switch – side mounted selector
  - True-Bypass
  - 9VDC, 100 mA, no battery option
  - Designed and Manufactured in sub-tropical Oklahoma
