description: >-
  The Korg Lambda ES50 is a fully polyphonic 48-key preset synthesizer from 1979 that uses
  divide-down oscillator technology to deliver nine layerable voices across two sections,
  Percussive and Ensemble, with independent analog chorus effects.
details: |-
  Released in 1979, the Korg Lambda ES50 took a different approach from the programmable
  synthesizers of its era by focusing on high-quality preset sounds with full polyphony. Using
  three top-octave generators and divide-down circuitry, every key on the 48-note keyboard
  articulates independently with no voice stealing, a significant advantage at the time.

  The sound architecture is split into two sections. The Percussive section offers Electric Piano,
  Clavi, Piano, and Harmonics presets, while the Ensemble section provides Brass, Organ, Choir,
  Strings I, and Strings II. All nine sounds can be layered simultaneously, and each section has
  its own independent analog chorus circuit. The Brass preset is particularly notable for its
  paraphonic filter with preset envelope retriggering.

  Front panel controls allow tone shaping for each section, along with variable tremolo and sustain
  for Percussive sounds and switchable vibrato for Ensemble sounds. A joystick provides pitch bend
  and chorus modulation control. An octave switch enables standard or octave-down keyboard modes,
  and the oscillators support detuning for thicker tones. The Lambda was produced until 1982.
specs: |-
  - Polyphony: 48 notes (fully polyphonic)
  - Oscillators: 3 top-octave generators with divide-down circuitry
  - Waveforms: Pulse waves
  - Presets: 9 (Electric Piano, Clavi, Piano, Harmonics, Brass, Organ, Choir, Strings I, Strings II)
  - Filter: Fixed filter banks per preset; VCF for Brass section
  - Envelopes: 2 simple envelopes per key, 1 preset filter envelope (Brass)
  - LFO: Tremolo, vibrato, pitch bend via joystick
  - Effects: Dual independent analog chorus (one per section)
  - Keyboard: 48 keys, no velocity or aftertouch
  - Outputs: Keyboard trigger out, sustain/expression pedal inputs
  - Production period: 1979-1982
