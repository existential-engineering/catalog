name: Model 10
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/amplifiers/model-10/300991.html
description: Reference integrated amplifier featuring a newly designed dual-mono
  symmetrical amplifier topology with 250W per channel into 8 ohms (500W into 4
  ohms) and an all-new Marantz Switch-Mode Power Supply. The most powerful,
  highest performing Marantz amplifier ever, crafted in Shirakawa, Japan with a
  triple-layer aluminum chassis, copper shielding, and brushed aluminum front.
  Sound Master Tuned for warmth, spaciousness, and resolution.
details: |-
  Reference integrated amplifier inspired by our past and engineered for our future, featuring an iconic design with brushed aluminum front and copper-plated chassis.

  Newly designed dual-mono symmetrical amplifier topology delivers 250 watts per channel into 8 ohms (500W into 4 ohms), making it the most powerful, highest performing Marantz amplifier ever.

  All-new Marantz Switch-Mode Power Supply (SMPS) provides clean, stable power for reference-class performance.

  Triple-layer aluminum chassis with copper shielding minimizes electromagnetic interference and resonance for the lowest possible noise floor.

  Sound Master Tuned for warmth, spaciousness, and resolution, preserving the signature Marantz musicality.

  Three selectable MC phono input impedances (33, 100, 390 ohms) plus MM support accommodate a wide range of cartridges.

  Solid aluminum volume knob and input selector with bearing construction, anodized machined aluminum front panel, and HD TFT color display with 20-step dimmer.

  Crafted in the Shirakawa facility in Japan; ships with the 10 Series Universal Remote (RC004PMND).
specs: |-
  - Channels: 2
  - Rated Output: 250W + 250W (8 ohm, 20Hz-20kHz, THD 0.05%)
  - Rated Output: 500W + 500W (4 ohm)
  - Frequency Response: 5 Hz - 60 kHz (+0/-3 dB)
  - Total Harmonic Distortion: 0.005% (125W, 8 ohm, 20Hz-20kHz)
  - Damping Factor: 500 (8 ohm, 20Hz-20kHz)
  - Signal-to-Noise Ratio (CD/Balanced): 122 dB
  - Signal-to-Noise Ratio (Phono MM): 88 dB
  - Signal-to-Noise Ratio (Phono MC): 76 dB
  - Phono MM Input Sensitivity: 3.6 mV / 36 kOhm
  - Phono MC Input Sensitivity: 400 uV at 33, 100, or 390 ohm
  - Phono Max Input: MM 80 mV; MC 8 mV
  - RIAA Deviation: +/-0.5 dB (20Hz-20kHz)
  - Line/CD Input Sensitivity (Unbalanced): 350 mV / 41 kOhm
  - Line/CD Input Sensitivity (Balanced): 700 mV / 36 kOhm
  - Power Amp Direct In (Unbalanced): 1.58V / 41 kOhm (29 dB gain)
  - Power Amp Direct In (Balanced): 3.16V / 15 kOhm (24 dB gain)
  - Bass Control: +/-10 dB at 50 Hz
  - Treble Control: +/-10 dB at 15 kHz
  - Speaker Impedance: 4-16 ohm
  - Speaker Terminals: Marantz SPKT-100+ (2 sets, bi-wiring)
  - Power Supply: All-new Marantz Switch-Mode Power Supply (SMPS)
  - Display: HD TFT color display with 20-step dimmer and level meter
  - Remote Bus: RC-5 in/out (Floating Control Bus System, F.C.B.S.)
  - Included Remote: 10 Series Universal Remote (RC004PMND)
  - Power Consumption: 270W (Standby: 0.1W)
  - Dimensions (W x H x D): 440 x 192 x 473 mm
  - Cabinet Dimensions (W x H x D): 440 x 192 x 422 mm
  - Weight: 33.7 kg (net), 39.0 kg (packaged)
  - Origin: Crafted in Shirakawa, Japan
