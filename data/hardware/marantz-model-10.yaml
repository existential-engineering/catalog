description: Reference integrated amplifier featuring a newly designed dual-mono
  symmetrical amplifier topology with 250W per channel into 8 ohms (500W into 4
  ohms) and an all-new Marantz Switch-Mode Power Supply. The most powerful,
  highest performing Marantz amplifier ever, crafted in Shirakawa, Japan with a
  triple-layer aluminum chassis, copper shielding, and brushed aluminum front.
  Sound Master Tuned for warmth, spaciousness, and resolution.
details: |-
  MODEL 10 is the new reference in amplifier design and the most powerful and finest sounding integrated amplifier Marantz has ever made. It is rated at 250W + 250W into 8 ohms and 500W + 500W into 4 ohms, 20Hz to 20kHz at 0.05% THD, into a speaker impedance of 4 to 16 ohms.

  From the triple-layer aluminum chassis with copper shielding to entirely original multi-layer PCBs, isolated sub-enclosures, and all new HDAM modules, MODEL 10 is the product of decades of expertise in audio engineering. The power amplifier section is a switch-mode BTL design built on a new Marantz-engineered platform with Purifi technology, with fully balanced dual-mono amplifiers and independent left and right switch-mode power supplies; the preamplifier section has its own toroidal transformer in a shielding case.

  MODEL 10 retains the sonic Marantz signatures of warmth, spaciousness, and resolution. Advances in design and precise tuning by the Sound Master result in more detail, lower distortion, and higher dynamic range. The headphone circuit uses an HDAM-SA2+ diamond buffer and delivers 130mW into 32 ohms, muting the speakers automatically when a headphone is inserted.

  Designed with a brushed aluminum front, MODEL 10 is encased in a copper-plated, triple-layered chassis with an illuminated mesh cover grille. Lighting inside the amplifier showcases the circuit boards, high-quality components, and specially designed transformer case. The porthole houses an HD TFT Color Display for volume and input selection, along with a digital level meter that behaves like vintage analog meters.

  MODEL 10 was conceived and engineered in Marantz facilities in Shirakawa, Japan.
specs: |-
  - Rated output power: 250W + 250W (8 ohm, 20Hz-20kHz, THD 0.05%), 500W + 500W (4 ohm)
  - Speaker impedance: 4~16 ohm
  - Frequency response: 5Hz~60kHz +0dB/-3dB, 20Hz~20kHz +0dB/-0.3dB
  - Total harmonic distortion: 0.005% (125W, 8 ohm, 20-20kHz)
  - Damping factor: 500 (8 ohm, 20Hz-20kHz)
  - Power amplifier circuit: Switch Mode BTL, Purifi technology, dual mono
  - Preamplifier circuit: New HDAM High Grade, full balance
  - Phono input: MM 3.6 mV / 39 kohm
  - MC selectable impedance Low 33 ohm / Mid 100 ohm / High 390 ohm at 400 uV
  - RIAA deviation: 20 Hz - 20 kHz +/-0.5 dB (MM/MC)
  - Input sensitivity CD/LINE/RECORDER: 350 mV/47kohm unbalanced, 700 mV/36kohm balanced
  - Input sensitivity power amp input: 1.58V / 47kohm unbalanced, 3.16V / 15kohm balanced
  - SN ratio: Phono MM 88dB, Phono MC 76dB, Line/Recorder 122dB, Balanced 122dB
  - Headphone output level: 130mW / 32 ohms, HDAM-SA2+ diamond buffer
  - Tone control: Bass 50Hz +/-10dB, Treble 15kHz +/-10dB, electric
  - Analog input (including phono) / Rec Out (RCA): 4 / 1
  - Balanced XLR input: 2
  - Power Amp Direct: RCA and XLR
  - Pre Out: RCA and XLR
  - 2 sets of speaker output (bi-wiring), Marantz Original SPKT-100+ terminals
  - Mono mode and Stereo / Bi-Amp switch on rear panel
  - F.C.B.S. (Floating Control Bus System), RC-5 remote control bus in/out, flasher input
  - Front panel: HD TFT Color Display with 20-step dimmer and level meter
  - Power consumption: 270W, 0.1W standby
  - Dimensions: 440 x 192 x 473 mm (W x H x D)
  - net weight 33.7kg
