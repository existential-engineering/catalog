description: A 3-voice studio pitch shifter with hard tuning for Meris's 500
  series rack. Three voices, in rhythm, combine with the original signal to
  create angelic harmonies, from smooth pitch-locked harmony to hard stepped and
  extreme warping.
details: |-
  Installed into a studio rack, Hedra 500 re-voices a melody palette in real time. Three voices, in rhythm, combine with the original voice to create angelic harmonies. Each voice can be delayed and fed back for classic studio fattening, detuning, or extreme warping.

  Pitch locked harmony is available either smooth or hard stepped, turning a voice into an instrument. Sonic unease and texture can be added by micro tuning each voice, or with Meris's original glide mode, which slides between pitches.

  Hedra offers selectable pitch correction types to re-voice melodies in real time, with hard stepped pitch correction available alongside individual pitch and time offset controls for each of its three voices. Chromatic or key driven harmony with selectable scale types is paired with a 520 ms tap tempo synced delay with selectable pitch feedback, switchable half speed, and an auto swell for advanced textures.
specs: |-
  - 3-Voice Rhythmic Pitch Shifter
  - Selectable Pitch Correction Types to Re-Voice Melodies in Real Time
  - Hard Stepped Pitch Correction available
  - Individual Controls for Pitch and Time Offset for each Voice (3 Voices Total)
  - Micro Tune control creates gentle chorus-like detuning, classic studio fattening, and extreme warping
  - Chromatic or Key Driven Harmony with Selectable Scale Types
  - 520 mS tap tempo synced delay with selectable pitch feedback
  - Original Glide Mode slides between pitches at the speed chosen
  - Choice to sweep through intervals smoothly or hard step for dramatic pitch effects
  - Switchable Half Speed and Auto Swell for advanced textures
  - Digitally controlled Analog mix control
  - Premium analog signal path and 24-bit AD/DA with 32-bit floating point DSP
  - Balanced I/O, extremely low noise floor and high headroom for a pristine studio signal path
  - Color: raw brushed aluminum with clear coat
  - Designed and Built in California, U.S.A.
  - -116 dB Signal to Noise Ratio (typical)
  - Burr-Brown precision balanced input and output drivers
  - Stereo and Surround Linkable
  - 100% Analog bypass
