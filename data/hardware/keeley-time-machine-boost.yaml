description: DISCONTINUED 2016 The Time Machine Boost is designed to be used
  with a cranked amp to deliver glorious tones. The TMB is a legend. One of the
  first dual booster pedals designed with vintage and modern pre-amps.
details: |-
  The Time Machine Boost is a two channel, five mode preamplifier intended to drive an amplifier into overdrive or saturation. The two channels are labelled Vintage and Modern. The Vintage side takes after rare germanium boosts such as the Dallas Rangemaster, and each unit's germanium stage is calibrated and then tuned by ear for treble boosting. The Modern side is a dual JFET circuit giving a transparent 23 dB of gain, using J201 JFETs for clear high end.

  A Maxim MAX1044 voltage doubling IC supplies extra headroom. The pedal contains the Katana and Java Boost circuits, and it is hand built in the USA. The design was revised in May 2014 with more output than earlier versions.

  Keeley is explicit that this is a booster rather than an overdrive or distortion pedal, and that it is meant to be used alongside other drive pedals as part of a gain section.

  The design dates to 2002, when David Szabados and Robert Keeley built a pedal together under the name Legendary Tones. It was one of the few pedals point-to-point wired at the time, appeared on the cover of Vintage Guitar Magazine in March 2003 and in Guitar World in February 2003. Keeley acquired Legendary Tones shortly after the George Lynch Mr. Scary version appeared, and the gain and features of those units were folded into the 2014 revision.
