description: Eight-channel, 600W @ 4Ω Analog Power Amplifier with 70V/100V
  constant voltage capability. Part of the DriveCore Install series for
  professional installation applications.
details: |-
  The DCi 8|600 is part of the DriveCore Install series — a comprehensive line of high-performance installation amplifiers utilizing proprietary DriveCore technology. Engineered to industry-leading quality standards, it provides system integrators with advanced features and flexibility for modern installed sound applications.

  The amplifier delivers true rack density with 8 channels in a 2RU format, and offers direct drive constant voltage (70V rms or 100V rms) without step-up transformers. Each channel is independently selectable between Hi-Z and Low-Z, allowing the amplifier to drive 1–2 speakers or hundreds in high-Z mode.

  Channel pairs are bridgeable, even in 100Vrms mode, for additional adaptability. The unit features a remote on/off interface for control system integration, efficient forced-air cooling (front-to-back airflow), and an advanced Power Factor Correction (PFC) universal power supply.
specs: |-
  - Output Channels: 8
  - Output Power (4Ω, Dual Mode, All Channels Driven): 600W
  - Output Power (Bridge Mono, 8Ω): 1200W
  - Frequency Response (8Ω, 20Hz–20kHz): ±0.25dB
  - Total Harmonic Distortion (full rated power): 0.35%
  - Damping Factor (20Hz–100Hz): >1000
  - Load Impedance (Stereo): 2Ω–16Ω; 70V/100V rms
  - Load Impedance (Bridge Mono): 4Ω–16Ω; 140V/200V rms
  - Cooling: Continuously variable speed forced air, front-to-back
  - Max Fan Noise: 47 dBA SPL @ 1M
  - AC Mains: 100V–240V ~ 50/60Hz (±10%)
  - Power Connector: 20A IEC
  - Dimensions: 483 × 89 × 432 mm (19″ × 3.5″ × 17″)
  - Weight: 13.60 kg (30 lbs)
