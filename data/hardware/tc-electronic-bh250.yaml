details: |-
  With this super-compact bass head, you get a lot more than just power to play. The unique TonePrint feature allows you to load and swap effects in seconds, which is sure to inspire you to come up with personal and diverse bass lines.     •    TonePrint - Instant Inspiration    •    Super Portable -  4 lbs / 1.8 kg    •    Bass Tuner - For 4, 5 and 6 strings

  The Chorus effect is based on our legendary Stereo Chorus Flanger - aka SCF - that set new standards for chorus greatness decades ago and is still going strong. Now, it has been tailored with painstaking attention to detail for one specific purpose: Bass!

  The Flanger effect builds on our Vortex Flanger pedal that has amazed and inspired bass players all over the world ever since its release in 2010.

  The Vibrato effect is similar to our Vibrato Shaker pedal. It may not be the most common effect for bass players, but many have found it great for experimenting with new styles and creative ideas.

  Weighing in at only 4 lbs./1.8 kg, BH250 is the ideal partner if you are a busy bass player in need for a full-featured head with ample power and oomph.Get through any gig or session, while keeping your spine functional beyond your 30th birthday. With BH250, you get the perfect balance between output and weight.
