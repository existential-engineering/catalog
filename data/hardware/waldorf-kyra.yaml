description: >-
  The Waldorf Kyra is a hardware virtual analog synthesizer released in 2019, combining
  the capabilities of a software synthesizer with dawless standalone operation. It
  features 128-voice polyphony across an eight-part multitimbral architecture, powered by
  a dedicated FPGA-based sound engine housed in a sturdy metal chassis with wooden
  end-cheeks. The Kyra offers an abundance of wavetable components, six filter types,
  comprehensive effects, and a knob-per-function layout for hands-on control.
details: |-
  The Kyra stands out as a unique offering from Waldorf that delivers the speed and power of software synthesizers within dedicated hardware. Its integrated circuit design provides reliability and stability superior to computer-based solutions, eliminating boot times and cooling issues inherent to DAW setups.

  With 128-voice polyphony across an eight-part multitimbral architecture, the Kyra functions as a powerhouse with up to 32 voices per part. Waldorf implemented a practical knob-per-function layout with value buttons beneath a small monochrome display, making sound design immediate and intuitive.

  The sound engine features an abundance of wavetable components organized into categories for easy access. Users can select single or dual filter operations from six available types with 12dB and 24dB slopes, complemented by three envelope generators and three LFOs. The comprehensive sound library includes recreations of classic synthesizers alongside entirely new sounds across multiple banks.

  Connectivity is generous for a desktop module, including a headphone output, eight quarter-inch analog audio outputs, 5-pin DIN MIDI In/Out/Thru, and USB2. An external 12V power supply keeps the unit cool and quiet during operation.
specs: |-
  - 128-voice polyphony (32 voices per part maximum)
  - 8-part multitimbral
  - 10 oscillators per voice with sub oscillator, Super Saw, and wavetable waveforms
  - 6 filter types with 12dB (2-pole) and 24dB (4-pole) slopes
  - 3 ADSR envelope generators
  - 3 LFOs with noise, sample & hold, saw up/down, sine, square, triangle, freerun, and key sync
  - Stereo effects including EQ, formant filter, distortion, dual limiters, stereo delay, phaser, chorus/flanger, and reverb
  - 3328 patches in RAM with USB and internal storage
  - Arpeggiator with 128 preset patterns, chord mode, and MIDI clock sync
  - 8 x 1/4-inch analog audio outputs
  - Headphone output
  - MIDI In/Out/Thru (5-pin DIN)
  - USB 2.0
  - 12V external power supply
