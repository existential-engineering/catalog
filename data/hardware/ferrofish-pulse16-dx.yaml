description: The PULSE16 DX converts 16 x 16 balanced analog inputs and outputs
  to ADAT, MADI and Dante I/O at studio quality up to 96 kHz. Packed into just
  1U, the highly integrated converter carries 16 x 16 balanced analog TRS
  sockets at studio levels up to +20 dBu, individually adjustable in 1 dB steps.
details: |-
  The PULSE16 DX converts 16 x 16 balanced analog inputs and outputs to ADAT and MADI I/O at studio quality up to 96 kHz. ADAT is a cost-effective and mature interface that is already available almost everywhere, so adding 16 x 16 analog channels to a studio takes only a few steps. The 32 x 32 ADAT channels can also be routed alongside the analog channels to and from the MADI and Dante channels.

  The low-latency A/D and D/A converters, a temperature-compensated clock and a jitter reduction PLL are there to keep the sound clear. All of it sits in a compact 1U chassis, and the PULSE16 DX delivers studio levels up to +20 dBu, individually adjustable in 1 dB steps, across a total of 32 jack connectors. The 4 x 4 ADAT ports convert 16 x 16 channels at 96 kHz without reducing the channel count, as do the 64 x 64 MADI and Dante channels, which drop to 32 x 32 at 96 kHz.

  Configuration is straightforward thanks to the two TFT screens, which lay out all the information without a look at the manual. Remote control over MIDI or Ethernet is also possible with the free RemoteFish app for PC and Mac.

  The headphone output can play back almost any analog or digital input or output, which suits a quick check of a signal.
specs: |-
  - A/D and D/A converters with 16 balanced analog inputs and outputs at +20 dBu
  - Input and output levels individually adjustable in 1 dB steps
  - 32 x 32 digital channels over 4 ADAT I/O sockets, converting 16 x 16 channels even at 96 kHz
  - 64 x 64 digital channels on the MADI interface over an optical multimode SFP module, with a coaxial module available as an option
  - 64 x 64 digital channels on the Dante interface in a redundant primary and secondary arrangement
  - Monitoring matrix of almost every digital and analog input and output onto the stereo headphone output
  - All analog and digital inputs and outputs on the rear panel are freely routable in groups of 8 channels
  - Preset management
  - Word clock generator and receiver with a proprietary jitter reduction circuit
  - 19 inch 1U chassis, 19 x 48 x 4.4 cm, 5 kg
