details: |-
  The XIX Anniversary Katana Clean Boost is the nineteenth anniversary edition of the redesigned Katana, offered in a black colourway and limited to 100 units.

  The redesign returns to the original circuit's JFETs and component values, with the Boost mode revised for a clearer sound and more defined bass notes when engaged. Construction was updated with modern techniques, including an aluminium control knob intended to be adjusted by foot during performance.

  Two modes are selected by the knob position. Pushed in, the control acts as a clean volume boost with high headroom. Pulled out, the pedal adds a harmonically rich, slightly driven character that the page describes as tube grit rather than a full overdrive.

  Dual FETs are used for the gain stage, and an internal charge pump nearly doubles the operating voltage from the 9V DC supply, giving the extra headroom. The page warns that 9V DC is the maximum input voltage. It also notes that the Katana circuit was Robert Keeley's first guitar effect design, originally part of the Time Machine Boost before becoming a separate product.
