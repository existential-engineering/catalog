details: |-
  The MC-307 is the groovebox aimed specifically at DJs. Like the other MC units, it is a robust pattern-based sequencer and sound module, but it introduces a turntable emulation mode that affects pattern tempo and pitch in the same way as a turntable's speed fader.

  Hold and Push buttons let performers emulate slowing, speeding, stopping, or flicking a record by hand, enabling beat-mixing the groovebox as if it were vinyl. A Grab switch with multi-effects including an isolator creates interesting rhythmic effects during performance.

  The MC-307 features all the familiar Roland groove product sounds plus many new additions, with 800 patches and 40 rhythm sets plus 20 user sets. The sequencer comprises seven instrument parts plus one rhythm track, each independently mutable for dropping sounds in and out of loops on the fly. The Real-time Phrase Sequencer offers 470 instant patterns across dance music styles. A large backlit LCD display improves on previous groovebox interfaces.

  With 64-voice polyphony, 16MB of sounds, 33 effect types across three independent synchronizable processors, and 43 preset arpeggiator patterns, the MC-307 excels as a DJ performance tool. It lacks the D-Beam controller found on the MC-505. The MC-307 has been used by BT.
specs: |-
  - Polyphony: 64 voices
  - Oscillators: 16MB ROM comprising 800 dance-oriented synth and drum instruments
  - Drums: 40 rhythm sets plus 20 user
  - Effects: 33 types across 3 independent synchronizable processors
  - Arpeggiator: 43 preset, 10 user patterns
  - Sequencer: 8 parts, 240 preset patterns, 470 RPS, 200 user patterns, 50 songs, 40,000-note memory
  - Keyboard: 16 pads
  - Memory: 800 presets plus 256 user
  - Control: MIDI
