description: Punchy and snappy snare!
details: |-
  No drum machine is really complete without a punchy, snappy snare drum. Together with the kick it creates the rhythmic backbone for most grooves.

  For the percussion-focused second season of educational DIY kits, Erica Synths and Moritz Klein set out to design a snare circuit that would complement the Kick and Hi-Hat released earlier in the series. After a lot of fine tuning the result is the mki x es.EDU DIY Snare Drum.

  Tune is available under manual and CV control, with an attenuator for the tune CV depth, and attack and decay are set by hand. The Snappy control crossfades between noise and tone and takes CV as well as manual control. An accent input completes the voice.

  Erica Synths and Moritz Klein developed a series of educational DIY kits under the brand name mki x es.EDU with one specific goal in mind: to teach people with little-to-no prior experience how to design analog synthesizer circuits from scratch. What arrives in the box is not simply meant to be soldered together and then disappear in a rack. Instead the kit walks the builder through the circuit design process step by step, explaining every choice that was made and how it impacts the finished module.

  Each kit comes with an extensive user manual, downloadable separately, that dives deep into both the electronics behind the circuit and the fundamental principles of sound synthesis.
specs: |-
  - Manual and CV controlled Tune
  - Tune CV depth attenuator
  - Manual Attack and Decay control
  - Manual and CV Snappy control (noise and tone crossfade)
  - Accent input
