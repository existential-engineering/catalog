details: |-
  Boasting a sleek and comfortable off-set shape, the Harmony Silhouette with Bigsby is made with specifically sourced Alder wood, known for its balanced and full-bodied sound. Featuring our custom Harmony gold foil mini-humbuckers, the guitar delivers resonant and crystal clear tone from the get-go. The addition of a Bigsby B5 Vibrato opens up a new realm of tonal possibilities, melding distinctive tones from the Silhouette with expressive vibrato from the Bigsby.
