description: >-
  The Korg Rhythm 55 (KR-55) is a preset analog drum machine released in 1979,
  featuring 48 rhythm patterns with 16 intros and 16 fill-ins across genres
  including Rock, Disco, Samba, and Bossa Nova. It offers 12 individual drum
  tones with adjustable levels and a swing beat control for adding groove
  variations. The KR-55 also supports external footswitch control for hands-free
  start/stop and fill-in triggering.
details: |-
  The KR-55 was one of Korg's more advanced preset rhythm machines of the late 1970s, providing comprehensive rhythm accompaniment for solo performers and studio musicians. Its 12 drum tones — including Bass Drum, Snare Drum, dual HiHat, Cymbal, dual Conga, Rim Shot, Claves, Cowbell, and dual Tom Tom — could be individually mixed using dedicated level controls, giving users unusual flexibility for a preset drum machine of this era.

  A standout feature was the swing beat control, which allowed musicians to shift patterns away from strict quantization and add a more natural, groovy feel. The unit also offered intro and fill-in patterns that could be triggered via front-panel buttons or external footswitches, making it practical for live performance use.

  A later variant, the KR-55B, was released in 1982 with a black chassis and doubled the rhythm pattern count to 96. Notable users of the KR-55 include Jean-Michel Jarre, Trio, and Depeche Mode.
specs: |-
  - 12 drum tones: Bass Drum, Snare Drum, dual HiHat, Cymbal, dual Conga, Rim Shot, Claves, Cowbell, dual Tom Tom
  - 48 preset rhythm patterns
  - 16 intro patterns
  - 16 fill-in patterns
  - Individual drum sound level controls
  - Swing beat control
  - Tempo control
  - External footswitch jacks for Start/Stop and Intro/Fill
  - Analog sound generation
