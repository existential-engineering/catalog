description: The Talisman Plate Reverb recreates the lush ambience of the giant
  mechanical plate reverbs used in 1970s studio recording, capturing the sound
  heard on iconic albums like Pink Floyd's Dark Side of the Moon. It adds
  dimension, thickness, and depth in an unobtrusive way that works across genres
  and styles. Handmade in Portland, Oregon.
details: |-
  The Talisman Plate Reverb emulates the lush ambience of vintage mechanical plate reverb units from 1970s studio recording. With studio-style controls, it brings dimension, thickness, and depth without coloring the dry signal excessively.

  Includes an internal bypass mode switch. Handmade in Portland, Oregon. Power accepts 9-18V DC center-negative. Backed by a 3-year warranty.
