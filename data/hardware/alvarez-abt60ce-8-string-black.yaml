details: |-
  Tuned from B to B, the ABT60ce 8-String is pitched between a dreadnought and
  acoustic bass, giving you deep, sonorous tones. Providing easy playability,
  chord shapes and scales on this baritone are the same as a standard six-string,
  only with a lower voicing.

  The FST2 bracing finds the perfect harmony between rigidity and vibration,
  allowing the top to be both driven and controlled by the air volume this guitar
  creates. Delivering both balance and liveliness, the symmetry is inspiring for
  every player.

  This 8-string model is a portal into musical discovery. The lower register is
  augmented with two-octave strings on the 3rd and 4th strings, bringing layers
  of treble response and octave shimmer to the deeper voice of a baritone. If you
  approach this guitar in a percussive fingerstyle fashion, it is mind-bendingly
  versatile, sounding almost as though an octave pedal or second instrument is
  present.

  The ABT60ce 8-String is fitted with the LR Baggs StagePro Bronze — a
  small-footprint side-mounted EQ incorporating the renowned LR Baggs Element
  under-saddle pickup, featuring a large backlit tuner, volume, bass and treble
  controls and phase, with a battery box built into the end pin jack compartment
  for easy access.

  Part of the Alvarez Artist Series, this guitar represents a commitment to
  quality construction with an all-solid Sitka Spruce top and African Mahogany
  back and sides. All Artist Series solid tops undergo Alvarez's ATR (Advanced
  Tonal Response) process, a form of torrefaction that removes moisture and
  volatiles from the wood, improving resonance, stability, and tonal complexity
  from day one.
