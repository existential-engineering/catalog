description: The Alpha·Omega Photon combines Darkglass' signature Alpha·Omega
  parallel distortion with studio-grade compression, a 6-band EQ, cabinet
  simulation, XLR DI output, and USB-C audio interface capability in an advanced
  bass distortion pedal.
details: |-
  The Alpha·Omega Photon is Darkglass Electronics' advanced distortion and compression pedal, combining their signature Alpha·Omega parallel distortion circuit with comprehensive studio features. It serves multiple roles: distortion pedal, audio interface, amp replacement, and full tone-shaping tool.

  The pedal includes a 6-band graphic EQ with touch-sensitive sliders offering plus or minus 12 dB across low shelf, 250 Hz, 500 Hz, 1.5 kHz, 3 kHz, and high shelf. It provides 5 distortion modes and 5 compressor modes with selectable ratios (4:1, 8:1, 12:1, 20:1, and ALL IN). The Alpha/Omega blend control mixes between punchy, tight and brutal, raw distortion characters. A built-in headphone output supports impedances from 16 to 600 ohms, and 5 cabinet simulation IRs are included with expandable options via the Darkglass Suite.

  Extensive connectivity includes an XLR balanced DI output with ground lift, two 1/4-inch balanced outputs, a headphone output, an aux input for backing tracks, a MIDI input, and a USB-C port for audio interface and MIDI functionality. The unit measures 18 cm wide x 12 cm deep x 6 cm high and weighs 0.7 kg.
specs: |-
  - Advanced Alpha·Omega distortion and compression pedal
  - 6-band graphic EQ (low shelf, 250 Hz, 500 Hz, 1.5 kHz, 3 kHz, high shelf; +/-12 dB)
  - 5 distortion modes
  - 5 compressor modes (4:1, 8:1, 12:1, 20:1, ALL IN)
  - 5 cab sim IRs, expandable via Darkglass Suite
  - MIDI input to externally control parameters
  - Aux input and headphone output (16-600 ohms)
  - Audio interface capability over USB-C
  - Requires regulated 9V DC center-negative supply (~500 mA)
  - Dimensions: 18 cm x 12 cm x 6 cm; weight 0.7 kg
