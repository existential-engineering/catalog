description: "Elevate the accuracy of your audio monitoring to a new level with
  the precision and adaptability of the 8340A Smart Active Monitor."
details: |-
  The 8340A is a Smart Active Monitor (SAM) two-way studio monitor from Genelec. Top professionals the world over in recording studios, post-production houses, digital edit suites, radio, TV and outside broadcasting have come to rely on the unvarnished truth of the 8340A. Its wide and stable sweet spot promotes accurate, reliable mix decisions, and its bulletproof durability is essential for mission-critical applications.

  As a Smart Active Monitor, the 8340A integrates closely with Genelec's GLM software, via which it can be configured and calibrated for the listening environment, compensating for detrimental room influences to create a truly optimised monitoring solution from mono to immersive. This makes it well suited to challenging acoustic spaces and varied room treatments, where automated room compensation is a meaningful workflow benefit.

  The cabinet is built around Genelec's Minimum Diffraction Enclosure (MDE) made of die-cast aluminium, with rounded edges and a gently curved front and sides to minimise diffractions and improve flatness of frequency and power response. The Directivity Control Waveguide (DCW) is integrated into the front baffle to produce a controlled, constant directivity pattern, reducing early reflections and providing a wide and consistent listening window for stereo and multi-channel work.

  The integrated Iso-Pod stand decouples the monitor from the supporting surface, allows tilt adjustment of approximately +/- 15 degrees, and damps unwanted mechanical vibration from passing into the console or desk. Intelligent Signal Sensing (ISS) automatically puts the monitor into a low-power standby state when no signal has been detected for some time and wakes it instantly when audio returns, supporting both regulatory and sustainability goals.

  Genelec awards listed on the product page for the 8340A include the Future Music Gear of the Year 2016 in the 'Best Monitor' category and the PIPA Pro Light and Sound International Press Award 2017 in the 'Best Studio Monitor' category.
specs: |-
  - Configuration: Smart Active 2-way studio monitor (SAM)
  - Frequency response: 45 Hz - 20 kHz (+/-1.5 dB)
  - Low cutoff (-6 dB): 38 Hz
  - High cutoff (-6 dB): 22 kHz
  - Short-term max SPL: >=110 dB
  - Peak SPL: >=118 dB
  - Self-generated noise: <=5 dB SPL (A-weighted)
  - Harmonic distortion: <=2% (50-100 Hz), <=0.5% (>100 Hz)
  - Group delay: 3.0 ms (Extended Phase Linearity off)
  - Bass driver: 165 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 150 W Class D
  - Treble amplifier: 150 W Class D
  - Mains: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): <=1 W
  - Power consumption (idle): <=12 W
  - Power consumption (full output): 180 W
  - Height (with Iso-Pod): 365 mm
  - Width: 237 mm
  - Depth: 223 mm
  - Weight: 8.4 kg (18.5 lb)
  - Enclosure: Minimum Diffraction Enclosure (MDE), die-cast aluminium
  - Calibration: GLM (Genelec Loudspeaker Manager) compatible
