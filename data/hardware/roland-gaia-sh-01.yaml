description: >-
  The Roland Gaia SH-01 is a virtual analog modeling synthesizer that carries on
  the SH-series tradition of hands-on tweaking, user-friendly layout, and
  compact design. It features a unique three-layer virtual architecture where
  each of its three oscillators has its own dedicated filter, amplifier, and
  LFO, enabling complex layered patches. Weighing under 10 pounds with battery
  power capability, it is a portable synthesis tool suited for both stage and
  studio use.
details: |-
  The Gaia SH-01 builds on Roland's SH-series legacy with a virtual analog engine that emphasizes direct, hands-on control. Although there is physically one oscillator, one filter, one amp, and one LFO on the front panel, you actually have three of each that are virtually layered over one another, allowing deep sound design from a deceptively simple interface.

  Each oscillator offers seven waveforms including saw, square, pulse, triangle, sine, noise, and super saw, with three variations per waveform for a total of 21 tonal options per oscillator. Oscillator sync and ring modulation are available for more aggressive timbres, and two-part envelope generators provide additional shaping. Four filter types are on hand: low-pass, high-pass, band-pass, and peaking, each switchable between -12dB and -24dB slopes.

  A dedicated master effects section features distortion, fuzz, bit crusher, flanger, phaser, pitch shifter, delay, panning delay, reverb, and low boost, all with extensive tweakability. Performance tools include a D-Beam controller, phrase recorder, 64 arpeggio patterns, and an external audio input with voice-canceling options.

  The 37-key velocity-sensitive keyboard with pitch and modulation joystick represents a significant improvement over the SH-201, with better key feel and a more robust build. The Gaia stores 64 preset patches and 64 user patches, and connects via MIDI In/Out and USB 2.0.
specs: |-
  - 64-voice polyphony
  - 3 virtual oscillators with 7 waveforms each (21 variations per oscillator)
  - Waveforms: saw, square, pulse, triangle, sine, noise, super saw
  - Oscillator sync and ring modulation
  - 4 filter types: LPF, HPF, BPF, PKG (-12dB/-24dB slopes)
  - ADSR envelope for amplifier; Attack/Decay envelope for oscillator
  - LFO with triangle, sine, saw, square, and sample-hold waves
  - 11 effects: distortion, fuzz, bit crusher, flanger, phaser, pitch shifter, delay, panning delay, reverb, low boost
  - 37-key velocity-sensitive keyboard
  - Pitch/modulation joystick
  - D-Beam controller
  - Phrase recorder (8 patches, 1 track)
  - 64 arpeggio patterns
  - 64 preset patches, 64 user patches
  - External audio input with voice-canceling
  - MIDI In/Out, USB 2.0
  - Battery operation supported
  - Weight: 4.2 kg (9 lbs 5 oz)
