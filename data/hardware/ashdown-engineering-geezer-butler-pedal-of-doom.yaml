description: Created with Black Sabbath bassist Geezer Butler, the Pedal of Doom
  is a preamp/DI pedal that captures the tone of the Head of Doom amp in a
  stompbox. It carries a dual switchable active EQ (each side with Bass, Lo-Mid
  and Hi-Mid, plus a shared Treble), a switchable Doom drive with its own Doom
  Volume, and dual VU meters for input and output monitoring. A
  transformer-isolated balanced DI output sends the sculpted signal to front of
  house or a line input, and the pedal is ruggedly built for stage and studio.
details: |-
  Preamp/DI stompbox developed with Geezer Butler, voiced after his Head of Doom amp. Two switchable EQ voicings let players sculpt two distinct tones, each with Bass, Lo-Mid and Hi-Mid controls and a shared Treble; EQ can be applied pre-drive for sculpted distortion. Switchable Doom drive with Doom and Doom Volume knobs. Dual VU meters monitor the bass signal through the chain. Pro balanced transformer-isolated DI output for FOH or line-level input. Powered by a 9-18V external supply (centre-pin negative). Dimensions 180 x 60 x 120 mm, net weight 1.2 kg.
specs: |-
  - Preamp / DI pedal voiced after the Head of Doom amp
  - Dual switchable active EQ: each side Bass, Lo-Mid, Hi-Mid; shared Treble; EQ applicable pre-drive
  - Switchable Doom drive with Doom and Doom Volume controls
  - Dual VU meters (input/output monitoring)
  - Pro balanced transformer-isolated DI output
  - Power: 9-18V external supply (centre-pin negative)
  - Dimensions: 180 x 60 x 120 mm
  - Weight: 1.2 kg
