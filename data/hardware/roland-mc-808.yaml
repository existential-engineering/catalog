description: >-
  A 128-voice digital groovebox combining synthesis and sampling with a 16-track
  sequencer, eight motorized faders, and 16 drum pads in a performance-oriented
  desktop format.
details: |-
  The Roland MC-808 arrived as a more affordable follow-up to the MC-909, yet surpassed its predecessor in several key areas. Most notably, it doubles the polyphony to 128 voices and introduces eight motorized faders — a first for a groovebox in its price range — that automatically adjust when patterns are recalled.

  The sound engine combines 622 waveforms with sampling capability, offering approximately 47 seconds of monaural sampling from 4MB of internal RAM expandable to 512MB via DIMM modules. Sixteen drum pads double as keyboard keys for playing synth patches, while a D-Beam controller adds gestural expression. Compact Flash cards up to 1GB provide additional storage for samples and songs.

  The 16-track sequencer provides the backbone for composition, supported by 683 preset patterns and an arpeggiator with multiple modes including up, down, alternating, and random. Forty-seven effects types cover essentials from equalizer and overdrive to delay. The aluminum front panel with backlighting is designed with live performance visibility in mind.

  Jean Michel Jarre made notable use of MC-808 preset patterns on his Teo and Tea album. While not universally regarded as the strongest groovebox of its era, the MC-808 offers substantial creative depth for song production and live performance in a self-contained package.
specs: |-
  - Polyphony: 128 voices
  - Waveforms: 622
  - Sampling: 4MB RAM (expandable to 512MB via DIMM)
  - Sequencer: 16 tracks, 683 preset patterns
  - Arpeggiator: Up, Down, Up&Down, Random, chord memory
  - Effects: 47 types
  - Pads: 16 drum pads
  - Faders: 8 motorized
  - Storage: Compact Flash (up to 1GB)
  - I/O: MIDI In/Out, USB, audio in/out, headphones
  - Controller: D-Beam
