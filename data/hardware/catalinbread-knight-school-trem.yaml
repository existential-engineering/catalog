details: |-
  The Knight School Trem is a fully-analog multi-wave tremolo supplied as a build-it-yourself kit. Two different modes and a waveform Warp knob cover everything from two types of sawtooth wave and a triangle wave to an adjustable pulse-width square wave, selected with the flick of a switch and the twist of a knob. A wide-range modulator handles both very slow and very fast rates, and an adjustable depth control sets the intensity.

  While most guitarists recognize the word "transistor" as the fundamental effects pedal amplification parts, they have several other functions depending on how they're wired. One such function is that of a switch. When voltage is applied to the base pin of a transistor, it "opens" the switch, i.e. connects the other two pins together.

  This is how Boss and Ibanez's bypass switching works, in a nutshell. But what if a pedal's input signal was connected to a transistor's collector, and the transistor emitter was connected to ground? When voltage is applied to the transistor base, the signal gets dumped to ground. When the voltage is cut, the signal passes through. Now, what if you could find a way to send a rhythmic positive voltage to that transistor base? It would rhythmically modulate the signal. Uh-oh, this sounds like tremolo!

  Of course, there are many ways to achieve this effect, but this is one best suited to DIY. The crudest form of this effect was first developed by Jordan Electronics with their Vico Vibe plug-in unit, which works this way but has a limited LFO speed range and only one waveform.

  The Knight School Trem offers six distinct waveforms, a wide speed range control, a depth control and an LED rate indicator that mimics the selected waveform, all in an easy-to-build fully-analog package.
specs: |-
  - Power source: 9V DC power supply, center-negative
  - Controls: Rate, Shape toggle (Tri/Saw and Sq/Pulse), Depth, Warp
  - Six waveforms: sawtooth, reverse sawtooth and triangle in Tri/Saw mode, narrow pulse, square and wide pulse in Sq/Pulse mode
  - LED rate indicator mimics the selected waveform
  - Fully analog transistor-switched amplitude modulation
  - Offered as a DIY kit or fully assembled
