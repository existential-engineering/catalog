url: https://www.dangerousmusic.com/product/source
description: The SOURCE from Dangerous Music is a compact and affordable
  solution to all your monitoring needs with a no-compromise Chris Muth design
  strategy that's made Dangerous monitoring products the worldwide standard
  among top professionals.
details: |-
  SOURCE is a compact, portable studio monitor controller built to the same no-compromise, Chris Muth-designed audio philosophy as the rest of Dangerous Music's monitoring line. It's equally at home in a backpack for a portable rig, on a project-studio desktop, or permanently rack-mounted with the optional SRK kit.

  The unit accepts a balanced stereo professional-level analog input on XLR/TRS combo jacks, plus an 1/8-inch stereo commercial-level input for phones, laptops, and other portable devices. Digital sources include USB (Mac and Windows) and AES/SPDIF up to 192kHz, with an AES/SPDIF thru-port. Two onboard reference-grade D/A converters, a dedicated headphone amplifier feeding two headphone outputs, and two stereo speaker outputs round out the signal path.

  Input and output source-select buttons on the front panel can be switched between toggle mode (one source active at a time) and latch mode (multiple sources active simultaneously).
specs: |-
  - Analog Input 1 (XLR/TRS combo): frequency response +0/-0.5dB, <10Hz to >80kHz; THD+N <0.0025% @+4dBu
  - Digital inputs (AES/SPDIF): lock from 32kHz to 192kHz sample rates; THD+N <0.004%
  - Outputs: fully balanced, 600-ohm drive capable to >+26dBu
  - 2 onboard stereo 24-bit/192kHz D/A converters
  - Dimensions: 12 3/4-inch W x 8-inch D x 1 5/8-inch H
  - Shipping weight: 7 lbs
  - Power supply: 12V, 2A
  - USB: Mac OS 10.6+ driverless plug and play; Windows requires driver
  - Optional 19-inch rack-mount kit available (SRK)
