details: |-
  BAD COMRADE V3 EURORACK MODULAR DEVICE

  (Glitch, Pitch, Slice, and Dice)

  The Bad Comrade is a powerful glitch, delay, and chaotic distortion tool, packed in a tiny 4hp module. Freeze wrecked blips and oscillations in place, create scrambled gated delays, and straight-up over-the-top distortion, all mixed to taste with the original signal. CV available for mix and delay time. Designed and assembled in Seattle, Washington. 4hp, 30mm deep. 20ma current draw. * Important: power up the Bad Comrade with Glitch and Time wide open. Bad Comrade manual

