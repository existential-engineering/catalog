details: |-
  The XVIII Germanium Overdrive is the eighteenth anniversary custom shop edition of Keeley's Oxblood Germanium Overdrive, finished in a candy pink coating. The circuit differs from the standard Oxblood: the compression stage is removed and a germanium transistor is added at the output, which Keeley describes as giving a bolder, smoother response closer to a tube amplifier and a flatter mid-range.

  The diodes were chosen specifically for this version to produce larger, more open amplifier tones with less compression than the standard Oxblood. Rolling the Drive control back gives a cleaner sound, and the range extends through distortion to high gain saturation.

  Six parameters are highlighted on the page: bass response via the Phat switch, which cuts bass for a mid-range shelved voicing with second order harmonic content; clipping selection via the Clipping switch; a wide-range Tone control for the high end; output Volume, with headroom provided by voltage doubling in the circuit; Drive; and the circuit's inherent mid-range voicing.

  The pedal was designed by Robert Keeley and Craighton Hale with input from effects designer Jack Orman, and every unit is built entirely by hand.
