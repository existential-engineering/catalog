description: >-
  The Cheetah MS-800 is a digital wave synthesizer designed by Mike Lynch of Lynett
  Systems. Released as an affordable entry into digital synthesis, it combines digital
  waveforms into sequences to create new sounds, though it gained notoriety for its
  difficult programming interface and lack of a filter section.
details: |-
  The MS-800 was released in 1989 as an affordable entry into digital synthesis. Designer Mike Lynch engineered the unit to include extensive programmability features, which theoretically positioned it competitively in the marketplace. However, the combination of low price point and ambitious functionality backfired, as users found the interface so cumbersome that few invested time in mastering it.

  The programming challenge stemmed from severe interface limitations. Users navigated functions through a two-digit display along with ten push buttons, creating a tedious workflow. The accompanying manual compounded frustration with walls of text and a severe lack of graphics, offering minimal guidance for sound design.

  Despite these drawbacks, the MS-800 featured interesting sonic characteristics. The device combined digital waveforms into sequences to create new sounds, while notably lacking a filter section. Its 16-part multitimbral MIDI architecture suggested professional capability, yet the absence of computer editors meant users could not leverage external tools to ease programming.

  Renewed interest arrived in 2016 when Richard D. James of Aphex Twin released an EP titled Cheetah, referencing the synth in two track titles. This cultural moment introduced the instrument to electronic music audiences seeking vintage character and experimental potential.
specs: |-
  - Polyphony: 15 voices
  - Multitimbral: 16-part via MIDI
  - Waveforms: More than 20
  - Memory: 50 user tone memories
  - Audio Output: Left/right stereo outputs
  - Control: MIDI In/Out/Thru
  - Type: Digital wave synthesizer
