description: >-
  The Yamaha ED10 is an affordable analog drum synthesizer consisting of a
  velocity-sensitive rubber pad paired with a built-in synthesizer. It generates
  drum sounds through analog synthesis using a VCO, noise generator, and
  subsonic oscillator rather than samples. Ten front-panel knobs provide
  hands-on control over pitch and amplitude envelopes plus a non-resonant
  lowpass filter for shaping percussion tones.
details: |-
  The ED10 employs three sound sources: a voltage-controlled oscillator (VCO) with an extensive pitch range, a noise generator, and a subsonic oscillator that produces ring modulation-like effects. These sources pass through pitch and amplitude envelopes plus a non-resonant 12 dB/octave lowpass filter, all controllable via ten front-panel knobs that shape percussion tones.

  The device supports velocity sensitivity on both envelopes, providing expressive dynamic control. Notable features include a mix audio input for blending external signals with drum output and a daisy-chainable power supply, reflecting its modular design heritage. The ED10 belonged to a product line enabling users to build complete electronic drum kits from compatible mixers and racks.

  Triggering flexibility distinguishes this unit. Beyond manual pad playing, users can send audio signals such as rim shots from DAWs or other drum machines to the trigger input for sequencer-style operation, with the device responding to signal amplitude as velocity.

  Sound capabilities range from punchy synth-pop snares, disco tom toms, and sharp analog hi-hats to experimental sci-fi textures through parameter manipulation.
specs: |-
  - 1 voice polyphony
  - 1 VCO with extensive pitch range
  - Noise source
  - 1 Subsonic oscillator
  - 12 dB/octave lowpass filter
  - 1 VCA envelope
  - 1 Pitch envelope
  - Velocity-sensitive rubber pad
  - Trigger input
  - Mix audio input
  - Daisy-chainable power supply
  - No onboard memory
  - No onboard effects
