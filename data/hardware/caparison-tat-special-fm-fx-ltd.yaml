details: |-
  Introducing the TAT-Special FM-FX LTD, a limited-edition fixed-bridge model that combines exceptional sound quality with a stunning, one-of-a-kind design. The body top is crafted from premium flame maple, known for its beautiful grain and tonal richness, while the back is made from Australian blackwood, offering a unique aesthetic and enhanced sound. This limited production model boasts a level of craftsmanship that is as visually striking as it is sonically powerful. The TAT-Special FM-FX LTD features small stainless steel frets, designed for smooth playability and durability. Available in three eye-catching finishes—Black Flame, Blue Flame, and Green Flame—each color highlights the guitar's distinctive curved top and carefully chosen flame maple. For exceptional sound reproduction, the guitar is equipped with a Caparison PH-Rm pickup on the bridge side, capturing the true essence of the body's structure. The neck pickup is the exclusive Caparison SH-27FC, designed specifically for the 27th fret model, ensuring a full, neck-like sound even at the 27th fret. Additionally, the push-pull tone control allows users to split the coils of both the neck and bridge pickups, offering even greater tonal versatility. The TAT-Special's design is built around a through-neck structure with flame maple not only used for its visual appeal but also as part of the body wings, contributing to a broader tonal range and incredible sustain. The 18mm-thick flame maple top and Australian blackwood back provide a rich, dynamic sound. For strength and stability, the guitar features a 5-piece maple-walnut neck, ensuring a balanced tone and lasting performance. Thanks to its unique TAT Curve Top body structure, the TAT-Special offers unrivaled playability and comfort without compromising on sound quality. Whether you're looking for a versatile instrument with a rich, sustaining tone or a stunning design that stands out, the TAT-Special FM-FX LTD delivers on all fronts.
