description: A 2HP passive multiple module that distributes one input to six
  outputs, ideal for oscillator signals rather than control voltages.
details: |-
  The PMULT 6-way passive multiple is a 2HP module ideal for connecting multiple sources to destinations with minimal noise and crosstalk. Since the module is passive, I don't recommend it for multing control voltages (active mults are better for that) but it'll handle oscillator outputs and suchlike just fine. Note also that this is designed as a 1x6 mult - it is not splittable unless you're prepared to do some track cutting. If you use two (or more) inputs, you'll likely find that the outputs are a bit ... unexpected.
