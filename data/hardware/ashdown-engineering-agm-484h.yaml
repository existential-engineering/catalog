details: |-
  AGM-484 - Compact 30 watt all valve guitar head. Designed by renowned British valve guru Dave Green, the AGM (Ashdown Guitar Magnifier) range has been carefully considered, designed and constructed for the modern world where portability, low power options and real valve tones are paramount. Each and every AGM is designed, engineered and lovingly constructed using only the finest components available at the Ashdown HQ in Essex, England. The AGM-484-H is a 30 watt all valve super compact guitar amplifier head. Designed to be as compact and portable as possible, the AGM-484H head bends the established rules of all valve guitar amplification and delivers 30 watts of pure valve guitar tone via 4 x EL84's wherever and whenever required.
specs: |-
  - 30 watt all-valve guitar head
  - 4 x EL84 power valves
  - Super-compact, portable format
  - Designed by Dave Green, built at Ashdown HQ in Essex, UK
