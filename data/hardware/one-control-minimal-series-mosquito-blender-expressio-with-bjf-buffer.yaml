description: A clean blender pedal that mixes an effects loop signal with the
  dry signal, controllable via an expression pedal, with a polarity switch and
  BJF Buffer.
details: |-
  You can easily create new sounds by using your existing effects. Clean blending is a powerful way to use your effects pedals for new sounds. By blending the sound of the effect with the clean signal, you can create a clearer distortion for your core sound, your pitch shifter becomes a harmonizer, and you can seek a new flavor in your compressor. One Control Minimal Series Mosquito Blender Expressio with BJF Buffer is a way to take your guitar and bass sound making to a new level with this pedal. And you can control the clean blend level with the expression pedal. In other words, you can use distortion like tremolo or create sounds that gradually increase harmony. In addition, the overall volume can be adjusted with the MASTER control. You can also boost the sound. By adjusting the volume, you can also suppress sudden volume changes during effect blending, enabling stable operation. BY INVERTING THE PHASE OF THE SIGNAL WITH THE POLARITY SWITCH, YOU CAN MIX NATURALLY WITHOUT PHASING OUT THE SOUND WHEN MIXING WITH THE TYPE OF EFFECTS WHERE THE POLARITY INVERTS. You can also dare to phase out and aim for an original and unique sound. In addition, it has a BJF Buffer switch so you can apply the BJF Buffer to the input part. THE BJF BUFFER:
  This amazing circuit is installed in many switchers from One Control. It is one of the most natural-sounding buffer circuits ever created that destroys the old image people have from using old buffer circuits that changed the tone of the instrument. Features:
  Precise Unity Gain setting to 1

  Input impedance will not change the tone

  Will not make output signal too strong

  Ultra-low noise output

  When the input is overloaded, it will not degrade the output tone. Created at the request of many of the world's greatest guitarists by Björn Juhl, one of the greatest amp and effects designers in the world, the BJF Buffer is the answer to keeping your tone pristine in all sorts of signal chains, from the stage to the studio. The blender circuit divides the signal into two and outputs them into effect loops and outputs. Therefore, the blender circuit also has a buffer, and even if the BJF Buffer is set to OFF, the buffer in the circuit will be applied. The more effects you connect later, the stronger the effect. If the buffer is connected earlier, it is more effective. This is why we incorporated the BJF Buffer into the input section. By turning on the BJF Buffer, you can stabilize the overall tone to a warm and natural sound. ●Controls:
  ・MASTER: Adjusts the overall volume. · 0-100%: Adjusts the balance between wet signal (effect loop signal) and dry signal (input signal). - BJF Buffer: Turns the BJF Buffer ON/OFF. ・POLARITY: Inverts the polarity of the signal. Set it to the one closer to the required tone while listening to the actual tone. ※For the POLARITY switch and the BJF BUFFER switch, switching noise may come out if you switch on/off while playing. ●Expression pedals:
  When the expression pedal is connected to the EXP terminal, the 0-100% knob can be operated with the expression pedal. The expression pedal can be operated with many standard pedals that use stereo cables. BOSS EV-30 was used during development. ※Depending on the connected device or expression pedal, ground noise may occur, especially when you depress the pedal. Setting the Master knob above 12 o'clock may make the noise more noticeable. ●Specifications:
  Input Impedance：500kΩ (Buffer ON)
  Output Impedance：60Ω (Buffer ON)
  size：115W×63D×48H mm
  weight：398g
  current draw：12mA
  Power:DC9V negative tip 2.1mm barrel type

