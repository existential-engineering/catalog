details: |-
  The Aero takes the best elements of the acclaimed contemporary Kyber and A2, but adds a unique twist of tradition inspired by the Delos. The rounded body edges, pickguard, and bolt-on construction pay homage to the classic "golden age of guitar" while enhancing the features to match the modern era of guitar, as seen in the extreme top arm bend, the slotted pickguard design, and the 2025-edition neck heel slope.

  Exclusive to the Aero, the slotted pickguard modernizes the classic feature with decorative slats, tying in with the model's namesake. Reminiscent of both the GT and Kyber headstocks, the Aero headstock capitalizes on the fusion of traditional and modern appearance. The upper horns are reduced to shy away from an aggressive appearance, opting instead for a classic, rounded look.

  A deep lower horn cutaway and sculpted neck heel give the player uninhibited access across the entire fingerboard. Further shining in classical position, the deep cutaway works in conjunction with the bottom body scoop and a shifted side cut for comfort and balance.

  A rear jack placement complements a traditional jack placement for added versatility and increased options. Available exclusively as a six-string instrument in standard scale, the Aero harkens back to the classics.
specs: |-
  - Available exclusively as a six-string instrument in standard scale
  - Construction: bolt-on with radiused neck heel and sculpted neck heel
  - Scale length: 25.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" or 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Neck width: 1.69" wide at the nut, 0.78" thick at the 1st fret, 0.88" thick at the 12th fret
  - Body: alder
  - Pickups: Kiesel Lithium humbuckers
  - Electronics: master volume control with 5-way blade-style pickup selector
  - Output jacks: a flush mount output jack and a rear Access jack, both fitted as standard
  - Bridge: Hipshot fixed bridge, .4125" (10.5mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: Aero headstock
  - Pickguard: white multi-layered slotted pickguard
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Elixir Nanoweb 1046E
  - Body dimensions: 38.5" long, 1.375" thick, 12.6" wide
  - Weight: 6.25 lbs
  - Built to order with a choice of body, top, fingerboard and finish options
