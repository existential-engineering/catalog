description: >-
  The SP-505 is an advanced entry-level sampling workstation aimed at the
  electronic, hip hop and dance market that fits somewhere in between the
  economical BOSS SP-303 and the professional Roland SP-808.
details: |-
  The SP-505 centers on working with one-shot samples, loops, grooves and drum beats through sampling, sequencing and performance features. It offers 8 voices of polyphony and 4MB internal sample memory supporting up to 250 samples across 16 sound banks, expandable via SmartMedia cards up to 128MB.

  Key capabilities include a graphic LCD display for sample editing, pitch mapping to 16 pads, BPM Sync, and a Chop function that divides loops into individual samples for real-time groove reworking. A 4-track Pattern Sequencer with independent quantization supports real-time recording and step sequencing. The device includes 26 DSP effects.
specs: |-
  - Polyphony: 8 notes
  - Multitimbral: MIDI 1-part, Sequencer 4-parts
  - Sample Memory: 4MB internal (2-17 minutes), expandable to 128MB via SmartMedia
  - Sample Rates: 44.1 kHz, 22.05 kHz, 11.025 kHz
  - Effects: 26 DSP effects
  - Sequencer: 4-track
  - Patterns: 40 preset, 100 user
  - Pads: 16 rubber pads (non-velocity sensitive)
releaseDate: "2002"
releaseDateYearOnly: true
