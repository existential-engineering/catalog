description: The Marantz CD6007 is a slimline CD player with custom HDAM
  circuitry designed for aspiring audio enthusiasts. It supports CD and CD-R/RW
  playback, exclusive HDAM SA2 output buffers, high-resolution USB-A audio file
  playback (FLAC, WAV, AIFF, ALAC, DSD), and a front-panel headphone output with
  volume control.
details: |-
  Designed for the aspiring audio enthusiast, the CD6007 recreates audio from CD and USB sources in a slimline chassis.

  High quality 192-kHz/24-bit D/A conversion uses a multi-bit delta-sigma converter with two selectable digital filters and a highly accurate system clock.

  The front USB port supports WAV, MP3, AAC, WMA, FLAC HD, ALAC, AIFF and DSD files.

  The analog stage uses an HDAM low pass filter with an HDAM SA2 output buffer, and the headphone stage combines an HDAM-SA2 buffer with an op-amp, with headphone volume control.

  The Marantz Sound Master tuned CD6007 with careful parts selection, and the player carries a 3 year warranty.
specs: |-
  - CD compatibility: CD / CD-R/RW / WMA / MP3 (no SA-CD, no AAC)
  - Analogue out (Cinch): 2ch, gold plated
  - Digital optical in / out: 0 / 1
  - Digital coaxial in / out: 0 / 1
  - USB Audio (front): Yes
  - USB-A: FLAC / WAV / AIFF / ALAC / DSD
  - No rear USB type B input, no DAC operation mode
  - D-Bus: Yes
  - Headphone out with headphone volume control
  - HDAM version: HDAM + HDAM SA2
  - Power transformer: EI
  - Mechanism: JTL-101Y
  - D/A conversion: multi-bit delta-sigma
  - Low pass filter stage: HDAM
  - Output buffer: HDAM SA2
  - Headphone amp: HDAM-SA2 buffer + op-amp
  - Marantz Musical Mastering: Yes
  - Frequency response: 2 Hz - 20 kHz
  - Dynamic range: 100 dB
  - Signal to noise ratio: 110 dB
  - Total harmonic distortion: 0.002%
  - Channel separation: 98 dB
  - Program play: 25 tracks
  - repeat and random play
  - Remote control: RC004PMCD
  - Power consumption: 32W, standby 0.3W, auto power off, detachable power cable
  - Maximum dimensions (W x D x H): 17.3 x 13.3 x 4.1 in
  - Weight: 14.3 lbs
  - Available colors: Black, Silver-Gold
