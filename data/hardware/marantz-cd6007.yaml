  playback (FLAC, WAV, AIFF, ALAC, DSD), and a front-panel headphone output with
  volume control.
details: |-
  Slimline CD player with custom HDAM circuitry designed for aspiring audio enthusiasts.

  Supports CD and CD-R/RW discs as well as high-resolution USB audio file playback from a front-panel USB-A port.

  Includes a front-panel headphone output with dedicated volume control.
specs: |-
  - D/A Conversion: Multi-bit, Delta-Sigma
  - Output Buffer: HDAM SA2
  - Frequency Response: 2 Hz - 20 kHz
  - Dynamic Range: 100 dB
  - Signal-to-Noise Ratio: 110 dB
  - Total Harmonic Distortion: 0.002%
  - Channel Separation: 98 dB
  - Power Consumption: 32 W (operating), 0.3 W (standby)
  - Dimensions: 17.3" W x 13.3" D x 4.1" H
  - Weight: 14.3 lbs
  - Available Colors: Black, Silver-Gold
  - Supported Formats: CD, CD-R/RW, WAV, MP3, AAC, WMA, FLAC, ALAC, AIFF, DSD
  - Warranty: 3 years
