description: >
  Whatever creative direction your music takes you in, this controller will help you master it. Hugely expressive piano-weighted keybed, high quality build, amazing integration with a top-notch software collection, KeyLab MkII has it all.
details: |-
  The keylab 88 mkii is an 88-key piano-weighted MIDI and modular controller designed for composers, producers, engineers, and session players. It features an authentic grand piano feel enabled by the fatar tp100lr hammer-action keybed with aftertouch, combined with arturia's keyboard layout and design. The controller captures every nuance of performance through velocity and pressure-sensitive keys, making it suitable for both studio and stage use with robust, tour-ready construction.

  The keyboard includes 16 rgb-backlit performance pads for selecting mapping options and triggering chords, along with a comprehensive control bank featuring 9 faders and 9 rotary knobs. A twin-line LCD display and jog wheel enable easy navigation of sounds and parameters, while dedicated controls allow quick MIDI channel changes, note bending, modulation, and transposition by semitones or full octaves. The interface supports mcu/hui protocol for intuitive recording software control and includes smart-mapping that automatically assigns controls to appropriate parameters in arturia software instruments.

  Connectivity options include 4 CV/gate outputs for controlling modular equipment and vintage synths, MIDI ports, MIDI over USB, and multiple pedal inputs for expression, sustain, and three assignable auxiliary functions. The controller is bus-powered and class-compliant, drawing all power via USB connection without requiring external power. It features seamless integration with all arturia software instruments and includes presets for multiple daws with magnetic overlays for easy control identification.

  The included software bundle provides comprehensive sound design and production capabilities. Analog lab v offers instant access to over 7,000 world-class keyboard, synth, piano, and organ sounds with smart-mapping that matches keylab controls. Ableton live lite enables recording, layering, editing, and exporting of tracks with performance controls for stage use. Piano v provides twelve meticulously crafted world-class pianos using physical modeling technology, while wurli v recreates the classic stage tine keyboard with presets modeled on famous songs. Vox continental v delivers stage keyboard sounds with amp simulations inspired by classic recordings.

  Optional wooden legs constructed from solid ash with a cinnamon finish provide professional ergonomic support for studio and stage environments. The legs are adjustable to accommodate uneven surfaces, built to optimal height for comfortable extended performance, and mount securely with quick setup and removal. An included upright stand accommodates sheet music, gig notes, tablets, or phones while maintaining audience visibility. The controller is compatible with all major digital audio workstations including pro tools, logic pro x, fl studio, bitwig, cubase, ableton live, digital performer, and studio one.
