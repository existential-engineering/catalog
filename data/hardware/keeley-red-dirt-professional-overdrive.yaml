description: Professional, or Pro-Modified Red Dirt Overdrive. Upgraded with a
  Burr Brown IC and LED's in the clipping stage. Fat Tube Sound – Exactly Like
  John Petrucci's custom made unit.
details: |-
  A limited run of the Red Dirt Overdrive built to the specification of a modified pair made for a touring player a year earlier. The Professional version swaps in a Burr Brown integrated circuit for lower background noise and uses a particular mixture of clipping LEDs in place of the standard clipping stage.

  Compared with the standard Red Dirt Overdrive, the Professional is described as fatter and more tube-like, with higher output volume, bolder and rounder clipping and a fuller frequency response. The run was limited to 25 units, each hand signed and numbered by Robert Keeley.

  The Red Dirt line began as a search for a classic drive sound with more versatility, combining the earlier Mod Plus and Baked modified-pedal circuits with refinements from Keeley's custom pedal line. A Keeley-designed FET input stage gives it a tube-like breakup, dynamic response and enough clarity to cut through a dense mix while keeping a full midrange. Units are hand-built in the USA with premium components.
