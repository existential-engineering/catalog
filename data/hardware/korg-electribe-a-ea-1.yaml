description: >-
  The Korg ElecTribe A is a compact analog modeling synth box with a built-in
  step sequencer, designed for hands-on creation of aggressive bass, lead, and
  sound effect patterns through intuitive knob-per-function controls.
details: |-
  Released in 1999, the ElecTribe A (EA-1) was part of Korg's groundbreaking ElecTribe series that brought affordable, hands-on electronic music production to a wide audience. While its siblings focused on drums and sampling, the EA-1 concentrated on analog modeling synthesis with an interface that prioritized immediate, tactile sound design.

  The synthesis engine provides two voices with sawtooth, square, triangle, and external audio input as source waveforms. A resonant low-pass filter with external input capability shapes the tone, while built-in distortion, tempo-synced delay, and chorus/flanger effects add character and movement. Every parameter change through the knobs is reflected immediately in the sound, encouraging experimental tweaking.

  The built-in sequencer supports 64-step patterns with motion sequencing, which records knob movements as part of the pattern for evolving, animated sounds. Pattern memory holds 256 patterns and 16 songs, providing ample storage for live performance sets. Volume dynamics and filter frequencies can be continuously modified during playback using the front panel controls.

  Notable users of the ElecTribe A include Orbital, Crystal Distortion, and Cirrus, who appreciated its ability to generate fat analog-style bass and aggressive lead sounds in a portable, performance-ready format.
specs: |-
  - Polyphony: 2 voices
  - Analog modeling synthesis
  - Waveforms: Sawtooth, Square, Triangle, External audio input
  - 1 resonant low-pass filter with external input
  - Effects: Distortion, Tempo delay, Chorus/Flanger
  - 16 touch pads
  - Pattern sequencer: 64 steps with motion sequence
  - 256 patterns, 16 songs
  - Song sequencer: 256 patterns per song, 65,500 events
  - MIDI (2 parts)
  - No keyboard
