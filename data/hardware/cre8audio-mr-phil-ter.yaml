description: Mr. Phil Ter is a Eurorack module that combines an envelope
  generator, VCA, and a transistor ladder filter in a compact footprint.
details: |-
  Mr. Phil Ter, or Phil as it's affectionately called, is a module that does a whole bunch of analog and digital stuff, in not a lot of HP.

  Phil's digital bits are solely comprised of the envelope generator. The analog bits, developed in partnership with Pittsburgh Modular Synthesizers, are comprised of a voltage controlled amplifier circuit (VCA) as well as an old-school transistor ladder filter.

  Pair Mr. Phil Ter up with any oscillator or crank up its own filter section's resonance and self-oscillate. It's just what's needed to complete (or not) any synthesizer voice.
specs: |-
  - Width: 12 HP
  - Depth: 26mm
  - Envelope voltage range: 0-10V
  - Gate trigger threshold voltage: +5V
  - Attack, Release, and Decay times: 0-10s (slow), 0-5s (fast)
  - VCA: standard voltage-controlled amplifier circuit
  - Filter: classic low-pass transistor ladder filter design, self-oscillates when resonance is cranked
  - Power draw: 33mA (+12V rail), 22mA (+5V rail), 36mA (-12V rail)
