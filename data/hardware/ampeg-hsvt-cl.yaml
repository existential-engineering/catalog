details: |-
  Designed and assembled in the U.S.A., the Ampeg Heritage SVT-CL features the highest-quality components. At the core of its classic SVT tone is the legendary Ampeg EQ, which offers time-tested flexibility and control. It's our Heritage, but it's your gear—and it has been for more than 60 years.

  The Heritage SVT-CL delivers 300 Watts of all-tube power and is the perfect match for the Heritage SVT-810E cabinet.

  Premium Heritage cosmetics include a black sparkle grille cloth, soft Tolex and trim, and a Heritage black-line face plate.
specs: |-
  - 300 Watts
  - Premium Heritage black sparkle grille cloth, soft Tolex and trim
  - Heritage black-line face plate
  - Perfect match for Heritage SVT-810E
  - 80 lb / 36.3 kg
