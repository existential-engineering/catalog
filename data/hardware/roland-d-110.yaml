description: >-
  The Roland D-110 is a 1U rackmount synthesizer module based on Roland's Linear
  Arithmetic Synthesis (LAS) engine, offering a more affordable alternative to the D-50.
  It features 32-voice polyphony, 9-part multitimbral capability, and six individual
  outputs, making it a versatile studio sound module for the late 1980s.
details: |-
  The D-110 is the rackmount counterpart to Roland's D-10 keyboard synthesizer, representing the second generation of D-50 style Linear Arithmetic Synthesis technology. Released in 1988, it brought Roland's acclaimed LAS engine into a compact 1U rack format, making it accessible to studio musicians who needed high-quality digital sounds without a full keyboard.

    The synthesis architecture is built around tones, partials, and timbres, allowing for complex sound design that blends sampled PCM waveforms with synthesized components. While the editing process demands significant technical knowledge, skilled programmers can achieve interesting and unique results that go well beyond the factory presets.

    The D-110 includes 128 internal patches, 128 external patches, and 64 performances, along with onboard drum sounds comprising 63 different samples organized into one kit. Built-in reverb with 8 effect types rounds out the feature set. Its 9-part multitimbral architecture and six individual audio outputs make it particularly well-suited for MIDI-driven studio production.

    Notable artists who have used the D-110 and its siblings include Suzanne Vega, Future Sound of London, and Information Society.
specs: |-
  - 32-voice polyphony
    - Linear Arithmetic Synthesis (LAS) with ROM samples
    - 9-part multitimbral
    - 128 internal patches, 128 external patches, 64 performances
    - 1 drum kit with 63 drum sounds
    - 8 built-in reverb/effect types
    - 6 individual audio outputs
    - MIDI control
    - 1U rackmount format
