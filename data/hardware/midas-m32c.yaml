description: "Digital rack mixer for installed and live sound applications. The
  40-input, 25-bus M32C packs the audio engine of the flagship M32 Digital
  Mixing Console into a 1U aluminium-and-steel rack-mount form factor. Onboard
  connectivity includes dual AES50 network ports (Klark Teknik SuperMAC,
  CAT5/RJ45) supporting up to 96 inputs and 96 outputs over shielded (STP) CAT5;
  a 16-channel ULTRANET output to P16 personal monitor mixers; USB 2.0
  connectivity for 32 x 32 channels of audio and 16 channels of MIDI; native
  Ethernet remote control; MIDI; and an expansion slot for optional DN32 series
  cards (DN32-USB, DN32-ADAT, DN32-MADI, DN32-DANTE). The console provides 8 DCA
  groups, 6 mute groups, 8 stereo effects engines (including LA, Ultimo and Fair
  Compressors; XTEC EQ1/EQ5; Sub Octaver, Edison EX1, Sound Maximizer; Vintage
  Room/Plate/Hall/Vintage/Rich reverbs; Flanger & Delay; Wave Designer; Stereo
  Precision Limiter; De-Esser; Chorus & Chamber; Modulation Delay) and a
  100-band Real-Time Analyzer (via M32-EDIT). M32C operates at 48 kHz with
  24-bit signal transmission and 0.8 ms console latency, and integrates with
  DL16 stage boxes (up to three daisy-chained per AES50 port) and Turbosound iQ
  speakers (Acoustic Integration over ULTRANET). Remote control is supported via
  M32-EDIT (PC/Mac/Linux), M32-MIX (iPad) and M32-Q (iOS/Android) apps."
details: |-
  The Midas M32C is a 1U rack-mount digital mixer that ports the audio engine of the flagship M32 Digital Mixing Console into an installed-sound and live-sound form factor. It provides 40 input channels and 25 mix buses, 8 DCA groups, 6 mute groups, 8 stereo effects engines and a 100-band Real-Time Analyzer (visualised in the M32-EDIT application), all running at 48 kHz with 24-bit signal transmission and 0.8 ms console latency.

  M32C has no integrated control surface; it is controlled remotely via Ethernet (wired or wireless via an external router) using the free M32-EDIT (PC/Mac/Linux) editor, the M32-MIX iPad app and the M32-Q personal monitoring app (iOS and Android). The M32-MIX iPad app exposes all 32 mic inputs, 8 aux inputs, 16 buses, FX stereo returns and Matrix/Main/DCA levels, and supports Sends on Faders for 16 independent monitor mixes. M32-Q assigns inputs to 4 MCA (Mix Control Association) controls per performer.

  Analogue I/O is provided remotely via Klark Teknik DL16 (or Midas DL150) stage boxes, connecting over a single shielded (STP) CAT5 cable to either of the M32C's dual AES50 network ports. Each DL16 contributes 16 remotely controllable Midas mic preamps and 8 analogue balanced XLR returns, and up to three DL16/DL150 boxes can be daisy-chained per AES50 port for a maximum of 96 inputs and 48 outputs across both ports.

  The ULTRANET bus carries a 16-channel digital monitor mix over a single shielded CAT5 cable to P16 Personal Monitor Mixers (up to 64 individual P16-M units via daisy-chain and P16-D distributors) and to Turbosound iQ speakers for 'Acoustic Integration' with true physical-modelling preset control. USB 2.0 delivers 32 x 32 channels of audio and 16 channels of MIDI to a DAW; MIDI and Ethernet are also standard features.

  An expansion slot accepts the DN32 series cards: DN32-USB (32 x 32 audio + 16 MIDI, 400 Mbit/s), DN32-ADAT (32 channels ADAT over 8 Toslink, BNC word-clock in/out, 24-bit / 44.1/48 kHz), DN32-MADI (optical SC + dual BNC, up to 500 m fibre / 100 m coaxial) and DN32-DANTE (32-channel Dante over Gigabit Ethernet, configured via Audinate's Dante Controller).

  Effects modelling includes the LA Compressor (Teletronix LA-2A-inspired), Ultimo Compressor (UREI 1176LN-inspired), Fair Compressor (Fairchild 670-inspired), Combinator 5-band compressor, XTEC EQ1 and EQ5 (Pultec EQP-1a and MEQ5-inspired parametric EQs), Sub Octaver, Edison EX1 stereo-field tool, Sound Maximizer (Sonic Maximizer-inspired), Dimensional Chorus, Modulation Delay, multiple reverbs (Vintage Room, Plate, Hall, Vintage, Rich variants), Flanger & Delay, Wave Designer (SPL Transient Designer-inspired), Stereo Precision Limiter (Sony Oxford Dynamics-inspired), De-Esser and a Chorus & Chamber combination effect. A TruEQ Stereo GEQ provides up to 16 mono graphic EQs whose filter bands can be driven from external motorised faders.
specs: |-
  - Input Channels: 40
  - Mix Buses: 25
  - DCA Groups: 8
  - Mute Groups: 6
  - Stereo Effects Engines: 8
  - Real Time Analyzer: 100-band (via M32-EDIT)
  - Sample Rate: 48 kHz
  - Signal Transmission: 24-bit
  - Console Latency: 0.8 ms
  - Form Factor: 1U rack-mount, aluminium and steel
  - AES50 Ports (Klark Teknik SuperMAC): 2 (dual)
  - AES50 Capacity: Up to 96 inputs and 96 outputs (48 channels per port @ 48 kHz)
  - ULTRANET Output: 16-channel digital mix to P16 Personal Monitor Mixers (single shielded CAT5)
  - USB 2.0: 32 x 32 channels of audio, 16 channels of MIDI
  - Ethernet: Native (for M32-EDIT, M32-MIX, M32-Q remote control)
  - Expansion Slot: 1 (compatible with DN32-USB, DN32-ADAT, DN32-MADI, DN32-DANTE)
  - DN32-USB: 32 x 32 channels of audio and 16 channels of MIDI I/O, 400 Mbit/s throughput
  - DN32-ADAT: 32 channels of ADAT over 8 fibre-optic Toslink connectors; BNC word-clock in/out; 24-bit, 44.1/48 kHz
  - DN32-MADI: Optical SC and dual BNC; up to 500 m fibre / 100 m coaxial
  - DN32-DANTE: 32-channel Dante over Gigabit Ethernet
  - Stage Box Compatibility: DL16 / DL150 (up to 3 daisy-chained per AES50 port = 48 in / 24 out)
  - P16-M Capacity: Up to 64 individual P16-M units via daisy-chain and P16-D distributors
