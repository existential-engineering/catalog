description: >-
  The Kawai KC20 is a lightweight, GM-compatible 61-key synthesizer from 1993 designed as an
  affordable portable keyboard with Compose and Performance modes and a direct serial computer
  interface.
details: |-
  Released in 1993, the Kawai KC20 was designed to fill the need for an affordable, lightweight synthesizer with a full 61-key keyboard. Its General MIDI compatibility made it suitable as a sound source for computer music applications, and a direct serial interface on the rear panel supports connections to Macintosh, IBM PC/AT, and NEC PC-98 computers.

  In Compose mode, the KC20 offers up to 28-voice polyphony across 16 parts including drum sections, using a multi-timbral voice allocation system for independent play of all parts. Performance mode provides eight banks of eight patches for a total of 64 storable patches, allowing frequently used settings to be recalled instantly during live performance.

  The keyboard features a compact 20cm depth while maintaining full-sized keys across 61 notes. Kawai included 160 high-quality tones and seven drum kits, processed through an 18-bit digital-to-analog converter. Two oscillators and an LFO with saw up, square, and triangle waveforms provide the sound generation, shaped by two VCA envelopes with attack, decay, and release stages.

  The front panel follows a standard layout with pitch bend and modulation wheels on the left and a volume slider up top. A 16-character, 2-line LCD displays settings and operations. The KC20 was a decent all-round keyboard for its time, offering portability and a direct PC interface without excelling in any particular sonic area.
specs: |-
  - Polyphony: 20 voices (8 drums)
  - Multitimbral: 16 parts
  - Oscillators: 2
  - Waveforms: ROM
  - LFO: 1 with Saw Up, Square, Triangle
  - VCA: 2 with Attack, Decay, Release
  - Effects: None listed
  - Keyboard: 61 non-weighted keys
  - Memory: 64 patches (RAM), 16 patches (ROM)
  - Demo Songs: 3
  - Control: MIDI In/Out/Thru, Serial interface (Mac/PC/NEC)
