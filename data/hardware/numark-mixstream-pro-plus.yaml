name: Mixstream Pro +
manufacturer: numark
primaryCategory: control-surface
categories:
  - midi-controller
url: https://www.numark.com/product/mixstream-pro-plus
description: Standalone Streaming DJ Controller with Amazon Music. A laptop-free
  DJ controller integrating streaming services with built-in speakers and smart
  lighting control.
details: |-
  The Mixstream Pro + is a standalone streaming DJ controller that puts millions of tracks at your fingertips through integration with Apple Music, Amazon Music Unlimited, and other streaming platforms offering over 100 million CD-quality (aka 'lossless') songs. Wi-Fi connectivity with rapid onboard song analysis enables continuous playback during performances.

  Features a 7-inch multi-gesture HD touchscreen, 6-inch capacitive-touch scratch wheels with Smart Scratch, 8 dual-layer performance pads, 4 effects (Echo, Flanger, Delay, Phaser) with toggle switches, large filter knobs, 3-band EQ per deck, and built-in monitor speakers with dedicated volume control.

  Runs the Engine DJ embedded OS in standalone mode and is also compatible with Serato DJ Lite, Serato DJ Pro, and Virtual DJ in computer mode. Includes Engine Lighting control for Philips Hue and Nanoleaf smart lighting, plus SoundSwitch integration for DMX lighting.

  Supports streaming from Amazon Music Unlimited, Apple Music, TIDAL, Beatport, Beatsource, SoundCloud Go+, and Dropbox.
