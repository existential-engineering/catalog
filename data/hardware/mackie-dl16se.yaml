id: inBRybfS8WU5LC69fSQGk
name: DL16SE
manufacturer: mackie
primaryCategory: mixer
categories:
  - rack-mount
  - audio-interface
url: https://mackie.com/en/products/mixers/dl-series/DL16SE.html
description: "16-Channel Digital Rack Mixer with legendary Onyx+ mic preamps in
  a stage-friendly, rack-mountable design, controlled wirelessly via the Master
  Fader SE app."
details: |-
  The Mackie DL16SE digital mixer delivers proven mixing power with legendary Onyx+ mic preamps in a stage-friendly, rack-mountable design made to withstand real-world abuse. Connect to your wireless router and get mixing quickly with the industry-leading, multi-platform Master Fader SE app. Create stunning multitrack recordings and get playback for a virtual soundcheck via USB I/O. Loaded with per-channel and output DSP plus 4 FX processors, DL16SE gives you all the mixing power you need for proven professional sound.
specs: |-
  - 16 total inputs with Onyx+ preamps
  - 8 XLR inputs, 8 XLR/TRS combo inputs (2 Hi-Z)
  - 8 XLR outputs plus headphone output
  - 4-band parametric EQ per channel/output with HPF/LPF
  - 4 stereo FX processors
  - 16x16 USB audio interface
  - Wireless router connection via Ethernet
  - 6 VCAs and 6 mute groups
  - 6 stereo subgroups
  - Waveform OEM software included
