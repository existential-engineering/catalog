description: >-
  The DrumTraks is a programmable drum machine from Sequential Circuits
  featuring thirteen digital drum sounds with individual tuning and level
  control. It offers extensive pattern editing with copy and paste capability,
  six individual outputs, and full MIDI implementation, making it a versatile
  rhythm tool from the 1984 era. Notable users include Orbital, Freddy Fresh,
  and Prince.
details: |-
  The DrumTraks is a classic programmable drum machine released by Sequential Circuits in 1984. It features thirteen drum sounds including kick, snare, toms, hi-hats, and cymbals, all with programmable tuning and level control. While its electronic drum kit sounds may not be as widely celebrated as those of the Roland TR-909 or TR-808, the DrumTraks surpasses them with superior editing capabilities.

  Programming is straightforward: record patterns and link them into songs. The unit provides a mixer section for individual sounds, six individual outputs, one mono mix output, and cassette in/out for offline memory storage. The DrumTraks can output a 24 PPQN clock signal and is fully MIDI capable, making it easy to integrate with both vintage analog gear and modern MIDI synths and sequencers.
specs: |-
  - Polyphony: 12 voices
  - Sounds: 13 tones (kick, snare, toms, hi-hats, cymbals)
  - Patterns: 100
  - Songs: 100 (3300 note capacity)
  - Controls: 13 trigger buttons
  - Effects: None
  - MIDI: IN/OUT
  - Clock: 24 PPQN output
  - Footswitch: Run/Stop, Next/Repeat
  - Storage: Cassette IN/OUT
  - Outputs: 6 individual + 1 mono mix
