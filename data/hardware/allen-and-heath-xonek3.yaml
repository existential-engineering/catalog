description: Xone:K3 is a professional MIDI controller designed for DJs,
  producers, and performers who need ultimate hands-on control of their setup.
details:
  - Xone:K3 is a professional MIDI controller designed for DJs, producers, and
    performers who need the ultimate in hands-on control of their software and
    hardware setups.
  - Whether you're mapping for a live performance or fine-tuning your studio
    setup, Xone:K3 gives you complete control of your software and hardware
    environment.
  - "Unmatched Features in a Compact Format — Xone:K3 offers an unrivalled
    combination of tactile controls in a single unit: faders for smooth
    transitions, encoders and pots for precision control of all parameter types,
    and responsive backlit buttons for performance or cueing. With 52 physical
    controls and 3 fully independent layers, you can assign up to 174 individual
    MIDI parameters, perfect for complex hybrid or live setups."
  - Housed in a durable diecast metal chassis, Xone:K3 is built for real-world
    use. Nutted pots, tactile buttons, and solid construction make it road-ready
    and reliable, while the slim form factor fits neatly alongside mixers in
    club or studio setups.
  - The Xone:K3 features both USB-C and X:Link connectivity, making it
    compatible with Xone mixers including the Xone:96, PX5, 43C, and 23C.
    Support for star-topology setups means multiple K3 units can be connected,
    recognised independently by your software, and named for simple control
    across larger setups.
  - "Class Compliant. Simple Setup — as a class-compliant USB MIDI device, K3
    requires no drivers and works with any system supporting MIDI control:
    macOS, Windows, iOS, and Android."
