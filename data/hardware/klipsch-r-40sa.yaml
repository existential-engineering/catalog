description: The R-40SA is a Dolby Atmos-enabled elevation/surround speaker that
  can be added to any monitor or tower speaker or used standalone as a surround
  speaker. It features a 90° × 90° Tractrix Horn, 1" LTS aluminum tweeter, and a
  4" spun-copper TCP woofer in an acoustic suspension MDF cabinet.
details: |-
  The R-40SA uses Klipsch's exclusive 90° × 90° Tractrix horn technology with increased outer horn dimensions for directivity control over a larger bandwidth of frequencies, resulting in improved high-frequency directivity and a more accurate sound stage.

  The Linear Travel Suspension (LTS) aluminum tweeter with Kapton suspension minimizes distortion for enhanced, detailed performances. Aluminum provides high efficiency and improved resolution and detail.

  The 4" spun-copper Thermoformed Crystalline Polymer (TCP) woofer uses trickle-down technology from the Reference Premiere series, with steeper cone angles for a smoother response and improved accuracy. Additional ribbing increases rigidity for less cone breakup at higher frequencies.

  The MDF cabinet features reinforced 3/4" construction with an all-new bracing design to reduce cabinet vibration for less audible coloration and improved sonic accuracy. Hidden fasteners, edge-to-edge horn design, and low-profile magnetic grilles give the speaker a polished, modern appearance. Jumper wires are included for easy Dolby Atmos connection to compatible Klipsch floorstanding speakers.
