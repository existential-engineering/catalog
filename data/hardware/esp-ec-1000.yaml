description: Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the EC-1000 Pearl White will gleam in the spotlight with its brilliant finish and high-contrast single-ply black binding.
details: |-
  Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the EC-1000 Pearl White will gleam in the spotlight with its brilliant finish and high-contrast single-ply black binding. This guitar is built with set-thru construction at traditional 24.75” scale, with unobstructed access to the highest frets. The EC-1000 Pearl White includes a mahogany body, a three-piece mahogany neck, a matching-finish headstock, and a Macassar ebony fingerboard with 24 extra-jumbo stainless steel frets. Components on the EC-1000 Pearl White include chrome hardware, a TonePros locking TOM-style bridge and tailpiece, LTD locking tuners, and a set of direct-mounted Fishman Fluence Modern 3-Voice Humbucker with brushed stainless covers — ceramic in the bridge, and alnico in the neck. Push-pull controls allow for selection of these innovative pickups’ multiple voices.
specs: |-
  - Construction: Set-Thru
  - Scale: 24.75"
  - Body: Mahogany
  - Neck: 3Pc Mahogany
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 350mm
  - Finish: Pearl White
  - Nut Width: 42mm
  - Nut Type: Molded
  - Neck Contour: Thin U
  - Frets/Type: 24 XJ Stainless Steel
  - Hardware Color: Chrome
  - Strap Button: Standard
  - Tuners: LTD Locking
  - Bridge: TonePros Locking TOM & Tailpiece
  - Bridge PU: Fishman Fluence Modern 3-Voice Humbucker Ceramic Brushed Stainless Direct-Mount *(Pull Neck Volume for Voice 3 / Pull Tone for Voice 2)
  - Neck PU: Fishman Fluence Modern 3-Voice Humbucker Alnico Brushed Stainless Direct-Mount *(Pull Neck Volume for Voice 3 / Pull Tone for Voice 2)
  - Electronics Layout: Volume/Volume(Push/Pull)/Tone(Push/Pull)/Toggle Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
  - Case: EC GUITAR FORM FIT CASE
  - Case Included: N
