description: From basslines and rave sounds to massive drones.
details: |-
  From basslines and rave sounds to massive drones and drums, the Erica Synths Bassline DB-01 synthesizer lets the player explore new territories of sound and performance techniques and go from a melody to noise and back in no time.

  The DB-01 packs an analogue Erica Synths signature sound engine with an advanced sequencer on top of it. The engine is fully analogue, built around an aggressive acidbox filter design, a one knob overdrive for even more destructive sound, a transistor based sub-oscillator and a noise source.

  Independent amplitude, filter cutoff and pitch envelopes shape the voice, a BBD based detune delivers a massive swarm sound, and a syncable LFO with multiple waveforms handles FM and VCF modulation.

  The sequencer is intuitive and easy to use, running patterns of up to 64 steps with sequence transposing, pattern randomization, an arpeggiator and a modulation track with VCF cutoff automation. Built in and user defined scales open up micro tonal possibilities, and 8 banks of 16 patterns hold the results.

  Analogue clock in and out, CV/Gate input and output, and MIDI IN and THRU for playing the instrument from a keyboard all sit on a compact, durable aluminium enclosure.
specs: |-
  - All analogue sound engine
  - Aggressive acidbox filter design
  - One knob overdrive for even more destructive sound
  - Transistor based sub-oscillator
  - Independent amplitude, filter cutoff and pitch envelopes
  - BBD based detune for massive swarm sound
  - Syncable LFO with multiple waveforms for FM and VCF modulation
  - Noise source
  - Intuitive, easy to use sequencer for up to 64 step patterns
  - Sequence transposing
