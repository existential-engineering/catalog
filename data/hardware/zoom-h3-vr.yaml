description: The Zoom H3-VR virtual reality audio recorder is the complete
  solution for capturing and processing spatial audio for VR, AR and
  mixed-reality content. With a built-in Ambisonic mic, recorder and decoder,
  the H3-VR puts 360-audio in the palm of your hand.
details: |-
  The Zoom H3-VR virtual reality audio recorder is a complete solution for capturing and processing spatial audio for VR, AR and mixed-reality content. With a built-in Ambisonic mic, recorder and decoder, it puts 360-audio in the palm of your hand. In the past, capturing VR audio required a dedicated Ambisonic mic, a separate recorder and a computer for encoding the audio from raw Ambisonics A format to VR-ready Ambisonics B format. With the H3-VR all of the encoding and decoding is done on board.

  The 4-capsule Ambisonic mic captures 360-degree recordings up to 24 bit/96 kHz, and the onboard decoder exports Ambisonics B-format files directly without ever connecting to a computer. The H3-VR also records stereo binaural WAV files up to 24 bit/48 kHz for a spatial recording that enhances 2D productions with 3D audio, and offers standard stereo recording for material that will be played out of speakers rather than headphones.

  Auto Mic Position and Level Detection, driven by a 6-axis motion sensor, make placing the H3-VR simple. Whether positioned upright, upside down, endfire or endfire inverted, the recorder automatically calibrates so audio and video are already aligned for post. Audio can be monitored live in stereo binaural, or the onboard Ambisonics decoding can simulate the recorded 360-experience during playback.

  The audio interface mode turns the H3-VR into a USB 360 mic for a computer or a stereo mic for an iOS device, suited to live streaming, video conferencing and direct recording. In conference mode the Ambisonic mic dynamically detects the direction of the voice from each speaker's position, making it easier to hear all participants with a minimal amount of ambient noise. The H3 Control App gives remote access to transport controls, level settings and metadata notes from an iOS device with the optional BTA-1 adapter.

  The compact conical design captures audio from multiple angles without getting in the way of the camera or the action, and the unit weighs 120 g. Two AA batteries power it for over 11 hours, and portable USB batteries or an AC adapter extend longer shoots. The companion ZOOM Ambisonics Player software converts Ambisonics files to stereo, binaural, 5.1ch surround and more, and can play, trim, re-orientate and export them. The box contains the H3-VR Handy Recorder, a foam windscreen and a dual mounting bracket.
specs: |-
  - Built-in Ambisonic mic: 4 matched unidirectional condenser mics, maximum sound pressure input 120 dB SPL, mic gain +18 to +48 dB
  - Recording formats: Ambisonics A, Ambisonics B (FuMa/AmbiX), WAV 4ch poly (BWF and iXML) at 44.1/48/96 kHz, 16-bit or 24-bit
  - Stereo: WAV stereo (BWF and iXML) at 44.1/48/96 kHz, 16-bit or 24-bit
  - Binaural: WAV stereo (BWF and iXML) at 44.1/48 kHz, 16-bit or 24-bit
  - Three recording modes: Ambisonics, Stereo Binaural or Standard Stereo
  - LINE OUT: 3.5 mm stereo mini connector, maximum output level -10 dBu (1 kHz, 10 kohm load)
  - PHONE OUT: 3.5 mm stereo mini connector, maximum output level 20 mW + 20 mW into 32 ohm load
  - USB: microUSB connector, mass storage operation USB 2.0 High Speed, audio interface 2 in/2 out (stereo/binaural) at USB 2.0 Full Speed 44.1/48 kHz 16-bit, or 4 in/2 out (Ambisonics A/FuMa/AmbiX) at USB 2.0 High Speed 44.1/48 kHz 24-bit
  - Recording media: microSD/microSDHC/microSDXC cards, Class 4 or higher, up to 1 TB
  - Display: 1.25 inch monochrome LCD, 96 x 64, directionally responsive
  - Motion sensor: 6 axes (3-axis gyro, 3-axis acceleration), Auto Mic Position Detection for upfront, endfire, upside-down and endfire inverted placement
  - Single-knob MIC GAIN control adjusts all four capsules simultaneously, separate LINE OUT and headphone volume controls
  - Onboard limiter, adjustable low cut filter, slate tone and sound marker, precise internal clock
  - Wireless iOS remote control through the optional BTA-1 Bluetooth adapter and the H3 Control app
  - Power: 2 AA batteries (alkaline, rechargeable NiMH or lithium), ZOOM AD-17 AC adapter (DC 5 V/1 A), or USB bus power
  - Estimated continuous recording time at 48 kHz/24-bit FuMa Rec Mode: about 11.5 hours (alkaline), about 11.5 hours (NiMH 1900 mAh), about 24 hours (lithium)
  - External dimensions: 76 mm (W) x 78 mm (D) x 123 mm (H), weight 120 g, main unit only
  - Included: H3-VR Handy Recorder, foam windscreen, dual mounting bracket
