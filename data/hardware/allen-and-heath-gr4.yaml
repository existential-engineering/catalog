description: GR4 is a 1U rack-mounting or desktop audio mixer, providing simple
  yet comprehensive control of background music and paging in bars, restaurants,
  stores and other leisure / retail environments.
details:
  - GR4 is a 1U rack-mounting or desktop audio mixer, providing simple yet
    comprehensive control of background music and paging in bars, restaurants,
    stores and other leisure / retail environments.
  - Standout features include optional remote wall plates, a mic input on the
    front panel, plus a 3.5mm jack on the front for portable music sources.
  - "Mic + Line Inputs: Four mic inputs on rear mount Phoenix connectors with
    MIC1 selectable to an optional front mounted XLR. Four stereo inputs on rear
    mount phono connectors. An additional front mounted 3.5mm jack socket
    overrides input 4 phono source."
  - "Zone Outputs: Two stereo (mono selectable via internal jumper) zones on
    rear mount Phoenix connectors. An additional two mono zone outputs are
    available with mix output being selectable from internal jumpers."
  - "Paging + Alarm: Paging and Alarm contact inputs on rear mounted Phoenix
    connectors allow integration with 3rd party paging stations and fire alarm
    systems."
  - "Remote: Remote control can be achieved via PL-14 Remote connected to the
    rear mounted RJ45 or custom/3rd party analogue remotes connected to the rear
    mounted Phoenix connectors."
  - "Configurable Installer Selectable Modes: Primary + Secondary Mic modes are
    perfect for controlling hierarchal microphone feeds such as simple paging
    announcements. Emergency mode is for use with 3rd party systems in emergency
    situations and mutes all inputs except MIC 1 on alarm contact closure.
    Jukebox mode provides a priority line input to the system for pre-recorded
    announcements or programme material such as Sports channels."
  - "PL-14 Compatible: The PL-14 is an 'intelligent' remote controller for use
    with the Allen & Heath GR4 audio zone mixers, providing the non-technical
    operator with local control of music source selection and/or audio level. Up
    to two controllers may be connected, daisy-chained via standard CAT5 cables.
    The optional PL-5 hand held infra-red remote controller adds wireless
    control plus store/recall of up to 4 source/level pre-sets."
