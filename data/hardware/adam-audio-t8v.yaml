description: The ADAM T8V is a two-way studio monitor designed for vertical use in a nearfield application and perfectly suited for use in small control rooms.
details: |-
  The T8V is an affordable, professional 2-way powered studio monitor with an 8˝ woofer and ADAM Audio's latest addition to the T Series. Designed around the same technology, features and build quality as its smaller siblings, the T8V provides best-in-class characteristics and sound performance.

  The T8V impresses with a multitude of features that bring real benefits to the user: The U-ART tweeter's 4:1 velocity transfer ratio, in combination with the new Class D amplifiers' high dynamic range, yield respective max. peak SPL of 118 dB per pair. The tweeter, which extends up to 25 kHz, works as a team with the HPS Waveguide. This allows an optimal radiation of the high frequencies, which means the advantage of a more controlled, larger usable sweet spot during monitoring.

  With a bass extension down to 33 Hz, the T8V is especially suitable for users who produce bass-heavy music. The T8V is the perfect studio speaker for those who have always wanted to work with an 8“ monitor from ADAM Audio, but where budgets have been insufficient.

  The U-ART 1.9” tweeter design is based on that used in the X-ART and S-ART tweeters employed respectively in the AX Series and S Series monitors, and ADAM units use PWM technology for both the amp and the power supply section (no more transformers), combined with state of the art input and filter stages.

  On the rear panel an XLR connector and an RCA jack accept balanced nominal input levels of +4 dBu and unbalanced nominal input levels of -10 dBV, with a two-way switch selecting which connector the input signal is taken from. The monitors adjust automatically to AC mains voltages of 100 to 240 V at 50/60 Hz. A 5-year warranty (2 years plus 3 years optional with product registration) gives users additional security.
specs: |-
  - U-ART 1.9” Accelerated Ribbon Tweeter with HPS Waveguide
  - Polypropylene 8” woofer and rear-firing bass-reflex port
  - Panel: Rear
  - Analog audio input connectors: XLR / RCA
  - Input impedance: 10 kOhm / 20 kOhm
  - Woofer amplifier type: PWM, 70 W RMS
  - Tweeter amplifier type: PWM, 20 W RMS
  - Total RMS amp. power: 90 W
  - Frequency response: 33 Hz – 25 kHz (-6 dB)
  - THD > 80 Hz: 0.5 %
  - Max. SPL per pair at 1 m: ≥118 dB
  - Crossover frequency: 2.6 kHz
  - Woofer basket diameter: 8″
  - Woofer voice coil diameter: 1″
  - Woofer cone material: Polypropylene
  - Tweeter type: U-ART
  - Tweeter diaphragm area: 4 inch² (2420 mm²)
  - Tweeter equiv. diaphragm diameter: 1.9″ (48 mm)
  - Velocity transform ratio: 4 to 1
  - Diaphragm weight: 0.17 g
  - Waveguide: HPS
  - Input sensitivity: -10 to +4 dB
  - Gain: Yes
  - High Shelf EQ > 5 kHz: -2 dB, 0 dB, +2 dB
  - Low Shelf EQ < 300 Hz: -2 dB, 0 dB, +2 dB
  - Max. power consumption: 150 W
  - AC mains input voltage: 100–240 VAC, 50/60 Hz
  - Weight: 21.6 lb (9.8 kg)
  - Height x width x depth: 15.8″ x 9.8″ x 13.2″ (400 mm x 250 mm x 335 mm)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: Power cord, Quick Start Guide
