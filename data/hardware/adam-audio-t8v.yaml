description: The ADAM T8V is a two-way studio monitor designed for vertical use
  in a nearfield application and perfectly suited for use in small control
  rooms.
details: |-
  The ADAM Audio T8V is an affordable, professional 2-way active nearfield studio monitor and the largest member of the T Series. It pairs an 8-inch polypropylene woofer with the U-ART (Unique Accelerated Ribbon Technology) tweeter, delivering the clarity, precision, honesty, and detail ADAM Audio is known for at an accessible price point.

  The U-ART tweeter features a 4:1 velocity transfer ratio and a lightweight 0.17 g diaphragm that extends high-frequency reproduction up to 25 kHz. It works in tandem with the HPS (High-frequency Propagation System) waveguide to control directivity and widen the usable sweet spot, making accurate stereo imaging easier to achieve even in less-than-ideal rooms.

  Each monitor is bi-amplified with new Class D amplifiers: 70 W RMS for the woofer and 20 W RMS for the tweeter, for a total of 90 W RMS. Combined with the U-ART tweeter's high dynamic range, the T8V reaches a maximum peak SPL of 118 dB per pair at 1 m, with low-frequency extension down to 33 Hz (-6 dB) thanks to the 8-inch woofer and rear-firing bass-reflex port.

  The rear panel provides balanced XLR and unbalanced RCA analog inputs, a gain control, and two-position shelving filters for the high (>5 kHz) and low (<300 Hz) bands at -2 dB, 0 dB, or +2 dB to adapt the monitor to its environment. The cabinet shares the build quality and aesthetic of the smaller T Series models, providing best-in-class characteristics at the 8-inch entry point.

  ADAM Audio offers a standard 2-year warranty, extendable to a total of 5 years upon product registration.
specs: |-
  - 2-way active nearfield studio monitor
  - 8" polypropylene cone woofer with 1" voice coil
  - U-ART 1.9" (48 mm) tweeter, 4 sq.in. diaphragm area, 0.17 g diaphragm weight
  - HPS (High-frequency Propagation System) waveguide
  - Frequency response: 33 Hz - 25 kHz (-6 dB)
  - Crossover frequency: 2.6 kHz
  - Max peak SPL per pair @ 1 m: >=118 dB
  - THD > 80 Hz: 0.5%
  - Woofer amplifier: PWM Class D, 70 W RMS
  - Tweeter amplifier: PWM Class D, 20 W RMS
  - Total amplifier power: 90 W RMS
  - Max power consumption: 150 W
  - Analog inputs: XLR (balanced) and RCA (unbalanced)
  - Input impedance: 10 kOhm (XLR), 20 kOhm (RCA)
  - Input sensitivity: -10 to +4 dB
  - Gain control on rear panel
  - High shelf EQ (>5 kHz): -2 dB, 0 dB, +2 dB
  - Low shelf EQ (<300 Hz): -2 dB, 0 dB, +2 dB
  - Rear-firing bass-reflex port
  - Dimensions (H x W x D): 400 x 250 x 335 mm (15.8 x 9.8 x 13.2 in)
  - Weight: 9.8 kg (21.6 lb)
  - Warranty: 5 years (2 years standard + 3 years optional with registration)
