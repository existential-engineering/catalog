description: The ADAM T8V is a two-way studio monitor designed for vertical use in a nearfield application and perfectly suited for use in small control rooms.
details: |-
  The T8V is an affordable, professional 2-way powered studio monitor with an 8˝ woofer and ADAM Audio's latest addition to the T Series. Designed around the same technology, features and build quality as its smaller siblings, the T8V provides best-in-class characteristics and sound performance.

  The T8V impresses with a multitude of features that bring real benefits to the user: The U-ART tweeter's 4:1 velocity transfer ratio, in combination with the new Class D amplifiers' high dynamic range, yield respective max. peak SPL of 118 dB per pair.

  The tweeter, which extends up to 25 kHz, works as a team with the HPS Waveguide. This allows an optimal radiation of the high frequencies, which means the advantage of a more controlled, larger usable sweet spot during monitoring. With a bass extension down to 33 Hz, the T8V is especially suitable for users who produce bass-heavy music.

  The T8V is the perfect studio speaker for those who have always wanted to work with an 8“ monitor from ADAM Audio, but where budgets have been insufficient. The 5-year warranty gives users additional security and the certainty of having purchased a quality product.

  The U-ART 1.9” tweeter design is based on that used in the X-ART and S-ART tweeters employed respectively in the AX Series and S Series monitors. ADAM units use PWM technology for both the amp and the power supply section (i.e. no more transformers) combined with state of the art input and filter stages.
specs: |-
  - U-ART 1.9” Accelerated Ribbon Tweeter with HPS Waveguide
  - Polypropylene 8” woofer and rear-firing bass-reflex port
  - Total RMS Amp. Power: 90 W
  - Frequency Response: 33 Hz – 25 kHz (-6 dB)
  - Max. SPL per pair at 1 m: ≥118 dB
  - THD > 80 Hz: 0.5 %
  - Crossover Frequency: 2.6 kHz
  - Woofer amplifier: PWM, 70 W RMS
  - Tweeter amplifier: PWM, 20 W RMS
  - Woofer: 8″ basket diameter, 1″ voice coil diameter, polypropylene cone material
  - Tweeter: U-ART type, 4 inch² (2420 mm²) diaphragm area, 1.9″ (48 mm) equivalent diaphragm diameter, 4 to 1 velocity transform ratio, 0.17 g diaphragm weight, HPS waveguide
  - Audio input connectors: Analog XLR / RCA. Input impedance 10 kOhm (XLR) / 20 kOhm (RCA)
  - Input sensitivity: -10 to +4 dB
  - Gain control: Yes
  - High Shelf EQ > 5 kHz: -2 dB, 0 dB, +2 dB
  - Low Shelf EQ < 300 Hz: -2 dB, 0 dB, +2 dB
  - Panel: Rear
  - Max. power consumption: 150 W
  - AC mains input voltage: 100 – 240 V AC, 50/60 Hz, 150 W max.
  - Dimensions (H x W x D): 15.8″ x 9.8″ x 13.2″ (400 mm x 250 mm x 335 mm)
  - Weight: 21.6 lb (9.8 kg)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: Power cord, Quick Start Guide
