url: https://www.denondj.com/prime-4-plus.html
description: The world's most powerful, advanced standalone DJ system is now
  better than ever.
details: |-
  The world's most powerful, advanced standalone DJ system is now better than ever with a new refined look, unrivaled streaming music accessibility, new dynamic FX options, 10% larger jog wheel surface, and the ever-expanding performance features of Engine DJ including the industry's first standalone Stem separation.

  Designed for the Working DJ: Made by working DJs, for working DJs. The PRIME 4+ combines the powerful creative possibilities of 4 standalone decks with unmatched professional features and rugged build-quality to ensure solid DJ performances night after night and gig after gig.

  Fuel Your Creativity with Stems: Isolate or remove the vocal, melody, bass, and drums of any track. Pre-render tracks or playlists with Engine DJ Desktop, export to a drive, insert into your PRIME 4+, and enjoy standalone access to high-quality 4-part Stems while performing.

  Handle any Request: With support for more music streaming partners than anyone else on the market, including Apple Music, Amazon Music Unlimited, the PRIME 4+ allows instant access to over 100-million tracks across all genres.

  Expanded Dynamic FX Suite: The PRIME 4+ boasts over 25 fully customizable Main FX and 4 dynamic, knob-controlled Sweep FX so that you can unleash your full creative mixing potential. The expressive Touch FX mode transforms the 10.1" touchscreen into an XY controller that puts live FX manipulation literally at your fingertips.
specs: |-
  - Number of Decks: 4-deck
  - Channels: 4-channel
  - Display: 10.1" HD multi-touch display
  - Compatible Media: USB Flash Drive, SD/SDHC Card
  - Compatible Files: FLAC, ALAC, WAV
  - Jog Wheels: 6" high-resolution capacitive touch
  - Pads: 16 RGB performance pads
  - Effects: 26 Main FX, 4 Sweep FX
  - Mic Inputs: 1 x XLR-1/4" combo
  - Analog Inputs: 2 x Dual RCA Stereo (phono/line), 2 x Dual RCA Stereo (line only)
  - Analog Outputs: 2 x XLR (main L/R), 2 x XLR (zone L/R), 2 x XLR (booth L/R), 1 x Dual RCA
  - USB: 4 x USB Type-A, 1 x USB Type-B
  - Headphones: 1 x 1/8", 1 x 1/4"
  - Other I/O: 1 x Ethernet
  - Features: Built-in Wi-Fi
  - Power Supply: IEC Power Cable
  - Height: 4.08"
  - Width: 28.68"
  - Depth: 19.56"
  - Weight: 21.34 lbs.
