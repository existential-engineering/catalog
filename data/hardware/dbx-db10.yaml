name: db10
manufacturer: dbx
primaryCategory: di-box
url: https://dbxpro.com/en/products/db10
description: The dbx db10 is a passive direct injection box featuring a custom
  mu-metal-shielded transformer, gold-plated Neutrik XLR output, and a 3-way pad
  switch (0/20/40 dB) for handling instrument, line, and speaker-level signals.
  It provides transformer-isolated, balanced XLR output with a parallel thru
  jack for amp connection.
details: |-
  At dbx, when designing direct injection boxes, the goal was to go beyond the standard approach to DI design. The db10 uses a custom dbx mu-metal-shielded audio transformer and high-quality Neutrik connectors to deliver premium performance in a rugged, stackable chassis.

  The db10 accepts instrument, line, and speaker-level signals via its Hi-Z 1/4" input jack, with a parallel thru jack allowing simultaneous connection to an amplifier. A 3-way pad switch (0/20/40 dB) accommodates a wide range of signal levels, while a flat/high-cut filter switch, output polarity invert switch, and ground lift switch provide additional flexibility for eliminating hum and dealing with problem sources.

  The passive transformer-isolated design requires no power, making the db10 reliable and simple to use in any situation. Combined shielding from the cast metal chassis and custom-wound transformer ensures low noise performance. A 4-year warranty and stackable chassis with durable rubber foot complete the package.
specs: |-
  - Input Connectors: 1/4" jack (unbalanced, RF filtered)
  - Output Connectors: XLR male balanced; parallel 1/4" thru jack
  - Input Impedance: 150 kΩ typical
  - Output Impedance: 150 kΩ typical
  - Max Input Level (0 dB pad): +20 dBu
  - Max Input Level (20 dB pad): +40 dBu
  - Max Input Level (40 dB pad): +60 dBu
  - Max Output Level: 0 dBu
  - Frequency Response: 20 Hz – 20 kHz, ±2.5 dB
  - Noise: <-105 dB unweighted, 22 kHz BW
  - THD (20 Hz–20 kHz): <0.01%
  - THD (1 kHz): <0.005%
  - Dimensions: 5.82" L × 5.44" W × 2.20" H (148 × 138 × 56 mm)
  - Weight: 1.4 lbs (0.65 kg)
  - Warranty: 4 years
