description: Sealed type RP stereo headphones with a solid black walnut housing.
  The latest model continuing over 50 years of RP technology evolution,
  delivering dense sound unique to closed-back headphones that contains only the
  original sound.
details: |-
  Configuration: Closed-back, around-ear, planar magnetic headphones in a solid black walnut housing with dual 'Y' detachable cable

  Features:
  - Solid black walnut wood sealed enclosure
  - 4th generation RP planar magnetic driver with optimized magnetic flux distribution
  - Dual 'Y' termination with improved recabling compatibility
  - Thicker, low-resilience around-ear earpads with angled design
  - Optional Toray Ultrasuede earpads available (EX-EP-RP-SUEDE)
  - Optional balanced cable available (ET-RP4.4BL2Y, 4.4mm)
  - Includes 3.5mm to 6.3mm conversion connector and dedicated pouch

  Series: RP Series
