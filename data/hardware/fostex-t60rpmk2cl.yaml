description: Closed-back version of the T60RPmk2 with a solid black walnut
  housing and the 4th generation RP planar magnetic driver. Acoustic tuning that
  maximizes the closed-back design gives the dense sound characteristic of
  sealed headphones for listening.
details: |-
  The T60RPmk2CL is the latest closed-back model of RP technology headphones adopted by professional music studios worldwide, continuing to evolve after more than 50 years since its inception. It features the 4th generation RP driver with planar magnetic driver, uniquely developed and manufactured by Fostex, arranged as a closed-back version of the T60RPmk2 with solid black walnut housing.

  The closed-back design is finished with the beautiful grain and natural texture of solid black walnut wood, giving deep, solid bass and clear, extended highs. Because the housing is solid natural wood, there may be differences in grain, bark, coloration and knots in each housing, which does not affect sound quality.

  The RP technology planar magnetic driver has undergone significant enhancements in its 4th generation. To expand and uniformize the vibration area of the planar diaphragm, the magnets sandwiching the diaphragm have been increased and the printed coil pattern has been redesigned. Renewing the magnetic circuit components and optimizing magnetic flux distribution suppresses unwanted resonance of the diaphragm, achieving sharp response in sound attack and decay.

  Both left and right housings are equipped with 3.5 mm receptacles, adopting a newly developed Y-cable connection. The 2-pole 3.5 mm connector improves recabling compatibility and versatility, and the cable features high-quality OFC conductors. An optional 4.4 mm balanced cable (ET-RP4.4BL2Y) is available.

  The thicker ear pads feature a low-resilience, around-ear type that provides a comfortable fit for long listening sessions, and their angled design enhances sound staging. Optional Toray Ultrasuede ear pads (EX-EP-RP-SUEDE) are also available.
specs: |-
  - Type: Closed, dynamic
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 98 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 360 g (excluding the cable)
  - Housing: Solid black walnut
  - Y-cable connection with 2-pole 3.5 mm connectors on both housings
  - Accessories: Unbalanced cable 3.5 mm (2-pole) x2 to 3.5 mm (3-pole) 2 m x 1, conversion connector 3.5 mm to 6.3 mm x 1, dedicated pouch x 1, safety precautions
  - Optional balanced cable: 4.4 mm ET-RP4.4BL2Y
  - Optional Toray Ultrasuede ear pads: EX-EP-RP-SUEDE
  - Passive wired headphones, no power supply required
  - Series: RP Series
