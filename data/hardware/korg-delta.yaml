description: >-
  The Korg Delta is an analog semi-polyphonic synthesizer that combines a
  dedicated string machine section with a separate synth section. Released in
  1979, it offers a more compact and affordable alternative to Korg's Trident,
  with fully polyphonic 49-key playback and a powerful 24dB/octave filter.
  Notable users include the Human League, Flock of Seagulls, and Ladytron.
details: |-
  The Delta was engineered as a road-ready instrument featuring solid construction with wooden base reinforcement for durability. The synth divides into two independent sections — Strings and Synth — each with dedicated controls and separate audio outputs, enabling creative layering possibilities.

  The String section provides basic but effective tonal qualities with two pitch sliders (16' and 8') alongside Bass and Treble tone controls plus Attack and Release envelope parameters. The Synth section delivers more comprehensive sound-shaping with four pitch sliders (16', 8', 4', and 2'), a white noise generator, and a 24dB/octave low-pass filter with additional high-pass and band-pass options, complemented by full ADSR envelope controls.

  The instrument achieved professional recognition, seeing use by notable acts including the Human League, Flock of Seagulls, and Ladytron. A joystick provides pitch bend and modulation control.
specs: |-
  - Full polyphony (49 notes)
  - 1 VCO with white noise generator
  - 1 LFO (fixed sine waveform)
  - 1 VCF with 24dB/octave low-pass, high-pass, and band-pass modes
  - AR envelope for Strings section; ADSR envelope for Synth section
  - 49-key keyboard
  - Joystick for pitch bend and modulation
  - CV and trigger inputs/outputs
  - No patch memory
  - Production years: 1979–1984
