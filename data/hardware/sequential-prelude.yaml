description: >-
  The Sequential Circuits Prelude is a 4-section orchestral synthesizer
  featuring Piano, Organ, Brass, and String sections with 49-voice polyphony.
  Two sections can be played simultaneously, and the instrument includes an
  on-board chorus/flanger effect and a 7-band equalizer. Its string sounds are
  particularly notable, capable of producing textures beyond traditional
  orchestral tones.
details: |-
  The Prelude was Sequential Circuits' entry into the orchestral synthesizer market, released in 1982. It divides its sound engine into four distinct sections — Piano, Organ, Brass, and Strings — allowing musicians to layer two sections at once for rich, multitimbral performances.

  While the Prelude offers limited editing capabilities and no patch memory storage, it compensates with an intuitive front-panel layout and high-quality built-in effects. The chorus/flanger adds movement and depth to the sound, while the 7-band equalizer provides tonal shaping directly on the instrument.

  The string section is widely regarded as the Prelude's strongest feature, delivering lush and expressive tones that extend well beyond conventional string machine sounds. Among orchestral-type multitimbral synthesizers of its era, the Prelude is considered one of the finest examples of the category.
