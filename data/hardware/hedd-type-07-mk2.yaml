name: TYPE 07 MK2
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-07-mk2
description: HEDD's best-performing 2-way DSP-enabled active monitor, the TYPE
  07 MK2 pairs a hand-built Air Motion Transformer tweeter with Closed or Ported
  operation for realistic upper mids and highs alongside dynamic bass.
details: |-
  The TYPE 07 MK2 combines HEDD's signature Air Motion Transformer tweeter with a 7-inch honeycomb woofer to deliver clear upper midrange and high frequencies alongside a dynamic, controlled bass response. It is aimed at home producers seeking an honest reference and professional studios wanting to enhance their work, and it performs equally well at ear or ceiling level in compact immersive installations.

  A 32-bit SHARC DSP processor drives comprehensive tuning, including the proprietary HEDD Lineariser zero-phase filter for enhanced stereo imaging and depth, plus desktop filtering, hi/lo shelving EQ, and a bass-extension mode adding up to 20% bottom end. All adjustments are made in real time through the free HEDD CTRL software from the listening position.

  Closed or Ported (CoP) functionality lets users switch between two acoustic configurations with a removable POM plug: closed mode prioritizes bass precision and transient response, while ported mode emphasizes bass extension and energy.

  The monitor operates on class D ICEpower amplification at 85-264 V and supports both balanced analog XLR and 2-channel AES/EBU digital connections with daisy-chaining. Each unit is assembled and rigorously tested in Berlin.
specs: |-
  - Configuration: 2-way active nearfield monitor
  - Woofer: 7" honeycomb (1.5" voice coil)
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequency: 2,300 Hz
  - Frequency response: 38 Hz - 40 kHz (LFE mode: 30 Hz - 40 kHz)
  - Maximum SPL: 116 dB per pair at 1 m
  - Amplification: 2 x 100 W ICEpower Class D (85-264 V)
  - DSP: 96 kHz / 32-bit AD/DA converter with 32-bit SHARC processor
  - Features: HEDD Lineariser, CoP, desktop filter, hi/lo shelving, bass-extension mode
  - Dimensions: 370 x 220 x 300 mm
  - Weight: 9.9 kg per unit
