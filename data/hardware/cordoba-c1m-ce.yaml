details: |-
  The Protege by Cordoba C1M-CE is the top choice nylon string guitar for students of all levels and is perfectly suited for both the classroom and home. Comfortable and easy to play, it's a great first guitar at an affordable price. The C1M-CE features a cutaway body shape for easier access to the higher frets and a Fishman Presys VT Pickup System for amplified or acoustic playing. Every Protege C1M-CE is built with a Spruce top, Mahogany back and sides, a comfortable, slim neck profile, traditional mosaic rosette, and a matte polyurethane finish. Like all Cordoba instruments, C1M-CE models feature premium Savarez strings and an adjustable truss rod for lifetime neck stability.
