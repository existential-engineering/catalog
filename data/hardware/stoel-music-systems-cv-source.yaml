description: A Eurorack module providing two adjustable control voltages, each
  with coarse and fine tuning controls spanning over five octaves and a semitone
  respectively.
details: |-
  The Stoel Music Systems CV Source provides two adjustable control voltages, each with a course and fine control. On a 1V/octave scale, the coarse control spans over five octaves, and the fine control spans a semitone plus about 20 cents (120 cents total). All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  4 HP

  Depth
  21 mm

  Current Draw
  +12V: 4mA, -12V: 5mA, +5V: 0mA
specs: |-
