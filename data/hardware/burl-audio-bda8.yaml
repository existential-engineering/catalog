description: "8-channel digital-to-analog converter daughter card for the B80
  and B16 Mothership modular chassis, featuring all-discrete class-A BOPA14
  op-amps with BURL NextGen Analog circuits and Avid delay matching."
details: |-
  The BDA8 is an 8-channel DAC daughter card for the B80 and B16 Mothership modular chassis. It is the result of over 25 years of R&D D/A design experience and thousands of hours of listening tests. Following on the success of the B2 Bomber DAC, the BDA8 utilizes the same digital-to-analog conversion technology as the B2 Bomber DAC coupled with the BURL Audio proprietary BOPA14 discrete, class-A op amp. Now featuring BURL NextGen Analog circuits, the BDA8 includes Avid delay matching, upgraded heat dissipation, and filter select options.
specs: |-
  - 8-channel DAC
  - 8-channel DB25 (DSUB) connectivity
  - All class-A, NextGen Analog BOPA14 op-amps
  - Avid delay matching
  - DAC filter select
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - Frequency response at 96 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -0.3 dB @ 40 kHz
  - Frequency response at 192 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -1.5 dB @ 90 kHz
  - 115 dB Dynamic Range
  - -96 dB THD+N, full scale output = +22 dBU
  - Made in USA
