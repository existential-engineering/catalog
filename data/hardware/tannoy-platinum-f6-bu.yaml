details: |-
  The Tannoy PLATINUM F6 is a 2-way floorstanding dual 6.5" HiFi loudspeaker designed for larger rooms, delivering ultra-low distortion and smooth, articulate sound at high volumes. It features a centrally placed neodymium soft dome tweeter flanked by two paper-cone bass-mid drivers in a rear-ported reflex cabinet with gold-plated binding posts, available in a Butterscotch (BU) finish.
specs: |-
  - frequencyResponse: 40 Hz – 20 kHz (-6 dB)
  - recommendedAmplifierPower: 20 – 150 W
  - powerHandlingIEC: 75 W continuous, 300 W peak
  - sensitivity: 87 dB (1 W @ 1 m)
  - impedance: 8 Ω
  - transducers: 1 x 6.5" (165 mm) LF driver (paper cone), 1 x 6.5" (165 mm) MF driver (paper cone), 1 x 1" (25.4 mm) HF driver (silk dome diaphragm)
  - crossoverType: 3-way
  - crossoverFrequencies: 350 Hz and 2.5 kHz
  - cabinetType: Rear ported reflex
  - connectors: 4 x 4 mm 24 ct Tannoy customized binding posts
  - dimensionsHWD: 1078 x 300 x 235 mm (42.4 x 11.8 x 9.3")
  - netWeight: 17.1 kg (37.7 lbs)
  - construction: 19 mm (3/4") MDF with plywood internal bracing, heavily damped
  - finish: Butterscotch / White / Black finish with high acoustic transparency zipper grille
