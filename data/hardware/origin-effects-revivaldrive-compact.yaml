description: The RevivalDRIVE Compact is all about real amp overdrive. By
  replicating every stage of a valve amp's signal path using all-analogue
  components, with specially designed transistor-based circuitry in place of
  valves, the RevivalDRIVE Compact delivers stunningly realistic tone, feel and
  dynamic response, ranging from clean to fully cranked.
details: |-
  Housing a complete valve amp-style signal path recreated in all-analogue electronics, the RevivalDRIVE Compact accurately reproduces a wide range of classic British and American non-master-volume valve amp tones. A streamlined set of controls makes dialling in your ideal sound easier and more intuitive than ever before, while the powerful Post-Drive EQ lets you adjust the RevivalDRIVE Compact to suit your preferred amp and settings, not the other way around.

  Control preamp voicing, break-up characteristics and low-frequency distortion - all the key components that shape a great amp tone. The MORE PRES control affects negative feedback, letting you adjust breakup characteristics and dynamic response, as well as functioning as a classic presence knob. The HIGHS control allows you to move through the go-to settings of iconic non-master volume amps, while the LOWS control dictates how much low end hits the pedal's recreated push-pull output stage.

  The built-in Post-Drive EQ lets you tailor the output of the pedal to work with just about any amp, as well as flat-response power amps, cabinet simulators and recording interfaces. Housed in a hand polished, brushed stainless steel enclosure and furnished with aluminium controls, Neutrik jack sockets and heavy-duty footswitch.
