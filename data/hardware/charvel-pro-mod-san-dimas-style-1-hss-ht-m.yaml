description: The Pro-Mod San Dimas Style 1 HSS HT M combines modern
  high-performance construction with a versatile HSS pickup configuration and a
  string-through-body hardtail bridge, designed for high-speed playing.
details: |-
  The Pro-Mod San Dimas Style 1 HSS HT M pairs an alder body in a Platinum Pearl gloss finish with a bolt-on maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A maple fingerboard with a 12" to 16" compound radius hosts 22 jumbo frets and black dot inlays, anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length. A heel-mount truss rod adjustment wheel rounds out the neck.

  Electronics are built around an HSS configuration: a Seymour Duncan JB TB-4 humbucker at the bridge paired with Seymour Duncan Custom Flat Strat SSL-6 single-coils in the middle and neck (RWRP) positions, routed through a 5-position blade switch with volume and no-load tone controls. The switching delivers full bridge, bridge inner coil with middle, bridge outer coil with neck, middle with neck, and full neck combinations.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge, Charvel-branded die-cast locking tuning machines, knurled flat-top control knobs, and a Fender standard string guide, all in a chrome finish. The headstock is a licensed Fender Stratocaster shape with a 4-bolt serialized neck plate.
