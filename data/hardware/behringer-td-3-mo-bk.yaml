description: A modded-out take on the ultra-affordable analog bass line
  synthesizer, with a pure analog signal path, authentic VCO, VCF and VCA
  designs and a 16-step sequencer, in a black enclosure. The mod-inspired
  additions include a sub-harmonics oscillator, MIDI CC control of the filter
  cutoff, variable slide time, Accent Sweep and Sweep Speed switching, Filter
  FM, a post-VCA Muffler distortion circuit and overdrive.
details: |-
  Sometime after the release of the original TB-303, creative users realized that there was more to squeeze out of an already amazing bass machine, to produce sounds that were unique to themselves. As word started spreading about third-party mods adding more functions and many more ways to shape sounds, synth-heads around the world wanted to get their hands on a modded TB-303. Now it is a lot easier to get that awesome modded-out sound with the TD-3-MO-BK, an ultra-affordable and faithful homage to the iconic synthesizer that is capable of creating some fiery basslines and much more, now in a sleek black enclosure. With its pure analog signal path, 16-step sequencer and authentic VCO, VCF and VCA filters, the TD-3-MO-BK is sure to become one of your favorite synthesizers.

  Great care has been taken in engineering the TD-3-MO-BK, including the true to the original VCO, VCF and VCA designs and pure analog circuitry with matched transistors. This highly-focused attention to detail is what gives TD-3-MO-BK its ultra-flexible sound shaping capability, which covers a wide spectrum for you to create some super-funky bass lines and pounding rhythms.

  The TD-3-MO-BK includes an ultra-flexible sawtooth and square waveform Voltage Controlled Oscillator (VCO) that can be tuned, shaped and even overdriven just the way you want. The amazing 4-pole low-pass resonant filter has controls for cutoff, resonance, envelope, decay and accent that you can adjust and tweak to add tension and spice to your songs. When you want to go even lower, you can tap the Sub Oscillator button giving you an extra octave, more low end and a deeper sound.

  Because it is a modded out version of the original TD-3, there is a whole plethora of new features such as a MIDI CC controllable filter, variable slide time control, three-mode Sweep Speed switch, Accent Sweep switch and a Soft Attack control. Its default signal routing does not require lifting a single patch cable to instantly create sounds, and the multi-I/O patchbay expands its tone-sculpting capabilities with external devices.

  The onboard sequencer with 7 tracks allows you to program up to 16 steps of notes and rests and save them as a Pattern. You can record, save and recall up to 250 patterns, all of which can be stored in the 4 Groups. Your sequences can be played either in Keyboard mode, where you create and store the pattern, or Step mode which allows you to interact while composing a pattern. The onboard Arpeggiator features wide patterns you can build to provide a virtually-endless array of sound effects.

  While it is a monophonic instrument (one note at a time), TD-3-MO-BK's 16-note Poly Chain function lets you combine multiple synthesizers for up to 16-voice polyphony, plus provides vastly improved reliability and stability over its 1970s and '80s predecessors.
specs: |-
  - Monophonic analog bass line synthesizer with pure analog signal path based on the original VCO, VCF and VCA designs
  - Sawtooth and square waveform VCO with transistor wave-shaping circuitry
  - 4-pole low-pass resonant filter with cutoff, resonance, envelope, decay and accent controls
  - Filter frequency fully controllable via MIDI CC
  - Sub-harmonics oscillator with switchable output level, adding an extra octave below
  - Analog slide circuitry with external slide control and Slide Time control for variable slide time (up to 6 times longer)
  - Sweep Speed switch with 3 accent speed modes (slow, norm, fast)
  - Accent Sweep switch with 3 sweep combinations plus a high resonance mode
  - Filter FM control modulates filter frequency from the audio output of the VCA
  - Muffler circuitry: post-VCA distortion with full bass response
  - Dedicated Accent push button to manually activate the accent
  - Soft Attack control covering a wide range of attack times for non-accented notes
  - Normal and Accent decay controls for non-accented and accented notes
  - Filter Tracking control for filter frequency tracking of the current note
  - Overdrive control
  - 16-step sequencer with 7 tracks, 250 user patterns each, stored across 4 Groups
  - Keyboard mode and Step mode sequencer programming, plus an arpeggiator with wide patterns
  - 16-voice Poly Chain for up to 16-voice polyphony across linked units
  - 15 controls and 33 switches for direct real-time parameter access
  - Premium quality VRs with high resolution and metal shafts
  - MIDI and USB implementation with MIDI channel and Voice Priority selection
  - Multi-I/O patchbay with CV and Gate in/outs, and default signal routing that needs no patch cables
  - Black enclosure
