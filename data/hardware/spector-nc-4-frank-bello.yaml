details: |-
  NC-4 Frank Bello – A bold new design from two of New York's biggest bass icons. Frank Bello, best known as the bassist of New York's legendary thrash metal pioneers Anthrax, has joined forces with Spector basses to develop an all-new instrument. Dubbed the NC-4 Frank Bello, this bass is inspired by both Spector's rich history and iconic American bolt-on bass design. With its refined shape, radiused top, and uniquely contoured neck heel, the NC-4 is a player's dream, offering a nimbler and more playable approach to the classic bolt-on platform. Carefully designed with Frank, his NC-4 showcases a stunning metallic purple finish named Tina Rose, in honor of his mother and grandmother who supported his dream of playing music for a living. Completed with a matching head­stock and complimenting purple acrylic block fingerboard inlays. The NC-4 Frank Bello is crafted from the combination of an Alder body and a 1-piece Maple neck with a Maple fingerboard. When combined, these timeless tonewoods offer the perfect blend of warmth, brightness, and clarity, making it the perfect choice for Frank's massive and memorable bass lines. The neck itself offers a slim, yet comfortable profile modeled after some of Frank's most cherished vintage instruments for a "just right" feel. When it comes to electronics, Frank prefers to keep it simple with his signature EMG P/J set and a straightforward control layout with two volume controls and a master tone control. This effective control set allows players to blend and taper their tone quickly and easily. Finished off with vintage-inspired chrome tuners and a modern fully adjustable bridge, the NC-4 Frank Bello is ready to bring the noise on the world's biggest stages.
