description: >-
  Commercial-grade active 2.0-channel soundbar designed for hospitality
  applications such as hotel guestrooms and cruise ship staterooms, featuring
  front-facing drivers, built-in 20W/ch Class D amplification, and IR learning
  for volume control integration.
details: |-
  The JBL Pro SoundBar PSB-1 is a cost-effective, commercial-grade active soundbar engineered specifically for hospitality environments including hotel guestrooms and cruise ship staterooms. Its all-in-one powered design eliminates the need for a separate subwoofer or external amplifier, simplifying installation and reducing system cost.

  The PSB-1 features four 51mm low-frequency drivers and two 19mm soft-dome tweeters powered by a built-in 20W-per-channel Class D amplifier. Front-facing speaker placement delivers improved audio intelligibility compared to rear- or downward-firing TV speakers, while the frequency range of 42 Hz–20 kHz (-10 dB) provides full-range sound without an external subwoofer.

  A four-position volume-limiting switch allows operators to cap maximum output, and IR learning capability makes the PSB-1 compatible with both fixed and variable volume control schemes used in hospitality AV systems. A lockout plate is included to prevent unauthorized tampering in guest-facing deployments.

  The enclosure is injection-molded ABS in a black finish with metal grillwork for easy cleaning and maintenance. Included mounting brackets support desk or wall installation, and the compact 900mm-wide profile fits beneath most commercial displays.
specs: |-
  - Frequency Range (-10 dB): 42 Hz – 20 kHz
  - Frequency Response (±3 dB): 56 Hz – 20 kHz
  - Max SPL: 90 dB-SPL at 1m
  - HF Drivers: 2 × 19mm soft-dome tweeters
  - LF Drivers: 4 × 51mm low-frequency drivers
  - Amplifier: 20W per channel, Class D
  - Inputs: Stereo RCA
  - Dimensions: 90 × 900 × 65 mm
  - Weight: 1.8 kg (4.0 lbs)
  - Enclosure: Injection-molded ABS, black
