details: |-
  The Bettermaker EQ502P is a 500-series stereo analog Pultec-style equalizer with full digital recall. It features a stereo/dual-mono Pultec section with separate shelf filters, independent boost and attenuation knobs for each band, and 399 preset storage cells.

  The unit offers USB connectivity for DAW integration, enabling use as a hardware plugin controller. A free companion plugin (AU, VST, RTAS, AAX, 32-bit and 64-bit) allows recall and automation of all parameters directly from the DAW environment. Up to 99 units can be controlled simultaneously via the dedicated plugin.

  Steel screen isolators separate the digital and analog signal paths to minimize interference between the control electronics and audio circuitry. A clip detector is included, and the unit is also available as a REMOTE version without a front panel for rack-dense installations.

  The EQ502P is listed in the Legacy section of the Bettermaker website, indicating it has been discontinued. It was manufactured in Warsaw, Poland, and is covered by U.S. Patent No. 10,693,428 B2.
specs: |-
  - Frequency response: 5 Hz to 100 kHz (-0.5 dB)
  - Channels: 2 (stereo / dual mono)
  - Input impedance: 20 kΩ balanced
  - Output impedance: 200 Ω balanced
  - Max input level: +24 dBu balanced / +18 dBu unbalanced
  - Max output level: +24 dBu balanced / +18 dBu unbalanced
  - Low frequency bands: 20, 30, 60, 100 Hz
  - High frequency bands: 3, 4, 5, 6, 10, 12, 16 kHz
  - High cut bands: 5, 10, 20 kHz (6 dB/oct)
  - Preset storage: 399 cells
  - Clip detector included
  - USB connectivity for DAW integration
  - Companion plugin: AU, VST, RTAS, AAX (32-bit and 64-bit)
  - Supports up to 99 units via plugin
  - Weight: 0.5 kg
  - 500-series format
  - U.S. Patent No. 10,693,428 B2
