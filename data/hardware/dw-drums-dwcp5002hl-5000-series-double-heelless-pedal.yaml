description: 5000 Series pedals are now fitted with more features and upgrades than ever before.
details: |-
  An industry standard gets even better. The 5000 Series Bass Drum Pedals established DW's reputation for innovation and quality, and the line has since been re-engineered with a set of major improvements. This model carries a heelless footboard.

  The Tri-Pivot Toe Clamp features three independent, 360-degree, rotating rubber pads that firmly grab almost any diameter and thickness of bass drum hoop, from the top and the bottom, with zero slippage, combined with a textured rubber pad on the base plate.

  A Dual Bearing Spring Rocker makes the pedal quicker and more responsive, and the dual-chain Accelerator drive system uses an eccentric motion that shortens the stroke and increases velocity and sensitivity.

  The pedal keeps aluminum hex shafts, pedal plates and linkages, DW's patented Delta Ball-Bearing Hinge and the Two-Way Beater, and as a 5002 double pedal it incorporates the patented Single Post Casting design, which places the auxiliary bass pedal closer to the hi-hat pedal.
