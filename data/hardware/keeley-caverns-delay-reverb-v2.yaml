details: |-
  The Caverns Delay Reverb v2 is a compact dual-effect pedal that pairs a delay with a reverb and is intended as the end of a pedal chain. It offers 650ms of analog-style tape delay with modulation options alongside spring, shimmer or modulated reverb, and it can be set either to true bypass or to trails, which lets the delay and reverb ring out after the pedal is switched off. The small enclosure suits a fly rig or a board with tight space requirements.

  The reverb side carries three voices. Spring mode is modelled on a blackface amp style spring reverb with F style tremolo, modulation mode adds choral modulation to the reverb for a larger cavernous space, and shimmer mode places the emphasis on octave-up voices in the reverb trails.

  The delay side uses Keeley's Magnetic Echo circuit, which is designed to emulate analog tape delay lines. A three-way switchable modulation adds wow and flutter to the repeats, and the echoes are voiced to sit in a mix either clean or with distortion in front of them.

  The v2 revision opens out the control layout of the earlier Caverns and leaves more space between the footswitches. Jacks are top-mounted for a compact pedalboard layout, and the input and output double as TRS insert points, so two TRS breakout cables allow effects patching or use with a switching system. The pedal is built in the United States.
specs: |-
  - Spring Mode – Blackface Amp style spring reverb with F Style Tremolo
  - Modulation Mode – Choral modulation to the reverb for a huge, cavernous space
  - Shimmer Mode – Reverb with emphasis on octave-up voices in the reverb trails
  - 650ms of delay time, Magnetic Echo analog-style tape delay circuit
  - Three-way switchable delay modulation for wow and flutter
  - Switchable true bypass or trails, with buffered output
  - Top-mounted jacks
  - Input and output double as TRS inserts, for use with two TRS breakout cables
  - Built in the United States
