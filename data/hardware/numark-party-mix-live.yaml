description: An all-in-one DJ controller with built-in stereo speakers and
  synchronized LED light show, designed for newcomers and experienced DJs alike.
details: |-
  Party Mix Live is an all-in-one DJ controller designed for both newcomers and experienced DJs. It combines mixing capabilities with built-in stereo speakers and synchronized LED lighting for parties.

  The controller features large touch-sensitive jog wheels for scratching, four performance pads per deck (Effects, Cue, Loop, Sampler modes), a Sync button for automatic tempo matching, filter effect knobs on each deck, 2-band EQ on each deck, and pitch sliders with pitch-bend via the jog-wheel ring.

  It provides access to streaming platforms including TIDAL, Beatport LINK, Beatsource LINK, and SoundCloud GO, and is compatible with mobile devices via USB camera connection kit. Bundled with Serato DJ Lite, and compatible with Algoriddim djay Pro AI (iOS and desktop), DJ Player Pro (mobile), and Virtual DJ.
specs: |-
  - Built-in LED light show synchronized to music beat
  - Integrated stereo speakers with on/off switch (2 x 2" / 52.5 mm drivers, 5W each, 150 Hz - 20 kHz, 4 Ohm)
  - Access to streaming platforms (TIDAL, Beatport LINK, Beatsource LINK, SoundCloud GO)
  - Large touch-sensitive jog wheels for scratching
  - Four performance pads per deck (Effects, Cue, Loop, Sampler modes)
  - Sync button for automatic tempo matching
  - Filter effect knobs on each deck
  - 2-band EQ on each deck
  - Pitch sliders and pitch-bend via jog-wheel ring
  - Compatible with mobile devices via USB camera connection kit
  - Dimensions: 12.8" x 10.1" x 2.6" (325.5 x 256 x 66.4 mm)
  - Weight: 2.69 lb (1.22 kg)
  - Bundled with Serato DJ Lite
