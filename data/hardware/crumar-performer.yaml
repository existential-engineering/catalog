description: >-
  A fully polyphonic analog strings and brass machine from Italian maker Crumar,
  offering 49 voices of polyphony with dual oscillator strings and
  straightforward slider-based controls.
details: |-
  The Crumar Performer is a dedicated polyphonic analog strings and brass machine produced at the end of the 1970s by the Italian synthesizer company. Despite its compact 49-key format, it is fully polyphonic, meaning all 49 notes can sound simultaneously. The solid black chassis with wood end-cheeks houses a straightforward control layout of 15 sliders and buttons.

  The Strings section is the Performer's strongest suit, employing dual oscillators per voice at 8-foot and 16-foot settings. A simple 3-band equalizer allows tonal shaping from shimmering highs to dark, lush textures. The Brass section is more limited, using a single square wave oscillator with a lowpass filter and resonance control, though it can produce usable brass pad sounds with its attack and decay envelope.

  An LFO with adjustable delay, rate, and depth can be routed to either the VCF or pitch of both sections. The Performer provides three outputs and CV/Gate connections for external integration. Notable users include Duran Duran, who employed its characteristic string sounds in their early work.
specs: |-
  - Polyphony: 49 voices (fully polyphonic)
  - Oscillators: 1 square wave (Brass); 2 per voice at 8' and 16' (Strings)
  - LFO: 1 (delay, rate, depth controls)
  - Filter: Lowpass with resonance (Brass); 3-band EQ (Strings)
  - Envelope: Attack/Decay (Brass); Attack/Sustain (Strings)
  - Keyboard: 49 keys
  - Effects: None
  - Memory: None
  - Control: CV/Gate
releaseDate: "1979"
