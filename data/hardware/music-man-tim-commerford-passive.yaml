details: |-
  The Tim Commerford Passive StingRay is an Artist Series signature instrument developed in close collaboration with legendary bassist Tim Commerford (Rage Against the Machine, Audioslave, 7D7D). It pairs Ernie Ball Music Man craftsmanship with Tim's performance-driven design preferences for a bold, balanced tone.

  The bass is built with a resonant ash body finished in gloss polyester, paired with a select roasted maple neck featuring a gunstock oil and wax finish, and an ebony fingerboard with 22 high-profile, wide stainless steel frets. A sculpted 5-bolt neck joint provides full fret access.

  A single Music Man humbucking pickup with powerful neodymium magnets drives the passive electronics, which include a 500k push/push volume pot with gain boost and a 100k tone pot with a 0.1uF tone cap. A 3-way rotary pickup selector offers parallel, single-coil, and series voicings.

  Performance-oriented appointments include a custom height-adjustable finger ramp, a beveled pickup-cover thumb rest, and a Music Man black chrome strings-through-body bridge with hardened steel plate and individual red mute pads. Custom lightweight tuners with tapered posts and a custom neck plate complete the look. Available in Fight Night White and Natural Gloss.
specs: |-
  - Body: Ash with gloss polyester finish
  - Body dimensions: 13-1/2" wide, 1-5/8" thick, 44-7/8" long
  - Colors: Fight Night White, Natural Gloss
  - Neck: Select roasted maple
  - Neck finish: Gunstock oil and wax
  - Neck width: 1-11/16" at nut, 2-1/2" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony
  - Fret markers: 5/16" dot inlay
  - Frets: 22 high-profile wide stainless steel
  - Scale length: 34"
  - Pickup: Single Music Man humbucking with neodymium magnets
  - Electronics: Passive 500k push/push volume (gain boost); 100k tone with 0.1uF cap
  - Switching: 3-way rotary pickup selector (parallel / single-coil / series)
  - Bridge: Music Man black chrome strings-through-body with hardened steel plate and red mute pads
  - Hardware: Black chrome plated; custom neck plate
  - Tuners: Custom Music Man lightweight with tapered posts
  - Pickguard: Parchment
  - Strings: 50w-70w-85w-105w (Regular Slinky Bass #2832)
