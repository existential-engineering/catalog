details: |-
  Small drum risers sometimes call for unique solutions. That's why DW designed the versatile 9799 stand. It's a 9000 tom stand with two patented 799 Dog Bone accessory clamp/cymbal arms included.

  Use it as a double cymbal stand, tom/cymbal stand or double tom stand, and you'll always find a use for this ingenious space saver.

  It weighs 20.7 lbs and is built with a 1″ upper tube, a 1 1/4″ base tube and a 1/2″ boom arm.
