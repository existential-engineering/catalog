description: The ZOOM ARQ AR-96 is an all-in-one production and live performance
  instrument which includes an integrated drum machine, sequencer, synthesizer,
  looper, and MIDI controller with a built-in accelerometer.
details: |-
  The ARQ AR-96 Aero RhythmTrak is the larger of Zoom's two ARQ instruments: a round Base Station holding the sound engine, sequencer, effects and connectors, with a detachable Ring Controller that sits on top. It combines a drum machine, sequencer, synthesizer, looper, clip launcher and MIDI controller in one device.

  The Ring Controller is the part that leaves the table. It runs on its own rechargeable lithium-polymer cell for about 4.5 hours and talks to a Mac or iOS device over MIDI via Bluetooth LE, so it can be carried into the crowd as a handheld aerial instrument or used to launch audio clips from DAW software. Its 3-axis accelerometer alters effect parameters and sends MIDI control messages as it moves.

  96 velocity and pressure-sensitive pads ring the controller behind 160 programmable colour LEDs, with selectable light-show animations. Grip Detection stops the pads triggering when the ring is picked up, Split mode assigns one instrument across several pads, and sounds can be played chromatically or from dozens of preset scales in any key.

  The sound set runs to 468 drum and instrument sounds as one-shot sampled waveforms plus 70 synthesizer sounds, over a programmable synthesizer engine with 538 oscillator types and 16-voice polyphony. Sound shaping covers effects, envelope generators and both stepped and smooth modulation, and up to five effects run at once, applied either to the whole drum kit or to an individual drum sound.

  The 32-step sequencer carries song mode, 256 motion sequences, tap tempo from 40.0 to 250.0 bpm, and flexible precount, quantize, swing and beat settings, with an audible or visual click and an onboard mixer for part volumes, mutes and solos. The looper captures at 44.1 kHz and 16-bit from patterns and songs, from the SD card or from an incoming signal, holding up to 96 mono or stereo loops with 16 mono loops playing at once, manual start and end points, tempo sync, pitch change and reverse playback.

  Connection is by two 1/4-inch line inputs for phrase recording and loop creation, two 1/4-inch TRS line outputs and a separate 1/4-inch stereo headphone output with its own volume control, plus a USB port carrying USB MIDI and an SD card slot. The Base Station takes the AD-14 5 V adapter, which also charges the ring, and the ring recharges in about 2.5 hours.
specs: |-
  - 468 drum and instrument sounds as one-shot sampled waveforms, plus 70 synthesizer sound types and dozens of digital effects
  - Programmable synthesizer engine with 538 oscillator types and 16-voice polyphony
  - Sound-shaping controls include effects, envelope generators, and stepped and smooth modulation
  - Up to 5 effects simultaneously, applied to the overall drum kit or to individual drum sounds
  - 96 velocity and pressure-sensitive pads with 160 programmable colour LEDs and selectable light-show animations
  - Grip Detection prevents accidental note triggering when the ring is picked up
  - 3-axis accelerometer for altering effect parameters and sending MIDI control messages
  - Split mode assigns one instrument to multiple pads, play chromatically or from dozens of preset scales in any key
  - Sequencer: 32 steps, 256 motion sequences, song mode, tempo 40.0 to 250.0 bpm, dedicated tap tempo button
  - Flexible precount, quantize, swing and beat settings, with audible and/or visual click
  - Onboard mixer for part volumes, muting and soloing
  - Looper and audio capture: 44.1 kHz, 16-bit. Up to 96 mono or stereo loops, 16 mono loops playing simultaneously
  - Loop start and end points adjustable manually. Loop tempo synchronization, pitch change and reverse playback
  - Audio capture from patterns and songs, from SD card, or from an incoming audio signal
  - Line inputs: 1/4-inch phone, 2 inputs, line function, impedance 50 kohms, gain +10 to -65 dB, dynamic range 92 dB typ (IHF-A)
  - Line outputs: 1/4-inch TRS phone, 2 outputs, impedance 200 ohms, dynamic range 106 dB typ (IHF-A)
  - Phones: 1/4-inch stereo phone, 20 mW x 2 into 32 ohms, impedance 10 ohms, dynamic range 102 dB typ (IHF-A)
  - Interface: USB MIDI, plus MIDI over Bluetooth LE to Mac and iOS
  - Bluetooth LE OS support: macOS 10.10.4 or later, iOS 8.0 or later (not supported on Windows)
  - USB MIDI OS support: Windows 7 SP1 or later, Windows 8 or 8.1, Windows 10, Mac OS 10.8 or later
  - Media: SD, SDHC and SDXC cards. 32 MB internal memory
  - Ring Controller power: lithium-ion polymer, DC 4.2 V maximum and 3.7 V nominal, 450 mAh, about 4.5 hours battery life, 2.5 hours recharge
  - Base Station power: AC adapter (AD-14), DC 5 V / 1 A, centre positive. Consumption max 1.25 W not charging, max 4.5 W charging
  - Base Station: 260 mm (W) x 64 mm (H) x 260 mm (D), 990 g, 2.0 inch 320 x 240 full colour TFT display
  - Ring Controller: 280.5 mm (W) x 33.5 mm (H) x 280.5 mm (D), 540 g
