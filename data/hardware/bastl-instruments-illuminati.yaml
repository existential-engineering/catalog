description: A 2-channel USB lamp driver that converts audio, CV, or MIDI
  signals directly into light intensity. Creates visual accompaniment for
  modular synths, drum machines, and other gear. Features adjustable gain,
  decay, and signal inversion per channel.
details: |-
  Illuminati is a 2-channel USB lamp driver that converts audio, CV, or MIDI signals directly into light intensity, allowing you to create visual accompaniment for your music setup.

  The device features two CV inputs switchable between 0–5V or −5V to +5V ranges, and an optically coupled MIDI input (via the Micro USB connector, using MIDI-over-USB). Two USB-A outputs supply 5V power to lamps with a maximum draw of 0.5A per channel.

  Controls include adjustable gain, decay, and signal inversion per channel. Illuminati can visualize MIDI note, CC, aftertouch, or velocity values. Firmware updates are supported via MIDI. Mounting options include screws, zip-ties, or string.
