details: |-
  Simple Looping, Refined

  The original DITTO LOOPER set a new standard for simplicity and sound quality in looping. Now, DITTO 2 refines that winning formula for an even smoother, more responsive experience—keeping you locked into the groove without missing a beat.

  Large Tactile Footswitch

  DITTO 2 keeps the one-button looping experience players love but refines every detail. The newly redesigned footswitch is larger and features a snappy, magnetic mechanism for precise, reliable operation—whether stomping in boots or playing barefoot.

  Colorful Visual Feedback
