description: Dual FET Class A clean boost in the Throwback White colorway.
details: |-
  The Katana Clean Boost is a dual JFET Class A clean boost, here in a Throwback White colorway. This revision returns to the original circuit, reusing the JFETs and the component values of the first Katana, with a revised Boost mode that gives a clearer, more robust sound and more clarity to bass notes when engaged. The build uses modern construction techniques and an aluminium control knob designed to be adjusted on the fly.

  Two modes are offered, Pure Clean and High Gain. With the knob pushed in it acts as a volume control with a wide range. Pulled out it adds a further 30 dB of boost with a little gain, described as overdriven tube grit and edge rather than a full overdrive.

  Dual FETs are used for a tube-like tone in a transistor design, and an internal charge pump nearly doubles the operating voltage from the 9V DC supply. 9V DC is the maximum input voltage, so an 18V supply must not be used.

  The Katana circuit was Robert Keeley's first guitar effect design for Keeley Electronics, originally part of the Time Machine Boost before it became a separate product.
specs: |-
  - Two modes, Pure Clean and High Gain, selected with the push/pull Level knob
  - Pushed in, the knob acts as a wide-range volume control
  - Pulled out, the knob adds a further 30 dB of boost with a small amount of gain
  - Dual JFET Class A circuit with internal voltage doubling by charge pump
  - 9V DC maximum input voltage
  - Aluminium control knob
  - Throwback White colorway
