description: If traditional magnetic pickups have a one-dimensional sound, and
  the body-sensitive M1 has a two-dimensional sound, then the M80 unlocks the
  third dimension.
details: |-
  If traditional magnetic pickups have a one-dimensional sound, and the body-sensitive M1 has a two-dimensional sound, then the M80 unlocks the third dimension. The revolutionary coil suspension of our M1 allowed a magnetic pickup to reproduce a focused range of microphonic sensitivity from the guitar body. The M80 expands on the idea by implementing an elastomer suspension that allows the sensitive coil to move in three directions, delivering full range body sensitivity while following every movement of the guitar top.
specs: |-
  - Magnetic soundhole pickup with three-dimensional elastomer coil suspension
  - Switchable active/passive operation (switch located underneath)
  - Active mode uses a High-Graded FET, all-discrete preamp
  - 3V CR2032 battery
  - Volume control and multi-segment battery check
  - Adjustable pole pieces (spare set included)
  - Includes 2' strapjack assembly
  - For steel-string and 12-string acoustic guitars
  - U.S. Patent 7,135,638; requires professional installation
