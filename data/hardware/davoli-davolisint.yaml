description: >-
  The Davolisint was Italy's first analog synthesizer, produced by Davoli Krundaal Musical
  SRL and released in 1972. It is a monophonic organ-synthesizer featuring two VCOs with
  only square waveforms, independent vibrato, portamento, and a 25-key keyboard, but
  notably lacks any filters or envelopes.
details: |-
  The Davolisint was produced by Davoli Krundaal Musical SRL, a small Italian company that manufactured musical accessories and organs. Released in 1972, it holds the distinction of being the first analog synthesizer made in Italy, predating other Italian synth manufacturers including Crumar, Siel, Logan, Elka, EKO, and Jen.

  The instrument features two analog oscillators limited to a single harsh square waveform each, with independent vibrato controls for each oscillator and portamento. The only real option available to shape the sound was the ability to detune the two VCOs against each other, as the Davolisint has no filter or envelope generator.

  The keyboard spans just two octaves with 25 keys, and the instrument employs octave divide-down technology for layered sound creation. Multiple footage switches from 32' through 1/2' can be engaged simultaneously, producing a full sound many octaves thick, though the output remains monophonic. An "Extend" lever provides spring-loaded pitch bending up one octave.

  Notable users of the Davolisint include Dave Sinclair of Caravan and the Moog Cookbook. A VST emulation called Elektrostudio DavoSynth was released circa 2009. Production ran from 1972 to 1975.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs
  - Waveforms: Square only
  - Filter: None
  - Envelope: None
  - Modulation: 2 independent vibratos (one per oscillator)
  - Effects: Portamento
  - Keyboard: 25 keys
  - Memory: None
  - Control: Proprietary pedal board socket
  - Production Years: 1972-1975
