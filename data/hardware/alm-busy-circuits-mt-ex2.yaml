details: |-
  The MT-EX2 is a 4HP effects expander for ALM Busy Circuits' MEGA-TANG Eurorack mixer. It provides an additional effects send and return for all mixer channels, allowing a second external or modular effects processor to be inserted into the mix for more complex, layered effects routing.

  It connects to and is powered by the MEGA-TANG's expander header. As with the MT-EX1, only a single expander can be attached to a MEGA-TANG at any time, so the two cannot be used together.
specs: |-
  - Format: Eurorack, 4HP
  - Depth: 32mm
  - Power: +12V 25mA / -12V 25mA
  - Adds an extra effects send and return for all channels
  - Connects to and powered by the MEGA-TANG expander header
  - Only one MEGA-TANG expander supported at a time
  - Warranty: 2 years
