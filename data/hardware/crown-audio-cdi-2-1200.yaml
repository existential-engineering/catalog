name: CDi 2|1200
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-2-1200
description: A 2-channel professional power amplifier with 1200W per output
  channel and analog audio inputs. Part of Crown's CDi DriveCore series,
  engineered for large-scale installations including cinemas, houses of worship,
  hotels, and cruise lines.
details: |-
  The CDi DriveCore Series is an evolution in amplification, providing an impressive mix of high-performance, rich feature set, and competitive cost. The CDi 2|1200 derives technology from Crown's flagship Installed Sound series and is engineered for streamlined functionality in large-scale installations including cinemas, houses of worship, hotels, and cruise lines.

  DriveCore Technology reduces component count and increases reliability. The amplifier provides network control and monitoring, high-level onboard DSP, and a front-panel interface. It supports driving up to 100Vrms speaker loads directly without an external transformer, and bridge mono operation is available.

  Pre-loaded JBL speaker tunings expedite installation. Onboard DSP includes input/output routing, parametric EQ, crossover, delays, and LevelMAX limiter, with network control via HiQnet Audio Architect software.
specs: |-
  - 2 channels
  - 1200W per channel @ 4Ω
  - Dual mode: 850W @ 2Ω, 1200W @ 4Ω, 1200W @ 8Ω, 600W @ 16Ω, 1200W @ 70Vrms, 1200W @ 100Vrms
  - Bridge mono: 1200W @ 4Ω, 2400W @ 8Ω, 2400W @ 16Ω, 2400W @ 140Vrms, 2400W @ 200Vrms
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.25dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - Onboard DSP: parametric EQ, crossover, LevelMAX limiter
  - Network control via HiQnet Audio Architect
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - Dimensions: 19" W × 3.5" H × 14.71" D (excluding 1.3" front panel protrusion)
  - Weight: 17.2 lbs (7.8 kg)
  - Power: 15A IEC connector, 100–240V AC
  - BLU link: No
