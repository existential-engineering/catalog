description: Compact active monitor speaker with built-in 20W Class-D amplifier for audio monitoring and small-scale loudspeaker applications. Part of the 6301 Series, which has been utilized in broadcast facilities for over 30 years. Features an electronically balanced XLR input plus an unbalanced phone input in a die-cast aluminum closed enclosure with a 10cm full-range cone driver.
