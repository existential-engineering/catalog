description: "The Empress Compressor MKII is a transparent, all-analog
  compressor pedal with studio-grade controls: three ratios, independent attack
  and release, a mix knob for parallel compression, input and gain-reduction
  metering, plus a new tilt-EQ tone control, a selectable sidechain high-pass
  filter, and an external sidechain insert. It comes in a half-size enclosure in
  blue or silver."
details: |-
  When Empress released their original Compressor back in 2011, it quickly became a favourite among guitar and bass players alike who were searching for something more than the typical oversimplified controls found on most compressor pedals. Based on user feedback, Empress took everything great about the original and made it even better.

  On top of the full range of features and controls normally only seen in high-end studio equipment, such as input and gain-reduction metering, independent attack and release controls, a mix knob for parallel compression, and an external sidechain insert, the MKII adds a tilt-style tone EQ control centered at 500Hz, and a selectable sidechain high-pass filter built into the detection circuit (off, 120Hz, or 240Hz).

  The whole package is now about half the size of the original and is available in two colours, blue sparkle and silver sparkle.
specs: |-
  - All-analog signal path
  - Extremely transparent dynamic control
  - 3 compression ratios: 2:1, 4:1, 10:1
  - Independent attack and release controls
  - Mix knob for parallel (New York style) compression
  - Separate input and gain-reduction meters
  - Tilt-style tone control centered at 500Hz
  - Sidechain send/return via 3.5mm TRS jack
  - Built-in sidechain high-pass filter: off, 120Hz, or 240Hz
  - Power on bypassed or engaged
  - True bypass
  - Available in blue sparkle or silver sparkle
  - Input impedance 1M, output impedance 2.2k
  - Frequency response (-3dB) 20Hz - 20kHz
  - Distortion less than 0.1%, noise -101dB
  - Power 9V DC (negative tip), 2.1mm barrel connector, ~100mA draw
  - Die-cast aluminum enclosure
  - Dimensions 4.8" (L) x 2.6" (W) x 2.5" (H with controls), weight 1 lb
