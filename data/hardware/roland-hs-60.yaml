description: >-
  The Roland HS-60 is a consumer-oriented version of the Juno-106 synthesizer
  with built-in speakers and an integrated amplifier, designed for home use. It
  features the same 6-voice polyphonic analog sound engine with digitally
  controlled oscillators, making it sonically identical to its professional
  counterpart. A stereo mix input allows users to layer external audio sources
  through the internal speakers for standalone jamming.
details: |-
  The HS-60 represents Roland's effort to bring professional-quality analog synthesis to home musicians and hobbyists. Built on the same architecture as the legendary Juno-106, it retains the full sonic capabilities of that instrument while adding practical features for standalone operation, including a built-in amplifier and speaker system.

  One distinctive feature is the stereo mix input, which allows users to route external audio sources through the internal speakers — useful for playing along with other instruments or backing tracks without additional equipment. For studio use, inserting a 1/4-inch plug into the headphone output bypasses the internal speakers, as they continue producing sound when only the main outputs are connected. The synthesizer also accommodates a sheet music stand for added convenience.

  Editor software and patch librarian tools are available for both Macintosh and Windows platforms, with SysEx documentation for real-time parameter control.
specs: |-
  - 6-voice polyphony
  - DCO (Digitally Controlled Oscillator) with pulse, sawtooth, and square waveforms
  - LFO with rate and delay controls
  - Non-resonant highpass filter
  - Resonant lowpass filter
  - VCA with ADSR envelope, level, and gate
  - 61-key keyboard
  - MIDI compatible
  - Built-in amplifier and speakers
  - Stereo mix input
  - Headphone output
