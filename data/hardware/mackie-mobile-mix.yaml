description: MobileMix is a USB-powerable audio mixer for A/V Production, Live
  Sound and Streaming. Featuring eight channels, two mic/instrument preamps,
  Bluetooth with Mix Minus, stereo line inputs, EQ, effects and more, this mini
  mixer is the easiest way to get professional sound on the go.
details: |-
  MobileMix is the easiest way to get legendary Mackie sound on the go, a fully featured small audio mixer you can power via USB or a rechargeable USB power pack (not included).

  MobileMix runs on flexible USB power, giving you countless options for running sound away from outlets. MobileMix has a hidden battery compartment underneath, designed to fit most external batteries, turning MobileMix into a truly battery-powered mixing console.

  Connect two smartphones or cameras at once via TRRS connections to send and receive audio from both, and bring in external sources including playback devices, live mixing boards, laptops, line-level instruments like keyboards and more, using the stereo TRS line input channel.

  Because it can send and receive sound wirelessly on a dedicated Bluetooth channel, MobileMix does some impressive things, like streaming music from one device while recording to another, or capturing both ends of a phone call at once using Mix Minus, which gets rid of the echo that would normally make it impossible.

  MobileMix packs the legendary build quality and excellent sound that make Mackie trusted worldwide. It begins with two fully featured microphone preamp channels with combo XLR and 1/4 inch connectors, Hi-Z impedance switches for electric guitars and other passive instruments, low-cut filters and 48V phantom power for condenser mics.
specs: |-
  - Runs on USB power from rechargeable batteries, adapters and powered USB ports
  - Dedicated mix output for recording to smartphones, tablets and DSLR cameras
  - Bluetooth input/output with Mix Minus technology for recording and streaming at same time, including phone calls without echo
  - 2 mic/instrument inputs with XLR and 1/4" combo connectors, Hi-Z, low cut and 48V phantom power
  - Stereo input for keyboards and other line-level gear
  - Two-way TRRS connector for second smart device or camera
  - 3 different Reverb types with level controls per channel (Plate, Hall, Reverb + Delay)
  - 2 mix outputs with separate level controls for PA systems, monitors and more
  - Headphone output with level control
  - Compartment for USB battery (sold separately)
  - Per-channel 2-band EQ: HI 12 kHz, LOW 80 Hz
  - USB-C power input rated 5V, 1.2A
