id: DrfLRMolaxKDcpSiKM_Yq
name: MobileMix
manufacturer: mackie
primaryCategory: mixer
url: https://mackie.com/en/products/battery-powered/live-sound/Mobile_mix.html
description: MobileMix is the easiest way to get legendary Mackie sound on the
  go–a fully featured small audio mixer you can power via USB or a rechargeable
  USB power pack.
details: |-
  MobileMix is a USB-powerable audio mixer for A/V Production, Live Sound and Streaming. Featuring eight channels, two mic/instrument preamps, Bluetooth® with Mix Minus, stereo line inputs, EQ, effects and more, this mini mixer is the easiest way to get professional sound on the go.

  MobileMix runs on flexible USB power, giving you countless options for running sound away from outlets.
specs: |-
  - Runs on USB power from rechargeable batteries, adapters and powered USB ports
  - Dedicated mix output for recording to smartphones, tablets and DSLR cameras
  - Bluetooth® input/output with Mix Minus technology
  - 2 mic/instrument inputs with XLR and 1/4" combo connectors, Hi-Z, low cut and 48V phantom power
  - Stereo input for keyboards and line-level gear
  - Two-way TRRS connector for second smart device or camera
  - 3 different Reverb types with level controls per channel
  - 2 mix outputs with separate level controls
  - Headphone output with level control
  - USB battery compartment
