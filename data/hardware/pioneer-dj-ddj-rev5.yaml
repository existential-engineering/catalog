details: |-
  Scratch-style 2-channel performance DJ controller. The DDJ-REV5 is a new-generation controller with Serato DJ Pro and rekordbox compatibility. This 2-channel unit offers an authentic scratch experience and innovative features including its large jogs, MAGVEL FADER, dedicated buttons for Stems control, the first-ever Auto BPM Transition, and Piano Play mode. Key features: Large jog wheels and MAGVEL FADER for dynamic scratching; Scratch-style layout for open-format freedom; Dedicated buttons for easy Stems control; New Auto BPM Transition for smooth mixing; New Piano Play mode for intuitive musical performances; Multiple inputs and outputs plus 2 USB Type-C ports for smooth DJ transitions; Serato DJ Pro and rekordbox plug-and-play compatibility; For open format/Hip Hop DJ.
