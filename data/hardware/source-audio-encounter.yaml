description: The Encounter Ambient Delay+Reverb is a fully-loaded vessel of
  atmospheric discovery, thoughtfully designed to explore swirling celestial
  tones and deeply immersive soundscapes.
details: |-
  The Encounter Ambient Delay + Reverb combines 12 distinct delay engines and 6 reverb algorithms accessible through onboard controls, with 10x expanded functionality via Neuro 3 software.

  Delay engines include Noise Tape (tape echo-inspired), Drum Echo (vintage multi-head patterns), Kaleidoscope (frequency-scattered delays), Resonant (analog-inspired), EchoVerb (delay/reverb hybrid), and Helix (octave-shifted reverse delay). Reverb options feature Hypersphere (boundless reflections), Shimmers (dual pitch-shifting voices), Trem Verb (tremolo-modulated reverb), Reverse (backwards psychedelic effect), Lo-Fi (distorted/mangled reverb), and Swell (envelope-controlled volume swell).

  The pedal offers dedicated footswitches for delay ON/OFF and reverb ON/OFF, tap tempo control, and a knobs-lock switch. It maintains a 100% unprocessed analog dry signal path alongside stereo processing.

  Universal Bypass offers true, soft, and analog bypass options. Encounter stores 128 presets (8 via the pedal, 128 via MIDI) and supports 5-pin MIDI DIN, USB MIDI, and expression control via the Neuro Hub.
specs: |-
  - 12 delay engines and 6 reverb algorithms
  - 10x expanded functionality via Neuro 3 software
  - Dedicated footswitches for delay and reverb on/off
  - Tap tempo and knobs-lock switch
  - Analog dry signal path (100% unprocessed)
  - Stereo I/O processing
  - 128 presets (8 via pedal, 128 via MIDI)
  - Universal Bypass (true, soft, analog)
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 4.4" x 2.2"
  - Weight: 1 lb
  - Power consumption: 300 mA
