description: A looper pedal that lets you create, perform, and record both
  parallel and sequential loops, with Mixer Mode, auto-quantize, undo/redo, and
  MIDI integration. Records up to 20 minutes per track with 24-bit sound and
  32-bit processing, and includes built-in effects with the ability to import
  backing tracks.
details: |-
  The Aeros Loop Studio lets you create, perform, and record with both parallel and sequential loops. Its intuitive design includes Mixer Mode, auto-quantize, undo/redo, and MIDI integration for full creative freedom. Record up to 20 minutes per track with 24-bit sound and 32-bit processing for studio-quality clarity. With built-in effects and the ability to import backing tracks, it's built for musicians who want more from their looping pedal.
