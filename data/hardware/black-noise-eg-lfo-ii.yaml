description: A Eurorack module combining an envelope generator with rise, hold,
  and fall controls, and an LFO with adjustable speed ranges. Both sections
  provide a main output and an inverted copy.
details: |-
  As its name implie, EG LFO is composed of an Envelope Generator and an LFO. The envelope generator offer control over Rise time, the Hold and the Fall time. Two range of envelope are available, slow and fast. You can also modify the speed off the fast mode using the speed expander on the back of the module. On outputs you will find the envelope output and a inverted copy of the envelope. EG LFO II also feature a LFO mode, speed can be control using rise and fall control. Two speed mode are available, LFO range in slow mode and audio range in fast mode. You can modify the speed off the fast mode using the speed expander on the back of the module. On output you will find the LFO output and a inverted copy of the LFO.
