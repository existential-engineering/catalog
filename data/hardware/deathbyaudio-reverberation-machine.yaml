details: |-
  The original synthetic atmosphere creator, the Reverberation Machine offers up drippy, saturated spring reverbs and cavernous expanses in one small package. Push the Altitude and hear the reverb blasted with gloom and distorted shimmer for the ultimate wall of sound. An instant classic for a reason, its unique and experimental sounds are equally at home twisting your sound into a galactic nebula or adding a sinister and yearning beauty to anything you plug in.

  This synthetic atmosphere generator simulates amp-top spring units, or at higher levels creates a blooming distorted reverb so thick and heavy you could carve a statue from it. It doesn't have regular reverb pedal controls, because it isn't a regular reverb pedal, unless you want it to be. In true Death By Audio fashion, the Verb control goes all the way to 125% wet for trippy psyched-out reverbs that are louder than the input.

  Vol controls the output volume of the effect. Altitude is similar to gain: turn it up to bring in a more wide open, distorted sound. Verb blends in the amount of reverb. The Dark/Light toggle moves from dark cavernous reverberation to bright shimmering reverberation. When the Altitude and Verb controls are turned past 12 o'clock, the pedal can produce potentially harmful volumes, white noise, and other artifacts.
