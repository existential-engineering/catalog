details: |-
  Erica Synths Black System II is a complete eurorack system built from a well-considered selection of Black Series modules. It covers rich synth leads, massive bass lines, cosmic sounds and stereo drones, and it is designed to be a reliable instrument for studio work and for live performance.

  The system comes in an Erica Synths 2x84HP skiff case with a universal PSU included, together with 25 patch cables.

  It can be played with keyboards, with MIDI sequencers or as a standalone unit, and with some creative patching the possibilities of the system are virtually limitless.

  The module complement covers oscillators (Black Wavetable VCO, Black VCO2), filters (Black Multimode VCF, Black Polivoks VCF), level control (Black Quad VCA2, Black XFade), modulation (Black Modulator, Black Dual EG/LFO, Black Octasource, Black EG), mixing and output (Black Mixer, Black Output), control sources (Black MIDI-CV, Black CV Tools, Black Joystick2) and effects (Black Stereo Delay).

  Erica Synths Black Series modules are also recognized for their build quality, which makes this instrument a lasting investment.
