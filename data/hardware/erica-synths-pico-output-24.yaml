description: Output module with headphone preamp.
details: |-
  The Erica Synths Pico OUTPUT module is the stage at the end of a Pico system, there to monitor music on headphones and to give it a standardised connection to a mixing desk.

  A stereo input feeds a high quality headphones amplifier with its own volume control, on a 3,5mm headphones output jack.

  Alongside it sits a 3,5mm stereo line output jack, which connects the Pico System directly to virtually any speaker system or line input, a car stereo included.

  Input level is 10Vptp, and the module draws +20mA and -7mA. The panel is 3HP wide and the module is 35mm deep, part of the Pico Series brief Erica Synths set itself, to fit superior synth functionality into 3HP at an affordable price.
specs: |-
  - Stereo input
  - High quality headphones amplifier
  - 3,5mm headphones output jack
  - Headphones volume control
  - 3,5mm stereo line output jack
  - Input level 10Vptp
  - Power consumption +20mA, -7mA
  - Module width 3HP
  - Module depth 35mm
