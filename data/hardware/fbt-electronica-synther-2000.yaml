description: >-
  The FBT Electronica Synther-2000 is a rare Italian monophonic analog
  synthesizer from 1973, featuring three VCOs with sawtooth and square
  waveforms, subtractive filtering, and a unique continuous oscillator frequency
  slider that produces Theremin-like effects. It was the first synthesizer from
  FBT Electronica S.P.A., a company founded in 1963 that had primarily focused
  on amplifiers and mixing consoles.
details: |-
  Introduced in 1973, the Synther-2000 was the first synthesizer from FBT Electronica S.P.A., an Italian company founded in 1963 by Bruno Baldoni and Vincio Tanoni that had primarily focused on amplifiers and mixing consoles. The company would later produce the Synther-4000, though neither instrument achieved widespread commercial success.

  The Synther-2000 is a monophonic instrument based on subtractive synthesis, equipped with three VCOs each capable of generating square and sawtooth waveforms. The filtering section provides a single filter with cutoff control, individual level controls for each oscillator, and keyboard tracking. A noise generator feeds oscillators 2 and 3 for additional timbral possibilities.

  The envelope section offers three modes: Attack/Decay, Attack-only, and a continuous attack setting that functions as a rudimentary arpeggiator. The 37-key keyboard lacks pitch bend and modulation wheels, instead providing a slider for continuous control of oscillator 1 frequency that produces effects reminiscent of a Theremin. A sweep control adds portamento-style gliding between notes.

  Due to very limited production numbers and narrow distribution, the Synther-2000 is exceptionally rare today and represents an obscure but interesting piece of early Italian synthesizer history.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs (sawtooth and square waveforms)
  - LFO: None
  - Filter: 1 VCF with cutoff and keyboard tracking; 3 filter sections
  - Effects: None
  - VCA: 1
  - Keyboard: 37 keys
  - Memory: None
  - Control: CV
  - Date produced: 1973
