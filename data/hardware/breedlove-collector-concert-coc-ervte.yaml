details: |-
  A highly articulate and balanced concert shape built for players who value clarity, nuance, and responsiveness. Figured East Indian rosewood paired with European spruce delivers a refined voice with strong note separation, rich overtones, and exceptional dynamic range. The Concert body shape offers comfort and precision, making this model ideal for fingerstyle players and nuanced flatpickers alike. Finished in Vintage Toner gloss with elegant appointments throughout. These are limited series of 5 total per shape. Equipped with LR BAGGS HighFi Duet, Waverly antique nickel open gear tuners and a Custom TKL tweed hardshell case.
