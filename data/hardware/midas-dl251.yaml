url: "https://www.midasconsoles.com/en/products/0606-AAU"
description: '48 Input / 16 Output Stage Box with 48 Midas Microphone
  Preamplifiers and Dual-Redundant AES50 Networking. The DL251 is a 5U 19"
  rack-mount fixed-configuration I/O unit that delivers legendary Midas sound
  quality utilising time-tested and road-proven technologies. Featuring 48
  mic/line level inputs with award-winning Midas microphone preamplifiers and
  2.5 dB analogue gain steps, 16 servo-balanced line level outputs, and three
  AES50 network ports supporting N+1 redundancy, the DL251 enables a digital
  snake connection from Front of House to stage for all Midas digital consoles.'
details: |-
  PRO SERIES DL251 — 5U 19" Rack-Mount Digital Audio Interface Unit with 48 Mic/Line Inputs and 16 Line Outputs.

  The DL251 is a professional-grade I/O unit that delivers legendary Midas sound quality utilising time-tested and road-proven technologies. It serves as a digital snake connection between front of house and stage for Midas mixing consoles.

  Key features:
  - 48 mic/line level inputs on XLR connectors with award-winning Midas microphone preamplifiers
  - 2.5 dB analogue gain steps for precise gain control
  - 16 servo-balanced line level outputs on XLR connectors with high output current capability
  - 3 AES50 network ports (SuperMAC compliant) supporting N+1 redundancy
  - 1 Ethernet control port (100 Megabit)
  - MIDI Interface (In, Out, Thru)
  - 48 kHz and 96 kHz sample rate operation
  - Recessed 'Mute All Outputs' switch for safe re-patching
  - Front panel and remote console control options
  - LED status indicators for power, network connectivity, and synchronization
  - Dual redundant, auto-voltage sensing power supply (100-240 VAC, 50-60 Hz)
  - Rugged steel 5U rackmount chassis
  - AES50-2011 standards compliant
  - Compatible with all Midas digital consoles

  Dimensions: 483 mm W x 414 mm D x 221 mm H (19.0" x 16.3" x 8.7")
  Weight: 10 kg (22.1 lbs)
specs: |-
  - Form Factor: 5U 19" rack-mount
  - Microphone Preamplifiers: 48 award-winning Midas microphone preamplifiers
  - Analogue Gain Steps: 2.5 dB
  - Mic/Line Inputs: 48 on XLR connectors
  - Line Outputs: 16 servo-balanced on XLR connectors with high output current capability
  - Sample Rates: 48 kHz and 96 kHz operation
  - AES50 Network Ports: 3 (SuperMAC compliant, supporting N+1 redundancy)
  - Network Standard: AES50-2011 compliant
  - Ethernet Control Port: 1 (100 Megabit)
  - MIDI Interface: In, Out, Thru
  - Front Panel: Recessed 'Mute All Outputs' switch; LED status indicators for power, network connectivity, and synchronization
  - Configuration: Front panel and remote console control options
  - Power Supply: Dual redundant, auto-voltage sensing
  - Power Requirements: 100-240 VAC, 50-60 Hz
  - Chassis: Rugged steel 5U rackmount
  - Dimensions: 483 mm W x 414 mm D x 221 mm H (19.0" x 16.3" x 8.7")
  - Weight: 10 kg (22.1 lbs)
  - Compatibility: All Midas digital consoles
