description: A multi-engine polyphonic hardware synthesizer that runs three of
  nine distinct synth engines at once, each with its own effects, sequencer or
  arpeggiator. Combines synthesis methods including granular, physical modeling,
  FM, wavetable, virtual analog and phase distortion.
details: |-
  Polyend Synth is a multi-engine polyphonic synthesizer that can simultaneously operate three synthesizers, selecting from nine distinct synth engines, incorporating three effects, and adding three separate sequencers or arpeggiators. All engine parameters, effects, macros, and grid settings can be saved as an instantly recallable Scene.

  The nine engines combine varied synthesizing methods: VAP (dual-oscillator virtual analog polysynth inspired by the Prophet and OB-8), PHZ (modernized phase distortion), ACD (recreation of vintage monophonic analog synths like the SH-101 and TB-303), FAT (3-oscillator virtual analog with detune and ladder filters), PMD (physical modeling), GRAIN (two-mode granular with burst and cloud modes), WAVS (wavetable morphing between two wavetables), and WTFM (2-operator FM using wavetable oscillators with a 3x feedback system). A DWA engine adds dual wavetable architecture for experimental sample-based synthesis.

  Each synth can be assigned its own sequencer or arpeggiator with control over swing, groove, octave range and gate length, with transposable sequences that adapt to the chosen scale. Smart Grid technology enables single-button chords and note followers that stay in tune, while polyphonic aftertouch responds to finger pressure independently on each pad.

  Three effect engines (MOD modulation, DEL double delay, REV reverb) can be independently routed for each synth. Combo Knobs act as customizable macros that control one, two, or all three synths at once. The 3x3 knob matrix and dedicated parameter buttons provide direct control without menu diving.

  With SD and USB-accessible storage, the Synth is expandable and customizable: users can load their own wavetables, grain files, presets, and whole setups, and share Scenes with the community.
specs: |-
  - Simultaneously operate 3 synthesizers with 9 distinct synth engines
  - 3 effects engines: MOD (modulation), DEL (double delay, five delay models), REV (reverb, three modes)
  - 3 separate sequencers or arpeggiators
  - Smart Grid technology for single-button chords and note followers
  - Polyphonic aftertouch (up to five pressure-controlled values per synth)
  - Combo Knobs (customizable macros across one, two or all three synths)
  - 3x3 knob matrix with dedicated parameter buttons
  - Scenes: recallable files combining engines, parameters, patches, effects sends, macros, arps and sequences
  - SD and USB-accessible storage, with loadable wavetables and grain files
  - In the box: Essential References book, USB-A power adapter, USB-C cable (2 m), stereo 3.5 mm to 2x mono 6.3 mm adapter, minijack to MIDI DIN adapter (Type B), 16 GB MicroSD card, MicroSD to USB-A adapter
  - Height (with knob): 1.3 inches (3.3 cm)
  - Width: 11.02 inches (28.2 cm)
  - Depth: 8.15 inches (20.7 cm)
  - Weight: 2.65 pounds (1.2 kg)
