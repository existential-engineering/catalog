description: As a guitarist and music composer for international deathcore icons
  Slaughter to Prevail, Jack Simmons has created a very influential sound in the
  world of heavy music. His first LTD Signature Series guitar is the JS-7
  Baritone, a seven-string V-shaped beast that allows for extraordinary
  downtuning along with great playing feel and sonic articulation. Built with
  neck-thru-body construction for stability and sustain, the JS-7 Baritone makes
  use of a thin U-shaped three-piece maple neck with mahogany body wings. It
  also features a Macassar ebony fingerboard with 24 extra-jumbo stainless steel
  frets and diamond-shaped pearloid position marker inlays. Components on the
  JS-7 Baritone include black hardware, ESP locking tuners, a 48mm Graphtec TUSQ
  XL nut, a Hipshot 7 hardtail bridge with string-thru-body, and a single
  direct-mount Fishman Open Core Modern 3-Voice humbucker active pickup with
  push-pull control to access its multiple voices. Includes deluxe ESP hardshell
  case.
