description: The DN405 is a single-channel, five-band fully parametric equaliser
  engineered for the studio and broadcast engineer who needs precise control
  over frequency, bandwidth and gain on every band. Where graphic equalisers
  offer convenience, the DN405 offers exactness.
details: |-
  Every band on the DN405 offers continuous control over centre frequency, Q (bandwidth) and gain, the three parameters that define a filter. With overlapping ranges across the bands, the engineer can dial in anything from a wide tonal lift to a surgical 0.1-octave notch.

  Built to the tolerances that earned Klark Teknik a Queen's Award for Enterprise in 1986, the DN405 holds its calibration across temperature and time. Bypass is true and silent, and noise and distortion specifications were class-leading at launch.

  The DN405 is a product of Kidderminster engineering, designed, built and tested in the UK by a team whose first concern is how the unit will sound on the thousandth pass.
specs: |-
  - Single-channel fully parametric equaliser
  - Five bands
  - Continuous centre frequency, Q and gain control per band
  - Overlapping band ranges
  - Bandwidth down to 0.1 octave
  - True silent bypass
