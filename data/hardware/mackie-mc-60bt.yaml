details: |-
  Experience pure, faithful audio with components and acoustic tuning inspired by pro studio gear. Powerful MIS active noise cancelling and maximum comfort will transport you to your own little world of musical enjoyment whether you're on a noisy airplane or taking a walk on a busy street.

  Tired of over-processed, unbalanced sound? MC-60BT Wireless Headphones take Mackie's legendary acoustic tuning, powerful custom drivers, and aptX HD support to deliver pure, faithful audio while powerful MIS wide-band active noise cancelling keeps you immersed in your music, movies, and games.
specs: |-
  - Bluetooth 5.0 wireless technology
  - aptX HD codec with 24-bit audio support
  - MIS Wide-band active noise cancelling with four onboard microphones
  - Ambience mode for ambient sound awareness
  - Capacitive touch controls
  - Dual device connectivity
  - Two high-quality microphones for calls
  - Wireless charging pad included
  - USB-C direct charging option
  - Up to 35+ hours battery life
  - Collapsible design with premium hard carry case
