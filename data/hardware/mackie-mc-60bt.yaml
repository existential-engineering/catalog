details: |-
  Experience pure, faithful audio with components and acoustic tuning inspired by pro studio gear. Powerful MIS active noise cancelling and maximum comfort will transport you to your own little world of musical enjoyment whether you're on a noisy airplane or taking a walk on a busy street.

  Tired of over-processed, unbalanced sound? MC-60BT Wireless Headphones take Mackie’s legendary acoustic tuning, powerful custom drivers, and aptX HD support to deliver pure, faithful audio while powerful MIS wide-band active noise cancelling keeps you immersed in your music, movies, and games. Touch control and dual device support make everyday use easy, while dual voice mics ensure you sound great on calls and meetings. When you need to top off the battery, just set them down on the included wireless charging pad.

  MIS wide-band active noise cancelling has a wider response than typical designs. Targeting a wider frequency range makes it possible to block even more noise and rumble for a greater level of immersion. Multiple onboard microphones ensure consistent performance and maximum noise reduction.
specs: |-
  - Bluetooth 5.0 wireless technology
  - aptX HD codec supports 24-bit audio
  - MIS wide-band active noise cancelling utilizes four onboard microphones
  - Ambience mode allows outside noise in so you can stay alert to your surroundings
  - Capacitive touch controls
  - Connect to up to two devices simultaneously
  - Two high-quality microphones for calls and chat
  - Wireless charging with included charging pad
  - Direct charging with included USB-C cable
  - Up to 35+ hours of battery life
  - Comfortable all-day headband and earpad design
  - Collapsible for easy storage
  - Premium hard carry case included
