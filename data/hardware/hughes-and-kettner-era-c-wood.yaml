details: |-
  The era C is a portable amplifier built to capture the natural tonality of your acoustic instruments with absolute precision. Optimized for both intimate home practice and small-venue performances, it upholds the superior sonic reputation of the celebrated era series. Through the use of four simultaneous inputs and onboard effects, you can mix multiple signals to achieve a refined, professional result. This versatile and straightforward system ensures your signature sound remains intact regardless of the setting.

  The era C provides 60 watts of transparent amplification through a specialized 8-inch double-membrane speaker, projecting every detail of your performance with clarity. It serves as a central audio hub, featuring four dedicated channels to accommodate instruments, microphones, and Bluetooth playback. Channels 1 and 2 are equipped with independent EQ sections and a built-in effects library, including five reverbs and three delays, for meticulous tonal adjustments. From supporting phantom-powered condenser mics to utilizing a precision notch filter (41-180 Hz) for feedback suppression, the era C delivers the professional DI outputs and wireless functionality essential for the modern performer.

  High-level performance doesn't require heavy equipment. Weighing only 6.4 kg, the wooden era C is a portable solution designed to integrate seamlessly into your daily routine. The elegant Wood finish is styled to look at home in a living room while remaining rugged enough for the stage. To accommodate larger spaces, a built-in 35 mm pole mount allows for better projection, while the small frame ensures easy transport between locations. This amplifier offers a blend of professional-grade tone and convenient mobility for touring musicians and hobbyists alike.
specs: |-
  - Channels: 4
  - Power: 60 Watts
  - Multi FX: 8 (Reverb, Delay, Combinations)
  - Speaker: 1 x 8" Double Membrane
  - Cabinet Construction: Closed
  - Stand Flange: Fits 35 mm speaker stands
  - Dimensions: 270 x 285 x 250 mm
  - Weight: Wood: 6.4 kg / 14.1 lbs
  - Accessories (optional): Carrying Bag, Tilt Stand
  - Line Out: XLR, Pre/Post EQ/FX Switchable
  - Effects Loop: Send / Return
  - Footswitch: FS2 Footswitch (optional), 6.3 mm stereo jack (Mute/FX-Mute)
  - Special Features: Bluetooth
