details: |-
  The F50 multipurpose vocal dynamic microphone embodies a tight and uniformly controlled cardioid polar pattern which assists in isolating the vocals from the instruments on stage. The f50S adds a noiseless, magnetic on/off switch.

  Its warm, natural sound reproduction, resistance to feedback, and ability to handle high SPLs without distortion allows the f50 dynamic vocal microphone to be utilized in a variety of live and studio applications. The f50 cardioid microphone is an entry-level, all-purpose vocal microphone for small to midsize PA systems.
