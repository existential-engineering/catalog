details: |-
  The Tesla Mk III Soviet Fuzz Bender is a small batch germanium fuzz built on a MkIII style tone bender circuit, using a stock of 1970s Soviet-era Tesla 104NU71 NPN germanium transistors. Keeley describes the transistor's character as sticky and velcro-like with an unusual bass response, and the pedal as purely a fuzz with no overdrive in it, voiced for a very unrefined late 1960s tone.

  Controls are Fuzz, Tone and Level. Circuit modifications extend the high frequency response and lower the noise floor compared with the original design, and techniques carried over from the Time Machine Boost and Holy Fuzz designs largely remove the temperature drift that affects vintage germanium fuzz units.

  The run was limited to 200 units. Each pedal is hand-built in the USA in a powder-coated enclosure with true bypass switching, and carries a two year limited warranty. The product page is written as a comic Soviet pastiche, including Russian-language jokes and unedited editorial placeholder notes, none of which carry product information.
specs: |-
  - Controls: Fuzz, Tone, Level
  - MkIII style tone bender circuit, hand-built
  - Soviet-era Tesla 104NU71 NPN germanium transistors
  - Extended high frequency response and low noise design
  - Temperature drift compensation for the germanium circuit
  - True bypass switching
  - Powder-coated enclosure
  - Hand-built in the USA
  - Two year limited warranty
  - Limited run of 200 units
