description: A passive 0hp/7hp 1U diode fuzz distortion module for degrading and
  distorting incoming audio signals.
details: |-
  Fuzz right off, pal

  Some modules are there to provide nice, predictable and well-behaved outputs in response to orderly inputs. Some modules are just there to tear things to shreds. This module fits in the latter category. Operation is simple: you input an audio signal in need of degradation and filth, and you let the results speak for themselves. The knob allows you to balance the signal between red hot and clippy LED distortion and Germanium-like softer, crushing, compressing distortion. The best part is, every setting is a good setting as a result. You simply cannot go wrong. Reject the ideal of signal purity: inject filth into your signal chain, today. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Absolutely destroy incoming audio signals
  - Rip everything to shreds
  - Bask in the warm glow of the red LED
  - Passive design: no batteries required or power supply required
