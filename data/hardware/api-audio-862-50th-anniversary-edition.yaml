url: https://apiaudio.com/product/862-50th-anniversary-edition/
description: Limited run of 50 individually serialized 1U rackmount channel
  strips combining the 312 Anniversary Edition mic preamp and 550A Anniversary
  Edition 3-band EQ on original Saul Walker 500-series PCBs. Hand-wired with
  vintage faceplate.
details: "1U rackmount mic preamp + 3-band EQ channel strip. Strictly limited to
  50 units (individually serialized 1–50). 312-section: 35 dB adjustable mic
  gain, polarity flip, 48V phantom power, 20 dB pad, VU meter with peak LED (+18
  dBu), selectable 312 or 550A output metering. 550A section: 3-band
  discrete-step EQ (LF 50–400 Hz, MF 400–5000 Hz, HF 5–15 kHz, ±12 dB),
  shelf/peak on HF/LF bands, switchable band-pass filter. Rear-panel EQ insert
  input (switchable via front panel)."
specs: |-
  - Gain: +34 to +69 dB (+14 to +49 dB with pad)
  - Max input: +4 dBu (+16 dBu with pad)
  - Max output: +31 dBu
  - Frequency response: ±0.5 dB (20 Hz–40 kHz)
  - S/N ratio: 120 dB
  - Output impedance: <75 Ω (transformer balanced)
  - Power: 18.5 W
  - Dimensions: 19″ × 1.75″ (1U) × 11″ D
  - Weight: 8.5 lb
  - Production run: 50 units
