description: >-
  A compact dual-band parametric EQ and two-channel mixer module for Eurorack,
  inspired by vintage Portastudio tape mixer EQ circuits. Provides boost or cut
  across two sweepable frequency bands with dual AC-coupled inputs and a single
  mixed output.
details: |-
  The PE-1 is a dual-band parametric EQ module for Eurorack, drawing inspiration from the classic EQ circuits found in vintage Portastudio cassette tape mixers. Its two sweepable frequency bands each offer boost or cut, allowing the user to sculpt the tonal character of audio signals in a compact 5HP format.

  The module functions simultaneously as a two-channel mixer, accepting two AC-coupled audio inputs — one of which features an attenuation control — and summing them to a single output after EQ processing. This makes it useful as a final mixing and tone-shaping stage, or as an insert EQ in a feedback loop or signal chain.

  Typical use cases include warming up cold digital sources, taming harsh tones, live performance tonal control, and extending the functionality of a patch's mixer section. The module is skiff friendly at just 32mm deep and includes reverse polarity protection. A refurbished option is available at £80.
specs: |-
  - Width: 5HP
  - Depth: 32mm
  - Power: +12V 10mA / -12V 10mA
  - Two sweepable frequency bands
  - 2× AC-coupled audio inputs (one with attenuation)
  - 1× mixed audio output
  - Reverse polarity protection
  - Skiff friendly
  - Made in the UK
  - 2-year warranty
