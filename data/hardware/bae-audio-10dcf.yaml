description: The BAE Audio 10DCF is a discrete Class A, transformer-coupled
  compressor/limiter featuring Carnhill and Jensen transformers, with
  independent compressor and limiter sections and an inductor-based bypass
  filter for flexible low-frequency control. Hand-assembled in California, it is
  stereo linkable and suited for both tracking and mixing applications.
details: |-
  The BAE Audio 10DCF is a single-channel, discrete Class A compressor/limiter built with Carnhill and Jensen transformers for a rich, musical character reminiscent of classic Neve dynamics units. It features independent compressor and limiter sections, allowing precise control over dynamics with Elma stepped switches for repeatable, accurate settings.

  A standout feature is the inductor-based bypass filter, switchable at 50, 80, 160, and 300 Hz, which allows the low-frequency content to pass uncompressed — ideal for tracking bass, kick drum, or full mixes without pumping. The illuminated gain reduction meter uses a distinctive gastank-style display.

  The unit operates in true bypass when powered off, preserving signal integrity. An internal switch-mode power supply handles both 110v and 230-240v operation. Two units can be stereo linked for bus processing.

  The 10DCF is hand-assembled in Burbank, California, continuing BAE's tradition of boutique, hand-wired outboard gear built to the same standards as the original Neve modules the company was founded to recreate.
specs: |-
  - Frequency Response: 5 Hz to 45 kHz (-1 dB @ +8 dBu)
  - Noise: -80 dBu (200 Ω source)
  - Max Output: +33 dBu (10 kΩ load), +27 dBu (600 Ω load)
  - Compressor Threshold: -20 dBu to +16 dBu
  - Compressor Ratio: 1.5:1 to 10:1
  - Limiter Threshold: +4 dBu to +15 dBu
  - Bypass Filter: 50, 80, 160, 300 Hz (inductor-based)
  - Power: 200 mA at 24 VDC (internal switch-mode PSU, 110v/230-240v)
  - Dimensions: 19" W × 1.75" H × 9" D
  - Transformers: Carnhill and Jensen
  - Stereo linkable
  - Hand-assembled in Burbank, California
