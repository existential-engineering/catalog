description: The Octamizer is an all-analog octave pedal that generates sounds
  an octave below your bass signal. Features independent volume controls for
  clean and octave outputs, a proprietary detector circuit for superior
  tracking, dual filter architecture with independent signal paths, a
  continuously variable multipole low-pass filter for the octave sound, and a
  full spectrum tilt EQ for the clean sound.
details: |-
  Proprietary detector circuit for superior tracking of bass frequencies.

  Dual filter architecture with independent signal paths for clean and octave
  signals. The multipole low-pass filter for the octave channel is continuously
  variable, while a full-spectrum tilt EQ shapes the clean signal — boosting
  treble while cutting bass (or vice versa) for seamless tone matching.

  Independent volume controls for clean and octave outputs let players blend the
  two signals to taste. The all-analog signal path produces the warm, natural
  octave character that digital designs often struggle to replicate.

  Backed by Aguilar's three-year limited warranty to the original owner.
