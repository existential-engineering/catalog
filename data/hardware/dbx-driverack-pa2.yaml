  - Mic EIN: <-117 dB (22 Hz–22 kHz, 150 Ω)
  - CMRR: >45 dB
  - Output Connectors: 6× male XLR
  - Output Type: Electronically balanced, RF filtered
  - Output Impedance: 120 Ω
