description: The dbx DriveRack PA2 is a complete loudspeaker management system
  with 2 inputs and 6 outputs, featuring streamlined AutoEQ, enhanced Advanced
  Feedback Suppression, mobile device control via iOS/Android app, dbx
  compression and limiting, 8-band parametric EQ, subharmonic synthesis, and 100
  ms input delay. The dbx Type IV converter delivers 123 dB dynamic range with
  transient material.
details: |-
  The dbx DriveRack PA2 provides all the processing needed between a mixer and power amplifiers to optimize and protect loudspeakers. The PA2 introduces a streamlined AutoEQ algorithm for faster, more accurate automatic room equalization and an enhanced AFS algorithm for improved feedback elimination, building on the foundation of the PA+ with a modern control interface.

  Mobile device control via a dedicated app for Android, iOS, Mac, and Windows allows wireless control from the audience position during setup and soundcheck. A 100 ms input delay module enables precise synchronization between FOH loudspeakers and backline equipment. Per-channel driver alignment delays of up to 10 ms (60 ms total) support time-aligned multi-way systems.

  The dbx Type IV conversion system delivers 123 dB of dynamic range with transient material, while 112 dB A-weighted steady-state dynamic range and 0.003% THD+Noise ensure transparent, high-fidelity signal processing. Setup Wizards guide users through configuration, and the system supports full-range, 2-way, and 3-way crossover topologies.
specs: |-
