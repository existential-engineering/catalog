  - Driver Alignment Delay: 10 ms per channel (60 ms total)
  - Dimensions: 19" W × 5.75" D × 1.75" H (48.26 × 14.6 × 4.4 cm)
  - Weight: 5.25 lbs (2.4 kg)
  - Operating Voltage: 100–120 VAC or 220–240 VAC, 50/60 Hz
  - Power Consumption: 22 W
