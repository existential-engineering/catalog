name: HEDD Quantum
manufacturer: crane-song
primaryCategory: outboard
url: http://cranesong.com/Hedd_Quantum.html
description: HEDD Quantum is Crane Song's AD/DA converter and master clock unit,
  using the same sub-picosecond jitter clocking as the Avocet IIA DAC on both
  its AD and DA stages, with added toslink optical I/O, six new word clock
  outputs, and Crane Song's tube and tape DSP emulation.
details: |-
  HEDD Quantum uses the same sub-picosecond jitter clocking as the Avocet IIA DAC, applied to both the AD and DA sections. The result is very good imaging, a very open 3D sound, and very detailed transient response, and it is very accurate.

  Optical in and out (toslink) have been added. HEDD Quantum can also serve as a master clock: six new word clock (WC) outputs let it provide clocking at the same time the AD and DA are in use.

  In addition to the new AD, DA, clocking, I/O, and WC outputs, HEDD Quantum still has the same DSP emulation of Triode and Pentode tubes and tape emulation.

  Operational modes let the DA and AD be used at the same time, at different sample rates. In DIGI mode the unit runs digital in from one of three sources and outputs on all three digital outputs and the analog output at the same time; in ANA mode the input is analog and it outputs on all three digital outputs and the analog output at the same time.

  Dither, which is analog generated, is selectable for 16 or 20 bit. The AD, DA, and ASRC chips are high-end AKM 32-bit parts, coupled with proprietary analog filtering and clocking.
specs: |-
  - Sub-picosecond jitter clocking applied to both AD and DA (same clocking used in the Avocet IIA DAC)
  - Toslink optical input and output
  - Six new word clock (WC) outputs for master-clock operation
  - DSP emulation of Triode and Pentode tubes, plus tape emulation
  - DA and AD can be used simultaneously at different sample rates
  - DIGI and ANA operational modes output on all three digital outputs and the analog output simultaneously
  - Analog-generated dither, selectable for 16 or 20 bit
  - 32-bit AKM AD, DA, and ASRC chips with proprietary analog filtering and clocking
