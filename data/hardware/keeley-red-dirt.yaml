details: |-
  The Red Dirt Overdrive set out to find a classic drive sound while adding versatility for a wider range of playing styles. Founder and head engineer Robert Keeley combined the sounds of his earlier Mod Plus and Baked modified pedals with refinements from his custom pedal line.

  A Keeley-designed FET input stage gives the overdrive a tube-like breakup intended to make lead lines sing and rhythm playing more dynamic and expressive. The result is a dynamic drive with enough crispness and clarity to cut through a dense mix while keeping a full midrange.

  The pedal is hand-built in the USA with premium components, and is described as a Tube Screamer style overdrive. The page also carries an instructions link.
