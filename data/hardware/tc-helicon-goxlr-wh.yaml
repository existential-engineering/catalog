description: Desktop broadcast mixer for streamers in a white finish, combining
  a four-channel USB audio path with motorized faders, a Midas microphone
  preamp, a sample board and on-board vocal effects.
details: |-
  GoXLR-WH is the white-finish version of GoXLR, a desktop broadcast mixer built around a four-channel USB audio path. Microphone, game, music, chat and system audio are balanced in real time on motorized faders, each with an LCD scribble strip that can be relabelled.

  The microphone channel runs through a low-noise Midas preamp. On-board processing covers equalization, compression, de-essing and gating, and the vocal effects section adds reverb, echo, pitch shift, formant shift, robot, megaphone and HardTune, all handled on the hardware rather than on the host CPU.

  A sound board with sample pads and recording holds bumpers and clips for instant playback, and a cough button mutes the microphone while it is held.

  Setup and recall run through the GoXLR app, which is required to operate the unit and is published for Windows only. The app also drives the RGB lighting, the mixer assignments and the stored effect presets.
specs: |-
  - Four-channel USB mixer with motorized faders and LCD scribble strips
  - Midas low-noise microphone preamp for the XLR input
  - On-board equalization, compression, de-essing and gating
  - Vocal effects: reverb, echo, pitch shift, formant shift, robot, megaphone and HardTune
  - Sound board with sample pads and on-board sample recording
  - Cough button for momentary mute
  - Full RGB lighting control
  - Requires the GoXLR app, published for Windows 7, 8, 10 and 11, with no official macOS or Linux build
  - Powered from an external 12 V DC adapter
  - White enclosure, electrically identical to the black GoXLR (0803-AAA)
