description: A dark-voiced reverb with three modes, Reverse, Shimmer and Hall.
details: |-
  The Nocturner is a dark-voiced reverb with three modes, Reverse, Shimmer and Hall. The Hall mode gives deep, watery halls of reverberation, the Shimmer mode adds bright highlights over the decay, and the Reverse mode plays the reverb tail backwards.

  The page positions it as darker in voice than the maker's Aurora reverb, and notes that its Shimmer and Reverse voices are shared with the Sojourner.

  The pedal is presented as one to let run while experimenting with deep layers of reverb, or to switch between modes so that shimmering washes sit over the playing. Most of the product page is given over to a quoted Sylvia Plath poem rather than to specifications.
specs: |-
  - Three reverb modes: Reverse, Shimmer and Hall
  - Darker voicing than the maker's Aurora reverb
  - Shimmer and Reverse voices shared with the Sojourner
