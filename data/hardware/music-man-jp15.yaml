details: |-
  The John Petrucci JP15 is a signature electric guitar developed in collaboration between John Petrucci and Ernie Ball Music Man. The lightweight okoume body is paired with a hand-selected maple top — quilted or flame — in striking finishes including Red Tide, Green Tiger Eye, Ultramarine, and Amber Waves.

  The roasted figured maple neck and fingerboard deliver a smooth, fast-playing surface enhanced by 24 stainless steel medium-jumbo frets and a hand-rubbed oil-and-wax finish. A 5-bolt sculpted neck joint provides comfortable access to the upper register.

  Electronics include DiMarzio Illuminator humbuckers, a Fishman Powerbridge piezo system in a custom floating Music Man JP tremolo, and an onboard 20+ dB gain boost. The piezo system supports mono or stereo output, allowing magnetic and piezo signals to be routed through separate chains.

  Dual 3-way toggle switches handle pickup selection and magnetic/piezo blending. A push/push tone knob splits the coils in the middle position for added versatility. Additional features include locking Schaller M6-IND tuners and a Mono case, with 6- and 7-string configurations available.
specs: |-
  - Body wood: Okoume with figured maple top (quilted or flame)
  - Body finish: High gloss polyester
  - Body dimensions: 12-3/8" wide, 1-3/4" thick, 37" long
  - Neck wood: Figured roasted maple
  - Neck finish: Hand-rubbed oil and wax
  - Neck width: 1-11/16" at nut, 2-1/4" at last fret
  - Neck radius: 17"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Figured roasted maple
  - Fret markers: Custom JP15 inlays
  - Frets: 24 medium-jumbo stainless steel
  - Scale length: 25-1/2"
  - Pickups: DiMarzio Illuminator (HH)
  - Bridge: Custom floating Music Man JP tremolo with Fishman Powerbridge piezo saddles
  - Electronics: Custom Music Man active preamp; push/push volume with 20+ dB gain boost; push/push passive tone (0.022uF cap)
  - Switching: 3-way pickup selector; 3-way piezo/magnetic selector
  - Tuning machines: Schaller M6-IND locking
  - Shielding: Graphite acrylic resin cavity; aluminum control cover
  - Headstock length: 5-7/8"
  - Strings: 10p-13p-17p-26-36-46 (Ernie Ball RPS 10 Slinkys)
  - Configurations: 6-string and 7-string
  - Case: Mono
