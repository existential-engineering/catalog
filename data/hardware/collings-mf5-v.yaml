name: MF5-V
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf5-v/
description: The MF5-V is a premium F-style mandolin featuring the same
  construction and appointments as the standard MF5 but with an oil-based alkyd
  resin varnish finish and an ivoroid-bound ebony pickguard. The varnish finish
  allows the tonewoods to resonate more freely compared to lacquer-finished
  models.
details: |-
  The MF5-V is an F-style mandolin with a carved Adirondack spruce top and Eastern flamed maple back, sides, and neck, finished in high gloss alkyd resin varnish. It features ivoroid binding with black/white side purfling on the body, fingerboard, and peghead, along with an ebony fingerboard with MOP dots, ebony bridge with adjustable saddle, rounded V neck profile, dovetail neck joint, and fully adjustable truss rod. A compound fingerboard radius of 5 1/2" to 11 5/8", 1 1/8" nut width, and 1 9/16" string spacing provide comfortable playability. Hardware includes nickel Gotoh tuners with ivoroid buttons and the original tailpiece with engraved border. An ivoroid-bound ebony pickguard distinguishes it from the standard MF5. Ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Construction: F-style
  - Top: Adirondack spruce
  - Back & Sides: Eastern flamed maple
  - Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Bracing: Tone bars
  - Body Binding: Ivoroid with black/white side purfling
  - Fingerboard Binding: Ivoroid with black/white side purfling
  - Peghead Binding: Ivoroid with black/white side purfling
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo and flourish
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Pickguard: Ebony with ivoroid binding
  - Tailpiece: Original with engraved border
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: High gloss alkyd resin varnish
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
