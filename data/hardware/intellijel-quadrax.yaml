description: Whether you are exploring the unique channel functions, CV
  modulation matrix or chaining options, it is quickly apparent that there are
  infinite possibilities to explore. This powerful and tactile modulation
  generator will quickly become the beating heart of your modular system.
details: |-
  The Intellijel Quadrax consists of four independent, CV-controllable channels, each of which can be configured to perform any one of the following functions: an AD (Attack, Decay) envelope, an AHR (Attack, Hold, Release) envelope, a cycling envelope (resulting in a unipolar LFO), a pulse burst generator, or a morphing, bipolar beat syncable LFO.

  The envelopes all feature a continuously variable response curve, ranging from logarithmic through linear to exponential, and each stage can be as snappy as 0.05 ms to as lengthy as 20 seconds. Adjusting the curve time will not affect your overall envelope length. Each of the main modes have an alternate, the envelopes allow you to mirror the rising curve shape on the fall stage.

  Channels can be chained together to create complex multi-stage envelopes, with each channel triggered by the previous channel's trigger input, end-of-rise, or end-of-fall. This enables multiple function generators to fire simultaneously, or the creation of complex multi-stage envelopes.

  Quadrax remembers its current state (Mode and CV assignments, channel links, etc) and retains that state even if power is removed, meaning Quadrax will always turn on in exactly the same state as you last left it.
specs: |-
  - Width: 14HP
  - Depth: 38mm
  - Power: 106mA @ +12V, 9mA @ -12V
  - Four independent CV-controllable channels: AD envelope, AHR envelope, cycling envelope (LFO), pulse burst generator, or morphing bipolar beat-syncable LFO
  - Continuously variable response curve (logarithmic to exponential), stage times from 0.05ms to 20s
  - Burst mode: full control over pulse burst length, count, shape, and amplitude ascend/descend
  - User-selectable maximum output level of 10V or 5V (AD/AHR/Cycling/Burst modes)
  - LFO mode with morphing waveshape and TRIG input beat-sync; alternate mode becomes an LFV (Low Frequency Vacillator)
  - Channels chainable for complex multi-stage envelopes via trigger/end-of-rise/end-of-fall
  - Four freely-assignable, step-attenuverted CV inputs via built-in CV matrix
  - Non-volatile state memory: retains mode and CV assignments after power loss
