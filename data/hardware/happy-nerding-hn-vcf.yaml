description: HN VCF is a 6 HP state variable filter with 12 dB low pass, 12 dB
  high pass, 6 dB band pass and an 18 dB low pass with extra drive, each of its
  three parameters offering bipolar CV control.
details: |-
  HN VCF is a state variable filter having 12 dB low pass, 12 dB high pass and 6 dB band pass responses, plus an 18 dB low pass marked LP! because it has extra drive.

  All three parameters, Freq, Resonance and Drive, have dual knobs with the outer knobs controlling bipolar CV amount. These affected CVs are then shown by the relative green and blue LEDs.

  The possibility to have CV over Resonance and Drive makes it a very capable 6 HP filter.

  HN VCF can be used to transform mono sound to pseudo stereo. To do this the user should send the LP output to one channel and LP! to another. With some Drive added to the sound it starts to be spread over the stereo field.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - State variable filter topology
  - 12 dB low pass, 12 dB high pass and 6 dB band pass outputs
  - 18 dB low pass output marked LP! with extra drive
  - Dual knobs on Freq, Resonance and Drive, outer knob sets bipolar CV amount
  - Green and blue LEDs show the applied CV
  - Pseudo stereo operation by patching LP and LP! to separate channels
  - 6 HP wide
  - Reverse power protected
