description: The ultra portable and powerful SRM350 powered loudspeaker is great
  for small events, bars, and practice spaces.
details: |-
  The Mackie SRM is the most widely used portable loudspeaker ever. Its ease-of-use, professional sound quality and durable portability have made it a live sound legend, now with more power and flexibility.

  Modern tools such as application-specific speaker modes and an automatic feedback destroyer each sit behind a single-button interface, so the system is optimised in seconds. High-Definition Audio Processing, a precision 2-way crossover and driver time alignment with phase correction handle the rest, built on patented acoustic correction developed with the touring engineers at EAW.

  An integrated 2-channel mixer with dual Mackie Wide-Z inputs handles anything from mics to guitars to mixers with a single twist of the gain knob, and stereo RCA inputs connect a music source directly. Smart Protect DSP steps in to protect the system when it is pushed too hard.

  A monitor-specific cabinet angle and voicing mode suit stage use, and the cabinet can be flown for permanent installation.
specs: |-
  - 1000W peak / 500W rms system power (LF 800W peak Class-D, HF 200W peak Class-AB)
  - 10.0" / 254 mm paper cone woofer with ferrite magnet
  - 1.4" / 36 mm titanium diaphragm compression driver
  - Frequency response (-3 dB): 55 Hz - 20 kHz
  - Frequency response (-10 dB): 50 Hz - 23 kHz
  - Maximum peak SPL: 126 dB
  - Crossover point: 3 kHz
  - Dispersion (H x V): 90 x 80 degrees, monitor angle 50 degrees
  - High-Definition Audio Processing with driver time alignment and phase correction
  - One-button speaker mode selection: PA, DJ, Monitor and Soloist
  - One-button automatic Feedback Destroyer
  - Smart Protect DSP with peak and RMS limiting plus power supply and amplifier thermal protection
  - Integrated 2-channel mixer with dual Mackie Wide-Z inputs and stereo RCA inputs
  - Male XLR Thru output, passive or active depending on the Ch 1 / Mix switch
  - Universal power supply 100-240 VAC, 50-60 Hz, 130W
  - Polypropylene cabinet with black textured finish and weather-resistant perforated metal grille
  - Floor mount, pole mount or fly via the optional bracket kit
  - Dimensions (H x W x D): 20.8 x 13.1 x 12.3 in / 527 x 333 x 311 mm
  - Weight: 23 lb / 10.4 kg
