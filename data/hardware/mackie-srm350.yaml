details: |-
  The Mackie SRM is the most widely used portable loudspeaker ever. It's unparalleled ease-of-use, professional sound quality and indestructible portability has made it a live sound legend. Now with more power and flexibility than ever.

  BEYOND PROVEN — The 1000W SRM350 features modern tools like application-specific speaker modes and an automatic feedback destroyer, each with a single-button interface that gets you optimized performance in just seconds. And with the integrated 2-channel mixer, you can easily mix multiple sources.

  1000W system power paired with custom transducers deliver gig-level volumes with room to spare, including a 10" high-output LF driver and 1.4" titanium dome compression driver. High-Definition Audio Processing delivers professional sound with unmatched clarity via patented acoustic correction developed with touring geniuses at EAW, a precision 2-way crossover, and driver time alignment and phase correction.

  Quick one-button Speaker Mode selection provides application-specific voicing (PA, DJ, Monitor and Soloist). Effortlessly eliminate nasty feedback with one-button automatic Feedback Destroyer, and use the integrated 2-channel mixer featuring dual Mackie Wide-Z inputs to handle anything from mics to guitars to mixers with a single twist of the gain knob. Includes stereo RCA inputs for easy connection to music source.

  Smart Protect DSP kicks in to protect your investment when things get pushed a little too hard. Monitor-specific angle and voicing mode is perfect for cutting through on stage, and the speaker is flyable for permanent install, both vertically and horizontally, with a proven highly-durable, portable design.
