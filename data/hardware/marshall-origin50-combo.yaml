description: A 50W valve combo amplifier from Marshall's Origin series, built around a single 12" Celestion G12N-60 Midnight 60 speaker. The Origin 50C pairs ECC83 preamp valves with EL34 power valves for a classic British rock voice and uses Marshall's Powerstem switching to step the amp down from 50W to 10W or 5W without altering its sonic character, making cranked tones usable at lower volumes. The single-channel layout offers Gain, Bass, Middle, Treble and Volume controls, a Tilt control that blends between Normal and Bright inputs, and a footswitchable Gain Boost. Rear-panel features include an effects loop, an emulated DI line output for silent recording, multiple speaker outputs with selectable impedance, and a 2-way footswitch jack for gain boost and FX loop on/off.
details: |-
  Innovate and craft your sound using this 50W combo. A Celestion Midnight 60 12" type speaker provides a classic all-valve, rich and harmonic Marshall tone.

  Powerstem, power reduction technology, perfectly matches your tone at 50W, 10W and 5W, allowing you to perform on stage or practise in the studio. It works by reducing the voltage rails around the power amplifier rather than by traditional pentode or triode reduction, so the sonic character is unaltered at any volume.

  Use the tilt control to fine-tune your sound, smoothly transitioning from a standard tone to a high treble setting. The attribute is drawn from the multi-input technology present in iconic amplifiers such as the 1959SLP and JTM45, condensed into a single knob.

  With a 2-way footswitch you can control the gain boost and turn the FX loop on and off. Engaging the boost introduces an additional layer of gain, adding a distinctive crunch to the tone.

  The Celestion G12N-60 Midnight 60 speaker captures the essence of the iconic Celestion style, providing balanced cleans and sparkling high frequencies, with a deep low-end warmth and mid-range character when pushed. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: Origin50C
  - Range: Origin
