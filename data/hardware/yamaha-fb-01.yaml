description: >-
  The Yamaha FB-01 is an inexpensive 8-part multitimbral digital FM synthesizer module
  released in 1986. It uses a 4-operator FM synthesis architecture with 8-voice polyphony,
  offering a simpler tonal character than higher-end 6-operator FM instruments like the
  DX-7. The module includes 240 presets and 96 user patch slots covering organ, piano,
  brass, bass, guitar, percussion, and lead sounds.
details: |-
  The FB-01 represents an affordable entry point into Yamaha's FM synthesis lineup from the mid-1980s. Its 4-operator architecture provides less sound design depth than the flagship DX-7's 6-operator engine, but still delivers the characteristic bright, metallic tones associated with FM synthesis.

  The module is 8-part multitimbral, allowing it to produce multiple different sounds simultaneously across separate MIDI channels. This made it a popular choice for sequencer-based music production setups of the era, where a single module could cover an entire arrangement.

  Editing sounds on the FB-01 requires external tools such as dedicated editor software like Unisyn or SysEx messages sent from a sequencer, as the unit lacks onboard sound editing controls. Despite this limitation, the module found use among notable electronic artists including Hardfloor and the Moog Cookbook.
specs: |-
  - 4-operator digital FM synthesis
  - 8-voice polyphony
  - 8-part multitimbral
  - 240 preset sounds
  - 96 user patch memory slots
  - MIDI control
  - No built-in filter
  - No built-in effects
  - Rack-mount module (no keyboard)
