description: The R4 MultiTrak is a compact four-track recorder with a dedicated bounce track, two XLR/TS combo inputs, a built-in omnidirectional mic and 32-bit float recording that needs no input gain set. Insert and send effects, a rhythm section of more than 80 drum patterns and a tuner are built in, and over USB-C it works as a 2-in/2-out audio interface.
details: |-
  The R4 MultiTrak is a compact four-track recorder built around a dedicated bounce track. Four tracks can be recorded, mixed and bounced down to that fifth track, which frees the four up for more layers, and the bounce can be run quickly or mixed in real time and undone if it misses. Every take is kept as its own file on the card even after it has been bounced.

  Two XLR/TS combo inputs take mics, guitars, basses and keyboards, with +48 V phantom power switchable per input and Hi-Z on the TS side at 1 MOhm so an instrument can be plugged in directly. A built-in omnidirectional mic covers acoustic guitar, vocals and quick reference takes. Dual A/D converter circuits and 32-bit float recording mean no input gain has to be set.

  Effects come in two layers. An insert effect chain of two effects, drawn from dozens of types equivalent to Zoom's multi-effects products, is applied to INPUT A or the built-in mic while recording, and covers amp simulation, distortion, chorus, delay and compression. A send layer gives every track a 3-band EQ, pan, echo and reverb, with the echo time, echo repeat and reverb decay adjustable. These are mix settings and do not alter the recorded files.

  A rhythm section holds more than 80 drum patterns across rock, hip hop, funk and heavy metal, usable as a click or mixed into a bounce, and a tuner with chromatic and flat modes reads whichever input is selected. Four faders and dedicated transport, effect, rhythm and bounce buttons keep the usual jobs off the menus, and a 2-inch full-colour LCD shows the project.

  Over USB-C the R4 works as a 2-in/2-out 32-bit float audio interface at 48 kHz for a computer or smartphone, and the same port handles file transfer and power. It runs on four AA batteries, USB bus power, a 5 V portable battery or the AD-17 adapter, for about 7 hours on alkalines and about 14 on lithium. A 1/4-inch-20 thread on the underside takes a tripod or mount.
specs: |-
  - 4 tracks of recording plus a dedicated bounce track
  - Inputs: 2 mono XLR/TS combo jacks plus 1 mono built-in mic, output: 1 headphone jack
  - Input connectors: 2 XLR/TRS combo jacks, balanced, XLR: 2 HOT
  - Input gain: no adjustment required, dual A/D converter circuit used
  - Input impedance: XLR 2.3 kOhm, TS 1 MOhm
  - Maximum input level: XLR +4 dBu, TS +10 dBu
  - Phantom power: +48 V, switchable separately for INPUT A and INPUT B
  - Equivalent input noise: XLR -120 dBu or less (IHF-A), TS -107 dBu or less (IHF-A)
  - Input frequency response: XLR -0.5 / +0.0 dB, 20 Hz to 20 kHz. TS -0.2 / +0.0 dB, 20 Hz to 20 kHz
  - Built-in mic: omnidirectional, no gain adjustment required, maximum sound pressure input 115 dB SPL
  - Headphone output: 1 stereo 3.5 mm mini jack, output impedance 10 Ohm, maximum output level 20 mW + 20 mW into a 32 Ohm load
  - Maximum simultaneous recording tracks: 2
  - Recording format: WAV, 48 kHz, 32-bit float, mono
  - Recording media: microSDHC cards 4 GB to 32 GB and microSDXC cards 64 GB to 1 TB
  - Display: 2-inch full-colour LCD, 240 x 320
  - USB connector: USB Type-C, requires a cable that supports data transfer. USB bus power is supported
  - Audio interface: 2 in / 2 out, 48 kHz, 24-bit or 32-bit float, USB 2.0 High Speed
  - Mass storage function: USB 2.0 High Speed
  - Insert effects: two effects at a time from dozens of types, applied to INPUT A or the built-in mic while recording only
  - Send effects per track: 3-band EQ (High, Middle, Low), pan, Echo and Reverb, with Echo Time, Echo Repeat and Reverb Decay parameters
  - Rhythm section: over 80 drum patterns with tempo, volume and precount settings
  - Tuner with selectable type including chromatic, flat tuning up to three semitones and adjustable A calibration
  - Power: 4 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 adapter (5V/1.0A) or USB bus power
  - Estimated continuous operation time: about 7 hours alkaline, about 6 hours NiMH 1900 mAh, about 14 hours lithium
  - Power consumption: 5 W
  - Dimensions: 74 mm (W) x 138 mm (D) x 36 mm (H)
  - Weight including batteries: 287 g
  - Tripod mounting threads on the underside, 1/4-inch-20
