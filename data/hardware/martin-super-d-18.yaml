details: |-
  The Martin Super D-18 enhances a classic with a larger body for deeper bass and even greater projection. With 20% more internal air volume than a standard Dreadnought, it delivers thunderous bass, increased volume, and extended dynamic range.

  A solid spruce top paired with genuine mahogany back and sides provides warmth and clarity, while forward-shifted Golden Era scalloped X-bracing supports the larger body's response and projection.

  Appointments include black binding, abalone dot inlays, and a satin-finished neck. The ebony bridge and fingerboard round out a bold evolution of an acoustic icon, offered as part of Martin's Standard Series lineup for 2026.
specs: |-
  - Body Size: Super D-14 Fret
  - Top: Spruce with Aging Toner finish
  - Back & Sides: Genuine Mahogany
  - Bracing: Forward-Shifted Golden Era Scalloped X-Bracing
  - Scale Length: 25.4"
  - Nut Width: 1 3/4"
  - Neck Shape: GE Modified Low Oval with High-Performance Taper
  - Fingerboard: Ebony
  - Frets: 20 total, joins body at 14th fret
  - Bridge: Ebony, GE Modern Belly with drop-in saddle
  - Binding: Black
  - Inlays: Abalone Dot
  - Neck Finish: Satin
  - Electronics: None
