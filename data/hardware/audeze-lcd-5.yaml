details: |-
  The LCD-5 is the latest iteration in Audeze's flagship planar magnetic headphone lineage, following the LCD-2 (2009), LCD-3 (2011) and LCD-4 (2015).

  The headphones feature patent-pending Parallel Uniforce voice coils that employ varying width parallel traces to keep impedance low and provide increased voltage headroom by altering the current density within each trace, reducing distortion and enhancing sonic resolution through improved diaphragm control.

  Weighing only 420 grams (one-third lighter than the LCD-4), the LCD-5 emphasizes comfort for extended listening sessions. Every part has been re-engineered using materials such as magnesium, aluminum and acetate which offer light weight and high rigidity. Sculpted earpads minimize fatigue while maintaining acoustic seal integrity across various ear shapes.

  The acoustic design incorporates newly optimized Fazor waveguides and an acoustically transparent mesh architecture, achieving pinpoint imaging and a clean, clear soundstage. The structural materials are hand-assembled in Audeze's California workshop.

  The included balanced cable uses directional OCC high-purity copper strands that provide a low capacitance and low resistance path for the signal, terminating in a 4-pin XLR with a single-ended adapter included.
