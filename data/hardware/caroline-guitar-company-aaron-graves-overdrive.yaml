description: >-
  The Aaron Graves Overdrive brings both clarity and heft to the proceedings,
  featuring dual drive circuit modes — a classic preamp voicing and a Mode B
  power amp clipping circuit — along with a bass voicing selector and generous
  gain on tap.
details: |-
  We've had customers who just want our preamp from our 'pawnshop' Parabola &
  Météore as its own pedal. It would have been a layup of a release. But Aaron
  always wanted to see his friends grow. So while on first glance this pedal
  looks like a straightforward overdrive/preamp, it has some surprises.

  Whether on its own or stacked with other drives, the Aaron Graves Overdrive
  brings both clarity and heft to the proceedings. And if it can get a bit
  gnarlier than people expected, we were reminded that Aaron learned guitar from
  learning Misfits songs.

  We heard people missed the 'Mode B' circuit from our old Haymaker and Icarus
  V1 because it resembled power amp clipping. So we brought it back, but added
  a second gain stage to our classic voicing to balance the two drive styles
  more evenly.

  The bass voicing selector comes from listening to those of you who work in
  studios, love humbuckers, and/or like using the neck pickup. And there is
  PLENTY of gain and volume on tap.

  A portion of the sales proceeds from these pedals will go to Fork & Spoon
  Records, so that Aaron's friends may continue his work in creating music and
  community.
specs: |-
  - Dual drive circuit modes (classic preamp voicing + Mode B power amp clipping)
  - Second gain stage added to balance the two drive styles
  - Bass voicing selector
  - High gain and volume on tap
  - Weight: 18 oz
  - Dimensions: 2 × 6 × 4 in
