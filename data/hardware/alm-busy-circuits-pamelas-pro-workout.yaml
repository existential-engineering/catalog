description: >-
  A compact 8HP programmable clocked modulation source featuring 8 highly
  editable outputs that produce control voltage signals synchronized to a
  BPM-based master clock, with support for Euclidean patterns, probability,
  quantization, and extensive CV control.
details: |-
  Pamela's PRO Workout is a compact 8HP programmable clocked modulation source for Eurorack systems. Its 8 voltage outputs are each independently configurable with clock divisors and multipliers from /16384 to x192.

  Outputs support numerous waveform types from simple triggers to complex envelopes, ratchets, and random signals. Euclidean and probability-based beat looping enable intricate rhythmic patterns. Off-grid Flex microtiming adds swing, humanization, and bouncing ball type timing effects.

  Four built-in CV inputs can be assigned to any output parameter with individual offset, attenuation, and monitoring. The module supports PPEXP1 and PPEXP2 expanders for additional outputs, and Axon-1/Axon-2 expanders for additional CV inputs. All settings persist across power cycles. USB-C port enables drag-and-drop firmware updates.
specs: |-
  - 8HP width, 32mm depth
  - +12V: 60mA, -12V: 10mA
  - 8 CV outputs (0–5V, 12-bit, 3.8kHz update rate)
  - 4 built-in CV inputs (0–5V)
  - Clock input (rising edge ≥700mV)
  - Run input
  - BPM range: 10–303 BPM
  - Clock divisors/multipliers: /16384 to x192
  - Expander support: PPEXP1, PPEXP2, Axon-1, Axon-2
  - USB-C for firmware updates
  - Reverse power protection
