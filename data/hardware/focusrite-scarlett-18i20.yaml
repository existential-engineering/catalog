description: Focusrite Scarlett 18i20 is the 4th generation of industry-leading
  USB Audio interfaces; including RedNet converters and eight 4th Gen Scarlett
  mic preamps.
details: |-
  The Scarlett 18i20 is Focusrite's 4th generation studio hub audio interface, built for engineers who need serious I/O. It provides 26 inputs and 26 outputs, including eight ultra-low-noise 4th Gen Scarlett mic preamps with 69dB of gain range, Auto Gain, Clip Safe, and two Air modes (Presence; Presence + Harmonic Drive) inherited from Focusrite's flagship RedNet converters.

  The front panel houses two combo XLR/jack inputs (with switchable instrument-level Hi-Z mode), two independent headphone outputs, and a built-in talkback mic. The rear adds six more combo mic/line inputs, ten balanced 1/4-inch line outputs (with alt speaker switching), two pairs of ADAT optical I/O (up to 16 channels at 44.1/48 kHz), stereo S/PDIF, MIDI in/out, BNC word clock output, USB-C, and an IEC mains inlet.

  A/D and D/A converters deliver up to 24-bit/192 kHz with 130 dB dynamic range on the outputs. The unit is 1U rack-mountable (rack ears included) and ships with Focusrite Control 2 desktop and mobile apps for remote preamp control, monitor management, and loopback routing.
specs: |-
  - 24-bit / 192 kHz resolution
  - 26 inputs / 26 outputs simultaneous I/O
  - 8 x 4th Gen Scarlett mic preamps with 69 dB gain range
  - Mic preamp dynamic range: 116 dB (A-weighted)
  - Mic preamp EIN: -127 dBu (A-weighted)
  - Auto Gain and Clip Safe
  - Two Air modes: Presence; Presence + Harmonic Drive
  - 2 x Hi-Z instrument inputs (front panel), 62 dB gain
  - 10 x balanced line outputs (1/4-inch TRS)
  - Line output dynamic range: 122 dB (A-weighted)
  - 2 x independent headphone outputs (33-300 Ω compatible)
  - 2 x ADAT optical I/O (up to 16 channels @ 44.1/48 kHz)
  - Stereo S/PDIF I/O (RCA)
  - MIDI In and Out (5-pin DIN)
  - BNC Word Clock Output
  - USB Type-C (USB 2.0)
  - A/D converter: 120 dB dynamic range
  - D/A converter: 130 dB dynamic range
  - Built-in talkback microphone
  - Alt speaker switching between two monitor pairs
  - Loopback functionality
  - 1U rack-mountable (rack ears included)
  - External 30 W power supply
  - Dimensions: 442 mm (W) x 46.55 mm (H) x 259.73 mm (D)
  - Weight: 3.304 kg
  - 3-year warranty
