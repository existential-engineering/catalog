description: The CT8.2 LCR incorporates two 8in Paper/Aramid Fibre woofers, a
  6in blue Aramid Fibre FST midrange, and 1.25in aluminium Nautilus tweeter in a
  passive crossover design. This speaker marries high efficiency and SPL
  capability to outstanding fidelity for cinema and music playback.
details: |-
  The CT8.2 LCR is a three-way open-box Custom Theatre loudspeaker and the latest addition to the Bowers & Wilkins CT800 Series, which brings the technology of the company's 800 Series stand-alone speakers to a home theatre installation. It is an entirely passive design with a passive crossover, installed inside home theatre cabinetry and driven from an external power amplifier.

  Bowers & Wilkins positions the model as marrying high efficiency and SPL capability to outstanding fidelity for both cinema and music playback. Its unique modular baffle design allows it to be used as a left, centre or right speaker in either a vertical or a horizontal position, which is what the LCR suffix denotes.

  The drive unit complement is a 32mm (1.25in) aluminium dome tweeter with Nautilus spiral tube loading, a 150mm (6in) Aramid Fibre FST midrange, and two 200mm (8in) Paper/Aramid Fibre bass cones. Crossover points are 400Hz and 4.5kHz.

  Sensitivity is 91dB (2.83V, 1m) and nominal impedance is 8 ohms with a 3 ohm minimum. Bowers & Wilkins recommends 50W to 500W of amplifier power into 8 ohms on unclipped programme, and frequency response is quoted as 39Hz to 24kHz plus or minus 3dB on the reference axis.

  The cabinet stands 1,000mm (39.4in) tall and weighs 36.3kg (80 lb). It is finished in black paint, which is the only finish offered.
specs: |-
  - Description: 3-way open-box system
  - Drive units: 1x 32mm (1.25in) aluminium dome with Nautilus spiral tube-loaded high-frequency; 1x 150mm (6in) Aramid fibre FST midrange; 2x 200mm (8in) Paper/Aramid fibre bass cones
  - Technical features: Nautilus spiral tube-loaded tweeter, Aramid fibre FST midrange, Paper/Aramid bass cone
  - Frequency range: -6dB at 31Hz to 45kHz
  - Frequency response: 39Hz - 24kHz +/-3dB on reference axis
  - Dispersion (within 2dB of reference response): left and right speakers horizontal over 60 degree arc, vertical over 20 degree arc; centre speakers horizontal over 40 degree arc, vertical over 20 degree arc
  - Sensitivity: 91dB (2.83V, 1m)
  - Harmonic distortion: <1% 80Hz - 20kHz; 2nd and 3rd harmonics (91dB, 1m) <0.5% 200Hz - 15kHz
  - Nominal impedance: 8 ohms (minimum 3 ohms)
  - Crossover frequencies: 400Hz, 4.5kHz
  - Recommended amplifier power: 50W - 500W into 8 ohms on unclipped programme
  - Max. recommended cable impedance: 0.1 ohms
  - Dimensions: height 1,000mm (39.4in), width 325mm (12.8in), depth 300mm (11.8in)
  - Net weight: 36.3kg (80 lb)
  - Finishes: cabinet black painted
  - Modular baffle design allows LCR use in either vertical or horizontal orientation
  - Passive: passive crossover, no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Shares the CT800 Series owner's manual with the other CT800 models
