description: The CT8.2 LCR incorporates two 8in Paper/Aramid Fibre woofers, a
  6in blue Aramid Fibre FST™ midrange, and 1.25in aluminium Nautilus™ tweeter in
  a passive crossover design. This speaker marries high efficiency and SPL
  capability to outstanding fidelity for cinema and music playback.
details: |-
  The CT8.2 LCR is a three-way open-box Custom Theater front speaker, built around two 200mm (8in) Paper/Aramid Fibre bass cones, a 150mm (6in) Aramid Fibre FST midrange and a 32mm (1.25in) aluminium dome Nautilus spiral tube-loaded tweeter. Unlike the CT8 LR and CT8 CC it uses a passive crossover, so it needs a single channel of power amplification.

  The information sheet calls it the latest addition to the CT800 Series, marrying high efficiency and SPL capability to outstanding fidelity for cinema and music playback.

  Its unique modular baffle design allows it to be used as an LCR speaker in either vertical or horizontal positions, and the dispersion figures are quoted separately for left and right use and for centre use.

  Like the rest of the Custom Theater range it is designed to be built into the fabric of the listening room or into custom furniture as part of a fully designed theatre concept, and is supplied without a grille because custom installs normally hide built-in speakers behind acoustically transparent cloth.
specs: |-
  - Description: 3-way open-box system
  - Technical features: Nautilus spiral tube-loaded tweeter, Aramid fibre FST midrange, Paper/Aramid bass cone
  - Drive units: 1x ø32mm (1.25in) aluminium dome with Nautilus spiral tube-loaded high-frequency
  - Drive units: 1x ø150mm (6in) Aramid fibre FST midrange
  - Drive units: 2x ø200mm (8in) Paper/Aramid fibre bass cone
  - Frequency range: -6dB at 31Hz to 45kHz
  - Frequency response: 39Hz to 24kHz ±3dB on reference axis
  - Dispersion (within 2dB of reference response), left and right speakers: horizontal over 60° arc, vertical over 20° arc
  - Dispersion (within 2dB of reference response), centre speakers: horizontal over 40° arc, vertical over 20° arc
  - Sensitivity (2.83V, 1m): 91dB
  - Harmonic distortion: <1% 80Hz to 20kHz
  - Harmonic distortion (2nd and 3rd harmonics, 91dB, 1m): <0.5% 200Hz to 15kHz
  - Nominal impedance: 8Ω (minimum 3Ω)
  - Crossover frequencies: 400Hz, 4.5kHz
  - Recommended amplifier power: 50W to 500W into 8Ω on unclipped programme
  - Max. recommended cable impedance: 0.1Ω
  - Dimensions: Height 1,000mm (39.4in), Width 325mm (12.8in), Depth 300mm (11.8in)
  - Net weight: 36.3kg (80lb)
  - Finishes: Cabinet Black painted
  - Modular baffle design allows vertical or horizontal LCR placement
