details: |-
  The K1 is a professional, compact, four-bus sound reinforcement console
  designed for a wide range of applications with installed and portable sound
  systems. The console is available in a range of free-standing frame sizes, and
  an 8ch rack-mount version.

  The modular construction, with input modules in blocks of four, provides ease
  of servicing and configuration to suit individual applications. All frames
  include a versatile Master section, combining group and main output masters,
  monitoring, Matrix outputs and two full stereo input channels.
