details: |-
  The G5135-PS Patrick Stump Signature Series Gretsch Stump-O-Matic Electromatic CVT is built to the exacting specs of the Fall Out Boy singer/guitarist.

  A tonally versatile solid-body model, it features a set neck and string-through-body design for ringing sustain, three Mega'Tron humbucking pickups, TV Jones-designed circuitry with two-position rotary switch for activating the middle pickup, three-position pickup selector toggle switch and two-position pickup kill switch.
