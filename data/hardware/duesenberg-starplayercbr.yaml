description: Made from Mahogany & Maple, the new Starplayer CBR is a distinct
  addition to the Starplayer family. Delivering vibrant, warm and powerful
  tones, the CBR brings something new to the table for all lovers of the
  Starplayer design language.
details: |-
  The Starplayer CBR retains the aesthetics of the Starplayer design while offering a different tonal response. Its body is a chambered Mahogany solidbody with an f-hole and a flat flamed Maple top, measuring 46 x 34 cm with 4.6 cm sides, finished in PUR lacquer with a transparent brown back and sides, cream single-layer binding and a black Custom pickguard (silver Custom on the Catalina Green and Vintage Orange finishes). Duesenberg describes the combination of chambered Mahogany, flamed Maple top and Maple neck as delivering a warm and powerful tone with the sparkle characteristic of the brand.

  The neck is a set-in, one-piece Maple neck in a Medium D shape, 42.5 mm wide at the nut and 52 mm at the 12th fret, with a steel dual-action truss rod and a Rosewood headstock veneer. The Indian Rosewood fingerboard has a 305 mm radius, no binding, Vintage Pearloid dot inlays and 22 jumbo frets, on a 648 mm / 25.5 inch scale. Every Duesenberg instrument is run through the company's Plek process for level, buzz-free frets, then finished and set up by hand by one of its luthiers, who signs the inside of the instrument.

  Electronics pair a Duesenberg Domino P90 in the neck position with a Duesenberg GrandVintage Humbucker at the bridge, controlled by one volume, one tone and a 5-way pickup selector using Duesenberg's Flextone+ wiring. Beyond the three standard pickup positions, the Flextone+ circuit adds two intermediate combinations, for five sounds in total. Duesenberg's pickups use German Silver baseplates and covers, chosen because the company says it does not affect the frequencies the pickup transmits, and insulated wire from a German copper wire factory wound slowly to imitate hand winding.

  Hardware comprises Duesenberg Z-Tuners with a Blood-Guard string post, a Duesenberg Steel Saddle Bridge and the newly designed Duesenberg Diamond Prestige Tremola with a flat-arm design that references the company's early instruments. Strap pins are Duesenberg Standard and Straplock compatible, hardware finish is nickel, and the guitar ships with Duesenberg Custom 10/50 strings.

  The instrument is supplied with a Duesenberg Custom Line Case as standard, described as a classically shaped, handcrafted flightcase-quality case, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12", no binding
  - Inlays: Vintage Pearloid dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Rosewood veneer
  - Body type: Chambered solidbody, Mahogany, f-hole
  - Body top: Flamed maple
  - Body dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Body height (sides): 4.6 cm / 1.8"
  - Binding: Cream, single layer
  - Pickguard: Black Custom (or Silver Custom on Catalina Green and Vintage Orange)
  - Finish: PUR lacquer. Back and sides Transparent Brown
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Diamond Prestige Tremola (flat arm)
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 5-Way Pickup Selector ("Flextone +" wiring)
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
