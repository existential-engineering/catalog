description: The world's first 500 series audio processor with Twin Tone-Amp
  architecture, accepting analog plugins called Colour Modules. Functions as
  both a microphone preamp and line-level processor, featuring Twin MOJO Amps
  inspired by American (A) and British (N) console designs, a Baxandall Tone EQ
  section, and full Colour Format module compatibility.
details: |-
  The Chroma operates in two primary modes: Mic and Mix/Line. In Mix/Line mode it provides 0 to +26 dB gain (or +26 to +52 dB in High Gain mode). In Mic mode gain ranges from +8 to +34 dB (or +34 to +60 dB in High Gain mode). It includes 48V phantom power, polarity reverse, and a Colour Drive control (-6 to +18 dB) with a Colour Mix crossfade between processed and dry signals. The Baxandall Tone EQ offers switchable Low Frequency (Subsonic 30 Hz or Bass 60 Hz at +3 dB) and High Frequency (Presence, Air, or Vintage filter at +4 dB) options. Each unit accepts one mono Colour Module per channel slot, compatible with Louder Than Liftoff and third-party Colour Format modules (e.g., DIY Recording Equipment). Custom American-made transformers and ROGUE FIVE discrete op amps (2520 footprint compatible) are used throughout. High-temperature PCB material (Tg 170), RoHS compliant (lead-free), and 0.5% or 0.1% thin-film audio resistors. Designed and assembled in Silicon Valley, California.
