specs: |-
  - Overview
  - Specifications
  - Video/Reviews
  - The LT5204 5150W 4 Channel PFC Power Amplifier is a lightweight power amp which provides unlimited flexibility with pure amplification of the original signal source to extreme levels, covering all frequencies without added color. The LT5204 features a single space 1U frame, is 2 ohms capable, and includes PFC Power Factor Correction, which is internationally recognized as the foremost self-regulating power supply for high-end amplifiers. The LT5204 has exceptional headroom with lower power requirements than amps with a traditional power supply. Other models available in the LT Series are the LT2000 2010W 2 Channel PFC Power Amplifier, and the LT5800 2 Channel 5760W PFC Power Amplifier. The LT5204 4ch model delivers 4x 440W RMS at 8 ohms, 4x 780W at 4 ohms and 4x 1290W at 2 ohms. The LT5204 may be configured into two bridged outputs to deliver 2575W into two bridged 4 ohms loads.
  - » Power: 4x440WRMS @ 8ohms, 4x780W @ 4ohms, 4x1290W @ 2ohms, 2x2575W Bridged @ 4ohms » 70V Distribution System: 900W x 2 » Active PFC Power Factor Correction » Space saving lightweight 1-U frames » High slew rate class D design » Natural, pure-state amplification » 2 ohm operation, 4 ohm bridged design » For 70V distribution systems » Soft-Start 100-240VAC 50-60Hz » PowerCON AC connector » Front to rear cooling system » Protect and Limiter circuits » IEC60065 compliant, CB certified » Up to 12 LT amplifiers in one 12U rack case » Net Weight: 22.4lbs » 1 Year Warranty
  - "My amps did arrive in time for the weekend of gigs! They ran 8 channels of monitors for 12 hours a day all weekend, and worked perfectly. I can pick up the amp rack with one hand. I am very pleased and will be ordering more! I had been researching class D 4 channel amps to replace my 25 year old and very heavy QSC monitor racks. I have a few other older Carvin products (2 amps, a powered speaker, and some TRX boxes), so I immediately went to look at the spec sheets. They looked like they would be exactly what I wanted and I was correct! Thanks." Chris H. Reelaudio - GA "The 1st LT5204 amplifier I installed at an office complex last week sounds great. This was a 70v line system with (6) in-ceiling speakers tapped at 15-watts each, & (2) sub woofers in-ceiling speakers tapped at 40-watts each on (2) amplifier channels. (2) other rooms are 8-ohms wall mount speakers (1) each on (2) amp channels... I was impressed." Don S. - TX
