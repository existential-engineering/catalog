details: |-
  The CDMK Series are complete drum microphone kits featuring a
  second-generation design from Avantone Pro. Each kit includes a combination
  of the Mondo kick mic, ADM snare mic, ATOM tom mics, and (on higher
  configurations) CK-1 FET condenser mics for overheads or hi-hat.

  A proprietary feature includes machined inserts on the barrel of each
  microphone body that allow SSM shockmount O-rings to lock the mics securely
  in place, preventing shifting and slippage during use.

  Each kit is packaged in a custom vintage tweed case that is hand-built for
  heavy-duty storage, featuring metal corners, locking latches, a high-density
  foam tray, plush lining, a tweed/faux-alligator exterior, and a Cabernet
  wine-red plush interior.

  Kit configurations:
  - CDMK-4: 1× Mondo, 1× ADM, 2× ATOM, 3× PK-1 Klamps, 4× SSM, Case
  - CDMK-5: 1× Mondo, 1× ADM, 3× ATOM, 4× PK-1 Klamps, 5× SSM, Case
  - CDMK-6: 1× Mondo, 1× ADM, 2× ATOM, 2× CK-1, 3× PK-1 Klamps, 6× SSM, Case
  - CDMK-7: 1× Mondo, 1× ADM, 3× ATOM, 2× CK-1, 4× PK-1 Klamps, 7× SSM, Case
  - CDMK-8: 1× Mondo, 1× ADM, 3× ATOM, 3× CK-1, 4× PK-1 Klamps, 8× SSM, Case
specs: |-
  - Mondo Type: Dynamic, Cardioid, 20Hz–15kHz, 210Ω, 145dB max SPL
  - ADM Type: Dynamic, Cardioid, 50Hz–16kHz, 520Ω, 145dB max SPL
  - ATOM Type: Dynamic, Cardioid, 30Hz–15kHz, 220Ω, 145dB max SPL
  - CK-1 Type: True FET Condenser, 30Hz–15kHz, 200Ω, 138dB max SPL
  - CK-1 Power: 48V Phantom
  - All dynamic mics: Male XLR 3-pin, no phantom required
