description: 500ADAT is the best way to unlock the potential of your ADAT
  equipped audio interface with the power of the 500 series.
details: |-
  500ADAT is a 4U rackmount unit that combines an 8-channel ADAT expander, an 8-into-2 analogue summing mixer, a zero-latency artist monitoring mixer with dual headphone outputs, and a high-current 8-slot 500 series chassis. It is designed to unlock the potential of any ADAT-equipped audio interface by giving it access to the 500 series module format.

  The 8-channel A/D-D/A conversion runs 8-in/8-out at 44.1-48kHz and 88.2-96kHz, or 4-in/4-out at 176.4-192kHz using SMUX II and IV. Conversion is rated at 121dB dynamic range (A-weighted, AES17), THD+N below 0.00032% (-110dB) at -4dBFS, and a frequency response of -1dB from 2.2Hz to over 80kHz, governed by a master reference-quality internal clock with under 0.5 picoseconds of jitter.

  An onboard 8-into-2 analogue summing mixer offers +26.5dBu of headroom with balanced 1/4-inch jack outputs, and can be expanded to a 16-into-2 configuration via the C.A.S.T. Link port when paired with a second 500ADAT or a 500R8. A zero-latency artist mixer provides per-slot level/pan and Aux blend controls feeding two independent, reference-quality headphone amplifiers.

  The 8-slot 500 series rack supplies 250mA per slot (2A total), with XLR inputs, XLR line outputs, and pre-ADC TRS inserts on every slot. Per-slot source switching lets each slot draw from Analogue, USB, or C.A.S.T. sources, and per-slot bypass switches allow the unit to be used for recording even without modules installed. C.A.S.T. ports let users relocate analogue I/O around the studio over standard shielded Cat5, Cat6, or Cat7 cable.

  500ADAT is designed and engineered in the UK, with every unit factory tested before shipping. It is built to work with ADAT-equipped interfaces from manufacturers such as Universal Audio, Focusrite, and Apogee, and can be daisy-chained with a 500R8 or additional 500ADAT units for further expansion.
specs: |-
  - 8-channel A/D-D/A conversion: 8-in/8-out @ 44.1-48kHz and 88.2-96kHz; 4-in/4-out @ 176.4-192kHz
  - Dynamic Range: 121dB A-weighted (AES17 method, 20Hz-20kHz)
  - Frequency Response: -1dB, 2.2Hz to >80kHz
  - THD+N: <0.00032% (-110dB) @ -4dBFS, 20Hz-40kHz, 1kHz, A-weighted
  - Max I/O Level: +24dBu
  - Master clock: <0.5ps jitter; sample rates 44.1/48/88.2/96/176.4/192kHz
  - 8-into-2 analogue summing mixer, +26.5dBu headroom, balanced 1/4" outputs
  - C.A.S.T. Link expands summing mixer to 16-into-2 with a second 500ADAT/500R8
  - Zero-latency artist mixer with per-slot level/pan and Aux blend controls
  - 2 independent headphone amps: THD+N <0.0006% (-104.4dB) @ 20dBu; up to 1.21W @ 100 ohms
  - 8-slot high-current 500 series rack: 250mA per slot, 2A total available current
  - Module source switching per slot (Analogue / USB / C.A.S.T.)
  - Per-slot module bypass switches
  - C.A.S.T. ports (A, B, C, D) for relocating analogue I/O via Cat5/6/7 cable
  - 2 ADAT Input + 2 ADAT Output ports (SMUX II/IV) for 8ch or 4ch at high sample rates
  - Dedicated Word Clock BNC input and output
  - 24V 5A external locking power supply, 120W total power consumption
  - 4U rackmount: 481mm (19") W x 185mm (7") H x 219mm (8.6") D, 7kg unit weight
