url: https://ashdownmusic.com/products/rm-c112-220
description: A compact powerhouse bass combo pairing a single 12 inch Ashdown
  bass speaker with a 220W solid-state amp, loaded with Rootmaster tone-shaping
  features for players who dig the mid-range punch of a compact combo.
details: |-
  The RM C112-220 pairs a single 12 inch Ashdown bass speaker with a 220W solid-state amp. It starts with an ultra-low-noise instrument input and Input Level control, five-band rotary tone controls and a Shape switch that dials in a classic ABM-derived tone. A one-knob compressor adds warmth and body, a footswitchable tube-emulated overdrive pushes the tone from warm grind to distorted filth, and the Sub-Harmonic Generator adds a footswitchable sub-octave. Send and return sockets on the back panel patch in pedals or multi-effects, a DI output feeds a PA mixer or recording console, and a front-panel line input lets you jam along with a backing track. A combined Jack/Speakon socket with a minimum 4-ohm load partners with the Rootmaster cabinet range.
specs: |-
  - Power Output: 220 Watts
  - Power Requirement: 230V
  - Speaker Configuration: 1 x 12 inch
  - Speaker Outputs: 2 x Jack sockets
  - Frequency Response: -3dB @ 17Hz and 30kHz
  - High Instrument Input: Impedance 3.9M Ohms, input range 150mV - 20mV p-p
  - Low Instrument Input: Impedance 10k Ohms, input range 300mV - 40V p-p
  - Line Input: Impedance 10k Ohms, Level 0dBu nominal
  - DI Output: 600 Ohms balanced, 0dBu level nominal
  - Tuner Output: Impedance 22k Ohms, Level 0dBu nominal
  - Impedance: 8 Ohm
  - Output Impedance: Minimum 4 Ohm
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz
  - Effects Send: Impedance 22k Ohm, Level 0dBu nominal
  - Effects Return: Impedance 22k Ohm, Level 0dBu nominal
  - Distortion: Less than 0.5% THD
  - Weight: 22 kg
  - H x W x D: 540 x 390 x 335 mm
