details: |-
  The classic 4088 Directional Headset Microphone is the industry standard in professional headset mics. It offers an open and natural sound making it ideal for both spoken word and vocal performance applications. Now available with CORE+ and MicroLock. This mic provides excellent off-axis rejection in high-SPL situations. It efficiently suppresses distant sound sources making it perfect for demanding live performance environments where background noise and feedback are concerns. The bass response is designed for optimal linearity at 2-3 cm (1 inch) from the sound source, so bass roll-off will be relatively prominent at greater distance — a paramount factor in rejection of background noise and avoiding feedback. The smooth and elegant design makes it the most invisible head-worn true cardioid microphone in the world. It has a secure, dual-ear design that can be used for various performing talent applications. The 0.64 cm (0.25 in) diameter allows for discreet use, and at 14 g (0.5 oz) it is very comfortable for long periods. The microphone can be mounted on the right or left side. The boom is 3 cm (1 in) longer than on the omnidirectional version, which matches placement at the corner of the mouth; to avoid popping, the capsule should not be placed directly in front of the mouth.
specs: |-
  - Directional pattern: Cardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz – 20 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 6 mV/Pa; –44 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 26 dB(A) re. 20 µPa (max. 28 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 38 dB (max. 40 dB)
  - Distortion, THD < 0.5%: 137 dB SPL RMS, 140 dB SPL peak
  - Distortion, THD < 1%: 139 dB SPL RMS, 142 dB SPL peak
  - Dynamic range: Typ. 116 dB
  - Max. SPL, THD 10%: 146 dB SPL peak
  - Rated output impedance: 30–40 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001 XLR Adapter
  - Power supply (for full performance): For wireless systems min. 5 V – max. 10 V through DPA adapter; with DAD9001: P48 phantom power, will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone); 3.5 mA with DAD9001 XLR Adapter
  - Connector: MicroLock, TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - Weight: 14 g (0.5 oz) incl. cable and MicroLock connector
  - Microphone diameter: 5.4 mm (0.21 in)
  - Microphone length: 11 mm (0.5 in)
  - Cable length: 1.2 m (3.9 ft)
  - Cable diameter: 1.6 mm (0.06 in)
  - Polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - Temperature range: –40°C to 45°C (–40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black, Beige, Brown
  - Boom size options: Standard, Small
  - IP rating: IP58
  - Warranty: 2 years
