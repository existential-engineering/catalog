id: 0kGvEj3nAXZVdK4B3xo2a
name: MZ-372
manufacturer: tascam
primaryCategory: mixer
categories:
  - rack-mount
url: https://tascam.com/us/product/mz-372
description: 7-channel 3U rackmount multi-zone mixer designed for permanent
  installation environments such as restaurants, retail spaces, and houses of
  worship. Accommodates 19 total input sources across 12 stereo RCA pairs, six
  rear XLR mic/line inputs, and a front-panel XLR/TRS combo mic input with
  Talkover ducking. Dual redundant balanced XLR and unbalanced RCA stereo main
  outputs plus sub, monitor, and headphone outputs provide flexible zone
  distribution.
details: |-
  3U rackmount multi-zone mixer for permanent installations. Five main mixing channels each with independent 3-band EQ, plus a dedicated front-panel XLR/TRS combo mic input with 2-band EQ and Talkover ducking that automatically lowers background audio during announcements. Dual main outputs (independently controllable) provide redundant routing for zone distribution. Separate sub and monitor outputs offer additional zone flexibility. Front-panel headphone output for monitoring. Powered by external PS-M1524 AC adapter.
specs: |-
  - - Form factor: 3U rackmount; dimensions: 482(W) x 132(H) x 93.2(D) mm; weight: 3.2 kg
  - Inputs: 1x front XLR/TRS combo mic (balanced), 6x rear XLR mic/line (balanced), 12x stereo RCA line pairs (unbalanced)
  - Outputs: 2x stereo XLR balanced main (+4dBu rated, +24dBu max), 2x stereo RCA unbalanced main (-10dBV rated, +6dBV max), 1x stereo RCA sub, 1x stereo RCA monitor, 1x 1/4-inch headphone
  - EQ: 3-band on 5 main channels; 2-band on front mic input; Talkover ducking on front mic
  - Frequency response: 20Hz–20kHz; THD: 0.03% or less; S/N ratio: 80dB; Crosstalk: 65dB
  - Power: PS-M1524 AC adapter (100–240V input, DC 15V/2.4A), 35W consumption
