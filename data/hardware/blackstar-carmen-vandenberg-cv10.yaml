description: Introducing the 6L6 valve powered Carmen Vandenberg CV10 signature amplifier.
details: |-
  The CV10 deploys a 6L6 output valve and an ECC83 in the preamp stage to give this amp a distinctively American bright clean sound and searing lead tone. The built-in overdrive circuit - inspired by Blackstar's renowned HT-Drive pedal - takes the lead tone from dynamic crunch to a singing, smooth legato and remains composed and graceful.

  Carmen Vandenberg is renowned for creating huge soundscapes with an array of different pedals. The CV10 has been carefully developed to be an ideal canvas for pedals, with simple controls that allow quick access to classic, timeless tones encapsulating everything from rich boutique cleans to creamy overdrives.

  To capture the true sonic experience of the power valves driving and breaking up when driven, the Emulated Output is taken after the power stage. Every nuance of your sound can be easily recorded or run through a PA for larger venues.

  The CV10 is equipped with a classic 12-inch British Celestion Seventy-80 loudspeaker, helping to achieve high headroom, crystal clear tones. A footswitchable boost and drive plus a natural sounding digital reverb - voiced with reference to some of the best studio reverb units in the world - round out the feature set.

  The CV10 is a limited edition signature amplifier; each unit comes with a certificate hand-signed by Carmen Vandenberg.
specs: |-
  - Power: 10W
  - Preamp Valve: 1x ECC83
  - Output Valve: 1x 6L6
  - Speaker: 12" Celestion Seventy-80
  - Drive Option: Yes
  - Controls: Gain, Tone, Reverb, Master, Drive Button
  - Emulated Output: Yes
  - Effects Loop: Yes (Series)
  - Speaker Outputs: 1 x 16 Ohm, 1 x 8 Ohm and 2 x 16 Ohm
  - Weight: 14.7 kg
  - Dimensions: 473 x 421 x 251 mm
  - Footswitchable Boost & Drive (1-button supplied; optional 2-button for boost or overdrive and reverb)
  - Hand-signed certificate (limited edition)
