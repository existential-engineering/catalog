details: |-
  The L5 is a micro-sized (5 mm) cardioid condenser microphone also available with an omnidirectional polar pattern. The L5, which features modular, interchangeable capsules, is intended for use with the Audix wireless systems as well as hard-wired vocal and instrument applications.

  Designed to provide the highest quality sound in the smallest possible package, the L5 miniature condenser is ideal for broadcast and live sound applications including speech, interview, presentation, theatrical production, and instruments (guitar, violin). The L5 has clarity, a low profile, ease of operation, and the ability to accurately capture and reproduce vocals from 4″- 8″ or acoustic instruments from 1″- 2″.

  With a smooth and accurate frequency range of 20 Hz – 20 kHz for L5O and 40 Hz – 20 kHz for the L5, these microphones are lightweight and discreet.

  Manufactured to high standards and tight tolerances, the L5 miniaturized condenser microphone features a modular threaded capsule, a machined brass body with a matte black finish and high quality shielded microphone cable.
  APS911 phantom power adapter required. Not included.

  MODEL VARIATION
  L5O – L5 lavalier microphone with an omnidirectional capsule.
specs: |-
  - Polar pattern: Cardioid (L5) / Omnidirectional (L5O)
  - Frequency response: 40 Hz – 20 kHz (L5), 20 Hz – 20 kHz (L5O)
  - Capsule size: 5 mm modular threaded
  - Power: APS911 phantom power adapter required (not included)
