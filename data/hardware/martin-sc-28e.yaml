description: The SC-28E blends Standard Series tonewoods with SC innovation for
  unmatched playability. With a Sure Align neck, rosewood body, premium
  electronics, and classic styling, it's a modern Martin built for the stage.
details: |-
  Modern playability and classic looks—the SC-28E pairs technology with timeless style and tone, combining SC innovation and Standard Series appointments. Its patented features include a Sure Align neck system that helps you play all the way up the neck, while the low-profile velocity satin neck barrel fits comfortably in your hand, and an internal soundboard recurve for added bass response.

  This gloss guitar features a spruce top with resonant East Indian rosewood back and sides, giving you deep bass and rich overtones for that classic Martin sound. Style 28 mother-of-pearl fingerboard inlays, antique white binding, a multi-stripe rosette, and a tortoise pattern pickguard complete the classic Martin aesthetic.

  The S-13 fret cutaway body shape pairs a 25.4-inch scale length with a 1 3/4-inch nut width and an ebony fingerboard with 20 frets. The Sure Align Linear Dovetail neck joint and high-performance taper deliver consistent playability across the full range of the neck.

  Factory-installed electronics options include the Fishman Aura VT Blend and the L.R. Baggs Anthem, making the SC-28E stage-ready out of the case. The guitar ships in a molded hardshell case with a form-fitted plush interior and is strung with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings.
specs: |-
  - Body shape: S-13 Fret Cutaway (SC)
  - Top: Spruce, gloss finish, aging toner
  - Back and sides: East Indian Rosewood, gloss finish
  - Neck: Select Hardwood, dark mahogany color, satin finish
  - Neck shape: Low Profile Velocity
  - Neck taper: High-Performance Taper
  - Neck joint: Sure Align Linear Dovetail
  - Fingerboard: Ebony
  - Fingerboard inlay: Style 28, Mother of Pearl
  - Scale length: 25.4"
  - Total frets: 20
  - Neck joins body at: 13th fret
  - Nut: Bone, 1 3/4" width
  - Saddle: Compensated Bone, 16" radius
  - Bridge: Ebony, sloped modern belly with drop-in saddle
  - Bridge string spacing: 2 5/32"
  - Bridge pins: White plastic with tortoise pattern dots
  - Tuning machines: Nickel open gear with butterbean knobs
  - Headstock: Solid with square taper
  - Headplate: East Indian Rosewood
  - Pickguard: Tortoise pattern
  - Rosette: Multi-stripe
  - Binding: Antique white
  - Bracing: Tone Tension X-Brace, spruce, 5/16" with 1/4" tone bars
  - Brace shape: Treble side scalloped X with scalloped tone bars
  - Electronics: Fishman Aura VT Blend or L.R. Baggs Anthem
  - Case: Molded hardshell with form-fitted plush interior
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze - Light
  - Warranty: Limited Lifetime
