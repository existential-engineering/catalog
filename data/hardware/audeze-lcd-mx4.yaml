details: |-
  The LCD-MX4 melds technological advances from Audeze's Flagship Series with the reliable, accurate driver design of the famous LCD-X to offer incredible detail and sensitivity for studio or home listening.

  Featuring the patented Double Fluxor Magnetic Array, the LCD-MX4 achieves a flux density of 1.5 Tesla — the most powerful magnetic circuit ever in a headphone. The Uniforce voice coil delivers precise detail and the lowest distortion at high SPLs.

  The incredibly controlled bass and remarkably low distortion allow the LCD-MX4 to perform like a high-end speaker system without the need for large, expensive room treatments.

  Built on a lightweight magnesium chassis with carbon fiber headband, the LCD-MX4 is the most efficient LCD headphone model, designed with feedback from professional engineers.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Double Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 106 mm
  - Maximum power handling: 5W RMS
  - Maximum SPL: >130dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 20 ohms
  - Sensitivity: 105 dB/1mW (at Drum Reference Point)
  - Minimum power requirement: >100mW
  - Recommended power level: >250mW
  - Cable: 1.9m (6.8ft) length, single-ended 1/4 inch (6.3mm) termination
  - Wire Material: 20 AWG high-purity OCC audio-grade copper
  - Weight: 575g
