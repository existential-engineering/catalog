details: |-
  Slap and Boost

  ABOUT

  Its finally here! The new JHS Milkman collaboration pedal has been designed to be the perfect compliment for your Milkman amplifier, or any other amplifier you have in your collection. The pedal is very easy to use: slap delay on the left with controls for time, mix, repeats (1-3) and an EQ for the repeats. On the right, there is a simple clean boost after the slap which you can use to push your amp into overdrive, or just add a little more gain. Demo

  RJ Ronquillo and the Milkman

  RJ Shows off what the Milkman can do
