description: A Buchla 4U format polyrhythmic gate/trigger generator that creates
  complex gate patterns by patching signals into four CV inputs, changing its
  sixteen gate/trigger outputs as the CV input states toggle between high and
  low.
details: |-
  こちらは受注後に組み立てするBuild to Orderの商品となっております。
  お支払い確認後2〜3週間前後での納品となりますのでご了承ください。

  1月中旬以降の発送予定となりますのでご了承ください。

  <商品説明>

  ※KPG 4UはBuchla 4Uシステムに準拠した仕様のモジュールです。

  "KPG"は4箇所のCV入力にシグナルをパッチすることによって複雑で多様なゲートパターンを生成するポリリズミックなゲート/トリガージェネレーターです。
  4つのCV入力のステイタス(High/Low)が変化するとアウトプットジャックが変化します。

  ・4 CV INPUT
  ・SYNC INPUT
  ・16 GATE / TRIGGER OUTPUT
  (背面のハンダパッドをハンダ付け することで各出力ごとにGATE/TRIGGERの設定を切り替えることができます。)
  ・ 背面にCV入力のスレッショルド電圧調整用トリマー、SYNC入力の電圧ソース選択スイッチ。

  DIYキットにはパネル＆基板（SMD部品は半田付け済み）、LEDやスタンドオフなどの部品が付属します（バナナジャック・電源コネクタを除く）。
  DIY BOM

  User Guide & Build Guide

  Built by hand in Japan. Tested with the following modules
  200e: 281e / 267e / 250e / 251e
  DIY: 208 / 281 / TSMN

  <注意事項>

  ※電源を入れる前に電源の接続を再度ご確認ください。
  当製品の使用により直接または間接的に発生した人身事故、機器の損傷、使用不能について、一切の責任を負いません。

  基板製造に伴い発生してしまう印刷ムラやスレ、キズなどがある場合がございますのでご了承ください。
