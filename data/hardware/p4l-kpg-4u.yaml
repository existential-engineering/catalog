description: A Buchla 4U format polyrhythmic gate/trigger generator that creates
  complex gate patterns by patching signals into four CV inputs, changing its
  sixteen gate/trigger outputs as the CV input states toggle between high and
  low.
details: |-
  KPG 4U is a module built to the Buchla 4U system specification.

  "KPG" is a polyrhythmic gate/trigger generator that produces complex and varied gate patterns from signals patched into its four CV inputs. The output jacks change as the state (high or low) of the four CV inputs changes.

  - 4 CV INPUT
  - SYNC INPUT
  - 16 GATE / TRIGGER OUTPUT (each output can be switched between gate and trigger by soldering the pads on the rear)
  - A trimmer on the rear adjusts the CV input threshold voltage, and a switch selects the SYNC input voltage source

  Built by hand in Japan. Tested with the following modules
  200e: 281e / 267e / 250e / 251e
  DIY: 208 / 281 / TSMN
