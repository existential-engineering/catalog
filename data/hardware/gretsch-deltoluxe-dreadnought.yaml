details: |-
  Inspired by the historic “Rex” line of instruments offered by mail-order catalog in the 1930s, ‘40s and ’50s, Jim Dandy models embody the charm and spirit of those early Gretsch flat-top guitars with superior playability and best-in-class-tone to boot.

  Featuring a specially-designed slope shoulder body shape and a modest 24.75" scale length, the Jim Dandy Deltoluxe Dreadnought offers a refreshingly comfortable and compact form factor without sacrificing the volume, projection and bass response for which dreadnought guitars are so revered.

  The X-braced body is crafted with select lightweight laminate tonewoods for an optimal balance of woody vintage tone and reliable durability, while the "C"-shape neck presents an inviting feel for hours of old-timey inspiration. The onboard Gretsch Deltoluxe magnetic soundhole pickup produces versatile electrified acoustic tone, providing added utility for live performance, recording, and effects pedals.

  Period-correct details such as a vintage-style pinned bridge, tortoiseshell binding and "G"-graphic pickguard, painted pinstripe purfling, 3-on-a-plate open-gear tuning machines and oversized dot fingerboard inlays combine for a nostalgic personality destined for any barnburner or jamboree. Well suited for everything from bluesy porch pickin’ to speakeasy swingin’, the Gretsch Jim Dandy Deltoluxe Dreadnought is a ramblin’ companion for newbies and old-timers alike.
