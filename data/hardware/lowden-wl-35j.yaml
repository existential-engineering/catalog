  cross-over guitar.
details: |-
  The Lowden Jazz Series of guitars have been designed to feel comfortable and familiar to classical and steel string players alike, making it the ultimate 'cross-over' guitar. The neck has enough width to facilitate the nylon strings but at the same time the cambered fingerboard allows for a wide variety of playing styles. Jazz Series guitars are fitted with an LR Baggs Session VTC pickup as standard. The soundbox is voiced for a really great acoustic response, and at the same time stiff enough to prevent the whole guitar from overreacting when played loud through a sound system. With 35 Series grade AAAA tonewoods and appointments, the WL-35J features Guatemalan Rosewood back and sides and an Alpine Spruce top. Cutaways are not available on any Lowden WL model. See also the S-25J, S-32J, S-35J and S-50J.
specs: |-
  - 48mm nut width
  - 60mm neck width at the 14th fret
  - 335mm soundbox width
  - 100mm soundbox depth
  - 650mm scale length
  - 508mm fretboard radius
  - Guatemalan Rosewood back and sides
  - Alpine Spruce top
  - AAAA grade 35 Series tonewoods
  - WL-shaped body (no cutaway)
  - Cambered fingerboard
  - LR Baggs Session VTC pickup fitted as standard
