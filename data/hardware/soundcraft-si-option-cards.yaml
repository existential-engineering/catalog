name: Si Option Cards
manufacturer: soundcraft
primaryCategory: other
url: https://www.soundcraft.com/en/products/si-option-cards
description: Expansion option cards for the Si range of digital consoles,
  enabling interface with analogue and digital systems and expanding I/O count
  beyond standard console configuration.
details: |-
  By adding option cards to the Si range of digital consoles, you can interface
  your desk with a multitude of analogue and digital systems, whilst expanding
  I/O count beyond that of the standard console configuration. Routing to and
  from the option cards is achieved via the 'Patching' functionality on the
  console. Further cards are always in development and will provide various
  solutions for interfacing onto emerging networks or devices.
