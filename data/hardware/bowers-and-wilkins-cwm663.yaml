details: |-
  CWM663 is a two-way passive in-wall speaker in the Bowers & Wilkins Performance Series, pairing a 150mm (6in) blue Aramid Fibre cone bass/midrange driver with a 25mm (1in) Nautilus tube loaded aluminium dome tweeter. It is a passive design with no on-board amplifier and no mains connection, driven from an external amplifier over ordinary speaker cable.

  The bass/midrange driver sits in a die-cast chassis, which Bowers & Wilkins describes as providing the extra rigidity needed for cleaner, faster bass. The aluminium dome tweeter carries a Nautilus tube behind it to absorb unwanted sonic radiation from the rear of the dome.

  A three-position high frequency switch lets the installer fine-tune the treble balance to the room and the mounting position. It is the largest of the three Performance Series in-wall models, sitting above CWM664 and CWM652.

  Installation uses the Bowers & Wilkins QuickDogs fixing system with plug-and-play connection, so the frame clamps itself to the plasterboard and the baffle mates with the frame without separate wiring at the baffle. The speaker needs a 279mm x 183mm (11in x 7.2in) cut-out and 95mm (3.7in) of clear depth behind the mounting surface, and protrudes 4mm (0.2in) from the wall. A PMK W6 pre-mount kit and a BB 6W back box are offered for new-build installations.
specs: |-
  - Description: 2-way in-wall system
  - Drive units: 1x 25mm (1in) Nautilus tube loaded aluminium dome tweeter, 1x 150mm (6in) blue Aramid Fibre cone bass/midrange
  - Frequency range (-6dB): 45Hz to 50kHz
  - Maximum amplifier power: 25W to 150W
  - Sensitivity SPL (2.83V, 1m): 88dB
  - Nominal impedance: 8 ohms (minimum 4.5 ohms)
  - Frame height: 315mm (12.4in)
  - Frame width: 221mm (8.7in)
  - Cut-out height: 279mm (11in)
  - Cut-out width: 183mm (7.2in)
  - Depth behind surface: 95mm (3.7in)
  - Protrusion: 4mm (0.2in)
  - Three-position high frequency switch
  - QuickDogs fixing system with plug-and-play connection
  - Pre-mount kit: PMK W6
  - Back box: BB 6W
  - Passive two-way in-wall speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
