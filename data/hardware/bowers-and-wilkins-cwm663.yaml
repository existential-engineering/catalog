  - Drive units: 1x ø25mm (1in) Nautilus™ tube loaded aluminium dome tweeter
  - Drive units: 1x ø150mm (6in) blue Aramid Fibre cone bass/midrange
  - Frequency range (-6dB): 45Hz – 50kHz
  - Maximum amplifier power: 25 – 150W
  - Sensitivity SPL (2.83V, 1m): 88dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame height: 315mm (12.4in)
