description: "48v Phantom Power Supply. When you need a reliable power source
  for condenser mics and equipment requiring phantom power, the M48 Phantom
  Power Supply is just the tool for the job."
details: |-
  Quite a bit of gear relies on Phantom Power to work these days, and the number is always growing. When you need a reliable power source, the M48 Phantom Power Supply is just the tool for the job.

  The M48 delivers transparent, noise-free 48v phantom power for condenser microphones and other equipment that requires it. It features XLR input and output for inline use between a microphone and a mixer or preamp without phantom power.

  The M48 can be powered by the included AC adapter or a 9v battery, making it suitable for both studio and field use. Power and Low Battery indicators keep you informed of operating status, and the unit features Mackie's signature Built-Like-A-Tank construction.
specs: |-
  - Perfect for condenser mics and equipment that require 48v Phantom Power
  - XLR input and output
  - Transparent, noise-free operation
  - Powered by the included AC adapter or 9v battery
  - Power and Low Battery indication
  - Built-Like-A-Tank construction
