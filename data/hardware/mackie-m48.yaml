description: Quite a bit of gear relies on Phantom Power to work these days, and
  the number is always growing. When you need a reliable power source, the M48
  Phantom Power Supply is just the tool for the job.
details: |-
  The M48 48v Phantom Power Supply allows you to use your devices and microphones that require external power in any setup. Sometimes the phantom power being supplied is inadequate as well, and with the M48, you will always get a clean, full 48v of power for the best sound and noise performance.

  Most professional condenser mics require 48V phantom power, which lets the mixer or audio interface send low-current DC voltage to the mic's electronics through the same wires that carry audio. The M48 supplies that voltage on its own so the feed does not depend on the console.

  It is powered by either a 9V battery or the supplied AC adapter. The battery compartment sits on the bottom panel behind a sliding cover, and a front-panel low battery LED reports when the cell needs replacing.

  It takes approximately 15 seconds for the phantom power to shut off completely. Do not add or remove any mics until the power LED is completely off or mics could be damaged.
specs: |-
  - Perfect for condenser mics and equipment that require 48v phantom power
  - XLR input and output
  - Transparent, noise-free operation
  - Powered by the included AC adapter or a 9V battery
  - Power and low battery indication
  - Built-Like-A-Tank construction
  - Input type: female XLR balanced
  - Output type: male XLR balanced
  - Output voltage 48V +/-3V
  - Maximum output current 40 mA
  - Power requirements: internal 9V battery or external 9 to 12 VDC
  - Dimensions 1.5 x 3.4 x 5.8 in / 38 x 86 x 147 mm
  - Weight 0.8 lb / 0.4 kg
