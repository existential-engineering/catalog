description: The KRK V8 is a two-way, full-range active studio reference monitor
  with a 1-inch Kevlar dome tweeter and an 8-inch woven Kevlar woofer driven by
  a 230 W bi-amped Class-D amplifier.
details: |-
  V-Series combines modern technology with what made KRK a standard in professional studios for the past 30 years running. The KRK V8 is a two-way, full-range studio reference monitor for recording, mixing and mastering.

  It features a 1-inch KRK designed Kevlar tweeter and a 8-inch lightweight KRK designed woven Kevlar woofer. Using Kevlar for both the woofer and the tweeter gives smooth midrange definition without colorization and high-end extension with tight, controlled low-end, as well as a wide sweet spot and precise imaging. A 230W KRK designed, bi-amped Class-D amplifier delivers transient speed and up to 118 dB of SPL. KRK's optimized front-ported bass reflex enclosure design avoids boundary coupling to allow flexibility in room positioning. 49 DSP driven EQ presets give control for room and desk correction as well as personal taste. The solid aluminium front baffle and EVA foam pad act as a built-in stabilizer that improves transient response and imaging.
specs: |-
  - Configuration: 2-way
  - System type: active studio monitor
  - Low-frequency transducer: woofer, 8-inch, cast aluminium frame, Kevlar cone, ferrite magnet
  - High-frequency transducer: tweeter, 1-inch, Kevlar dome, ferrite magnet
  - Frequency response (+/- 3 dB): 35 Hz to 19 kHz
  - Frequency range (-10 dB): 29 Hz to 24 kHz
  - Crossover frequency: 1.8 kHz
  - LF power: 200 W
  - HF power: 30 W
  - Total power: 230 W
  - Peak SPL: 118 dB
  - Connectors: balanced 10 kohm XLR / 1/4-inch combo input, standard IEC power
  - Enclosure construction: MDF / aluminium
  - Dimensions (H x W x D): 17.13 in (435 mm) x 11.18 in (284 mm) x 13.66 in (347 mm)
  - Weight: 31.75 lb (14.4 kg)
  - Bi-amped Class-D amplification
  - Acoustic and desk loading condition correction low frequency EQs
  - Mid and high frequency EQs
  - Precise input level attenuation switch
  - Standby, ground lift, input sensitivity and logo LED selectors
  - 49 DSP driven EQ presets for room and desk correction
  - Optional protective grille included for mobile broadcast applications
