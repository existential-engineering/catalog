url: https://www.klarkteknik.com/en/products/0812-AAC
description: The DS 50 PRO SPLITTER 5 is a passive signal splitter for routing
  balanced XLR signals to as many as five discrete destinations, including FOH
  and monitor consoles, active monitor loudspeakers and broadcast mixers. It
  requires no external power of any kind.
details: |-
  A custom instrumentation-grade input circuit uses advanced analogue design techniques to create the ideal input impedance match, giving a low noise, ultra-linear system with a flat frequency response from 20 Hz to 22 kHz (±0.05 dB).

  All of the input and output connections use industry-standard XLR jacks.

  The ultra-compact enclosure is a thick aluminium extrusion that protects the electronics, with sturdy rubber corner bumpers for road use.

  In use, the DS 50 sends identical copies of a balanced input signal to up to five discrete destinations.
specs: |-
  - One balanced XLR input split to five balanced XLR outputs
  - Frequency response: 20 Hz to 22 kHz (±0.05 dB)
  - Passive design, requires no external power
  - Aluminium extrusion enclosure with rubber corner bumpers
