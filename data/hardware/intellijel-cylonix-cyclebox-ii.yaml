details: |-
  The Cylonix Cyclebox II is a complex VCO offering a wide 22-octave frequency range (50kHz down to one cycle every 80 seconds), with 2 primary oscillators plus a suboscillator. Primary oscillators offer 8 built-in waveforms (sine, triangle, sinepulse1, square, saw, squaresaw, sinepulse2, pseudo-random) plus 8 additional externally selectable wavetable shape sets for osc1 (random pulses, truncated sawtooth, bipolar pulse, mirrored bipolar pulse, resonant sweep, mirrored resonant sweep, vowels, mirrored vowels).

  A 'Mega mode' combines 8 detuned copies of osc1, and 16 nonlinear waveform combinations are available, effectively offering many different synthesizer character options in one module. It provides quadrature outputs, externally controllable wave-folding, and high-quality 'through-zero' internal FM of osc1 by osc2 with externally adjustable modulation level.

  Other features include internal and external oscillator sync, external control of internal FM level, osc2 phase and osc2 ratio, and an LED display of pitch octave and LFO output levels. Internally it uses digital sound generation with low aliasing noise, a 24MHz internal signal processing rate, and a 96kHz output sampling rate, with a DC-coupled output allowing very low frequency operation.
specs: |-
  - Width: 16HP
  - Power: 110mA
  - Wide 22 octave frequency range (50kHz down to one cycle every 80 seconds)
  - 2 primary oscillators plus a suboscillator
  - 8 waveforms for primary oscillators
  - 8 additional externally selectable wavetable shape sets for osc1
  - Mega mode: 8 detuned copies of osc1
  - 16 nonlinear waveform combinations
  - Quadrature outputs
  - Externally controllable wave-folding
  - Through-zero internal FM of osc1 by osc2, externally adjustable
  - Internal and external oscillator sync
  - External control of internal FM level, osc2 phase, osc2 ratio
  - LED display of pitch octave and LFO output levels
  - Digital sound generation, 24MHz internal processing rate, 96kHz output sampling rate
  - DC-coupled output for very low frequency operation
