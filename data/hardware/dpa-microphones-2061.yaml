description: The 2061 Omnidirectional Miniature Mic is a professional lavalier
  that meets sound engineers' need for an amazingly high-quality mic.
details: |-
  Whether used in broadcast studios or ENG, theatres, houses of worship, event venues or other content creation situations, this mic excels in situations where the voice needs to be amplified or recorded. Amazing speech intelligibility, durable construction with sweat-repellent and water-resistant capabilities ensure that this mic will be your go-to mic for a very long time.

  Captures voice with clarity and consistency.

  The 2061 exhibits an accurate omnidirectional pattern and therefore does not need to be aimed directly at the sound source to achieve quality pickup. This grants sound designers the freedom to capture ideal sound regardless of microphone positioning on a subject. Designed as a versatile microphone for capturing the human voice, the 2061 stays neutral to placement, allowing engineers to shape its response through EQ. No matter if you mount the mic on a performer's chest, forehead or cheek, you will capture natural voice and be able to easily EQ to your desired sound.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±3 dB: 50 Hz - 16 kHz, 3 dB soft boost at 8 - 16 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 6 mV/Pa; -44 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 26 dB(A) re. 20 µPa (max. 28 dB(A))
  - Distortion, THD < 0.5%: 120 dB SPL RMS, 123 dB SPL peak
  - Distortion, THD < 1%: 125 dB SPL RMS, 128 dB SPL peak
  - Dynamic range: Typ. 102 dB
  - Max. SPL, THD 10%: 137 dB SPL peak
  - Rated output impedance: 112 Ω
  - Minimum load impedance: 5 kΩ
  - Power supply (for full performance): For wireless systems min. 5 V - max 10 V
  - Current consumption: Typ. 0.6 mA
  - Connector: TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - Weight: 10 g (.35 oz)
  - Microphone diameter: 5.5 mm (0.22 in)
  - Microphone length: 9.7 mm (0.38 in)
  - Cable length: 1.5 m (4.9 ft)
  - Cable diameter: 1.6 mm (0.06 in)
  - Maximum output voltage, RMS: 1.6 V
  - Polarity: +V at output for positive sound pressure
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black, Brown, Beige, White
