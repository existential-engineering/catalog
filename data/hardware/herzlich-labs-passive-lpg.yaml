description: A 2hp dual passive low pass gate with hand-built vactrols producing
  organic plucked attacks and gentle decays.
details: |-
  Nothing compares to the sound of a hand-built vactrol. The Passive LPG is a synth classic with good reason - nothing compares to the sound of well-tuned vactrols, the internal component which uses a light source and light dependent generator to create organic, plucked attacks and gentle decays in conjunction with a low pass filter. Vactrols have a long history in music technology, from shrink-tubing and incandescent bulbs in old guitar amps, which gradually evolved into increasingly modern solutions. In recent years, however, vactrols have become a scarcity, which led me to spend innumerable hours designing, testing and carefully crafting my own design. In a time where we can increasingly simulate everything from the impulse response of guitar cabinets to human language conversations with a machine, there is something defiant about the low pass gate. Like plucking a guitar string, the LPG relies on physical interactions that are subject to all manner of variables, things we cannot fully control or predict, which gives each individual unit a character slightly of it's own.
specs: |-
  - Two independent LPG units with two different filter cutoffs
  - Hand-built vactrols provide immediate musical results with any source
  - High grade component selection and all-analog architecture
  - Low-profile passive design fits anywhere and draws no power
  - Create organic plucks and percussion with ease
