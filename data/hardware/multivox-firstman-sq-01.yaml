description: >-
  The Firstman SQ-01 is a compact monophonic analog synthesizer and digital sequencer
  combination unit from the early 1980s. Originally released by Firstman in 1980 and later
  distributed by Multivox in 1981, it features a built-in 1024-note digital sequencer and
  a resonant low-pass filter. Only approximately 200 units were ever manufactured, making
  it an exceptionally rare instrument.
details: |-
  The SQ-01 was originally designed by Firstman, a lesser-known Japanese manufacturer, and initially released under the Hillwood/Firstman brand before Multivox acquired distribution rights in 1981. Described in its manual as "a monophonic multi-sound producing source and digital recording device in one compact control box," it was marketed as an accessible instrument that even those without musical background could use to compose and play back compositions.

  The synthesizer section features a single oscillator with sawtooth waveform, a 24dB/octave resonant low-pass filter, and a VCA with ADS envelope. The built-in digital sequencer stores up to 1024 notes, controlled via eight touchpad sequence buttons on the right side of the unit, supplemented by dedicated TEMPO, Release, and Bar knobs.

  The rear panel provides comprehensive connectivity including control voltage input/output jacks, gate input/output, clock synchronization for linking multiple SQ-01 units, footswitch input, synchro output for Play/Stop synchronization, and standard audio output. The unit runs on six AA batteries or an AC adapter, with two additional AA batteries for CMOS memory backup.

  The SQ-01 is prized by fans of vintage analog bass sounds, noted for delivering considerably more low end than the Roland TB-303 that was released shortly after. Its extreme rarity of roughly 200 units produced makes finding one in good condition a significant challenge for collectors.
specs: |-
  - Monophonic (single voice)
  - 1 oscillator with sawtooth (ascending) waveform
  - 24dB/octave low-pass filter with resonance
  - 1 VCA with ADS envelope
  - 1024-note digital sequencer
  - 8 touchpad sequence buttons
  - CV input/output
  - Gate input/output
  - Clock sync for chaining multiple units
  - Footswitch input
  - Synchro output (Play/Stop)
  - Audio output
  - Power: 6 AA batteries (DC) or AC adapter
  - Memory backup: 2 AA batteries (CMOS)
  - Approximately 200 units manufactured
