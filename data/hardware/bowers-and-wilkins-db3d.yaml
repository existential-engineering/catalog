description: Despite its compact dimensions, DB3D delivers astonishingly
  powerful, controlled bass thanks to its twin 8-in Aerofoil drivers, amplifier
  and digital signal processing.
details: |-
  DB3D is the compact model in the Bowers & Wilkins DB Series, built for rooms where floor space is scarce. Two 200mm (8in) Aerofoil-cone drive units sit back-to-back in a balanced configuration behind a 1000W Class D amplifier and a digital preamplifier with Dynamic EQ, in a cabinet only 360mm high.

  The back-to-back drivers cancel cabinet resonance so the amplifier's output goes into bass rather than vibration, and the enclosure is made deliberately rigid and low-resonance. Bowers & Wilkins positions DB3D as the match for the 804 D4 and 805 D4 loudspeakers, and offers it in finishes chosen to sit alongside the 800 Series Diamond and 700 Series ranges.

  Connection is made on a single rear panel that carries a stereo pair of balanced XLR inputs, a stereo pair of unbalanced RCA Phono inputs, two 3.5mm 12V trigger jacks and a 9-pin D RS-232 port, alongside the mains inlet. The XLR and Phono inputs can be wired at the same time and configured independently, so one subwoofer can serve a home theatre processor and a conventional stereo preamplifier and be switched between them. Trigger 1 controls switch on and standby, Trigger 2 selects the input, and RS-232 exposes the subwoofer to home automation control systems.

  There are no knobs on the cabinet: set up and control happen only through the Bluetooth-connected Bowers & Wilkins DB Subwoofers app for iOS and Android, and the manual states plainly that it is not possible to set up or use a DB Series subwoofer without it. The app carries level and trim adjustment, low pass filter setup that can be matched to named Bowers & Wilkins main speakers or to a third-party specification, music and movie EQ presets, a five band custom equaliser, auto-standby options and the Room EQ optimisation routine, which needs no separate measurement microphone.

  The subwoofer switches on in operational mode with a green standby indicator as soon as mains power is applied, and drops to standby with a red indicator after twenty minutes of disuse. The standby button sits on the front panel. Spike, decoupling and rubber feet ship in the carton, and because the amplifier heat-sink is on the underside the manual warns that rubber and decoupling feet must not be used on carpet: the cabinet has to be lifted clear of the pile so cooling air can reach the heat-sink panel. Magnetically attached fabric grilles are supplied and are optional in use.

  The cabinet measures 360mm high, 320mm wide and 300mm deep and weighs 25kg, the lightest of the three twin-driver DB models. Despite its size the manual still advises against installing it inside custom-built furniture, because of the dual driver layout and the underside heat-sink, and asks for at least 20cm of clearance around the sides, back and top if furniture installation cannot be avoided.
specs: |-
  - Drive units: 2x 200mm (8in) Aerofoil cone drive units in a balanced (back-to-back opposed) configuration
  - Amplifier: 1000W Class D Hypex, max power output 1000W
  - Frequency response: 10Hz - 350Hz -3dB (centred on level at 100Hz)
  - Frequency range: -6dB at 8.5Hz - 500Hz
  - Inputs: 2x XLR, 2x RCA, 2x 3.5mm 12V trigger, RS-232 9-pin D connector
  - Digital preamplifier with Dynamic EQ
  - App-based set-up and BT-LE control (Bowers & Wilkins DB Subwoofers app for iOS and Android, required for all setup)
  - Room EQ optimisation with no separate measurement microphone
  - Low pass filter presets matched to Bowers & Wilkins main speakers or to third-party specifications, plus music and movie EQ presets and a five band custom equaliser
  - Level and trim adjustment per input; XLR and RCA inputs independently configurable and simultaneously connectable
  - Standby button on the front panel; auto-standby after 20 minutes
  - Supplied accessories: power cable(s), magnetically attached fabric grilles, spike, decoupling and rubber feet
  - Dimensions: Height 360mm (14.1in), Width 320mm (12.6in), Depth 300mm (11.8in)
  - Net weight: 25kg
  - Cabinet finishes: Gloss Black, Satin White, Rosenut
  - Grille finishes: Black, Grey
