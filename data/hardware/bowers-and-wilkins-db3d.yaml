description: Despite its compact dimensions, DB3D delivers astonishingly
  powerful, controlled bass thanks to its twin 8-in Aerofoil drivers, amplifier
  and digital signal processing.
details: |-
  When you demand faultless bass but floor space is at a premium, there's the DB3D. This high-performance subwoofer is capable of delivering space-defying bottom end from a highly compact, incredibly rigid cabinet. Its dual balanced 8-inch Aerofoil drivers are effortlessly powered by a 1000 Watt Class D amplifier to deliver punchy, deep bass.

  DB3D's tight, powerful, dramatic bass and compact size make it a match for the 804 D4 and 805 D4 speakers. Solid, dramatic bass is delivered through the rigidity and lightness of the uniquely-shaped, variable thickness Aerofoil cone, and the back-to-back (opposed) drivers cancel out cabinet resonances so that the power goes into bass rather than wasted vibrations.

  Digital amplification is cool-running and energy efficient, even when working hard, while Dynamic EQ and Room EQ ensure a precise sound for music and movies. As with all the DB Series, the DB3D is simple to configure and use thanks to a dedicated mobile app for both iOS and Android devices, which incorporates a room EQ system that requires no separate microphone kit.

  The connection panel carries stereo balanced XLR and stereo unbalanced RCA phono inputs, which can be connected simultaneously and configured independently so the subwoofer can serve a home theatre system and a conventional stereo system at once. Two 3.5mm 12V trigger sockets handle remote switch-on/standby and remote input selection, and an RS-232 9-pin D connector allows the subwoofer to be incorporated into a home automation system.

  DB3D's ultra-rigid low-resonance enclosure comes in three finishes to match 800 Series Diamond and 700 Series loudspeakers. It weighs 25kg and measures 360 x 320 x 300mm (H x W x D).
specs: |-
  - Description: DB Series subwoofer
  - Technical features: 1000W Class D Hypex amplifier, 2 x 200mm (8in) Aerofoil-cone drive units in a balanced configuration, digital preamplifier with Dynamic EQ, app-based set-up and BT-LE control
  - Drive units: 2 x 200mm (8in) Aerofoil-cone drive units in a balanced configuration
  - Frequency range (-6dB): 8.5Hz - 500Hz
  - Frequency response (-3dB, centred on level at 100Hz): 10Hz - 350Hz
  - Max power output: 1000W
  - Inputs: 2 x XLR, 2 x RCA, 2 x 3.5mm 12V trigger, RS-232 9-pin D connector
  - Set-up and control: Bowers & Wilkins DB Subwoofers app over Bluetooth Low Energy (iOS/Android), the subwoofer cannot be set up without the app
  - Dimensions: Height 360mm (14.1in), Width 320mm (12.6in), Depth 300mm (11.8in)
  - Net weight: 25kg
  - Cabinet finishes: Gloss Black, Satin White, Rosenut
  - Grille finishes: Black, Grey
  - Auto-standby after 20 minutes unused, standby button on the front panel
