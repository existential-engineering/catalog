description: The LiveTrak L-20 is a digital console for mixing, monitoring and
  recording complex productions, with 20 discrete audio channels and six
  individual custom monitor mixes.
details: |-
  The LiveTrak L-20 is a 20-channel digital console and multi-track recorder for larger live productions. Sixteen mono mic/line channels take XLR/TRS combo jacks with +48 V phantom power in banks of four, channels 1 and 2 switch to Hi-Z for electric guitar or bass, and channels 3 to 16 carry a 26 dB pad. The two stereo channels, 17/18 and 19/20, accept unbalanced TS jacks or RCA jacks and can also be fed from the USB audio return.

  All 20 inputs have a fader and dedicated mute and solo buttons, and the 16 mono channels add single-knob compression beside the gain control. The channel strip applies a 3-band EQ with a sweepable mid (10 kHz shelving high, 100 Hz to 8 kHz peaking mid, 100 Hz shelving low, each plus or minus 15 dB) and a variable-frequency low cut from 40 to 600 Hz at 12 dB/octave. Two separate send buses carry 20 chorus, delay and reverb effects with adjustable parameters, and nine scenes store fader positions, EQ, pan and mute for instant recall.

  The recorder captures 22 tracks at once, 20 discrete channels plus a stereo mix, direct to SDHC or SDXC media at 44.1, 48 or 96 kHz in 16 or 24-bit WAV, with 20-track playback. Preamps are specified at -128 dBu EIN with +60 dB maximum gain. Effects, EQ, overdub, the audio interface and fader modes A to F are unavailable at 96 kHz. Automatic start and stop plus a pre-record function cover performances that begin before the recorder is rolling.

  Six independent monitor outputs each carry their own mix with its own effects, and each output switches between a powerful headphone feed and a balanced line level for stage wedges. A seventh, dedicated PHONES output is for the front-of-house engineer, who can monitor the master mix or any of the sub mixes while adjusting them for the musicians.

  Audio Interface mode makes the L-20 a 22-in/4-out, 24-bit USB 2.0 interface that routes into a DAW or streaming software while recording to the SD card, and audio can be returned from the computer into the live mix. Class-compliant mode covers iOS and iPadOS with an Apple Lightning to USB Camera Adapter. A separate USB host port imports and exports projects to a flash drive, a CONTROL IN jack takes the optional FS-01 momentary footswitch, and a REMOTE port takes a Zoom Bluetooth adapter such as the BTA-1 for wireless control from the free iPad app, which covers fader levels and modes, scenes, EQ, effect sends, returns and parameters.
specs: |-
  - 20 discrete channels (16 mono plus 2 stereo) with XLR or 1/4-inch connectivity
  - Inputs: Mono (MIC/LINE) x 16, Stereo (LINE) x 2. Outputs: MASTER OUT x 1, MONITOR OUT x 6, PHONES x 1
  - Mono (MIC/LINE): XLR/TRS combo jacks (XLR 2 HOT, TRS TIP HOT)
  - Input gain: PAD OFF +16 to +60 dB, PAD ON -10 to +34 dB, Hi-Z ON +6 to +50 dB
  - Input impedance: XLR 3 kOhm, TRS 10 kOhm (1 MOhm with Hi-Z on)
  - Maximum input level: PAD OFF 0 dBu, PAD ON +26 dBu (at 0 dBFS)
  - Phantom power: +48 V
  - Hi-Z connectivity on channels 1 and 2, 26 dB pad on channels 3 to 16
  - Stereo (LINE): TS phone and RCA pin (unbalanced) jacks, maximum input level +10 dBu
  - MASTER OUT: XLR jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MONITOR OUT A to F with balanced output for monitor speakers: TRS phone jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MONITOR OUT A to F with unbalanced output for headphones: standard stereo phone jacks, maximum output level 42 mW + 42 mW at 60 Ohm, output impedance 100 Ohm
  - PHONES: standard stereo phone jack, maximum output level 42 mW + 42 mW at 60 Ohm, output impedance 100 Ohm
  - Buses: MASTER 1, MONITOR 6, SEND EFX 2
  - Channel strip: COMP on channels 1 to 16, low cut 40 to 600 Hz, 12 dB/OCT. EQ HIGH 10 kHz shelving, MID 100 Hz to 8 kHz peaking, LOW 100 Hz shelving, each plus or minus 15 dB
  - Level meters: 12 segments
  - Send effects: 20 types. EFX 1 covers Hall 1, Hall 2, Room 1, Plate, Church, DrumAmb, GateRev, Vocal 1, Vocal 2 and Vocal 3. EFX 2 covers Hall 3, Room 2, Spring Delay, Analog P-P Dly, Vocal 4, Chorus 1 and Chorus 2
  - Scene saving function, up to 9 scenes at a time
  - Maximum simultaneous recording tracks: 22 at 44.1, 48 or 96 kHz. Maximum simultaneous playback tracks: 20
  - Recording format: WAV 44.1/48/96 kHz, 16/24-bit, mono or stereo
  - Recording media: 4 GB to 32 GB SDHC cards and 64 GB to 1 TB SDXC cards, class 10 or higher
  - Audio interface: 22-in / 4-out at 44.1 or 48 kHz, 24-bit, USB 2.0, class-compliant mode for iOS
  - Effects, EQ, overdub, audio interface and fader modes A to F are not available at 96 kHz
  - Card reader: mass storage USB 2.0 High Speed. USB HOST: USB 2.0 High Speed for project import and export
  - Sampling frequency: 44.1 / 48 / 96 kHz
  - Frequency characteristics: -1.0 dB at 20 Hz to 20 kHz (44.1 kHz), -3.0 dB at 20 Hz to 40 kHz (96 kHz)
  - Equivalent input noise: -128 dB EIN (IHF-A) at +60 dB, 150 Ohm input
  - Display: LCD with backlight, 128 x 64 resolution
  - Built-in slate microphone and metronome. Transport controls for record, play/pause, stop, fast forward, rewind and overdub
  - Automatic recording start and stop, plus a pre-record function
  - Compatible with the ZOOM FS-01 footswitch via the CONTROL IN jack, and with the Remote Mixer control app for iPad over a Zoom Bluetooth adapter such as the BTA-1 (up to 10 m indoors, unobstructed, iPadOS 13 or later)
  - System requirements for audio interface mode: Windows 8.1 / 10 / 11 (32 or 64-bit), macOS 10.14 to 26, iOS 9 to 26 and iPadOS 17 to 26 with an Apple Lightning to USB Camera Adapter
  - Automatic power-save function
  - Power: AD-19 AC adapter, DC 12 V / 2 A. Power consumption 24 W maximum
  - External dimensions: 445 mm (W) x 388.4 mm (D) x 82.6 mm (H)
  - Weight (main unit only): 3.71 kg
  - Supplied with the AD-19 AC adapter, a USB 2.0 cable and a quick guide
