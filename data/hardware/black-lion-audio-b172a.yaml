description: Hybrid FET/Optical Compressor
details: The B172A combines a Seventeen-style FET limiter (inspired by the '76)
  with a '2A-style optical compressor in a single 2U chassis. Signal can be
  routed through either or both circuits in any order (A/B or B/A). The two
  compressors can be used independently, in series, or in dual mono mode for two
  separate signals. Each circuit can be independently stereo-linked to another
  B172A unit. The '2A optical side features BLA's custom T4BLA opto element.
  CineMag input transformer on the '2A side; custom Chicago-wound output
  transformers on both circuits.
specs: |-
  - Type: FET / Optical Compressor
  - Channels: Stereo / Dual Mono
  - FET side ratio: 4:1 to 20:1
  - FET Attack: Continuously variable 20µS to 800µS
  - FET Release: Continuously variable 50mS to 1200mS
  - Inputs: 2 x XLR, 2 x TRS 1/4"
  - Outputs: 2 x XLR, 2 x TRS 1/4"
  - Stereo link: 2 x TRS 1/4"
  - Signal routing: A/B or B/A switchable
  - Transformers: CineMag (optical side), Chicago-wound custom (both outputs)
  - Opto element: T4BLA (custom)
  - Form factor: 2U rackmount
  - Width: 19"
  - Power Source: IEC AC cable
