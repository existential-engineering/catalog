description: A high-fidelity compressor and limiting amplifier in pedal format,
  built around the THAT Corp. 4320 with a true-RMS detector, Threshold and
  Compression Ratio controls and up to 30 dB of output gain.
details: |-
  The Compressor GC-2 Limiting Amplifier brings the compression and limiting technology of Keeley's Bassist Limiting Amplifier to a general-purpose pedal. It is built around the THAT Corp. 4320, using voltage-controlled amplifiers, an on-board true-RMS detector and high-performance op-amps, and is aimed at transparency and low noise rather than an obvious compression effect. Bandwidth exceeds 20 kHz and the circuit handles large input signals, which makes it suitable for guitar, keyboards, drum machines and other line-level sources.

  The Threshold control sets the level at which the detector starts working, with a dual-LED threshold indicator showing when the signal crosses it. Used as a limiting amplifier, it keeps peaks from clipping an amplifier or damaging speakers. The Compression Ratio control sets how much reduction is applied above the threshold: fully down at 1:1 applies no compression and leaves the Gain control working as a boost, while fully up gives a hard-knee limiter.

  Attack and release are derived from a single time constant and adapt to playing level, so both vary with programme content. Keeley quotes attack times of roughly 15 ms for 10 dB, 5 ms for 20 dB and 3 ms for 30 dB, and release times of roughly 8 ms for 1 dB, 40 ms for 5 dB, 80 ms for 10 dB, 160 ms for 20 dB and 240 ms for 30 dB. Release is generally about 100 times slower than attack.
