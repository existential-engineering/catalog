details: |-
  USA CUSTOMERS - Echo Fix covers the Tariff and custom charges via our express courier. This checkout price is an all inclusive price for USA customers. The Echo Fix EF-P3 Chorus Vibrato pedal is an analog BBD Chorus pedal with a rich and extended feature set. Designed to be the ultimate chorus pedal, each control has been extended in range for sonic flexibility. From subtle pitch glides to fast Leslie-style wobbles, the wide range of controls makes this pedal extremely versatile and creative.
specs: |-
  - Rate Control
  - Depth Control
  - Resonance Control
  - Wave Shape Control
  - LED Rate Indicator
  - LED Overload Indicator
  - Direct Mute Footswitch for Vibrato mode
  - Soft momentary switching for noiseless Bypass and Direct Mute switching
  - Increased internal power supply voltage rails for increased dynamic range
