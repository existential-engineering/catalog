details: |-
  The LS-AES is exactly what is needed when additional AES/EBU or SPDIF digital audio channels are needed for the LynxTWO and L22 cards. The LS-AES is a daughter card for the LynxTWO and L22 that provides eight more channels of 96 kHz digital input and output. Using the LynxTWO or L22's own digital mixer, the LS-AES's inputs and outputs are easily and seamlessly incorporated.

  LS-AES can operate in single wire mode, or in dual wire mode, where it provides four I/O channels at 192 kHz. Quad wire mode is also available. For additional channel capacity, a second LS-AES can be added to a single LynxTWO or L22.

  LS-AES can handle either synchronous or asynchronous audio. The built-in Sample Rate Converter can be enabled independently on each digital input for asynchronous signals from multiple digital devices. In synchronous mode, any input may be selected as the system clock source. LS-AES can also be synchronized to the main PCI card's word clock or composite video received by a host LynxTWO.

  The LS-AES ships with its own six-foot breakout cable, which has four XLR female and four XLR male connectors. Optional adapter cables allow the use of SPDIF digital I/O.
specs: |-
  - Provides an additional 4 AES/EBU inputs and outputs (8 channels) at sample rates up to 96 kHz, 24 bit
  - Dual and quad wire supported, with four I/O channels at 192 kHz in dual wire mode
  - Daughter card for LynxTWO and L22
  - Control integrated into the host PCI card's digital mixer
  - Up to two LS-AES can be used with one LynxTWO or L22
  - Built-in sample rate conversion on all inputs, enabled independently per digital input
  - Versatile word clock implementation; can be synchronized to the host PCI card's word clock or to composite video received by a host LynxTWO
  - Ships with a six-foot breakout cable carrying four female XLR and four male XLR connectors
  - Optional adapter cables allow the use of SPDIF digital I/O
  - RoHS compliant
  - Daughter card with no power connector of its own; powered through the host LynxTWO or L22 PCI card
