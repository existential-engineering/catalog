description: A first-of-its-kind 700 Series Signature center channel speaker,
  bringing even more clarity and detail to your favorite movies and music.
details: |-
  The HTM71 S3 Signature is Bowers & Wilkins' first 700 Series Signature center channel loudspeaker, designed to anchor the dialogue and on-screen action in a high-performance home cinema system. It carries the signature refinements that distinguish the Signature line from the standard 700 S3 family, including upgraded internal components and exclusive finishes.

  The three-way vented-box design pairs a 25mm (1") Decoupled Carbon Dome tweeter mounted in the brand's iconic Tweeter-on-Top housing with a 130mm (5") Continuum cone FST midrange driver and two 130mm (5") Aerofoil Profile bass drivers. Decoupling the midrange and tweeter from the main cabinet helps reduce coloration and preserve detail.

  Compared with the standard 700 S3 range, the Signature version benefits from upgraded bass-driver motor assemblies, improved bypass capacitors in the crossover, and revised speaker terminals, all targeting greater transparency and dynamic range.

  Available in two exclusive finishes - Midnight Blue Metallic and Datuk Gloss - the cabinet is tuned for a frequency range of 45Hz-33kHz (-6dB) with a nominal 8 ohm impedance (3.1 ohm minimum) and 89dB sensitivity, making it well suited to amplifiers rated between 30W and 200W into 8 ohms.

  The 700 S3 Signature series, including the HTM71 S3 Signature, has been recognized with EISA awards for its performance and design refinements over the standard 700 S3 lineup.
specs: |-
  - Type: 3-way vented-box center channel loudspeaker
  - Drive units: 1x 25mm (1") Decoupled Carbon Dome tweeter, 1x 130mm (5") Continuum cone FST midrange, 2x 130mm (5") Aerofoil Profile bass drivers
  - Frequency range: 45Hz-33kHz (-6dB)
  - Frequency response: 50Hz-28kHz (±3dB)
  - Sensitivity: 89dB SPL (2.83Vrms, 1m)
  - Nominal impedance: 8Ω (minimum 3.1Ω)
  - Harmonic distortion: <1% (90Hz-22kHz), <0.5% (120Hz-20kHz)
  - Recommended amplifier power: 30W-200W into 8Ω on unclipped programme
  - Height: 165mm (cabinet) / 233mm (with tweeter)
  - Width: 628mm
  - Depth: 318mm (cabinet) / 356mm (including grille)
  - Weight: 18.5kg (40.8 lbs)
  - Finishes: Midnight Blue Metallic, Datuk Gloss
