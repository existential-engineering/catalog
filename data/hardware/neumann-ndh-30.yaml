description: "TEC Award Winner 2023: Reference-class open-back studio headphone
  for editing, mixing, and mastering."
details: |-
  The Portable Sound Reference

  Highlights:
  - Linear sound, similar to a perfectly calibrated Neumann loudspeaker system
  - High-resolution stereo panorama with precise localization
  - Transparent, detailed sound image, ideal for mixing & mastering
  - Excellent wearing comfort, easy to transport
  - TEC Award Winner 2023

  Features:
  - Outstanding linearity and transient response
  - High spatial resolution
  - Sound and mix compatibility with KH-Line speakers
  - High long-term comfort
  - Internally balanced, cloth covered cable (detachable)
  - Foldable for easy transport
specs: |-
  - Acoustic Principle: Dynamic open
  - Wearing Style: Headband
  - Ear Coupling: Circumaural
  - Frequency Range: 12 ... 34,000 Hz
  - Transducer Diameter: 38 mm
  - Transducer Magnet: Neodymium
  - Transducer Protection: Cloth covered grille
  - Nominal Impedance: 120 Ohms
  - Sensitivity: 104 dB SPL at 1 kHz / 1 Vrms
  - Max Input Power: 1000 mW
  - Continuous Input Power: 200 mW
  - Thd: <0.03% at 1 kHz and 100 dB SPL
  - Cable Entry: Single sided, right ear cup
  - Connectivity: 3.5 mm (1/8") TRS jack plug (straight), adapter for 6.3 mm (1/4")
  - Cable Length: 3.0 m (10')
  - Ear Cup Contact Pressure: 5.5-6.8 N
  - Weight Excluding Cable: 352 g
  - Headband Colors: RAL 9006 White Aluminium / RAL 7016 Anthracite Grey
  - Ear Cup Colors: RAL 9006 White Aluminium
  - Headband Materials: Spring steel strip, aluminium and plastic fittings, plastic trimming
  - Ear Cup Materials: Aluminium
  - Ear Pad Materials: Cloth covered foam
  - Packed Dimensions: 245 x 255 x 84 mm
  - Packed Weight: 0.97 kg
  - Operating Conditions: +5° C to +45° C, <90% RH; non condensing
  - Storage Conditions: -15° C to +70° C; <90% RH; non condensing
  - Packed Cube: 0.005 m³
