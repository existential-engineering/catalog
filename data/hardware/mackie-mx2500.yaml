url: https://mackie.com/en/products/amplifiers-processors/mx-series/MX2500.html
description: "1500W Professional Power Amplifier. The MX Series delivers
  amplification for installation and portable passive systems, with proven
  Mackie amplifier design delivering clear, punchy, distortion-free sound even
  when pushed to the limits."
details: |-
  The MX Series delivers amplification for installation and portable passive systems. Utilizing proven Mackie amplifier design history, they deliver clear, punchy sound that's distortion-free even when pushed to the limits.

  With optimized performance and super-quiet operation, the MX2500 is well-suited to pair with DRM Passive Loudspeakers and the SP260 Loudspeaker Processor for installation and live applications.

  Housed in a rugged 2U all-steel rackmount chassis with forced-air ventilation, the MX2500 provides 1500W of continuous bridged power and offers selectable parallel, stereo, and bridged operating modes alongside independent level control per channel.
specs: |-
  - 500W continuous power @ 8 ohms per channel
  - 750W continuous power @ 4 ohms per channel
  - 1500W continuous power @ 8 ohms bridged
  - Selectable parallel / stereo / bridged operating modes
  - Independent level control per channel
  - Selectable input sensitivity
  - Signal, Clip, and Fault LEDs per channel
  - Short, under-impedance, over-current and thermal protection
  - 2U rackmount chassis (all-steel, impact-resistant)
  - Forced-air ventilation
