details: |-
  Designed specifically for Latin players, these specialty hi-hats are designed to mount cowbells and jam blocks to play complex percussion patterns on the drum set.

  The 5520 integrates a bell stand, and its cousin the DWCP5520-2 has the same features and includes a double pedal. The DW 5000 Series Hi-Hat Stand offers classic patented DW innovations, including DW's Lateral Cymbal Seat Adjustment, Delta Ball-Bearing Hinge, Locking Clutch, and Folding Footboard.
