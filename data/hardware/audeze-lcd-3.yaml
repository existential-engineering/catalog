details: |-
  Introduced in 2011, LCD-3 is a technical landmark for Audeze, ushering in superior resolution and an expansive sound field. Receiving several design and technology improvements over its lifetime, LCD-3 now represents Audeze's most eminently listenable headphone, and is a long-time customer favorite.

  LCD-3 is musical and spacious, with powerful bass, engaging, natural midrange, and an extended top end. Listeners find themselves emotionally connected to the music as the LCD-3 wraps you in a rich, vibrant sound with real-world scale and authority.

  LCD-3 features a unique 110-ohm planar driver design with a powerful stacked magnetic structure to create a pleasing high resolution sound. It sounds best when paired with a high-quality headphone or integrated amplifier, either vacuum-tube or solid-state.

  LCD-3 is carefully handcrafted by skilled Audeze craftspeople, with luxurious zebrawood rings, precisely matched by grain and color, and subtle gold highlights. The soft, supple premium earpads cradle your head in plush comfort for hours of effortless listening.
