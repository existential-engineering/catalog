description: The 1073MPL is a 500 Series microphone preamplifier based on the
  1073MP design, featuring Class A, transformer-coupled circuitry with the
  characteristic warm, harmonically rich low end, slight resonant highs, and
  maintained focused mids. It includes two selectable input impedances, a
  high-impedance DI input, and uses the same Carnhill St Ives transformers as
  the 1073 and 1084.
details: |-
  The 1073MPL is the 500 Series version of the 1073MP, a mic pre-amp version of the 1073 equaliser. It delivers the same well-known characteristic Class A sound with its harmonically rich low end, slight resonant highs, and maintained focused mids that BAE is known for.

  Two selectable input impedances (1200 or 300 ohms) make the 1073MPL work well with a wide variety of microphones. As a coloured and versatile mic-pre, the 1073MPL maintains its sonic signature across a wide bandwidth.

  The module uses the same Carnhill St Ives transformers found in the original 1073 and 1084, and maintains the same modular design and hand-wiring construction philosophy BAE is known for. Original Marconi knobs complete the vintage aesthetic.

  In addition to standard mic and line inputs, the 1073MPL includes a high impedance DI input suitable for guitar and synthesizers, making it a versatile signal path option in a 500 Series format.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Line Input Impedance: 10k ohms
  - Output Impedance: 65 ohms
  - CMRR: 100dB min @ 60Hz
  - Maximum Output Level: +27.4 dBu @ 600Ω
  - Gain Range: 0 to 71 dB
