details: |-
  Based on Córdoba's top-selling C5-CE, the C5-CE Spruce adds a new option to a fan favorite. A soft cutaway provides easy access to the upper register, and a Fishman Presys II preamp amplifies your signal for stage and studio. Perfect as a first nylon-string guitar and ready for gigging, this lightweight model is built with a solid Engelmann Spruce top and Mahogany back and sides to produce a clear, powerful tone with beautiful sustain. Handmade in the traditional Spanish style, the C5's carved headstock, hand-inlaid wood rosette, Indian Rosewood binding, Savarez strings, and glossy PU finish result in a guitar that truly stands out from all other entry-level options. A lightweight adjustable truss rod is built into the neck for stability. Available in Natural finish with solid Engelmann Spruce top.
specs: |-
  - Construction: Solid Top
  - Family: Cutaway & Electric
  - Style: Classical
  - Bridge Material: Rosewood
  - Fingerboard Material: Rosewood
  - Neck Material: Mahogany
