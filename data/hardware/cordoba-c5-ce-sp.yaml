  - Tuning Machines: Córdoba Gold with Pearl Buttons
  - Electronics: Fishman Presys II
  - Controls: Tuner, Volume, Bass, Treble, and Phase Switch
  - Pickup Type: Undersaddle Piezo, Onboard Tuner
  - Scale Length: 650mm (25.6")
  - Nut Width: 50mm (2")
  - Number of Strings: 6
  - Strings: Savarez Cristal Corum High Tension 500CJ
  - Tuning: E-A-D-G-B-E
  - Country of Origin: China
