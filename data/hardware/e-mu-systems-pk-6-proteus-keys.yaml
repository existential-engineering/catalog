description: >-
  The E-mu PK-6 Proteus Keys is a 61-key performance keyboard built around the Proteus
  2000 sound engine, offering 64-voice polyphony, 32MB of expandable ROM sounds, and 16
  onboard arpeggiators for live performance. It packages the comprehensive Proteus sound
  library with real-time performance controls suitable for both live and studio
  applications across multiple musical genres.
details: |-
  The PK-6 Proteus Keys puts E-mu's acclaimed Proteus 2000 sound engine into a sleek keyboard format designed for live performance and studio work. It ships with the same 32MB "Composer" soundset found in the rack-mount Proteus 2000, covering a broad spectrum from realistic instruments to synthetic textures and effects, with expansion capability up to 128MB via additional ROM cards.

  Unlike the rack-mount Proteus 2000 which offers 128-voice polyphony, the PK-6 operates at 64 voices, a practical compromise for a keyboard instrument where hands-on playability takes priority. The 61-key keyboard features both velocity and aftertouch sensitivity, paired with 16 real-time controllers for expressive sound manipulation during performance.

  The performance feature set is robust, with 16 onboard syncable and programmable arpeggiators and E-mu's Super BEATS interactive Groove Mode for generating rhythmic patterns on the fly. Sixteen mute/enable buttons allow performers to build arrangements in real time, making the PK-6 well-suited for live electronic music contexts.

  Sound shaping is handled by 50 types of 6th and 12th-order Z-plane filters with multi-mode resonance, processed through a 24-bit dual stereo effects section. The unit provides 1,152 presets split between 640 ROM and 512 user-programmable slots, with two LFOs per voice for modulation. Four audio outputs and 24-bit DAC conversion round out the specification.
specs: |-
  - Polyphony: 64 voices
  - Sound ROM: 32MB "Composer" soundset (expandable to 128MB)
  - LFO: 2 per voice
  - Filter: 50 types of 6th and 12th-order Z-plane filters
  - Effects: 24-bit dual stereo processors (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Arpeggiator: 16 syncable/programmable
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 1,152 presets (640 ROM, 512 user)
  - Control: MIDI
  - Outputs: 4 analog
releaseDate: "2001"
