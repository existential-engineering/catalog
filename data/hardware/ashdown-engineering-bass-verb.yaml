description: The Bass Verb is a reverb pedal from Ashdown's Dr. Green range,
  designed specifically for bass. It offers a simple but powerful way to add
  depth to your tone, going from a light reverb to a full cathedral-style echo.
  The pedal features true bypass switching and is housed in a custom-designed
  steel casing built to withstand repeated stage use.
details: |-
  Reverb pedal for bass from the Ashdown Dr. Green range. Controls: Mix (adjust the blend of clean and effected signal) and Depth (control the size/amount of reverb). True bypass switching. Housed in a custom-designed steel casing.
specs: |-
  - Effect: reverb
  - Controls: Mix, Depth
  - True bypass switching
  - Steel casing
