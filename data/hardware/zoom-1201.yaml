description: The 1201 is a 19-inch rack-mount digital reverb and multi-effects processor carrying 363 preset programs across 33 reverb and effect types, selected from three banks of eleven effects with eleven variations each.
specs: |-
  - 363 preset effect programs (11 effects x 3 banks x 11 variations), 33 reverb and effect types in all
  - Bank A reverbs: HALL, ROOM, PLATE, VOCAL, AMBIENCE, REVERSE, GATE, POWER, ENSEMBLE, PERCUSSION, DIMENSION
  - Bank B: DELAY, CHORUS, FLANGER, CHO/REV, FLG/REV, DLY/REV, DLY+FLG, CHO+DLY, DLY+REV, CHO+REV, FLG+REV
  - Bank C: PITCH, PHASER, TRM-PAN, PIT-DLY, AUTO-FILTER, RING-MOD, Lo-Fi EFX, Vo-DIST, ROTARY, VOCODER, KARAOKE
  - Two bank B effects marked with a slash can run in parallel
  - Vocoder effect takes its envelope from the R input and applies the effect to the L/MONO input
  - KARAOKE effect works only with stereo sources
  - 11 character or variation settings per effect, with reverb time or a per-effect parameter on the second knob
  - Front-panel input level, mix (dry/wet), output level, character/variation and reverb time/adjust controls with a bank A/B/C switch
  - 18-bit 64-times oversampling A/D converter, 18-bit 8-times oversampling D/A converter
  - 44.1 kHz sampling frequency, full stereo configuration
  - Inputs (L/MONO, R): standard monaural phone jacks, reference level -10 dBm to +4 dBm, input impedance 7.5 kilohms mono and 15 kilohms stereo
  - Outputs (L, R): standard monaural phone jacks, reference level -10 dBm to +4 dBm, output impedance 330 ohms or less
  - A microphone or a low-output or high-impedance instrument needs an external preamp or mixer ahead of the input
  - EFFECT ON/OFF control jack for the optional FS01 foot switch, which also flashes the front LED orange when effects are bypassed
  - Conforms to EIA and DIN 19-inch rack mounting with four screw holes (rack screws not supplied)
  - 482 (W) x 44 (H) x 115 (D) mm, 1.5 kg, metal enclosure
  - 9V DC 300 mA from the supplied AC adapter, which powers the unit on as soon as it is plugged in
