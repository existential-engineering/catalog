details: |-
  As far as versatile and ubiquitous effects go, an overdrive emulating a pushed tube amp is as good as it gets. EL CAMBO fattens up your tone with a little (or a lot) of extra girth around the waist, providing that highly sought-after midrange “oomph” that cuts through the mix, especially when your band is pushing hard decibels. This particular gritty honk gives your guitar a powerful voice that is ideal for a singing blues solo, and it’s also perfect for a hard rockin’ lead boost over the top of your amp’s already overdriven sound. Crank it up and testify!    •    Vintage all-analog overdrive    •    True Bypass    •    Built like a tank

  A Mountain of Mids

  EL CAMBO OVERDRIVE delivers a distinct midrange boost, one that can instantly warm up your tone, even if it’s a bit too jangly to cut through a loud rhythm section. Thanks to its symmetrical clipping overdrive circuit, the harmonic saturation is amazingly fluid and musical sounding.

  Boost into Epic Solo-Mode

  With plenty of gain and boost on tap, EL CAMBO can be tailored to work in almost any setting. From adding just a bit of push to your preamp with subtle warmth to your tone, to a screaming overdrive with singing sustain and thickness, EL CAMBO gets you there. Whether the moment calls for blistering Texas-style blues, soulful pop ballads or classic rock riffs – EL CAMBO fits the bill!
