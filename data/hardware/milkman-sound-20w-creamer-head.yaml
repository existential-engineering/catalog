description: A 20-watt Class AB guitar amplifier head with a cathode bias
  circuit supporting 6L6 or 6V6 output tubes, tube tremolo, and spring reverb.
details: |-
  The Little Milkman that Delivers

  ABOUT

  I design amps based on my own experience and needs, and when it came time to design the Creamer, I wanted to find a balance between a perfectly voiced guitar tone with a fair amount of power and portability. Everyone loves low power vintage amplifiers, but sometimes I need a bit more power, reliability, and headroom on the gig. In studio, the Creamer is virtually silent when idle. Its the ultimate refinement and alternative to the vintage small format amplifier. I wanted the Creamer to be very versatile so I included a cathode bias circuit so that the user can easily substitute 6L6 or 6V6 output tubes with no need to rebias the output tubes. I have added a rear mounted switch to maintain an 8ohm speaker output regardless of which tube type used. With 6V6 the Creamer puts out about 20 watts into 8ohms and has sweet breakup. Put a pair of 6L6s in, flip the switch on the rear panel and you get a bit of more low end, subtler mids, and a touch more headroom. The tremolo circuit in the Creamer is unique and sounds outstanding. It is harmonically rich, deep, and has a very useful range of speed.

  Like all Milkman amplifiers, the Creamer is built using the finest possible components such as bespoke Soursound transformers and Jupiter capacitors. It is hand wired onto a turret board with cloth covered wire. WATTAGE

  18-22W Class AB

  EFFECTS

  Tube tremolo and spring reverb
  Includes handwired original design detachable footswitch and 15' cable

  Demo

  20w Creamer Demo by Josh Smith

  Josh Smith takes the Creamer for a long drive. Ceramic speaker installed. SOUNDS

  Listen

  Reviews

  John Mayer

  Los Angeles, CA

  www.johnmayer.com

  I just plugged in the Creamer amp, and I have to tell you I absolutely love it. The Creamer is EQ'd perfectly

  Scotty Murray

  Nashville, TN

  www.andersoneast.com

  The Creamer is amazing on any size stage. It keeps the low end in tact and the tone funky at any volume! Grant Siemens

  Winnipeg, Canada

  www.corblund.com

  This amp is just amazing. You nailed it. It is reverb drenched pychedalic love child of a tweed deluxe and a princeton reverb. It has the chime and spank of a princeton and the low end bark of a tweed. You somehow married my two favourite things into one tight amazing little package.
