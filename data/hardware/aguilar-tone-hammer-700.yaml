description: Designed for the discerning bassist, the Tone Hammer 700 is a
  lightweight yet powerful 700-watt Class D bass amplifier inspired by the
  soulful warmth of tube amplifiers. Its rich, harmonically-voiced preamp
  features a classic 3-band EQ with fully sweepable midrange, a proprietary AGS
  Drive circuit, and the Aguilar Cabinet Suite for studio-quality cabinet
  emulation.
details: |-
  Inspired by the soulful warmth of classic tube designs, the Tone Hammer 700
  delivers a rich, harmonically complex character that sets it apart from typical
  Class D amplifiers. Its solid-state preamp is voiced to evoke the depth and
  roundness of vintage tube circuits, making every note resonate with presence
  and musicality.

  The intuitive 3-band EQ section provides sweeping tonal control with bass at
  40 Hz, treble at 4 kHz, and a fully sweepable midrange spanning 180 Hz to
  1 kHz. The unique Drive control employs Aguilar's proprietary AGS (Adaptive
  Gain Shaping) circuit to dial in anything from subtle harmonic warmth to
  pronounced midrange punch and grit, without sacrificing note definition.

  At the output stage, the Tone Hammer 700 delivers 700 watts into 2.67 or 4 ohms
  and 350 watts into 8 ohms, driven by an efficient switching-mode power supply
  and cooled by dual whisper fans with thermal speed control. Universal mains
  voltage support makes it equally at home on any stage worldwide.

  The Aguilar Cabinet Suite enables players to load any of Aguilar's in-house
  designed SL and DB series cabinet impulse responses — or their own custom IR
  files — for cabinet emulation via XLR or headphone output. The dual XLR
  architecture lets users simultaneously shape a monitor mix with cabinet IRs
  while sending a clean, pre-EQ signal to front-of-house.

  Weighing just 5.67 lbs and measuring 12.5" × 9" × 3", the Tone Hammer 700 is
  engineered for demanding touring schedules and professional studio sessions
  alike, offering the connectivity and flexibility that modern bassists require
  in an exceptionally compact and lightweight package.
specs: |-
  - Power output: 700W @ 2.67 or 4 ohms
  - Power output: 350W @ 8 ohms
  - Preamp section: Solid state
  - Power section: Class D
  - Power supply: Switching mode (SMPS), universal mains
  - Bass EQ: ±17 dB @ 40 Hz
  - Mid Level EQ: ±16 dB
  - Mid Frequency sweep: 180 Hz – 1 kHz
  - Treble EQ: ±14 dB @ 4 kHz
  - Drive: Proprietary AGS (Adaptive Gain Shaping) circuit
  - Effects loop: Series operation, adds 6 dB of additional gain
  - Aguilar Cabinet Suite: Load SL/DB cabinet IRs or custom IR files
  - Dual XLR outputs: Monitor mix (with IR) + pre-EQ front-of-house
  - XLR output: Pre/post EQ switch + ground lift
  - Speaker output: Neutrik Speakon
  - Cooling: Two whisper fans with thermal speed control
  - Dimensions: 12.5" × 9" × 3" (W × D × H)
  - Weight: 5.67 lbs (2.57 kg)
