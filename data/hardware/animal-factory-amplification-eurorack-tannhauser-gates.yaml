name: Tannhäuser Gates
manufacturer: animal-factory-amplification
primaryCategory: modular
categories:
  - mixer
  - equalizer
hp: 20
url: https://animalfactoryamps.com/products/eurorack-tannhauser-gates
description: A Eurorack quad VCA and expandable mixer module inspired by the
  Buchla 110, with discrete overdriving VCAs, stereo panning, a tilt EQ, mute
  switches, and stereo send/return paths. It can be expanded to build up to 16
  channels of mixing.
details: |-
  If you're based in the US or Canada, write us an email instead - we have limited stock in CA. Do Eurorack modules dream of electric cats? The Tannhäuser Gates is an unfaithful homage to the Buchla 110 Voltage Controlled Gate. Each of the 4 channels boasts a discrete VCA with a rich overdrive sound, stereo panning, a tilt EQ and an easily accessible mute switch. Each channel can be used individually as a mono track, or all four can be summed down to the stereo output. The four channels have an individual CV input, or they can all be controlled via a master CV input. The Tannhäuser Gates also hosts the capability for a stereo send and return path, expanding your sonic arsenal to other processing modules. Tannhäuser Gates is designed with future expansion in mind. Adding up to three more Tannhäuser Gates modules, it is possible to build a performance mixer system of up to 16 channels, all summed to a single output module. The back side of the module is equipped with a number of expansion headers for easy integration with future modules.
specs: |-
  - Discrete VCAs with a distinctive warm and fat tone when driven hard
  - Very quiet muting
  - Simple and very effective single-knob tilt EQ
  - Full stereo send/return and summing paths
  - Attenuverters on CV inputs allow for ducking
  - CV inputs normalize to a Master CV - amplify and/or duck 4 voices simultaneously
  - Future-ready with numerous expansion possibilities
  - DIP switches on back to accommodate for different output levels
  - Readily expandable to up to 16 channels (3 more Tannhäuser Gates) of Eurorack mixing!
