description: Mini-format 2-in / 8-out multi-purpose passive line selector
details: |-
  A compact, 100% passive stereo line selector that connects one stereo source to up to four additional devices simultaneously or in any combination. Features internal ground lift adjustment per channel. Use cases include passive monitor switching with subwoofer toggling, headphone distribution, effects chain auditioning, and parallel effects routing.
specs: |-
  - Design: 100% passive
  - Inputs: 2 (1 stereo pair)
  - Outputs: 8 (4 stereo pairs — A, B, C, D)
  - Ground Lift: Internal, per channel
  - Height: 40mm (1.6")
  - Width: 140mm (5.5")
  - Depth: 124mm (4.9")
  - Weight: 1.6 lbs (726g)
