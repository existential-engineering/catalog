description: >-
  The Atmegatron is an 8-bit monophonic MIDI synthesizer from Soulsby, featuring a unique
  Wavetable PWM Synthesis engine. Housed in a stylish white aluminum case with walnut side
  panels, it delivers classic chiptune sounds with 32 factory waveforms, 15 digital
  filters, and built-in effects. The synth is fully open-source and hackable via the
  Arduino development environment.
details: |-
  The Atmegatron was Soulsby's inaugural synthesizer, released in 2014. It is built around the Atmel 328P processor, the same chip commonly found in Arduino boards, making it uniquely accessible to programmers and tinkerers. Open-source code, a free Arduino development environment, and tutorials are available from the official website.

  The front panel features a distinctive design with two opaque dials that can switch in color between green and red. The control scheme is straightforward: the left-hand dial selects parameters while the right-hand one changes values, eliminating the need for an LCD display. A color-changing button allows four of the six top-panel knobs to switch to alternate modes. The synth comes with 16 preset sounds that users can overwrite with custom patches.

  Sound capabilities include 32 factory waveforms along with six user-programmable waves, 15 digital filter modes, two LFOs with 16 waveforms each, and two ADSR envelopes. Built-in effects include a wave crusher, phaser, and distortion. An arpeggiator provides 15 sequences. All synthesis is 8-bit, producing the characteristically harsh, brittle tones prized in chiptune music.
specs: |-
  - Polyphony: 1 voice (monophonic)
  - Multitimbral: 1 part
  - Oscillators: 1
  - Waveforms: Pulse Variable, Wavetable (32 factory, 6 user)
  - Filters: 15 digital filter modes
  - LFOs: 2 with 16 waveforms each
  - Envelopes: 2 ADSR
  - Arpeggiator: 15 sequences
  - Effects: Wave Crusher, Phaser, Distortion
  - Memory: 16 patches (RAM)
  - Processor: Atmel 328P
  - MIDI: In, Out (5-pin DIN)
  - Audio Output: 1/4-inch, mini-jack headphone
  - Power: 12V DC
  - Case: White aluminum with walnut side panels
