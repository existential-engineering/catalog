description: A Custom Shop revival of the SOV-2 overdrive, whose internal DC-DC
  converter boosts the 9 Vdc input to plus/minus 15 Vdc to give the signal
  circuit an overwhelming dynamic range and the soft harmonics of a vacuum tube.
details: |-
  Free The Tone's SOV overdrive evolved over twenty years and attracted a great many guitarists. Of its several variations, the final form, the CUSTOM SERIES SOV-2, went out of production in 2018, much to the regret of many. Five years later, with the SOV-3 still in development after a long period of work, the decision was made to revive the SOV-2 by producing a small quantity and selling it through the Free The Tone Custom Shop.

  The SOV-2 overdrive adopts a high-performance DC-DC converter in its internal power circuit, boosting the 9 Vdc input to plus/minus 15 Vdc to supply and operate the signal circuit. That allows an overwhelming dynamic range, reproducing the sound and character of the guitar, delicate picking nuances and hand touch as differences in tone while a natural drive is applied. The pedal reproduces the soft harmonics and rich drive sound that vacuum tubes possess.

  Although the SOV-2 uses no vacuum tubes, several years of work went into designing it to reach the soft harmonics and dynamics of a tube amplifier, and the power circuit came first. Raising the supply voltage is effective in achieving those dynamics, and while a power transformer is one method it is expensive and impractical inside a small die-cast case, so a high-performance DC-DC converter was used instead. A powerful filter circuit was added to reduce the power-line noise caused by the converter's oscillation circuit, because the power circuit directly affects sound quality.

  Optimizing the signal path came next. A considerable number of prototypes were built to get closer to the intended sound, which is why the SOV-2 took several years to complete. The result matches not only Marshall and Fender amplifiers but many boutique amplifiers too, and the designer recommends combining it with other overdrive pedals to widen its range of sounds.

  The appearance of the SOV-2-CS is finished to specifications designed for musicians. The die-cast case is unpainted and the lettering and other markings are printed on labels and attached by hand one at a time. Inside the back cover of each unit is a handwritten signature by the developer, Yukihiro Hayashi. Because current consumption is relatively large at approximately 90 mA, an AC adapter is recommended over a battery.
specs: |-
  - Input impedance: 1 MOhm
  - Output load impedance: min. 10 kOhm
  - Controls: DRIVE, TONE, LEVEL
  - Terminals: 2x 1/4-inch phone jacks (for input and output), 1x DC9V input jack (for AC adapter)
  - Power supply: 9-volt battery (PP3/006P) or AC adapter
  - Current consumption: approx. 90 mA
  - Internal plus/minus 15 Vdc rail from a high-performance DC-DC converter
  - Dimensions: 72W x 115D x 50H mm (incl. protuberances such as footswitches, jacks, etc.)
  - Weight: approx. 225 g (excl. battery)
  - Unpainted die-cast case with hand-applied label markings and a handwritten developer signature inside the back cover
  - Accessories: warranty card, manual, 4x rubber feet
