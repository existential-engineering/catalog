description: 20-watt, two-channel compact tube guitar amplifier head with a
  built-in IR loader, XLR output and headphone out in a lunchbox-style chassis.
details: |-
  The RAVAGER IR is a 20-watt, 2-channel tube amp that blends vintage tone with modern technology. Designed for musicians seeking a versatile, portable solution, the RAVAGER delivers sound quality in a compact lunchbox-style chassis.

  The E725 RAVAGER uses 2 x 12AX7/ECC83 in the preamp and 2 x EL84 in the poweramp section, producing dynamic, harmonically rich tones. Its dual-channel design provides pristine cleans and aggressive overdrive, making it suited to stage, studio, or home use.

  A key feature is the built-in IR Loader, enabling four impulse responses, three of which can be loaded via USB, for cab simulation. This makes recording and silent practice effortless. The amp is also equipped with an XLR output for live and studio applications, along with a headphone out for private practice.

  The integrated Power Soak feature allows the output power to be reduced for cranked tube tones at lower volumes, suited to home or studio environments. Whether performing live, tracking in the studio, or practicing at home, the amp offers professional-grade sound and features.
specs: |-
  - 20 W all-tube output
  - 2 channels (clean and overdrive)
  - Preamp tubes: 2 x 12AX7/ECC83
  - Power amp tubes: 2 x EL84
  - Built-in IR loader with four impulse responses, three user-loadable via USB
  - Power Soak for reduced output power
  - XLR output for live and studio use
  - Headphone output for silent practice
  - Compact lunchbox-style chassis
