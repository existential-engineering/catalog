details: |-
  The HT7 is a professional single ear head-worn condenser microphone designed for stage, presentation, and broadcast applications. With a miniaturized element of only 3 mm, the HT7 qualifies as the smallest microphone in the AUDIX lineup. The professional-grade omnidirectional HT7 features a comfortable earpiece that can be worn around either the left or right ear and a durable and adjustable length boom arm. The HT7 may be used wireless or wired with an optional phantom power adapter. Engineered for using wireless bodypack systems such as AUDIX wireless systems, the HT7 condenser microphone can be used with other brands of wireless body packs. A selection of adapters is available depending on the input connectors of the bodypack. Designed to blend with the skin tone of the wearer, the HT7 omnidirectional microphone is available in two colors-beige and black.

  Model Variations
  HT7BG4P – Ultra-lightweight head-worn omnidirectional microphone, single-ear, with 4′ cable, pouch, beige windscreen, 4-pin mini XLR screw-on connector. Beige.
  HT7BG3P – As above with 3-pin mini XLR screw-on connector. For wired use, combine with APS910.
  HT7B4P – Ultra-lightweight head-worn omnidirectional microphone, single ear, with 4′ cable, pouch, 2 black windscreens, 4-pin mini XLR screw-on connector, printed box. Black.
  HT7B3P – As above with 3-pin mini XLR screw-on connector. For wired use, combine with APS910.
specs: |-
  - Type: Single-ear head-worn condenser microphone
  - Polar pattern: Omnidirectional
  - Capsule: 3 mm miniaturized element
  - Cable: 4 ft, terminating in mini XLR screw-on connector (3-pin or 4-pin)
  - Powering: Wireless bodypack, or wired via APS910 phantom power adapter
