  Crafted with an Adirondack spruce top in an espresso vintage burst, East Indian rosewood back and sides, a mahogany neck, and an ebony fretboard, this guitar pairs brass inlays and Gotoh open-gear tuners with Elixir Phosphor Bronze light strings for a warm, balanced voice. Stunning and mellow, it delivers subtle overtones and controlled projection with expressive response across the dynamic range, while BREEDLOVE'S Soft C low-profile neck and an LR Baggs Anthem pickup provide effortless playability and refined tone for any style.
