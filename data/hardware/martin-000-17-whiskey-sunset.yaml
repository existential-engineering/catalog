details: |-
  The 000-17 Whiskey Sunset blends vintage style with a balanced tone that's full of character. Built with a solid spruce top and mahogany back and sides, it offers clear articulation with a touch of warmth, ideal for a wide range of playing styles.

  The Whiskey Sunset Burst top, satin finish, and antique white binding give it a bold, old-school look that stands out. Scalloped X-bracing brings out dynamic response and tonal nuance, while the 24.9" scale length and 1 3/4" nut width provide a comfortable playing feel.

  The Modified Low Oval neck profile makes for easy fretting, and the East Indian rosewood fingerboard features 1955 Style 18 mother-of-pearl inlays for a classic touch. Aged nickel tuners and a modern straightline rosewood bridge round out the aesthetic.

  Whether you're writing, recording, or playing live, the 000-17 Whiskey Sunset delivers vintage inspiration with every note. Due to material availability, this guitar is designed with either a tortoise pattern or black pickguard; selection may vary.
