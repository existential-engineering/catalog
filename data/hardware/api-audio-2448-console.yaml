id: OrUiaJUMSR4Q5paKpQ7PW
name: 2448 Console
manufacturer: api-audio
primaryCategory: console
categories:
  - mixer
url: https://apiaudio.com/product/2448-console/
description: Large-format analog recording console available in 24, 32, or 40
  channel configurations with inline architecture, per-channel 500 Series EQ
  slots, 8 multitrack buses, 8 auxiliary buses, and optional Final Touch
  Automation® system.
details: |-
  Available in 24, 32, or 40 channel inline configurations. Each channel includes a built-in mic preamp and 500 Series EQ slot. 24-ch frame includes 16× 550A + 8× 560 EQs; 32-ch adds 24× 550A + 8× 560; 40-ch has 30× 550A + 10× 560. Features 56 channels to mix bus (24-ch frame), dual inputs per channel, 4 stereo returns with 100mm faders, 5.1 surround monitoring, and classic analog metering.

  Optional Final Touch Automation® provides motorized faders, 7.5" touchscreen control, unlimited fader groups, DAW control with unity gain audio bypass, and unlimited mix restore points. Optional 529C Stereo Bus Compressor available. Multiple layout options including with 19" rack bays and 30" producer's desk.
specs: |-
  - Configurations: 24, 32, or 40 channel inline
  - 8 multitrack buses, 8 auxiliary buses, 1 stereo bus
  - 4 stereo returns with 100mm faders
  - 56 channels to mix bus (24-ch frame)
  - 24-ch: 16× 550A + 8× 560 EQs
  - 5.1 surround monitoring
  - Optional Final Touch Automation® (7.5" touchscreen, motorized faders)
  - Optional 529C Stereo Bus Compressor
