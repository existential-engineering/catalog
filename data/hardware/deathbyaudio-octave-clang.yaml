description: CLANG THE WAY IT'S MEANT TO BE The highly coveted Octave Clang has
  made a triumphant return to Death By Audio's workshop. Long presumed extinct,
  the OC was never really gone, merely in a state of hibernation—evolving,
  refining, and enhancing its already extraordinary sound.
details: |-
  The Octave Clang returns after a decade away, its original circuit revisited and sculpted into a more ferocious, menacing, and thunderous force built for today's musicians. This version extends the range of the original controls, adds a foot-switchable octave, and includes under-the-hood supercharging, letting you sculpt discordant ringing drones, visceral octave scrapes, and ground-shaking distortion.

  A special octave transformer delivers a blend of octave-up fuzz and "clangorous" tones, covering everything from deep resonant lows to searing high-octane leads. An internal bias knob lets you fine-tune the op-amp's behavior, making the fuzz and octave smooth or hard.

  The left footswitch bypasses the pedal (red LED), while the right footswitch toggles the Octave Up mode (yellow LED, which indicates engagement even when bypassed). Volume controls the output level from silent to extremely loud, Gain sets the drive with up to +39dB on tap, and Tone is a pre-gain tilt EQ that shifts highs and lows into the circuit for either blown-out or cutting tones. The internal Bias control, accessed by removing the back plate, misbiases the distortion circuitry for a rougher character and should be left in the middle for standard operation.
specs: |-
  - Power Supply: Powered by a standard 2.1mm 9V DC adapter with center-negative polarity. Isolated power supplies are recommended. Can also be used with a 9V battery (not provided).
  - Current Draw: 10 mA
  - Dimensions: 4.8" x 3.7" x 2.1" (including hardware)
  - Weight: 11.5 oz.
