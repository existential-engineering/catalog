description: All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. Designed for serious guitarists with the need for speed, the ESP M-II CTM 7 FR offers the extended low-end range provided by a seven-string instrument.
details: |-
  All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. Designed for serious guitarists with the need for speed, the ESP M-II CTM 7 FR offers the extended low-end range provided by a seven-string instrument.

  Available in the finely textured ESP exclusive Black Lava finish, this guitar has set-thru construction at 25.5" scale, allowing smooth, unfettered access to the highest frets, sturdily adjoining an alder body to a fast and smooth slim u-shaped three-piece maple neck.

  It has an ebony fingerboard with 305mm radius that includes offset bar inlays, Luminlay side dots, a reverse matching headstock, and 24 extra-jumbo stainless steel frets.

  Components on this perfectly-crafted shred machine include black hardware, ESP strap locks, Gotoh locking tuners, a Floyd Rose Original double-locking tremolo bridge, and a set of EMG 57-7H (bridge) and EMG 66-7H (neck) active pickups with brushed black chrome covers, delivering everything from balanced, creamy smooth tones to aggressive, in-your-face punch. Includes a deluxe ESP form fit case.

  Finish: Black Lava. Series: M-II Series, ESP Original Series. New for 2026.
specs: |-
  - Construction: Set-Thru
  - Scale: 25.5"
