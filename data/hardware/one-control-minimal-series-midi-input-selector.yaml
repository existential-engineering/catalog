specs: |-
  - Power on the unit and select an input while not pressing the foot switch in Flash mode
  - Turn off the power by removing the adapter
  - Reconnect the adapter while holding the foot switch until the LED turns white
  - Turn off the power by removing the adapter
  - Reconnect the adapter while holding the foot switch until the LED turns red
