description: ProFX10v3+ is a compact analog mixer and USB-C audio interface with
  features from a studio recording console. Equipped with essentials including
  one-knob compression, EQ, Hi-Z switches and 100 Hz low-cut filters, it's the
  perfect centerpiece for your studio.
details: |-
  Mackie ProFX10v3+ is a professional analog mixer and USB-C audio interface with powerful enhancements for studio-quality recordings and live streams. Capture your performance with Onyx preamps and channel EQ, add computer audio via loopback, bring in calls via Bluetooth and enhance your sound with upgraded GigFX+ effects on a color LCD screen.

  With up to 60 dB of gain and ultra-low noise, ProFXv3+ series mixers allow you to sound better than ever. Record podcasts, stream gameplay or produce the next hit, all with ultra-clean, transparent audio.

  The GigFX+ engine carries 12 presets you can edit and save on the fly via the full-size LCD screen, combining the warmth of an analog recording console with precise digital effects.

  Capture your stream or performance at 24-bit / 192 kHz quality with a built-in 2x4 USB-C audio interface, complete with three recording modes: Standard for the full mix with effects, Loopback to include computer audio with the mixer signal for streaming, and Interface to record channels 1-2 without effects processing.

  Channels 1 and 2 are XLR and 1/4 inch combo inputs with Hi-Z switches and one-knob compression, channels 3 and 4 add separate XLR mic and 1/4 inch line jacks, all four mono channels carry an insert, channels 5/6 and 7/8 are stereo 1/4 inch line pairs and channel 9/10 takes the 1/8 inch stereo input or Bluetooth. Power comes from an external 12 VDC supply with a locking barrel connector.
specs: |-
  - 4 Onyx mic pres with up to 60 dB of gain and ultra-low noise performance
  - High-resolution GigFX+ effects engine with 12 editable, storable presets
  - Full-color LCD display for editing and saving effects presets
  - 24-bit / 192 kHz 2x4 USB-C audio interface (1 stereo input, 2 stereo outputs)
  - Three recording modes: Standard, Loopback and Interface
  - Bi-directional Bluetooth for music playback and caller integration
  - 3-band EQ on all channels (80 Hz low, 2.5 kHz mid, 12 kHz high, +/-15 dB)
  - One-knob compression on channels 1 and 2
  - Hi-Z switches on channels 1 and 2 for direct connection of instruments
  - 100 Hz low-cut filter at 18 dB/octave and 48V phantom power on all mic channels
  - Four 1/4 inch channel inserts on channels 1-4
  - Stereo 1/8 inch input on channel 9/10
  - Headphone output with separate level and blend control, plus stereo control room outputs
  - Footswitch input for FX mute and a 1/4 inch FX send
  - Equivalent input noise -126 dBu, all inputs +22 dBu maximum, main mix XLR +28 dBu
  - 12VDC 2A Class I hard-wired wall mount power adapter with locking barrel connector
  - Dimensions 10.7 x 11.9 x 3.3 in / 272 x 302 x 84 mm, weight 4.9 lb / 2.2 kg
