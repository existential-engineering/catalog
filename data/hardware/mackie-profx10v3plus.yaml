url: https://mackie.com/en/products/mixers/profxv3-series/ProFX10v3plus.html
description: "10-Channel Analog Mixer With Enhanced FX, USB Recording Modes and
  Bluetooth. ProFX10v3+ is a compact analog mixer and USB-C audio interface with
  features from a studio recording console."
details: |-
  ProFX10v3+ is a compact analog mixer and USB-C audio interface with features from a studio recording console. Equipped with essentials including one-knob compression, EQ, Hi-Z switches and 100 Hz low-cut filters, it's the perfect centerpiece for your studio.

  Mackie ProFX10v3+ is a professional analog mixer and USB-C audio interface with powerful enhancements for studio-quality recordings and live streams. Capture your performance with Onyx preamps and channel EQ, add computer audio via loopback, bring in calls via Bluetooth and enhance your sound with upgraded GigFX+ effects on a color LCD screen.

  Four Onyx mic preamps deliver up to 60 dB of gain with ultra-low noise performance, and the high-resolution GigFX+ effects engine pairs with a full-color LCD display for editing and saving effects presets. Three USB recording modes (Standard, Loopback and Interface) support live streaming and studio workflows via the 24-bit / 192 kHz 2x4 USB-C audio interface.

  Bi-directional Bluetooth enables music playback and caller integration for podcasts and streams, while a stereo 1/8" input on channel 9/10 adds further flexibility. A headphone output with separate level and blend control rounds out the monitoring options.
specs: |-
  - 4 Onyx mic pres with up to 60 dB of gain and ultra-low noise performance
  - High-resolution GigFX+ effects engine
  - Full-color LCD display for editing and saving effects presets
  - 24-Bit / 192 kHz 2x4 USB-C audio interface
  - Three recording modes: Standard, Loopback and Interface
  - Bi-directional Bluetooth for music playback and caller integration
  - 3-band EQ on all channels
  - One-knob compression on channels 1 and 2
  - Hi-Z switches allow direct connection of instruments
  - 100 Hz low-cut filter and 48V phantom power on all mic channels
  - Stereo 1/8" input on channel 9/10
  - Headphone output with separate level and blend control
  - Waveform OEM recording software included
  - Solid steel chassis with ABS side protection
