description: The JHS Pedals Emperor V2 is a fully analog chorus and vibrato
  pedal built around a 3207 bucket brigade chipset, offering tap tempo, stereo
  output, expression control, and multiple waveform selections.
details: |-
  In 2014 we brought you the Emperor V1, a 100% Analog Chorus/Vibrato with Tap Tempo. Now in 2018 we are proud to bring you the Emperor V2! There are two ways to look at the JHS Pedals Emperor Analog Chorus/Vibrato pedal. The Emperor V2 is a vintage-correct effect that absolutely nails the hard-to-find sound of the Arion SCH-1...but it's also a do-it-all modulation solution whether you want a subtle sheen, convincing rotary simulation, or seasick vibrato. It utilizes a Bucket Brigade 3207 chipset to deliver the warmth of '80s-style analog chorus pedals and we've added enough onboard and outboard control to put you in command of every aspect of the Emperor's voice. Whether spreading its warm tones or icy sheen to a pristine-sounding stereo rig, or utilizing an external expression pedal to cop realistic rotary speaker sounds on a blues gig, the Emperor can do it all.
