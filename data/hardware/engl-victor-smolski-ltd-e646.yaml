url: https://www.engl-amps.com/shop/signature/victor-smolski-ltd-e646/
description: Victor Smolski signature 100 W all-valve guitar amplifier head with
  four channels on two shared EQs, 6L6GC output valves, a Middle Voiced circuit,
  Depth Punch, a valve-buffered FX loop and a noise gate.
details: |-
  Victor Smolski is a metal guitarist of the modern kind and is one of the world's best at his craft. His guitar playing has everything it needs: technique, tone and attitude. For his signature amp, we needed to harness all the power, attack and low end we could muster.

  The amp draws its power from four 6L6GC tubes in the power amp stage, and is able to deliver everything from balladic clean moments to crashing riff thunderstorms and sizzling solos.

  Each pair of channels (Clean and Crunch, and Lead 1 and Lead 2) share an EQ. The mid-voiced function affects all four channels, but you can refine it on channels 3 and 4. Activate Depth Punch to unleash an extra portion of low end in the power amp stage, tone doesn't get chunkier.

  All this power must somehow be tamed, so we deviated from the typical ENGL front grille for this amp and used hand-welded chains. The snakeskin optics do the rest and make the E646 a purebred metal amp. Not for nothing are the words straight to hell inscribed directly above the input jack.

  Alongside the four channels sit a valve-buffered FX loop with a balance control, a noise gate with a rear-panel threshold, Master A and Master B volumes, a power valve monitor, and switching from an ENGL Z4 or Z9 footswitch over the footswitch jack or the S.A.C. port.
specs: |-
  - 4 channels: Clean, Crunch, Lead 1, Lead 2
  - All-valve head
  - Valve-buffered FX loop with balance control
  - Noise gate with rear-panel threshold control
  - Master A/B
  - Power valve monitor
  - S.A.C.: Serial Amp Control
  - Sound option: Middle Voiced
  - Controls: Gain (per channel), 3-band EQ for Clean and Crunch (shared) with separate Treble controls, 3-band EQ (shared Lead 1 / Lead 2), Middle Voiced control (Lead 1 / Lead 2), Volume (per channel), Presence, Depth Punch, Master A, Master B, Noise Gate threshold, FX Loop Balance
  - Poweramp output: 1 x 4 ohm, 1 x 8 ohm, 1 x 16 ohm, 2 x 8 ohm parallel, 2 x 16 ohm parallel
  - Footswitch: Z4 or Z9 (channels, Master A/B, Middle Voiced, FX loop, noise gate)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 4 x ENGL 6L6GC
  - Output power: 100 W
  - Hand-welded chain front grille with snakeskin covering
  - Dimensions: 71 x 27 x 27 cm
  - Weight: 21 kg
