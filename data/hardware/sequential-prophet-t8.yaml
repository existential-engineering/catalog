description: >-
  The Prophet T8 was Sequential Circuits' finest analog synthesizer, featuring an 8-voice
  polyphonic architecture with a fat Prophet-5-like tone. Its 76 weighted keys with
  velocity and aftertouch earned it the reputation as the Rolls Royce of analog
  synthesizers, though it struggled commercially against the more affordable Yamaha DX7
  upon its 1983 release.
details: |-
  The Prophet T8 was Sequential Circuits' flagship analog polysynth, representing the pinnacle of the company's analog synthesizer design. It offered digital control of analog sound with an extremely flexible, intuitive, and beautiful design, right down to its wood panels. The instrument featured a full MIDI implementation, split/layer/double/unison keyboard modes, and a simple but useful real-time sequencer capable of storing 670 notes.

  The T8's most celebrated feature was its 76 full-size weighted keyboard with both velocity sensitivity and aftertouch, making it one of the most expressive analog synthesizers ever produced. Each of its 8 voices was powered by 2 VCOs (16 oscillators total), with a 24dB/octave low-pass filter featuring cutoff, resonance, envelope amount, and key tracking per voice.

  Despite its exceptional build quality and sound, the Prophet T8 was released in 1983 at a time when the market was shifting toward the more affordable Yamaha DX7, limiting its commercial success. Notable users included Howard Jones, the Thompson Twins, and producer Steve Levine.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 VCOs per voice (16 total)
  - Filter: 24dB/oct low-pass with cutoff, resonance, envelope amount, key tracking
  - LFO: Square, triangle, and sawtooth waveforms
  - LFO Destinations: Oscillator A, Oscillator B, pulse width, filter
  - Envelopes: 2 ADSR per voice
  - Keyboard: 76 weighted keys with velocity and aftertouch
  - Memory: 128 patches
  - Sequencer: Real-time, 670 note capacity
  - Control: MIDI
