description: The TS112 is the largest subwoofer in EVE Audio's ThunderStorm
  range, an active 12 inch design whose highly efficient PWM amplifier delivers
  400 W of short term output power to a 12 inch woofer for a clean response from
  24 Hz to 300 Hz and a maximum 112 dB SPL at 1 m. A passive radiator takes the
  place of a bass reflex tube, and balanced XLR inputs and outputs let the TS112
  sit between the source and the satellite monitors.
details: |-
  EVE Audio's ThunderStorm range of subwoofers is built to give precise control over the bass frequencies in a room without low-port noise distortion, because every model uses a passive radiator rather than a reflex tube. The intent is a system that sounds as a whole rather than a sum of parts, and each ThunderStorm carries detailed controls, including switchable satellite filters, a phase switch and variable subwoofer filter frequencies, so the low end can be tailored to a specific room.

  The TS112 is EVE Audio's largest, no-compromise subwoofer. Its highly efficient PWM amplifier is capable of 400 W of short term output power, and coupled with a large 12 inch woofer it guarantees a clean frequency response down to 24 Hz and up to 300 Hz, for a maximum output of 112 dB SPL at 1 m.

  As with every other EVE Audio subwoofer, the TS112 provides balanced XLR inputs and outputs (stereo in and out, LFE in, LFE and sub out).

  The DSP section uses a high resolution Burr-Brown converter and affects only the bass driver operation. The signal path to the satellite speakers is kept purely analog with no A/D/A conversion, which is why the Pure Satellite function, when activated, bypasses the subwoofer and the DSP filter section completely and leaves only the satellite volume adjustable. The included remote control sets the subwoofer volume and the volume of the complete stereo system from the listening position.

  The passive radiator that replaces the common bass reflex tube removes all audible noise caused by air turbulence and eliminates the pipe resonances that a two-sided pipe opening makes unavoidable. Its suspension has a restoring force underneath the tuning frequency and so reduces inaudible excursions in the subsonic range, which in turn reduces intermodulation distortion in the working range. The design also allows a particularly low tuning or lower cut-off frequency in a very compact cabinet.
specs: |-
  - Frequency range: 24 - 300 Hz
  - Woofer size: 12"
  - Max. SPL: 112 dB
  - Frequency range measured at -3 dB, 1 m distance
  - Output power: 400 W
  - Output power woofer: 400 W
  - Passive radiator: 12" diameter
  - Protection limiter: Yes
  - Phase inversion: 0 / 180 degrees
  - Switchable satellite filter: flat / 80 Hz
  - Variable subwoofer filter: 60 to 140 Hz + LFE
  - Remote control: Included
  - Dimensions: 390 x 560 x 508 mm (15.4 x 22 x 20 inches, WxHxD)
  - Weight: 25,5 kg (56.2 lb)
  - Power consumption: < 1 W standby, 410 VA maximum
