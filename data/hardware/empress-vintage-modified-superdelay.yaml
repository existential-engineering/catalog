description: The Empress Vintage Modified Superdelay builds on the Superdelay
  with a revamped tape mode that adds the compression, grit and saturation of
  vintage tape echo, while keeping the Superdelay's presets, tap tempo, reverse
  delay, expression pedal input and other features.
details: |-
  The Vintage Modified Superdelay takes the award-winning Superdelay a step further. Where a standard digital delay can sound sterile, this version revamps the tape mode to deliver more of the compression, grit and saturation associated with vintage tape echoes, without the cost and maintenance of real tape.

  It retains the full Superdelay feature set: up to 2.8 seconds of delay time, eight modes (normal, tap, autoset, reverse, rhythm/multitap, tape, misc and an 11-second looper), eight presets across three footswitches, an expression pedal input for mix or feedback, high-pass/low-pass filtering and fast/slow modulation.

  It uses true bypass in a compact die-cast aluminum enclosure with a signal-to-noise ratio around 105 dB.
specs: |-
  - Revamped tape mode with added compression, grit and saturation
  - Signal-to-noise ratio around 105 dB
  - Up to 2.8 seconds of delay time
  - 8 modes: normal, tap, autoset, reverse, rhythm (multitap), tape, misc (dynamic/gate), 11-second looper
  - 8 presets accessed via three footswitches
  - Expression pedal input (controls mix or feedback)
  - High-pass / low-pass filter on repeats
  - Fast/slow modulation
  - Tap tempo with ratio selection
  - True bypass
  - Power: 9 - 12 V DC (positive tip), 2.1mm barrel, ~300 mA
  - Die-cast aluminum enclosure, approx. 5.7" x 3.75" x 1.75", 1.5 lb
