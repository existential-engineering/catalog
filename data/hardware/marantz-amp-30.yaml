details: |-
  AMP 30 is a remarkably powerful, slimline 6-channel amplifier that can be paired with an AV preamplifier for an outstanding home theater system. It is rated at 200 watts per channel into 8 ohms and 400 watts per channel into 4 ohms, and is built on Marantz's exclusive HDAM and high-efficiency low-distortion Class D amplification. Additional AMP 30, AMP 20 or AMP 10 power amplifiers can be combined to drive more complex speaker configurations.

  AMP 30 offers flexible system-building, pairing effortlessly with the AV 30, Marantz AV receivers, or additional AMP models to support larger, more immersive speaker configurations. It is the ideal foundation for expanding a home theater with consistent power and signature Marantz performance.

  When paired with a Marantz AV Separate via the included link cable, AMP 30 can be controlled using the preamplifier. Power and illumination settings sync seamlessly for a unified experience.

  A modern expression of timeless design principles, AMP 30 features the iconic Marantz porthole level meter, premium materials, and subtle sidelights that illuminate the front panel. It is engineered using best-in-class technologies to enable extraordinary power output in a slimline form factor, and is crafted in Shirakawa, Japan.
specs: |-
  - Number of power amps: 6
  - Power output (8 ohm, 1 kHz, 0.05%, 2ch drive), normal / BTL: 200W / 400W
  - Power output (4 ohm, 1 kHz, 0.7%, 2ch drive), normal: 400W
  - Power output (8 ohm, 1 kHz, 0.7%, 5ch drive), normal: 200W
  - Main amplifier in: balanced and unbalanced, 6ch (exclusive use by a selector switch)
  - Speaker terminal: SPKT-1+
  - Number of speaker terminals: 6
  - Bi-Amp drive / BTL drive: Yes / Yes
  - Exclusive HDAM with Class D amplification
  - Front display: level meter
  - Metal front panel: Yes
  - Auto power off: Yes
  - RS232 control: Yes
  - IR flasher in: Yes
  - Marantz Remote Bus: Yes
  - DC trigger input / output: 1 / 1
  - Power consumption: 300W
  - Power consumption, no sound (ECO on / off): 70W
  - Standby consumption: 0.2W
  - Maximum dimensions (W x D x H): 17.4 x 17.4 x 4.4 in
  - Weight: 22.0 lbs
  - In the box: main unit, quick start guide, AC cord, amp control cable, remote control cable
  - UPC code: 747192145699
  - Crafted in Shirakawa, Japan
  - Limited warranty (United States and Canada): 5 year
