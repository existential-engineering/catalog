details: |-
  The 3,200-Watt VSX115B is a direct radiating passive 15" subwoofer ideally suited for a broad range of speech and music sound reinforcement applications in both fixed, portable, and touring audio systems. VSX115B's superb low frequency reproduction makes it the perfect choice for deployment in clubs, bars, theatres and AV applications. A ported bass reflex system featuring a high powered 15" low frequency driver that provides extended low frequency response to well below 40 Hz. The rear panel connector plate carries industry-standard twist-locking speaker and barrier strip connectors for input and link connections to accommodate additional subwoofers or satellite full range loudspeakers.
specs: |-
  - continuousPower: 800 W
  - peakPower: 3,200 W
  - lf_driver: 15"
  - frequencyResponse: below 40 Hz
  - portDesign: Dual port ported bass reflex
  - enclosure: Internally braced plywood
  - finish: Semi-matte black paint
  - grille: Powder-coated perforated steel mesh with reticulated foam
  - rigging: M10 rigging points
  - poleMountCompatibility: Optional VTH pole mount (blanking plate included)
  - handles: Integrip handles ergonomically integrated into top of cabinet
