details: |-
  The BE-OD overdrive pedal captures the tone of the now legendary Friedman BE-100 amplifier, which has graced the stages of world-class musicians the world over.

  The BE-OD delivers authentic tube-amplifier sound from a compact pedal, with the controls needed to shape a tone including volume, gain, tight, bass, treble and presence. These responsive knobs take the pedal from light, slightly broken up overdrives to straight up gain nirvana.

  Built in the USA and designed to withstand decades of abuse, the BE-OD is a must have pedal for any tone enthusiast.
specs: |-
  - Authentic British overdrive tones derived from the Friedman BE-100 amplifier
  - Controls: Volume, Gain, Tight, Bass, Treble, Presence
  - True bypass switching
  - Can be powered between 9 and 18 V DC, no battery
  - Built in the USA using premium worldwide components
