details: |-
  The 165A is an updated revision of the dbx 165, part of the classic 160-series compressor/limiter line. It features dbx's OverEasy® compression technology for smooth, transparent dynamics control with full manual control over threshold, ratio, attack, release, and output gain.

  The A-suffix revision updated the circuit design for improved performance and noise specifications while retaining the operational character of the original 165. The PeakStop™ hard limiter provides absolute peak control to prevent downstream clipping.

  An owner's manual (5.99MB) is available for download from the dbx product page, indicating comprehensive documentation is preserved for this model. The 165A was used in professional studio recording, broadcast, and post-production environments.
