details: |-
  The ACS1 is an amplifier and speaker cab simulator delivering the sound and feel of world-class amplifiers, complimentary speaker cabinets created by Tone Factor, and controllable room size. With the ACS1, players have expansive options to deliver their tone whether it's on stage, in the studio, or practicing at home. Simple controls, stereo in and out, onboard presets, and MIDI support make the ACS1 an immeasurable tool in a guitarist's arsenal. Players can also load in their own IRs and update firmware at walrusaudio.io. Amplifiers The ACS1 models three vintage amp styles crucial to music industry history designated by their places of origin. When running the ACS1 in stereo, one amp can be used through both channels or mix and match amps and cabinets on the left and right channels with the L + R switch. Fullerton is inspired by the classically snappy and clear Fender Deluxe Reverb. London is inspired by a 1962 Marshall Bluesbreaker. Dartford is inspired by the legendary and jangly tones from a 1960s Vox AC30. Cabinet IRs The ACS1 includes six IRs custom engineered by David Hislop and Kenyon Reed at Tone Factor. Users also have the option to load their own IRs via our customer web app found at walrusaudio.io. Room Ambience Simulate the size of the room that your amp and cabinet are in. Presets Save up to three presets onboard. Using MIDI, up to 128 presets can be saved and recalled. Boost A boost feature is available by pressing the boost switch. It allows you to quickly jump to a preset level of volume and/or gain.
specs: |-
  - Three amp models (Fullerton, London, Dartford) and six Tone Factor cabinet IRs
  - User-loadable IRs and firmware updates via walrusaudio.io
  - Stereo in and out, L/R independent amp+cab routing
  - Controllable room ambience
  - Onboard presets (3) plus 128 via MIDI
  - 24-bit 48kHz A/D and D/A converters, 32-bit floating point processing (Sharc + ARM)
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
