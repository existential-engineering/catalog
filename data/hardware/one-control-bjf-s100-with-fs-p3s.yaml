description: An ultra-compact plexi-voiced British amplifier head combining a
  solid-state preamp with a Class D power amp, featuring two channels (Lead and
  Rhythm) and a built-in tape-echo style delay of up to 600ms. Includes the
  FS-P3S footswitch for controlling channel switching, effect loop, and delay.
details: |-
  ■BJF-S100

  The One Control BJF-S100 brings the rock sounds from the late 1960s to the early 80s, and is an ultra-small "plexi-voiced" British amplifier sound that is still a touchstone for "rock" guitar amplifiers. Light, loud, expressive, and loaded with features. We have spent many years in development with Björn Juhl (BJF) to bring this amplifier to guitarists everywhere. By combining a solid-state preamplifier with a Class D power amplifier section, we have achieved a compact, lightweight and loud tone. The all-analog circuit was developed based on the model of the UK style vacuum tube amplifier head produced since the 60s. This solid-state circuit is designed to operate similar to the actual vacuum tube amplifier­; not just a reproduction of the preamp, but also the operation and feedback of the power amplifier. In addition, we incorporated a delay of up to 600 ms, which reproduces "that" tape echo, often used at the same time as the amplifier in the early 70s. Like the tape head sound of that classic echo, if you repeat the feedback the sound will become warmer and the distortion will increase. This warm echo tone does not intrude upon your base guitar sound and can add depth and presence to the guitar tone. The preamp section of the BJF-S100 consists of two channels. The Lead channel creates a higher gain distortion as when pushing the vacuum tube amplifier hard. It not only distorts with similar sounds, but also reproduces the expressive power and playing feel that can be controlled by the volume knob and dynamic touch on the guitar. In addition, the BJF-S100 further expands the gain range and covers the brown sound from the legendary "modded amp head" a young guitarist in Los Angeles made history with. The Rhythm channel is modeled on the clean tone used by the legendary guitarists, especially in the late 60s and early 70s. If you raise the GAIN, you can also make the classic British overdrive tone, rich with overtones and presence. Both channels have a set of Master, Presence, Tone Stack, and Delay controls so you can use each to create the optimal tone for rhythm and lead and further change the depth. Dial in a shimmery rhythm sound with just a little ambience and air, then switch to a completely browned-out lead tone with trippy echoes. The BJF-S100 can create excellent tones with many British-style guitar cabinets, including the classic "V30" speaker, well known as one of the most common guitar speakers. In particular, it has the great potential with the Celestion G12MH and the Celestion EVH speakers. The output section delivers 100 watts of output at 4Ω, 66 watts at 8Ω, and 30 watts output at 16Ω. ●Controls
  Lead Channel
  ・GAIN: Adjusts the strength of the distortion. It covers up to high gain. ・MID: Adjusts the tone of the middle range. ・BASS: Adjusts the tone of the low range. ・TREBLE: Adjusts the tone of the high frequency. ・TIME: Adjusts the delay time of the Lead channel. ・LEVEL: Adjusts the volume of the delay on the Lead channel. ・REPEAT: Adjusts the delay feedback on the Lead channel. ・CLARITY: Makes the tone a little bright and clearer. ・BODY: Inflates the middle and low frequencies of the tone a little. ・PRESENCE: Adjusts the tone of the higher frequencies even more than TREBLE. ・MASTER LEAD: Adjusts the volume of the entire Lead channel. Rhythm channel
  ・GAIN: Adjusts the strength of the distortion. It covers up to high gain. ・MID: Adjusts the tone of the middle range. ・BASS: Adjusts the tone of the low range. ・TREBLE: Adjusts the tone of the high frequency. ・TIME: Adjusts the delay time for the Rhythm channel. ・LEVEL: Adjusts the volume of the delay on the Rhythm channel. ・REPEAT: Adjusts the delay feedback on the Rhythm channel. ・PRESENCE: Adjusts the tone of the higher frequencies even more than TREBLE. ・MASTER RHY: Adjust the volume of the entire Rhythm channel. CHANNEL: Switches the channel. ●Input/output terminals
  ・INPUT: Connect the cable from the instrument or effect board. ・EFFECTS LOOP: This is a series of effect loops used when connecting effects between preamps and power amplifiers. Connect the cable from SEND to the effect input and from the effect output to RETURN. ・PREAMP OUT: OUTPUTS A SIGNAL FROM THE PREAMP. It is used when using an external power amplifier or for line output through an external speaker simulator. If you connect the plug here, the signal will not be output from the SPEAKER setting. ・SPEAKER: Connect the speaker cable. It will be 30W/16Ω, 66W/8Ω, 100W/4Ω. ・FS-P3B: Connect One Control FS-P3 foot switch (sold separately). ・FOOTSWICH (CHANNEL): CONNECT A LATCH SWITCH THAT CONTROLS CHANNEL SWITCHING. ・FOOTSWITCH (FX LOOP): CONNECT THE LATCH SWITCH TO TURN ON/OFF THE EFFECT LOOP. ・FOOTSWITCH (DELAY): CONNECT THE LATCH SWITCH TO TURN ON/OFF THE DELAY EFFECT with A MONO CABLE. ・DC IN: Connect a dedicated adapter. ●Specs
  ・Output: 30W/16Ω, 66W/8Ω, 100W/4Ω
  ・Each channel has independent tone stack
  ・Tape echo style delay that can be preset for each channel
  ・Delay effect: ON/OFF support by foot switch, up to 600ms
  ・Size: 26.5 (W) x 9.5 (D) x 8.5 (H) cm (not including protrusions)
  26.5 (W) x 11.8 (D) x 10.3 (H) cm (when the handle is folded)
  ・Weight: 1.76kg

  ■FS-P3S

  The One Control FS-P3S is a footswitch that can be directly connected to the BJF-S series amplifiers. The FS-P3S uses the included CAT5 style cable and connects to the footswitch terminal on the rear panel of the BJF-S series amplifiers. You can control the effect loops, switch the channel of the amplifier, and bring in the effect at your feet easily. The current settings are easy to see at a glance with the three LED lights of the FS-P3S, and do not require connecting a separate power supply. The new smaller format of the FS-P3S works well with many smaller boards, while the previous FS-P3 model has a longer yet narrower format. Each of these units will work with either of the BJF-S series amplifiers. Size: 11.0 (W) x 5.9 (D) x 5.8 (H) cm including protrusions
  Weight: 366g
  Attached cable: 3m

