description: The Fractal Audio FM9 is an Amp Modeler, FX Processor, Foot
  Controller, USB Audio Interface, and More, based on the Award-Winning Axe-Fx
  III
details: |-
  The FM9 Mark II Turbo is an all-in-one amp modeler, effects processor, foot controller and audio interface designed for professional stage and studio use. With four DSP cores it is the most powerful Fractal Audio floor unit, carrying technologies from the Axe-Fx III, FM3 and FC Controllers, including Cygnus X2 amp modeling, DynaCab and UltraRes speaker simulation, a suite of stompbox and studio effects, expandable FC foot switching, flexible I/O, 8x8 USB audio interface capability and a Mac and PC editor. The Mark II Turbo adds 10 percent more DSP power than the original FM9, plus larger footswitch displays with almost twice the viewing area, so presets that would exceed the limits of the original FM9 can run.

  Nine on-board footswitches, each with its own vari-color LED ring and mini LCD display, provide tap and hold functions that can be customized across eight switch layouts. The main display is the same large, full-color panel used on the Axe-Fx III and FM3. Out of the box a layout selects any of the onboard presets, a single stomp moves to Scenes mode, and an extra switch provides both Tap Tempo and Tuner, while the Master Layout Menu reaches effect switches and Looper controls. A built-in option reproduces the OMG9 style setup based on the FM3 and FC-6.

  The centerpiece is Cygnus X-2 amp modelling, with separate preamp and power amp stages, interactive tone controls, physical modeling of analog circuits and virtual tubes. The two amp blocks each have four channels that can run any of 325 or more vintage, modern and original models. Speaker simulation covers DynaCab plus the entire original Ultra-Res collection from the Axe-Fx III, with 2,200 or more factory cabs and 1,024 user locations for loading impulse responses.

  As a multi-effects unit the FM9 carries 57 or more drive pedal models, dozens of delays, choruses, flangers, phasers, tremolo and other modulation effects, 50 or more reverb types, multiple compressors, wahs, EQs and filters, a 2-minute looper, a suite of pitch effects including detune, harmony and virtual capo, plus rotary, synth and plex effects including shimmer.

  The signal path follows the audiophile design of the Axe-Fx III, in a rugged 16-gauge steel chassis with protective endcaps that double as feet. Connected to a Mac or PC over USB the FM9 works as an 8x8 audio interface for playback, recording and re-amping, with mapped channels so the main outputs, the second output, input 1 and either stereo aux input can each be recorded directly. The same connection carries USB-over-MIDI for DAW control and two-way communication with Fractal-Bot and the FM9-Edit editor and librarian, which is included free.
specs: |-
  - Four-core DSP architecture, with 10+% more DSP power than the original FM9
  - Cygnus X-2 amp modeling with separate preamp and power amp modeling, interactive tone controls and virtual tubes
  - Two amp blocks, each with four channels
  - 325+ vintage, modern and original amp models
  - DynaCab speaker simulation plus the entire original Ultra-Res collection from the Axe-Fx III
  - 2,200+ factory cabs and 1,024 user locations for loading impulse responses
  - 57+ drive pedal models
  - 50+ reverb types
  - 2-minute looper
  - Pitch effects including detune, harmony and virtual capo, plus rotary, synth and plex effects including shimmer
  - Nine on-board footswitches, each with a vari-color LED ring and mini LCD display
  - Tap and hold functions per switch across eight customizable switch layouts
  - Larger footswitch displays than the original FM9, with almost twice the viewing area
  - Large full-color main display, as used on the Axe-Fx III and FM3
  - 8x8 USB audio interface for playback, recording and re-amping
  - USB-over-MIDI for DAW control and for Fractal-Bot and FM9-Edit
  - 48 kHz S/PDIF digital input and output
  - FASLINK II port for up to two additional FC-12 or FC-6 foot controllers
  - Humbuster technology on all 1/4-inch outputs to reduce ground loop noise
  - Three jacks, each supporting one external switch or expression pedal such as the Fractal Audio EV-1
  - Rugged 16-gauge steel chassis with protective endcaps that double as feet
  - FM9-Edit editor and librarian for Mac and PC included free
