  and movies to life.
details: |-
  CCM362 is a passive two-way in-ceiling loudspeaker in the Bowers & Wilkins CI 300 range, sold as a Flexible Series model on the US site. It is a shallow-form design intended for installations where the speaker should be heard and not seen.

  The two-way system pairs a 25mm (1in) soft dome tweeter with a 160mm (6in) polypropylene cone bass/midrange driver. Balanced for wide-angle listening in keeping with ceiling placement, it is offered with a choice of round or square aspect.

  The CI 300 models were specifically designed to cope with high-humidity environments such as shower rooms and indoor swimming pools, which are unsuited to some of the advanced driver materials used elsewhere in the Bowers & Wilkins range. That makes them a point of entry to areas of the home previously off-limits to high-quality installation loudspeakers.

  Frequency range is quoted as 50Hz to 30kHz (-6dB) with sensitivity of 89dB (2.83V, 1m), a nominal impedance of 8Ω (5.0Ω minimum) and power handling of 80W. The matching pre-mount kit is the PMK C6 and the matching back box is the BB 6C.

  Speaker cable connects to spring terminals on the side of the baffle, with the amplifier's positive terminal going to the red spring terminal on the frame. The speaker is supplied in a White finish.
specs: |-
  - 2-way in-ceiling system (passive)
  - Drive units: 1x ø25mm (1in) soft dome tweeter, 1x ø160mm (6in) polypropylene cone bass/midrange
  - Frequency range (-6dB): 50Hz - 30kHz
  - Sensitivity SPL (2.83V, 1m): 89dB
  - Nominal impedance: 8Ω (5.0Ω minimum)
  - Power handling: 80W
  - Connection: spring terminals on the side of the baffle
  - Pre-mount kit: PMK C6
  - Back box: BB 6C
  - Grille aspect: round or square
  - Finish: White
  - Price is listed per pair
