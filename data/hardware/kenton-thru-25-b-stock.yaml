description: "The B-stock grade of the THRU-25 MIDI THRU box: fully functional
  and fully tested with a full warranty, but possibly carrying cosmetic damage."
details: |-
  THRU-25 receives MIDI data from a single MIDI out, such as a DAW interface, sequencer or master keyboard, and produces identical copies at twenty-five MIDI thru sockets. Those connect to the MIDI in of each synth, sound module or other MIDI device in the rig.

  Presenting a clean MIDI signal to every device at once avoids the problems that daisy-chaining can introduce. Chaining is fine for two or three devices, but each link adds latency, the signal degrades, and every device depends on the ones ahead of it. A thru box removes latency and jitter issues, dropped or stuck notes, choppy filter sweeps, and that chain of dependency.

  The MIDI in is opto-isolated to eliminate ground loops and hum and to prevent electrical damage, and each of the twenty-five thru ports has its own driver. Schmitt trigger logic restores signal quality, latency through the box is under one microsecond, and all MIDI messages pass, including clock, SysEx and MTC. The unit is fully compatible with MIDI Polyphonic Expression.

  This listing is the B-stock grade: fully functional and fully tested with a full warranty, though it may carry cosmetic damage. Units are ex-demo, returned unused by a customer, or returned faulty and repaired. The hardware is otherwise the standard THRU-25, in a brushed aluminium case with black screen print and running from an included mains adapter.
specs: |-
  - B-stock grade: fully functional, fully tested, full warranty, possible cosmetic damage
  - 5 pin DIN MIDI: 1 x In, 25 x Thru
  - MIDI In opto-isolated against ground loops, hum and electrical damage
  - Each of the 25 MIDI Thru ports has its own driver
  - Passes all MIDI messages including Clock, SysEx and MTC
  - Fully compatible with MIDI Polyphonic Expression (MPE)
  - Schmitt trigger logic for signal quality restoration
  - Less than one microsecond latency
  - Power and data indicator LED
  - Power: 9V DC regulated or unregulated, 2.1mm centre-positive
  - Current draw: 10mA idle, 150mA maximum
  - 9V multi-region switch mode power supply included, with 4 interchangeable heads for the UK, Europe, USA, Canada, Japan, Australia and New Zealand
  - Dimensions: 300mm x 54mm x 35mm
  - Weight: 480g including power supply, 390g excluding power supply
  - Aluminium case with black screen print
  - User manual included
