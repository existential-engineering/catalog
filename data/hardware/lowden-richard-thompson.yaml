details: |-
  The Lowden Richard Thompson Signature model is a guitar born from the union of musical heritage and masterful craftsmanship. Designed in collaboration with folk-rock icon Richard Thompson, this special signature model is built to inspire music for generations. The guitar is an F Cutaway body shape built with AAAA grade Ziricote and a Californian Red Cedar top. The RT model also features Tasmanian Blackwood body bindings, a five-piece mahogany neck with a Walnut centre stripe and Purpleheart splices, and an Abalone soundhole rosette. As this guitar is an artist signature model, it is not configurable. Available in left or right handed versions. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - F-shaped body with cutaway
  - AAAA grade Ziricote back and sides
  - Californian Red Cedar top
  - Tasmanian Blackwood body bindings
  - Five-piece mahogany neck with Walnut centre stripe and Purpleheart splices
  - Abalone soundhole rosette
  - Handcrafted construction
  - Hardshell case included
