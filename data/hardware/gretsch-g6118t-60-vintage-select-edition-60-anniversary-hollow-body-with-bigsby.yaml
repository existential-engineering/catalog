details: |-
  Inspired by the original 1958 Anniversary model released to honor Gretsch's 75th anniversary, the G6118T-60 Vintage Select Edition '60 Anniversary Hollow Body is a serious instrument designed to rock.

  A pair of highly dynamic TV Jones TV-HT single-coil pickups tops the laminated maple body for a memorable playing experience that works with any style.

  1959-style trestle bracing couples the top and back of this unique instrument, enhancing the guitar's natural tone.

  Celebrating the past while meeting the needs of any player, the Vintage Select Edition '60 Anniversary is a serious instrument for serious players.
