description: Argon7LX floorstanding loudspeaker performs way above its
  price-point, utilizing the same technologies as Amphion's flagship studio
  monitor.
details: |-
  The Argon7LX is a two-way floorstanding loudspeaker that derives its technology from Amphion's reference-level Two18 studio monitor. It features exceptionally precise imaging and a wide sweet spot, delivering controlled dispersion for balanced sound throughout a room.

  The speaker is built around a new 1" titanium tweeter paired with two 6½" aluminum woofers, crossing over at 1600 Hz. The 5th generation waveguide enables a low crossover point and easy room placement.

  Key updates include a new tweeter with enhanced high-frequency detail and clarity, a revised crossover for improved driver integration, and balanced low-mid-bass with deep, controlled bass and seamless frequency transitions.

  The Argon7LX is handmade in Finland and available in four finishes: Full White, White/Black, Walnut, and Full Black.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofers: 2x 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 91 dB
  - Frequency Response: 28–55,000 Hz (-6dB)
  - Power Recommendation: 50–300 W
  - Dimensions (H×W×D with base): 1157×234×344 mm
  - Weight: 27 kg (59.5 lbs)
  - Manufacturing: Handmade in Finland
