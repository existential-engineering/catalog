description: The F8n Pro is an 8-input, 10-track field audio recorder and mixer with eight locking XLR/TRS combo inputs, +24/+48 V phantom power and dual A/D converters feeding 32-bit float recording. It writes BWF-compliant WAV at up to 192 kHz to two SD card slots and carries timecode in and out on BNC.
details: |-
  The F8n Pro is an 8-input, 10-track field audio recorder and mixer that records to BWF-compliant WAV at sample rates up to 192 kHz and resolutions up to 32-bit float. Dual A/D converters and the onboard preamps are used to capture full dynamic range without adjusting gain, with up to 75 dB of input gain and equivalent input noise of -127 dBu or less.

  Eight discrete inputs use locking Neutrik XLR/TRS combo connectors and take microphones, wireless packs or line-level devices, with +24/+48 V phantom power at up to 10 mA per channel and switchable mic/line operation on both the XLR and the TRS side. Any input can also be used as a camera return. A proprietary 10-pin MIC IN connector takes Zoom's interchangeable mic capsules and disables inputs 1 and 2 while in use, and a built-in slate mic records voice memos or outputs a variable-frequency tone signal.

  Outputs are two balanced Main Outs on TA3 mini-XLR jacks for external mixers and processors, a two-channel Sub Out on a single unbalanced 1/8-inch stereo mini-jack for a camera feed, and a 1/4-inch headphone jack rated at 100 mW per side with its own volume control. Output level is selectable, including +4 dBu. Signal routing runs from all inputs to all outputs, alongside phase inversion, mid-side decoding, high-pass filtering to reduce wind and other noise, and input and output delays.

  Timecode input and output sit on standard BNC connectors, generated by a temperature-compensated crystal oscillator accurate to 0.2 ppm whether the unit is on or powered down, with drop-frame and non-drop formats and Jam Sync. Recording goes to two SD/SDHC/SDXC card slots of up to 1 TB each, which can run simultaneously for redundant or split recordings. A pre-record function captures up to six seconds of audio before the record button is pressed, and Zoom AutoMix adjusts mix levels automatically to reduce ambient sound. Ambisonics mode adds A-to-B decoding and balanced gain linking for spatial audio.

  Over USB the F8n Pro doubles as an 8-in/4-out audio interface at up to 96 kHz and 32-bit float while still recording to the SD cards, with a 10-in/4-out mode that records at the same time and a driverless 2-in/2-out stereo-mix mode that also works with iOS and iPadOS devices. Power comes from eight AA batteries, the supplied AD-19 12 V AC adapter, or an external 9-18 V DC supply on a 4-pin Hirose connector. USB bus power is not supported. Metadata such as track and scene names can be entered on the unit or from the F8 Control app for iOS and Android over Bluetooth.
specs: |-
  - 8-channel/10-track field audio recorder and mixer with 32-bit float recording
  - Inputs 1-8: XLR/TRS combo jacks (XLR 2 hot, TRS tip hot), input gain +10 to +75 dB, input impedance 3 kohm or more
  - Maximum input level +4 dBu at 0 dBFS, phantom power +24/+48 V at 10 mA maximum per channel
  - Equivalent input noise -127 dBu or less (A-weighted, +75 dB gain, 150 ohm input)
  - Frequency response 20 Hz to 60 kHz, +0.5 dB/-1 dB at 192 kHz sample rate
  - A/D dynamic range 113 dB typ., D/A dynamic range 105 dB typ. (-60 dBFS, A-weighted)
  - Crosstalk -90 dB or less between adjacent channels at 1 kHz
  - MIC IN: Zoom mic capsule input, use disables inputs 1 and 2. Built-in slate mic assignable to any track
  - Main Out 1/2: TA3 balanced, output impedance 150 ohm or less, reference -10 dBV normal or +4 dBu line, maximum +10 dBV normal or +24 dBu line
  - Sub Out 1/2: 3.5 mm stereo mini unbalanced, output impedance 100 ohm or less, reference -10 dBV normal or -40 dBu mic
  - Headphone: 1/4-inch stereo unbalanced, output impedance 18 ohm or less, 100 mW + 100 mW into 32 ohm
  - Recording media: dual SD card slots, SDHC 4 GB to 32 GB, SDXC 64 GB to 1 TB
  - WAV formats: 44.1, 47.952, 48, 48.048, 88.2, 96 and 192 kHz at 16-bit linear, 24-bit linear or 32-bit float, mono/stereo/2-10 ch poly, BWF and iXML
  - Maximum simultaneous recording tracks 10 (8 inputs plus stereo mix), 8 at 192 kHz. MP3 at 128, 192 and 320 kbps up to 2 tracks
  - Recording time on a 32 GB card: 23:08:00 at 48 kHz/32-bit float stereo WAV, 5:47:00 at 192 kHz
  - Timecode on BNC, precision +/-0.2 ppm, input 0.2 to 5.0 Vpp into 4.6 kohm, output 3.3 Vpp from 50 ohm or less
  - Timecode frame rates 23.976ND, 24ND, 25ND, 29.97ND, 29.97D, 30ND and 30D with Jam Sync
  - High-pass filter, phase invert, mid-side decoder, input and output delays, all-input to all-output routing
  - Zoom AutoMix and Ambisonics mode with A-to-B decoding and balanced gain linking
  - Pre-record of up to 6 seconds before the record button is pressed
  - USB Mini-B, USB 2.0 High Speed, multitrack interface 8-in/4-out at 44.1/48/88.2/96 kHz, 24-bit linear or 32-bit float
  - USB stereo-mix mode 2-in/2-out at 44.1/48 kHz 16-bit, driverless, supports iOS and iPadOS. Interface-with-recording mode 10-in/4-out
  - USB bus power operation is not supported
  - Power: 8 AA batteries (alkaline, NiMH or lithium), ZOOM AD-19 DC 12 V/2 A centre-positive adapter, or external 9-18 V DC via HIROSE HR10A-7R-4S 4-pin connector
  - Battery life: about 7 h alkaline / 8 h NiMH / 13.5 h lithium at 2 channels to one card at 48 kHz, about 4.5 / 6 / 9.5 h at 8 channels
  - Power consumption 15 W
  - Display: 2.4 inch full-color LCD, 320 x 240, with monochromatic mode
  - Dimensions 7.0 in. (W) x 5.5 in. (D) x 2.1 in. (H), weight 1200 g including batteries
