description: The Tribute Series L•2000 pairs two G&L Magnetic Field Design
  humbuckers with the flexible Tri-Tone control system, delivering the range of
  Leo Fender's 1980 original at a working musician's price.
details: |-
  When Leo Fender launched the G&L L•2000 bass in 1980, it was clear he was ready to make history all over again. Never before had such a wide range of tones come from a single bass, and throughout its evolution the iconic L•2000 has continued to win the hearts of bassists of every style and musical taste.

  The foundation of the L•2000 is a pair of G&L Magnetic Field Design humbuckers backed by the flexible Tri-Tone control system, providing the sort of versatility that lets a player find their tone no matter what kind of bass line they are laying down. The Tri-Tone system features a trio of mini toggles for pickup selection, series/parallel signal routing and active/passive operation, as well as a trio of knobs for volume, treble and bass. With all that under the hood, Leo gave the L•2000 the kind of chops that fit any situation, from classic R&B to power-packed rock to poppin' funk. What's more, the L•2000 features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  The Tribute Series L•2000 delivers the magic of Leo's revolutionary bass at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: Two L-spec G&L MFD humbucking pickups
  - Body wood: Swamp Ash Top over Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 21 medium jumbo, nickel
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: Tri-Tone system with 3-position pickup selector, series/parallel switch, 3-position pre-amp mode switch, volume, treble, bass
  - Power: battery-powered, 9V
  - Available in: Blueburst over Swamp Ash Top on Poplar, Maple fingerboard
  - Available in: 3-Tone Sunburst over Swamp Ash Top on Poplar, Rosewood fingerboard
