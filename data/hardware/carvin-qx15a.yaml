  - Incredible sound and easy operation make the QX15A our finest 15-inch active loudspeaker. Premium DSP processing from Analog Devices delivers controlled sound from its 4 selections of normal intelligent sound, monitor playback, DJ, and external sub functions. 2 amplifiers provide enhanced intelligibility, one for bass and the other for high frequencies plus power to spare from the 1000 watt output. The QX15A's deep, rich bass and crystal-clear high-end projects far to the rear with intelligent articulation so everyone can hear clearly. 3 different inputs are offered for Mic, Line, or BT operations with an extended range Bluetooth, streaming stereo wirelessly from your phone or tablet. Pair a second QX15A for a true wireless stereo setup or mono operation that doesn't require a second cable to connect. The universal power supply adapts to all countries for 115 or 230 VAC 50-60 Hz operation. The QX15A can be used with a stand as a main, as a floor monitor, or installed from its 3-point mounting system. Its precision assembly and rugged design, which includes a water-resistant molded enclosure and powder coated steel grill is ideal for touring. The QX15A is a premium, universal powered loudspeaker that projects distortion-free, high fidelity audio to your audience.
  - QX15A System Type: 15-inch 2-way, Active Bass Reflex » Frequency Response: 54Hz-18kHz (-10dB) 62Hz-16kHz (-3dB) » Power: 1000W Program » Coverage Pattern: Main 90x60 Monitor 60x90 » Sensitivity (1w/1m): 98dB » Maximum SPL: 130dB » Maximum Input Signal: +12dBu » LF: 15-Inch Woofer 4 Ohms » HF: 1.74-Inch 8 Ohms » Enclosure: Virgin polypropylene » Color: Black » Grill: Black powder coated 16-ga steel with cloth backing » Transport: 2 Recessed handles » Pole Mount: 1.38-inch pole mount cup with thumb screw » Suspension Points: 3 points using M8-1.25 x 30mm. The bottom fly points are 180mm center to center. » AC Mains Input: 115V-230V (50-60Hz) » Net Weight: 42lbs » Dimensions: 17.75"W x 15.5"D x 27.5"H
  - "We received our QX15A's safe and sound yesterday 🙂 we are delighted with them! I've been in the audio field in one capacity or another for 40 years, and have had the opportunity to use and compare all kinds of cabinets. We've consistently seen that Carvins have that sweet sound and these little 15's do not disappoint! How can you beat a pair of speakers that sparkle at the high end but never get screechy and have warm lows that never woof out. These little speakers are great, and we love the convenience thats built into the design." Colleen M, Escalon,CA . "Just received these in the mail yesterday. Holy crap they are incredible! Crystal clear sound up to full volume. Their use will be to play soundtracks that I can play along with drums. The ease of set up was less than two minutes, bluetooth function worked perfectly. Thank you for putting out an incredible product that didn't break the bank. Well done! - Michael A. "I have been a Carvin fan and customer for a long time. I recently purchased a Qx15 system and on 9/11/21 I had the opportunity to use it outside and really see what I had bought. I was thrilled with the sound quality and so was the audience. :-) Thank you for another great product ! - Joe G. MA "I searched high and low all during Covid for good, high quality PA speakers with Bluetooth. I looked at EVERY known retailer... Carvin's QXSYS15A checked all the boxes and hit it out of the park! No one can beat this system, price wise and value! I always wanted a "PA System" for a stereo...Thanks to Carvin I have it now!! 2000 watts and two 15-inch speakers. You will not find that anywhere at the price Carvin offers." Durbin J., CA "I love this Carvin QXSYS15A sound system. Sounds great! I'm sold on the sound and quality. My goal by Christmas is to add the TRC400A." David C. Augusta, GA
