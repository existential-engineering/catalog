description: >-
  A rack-mounted monophonic bass synthesizer from German maker MAM, designed as
  an affordable TB-303 clone with MIDI control for sequencer-driven acid bass
  lines.
details: |-
  The MB 33 was released in 1996 as Music And More's take on the iconic Roland TB-303 sound. It offers the same two basic waveforms as its inspiration, a sawtooth and square wave, with the added ability to mix them together for tonal variety. MIDI implementation allows users to create 303-style bass lines directly from an external sequencer.

  The original model featured a 24dB per octave lowpass filter, while the mkII revision released in 1998 swapped this for an 18dB filter more closely matching the original TB-303 circuit. The mkII also added a sub-oscillator and built-in distortion effects, making it a more complete acid bass tool.

  Despite lacking any program storage capability, the MB 33 found an audience among electronic musicians looking for affordable analog bass sounds. Its compact rack format and straightforward controls made it a practical studio addition for techno and acid house production.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth/square, mixable; mkII adds sub-oscillator)
  - Filter: 24dB/oct lowpass (mkII: 18dB/oct lowpass)
  - VCA: Decay time 200ms-2.5sec, ENV generator, Accent
  - Control: MIDI, CV input to VCF
  - Memory: None
  - Keyboard: None
