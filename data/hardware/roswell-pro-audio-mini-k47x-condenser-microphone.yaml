details: |-
  Overview

  The Mini K47x combines the circuit magic of the best-selling Mini K67x with the K47 capsule from the most popular mic in our catalog:

  The Mini K47x provides a unique and compelling combination of the attributes of our two most popular microphones, while retaining the "point and shoot" simplicity of the Mini K mic family. This model won the "Editor's Choice" award from Music Inc at NAMM 2023. It sounds like we're recording to tape! - Mini K47x customer

  On quiet sources, the K47x would sound similar to the Mini K47, although perhaps 1dB more neutral above 2kHz. On moderate to louder sources, the K47x circuit will be pushed into gentle saturation, which adds harmonic complexity and richness to the sound of the mic. Simultaneously, sharp transients in the source will be slightly rounded and softened, giving the K47x a a sound that evokes classic European tube microphones, or a 2-inch tape deck. Like all Roswell microphones, the Mini K47x is assembled and tested in California, using the premium components and meticulous care for which Roswell is known. Color, Character, Tone. Pick Any Three. The mic's name, "K47x," refers both to the capsule design and circuit topology. The capsule is a K47 type. The "x" refers to the transformer-coupled circuit, which gives the mic its trademark harmonic saturation. Every Roswell microphone is subjected to a 24-hr "burn in" on our proprietary conditioning fixture, then tested extensively prior to shipping: polarity, noise, frequency response, sensitivity, and more. We perform an acoustic sweep test and listen to every microphone multiple times before it leaves our facility. The Mini K47x has a durable metallic paint finish; the color is Metallic Indigo. Each mic ships with our exclusive Cutaway shockmount, Roswell branded microfleece mic sock, and an upgraded flight case. What it's NOT

  The Mini K47x is not a replacement for the Mini K47. It's not an "upgraded" Mini K47. It is a new design that sounds different from the Mini K47. Read more about the differences in the "Features" tab. LC Edition

  If your budget is constrained, but you do not wish to compromise on the quality of the mic, you can buy the same Mini K47x at a lower price via the LC Edition. The microphone itself is identical; the LC Edition provides alternate, lower-cost packaging and accessories. Custom Shop

  We have multiple custom colors and grilles available, as well as circuit modifications. Features

  Features

  Benefits

  Design and Component Details

  The Mini K47x capsule is a 34mm (large diaphragm) K47 design. It provides a presence boost in the 4-6kHz range. We tune the K47x capsule to have a milder presence boost than the Mini K47; this makes the K47x slightly more relaxed, or less "forward" sounding. The circuit design borrows from our flagship Colares microphone; it is a single-stage JFET/transformer topology, built around a selected vintage European-made output capacitor, the best-sounding modern filter capacitors on the market, and our own oversized T7 transformer with high nickel lamination. The capacitor feeding the JFET is a critical component to the mic's sound. We've designed a custom bipolar electrolytic, with a special formulation of electrolyte that was initially developed for the legendary Black Gate line of capacitors. Internal gain staging is carefully set for each individual mic to produce harmonic saturation at moderate SPL. This allows the Mini K47x to evoke the sound of vintage tube microphones, creating harmonics to complement the source, although without adding noise or crushing transients the way some tube mics would. While the circuit topology in the K47x is shared with the K67x, these circuits differ in implementation, because we treat each product as a complete system. Here are the main circuit differences from the K67x:

  Compared to the Mini K47, the Mini K47x has softer transients and more saturation. The original Mini K47 was designed for accurate transient response and very low distortion. The Mini K47x, in contrast, embraces second-harmonic saturation as a sonic enhancement. A side-effect of the saturation circuit is that transients are slightly compressed in the Mini K47x. Both the Mini K47 and Mini K47x provide unique, distinctive voices that deliver fantastic results for vocals, piano, guitars, and drum overheads. Tech Data

