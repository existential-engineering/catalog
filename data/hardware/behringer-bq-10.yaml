description: The BQ-10 is an analog step sequencer in Eurorack format with 24
  steps and full CV control, a modern take on the SQ-10 of the 1970s. It runs as
  a single 16-step sequence or as dual 8-step sequences on channels A and B,
  with a separate 8-step channel C for driving filter or amplitude on a
  connected synthesizer via CV.
details: |-
  In the world of analog synthesis, few pieces of gear evoke as much nostalgia and creativity as the SQ-10. With its powerful 12-step sequencer, it quickly became a staple for electronic musicians, but like a lot of synths at that time, it was big and bulky. The BQ-10 is a fresh take on that vintage design, paying tribute to a classic while introducing new updated features.

  The BQ-10 can function as a single 16-step sequencer or split into dual 8-step sequences (channels A and B) for added flexibility. Channel C is a separate 8-step channel where an external synth such as the Behringer K-2 MKII can be connected via CV for controlling filter or amplitude. Each step features a voltage output knob as well as a dedicated trigger output, allowing sequences to be shortened by connecting specific steps to the Reset input.

  The rotary Sequence Mode knob selects between 8 play modes for channels A and B, while channel C can run continuously depending on the mode. By default a sequence runs on the internal clock of the BQ-10, which can be adjusted with the Clock Generator knob from 20 bpm to 500 bpm. CV inputs are also available for plugging in external voltage sources to override the internal clock. Each channel features its own portamento control, for steps that glide into one another or a more staccato feel.

  Designed to handle the rigors of life on the road or in the studio, the BQ-10 can easily be transferred to any standard Eurorack case for integration into a larger setup.
specs: |-
  - Analog step sequencer based on the SQ-10 sequencer of the 1970s
  - 24 steps arranged as three 8-step channels (A, B and C)
  - Single 16-step sequence or double 8-step sequences on channels A and B
  - Separate 8-step channel C for controlling filter or amplitude on a connected synthesizer via CV
  - 8 play modes for channels A and B, including Alternating, Parallel, Series and Random
  - Internal clock generator adjustable from 20 bpm to 500 bpm
  - CV input for the internal clock, allowing external voltage sources to override it
  - Trigger input for syncing with external clocks
  - Dedicated trigger output per step, for shortening sequences via the Reset input
  - Per-channel portamento control for glide between steps
  - Duty cycle control for adjusting the overall gate length
  - 2 input sum for convenient patching
  - 45 controls for direct real-time access to all important parameters
  - Comprehensive MIDI implementation with MIDI channel and MIDI transport controls
  - Eurorack format: the main module can be transferred to a standard Eurorack case
