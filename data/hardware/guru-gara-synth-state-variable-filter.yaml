details: |-
  OTA State Variable VCF (Voltage Controlled Filter)

  The OTA State Variable VCF Eurorack PCB and Front Panel Kit is a classic, all-analog multi-mode filter designed for DIY builders seeking versatile sound sculpting and rich sound flexibility. Built around a classic Operational Transconductance Amplifier (OTA – LM13700) design, this module delivers a deeply musical, fluid character with continuous, expressive control over your frequency spectrum. Unlike dedicated low-pass filters, the State Variable topology provides simultaneous access to three distinct filter characters, making it a powerful utility and creative processor for everything from smooth sub-basses to sharp, cutting lead sweeps. Key Features

  Filter Character & Control

  At its core, this OTA filter delivers a highly responsive, musical character that remains smooth. Because it is a State Variable filter, a single audio input splits into three distinct outputs simultaneously, giving you total patch flexibility:

  With two dedicated Control Voltage (CV) inputs featuring integrated amount knobs, you can dynamically modulate the cutoff frequency with complex shapes. Feed an envelope into one input for quick snappy decays, and an LFO into the second for slow, drifting sweeps to create incredibly expressive movement within your system. DIY Build & Customization

  Designed with the DIY community in mind, this kit features an intuitive, reliable layout optimized for clean soldering. Every single component position is cleanly silk-screened with highly visible labels directly on the PCB, making the assembly process smooth and enjoyable from the first resistor to the final jack socket. The matching 8HP front panel is cut from durable PCB substrate, perfectly matching the boutique, high-contrast white and orange aesthetic of the Guru Gara Synth lineup. Technical Specifications

