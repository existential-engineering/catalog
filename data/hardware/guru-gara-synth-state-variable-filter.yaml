specs: |-
  - Format & Size: Compact 8HP Eurorack module
  - Kit Components: FR4 PCB and hand-screened front panel kit
  - Circuit Core: Classic all-analog OTA State Variable design
  - Outputs: Simultaneous High-Pass (HP), Band-Pass (BP), and Low-Pass (LP) outputs
  - Modulation: Dual CV inputs with dedicated attenuators (Amount controls)
  - Aesthetic: Front panel made from PCB material with striking white and orange screen prints
  - Builder Friendly: Highly legible, clear component labeling directly on the PCB
  - Low-Pass (LP): For rich, warm bass sculpting and foundational synth tones.
  - Band-Pass (BP): Perfect for isolations.
  - High-Pass (HP): Ideal for stripping out muddy low-end frequencies, bright lead articulation, and evolving soundscapes.
  - Format: Eurorack
  - Width: 8HP
  - Skill Level: Beginner - Intermediate
  - Filter Type: State Variable VCF (Multi-Mode)
  - Inputs/Outputs: 1 Audio Input | 3 Simultaneous Outputs (HP, BP, LP)
  - Modulation: 2x CV Frequency Inputs with Attenuators
