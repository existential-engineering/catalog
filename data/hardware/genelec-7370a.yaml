name: "7370A SAM Studio Subwoofer"
manufacturer: genelec
primaryCategory: subwoofer
url: https://www.genelec.com/7370a
description: "Created to deliver superb definition, the 7370A subwoofer
  intelligently adapts to your acoustic space to provide controlled, uncoloured
  LF reproduction."
details: |-
  The 7370A is a Smart Active Monitoring (SAM) studio subwoofer engineered to extend the low-frequency response of full multi-channel monitoring systems with precision and control. Built around Genelec's Laminar Spiral Enclosure (LSE) technology, it offers more SPL and deeper low-frequency extension than the smaller SAM subwoofers in the family, while preserving the clean, uncoloured performance Genelec is known for. The 7370A is intended for discerning music, post-production, and broadcast professionals who need a reliable reference for stereo, surround, and immersive workflows.

  At the heart of the 7370A is a 305 mm bass driver coupled to the patented Laminar Spiral Enclosure, a long, spiral-rolled port that minimises turbulence at high SPLs and keeps distortion remarkably low even when the subwoofer is pushed hard. A 400 W Class D amplifier drives the system to a peak SPL of at least 118 dB, while the frequency response reaches down to 19 Hz (-6 dB), supporting both LFE channels in cinema-style productions and full-range music reproduction.

  The 7370A integrates seven balanced analogue XLR inputs and outputs, plus an AES/EBU digital input with thru, allowing it to sit at the centre of a full 7.1 or larger immersive monitoring chain. Two RJ45 GLM Network connectors let the 7370A join Genelec's GLM control network alongside SAM monitors, enabling system-wide bass management, level and delay matching, and AutoCal room compensation. Rear-panel tone controls and LFE settings provide additional configuration for legacy or stand-alone setups.

  Like all SAM products, the 7370A pairs with the free GLM software to calibrate every monitor and subwoofer in the room as a coherent system, automatically correcting for the colourations introduced by walls, surfaces, and room modes. Intelligent Signal Sensing (ISS) circuitry drops power consumption below 1 W when the system is idle, supporting Genelec's long-standing sustainability practices without compromising day-to-day responsiveness.

  Weighing 48 kg in a rugged cabinet measuring 625 x 555 x 496 mm, the 7370A is designed for permanent installation in serious monitoring environments - mastering rooms, post and broadcast suites, and immersive studios where accurate low-frequency reproduction is non-negotiable.
specs: |-
  - SPL (Peak): ≥118 dB
  - SPL (Short term max): ≥113 dB
  - Frequency response: 19 Hz - 100 Hz (±3 dB)
  - Frequency response: 19 Hz - 150 Hz (-6 dB)
  - Self-generated noise: ≤5 dB SPL (A-weighted at 1 m)
  - Harmonic distortion (30-85 Hz, 2nd): ≤3%
  - Bass driver: 305 mm cone (no magnetic shielding)
  - Enclosure: Reflex port (Laminar Spiral Enclosure)
  - Bass amplifier: 400 W Class D
  - Analog signal input: 7 x XLR balanced, 10 kOhm
  - Analog signal output: 7 x XLR male
  - Digital signal input: 1 x XLR AES/EBU, 110 Ohm
  - Digital signal output (thru): 1 x XLR AES/EBU, 110 Ohm
  - Control network: 2 x RJ45 CAT5 (GLM Network)
  - Mains: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): ≤1 W
  - Power consumption (idle): ≤20 W
  - Power consumption (full output): 400 W
  - Height: 625 mm
  - Width: 555 mm
  - Depth: 496 mm
  - Weight: 48 kg (105.8 lb)
