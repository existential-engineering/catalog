name: Thump15v4
manufacturer: mackie
primaryCategory: speaker
url: https://www.mackie.com/en/products/loudspeakers/thumpv4-series/thump15v4.html
description: "Whether you're a musician taking the stage or a DJ packing the
  dance floor, make an impact with the Thump15v4 professional loudspeaker
  featuring SoundCheck DSP."
details: |-
  Mackie Thump15v4 professional powered loudspeakers are the loudest, lowest and clearest everyday gigging solution for any live sound user of any experience level, combining 130 dB maximum SPL, 41 Hz low frequency response and SoundCheck DSP digital signal processing.

  SoundCheck DSP offers voicing modes (Flat, DJ, Live, Wedge) to optimize the speaker for different use cases, along with instant setup features including a Feedback Eliminator, Music Ducking, and Outdoor Mode.

  The Thump15v4 includes Bluetooth connectivity, a built-in mixer, and multiple configuration options to support a wide range of live sound and DJ applications.
specs: |-
  - 1400W class-D amplification
  - 1" custom compression driver
  - 15" low frequency driver
  - 130 dB maximum SPL
  - 41 Hz low frequency response
  - Dual XLR/TRS combo inputs
  - 1/8" input jack on channel 2
  - XLR mix output
  - Bluetooth wireless connectivity
  - Height: 27.4 in / 696 mm
  - Width: 17.3 in / 439 mm
  - Depth: 14.0 in / 356 mm
  - Weight: 32.6 lb / 14.8 kg
  - 3 M10 fly points
