  Modular configuration: S10 Bluetooth speaker units with 40mm bio-cellulose diaphragm, dual microphones, Bluetooth 5.0, 40+ hours playback; H01 slim polycarbonate headband with PU foam padding; E10 on-ear REPREVE memory foam cushions; C05 1.5m straight cable with 1/4 to 1/8 screw-on adapter; A01 protective pouch made from recycled PET.

  Supports Bluetooth 5.0 wireless and analog cable input.
