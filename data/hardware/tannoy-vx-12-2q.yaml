name: VX 12.2Q
manufacturer: tannoy
primaryCategory: speaker
url: https://www.tannoy.com/en/products/0312-ano
description: The VX 12.2Q is a new class of device that delivers high SPL, low
  distortion audio coverage in a complete high performance loudspeaker cabinet.
details: |-
  The VX 12.2Q is a new class of device that delivers high SPL, low distortion audio coverage in a complete high performance loudspeaker cabinet. It provides a high impact solution for medium-to-large scale sound reinforcement in high-SPL applications such as bars and clubs, as well as being well suited for mid-scale portable/live PA applications. Thanks to its twin driver design for extended low frequency reproduction and flexible mounting options, the VX 12.2Q is also ideally suited for use complimenting much larger systems, making it an excellent choice for both installed and portable applications. The VX 12.2Q can also be configured for bi-amp operation.
specs: |-
  - frequencyResponse: 70 Hz – 25 kHz (±3 dB); 55 Hz – 30 kHz (–10 dB)
  - nominalDispersion: 75° H × 40° V @ –6 dB points
  - directivityFactorQ: 13
  - directivityIndexDI: 11.1 dB
  - powerHandlingPassive: 500 W continuous, 2,000 W peak
  - sensitivity: 99 dB (1 W @ 1 m)
  - maxSplPassive: 126 dB continuous, 132 dB peak
  - maxSplBiampLF: 123 dB continuous, 129 dB peak
  - maxSplBiampHF: 127 dB continuous, 133 dB peak
  - impedancePassive: 8 Ω
  - impedanceBiampLF: 8 Ω
  - impedanceBiampHF: 8 Ω
  - crossoverType: Passive / Bi-amp switchable
  - components: 1 × 12" (305 mm) constant directivity PowerDual with Q-Centric waveguide; 1 × 12" (305 mm) LF driver
  - connectors: 2 × 4-pole twist-lock speaker connectors; 1 × barrier strip terminals
  - dimensionsHxWxD: 781 × 371 × 361 mm (30.7" × 14.6" × 14.2")
  - netWeight: 30.5 kg (67.2 lbs)
  - construction: 15 mm (5/8") enclosure / 18 mm (3/4") front, plywood, vented and internally braced
  - finish: Semi matt black paint (white optional)
  - grille: Powder coated perforated steel
  - flyingHardware: M10 × 8 flying inserts (portrait or landscape mounting); M10 × 8 yoke bracket inserts; 2 × Integrip carrying handles; Blanking plate for optional VTH pole mount
  - accessories: Yoke Horizontal VX12.2; Yoke Vertical VX12/VX12.2; Yoke Vertical VX12/VX12.2 - WH; VTH Top Hat
