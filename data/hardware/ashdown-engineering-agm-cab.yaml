details: |-
  The MF-112 is a semi open back 1 x 12" guitar cabinet made from premium plywood and covered in traditional black bronco tolex finished with a silver weave grill with offset small single wing Ashdown logo. Designed to be used live, the MF-112 features a heavy-duty faux leather handle conveniently inset into the cabinet to ensure all types of heads can be sat comfortably on top, with 4 inset feet cradles for perfectly locating your Ashdown guitar amp. This 1 x 12 cab has been paired with a Celestion V-30 speaker for classic rock voicing with enough headroom to deliver beautiful clean tones. Celestion's most revealing speaker, the Vintage 30 features enormously detailed and complex overtones, a warm low-end, a famously rich vocal mid-range and a beautifully detailed top-end. Rated at 60w in 16 ohms the MF-112 cab is an affordable option to pair with the MF-484 2.N guitar head or its little brother the MF-284.
specs: |-
  - Semi open back 1 x 12" guitar cabinet
  - Celestion Vintage 30 (V-30) speaker
  - 60 watt power handling
