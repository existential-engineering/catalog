description: "CHOMPI is a complete starting point for making music with samples, anywhere. Two instruments in one with alternate firmwares: TAPE, a free-form sampler with a varispeed looper, and TEMPO, an intuitive groovebox for syncable patterns and rhythms."
details: |-
  CHOMPI is a complete starting point for making music with samples, anywhere. It was designed to be used by anybody, with a fast, intuitive workflow and go-anywhere portability, but beneath its friendly appearance is a full-featured instrument that's ready to go deeper when you are. CHOMPI ships with TAPE firmware by default.

  CHOMPI is two instruments in one, switchable via alternate firmwares. TAPE is a free-form sampler with a varispeed looper and a fast, intuitive workflow. TEMPO reimagines CHOMPI as an intuitive groovebox, a hands-on way to make syncable patterns and rhythms.

  The unit has a unique stereo sampling engine with a built-in high-quality microphone (top right corner of the top panel), inputs to bring sounds in from other devices, and a microSD card slot to manage samples to and from a computer. Sampling is 16-bit, 48kHz stereo. Chromatic and one-shot sample presets, a varispeed looper, and built-in effects are included, alongside an internal rechargeable battery.

  Audio connectivity includes a stereo master output and stereo headphone output (the headphone jack additionally carries the input monitor signal while sampling), plus a stereo auxiliary input for bringing in external sources. MIDI I/O is provided over two discrete 3.5mm (TRS type-A) jacks, MIDI Out and MIDI In, letting CHOMPI act as a MIDI keyboard or be played and controlled by other MIDI gear. CHOMPI is also a class-compliant USB MIDI device, so MIDI In/Out is additionally available over its USB-C port.

  Power and battery charging is via USB-C (minimum 5V⎓1A to charge while powered off, recommended 5V⎓2A or higher for full-time operation and simultaneous charging).
specs: |-
  - 16-bit, 48kHz stereo sampling engine
  - Built-in high-quality microphone
  - Internal rechargeable battery
  - Chromatic samples with presets
  - One-shot samples with presets
  - Varispeed "tape-style" looper
  - Built-in multi-effects
  - Two instruments in one: TAPE (sampler/looper) and TEMPO (groovebox) firmwares, TAPE ships by default
  - Stereo master output (3.5mm)
  - Stereo headphone output (3.5mm, also carries input monitor)
  - Stereo aux input (3.5mm)
  - MIDI I/O via two 3.5mm TRS type-A jacks (Out, In)
  - Class-compliant USB MIDI over USB-C
  - MicroSD card slot for sample import/export (16-bit 48kHz stereo WAV)
  - USB-C power/charging (5V⎓1A minimum, 5V⎓2A or higher recommended)
