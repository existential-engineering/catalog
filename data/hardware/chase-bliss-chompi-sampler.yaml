description: A complete handheld sampler for making music with samples anywhere.
  Two instruments in one with alternate firmwares — TAPE (free-form sampler with
  varispeed looper) and TEMPO (intuitive groovebox for syncable patterns and
  rhythms).
details: |-
  CHOMPI is a complete starting point for making music with samples, anywhere. It was designed to be used by anybody, with a fast, intuitive workflow and go-anywhere portability, but beneath CHOMPI's friendly appearance is a full-featured instrument that's ready to go deeper when you are.

  CHOMPI features two instruments in one with alternate firmwares. TAPE is a free-form sampler with a varispeed looper and a fast, intuitive workflow. TEMPO is a brand new instrument that reimagines CHOMPI as an intuitive groovebox: a hands-on way to make syncable patterns and rhythms. CHOMPI ships with TAPE firmware by default.

  The device features 16-bit 48KHz stereo sampling with a built-in microphone, internal battery, chromatic and one-shot sample presets, a varispeed looper, and built-in effects. It offers 3 routing options with stereo master output, stereo headphone output, and stereo aux input.

  MIDI I/O is included with Note out and CC in capabilities, and the device is powered via USB-C (5V 1A, recommended 5V 2A or higher).
specs: |-
  - 16-bit 48KHz stereo sampling
  - Built-in microphone
  - Internal battery
  - Chromatic samples with presets
  - One-shot samples with presets
  - Varispeed looper
  - Built-in effects
  - 3 routing options
  - Stereo master output
  - Stereo headphone output
  - Stereo aux input
  - MIDI I/O (Note out, CC in)
  - USB-C power (5V 1A, recommended 5V 2A or higher)
  - Dual firmware: TAPE and TEMPO modes
