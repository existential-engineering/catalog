details: |-
  The Sabbra Cadabra is Catalinbread's tribute to Tony Iommi's legendary Black Sabbath tone, achieved by running a treble booster into Laney Supergroup amplifiers. The pedal combines the character of both — treble booster and cranked Laney — in a single compact pedal.

  Designed to transform any guitar rig into the heavy, doom-laden sound of early Black Sabbath at modern stage volumes, without requiring extreme amplification. Handmade in Portland, Oregon. Backed by a 3-year warranty.
