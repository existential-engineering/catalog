description: >-
  The Korg MS-10 is a monophonic single-VCO analog synthesizer released in 1978, known for
  its great bass and percussive sounds. Featuring the authentic look of a mini-modular
  with patchable components and an external input for filtering external sound sources, it
  served as an entry-level companion to the more popular MS-20. It is CV/Gate controllable
  and has been used by artists including The Chemical Brothers, Autechre, Juan Atkins, and
  Underworld.
details: |-
  The Korg MS-10 was released in 1978 as an entry-level monophonic analog synthesizer in Korg's MS series. While its sibling the MS-20 went on to become one of the most iconic synths of its era, the MS-10 earned its own devoted following thanks to its raw, aggressive sound character and straightforward single-oscillator design.

  The MS-10 features a semi-modular architecture with a patch panel that allows users to override the default signal routing and create custom configurations. Its single VCO feeds into a resonant lowpass filter capable of self-oscillation, giving the synth a thick, biting tone that excels at bass lines and percussive patches. A mixable white and pink noise generator adds further sonic versatility.

  A standout feature is the external audio input to the filter, which allows musicians to process external sound sources through the MS-10's characterful VCF. Combined with CV/Gate control, this makes the MS-10 a flexible tool that integrates well with other analog and modular gear. The 32-key keyboard and ADSR envelope with hold provide expressive playability despite the instrument's compact size.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Noise: Mixable white/pink noise generator
  - LFO: 1 LFO with multiple waveforms
  - Filter: 1 lowpass VCF (resonant)
  - Envelope: ADSR with Hold
  - Keyboard: 32 keys
  - Patch Panel: Semi-modular with patchable signal routing
  - External Input: Audio input to filter for processing external sources
  - Control: CV/Gate
  - Sequencer/Arpeggiator: None
