url: https://dynaudio.com/professional-audio/dynaudio-acoustics-delta-amplifiers/delta-80-dsp
description: "The Delta series philosophy: reliability, trust and transparent
  amplification of your mix."
details: |-
  Every model uses the highest-quality power-amplifier technology so you know for a fact that what goes in, comes out exactly as intended. Only louder.

  The 2U Delta 80 DSP yields a staggering 4x 2000W at 4 ohms or 2x 4000W when bridged. And it does so without breaking a sweat, while delivering low distortion and noise figures. For instance, THD is as little as <0.18% at 1kHz.

  Analogue or AoIP via Dante? Delta 80 DSP handles up to four channels; it's a future-proof system that can keep up with whatever your studio throws at it. When using Dante, your audio is converted by 24-bit/96kHz DACs. And should the need for room tuning arise, you also get access to sophisticated DSP features. These span three dynamic and eight static EQ bands per input channel, and nine static EQ bands per output. Plus a suite of additional filters.

  You also get wireless control via the DeltaDirect app for iPad, GPIO for remote control and monitoring and redundant back-up amp inputs. Want a stereo four-way system? Just connect to a Delta DSP amplifier with a single Cat 5 cable to eliminate the need for external processing.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Acoustic Amplifiers
  - Type: Amplifier
  - Number of channels: 4
  - Output power per channel @ 8 ohms: 1000W
  - Output power per channel @ 4 ohms: 2000W
  - Output power per channel @ 2.7 ohms: 2200W
  - Output power per channel @ 2 ohms: 2000W (amplifier stable, output reduced; 2.7 ohm power quoted for highest single-ended output and greatest efficiency, 3 x 8 ohm parallel drivers)
  - Output power bridged @ 8 ohms: 4000W
  - Output power bridged @ 4 ohms: 4000W
  - THD @ 1kHz (1dB below max output): < 0.18%
  - THD 20Hz to 20kHz (1dB below max output): < 0.2%
  - Gain: 32dB
  - Sensitivity (for max power): 8.3dBu
  - Frequency response: 20Hz to 20kHz (+0/-0.5dB)
  - Power consumption (standby): < 5W
  - Power consumption nominal @ 240V into 4 ohms: 4.1A
  - Power consumption nominal @ 120V into 4 ohms: 8.2A
  - Chassis: 2U rack
  - Dimensions (HxWxD): 88 x 482 x 428 mm
  - Single-box shipping dimensions (UK, 2 units): 230 x 580 x 560 mm
  - Double-box shipping dimensions (outside UK, 2 units): 250 x 610 x 600 mm
  - Weight: 10.3 kg (22.7 lbs)
  - Boxed weight: 11.8 kg (26.0 lbs)
  - DSP: 3 dynamic + 8 static EQ bands per input channel, 9 static EQ bands per output, plus additional filters
  - Control: DeltaDirect app for iPad (wireless), GPIO for remote control and monitoring
  - Redundancy: Redundant back-up amplifier inputs
  - Network audio: Dante / AES67 (24-bit / 96kHz DACs)
  - Inter-amp link: Single Cat 5 connection to another Delta DSP amplifier for stereo four-way systems (no external processing required)
  - Mains input: 90-260 VAC (max 120W) via IEC C13
