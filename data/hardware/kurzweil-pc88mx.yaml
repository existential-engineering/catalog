description: >-
  The Kurzweil PC88MX is an 88-key weighted-action performance keyboard featuring 64 ROM-based
  voices from Kurzweil's acclaimed sample library, designed as a self-contained stage instrument
  and MIDI controller.
details: |-
  Released in 1997, the PC88MX was Kurzweil's answer to the demand for a portable, performance-oriented keyboard built around their renowned ROM samples. With 88 weighted-action keys offering adjustable velocity and aftertouch, it delivered the playing feel of a serious stage piano while doubling as a sophisticated MIDI controller.

  The internal sound engine provided 64 voices drawn from Kurzweil's acclaimed sample library, with 32-note polyphony in full stereo and the ability to layer up to four sounds simultaneously. Built-in reverb and chorus effects, along with a sophisticated arpeggiator, rounded out the onboard sound capabilities. The focus was deliberately on quality over quantity, and the piano sounds in particular were praised at launch.

  As a MIDI controller, the PC88MX offered considerable flexibility. Thirty-two versatile MIDI setups could be used as templates or starting points for custom configurations. Four independent zones allowed simultaneous output on separate MIDI channels, each with its own key range and the ability to overlap. Zones could be muted or soloed instantly, and incoming MIDI data could be merged or remapped. Two programmable wheels, four sliders, three buttons, and jacks for two footswitches and four continuous control pedals provided extensive physical control.

  An optional Voice/GM expansion board transformed the PC88MX into a General MIDI instrument, adding 12 drum and percussion sets while doubling maximum polyphony to 64 notes. The PC88MX was eventually succeeded by the PC2, but remains sought after for its build quality and rich piano sounds. Notable users include Amanda Palmer and David Rosenthal.
specs: |-
  - Polyphony: 64 voices (with GM expansion board)
  - Waveforms: ROM, wavetable
  - Effects: Reverb, chorus
  - Keyboard: 88 keys with weighted action, adjustable velocity and aftertouch
  - Memory: 1024 patches
  - Control: MIDI In/Out/Thru
