description: Made in Japan flanger mini-pedal modeled after a vintage flanger
  sound, with Depth, Regen, and Speed controls. Pro-quality tones in a
  pedalboard-friendly compact box.
details: |-
  Part of the MINI pedal family, the Flanger MINI is modeled after a vintage flanger sound and delivers pro-quality tones in a convenient, compact box. Made in Japan, the FLMINI features a three-knob controls layout consisting of Depth, Regen, and Speed.

  True bypass switching provides the shortest, most direct signal path. The 100% analog circuitry preserves the lush sweeping character that defines a vintage flanger.
specs: |-
  - Controls: Depth, Regen, Speed
  - True Bypass switching
  - Required Current: 50mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - 100% analog circuitry
  - Input on right side; output on left side
  - Made in Japan
