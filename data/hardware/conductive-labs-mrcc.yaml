description: A standalone MIDI Router Control Center that merges, filters, and
  routes MIDI without a computer, with a full matrix routing monitor and up to
  250 saveable routes.
details: |-
  MRCC (MIDI Router Control Center) reinvents the classic MIDI router as a standalone hardware unit, letting musicians patch and filter MIDI without switching into computer-configuration mode. Automatic input merging, MIDI message filtering (clock, note on/off, CC, program change, stop/start/continue), velocity scaling, and channel splitting are all handled onboard.

  Up to 127 presets can be saved and recalled (expandable to 250 routes with the latest firmware), with Program Change-based patch recall, multiple arpeggiators, keyboard splits and layers, and a MIDI panic function. A full matrix routing monitor with a color OLED display and visual MIDI indicators shows every active connection at a glance, and a CV clock output (5V or 12V selectable, configurable PPQ) syncs modular gear.

  MRCC is expandable: the MRCC XpandR 4x1 plugs into a USB host port to add DIN and TRS MIDI connectivity, the MRCC Remote 7 extends outputs up to 50 feet over a single Ethernet cable, and an MRCC Expansion Splitter lets two MRCCs and a Remote 7 share a connection. It supersedes the earlier, non-expandable MRCC 880 as the flagship of the product line.
specs: |-
  - Automatic MIDI input merging
  - MIDI filtering: clock, note on/off, CC, program change, stop/start/continue
  - Velocity scaling and channel splitting
  - Save/load up to 127 presets (expandable to 250 routes with latest firmware)
  - Program Change-based patch recall
  - Multiple arpeggiators, keyboard splits and layers
  - MIDI panic function
  - Full matrix routing monitor with color OLED display and visual MIDI indicators
  - CV clock output (5V or 12V selectable, configurable PPQ)
  - 12 individually routable virtual USB MIDI ports via device connection (192 total channels); 4 virtual ports per USB host input, 1 per USB host output
  - Dimensions: 15.5" x 3.5" x 1.9"
  - 28 routing buttons plus remote routing button and standby button
  - International AC/DC power supply included (100-240V AC input; 5.25V DC, 3A output via USB-C)
  - Expandable with MRCC XpandR 4x1, MRCC Remote 7, MRCC Expansion Splitter, and 2U rack ears
