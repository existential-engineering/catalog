description: Quad-mode overdrive with adjustable bass and gain, switchable diode
  clipping and a Phat bass-cut switch.
details: |-
  The Oxblood Overdrive is Keeley's original-design answer to the many clones of a well known mythical-beast overdrive. The circuit is built to blend from perfectly clean through to amp-crushing saturation, with a large, focused midrange intended to suit single-coil and humbucker guitars alike.

  Rolling the Drive control off gives a clean sound, and any amount of distortion and volume can be dialled in from there. Two clipping options are offered through carefully chosen diodes, selected on this version for bigger, more open amp tones with less compression than the standard Oxblood.

  Keeley identifies five parameters as the key to the pedal: bass response, clipping, tone, volume and drive, with the circuit's midrange character as a sixth element. The Phat switch cuts bass response for a Screamer-style or midrange-shelved voicing, the Clipping switch changes the sustain available, and voltage doubling inside the circuit provides the headroom behind the Volume control.

  The pedal was designed by Robert Keeley and Craighton Hale, with input from effects designer Jack Orman.
specs: |-
  - - Controls: Volume, Tone, Drive
  - - Phat switch cuts bass response for a midrange-shelved voicing
  - - Clipping switch selects between two diode clipping options
  - - Diodes selected for more open amp tones with less compression than the standard Oxblood
  - - Internal voltage doubling for additional headroom
