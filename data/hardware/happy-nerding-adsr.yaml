details: |-
  ADSR (Attack-Decay-Sustain-Release) is a module designed to generate a voltage, which acts as the envelope with the adjustable stages. This envelope, generated in response to the incoming gate signal or manually pushed button, can then be used to shape the sound amplitude via VCA, modulate filter's cutoff frequency or any other parameters expecting CV control.

  It features exponential Attack, Decay and Release stages, a switch to select fast/slow operation mode, and a push button with LED indicator to manually activate the envelope.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - Attack: 1,5 ms to 10 s (x10 in slow mode)
  - Decay: 2 ms to 10 s (x10 in slow mode)
  - Sustain: 0 to 100 % or 0 to 7,5 V
  - Release: 1 ms to 10 s (x10 in slow mode)
  - Output level: 0 to 7,5 V
  - Output impedance: 500 Ohm
  - Module depth: 2.5 cm or 1 inch
  - Power consumption: +20 mA / -10 mA at +/-12 Vdc
  - Reverse power protected
