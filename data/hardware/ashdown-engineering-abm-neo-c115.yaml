name: ABM NEO C115
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-neo-c115
description: A lightweight 1x15 inch bass combo from Ashdown's ABM NEO range,
  pairing the iconic ABM preamp with a special 400-watt lightweight power
  section for pure Ashdown ABM tone in a compact package. Assembled in the UK
  from marine-quality 15mm lightweight plywood and front-ported for maximum
  forward dispersion.
details: |-
  The ABM NEO C115 is a lightweight 1x15 inch bass combo from the ABM NEO range, coupling the iconic ABM preamp with a 400-watt lightweight power section for pure ABM tone in a compact, portable package. It is assembled in the UK from marine-quality premium 15mm lightweight plywood and front-ported for maximum forward dispersion. Connectivity includes a switchable High/Low instrument input, a line input, a line output, a balanced DI output, a tuner output, and an FX loop, with a 12AX7 preamp tube.
specs: |-
  - Power Output: 400 Watts
  - Speaker Configuration: 1 x 15
  - Speaker Outputs: Speakon/Jack
  - Minimum Impedance: 4 Ohms
  - Frequency Response: -3dB at 17Hz and 30kHz
  - High Instrument Input: 3.9M Ohms
  - Low Instrument Input: 10k Ohms
  - Line Input: 22k Ohms
  - Line Output: 10k Ohms
  - DI Output: 600 Ohms balanced
  - Tuner Output: 1k Ohms
  - Effects Send: 22k Ohms
  - Effects Return: 22k Ohms
  - Pre-amp Tubes: 1 x 12AX7
  - Dimensions (H x W x D): 630 x 465 x 330 mm
  - Weight: 24.5 kg
