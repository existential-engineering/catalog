description: The Barbershop Millenium Overdrive is a simple, original design
  handmade from matched JFETs, delivering versatile overdrive character from
  nearly clean to rich saturation.
details: |-
  The Barbershop Millenium Overdrive is handmade from JFETs matched to specs,
  offering a versatile range from almost clean to a tasty rich overdrive. The SAG
  control reduces supply voltage to the amplifiers for additional control over
  saturation character and feel. A 3-position TONE switch selects between no cut
  (classic Barbershop), subtle high cut, or a more extreme cut.

  The DRIVE control sets interstage gain and the VOLUME control adjusts output
  level with plenty of headroom to boost. The pedal can function with voltages up
  to 18 VDC, though higher voltage reduces drive. No battery connection; powered
  exclusively via the 2.1mm DC barrel jack.
specs: |-
  - True bypass
  - Dimensions: 4.4" x 2.7"
  - Input impedance: 1 MΩ
  - Output impedance: <5 kΩ
  - Power supply: 9–9.6 VDC centre-negative (up to 18 VDC with tonal change)
  - Current draw: 5 mA
  - 1/4" mono input/output jacks
  - 2.1mm DC connector
  - No battery connection
  - Made in Hull, Québec
