description: The Studio JTM Combo is a compact 20W all-valve guitar amplifier
  from Marshall's Studio range that brings the era-defining tones of the
  original JTM45 to a smaller, more home- and studio-friendly format. Built at
  Marshall's Bletchley, England factory, it pairs the iconic warm and smooth
  JTM45 voicing with modern flexibility, including a power reduction switch that
  drops the output from 20W down to 5W for lower-volume settings. The amp
  delivers its sound through a single 12" Celestion G12M-65 Creamback speaker
  for rich low end, warm mids, and refined highs, and includes a series effects
  loop. Visually it pays homage to the 1960s originals with a solid metal logo,
  gold piping, and gold beading.
details: |-
  The Studio JTM Combo brings the iconic 60s tone that initially launched Marshall to the present day, in a more compact format. Whether you are at home, in the studio, or on the big stage, it can adapt to bring exceptional tone to any situation with built-in power reduction technology.

  Power reduction switches the output between 20W and 5W at the flick of a switch, so the amp can move between the rehearsal room and home.

  The Studio JTM line replicates the renowned, velvety tones of the original Marshall JTM45, with two bridgeable voices, a series effects loop and a DI output.

  The Celestion G12M-65 Creamback speaker gives the timeless G12M tone while accommodating higher power levels, with a rich low end, warm mid-range, crunchy upper-mids and refined highs.

  Skilfully crafted at Marshall's factory in Bletchley, England, the Studio JTM carries classic Marshall touches including a solid metal coffin logo and gold piping and beading that harks back to the 1960s. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: ST20C
  - Range: Studio
  - Built in Marshall's UK factory
  - All-valve
  - Same smooth tones as the original JTM45
  - Output wattage: 20W (with power reduction option to 5W)
  - Channels: 2, bridgeable
  - Technology: valve
  - Outputs: speaker outputs 5 x 1/4-inch jack sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4-inch jack)
  - Inputs: 4 x 1/4-inch jack instrument inputs (high/low sensitivity)
  - Controls: normal/loudness II, high treble/loudness I, treble, middle, bass, presence
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Speaker configuration: 1x12"
  - Power handling: 65W
  - Speaker model: Celestion G12M-65 Creamback (16 ohm, 65W)
  - Unit impedance: 16 ohm
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x 5881
  - Weight: 17.8 kg / 39.2 lb
  - Width: 500 mm / 19.7 inches
  - Height: 460 mm / 18.1 inches
  - Depth: 265 mm / 10.4 inches
  - Country of origin: designed and engineered in UK, made in UK
  - Box contents: detachable power cable included
  - Colour: Black
