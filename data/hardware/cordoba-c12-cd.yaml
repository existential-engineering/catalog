details: |-
  The all-solid C12 is one of our most high-end and modern guitars. Built with a solid Canadian Cedar top and Indian Rosewood back and sides, the C12's lattice bracing and raised fingerboard are elements that make this model truly stand out from the rest. The delicately braced top provides rich tones with a lively presence and the raised fingerboard makes accessing upper frets a breeze. The C12 is a treasure to last a lifetime with stunning decorative elements such as its flamed maple center wedge on the back, matching maple binding, and hand-inlaid 1920s-inspired pearloid rosette. Comes inside a hardshell Cordoba humidified archtop case.
