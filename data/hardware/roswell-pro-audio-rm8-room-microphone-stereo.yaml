description: A matched stereo pair of RM8 large-diaphragm condenser microphones
  designed specifically for drum room recording, with switchable
  Cardioid/Figure-8 polar pattern and a tuned high-frequency rolloff.
details: |-
  The RM8 is a large diaphragm condenser designed specifically for drum room. What makes it a room mic? Applications

  The primary application is of course drum room. Customers tell us the mic has become a go-to favorite for guitar cab and bass cab. The RM8 can be used directly on the center of the speaker cone of a guitar amp, a location that is typically far too bright for mic placement. The soft top end of the RM8 makes this position usable; the mic retains some of the aggression of this placement without sounding bright, thin, or unbalanced. Included

  Single RM8 microphones ship in a flight case with our famous Cutaway shockmount. Matched pairs of RM8 ship in a 2-mic case with two Cutaway shockmounts. Each RM8 is hand-assembled and tuned in our California headquarters. Capsule voicing is meticulously set for each mic. Component quality is second to none. Matching Criteria

  The mics are matched to within 0.3dB in sensitivity (measured at 1kHz), and ±1.5dB, 50 Hz-12kHz. Demonstration

  See this demo from Ultimate Studios Inc .
specs: |-
  - Switchable polar pattern : Cardioid / Figure 8. This means a pair of RM8 microphones can be used for every possible stereo configuration: XY, AB, ORTF, Mid-Side, Blumlein.
  - Low-pass filter and carefully tuned frequency response curve : the RM8 has a flat frequency response to 4000 Hz, and a first-order filter (-6dB/octave) above that point, in both Cardioid and Figure-8. The high-frequency rolloff is intended to reduce the amount of cymbal wash in a drum room recording.
  - Low-noise circuit with fast, clean transient response : we chose a neutrally voiced circuit topology to capture ambient sound with high resolution and fidelity. Because room tracks are often heavily compressed, we opted to reduce circuit distortion as much as possible.
