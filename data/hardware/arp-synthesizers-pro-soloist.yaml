description: >-
  The ARP Pro-Soloist is a compact monophonic analog synthesizer from the early 1970s
  featuring 30 preset sounds with expressive aftertouch sensitivity, originally designed
  to accompany electronic organs.
details: |-
  The Pro-Soloist is a thirty-preset monophonic analog synthesizer introduced in 1972, originally designed to sit atop and complement large electronic organs. It provided 30 preset sounds including Flute, Bassoon, Brass, and Fuzz Guitar, along with pitch, portamento, vibrato, growl, and wow effects.

  The keyboard features 37 keys with aftertouch sensitivity that routes to volume, brilliance, vibrato, wow, and bend effects. This made it one of ARP's most playable and expressive solo instruments of the era.

  A few basic filter, envelope, and LFO controls allow tweaking of the preset sounds, though no memory exists to store custom settings. This compact monosynth excels as a lead instrument.

  The Pro-Soloist was based on the earlier Soloist model from 1970-71, which had preset selection switches located under the keyboard similar to Roland and Elka designs. The Pro-Soloist was later followed by the Pro/DGX in 1977.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: Yes
  - Filter: Yes
  - VCA: Yes
  - Keyboard: 37 keys with aftertouch
  - Aftertouch routing: Volume, brilliance, vibrato, wow, bend
  - Presets: 30 (Flute, Bassoon, Brass, Fuzz Guitar, etc.)
  - Arpeggiator/Sequencer: None
  - Date Produced: 1972-1977
