details: |-
  As Ludwig's flagship professional drum line, Legacy Maple is a decidedly modern twist on our vintage shell formula. The design was inspired by Ludwig's 1968-1976 era shells, captured on some of music's most iconic performances.

  Legacy Maple shells feature a 3-ply construction with a 1/16" Maple outer ply, 1/8" Poplar core ply, and 1/16" Maple inner ply, stabilized by 1/4" solid maple reinforcement rings. The bearing edge is a 30-degree inner cut with a 1/4" radius round-over, producing a bright presence, full-body low-end, and exceptional focus.

  Each kit is hand-crafted at Ludwig USA in Monroe, NC, and can be customized through the Ludwig Outfitter program with a wide range of shell sizes and over 35 finish options spanning hybrid sparkles, classic pearls, oysters, stains, satins, and exotic veneers.
specs: |-
  - Shell construction: 3-ply (1/16" Maple outer ply, 1/8" Poplar core ply, 1/16" Maple inner ply)
  - Reinforcement: 1/4" solid maple reinforcement rings
  - Bearing edge: 30-degree inner cut with 1/4" radius round-over
  - Hand-crafted at Ludwig USA in Monroe, NC
  - Bass drum diameters: 16"-26"
  - Floor tom diameters: 14"-18"
  - Tom diameters: 10"-16"
  - Snare diameters: 12"-14"
  - Available finishes (35+): Black Hybrid Sparkle, Copper Hybrid Sparkle, Moss Green, Black Oyster, Classic Olive Pearl, Aged Onyx, Sky Blue, Vintage White Marine, White Marine, Digital Black Sparkle, Blue Sparkle, Green Sparkle, Gold Sparkle, Red Sparkle, Silver Sparkle, Vintage Black Oyster, Vintage Blue Oyster, Mod Orange, Blue Olive Oyster, Olive Oyster, Citrus Mod, Vintage Pink Oyster, Heritage Green, Diablo Red, Vintage Bronze Mist, Heritage Blue, Golden Slumber Burst, Cherry Stain, Sable, Mahogany Stain, Charcoal Shadow, Burnt Natural, Cherry Satin
