url: https://mackie.com/en/products/loudspeakers/srm-v-class/SRM215_VClass.html
description: '15" 2000W high-performance powered loudspeaker with Class-D
  amplification, Advanced Impulse DSP and a built-in SRM Mix Control digital
  mixer.'
details: |-
  The SRM215 V-Class features a 2000W Class-D amplifier delivering the highest SPL in its class, while delivering incredible stability, audio fidelity and reliability. Custom transducers use large magnets, robust motors and specially designed voice coils for premium performance.

  A Custom Sym-X Horn is designed to maintain the flattest response possible at the crossover point. Advanced audio processing includes Advanced Impulse DSP with precision crossover, Transparent System Protection multi-band compression, and Intelligent Bass Management technology.

  The built-in SRM Mix Control digital mixer supports dual independent channels via XLR/TRS combo inputs plus a dedicated 1/8" stereo aux channel, with channel EQ, voicing modes, variable crossover, alignment delay up to 100 ms, and save/recall of up to 10 user presets.

  Bluetooth streaming and linking, plus the SRM Connect app for iOS/Android, enable wireless control of up to 100 meters between linked speakers. The cabinet supports vertical or wedge positioning, M10 fly points for suspension, and a built-in pole mount.
specs: |-
  - 2000W Class-D amplifier
  - 15" low-frequency driver
  - 1.4" high-frequency driver (premium polymer)
  - Custom Sym-X horn
  - Advanced Impulse DSP with precision crossover
  - Intelligent Bass Management
  - Transparent System Protection (multi-band compression)
  - Dual independent channels (XLR/TRS combo inputs)
  - Dedicated 1/8" stereo aux channel
  - High-contrast full color display
  - Channel EQ and level adjustment
  - Voicing modes for different applications/venues
  - Variable crossover point
  - Alignment delay (up to 100 ms)
  - Save/recall up to 10 user presets
  - System lock with 4-digit passcode
  - Bluetooth streaming and linking
  - SRM Connect app (iOS/Android)
  - Wireless control up to 100 meters between linked speakers
  - Maximum SPL Peak: 136 dB
  - Frequency Response: 40 Hz - 20 kHz
  - Horizontal Coverage Angle: 90°
  - Vertical Coverage Angle: 60°
  - Height: 28.8 in / 732 mm
  - Width: 17.6 in / 447 mm
  - Depth: 15.4 in / 391 mm
  - Weight: 48.9 lb / 22.2 kg
  - Vertical or wedge positioning
  - M10 fly points for suspension
  - Built-in pole mount
  - T100 tripod stand compatible (sold separately)
  - SPM400 speaker pole compatible (sold separately)
