description: Mackie SRM215 V-Class sets a new industry standard for portable loudspeakers, bringing the best-in-class performance, clarity and technology you need when compromise isn’t an option.
details: |-
  Mackie SRM215 V-Class sets a new industry standard for portable loudspeakers, bringing best-in-class performance, clarity and technology. It is built on Mackie's most advanced amplifier platform, delivering 2000W with the highest SPL in its class along with stability, audio fidelity and reliability. Power Factor Correction keeps output solid in demanding settings where the AC power is shaky.

  SRM V-Class loudspeakers use custom transducers built with large magnets, robust motors, specially designed voice coils and a polymer high-frequency driver. The cabinet is engineered around the transducers, with additional cooling vents and directional cabinet porting for maximum heat dispersion and reliability. The custom Sym-X™ horn lets the HF compression driver operate at near maximum efficiency while keeping the response symmetrical and flat at the crossover point.

  Advanced Impulse™ DSP uses FIR filtering to remove acoustic anomalies across the entire dispersion zone, frequency range and time domain. Transparent System Protection analyzes the audio signal, identifies problem areas and dynamically applies multi-band compression to those specific frequencies, so levels stay in check without the diminished bass and pumping that broad limiting causes. Intelligent Bass Management™ maintains tonal balance and output level at very high SPL while keeping the bass tight and punchy.

  Built in is SRM Mix Control™, a 4-channel digital mixer with two independent channels for mic, line and instrument signals on XLR/TRS combo inputs, a dedicated 1/8” stereo aux channel, direct outputs on channels 1 and 2 plus a mix output. A full color display gives single-knob access to levels, EQ, voicing modes, variable crossover, alignment delay and up to 10 user presets. The SRM Connect™ app for iOS and Android adds wireless control, and Bluetooth® allows music streaming and linking of two speakers at up to 100 metres.

  The dual-angled cabinet works as a PA speaker or as a floor monitor, the pole mount offers an optional 7-degree downward tilt for elevated stages, and M10 fly points allow overhead installation with the PA-A3 eyebolt kit.
specs: |-
  - 2000W peak Class-D amplifier (LF 1800W peak, HF 200W peak)
  - 15" / 381 mm low-frequency driver with ferrite magnet
  - 1.4" / 36 mm polymer compression driver on a custom Sym-X horn
  - Frequency response (-10 dB): 40 Hz - 20 kHz
  - Frequency response (-3 dB): 44 Hz - 20 kHz
  - Maximum SPL peak: 136 dB
  - Horizontal coverage 90 degrees, vertical coverage 60 degrees, monitor angle 45 degrees
  - Electronic crossover: 24 dB/octave at 2.0 kHz
  - Advanced Impulse DSP with FIR filtering and transducer time-alignment
  - Transparent System Protection with multi-band compression and input limiting
  - Intelligent Bass Management low-frequency management
  - SRM Mix Control built-in 4-channel digital mixer with full color display
  - Dual independent mic, line and instrument channels on XLR/TRS combo inputs plus dedicated 1/8" stereo aux channel
  - Direct outputs on channels 1 and 2 plus mix output
  - 10 speaker voicing modes (5 inside, 5 outside), 3-band input EQ, variable subwoofer HPF 20 Hz - 150 Hz
  - Alignment delay 0 - 100 ms, 10 user presets, system lock with 4-digit passcode
  - Bluetooth 4.2 Class 1 for audio streaming, user interface control and speaker linking up to 100 m
  - SRM Connect app control for iOS and Android
  - Universal power supply 100-240 VAC, 50-60 Hz, 110W with Power Factor Correction
  - Black polypropylene asymmetrical cabinet, 16-18 gauge perforated steel grille with nylon net backing
  - Dual-angled cabinet for PA or floor monitor use, dual angle pole-mount with 7 degree downward tilt, M10 fly points
  - Dimensions (H x W x D): 28.8 x 17.6 x 15.4 in / 732 x 447 x 391 mm
  - Weight: 48.9 lb / 22.2 kg
