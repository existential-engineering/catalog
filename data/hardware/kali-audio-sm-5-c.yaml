description: The passive version of the SM-5 Santa Monica Series studio monitor,
  offered to enterprise customers and requiring an external power amplifier. The
  passive versions have equivalent output, distortion, and frequency response
  specifications when used with Kali-specified amplification.
details: |-
  The SM-5-C requires a power amplifier. For full output and minimum distortion, Kali recommends bi-amplifying the speakers using an LEA Connect Series amplifier with at least 100 W per channel. The LEA Connect 164, a 160 W per channel 4-channel amplifier, is given as the minimum choice for a pair of SM-5-Cs. Configuration files for LEA amplifiers are published on the page, with a separate file for the LF channel and for the MR+HF channels, and page 12 of the user's guide covers programming those files into the amplifier.

  Nearly full output and acceptable distortion may also be attained using the single wire tuning and one of LEA's 80 W amplifiers, which makes it possible to amplify up to four speakers using an LEA Connect 84 or up to eight using an LEA Connect 88. In single wire operation max SPL is 1 dB lower and distortion is slightly higher at full output. An LEA Connect Series amp with a higher power rating reaches full output, although distortion remains higher than in a bi-amplified configuration.

  For a different amplifier, Kali states the minimum requirement as the ability to deliver 20 VRMS into a 3 ohm load. Most amplifiers rated for 100 W at 4 ohm should be sufficient, but the page stresses verifying that the chosen amplifier can handle a 3 ohm load.

  The amplifier, or some other component after the amplifier in the signal chain, has to include a peak limiter: the page states that using the SM-5-Cs without a peak limiter voids the warranty, and that Kali Audio is not responsible for damage incurred to the speakers if a peak limiter is not used. Peak limiter specifications are on pages 9 to 11 of the user's manual, and an RMS limiter is also recommended.

  The Santa Monica Series page frames availability: both the SM-5 and SM-8 are available in passive versions for enterprise customers, with minimum order quantities and build-to-order lead times. That page describes the SM-5 as a 3-way design with a 1-inch metal dome tweeter, a 4-inch optimized profile paper cone midrange and a 5-inch optimized paper woofer, crossing over at 280 Hz and 2800 Hz.
