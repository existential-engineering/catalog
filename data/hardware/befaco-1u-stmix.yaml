description: STMix is a compact 4 channel stereo mixer with an auxiliar input.
  This module is compatible with our Hexmix System
details: |-
  The 1U STMix is a four-channel stereo mixer in 28HP and 1U Intellijel format. It can work independently or as an expansion of the Befaco Hexmix module via a six-pin connector located on the back panel.

  Each of the four channels provides a stereo input with individual volume control. The inputs are AC coupled to improve audio performance and reduce unwanted DC offset in the signal path.

  The module includes output clipping LED indicators to alert the user when the mix level exceeds the headroom. A rear six-pin connector allows integration with the Hexmix system as an auxiliary input expansion.

  The front panel is manufactured from heat-treated aluminium. The module is designed, kits are prepared, and completed modules are assembled in Barcelona. A Pulp Logic panel format is available on demand.
