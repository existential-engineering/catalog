details: |-
  The 3-Series Screamer is the beloved JHS Tube Screamer Strong Mod, but in a brand-new $99 pedal. This pedal represents years of Josh playing around with the legendary Tube Screamer circuit and wanting to offer those changes in an affordable package.

  You will find more clean headroom, better usability as a boost, more versatile drive and tone controls as well as a more pleasing frequency response. This may be the most well-balanced Tube Screamer on earth, but that's for you to decide.
