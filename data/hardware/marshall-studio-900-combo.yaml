description: The legendary JCM900 tone, in a compact design. Combining the
  warmth and depth of valve technology with the reliability and versatility of
  solid-state components, the Studio 900 Combo's hybrid design makes it the
  ideal choice for both studio recording and live performances. Featuring two
  ECC83 preamp valves, two 5881 power amp valves, and one ECC83 phase splitter,
  it faithfully captures the original 100W amp in a 20W output. Built for
  versatility, compact in design, while retaining the original JCM900's powerful
  crunch, clarity, and distinctive tone. Designed, engineered and made in the
  UK.
details: |-
  Sculpt new sounds with the Studio 900 Combo. Built for versatility and compact in design, it retains the original JCM900's powerful crunch, clarity and distinctive tone.

  A 20W powerhouse: featuring two ECC83 preamp valves, two 5881 power amp valves and one ECC83 phase splitter, the Studio 900 Combo faithfully captures the original 100W amp in a 20W output, and switches between 20W, 5W and under 1W power attenuation settings.

  Inspired by the JCM900: combining the warmth and responsiveness of traditional valve amps with the reliability of modern technology, the combo delivers everything from sparkling cleans to screaming leads. It is crafted at Marshall's workshop in Bletchley, England, the same UK factory as the JCM900.

  Your tone, anywhere and at any volume: the combo comes packed with features including a built-in effects loop and straightforward controls so you can adjust gain, EQ and volume. Dual channels offer an extensive array of tones, and each channel can be configured with different settings so you can switch between distinct sounds and styles.

  Built-in reverb: an integrated spring reverb adds rich, dynamic layers and depth to the tone. The cabinet carries a single 12 inch Celestion G12T-75 speaker. Designed and engineered in UK. Made in UK.
