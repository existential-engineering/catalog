description: The legendary JCM900 tone, in a compact design. Combining the
  warmth and depth of valve technology with the reliability and versatility of
  solid-state components, the Studio 900 Combo's hybrid design makes it the
  ideal choice for both studio recording and live performances. Featuring two
  ECC83 preamp valves, two 5881 power amp valves, and one ECC83 phase splitter,
  it faithfully captures the original 100W amp in a 20W output. Built for
  versatility, compact in design, while retaining the original JCM900's powerful
  crunch, clarity, and distinctive tone. Designed, engineered and made in the
  UK.
details: |-
  - Hybrid valve design (two ECC83 preamp valves, two 5881 power amp valves, one ECC83 phase splitter)
  - Switchable power: 20W / 5W / <1W
  - Built-in spring reverb
  - Built-in effects loop
  - Two channels (Clean / Crunch)
  - 1 x 12" Celestion G12T-75 speaker
  - Designed, engineered and made in the UK
specs: |-
  - Output Wattage: 20W (with power reduction to 5W and <1W)
  - Technology: Hybrid valve (with solid-state components)
  - Preamp Valves: 2 x ECC83
  - Power Amp Valves: 2 x 5881
  - Phase Splitter: 1 x ECC83
  - Speaker Configuration: 1 x 12"
  - Speaker Model: Celestion G12T-75 (16 Ω, 75 W)
  - Speaker Outputs: 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load)
  - Effects: Built-in spring reverb
  - Effects Loop: Yes
  - Controls: Gain, EQ, and volume (dual channel: Clean Channel A, Crunch Channel A & B per the page's sound clip demos)
  - Origin Country: United Kingdom (designed, engineered and made in UK)
