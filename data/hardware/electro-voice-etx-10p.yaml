name: ETX-10P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/etx-10p/
description: The ETX-10P is a 10-inch two-way powered loudspeaker for
  high-output portable and installed sound applications. A 2000 W Class-D
  amplifier with integrated FIR-Drive DSP drives an SMX2100 10-inch LF woofer
  and a DH3-B 1.25-inch titanium compression driver, delivering up to 134 dB
  peak SPL with 90 x 60 degree coverage. Onboard processing provides system EQ,
  crossovers, limiting, and time alignment via linear-phase FIR filters. The
  18mm plywood enclosure with EVCoat finish includes eight M10 suspension points
  for flown applications, a steel powdercoated grille, and an integrated
  pole-mount.
details: >-
  2000 W Class-D power amplifier delivering up to 134 dB peak SPL


  FIR-Drive DSP with linear-phase FIR filtering for system tuning


  SMX2100 254 mm (10-inch) LF woofer


  DH3-B 1.25-inch titanium HF compression driver


  90 x 60 degree coverage pattern (H x V)


  Eight M10 suspension points for flown rigging applications


  18 mm plywood enclosure with durable EVCoat finish


  Steel grille with powdercoat


  Integrated pole-mount for stand-mounted use


  Two XLR/TRS combo inputs with XLR link output for daisy-chaining


  Universal switching power supply (100-240 V)


  Compatible with optional array bracket, truss adapter, and wall mount
  accessories
specs: |-
  - frequencyResponse: 85 Hz - 20 kHz (-3 dB)
  - frequencyRange: 65 Hz - 20 kHz (-10 dB)
  - maxSpl: 134 dB peak (1 m, broadband pink noise)
  - amplifierPower: 2000 W Class-D
  - coverage: 90 x 60 degrees (H x V)
  - woofer: SMX2100 254 mm (10-inch)
  - tweeter: DH3-B 1.25-inch titanium compression driver
  - crossoverFrequency: 1700 Hz
  - dimensions: 526 x 330 x 365 mm (21.0 x 13.0 x 14.0 in)
  - weight: 20.3 kg (44.8 lb)
  - shippingWeight: 22.9 kg (50.5 lb)
  - powerConsumption: 100-240 V~, 50-60 Hz, 1.6-0.8 A
  - enclosureMaterial: 18 mm plywood with EVCoat finish
  - grille: Steel with powdercoat
  - suspension: 8 M10 threaded suspension points
