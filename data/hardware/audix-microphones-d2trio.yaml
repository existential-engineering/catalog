details: |-
  The AUDIX D2 Trio is everything you need for miking your toms, all in one convenient package. The tailored frequency response of the D2 drum microphone gives you all the punch, clarity, and warmth needed for percussion without being muddy or boomy. The proprietary VLM (Very Low Mass) capsule technology provides superior transient response and more accurately captures every detail of your music. The included DVICE mounts let you squeeze these microphones into tight places eliminating the need for bulky microphone stands.

  Designed, machined, assembled, and tested by AUDIX in the USA.
specs: |-
  - Includes: 3x D2 dynamic instrument microphone
  - Included mounts: 3x DVICE rim mounts
  - Transducer type: Dynamic (VLM capsule)
