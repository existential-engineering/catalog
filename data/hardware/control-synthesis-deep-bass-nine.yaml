description: >-
  The Deep Bass Nine is a monophonic analog bass synthesizer module produced by Control
  Synthesis in 1994. Commissioned as a TB-303 alternative, it features a single VCO with
  sawtooth and square waveforms routed through a 24 dB/oct filter, offering its own deep
  and warm sound rather than an accurate 303 emulation.
details: |-
  The Deep Bass Nine was commissioned around 1994 by UK-based second-hand retailer FX Music Control to meet growing demand for TB-303 alternatives. It represents another entry in the wave of 303 clones developed during this era, designed with straightforward functionality mirroring the original.

  As a single-unit rack module, the DB9 emphasizes simplicity with all controls on the front panel and no hidden menus. The device features a single VCO offering sawtooth and square waveforms, followed by controls for tuning, filter cutoff, resonance, envelope modulation, decay, and accent, echoing the 303 architecture but with distinct sonic differences.

  A key distinguishing factor is the filter choice: the DB9 uses a 24 dB/oct filter rather than the 303's signature 18 dB/oct design. This technical difference contributes to its poor emulation of the 303 but produces much deeper and warmer results instead.

  MIDI control is essential since the device lacks an onboard sequencer. The accent feature operates via note velocity, with a dedicated knob controlling how much velocity affects filter frequency and loudness.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Waveforms: Square, Saw
  - LFO: None
  - Filter: 24 dB/oct
  - Envelope: Decay
  - Effects: None
  - Sequencer: None
  - Keyboard: None
  - Memory: None
  - Control: MIDI IN/THRU, CV/Gate IN/OUT
