description: The Mutant Hot Glue is a versatile bus mixer for analog effects
  chain design. The included analog compressor offers series or parallel
  compression and a sidechain input, making it particularly well suited to drum
  processing. The voltage controlled distortion is based on ideas borrowed from
  the guitar pedals responsible for a lot of yesterday’s acid style techno
  sounds, but improved over the guitar equivalents, and made specifically for
  synthesizer and drum processing. The distortion can be used in its default
  position, normalized to the effects send, or like every other part of the
  module, broken out and used elsewhere in your modular system.
details: |-
  The Mutant Hot Glue is a bus mixer built for designing analog effects chains inside a eurorack system. Four input channels each carry their own level and effects send control, and by default the mixer output feeds the compressor input, which puts New York style parallel compression within reach of the compressor blend control.

  Channel A can be lifted out of the mix with a bypass switch and taken from its own dedicated output, which makes it an easy sidechain source for the compressor. Channel B is a dual input that shares one level and send control, intended for dual output modules such as the Mutant Hihats, and channels C and D have a summed output of their own. An effects send and return allow complex effects routings to be built up inside a modular system, combining DSP and other effects modules entirely within the eurorack domain.

  The analog compressor is a soft knee design built around the same family of premium audio ICs used in some 500 Series studio gear. Threshold and compression ratio have dedicated controls, the gain control dials in up to 40dB of make-up gain, and an LED actively displays the amount of gain reduction. A sidechain input is provided for creating pumping effects.

  The voltage controlled analog distortion takes a classic distortion topology and rebuilds it for modular synthesizers and drum processing. Its input and output are normalized to the module send and return jacks, a blend control sets the mix of distorted and clean input signal, and a fast responding CV input allows complex modulation patterns, including modulation with audio signals.

  Erica Synths redesigned the module in close collaboration with Hexinverter. Minor alterations were made to the mechanical assembly and the digital controls to suit Erica Synths manufacturing routines and chip shortages, while the analogue signal path is identical to the original version. After Hexinverter Électronique founder Stacy Gaudreau announced the close of operations in September 2022, Erica Synths took over manufacturing, sales and support for several Hexinverter Électronique modules, and provides support for the reissue modules only.
specs: |-
  - 4 input channels, each with level and effects send control
  - Channel A mixer bypass switch and dedicated output for sidechain compression
  - Channel B dual input sharing level and send controls
  - Channel C+D summed output
  - Main mixer output normalized to compressor input
  - Soft-knee analog compressor with dedicated threshold and ratio controls
  - Up to +40dB compressor make-up gain
  - Compressor sidechain input
  - LED gain reduction indicator
  - Voltage controlled analog distortion with blend control
  - Distortion in/outputs normalized to the send and return jacks
  - Fast responding distortion CV input
