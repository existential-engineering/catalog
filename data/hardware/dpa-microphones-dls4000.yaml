details: |-
  DPA’s Location Sound Microphone Kits has the crucial mics needed for all your standard location recording needs – shotguns for booming, micro shotguns for discreet plant miking and a range of lavaliers for close miking the talent. Each condenser microphone in the kit has been chosen based on the input of professional sound engineers working within film and broadcast. In addition to the mics, the kit includes 20+ extra cables, holders, concealers, adapters, clips and more. As soon as you open this massive location sound kit, you’re ready to roll. This kit is no longer available to order. We are currently updating it and a new version will be available to order in Q3 2026.
