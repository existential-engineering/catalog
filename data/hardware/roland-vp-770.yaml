description: >-
  The Roland VP-770 is a vocal processing keyboard released in 2009 as a modern
  successor to the legendary VP-330 Vocoder. It combines a sophisticated Vocal
  Designer vocoder section with ensemble sounds, auto-harmony features, and a
  sound looper for creating layered accompaniments. The 49-key instrument offers
  128-voice polyphony across three multitimbral parts including vocal designer,
  ensemble, and bass/percussion.
details: |-
  The VP-770's main feature is the Vocal Designer, built around a vocoder with no directly user-modifiable parameters. Instead of manual tweaking, the unit analyzes incoming vocal audio to create harmonies and effects. It offers 27 programs across six designs: Classic, Male & Female, Gospel, Pop, Background, and Vocoder with subgroups including Modern, Vintage, and WahVox.

  The Auto Harmony feature adds backing vocals with harmonizer modes including Duet, Trio (upper and lower), Quartet, Manhattan, and Jazz-Open. It also includes Auto Note pitch correction similar to Auto-Tune. Audio input processing includes a noise suppressor, parametric equalizer, and compressor to help contour incoming audio.

  The Ensemble section provides 3-part multitimbral capability with a separate synth module containing keyboard sounds organized into Strings, SuperNatural Brass, Guitar, Others, Pad, Synth Strings, Choir, and Jazz Scat categories. A dedicated Bass and Percussion section offers 9 bass sounds and a vocal percussion set.

  The Sound Looper Function provides a phrase-loop sequencer allowing incremental audio recording and playback of any sound coming out of the VP-770, with a maximum recording time of 18 seconds, enabling performers to quickly build up accompaniment patterns on the fly.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 3 parts (Vocal Designer, Ensemble, Bass/Percussion)
  - Keyboard: 49 keys with velocity and aftertouch
  - Memory: 16 preset, 16 user
  - Sequencer: Sound Looper, max 18 seconds recording time
  - Vocal Designer Programs: 27 across 6 designs
  - Auto Harmony Modes: Duet, Trio, Quartet, Manhattan, Jazz-Open
  - Ensemble Sounds: Strings, SuperNatural Brass, Guitar, Pad, Synth Strings, Choir, Jazz Scat
  - Bass Sounds: 9 (Voice, Reso, Compu, Analog, Spike)
  - Percussion: 1 vocal percussion set
  - Effects: Ambience (Hall1, Hall2, Studio)
  - LFO: Vibrato
  - Filter: Tone adjust
  - Control: MIDI In/Out
