description: Final revision of the Machinedrum, combining the UW+ sampling
  capabilities with MKII hardware improvements including a faster CPU and
  expanded memory.
details: |-
  The Machinedrum SPS-1UW+ MKII was the final revision of the Machinedrum line. It combined extremely flexible drum synthesis methods with an enhanced sampling engine, MKII hardware improvements, and an upgraded CPU with expanded memory over the standard UW MKII.

  The UW+ designation indicates additional processing power and memory capacity beyond the standard UW variant, allowing for more complex sample manipulation and pattern storage.

  All Machinedrum variants share the same final firmware, OS 1.63, released May 2016.
specs: |-
  - 5 drum synthesis methods plus enhanced User Wave sampling
  - Upgraded CPU and expanded memory over standard UW
  - RAM-based sample playback
  - Step sequencer with parameter locks
  - 6 individual audio outputs (A/B balanced, C-F unbalanced)
  - 2 audio inputs
  - Power: 6 VDC, minimum 3A (PSU-2b)
  - Final firmware: OS 1.63 (May 2016)
