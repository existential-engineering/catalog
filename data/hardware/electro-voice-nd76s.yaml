description: The ND76S is a robust, high-performance, large-diaphragm dynamic
  cardioid vocal microphone with a near-silent on/off switch, designed for
  all-around lead and backing vocal applications. The cardioid polar pattern
  delivers crisp vocal presence with superior stage isolation, while a
  shock-mounted capsule minimizes handling noise and a humbucking coil guards
  against line hum. A Memraflex grille and die-cast zinc body with black
  polyurethane finish provide road-tough durability.
details: >-
  Large-diaphragm dynamic capsule with cardioid polar pattern


  Near-silent on/off switch (the 'S' variant of the ND76)


  Shock-mounted capsule minimizes handling noise


  Humbucking coil guards against line hum from stage lighting and power
  transformers


  Memraflex grille resists denting and returns to shape after impact


  Die-cast zinc case with black polyurethane finish for road durability


  Optimized frequency response tailored for lead and backing vocals


  Passive (no phantom power required)


  3-pin male XLR output connector


  Handheld wired vocal microphone
