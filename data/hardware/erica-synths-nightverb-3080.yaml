description: Musical reverb for small spaces and massive textures.
details: |-
  Nightverb is a stereo reverb built on a unique and musical algorithm developed by 112dB, running on an Erica Synths custom DSP engine, with save and recall for every parameter. It sits in a sleek aluminium case made to match Erica Synths' line of compact desktop units.

  The design focuses on the musical side of the effect. Extremely long decay tails are possible without losing harmonic integrity, and because multiple parameters can be adjusted at once, notes can be played individually and held in chords, pitch-shifted at will, or used to build massive ambient textures.

  Twelve parameters are available for detailed reverb design, and all of them are controllable over MIDI CC. MIDI communication runs both ways, so parameters can transmit MIDI CC messages as well as receive them.

  A freeze function with chromatic tuning can be played from MIDI notes on a keyboard, and a configurable footswitch input is provided for hands-free control.

  Storage covers 30 factory presets and 70 user preset slots, with preset export over USB. The unit measures 23cm x 14.5cm x 7cm including knobs and weighs 833g.
specs: |-
  - A unique, very musical stereo reverb algorithm by 112dB
  - Erica Synths custom DSP engine
  - 12 parameters for detailed reverb design
  - All parameters are MIDI CC controllable
  - 2-way MIDI communication (parameters can also transmit MIDI CC messages)
  - Freeze function with chromatic tuning, playable via MIDI notes
  - A configurable footswitch input
  - 30 factory presets and 70 user preset slots
  - Preset export via USB
  - Save and recall for all parameters
  - Dimensions: 23cm x 14,5cm x 7cm (including knobs)
  - Weight: 833g
