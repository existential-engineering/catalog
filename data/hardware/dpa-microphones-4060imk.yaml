details: |-
  We have collected our award-winning miniature microphones in specialized kits that contain the mics and accessories you need to capture fantastic sound no matter what you need.

  Complete kit with mics and accessories: we have collected our award-winning miniature lavalier microphones in specialized kits that contain the mics and accessories you need to capture fantastic sound no matter what you need. Used with the vast array of complimentary accessories, our miniature microphones are ideal for a broad range of applications. Whether reproducing the voice or an instrument in film, theater, television or other close-miking settings, these mics will not disappoint.

  4060 Instrument Microphone Kit: this kit contains a 4060 Miniature Omnidirectional Microphone, Normal SPL with our reinforced cable relief and a XLR Adapter DAD6001-BC and a selection of our unique mounting accessories. The kit is designed to use as a close-miking solution for a wide variety of musical instruments. This mic offers a very clean, detailed and natural sound quality. This leaves it up to the user to decide on the correct placement to achieve the desired timbre. The kit is perfect for studio use or amplification for live use. There are many accessories included in the kit. It contains holders for strings, universal surface mounts with double-sided tape, a magnet mount and foam windscreens.

  4061 Instrument Microphone Kit: similar to the 4060 Instrument Microphone Kit, this kit is designed to use as a close-miking solution for a wide variety of musical instruments. The 4061 Miniature Omnidirectional Microphone, Loud SPL offers a very clean, detailed and natural sound quality. This leaves it up to the user to decide on the correct placement to achieve the desired timbre. The mic can handle 144 dB peak before clipping, allowing the microphone to be used even for snare drums, guitar/bass speaker cabinets or other high SPL sound sources. This kit is also perfect for studio use or amplification for live use. There are many accessories included in the kit. It contains holders for strings, universal surface mounts with double-sided tape, a magnet mount and foam windscreens.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB: Soft boost grid: 20 Hz - 20 kHz, 3 dB soft boost at 8 - 20 kHz. High boost grid: 20 Hz - 20 kHz, 10 dB boost at 12 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 20 mV/Pa; -34 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 23 dB(A) re. 20 µPa (max. 26 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 35 dB (max. 38 dB)
  - Distortion, THD < 0.5%: 128 dB SPL RMS, 131 dB SPL peak
  - Distortion, THD < 1%: 129 dB SPL RMS, 132 dB SPL peak
  - Dynamic range: Typ. 106 dB
  - Max. SPL, THD 10%: 134 dB SPL peak
  - Rated output impedance: 30 - 40 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001-BC XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD6001-BC: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001-BC XLR Adapter
  - Connector: MicroLock, TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - Weight: 7.5 g (0.26 oz) incl. Cable and MicroLock connector
  - Microphone diameter: 5.4 mm (0.21 in)
  - Microphone length: 12.7 mm (0.5 in)
  - Cable length: 1.8 m (5.9 ft)
  - Polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Sensitivity selection tolerance (at 1 kHz): ±1.5 dB
  - Colors: Black, Beige, Brown, White
