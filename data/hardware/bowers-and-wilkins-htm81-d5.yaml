description: The HTM81 D5 delivers the pinnacle of Bowers & Wilkins centre
  channel performance and
  can be paired with either the 801 D5 or the 802 D5 for truly powerful and
  immersive home theatre experiences.
details: |-
  Engineered with the same advanced technologies as the rest of the flagship 800 Series Diamond range, the HTM81 D5 features the Bowers & Wilkins Diamond dome tweeter, Solid Body Tweeter-on-Top, a decoupled Continuum Cone midrange drive unit and twin Aerofoil bass cones. Introduce HTM81 D5 to your home setup and experience your movies with even more depth, clarity and life. Available in Stealth Black, Warm White and Dark Walnut with an optional matching floorstand for seamless installation.

  The speaker is a 3-way vented-box system built around a 25mm (1in) Diamond dome high-frequency unit, a 150mm (6in) Continuum cone FST midrange and two 200mm (8in) Aerofoil bass drivers. Its listed technical features are the Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Matrix bracing, Aerofoil bass cones and Flowport.

  Frequency range runs from a -6dB point of 20Hz up to 35kHz, with a 28Hz to 28kHz response within +/-3dB of the reference axis and 90dB sensitivity measured on axis at 2.83Vrms at 1m. Nominal impedance is 8 ohms with a 3.0 ohm minimum, and the recommended amplifier power is 50W to 1000W into 8 ohms on unclipped programme. Harmonic distortion is quoted as below 1% from 90Hz to 20kHz and below 0.3% from 100Hz to 8kHz.

  The cabinet stands 334mm (13.2in) high including the tweeter, 846mm (33.3in) wide and 363mm (14.3in) deep including grille and terminals, and weighs 33.4kg (73.5lbs). Cabinet finishes are Stealth Black, Warm White and Dark Walnut, with black grilles on Stealth Black and Dark Walnut and grey grilles on Warm White. The matching FS-HTM floor stand is listed in Black and Titanium.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x ø25mm (1in) Diamond dome high-frequency, 1x ø150mm (6in) Continuum cone FST midrange, 2x ø200mm (8in) Aerofoil bass
  - Frequency range: -6dB 20Hz to 35kHz
  - Frequency response: 28Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), <1% 90Hz to 20kHz, <0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 334mm (13.2in) including tweeter, Width 846mm (33.3in) cabinet only, Depth 363mm (14.3in) including grille and terminals
  - Net weight: 33.4kg (73.5lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White)
  - Accessories: FS-HTM stand in Black or Titanium
