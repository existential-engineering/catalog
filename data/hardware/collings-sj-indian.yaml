description: The SJ Indian is a Small Jumbo acoustic guitar featuring a 16-inch
  lower bout and deep sides with a tight waist curve that creates a distinctive
  sound chamber. It combines the bass and volume of a large guitar with
  pronounced midrange response and treble clarity. Built with a Sitka spruce
  top, East Indian rosewood back and sides, and a pre-war scalloped X-brace.
details: |-
  The SJ Indian is the rosewood-sided variant of the Small Jumbo, offering a 16-inch lower bout that is slightly wider than a dreadnought, with deep sides and a tight waist curve that creates a very different sound chamber compared to other large-bodied acoustics. The result is a guitar with pronounced midrange character that suits players who want substantial bass and volume without sacrificing treble clarity. The top is Sitka spruce braced with a pre-war scalloped X-brace pattern, and the back and sides are East Indian rosewood. The neck is Honduran mahogany with a C-shape profile, joined to the body via a mortise and tenon hybrid joint. An ebony fingerboard with MOP Modern Diamond inlays and a 14"-26" compound radius contribute to comfortable playability.
specs: |-
  - Body Style: Small Jumbo
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: MOP Modern Diamonds
  - Fingerboard Radius: 14" - 26" compound
  - Frets: Medium 18% nickel-silver
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Bridge: Ebony modern-style, 2 3/16" spacing
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Tuners: Nickel Waverly
  - Neck Profile: C-shape
  - Neck Joint: Mortise & tenon hybrid
  - Brace Pattern: Pre-war scalloped X-brace
  - Scale Length: 25 1/2"
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Fingerboard Binding: .100" ivoroid with b/w purfling
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Rosette: Ivoroid with b/w purfling
  - Backstrip: 3-style (Chevron)
  - Pickguard: Tortoise
  - Finish: High gloss nitrocellulose lacquer
  - Body Width: 16"
  - Body Length: 20 1/8"
  - Body Depth: 4 1/2"
  - Total Length: 41"
  - Strings: D'Addario EJ-17 (.013" - .056")
