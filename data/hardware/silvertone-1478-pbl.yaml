description: An offset-body electric guitar with a mahogany body and maple top,
  a mahogany C-profile neck, and custom noiseless Silver Foil dual-coil pickups.
details: |-
  Reset the Offset

  The new 1478 PBL Pelham Blue is a stunning update to its iconic 1478 offset guitar first launched in 1964. Featuring signature contours and a bound fingerboard, this model blends timeless style with modern upgrades for enhanced playability, tone, and tuning stability, for solid, reliable performance. Re-engineered for today's guitarist, the 1478 PBL features a comfortable modern C-shape neck with a 24 ¾" scale length, replacing the original oversized profile. Custom Silvertone Silver Foil pickups—housed in mini-humbucker casings—deliver improved clarity, balance, and dynamic response. A Tune-o-matic–style bridge provides rock-solid intonation. Designed for fast playability and long sessions on stage or in the studio. Premium Construction

  Enhanced Vintage Tone

  Inspired by early DeArmond pickups, the new noiseless Silver Foils deliver chimey highs, warm mids, and articulate response—sitting between overwound single-coils and traditional humbuckers. They shine with clean tones, overdrive, and modern digital rigs. Specs

