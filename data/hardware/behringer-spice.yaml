description: SPICE is an analog semi-modular polyrhythmic synthesizer with two
  VCOs, four sub-harmonic oscillators, a multi-mode 24 dB ladder filter and dual
  4-step sequencers clocked by four polyrhythm generators. Its default routings
  play straight out of the box, while a 16 x 16 patch matrix opens the signal
  path up to other Eurorack synths and modules.
details: |-
  Add that much-needed heat in your setup and crank out mind-bending polyrhythms with the Behringer SPICE, an incredibly unique polyrhythmic synthesizer that is capable of creating incredibly complex and intricate sequences your audience will get a kick out of.

  At the heart of SPICE is its two VCOs that each come with square and sawtooth waveforms, two sub-harmonic oscillators plus a mixer section that contains level controls for the main VCO and the two sub-oscillators. Stack each of these oscillators up and you will have a nice layered pseudo-polyphonic sound. SPICE also features a 24 dB ladder filter, VCA and VCF Envelope sections for additional sculpting.

  SPICE comes with two 4-step sequencers that are clocked with the 4 polyrhythm generators. There is a lot of math that goes on behind the scenes, but all the sequencers output to the tempo control which can be set manually or via an external clock. All you need to worry about is that you can come up with some out-of-this-world polyrhythms.

  Although SPICE does not require lifting a single patch cable, its semi-modular architecture lets you easily tap into so many more dimensions of your sound by patching into your other Eurorack synths and modules.

  Complex polyrhythms plus intricate and layered sub-harmonics make SPICE a synth that sits a bit out of the ordinary.
specs: |-
  - Pure analog signal path based on authentic VCO, VCF and VCA designs
  - Dual VCOs with square and sawtooth waves
  - 4 sub-oscillators, two per VCO, with a mixer section carrying level controls for the main VCO and its two sub-oscillators
  - Stacked oscillators give 6 sound sources for 6-note pseudo-polyphony
  - Multi-mode 24 dB resonant ladder filter with Cutoff, Resonance and envelope controls
  - VCA section with Attack, Decay and Volume controls
  - VCF envelope generator with Attack, Decay and Envelope controls
  - Dual 4-step analog sequencer with polyrhythm generator
  - 4 polyrhythm generators clocking the two sequencers
  - Variable quantizers for interval setting by either temperament or intonation
  - Manual and clock-syncable tempo controls
  - Multiple clocking sources including MIDI and USB for synchronization with other equipment
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - Semi-modular design with default routings, no patching required to play
  - 16 x 16 I/O patch matrix
  - 57 controls for direct real-time access to all important parameters
