details: |-
  The Lowden 25 has long been regarded as 'the' quintessential Lowden, and while the expanded range of models today makes it hard to choose just one standout, the 25 still carries an unmatched character. Rich, full-bodied, warm, and powerful, it's a guitar that commands attention. In the 'O' version, it offers a complex, dynamic tone, while the 'F' is louder and more focused. Both versions excel at percussive strumming, flatpicking, and fingerpicking, making the 25 a versatile choice for a wide range of playing styles. It pairs East Indian Rosewood back and sides with a Red Cedar top. The Original Series carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices.
specs: |-
  - East Indian Rosewood back and sides
  - Red Cedar top
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Available in O, F, S and WL body shapes
  - Hardshell case included
