details: |-
  The Harmony Foundation Series is one for the wanderers whose inspiration travels with them, a steadfast companion to weave tales out of every path taken on the journey. The Terra Petite Dreadnought is made with a laminated spruce top and is durable and resistant to warping, while the sapele sides and back provide the guitar with tonal warmth and sustain. The lightweight okoume neck provides stability that ensures every note rings true and clear. Solid spruce X-bracing optimizes top vibration for greater sound projection and tonal depth, so your playing sounds just as great in a cozy room as it does on a stage. The Terra Petite Dreadnought comes strung with D'Addario EXP16 coated strings for lasting bright tones. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
