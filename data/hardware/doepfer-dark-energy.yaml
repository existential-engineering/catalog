description: >-
  The Dark Energy is a compact monophonic analog desktop synthesizer from Doepfer
  Musikelektronik, based on their A-111-5 modular synthesizer voice. It features a single
  VCO, two audio-rate LFOs, a resonant filter, and extensive CV/Gate patch points for
  integration with modular systems.
details: |-
  The Dark Energy emerged from Doepfer's expertise in modular synthesis, translating their A-111-5 synthesizer voice into a rugged, fully-enclosed metal housing with a distinctive black casing and wooden end panels. Launched in 2009, this desktop unit brought modular synthesis concepts to musicians seeking a compact, self-contained instrument without sacrificing sonic depth.

  The original Dark Energy I features a single VCO producing square/pulse, triangle, or sawtooth waveforms, with extensive routing options allowing creative combinations. Two LFOs capable of reaching audio-rate frequencies enable complex frequency modulation and tonal manipulation. The 24 dB/octave Curtis filter with VCO tracking and self-oscillation capability adds versatility, while the single ADSR envelope provides flexible amplitude and modulation shaping.

  In 2012, Doepfer released the Dark Energy II following discontinuation of the Curtis chip. This redesigned version replaces the triangle waveform with inverse sawtooth and introduces a 12 dB/octave multimode filter offering lowpass, notch, highpass, and bandpass configurations. The filter characteristics and VCA modifications produce a more punchy and tighter sound compared to the original.

  Both versions feature MIDI control via DIN and USB along with extensive CV/Gate patch points on front and rear panels, establishing the Dark Energy as a gateway into the world of modular synthesis.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Waveforms (Dark Energy I): Sawtooth, triangle, square/pulse with PWM
  - Waveforms (Dark Energy II): Sawtooth, inverse sawtooth, square/pulse with PWM
  - LFOs: 2 with triangle/square waveforms, audio-rate capable
  - Filter (Dark Energy I): 24 dB/octave lowpass with VCO tracking
  - Filter (Dark Energy II): 12 dB/octave multimode (lowpass, notch, highpass, bandpass)
  - Envelope: 1 ADSR with range switch
  - VCA: 1 with modulation options
  - Control Inputs: MIDI (DIN and USB), 1V/octave CV/Gate
  - Patch Points: Front and rear panel CV/audio inputs and outputs
  - Arpeggiator: Six-note memory with directional options
  - Weight: 1.2 kg (2.6 lbs)
  - Memory: None
  - Effects: None
releaseDate: "2009"
