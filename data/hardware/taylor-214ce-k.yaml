details: |-
  The 214ce-K is part of Taylor's 200 Series and features layered Hawaiian koa back and sides paired with a solid torrefied spruce top. Torrefaction replicates the tonal characteristics of aged tonewoods, resulting in enhanced warmth, resonance, and projection from the first day of playing.

  Taylor's C-Class bracing system boosts dynamic response — delivering more volume, longer sustain, and improved low-end power. The Grand Auditorium body balances comfort, playability, and tonal range across fingerpicking and strumming styles.

  Onboard Expression System 2 electronics use a behind-the-saddle pickup design to capture the guitar's natural acoustic voice. The guitar ships with a structured gig bag and D'Addario XS Coated Phosphor Bronze Light strings.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Torrefied Spruce (solid)
  - Back/sides: Hawaiian Koa (layered)
  - Bracing: C-Class
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-11/16"
  - Tuners: Die-cast Chrome
  - Electronics: Expression System 2 (ES2)
  - Finish: Matte
  - Body binding: White
  - Pickguard: Tortoise
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Gig bag included
