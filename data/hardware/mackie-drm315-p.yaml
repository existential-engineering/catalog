name: DRM315-P
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/drm-passive-series/DRM315_P.html
prices:
  - amount: 1099.99
    currency: USD
description: The Mackie DRM315-P is a three-way passive loudspeaker with a 15"
  woofer that provides up to 2000W of power handling.
details: |-
  Thrill audiences and fill clubs, theatres and houses of worship with Mackie sound when you upgrade to DRM315-P passive 3-way speakers. The DRM315-P features heavy duty custom transducers and a precision crossover for output and clarity.

  DRM Series Professional Passive Loudspeakers deliver high-performance sound with the rugged construction and reliability that professional production and install customers demand.

  Custom transducers housed in coated touring-grade plywood cabinets are designed for consistent performance in the most demanding applications.

  Equipped with M10 flypoints, dual angle pole mounts, and available line array configurations, the DRM Series suits clubs, houses of worship and rental systems.
specs: |-
  - 15 in 3-way professional passive loudspeaker
  - Power handling 500W continuous / 1000W program / 2000W peak (1000 watts RMS, 2000 watts peak)
  - Max SPL 136 dB peak
  - Frequency range 45 Hz - 20 kHz (-10 dB), 65 Hz - 18 kHz (-3 dB)
  - Coverage 90 degrees horizontal x 60 degrees vertical, rotatable waveguide
  - Crossover frequencies 900 Hz (LF/MF) and 2.5 kHz (MF/HF)
  - 15 in / 381 mm ferrite woofer, 6.5 in / 165 mm midrange, 1.4 in / 36 mm titanium dome compression driver
  - Nominal impedance 4 Ohm
  - 1x female speakON input, 1x female speakON thru (parallel)
  - 15 mm plywood enclosure with black polyurea finish, powder-coated 16-18 gauge steel grille
  - Vertical trapezoidal cabinet, pole-mountable, 12x M10 flypoints for vertical and horizontal orientation
  - Dimensions 36.5 x 18.8 x 19.0 in / 927 x 478 x 485 mm (H x W x D)
  - Weight 67.5 lb / 30.6 kg
