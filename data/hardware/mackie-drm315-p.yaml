description: The Mackie DRM315-P is a three-way passive loudspeaker with a 15"
  woofer that provides up to 2000W of power handling.
details: |-
  Thrill audiences and fill clubs, theaters, and houses of worship with punchy and powerful Mackie sound when you upgrade to DRM315-P passive 3-way speakers. The DRM315-P features heavy duty custom transducers and a precision crossover for incredible output and clarity. Gig after gig, venues, touring bands and mobile DJs count on the Mackie DRM315-P for consistent performance and unbeatable sound quality.

  The Mackie DRM315-P passive 3-way speaker is a professional solution for bands and venues who want powerful, accurate sound, and a road-ready design.
specs: |-
  - High-performance professional loudspeaker designed for high-demand applications
  - Custom designed transducers
  - 1.4" Titanium diaphragm compression driver offer maximum transparency and clarity
  - 6.5" Midrange transducer provides incredible midrange clarity for punchy vocal and instrument reproduction
  - 15" High-excursion woofer offers minimal distortion with increased bass response and reliability to withstand the most demanding live applications
  - Rotatable waveguide assembly allows for horizontal orientation while maintaining maximum coverage
  - Precision internal 3-way crossover
  - Premium grade components and precise tuning provide maximum clarity and performance
  - Parallel SpeakON inputs
  - Road-worthy 15mm plywood construction and internal bracing offers optimal acoustic performance
  - Touring-grade textured cabinet coating
  - Powder-coated heavy gauge steel grille
  - Pole-mountable
  - Flyable - 12xM10 flypoints for vertical and horizontal orientation
  - Optional SP260 Loudspeaker Processor provides custom EQ curves and crossovers for your DRM Passive System
  - Power handling (continuous/program/peak): 500W / 1000W / 2000W
  - 67.5 lb / 30.6 kg
