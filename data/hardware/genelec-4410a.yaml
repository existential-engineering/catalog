description: "When space is tight, the 4410A delivers the single cable networked
  convenience of Smart IP in a powerful, super-compact format."
details: |-
  The Genelec 4410A is a Smart IP networked installation loudspeaker engineered for fixed AV applications where space is tight but high-quality, intelligible sound is essential. It receives both audio and power over a single Ethernet cable, dramatically simplifying cabling and infrastructure for corporate, education, hospitality, public-space, and small music-venue installations.

  Acoustically, the 4410A pairs a 76 mm bass cone driver with a 19 mm metal-dome tweeter mounted in a Directivity Control Waveguide (DCW), driven by two 18 W Class D amplifiers (bass and treble). The result is a frequency response of 67 Hz to 40 kHz (-6 dB) with ±2.5 dB accuracy from 74 Hz to 20 kHz, short-term maximum SPL of ≥96 dB, and peak output of ≥100 dB at 1 m - more than enough headroom for distributed audio in compact spaces.

  Connectivity is handled by a single RJ45 port that simultaneously carries Dante and AES67 audio over IP and receives Power over Ethernet. The speaker supports both PoE+ (IEEE 802.3at, 30 W recommended for full output) and standard PoE (IEEE 802.3af, 15 W) for lower-output deployments, eliminating the need for separate power cabling and dedicated amplifier racks.

  Configuration and management are handled through Genelec's Smart IP Manager software, which provides device discovery, room EQ, level and delay alignment, and zone management across unlimited rooms and channels. End-user control over zones, volume, mute, and power is delivered via the Smart IP Controller mobile/tablet app, and a documented API allows full integration with third-party building and AV automation systems.

  Practical features round out the package: Intelligent Signal Sensing (ISS) drops idle consumption to ≤3 W when no audio is present, the Minimum Diffraction Enclosure (MDE) and reflex port design preserve imaging and low-frequency response in a 181 × 121 × 115 mm enclosure weighing just 1.5 kg, and the speaker ships in white or black with 120 custom RAL colors and a RAW unpainted variant available for bespoke finishes. Like all Genelec products, the 4410A is manufactured in Iisalmi, Finland using sustainable methods.
specs: |-
  - Frequency Response: 67 Hz - 40 kHz (-6 dB)
  - Frequency Response Accuracy: ± 2.5 dB (74 Hz - 20 kHz)
  - Short Term Max Spl: ≥96 dB
  - Peak Spl: ≥100 dB
  - Long Term Max Spl: ≥91 dB
  - Self Generated Noise: ≤5 dB (A-weighted)
  - Harmonic Distortion: 70-200 Hz ≤3%; >200 Hz ≤0.5%
  - Bass Amplifier: 18 W Class D
  - Treble Amplifier: 18 W Class D
  - Bass Driver: 76 mm cone
  - Treble Driver: 19 mm metal dome
  - Height: 181 mm
  - Width: 121 mm
  - Depth: 115 mm
  - Weight: 1.5 kg (3.3 lb)
  - Network Input: 1 × RJ45 AES67/Dante (Power over Ethernet + Audio over IP)
  - Poe Support: PoE+ IEEE 802.3at (30 W recommended); PoE IEEE 802.3af (15 W)
  - Idle Power Consumption: ≤4 W
  - Full Output Power Consumption: 30 W
  - Iss Active Power Consumption: ≤3 W
  - Technologies: Smart IP, Dante, AES67, DCW, ISS, MDE, Reflex Port, Class D Amplifiers, Protection Circuitry
