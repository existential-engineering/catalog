description: The H2essential is the only Handy Recorder with 3 internal mics.
  Select different mic patterns for more options than ever before.
details: |-
  The H2essential is the only Handy Recorder with three internal microphones. With the ability to select different mic patterns, it gives creators more options than ever before. With two cardioid mics facing front and rear and a bi-directional mic facing side to side, the H2essential allows you to choose the perfect pick-up pattern for every recording.

  Set the pickup pattern to 90 or 120 degree stereo, or choose mono for a hyper directional pickup, reducing background noise. Then choose to record from the front, the rear, or select both sides for surround sound pickup. Record in 32-bit float up to 96kHz ensuring high-quality audio without ever having to set gain.

  When connected to a PC, Mac, iOS, or Android device using the USB-C port, the H2essential can be used as a USB microphone while simultaneously recording to the SD card. Connect the H2essential to a mobile device via USB and record professional audio directly onto the phone's video, suited to video podcasts and live streams.

  Advanced features include a low cut filter, pre-record, auto record, and playback speed adjustment, a built-in mixer for per-track levels, a 1.3 inch color LCD with real-time waveform display, an onboard speaker for quick reference, and a dedicated Marker button. The 3.5mm input can accommodate lav mics, audio players, keyboards and more, and can record alongside the front mic. A firmware update adds AI Noise Reduction, gain adjustment during recording, MP3 recording, and MS Raw recording for adjusting stereo width in post production.

  With the ZOOM Handy Control & Sync app for iOS and Android, multiple Zoom recorders can be managed remotely, with start/stop control and timecode synchronization, which requires the BTA-1 Bluetooth Adapter. The TCA-1 Timecode Adapter generates and outputs timecode or jams to an external clock, staying within 0.5 frames over 24 hours thanks to its temperature-compensated crystal oscillator. The H2essential is also designed with Accessibility for the blind and visually impaired, with audible menu descriptions in English, Spanish, French, Japanese, German, Italian or Chinese.
specs: |-
  - MID mic (FRONT/REAR): unidirectional, sensitivity -37 dB/Pa at 1 kHz, maximum sound pressure input 120 dB SPL
  - SIDE mic: bidirectional, sensitivity -39 dB/Pa at 1 kHz, maximum sound pressure 122 dB SPL
  - MIC/LINE IN jack: stereo mini jack, input impedance 2 kohm, maximum input level -7 dBu, plug-in power 3.3 V
  - PHONE/LINE OUT jack: stereo mini jack, maximum output level 20 mW + 20 mW into 32 ohm load, output impedance 10 ohm or less
  - Built-in speaker: 20 mm x 30 mm elliptical dynamic speaker, effective maximum output 250 mW
  - Recording format: WAV 44.1, 48 or 96 kHz / 32-bit float, stereo or mono, BWF and iXML supported
  - Pickup pattern selection: 120 degree, 90 degree and MONO. Mid-Side stereo pickup from the front and rear
  - Recording media: microSDHC and microSDXC memory cards up to 2 TB
  - Display: 1.3 inch full-color LCD, 240 x 240
  - USB: USB Type-C connector, audio interface USB 2.0 High Speed, 4 in / 2 out (Multi) or 2 in / 2 out (Stereo)
  - USB sampling frequencies: 44.1/48/96 kHz (audio interface only), 44.1/48 kHz (audio interface plus onboard recording). Bit depths 24-bit and 32-bit float
  - Power: 2 AA batteries (alkaline, lithium or rechargeable NiMH), USB bus power, USB mobile battery, or ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Estimated continuous battery operation (FRONT stereo recording): about 11 hours (alkaline), about 9 hours (NiMH 1900 mAh), about 20.5 hours (lithium)
  - Remote control from the ZOOM Handy Control & Sync app via the BTA-1 Bluetooth adapter on the REMOTE connector
  - Low-cut filter, pre-record, auto record and playback speed adjustment
