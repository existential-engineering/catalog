description: >-
  The Korg RK-100S is a modern keytar synthesizer that revives the classic 1984 RK-100
  design with a contemporary sound engine shared with the MicroKorg XL. It features a
  37-note velocity-sensitive slim-key keyboard, two ribbon controllers, 200 user-writable
  sounds, and 17 master effects, all housed in a durable wooden body built for stage
  performance.
details: |-
  Back in 1984, Korg introduced the original RK-100 keytar to free keyboardists from their static stage rigs. Three decades later, the RK-100S revives that concept with modern features and a proven sound engine borrowed from the MicroKorg XL, enabling full patch compatibility between the two instruments.

    The RK-100S is built around a 37-note slim-key velocity-sensitive keyboard without aftertouch. Two ribbon controllers, positioned on the neck and below the keyboard, provide expressive performance control. Eight illuminated buttons on the right side offer instant access to favorite patches, while additional illuminated buttons on the left side and octave-shifting buttons on the neck round out the hands-on controls. An LED display and up/down lever allow quick program navigation during live sets.

    The synthesizer section features dual oscillators with a wide range of waveforms including saw, pulse, triangle, sine, formant, noise, PCM/DWGS, and audio input. A dual-filter architecture supports low-pass, high-pass, and band-pass configurations. Deep parameter editing is available through dedicated PC/Mac software, while the onboard step arpeggiator offers multiple modes for real-time pattern generation.

    The wooden body construction gives the RK-100S a sturdier feel compared to all-plastic alternatives, though it adds some weight. Audio output with volume control is accessible on the front panel, with MIDI Out and USB connections on the right side.
specs: |-
  - Polyphony: 8 voices maximum (4 voices with vocoder)
    - Multitimbral: 2 parts maximum (Layer, Split, or Multi modes)
    - Oscillators: 2
    - Waveforms: Saw, Pulse, Triangle, Sine, Formant, Noise, PCM/DWGS, Audio In
    - Filters: Dual-filter architecture (LPF, HPF, BPF)
    - Synthesis Modes: Waveform, Cross, Unison, VPM
    - Keyboard: 37 slim keys, velocity sensitive, no aftertouch
    - Effects: 17 master effect algorithms
    - Preset Memory: 200 user-writable sounds
    - Arpeggiator: UP, DOWN, ALT1/2, Random, Step Arpeggiator
    - Controllers: 2 ribbon controllers, octave shift buttons, LED display
    - Connections: MIDI Out, USB, audio output with volume control
