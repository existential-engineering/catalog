description: AXYS is two stereo crossfaders in 6HP for Eurorack. Each crossfader
  has stereo inputs with normalling for mono-to-stereo use and independent CV
  control, useful for switching between stereo sources or mixing effects paths.
details: |-
  Pronounced "axis", AXYS is two Stereo Crossfaders in 6hp. Stereo patching is becoming more common each day in the Eurorack Modular Synth System and we here at the shop are performing out a ton. Over the past couple years we consistently felt the need for a simple crossfader module that would allow users to switch between two stereo sources, add a stereo effect path, or easily mix a mono source with a stereo one. AXYS was born from this need. Each crossfader features stereo inputs with normalling for mono to stereo uses as well as independent CV control. Control both crossfaders with one CV easily and decide how the Y will react to X's CV. Easily transition between two performers similar to a DJ transitioning between decks with one channel and add some master buss effects with the other. Use one channel for adding stereo effects and the other to dial up some nice parallel compression. Perfect for live performance and momentary effect blasts. A simple easy to use module with tons of uses. All analogue signal path keeps your tone intact and sounding the way you intended it to.
