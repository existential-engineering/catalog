details: |-
  XCV

  (Syncable Expression & CV Distribution Device)

  Unlock hands-free control of your pedals and modular gear with the XCV—a dual-channel modulation distributor designed to keep your setup perfectly in sync. Each channel offers two simultaneous outputs (2 Expression + 2 CV), delivering a total of four outputs. Select from 16 rhythm pattern presets for each channel, and synchronize everything using tap tempo or an external clock. Whether you're working with effects pedals, Eurorack modules, or desktop synthesizers, the XCV can transmit scalable rhythmic modulation to up to four devices. It offers four waveforms with four timing resolutions, resulting in sixteen presets. Combining these straightforward presets with two channels generates intriguing and surprisingly complex patterns! Sync with a gate or trigger input, or use tap tempo to bring your gear to life—no foot movement is required. The XCV provides a powerful, streamlined way to harness expression and CV control, enabling you to shape sound with precision and rhythm. Each channel's modulation depth can be adjusted independently, and a dedicated footswitch provides instant bypass. Housed in a compact 125B enclosure, the XCV easily fits on your pedalboard or desktop setup. The XCV is an indispensable tool that will help you expand your existing gear! Frequently Asked Questions

  What kind of cables do I need for the expression output? To ensure proper operation, use TRS cables for the expression output. Standard guitar cables will not work. Do you include cables with the XCV? Yes. You can purchase the XCV with or without two 2-foot TRS cables. If you're unsure what cables you need, we recommend selecting the option that includes them. What power supply does the XCV require? The XCV operates on a standard Boss-style 9V DC power supply (not included). Designed and assembled in Seattle, Washington. Operates on a standard 9Vdc Boss-style power supply (not included). XCV manual

  WATCH THE DEMO:

  Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
