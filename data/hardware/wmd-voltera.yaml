description: Voltera is a voltage expander for Metron that adds four bipolar CV
  tracks in 4HP, allowing quantized or unquantized voltage sequencing programmed
  directly from Metron's button matrix. It supports stepped voltage recording
  and random voltage generation, and is stackable for up to 64 lanes of CV
  sequencing.
details: |-
  Voltera is the voltage expander for Metron, adding four bipolar CV tracks in 4HP — and turning your trigger sequencer into the complete performance brain of your live rig. We designed Voltera to disappear into Metron's workflow. There's no second interface to learn and no second module to babysit on stage: Voltera's tracks are programmed and played from Metron's button matrix with the same fast, tactile immediacy as your drum patterns. Analog-style programming, digital accuracy. Each track has its own independent voltage range and quantize setting, so you can dial every lane to the parameter it's driving — one track playing a quantized bassline, the next sweeping a filter with unquantized voltage, all edited in real time while the sequence runs. Stepped voltage recording lets you capture moves as you make them, and random voltage generation keeps things evolving when you want surprises. Voltera is stackable: up to 16 on a single Metron for 64 lanes of CV sequencing from one performance surface. Start with melodies and modulation on four outputs, and grow into sequencing an entire system without ever leaving the interface you already know. You must update your Metron's firmware for use with Voltera — get the update on the Metron page . Voltera quickstart PDF

  Metron Manual for use instructions

  Accessible Music Guide
