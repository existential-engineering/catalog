description: A limited-edition 4 x 10" bass cabinet built to match the 20th
  Anniversary ABM 600 EVO-IV head, finished in custom black diamond check vinyl.
  Loaded with Celestion speakers and an HF horn like the original 1997 ABM
  cabinets, it is hand made in England with birch plywood construction, metal
  corners, a steel grille, recessed steel handles, casters and a grab handle.
details: |-
  Limited-edition 20th Anniversary 4 x 10" bass cabinet designed to match the 20th Anniversary ABM 600 EVO-IV head. Custom black diamond check vinyl covering styled after a luxury motorcar interior, with a kick-plate to protect the covering. Loaded with Celestion speakers and an HF horn as in the original 1997 ABM cabinets. Hand made in England; the anniversary run was limited to the end of 2017, each unit tested with a hand-signed label by Ashdown founder Mark Gooday.
specs: |-
  - Power output: 800W
  - Power handling: 650 watts at 8 Ohms
  - Speaker configuration: 4 x 10" Celestion with HF horn
  - Impedance: 4 Ohms
  - High-grade birch plywood construction
  - Metal corners and steel grille
  - Recessed steel handles (sides and top)
  - Front ported
  - Horn tweeter for high-end brightness
  - Two casters, kick-back plate and grab handle
  - Two Neutrik Speakon/Jack inputs
  - H x W x D: 660 x 610 x 420 mm
  - 20th Anniversary black diamond check vinyl covering
