description: Versatile 100W all-valve guitar amplifier head, hand-assembled in
  the UK. The JVM410H delivers four channels (Clean, Crunch, OD1, OD2), each
  with three switchable gain modes (green/orange/red) for 12 distinct voices
  ranging from pristine cleans to high-gain distortion. Three-band EQ per
  channel, presence and resonance, studio-quality digital reverb (per channel),
  two FX loops (one series-parallel, one series), MIDI for channel/mode storage
  and recall, and an emulated XLR line out for silent recording.
details: |-
  - Four channels with dedicated volume controls
  - Three modes per channel (12 total voicings)
  - All-valve signal path
  - Three-way EQ in each channel
  - Digital reverb (per channel)
  - Two FX loops (1 series/parallel, 1 series)
  - MIDI In and Thru for channel/mode recall
  - Silent recording mode via emulated XLR line out
  - Switchable master volume (per channel)
  - Hand-assembled in Marshall's UK factory
specs: |-
  - Model: JVM410H
  - Range: JVM
  - Output Wattage: 100W
  - Channels: 4 (Multi)
  - Channel Modes: 3 modes per channel (green/orange/red) = 12 total voicings
  - Technology: All-valve
  - Preamp Valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 4 x EL34
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects Loop: 2, 1 x series parallel, 1 x series
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Product Height: 310 mm / 12.2"
  - Product Width: 740 mm / 29.1"
  - Product Depth: 215 mm / 8.5"
  - Weight: 22 kg / 49 lb
  - Box Contents: PEDL-91016 footswitch included, detachable power cable included, speaker cable included
  - Country Of Origin: Hand-assembled in UK
