description: Versatile 100W all-valve guitar amplifier head, hand-assembled in the UK. The JVM410H delivers four channels (Clean, Crunch, OD1, OD2), each with three switchable gain modes (green/orange/red) for 12 distinct voices ranging from pristine cleans to high-gain distortion. Three-band EQ per channel, presence and resonance, studio-quality digital reverb (per channel), two FX loops (one series-parallel, one series), MIDI for channel/mode storage and recall, and an emulated XLR line out for silent recording.
details: |-
  With three modes available on each of the four channels, this amp can create 12 individual sounds from pristine cleans all the way through to heavy distortion. The JVM410 Head also features two master volume controls, making it the ultimate all-in-one for professional players.

  Taking over the front of the stage and creating explosive solo moments, you can do all of this and more thanks to the JVM410 Head having one master volume for each channel.

  When it comes to effects, the JVM410 Head is no joke. Featuring two effects loops, you can connect a host of effects pedals and other external gear. This feature gives you the power to organise and control the placement of your effects in the signal chain, leading to a greater variety of tones.

  The JVM410 Head is equipped with recording capabilities and a standby function designed specifically for silent recording. Simply connect your amplifier to a recording device through the line out, making sure to keep the standby switch in the off position.

  Each amplifier in this series is attentively hand-assembled at our UK factory, from loading the circuit boards to achieving the iconic black, white and gold finish. Designed and engineered in UK. Made in UK.
specs: |-
  - Built in our UK factory
  - All-valve
  - Four channels with dedicated volume controls
  - Silent recording mode
  - Store your settings
  - Two FX loops
  - Digital reverb
  - Model: JVM410 Head
  - Range: JVM
  - Channels: 4 (Multi)
  - Technology: Valve
  - Output wattage: 100W
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 4 x EL34
  - Weight: 22 kg / 49 lb
  - Width: 740 mm / 29.1"
  - Height: 310 mm / 12.2"
  - Depth: 215 mm / 8.5"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-91016 footswitch included, detachable power cable included, speaker cable included
