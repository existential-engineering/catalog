description: A utility module that converts gate signals into triggers and
  trigger signals into gates, with LED indicators for input and output states.
details: |-
  Take your gates and generate triggers and take your triggers and generate a gate. Gate to Trigger section
  Takes a gate signal and give a trigger output on both the rise and fall of that gate. The IN LED will illuminate while the gate input is high. Trigger to Gate section
  Takes a trig signal to start a gate signal and is normalized from the fall output in the Gate to Trig section. The gate length knob controls the gate length. The fall output will generate a trigger at the end of the gate. The OUT LED will illuminate while the gate output is high.
