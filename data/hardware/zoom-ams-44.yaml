description: The AMS-44 is a 4-in, 4-out USB audio interface with four XLR/TRS
  combo inputs and Zoom's high-performance, low-noise preamps, plus two
  headphone outputs and two TRS outputs for external monitors.
details: |-
  AMS Audio Interfaces are designed for musicians who want to record music with a DAW or livestream on platforms like YouTube and Twitch without the typical complications. The AMS-44 is the four-input model in the line, with four XLR/TRS combo inputs feeding Zoom's high-performance, low-noise preamps, two headphone outputs and two TRS outputs for external monitors.

  A Music / Streaming switch moves the unit between the two jobs in hardware. In Music mode each input acts independently with its own gain control and expanded routing, and separate mixes are sent to each headphone output. In Streaming mode all inputs are combined into a single signal so that streaming software receives one feed with no additional setup.

  Five more hardware switches cover the rest of the common cases. The Direct Monitor switch sends the input signal straight to the headphones while the same signal is routed to the DAW or streaming software. The Loopback switch combines the input audio with playback from the computer and routes it to the streaming software, for adding background music to a stream or singing over an instrumental track. A MIC/LINE to GUITAR switch sets input 1 to guitar level (Hi-Z), Stereo Link pairs two inputs for stereo recording under one gain knob, and a Phantom Power switch supplies 48 V for condenser microphones.

  The AMS-44 records and plays back four channels at up to 96 kHz and 24-bit over USB 2.0 as a USB Audio Class 2.0 device. It runs on USB bus power from a PC or Mac over USB-C, on two AA batteries, or on the Zoom AD-17 AC adapter when working from a tablet or phone. Alkaline batteries give about 3 hours, NiMH about 4.5 hours and lithium about 8.5 hours.

  The interface works with Mac and PC as well as iOS and Android devices, and is designed to fit the software and platforms musicians already use: streaming to YouTube, Facebook, Twitch, Instagram and Patreon in Streaming mode, and recording with Adobe Audition, Pro Tools, Cubase and GarageBand in Music mode. The box contains the AMS-44 USB Audio Interface, a USB-C cable and a Quick Tour.
specs: |-
  - Input channels: 4 mono MIC/LINE
  - Output channels: 1 stereo TRS, 2 stereo PHONES
  - INPUT 1-4: XLR/TRS combo jacks (XLR 2 hot, TRS tip hot)
  - Input gain: -infinity to +58 dB, or -infinity to +50 dB when set to GUITAR
  - Input impedance: XLR 2.7 kohms, TRS 18 kohms or 330 kohms when set to GUITAR
  - Maximum input level: XLR +6 dBu, TRS +22 dBu or +8.5 dBu when set to GUITAR
  - Phantom power: +48 V
  - OUTPUT A (standard phone jacks): TRS phone jacks (impedance balanced), maximum output level +10 dBu at 0 dBFS, output impedance 100 ohms
  - OUTPUT A-B (headphone jacks): 3.5 mm stereo mini jacks, 30 mW + 30 mW into a 32 ohm load, output impedance 10 ohms
  - USB: USB Type-C for the audio interface function (requires a cable that supports data transfer), USB bus power supported, plus a USB Type-C DC 5 V power supply input
  - Frequency response: 44.1 kHz plus or minus 1 dB (20 Hz to 20 kHz), 96 kHz plus or minus 1.5 dB (20 Hz to 40 kHz)
  - Equivalent input noise: -120 dBu or less (IHF-A) at +58 dB into 150 ohms
  - Audio interface: 4 channels recording, 4 channels playback
  - Sampling frequencies: 44.1, 48, 88.2 and 96 kHz
  - Bit depth: 24-bit
  - Interface: USB 2.0, USB Audio Class 2.0
  - Power: 2 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 AC adapter (DC 5 V/1 A), USB bus power supported
  - Rated current: 350 mA on USB or AC adapter at 5 V, 560 mA on batteries at 2.4 V
  - Estimated continuous battery operation at 44.1 kHz with phantom power off and a 32 ohm headphone load: about 3 hours on alkalines, about 4.5 hours on 1900 mAh NiMH, about 8.5 hours on lithium
  - Power consumption: 5 W maximum
  - Dimensions: 129.0 mm (W) x 74.0 mm (D) x 46.0 mm (H)
  - Weight: 177 g unit only, 223 g including batteries
  - Hardware Music / Streaming switch, Direct Monitor switch, Loopback switch, MIC/LINE to GUITAR switch on input 1, Stereo Link and Phantom Power switches
  - System requirements, Windows: Windows 10 or 11 (64-bit), Intel Core i3 or faster or AMD Ryzen 3 or faster with Zen architecture, USB 3.0 or 2.0
  - System requirements, Mac: Mac OS X 10.14.6 to macOS 26, Intel Core i3 or faster or Apple M1, USB 3.0 or 2.0
  - System requirements, iPhone and iPad: iOS/iPadOS 13.7 to 26, Apple Lightning-to-USB Camera Adapter required
  - System requirements, Android: Android OS 9 to 11, matching USB cables and adapters necessary
