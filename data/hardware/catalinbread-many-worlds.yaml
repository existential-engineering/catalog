description: The Many Worlds is an eight-stage phaser with eight selectable
  phase control parameters, six LFOs, and two envelope-dependent phase shift
  modes. It combines classic swirly and vibe-esque phaser tones with
  experimental sound design capabilities through intermodulating dual sine wave
  LFOs and autowah-style envelope-dependent phase shifting.
details: |-
  The Many Worlds Phaser is named after Hugh Everett's Many Worlds quantum mechanics interpretation, reflecting the pedal's parallel universe of sonic possibilities.

  The pedal features eight selectable phase control parameters across six distinct LFO shapes including sine, square, and reverse sawtooth. Two independently controlled intermodulating sine wave LFOs create complex evolving modulation textures unavailable in conventional phasers.

  Two envelope-dependent phase shift modes (up and down) respond dynamically to playing dynamics, producing autowah-style effects and manually controlled phase shifting. The FDBK control governs internal feedback intensity for everything from subtle filtering to extreme resonant effects.

  Power supply requires 9-18V DC center-negative at minimum 100mA. No battery operation is supported. Higher voltages provide increased output level and headroom.
specs: |-
  - Power source: 9-18V DC power supply, center-negative, at least 100mA
  - Does not run on batteries
  - Controls: Freq/Attack, Mix, Depth/Freq2/Sens, FDBK, LFO selector
  - Eight-stage phaser with eight selectable phase control parameters
  - Six LFOs, including two independently controlled intermodulating sine waves
  - Two envelope-dependent phase shift modes, up and down
