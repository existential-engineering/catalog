details: |-
  The UK-ABM-810H-EVO IV is a top-tier 8x10" bass cabinet built to dominate the largest venues and stages. Eight 10" CIARE ceramic magnet speakers arranged vertically push an incredible 2000W AES at 4 Ohms, with 105dB sensitivity for maximum sonic projection and amplifier efficiency, so every note cuts through with thunderous depth and commanding presence. The vertical driver alignment enhances dispersion and stage monitoring, a 415mm cabinet depth improves airflow and tone balance, and Neutrik SpeakOn connections plus durable construction make it road-ready for ABM and Rootmaster rigs.
specs: |-
  - Power handling: 2000W AES
  - Speakers: 8 x 10" CIARE ceramic drivers (vertical alignment)
  - Impedance: 4 Ohms
  - Sensitivity @ 1m (2.83v): 105 dB
  - Magnet type: ceramic
  - Connectors: Neutrik SpeakOn
  - Width: 609 mm
  - Height: 1150 mm
  - Depth: 415 mm
  - Weight: 59 kg
  - Suitable amplifiers: ABM range, Rootmaster range
  - Made in the UK, built to order
