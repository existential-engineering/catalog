description: The K22ce 12-Fret is a Grand Concert acoustic-electric guitar built
  entirely from solid Hawaiian koa with a 12th-fret neck joint, Venetian
  cutaway, and Taylor's Expression System 2 electronics, offering enhanced
  midrange warmth with V-Class bracing.
details: |-
  The K22ce 12-Fret is Taylor's Grand Concert body built entirely from solid Hawaiian koa — top, back, and sides — with a dark edgeburst finish and Rock Maple body binding. The 12-fret neck configuration places the neck joint at the 12th fret, shifting the bridge toward the lower bout center and producing enhanced midrange warmth and a more relaxed playing feel.

  The 24-7/8" scale length reduces string tension compared to a standard long-scale guitar, complementing the intimate character of the 12-fret setup. Taylor's V-Class bracing delivers improved intonation and sustain with increased note separation.

  The Venetian cutaway provides full access to the upper frets, and the Expression System 2 (ES2) behind-the-saddle pickup captures the natural acoustic voice for live performance and recording.

  Finishing details include a West African Crelicam Ebony fretboard and bridge with Spring Vine inlay, Tropical Mahogany neck, and Gotoh tuners. Ships with a deluxe hardshell case.
specs: |-
  - - Body Shape: Grand Concert
  - Cutaway: Venetian
  - Neck Join: 12th Fret
  - Top: Solid Hawaiian Koa (gloss, dark edgeburst)
  - Back & Sides: Solid Hawaiian Koa (gloss)
  - Bracing: V-Class
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Fretboard Inlay: Spring Vine
  - Bridge: West African Crelicam Ebony
  - Scale Length: 24-7/8"
  - Body Binding: Rock Maple
  - Tuners: Gotoh
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Deluxe hardshell case included
