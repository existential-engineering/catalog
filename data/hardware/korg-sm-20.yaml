description: >-
  The Korg SM-20 is a compact electronic rhythm machine from 1979 offering 20
  preset patterns with 15 drum sounds and a built-in 25-watt speaker. Designed
  primarily as a teaching and practice tool, it features an electronic
  conductor, metronome functionality, and an instrument input jack for playing
  along without an external amplifier.
details: |-
  The SM-20 occupies a niche between a traditional drum machine and a practice tool. Its 15 electronic drum voices cover the essentials including kick, snare, rim shot, cowbell, hi-hats, cymbals, congas, tambourine, guiro, and quijada, spread across 20 preset rhythm patterns. While it lacks user-programmable patterns, the built-in selection covers a range of common styles.

  A built-in 25-watt speaker with an instrument input jack sets the SM-20 apart from most rhythm machines of its era. Musicians could plug in a guitar or other instrument and play along with the drum patterns without needing an external amplifier, making it a self-contained practice station.

  The electronic conductor and metronome functions reinforce the SM-20's educational orientation. Individual volume controls for the quijada, guiro, and tambourine voices allow some customization of the rhythm balance, and a tempo control adjusts the speed of all patterns.

  As a late 1970s rhythm device, the SM-20 represents an era when electronic drum machines were transitioning from novelty items to practical musical tools. Its compact form factor and built-in amplification made it accessible to musicians who wanted electronic rhythms without a complex setup.
