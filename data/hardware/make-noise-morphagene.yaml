details: |-
  Morphagene is a next generation tape and microsound music machine that
  explores granular synthesis through the manipulation of audio recordings
  (called reels) stored on micro SD card, as well as live audio input.

  The concept of Morphagene comes from the idea of the musician or composer
  cutting up magnetic tape and reassembling it to create new compositions.
  Morphagene goes further by allowing CV and manual control of the various
  parameters associated with this process: Gene Size (grain length), Slide
  (position within the reel), Organize (reel/splice selection), and Morph
  (varispeed/pitch).

  With its SOS (Sound on Sound) feature, Morphagene allows for overdubbing
  new audio onto existing recordings, much like classic tape-based sound on
  sound techniques. Real-time recording to micro SD card enables the capture
  of live performances and sound design sessions.

  The module operates with stereo audio input and output, and provides
  extensive CV control over all parameters for tight integration within a
  modular synthesizer system.
specs: |-
  - 20 HP width
  - 30mm depth
  - +12V: 75mA
  - -12V: 35mA
  - Micro SD card storage for reels
  - Stereo audio input and output
  - Real-time recording and playback
  - Granular microsound processing
  - Sound on Sound (SOS) overdubbing
  - Varispeed playback with pitch control
  - CV control over all parameters
  - Firmware updatable via micro SD
