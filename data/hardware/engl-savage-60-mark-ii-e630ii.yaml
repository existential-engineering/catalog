url: https://www.engl-amps.com/shop/heads/savage-60-mark-ii-e630ii/
description: The Savage 60 MARK II E630II is a 60-watt, four-channel, all-valve
  guitar amplifier head with two valve-buffered FX loops, a noise gate, Master
  A/B, a ground lift switch and full MIDI programmability of its front-panel
  functions.
details: |-
  A classic among amp heads in its latest form, the Savage 60 MARK II is built around dynamics and flexibility. The Mark II adds internal developments and a set of new features, with the MIDI port now included as standard and a finely tuned, sensitive noise gate that keeps extraneous noise out even at extreme gain settings.

  ENGL amplifier designer Horst Langer reworked the 3-band EQ of channels 1 and 2, which come freshly voiced and equipped with Lean and Bold circuits for two different mid characters. Also new is the Gain Lo/Hi circuit, where the Clean channel becomes a crunch in Hi mode and the Lead channel gets fatter and heavier.

  Four channels, a large set of sound-shaping features and thunderous tones make the Savage Mark II a sound centre for a modern guitar rig. Channels cover Clean, Crunch I, Crunch II and Lead, each with its own gain and volume control, over two separate EQ sections and Presence, Master A and Master B.

  Two valve-buffered FX loops each carry a balance control, and a power tube monitor and ground lift switch sit on the rear. MIDI in and MIDI thru are standard, every front-panel function is MIDI programmable with write and copy controls, and a phantom power switch feeds an ENGL MIDI foot controller. The preamp runs six ENGL ECC83 / 12AX7 valves into two ENGL EL34 output valves for 60 watts, with speaker outputs for 4, 8 and 16 Ohm loads and a line out.
specs: |-
  - 4 channels: Clean, Crunch I, Crunch II, Lead
  - All-valve head
  - 2 valve-buffered FX loops, each with a balance control
  - Noise gate
  - Master A/B
  - Power tube monitor
  - Ground lift switch
  - MIDI in and MIDI thru
  - Phantom power switch for the ENGL MIDI foot controller
  - MIDI channel assignment and controller enable switches
  - Write and copy controls for MIDI programming
  - All functions accessible on the front panel are MIDI programmable
  - S.A.C. serial amp control
  - Sound options: Input Lo/Hi, Bright, Preshape, Contour (Clean, Crunch I), Mid Lean/Bold, Depth Boost, Gain Lo/Hi, Contour (Crunch II, Lead), Rough / Smooth
  - Controls: Gain (for each channel), Bass, Mid Lean, Mid Bold, Treble (Clean, Crunch I), Bass, Middle, Treble, Tone Balance (Crunch II, Lead), Volume (for each channel), Presence B, Master A, Master B, noise gate threshold level, FX Loop I Balance, FX Loop II Balance
  - Power amp output: 1 x 4 Ohm, 1 x 8 Ohm, 1 x 16 Ohm, 2 x 8 Ohm parallel, 2 x 16 Ohm parallel
  - Line out
  - Footswitch support: Z4 (channels), Z9, Z12 and Z15
  - Preamp valves: 6 x ENGL ECC83 / 12AX7
  - Output valves: 2 x ENGL EL34
  - Output power: 60 W
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 21 kg
