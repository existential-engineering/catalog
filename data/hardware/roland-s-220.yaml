description: >-
  The Roland S-220 is a 1U rackmount digital sampler released in 1987 as an upgraded
  version of the S-10 sampling keyboard. It features 12-bit sampling at 30kHz with
  16-voice polyphony, 4-part multitimbrality, and 256KB of internal memory across four
  banks. Aimed at entry-level and intermediate users, it offered accessible sampling with
  onboard editing and a Quick Disk drive for storage.
details: |-
  The Roland S-220 was introduced in 1987 as a rack-mountable evolution of the S-10 sampling keyboard, doubling the polyphony from 8 to 16 voices while fitting into a compact 1U rackmount form factor. It was positioned as a consumer-grade sampler, making sampling technology accessible to musicians who didn't require the professional specifications of higher-end units.

  The S-220 samples at 12-bit resolution with a 30kHz sample rate, with an optional 15kHz rate available. While these specifications are modest by modern standards, the lo-fi character of 12-bit sampling has become a sought-after aesthetic in electronic music production. The unit contains 256KB of internal memory divided across four banks of 64KB each, providing a maximum total sample time of approximately 4.4 seconds.

  Storage is handled by a built-in 2.8-inch Quick Disk floppy drive, and the S-220 is compatible with Roland's S-10 disk libraries, giving users access to an existing catalog of samples. The onboard editing capabilities include sample trimming, looping, reverse playback, tuning, envelope editing, velocity sensitivity, and both high-pass and low-pass filtering. Parameters are controlled via a dial interface similar to the Alpha Juno series, and an auto-loop feature simplifies the process of creating seamless looping samples.

  With 4-part multitimbrality and 5 audio outputs, the S-220 supports layered compositions and flexible routing for multitrack recording setups. MIDI control allows integration with external sequencers and keyboards, making it a versatile module for studio and live performance use.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 4 parts
  - Sampler: 12-bit, 30kHz (15kHz optional)
  - Memory: 256KB (4 banks x 64KB), 4.4 seconds total sample time
  - Filter: Highpass, lowpass
  - Outputs: Up to 5 audio outputs
  - Storage: 2.8-inch Quick Disk floppy drive
  - Arpeggiator: Yes
  - Keyboard: None (rackmount)
  - Control: MIDI
