description: A fuzz pedal built around a BC108 transistor circuit with an active
  tone control and a second footswitch to engage an octave-up effect, plus a
  Fat/Bright voicing switch.
details: |-
  The new Fulltone Ultimate Octave is exactly what you want it to be: a smooth BC108 transistor fuzz with an active tone circuit , plus a second footswitch to kick in a searing Octave Up on command. The Fat/Bright switch changes the entire contour, affecting both the fuzz and the octave, so you can choose either the thicker, mid forward Fat setting or the more open Bright setting with defined highs and a slightly scooped mid-range. It isn't fussy about guitar choice either—tracking is solid on any pickup most anywhere on the neck, though the neck pickup will give you the most pronounced octave clarity. If you need more octave, turn Tone up, back Distortion down a touch, and raise Volume. Simple. This is the original circuit stays untouched with no re-voicing and no updates to the sound. It delivers the original tone in a chassis that is now less than half the width of its predecessor. The two footswitch layout stays, the Fat/Bright switch still does the heavy lifting, and the feel and cleanup are exactly what made the Ultimate Octave a favorite. Excluded from all 2025 promotions.
