description: Dual 31-band graphic EQ with limiter, Type V noise reduction, and
  Advanced Feedback Suppression, offering 113 dB dynamic range and professional
  analog interface with digital processing.
details: |-
  The dbx iEQ31 is a professional-grade dual 31-band graphic equalizer featuring 1/3-octave equalization with Advanced Feedback Suppression (AFS), Type V noise reduction, and PeakStopPlus limiting. It offers unsurpassed equalization specifications in a professional 2U rack format.

  Each channel provides up to 10 dB of dynamic broadband noise reduction via the Type V algorithm. AFS automatically detects and suppresses feedback. PeakStopPlus limiting provides transparent protection against signal overloads on both channels.

  The unit features XLR, 1/4" TRS, and Euroblock connectors for both inputs and outputs. The boost/cut range is switchable between +6 dB and +15 dB per band. An 18 dB/octave 40 Hz low-cut filter and +12 dB input gain range are included. The 24-bit digital processing delivers 113 dB A-weighted dynamic range with only 0.003% THD+N.
specs: |-
  - Input Connectors: 1/4" TRS, female XLR (pin 2 hot), Euroblock
  - Input Type: Electronically balanced/unbalanced, RF filtered
  - Input Impedance: Balanced 40k ohm, unbalanced 20k ohm
  - Max Input: >+22 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: 1/4" TRS, male XLR (pin 2 hot), Euroblock
  - Output Type: Active-balanced/unbalanced, RF filtered
  - Output Impedance: Balanced >120 ohm, unbalanced >60 ohm
  - Max Output: >+20 dBu balanced/unbalanced into 2k ohm or greater
  - Frequency Response: 20 Hz to 20 kHz, +0.5/-0.25 dB
  - Dynamic Range: >113 dB A-weighted
  - THD+Noise: <0.003%, typical at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <-80 dB, 20 Hz to 20 kHz
  - Noise Reduction: Up to 10 dB dynamic broadband noise reduction
  - Digital Resolution: 24 bits
  - Sample Rate: 48 kHz
  - Latency: 2 ms
  - Operating Voltage: 120VAC 60Hz, 220/240VAC 50/60Hz
  - Power Consumption: 17 Watts
  - Power Connector: IEC receptacle
  - Input Gain Range: +12 dB
  - Boost/Cut Range: Switchable +6 or +15 dB
  - Low Cut Filter: 18 dB per octave at 40 Hz
  - Dimensions: 3.5" H x 19" W x 7.9" D
