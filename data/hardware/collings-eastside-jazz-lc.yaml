description: The Eastside Jazz LC is a sleekly contoured hollow-body archtop
  electric guitar that bridges the gap between the Eastside LC and CL Jazz
  models. It features a fully hollow parallel-braced, thin-line construction
  with a 15" maple laminate body designed for comfortable, ergonomic
  playability. A single Lollar Charlie Christian-style pickup at the neck
  delivers highly refined and balanced jazz tone. The result is a versatile
  instrument suited to players seeking classic jazz voice in a manageable body
  size.
details: |-
  The Eastside Jazz LC combines a fully hollow, parallel-braced body with a 15" maple laminate construction to produce warm, articulate jazz tones. The Honduran mahogany neck is capped with a rosewood fingerboard featuring mother-of-pearl long dot inlays. A single Lollar Charlie Christian pickup at the neck position provides the guitar's characteristic jazz voice. The 24 7/8" scale length and 1 11/16" nut width make it comfortable for extended playing. Hardware includes an adjustable ebony bridge and high gloss nitrocellulose lacquer finish. Strings are D'Addario NYXL1252W (.012"-.052"). The guitar ships with a deluxe hardshell case. Custom options include finish colors, alternative pickup configurations, a 60s neck profile, left-handed configuration, and various inlay and binding choices.
specs: |-
  - Body: Fully hollow, maple laminate
  - Body Width: 15"
  - Body Length: 19"
  - Body Depth: 1 11/16"
  - Total Length: 41"
  - Neck: Honduran mahogany
  - Fingerboard: Rosewood
  - Inlays: Mother-of-pearl long dots
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Fingerboard Radius: 12"
  - Frets: Medium 18% nickel-silver
  - Pickup: Single Lollar Charlie Christian (neck)
  - Bridge: Adjustable ebony
  - Strings: D'Addario NYXL1252W (.012"-.052")
  - Finish: High gloss nitrocellulose lacquer
  - Included: Deluxe hardshell case
