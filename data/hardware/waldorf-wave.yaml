description: >-
  The Waldorf Wave is a professional hybrid synthesizer released in 1993,
  combining digital wavetable synthesis with analog filters. Featuring 16
  expandable voices and a 61-key keyboard, it represents one of the most
  advanced wavetable instruments ever produced. Notable users include Hans
  Zimmer, Depeche Mode, and Enya.
details: |-
  The Wave exemplifies Waldorf's engineering excellence in the wavetable synthesis domain. Built upon technology pioneered by earlier instruments like the Sequential Circuits Prophet VS and Korg Wavestation, it delivers sophisticated sound generation through the manipulation of digital waveform samples.

  The instrument combines digital and analog signal processing. Waveform samples are processed and blended to create complex timbres and evolving soundscapes. The synthesis engine supports extensive sound shaping with multiple processing stages available for layering and transformation.

  The filtering section employs analog components: a 24dB low-pass filter and a 12dB high-pass filter, both featuring resonance, distortion, and self-oscillation capabilities. This analog stage provides warmth and character typically absent in purely digital designs.

  The Wave gained recognition among professional composers and electronic musicians. Its semi-modular architecture permits both hardware and software expansion options, allowing polyphony to be expanded from 16 up to 48 voices.
specs: |-
  - 61-key keyboard with velocity and aftertouch
  - 16 to 48 voices (expandable)
  - Digital wavetable oscillators with noise generator
  - Analog 24dB low-pass filter with resonance, distortion, and self-oscillation
  - Analog 12dB high-pass filter with resonance, distortion, and self-oscillation
  - 256 patches, 256 performances
  - MIDI compatible
  - Hardware and software expansion options
