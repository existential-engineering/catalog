details: |-
  The Nebula Edition is a custom shop colorway of the Keeley Neutrino Envelope Filter V2, offered in four finishes: red and orange, orange and blue, blue and purple, or purple and green. The run is limited to twelve units of each design.

  The pedal is a compact form of the classic opto-coupler envelope filter, creating an automatic wah from pick attack. Keeley argues that envelope filters react best when they are opto-coupler based, and the opto-couplers used here are chosen for a smooth, vowel-like tone suited to funk and jam band playing. Three filter ranges, two sweep directions, two ranges for the frequency centre and a Peak control make up the controls, and a power supply voltage doubler keeps headroom high. Output volume and direction are external controls on this version.

  Keeley describes the artwork as a revisit of the Neutrino V1 Nebula Edition launched in 2014 for the company's 13th anniversary, with the colour bursts generated with the help of AI tools and then finished by a graphic designer into four designs.
specs: |-
  - Limited custom shop run of 12 units per design, in four colorways
  - Envelope filter and auto wah for guitar, bass and keyboard
  - Peak control: sets how much quack or how smooth the sweep is
  - Filter Selector: three filter types, high-pass, low-pass and band-pass
  - Range switch: high or low frequency centre
  - Direction switch: sweep up or down
  - External output volume and direction controls
  - Power supply voltage doubler for extra headroom
  - True bypass, 9 VDC, 25mA, fully analog, made in the USA
