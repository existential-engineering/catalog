  pitchbend, mod wheel, filter cutoff, resonance, volume and sustain control.
details: |-
  A MIDI retrofit kit for the Prophet 5 rev 3.0 and rev 3.1. Once fitted, the synthesiser responds to incoming MIDI on any selectable channel, covering notes in the range of MIDI note numbers 36 to 96 with transposition possible, program changes 1 to 40, pitchbend over a fifth up and down, mod wheel, low pass filter cutoff, resonance, volume and sustain (decay on-off).

  The default assignments take pitchbend from pitchbend messages, mod wheel from CC#1 and aftertouch, filter cutoff from CC#16, resonance from CC#17, volume from MIDI volume (CC#7) and sustain from CC#64. Any destination can be remapped to another controller, to aftertouch or to velocity, so velocity can be set to control volume instead.

  Outgoing MIDI covers notes in the same 36 to 96 range on any selectable channel, with transposition possible, and program changes 1 to 61 can be sent with a button press followed by a key press. Nothing else is transmitted, the retrofit being aimed primarily at playing the synthesiser from a MIDI master keyboard or sequencer.

  The kit adds MIDI In, Out and Thru sockets and a push button for programming the MIDI setup, with setups held in non-volatile EEPROM memory. Contents are a circuit board that fits in the base of the Prophet, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions covering changes to the default settings, and step by step fitting instructions with diagrams of the connection points.

  Installation is a skilled job. The kit is not intended for end-user fitting and should always be installed by an experienced synth service engineer, or fitted at the manufacturer's premises in Tadworth, just outside London. Kits are built to order, and every one is checked and tested before despatch.
specs: |-
  - Fits the Sequential Prophet 5 rev 3.0 and rev 3.1
  - Incoming MIDI note range: MIDI note numbers 36 to 96, transpose possible
  - Incoming program change numbers 1 to 40
  - Pitchbend range: a fifth up and down
  - Default controller map: pitchbend messages, mod wheel CC#1 plus aftertouch, filter cutoff CC#16, resonance CC#17, volume CC#7, sustain CC#64
  - Any controller, aftertouch or velocity can be remapped to any supported destination
  - Outgoing MIDI: notes 36 to 96 on any channel, plus program changes 1 to 61 by button press and key press
  - Adds MIDI In, Out and Thru sockets
  - Adds a push button for programming the MIDI setup
  - Setups stored in non-volatile EEPROM memory
  - Circuit board fits in the base of the synthesiser
  - Powered from the host synthesiser, no separate power connection
