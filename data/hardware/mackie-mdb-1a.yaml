details: |-
  From acoustic guitars to laptops, always sound your best with MDB Series Direct Boxes. Available in four different models, the MDB Series will give you the peace of mind that your sound will faithfully get to your audience the way that you hear it on stage.

  Great for active instruments like guitars and basses with active pickups and preamps, the MDB-1A Active DI features increased headroom and distortion-free operation. Featuring a 1/4" high-impedance input and thru with -20db pad plus a Merge switch that turns the Thru jack into a second input, perfect for summing a stereo source to a mono output.

  The balanced XLR output features switches for Polarity, Low Cut, and Ground Lift. For maximum convenience, the MDB-1A is powered by 48v phantom power.

  With the Merge switch off the Thru jack works as a normal parallel output. With it on, the Thru jack works as an additional input that is summed with the main input to create a mono output source, which suits stereo sources like keyboards and media players.

  When on, the low-cut switch (often referred to as a high-pass filter) cuts bass frequencies below 120 Hz. The polarity switch reverses the signal by 180 degrees.
specs: |-
  - Active circuitry offers higher headroom for ultra-low noise and distortion-free performance
  - High-impedance 1/4" input with Thru output
  - Balanced XLR output connector with Ground Lift
  - Low Cut and Polarity switches
  - Merge switch allows connection of stereo sources which are then summed to mono at the output
  - -20dB pad ensures distortion-free performance when connecting to high-level sources
  - Powered via 48v phantom power, current draw under 4.0 mA DC
  - Built-Like-A-Tank construction
  - Low cut filter corner 120 Hz
  - Frequency response 20 Hz to 20 kHz, +/-0.5 dB
  - Signal-to-noise ratio 90 dB
  - Dynamic range 130 dB
  - Total harmonic distortion 0.02% THDF @ 1 kHz
  - Input impedance 330 k ohm unbalanced
  - Output impedance 150 ohm balanced
  - Dimensions 1.5 x 3.4 x 5.8 in / 38 x 86 x 147 mm
  - Weight 0.8 lb / 0.4 kg
