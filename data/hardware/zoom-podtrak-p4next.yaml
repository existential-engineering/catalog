description: The PodTrak P4next features 4 XLR inputs and next-gen features like
  AI noise reduction, tone shaping, and voice compression, making
  broadcast-quality podcasting easier than ever.
details: |-
  The PodTrak P4next is a four-input portable podcast recorder. Its four XLR inputs provide up to +70 dB of gain, with +48 V phantom power available on all channels, so demanding dynamic and condenser podcast microphones can be used directly.

  Three processing blocks run on the inputs. AI noise reduction learns and removes hums, buzzes and street noise while keeping the voice clear and detailed. The tone feature adds EQ and de-essing to reduce harshness and add warmth. The built-in compressor smooths out sudden shouts, laughter and whispers.

  Two remote guests can be brought in over USB, over Bluetooth with the BTA-2 adapter, or through the TRRS smartphone jack, leaving the remaining three mic inputs for a five-person podcast. A built-in mix-minus removes echo and feedback automatically, and four headphone outputs with individual volume controls let everyone at the table monitor separately.

  Four sound pads trigger intros, jingles and sound effects with a single tap, using built-in sounds such as air horn, applause, laughter or rimshot, or audio recorded straight to the pad or loaded from a card. Recording is 48 kHz 24-bit WAV, saving a ready-to-publish stereo mix plus individual channels to a microSD card of up to 2 TB.

  Connected over USB-C the P4next works as a plug-and-play 12-in/2-out audio interface for streaming or recording on PC, Mac, iOS or Android. It runs on two AA batteries or from USB, taking power from a mobile battery, bus power or a 12 W or higher USB AC adapter. Voice guidance reads menus and controls aloud through the headphones.
specs: |-
  - 4 mono/stereo INPUT channels and 4 stereo PHONES outputs
  - INPUT connectors: XLR jacks x 4 (XLR: 2 HOT)
  - Input gain: minus infinity to +70 dB, input impedance 3 kOhm or more, maximum input level 0 dBu
  - Phantom power: +48 V, switchable on all channels
  - Smartphone connection jack: TRRS mini jack (4 contacts, TIP: L, RING: R, RING: GND, SLEEVE: MIC), maximum input level +3 dBu, maximum output level minus 24 dBu
  - PHONES: stereo mini jack x 4, maximum output level 6 mW + 6 mW per output into a 32 Ohm load, output impedance 10 Ohm or less
  - Effects: TONE, COMP, AI NOISE REDUCTION
  - Maximum simultaneous recording tracks: 11, maximum simultaneous playback tracks: 2
  - Recording format: 48 kHz / 24-bit WAV, stereo or mono
  - Recording media: microSDHC and microSDXC cards, up to 2 TB
  - USB (for data): USB Type-C, USB 2.0 High Speed
  - Audio interface: 12 in / 2 out, 48 kHz, 24-bit, class compliant with PC, Mac, iOS and Android
  - Equivalent input noise: EIN minus 125 dBu or less (IHF-A) at +70 dB / 150 Ohm input
  - Display: 128 x 64 OLED
  - Power: 2 AA batteries (alkaline, lithium or rechargeable NiMH), USB DC5V power port, or USB bus power from a 12 W or higher adapter (5 V, 2.4 A or higher)
  - Battery life with 4 dynamic mics: about 3.5 hours alkaline, about 4 hours NiMH 1900 mAh, about 8.5 hours lithium
  - Battery life with 4 condenser mics: about 20 minutes alkaline, about 1.5 hours NiMH 1900 mAh, about 2.5 hours lithium
  - Power consumption: 5 W maximum
  - Dimensions: 125.9 mm (W) x 120 mm (D) x 40 mm (H)
  - Weight including batteries: 300 g
  - Four sound pads with built-in sounds, direct-to-pad recording and user-loaded audio
  - Voice guidance reads menus and controls through the headphones
  - Bluetooth remote guest connection requires the optional BTA-2 adapter
