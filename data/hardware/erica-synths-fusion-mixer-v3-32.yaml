url: https://www.ericasynths.lv/fusion-mixer-v3-32/
description: Erica Synths Fusion dual Mixer is designed to mix and overdrive
  audio signals on the vacuum tube.
details: |-
  Use the Fusion Mixer as two independent 3-input mixers (also for stereo signal mixing) or as a single 6-input mixer. A special feature of the Fusion Mixer is the tube overdrive that appears when the level knobs are set to 3 o'clock or above.

  Used with drum machines it even emulates sidechain compressors. Used to mix signals from VCOs it works as a waveshaper, especially if a pulse width modulated pulse signal is fed to one of the inputs.

  All Fusion modules are by default configured to work with a regular eurorack PSU. The user manual covers the other possible power supply configurations.

  Because cold tube heaters have lower resistance, Fusion modules have a significant power consumption peak at startup, when consumption almost doubles for 1 to 2 seconds. This is not a problem with linear PSUs that have power inertia, but it may cause a switching PSU internal protection to turn the power supply off, so the PSU should have some headroom before multiple Fusion modules are installed.

  The panel carries 6 audio inputs, two independent 3-input mixers, a sum of all 6 inputs and soft tube overdrive.
specs: |-
  - Input signal level up to 20V ptp
  - Output signal level 10V ptp
  - Mixer GAIN 1
  - Power supply bipolar +-12V, eurorack standard
  - Power consumption (eurorack PSU configuration): 160mA@+12V, 10mA@-12V
  - Module width 14HP
  - Module depth 25mm
