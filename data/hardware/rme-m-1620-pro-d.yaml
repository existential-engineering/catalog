description: 16 channel A/D, 20 channel D/A converter with ADAT, Dante and MADI,
  plus two separate headphone outputs, in a single-height 19-inch rack device.
details: |-
  The RME M-1620 Pro D converts 16 analog line-level signals (per channel switchable up to +24 dBu) to and from MADI, ADAT and Dante network technology. This innovative unit is designed with a newly developed front panel that combines LED level meters with a display and includes two separate headphone outputs for monitoring - all within a single-height 19-inch rack device. Cutting-edge converters and flexible internal routing place it at the forefront of any audio network.

  RME prioritizes reliability by equipping the M-1620 Pro with built-in redundancy. This includes dual network and dual MADI connections, along with a monitored DC input in addition to the internal AC power supply. A unique system clearly signals when an issue arises, ensuring seamless operation. With full stand-alone capability, users can adjust device settings directly on the unit for quick modifications or to recall entire user-defined presets.

  Responding to frequent requests, the M-1620 Pro D integrates 64 channel Dante connectivity, providing direct links to other audio devices via standard ethernet switches. If redundancy is not required, the device can act as a switch itself and allow daisy-chains of several Dante devices. Users can record and playback up to 64 channels of any of the M-1620's analog and digital I/O on their computer using Audinate's Dante Virtual Soundcard (license not included).

  The M-1620 Pro allows manual configuration of the converter's aliasing filters for optimal impulse and frequency response. Separate Word Clock BNC and coaxial MADI connectors, with optional optical MADI via an SFP module, allow the device to be easily integrated into existing infrastructure.
specs: |-
  - Line In 1-16 resolution: 24 bit
  - Line In input level switchable per channel: +24 dBu, +19 dBu, +13 dBu @ 0 dBFS
  - Line In input impedance: 9.5 kOhm
  - Line In SNR @ +24 dBu, 44.1 kHz: 117.0 dB RMS unweighted, 120.7 dBA
  - Line In SNR @ +19 dBu: 116.3 dB RMS unweighted, 119.9 dBA
  - Line In SNR @ +13 dBu: 114.7 dB RMS unweighted, 118.3 dBA
  - Line In frequency response @ 44.1 kHz: 5 Hz - 20.5 kHz (-0.1 dB)
  - Line In THD @ -1 dBFS: < -111 dB
  - Line In THD+N @ -1 dBFS: < -108 dB
  - Line In channel separation: > 110 dB
  - Line In signal path: AC coupled, fully symmetrical (servo-balanced)
  - Line Out 1-16 resolution: 24 bit
  - Line Out output level switchable per channel: +24 dBu, +19 dBu, +13 dBu @ 0 dBFS
  - Line Out output impedance: 200 Ohm balanced, 100 Ohm unbalanced
  - Line Out SNR @ 13 dBu: 119.2 dB RMS unweighted
  - Line Out SNR @ 19 dBu: 119.7 dB RMS unweighted
  - Line Out SNR @ 24 dBu: 119.9 dB RMS unweighted
  - Line Out frequency response @ 44.1 kHz: 0 Hz - 20.3 kHz (Sharp Filter, default)
  - Line Out frequency response @ 96 kHz: 0 Hz - 30 kHz (Slow Filter, default)
  - Line Out frequency response @ 96 kHz: 0 Hz - 44.1 kHz (Sharp Filter)
  - Line Out frequency response @ 192 kHz: 0 Hz - 60.5 kHz (Slow Filter, default)
  - Line Out frequency response @ 192 kHz: 0 Hz - 85 kHz (Sharp Filter)
  - Line Out THD @ 19 dBu: < -120 dB
  - Line Out THD+N @ 19 dBu: < -113 dB
  - Line Out channel separation: > 110 dB
  - Line Out signal path: DC coupled, fully symmetrical (truly balanced)
  - Phones 1/2, 3/4 resolution: 24 bit
  - Phones output: 6.3 mm TRS stereo (unbalanced) or mono (balanced) jack
  - Phones maximum output level: +4 dBu / +19 dBu (+10 dBu / +25 dBu in balanced mode)
  - Phones output level switchable separately for each TRS connector
  - Phones SNR @ 19 dBu: > 109 dB RMS unweighted, > 111 dB(A)
  - Phones frequency response @ 44.1 kHz: 0 Hz - 20.0 kHz (Sharp Filter, default)
  - Phones frequency response @ 96 kHz: 0 Hz - 20.0 kHz (Slow Filter, default)
  - Phones frequency response @ 96 kHz: 0 Hz - 44.3 kHz (Sharp Filter)
  - Phones frequency response @ 192 kHz: 0 Hz - 43 kHz (Slow Filter, default)
  - Phones frequency response @ 192 kHz: 0 Hz - 85 kHz (Sharp Filter)
  - Phones THD+N @ 4 dBu, 32 Ohms load: < -100 dB
  - Phones THD+N @ 19 dBu, 100 Ohms load: < -100 dB
  - Network: 2 x Gigabit Ethernet (802.3 compliant) for Dante
  - Dante: up to 64 channels
  - MADI Coaxial: BNC (standard)
  - MADI Optical: SFP module (optional)
  - Word Clock: BNC I/O
  - USB: firmware and remote control
  - Redundant PSU: optional
