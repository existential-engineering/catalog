description: A hand-made-in-England Foundation range bass cabinet built to
  complement the ABM EVO IV heads. It features 18mm FSC-approved birch plywood
  and custom high-powered BlueLine Plus drivers developed with Italian speaker
  maker SICA, tuned to match the drivers' frequency response for high SPL and
  long driver life. A single 15" driver handles 500W continuous (1000W peak) at
  8 ohms, with a bespoke Ashdown HF unit, tilt-back heavy-duty casters and a
  kick plate for easy transport.
details: |-
  Ashdown Foundation range bass cabinet, hand-crafted in the UK. Single 15" custom high-powered BlueLine Plus driver developed with Italian speaker manufacturer SICA, carrying a lifetime warranty. 18mm FSC-approved birch plywood enclosure from responsibly managed forests, tuned to match the driver's frequency response for the highest possible SPL and driver longevity. Bespoke Ashdown HF unit to reproduce the natural high frequencies of the bass guitar. Tilt-back heavy-duty casters, protective kick plate and T-nutted Allen-key-fitted grille and speaker fixings for easy speaker replacement. Power handling: 500W continuous / 1000W peak. Speaker configuration: 1 x 15". Speaker outputs: 2 x Speakon combi jack with HF switch. Frequency response: 30Hz - 20kHz. Impedance: 8 Ohms nominal. SPL: 97dB - 1W @ 1m @ 200Hz. Dimensions (H x W x D): 600 x 609 x 441 mm (inc wheels). Weight: 29 kg.
