details: |-
  The Taylor 114ce is part of Taylor's 100 Series, offering an accessible entry point into the Taylor lineup without sacrificing quality or playability. The Grand Auditorium body shape provides a balanced tonal profile suited to a wide range of playing styles, from fingerpicking to strumming.

  The solid torrefied spruce top gives the 114ce a warm, resonant tone with enhanced responsiveness, while the layered sapele back and sides add depth and projection. Taylor's C-Class bracing pattern is designed to optimize the acoustic response of the top, contributing to the guitar's rich, full sound.

  The Venetian cutaway allows easy access to the upper frets, making the 114ce ideal for lead playing and melodic passages. The Taylor neck profile features a comfortable Standard Carve, with a 25-1/2" scale length and 1-11/16" nut width for a familiar, easy-playing feel.

  Taylor's Expression System 2 (ES2) electronics are mounted behind the saddle, providing natural-sounding amplified tone that captures the guitar's acoustic character. The system is designed to minimize feedback while maintaining the warmth and clarity of the unplugged sound.
