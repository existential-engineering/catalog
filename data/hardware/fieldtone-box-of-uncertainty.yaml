description: The BOU is a characterful and unpredictable audio sampler designed
  for experimentation and improvisation. It has two sample players, particle and
  fragment, with controls for length, speed, level, pitch and direction, and
  space/emanation effects, but no menus, presets or save functions.
details: |-
  PLEASE JOIN THE MAILING LIST FOR NEXT AVAILABILITY

  The BOU is a characterful and unpredictable audio sampler, designed for experimentation and improvisation. please feed it a wide variety of sound sources including but not limited to field recordings and household objects, acoustic instruments, synthesizers and electronic equipment, songs by your favourite recording artist (or your least favourite…). There are no menus, sub-patches, presets or save functions. The BOU is immediate and imperfect. Record
  The capture button records for the length that it's pressed for (maximum 3 seconds), recording from the built-in microphone, unless a line input is connected on the back in which case that source is captured. the looped sample begins to play back immediately. Mix

  There is no overall volume control for the BOU. both of the playback samplers have their own level control, as does the fragment space and occult emanation parameters which are routed as pre-fade effects. Play
  There are two sample players which behave differently: particle and fragment. each has a control for length, speed and level. There is additional control for pitch and direction of particle, whilst fragment can be sent to space. Occult emanation should be used liberally with caution. Power supply: Requires a 9v centre positive supply (supplied)

  External measurements (including knobs):
  24 x 18 x 8 cm

  Please note that these are hand built and hand-finished units; we use some dead stock and refurbished components so some imperfections to cosmetic finish and knobs is to be expected. PLEASE NOTE:

  Tax / Tariffs / Import Duty - we only collect tax on sales to customers in the UK. Any orders placed from outside of the UK will be subject to whatever local import tax rates or tariffs and associated charges are in place in those countries
