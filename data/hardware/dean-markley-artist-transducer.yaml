description: A piezo transducer pickup for acoustic instruments such as guitar,
  mandolin, fiddle, dulcimer and banjo, using a compression-based lead
  differential weight design and an adhesive mount.
details: |-
  Do you have a mandolin, fiddle, dulcimer, banjo, or acoustic guitar that just needs to be louder? If the answer is yes, then we have got the solution for you! A Worldwide Best Seller since 1980, our patented transducer pickup design helps the piezo react through compression using a lead differential weight instead of bending like other brands. This makes all the difference in the world and authentically produces the true acoustic tone of your instrument whether you are in a live or studio environment. PLUS, it's easy and safe. The Artist Transducer's special mounting adhesive allows the unit to be mounted and removed many, many times without hurting the finish. Comes with either a 10' cable (3000) or with a three foot female end jack cable to plug directly into your favorite cable or wireless system (3001). HAND CRAFTED IN THE USA
