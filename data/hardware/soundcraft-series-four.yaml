description: Series FOUR is a compact live sound mixer for Front-of-House applications.
details: |-
  Series FOUR is a compact live sound mixer for Front-of-House applications. A comprehensive featureset combined with a small footprint makes it ideal for budget-conscious touring applications, where the familiar control layout found on its big brother the Series FIVE will be highly appreciated.

  The FOUR is available in four frame sizes providing 24, 32, 40 and 48 mono inputs into 8 group busses, 10 Aux busses and stereo and mono main mix busses.

  Four full-function stereo input channels are also included in each frame in addition to the mono modules.

  The output section includes 8 VCA groups, and a 16x8 matrix section, which includes feeds from two of the Aux busses. Key Features:
