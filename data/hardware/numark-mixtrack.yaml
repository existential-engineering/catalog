name: Mixtrack
manufacturer: numark
primaryCategory: midi-controller
url: https://www.numark.com/product/mixtrack
description: Mixtrack 2-Channel DJ Controller — a compact, USB-powered,
  class-compliant MIDI controller with dual-deck layout and an integrated mixer
  section for performing and producing with DJ software.
details: |-
  Mixtrack is a powerhouse controller in a compact chassis for performing and producing with DJ software. The familiar layout works just like two decks and a mixer so whether you're a seasoned professional or building your DJ skills, Mixtrack is easy to learn and handles advanced techniques. It's portable so you can grab Mixtrack and your laptop and go to wherever the gig is.

  Mixtrack has two deck controller sections with large touch-activated jog wheels and transport controls. Whether you're used to a CD player, turntables, or any other traditional DJ hardware, you'll find getting around easy. The center of Mixtrack's surface is its mixer section with a smooth crossfader, line faders, deck EQs, and more advanced controls for looping and effects.

  Mixtrack connects to your Mac or PC as a class-compliant USB device so it requires no software drivers to work, and USB powers it so you won't need an external supply.
specs: |-
  - Large touch sensitive platters for accurate control and scratching
  - Classic, dual-deck layout with complete mixer section
  - Lighted controls indicate status in software for less time looking at the computer
  - MIDI-over-USB: compatible with virtually all DJ software
  - Mac and PC class-compliant USB: no software drivers to install
  - USB-powered device: does not require additional power supply
  - Works with MP3, WAV, AIFF, FLAC, Ogg Vorbis, WMA (non-DRM, Windows only), AAC (non-DRM), and audio CDs (requires CD drive on computer)
  - Class Compliant: immediately compatible with every current and future version of Mac OS X and iOS and with Windows (98SE and up) operating systems
