description: >-
  The Technosaurus Selector is a Swiss-made analog modular synthesizer system available in multiple
  rack configurations, featuring high-quality modules with patch cord routing and optional MIDI
  integration.
details: |-
  The Technosaurus Selector series, introduced in 1996, represents a boutique approach to analog
  modular synthesis from Switzerland. Available in four system configurations ranging from the
  compact System A to the massive dual-rack System D, these instruments offer traditional modular
  synthesis with the build quality and precision engineering expected from Swiss manufacturing.

  The module lineup covers all the fundamentals of subtractive and additive synthesis across 11
  available units. VCOs generate sawtooth, sine, square, and triangle waveforms with hard sync and
  modulation capabilities, while the Octal Subharmonic Oscillator provides additive synthesis using
  sine waves from the fundamental to the 8th undertone. A dual waveshaper creates complex timbres
  through signal clipping and folding, and triple resonators offer three bandpass filters spanning
  32Hz to 8kHz.

  The filter section includes a multimode 12dB/octave design supporting lowpass, highpass, bandpass,
  and notch configurations with voltage-controlled resonance. A dual ring modulator generates
  metallic and inharmonic tones, while DADSR and ADSR envelopes with attack times as fast as 70
  microseconds ensure snappy transient response. The MIDI control module bridges the analog world
  with digital studios through eight analog outputs for CV, gate, velocity, aftertouch, pitch bend,
  mod wheel, and assignable controllers.
specs: |-
  - Polyphony: Monophonic (per voice)
  - Oscillators: VCO with saw, sine, square, triangle; hard sync; FM
  - Subharmonic Oscillator: 8 sine wave undertones (additive synthesis)
  - Waveshaper: Dual, signal clipping and folding
  - Filter: 12dB/oct multimode (LP, HP, BP, notch) with voltage-controlled resonance
  - Triple Resonators: 3 bandpass filters, 32Hz-8kHz, Q-factor 0.3-10
  - Ring Modulator: Dual
  - VCA: Exponential with stereo panoramic control
  - Envelopes: DADSR/ADSR, 70 microsecond minimum attack
  - LFO: Sine, triangle, sawtooth, square plus white/pink noise
  - Sample & Hold: Internal/external random sources
  - MIDI Module: 8 analog outputs (CV, Gate, Velocity, Aftertouch, Pitch Bend, Mod Wheel, CCs)
  - Configurations: System A (6U), System B (9U), System C (dual 19"), System D (dual 38")
