description: The MMI Astra is an active touch and pressure controller for
  Eurorack that uses a vactrol and slew limiter to generate or shape CV and
  audio signals. It can operate from an internal 5v source or process a
  patched-in signal, with the front touch plate controlling attenuation and
  amplification via pressure and position.
details: |-
  Operation of the Astra is both simple and straightforward - the large touch panel on the front will respond gradually to soft and firm touches, making it easy to inject some human feeling into your compositions. Being fully analog, the controller uses an internal vactrol and slew rate limiter to make it easy for you to create smooth transitions - when used without an input, the MMI Astra uses an internal 5v source as the basis of its signal, allowing you to easily generate complex CV to control other modules, in order to create intermittent filter sweeps, resonance peaks and much more. By using the input, you can route in both CV and audio to destinations of your choosing, attenuating and amplifying by varying pressure and position on the touch plate. Easily introduce LFOs, create huge reverb or volume swells, or intermittently introduce fading soundscapes as you play. The front facing LED gives you immediate visual feedback on the status of the module as you play, making it easy to control the MMI Astra. It's the MMI you've wanted for years, finally made real.
