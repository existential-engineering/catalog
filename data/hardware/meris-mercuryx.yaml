description: Modular Reverb System with pro audio & studio rack heritage,
  advanced processing, and high performance signal path.
details: |-
  MercuryX takes the heart and soul of Mercury7 and expands it into a flexible studio reverb in a pedal format. It combines 8 custom Meris reverb algorithms into a modular system UI and architecture first introduced with the LVX pedal. Ultraplate and Cathedra are from Mercury7 and are inspired by the moody sci-fi reverbs featured in Blade Runner. The 78 Room, Plate and Hall structures are inspired by the sounds of a studio classic, while Spring, Prism, and Gravity are new structures unique to MercuryX.

  The pedal provides 2.54 seconds of expanded stereo predelay with modular feedback routing, an independent stereo freeze alongside reverb, and gate envelope controls for every reverb type. New processing elements include 79 Chorus, Vibrato, Vowel Mod, Tremolo, Hazy Lo-Fi and more, with an expressive Hold Modifier switch for on-the-fly control and a deep modifier section that routes control signals to processing parameters.

  MercuryX offers stereo input and output with separate jacks for each, MIDI in and out over standard five-pin DIN jacks, a dedicated expression pedal jack, and a USB-C port for firmware updates and MIDI over USB. Switchable input and output headroom accommodates instrument or line/synth levels, and the unit runs on 9V DC power.
specs: |-
  - 8 Custom Meris Reverbs: Ultraplate, Cathedra, 78 Room, 78 Plate, 78 Hall, Spring, Prism and Gravity
  - Expanded 2.54 secs of stereo predelay with modular feedback routing location
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Sample Rate: 48000 Hz
  - Input Impedance: 1 Meg Ohm
  - SNR: 115 dB Typical
  - Frequency Response: 20Hz-20kHz
  - Max Input Level: +9 dBu (instrument level setting), +12.5 dBu (line/synth level setting)
  - Power: 9V DC center-negative, 300mA, 2.1mm jack
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Dimensions: 7.25" wide x 4.5" long x 2" tall
  - Weight: 24 ounces
