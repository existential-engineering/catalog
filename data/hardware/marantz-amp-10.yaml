id: r3S0HWTRAtXr3r_iSWipT
name: AMP 10
manufacturer: marantz
primaryCategory: power-amp
url: https://www.marantz.com/en-us/product/power-amplifiers/amp-10/300586.html
prices:
  - amount: 8000
    currency: USD
description: Engineered with best-in-class technologies, AMP 10 cleverly
  combines very high-power output and high channel count to create a master
  reference-level amplifier for ultimate home theater performance.
details: |-
  Engineered with best-in-class technologies, AMP 10 cleverly combines very high power output and a plentiful channel count to create a master reference-level amplifier for ultimate home theater performance. Providing amplification for up to 16 channels at 200 watts per channel with a robust power supply and consistent performance across all channels, it is designed to drive large-scale immersive systems with authority and control.

  Built upon decades of rich heritage, designed with timeless style, and engineered for utmost performance, the Marantz CINEMA Series are the foundation of the world's most demanding home theaters.

  A modern expression of timeless design principles, AMP 10 features the iconic Marantz porthole level meter, premium materials, and subtle sidelights that illuminate the front panel.

  AMP 10 is engineered using best-in class technologies to enable extraordinary power output, high channel count, and the dynamic, rich, warm sound for which Marantz is highly renowned. The Marantz Sound Master meticulously tuned AMP 10 with the proprietary HDAM amplification circuitry, and it is crafted in Shirakawa, Japan.
specs: |-
  - Number of power amps: 16
  - Power output (8 ohm, 1 kHz, 0.05%, 2ch drive), normal / BTL: 200W / 400W
  - Power output (4 ohm, 1 kHz, 0.7%, 2ch drive), normal: 400W
  - Power output (8 ohm, 1 kHz, 0.7%, 5ch drive), normal: 200W
  - 70% guarantee (normal / Bi-Amp / BTL): Yes
  - 100% guarantee (normal / Bi-Amp): Yes
  - Main amplifier in: balanced and unbalanced, 16ch (exclusive use by a selector switch)
  - Speaker terminal: SPKT-1+
  - Number of speaker terminals: 16
  - Bi-Amp drive / BTL drive: Yes / Yes
  - Custom switching (Class D) amplifiers with HDAM-SA2
  - Chassis: copper plated
  - Front display: level meter
  - Metal front panel: Yes
  - Auto power off: Yes
  - IP control / RS232 control / web control / app control: No / Yes / No / No
  - IR flasher in: Yes
  - Marantz Remote Bus: Yes
  - DC trigger input / output: 1 / 1
  - Firmware update by network / USB / RS232C: No / No / No
  - Power consumption: 500W
  - Power consumption, no sound: 140W
  - Standby consumption: 0.2W
  - Maximum dimensions (W x D x H): 17.4 x 19.2 x 7.4 in
  - Weight: 43.7 lbs
  - In the box: main unit, quick start guide, AC cord, amp control cable, remote control cable, SP terminal wrench
  - UPC code: 747192137519
  - Crafted in Shirakawa, Japan
  - 5 year warranty
