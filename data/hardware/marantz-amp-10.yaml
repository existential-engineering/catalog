id: r3S0HWTRAtXr3r_iSWipT
name: AMP 10
manufacturer: marantz
primaryCategory: power-amp
url: https://www.marantz.com/en-us/product/power-amplifiers/amp-10/300586.html
description: A reference-level 16-channel power amplifier delivering 200 watts
  per channel, engineered for immersive home theater and high-end multichannel
  audio systems. The AMP 10 combines custom HDAM-SA2 circuitry with
  high-efficiency Class D switching amplifiers, and is hand-crafted in
  Shirakawa, Japan.
details: |-
  The Marantz AMP 10 is a 16-channel reference power amplifier built to drive immersive multichannel systems with authority and finesse. It pairs custom HDAM-SA2 amplification technology with bespoke Class D switching output stages to deliver 200 watts per channel into 8 ohms, or 400 watts per channel in BTL (bridge-tied load) mode for stereo or front-channel duties.

  Each of the 16 channels accepts either balanced XLR or unbalanced RCA input via a per-channel selector, feeding SPKT-1+ binding-post speaker outputs. Configurable output modes (Normal / Bi-Amp / BTL) allow flexible system architectures, from full 16-channel immersive setups to high-power bi-amped or bridged configurations.

  The iconic illuminated porthole level meter and premium metal front panel carry forward Marantz's signature industrial design, while hand assembly in Shirakawa, Japan ensures reference-grade build quality. The AMP 10 ships with a 5-year warranty.
specs: |-
  - 16 channels of amplification
  - 200W per channel (8 ohms, 1 kHz, 0.05% THD)
  - 400W per channel in BTL (bridged) mode
  - Custom HDAM-SA2 amplification technology
  - Class D switching output amplifiers
  - Selectable output modes: Normal / Bi-Amp / BTL
  - Per-channel balanced XLR or unbalanced RCA input selector
  - SPKT-1+ speaker binding posts (16)
  - Iconic illuminated porthole level meter
  - Premium metal front panel
  - Hand-crafted in Shirakawa, Japan
  - Power consumption: 500W operational / 0.2W standby
  - Dimensions: 17.4" x 19.2" x 7.4"
  - Weight: 43.7 lbs
  - 5-year warranty
