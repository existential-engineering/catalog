details: |-
  Superb precision and high output make the Sontronics SOLO mic a must-have for live performance, studio recording and home use. The Sontronics SOLO is a dynamic microphone that stands out from the crowd, delivering exceptional results at a price everyone can afford. The first dynamic microphone to be designed, developed and made in the UK, SOLO's high-output capsule reproduces all the presence, depth and clarity of your performance while minimising feedback and distortion. Whether you're using SOLO in the studio, on stage or even in a home environment, its supercardioid pickup will ensure superb off-axis rejection.

  The Sontronics SOLO has undergone a visual enhancement to the SOLO body, allowing versatility across the audio industry.
specs: |-
  - First Dynamic Mic Made in the UK : The first dynamic microphone designed, developed, and manufactured in the UK, ensuring top-tier quality and craftsmanship.
  - High-Output Capsule : Delivers exceptional presence, depth, and clarity, faithfully reproducing your performance while minimising feedback and distortion.
  - Precision Engineering : Every aspect, from its military-grade black anodised finish to laser engraving, reflects meticulous attention to detail and durability.
  - Supercardioid Pickup Pattern : Offers superb off-axis rejection, making it perfect for live performances, studio recordings, and home use, with minimal interference from surrounding noise.
  - Tuned Capsule : The capsule used in SOLO allows you to achieve excellent results right out of the box, providing excellent performance for those with limited control to tweak the signal.
  - Versatile Application : Ideal for vocals, guitar amps, kick drums, and snares, whether on stage, in the studio, or live-streaming from home. Consistently outperforms mics costing much more.
  - Solid Yet Lightweight : Weighing just 350g, it feels substantial and balanced in the hand, providing a comfortable grip during use.
  - Blind Test Champion : Frequently tops blind tests and mic shootouts, proving its superior performance compared to much more expensive microphones.
  - Supplied with Accessories : Comes with a mic clip and a zip-up pouch for secure storage and protection between sessions.
