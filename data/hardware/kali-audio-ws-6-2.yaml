details: |-
  The WS-6.2 takes up slightly more than one cubic foot. It is about the same size as most 8-inch studio monitors, or about half as large as comparably performing subwoofers. This makes it ideal for use under your desk, or in other positions where space is at a premium.

  The WS-6.2 uses two horizontally opposed 6.5-inch high-excursion woofers. The movement of the two woofers cancel each other out, giving you deep, clear, powerful bass without any vibration. A lack of vibration means that the subwoofer won't scoot across the floor, and it won't cause objects it might be touching to rattle or buzz. Using two woofers allows the WS-6.2 to have output similar to a subwoofer with a 10-inch driver while taking up far less space.

  Despite its diminutive size, the WS-6.2 is capable of 120 dB max SPL, and lower frequency extension down to 27 Hz. This makes it an ideal companion to almost any set of stereo studio monitors.

  With the LFE crossover, the WS-6.2 can be used on its own in small multichannel setups. For medium sized setups, including immersive mixing applications, another subwoofer can be added without breaking the bank.
