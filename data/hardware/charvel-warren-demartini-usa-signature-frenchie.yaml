description: A replica of the legendary Ratt guitarist's famed "Frenchie"
  guitar, featuring cross decals and a French tribute to James Dean reading "too
  fast to live, too young to die."
details: |-
  The Warren DeMartini USA Signature Frenchie is a faithful recreation of Warren DeMartini's iconic stage guitar, built around a Dinky-shaped alder body finished in Gloss Black with the Frenchie graphic.

  A bolt-on quartersawn maple neck features a hand-rubbed satin urethane finish and a Speed Neck profile with rolled fingerboard edges. The maple fingerboard carries a 12" to 16" compound radius, 22 jumbo stainless steel frets, and black dot inlays. Scale length is 25.5" with a 1.6875" Floyd Rose Original locking nut.

  Electronics pair a high-output Seymour Duncan Warren DeMartini RTM humbucker at the bridge with a Seymour Duncan Quarter Pound SSL-4 single-coil at the neck, controlled by a single volume knob and a 3-position toggle switch (bridge only / bridge+neck / neck only).

  Hardware includes a Floyd Rose Original double-locking 2-point tremolo, Floyd Rose retainer bar, Gotoh die-cast tuning machines, Gotoh strap buttons, dome-style control knobs, and a chrome finish throughout. The licensed Fender Stratocaster headstock and 4-bolt serialized neck plate round out the package, which ships with a Charvel hardshell case.
