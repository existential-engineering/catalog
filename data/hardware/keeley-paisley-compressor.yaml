details: |-
  The Compressor GC-2 in its limited edition Paisley finish is a high-fidelity compressor and limiting amplifier in stompbox format. It is built around the THAT Corporation 4320, using voltage controlled amplifiers, an onboard true-RMS detector and high performance op-amps.

  Where Keeley's earlier compressors were based on the CA3080 or LM13700 and aimed at a pronounced compressor effect, the GC-2 is designed for low noise and transparency. It handles large signals and has a bandwidth of over 20 kHz, and its full frequency range suits guitar, keyboards and drum machines as readily as guitar alone.

  The Threshold control sets the level at which peaks are caught, with a threshold indicator LED showing when the circuit is working, and the Compression control sets the ratio applied above that threshold. At minimum compression the ratio is 1:1 and the Gain control acts as a boost; at maximum it behaves as an above-threshold hard-knee limiter, which can keep an amplifier or speakers clear of clipping damage.

  Attack and release are governed by a single time constant, so both adapt to playing level and programme content, with attack times roughly a hundred times faster than release times. Keeley deliberately omits tone and blend controls, on the grounds that a blend control works against the compression and that both add noise.
specs: |-
  - - Controls: Threshold, Compression ratio, Gain
  - - THAT Corporation 4320 VCA with onboard true-RMS detector
  - - Voltage input: 9.6V
  - - Current draw: 15mA
  - - Input impedance: 1 Mohm
  - - Output impedance: 100 ohm
  - - Output voltage gain: +30dB boost
  - - Bandwidth: over 20 kHz
  - - Total harmonic distortion: 0.1%
  - - Noise: -95dBV
  - - Threshold indicator: dual LED
  - - Attack time: typically 15ms for 10dB, 5ms for 20dB, 3ms for 30dB
  - - Release time: typically 8ms for 1dB, 40ms for 5dB, 80ms for 10dB, 160ms for 20dB, 240ms for 30dB
  - - No tone or blend control
