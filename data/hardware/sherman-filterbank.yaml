description: >-
  The Sherman FilterBank is a dual analog filter and distortion processor renowned for its
  aggressive sound-mangling capabilities. Featuring genuine 24dB/octave 4-pole filters
  with LFO, ADSR envelope, and input signal modulation, it excels at producing dramatic
  filter sweeps and extreme overdrive effects. It has been adopted by prominent electronic
  artists including The Chemical Brothers, Fatboy Slim, and Stereolab.
details: |-
  The Sherman FilterBank is a dedicated analog filtering and distortion unit originally produced in 1997 by Sherman Electronics. It was designed as a hands-on sound processing device for creating everything from subtle filter sweeps to extreme sonic destruction, making it a favorite among electronic music producers and live performers.

    At its core, the FilterBank features dual 24dB/octave 4-pole filters capable of low-pass, band-pass, high-pass, and notch modes with resonance control. The filters can operate independently in mono mode or be linked for stereo processing. Modulation sources include a built-in LFO, an ADSR envelope generator, and the ability to use the input signal itself as a modulation source, providing a wide range of dynamic filtering possibilities.

    The unit is particularly celebrated for its overdrive circuit, which can push signals from warm saturation into full-blown distortion territory. This combination of high-quality analog filters and aggressive overdrive has made it especially popular for processing drum loops, synthesizer lines, and DJ sets. Notable users include William Orbit, Fluke, Fatboy Slim, BT, Stereolab, The Crystal Method, Groove Armada, and The Chemical Brothers.

    True to its analog heritage, the FilterBank has no memory or preset storage, encouraging a hands-on, performance-oriented workflow where every sound is dialed in manually.
