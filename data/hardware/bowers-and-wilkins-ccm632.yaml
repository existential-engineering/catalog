details: |-
  CCM632 is a passive single-driver in-ceiling loudspeaker in the Bowers & Wilkins Performance Series, designed for installations that need to squeeze into small spaces or use several speakers for diffuse background sound.

  Bowers & Wilkins argue that small in-ceiling speakers are difficult to get right: too small a driver leaves no bass without adding a subwoofer, while the common two-way alternative puts the tweeter in front of a small bass/midrange driver so that driver fires around the tweeter body, leading to colouration.

  CCM632 instead uses a single 75mm (3in) black glass fibre cone full-range driver, which sidesteps those issues while still occupying less than 150mm (6in) of installed diameter. The frame is 147mm across, the cut-out 120mm, and the unit sits 100mm behind the mounting surface with a 5.5mm protrusion.

  It features the Bowers & Wilkins ZipDogs fixing method, which speeds up installation and copes with almost any thickness of mounting panel. Each speaker comes with an integral enclosure to minimise acoustic bleed into adjoining spaces.

  Speakers are supplied in pairs, with each pack including round and square magnetically fixed, fully customisable grille and bezel assemblies. Frequency range is 100Hz to 17kHz (-6dB) with a response of 112Hz to 16kHz (±3dB), sensitivity of 84dB (2.83V, 1m), a nominal impedance of 8Ω (5Ω minimum) and a recommended amplifier power of 10W to 60W.
