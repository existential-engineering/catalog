description: The CCM632 is a single 75mm (3in) full-range driver with a
  beautifully well-balanced sound, that sidesteps traditional small speaker
  issues yet still takes up less than 150mm (6in) diameter space installed. The
  CCM632 also features Bowers & Wilkins innovative ZipDogs fixing method.
details: |-
  CCM632 is a Performance Series in-ceiling speaker built around a single 75mm (3in) black glass fibre cone full-range driver. Bowers & Wilkins designed it for small spaces, and for use in multiples where diffuse background sound is wanted rather than a stereo image.

  The single full-range driver is the point of the design. Bowers & Wilkins argues that a small in-ceiling two-way puts the tweeter in front of the bass/midrange cone, so the cone fires around the tweeter body and colours the sound, while a driver made small enough to avoid that cannot produce bass without a subwoofer. One full-range driver sidesteps both problems in an installed footprint under 150mm (6in) in diameter.

  Installation uses the ZipDogs fixing method, which Bowers & Wilkins describes as making short work of the job and coping with almost any thickness of mounting panel. The frame is 147mm (5.8in) across, the cut-out 120mm (4.75in), and the speaker needs 100mm (4in) of depth behind the surface while protruding only 5.5mm (0.22in) into the room. The matching pre-mount kit is the PMK C3.

  Each speaker comes with an integral enclosure to minimise acoustic bleed into adjoining rooms, so no separate back box is required. Speakers are supplied in pairs, and each pack includes both round and square magnetically fixed, fully customisable grille and bezel assemblies.

  It is a passive loudspeaker: 8 ohms nominal with a 5 ohm minimum, 84dB sensitivity, and a recommended amplifier power of 10W to 60W, driven from an external amplifier or a distribution amplifier.
specs: |-
  - Description: single driver in-ceiling system
  - Drive units: 1x 75mm (3in) black glass fibre cone full-range driver
  - Frequency range (-6dB): 100Hz to 17kHz
  - Frequency response (+/-3dB): 112Hz to 16kHz
  - Recommended amplifier power: 10W to 60W
  - Sensitivity: 84dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (5 ohms minimum)
  - Frame: 147mm (5.8in) diameter
  - Cut-out: 120mm (4.75in) diameter
  - Depth behind surface: 100mm (4in)
  - Protrusion: 5.5mm (0.22in)
  - Pre-mount kit: PMK C3
  - Back box: integral
  - Grille options: square and round grilles included, magnetically fixed and fully customisable
  - ZipDogs fixing method, suits almost any mounting panel thickness
  - Supplied in pairs
  - Finish: Black
