details: |-
  Developed to meet the needs of a beginning 4-10 year old drummer, The Pocket Kit is an all-inclusive drum set designed by Questlove of The Roots. This premium entry-level drum set contains all the essentials in one box, including introductory lessons. Start your child's musical journey with a quality drum set and see them groove to the beat of their drum.

  Premium all-in-one package designed for 4-10 year old drummers, affordable for most families, and offered as an exclusive set by Questlove with free introductory lessons included.
specs: |-
  - Bass drum: 16"
  - Tom tom: 10"
  - Floor tom: 13"
  - Snare drum: 12"
  - Included hardware: foot pedal, hi hat stand, cymbal arm, snare stand
  - Included accessories: drum throne, drum sticks, drum key, heads
  - Included cymbals: hi hats, crash/ride cymbal
  - Includes free introductory lessons
  - Available finishes: Sugar Sparkle, Moon Dust, Crystal Blue Sparkle
