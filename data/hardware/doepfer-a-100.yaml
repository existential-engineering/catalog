description: >-
  The system that launched the Eurorack format, Doepfer's A-100 is a fully analog modular
  synthesizer offering over 65 interchangeable modules for virtually unlimited sound design.
details: |-
  Introduced in 1995 and still in production, the Doepfer A-100 is arguably the most significant modular synthesizer system of the modern era. It established the Eurorack format that would go on to become the dominant standard for modular synthesis worldwide, spawning an entire industry of compatible third-party modules.

  The system supports an enormous range of synthesis techniques including subtractive, additive, FM, wavetable sequencing, and vector synthesis. With over 65 available modules, users can build anything from a simple monosynth to an elaborate multi-voice system. Filter options alone span 24dB lowpass, highpass, bandpass, 12dB variants, and emulations of classic topologies like the WASP, Oberheim, and TB-303 designs.

  Control options are equally extensive. Beyond traditional CV/Gate and MIDI, the system accommodates footswitch control, light sensors, and even theremin antennas. Sequencing modules provide both analog and trigger-based pattern generation. The system ships without memory storage, staying true to the patch-cable philosophy where every sound is a unique physical configuration.

  Notable users of the A-100 system include Kraftwerk, Hans Zimmer, Nine Inch Nails, Steve Roach, and the Human League, demonstrating its versatility across electronic, film scoring, and experimental music contexts.
specs: |-
  - Polyphony: Up to 4 voices per MIDI channel (expandable)
  - Oscillators: 1 to unlimited (modular configuration)
  - LFOs: 2 standard + 1 sample & hold + 1 VCF-LFO
  - Filters: Multiple options including 24dB LP/HP/BP, 12dB variants, WASP/Oberheim/TB-303 types
  - VCA: Multiple amp and ADSR envelope modules
  - Effects: Pitch shifter, phaser, distortion, spring reverb, frequency shifter, waveshaper
  - Sequencers: Clock sequencer, analog/trigger sequencer, quad sequential switch
  - Memory: None (patch-based only)
  - Keyboard: Optional (sold separately)
  - Control: MIDI, CV/Gate, footswitch, light sensor, theremin antenna
