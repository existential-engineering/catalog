details: |-
  The C10 Deluxe is a parlor-sized acoustic guitar with a narrow waist and small upper bout resulting in a precise, focused response. It takes inspiration from early twentieth century parlor guitar designs from the same era as the OM model. The Deluxe version upgrades the standard C10 with East Indian rosewood back and sides, ivoroid binding on the fingerboard and peghead, a deluxe maple/rosewood backstrip, and enhanced top purfling. The Sitka spruce top uses a pre-war scalloped X-brace construction. Nickel Waverly tuners, an ebony bridge and fingerboard with mother-of-pearl long dots, and bone nut and saddle complete the premium appointments. The compound 14"-26" fingerboard radius and C-shape neck profile provide comfortable playability.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Neck Profile: C-shape
  - Neck Joint: Mortise & tenon hybrid
  - Scale Length: 25 1/2"
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Fingerboard: Ebony with MOP long dots
  - Fingerboard Radius: 14" - 26" compound
  - Fingerboard Binding: .100" ivoroid with b/w purfling
  - Frets: Medium 18% nickel-silver
  - Bridge: Ebony straight-style, 2 3/16" spacing
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Brace Material: Sitka spruce
  - Brace Pattern: Pre-war scalloped X-brace
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Rosette: Ivoroid with b/w purfling
  - Backstrip: Deluxe (maple/rosewood)
  - Peghead Profile: Haircut
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Peghead Veneer: Ebony with MOP Collings logo
  - Tuners: Nickel Waverly
  - Truss Rod: Fully adjustable
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 14 3/4"
  - Body Length: 19 1/4"
  - Body Depth: 4 1/4"
  - Total Length: 40"
  - Strings: D'Addario EJ-16 (.012" - .053")
