description: GAMMA is a Eurorack module featuring dual squaring and logarithm
  functions used to shape control voltage or luma ramps into curves, circles,
  and four-point star shapes.
details: |-
  GAMMA features dual squaring and logarithm functions to adjust the light/dark distribution of provided luma signals. Also featured are two averaged outputs which mix both of the above square and log results to easily create circles and four-point stars given a Horizontal- and Vertical-triangle ramp. Square and Log functions may be used to shape the curves of Control Voltages, adjust the gamma of luma signals and process ramps into soft-edged shapes. Each gamma shaping sub-circuit is functionally identical but patching both a horizontal and vertical triangle ramp or oscillator will result in circles and four-point stars at the bottom two outputs. Patch the Circle and Star outputs into keyers for hard edges or into faders to modulate between the shapes.
