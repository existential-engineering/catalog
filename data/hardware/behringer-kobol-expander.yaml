description: The KOBOL EXPANDER is a duophonic analog synthesizer whose 2 VCOs
  morph between 7 waveforms and offer oscillator sync and pulse width
  modulation, bringing the original 1970s circuits back to life. A unique 4-pole
  VCF supplies the natural saturation found only in Kobol synths.
details: |-
  Master the waves and shape them in any way you want. The Behringer KOBOL EXPANDER is about to be your latest spell book in an infinite sea of beats, pulses and voltages.

  The Behringer KOBOL EXPANDER is a duophonic analogue synthesizer featuring 2 VCOs allowing morphing between 7 waveforms, oscillator synchronization and pulse-width modulation that bring back to life the original circuits of the 70s. A unique 4-pole VCF also provides this natural saturation only found in "Kobol" synths.

  If you want to push the KOBOL EXPANDER even further, the analogue LFO has two selectable waveforms that can be connected to multiple external modules or synths to achieve more complex sounds. A built-in noise generator and voltage processor let you extend the possibilities even further to create spicier sounds.

  The KOBOL EXPANDER can easily be integrated into any sized setup with its 32 patch points you can use to connect to any module or synth in your arsenal.

  The KOBOL EXPANDER is designed to fit into a standard Eurorack case. Just connect the power cables to the power supply and mount the module using the included screws, so the KOBOL EXPANDER can be mixed with other synth modules for a truly unique setup.
specs: |-
  - Duophonic analog voice architecture
  - 2 VCOs with morphing between 7 waveforms, oscillator sync and pulse width modulation
  - Unique 4-pole "Kobol" VCF design for natural saturation
  - Pure analog signal path based on authentic VCO, VCF and VCA designs
  - Analog LFO with 2 selectable waveforms and multiple modulation destinations
  - Noise generator and voltage processor
  - 32 patch points for modular connection to external equipment
  - 31 panel controls for real-time access to all important parameters
  - External audio input for processing external sound sources
  - 16-voice Poly Chain for up to 16-voice polyphony across multiple units
  - MIDI implementation with selectable MIDI channel and voice priority
  - Main module transferable to a standard Eurorack case, mounting screws included
