description: The MICROPHONE PREAMPLIFIER 502 brings the award-winning Midas
  microphone preamp to the 500 Series format, available as an add-on to any
  mobile or recording system when used with the LEGEND L10, L6, or other
  standard 500 Series rackmount chassis. Considered by leading live sound and
  recording engineers as the very essence of the famous Midas sound, the preamp
  has been upgraded with four discrete ultra low noise input transistors and
  retains the soft clipping characteristic that provides crystal-clear
  audiophile reproduction with just the right amount of harmonics. The 502 also
  honours the legacy of the XL4 console by bringing back its swept low and high
  pass filters. A 12-position rotary switch sets gain from 0 to +60 dB in 5 dB
  increments, while a fully variable output trim potentiometer adds another ±20
  dB of range for up to +80 dB of total gain. The input stage accepts signal
  levels up to +24 dBu without requiring a pad. Outputs are electronically
  balanced by default, with a switchable transformer-balanced output (TX) for
  additional tonal character.
details: |-
  Front panel controls include a 12-position gain rotary switch (0 to +60 dB), a fully variable output trim potentiometer (±20 dB), and swept low pass (1 kHz–40 kHz) and high pass (10 Hz–400 Hz) filter controls. LED-illuminated switches engage the low pass filter, high pass filter, phase reverse (180°), 48 V phantom power, and the transformer-balanced output (TX). Dual 11-segment LED meters indicate input and output levels from -20 to +20 dBu in 4 dB steps. The input stage uses four discrete ultra low noise transistors and exhibits the soft clipping behaviour characteristic of the Midas mic preamp. As a 500 Series module, audio I/O is provided by the host 500 Series rackmount chassis (e.g. Midas LEGEND L10 or L6).
specs: |-
  - Format: 500 Series module
  - Gain Range: 0 to +60 dB in 5 dB increments (12-position rotary switch)
  - Output Trim: ±20 dB, fully variable potentiometer
  - Total Maximum Gain: +80 dB
  - Maximum Input Level: +24 dBu (no pad required)
  - Low Pass Filter: Swept, 1 kHz to 40 kHz (-3 dB points)
  - High Pass Filter: Swept, 10 Hz to 400 Hz (-3 dB points)
  - Output Type: Electronically balanced (default) or transformer balanced (TX switch selectable)
  - Input Meter: 11-segment LED, -20 to +20 dBu in 4 dB steps
  - Output Meter: 11-segment LED, -20 to +20 dBu in 4 dB steps
  - Phantom Power: 48 V, switchable (LED illuminated)
