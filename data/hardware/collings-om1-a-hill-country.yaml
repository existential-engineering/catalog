description: The OM1 A HC is part of Collings' Hill Country series, designed to
  deliver a strong fundamental voice that is both warm and woody with a dry
  character and full low end. Built with an Adirondack spruce top and Honduran
  mahogany back, sides, and neck, it features Hill Country scalloped X-bracing
  for distinctive tonal character. The guitar is particularly well suited to
  bluegrass players while remaining versatile across musical styles.
details: |-
  The OM1 A HC is a Hill Country Series Orchestra Model that pushes the tonal spectrum toward a strong fundamental, warm and woody character with a dry quality and full low end. Construction features a mortise & tenon hybrid neck joint, fully adjustable truss rod, and a Hill Country scalloped X-brace with an abbreviated soundboard graft (tongue brace). The compound radius fingerboard (14"-26") provides playing comfort across the neck. Appointments include relic nickel Waverly tuners, ebony bridge and fingerboard with gold MOP dot inlays, aged bone nut and cut-through saddle, hand-poured tortoise pickguard with matching rosette ring, and tortoise body binding.
specs: |-
  - Top: Adirondack spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Brace Material: Sitka spruce
  - Brace Pattern: Hill Country scalloped X-brace (abbreviated soundboard graft / tongue brace)
  - Construction: Hill Country Build and Voicing
  - Neck Joint: Mortise & tenon hybrid
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Nut Width: 1 3/4" aged bone
  - Saddle: Aged bone, cut-through
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Bridge Pins/End Pin: Ebony
  - Fingerboard: Ebony with gold MOP dots
  - Fingerboard Binding: Ebony
  - Frets: Medium 18% nickel-silver
  - Tuners: Relic Nickel Waverly
  - Truss Rod: Fully adjustable
  - Body Binding: Tortoise
  - Backstrip: 1-style (walnut)
  - Rosette: Hand-poured ring from matching pickguard set
  - Pickguard: Hand-poured tortoise with matching rosette ring, wedge, and heel cap
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss ultra-thin nitrocellulose lacquer
  - Strings: D'Addario EJ-16 (.012"-.053")
