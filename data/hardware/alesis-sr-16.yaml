description: >-
  The Alesis SR-16 is a 16-bit drum machine featuring over 200 natural and electronic drum
  sounds, 50 preset rhythm patterns, and comprehensive MIDI programming capabilities.
details: |-
  The SR-16 provides comprehensive MIDI programming and implementation for serious programmers and those utilizing it as a sound module. It includes more than 200 drum and rhythm samples available in both dry form and with reverb effects. A Dynamic Articulation feature allows drum tones to vary based on strike intensity, creating more expressive and natural-sounding performances.

  The machine comes equipped with fifty preset rhythm patterns, each featuring A and B variations plus A and B fills, totaling four distinct rhythms per pattern. Users can create and save customized patterns and songs for personalized compositions. The device supports four separate outputs, twelve velocity-sensitive pads, and 16-voice polyphony with step editing capabilities.

  While the SR-16 functions as a powerful and capable drum machine, reviewers note it ultimately sounds like a machine. The synthetic quality, though useful for accompaniment purposes, cannot match the warmth and authenticity of acoustic drums, real loops, or modern percussion software. Nevertheless, it has been a trusted tool for numerous musicians over many years, with notable artists like Autechre and Vangelis incorporating it into their work.
specs: |-
  - 16-voice polyphony
  - 233 drum sounds organized in 50 user and 50 preset kits
  - 400 total patterns (200 user, 200 preset) with 12,000 note capacity
  - 100 song slots
  - 16-bit samples / 18-bit DAC
  - 12 velocity-sensitive pads with Dynamic Articulation
  - 4 audio outputs
  - MIDI implementation for kit changes and synchronization
  - Tempo range: 20-255 BPM
  - Panning and reverb effects
  - Step editing
  - 2 foot-switch jacks (start/stop and fill control)
releaseDate: "1990"
releaseDateYearOnly: true
