details: |-
  The G&L Comanche is Leo's final word on the traditional double-cutaway bolt-on axe. The first thing anyone notices about the Comanche is the distinctive shape of the Magnetic Field Design Z-Coil pickups designed by Leo Fender himself. These pickups deliver a bright and sparkly top end while offering a robust bottom end, all without any 60-cycle hum.

  There is plenty of power in the Z-coil pickups, but what's surprising is how glassy and detailed they become as the volume and bass controls are rolled back, the latter a part of the Comanche's PTB (Passive Treble and Bass) system. What's more, the Tribute Series Comanche includes an expander switch on the treble pot to allow neck+bridge or all three pickups together. In a pinch, the neck+bridge combo does a convincing faux ASAT Special.

  The new G&L Tribute Series Comanche features the power of MFD pickups and a Poplar body. Making the most of this combination is Leo's Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  The Comanche was the very last double-cutaway bolt-on guitar designed by Leo Fender, the culmination of everything he had learned during his lifetime.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD Z-Coil hum-cancelling
  - Body wood: Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), push/pull expander on treble pot enabling additional pickup combinations of neck+bridge or all three pickups together
  - Available in: Olympic White over Poplar body, tortoise pickguard, Rosewood fingerboard
  - Available in: Emerald Blue Metallic over Poplar body, pearloid pickguard, Maple fingerboard
