description: The VX 8 is an 8" Dual Concentric full-range loudspeaker for
  portable and installation applications.
details: |-
  The VX 8 is an 8" Dual Concentric full-range loudspeaker for portable and installation applications. It delivers a compact yet punchy and sonically articulate solution for small-scale performance sound reinforcement, background music, and high-intelligibility speech applications. The 520-Watt 200 mm (8") constant directivity Dual Concentric drive unit provides precise 90° dispersion for optimum coverage and exceptional forward gain. The trapezoidal enclosure supports FOH, floor monitor, delay, and stage front fill deployment. Rear panel carries industry-standard twist-locking speaker and barrier strip connectors for input and link connections.
specs: |-
  - frequencyResponse: 85 Hz – 35 kHz (±3 dB); 62 Hz – 45 kHz (−10 dB)
  - nominalDispersion: 90° conical @ −6 dB point
  - directivityFactorQ: 6.8
  - directivityIndexDI: 7.9 dB
  - sensitivity: 92 dB (1 W @ 1 m)
  - maxSPLContinuous: 113 dB
  - maxSPLPeak: 119 dB
  - powerHandlingContinuous: 130 W
  - powerHandlingPeak: 520 W
  - components: 1 × 8" (200 mm) constant directivity Dual Concentric
  - connectors: 2 × 4-pole industry-standard twist-lock speaker connectors; 1 × barrier strip terminals
  - dimensionsHxWxD: 389 × 281 × 276 mm (15.3" × 11.1" × 10.8")
  - netWeight: 8.1 kg (17.8 lbs)
  - construction: 15 mm (5/8") plywood, vented and internally braced
  - grille: Powder coated perforated steel
