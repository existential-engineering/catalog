description: 100W High Gain, Multi-channel Amp in a Pedal with user programmable
  presets and our award winning speaker simulator, CabRig.
details: |-
  AMPED 3 is a 100 Watt pedal multi-channel amplifier. It features one of the highest gain circuits that Blackstar has ever developed and with the ability to recall your favourite tones via presets. AMPED 3 is capable of delivering the tone and feel of traditional valve amps. You can use it in the front end of a traditional amp, power a cabinet at 100 Watts or go direct, ensuring you can take your sound with you anywhere. Power reduction down to 1W and USB-C connectivity ensure it's equally at home in the studio or on the stage.

  The power amplifier's unique, high-headroom design does not compromise on output even at 16 Ohms. Get maximum power and optimum tone with any cabinet set-up at 8 or 16 Ohms. Blackstar's patented Response control offers distinctly different and authentic power valve responses and guitar amp dynamics.

  Fine-tune your cabinet, mic, and room simulations with IR based CabRig technology and output via XLR or stereo jack. Alternatively, connect via USB for effortlessly simple recording to your DAW without the need for an interface.

  Channel Presets can be set, and saved to AMPED 3 directly from the unit or via Architect software. Presets are quick and simple to set up and store to the device allowing you to recall your favourite Clean, Crunch and OD tones on the go.

  Dept 10. AMPED 3 is universal voltage so can be used anywhere in the world from 100V to 240V ~ 50/60Hz. Just stick it in your gigbag and hop on that plane.
specs: |-
  - 100W Class D power amp with high-headroom design
  - Three channels: Clean (Clean Bright, Clean Warm), Crunch (Crunch, Super Crunch), Overdrive (OD1, OD2)
  - EQ: Bass, Middle, Treble, ISF (Infinite Shape Feature)
  - Power Reduction switch: 100W, 20W, 1W
  - Response switch with three power valve voicings: EL84, EL34, 6L6
  - Built-in Boost (Pre or Post)
  - Built-in Reverb with Dark and Light modes plus Freeze function
  - IR-based CabRig speaker simulator with XLR D.I. output
  - USB-C audio (4 channel) for direct DAW recording
  - User programmable Clean, Crunch and Overdrive presets
  - FX loop (series or parallel selectable in Architect)
  - MIDI control
  - Speaker outputs: 8 Ohm, 16 Ohm
  - 2x 9V DC outputs (500mA combined max) for powering other pedals
  - Universal voltage: 100V to 240V ~ 50/60Hz
  - Free Architect editor software for deep tone editing
  - Weight: 1.96 kg
  - Dimensions: 288 x 80 x 149 mm
