description: The DN9344E Helix Quad delivers the functionality of two complete
  DN9340E units in a single rack space, offering four discrete 31-band graphic
  equaliser channels or two stereo-linked pairs. Each channel inherits the full
  DN9340E feature set, including parametric filter bands, threshold-dependent
  equalisation, a full-function delay line and Classic KT emulation modes.
details: |-
  The Helix Quad packs four discrete 31-band graphic equaliser channels, or two stereo-linked pairs, of the Klark Teknik digital signal-processing platform into one rack space.

  Each channel inherits the full DN9340E feature set: 31-band graphic equalisation with the Proportional-Q response curve, parametric filter bands, threshold-dependent equalisation that engages only when the input signal exceeds a defined level, a full-function delay line for loudspeaker time-alignment, and Classic KT emulation modes recreating the behaviour of the analogue DN300, DN360 and DN3600 references.

  Configuration flexibility between four independent channels and two stereo-linked pairs adapts the unit to mains, monitors, fills or zoned installations from a single chassis.

  Remote Ethernet control enabled centralised parameter management across racks of Helix units, and the unit was a workhorse of major touring productions and fixed installations through its production life.

  Although now obsolete, its sonic signature remains a reference; service guidance and legacy documentation continue through Music Tribe Care.
specs: |-
  - Four discrete digital graphic equaliser channels, 31 bands per channel
  - Configurable as four independent channels or two stereo-linked pairs
  - Proportional-Q response curve
  - Parametric filter bands per channel
  - Threshold-dependent (dynamic) equalisation per band
  - Full-function delay line per channel for loudspeaker time-alignment
  - Classic KT emulation modes for DN300, DN360 and DN3600
  - Remote Ethernet control for centralised parameter management
  - Single rack space chassis
