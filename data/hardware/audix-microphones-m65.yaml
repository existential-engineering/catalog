details: |-
  The only tabletop microphone that swivots.

  The M65 is an excellent alternative to a standard gooseneck microphone for education, conference rooms, and government applications. The M65's socket swivel mount is so innovative, we had to invent a word to describe it. Swivoting technology gives the M65 a fluid, quiet, and consistent 240° rotation and a 40° pivot, while retaining the crisp lines of individually-machined, brass solid-tube construction. Swivoting also ensures a uniform mic position for a more consistent gain structure when multiple M65s are in use and lets the M65 lie flat for an unobstructed view when not in use.

  The M65's superb sound quality starts with the award-winning audibility of the MicrosTM circuitry. All electronics are fully integrated preamp circuitry with high sensitivity and low noise. Signal output is balanced to eliminate RF interference caused by cell phones and mobile devices.

  Installing the M65 only requires drilling one 1 1/4″ hole and three 1/8″ holes into a surface, with no additional tools needed. The M65's mounting hardware easily secures the microphone in place.

  All M65 microphones are finished in an exquisite black nickel plating and come with an 8-foot cable terminating in terminal block connectors. Both male and female terminal block connectors are provided. Built to withstand daily use, the M65 also comes with a threaded field replaceable foam windscreen to reduce plosives.

  Especially suited to applications where aesthetics, ease of installation, and sound quality are crucial, the M65 is an excellent alternative to a standard gooseneck microphone for government, courtroom, boardroom, video teleconferencing (VTC), distance learning, house of worship, and hospitality applications.
