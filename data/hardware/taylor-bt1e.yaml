details: |-
  The BT1e is a 3/4-size acoustic-electric in Taylor's Baby Taylor series — compact and travel-friendly with full acoustic tone. The torrefied spruce top delivers warmth and projection beyond its small footprint, while layered walnut back and sides provide tonal consistency and humidity resilience.

  ES-B electronics with a built-in digital chromatic tuner make the guitar immediately stage-ready. The 22-3/4" scale length and slender mahogany neck reduce string tension for comfortable fretting. Ebony fretboard and West African Crelicam Ebony bridge complement the natural tone.

  Ships with a Taylor gig bag and D'Addario XS Coated Phosphor Bronze Light strings.
specs: |-
  - - Body style: Baby Taylor (3/4 size)
  - Top: Torrefied Spruce (solid, varnish)
  - Back/sides: Walnut (layered, varnish)
  - Neck: Mahogany (varnish)
  - Fretboard: Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 22-3/4"
  - Inlays: 4mm dots
  - Tuners: Die-Cast Chrome
  - Electronics: ES-B with built-in digital chromatic tuner
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Taylor gig bag included
