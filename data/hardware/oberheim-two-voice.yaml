description: >-
  The Oberheim Two Voice is a duophonic analog synthesizer built by coupling two SEM
  (Synthesizer Expander Module) modules to a 37-note keyboard and an analog step
  sequencer. Introduced in 1975, it was one of the earliest programmable polyphonic
  synthesizers, predating most competing designs from ARP and Moog. Notable users include
  Vince Clarke and Vangelis.
details: |-
  Oberheim's first synthesizer was the single-voice SEM (Synthesizer Expander Module), a compact analog voice module. In 1975, Tom Oberheim created the Two Voice by hard-wiring two SEM modules into a 37-note keyboard enclosure alongside a simple analog sequencer, producing one of the first commercially available polyphonic synthesizers.

    By 1976, Oberheim introduced the Polyphonic Synthesizer Programmer, which could memorize control voltages for up to eight SEM modules. When paired with the Two Voice, this created one of the earliest programmable and polyphonic instruments. The same year saw the release of the Four Voice with four SEMs and a larger 49-note keyboard, followed in 1977 by the Eight Voice with eight SEMs.

    A notable limitation of the Two Voice is that each voice requires independent programming since the two SEMs are separate modules. Each voice has its own filter, making real-time filter sweeps across both voices a challenge. The integrated mini sequencer helped manage independent voice control and added performance flexibility.

    Despite its innovative design, the Two Voice was eventually overshadowed by more advanced monophonic and truly polyphonic synthesizers. It remains a sought-after vintage instrument prized for the distinctive warm sound of its SEM filter topology.
specs: |-
  - Polyphony: 2 voices
    - Oscillators: 4 VCOs (2 per voice), sawtooth and variable-pulse waveforms
    - LFO: Triangle wave
    - Filter: 2x multimode lowpass filters with cutoff and resonance, modulatable by LFO, envelope, or external sync
    - VCA: 2x with Attack, Decay, and Sustain envelope
    - Keyboard: 37 keys
    - Sequencer: Mini Sequencer, 8 steps, 2 voices
    - Control: CV/Gate
    - Production years: 1975–1979
