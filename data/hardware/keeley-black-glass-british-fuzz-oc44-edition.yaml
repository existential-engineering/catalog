details: |-
  This is a 20-piece anniversary edition of the Black Glass British Fuzz, hand sanded, with a custom back, hand signed and numbered to 20 pieces.

  The pedal is Keeley's hand-crafted, modernised MkIII-style British fuzz circuit, built here with very rare British-made Mullard OC44 black glass transistors drawn from Robert Keeley's private stock. The OC44 devices have slightly more gain and produce more fuzz than the OC81 version.

  The circuit is a Neo-Vintage reworking of the Mark III. It has a power supply inversion so it can run from an ordinary nine volt, negative tip supply like any modern pedal, and modifications to the fuzz and tone controls pass more tone and harmonic content than the original circuit.

  The page records several later additions to the run: further genuine vintage NOS Mullard OC44 transistors originally intended for early Java Boost pedals were added in October 2014, more units were built in January 2015 and all OC44 units were then hand sanded, and a few more were added in April 2015, with only a handful more planned.
