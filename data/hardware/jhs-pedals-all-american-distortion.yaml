description: A versatile RAT-inspired distortion pedal with LED/Silicon/Open
  clipping switch and a sweep knob for precise gain structure control.
details: |-
  One of the most sought after effects in history is the vintage RAT that has been raised high by everyone from David Gilmore to Jeff Beck. It's known for its unbelievable range of tones that span from clean/grit all the way to compressed sustaining fuzz. By popular demand and the cheap construction of the current reissues we decided to take on the task of introducing our very own version of an American classic that to our surprise has more options and mojo than we originally set out for.

  First off the All American offers a more focused frequency range than any pedal in its class. The bass and mids melt perfectly into a combination that can make a 1x12 combo sound as if you have a stack of cabs backstage. The spiky and brutal highs of the original design have been tamed and are now submitting in a very pleasing way that allows you to actually use the tone/filter knob past 25%. Our biggest addition is our sweep knob that gives you instant control over the gain structure as a whole. This allows for perfect and precise tuning of the breakup and clipping in the circuit. We decided we wouldn't stop there but instead add a three way mini gain switch that allows LED/Silicon/Open clipping for one explosively versatile pedal!

  Soaring sustain and heavy overdrive that bites at your ankles make the All American a force to be reckoned with.
