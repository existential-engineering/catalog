details: |-
  SAM-C is our first 0HP module. To introduce this new range we wanted to take advantage of the benefits of passive modules. But we also wanted to incorporate as many features as possible. The result is SAM-C, a small module that takes up no space in your rack and can perform many simple but useful utility functions. SAM-C can be used as Attenuator, Multiple, Mixer and Crossfader. To learn more about SAM-C and discover our patch ideas, feel free to take a look at the manual available in the Files section below.
