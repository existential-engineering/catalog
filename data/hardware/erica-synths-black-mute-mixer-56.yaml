description: Compact mixer with mute switch.
details: |-
  The Black Mute Mixer is a compact, high quality audio mixer with bonus features: a mute switch on each input and three buffered outputs, in 6HP.

  The mixer allows audio signals to be added to a mix instantly and at exactly the right level, and the mute switches mean a channel can be dropped and brought back without touching its level control.

  The three buffered outputs send the mix to several post-mixer devices simultaneously. Splitting the output to a low pass and a high pass VCF, for example, creates advanced bandpass and notch filters.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Input and output protection is fitted along with protection against a reversed PSU connection.

  Maximum input signal level runs between -10V and +10V at unity mixer gain, the panel is 6HP wide at a depth of 25mm, and power draw is 8mA on each of the positive and negative rails.
specs: |-
  - 3 AC coupled inputs
  - Mute switch on each input
  - 3 buffered outputs
  - Input and output protection
  - Protection against reverse PSU connection
  - Max input signal level -10V - +10V
  - Mixer gain 1
  - Power consumption +8mA, -8mA
  - Module width 6HP
  - Module depth 25mm
