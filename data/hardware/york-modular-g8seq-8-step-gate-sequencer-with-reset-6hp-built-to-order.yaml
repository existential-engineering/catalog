description: An 8-step Eurorack gate sequencer module producing sequential 10V
  gate outputs, with clock and reset inputs, resetting to step 1 on power up.
details: |-
  THIS MODULE IS BUILT TO ORDER - current lead time is 5-7 working days. Take a CV sequencer, replace the pots with jacks and you've got a gate sequencer. It works in the same manner as any other sequencer except that the output, in this case, is a sequential 10V gate. As one of my 'high turnover' modules (ie. I sell a lot of 'em) the bulk of the assembly is now handled by the board fabricators with the final assembly and testing taking place 'in house'. There are several advantages to this: first, I can take advantage of the fact that parts from the fabricator are very cheap (economies of scale etc.) and second, I spend far less time faffing around with surface-mount components, leaving me to do final fitting of any through-hole parts plus any testing. It's a lot more useful than it sounds and pairs well with a lot of other modules such as clock dividers, logic modules etc. for those who want to do weird polyrhythmic stuff. Even better, if you don't want a straight 8 beats you can route the appropriate output into the reset jack (eg. want 5 beats to the bar? Simply patch output #6 to the reset jack and job's a good'un)

  In other respects it acts much like its CV-oriented sibling - it resets to step 1 on power up, and has both clock and reset inputs. If you've got a load of uncommitted attenuators you could even fake up a CV sequencer ... Also available as a partial build 🔗

  6HP wide, approximately 15mm deep.
