details: |-
  1.2mm Hammered Steel Shell: Characterized by its unique hammering process, this steel shell produces a bright and dry sound with complex & rich tone.

  2.3mm Steel Mighty Hoop (10 hole): TAMA's triple flanged 2.3mm steel hoops provide a "wetter" sound than die-cast zinc hoops.

  20-strand Starclassic Carbon Steel Snare Wire: Starclassic snares offer several unique, highly useful features. When adding more tension to the wires, the strands press closer to the snare head. We've also redesigned the angle of the end plates and added thinner straps to obtain optimum response.
