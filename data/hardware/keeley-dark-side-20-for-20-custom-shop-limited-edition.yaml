description: 20 for 20 Custom Shop Edition Truly Inspiring Fuzz Multi Head Tape
  Delay Rotary/Flanger U-Vibe/Phaser
details: |-
  The Dark Side 20 for 20 Limited Edition is the Dark Side workstation in a Custom Shop finish from the 20 for 20 series, a hand-faded silver sparkle to black sparkle Eclipse coat applied by powdercoat technician Stacy Jenkins, so no two units are identical. Each 20 for 20 colorway carries the series insignia and was limited to 20 units. Shipping began in December 2020.

  The Dark Side is a workstation pedal built from three sections: fuzz, delay and modulation. The fuzz side is an op-amp big fuzz voicing modelled on a 1977 circuit, gained down to suit that period, and keeps the character of either single coil or humbucker pickups while sustaining.

  The delay and modulation side can be switched between a multi-head tape delay effect and a bank of four modulation voices. The delay offers 12 syncopated settings with the tonal character of spinning drum tape machines, and the number of repeats can be driven from an expression pedal, including into self-oscillating feedback. The modulation section holds a flanger, a rotary speaker cabinet, a U-Vibe and a four-stage phaser, with blending between the flanger and rotary voices and between the U-Vibe and phaser voices.

  An expression pedal port accepts a TRS style expression pedal. Current units carry a push-button switch that changes the order of the fuzz and modulation sections; earlier units instead exposed a TRS insert for patching another pedal between the two sides. At the core is a hand-built board carrying the analog fuzz and a 24-bit DSP engine, hand assembled and soldered.
specs: |-
  - Three sections: analog fuzz, multi-head tape delay, four-voice modulation
  - Modulation voices: flanger, rotary speaker cabinet, U-Vibe, four-stage phaser
  - 12 syncopated delay settings
  - 24-bit DSP engine alongside the analog fuzz circuit
  - Expression pedal port, requires a TRS style expression pedal
  - Push-button effect-order switch on current units, TRS insert on earlier units
  - Hand-faded silver sparkle to black sparkle Eclipse powdercoat, limited to 20 units
  - Hand assembled and soldered
