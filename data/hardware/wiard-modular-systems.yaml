description: >-
  The Wiard Modular System is a contemporary analog modular synthesizer
  featuring extensive patching capabilities with numerous knobs and LEDs.
  Affordable individual modules begin under $400, and each can function
  independently with other vintage analog CV/Gate equipped instruments. The
  system holds up to six modules with over 20 combined functions in a single
  rack.
details: |-
  The Wiard system represents a modern approach to modular synthesis, building on classic designs while incorporating innovative twists. The architecture allows for both integrated use as a complete system and individual module deployment as analog effects or dynamic processors.

  The modular design includes specialized components like Waveform City, which combines analog VCO technology with digital ROM-based waveshaping. The Sequantizer provides an 8-stage sequencer with voltage quantization and transposition features. The Borg Filter merges characteristics from the Buchla Model 292 Low-pass Gate with Korg MS-series filtering technologies.

  The system emphasizes flexibility through multiple signal routing options using 3.5mm mini-jacks for patching and firm-wired back-panel jumpers. Users gain access to extensive envelope generation, filtering, LFO, oscillator, sequencer, and mixer sections.
specs: |-
  - Classic VCO with 5 analog waveforms
  - Waveform City module with 3 analog waveforms and digital function generator
  - 2 multi-mode envelope generators with voltage crossfader
  - 4-input VCF with multi-mode, multi-output filtering
  - 2 separate Vactrol-based Borg filters
  - 8-step analog sequencer with quantizer and transposer
  - CV/Gate connectivity
  - Rack holds up to 6 modules with 20+ combined functions
  - 3.5mm mini-jack connectors
