details: |-
  The 2024 Fullerton Deluxe ASAT Special bundles some of the most time-honored option combinations from the G&L Option Order menu. All finishes are paired with a pickguard that sets off the color just right, and that elegance continues up the neck with the G&L Natural Satin finish. All feature rear contoured Alder or Swamp Ash bodies.

  The G&L ASAT Special just might be the quintessential G&L guitar, viewed by many as Leo's ultimate single-cutaway. Back in 1985, Leo Fender launched this model under the G&L Broadcaster name, which prompted a response from Fred Gretsch of Gretsch Guitars over the name just as it had thirty-five years earlier. History buffs will recall that the Broadkaster name is owned by Gretsch, and once again, a Broadcaster from Leo was required to have its name changed. This time around, the name became "ASAT", which is US military shorthand for an "Anti-Satellite" missile.

  The ASAT Special, as the model became known, features jumbo single-coil Magnetic Field Design pickups, each with a narrow bobbin aperture for a coil which is shallow yet wide. In this regard, an MFD jumbo single coil is similar to a P-90 or Jazzmaster pickup, yet the MFD principle provides a punchier bottom end and brighter top end sparkling with harmonics. Leo further departed from the past with the addition of his innovative Saddle-Lock bridge which transfers string energy right into the body end-grain for an incredibly resonant instrument. The result is one of the most versatile guitars ever, serving up ballsy twang to searing blues to smooth jazz tones.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed jumbo G&L MFD single coils made in Fullerton, California
  - Body wood: Swamp Ash or Alder, all with Rear Contour
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
