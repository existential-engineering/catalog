description: Mesmer Astral Delay in the Cyanosic Purple Custom Shop finish.
  Harmonised delay lines in 5ths and octaves plus an arpeggiator mode.
details: |-
  This Custom Shop run of the Mesmer Astral Delay carries a two-step Cyanosic Purple matte finish, an ice blue graphic and clear 1900 knobs.

  The Mesmer Astral Delay is a delay pedal built around harmonised and pitch-shifted repeats rather than conventional echo. Three distinctive modes are offered: two delay lines that return a single note or a chord harmonised in 5ths or octaves, and an arpeggiator that swirls a single note into billowing chords.

  The pedal is aimed at players looking for hazy, hypnotic harmonies and ambient textures. Keeley suggests placing a compressor in front of it, running it into a looper, stacking it with another delay or reverb pedal, or pairing it with the Synth-1 for glitchy, pitch-shifted delay effects.
specs: |-
  - - Three modes: two harmonised delay lines (5ths and octaves) and an arpeggiator
  - - Two-step Cyanosic Purple matte finish with ice blue graphic
  - - Clear 1900 knobs
