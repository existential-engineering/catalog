name: "530"
manufacturer: dbx
primaryCategory: equalizer
url: https://dbxpro.com/en/products/530
description: 500 Series 3-band fully parametric equalizer based on the classic dbx 905.
details: |-
  The 530 offers exceptional equalization flexibility in the 500 Series format. Based on the classic dbx 905, it delivers true, fully parametric operation of all three filter bands. Each overlapping band provides frequency bandwidth (Q) control and up to 15dB of reciprocal cut or boost for precise filter action.

  The unit features independent infinite notch mode for each band to remove spurious signals, and the high and low bands can switch between peaking and shelving operation. An On switch enables instant affected/bypassed comparisons. The 530 is ideal for portable, touring, and studio applications where surgical equalization control is essential.
specs: |-
  - 3-band parametric EQ
  - Selectable bell or shelf type filters on low and high frequency bands
  - Adjustable Q on each band
  - Independent infinite notch mode for each band
  - Input: Electronically balanced/unbalanced, 40k/20k Ohms
  - Output: Electronically balanced/unbalanced, 30/15 Ohms
  - Max Input/Output: +22dBu
  - Frequency Response: 20Hz - 20kHz, +0/-1dB
  - Noise: -90dBu unweighted
  - THD+Noise: <0.006% typical
  - EQ Center Frequencies: Low 20Hz-500Hz, Mid 200Hz-5kHz, High 800Hz-20kHz
  - EQ Range: ±15dB peak or shelved
  - Power: +/-16V DC, 85mA per rail, 2.72W
  - Dimensions: 5.25" x 1.5" x 6"
  - Weight: 1.3 lbs
