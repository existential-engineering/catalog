specs: |-
  - Stereo Ribbon Microphone : Features a precision-engineered stereo ribbon element, perfect for capturing immersive, natural soundscapes.
  - Phantom-Powered : Apollo 2 requires phantom power, enhancing its sensitivity and overall performance.
  - Balanced Frequency Response : Captures a balanced spectrum of sound, from the deepest lows to smooth highs, with exceptional detail and energy.
  - Stunning Stereo Imaging : Delivers an accurate and expansive stereo image, making it ideal for recording orchestras, choirs, and live performances.
  - Hand-Tuned Ribbon Elements : Ensures exceptional sensitivity and ultra-low noise, capturing even the most subtle nuances in sound.
  - Rugged, Black-Anodised Body : Combines durability with elegance, making it both a practical and visually striking addition to any studio setup.
  - Perfect for Studio and Live Use : Versatile for both professional studio recordings and live sound applications with RF filters built-in, delivering consistent performance in any environment.
  - Favoured by Professionals : Trusted by top-tier recording engineers and musicians for its unparalleled sonic accuracy and reliability.
  - Stereo recording
  - Piano
  - Orchestral & Choral recordings
  - Capturing ambience & character
  - Overhead microphone for drums & piano
  - Mic Type: Stereo ribbon
  - Polar Pattern: Blumlein X-Y figure-of-eight (x2)
  - Freq. Response: 20Hz to 15kHz
  - Sensitivity: 24mV/Pa
  - Impedance: < 150 Ohms
  - MAX.SPL: 125dB
  - Connector: 6-pin to two 3-pin (cable supplied)
  - Power: Phantom power 48V (±4V) required
  - Product Weight: 0.92 kg (1.18 kg with shock mount)
  - Packaged Weight: 5.43 kg
  - Dimensions: 260 x 65 x65mm
  - Packaged Dimensions: 580 x 380 x 190mm
  - Apollo 2 Microphone
  - Shock Mount
  - 6-Pin to 3-Pin XLR Cable
  - ABS Flight Case
