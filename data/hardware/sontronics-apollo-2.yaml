details: |-
  A gorgeous, precision-engineered, stereo ribbon microphone

  The APOLLO 2 is a beautiful-sounding active stereo ribbon microphone that has become, like the original Apollo before it, a must-have for studios, composers, venues and sound stages all round the world, from Glyndebourne to Hollywood. With its two highly sensitive ribbon motors set in X-Y Blumlein formation, APOLLO 2 will capture a truly stunning and superbly accurate three-dimensional image, picking up every detail of your recording space and your instruments or voices. Ideal for stereo recording, as an overhead for orchestra, choir or instrumental ensemble, or to capture the full character of a solo instrument in stereo or mono, APOLLO 2 will give you natural, expansive results with smooth highs and a balanced depth and fullness to the mids and lows. FEATURES

