details: |-
  With its deluxe appointments and Fishman Nashville pickup, the Bobtail Round-Neck stands out in the mix in more ways than one. The vital feature of all Gretsch resonator guitars is the Gretsch Ampli-Sonic diaphragm (resonator cone), which is hand-spun in Eastern Europe from nearly 99 percent pure aluminium, yielding an impressive quality and volume of tone.

  Featuring a laminated mahogany body and mahogany neck with medium 'V' profile, the G9220 pairs traditional resonator construction with onboard amplification via the Fishman Nashville Series Resophonic pickup. Finished in 2-Color Sunburst with chrome hardware and Grover Sta-Tite tuning machines.
specs: |-
  - Series: Roots Collection
  - Body: Laminated Mahogany, Resonator shape, Non-Cutaway
  - Neck: Mahogany, Medium 'V' shape
  - Scale Length: 25"
  - Frets: 19
  - Fingerboard: Padauk, 15.75" radius
  - Tuning Machines: Grover Sta-Tite
  - Tailpiece: Weathered Trapeze
  - Hardware: Chrome
  - Electronics: Fishman Nashville Series Resophonic Pickup
  - Strings: D'Addario EJ16 Phosphor Bronze Light (.012-.053)
  - Finish: Vintage Semi-Gloss
  - Color: 2-Color Sunburst
