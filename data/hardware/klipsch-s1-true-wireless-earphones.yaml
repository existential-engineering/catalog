description: The S1 True Wireless earphones combine comfort, acoustic clarity,
  and wireless technology for an on-the-go lifestyle. They feature Bluetooth 5
  with AAC codec support, IPX4 water resistance, and a charging case that
  extends total battery life to 21 hours.
details: |-
  The Klipsch S1 True Wireless earphones are designed for everyday portable use, pairing wireless freedom with Klipsch's acoustic heritage. The earphones use contoured soft oval silicone ear tips in multiple sizes for a secure, comfortable fit.

  Connectivity is handled via Bluetooth 5 with AAC codec support for high-quality wireless audio. Two built-in microphones provide voice clarity for calls and voice assistant use. The earphones are IPX4 rated, making them resistant to sweat and light water exposure.

  Battery life is 5 hours per charge in the earphones themselves, with the included USB charging case providing an additional 16 hours of charge for a total of 21 hours. An optional wireless charging pad accessory is also available for the case.
