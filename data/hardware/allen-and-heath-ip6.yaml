description: IP6 is a next generation remote controller with 6 rotary controls
  designed for install and live sound applications.
details: |-
  Six Rotary Remote Controller. IP6 is a next generation remote controller with 6 rotary controls designed for install and live sound applications.

  Rotary Control — the 6 assignable rotaries, with additional push and turn control, can be configured individually or as part of a 'rotary strip'.

  Assignable SoftKeys — 19 assignable SoftKeys deliver a comprehensive level of control for the user.

  Power Options — the IP6 ships with a 12V PSU and also supports PoE.

  Freestanding or Mounted — optional wall mount and mic stand brackets are available so IP6 can fit neatly into all live and install scenarios.

  Live — Personal Monitoring: the IP6 can be configured to control the Send levels, Pans and assignments of multiple channels to a specific mix on the dLive/Avantis, e.g. for wireless IEM use, giving musicians the freedom to control their own monitor sound.

  Install — Easy for Non-Technical Operators: the installer or system integrator can configure the IP6 to provide the degree of control needed by the day to day operator, for example the levels of microphones and music sources in a room.

  Connect — IP6 interfaces with the AHM, Avantis or dLive mixing system via standard TCP/IP Network connections and can be networked with other controllers, computers and third party devices using a standard Ethernet infrastructure.

  Configure — the IP6's controls and functions are configured using AHM System Manager, Avantis Director or dLive Director software (PC or Mac), or via an Avantis mixer or dLive Surface.

  Mix and Match — multiple IP Controllers can be connected to an AHM, dLive or Avantis system to provide control exactly where needed. Use IP controllers of different flavors to suit the needs of your end users, even letting one controller change what other controllers are doing to reflect changes in the space.

  Features: 6 Push n Turn Rotary encoders; 19 Assignable SoftKeys; 6 Layers; PoE or external 12V PSU (supplied).

  Optional accessories: Mic stand bracket; Wall mount bracket; Headphone holder.
