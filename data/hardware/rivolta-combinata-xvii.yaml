details: |-
  Once a sleeper hit among discerning players and now returning by popular demand, the Rivolta Combinata XVII is back — but it won't stay secret for long. Meticulously crafted in limited numbers by the expert luthiers at MIRR Korea, this reissue stays true to Dennis Fano's original vision, delivering vintage soul with modern precision. With its elegantly contoured offset body, chambered mahogany construction, and signature German carve top, the Combinata XVII embodies the perfect balance of form and function. Loaded with custom-wound pickups and premium hardware, the Combinata XVII offers a bold, articulate voice — equally at home pushing tube amps into gritty overdrive or cutting clean through a lush mix. Whether you're chasing retro tones or forging your own sound, the Combinata XVII is ready to lead the way. FEATURES & SPECS

  CASE OPTIONS:
  Premium Soft Case
  Hard Case: Combinata
specs: |-
  - chambered mahogany body
  - German carve top (mahogany on solid colours, maple on natural/burst)
  - double bound body
  - set maple neck
  - Ebony fingerboard
  - MOTO block inlays
  - bound peghead
  - 25" scale – 24 frets
  - 12″ fingerboard radius
  - 1.687″ nut width
  - Rivolta C+ neck profile
  - Rivolta "Novanta" P-90 pickups -Bridge: 43AWG / Alnico V / 9.1kOhm -Neck: 43AWG / Alnico V / 8.3kOhm
  - nickel hardware
  - Kluson style tuners
  - Duesenberg Les Tremolo II, nylon saddles at bridge
  - gold plexi pickguard
