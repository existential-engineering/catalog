details: |-
  Built with the same premium materials and craftsmanship as the Combinata Classico, the new P90 version is fitted with custom P90 pickups to deliver a tone that's immediate, clear, and bursting with personality. From glassy cleans to snarling overdrive, the Classico P90 responds to touch with clarity and character, offering the familiar feel of the Combinata platform paired with the proven, vintage-voiced edge that have made P90 pickups a favorite among players who live in the space between classic grit and modern precision. Features and Specs
