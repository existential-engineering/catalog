description: A 15-watt Class AB guitar amplifier featuring the classic harmonic
  tremolo circuit and tube spring reverb, offered as a head or combo with a
  choice of speakers.
details: |-
  The first of its kind ABOUT The HT15 is the result of 6 years of careful experimentation to bring the classic "Harmonic Tremolo" circuit into a low power lightweight combo amplifier. This legendary Fender circuit from the early 1960s was typically found in amplifiers with over 45 watts or bundled into heavy combos with multiple speakers. Milkman is very happy to present a lightweight low wattage 1x12 combo with the unmistakable sound of this tremolo circuit. In addition to swirling tremolo, a tube reverb system adds to the depth and presence of this small amplifier. How is 15 watts different than 20 watts? When you compare the HT15 to the Creamer, you will notice right away a difference in headroom (as well as the sound of the tremolo circuit). This is because the HT15 operates with lower internal voltages than the Creamer. The HT15 was designed to break up more than the Creamer, and to do so in a way that is very fun coupled with the tremolo circuit. The HT15 is the only Milkman amplifier designed with its tremolo circuit ahead of the reverb. With standard tremolo, it is essential that the reverb pulses with the tremolo to add to the overall harmonic and psychoacoustic effect. The HT15 on the other hand sounds best with the harmonic tremolo going through the reverb circuit. There are three speaker options help tailor the HT15 to your unique style: Jupiter Large Ceramic 12" is a transparent sounding speaker. Bright, lively, and very efficient. Its got a great bottom end even at low volume. This speaker will not break up no matter how hard you push the amp. Jupiter Alnico 12" has a classic American alnico magnet sound. A bit less transparent in the upper midrange, this speaker adds a "woody" tone to the HT15. Its lively on top, and a bit more focused in the bass response than its ceramic magnet brother. The speaker starts to break up and add alnico character as the amp is pushed. Alnico speakers tend to round the edges of overdriven tones. Fane A30 Alnico 12" takes the amp in a different direction. This speaker is very mid forward with little midrange scoop. The top is bright, and the bass response is the tightest out of the three options. This speaker starts to break up when the amp is driven hard. When the amp is overdriven, the A30 is extremely reactive shedding low end and pushing the midrange further into the fun zone. The HT15 is hand wired onto a turret board with bespoke Soursound transformers and Jupiter capacitors. WATTAGE 15W Class AB SPEAKER 12” 50W Ceramic Jupiter Speaker, 8 ohm 12” 50W Alnico Jupiter Speaker, 8 ohm 12" 30W Fane A30, 8ohm EFFECTS Tube "harmonic tremolo" and spring reverb Includes handwired original design detachable footswitch and 15' cable DIMENSIONS & WEIGHT 19-7/8" W x 16" H x 9-1/2" D 32lbs Demo HT15 Demo by James Deprato James is really good at making demos at this point SOUNDS Listen
