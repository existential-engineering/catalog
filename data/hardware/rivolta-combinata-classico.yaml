details: |-
  DESCRIPTION

  A new take on the popular Combinata, the Combinata Classico offers lightweight construction coupled with sleek, yet aggressive stylings and modern playability. The Combinata Classco is the evolution of a design with which followers of Dennis Fano should be very familiar. The larger and slightly offset body give the Combinata a shapely silhouette and more substantial feel. The chambered mahogany body features a sleek German carve which adds a classic, vintage appearance and depth to the Combinata's aesthetic. T he 25″ scale mahogany set-neck sports the comfortably "Rivolta Chunky C" neck profile, with 24 medium jumbo frets.
