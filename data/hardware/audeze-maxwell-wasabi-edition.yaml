description: Limited edition Maxwell wireless gaming headset with vibrant green
  and gold high-gloss electroplated finish, in collaboration with Microsoft
  Xbox.
details: |-
  After years of relentless innovation to build the world's best wireless gaming headset, Audeze presents Maxwell, designed from the ground up for serious gamers. Sound quality, wireless performance, and battery life are all pushed to new extremes, along with the latest spatial audio features and multi-platform compatibility.

  Glowing in a vibrant new green and gold high-gloss electroplated finish, Maxwell Wasabi Edition is a limited edition release in collaboration with Microsoft Xbox. With Maxwell Wasabi Edition's award-winning audio quality, low-latency wireless, and 80-hour battery life you will outperform and outlast the competition - in style.
specs: |-
  - Style: Over-ear (circumaural), closed-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-Thin Uniforce
  - Transducer size: 90 mm
  - Maximum SPL: >120dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% (@ 1 kHz, 1mW)
  - Spatial Audio: Dolby Atmos (Xbox Version), Tempest 3D (PlayStation Version)
  - Weight: 490g
  - Boom Microphone: Detachable, Hypercardioid
  - Mic Beamforming: Physical and AI noise reduction, internal mic for chat
  - Battery type: Lithium-polymer, 1800mAh
  - Battery life: Over 80 hrs wireless playback @ 80dBA
  - Fast charge: USB-C, 5v 1.8 Amp max - 25% charge / 20min (Full charge 2hr)
  - Wireless: Ultra-low-latency, Bluetooth 5.3
  - Codec support: Multipoint, LE Audio, LC3, LC3plus, LDAC, AAC, SBC
  - Wired Digital: USB-C with dual-audio endpoints and game-chat mix
  - Wired Analog: 3.5mm TRRS active
