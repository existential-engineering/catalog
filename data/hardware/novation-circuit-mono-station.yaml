description: >-
  The Novation Circuit Mono Station is a paraphonic analog synthesizer that merges the Bass Station II's
  sound engine with the Circuit's hands-on sequencer, delivering thick analog tones with pattern-based control.
details: |-
  Released in 2017, the Circuit Mono Station represents a clever convergence of two established Novation product lines. Rather than simply bolting a stripped-down Bass Station II onto a stripped-down Circuit, Novation crafted a unified instrument that exceeds the sum of its parts with a notably thick and weighty sound character.

  The sound engine features two main oscillators alongside a sub oscillator, ring modulator, and noise source. Waveform options include sawtooth, square, triangle, and white noise. The filter section offers both 12dB two-pole and 24dB four-pole slopes across low pass, high pass, and band pass modes, providing extensive tonal shaping.

  Three sequencer tracks with 32 sessions allow for complex pattern-based performances, with two tracks available per session. An overdrive section with three distortion modes adds grit and aggression when needed. Modulation comes from a single LFO offering sample and hold, saw down, square, and triangle waveforms, routed through two envelope generators.

  The unit stores 64 patches in RAM and connects via MIDI in, out, and thru. Unlike its Circuit sibling, the Mono Station requires an AC adapter and lacks a built-in speaker, positioning it as a more studio-focused instrument.
specs: |-
  - Polyphony: Monophonic (paraphonic capable)
  - Oscillators: 2 main + sub oscillator
  - Waveforms: Saw Up, Square, Triangle, White Noise
  - Additional Sources: Ring Modulator, Noise
  - Filter: 12dB (2-pole) and 24dB (4-pole); Low Pass, High Pass, Band Pass
  - LFO: 1 (Sample & Hold, Saw Down, Square, Triangle)
  - Envelopes: 2
  - Effects: Overdrive with 3 distortion modes
  - Sequencer: 3 tracks, 32 sessions (2 tracks per session)
  - Memory: 64 patches (RAM)
  - Connections: MIDI In/Out/Thru
  - Power: AC adapter required
releaseDate: "2017"
