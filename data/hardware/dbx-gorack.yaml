name: goRack
manufacturer: dbx
primaryCategory: channel-strip
url: https://dbxpro.com/en/products/gorack
description: Compact portable speaker processor with anti-feedback suppression,
  compression, sub-harmonic synthesis, and 16 genre-based EQ presets, based on
  DriveRack PA2 software.
details: |-
  The dbx goRack is a compact, portable speaker processor designed for live sound applications where portability is essential without compromising sound quality. Based on the industry-leading DriveRack PA2 software, it provides comprehensive signal processing in a small form factor.

  The unit features two independently switchable mic/line combo inputs (1/4" XLR combination) and a stereo 1/8" auxiliary input for mobile devices, with two XLR line outputs for powered speakers. Independent left and right channel volume controls are conveniently located on the top panel.

  Processing includes AFS Advanced Feedback Suppression based on dbx's professional algorithms, a dbx 163-based compressor for dynamics control, Subharmonic Synthesis for enhanced bass response, and 16 musical genre-based graphic EQ settings for quick system optimization. The unit runs on a 9VDC power supply and weighs only 1.2 lbs.

  Note: This product is discontinued.
specs: |-
  - Mic/Line Inputs: 2, independently switchable
  - Mic/Line Input Connectors: Female 1/4" XLR combination
  - Mic Input Impedance: 2 kΩ balanced
  - Line Input Impedance: 22 kΩ balanced
  - Mic Input Max Gain: 48 dB
  - Line Input Max Gain: 5 dB
  - Mic Input Max Level: 0 dBu
  - Line Input Max Level: +20 dBu
  - CMRR: >45 dB
  - Aux Input: 1, female stereo 1/8" (3.5 mm) TRS mini
  - Aux Input Impedance: 20 kΩ
  - Aux Input Max Level: +20 dBu
  - Outputs: 2 line outputs, male XLR
  - Output Impedance: 40 Ω
  - Max Output Level: +14 dBu
  - A/D Converters: 24-bit
  - Dynamic Range (Mic/Line): 115 dB A-weighted
  - Dynamic Range (Aux): 106 dB A-weighted
  - Overall Dynamic Range: 103.5 dB A-weighted, 102.5 dB unweighted
  - Internal Processing: 32-bit floating point
  - Sample Rate: 48 kHz
  - THD+Noise: 0.04% typical at 0 dBu in/out, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, +0 / -0.5 dB
  - Interchannel Crosstalk: <-80 dB, -84 dB typical
  - Latency: 3.4 ms input to output
  - Power Supply: PS0913DC-04 (9 VDC)
  - Operating Voltage: 100-240 VAC, 50/60 Hz
  - Power Consumption: 4.5 Watts
  - Weight: 1.2 lbs (0.54 kg)
  - Dimensions: 6.1" L x 4.1" W x 1.69" H
