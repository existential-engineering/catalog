description: >-
  Performance-proven, the sound that fueled the most hit recordings in history —
  the Supraphonic is the snare choice of the pros. Its USA-made chrome-plated,
  seamless, beaded aluminum shell produces a bright, crisp attack with the
  perfect balance of full resonant tone and snare crack, suitable for everything
  from jazz to metal.
details: |-
  The Supraphonic is built on a USA-made chrome-plated, seamless, beaded aluminum shell. Offered in 5x14" and 6.5x14" sizes, with smooth or hammered shell options, and a choice of imperial or tube lugs.
specs: |-
  - 1.7mm seamless aluminum shell
  - Chrome-plated finish
  - 2.3mm steel triple-flanged hoops
  - 10 lugs
  - P88AC throw-off
  - P35P butt plate
  - Ludwig Weather Master medium coated batter head
  - Ludwig Weather Master clear snare-side head
  - Available sizes: 5x14", 6.5x14"
  - LM400 — 5x14" smooth shell, imperial lugs
  - LM400T — 5x14" smooth shell, tube lugs
  - LM400K — 5x14" hammered shell, imperial lugs
  - LM400KT — 5x14" hammered shell, tube lugs
  - LM402 — 6.5x14" smooth shell, imperial lugs
  - LM402T — 6.5x14" smooth shell, tube lugs
  - LM402K — 6.5x14" hammered shell, imperial lugs
  - LM402KT — 6.5x14" hammered shell, tube lugs
