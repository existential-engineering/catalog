description: >-
  The DJ-70 is a sampling workstation released by Roland Italy in 1992,
  specifically designed for the dance and DJ market. It features 37 velocity and
  aftertouch-sensitive keys, a distinctive scratch wheel for simulating vinyl
  turntable effects, and an 8-track sequencer. Despite its innovative feature
  set, the DJ-70 failed to make much of an impact on the market and has since
  been largely forgotten.
details: |-
  The DJ-70 was positioned as a professional tool for DJs and dance music producers, offering integrated sampling and performance capabilities in a single unit. Roland Italy released it in 1992, targeting the growing electronic dance music scene with features tailored to live performance and studio production.

  The instrument's most distinctive feature is its scratch wheel, designed to simulate vinyl turntable effects for real-time sound manipulation. The interface includes pad buttons for triggering patches, function switches, cursor controls for LCD navigation, and a value dial for parameter adjustment. Its 64x240 pixel backlit LCD display provides visual feedback for editing and performance.

  The DJ-70 offered a streamlined sampling workflow with its "Load While Playing" function, which allowed uninterrupted performance during sample loading from the built-in 3.5-inch floppy disk drive. Users could connect audio sources directly and use the Start/End buttons to record, with automatic patch creation and assignment to keyboard keys, pads, and the scratch dial. It shipped with 2MB of sample memory, expandable to 4MB, and maintained full compatibility with Roland S-series samplers and the W-30 workstation.

  Despite its innovative approach, the DJ-70's obtuse editing interface significantly limited its broader appeal. The scratch wheel, while novel, was considered more of a gimmick than a practical performance tool. Roland followed up with the DJ-70 MKII in 1996, which added more powerful features, but neither model achieved widespread adoption.
specs: |-
  - 24-voice polyphony
  - 31-part multitimbral
  - 37 velocity and aftertouch-sensitive keys
  - 8-track sequencer
  - Scratch wheel for vinyl simulation
  - Filters: LPF, HPF, BPF
  - 1 LFO with sine, triangle, sawtooth, square, random, and peak-hold waveforms
  - 2 envelope generators
  - 2MB sample memory, expandable to 4MB
  - 64 x 240 pixel backlit LCD display
  - 3.5-inch floppy disk drive
  - Stereo output jacks
  - Headphone output with volume control
  - MIDI In/Out/Thru
  - Compatible with Roland S-series and W-30 sample formats
