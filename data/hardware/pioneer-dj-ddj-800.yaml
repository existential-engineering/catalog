description: The DDJ-800 2-channel DJ controller is a pro DJ setup that’s made
  to go wherever you do. This portable unit inherits the club-style layout and
  popular features of the DDJ-1000 , including Color On Jog Displays, and packs
  it all into a lighter body. The result is a professional performance
  controller that you’ll have no trouble transporting between gigs at weddings,
  parties and anywhere else you play. Stop worrying about MCs walking in front
  of the speaker thanks to the compatible Feedback Reducer feature in rekordbox.
  The system will automatically bring down the ‘howling’ sound from the mic –
  extra handy when you have 2 microphones plugged in at once. Use the DDJ-800 to
  mix audio from external sources, and apply Sound Color FX, Beat FX, EQs and
  Trim to make all of your shows unique.
details: |-
  2-channel performance DJ controller for rekordbox. The DDJ-800 2-channel DJ controller is a pro DJ setup that’s made to go wherever you do. This portable unit inherits the club-style layout and popular features of the DDJ-1000 , including Color On Jog Displays, and packs it all into a lighter body. The result is a professional performance controller that you’ll have no trouble transporting between gigs at weddings, parties and anywhere else you play. Stop worrying about MCs walking in front of the speaker thanks to the compatible Feedback Reducer feature in rekordbox. The system will automatically bring down the ‘howling’ sound from the mic – extra handy when you have 2 microphones plugged in at once. Use the DDJ-800 to mix audio from external sources, and apply Sound Color FX, Beat FX, EQs and Trim to make all of your shows unique.
