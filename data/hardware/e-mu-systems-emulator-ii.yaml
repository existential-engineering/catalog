description: >-
  E-mu's landmark 8-bit sampling keyboard from 1984, renowned for its warm analog filters and
  8-track sequencer that helped define the sound of a generation of electronic and pop music.
details: |-
  The E-mu Emulator II arrived in 1984 as a more affordable alternative to the high-end Fairlight and Synclavier systems, and it quickly became one of the most influential samplers of the decade. Its 8-bit sampling engine captures audio at 27kHz with up to 17.6 seconds of sample time, storing everything on oversized 5-inch floppy disks.

  What truly sets the Emulator II apart is its 24dB per octave 4-pole analog low-pass filter with resonance. This filter imparts a warmth and musicality to the digital samples that makes them sound more like an analog synthesizer than a straightforward sampler, a quality that became its signature calling card for lush pads and textured soundscapes.

  The 61-key keyboard responds to velocity and aftertouch, while the 8-track sequencer with SMPTE synchronization transforms it into a self-contained production workstation. Eight individual voice outputs allow for detailed mixing, and MIDI support along with an RS-422 computer interface provide connectivity options that were ahead of their time.

  Produced through 1988, the Emulator II spawned the II+ variant with double the sample memory and the II+HD with an added 20MB hard drive. Its distinctive sound continues to be sought after by producers chasing that unmistakable mid-80s digital warmth.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 27kHz, 8-bit; 512KB to 1MB storage
  - Multitimbral: 8 parts (8 MIDI channels)
  - Sequencer: 8-track
  - Filter: 24dB/oct 4-pole analog low-pass with resonance
  - Keyboard: 61 keys (velocity and aftertouch)
  - LFOs: 8 separate units
  - Outputs: 8 individual voice outputs
  - Storage: 5" floppy disk
  - Control: MIDI, SMPTE, RS-422 interface
