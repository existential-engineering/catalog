  Tone-Bender-style germanium fuzz and a Silvertone-inspired vintage overdrive
  with an order toggle.
details: |-
  The Calhoun V2 is our collaboration with legendary guitarist and producer Mike Campbell and his first ever signature pedal. Mike is an original member of Tom Petty and the Heartbreakers and has worked with such artists as Don Henley, Bob Dylan, Stevie Nicks, and George Harrison to name a few. Containing a vintage overdrive and fuzz circuit, the Calhoun V2 is Mike's go-to pedal for rhythm and lead tones live and in-studio.

  The right side of the Calhoun is the fuzz side with controls for Volume, Fuzz, Bias, and EQ, engaged by the right footswitch. This fuzz is based around the vintage Tone-Bender fuzzes that were made famous in the 60s and 70s, giving you everything you need to get that 'Satisfaction' tone. The Volume has plenty of headroom to push your amp and works with the Fuzz knob to give you lower gain fuzz tones or high gain fuzz tones. The Bias control adjusts the amount of power going to the transistors to enable you to fine-tune the character of the fuzz from more open and louder to more saturated and dirty. The Tone control gives you a wide sweep to give you fat tones or thinner more vintage tones.

  The left side of the Calhoun, engaged by the left footswitch, is our Twin Twelve channel drive designed after the vintage Silvertone amps made in the early 60s. This circuit gives you a ton of vintage character and plenty of tonal control. With Volume and Drive controls you can boost your amp or send the pedal into heavy overdrive. There are separate Treble and Bass controls just like you'll find on the vintage amps.

  In the center of the pedal, there is a toggle to select the order of the effects when both are engaged. When flipped to the right the fuzz is first in the chain; when flipped to the left the overdrive is first.

  All of Mike's proceeds from the Calhoun are being donated to the Tazzy Animal Rescue Fund.
