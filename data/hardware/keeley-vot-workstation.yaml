description: Dual DSP reverb and tremolo workstation with eight reverb modes,
  eight vintage tremolo modes, tap tempo, an external tap input and expression
  control of reverb decay.
details: |-
  The VoT Workstation is a dual DSP reverb and tremolo unit developed with session guitarist Eddie Heinzelman. Reverb and tremolo each get their own effects engine, which allows more elaborate filtering than a shared engine would. It is intended for the end of a pedalboard, after effects such as compression, fuzz and overdrive.

  Eight reverb modes are available: 2 Spring, 3 Spring, Plate, Hall, Chamber, Room, Fugue and Slapback. Each is set by four controls. Level sets the reverb channel output, Decay sets the length of the trails and so the apparent size of the space, Morph sets pre-delay, the earliest reflections that can read as a slapback, and Effect Level blends the reverb into the dry signal.

  Eight vintage tremolo modes are available: Sine Wave, Square Wave, Harmonic, Dynamic Harmonic, Pitch Vibrato, Ramp Trem, Les Rotary Speaker and U-Vibe. Level sets the modulation channel output, Rate sets the modulation speed, Depth sets the amount of volume change, and Morph adjusts mode-dependent parameters such as filter points, wave shape, duty cycle and tweeter or woofer balance, detailed per mode in the instruction manual.

  Tempo can be set by the on-board tap tempo or from an external tap switch or clock generator through a rear jack. A rear expression port gives foot control of the reverb Decay setting.
specs: |-
  - Dual DSP design, separate effects engine for reverb and for tremolo
  - Eight reverb modes: 2 Spring, 3 Spring, Plate, Hall, Chamber, Room, Fugue, Slapback
  - Reverb controls: Level, Decay, Morph (pre-delay), Effect Level
  - Eight tremolo modes: Sine Wave, Square Wave, Harmonic, Dynamic Harmonic, Pitch Vibrato, Ramp Trem, Les Rotary Speaker, U-Vibe
  - Tremolo controls: Level, Rate, Depth, Morph
  - On-board tap tempo plus external tap input jack on the rear
  - External expression control port on the rear, assigned to reverb Decay
  - Released worldwide in November 2018
