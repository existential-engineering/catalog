description: >-
  A rare polyphonic combo keyboard from Italian manufacturer Farfisa, featuring
  61 velocity-sensitive keys and four distinct timbral sections for orchestral
  sounds typical of the late 1970s.
details: |-
  The Farfisa Polychrome was the largest and most fully featured instrument the company produced outside of their organ line. Released at the end of the 1970s, it packed an impressive array of controls including 36 push buttons, three switches, 20 levers, and a rudimentary pitch bender into a single performance instrument.

  The Polychrome is organized into four sections. The Chorus section provides three presets plus a custom mode. The Percussive section covers piano, harpsichord, honky-tonk, clavichord, guitar, and classical guitar sounds. The Ensemble section handles brass, reed, and accordion tones, while the Strings section offers voices at 16-foot, 8-foot, and 4-foot octave settings.

  A built-in analog shift phaser adds movement to the ensemble, percussive, and strings sections. With 61 voices of polyphony and two-part multitimbrality, the Polychrome was a capable stage instrument for its era, though its rarity today makes it a sought-after collector's piece.
specs: |-
  - Polyphony: 61 voices
  - Multitimbral: 2 parts
  - Oscillators: 1
  - Keyboard: 61 keys with velocity sensitivity
  - Memory: 1 patch RAM, 15 patches ROM
  - Effects: Built-in analog shift phaser
