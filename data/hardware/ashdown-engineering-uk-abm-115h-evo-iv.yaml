details: |-
  The UK-ABM-115H-EVO IV is a handcrafted UK 1x15" bass cabinet built for players who want thick, immersive lows that still carry definition and presence. A custom 15" CIARE ceramic driver delivers 500W AES of room-filling bass with 98dB sensitivity, producing massive bottom-end power without sacrificing clarity in the mix. Premium Neutrik SpeakOn connectors ensure reliable performance, and it works as a standalone cab or paired with a 2x10" or 4x10" across the Ashdown ABM and Rootmaster series.
