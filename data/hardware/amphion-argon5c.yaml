details: |-
  The Argon5C is a two-way, vented center loudspeaker handmade in Finland, designed to integrate seamlessly with all speakers in the Amphion Argon series.

  The Argon5C features Amphion's 5th generation waveguide technology, which ensures seamless integration between the 1-inch titanium tweeter and the dual 5¼-inch aluminum woofers. This waveguide design delivers consistent, even dispersion across a wide listening area.

  Amphion describes the Argon5C as delivering 'unrivalled midrange clarity' with exceptional naturalness for the reproduction of human voice and acoustic instruments — particularly important for a center channel speaker responsible for dialogue and lead vocals.

  The speaker's 'room-wide sweet spot' characteristic results from its controlled and even dispersion pattern, meaning listeners seated anywhere across a wide seating area enjoy a consistent, well-focused sonic image.

  The Argon5C won a Gold Award in the Home Theatre Category at the VGP Awards Japan. Available in four finishes — Full White, Full Black, Walnut, and Standard White.
specs: |-
  - Operating Principle: Two-way, vented
  - Tweeter: 1" titanium
  - Woofers: 2×5¼" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 90 dB
  - Frequency Response: 46–25,000 Hz (-6dB)
  - Power Recommendation: 25–150 W
  - Dimensions (H×W×D): 160×452×265 mm
  - Weight: 9.6 kg (21.2 lbs)
  - Manufacturing: Handmade in Finland
