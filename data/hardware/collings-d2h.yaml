description: The D2H is a square-shouldered 14-fret dreadnought acoustic guitar,
  the most popular steel-string body shape in the world. It is built with a
  Sitka spruce top and East Indian rosewood back and sides, bringing tonal
  clarity to the depth and warmth associated with this large, deep-bodied
  instrument. Well suited to both vocal accompaniment and bluegrass flatpicking.
details: |-
  The D2H dreadnought is built with a Sitka spruce top and East Indian rosewood back and sides, delivering the balanced tone and projection that dreadnoughts are known for. The ebony fingerboard features abalone long diamond and square inlays, and the neck is finished with a modified V profile for comfortable playability. Premium details include nickel Waverly tuners, ivoroid binding with herringbone purfling, a tortoise pickguard, and a high gloss nitrocellulose lacquer body finish over a polyester resin neck finish.
specs: |-
  - Body Style: Dreadnought
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with abalone long diamond & squares
  - Nut Width: 1 11/16"
  - Scale Length: 25 1/2"
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Frets: Medium 18% nickel-silver
  - Tuners: Nickel Waverly
  - Neck Profile: Modified V
  - Binding: Ivoroid with herringbone purfling
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
