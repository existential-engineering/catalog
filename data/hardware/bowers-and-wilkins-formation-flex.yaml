details: |-
  The smallest Bowers & Wilkins wireless speaker has big sound. Whether working alone, with a Flex partner in stereo, or as part of a surround-sound system with Formation Bar and/or Formation Bass, Flex has convenience with performance to match.

  Flex = muscle: 100 watts of Class D amplification means Flex is a big, bold, hi-res listen when it is working alone. Supreme flexibility: add a second Flex to create a compact, high-performance stereo pair, or form a surround-sound system by adding Bar and Bass.

  Music from anywhere: Flex is ready to deal with Bowers & Wilkins Music App, Wi-Fi, Apple AirPlay 2, Bluetooth, Amazon Music, Roon and Spotify Connect, to a 24-bit/96kHz hi-res standard.

  Equipped to excel: Flex uses a 25mm decoupled double-dome tweeter and 100mm woven glass-fibre mid-bass driver to deliver superb hi-res audio.

  Wireless revolution: Formation is the exclusive Bowers & Wilkins wireless technology, it guarantees a flawless listening experience, no matter how extensive your system. Using a robust, independent network, Formation wireless speakers deliver perfect room-to-room synchronisation and outstanding sound.
specs: |-
  - Description: Compact Wireless Speaker System
  - Drive units: 1x 25mm (1 in) decoupled double dome high-frequency, 1x 100mm (4 in) woven glass fibre cone bass/midrange
  - Frequency response: 50Hz to 28kHz
  - Amplifier power output: 2 x 50W
  - Apple AirPlay 2 technology
  - Spotify Connect
  - Roon Ready
  - Bluetooth In
  - Dolby Digital
  - Digital Signal Processing (DSP)
  - Digital amplifier
  - Dynamic EQ
  - Bluetooth v4.1, Class 2, with aptX HD, AAC and SBC codecs
  - Network: RJ45 Ethernet or Wi-Fi
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: below 6 Watts (sleep)
  - Dimensions: 215mm (8.5 in) height x 130mm (5.1 in) width x 130mm (5.1 in) depth
  - Net weight: 2.3kg (5 lb)
  - Cabinet finishes: Black
