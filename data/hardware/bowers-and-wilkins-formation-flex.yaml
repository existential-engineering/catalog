description: The smallest Bowers & Wilkins wireless speaker has big sound.
  Whether working alone,
  with a Flex partner in stereo, or as part of a surround-sound system with
  Formation Bar and/or Formation Bass, Flex has convenience with performance to
  match.
details: |-
  Formation Flex is a network connected, wireless active speaker that provides high performance reproduction of Formation audio streams. It is configured and controlled using the Bowers & Wilkins Home app, with play/pause, volume and source selection also available from touch buttons on the top panel.

  100 watts of Class D amplification means Flex is a big, bold, hi-res listen when it is working alone. Add a second Flex to create a compact, high-performance stereo pair, or form a surround-sound system by adding Formation Bar and Formation Bass.

  Flex uses a 25mm decoupled double-dome tweeter and a 100mm woven glass-fibre mid-bass driver to deliver hi-res audio. It is ready to deal with the Bowers & Wilkins Music App, Wi-Fi, Apple AirPlay 2, Bluetooth, Amazon Music, Roon and Spotify Connect, to a 24-bit/96kHz hi-res standard.

  In addition to a mains power socket, Formation Flex carries an Ethernet socket for connection to a router should a wired network connection be preferred to wireless (WiFi). The USB socket on the rear panel is intended for service and diagnostic use only. Bass level can be adjusted from the Bowers & Wilkins Home app settings menu when room boundaries make the low end too prominent.

  Formation is the exclusive Bowers & Wilkins wireless technology. Using a robust, independent network, the Formation speakers deliver room-to-room synchronisation across a system of any size.
specs: |-
  - Description: Compact Wireless Speaker System
  - Drive units: 1 x 25mm (1 in) Decoupled double dome high-frequency, 1 x 100mm (4 in) Woven glass fibre cone bass/midrange
  - Frequency response: 50Hz to 28kHz
  - Amplifier power output: 2 x 50W
  - Input voltage: 100V - 240V - 50/60Hz
  - Power consumption: Below 6 Watts (Sleep)
  - Connections: Network (RJ45 Ethernet or WiFi), USB - service only
  - Technical features: Apple AirPlay 2 technology, Spotify Connect, Roon Ready, Bluetooth In, Digital Signal Processing (DSP), Digital amplifier, Dynamic EQ
  - Bluetooth: Bluetooth v4.1, Class 2, aptX HD, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Dimensions: Height 215mm (8.5 in), Width 130mm (5.1 in), Depth 130mm (5.1 in)
  - Net weight: 2.3kg (5 lb)
  - Cabinet finishes: Black
  - Carton contents: Formation Flex, mains power cable set appropriate for your territory, document pack
