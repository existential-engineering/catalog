name: Shepard's End
manufacturer: mr-black
primaryCategory: pedal
categories:
  - flanger
  - modulation
url: https://www.mrblackpedals.com/products/shepards-end
description: A barber-pole through-zero flanger that sweeps endlessly up or down
  without a cycle beginning or end, with positive and negative regeneration and
  a single Speed control.
details: |-
  The Shepard's End is billed as the world's first barber-pole through-zero flanger. Unlike a conventional flanger, whose sweep rises and then falls, its cycle has no fixed beginning or end: set the controls one way and it climbs continually, set them another and it descends continually, and it can pass through the zero point for the dramatic whooshing effect heard on countless records.

  The barber-pole behavior is the heart of the pedal, giving an illusion of a sweep that never resolves, endlessly ascending or descending depending on the settings.

  Control is deliberately simple. A single Speed knob ranges from draggingly slow to space-ray-gun fast, while positive regeneration yields swishy, phaser-like sounds and negative regeneration gives hollow, tubular, sucking-into-itself textures, all the way to raw through-zero flanging.

  It ships as a standard stompbox with a single input and output.
specs: |-
  - Barber-pole through-zero flanger (continuous up/down cycle, no beginning or end)
  - Through-zero flanging (classic whooshing)
  - Positive regeneration (swishy, phaser-like) and negative regeneration (hollow, tubular)
  - Single Speed knob (draggingly slow to very fast)
