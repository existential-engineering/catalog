description: Ultra-miniature omnidirectional lavalier microphone terminated with
  a TA4F connector for use with Electro-Voice wireless bodypack transmitters.
  The lightweight back-electret condenser capsule and integrated 6-foot cable
  suit broadcast, house-of-worship, and business presentation applications.
details: >-
  The Electro-Voice RE90Tx is an ultra-miniature lavalier microphone designed to
  disappear on a presenter while delivering high-quality speech pickup. The
  capsule measures just 5 mm in diameter and 8.3 mm in height, giving it an
  unobtrusive on-camera footprint for broadcast, video production, and houses of
  worship.


  At its core is a back-electret condenser element with an omnidirectional polar
  pattern, providing consistent off-axis response that is forgiving of head
  movement when clipped to a lapel or tie. Audio bandwidth runs from 50 Hz to 18
  kHz, and the capsule handles up to 130 dB SPL at 1 percent THD, with an
  open-circuit sensitivity of 12.6 mV.


  The microphone is terminated with a 6-foot (180 cm) integrated cable and a
  TA4F mini-XLR connector that mates directly with all Electro-Voice bodypack
  wireless transmitters (such as the RE3-BPT). For wired XLR applications, the
  same TA4F termination can be paired with the EV TXA adapter to convert the
  lavalier to a phantom-powered 3-pin XLR output. Total weight is 33.5 g
  including the cable.
specs: |-
  - Mic type: Lavalier
  - Element: Back-electret condenser
  - Polar pattern: Omnidirectional
  - Frequency response: 50 Hz - 18,000 Hz
  - Maximum SPL (1% THD): 130 dB
  - Open circuit voltage: 12.6 mV
  - Connector: TA4F (mini-XLR, 4-pin female)
  - Wired/wireless: Wireless (compatible with EV bodypack transmitters)
  - Cable length: 6 ft (180 cm), integrated
  - Capsule diameter (max): 5 mm
  - Capsule height: 8.3 mm
  - Net weight: 33.5 g
  - Application: Speech
  - Compatible with TXA adapter for wired XLR (phantom-powered) use
