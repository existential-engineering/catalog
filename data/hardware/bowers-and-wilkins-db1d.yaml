description: The flagship Bowers & Wilkins DB Series subwoofer, combining
  digital amplification with twin balanced 300mm (12") Aerofoil-cone drive units
  for high-output, low-distortion low-frequency reproduction.
details: |-
  The DB1D is the top model in the Bowers & Wilkins DB Series of powered subwoofers. It uses two 300mm (12") Aerofoil-cone long-throw drive units arranged in a balanced, opposed configuration within a sealed cabinet. By firing in equal-and-opposite directions, the drivers cancel out reaction forces in the enclosure, reducing cabinet resonances and freeing the cones to focus energy on producing low-frequency output.

  Amplification is fully digital, with a built-in digital preamplifier that runs cool and efficiently while delivering the high peak currents required to drive twin 12" cones with authority. Bowers & Wilkins pairs the amplification with Dynamic EQ and Room EQ processing to adapt the subwoofer's response to its environment and to maintain tonal balance across listening levels.

  Setup and control are handled through a dedicated mobile application that connects to the subwoofer via Bluetooth Low Energy, exposing parameters such as crossover, level, phase and EQ presets without requiring access to the rear panel. This makes the DB1D well suited to installations where the subwoofer sits in a fixed or partially concealed position.

  Connectivity is broad enough to integrate with both consumer and professional source equipment. A pair of balanced XLR inputs sits alongside two unbalanced RCA inputs and two 3.5mm minijack inputs, while a 12V trigger and an RS-232 9-pin D control port enable integration with home theater processors and custom-install control systems.

  The cabinet measures 460mm (18.1") high by 429mm (16.9") wide by 410mm (16.1") deep and weighs 43kg net. It is offered in Gloss Black, Satin White and Rosenut finishes, with a choice of Black or Grey grilles, allowing the subwoofer to be matched to a range of room aesthetics.
specs: |-
  - Drive units: 2x 300mm (12") Aerofoil-cone long-throw, balanced configuration
  - System type: Active sealed subwoofer with digital amplification
  - Frequency response: 10Hz - 350Hz -3dB (centered at 100Hz); -6dB at 8.5Hz - 500Hz
  - Amplification: Digital preamplifier with Dynamic EQ and Room EQ
  - Control: Mobile app via Bluetooth Low Energy
  - Inputs: 2x XLR (balanced), 2x RCA, 2x 3.5mm, 12V trigger, RS-232 (9-pin D-sub)
  - Height: 460mm (18.1")
  - Width: 429mm (16.9")
  - Depth: 410mm (16.1")
  - Net weight: 43kg
  - Cabinet finishes: Gloss Black, Satin White, Rosenut
  - Grille finishes: Black, Grey
