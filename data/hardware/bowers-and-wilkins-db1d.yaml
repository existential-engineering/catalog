description: The DB1D is the flagship Bowers & Wilkins subwoofer, with
  amplification and twin balanced Aerofoil drivers for incredible low-end power
  and speed.
details: |-
  DB1D is the flagship of the Bowers & Wilkins DB Series and, in the company's own words on the information sheet, the most powerful active subwoofer it has ever made. Bowers & Wilkins presents it as the partner for the 800 Series Diamond loudspeakers, combining digital amplification with twin balanced Aerofoil drivers for low-end power and speed.

  Two 300mm (12in) Aerofoil-cone drive units sit back to back in a balanced configuration. Bowers & Wilkins says the opposed arrangement cancels out cabinet resonances so the energy goes into bass rather than into vibration, and that the variable-thickness Aerofoil cone is both rigid and light, which is what lets a 12-inch driver stay nimble. The cones are described as identical to those in the 800 Series Diamond.

  Amplification is digital: a 2000W Class D Hypex amplifier with a maximum power output of 2000W, fronted by an all-new digital preamplifier. Bowers & Wilkins argues that digital amplification runs cool and stays energy efficient even when working hard, and that Dynamic EQ and Room EQ keep the sound precise for both music and movies. The room EQ system needs no separate measurement microphone.

  Setup is done from a phone. The subwoofer is configured over Bluetooth LE through a dedicated Bowers & Wilkins app for iOS and Android, which the company says makes the DB Series subwoofers quick to set up and helps get the most out of them. Bluetooth LE is a control path rather than an audio port and is recorded in specs.

  Connections are all on the rear panel: two XLR inputs, two RCA inputs, two 3.5mm 12V trigger jacks and an RS-232 control port on a 9-pin D connector, plus the mains inlet the active amplifier needs. Quoted performance is 10Hz to 350Hz at -3dB centred on the level at 100Hz, with a frequency range reaching -6dB at 8.5Hz and extending to 500Hz. The cabinet stands 460mm (18.1in) high, 429mm (16.9in) wide and 410mm (16.1in) deep, and weighs 43kg. Cabinet finishes are Gloss Black and Rosenut with black grilles, and Satin White with grey grilles.
specs: |-
  - Description: DB Series Subwoofer
  - Drive units: 2 x 300mm (12in) Aerofoil-cone drive units in a balanced (back-to-back opposed) configuration
  - Amplifier: 2000W Class D Hypex
  - Max power output: 2000W
  - Frequency response: 10Hz to 350Hz -3dB (centred on level at 100Hz)
  - Frequency range: -6dB at 8.5Hz to 500Hz
  - Digital preamplifier with Dynamic EQ
  - Room EQ system that requires no separate measurement microphone
  - App-based set-up and BT-LE control (dedicated Bowers & Wilkins app for iOS and Android; Bluetooth LE is a control path, not an audio port)
  - Inputs: 2 x XLR, 2 x RCA, 2 x 3.5mm 12V trigger, RS-232 9-pin D connector
  - Dimensions: height 460mm (18.1in), width 429mm (16.9in), depth 410mm (16.1in)
  - Net weight: 43kg
  - Cabinet finishes: Gloss Black (black grilles), Rosenut (black grilles), Satin White (grey grilles); also offered in Stealth Black and Warm White
