description: A Eurorack polyrhythmic gate/trigger generator that creates complex
  gate patterns by patching signals into four CV inputs, changing its sixteen
  gate/trigger outputs as the CV input states toggle between high and low.
details: |-
  "KPG" is a polyrhythmic gate/trigger generator that produces complex and varied gate patterns from signals patched into its four CV inputs. The output jacks change as the state (high or low) of the four CV inputs changes.

  - 4 CV INPUT
  - SYNC INPUT
  - 16 GATE / TRIGGER OUTPUT (each output can be switched between gate and trigger by cutting the jumper on the rear)

  Supplied with a power cable.

  Width: 14HP
  Depth: 21mm
  Power: +12V 15mA / -12V 12mA

  Built by hand in Japan.
