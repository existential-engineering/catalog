description: A Eurorack polyrhythmic gate/trigger generator that creates complex
  gate patterns by patching signals into four CV inputs, changing its sixteen
  gate/trigger outputs as the CV input states toggle between high and low.
details: |-
  こちらは受注後に組み立てするBuild to Orderの商品となっております。 お支払い確認後1〜2週間前後での納品となりますのでご了承ください。

  <商品説明>
  "KPG"は4箇所のCV入力にシグナルをパッチすることによって複雑で多様なゲートパターンを生成するポリリズミックなゲート/トリガージェネレーターです。
  4つのCV入力のステイタス(High/Low)が変化するとアウトプットジャックが変化します。

  ・4 CV INPUT
  ・SYNC INPUT
  ・16 GATE / TRIGGER OUTPUT
  (背面のジャンパーをカットすることで 各出力ごとにGATE/TRIGGERの設定を切り替えることができます。)

  マニュアル(JP)

  Manual(ENG) Translated by DeepL

  付属品: 電源ケーブル

  Width: 14HP
  Depth: 21mm Power: +12V 15mA / -12V 12mA
  Built by hand in Japan.

  <注意事項>

  ※電源を入れる前に電源の接続を再度ご確認ください。
  当製品の使用により直接または間接的に発生した人身事故、機器の損傷、使用不能について、一切の責任を負いません。

  基板製造に伴い発生してしまう印刷ムラやスレ、キズなどがある場合がございますのでご了承ください。
