translations:
  ja:
    details: |-
      "KPG"は4箇所のCV入力にシグナルをパッチすることによって複雑で多様なゲートパターンを生成するポリリズミックなゲート/トリガージェネレーターです。
      4つのCV入力のステイタス(High/Low)が変化するとアウトプットジャックが変化します。

      ・4 CV INPUT
      ・SYNC INPUT
      ・16 GATE / TRIGGER OUTPUT
      (背面のジャンパーをカットすることで各出力ごとにGATE/TRIGGERの設定を切り替えることができます。)

      付属品: 電源ケーブル

      Width: 14HP
      Depth: 21mm
      Power: +12V 15mA / -12V 12mA
