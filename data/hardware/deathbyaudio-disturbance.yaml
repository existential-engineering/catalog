description: "PLEASE, DO DISTURB Introducing the DISTURBANCE: an innovative
  filter, flanger, and phaser pedal offering unparalleled modulation. With the
  DISTURBANCE's intuitive controls, sculpt your sound precisely to your liking."
details: |-
  The DISTURBANCE is a filter, flanger, and phaser pedal built around a custom modulation core. The Filter offers both highpass and lowpass options for resonant swells and piercing tones, the Flanger ranges from watery delays to screaming flange with distorted feedback, and the Phaser mode delivers an 8-stage phaser sound with filtered scoops or a blend of phaser and flanger tones.

  Its custom-designed modulation core lets you freeze the LFO mid-cycle to create frozen modulation effects. The pedal also features a CV OUT jack that transmits the LFO as a control voltage to compatible devices, including other Death By Audio pedals with expression inputs and Eurorack oscillators, filters, or other units. The CV OUT is set to about 0-5 V by default and can be trimmed from near 0 V up to 7 V using the internal CV LEVEL trimmer.

  The Filter/Flanger/Fazer switch selects the modulation type, and the Tensity knob sets the intensity of the effect with distinct "-" and "+" modes for each type. The Center Point, Width, and Speed knobs shape the modulation LFO, and the Trip stomp freezes the LFO at its current position, resuming the cycle wherever it left off when pressed again.
specs: |-
  - Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel
  - Current Draw: 67 mA
  - CV Output Voltage: 0-7 V (Trimmable)
  - Dimensions: 4.95" x 3.95" x 2.6" (including hardware)
  - Weight: 13 oz.
