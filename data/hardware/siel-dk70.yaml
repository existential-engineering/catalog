description: >-
  The DK70 is a fully programmable, battery-powered portable synthesizer featuring
  subtractive synthesis using DCO, VCF, and VCA technology, similar to Roland's Alpha Juno
  series. It excels at string sounds, pads, bass, and strange noises, with warmer and more
  analog qualities from its VCF and VCA sections compared to similarly designed
  competitors. It is an underrated synth targeted at live performers, though editing
  sounds is tedious due to limited front-panel controls.
details: |-
  The Siel DK70 is an 8-voice polyphonic synthesizer from 1985 that uses subtractive synthesis built around DCO, VCF, and VCA architecture. In dual mode, it operates as 4 voices with 2 DCOs per voice for richer layered sounds. The filter section features a resonant 24dB/octave (4-pole) low-pass filter that gives the instrument its characteristically warm analog quality.

  The 49-key keyboard supports split and layer modes but lacks velocity sensitivity. It includes a 2-track polyphonic sequencer capable of storing up to 200 notes, along with a built-in chorus effect. Memory consists of 40 preset patches and 10 user patches, expandable to 100 with optional ROM/RAM cartridges.

  An optional Stage Set Grip accessory provides pitch ribbon, modulation depth, program change, and octave controls for enhanced live performance. MIDI In, Out, and Thru connections are included for integration with other gear.
specs: |-
  - Polyphony: 8 voices (4 voices in dual mode with 2 DCOs per voice)
  - Oscillators: 8 DCOs (Square/Sawtooth)
  - Filter: 1 resonant 24dB/octave (4-pole) low-pass VCF
  - Envelopes: ADSR envelope on VCA, triggered by gate or LFO
  - LFO: 1
  - Effects: Chorus
  - Sequencer: 2-track polyphonic (up to 200 notes)
  - Keyboard: 49 keys, split/layer capable, no velocity sensitivity
  - Memory: 40 preset patches, 10 user patches (expandable to 100 with ROM/RAM cartridges)
  - Control: MIDI In/Out/Thru
releaseDate: "1985"
