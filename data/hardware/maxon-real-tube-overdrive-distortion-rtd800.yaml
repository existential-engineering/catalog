description: A pedal combining independent Overdrive and Distortion circuits
  with a real dual-triode tube, a footswitchable Boost, a 3-band EQ, and a
  switchable noise gate, offering a wide range of saturated guitar tones.
details: |-
  With independent Overdrive, Distortion, Boost and Noise Gate circuits all under one hood, the RTD800 may be the last "dirt" pedal that you'll ever need. By combining various solid-state clipping stages with a real dual-triode tube, the RTD800 offers a massive array of saturated guitar tones. From traditional tube overdrive through full-on gated metal distortion, no other drive pedal offers this degree of versatility in a single package. The RTD's 3-band EQ circuit is incredibly versatile and can literally dial in any tone imaginable. With zero frequency overlap, all the three controls are highly interactive and make even the slightest of tone tweaks possible under any playing situation. The Overdrive channel of the RTD creates a warm, organic tone that's like driving a maxxed-out amp with an OD pedal. Where some pedals can get in the way of your dynamics, the RTD retains an expressive and dynamic interaction between your guitar and amp, cleaning up beautifully when you roll back on your guitar's volume and effortlessly tracking picking nuances. The RTD's Distortion channel offers up all the gain and character of a hot-rodded Plexi, JCM800 or Soldano. Searing, sizzling solo tones and sustain for days, yet with a distinct clarity that lets individual notes "pop" and chime through. Even at maximum distortion settings the RTD retains an expressiveness and dynamic response that takes your playing to the next level. For even more versatility, the RTD800 features a foot switchable Boost function that can be varied between 3-9 dB via an internal trim pot. The boost comes post OD/Distortion, allowing the user to dial in the perfect level boost for solos. Higher gain settings on either channel can be kept tight and noise-free using the RTD's switchable Noise Gate with variable Threshold. The gate itself is incredibly responsive and tight, with none of the false-triggering and "sputter" common to other pedals. Like all Maxon products, the RTD800 features True Mechanical Bypass switching using a 3PDT switch. The RTD800 comes complete with the Maxon AC2009 9-Volt power supply, an auto sensing digital power supply that can be used anywhere in the world. When you require an unparalleled variety of REAL-tube tones, only the Maxon RTD800 will do. With four independent functions averaging around $100 apiece, the RTD800 may be the most cost-effective, versatile and space-saving pedal available. TECH TALK:

  The RTD800's independent and selectable Overdrive and Distortion modes are configured as follows:

  The Overdrive circuit features two stages of clipping - a bi-directional clipping diode in the feedback loop of the op-amp and then a single-diode in the second stage for asymmetrical clipping. The Distortion circuit also features two clipping stages, but configured differently - a bi-directional clipping diode in feedback loop of the op-amp, and then a 2nd stage with a passive bi-directional clipping circuit. Unlike other tube overdrive pedals, the RTD800 places the tube after the OD/Distortion circuits, making it the best tube overdrive pedal to recreate an authentic tube-amp tone. The RTD features an In-Rush Current Control system - As soon as power is applied to the pedal, a small current is applied to the tube and begins heating it at a very low voltage (much like a tube amp standby switch). This system dramatically extends the tube life. Once the pedal is engaged, 12.6 VDC is applied to the tube heater. The RTD800 features mechanical true bypass switching via a Fujisoku 4PDT switch. NOTE ON POWERING THE RTD800 - this pedal's voltage regulator IC requires a high inrush current of approximately 2000 mA upon startup. When using with a Power Brick such as the Voodoo Labs Pedal Power 2+, this pedal should be connected to a high current power jack when possible. Input Impedance : 500K Ohms

  Output Impedance : 10K Ohms

  Max Gain : 72dB (at 1.5 kHz)

  Equivalent Input Noise : -110 dBu or less (Input shorted, IHF-A weighted)

  Control : GAIN, NR, MASTER, BASS, MID, TREBLE

  Switch : BYPASS/EFFECT (Mechanical 3PDT); BOOST ON/OFF, NR ON/OFF, OD/DIST

  I/O : INPUT JACK, OUTPUT JACK, DC INPUT JACK

  Indicator : BYPASS/EFFECT LED, BOOST LED, GATE LED

  Internal Circuit Voltage : 12.6VDC (DC to DC Converter)

  Power Consumption : 440mA / 9VDC

  Dimensions : 121 (W) × 152 (D) × 60 (H) mm / 4.8" (W) x 6" (D) x 2.4" (H)

  Weight : Approx. 620g / 1.4 Lbs. (without power supply)

  Power Supply : AC adaptor AC2009

  Accessory : AC adaptor AC2009 * 0dBu = 0.775Vrms

  * All specifications are subject to change for improvement without notice or obligation. All brand names and product names are trademarks or registered trademarks of their respective companies.
specs: |-
  - Overdrive/Distortion with real Vacuum Tube
  - Independent switchable Overdrive and Distortion Circuits
  - Foot switchable Boost with 3-9 dB adjustable level
  - Three-band tone circuit with Bass, Midrange and Treble
  - Switchable Noise Suppressor with variable Threshold
  - Heater In-rush current control warms tube upon power-up
  - True Bypass Switching
