description: A 2hp Eurorack module that provides an active stereo headphone and
  line-level output with a volume slider, converting modular signals for
  external listening.
details: |-
  You've been plugging, patching and sweeping for hours, when it hits you: you're not actually listening to what you're making. Up until this point, the sad reality of modular has been that your ears won't hear the sweet sounds of your music, unless you invest in a bloated, oversized output module or a professional mixer. This ends now. The Herzlich Micro Phone Out is an active headphone output in only 2hp - and it includes a very pleasantly tactile volume slider! Gone are the days where you would have to spend untold hp on useful and clean headphone outputs, now all that remains is beautiful, small simplicity. No stereo signals to process? No problem. The left channel automatically works as a mono input with nothing plugged into the right channel. Forget everything else - this is the one and only output module you'll need!
