description: Trakker is a high quality single-channel discrete Class A
  compressor-limiter that functions either as a musically transparent compressor
  or as a vintage compressor-limiter with selectable hard or soft knee. It
  offers four distinct amplifier/gain control sounds and can be linked with up
  to eight units for surround mixing.
details: |-
  Trakker is a high quality Single Channel Discrete Class A Compressor-Limiter. It functions either as a musically transparent compressor or as a vintage compressor-limiter with selectable hard or soft knee. It can create distinct new sounds or maximize existing ones. The Trakker has adjustable threshold, attack, release, knee shape, and makeup gain controls. In addition to these controls, a function switch allows the selection of transparent operation or vintage operations such as optical, air optical, soft knee, and hard knee, each with four different amplifier/gain control sounds.

  The amplifier/gain control sounds are: Transparent; Vintage (tube or old style class A); Transparent with VCA artifacts; and Vintage with VCA artifacts.

  The front panel contains a 22 element VU meter with overload indicator to show gain reduction and allow accurate monitoring of output levels. In the link mode the master unit controls all functions of the slave units except for make-up gain. An additional feature of the Trakker is the ability to link up to 8 units for surround mixing.
specs: |-
  - Adjustable threshold, attack, release, knee shape, and makeup gain controls
  - Function switch for transparent or vintage operation (optical, air optical, soft knee, hard knee)
  - Four selectable amplifier/gain control sounds per mode: transparent, vintage, transparent with VCA artifacts, vintage with VCA artifacts
  - 22-element VU meter with overload indicator
  - Linkable up to 8 units for surround mixing
