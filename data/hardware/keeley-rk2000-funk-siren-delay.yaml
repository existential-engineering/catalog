details: |-
  The RK2000 Funk Siren Delay is a pedal recreation of the DM2000 rackmount delay of 1983, the unit Trey Anastasio uses to build the ambient loop known as the Funk Siren. The project was started at the request of his guitar tech, Justin Stabler, to replace 40-year-old hardware that had become unreliable, and it is the first time the circuit's Hold and Mod behaviour has been offered in pedal form.

  The modulation section is the pedal's signature: it ranges from a subtle warble to dramatic effects likened to slamming a hand against the supply reel of a tape deck. Alongside it the pedal offers presets, remote switching of Hold and Mod, expression control over any parameter, pitch-shifted ping-pong delays and MIDI control.

  The Time knob sets the delay offset over a range of 1 ms to 1023 ms, or selects the subdivision of the tap tempo and delay time.

  Connectivity covers true stereo input and output, a remote control input, expression control and full MIDI control. The pedal requires 9 to 18 V DC at 150 mA. A companion remote switcher is sold separately for controlling Hold and Mod from elsewhere on a pedalboard.
