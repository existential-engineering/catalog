description: A dual-channel, Class A microphone preamplifier with a pristine
  signal path and linear response. It offers 70dB of gain, variable impedance
  selection, 48-volt phantom power, and a high-pass filter.
details: |-
  The Miktek MPA-201 dual-channel, Class A microphone preamplifier will surprise and please the most sophisticated listener. Its pristine signal path and sweet, linear response highlight and elevate the sound of any microphone or instrument. Seventy dB of gain, variable impedance selector, 48-volt phantom power, high-pass filter, and six massive audio transformers make the Miktek MPA-201 a premium design — in all but price. Specifications

  Downloads

  Manual
specs: |-
  - Class A, Discrete Transistor Vintage Design
  - Linear response 1 dB down at 10Hz and 1 dB down at 100kHz
  - Sweet sound from Custom Designed Transformers
  - 48 Volt Phantom Power
  - Variable High-Pass Filter
  - Relay controlled Phase switch
  - Smooth switch selects different output loading for "racked" and "in-console" sound
  - Impedance selector allows for 300, 600, or 1200 Ω load
  - Large backlit VU Meters switchable to display Input and Output Levels
  - +4 XLR Balanced Outputs
  - Heavy duty metal construction featuring steel chassis and milled aluminum front panel in an attractive silver finish.
