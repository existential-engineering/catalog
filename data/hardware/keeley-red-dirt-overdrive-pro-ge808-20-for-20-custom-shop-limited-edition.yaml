description: 20 for 20 Custom Shop edition of the Red Dirt Overdrive Pro GE808,
  a germanium high-gain overdrive with LED clipping and a FET input stage.
details: |-
  This is the Red Dirt Overdrive Pro GE808 in one of the 20 for 20 Custom Shop finishes. Each of the twenty colorways in the series carries a 20 for 20 insignia and is limited to twenty units.

  The Red Dirt Overdrive began as a search for a classic drive sound, and the GE808 widens that range. Keeley describes the limited GE-808 as a blend of the hot sounds of the Red Dirt Germanium with the full, bold voice of the Red Dirt Professional Limited Edition.

  It takes the parallel gain branches of the Red Dirt Germanium, which give a large gain response and what Keeley calls the fullest sounding Tube Screamer style pedal the company has made, and combines them with the fat valve tone of the Red Dirt Pro models by using LEDs for clipping.

  A Keeley designed FET input stage gives the overdrive a valve-like breakup. The result is aimed at dynamic lead and rhythm playing, with enough clarity to cut through a dense mix while keeping a full midrange. The pedal is hand-built in the USA.
specs: |-
  - - Germanium high-gain overdrive
  - - Parallel gain branches, as in the Red Dirt Germanium
  - - LED clipping, as in the Red Dirt Pro models
  - - Keeley designed FET input stage
  - - Dual LED indication
  - - Hand-built in the USA
  - - 20 for 20 Custom Shop finish, limited to 20 units, carrying the 20 for 20 insignia
