description: Compact, portable, bus-powered 66-channel 192 kHz USB 2.0 audio
  interface with 4 optical ADAT/SPDIF I/Os and an analog stereo headphone
  output. Successor to the legacy HDSP Digiface PCI card.
details: |-
  The RME Digiface USB is a compact, portable, bus-powered 66-channel 192 kHz USB 2.0 audio interface built around four optical ADAT/SPDIF I/Os and a single analog stereo headphone output. It is positioned as the modern successor to RME's legacy HDSP Digiface PCI card, transferring the same triple-ADAT-style philosophy to a fully USB-based, mobile-friendly chassis with one additional optical port and full driver-level integration with RME's TotalMix FX environment.

  Each of the four optical ports can independently operate as ADAT (up to 8 channels) or as SPDIF (stereo). Inputs auto-detect the incoming signal format, while outputs can be individually switched between ADAT and SPDIF operation. At base sample rates this provides up to 32 channels of input and 32 channels of output simultaneously; S/MUX support halves channel count at 96 kHz (16 in / 16 out) and S/MUX4 at 192 kHz yields 8 channels in/out through the optical ports.

  The only analog audio path on the unit is the dedicated stereo headphone output on a 6.3 mm (1/4 inch) TRS jack, carrying channels 33/34. RME quotes 110 dB RMS unweighted (113 dBA) dynamic range, +9.5 dBu output at 0 dBFS into 1 kΩ, 2 Ω output impedance, and a maximum power of 50 mW at 0.1% THD, with frequency response extending to 89 kHz at 192 kHz sample rate. The output is DC-coupled, allowing it to double as a control or signal source where required.

  The Digiface USB ships with the full TotalMix FX mixer, providing flexible routing, a Control Room section with Talkback, Main/Phones, fader and mute groups, and complete remote controllability via Mackie Control or OSC. The interface does not include onboard DSP effects, but is fully ARC USB compatible and integrates with DigiCheck NG for measurement and analysis. Sample rates from 28 kHz to 200 kHz are supported, with internal SteadyClock providing 800 ps internal jitter and over 30 dB external jitter suppression at 2.4 kHz.

  Physically the unit is exceptionally small and light at 128 x 22 x 55 mm and 220 g, and is powered entirely from the USB bus (typical 1.2 W, max under 2 W) with no external supply required. Clock sources include Internal, ADAT In and SPDIF In. The device targets mobile studios, portable monitoring, format-conversion rigs, and integration into existing optical-rich setups where additional ADAT channels and headphone monitoring are needed without adding rack space.
specs: |-
  - 66-channel 192 kHz USB 2.0 audio interface
  - USB bus-powered (no external power supply required)
  - Typical power consumption: 1.2 W; maximum < 2 W; 230 mA @ 5 V
  - Supported sample rates: 28 kHz to 200 kHz
  - 4 x optical ADAT/SPDIF inputs (TOSLINK), each switchable as ADAT or SPDIF
  - 4 x optical ADAT/SPDIF outputs (TOSLINK), each switchable as ADAT or SPDIF
  - Optical inputs auto-detect ADAT vs SPDIF; outputs individually switchable
  - ADAT mode: 32 channels @ up to 48 kHz, 16 channels @ 96 kHz (S/MUX), 8 channels @ 192 kHz (S/MUX4)
  - Optical I/O specification: Alesis ADAT, IEC 60958 SPDIF compatible
  - Optical lock range: 31.5 kHz - 50 kHz; jitter when synced: < 1 ns
  - 1 x stereo headphone output on 6.3 mm TRS jack (unbalanced), channels 33/34
  - Headphone dynamic range: 110 dB RMS unweighted (113 dBA)
  - Headphone frequency response @ 44.1 kHz (-0.5 dB): 0 Hz - 20.8 kHz
  - Headphone frequency response @ 96 kHz (-0.5 dB): 0 Hz - 45 kHz
  - Headphone frequency response @ 192 kHz (-1 dB): 0 Hz - 89 kHz
  - Headphone THD @ -1 dBFS: -96 dB (0.0016%); THD+N: -95 dB (0.0017%)
  - Headphone channel separation: > 100 dB
  - Headphone output impedance: 2 Ohm
  - Headphone output level @ 0 dBFS, 1 kOhm load: +9.5 dBu
  - Headphone max power @ 0.1% THD: 50 mW
  - DC-coupled headphone output
  - Clock sources: Internal, ADAT In, SPDIF In
  - Internal clock jitter: 800 ps (Random Spread Spectrum)
  - External clock jitter suppression: > 30 dB at 2.4 kHz
  - TotalMix FX mixer with Control Room (Talkback, Main/Phones, fader/mute groups)
  - Remote control via Mackie Control or OSC; ARC USB compatible
  - Dimensions (W x H x D): 128 x 22 x 55 mm (5.04" x 0.87" x 2.2")
  - Weight: 220 g (0.49 lbs)
  - Operating temperature: +5 to +50 C (41 to 122 F); relative humidity < 75%, non-condensing
