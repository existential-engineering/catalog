specs: |-
  - Format: Eurorack
  - Width: 8HP
  - Depth: 20 mm from faceplate (skiff-friendly)
  - Circuitry: Fully analogue, SSI2144-based
  - Filter Type: 4-pole (24 dB/oct) low-pass
  - Slope: True ladder response with smooth roll-off
  - Power Requirements: - +12 V: 15 mA
  - –12 V: 15 mA
  - Faceplate: Durable composite or aluminium
  - Audio Input
  - CV Input (with attenuator)
  - Key Input (for signal-level frequency modulation/compensation)
  - Audio Output
  - Frequency: Large primary cutoff knob
  - Resonance: Musically tuned self-oscillation capable
  - CV Attenuator: For precise modulation depth control
  - 24 dB/octave low-pass response
  - Exceptionally low noise floor (improved over vintage SSM designs)
  - High dynamic range and low distortion signal path
  - Reduced low-frequency loss at high resonance
  - Stable, voltage-controlled resonance capable of self-oscillation
  - Classic "liquid" ladder character with modern precision and reliability
