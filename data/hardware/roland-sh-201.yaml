description: >-
  Roland resurrected their SH-series of synthesizers with the SH-201, an analog modeling
  synthesizer that is both fun and easy to use with plenty of features and cool sounds at a great
  price. The instrument emphasizes accessible, hands-on performance capabilities with an organized
  panel layout.
details: |-
  The SH-201 features analog-style sounds and controls with Roland's Supersaw waveform first
  introduced in the JP-8000. It offers 10 voices of polyphony with a compact 49-key
  velocity-sensitive keyboard without aftertouch. The unit includes a D-Beam controller for
  gestural sound manipulation, USB connectivity for MIDI and audio routing, and a VSTi software
  editor. External audio inputs with dedicated filters and effects are provided. The user-friendly
  design avoids complex menus. Two analog sound modeling oscillators provide 9 waveforms plus
  external input. The filter offers LPF, BPF, and HPF modes with -12 and -24 dB/oct slopes. Used
  by musician Richard Barbieri.
specs: |-
  - Polyphony: 10 voices
  - Oscillators: 2 analog sound modeling with 9 waveforms plus external input
  - Filter: 1 with LPF, BPF, HPF (-12/-24 dB/oct)
  - LFOs: 2 with 6 waveforms plus S&H and random
  - Effects: Reverb, modulation delay, overdrive
  - Memory: 32 user plus 32 preset patches
  - Arpeggiator: 32 programmable patterns
  - Keyboard: 49 keys, velocity-sensitive
  - Connections: MIDI IN/OUT, USB audio/MIDI
releaseDate: "2006"
releaseDateYearOnly: true
