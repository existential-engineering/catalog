description: The Bricasti M3 is a high-performance stereo D/A converter
  featuring dual fully differential conversion channels with separate PCM and
  native DSD support, precision DDS clocking, dual independent linear power
  supplies, and an optional Roon Ready network player.
specs: |-
  - Digital inputs: XLR AES/EBU, RCA S/PDIF, Toslink optical, USB 2.0, Ethernet (optional)
  - Fully differential dual channel conversion
  - Separate PCM and native DSD conversion paths
  - Precision DDS clocking
  - Dual independent linear power supplies
  - Balanced XLR analog outputs
  - Unbalanced RCA analog outputs
  - Roon Ready (via optional network player)
  - Handcrafted in Massachusetts, USA
