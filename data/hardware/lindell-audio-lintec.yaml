details: |-
  The LiNTEC does the infamous low-end trick that's been used to fatten basslines and kick drums on thousands of recordings, just choose the desired LF frequency (try starting at 100 Hz) and turn up both the LF Boost and LF Attenuate controls at the same time to taste.

  Documentation for the original Pultec rather bullishly asserted 'Do not attempt to boost and attenuate simultaneously on the low frequencies.' So, of course, that's exactly what curious, rascally engineers did.

  The result of this simultaneous boost and cut operation is a low-end boost below the selected frequency, with a cut slightly above the selected frequency. This setting results in satisfying thump and body that doesn't risk muddying the midrange, and has been a not-so-secret trick of engineers and producers ever since.
