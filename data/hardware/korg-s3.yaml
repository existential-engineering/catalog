description: >-
  Korg's S3 Rhythm Workstation combined a 12-voice drum machine with an
  eight-track MIDI sequencer and dual digital effects processors, making it one
  of the more ambitious rhythm instruments of the early 1990s. First announced
  in 1989 but not shipping until 1991, it offered producers a versatile
  instrument for creating and sequencing both drum patterns and external MIDI
  instrument parts with built-in sound manipulation tools.
details: |-
  First announced in 1989 but not shipping until 1991, the Korg S3 was designed to be more than a simple drum machine. It incorporated an eight-track sequencer capable of recording both internal drum parts and external MIDI instrument data, bridging the gap between a standalone rhythm unit and a full production workstation.

  The S3 offered 75 internal 16-bit PCM samples with expansion possible through two ROM card slots adding up to 40 additional samples, plus a RAM data card slot for storing user configurations. Eight velocity-sensitive drum pads with layering support gave performers hands-on control over their patterns, and the ability to layer multiple sounds on a single pad significantly expanded sonic possibilities beyond typical drum machines.

  Two independent stereo multi-effects processors provided 28 programmable effects, a generous feature set for the era. The S3 also supported SMPTE timecode reading and transmission as well as MIDI Time Code compatibility, making it suitable for synchronizing with other studio equipment and sequencers.

  Pattern memory included 128 presets and 128 user slots, along with 30 user songs. Ten factory-preset kits were stored in ROM, expandable to thirty with RAM card storage. A backlit 2x24 character LCD display, four control buttons, a data entry wheel, and master volume slider handled programming duties on a clean, uncluttered front panel.

  The S3 was a capable tool for producers who wanted drum programming and sequencing in a single unit, though its steep learning curve and relatively late arrival meant it faced stiff competition from rival workstations that were rapidly evolving during this period.
specs: |-
  - Polyphony: 12 voices
  - Multitimbral: 12 parts
  - Sounds: 75 internal 16-bit PCM samples, expandable via 2 ROM card slots (up to 40 additional samples)
  - Data Storage: RAM card for 2 Timbre banks and up to 20 custom kits
  - Pads: 8 velocity-sensitive with layering
  - Sequencer: 8-track MIDI
  - Patterns: 128 preset, 128 user
  - Songs: 30 user
  - Effects: 2 independent stereo multi-effects (28 programmable types, 16-bit digital)
  - Sync: SMPTE timecode read/write, MIDI Time Code
  - Display: 2x24-character backlit LCD
  - MIDI: In/Out/Thru
