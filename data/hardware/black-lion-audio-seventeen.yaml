description: Modernized '76-style FET limiting amplifier
details: Black Lion's contemporary interpretation of the classic '76 limiter,
  developed with hitmaker Tobias Lindell. Features a redesigned IC-based front
  end delivering incredible detail and nuance while maintaining vintage
  character when driven harder. Includes a custom-designed, Chicago-made output
  transformer, Black Lion proprietary power decoupling for a low noise floor,
  and Nichicon signal capacitors for optimal signal quality. The Seventeen also
  features a frequency-adjustable sidechain with selectable high/low pass
  filters, stereo link capability via RCA jack, a wet/dry mix control, and an
  all-buttons-in mode with a modern toggle-button design.
specs: |-
  - Type: FET Compressor
  - Channels: 1
  - Ratio: 4:1, 8:1, 12:1, 20:1
  - Attack: 20µS to 800µS (continuously variable)
  - Release: 50mS to 1200mS (continuously variable)
  - Rack Spaces: 2U
  - Dimensions: 19" W x 3.5" H x 6" D
  - Weight: 14.5 lbs
  - Power: Standard IEC AC cable
