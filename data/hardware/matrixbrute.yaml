description: >
  MatrixBrute is arguably the most powerful analog monophonic synthesizer ever! As flexible as a modular system but offering presets, MatrixBrute is a dream machine for everyone interested in creating a sound palette of their own.
details: |-
  Matrixbrute is an analog monophonic synthesizer featuring three brute oscillators, a steiner-parker filter, a ladder filter, five analog effects, and an advanced modulation matrix. The instrument offers 256 preset memory locations with 128 factory presets, combining the flexibility of a modular system with the convenience of preset recall. Its 100% analog audio signal path ensures sonic quality and authenticity.

  The dual filter architecture allows series or parallel patching of the steiner-parker and ladder filters, each with switchable 12db and 24db per octave slopes and drive controls for sound shaping. Three envelope generators (two adsr and one dadsr) provide extensive sound sculpting capabilities, while three lfos with seven waveforms and trigger modes enable complex modulations. The audio mod section facilitates oscillator and filter fm for creating new tonalities.

  The modulation matrix is the heart of matrixbrute, allowing assignment of any of 16 modulation sources to any of 16 destinations, with four user-programmable destinations visible on an e-ink display. The 64-step sequencer features separate step, accent, slide, and modulation steps and can be used as a modulation source itself. The 49-note keyboard includes velocity and aftertouch, with multiple keyboard modes for mono, paraphonic, and duo-split playing.

  The instrument includes a sequencer and arpeggiator with multiple modes for unlimited musical possibilities, plus analog delay, chorus, and flanger effects with five operation modes. All effect controls can be assigned as modulation destinations within the matrix. Extensive connectivity includes 12 CV inputs and outputs for 1v per octave modular synth integration, gate inputs and outputs, expression and sustain pedal inputs, MIDI in/out/thru, and USB I/o for DAW integration.

  The free MIDI control center editor/librarian software allows organization, saving, and loading of sound banks. Matrixbrute's one-knob-per-function interface provides direct connection between creative intent and sonic results, with pitch bend and mod wheels plus four assignable macro encoders for real-time performance control. The instrument measures 33.8 x 17 x 4.2 inches and weighs 44lbs.
specs: |-
  - Three brute oscillators with sawtooth, pulse, triangle waveforms
  - Ultra saw waveshaper
  - Metalizer waveshaper
  - Sub-oscillators on brute oscillators 1 and 2
  - One analog linear vco/lfo with saw, square, triangle, sine waveforms
  - Noise generator with white, pink, red, blue noise types
  - Steiner-parker filter with 12db and 24db per octave slopes
  - Steiner-parker filter modes: low pass, high pass, band pass, notch
  - Steiner-parker filter drive and brute factor controls
  - Ladder filter with 12db and 24db per octave slopes
  - Ladder filter modes: low pass, high pass, band pass
  - Ladder filter drive control
  - Dual filter configuration: series or parallel patching
  - Two adsr envelopes
  - One dadsr envelope
  - Three lfos with 7 waveforms and trigger modes
  - Audio mod section for oscillator and filter fm
  - Pitch bend and mod wheels
  - Four macro encoders assignable to modulation destinations
  - Modulation matrix with 16 modulation sources to 16 destinations
  - Four user-programmable modulation destinations
  - E-ink display for modulation routing
  - 64-step sequencer with step, accent, slide, and modulation steps
  - Sequencer pattern save and recall
  - Arpeggiator with multiple modes
  - Multiple keyboard modes: mono, paraphonic, duo-split
  - 49-note keyboard with velocity and aftertouch
  - 256 preset memory locations
  - 128 factory presets
  - Analog delay effect
  - Chorus effect
  - Flanger effect
  - Five analog effects operation modes
  - 100% analog audio signal path
  - Stereo master audio outputs
  - 12 CV inputs
  - 12 CV outputs
  - 1v per octave modular synth compatibility
  - Line and instrument level inputs
  - External oscillator input
  - Gate inputs and outputs
  - Expression pedal input
  - Sustain pedal input
  - MIDI in, out, and thru
  - USB I/o
  - Free MIDI control center editor/librarian software
  - True analog effects
  - Instrument dimensions: 33.8 x 17 x 4.2 inches (860 x 432 x 107mm)
  - Weight: 44lbs (20kg)
