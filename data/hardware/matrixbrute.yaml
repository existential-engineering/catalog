description: >
  MatrixBrute is arguably the most powerful analog monophonic synthesizer ever!
  As flexible as a modular system but offering presets, MatrixBrute is a dream
  machine for everyone interested in creating a sound palette of their own.
details: |-
  Matrixbrute is an outstanding analog synthesizer offering three brute oscillators, a steiner-parker filter and a ladder filter, five analog effects, and the incredible modulation matrix, making it a massive sonic beast.

  The heart of the matrixbrute is its unique modulation matrix that allows you to create your own routings and invent a sound palette of your own that will be sure to be heard in any mix. The matrix can also be used to recall your presets, allowing you to select any of the 256 presets instantly with no menus or awkward selection screens, everything at your fingertips.

  The matrix is also made to program and play sequences as no ordinary step-sequencer, with its ability to also be used as a modulation source, allowing sounds to evolve in melody and texture just the way you want.

  The matrix is where matrixbrutes analog reactivity and digital precision collide - an advanced architecture unlike any synth before it. Sawtooth, pulse, triangle, waves with the unique waveshapers that have become the trademark of the 'brute' sound, with a sub-oscillator on each of the two brute oscillators and a third oscillator that can be used for both audio signals and lfo modulation at the same time.

  Matrixbrute offers a 49 note keyboard featuring both velocity and aftertouch for a musical feel with plenty of expression, 12 CV inputs and 12 CV outputs allowing interface with standard 1v per octave modular synth gear, and standard MIDI in, out and thru connectivity along with USB I/o for interfacing to a computer DAW directly and access to the free editor/librarian software.
