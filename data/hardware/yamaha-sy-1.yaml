description: >-
  The Yamaha SY-1 is Yamaha's first compact analog preset synthesizer, a
  monophonic instrument derived from the flagship GX-1 with 28 preset sounds and
  editable synthesis parameters.
details: |-
  Introduced in 1974, the SY-1 holds the distinction of being one of Yamaha's first portable analog
  synthesizers, drawing its voice architecture from the legendary and prohibitively expensive GX-1.
  It was originally conceived as an accessory instrument for organ and piano players seeking to add
  synthesizer textures to their performances.

  The SY-1 features a single VCO routed through a lowpass resonant filter, with an LFO providing
  vibrato and wah-wah modulation. Its 28 preset sounds are organized by color-coded switches: red
  for woodwind and brass timbres like clarinet, flute, and trumpet; yellow for piano and string
  sounds; and green for synthesized textures including the distinctively named "Growlpet." While the
  presets provide quick starting points, players can freely reshape them using the front panel
  sliders and knobs.

  The 37-key keyboard includes aftertouch sensitivity, and portamento allows smooth pitch glides
  between notes. The SY-1 has appeared in notable contexts, with Royksopp among its documented
  users, while the closely related SY-2 variant famously featured in Steven Spielberg's "Close
  Encounters of the Third Kind" and was used by the BBC Radiophonic Workshop. The SY-2 added
  highpass filtering and full ADSR envelope control over the SY-1's simpler attack-sustain design.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Filter: Lowpass resonant analog filter
  - LFO: 1 (vibrato/wah-wah)
  - Envelope: Attack, Sustain
  - Presets: 28 (color-coded: woodwind/brass, piano/strings, synthesized)
  - Keyboard: 37 keys with aftertouch
  - Effects: Portamento, attack pitch/tone bend
  - Control: Foot control for volume
  - Weight: 26 lbs (12 kg)
releaseDate: "1974"
