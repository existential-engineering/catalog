description: The OM1 T is a Traditional Series Orchestra Model acoustic guitar
  from Collings, offering a vintage-inspired variation on the distinctive
  Collings sound. Built with a Sitka spruce top and Honduran mahogany back,
  sides, and neck, it is designed to showcase the most desirable characteristics
  of coveted pre-war instruments. The Traditional Series designation means it
  features period-correct construction details including a pre-war scalloped
  X-brace, ebony fingerboard, and nickel Waverly tuners.
details: |-
  The OM1 T is part of the Traditional Series, representing a vintage-inspired take on the Orchestra Model body shape. It features a Sitka spruce top paired with Honduran mahogany back and sides, delivering a warm, balanced tone with clear articulation across the frequency range. The neck is also Honduran mahogany, topped with an ebony fingerboard featuring gold mother-of-pearl short dot inlays and a compound fingerboard radius of 14" to 26". Construction highlights include a custom Traditional Series pre-war scalloped X-brace with an abbreviated soundboard graft (tongue brace), a belly-style ebony bridge with 2 5/16" string spacing, and bone nut and saddle. The body is finished in high gloss ultra-thin nitrocellulose lacquer, while the neck receives a high gloss polyester resin finish.
specs: |-
  - Body Shape: Orchestra Model (OM)
  - Series: Traditional (T)
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: Gold MOP short dots
  - Fingerboard Radius: 14" - 26" compound
  - Frets: Medium 18% nickel-silver
  - Neck Profile: Traditional (square peghead)
  - Bridge: Ebony belly-style, 2 5/16" string spacing
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cutthrough
  - Tuners: Nickel Waverly
  - Bridge Pins & End Pin: Tortoise-style
  - Body Binding: Tortoise with custom wood purflings
  - Rosette: Custom wood rosette
  - Pickguard: Tortoise
  - Peghead Veneer: Ebony with gold MOP Collings logo
  - Backstrip: 1-style (Walnut)
  - Brace Material: Sitka spruce
  - Brace Pattern: Custom Traditional Series pre-war scalloped X-brace (abbreviated soundboard graft / tongue brace)
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Scale Length: 25 1/2"
  - Nut Width: 1 3/4"
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Strings: D'Addario EJ-16 (.012"-.053")
