description: A 1U rack-mounted 16x2 analog summing mixer with Class-A summing,
  custom Rupert Neve output transformers, and Silk Red & Blue circuitry.
  Designed to bring console-quality tone, depth, and harmonic saturation to
  DAW-based mixing workflows, with expandable Bus Link for up to 64 channels
  across four linked units.
details: |-
  The 5057 Orbit delivers all the tone, power, and depth of a Rupert Neve console in a single rack space. Class-A summing with custom output transformers and Silk Red & Blue circuitry transforms sterile in-the-box mixes into productions with new heights of tone, depth and clarity.

  Sixteen channels arrive over a single DB25 input and are routed through eight pairs of mono switches, allowing flexible mono/stereo channel configuration. A 12-position rotary Trim with ±0.1 dB channel accuracy keeps recall precise.

  The Silk circuit (Off/Red/Blue) and 31-detent Texture control let you dial in harmonic saturation: Red emphasises high/high-mid harmonics, Blue emphasises low/low-mid weight. A -6 dB output mirrors the main bus through an isolated transformer winding so you can drive the mix bus hard without clipping your converters.

  Bus Link lets you cascade up to four 5057 Orbits for 64 channels of analog summing while maintaining the Class-A mix bus headroom of ±21V.
specs: |-
  - Input impedance: 16 kOhm
  - Frequency response: 10 Hz - 50 kHz, ±0.1 dB (-3 dB at 150 kHz)
  - Noise floor: -90 dBu typical (22 Hz - 22 kHz)
  - Maximum input level: +26 dBu @ 1 kHz
  - Maximum output level: +26 dBu @ 1 kHz
  - THD+N: 0.003% @ 0 dBu; 0.0006% @ +20 dBu
  - Crosstalk: -103 dBu @ 1 kHz; -93 dBu @ 10 kHz
  - Mix bus headroom: ±21V Class-A
  - Channel accuracy: ±0.1 dB per channel
  - Format: 1U rack
  - Dimensions: 19" W x 9.25" D x 1.75" H (48.3 x 23.5 x 4.5 cm)
  - Weight: 8.5 lbs (3.9 kg)
