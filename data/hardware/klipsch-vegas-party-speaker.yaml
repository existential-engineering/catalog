description: The Klipsch Vegas is a portable party speaker featuring a
  horn-loaded tweeter with a 5.25" woofer, delivering the brand's signature
  high-efficiency sound. Built for outdoor use with IPX4 splash resistance,
  integrated RGB lighting, and up to 12 hours of battery life.
details: |-
  The Vegas is Klipsch's flagship Music City Party Speaker, combining the brand's heritage horn-loaded tweeter technology with a 5.25" woofer in a portable, pole-mountable cabinet. It is designed for high-output outdoor and party use.

  The speaker features five RGB light show modes controllable via the Klipsch Connect Plus app (iOS and Android), along with an Ultra Bass button and full EQ customization. A built-in microphone and dedicated mic/instrument inputs enable live karaoke and DJ use cases.

  Battery life extends to 12 hours with lighting off or 8 hours with lighting on. The IPX4 water-resistance rating makes it suitable for poolside or tailgate environments. The Party Link feature allows multiple Vegas units to be wirelessly synced together through the app.
