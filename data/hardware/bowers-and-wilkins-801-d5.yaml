description: The 801 D5 is an icon refined, the pinnacle of Bowers & Wilkins
  performance. Engineered for recording studios and discerning listeners alike,
  it uses the most advanced Bowers & Wilkins technologies to deliver
  reference-quality sound.
details: |-
  The 801 D5 is the flagship reference tower loudspeaker of the 800 Series Diamond D5 range, a passive three-way vented-box design driven from an external amplifier. Bowers & Wilkins quotes a recommended amplifier power of 50W to 1000W into 8 ohms and the speaker has no mains connection of its own.

  Bowers & Wilkins positions it for recording studios and domestic listeners alike, noting that the 800 Series has been the loudspeaker of choice in many of the world's revered recording studios for generations. The Diamond dome tweeter pushes break-up frequency to 70kHz, and the Continuum cone is credited with delivering voices and instruments with lifelike detail.

  Every model in the D5 range benefits from an upgraded Matrix design to reduce resonance, plus aluminium Space Frame Bracing and an all-new aluminium top section within the cabinet, which the company says deliver a more spacious and immersive sound.

  The cabinet is formed from a single continuous curve locked in place by a solid aluminium spine to reduce cabinet reflections, complemented by the Solid body Tweeter-on-Top and the Turbine Head midrange enclosure. Drive units are a 25mm Diamond dome high-frequency unit, a 150mm Continuum cone FST midrange and two 250mm Aerofoil bass cones, with an Anti-Resonance plug, Biomimetic Suspension and Flowport.

  The speaker stands 1221mm tall including the tweeter and plinth, is 447mm wide including the plinth and 597mm deep including the plinth, and weighs 106.4kg. Finishes are Stealth Black, Warm White, Light Walnut and Dark Walnut with matching Leather by Connolly trim, and grilles are black on Stealth Black and Dark Walnut and grey on Warm White and Light Walnut.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 250mm (10in) Aerofoil bass
  - Frequency range: -6dB 13Hz to 35kHz
  - Frequency response: 15Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 30Hz to 20kHz, less than 0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Diamond dome tweeter break-up frequency: 70kHz
  - Dimensions: Height 1221mm (48.1in) including tweeter and plinth, Width 372mm (14.6in) cabinet only or 447mm (17.6in) including plinth, Depth 556mm (21.9in) including grille and terminals or 597mm (23.5in) including plinth
  - Net weight: 106.4kg (234.6lbs)
  - Cabinet finishes: Stealth Black, Warm White, Light Walnut, Dark Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
