description: The 801 D5 is an icon refined, the pinnacle of Bowers & Wilkins
  performance. Engineered for recording studios and discerning listeners alike,
  it uses the brand's most advanced technologies to deliver reference-quality
  sound.
details: |-
  From its Diamond dome tweeter and optimised drive units to Space Frame Bracing and an upgraded plinth, its purposeful mix of evolution and innovation is housed in an elegantly crafted and beautifully finished cabinet, shaped by the science of sound. Available in Stealth Black, Warm White, Light Walnut, or Dark Walnut, with matching Leather by Connolly trim, it is an icon of both performance and design. Born of a 60-year Bowers & Wilkins obsession with creating the perfect loudspeaker, 801 D5 delivers the brand's most realistic and accurate listening experience yet.

  Others replay music, Bowers & Wilkins loudspeakers make music. Musicians record with it because they trust it. Engineers mix with it because it tells the truth. Listeners keep it for life because nothing else comes close. For generations, the 800 Series has been the loudspeaker of choice in the world's most revered recording studios, helping create some of the greatest music and scores ever heard.

  Ultimate drive unit technology. Pairing the brand's most advanced and innovative drive unit technology, the 801 D5 delivers its purest sound ever. The Diamond dome tweeter pushes break-up frequency to 70kHz, delivering exceptional clarity, precision and openness, and the Continuum cone delivers voices and instruments with lifelike detail.

  Optimised for pure performance. Every model in the new 800 Series Diamond range benefits from enhanced technology. An upgraded Matrix design reduces resonance and creates a more believable soundstage, while aluminium Space Frame Bracing and an all-new aluminium top section within the cabinet help deliver an even more spacious and immersive sound.

  Crafted to be better by design. The 800 Series Diamond looks this way for a reason. Its shape is dictated by the science of sound. Bowers & Wilkins cabinets are formed from a single continuous curve, locked in place by a solid aluminium spine, so cabinet reflections are reduced. Complemented by the Tweeter-on-Top and Turbine Head, musical performance is always as precise as possible.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 250mm (10in) Aerofoil bass
  - Frequency range: -6dB 13Hz to 35kHz
  - Frequency response: 15Hz to 28kHz (+/-3dB)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), <1% 30Hz to 20kHz, <0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1221mm (48.1 in) including tweeter and plinth, Width 372mm (14.6 in) cabinet only, 447mm (17.6in) including plinth, Depth 556mm (21.9in) including grille and terminals, 597mm (23.5in) including plinth
  - Net weight: 106.4kg (234.6lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut, Light Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
