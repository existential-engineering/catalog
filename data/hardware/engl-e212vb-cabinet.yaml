name: E212VB
manufacturer: engl
primaryCategory: speaker
url: https://www.engl-amps.com/shop/cabinets/engl-e212vb-cabinet/
description: The E212VB is a vertical 2 x 12 inch passive guitar cabinet with an
  angled front and closed back, loaded with Celestion Vintage 30 speakers and
  rated at 120 watts into 16 Ohm.
details: |-
  The E212VB is a vertical 2 x 12 cabinet aimed at smaller setups. Vertical 212 cabinets are widely used, and this one is matched in looks and sound to the compact Ironball, Rockmaster and Metalmaster heads.

  Compact in size but large in sound, the Celestion Vintage 30 speakers give solid bass foundations and silky highs. The housing is solid birch plywood, built to last and fully roadworthy, with an angled front, a closed back and a hand-welded metal grille.

  The cabinet carries a parallel input and thru pair for daisy chaining to a second cabinet. Power handling is 120 watts in mono at 16 Ohm, and the cabinet weighs 35 kg.
specs: |-
  - 2 x 12 inch Celestion Vintage 30 speakers, made in the UK
  - Power handling: 120 W (mono)
  - Impedance: 16 Ohm (mono)
  - Angled front, closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand-welded metal grille
  - Passive cabinet, no mains power connection
  - Dimensions: 60 x 75 x 36 cm
  - Weight: 35 kg
