details: |-
  The all-solid C10 Crossover offers a new spin on a Cordoba classic. Built with a solid European Spruce top and solid Indian Rosewood back and sides, the C10 Crossover's main standout feature is its slim neck. A reduced 48mm nut width, 16" radius fingerboard, and thin-profiled C-shaped Mahogany neck will feel familiar to steel string and electric players.
