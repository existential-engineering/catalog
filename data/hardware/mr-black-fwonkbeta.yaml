url: https://www.mrblackpedals.com/products/fwonkbeta
description: A touch-responsive envelope / low-pass filter with a dedicated
  "Fwonk" control for aggressive, funk-forward filter sweeps and serious low-end
  thump.
details: |-
  The FwonkBeta is a touch-responsive envelope filter (an auto-wah / low-pass filter) voiced for funk. It reacts to your picking dynamics, opening and closing the filter in response to how hard you play, for the classic quacking, vocal filter movement.

  What sets it apart is the dedicated "Fwonk" control, which further intensifies the filter effect. Pushed high, the FwonkBeta is anything but subtle or mellow, delivering pronounced, in-your-face filter sweeps and heavy low-end response that Mr. Black cheerfully describes as capable of knocking things off the walls.

  High input headroom (up to 3V peak-to-peak) keeps the effect clean with hot pickups, bass or keys, and true-bypass switching keeps it out of the signal path when disengaged.

  It runs on standard 9VDC pedalboard power (a regulated supply of at least 100mA is recommended) and draws roughly 59mA.
specs: |-
  - Touch-responsive envelope / low-pass filter
  - Unique "Fwonk" control further intensifies the filter
  - Pronounced low-end response
  - High input headroom (up to 3V peak-to-peak)
  - Input Impedance: ~470KΩ
  - Output Impedance: ~2KΩ
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power (>100mA regulated supply recommended)
  - ~59mA current draw @ 9VDC
