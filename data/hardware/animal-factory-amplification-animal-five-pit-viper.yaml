  clipping diode switches for varied clipping and compression textures.
details: |-
  This product is no longer available from us. You can still order the last few units from our retailers in the EU and Perfect Circuit in the US. The Pit Viper has been superseded by the Ozymandias - 2x the Viper with a LOT of extras. " Of all the drive pedals I have, the Pit Viper is my favourite. It never leaves my board. " - Ed Harcourt

  2019 Version - Demo/Review by Sahil Jagtiani & Tony Das

  Original 2015 version - Official Demo

  Shortly after the Pit Viper first released in 2015, it became St. Vincent 's favourite guitar pedal by helping her find a whole new sound on her universally acclaimed album " Masseduction ". Studio legends Flood and Alan Moulder have one for each mixing desk in the hallowed halls of Assault and Battery studios, London. Songsmith Fink swears by it since recording the masterful " Resurgam " with it. Seeing that we were on to something good, we decided to make it better. Keeping the base circuit and tone identical to the well-loved original, we added two 3-way switches that extend its functionality:

  The MODE switch sets the minimum gain of the pedal, allowing for a greater clean range - should you want it. The MIDS switch switches between the original low-cut response to a full range and deep bass response, making it useful for bass guitars, synths and drum machines with a strong sub. The objective is true tonal flexibility that helps you stand out, loud and proud, on whatever source you run through the pedal. In a drastic shift from our beginnings, we've marked the controls with more functional labels so you don't have to read the manual (but it helps if you do!). Last but not least, the 2019 revision of Pit Viper sports a laser etched black finish for improved readability with a hypnotic new design by Aniruddh Mehta

  Using the HARD and SOFT switches in tandem with the control knobs allows you to dial in varied diode clipping and compression textures. What's more, the Pit Viper stacks superbly with other overdrives and sounds equally good on solid-state or tube amps. We're very proud to present a pedal whose simplicity does not dilute Animal Factory's obsessive design philosophies: idiosyncratic sounds, high addictive potential, stunning looks and not likely to leave your board soon. Hand-built with pride in Bombay, India. Download the manual here .
