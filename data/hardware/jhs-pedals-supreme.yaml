details: |-
  The "Legends Of Fuzz" series is a collection of the world's most historic, rare, and sought after circuits.

  At JHS, fuzz pedals have been in our lineup for over a decade. We have designed original circuits, replicated classics, and we have seen the trend of fuzz popularity come and go. The "Legends Of Fuzz" series is our tribute to the most important fuzz circuits ever made. It is our way of ensuring that the stories of these effects live on in the music that you are going to make.

  In the late 1960's, Japan was bursting at the seams with amazing guitar pedal companies and innovations. One of the most sought after effects from this time and place is the Univox Super-Fuzz. This effect is an octave fuzz that turns any note or chord into a thick and searing texture. Playing a high octave up alongside the distorted note, this is an effect that demands your attention. First produced inside of a large amp head sized multi-effect unit called the Honey* Psychedelic Machine (1967) and then re-released a few months later as a standalone pedal called the Honey* Baby Crying Effect. Honey* soon became Shin-Ei* and by 1968 Shin-Ei* became the guitar pedal powerhouse of Japan.

  The Supreme is an exact replica of my favorite Super-Fuzz in my collection, my extremely rare black and grey model. Imagine an Octavia Fuzz that woke up on the wrong side of the bed, and that's what you're plugging into here: a loud, screaming, full and vibrant octave fuzz that is always at 11.

  The controls are Volume and Expand. Volume makes the effect louder as you turn it and Expand increases the amount of fuzz. On the side you will see two buttons. The "Tone" button engages a mid cut that flattens out the Supreme's attack and makes it more submissive. The "Mode" button activates our very own "JHS Mode" setting. You will hear a much more pronounced octave up effect, thicker mid-range, and more available volume/boost.
