id: MOiVXTv1chB7T-ZQJohdQ
name: Model M4
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/amplifiers/model-m4/300937.html
description: |-
  The Marantz Model M4 is a four-zone, rack-mountable distribution amplifier engineered to deliver Marantz sound across a wide range of streamed music services, locally connected sources, and TV audio. It outputs 8 x 100W (8Ω) or 8 x 125W (4Ω), and can be configured in Bridge Mode to deliver up to 4 x 200W for driving speakers across four rooms in the home.

  Four built-in HEOS modules enable independent or grouped streaming across zones, with support for AirPlay 2, Spotify Connect, Bluetooth, and major streaming services. The M4 supports a wide range of audio formats including DSD up to 5.6MHz and FLAC/ALAC/WAV up to 24-bit/192kHz, with EQ, balance, high/low pass filters, and sound modes including Stereo, Direct, Virtual, Dialog Enhancer, and Night Mode. Its rack-friendly chassis (17.4" × 16.34" × 4.17") makes it suitable for custom-installation and multi-room audio applications.
details: |-
  The Marantz Model M4 is a four-zone, rack-mountable distribution amplifier engineered to deliver Marantz sound across a wide range of streamed music services, locally connected sources, and TV audio. It outputs 8 x 100W (8Ω) or 8 x 125W (4Ω), and can be configured in Bridge Mode to deliver up to 4 x 200W for driving speakers across four rooms in the home.

  Four built-in HEOS modules enable independent or grouped streaming across zones, with support for AirPlay 2, Spotify Connect, Bluetooth, and major streaming services. The M4 supports a wide range of audio formats including DSD up to 5.6MHz and FLAC/ALAC/WAV up to 24-bit/192kHz, with EQ, balance, high/low pass filters, and sound modes including Stereo, Direct, Virtual, Dialog Enhancer, and Night Mode. Its rack-friendly chassis (17.4" × 16.34" × 4.17") makes it suitable for custom-installation and multi-room audio applications.
specs: |-
  - Power output: 8 x 100W (8Ω, 20Hz-20kHz, THD 0.05%)
  - Power output: 8 x 125W (4Ω, 1kHz, THD 0.1%)
  - Bridge Mode output: up to 4 x 200W
  - Channels: 8 (4 zones, stereo per zone)
  - Frequency response: 20Hz-20kHz ±1dB
  - Speaker impedance: 4-16Ω
  - Decoding: Dolby Digital, LPCM, DSD (up to 5.6MHz)
  - File formats: WMA (up to 192kbps), AAC/MP3 (up to 320kbps), WAV, ALAC, FLAC (up to 24-bit/192kHz)
  - Volume limit: 80-100% adjustable
  - EQ: Bass and Treble -5dB to +5dB
  - Balance: -15dB to +15dB
  - High pass filter: 40-250Hz
  - Low pass filter: 40-120Hz
  - Sound modes: Stereo, Direct, Virtual, Dialog Enhancer, Night Mode
  - Streaming: HEOS (4 built-in modules), AirPlay 2, Spotify Connect, Bluetooth
  - Networking: Ethernet (2 ports)
  - Rack-mountable chassis
  - Dimensions: 17.4"W × 16.34"D × 4.17"H (442 × 415 × 106mm)
  - Weight: 18 lbs (8kg)
