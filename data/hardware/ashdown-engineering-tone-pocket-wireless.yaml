description: The Tone Pocket Wireless is a compact bass headphone amplifier that
  enhances music from your smartphone with a rotary 3-band EQ (+/-15dB per
  band), a USB recording output for your DAW, and a balanced line output to an
  amp or PA. It is powered by a rechargeable 9V battery for around 2 hours of
  playtime.
details: |-
  The Tone Pocket Wireless enhances music delivered via a smartphone, offering more power with increased clarity and tone. A rotary 3-band EQ controls bass, mids and highs with +/-15dB on each band. The rear panel carries a USB recording output for use with a DAW, recorded with true digital conversion, and the USB socket doubles as a desktop charger (USB 5.1V-2.1A). A balanced line output on the rear connects to an amplifier or PA. It is powered by a changeable rechargeable 9V battery for approximately 2 hours of playing time and ships with its own mains charging supply. It measures 26mm (H) x 108mm (W) x 95mm (D) in lightweight black anodized alloy.
specs: |-
  - EQ: rotary 3-band (Bass, Mids, Highs), +/-15dB per band
  - USB recording output for DAW (true digital conversion)
  - USB charging: 5.1V-2.1A, socket doubles as desktop charger
  - Balanced line output (rear) to amp or PA
  - Auxiliary input
  - Power: rechargeable 9V battery (changeable), approx. 2 hours playtime, supplied mains charger
  - Dimensions: 26mm (H) x 108mm (W) x 95mm (D)
  - Construction: black anodized alloy
  - Colours: black, white
  - In the box: Tone Pocket Wireless in soft case, USB-to-USB cable, auxiliary cable, 12-18V power supply, 4 rubber feet, user manual
