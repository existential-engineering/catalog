description: >-
  A 61-key performance keyboard version of E-mu's Mo'Phatt sound module, loaded with hip-hop
  and R&B focused sounds including the Pure Phatt soundset, 50 Z-Plane filter types, and 16
  programmable arpeggiators.
details: |-
  Released in 2001, the E-mu MK-6 Mo'Phatt Keys takes the sound engine from E-mu's popular
  Mo'Phatt desktop module and MP-7 Command Station and packages it into a full-sized keyboard
  instrument aimed squarely at hip-hop, R&B, and urban music production. The 61-key keyboard
  with velocity and aftertouch sensitivity provides a more traditional playing interface for
  the same genre-specific sound palette.

  The instrument ships with 32 MB of Pure Phatt Sound Set ROM containing basses, synths, drum
  kits, scratches, vinyl effects, and other sounds tailored to contemporary urban production
  styles. The sound palette is expandable to 128 MB total through optional ROM expansion cards,
  allowing users to add sounds from other E-mu collections. Four 24-bit DACs ensure clean
  audio output.

  Sound sculpting draws on E-mu's celebrated Z-Plane filter technology, offering 50 filter
  types in 6th and 12th-order configurations that enable complex timbral morphing far beyond
  basic subtractive synthesis. Two LFOs per voice and 64-voice polyphony provide ample
  resources for layered, evolving sounds. The 24-bit dual stereo effects processor includes
  29 reverb types, 15 delay types, 8 chorus types, 7 flange types, and 5 distortion types.

  Performance features include 16 real-time controllers, 16 on-board syncable and programmable
  arpeggiators, a Super BEATS interactive Groove Mode, and 16 mute/enable buttons for live
  arrangement manipulation. Memory holds 1,152 presets split between 640 ROM and 512 RAM
  locations.
specs: |-
  - Polyphony: 64 voices
  - Sound ROM: 32 MB Pure Phatt (expandable to 128 MB)
  - DACs: Four 24-bit
  - LFO: 2 per voice
  - Filters: 50 types of 6th- and 12th-order Z-Plane filters
  - Effects: 24-bit dual stereo (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Memory: 1,152 presets (640 ROM, 512 RAM)
  - Arpeggiators: 16 programmable, syncable
  - Keyboard: 61 keys with velocity and aftertouch
  - Control: MIDI
releaseDate: "2001"
