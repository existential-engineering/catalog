url: https://www.tchelicon.com/en/products/0726-abe
description: Single-button vocal stompbox dedicated to pitch correction, with
  chromatic and HardTune modes and a scale-set control for locking to the key of
  the song. Patches between microphone and PA over XLR.
details: |-
  The VoiceTone C1 is a single-effect vocal pedal dedicated to transparent pitch correction. One footswitch engages the effect and one knob sets the correction amount, and the engine uses the chromatic and scale-based tuning technology TC-Helicon builds into its VoiceLive processors.

  Two correction modes are available. Chromatic mode rounds each note to the nearest semitone for natural, transparent correction, while HardTune mode produces the harder, more obviously processed tuned-vocal sound associated with modern pop and hip-hop. A scale-set encoder locks the engine to the key of the song for cleaner correction.

  Connections are an XLR input and an XLR output, with 48V phantom power for condenser microphones and true bypass. The pedal runs from a standard 9V supply and is housed in a metal chassis with a silent footswitch and a status LED readable in low stage light.
specs: |-
  - Single-footswitch operation with status LED
  - Chromatic and HardTune correction modes
  - Scale-set encoder for locking correction to the key of the song
  - Correction amount knob
  - 48V phantom power for condenser microphones
  - True bypass
  - Powered by a standard 9V DC supply
  - Metal chassis with silent footswitch
