  performances. Equipped with a club-quality magnetic crossfader, two USB sound
  cards and the new Oscillator Sampler – making it a serious performer for the
  professional booth.
details: |-
  4-channel professional DJ controller for rekordbox. The top-flight DDJ-RZ is the first professional, native controller for rekordbox , giving you the flexibility to prepare your tracks in rekordbox™ and then get plug-and-play performance directly from your laptop. The controller mirrors the DJ software's layout precisely to enable intuitive performances. Equipped with a club-quality magnetic crossfader, two USB sound cards and the new Oscillator Sampler – making it a serious performer for the professional booth.
