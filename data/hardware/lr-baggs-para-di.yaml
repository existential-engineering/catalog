description: In 1995, the Para DI changed history by becoming the first-ever
  preamp/DI designed specifically for acoustic instruments.
details: |-
  In 1995, the Para DI changed history by becoming the first-ever preamp/DI designed specifically for acoustic instruments. Developed in collaboration with renowned HiFi amplifier designer Greg Schugg, the Para DI co-opted high-end circuitry designs from the hi-fi and pro-audio spaces to create a preamp easy enough for beginners to use, but with the rich audio quality and precise tone-shaping that pros return to tour after tour. Its uniquely intuitive feature set and roadworthy form factor have inspired countless other Baggs products, but the original remains an icon and industry standard around the world.
specs: |-
  - Adjustable gain accommodates both passive and active pickups
  - 5-band EQ with tunable notch and midrange bands
  - Phase inversion switch for feedback control
  - Effects loop capability
  - 9V battery operation
  - 48V phantom power compatible
