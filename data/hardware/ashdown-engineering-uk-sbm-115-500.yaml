description: UK-built, Ice Blue 500-watt 1x15" combo designed for full, warm
  low-end with modern clarity. Delivering 250 watts into its internal speaker
  and expanding to 500 watts when paired with an 8-ohm external cabinet, it
  features a premium Sica NEO 15" speaker with an Eminence tweeter, Tweeter and
  Speaker Mute switches, onboard Overdrive, FX Loop, Balanced DI, and Headphone
  Out. Finished in durable Charcoal Tweed with a Silver Weave grill, it is a
  powerful, versatile combo built for stage, studio, and home practice.
details: |-
  The Ashdown UK-SBM-115-500 delivers 250 watts into its internal speaker, expanding to a full 500 watts when paired with an 8-ohm external cabinet. This flexible power design ensures it performs from home use to demanding live environments, all within a premium UK-built combo. At its core is a premium Sica NEO 15" speaker complemented by an Eminence tweeter for enhanced high-frequency detail. It is equipped with a responsive tube-emulated Overdrive circuit, an FX Loop for pedal integration, and a Balanced DI Output for live or studio use. Integrated Tweeter and Speaker Mute switches give additional control over output, and the Headphone Out makes quiet practice simple. A Passive/Active switch with a -15dB pad matches active instruments, and a footswitch jack controls Drive in and out.
specs: |-
  - Power output: 250 watts into internal speaker
  - Power output: 500 watts with an 8 ohm external cabinet
  - Speaker: 1 x Sica NEO 15" with Eminence tweeter
  - Input impedance: 1 Meg ohm
  - Input signal range: 100 mV to 10 V
  - Passive/Active switch with -15 dB input pad
  - Pre-shape EQ switch
  - Pre-Gain control
  - Tube-emulated Drive control
  - EQ: Bass +/-15dB, Lo-Mid +/-15dB, Middle, Hi-Mid +/-15dB, Treble +/-15dB
  - Master Volume control
  - Weight: 16.50 kg
