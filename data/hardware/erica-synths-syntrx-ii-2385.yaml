description: Analog synthesizer with a user interface inspired by Synthi.
details: |-
  Based on lessons learned from the SYNTRX, Erica Synths set out to create an instrument that would integrate even deeper into contemporary electronic and experimental music setups and cover sonic territory from daunting drones to powerful basslines and glitched noisescapes. The SYNTRX II is a new dark horse for experimental sonic rides.

  The SYNTRX II is the culmination of Erica Synths' analogue sound design circuits: two perfectly stable main oscillators with waveshapers, a modulation oscillator with 1V/oct tracking, a versatile multimode filter, supercharged external instrument inputs with an envelope follower, a unique, great-sounding ring modulator, a recordable joystick, a built-in piano roll sequencer and stepped modulation sources, all arranged around the signature matrix mixer and topped off with powerful FX on a new DSP platform.

  Highpass and lowpass filters sit in series, a free running or gate synced sample and hold circuit and a multi-color noise generator feed the matrix, a looping trapezoid envelope generator drives a VCA, and two output VCAs follow. The instrument inputs are DC coupled with signal inversion and an envelope follower, and the ring modulator is of unique design.

  The FX section carries delay and reverb developed in collaboration with 112db. The analogue patch matrix offers three attenuation levels at each patch point and holds 254 patch memories, and a piano roll sequencer plus two stepper modulation sources run alongside the recordable joystick.

  Connections are a DIN5 MIDI input and MIDI Thru, two assignable outputs, a headphone output and a dedicated audio/CV output from the signal meter. The instrument measures 309mm x 457mm x 115mm with the joystick in centre position and weighs 3.9 kg.
specs: |-
  - Two perfectly stable main oscillators with CV-controlled waveforms
  - Modulation oscillator with variable waveforms, 1V/oct tracking
  - Highpass and Lowpass filters in series
  - Free running or gate synced sample and hold circuit
  - Multi-color noise generator
  - DC coupled instrument inputs with signal inversion and envelope follower
  - Ring modulator of unique design
  - Looping trapezoid envelope generator and VCA
  - Two output VCAs
  - Signal meter with a dedicated audio/CV output
  - FX section with Delay and Reverb developed in collaboration with 112db
  - Recordable Joystick
  - Analogue patch matrix with 3 attenuation levels in each patch point
  - 254 patch memory
  - Piano roll sequencer and two stepper modulation sources
  - Dimensions: 309mm x 457mm x 115mm (with the joystick in centre position)
  - Weight: 3.9 kg
