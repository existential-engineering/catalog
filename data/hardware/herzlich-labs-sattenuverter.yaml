description: A 2hp stereo attenuverter module with two channels of linked
  attenuversion, allowing smooth inversion of signals via a sliding
  potentiometer.
details: |-
  Beauty. Refinement. Attenuversion. It's another Herzlich Labs release: the 2hp stereo Attenuverter. Two channels of connected attenuversion, allowing you to fully and smoothly invert any signals you plug in - turn negative to positive, turn phase to antiphase, and find all the variations in between. With the usual pleasantly tactile sliding pot, the sAttenuverter is both performance friendly and inspiring to use. Extremely suitable for linked mono signals and stereo alike, it will feel right at home in the increasingly popular stereo setups in modular.
