details: |-
  Handwired Tube meets Class D Power

  ABOUT

  New for 2017, its the 700W Bass Half and Half! The 700W Half and Half is where the old technology meets the new technology. The preamp is similar to the other all tube Milkman amplifiers: it is hand wired with high plate voltage. The discrete tube preamp section feeds into a Class D power module which scales up to 700 watts. Its the most transparent and exciting sounding hybrid amplifier on the market. Unlike other hybrid amplifiers, the tube portion of the Half and Half is designed and built like a vintage tube amplfier. Its not shoehorned into a circuitboard and running at low voltage. Tube amps need to be built a certain way to sound their best, be serviceable, and last into the ages. The Half and Half was designed with all of this in mind. A DI with XLR output with level control has been added to the rear panel. This allows you to use the amplifier as a standalone tube preamp with EQ. It is safe to run the Half and Half with no speaker attached, or you can use the DI with a speaker attached for a balanced XLR line out. Like all Milkman amplifiers, the Half and Half is built using the finest possible components. This model is available with 2 finish options: Vanilla, and Classic Black

  WATTAGE

  700W Class D

  EFFECTS

  Tube EQ

  DIMENSIONS & WEIGHT

  16-1/2" W x 8" H x 7-1/2" D 12lbs

  Demo

  700W with Creston Bass

  Creston bass with Lollar single coils into the 700W Half and Half

