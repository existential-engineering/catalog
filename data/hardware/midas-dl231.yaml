description: DL231 24-Input / 24-Output Active Microphone Splitter. With two
  independent Midas mic preamps per input, the highest quality of sonic
  performance is guaranteed. Dual-redundant network ports and power supplies
  provide peace of mind. The DL231 features MIDI (In, Out and Thru), an Ethernet
  Control port, and four AES50 ports for dual-redundant digital audio
  interfaces. Switchable between 24-bit 96 kHz and 48 kHz operation, with a Mute
  All Outputs button for convenient onstage re-patching. Housed in a road-ready,
  rugged rack-mountable chassis, designed to work with all Midas digital
  consoles.
details: |-
  DL231 — 24-Input / 24-Output Active Microphone Splitter.

  With today's tech-savvy concertgoers demanding more and more from the professional sound engineer, the need to increase flexibility and functionality has never been greater. That's why the Midas Research and Development team have expanded upon the existing Microphone Splitter format to bring you the DL231.

  Midas - The Legend in Sound Quality
  With two independent Midas mic preamps per input, the highest quality of sonic performance is guaranteed. And with dual-redundant network ports and power supplies, peace of mind comes as standard.

  Analogue Meets Digital - The Best of Both Worlds
  The DL231 combines the warmth and authenticity of analogue circuitry with the precision and agility of state-of-the-art digital techniques. Extreme care has been taken in the planning and execution of the PCB layout to maintain exceptional grounding and analogue/digital separation.

  Versatility Without Compromise
  As with all Midas products versatility without compromise is a priority, that's why the DL231 comes fitted with MIDI (In, Out and Thru) and an Ethernet Control port, plus four AES50 ports to handle the independent dual-redundant digital audio interfaces. The DL231 is capable of being switched between 24-bit 96 kHz and 48 kHz operation. A Mute All Outputs button is provided for convenient onstage re-patching - and the DL231 is powered by dual-redundant PSUs for superb reliability. Housed in a road-ready, rugged rack-mountable chassis, the DL231 is ideally suited for transport and storage in standard flight cases (not included).

  Integration Within the Midas Product Range
  Styled to match our existing console aesthetic, and designed to work with all Midas digital consoles, high performance I/O has never been easier to use - or more cost effective.
specs: |-
  - Form Factor: Rack-mountable chassis
  - Configuration: 24-Input / 24-Output Active Microphone Splitter
  - Microphone Preamplifiers: Two independent Midas mic preamps per input
  - Sample Rates: 24-bit 96 kHz or 48 kHz, switchable
  - AES50 Ports: 4 (dual-redundant digital audio interfaces)
  - MIDI: In, Out and Thru
  - Control Port: Ethernet
  - Power Supplies: Dual-redundant PSUs
  - Front Panel Controls: Mute All Outputs button for onstage re-patching
