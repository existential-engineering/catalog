details: |-
  (MPM12, MPM20) MPM high-performance, multi-purpose mixers The MPM Series is a range of multipurpose mixers that carry all the hallmarks of Soundcraft’s professional heritage. Intended for a wide range of applications that includes fixed installation, Houses of Worship, Portable PA use and music production, the MPM Series features a number of facilities in a compact package. With a focus on high performance the Soundcraft MPM mixers are available in 2 standard models with 12 or 20 mono inputs, each model featuring two stereo inputs, two groups and three auxes. The MPM Series offers many professional features for use in a variety of applications: • 12 and 20 mono input channel versions • Quality build and audio performance • 2 Stereo Inputs • 2 Group busses • Stereo Mix Output • 2-track record output • 2-track replay input with level control • 3 configurable Aux busses • Globally switched +48V Phantom Power • GB30 Mic Preamps • Peak LED • 100Hz HPF • Insert point (mono channels) • 3-band EQ with swept Mid band on mono inputs • 3-band EQ on stereo inputs • PFL switch • Mix and group routing • Signal Present LED • 60mm fader • Headphone and Control Room outputs with level control • Rack-mountable (ears sold separately) • Integral universal power supply For product availability and pricing please contact your local dealer.
