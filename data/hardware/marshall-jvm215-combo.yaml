description: Versatile 50W all-valve 1x12" combo built in the UK. The JVM215C is
  a two-channel (Clean/Crunch and OD1/OD2) JVM series combo with dedicated
  reverb per channel, presence and resonance controls, dual switchable master
  volumes, a series effects loop and an additional series/parallel loop, MIDI
  in/thru for channel and mode recall, and a 50W power section driving a
  Celestion G12 B150 speaker. Hand-built in Marshall's UK factory.
details: |-
  With three gain modes on each of the two channels, the JVM215 Combo is just as comfortable playing clean tones as it is heavy distortion.

  Featuring one Celestion G12 B150 speaker and two master volumes, get an instant volume boost when it is time for your big moment. It has a master volume for each channel which means you can create explosive solo moments.

  The JVM215 Combo has recording capabilities as well as a standby mode for silent recording. All you have to do to capture the perfect take is connect your amplifier's line out to a recording device and keep the standby switch turned off.

  With the programmable footswitch, which is included, you can recall your mode, master and reverb settings. This gives you power and flexibility when and where you need it.

  We pride ourselves on honouring our roots. That is why we still make our JVM215 Combo amps in our UK factory, from the loading of the circuit boards to the signature black, white and gold finishes. Designed and engineered in UK. Made in UK.
specs: |-
  - Built in our UK factory
  - All-valve
  - 12" Celestion G12 B150 speaker
  - Two channels with dedicated volume controls
  - Silent recording mode
  - Store your settings
  - Model: JVM215C
  - Range: JVM
  - Channels: 2 (Multi)
  - Technology: Valve
  - Output wattage: 50W
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Speaker configuration: 1x12"
  - Speaker model: Celestion G12 B150 (8Ω, 150w)
  - Unit impedance: 8Ω
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitters)
  - Power amp valves: 2 x EL34
  - Weight: 26.5 kg / 58 lb
  - Width: 605 mm / 23.8"
  - Height: 510 mm / 20.1"
  - Depth: 265 mm / 10.4"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-91006 footswitch included, detachable power cable included
