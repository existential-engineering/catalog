description: Versatile 50W all-valve 1x12" combo built in the UK. The JVM215C is
  a two-channel (Clean/Crunch and OD1/OD2) JVM series combo with dedicated
  reverb per channel, presence and resonance controls, dual switchable master
  volumes, a series effects loop and an additional series/parallel loop, MIDI
  in/thru for channel and mode recall, and a 50W power section driving a
  Celestion G12 B150 speaker. Hand-built in Marshall's UK factory.
details: |-
  - Two channels (Clean/Crunch and OD1/OD2) with four modes total
  - Dedicated volume and reverb per channel
  - Dual switchable master volumes for instant solo boost
  - Digital reverb
  - Series effects loop plus additional series/parallel effects loop
  - MIDI In / MIDI Thru for channel and mode recall
  - Emulated XLR line out for silent recording
  - Standby mode for silent recording
  - PEDL-91006 programmable footswitch included
  - Hand-built in the UK factory
specs: |-
  - Model: JVM215C
  - Range: JVM
  - Output Wattage: 50W
  - Channels: 2 (Multi)
  - Technology: Valve
  - Preamp Valves: 4 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Speaker Configuration: 1x12"
  - Speaker Model: Celestion G12 B150 (8Ω, 150W)
  - Unit Impedance: 8Ω
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects Loop: 2: 1 x series, 1 x series/parallel
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω / 8Ω / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Product Height: 510 mm / 20.1"
  - Product Width: 605 mm / 23.8"
  - Product Depth: 265 mm / 10.4"
  - Weight: 26.5 kg / 58 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
