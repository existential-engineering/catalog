details: |-
  The coolest short scale bass on the block is now available from G&L.

  The Tribute Series Fallout Bass is available in four exciting colors with complimenting pickguards. This 30" short scale powerhouse features a G&L Magnetic Field Design humbucking pickup controlled by a 3-position mini-toggle switch for parallel/split/OMG modes, just like an L•1000, bringing anything from modern to old school tones to a player's fingertips. What's more, players used to a traditional 34" scale will find this pint size puncher super easy to play.

  Other features include a Poplar body, Maple bolt-on neck, Rosewood and Maple fingerboards, Saddle-Lock Bridge, G&L tuners, and D'Addario Nickel Roundwound short scale strings, .045-.065-.080-.100.
specs: |-
  - Pickups: G&L Magnetic Field Design humbucking pickup
  - Body wood: Poplar
  - Neck wood: Hard Rock Maple with Maple or Rosewood fingerboards
  - Neck profile: CLF/G&L 1 5/8" slim C with 9 1/2" radius 30" Scale length
  - Tuning keys: G&L tuners with tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock bridge
  - Electronics: 3-position mini toggle for parallel/split/OMG pickup modes, volume, tone
  - Available in: Candy Apple Red over Poplar, pearloid pickguard, Maple fingerboard
