description: The Empress Buffer is a compact, all-analog buffer designed to be
  the complete I/O interface for your pedalboard while preserving the highest
  fidelity of your guitar's signal. Its primary job is to eliminate the signal
  loss caused by long, un-buffered cable runs so your tone stays unchanged.
details: |-
  The Empress Buffer was designed to be the complete I/O interface for the pedalboard, while maintaining the highest fidelity to your guitar's signal. Signal loss due to long, un-buffered cable runs is an issue that has plagued guitar players for decades. The primary goal of the buffer is to eliminate this signal loss, ensuring that your tone is unchanged by your cables.

  Additionally, all the connectivity of your pedalboard is consolidated in one place to make setup and teardown quick and easy. A separate tuner output keeps your tuner out of the audio path, and the flat top lets you velcro your tuner directly to the pedal without using any pedalboard real estate.

  The signal path is entirely analog, and the small die-cast aluminum enclosure packs the complete I/O of a pedalboard into roughly 4.5" by 2.5" by 1.5".
specs: |-
  - All-analog signal path
  - Separate tuner output keeps the tuner out of the audio path
  - Flat top for velcroing a tuner on top of the pedal
  - Consolidated pedalboard I/O for quick setup and teardown
  - Input impedance 1M Ohm, output impedance 510 Ohm
  - Frequency response (-3dB) 5Hz - 40kHz
  - Total harmonic distortion 0.02%
  - Signal to noise ratio 105.3dB
  - Headroom +9.4dBu
  - Power 9V DC (negative tip), 2.1mm barrel connector, 80mA draw
  - Die-cast aluminum enclosure
  - Dimensions 4.5" (L) x 2.5" (W) x 1.25" (H), weight 0.5 lbs
