details: |-
  Weave together any pair of Ventris's expertly crafted reverb effects into a single unified soundscape. It's like having two high-performance reverb pedals in one compact unit.

  This compact dual reverb pedal offers two independent signal processors. Users can run two reverbs simultaneously in parallel, series, or left/right signal paths. The pedal features 16 reverb engine types (Room, Hall, E-Dome, True Spring, Plate, Lo-Fi, Modverb, Shimmer, Echoverb, Swell, Offspring, Reverse, Outboard Spring, Metal Box and more).

  Analog Dry Through keeps the dry signal analog so it does not pass through the processor. True Spillover and Trails let you change presets without abruptly cutting the reverb tail. Selectable footswitch assignments cover preset scrolling, A to B toggling, and tap tempo, and there is a Runaway Reverb mode.

  It stores 128 presets (8 accessible via pedal controls, 128 via MIDI), offers stereo I/O, Universal Bypass (true bypass or transparent buffer), and MIDI support over both 5-pin DIN and USB.
specs: |-
  - 16 reverb engine types
  - Two independent reverb processors (parallel, series, or left/right routing)
  - 128 presets (8 via pedal controls, 128 via MIDI)
  - Analog Dry Through (dry signal stays analog)
  - True Spillover and Trails
  - Selectable footswitch assignments (preset scrolling, A/B toggle, tap tempo)
  - Runaway Reverb mode
  - Universal Bypass (true bypass or transparent buffer)
  - Stereo I/O
  - MIDI support (5-pin DIN and USB)
  - Dimensions: 4.6 in. x 4.4 in. x 2.2 in.
  - Weight: 1 lb
  - Power consumption: 280 mA
  - Housing: brushed anodized aluminum
