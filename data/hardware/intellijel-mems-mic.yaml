name: MEMS Mic
manufacturer: intellijel
primaryCategory: modular
categories:
  - utility
  - analog
url: https://intellijel.com/shop/eurorack/mems-mic/
prices:
  - amount: 99
    currency: USD
description: A big-sounding microphone module in a small 2hp package. Turn your
  voice, instruments, environmental sounds, or even wild feedback experiments
  into audio for your Eurorack system.
details: |-
  MEMS Microphones are constructed with a Micro-Electro-Mechanical System (aka MEMS) component, placed on a printed circuit board and protected by a mechanical cover. They are extremely small, and can be found in many modern electronic devices e.g. phones, tablets, cameras etc. Despite their compact size, they have a very flat response across a large frequency range (~6hz to 20kHz) which makes them excellent for musical applications.
specs: |-
  - MEMS omni microphone with flat frequency response
  - Output level can be controlled via slider and/or CV input
  - When modulating with CV, the slider becomes an attenuator
  - Patch and modulate two independently for stereo effects
  - Activity (green) and overload (red) indicator LEDs
  - Fixed low-frequency roll-off switch (180Hz, 6dB/oct)
  - Width: 2HP
  - Depth: 35mm
  - Power: 19mA @ +12V, 19mA @ -12V
  - Capsule: MEMS
  - Pattern: Omni
  - Range: 6Hz ~ 20kHz
  - SNR: 63dBA
  - Sensitivity: -45dB ±2dB @ 94dB SPL, 130dB SPL Acoustic Overload Point
io:
