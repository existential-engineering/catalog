name: PC200USB-HR
manufacturer: fostex
primaryCategory: amplifier
url: https://www.fostex.jp/en/products/pc200usb-hr/
description: Personal amplifier with a built-in high-resolution USB DAC. A compact high-resolution system can be built simply by connecting it to passive speakers such as the P802-S.
details: |-
  A personal amplifier with a built-in USB-input DAC that supports high-resolution audio. This allows a compact high-resolution PC audio system to be built simply by connecting it to the P802-S speaker system (sold separately), which also supports high-resolution audio.

  The compact body integrates four functions: USB DAC, speaker output, headphone output and volume control. When both passive speakers and headphones are connected, audio is output from the headphones only.

  The PC200USB-HR is equipped with a 15 W + 15 W digital amplifier, making it compatible with a wide variety of passive speakers. The PC100USB, a volume controller with built-in DAC, is here given a power amplifier to support connection to small passive speakers that have no built-in amplifier.

  This is a simple high-resolution device that operates with the Windows and Mac OS standard USB audio drivers. It cannot be used with playback software that uses a dedicated driver other than the OS standard USB Audio driver.

  The volume control has a large silver knob machined from stainless steel, moderately heavy and comfortable to operate, and the body is made of black metal for robustness. A USB cable (1 m) and a speaker cable (1.5 m) are included. Operation may become unstable on some Macs with the M1 chip; connecting through a USB hub resolves the symptom. Do not connect anything other than passive speakers of appropriate impedance to the speaker output terminals: the black (-) side is not a common left/right circuit and does not share the chassis ground.
specs: |-
  - USB terminal: USB connector B
  - Sampling frequency / quantization: 32, 44.1, 48, 88.2, 96 kHz / 16, 24 bit
  - Supported OS: Windows 7 or higher, Mac OS X V10.6 to macOS 10.12 Sierra
  - Speaker output (L, R) terminals: compatible speaker impedance 4 to 8 ohm
  - Maximum output: 15 W + 15 W
  - Total harmonic distortion: 0.3% (output 10 W, load 4 ohm, 1 kHz)
  - Frequency response: 20 Hz to 40 kHz +/-3 dB (at 8 ohm)
  - PHONES jack: 3.5 mm stereo mini jack, maximum output 15 mW + 15 mW (32 ohm load), applicable load impedance 32 ohm or more, THD 0.1%
  - External dimensions: 95 (W) x 52 (H) x 86 (D) mm
  - Weight: approx. 363 g (main unit only)
  - Power supply: DC 15 V (dedicated AC adapter)
  - Power consumption: 10 W
  - Accessories: USB cable (1 m) x 1, speaker cable (1.5 m) x 1 set, AC adapter
  - Complies with the European RoHS Directive
