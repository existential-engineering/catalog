name: Sub8
manufacturer: adam-audio
primaryCategory: subwoofer
url: https://www.adam-audio.com/en/subwoofers/sub8/
description: The Sub8 is designed for smaller rooms up to 20 square meters. It
  is an ideal match for the ADAM Audio AX Series and the S2V nearfield monitors.
details: |-
  The Sub8 is a small yet powerful subwoofer designed to extend the low frequency capabilities of any nearfield monitoring system down to 30 Hz. It houses a robust 8.5" woofer with a 1.5" voice coil driven by a 160 W ICE power amplifier. This amp combines low heat generation with high performance to handle maximum power levels, even during long mix sessions.

  The front baffle features two motorized knobs that let you tailor input level and crossover frequency settings. These settings can also be controlled via the included wireless remote, allowing you to optimize sound reproduction from the ideal listening position without leaving the mix seat.

  Acoustically the Sub8 covers 28 Hz – 150 Hz with a continuously adjustable crossover between 50 Hz and 150 Hz and an 80 Hz EQ that swings from -60 dB to +6 dB. THD above 60 Hz stays at or below 1% and the system can hit a maximum peak SPL of at least 110 dB at 1 m.

  Rear-panel I/O is straightforward: balanced XLR and unbalanced RCA analog inputs share a 10 kOhm input impedance and feed a PWM amplifier rated at 160 W RMS (240 W music power). The cabinet measures 16" (410 mm) H × 10" (260 mm) W × 15" (380 mm) D and weighs 26.5 lb (12 kg).

  The Sub8 is intended for smaller rooms up to 20 square meters and pairs naturally with the ADAM Audio A Series and S2V nearfield monitors. It ships with a wireless remote control, 2× AAA batteries, power cord and manual, and is covered by a 5-year warranty (2 years standard plus 3 years optional with registration).
