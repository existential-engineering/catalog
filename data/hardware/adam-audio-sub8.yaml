description: The Sub8 is designed for smaller rooms up to 20 square meters. It is an ideal match for the ADAM Audio AX Series and the S2V nearfield monitors.
details: |-
  The Sub8 is a small yet powerful subwoofer designed to extend the low frequency capabilities of any nearfield monitoring system down to 30Hz.

  It houses a robust 8.5″ woofer with a 1.5″ voice coil driven by a 160W ICE power amplifier. This amp combines low heat generation with high performance to handle maximum power levels, even during long mix sessions.

  The front baffle features two motorized knobs that let you tailor input level and crossover frequency settings. These settings can also be controlled via the included wireless remote, allowing you to optimize your sound reproduction from your ideal listening position.

  On the rear panel the Sub8 adds a satellite filter (full range or 85 Hz high pass as recommended by Dolby laboratories for surround set-ups), a phase switch for 0° or 180° relative to the satellites, and a mode switch offering Signal On standby or continuous operation.

  The Sub8 is designed for smaller rooms up to 20 square meters. It is an ideal match for the ADAM Audio A Series, for example.
specs: |-
  - 8.5″ subwoofer driver, coated paper cone
  - Basket diameter: 8″
  - Voice coil diameter: 1.5″ (38 mm)
  - Amplifier type: PWM
  - Amp. power RMS / Music: 160 W / 240 W
  - Built-in amplifiers: 1
  - Frequency response: 28 Hz – 150 Hz
  - THD > 60 Hz: ≤1 %
  - Max. peak SPL at 1 m: ≥110 dB
  - Crossover frequencies: 50 – 150 Hz
  - EQ 80 Hz: -60 to +6 dB
  - Analog audio input connectors: XLR / RCA
  - Input impedance: 10 kOhm
  - Panel: Front
  - Height x Width x Depth: 16″ (410 mm) x 10″ (260 mm) x 15″ (380 mm)
  - Weight: 26.5 lb (12 kg)
  - Operating temperature: 0° C to 40° C (32° F to 104° F)
  - Storage temperature: -30° C to 70° C (-22° F to 167° F)
  - Humidity: max. 90 % not condensing
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: Remote control, batteries (2 x AAA), power cord, manual
