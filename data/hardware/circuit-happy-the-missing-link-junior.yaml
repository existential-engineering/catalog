description: The Missing Link, Junior is a desktop CV and MIDI clock generator
  that syncs hardware to Ableton Live or any DAW supporting Ableton Link. It
  enables jamming with iOS music apps, DJ/VJ software, and other Link-enabled
  hardware.
details: |-
  The Missing Link, Junior is a simple and effortless way to keep your hardware in sync with Ableton Live or any other DAW that supports Ableton Link. Adding Ableton Link to your studio sync also opens up new possibilities to jam with iOS music apps, DJ and VJ software, and any other hardware that supports Link (such as the Circuit Happy ML:2m).
