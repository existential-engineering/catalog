name: DJ 2 Go
manufacturer: numark
primaryCategory: midi-controller
url: https://www.numark.com/product/dj2go
description: Ultra-portable USB DJ controller with crossfader, jog wheels for
  each deck, pitch faders, and music library navigation, designed for
  laptop-based mixing with any MIDI-capable DJ application.
details: |-
  DJ 2 Go is marketed as the most portable DJ controller in the world, designed for laptop-based DJing with compatible DJ software. All essential controls are on the unit, including a crossfader, jog wheels for each deck, pitch faders, and music library navigation controls.

  The controller is positioned for minimalist setups, small gigs, and as a backup for a primary DJ rig. It slips easily into a laptop bag or backpack and includes everything needed to mix.

  Setup is a single USB cable that provides both power and control. Tracks load to either Deck A or Deck B in a compatible DJ application, and the familiar A/B deck layout with crossfader makes the controller approachable for new users. The device is class compliant, working with current and future versions of macOS, iOS, and Windows (98SE and up), with no driver installation required.
specs: |-
  - Ultra-portable USB DJ software control for instant gigs
  - Compatible with virtually any MIDI-capable DJ application
  - Mouseless navigation built in
  - Single USB cable provides easy integration with PC or Mac
  - Familiar A/B deck and crossfader layout
  - Includes integrated Virtual DJ LE Lite software
  - Also works with Virtual DJ Pro, Traktor, djay and PCDJ (each sold separately)
  - Class compliant: immediately compatible with every current and future version of Mac OS X and iOS and with Windows (98SE and up)
