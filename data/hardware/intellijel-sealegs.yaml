description: It's all gone a bit wobbly Sealegs is a collection of effects
  centered around a true stereo multi-model delay. Tape, Bucket Brigade, and
  Crossfading Digital models; a saturating input drive; low- and high-pass
  filters; crackle & hiss generator; a multi-position 1970s-inspired reverb;
  internal modulators; nine CV inputs with attenuverters; three sets of ranges;
  clock sync/tap tempo; three unique stereo configurations. Calm waters, rolling
  waves, or wild storms — the weather is up to you.
details: |-
  Our design goal for Sealegs was to create the warmest, most musical and organic delay module possible — something that would sweeten and enhance any audio one chose to feed into it. As such, great care has gone into modeling the most distinctive and desirable sonic characteristics of three different types of delay circuits: Tape, Bucket Brigade, and Crossfading Digital.

  A plethora of onboard controls enable you to dial in exactly the sound you want; synced or un-synced delays times (for both left and right channels); saturating input drive; a built-in modulator with 7 morphing waveshapes, Wow & Flutter emulation, and an envelope follower; plus dedicated low- and high-pass filters; built-in hiss & crackle noises; per-model color controls; a spacious reverb; and a re-configurable signal flow through the unit. In addition, attenuverted modulation inputs abound — ensuring the delay ebbs and flows with your musical needs.
specs: |-
  - Width: 20HP
  - Depth: 29mm
  - Power: 116mA @ +12V, 10mA @ -12V
  - Firmware: v1.3.1.0 (Web Updater)
  - Three delay models: Tape, Bucket Brigade, Crossfading Digital
  - True stereo delay with separate L/R buffers; three stereo configurations (PONG, Time/Width, L/R)
  - Three range variations; up to 6(L)/8(R) seconds of delay time (Width can add up to 33% to Time)
  - Built-in modulator with Wow & Flutter, Envelope Follower, and 7 morphing waveshapes
  - 1970s-inspired reverb with 3 insert positions
  - Highpass and lowpass filters, Freeze functionality, nine CV inputs with attenuverters
  - 96 kHz 24-bit stereo I/O, 32-bit floating point internal processing
