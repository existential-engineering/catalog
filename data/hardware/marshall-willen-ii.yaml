description: Portable speaker with 17+ hours of playtime.
details: |-
  Willen II's lightweight design and mighty sound mean you can make any setting come alive. It's dust and waterproof, making it ready for life on the road. Just press play and wait for those heavy basslines to make the world around you rumble. Designed and engineered in Sweden. Made in China.

  Marshall signature sound: take any setting from quiet to loud. Willen II's slightly larger frame maximises bass, and its improved drivers give every frequency its time to shine, so you hear a balanced sound at any volume.

  17+ hours of portable playtime: packed with hours of portable playtime on a single charge, Willen II transforms your world into a musical playground. This speaker will keep the music going from early morning to late at night, and a 20 minute charge gives 5.5 hours of playtime.

  Dust and waterproof, with a fastening strap: an IP67 dust and waterproof rating means you can submerge it in 1 m (3 ft) of water for up to 30 minutes, so rain or dirt will not get in the way of your music. Stand it up, lay it down, fix it to an object or let it hang thanks to its rubber fastening strap.

  Built-in microphone and Bluetooth LE Audio-ready: Willen II comes with a built-in microphone so you can take calls completely hands-free, and it is built to be Bluetooth LE Audio-ready, opening up audio sharing with Auracast. Marshall also offers authorised repair services and spare parts for Willen II through its website.
