description: Affordable, compact and amazing sounding practice amps for the beginner.
details: |-
  Debut 100R takes the Debut range to the next level from the benchmark set by the award-winning Debut 50R - Debut now has more headroom than ever, and is loud enough to fill any venue.

  The Debut 100R is a simple and elegant, no fuss analogue alternative to entry level digital modelling amplifiers. Ideal for pedal players, the Debut 100R focuses more on tone and usability rather than unwanted 'bells and whistles'. This versatile amp is perfect for guitar players of all levels, whether jamming in a bedroom, practicing in a small room, or performing on stage. Featuring authentic valve-like tones all engineered using MOSFET technology, the Debut 100R will make you sound like a pro from the get-go.

  The Debut 100R retains the Debut 50R's much lauded MOSFET preamp design. This design creates an authentic, accurate valve-like tone within a light, analogue format, and has been based on Blackstar's award-winning higher-end valve amplifiers.

  Retaining the feature set of the Debut 50R, the Debut 100R's features have been carefully selected to cover all an aspiring guitarist's practise and gigging needs: 2 footswitchable channels, the patented ISF (Infinite Shape Feature) tone control, power reduction down to 5 Watts, series effects loop and custom-voiced digital reverb with Plate and Hall options.

  The Debut 100R comes in 1x12 and 2x12 combo variants.
specs: |-
  - Power: 100W
  - Speaker: 1 x 12" (1x12 variant) or 2 x 12" (2x12 variant)
  - Channels: Clean and Overdrive
  - Controls: Clean Volume, Clean Bright switch, Overdrive switch, Overdrive gain, Overdrive volume, Bass, Middle, Treble, ISF, Reverb switch, Reverb level, Power reduction
  - Effects: Reverb (Plate/Hall)
  - Speaker Emulated output
  - Line In
  - Power Reduction
  - Series Effects Loop
  - Footswitch Compatible (2-way)
  - Clean Bright Switch
  - MOSFET preamp
  - Patented ISF (Infinite Shape Feature) tone control
  - Weight: 12.54 kg (1x12) / 15.70 kg (2x12)
  - Dimensions: 525 x 477 x 245 mm (1x12) / 681 x 493 x 260 mm (2x12)
