url: http://cranesong.com/INSIGNA.html
description: Insigna is a coloring/shaping tube equalizer in a 500 series
  package, with 3 EQ bands plus high and low cut filters, built around a dual
  triode 12AX7 tube circuit for a fat, second-harmonic-rich tone.
details: |-
  Insigna is a tube equalizer in a 500 series package, using a dual triode circuit with a 12AX7 tube.

  The eq has 24 dB/oct high pass and low pass filters each with 7 frequencies. The top and bottom band are shelving each with 8 frequencies. The mid band is peaking with 8 frequencies.

  The three bands work by using buffered RC circuits in the negative feedback path around the tube amplifiers. The result is a fat sounding eq rich in second harmonic triode tube color.
specs: |-
  - 3-band EQ: HF and LF shelving bands (8 frequencies each), MID peaking band (8 frequencies)
  - 24 dB/octave high-pass and low-pass filters, 7 frequencies each
  - Dual triode circuit using a 12AX7 tube
  - 500 series format
  - Buffered RC circuits in the negative feedback path around the tube amplifiers
