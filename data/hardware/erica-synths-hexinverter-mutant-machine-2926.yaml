details: |-
  The Mutant Machine started out as an attempt at a rich sounding eurorack snare drum synthesis module to complement the existing Mutant Drums. The project grew too large and too costly to justify a module that could only make snare sounds, so the architecture of the TR-909 snare and kick circuits was taken as a starting point for a module that generates multiple forms of analog percussion and various other effects.

  Like the other Mutant Drums, the Machine has its roots in classic analog percussion synthesis. It can create alien sounds, and it can still deliver the classic 909 house snares and kicks when those are wanted.

  There are no microcontrollers in the Machine. The signals and waveforms are all generated by discrete components and ICs, for a distinctly analog sound and user experience. The Erica Synths redesign, made in collaboration with Hexinverter Electronique, adds a manual trigger button.

  The module is 29HP wide and 30mm deep, and draws 139mA on the +12V rail and 115mA on the -12V rail.

  After Hexinverter Électronique founder Stacy Gaudreau announced the close of operations in September 2022, Erica Synths took over manufacturing, sales and support for several Hexinverter Électronique modules. The redesigned reissues retain the functionality of the originals, and Erica Synths provides support for the reissue modules only.
