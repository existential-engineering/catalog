description: Whether you're a musician taking the stage or a DJ packing the
  dance floor, make an impact with the Thump12v4 professional loudspeaker
  featuring SoundCheck DSP.
details: |-
  Thump12v4 pairs 1400W of Class-D amplification with a 12 inch high-performance low frequency woofer and a 1 inch Lavoce Italiana custom compression driver, reaching 129 dB maximum SPL and a 47 Hz low frequency response.

  SoundCheck DSP provides four selectable voicing modes. Flat keeps the speaker transparent, DJ adds low end for music playback, Live sharpens midrange clarity for vocals, speeches and karaoke, and Wedge optimises the cabinet on its side as a stage monitor.

  Three instant-setup features handle the awkward parts of a gig: Feedback Eliminator prevents microphone feedback at the push of a button, Music Ducking dims music automatically while someone speaks into the mic, and Outdoor mode compensates for the high-frequency loss of playing in open air.

  Bluetooth 5.0 streams from a phone or tablet, links two speakers wirelessly for stereo, zone or dual mono playback, and carries control from the Thump Connect 2 app. Bluetooth works simultaneously with the analog inputs and passes to the XLR mix output.

  The built-in mixer has dual XLR/TRS combo inputs with a mic/line switch on channel 1, a 1/8 inch input on channel 2, and an XLR mix output for chaining to another speaker. The cabinet carries premium metal handles, a pole-mount socket and three M10 fly points, and weighs 27.5 lb / 12.5 kg.
specs: |-
  - 1400W of clean Class-D amplification
  - 1 inch Lavoce Italiana custom compression driver
  - 12 inch high-performance low frequency woofer
  - Maximum SPL: 129 dB
  - Frequency response (-3 dB): 47 Hz - 20 kHz
  - Frequency response (-10 dB): 39 Hz - 20 kHz
  - Horizontal coverage 90 degrees, vertical coverage 50 degrees
  - Electronic crossover frequency: 1.8 kHz
  - SoundCheck DSP voicing modes: Flat, DJ, Live, Wedge
  - Feedback Eliminator
  - Music Ducking
  - Outdoor mode
  - Dual XLR/TRS combo input jacks on both channels
  - Mic/line switch on channel 1
  - 1/8 inch input jack on channel 2
  - XLR mix output (includes Bluetooth)
  - Front LED on/off
  - Bluetooth 5.0 streaming, linking and Thump Connect 2 app control
  - Peak and RMS limiting, power supply and amplifier thermal protection
  - Detachable line cord: 100-240V~, 50-60 Hz, 300W
  - AC connector: 3-pin IEC 250 VAC, 10 A male
  - Premium metal handles, 3 M10 fly points
  - Height 24.4 in / 620 mm, Width 14.0 in / 356 mm, Depth 14.0 in / 356 mm
  - Weight: 27.5 lb / 12.5 kg
