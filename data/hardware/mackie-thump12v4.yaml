description: "Whether you're a musician taking the stage or a DJ packing the
  dance floor, make an impact with the Thump12v4 professional loudspeaker
  featuring SoundCheck DSP."
details: |-
  Mackie Thump12v4 professional powered loudspeakers are the loudest, lowest and clearest everyday gigging solution for any live sound user of any experience level, combining 129 dB maximum SPL, 47 Hz low frequency response and SoundCheck DSP digital signal processing.
specs: |-
  - 1400W of class-D amplification
  - 1" custom compression driver
  - 12" low frequency driver
  - 129 dB maximum SPL
  - 47 Hz low frequency response
  - Height: 24.4 in / 620 mm
  - Width: 14.0 in / 356 mm
  - Depth: 14.0 in / 356 mm
  - Weight: 27.5 lb / 12.5 kg
  - 3 M10 fly points for suspended installation
  - Premium metal handles
