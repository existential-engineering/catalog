description: 'An essential tool for every musician and engineer, the MDB-1P
  Passive DI has everything you need to adapt unbalanced, high-impedance audio
  to a balanced, low-impedance output with minimal noise. Featuring a 1/4"
  high-impedance input and thru with -15db pad and a balanced XLR output with
  ground lift.'
details: |-
  From acoustic guitars to laptops, always sound your best with MDB Series Direct Boxes. Available in four different models, the MDB Series will give you the peace of mind that your sound will faithfully get to your audience the way that you hear it on stage.

  An essential tool for every musician and engineer, the MDB-1P Passive DI has everything you need to adapt unbalanced, high-impedance audio to a balanced, low-impedance output with minimal noise. Featuring a 1/4" high-impedance input and thru with -15db pad and a balanced XLR output with ground lift.
specs: |-
  - Perfect for live sound and studio applications
  - High-impedance 1/4" input with Thru output
  - Balanced male XLR output connector with Ground Lift
  - Ultra-low noise and distortion
  - -15dB pad ensures distortion-free performance with high-level sources
  - Built-Like-A-Tank construction
