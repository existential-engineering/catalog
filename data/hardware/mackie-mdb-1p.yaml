details: |-
  From acoustic guitars to laptops, always sound your best with MDB Series Direct Boxes. Available in four different models, the MDB Series will give you the peace of mind that your sound will faithfully get to your audience the way that you hear it on stage.

  An essential tool for every musician and engineer, the MDB-1P Passive DI has everything you need to adapt unbalanced, high-impedance audio to a balanced, low-impedance output with minimal noise. Featuring a 1/4" high-impedance input and thru with -15db pad and a balanced XLR output with ground lift.

  The Thru jack may be connected to the input of an instrument amplifier or an instrument-level parallel effects device such as an FX chain, processor or tuner. This output is unaffected by the direct box's circuitry.

  The ground lift switch separates the chassis ground from the signal ground at the balanced output jack. The default position is ground, and moving the switch to lift can remedy system ground loop hum.
specs: |-
  - Perfect for live sound and studio applications
  - High-impedance 1/4" input with Thru output
  - Balanced male XLR output connector with Ground Lift
  - Ultra-low noise and distortion
  - -15dB pad ensures distortion-free performance when connecting to high-level sources
  - Built-Like-A-Tank construction
  - No power required (passive)
  - Frequency response 20 Hz to 20 kHz, +/-0.2 dB
  - Dynamic range 128 dB
  - Total harmonic distortion 0.002% from 1000 Hz
  - Input impedance 140 k ohm unbalanced
  - Impedance ratio (input to output) 350:1
  - Output impedance 400 ohm unbalanced
  - Dimensions 1.5 x 3.4 x 5.8 in / 38 x 86 x 147 mm
  - Weight 0.8 lb / 0.4 kg
