description: This long-scale solid Alder body Alliance Series is packed with
  innovative features like our new Grand Duplex Bass Pickups and large anodized
  aluminium pickguard, all while retaining a sleek and elegant package.
details: |-
  The Alliance Series Chris Chaney is a long-scale bass built on a solid Alder body with smooth body contours, paired with a bolt-on one-piece Maple neck and an Indian Rosewood fingerboard of 305 mm / 12" radius. The scale length is 864 mm / 34", the neck carries 22 jumbo frets and a steel dual-action trussrod, the neck shape is Duesenberg's Custom Thin profile, and the headstock is finished to match the body colour.

  Electronics are a single custom Duesenberg Grand Duplex Bass Humbucker, which Duesenberg describes as clear and transparent while still delivering the deep bottom-end frequencies a bass requires. Wiring is kept simple with one volume and one tone control, and the control knobs and neck plate are custom laser etched.

  Hardware is nickel finished and comprises Duesenberg Z-Tuners Bass, a Duesenberg Vintage Bass Bridge and Duesenberg Standard strap pins that are Straplock compatible. A large anodized aluminium pickguard, offered in black or gold, covers much of the Alder body, custom inlays mark the 12th fret alongside cream dots, and the bass is strung with Duesenberg Custom 045/105 strings. The body finish is PUR lacquer.

  Every fingerboard passes through Duesenberg's Plek process so that the frets are perfectly level, which the maker treats as the basis for the fret polishing and setup work it carries out by hand.

  The page lists the bass in three finishes, Black, Gold-Sparkle and Distressed Black. The Distressed Black edition is limited to 10 pieces per year and is produced with an ageing process that includes a tone treatment, in which a set of frequencies is sent through the instrument over several days so that a new bass feels as though it has been played for decades. The instrument ships with the Duesenberg Custom Line Bag, all required allen keys and a certificate.
specs: |-
  - Neck type: Bolt-on, 1-piece Maple
  - Neck width: 38 mm / 1.5" (nut), 56 mm / 2.2" (12th fret)
  - Neck thickness: 20 mm / 0.8" (1st fret), 25,5 mm / 1.0" (12th fret)
  - Neck shape: Custom Thin
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream Dots, Custom CC inlay 12th fret
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 864 mm / 34"
  - Trussrod: Steel dual-action
  - Headstock: Matching Color
  - Body type: Solid Alder
  - Body dimensions: 51,3 x 33,2 cm / 20.2" x 13"
  - Height (sides): 4.1 cm / 1.6"
  - Pickguard: Anodized Aluminum, black or gold
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners Bass
  - Bridge: Duesenberg Vintage Bass Bridge
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 045/105 (045-065-080-105)
  - Pickup: Duesenberg Grand Duplex Bass Humbucker
  - Wiring: 1 Volume, 1 Tone
  - Knobs: Custom laser etched
  - Case: Duesenberg Custom Line Bag (included)
  - Tools: All required allen keys (included)
  - Certificate: included
