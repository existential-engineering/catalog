description: Premium handheld dynamic vocal microphone with a supercardioid
  polar pattern, engineered for live vocal applications. Delivers vocal power
  and clarity with an EQ-friendly sonic profile, superior off-axis rejection,
  and ultra-low handling noise.
details: >-
  The Electro-Voice PL-80c is a premium handheld dynamic vocal microphone in
  EV's PL Series, designed to deliver vocal power and clarity in live sound
  applications. Its supercardioid polar pattern tightens off-axis rejection
  compared to a cardioid pickup, helping the mic reject stage bleed and monitor
  wedges for greater gain before feedback in loud rooms.


  An EQ-friendly sonic contour gives the PL-80c a robust, forgiving response
  that cooperates with a wide range of vocal textures, letting engineers shape
  the sound naturally without harshness. Ultra-low handling noise keeps stage
  handling and cable thumps out of the signal, while the supercardioid pattern
  keeps focus on the vocalist rather than surrounding instruments or PA spill.


  The body is built from die cast zinc with a textured satin black finish in the
  “Classic” PL design for durability under stage and touring use. Output is via
  a standard 3-pin XLR connector, with a low-impedance balanced signal at 600
  ohms suitable for any professional mixer or preamp. The microphone is passive
  and requires no phantom power.
specs: |-
  - Element: Dynamic
  - Polar pattern: Supercardioid
  - Frequency response: 80 Hz - 16,000 Hz
  - Impedance (low-Z balanced): 600 ohms
  - Open circuit voltage: 2.2 mV/Pa
  - Connector: 3-pin XLR
  - Power requirement: Passive
  - Form factor: Handheld
  - Wired/wireless: Wired
  - Case material: Die cast zinc
  - Finish: Textured satin black
  - Family: PL Series
