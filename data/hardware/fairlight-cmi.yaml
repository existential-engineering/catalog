details: |-
  The Fairlight Computer Musical Instrument holds the distinction of being the first digital sampler to reach the market, debuting in 1979 and maintaining relevance throughout the 1980s. From the Series I through the Series III, each iteration brought significant technological advancements that pushed the boundaries of what was possible in digital music production.

  The Series I and II offered 8 voices with 16 kilobytes of memory per voice, while the Series III expanded to 16 voices with up to 28MB of RAM and 16-bit sampling at rates up to 100kHz in mono or 50kHz in stereo. The Series IIx introduced MIDI compatibility and upgraded processors, raising sampling resolution from 24kHz to 32kHz. Processing power came from dual 8-bit 6800 processors in early models, later upgraded to 16-bit 68000 chips.

  The interface was remarkably sophisticated for its era, featuring an 82-key alphanumeric keyboard, 15 function keys, a graphics tablet for drawing waveforms directly, and a video monitor for visual editing. Fast Fourier Transform processing enabled advanced waveform manipulation, with extensive looping, mixing, and resampling capabilities. Storage used hard disks or 8-inch floppy disks.

  Three sequencing modes provided flexibility: CAPS offered 80-track polyphonic sequencing, MCL functioned as text-based step-time entry, and the Rhythm Sequencer emulated classic drum machine workflows with SMPTE synchronization. The CMI was used by Jean-Michel Jarre, Peter Gabriel, Kate Bush, Art of Noise, Heaven 17, Michael Jackson, Yes, Madonna, Prince, Duran Duran, and Queen.
specs: |-
  - Polyphony: 8 voices (Series I/II), 16 voices (Series III)
  - Sampling: 16-bit, up to 100kHz mono / 50kHz stereo
  - Memory: 16KB per voice (I/II), up to 28MB (III)
  - Synthesis: FFT, waveform editing, graphics tablet drawing
  - Sequencer: CAPS (80-track), MCL (text-based), Rhythm Sequencer
  - Keyboard: 73 keys, velocity-sensitive
  - Processors: Dual 6800 (early), 68000 (later), 6809 (IIx)
  - Control: MIDI (IIx and later), SMPTE sync
  - Storage: Hard disk, 8" floppy disks
