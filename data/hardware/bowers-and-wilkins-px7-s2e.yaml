description: High-performance noise-cancelling wireless over-ear headphones. The
  Px7 S2e is an evolved version of the Px7 S2, drawing inspiration from the
  flagship Px8 with re-tuned acoustic performance.
details: |-
  Px7 S2e is a significantly improved version of Bowers & Wilkins' highly successful entry-level Px7 S2 wireless headphones. The 'e' stands for 'evolved', as the Px7 S2e draws inspiration and insights from the high-end Px8 wireless headphones, alongside a re-tuned acoustic performance, to deliver exceptional sound in its class.

  At the heart of the Px7 S2e are custom-designed 40mm dynamic full range bio cellulose drivers, paired with 24-bit DSP processing for high-resolution audio playback. Bluetooth 5.2 with aptX Adaptive support enables high-quality wireless streaming, with additional codec support for aptX HD, aptX, AAC, and SBC.

  Hybrid noise cancellation is powered by six microphones — four dedicated to active noise cancellation and two for telephony — alongside an ambient pass-through mode that lets you hear your surroundings without removing the headphones. A wear-detection sensor automatically pauses playback when the headphones are removed.

  Battery life is rated at 30 hours of playback, with a quick-charge feature delivering 7 hours of playback from a 15-minute charge. A USB-C port serves double duty for charging and as a wired audio interface, and a USB-C to 3.5mm stereo jack cable is included for analog connections.
specs: |-
  - Drivers: 2 x 40mm dynamic full range bio cellulose
  - Distortion (THD): <0.1% (1 kHz/10mW)
  - Bluetooth: 5.2 with aptX Adaptive
  - Codecs: aptX Adaptive, aptX HD, aptX, AAC, SBC
  - Bluetooth profiles: A2DP, AVRCP, HFP, HSP, BLE GATT
  - DSP: 24-bit processing
  - Microphones: 6 (4 for ANC, 2 for telephony)
  - Hybrid noise cancellation with ambient pass-through
  - Wear-detection sensor
  - Battery life: 30 hours playback
  - Quick charge: 7 hours playback from 15-minute charge
  - Battery type: Rechargeable Lithium Ion
  - USB-C charging & audio interface
  - Weight: 307g (without carry case)
  - Carry case dimensions: 189mm (W) x 63mm (D) x 233mm (H)
  - Included cables: USB-C to 3.5mm stereo jack (1.2m), USB-C to USB-C (1.2m)
  - Included carry case
  - Available colors: Anthracite Black, Cloud Grey, Forest Green, Ocean Blue, Ruby Red
