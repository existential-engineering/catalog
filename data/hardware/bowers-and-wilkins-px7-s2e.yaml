details: |-
  Px7 S2e is the evolved version of the Px7 S2, Bowers & Wilkins' entry-level over-ear wireless headphone. The 'e' stands for 'evolved', and the model draws inspiration and insights from the high-end Px8 alongside a re-tuned acoustic performance, to deliver exceptional sound in its class.

  Bowers & Wilkins credits a 24-bit DSP, enhanced with learnings from the Px8, combined with carefully angled 40mm drive units inside each earcup. The drivers are dynamic full-range bio cellulose units and the owner's manual gives input impedance as 33 ohms and distortion as less than 0.1% at 1kHz and 10mW.

  There are six microphones in total, four for active noise cancellation and two for telephony, housed in a design with memory foam earpads and a fabric finish. The Real World Listening feature set is Active Noise Cancellation, Ambient Pass-Through and Wear Sensing, the last of which pauses and resumes playback when an earpiece is lifted on or off the ear.

  Wireless streaming is Bluetooth 5.2 with aptX Adaptive, with aptX HD, aptX, AAC and SBC also supported, and the A2DP, AVRCP, HFP, HSP and BLE GATT profiles. The Bowers & Wilkins Music app handles setup and adjusts Active Noise Cancellation, Ambient Pass-Through and EQ, whose Treble and Bass sliders customise the tone of the headphones.

  The battery is a rechargeable lithium ion pack rated at 30 hours of playback, with 7 hours from a 15-minute charge and 2 hours for a full charge, and the headphones can be used while charging. There is one physical socket, a USB-C port on the right earpiece, which the manual uses both for charging and for USB audio from a computer; analogue sources are reached with the supplied USB-C to 3.5mm stereo jack cable. The headphones weigh 307g without the case and ship in five finishes.
