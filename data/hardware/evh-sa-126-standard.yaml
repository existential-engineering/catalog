description: "SA-126 is the very definition of innovation incarnate. It's a
  hybrid between semi-hollow and solid body guitar: think chambered/center block
  solid body blended with a bolt-on neck, then kitted out with features most
  frequently associated with high performance guitar brands such as a slim neck,
  jumbo frets and higher output pickups. The brain child of Wolfgang Van Halen,
  the instrument was created with versatility in mind, striking the perfect
  balance between pummeling rhythm tones and lightning-fast lead runs."
