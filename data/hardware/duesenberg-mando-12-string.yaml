description: The Mando 12-String delivers the beautiful and brilliant tone that
  is usually associated with Mandolins or Mandolas but plays like a small
  12-string guitar in standard tuning.
details: |-
  The Mando 12-String is Duesenberg's take on the mandola tradition, an electric twelve-string built on a very short 390 mm / 15.35" scale that is tuned and fingered like a standard guitar. Duesenberg's intent is that existing guitar technique transfers directly while the instrument supplies the brilliant, bell-like voice normally associated with mandolins and mandolas.

  The body is solid mahogany with sound chambers and a flat top, a construction Duesenberg describes as giving enhanced tone and reduced weight with a character between a solid and a semi-hollow instrument. It measures 39.5 x 28.5 cm / 15.55" x 11.22" with 4 cm / 1.57" sides, finished in PUR lacquer with cream three-layer purfling binding and an aged white pickguard.

  The neck is a single piece of maple set into the body, with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets, a Medium D profile and a steel dual-action truss rod. The fingerboard is Plek processed to guarantee level frets, which Duesenberg treats as the basis for its hand fret-polishing and setup work.

  Pickups are a Duesenberg VintageClass single coil at the neck and a Duesenberg LittleToaster mini-humbucker at the bridge, a pairing Duesenberg selects for open, transparent tone with bell-like clarity and brightness in a band context. Wiring is one volume, one tone and a three-way pickup selector.

  Hardware is nickel finished and includes Duesenberg Z-Tuners with knurled buttons, a Duesenberg 12-string bridge, a slotted brass tailpiece and Straplock-compatible Duesenberg Standard strap pins. The instrument is strung with Duesenberg Custom 12-String 008/042 sets and ships with the Duesenberg Custom Line Case and all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 45 mm / 1.77" (nut), 54 mm / 2.13" (12th fret)
  - Neck thickness: 22 mm / 0.87" (1st fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 390 mm / 15.35"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid Mahogany with sound chambers
  - Top: Flat
  - Body dimensions: 39.5 x 28.5 cm / 15.55" x 11.22"
  - Height (sides): 4 cm / 1.57"
  - Binding: Cream, 3-layer purfling
  - Pickguard: Aged white
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners with knurled buttons
  - Bridge: Duesenberg 12-string bridge
  - Tailpiece: Slotted brass tailpiece
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 12-String 008/042 (008/008-010/010-013/013-010/022-014/032-022/042)
  - Pickup (neck): Duesenberg VintageClass
  - Pickup (bridge): Duesenberg LittleToaster
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
