details: |-
  Reintroducing the Orbit with Schaller Tremolo to the Caparison lineup as an evolved and unique take on the classic high impact stage guitar, now in two new stunning pearlescent finishes alongside classic gloss black and white. A stunning amalgamation of balance and unhindered 27 fret access, the Orbit is the extreme shape you have been looking for - all the attitude and impact but with the superlative handling and screaming tones that you would expect from a distinctive and original Caparison. The Orbit features a 5-piece maple & walnut neck through a mahogany body, which has the gloss finish of the body seamlessly fading into the natural finish of the neck. This resonant basis, together with the combination of a Schaller locking tremolo, newly added Jescar jumbo stainless steel frets and Caparison's own revised design pickups make the Orbit an inspired hard rocking power-house!
