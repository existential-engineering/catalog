description: The LEHLE LITTLE DUAL is the LEHLE DUAL SGOS's little sister, a
  maximum signal-fidelity amp switcher for two amps. Both amps are activated
  simultaneously using the left footswitch, while the right is used to switch
  back and forth between them.
details: |-
  The Little Dual is the smaller sister of the Dual SGOS, an amp switcher for two amps built for maximum signal fidelity. Both amps are activated simultaneously with the left footswitch, while the right footswitch alternates between them. High-intensity LEDs make switching state A, B, or A and B easy to read even under high-power spots.

  At the centre of the unit sits the Lehle Transformer HZ, which electrically isolates output A from output B and so puts an end to hum loops. The protective earth conductor and the ground connection of the audio signal otherwise form a loop that picks up external interference, and galvanically isolating the ground connection at this point breaks it. Neither sound nor dynamics are altered by the isolation, and the signal passes the switcher without loss in strength or frequency.

  A phase inverter with gold-plated contacts and a gold-plated-contact ground switch complete the unit. The two inputs can also be routed in stereo to outputs A and B, which suits the stereo signal of an effect unit, or instruments equipped with two pick-ups such as many acoustic and hybrid guitars and double basses, routed through two amplifier systems. The systems can be operated either in alternation or in parallel.

  The switcher works passively, so it handles weak piezo signals and stronger line level signals alike without distortion or loss, and external power feeds the LEDs only, leaving dynamics and sound unaffected when the unit is used without a power supply. Transformer-isolated output A yields a balanced or unbalanced mono signal when a stereo (TRS) cable is used, so the unit can also feed a mixer or recorder with a high-impedance input.
specs: |-
  - Amp switcher for two amplifiers, both activated together or alternated
  - Left footswitch activates both amps, right footswitch switches between A and B
  - High-intensity LEDs showing switching state A, B, or A and B
  - Lehle Transformer HZ galvanically isolating output A from output B
  - Phase inverter with gold-plated contacts
  - Ground switch with gold-plated contacts
  - Two inputs routable in stereo to outputs A and B
  - Passive signal path, handling piezo through line level without distortion or loss
  - Transformer-isolated output A gives a balanced or unbalanced mono signal over a stereo (TRS) cable
  - External power supply feeds the LEDs only
