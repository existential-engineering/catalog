url: https://www.crownaudio.com/en-US/products/cdi-6000
description: Two-channel, 2100W @ 4Ω, 70V/140V Power Amplifier designed for
  installed sound applications. Rugged and lightweight with onboard DSP and
  support for 2/4/8-ohm loads and 70V/140V outputs.
specs: |-
  - 2 channels
  - 2100W per channel @ 4Ω (stereo)
  - Rated for 2-, 4-, 8-ohm loads and 70V/140V outputs
  - Sensitivity (full rated power @ 8Ω): 1.4V
  - Signal-to-Noise Ratio: 103 dB (A-weighted)
  - THD: < 0.5%
  - Damping Factor: > 500
  - Frequency Response: +0/-1 dB (20Hz-20kHz)
  - Crosstalk: > 70 dB
  - Input Impedance: 20kΩ balanced, 10kΩ unbalanced
  - Switch-mode universal power supply
  - Front-panel LCD screen
  - Onboard DSP: crossovers, EQ, delay, limiting
  - Dimensions: 3.5" × 19" × 16.2"
  - Weight: 30.0 lbs
  - IEC Power Connector: 15A
