description: Powered speaker optimizer with Auto-EQ, Advanced Feedback
  Suppression, stereo/mono subwoofer support, and Subharmonic Synthesis for
  enhanced bass response.
details: |-
  The DriveRack PX is a processor specifically designed for powered speaker systems, providing an all-in-one solution for optimizing and protecting loudspeakers. It features dbx's Auto-EQ with 28-band RTA measurement and a bundled M2 measurement microphone, enabling quick and accurate speaker tuning without external tools.

  Advanced Feedback Suppression (AFS) with 12 stereo notch filters eliminates feedback before it occurs. The dual 28-band graphic EQ, multi-band parametric EQ, and classic dbx compressor provide comprehensive signal shaping, while PeakPlus limiters protect loudspeakers from damage. A 120A Subharmonic Synthesizer adds extended low-frequency content.

  The unit stores 25 user programs and 25 factory programs. A full graphic LCD display provides clear visual feedback. The unit supports stereo and mono sub configurations, with 2 dedicated sub outputs alongside the 2 main line outputs.

  Note: This product is discontinued.
specs: |-
  - Line Inputs: 2 (stereo), female XLR
  - RTA Mic Input: 1, female XLR with +15VDC phantom power
  - Input Impedance: >40k ohm
  - Max Input Level: +20 dBu
  - CMRR: >45 dB
  - Mic EIN: >-110 dBu, 22Hz-22kHz, 150Ω
  - Line Outputs: 2 (stereo), male XLR
  - Sub Outputs: 2 (mono or stereo), male XLR
  - Output Impedance: 120 ohm
  - Max Output Level: +20 dBu
  - A/D Converter: dbx Type IV Conversion System
  - A/D Dynamic Range: 110 dB A-weighted, >107 dB unweighted
  - Type IV Dynamic Range: 123 dB transient material A-weighted
  - Sample Rate: 48 kHz
  - D/A Dynamic Range: 112 dB A-weighted, 110 dB unweighted
  - Overall Dynamic Range: >110 dB A-weighted
  - THD+Noise: 0.002% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, +/-0.5 dB
  - Interchannel Crosstalk: <-110 dB (-120 dB typical)
  - Programs: 25 user / 25 factory
  - Display: Full Graphic LCD
