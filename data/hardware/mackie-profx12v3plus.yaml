description: "12-Channel Analog Mixer With Enhanced FX, USB Recording Modes and
  Bluetooth. Mackie ProFX12v3+ is a professional analog mixer and USB-C audio
  interface with powerful enhancements for studio-quality recordings and live
  streams."
details: |-
  Mackie ProFX12v3+ is a professional analog mixer and USB-C audio interface with powerful enhancements for studio-quality recordings and live streams. Capture your performance with Onyx preamps and channel EQ, add computer audio via loopback, bring in calls via Bluetooth and enhance your sound with upgraded GigFX+ effects on a color LCD screen.

  12-channel professional analog mixer and USB-C audio interface with powerful enhancements for studio-quality recordings and live streams. Capture your performance with award-winning Onyx preamps, channel EQ and analog compression. Upgraded GigFX+ effects enhance your sound, plus you can edit and save your presets on the fly via the full-color display.
specs: |-
  - 7 Onyx mic pres with up to 60 dB gain and ultra-low noise
  - High-resolution GigFX+ effects engine
  - Full-color LCD display for editing/saving effects presets
  - 24-Bit / 192 kHz 2x4 USB-C audio interface
  - Three recording modes: Standard, Loopback, Interface
  - Bi-directional Bluetooth for music playback and caller integration
  - 3-band EQ on all channels
  - One-knob compression on channels 1-4
  - Hi-Z switches for direct instrument connection
  - 100 Hz low-cut filter and 48V phantom power on mic channels
  - Stereo 1/8" input on channel 11/12
  - Separate FX, monitor and subgroup busses
  - Headphone output with separate level and blend control
  - Solid steel chassis with tough ABS side protection
