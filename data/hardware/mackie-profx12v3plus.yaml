description: With easy connectivity, the warmth of analog and an upgraded FX engine, Mackie ProFX12v3+ is the perfect centerpiece for your studio.
details: |-
  Mackie ProFX12v3+ is a professional analog mixer and USB-C audio interface with powerful enhancements for studio-quality recordings and live streams. Capture your performance with Onyx preamps and channel EQ, add computer audio via loopback, bring in calls via Bluetooth and enhance your sound with upgraded GigFX+ effects on a color LCD screen.

  With up to 60 dB of gain and ultra-low noise, ProFXv3+ series mixers allow you to sound better than ever. Record podcasts, stream gameplay or produce the next hit, all with ultra-clean, transparent audio. The award-winning Onyx Mic Preamps deliver analog warmth so you sound great, no matter what you do.

  Enhance your sound using high-resolution GigFX+ effects, with 12 presets you can edit and save on the fly via the full-size LCD screen. Combining the warmth of an analog recording console with precise digital effects, ProFX12v3+ is an ideal mixer for home studios and live events alike.

  Capture your stream or performance at 24-bit / 192 kHz quality with a built-in 2x4 USB-C audio interface, complete with three recording modes: Standard for the full mix with effects, Loopback to include computer audio with mixer signal for streaming, and Interface to record channel 1-2 without effects processing.

  Use the dedicated Bluetooth channel to send and receive audio from devices like smartphones and tablets. For podcasters, it is an effortless way to bring in phone calls. For musicians and performers, it is the easiest option for streaming outside music and backing tracks.
specs: |-
  - 7 Onyx mic pres with up to 60 dB of gain and ultra-low noise performance
  - High-resolution GigFX+ effects engine with 12 editable presets
  - Full-color LCD display for editing and saving effects presets
  - 24-Bit / 192 kHz 2x4 USB-C audio interface
  - Three recording modes: Standard, Loopback and Interface
  - Bi-directional Bluetooth for music playback and caller integration
  - 3-band EQ on all channels (80 Hz, 2.5 kHz, 12 kHz)
  - One-knob compression on channels 1-4
  - Hi-Z switches allow direct connection of instruments
  - 100 Hz low-cut filter and 48V phantom power on all mic channels
  - Stereo 1/8" input on channel 11/12
  - Separate FX, monitor and subgroup busses
  - Headphone output with separate level and blend control
  - GigFX+ presets include hall, room and plate reverb, chorus, flanger, delay and combined delay/reverb, delay/chorus and reverb/chorus
  - Waveform OEM recording software included
  - Solid steel chassis with ABS side protection
  - Power consumption 30 watts, universal 100-240 VAC supply via 3-pin IEC line cord
  - 12.99 x 14.80 x 4.02 in / 330 x 376 x 102 mm, 7.9 lb / 3.6 kg
