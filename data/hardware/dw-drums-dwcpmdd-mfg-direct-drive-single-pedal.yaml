description: Packed with a slew of features, the MDD Pedal is the result of years of painstaking design and engineering.
details: |-
  Industry-standard bass drum pedals have always been a DW mainstay. The all-new Machined Direct Drive Pedal is no exception. Jam-packed with a slew of drummer-friendly features, the MDD Pedal is the result of years of painstaking design and engineering. Machined from solid aluminum, this pedal offers players unprecedented feel and versatility, whether or not they currently play a direct drive pedal.

  Standard features include a newly-designed, solid aluminum, perforated footboard with a contoured heel plate, Interlocking Delta Hinge, Tri-Pivot Toe Clamp, a solid aluminum, direct drive cam with TBT (Threaded Bearing Technology) and pivot adjustment, VERT (Vertical Spring Adjustment), Control Beater with adjustable weight/impact, and more.

  With a drummer-tailored feel and advanced, high-tech build quality, the all-new DW Machined Direct Drive is destined to become The Drummer's Choice.

  The Tri-Pivot Swivel Toe Clamp is a patented design that securely anchors to any bass drum counter hoop, and bearings at each pivot make the Ultra-Precision Universal Assembly the most responsive DW universal assembly available today.

  A Lux Leather backpack case is included: a deluxe soft pedal bag that does double-duty as a drummer's travel backpack.
specs: |-
  - Solid Aluminum Direct Drive Cam
  - V.E.R.T. Vertical Spring Adjustment
  - Tri-Pivot Toe Clamp (U.S. Patent No. 9240169)
  - Interlocking Delta Hinge
  - Optimized Fulcrum Geometry Linkage
  - Threaded Bearing Technology (TBT) with pivot adjustment
  - Control Beater with adjustable weight/impact
  - Lux Leather backpack case included
  - DW Mfg. Series
