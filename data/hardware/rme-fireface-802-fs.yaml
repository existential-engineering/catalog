url: https://rme-audio.de/fireface-802-fs.html
description: 60-Channel 192 kHz high-end USB Audio Interface in 19" rack format
  for professional live and studio use, featuring four high-transparency
  microphone/instrument preamps, SteadyClock FS jitter suppression, DC-coupled
  outputs, AES/EBU, ADAT, SPDIF, MIDI, Word Clock, and TotalMix FX DSP mixer
  with EQ, dynamics, reverb and delay.
details: |-
  60-channel 192 kHz USB audio interface in a 19-inch 1U enclosure. Four high-transparency mic/instrument/line preamps with 54 dB gain range on XLR/TRS combo front-panel inputs. Eight rear-panel balanced line I/O on TRS jacks with switchable reference levels. Two stereo headphone outputs on the front panel. Digital I/O includes AES/EBU (XLR, transformer-balanced), two ADAT optical I/O (with S/MUX and S/MUX4 modes; SPDIF optical via ADAT 1/2 and 9/10 in Multi-Mode), word clock I/O (BNC), and MIDI I/O (5-pin DIN). USB 2.0 host connection plus a USB type-A port for the optional ARC USB remote. Features SteadyClock FS jitter suppression, DC-coupled outputs for CV/Gate use, TotalMix FX DSP mixer with EQ, dynamics, reverb and delay, USB Class Compliant mode (driverless on macOS/Linux/iPad) and stand-alone operation with six memory presets.
specs: |-
  - 60-channel 192 kHz USB audio interface
  - Supported sample rates: 28 kHz to 200 kHz
  - Bit depth: 24-bit
  - Form factor: 19" 1U rack-mount
  - Four mic/instrument/line preamps with 54 dB gain range
  - Eight balanced TRS analog line inputs
  - Eight balanced TRS analog line outputs
  - Two stereo TRS headphone outputs (+17 dBu max)
  - Switchable analog reference levels (-10 dBV, +4 dBu, HiGain)
  - AES/EBU I/O on XLR (transformer-balanced)
  - Two ADAT optical I/O (standard, S/MUX, S/MUX4)
  - SPDIF optical via ADAT 1/2 and 9/10 (Multi-Mode)
  - Word Clock I/O on BNC
  - MIDI I/O on 5-pin DIN
  - USB 2.0 host connection
  - USB type-A port for optional ARC USB remote
  - SteadyClock FS jitter suppression
  - DC-coupled outputs (CV/Gate capable)
  - TotalMix FX DSP mixer (EQ, dynamics, reverb, delay)
  - USB Class Compliant mode (driverless on macOS/Linux/iPad)
  - Stand-alone operation with 6 memory presets
  - Frequency response @ 44.1 kHz: 8.9 Hz - 20.4 kHz
  - Frequency response @ 96 kHz: 4.3 Hz - 45.2 kHz
  - Frequency response @ 192 kHz: 3 Hz - 89 kHz
  - SNR Line In: 115-116 dB (AES17), 117-118 dBA
  - THD+N @ -1 dBFS: < -110 dB
  - Dimensions: 483 x 44 x 242 mm (19" x 1.73" x 9.5")
  - Weight: 2.8 kg (6.2 lbs)
  - Power: Internal switching PSU (100-240V AC), 22 W typical
  - Operating temperature: +5 to +50 C
