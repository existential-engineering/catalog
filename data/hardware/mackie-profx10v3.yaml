description: Designed for musicians and creators who want high-res audio, the
  Mackie ProFX10v3 is a professional USB mixer with effects and award-winning
  Onyx mic preamps.
details: |-
  The Mackie ProFX10v3 is a 10-channel professional effects mixer that gives recording artists, live performers and content creators a new level of studio-quality performance.

  The ProFX10v3 features four award-winning Onyx preamps and a versatile GigFX effects engine, allowing you to get colorful high-resolution recordings with sample rates up to 192 kHz. A Waveform OEM software bundle is included for recording, mixing and editing.

  Channels 1 and 2 are XLR and 1/4 inch combo inputs with Hi-Z switches and single-knob compression. Channels 3 and 4 add separate XLR mic and 1/4 inch line jacks, all four mono channels carry a 1/4 inch insert, and channels 5/6 and 7/8 are stereo 1/4 inch line pairs. Channel 9/10 takes the 1/8 inch stereo input or the USB 3-4 return.

  The GigFX engine offers 24 presets covering rooms, halls, plates and a spring reverb, choruses, a doubler, echo and ping-pong delays, flange, auto-wah and an overdrive/distortion, with an FX send jack and a footswitch input for FX mute.

  A 2x4 24-bit / 192 kHz USB interface records to Mac or PC and returns two independent stereo streams, and a blend knob mixes the USB 1-2 return against a latency-free feed from the mixer at the phones and control room outputs. Power comes from an external 12 VDC supply with a locking barrel connector.
specs: |-
  - 10-channel USB mixer with four low-noise, high-headroom Onyx preamps providing 60 dB of gain
  - 3-band EQ with On/Off hard bypass switch on all channels (80 Hz low, 2.5 kHz mid, 12 kHz high, +/-15 dB)
  - 100 Hz low-cut filter at 18 dB/octave and 48V phantom power on all mic channels
  - Single-knob compression on channels 1 and 2
  - Switchable Hi-Z inputs on channels 1 and 2 for guitars, bass and other instruments
  - Four 1/4 inch channel inserts on channels 1-4
  - 24 GigFX effects presets: Bright Room, Warm Lounge, Small Stage, Warm Theater, Warm Hall, Concert Hall, Cathedral, Small Plate, Large Plate, Chorus 1, Chorus 2, Delay + Reverb, Doubler, Echo, Delay 1, Delay 2, Delay 3, Ping-Pong Delay, Overdrive/Distortion, Spring Reverb, Early Reflections, Auto-Wah, Flange and Slapback Reverb
  - 24-bit / 192 kHz 2x4 USB recording interface (1 stereo input, 2 stereo outputs)
  - Dual stereo USB return with latency-free direct monitoring and a blend control
  - Dedicated stereo control room outputs and headphone output with separate level and blend control
  - Footswitch input for FX mute
  - Break switch mutes all channels to the main, control room and phones outputs
  - Two columns of 12-segment main meters
  - Equivalent input noise -126 dBu, all inputs +22 dBu maximum, main mix XLR +28 dBu
  - 12VDC 2A Class I hard-wired wall mount power adapter with locking barrel connector
  - Dimensions 10.7 x 11.9 x 3.3 in / 272 x 302 x 84 mm, weight 4.9 lb / 2.2 kg
