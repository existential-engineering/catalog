description: "10-Channel Professional Analog Mixer with USB. The Mackie
  ProFX10v3 is a 10-channel professional effects mixer that gives recording
  artists, live performers and content creators a new level of studio-quality
  performance."
details: |-
  The Mackie ProFX10v3 is a 10-channel professional effects mixer that gives recording artists, live performers and content creators a new level of studio-quality performance.

  The mixer combines four Onyx preamps with a GigFX effects engine, supporting high-resolution recordings with sample rates up to 192 kHz. It includes a Waveform OEM software bundle for recording, mixing and editing.

  Features latency-free direct monitoring and 24 effects including reverbs, delays and choruses.
specs: |-
  - Four Onyx mic preamps (60dB gain)
  - 3-band EQ with bypass switch
  - 24 GigFX effects (reverbs, delays, choruses)
  - 48V phantom power
  - 100Hz low-cut filter
  - Switchable Hi-Z inputs
  - USB recording up to 192kHz
  - Headphone output with blend control
  - Footswitch input for FX mute
  - Latency-free direct monitoring
  - Waveform OEM software bundle included
