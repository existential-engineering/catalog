description: When you need premium sound quality limiting and convenience of fast
  and precise recall and automation. Get analog mastering sound quality results,
  fast and spare your recall time.
details: |-
  The Bettermaker Mastering Limiter 2.0 is a 100% analog signal path mastering limiter in a 2U rack-mount enclosure, representing the evolution of the original Mastering Limiter that has been dominant in the professional audio mastering industry for over seven years. The 2.0 version introduces a completely redesigned control interface, an enhanced plugin, and new functional sections including a clipper and dual color modules.

  The unit features three main processing sections: a limiter with intelligent, manual, and BPM-based release modes; a clipper for transparent peak control; and dual color modules offering odd and even harmonic saturation for analog character. A sidechain section with high-pass filter and mid-boost capabilities provides further shaping of the detection signal.

  Mid/Side processing capability allows independent control over the stereo field, while true bypass via relays ensures the cleanest possible signal path when bypassed. The unit communicates with a host DAW via USB HID for full recall and automation of all parameters through the companion plugin.

  A comprehensive metering suite is built in, offering VU, PPM, LUFS, K-metering, FFT analyzer, and a goniometer for complete session monitoring. Up to 128 presets can be saved and recalled directly from the plugin, and DAW automation is fully supported for integration into modern mastering workflows.

  The Mastering Limiter 2.0 is covered by U.S. Patent No. 10,693,428 B2 ('System and Method for Control of an Analog Device'), with additional patents pending. It ships with a companion plugin installer for macOS (10.13+, with native M1 support) and Windows (8+).
specs: |-
  - 100% analog signal path
  - 2U rack-mount enclosure, 230 mm deep
  - Maximum gain reduction: 20 dB
  - Input range: 0 to +20 dB
  - Output range: -10 to +12 dB
  - Attack time: 0.1–250 ms
  - Release time: 2 ms–2 s plus intelligent release mode
  - Maximum input level: +24 dBu (balanced)
  - Maximum output level: +27 dBu (balanced)
  - Frequency response: 6 Hz–27 kHz (-0.5 dB)
  - Dynamic range: 107 dB
  - THD+N: 0.05% at 1 kHz
  - Power consumption: Max 25W (2W standby)
  - Weight: 5 kg
  - Limiter section with intelligent, manual, and BPM-based release modes
  - Clipper section for transparent peak control
  - Dual color modules: odd and even harmonic saturation
  - Sidechain with high-pass filter and mid-boost
  - Mid/Side processing capability
  - True bypass via relays
  - USB HID communication for DAW plugin control and automation
  - Up to 128 preset slots with save and recall
  - Integrated metering: VU, PPM, LUFS, K-metering, FFT analyzer, goniometer
  - Companion plugin supports macOS 10.13+ (native M1) and Windows 8+
  - U.S. Patent No. 10,693,428 B2
