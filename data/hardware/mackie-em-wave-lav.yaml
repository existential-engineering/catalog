url: https://mackie.com/en/products/microphones/em-wave/em_wave_LAV.html
description: Say goodbye to bulky wireless systems. The ultra-compact Mackie EM
  Wave LAV wireless lavalier microphone system is a plug-and-play solution for
  content creators and public speakers who want stellar audio and hassle-free
  wireless for all your production needs in a super-compact package.
details: |-
  From smartphone streaming and content creation to podcasts and filmmaking, wireless mic systems like the Mackie EM Wave LAV are essential for mobility and a clean look on camera. The problem? Most truly wireless lavalier microphone setups are bulky, complicated, expensive or all three.

  The Mackie EM Wave LAV wireless system sets up in seconds, sounds great, and both the transmitter and receiver can fit in your pocket. Plus, you don't need full-blown audio nerd status to operate it. Just connect the output of the receiver to your mixer, streaming or recording device (it even works with your phone), connect the wireless lavalier microphone to the transmitter, test your levels and you're good to go!
specs: |-
  - Wave Receiver: 1/8" TRS output
  - Wave Receiver: 1/8" headphone output
  - Wave Receiver: Adjustable output
  - Wave LAV Transmitter: 1/8" TRS input for lavalier microphone
  - Wave LAV Transmitter: Built-in electret microphone
  - Wave LAV Transmitter: Adjustable Gain
  - Wave LAV Transmitter: Onboard Mute
  - Digital 2.4 GHz encrypted wireless
  - Up to 7 hours battery life per charge
  - One button pairing
  - Up to 6 Wave systems simultaneously
  - USB-C charging and updates
  - Integrated belt clip
