details: |-
  Say goodbye to bulky wireless systems. The ultra-compact Mackie EM Wave LAV wireless lavalier microphone system is a plug-and-play solution for content creators and public speakers who want stellar audio and hassle-free wireless for all your production needs in a super-compact package.

  From smartphone streaming and content creation to podcasts and filmmaking, wireless mic systems like the Mackie EM Wave LAV are essential for mobility and a clean look on camera. The problem? Most truly wireless lavalier microphone setups are bulky, complicated, expensive or all three.

  The Mackie EM Wave LAV wireless system sets up in seconds, sounds great, and both the transmitter and receiver can fit in your pocket. Just connect the output of the receiver to your mixer, streaming or recording device, connect the wireless lavalier microphone to the transmitter, test your levels and you are good to go.
specs: |-
  - Each system includes both a transmitter and receiver
  - Ultra-compact, lightweight design
  - Digital 2.4 GHz encrypted wireless for reliable operation in any region
  - Internal rechargeable battery for up to 7 hours of use
  - One button pairing
  - Multi-color status LED
  - Use up to 6 Wave systems in the same area
  - Charge and apply updates via USB-C
  - Integrated belt clip
  - Receiver: 1/8-inch TRS output, 1/8-inch headphone output, adjustable output
  - Transmitter: 1/8-inch TRS input for the included lavalier microphone, built-in electret microphone, adjustable gain, onboard mute
  - Included accessories: deluxe carry case, lavalier microphone with clip and furry windshield, 1/8-inch TRS to TRRS cable, 1/8-inch TRS to TRS cable, 2 USB-A to USB-C cables
