id: TRSTyy4xe2Q_Ghdf00R4F
name: EVERSE 12
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/everse-12/
description: The EVERSE 12 is a weatherized, battery-powered 12-inch two-way
  portable loudspeaker with Bluetooth audio streaming, true wireless stereo, and
  EV QuickSmart Mobile app control. A 400 W Class-D amplifier with QuickSmartDSP
  (developed with Dynacord) drives a 12-inch ferrite woofer and a 1-inch
  neodymium compression driver through a patented SST ported waveguide,
  delivering 126 dB peak SPL with 100 x 60 degree coverage. The integrated 86.4
  Wh battery provides 12+ hours of runtime at 100 dB SPL (6+ hours at maximum
  output), and the IP43-rated enclosure (when on battery via Bluetooth) suits
  indoor and outdoor use by DJs, musicians, and event rentals. Onboard features
  include a four-channel digital mixer, studio-quality effects, phantom power,
  feedback suppression, audio ducking, a 12 V DC output for wireless mic
  systems, and a USB-C charging port for mobile devices.
details: >-
  400 W Class-D amplifier with QuickSmartDSP (developed with Dynacord)


  12-inch ferrite woofer and 1-inch neodymium ferrofluid-cooled compression
  driver


  126 dB peak SPL output


  100 x 60 degree (H x V) coverage via patented SST ported waveguide


  86.4 Wh internal battery: 12+ hours at 100 dB SPL, 6+ hours at max output


  Bluetooth audio streaming and true wireless stereo (pair two EVERSE units)


  EV QuickSmart Mobile app control (iOS and Android) for up to six EVERSE 12
  systems


  Four-channel digital mixer with seven-band GEQ, effects, and user presets


  Phantom power, feedback suppression, and audio ducking


  2 x XLR/TRS combo inputs, 1 x 3.5 mm stereo input, 1 x TRS footswitch input


  1 x XLR link output


  12 V DC power output for wireless microphone receivers


  USB-C charging port (1.5 A max) for mobile devices


  IP43-rated when operating on battery via Bluetooth


  Tripod-mountable with 25 / 55 degree kick-back monitor angles


  Polypropylene enclosure with powder-coated steel grille; available in black or
  white
specs: >-
  - frequencyResponse: 55 Hz - 20 kHz (-3 dB)

  - frequencyRange: 45 Hz - 20 kHz (-10 dB)

  - maxSpl: 126 dB peak

  - amplifierPower: 400 W Class-D

  - coverage: 100 x 60 degrees (H x V)

  - woofer: 12-inch ferrite magnet

  - tweeter: 1-inch neodymium compression driver, ferrofluid cooled

  - crossoverFrequency: 2000 Hz

  - batteryCapacity: 86.4 Wh

  - batteryRuntimeMax: 6+ hours at maximum output

  - batteryRuntimeNominal: 12+ hours at 100 dB SPL

  - bluetooth: Audio streaming and true wireless stereo; QuickSmart Mobile app
  control

  - weatherRating: IP43 (on battery via Bluetooth)

  - dimensions: 345 x 597 x 347 mm (13.58 x 23.5 x 13.66 in)

  - weight: 14.16 kg (31.22 lb)

  - kickBackAngles: 25 / 55 degrees

  - powerConsumption: 100-240V~, 50-60 Hz (AC charging)

  - enclosureMaterial: Polypropylene with powder-coated steel grille

  - colors: Black, White
