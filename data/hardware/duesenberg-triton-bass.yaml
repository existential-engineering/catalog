description: The Triton Bass was designed to be a real workhorse. It's a punchy
  34" longscale construction using a unique three pickup layout which are
  controlled by an easy to use 5-Way switch and straight forward volume and tone
  controls.
details: |-
  The Triton Bass is a 34 inch longscale solidbody bass with a contoured American Alder body measuring 51 x 33 cm with 4.2 cm sides, cream binding, a black Custom pickguard and a PUR lacquer finish. Duesenberg describes the solidbody construction as giving instant response, plenty of attack and sustain and good feedback resistance, and Alder as a versatile tone wood with a bright voice.

  The neck is a one-piece bolt-on American Hardrock Maple neck in a Medium D shape, 41 mm wide at the nut and 57 mm at the 12th fret on the 4-string, with a steel dual-action truss rod and a black headstock. Its Indian Rosewood fingerboard has a 305 mm radius, cream dot inlays and 20 jumbo frets. Every Duesenberg fretboard is Plek processed for level frets, which the company uses as the basis for its multi-step hand fret polishing and setup work.

  Electronics use three Duesenberg SingleTwin Bass humbuckers, described as noiseless while keeping the wiring completely passive, mounted under Phonico pickup covers. They are controlled by one volume, one tone and a 5-way pickup selector, with an additional switch on the pickguard that selects between parallel and serial pickup modes.

  Hardware comprises Duesenberg Z-Tuners and the newly designed Duesenberg "The Block" bass bridge, which Duesenberg says offers extensive adjustability, tone transfer and long sustain. Strap pins are Duesenberg Standard and Straplock compatible, and the bass ships with Duesenberg Custom 045/105 strings. Most Duesenberg hardware is nickel finished rather than chrome, which the company notes ages naturally over time and can be slowed by regular cleaning.

  The instrument is supplied with a Duesenberg Custom Line Case as standard, a classically shaped handcrafted case of flightcase quality, along with all required allen keys.
specs: |-
  - Neck type: Bolt-on Neck, 1-piece Maple
  - Neck width (4-string): 41 mm / 1.61" (nut), 57 mm / 2.25" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 20 Jumbo 2.8 x 1.0 mm
  - Scale length: 864 mm / 34"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solidbody, American Alder
  - Body dimensions: 51 x 33 cm / 20" x 13"
  - Body height (sides): 4.2 cm / 1.7"
  - Binding: Cream
  - Pickguard: Black Custom
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg "The Block" bass bridge
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 045/105 (045-065-085-105)
  - Pickups: 3 Duesenberg SingleTwin Bass Humbucker
  - Wiring: 1 Volume, 1 Tone, 5-Way Pickup Selector, 1 Serial/Parallel Switch
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
