details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra ST GA Cutaway is a versatile acoustic built with a solid spruce top for improved response to playing dynamics and a tone that only gets better over the years. The single cutaway, which enables high-fret access, accommodates a variety of styles. Its light okoume neck delivers note clarity and resonance, while solid spruce X-bracing, helps this guitar project sound with remarkable depth. Rounded fret ends add to the instrument's refinement by eliminating sharpness and rough spots. The Terra ST GA Cutaway comes pre-strung with D'Addario EXP16 coated strings, promising lasting bright tones for every performance. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
