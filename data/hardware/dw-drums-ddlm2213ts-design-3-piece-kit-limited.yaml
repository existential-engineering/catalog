description: This Limited-Edition DW Design Series kit in Titanium Satin features unique sizes and a bold look.
details: |-
  The DW Design Series raised the bar by bringing DW's custom-drum features to more drummers than ever before. Now, in a sleek Titanium Satin Matte Lacquer finish, this limited-edition shell pack showcases unique sizes that set it apart from the standard Design Series lineup.

  Handcrafted with 100% North American maple, the 8-ply HVLT (Horizontal-Vertical-Low Timbre) shells deliver a warm, punchy tone with plenty of resonance and projection. The 16x22″ bass drum provides focused low-end power, paired with an 8x12″ mounted tom and a 14x16″ floor tom for a versatile and powerful configuration.

  The chrome hardware features low-mass mini-turret lugs, triple-flange hoops, STM (Suspension Tom Mounts) for reduced tension on mounted toms, and True-Pitch Tuning for increased tuning control.

  This limited kit delivers a bold, powerful voice and the striking look of Titanium Satin Lacquer, built to stand out on stage and in the studio.
