description: Designed for small spaces, short listening distances and immersive setups, the A4V delivers accurate, full-bodied sound in a compact form factor.
details: |-
  The A4V is a two-way speaker incorporating a 4-inch long-throw woofer made from the same Multi-Layer Mineral (MLM) fibers as other A Series speakers plus the classic X-ART tweeter. Onboard DSP-based tuning capabilities let you easily dial in the perfect sound for your space.

  With a frequency range of 52 Hz to 45 kHz, the A4V can accommodate a broad spectrum of audio applications, from producing podcasts to mixing string quartets, and will fit well within immersive and 3D setups.

  Made from a new glass fiber polymer compound, the HPS waveguide enables the X-ART tweeter to disperse sound in space with controlled consistency, with 120 degrees horizontal and 70 degrees vertical dispersion. The waveguide is rotatable for horizontal or vertical placement. The cabinet uses a dual front ported bass reflex system and carries a front panel multi-color status LED.

  The A Series combines the best of both digital and analog worlds. The A4V uses a PWM amplifier for the woofer and a Class A/B amplifier for the tweeter, with independent peak and thermo limiters for each driver plus amplifier thermo limiters.

  The DSP-based functionality of all A Series monitors can be controlled remotely and in real time over Ethernet using the A Control software (Windows and macOS), which adds six bands of parametric EQ, level and delay on top of the backplate room adaptation controls. ADAM Audio also partners with Sonarworks so that SoundID Reference calibration profiles run directly on the monitor's DSP.
specs: |-
  - 2-way active nearfield studio monitor
  - 4" Multi-Layer Mineral (MLM) cone woofer, 1" (25 mm) voice coil
  - Handmade X-ART tweeter with rotatable HPS waveguide, 4 inch² (2420 mm²) diaphragm area
  - Equivalent diaphragm diameter: 2" (56 mm); velocity transform ratio 4 to 1; diaphragm weight 0.17 g
  - Waveguide dispersion: 120° horizontal, 70° vertical
  - Frequency response @ -3 dB: 58 Hz – 41 kHz
  - Frequency response @ -6 dB: 52 Hz – 45 kHz
  - Crossover frequency: 3.0 kHz
  - Max SPL per speaker at 1 m (sine bursts): 100 dB SPL
  - Max SPL per speaker at 1 m (IEC-weighted noise): 109 dB SPL
  - Woofer amplifier: PWM, 110 W peak (10% THD) / 90 W RMS (1% THD)
  - Tweeter amplifier: Class A/B, 20 W peak (10% THD) / 15 W RMS (1% THD)
  - AD converter: 24-bit, internal sample rate 96 kHz
  - Delay range and resolution: 0 – 10 ms, 0.1 ms
  - Analog input connectors: XLR and RCA
  - Input impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA)
  - Max. input level: +19 dBu
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m @ 0 dB level setting
  - Backplate controls: level (-12 dB to +12 dB), input selection (balanced/unbalanced), voicings (Pure, UNR)
  - Room adaptation EQ: Bass (+2/0/-2/-4 dB), Desk (0/-2/-4 dB), Presence (+1/0/-1 dB), Treble (+1.5/0/-1.5 dB)
  - Advanced room adaptation via A Control: 6 x PEQ, level, delay
  - Networking connector: RJ45, Ethernet, OCA using standard IP data
  - A Control remote software available for Windows and macOS
  - Third-party calibration: import from Sonarworks SoundID Reference
  - Protection: independent peak and thermo limiters for each driver, plus amplifier thermo limiters
  - Cabinet design: dual front ported bass reflex
  - Cabinet material: vinyl wrapped MDF with painted MDF front panel
  - Display: front panel multi-color LED
  - Mounting options: threaded inserts on the bottom of the cabinet (4 x M8)
  - Power consumption (max, idle, sleep): 220 W, 10 W, 3.5 W
  - AC input voltage: 100 – 240 V, 50/60 Hz; power rating 300 W max.
  - Operating conditions: -10 °C to +40 °C (+14 °F to +104 °F); <75 % RH, non-condensing
  - Dimensions (H x W x D): 268 mm x 158 mm x 220 mm (10 1/2" x 6 1/4" x 8 5/8")
  - Weight: 5.8 kg (12 lbs 13 oz)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: A4V loudspeaker, power cable, Quick Start Guide
  - Design patents: EU No. 008785018-0001; UK No. 6209054
