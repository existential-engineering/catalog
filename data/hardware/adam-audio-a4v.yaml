description: Designed for small studio spaces, short listening distances and
  immersive multi-speaker configurations, the A4V delivers accurate, full-bodied
  sound in a compact form factor.
details: |-
  Designed for small studio spaces, short listening distances and immersive multi-speaker configurations, the A4V delivers accurate, full-bodied sound in a compact form factor.

  The A4V is a two-way speaker incorporating a 4-inch long-throw woofer made from the same Multi-Layer Mineral (MLM) fibers as other A Series speakers plus the classic X-ART tweeter. Onboard DSP-based tuning capabilities let you easily dial in the perfect sound for your space.

  With a frequency range of 52 Hz to 45 kHz, the A4V can accommodate a broad spectrum of audio applications—from producing podcasts to mixing string quartets—and will fit well within immersive and 3D setups.
specs: |-
  - 4" MLM (Multi-Layer Mineral) woofer
  - X-ART tweeter with rotatable HPS waveguide
  - Frequency Response @ -3 dB: 58 Hz – 41 kHz
  - Frequency Response @ -6 dB: 52 Hz – 45 kHz
  - Crossover: 3.0 kHz
  - Max SPL at 1m: 100 dB SPL (sine bursts)
  - Max SPL at 1m (IEC-weighted): 109 dB SPL
  - Total Peak Power: 130 W
  - Woofer amplifier: 110 W peak, 90 W RMS
  - Tweeter amplifier: 20 W peak, 15 W RMS
  - Power consumption: 220 W max, 10 W idle, 3.5 W sleep
  - Dimensions: 268 mm H x 158 mm W x 220 mm D (10.5" x 6.25" x 8.625")
  - Weight: 5.8 kg (12 lbs 13 oz)
  - Cabinet: Dual front ported, vinyl-wrapped MDF
  - 24-bit AD Converter
  - Internal Sample Rate: 96 kHz
  - Delay Range: 0-10 ms (0.1 ms resolution)
  - Input Sensitivity: 0 dBu = 100 dB SPL @ 1m
  - Level: -12 dB to +12 dB
  - Voicings: Pure, UNR
  - Room Adaptation: Bass, Desk, Presence, Treble controls
  - Input Impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA)
  - Max Input Level: +19 dBu
  - AC Input: 100-240 V, 50/60 Hz
  - 4 x M8 threaded inserts on bottom for mounting
  - Front panel multi-color LED status indicator
  - OCA protocol via standard IP network
  - 5 year warranty (2 years + 3 years optional with registration)
