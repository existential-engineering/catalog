description: An 8hp Eurorack utility module combining ten functions including a
  DC source, buffered multiple, mixer, rectifiers, gate-to-trigger generator,
  attenuverter and offset generator.
details: |-
  The First Aid Kit is here to be your first choice, regardless of whether you're picking out your first utility module, building a minimal system or expanding a large system, by offering a powerhouse toolbox built on the principle of "everything you need, nothing you don't."

  Offering ten functions in just 8hp, you can feel assured that you are no longer likely to run into dead ends while patching, because you need just one more utility - no need to buy lots of specialized utility units either, which can be both costly and space ineffecient, as you get all in one with the First Aid Kit. Functions include:

  Functions can be used independently of each other, and the unit can be patched with itself for even more functions. Enjoy a toolbox that will solve nearly any problem you're facing, all in a compact-yet-comfortable 8hp. The First Aid Kit replaces lots of other individual modules, and gives both newcomers an excellent starting point for what can feel like boring but necessary purchases, while also offering excellent utility to both large and small systems. The First Aid Kit: don't get caught without one when you need it most.
specs: |-
  - 5v DC source
  - Buffered multiple
  - LED voltage indicator
  - Summing 3-to-1 mixer
  - Signal inverter
  - Half-wave rectifier
  - Full-wave rectifier
  - Gate-to-trigger generator
  - Attenuverter
  - Bipolar and unipolar 8v offset generator
