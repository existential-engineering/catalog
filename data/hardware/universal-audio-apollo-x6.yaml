name: Apollo x6
manufacturer: universal-audio
primaryCategory: audio-interface
url: https://www.uaudio.com/products/apollo-x6
prices:
  - amount: 3199
    currency: USD
description: The centerpiece of your next music production.
details: |-
  Produce music with elite-class Apollo X Gen 2 audio conversion, and hear every detail with unprecedented dynamic range Use dual Unison™ preamps to get the sound of iconic analog gear from Neve, API, Manley, Fender, and more Record and mix through UAD plug-ins in realtime with onboard HEXA Core DSP Work faster with new UAD Console features including Auto-Gain, Plug-In Scenes, Monitor Controller, Immersive Audio, and more Mix with confidence in any room or through headphones using Apollo Monitor Correction by Sonarworks® Get included UAD plug-ins from Auto-Tune, Fairchild, Teletronix, and more with Essentials+ or Studio+ Editions
specs: |-
  - Uad-2 dsp acceleration
  - Sub-2ms latency
  - 8 total analog inputs
  - 2 digitally controlled analog mic preamps
  - 6 balanced line inputs
  - 2 front-panel jfet dis
  - 6 balanced line outs
  - 2 digitally-controlled analog monitor outs
  - 2 dedicated stereo headphone outs
  - 8 channels of adat s/mux
  - 2 channels of s/pdif
  - Word clock I/O with input termination switch
  - Universal 2 binary
