details: |-
  The Martin HD-35 is a unique and trusted favorite, delivering bold tone and refined style. Its Dreadnought body size produces a loud, projective voice with resonant bass, clear trebles, and rich overtones, making it perfect for a wide range of playing styles. Handcrafted with a solid spruce top and solid East Indian rosewood back and sides, the HD-35 features an iconic three-piece back design and lighter, scalloped 1/4" bracing, setting it apart with enhanced projection and dynamic response, while the bold herringbone trim around the top adds a classic touch to its timeless design.

  The satin neck, with a Golden Era (GE) Modified Low Oval profile, high-performance taper, and 25.4" scale length, ensures smooth, effortless playability. Complete with antique white binding, a bound ebony fingerboard with mother of pearl dot inlays, an ebony bridge with bone pins, and chrome enclosed gear tuners, the HD-35 is a guitar you can trust to unleash the artist within.

  Martin's refreshed Standard Series for 2025 enhances tone, comfort, and style. Sitka spruce GE top bracing delivers vintage-inspired tone and sustain, while updates like a reimagined neck profile, thinner fingerboard, and refined bridge and heel improve playability and aesthetics. Each guitar includes a hardshell case.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Solid Spruce with Aging Toner
  - Back and Sides: Solid East Indian Rosewood (three-piece back)
  - Bracing: Forward Shifted X-Brace, GE-Scalloped, 1/4" Spruce
  - Top Inlay: Bold Herringbone
  - Binding: Antique White
  - Rosette: Style 28 Multi-Stripe
  - Neck Material: Select Hardwood, Dark Mahogany color, Satin finish
  - Neck Shape: GE Modified Low Oval with High-Performance Taper
  - Scale Length: 25.4"
  - Number of Frets: 20 (joins body at 14th fret)
  - Fingerboard: Ebony, Antique White binding, Style 28 Mother of Pearl inlays
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Headstock: Solid with Square Taper, East Indian Rosewood headplate, Script Old Style overlay
  - Tuning Machines: Chrome Enclosed Gear
  - Bridge: Ebony, GE Modern Belly - Drop in Saddle
  - Saddle: Compensated Bone, 16" radius
  - Nut: Bone
  - Bridge Pins: Bone with Faux Tortoise dots
  - Pickguard: Faux Tortoise
  - Construction: Dovetail Neck Joint
  - Electronics: None
  - Case: Molded Hardshell (included)
  - Left-handed availability: Yes
  - Plek setup: Yes
