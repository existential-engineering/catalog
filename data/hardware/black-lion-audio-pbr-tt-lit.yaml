details: The PBR TT LIT is a 96-point TT/DB25 patchbay featuring a
  patent-pending illuminated LCD display for each front-panel connection,
  supporting up to 12 characters per label. Labels are customizable via direct
  USB keyboard input or the included PatchCAD LIT software (Mac/Windows). The
  unit uses gold-plated contact points and audiophile-grade connectors
  throughout, with a black-anodized aluminum faceplate and user-adjustable
  display brightness.
