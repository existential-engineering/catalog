description: The EQP-KT is a classic tube equaliser that pays homage to the
  Pultec EQP-1A, offering mastering-quality equalisation at a price that suits a
  studio or a live rack. It is a two-band design built around a vintage Class-A
  circuit, hand-selected 12AX7 and 12AU7 tubes and custom MIDAS input and output
  transformers.
details: |-
  The EQP-KT draws inspiration from the Pultec EQP-1A equaliser, first produced in the early 1950s. Pultec equalisers have been prized for their smooth musical sound, and audio engineers have used them at all stages of the recording process, from tracking to mastering.

  At the heart of the EQP-KT is a vintage Class-A circuit design constructed from high-quality discrete components, all of which meet or exceed the Pultec EQP-1A's original specifications. Its characteristic warmth comes from a set of premium, hand-selected 12AX7 and 12AU7 tubes, a combination that provides ultra low-noise analogue output with tight, warm bass, smooth midrange and airy treble.

  Custom-designed MIDAS input and output transformers are incorporated for high-quality audio reproduction in both live and studio environments, continuing the transformer designs used in MIDAS consoles such as the XL4 and Heritage H3000.

  The two-band design allows the boost and cut controls to work independently of one another, so specific frequency content can be boosted and cut simultaneously for flexible shelving. Both the LF Boost/Cut and HF Boost controls provide 7 frequency selections, along with a variable broad-bandwidth midrange control, and an HF Cut control dials in the amount of air added to the top end.

  The signal path runs from a MIDAS input transformer through the two-band equaliser and a makeup gain amplifier to a MIDAS output transformer. With the Bypass/EQ On switch in the Bypass position, the equaliser is the only section removed from that path.
specs: |-
  - Two-band valve equaliser with independent boost and cut
  - Vintage Class-A discrete circuit design
  - Hand-selected 12AX7 and 12AU7 tubes
  - Custom MIDAS input and output transformers
  - LF Boost/Cut: 7 frequency selections
  - HF Boost: 7 frequency selections
  - Variable broad-bandwidth midrange control
  - HF Cut control
  - Balanced XLR and 1/4-inch TRS inputs and outputs, line level
  - Unbalanced operation available via 1/4-inch TS cables
