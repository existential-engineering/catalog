name: AL-88c
manufacturer: alyseum
primaryCategory: midi-interface
categories:
  - controller
website: https://alyseum.com/al-88c.html
description: "The alyseum al-88c offers the same performances and main
  functionalities as our flagship product: the al-88, at a very attractive
  price."
details: |-
  The alyseum al-88c offers the same performances and main functionalities as the al-88, at a very attractive price. An al-88c allows you to connect 8 MIDI in and 8 MIDI out ports, simply and in a flexible way to patch, remap, filter and merge MIDI flows on a fine channel basis.

  Expandable by multiples of 2 or 8 MIDI I/o ports to create a unique patch-bay which also encompasses up to 32 virtual MIDI ports in every computer (win or mac os). Al-88c offer the top performance in terms of MIDI throughput and latency/jitter far below 1 ms.

  Al-88c was tested against numerous mac & pc programs - including MIDI quest - for a perfect handling of the touchy sysex exchanges of past synthesizers.

  Features include self-contained interface, 8 MIDI in/out pairs to global MIDI network, peer to peer MIDI transport on a channel basis, remapping and merging, and peer to peer MIDI transport without mandating a computer.

  Wall power adaptor with ac plug for eu or uk or us supplied, rugged aluminum profile, 100 base-t Ethernet port with shielded rj45, and firmware upgradeable via the network.
specs: |-
  - 8 MIDI in ports
  - 8 MIDI out ports
  - Expandable by multiples of 2 or 8 MIDI I/o ports
  - Up to 32 virtual MIDI ports
  - MIDI throughput performance
  - Latency/jitter far below 1 ms
  - Peer to peer MIDI transport
  - MIDI remapping and merging
  - 100 base-t Ethernet port
  - Shielded rj45
  - Rugged aluminum profile
  - Wall power adaptor with ac plug for eu or uk or us
  - Firmware upgradeable via network
  - Compatible with win or mac os
  - Sysex exchange handling
