details: |-
  The Interstellar Overdriver is a true overdrive pedal, designed to blast your amp with your sound. Beautifully transparent and based around a discrete circuit, this pedal is all about the natural, wonderful sound of turning an amp up too loud. It's specifically constructed to work the same way as old tube amps: the more you turn it up, the better it sounds. The drive knob sweeps from a slight boost to a beautiful, harmonically rich overdrive, and for more control you can kick back the output volume with the Master knob while retaining the sweetness.

  We scoured the galaxy for the best components to complete this amp-like, discrete, and beautifully transparent overdrive circuit. The circuit is precisely tuned to counteract the harsh, unnatural fizziness that comes with recreating tube overdrive in a stompbox format, and each component is carefully chosen to reproduce the pleasing, organically overdriven sound of vintage speakers pushed to the max. Achieve stadium-sized guitar sounds at bedroom levels with the same dynamic crunch and fluid sustain as a fleet of backline amps turned up to the edge of meltdown. Dial in ragged, tweed-style breakup and saturation with realistic, spongy tube-like sag and harmonics, punch up leads with a clean boost that preserves your instrument's natural tone, or sprinkle some extra vibe on a plain-sounding DI track.

  Overdriver sets the input gain for anything from a subtle clean boost to full-on power amp destruction. Master controls the output volume of the effect.
