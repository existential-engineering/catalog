description: Edge Solo is a large-diaphragm condenser modeling microphone with
  18 iconic real-time microphone emulations from Antelope Audio.
details: |-
  The Edge Solo is a versatile and easy to use condenser microphone that brings Antelope Audio's commitment to high-resolution sound to your home studio and builds upon it with the tone-shaping abilities of 18 recording legends. The unique balance of heritage and technical innovation embodies the essence of the Edge Solo, making it a premier choice for vocals and acoustic instruments.

  Engineered with an eye towards detailed sound capture, the Edge Solo uses technology developed after years of experience with high-resolution sound. The 6-micron gold-sputtered membrane brings out the character of voices and instruments for a rich sound without sacrificing transients or detail. True-to-source textures are captured thanks to a low-resonance body and low-reflection headbasket, translating to self-noise levels that are indiscernible from the natural ambiance of a room.

  The Edge Solo gives access to 18 carefully selected classic microphones. The Modeling Engine is a technology that brings a curated selection of timeless classics to the studio. Antelope developed it by working with several revered European facilities, making rigorous measurements and testing multiple exquisitely preserved vintage microphones, as well as modern high-end classics. The accuracy of the mic emulations preserves the frequency response and color of the originals.

  The Edge Solo has been designed for efficiency and versatility. The Modeling Engine saves studio time and maintains creative dynamic in fast-paced recording sessions. It lets users change microphone choice in real time with a click of a button without disturbing the recording process, or record clean and try out different models during the mixing phase.

  The Edge Solo works with any preamp with 48V phantom power. Pairing it with the Discrete preamps of Antelope's Synergy Core interfaces unlocks the full potential of the real-time microphone emulations - when processed by the onboard Synergy Core platform, tracking happens with imperceptible latency and zero CPU load. The microphone emulations are available in VST, AU and AAX plugin formats for all popular DAWs under both macOS and Windows, regardless of the audio interface being used. An iLok 2 or 3 USB dongle is required.
specs: |-
  - Capsule: single capsule, single-sided
  - Diaphragm: large condenser, 6-micron gold-sputtered membrane
  - Diaphragm diameter: 34 mm
  - Polar pattern: cardioid
  - Frequency response: 20 Hz - 20 kHz
  - Self-noise: 19 dB(A)
  - Signal-to-noise ratio: 75 dB(A)
  - Sensitivity: -35 dB | 18 mV/Pa (-1 to +3 dB)
  - THD+N: -116 dB
  - Output impedance: 50 Ohms @ 1 kHz
  - Power: 48V DC phantom power
  - Output connector: 3-pin male XLR
  - Output channels: mono (single)
  - Dimensions: 5.3" x 2.04" (134 mm x 52 mm)
  - Weight: 0.705 lbs (320 g)
  - Mount: hard mount
  - Number of emulations: 18
  - Emulations: Tokyo 800T, Berlin 47FT, Berlin 47TU, Berlin 49T, Berlin 57, Berlin 67, Berlin 87, Berlin K86, Berlin M103, Berlin M251, Berlin V563, Vienna 12, Vienna 414, Vienna 112, Illinois 7B, Minnesota 20, Illinois 57, Hamburg 441
  - Emulation plugin formats: VST, AU, AAX (macOS and Windows; iLok 2 or 3 USB dongle required)
