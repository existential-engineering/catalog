description: Mix it, Send It Flexible and performance-focused stereo mixer to
  blend and send audio with a dedicated Aux bus. Create feedback chains, cue
  sounds, or mix dub-style.
details: |-
  The Aux Mix 1U is a 3-channel stereo mixer module with a stereo Aux send bus. The Aux Mix 1U provides routing options for Send FX, Parallel Processing, Feedback Mixing, and more. It is designed for audio signals only (not for mixing CV).

  Each channel has a dedicated pair of inputs for stereo audio sources. The left channel inputs are normalled to the right for mono audio sources. All 3 channels feature a precise Level attenuator, a Mute switch, and an LED input activity level indicator. The three stereo channels are mixed & summed to the Main Outputs, where they can be patched out to a wider Eurorack system or external pro-audio equipment. The output stage features soft-clipping diodes for smoother saturation when signal levels are very high.

  In addition to the main mix controls, channels 1 & 2 also feature an Aux Level attenuator with a Pre / Post switch. These can be used to create an independent Aux Mix which is routed to another pair of outputs, separate from the Main mix. The Aux output stage also features the same soft-clipping diodes as the Main output. Aux Mix 1U has four 3-pin connectors on the rear side for directly routing audio between other Intellijel Cases & Modules, without the need for patching cables. Connections include Aux In, Aux Out, Chain In & Chain Out. This also allows you to chain multiple Aux Mix 1U modules together to form even bigger mix chains.

  It is AC-coupled, and uses audio-grade, logarithmic attenuators for a smooth, even response across the entire volume range.
specs: |-
  - Width: 32HP
  - Depth: 42mm
  - Power: 48mA @ +12V, 42mA @ -12V
  - AC-coupled with audio-grade logarithmic attenuators
  - Soft-clipping diodes on Main and Aux output buses
