description: The BAE 1272 Module is a microphone preamplifier built to original
  Neve console specifications, designed to fit directly into vintage Neve 80
  Series console frames. Hand-wired using discrete electronics with Carnhill and
  Jensen transformers, it delivers the classic Neve character in a console
  module format.
details: |-
  The 1272 Module made by BAE is built to specifications to be used in original Neve® consoles.

  BAE are manufacturers of high end microphone preamp/equalizers faithful to vintage designs of the seventies and before. With a penchant for high quality transformers like Carnhill (St Ives) and Jensen, everything is as close to the vintage philosophy as possible. Everything is hand-wired/soldered using discrete electronics.
specs: |-
  - Frequency Response: ±0.5dB, 20Hz–20kHz
  - Mic Input Impedance: 1200 or 300 ohms
  - Output Impedance: 50 ohms
  - CMRR: 100dB min @ 60Hz
  - Max Output Level: +27.4 dBu @ 600Ω
  - Power Requirements: 80mA @ 24VDC
  - Gain: 39dB
  - Equivalent Input Noise: Better than -85dBu
  - Weight: 4.25 lbs / 1.93 kg
  - Dimensions: 5.25"W × 1.8"L × 8.5"D
