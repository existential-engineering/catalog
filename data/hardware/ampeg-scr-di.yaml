url: "https://ampeg.com/products/pedals/scr-di.html"
description: "The Ampeg SCR-DI Bass DI with Scrambler Bass Overdrive is a
  full-featured Ampeg preamp that delivers a wide range of tones. Classic Ampeg
  EQ with Ultra-Hi and Ultra-Lo filters combines with the distinctive grind of
  the Scrambler overdrive, plus extensive I/O for stage and studio."
details: |-
  Classic Ampeg tone stack offers everything from plush B-15 to aggressive SVT grit.

  Built-in Scrambler Bass Overdrive emulates the character of an SVT pushed hard.

  All-metal switches and die-cast zinc construction for greater durability.

  Dedicated balanced XLR line out with ground lift, plus Phones output and Aux input for practice.
specs: |-
  - Classic Ampeg tone stack with Ultra-Hi and Ultra-Lo filters
  - Built-in Scrambler Bass Overdrive
  - Balanced XLR line out with ground lift
  - Headphone output and Aux input
  - Scrambler Bass Overdrive and preamp can be engaged simultaneously
  - All-metal switches
  - Die-cast zinc construction
