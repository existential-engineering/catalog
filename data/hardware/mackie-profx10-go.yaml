name: ProFX10 GO
manufacturer: mackie
primaryCategory: mixer
categories:
  - audio-interface
url: https://mackie.com/en/products/mixers/profxv3-series/profx10_go.html
description: "Professional analog mixer and USB-C audio interface with a
  rechargeable, swappable battery for up to 8 hours of operation."
details: |-
  The ProFX10 GO is a portable professional mixer that combines analog mixing with digital features. A swappable GB-10 rechargeable battery delivers up to 8 hours of operation for remote gigs and outdoor events.

  The unit integrates Onyx mic preamps with up to 60 dB of gain, Hi-Z switches on channels 1-2 for direct instrument input, 100 Hz low-cut filters, 3-band EQ on all channels, and one-knob compression on channels 1-2.

  A GigFX+ effects engine with LCD display provides preset editing, and bi-directional Bluetooth with Mix Minus enables wireless audio in and out. A 24-bit/192 kHz USB-C audio interface (2x4) offers three recording modes: Standard, Loopback, and Interface.

  Housed in a solid steel chassis with tough ABS side protection, the ProFX10 GO weighs 5.9 lb / 2.7 kg with battery installed.
specs: |-
  - Swappable, rechargeable GB-10 battery (up to 8 hours per charge)
  - 4 Onyx mic preamps with up to 60 dB gain
  - Hi-Z switches on channels 1-2 for instrument input
  - 100 Hz low-cut filters
  - 3-band EQ on all channels
  - One-knob compression on channels 1-2
  - Bi-directional Bluetooth with Mix Minus
  - GigFX+ effects engine with LCD display for preset editing
  - 24-bit/192 kHz USB-C audio interface (2x4)
  - Three USB recording modes: Standard, Loopback, Interface
  - Solid steel chassis with tough ABS side protection
  - Weight: 5.9 lb / 2.7 kg (with battery)
  - Dimensions: 2.75 x 10.6 x 11.5 in / 70 x 270 x 292 mm
