description: Mackie ProFX10 GO is a professional analog mixer and USB-C audio interface that can run on a rechargeable, swappable battery for up to 8 hours, so you're always ready to mix on the GO.
details: |-
  Mackie ProFX10 GO is a professional analog mixer and USB-C audio interface that can run on a rechargeable, swappable battery for up to 8 hours, so you are always ready to mix on the GO.

  ProFX10 GO gives you up to 8 hours of professional mixing and recording on a single charge with the included GB-10 battery. The battery recharges whenever the mixer is plugged into power, or it can be recharged outside the unit, and a spare can be swapped in for double the battery life.

  Connect a phone or tablet to the dedicated bi-directional Bluetooth channel to stream songs, perform over backing tracks or broadcast a gig online. Mix Minus means a caller taken through the mixer does not hear themselves.

  Enhance your sound using high-resolution GigFX+ effects including reverbs, delays and choruses, editing and saving your own presets on the fly via the full-size LCD screen. Three USB-C recording modes cover the full mix with effects, loopback of computer audio, and a dry channel 1-2 interface mode.

  Four award-winning Onyx preamps provide up to 60 dB of gain with 100 Hz low-cut filters and 48V phantom power, alongside three-band EQ and one-knob compression, plus the inputs and outputs needed for mics, instruments, stereo playback devices, loudspeakers and headphones.
specs: |-
  - 10-channel battery-powered analog mixer and USB-C audio interface
  - Includes GB-10 rechargeable lithium-ion battery (11.1V, 5200 mAh, 57.72 Wh) for up to 8 hours of mixing and recording
  - 4 Onyx mic preamps with up to 60 dB of gain on channels 1-4
  - Hi-Z switches on channels 1 and 2 for direct connection of instruments
  - 100 Hz low-cut filters and 48V phantom power
  - 3-band EQ on all channels
  - One-knob compression on channels 1 and 2
  - High-resolution GigFX+ effects engine includes reverbs, delays, choruses and more
  - Full-color LCD display for editing and saving effects presets
  - 24-bit / 192 kHz 2x4 USB-C audio interface
  - Three USB recording modes: Standard (include FX), Loopback (include computer audio) and Interface (channels 1-2 dry)
  - Dedicated USB 1-2 playback with blend control, separate USB 3-4 return on channel 7/8
  - Bi-directional Bluetooth with Mix Minus for taking phone calls through the mixer
  - Waveform OEM recording software included
  - Solid steel chassis with ABS side protection
  - 12V 2A external wall-mount power adapter
  - 2.75 x 10.6 x 11.5 in / 70 x 270 x 292 mm, 5.9 lb / 2.7 kg with battery
