id: RJwEThpmw3QforMB-H0zO
name: ABM NEO C210
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-neo-c210
description: A lightweight 2x10 inch bass combo from Ashdown's ABM NEO range,
  pairing the iconic ABM preamp with a special 400-watt lightweight power
  section for pure Ashdown ABM tone in a compact package. Hand-made in the UK
  with Ashdown high-frequency horns and custom Italian SICA Neodymium drivers,
  sized to match a NEO-range extension cab for easy rig expansion.
details: |-
  The ABM NEO C210 is a lightweight 2x10 inch bass combo from the ABM NEO range, coupling the iconic ABM preamp with a 400-watt lightweight power section for pure ABM tone. Hand-made in the UK, it is fitted with an Ashdown high-frequency horn and custom Italian SICA Neodymium drivers, and is sized to be matched with a NEO-range extension cabinet. Connectivity includes a switchable High/Low instrument input, a line input, a line output, a balanced DI output, a tuner output, and an FX loop, with a 12AX7 preamp tube.
specs: |-
  - Power Output: 400 Watts
  - Speaker Configuration: 2 x 10
  - Speaker Outputs: Speakon/Jack
  - Minimum Impedance: 4 Ohms
  - Frequency Response: -3dB at 17Hz and 30kHz
  - High Instrument Input: 3.9M Ohms
  - Low Instrument Input: 10k Ohms
  - Line Input: 22k Ohms
  - Line Output: 10k Ohms
  - DI Output: 600 Ohms balanced
  - Tuner Output: 1k Ohms
  - Effects Send: 22k Ohms
  - Effects Return: 22k Ohms, 0dBu
  - Pre-amp Tubes: 1 x 12AX7
  - Dimensions (H x W x D): 630 x 465 x 330 mm
  - Weight: 26.6 kg
