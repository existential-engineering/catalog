description: >-
  Ambika is a six-voice hybrid synthesizer from Mutable Instruments that combines digital
  oscillators with analog filters. Each voice features two digital oscillators with 36
  algorithms and wavetables paired with a true 4-pole analog filter, and the six voices
  can be configured as a polysynth, an ensemble of independent monosynths, or anything in
  between. Released as a DIY open-source project under a Creative Commons license, Ambika
  has since been discontinued by the manufacturer.
details: |-
  Ambika was designed by Olivier Gillet of Mutable Instruments as part of the company's line of open-source, DIY-friendly instruments. Released in 2012, it represented the flagship polyphonic synthesizer in the Mutable Instruments lineup, building on the heritage of the monophonic Shruthi. The instrument's Creative Commons license means that anyone with the design files and components can build one themselves, though finding pre-built units on the secondhand market has become increasingly difficult and expensive.

  The hybrid sound engine pairs two digital oscillators per voice with an analog filter stage. The oscillators offer 36 algorithms and wavetables including pulse, variable pulse, sawtooth, sine, square, super saw, triangle, wavetable, and white noise options. A configurable sub-oscillator can also function as a transient generator, and pre-filter overdrive and bit-crushing effects add further sonic variety. Depending on the voicecard type installed, each voice includes either a 4-pole low-pass analog filter or a 2-pole multimode filter with VCA.

  Modulation capabilities are extensive, with three ADSR envelopes, three patch-level LFOs, and one voice-level LFO per voice. A 14-slot modulation matrix with four modulation modifiers enables complex sound design possibilities. The built-in arpeggiator supports up, down, random, and combination modes, while a 32-step note sequencer and two step sequencers per part provide onboard performance and composition tools.

  The front panel interface features a 2x40 character LCD with a clickable encoder for navigation, eight potentiometers arranged in two rows for parameter control, and LEDs indicating active pages and part status. Patches, programs, multis, and undo/redo history are stored on an SD card. The rear panel provides MIDI In and Out, a mix line output, six individual voice outputs, and an AC power jack.
specs: |-
  - Polyphony: 6 voices
  - Multitimbral: 6 parts
  - Oscillators: 2 digital oscillators per voice
  - Oscillator algorithms: 36 wavetables and algorithms
  - Waveforms: Pulse, variable pulse, saw down, saw up, sine, square, super saw, triangle, wavetable, white noise
  - Sub-oscillator: Configurable, can function as transient generator
  - Filter: 4-pole analog low-pass (24dB/oct) or 2-pole multimode depending on voicecard
  - Filter modes: Low-pass, high-pass, band-pass with resonance
  - Envelopes: 3 ADSR per voice
  - LFOs: 3 patch-level plus 1 voice-level per voice
  - LFO waveforms: Sample & hold, saw up, saw down, sine, square, triangle
  - Modulation matrix: 14 slots with 4 modulation modifiers
  - Effects: Pre-filter overdrive, bit-crushing
  - Arpeggiator: Up, down, random, and combination modes
  - Sequencer: 32-step note sequencer plus 2 step sequencers per part
  - Display: 2x40 character LCD
  - Controls: Clickable encoder, 8 potentiometers, 8 switches
  - Storage: SD card for patches, programs, multis, and undo/redo
  - MIDI: In and Out
  - Outputs: Mix line output plus 6 individual voice outputs
  - Power: AC power jack
  - License: Creative Commons (open-source DIY)
