details: |-
  "This is a genuine Hall of Famer, and

  an easy pick for TAS 2021 Budget Product of the Year."

  In Issue 107, JV (Jonathan Valin - the absolute sound) selected Magnepan's tall, skinny, three-way, full range, quasi-ribbon, dipole MG 1.7 floorstander as one of his favorite loudspeakers of the last 70 years. High in resolution, low in distortion, with enough bass and treble (of superlatively high quality) to satisfy anyone save a headbanger, and a midrange that reproduces well-recorded voices and acoustic instruments with jaw-dropping realism, it is one of those "sweet-spot" wonders that pops up every decade or two. The 1.7 gave you a generous taste of everything its bigger and more expensive Maggie brothers were capable of for a fraction of what you'd pay for the same wonderment in a top-line dynamic speaker. In his review of Maggie's latest version of this classic, the 1.7i, long time TAS reviewer John Nork (who purchased the review pair) was in complete agreement. John Nork 1.7i review

