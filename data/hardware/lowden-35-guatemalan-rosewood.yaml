details: |-
  Guatemalan rosewood is a rare, visually stunning tonewood known for its deep resonance and rich harmonic complexity. Its striking grain and tonal warmth elevate every note, making it a favourite among discerning players and collectors alike.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Guatemalan Rosewood back and sides can be paired with Red Cedar, Alpine Spruce, or Sinker Redwood soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Guatemalan Rosewood
  - Soundboard options: Red Cedar, Alpine Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
