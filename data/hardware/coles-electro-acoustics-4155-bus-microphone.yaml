details: |-
  The Coles 4155 Bus Microphone is a specialized microphone designed for installation
  in buses and other public transport vehicles. Its construction emphasizes durability
  and ruggedness to withstand the harsh conditions of vehicular environments.

  The microphone features a very rugged case with a sintered disk, providing both
  physical protection and acoustic filtering suited to the installation environment.

  A key feature of the 4155 is its compatibility with different impedance capsules,
  allowing it to be adapted for various applications and system requirements.
