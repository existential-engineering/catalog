description: Limited run of 100 individually serialized units reproducing the
  original 1971 Saul Walker 550A design. Hand-wired with a reproduction original
  printed circuit board and 50th Anniversary faceplate.
details: "50th Anniversary Edition of the API 550A. Limited to 100 individually
  serialized units. Hand assembly with reproduction of the original 1971 PCB.
  50th Anniversary faceplate design. Three dual-concentric rotary switches: LF
  (50–400 Hz), MF (0.4–5 kHz), HF (5–15 kHz). 5 frequency centers per band.
  Shelf/peak switching on HF and LF bands. Switchable band-pass filter.
  Proportional Q circuitry."
specs: |-
  - Max output: +30 dBu
  - Output impedance: <75 Ω (transformer balanced)
  - Frequency response: ±0.5 dB (20 Hz–50 kHz)
  - S/N ratio: 110 dB
  - Boost/cut: ±12 dB (stepped)
  - Format: 500-series
  - Dimensions: 1.5″ × 5.25″ × 7″
  - Weight: 2.1 lb
