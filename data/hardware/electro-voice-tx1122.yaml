details: >-
  The TX1122 is a 12-inch full-range passive loudspeaker in Electro-Voice's Tour
  X (TX) series, designed to deliver high-quality sound at high levels with
  excellent pattern control for short-to-medium throw applications. It pairs a
  low-distortion SMX2121 12-inch woofer (using EV's fully symmetric drive
  geometry) with a 1.25-inch DH3/2010A titanium HF compression driver behind a
  90 degree H x 50 degree V constant-directivity horn, crossed over at 1.6 kHz
  through an advanced 4th-order network with HF protection.


  The lightweight trapezoidal enclosure is built from plywood and MDF with a
  black EVCoat finish for durability on the road. It includes a pole-mount
  socket for use with a subwoofer or speaker stand, plus six M10 threaded
  suspension points for permanent installation and rigging.


  As a passive cabinet, the TX1122 requires external amplification. Two
  parallel-wired Neutrik NL4 Speakon connectors on the rear panel act as the
  input and a loop-through to a second cabinet. Rated for 500 W continuous /
  2000 W peak with 97 dB sensitivity and 130 dB maximum SPL.
specs: |-
  - Configuration: 2-way passive loudspeaker
  - LF driver: 12-inch SMX2121 with fully symmetric drive
  - HF driver: 1.25-inch DH3/2010A titanium compression driver
  - Horn: Constant-directivity 90 degree H x 50 degree V
  - Crossover: Advanced 4th-order with HF protection
  - Crossover frequency: 1,600 Hz
  - Frequency response (-3 dB): 70 Hz - 20 kHz
  - Frequency range (-10 dB): 45 Hz - 20 kHz
  - Recommended high-pass frequency: 45 Hz
  - Sensitivity (1 W / 1 m): 97 dB
  - Maximum SPL (1 m, calculated): 132 dB
  - Maximum SPL (specification sheet): 130 dB
  - Power handling: 500 W continuous / 2000 W peak
  - Nominal impedance: 8 ohms (6.4 ohms minimum)
  - Coverage pattern (-6 dB): 90 degrees H x 50 degrees V
  - Connectors: Parallel Neutrik NL4 Speakon (input + loop-through)
  - Enclosure: Plywood and MDF with EVCoat
  - Finish: Black EVCoat
  - Suspension: Six M10 threaded inserts, flying-capable
  - Pole mount for use with subwoofer or stand
  - Rotatable horn: No
  - Dimensions (H x W x D): 440 x 364 x 573 mm
  - Net weight: 19.8 kg
