details: |-
  The ICON is a long-standing Kiesel bass that has remained the same since its introduction in 2006.

  The body features a deeper body cutaway for improved comfort compared to previous Carvin Guitars basses.

  Integral specs include a neck-through construction, the signature "Icon" headstock created in tandem with the body shape, a 14" radius, and a classic 34" scale length.
specs: |-
  - Construction: neck-through
  - Scale length: 34"
  - Frets: 24 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with two high-strength carbon-fiber reinforcing rods and fully-adjustable dual action truss rod
  - Body: alder
  - Pickups: Kiesel Radium KRH Radius humbuckers
  - Electronics: 18V active/passive electronics, master volume/push-pull active-passive switch, pickup blend, stacked concentric bass/treble
  - Bridge options: Hipshot A-Style bridge at .748" (19mm) or .64" (16.25mm) spacing
  - Tuners: Kiesel premium tuners, 20:1 ratio
  - Headstock: Icon headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut, 0.77" thick at the 1st fret, 0.88" thick at the 12th fret
  - Dimensions: 45.375" to 45.625" long, 1.625" to 1.7" thick, 12.5" to 12.75" wide depending on configuration
  - Weight: 9 to 9.5 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts, configured to order; the gallery shows 4-string and 6-string builds
  - Built to order with a choice of body, top, fingerboard and finish options
