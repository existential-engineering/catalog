description: A 40-watt, 5881 powered, dual channel hand-wired head based on a
  modified JTM 45, voiced for the British tone Friedman is known for. Both
  channels share the same circuit, from sparkling cleans through vintage crunch.
details: |-
  Friedman's Dirty Shirley head was designed for guitarists who wanted a vintage classic rock tone inspired by British tube amps from the 1960s and 1970s. The Twin Sister is two Dirty Shirleys in one chassis, a 40-watt, 5881 powered, dual channel head based on a modified JTM 45 that still delivers the signature British tone Friedman has become known for.

  The amp features two identical channels that give everything from sparkling cleans to vintage crunch and beyond. Extremely versatile, the Twin Sister can produce many styles of music from blues to rock and country by just adjusting the structure, gain and master controls.

  The Twin Sister carries the finishing and solid construction expected of a Friedman amplifier. It is designed to take pedals and loves boosts, overdrives, phasers, flangers, tremolos and wahs, while the ultra-transparent series effects loop handles time-based effects pedals and rack units.
specs: |-
  - 40 watt all tube head
  - Hand-wired in the USA
  - Two channels, identical circuits
  - 2 x 5881 power tubes
  - 5 x 12AX7 preamp tubes
  - Gain, Master, Bass, Middle and Treble per channel
  - Bright switch and 3 position gain switch per channel
  - Three position gain structure switch
  - Global Presence and Deep knobs
  - Ultra transparent series effects loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Dimensions: 8.5 in (d) x 24 in (w) x 9.5 in (h)
  - Weight: 32 lbs
  - Limited lifetime warranty
