description: The DN360-P2H-FB is the most fully isolated configuration of the
  DN360 dual 30-band graphic equaliser platform, with balanced transformer
  stages on both inputs and outputs and XLR connectors configured pin 2 hot.
  Full transformer isolation provides the ground-loop immunity and common-mode
  rejection that broadcast facilities and complex installations demand.
details: |-
  Balanced transformer stages sit on both inputs and outputs, with XLR connectors configured pin 2 hot to match modern international wiring standards. Full transformer isolation provides gold-standard ground-loop immunity and common-mode rejection for broadcast facilities and complex installations.

  The signal-processing engine is the reference DN360 platform: dual 30-band Proportional-Q analogue graphic equalisation. The characteristic is wide and musical at small fader movements and surgically narrow as cuts and boosts increase, which is what made the DN-series the touring industry's reference.

  An 18 dB/octave low-cut filter per channel handles subsonic rejection.

  The 3U rackmount chassis carries 30 mm oil-damped precision faders with centre detents, channel bypass switches, graphic EQ scale selection and power-off bypass relays.

  The DN360-P2H-FB is obsolete but remains in active service worldwide, with legacy support and documentation continuing through Music Tribe Care.
specs: |-
  - Dual channel, 30 band 1/3 octave graphic equalisation per channel
  - Proportional-Q filter response
  - Transformer-balanced inputs and outputs
  - Low-cut filter: 18 dB/octave, one per channel
  - 30 mm oil-damped precision faders with centre detents
  - Channel bypass switches and graphic EQ scale selection
  - Power-off bypass relays
  - XLR connectors wired pin 2 hot
  - 3U rackmount chassis
