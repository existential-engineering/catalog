description: The ADAM Audio A44H offers a low-profile alternative to the A
  Series A7V while delivering similar performance characteristics.
details: |-
  The ADAM Audio A44H is a horizontally oriented active nearfield studio monitor designed as a low-profile alternative to the A7V while delivering similar performance characteristics. With a 19-inch width, it fits standard rack shelves and can be mounted above or below displays, making it especially well-suited as a center channel speaker in immersive audio configurations.

  The cabinet houses dual 4-inch long-throw Multi-Layer Mineral woofers in a dual front-ported bass reflex design, paired with an X-ART tweeter mounted in a rotatable HPS waveguide for flexible imaging and consistent off-axis response. Frequency response extends from 49 Hz to 41 kHz at -3 dB, with a maximum peak SPL of 103 dB at one meter.

  Hybrid amplification provides 130 W of total peak power: a PWM amplifier drives the woofers (110 W peak / 90 W RMS), and a Class A/B amplifier powers the tweeter (20 W peak / 15 W RMS). The crossover is set at 2.4 kHz and the system is tuned via on-board DSP.

  The A44H integrates with ADAM Audio's A Control software over Ethernet (OCA protocol) for remote configuration, voicing selection (Pure or UNR), and per-band room adaptation (Bass, Desk, Presence, Treble). It also supports Sonarworks SoundID Reference for room correction.

  Connectivity includes a balanced XLR input (9 kOhm) and an unbalanced RCA input (3.3 kOhm), with a maximum input level of +19 dBu. The monitor draws up to 220 W and idles at 10 W, with a 3.5 W sleep mode, and ships with a five-year standard warranty.
specs: |-
  - Dual 4-inch Multi-Layer Mineral long-throw woofers
  - X-ART tweeter with rotatable HPS waveguide
  - Frequency response: 49 Hz – 41 kHz (-3 dB)
  - Frequency response: 46 Hz – 45 kHz (-6 dB)
  - Max peak SPL at 1 m: 103 dB SPL (sine bursts)
  - Crossover frequency: 2.4 kHz
  - Total peak amplifier power: 130 W
  - Woofer amp: PWM, 110 W peak / 90 W RMS
  - Tweeter amp: Class A/B, 20 W peak / 15 W RMS
  - Dual front-ported bass reflex cabinet
  - Input impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA)
  - Max input level: +19 dBu
  - Ethernet (RJ45) control via OCA protocol
  - DSP tuning via A Control software
  - Room adaptation: Bass, Desk, Presence, Treble
  - Two voicings: Pure and UNR
  - Sonarworks SoundID Reference integration
  - Dimensions (H×W×D): 135 × 432 × 350 mm (5.4″ × 17″ × 13.8″)
  - Weight: 9.7 kg (21 lb 6 oz)
  - Power: 220 W max / 10 W idle / 3.5 W sleep
  - 5-year standard warranty
