description: The ADAM Audio A44H offers a low-profile alternative to the A Series A7V while delivering similar performance characteristics.
details: |-
  With a 19-inch width, the horizontally oriented A44H can sit on a standard rack shelf or be mounted above or below a display. The completely new design also enables the A44H to serve as a center speaker in immersive and 3D speaker configurations.

  Dual 4-inch long-throw woofers and the X-ART tweeter deliver a wide frequency range, while onboard DSP-based tuning capabilities enable you to tweak the sound easily.

  The DSP-based functionality of all A Series monitors can be controlled remotely and in real time over ethernet using A Control.

  Made from a new glass fiber polymer compound, the HPS waveguide enables the X-ART tweeter to disperse sound in space with controlled consistency.

  ADAM Audio is proud to partner with Sonarworks on an automated room correction solution that runs directly on the DSP of A Series monitors.
specs: |-
  - German Handmade Precision X-ART Tweeter with rotatable HPS waveguide
  - 2 x 4" Woofer (Multi-Layer Mineral)
  - Total Peak Amp. Power: 130 W
  - Frequency Response @ -3 dB: 49 Hz – 41 kHz
  - Frequency Response @ -6 dB: 46 Hz – 45 kHz
  - Crossover Frequencies: 2.4 kHz
  - Max. peak SPL per speaker at 1 m (sine bursts): 103 dB SPL
  - Max. peak SPL per speaker at 1 m (IEC-weighted noise): 110 dB SPL
  - Dolby DARDT max SPL in full space: 114 dB SPL
  - Woofer amplifier: PWM, 110 W peak (10% THD), 90 W RMS (1% THD)
  - Tweeter amplifier: Class A/B, 20 W peak (10% THD), 15 W RMS (1% THD)
  - Woofer basket diameter: 2 x 4", 1" (25 mm) voice coil, MLM cone material
  - X-ART tweeter: 4 inch² (2420 mm²) diaphragm area, 2" (56 mm) equivalent diameter, 4 to 1 velocity transform ratio, 0.17 g diaphragm weight
  - Waveguide dispersion: 120° horizontal, 70° vertical
  - Signal processing: 24-bit AD converter, 96 kHz internal sample rate
  - Delay range, resolution: 0 – 10 ms, 0.1 ms
  - Protection: independent peak and thermo limiters for each driver, and amplifier thermo limiters
  - Audio input connectors: XLR, RCA. Input impedance 9 kOhm / 3.3 kOhm. Max. input level +19 dBu
  - Networking connector: RJ45, Ethernet, OCA using standard IP data
  - Control software: A Control (Windows and MacOS available)
  - Room adaptation options: Backplate, Extended, Sonarworks SoundID Reference integration
  - Advanced room adaptation: 6 x PEQ, Level, Delay
  - Backplate controls: Level -12 dB to +12 dB, Input selection (balanced/unbalanced), Voicings (Pure, UNR)
  - Backplate room adaption: Bass +2/0/-2/-4 dB, Desk 0/-2/-4 dB, Presence +1/0/-1 dB, Treble +1.5/0/-1.5 dB
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m @ 0 dB level setting
  - Display: front panel multi-colour LED
  - Cabinet design: dual front ported. Vinyl wrapped MDF with painted MDF front panel
  - Mounting options: threaded inserts on the bottom of the cabinet (4 x M8)
  - Power consumption (max, idle, sleep): 220 W, 10 W, 3.5 W
  - AC input voltage: 100 – 240 V, 50/60 Hz. Power rating 300 W max.
  - Operating conditions: -10° C to +40° C (+14° F to +104° F); <75 % RH, non-condensing
  - Dimensions (H x W x D): 135 mm x 432 mm x 350 mm (5 3/8″ x 17″ x 13 3/4″)
  - Weight: 9.7 kg (21 lbs 6 oz)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: A44H loudspeaker, power cable, Quick Start Guide
