details: |-
  The JHS Pedals 3 Series Oil Can Delay is inspired by the vintage electrostatic delay apparatus invented by Ray Lubow and patented on June 30, 1959. These original units used oil in a tuna-can shaped drum moved by a belt mechanism, where a special disk apparatus wrote and read audio signal charges through rubber wiper heads, producing a unique echo with elements of vibrato and slapback delay.

  Ray Lubow licensed this technology to Fender, Gibson, and Rickenbacker before launching Morley in the late 1960s. Morley manufactured oil can delays until 1989. This modern pedal brings that distinctive character into a compact 3 Series form factor.

  The pedal was inspired by legendary guitarist Nels Cline of Wilco, who used a one-off JHS oil can delay prototype through the recording and touring process for Wilco's Cruel Country and Cousin albums after a chance conversation with JHS founder Josh Scott at Wilco's Solid Sound Festival in 2022.

  Controls include MIX (wet/dry blend), SPEED (delay time 100ms to 330ms), FEEDBACK (repeat amount), and a +/- toggle switching between light and heavy modulation intensity. Modulation speed is tied to the delay time setting, mirroring the warble characteristic of original oil can units.
