description: The Argon3LS is a floorstanding loudspeaker combining the midrange
  detail and speed of a monitor speaker with the added weight and bass extension
  of a floorstander, featuring Amphion's 5th generation waveguide technology.
details: |-
  The Argon3LS is a two-way floorstanding loudspeaker featuring a 1" titanium tweeter and a 6½" aluminum woofer with a passive radiator operating principle. The crossover point is set at 1600 Hz, allowing the waveguide-loaded tweeter to integrate seamlessly with the woofer for a coherent, time-aligned presentation.

  Amphion's 5th generation waveguide technology delivers even dispersion across the listening room, creating a wide sweet spot that allows listeners to enjoy the same sound quality throughout the space.

  The Argon3LS is designed for easy placement, maintaining clarity even when positioned near walls. Its low crossover point and controlled dispersion pattern minimize room boundary interactions.

  The loudspeaker is rated at 8 ohms impedance with an 85 dB sensitivity and is recommended for use with amplifiers delivering 50–150 watts. Its frequency response extends from 30 Hz to 25,000 Hz (-6dB).

  The Argon3LS is available in four finishes: Black, Walnut, Standard White, and Full White.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 85 dB
  - Frequency Response: 30–25,000 Hz (-6dB)
  - Power Recommendation: 50–150 W
  - Dimensions (H×W×D): 995×234×344 mm
  - Weight: 22.5 kg (49.6 lbs)
  - Manufacturing: Handmade in Finland
