description: The Klipsch R-30C is a center channel speaker from the Reference
  series featuring quad 3.5" spun-copper TCP woofers and a 1" aluminum LTS
  tweeter mated to a 90° × 90° Tractrix Horn. Its slim bass-reflex MDF cabinet
  is designed to complement flat-panel TVs while delivering clear dialogue.
details: |-
  The R-30C's all-new 90° × 90° Tractrix Horn delivers increased directivity control over a larger bandwidth of frequencies, resulting in improved high-frequency accuracy and a more precise sound stage.

  The exclusive Linear Travel Suspension (LTS) aluminum tweeter with Kapton suspension minimizes distortion for enhanced, detailed performances. Aluminum's light rigidity provides high efficiency and improved resolution.

  The quad spun-copper thermoformed crystalline polymer (TCP) woofers use trickle-down technology from Klipsch's Reference Premiere series. Steeper cone angling produces a smoother response with improved accuracy and transparency, while additional ribbing increases rigidity and reduces cone breakup at higher frequencies.

  A tapered array crossover improves dispersion for enhanced midrange definition — critical for dialogue-rich home theater material. Reinforced 3/4" MDF construction with an all-new bracing design reduces cabinet vibration. Hidden fasteners, edge-to-edge horn, and low-profile magnetic grilles give the speaker a polished appearance suited to today's flat-panel TVs.
