description: Create stunning soundscapes fast. Collider's twin-processor setup
  packs six delay and six reverb engines into one streamlined box. Combine any
  two effects into one beautiful texture.
details: |-
  Collider Delay + Reverb packs six delay and six reverb engines into one streamlined box using a twin-processor setup. Its two completely independent processors function as dual high-powered effects units in a single enclosure, letting users combine any two effects to create custom textures.

  The pedal provides stereo I/O for lush spatial effects and maintains an analog dry signal path alongside the digital processing.

  Control features include tap tempo (quarter notes, dotted eighths, triplets), freeze control, a knobs-lock switch for live protection, and MIDI clock sync. It stores 128 presets (8 accessible via pedal controls, 128 via MIDI).

  Universal Bypass offers true, buffered, and soft (with reverb trails) options. Collider supports 5-pin MIDI DIN, USB MIDI, and expression pedal control via the Neuro Hub.
specs: |-
  - Twin independent processors (6 delay + 6 reverb engines)
  - Combine any two effects into one texture
  - Stereo I/O with analog dry signal path
  - 128 presets (8 via pedal controls, 128 via MIDI)
  - Universal Bypass: true, buffered, or soft with reverb trails
  - Tap tempo (quarter, dotted eighth, triplet) and freeze control
  - Knobs-lock switch for live protection
  - MIDI clock sync
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 4.4" x 2.2"
  - Weight: 1 lb
  - Power consumption: 300 mA
