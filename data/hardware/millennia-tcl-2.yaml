description: The TCL-2 is a two-channel optical compressor and limiter in a 19
  inch rack chassis, with continuously adjustable threshold, ratio, attack and
  release plus stereo linking. Twin Topology selects between an all-triode 300 V
  vacuum tube signal path and an all-discrete J-FET solid state path.
details: |-
  The TCL-2 is a stereo optical compressor and limiter built on Millennia's Twin Topology, where a switch selects between an all-triode 300 V vacuum tube signal path and an all-discrete J-FET solid state signal path. Both topologies are entirely transformerless, high voltage and pure Class A, and the minimalist design puts only one active stage in the audio path.

  Threshold is continuously adjustable from infinity to +20 dBu, ratio from 1.4:1 to 30:1, attack from 2 to 100 ms and release from 100 ms to 3 seconds, with a continuously adjustable output gain control. A dynamics bypass is provided per channel and a stereo linking switch ties the two channels together. Large meters switch between VU and gain reduction.

  The unit is built for demanding professional applications, with ultra-premium components, gold relays, switches and tube sockets, and OFC audio wiring, and it is hand-crafted in Northern California. Detented, loggable controls are available as an option.
specs: |-
  - Threshold Range: Infinite to +20 dBu, continuously adjustable
  - Maximum Output Level: > +32 dBu
  - Maximum Input Level: +30 dBu
  - Output Gain Control: Continuously adjustable
  - Frequency Response: +0 / -3 dB, sub 5 Hz to 100 kHz
  - Noise (20 Hz to 22 kHz): -87 dBu (SS), -82 dBu (VT)
  - Attack Range: 2 ms to 100 ms, continuously adjustable
  - Release Range: 100 ms to 3.0 s, continuously adjustable
  - Compression Ratio Range: minimum 1.4 : 1, maximum 30 : 1, continuously adjustable
  - THD + Noise (20 Hz to 30 kHz): < 0.01%, typ 0.003% (VT or SS)
  - Common Mode Rejection Ratio (10 Hz to 20 kHz, 100 mV C.M.): > 50 dB, typ > 70 dB
  - Dynamics Bypass For Each Channel: Yes
  - Meter Gain Reduction Or VU Selection: Yes
  - Stereo Linking Switch: Yes
  - Input Impedance: 25k ohms
  - Minimum Output Load Impedance: 300 ohms (SS), 1k ohms (VT)
  - Recommended Minimum Load: 600 ohms (SS), 3k ohms (VT)
  - Output Impedance: < 5 ohms (SS), < 300 ohms (VT)
  - Twin Topology Compressor Amplifiers: switch in for pure Class-A discrete J-FETs, switch out for pure Class-A triode tubes
  - Power Consumption: 55 watts maximum
  - Power Requirements: Selectable 100-120, 200-240 V ac, 50/60 Hz
  - Dimensions/Shipping Weight: 19 in W x 12.5 in L x 3.5 in H, 26 lbs
