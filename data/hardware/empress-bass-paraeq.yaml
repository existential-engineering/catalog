details: |-
  The Bass ParaEq is described as the only parametric EQ pedal on the market built from the ground up for bass, delivering studio-grade tone shaping in a compact pedal format. It combines a dynamic low shelf, bass-tuned EQ bands, a Hi-Z input for upright players, and an auto-detecting balanced output.

  Three parametric bands each offer 15dB of boost or cut with variable, bass-tuned bandwidth, alongside high-pass, low shelf, high shelf, and low-pass filters. The EQ and boost can be switched together or independently, and the footswitchable boost provides up to 30dB of gain.

  Internally the pedal runs at 27V for high clean headroom. A selectable 10MOhm Hi-Z input accommodates piezo pickups, and the auto-detecting balanced output drives long cable runs (pairs with the Empress 1/4" TRS to male XLR adapter for XLR destinations).
specs: |-
  - Parametric EQ / boost pedal with linked or independent switching
  - 3 parametric bands with 15dB of boost/cut
  - Variable bass-tuned bandwidth per band
  - High-pass, low shelf, high shelf, and low-pass filters
  - Dynamic low shelf
  - 27V internal operation for high clean headroom
  - Footswitchable boost with up to 30dB of gain
  - Selectable Hi-Z 10MOhm input for piezo pickups
  - Auto-detecting balanced output for long cable runs
  - Buffered bypass
  - Input impedance 1MOhm or 10MOhm, output impedance 100Ohm
  - Frequency response 14Hz - 22kHz, THD < 0.1%, noise < -107dBu, headroom +30dBu
  - Power 9V DC (negative tip), 2.1mm barrel connector, 300mA draw
  - Dimensions 4.8" (L) x 2.6" (W) x 2.5" (H), weight 1 lb
