description: The Empress Bass ParaEq is a parametric EQ pedal built from the
  ground up for bass, offering studio-grade tone shaping in a compact pedal. It
  has three parametric bands with 15dB of boost or cut, a dynamic low shelf,
  high-pass and low-pass filters, a footswitchable boost up to 30dB, a
