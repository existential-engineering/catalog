description: Randy's Revenge is an all-analogue ring modulator featuring a pure
  sine wave oscillator and voltage-controlled low-pass filter, capable of
  trem/vibe effects at low frequencies through to bells and synth-like tones at
  higher settings.
details: |-
  Randy's Revenge is a compact all-analogue ring modulator with a pure sine wave
  VCO. The four-quadrant multiplier combines the input signal with the oscillator,
  producing sum and difference frequencies for rich trem/vibe effects at lower
  oscillator frequencies and bells, tuned intervals, and lo-fi synth tones at higher
  frequencies.

  A voltage-controlled low-pass filter after the multiplier tames the modulated
  signal. Full CV capabilities via a stereo 1/4" jack allow the oscillator and
  filter frequency to be voltage-controlled externally. The VCO output is also
  available as a standalone signal, turning the pedal into a stand-alone
  voltage-controlled oscillator. Internal micro-switches allow the CV jack to be
  configured for expression pedal or 2-channel CV operation.
specs: |-
  - True bypass
  - Dimensions: 4.7" x 3.8"
  - Input impedance: 1 MΩ
  - Output impedance: 1 kΩ
  - Power supply: 9–9.6 VDC centre-negative
  - Current draw: 85 mA
  - VCO range: LO (0.5 Hz–45 Hz), HI (18 Hz–2.4 kHz)
  - 1/4" mono input/output jacks
  - 1/4" stereo CV jack (expression pedal or 2-channel CV)
  - VCO output available as standalone signal
  - 2.1mm DC connector
  - No battery connection
  - Made in Hull, Québec
