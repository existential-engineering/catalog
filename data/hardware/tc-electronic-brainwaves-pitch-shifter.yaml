details: |-
  With its mind-bending range and kaleidoscopic pitch effects, the studio-grade BRAINWAVES PITCH SHIFTER is the perfect fusion of brains and brawn.This pink-clad pitch professor masters a variety of polyphonic effects including whammy and detune, plus a bunch of others – thanks to the dedicated TonePrint app.The award-winning MASH footswitch packs expression pedal performance into a pedalboard-friendly size.

  Download the free TonePrint app for Android and iPhone, choose the TonePrint you want to hear and beam it instantly from your phone through your guitar’s pickup into your TonePrint pedal. No cables needed! Learn more about beaming TonePrints.

  Music is the truest expression of self – that’s why it is your right to have your effect sound the way YOU want it to, no holds barred. With the TonePrint app you have full control over all effects parameters – so you can create your own signature TC sound. Get the TonePrint app now for PC/Mac

  Pitch-shifting mode expands your sound by adding up to two extra voices and letting you decide whether these voices go above or below the original signal.Just imagine – the solo from “Owner of a Lonely Heart” never sounded so huge.And since BRAINWAVES is polyphonic, you can use it on your standard-tuned guitar for a wide range of rock-solid sharp or flat tunings – without detuning the actual instrument.

  With separate voices pitched in either direction, the polyphonic algorithm lets you easily process pitch-shifted chords, riffs, and furious flurries of single-notes.  Since each voice is adjustable from unison to two octaves up or down (and anything in between), BRAINWAVES has more range than an interstellar battle cruiser. You can quickly create custom pitch settings via the free TonePrint app to find or expand your own pitch personality.
