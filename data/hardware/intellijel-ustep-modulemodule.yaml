details: |-
  The µStep ModuleModule is a variant of Intellijel's µStep dual trigger/gate sequencer built on a wide horizontal panel with banana jacks instead of the standard 4HP Eurorack format.

  It carries the same control set as the Eurorack µStep: eight step buttons with dual red/green LEDs, relative and absolute timing modes, memory store and recall, and 8x2/16x1 sequence configurations, alongside clock and reset inputs and A/B sequence outputs on banana jacks.
