description: An open-back 1x12 inch, 40 watt single channel all-valve combo
  voiced for vintage classic rock. It pairs the modified JTM 45 style Dirty
  Shirley circuit with a 16 ohm Celestion G12H Redback speaker.
details: |-
  Dave Friedman's Dirty Shirley open-back 1x12 inch combo was designed for guitarists that want a vintage classic rock tone inspired by British tube amps from the 60's and 70's.

  It is based on a modified JTM 45 but still delivers the signature high gain tone for which Friedman is best known. The Dirty Shirley is a 40-watt, 5881 powered, single channel amp that will give you that vintage crunch and also cleans up nicely by merely backing off the guitar's volume knob. Extremely versatile, it is capable of producing many styles of music from blues to rock and country by just adjusting the gain and master controls.

  This handcrafted in the USA combo utilizes tongue and groove Baltic Birch construction and houses a 16 ohm, 12 inch Celestion G12H Redback speaker that delivers the bass, mid response and signature sound expected from a Friedman amplifier.

  The Dirty Shirley 1x12 combo was designed to take pedals and loves boosts, ODs, phasers, flangers, tremolos and wahs, while the ultra-transparent series effects loop handles time-based effects pedals and rack units.
specs: |-
  - 40 watt all-tube 1x12 inch combo
  - One channel
  - Open back cabinet
  - High and low sensitivity inputs
  - 2 x 5881 power tubes
  - 3 x 12AX7 preamp tubes
  - Celestion 16 ohm 12 inch G12H Redback speaker
  - Controls: Gain, Master Volume, Bass, Middle, Treble and Presence
  - Ultra transparent series FX loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Handcrafted in the USA with tongue and groove Baltic Birch construction
  - Dimensions: 9.5 in (D) x 24.25 in (W) x 22 in (H)
  - Weight: 52 lbs
  - Limited lifetime warranty
