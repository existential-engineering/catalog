description: A fully analog Eurorack module inspired by early analog computers,
  capable of functioning as a VCO, LFO, ring modulator, logic gate processor,
  waveshaper, mixer, and many other utility and sound-generating functions.
details: |-
  Cosmos is a new kind of module that will help you to creating complex modulation, sounds, patterns with ease and will lead you to new sounds territories. Inspired by early analog computers, Cosmos is a unique, innovative, very flexible and fully analog module allowing it to be used as: VCO, LFO, Ring Mod, Polarizer, "VCA", "LPG", Phase Lock Loop, Cross-Modulation, Minimum, Maximum, Logic Gates, Waveshaper, Complex gate generator, Fuzz, Distorsion, Gate extractor, Trig extractor, Gate generator, Voltage generator, Trig Generator, comparator, window comparator, complex comparator, Half-Rectifier, Full-Rectifier, Inverter, Buffered Multiples, Mixer, Difference, Compressor, Sidechain, compressor, VC Clipper, VC Switch, Clock doubler, Envelope follower, and more. With its wide fields of application Cosmos can replace many modules but it will also bring new colors to your palette thanks to its unique character. This makes Cosmos the ideal module whether you have a small case or a big system. 100% analog and with an intuitive interface Cosmos is also very easy to use, no menu and button combo problems. Inspired by the past and crafted for the future, 100% analog Cosmos was not only thought to be the center of any system but also to blend perfectly with the rest of your case to form a consistent and coherent system. Cosmos was designed not only to be a swiss army knife module but also to push you to explore and you help create new sounds and explore sonic territories that were previously unattainable.
