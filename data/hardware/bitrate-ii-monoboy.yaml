details: |-
  Heavyocity and icebreaker audio are proud to introduce bitrate ii, the all-new
  semi-modular 8-bit drum machine for Reaktor. Bitrate ii uses multiple methods
  of retro digital synthesis and sampling to produce charismatic and nostalgic
  drum sounds. The included sound engines cover chipsounds, FM synthesis, lofi
  sampling, and glitchy circuit bending.

  On top of these unique sound engines, bitrate ii also offers a 5-track mixer
  and a master fx section that includes an analogue modelled eq, bus compressor,
  and speaker simulator for added lo-fi effect. The drums can be triggered via
  MIDI or from the internal sequencer.

  The sequencer provides two modulation sequences per drum, which can be routed
  to virtually any combination of sound parameters in any amount. Bitrate ii
  also comes bundled with the monoboy instrument, a melodic counterpart for
  bitrate ii. Monoboy uses similar sound engines, but in an interface more
  suited to melodic playing.

  The bitrate ii bundle ships with a total of 140 preset snapshots including a
  variety of sounds from kits and beats to synths and samples.

  Full software version, bitrate ii offers all playback and sound shaping
  functionality through the full reaktor 5.9 version. *reaktor player will only
  allow use of product in demo mode.
specs: |-
  - Semi-modular 8-bit drum machine

  - Retro digital synthesis

  - Sampling

  - 5 drum slots

  - 4 lo-fi digital sound engines: chip, fm, sampler, glitch

  - Audio input sampling

  - Built-in sequencer with 2 modulation sequences per drum

  - Per-track sequence length

  - 5-track mixer

  - Master fx section with analogue modelled eq, bus compressor, and speaker
  simulator

  - MIDI triggering

  - Internal sequencer triggering

  - 3 sound generator modes (monoboy)

  - Dm sampler (monoboy)

  - Arpeggiator (monoboy)

  - Voice controls (monoboy)

  - Bit delay effect (monoboy)

  - Native instruments reaktor 5.9 required

  - 140 preset snapshots included
