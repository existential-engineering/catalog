details: |-
  Released by French company Nozoid in 2017, the MMO-3 is a digital semi-modular synthesizer. Despite being monophonic, it is stereo and was designed to be mostly dedicated to atonal sound generation. The synth implements AM, FM, PM, and other types of modulation synthesis.

  Rather than limiting routing like typical FM synthesizers, all oscillators and LFOs are able to modulate all three of its oscillators. Modulation types include phase modulation, amplitude modulation, and a custom wave shaper technique. The wave shaper is particularly interesting as it allows for the amplification of oscillator amplitude prior to a wave-shaper stage.

  Nozoid incorporated a joystick in the design to make it easier to manipulate modulations. The unit has a total of 30 knobs divided into sections for OSC 1, OSC 2, OSC 3, LFO 1, LFO 2, LFO 3, MIX, and AUDIO. MIDI connections and audio connections are located directly on the front panel instead of at the back, with only the power supply input on the rear.
specs: |-
  - Polyphony: 1 voice
  - Multitimbral: 1 part
  - Oscillators: 3
  - Waveforms: Pulse Variable, Sine
  - LFO: 3 LFOs with Saw Up, Saw Down, Square, Triangle
  - VCA: 1 VCA with ADSR envelope
  - Control: MIDI In
