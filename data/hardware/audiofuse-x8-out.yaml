prices:
  - amount: 349
    currency: USD
description: >
  AudioFuse X8 OUT enhances the flexibility of your studio with 8 premium line- level outputs. Link to any ADAT-compatible audio interface and scale up monitoring, FX routing and synth control.
details: |-
  The audiofuse x8 out is an audio interface expander that adds 8 premium line-level outputs to existing adat-compatible audio interfaces. It enables complex signal routing and live setups by providing high-quality analog outputs for connecting to multiple external devices such as speakers, mixers, and outboard processors. The unit is designed for recording producers and sound engineers who require additional high-quality analog outputs to scale up their studio capabilities.

  The audiofuse x8 out features latest-generation da converters supporting up to 96 khz sampling rate, delivering exceptional audio fidelity with 120.5 db dynamic range and -106 db harmonic distortion. With balanced and unbalanced output impedance options (240 ω and 120 ω respectively), the unit ensures signal integrity and minimized noise for broad compatibility with various studio equipment. Dc-coupled outputs enable precise automation of synth parameters such as pitch, filter cutoff, and modulation directly from your DAW.

  The sync section provides multiple synchronization options including word clock, adat, and adat smux protocols with visual status indicators for monitoring the current sync source. The rear panel features two adat input ports supporting up to 8 channels of digital audio from compatible audio interfaces or digital mixers, with seamless integration across different sample rates. Word clock in with switchable hi-z and 75 ω impedance options ensures tight timing with other digital equipment and maintains audio fidelity across multiple connected devices.

  The audiofuse x8 out supports versatile routing applications including multi-point monitoring with additional speakers, surround sound speaker arrays for immersive audio projects, film and tv production, and broadcast/streaming setups. Users can send separate audio mixes to different broadcast or streaming devices for live streaming, internet radio, or video productions. The unit also enables outboard fx routing, allowing audio to be routed from the DAW to external processors such as compressors, equalizers, or reverb units and back into the DAW for hybrid digital and analog processing.

  Built with a robust half 1-u aluminum rack chassis and removable rack ears for flexible installation, the audiofuse x8 out is designed for both studio and live use. The unit includes the audiofuse creative suite for exploring and altering sound, and operates with a 15v 2a power supply that is included in the package.
specs: |-
  - 8 line-level analog outputs (1/4" trs)
  - Latest generation da converters up to 96 khz sampling rate
  - 120.5 db dynamic range
  - 240 ω balanced output impedance
  - 120 ω unbalanced output impedance
  - -106 db harmonic distortion
  - Dc-coupled outputs for CV control
  - Two adat input ports
  - Adat support: 1-8 channels at 44.1khz and 48 khz on single port
  - Adat support: 1-8 channels split across two ports at 88.2 khz and 96 khz
  - Smux protocol support
  - Word clock in with hi-z and 75 ω switchable impedance
  - Word clock, adat, and adat smux synchronization options
  - Sync status indicators
  - 15v 2a power supply (included)
  - Half 1-u aluminum rack chassis
  - Removable rack ears
  - Dimensions: 48 x 221 x 216 mm (1.89 x 8.70 x 8.50 in)
  - Weight: 1.38 kg (3.04 lb)
