description: Ultra-affordable analog semi-modular synthesizer built as an homage
  to the Prophet-5, with an authentic 3340 VCO, a classic 24 dB ladder filter, a
  32-step sequencer and an 8-pattern arpeggiator. A pure analog signal path and
  an 18 x 14 patch matrix take it from super-fat bass and lead tones out to
  experimental modulation.
details: |-
  The 1980s and '90s spawned a new “wave” of synth users including Michael Jackson, Madonna, Dr. Dre, Radiohead, film-maker John Carpenter and a host of others, all empowered by sounds emanating from the legendary Prophet-5. An ultra-affordable homage to that iconic synthesizer with all the features of the original and then some, such as a 32-step sequencer and arpeggiator, the CRAVE lets you conjure up virtually any sound with incredible finesse and ease. With its pure analog signal path, authentic 3340 VCO with pulse and sawtooth wave outputs, plus extremely flexible VCF and VCA filters, the CRAVE covers everything from classic tones to original sound design.

  True to the Original

  Great care has been taken in engineering the CRAVE, including the true to the original analog circuitry, legendary VCO, VCF and VCA designs, all of which combine to make it easy to recreate the classic sound performance. This highly-focused attention to detail is what gives the CRAVE its ultra-flexible sound shaping capability, which covers everything from super-fat bass and lead tones to stunning effects, and all the way out to the otherworldly sounds of your imagination.

  Authentic 3340 Oscillator

  CRAVE's 3340 Voltage Controlled Oscillator (VCO) provides your choice of pulse or reverse-sawtooth waveforms. When pulse is selected, the width can be varied using the Shape switch for narrow, squarewave or wide pulse, with a tuning range of ± one full octave. The VCO can be modulated via the envelope or the low frequency oscillator (LFO). Performance is further enhanced by the Mix control, which balances the levels of the internal VCO and noise generator.

  Versatile VCF

  The very heart of CRAVE's sound is its classic Moog 24 dB ladder filter, which lets you freely experiment with the Cutoff Frequency, Resonance and Modulation to dial in the perfect sound. CRAVE's filter Mode switch can be set to either Lo- or Hi-pass for selecting the range of your choice.

  Onboard Sequencer & Arpeggiator

  CRAVE's sequencer allows you to program up to 32 steps of notes and rests and save them as a pattern. You can record, save and recall up to 64 patterns, all of which can be stored in the 8 banks, each holding up to 8 patterns. Your sequences can be played either in Keyboard mode, where you create and store the pattern, or Step mode, which allows you to interact while composing a pattern. The onboard Arpeggiator features 8 patterns, used by playing a chord which the arpeggiator then sequences through your selected pattern.

  16-Note Poly Chain Ready

  While it is a monophonic instrument (one note at a time), CRAVE's 16-note Poly Chain function lets you combine multiple synthesizers for up to 16-voice polyphony, plus provides vastly improved reliability and stability over its 1970s and '80s predecessors.
specs: |-
  - Monophonic analog synthesizer with a pure analog signal path based on authentic VCO, VCF and VCA designs
  - Authentic 3340 Voltage Controlled Oscillator with pulse and reverse-sawtooth waveforms
  - Pulse width variable via the Shape switch: narrow, squarewave or wide pulse
  - VCO tuning range: plus or minus one full octave
  - VCO modulation from the envelope generator or the LFO
  - Mix control balances the levels of the internal VCO and the noise generator
  - Classic Moog 24 dB ladder filter with resonance
  - Switchable low pass / high pass filter mode, with cutoff, resonance and modulation controls
  - Envelope generator with Attack, Decay and Sustain controls plus a Sustain On/Off switch
  - Dedicated, fully analog LFO with triangle and square waveforms, adjustable rate and a rate LED
  - Noise generator, usable as a modulation source
  - Glide (portamento)
  - Pulse width modulation from the LFO, the envelope or manually
  - 32-step sequencer: notes and rests, 64 patterns across 8 banks of 8
  - Sequencer Keyboard mode and Step mode
  - Arpeggiator with 8 patterns
  - 16-voice Poly Chain for combining multiple synthesizers up to 16-voice polyphony
  - Semi-modular design with default routings requires no patching for immediate performance
  - 18 x 14 I/O patch matrix (18 inputs, 14 outputs)
  - 47 controls
  - External audio input for processing external sound sources
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
