details: |-
  To achieve Craig Chaquico's intended sound for his solo work, the CC275 mixes the best of an electric and acoustic guitar. The playability and compact size are strikingly similar to an electric guitar, while appearance and sound fall in line with an acoustic.

  One of the most notable features is the feedback resistance due to the slimmer body and minimal chambering over an acoustic body while maintaining a similar tonal property.

  The body is mahogany with a flamed maple top and natural body binding, built neck-through with a tung-oiled maple neck carrying a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability.

  An LR Baggs Element acoustic pickup feeds active electronics with master volume plus bass and treble boost/cut controls, and the guitar uses a standard acoustic bridge with a TUSQ saddle at a 25 inch scale over 24 stainless steel medium-jumbo frets.
specs: |-
  - Model designation CC275
  - Body: mahogany with flamed maple top, slimmer than an acoustic body with minimal chambering
  - Binding: natural body binding
  - Construction: neck-through
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius
  - Frets: 24 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length: 25 inch
  - Pickups: LR Baggs Element Acoustic
  - Electronics: active electronics with master volume, bass and treble boost/cut controls, powered by an internal battery rather than an external supply
  - Bridge: standard acoustic bridge with TUSQ saddle
  - Headstock: traditional headstock with flamed maple overlay
  - Inlays: Craig Chaquico signature inlays with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Neck width: 1.69 inch or 1.75 inch wide at the nut, 0.75 to 0.78 inch thick at the 1st fret, 0.85 to 0.88 inch thick at the 12th fret
  - Dimensions: 38.5 inch long, 1.875 inch thick, 14 inch wide
  - Weight: 7.8 lbs or 7.95 lbs depending on configuration
  - Strings: Elixir 1253E Light Bronze
