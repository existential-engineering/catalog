description: >-
  The Philips PMC 100 (Personal Media Composer) is a curious consumer-grade FM
  synthesizer from 1986 featuring a two-operator Yamaha FM chip, 25-key membrane
  keyboard, built-in sequencer with LCD notation display, and a cassette deck
  for saving compositions.
details: |-
  Created by the designer of the SFX peripherals for the Commodore 64, the PMC 100 is an unusual
  entry in the world of electronic instruments. Positioned as a "Personal Media Composer," it
  combined a Yamaha two-operator FM sound chip with composition tools aimed at making music
  creation accessible to hobbyists and beginners.

  The instrument offers a single playable monophonic voice alongside three non-playable
  accompaniment voices, drawing from a library of 100 preset melody waveforms and 15 preset
  accompaniment sounds. Thirteen built-in rhythm patterns with four accompaniment voice patterns
  provide backing track capabilities, while three preset demo tracks showcase the device's
  potential.

  Where the PMC 100 stands out is its step sequencer with an LCD stave notation display, allowing
  users to see their compositions rendered in standard musical notation. The tempo control is
  highly adjustable, and the built-in cassette deck enables saving and loading compositions to
  tape, a practical solution for an era before affordable digital storage.

  The 25-key membrane keyboard is functional rather than expressive, and the overall sound quality
  is limited by the two-operator FM architecture. Produced from 1986 to 1988, the PMC 100 remains
  an interesting artifact of the era when consumer electronics companies experimented with making
  music technology accessible to a mainstream audience.
specs: |-
  - Polyphony: 1 playable voice, 3 accompaniment voices
  - Synthesis: 2-operator FM (Yamaha chip)
  - Waveforms: 100 preset melody, 15 preset accompaniment
  - Rhythms: 13 accompaniment patterns
  - Sequencer: Step sequencer with LCD notation display
  - Keyboard: 25 membrane keys
  - Storage: Built-in cassette deck
  - Demo Songs: 3 preset
