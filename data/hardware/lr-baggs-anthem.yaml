details: |-
  In 2010, when the acoustic world was running to cold digital modeling, Baggs chose a different route. We believed a real mic would do a better job of being a mic. Leaning into pure analog physics, we bypassed the digital emulation idea to create our award-winning Anthem System. Our breakthrough moment came when we collaborated with Keith Sewell, who was searching for a mic solution while touring with Lyle Lovett to eliminate the harsh spikes of traditional pickups in their in-ears. Lloyd Baggs saw this as his challenge to create a hybrid mic-pickup system with a single, feather-weight preamp on the instrument and a new type of mic, packing it with more advanced circuitry than even our legendary Para DI. This system became a grand Anthem to those years of innovation.
specs: |-
  - Patented TRU-MIC technology with noise-cancelling microphone
  - Element undersaddle pickup blended with internal mic
  - Soundhole preamp with volume, mix, phase inversion, battery check, and mic trim controls
  - All-discrete, Class-A preamp with High-Graded FET input and preset crossover
  - Feedback-resistant design
  - Peel-and-stick adhesive mic installation
  - Steel-string and 12-string compatible
  - Single 9V battery powered
  - Requires professional installation
