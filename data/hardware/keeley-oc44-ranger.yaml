description: Germanium treble booster built with NOS vintage OC44 transistors,
  limited to 25 hand-signed and numbered units.
details: |-
  The OC44 Ranger is a germanium treble booster voiced for 1960s and 1970s tones. It is built with new old stock vintage OC44 transistors, in a run of 25 units that the page says will not be made again, each hand signed and numbered.

  It is a treble booster by design rather than an overdrive or distortion pedal, so the higher the note played, the more it is amplified and distorted, while bass notes stay tight and defined.

  The page notes the pedal is intended for use with an amplifier already breaking up, where cranking both the amp and the pedal yields a creamier, sustaining distortion. It suggests a dark-sounding amplifier as the best match.

  The page also records that 10 USD of each pedal sold was donated to the Wounded Warrior Project, and compares the circuit to the maker's Java Boost, which at the time of writing used Texas Instruments CV7003 transistors instead of OC44s.
specs: |-
  - Germanium treble booster circuit
  - Built with NOS vintage OC44 transistors
  - Limited run of 25 units, hand signed and numbered
  - Treble-weighted response: higher notes are boosted and distorted more than bass notes
