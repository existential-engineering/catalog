description: The LEHLE PARALLEL is a compact and versatile line mixer to meet
  demanding tonal standards. The PARALLEL M is the straight mixer version, which
  blends the signals from effect units into the original signal either before
  the amp or inside its effects loop.
details: |-
  The Parallel is a compact and versatile line mixer built to demanding tonal standards. It mixes the signals from effect units into the original signal, either before the amp or inserted into the amp's effects loop. Send and return levels are adjusted separately, and the level relative to the original signal is set with the mix control. The send and return paths can be operated both balanced and unbalanced.

  A wide dynamic range makes it possible to mix a 19 inch studio effect with its low-impedance line level into the guitar signal, or to insert effects pedals level-adjusted through the amp's effects loop.

  Thanks to JFET technology, the inputs handle both high-impedance signals from electric guitars, basses and acoustic instruments and low-impedance signals from keyboards and active instruments, with an output range extending from 20 to 100,000 Hz. To exploit the dynamics of tube amplifiers to the full, the input voltage is rectified from the power supply socket, then filtered, stabilized and doubled to 18 V.

  The Parallel M is the straight mixer version, without the true-bypass switch carried by the Parallel L. Both are fed from a 9 V (PP3) battery and protected by a housing of 1.5 mm thick steel sheet. Because only part of the signal is blended with the effect, the dry path is never routed entirely through the effects unit, and the Return jack can also take a second pickup so two pickup signals can be blended without signal loss.
specs: |-
  - Line mixer that blends effect signals into the original signal
  - Separate send and return level controls plus a mix control
  - Send and return paths usable balanced or unbalanced
  - JFET inputs handling both high-impedance instrument signals and low-impedance line signals
  - Buffer gain range from -15 dB to +15 dB
  - Frequency range 20 Hz to 100,000 Hz
  - Input voltage rectified, filtered, stabilized and doubled to 18 V internally
  - Fed from a 9 V (PP3) battery or an external power supply
  - Housing of 1.5 mm thick steel sheet
  - Straight mixer version, without the true-bypass switch of the Parallel L
