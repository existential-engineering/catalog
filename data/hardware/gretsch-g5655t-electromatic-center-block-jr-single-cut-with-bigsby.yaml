details: |-
  Live and loud, Electromatic Center Block Jr. guitars are designed for that pure and powerful Gretsch sound at high volume. Painstakingly crafted with essential Gretsch sound, style and playability, these all-new models deliver the fearless and electrifying authenticity that has set Gretsch apart for decades.

  The G5655T features a smaller-sized body with a chambered spruce center block for dynamic resonance, high gain power and lightweight comfort. A lower set maple neck offers effortless access and performance, while the 12"-radius laurel fingerboard with 22 medium jumbo frets delivers excellent playability.

  Its dual Black Top Broad'Tron humbucking pickups deliver bold, dynamic and articulate tone with enhanced sonic punch. The combination of individual pickup volume controls, master tone and master volume with treble bleed circuit allows you to flexibly harness this instrument's sonic power.
