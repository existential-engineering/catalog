details: |-
  The 19" K Constantinople Crash Ride features a new hammering technique, an additional pin lathe on the top and bottom, provides additional performance capabilities and a left side alternative, and is medium-thin in weight. These new features allow the cymbal to maintain the dark, expressive quality of the K Constantinople line sought by drummers the world over and incorporate even more overtones and nuances. The new pin lathe feature also gives the cymbal a vintage look similar to earlier K's from the 60's.
