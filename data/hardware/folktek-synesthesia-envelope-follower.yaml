id: VYQKIXjRo_mA_GWrsWytm
name: Synesthesia - Envelope Follower
manufacturer: folktek
primaryCategory: utility
categories:
  - modular
url: https://folktek.com/products/synesthesia
description: A Eurorack module with four independent envelope followers that
  convert incoming audio to control voltage, each with an audio through output
  and CV level control.
details: |-
  Synesthesia features four individual envelope followers that accept audio signal and convert to control voltage. For those new to envelope followers, they convert audio to control voltage based on the volume of the audio, creating a CV envelope that follows. These are incredibly useful tools and allow for a world of exploration and with the audio through, a source of CV signals that can be utilized as you see fit without taking anything from the audio mix. For anyone utilizing the Resonant Garden or Nano Garden, this is an especially wonderful tool for generating CV or even clock signals with the audio of the garden. Pairing with Listen is also highly recommended if you're interested in generating CV from acoustic sources. Each part has audio input, audio thru, CV output, level control to determine CV output and lights which signify both audio input signal and separate CV output signal (dimming when CV output level is lowered). FOUR INDIVIDUAL PARTS

  - Audio input (accepts most any range). - Audio thru: allows audio to output unaffected. Use in the chain without stealing any signals or having to multiply. - CV output: sends 0-5v based on incoming audio and attenuation of the CV
  - Level: determines the strength of the CV output
  - Input light: shows the incoming audio signal level/envelope
  - Output light: shows the CV output level/envelope

  SPECS

  +12V: 45mA -12V: 0mA +5V: 0mA
  10HP width
  25mm depth

  View on modular grid: https://www.modulargrid.net/e/folktek-synesthesia
