description: The 00-28 combines a comfortable Grand Concert body with spruce and
  rosewood tonewoods for rich, balanced sound. Handcrafted with a solid Sitka
  spruce top and East Indian rosewood back and sides, it is designed for
  fingerstyle, intimate strumming, and everything in between.
details: |-
  The Martin 00-28 is a member of the Standard Series and pairs the comfortable Grand Concert (00-14 Fret) body shape with classic spruce and East Indian rosewood tonewoods. The result is a rich, balanced acoustic voice that suits fingerstyle playing as well as intimate strumming.

  The 2025 Standard Series refresh introduces a GE-scalloped Sitka spruce X-brace top, a reimagined GE Modified Low Oval neck with High-Performance Taper, and a refined bridge and heel design. A 24.9" scale length and 1 3/4" nut width make the instrument approachable for a wide range of players.

  Appointments include an ebony fingerboard with abalone diamond and square inlays, an ebony GE Modern Belly bridge, a compensated bone saddle, and nickel open-gear tuning machines. The guitar ships in a molded hardshell case for protection on the road or at home.

  Like all Standard Series instruments, the 00-28 is handcrafted in Nazareth, Pennsylvania and backed by Martin's limited lifetime warranty.
specs: |-
  - Body Size: 00-14 Fret (Grand Concert)
  - Top: Solid Sitka Spruce
  - Back and Sides: Solid East Indian Rosewood
  - Bracing Pattern: GE-Scalloped X-Brace (Sitka Spruce)
  - Scale Length: 24.9"
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Fingerboard Material: Ebony
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Abalone Diamonds and Squares
  - Total Frets: 20
  - Bridge Material: Ebony (GE Modern Belly)
  - Saddle: Compensated Bone (16" radius)
  - Nut Material: Bone
  - Tuning Machines: Nickel Open Gear
  - Case: Molded Hardshell
  - Electronics: None
