description: 'The AGM-684C is a hand-built 45 watt all-valve 1x12" guitar combo
  from Ashdown''s Guitar Magnifier range, made in the UK Custom Shop and fitted
  with a single Celestion Creamback G12M speaker. Its 6 x EL84 power section
  runs in Class A / AB1 with a cathode-bias system, letting players swap output
  valves without re-biasing. Triode/pentode switching offers six output levels
  (Pentode: 45/30/15W; Triode: 22/15/8W). Two channels each have independent
  3-band EQ for clean, crunch and overdriven tones, a genuine 3-spring
  Accutronics reverb tank adds valve-driven reverb, and a valve-driven FX loop
  feeds modulation and time-based pedals into the power amp. Humbucker and
  single-coil inputs match the instrument, and a Cascade control fine-tunes
  channel 2''s gain from clean headroom to early saturation.'
details: |-
  Ashdown Guitar Magnifier 45W 1 x 12" combo. Hand built in the UK Custom Shop using only the finest hand selected components, the AGM-684 is a hugely versatile 1x12" combo fitted with a single Celestion Creamback G12M speaker. At the heart of the AGM-684 lies a power section made up of 6 x EL84 power valves, running in Class A / AB1 (cathode bias system). This feature allows guitarists to replace output valves (should the need arise) without having to call on a tech to re-bias the amplifier. With 45 watts of smooth harmonically rich tone and six differing output power levels via Triode/Pentode switching, the 684's sweet spot is easy to find whatever the gig. Pentode mode allows 45, 30 or 15 watt output and Triode mode gives 22, 15 and 8 watt output. The 684 features two channels with independent 3 band EQ's providing clean, crunch and overdriven tones, whilst a 3 spring genuine 'Accutronics' tank provides valve driven reverb whenever required. A valve driven and recovered FX loop allows for the player's favourite modulation/time based FX pedals to run straight into the power amp without loss of quality. Humbucker and single coil inputs allow for perfect instrument matching. The unique 'Cascade' control allows the player to fine tune the level of gain available to channel 2, providing more clean headroom to crunch tones or increasing the pre amp voltage for earlier saturation and overdriven tones.
specs: |-
  - 45 watt all-valve 1 x 12" combo
  - 6 x EL84 power section, Class A / AB1 cathode bias (no re-bias on valve swap)
  - Triode/Pentode switching: Pentode 45/30/15W, Triode 22/15/8W
  - Two channels with independent 3-band EQ
  - Celestion Creamback G12M speaker
  - 3-spring Accutronics reverb tank
  - Valve-driven FX loop
  - Humbucker and single-coil inputs
  - Cascade gain control on channel 2
  - Hand-built in the UK Custom Shop
