description: Single-speaker version of the UNIT-4 Wireless+, sold as an add-on
  for existing UNIT-4 owners. Battery-powered portable studio monitor with
  ultra-low latency W+ Link wireless and Bluetooth 5.2.
details: |-
  Single-speaker add-on variant of the UNIT-4 Wireless+, intended for existing UNIT-4 owners.

  2-way active portable studio monitor with a 4-inch high-excursion paper-cone woofer and a 1-inch silk-dome tweeter crossed at 3kHz. Battery-powered with 20 hours of playback and a 77 Wh internal battery.

  Ultra-low latency wireless via W+ Link (16ms, uncompressed 44.1kHz 16-bit, 12m range) and Bluetooth 5.2. Wired inputs are 3.5mm stereo mini-jack and 6.3mm TRS balanced mono. EQ and configuration adjustable via the AIAIAI mobile app. Designed for easy disassembly with replaceable batteries and components.
specs: |-
  - Frequency range: 40 Hz - 40 kHz (-10dB)
  - Frequency response: 50 Hz - 20 kHz (+/-2dB)
  - Peak SPL: 99 dBSPL
  - Woofer: 4-inch high excursion paper cone
  - Tweeter: 1-inch silk dome
  - Crossover: 3 kHz
  - Amplifier power: 2x30W continuous, 2x80W peak
  - W+ Link latency: 16 ms
  - W+ Link audio quality: Uncompressed 44.1 kHz 16-bit
  - W+ Link operating range: 12 m
  - Bluetooth version: 5.2
  - Battery playback time: 20 hours
  - Charging time: 3 hours
  - Battery capacity: 77 Wh
  - Weight per unit: 3062 g
  - Dimensions per unit: 156 x 258 x 114 mm (6.14 x 10.16 x 4.49 in)
