name: EVIVA 18SP
manufacturer: electro-voice
primaryCategory: subwoofer
categories:
  - speaker
url: https://products.electrovoice.com/na/en/eviva-18sp/
description: The EVIVA 18SP is an 18-inch portable powered subwoofer designed
  for rapid deployment by musicians, DJs, and small venues. A 1000 W amplifier
  drives an 18-inch WECA2188H ferrite-magnet woofer in a 15 mm internally-braced
  plywood enclosure with a large low-turbulence slot port, delivering up to 132
  dB SPL with frequency response down to 45 Hz (-3 dB). User-friendly controls
  include a selectable MUSIC/LIVE voicing mode, single-knob level adjustment,
  dual-color input metering with peak detection, switchable low-pass crossover
  (100 / 150 Hz), and a polarity switch. The cabinet features a recessed input
  panel for transit protection, metal side handles, antiskid feet, and an M20
  threaded pole mount plate for satellite-on-sub configurations.
details: |-
  1000 W amplifier

  18-inch WECA2188H woofer with ferrite magnet

  Maximum SPL of 132 dB at 1 m

  Frequency response 45 Hz - 150 Hz (-3 dB), 38 Hz - 200 Hz (-10 dB)

  Selectable MUSIC / LIVE voicing mode

  Switchable crossover frequency: 100 Hz (default) or 150 Hz

  Polarity switch (NORMAL / REVERSE)

  Dual-color input signal metering with peak detection

  Single-knob level adjustment

  Recessed input panel for transit protection

  Large low-turbulence slot port

  15 mm internally-braced plywood enclosure with textured paint

  Powder-coated steel grille

  Metal side handles and antiskid feet

  M20 threaded pole mount plate for satellite-on-sub use

  Auto-switching universal power supply (100-240 V, 50/60 Hz)
specs: |-
  - frequencyResponse: 45 Hz - 150 Hz (-3 dB)
  - frequencyRange: 38 Hz - 200 Hz (-10 dB)
  - maxSpl: 132 dB at 1 m
  - amplifierPower: 1000 W
  - woofer: 18-inch WECA2188H (ferrite magnet)
  - crossoverFrequency: 100 Hz (default) / 150 Hz (optional)
  - dimensions: 597 x 520 x 620 mm (23.50 x 20.47 x 24.41 in)
  - weight: 30.7 kg (67.6 lbs)
  - shippingWeight: 36.9 kg (81.3 lbs)
  - powerInput: 100-240 V~, 50-60 Hz, 0.6-0.4 A
  - enclosureMaterial: 15 mm plywood, internally braced, textured paint
  - grille: Powder-coated steel
  - color: Black
  - poleMount: M20 threaded
