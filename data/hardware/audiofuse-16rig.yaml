name: AudioFuse 16Rig
manufacturer: arturia
primaryCategory: audio-interface
website: https://www.arturia.com/products/audio/audiofuse-16rig/overview
prices:
  - amount: 1499
    currency: USD
description: >
  AudioFuse 16Rig is a high-density audio interface that combines an unmatched array of connections with a creativity-first workflow, built to handle a hardware-focused setup and keep your devices always in sync, featuring 16-channel immersive monitoring, always sounding pristine and always ready to go.
details: |-
  The audiofuse 16rig is a high-density audio interface designed for hardware-focused setups and dawless recording, combining an extensive array of connections with a creativity-first workflow. It features 16-channel immersive monitoring and can be configured as either a desktop interface or 1u rackmount device. The interface enables seamless integration of hardware synths, eurorack modules, and outboard gear while maintaining pristine audio quality and instant recall of configurations.

  The interface includes two high-quality digitally-controlled preamps with 24-bit ad/da converters from ess and cirrus logic, delivering professional-grade sound across all input types from vocals to synths and guitars. Two low-latency internal standalone mixers allow audio and MIDI processing without computer connection, featuring a main mixer controllable via MIDI and a dedicated cue mixer for sub-mixing flexibility. The audiofuse control center provides an intuitive matrix for routing anything to anything, supporting multiple sends/returns for effects and quick a/b speaker monitoring.

  The interface offers extensive connectivity including 16 trs analog inputs, 12 analog outputs with 8 dc-coupled outputs for synth modules, 2 adat in/out pairs, MIDI I/o, and wordclock synchronization for precise analog-digital conversion. Front-panel controls include 3.5mm stereo input for line-level sources, dual headphone outputs in both 6.35mm and 3.5mm formats, and dedicated buttons for quick access to settings and power management. The immersive audio monitoring system supports dolby atmos (up to 9.1.6), auro-3d, 5.1, 7.1, and custom quad configurations for advanced monitoring setups.

  The audiofuse 16rig includes a comprehensive creative fx bundle featuring analog lab intro with hundreds of presets from arturia's v collection, plus professional plugins including pre 1973, pre v76, filter mini, chorus jun-6, comp fet-76, delay tape-201, rev plate-140, phaser bi-tron, pre trida, and comp diode-609. These vintage studio tools and contemporary effects enable refined audio processing and experimental sound design directly within the interface ecosystem.
specs: |-
  - 16 x trs analog inputs with 2 x high-quality digitally-controlled preamps
  - 12 x analog outputs including 8 x dc-coupled trs line outputs
  - 2 x adat in, 2 x adat out
  - 16 channels input/output at 48khz (8 channels at 88.2/96khz)
  - 1 x MIDI input & 2 x MIDI outputs/thru din connections
  - Wordclock I/o
  - 24-bit ad/da converters at 192khz from ess and cirrus logic
  - Two internal standalone low-latency mixers
  - Immersive audio monitoring with dolby atmos (up to 9.1.6), auro-3d, 5.1, 7.1, quad configurations
  - Desktop or 1u rackmount operation
  - Dc-coupled outputs for synth module connectivity
  - USB-c connectivity with USB 2.0 ports
  - Class-compliant MIDI-USB communication
  - 3.5mm stereo input on inputs 3 & 4
  - 6.35mm and 3.5mm front-panel headphone outputs
  - Audiofuse control center with matrix routing
  - True bypass analog signal path
  - Windows 10 or later (64-bit) compatible
  - Macos 10.13 or later (64-bit) compatible
  - 4 gb ram minimum (8 gb+ recommended)
  - 64-bit intel core or amd multi-core processor (i5 or faster recommended)
categories:
  - mixer
  - preamp
