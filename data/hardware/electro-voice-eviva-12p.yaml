name: EVIVA 12P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/eviva-12p/
description: The EVIVA 12P is a portable powered loudspeaker designed for
  aspiring musicians, DJs, and small venues. A 1000 W Class-D amplifier drives a
  12-inch WECA2124H ferrite woofer and a 1-inch DENA2504H titanium-coated PEI
  compression driver via Electro-Voice's patented SST (Signal Synchronized
  Transducers) waveguide, delivering up to 125 dB maximum SPL across a 90 x 60
  degree coverage pattern. Selectable MUSIC and LIVE DSP presets, Bluetooth
  audio streaming with switchable mono/stereo mix output, and dual mic/line
  combo inputs with single-knob level control and dual-color signal metering
  round out a lightweight composite enclosure with side, top, and bottom-pocket
  handles for single-person setup.
details: >-
  1000 W Class-D power amplifier


  Up to 125 dB maximum SPL output


  12-inch WECA2124H ferrite-magnet woofer


  1-inch DENA2504H titanium-coated PEI compression driver with neodymium magnet


  Patented SST (Signal Synchronized Transducers) waveguide


  90 x 60 degree (H x V) coverage pattern


  Crossover frequency: 2.2 kHz


  Selectable MUSIC and LIVE DSP presets


  Bluetooth audio streaming with switchable mono/stereo mix output


  High-pass filter options: NO SUB or WITH SUB (EVIVA 18SP) modes


  Two XLR combo mic/line inputs with single-knob level and dual-color signal
  metering


  XLR mix output for daisy-chaining additional speakers


  Universal 100-240 V auto-switching mains input


  Composite enclosure with powder-coated steel grille


  Ergonomic side handles, top handle, and bottom grab pocket for single-person
  transport
