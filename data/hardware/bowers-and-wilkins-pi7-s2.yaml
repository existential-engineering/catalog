description: What does it take to create category-defining True Wireless
  earbuds? High-resolution sound and crystal-clear voice calls, an
  industry-first wireless audio retransmission case, plus a choice of three
  elegant colors.
details: |-
  Pi7 S2 was the flagship of the second-generation Bowers & Wilkins True Wireless earbud range, built around a true 24-bit audio connection, a two-way drive unit design and an industry-first wireless audio retransmission case.

  Each earbud uses a two-way arrangement of a 9.2mm dynamic drive unit and a balanced armature, each with its own amplifier, fed by a high-performance DSP. Three microphones per earbud handle telephony and the adaptive Active Noise Cancellation system, which adjusts to the surrounding environment rather than running at a fixed strength.

  The wireless link is Bluetooth 5.0 with aptX Adaptive, plus aptX HD, aptX Classic, AAC and SBC, and the A2DP, AVRCP, HFP, HSP and BLE GATT profiles.

  The defining feature is the smart charging case. Connected to a source with either the supplied USB-C to 3.5mm analogue cable or a USB-C to USB-C cable, the case retransmits that audio wirelessly to the earbuds, or to another pair of Bowers & Wilkins headphones paired to it, which turns any analogue headphone socket (an aeroplane seat, a hi-fi) into a wireless source. The case also supports wireless and USB-C charging.

  Battery life is up to 5 hours from the earbuds with noise cancellation off, with a further 16 hours from the case, for up to 21 hours of wireless media streaming in total. A 15-minute charge returns 2 hours of playback. The earbuds weigh 7g each and are rated IP54, and the case weighs 47g and measures 61 x 28 x 56mm, in metal and plastic. Finishes are Satin Black, Canvas White and Midnight Blue.
specs: |-
  - Wearing style: in-ear noise cancelling True Wireless headphones
  - Drive units: 9.2 mm dynamic drive with balanced armature (two-way design)
  - Microphones: three per earbud for calls and ANC
  - Technical features: true 24-bit audio connection, 2-way drive unit design, high performance DSP, Bluetooth 5.0 with aptX Adaptive, adaptive ANC, audio retransmission from charging case, wireless and USB-C charging, fast charging support
  - Bluetooth codecs: aptX Adaptive, aptX HD, aptX Classic, AAC, SBC
  - Bluetooth profiles: A2DP v1.3.1, AVRCP v1.6.1, HFP v1.7.1, HSP v1.2, BLE GATT
  - Frequency band: Tx 2402 MHz to 2480 MHz (ISM band), Rx 2402 MHz to 2480 MHz (ISM band)
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life: up to 5 hours for earbuds (with ANC off), additional 16 hours from charging case
  - Fast charging: 15 minute charge = 2 hours playback
  - Wireless charging support: yes
  - Water resistance: IP54 (earbuds only)
  - Inputs: earbuds Bluetooth, charging case USB-C and 3.5 mm analogue jack (wireless audio retransmission via charging case)
  - Included accessories: 80 cm USB-C to USB-C charging cable, 80 cm 3.5 mm jack to USB-C audio cable, small / medium / large ear tips
  - Net weight: earbuds 7 g (each), charging case 47 g
  - Charging case dimensions: 61 mm (w) x 28 mm (d) x 56 mm (h)
  - Surface materials: metal, plastic
  - Finishes: Satin Black, Canvas White, Midnight Blue
