description: Flagship noise-cancelling True Wireless earbuds with
  high-resolution sound, crystal-clear voice calls and an industry-first
  wireless audio retransmission case.
details: |-
  Pi7 S2 was the flagship of the Bowers & Wilkins True Wireless earbud range, pitched around high-resolution sound, crystal-clear voice calls and an industry-first wireless audio retransmission case, in a choice of three colours.

  Each earbud carries a two-way drive unit design, a 9.2mm dynamic driver working with a balanced armature, plus three microphones per earbud used for calls and for the Adaptive ANC system. The wearing style is given as in-ear noise cancelling True Wireless headphones, with an IP54 rating on the earbuds only.

  The wireless link is Bluetooth 5.0 with aptX Adaptive, and the codec list also covers aptX HD, aptX Classic, AAC and SBC, over A2DP v1.3.1, AVRCP v1.6.1, HFP v1.7.1, HSP v1.2 and BLE GATT. Bowers & Wilkins claims a true 24-bit audio connection and high performance DSP. Transmit and receive both run in the 2402MHz to 2480MHz ISM band at under 10.0 dBm RF output power.

  The distinguishing feature is the charging case, which retransmits audio wirelessly to the earbuds from a wired source. The spec table lists the case's inputs as USB-C and a 3.5mm analogue jack, and the in-box accessories supply both an 80cm USB-C to USB-C charging cable and an 80cm 3.5mm jack to USB-C audio cable, so an analogue source reaches the case through that cable rather than through a separate socket on the case.

  Both the earbuds and the case run on rechargeable lithium-ion cells. The earbuds give up to 5 hours with ANC off, the case adds a further 16 hours, and a 15 minute charge gives 2 hours of playback. The case charges wirelessly or over USB-C. Each earbud weighs 7g, the case 47g, and the case measures 61mm wide by 28mm deep by 56mm high. Three finishes were offered: Satin Black, Canvas White and Midnight Blue.
specs: |-
  - Wearing style: in-ear noise cancelling True Wireless headphones
  - Drive units: 9.2mm Dynamic Drive with Balanced Armature (2-way drive unit design)
  - Microphones: three microphones per earbud for calls and ANC
  - Technical features: True 24-bit audio connection, 2-way drive unit design, High performance DSP, Bluetooth 5.0 with aptX Adaptive technology, Adaptive ANC, Audio retransmission from charging case, Wireless and USB-C charging, Fast charging support
  - Bluetooth codecs: aptX Adaptive, aptX HD, aptX Classic, AAC, SBC
  - Bluetooth profiles: A2DP v1.3.1, AVRCP v1.6.1, HFP v1.7.1, HSP v1.2, BLE GATT (Generic Attribute Profile)
  - Inputs: earbuds Bluetooth; charging case USB-C and 3.5mm analogue jack, for wireless audio retransmission via the charging case
  - Frequency band: Tx mode 2402 MHz to 2480 MHz ISM Band, Rx mode 2402 MHz to 2480 MHz ISM Band
  - RF output power: below 10.0 dBm
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life and charging: up to 5 hours for earbuds with ANC off, additional 16 hours from charging case, 15 minute charge gives 2 hours playback
  - Wireless charging support: yes
  - Waterproof: IP54 (earbuds only)
  - Net weight: earbuds 7g each, charging case 47g
  - Dimensions (carry case): 61mm (w) x 28mm (d) x 56mm (h)
  - In box accessories: 80cm USB-C to USB-C charging cable, 80cm 3.5mm jack to USB-C audio cable, small / medium / large ear tips
  - Finishes: Satin Black, Canvas White, Midnight Blue
