url: https://www.neumann.com/en-us/products/microphones/kmr-82-i
description: The KMR 82 i is a shotgun microphone for longer distances, e.g. in
  ENG and stage applications. With an acceptance angle of 45° and minimal
  off-axis coloration the KMR 82 i can be used to record individual instruments
  in an orchestra without problems.
details: |-
  Shotgun microphone for longer distances

  Lobe shaped pattern with 45° pickup angle

  Very high directivity without off-axis coloration

  Very high directivity with 45° recording angle

  Excellent rejection of unwanted sound

  Natural sound without off-axis coloration

  Low cut and treble response switches

  Lightweight (250 g)

  Low power consumption
specs: |-
  - Acoustical operating principle: Pressure gradient interference transducer
  - Directional Pattern: Supercardioid/lobe
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 21 mV/Pa ± 1 dB
  - Rated Impedance: 150 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level, CCIR: 23 dB
  - Equivalent noise level, A-weighted: 12 dB-A
  - Maximum SPL for THD 0.5%: 128 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 71 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 82 dB
  - Maximum output voltage: 2.6 dBu
  - Supply voltage ( P48, IEC 61938): 48 V ± 4 V
  - Current consumption ( P48, IEC 61938): 0.7 mA
  - Matching connector: XLR 3 F
  - Weight: 250 g
  - Diameter: 21 mm
  - Length: 395 mm
