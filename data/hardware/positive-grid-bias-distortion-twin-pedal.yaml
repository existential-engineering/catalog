  - Built-in noise gate
  - True and buffered bypass operation
  - Sturdy road-ready enclosure
  - Tour-grade footswitches
  - Built-in Bluetooth wireless
  - Industry-standard dc power jack
  - Compatible with voodoo labs, ciocks, strymon and burkey power supplies
  - Tonecloud connectivity
  - Tone match technology
  - Works with any amplifier
  - Desktop and mobile device software control
