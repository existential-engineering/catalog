details: |-
  In rock music, crunch and gain transformed the electric guitar from a support
  to a lead instrument, bringing it from the back of the stage to the front.
  Positive Grid's groundbreaking component emulation technology allows bias
  distortion to recreate the sound of almost any existing gain pedal, while
  providing the ability to create entirely new sounds and textures. It's the
  first distortion pedal that works with any amplifier, giving you access to an
  entire library of gain in a single pedalboard parking space.

  The days of ripping apart your existing pedalboard to experiment with drive
  sounds are over: with support for 20 customized presets and a built-in
  variable boost, bias distortion can get virtually any gain sound you need for
  your gigs or sessions. Assign three different custom gain pedals to the
  onboard footswitches, and use the variable tri-boost to kick it into high gear
  for intense sections or solos.

  Positive grid's unique component emulation engine allows you to recreate
  almost any existing pedal circuit, expanding your gain vocabulary and
  redefining what the term "distortion pedal" really means. Using bias pedal
  software on a desktop computer or mobile device, you can utilize two separate
  clipping sections and mix and match the characteristics of germanium/silicon
  diodes, jfet/mosfets and vacuum tube gain blocks. Change the headroom by
  varying the voltage on the virtual power supply, modify the feel of the pedal
  with the compressor, or utilize two super-flexible eq stages for even more
  tone-shaping power. There's even a built-in noise gate - the sonic
  possibilities are immense.

  Offering both true and buffered bypass operation, bias distortion is built
  into a sturdy road-ready enclosure and uses high-quality components and
  tour-grade footswitches. Built-in Bluetooth wireless makes it easy to tweak
  sounds with your mobile device even at the gig, and the industry-standard dc
  power jack is compatible with every professional pedalboard power supply on
  the market, including those from voodoo labs, ciocks, strymon and burkey.

  All bias pedals can connect to the positive grid tonecloud, giving you access
  to thousands of custom pedals uploaded by artists, recording studios and
  fellow guitarists. If you have a distortion pedal you simply can't live
  without, bias pedal software can clone it using positive grid's exclusive tone
  match technology.
