description: An ideal instrument for dazzling high-speed playing, the Pro-Mod
  San Dimas Style 1 HH FR MPL delivers scorching sound, stunning style and
  grin-inducing playing feel and performance. The guitar pairs an alder San
  Dimas body in Gloss Black with a bolt-on graphite-reinforced maple neck, a
  12"-16" compound-radius maple fingerboard, dual Seymour Duncan humbuckers and
  a recessed Floyd Rose 1000 Series double-locking tremolo.
details: |-
  The Pro-Mod San Dimas Style 1 HH FR MPL features an alder San Dimas body finished in Gloss Black with no pickguard. The bolt-on maple neck has graphite reinforcement, a hand-rubbed satin urethane finish, a licensed Fender Stratocaster headstock and a Charvel-branded neck plate. Its maple fingerboard carries 22 jumbo frets with black dot inlays over a 12"-16" compound radius and rolled edges, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) at a 25.5" scale length.

  Electronics consist of a Seymour Duncan JB TB-4 humbucker in the bridge and a Seymour Duncan '59 SH-1N humbucker in the neck (both black), routed through a 3-position blade switch with a push/pull volume coil split and a no-load tone control.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with Floyd Rose FRT O1000 locking tremolo arm, Charvel-branded die-cast tuning machines, knurled flat-top control knobs, a barrel-style switch tip and standard strap buttons in a black hardware finish. Strung with nickel-plated steel .009-.042 strings. Optional Charvel hardshell case or gig bag sold separately.
