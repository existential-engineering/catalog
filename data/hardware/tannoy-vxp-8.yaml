description: The VXP 8 is a compact 1,600-Watt 8" Dual Concentric powered sound
  reinforcement loudspeaker with integrated Lab Gruppen IDEEA Class-D
  amplification.
details: |-
  The VXP 8 is a compact 1,600-Watt 8" Dual Concentric powered sound reinforcement loudspeaker with integrated Lab Gruppen IDEEA Class-D amplification. It provides a punchy and sonically articulate solution for small-scale performance sound reinforcement, background music, and high-intelligibility speech applications where clarity and natural vocal reproduction are paramount. The trapezoidal cabinet design suits both installed and portable use, with optional VTH pole mount and certified 5:1 safety-ratio flying hardware.
specs: |-
  - frequencyResponseFullRange: 80 Hz – 35 kHz ±3 dB; 67 Hz – 45 kHz -10 dB
  - frequencyResponseHiPass: 120 Hz – 35 kHz ±3 dB; 100 Hz – 45 kHz -10 dB
  - nominalDispersion: 90° conical @ -6 dB point
  - directivityFactorQ: 6.8
  - directivityIndexDI: 7.9 dB
  - dynamicRange: 106 dB
  - maximumSPL: 125 dB peak
  - crossoverType: Passive 1.7 kHz with dynamic HF protection
  - transducers: 200 mm (1 x 8") constant directivity Dual Concentric™
  - maximumOutputPower: 1600 W
  - amplifierType: Class-D (Lab Gruppen IDEEA)
  - amplifierProtection: Output current limiter, clip limiter, brownout protection and recovery, thermal
  - inputImpedance: 10 kΩ unbalanced, 20 kΩ balanced
  - maximumInputLevelForClip: +4.5 dBu / +14.5 dBu
  - levelControl: Recessed potentiometer
  - filter: Hi-pass (HPF) / full range (FR), switchable
  - powerMode: Manual (MAN) / auto (AUTO), switchable
  - powerSupplyType: Switch-mode autorange power supply
  - mainsVoltage: 100–240 V~, 50/60 Hz
  - powerConsumption: 75 W @ 1/8 max power
  - dimensions: 389 x 281 x 276 mm (H x W x D) / 15.3 x 11.1 x 10.9"
  - netWeight: 10.1 kg (22.2 lbs)
  - construction: 15 mm (5/8") plywood, vented and internally braced
  - finish: Semi-matt black paint (white optional)
  - grille: Powder coated perforated steel
  - flyingHardware: 2 x M10 flying inserts, 2 x M10 yoke bracket inserts (6 mm allen key), blanking plate for optional VTH pole mount
