description: >-
  The Moog MF-105M MIDI MuRF is an analog multiple resonance filter array effect pedal
  that animates sound across eight switchable frequency bands. It features MIDI
  synchronization, user-editable patterns via a Mac/PC sequence editor, and is compatible
  with Moog expression pedals and the MP-201 controller. The MF-105M is the third
  iteration in the MuRF series, adding MIDI control, switchable Bass/Mids frequency bands,
  and editable patterns over its predecessors.
details: |-
  The MF-105M MIDI MuRF is the third evolution of Moog's MuRF pedal line, following the original MF-105 (optimized for guitar and mid-range frequencies) and the MF-105B (targeted at bass applications). It addresses three key limitations of its predecessors by introducing switchable frequency bands, MIDI synchronization, and user-editable patterns.

  The MuRF applies warm, resonant filters across eight frequency bands using 100% analog signal processing. Users can switch between two frequency band sets: BASS (110 Hz to 1.8 kHz) and MIDS (200 Hz to 3.4 kHz). MIDI In allows clock synchronization with DAWs and drum machines, and Continuous Control (CC) MIDI data enables real-time pattern control.

  The unit ships with 12 Bass and 12 Mids factory presets, all of which are user-editable via the included Mac/PC sequence editor software. Patterns can be up to 64 steps in length. The MF-105M can function both as a floor pedal effect and as a component in a modular synthesis setup, with CV control inputs for Rate, Mix, Envelope, and LFO/Sweep parameters.
specs: |-
  - 8-band resonant filter array with switchable Bass and Mids frequency sets
  - BASS bands: 110 Hz, 160 Hz, 240 Hz, 350 Hz, 525 Hz, 775 Hz, 1.2 kHz, 1.8 kHz
  - MIDS bands: 200 Hz, 300 Hz, 450 Hz, 675 Hz, 1 kHz, 1.5 kHz, 2.2 kHz, 3.4 kHz
  - Up to 64-step sequencer patterns
  - 12 Mids and 12 Bass presets (user-editable)
  - MIDI In for clock sync and CC control
  - CV control inputs: Rate, Mix, Envelope, LFO/Sweep
  - Tap/step input
  - Built-in Drive effect
  - LFO with on/off switch
  - Envelope rotary control
  - 100% analog signal path
  - Monophonic
  - Weight: 4 lbs (1.8 kg)
  - Includes Mac/PC pattern editor software
