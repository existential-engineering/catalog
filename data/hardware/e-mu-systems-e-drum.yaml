description: >-
  A portable digital percussion module from E-mu Systems that used
  interchangeable ROM cartridges for sounds, powered by either batteries or AC
  adapter.
details: |-
  The E-Drum arrived in 1984 as E-mu's follow-up to the popular Drumulator, but it turned out to be one of the company's rare commercial missteps. The hardware was developed by Clavia DMI in Sweden, and E-mu encountered significant challenges with electronics and mechanical tolerances before production could even begin.

  At its core, the E-Drum was a touch-sensitive drum pad module that played back 8-bit samples stored on removable EPROM cartridges. Each cartridge held up to four samples in 16kB of memory. Users could adjust pitch, decay, sensitivity, and basic EQ per sound, making it reasonably flexible for live performance and studio triggering.

  The device struggled in the marketplace largely because E-mu relied on keyboard distributors to sell what was fundamentally a percussion product. Combined with pricing issues and the fact that E-mu was already cash-strapped while waiting on the delayed Emulator II, the E-Drum never found its audience. Multiple sound cartridges were available, but production was short-lived.
specs: |-
  - Polyphony: 1 voice
  - Multitimbral: 1 part
  - Oscillators: 1 (ROM-based)
  - Sound storage: Removable cartridge with up to four 8-bit samples in 16kB EPROM
  - Envelopes: 1 with decay control
  - Effects: EQ (treble and bass)
  - Dynamic range: 40dB
  - Power: Two 9-volt batteries or optional AC adapter
