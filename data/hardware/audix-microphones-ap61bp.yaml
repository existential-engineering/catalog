details: |-
  A professional true diversity lavalier wireless system featuring the B60 bodypack transmitter. This bodypack may be used with any lavalier, head-worn, or instrument microphone in the AUDIX line, as well as guitar and bass. A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include a rackmount kit for mounting two systems in one rack space, active directional antennas, and an antenna distribution system for up to four systems (4 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - System: R61 single-channel true diversity receiver with B60 bodypack transmitter
  - Frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum receiver and transmitter
  - 207 pre-coordinated frequencies
  - Single-space rackmount kit with BNC antenna cables included
  - Durable metal housing
