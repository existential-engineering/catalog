description: The Pro Plus Series Soloist SLA2 features an arched nyatoh body
  with a three-piece maple/walnut neck-through construction and bound ebony
  fingerboard with compound radius. Loaded with Seymour Duncan JB and '59
  humbuckers and a Floyd Rose 1000 Series tremolo, it offers high-end
  performance at a mid-tier price.
specs: |-
  - Body: Nyatoh, arched Soloist shape
  - Neck: 3-piece maple/walnut, neck-through-body
  - Scale Length: 25.5"
  - Fingerboard: Ebony, bound, 12"-16" compound radius
  - Frets: 24 jumbo stainless steel
  - Inlays: Pearloid sharkfin
  - Nut: Floyd Rose 1000 locking, 1.6875" width
  - Bridge: Floyd Rose 1000 Series double-locking tremolo (recessed)
  - Tuners: Jackson sealed die-cast
  - Pickups: Seymour Duncan JB TB-4 (bridge), Seymour Duncan '59 SH-1N (neck), HH
  - Controls: Volume, tone, 3-position blade switch
  - Strings: Nickel-plated steel (.009-.042)
