url: https://www.engl-amps.com/shop/heads/ironball-special-edition-e606se/
description: 20-watt, two-channel all-tube guitar amplifier head with a Power
  Soak, tube-buffered FX loop, noise gate, reverb, delay, MIDI control, an
  impulse response loader and a balanced IR output.
details: |-
  This amp is designed to officiate as the missing link between the analog and the digital world. Soundwise no compromises were made, so there are no semiconductors in the signal path to keep the sound as pure as possible. This amp is in fact an all-tube head.

  Basically it is a two channel amp where every channel is boostable. The Clean channel offers chime shimmering cleans and smoothly breaks up at higher settings. Thanks to the gain boost function the channel can be boosted to get shimmering crunch sounds out of it.

  The Lead channel starts where the Clean channel ends and offers a huge amount of gain, and can even be boosted to make it more versatile. This channel suits any style of rock and metal music.

  Digital components are used for the MIDI system, the effects section and the impulse response loader. The built-in Power Soak offers the opportunity to play late at night or whenever higher volumes are unacceptable, and gives the opportunity to push the amplifier's power amp to break up at low volumes.
specs: |-
  - 2 channels: Clean, Lead, each boostable
  - All tube head
  - Power Soak (full power / 20 watts, 5 watts, 1 watt, speaker off)
  - Tube buffered FX loop
  - Noise gate
  - Master Volume Boost (M.V.B.)
  - Reverb and delay
  - MIDI In
  - ENGL MIDI footcontroller phantom power switch
  - Impulse response loader with IR selector switch
  - USB for IR loading
  - Headphone output with level control
  - Balanced IR output with XLR ground lift switch
  - Store function for MIDI programming
  - Controls: Gain (for each channel), 3-band EQ, Presence, Lead Volume, Master, Delay Level, Noise Gate Threshold, Headphone Output Level, Power Range Selector, IR Selector
  - Poweramp output: 1 x 8-16 ohm, or 2 x 16 ohm in parallel
  - Footswitch: ENGL Z4 (channels, gain boost), or MIDI with the ENGL Z9
  - Preamp tubes: 4 x ENGL ECC83 / 12AX7
  - Output tubes: 2 x ENGL EL84
  - Output wattage: 20 W
  - Dimensions: 34 x 14 x 22 cm
  - Weight: 7 kg
