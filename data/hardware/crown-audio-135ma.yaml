name: 135MA
manufacturer: crown-audio
primaryCategory: amplifier
categories:
  - mixer
  - rack-mount
url: https://www.crownaudio.com/en-US/products/135ma
description: Three-input, 35W mixer-amplifier designed for commercial audio
  applications including paging, background music, and music-on-hold. Provides
  both 8-ohm and constant-voltage outputs at 70V and 100V.
specs: |-
  - 3 input channels (each with volume control)
  - 1 amplifier output channel
  - 35W amplifier output
  - 8-ohm output
  - Constant-voltage outputs at 70V and 100V
  - Frequency Response: 50 Hz to 20 kHz ±1 dB
  - THD+Noise: < 0.5% at rated power at 1 kHz
  - Signal-to-Noise Ratio (Mic): > 58 dB
  - Signal-to-Noise Ratio (Line): > 60 dB
  - Phantom power: 15 VDC
  - Priority muting (VOX or external switch)
  - Voice-activated muting capability
  - Bass and treble controls on master output
  - IEC Power Connector: 15A
