description: Charvel once again ups the ante for modern high performance
  combined with elegant style and crushing tone with the Pro-Mod DK24 HSH 2PT
  CM, a stunning new instrument designed especially for a new breed of player.
details: |-
  The Pro-Mod DK24 HSH 2PT CM pairs a Dinky-shaped alder body with a scalloped lower bout and gloss finish with a bolt-on caramelized maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, all anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around a versatile HSH configuration with custom Seymour Duncan pickups: a Full Shred TB-10 at the bridge, a Custom Flat Strat SSL-6 single-coil in the middle, and an Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch with a 500K EVH Bourns Low Friction volume pot and a no-load tone control.

  Hardware includes a Gotoh Custom 510 Tremolo with Gotoh tremolo arm, Charvel-branded die-cast locking tuning machines in a gold finish, Stratocaster-style skirt knobs, a Fender Standard string guide, and a heel-mount truss rod adjustment wheel. The licensed Fender Stratocaster headstock rounds out the package.
