description: The Klipsch Reference R-40M Bookshelf speaker monitors feature
  next-gen horn-loaded technology to deliver big sound in any room you choose.
details: |-
  The R-40M features an updated 90° x 90° Tractrix horn design with increased outer horn dimensions, delivering improved directivity control and broader frequency bandwidth for more power and emotion in music and movies.

  The exclusive 1" Linear Travel Suspension (LTS) aluminum tweeter with Kapton Suspension minimizes distortion for more detailed, accurate high-frequency performance.

  The 4" Spun-Copper Thermoformed Crystalline Polymer (TCP) woofers feature steeper cone angles for a smoother response and improved accuracy and transparency.

  Cabinets are constructed from MDF with a scratch-resistant, textured wood grain finish and include hidden fasteners, an edge-to-edge horn design, and low-profile magnetic grilles for a modern, polished aesthetic.
