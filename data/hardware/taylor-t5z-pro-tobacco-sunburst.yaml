details: |-
  The T5z Pro is Taylor's mid-tier hollowbody hybrid, offering the electric-leaning playability of the T5z platform at an accessible price point. Its figured Big Leaf Maple top over a lightweight Shamel Ash body delivers visual flair in Tobacco Sunburst while keeping the weight comfortable for extended play. Chamfered body edges provide a smooth feel against the forearm.

  The three-pickup system spans the full tonal range: a concealed neck humbucker for warm, full-bodied tones; a visible humbucker at the middle position for punch and definition; and an acoustic body sensor that captures the guitar's natural resonance. Five-way switching covers all combinations, and active on-board circuitry lets you dial in anything from lush acoustic-style sounds to direct electric output.

  The Neo-Tropical Mahogany neck features a West African Crelicam Ebony fingerboard with Faux Pearl/Abalone inlays and jumbo frets. A 24-7/8" scale length keeps string tension comfortable for electric-style players. Taylor chrome tuners and a bone nut and saddle complete the build.

  Strings are D'Addario XS Coated Electric Medium (.011-.049). Ships with a deluxe hardshell case.
