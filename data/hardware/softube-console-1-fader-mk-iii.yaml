description: Console 1 Fader Mk III is the motorized fader controller of the Console 1 Mixing System, with ten faders and screens for levels, pans, sends, mutes and solos while mixing in the box. It is sold separately from Console 1 Channel Mk III, the channel strip control surface that works alongside it.
details: |-
  Console 1 Fader Mk III is the fader bank of the Console 1 Mixing System. Where Console 1 Channel Mk III puts a channel strip under a knob per function, Fader Mk III adds ten motorized faders so levels, pans, sends, mutes, solos and track selection are handled by hand while mixing in the box, with the feel of a high-quality analog console rather than a mouse.

  The ten faders are 100 mm Analog Feel units with capacitive touch and a stated 0.2 mm resolution. Touching a fader shows the track in the On-Screen Display, makes touch automation straightforward to write, and can select the track outright with the optional Select on Touch setting. The faders also carry haptic feedback, which Softube describes as automatically communicating critical information back to the hand.

  Ten high-resolution screens sit above the faders and are what separate Mk III from the screenless Fader Mk I. Each shows customizable per-track information: track name, track number, level meters, pan and track colour, so the position in a large session is visible on the unit itself. Param mode reassigns the faders to parameters of the selected track instead of levels, with filters, drive, compression threshold and width among them, and pressing it twice reaches further parameter pages.

  The unit runs in four modes: Console 1, Pro Tools HUI, Generic MCU and Apollo Central. Softube lists direct integration for Cubase and Logic, integrated DAW control for Studio One, Reaper, Ableton Live, LUNA, FL Studio, Harrison Mixbus, Digital Performer, Bitwig, Samplitude and Cakewalk, and six sends with a spill mode, against three sends and VST3-only control on Fader Mk I. Console 1 Core Mixing Suite is included.

  Connectivity is two USB-C ports. One carries data and USB-C Power Delivery from the included supply, which Softube states powers up to two units, and the second chains onward, so up to four Fader Mk III units plus a Channel Mk III run without a hub, replacing the Mk I arrangement where each Fader needed its own PSU. The chassis is an anodized aluminium top with injection-moulded sides and back and integrated connectivity points, and it mounts on a 100 mm M4 VESA pattern underneath or M4 threads on the sides, with an optional rack mount kit and mixing system stand. Fader Mk III works alongside Console 1 Mk I and Mk II and Fader Mk I, and existing projects carry over.
specs: |-
  - Ten 100 mm motorized Analog Feel faders with capacitive touch, 0.2 mm resolution
  - Haptic feedback on the faders
  - Ten high-resolution screens showing track name, track number, level meters, pan and track colour
  - Four modes: Console 1, Pro Tools HUI, Generic MCU, Apollo Central
  - Param mode assigns track parameters (filters, drive, compression threshold, width and more) to the faders, with further pages on a second press
  - Select on Touch option, and touched track shown in the On-Screen Display for touch automation
  - Six sends with spill mode
  - Direct integration with Cubase and Logic; integrated DAW control for Studio One, Reaper, Ableton Live, LUNA, FL Studio, Harrison Mixbus, Digital Performer, Bitwig, Samplitude and Cakewalk; MCU and Apollo Central modes
  - Includes Console 1 Core Mixing Suite software
  - Dual USB-C ports, daisy chain up to four Fader units together with Console 1 Channel Mk III, no hub required
  - Powered by a single included USB-C PD (Power Delivery) connection, which delivers power to up to two units
  - Mounting: 100 mm M4 VESA on the bottom, M4 threads on the sides; optional rack mount kit and Console 1 Mixing System Mk III stand
  - Construction: anodized aluminium top, injection-moulded smooth sides and back with integrated connectivity points
  - Dimensions (W x H x D): 435 mm x 45 mm x 219 mm / 17.1 x 1.77 x 8.6 inches
  - Weight: 2.08 kg / 4.59 lbs
  - Works with Console 1 Channel, Console 1 Mk I and Mk II, and Fader Mk I; projects are backward compatible
  - Requires macOS Sonoma 14, Sequoia 15 or Tahoe 26, or Windows 10 (64-bit) or Windows 11
  - Console 1 plug-in runs as VST3, AU (Logic Pro) or AAX (Pro Tools); the VST2 version is not supported
  - Requires a Softube account, an iLok account and internet access for installers and licensing
