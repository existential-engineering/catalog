description: A guitar pedal wavefolder with drive circuits before and after the
  folding stage to shape and add character to the folded signal, with controls
  for dry/wet, tone, and level.
details: |-
  At it's core the Boulder Folder is a wavefolder. Wavefolders are sensitive to volume changes, so we've put a drive circuit in front to help offer a more consistent sound. There is also a second (different) drive circuit after the wavefolder to add some more character. Main signal flow: Drive 1 -> Wavefolder -> Drive 2 (both switches in the bottom position)

  With the left switch you can bypass Drive 1 to give a spongy feeling as the signal level will change the fold amount. With right switch you can either disable Drive 2 (middle) or bypass the wavefolder (top). The bottom three knobs control the output dry/wet, tone, and level.
