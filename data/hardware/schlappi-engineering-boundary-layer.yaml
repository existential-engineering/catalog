description: Boundary Layer is a triple cycling slew module that can act as a
  modulation oscillator, voltage controlled slew, or AR/AD envelope generator on
  each of its three channels. It provides combined MAX, MID, and MIN outputs and
  can be patched for stereo drone synthesis at audio rate.
details: |-
  Boundary Layer is a triple cycling slew acting as a powerhouse of modulation, audio
  mayhem, and obscure modular tricks. Each of the channels can act individually as:

  -a modulation oscillator

  -voltage controlled slew (including portamento)

  -AR/AD envelope (decay or release determined by choice of input). All three channels are tied together by three global inputs, as well as three outputs which select the MAX, MID, and MIN of all three voltages. Using different combinations at audio rate allows for patch programmable stereo drone synth capabilities. DOWNLOAD MANUAL

  DOWNLOAD QUICKSTART

  Features
specs: |-
  - 3 separate channels
  - 3 global inputs
  - 3 combined outputs MAX/MID/MIN
  - Oscillates from low LFO rate (a minute?) to audio rate (>10kHz with exponential feedback)
  - A CV input switchable between RISE/FALL/BOTH
  - Bound input for simultaneous control over cycling rate and amplitude
  - TRIG input for AD envelopes
  - SLEW input for AR envelopes and portamento or filtering
  - EOC ouput header switchable between EOR and EOF
  - 16 HP
  - Skiff friendly 32mm depth (including cable)
  - current draw: +12V 170mA, -12V 100mA
