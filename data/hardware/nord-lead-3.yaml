description: >-
  The Nord Lead 3 is a 24-voice virtual analog synthesizer from Clavia, featuring a
  completely redesigned interface and expanded synthesis capabilities over its
  predecessors. It combines analog-modeling oscillators with FM synthesis and Sinus
  Modulation, dual multi-mode filters, and a powerful Morph system for expressive
  real-time control.
details: |-
  The Nord Lead 3 represents a significant evolution in the Nord Lead series, offering a redesigned oscillator section with two separate oscillator groups. Each group provides six waveforms including sine, sawtooth, triangle, square with pulse width modulation, noise, and synced noise, along with dual sine wave oscillators and 2/4-operator FM synthesis modes.

  The filter architecture features two high-quality multi-mode filters configurable in series or parallel. Available modes include low-pass, band-pass, high-pass, LP-HP, LP-LP, and a Classic mode that emulates analog filter characteristics, with selectable 1, 2, or 4-pole configurations.

  A standout feature is the Morph function, which enables continuous control of up to 26 parameters through four dedicated control groups: velocity, aftertouch, modulation wheel, and expression pedal. The Timbre function allows instant switching between two complete parameter setups within a single sound, greatly expanding performance possibilities.

  The Nord Lead 3 also introduced Sinus Modulation, described by Clavia as a new type of synthesis akin to FM. Combined with up to three LFOs and envelopes per voice, global vibrato, and MIDI clock sync, the instrument is capable of producing extremely thick and fat polyphonic sounds alongside complex evolving timbres.
specs: |-
  - 24-voice polyphony
  - 2 oscillator groups with 6 waveforms each (sine, saw, triangle, square/PWM, noise, synced noise)
  - Dual sine wave oscillators
  - 2/4-operator FM synthesis
  - Sinus Modulation synthesis
  - Oscillator sync and ring modulation
  - 2 multi-mode filters (LP, BP, HP, LP-HP, LP-LP, Classic)
  - 1, 2, or 4-pole filter configurations
  - Series or parallel filter routing
  - ADSR envelopes for amplitude and filter per voice
  - 2 LFOs per voice (triangle, saw, square, random, stepped random, triple-peak sine)
  - Morph function controlling up to 26 parameters
  - Timbre function for dual parameter setups
  - Unison mode without affecting polyphony
  - 49-key keyboard with velocity and aftertouch
  - 1,024 patch memory locations
  - 256 performance memory locations
  - 4-part multitimbral via MIDI
  - 4 assignable audio outputs
  - MIDI In/Out/Thru
  - Firmware upgradeable via MIDI
