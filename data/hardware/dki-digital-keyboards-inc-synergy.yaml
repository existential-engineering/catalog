description: >-
  The Synergy is a digital additive synthesizer manufactured from 1982 to 1985 by Digital
  Keyboards, Inc., a US division of Italian synth maker Crumar. It offered similar
  synthesis capabilities to the higher-end GDS model at a fraction of the price, featuring
  32 digital oscillators and additive synthesis technology derived from Bell Laboratories
  research.
details: |-
  The Synergy evolved from technology created by Bell Laboratories in the 1970s, which Digital Keyboards adapted for the Crumar General Development System (GDS) priced at $27,500. The Synergy offered similar synthesis capabilities at approximately $5,300, making advanced additive synthesis accessible to more musicians. Of the estimated 700-800 units produced, fewer than 100 remain operational today.

  Despite lacking programmability, the instrument provided 24 preset tones with expansion via 24-tone cartridges. Sound generation employed additive synthesis with phase modulation across 32 computer-controlled digital oscillators dynamically allocated per voice. The keyboard allowed simultaneous playback of up to four different tones with flexible assignment modes including unison, rotating triggers, and unique floating-split functionality.

  The Synergy featured a four-track sequencer supporting real-time recording with overdubbing capabilities and 1,860-note maximum capacity. Envelope design offered 16 stages per oscillator for both amplitude and frequency modulation with loop functionality. Later Synergy II+ models added MIDI implementation, 24 user voice RAM, and RS-232 connectivity enabling sound editing via Kaypro II computers.

  The instrument gained prominence through composer Wendy Carlos, who used it extensively on albums including Digital Moonscapes and Beauty in the Beast. The technology influenced subsequent instruments like the Mulogix Slave 32, though the Yamaha DX7's affordable programmability ultimately dominated the market.
specs: |-
  - Synthesis Type: Additive with phase modulation
  - Oscillators: 32 digital oscillators
  - Polyphony: 8 to 16 voices (variable)
  - Multitimbral: 4 parts simultaneous
  - Waveforms: Sine, Triangle
  - Envelope: 16-stage amplitude and frequency control
  - Modulation: Vibrato via joystick control
  - Effects: Portamento (polyphonic capable)
  - Sequencer: 4-track, 1,860 note capacity, volatile memory, individual track looping
  - Keyboard: 74 keys, velocity-sensitive, weighted
  - Memory: 24 preset tones; 24-tone cartridge expansion; 8 instrument settings
  - MIDI: On later models (Synergy II+)
  - Year Produced: 1982-1985
releaseDate: "1982"
