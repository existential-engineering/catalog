description: "Eight-channel mic preamp and ADAT expander featuring eight 2nd
  generation Scarlett mic preamps with 50 dB of gain, switchable 48V phantom
  power and pad on every channel, two front-panel high-headroom instrument
  inputs, eight balanced line outputs, ADAT optical output, and word clock I/O."
details: |-
  An eight-channel rack-mounted mic preamp and ADAT expander, ideal for expanding a Scarlett interface or any digital interface with ADAT inputs.

  Eight 2nd generation Scarlett mic preamps with 50 dB of gain, 48V phantom power switchable on all channels, pad switchable on every channel, and two front-panel high-headroom instrument inputs.
specs: |-
  - Eight 2nd generation Scarlett mic preamps
  - Mic Preamp Gain Range: 50 dB
  - Mic Preamp Dynamic Range: 109 dB (A-weighted)
  - Mic Preamp EIN: -127 dBu
  - 48V Phantom Power switchable on all channels
  - Pad switchable on every channel
  - Two front-panel high-headroom instrument inputs
  - Eight balanced line outputs
  - ADAT optical output
  - Word Clock I/O (BNC)
  - Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Bit Depth: 24-bit
  - 5-segment LED input metering per channel
  - 3 year warranty
