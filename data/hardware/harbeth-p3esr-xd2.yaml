description: The P3ESR XD2 is Harbeth's compact bookshelf loudspeaker, built
  around a 110mm RADIAL4 cone for clarity, natural tonal balance and precise
  bass from a small cabinet.
details: |-
  The P3ESR XD2 unlocks the full potential of Harbeth's exclusive 110mm RADIAL4 cone technology, delivering remarkable clarity, natural tonal balance and precise bass from a remarkably compact loudspeaker.

  Designed to perform across a wide range of listening environments, the P3ESR XD2 presents an easy load for amplifiers, suggested from 15W per channel, while revealing the subtle detail and emotional character within recordings.

  At the core of the P3ESR XD2 is the RADIAL4 cone, a distinctive innovation that ensures exceptional detail. Pioneering work in loudspeaker diaphragm material science set the benchmark for the acclaimed RADIAL4 cone, a revolution in clarity and detail from a drive unit.

  Each speaker in the XD2 series incorporates a newly refined crossover design. The result is a speaker that excels in tonal accuracy while offering greater depth and clarity, immersing listeners in a more lifelike musical experience.

  The cabinets are handmade from carefully selected high-quality veneers, which vary in colour, shade and grain structure, and not all finishes are available in every country. The P3ESR XD2 is designed and handmade in the UK, and ships as a pair in one protective carton.
specs: |-
  - Description: stand-mount loudspeaker
  - Drive unit: 110mm Harbeth-made RADIAL bass/mid drive unit
  - Tweeter: 19mm ferrofluid-cooled
  - Frequency range: 75Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms
  - Sensitivity: 83dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 15W per channel
  - Power handling: 50W programme
  - Connectors: 4mm Harbeth-branded binding posts
  - Space needs: ideally more than 0.30m from the rear wall
  - Stands: optimally to bring ears level with tweeters (tweeter 230mm up from cabinet base)
  - Dimensions: 306mm high, 190mm wide, 184mm deep (plus 12mm for grille and binding posts)
  - Packing: pair per protective carton
