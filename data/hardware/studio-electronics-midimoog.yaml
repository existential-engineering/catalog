description: >-
  The Studio Electronics Midimoog is a rackmount MIDI-equipped monophonic synthesizer
  built around an authentic Minimoog Model D circuit board. It faithfully recreates the
  legendary Minimoog sound with three oscillators and the classic 24 dB/octave Moog
  lowpass filter, housed in a compact rack module. Notable users include Fatboy Slim,
  Depeche Mode, Jean-Michel Jarre, and Nitzer Ebb.
details: |-
  The Midimoog represents Studio Electronics' homage to the legendary Minimoog, maintaining complete fidelity to the original design while adding modern MIDI control. Every unit houses a genuine Minimoog Model D board, ensuring the authentic analog character and rich sound quality that made the original famous.

  Three oscillators power this monophonic analog synthesizer, producing fat and warm synth basses, searing leads, and sweeping sounds that defined the Minimoog legacy. The classic 24 dB/octave lowpass Moog filter is fully intact, delivering the same powerful resonant filtering that has remained a benchmark in synthesis for decades.

  Due to the 100% analog implementation using original analog potentiometers and switch controllers, the Midimoog lacks patch memory storage. Retrofitting patch memory to the original Minimoog boards would have required a major electronic undertaking that would compromise the authentic signal path. The front panel layout mirrors the Minimoog's familiar design, making it accessible to experienced Minimoog users.

  The rack-mountability and MIDI implementation make the Midimoog an excellent choice for anyone seeking the famous warm Moog sounds in a compact, studio-friendly module. These instruments are rare and highly sought after, typically selling for thousands of dollars on the used market. When genuine Model D boards became scarce, Studio Electronics produced the MidiMini as a successor, which used newly constructed boards based on Model D specifications.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs
  - Filter: 24 dB/octave lowpass with cutoff, resonance, ADSR envelope, keyboard tracking
  - VCA: ADSR envelope
  - Patch Memory: None
  - Keyboard: None (rackmount module)
  - Arpeggiator: None
  - Sequencer: None
  - Control: MIDI
  - Form Factor: Rackmount
