details: |-
  Kick your playing into high gear with SPARK MINI BOOSTER, a stompbox-wonder for the initiated that features a completely clean boost with some serious tone enhancement under the hood once you really start cranking things.    •    A whopping 20 dB of boost    •    Revolutionary PrimeTime switching    •    Discrete Analog Circuit

  With a full 20 dB of boost, SPARK MINI BOOSTER is a great clean booster. But that’s not all it does – keep turning that knob and it’ll start working its magic driving gear into peak performance! No matter what your style or set-up, this musical miracle will maximize your potential – but let your core tone shine through completely unaltered.

  PrimeTime is a radical new feature that is exciting guitarists around the globe. Put simply, SPARK MINI BOOSTER instantly understands whether you want the pedal to be on permanently when you hit the footswitch, or just when you hold the footswitch down. Which totally rocks for both ‘always-on’ and ‘emphasizing passages’ situations.

  By adding a discrete, fully analog circuit, SPARK MINI BOOSTER adds a  purely magical sense of life and excitement to your gear and tone. Each  part of the circuit is carefully selected, from transistor to capacitor  and from resistor to diode. What does that mean? Sweet, pure tone in  all of its glory in an unparalleled clarity with zero coloration.  Whether you want to make things sing or roar, this circuit ensures to  maximize your tone.
