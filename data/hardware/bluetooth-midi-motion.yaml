name: Bluetooth MIDI Motion
manufacturer: zzsound
primaryCategory: controller
url: https://www.zzsound.net/bluetooth-midi-motion
description: Bluetooth MIDI Motion turns your iOS and ipados devices in a
  wireless motion controller. Control your iOS, ipados and desktop Bluetooth le
  MIDI DAWs, instruments and effects from your iphone and ipad.
details: |-
  Bluetooth MIDI Motion turns your iOS and ipados devices in a wireless motion
  controller. Control your iOS, ipados and desktop Bluetooth le MIDI DAWs,
  instruments and effects from your iphone and ipad.

  Up to 48 motion controllers that sends cc MIDI messages with x, y and z axes
  support.

  Push connect button and in the opened view turn on the switch button. This
  will make your device discoverable by your Bluetooth MIDI host, connect it
  from it and you will can control your MIDI host from b.m.m.

  If your MIDI host don't support Bluetooth MIDI there are some free apps on the
  market that creates virtual Bluetooth MIDI ports. B.m.m. Uses channel 4.
specs: |-
  - Up to 48 motion controllers
  - Cc MIDI messages
  - X, y and z axes
  - Bluetooth low energy MIDI
  - iOS and ipados compatible
  - Wireless motion controller
  - Bluetooth le MIDI support
  - Channel 4 operation
