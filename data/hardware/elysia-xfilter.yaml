description: Analog stereo equalizer, delivering precision, warmth, and sonic perfection.
details: |-
  xfilter is an analog 4-band stereo equalizer with Class-A topology, built for recording, mixing and mastering. Two fully parametric mid bands sit between high and low bands that work either as shelving filters or as high and low cut filters, and a switchable passive high band adds a second sound option. All of it operates in true stereo rather than as two linked mono channels.

  Using an analog EQ on a stereo bus is tricky, because very few units can link their two mono channels for true stereo processing. The main obstacle is component tolerance: the two linked channels should behave identically, but natural tolerances of potentiometers and capacitors work against that. xfilter answers it with computer-selected dual and quad layer potentiometers and special low tolerance capacitors. The gain pots carry two layers each and the frequency pots four, and every single potentiometer is measured and selected on an Audio Precision rig. For precision and easier recall, xfilter uses detented potentiometers with 41 steps.

  The outer bands are flexible. In their standard mode they are sweet sounding high and low shelf filters for tailoring the airiness and the fundamentals of a track. Each can be switched independently to become a high or low cut filter with 12 dB per octave and an additional resonance peak at the knee frequency. Bass frequencies benefit from a low cut with resonance, gaining a clean and punchy character, while in the high range the resonance filter puts an accent on a selected frequency without boosting the whole HF spectrum.

  The filter quality of the two parametric mid bands switches between two characteristics, wide (Q 0.5) and narrow (Q 1.0), based on the proportional Q principle. Those two values were chosen after extensive listening because they always result in very musical processing. Very narrow Q factors are deliberately not offered, since digital filters are the usual tool for notching out problematic frequencies.

  Beside the four active bands, xfilter carries a switchable fixed LC filter for polishing the high frequency range, with a slight resonance peak at 12 kHz that starts to fall off at 17 kHz. The storage effect of the coil focuses on the area around the peak rather than pushing the complete high frequency spectrum, and the inductors have their own shields to reduce hum and other unwanted noise. That switch is the Passive Massage. The PCBs have four layers: two for the audio circuitry, one for power supply traces, and a dedicated ground shield layer placed extremely close beneath the audio traces, which matters because the filter networks of the lower bands rise in resistance and become more vulnerable to hum from electric fields.
specs: |-
  - 4 individual bands for precise frequency control
  - Two fully parametric mid bands with switchable Q factor, wide (Q 0.5) or narrow (Q 1.0), proportional Q principle
  - High and low shelf outer bands, each switchable to a 12 dB per octave cut filter with a resonance peak at the knee frequency
  - Switchable passive LC high band (Passive Massage) with a resonance peak at 12 kHz, falling off at 17 kHz
  - True stereo link with computer-selected dual and quad layer potentiometers and low tolerance capacitors
  - Detented potentiometers with 41 steps
  - Class-A topology
  - Four-layer PCB with a dedicated ground shield layer
  - Frequency response: <10 Hz - 400 kHz (-3.0 dB)
  - THD+N @ 0 dBu, 20 Hz - 22 kHz: 0.006 %
  - THD+N @ +10 dBu, 20 Hz - 22 kHz: 0.01 %
  - Noise floor, 20 Hz - 22 kHz (A-weighted): -98 dBu
  - Dynamic range, 20 Hz - 22 kHz: 112 dB
  - Level: input +21 dBu, output +21 dBu
  - Impedance: input 10 kOhm, output 68 Ohm
  - Dimensions (W x H x D, incl. knobs), 1 RU rack: 19" x 1.75" x 9.4" (483 mm x 44.45 mm x 238 mm)
  - Dimensions (W x H x D, incl. knobs), elysia qube: 4.09" x 5.39" x 8.4" (104 mm x 137 mm x 212 mm)
  - Weight, 1 RU rack: 3.88 lbs / 1.76 kg
  - Weight, elysia qube: 3.17 lbs / 1.46 kg
  - Power consumption: 16 Watts (1 RU rack), 10 Watts (elysia qube), 210 mA (500 series module)
