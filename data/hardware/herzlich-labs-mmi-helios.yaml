description: The MMI Helios is a passive touch controller module with two I/O
  jacks, either of which can act as input or output, forming connections when
  both touch plates are touched simultaneously. It complements other MMI devices
  and can be joined with additional Helios units for larger control surfaces.
details: |-
  Drawing inspiration from the MMI Maxima, the MMI Helios is intended as a middle ground between the gestural control surface of the Maxima and the fingertip control of the smaller MMI. Less density, but a much higher degree of patch control is the key point of the Helios, which complements other MMI devices very well, and can be joined with other Helios (Helii?) to form larger and creative control surfaces. The design is greatly simplified compared to the original MMI, with only two I/O jacks - either can function as input and output, and their interaction with each other is determined by touching both plates simultaneously to form a connection, or in cooperation with other MMI devices. Available in a "right" and "left" version - one is an exact mirror image of the other, which makes it suitable for having two units adjacent to one another.
