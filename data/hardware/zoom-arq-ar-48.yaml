description: The AR-48 lets you craft music you can be proud of, using its 460
  built-in sounds or your own samples to create beats and sequences.
details: |-
  The ARQ AR-48 is a two-part production and performance instrument: a Base Station that holds the sound engine, the sequencer, the effects and all the connectors, and a detachable Ring Controller that sits on top of it. The ring layout means a pattern is laid out as a true loop, so a sequence can be read at a glance rather than as a row of steps.

  The Sound section carries 460 customisable drum, instrument and vocal sounds alongside a programmable synthesizer engine with three sub-oscillators, and WAV files can be imported into that oscillator. Sounds can be played chromatically or through dozens of preset scales in any key, and parameters are edited against the section's own LCD.

  The Sequence section drives a built-in 32-step loop sequencer. Patterns can be captured live by hitting record or programmed with dedicated step-input buttons, with Swing and Tempo applied to any sequence, and up to 384 patterns and 99 songs are stored. The Rec/Play section records and saves songs, captures audio and records motion sequences.

  The Effect section offers 16 adjustable Master Effects, including reverb, high-pass and low-pass filters, delay and bit crush, usable during song and pattern playback. Audio capture samples from patterns and songs, from the SD card or from an incoming audio signal, so a favourite track can be sampled and beats built around it.

  The Ring Controller carries 16 velocity and pressure-sensitive pads with programmable colour LEDs, switchable between PAD and SCALE layouts, plus dedicated buttons for play and pause, solo, mute, split, arpeggiate and effect changes. Grip Detection stops the pads triggering when the ring is picked up. Lifted off the base and held as an aerial instrument, its 3-axis accelerometer triggers and modulates effects such as delay and reverb, with each axis assignable to a chosen parameter.

  The Base Station takes a 3.5 mm stereo audio input for phrase recording and loop creation, and puts sound out over two 1/4-inch line outputs and a 3.5 mm headphone jack with its own volume control. A 5-pin DIN MIDI OUT drives external instruments, a USB port handles computer integration and USB-MIDI, a second USB Type-A socket connects the Ring Controller, and an SD card slot holds the media. Power comes from the included AD-14 5 V adapter, the ring running on USB bus power or two AA batteries, and the optional BTA-1 adapter makes the ring wireless.
specs: |-
  - 460 built-in drum, instrument and vocal sounds, plus user samples
  - Programmable synthesizer engine with three sub-oscillators. WAV files can be imported into the oscillator
  - Onboard 32-step loop sequencer for patterns or complete songs, with Swing and Tempo
  - Storage: up to 384 patterns and 99 songs
  - 16 adjustable Master Effects, including reverb, high-pass and low-pass filters, delay and bit crush
  - Audio capture from patterns and songs, from SD card, or from an incoming audio signal
  - Ring Controller: 16 velocity and pressure-sensitive pads with programmable colour LEDs, 4 velocity curves
  - Ring Controller: 3-axis accelerometer, assignable per axis to effect parameters
  - Grip Detection prevents accidental note triggering when the ring is picked up
  - PAD and SCALE layouts, play chromatically or from dozens of preset scales in any key
  - Audio Input: stereo mini jack (unbalanced), input gain +10 to -65 dB, input impedance 10 kohms
  - Output L/R: standard mono phone jacks (unbalanced), output impedance 100 ohms
  - Phones: stereo mini jack, 20 mW into 32 ohm load, output impedance 10 ohms
  - Dynamic range: analog in (AD) 92 dB typ (IHF-A), phone out (DA) 102 dB typ (IHF-A), main out (DA) 106 dB typ (IHF-A)
  - MIDI: MIDI OUT on a 5-pin DIN jack, plus USB MIDI
  - Recording media: 16MB to 2GB SD cards, 4GB to 32GB SDHC cards, 64GB to 512GB SDXC cards
  - Base Station interface: USB 2.0 Type B, MIDI class and mass storage class. USB 2.0 Type A for the Ring Controller connection
  - Supported operating systems: Windows 7 (SP1 or later), Windows 8 or 8.1 or later, Windows 10, Mac OS X 10.8 or later
  - Minimum host specification: chipset with USB 2.0 as standard, Intel Core i3 or faster CPU
  - Base Station displays: two 128x32 dot-matrix LCDs
  - Base Station power: 5 V 1 A AC adapter (AD-14). Consumption 2 W maximum, 3 W maximum when powering the Ring Controller
  - Base Station dimensions: 259.0 mm (D) x 257.6 mm (W) x 63.0 mm (H), weight 1123 g
  - Ring Controller power: USB bus power, or 2 AA alkaline or NiMH rechargeable batteries, about 8 hours with the BTA-1 installed. Consumption 1 W maximum
  - Ring Controller dimensions: 280.2 mm (D) x 278.8 mm (W) x 29.7 mm (H), weight 416 g
  - In the box: Base Station (AR-48), Ring Controller (AR-48c), AC adapter (AD-14), Operation Manual
  - Bundled software: Ableton Live 9 Lite
  - Optional accessories: BTA-1 Bluetooth LE Connector, Zoom Creator Bag (CBA-96)
