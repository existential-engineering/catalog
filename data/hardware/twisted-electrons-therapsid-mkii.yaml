description: >-
  A handcrafted three-voice paraphonic synthesizer from 2017 built around the Commodore 64 SID chip,
  featuring 35 knobs, 33 buttons, and CV/Gate connectivity for hands-on sound design.
details: |-
  The Twisted Electrons TherapSid MKII is a handcrafted desktop synthesizer that harnesses the iconic
  SID sound chip from the Commodore 64 to produce aggressive, cutting digital tones. Released in 2017
  as an evolution of the 2014 original, the MKII adds CV/Gate control, MIDI output, paraphonic
  three-voice capability, a preset randomizer, and enhanced arpeggiator functionality.

  The design philosophy prioritizes direct physical control over menu-driven interfaces, providing 35
  knobs and 33 buttons for immediate access to all synthesis parameters without a single LCD screen
  or menu layer. Three VCOs produce sawtooth, square, triangle, and white noise waveforms, processed
  through a single VCF that gives the instrument its characteristically aggressive filtering.

  Three LFOs offer extensive modulation with envelope, sample and hold, sawtooth, square, and
  triangle waveforms in both free-running and key-synced modes. The arpeggiator supports up, down,
  up/down, and random patterns. Ninety-nine patch memories store complete sound configurations in
  RAM, and the preset randomizer encourages sonic experimentation by generating unexpected parameter
  combinations.

  The TherapSid accepts various SID chip versions, allowing users to install their preferred chip
  variant for different tonal characteristics. This interchangeability gives each unit a slightly
  unique voice depending on the specific chip installed.
specs: |-
  - Polyphony: 3 voices (paraphonic)
  - Multitimbral: 3 parts
  - Oscillators: 3 VCOs (sawtooth, square, triangle, white noise)
  - Filter: 1 VCF
  - LFO: 3 (envelope, sample & hold, sawtooth, square, triangle)
  - Envelopes: 3 ADSR
  - Arpeggiator: Up, down, up/down, random
  - Memory: 99 patches RAM
  - Controls: 35 knobs, 33 buttons
  - Control: MIDI In/Out, CV In/Out
