description: The SampleTrak ST-224 is a pad-based sampler built around eight velocity pads in three banks, an internal sequencer and a 22-effect processor, recording in mono or stereo at one of three grades (32 kHz, 16 kHz or 8 kHz). Effects can be assigned to individual pads, and auto sync matches a pad's tempo to a nominated master pad.
details: |-
  The ST-224 is Zoom's SampleTrak, a pad-based sampler built around eight velocity pads in three banks, an internal sequencer and a 22-effect processor running on Zoom's own ZFX-2 DSP. Conversion is 18-bit in and out, and the sampling grade is chosen per recording: Hi-Fi at 32 kHz, STANDARD at 16 kHz or Lo-Fi at 8 kHz, in mono or stereo, which trades sound quality against time. Total mono recording time runs from 60 seconds at Hi-Fi to 240 seconds at Lo-Fi, with a single sample capped at 30 to 120 seconds on the same scale, and eight samples can sound at once.

  Sampling comes in through two switchable line or mic inputs on the rear panel, with an input knob and a peak LED on the front, and the SOURCE pad routes the live input through the instrument alongside the sampled pads. Each pad carries its own start and end point, loop and mark points, bar length, tuning, level, panning, reverse playback, trigger, retrigger or gate behaviour and MIDI assignment. Samples can also be imported from a data card as 8 or 16-bit WAV or AIFF files at any rate from 8 to 48 kHz, named 01 to 99, and re-sampling records a phrase back into memory in the digital domain with its effects and sequencer performance baked in.

  The effects section is a 22-type processor selected with a rotary switch and an A/B bank key, assignable to any combination of pads rather than only across the whole output. It covers TIME STRETCH, SCRATCH, DELAY, REVERB, FLANGER, STEP CRY, CHORUS, PHASER, PITCH SHIFTER, DIMENSION, DISTORTION, RING MODULATOR, LOW-PASS, HIGH-PASS, EXTREME EQ, RESONANCE, LO-FI, COMPRESSOR, TREMOLO, AUTO PAN, VOLUME/BASS and EXCITER. An EDIT 1 wheel and EDIT 2 knob move two parameters per effect live while a pad is struck, and the EFFECT SYNC key locks rate-type parameters such as delay time, flanger rate and auto-pan cycle to the effect BPM.

  The sequencer records pad performances as eight songs, up to 300 bars in total and about 5000 notes, at 24 clocks per quarter note over a tempo range of 40 to 250 BPM, with quantize, swing, shift, offset, time signature and precount settings. PLAYLIST assigns whole songs to pads 1 to 8 so they can be fired live, which is the DJ-facing half of the design. Auto sync matches the BPM of a pad's sample to a nominated master pad, stretching or compressing length without changing pitch, or in rESMPL mode re-sampling with pitch shift applied, so a loop lifted off a CD lines up with a bass pattern.

  Storage uses three tiers: volatile main memory for the working set, non-volatile backup memory for one complete bulk set that reloads at power-on, and an optional SM04 data card in the rear slot holding up to 99 bulk sets plus importable WAV and AIFF files. The rear panel also carries a MIDI IN jack, which takes note, control change, program change, song select and clock messages, so pads, effect parameters, effect type and the sequencer can all be driven from an external sequencer. The unit measures 290 x 192 x 60 mm, weighs 1.1 kg and runs on 9 V DC at 300 mA from the supplied AD-0006A adapter.
specs: |-
  - 18-bit A/D and 18-bit D/A conversion, ZOOM original ZFX-2 DSP
  - Sampling frequency by grade: Hi-Fi 32 kHz, STANDARD 16 kHz, Lo-Fi 8 kHz, selectable mono or stereo
  - Total recording time (mono): Hi-Fi 60 s, STANDARD 120 s, Lo-Fi 240 s
  - Maximum recording time per sample: Hi-Fi 30 s, STANDARD 60 s, Lo-Fi 120 s
  - Maximum 8 simultaneous samples
  - 8 pads x 3 banks plus a SOURCE pad for the live input
  - Per-pad parameters: start point, end point, loop and mark, bar length, tuning, level, panning, reverse playback, trigger / retrigger / gate mode, MIDI assignment
  - 22 built-in effects (11 x 2 banks): TIME STRETCH, SCRATCH, DELAY, REVERB, FLANGER, STEP CRY, CHORUS, PHASER, PITCH SHIFTER, DIMENSION, DISTORTION, RING MODULATOR, LOW-PASS, HIGH-PASS, EXTREME EQ, RESONANCE, LO-FI, COMPRESSOR, TREMOLO, AUTO PAN, VOLUME/BASS, EXCITER
  - Effects assignable to individual pads or to the live input, with EDIT 1 wheel and EDIT 2 knob for real-time parameter control
  - EFFECT SYNC locks rate-type effect parameters to the effect BPM
  - Delay time up to 505 ms, PITCH SHIFTER range plus or minus 1 octave
  - Sequencer: 8 songs, about 5000 recorded notes, 300 bars total, resolution 24 clocks per quarter note
  - Tempo 40 to 250 BPM with tap tempo
  - PLAYLIST assigns songs to pads 1 to 8 for real-time triggering
  - Auto sync matches a pad's BPM to a master pad, with length change without pitch change, or rESMPL mode using pitch shift
  - Re-sampling records pad and sequencer performances with effects back into memory in the digital domain
  - Controls: EDIT 1 wheel, EDIT 2 knob, EFFECT TYPE SELECT knob, INPUT knob, OUTPUT knob
  - Display: 6-column 7-segment LED
  - Inputs: LINE/MIC L/MONO and R on standard mono phone jacks with a LINE/MIC selector, impedance 20 kohm, rated input level -10 dBm line and -56 dBm mic
  - Outputs: LINE L/MONO and R on standard mono phone jacks, impedance 1 kohm maximum, maximum output level +6 dBm
  - Headphones: standard stereo phone jack, 50 mW into 32 ohm
  - Memory: volatile main memory, internal backup memory for one bulk data set, and an optional data card for up to 99 bulk sets
  - Data card import of 8 or 16-bit linear WAV and AIFF files at 8 to 48 kHz, mono or stereo, up to 1900 KB, named 01 to 99 in the card root
  - MIDI IN recognizes note on and off, polyphonic key pressure, control change (effect parameters 1 and 2, effect BPM, effect on/off), program change 0 to 21 for effect type, song select 0 to 7 and MIDI clock
  - Power: 9 V DC, 300 mA from the supplied dedicated AC adapter AD-0006A
  - Dimensions 290 mm (W) x 192 mm (D) x 60 mm (H), weight 1.1 kg
  - Supplied: instruction manual, sound list, warranty card, AC adapter, sample CD. Optional: SM04 data cards
