details: |-
  Features The SONIC BLUE TWANGER promises rhythm guitarists an edge and lead guitarists a limiting distortion effect similar to the iconic 'blackface' amps. This pedal can be used as a preamp, booster or distortion pedal. Whether you use it in your backline for your live shows or just want that classic 'blackface' sound, this pedal promises a recognizable and mesmerizing tone. Regardless of which amp you use, the SONIC BLUE TWANGER is the only effect pedal on the market to satisfy your need. Specifications Input impedance: 500K Output impedance: 6K Drive voltage: 9V Current consumption: 2.5mA @ 9V S/N ratio: -80db rhythm / -74 db lead Size:39Wx100Dx31H mm (excluding protruding parts) 47Wx100Dx46H mm (including protruding parts) Weight: Approx. 160 grams True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply

  Bjorn's Description The SONIC BLUE TWANGER is another design in the Amp-In-A-Box' series by One Control and BJF. As with many of the BJF designed pedals from One Control, the SONIC BLUE TWANGER is compact with 4 simple controls. The Treble control is really a tone balance (like on the original amplifiers) which increases and decreases a 'shelved' EQ setting. Volume and Master controls work as pre and post volumes allowing you to vary the amount of clean headroom and distortion in the signal. Finally, on the side of the pedal is a Rhythm/Lead switch. In Rhythm mode, the pedal provides about 18dB of gain (-80dB noise level), and in Lead, about 40dB of gain (-74 dB noise level). Whether you are using the SONIC BLUE TWANGER as a preamp with any of the other BJF overdrive or distortion pedals, or as a stand-alone effect to achieve a more American sound, the SONIC BLUE TWANGER will take you back to the 'blackface' days at any volume. - Bjorn Juhl

