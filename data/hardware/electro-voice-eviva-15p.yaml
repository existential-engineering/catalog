name: EVIVA 15P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/eviva-15p/
description: The EVIVA 15P is a 15-inch portable powered loudspeaker aimed at
  aspiring musicians, DJs, and small venues. A 1000 W amplifier drives a 15-inch
  WECA2154H ferrite woofer and a 1-inch DENA2504H neodymium compression driver
  with titanium-coated PEI diaphragm, behind Electro-Voice's patented SST
  (Signal Synchronized Transducers) waveguide, delivering up to 126 dB SPL with
  90 x 60 degree coverage. Dual MUSIC/LIVE DSP modes and a switchable NO SUB /
  WITH SUB high-pass filter (for use with the EVIVA 18SP subwoofer) tailor the
  sound to the application. The composite enclosure includes side and top
  handles, a bottom grab pocket, anti-skid feet, and a half-face powder-coated
  steel grille. Two XLR combo mic/line inputs, a switchable mono/stereo mix XLR
  output, and Bluetooth audio streaming round out the I/O.
details: >-
  1000 W amplifier delivering up to 126 dB SPL at 1 m


  15-inch WECA2154H ferrite-magnet woofer


  1-inch DENA2504H neodymium compression driver with titanium-coated PEI
  diaphragm


  EV-patented Signal Synchronized Transducers (SST) waveguide design


  Dual MUSIC and LIVE DSP modes


  Single-knob input adjustment with dual-color signal metering and peak
  detection


  Switchable NO SUB / WITH SUB high-pass filter for use with the EVIVA 18SP
  subwoofer


  Bluetooth audio streaming with switchable mono/stereo mix output


  Two XLR combo mic/line inputs and one XLR mix output


  Composite enclosure with half-face powder-coated steel grille


  Side and top handles, bottom grab pocket, and anti-skid feet


  Universal voltage mains input with auto-switching (100-240 V)


  Lightweight design at 14.6 kg (32.2 lb) for single-person setup


  Stackable and combinable with other EVIVA family loudspeakers
