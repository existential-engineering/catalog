description: Instantly recognisable, bestselling angled 4x12" guitar speaker
  cabinet from Marshall. Loaded with four 12" Celestion G12T-75 speakers, the
  1960A is the angled-baffle half of the iconic 1960 cabinet pair — designed to
  project on-stage and pair with classic Marshall heads. It handles 300W in mono
  and 150W per side in stereo, with switchable mono/stereo operation at 16/4Ω
  mono or 8Ω stereo via two 1/4-inch speaker inputs.
details: |-
  One of the world's bestselling 4x12" cabinets, famed for its excellent sound. This cabinet is designed to deliver a big sound for live performances. The 1960A cabinets have an authentic 60s design and pack plenty of power with 300W.

  The 1960A will give you a brighter sound when compared to its straight (1960B) counterpart. Alternatively, you can pair the 1960A and 1960B together to create the perfect Marshall stack.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Built in Marshall's UK factory
  - Four 12-inch Celestion G12T-75 speakers
  - Can be configured in mono or stereo
  - Model: 1960A 4x12 angled cabinet
  - Inputs: 2
  - Speaker configuration: 4x12"
  - Power handling: 300W mono, 150W stereo
  - Speaker model: Celestion G12T-75 (16 ohm, 75W)
  - Unit impedance: 16/4 ohm mono, 8 ohm stereo
  - Passive cabinet, no mains supply and no power input
  - Weight: 36.5 kg / 80.5 lb
  - Width: 770 mm / 30.3"
  - Height: 755 mm / 29.7"
  - Depth: 365 mm / 14.4"
  - Country of origin: Designed and engineered in UK. Made in UK.
