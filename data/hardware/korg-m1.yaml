description: >-
  The groundbreaking digital workstation that defined the sound of late-1980s and early-1990s pop,
  dance, and electronic music with its sample-based AI Synthesis engine, onboard sequencer, and
  versatile multi-effects processing.
details: |-
  When Korg released the M1 in 1988, it fundamentally changed what musicians expected from a single keyboard instrument. By combining a capable PCM-based sound engine with an 8-track sequencer, multi-effects processing, and an intuitive interface, the M1 became the best-selling synthesizer workstation of its time and one of the most commercially successful keyboards ever produced.

  At its core, the M1 uses what Korg called AI (Advanced Integrated) Synthesis — a 4MB bank of multisampled PCM waveforms shaped by analog-style editing tools including a variable digital lowpass filter and multiple envelope generators. The 144 built-in multisampled sounds covered an unusually broad range, from convincing acoustic pianos and orchestral textures to punchy digital basses and the iconic M1 Piano patch that became ubiquitous across countless recordings.

  The onboard digital multi-effects section was a genuine differentiator for its time, offering reverb, delay, chorus, overdrive, rotary speaker simulation, and EQ — eliminating the need for external rack processors in many studio and live setups. With 8-part multitimbral capability and 16-voice polyphony, the M1 could handle complex arrangements entirely on its own. An optional EXK-M1 expansion card doubled the PCM memory to 8MB, and a rack-mount M1R version served studios where keyboard action was unnecessary.

  The M1's influence on popular music was enormous. Its presets became defining sonic signatures for artists like Depeche Mode, Pet Shop Boys, Vangelis, The KLF, and Plastikman. The distinctive M1 organ and piano patches alone appear on hundreds of hit records from the late 1980s and early 1990s, cementing the instrument's place in music history.
specs: |-
  - Polyphony: 16 voices
  - Sound Engine: AI Synthesis with 4MB PCM waveforms (144 multisampled sounds)
  - Filter: Variable digital lowpass (non-resonant, velocity sensitive)
  - VCA: VDA with 3 independent 4-stage ADSR envelopes
  - Effects: Digital multi-effects (reverb, delay, overdrive, EQ, chorus, rotary, and more)
  - Keyboard: 61 keys with velocity and aftertouch
  - Sequencer: 8-track
  - Multitimbral: 8 parts
  - Memory: 100 patches
  - Control: MIDI (8 parts)
  - Expansion: Optional EXK-M1 doubles PCM to 8MB
  - Date Produced: 1988–1994
