description: The Academy 10e is an entry-level acoustic-electric dreadnought
  from Taylor's Academy Series, featuring a solid torrefied spruce top, layered
  walnut back and sides, a slender neck profile for beginners, and ES-B
  electronics with a built-in chromatic tuner.
details: |-
  The Academy 10e combines a solid torrefied spruce top with layered walnut back and sides in a dreadnought body, designed to encourage beginners with comfortable playability. The slender neck profile and 1-11/16" nut width make chord fretting easier, while the 24-7/8" scale length reduces string tension. A beveled walnut armrest improves playing comfort.

  Taylor's ES-B pickup system provides amplified sound with a built-in digital chromatic tuner — stage- and practice-ready out of the box. Matte finish on the body, tortoise pickguard, and die-cast chrome tuners keep the aesthetic clean and functional.

  Ships with a gig bag and D'Addario XS Coated Phosphor Bronze Light strings.
specs: |-
  - - Body shape: Dreadnought
  - Top: Torrefied Spruce (solid, matte)
  - Back/sides: Walnut (layered, matte)
  - Bracing: X
  - Neck: Mahogany, Standard Carve (satin)
  - Fretboard: Ebony
  - Bridge: Eucalyptus
  - Armrest: Beveled walnut
  - Scale length: 24-7/8"
  - Nut width: 1-11/16"
  - Tuners: Die-cast Chrome
  - Inlays: Faux Pearl 4mm dots
  - Pickguard: Tortoise
  - Electronics: ES-B with built-in digital chromatic tuner
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Gig bag included
