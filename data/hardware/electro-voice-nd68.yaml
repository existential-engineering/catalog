description: Large-diaphragm dynamic supercardioid kick drum and low-frequency
  instrument microphone. Delivers deep lows with a relaxed midrange and
  high-frequency punctuation for top-end definition, with excellent acoustic
  isolation from nearby instruments.
details: >-
  The ND68 is a robust, high-performance, large-diaphragm dynamic supercardioid
  microphone in Electro-Voice's ND Series, designed specifically for kick drum
  and other low-frequency instrument sources. Its voicing emphasizes deep lows
  with a relaxed midrange while preserving high-frequency detail for top-end
  punctuation, so engineers can capture both the chest-thump and the click of
  the beater with minimal corrective EQ.


  The supercardioid polar pattern provides tight off-axis rejection, giving
  excellent acoustic isolation from cymbals, toms, and other nearby sources on a
  crowded stage. A humbucking coil guards against line hum from lighting rigs
  and other electromagnetic interference, and the Memraflex grille is engineered
  to resist denting from stray beater impacts and rough handling.


  The ND68 handles extremely high SPL (rated above 140 dB) without distortion,
  making it well-suited to powerful kick drums and amplified low-frequency
  cabinets. It uses a die cast zinc body with a black polyurethane paint finish
  for durability. At 143 mm tall, 60.8 mm maximum diameter and 0.374 kg, it is a
  compact, road-ready package. Output is via a standard balanced 3-pin XLR
  connector at 150 ohms, and the microphone is passive (no phantom power
  required).
