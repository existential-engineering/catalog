details: |-
  The SideArm Overdrive is Catalinbread's take on the classic '79 green overdrive. Its four controls — MIDS, VOL, TONE, and DRIVE — let you dial in the exact amount of midrange color and treble tilt to fit your specific rig.

  The MIDS control sits at the classic green overdrive frequency of 720Hz. The TONE knob centers at 1kHz for a natural tilt EQ response. Power accepts 9-18V DC center-negative. Limited to 50 units in Batch 1. Includes a 3-year warranty.
