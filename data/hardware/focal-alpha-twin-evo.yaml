description: Alpha Twin Evo features excellent dynamics, neutral tonal balance and wide dispersion, enabling it to maintain an identical sound signature over a wide sweetspot. Thanks to its diverse features, this monitoring loudspeaker is versatile, satisfying the need for high sound performance as well as precision across the entire frequency spectrum.
details: |-
  Alpha Twin Evo features excellent dynamics, neutral tonal balance and wide dispersion, enabling it to maintain an identical sound signature over a wide sweetspot. Thanks to its diverse features, this monitoring loudspeaker is versatile, satisfying the need for high sound performance as well as precision across the entire frequency spectrum.

  Focal technologies: behind a modern, compact design, the 25 mm aluminium tweeter and 16.5 cm Slatefiber woofers, Focal innovations made in France, deliver precise, distortion-free treble and perfectly balanced midrange.

  Polyvalence: disengageable auto-sleep mode, XLR, TRS and RCA inputs, bass and treble level settings. The wide range of functions on offer ensures versatility of use.

  Positioning: the monitor is positioned horizontally and a switch on the rear panel chooses which woofer will produce the midrange. Focal recommends keeping the midrange driver inside, on the right for the left loudspeaker and on the left for the right.

  Manufactured by Focal, the inverted dome tweeter has been a signature since 1981. Aluminium increases the rigidity of the dome and reduces distortion. Exclusive to Focal and made in France, the Slatefiber cone is made of recycled carbon fibers and thermoplastic polymer.
specs: |-
  - Product type: 2.5-way monitor
  - Woofer: 2 x 6.5" Slatefiber membrane
  - Tweeter: 1" aluminium inverted dome
  - Frequency response (+/- 3dB): 38 Hz - 22 kHz
  - Maximum SPL (peak @ 1m): 108 dB
  - High frequency amplifier: 30 W, class D
  - Mid-range and low frequency amplifier: 2 x 50 W, class D
  - Inputs: TRS symmetrical 10 kOhms, XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, midrange driver selector (right/left), LF Shelv, HF Shelv
  - Power On LED
  - Local supply: 100 - 240V (T2AL fuse/250V)
  - On/Off switch on the rear panel
  - Height: 26 cm / 10.24 in
  - Width: 55 cm / 21.65 in
  - Depth: 29 cm / 11.41 in
  - Weight: 12.2 kg / 26.9 lb
