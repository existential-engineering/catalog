description: Active 2.5-channel studio monitor with dual 6.5" Slatefiber woofers
  and a 1" aluminum inverted dome tweeter, designed for high-SPL nearfield
  monitoring.
specs: |-
  - Active 2.5-channel studio monitor
  - Woofers: 2 × 6.5" Slatefiber membrane
  - Tweeter: 1" Aluminum inverted dome
  - Frequency response (±3 dB): 38 Hz – 22 kHz
  - Maximum SPL (peak @ 1 m): 108 dB
  - High frequency amplifier: 30 W class D
  - Mid-bass amplifier: 2 × 50 W class D
  - Dimensions (H × W × D): 26 × 55 × 29 cm (10.24 × 21.65 × 11.41 in)
  - Weight: 12.2 kg (26.9 lb)
