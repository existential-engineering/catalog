description: Rack-format PROFILER with integrated 600-Watt power amplifier for
  professional stage and studio use.
details: |-
  The KEMPER PROFILER PowerRack is the rack-mount version of the world-renowned PROFILER guitar amplifier and effects processor, delivering the same acclaimed PROFILING technology in a 3U rack-format enclosure. It captures the complete sonic character of virtually any guitar amplifier through its proprietary PROFILING process.

  The PowerRack integrates a built-in 600-Watt power amplifier, enabling direct connection to guitar speaker cabinets without requiring an external power amp. At 8 ohms the amp delivers 600 watts, and at 16 ohms it delivers 300 watts.

  Like all PROFILER models, the PowerRack includes a comprehensive effects engine with wah, distortion, EQ, compressor, modulation, delay, and reverb effects. It supports up to eight USB audio channels (MK 2) with Windows and macOS, and includes S/PDIF I/O for digital connectivity.

  The PROFILER PowerRack connects to the optional PROFILER Remote foot controller via a standard Ethernet/RJ45 cable, and is managed using the free Rig Manager software.
specs: |-
  - Form factor: 3U rack-mount (3 HE)
  - Dimensions: 48.3 cm W × 22 cm D × 13.9 cm H
  - Weight: 6.18 kg (13.62 lbs)
  - Integrated power amplifier: 600W at 8 ohms, 300W at 16 ohms
  - Front INPUT: 1/4-inch TS unbalanced, 127 dB dynamic range, 1 megohm impedance
  - Alternative INPUT: 1/4-inch TRS balanced with ground lift, 111 dB dynamic range
  - RETURN: XLR balanced and 1/4-inch balanced with ground lift
  - MAIN OUTPUT L/R: XLR balanced and 1/4-inch TS unbalanced, +4 dBu
  - MONITOR OUTPUT: 1/4-inch TS unbalanced with ground lift, +4 dBu
  - DIRECT OUTPUT/SEND: 1/4-inch TS unbalanced, +4 dBu, >108 dB dynamic range
  - HEADPHONE: 1/4-inch TRS stereo, 32–600 ohms, 330 mW at 32 ohms
  - Power Amp SPEAKER OUTPUT: 600W at 8 ohms, 300W at 16 ohms
  - S/PDIF Input/Output: 44.1/48/88.2/96 kHz (24-bit), RCA connectors
  - USB audio: 8 channels (MK 2) at 44.1 kHz
  - USB: USB 2.0, USB-A and USB-B connectors
  - SWITCH/PEDAL: Two 1/4-inch TRS, switch or expression pedal
  - MIDI IN/OUT/THRU: 5-pin DIN connectors
  - Network: RJ45 connector
  - Line Voltage: 100–125 V or 190–245 V AC, max 10 A
  - Operating Temperature: 5° to 45° C
