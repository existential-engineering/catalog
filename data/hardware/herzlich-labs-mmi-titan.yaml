description: The MMI Titan is a standalone touch controller with gold
  touch-sensitive pattern panels acting as inputs and outputs for audio, LFO,
  CV, trigger, gate, offset or clock signals, plus two stereo filters usable as
  high pass, low pass or passive bandpass filters. It requires no external power
  to operate.
details: |-
  For those exploring on the frontiers of sonic research, the MMI Titan is here to aid you in your search. Intricate gold patterns form mazes of touch sensitive surface areas, each able to act as input/output. Drag, rub, pinch or tap your fingers across the panels to form connections, and create evocative and unique performances. Utilize the unique pattern of each panel in relation with one another to create otherworldly performances, or use conductive materials to form connections on the panels as you play. Operation is easy: simply plug any audio, LFO, CV, trigger, gate, offset or clock into any of the inputs on the front panel, and connect one or several outputs to destinations in your system. Connect multiple at the same time to achieve liquid, gradual mixing, evolving rhythmic patterns, mixed LFOs and more. Furthermore, touch the pressure plates more firmly or in more dense areas to form stronger connections - in practice, this means a signal will pass with more or less intensity, based on the pressure you apply. Additionally, two stereo filters allow you to operate a high pass filter, low pass filter, or use them in unison for a passive bandpass filter. The filters can give your performance an extra dimension, or simply serve as a utility in a greater patch, as you choose. With no external power needed, it makes an excellent performance companion for any system, big or small, modular, semi-modular or even not-modular-at-all. Intended as a controller for musicians and non-musicians alike, the MMI Titan seeks to inspire curiosity and experimentation, and invites happy accidents, as opposed to playing flawlessly. Let your hands, slices of pickled cucumber or other conductive everyday objects do the talking, through a combination of clever patching and expressive play - with the MMI Titan, you have a performance and sound exploration tool unlike any other at your disposal. The MMI Titan comes in a custom case, and does not require external power to operate.
