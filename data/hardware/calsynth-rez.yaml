details: |-
  FEATURING A MATTE BLACK ALUMINUM PANEL

  Rez is a 1:1 full-size replica of the Mutable Instruments Rings resonator, using the same circuit and firmware with identical functionality. Rings is a modal resonator: it takes an audio or trigger input and resonates it through physical models of strings, membranes and tubes, with control over frequency, structure, brightness, damping and position. Three synthesis models, plus polyphonic modes for one, two or four voices, and odd/even stereo outputs. Built by hand in California. With an anodized aluminum panel, genuine Rogan knobs, real Alpha pots and the same components as the original, it is as close as you can come in a new build. Manual: Mutable Instruments Rings documentation
specs: |-
  - 14hp, 25mm deep — skiff friendly
  - Same circuit and firmware as the original
  - Runs any alternative firmware the original can
  - Anodized matte black aluminum panel (also available in silver)
  - Genuine Rogan knobs and Alpha pots
  - Fully tested and calibrated before shipping
  - 2-year Calsynth warranty
