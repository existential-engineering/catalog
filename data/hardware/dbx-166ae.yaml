description: The dbx 166AE is a discontinued dual-channel
  compressor/limiter/gate in the 166 series, featuring OverEasy® compression,
  PeakStop™ limiting, and a noise gate in a 1U rackmount unit. It was designed
  as a cost-effective professional dynamics solution for studio and live sound
  applications.
details: |-
  The 166AE is part of dbx's long-running 166 compressor/limiter/gate series, providing dual-channel dynamics control in a single rack space. The AE revision maintained the core OverEasy® compression and PeakStop™ limiting from the earlier 166A while updating circuitry for improved performance.

  OverEasy® compression uses a soft-knee characteristic that transitions smoothly into compression, avoiding the abrupt gain change of hard-knee designs and producing more natural, transparent dynamics control. The PeakStop™ limiter acts as an absolute ceiling to prevent downstream overload, while the gate section attenuates noise between program passages.

  Channels operate independently or link for stereo program material, making the 166AE suitable for stereo bus compression, drum room control, vocal limiting, and a wide range of professional applications.
