description: Expressive 20W valve guitar amplifier head with Powerstem power
  reduction technology, allowing operation at 20W, 3W, or 0.5W without changing
  sonic character. Features Tilt control to blend between normal and high-treble
  voicings, footswitchable gain boost, and an effects loop for pedal
  integration. Ships with a 2-way footswitch.
