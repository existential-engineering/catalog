description: Expressive 20W valve guitar amplifier head with Powerstem power
  reduction technology, allowing operation at 20W, 3W, or 0.5W without changing
  sonic character. Features Tilt control to blend between normal and high-treble
  voicings, footswitchable gain boost, and an effects loop for pedal
  integration. Ships with a 2-way footswitch.
details: |-
  The Origin20 Head provides a classic all-valve, rich and harmonic tone at 20W, 3W and 0.5W with Powerstem technology. This makes it ideal to play in different environments, from bedrooms to rehearsal studios and small venues.

  There is also a 2-way footswitch available, so you can control the gain boost feature and turn the FX loop on and off.

  Powerstem, the power reduction technology, allows you to have high or low power modes without compromising on sound quality. It works by reducing the voltage rails around the power amplifier rather than using traditional pentode/triode reduction methods, which offers power reduction without changing the sonic character.

  Using the tilt control, you can change the blend of your sound from normal to high treble. This is based on the multi-input technology of more classic amps such as the 1959SLP and JTM45, but in a single controlled knob.

  Retaining your sound's clarity and authenticity is crucial to any guitar player, which is why the Origin20 Head features an FX loop that acts as a junction for pedals. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - All-valve
  - High, mid and low power with power reduction technology
  - Tilt control to blend your sound
  - Gain boost
  - Model: Origin20H
  - Range: Origin
  - Channels: 1
  - Technology: Valve
  - Output wattage: high power 20W, mid power approx 3W and low power approx 0.5W
  - Outputs: 3 x 1/4" jack sockets (16 ohm load / 8 ohm load), DI (1/4" jack)
  - Inputs: 1 x 1/4" jack instrument input, footswitch
  - Controls: gain (pull boost), tilt, bass, middle, treble, master, presence, Powerstem power scaling
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 9.4 kg / 21 lb
  - Width: 520 mm / 20.5"
  - Height: 225 mm / 8.9"
  - Depth: 220 mm / 8.7"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90016 footswitch included
  - Colour: Black
