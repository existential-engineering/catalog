details: |-
  The JHS Pedals 3 Series Reverb is an extremely versatile unit that allows you to create the perfect amount of space for your guitar. You can achieve any reverberation effect, all the way from small room sounds to nearly endless washes of ambiance.

  The EQ control lets you perfectly adjust for a bright or dark texture to the reverb's overall tone. The Pre-Delay toggle allows you to select a short delay before the reverb begins, enabling effects ranging between slap-like singing-in-the-shower sounds and spacey atmospheres.
