description: A compact 28hp 8x8 DC-coupled matrix mixer with buffered
  inputs/outputs and LED-indicated latching switches for routing audio and CV.
details: |-
  Note: shipping starts in January 2025. Like four 4x4 Switch Matrix set side by side, the Discrete Isoline Summation Matrix is a true matrix mixer powerhouse, a mad dream and an science experiment gone too far all in one. As the name implies, the unit contains eight individual inputs and outputs, all of which can be individually routed by way of the isolinear switch matrix on the front panel. Inputs are arranged in rows, while outputs are assigned to columns, making it easy and intuitive to quickly route any given input to any given output. All inputs and outputs are individually buffered, and each mechanical switch offers both tactile and visual feedback in the form of a soft, audible click as well as a connected LED turning on or off to indicate the state of the current junction. Like it's predecessor, the 4x4 Switch Matrix , the Discrete Isoline Summation Matrix is a DC coupled summing mixer, allowing both CV and audio to be mixed interally, with virtuous or disastrous results (I will leave it up to you to determine one from the other). Finally, the unit is compact at only 28hp, and pairs perfectly with the Qatt quad attenuator , Stum quad mute and 180° quad inverter for greater control over your inputs and outputs. Features:

  You already know what you are going to be doing with this - whether your plan is to mix an ungodly amount of CV, create an incredible amount of new trigger patterns, have a massive FX routing setup, or some manner of unspeakable matrix mixer situation on your hands, you will be armed to the teeth with the Discrete Isoline Summation Matrix .
specs: |-
  - DC coupled - mix both audio, CV, triggers and gates
  - Summing mixer with up to eight inputs per output
  - Easily-interpreted 8x8 coordinate grid
  - Compact design, yet large, performance friendly buttons
  - LED indicators to immediately identify mixer states
  - Guaranteed to make you look like a genius in the studio and on stage
