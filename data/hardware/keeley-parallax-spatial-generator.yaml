description: "- Legendary Caverns Delay - Shoegaze-inspired Realizer Reverbs -
  Instant atmoshpere in a pedalboard-friendly enclosure"
details: |-
  The Parallax pairs the delay side of the Caverns with the Realizer's shoegaze-oriented reverbs in a single pedalboard-friendly enclosure. On one side, analog-style modulated delays build a bed of warm repeats; on the other, the Reverse setting produces vibrato swirls and ambient modulations that pool into reverb reflections. Run together, the two sides are positioned as an end-of-pedalboard solution for shoegaze, ambient and experimental playing.

  The reverb side offers three tuned modes. Soft Focus recreates the Soft Focus patch of the Yamaha FX500 multi-effects processor, where the Decay control sets both reverb decay time and the feedback of the dual delay while Depth sets the depth of all four chorus voices. Reverse takes its cue from the Yamaha SPX90 and Alesis Midiverb II, with Decay switching between eight fixed delay times from 150 ms up to half a second, and adds an envelope-triggered vibrato that imitates a Jazzmaster tremolo-bar pitch bend; Warmth in this mode behaves like a Jazzmaster rhythm-pickup tone control. Hall is a hall reverb whose output feeds an octave-up stage that returns to the reverb input, producing an ascending octave feedback loop whose prominence is set by Depth.

  The delay side carries a three-way switchable modulation selector: Off for unmodulated analog-style delay, Deep for heavy swirling modulation on the repeat trail, and Light for a gentler treatment. The Rate, Blend and Repeats knobs work alongside the mode switch to cover the delay voices.

  The page also carries an instructions section and a heading for a TRS input mode, but publishes no detail under either.
