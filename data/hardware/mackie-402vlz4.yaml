description: Mackie 402VLZ4 4-Channel Ultra-Compact Analog Mixer.
details: |-
  Now featuring Mackie's flagship Onyx mic preamps, the ultra-compact 402VLZ4 delivers the proven feature set, high-headroom and low-noise design and Built-Like-A-Tank construction that created an industry more than 25 years ago. When you only need one or two channels but will not sacrifice sound quality, 402VLZ4 is made for you.

  The 4-channel 402VLZ4 features Onyx mic preamps in an ultra-compact design that is an industry-leading performer ideal for professional low-input applications. From every input to every output, it is designed to provide the highest headroom and lowest noise possible for maximum signal integrity.

  Channels 1 and 2 are mono channels with XLR mic inputs and 1/4 inch line inputs, and an instrument switch impedance-matches a guitar or other instrument to the line input without a DI box. Channels 3 and 4 are a fully balanced stereo line pair.

  The rear panel carries the main outputs on 1/4 inch jacks, unbalanced RCA tape in and tape out, and a connector for the external power adaptor. A global phantom power switch feeds condenser microphones on channels 1 and 2.

  The bottom panel has three non-threaded holes that allow the mixer to be fitted with an optional microphone stand adapter.
specs: |-
  - 2 boutique-quality Onyx mic preamps with ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20Hz to 50kHz)
  - Improved RF rejection perfect for broadcast applications
  - Phantom power for condenser mics
  - 4 high-headroom line inputs
  - Selectable instrument inputs on first two channels, no DI box needed
  - 2-band EQ (80Hz, 12kHz), 15 dB boost or cut per band
  - 18 dB/oct 100Hz low-cut filter on mic input channels
  - High-resolution 8-segment stereo meters
  - Sealed rotary controls resist dust and grime
  - Power consumption 8 watts
  - External supply input 100-240 V~ 50/60 Hz, output 12.0 V DC 2000 mA
  - Dimensions (H x W x D): 1.6 x 5.8 x 7.3 in / 41 x 147 x 186 mm
  - Weight: 2.5 lb / 1.1 kg without power supply, 3.0 lb / 1.36 kg with
  - Three non-threaded holes on the bottom panel for an optional microphone stand adapter
