details: |-
  The Starplayer TV 25th Anniversary Gold Leaf marks 25 years of the Duesenberg Starplayer, which the page dates to 1995. It is a limited edition of the Starplayer TV finished in 24 carat gold leaf with silver leaf accents on the sides, the neck and the inside of the guitar, protected by a PUR clear coat, and the run is limited to 25 pieces worldwide.

  Construction is semi-hollow with a solid sustain block, bent sides and an f-hole, measuring 46 x 34 cm with sides 4.5 cm deep. The top is laminated spruce with laminated flamed maple back and sides, cream binding and a Black/Gold Custom pickguard. Duesenberg describes its semi-hollow construction as giving an open response unlike a solid body while blocking most feedback at high gain levels.

  The neck is a set neck in one-piece maple with a medium D profile, 42.5 mm at the nut and 52 mm at the twelfth fret, carrying an Indian rosewood fingerboard of 305 mm (12") radius with 22 jumbo frets and cream dot inlays, over a steel dual-action truss rod. The headstock is finished in gold leaf. Scale length is 648 mm (25.5"), which Duesenberg says gives a tight bottom end and wide frequency response, matched by its Custom 10/50 factory strings. The fretboard is Plek processed for level frets, the basis for the maker's multi-step hand fret polishing and setup work.

  Electronics pair a Duesenberg Domino P90 at the neck with a classically voiced Duesenberg GrandVintage humbucker at the bridge, wired to one volume, one tone and a heavy-duty three-way selector whose middle position uses a special wiring that filters certain low-end frequencies out of the humbucker signal for a more open, funky voice. Duesenberg states it uses German silver for the pickup baseplate and cover, on the grounds that the material does not affect the frequencies the pickup transmits, and a specific insulated wire from an old German copper wire factory, wound slowly to simulate hand winding.

  All hardware on this instrument is silver plated, including custom silver plated Duesenberg Z-Tuners, a Steel Saddle Bridge, Straplock-compatible standard strap pins and a custom silver plated Diamond Deluxe Tremola vibrato. The Tremola is described as lightweight, running on heavy-duty needle and nylon bearings, with an arm that turns freely through 360 degrees and adjusts for angle and length, and strings guided through holes in the bar beneath the arm axis. The Z-Tuners hide the cut-off string end inside the tuner shaft. The guitar ships with the Duesenberg Custom Line Case and all required allen keys as standard.
