  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Gold Leaf
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated spruce
  - Back, sides: Laminated flamed maple
  - Body dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream
  - Pickguard: Black/Gold Custom
  - Finish: Gold Leaf, Silver Leaf, PUR Clear-Coat protected
  - Tuners: Custom Silver plated Duesenberg Z-Tuners
  - Bridge: Custom Silver plated Duesenberg Steel Saddle Bridge
  - Vibrato System: Custom Silver plated Duesenberg Diamond Deluxe Tremola
  - Strap pins: Custom Silver plated Duesenberg Standard (Straplock compatible)
  - Hardware finish: Silver plated
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
