details: |-
  The GS Mini-e Mahogany is Taylor's scaled-down acoustic-electric built around the GS Mini body shape. The solid neo-tropical mahogany top produces a warm, punchy midrange character that suits fingerpicking and strumming alike, while the layered sapele back and sides add durability and structural consistency.

  Taylor's ES-B electronics system integrates a high-quality undersaddle pickup with a built-in digital chromatic tuner, making it stage-ready straight out of the case. The preamp is discreetly mounted on the upper bout for easy access during performance.

  The neck is crafted from tropical mahogany and paired with a West African Crelicam ebony fretboard featuring 4mm dot inlays. At a 23-1/2" scale length, reduced string tension makes the GS Mini-e Mahogany particularly easy to play and well-suited for travel or casual use.

  Finished in matte on both top and back/sides, the guitar ships with D'Addario XS Coated Phosphor Bronze Medium strings (.013-.056) and includes a structured gig bag.
specs: |-
  - - Body Style: GS Mini
  - Top: Solid Neo-Tropical Mahogany (matte)
  - Back & Sides: Layered Sapele, 2-piece (matte)
  - Neck: Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Fretboard Inlay: 4mm Dot Italian Acrylic
  - Bridge: West African Crelicam Ebony
  - Scale Length: 23-1/2"
  - Nut: Nubone
  - Saddle: Micarta
  - Tuners: Taylor Chrome
  - Electronics: ES-B with built-in digital chromatic tuner
  - Pickguard: Black
  - Strings: D'Addario XS Coated Phosphor Bronze Medium (.013-.056)
  - Case: Structured gig bag included
