description: Stereo PULTEC-style EQ combines our passive EQ with all-tube
  12AX7/6414 makeup gain. Additional frequencies, MANLEY IRON® transformers.
  116dB S/N, +30dBv
details: |-
  Dual-channel passive equalizer based on the acclaimed Pultec topology, designed for stereo buss processing or processing two mono channels. Combines passive inductor-based EQ networks with all-tube makeup gain amplification for phase-coherent frequency shaping and harmonic character. Hand-built in California by Manley Laboratories, which has manufactured and refined Pultec-style EQs since 1990.

  Each channel features a fully differential all-tube signal path with balanced XLR input/output via MANLEY IRON® transformers, plus alternate transformerless 1/4" HI-Z inputs and capacitor-coupled unbalanced 1/4" outputs.
specs: |-
  - Dual-channel passive Pultec-style EQ with all-tube makeup gain
  - Tubes: 2 × 12AX7 (gain), 2 × 12BH7 (or 6414 or 5965) White Follower
  - Fully differential all-tube signal path (2 channels)
  - Balanced XLR input: 3 kOhm
  - Alternate transformerless 1/4" HI-Z input: 5 kOhm
  - Balanced transformer-coupled XLR outputs via MANLEY 9611
  - Direct capacitor-coupled unbalanced 1/4" outputs
  - Frequency Response: 10 Hz – 70 kHz (flat)
  - Signal-to-Noise Ratio: 116 dB
  - Maximum Output: +30 dBv
  - Power Consumption: 25 Watts
  - Operating Voltage: 100V, 120V, or 220-240VAC, 50–60 Hz (purpose-built per destination country)
  - Dimensions: 19" × 3.5" × 10" (2U rack space)
  - Unit Weight: 12 lbs
  - Shipping Weight: 17 lbs
  - Hand-built in California
