description: >-
  The E-mu ESI-32 is a 32-voice rack-mount sampler from the mid-1990s offering 16-bit
  sampling at up to 44.1kHz, expandable memory up to 32MB, and an optional Turbo kit
  adding dual effects processors and advanced filter algorithms.
details: |-
  The ESI-32 was E-mu's entry into the competitive mid-range sampler market of the mid-1990s, going head-to-head with offerings from Akai and Roland. With 32-voice polyphony, 16 MIDI multitimbral parts, and 16-bit stereo sampling at either 22,050 or 44,100Hz, it provided professional-grade sampling capability at an accessible price point.

  The unit ships with 2MB of RAM expandable to 32MB, and includes a built-in 3.5-inch disk drive for sample storage. Its editing toolkit is comprehensive, featuring auto-looping, truncation, triggered sampling, and auto key placement, alongside more advanced DSP functions like parametric EQ, time compression/expansion, pitch shifting, Doppler effects, and transform multiply for harmonic sample morphing.

  The optional Turbo Expansion Kit significantly enhances the ESI-32's capabilities, adding dual 24-bit stereo effects processors with reverb, delay, chorus, and distortion, plus expanded filter options including 4- and 6-pole lowpass, various highpass and bandpass configurations, phaser, and flanger algorithms. Additional upgrade paths include up to 8 outputs, an internal ZIP or hard disk drive, external SCSI card, and digital I/O.

  Notable users of the ESI-32 include Daft Punk, Ixy InDaMix, and Somatic Responses, demonstrating its versatility across electronic music genres from house to breakcore.
specs: |-
  - Polyphony: 32 voices
  - Sampler: 16-bit, 22.05-44.1kHz stereo
  - Filter: 4 and 6-pole lowpass, highpass, bandpass, phaser, flanger (Turbo Kit)
  - Effects: Reverb, delay, chorus, flange, distortion, vibrato (Turbo Kit)
  - Keyboard: None
  - Memory: 2MB (expandable to 32MB)
  - Control: MIDI (16-part multitimbral)
  - Options: Turbo Expansion Kit, 8 outputs, SCSI, digital I/O
