description: A solder-free amplifier-in-a-box pedal kit that emulates a
  legendary British amplifier sound with controls for gain, mid and treble.
details: |-
  The LWP Series Jubilee Red AIAB Solder-Free Pedal Kit allows you to create an Amplifier In A Box (AIAB) pedal that captures the legendary British amplifier sound, ideal for rock guitar tones spanning from the 80s to modern times. This kit is solder-free, so you can assemble it with just a Phillips screwdriver and the included tools, making it perfect for beginners learning about effects pedals. Please note : a center-negative DC 9V adapter is required to power the pedal, as it is not compatible with battery power. Key Features:

  User Manual Assembly Instructions:

  Controls Overview

  Control Knobs:

  VOLUME : Adjusts the overall output volume. GAIN : Controls the intensity of the distortion. Turning counterclockwise gives an 80s rock tone; turning clockwise increases to a modern high-gain amplifier sound. MID : Adjusts the mid-range output. Turning counterclockwise flattens the mid-range for classic tones, while clockwise enhances mid-range for a more defined tone. TREBLE : Balances the overall sound. It adjusts high-range frequencies around 2kHz and low-range frequencies around 100Hz to create a well-rounded tone. Example Settings:

  80s Rock Sound : Set GAIN to minimum, MID and TREBLE to 12 o'clock. Modern High-Gain Tone : Maximize the GAIN, adjust MID and TREBLE to preference for a powerful and clear distortion. Specifications:

  Input Impedance: 180K
  Output Impedance: 50K
  Drive Voltage: 9V
  Current Consumption: 6mA
  Signal-to-Noise Ratio: 80dB Estimated
  Assembly Time: 15-30 minutes

  Usage Tips:

  Experiment with the MID and TREBLE controls to create a tone that balances well within your band's sound. For multi-string guitars (7, 8, or more strings), the JUBILEE RED AIAB can handle a thicker bass range without clouding the mix. Adjust the GAIN knob based on the musical style or era you want to emulate. Enjoy exploring the iconic British amplifier sounds with your new Jubilee Red AIAB pedal you have constructed yourself! ・ LWP Series Jubilee Red AIAB Solder Free Pedal Kit Manual.pdf

  Promotional Pictures（for dealers）
  2000pix×2000pix 350dpi
specs: |-
  - Jubilee Red AIAB Sound: Emulates the distinctive mid-range characteristics of the legendary 50W/100W amplifier with unique control over tonal qualities.
  - No Soldering Required: Easy assembly with only a Phillips screwdriver.
  - Modern Mid-Range Control: Adjust the depth and tone of the mid-range, enabling tones from classic 80s rock to modern high-gain sounds.
  - Low-Noise Operation: Delivers high clarity and a well-defined sound, separating silent and playing parts effectively without a noise gate.
  - Prepare Your Tools: Get a Phillips screwdriver and ensure all parts in the kit are accounted for.
  - Assemble the Unit: Use the screws provided to secure each component. Follow the included assembly guide for the step-by-step process. Ensure each part is firmly in place.
  - Power Connection: Once assembled, connect a center-negative DC 9V adapter to power the pedal.
