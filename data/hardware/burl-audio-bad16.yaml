description: "16-channel BURL BLACK ADC daughter card for the B80 and B16
  Mothership, featuring all discrete transistor class-A analog-to-digital
  conversion with the new BX8 transformer, delivering higher channel density at
  a lower cost per ADC channel than the BURL GREEN ADC line."
details: |-
  The BAD16 is the latest BURL BLACK ADC Daughter Card for the BURL Audio B80 and B16 Motherships. It features 16 channels of all discrete transistor, class-A, transformer coupled Analog to Digital Conversion, and employs the BURL Audio NextGen analog section featuring the brand new BX8 transformer — a smaller form factor input transformer designed for higher channel density.

  With its higher channel density, the BAD16 brings the superior class-A analog technology that BURL Audio is known for, at a lower cost per ADC channel compared to the existing BURL GREEN ADC line.

  The BAD16 in a B16 chassis is the ideal 16-channel input solution for recording musicians or project studios who have wanted a Mothership but found the price point beyond their budget. In a B80 chassis, 8 BAD16s deliver up to 128 input channels when using a BMB2-MADI or BMB3-DANTE at 44.1 kHz or 48 kHz.
specs: |-
  - 16-channel ADC
  - All class-A analog, discrete transistor BURL NextGen circuit path
  - BX8 input transformer
  - 32 maximum ADC channels with B16
  - 128 maximum ADC channels with B80 (BMB2, BMB3 @ 44.1 k, 48 k)
  - Front panel signal indication
  - Automatic BMB1-DigiLink detection for Avid Delay Compensation
  - MOTHERSHIP 3 compatible
