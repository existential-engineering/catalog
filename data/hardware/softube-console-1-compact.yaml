description: "Console 1 Compact: a DAW controller for music production that
  brings the popular Console 1 Mixing System concept to any studio. The
  industry-defining control surface adapted for all spaces."
details: |-
  Console 1 Compact is a hybrid hardware and software mixing system that combines a high-end console feel with high-end console sound based on Softube's 20+ years of emulation expertise. Compact is designed to give the hands-on mixing experience of Console 1 in a package adapted for any size studio or setup, giving all the sections of Console 1 Channel Mk III in two easy-to-use layers.

  Console 1 Compact gives world-renowned console sounds: exacting models of professional-grade, standard-setting gear, from Solid State Logic and Tube-Tech to Chandler Limited. Summit Audio Grand Channel, Weiss Gambit Series, or the Empirical Labs strip can be loaded, and Compact comes with Softube's take on the perfect channel strip, the Core Mixing Suite software.

  Compact features the same anodized aluminum, Nordic Night Sky finish, and robust build of Console 1 Channel and Fader Mk III. Every rotation of Compact's touch-sensitive Analog Feel potentiometers gives the sensation of the priciest outboard gear. With an increase of more than ten times the resolution over the Console 1 Mk II generation, the weighty and precise turn of these knobs highlights the immersive mixing experience of Compact.

  Console 1 Compact gives Channel Mk III capabilities in just half the size. Whether as a main unit or the unit used on the go, Compact fits the workflow and the lifestyle. It is also retro-compatible and modular: Console 1 Compact is compatible with all units and all versions of the Console 1 Mixing System range. Because all Console 1 hardware controls the same Console 1 plug-in, all processing is always compatible and all sessions are always recallable, no matter if the setup uses Console 1 Mk I or Fader Mk III.

  Console 1 Channel, Compact, and Fader work with all major DAWs, without mapping. Each knob corresponds to a specific parameter, and the high-resolution screen keeps the focus on the sound of the mix. All Softube, Plugin Alliance, Brainworx, FabFilter, UAD, and other Console 1 Ready plug-ins are available for the Console 1 Mixing System, so any section can be replaced with a Console 1-ready plug-in to create a custom console.
specs: |-
  - 16 touch-sensitive high-resolution Analog Feel potentiometers
  - 1 high-resolution screen showing EQ and compressor curves, VU meter, and track information
  - 34 RGB LEDs for track selection, RGB LEDs for knob read-out
  - Sections: Tape/Preamp, Filters, Shape (Dual), EQ (Dual), Compressor (Dual), Drive/Character
  - DAW control: Volume, Pan, Solo/Mute, 6 Sends, Track Select
  - Connectivity: single USB-C port
  - Power: Console 1 bus powered (USB-C)
  - Construction: anodized aluminum top, injection moulded smooth sides and back with integrated connectivity points
  - Mounting options: 100 mm M4 VESA on the bottom, M4 threads on the sides
  - Dimensions (W x H x D): 240 mm x 45 mm x 219 mm / 9.45 in x 1.77 in x 8.66 in
  - Weight: 1.02 kg / 2.25 lbs
  - No daisy chaining of units (unlike Console 1 Channel Mk III)
  - Does not include the Group, Copy and All functions found on Console 1 Channel
  - Includes Console 1 Core Mixing Suite: Tape/Preamp tape drive model, Filters (6, 12, 18, 24, 48 dB), Shape (Dynamic Shaper, Panner, Dual Dynamics), 4 EQs (Modern, Vintage, Dynamic 2-band, Dynamic 4-band), 3 Compressors (FET Mk II, Opto, Bus Compressor), drive section
  - In the box: Console 1 Compact hardware unit, Core Mixing Suite channel strip software, 2-meter braided USB-C to USB-C cable, four M4 screws for VESA mounting
  - Console 1 plug-in formats: VST3, AU (Logic Pro), AAX (Pro Tools). The VST2 version is not supported with hardware
  - System requirements: macOS Sonoma 14, Sequoia 15 or Tahoe 26; Windows 10 (64-bit) or Windows 11; Softube account; iLok account; AU, VST, VST3 and/or AAX compatible DAW host; internet access for installers and licensing
  - Compatible DAWs include Logic, Ableton Live, Cubase, Pro Tools, Studio One, LUNA, Reaper, FL Studio, Nuendo, Bitwig Studio, Cakewalk and Samplitude
  - Supports third-party Console 1 Ready plug-ins from Plugin Alliance, Brainworx, FabFilter, UAD and others
  - Compatible with all units and all versions of the Console 1 Mixing System range
