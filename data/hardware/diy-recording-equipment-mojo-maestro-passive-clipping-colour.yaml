details: |-
  The Mojo Maestro is a Colour creation from Audio Expert Ethan Winer. Ethan published the Mojo Maestro circuit in AudioXPress Magazine to show that, "there's no reason to pay thousands of dollars [...] just to get some subtle distortion." And now Ethan has graciously made his circuit available for the Colour format. The Mojo Maestro is a tried-and-true, diode distortion circuit with several options for customization. In "Glue" mode it provides gentle saturation that can warm up sterile tracks, while "Mojo" mode pumps up the gain for intense, guitar-pedal distortion. The clipping style can also be customized to "SYM" (symmetrical) or "ASYM" (asymmetrical). In SYM mode both clipping diodes are engaged to clip both the top and bottom of the wave. This mode generates even harmonics (2nd, 4th, etc.) and is the more aggressive of the two. In ASYM mode, one of the diodes is taken out of circuit so that only one side of waveform is clipped. This creates both odd and even harmonics, and preserves more of the integrity of the original signal than symmetrical clipping. Besides sounding great, the Mojo Maestro makes a great sandbox in which to experiment with circuits and distortion. Features

