details: |-
  Magnepan LRS+

  Following in the footsteps of the highly acclaimed LRS, the LRS+ takes it up a notch. "This is another slam-dunk POY (Product of the Year) nominee, and, IMO, the best buy (along with the MG1.7i) in an affordable loudspeaker for modest-sized rooms." 2022 Golden Ear Award. Jonathan Valin, October 7 th , 2022

  Check out Jonathan's full review of the LRS+ below. What is a ribbon speaker? Ribbon and electrostatic speakers are elegant and simple. The air is moved and sound waves are created by moving an ultra-light film or aluminum ribbon. Ultra-low mass
  enables the ribbon to respond quickly to the electrical signal from the amplifier. What you hear is higher definition. Reviews:

