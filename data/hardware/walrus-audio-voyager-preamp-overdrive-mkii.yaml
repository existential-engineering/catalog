details: |-
  The Voyager MKII is a mid-focused overdrive/preamp that contains all the mythical magic from the original Voyager and adds a wealth of features not seen before in a Klon-style pedal. From its lowest to highest settings, the Voyager provides a uniquely superb amount of clarity to any playing style. At lower gain settings, it brightens the signal and adds clarity to each note. With the gain turned up, the Voyager transforms into a thick overdrive, providing depth to chorded playing while retaining the clarity needed to break through solos. The Voyager MKII breaks out of the traditional Centaur three-knob topography by adding a foot-switchable parametric mid-frequency EQ with a boost/cut range of +/-12dB. The Freq (Frequency) knob then controls the center frequency of where the Mid knob is set, giving a range of 250Hz-2kHz. Great for accommodating any guitar and pickup combination and tailoring your tone to your own style of playing. Further customize the Voyager's sound with the five-way rotary switch: 1: Classic 1N34A Germanium Diodes (most compressed). This is the original Voyager sound. 2: Classic 1N34A Germanium Diodes with bass boost (trust us). 3: Symmetric Silicon Diodes (more open and dynamic). 4: Asymmetric Silicon Diodes (least compressed, open & driven). 5: Asymmetric Silicon Diodes with bass boost (least compressed, open & driven with a bass boost.) Think of each position as a different "flavor" of the pedal. Fine-tune each of these modes with the Mid/Freq EQ for a near-infinite supply of gain options.
