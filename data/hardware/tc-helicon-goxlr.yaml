description: Desktop broadcast mixer for streamers, combining a four-channel USB
  audio path with motorized faders, a Midas microphone preamp, a sample board
  and on-board vocal effects.
details: |-
  GoXLR is a desktop broadcast mixer built around a four-channel USB audio path, so a streamer can balance microphone, game, music, chat and system audio in real time without leaving the stream. Each channel runs on a motorized fader with an LCD scribble strip, and fader positions recall with the rest of the configuration.

  The microphone channel runs through a low-noise Midas preamp, with a condenser setting in the app that supplies 48 V phantom power. On-board processing covers equalization, compression, de-essing and gating, and the vocal effects section adds reverb, echo, pitch shift, formant shift, robot, megaphone and HardTune. All of it is processed on the hardware rather than on the host CPU.

  A sound board with sample pads and multiple banks holds bumpers and clips, and samples can be recorded straight to a pad from the unit. A cough button mutes the microphone while held, and a censor button bleeps it on demand.

  Setup and recall run through the GoXLR app, which is required to operate the unit and is published for Windows only. The app also drives the RGB lighting, the mixer assignments and the stored effect presets.
specs: |-
  - Four-channel USB mixer with motorized faders and LCD scribble strips
  - Midas low-noise microphone preamp with a condenser setting that supplies 48 V phantom power
  - On-board equalization, compression, de-essing and gating
  - Vocal effects: reverb, echo, pitch shift, formant shift, robot, megaphone and HardTune
  - Sound board with four sample pads and multiple sample banks, with on-board sample recording
  - Cough button for momentary mute and a censor button for bleeps
  - Full RGB lighting control
  - Requires the GoXLR app, published for Windows 7, 8, 10 and 11, with no official macOS or Linux build
  - Powered from the included 12 V DC adapter
  - Kensington security slot on the rear panel
