description: True Chorus – Auto Doubler Tape Echo, Analog BBD & Subdivisions
  Reverb with Shimmer and Distortion
details: |-
  The Multi Echo collects eight of Keeley's delay based effects in one compact pedal: automatic double tracking and chorus, tape echo with dynamic modulation, analog delay, subdivided digital delay, and room, chamber and hall reverbs. Only one effect runs at a time, which keeps the pedal simple to operate, and each algorithm was chosen as a representative of the maker's range with a twist on the familiar pattern.

  The double tracking side uses Keeley's true-chorus double tracker. The vintage ADT has variable rate and depth, likened to an old reel-to-reel tape deck, while the modern ADT adds a tone control for the sound of the doubled voices, with a low-pass filter at one extreme, a notch at centre and a high-pass at the other.

  On the delay side, the tape delay has a wide-ranging tone control that can simulate a worn deck or keep bright repeats, the analog delay carries dynamic modulation whose depth follows playing attack so the pitch trembles as the player digs in, and the modern digital delay offers eight subdivisions, including rarer ones alongside the common choices.

  The reverbs are a room reverb with a distortion control, inspired by crowded 1950s and 1960s studio rooms where the reverb itself breaks up, the Keeley Abbey chamber reverb with a resonant point at 2 kHz, and a hall reverb for long ambient tails with a faint hint of shimmer.
specs: |-
  - Eight programs, one effect at a time
  - ADT Vintage: delay time 0 to 30ms, depth, rate 0.1 to 8Hz, chorus-like double tracking
  - ADT Modern: delay time 0 to 50ms, 30 cents of pitch depth, tone control with a low-pass at 1 kHz fully counter-clockwise, a notch at 1 kHz at centre and a high-pass at 1 kHz fully clockwise
  - Tape Delay: delay time 50 to 950ms, regen, tone, with a small amount of dynamic modulation
  - Analog Delay: delay time 50 to 950ms, regen, modulation rate 0 to 10Hz, modulation depth controlled dynamically
  - Subdivision Digital Delay: delay time 50 to 1000ms, regen, eight subdivisions (quarter plus dotted eighth, dotted quarter, quarter, dotted eighth, eighth, triplet, sixteenth, triplet eighth)
  - Room Reverb: pre-delay 0 to 180ms, decay, distortion control
  - Chamber Reverb: pre-delay 0 to 150ms, decay, tone from minus 6dB at 2 kHz to plus 10dB at 6.5 kHz
  - Hall Reverb: pre-delay 0 to 130ms, decay, tone bringing in a low-pass at 850Hz, with a slight amount of added shimmer
