description: 8x2 USB 2.0 desktop recording studio with eight dbx 60V
  high-voltage mic preamps and 24-bit/96kHz A/D-D/A conversion. This product is
  discontinued.
details: |-
  The I-O | 82 is a compact 8x2 USB 2.0 desktop recording studio designed to be compatible with any DAW, including Pro Tools 10 through 12. Lexicon's marketing copy emphasizes flexibility: 'No artist likes to be told what to do - what tools to use and what tools you can't use. Lexicon understands your passion and it inspires us to innovate.'

  The interface features dbx 60V high-voltage mic preamps on all eight input channels and performance-driven A/D - D/A converters delivering 24-bit/96kHz audio. Inputs include eight combi-jacks for mic/line signals and two side-panel 1/4-inch instrument inputs, while outputs include a pair of balanced 1/4-inch TRS line outputs plus two headphone outputs. S/PDIF and MIDI in/out round out the digital and control connections.

  The unit ships with a software bundle including Cubase LE, Lexicon's Pantheon II VST/AU reverb plug-in (offering six legendary Lexicon reverbs), EzDrummer Lite, and XILS-3 SE. It is powered by an external 12 VDC 2.0 A PS1225DC adapter.

  The product is discontinued. Legacy Mac and Windows drivers remain available for download from Lexicon's site.
specs: |-
  - 8x2 USB 2.0 desktop recording studio
  - 24-bit / 44.1kHz to 96kHz A/D-D/A conversion
  - 8 dbx 60V high-voltage mic preamps
  - 8 combi-jack mic/line inputs
  - 2 side-panel 1/4-inch instrument inputs
  - 2 balanced 1/4-inch TRS line outputs
  - 2 headphone outputs
  - S/PDIF digital I/O
  - MIDI in/out
  - USB 2.0 host connection
  - 12 VDC 2.0 A external power (PS1225DC adapter)
  - Compatible with any DAW including Pro Tools 10-12
  - Bundled software: Cubase LE, Pantheon II reverb, EzDrummer Lite, XILS-3 SE
