name: AmpliTube X-VIBE
manufacturer: ik-multimedia
primaryCategory: modulation
categories:
  - guitar
  - pedal
website: https://www.ikmultimedia.com/products/xvibe/
description: Bring your perfect studio guitar sound onstage with the new
  amplitube x-vibe modulation pedal.
details: >-
  Bring your perfect studio guitar sound onstage with the new amplitube x-vibe
  modulation pedal. This boutique pedal features 16 all-new modulation effects
  leveraging ik's latest amplitube technologies, accompanied by an exclusive
  virtual x-gear version of the exact same effects.


  Amplitube x-vibe includes a matching virtual version for mac/pc and a copy of
  amplitube 5 se. Open any version of amplitube 5 and you'll find your virtual
  x-vibe pedal available as a stomp for use within the program. Adjust any of
  your pedal settings with the convenience of amplitube's award-winning workflow
  and save them as presets.


  The x-gear preset manager lets you move presets between x-gear pedals and
  amplitube and easily reorganize them on the hardware pedal. You can store up
  to 300 presets per pedal.


  State-of-the-art dsp in a road-worthy anodized aluminum chassis. Full MIDI
  implementation including control over amplitube 5.


  Designed and made in italy for a lifetime of playing and gigging.
specs: |-
  - 16 modulation effects algorithms
  - 50 factory presets
  - 300 storable presets
  - Chorus
  - Flanger
  - Rotary
  - Tap tempo
  - Bpm sync
  - USB port
  - MIDI implementation
  - Recording interface capability
  - Anodized aluminum chassis
  - Virtual x-vibe version for amplitube 5
  - Mac/pc compatibility
