description: >-
  The CS-20m is a monophonic analog synthesizer from Yamaha's classic CS-series, featuring
  dual voltage-controlled oscillators and subtractive synthesis. It delivers rich bass,
  lead, and percussive sounds with resonant filtering and envelope control. It represents
  a capable mid-range instrument in Yamaha's analog lineup with eight patch memory
  locations.
details: |-
  The CS-20m positions itself as a capable mid-range instrument within Yamaha's analog synthesizer lineup. It employs dual VCOs paired with a third sine wave oscillator housed in the VCA envelope section, enabling rich modulation possibilities. The instrument features a resonant filter with selectable highpass, bandpass, and lowpass modes, each with dedicated ADSR envelope control for dynamic sound shaping.

  Compared to its siblings in the CS-series, the CS-20m occupies an interesting middle ground. It offers more memory patches (eight locations) than most comparable models while remaining more compact than the extensive CS-70m. The synthesizer produces notably brighter, thinner tones compared to the Minimoog, though it maintains the essential character of analog subtractive synthesis.

  The instrument includes an LFO for modulation of pulse-width sweeps and comprehensive CV/Gate control connectivity. Its 37-key keyboard provides adequate range for melodic work, and the patch memory allows musicians to store frequently-used sound configurations for live performance and studio work.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs + 1 sine wave oscillator (VCA section)
  - Filter: 1 resonant filter with switchable highpass/bandpass/lowpass modes; dedicated ADSR envelope
  - LFO: 1
  - VCA: 1 with ADSR envelope
  - Keyboard: 37 keys
  - Memory: 8 patch locations
  - Control: CV/Gate connectivity
  - Year produced: 1979
