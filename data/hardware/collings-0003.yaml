details: |-
  The 0003 is a 12-fret 000-body guitar that, like its siblings, produces more bass and overall volume due to the longer 12-fret body configuration. With East Indian rosewood back and sides and an upgraded trim level, it is ideal for string-band purists and guitarists seeking maximum power with a comfortably-sized instrument.

  Features include a Sitka spruce top with pre-war scalloped X-brace pattern, ebony fingerboard with no inlay, ebony pyramid-style bridge, ivoroid binding with purfling, and Gold Waverly tuners. The body finish is high gloss nitrocellulose lacquer.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony, no inlay
  - Bridge: Ebony pyramid-style
  - Binding: Ivoroid with purfling
  - Tuners: Gold Waverly
  - Body style: 000 (12-fret)
  - Neck joint: 12-fret
  - Scale length: 25 1/2"
  - Body width: 15"
  - Body length: 20 1/4"
  - Body depth: 4"
  - Total length: 39 1/2"
  - Neck profile: Modified V
  - Finish: High gloss nitrocellulose lacquer (body), polyester resin (neck)
