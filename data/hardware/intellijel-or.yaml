description: Gate Mixer You have that kick drum ready to trigger and your
  sequencer is all set; OR do you want to trigger it with that big shiny button?
  OR with that random source? You get the idea. Dual Logic OR Gates.
details: |-
  OR Logic is a way of combining incoming signals, where only the high values are sent to the output. This is very useful for blending gates together to create more complex rhythms, but it can also be used to generate interesting new waveforms.

  Each section has three inputs and one output. The top output is normalled into the bottom section's input 1 to allow the module to function as a six-in one-out combiner.

  This module employs passive diode logic, so there is a voltage drop of approximately 0.7V between the input and output.
specs: |-
  - Width: 2HP
  - Depth: 18mm
  - Power: Passive (no ribbon cable required)
  - Combines logic voltage sources (triggers, gates, etc.) into a single logical OR output
  - Two independent 3-in/1-out OR sections; top section normalled into bottom section for 6-in/1-out operation
