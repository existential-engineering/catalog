description: >-
  The Roland RS-09 is a dual-voice analog string and organ synthesizer from the
  late 1970s, producing warm polyphonic pad sounds through its two VCO
  architecture with a built-in ensemble chorus effect.
details: |-
  Produced from 1979 to 1980, the RS-09 is an analog string and organ machine similar to the
  Saturn-09 but with the addition of a string section alongside the organ sounds. Both sections
  can be played simultaneously or individually, offering a compact solution for lush pad textures
  that defined the era.

  The instrument features two VCOs generating string or organ waveforms with a built-in
  ensemble/chorus effect that adds richness and movement to the sound. An external sound input
  allows processing of outside audio sources through the instrument's effects. The 44-key keyboard
  provides a compact but playable interface in a polyphonic configuration.

  The RS-09's architecture is intentionally simple, with limited editable parameters and no patch
  memory. What it lacks in programmability it makes up for in immediate, characterful analog
  warmth. Three versions of the RS-09 were produced, with version 3 using touch-switches while
  version 1 employed rocker switches considered more reliable by many users.

  Notable artists who used the RS-09 include Jimi Tenor, UB40, and The Cure. The instrument
  remains one of the more affordable vintage Roland keyboards, valued for its straightforward
  approach to warm analog string and organ sounds.
specs: |-
  - Polyphony: Duo/Polyphonic
  - Oscillators: 2 VCOs (string and organ)
  - Effects: Ensemble/Chorus
  - Memory: None
  - Keyboard: 44 keys
  - Control: Gate out only
  - External sound input
