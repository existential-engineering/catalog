description: The Frank Bello Signature Pro-Mod So-Cal Bass PJ IV is built to the
  spec of the Anthrax and Helmet bassist, pairing a poplar San Dimas-style
  single-cutaway body with a maple neck for a high-output, stage-ready 4-string.
  A PJ pair of EMG Frank Bello signature pickups, dual-volume controls and a
  Charvel HiMass bridge deliver the punch and sustain needed for thrash, metal
  and alternative rock.
details: |-
  Designed in collaboration with Frank Bello of Anthrax and Helmet, the Pro-Mod So-Cal Bass PJ IV brings together the player's tonal preferences and the Charvel hot-rod aesthetic. The poplar body wears a Gloss Black finish with a 1-ply mirror pickguard and sports a single-cutaway San Dimas Bass shape, while the bolt-on maple neck is reinforced with graphite rods for stability across changing climates and tour conditions.

  The satin-finished maple neck carries a 34" scale length and a 12"-to-16" compound-radius maple fingerboard with 20 jumbo frets, black block inlays and black side dots. A Graph Tech TUSQ XL nut measures 1.5" wide, and truss rod adjustments are made at a heel-mounted spoke wheel. The headstock is a licensed Fender Precision Bass shape, secured with a 4-bolt Charvel neck plate.

  Electronics are anchored by an EMG Frank Bello signature P pickup in the middle position and an EMG Frank Bello signature J pickup at the bridge, both in black. The active circuit is wired simply with two volume controls (one per pickup) for direct, no-nonsense blending. Chrome hardware includes a Charvel HiMass bridge for sustain and articulation, plus Charvel open-gear tuning machines. The right-hand 4-string ships factory-strung with .045-.105 nickel-plated steel strings.
