details: |-
  the PRS S2 Mira 594 covers a wide range of styles with ease, including rock, blues, garage, and punk. Pairing the Mira’s all-mahogany construction with PRS 58/15 LT vintage-voiced pickups means warm focused midrange. The humbuckers are paired with two mini-toggle switches to individually tap the pickups, delivering both authentic humbucking and sweet, chimey single-coil sounds. The PRS S2 Mira 594 features a bound 22-fret Pattern Thin neck with a 24.
