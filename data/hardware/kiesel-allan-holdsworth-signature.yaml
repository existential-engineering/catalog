details: |-
  Wanting a rework of his original model, master guitarist Allan Holdsworth requested a headless build for differing playability and tone, stating that "once you get used to playing a headless guitar, it's really hard to go back." The HH2 became Kiesel's first headless guitar and comes equipped with a set-neck, alder body, and Holdsworth's signature pickups.

  The model enlists a compact body and optional chambering to fit Holdsworth's signature sound and play style; the end result is a light guitar, averaging around 5.75 lbs., that offers easy access and playability on the stage, in the studio, or on the couch.

  The neck pickup rests in a hollowed position to better suit chords and cleaner lines, while the bridge pickup sits on solid wood to prevent possible feedback when playing with distortion. In 2013, Holdsworth said that "it's more dynamic… it's snappier and quicker."
specs: |-
  - Headless construction
  - Construction: set neck
  - Scale length: 25.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Neck width: 1.69" wide at the nut, 0.82" thick at the 1st fret, 0.94" thick at the 12th fret
  - Body: chambered alder, with optional chambering
  - Top wood: plain maple top
  - Pickups: bezel-mount passive Kiesel Holdsworth humbuckers, the neck pickup in a hollowed position and the bridge pickup on solid wood
  - Electronics: master volume and tone controls, 3-way pickup mini-switch
  - Bridge: Hipshot fixed bridge, .4125" (10.5mm) spacing
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Strings: Elixir Nanoweb 1046E
  - Body dimensions: 31" long, 1.75" thick, 11" wide
  - Weight: 6 lbs, with the page citing an average of around 5.75 lbs
  - A tremolo configuration is offered, shown in the gallery as the HH2X with tremolo
  - Offered in several string counts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
