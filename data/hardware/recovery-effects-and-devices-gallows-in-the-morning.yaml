details: |-
  GALLOWS IN THE MORNING

  (Versatile Double Overdrive Plus Haunting Reverb)

  Gallows in the Morning combines two of our favorite things: gritty overdrive and haunting reverb. Switch between Bold and Brazen to go from shimmering, melancholic tones to monster distortion and foreboding reverberation. The simple controls allow you to easily dial in all the levels to suit your mood. . The clean, independent reverb control is one of the most distinctive features of this pedal. Even with distortion, the reverb is pristine in the mix, adding clarity to heavily distorted and reverberated signals. Using the reverb at 100% makes this pedal ideal for creative studio mixing. . Controls:

  Clean: Unadulterated input signal

  Dirty: Distorted guitar signal level

  Reverb: Reverb level generated from the clean signal, with no dry signal

  Volume: Overall volume

  Bold: Overdrive

  Brazen: Distortion

  Designed and assembled in Seattle, Washington. O perates on a standard 9Vdc Boss-style power supply (not included). Enclosure size: 4.77" x 2.6" x 1.39"

  Gallows In The Morning manual

  . Gallows In The Morning is our first collaboration. When the stay-at-home order was issued in Washington State due to the Coronavirus, I couldn't concentrate on anything because I was full of anxiety. Graig put me in front of a computer with a development board, handed me a guitar, and challenged me to design a pedal. I knew immediately what I wanted to create. Something heavy and dark, like I was feeling. I hope you find inspiration when you plug into this device. xo, Zera

  . Below: Gallows In The Morning Demo and Review on Guitar and Bass By Emily Harris of Getoffset podcast. Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
