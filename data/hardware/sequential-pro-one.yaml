description: >-
  A powerful monophonic synthesizer that distilled the essence of the Prophet 5
  into a compact, affordable package with dual oscillators, a rich 4-pole
  lowpass filter, and versatile modulation routing.
details: |-
  Released in 1981, the Sequential Circuits Pro One was designed to bring
  professional-grade analog synthesis to a broader audience. By condensing
  the core architecture of the legendary Prophet 5 into a single-voice
  instrument with a three-octave keyboard, Sequential created one of the
  most capable and expressive monosynths of its era. Roughly 10,000 units
  were manufactured before production ended in 1984.

  The sound engine pairs two CEM-3340 voltage-controlled oscillators
  offering saw and pulse waves on oscillator A, with saw, triangle, and
  pulse available on oscillator B, plus a white noise generator. These feed
  into a CEM-3320 four-pole lowpass filter with dedicated cutoff,
  resonance, envelope amount, and keyboard tracking controls. Two
  independent ADSR envelopes govern the filter and amplifier stages, and
  the flexible modulation routing allows the LFO and oscillators to
  interact in complex ways that belie the instrument's straightforward
  panel layout.

  Beyond its raw sound, the Pro One includes a built-in arpeggiator with
  up and up/down modes as well as a latch function, and a basic step
  sequencer capable of storing two patterns of up to 40 notes. CV and gate
  outputs made it a natural companion for other analog gear. Its intuitive
  interface meant that players could quickly dial in everything from
  searing leads to rubbery basslines without getting lost in menus.

  The Pro One earned a devoted following among electronic artists including
  Hardfloor, The Prodigy, Depeche Mode, Vince Clarke, New Order, and
  Prince. Its punchy oscillators and aggressive filter have been
  responsible for some of the most recognizable basslines in electronic
  music, and it remains one of the most sought-after vintage monosynths on
  the used market.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (CEM-3340) — VCO A: saw/pulse, VCO B: saw/triangle/pulse, plus noise generator
  - LFO: Saw/triangle/pulse waveforms
  - Filter: CEM-3320 4-pole lowpass with cutoff, resonance, ADSR envelope, and keyboard tracking
  - Envelopes: 2 ADSR (filter and amplifier)
  - Keyboard: 36 keys (3 octaves)
  - Arpeggiator: Up, up/down, and latch modes
  - Sequencer: 2 patterns, 40 notes, pitch only
  - Connectivity: CV/Gate output
  - Produced: 1981–1984 (approx. 10,000 units)
