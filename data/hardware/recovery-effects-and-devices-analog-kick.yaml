details: |-
  ANALOG KICK

  (Bass and Percussion Tool)

  The Analog Kick is a highly versatile sine wave-based voice that is fat, round, and punchy. It provides a variety of sounds ranging from thick and snappy, to low rattling subs, and tom-like sounds. The distinctive CV control disrupts the fundamental pitch, creating unique and unexpected patterns in pitch that can be used as bass lines. The Analog Kick packs a punch in its small 3hp footprint. . Designed and assembled in Seattle, Washington. . 3hp width, 16mm deep. . Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
