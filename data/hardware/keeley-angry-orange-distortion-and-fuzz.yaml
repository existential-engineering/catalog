description: Four-in-one analog distortion and fuzz with two classic circuits
  plus two hybrid voicings, switchable between buffered and true bypass.
details: |-
  The Angry Orange puts two distortion and fuzz circuits into one stompbox and lets their tone and clipping sections be mixed, giving four sounds in total. The two source voices are a 1978 Japanese orange distortion and a 1991 Soviet civil war fuzz, both all-analog, and the hybrid modes combine the tone stack of one with the clipping stage of the other. Three knobs cover the whole pedal, and bypass can be changed between true and buffered in a couple of seconds.

  Two tone control circuits are available. With the Tone switch up in the MF position the control is a scooped, passive tilt-style tone. With it down in the DS position it is also a passive tilt control but voiced differently.

  Both styles of diode clipping are available. With the Clipping switch in the DS position the pedal uses hard diode clipping for an edgier, more aggressive tone. In the MF position it uses soft diode clipping for a more muffled fuzz voice.

  A JFET buffer provides silent switching without tone loss. Holding the footswitch for two seconds moves the pedal to true bypass, indicated by the LED flashing twice, and holding it again returns it to buffered bypass, indicated by three flashes. The pedal is designed, engineered and manufactured by Keeley in Oklahoma City, in an in-house aluminium enclosure, and won a Premier Guitar Premier Gear Award.
