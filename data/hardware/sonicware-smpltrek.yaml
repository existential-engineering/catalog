url: https://sonicware.jp/products/smpltrek
description: SmplTrek is a portable production sampler and groovebox with
  one-touch sampling, auto-slicing, time-stretching, and pitch-shifting. Each
  song project holds 16 scenes with 10 sequencer tracks plus 3 audio tracks, and
  it accepts dynamic mics, electric guitar/bass, and line-level sources, with
  USB audio streaming to a phone or computer.
details: |-
  SmplTrek is a portable production sampler and groovebox. One-touch sample recording makes sampling easy, auto-slicing quickly splits samples across the pads, time-stretching adjusts a sample's tempo to match your song, and pitch-changing functions keep your samples in key.

  Each song project has 16 scenes. One scene contains 10 sequencer tracks plus 3 additional audio tracks for longer recordings such as vocals or guitar.

  With a single USB cable connected to your smartphone or PC/Mac, you can stream full-quality audio to audiences all over the internet. Find inspiration with 500+ high-quality sample sounds and 36 internal DSP effects, and import your own sounds with an SD card.

  SmplTrek accepts input from a variety of equipment: dynamic microphones, electric guitar/bass, general line-level audio devices, and PC/Mac or smartphones via USB. It can also synchronize playback with many musical instruments using MIDI and audio sync.

  Included: 32GB SDHC card with 1,000+ samples from Black Octopus, and an AC adapter. Batteries, USB cable, and other connection cables are sold separately (for iPhone, an Apple Lightning to USB Camera Adapter is required separately).
