details: |-
  A professional true diversity lavalier wireless system featuring the B60 bodypack transmitter. B60 bodypack transmitter. This bodypack may be used with any lavalier, head-worn, or instrument microphone in the AUDIX line, as well as guitar and bass.
  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include active directional antennas and antenna distribution systems for up to four systems (8 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - RF frequency range: 522 MHz – 586 MHz
  - 64 MHz wide spectrum tuning
  - 2560 tunable frequencies
  - True diversity dual-channel reception (R62 receiver)
  - Includes two B60 bodypack transmitters
  - One-touch sync links transmitter to receiver via infrared
