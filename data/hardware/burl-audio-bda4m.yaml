description: "Switchable transformer-coupled, 4-channel mastering-grade DAC
  daughter card for the B80 and B16 MOTHERSHIP, featuring all class-A NextGen
  Analog BOPA14 op-amps, switchable BX5 output transformers, and a stepped
  attenuator. Designed specifically for mixing and mastering."
details: |-
  The BDA4M is the mastering-grade DAC Daughter Card for the MOTHERSHIP platform. Following on the success of the B2 BOMBER DAC and the BDA8 for the MOTHERSHIP, the BDA4M utilizes BURL Audio's NextGen Analog technology with BOPA14 op-amps and switchable BX5 output transformers (same as the B32 VANCOUVER MIX BUS).

  The BDA4M with the BX5 output transformer routed to a BAD4M with the BX1 input transformer creates something similar to running through a 2-track analog tape machine, but with higher dynamic range, more headroom, and better frequency response with no tape hiss.

  A B2 DAC-style stepped attenuator and DAC filter select are included for mix/mastering applications requiring precise level control.
specs: |-
  - 4-channel MIX / MASTERING DAC
  - 4-channel XLR connectivity
  - All class-A, NextGen Analog BOPA14 or BOPA11 op-amps
  - Switchable BX5 output transformers
  - B2 DAC style stepped attenuator
  - Avid delay matching
  - DAC filter select
  - 115 dB Dynamic Range
  - -96 dB THD+N, full scale output = +22 dBU
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - Frequency response at 96 kHz: 10 Hz to 30 kHz, +/- 0.1 dB (-0.3 dB @ 40 kHz)
  - Frequency response at 192 kHz: 10 Hz to 30 kHz, +/- 0.1 dB (-1.5 dB @ 90 kHz)
  - Made in USA
