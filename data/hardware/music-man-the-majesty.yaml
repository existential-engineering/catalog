details: |-
  The 2025 John Petrucci Majesty is the result of John's unwavering demand for high performance, innovation, and playability. One of the most well-balanced and advanced instruments available, the Majesty features a neck-through-body design, a super-fast thin neck, unparalleled upper-fret access, and ergonomic in-line control knob placement.

  New for 2025 are glow-in-the-dark side dots for improved stage visibility and two stunning finishes — Dark Side and Gold Eclipse — available in 6-, 7-, and 8-string configurations.

  The Majesty is loaded with 24 stainless steel frets, DiMarzio Dream Catcher and Rainmaker humbuckers, piezo-equipped saddles for acoustic tones, mono and stereo outputs, a floating John Petrucci tremolo, and Schaller locking tuners. A push/push volume knob activates a 20+ dB adjustable gain boost, while a push/push tone knob enables coil splitting in the middle position.

  Each Majesty is crafted at the Ernie Ball Music Man factory in San Luis Obispo, California, blending the delicate touch of hand craftsmanship with the accuracy of robotic technology.
specs: |-
  - Body wood: Okoume with maple top (Gravity Green, Blue Silk, Amaranth) or basswood (Black Frosting, Her Majesty's Request, Mystic Dream)
  - Through-neck: Honduran mahogany
  - Body finish: Satin or high gloss polyester (varies by color)
  - Body dimensions: 12" wide, 1-3/4" thick, 37" long
  - Neck wood: Honduran mahogany through-neck (6-string offers flame maple/mahogany neck option)
  - Neck radius: 17"
  - Neck width: 1-11/16" at nut, 2-1/4" at last fret
  - Fingerboard: Ebony
  - Fret markers: Atlanté Majesty inlays with glow-in-the-dark side dots
  - Frets: 24 medium-jumbo stainless steel
  - Scale length: 25-1/2"
  - Pickups: DiMarzio Rainmaker (neck) and DiMarzio Dreamcatcher (bridge) humbuckers; Fishman piezo saddles
  - Bridge: Custom floating John Petrucci tremolo, hardened steel with Fishman Powerbridge piezo saddles
  - Tuners: Schaller M6-IND locking
  - Electronics: Custom active preamp; push/push volume (20+ dB gain boost); push/push tone (coil split in middle position); 3-way pickup selector; 3-way piezo/magnetic selector; mono/stereo switch
  - Shielding: Graphite acrylic resin cavity coating; aluminum control cover
  - Strings: Ernie Ball RPS 10 Slinkys #2240 (0.010–0.046)
  - Configurations: 6-, 7-, and 8-string
  - Made in: San Luis Obispo, California
