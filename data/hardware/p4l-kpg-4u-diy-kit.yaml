details: |-
  KPG 4U DIY Kit is the self-assembly version of the KPG 4U, a module built to the Buchla 4U system specification.

  "KPG" is a polyrhythmic gate/trigger generator that produces complex and varied gate patterns from signals patched into its four CV inputs. The output jacks change as the state (high or low) of the four CV inputs changes.

  The kit supplies the panel and board with the SMD parts pre-soldered, along with LEDs, standoffs and other parts. The banana jacks and the power connector are not included and have to be sourced separately, so the assembled module's jack complement depends on the parts the builder fits.

  Built by hand in Japan.
specs: |-
  - Panel and board supplied, SMD parts pre-soldered
  - LEDs, standoffs and assembly parts included
  - Banana jacks and power connector not included
