description: A sonic powerhouse bass cabinet delivering incredible dynamics,
  full-range frequency response and efficiency. Features aggressive midrange to
  punch through a loud band while maintaining Aguilar's signature full-range
  musical sound.
details: |-
  The DB 410 houses four custom 10" ceramic Eminence drivers in a 13-ply Baltic
  Birch enclosure, delivering 700 watts RMS power handling at 4 or 8 ohms. Its
  ceramic drivers produce aggressive midrange character and extended low-end
  response, making it a strong choice for high-volume applications where punch
  and projection are priorities.

  The cabinet includes an Aguilar proprietary horn and custom crossover for
  smooth high-frequency reproduction. Removable casters allow for easy transport
  on stage, while the heavy-duty construction supports demanding touring schedules.
  With a sensitivity of 101 dB and max SPL of 130 dB, the DB 410 can handle
  most amplifier configurations. Covered by Aguilar's three-year limited warranty.
specs: |-
  - Power Handling: 700 watts RMS
  - Impedance: 4 ohms or 8 ohms
  - Frequency Response: 40 Hz – 16 kHz
  - Sensitivity: 101 dB (1W/1M)
  - Max SPL: 130 dB
  - Drivers: 4x 10" custom Ceramic Eminence
  - Horn: Aguilar proprietary horn and crossover
  - Construction: 13-ply Baltic Birch
  - Height: 24.75"
  - Width: 24.5"
  - Depth: 17.5"
  - Weight: 98 lbs
  - Removable casters included
  - Warranty: 3-year limited
