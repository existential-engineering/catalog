description: Full-fledged digital drum machine with an integrated sequencer.
details: |-
  Sonic Potions and Erica Synths joined efforts to develop a drum machine that would stand apart from the masses, and the LXR-02 was the result.

  Its sound engine provides 6 different instruments, each with over 30 parameters to tweak, producing sounds that run from classic analog emulations to crunchy digital mayhem. That range is some of the most extensive sound design capability found on a drum synthesizer.

  A performance-oriented 64 step sequencer drives the voices, with voice volume sliders and an insert FX section on the front panel. Performance mode adds mutes, rolls, master bitcrush and kit morphing, and the unit stores kit, pattern, performance and song memory. An SD card slot handles firmware updates and project backup.

  Connections cover 4 assignable 6.3 inch jack outputs, usable as 2 stereo pairs or 4 mono feeds, a headphone output, full-size MIDI in and out, and USB MIDI, backed by an extensive MIDI implementation.

  The compact, durable aluminium casing and a clear user interface make the LXR-02 suited to live gigs as well as the studio.
specs: |-
  - 6 drum voices
  - Over 30 adjustable parameters per voice
  - Voice volume sliders
  - Insert FX section
  - 4 assignable 6,3" jack outputs (2x stereo or 4x mono)
  - Full-size MIDI in/out
  - 64 step sequencer
  - Performance mode with mutes, rolls, master bitcrush, and kit morphing
  - Kit, Pattern, Performance, and Song memory
  - SD card for firmware updates and project backup
  - USB MIDI
  - Headphone output
  - Extensive MIDI implementation
  - Durable and compact aluminum casing
