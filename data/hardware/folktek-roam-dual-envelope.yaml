id: 0pInh0FEQSEcwj4mK9ttq
name: Roam - Dual Envelope
manufacturer: folktek
primaryCategory: utility
categories:
  - modular
url: https://folktek.com/products/roam
description: A dual attack/release envelope module with touch-based selection of
  speeds that double as clock multiplication and division, with re-triggering
  possible at any point in the cycle.
details: |-
  Roam is a dual envelope that packs quite a bit into a small space. It has touch-based selection of of four A/R speeds from x ms to x ms but this also doubles as clock multiplication and division; 2x, 1x, 1/2, 1/3 (with a jumper on the back for those who prefer 1/4). While the clock input triggers the a/r, there's also a trigger jack which makes it incredibly easy to get into more complex rhythms. Re-triggering can happen at any point in the cycle of the envelope; not just at the release. This is incredibly useful if you're working with sequences. CV x2: CV out, clock in, trigger in, attack control (attenuable), release control (attenuable), end of cycle, inverted CV out. What makes this module unique: triggerable A/R is not new but as far as we know there are no modules (including Maths) that allow you to trigger at any point in the cycle. Roam will trigger on the rise as well and not just the fall of the cycle. Additionally by adding our clock multiplication/division, if one sends audio to the envelope, the envelope will be synched to the audio oscillator for added musicality. CONTROL (X2)

  - Attack and release (both with CV)
  - Touch-based switching for looping
  - Touch-based selection for a/r length/clock multiplication and division

  INS AND OUTS (X2)

  - CV over attack and release
  - Clock input
  - Trigger input
  - Envelope out, inverted envelope out, end of cycle

  SPECS

  - Includes mounting hardware and power connection in a beautiful Folktek box. + 12v = xma
  -12v = xma
  +5v = xma
  Width = 16HP
  1" depth (skiff friendly)
