description: Mixdeck Quad is a complete DJ system with a four-channel mixer,
  dual CD/MP3/USB decks, and a computer audio/MIDI interface, with Core MIDI and
  audio support for iPad.
details: |-
  Mixdeck Quad is a complete DJ system with a four-channel mixer that puts you in control at any gig. Based on the popular Mixdeck controller, the Mixdeck Quad adds support for Core MIDI on the iPad, letting you select and mix songs from your iPad music library plus Spotify integration via Algoriddim's djay 2 app. The fully functional four-channel digital/analog MIDI mixer allows total control of both the iPad and DJ software while mixing from CD, thumb drives, mics, or external sources.

  Crossplay Technology lets you play USB content from either port on either deck, freeing you to use USB tracks like all your other music — mix and match, play tracks simultaneously, and keep the room's energy peaked. Each deck adds flavor to performances with integrated, beat-synced DSP effects (chop, echo, filter, flanger, pan, phaser), each completely adjustable with a dedicated wet/dry fader.

  The unit includes a set of beat and pitch tools for beat matching and harmonic mixing: automatic BPM analysis with on-screen display, Tap Tempo for manual entry, pitch fader adjustment of ±6, 12, 25, and 100%, Key Lock to hold pitch while manipulating BPM independently, and pitch-bend buttons for quick tweaks.

  The full-featured four-channel mixer has per-channel gain, three-band EQ/rotary kills (+12 dB/-INF), two sets of stereo switchable phono/line inputs for external sources, and a replaceable crossfader with switchable slope and reverse. Remixing tools include seamless looping, sampling, hot cues, and Bleep/Reverse. Tracks can play in single-track, continuous, and programmable modes, and Fader Start triggers playback when the crossfader moves.

  Mixdeck Quad has smooth, fast slot-loading drives with large, touch-sensitive illuminated platters and two large backlit displays. A 1/4-inch mic input has dedicated gain and ±15 dB high/low EQ, and a complete cueing section provides dual 1/8" and 1/4" headphone outputs, cue gain, and a mini-crossfader. Balanced XLR and unbalanced RCA stereo main outputs, plus Booth and Record RCA outs, route the mix to different locations, and a direct stereo output from each deck supports timecode control interfaces like Serato Scratch Live or external effects processors.
specs: |-
  - Complete system with CD, MP3 and USB decks, four-channel mixer, and computer audio/MIDI interface
  - MIDI integration of decks and mixer for controlling computer software and iPad apps
  - Compatible with iPad music library plus Spotify (via Algoriddim djay 2)
  - Compatible with iPad, iPod and iPhone for DJ parties of all sizes
  - Crossplay Technology: mix USB flash drive content from either port on either deck
  - Beat-synced DSP effects (chop, echo, filter, flanger, pan, phaser) with wet/dry fader
  - Automatic BPM analyzer and Tap Tempo for manual BPM entry
  - Slide BPM ±6, 12, 25, and 100% or bend with pitch buttons; Key Lock
  - Seamless looping, sampling, hot cues, Bleep/Reverse
  - Four-channel mixer with per-channel gain, three-band EQ/rotary kills (+12 dB/-INF)
  - Two sets of stereo switchable phono/line inputs
  - Replaceable crossfader with switchable slope and reverse
  - Two large backlit displays
  - Slot-loading drives with touch-sensitive illuminated platters
  - 1/4" mic input with gain and ±15 dB high/low EQ
  - Dual 1/8" and 1/4" headphone outputs with cue gain and mini-crossfader
  - Inputs: Two mic (XLR and 1/4"), four aux (RCA stereo pairs), 30-pin iPad connector, computer (USB, stereo)
  - Stereo outputs: Main (balanced XLR & RCA), Booth (RCA), Record (RCA), Deck 1 (RCA), Deck 2 (RCA), Cue (1/8" & 1/4")
  - iPad Core MIDI and audio support
  - Also works with djay, Virtual DJ Pro and Traktor Pro (each sold separately)
  - Class Compliant with macOS, iOS, and Windows (98SE and up)
  - Includes Serato DJ Lite and djay LE for Mac
