url: https://www.engl-amps.com/shop/cabinets/engl-e412xxl-cabinet/
description: Passive 4 x 12 inch closed-back guitar speaker cabinet in an
  oversized straight housing, loaded with Celestion Vintage 30 speakers and
  rated 240 W at 8 ohms.
details: |-
  The E412XXL will take you into a new dimension of metal sounds. The slanted speaker arrangement provides the dispersion characteristics of a conventional 4 x 12 cab, but the straight housing in XXL format offers even more speaker volume, and thus the decisive bonus of super-fat low end and tighter mids.

  Put simply, this is never-ending headroom. It optimally supports the mid-sized sound of an electric guitar too.

  Add the Celestion Vintage 30s to all that, and the result is a classic among guitar cabs. The housing uses solid birch plywood with a straight front, a closed back and a solid hand-welded metal grille.
specs: |-
  - Passive cabinet, no internal amplification and no mains power
  - Speakers: 12 inch Celestion Vintage 30 made in UK
  - Power handling: 240 W
  - Impedance: 8 ohms
  - Straight front
  - Closed back
  - Slanted speaker arrangement in a straight XXL housing
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand welded metal grille
  - Dimensions: 74 x 84 x 38 cm
  - Weight: 57 kg
