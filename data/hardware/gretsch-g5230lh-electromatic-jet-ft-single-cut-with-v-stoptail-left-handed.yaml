details: |-
  The all-new G5230LH Electromatic Jet FT Single-Cut with V-Stoptail captures that essential Jet power and fidelity in a left-handed configuration at an incredible value.

  A chambered mahogany body with laminated maple top provides a strong sonic profile and exceptional acoustic balance, while Black Top Filter'Tron pickups deliver the signature Gretsch clarity, snap and shimmer.

  A Gretsch V-Stoptail tailpiece sets up rock-solid tuning stability and snappy attack, finishing off a working-class lefty Jet built to gig.
