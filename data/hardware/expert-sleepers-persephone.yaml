description: Persephone is a Eurorack VCA (Voltage Controlled Amplifier) that
  uses a discrete JFET as its gain element, which can be gently or heavily
  overdriven for saturation and distortion effects. It also includes a
  zero-crossing detector that keeps fast gain changes free of clicks.
details: |-
  Persephone is a VCA (Voltage Controlled Amplifier) using a discrete JFET as the gain element. The JFET can be tastefully or violently overdriven for saturation and distortion effects.

  Persephone also includes a zero-crossing detector, which can be used to restrict gain changes to zeros in the audio waveform, preventing the clicks and pops that can occur with very fast envelopes, especially on lower pitched sounds. With the zero-crossing circuit engaged, a simple gate can be used as the CV input without clicks.

  The module's signal and CV paths are 100% analogue, with a little discrete logic involved in the zero-cross circuitry.
specs: |-
  - Discrete JFET gain element, able to be overdriven for saturation and distortion
  - Zero-crossing detector restricts gain changes to zeros in the audio waveform
  - Accepts a simple gate as the CV input without clicks when the zero-crossing circuit is engaged
  - Signal and CV paths 100% analogue, with a little discrete logic in the zero-cross circuitry
