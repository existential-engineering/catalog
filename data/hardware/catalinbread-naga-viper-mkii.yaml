description: The Naga Viper MkII is a treble booster pedal based on the
  legendary Dallas Rangemaster circuit, updated with a new transistor and an
  Attenuate knob that controls input signal level before it hits the booster
  stage. It delivers classic treble-boosted tones into a cranked amp while
  giving modern players the flexibility to tame complex signal chains.
details: |-
  The Naga Viper MkII is Catalinbread's updated take on the Dallas Rangemaster treble booster. A new transistor makes it hotter than the original version, with extended ranges on both Heat and Boost controls.

  The added Attenuate knob lets players reduce incoming signal level before the booster stage, preventing unwanted saturation when running multiple gain devices upstream. The Boost potentiometer uses a rarer value found in select original Rangemaster units, yielding a hotter and slightly gainier response.

  Power supply accepts 9-18V DC center-negative; a 9V battery is also supported. Carries a 3-year warranty.
