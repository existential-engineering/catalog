name: MF
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf/
description: The MF is a satin finish F-model mandolin with simplified
  appointments, built with the same quality construction as fully-appointed
  models. Featuring a fully-carved Adirondack spruce top and Eastern flamed
  maple back and sides, it produces the rich, woody tone expected from a
  professional quality mandolin at a more accessible price.
details: |-
  The MF is an F-style mandolin with a satin nitrocellulose lacquer finish and simple appointments. It features a fully-carved Adirondack spruce top, Eastern flamed maple back, sides, and neck, and F-holes. Appointments include tortoise top binding, an ebony fingerboard with MOP dot inlays, a rounded V neck profile, dovetail neck joint, medium 18% nickel-silver frets, a fully adjustable truss rod, and an ebony peghead veneer with MOP logo. Hardware includes nickel Gotoh tuners with black buttons, an ebony bridge with adjustable saddle, and the original tailpiece. Ships with D'Addario EJ74 strings (.011"-.040") and a deluxe hardshell case.
specs: |-
  - Construction: F-style
  - Top: Adirondack spruce (fully carved)
  - Back & Sides: Eastern flamed maple
  - Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Tortoise (top)
  - Fingerboard: Ebony with MOP dots
  - Frets: Medium 18% nickel-silver
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Truss Rod: Fully adjustable
  - Bridge: Ebony with adjustable saddle
  - Tailpiece: Original tailpiece
  - Tuners: Nickel Gotoh with black buttons
  - Pickguard: None
  - Finish: Satin nitrocellulose lacquer
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
