details: |-
  The Formula 55 is Catalinbread's faithful recreation of the preamp section of the classic Fender Tweed 5E3 Deluxe amplifier, built using an all-discrete JFET-based signal path with part-for-part circuitry replication.

  The pedal features Volume and Tone controls that authentically mirror the 5E3 amp's behavior, along with a Presence control for tuning 5kHz top-end frequencies and a Master volume control with substantial output range.

  The Hi-Lo switch selects between two discrete gain modes: Lo mode emulates the vintage Tweed clean response, while Hi mode simulates a hot-rodded amp with higher-gain tubes.

  Power can be supplied via 9V battery or a regulated 9-18VDC center-negative power supply. Running at 18VDC is recommended for band playing situations, while 9VDC produces softer saturation. Partially drained batteries (3-4V) yield an even softer, more compressed response.
