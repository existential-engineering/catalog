details: |-
  Rugged ribbon microphone designed specially for guitar amps, brass and saxophone

  A must-have for guitarists and brass players alike, the Sontronics DELTA 2 is the successor to the original DELTA, which was our first ever ribbon mic designed specifically to handle high-SPL sources such as guitar amps, sax and brass. Perfect for studio as well as live use, the phantom-powered (active) DELTA 2 delivers all the intimate tone and subtlety you'd expect from a ribbon microphone while being rugged enough to capture powerful signals without overloading or clipping. A favourite with many guitarists and instrumentalists – from Radiohead's Ed O'Brien to the brass players of the London Metropolitan Orchestra – DELTA 2 will guarantee amazing results, whether you're in the studio or on the road. FEATURES

