specs: |-
  - High-SPL Handling: Specifically designed to capture powerful sources like guitar amps and brass instruments without distortion, making it ideal for high-SPL environments.
  - Ribbon Technology: Delivers the warm, intimate tone characteristic of ribbon microphones, while maintaining clarity and detail even with loud signals.
  - Phantom Power Requirement: The DELTA 2 requires phantom power, ensuring enhanced performance and versatility.
  - Versatile Application: Perfect for both studio and live use, making it a reliable choice for guitarists, brass players, and recording engineers alike.
  - Rugged Build: Constructed to withstand the rigours of live performances and extensive studio sessions, ensuring long-lasting reliability.
  - Favoured by Professionals: Trusted by top musicians and orchestras, including Radiohead's Ed O'Brien and the London Metropolitan Orchestra's brass section.
  - UK Precision Engineering: Hand-built and tuned to provide exceptional audio fidelity, capturing the nuances of your instrument with accuracy.
  - Low Noise Floor: Designed to minimise background noise and interference, delivering clean, professional-quality recordings every time.
  - Guitar Amplifiers
  - Brass
  - Microphone type: Ribbon
  - Polar pattern: Figure-of-eight
  - Frequency response: 20Hz to 15kHz
  - Sensitivity: 10mV/Pa
  - Impedance: ≤150 Ohms
  - Max. SPL: (for 0.5% THD @ 1kHz) 140dB
  - Equivalent noise level: 10dB (A-weighted)
  - Connector: 3-pin XLR
  - Power: Phantom power +48V require
  - Product weight: 0.39 kg (0.64 kg with shock mount)
