details: |-
  The 15CM-E adds built-in electronics and an Edge Burst finish to Córdoba's best-selling 15CM ukulele. Built with Mahogany top, back, and sides construction, the 15CM-E provides a rich, clear, and balanced tone both acoustically and when amplified. Aesthetic features such as an elegant Edge Burst finish, Abalone rosette and cream binding on both the body and fingerboard set this concert-sized ukulele apart from other models in its class. Additional features include a sleek satin finish, silver tuners with pearl buttons, and premium Aquila strings. Also available in soprano (15SM) and tenor (15TM) sizes.
