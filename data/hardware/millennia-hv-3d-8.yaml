description: The HV-3D-8 is an eight channel transformerless microphone
  preamplifier in a 19 inch rack chassis. Each channel carries a stepped gain
  control and a balanced path from the microphone input to a laser-trimmed FET
  output stage.
details: |-
  The HV-3D-8 puts eight channels of the Millennia HV-3 microphone preamplifier in a welded 16 gauge steel 19 inch chassis. The transformerless design uses a matched high-speed discrete transistor octet with +23 dBu of input headroom, so no attenuator pad is required.

  Gain runs from 9 dB to 60 dB in 1 dB steps, with 70 dB available on request, and the 36-step controls are stereo matched to 0.08 dB. The laser-trimmed FET-based output stage is rated to drive cable runs of 1000 feet (300 m) and the balanced audio path is specified under 5 ppm THD.

  Switching uses Grayhill mil-spec gold contacts and the worldwide universal supply accepts 80 to 264 V AC at 47 to 63 Hz as well as 12 V DC. Phantom powering is +48 V dc with 15 mA per channel held in reserve.

  Factory options include a ribbon-optimized DC coupled input, an extra 10 dB of gain at no charge, a 130 V DPA (B&K) microphone powering input, each ordered per channel, and a Dante or MADI digital output expander PCB. The page carries a full Dante specification block covering that expander, including dual RJ-45 ports at 1 Gbps in redundant or switched mode and sample rates from 44.1 kHz to 192 kHz.
specs: |-
  - Minimum Gain: 9 dB
  - Maximum Gain (1 dB per step): 60 dB (70dB upon request)
  - Attenuator Pad: none required
  - Frequency Response (analog output option) (+0 / -3 dB): sub 8 Hz to beyond 200 kHz
  - Noise (60 dB Gain, 10 Hz - 30 kHz BW, Inputs common): -132 dBu EIN
  - Total Harmonic Distortion + Noise (35 dB Gain): < .005% (<.001% Typ.)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, 0 dBFS): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, 0 dBFS): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +23 dBu (no pad required)
  - Maximum Output Level (20 Hz - 40 kHz): +32 dBu (analog output option)
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms
  - Phantom Powering: +48 V dc, +/- 2 V dc, 15 ma per channel in reserve
  - Power Consumption: 100 watts maximum, AC universal 80-264V 47-63 Hz, DC 12V
  - Dimensions/Shipping Weight: 19 in W x 1.75 in H x 16 in D, 23 lbs. (8ch)
  - Dante Physical Layer: Ethernet
  - Dante Connectors: Dual RJ-45 (Primary / Secondary)
  - Dante Cable Quality: CAT-5e or better
  - Dante Transmission Speed: 1Gbps
  - Dante Supported Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 176.4kHz, 192kHz
  - Minimum Dante Latency: 250 µS
  - Dante Supported Modes: Redundant / Switched
  - AES67 Support: Planned (Dante embedded)
  - Certifications: FCC CFR 47 Part 15 Subpart B Class A, ICES-03 Issue 6 (Canada), ANSI C63.4-2014, EN 55032:2015, EN 55035:2017, EN 61000-3-2:2014, EN 61000-3-3:2013
  - Compliance: RoHS 2011/65/EU (and delegated directive (EU) 2015/863), WEEE 2012/19/EU, REACH
  - Environmental: 0 to +40 C / +32 to +104 F, 10% to 80% RH, maximum altitude 3,000 meters
