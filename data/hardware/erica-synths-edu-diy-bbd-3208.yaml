description: Bucket brigade delay.
details: |-
  Before digital advancements simplified sound processing, engineers tackled delays using bulky tape echo machines or natural echoes from reflective surfaces. In the late 1960s, engineers Sangster and Teer innovated with the bucket brigade delay (BBD), a system that splits audio into samples passed through a transistor and capacitor chain. This method mimics how sound travels, delaying the output signal relative to the input.

  Over the course of building this module, the architecture of a classic bucket brigade delay is reverse engineered, a bare bones version is recreated on a breadboard, and then a proper BBD chip is used to implement a simple audio delay effect.

  Erica Synths and Moritz Klein developed the mki x es.EDU series of educational DIY kits with one specific goal in mind: to teach people with little to no prior experience how to design analog synthesizer circuits from scratch.

  What is in the box is not simply meant to be soldered together and then disappear in a rack. Instead, the kit takes the builder through the circuit design process step by step, explaining every choice that was made and how it affects the finished module. The kits in the series are simple and come with extensive user manuals that can be downloaded separately.
