description: The 814ce is a Grand Auditorium acoustic-electric from Taylor's
  flagship 800 Series, pairing East Indian rosewood back and sides with a Sitka
  spruce top and V-Class bracing for warm lows, pristine trebles, and natural
  amplified performance via ES2 electronics.
details: |-
  The 814ce sits at the heart of Taylor's 800 Series — the flagship line that first established the brand's premium reputation. The Grand Auditorium body combines a full, balanced sound with versatility that suits fingerstyle, flatpicking, and strumming across genres.

  Taylor's V-Class bracing improves intonation and sustain over traditional X-bracing. The Venetian cutaway provides easy upper-fret access. Premium appointments include West African Crelicam Ebony fretboard and bridge, rock maple body binding, smoked nickel tuners, a radius armrest, and abalone rosette detailing.

  Expression System 2 behind-the-saddle electronics position three sensors behind the saddle for natural, acoustic-forward amplified tone that responds to playing dynamics. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: East Indian Rosewood (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Bridge pins: West African Ebony with Green Abalone Dots
  - Body binding: Rock Maple
  - Fretboard/peghead binding: West African Crelicam Ebony
  - Armrest: Radius design
  - Pickguard: Rosewood
  - Scale length: 25-1/2"
  - Tuners: Smoked Nickel
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
