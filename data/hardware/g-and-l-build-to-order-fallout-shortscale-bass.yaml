description: A 30" short scale bass built around a G&L Magnetic Field Design
  humbucking pickup, controlled by a 3-position mini-toggle switch for parallel,
  split and OMG modes, just like an L•1000. Players used to a traditional 34"
  scale will find this pint size puncher easy to play.
details: |-
  This 30" short scale powerhouse features a G&L Magnetic Field Design humbucking pickup controlled by a 3-position mini-toggle switch for parallel/split/OMG modes, just like an L•1000, bringing anything from modern to old school tones to the fingertips. What's more, players used to a traditional 34" scale will find this pint size puncher super easy to play.

  Other features include an Alder body, Maple bolt-on neck, Caribbean rosewood fingerboard, Saddle-Lock Bridge and G&L Ultra Lite tuners.
specs: |-
  - Construction: bolt-on
  - Scale: 30"
  - Pickups: G&L Magnetic Field Design humbucking pickup
  - Body wood: Alder
  - Neck wood: Natural Satin Hard Rock Maple with Rosewood fingerboard
  - Neck profile: 1 5/8" slim C with 9 1/2" radius, 30" scale length
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: G&L Ultra-Lite with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock bridge
  - Electronics: 3-position mini toggle for parallel/split/OMG pickup modes, volume, tone
  - Includes: G&L Deluxe Gig Bag
