description: The OC18 is a large-diaphragm cardioid condenser microphone
  handcrafted in Vienna. Featuring Austrian Audio's handmade CKR6 ceramic
  capsule with Open Acoustic technology that minimizes internal resonance, the
  OC18 is the OC818's little sibling delivering the same renowned cardioid
  sound. It offers clarity across vocal and instrument applications, matches
  out-of-the-box with other OC18 or OC818 units in cardioid mode, and includes
  an on-board analog high-pass filter and switchable pad.
details: |-
  The OC18 large-diaphragm cardioid condenser microphone uses the handcrafted CKR6 ceramic capsule with Open Acoustic technology, minimizing internal resonance for a clear, natural sound.

  Out-of-box matched with other OC18 or OC818 units in cardioid mode for precise stereo and multi-mic recording. Features on-board analog high-pass filters at 40 Hz, 80 Hz, and 160 Hz, and switchable -10 dB and -20 dB pad.

  Handcrafted in Vienna, Austria.
specs: |-
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity: 13 mV/Pa
  - Equivalent Noise Level: 9 dB SPL (A)
  - Maximum SPL: 148 dB SPL (158 dB SPL with pad)
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 2.2 mA)
  - Connector: XLR 3-pin
  - Dimensions: 157 × 63 × 35 mm
  - Weight: 335g
  - Polar Pattern: Cardioid
  - Low-cut filter: 40 Hz, 80 Hz, 160 Hz switchable
  - Pad: -10 dB, -20 dB switchable
  - Capsule: CKR6 ceramic
  - Handcrafted in Vienna, Austria
