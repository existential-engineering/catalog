description: Dual-channel compressor/limiter (discontinued legacy model).
details: |-
  The dbx 262 (Project 1) is a discontinued dual-channel compressor/limiter from dbx Professional Audio. As a member of the 260-series dynamics processor family, it provided compression and limiting functionality for professional audio applications.

  This unit has been discontinued and superseded by newer dynamics processors in the dbx lineup. Documentation is available through the owner's manual.
