description: True-stereo pedal pairing a tape-style flanged delay with a
  full-featured looper, built for live rigs and studio use.
details: |-
  The ECCOS is a true-stereo pedal that combines a delay with a looper. The delay is a tape-style echo with flanged modulation and detailed control over the repeats, intended for long, sustained delay lines.

  Two footswitches change role with the mode. In delay mode they handle bypass, tap tempo and runaway feedback; in looper mode they record, play, reverse, half-speed and trigger a single play-once pass. The delay and the looper switch independently, so the looper can run with no delay engaged.

  A sound-on-sound mode records new layers without erasing the original loop, with the older layers fading over time in the manner of a reel-to-reel recording. The decay rate is set by holding the feedback knob and turning the Depth control.

  The pedal runs a quad 24-bit, 56-bit Dream DSP with a fully analog dry path, and offers three memory presets, subdivisions, trails and an Alt Hold layer of secondary controls.
