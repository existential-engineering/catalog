name: I-Tech 12000HD
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/i-tech-12000hd
description: A two-channel, 4500W @ 4Ω flagship professional touring amplifier
  with BSS OMNIDRIVEHD DSP, AES/EBU digital input, CobraNet, and HiQnet
  networking.
details: |-
  The I-Tech 12000HD is described as one of the most technologically advanced professional touring amplifiers on the market, delivering 4500W per channel at 4Ω with a 200Vrms peak output voltage. Its 6th-generation Class-I (BCA) output circuitry provides high efficiency and audio fidelity for demanding tour sound applications.

  The amplifier features 24-bit, 192kHz Cirrus Logic SHARC A/D and D/A converters paired with the BSS OMNIDRIVEHD DSP engine, supporting both IIR and linear-phase FIR filters. The LevelMAX limiter suite provides peak voltage and RMS power limiting, while the front-panel USB connector enables preset management.

  Audio inputs include balanced analog plus AES/EBU digital, with CobraNet and HiQnet network connectivity over a true Ethernet backbone. Recommended applications include installed sound and tour sound.
specs: |-
  - 2 channels
  - 4500W per channel @ 4Ω
  - Sensitivity: 1.4Vrms to 7.75Vrms
  - Signal-to-Noise Ratio: >112dB
  - THD: <0.1%
  - Intermodulation Distortion: <0.2%
  - Frequency Response: ±0.25dB
  - Crosstalk: >80dB
  - Common Mode Rejection: >70dB typical
  - 200Vrms peak output voltage
  - BSS OMNIDRIVEHD DSP engine (IIR and linear-phase FIR filters)
  - 24-bit, 192kHz Cirrus Logic SHARC A/D and D/A converters
  - LevelMAX peak voltage and RMS power limiters
  - 6th-generation Class-I (BCA) output circuitry
  - USB front-panel connector for preset management
  - AES/EBU digital audio input
  - CobraNet support
  - HiQnet networking via Ethernet
  - AC Mains: 100–240VAC, 50/60Hz (±15%)
  - Power Connector: 20A IEC
  - Dimensions: 89mm H × 483mm W × 411mm D (3.5" × 19" × 16.2")
  - Net Weight: 12.7 kg (28 lbs)
  - Shipping Weight: 16.3 kg (36 lbs)
