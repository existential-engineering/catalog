description: >-
  The Technics SX-WSA1 is a 64-voice digital synthesizer from 1995 that uses
  Acoustic Modeling Synthesis to combine PCM waveform drivers with DSP resonator
  modeling, offering 56 effects, a 16-track sequencer, and a 61-key velocity and
  aftertouch-sensitive keyboard.
details: |-
  Released in 1995, the SX-WSA1 represented Technics' ambitious entry into the synthesizer market.
  Known primarily for hi-fi equipment, organs, and electric pianos, Technics developed a novel
  synthesis method called Acoustic Modeling Synthesis that combined PCM waveform drivers with
  custom digital signal processing to model the resonant characteristics of acoustic instruments.

  The sound engine offered 64 voices of polyphony across 8 multitimbral parts, with a library
  of 307 selectable drivers and 256 preset sounds plus 256 user-programmable slots. Four
  oscillators per voice fed into 56 DSP effects, providing substantial sound design flexibility.
  The 61-key keyboard responded to both velocity and aftertouch, and a 320x240 backlit LCD
  display provided visual feedback for editing.

  Despite its technical innovation, the SX-WSA1 suffered from poor marketing and premium pricing
  that limited its commercial success. Very few units were produced, making it relatively obscure
  rather than a collector's prize. The onboard 16-track sequencer with 47,000-note capacity and
  full MIDI implementation (In/Out/Thru) made it a capable self-contained production tool, but
  it never gained the recognition that its engineering arguably deserved.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 8 parts
  - Synthesis: Acoustic Modeling (PCM drivers + DSP resonator modeling)
  - Oscillators: 4
  - LFO: 1
  - Drivers: 307 selectable
  - Memory: 256 preset / 256 user sounds
  - Effects: 56 DSP types
  - Sequencer: 16-track, 47,000 note capacity
  - Keyboard: 61 keys, velocity and aftertouch sensitive
  - Display: 320 x 240 backlit LCD
  - Connectivity: MIDI In/Out/Thru
