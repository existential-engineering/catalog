  resonance.
details: |-
  How do you improve on one of the best-selling guitars in the world? Meet my X: High output single coil in neck. Lipstick Humbucker pair in bridge. Coil tap the Humbucker pair with a pull on the tone knob.

  Body features hard top and bottom with hollow inner chamber for outstanding resonance. Die cast chrome knobs.
specs: |-
  - High output single coil pickup in neck position
  - Lipstick Humbucker pair in bridge position
  - Coil tap on Humbucker pair via pull on tone knob
  - Hard top and bottom body with hollow inner chamber
  - Die cast chrome knobs
  - Available colors: Red, Black, Blue, Cream, Aqua
