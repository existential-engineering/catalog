description: >-
  The Moog Slim Phatty is a monophonic analog synthesizer that packs the same sound engine
  as the Little Phatty into a compact, rack-mountable 3U format. It delivers Moog's
  signature thick oscillators and rich ladder filter in a portable, lightweight design
  weighing just 5.75 lbs. It was the first Moog device to feature USB connectivity,
  enabling seamless integration with modern DAW-based studios.
details: |-
  The Slim Phatty was introduced in 2011 as Moog's answer to musicians and producers who wanted authentic Moog sound without the size and weight of traditional Moog keyboards. It shares its entire sound engine with the Little Phatty but eliminates the keyboard, heavy enclosure, and mod/pitch wheels to achieve a dramatically smaller and more affordable form factor.

  Designed for integration into contemporary production environments, the Slim Phatty was the first Moog synthesizer to include USB connectivity, simplifying firmware updates and DAW integration. The unit can be rack-mounted in a standard 3U space or used as a tabletop desktop synth, with optional wooden end caps available for aesthetic enhancement.

  The control panel is slightly smaller than the Little Phatty's but remains comfortable and easy to use. While the onboard modulation options are more limited compared to some modern monosynths, the Slim Phatty is fully compatible with Moog's ecosystem of Moogerfooger effects, the MP-201 multi-pedal controller, and the CP-251 control processor, providing semi-modular flexibility through CV connectivity.

  Firmware updates shared with the Little Phatty brought additional features over time, including velocity sensitivity for volume, alternative tuning scales, and LFO reset capability. In 2013, the Slim Phatty received a cosmetic redesign with a metallic-white faceplate to visually align with the Sub Phatty. Multiple Phatty units can be chained together for polyphonic operation.
specs: |-
  - Monophonic analog synthesizer
  - 2 VCOs with 16', 8', 4', 2' footages
  - Continuously variable waveforms: triangle through sawtooth and square to narrow pulse
  - 1 Low Pass VCF: 24dB/Oct Moog Ladder filter with overload and ADSR
  - 1 Volume amplifier with ADSR envelope
  - LFO with triangle, square, sawtooth, and ramp waveforms
  - Modulation sources: LFO, Filter EGR, Sample and Hold, Osc. 2, Noise
  - Modulation destinations: Pitch, Osc. 2, Filter, Wave
  - Arpeggiator with up, down, and ordered modes with MIDI sync
  - 100 user-editable presets
  - MIDI In/Out/Thru
  - USB connectivity
  - CV control: Pitch CV In (1 V/Oct), Filter CV In, Volume CV In, Keyboard Gate In
  - Rack-mountable 3U format
  - Optional wooden end caps
  - Weight: 5.75 lbs (2.6 kg)
  - Compatible with Moogerfooger effects, MP-201, and CP-251
