description: >-
  The E-mu Planet Phatt is a 32-voice rack-mount sound module tailored for hip-hop, R&B,
  acid jazz, and trip-hop production, loaded with 8MB of ROM samples including tight
  basslines and classic 808 drum sounds. All parameters are MIDI-controllable with
  analog-style signal processing including filters, envelopes, and LFO modulation effects.
details: |-
  The Planet Phatt was E-mu's dedicated hip-hop and urban music production module, packing the essential sounds of the genre into a single rack unit. With 8MB of ROM samples covering tight basslines, thumping 808 kicks, lead sounds, and rhythmic elements common to hip-hop, rap, and R&B, it provided a focused toolkit for producers working in these styles.

  The built-in BEATS mode allows users to generate and perform with groove patterns, making it useful for both studio composition and live jamming. Sound design goes beyond simple preset playback, with analog-style controls including filters, envelopes, and LFO modulation effects. Two LFO sources route to 42 modulation destinations, and two AHDSR envelopes provide detailed amplitude and filter shaping.

  Memory capacity is generous for its era, storing 640 patches, 100 beat patterns, and 28 songs. All parameters respond to MIDI control, enabling deep integration with external sequencers and DAWs. The unit operates as a 32-voice polyphonic module with full MIDI controllability.

  The Planet Phatt spawned several successors in E-mu's lineup: the Mo'Phatt in 2000 expanded to 32MB of sounds and 64 voices, the MK-6 Mo'Phatt Keys added a keyboard in 2002, and the MP-7 Command Station added MPC-style pads and sequencing in 2001. Notable Planet Phatt users include Roni Size, ATB, and Hardfloor.
