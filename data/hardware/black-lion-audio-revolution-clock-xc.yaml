description: Flagship word clock with Macro MMC, 8 BNC outs, dual AES/EBU,
  S/PDIF, and optical outs
details: |-
  The Revolution Clock XC is Black Lion Audio's flagship word clock generator, delivering ultra-stable, low-jitter clocking across 14 outputs. It features patented Macro MMC technology and Suspended Oscillation vibration dampening powered by MEMS oscillators, achieving 0.5 pS RMS of jitter at the BNC outputs. The unit supports sample rates from 44.1 kHz up to 384 kHz over BNC, and can also function as a clock distributor when fed by an external source via its BNC clock input. With 8 BNC word clock outputs, 2 AES/EBU XLR outputs, 2 RCA S/PDIF outputs, and 2 optical S/PDIF outputs, the Revolution Clock XC provides comprehensive synchronization for large digital audio studios.
specs: |-
  - Jitter: 0.5 pS RMS (BNC outputs)
  - BNC Output Impedance: 75Ω, 5V self-terminated
  - AES/EBU Output Impedance: 110Ω, balanced
  - S/PDIF Output Impedance: 75Ω, unbalanced
  - BNC Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384 kHz
  - AES/EBU & RCA S/PDIF Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Optical S/PDIF Sample Rates: 44.1, 48, 88.2, 96 kHz
  - Power: 9V DC, 6W
  - Power Connector: 2.5mm barrel, center positive
  - Dimensions: 19" W x 1.75" H x 6.5" D
  - Weight: 5.5 lbs (2.49 kg)
