description: Multi-mode reference headphones with Vari-Voice technology,
  featuring selectable voicing modes including neutral stereo, mono, and Mixcube
  mode that emulates the midrange response of Avantone's Mixcube monitors.
details: |-
  The MP-1 MixPhones are closed-back, sealed-box reference headphones built
  around Avantone's Vari-Voice technology — a three-position toggle switch
  that selects between full-range stereo ('S'), mono fold-down ('M'), and
  Mixcube mode ('C'), which applies filtering to emulate the midrange-heavy
  response of Avantone's iconic Mixcube studio monitors.

  Powered by 50mm drivers, the MP-1 delivers a frequency response of
  18Hz–25kHz with a 16Ω impedance and 113dB sensitivity at 1mW. The high
  sensitivity makes it usable in loud environments, while the closed-back
  sealed design provides sound isolation and minimizes external leakage.

  The headphones ship with two cable options — a short curly cable and a long
  straight cable — both terminating in a mini-jack connector with a locking
  nut located at the base of the left earcup. The generous padding, pivoting
  construction, and cozy ear cups are designed for comfort during extended
  sessions.

  Available in Black and Creme colorways, the MP-1 has received coverage in
  Sound on Sound (December 2016) and earned a test seal from Professional
  Audio Magazine (April 2022), affirming its position as a versatile mixing
  and monitoring tool.

  The Mixcube mode ('C' position) is particularly valued for translation
  checking — the boosted 600Hz region mirrors the midrange emphasis of the
  Mixcube speakers, enabling engineers to assess how a mix will translate to
  consumer playback devices without reaching for physical reference monitors.
specs: |-
  - Frequency Response: 18Hz–25kHz
  - Driver Size: 50mm
  - Impedance: 16Ω ±2.4 (15%)
  - Sensitivity: 113dB IEC-318 @ 1mW, 1kHz
  - Rated Power: 15mW
  - Maximum Power: 30mW
  - Maximum SPL: 130dB (0.5% THD @ 1000Hz); 146dB with pad engaged
  - Weight: 0.55kg
  - Design: Closed-back, sealed
  - Colors: Black, Creme
  - Cables Included: Short curly cable, long straight cable
  - Connector: Mini-jack with locking nut
