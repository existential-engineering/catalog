description: The 14"x 6" G-Maple snare drum is built on the foundation of a
  thicker 11mm, 13ply Maple shell that gives it a bright sound, but with a
  surprising volume and sensitivity. Its 2.3mm flanged hoops and separate
  low-mass lugs enable the shell to resonate naturally, and enhance its punchy
  sound.
details: |-
  11mm, 12ply Maple + 1 outer Ply Mappa Burl: The 14"x6" G-Maple snare drum is built on the foundation of a thicker 11mm, 13ply Maple shell that gives it a bright sound, but with a surprising volume and sensitivity.

  Steel Mighty Hoop: TAMA's triple flanged 2.3mm steel hoops provide a "wetter" sound than die-cast zinc hoops.

  20 Strand Super Sensitive Hi-Carbon Steel Snare Wire: In order to provide a more crisp and sensitive sound, we redesigned our Snare Wires using new materials, customizing the shape of the plate, and changing the wire coils' winding pattern. As a result, the "Super Sensitive Hi-Carbon Snare Wire” fits more closely to the snare side head, providing greater sensitivity and brighter, crisper sound.
