description: >-
  The MFX is a compact 6HP Eurorack stereo digital audio multi-effects processor
  offering 16 full-featured effect programs plus metering utilities. Drawing on
  DSP technologies from the 1970s to the present day, it covers distortion,
  dynamics, reverb, delay, panning, frequency shifting, ensemble, granular, and
  glitch processing in a skiff-friendly format.
details: |-
  The MFX is ALM Busy Circuits' flagship Eurorack effects processor, packing 16 distinct effect programs into a compact 6HP panel. Each program is a fully-featured engine in its own right, covering distortion, dynamics processing, reverb, delay, ensemble, frequency shifting, panning, granular synthesis, and glitch effects.

  Signal routing is fully stereo. Three freely assignable CV inputs and one clock/trigger input allow any parameter within any program to be modulated or tempo-synced. Via the Axon-1 or Axon-2 expanders this can be extended to up to seven total assignable CV inputs.

  All state is preserved across power cycles. A USB-C port on the front panel enables drag-and-drop firmware updates.
specs: |-
  - Format: Eurorack, 6HP
  - Depth: 32mm (skiff-friendly)
  - Power: +12V 50mA max / -12V 15mA
  - Audio processing: 16-bit / 44.1kHz stereo
  - DSP: ARM CPU-based
  - Effect programs: 16 full-featured programs plus metering utilities
  - CV inputs: 3 freely assignable (expandable to 7 with Axon expanders)
  - Clock/Trigger input: 1
  - Audio I/O: Stereo in / Stereo out
  - Firmware update: USB-C drag-and-drop
  - Presets: Factory + user-saveable per program
  - Reverse power protection
  - Made in England
  - Warranty: 2 years
