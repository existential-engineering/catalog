details: |-
  The MicroPod Series is a modular system consisting of the M1250B miniature condenser microphone combined with either a 6, 12, or 18-inch gooseneck. Designed for applications such as presentations, meetings, and teleconferencing, the MicroPod Series is known for clarity, immunity to RF, excellent sound quality, and ease of operation. The MicroPods have the ability to accurately capture and reproduce speech from a comfortable distance.

  The MicroPod Gooseneck Series is characterized by a uniformly controlled cardioid polar pattern, helping to isolate the speaker from other ambient noise in the room or on the stage. The MicroPod is also available with a hypercardioid polar pattern for tighter pick-up; a shotgun pattern is also available for greater reach and more focused response. With a wide frequency range of 50 Hz – 19 kHz, the MicroPods will provide natural sound with an exceptional transient response.

  One of the advantages of the MicroPod is that the gooseneck can be utilized with any of the microphones from the Micros Series, allowing for more flexibility and a broad range of applications. The MicroPod Series, which is often used in conjunction with the AUDIX ATS Series table stand with a lit on-off switch, may also be used on a standard mic stand when used with the DCLIP microphone stand adapter. The MicroPod Series features a machined brass microphone with an integrated mic preamp, field-replaceable capsule, high-quality gooseneck terminating in a standard XLRm, and a variety of optional accessories. The MicroPod Series require 18 – 52 Volts phantom power and are available in a non-reflective black matte finish.

  Designed, machined, assembled, and tested by AUDIX in the USA.

  Note: ATS10 table stands sold separately.
specs: |-
  - Polar pattern: Cardioid (Hypercardioid and Shotgun also available)
  - Frequency response: 50 Hz - 19 kHz
  - Output connector: XLR (male)
  - Phantom power: 18 - 52 V
