description: >-
  The Creamware Minimax ASB is a desktop digital synthesizer that emulates the classic
  Moog Minimoog Model D with up to 12-voice polyphony. The Authentic Sound Box (ASB)
  provides hands-on hardware control with three virtual VCOs, built-in effects, and
  MIDI/USB connectivity in a keyboardless desktop form factor.
details: |-
  The Minimax ASB was part of Creamware's Authentic Sound Box series, which aimed to bridge the gap between digital and analog synthesis by housing faithful emulations of classic analog circuits in dedicated hardware units. The ASB designation stood for Authentic Sound Box, and the Minimax specifically targeted the iconic Minimoog Model D sound while adding modern polyphonic capabilities that the original monophonic Minimoog never had.

  The front panel closely mirrored the layout of the original Minimoog, with organized sections for output, modifiers, mixer, controllers, and oscillators. A configuration strip below the main controls provided access to modern features like patch memory management and polyphonic mode selection. The unit shipped with 128 factory presets and 128 user-writable memory slots.

  Rear panel connectivity included USB for computer integration and MIDI In, Out, and Thru ports for external controller and sequencer hookups. Creamware provided remote control software for on-screen parameter editing and DAW integration via the USB connection.

  Released during a period when virtual synthesizers still sounded distinctly digital compared to true analog hardware, the Minimax ASB successfully captured the warmth and character that many producers and performers associated with the original Minimoog, while offering the convenience of preset recall and polyphonic playback.
specs: |-
  - Polyphony: 12 voices
  - Multitimbral: 1 part
  - Oscillators: 3 virtual VCOs
  - Waveforms: Pulse, Variable Pulse, Saw Up, Saw Down, Square, Triangle, Sine, White Noise
  - Filter: 3-segment ADS + Release
  - Modulation: Envelope, Glide/Portamento, Mod Wheel, Pitch Wheel, Keyboard, Knob, Hard Sync
  - Envelopes: 2 ADSR (Attack, Decay, Sustain, Release)
  - Effects: Chorus, Delay, Overdrive
  - Memory: 128 factory presets, 128 user presets
  - Connections: MIDI In/Out/Thru, USB, Audio Output
  - Keyboard: None (desktop module)
