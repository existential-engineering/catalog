details: |-
  SOUNDS LIKE A CRANKED 50s TUBE AMP The Interstellar Overdriver is a true overdrive pedal, designed to blast your amp with your sound. Beautifully transparent and based around a discrete circuit, this pedal is all about the natural, wonderful sound of turning an amp up too loud. It's specifically constructed to work the same way as old tube amps - the more you turn it up, the better it sounds. The drive knob sweeps from a slight boost to a beautiful, harmonically rich overdrive. For more control, kick back the output volume with the MASTER knob while retaining the sweetness. There are a lot of pedals out there attempting to do this simple, beautiful thing, but this one is the best.", Details There’s a million amp-in-a-box overdrive pedals out there, but the Interstellar Overdriver is the only one from outer space. We scoured the galaxy in search of the best components to complete this amp-like, discrete, and beautifully transparent overdrive circuit that puts your amp on blast with nothin’ but your awesome tone, and lots of it. We went through painstaking measures to succeed where other drive pedals have failed. The circuit is precisely tuned to counteract the harsh, unnatural fizziness that comes with recreating tube overdrive in a stompbox format. Each component is carefully chosen to reproduce the pleasing, organically overdriven sound of vintage speakers pushed to the max. Achieve stadium-sized “rawk” guitar sounds at bedroom levels with the same dynamic crunch and fluid sustain as a fleet of backline amps turned up to the edge of meltdown. Dial in ragged, tweed style breakup and saturation with realistic, spongy tube-like sag and harmonics. Punch up leads and melodies with a clean boost that adds subtle character while preserving your instrument’s natural tone. Sprinkle some extra vibe on a plain-sounding DI track. Controls Overdriver Sets the input gain for anything from a subtle clean boost to full-on power amp destruction Master Controls the output volume of the effect Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 1 mA Physical Details Dimensions: 4.75" x 4.05" x 2.17" (including hardware) Weight: 12 oz.
