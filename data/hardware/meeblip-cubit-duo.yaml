description: cubit duo is a combined USB MIDI interface and 4-port MIDI thru
  box, mirroring one MIDI output to four jacks with no software lag while also
  functioning as a stand-alone hardware MIDI splitter.
details: |-
  With a computer : connect USB and you get a high-performance 1x1 interface -- one input for playing, one computer MIDI output sent to the four OUT jacks simultaneously. That's four identical outputs with zero software lag, perfect for keeping your gear in sync. With a mobile device: you get a MIDI interface you can use with apps. * Requires USB port and cable, adapter for Lightning-equipped iOS devices. With hardware-only setups: cubit duo works as a stand-alone thru box, connecting any MIDI input to four identical MIDI outputs. cubit duo is lightweight and compact. It's also driverless and USB-powered. And the jacks are top-mounted to fit into tight spaces, even when cabled up. Features:

  Don't forget cables - get a bundle with cubit duo and four MIDI cables at a special price. (*iPhone or older iPad models require Lightning to USB adapter, sold separately. Android may require OTG USB adapter. Compatible device required.)

  Designed and assembled in Canada. cubit duo is available exclusively at meeblip.com and meeblip.eu - we assemble, test, and ship direct to you to keep costs low and quality high. Customers outside the USA and Canada: Y ou may be asked to pay VAT and other fees on delivery. Talk to us if you have questions about international shipping. We have a dedicated store for Europe , including the EU and UK. We ship by the US Postal Service or Canada Post. Frequently asked questions

  Why is this a 1x1 interface, if there are four output jacks? The one port is mirrored across all four output jacks. That allows us to ensure there's no timing difference between the four output jacks. Doesn't that mean all my gear will play the same notes? MIDI has 16 channels, so if you want notes or patterns to be routed to a particular device, you can set that output channel. What do you mean, "ultra-tight timing"? If you want to get scientific, the output circuitry has a maximum propagation delay of 44 nanoseconds - that's billionths of a second. To us humans, it's basically zero lag. How do I set this up with my computer? Do I need to install drivers or something? No drivers are needed - you just plug and play. You'll see cubit go as an additional MIDI input and output, alongside any other MIDI and audio gear you have, inside your DAW's preferences. What happened to cubit splitter and cubit go? We're not kidding when we say it's two gadgets - it literally replaces the functionality of both our previous cubits, cubit splitter and cubit go. We've discontinued those products, because this one does it all. (We'll continue to support them, though - we still use ours!)
specs: |-
  - USB mode: 1x1 USB MIDI interface
  - Standalone/THRU mode: 4-output MIDI splitter (thru box)
  - Four hardware-mirrored MIDI OUT jacks - no software lag, ultra-tight timing
  - Opto-isolated MIDI IN to reduce ground loops
  - High-performance 32-bit ARM Cortex processor
  - Class-compliant USB MIDI - no drivers needed
  - Bright green MIDI light flashes when sending or receiving data for easy troubleshooting
  - Size: 108 x 76 x 25 mm (4.25" x 3:" x 1"), weight: 110 g (3.9 oz)
  - Includes 1 m (3 ft) USB cable
  - USB powered
  - Works with macOS, Windows, Linux, iOS and Android*
