description: Vast range of tones, simple controls. 15 watt Redland Reverb 1x12
  combo with 6V6 power tubes and a Benson Custom Ceramic speaker.
details: |-
  15 watt 1x12 combo version of the Redland Reverb with 6V6 power tubes,
  tube-driven power scaling from 0.5W–15W, and a Benson Custom Ceramic
  speaker. Unique tone stack drawing inspiration from Dumble and Peavey
  designs. Bass control provides a sizable scoop affecting 100Hz–1kHz. Treble
  uses a steeper 12dB/octave rolloff.

  Built with point-to-point construction on terminal strips, Soursound
  transformers with wax-potted output transformer, and Jupiter Yellow
  capacitors. Handmade in Portland, OR.
specs: |-
  - Power: 15W (2x6V6), variable from 0.5W–15W
  - Tubes: 2x12AX7, 1x12DW7 (reverb driver), 6L6GC (voltage regulator for power scaling)
  - Fuse: 3A Slo Blo
  - Speaker: Benson Custom Ceramic 1x12
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Controls: Volume, Wattage, Reverb, Bass, Treble
  - Construction: point-to-point on terminal strips, Soursound transformers, Jupiter Yellow capacitors, 12dB/octave treble rolloff
  - Cabinet: dovetailed pine
  - Dimensions: 23.5"W x 17.5"H x 10"D, 39 lbs
