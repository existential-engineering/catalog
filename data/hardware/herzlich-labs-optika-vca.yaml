description: The Optika VCA is a dual optical VCA built with handmade vactrols,
  offering a non-linear, characterful sound that can be pushed into overdrive
  for added harmonics.
details: |-
  Yes, you have VCAs - but none like this

  I won't repeat the old motto: you can never have enough VCAs. You can. You probably have enough clean, well-behaved VCAs that show up, do the job and never cause any trouble. But this, this , is not that. This is Optika - an optical VCA, built with our very own handmade vactrols. It's got all the vactrol character you love, delightfully non-linear and easily pushed into overdrive for interesting harmonics. Two channels of drunken muscle that help you turn even a clock signal into organic plucks. The kind of slewy, chewy stuff that makes envelopes of gates, the kind that overdrives and gives you stink-face, the kind that de-sterilizes your digital waveforms, the kind that's got home made vactrols with no palm oil inside them, the kind that makes you fall in love with vactrols all over again. If I haven't convinced you at this point, nothing will. Go make ordinary music with clean, boring VCAs, I can't stop you - only you can make that choice.
specs: |-
  - Dual optical VCA - enjoy the natural sound of vactrols
  - Colorful sound - decidedly non-transparent VCA which imparts character
  - Handmade vactrols - get them before they're outlawed forever
  - These vactrols don't bleed - that's right, they fully close
