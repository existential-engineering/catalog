description: Instantly recognisable, bestselling straight-fronted 4x12" guitar speaker cabinet that forms the base half of the classic Marshall full stack. Loaded with four 12" Celestion G12T-75 speakers, the 1960B handles 300W in mono or 150W in stereo, and can be wired for 16 or 4 ohms in mono or 8 ohms in stereo via the rear-panel jack and switch. Built for the big stage, it pairs with any 1959/1987/JCM-style head to deliver the iconic Marshall stack tone.
details: |-
  The 1960B 4x12 Base Cabinet is renowned for its exceptional sound quality and is widely regarded as one of the best-selling 4x12" cabinets globally. Specifically designed to produce a powerful and impactful sound during live performances, this cabinet effortlessly captures the essence of the 60s era with its authentic design. With a formidable power output of 300W, it is well-equipped to meet the demands of any musical performance.

  The straight version of this amp will give you a thicker low-end sound. Alternatively, you can pair the 1960A Angled Cabinet and the 1960B Base cabinet together to create the perfect Marshall stack.

  Built in the Marshall UK factory with four 12" Celestion G12T-75 speakers, it complements a variety of tones and switches between mono and stereo.

  Designed and engineered in UK. Made in UK.
specs: |-
