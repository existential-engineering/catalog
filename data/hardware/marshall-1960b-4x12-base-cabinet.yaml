description: Instantly recognisable, bestselling straight-fronted 4x12" guitar
  speaker cabinet that forms the base half of the classic Marshall full stack.
  Loaded with four 12" Celestion G12T-75 speakers, the 1960B handles 300W in
  mono or 150W in stereo, and can be wired for 16 or 4 ohms in mono or 8 ohms in
  stereo via the rear-panel jack and switch. Built for the big stage, it pairs
  with any 1959/1987/JCM-style head to deliver the iconic Marshall stack tone.
details: |-
  - Straight-fronted (base) 4x12" cabinet — bottom half of the classic Marshall full stack
  - Loaded with four Celestion G12T-75 speakers
  - 300W mono / 150W stereo power handling
  - Mono/stereo switchable with selectable 16Ω/4Ω mono or 8Ω stereo impedance
  - Pairs with 1959, 1987 and JCM-series Marshall heads
