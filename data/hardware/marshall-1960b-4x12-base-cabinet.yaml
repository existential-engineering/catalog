  - Speaker model: Celestion G12T-75 (16 ohm, 75W)
  - Power handling: 300W mono, 150W stereo
  - Unit impedance: 16/4 ohm mono, 8 ohm stereo
  - Inputs: 2, switchable between mono and stereo
  - Passive cabinet: no mains connection, powered by the amplifier driving it
