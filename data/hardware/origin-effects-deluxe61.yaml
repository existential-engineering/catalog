description: The DELUXE61 provides a full circuit recreation of the sought-after
  Fender Brown Deluxe, with an all-analogue signal path including a Class A
  preamp, push-pull output stage, and reactive load. It features an authentic
  bias tremolo circuit alongside its overdrive, plus a Post-Drive EQ and TRS
  footswitch jack for remote tap tempo and tremolo control.
details: |-
  The DELUXE61 faithfully recreates the rich cleans, raunchy overdrive and dynamic, musical tremolo of the Fender Brown Deluxe with an all-analogue, valve amp-style signal path and an authentic bias tremolo circuit. Smooth, deep and rich, bias tremolo modulates the bias voltage of the amp's output valves, allowing the player to "play through" the tremolo: picking harder causes the effect to fade, returning as notes die away or the guitar volume is rolled back.

  A more prominent, choppier "full wave" tremolo setting was added, along with a MULTI switch that doubles or triples the SPEED knob's range (or an external tap tempo). A TRS footswitch jack allows remote control of tremolo and tap tempo.

  The built-in Post-Drive EQ tailors the pedal's output to work with a wide range of amps, flat-response power amps, cabinet simulators and recording interfaces. Housed in a hand-polished, brushed stainless steel enclosure with aluminium controls, Neutrik jack sockets and a heavy-duty footswitch.
