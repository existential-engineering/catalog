description: Plug into pure nostalgia. Artifakt delivers all the hazy, scratchy,
  wobbly, and beautifully broken tones that embody the lo-fi sound.
details: |-
  Artifakt Lo-fi Elements is a multi-effect pedal built around lo-fi sound design. It offers old-gear simulations through filtering, saturation, and modulation, along with various modulation shapes and primitive reverb/echo effects (uVerb).

  The pedal covers natural overdrives and digital distortion, Moog Ladder Filter exploration, noise generation, vinyl crackle and pop effects, and glitch pattern sampling, delivering the hazy, scratchy, wobbly, and beautifully broken tones associated with the lo-fi aesthetic.

  Artifakt features true stereo inputs and outputs with Universal Bypass (signal relays or transparent buffers) and dual footswitches for engagement/bypass and preset control. It stores 128 presets (16 accessible via pedal controls, 128 via MIDI).

  It integrates with Neuro 3 software (Mac/Windows) and mobile apps (iOS/Android) for deep customization and effect sharing, and supports MIDI over 3.5mm and USB-C.
specs: |-
  - Lo-fi multi-effect: filtering, saturation, modulation, uVerb reverb/echo
  - Natural overdrive and digital distortion
  - Moog Ladder Filter, noise generation, vinyl crackle/pop, glitch sampling
  - 128 presets (16 via pedal controls, 128 via MIDI)
  - True stereo inputs and outputs
  - Universal Bypass (signal relays or transparent buffers)
  - Dual footswitches for engage/bypass and preset control
  - Neuro 3 software integration (Mac/Windows, iOS/Android)
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 1 lb
  - Power consumption: 200 mA (1.8 watts)
