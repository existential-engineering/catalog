details: |-
  The BAE Audio Bi Polar PSU is a hand-wired power supply designed to power API-format 500-series and lunchbox-style rack modules. It delivers a true bi-polar ±16V rail along with 48V phantom power at 0.1A.

  Available in two variants: the small model targets 6-space lunchbox or single/dual 19″ rack configurations, providing 1.6 amps of current. The large model is designed for 11-space racks and delivers 2.1 amps.

  The unit is convertible to international mains voltages (100V, 220V, 230V, and 240VAC) and ships with an AC cable included. Construction follows BAE Audio's traditional hand-wired approach.
specs: |-
  - Voltage Output (Small): ±16V @ 1.6A
  - Voltage Output (Large): ±16V @ 2.1A
  - 48V Phantom Output: 0.1A
  - Weight: 4 lbs / 1.81 kg
  - Dimensions: 5.75"W × 3.5"L × 7.5"D
  - Input Voltages: convertible to 100, 220, 230, 240 VAC
