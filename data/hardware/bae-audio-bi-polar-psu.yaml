details: |-
  The BAE Audio Bi Polar PSU (6 Space / 1.6A) is a hand-wired power supply designed to power API-format 500-series and lunchbox-style rack modules. It delivers a true bi-polar ±16V rail at 1.6 amps along with 48V phantom power at 0.1A.

  This model targets 6-space lunchbox or single/dual 19″ rack configurations. A larger 11-space model rated at 2.1A is also available.

  The unit is convertible to international mains voltages (100V, 220V, 230V, and 240VAC) and ships with an AC cable included. Construction follows BAE Audio's traditional hand-wired approach.
specs: |-
