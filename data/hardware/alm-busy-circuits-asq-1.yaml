description: >-
  The ASQ-1 is a multi-mode Eurorack sequencer that simultaneously sequences two
  CV/gate and four trigger patterns, plus performs clock-synced quantisation of
  an external CV signal, with SH-101 style step-time note entry and drum machine
  pattern editing via mechanical keys.
details: |-
  The ASQ-1 is a 32HP Eurorack sequencer combining two melodic CV/gate sequencers, four trigger pattern sequencers, and a dedicated clock-synced CV quantiser in a single module.

  Note entry follows the classic SH-101 step-time approach via satisfying mechanical computer-style keys, while drum pattern editing uses a drum machine style interface on the same keys. The two melodic sequencers and four trigger patterns can run at independent lengths for complex polyrhythmic structures.

  An external CV quantiser input accepts any pitch CV signal and outputs it snapped to a selected scale, clock-synced for rhythmically cohesive results. Patterns save automatically and persist across power cycles. Din Sync support (toggleable at boot) enables integration with legacy Roland equipment.
specs: |-
  - 32HP width, 32mm depth
  - +12V: 50mA, -12V: 10mA
  - 2x CV/Gate sequencers (SH-101 step-time entry)
  - 4x trigger pattern sequencers (drum machine style)
  - 1x clock-synced CV quantiser
  - Independent poly-rhythmical sequence lengths
  - Din Sync support (toggleable at boot)
  - CV/gate overdub mode
  - USB-C for firmware updates and data backup
  - Reverse power protection
