details: |-
  The 73 Ram's Head is a faithful recreation of the rare 1973 'Ram's Head' version of the EHX Big Muff Pi. This variant is widely considered one of the most sought-after Big Muff versions, known for its distinct midrange cut and aggressive fuzz character.

  JHS produced this as a limited run in October 2013 to make this classic circuit accessible. Now discontinued.
