name: BaseTwo25
manufacturer: amphion
primaryCategory: subwoofer
categories:
  - studio-monitor
url: https://amphion.fi/products/basetwo25/
description: The BaseTwo25 is a state-of-the-art bass extension system that
  converts two-way studio monitors into full-range, three-way monitoring
  systems. Driven by the BaseAmp1200 amplifier with discrete filtering and a
  4-step selectable crossover, it maintains stereo information across all bass
  frequencies.
details: |-
  The BaseTwo25 is designed to extend two-way studio monitors into full-range, three-way systems, seamlessly integrating with all monitor sizes. It features a force-cancelling driver configuration and is switchable between 2-way and 3-way operation.

  The BaseTwo25 cabinet uses a one-way, passive radiator operating principle with two 10" aluminum woofers and two 10" aluminum passive radiators. It delivers a frequency response of 20–100 Hz (±3dB) and a maximum SPL of 127dB.

  The included BaseAmp1200 amplifier provides 700W into 4Ω and features a dynamic range of 127dB (A-weighted) with extremely low distortion: 0.0025% THD+N at 10W and 0.0015% at 100W.

  A 4-step selectable crossover allows tuning at 40, 60, 80, or 100 Hz to match different monitor models. Connection to the monitors is made via included 3.5m Neutrik Speakon terminators.

  Both the BaseTwo25 cabinet and BaseAmp1200 are manufactured in Finland and sold per pair.
specs: |-
  - Operating Principle: One-way, passive radiator
  - Drivers: 2×10" aluminum woofers, 2×10" aluminum passive radiators
  - Frequency Response: 20–100 Hz ±3dB
  - Max SPL: 127dB
  - Dimensions (cabinet): 953×360×386 mm
  - Weight (cabinet): 2×32 kg per unit
  - Crossover Frequencies: 40, 60, 80, 100 Hz (4-step selectable)
  - BaseAmp1200 Power: 700W @ 4Ω
  - BaseAmp1200 Dynamic Range: 127dB (A-weighted)
  - BaseAmp1200 Mains: Universal 100–240V
  - BaseAmp1200 Dimensions: 88×483×260 mm
