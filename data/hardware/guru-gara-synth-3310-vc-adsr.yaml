details: |-
  3310 VC-ADSR (Voltage Controlled Envelope Generator)

  The 3310 VC-ADSR Eurorack PCB and Front Panel Kit is a DIY voltage controlled envelope generator based on the reliable CEM3310 / AS3310 IC. Designed for Eurorack modular systems, this ADSR provides precise and flexible envelope shaping, suitable for both beginner and intermediate builders. Key Features

  Envelope Control & Performance

  The 3310 VC-ADSR offers precise control over envelope shaping, from fast, snappy transients to long, evolving contours. Voltage control over each ADSR stage allows for dynamic modulation and expressive patching, while the LED display provides clear visual feedback of the envelope shape in real time. Gate Input & Integration

  For effortless integration into Eurorack systems, the module can receive a gate signal directly from the power bus via the ribbon power cable. Inserting a gate jack overrides the bus signal, allowing the use of an external gate source for flexible patching options. DIY Build & Front Panel

  This DIY Eurorack ADSR PCB and front panel kit is designed to be approachable for builders with basic soldering experience. The front panel is made from durable PCB material and hand screen printed, giving the finished module a distinctive and high-quality appearance. A simplified non-CV version of this envelope generator is also available. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
