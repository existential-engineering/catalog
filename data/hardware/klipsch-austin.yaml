details: |-
  The Austin is Klipsch's pocket-sized portable speaker built for outdoor and on-the-go listening. It houses a 1.5" full-range driver backed by dual passive radiators for enhanced bass, delivering 18W of output power.

  Connectivity is handled via Bluetooth 5.3 with a 40-foot wireless range. Broadcast Mode lets users link 10 or more compatible speakers together. A built-in microphone supports hands-free calls.

  The speaker carries an IP67 rating, meaning it is completely dust-proof and can be submerged up to 1 meter for 30 minutes. The integrated USB-C port supports 18W fast charging, providing up to 12 hours of playback per charge. A built-in carrying strap makes it easy to attach to bags or gear. The Klipsch Connect Plus app provides EQ customization. Available in Black and Cream.
