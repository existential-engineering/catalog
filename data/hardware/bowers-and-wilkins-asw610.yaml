description: The ASW610 subwoofer moves large volumes of air for high-quality
  low-frequency output with an amplifier to keep the compact unit running cool.
details: |-
  ASW610 is the middle subwoofer in the Bowers & Wilkins ASW Series and is an active closed-box subwoofer system. Bowers & Wilkins positions it as highly capable in either a hi-fi or a home theater set-up, and small enough that a room can be filled with bass rather than with speakers.

  The single 250mm (10in) paper and Aramid fibre long-throw cone is what moves the large volumes of air needed for high-quality low-frequency output, and Bowers & Wilkins credits an audiophile-standard amplifier with keeping the compact unit running cool. The shared ASW information sheet puts a figure on it, a 200W ICEpower Class D amplifier. The enclosure is sealed, which Bowers & Wilkins says keeps the bass tight.

  Quoted performance is +/-3dB from 27Hz to an adjustable 40 / 140Hz with the EQ in position A, and a frequency range reaching -6dB at 20Hz. Bass extension is switchable across three positions, -6dB at 20Hz in A, 25Hz in B and 30Hz in C.

  All tuning happens on the amplifier panel. The listed controls are input level for line in, input level for speaker in, low-pass filter frequency for the line input only, low-pass filter bypass, bass extension, bass roll-off alignment, auto sense on and standby, and a phase switch. The low-pass filter itself is an active 4th-order design with a variable cut-off frequency.

  Connections listed are a line in on RCA phono, a speaker in on binding posts and a 12v trigger on a 3.5mm jack, with 33kOhm input impedance and better than 90dB signal to noise. As an active design it takes mains power and draws 40W in use, 0.5W in standby. The cabinet is 310mm (12.2in) high without feet or spikes and 310mm (12.2in) wide, 347mm (13.66in) deep without grilles and 375mm (14.8in) including grilles and controls, weighing 12.5kg (27.6lb). Cabinet finishes are Black and White, grilles Black or Grey.
specs: |-
  - Description: active closed-box subwoofer system
  - Drive units: 1 x 250mm (10in) paper / Aramid fibre cone long-throw
  - Frequency response: +/-3dB 27Hz to 40 / 140Hz adjustable (EQ at A)
  - Frequency range: -6dB at 20Hz and 25 / 140Hz adjustable (EQ at A)
  - Bass extension: -6dB at 20Hz (position A), -6dB at 25Hz (position B), -6dB at 30Hz (position C)
  - Amplifier: 200W ICEpower Class D
  - Technical features: input level (line in), input level (speaker in), low-pass filter frequency (line in only), low-pass filter bypass, bass extension, bass roll-off alignment, auto sense on / standby, phase switch
  - Low-pass filter: active 4th-order, variable cut-off frequency
  - Inputs: line in (RCA Phono), speaker in (binding post), 12v trigger (3.5mm jack)
  - Power consumption: 40W / 0.5W standby
  - Input impedance: 33kOhm
  - Signal / noise: >90dB
  - Dimensions: height 310mm (12.2in) not including feet or spikes, 322mm (12.7in) including feet, 338mm (13.3in) including spikes; width 310mm (12.2in); depth 347mm (13.66in) not including grilles, 375mm (14.8in) including grilles and controls
  - Net weight: 12.5kg (27.6lb)
  - Cabinet finishes: Black, White
  - Grille finishes: Black, Grey
