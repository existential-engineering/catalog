description: A passive stereo attenuator that accepts both CV and stereo audio
  signals, allowing simultaneous attenuation of two CV signals or one stereo
  audio signal.
details: |-
  You're not seeing double - it's a stereo attenuator! One attenuator is pretty cool, but two? That's even cooler. Twice as cool? Maybe, but let's not worry about that yet. Stereo is the future, I've been told. Most of us, after all, were born with two eyes, two ears, two hands and one strong desire to wiggle knobs - why limit yourself to a mere mono attenuator, when you could be simultaneously attenuating two CV signals, or one stereo audio signal? Operation is simple: plug your signal in, set the desired attenuation level and leave it alone . Create subtle movement, submixes and interesting dynamics easily and comfortably with this spin-off of a new version of the module this company was founded on, the Flatliner . No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 8hp 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Accepts both CV and stereo audio signals
  - Control the intensity of LFOs, envelopes or even audio
  - Goes from wide open to fully closed
  - Passive design: no external power, no batteries
