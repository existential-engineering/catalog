description: A space-saving reference monitor for the critical listener, and the
  smallest Harbeth engineered around the exclusive 200mm RADIAL2 bass/mid unit
  derived from the reference M40.3.
details: |-
  Harbeth's design team has redefined the virtues of a speaker which has won worldwide accolades to a new intensity, allowing rarefied audio transparency to be revealed and ultimately enjoyed.

  The smallest Harbeth to be engineered around the exclusive 200mm RADIAL2 bass/mid unit, derived from the reference M40.3, this space saver monitor disappears into any listening room. The outstanding midrange clarity and controlled bass bring music to life in a wide range of domestic listening environments.

  The M30.2 XD loudspeaker takes the Harbeth tradition of stunning musical involvement to another performance level.

  The cabinets are handmade and feature veneers that vary in colour, shade and grain structure. Not all finishes are available in all countries.
specs: |-
  - Technical features: 200mm Harbeth RADIAL2 bass/mid, 25mm ferrofluid-cooled tweeter
  - Frequency response: 50Hz to 20kHz, +/-3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms, easy to drive
  - Sensitivity: 85dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W per channel
  - Power handling: 150W programme
  - Dimensions: 460 x 277 x 275 mm (+12mm for grille and binding posts)
  - Connectors: two 4mm Harbeth branded binding posts
  - Weight: 11.6kg each (without packing)
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with the tweeters (tweeter 320mm up from cabinet base)
  - Packing: single speaker per protective carton
  - Grille colour: black
  - Finishes: oak, walnut, cherry, rosewood, black ash, silver willow
