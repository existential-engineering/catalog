description: The H6 is the ultimate portable recorder. With its advanced preamps
  and interchangeable capsules, the H6 delivers unmatched versatility and
  award-winning quality.
details: |-
  From podcasting to music to filmmaking and more, the H6 is a go-to recorder. From the studio to remote locations, podcasts are produced everywhere, and with inputs for every guest the battery-powered H6 is a complete portable podcasting solution.

  The H6 is a personal music studio around the clock. With up to six discrete line-level or mic-level inputs (the sixth pair requires the optional EXH-6 mic capsule), plus the ability to overdub and more, the H6 provides the road from a great idea to the perfect track. Featuring interchangeable mic capsules, four combo inputs and six tracks of quality recording, it is ready to record on any set and in any scene the director throws at you.

  Six interchangeable mic capsules are available. The XYH-6 X/Y capsule comes standard with the H6 and adds two matched high-quality unidirectional microphones. The MSH-6 is a mid-side capsule, which allows the width of the stereo image to be adjusted after recording. The XYH-5 pairs two matched unidirectional condenser microphones at a 90 degree angle inside an advanced shockmount. The SGH-6 shotgun capsule adds a hyperdirectional microphone for film, video, live theater and ENG work. The SSH-6 mid-side stereo shotgun capsule combines a super-directional centre microphone with a bidirectional side microphone for a fully mono-compatible stereo image. The EXH-6 Dual XLR/TRS Combo capsule connects two additional discrete channels for external microphones, instruments, mixers or portable music players.

  The H6 offers four XLR/TRS combo jacks with dedicated pad switches and gain control for distortion-free recording. It features two 1/8-inch outputs, a stereo line out as well as a headphone out with dedicated volume control. The USB port enables it to serve as a stereo or multi-channel audio interface for a computer or iPad.

  Record continuously for over 20 hours with just four AA batteries, or extend recording time with the optional AD-17 adapter. The H6 records individual WAV files, and its 2.0-inch full-colour angled LCD shows levels for every track at once.
specs: |-
  - Interchangeable input capsules
  - Six-track simultaneous recording
  - Four mic/line inputs with XLR/TRS combo connectors
  - Gain control knobs and -20 dB pads for each input
  - Supplied XYH-6 X/Y capsule provides secondary input via a stereo 1/8-inch Mic/Line In mini phone jack
  - Phantom power for all main inputs: +12V/+24V/+48V, switchable independently per input
  - Large full-color, angled LCD display
  - Records directly to SD, SDHC and SDXC cards up to 1 TB
  - Up to 24-bit/96 kHz audio in BWF-compliant WAV or a variety of MP3 formats
  - Auto-Record, Pre-Record and Backup-Record functions
  - Built-in effects, including low-cut filtering, compression, and limiting
  - Multichannel and stereo USB audio interface for PC/Mac/iPad
  - Accepts standard AA alkaline or NiMH rechargeable batteries
  - Over 20 hours of operation with 4 AA alkaline batteries
  - Recording media: SD card 16 MB to 2 GB, SDHC card 4 GB to 32 GB, SDXC card 64 GB to 1 TB
  - XYH-6 X/Y mic: unidirectional, sensitivity -41 dB at 1 kHz and 1 Pa, input gain -inf to 46.5 dB, max sound pressure input 136 dB SPL
  - XYH-6 Mic/Line In: 1/8-inch stereo mini jack, input level -inf to 46.5 dB, input impedance 2 kohm, plug-in power 2.5V supported
  - MSH-6 MS mic: unidirectional and bi-directional, sensitivity -37 dB and -39 dB at 1 kHz and 1 Pa, input gain -inf to 42.5 dB, max sound pressure input 120 and 122 dB SPL
  - Inputs 1 to 4: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain -inf to 55.5 dB with pad off and -inf to 35.5 dB with pad on
  - Inputs 1 to 4: input impedance 1.8 kohm or more, max input level +22 dBu with pad on, equivalent input noise -120 dBu or less
  - Line Out: 1/8-inch stereo mini jack, rated output level -10 dBu into 10 kohm or more
  - Phone Out: 1/8-inch stereo mini jack, output level 20 mW + 20 mW into 32 ohm load
  - Built-in speaker: 400 mW, 8 ohm, mono
  - WAV: 44.1/48/96 kHz at 16/24-bit, mono or stereo, BWF-compliant, maximum 8 simultaneous tracks (L/R + Inputs 1 to 4 + L/R backup, backup recorded 12 dB below the set L/R input gain)
  - MP3: 44.1 kHz at 48 to 320 kbps, maximum 2 simultaneous tracks
  - Display: 2.0-inch full colour LCD, 320 x 240 pixels
  - USB mass storage class operation: USB 2.0 High Speed
  - USB audio interface, multi-track mode: USB 2.0 High Speed, 6 in / 2 out, 44.1/48/96 kHz at 16/24-bit
  - USB bus powered operation possible
  - Power requirements: 4 x AA (LR6) alkaline or NiMH batteries, optional AD-17 AC adapter (DC 5V/1A, USB type), or USB bus power
  - Battery life with alkaline batteries, continuous recording: over 20 hours
  - Dimensions and weight, H6: 77.8 (W) x 152.8 (D) x 47.8 (H) mm, 280 g
  - Dimensions and weight, XYH-6: 78.9 (W) x 60.2 (D) x 45.2 (H) mm, 130 g
  - Dimensions and weight, MSH-6: 58.0 (W) x 67.6 (D) x 42.1 (H) mm, 85 g
