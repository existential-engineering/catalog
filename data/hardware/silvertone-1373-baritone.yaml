details: |-
  Silvertone Baritone 1373 - Black Silver Flake:

  In 1958, Silvertone introduced the 1373 model 6-string bass tuned low E to E, one octave below standard guitar tuning. In Nashville around this time, a very distinctive bass sound began evolve into what became known as the tic-tac technique. This involved doubling the acoustic bass lines with the six-string bass played with a pick. The sound of this instrument was made famous with Glen Campbell's iconic six string bass solo on his hit single Wichita Lineman. With this new version, we have transformed the 1373 into a baritone tuning instrument. The 28" scale neck is designed to be tuned B to B. This baritone tuning was hugely popular in 1960's surf rock and spaghetti western soundtracks. Their muscular twang added distinctive tones to these early recordings. The baritone sound is going strong today with a resurgence in classic country, indie bands and heavy metal! The all new Silvertone 1373 baritone gets its punch and sustain from the solid mahogany body and string through body bridge which further enhances the resonance and sustain. The 28" scale adds just the right amount of length to allow the lower strings to really 'speak', without moving too far from the comfortable feel of standard tuning guitars. 'Hemispherical' rounded fret ends provide an exceptionally comfortable playing surface. Our new Alnico 6 Silvertone Lipstick pickups are designed to offer all the clean tones and bell like top end of the original pickups, with a bit more output to comfortably drive your pedals, tube amp, or digital modeler. This baritone guitar is sure to add inspiring new colors to your playing and recording.
