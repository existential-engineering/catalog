description: The Zoom Q2n-4K combines unrivaled audio with crisp 4K imaging to
  completely capture your rehearsals, performances and live streams like never
  before.
details: |-
  The Q2n-4K combines audio from Zoom's X/Y stereo microphones with 4K imaging, for rehearsals, performances and live streams. Five field of view settings cover a full band or a solo act, and the 150-degree lens and color LCD make it easy to frame the shot. At the touch of a button it captures video at up to 4K Ultra HD resolution.

  The X/Y stereo microphones are designed to handle everything from saxophone to heavy metal. High dynamic range (HDR) technology automatically adjusts the exposure so stage lighting effects do not blow out the shot, and 12 Scene presets cover a wide range of environments including Jazz Club, Concert Light, Dance Club and Outdoor, plus an Auto scene setting that detects the current lighting and selects the appropriate balance.

  Audio can be monitored over headphones from the 1/8 inch stereo output jack. The Q2n-4K streams performances live to Facebook, YouTube, Twitch and more, and its audio can be sent to an iOS device for mobile podcasting and streaming (an iPad Camera Connection Kit or Lightning to USB Camera Adapter is required and sold separately). A micro HDMI video output sends the video to an HDTV.

  Video with audio is recorded as an MPEG-4 (MOV) file. In Camera Off mode, audio can be saved independently in uncompressed WAV format up to 24-bit/96 kHz. Recording goes to microSD, microSDHC and microSDXC cards, and with a microSDXC card a longer session can be recorded up to 1 TB as a single file.

  Power comes from two AA batteries, a third-party USB power supply or the ZOOM AD-17 AC adapter, and a BCQ-2n battery case extends recording time up to four times. In the box are the Q2n-4K, a lens hood, a lens cap and a Quick Guide.
specs: |-
  - Image sensor: 1/2.3 inch 16 M-flexible CMOS sensor
  - Lens: F2.8, 150 degree field of view (f2.8/15.2 mm)
  - Video format: MPEG-4 AVC/H.264 (MOV), bitrates up to 76 Mbps
  - Video resolutions: 4K at 30p, 25p and 24p. 1080 at 60p, 50p, 30p, 25p and 24p. 720 at 30p and 25p
  - Audio formats: WAV 96 kHz/24-bit, 48 kHz/24-bit, 44.1 kHz/16-bit
  - Audio functions: LO-CUT (off, 80 Hz, 120 Hz, 160 Hz), AUTO GAIN (off, concert, solo, meeting), DELAY 0.0 F to 10.0 F during web camera use, direct monitor on/off during USB mic use
  - Image functions: FOV in 5 steps (WIDE to TELE). SCENE settings AUTO, OUTDOOR, SUNSET, NIGHT, CONCERT LIGHT, JAZZ CLUB, DANCE CLUB, MONOCHROME, SEPIA, FILM, X-PROCESS and FLAT
  - Display: 1.77 inch full-color LCD, 160 x 128
  - Built-in mic: fixed 120 degree XY stereo mic, maximum sound pressure 120 dB SPL, input gain -inf dB to +39 dB
  - External input: stereo mini jack supporting plug-in power (2.5 V), input impedance 2 kohm or higher, input gain -inf dB to +39 dB
  - Outputs: combined headphone/line stereo mini jack, and micro HDMI Type D
  - Built-in speaker: 300 mW 8 ohm mono speaker
  - Recording media: microSDHC and microSDXC cards, class 10 or higher, up to 1 TB
  - USB (micro USB): webcam class UVC 1.0 plus UAC 1.0, 720p WVGA video with 48 kHz/16-bit audio. Card reader class USB Mass Storage. USB mic class UAC 1.0 at 44.1 kHz/16-bit. Card reader and USB mic functions support iOS devices
  - HDMI video output selectable between NTSC and PAL
  - Power: 2 AA batteries (alkaline LR6 1.5 V, NiMH HR6 1.2 V or lithium FR6 1.5 V), ZOOM AD-17 AC adapter at DC 5 V/1 A, USB bus power supported
  - External dimensions (main unit, maximum): 58.7 mm D x 68.5 mm W x 83.0 mm H
  - Weight (main unit only): 124 g
  - Built-in standard tripod mount
  - Compatible with OBS Open Broadcaster Software, Skype and other streaming applications
