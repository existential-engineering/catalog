name: MM-2D-E
manufacturer: tascam
primaryCategory: mixer
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/mm-2d-e
description: Compact half-rack 2-channel Dante mixing station for professional
  installation. Accepts two balanced mic/line inputs with +48V phantom power via
  Euroblock connectors and delivers two balanced line outputs, while
  simultaneously exchanging 4 channels in each direction over Dante. Features a
  built-in 6-in/4-out DSP matrix mixer with compressor, 4-band EQ, 10-band
  output EQ, ducking, ambient noise compensation, and up to 50 scene presets.
  Powered via PoE Class 0 or optional external adapter. European Euroblock
  variant.
details: |-
  Half-rack Dante mixing station (214×44.45×136.1mm, 878g) for European installation. Two Euroblock mic/line inputs (3.81mm pitch, +48V phantom, adjustable gain -74 to +26 dBu). Two Euroblock line outputs (3.81mm pitch, nominal +4 dBu, max +15 to +24 dBu switchable). Built-in 6-in/4-out DSP matrix combines 2 local analog inputs + 4 Dante receive channels, outputs to 4 Dante send channels + 2 local analog outputs. Per-input DSP: compressor, 4-band parametric EQ, high/low-pass filters, delay, auto-level, ducking, ambient noise compensation. Per-output: 10-band EQ + limiter. Up to 50 scene presets. External control via Euroblock headers for LED/switch and variable resistor (e.g., volume pot). Dual Dante RJ-45 for daisy-chaining. Controlled via DCP CONNECT or EZ CONNECT.
specs: |-
  - - Analog inputs: 2× Euroblock 3.81mm pitch, balanced mic/line; range -74 to +26 dBu; impedance ≥2kΩ; +48V phantom; EIN -125 dBu
  - Analog outputs: 2× Euroblock 3.81mm pitch, balanced line; nominal +4 dBu; max +15 to +24 dBu (switchable); impedance ≤200Ω
  - Dante: 2× RJ-45 Gigabit Ethernet (1000BASE-T, Cat5e STP+); 4-in/4-out channels
  - Sample rates: 44.1/48/88.2/96kHz; bit depth: 16/24-bit
  - Freq response: ±0.5dB, 20Hz–20kHz (44.1/48kHz); 20Hz–40kHz (88.2/96kHz)
  - THD+N: 0.005%; S/N: 105dB; crosstalk: 100dB; dynamic range: 105dB; mic EIN: -125 dBu
  - Power: PoE Class 0 (primary) or optional PS-P1220E DC adapter; consumption: 6W
  - Dimensions: 214(W) x 44.45(H) x 136.1(D) mm; weight: 878g
  - Operating temperature: 0–40°C
