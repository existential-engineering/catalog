details: |-
  The legendary STEREO CHORUS FLANGER was the first TC Electronic product. Ever! Our founder, who is also a musician, was annoyed with the quality of effect pedals available back in the 70s – they were just so noisy. So, being an engineer, he set out to design a pedal that would live up to his expectations and high standards. That was how the SCF was born all the way back in 1976, and the rest is history as they say. But hey! No one said the story was over. On the contrary, we’re adding to that history. In fact, it has come full circle and we’re really entering a new era of the SCF tales. Please meet SCF GOLD – a legendary pedal to be!

  Once the original SCF was launched and tons of guitarists had embraced it and included it in their rigs, the nickname for this marvelous modulation gem soon became "The Sound of Silence" due to its complete lack of… noise! Well, we’re pleased to say that the reissued SCF GOLD version also remains absolutely true to its predecessor in terms of off-the-charts signal to noise ratio – unwanted noise is simply not an issue!

  Chorus. Flanger. Pitch Modulation. Three modes that deliver the magic swirls, wobbling wonders and pure shimmering awesomeness of the SCF that we know and love, staying true – and paying tribute – to the original. The very unit that has taken countless guitarists by surprise and blown away everything they thought they knew about modulation effects in a strum of a chord!

  We bumped up the analog preamp, which is the first stage your signal meets, to level gold! You now get even more headroom, as well as improved low frequency response. And one of the most noticeable benefits you will experience right out of the box is a huge dynamic range that makes your tone excel regardless of whether you're softly fingerpicking or slamming a funky riff out at maximum loudness altitude!

  One aspect of the original SCF that we felt we could improve on was how you power it. The original came with a hardwired power cable, and you’d need to consider that in your pedal board design. SCF GOLD comes with a standard 9 V DC power socket ready for easy integration on modern pedal boards.
