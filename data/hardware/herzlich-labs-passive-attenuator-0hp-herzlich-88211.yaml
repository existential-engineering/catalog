url: https://www.herzlichlabs.com/products/passive-attenuator-0hp-herzlich-88211
description: A passive linear attenuation utility for CV and audio signals in a
  hybrid 1U/0hp format, used to control the intensity of LFOs, envelopes or
  audio.
details: |-
  Flatline... and back! There are a few essential utilities in synthesis, and perhaps the single most important one is attenuation. Having control over the amplitude or intensity of signals is an immeasurably valuable function in any system, from controlling the modulation depth from an LFO to softening the hit of an envelope, even down to controlling particular audio levels in a mix, the passive attenuator is a device that no system should ever go without. Operation is simple: plug your signal in, set the desired attenuation level and leave it alone. Create subtle movement, submixes and interesting dynamics easily and comfortably with this new version of the module the company was founded on, the Flatliner. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 5hp 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Accepts both CV and audio signals
  - Control the intensity of LFOs, envelopes or even audio
  - Passive design: no external power, no batteries
