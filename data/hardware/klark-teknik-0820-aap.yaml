description: The DN7204 is a dual digital audio delay line and equaliser that
  brought two channels of precision digital delay and equalisation to the
  loudspeaker management problem before integrated DSP platforms existed. It
  aligned distributed loudspeaker arrays, including fills, delays and balcony
  zones, with sample-accurate timing from a single 1U package.
details: |-
  The DN7204 brought two channels of precision digital delay and equalisation to the loudspeaker management problem long before integrated DSP platforms existed. Engineered for the touring sound and fixed-installation worlds, it aligned distributed loudspeaker arrays, fills, delays and balcony zones, with the kind of sample-accurate timing that keeps a sound system coherent rather than smeared.

  Each channel offered independent delay setting alongside parametric equalisation, so a system engineer could address arrival-time alignment and frequency-response correction from a single 1U package. The signal-path philosophy of minimal artefacts, transparent processing and high-grade conversion meant the unit sat in the chain without imposing a sonic signature of its own.

  The DN7204 is now obsolete, but it remains a reference for engineers who learned system tuning before software took over the discipline. Service documentation and legacy support remain available through Music Tribe Care.
specs: |-
  - Two channels of digital delay with independent delay setting per channel
  - Parametric equalisation per channel
  - 1U rackmount
  - Intended for distributed loudspeaker time alignment in touring and installed systems
