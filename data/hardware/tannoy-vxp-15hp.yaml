name: VXP 15HP
manufacturer: tannoy
primaryCategory: speaker
categories:
  - amplifier
url: https://www.tannoy.com/en/products/0312-aos
description: 1,600 Watt 15" PowerDual Powered Sound Reinforcement Loudspeaker
  with Integrated Lab Gruppen IDEEA Class-D Amplification.
details: |-
  1,600 Watt 15" PowerDual Powered Sound Reinforcement Loudspeaker with Integrated Lab Gruppen IDEEA Class-D Amplification. Full-range multi-purpose powered sound reinforcement loudspeaker for portable and installation applications. Features constant-directivity PowerDual driver technology with 75° conical dispersion, optimized for FOH, floor monitoring, delay systems, stage fill, and portable PA deployments.
specs: |-
  - frequencyResponseFullRange: 60 Hz - 25 kHz ±3 dB / 47 Hz - 30 kHz -10 dB
  - frequencyResponseHiPass: 100 Hz - 25 kHz ±3 dB / 80 Hz - 30 kHz -10 dB
  - nominalDispersion: 75° conical @ -6 dB point
  - directivityFactorQ: 9.7
  - directivityIndexDI: 9.9
  - dynamicRange: 106 dB
  - maximumSPL: 131 dB peak
  - crossoverType: Passive 1.3 kHz
  - transducers: 380 mm (1 x 15") constant directivity PowerDual™
  - maximumOutputPower: 1600 W
  - amplifierType: Class-D (Lab Gruppen IDEEA)
  - protection: Output current limiter, clip limiter, brownout protection and recovery, thermal
  - inputImpedance: 10 kΩ unbalanced, 20 kΩ balanced
  - maximumInputLevelForClip: +4.5 dBu (hard clip at +14.5 dBu input signal)
  - mainsSupply: Industry-standard twist-lock power 20A
  - levelControl: Recessed potentiometer
  - filter: Hi-pass (HPF) / full range (FR), switchable
  - powerMode: Manual (MAN) / auto (AUTO), switchable
  - powerSupplyType: Switch-mode auto-ranging power supply
  - mainsVoltage: 100-240 V~, 50/60 Hz
  - powerConsumption: 150 W @ 1/8 max power
  - dimensionsHxWxD: 591 x 451 x 421 mm (23.3 x 17.8 x 16.6")
  - netWeight: 27.3 kg (60.1 lbs)
  - construction: 18 mm (3/4") plywood, vented and internally braced
  - finish: Semi matt black paint (white optional)
  - grille: Powder coated perforated steel
  - flyingHardware: 8 x M10 corner flying inserts, 8 x M10 yoke bracket inserts, 1 x Integri-grip carrying handles, blanking plate for optional VTH pole mount
