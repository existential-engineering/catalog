url: https://www.tchelicon.com/en/products/0726-abl
description: Single-button vocal harmony stompbox that generates two diatonic
  harmony voices in a key set on the pedal, voiced as high, low, or high plus
  low. Adaptive Tone treats the lead vocal alongside the harmonies.
details: |-
  The VoiceTone H1 adds two-part vocal harmony to a live vocal. The key of the song is set on the pedal, and the footswitch engages two generated voices above or below the lead that follow the diatonic scale that was set.

  Three harmony voicings are selectable from the front panel: high, low, and high plus low. Adaptive Tone processing runs in parallel, treating the lead vocal with EQ, compression and de-essing so the dry voice stays present while the harmony voices sound behind it.

  Connections are an XLR input and an XLR output, with 48V phantom power for condenser microphones and true bypass. The pedal runs from a standard 9V supply and is the entry point into TC-Helicon's harmony processing, with no menu system to navigate.
specs: |-
  - Two generated harmony voices following the set diatonic scale
  - Three harmony voicings: high, low, high plus low
  - Key and scale set from the front panel
  - Adaptive Tone processing with EQ, compression and de-essing on the lead vocal
  - 48V phantom power for condenser microphones
  - True bypass
  - Powered by a standard 9V DC supply
