description: >-
  The Vermona M.A.R.S. (Monophonic Analog Rack Synthesizer) is a compact 1U rack
  analog monosynth with dual oscillators, a resonant 4-pole lowpass filter, and
  128 programmable patches. An optional 2U control module with 56 knobs provides
  deeper hands-on editing.
details: |-
  Released in 2006, the Vermona M.A.R.S. takes the classic monophonic analog synthesizer architecture and squeezes it into a remarkably compact single rack unit measuring just 2.5 inches deep. Despite its diminutive size, it packs a complete synthesis signal path with two oscillators, a 24 dB per octave lowpass filter, and dual ADSR envelopes.

  The front panel keeps things minimal with four main knobs for program selection, parameter editing, brilliance, and volume, along with a two-line LCD display and section LEDs. This simplicity is by design, as Vermona recognized that deep editing on such a small panel would be impractical. For users who want full hands-on control, an optional 2U rackmount module provides 56 dedicated knobs.

  The oscillators offer sawtooth, square, and sub-oscillator waveforms, while two LFOs with sine, square, triangle, and sample-and-hold shapes provide modulation. The 128 onboard patches give users plenty of storage for custom sounds, and MIDI In/Out/Thru connectivity ensures easy integration into any modern studio setup.
specs: |-
  - Polyphony: Monophonic (1 voice)
  - Multitimbral: 1 part
  - Oscillators: 2 VCOs with saw, square, and sub oscillator waveforms
  - Filter: 24 dB/oct (4-pole) resonant lowpass
  - LFO: 2 LFOs with sample & hold, sine, square, triangle
  - Envelopes: 2 ADSR
  - Memory: 128 patches
  - Control: MIDI In/Out/Thru
  - Dimensions: 1U rack height, 2.5 inches deep
releaseDate: "2006"
