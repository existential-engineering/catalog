details: |-
  Introduced in 1998, the LynxONE was the first product offered by Lynx Studio Technology. Offering high quality analog and digital I/O, a stable word clock and MIDI connectivity, LynxONE was ahead of its time for reliability, audio quality and software control. Now more than 20 years later, LynxONE is still in thousands or radio stations, studios, and production facilities worldwide. It has even found its way into medical, audio testing and military applications.

  LynxONE provides basic analog and digital audio with on board AD and DA conversion. The analog side features 24-bit technology and sample rates up to 50kHz. The digital side goes up to 96kHz and can use either the AES/EBU or SPDIF digital format. LynxONE also offers two MIDI ports.
specs: |-
  - Stereo 24-bit analog input and outputs with +4dBu or -10dBV levels
  - Digital I/O supporting AES/EBU and S/P DIF formats at sample rates up to 96kHz
  - Analog side supports sample rates up to 50kHz
  - Independent, 24-bit audio stream architecture supports simultaneous four-channel recording and playback
  - Two smart, deeply buffered MIDI ports
  - Low-jitter, highly adjustable sample clock tunable to all rates 8kHz to 100kHz
  - Mixer application provides software-controlled configuration
  - On board AD and DA conversion
  - Half-size PCI card, powered from the host computer's PCI slot (+5 V at 400 mA, +12 V at 220 mA, -12 V at 95 mA), no separate power connector
  - Audio port: bracket-mounted 25-pin D-sub carrying L/R analog in, L/R analog out and digital in/out, broken out to XLR by the included cable
  - MIDI/Clock port: bracket-mounted 15-pin high-density D-sub carrying both MIDI ports and word clock in/out, broken out to four 5-pin DIN and two BNC by the included cable
releaseDate: "1998"
