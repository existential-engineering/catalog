description: Single-Channel Auteur Mic/Line preamp in 500-series format
details: "The Auteur mkII 500 is a single-channel mic/line preamp in 500-series
  format, bringing the beloved attack and tone of the classic Auteur preamps to
  a 500-series rack with the addition of a Hi-Z instrument input for bass and
  guitar. An ultra-fast input stage captures detail and nuance, and a signal
  path output transformer adds heft on the output stage. At lower gain settings
  it behaves as a fast, transparent American-style design; cranking the gain
  yields warmth and color of classic British-style preamps — Black Lion Audio's
  'Chicago-style' sound. Gain range: 16dB to 67dB. Features +48V phantom power,
  phase inversion, and -13dB pad."
specs: |-
  - Format: 500-series
  - Gain range: 16 to 67 dB
  - Phantom Power: Yes (+48V)
  - Pad: -13 dB
  - Max mic input level: +1 dBu
  - Input impedance: 6,000Ω
  - Noise floor: -108 dBu (EIN)
  - THD+N: 0.0046% @ +12dBu gain, +4 dBu output
  - Frequency response: 10Hz-30kHz
  - Max DI input level: +18 dBu
  - DI input impedance: 2.2MΩ balanced / 1.1MΩ unbalanced
  - Max output level: +28 dBu
  - Output impedance: 600Ω
  - Power: ±15V from 500-series rack
  - Dimensions: 1.5" W x 6.5" H x 5.25" D
  - Weight: 0.8 lbs.
