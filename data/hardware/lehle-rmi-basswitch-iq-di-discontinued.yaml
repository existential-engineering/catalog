details: |-
  The concept for this "swiss army knife for bassplayers" comes from Jacques Ruppert, head of RMI, while the technical part was realized here at LEHLE. As a central controller for bass setups it combines two switchable inputs, a studiograde preamp, a 4-band EQ, two effects loops and a studiograde DI box in one housing.

  The input A/B switch carries impedance matching for piezo pickups, so the unit is equally suitable for magnetic and piezo pick-ups, and Channel A features a cut and boost level control for volume adjustment between the two inputs. That makes it possible to switch between two completely different instruments without re-plugging.

  The switchable effects loop has a blend/mix control, which lets you adjust the effects ratio added to the original sound from 0% dry to 100% wet, and it can also be used as a volume boost. A second, non switchable serial effects loop sits alongside it.

  The studiograde DI box carries pad, pre/post and groundlift switches and the LEHLE LTMZ transformer for galvanic isolation. An additional output for a tuner and a mute switch complete the routing section, and the preamp can boost the signal by up to +15 dB, enough to drive a power amp directly.

  The BASSWITCH IQ DI accepts all power supplies providing not less than 9 V, not more than 20 V and at least 130 mA. Either alternating (AC) or direct current (DC) sources can be used and the polarity is not relevant. The design is extremely robust with protected controls.
specs: |-
  - LEHLE True Sound Technology
  - Input A/B switch with impedance matching for piezo pickups
  - Studiograde preamp with up to +15 dB of boost, able to drive a power amp directly
  - 4-band EQ with double semiparametric mids
  - Switchable effects loop with blend/mix control, adjustable from 0% dry to 100% wet
  - Switchable effects loop can also be used as a volume boost
  - Serial effects loop (non switchable)
  - Studiograde DI box with pad, pre/post and groundlift switches
  - LEHLE LTMZ transformer for galvanic isolation
  - Additional output for tuner
  - Mute switch
  - Runs on any power supply from 9 to 20 V AC or DC, at least 130 mA, polarity irrelevant
  - Extremely robust design with protected controls
  - Manufactured by LEHLE in Germany on behalf of RMI
