description: Analog knob-per-function drum machine.
details: |-
  KONSTRUKT-8 is an expressive live performance instrument and sound design tool built from eight eurorack modules. This is the fully assembled version, ready to play out of the box, and a self-build edition is sold separately as the KONSTRUKT-8 EDU DIY drum system.

  There are no menus, no presets and no shared controls that need reassigning between voices. KONSTRUKT-8 prioritizes immediate rhythm creation, hands-on sound shaping, direct modulation and patch-based experimentation instead, so every parameter has its own front-panel control and every voice has its own sequencer channel.

  Four fully analog drum voices are included. The kick drum uses a resonant bridged-T network for deep, punchy kicks. The snare drum layers a burst of filtered transistor noise over a tuned resonator for crisp snares. The hi-hat mixes six dissonant square-wave oscillators, then filters and overdrives them into metallic hats. The FM drum sets two interacting oscillators against each other for a versatile percussion voice that reaches kicks, toms, bells and cymbal-like sounds, and even simple bass lines and leads.

  A four-channel drum sequencer lets rhythms be tapped in in real time, storing the pattern as a circular sequence of binary data in shift registers. Two syncable triangle LFOs are on hand for voice modulation. All voices feed a four-channel mixer with per-channel FX sends and a master insert, so the whole beat and individual voices can both be shaped with effects, and a variable master diode distortion sits at the output.

  Two effect modules complete the system: an analog bucket-brigade delay with flanger and delay modes, and a diode-based compressor with sidechain capability. The package holds the eight eurorack modules, which are fully compatible with other eurorack systems, a eurorack enclosure with integrated power supply made specifically to house them, and fifteen braided patch cables in lengths of 20cm, 30cm and 60cm. The device measures 26.5 x 27.5 x 6 cm.
specs: |-
  - 8 Eurorack modules, fully compatible with other Eurorack systems
  - Eurorack enclosure with integrated power supply
  - Four fully analog drum voices: kick, snare, hi-hat, FM drum
  - Shift register-based performance sequencer, four channels
  - Two syncable triangle LFOs for voice modulation
  - Four-channel mixer with per-channel FX send/return
  - Variable master diode distortion plus master insert point
  - Analog BBD with flanger and delay modes
  - Diode-based compressor with sidechain capability
  - Headphone and line outputs
  - 15 braided patch cables (5x 20cm, 5x 30cm, 5x 60cm)
  - Device dimensions: 26.5 x 27.5 x 6 cm
