description: Designed and developed in partnership with Pittsburgh Modular
  Synthesizers, East Beast is a powerful analog, monophonic full voice
  synthesizer with many unique sound-shaping tools and deep performance
  capabilities.
details: |-
  East Beast's oscillator, designed in partnership with Pittsburgh Modular Synthesizers, is part of their 5th generation of analog oscillators stemming from 10 years of continued analog oscillator development. Its circuitry is not a clone or based on any outside designs, is made with 100% modern components, and stays stable while giving it a rich, unique sound.

  To further sculpt sounds, East Beast includes an envelope generator and LFO. The custom envelope circuit creates a snappy, percussive attack for expressive performance, while the dual-range LFO opens up a wide range of LFO and audio-rate modulation possibilities.

  East Beast has 9 different patchable modules (oscillator, filter, envelope, VCA, LFO, multi-mod tool, sequencer, MIDI to CV converter, and button keyboard) with 18 Eurorack compatible patch points to plug into itself and other gear, allowing components to be used as separate modules or the internal patching to be rerouted entirely.

  East Beast has MIDI in and MIDI thru so multiple MIDI devices can be chained together, or a MIDI controller can be plugged in for playing and sequencing.

  East Beast includes a built-in tap tempo clock, arpeggiator, and 32-step sequencer with generative sequencing mode, with opportunities to inject randomness into the patch. It can be used standalone in its included case or removed and used as a Eurorack format module.
specs: |-
  - East coast style subtractive monophonic synthesizer
  - Controllable via MIDI, CV, and integrated button keyboard
  - Fully patchable - 9 individual modules (Oscillator, filter, envelope, VCA, LFO, multi-mod tool, sequencer, MIDI to CV converter, and button keyboard)
  - 32 step sequencer with up to 13 presets
  - Generative sequencing mode
  - Clock-synced arpeggiator
  - Step sequencer can be manipulated and transposed via MIDI and the integrated button keyboard
  - Pittsburgh Modular Synthesizer developed 100% analog oscillator
  - Oscillator waveforms: sine, triangle, saw, square, and pitched noise (combinable)
  - Oscillator includes pulse-width modulation (PWM) and frequency modulation (FM)
  - Variable state, multi-mode PGH "No-Dead-Spots" filter (lowpass, bandpass, highpass, modes can be combined)
  - Analog envelope generator
  - Integrated VCA
  - Dual-range analog LFO with triangle wave output
  - Digital multi-mod tool - modulation control via CV, random generator, and extra LFO and envelope generator
  - Internal clock with tap tempo, can be clocked via external source
  - Built-in clock divider
  - Can be used standalone in its included case or removed and used as a Eurorack format module
  - Eurorack width when used as a module: 40hp
  - Eurorack depth when used as a module: 25mm
  - Power consumption: 213mA (+12V rail), 151mA (-12V rail)
  - Oscillator input voltage range: 0-10V
  - Included in box: 1x East Beast, wall-wart power supply, 5x Nazca Noodles patch cables, 1x 3.5mm to 5-pin (Type A) MIDI DIN pigtail
