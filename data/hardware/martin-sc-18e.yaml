details: |-
  Modern playability and classic looks—the SC-18E pairs technology with timeless style and tone, combining SC innovation and Standard Series appointments. Its patented features include a Sure Align® neck system that helps you play all the way up the neck, while the low-profile velocity satin neck barrel fits comfortably in your hand, and an internal soundboard recurve for added bass response.

  This gloss guitar features a spruce top with mahogany back and sides, giving you plenty of volume, bright treble, and punchy midrange for that classic Martin sound. It also features an ebony fingerboard and bridge, nickel open gear tuners, Fishman Aura VT Blend or LR Baggs Anthem electronics, and is strung with LUXE BY MARTIN® Kovar™ strings.

  The SC-18E comes with a molded hardshell case.
specs: |-
  - Body Size: S-13 Fret Cutaway
  - Construction: Sure Align® Linear Dovetail Neck Joint
  - Top: Spruce with Gloss finish in Aging Toner
  - Back & Sides: Mahogany with Gloss Dark Mahogany finish
  - Bracing Pattern: Tone Tension X-Brace, Treble Side Scalloped X with Scalloped Tone Bars
  - Brace Material: Spruce (5/16" with 1/4" Tone Bars)
  - Binding: Black
  - Rosette: Multi-Stripe
  - Pickguard: Tortoise Pattern
  - Neck Shape: Low Profile Velocity
  - Neck Taper: High-Performance Taper
  - Neck Material: Select Hardwood, Satin finish
  - Scale Length: 25.4"
  - Number of Frets: 20 total, joins body at 13th fret
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Old Style 18, Abalone
  - Headstock: Solid with Square Taper
  - Headplate: East Indian Rosewood with Script Old Style Overlay logo
  - Tuning Machines: Nickel Open Gear with Butterbean knobs
  - Nut: Bone
  - Bridge: Ebony, Sloped Modern Belly - Drop in Saddle
  - Bridge String Spacing: 2 5/32"
  - Saddle: Compensated Bone, 16" radius
  - Bridge Pins: Black Plastic
  - Electronics: Fishman Aura VT Blend
  - Plek: Yes
  - Recommended Strings: Authentic Acoustic Lifespan® 2.0 Light
  - Case: Molded Hardshell
  - Warranty: Limited Lifetime Warranty
