description: >
  The synth that kick-started the affordable analog revolution is reborn as an
  addictive, inspiring step-sequencing synth with huge modular capabilities.
details: |-
  Minibrute 2s stays true to the raw sound-shaping power of the iconic original, while adding thrilling new features and possibilities. Combining the best elements of an analog synthesizer with an intuitive step-sequencer and exciting semi-modular architecture, minibrute 2s was made to inspire. Its parameters are clearly laid out and create sound thats packed with personality and attitude.

  Its multi-pattern, triple-layer, 64-step sequencer offers exciting new ways of creating music, but takes the pain out of pattern programming. A serious standalone synth, minibrute 2s can also be augmented by using its expanded patchbay, and become the center of your modular system.

  Minibrute 2s unites the experimental nature of modular gear with the expressive, vital sound of a contemporary analog synth to create a truly awe-inspiring hybrid. Featuring a comprehensive modulation matrix with dozens of sources and destinations at your disposal, you can start rewiring its signal paths to conjure up truly exciting sounds that have never been heard before.

  Minibrute 2s introduces a new way to play, and fresh sequencing possibilities that are guaranteed to fuel your creativity. By replacing the traditional keyboard interface of the minibrute 2s, arturias designers were able to incorporate a powerful, intuitive sequencer section into the synth. Featuring up to 64 steps, 3 layers of depth, and fast, simple, effective sequence generation, minibrute 2s gives you synth-sequencing control like no other.

  Minibrute 2s has been designed to connect with the unique arturia rackbrute system, putting your whole modular synth world at your fingertips. Create a customizable, portable eurorack ecosystem to house and power your modular equipment. Designed to be the creative hub of your modular world, you can sequence your modules from this next-gen minibrute, and use its unique design to work in different configurations.
specs: |-
  - 2 analog vcos
  - Vco1: sawtooth, pulse, triangle waves with ultra saw and metalizer modifiers
  - Vco1 linear and exponential fm
  - Vco 2>1 hard sync
  - Vco2: sine, saw, square waveforms with three tuning ranges
  - Steiner-parker filter with low pass, high pass, band pass, and notch modes
  - Filter resonance with self-oscillation capability
  - Adsr type envelope generator
  - Ad envelope modulator with ad, ahr, or loopable modes
  - Attack and decay times CV-controllable
  - Brute factor drive and intermodulation effects
  - White noise generator
  - Waveform mixing for oscillators 1 and 2, noise generator, and external inputs
  - 2 lfos with 6 waveforms each
  - Lfo sync to sequencer
  - 48 CV inputs and outputs
  - Utility modules: inverter, attenuators, vca
  - Multi-pattern, triple-layer, 64-step sequencer
  - 64 pattern memories organized in four banks
  - Sequencer controls: pitch, gate, velocity, and pressure
  - Real-time and step editing modes
  - 16 pressure and velocity sensitive pads
  - Arpeggiator with multiple modes
  - Pattern chaining for longer sequences
  - Tap tempo
  - Metronome
  - MIDI connectivity
  - USB connectivity
  - Analog clock synchronization
  - External MIDI sync
  - Line and headphones outputs
  - Eurorack compatibility
  - Semi-modular architecture
  - Expandable patchbay
