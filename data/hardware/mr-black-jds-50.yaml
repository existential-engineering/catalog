description: A highly dynamic, amp-like overdrive spanning touch-responsive
  crunch to thick, harmonic-laden drive and near-full distortion, with optional
  18V operation for extra headroom. Production discontinued.
details: |-
  The JDS-50 is an overdrive built for dynamic response and feel. Behind its unassuming looks is a carefully balanced frequency spread and a wide dynamic range that Mr. Black describes as an expressive instrument in its own right, not just a set-and-forget drive.

  It covers a broad tonal span, from meticulously tuned, touch-responsive crunch to thick, harmonic-laden overdrive and even near-full distortion. Throughout that range it responds and feels like a high-quality tube amplifier while retaining the signature tonal character of the guitar or bass plugged into it.

  2019 and later models add optional 18V operation: run at the standard 9V, or feed it 18V from an external supply for increased headroom, clarity and dynamic response.

  This pedal is no longer produced. The listing carries a "PRODUCTION DISCONTINUED" banner (sold out 01.31.2026), so it is catalogued for completeness rather than as a current product.
specs: |-
  - Dynamic, amp-like overdrive (crunch to near-full distortion)
  - Touch-responsive, retains the instrument's signature tone
  - Balanced frequency spread
  - Optional 18V operation on 2019+ models (9V standard) for extra headroom
  - PRODUCTION DISCONTINUED (sold out 01.31.2026)
