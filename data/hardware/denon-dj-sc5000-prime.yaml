description: The SC5000 PRIME represents a real paradigm shift in DJ Technology
  with a 7”, HD touchscreen, on-board file analysis, dual-layer deck capability
  and more.
details: |-
  Powered by the industry-leading, ever-evolving Engine OS

  7-inch HD touchscreen with intuitive and familiar workflows

  Dual-layer playback with individual analog/digital outputs to mix two tracks from a single player

  Built-in Wi-Fi and wired internet connectivity for music streaming

  Direct connection to Beatport LINK, Beatsource LINK, SoundCloud GO+, and TIDAL streaming services

  Sync and play music from the cloud with onboard Dropbox integration

  Supports both lossy and lossless audio formats

  Internal onboard analysis of music files (world’s first DJ media player with on-board analysis)

  8 multifunction performance pads for Hot Cues, Loops, Slices, and Rolls

  8" RGB illuminated capacitive jog wheel with HD central display for album artwork, performance information, and custom logo

  Best-in-class time stretch and musical key change/sync

  Create & edit playlists on-the-fly with on-board collection management

  Preview tracks from the library before loading

  (3) USB and (1) SD media inputs for music playback

  LAN output to link up to four players together

  Plug and play compatible with Rekordbox® prepared USB/SD media devices

  Sync audio with video, lighting, and FX through Resolume, SoundSwitch, and Timecode software

  Compatible with Serato DJ and Virtual DJ via controller mode

  Winner of ‘Ultimate Club Deck’ and ‘Innovative New Product’ in the DJ Mag Tech Awards
specs: |-
  - Analog Output: 2.0 Vrms (0 dBFS, 1 kHz)
  - Dynamic Range: 116 dB
  - Distortion (THD+N): < 0.0015%
  - Frequency Range: 22–22,000 Hz
  - Digital Output Sampling Rate: 96 kHz
  - Digital Output Bit Depth: 24-bit
  - Jog Wheel (Platter): 8.0" / 203 mm diameter, metal construction with display & touch-capacitive circuitry
  - Main Display: 7.0" / 178 mm diagonal (6.0" x 3.6" / 152 x 91 mm), full-color LED-backlit touchscreen
  - Platter Display: 2.2" / 56 mm diameter, full-color LED-backlit display
  - Performance Pads: 8 multifunction RGB pads (Hot Cues, Loops, Slices, Rolls)
  - Supported Media: SD/SDHC card, USB mass-storage devices
  - File Systems: exFAT, FAT32 (recommended)
  - File Formats: AAC/M4A, AIF/AIFF (44.1–192 kHz, 16–32-bit), ALAC (44.1–192 kHz, 16–32-bit), FLAC (44.1–192 kHz, 16–24-bit), MP3 (32–320 kbps, VBR), MP4, Ogg Vorbis, WAV (44.1–192 kHz, 16–32-bit)
  - Power Connection: IEC
  - Input Voltage: 110–240 VAC, 50/60 Hz
  - Power Consumption: 75 W
  - Dimensions (in): 12.6" x 16.5" x 5.3" (W x D x H)
  - Dimensions (mm): 320 x 419 x 135 (W x D x H)
  - Weight: 8.79 lbs / 4 kg (without USB and power cable)
