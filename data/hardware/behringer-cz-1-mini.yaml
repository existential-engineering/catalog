description: The CZ-1 MINI is a portable 3-voice hybrid synthesizer that
  reproduces the phase distortion engine of the Casio CZ-1, with 8 classic
  waveforms running into an analog 24 dB low-pass filter. It packs 27
  touch-sensitive keys, a 16-step sequencer, a 3-pattern arpeggiator and a
  chorus effect into a unit powered over USB Type C.
details: |-
  The CZ-1 MINI is a hybrid synthesizer that fits in a backpack but sounds like it belongs in a studio. With 3 voices, 27 touch-sensitive keys and a USB-C connection for power on the go, it is built for musicians who want big sound in a small package, at home or on stage.

  Control is hands-on rather than menu-driven. A crisp OLED display, dedicated filter and modulation controls and an intuitive layout make tweaking parameters straightforward, with the parameters that shape the tone laid out on the panel.

  From 8 classic waveforms and analog-style filtering to a 16-step sequencer and 3-pattern arpeggiator, the CZ-1 MINI is packed with features that keep creativity flowing. The studio-grade chorus adds depth, and the engine covers textures that range from warm pads to edgy leads.

  Connectivity is built for mixed rigs. Full MIDI control, a Sync Input and SysEx compatibility let it sit in modern or vintage setups, whether it is driving a DAW or syncing with external gear.
specs: |-
  - Phase distortion synthesis engine featuring 8 classic waveforms
  - Authentic reproduction of the CZ-1 sound engine
  - Supports original Casio CZ series SysEx for compatibility with the vintage instruments
  - 3-voice polyphony
  - 27 touch-sensitive keys
  - Analog 24 dB low-pass filter
  - Dedicated filter envelope and LFO
  - 16-step sequencer
  - Arpeggiator with 3 patterns
  - Studio-grade chorus effect
  - High-resolution OLED display for parameter editing
  - Sync input for synchronizing with other synthesizers or drum machines
  - Comprehensive MIDI implementation, including NRPN/CC control of all parameters and bulk load and save
  - Powered over USB Type C from a smartphone, power bank or computer, with no separate power inlet
