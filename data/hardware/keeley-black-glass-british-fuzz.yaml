description: Hand-built MkIII-style germanium fuzz using NOS Mullard black glass
  transistors, built in small limited batches.
details: |-
  The Black Glass British Fuzz is a hand-built, compact take on the classic Mullard germanium transistor fuzz, announced in September 2014 in a run limited to 30 units and built again in November 2016 in a small batch of seven each with rare NOS Mullard OC75 and vintage 1960s Dutch-made OC44 germanium transistors, under a black and red graphic. It is aimed at players who want a MkIII voice, described as smooth, articulate and dynamic.

  It offers MkIII tone-bending sounds with reduced noise and treble response and a modern power supply arrangement. Controls for Fuzz, Tone and Level make wide amounts of fuzz easy to set. Circuit modifications raise the available high-frequency response and lower the noise floor, and further changes address the temperature sensitivity that affects vintage germanium fuzz units. A power supply inversion is built in, so the pedal runs from a regular 9 volt supply.

  Keeley's stated aim was a MkIII-style circuit, originally around a stock of black glass OC81D transistors, that combined compact size, repeatable tone and low noise, since PNP germanium pedals are often expensive, bulky and inconsistent. Techniques from the Time Machine Boost and Holy Fuzz designs were used, along with measures to minimise germanium temperature coefficient problems.

  The pedal is hand built in the USA, housed in a powder-coated enclosure, and uses true bypass switching. It carries a two-year limited warranty.
