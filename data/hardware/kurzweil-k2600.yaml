description: >-
  The Kurzweil K2600 is a professional synthesizer/sampler workstation built on the
  V.A.S.T. synthesis engine, offering 48-voice polyphony, 12 MB of sample ROM expandable
  to 44 MB, and K.D.F.X. multi-effects processing. Released in 1999 as the final evolution
  of the K2000 series, it was available in 76-key and 88-key configurations with optional
  sampling capability up to 128 MB of RAM. The K2600 was used by artists including BT,
  Peter Gabriel, and Pink Floyd.
details: |-
  Released in 1999, the K2600 refined the acclaimed K2500 platform with increased sample ROM and a refreshed aesthetic. Standard ROM grew from 8 MB to 12 MB, expandable to 44 MB through optional sound ROM boards, giving the K2600 an even broader factory sound palette out of the box. The K2600 retained the full V.A.S.T. synthesis architecture with its 60 DSP functions for deep sound design.

  The keyboard lineup included the K2600 with 76 semi-weighted keys and the K2600X with 88 fully weighted piano-action keys, both featuring velocity and aftertouch sensitivity. Eight real-time sliders and a ribbon controller provided extensive hands-on control. The S and XS models added sampling capability with 64 MB of RAM standard, expandable to 128 MB, with support for ADAT, TDIF, and AES/EBU digital interfaces.

  The K.D.F.X. multi-effects system and the real-time Live Mode allowed V.A.S.T. and K.D.F.X. processing of external audio signals, effectively turning the K2600 into a powerful effects processor. The DMTi digital multitrack interface enabled direct connection with professional recording hardware. The 32-track sequencer carried forward all the capabilities of the K2500, supporting pattern, linear, and step recording with advanced groove quantizing and event list editing.

  Virtually identical to the K2500 in architecture, the K2600 distinguished itself through the expanded ROM, a sportier purple and black color scheme, and continued firmware refinements. It was used by BT, Peter Gabriel, and Pink Floyd, cementing its place as one of the most capable workstations of its generation.
specs: |-
  - Polyphony: 48 voices
  - Oscillators: V.A.S.T. synthesis engine with 60 DSP functions
  - Sample ROM: 12 MB (expandable to 44 MB via optional sound ROM boards)
  - Sampler RAM: 64 MB standard, expandable to 128 MB (S/XS/RS models)
  - Presets: 238 ROM programs, 200 user RAM patches (438 total)
  - Sequencer: 32-track, 16 songs, 16 arrangement tracks; pattern, linear, and step recording
  - Effects: K.D.F.X. reverbs and multi-effects with digital I/O
  - Keyboard: 76 semi-weighted keys (K2600) or 88 fully weighted keys (K2600X)
  - Velocity and channel aftertouch sensitive
  - Controls: 8 real-time sliders, ribbon controller, pitch and mod wheels
  - Audio Outputs: Stereo main, 8 individual outputs
  - Digital I/O: ADAT, TDIF, AES/EBU support
  - Storage: Dual 25-pin SCSI ports
  - MIDI: Full MIDI controllability, 16 parts
  - Digital Output: 20-bit
