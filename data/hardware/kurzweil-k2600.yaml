description: >-
  The Kurzweil K2600 is the final evolution of the K2000 series, expanding the V.A.S.T. platform
  with 12 MB of standard ROM, K.D.F.X. effects, and up to 128 MB of sample RAM.
details: |-
  Released in 1999, the K2600 refined the acclaimed K2500 platform with increased sample ROM and a refreshed aesthetic. Standard ROM grew from 8 MB to 12 MB, expandable to 44 MB through optional boards, giving the K2600 an even broader factory sound palette out of the box. The K2600 retained the full V.A.S.T. synthesis architecture with its 60 DSP functions for deep sound design.

  The keyboard lineup included the K2600 with 76 semi-weighted keys and the K2600X with 88 fully weighted piano-action keys, both featuring velocity and aftertouch sensitivity. Eight real-time sliders and a ribbon controller provided extensive hands-on control. The S and XS models added sampling capability with 64 MB of RAM standard, expandable to 128 MB, with support for ADAT, TDIF, and AES/EBU digital interfaces.

  The K.D.F.X. multi-effects system and the real-time Live Mode allowed V.A.S.T. and K.D.F.X. processing of external audio signals, effectively turning the K2600 into a powerful effects processor. The DMTi digital multitrack interface enabled direct connection with professional recording hardware. The 32-track sequencer carried forward all the capabilities of the K2500.

  Virtually identical to the K2500 in architecture, the K2600 distinguished itself through the expanded ROM, a sportier purple and black color scheme, and continued firmware refinements. It was used by BT, Peter Gabriel, and Pink Floyd, cementing its place as one of the most capable workstations of its generation.
specs: |-
  - Polyphony: 48 voices
  - Oscillators: V.A.S.T. synthesis, 12 MB ROM (expandable to 44 MB)
  - Sampler: Optional, 64 MB RAM (expandable to 128 MB)
  - Sequencer: 32-track, 16 songs, 16 arrangement tracks
  - Effects: K.D.F.X. reverbs and multi-effects with digital I/O
  - Keyboard: 76 semi-weighted or 88 weighted keys with velocity and aftertouch
  - Memory: 238 ROM presets, 200 user RAM patches; dual SCSI ports
  - Control: MIDI (16 parts)
releaseDate: "1999"
