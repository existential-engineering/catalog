description: This DW Collector's Series ICON Snare was created to pay homage to legendary DW artist Jim Keltner.
details: |-
  This ICON snare drum honours drumming legend Jim Keltner, whose contributions to the drum community and the music industry at large are well documented.

  His passion for the form and stylistic integrity are captured in this ICON snare drum, which is crafted from 11 plies of North American Hard Rock Maple featuring VLT (Vertical Low Timbre) grain orientation.

  Finished with intricate laser-cut, exotic and dyed-wood inlays inspired by Jim's vintage Collector's Series kit, his signature aviator sunglasses and "Oooeeee" custom license plate, it's both a collectible and playable instrument.

  The 6.5x14″ drum is outfitted with Jim's favorite mini turret lugs in weathered-looking Antique Bronze and comes standard with matching True-Hoops and MAG throw-off system, True-Pitch Tuning, True-Tone snare wires, and DW Heads by Remo. Signed by John Good and numbered, only 250 were made.
specs: |-
  - North American Hard Rock Pure Maple
  - California Custom Shop 11-ply VLT shell
  - Mini turret lugs
  - Antique bronze-plated hardware
  - MAG throw-off system with 3P butt plate
  - Limited to 250 drums, signed by John Good and numbered
  - Size: 6.5x14
