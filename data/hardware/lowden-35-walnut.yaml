description: A Lowden 35 Series acoustic guitar with Walnut back and sides, one
  of George Lowden's pioneering tonewoods, shaped to enrich bass response.
details: |-
  Lowden Guitars distinguishes themselves through numerous innovations, chief among them George Lowden's early adoption of tonewoods once considered unconventional. His pioneering use of Walnut - meticulously shaping the guitar's geometry to enrich bass response - expanded the tonal possibilities of acoustic guitars.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Walnut back and sides can be paired with Red Cedar, Sitka Spruce, or a Walnut soundboard.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Walnut
  - Soundboard options: Red Cedar, Sitka Spruce, Walnut
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
