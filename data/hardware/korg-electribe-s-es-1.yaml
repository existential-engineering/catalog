description: >-
  Korg's sample-based addition to the ElecTribe series, combining a 12-part
  sampler with synth-style processing controls, 11 effects types, a loop-based
  step sequencer, and Smart Media card storage for up to 95 seconds of mono
  sampling.
details: |-
  The ElecTribe S (ES-1) expanded Korg's popular ElecTribe lineup into sampling territory when it launched in 2000. Rather than functioning as a conventional sample playback device, it was designed to aggressively process and transform recorded sounds using synthesizer-style controls for filtering, pitch manipulation, and effects, encouraging users to create entirely new textures from their source material.

  The sampling engine recorded at 32 kHz with capacity for up to 95 seconds of mono audio or 47.5 seconds in stereo, stored across 100 mono or 50 stereo sample slots. Eleven onboard effects including reverb, flanger/chorus, phaser, ring modulator, pitch shifter, compressor, distortion, decimator, isolator, resonant filter, and wah could be applied during sampling itself, with resampling capabilities allowing multiple effects to be layered progressively. A Time Slice function automatically detected and segmented loop components for rearrangement.

  The 64-step loop-based sequencer supported real-time and step-entry programming across 12 parts, with 128 user-editable patterns and up to 256 patterns per song across 16 song memories. The Motion Sequence feature recorded real-time parameter changes, capturing knob movements as automation data that played back with each pattern, adding dynamic movement to performances.

  Smart Media card support (4-64 MB) provided external storage for samples, patterns, and songs, with AIFF and WAV file compatibility enabling easy transfer between the ES-1 and computer-based production environments. The ES-1 found enthusiastic adoption among electronic artists including Nine Inch Nails, The Crystal Method, Chemical Brothers, and The Prodigy, cementing its reputation as a creative performance tool rather than a traditional sampler.
specs: |-
  - Polyphony: 12 parts (9 one-shot, 1 slice, 1 audio in)
  - Sampler: 32 kHz, up to 95 seconds mono / 47.5 seconds stereo
  - Sample storage: 100 mono or 50 stereo samples
  - Patterns: 128 user; up to 256 per song
  - Songs: 16 memories
  - Sequencer: 64-step loop-based; motion sequence (1 parameter per part, 64 events)
  - Effects: 11 types (reverb, flanger/chorus, phaser, ring mod, pitch shifter, compressor, distortion, decimator, isolator, resonant filter, wah) plus delay
  - Storage: Smart Media card (4-64 MB); AIFF/WAV compatible
  - Controllers: 16 pad-keys
  - MIDI: Yes
