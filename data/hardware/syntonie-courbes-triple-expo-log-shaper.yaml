description: A triple exponential and logarithmic shaper with three identical
  channels, featuring manual and voltage control over the curve of the input
  signal, transitioning from exponential to linear to logarithmic.
details: |-
  Courbes (french for curves) is a triple exponential and logarithmic shaper with three identical channels, featuring manual control as well as voltage control over the curve of the input signal, smoothly transitioning from exponential to linear to logarithmic. Most obvious use is to shape ramps and oscillators to produce curved shapes like four branched stars (exponential) and ellipses (logarithmic). However, using Courbes on more complex signals will be akin to gamma correction, allowing to expand the contrast in exponential, making the dark parts of the signal darker, as well as compressing the contrast in logarithmic, making the dark parts of the signal brighter. It is different than brightness control, which will move the whole signal towards black or white level, thus loosing information once the signal exceed the black or white level. It is also possible to use Courbes as a sine/antisine wave shaper, by sending the same signal at the input and CV input, with the CV attenuverter allowing to transition from sine (max position) to antisine (min position). On a complex signal, the sine shaping will translate into the dark parts of the signal getting darker, and the bright parts of the signal brighter, and the antisine will make the dark parts brighter and the bright parts darker. Since Courbes features three channels, it can be used to process RGB signals, allowing to finely tune the gamma of each R, G and B signals. Then those three channels are independant and can be used to process H and V ramp/oscillator signals separately, allowing for precise shaping of the curve of the resulting shape. Inputs:

  Outputs:

  Specs:

  - 8HP
  - 200mA +12V
  - 0mA -12V
  - 0mA +5V
  - 42mm deep

  Can be powered through standard Eurorack 16pin connector or DC barrel connector. Documentation
specs: |-
  - 0-1V, 100kohm
  - 0-1V, 75ohm
