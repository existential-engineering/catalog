description: The F1-LP pairs the F1 two-track portable field recorder with the LMF-1 lavalier microphone, recording WAV or MP3 at up to 24-bit/96 kHz to a microSD card. The recorder has a low profile for clipping to a belt or slipping into a pocket, an onboard limiter and auto-level control, and a 10-pin connector that takes Zoom's interchangeable mic capsules.
details: |-
  The F1 Field Recorder + Lavalier Mic completes your video's story by providing outstanding audio no matter where your production takes you. With its minimal profile, the F1 attaches neatly on belts, waistbands, or slipped into a pocket so the recorder can be easily concealed.

  The LMF-1 Lavalier mic connects directly to the F1 and records to a micro SD card. By recording directly to the F1, interference or noise commonly experienced when using a wireless beltpack system is eliminated. The F1-LP comes with Zoom's newly engineered LMF-1 lavalier mic, designed for capturing every nuance. Combined with the F1, you can record high-resolution audio up to 24-bit/96 kHz, perfect for interviews, wedding vows, and more.

  The Record Hold function or the Hold Switch can be used to prevent your subject from accidentally hitting buttons while recording. An on-board limiter and auto-level control keep your levels safe when spikes in loud volume occur. The F1 can be powered using two AAA batteries (included) or with the optional AD-17 power adapter.

  The F1's one-touch buttons give easy access to record levels, limiter control, lo-cut filter and volume output, and its monochromatic LCD display ensures visibility even in bright sunlight. The F1 records audio in WAV or MP3 formats, and WAV files are automatically time-stamped, making them Broadcast Wave Format (BWF) compliant.

  USB connectivity transfers recordings to a computer in card reader mode, or records directly to a computer or iPad with the F1 in USB audio interface mode. A proprietary 10-pin connector makes the F1 compatible with all of Zoom's interchangeable mic capsules: the SSH-6 stereo shotgun, XYH-6 stereo X/Y, MSH-6 mid-side, XYH-5 shock-mounted X/Y, EXH-6 dual combo input and SGH-6 mono shotgun.
specs: |-
  - Two-track portable recorder
  - Recording media: microSD/microSDHC cards, Class 4 or higher, up to 32 GB
  - WAV recording: 44.1 kHz/16-bit, 48 kHz/16-bit, 48 kHz/24-bit, 96 kHz/24-bit
  - MP3 recording: 48, 128, 192, 256 or 320 kbps, mono or stereo, ID3v1 tags supported
  - Display: 1.25 inch monochrome LCD
  - Mic/line input: 3.5 mm stereo mini with screw lock, supports plug-in power (2.5 V)
  - Input gain: -12 dB to +36 dB, input impedance 2 kilohms or more
  - Headphone output: 3.5 mm stereo mini with screw lock, 11 mW + 11 mW into a 32 ohm load
  - USB: microUSB, USB 2.0 High Speed mass storage, class-compliant audio interface at 44.1/48 kHz 16-bit, 2-in/2-out, asynchronous transfer
  - ZOOM mic capsule input accepts the interchangeable 10-pin capsules
  - Power: 2 AAA batteries (alkaline, NiMH or lithium) or Zoom AD-17 DC 5 V/1 A AC adapter
  - Recording time with lavalier mic at 48 kHz/24-bit mono, plug-in power on: about 10 hours alkaline, about 9 hours NiMH (750 mAh), about 16 hours lithium
  - Dimensions: 64 mm (W) x 79.8 mm (D) x 33.3 mm (H)
  - Weight: 120 g without batteries
  - Included LMF-1 lavalier microphone: omnidirectional, -32 dB/1 Pa at 1 kHz, 115 dB SPL maximum, 160 cm cable, 3.5 mm stereo mini plug with screw lock
