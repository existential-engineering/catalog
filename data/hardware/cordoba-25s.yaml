description: 25S features Soprano-sized body, Solid Acacia top, and Acacia sides and back.
details: |-
  The 25 Series embodies the charm of traditional ukulele ornamentation combined with the striking natural figure of Acacia, an exotic tropical wood closely related to Koa, the beloved tonewood native to Hawaii. All 25 series ukuleles feature a solid exotic Acacia top and figured Acacia back and sides, providing a bright, round, and familiar voice. A wooden rope-style top binding and herringbone rosette and tie block further the unique visual appeal, while hearkening to the ukulele's originas. Other features include a thinly applied satin finish, bone nut and saddle, and Aquila strings. 25 Series ukuleles are available in soprano (25S), concert (25C), tenor (25T), and tenor cutaway-electric (25T-CE) sizes.
