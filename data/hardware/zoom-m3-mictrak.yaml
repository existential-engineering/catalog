description: The M3 MicTrak is an on-camera stereo shotgun microphone with a 32-bit float recorder built into it, pairing a super cardioid mid capsule with a bidirectional side capsule for mono, 90 degree or 120 degree capture. It writes 48 kHz 32-bit float WAV to microSD alongside a backup mid-side RAW file, feeds a camera from a 3.5 mm stereo line out, and works over USB Type-C as a USB microphone.
details: |-
  The M3 MicTrak is an on-camera stereo shotgun microphone with a 32-bit float recorder built into it. A super cardioid mid capsule and a bidirectional side capsule form a mid-side pair, and 32-bit float recording captures clip-free audio with no gain to set, whether the source is dialogue, sound effects or outdoor ambience.

  A STEREO switch chooses between mono, a 90 degree stereo image and a 120 degree one. Mono suits dialogue, 90 degrees gives an accurate and transparent stereo capture, and 120 degrees gives a wider image for ambience and sound effects. Alongside the chosen stereo file the M3 always writes a backup mid-side RAW file, so the stereo width can be reset after the shoot, and a low cut filter switch sits on the same top panel as the power, transport and record controls.

  The unit is built for run-and-gun work. A custom shock mount with a hot shoe fitting attaches it to a camera or a grip and keeps handling noise down, and a 3.5 mm stereo LINE OUT feeds a backup track straight to the camera for easier syncing in the edit. A separate 3.5 mm PHONE OUT with its own volume buttons is there for monitoring, and playback controls are on the body.

  Over USB Type-C the M3 works as a USB microphone at 48 kHz and 24-bit, 2 in and 2 out, for streaming or recording to a computer. The companion M3 Edit & Play software for Windows and Mac adjusts the stereo width of a recording and normalizes files before syncing and editing, and Zoom also publishes MS Decoder plugins in VST and AU form. Recording is to WAV at 48 kHz in 32-bit float with BWF metadata, onto microSDHC cards of 4 to 32 GB or microSDXC cards of 64 GB to 1 TB, with up to four tracks recorded and two played back at once.

  The body measures 71.6 mm wide by 201.3 mm deep by 38 mm high and weighs 135 g with batteries. Two AA cells give about 12 hours on alkaline, 11 hours on 1900 mAh NiMH and 21 hours on lithium, and the Type-C port also accepts USB bus power or the Zoom AD-17 DC 5 V/1 A adapter. A shock mount, windscreen, stereo mini cable for DSLR and a Quick Tour are in the box. Batteries are not.
specs: |-
  - Mid mic (mono shotgun): super cardioid, maximum sound pressure input 133 dB SPL
  - Side mic: bidirectional, maximum sound pressure input 119 dB SPL
  - Input gain: adjustment unnecessary, dual A/D converter circuit used
  - LINE OUT: 3.5 mm stereo mini jack, maximum output level +1.2 dBu (into 2 kohm load), output impedance 100 ohms
  - PHONE OUT: 3.5 mm stereo mini jack, maximum output level 20 mW + 20 mW (into 32 ohm load), output impedance 10 ohms
  - Maximum simultaneous recording tracks: 4
  - Maximum simultaneous playback tracks: 2
  - Recording format: WAV at 48 kHz, 32-bit float stereo, BWF supported
  - Recording media: microSDHC 4 to 32 GB, microSDXC 64 GB to 1 TB
  - USB: USB Type-C connector (requires a cable that supports data transfer)
  - USB mic: USB 2.0 High Speed, 48 kHz, 24-bit, 2-in/2-out
  - File transfer: USB 2.0 High Speed
  - Power: 2 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 AC adapter (DC 5 V/1 A), USB bus power supported
  - Battery life: about 12 hours alkaline, about 11 hours NiMH (1900 mAh), about 21 hours lithium
  - Rated current: 234 mA on batteries, 186 mA on USB bus power or DC 5 V supply
  - Power consumption: 1.5 W maximum
  - Dimensions: 71.6 mm (W) x 201.3 mm (D) x 38 mm (H)
  - Weight (including batteries): 135 g
  - Stereo selection switch: MONO, 90 degrees or 120 degrees
  - Always records an additional mid-side RAW file for adjusting stereo width afterwards
  - Low cut filter switch on the top panel
  - Camera mounted or grip mounted, with a custom Zoom shock mount and hot shoe fitting
  - Companion M3 Edit & Play software for Windows and Mac adjusts stereo width and normalizes files
  - In the box: M3 MicTrak, shock mount, windscreen, stereo mini cable for DSLR, Quick Tour (batteries not included)
  - Note: 0 dBu = 0.775 Vrms
