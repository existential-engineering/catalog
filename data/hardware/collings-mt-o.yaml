url: https://collingsguitars.com/mandolins/mt-o/
description: The MT-O is an A-style mandolin featuring a satin nitrocellulose
  lacquer finish and an oval soundhole, combining affordable appointments with
  the same quality construction and tonewoods as higher-end models. Its carved
  Engelmann spruce top paired with Eastern flamed maple back, sides, and neck
  produces a rich, woody tone. The oval soundhole accentuates bass and low-mid
  response while providing a warm, open tonality. It ships with a deluxe
  hardshell case and D'Addario EJ74 strings.
details: |-
  The MT-O is an A-style mandolin built with a carved Engelmann spruce top and Eastern flamed maple back, sides, and neck. It features an oval soundhole rather than f-holes, which shapes its tonal character toward warmer bass and low-mid frequencies compared to the standard MT. Construction includes X-bracing, a dovetail neck joint, and a fully adjustable truss rod. The ebony fingerboard has MOP dot inlays and a compound radius of 7" to 11 5/8", while the ebony bridge has an adjustable saddle. The rounded V neck profile, 13 7/8" scale length, and 1 3/16" nut width suit a wide range of playing styles. Hardware includes nickel Gotoh tuners with black buttons and the Collings original tailpiece. The body is finished in satin nitrocellulose lacquer with tortoise top binding. Custom options are available through authorized dealers, including alternative tonewoods, finish colors, gloss top, Waverly tuners, and gold hardware.
