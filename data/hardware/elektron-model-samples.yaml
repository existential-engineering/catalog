description: >-
  Massive sound in a compact size. Model:Samples is a six-track groovebox that
  offers Elektron superpowers in a sleek, lightweight, and portable package.
details: |-
  The Model:Samples is a six-track sample-based groovebox with 64 MB of sample memory and 1 GB of storage. Each track features a resonant multimode filter and an assignable LFO, with delay and reverb effects available across all tracks.

  The 64-step sequencer supports parameter locks, micro timing, trig conditions, and individual track length. Six velocity-sensitive pads enable expressive performance. The unit ships with 300 preset sounds and stores 96 projects with 96 patterns each.

  Class-compliant USB audio enables direct recording. The compact unit measures 270 x 180 x 39 mm and weighs 0.80 kg.
specs: |-
  - 6-track sample-based groovebox
  - 64 MB sample memory, 1 GB storage
  - 64-step sequencer per track
  - Parameter locks, micro timing, trig conditions
  - Resonant multimode filter per track
  - 1 assignable LFO per track
  - Delay and reverb effects
  - 96 projects, 96 patterns per project
  - 300 preset sounds
  - 6 velocity-sensitive pads
  - Class-compliant USB 2.0 Hi-Speed audio
  - 48 kHz, 24-bit D/A converters
  - 128 x 64 pixel LCD display
  - 270 x 180 x 39 mm, 0.80 kg
