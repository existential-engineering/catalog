description: Massive sound in a compact size. Model:Samples is a six-track groovebox that offers Elektron superpowers in a sleek, lightweight, and portable package. Loads of useful presets and loads of space for your own sounds.
details: |-
  Massive sound in a compact size. Meet the six-track groovebox that offers pretty much all of the Elektron superpowers in a sleek, lightweight, and portable package. Loads of useful presets and loads of space for your own sounds. The controls are right there at your fingertips. A truly plug-and-play bundle of joy.

  Jump straight to the fun. Unleash your music spontaneously using the six tough, velocity-sensitive pads. Record your every move live, or punch in your creation one step at a time using the superb Elektron sequencer. At under one kilogram, you are getting the benefits of a light and convenient machine that will surprise you with its sonic power.

  This machine brings you a set of tactile controls, sporting loads of knobs that have dedicated functionality. They are all right there on the front panel; just grab a knob and twist it for instant control.

  The full-featured step sequencer lets you control both structure and sound. Press a step and tweak any parameter onto it for ultra-fast and detailed sequencing. Lock a different sample to each step if you want. Add some controlled randomness and logic with the trig conditions.

  The sound engine uses high-quality digital samples. There are 300 preset sounds supplied by Splice, ranging from the familiar kicks, snares, and hi-hats to exotic, never-before-heard tones. With a few tweaks, you can easily personalize any sample. Transfer your own samples into it, or use any of the expertly crafted custom sound packs. Easily connect to other class-compliant devices such as phones, tablets or computers for instant MIDI and audio over USB.
specs: |-
  - 1 sample playback engine per track
  - 1 assignable LFO per track
  - 1 assignable velocity modulation per track
  - 1 resonant multimode filter per track
  - 64 MB sample memory, 1 GB storage
  - 6 audio tracks, all of which may be used as MIDI tracks as well
  - Elektron sequencer up to 64 steps
  - Unique length and scale settings per track
  - Parameter locks, micro timing, trig conditions, assignable retrig
  - Real-time or grid recording of notes and parameters
  - 96 projects, 96 patterns per project
  - Delay and reverb send FX
  - 6 velocity-sensitive pads
  - 1 x 1/4" stereo headphone jack
  - 2 x 1/4" impedance balanced audio out jacks
  - 1 x Hi-Speed USB 2.0 Micro B port
  - 1 x 3.5 mm standard audio minijack (TRS) for MIDI In
  - 1 x 3.5 mm standard audio minijack (TRS) for MIDI Out/Thru
  - 128 x 64 pixel LCD screen
  - 48 kHz, 24-bit D/A converters
  - Power inlet: center positive 3.5 x 1.35 mm barrel jack, 5 V DC, 1 A
  - Class-compliant USB audio
  - W270 x D180 x H39 mm (10.7" x 7.1" x 1.6") including knobs and feet
  - Weight: approximately 0.80 kg (1.8 lbs)
  - 3 year Elektron warranty
