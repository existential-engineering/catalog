description: A true-stereo expansion of Mr. Black's Vintage Ensemble
  chorus/vibrato, with standard and spatial-expansion modes that widen the
  stereo field via the Haas effect. Production discontinued.
details: |-
  The Stereo Vintage Ensemble is a true-stereo expansion of Mr. Black's coveted
  Vintage Ensemble, a classic chorus/vibrato modeled directly on the original
  Roland Ensemble chorus circuit. It offers both standard and spatial-expansion
  modes, switchable on the fly via a Normal / Stereo footswitch.

  The magic is in Stereo mode, which applies complementary modulated delay times
  to the left and right channels and further widens the stereo spread using the
  Haas effect, producing a chorus with an unusually deep, enveloping sense of
  space.

  A full Wet/Dry mix control balances the effect, and the carefully tuned delay
  times match those of the original chorus circuit. A standard expression pedal
  can be assigned on the fly to any and all control knobs by turning the desired
  control to the red dot marker (expression jack wiring is tip-wiper, ring-high,
  sleeve-ground).

  This pedal has been discontinued and succeeded by the Stereo Vintage Ensemble
  Professional. The listing carries a "PRODUCTION DISCONTINUED" banner (sold out
  05.20.2026), so it is catalogued for completeness. It runs on standard 9VDC
  pedalboard power (daisy-chain friendly, ~68mA draw) in a compact enclosure.
specs: |-
  - True-stereo audio path
  - Normal and Stereo (spatial-expansion) modes via footswitch
  - Left Input: chorus input with dry pass-through (chorus output on both L and R outputs)
  - Right Input: dry pass-through only
  - Complementary modulated delay times + Haas-effect stereo widening in Stereo mode
  - Full Wet/Dry mix control
  - Delay times matched to the original chorus circuit
  - Expression pedal assignable to any/all controls (tip-wiper, ring-high, sleeve-ground)
  - 9VDC industry-standard power, ~68mA draw (daisy-chain friendly)
  - Compact footprint (4.7" x 3.7")
  - PRODUCTION DISCONTINUED (sold out 05.20.2026)
