description: Duesenberg Guitars Fantom Series A & Series S
details: |-
  The Fantom is the first Duesenberg instrument built on a shorter 625 mm / 24.6" scale length, and it is offered as two separate series, A and S, covering a range from vintage tone to a more modern voice. The Series S is made from hand-selected premium mahogany for the neck and body with a carved maple top, finished with deluxe five-ply cream and black binding and a poly finish. The body measures 44 x 32 cm (17.3" x 12.6") with 4.5 cm (1.8") sides, and the burst finishes add flamed maple, with hand-selected AAA flamed maple on the Light Antique Burst.

  The set neck is one-piece mahogany with an Indian rosewood fingerboard at a 305 mm / 12" radius, cream binding and Duesenberg Wing inlays, 22 jumbo frets (2.8 x 1.0 mm), a medium D profile, a steel dual-action truss rod and a black headstock. Duesenberg's Plek process levels the frets, which the maker treats as the foundation for its multi-step fret polishing and setup work. Burst models carry a transparent brown finish on the neck, sides and back.

  Electronics use a custom-made set of Duesenberg Grand Vintage II Alnico 2 pickups, developed specifically for this instrument and voiced for a warm, mellow vintage tone. Wiring is one master volume, one master tone, a neck preset volume and a three-way pickup selector: the control knob at the cutaway horn sets a separate volume for the neck pickup, which changes the tone available when switching between pickups.

  Hardware is nickel finished and comprises Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and a Duesenberg aluminium Wrapper tailpiece, with Duesenberg Standard, Straplock-compatible strap pins. The guitar is strung with Duesenberg Custom 10/50 strings (010-013-017-028-042-050).

  The instrument ships with the handcrafted Duesenberg Custom Line Case as standard, along with all the allen keys required for setup.
specs: |-
  - Neck type: Set Neck, 1-piece Mahogany
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 23.5 mm / 0.93" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood with cream binding, radius 305 mm / 12"
  - Inlays: Duesenberg Wings
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 625 mm / 24.6"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid Mahogany Body with carved Maple Top
  - Special Tops: Tobacco Burst with Flamed Maple, Light Antique Burst with handselected AAA Flamed Top
  - Dimensions: 44 x 32 cm / 17.3" x 12.6"
  - Height (sides): 4.5 cm / 1.8"
  - Pickguard: Black Custom
  - Binding: Multi-layer binding on back and top
  - Finish: Poly finish
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tailpiece: Duesenberg Aluminum Wrapper Tailpiece
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Grand Vintage Alnico II (Neck)
  - Pickup (bridge): Duesenberg Grand Vintage Alnico II (Bridge)
  - Wiring: 1 Master Volume, 1 Master Tone, 1 Neck Preset Volume, 3-Way Pickup Selector
  - Case: Duesenberg Custom Line Case (included)
  - Tools: All required allen keys (included)
