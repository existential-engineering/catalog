id: aeFzUVaxlaeCZDo7xeqGs
name: PIM-MC1
manufacturer: stax
primaryCategory: preamp
description: An optional MC phono equalizer module designed exclusively for the
  SRM-T8000 amplifier. Features completely separated left and right channels
  with Class-A amplification, DC amplifier configuration, and premium
  audio-grade components including WIMA film capacitors for high signal-to-noise
  performance.
specs: |-
  - Input impedance: 100 Ω
  - Amplification: 60 dB
  - Frequency response: 20 – 20,000 Hz ±0.3 dB
  - Rated input level: 0.1 mV / SRM-T8000 100 V output
  - Maximum input level: 11 mVr.m.s. / 1 kHz
