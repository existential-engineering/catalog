description: The Formula 51 is an amp-in-a-box pedal inspired by the Fender
  Tweed Champ 5F1 amplifier, faithfully recreating its preamp, discrete power
  amp simulator, and output transformer. A Sag control lets you dial in
  transformer saturation and blown-out character, while the Tone control spans
  Tweed to Blackface voicings via a mid-scoop modification. It runs at 9V or
  18V, with 18V unlocking greater headroom and more expressive Sag response.
details: |-
  The Formula 51 pays tribute to the Fender Tweed Champ 5F1, one of the most beloved small amplifiers in electric guitar history. Inside the pedal you get a complete signal chain: preamp stage, a discrete power amp simulator, and an output transformer — the same three elements that give the original amp its distinctive compressed, harmonic character.

  The Gain control mirrors the original amp's single volume knob, sweeping from gritty, touch-sensitive cleans all the way into heavy, saturated distortion. The Volume knob sets your output level. Tone goes beyond the original circuit with a mid-scoop modification drawn from the Framus Cobra amp, letting you blend between the forward midrange of classic Tweed and the scooped, open sound of Fender Blackface voicings.

  The Sag control is the Formula 51's signature feature, simulating the voltage sag that happens when an amp's power transformer struggles under heavy playing — producing that characteristic bloom, compression, and broken-up feel. Sag is most effective when running the pedal at 18V, which also increases overall headroom.

  The Formula 51 is designed for guitarists who want the feel and response of a cranked vintage amp in a compact, pedalboard-friendly format.
