details: |-
  The 35T tenor uke features all solid Acacia for the top, back, and sides which give it a clear, bright tone, and distinctive figured appearance. The 35T also features a beautiful Rosewood bridge, binding, and fingerboard. The styling is refined and sleek, using Abalone for the inlaid rosette and Rosewood for the binding, capped off with Cordoba’s signature elevated headstock with a figured Acacia overlay. The finish is a gloss polyurethane, applied as thinly as possible for maximum resonance. Other features include a black TUSQ nut and saddle, chrome Grover tuners, and a Cordoba polyfoam case.
