description: Two-in, four-out USB audio interface with dual Tone Shaping preamps
  and a colour Smart Display.
details: |-
  Volt 2 Gen 2 is a bus-powered desktop USB audio interface with two Tone Shaping preamps, each offering 60 dB of gain and the Warmth, Focus and Shine character modes that stand in for classic analog mic preamps.

  Two rear mic and line combo inputs pair with two front-panel Hi-Z instrument inputs, so vocals and instruments can be tracked together or in stereo. Phantom power is switchable per channel, and Auto-Gain with Clip Protection sets levels without a test take.

  A full-colour Smart Display reports inputs, levels and settings at a glance. The interface integrates with the UAD Console app and LUNA, including session recall and low-latency cue mixes, and carries built-in loopback for streaming and content creation.
specs: |-
  - 2-in / 4-out USB audio interface
  - 32-bit / 192 kHz conversion
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Two Tone Shaping preamps, 60 dB available gain each
  - Warmth, Focus and Shine character modes
  - Full-colour Smart Display
  - Auto-Gain and Clip Protection
  - Independent switchable 48V phantom power per channel
  - Two front-panel Hi-Z instrument inputs
  - Built-in loopback
  - USB bus-powered, 3.4W typical and 4.9W maximum at 5VDC
  - Class-compliant with Mac, Windows, iPad and iPhone
