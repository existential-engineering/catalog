description: >-
  With the Octatrack MKII, discovering the perfect sample is only the beginning.
  Twist it, distort it, and carve it into something that is truly yours.
details: |-
  The Octatrack MKII is an eight-track dynamic performance sampler with eight additional MIDI tracks. It features 80 MB of Flex RAM per project, CompactFlash card storage, and a 64-step sequencer with 256 patterns per project.

  Each track offers two effect slots from a comprehensive selection including multimode filter, parametric EQ, DJ-style kill EQ, phaser, flanger, chorus, spatializer, comb filter, compressor, lo-fi, echo freeze delay, and multiple reverb types. Three LFOs per track provide deep modulation capabilities.

  The unit features dedicated main and cue outputs for DJ-style monitoring, four external audio inputs for live sampling and processing, and full MIDI sequencing. Housed in a sturdy steel casing with a 128 x 64 pixel OLED display.
specs: |-
  - 8 audio tracks + 8 MIDI tracks
  - 64-step sequencer, 256 patterns per project
  - 80 MB Flex RAM per project
  - CompactFlash card storage
  - 2 effect slots per track (14 effect types)
  - 3 LFOs per track
  - 4 external audio inputs (A/B stereo pairs)
  - Dedicated main and cue outputs
  - 44.1 kHz, 24-bit converters
  - 128 x 64 pixel OLED display
  - Steel casing: 340 x 184 x 63 mm, 2.3 kg
  - 5 GB factory sample content included
