description: "With the Octatrack MKII, discovering the perfect sample is only the beginning. Twist it, distort it, and carve it into something that is truly yours. Dynamic in name and nature: this is the ultimate sampler for recording sessions, creative kick-starts, and improvisational performances."
details: |-
  With the Octatrack MKII, discovering the perfect sample is only the beginning. Twist it, distort it, and carve it into something that is truly yours. Dynamic in name and nature: this is the ultimate sampler for recording sessions, creative kick-starts, and improvisational performances.

  Eight audio tracks each carry a specialized machine, a track recorder, an amplitude envelope, three LFOs, and two user-selectable track effects. Eight MIDI tracks sit alongside them, each with an arpeggiator, three LFOs, and ten configurable CCs.

  The track effects cover a wide range: a 12/24 dB multimode filter, a 2-band parametric EQ, a DJ-style kill EQ, a 2-10 stage phaser, flanger, 2-5 tap chorus, spatializer, comb filter, compressor, Lo-Fi with sample rate reduction, bit reduction, distortion and amplitude modulation, echo freeze delay, gatebox plate reverb, spring reverb, and dark reverb.

  The sequencer runs up to 64 steps per pattern with individual track lengths and time signatures, chromatic, slice, slot, and delay freeze modes, parameter locks, trig conditions, tempo per pattern, trig preview, sample-per-step change, micro timing, retrig functionality, swing and slide, and full real-time control.

  Storage is on a CompactFlash card, whose size determines the number of projects. Each project carries 80 MB of flex RAM with static sample streaming from the card, 256 patterns, 256 sample slots, and 8 arrangements. The unit ships with 5 GB of high-quality samples pre-installed.
specs: |-
  - 8 audio tracks: 1 specialized machine, 1 track recorder, 1 amplitude envelope, 3 LFOs, 2 user selectable track effects each
  - 8 MIDI tracks: 1 arpeggiator, 3 LFOs, 10 configurable CCs each
  - Up to 64 steps per pattern, individual track lengths and time signatures
  - Chromatic, slice, slot, and delay freeze modes
  - Parameter locks, trig conditions, tempo per pattern, trig preview
  - Sample-per-step change, micro timing, retrig, swing and slide, full real-time control
  - CF card storage, card size determines the number of projects
  - 80 MB flex RAM per project, static sample streaming from CF card
  - 256 patterns, 256 sample slots and 8 arrangements per project
  - Track effects: 12/24 dB multimode filter, 2-band parametric EQ, DJ-style kill EQ, 2-10 stage phaser, flanger, 2-5 tap chorus, spatializer, comb filter, compressor, Lo-Fi (SRR, BR, Dist and AM), echo freeze delay, gatebox plate reverb, spring reverb, dark reverb
  - 128 x 64 pixel OLED screen
  - MIDI In/Out/Thru
  - 2 x 1/4" impedance balanced main audio out jacks
  - 2 x 1/4" impedance balanced cue audio out jacks
  - 4 x 1/4" balanced external input jacks
  - 1 x 1/4" stereo headphone jack
  - 44.1 kHz, 24-bit D/A and A/D converters
  - Hi-Speed USB 2.0 port
  - Power inlet: center positive 5.5 x 2.5 mm barrel jack, 12 V DC, 2 A
  - Main outputs level: +17 dBu peak, output impedance 440 ohm unbalanced
  - Headphones out level: +17 dBu peak, output impedance 55 ohm
  - Balanced audio inputs: +17 dBu peak, 21 kohm
  - Digital S/N ratio: 104 dB outputs, 106 dB inputs (20 to 20000 Hz)
  - Unit power consumption: 7 W typical
  - Compatible Elektron power supply: PSU-3c and PSU-3b
  - Sturdy steel casing, W340 x D184 x H63 mm (13.3" x 7.2" x 2.5")
  - Weight: approximately 2.3 kg (5 lbs)
  - Maximum recommended ambient operating temperature: +40 C (+104 F)
  - 5 GB of high-quality samples pre-installed
  - 3 year Elektron warranty
