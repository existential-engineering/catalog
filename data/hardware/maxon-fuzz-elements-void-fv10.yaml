description: The FV10 Void emulates the vintage Ampeg Scrambler, producing
  unique frequency- and dynamics-dependent fuzz and octave effects that vary
  based on playing technique and note position.
details: |-
  Strangled squeals, cacophonous chords, raucous ring modulations and other amazingly unpredictable mayhem – that's just a sample of what you can expect from the Fuzz Elements FV10 Void. Designed to emulate the otherworldly sounds of the vintage Ampeg Scrambler, the FV10 circuit is loaded with tons of even-order harmonics to create unique octave/fuzz sounds that are dynamic- and frequency-dependent. This means that the FV10's effect is generated not only by which notes you play, but how you play them! The FV10's effect is not for the faint of heart – Spongy, strangely synthetic guitar tones that swell up out of the depths of some black Void and then sizzle off into infinity. Octave-up OR octave-down effects can be produced, depending on the position of the controls and the playing position on the neck. Likewise, single notes or chords can both be played, each generating their own unique sounds. By chaining the FV10 with other distortion devices and adjusting the Blend knob, an entire new range of unique fuzz/distortion effects can be achieved as the FV10's circuit interacts with the complex harmonic content of the other device. Unlike the original Scrambler, the FV10 features a Level control with a significant volume boost. This allows the user to match the pedal's output level to unity gain or to other effect pedals in their signal chain. Mechanical True Bypass switching makes certain that all this chaos is kept locked up until you decide to unleash it. TECH TALK:

  The FV10 features mechanical true bypass switching, Effect LED Indicator, and 9-Volt DC Battery or external adaptor operation.
specs: |-
  - Fuzz engine designed to emulate the sound of vintage Ampeg Scrambler
  - Unique frequency- and dynamics-dependent Fuzz/Octavia effects
  - Overtone Knob controls amount of even-order harmonics
  - Blend controls balance of Dry and Effected signals
  - Level controls output level (use as a Booster)
  - Mechanical True Bypass Switching
