description: Bring some heat to your music creation workflow with nanobox |
  fireball, a polyphonic wavetable mini synthesizer with intuitive touchscreen
  control.
details: |-
  Featuring eight-voice polyphony, two wavetables and an oscillator, fireball unlocks a huge array of sounds, from punchy and aggressive leads to atmospheric pads. Touchscreen X/Y control allows instant morphing and shaping of sounds with the swipe of a finger. Choose from hundreds of professionally designed presets and wav files, or quickly create custom patches with deep parameter control via the 2-inch touchscreen.

  fireball integrates seamlessly with existing tabletop gear via mini TRS MIDI in/out and mini TRS line in/out, or on the go thanks to a compact, nearly indestructible design that fits in the palm of a hand. Sound is sculpted with 2 filters, 2 envelopes, 2 LFOs, and 1 modulation sequencer, plus 6 onboard effects (flanger, distortion, chorus, phaser, delay, and reverb) split across 2 assignable slots for up to 12 combinations. An audio input allows an external signal to be processed through the onboard effects and mixed into the output.
specs: |-
  - 8-voice polyphony with 2 wavetables and 1 oscillator
  - 2 filters, 2 envelopes, 2 LFOs, 1 modulation sequencer
  - 6 onboard effects (flanger, distortion, chorus, phaser, delay, reverb) across 2 assignable slots
  - 2-inch touchscreen with X/Y morphing control, 2 knobs, 4 buttons
  - Includes 123 presets and 103 wavetables
  - Wavetables use 2048 samples per cycle and 256 cycles
  - Power: USB-C connection, 5V, 500mA
  - 3.5mm audio input and output
  - Maximum input and output level: 2Vrms
  - DAC and ADC resolution: 24-bit
  - Internal resolution: 32-bit
  - Sample rate: oscillators 96kHz, rest of engine 48kHz
  - MIDI Input: 3.5mm Type A/B auto sensing
  - MIDI Output: 3.5mm, Type A or Type B selectable
  - Clock Input: 1, 2, 4, 8, 12, or 24 PPQ
  - MIDI support: Program Change, Note On/Off, Mod Wheel, Sustain, Pitch Bend, mono & poly Aftertouch, assignable CCs, and clock
  - microSD card slot for custom wavetables
  - H x W x D: 1.5" x 3.75" x 3"
  - Weight: 0.25 lbs
