url: https://www.ludwig-drums.com/en-us/ludwig/products/snare-drums/chrome-over-brass
description: >-
  Ludwig's Chrome Over Brass snare drum, introduced in 1960 as the Super Ludwig,
  was the predecessor to the Supraphonic. The brass construction with chrome
  plating provides the musical undertones favored of brass with just the right
  touch of added focus and treble.
details: |-
  Originally short-lived, the Chrome Over Brass was re-released in the 1990s due to high demand. Available in 5x14" and 6.5x14" sizes with a choice of imperial lugs, tube lugs, or brass tube lugs with die-cast hoops and the Millennium strainer.
specs: |-
  - 1.2mm seamless brass shell, chrome plated
  - 2.3mm steel triple flanged hoops (optional die-cast)
  - P88AC throw off
  - P35P butt plate
  - 10 lugs (Imperial, Tube, or Brass Tube options)
  - Ludwig Weather Master medium coated batter head
  - Ludwig Weather Master clear snare-side head
  - Supraphonic snares
  - Available sizes: 5x14", 6.5x14"
  - LB400 — 5x14" smooth shell, imperial lugs
  - LB400T — 5x14" smooth shell, tube lugs
  - LB400BBTWM — 5x14" brass tube lugs, Millennium strainer, die-cast hoops
  - LB402 — 6.5x14" smooth shell, imperial lugs
  - LB402T — 6.5x14" smooth shell, tube lugs
  - LB402BBTWM — 6.5x14" brass tube lugs, Millennium strainer, die-cast hoops
