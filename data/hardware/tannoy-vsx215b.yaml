description: Twin 15" dual ported bass reflex passive subwoofer for touring and
  installation applications.
details: |-
  Twin 15" Horn Loaded Passive Subwoofer for Touring and Installation Applications. The 8,000-Watt peak VSX215B is a direct radiating passive twin 15" subwoofer ideally suited for speech and music sound reinforcement in fixed, portable, and touring audio systems. A dual ported bass reflex system featuring dual high powered 15" low frequency drivers with extended low frequency response down to 40 Hz. The rear panel connector plate carries industry-standard twist-locking speaker and barrier strip connectors for input and link connections.
specs: |-
  - frequencyResponse: 48 Hz – 350 Hz, ±3 dB; 40 Hz – 450 Hz, -10 dB
  - recommendedLowPassCrossover: 90 – 250 Hz, 24 dB/Oct
  - nominalDispersion: Half space
  - powerHandlingIEC: 2000 W continuous, 8000 W peak
  - sensitivity: 108 dB (1 W @ 1 m)
  - maximumSPL: 141 dB continuous, 147 dB peak
  - impedance: 4 Ω (parallel), 2 x 8 Ω (discrete)
  - components: 2 x 15" (381 mm) LF driver
  - connectors: 2 x Industry-standard 4-pole twist-lock speaker connectors, 2 x barrier strip terminals
  - parallelWiring: Pins 1+/1- input, pins 2+/2- link
  - discreteWiring: Pins 1+/1- input (SUB 1), pins 2+/2- input (SUB 2)
  - dimensions: 708 x 1052 x 851 mm (27.9 x 41.4 x 33.5")
  - netWeight: 90.2 kg (198.4 lbs)
  - construction: 18 mm (3/4") plywood
  - finish: Semi matt black paint
  - grille: Powder coated perforated steel
  - flyingHardware: M10 x 22 points
