description: A versatile Eurorack voltage-controlled oscillator with coarse and
  fine tuning, pulse width modulation, linear FM, hard and soft sync, and saw,
  pulse, triangle, and sine outputs along with a sub oscillator.
details: |-
  The Stoel Music Systems Standard VCO is a versatile oscillator with a variety of controls and outputs. Coarse and fine tuning controls are provided for a wide range of accurate tuning. The CV 1 jack follows a 1 volt per octave scale. Knobs control the scale of the CV 2 and CV 3 jacks. The pulse waveform is a square wave with a variable duty cycle which can be manually adjusted with the pulse width knob. The pulse width can also be modulated with a signal on the PWM jack, with the depth controlled by the pulse width mod knob. The linear FM input modulates the tuning with an LFO or another oscillator without shifting the center pitch. The linear FM knob controls the amount of modulation applied to the pitch. Hard sync and soft sync jacks are also provided. Outputs include saw, pulse, triangle, and sine. Additionally, a sub oscillator provides a -1 octave square, a -2 octave square, and a -2 octave narrow pulse in a nod to the sub-oscillator on the SH-101. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  16 HP

  Depth
  25 mm

  Current Draw
  +12V: 25mA, -12V: 20mA, +5V: 0mA
specs: |-
  - A versatile oscillator with a variety of controls and outputs
  - Features a sub oscillator provides a -1 octave square, a -2 octave square, and a -2 octave narrow pulse
  - Coarse and fine tuning controls are provided for a wide range of accurate tuning
  - The linear FM input modulates the tuning with an LFO or another oscillator without shifting the center pitch
  - Outputs include saw, pulse, triangle, and sine
