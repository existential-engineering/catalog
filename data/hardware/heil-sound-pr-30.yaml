details: |-
  Heil PR 30 Overview

  The Heil PR 30 is a professional-grade dynamic microphone engineered to deliver pristine, clear, condenser-like audio performance while offering the rugged reliability and noise rejection of a dynamic design. Built around a large 1.5-inch low-mass diaphragm with a powerful neodymium magnet structure, the PR 30 delivers an ultra-smooth frequency response across 40 Hz to 18 kHz, featuring an articulate, forward midrange that captures transient detail without high-end harshness.

  Engineered with a tight supercardioid pickup pattern and an industry-leading -40 dB of rear noise rejection at 180° off-axis , the PR 30 excels in high-noise environments, untreated acoustic spaces, and loud live stages. Capable of handling extreme sound pressure levels up to 146 dB SPL without distortion, it serves as a versatile workhorse for studio recording, podcasting, broadcast, and live sound reinforcement, delivering exceptional clarity on guitar amp cabinets, drum overheads, snare drums, acoustic instruments, and vocals.
specs: |-
  - Large 1.5" Low-Mass Dynamic Element: Utilizes a massive diaphragm with neodymium magnets, delivering a wide frequency response (40 Hz – 18 kHz) and ribbon-like smooth detail with superior dynamic range.
  - Exceptional Rear Rejection (-40 dB): Offers outstanding off-axis rejection at 180°, dramatically reducing stage bleed, room reflections, and ambient noise in home studios and live venues.
  - High SPL Handling (146 dB Max SPL): Handles high sound pressure levels with ease, making it an ideal choice for loud guitar speaker cabinets, snare drums, brass, and percussion.
  - Tailored Midrange Presence: Specifically voiced with mid-range clarity and vocal articulation in mind, making it well-suited for female voices, broadcast talent, and instruments without inducing low-end mud or boominess.
  - Internal Shock Mount & Hum-Bucking Coil: Built-in internal element mounting minimizes handling noise and mechanical vibration, while an integrated hum-bucking coil guards against EMI/RFI interference.
  - Dual-Mesh Internal Pop Protection: Features a specialized dual windscreen screen system that guards the diaphragm against breath blasts, plosives, and sibilance.
  - No Phantom Power Required: Standard 3-pin XLR end-address output connects directly to any audio interface, mixer, or preamp without needing external inline boosters or +48V phantom power.
  - Element Type: Dynamic.
  - Polar Pattern: Super Cardioid.
  - Frequency Response: 40 Hz – 18 kHz.
  - Rear Rejection (@ 180°): -40 dB.
  - Impedance: 370 Ω balanced.
  - Output Level (@ 1 kHz): -51 dB.
  - Max SPL: 146 dB.
  - Output Connection: 3-pin XLR.
  - Weight: 9 oz (255 g).
