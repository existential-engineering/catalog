description: Vintage ribbon microphone with dual-ribbon aluminum diaphragm
  delivering classic figure-8 character with warm lows and clear high-frequency
  detail, suitable for vocals, instrument cabs, drum overheads, and room
  recording.
details: |-
  The CR-14 is Avantone Pro's vintage ribbon microphone designed to bring
  classic ribbon character into modern recording workflows. Its dye cast
  housing and brass/steel grill assembly provide durability without sacrificing
  aesthetics.

  The dual-ribbon diaphragm is made from pure aluminum at 35mm x 5mm and only
  2 microns thick, offering a larger sweet spot compared to single-ribbon
  designs. The figure-of-8 polar pattern captures sound from front and back
  while naturally rejecting room noise from the sides — ideal for mid-side and
  Blumlein stereo techniques.

  Entirely passive operation means no phantom power is required or desired.
  The CR-14 ships with a retro shockmount, a wooden presentation box, a metal
  road case, and a manual.
specs: |-
  - Polar Pattern: Figure of 8
  - Ribbon Material: Pure Aluminum, dual design
  - Ribbon Dimensions: 35mm x 5mm / 2 microns thick
  - Frequency Response: 30Hz – 15kHz ±3dB
  - Output Impedance: ≤600 Ohms
  - Recommended Load: 3000 Ohms
  - Sensitivity: -52 dBv ±2dB
  - S/N Ratio: 70dB
  - Noise Floor: <17 dBA
  - Maximum SPL: 145dB (0.5% THD @1kHz)
  - Output Connector: Male XLR 3-pin
  - Power Requirement: None
