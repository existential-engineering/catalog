description: LT-HD is an LSlot interface card that installs in a Lynx Aurora or
  Hilo and connects the converter to a Pro Tools|HD system over DigiLink. Pro
  Tools recognizes the Aurora or Hilo and controls all input and output
  functions, clocking, routing and other settings.
details: |-
  Easily installed in Aurora's or Hilo's LSlot bay, the LT-HD allows Lynx converters to be used in all current Pro Tools|HD systems. Connected via DigiLink cables to HD Core, Accel Core, HDX or Native cards, Pro Tools recognizes the Aurora or Hilo converter and controls all input and output functions, clocking, routing and other settings. One LT-HD equipped Aurora 16 can provide up to 32 channels of analog to digital and digital to analog conversion.

  This is a truly plug and play system. LT-HD's hardware and on-board software streamline installation and set-up, bringing Aurora and Hilo audio quality and channel count to the Pro Tools system. LT-HD provides signal latency identical to that of the Avid converter for accurate delay compensation within Pro Tools, so no manual delay adjustments are required.

  The LT-HD contains one Primary and one Expansion DigiLink port. Aurora supports full channel count at sample rates up to 192 kHz. You do not lose half of your channels at higher sample rates and you do not need to purchase additional modules for full channel counts. Pro Tools users can also benefit from Lynx's exclusive SynchroLock word clock for very low jitter and low distortion of digital signals.

  A revised LT-HD firmware allows the Aurora 16, Aurora 8 and Hilo to emulate the interface characteristics of the Avid HD I/O converter, allowing operation with Avid systems including HDX and HD Native. Emulation of the HD I/O delay allows Lynx and Avid hardware to be used in the same system with sample accuracy, and current owners of LT-HD equipped Aurora converters could update to the LT-HDx functionality at no charge with a firmware update, with no new hardware required.
specs: |-
  - LSlot interface card for Lynx Aurora and Hilo converters
  - One Primary and one Expansion DigiLink port
  - Up to 32 channels of analog and digital I/O per HD Core, Accel Core, HDX or Native card with one Aurora 16
  - Supports full channel count at sample rates up to 192 kHz
  - Audio signal latency identical to that of the Avid HD I/O for accurate delay compensation within Pro Tools
  - Two modes of Avid HD I/O emulation: 32-channel mode provides two instances of the 8 x 8 x 8 analog and digital in and out model, 16-channel mode provides one instance of the 16 x 16 analog in and out model
  - Connects to HD Core, Accel Core, HDX and HD Native cards using standard DigiLink cables
  - Allows daisy-chaining of multiple Aurora converters and other DigiLink devices via the Expansion port
  - I/O functions for parameter control can be controlled and monitored within Pro Tools
  - Lynx proprietary SynchroLock word clock technology reduces jitter when Aurora or Hilo is a clock slave and provides a stable, low jitter clock to downstream devices
  - Powered by the Aurora or Hilo LSlot bay it is installed in, with no power connector of its own
  - Designed and manufactured in the USA
  - Discontinued September 2019; replaced by the LT-HD2 for the Aurora(n)
