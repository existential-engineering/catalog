name: HEDDphone TWO GT
manufacturer: hedd
primaryCategory: headphones
url: https://hedd.audio/products/heddphone-two-gt
description: The HEDDphone TWO GT is an open-back over-ear headphone tuned for
  audiophile listening, pairing a warmer voicing and a lower-distortion Air
  Motion Transformer driver with premium switchable velour and leather earpads.
details: |-
  Developed with the audiophile world in mind, the HEDDphone TWO GT has been designed for listening enjoyment rather than technical work. Based on the successful HEDDphone TWO design, key details have been refined for an exceptional listening experience.

  The GT features a new, warmer tuning that combines precision and emotion, and an updated AMT driver with a multi-layered Kapton polyimide diaphragm and even lower distortion. New premium 4-core 5N SPC cables are nylon-woven and hand-braided, and visual touches have been added to the logo and HEDDband stitching.

  Comfort is improved with new velour and lamb leather ear pad options, which can be switched at your leisure. The result is a richer, smoother, yet still incredibly detailed and fast sound with an innovative ergonomic design for an engaging and luxurious listening experience. An UNPLUGGED configuration is available without cables and with a single pair of ear pads.
specs: |-
  - Design: Open-back over-ear headphone
  - Drivers: Air Motion Transformer with VVT technology and multi-layered Kapton polyimide diaphragm
  - Frequency Range: 10 Hz - 40 kHz
  - Impedance: 41 Ω flat
  - Power: Min. 200 mW, recommended ≥1000 mW
  - Inputs: 3.5mm jack
  - Maximum SPL: 88 dB SPL at 1 mW
  - Weight: 550g
  - Pads: Lamb leather and velour ear pads and head cushion
  - Cable: 4-Core 5N SPC, nylon-woven and hand-braided; balanced and unbalanced; 1.6m long
