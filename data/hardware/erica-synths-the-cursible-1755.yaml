description: The Cursible from Sacrament Modular brings effects morphing (and
  much more) to the Eurorack format. The Cursible is a 14HP 6 channel, morphing
  effects-send matrix with an incredible feature set and a vast amount of
  applications from morphing / sequencing through and blending effects through
  to cadavre exquis style mixing of sound sources or control voltages.
details: |-
  The Cursible from Sacrament Modular brings effects morphing to the eurorack format. It is a 14HP, 6 channel morphing effects-send matrix, designed in collaboration with Erica Synths, and its applications run from morphing and sequencing through blended effects to cadavre exquis style mixing of sound sources or control voltages.

  Applications include morphing a signal through 6 reverbs, delays, distortions, waveshapers, flangers or phasers to build a sound of your own, sending a signal to between 0 and 6 destinations in any order with adjustable fade times, morphing through multiple sound sources to create an ever-evolving oscillator timbre, morphing through multiple CV sources for a unique, evolving voltage source, and sequencing oscillator stacks for rich, blooming soundscapes.

  Piano mode sends the signal through the effects chains manually from a momentary button push with user-defined fade times. Clock mode sequences it through the chains from the clock input, with clockwise, counter-clockwise, pendulum and random sub-modes. Control voltage mode morphs and switches through the effects from the CV input and its attenuator, using any CV source.

  Manual mode selects the routing with the central knob for a hands-on approach, random manual mode advances randomly through the sequence with a turn of the same knob, and CV plus clock mode chooses the routing destinations with a sample and hold style approach. Fill operation stacks from 0 up to all 6 sends and returns at once when sequencing one chain at a time is not enough.

  Every mode offers user-defined morph timing, from click-less switching to long attack and decay times and everything in between. The module is 14HP wide and 25mm deep, and draws 52mA on the +12V rail and 26mA on the -12V rail.
specs: |-
  - 6 channel morphing effects-send matrix
  - PIANO MODE: manual routing via a momentary button push with user-defined fade times
  - CLOCK MODE: clockwise, counter-clockwise, pendulum and random sequencing from the clock input
  - CONTROL VOLTAGE MODE: morph and switch through effects from the CV input and attenuator
  - MANUAL MODE: routing selected with the central knob
  - RANDOM MANUAL MODE: random advance through the sequence
  - CV + CLOCK MODE: sample and hold style destination selection
  - FILL OPERATION: stack from 0 to all 6 sends and returns
  - User-defined morph timing in every mode
  - Power consumption 52mA +12V, 26mA -12V
  - Module width 14HP
  - Module depth 25mm
