description: 'The 100-watt RB-112 combo features a custom 12" Lavoce speaker for
  practicing, performing, and recording. Classic Ampeg 3-band EQ with Ultra
  Hi/Ultra Lo switches and Super Grit Technology overdrive deliver legendary
  Ampeg tone.'
details: |-
  The 100-watt RB-112 features a custom 12" Lavoce speaker and is a perfect choice for practicing, performing, and recording.

  Classic Ampeg 3-band EQ and Ultra Hi/Ultra Lo switches, combined with the new Super Grit Technology overdrive circuit, enable you to easily dial in legendary Ampeg tone.

  Additional features include an auxiliary input, a headphone output, an effects loop, and an XLR output that provides a professional connection to a P.A. or recorder.

  Vintage styling is paired with modern features and a lightweight 25.9 lb. (11.75 kg) chassis, making the RB-112 portable enough for gigs and rehearsals.
specs: |-
  - 100 watts
  - 12" Custom Lavoce speaker
  - Vintage styling with modern features
  - Ampeg Legacy preamp
  - 3-band EQ with Ultra Hi/Ultra Lo switches
  - Footswitchable SGT (Super Grit Technology) overdrive
  - Auxiliary input and headphone output
  - Effects loop
  - XLR direct output
  - 25.9 lbs. (11.75 kg)
