details: |-
  The CRBN2 is Audeze's most advanced electrostatic headphone, combining second-generation carbon-nanotube electrostatic drivers with breakthrough SLAM technology. The result delivers the most powerful, tactile bass response of any electrostatic headphone alongside vividly holographic spatial imaging.

  The SLAM (Symmetric Linear Acoustic Modulator) system is tuned to enhance bass frequencies while lowering distortion, maintaining optimal pressure distribution on the diaphragm through patent-pending design. This technology enables life-like physical bass reproduction without added distortion and allows optimized driver response for accurate acoustic space resolution.

  CRBN2 is constructed from premium materials including magnesium, carbon fiber, premium leather, stainless steel, and polymer acetate. Each unit is hand-assembled and tested in California by electrostatic specialists. The headphones incorporate an ultra-thin polyimide film diaphragm infused with carbon nanotubes, representing patented manufacturing developed in-house.

  The product heritage traces to a UCLA School of Medicine collaboration for MRI-compatible headphones, where ferrous metals were eliminated, leading to carbon nanotube film development. The headphones require amplifiers with 580VDC Stax Pro Bias electrostatic output and weigh 480 grams.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Push-pull electrostatic
  - Functional bias voltage: 580 VDC Stax Pro Bias
  - Electrostatic capacitance: 100 pF (including cable)
  - Diaphragm type: Ultra-thin polyimide film with infused carbon nanotubes
  - Diaphragm management: SLAM Technology for earcup pressure relief and bass enhancement
  - Transducer size: 120mm x 90mm
  - Frequency response: 10Hz - 40kHz
  - Maximum SPL: >120dB
  - THD: <0.1% @ 90dB
  - Sensitivity: 100dB, 1KHz, 100V RMS
  - Attached cable: 2.5m OCC monocrystal copper, 5-pin Pro Bias
  - Housing: Magnesium, stainless steel, and polymer acetate
  - Earpad material: Premium leather
  - Headband: Carbon fiber and premium leather
  - Weight: 480g
