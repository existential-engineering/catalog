url: https://www.ibanez.com/usa/products/detail/admini_01.html
description: Made in Japan analog delay mini-pedal with Repeat, Delay time, and
  Blend controls. Delivers warm tone with 100% analog circuitry and true bypass
  switching in a compact pedalboard-friendly housing.
details: |-
  The mini-pedal market has been booming the past few several years, so we felt the time was right to issue some of our most legendary pedals in new mini housings! Made in Japan, the ADMINI features two smaller knobs for Repeat and Blend, and a significantly larger Delay time knob in the middle.

  True bypass switching provides the shortest, most direct signal path as well as the cleanest tone. The 100% analog circuitry delivers warm, classic analog delay tones.
specs: |-
  - Controls: Repeat, Delay time, Blend
  - True Bypass
  - Delay Time: 20ms - 600ms
  - Required Current: 23mA@9V
  - Power Supply: External 9V DC center-negative adapter
  - 100% Analog circuitry
  - Input on right side; Output on left side
  - Made in Japan
