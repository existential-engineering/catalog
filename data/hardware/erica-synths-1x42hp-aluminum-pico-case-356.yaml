details: |-
  The 1x42HP Aluminum Pico Case is a full aluminium single row eurorack skiff, 42HP wide and 40mm deep, with aluminium rails of a design particular to Erica Synths.

  The case has an integrated Erica Synths PSU rated at 2.5A total for the installed modules, and a 12V 3A 100 to 240VAC desktop supply is included, so the only external connection it needs is that supply's DC lead.

  As standard the 40mm deep enclosures come with horizontal wooden side panels in black and one distribution board with 14 connector sockets, which is what the installed modules take their power from.
specs: |-
  - 42HP single row eurorack skiff enclosure
  - 40mm case depth
  - Full aluminium construction with aluminium rails
  - Integrated Erica Synths PSU, 2.5A total
  - 12V 3A 100 to 240VAC desktop PSU included
  - One distribution board with 14 connector sockets
  - Horizontal wooden side panels in black as standard
