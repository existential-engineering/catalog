details: |-
  An exciting new addition to the Streamliner Collection, the G2215-P90 Streamliner Junior Jet Club is a stylish workhorse that's ready to brawl. It pairs a Broad'Tron BT-2S bridge humbucker with a P90 Soap Bar neck pickup, delivering tight lows with a throaty midrange.

  Build details include a solid bound nato body, mahogany-stained nato neck with thin 'U' profile, laurel fingerboard with pearloid Neo-Classic thumbnail inlays, and 22 medium jumbo frets. Hardware includes an anchored compensated wrap-around bridge with nickel finish.
