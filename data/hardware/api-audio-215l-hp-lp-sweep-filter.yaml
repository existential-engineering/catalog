url: https://apiaudio.com/product/215l-hp-lp-sweep-filter/
description: Passive, sweepable HP/LP filter module for the API 200 Series
  console format. Features 6 dB/octave low-pass and 12 dB/octave high-pass using
  discrete transistor buffers with API 2510 and 2520 op-amps and
  transformer-coupled balanced output.
details: |-
  Passive sweepable HP/LP filter module in API 200 Series format.
  Compatible with Legacy, Legacy Plus, and Vision Series Consoles, and the L200
  Rack. Uses API 2510 and 2520 op-amps. Includes hard-wire bypass switch.
specs: |-
  - Filter Type: Passive Sweepable (2 bands)
  - Low Pass Range: 500 Hz–20 kHz (6 dB/octave)
  - High Pass Range: 20 Hz–600 Hz (12 dB/octave)
  - Input Impedance: >20 kΩ (balanced)
  - Output Impedance: 85Ω (transformer-coupled, balanced)
  - Frequency Response: 0, -0.3 dB from 30–20 kHz
  - THD: 0.02% (+4 dBu @ 2 kHz)
  - Noise: 98 dB below +10 dBm
  - Max Output: +28 dBu
  - Power: ±16V DC, 60mA max
  - Dimensions: 1.25″ × 2.65″ × 6.75" deep
  - Weight: 0.51 lb
