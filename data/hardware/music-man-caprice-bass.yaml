description: >-
  The Caprice — part of Music Man's Modern Classic line — is a passive 4-string
  bass capable of blending two distinct pickup voicings, with a compact offset
  body, slim neck, top-loading hardened steel bridge, and oversized headstock
  with 3+1 tuner arrangement.
details: |-
  The Caprice is a Modern Classic family bass that makes a bold statement in passive design. It is a workhorse bass capable of blending two distinct pickup voicings, offering a variety of tones suitable for any musical environment.

  The compact offset body design is balanced and comfortable, paired with a slim neck profile that makes it a pleasure to play. The top-loading bridge is constructed from hardened steel and complemented by a newly designed oversized headstock featuring the familiar Music Man 3+1 tuner arrangement.

  As with the Cutlass, the Caprice is a sleek modern bass with vintage features that stays true to its Music Man heritage. Highlights include passive electronics, two distinct pickup voicings, and the oversized headstock.
specs: |-
  - Body wood: Alder (Ash on Classic Natural)
  - Body finish: High gloss polyester
  - Available colors: Black, Ivory White, Diamond Blue, Heritage Tobacco Burst
  - Body dimensions: 12-11/16" wide, 1-5/8" thick, 45-9/16" long
  - Neck wood: Select maple
  - Neck width: 1-1/2" at nut, 2-1/2" at last fret
  - Neck radius: 7.5"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Select maple or rosewood
  - Frets: 21 high-profile, narrow-width
  - Headstock length: 9" (3+1 tuner arrangement)
  - Scale length: 34"
  - Pickups: Music Man inline humbucking; Music Man offset humbucking
  - Electronics: Passive — 250k neck volume, 250k bridge volume, tone with 0.1µF cap
  - Bridge: Vintage Music Man top-loaded chrome-plated steel with nickel-plated hollow steel saddles
  - Tuning machines: Schaller BM with tapered string posts
  - Pickguard options: Shell (Tobacco Burst); Parchment (Diamond Blue); Black (Black); Mint (White)
  - Strings: 45w-65w-80w-100w (Super Slinky Bass #2834)
