details: |-
  The world's greatest hollow body guitars just got even better. Designed for the working professional, our all-new Players Edition Hollow Body instruments feature authentic Gretsch sound and style while incorporating cutting-edge features for maximum power, comfort and versatility.

  This left-handed Falcon pairs a 2.5"-deep laminated maple body with ML bracing for substantial hollow-body resonance. New FT-67 Filter'Tron humbucking pickups capture authentic vintage Gretsch voicing with a more well-rounded tone, feeding a flexible control layout: separate neck and bridge volumes, a master volume with treble bleed circuit, and a no-load master tone for infinite tonal variations.

  A String-Thru Bigsby B6GP tailpiece, Adjusto-Matic bridge on a pinned ebony base, Grover Imperial locking tuners and gold hardware throughout round out the package, which ships in a G6242L Gretsch 17" deluxe hollow body hardshell case.
