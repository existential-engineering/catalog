description: >-
  The Korg DDM-110 Super Drums is a budget digital drum machine released in 1985 featuring
  8-bit sampled drum sounds at 15.6kHz. Designed as an affordable practice tool, it offers
  basic pattern and song sequencing with a deliberately simple interface. Its lo-fi sonic
  character has made it a niche choice for producers seeking intentionally retro or
  crunchy drum textures.
details: |-
  Released in 1985 alongside its companion the DDM-220 Super Percussion, the Korg DDM-110 was positioned as a budget-friendly digital drum machine targeting practicing musicians who needed basic rhythmic accompaniment. Korg engineered both units with simplicity and affordability as primary design goals, making them accessible entry-level instruments rather than professional recording tools.

    The sonic character of the DDM-110 is distinctly lo-fi, driven by its 8-bit sampled drum sounds recorded at a 15.6kHz sample rate. The nine onboard sounds — kick, snare, low tom, hi tom, rimshot, handclap, cymbal, open hi-hat, and closed hi-hat — have a thin, crunchy quality that is characteristic of early digital sampling technology. Each sound includes an individual accent control for basic dynamics.

    The interface is deliberately minimal, featuring just 10 buttons for sound selection and tempo adjustment. The unit can store 32 patterns and 6 complete songs, allowing for basic song assembly. External synchronization is limited to 5-pin DIN sync with no MIDI capability, which restricts its integration with modern setups. In contemporary production, the DDM-110 has found a niche among producers looking for authentically lo-fi and vintage digital drum sounds.
specs: |-
  - 8-voice polyphony
    - 9 sampled drum sounds (8-bit, 15.6kHz sample rate)
    - Sounds: Kick, Snare, Low Tom, Hi Tom, Rimshot, Handclap, Cymbal, Open Hi-Hat, Closed Hi-Hat
    - Individual accent control per sound
    - 32 pattern storage
    - 6 song storage
    - 10-button interface
    - 5-pin DIN Sync (no MIDI)
    - Tempo control
