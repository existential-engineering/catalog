description: >-
  The Hammond 102200 is a rare monophonic preset synthesizer released around 1974-75 by
  Hammond Japan, designed as a companion keyboard to sit atop Hammond organs or pianos. It
  features six instrument presets and an innovative patch matrix system that allows over
  300 tonal combinations, making synthesized sounds accessible to organists without deep
  technical knowledge.
details: |-
  Released around 1974-1975 by Hammond Japan, the 102200 Preset Synth was designed as a companion instrument to sit on top of a Hammond organ or piano. It occupies a similar market position to the ARP Pro-Soloist, Moog Satellite, and Roland SH-1000 as a simple but characterful monophonic synthesizer aimed at keyboard players looking to add synth sounds to their setup.

  The instrument offers six factory presets: French Horn, Tuba, Violin, Sax, Clarinet, and Solar Echo. What makes it particularly interesting is its patch matrix, divided into six control categories: Tone Pitch, Tone Filter, Filter Rise and Fall, Attack and Decay, Pitch Bend, and Modulation. This graphical interface shows the effect of each button selection, allowing even non-technical players to create synthesizer-like sounds and yielding over 300 possible tonal combinations.

  Square and triangle waves are available at 32', 16', and 8' settings, while a sawtooth wave is offered only at 4'. A filter-modulatable noise source adds further sonic possibilities. The 44-key keyboard makes it compact and practical as a secondary instrument.

  The 102200 is extremely rare, with an estimated production run of only about 200 units. Most were likely discarded over the decades, making surviving examples highly collectible curiosities from Hammond's brief foray into the synthesizer world.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1
  - Waveforms: Square (32', 16', 8'), Triangle (32', 16', 8'), Sawtooth (4')
  - LFO: 1
  - Filter: Yes
  - VCA: Attack/Release envelope
  - Effects: None
  - Keyboard: 44 keys
  - Memory: 6 presets (French Horn, Tuba, Sax, Violin, Clarinet, Solar Echo)
  - Control: Patch matrix
