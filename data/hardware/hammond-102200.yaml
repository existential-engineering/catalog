description: >-
  The Hammond 102200 is a rare single-oscillator preset synthesizer from 1974 designed to complement
  Hammond organs, featuring a unique patch matrix that allows over 300 tonal combinations.
details: |-
  Released around 1974-1975 by Hammond Japan, the 102200 Preset Synth was designed as a companion instrument to sit on top of a Hammond organ or piano. It occupies a similar space to the ARP Pro-Soloist, Moog Satellite, and Roland SH-1000 as a simple but characterful monophonic synthesizer.

  The instrument offers six presets: French Horn, Tuba, Violin, Sax, Clarinet, and Solar Echo. What makes it particularly interesting is its patch matrix, which allows even non-technical players to create synthesizer-like sounds by selecting buttons alongside graphics showing what each button does to the sound. The matrix covers tone pitch, tone filter, filter rise and fall, attack and decay, pitch bend, and modulation, yielding over 300 possible combinations.

  Square and triangle waves are available at 32', 16', and 8' settings, while a sawtooth wave is offered only at 4'. A filter-modulatable noise source adds further sonic possibilities. The 44-key keyboard makes it compact and practical as a secondary instrument.

  The 102200 is extremely rare, with an estimated production run of only about 200 units. Most were likely discarded over the decades, making surviving examples highly collectible curiosities from Hammond's brief foray into the synthesizer world.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1
  - Waveforms: Square (32', 16', 8'), Triangle (32', 16', 8'), Sawtooth (4')
  - LFO: 1
  - Filter: Yes
  - VCA: Attack/Release envelope
  - Effects: None
  - Keyboard: 44 keys
  - Memory: 6 presets (French Horn, Tuba, Sax, Violin, Clarinet, Solar Echo)
  - Control: None
