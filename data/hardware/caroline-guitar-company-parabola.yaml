description: >-
  The Parabola is a transistor-based tremolo pedal featuring two modulation
  modes — classic amplitude modulation (AM) and filtered modulation (FM) — with
  pre and post effect gain stages for added overdrive and volume control.
details: |-
  The Parabola is Caroline Guitar Company's solid state tremolo pedal, described
  as 'the sonic equivalent of riding your space mammoth through giant puddles in
  the astral plane while feeding it caffeinated energy drinks.'

  At its core is a transistor-based LFO with technology adapted from vintage
  German equipment, giving it a distinctive waveform character not found in
  typical digital tremolo designs.

  The pedal offers two modulation modes: AM (amplitude modulation) for classic
  tremolo tones, and FM (filtered modulation) for a more textured, filter-sweep
  character.

  Pre and post effect gain stages allow players to push the pedal into overdrive
  before the tremolo effect or boost the output level after it, adding
  significant tonal flexibility.

  The Parabola is handmade in small batches in Columbia, South Carolina, and is
  available in Standard and Pawnshop variants.
specs: |-
  - Two modulation modes: AM (amplitude modulation) and FM (filtered modulation)
  - Transistor-based LFO adapted from vintage German circuit designs
  - Pre-effect gain stage for overdrive
  - Post-effect gain stage for volume boost
  - Adjustable speed and depth controls
  - Available in Standard and Pawnshop variants
  - Handmade in Columbia, South Carolina
