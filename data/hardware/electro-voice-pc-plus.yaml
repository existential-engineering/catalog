description: The PolarChoice PC Plus is a miniature multi-pattern gooseneck
  podium microphone that brings desktop-mic functionality to the unobtrusive
  form factor of an XLR-mounted gooseneck. A dual back-electret condenser
  capsule offers four user-selectable polar patterns - omnidirectional,
  cardioid, supercardioid, and hypercardioid - making the mic adaptable to
  lecterns, conference tables, boardrooms, houses of worship, and broadcast
  applications. Integrated RF shielding rejects GSM and other RFI sources, a
  switchable high-pass filter tames podium vibration noise, and a configurable
  push-button switch with status LED supports push-to-talk, push-to-mute, or
  on/off control. Available as XLR-mount or flush-mount in 12-inch (305 mm) and
  18-inch (457 mm) gooseneck lengths with a low-reflectance black finish.
  Phantom-powered (12-52 VDC) with 5.6 mV/Pa sensitivity, >127 dB SPL clipping
  level, and a 50 Hz - 20 kHz response.
details: >-
  Miniature multi-pattern gooseneck podium microphone


  Dual back-electret condenser capsule with four switchable polar patterns:
  omnidirectional, cardioid, supercardioid, hypercardioid


  RF Shield provides superior RFI/GSM rejection for broadcast and conference use


  Configurable push-button switch with status LED (push-to-talk / mute / on-off)


  Switchable high-pass filter reduces podium and structural vibration noise


  Available as XLR-mounted or flush-mounted


  12-inch (305 mm) and 18-inch (457 mm) gooseneck length options


  Frequency response 50 Hz - 20,000 Hz


  Clipping level greater than 127 dB SPL


  Phantom powered, 12-52 VDC (<5 mA at P48)


  Non-reflecting black finish for low visual impact on stage and podium
specs: >-
  - elementType: Dual condenser, back-electret

  - polarPatterns: Omnidirectional, Cardioid, Supercardioid, Hypercardioid

  - frequencyResponse: 50 Hz - 20,000 Hz

  - sensitivity: 5.6 mV/Pa (1 kHz)

  - clippingLevel: >127 dB SPL

  - equivalentNoise: <26 dB SPL A-weighted

  - dynamicRange: >101 dB

  - outputImpedance: 200 ohms at 1 kHz

  - powerRequirement: Phantom, 12-52 VDC

  - currentConsumption: <5 mA with P48 supply

  - polarity: Pin 2 positive, referenced to Pin 3

  - connector: 3-pin XLR (or flush-mount option)

  - gooseneckLength: 305 mm (PC Plus-12) / 457 mm (PC Plus-18)

  - headDiameter: 14.6 mm (max)

  - gooseneckDiameter: 7.9 mm (lower) / 6.4 mm (upper)

  - weight: 201 g (PC Plus-12) / 210 g (PC Plus-18)

  - finish: Non-reflecting black

  - included: Windscreen, two-piece shock mount, flush mount parts kit

  - optionalAccessories: FMK flange-mount kit, WS-PC1 large windscreen, CPSM
  shock-mount kit
