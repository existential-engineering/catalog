details: |-
  Featured worldwide in popular music of all styles, the ukulele has experienced a phenomenal resurgence in recent years. At the request of Gretsch fans, we reintroduced a selection of our classic uke best sellers offering unparalleled tone and quality at sensational low prices.

  The G9121 A.C.E Tenor Ukulele features a Fishman Kula pickup with preamp, mahogany top, back and sides, one-piece mahogany neck and 19-fret ovangkol fingerboard with "snowflake" position markers. The G9121 also comes with an ovangkol bridge, bone nut and saddle, Grover 9NB Sta-Tite geared tuners, Aquila Nylgut strings and deluxe fitted gig bag. The G9121 A.C.E. is available in Honey Mahogany Stain with an "open pore" semi-gloss finish.
