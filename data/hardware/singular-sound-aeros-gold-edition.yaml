details: |-
  The Aeros Gold Edition is a powerful looper pedal designed to fuel creativity and live performance. With parallel and sequential looping, auto-quantize, and Intelligent End-of-Measure Forgiveness, it makes complex looping effortless. Features like silent footswitches, hands-free navigation, and Mixer Mode give you total control. Record up to 20 minutes per track with studio-grade 24-bit audio, import your own backing tracks, and explore built-in effects like reverse, fade, and loop decay.
