description: >-
  The Roland TR-66, released in 1973, is one of the earliest drum machines from Roland and a
  precursor to the more famous CR-line of CompuRhythm machines. It functions as a rhythm arranger
  featuring 11 pure analog sounds and 27 preset patterns spanning rock, swing, march, and dance
  styles. Notable users include Depeche Mode and Roxy Music.
details: |-
  The TR-66 is a rhythm arranger rather than a traditional drum machine. It contains 18 drum patterns with kick, snare, and hi-hat sounds arranged across rock, swing, march, and dance styles. Users can combine these with 9 stylized rhythm patterns including Waltz, Cha-Cha, Bossa Nova, and Rhumba. Multiple rhythm buttons can be pressed simultaneously for unique combinations, yielding literally hundreds of possible rhythm arrangements.

  All 11 sounds are pure analog with a soft and warm sound quality reminiscent of what was later found in the CR-series. Sound options include kick, snare, hi-hat, conga, bongos, claves, maracas, cowbell, rim shot, and cymbal. The only sound editing control is a Balance knob functioning as an overall tone control.

  Modern usage typically involves sampling the device since the inability to synchronize it means that if anybody wants to use its rhythm arrangements, the strategy is often to sample it and work with the sampled loops inside a DAW.
specs: |-
  - Polyphony: 6 voices
  - Sounds: 11 total (kick, snare, rim shot, claves, hi-hat, cymbal, conga, bongos, cowbell, maracas)
  - Patterns: 27 total (18 drum patterns, 9 rhythm patterns)
  - Tempo Range: 50 to 200 bpm
  - Controls: Tempo knob and balance control
  - Connectivity: Start Switch trigger input only (no synchronization capability)
  - Weight: 8.8 pounds (4 kg)
releaseDate: "1973"
