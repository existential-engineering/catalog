details: |-
  The Pico DRUM programmer is the interface needed to upload user drum samples to the Pico DRUM module and to upgrade the firmware of several Erica Synths modules.

  Erica Synths supplies a Pico drum programmer application for Windows and for macOS on both Apple silicon and Intel machines, alongside a standalone firmware upgrader for Windows and macOS. Google Chrome plug-ins are offered as an alternative route for both the firmware updater and the Pico Drums sample uploader.

  The programmer connects over mini USB and the cable is not included. Where the connection does not come up, Erica Synths directs users to install the VCP drivers for the Pico Programmer.
