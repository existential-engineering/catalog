details: |-
  The Dellinger-JSM-V2-LTD Vintage Blue is a limited edition evolution of the Caparison Dellinger‑JSM‑V2 Joel Stroetzel Signature, developed with Joel Stroetzel of Killswitch Engage . While the original model blends classic styling with modern performance, this limited edition version leans further into a refined vintage aesthetic without sacrificing the power and versatility of the JSM platform. A semi-matte Vintage Blue finish sets the tone, paired with a tortoiseshell pickguard and matching truss rod cover for a distinctive, classic-inspired look. In contrast to the maple fingerboard of the original model, the limited edition version features a rosewood fretboard , adding warmth and depth to the instrument's tone while retaining Caparison's signature Clock inlays and highly visible Luminlay side dots. Beneath its vintage-inspired appearance lies the same performance-driven core that defines the JSM-V2. A Fishman Killswitch Engage signature bridge pickup delivers tight, aggressive high-gain tones, while the Fishman SSA single-coil neck pickup provides articulate clarity for cleaner passages. Push-pull controls unlock Fishman's Voice 2 passive-style voicing and a bridge coil-tap for expanded tonal flexibility. The proven WB body construction —walnut top with an Australian Blackwood back—remains unchanged, delivering wide frequency response and clear low-mid fundamentals. A five-piece walnut/maple neck, stainless-steel frets, the Caparison Fixed Bridge6, and Gotoh MG-T locking tuners ensure stability, precision, and reliability across a wide range of tunings and string gauges. Vintage attitude. Modern precision. "The Dellinger-JSM-V2 is a dream guitar of mine that the wonderful folks at Caparison guitars brought to life! This limited edition model is a tribute to some of my favorite old school color schemes… it will provide the same crushing metal and rock tones, as well as all the vintage crunch and twang one could hope for. A truly versatile and wonderful instrument! Many thanks to Itaru, Gabriel, and everyone at Caparison for making his happen!" - Joel Stroetzel
