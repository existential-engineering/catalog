description: An upgrade kit that replaces the electronics modules in earlier
  Buchardt active speakers with the latest amplifier, DSP, connectivity and
  room-correction platform, and includes the RFA19 tweeter for selected models.
details: |-
  Some projects take longer than expected. This is one of them. For a long time, we have wanted to make it possible for owners of our earlier active speakers to upgrade to our newest electronics platform without having to replace the speakers they already love. It has required far more development than we initially imagined, but we never wanted to release anything until we felt it was genuinely worth doing. We're happy to finally introduce the MK2 Upgrade Kits. The MK2 Upgrade Kits bring our latest amplifier platform, DSP, connectivity, and room-correction technology to previous generations of Buchardt active speakers, while selected models also benefit from our latest RFA19 tweeter. The upgrade is designed for straightforward installation at home using standard tools. One kit is for a set of speakers. *Shipping starts in October. Once mounted, the parts can't be returned for a refund.
