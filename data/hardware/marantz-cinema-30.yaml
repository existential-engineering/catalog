name: Cinema 30
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/av-receivers/cinema-30/300796.html
description: The Cinema 30 is the most refined AV receiver Marantz has ever
  created, redefining premium home theater sound. It delivers 11.4 channels
  capable of powering large-scale home theaters, incorporating discrete HDAM
  SA-2 circuitry, dual-DAC digital-to-analog conversion, and a monolithic
  symmetrical amplifier. Crafted in Shirakawa, Japan, the Cinema 30 features 7
  HDMI inputs with 8K capability, Dolby Atmos, DTS:X Pro, IMAX Enhanced, Auro
  3D, Audyssey MultEQ XT32 room correction with Dirac Live upgradability, and
  integrated HEOS multi-room streaming.
details: |-
  Reference 11.4 channel AV receiver powered by HEOS with Dolby Atmos, 140W per channel, 8K capability, and 7 HDMI inputs. Features Class A/B topology with current feedback, discrete HDAM SA-2 circuitry, dual-DAC digital-to-analog conversion, monolithic symmetrical amplifier, copper-plated chassis, and toroidal power supply. Supports Dolby TrueHD, Dolby Atmos, Dolby Atmos Music, Dolby Surround, DTS HD Master, DTS:X, DTS:X Pro, DTS Neural:X, DTS Virtual:X, IMAX Enhanced, and Auro 3D. Includes Audyssey MultEQ XT32 room correction with Dynamic EQ/Volume and LFC, plus upgradability to Dirac Live. Connectivity includes Ethernet, Wi-Fi, Bluetooth with re-transmit for headphones, AirPlay 2, Alexa, Google Assistant, and Apple HomePod voice support. Streaming services include Spotify Connect, TIDAL, Amazon Music HD, Pandora, Deezer, TuneIn, and Qobuz. Supports FLAC, WAV, ALAC up to 192kHz/24-bit, DSD 2.8MHz/5.6MHz, and gapless playback. Crafted in Shirakawa, Japan with a 5-year warranty.
specs: |-
  - 11 powered channels (13.4 max processing channels)
  - Power output: 140W (8 ohm, 20Hz-20kHz, 0.05% 2ch)
  - Power output: 175W (6 ohm, 1kHz, 0.7% 2ch)
  - Power output: 250W (6 ohm, 1kHz, 10% 1ch)
  - Class A/B topology with current feedback
  - Discrete power amplifier with bi-amp drive capability
  - Discrete HDAM SA-2 circuitry
  - Dual-DAC digital-to-analog conversion
  - Monolithic symmetrical amplifier
  - Copper-plated chassis
  - Toroidal power supply
  - Gold-plated RCA terminals
  - Pure Direct mode
  - Clock jitter reducer
  - Dolby TrueHD, Dolby Atmos, Dolby Atmos Height Virtualization, Dolby Atmos Music, Dolby Surround
  - DTS HD Master, DTS:X, DTS:X Pro, DTS Neural:X, DTS Virtual:X
  - IMAX Enhanced and Auro 3D support
  - Audyssey MultEQ XT32 room correction
  - Audyssey Dynamic EQ, Dynamic Volume, and LFC
  - Dirac Live upgradability
  - 7 HDMI inputs (all 8K-capable)
  - 3 HDMI outputs (main/zone 2/1)
  - HDCP 2.3, 8K/60Hz and 4K/120Hz pass-through
  - eARC/ARC, ALLM and VRR pass-through
  - Ethernet, Wi-Fi, and Bluetooth (with headphone re-transmit)
  - HEOS multi-room integrated
  - Voice assistant support: Alexa, Google, Apple HomePod
  - Streaming: Spotify Connect, TIDAL, Amazon Music HD, Pandora, Deezer, TuneIn, Qobuz
  - Lossless playback: FLAC, WAV, ALAC up to 192kHz/24-bit
  - DSD playback: 2.8MHz/5.6MHz
  - Gapless playback for FLAC, WAV, ALAC, DSD
  - AM/FM tuner
  - 3 multi-zone outputs
  - 2-line FLD + OLED porthole front display
  - Available in Black and Silver-Gold
  - Weight: 42.8 lbs
  - Dimensions (without antenna): 17.4"W x 17.6"D x 7.5"H
  - Power consumption: 780W (full), 110W (ECO off), 65W (ECO on), 0.2W standby
