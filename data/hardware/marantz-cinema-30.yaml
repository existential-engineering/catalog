description: CINEMA 30 is the most refined AV Receiver Marantz has created and
  redefines premium home theater sound. Engineered with proprietary technology
  optimized from decades of rich heritage, its 11.4 channels deliver unrivaled
  performance and can power even large-scale home theaters with ease.
details: |-
  CINEMA 30 is the most refined AV receiver Marantz has ever created, redefining premium home theater sound. Engineered with proprietary technology optimized from decades of rich heritage, its 11.4 channels deliver unrivaled performance and can power even large-scale home theaters with ease.

  Discrete HDAM SA-2 circuitry, dual-DAC digital-to-analog conversion and a monolithic symmetrical amplifier stage sit behind eleven powered channels rated at 140 W each into 8 ohms, with 13.4 channels of processing available on the pre-outs.

  CINEMA 30 is crafted in Japan with authentic materials in a modern style. HiFi performance technologies such as HDAM SA-2 lift it to performance levels seldom found in an AV receiver.

  Seven HDMI inputs, plus digital, analog and phono inputs, and even analog video, loudspeaker and pre-amp outputs, ensure connectivity to virtually any components in a system. Thirteen speaker terminals allow flexible assignment across surround, surround back, height and front wide positions.

  Calibration and tuning tools include Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC, with Dirac Live support, variable crossover, optimized bass redirection and bass sync.
specs: |-
  - 11 powered channels, 140 W per channel (8 ohm, 20 Hz - 20 kHz, 0.05% THD, 2ch driven)
  - 175 W per channel (6 ohm, 1 kHz, 0.7% THD, 2ch driven), 250 W (6 ohm, 1 kHz, 10% THD, 1ch driven)
  - 13.4 processing channels with 13.4-channel pre-out and four independent subwoofer outputs
  - Class A/B discrete power amplifier with current feedback topology, assignable bi-amp drive
  - Thirteen speaker terminals, 4-16 ohm impedance
  - Seven 8K HDMI inputs and three HDMI outputs (ARC and eARC), HDCP 2.3, up to 40 Gbps
  - Dolby Atmos, Dolby Atmos Music, Dolby Surround, DTS-HD Master, DTS:X, DTS:X Pro, DTS Neural:X, DTS Virtual:X, Auro-3D, IMAX Enhanced
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - Dirac Live support
  - Copper-plated chassis, toroidal power transformer, HDAM modules, gold-plated RCA terminals
  - HEOS built-in, AirPlay 2, Spotify Connect, Roon tested, Bluetooth with headphone retransmit
  - Three multi-room zones, 3 DC triggers, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 780 W, standby 0.2 W, weight 42.8 lbs.
