description: >-
  The Wave Cannon Zero delivers late 1970s–early 80s big-amp distortion sounds
  and is described as the final form of the pedal that started it all for
  Caroline Guitar Company, featuring a refined shape control, voltage control
  for starved textures, and an expanded HAVOC with its own tuning and feedback
  mixing.
details: |-
  WAVE CANNON 'Zero' is both a throwback to one of Caroline Guitar Company's
  very first unreleased prototypes and the culmination of decades of playing,
  repairing, modifying, and building circuits. It can be wild, it can be mild,
  it can tear your head off, it can be warm like your granny's gravy, or as
  nasty as you want to be.

  Circuitwise, it shares a lineage with the original Wave Cannon v1 released in
  2010, but functionally and sonically it takes things a lot further than
  previous releases. Where you take it is up to you — making things dirty is
  just the start.

  The shape control has been refined to allow for more depth in low and medium
  gain sounds. The voltage control has been introduced to let users get starved
  and broken textures. The HAVOC control has been exploded — it has its own
  control for tuning and mixing the feedback signal.

  The HAVOC can now function both as the first thing your guitar sees OR later
  in the signal chain. Thanks to a collaboration with John Snyder at Electronic
  Audio Experiments, it can be momentary or latching.

  While it can and will distort your signal, it is no mere distortion.
  Available in Standard and Silicon Zero versions.
specs: |-
  - Weight: 18 oz
  - Dimensions: 2 × 6 × 4 inches
  - Versions: Standard, Silicon Zero
  - HAVOC control with dedicated tuning and feedback signal mixing
  - Voltage control for starved and broken textures
  - Refined shape control for improved depth in low and medium gain applications
  - Dual signal chain placement capability (first in chain or later)
  - Momentary or latching HAVOC operation modes
