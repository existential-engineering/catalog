description: The LA-76 is a Classic 70's Optical Character Compressor for Silver Bullet mk2, created in collaboration between AudioScape and Louder Than Liftoff. It combines an enhanced LA-4-style optical compressor topology with the 1176's all-discrete, push-pull topology line amp, delivering stereo optical compression with vintage character.
details: |-
  Stereo optical compressor drawing from classic LA-4 and 1176 Rev. F circuits. Features a Vactrol gain reduction element for classic optical response. Selectable ratios of 2:1, 4:1, 8:1, and 20:1 cover gentle glue through aggressive limiting. Selectable stereo link for dual-channel operation. Built with high-quality silver can transistors, vintage carbon film resistors, and era-correct 2n6716 power transistors. Premium passive components from Nichicon, Panasonic, Vishay, Susumu, Wima, and TI. Audio resistors are 0.5% or 0.1% thin-film types. RoHS compliant PCBs with high-temperature Tg 170 material. Handcrafted in USA in small batches. Compatible with Silver Bullet mk2 only.
