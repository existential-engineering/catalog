details: |-
  Building on KRK's legacy of sonic accuracy and performance, the KRK CLASSIC 7 powered studio monitors incorporate over 30 years of innovation. Borrowing concepts from previous ROKIT lines, the CLASSIC 7 defaults to a flat frequency response aimed at critical listening, for more accurate mixes. With the optional ability to engage the +2 dB KRK Bass Boost, the CLASSIC 7 can also provide an enhanced bass response.

  The CLASSIC 7 is an active (self-powered) two-way studio monitor that uses a 1-inch textile soft dome tweeter paired with a 7-inch glass aramid woofer. The built-in power amplifiers provide a total of 73 watts of power, with a 48 watt amp driving the woofer and a 25 watt amp for the tweeter.
