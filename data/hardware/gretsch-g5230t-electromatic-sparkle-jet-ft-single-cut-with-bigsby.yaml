  No nonsense, Electromatic Jet FT models are the perfect real, pure and powerful Gretsch instruments. They're your next-step Gretsch - bold, dynamic and articulate, and crafted with essential Gretsch sound, style and playability.

  Pure Jet Power - Since 1953 the Gretsch Jet has been the hallmark sound for iconic players. The G5230T Electromatic Sparkle Jet FT captures that essential Jet power and fidelity at an incredible price.

  Chambered Mahogany Bodies - Loud and Clear - Classic Jet tone begins with a chambered mahogany body with maple top that produces full lows and mids with an exceptionally smooth and present high end.
