description: A Stereo 5-Band Digital EQ and Morphing Filter module for Eurorack
  modular synthesizers, used to cut problem frequencies or enhance the stereo
  field with morphable presets.
details: |-
  The mix surgeon's best friend is now a powerful effect in your eurorack system. SCLPL (pronounced SCALPEL) is a Stereo 5-Band Digital EQ / Morphing Filter module for eurorack modular synthesizers. Use it to cut out problem frequencies on voices in your mix or to add pleasing enhancements to your stereo field. Dual Mono and Stereo Control Schemes make it an excellent addition to any WMD Performance Mixer Setup. Add 4 SCLPL for 8 channels of EQ in 16HP. Put a 5th on the Master Bus and you have the ultimate eurorack mixing setup! A simple user interface makes it a powerful tool for many use cases. It features 9 user-programmable preset slots that can then be "morphed" between seamlessly with CV or the Level knob in Morph Mode. Each frequency band is set independently with the Level, Q, and Frequency knobs, and a helpful LED display aids in knowing exactly what's going on at all times. Frequency bands include a Low Shelf, 3 Mid-Range Peaking Bands, and a High Shelf.
specs: |-
  - 5 band EQ / Morphing Filter
  - Simple and Easy-to-Program interface
  - "trim" level adjustment for each preset
  - Visual LED representation of the current status of each filter
  - Each mid-range band can go from a broad cut, to a resonant peak
  - Low and High Frequency Shelving
  - 9 user-programmable presets (18 in dual Mono)
  - Low Noise Digital Audio Signal Path
  - "Morphing" for unique filter sounds that you create!
  - Mono, Dual Mono, and Stereo Functionality
  - Bypass Switch for reference of wet vs dry
  - Band Soloing for precision tuning
