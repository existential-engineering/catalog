description: A Eurorack module offering two clipping and frequency doubling
  sections that process a video-rate signal. One output clips signal below
  mid-grey to accentuate bright portions, another clips above mid-grey to
  accentuate dark portions, and a third produces a solarization or
  frequency-doubling effect.
details: |-
  Dual RECTIFIER offers two clipping and frequency doubling sections. The first output clips inputs below mid-grey and accentuates the bright portions of the signal. The second output clips signals above mid-grey and accentuates the darker portions of the signal. The third output gives a single stage solarization or frequency doubling effect. The third output of the first section is normalled into the section input's section for more variations of one signal. Putting a signal into the top input and taking the bottom output will give you a twice frequency doubled output.
