details: |-
  BLEEDING HEARTS EURORACK MODULE

  (Random Sequencer, Rhythm Generator, Destroyer, and Filter)

  The Bleeding Hearts is a device that starves, bit crushes, splatters, and filters audio sources like no other. Feeding a gate signal to the Bleeding Hearts enables a whole new world of strange and random analog-generated movement. Each position of the 8-step sequencer can bleed into each other and interact with the destruction effect, creating gated and filtered splatters, glitches, and crunches that move to the beat of your patch. Designed and assembled in Seattle, Washington. 20hp, 42mm deep. Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
