details: |-
  The 4104 Commentator's Noise Cancelling Ribbon Microphone is of British Broadcasting
  (BBC) design and used for reproducing high quality commentary speech from noisy
  surroundings by cancelling out a considerable degree of background noise. The 4104
  has a proven reliable performance capability, having been used since its introduction
  by broadcasting networks including the BBC, IBA, CBS, and ABC.

  The 4104 is not unduly affected by wind noise and can be used in air stream velocities
  up to 20 mph (32 km) without notable difference in speech quality. With the use of a
  simple windshield attachment, good quality speech reproduction can also be achieved in
  winds ranging up to 40 mph (64 km) or more.

  The bi-directional polar response allows one or more commentators to work closely
  side by side without interference from mutual cross-talk. Example applications include
  sports reporting, news broadcasting, and noisy industrial environments. The 4104 is
  also available with an optional push-to-talk switch.
specs: |-
  - Noise-cancelling ribbon microphone of BBC design
  - Bi-directional (figure-8) polar response
  - Wind resistant: effective up to 20 mph (32 km) without windshield
  - Wind resistant: effective up to 40+ mph (64 km) with optional windshield
  - Optional push-to-talk switch available
  - Proven reliability with major broadcasters: BBC, IBA, CBS, ABC
