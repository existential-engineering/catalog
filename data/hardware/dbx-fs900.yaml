description: 900 Series flanger module for the dbx 900 modular signal processing system.
details: |-
  The dbx FS900 is a flanger module designed for the dbx 900 Series modular rack system. It provides flanging modulation effects for signal processing applications.

  As part of the 900 Series, the FS900 fits into a dbx 900 host chassis alongside other 900 Series modules for a fully customizable signal processing rack.

  Note: This product is discontinued.
