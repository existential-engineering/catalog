details: |-
  The new Wide•5 of Fender Avenue is the biggest thing since Leo's L•2000 hit back in '81. G&L calls it the L•2500 Series 750 and it packs everything that makes the L•2000 and L•2500 icons. So what's new? The Series 750 is a fiver with a full 3/4-inch string spacing at the bridge, just like Leo's four-string basses, which is why it is called a Wide•5.

  After all, it's in the name: Leo's four-strings have "three-quarter-inch" string spacing, so that is 3/4" > 0.750" > 19.03mm. When someone says a five-string has "nineteen millimeter" string spacing, that's just a metric conversion of Leo's original four-string spec, so on Fender Avenue it has to be "Seven-Fifty." The CLF Research L•2500 and other G&L fivers continue with narrower 11/16" string spacing at the bridge, as popularized on 1980s fivers. The L•2500 Series 750 is for players who want the full three-quarter inch spacing on the most iconic of G&L designs.

  Series 750 means there's a new Wide-5 Saddle Lock bridge plate housing five of the same saddles found on an L•2000. This new bridge is all about maximizing string energy transfer to the body, especially that knockout B-string. The new body shape draws on classic Fender Avenue forms, melding them into a fresh hit for the ages. That's a sweet story in itself, as Series 750 arrives exactly forty years after the G&L L•2000 did. And those big pickups are more than stretched out brutes: all the harmonic detail of the best MFD humbuckers speak in a clear voice over massive B-string energy.

  Series 750 is a brand new model but classic Fender Avenue details are everywhere. That graceful early CLF/G&L headstock flows into a slim, rounded neck profile that's rock solid thanks to a true dual-action truss rod and twin graphite reinforcement rods. And those big, beautiful machined CLF knobs pop against the sweeping chrome control plate that houses the Trig-Tone Preamp. Even those little color-coded mini toggle switch tips have outsized mojo. This is retrofuturism of the very best kind.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Pickups: Two G&L Magnetic Field humbucking pickups
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: CLF/G&L 1.78" nut width-slim C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed 19mm Saddle Lock with chrome-plated brass saddles
  - Electronics: Tri-Tone system with 3-position pickup selector, series/parallel switch, 3-position pre-amp mode switch, volume, treble, bass
  - Includes: G&L Deluxe Gig Bag
  - Power: battery-powered, 9V
  - Available in: Graphite Metallic over Alder, Rosewood fingerboard
  - Available in: Tangerine Metallic over Alder, Maple fingerboard
  - Available in: Old School Tobacco over Okoume, Rosewood fingerboard
  - Available in: Blueburst over Swamp Ash, Maple fingerboard
