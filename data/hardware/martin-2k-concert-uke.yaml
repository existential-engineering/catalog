details: |-
  The 2K Concert Uke is a premium instrument that highlights Martin's long tradition of crafting beautifully resonant ukuleles from solid Hawaiian koa. The flamed koa top, back, and sides deliver a sweet, rich tone with clarity and warmth, while the figured grain gives each instrument striking visual character.

  The concert body size sits between soprano and tenor, offering balanced voicing with excellent articulation and an intimate feel. A genuine mahogany neck with applied dovetail joint construction connects to an East Indian rosewood fingerboard, and a matching rosewood bridge with a compensated black Tusq saddle keeps intonation true across all 17 frets.

  Premium appointments include antique white binding, a multi-stripe rosette, mother-of-pearl dot inlays, and a satin finish that highlights the natural koa grain. Nickel open-gear tuners reinforce the instrument's traditional aesthetic, and a soft gig bag is included for transport and storage.
specs: |-
  - Body size: Concert
  - Top: Solid flamed Hawaiian koa
  - Back and sides: Flamed koa
  - Neck: Genuine mahogany
  - Neck joint: Applied dovetail
  - Fingerboard: East Indian rosewood
  - Frets: 17 total
  - Nut width: 1 13/32"
  - Fingerboard width at 12th fret: 1 13/16"
  - Bridge: East Indian rosewood with compensated black Tusq saddle
  - Tuners: Nickel open-gear
  - Binding: Antique white
  - Rosette: Multi-stripe
  - Inlays: Mother-of-pearl dot
  - Finish: Satin
  - Strings: Soprano/Concert ukulele strings (pre-strung)
  - Case: Soft gig bag included
