details: |-
  The Ernie Ball Music Man StingRay Special 5-String combines classic tone with modern upgrades for maximum performance. With lightweight hardware, it is the lightest and most versatile StingRay 5 yet — perfect for stage or studio.

  The body is crafted from select hardwoods (ash) measuring 13-3/8" wide, 1-5/8" thick, and 45-3/4" long, finished in high gloss polyester. The select roasted maple neck features a gunstock oil finish for a smooth, broken-in feel, with a fingerboard available in maple, rosewood, or ebony depending on color choice.

  The 18-volt, 3-band active preamp delivers exceptional headroom and tonal flexibility, paired with neodymium humbucking pickups offering powerful clean output in one- or two-pickup configurations. Controls include volume, treble, mid, and bass.

  Hardware includes lightweight custom Music Man tuning machines and the vintage Music Man top-loaded chrome-plated bridge. The neck has a 34" scale length, 22 high-profile wide stainless steel frets, an 11" radius, and 1-3/4" nut width.
specs: |-
  - Body: Select hardwoods (ash), 13-3/8" wide, 1-5/8" thick, 45-3/4" long
  - Neck: Select roasted maple with gunstock oil finish, 1-3/4" at nut, 2-3/4" at last fret, 11" radius
  - Fretboard: Maple, rosewood, or ebony (depends on color)
  - Pickups: Neodymium humbucking (single or dual configurations)
  - Electronics: 18-volt 3-band active preamp (volume, treble, mid, bass)
  - Scale length: 34"
  - Frets: 22 high-profile, wide stainless steel
  - Hardware: Lightweight custom Music Man tuning machines
  - Bridge: Vintage Music Man top-loaded chrome-plated bridge
  - Finish: High gloss polyester
