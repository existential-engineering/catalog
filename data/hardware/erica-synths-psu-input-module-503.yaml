url: https://www.ericasynths.lv/psu-input-module-503/
description: If you consider to use rack ears to mount Erica Synths 84HP
  enclosure in the studio rack, you may want to access the PSU connection from
  the front of the case, instead of the top. Then the 4HP PSU connection module
  is a solution. PSU Input module is intended to be used with external PSUs
  which provide an output voltage from +9V to +12V ("+" in the centre).
details: |-
  The PSU Input module moves the power connection of an Erica Synths 84HP enclosure from the top of the case to the front panel. That is useful when rack ears are used to mount the enclosure in a studio rack, where the top of the case is no longer reachable.

  The module takes 4HP of panel space and is intended for external PSUs that provide an output voltage from +9V to +12V with the positive pole in the centre of the barrel plug.

  For two row eurorack enclosures (2x84HP) a small screwdriver is enough: disconnect the existing PSU connector from the blue terminal and connect the PSU connector module in its place. For one row eurorack enclosures (1x84HP) a soldering iron is needed to solder the wires from the PSU connector module, and the soldered wires must not touch the aluminium enclosure.
specs: |-
  - 4HP panel width
  - For external PSUs with +9V to +12V output, positive in the centre
  - Fits Erica Synths 84HP enclosures, one row and two rows
  - Two row installation connects to the existing blue screw terminal
  - One row installation requires soldering
