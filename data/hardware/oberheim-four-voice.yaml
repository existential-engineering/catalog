description: >-
  The Oberheim Four Voice combines four dual-oscillator SEM modules with independent filters and
  envelopes, a simple analog mixer, and a 49-note keyboard to create a polyphonic and polytonal
  analog synthesizer with eight oscillators.
details: |-
  A big step forward after the initial Oberheim SEM and Two Voice synthesizers came from the bigger and better Four Voice. Four dual-oscillator SEM modules each with its own filters and envelopes are joined together along with a simple analog mixer and 49-note keyboard to give a polyphonic and polytonal synthesizer.

  This combination provides eight oscillators and four voices of polyphony because there are basically four discrete mono-synths all connected together. The ability to craft a different sound on each voice led to some diverse and complex sounds, though it also meant each voice had to be programmed independently. Each voice also has its own independent audio output.

  The Polyphonic Synthesizer Programmer, released in 1976 and added to the Four Voice, stores 16 patches per voice, all of which can be different. The Four Voice could accommodate an additional four SEMs, making it just like the Eight Voice model which officially appeared in 1977.

  Unfortunately the Four Voice was eventually outcompeted by the release of the polyphonic Sequential Prophet-5, which offered true polyphony with a single set of sound shaping controls and comprehensive patch memory.

  The Four Voice has been used by 808 State, Depeche Mode, Styx, Pink Floyd, The Shamen, Gary Wright, Joe Zawinul, and John Carpenter.
specs: |-
  - Polyphony: 4 voices
  - Oscillators: 8 VCOs (2 per voice) with sawtooth or variable-pulse waveforms
  - LFO: Triangle wave only
  - Filter: Low, band, high, notch filter with resonance
  - VCA: 2 ADR envelopes
  - Keyboard: 49 keys
  - Memory: 16 patches per voice via Polyphonic Synthesizer Programmer
  - Control: CV/Gate
releaseDate: "1975"
releaseDateYearOnly: true
