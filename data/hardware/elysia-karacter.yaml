description: Shape your sonic character with precision and depth. From subtle
  warmth to extreme saturation, unleash the potential of analog saturation.
details: |-
  karacter can add unobtrusive coloration and thickness to your music by applying subtle (or less subtle) amounts of symmetrical clipping. This Mastering Grade Saturation mode has a soft characteristic curve and focuses on the uneven harmonics (h3, h5, ...). The onboard mix controller blends any desired amount of saturation with the original dry path for even further signal integrity.

  In FET Shred mode karacter becomes a different animal. Its clipping changes from a symmetrical to an asymmetrical characteristic, which pleasingly reminds of the style a driven tube amp would sound like. More even harmonics (h2, h4, ...) come into play, and what has been saturation before is now turned into truly musical distortion. Turbo Boost puts the FET Shred mode on steroids, shifting the operating point of the distortion circuitry for industrial styles, mangling samples and brutal guitar sounds.

  The Color Filter is a complex filter network controlled by just one single knob. Unlike the simple top end roll-off filters found on many distortion devices, it does not change the frequency response after it has been formed, but is an essential part of THD generation itself, giving a wide range of coloring options and sweet spots ranging from dubby growl to steely punch.

  An integrated M/S encoder and decoder lets the middle and side signals be processed separately, so the center can be made fatter without corrupting the original stereo spectrum, or heavy distortion applied to the side signal without affecting the mid at all. The two channels can also run as fully independent Dual Mono channels, or be linked by a single set of controls for stereo sources.

  On the 19-inch rack version the Drive and Mix parameters can be modulated or automated with an external control voltage. A MIDI-to-CV box or a synthesizer connects to the CV inputs on the back panel (EXT1 or EXT2), and the CV can cover the complete range of the Drive and Mix parameters when the corresponding knobs are set fully counter-clockwise.
specs: |-
  - Stereo saturator for recording, mixing and mastering
  - Class-A technology with discrete circuit designs
  - Mastering Grade Saturation mode with symmetrical clipping, focused on uneven harmonics
  - FET Shred mode with asymmetrical, tube-like distortion
  - Turbo Boost mode for extreme distortion
  - Color Filter: complex filter network on a single knob, integrated into the saturation circuits
  - Onboard mix control to blend distortion with the dry signal
  - Dual Mono, Stereo Link and M/S modes with integrated M/S matrix
  - CV inputs (EXT1, EXT2) for Drive and Mix modulation, 19-inch rack version only
  - Frequency response, 100% wet: <10 Hz - 400 kHz (-3.0 dB)
  - Frequency response, 100% dry: <10 Hz - 27 kHz (-3.0 dB)
  - THD+N, 100% dry @ 0 dBu: 0.013 %
  - THD+N, 100% dry @ +10 dBu: 0.024 %
  - THD+N, 100% wet in Saturation mode @ 0 dBu min drive: 0.47 %
  - THD+N, 100% wet in Saturation mode @ +10 dBu max drive: 35.1 %
  - Noise floor, 20 Hz - 22 kHz (A-weighted), 100% dry: -91 dBu
  - Noise floor, 20 Hz - 22 kHz (A-weighted), 100% wet: -81 dBu
  - Dynamic range, 20 Hz - 22 kHz: 112 dB
  - Maximum input level: +21 dBu
  - Maximum output level: +21 dBu
  - Input impedance: 10 kOhm
  - Output impedance: 68 Ohm
  - Dimensions, 1 RU rack (W x H x D, incl. knobs): 483 mm x 44.45 mm x 238 mm (19" x 1.75" x 9.4")
  - Weight, 1 RU rack: 1.76 kg (3.88 lbs)
  - Power consumption, 1 RU rack: 12 Watts
