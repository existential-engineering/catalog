details: |-
  Closed-back circumaural headphones. 40mm neodymium magnet dynamic drivers. Impedance 32Ω, sensitivity 95dB ±3dB, max input 400mW. Fixed cable ~9.8 ft (3m), terminating in a 3.5mm (1/8") plug; screw-on 6.3mm (1/4") adapter included. Stainless steel framework with adjustable arms. Padded headband and ear bands. Leatherette carrying bag included. Frequency response not published by TASCAM.
