description: Our take on genre defining FX – Krautrock Phaser.
details: |-
  The Erica Synths Black K-Phaser is the maker's take on a classical, genre defining FX unit, the Krautrock Phaser. It is a tribute to the German electronic music pioneers that largely shaped the sound of electronic music worldwide.

  The Black K-Phaser retains the original concept of 8 all-pass filters with photoresistors, but the filters and the modulation circuit were redesigned and several unique features added. A dip switch selects how many filter stages are involved in the resonance path, and a resonance attenuverter brings in feedback artefacts that have not been heard before.

  Most importantly, SPREAD mode detunes the all-pass filters against each other for even more distinct behaviour, which separates the module from a straight reissue of the original circuit. A classic mode sits beside it for the undetuned sound.

  A built-in voltage controlled LFO with selectable waveforms expands the modulation possibilities of the phaser, and because it has a dedicated output it can be used as an independent modulation source for the rest of the modular system. A separate wet output carries the processed signal on its own.
specs: |-
  - 8 all-pass filters with photoresistor control
  - Classic and Spread (filter detune) mode
  - Resonance attenuverter
  - Selectable resonance path
  - Built in VC LFO with a dedicated output
  - Wet output
