description: The Klipsch R-600F is a floorstanding speaker featuring an all-new
  90° x 90° Tractrix Horn with increased outer horn dimensions for improved high
  frequency directivity and a more accurate sound stage.
details: |-
  The R-600F features Klipsch's exclusive 90° x 90° Tractrix Horn technology, which delivers the power, detail and emotion of the live music experience with the cleanest, most natural sound possible. The increased outer horn dimensions allow for directivity control over a larger bandwidth of frequencies, resulting in improved high frequency directivity and a more accurate sound stage.

  The Linear Travel Suspension (LTS) aluminum tweeter with Kapton suspension minimizes distortion for enhanced, detailed performances. Aluminum is an extremely light and rigid material used in the tweeter assembly to provide high efficiency and improve resolution and detail.

  Dual 6.5" spun-copper thermoformed crystalline polymer (TCP) woofers feature steeper angling of the cones for a smoother response and improved accuracy and transparency. The additional ribbing increases overall rigidity for less cone breakup at higher frequencies.

  The rear Tractrix port is perfectly matched to the cabinet and woofers, creating ideal airflow with minimal distortion or turbulence even at the lowest frequencies. The cabinet is constructed of reinforced MDF with an all-new bracing design to reduce cabinet vibration.

  Hidden binding posts on the back reduce visible wiring, and the sleek modern appearance is achieved through hidden fasteners, edge-to-edge horn, and low-profile magnetic grilles.
