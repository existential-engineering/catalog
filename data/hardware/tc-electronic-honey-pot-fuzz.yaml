details: |-
  Honey Pot Fuzz is the kind of fuzz box that blurs the lines between fuzz and distortion in a most pleasing way.There's plenty of volume on tap. It's just begging for a loud tube amp to really open up and breathe.The range of gain available in Honeypot Fuzz goes from a slightly gritty grind, almost like an overdrive, and all the way to massive walls of sticky honeycomb-structured distortion with seemingly endless sustain and a tone that's fat and nasty but with thick,sweet highs.Honeypot covers a wide musical territory that spans all the way from The Black Keys and The White Stripes to 90's alternative rock all the way up to the Dark Side Of The Moon with a beautiful creamy and vibrant sustain.    •    Vintage style fuzz pedal    •    All-analog circuitry    •    True Bypass

  Classic Fuzz Tones

  HONEY POT FUZZ faithfully delivers the instantly recognizable distortion guitar sound found on iconic rock albums from the ‘70s onward. There’s no doubt you’ve heard it before: fat buzzing power chords with a life of their own; singing, violin-like lead lines; and tight, rich riffing that holds its own in any mix.

  Sustain for Days

  With only 3 knobs to master, HONEY POT FUZZ’ massive gain range provides tonal capabilities to extend from the semi-gritty grind of an overdrive pedal, all the way to ultra-thick walls of sticky honeycomb-structured distortion. The Sustain knob lets you dial in the exact amount for those epic solos where you can hang on a bended note for a few bars, or climb a wall of chunky power chords – while you’re building to a climactic finish!
