details: |-
  The 30ms Automatic Double Tracker is a stereo effect pedal offering a range of studio-style doubling effects for thicker, fuller sounding instruments. It also carries a reverb that simulates the chamber in Studio Two, and is designed to work with guitar, bass, keyboard and vocals.

  The technique it is built around, automatic double tracking, was pioneered by Ken Townsend and John Lennon at Abbey Road Studios and became a common way of making a recording sound bigger by making it sound as though two players are performing at the same time. The pedal is intended to make those techniques portable.

  It can be used in mono with the built-in "Abbey Verb" reverb control, or in stereo as the Double Tracker Pro. Dimension Mode produces altered and detuned effects in the manner of a chorus but without the regularity of an LFO, and can create up to two voices for a stereo double-tracked field, with the tuning and delay of each under user control. Abbey Mode is closer to a conventional chorus, simulating synced tape decks running in parallel at varying speeds, giving a wide sound in either mono or stereo. Slapback Mode produces a double-tracked echo using the two altered voices, and can be combined with the reverb.

  In Stereo Double Tracker Pro Mode the reverb channel is dropped in favour of full control over the two double-tracked voices. Each voice can be tuned up to 30 cents sharp or flat and then delayed by up to 30 milliseconds, for subtle through to pronounced doubling. Internal switches set the wet output to carry either dry plus effected signal or the effect alone, giving true double tracking in stereo.
