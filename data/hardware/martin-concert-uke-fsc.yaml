details: |-
  The Martin Concert Uke FSC is a premium concert-sized ukulele built entirely from FSC-certified tonewoods, reflecting Martin's commitment to responsibly sourced materials. The top, back, and sides are crafted from FSC-certified mahogany finished in a dark satin, giving the instrument a warm, focused voice with the punch and articulation that concert-size ukuleles are known for.

  The applied dovetail neck is also FSC-certified mahogany with a satin finish, while the fingerboard and bridge are made from FSC-certified ebony. The fingerboard measures 1 13/32" at the nut and widens to 1 13/16" at the 12th fret, with 17 frets and 1/8" mother-of-pearl dot inlays plus yellow side dots for visibility.

  A compensated black Tusq saddle pairs with Ratio black ukulele pegs for precise intonation and stable tuning. The instrument ships with Martin's Ukulele Premium Polygut strings in concert gauge and includes a soft gig bag.

  This model has been retired from Martin's active lineup but may still be available through dealers.
specs: |-
  - Body size: Concert
  - Top: FSC-certified mahogany
  - Back & sides: FSC-certified mahogany
  - Finish: Satin
  - Neck: FSC-certified mahogany, applied dovetail, satin finish
  - Fingerboard: FSC-certified ebony
  - Nut width: 1 13/32"
  - Width at 12th fret: 1 13/16"
  - Frets: 17
  - Inlays: 1/8" mother-of-pearl dots with yellow side dots
  - Bridge: FSC-certified ebony with compensated black Tusq saddle
  - Tuners: Ratio black ukulele pegs
  - Strings: Martin Ukulele Premium Polygut - Concert
  - Case: Soft gig bag included
  - Left-handed available
