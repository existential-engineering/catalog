details: |-
  Vintage style. High-tech performance.

  The Heil Sound Heritage is a high-performance dynamic microphone built for broadcast, live sound reinforcement, and the recording studio. It pairs a classic look with a modern Heil element, so it sounds as good as it looks.

  Overview

  Some microphones are built to look the part. Others are built to do the job. The Heritage does both.

  Its retro shell and blue foam windscreen turn heads on stage, on camera and in the studio. Inside, a Heil-engineered dynamic element delivers a tight cardioid pattern, minimal proximity effect, and smooth, articulate response. The result is a mic with real character that professionals can rely on every day.

  Key Features

  Design & Finish

  Choose your finish. The Heritage starts with a molded steel body. It is then either copper-plated then chrome-plated or it's is coated in matte black. Giving it a real show-stopping look.

  A windscreen with personal style. A blue foam windscreen is molded to fit inside the shell. It adds pop protection and gives the Heritage its unmistakable retro look.

  Performance & Technology

  Engineered for clarity. The Heritage uses a special magnet structure and a 1-1/8″ low-mass aluminum voice coil assembly. The low-mass coil responds quickly, capturing detail and transients with precision.

  Built for Professionals
specs: |-
  - Finish: molded steel body comes in a chrome-plated finish or a black matte finish.
  - Retro blue windscreen: custom-molded foam fitted inside the shell.
  - Heil dynamic element: special magnet structure with a 1-1/8″ low-mass aluminum voice coil.
  - Linear cardioid pattern: consistent pickup with reduced proximity effect.
  - On/off slide switch: quick, silent muting.
  - Standard 5/8″ thread: fits standard mic stands and booms.
  - Broadcast: consistent, close-up voice with minimal proximity boom and low handling noise
  - Live sound: tight cardioid rejection helps control feedback and stage bleed
  - Recording studio: smooth, articulate response for vocals and instruments
  - Podcasting and video: a standout look on camera, backed by pro-grade sound
  - Type: dynamic.
  - Polar pattern: cardioid.
  - Shockmount: Sorbothane, internal.
  - Body: molded steel, copperplated then chromeplated.
  - Frequency response: 50 Hz to 18 kHz.
  - Impedance: 600 ohms balanced.
  - Output level: -55 dB at a nominal 1,000 Hz.
  - Connector: 3-pin XLR.
