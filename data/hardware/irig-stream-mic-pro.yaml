description: "Compact multi-pattern microphone and stereo/4-channel audio interface"
details: |-
  The iRig Stream Mic Pro is a compact multi-pattern USB microphone and stereo/4-channel audio interface featuring dual 0.55" gold-sputtered electret condenser capsules. Four selectable polar patterns (Cardioid, Omnidirectional, Figure-8, and Stereo) cover a wide range of recording scenarios, with a selectable high-pass filter at 60, 100, or 200 Hz.

  The built-in audio interface operates in stereo (pre-mixed 2-in/2-out) or multichannel (4-in/2-out) mode. Features include Loopback+ technology for app audio routing, direct monitoring, an all-in-one control knob, and mic mute (hold to silence). The unit is MFi certified and charges connected Lightning devices.

  Compatible with iPhone, iPad, Android, Mac, and PC via included Mini-DIN to Lightning and Mini-DIN to USB-C cables. USB bus powered with optional external PSU (IK PSU 5300) for extended sessions.
specs: |-
  - 24-bit A/D, 24-bit D/A conversion
  - Sample rates: 44.1 kHz, 48 kHz, 88.2 kHz, 96 kHz
  - 2-in/2-out or 4-in/2-out audio interface
  - Microphone frequency response: 20 Hz - 20 kHz
  - Maximum SPL: 115 dB
  - High-pass filter: selectable at 60, 100, or 200 Hz
  - Headphone output: 1/8" (3.5 mm) TRS, 7 mW/channel (32 Ohm load)
  - Headphone frequency response: 20 Hz - 20 kHz
  - Headphone dynamic range: 87 dB(A)
  - Auxiliary input: 1/8" (3.5 mm) TRS, nominal -10 dBV
  - Auxiliary input frequency response: 10 Hz - 20 kHz
  - Dimensions: 55 x 136 x 38 mm
  - Weight: 430 g
  - Power: USB bus powered (optional external PSU)
