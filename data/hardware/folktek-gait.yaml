description: Gait is a Eurorack gate and trigger generator with four hexagonal
  touch pads that each output simultaneous +5V gate and trigger signals while
  touched.
details: |-
  Gait is a simple and effective gate and trigger generator. Four individual momentary touch pads send both +5v gate and trigger signals simultaneously as the touch button is pressed via 4x2 3.5mm outputs. TOUCH PADS AND OUTPUTS

  Four hexagonal touch buttons. - each generates +5v gate and trigger outputs simultaneously. - gate signal holds as long as the pad is touched. - individual jacks for trigger and gate. SPECS

  +12V: 50mA -12V: 0mA +5V: 0mA
  6HP width
  25mm depth
  View on modular grid: https://www.modulargrid.net/e/folktek-gait
