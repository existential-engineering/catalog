name: TH810
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th810/
description: Closed-back dynamic premium headphones in the TH Premium Series,
  inheriting the flagship sound quality of the TH910/TH919. Features solid
  acacia wood housing with natural grain variation, a newly developed 50mm
  Biodynamic driver for tight, well-defined bass and smooth midrange,
  lightweight magnesium alloy mechanical components, contoured dual-layer
  memory-foam ear pads with silk protein synthetic leather, and natural
  sheepskin head pads. Ships with a 2 m 7N high-purity OFC unbalanced Y-cable
  terminated in a 6.3 mm stereo plug.
details: |-
  Features:
  - Closed-back dynamic design inheriting flagship TH910/TH919 sound quality
  - Solid acacia wood housing with natural grain variation
  - Newly developed 50 mm Biodynamic driver with improved edge for tight, well-defined bass
  - Lightweight magnesium alloy mechanical components (20% weight reduction vs. aluminum)
  - Contoured dual-layer memory-foam ear pads with silk protein synthetic leather
  - Natural sheepskin head pads and headband
  - Proprietary 7N (99.99999%) high-purity OFC cable included
  - Detachable cable with 2-pin 3.5 mm connectors; compatible with optional balanced cables

  Weight: Approx. 385 g (excluding cable)

  Accessories: Faux leather pouch, safety precautions documentation, manual, 2 m unbalanced 2-pole 3.5 mm Y-cable

  Optional Cables: ET-TH4.4BL2Y (4.4 mm balanced), ET-TH-XLR2Y (4-pin XLR balanced), ET-TH2.0UB2Y (unbalanced)
