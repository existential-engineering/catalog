description: >-
  The JoMoX MBase 01 is a dedicated analog bass drum synthesizer introduced in 2008, using a fully
  analog VCO to create everything from clean 808 and 909 style kicks to hard, banging thumps.
details: |-
  Introduced in 2008, the JoMoX MBase 01 is a focused instrument that does one thing exceptionally well: creating bass drum sounds using a fully analog voltage-controlled oscillator. Its bass drum parameters match those found in JoMoX's larger XBase 09, XBASE 999, and AirBase 99 units.

  The compact desktop module features two columns of controls with up/down buttons for parameter selection and a single pot for editing values displayed on a 7-segment 3-digit LCD. Editable parameters include Tune, Pitch, Decay, Harmonics, Pulse, Noise, Attack, EQ, and LFO settings. The Harmonics control gradually adds overtones, transforming a sinusoid waveform into a parabolic one for more complex, distorted tones.

  The MBase 01 offers two MIDI modes: single-note triggering from C1 with pitch control, or chromatic play across an entire keyboard for hefty bass sounds and synth tones. External triggering is also possible via audio sources or the front panel Play button. The LFO provides four waveforms (Saw Up, Saw Down, Triangle, Rectangular) with speed ranging from 41 to 290 BPM via MIDI sync or manual entry.

  Classic 909 and 808 style bass drums are easily achievable, along with everything in between, from remarkably clean minimal blips to hard, banging thumps. The unit comes loaded with 64 preset and 10 user bass drum sounds. JoMoX later released the improved MBase 11 with additional features.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1 part
  - Oscillators: 1 VCO
  - Waveforms: Sine
  - LFO: 1 with Saw Up, Saw Down, Triangle, Rectangular
  - Filter: None
  - Envelope: 1 VCA with Attack and Decay
  - Effects: None
  - Keyboard: None (1 trigger button)
  - Memory: 64 preset, 10 user patches
  - Control: MIDI In/Out, Audio Trigger Input
  - Weight: 1.1 lbs (0.5 kg)
