description: Metron is a 16-channel trigger and gate sequencer designed for live
  performance, featuring up to 256 step patterns, five instantly recallable
  variations, per-step probability, ratchets, and expandability with Voltera and
  Axxent modules.
details: |-
  Metron is a 16-channel trigger and gate sequencer designed around one idea: live performance. Your sequencer should keep up with you on stage, not the other way around. Most trigger sequencers make you choose between deep programming and playability. We didn't want to. Metron's button matrix shows you four channels at a time with fast view switching, or zoom into a single track and see 64 steps at once. Patterns run up to 256 steps, and every channel can have its own length — dense polymetric webs are a few button presses away, not a menu dive. Everything about Metron is built for non-stop play. Five variations per pattern are instantly recallable and editable while another is playing — preview, edit, and cue the next section of your set without the audience ever hearing a pause. The FX/Fills section puts momentary fills, rolls, mutes, and manual gates under your fingers, plus custom fill patterns for transitions you've designed in advance. Per-step probability, group probability, burst ratchets, step looping, and random pattern generation keep patterns evolving all night — as much or as little as you want. Improvising new rhythms is just as immediate: tap patterns in live with quantized recording from the buttons or an external source, and use the two assignable CV inputs to put any parameter under voltage control. The internal clock has swing, sessions save to SD, and you can load entire new patterns from memory without stopping the clock — set-length performances from one module. When you're ready for more, Metron grows with your live rig. Voltera adds four bipolar CV tracks in 4HP — stack up to 16 for 64 lanes of melody and modulation sequencing from one performance interface. Axxent adds accent dynamics to your gates, and MIDI Preset mode sends program changes the CV bus. Firmware updates driven by user feedback have kept Metron sharper every year since launch. Manuals:

  Accessible Music Guide

  METRON MANUAL JAPANESE

  PDF MANUAL (Updated for Voltera!)
