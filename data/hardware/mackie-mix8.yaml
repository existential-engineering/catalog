description: Featuring a pair of microphone preamps and 3-band EQ and aux sends
  for each channel, the Mackie Mix8 is a versatile desktop solution for
  musicians and more.
details: |-
  Mix Series compact mixers are reliably rugged, with the proven quality you expect from the world leader in compact mixer design. With high-headroom, low-noise preamps, Mix Series mixers sound great and maintain audio quality from any source.

  Mix8 is an 8-channel mixer with two mono mic/line channels and two stereo 1/4 inch line channels, each with 3-band EQ and its own aux send.

  One aux send with a stereo 1/4 inch aux return lets you feed stage monitors or an outboard effects processor, and the aux return doubles as an extra pair of stereo line inputs.

  Outputs include main mix left and right, stereo control room outputs, a stereo RCA tape output and a 1/4 inch headphone jack. A tape-to-main and a tape-to-control-room/phones switch route the RCA playback input where you need it.

  All features are on the top of the mixer except the power connector, which accepts the supplied external AC power supply. The rugged metal chassis measures 7.8 x 9.6 x 2.1 inches and weighs 2.5 lb.
specs: |-
  - 8-channel compact mixer with high-headroom, low-noise performance
  - 2 mic/line inputs with XLR and 1/4 inch jacks and Onyx-class headroom
  - 2 stereo 1/4 inch line inputs (channels 3/4 and 5/6)
  - 3-band EQ: low shelving 80 Hz, mid peaking 2.5 kHz, high shelving 12 kHz, +/-15 dB each
  - Globally switched 48V phantom power for studio condenser mics
  - One aux send per channel with an aux master and stereo 1/4 inch aux returns
  - Dedicated stereo RCA inputs/outputs for playback or recording
  - Main L/R outputs, stereo control room outputs and headphone output
  - Equivalent input noise -125 dBu (150 ohm termination)
  - Mic input maximum level +19 dBu, aux return +16 dBu, all other inputs and outputs +21 dBu
  - External AC power supply, AC18V 600mA output (US)
  - Dimensions 7.8 x 9.6 x 2.1 in / 198 x 244 x 53 mm, weight 2.5 lb / 1.1 kg
