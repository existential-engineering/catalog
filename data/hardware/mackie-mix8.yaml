description: Mackie Mix8 8-Channel Compact Mixer.
details: |-
  Take control of your audio with the Mackie Mix8 compact mixer. Despite its small size, this versatile 8-channel mixer is loaded with premium features, including two microphone inputs with our studio-quality preamps, a 3-band EQ for each channel, an RCA I/O path for recording and more.

  Mackie has brought professional-level compact mixers to the masses since we debuted the LM-1602 in 1988. The Mix8 is an 8-channel mixer that expands on our heritage of designing great gear that isn't unattainable for real working musicians and content creators. Featuring our low-noise preamps, a 3-band EQ and aux sends for each channel, an RCA I/O path for recording and separate volume controls for headphones and the main monitor, the Mix8 is a versatile workhorse for creators who need more control over their audio.
specs: |-
  - 8-channel compact mixer with proven high-headroom, low-noise performance
  - 2 mic/line inputs with studio-level audio quality
  - Pan, level and overload indication
  - Phantom power for studio condenser mics
  - 2 stereo 1/4" line inputs
  - 3-band EQ on all channels with clean, precise tone shaping
  - 1 aux send with stereo 1/4'' returns
  - Dedicated stereo RCA inputs/outputs for playback or recording
  - Main L/R outputs
  - Headphone and stereo control room outputs
  - Rugged, reliable design built to last
  - Extremely compact and portable
