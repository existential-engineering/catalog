description: Series One MK II valve amps deliver incredible high gain
  performance with a level of unparalleled tonal refinement.
details: |-
  Series One MK II is the ultimate professional high gain valve guitar amp. In the studio or on the road, our Series One MK II valve amps will always deliver. Whether it's build quality or tonal excellence, no compromises have been made - if you are looking for the ultimate, professional high gain valve amplifier, why compromise? We didn't.

  At the heart of the Series One MK II's design is a quartet of 6L6 power valves which are complimented by two patented circuits: the ISF (Infinite Shape Feature) tone control and the DPR (Dynamic Power Reduction) system. Exclusive to Blackstar Amplification, these innovations stem from extensive technical research. With ISF and DPR, you can customise the Series One MK II's sound palette to match your unique signature sound and create 'the sound in your head.'

  The Series One MK II is built for unbeatable tone and reliability, with over 30 circuit and voicing mods developed over years of refinement from the original amp. Designed for the rigors of touring, Series One MK II amps feature double-sided PCBs, seam-welded 1.6mm steel chassis, and birch ply cabinets. Heavy-duty mains and output transformers, made from top-grade, grain-oriented steel, ensure robust performance on the road.

  The Series One MK II is a refined and streamlined range designed as the ultimate modern flagship amplifier and cabinet, tailored specifically for the needs of today's metal guitarists. This evolution of the range marks a significant leap forward in high gain, high performance amplification, with the 4 channel Series One 100 MK II taking centre stage - a high-gain powerhouse engineered for crushingly tight rhythm tones and thick saturated leads, devoid of the unwanted fizz often present in other designs.

  DPR allows continuously variable power reduction so you can use your valve amp in any playing situation and achieve pure valve output distortion and compression at any volume. DPR is a 'dynamic' circuit, delivering the exact compression (a.k.a. sag) of a small overdriven valve amp, at any volume level. The Series One PRO 412B MK II cabinets feature industry standard Celestion Vintage 30 speakers ensuring the amp delivers a perfectly balanced mid-range response with superior articulation and power.
specs: |-
  - 100W valve head
  - Valves: 1 x ECC82, 4 x ECC83, 4 x 6L6
  - Channels/Voices: Clean Warm, Clean Bright, Crunch, Super Crunch, OD 1 & OD 2
  - Four footswitchable channels
  - Patented Infinite Shape Feature (ISF)
  - Patented Dynamic Power Reduction (DPR) - down to 10W
  - Master Resonance, Presence and Volume
  - MIDI switching
  - Series effects loop with effects level switch
  - Speaker emulated output
  - 1.6mm seam welded steel chassis
  - Birch ply cabinet
  - Weight: 21.9kg
  - Dimensions: 700 x 275 x 267 mm
