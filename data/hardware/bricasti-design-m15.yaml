url: https://bricasti.com/en/consumer/m15.php
description: The Bricasti M15 is a stereo power amplifier with a fully
  differential, balanced architecture delivering 125W into 8 ohms, 250W into 4
  ohms, and 500W into 2 ohms. Accepts balanced XLR and unbalanced RCA inputs,
  with a stepped 5V external trigger. Handcrafted in the USA.
specs: |-
  - Power output: 125W into 8Ω, 250W into 4Ω, 500W into 2Ω
  - THD+N: <0.005% (20Hz–20kHz, full rated power, 8Ω and 4Ω)
  - Signal-to-noise ratio: >85dB at full rated power
  - Frequency response: 10Hz–150kHz, ±0.5dB
  - Balanced input impedance: 200kΩ
  - Unbalanced input impedance: 100kΩ
  - Input trim: 0dB, -6dB, -12dB, -18dB
  - Trigger: 5V external trigger via TRS connector
  - Mains voltage: 100, 120, 220, 230, 240 VAC at 50–60Hz (factory-set)
  - Power consumption: 60W standby, 2W idle
  - Weight: 90 lbs (shipping: 110 lbs)
  - Topology: fully differential
  - Warranty: 5-year limited
  - Handcrafted in the USA
