description: The LiveTrak L-12 mixes, records and monitors from a single piece
  of gear, mixing a live performance and recording up to 12 discrete channels
  while providing five individual custom headphone mixes.
details: |-
  The LiveTrak L-12 is a 12-channel digital mixer and multi-track recorder built for small live shows, rehearsal rooms and podcast production. Eight mono channels take XLR/TRS combo jacks with +48 V phantom power switchable in banks of four, channels 1 and 2 add a Hi-Z setting for electric guitar or bass, and channels 3 to 8 carry a 26 dB pad. The two stereo channels, 9/10 and 11/12, accept TRS line jacks or RCA jacks and can also be fed from the USB audio return.

  Every channel has a fader, a mute button and a 12-segment LED meter, and the eight mono channels add single-knob compression beside the gain control. The channel strip section applies a 3-band EQ with a sweepable mid (10 kHz shelving high, 100 Hz to 8 kHz peaking mid, 100 Hz shelving low, each plus or minus 15 dB), a 75 Hz 12 dB/octave low cut, panning and send-effect level to whichever channel is selected. A send bus carries 16 reverb and delay effects with adjustable parameters.

  The recorder captures 14 tracks at once to SD, SDHC or SDXC media at 44.1 or 48 kHz, or 12 tracks at 96 kHz, in 16 or 24-bit WAV, with 12-track playback. Tracks are written pre-EQ and pre-effects so they can be transferred to a DAW for further work. Effects, EQ, overdub, the audio interface, fader modes A to E and the stereo mix on channels 13 and 14 are unavailable at 96 kHz. Automatic recording can be triggered by a level on the master fader, a guitar chord or a snare hit, with up to two seconds of pre-record.

  Five monitor outputs each carry their own mix, saved with the scene, and the headphone amplifier is specified at 42 mW per side into 60 ohms. Monitor A also appears on a pair of balanced TRS jacks for powered speakers, and the master bus leaves on balanced XLR jacks. Nine scenes store fader positions, EQ, pan, mute and more, and a built-in slate microphone and metronome cover talk-back and click duties.

  Three operation modes run over USB. Audio Interface mode makes the L-12 a 14-in/4-out, 24-bit USB 2.0 interface with flexible routing and a class-compliant setting for iOS and iPadOS, Card Reader mode exposes the SD card to a computer, and USB Host mode transfers projects and audio files to a connected flash drive through the separate host port. A CONTROL IN jack on the rear panel takes the optional FS-01 momentary footswitch, and power comes from the supplied AD-19 DC 12 V adapter.
specs: |-
  - 12 discrete channels (8 mono plus 2 stereo) with XLR or 1/4-inch connectivity
  - Inputs: Mono (MIC/LINE) x 8, Stereo (LINE) x 2. Outputs: MASTER OUT x 1, MONITOR OUT x 5
  - Mono (MIC/LINE): XLR/TRS combo jacks (XLR 2 HOT, TRS TIP HOT)
  - Input gain: PAD OFF +16 to +60 dB, PAD ON -10 to +34 dB, Hi-Z ON +6 to +50 dB
  - Input impedance: XLR 3 kOhm, TRS 10 kOhm (1 MOhm with Hi-Z on)
  - Maximum input level: PAD OFF 0 dBu, PAD ON +26 dBu (at 0 dBFS)
  - Phantom power: +48 V, switchable on channels 1 to 4 and 5 to 8
  - Hi-Z connectivity on channels 1 and 2, 26 dB pad on channels 3 to 8
  - Stereo (LINE): TRS phone and RCA pin (unbalanced) jacks, maximum input level +16 dBu
  - MASTER OUT: XLR jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MONITOR OUT A (TRS): TRS phone jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MONITOR OUT A to E (PHONES): standard stereo phone jacks, maximum output level 42 mW + 42 mW at 60 Ohm, output impedance 100 Ohm
  - Buses: MASTER 1, MONITOR 5, SEND EFX 1
  - Channel strip: COMP on channels 1 to 8, low cut 75 Hz 12 dB/OCT. EQ HIGH 10 kHz shelving, MID 100 Hz to 8 kHz peaking, LOW 100 Hz shelving, each plus or minus 15 dB
  - Level meters: 12 segments, -48 dB to 0 dB
  - Send effects: 16 types, delay and reverb, with adjustable parameters
  - Scene saving function, up to 9 scenes at a time, storing fader position, EQ, pan, mute and more
  - Maximum simultaneous recording tracks: 14 at 44.1 or 48 kHz, 12 at 96 kHz. Maximum simultaneous playback tracks: 12
  - Recording format: WAV 44.1/48/96 kHz, 16/24-bit, mono or stereo
  - Recording media: 16 MB to 2 GB SD cards, 4 GB to 32 GB SDHC cards, 64 GB to 1 TB SDXC cards
  - Audio interface: 14-in / 4-out at 44.1 or 48 kHz, 24-bit, USB 2.0, class-compliant mode for iOS
  - Effects, EQ, overdub, audio interface, fader modes A to E and channels 13 to 14 (stereo mix) are not available at 96 kHz
  - Card reader: mass storage USB 2.0 High Speed. USB HOST: USB 2.0 High Speed for project and file transfer to a flash drive
  - Sampling rate: 44.1 / 48 / 96 kHz
  - Frequency characteristics: -1.0 dB at 20 Hz to 20 kHz (44.1 kHz), -3.0 dB at 20 Hz to 40 kHz (96 kHz)
  - Equivalent input noise: 128 dB EIN (IHF-A) with +60 dB, 150 Ohm input
  - Display: LCD with backlight, 128 x 64 resolution
  - Built-in slate microphone and metronome
  - Automatic recording start and stop, with up to 2 seconds of pre-record
  - Compatible with the ZOOM FS-01 footswitch via the CONTROL IN jack
  - System requirements for audio interface mode: Windows 8.1 / 10 / 11 (32 or 64-bit), macOS 10.14 to 26, iOS 8 to 26 and iPadOS 26 with an Apple Lightning to USB Camera Adapter
  - Power supply: AD-19 AC adapter, DC 12 V / 2 A
  - External dimensions: 445 mm (W) x 282 mm (D) x 70.5 mm (H)
  - Weight (main unit only): 2.53 kg
  - Supplied with the AD-19 AC adapter, a USB 2.0 cable and a quick guide
