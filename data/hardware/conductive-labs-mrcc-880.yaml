name: MRCC 880
manufacturer: conductive-labs
primaryCategory: midi
categories:
  - routing
  - discontinued
url: https://conductivelabs.com/mrcc/mrcc-880/
description: A discontinued, non-expandable MIDI router offering per-port
  routing buttons, MIDI merging, and preset recall without a computer.
details: |-
  The MRCC 880 was Conductive Labs' standalone MIDI router and USB MIDI interface, letting players patch MIDI connections with dedicated per-port routing buttons instead of a computer app. It handled automatic MIDI merging, four presets of save/load routing, a panic button, MIDI activity monitoring, clock and Start/Stop/Continue filtering, and channel splitting.

  Unlike the modular MRCC, the 880 was a fixed, non-expandable unit: it could not accept expansion modules such as the Remote 7 or XpandR. The product page now states it "has been discontinued for now."
specs: |-
  - Per-port dedicated routing buttons for quick MIDI patching
  - Automatic MIDI merging
  - Save/load 4 preset slots
  - Panic button and MIDI activity monitoring
  - Clock and Start/Stop/Continue filtering
  - Channel splitting
  - Non-expandable (no Remote 7 or XpandR support)
