details: |-
  4-channel mixer for Serato DJ Pro.

  With an inbuilt Serato sound card, the DJM-900SRT four-channel mixer allows native control of the hugely popular Serato DJ Pro software. The DJM-900SRT inherits all the high-performance features of the DJM-900NXS , such as 6 high-quality Sound Colour FX, 13 Beat FX and intuitive X-PAD control.

  On-board Serato sound card. Connect the DJM-900SRT to your PC/Mac via USB to get plug-and-play control of Serato DJ Pro.

  Effects with simple controls. The Sound Color FX is loaded in each channel of the mixer, and dynamic arranging and mixing of music will be possible by adding effects to sound regions.

  Professional sound design. This mixer is equipped with a 32-bit A/D converter to digitise and enhance sound quality for all outputs, while the 32-bit digital signal processor suppresses digital noise. Even analogue noise is reduced through balanced hybrid operation amps and output circuits.

  Robust faders. Our robust Magvel Faders ensure smooth control over long-term use. Two metal shafts support the fader knobs, while the contact-free magnetic system is designed to endure millions of performances.

  Advanced connectivity. With Pro DJ Link you can connect multiple players, turntables or laptops via LAN connection and share a single source. Combine this with rekordbox to access pre-prepared loops and cues, sync the beat with the master deck, and access a host of advanced pro-DJ features.

  Quantized Beat FX. Quantize snaps Beat FX, cues and loops to the rekordbox beat grid for precision performances.
