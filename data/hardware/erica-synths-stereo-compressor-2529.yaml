description: Everything sounds better with compression – whether you need a bit
  of extra pressure for your drum sounds or just that extra touch to make your
  modular mix more nimble and tight, the Erica Synths Stereo Compressor will
  make your live performances a joy. The module is optimized for percussion
  sounds and will be a great addition to any Erica Synths Drum module rig. The
  Stereo sidechain can be used to animate melodic layers on the beat and to
  truly bring your Basslines to life.
details: |-
  The Erica Synths Stereo Compressor is a 10HP eurorack compressor built around THAT chips. It is optimized for percussion sounds and is intended as an addition to an Erica Synths drum module rig, whether the need is a bit of extra pressure on drum sounds or a touch that makes a modular mix more nimble and tight.

  Gain, Threshold and Compression Amount (Ratio) are set from the front panel. A Stereo Link option ties the two level detectors together so both channels respond as one, a bypass switch takes the module out of the signal path, and an 8 segment VU meter reads the output level.

  The sidechain is DC coupled, so it accepts control signals as well as audio. It can be used to animate melodic layers on the beat and to bring basslines to life.

  Audio input level runs from -5V to +5V, threshold covers -40dB to +10dB and makeup gain covers -12dB to +12dB, with ratios from 1:1 up to infinity. The module is 10HP wide and 35mm deep, and draws 60mA on the +12V rail and 22mA on the -12V rail.
specs: |-
  - THAT chip-based stereo compressor
  - DC coupled sidechain
  - Gain, Threshold and Compression Amount (Ratio) settings
  - Stereo Link for level detectors
  - Bypass switch
  - 8 segment output level VU meter
  - Audio input level -5...+5V
  - Threshold -40dB to +10dB
  - Makeup gain -12dB to +12dB
  - Ratio 1:1 to infinity
  - Power consumption +60mA, -22mA
  - Module width 10HP
  - Module depth 35mm
