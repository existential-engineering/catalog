description: An EMF/RF landscape receiver that makes audible electromagnetic
  emissions and radio frequencies from electronic devices, using two coils and
  two antennas, with a soft clipping compressor on the output buffer.
details: |-
  Equals is a portal to an invisible realm of sound, merging the worlds of electromagnetic waves and human perception. Equals makes audible both electromagnetic emissions and radio frequencies from all manner of artificial signal-sources such as power lines, all electronic gadgets and machines, 2.4 GHz WIFI, cellphones, power sockets, computers, phones, and many other electronic devices. After researching for months EMF and RF signals I have decided to give the user a wider range of possibilities using two coils that will provide a oncoming window into the imperceptible transmissions from all electronic devices and two antennas allows access to higher frequency wide band emissions such radio signals, and improving the existing EMF sniffer designs you can find around by adding a warm soft clipping compressor on the output buffer. As you wander through bustling city streets, Equals becomes your guide, unveiling a hidden symphony of signals, from the vibrant buzz of electronic devices to the melodic pulse of communication networks. It reveals the pulsating heartbeat of technology and transforms the chaotic hum of modern life into an awe-inspiring opus. E̶q̶u̶a̶l̶s̶ c̶o̶m̶e̶s̶ w̶i̶t̶h̶ t̶h̶e̶ p̶r̶a̶c̶t̶i̶c̶a̶l̶ c̶u̶s̶t̶o̶m̶ c̶a̶s̶e̶ t̶o̶ k̶e̶e̶p̶ t̶h̶e̶ d̶e̶v̶i̶c̶e̶ p̶r̶o̶t̶e̶c̶t̶e̶d̶ w̶h̶i̶l̶e̶ y̶o̶u̶ t̶r̶a̶v̶e̶l̶ o̶r̶ j̶u̶s̶t̶ w̶a̶l̶k̶ i̶n̶ t̶h̶e̶ n̶i̶g̶h̶t̶ t̶r̶y̶i̶n̶g̶ t̶o̶ r̶e̶c̶o̶r̶d̶ t̶h̶e̶ s̶a̶m̶p̶l̶e̶ o̶f̶ t̶h̶e̶ c̶e̶n̶t̶u̶r̶y̶ (NOT AVAILABLE AT THE MOMENT)
