description: An EMF/RF landscape receiver that makes audible electromagnetic
  emissions and radio frequencies from electronic devices, using two coils and
  two antennas, with a soft clipping compressor on the output buffer.
details: |-
  Equals is a portal to an invisible realm of sound, merging the worlds of electromagnetic waves and human perception. Equals makes audible both electromagnetic emissions and radio frequencies from all manner of artificial signal-sources such as power lines, all electronic gadgets and machines, 2.4 GHz WIFI, cellphones, power sockets, computers, phones, and many other electronic devices. After researching for months EMF and RF signals I have decided to give the user a wider range of possibilities using two coils that will provide a oncoming window into the imperceptible transmissions from all electronic devices and two antennas allows access to higher frequency wide band emissions such radio signals, and improving the existing EMF sniffer designs you can find around by adding a warm soft clipping compressor on the output buffer. As you wander through bustling city streets, Equals becomes your guide, unveiling a hidden symphony of signals, from the vibrant buzz of electronic devices to the melodic pulse of communication networks. It reveals the pulsating heartbeat of technology and transforms the chaotic hum of modern life into an awe-inspiring opus.
