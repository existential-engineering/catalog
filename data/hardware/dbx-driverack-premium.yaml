description: Loudspeaker management system providing processing between mixer
  and amplifiers to optimize and protect loudspeakers, featuring improved AutoEQ
  and AFS algorithms with Ethernet control via mobile devices.
details: |-
  The DriveRack Premium provides comprehensive processing between mixer and amplifiers to optimize and protect loudspeakers. It features improved AutoEQ and AFS (Advanced Feedback Suppression) algorithms for automatic speaker optimization, along with an input delay module for time alignment.

  The unit includes a full suite of input processing tools including dbx Compression, AFS Advanced Feedback Suppression, Graphic EQ, 8-Band Parametric EQ, and Subharmonic Synthesis. Output processing includes crossover options (full range, 2-way, 3-way), 8-band parametric EQs per output, dbx Limiting, and driver alignment delays.

  Ethernet control is supported via Android, iOS, Mac, and Windows platforms, allowing remote configuration and monitoring of the PA system. Updated setup wizards make it straightforward to optimize the system for a wide variety of loudspeaker configurations.

  Note: This product is distributed in China only.
specs: |-
  - Availability: China Only
  - Control Platforms: Android, iOS, Mac, Windows
  - Input Processing: dbx Compression, AFS Advanced Feedback Suppression, Graphic EQ, 8-Band Parametric EQ, Subharmonic Synthesis
  - Output Processing: Crossover (full range, 2-way, 3-way), 8-Band Parametric EQs, dbx Limiting, Driver Alignment Delays
  - Recommended Markets: Installed, Portable, Tour
