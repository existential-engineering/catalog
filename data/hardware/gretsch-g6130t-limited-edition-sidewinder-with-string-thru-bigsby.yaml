details: |-
  The Limited Edition Gretsch Sidewinder is for the player looking for classic Gretsch twang and 'bite' in a unique and exclusive package. Featuring a pair of custom-wound TV Jones pickups and a chambered mahogany body with flame maple top, the Sidewinder delivers a truly venomous tonal experience.

  The flame maple top paired with chambered mahogany body delivers the signature Gretsch resonance and harmonic richness. Custom-wound TV Jones pickups provide classic twang and bite with versatile tonal controls.
