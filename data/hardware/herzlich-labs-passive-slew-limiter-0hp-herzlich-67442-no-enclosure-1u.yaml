description: A passive utility that limits the slew rate of digital signals,
  gates, triggers, and square waves, with two settings ranging from modest
  slewing to extreme softening.
details: |-
  There's no need to drag this out, but... Look, envelope generators are cool and all, but have you ever found yourself with a bunch of digital signals, gates, triggers, square waves, and just... wondered if they could be a bit softer around the edges? Maybe, you've wanted to really drag things out, limit the slew rate to an absolute glacial pace? I've got great news: you have the option now. With two settings, ranging from modest slewage to absolute slewstruction with the kind assistance of the attached knob, you can absolutely sludge up your signals in pleasing ways. Plug it in, plug it out and get slewse with it, regardless of whether you add a bit of acid slew to your basslines or whether you embody the power of a thousand stoner metal bands and completely destroy the input signal.
specs: |-
  - Limit the slew rate of anything you input
  - Results ranging from tasteful slewification to slewpocalypse
  - Passive design: no external power, no batteries
