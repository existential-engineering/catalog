id: 5QL5SPDzmnyTMmabuTRvu
name: P-Split Stereo
manufacturer: lehle
primaryCategory: di-box
categories:
  - routing
  - utility
url: https://www.lehle.com/lehle-p-split-stereo
description: The LEHLE P-SPLIT STEREO combines passive intelligent splitting
  with the highest possible signal fidelity in a double pack. The classic
  solution for splitting, eliminating hum, balancing and reamplification in
  recording applications, now appears in a doubled version and this time adds
  the passive summing of signals.
details: |-
  Two LEHLE TRANSFORMER HZ are working at the heart of the LEHLE P-SPLIT STEREO, galvanically isolating the particular ISO outputs from each other, eliminating any possibility of ground loops and hum. The LEHLE TRANSFORMER HZ process both high and low impedance with uncompromising sound quality. At the ISO outputs you can pick off the signal either unbalanced or balanced, regardless of the signal type in the rest of your rig.

  Per channel there is a gold plated phase switch and ground switch. This keeps you flexible and your system safe.

  A classic application is the isolation of a stereo signal, enabling you to use two amplifiers in stereo and send the stereo signal to a mixer or the audio interface of your DAW at the same time.

  Another useful method for the LEHLE P-SPLIT STEREO can be as an effective hum suppressor. If you connect two electronic devices, background noise can appear, caused by ground loops. Here the LEHLE P-SPLIT STEREO provides a simple, but highly effective solution: whilst installed between the two units, this problem solver isolates the input from the output. Thanks to its ability to pick off balanced signals on the ISO outputs, the LEHLE P-SPLIT STEREO is also eminently suitable for use as a high-quality compact stereo DI box for all types of active signals.

  According to which sockets are occupied, the LEHLE P-SPLIT STEREO also works as a passive summing box: your effects pedal board can be wired in stereo, but you output in mono if connected to only one amplifier. If, on the other hand, you connect only one mono signal to the input, the LEHLE P-SPLIT STEREO works as a three-way split for up to three amplifiers.
specs: |-
  - Stereo split, summing, double DI box and problem solver
  - Hum-free and lossless splitting and isolating
  - Two high-impedance LEHLE TRANSFORMER HZ
  - Phase and ground switch per channel, gold plated
  - Suitable for unbalanced or balanced signals
  - Works as a passive summing box or as a three-way split from one mono input
  - Passive, does not need power
