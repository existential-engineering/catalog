description: Bowed strings vibrate in a left and right motion. That left and
  right energy is transferred through the “heart" of the bridge. Instead of just
  sticking a pickup to the violin, we created a pickup that became one with the
  bridge.
details: |-
  Bowed strings vibrate in a left and right motion. That left and right energy is transferred through the “heart" of the bridge. Instead of just sticking a pickup to the violin, we created a pickup that became one with the bridge. We cast a featherweight sensor into an elite-quality maple bridge right near the heart and offered it as a bridge replacement system. By integrating the sensor into the bridge, we maximized energy transfer and sensitivity. The transducer was designed to respond to the bridge’s left and right motion, significantly reducing finger and body noise, while lowering the possibility of feedback and fully capturing the violin’s natural dynamics.
specs: |-
  - Piezo transducer cast into an elite-quality Despiau "Two Tree" maple bridge
  - Bridge-replacement system for 4-string violin
  - Passive (no preamp or power required; external preamp recommended)
  - Responds to the bridge's left-and-right motion for even string-to-string balance
  - Highly feedback-resistant
  - External jack mount or non-terminated output options available
  - Requires professional installation; pairs well with the Venue DI or Para DI
