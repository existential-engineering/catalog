details: |-
  The ProMedia Lumina 2.1 is a reimagined version of Klipsch's iconic 1999 ProMedia computer speaker system, updated with modern connectivity and design for contemporary workstations and gaming setups.

  The system features Microtractrix horn tweeters in each satellite speaker, delivering pinpoint clarity suited for content editing, gaming, music, and movie playback.

  Connectivity options include USB-C, 3.5mm AUX, and Bluetooth 5.3, allowing flexible use across computers, mobile devices, and gaming consoles.

  Each satellite speaker houses six individually controllable LEDs offering five ambient light modes, with three color-changing options manageable via the Klipsch Control app. The Klipsch Control app provides precision EQ adjustment, lighting customization, night mode, and music-reactive lighting.
