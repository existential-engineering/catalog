description: Bundle for classic analog drum sounds.
details: |-
  A bundle of four re-issued classic Hexinverter drum modules: the Mutant Bass Drum, the Mutant Snare, the Mutant Clap and the Mutant Hihats.

  The modules suit anyone with a taste for classic TR808 and TR909 sounds, with a greatly expanded tonal range through voltage control over parameters and optional high distortion.

  The four modules were redesigned by Erica Synths in close collaboration with Hexinverter.

  In September 2022 Stacy Gaudreau, the founder of Hexinverter Électronique, announced the closing of its operations. Following that announcement, Erica Synths in cooperation with Hexinverter Électronique took over the manufacturing, sales and support of several Hexinverter Électronique modules so that the designs would keep on inspiring musicians. The hardware was redesigned while all functionality of the original modules was retained, and support is provided for the reissue modules only.
