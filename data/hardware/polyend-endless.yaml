description: Endless is a platform that helps turn your ideas into effects.
  Describe or code any effect you want, load it, and play endlessly.
details: |-
  Endless is a platform that helps turn your ideas into effects. Create any effect you want by describing it in plain language or coding it, then load it, play, and repeat endlessly. It runs one effect at a time.

  The unique Playground (beta) system turns your text description into a playable device in minutes. The AI layer interprets your prompt and combines or adapts a large library of proprietary DSP algorithms Polyend has developed over many years, with multiple specialised agents handling parsing, algorithm selection, code generation, and automated testing. Registered Endless owners can access the Playground, and each new pedal comes with 2000 Playground tokens ($20 of tokens).

  For programmers, effects can be coded in C++ using Polyend's open source SDK and examples provided on GitHub. Community effects can be shared and downloaded for free, and you own what you create, so patches can be sold rather than shared.

  Endless features a custom-machined aluminum enclosure and knobs with swappable magnetic front plates (a blank plate is included, with additional designs available). Audio is stereo in and out at 48 kHz / 24-bit through clean, low-noise, studio-grade analog input and output preamps. A 720 MHz ARM Cortex-M7 provides the real-time DSP core.

  The pedal accepts any 9V DC power (center-negative or positive polarity, 200 mA required), supports TRS expression pedal input, and offers simple drag-and-drop patch loading over USB-C.
specs: |-
  - Runs one effect at a time
  - Playground (beta) text-to-effect generation system
  - Open source SDK and C++ examples on GitHub
  - Real-time DSP core: 720 MHz ARM Cortex-M7
  - Stereo in and out at 48 kHz / 24-bit
  - Clean, low-noise, studio-grade analog input and output preamps
  - Swappable magnetic front plates (blank plate included)
  - Custom-machined aluminum enclosure and knobs
  - TRS expression pedal support
  - Drag-and-drop patch loading over USB-C
  - Power: 9V DC, center-negative or positive polarity, 200 mA required
  - Height (with knob): 2.2 inches (5.5 cm)
  - Width: 4.72 inches (12.0 cm)
  - Depth: 3.15 inches (8.0 cm)
  - Weight: 0.88 pounds (0.4 kg)
  - In the box: Endless, Endless Delay/Blank magnetic faceplate, quick-start guide, $20 in Playground tokens
