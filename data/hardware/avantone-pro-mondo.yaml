details: |-
  The Mondo is a dynamic kick drum microphone with focused voicing designed to
  punch through the busiest mix. Now in its 2nd Generation, it features bold,
  aggressive, fast response requiring minimal EQ adjustment.

  Construction uses die cast housings, brass, steel, and brushed aluminum parts
  with no plastic components. Precision machined inserts provide shock mount
  compatibility. Designed for both studio and live touring applications.
