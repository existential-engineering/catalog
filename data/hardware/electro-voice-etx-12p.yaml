  - maxSpl: 135 dB peak
  - amplifierPower: 2000 W Class-D
  - coverage: 90 x 60 degrees (H x V)
  - woofer: SMX2120 300 mm (12-inch)
  - tweeter: DH3-B 1.25-inch titanium compression driver
  - crossoverFrequency: 1600 Hz
  - dimensions: 613 x 381 x 400 mm (24 x 15 x 16 in)
  - weight: 23.6 kg (52.0 lb)
  - shippingWeight: 26.8 kg (59.1 lb)
  - powerConsumption: 100-240V~, 50-60 Hz, 1.6-0.8 A
  - enclosureMaterial: 18 mm plywood with EVCoat finish
  - grille: 16 AWG steel with powdercoat
  - suspension: 8 M10 threaded mounting points
