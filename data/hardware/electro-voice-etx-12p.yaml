name: ETX-12P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/etx-12p/
description: The ETX-12P is a 12-inch two-way powered loudspeaker for
  high-output portable and installed sound applications. A 2000 W Class-D
  amplifier with integrated FIR-Drive DSP drives an SMX2120 12-inch woofer and a
  DH3-B 1.25-inch titanium compression driver, delivering up to 135 dB peak SPL
  with 90 x 60 degree coverage. The 18 mm plywood enclosure features an EVCoat
  finish, 16 AWG steel powdercoated grille, and eight M10 suspension points
  compatible with optional array brackets, truss adapters, and wall-mount
  hardware.
details: >-
  2000 W Class-D power amplifier with integrated FIR-Drive DSP


  Up to 135 dB peak SPL output


  SMX2120 300 mm (12-inch) woofer


  DH3-B 1.25-inch titanium compression driver


  90 x 60 degree (H x V) coverage pattern


  Crossover frequency: 1600 Hz


  Eight M10 suspension points for rigging


  Compatible with optional array brackets, truss adapters, and wall-mount
  brackets


  18 mm plywood enclosure with EVCoat finish


  16 AWG steel grille with powdercoat


  Integrated DSP with music preset for optimized response
specs: |-
  - frequencyResponse: 55 Hz - 20 kHz (-3 dB)
