details: |-
  Ultra-Shallow Pancake Shell: The Ultra-Shallow Pancake Shell is 3.5" deep for the tom and floor tom. The single head produces a crisp and punchy sound with short sustain.

  Single Carry Design: The ultra-shallow shells allow the tom-tom, floor-tom, snare drum, and bass drum to all fit into just a single specially designed portable bag.

  Vintage Inspired Bass Drum Hoop: The bass drum features natural wood hoops for a vintage inspired look and feel.
