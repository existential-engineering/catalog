details: |-
  The Manley Neo-Classic 250W Monoblock represents the culmination of extensive amplifier design evolution, delivering high-power vacuum tube amplification with exceptional musicality and dynamic command. This push-pull, all-tube architecture combines robust output capability with refined sonic character, providing effortless control over demanding loudspeaker loads. Built with custom-wound Manley IRON® output transformers and premium tube complement, the Neo-Classic 250W offers both technical precision and the musical engagement that defines high-end tube amplification.

  The Neo-Classic 250W provides selectable operating modes optimized for different musical priorities. Triode mode delivers 140 watts with emphasized midrange dimensionality and harmonic richness characteristic of triode-connected output stages. Ultra-Linear mode provides 250 watts of output power with extended dynamic capability, deeper bass extension, and increased headroom for driving complex loudspeaker impedances. This mode flexibility allows matching amplifier characteristics to both musical content and listening preferences.

  The amplifier architecture emphasizes instantaneous power delivery for transient accuracy and bass control. High-capacity reservoir capacitors in the high-voltage power supply provide substantial energy reserves for dynamic peaks and low-frequency impact. Custom-wound Manley IRON® output transformers, refined through continuous in-house development, ensure wide bandwidth at full power with low distortion and excellent damping factor across the audio spectrum.

  The Neo-Classic 250W is designed for long-term reliability through conservative tube operation. High plate voltages combined with moderate current loading extend output tube service life while maintaining sonic performance. Front-panel access to individual bias adjustment points simplifies routine maintenance procedures. Soft-Start circuitry and Ever-Warm standby mode minimize thermal stress during power-up while ensuring the amplifier remains ready for immediate operation.
specs: |-
  - High-power tube amplification with musical authority
  - All-tube push-pull monoblock delivering 250W in Ultra-Linear mode
  - Switchable Triode (140W) and Ultra-Linear (250W) operating modes
  - High-capacity reservoir capacitors for exceptional dynamic response and bass control
  - Hand-assembled in California with Tungsol EL34B output tubes
  - Power Output: 140W (Triode), 250W (Ultra-Linear)
  - Tubes: 10 x Tungsol EL34B (output, per monoblock)
  - Damping Factor (Triode): 13.1
  - S/N Ratio: 94 dB A-WGT (at 1W)
  - Inputs: Balanced XLR (Transformer-Coupled) & Unbalanced RCA
  - Dimensions: 19″ × 13″ × 9″
