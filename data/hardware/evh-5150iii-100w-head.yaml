description: |-
  The amp that first lanched the EVH line, the 5150III® 100-Watt Head is ideal for almost any playing style you can think of. From rich clean tones to raw rhythms and soaring high gain leads, it does it all at drummer-beating volume. This is the Holy Grail of Tone that Eddie Van Halen has chased his whole life  -  a truly clean channel, a super-heavy crunch channel and an off-the-scale overdrive channel you simply won't believe. Each of the three channels has gain, low, mid, high, volume and presence controls. Under the hood, this amp features eight JJ ECC83S (12AX7) preamp tubes and four JJ 6L6 matched power tubes. Sporting unmistakable EVH style, this head is wrapped in a thick textured black or ivory vinyl with black steel grille and white front control panel.

  A four-botton footswitch is included, while a high-quality fitted cover is available as an optional accessory item.
