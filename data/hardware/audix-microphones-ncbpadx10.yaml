details: |-
  The NCB P +ADX10 bundles the AUDIX Novacore NCB P digital bodypack transmitter with the AUDIX ADX10 cardioid lavalier condenser microphone — a complete, performance-ready wireless lavalier system for clergy, presenters, performers, and broadcast talent who need discreet, hands-free wireless audio straight out of the box. The ADX10's miniature cardioid capsule delivers natural vocal clarity with strong off-axis rejection, making it well suited for podium applications, theatrical productions, and houses of worship where feedback control and clean, unobtrusive placement are equally important.

  The NCB P transmitter accepts the ADX10 via its TA3M input (TA3F connector, Pin 2 hot) and delivers AES-256 encrypted UHF digital transmission across a 48 MHz tuning range with less than 3 ms latency. One-touch IR sync pairs to any Novacore receiver in seconds. Variable input gain from –12 to +18 dB in 6 dB steps lets engineers dial in the ADX10's signal precisely at the transmitter. A dedicated 3.5 mm remote mute input supports an external latching or momentary switch (not included) for hardwired mute control at a podium or from front-of-house.

  The bundle operates on 2× AA alkaline batteries or 1× NCLB rechargeable lithium-ion battery with 9+ hours of runtime, with USB-C charging built into the transmitter body. The NCB P is also compatible with other AUDIX lavalier and headset microphones — including the L5, L5O, HT5, HT7B3P, and HT7BG3P — and any third-party mic terminated with a TA3F connector, allowing the system to grow as application needs evolve.
specs: |-
  - System: NCBP bodypack transmitter + ADX10 cardioid lavalier condenser (no receiver)
  - Transmitter mic input: TA3M (3-pin mini), TA3F connector, Pin 2 hot
  - Transmitter input gain: -12 to +18 dB in 6 dB steps
  - Remote mute input: 3.5 mm (latching or momentary switch)
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Encryption: AES-256
  - Power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours, USB-C charging
