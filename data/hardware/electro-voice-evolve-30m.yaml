url: https://products.electrovoice.com/na/en/evolve-30m/
description: The EVOLVE 30M is a compact, portable column array PA system for
  solo musicians, small groups, and venues that need single-trip portability. A
  powered 10-inch subwoofer houses a 1000 W Class-D amplifier (500 W LF / 500 W
  HF) and feeds a column array of six 2.8-inch neodymium drivers behind
  proprietary waveguides, delivering 123 dB peak SPL with ultra-wide 120 x 40
  degree asymmetrical coverage tuned for both seated and standing audiences. An
  integrated eight-channel digital mixer provides four XLR/TRS combo mic/line
  inputs (with phantom power), a Hi-Z instrument input, stereo combo inputs, RCA
  and 3.5 mm consumer inputs, Bluetooth audio streaming, plus XLR mix and aux
  outputs. Four factory presets (Music, Live, Speech, Club), three-band system
  EQ, a seven-band graphic EQ, 30 studio-quality effect presets across two FX
  channels, and five user presets round out the DSP. The EV QuickSmart Mobile
  app provides BTLE remote control of up to six EVOLVE 30M systems
  simultaneously. The column and two-piece magnetic-latching aluminum pole pack
  into the included backpack for fast setup.
details: >-
  1000 W Class-D amplifier (500 W LF + 500 W HF) delivering 123 dB peak SPL


  Six 2.8-inch neodymium drivers in column array with proprietary waveguides


  10-inch powered subwoofer with laminar-flow vent design


  Ultra-wide 120 degree horizontal coverage


  Array-formed 40 degree asymmetrical vertical coverage for seated and standing
  audiences


  Eight-channel onboard digital mixer with LCD single-knob interface


  Four factory presets: Music, Live, Speech, Club


  Five user-programmable presets with store and recall


  Three-band system EQ and seven-band graphic EQ (Mixer mode)


  30 studio-quality effect presets across two FX channels (chorus, delay,
  flange, reverb)


  Phantom power on mic/line inputs


  Bluetooth audio streaming (high-resolution, low-latency)


  EV QuickSmart Mobile app (iOS/Android) controls up to six systems via BTLE


  Two-piece aluminum pole with internal wiring and magnetic latching


  Integrated backpack carry case for column and pole


  15 mm plywood subwoofer enclosure with 18-gauge steel grille


  Available in black or white
