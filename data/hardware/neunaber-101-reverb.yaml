description: The 101 Reverb is a compact solid-state guitar amplifier delivering
  up to 50 watts, featuring a 3-band active EQ, gain, limiter, reverb, and an
  effects loop.
details: |-
  Featuring an interesting new take on the usual three-knob EQ section, the Bass and Treble controls use traditional "tone stack" technology, yielding a familiar bright chime based on 50 years of tradition, while the active Mid control provides a more strongly voiced cut/boost function for increased versatility. Increasing the Mid control boosts the frequencies that give an aggressive "D-Style" bite to the sound, while decreasing Mid brings out that familiar clean-60's Blackface tone. Weighing only 2 pounds the 101 reverb is so light you'll think we forgot to put the guts in! Even with the same compact footprint, it has more than enough power to bring any cabinet to life! Fits in our Block Case 2.0 ! -
