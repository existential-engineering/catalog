details: |-
  Main feature: Flat frequency response headphones with angled dynamic speakers and calibration data. Ideal for: Mixing and mastering engineers or creators that work in many different studios in music, radio, tv or multimedia productions and need a reliable reference across all monitoring setups. Class : Reference
  Model No: S5X 1.1
  Origin : Made in EU, Slovenia

  SPEAKER

  ACOUSTICS

  HEADBAND

  CABLE

  USC CALIBRATION

  Calibration is the "final mile" in delivering perfectly flat frequency response. All our headphones are very well tuned out of the box and measured in quality control. By measuring every individual unit we can capture any deviations in sound quality that comes from material tolerances for a specific unit. Calibration fixes these and frequency response beyond what's possible with acoustic design alone. Unit specific calibration can achieve an incredibly low tolerance of approximately ~1dB to the selected frequency target. For illustration purpose, generic software calibrations like Sonarworks Sound ID or Waves NX can only achieve about ~3dB. Unit Specific Calibration (USC) includes a software plugin and a calibration data file. The plugin comes in AU, VST and AAX format for Mac and Win users. The calibration data file is in XPS format that enables manual import to any 3rd party EQ plugin or hardware.
specs: |-
  - Dynamic Neodymium speaker
  - 108dBSPL @ 0 dBu RMS 1KHz 30ohm output - that makes them work with smart devices too
  - Left / right matched speakers (+/-1dB SPL tolerance, sweep, range 100Hz-10kHz in the free field at 1cm distance)
  - 50mm diameter, PET 25u membrane
  - 50 Ohms , 2-layered coil
  - Replaceable using home tools
  - Earpads with outer diameter of 95mm (3.75in), an inner diameter of 57.5mm (2.25in) and a depth of a 20mm (0.8in), +/-2.55mm. Made of artificial leather and velour.
  - THD < 0.074% @ 1kHz @ 85dBSPL with sweep source measured with IEC 60318-1 ear simulator.
  - Variation in frequency response in band from 20Hz to 20kHz ~12 dB SPL using sweep and IEC 60318-1 ear simulator.
  - Front-to-back air pressure equalization controlled with Saati flow resistor 3.2Ohms( ² )/1cm ².
  - Ex-centric and angled speaker in a conical radiation chassis with an optimal sound stage for best translation of instrument positions in stereo or immersive formats.
  - Frequency response target for best translation of balance and artificially placed objects in stereo or downmixed (binaural) immersive projects.
  - Clamping force set to achieve target frequency response with industry-standard bitragional diameter of 14.3cm (KEMAR) on IEC60318-4 ear simulator.
  - Artificial leather strap and powder coated stainless spring steel are both replaceable using home tools.
  - 360 earcups rotation and sliders for quick and easy head size adjustments.
  - 2m long (6.5ft) and easy detachable silicone cable with enameled OFC core to ensure minimal signal distortion.
  - Ball-locking mechanics on the embedded 2.5mm jack plugs.
  - Screw-on adapter from 3.5mm to 6.3mm jacks (1/8 to 1/4 inch)
  - OLLO USC plugin (AU, VST, AAX)
  - calibration data in XPS file
  - compatibility with Realphones and Waves Nx
  - export to any 3rd party EQ
