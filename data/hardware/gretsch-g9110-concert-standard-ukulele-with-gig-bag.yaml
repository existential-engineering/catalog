details: |-
  Featured worldwide in popular music of all styles, the ukulele has experienced a phenomenal resurgence in recent years. At the request of Gretsch fans, Gretsch reintroduced a selection of classic uke best sellers offering unparalleled tone and quality at sensational low prices.

  The G9110 Concert features a 15" scale length, mahogany top, back and sides, mahogany neck and ovangkol fingerboard with 16 frets (12 to body). It includes an ovangkol bridge, bone nut and saddle, open-back geared tuners, Aquila Nylgut strings and comes in a fitted gig bag. The instrument is available in Vintage Mahogany Stain with an open-pore semi-gloss finish designed for an organic appearance.
