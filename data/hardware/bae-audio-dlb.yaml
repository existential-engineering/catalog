details: |-
  The DLB incorporates 2 slots for 500-series modules in a compact desktop or rackmount form factor. It is built with the hand-wired construction that BAE Audio is known for, using a solid steel chassis for durability and shielding.

  The power supply is intentionally overbuilt to handle the demands of third-party 500-series modules alongside BAE's own units. Inputs and outputs are accessible on either side of the chassis, allowing flexible placement in a studio environment.
specs: |-
  - Slots: 2 × 500-series module slots
  - Power Requirements: 115/230 VAC, 36W
  - Power Output: ±16 VDC @ 1.6A (0.8A per rail); 48 VDC @ 0.1A
  - Weight (Empty): 6 lbs / 2.72 kg
  - Dimensions: 5.3"W × 4"L × 11"D
