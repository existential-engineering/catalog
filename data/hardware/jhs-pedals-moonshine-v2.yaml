details: |-
  Are you looking for an overdrive that is not transparent and adds its own character and attitude? The Moonshine V2 is for you. Our Moonshine V2 overdrive is a highly unique and massively tweaked version of the most famous overdrive ever created and housed in a little green enclosure. Blues, rock, country, jazz, and even hardcore/metal players will find this is an indispensable tool for shaping and creating unique mid heavy tones for almost any need.

  CLEAN BLEND
  The Moonshine V2 is still the core tone of the version one and retains the simple Volume, Tone, and Drive knobs. However on the Moonshine V2 we added a new Clean knob to blend in any amount of clean signal to your tone!

  CONTROLS
  The simple 2-position "Proof" toggle gives you everything from low gain amp-like breakup with powerful colored boost settings to grinding, heavy overdrive that reaches to the very edge of cranked amp distortion. In the down position, you'll find the highest gain settings, lots of saturation and sustain and the most mid-range goo available. In the up position are the more open and forceful crunchy tones that will make any amp beg for mercy. The up position also adds more overall volume and more headroom to those searching for cleaner applications. The tone control goes down as smooth as Grandpa's White Lightning, with none of the harsh ice-pick characteristics that many overdrives often have in the brighter settings.

  CHARGE PUMP
  Just like our SuperBolt pedal, the Moonshine uses an internal 9V to 18V charge pump that allows it to run on normal 9V but converts it internally to 18V for an enormous amount of headroom, added low-end, and more overall punch.

  DUMBLE-ESQUE
  On another note, you might find a few Dumble-esque lead settings that will have you feeling like you saved a cool $100,000 in search of that sacred tone. It also kills on bass guitar, the reason it was originally designed.
