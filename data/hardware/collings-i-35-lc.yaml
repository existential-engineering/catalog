description: The I-35 LC is a semi-hollow electric guitar built using a custom
  laminate construction process developed by Bill Collings and his R&D team. It
  features a maple laminate body with maple/spruce center block, Honduran
  mahogany neck, and Lollar Low Wind Imperial Humbuckers. The result is a drier,
  woodier, mid-forward tone characteristic of classic semi-hollow guitars.
details: |-
  The Collings I-35 LC uses a proprietary custom-laminated construction process to achieve the tonal character of vintage semi-hollow instruments. The body is 15" wide with unbound f-holes and non-grained ivoroid binding on the body and fingerboard. The Honduran mahogany neck has a C-shape profile, 24 7/8" scale length, 12" fingerboard radius, and a 1 11/16" nut width. The rosewood fingerboard features mother-of-pearl long dot inlays (5mm non-tapered) and medium 18% nickel-silver frets. Electronics include Lollar Low Wind Imperial Humbuckers wired in a 50s-style configuration with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware is nickel-plated throughout: Kluson ABR-1 bridge, Kluson stop tailpiece, and Gotoh tuners with Collings logo. Finished in high-gloss nitrocellulose lacquer. Comes with D'Addario NYXL1149 strings and a deluxe hardshell case.
specs: |-
  - Body: Semi-hollow maple laminate (top, back, sides) with maple/spruce center block
  - Body width: 15"
  - Body length: 17 5/8"
  - Body depth: 1 5/8"
  - Total length: 40"
  - Neck: Honduran mahogany, C-shape profile
  - Neck joint: Extra-long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard radius: 12"
  - Scale length: 24 7/8"
  - Nut width: 1 11/16"
  - Inlays: Mother-of-pearl long dots (5mm non-tapered)
  - Frets: Medium 18% nickel-silver
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Wiring: 50s-style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Bridge: Kluson ABR-1 (nickel-plated zinc with retaining wire)
  - Tailpiece: Kluson stop tailpiece (nickel-plated zinc, steel studs)
  - Tuners: Nickel Gotoh with Collings logo
  - Binding: Non-grained ivoroid (body and fingerboard)
  - Soundholes: Unbound f-holes
  - Peghead veneer: Ebony with mother-of-pearl Collings logo
  - Finish: High-gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011" - .049")
  - Case: Deluxe hardshell
