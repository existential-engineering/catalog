description: Dual-effect pedal with a crunch or lead drive channel and a delay
  or reverb wet channel, plus an effects loop, trails and true bypass.
details: |-
  The DDR combines two of the most common guitar effects, drive and wet, into one pedal. The drive section offers two overdrive styles: Crunch, a gritty British tube-amp combo sound, and Lead, a warm, dark, mid-pushed overdrive.

  The wet side of the pedal covers delays and reverbs on a three-knob set of Blend, Decay and Time controls. A Vintage/Modern switch toggles between spring and plate reverb or analog and digital delay, and a centre toggle selects which family the wet channel runs.

  A built-in effects loop allows other pedals to be inserted between the drive and wet sections, or the DDR can run on its own. A side-mounted selector chooses true bypass or trails.
