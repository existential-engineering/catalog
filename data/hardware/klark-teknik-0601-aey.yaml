id: njzUkIp9nn_trge8xOOyI
name: DN1248PLS-AT
manufacturer: klark-teknik
primaryCategory: routing
categories:
  - preamp
  - rack-mount
  - outboard
url: https://www.klarkteknik.com/en/products/0601-AEY
description: The DN1248PLS-AT is the all-transformer variant of Klark Teknik's
  12-channel microphone splitter, intended for installations where every output
  feed must be galvanically isolated. Twelve input channels each drive four
  transformer-balanced outputs, eliminating ground loops and DC continuity
  between consoles, broadcast trucks and recording rigs sharing the same source.
details: |-
  Each input passes through a MIDAS HERITAGE microphone preamplifier adapted from the Heritage console range. From the preamplifier the signal feeds four independent transformer-balanced outputs. The transformer isolation provides full common-mode rejection, RFI immunity and the gentle saturation behaviour that broadcast engineers favour for vocal source feeds.

  Independent +30 dB and -15 dB gain switches, +48 V phantom power and earth-lift switches are provided per channel. A solo bus with integrated headphone amplifier and level control enables pre-distribution monitoring. Front and rear duplication of Input 1 and Output 1 simplifies cable looming on stage racks.

  Applications include multi-truck broadcast events, large festival splits between front of house, monitor, record and broadcast positions, and installations where ground-loop avoidance is non-negotiable. The AT variant suits work where every receiving console may have a different earth reference.
specs: |-
  - 12 channels x 4 transformer-balanced outputs
  - MIDAS HERITAGE microphone preamplifier per channel
  - Full galvanic isolation on all 48 outputs
  - +30 dB and -15 dB gain switches per channel
  - +48 V phantom power per channel
  - Earth lift per channel
  - Solo bus with headphone amplifier and level control
  - Input 1 and Output 1 duplicated front and rear
  - 3 U rackmount
  - Auto-ranging universal switch-mode power supply
  - Designed and engineered in the United Kingdom
