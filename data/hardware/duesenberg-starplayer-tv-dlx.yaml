description: The 2026 refresh keeps things focused, with new finishes, an
  updated neck pickup, and a cleaner, more intuitive control layout. It's a
  thoughtful update that sharpens what's already there, refining both feel and
  function without changing the character that defines the Starplayer TV Deluxe.
details: |-
  The Starplayer TV Deluxe is a semi-hollow electric guitar with a solid centerblock, double f-holes, an arched top and a flat back, built on the same platform as Duesenberg's original Starplayer TV line. The body measures 46 x 34 cm with sides 4.5 cm deep. The top is laminated Spruce on the Catalina Green Burst finish and flamed Maple on the Light Antique Burst, with laminated flamed Maple back and sides, 5-ply multibinding, double-bound f-holes, a transparent floating pickguard and a PUR finish.

  The neck is a set, one-piece Maple neck in a Medium D shape, 42.5 mm at the nut and 52 mm at the twelfth fret, with an Indian Rosewood fingerboard of 305 mm radius, pearloid diamond inlays, 22 jumbo frets on a 648 mm scale and a steel dual-action truss rod. Duesenberg Plek-processes every fretboard for level, buzz-free frets across the neck, after which the instrument is hand-finished and set up by one of the company's luthiers, who signs it inside.

  The 2026 update revises the electronics and the finish palette. Both bridge and neck positions now carry a Duesenberg GrandVintage Humbucker, which Duesenberg describes as classically voiced and noiseless, and the controls are simplified to a master volume, a master tone and the rotary 3-way pickup selector at the cutaway horn. Catalina Green Burst and Light Antique Burst are named as the new finishes.

  Hardware is nickel, with Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, Duesenberg Standard strap pins that accept Straplocks and Duesenberg Custom 10/50 strings. The vibrato is the Duesenberg Radiator Tremola, which the company presents as the evolution of its own vibrato design: needle and nylon bearings for a precise and responsive feel, a freely rotating and adjustable arm, stable tuning and strings threaded through for quick changes. The Z-Tuners are designed for a smooth, precise feel and allow the cut-off string end to be hidden inside the tuner shaft.

  The guitar ships with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case, together with a signed certificate of authenticity and all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Pearloid diamonds
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Body type: Semi-hollow with sustain block, bent sides, 2 f-holes
  - Top: Laminated Spruce (Catalina Green Burst), Flamed Maple (Light Antique Burst)
  - Back: Laminated flamed Maple, flat
  - Sides: Laminated flamed Maple
  - Dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: 5-Ply Multibinding
  - Pickguard: Transparent, floating
  - Finish: PUR
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Radiator Tremolo
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Grand Vintage Humbucker
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Case: Custom Line Case (included)
  - Authenticity: Signed Certificate of Authenticity
  - Tools: All required allen keys (included)
