details: |-
  The Super Gold 10 (SGM-10) is a 2-way passive standmount loudspeaker built around Tannoy's Dual Concentric driver — a 10" paper-pulp cone woofer and 1.3" aluminium/magnesium alloy dome tweeter on the same axis for point-source imaging. Front-mounting two-way energy control (±3 dB shelving/slope) for room compensation. Front-firing bass ports for flexible placement. Five 4 mm 24-carat gold-plated binding posts support bi-wiring. Heritage from the 1980s Monitor GOLD used in professional mixing and mastering studios.
specs: |-
  - frequencyResponse: 40 Hz - 30 kHz ± 6 dB
  - sensitivity: 89 dB (1 W @ 1 m)
  - impedance: 8 Ω
  - powerHandlingContinuous: 100 W
  - powerHandlingPeak: 400 W
  - recommendedAmplifierPower: 20-200 W
  - crossoverFrequency: 1.2 kHz
  - lowFrequencyDriver: 10" paper pulp cone, 52 mm edge-wound voice coil
  - highFrequencyDriver: 1.3" aluminium/magnesium alloy dome
  - dimensionsHWD: 350.5 x 309 x 523.2 mm
  - netWeight: 18.5 kg
