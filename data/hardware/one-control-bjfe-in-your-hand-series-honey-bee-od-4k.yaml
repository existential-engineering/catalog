details: |-
  BJFE in Your Hand Series

  Congratulations on acquiring a BJFE in Your Hand Series pedal! Handmade in Japan, this pedal masterfully captures the character and craftsmanship of the original BJFE model with precision, elegance, and tonal fidelity. Designed in collaboration with One Control, the BJFE in Your Hand Series combines a unique aesthetic with unparalleled quality, ensuring an exceptional musical experience that lets more players discover and enjoy the classic BJFE sound. Features

  • Handcrafted Excellence: Each pedal is meticulously produced by skilled artisans, featuring a hand-wired build with premium components. • Authentic BJFE Sound: Approved by BJFE founder BJF himself, this pedal series mirrors the iconic BJFE appearance and tone in every detail. • Premium Housing: Constructed using One Control's original machined aluminum enclosure for durability and distinctive style. • Superior Audio Parts: High-grade carbon film resistors and metal film capacitors create the rich, dynamic tones that define BJFE sound. • Reduced Noise: An optimized layout and signal path enhance tone clarity by minimizing noise interference. Honey Bee OD 4K:

  The Honey Bee OD 4K overdrive pedal is a faithful evolution of the legendary BJFE Honey Bee model, now reimagined with four control knobs for a deeper tonal range. This model maintains BJFE's hallmark soft texture, while delivering a clear and controlled tone that stands out, particularly in ensemble settings. The Honey Bee OD 4K offers both nuanced expression when connected to a clean amp and a powerful overdrive when paired with a slightly distorted amplifier. Key Tonal Characteristics:

  • Flexible Tone Expression: Connect to a clean amplifier to bring out subtleties through your guitar's volume and picking dynamics. Achieve a mellow tone with flat strings and vintage-style light distortion with round strings. • Dynamic Overdrive Response: Pair with a mildly distorted amp to access the classic, resonant distortion reminiscent of a combo amplifier. This pedal brings out the best of your sound, blending depth and clarity with a strong core. • Versatile Uses: The Honey Bee OD 4K can serve as a distortion effect or a pre-amplifier pedal, adjusting the tone to a warm response while enhancing low-mid frequencies. Controls:

  • V Volume: Adjusts the overall output volume. Start at the 12 o clock position for a balanced tone. • D Drive: Controls the level of distortion. At 12 o clock, you can vary distortion by altering your picking strength. • B Bass: Allows precise adjustment of low-end frequencies for a fuller tone. • T Treble: Fine-tunes the high-end pitch, allowing you to shape the top end of your sound. Specifications:

  • Input Impedance: 370k
  • Output Impedance: 50K
  • Drive Voltage: 9V center minus
  • Current Consumption: 3mA
  • Dimensions:
  • Without protrusions: 61mm W x 113mm D x 31mm H
  • With protrusions: 66mm W x 113mm D x 46mm H
  • Note: Batteries are not included. Tips for Best Use

  • Starting Position: For all controls, start at the 12 o clock position to gain a neutral tone and adjust to your preference. • Amplifier Selection: Experiment with both clean and mildly overdriven amps to explore the Honey Bee OD 4K's versatility. • Dynamic Playing: Leverage your picking strength and guitar volume to unlock a range of tonal responses, enhancing both mellow and powerful tones. ・ BJFE in your hand series Honey Bee OD 4K Manual.pdf

