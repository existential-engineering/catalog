description: 19-inch 3U rack-mount PROFILER with the complete PROFILING feature
  set, for professional studio and stage integration.
details: |-
  The PROFILER Rack is the 19-inch rack-mount form factor of the Kemper PROFILER, offering the same complete feature set as the PROFILER Head in a compact 3U enclosure. It features KEMPER's patented PROFILING technology, which captures the sonic DNA of any guitar amplifier, cabinet, and microphone configuration in approximately one minute.

  The MK 2 Series signal chain comprises up to 20 audio blocks. Up to four flexible effects can be placed pre-amplifier and another four post-amplifier, plus dedicated delay and reverb modules with spillover. Effects are accessed via 13 dedicated buttons with color-coded LED indicators, and up to 20 effects locks are available.

  The system ships with a large library of preinstalled profiles. Over 1,400 additional profiles are available through the free Rig Manager software (Mac, PC, iOS, and Android). The Rig Exchange community platform provides access to over 20,000 user-created rigs.

  The PROFILER Rack features passive cooling (no fan noise), four ground-lift switches to eliminate hum, and a Hi-Z input for proper guitar signal response.
specs: |-
  - Form factor: 19-inch rack-mount, 3U
  - Dimensions: H 13.9 cm (5.47 in) × W 48.3 cm (19 in) × D 22 cm (8.66 in)
  - Weight: 5.00 kg (11.02 lbs)
  - Front INPUT: 1/4-inch TS unbalanced, 127 dB dynamic range, 1 megohm impedance
  - ALTERNATIVE INPUT: 1/4-inch TRS balanced with ground lift, 111 dB dynamic range
  - RETURN: XLR balanced + 1/4-inch balanced with ground lift, ≥105 dB dynamic range
  - MAIN OUTPUT L/R: XLR balanced + 1/4-inch TS unbalanced, +4 dBu
  - MONITOR OUTPUT: 1/4-inch TS unbalanced, +4 dBu
  - DIRECT OUTPUT/SEND: 1/4-inch TS unbalanced, +4 dBu, >108 dB dynamic range
  - HEADPHONE: 1/4-inch TRS stereo, 330 mW @ 32 ohms, 220 mW @ 600 ohms
  - S/PDIF I/O: RCA coax, 44.1/48/88.2/96 kHz (24-bit)
  - USB: USB 2.0, USB-A and USB-B; 8 USB audio channels (MK 2) at 44.1 kHz
  - MIDI IN/OUT/THRU: 5-pin DIN connectors
  - SWITCH/PEDAL: Two 1/4-inch TRS inputs
  - Network: RJ45 connector
  - Line Voltage: 90–275 V AC, max. 0.5 A, 50–60 Hz
  - Passive cooling (no fan noise)
  - 4 ground-lift switches
