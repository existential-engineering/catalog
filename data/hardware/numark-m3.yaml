manufacturer: numark
primaryCategory: mixer
categories:
  - discontinued
url: https://www.numark.com/product/m3
description: Extreme music manipulation two-channel scratch mixer with DJ
  essentials plus bonus music-manipulation controls including High/Mid/Low Kill
  switches and a Transform (Punch) button.
specs: |-
  - Two-channel scratch mixer
  - Two phono/line switchable inputs (RCA) for turntables and CD players
  - Two additional line inputs (RCA)
  - Three-band rotary EQ per channel
  - Gain control per channel
  - High/Mid/Low Kill switches per channel (-35 dB cut)
  - Transform (Punch) button for sonic excitement
  - Replaceable crossfader with direction-reverse and slope control
  - Crossfader-style cueing
  - Microphone input (1/4") with gain and tone controls
  - Master output (RCA)
  - Record output (RCA)
  - Headphone output (1/4" stereo) with gain and tone controls
  - Dimensions: 9" x 14" x 4"
  - Packaged dimensions: 14.6" x 13.4" x 6.7"
  - Packaged weight: 8.8 lbs
