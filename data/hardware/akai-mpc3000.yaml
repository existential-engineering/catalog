description: >-
  The MPC3000 is a new and improved version of the classic MPC60, a sequencer-sampler
  powerhouse that functions as the heart of any studio producing HipHop, Rap, R&B, and
  techno.
details: |-
  A professional music production instrument combining sampling, synthesis, and sequencing capabilities.

  Features 16-bit stereo sampling at 44.1kHz with 2-32MB memory and full editing. Includes sixteen dynamic pads with velocity and aftertouch, analog-style filter sweeping with resonance, and envelope control.

  The sequencer supports 20 songs, 99 sequences, 99 tracks, and up to 75,000 notes. Offers total MIDI implementation, sophisticated sequence editing, and SCSI disk drive storage.

  Used by notable artists including Puff Daddy, BT, The Crystal Method, and Dr. Dre. Available in standard and Limited Edition versions.
specs: |-
  - Polyphony: 32 notes
  - Sampler: 16-bit, 44.1kHz, Stereo
  - Memory: 2MB RAM (22 seconds), expandable to 32MB
  - Filter: Lowpass filter with resonance and envelope
  - Sounds: 24 Drum sets and 4 Pad Banks
  - Pads: 16 soft pads with velocity and aftertouch
  - Sequencer: 20 songs, 99 sequences, 99 tracks, 75,000 note capacity
  - Control: MIDI, MTC, SMPTE
  - Storage: SCSI disk drive
releaseDate: "1994"
