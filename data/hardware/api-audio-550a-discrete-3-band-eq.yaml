id: 3RC6NAVpk-Ip3i2d2PmvK
name: 550A Discrete 3-Band EQ
manufacturer: api-audio
primaryCategory: eq
categories:
  - rack-mount
url: https://apiaudio.com/product/550a-discrete-3-band-eq/
description: API's legendary three-band proportional Q equalizer, originally
  designed by Saul Walker in the late 1960s. Three bands with 7 frequency
  centers each, ±12 dB boost/cut, shelf/peak switching on outer bands, and
  band-pass filter option.
details: |-
  500-series 3-band proportional Q equalizer. LF band:
  30/40/50/100/200/300/400 Hz. MF band: 200/400/600/800/1500/3000/5000 Hz. HF
  band: 2500/5000/7000/10000/12500/15000/20000 Hz. ±12 dB boost/cut per band.
  Bands 1 and 3: shelf/peak switchable. Proportional Q narrows filter width at
  extremes. Band-pass filter option (50 Hz–15 kHz). +30 dBu clip level.
  500-series 30-pin PC edge connector.
specs: |-
  - Input impedance: 66 kΩ (high) / 17 kΩ (low)
  - Output impedance: <85 Ω (transformer isolated)
  - Frequency response: ±0.5 dB (30 Hz–20 kHz)
  - Noise: −90 dBm (high) / −98 dBm (low)
  - THD: 0.05% @ +4 dBm; 0.07% @ +18 dBm
  - Power: ±15–18V @ 70 mA
  - Dimensions: 1.5″ H × 5.25″ W × 7.75″ D
