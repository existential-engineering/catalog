description: The GL-J is a double-cutaway, semi-hollow electric with a
  solid-wood carved top plate, sharing the fast, smooth neck feel of the GL-10
  in a smaller body than a 335.
details: |-
  When George Lowden was a teenager, his dream guitar was a 335, mainly because he loved the guitar sound from songs like 'White Room' and 'Politician', so it was inevitable that he'd design a double cutaway, semi-hollow electric. The concept was to have a smaller body size than a 335 and, most importantly, to be made with a solid wood, carved top plate (or 'cap') rather than the more standard laminated designs found on other guitars. Thus, the GL-J was born. The neck contour and frets are like the GL-10 and therefore have the same fast and smooth feel. When reviewing the GL-J, Guitarist commented, 'The build is nothing short of exceptional, and so is the feel. The combination of the relatively thin body and the recessed bridge gives a very low-profile feel that hugs to your body,' before concluding, 'It's the experienced craft and design that shines here, with a pared-back aesthetic and glorious sounds, a real musician's tool.' All Lowden electric guitars are fitted with Lollar pickups which are available in one of three configurations: Imperial Humbuckers, P-90s or Eldorado Split Coil, with Gotoh hardware in Chrome or Gold.
specs: |-
  - Two-piece African Mahogany body with centre-joined top
  - Three-piece American Mahogany neck with two-piece Rosewood splice
  - Ebony fingerboard with Maple or Mahogany purfling
  - Mother of Pearl side fingerboard markers
  - 630mm (24.8") scale length
  - 305mm (12") fingerboard radius
  - Width at nut - 43.5mm (1.71")
  - Width at 16th fret - 54.5mm (2.14")
  - Neck depth at 1st fret - 22.4mm (0.88")
  - Neck carve - standard GL 'C' profile
  - Double-cutaway semi-hollow body with solid-wood carved top plate
  - Lollar pickups (Imperial Humbuckers, P-90s or Eldorado Split Coil)
  - Gotoh hardware (Chrome or Gold)
