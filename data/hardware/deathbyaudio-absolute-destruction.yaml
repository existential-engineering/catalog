details: |-
  This might be our craziest pedal. Showing little-to-no respect for what instruments normally sound like, or even what people want them to sound like, we pushed this thing until it sounded fully unhinged. Want a thick, gnarly fuzz sound, or a crushing distortion tone? You can do that, and it'll sound great. But you can also push the Overload slider into blooming, octave nastiness, push it further and starve the circuit until your signal eats itself, or crank it to the maximum so your sound ducks completely into the void before returning to life with a relentless vengeance.

  The Absolute Destruction harnesses a power amplifier IC to generate its insane sound. Its Gain and Overload sliders interact to create a wide range of unique sounds in various positions. The further the Overload control is set to the left, the faster the effect slips into absolute destruction; blow it out even harder by slamming Gain and Overload opposite one another, or lower one or the other for smoother attack and release. Screaming octaves, thick fuzz, and the sound of your guitar reaching back from the depths of destruction are at your fingertips.

  Master Volume controls the output volume of the effect. Overload sets the ceiling at which the pedal overloads: turned all the way up the pedal will not overload, and as the control slides to the left it pulverizes the sound more rapidly. Gain increases gain and distortion as it slides to the right. The horizontal sliders have been recessed to protect them from bending or accidental movement while playing.
