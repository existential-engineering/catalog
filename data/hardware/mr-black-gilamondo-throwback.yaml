description: An 8-stage phase shifter with an extended-range LFO and a
  regenerative "Bonus" control for vocal, intense swirl, plus a fixed "Cobra
  Tone" mode. Offered here in a "Throwback Special" matte finish.
details: |-
  The GilaMondo is a syrupy eight-stage phase-shift modulator. Its extended-range LFO spans from a crawling 0.125Hz (roughly an 8-second cycle) up to a 12Hz wobble, sweeping across the full audio spectrum, and a Bonus knob can immediately intensify that motion.

  The Bonus control does more than add depth. With the Width control above minimum, it recycles the outputs of the phase-shift stages back into the network's input at three discrete nodes, producing a vocality and intensity that Mr. Black says is impossible in most phasers even with twelve or more stages. Low Bonus settings give a lush, heavenly swirl; high settings give a throaty, vocal tone.

  Setting the Width control to minimum disables the LFO entirely and parks the phase network's center point, letting you tune a fixed phase-shift almost like a cocked wah, but far stronger and more pronounced. Mr. Black calls this the Cobra Tone, and it sits especially well after distortion or fuzz.

  This is a "Throwback Special" finish of the standard GilaMondo. The circuit and controls are identical to the regular model, so only the graphic differs. High input headroom makes it safe with guitar, bass, keys and synth, and each unit is built to order in Portland, Oregon.
specs: |-
  - 8-stage phase-shifter
  - Regenerative "Bonus" control (recycles phase outputs at three nodes)
  - "Cobra Tone" fixed phase-shift with Width at minimum (LFO disabled)
  - Very wide LFO range (approx. 0.125Hz - 12Hz)
  - High input headroom (3V peak-to-peak max input signal)
  - Great on electric guitar, bass, keys and synth
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (not included)
  - <60mA current draw (≥100mA recommended)
  - Compact footprint (2.4" x 4.5" x 1.8")
