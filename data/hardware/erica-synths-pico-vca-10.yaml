description: Erica Pico Dual VCA is a simple, reliable LM13700 based linear
  voltage controlled amplifier that can be configured as two independent VCAs or
  a stereo VCA with the same CV control.
details: |-
  Erica Pico Dual VCA is a simple, reliable linear voltage controlled amplifier built around the LM13700, with two independent VCAs on a 3HP panel.

  CV addressing is configurable, so the pair works either as two independent VCAs with their own control voltages or as a stereo VCA with one CV controlling both channels.

  The VCA 1 input is copied to VCA 2, which is what makes the stereo configuration practical without patching the same source twice or reaching for a multiple.

  Attenuation reaches -80dB with the CV at rest, and diode protection guards the inputs and outputs against overvoltage. The panel is 3HP wide and the module is 35mm deep, part of the Pico Series brief Erica Synths set itself, to fit superior synth functionality into 3HP at an affordable price.
specs: |-
  - 2 independent VCAs in one module
  - VCA1 input copied on VCA2
  - Configurable CV addressing
  - Diode protection against input/output overvoltage
  - Attenuation level -80dB
  - Power consumption +14mA, -14mA
  - Module width 3HP
  - Module depth 35mm
