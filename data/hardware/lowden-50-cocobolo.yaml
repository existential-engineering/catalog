details: |-
  Cocobolo is a prized Central American rosewood - renowned for its density and looks - sometimes very dark but most often has deep orange and black markings which darkens further with age. Because of its density and surface texture the tone is robust, warm and full of projection.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Cocobolo back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 50 Series
  - Back and sides: Cocobolo
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tonewood grade: Master Grade
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
