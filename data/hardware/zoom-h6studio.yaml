description: The ZOOM H6studio flagship Handy Recorder combines F-Series tech
  with an interchangeable mic system and 32-bit float recording for up to 8
  tracks.
details: |-
  The H6studio puts studio-grade sound in your hands. With 6 audio tracks, large-diaphragm XY mics, 32-bit float recording and F-Series preamps, you can capture inspiration wherever it strikes.

  Whether you are on set or on location, the H6studio's 32-bit float recording keeps you free from clipping and protects you from the unexpected. Capturing up to 8 tracks, 6 individual tracks plus a stereo mix, it works as a portable recording studio for podcasting, samples and sound design alike.

  The 19.4 mm XY microphones capture a rich, flat response with 123 dB of dynamic range and can withstand 140 dB SPL, enough to record a jet engine. The F-Series preamps deliver ultra-clean audio at -127 dBu equivalent input noise, and combined with dual A/D converters and 32-bit float they provide 132 dB of dynamic range. Advanced look-ahead limiters anticipate potential overloads and prevent distortion before it reaches the track, and improved RF shielding blocks interference from smartphones and Wi-Fi.

  Four locking XLR/TRS inputs carry +48 V phantom power and +4 dBu line-level support, alongside a stereo mini jack with plug-in power. A dedicated format switch chooses between 32-bit float for clip-free recording and 16/24-bit, where the gain knobs give more traditional control. Outputs are a built-in mono speaker, a loud headphone output and a 3.5 mm stereo LINE OUT for connecting directly to a camera.

  The 3.0 capsule system supports 32-bit float and is compatible with the SSH-6e, EXH-6e and XYH-6e. The H6studio also works as a 6-in/2-out USB audio interface for Mac, Windows, iOS and Android, streaming while simultaneously recording a backup to the microSD card. It runs on 4 AA batteries for up to 15 hours or from USB power, records to microSDHC/microSDXC cards up to 2TB, and navigates its menus with audible descriptions for blind and visually impaired users.
specs: |-
  - Up to 8 simultaneous recording tracks and 6 simultaneous playback tracks
  - Recording formats: WAV at 44.1/48/96/192 kHz, 16-bit, 24-bit or 32-bit float, mono or stereo, BWF and iXML supported
  - Recording media: microSDHC and microSDXC cards up to 2TB
  - XY mic capsule (XYH-5s): 90 degree XY stereo format, unidirectional pickup pattern, -41 dB/Pa at 1 kHz sensitivity, 140 dB SPL maximum sound pressure input
  - MIC/LINE IN on the capsule: 1 stereo mini jack, 2.5 V plug-in power, input gain -inf to +60 dB, input impedance 2 kohms or more
  - MIC/LINE inputs: 4 XLR/TRS combo jacks (XLR 2 hot, TRS tip hot), input gain -inf to +60 dB, input impedance 3 kohms or more, maximum input +4 dBu (mic) and +24 dBu (line), +48 V phantom power, equivalent input noise -127 dBu or less (IHF-A) at 150 ohm input
  - LINE OUT: 1 stereo mini jack, maximum output level +1 dBu, output impedance 110 ohms or less
  - Headphone out: 1 stereo mini jack, maximum output 20 mW + 20 mW into a 32 ohm load, output impedance 10 ohms or less
  - Built-in mono speaker: 20 mm x 30 mm elliptical dynamic, 250 mW effective maximum output
  - Display: 2.00 inch full-color LCD, 320 x 240
  - USB: USB Type-C connector, USB 2.0 High Speed for audio interface and file transfer
  - Audio interface: 6 in / 2 out (multi) or 2 in / 2 out (stereo), 44.1/48/96 kHz interface only, 44.1/48 kHz with onboard recording, 24-bit and 32-bit float
  - Remote: dedicated ZOOM BTA-1 wireless adapter
  - Power: 4 AA alkaline, lithium or rechargeable NiMH batteries, USB bus power, or the ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Battery life on alkalines: about 15 hours 2-track, about 4.5 hours 6-track at 48 kHz, about 2 hours 6-track at 192 kHz
  - Maximum power consumption: 5 W
  - Dimensions: 86.0 mm (W) x 221.0 mm (D) x 54.6 mm (H)
  - Weight: 477 g including batteries
  - Look-ahead limiters and a low-cut filter to suppress low-frequency noise
  - Compatible with Zoom capsule system 3.0 (SSH-6e, EXH-6e, XYH-6e)
  - Timecode generation and jam sync via the TCA-1 adapter, wireless timecode from the ATOMOS UltraSync BLUE with the BTA-1
  - Mono mode for interviews, narration and vocals
  - Variable speed playback from 0.5x to 2.0x, A-B repeat playback, normalize and export to 24-bit or 16-bit WAV
  - Recording start tone function for aligning audio with video
  - Accessibility guide sound in English, Spanish, French, Japanese, German, Italian or Chinese
