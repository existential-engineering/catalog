description: The Ashdown NFR-2 is an active near-field monitor designed
  exclusively for music recording and production in home and project studios. A
  compact professional wideband low-distortion monitor built around a 5-inch
  SICA LF driver and a 24dB/octave Linkwitz-Riley active crossover, sold in
  pairs.
details: |-
  In a year-long R&D project Ashdown researched every aspect of monitor design in developing the NFR-2, an active near-field monitor designed exclusively for music recording and production in home and project studios. It provides a full frequency response in small to medium control rooms, with particular attention to the vocal area, giving a response similar to the famous BBC LS3/5 broadcast monitor but with enhanced bass and treble extension. Twin power amplifiers rated at 100 watts each drive the drivers, and an optical low-distortion compressor reduces the signal sent to the woofers in the case of accidental overdrive. Rather than Class D and DSP, traditional amplification was chosen for service life and signal integrity. The active crossover is a 24dB/octave Linkwitz-Riley network for accurate phase alignment. A 5-inch SICA LF driver features a die-cast chassis, vented magnet assembly, dual asymmetric roll surrounds and a copper demodulating ring, matched to a tweeter with extended high-frequency response and a gradual roll-off after 20kHz. Construction uses void-free 11-lamination birch plywood, corner-lock joints, 17dB wool-felt damping and long-fibre wool stuffing.
specs: |-
  - Configuration: Active near-field monitor, sold as a pair
  - Amplification: Twin power amplifiers, 100 watts each
  - LF Driver: 5-inch SICA with die-cast chassis and copper demodulating ring
  - Crossover: 24dB/octave Linkwitz-Riley active network
  - Construction: Void-free 11-lamination birch plywood, sealed cabinet damping
  - Features: Sub-sonic filter, optical low-distortion compressor
