details: |-
  The CC8-SC is a handcrafted supercardioid small-diaphragm condenser microphone built in Vienna, using Austrian Audio's proprietary OCC7 capsule. Its tight supercardioid pattern delivers focused isolation and minimal signal bleed, cutting through rumble and spill with surgical precision.

  Transformerless output circuit with individual factory calibration to ±0.5 dB sensitivity at 1 kHz for match-pair capability. Features switchable high-pass filters at 60 Hz and 120 Hz (2nd order), and switchable -10 dB and -20 dB pad.

  Typical applications include drum miking (underheads, rides, hi-hats), acoustic instruments (violin, flute, guitar, vibraphone, harp), foley work, and studio and live performance.
specs: |-
  - Directional Pattern: Supercardioid
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity: 18 mV/Pa
  - Equivalent Noise Level: 13 dB SPL (A)
  - Dynamic Range: 132 dB
  - Maximum SPL: 155 dB SPL
  - High-pass filter: 60 Hz, 120 Hz (2nd order) switchable
  - Pad: -10 dB, -20 dB switchable
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 3 mA)
  - Connector: XLR 3-pin
  - Dimensions: 140 × 23 × 23 mm
  - Weight: 140g
  - Output: Transformerless
  - Match-paired: ±0.5 dB sensitivity tolerance at 1 kHz
