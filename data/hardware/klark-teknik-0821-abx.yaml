description: The DN6000 is a professional audio analyser engineered for system
  engineers, acousticians and installation specialists who need a road-ready,
  accurate, real-time view of what a PA is doing. It builds on Klark Teknik's
  work on the DN60, the first rackable spectrum analyser, with a more
  comprehensive measurement toolkit.
details: |-
  The DN6000 delivers real-time spectrum analysis with the resolution, accuracy and refresh rate needed to make defensible system decisions. Whether ringing out monitors, tuning a delay stack or verifying installation compliance, the unit provides visibility into system behaviour.

  The DN6000 is built to a touring-rig standard rather than a laboratory-bench standard, with conservatively rated power, robust mechanical construction and cabling and connector quality that survives a long run of dates. The analyser is engineered to be deployed and used under the conditions real shows present.

  Klark Teknik built the first rackable spectrum analyser in 1980, and the DN6000 carries forward four decades of measurement-engineering expertise from the Kidderminster facility.
specs: |-
  - Real-time audio spectrum analyser
  - Rackable chassis
  - Conservatively rated power supply
  - Successor to the DN60 rackable spectrum analyser of 1980
