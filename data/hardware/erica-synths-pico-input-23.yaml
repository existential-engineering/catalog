description: Audio signal booster.
details: |-
  Pico INPUT is the module for interfacing a modular system with external synths, an mp3 player or a mobile phone. It boosts an external signal up to modular synth signal level.

  Independent left and right inputs sit alongside a 3.5mm stereo input, and each channel has its own gain adjustment with signal level indicator LEDs. Boosting is configurable at +20dB or +40dB, over a range of 0 to +20/+40dB.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep, drawing +18mA and -8mA from the bus.
specs: |-
  - Independent L and R inputs
  - 3.5mm stereo input
  - Independent gain adjustment for L and R channels
  - Signal level indicator LEDs
  - Configurable signal boosting (+20dB/+40dB)
  - Input signal boosting 0 to +20/+40dB (configurable)
  - Power consumption +18mA, -8mA
  - Module width 3HP
  - Module depth 35mm
