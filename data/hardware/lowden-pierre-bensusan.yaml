details: |-
  Affectionately known as Mr DADGAD, Pierre Bensusan is a French acoustic guitar virtuoso celebrated for his distinctive blend of traditional, contemporary, jazz and classical influences. A long-standing friend and collaborator of George Lowden, Pierre's relationship with Lowden Guitars has led to the creation of two highly regarded Lowden signature models: the 'Old Lady' and the PB. The PB is an F Cutaway body shape featuring AAAA grade Honduran Rosewood and an Adirondack Spruce top. This signature model also features Ebony body bindings with soundbox bevel, and a 5-piece 'Fingerstyle' Figured Maple neck with rosewood splices. As this guitar is an artist signature model, it is not configurable except for being available left- or right-handed. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - F-shaped body with cutaway
  - AAAA grade Honduran Rosewood back and sides
  - Adirondack Spruce top
  - Ebony body bindings with soundbox bevel
  - 5-piece 'Fingerstyle' Figured Maple neck with Rosewood splices
  - Handcrafted construction
  - Hardshell case included
