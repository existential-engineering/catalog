description: The DAC1 USB is a reference-quality 2-channel digital-to-analog
  converter featuring USB audio input, Benchmark's proprietary UltraLock™
  clock-recovery system, and an integrated HPA2™ headphone amplifier. It has
  been discontinued and replaced by the DAC2 Series.
details: |-
  The Benchmark DAC1 USB is a reference-quality two-channel digital-to-analog converter designed for professional and audiophile use. It has been discontinued and replaced by the DAC2 Series, though refurbished units remain available directly from Benchmark.

  The unit features Benchmark's proprietary UltraLock™ clock-recovery system, which eliminates jitter from incoming digital signals regardless of source quality. This allows the DAC1 USB to deliver consistent low-jitter performance from USB, AES/EBU, and S/PDIF inputs.

  USB audio is handled via a USB 1.1 audio interface that is plug-and-play compatible with both Windows and Mac operating systems — no drivers required. USB input supports up to 96 kHz sample rates, while the AES/EBU input supports up to 192 kHz at 24-bit.

  An integrated HPA2™ headphone amplifier delivers less than 0.0003% THD+N under full load, driving two front-panel 1/4-inch headphone outputs simultaneously. The DAC1 USB is available in Silver, Black, and Black Rackmount finishes.
specs: |-
  - Supported sample rates: up to 96 kHz via USB, up to 192 kHz via AES/EBU
  - Bit depth: 24-bit
  - Clock system: UltraLock™ proprietary jitter-attenuation
  - Headphone amplifier: HPA2™, THD+N < 0.0003% under full load
  - Two front-panel 1/4-inch headphone outputs
  - USB Audio 1.1 — plug-and-play, no drivers required (Windows & Mac)
  - Available in Silver, Black, and Black Rackmount finishes
