details: |-
  The T1 Uke StreetMaster pairs timeless Martin tone with a weathered aesthetic that looks and feels like an old favorite. Made from solid mahogany, it's lightweight, comfortable, and delivers a bright, punchy sound with plenty of character.

  The satin finish adds to the worn-in vibe, giving the instrument a broken-in look that's full of personality. The hand-rubbed treatment lets the natural mahogany grain show through while keeping the aesthetic distinctly road-worn.

  The tenor body offers extra volume and a bit more room to play, making it a great fit for beginners, seasoned uke players, or guitarists transitioning to ukulele. With 20 frets and a 14th-fret neck joint, it gives players plenty of access for melodic work as well as chord strumming.

  Quality appointments include a Sipo fingerboard, Morado bridge, compensated white Tusq saddle and nut, and Ratio black uke peg tuning machines. The ukulele ships with a soft gig bag.
specs: |-
  - Body size: Tenor
  - Top: Solid mahogany (Dark Mahogany)
  - Back & sides: Solid mahogany (Dark Mahogany)
  - Neck material: Select hardwood
  - Fingerboard: Sipo
  - Fingerboard width at nut: 1 11/32"
  - Fingerboard width at 12th fret: 1 23/32"
  - Total frets: 20
  - Neck joins body: 14th fret
  - Bridge: Morado, tenor ukulele style, 1 5/8" string spacing
  - Saddle: Compensated white Tusq
  - Nut: White Tusq
  - Tuning machines: Ratio Black Uke Peg
  - Headstock: Solid with ukulele profile
  - Finish: Satin (hand rubbed)
  - Case: Soft gig bag included
