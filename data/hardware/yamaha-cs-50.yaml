description: >-
  A four-voice analog polyphonic synthesizer from 1977 that delivers the classic
  Yamaha CS-series sound in a more portable format than the flagship CS-80.
details: |-
  The Yamaha CS-50 offers the unmistakable character of the CS-series synthesizers in a relatively
  compact package. Released in 1977 just before the larger CS-60 and CS-80, it weighs approximately
  100 pounds compared to the CS-80's imposing 215-pound frame, making it a more practical option for
  musicians who wanted that classic Yamaha analog sound.

  The instrument provides four-voice polyphony with one VCO per voice, a 49-note keyboard with
  pressure sensitivity for aftertouch expression, and 13 preset sounds covering various instrument
  types. The filter section features 12 dB/octave low-pass and high-pass filters, which contribute
  to a sound that can be somewhat thinner than its larger siblings due to the gentler filter slope
  and limited oscillator count.

  Like other instruments in the CS series, the CS-50 can suffer from tuning instability, a common
  characteristic of the analog circuitry used across the range. The instrument lacks onboard memory
  for storing custom patches, with only a single user-adjustable panel setting alongside its 13
  factory presets. Its travel-case style housing hints at Yamaha's intention for it to be a gigging
  instrument.

  Notable users include Men Without Hats and Herbie Hancock.
specs: |-
  - Polyphony: 4 voices, monotimbral
  - Oscillators: 4 (1 VCO per voice)
  - LFO: 1
  - Filter: 12 dB/oct low-pass and high-pass
  - Effects: None
  - Keyboard: 49 keys with pressure sensitivity (aftertouch)
  - Memory: 13 presets, 1 user panel setting
  - Control: None
releaseDate: "1977"
