description: Limited edition collaboration between Audeze and Schiit featuring
  2-ohm ribbon-style planar drivers with Parallel-Uniforce technology, bundled
  with a custom Schiit Jotunheim-A current-drive amplifier.
details: |-
  A special collaboration between Audeze and Schiit, the LCD-R features an extremely low impedance design at 2 ohms using patented Parallel-Uniforce technology. Audeze refers to the LCD-R driver as a Ribbon instead of Planar due to the extremely low impedance and over 98 percent trace coverage of the diaphragm surface.

  The bundle includes a customized Schiit Jotunheim-A current-drive amplifier. The LCD-R is engineered to work exclusively with the included Schiit amp and must not be used with any other amplifier — doing so will void the warranty.

  The sound signature is described as smooth but very detailed, attributed to the pairing of ultra-low impedance drivers with dedicated current-drive amplification.

  The Lichtenberg fractal wood rings are handcrafted by shooting precise pulses of high voltage electricity to enhance the natural patterns of figured maple, making each pair unique. Limited to 67 sets total, sold on a first-come, first-served basis. This is a legacy product no longer available for sale.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Ribbon
  - Magnetic structure: Double Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Parallel Uniforce
  - Transducer size: 106 mm
  - Maximum SPL: >130dB
  - Frequency response: 5Hz - 50kHz
  - THD: <0.1% @ 100 dB SPL
  - Sensitivity: 103 dB/1mW (at Drum Reference Point)
  - Impedance: 2 ohms
  - Custom connection: OCC monocrystal copper with female 4-pin XLR
  - Weight: 615g
  - Jotunheim-A voltage: 115V or 230V depending on model
  - Includes 3-year driver warranty and 5-year Schiit amp warranty
  - SKU: 400-RC-0115-00
