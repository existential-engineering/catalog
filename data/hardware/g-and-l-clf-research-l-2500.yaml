  Tri-Tone Preamp.
details: |-
  In the late 1970s, Clarence Leo Fender was looking forward to launching his new G&L brand featuring his latest innovations including Magnetic Field Design pickups and the Saddle Lock bridge. Leo developed these technologies at his CLF Research company, and production of the new G&L instruments took place in the CLF Research factory on Fender Avenue in Fullerton, California, where G&L production continues today.

  The new CLF Research L•2500 pays homage to its roots with classic details including the early CLF/G&L headstock and neck profile, beautifully reproduced aluminum CLF knobs, an elegant chrome control plate housing the Tri-Tone Preamp and color-coded mini toggle switch tips.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Pickups: Two G&L Magnetic Field humbucking pickups
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: CLF/G&L 1.750" nut width-slim C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: Tri-Tone system with 3-position pickup selector, series/parallel switch, 3-position pre-amp mode switch, volume, treble, bass
  - Includes: G&L Deluxe Gig Bag
  - Power: battery-powered, 9V
  - Available in: Natural Gloss over Swamp Ash, Maple fingerboard
  - Available in: Purpleburst over Swamp Ash, Maple fingerboard
  - Available in: Pharaoh Gold Firemist over Alder, Rosewood fingerboard
  - Available in: Turquoise over Alder, Rosewood fingerboard
  - Available in: Lake Placid Blue over Alder, Rosewood fingerboard
  - Available in: Old School Tobacco over Okoume, Rosewood fingerboard
