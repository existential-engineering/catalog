description: >-
  The Elka Drumstar-80 is a PCM drum machine featuring 32 punchy sampled sounds,
  12 individual outputs with volume faders, and programmable pattern sequencing
  with a distinctive character bridging professional and home organ territory.
details: |-
  The Elka Drumstar-80 occupies an interesting middle ground in drum machine history, combining high-end PCM sound quality with the kind of preset rhythm accompaniment features found in home organs. This Italian-made unit delivers 32 sampled drum and percussion sounds with a punch and crispness that gives it genuine character.

  The sound palette is comprehensive, covering kicks, snares, electronic snares, rim shots, toms, closed and open hi-hats, pedal hi-hat, ride and crash cymbals, hand claps, congas, bongos, triangles, cabasa, cowbell, clave, agogo bells, and guiro. All 12 voices can sound simultaneously, and each gets its own individual output with dedicated volume fader for flexible mixing and external processing.

  Programming uses a tap-write method with automatic sixteenth-note quantization. The sequencer provides 20 user-programmable rhythms, each with four two-bar variations (three preset, one user-programmable), plus fill patterns and intro/ending sections. Five user songs can chain patterns into complete arrangements.

  MIDI implementation is limited to clock in and out only, with no note data transmission. The unit includes an internal cooling fan and eight trigger buttons for real-time playing. While not as widely known as Japanese competitors from the same era, the Drumstar-80 has earned appreciation among collectors for its distinctive sonic character and hands-on mixing capabilities.
specs: |-
  - Polyphony: 12 simultaneous voices
  - 32 PCM drum and percussion sounds
  - 12 individual outputs with volume faders
  - 8 trigger buttons
  - 20 user-programmable rhythms
  - 4 two-bar variations per rhythm (3 preset + 1 user)
  - Fill patterns, intro/ending patterns
  - 5 user songs
  - Tap-write programming with 16th-note quantization
  - MIDI Clock In/Out only
  - Internal cooling fan
