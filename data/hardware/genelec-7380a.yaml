description: "Delivering high SPL and extended LF response, the 7380A offers
  power, clarity and flexibility in equal measures."
details: |-
  The 7380A is a SAM (Smart Active Monitoring) studio subwoofer at the upper end of Genelec's professional subwoofer range, engineered for music production, mastering, film post, and broadcast rooms that need authoritative low-frequency reproduction without resorting to a much larger enclosure. A 15-inch (381 mm) bass driver paired with an 800 W Class D amplifier and a reflex-loaded cabinet delivers a peak SPL of at least 123 dB and extends the system response down to 16 Hz at the -6 dB point.

  Despite its output capability, the 7380A is built into a compact 685 x 718 x 492 mm enclosure weighing 69 kg, making it manageable in rooms where its larger 7382A sibling will not fit. Harmonic distortion stays at or below 1% across 30 to 85 Hz, and self-generated noise is held to 5 dB SPL at one metre, keeping the subwoofer transparent against the satellite monitors it supports.

  Comprehensive analog and digital connectivity makes the 7380A equally at home in stereo or full multichannel setups. Seven balanced XLR inputs and seven matching XLR outputs handle 7.1 bass-managed signal flow, with a dedicated XLR LFE input and LFE thru-output for the .1 channel. An AES/EBU XLR input and thru-output extend the same routing into the digital domain.

  As a SAM product, the 7380A integrates with Genelec Loudspeaker Manager (GLM) software for system-wide auto-calibration, level matching, and bass management across centralized and distributed modes. Two RJ45 CAT5 GLM Network ports daisy-chain the subwoofer with other SAM monitors and subs so room compensation, crossover, and phase can be tuned from a single GLM session.

  Power management uses Intelligent Signal Sensing (ISS) to drop idle consumption to 2 W or less when no audio is detected, with idle and full-output draws of 40 W and 600 W respectively. Mains input accepts 100-240 VAC at 50/60 Hz, and the subwoofer ships under the standard SAM 7380AP product code.
specs: |-
  - SAM (Smart Active Monitoring) studio subwoofer
  - Peak SPL: >= 123 dB
  - Short-term maximum SPL: >= 119 dB
  - Frequency response: 16 Hz - 100 Hz (-6 dB)
  - Harmonic distortion: <= 1% (2nd, 30 Hz - 85 Hz)
  - Self-generated noise: <= 5 dB SPL (at 1 m, A-weighted)
  - Bass driver: 381 mm (15 in) cone
  - Amplifier: 800 W Class D
  - Enclosure: Reflex port
  - Bass management with centralized and distributed modes
  - Intelligent Signal Sensing (ISS) auto power management
  - GLM (Genelec Loudspeaker Manager) network calibration support
  - Dimensions: 685 x 718 x 492 mm (H x W x D)
  - Weight: 69 kg (152.1 lb)
  - Mains voltage: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): <= 2 W
  - Power consumption (idle): <= 40 W
  - Power consumption (full output): 600 W
  - Analog signal inputs: 7 x XLR female, balanced, 10 kOhm (7.1)
  - Analog signal outputs: 7 x XLR male (7.1)
  - Analog LFE input: 1 x XLR female
  - Analog LFE output: 1 x XLR male
  - Digital input: 1 x XLR female (AES/EBU), 110 Ohm
  - Digital output/thru: 1 x XLR male (AES/EBU), 110 Ohm
  - Control: 2 x RJ45 (CAT5) for GLM network
  - Product code: 7380AP
