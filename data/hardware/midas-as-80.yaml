name: AS 80
manufacturer: midas
primaryCategory: rack-mount
categories:
  - outboard
url: "https://www.midasconsoles.com/en/products/0606-ADF"
description: The Midas AS 80 is designed to seamlessly convert a single,
  high-bitrate HyperMac connection into two redundant 1GBit connections and vice
  versa, whilst ensuring ultra-fast audio switching. Additionally, it can also
  run up to 192 bidirectional channels at 96 kHz.
details: |-
  Reliable Redundancy: Using AS 80 with our flagship HD96 console allows both console Snake ports to be made redundant providing greater potential channel count. Furthermore, AS 80's utilisation of FPGA-based switching technology ensures dependable HMAC failover to a redundant connection. Tough and Dependable: Thanks to its 1U rackmountable design, AS 80 can be easily integrated into any touring or live portable sound setup without taking up too much space and can withstand the demands of life on tour.
specs: |-
  - Snake ports copper: 3 x RJ45 HyperMAC
  - Snake ports optical: 3 x optical multi mode
  - Ethernet control: 1 x Ethernet control port for RJ45 connector
  - Upgrade port: 1 x Micro USB
  - Mains power inlet: 2 x 3-pin IEC switched connector
  - Power consumption: 25 W x 2
  - Voltage: 100 VAC to 240 VAC ±10%
  - Dimensions (H x W x D): 44 x 483 x 436 mm (1.7 x 19 x 17.2")
  - Net Weight: 5.1 kg (11.2 lbs)
  - Shipping Weight: 7.1 kg (15.6 lbs)
  - Operating temperature range: 41 to 113°F (5 to 45°C)
  - Storage temperature range: -4 to 140°F (-20 to 60°C)
  - Channel count: Up to 192 bidirectional channels at 96 kHz
