description: Dustin Davidson's signature bass, built on the features of the
  Kiesel A2 Bass, with a multiscale layout and a custom pickup configuration. It
  keeps the Tritium pickup placement but deletes the middle pickup, leaving neck
  and bridge pickups paired with a Darkglass preamp for a fuller and clearer
  tone than traditional pickup placements.
details: |-
  Due to the innovative features of the popular A2 Bass, Davidson opted for the model to take place as the second edition of his signature model, the DDM4.

  A few notable overhauls include a change to a multiscale layout and a custom pickup configuration. The model keeps the Tritium pickup placement but deletes the middle pickup, leaving the neck and bridge pickups in the same place.

  Paired with the Darkglass preamp, a fuller and clearer tone is achieved over traditional pickup placements.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Multiscale layout
  - Scale length: 34" to 35.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Body: alder
  - Top wood: flamed spalted maple with natural top wood binding effect
  - Finish: translucent black burst edges
  - Pickups: two Kiesel Tritium humbuckers in Kiesel's KT3 positioning
  - Electronics: 18V active/passive electronics, Darkglass preamp, master volume, pickup blend, push-pull active/passive tone control, stacked concentric bass/treble frequency cut or boost
  - Bridge options: Hipshot A-Style bridge at .748" (19mm) or .64" (16.25mm) spacing, or Hipshot Triple Locking Solo Saddle bridge at .748" (19mm) or .64" (16.25mm) spacing
  - Headstock: GT style bass headstock with flamed spalted maple overlay and gold Kiesel logo
  - Inlays: white acrylic Dustin Davidson signature inlays, standard black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Weight: 7.5 to 8 lbs depending on configuration
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts, configured to order
