description: Lumatone is an isomorphic hexagonal MIDI controller with 280
  illuminated, velocity sensitive keys, each with polyphonic aftertouch,
  continuous controller and Lumatouch expression modes. Powered by centuries-old
  music theory and modern design ingenuity, it is intuitive to play, fully
  programmable, and endlessly creative.
details: |-
  Lumatone boasts 280 illuminated, velocity sensitive hexagonal keys, and each comes armed with polyphonic aftertouch, continuous controllers, and Lumatouch expression mode. Each key can be individually programmed for expression mode, MIDI note number and channel, and key colour, so the instrument can be turned into a vast multi-instrumental master controller or mapped with colourized isomorphic layouts, microtonal tunings, or harmonic tables.

  Lumatone's layout enables fully isomorphic mappings. With isomorphism, the same chord or scale retains the same hand shape anywhere on the keyboard, no matter what the key. It is intuitive, encouraging performers to use less common intervals or explore microtonality, and the rising hexagonal grid gives access to more notes than can normally be reached with one hand.

  All the familiar key travel of a keyboard is paired with the expression of a next-generation MIDI controller. Any key can be converted to a fader to modulate CC parameters, and an expression mode called Lumatouch allows modulation across the entire range of the key. Keys use torsion springs with counterbalanced keycaps and a non-contact Hall-Effect sensing mechanism, and the keybed rises as the player reaches further away for an ergonomic feel.

  Lumatone now includes three standard play modes: Classic, Melodic, and Harmonic. Classic mode is laid out exactly like a piano while remaining fully isomorphic, Melodic mode is the Wicki-Hayden layout found in concertinas and bandoneons, and Harmonic mode is the harmonic table popularized by the C-Thru Axis-64, where any major or minor triad in root position can be played with a single finger.

  Ten onboard preset buttons recall favourite tunings and mappings without a computer, and unlimited mappings are available through the free Lumatone Editor software for Mac and Windows, backed by a community-driven mapping library. The instrument is enclosed in a premium anodized aluminium case with metal pitch and mod wheels and a removable kickstand. Lumatone makes no sound of its own: it is a MIDI controller designed to play anything that receives MIDI.
specs: |-
  - 280 rising hexagonal keys, assignable to any MIDI note or channel
  - Illuminated coloured LEDs customizable to millions of colours
  - Velocity sensitive with customizable curves
  - Polyphonic aftertouch for up to 15 keys simultaneously
  - Continuous controller option on each key for MIDI CC control
  - Lumatouch expression mode uses the full range of a key to control any MIDI parameter
  - Key mechanics: torsion springs with counterbalanced keycaps
  - Sensing mechanism: non-contact Hall-Effect sensor
  - Isomorphic hexagonal matrix layout
  - 10 large preset buttons with LED indicators
  - Metal pitch and mod wheels, smooth and weighted
  - Premium anodized aluminium case
  - Removable kickstand with easy-mount screws, 15 degree angle
  - Weight: 10.8 kg, or 11.4 kg with kickstand (23.8 lbs, or 25.1 lbs with kickstand)
  - Dimensions: 92 x 35.5 x 4.6 cm (36.2 x 13.98 x 1.81 inches)
  - Height with kickstand: 12.5 cm (4.92 inches) at its highest point
  - Key width: 21 mm (0.83 inches)
  - Key diameter: 24 mm (0.94 inches)
  - Key spacing, centre to centre: 24.15 mm (0.95 inches)
  - DC power: 5A at 12V (60W)
  - Connectivity: 5-pin MIDI DIN In, Thru and Out, USB Type B for MIDI over USB, 1/4 inch sustain and expression pedal inputs
  - Diagnostic connectivity: USB Type A and RJ-45
  - Free Lumatone Editor software for Mac and Windows, with up to 10 mappings saved to the preset buttons
  - 1-year warranty against manufacturing defects
