details: |-
  CS-Hi-Mu

  The Fulltone Custom Shop Hi-Mu, brings sustain, touch sensitivity, and articulation to a new High. Made with full size components, a handful of matched JFETs, hand-soldered craftsmanship, and without opamps, diodes, or digital circuitry. 100% handmade in the USA with full-size components

  The Custom Shop Hi-Mu is designed to excel as a singing Lead Voice, powered by 4 x New Old Stock Full-size JFETs configured as "Mu-Stacks" to behave in an amp-like manner, meaning it responds dynamically to the input from your hands and guitar. It offers great clean-up by lowering the guitar's volume knob and has ample midrange, clarity, sustain, harmonics. Note: The latest enclosure revision no longer uses thumbscrews and an LED lens has replaced the use of an amp jewel. Updated photos will be available soon. FEATURES

  3-position Bass switch is used in conjunction with the EQ knob to enhance or remove Bass frequencies. Note that as the EQ knob is turned clockwise past 12 o'clock this switch will seem less obvious, especially when used with smaller amps. EQ knob is not a conventional Hi-Cut, rather its capable of drastic tonal changes ranging from rich and smoother (around 9 o'clock) to sharp and cutting (around 3 o'clock.) Using the Bass switch with the EQ knob yields endless possibilities. Sustain Knob makes the sound more distorted as it is turned clockwise. Footswitch: This pedal offers Full-Bypass with LED status for no tone loss when the pedal is off. Input Jack: plug a mono, shielded guitar cable from your guitar into this jack. Output Jack: plug a mono, shielded guitar cable from this jack into the amp, or on to the next effect byou are using. Power Jack: use only a high quality, regulated Negative-to-Center-pin 9-18 Volt power supply. Make sure that the plug is the standard 2.1mm x 5.5mm size. Battery: To access the 9V battery clip, use a Phillips head screwdriver to remove the four screws on the back of the pedal and carefully separate the housing. Replace the dead battery with a new one, then reassemble the pedal.
