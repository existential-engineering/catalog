description: The Centennial Concert Uke celebrates 100 years of Martin concert
  ukuleles with solid mahogany tone, vintage-inspired design, and modern RATIO
  tuners.
details: |-
  This limited-edition ukulele honors a significant milestone in Martin's history — 100 years of producing concert-sized instruments since 1925. The instrument blends vintage aesthetics with contemporary functionality, making it both a collectible tribute and a playable instrument.

  Constructed from solid genuine mahogany throughout, the Centennial delivers a blend of warmth and brightness with a punchy midrange. The concert body size offers an ideal balance — larger than soprano models but more compact than tenor variants, providing comfortable playability while maintaining authentic Martin tonal characteristics.

  The vintage-inspired design features a select hardwood neck with East Indian rosewood fingerboard that terminates at the body joint, a historical design element that opens up more of the instrument's top for increased resonance. Modern upgrades include Graph Tech RATIO tuning machines, combining the stability of geared tuners with vintage friction-peg aesthetics.

  A commemorative paper label inside references the North Street factory where the first concert ukuleles were handcrafted. Offered as a limited edition only through 2025, the Centennial Concert Uke ships in a softshell case with backpack/shoulder strap, and is also available in a left-handed configuration.
specs: |-
  - Body Size: Concert Ukulele
  - Top: Solid genuine mahogany (Dark Mahogany finish)
  - Back & Sides: Solid genuine mahogany (Dark Mahogany)
  - Neck Material: Select Hardwood
  - Fingerboard: East Indian Rosewood
  - Nut Width: 1 13/32"
  - Fingerboard Width (12th Fret): 1 13/16"
  - Frets: 12 total
  - Neck Join: 12th fret
  - Tuning Machines: Graph Tech RATIO Black Uke Peg
  - Saddle: Black Tusq
  - Nut: Black Tusq
  - Fingerboard Inlay: White Boltaron dots
  - Bridge Material: East Indian Rosewood
  - Rosette: Single Ring Fiber
  - Binding: Black
  - Case: Softshell (backpack/shoulder strap)
  - Left-Handed: Available
