details: |-
  The PB takes a classic design a step further by modernizing features and creating a unique aesthetic in its horns and body flare.

  The bass utilizes a smooth, contoured neck heel for ideal playing and bolt-on construction for a punchy sound.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Scale length: 34"
  - Frets: 20 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Body: alder
  - Pickups: two JVA single coil pickups
  - Electronics: passive, with 1 volume and 1 tone control
  - Bridge: Kiesel bass bridge, .748" (19mm) spacing
  - Tuners: Kiesel Guitars premium tuners, 20:1 ratio
  - Headstock: classic headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Dimensions: 44" long, 1.7" thick, 13.5" wide, or 44.25" long, 1.7" thick, 13.75" wide
  - Weight: 8.25 to 8.75 lbs
  - Offered in several string counts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
