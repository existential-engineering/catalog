details: |-
  Altec Lansing HydraMotion 2.0 EVERYTHINGPROOF Speaker

  Bring your music wherever the adventure takes you with the Altec Lansing HydraMotion 2.0 EVERYTHINGPROOF Speaker. Built to handle the outdoors, this rugged Bluetooth speaker is IP67 waterproof, dustproof, and floats in water, making it perfect for the beach, pool, camping, boating, and more. Enjoy up to 12 hours of playtime and immersive sound with a 100-foot Bluetooth wireless range. Connect 100+ Hydra 2.0 speakers together using Party Sync technology for an even bigger audio experience. HyperEdge LED light modes add vibrant visual effects to your music, while the included speaker mount and carry strap make it easy to bring the party anywhere. Designed for versatility, the HydraMotion 2.0 can be used in either vertical or horizontal orientation to fit your space and listening preferences. USB-C quick charging gets you back to your music in as little as 3 hours.
specs: |-
