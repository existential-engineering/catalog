description: The COMPRESSOR LIMITER 522 V2 brings state of the industry dynamics
  control to a compact 500 Series format processor. When used with the LEGEND
  L10, L6, or other standard 500 Series rackmount chassis, the 522 V2 provides
  the legendary Midas sound in a modular format with upgraded, premium-quality
  performance. Its dynamic Presence control enables operators to add “air” to
  vocals without the unwanted noise or pumping effects found in competing
  products, and reduces the risk of feedback during live performance. The
  variable Presence function effectively gives the 522 V2 two different ratios —
  one for low frequencies and a reduced ratio for mid-high frequencies (centered
  around 5 kHz). The unit operates as a peak-sensing compressor in manual mode,
  or as an RMS compressor when the Auto switch is engaged, with selectable Soft
  or Hard knee response and a switchable 200 Hz sidechain high-pass filter. A
  true hardware relay bypass via the IN switch removes all circuitry from the
  signal path when compression is not needed, and bypass also engages
  automatically if the host chassis loses power.
details: |-
  Front panel controls include Threshold, Ratio, Attack, Release, Make-up Gain, Presence, and switches for Auto (RMS mode), Knee (Soft/Hard), Sidechain HPF (200 Hz), and IN (bypass). When the Auto switch is engaged, the manual attack and release controls are bypassed and the compressor operates in RMS mode, automatically adjusting attack and release based on the averaged input signal and the threshold/ratio settings. The 200 Hz sidechain HPF prevents low-frequency content from dominating overall compression. True hardware relay bypass removes all circuitry from the signal path when the IN switch is disengaged, and bypass mode also engages should the chassis become accidentally powered down. As a 500 Series module, audio I/O is provided by the host 500 Series rackmount chassis (e.g. Midas LEGEND L10 or L6).
specs: |-
  - Format: 500 Series module
  - Compression Modes: Peak-sensing (manual) / RMS (Auto switch engaged)
  - Knee: Soft (default) or Hard, switchable
  - Dynamic Presence Control: Boosts mid-high frequencies centered around 5 kHz during compression
  - Sidechain HPF: 200 Hz high-pass filter, switchable
  - Bypass: True hardware relay bypass via IN switch; auto-engages on power-down
  - Input Stage CMRR: -70 dB @ 1 kHz
  - Level Meter: 6-segment LED, -30 dBu to +20 dBu in 10 dB steps
  - Gain Reduction Meter: 10-segment LED, -2 dB to -20 dB in 2 dB steps
