description: 12-inch two-way passive floor monitor from Electro-Voice's Tour X
  series, pairing a low-distortion SMX2121 12-inch woofer with a 1.25-inch
  DH3/2010A titanium HF compression driver on a constant-directivity 90 degree x
  50 degree horn for small-to-medium stage monitoring.
details: >-
  The TX1122FM is the 12-inch passive floor monitor (wedge) in Electro-Voice's
  Tour X (TX) series, designed for small-to-medium stages and voiced to match
  the full-range TX cabinets for consistent system tonality. It pairs a
  low-distortion SMX2121 12-inch woofer (using EV's fully symmetric drive
  geometry) with a 1.25-inch DH3/2010A titanium HF compression driver behind a
  constant-directivity 90 degree H x 50 degree V horn, crossed over at 1.6 kHz
  through an integrated 24 dB/octave network with HF protection. EV's Signal
  Synchronized Transducers technology aligns the woofer and tweeter for smooth
  on-axis response.


  The vented low-frequency enclosure is built from plywood and MDF with a black
  EVCoat finish for road durability, and includes two integrated handles for
  easy transport. As a passive cabinet the TX1122FM requires external
  amplification; two parallel-wired Neutrik NL4 Speakon connectors on the rear
  act as the input and a loop-through to a second wedge. Rated for 500 W
  continuous / 2000 W peak with 99 dB sensitivity and 132 dB calculated maximum
  SPL.
specs: |-
  - Configuration: 2-way passive floor monitor (wedge)
  - LF driver: 12-inch SMX2121 with fully symmetric drive
  - HF driver: 1.25-inch DH3/2010A titanium compression driver
  - Horn: Constant-directivity 90 degree H x 50 degree V
  - Crossover: Integrated 24 dB/octave with HF protection
  - Crossover frequency: 1,600 Hz
  - Frequency response (-3 dB): 70 Hz - 20 kHz
  - Frequency range (-10 dB): 55 Hz - 20 kHz
  - Recommended high-pass frequency: 60 Hz
  - Sensitivity (1 W / 1 m): 99 dB
  - Maximum SPL (1 m, calculated): 132 dB
  - Power handling: 500 W continuous / 2000 W peak
  - Nominal impedance: 8 ohms (6.4 ohms minimum)
  - Coverage pattern (-6 dB): 90 degrees H x 50 degrees V
  - Connectors: Parallel Neutrik NL4 Speakon (input + loop-through)
  - Enclosure: Vented LF, plywood and MDF with EVCoat
  - Finish: Black EVCoat
  - Handles: Two integrated
  - Signal Synchronized Transducers for woofer/tweeter alignment
  - Rotatable horn: No
  - Dimensions (H x W x D): 440 x 364 x 573 mm
  - Net weight: 19.8 kg
