description: Spectacular explosions and high-speed car crashes will never sound
  as gloriously punchy, life-like and rich in detail as they will from this
  Custom Theatre subwoofer. With its powerful 15in paper/Aramid Fibre drive
  unit, the CT SW15 delivers the maximum performance for your money.
details: |-
  CT SW15 is the largest of Bowers & Wilkins' Custom Theater closed-box subwoofers, built around a single 380mm (15in) paper/Aramid Fibre bass driver. It is a 15-in passive subwoofer intended for use with an external rack-mount amplifier, so there is no on-board amplification and no mains connection: it is driven from a power amplifier or from a channel of a distribution amplifier.

  The CT SW series is intended both for home theater installations and for augmenting the bass performance of full-range speakers in conventional 2-channel audio systems. The cabinet is designed to be installed inside existing or custom-built home theater cabinetry close to the floor, or to stand free on the floor. The manual warns that the cabinetry must be able to carry the weight and must not resonate, because significant panel vibration audibly degrades the result.

  Two sets of feet ship in the accessory pack: four M6 spike feet with lock nuts for piercing carpet and resting on the floor beneath, and four M6 rubber feet for use inside cabinetry, where they both protect the cabinet finish and reduce transmitted vibration. Bowers & Wilkins advises fitting the feet after the subwoofer position has been optimised, and levelling out any rocking by backing off the spike that does not touch the floor.

  The rear panel offers two ways in. A pair of binding post terminals takes stripped wire quickly, red for positive and black for negative, while a Neutrik SpeakOn socket gives a more secure and reliable locking connection; a two-pole SpeakOn plug is supplied in the box. The manual notes that in bridged operation the two amplifier channels of a zone combine into a mono output of double the power, with the relevant terminals marked 1- and 2+.

  The grille is magnetically fixed and can be removed for cleaning. Because the drive unit radiates a stray magnetic field well beyond the cabinet, Bowers & Wilkins recommends keeping magnetically sensitive items at least 0.5m away, although LCD and plasma screens are unaffected. A run-in period of roughly a week for temperature effects and about 15 hours of use for the mechanical parts is expected before the subwoofer reaches its intended performance.
specs: |-
  - Drive units: 1x Ø380mm (15in) paper/Aramid Fibre bass driver
  - Closed-box (sealed) Custom Theater subwoofer
  - Passive: no on-board amplifier, no mains inlet, driven from an external rack-mount power amplifier
  - Rear panel connections: one pair of binding post terminals plus one Neutrik SpeakOn socket
  - Supplied accessories: 4x M6 spike feet, 4x M6 rubber feet, 4x lock nuts (10mm across flats), 1x two-pole Neutrik SpeakOn plug
  - Magnetically attached removable fabric front grille
  - Stray magnetic field: keep magnetically sensitive items at least 0.5m (20in) away; LCD and plasma screens unaffected
  - Intended for home theater installations and for augmenting full-range speakers in 2-channel systems
  - Finish: Black
  - Shares its manual with the CT SW10 and CT SW12
