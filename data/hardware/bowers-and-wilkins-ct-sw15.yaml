description: Spectacular explosions and high-speed car crashes will never sound
  as gloriously punchy, life-like and rich in detail as they will from this
  Custom Theatre subwoofer. With its powerful 15in paper/Aramid Fibre drive
  unit, the CT SW15 delivers the maximum performance for your money.
details: |-
  The CT SW10, 12 and 15 are designed both for Home Theatre installations and to augment the bass performance of 'full range' speakers in 2-channel audio systems. The CT SW Series subwoofers are intended to be installed either within existing or custom designed home theatre system cabinetry close to, or on, the floor.

  If the subwoofer is to be installed within cabinetry, it is important to ensure that the cabinetry is capable of carrying the weight and that it is structurally reliable. Screw-in rubber feet are supplied for attachment to the underside of the subwoofer in order both to protect the cabinet finish and to reduce vibration. If the subwoofer is to be installed free-standing on the floor, spike feet are supplied that are designed to pierce carpet and rest on the floor surface, with lock nuts to stop the cabinet rocking.

  The ear poorly perceives the source location of low-frequency sound, so the position of subwoofers in the listening room is generally less critical compared to full-range speakers. Best results are usually obtained if the subwoofer is placed between the left and right speakers or in the vicinity of one of them, and if two subwoofers are used it is best to put one near the left and one near the right speaker. Using multiple subwoofers maintains stereo separation to the lowest frequencies, smooths out the effects of low-frequency room resonances, and enables a higher maximum sound output.

  The subwoofers have a pair of binding post connection terminals and one Neutrik Speakon connection socket on their rear panels. The binding post terminals provide quick and easy connection of stripped wires while Speakon sockets provide a more secure and reliable connection method. For the binding posts, the positive cable connects to the red terminal and the negative cable to the black terminal. For the Speakon option in bridge-tied load mode, the speaker + terminal connects to the + terminal of the right channel and the speaker - terminal to the - terminal of the left channel on the amplifier, the two terminals for a bridged pair being marked 1- and 2+.

  A magnetically attached fabric grille is fitted and may be removed if desired. The carton contains an accessory pack with four M6 spike feet, four M6 rubber feet, four lock nuts and one two-pole Neutrik Speakon plug.
specs: |-
  - Description: Custom Theater closed-box subwoofer with external rack-mount amplifier
  - Drive units: 1x Ø380mm (15in) paper/Aramid Fibre bass driver
  - Closed-box (sealed) cabinet
  - Connections: pair of binding post terminals plus one Neutrik Speakon socket on the rear panel
  - Passive design, requires an external power amplifier (Bowers & Wilkins CDA-2HD presets cover CT SW10, CT SW12 and CT SW15 in Subwoofer / Bridge Tied Load mode)
  - Magnetically attached fabric grille
  - Supplied with four M6 spike feet, four M6 rubber feet, four lock nuts and one two-pole Neutrik Speakon plug
  - Finish: Black
  - Passive subwoofer, with no built-in amplifier and no mains inlet of its own
  - Driven from an external rack-mount power amplifier, which is the unit connected to the mains supply
  - Speaker-level connection by binding posts or a two-pole Speakon socket
