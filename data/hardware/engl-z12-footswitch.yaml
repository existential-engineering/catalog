description: Twelve-button MIDI foot controller in a stainless steel housing,
  with a seven-segment display and 128 MIDI program slots, powered from a supply
  or over MIDI phantom power from a MIDI-capable ENGL amp.
details: |-
  With the Z-12 MIDI controller, you have total control over your sounds. The 128 program slots offer plenty of space for all your favourite tones, and operating it is incredibly simple, so nothing keeps you from playing.

  Twelve solid footswitches and a seven-segment display cover the whole set of programs, and a MIDI cable is included.

  The Z-12 is either powered by a suitable power supply, or in combination with a MIDI-capable ENGL amp with the MIDI phantom power option via the MIDI cable.

  Thanks to the sturdy stainless steel housing, it's also built to withstand all the rigors of the road.
specs: |-
  - Stainless steel housing
  - Solid footswitches with 7-segment display
  - 12 footswitch buttons
  - MIDI control with 128 MIDI program slots
  - MIDI cable included
  - Powered by a suitable power supply, or by MIDI phantom power from a MIDI-capable ENGL amp over the MIDI cable
  - Dimensions: 50 x 12 x 5 cm
