description: >-
  The Gotharman Little deFormer 2 is a compact hybrid instrument combining a
  sampler, synthesizer, sequencer, and granular effects processor into a single
  rugged desktop unit designed for live performance. Released in 2012 as a
  successor to the original Little deFormer, it offers 16 sample slots per
  preset with independent parameter control and a 32-track step sequencer. The
  device comes in standard and expanded versions with up to 200 minutes of
  sample memory.
details: |-
  Released in 2012 as a successor to the original Little deFormer from 2009, the Little deFormer 2 packs enough features to qualify as a small workstation. It combines a sampler, synthesizer, sequencer, and granular effects in one box, offering musicians a way to perform live without needing to set up multiple pieces of gear.

  The instrument provides 16 sample slots per preset, each of which can be assigned a sampling or an oscillator. Parameters like waveform, loop, sample start, length, and tuning can be adjusted and modulated independently for each slot. Each sample slot also has its own filter, and these can be combined to form a filterbank. The sample engine offers 4-note polyphony.

  The built-in sequencer features 32 step tracks for notes and 4 controller tracks for parameter control, with up to 32 modulation routings per preset. The unit comes in standard and expanded versions, with the standard holding 512 presets, samplings, and songs, while the expanded version doubles these numbers and increases maximum sample length from 100 to 200 minutes.

  The compact, rugged design features a clear front panel layout with plenty of dials and buttons for hands-on control without excessive menu diving.
specs: |-
  - Polyphony: 4 voices
  - Multitimbral: 16 parts
  - Oscillators: 1
  - Waveforms: Pulse Variable, Saw Up, Sine, Square, Triangle, White Noise
  - VCA: 1 with ADSR envelope
  - Sequencer: 32-track, 32-step
  - Memory: 512 presets/samplings/songs (1024 expanded)
  - Sampler: Max 100 minutes (200 minutes expanded)
  - Control: MIDI In/Out
