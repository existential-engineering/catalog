description: The Kavalier is a compact medium-scale Bass that packs a wide
  variety of tones into an unassuming package.
details: |-
  The Kavalier is a compact medium-scale four-string bass with a solid alder body and comfort shaping, which Duesenberg says gives a serious punch, snappy attack and long sustain. The body measures 48 x 35 cm / 18.9" x 13.8" with 4.0 cm / 1.6" sides, finished in PUR lacquer, with a three-ply black or aged white pickguard and cream binding on the Narvik Blue finish.

  The scale length is 774 mm / 30.5", which Duesenberg presents as a balance between a comfortable, easy playing experience and a full, rich tone. The neck is a single piece of maple bolted to the body with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 21 jumbo frets, a Medium D profile, a steel dual-action truss rod and a headstock finished to match the body colour. The fretboard is Plek processed so the frets are perfectly level.

  Electronics centre on a single custom-made Duesenberg Phonico Splitbucker, which an innovative wiring scheme draws three distinct sounds from. Controls are one master volume, one master tone and a three-way tone selector, and Duesenberg describes the resulting range as spanning deep, resonant lows through to articulate highs.

  Hardware is nickel finished and includes Duesenberg Z-Tuners Bass, a Duesenberg 4D Bridge and Duesenberg Standard strap pins that are Straplock compatible. The bass is strung with Duesenberg Shortscale 50/107 sets.

  A Duesenberg Custom Line Case is included as standard, which Duesenberg describes as flightcase quality, classically shaped and handcrafted to endure hard travel. All required allen keys are included. Two finishes are offered, Narvik Blue and Red Sparkle.
specs: |-
  - Neck type: Bolt-on Neck, 1-piece Maple
  - Neck width: 40 mm / 1.57" (nut), 57 mm / 2.24" (12th fret)
  - Neck thickness: 21 mm / 0.83" (1st fret), 23 mm / 0.90" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 21 Jumbo 2.8 x 1.0 mm
  - Scale length: 774 mm / 30.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching Body Color
  - Body type: Solid Alder
  - Body dimensions: 48 x 35 cm / 18.9" x 13.8"
  - Height (sides): 4.0 cm / 1.6"
  - Pickguard: 3-ply Black or Aged White
  - Binding: Cream binding (Narvik Blue only)
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners Bass
  - Bridge: Duesenberg 4D Bridge
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Shortscale 50/107 (050-070-090-107)
  - Pickup: Duesenberg Phonico Splitbucker
  - Wiring: 1 Master Volume, 1 Master Tone, 3-Way Tone Selector
  - Bag: Duesenberg Custom Line Case (included)
  - Tools: All required allen keys (included)
