details: |-
  DESCRIPTION

  The tradition of offering fresh takes on classic Dennis Fano designs continues with this offset design, mixing elements of the original Mondata with a bold new aesthetic. This new version of the Mondata offers lightweight construction coupled with sleek, yet aggressive stylings and modern playability. Features include all mahogany construction, rosewood fretboards with MOTO dot inlays, 'Chunky C' neck profile and our new proprietary Mondo pickups. FEATURES & SPECS
specs: |-
  - Body Wood - Double Bound Chambered Mahogany w/Raised Center-Block
  - Neck Wood - Set Mahogany
  - Fretboard Wood - Bound Rosewood with rolled edges
  - Inlays - Pearloid/MOTO Dot
  - Side Dots - Black
  - Scale - 25"
  - Nut Width - 1.687"
  - Neck Width @ 12th Fret - 2.080"
  - Neck Carve Shape - Chunky C+
  - Neck Depth @ 1st Fret - .850"
  - Neck Depth @ 12th Fret - .990"
  - Fretboard Radius - 12"
  - Frets - 24 Medium Jumbo
  - Pickups - Neck - Rivolta Mondo P90 (7.5k) Bridge - Rivolta Mondobucker (12.5k)
  - Wiring - Vol, Tone, 3-Way Toggle, In/Out Phase (Right Switch), Coil Split (Left Switch)
  - Hardware - Nickel
  - Bridge - Tunematic (10mm String Spacing)
  - Tailpiece - Stoptail
  - Tuners - Wilkinson Vintage style with Nickel buttons
  - Knobs - Black reflector with Silver cap
  - Nut Material - Bone
