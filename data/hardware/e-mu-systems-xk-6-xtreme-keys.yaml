description: >-
  The E-mu XK-6 Xtreme Keys is a 61-key performance keyboard built around E-mu's dance and
  electronica-focused X-Lead soundset, featuring 16 real-time controllers and syncable
  arpeggiators for live electronic music performance.
details: |-
  The XK-6 puts the Xtreme Lead-1 sound engine into a full keyboard format with 61 velocity and
  aftertouch sensitive keys. It ships with 32 MB of X-Lead ROM sounds covering techno basses,
  synth leads, pads, dance drumkits, vocal stabs, analog synth emulations, and DJ scratches,
  expandable to 128 MB via three additional ROM slots.

  Performance features are central to the design, with 16 syncable and programmable arpeggiators
  and the SuperBEATS interactive Groove Mode for spontaneous live arrangement. Sixteen mute and
  enable buttons allow performers to build and deconstruct patterns on the fly.

  The synthesis engine provides 64 voices of polyphony with 50 filter types including sixth and
  twelfth-order Z-plane filters. The 24-bit dual stereo effects processor offers 29 reverb types,
  15 delay types, 8 chorus types, 7 flange types, and 5 distortion types.

  The XK-6 belongs to E-mu's genre-specific keyboard line alongside the PK-6 Proteus Keys for
  general synthesis, the MK-6 Mo'Phatt Keys for hip-hop and R&B, and Ensoniq's Halo for
  general-purpose work. Storage holds 1,152 presets with 640 ROM and 512 RAM locations.
specs: |-
  - Polyphony: 64 voices
  - Keyboard: 61 keys with velocity and aftertouch
  - Sound ROM: 32 MB X-Lead (expandable to 128 MB)
  - DACs: 4x 24-bit
  - LFO: 2 per voice
  - Filters: 50 types (6th and 12th-order Z-plane)
  - Effects: 24-bit dual stereo processor (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Presets: 1,152 (640 ROM, 512 RAM)
  - Arpeggiator: 16 syncable/programmable
  - Control: MIDI
releaseDate: "2001"
