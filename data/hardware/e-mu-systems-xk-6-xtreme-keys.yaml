description: >-
  The E-MU XK-6 Xtreme Keys is a 61-key keyboard version of E-MU's Xtreme Lead-1 sound
  module, featuring 32 MB of techno-focused sounds expandable to 128 MB. It offers 64
  voices of polyphony, 50 types of Z-plane filters, and 16 syncable arpeggiators designed
  for live electronic music performance.
details: |-
  The XK-6 represents E-MU's strategy of repackaging their successful sound modules into performance-oriented keyboard configurations targeting specific musical genres. This model emphasizes electronic dance music with its included X-Lead soundset, featuring synthesized elements like techno basses, synth leads, pads, dance drum kits, and DJ scratches. The keyboard comes equipped with Super BEATS interactive Groove Mode, enabling real-time performance control with 16 mute/enable buttons for triggering different sounds and patterns during live sets.

  Sonically, the instrument employs multi-mode resonant filters and 24-bit digital-to-analog converters, providing high-fidelity audio output suitable for professional use. Fifty types of 6th- and 12th-order Z-plane filters give the XK-6 a distinctive sound-shaping capability that set E-MU's products apart from competitors.

  The modular expansion capability allows users to progressively build their sound library by adding up to three additional 32 MB ROM cards, each offering specialized sound palettes from orchestral libraries to alternative genre collections. The dual stereo effects processor provides a comprehensive suite of reverbs, delays, choruses, flanges, and distortion types.

  The XK-6 launched as part of a broader E-MU/Ensoniq initiative offering multiple keyboard and desktop module options with interchangeable soundsets. Musicians could standardize their workflow by owning different form factors while maintaining consistent sound architecture and expandability across all units.
specs: |-
  - Polyphony: 64 voices
  - Keyboard: 61 keys with velocity and aftertouch sensitivity
  - Sound Memory: 32 MB X-Lead ROM (expandable to 128 MB via three expansion slots)
  - Filters: 50 types of 6th- and 12th-order Z-plane filters
  - LFOs: 2 per voice
  - DACs: Four 24-bit digital-to-analog converters
  - Effects: 24-bit dual stereo processor with 29 reverb, 15 delay, 8 chorus, 7 flange, and 5 distortion types
  - Arpeggiators: 16 syncable/programmable
  - Real-time Controllers: 16
  - Presets: 1152 (640 ROM, 512 RAM)
  - MIDI: Yes
releaseDate: "2001"
