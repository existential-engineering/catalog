description: >-
  The Creamware Noah is a 19-inch rack-mounted instrument modeler that brings
  software synthesizer technology into a dedicated hardware unit for live
  performance without requiring a computer. It came preloaded with six
  instruments including a drawbar organ, guitar modeler, Prophet V-inspired
  synth, and wavetable synth, with the ability to download additional
  instruments via USB.
details: |-
  The Noah was developed during an era when using computers or laptops in a live setting was still a cumbersome process. Creamware recognized that musicians wanted access to the growing ecosystem of software instruments and effects but needed a more practical, mobile solution than carrying a full computer setup to gigs.

  The device offered a broad spectrum of sounds along with significantly more flexibility than conventional synths, thanks to Creamware's ability to easily add additional instruments post-purchase. It came preloaded with six instruments: the B-2003 drawbar organ, Six-String for acoustic and electric guitar modeling, Vectron Player inspired by the Prophet V, and Lightwave, a wavetable synthesizer. The unit also featured extensive effects capabilities and could function as an effects processor for external audio signals.

  A significant feature was its onboard USB interface allowing connection to computers for editing patches and downloading additional sounds and instruments from the internet. This hybrid approach gave users the flexibility to customize their instrument setup well beyond the factory configuration.

  The front panel included a 2x40 LCD display, Compact Flash card slot, four continuous controllers, and a large control wheel for parameter manipulation, all housed in a distinctive metallic silver enclosure with navy blue screen printing.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 4 parts
  - Oscillators: 2
  - Filter: 24 dB 4-pole low pass with resonance
  - Waveforms: Additive, Pulse, Pulse Variable, Saw Down, Sine, Square, Triangle, User Drawn, Wavetable, White Noise
  - Memory: 256 patches (RAM)
  - Effects: Chorus, Delay, Reverb, EQ, Flanger, Phaser, Pitch-Shift, Autopan, Autowah, Tremolo, Filter, Distortion, Dynamics
  - Display: 2x40 LCD
  - Storage: Compact Flash card slot
  - Form Factor: 19-inch rack-mount
