description: Voltage-Controlled Voltage Processor
details: |-
  The A*B+C is a voltage-controlled voltage processor for Eurorack modular synthesizers that performs multiplication, addition, and attenuation. It provides a simple way to create complex signal interactions and timbres using fundamental arithmetic operations on voltage signals.

  The module contains two identical independent channels. Each channel takes two input signals — A and B — multiplies them together, then adds a third signal C to the result, producing the output A×B+C. Input B is normalled to +5V so the channel acts as a linear VCA when only A and C are patched, and input C is also normalled to +5V providing a DC offset by default.

  In the audio domain, the module enables ring modulation (audio × CV), linear VCA operation, signal mixing, gain amplification (multiplying two audio signals), phase inversion, and attenuation. In the CV domain it supports voltage-controlled attenuation, CV mixing, inversion, and DC voltage generation.

  The module is fully DC coupled, making it equally suited for audio-rate and control-voltage processing. Each channel features signal LED indicators for visual monitoring of output levels. The compact 6HP format houses both channels in a shallow 25mm depth.
