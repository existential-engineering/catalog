description: A distortion pedal capturing the raw, high-gain distortion sound of
  classic British amplifiers from the late 1970s, with high gain and low noise.
details: |-
  A significant part of the British Invasion of the 60's and 70's was not only bands, but equipment...particularly amplifiers. Orange was a company that built an iconic sound and following starting in the late 60's with endorsers like Peter Green from Fleetwood Mac, and even Led Zeppelin. By the mid to later 70's Orange had exported around the world, and guitar players everywhere were captured by this raw sound that was so different from Marshall or Hiwatt......and so loud! Bjorn is very familiar with this sound having played the amps in the late 70's and then going on to repairing them as well. He has captured this so-called crude distortion in the FLUORESCENT ORANGE AIAB (FOAIABn) drive pedal. With 56dB of gain and a noise level about -80dB, the FOAIABn is ideal for classic and hard rock...even early metal...all the distortion...none of the noise. The FOAIABn works best with humbucking pickups as do most distortion pedals, but there is more than enough thick distortion to satisfy the single coil and P-90 users as well. With active pickups you get less of the dynamics, but a more fluent sound. The FLUORESCENT ORANGE AIAB has that immortal distortion we recall from the late 70's. As with all the One Control BJF series pedals, the FOAIABn can be used anywhere in the signal chain, and we encourage you to experiment. It can change the sound of your amp on it's own, or be used as a pre-amp for other drives, or it can be used in series with any or all of the OC BJF pedals to create a new individual sound of your own. - Bjorn Juhl *Orange, Marshall an Hiwatt in the body text are used for explanation purposes only and we have no association with these brands. Specifications Input impedance: 500K Output impedance: 25K Drive voltage:9V Current consumption: 2.5mA @ 9V S/N ratio: -80dB Size:39Wx100Dx31H mm (excluding protruding parts) 47Wx100Dx46H mm (including protruding parts) Weight: Approx. 160 grams True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply

