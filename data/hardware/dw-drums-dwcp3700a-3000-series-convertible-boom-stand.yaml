details: |-
  The Drum Workshop 3000 Series Hardware has been completely redesigned from the ground up. This sturdy double-braced, medium-weight stand is both highly-functional and versatile.

  Convertible to a straight cymbal stand, it features a clock-style ratchet adjustment, newly-tooled tube joint with integrated memory locks, adjustable cymbal seat, QR Wingnut with captured cymbal felt and Infinite Tilter with Tech-Lock.

  Convertible design lets you play this stand in either a boom or straight position, while the Infinite Tilter and adjustable seat give superior cymbal control and positioning for every preference. Integrated memory locks set or reset the stand quickly at the right heights every time.

  The 3000 Series is engineered for drummers of all levels, with sturdy double-braced hardware providing stability and durability during intense performances, smooth memory locks for seamless adjustment, and a sleek design that complements any drum kit.
