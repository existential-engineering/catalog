description: The Chop Shop 500 Series EQ offers a unique and intuitive set of
  features for quickly shaping tones with minimal fuss, empowering you to
  achieve focus and separation in your mix. Available with a silver or black
  aesthetic (limited Void Corp Edition).
details: |-
  Features:

  FOCUS: Intuitive filter that focuses the energy in a source on the bass or treble ranges of the sound. Apparent loudness of source is maintained constant for meaningful A/B comparisons. SHIFT switch decreases turnover frequency for a different midrange response.

  LO-CUT: 12 dB/oct filter that rolls off low frequencies, variable 20 to 530 Hz. Jumper selectable 'Lo-Rider' mode transforms LO-CUT section into a low-frequency hi-cut section with variable resonance.

  BUMP: Variable resonance control for LO-CUT that adds a resonant 'bump' at the corner frequency. Response from Bessel (full CCW), to Butterworth (12 noon), to slightly resonant (0.5 dB full CW). MORE switch increases resonance dramatically.

  HI-CUT: 6 dB/oct filter that rolls off high frequencies, variable 500 Hz to 25 kHz. 0.5X switch shifts frequency range one octave lower, while simultaneously increasing slope to 12 dB/oct and adding slight resonance at corner frequency to retain apparent brightness (defeatable by jumper on PCB).

  Available finishes: Silver and Black (limited Void Corp Edition). Power: +/- 16V provided by API 500 series compatible rack (not included).
specs: |-
  - Intuitive filter that focuses the energy in a source on the bass or treble ranges of the sound. Apparent loudness of source is maintained constant for meaningful A/B comparisons. SHIFT switch decreases turnover frequency for a different midrange response.
  - 12 dB/oct filter that rolls off low frequencies, variable 20 to 530 Hz. Jumper selectable 'Lo-Rider' mode transforms LO-CUT section into a low-frequency hi-cut section with variable resonance (hint: try this on a front of kick or Subkick mic and blend back in for incredibly deep and massive low end).
  - Variable resonance control for LO-CUT that adds a resonant 'bump' at the corner frequency. Response from Bessel (full CCW), to Butterworth (12 noon), to slightly resonant (0.5 dB full CW). MORE switch increases resonance dramatically... sometimes MORE is more.
  - 6 dB/oct filter that rolls off high frequencies, variable 500 Hz to 25 kHz. 0.5X switch shifts frequency range one octave lower, while simultaneously increasing slope to 12 dB/oct and adding slight resonance at corner frequency to retain apparent brightness (defeatable by jumper on PCB).
  - DC coupled signal path with DC servo at input stage (no electrolytic caps in audio path)
  - Audiophile grade op amps (LME49720), class A biased
  - Alps pushbutton switches
  - Wima polypropylene film capacitors
  - Panasonic FM series power supply decoupling capacitors
  - Custom 41 detent potentiometers
  - Custom molded knobs
  - Aluminum faceplate with matte finish
  - Power: +/- 16V provided by an API 500 Series compatible rack (not included)
  - Using the Chop Shop EQ to Enhance Separation and Focus
