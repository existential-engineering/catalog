details: |-
  Boasting the style and massive sound Eddie Van Halen is known for, the Wolfgang® WG Standard Exotic features all-new exotic wood options for players with distinguished taste.

  The Wolfgang WG Standard Exotic Laurel Burl offers a basswood body with special "comfort cut" forearm contour for maximum playing ease, along with attractive natural body binding and a sophisticated laurel burl top. Its bolt-on baked maple neck with graphite-reinforcement rods holds strong against the ravages of temperature and humidity, while a conveniently located spoke wheel at the base of the neck makes for quick and painless truss rod adjustments. Designed for comfortable playability and speed, this stylish axe also features an oiled finish on the back of the neck and a 12"-16" compound radius baked maple fingerboard with rolled edges, 22 jumbo frets and black dot inlays.

  Dual EVH® Wolfgang® humbucking pickups mounted directly to the body increase vibration transfer, resulting in sustain for days on end. Two black knurled control knobs have been dialed-in to Van Halen's exacting specifications - the smooth-feeling 500k pots make it easy to find a unique sound while retaining the crisp high-end sparkle of the Wolfgang pickups. The EVH-branded Floyd Rose® Special bridge and R2 locking nut consistently keep the instrument in tune through the deepest whammy dives and horse whinnies.

  Decked out for playing performance and comfort, the Wolfgang WG Standard Exotic Laurel Burl is available in a Natural finish with black headstock and black chrome hardware.
