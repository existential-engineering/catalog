url: https://www.fostex.jp/en/products/t50rpmk4/
description: Fourth-generation evolution of Fostex's industry-standard T50RP
  semi-open dynamic headphone, featuring a renewed RP planar magnetic driver
  with an updated coil pattern and increased magnet count for improved transient
  response and frequency distribution. The new symmetrical housing allows the
  detachable cable to be connected on either the left or right cup, and the
  4-pole 3.5 mm input supports balanced operation. Ships with thicker,
  low-resilience ear pads for extended comfort and a 2 m φ3.5 mm (4-pole) to
  φ3.5 mm (3-pole) stereo cable plus a 3.5 mm to 6.3 mm conversion connector.
details: |-
  Configuration: Semi-open, around-ear, planar magnetic headphones with detachable single-sided cable (left or right cup) and balanced-capable 4-pole input

  Features:
  - 4th-generation RP planar magnetic driver with improved coil pattern and increased magnets for enhanced transient response and frequency distribution
  - Symmetrical housing allowing the detachable cable to be connected on either the left or right cup
  - Balanced-capable input via 4-pole 3.5 mm connector
  - Thicker, low-resilience ear pads for extended-wear comfort
  - Semi-open dynamic design built on Fostex's proven RP (Regular Phase) planar magnetic technology

  Series: RP Series
