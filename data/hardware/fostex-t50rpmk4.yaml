description: Semi-open RP stereo headphones built around a significantly renewed RP planar magnetic driver with a full-field-driven planar diaphragm originally developed by Fostex. The 4th generation RP headphones pair the evolved driver with a new housing design that further refines the sound of the planar diaphragm.
details: |-
  The traditional RP planar magnetic driver, recognized in music studios around the world, has been significantly renewed and the T50RP has evolved into the mk4. RP drivers have been used in a variety of models and have been recognized by musicians and engineers in music studios around the world as monitor headphones. RP and RP Technology are Fostex's proprietary technologies that move the entire surface of the planar diaphragm in regular phase.

  The RP technology planar magnetic driver, first developed over 50 years ago and refined continuously throughout the years, has now hit its 4th generation. A new printed coil pattern shape has been employed to expand and equalize the vibration area of the flat diaphragm. Additionally, the number of magnets that sandwich the diaphragm has been increased substantially. Furthermore, the components of the magnetic circuit have been redesigned to optimize their magnetic flux distribution, suppressing unnecessary resonance and achieving even better transient response.

  This 4th generation driver simultaneously achieves improved sensitivity, smooth frequency response, and superb transient characteristics. By accurately and delicately reproducing elements all across the frequency spectrum, the soundstage and localization have also been improved. The new driver is also more efficient, requiring less power from the headphone amplifier to achieve peak performance.

  Both the left and right housings are equipped with connectors for the supplied cable, so that the cable can be connected to either the left or right depending on the usage environment. By making the left and right housings symmetrical, the difference in sound characteristics usually caused by differing internal structures between sides has been eliminated. The connector is a 4-pole 3.5 mm type, which supports balanced connections. The cable uses high-quality OFC conductors.

  The new, thicker ear pads feature a low-resilience, around-ear type that provides a comfortable fit, making them comfortable to use even when listening for long periods of time.
specs: |-
  - Type: Semi-open dynamic
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 97 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 330 g (excluding cable)
  - Cable connectors on both left and right housings, 4-pole 3.5 mm, balanced capable
  - Accessories: 3.5 mm (4-pole) to 3.5 mm (3-pole) stereophone cable (2 m) x 1, 3.5 mm to 6.3 mm stereophone conversion connector x 1
  - Passive wired headphones, no power supply required
  - Series: RP Series
