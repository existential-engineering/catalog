details: |-
  The BDA16 is a 16-channel DAC daughter card for the BURL Audio B80 and B16 Motherships. It features all discrete transistor, class-A circuitry with the BOPA14 op-amp and BURL NextGen analog circuit path. With its higher channel density, the BDA16 delivers superior class-A analog conversion at a lower cost per channel compared to the BURL GREEN DAC line.

  A B80 chassis supports up to 128 maximum DAC channels with BDA16 cards at 44.1 k/48 k (using BMB2 or BMB3 motherboards), while a B16 chassis supports up to 32 channels. The BDA16 pairs directly with the BAD16 to create a 64-in/64-out system in a single B80 chassis.
specs: |-
  - 16-channel DAC
  - All class-A analog, discrete transistor
  - BURL NextGen circuit path with BOPA14 discrete op-amp
  - 32 maximum DAC channels with B16
  - 128 maximum DAC channels with B80 (BMB2, BMB3 @ 44.1 k, 48 k)
  - Front panel signal indication
  - Automatic BMB1-DigiLink detection for Avid Delay Compensation
  - MOTHERSHIP 3 compatible
