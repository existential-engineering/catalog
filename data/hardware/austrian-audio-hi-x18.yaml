details: |-
  The Hi-X18 is a limited-edition closed-back over-ear headphone from Austrian Audio, released to celebrate the company's fifth anniversary. It features Austrian Audio's Hi-Xcursion 44mm driver technology for clear, detailed, and balanced audio reproduction. Memory-foam ear pad and headband cushions, patented replaceable ear pad system, reinforced metal headband, and foldable design. The detachable 3m cable terminates in 3.5mm.
