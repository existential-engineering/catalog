description: >-
  The Malekko Manther is a tabletop analog monosynth built around coveted CEM3340 and SSM2044
  chips, featuring a 64-step digital sequencer with per-step automation and onboard delay.
details: |-
  The Manther is a full-featured tabletop monosynth from Portland-based Malekko Heavy Industry Corporation. Its biggest draw is the analog signal path built around two legendary integrated circuits: the CEM3340 VCO chip, famously used in the Roland SH-101, Sequential Prophet 5, and Oberheim OB-8, and the SSM2044 filter chip found in the Korg Monopoly and Polysix. This pedigree gives the Manther a classic analog character rooted in proven designs.

  The Source Mixer provides hands-on control over square, triangle, sawtooth, triangle shape, noise, and sub-oscillator levels, with individual outputs for each waveform. The SSM2044-based low-pass filter with resonance is paired with dedicated ADSR envelopes for both VCA and VCF, and a flexible LFO offers sine, rectangle, sawtooth, ramp, and random waveforms.

  The 64-step digital sequencer is where the Manther distinguishes itself from simpler monosynths. Every step can carry automation across all major synthesis parameters, and 64 presets can store complete sequences with automation data. Songs are built by chaining presets in any order, and per-step repeat and probability functions add rhythmic variation. A menu system provides deeper access to parameters including sub semitones, envelope settings, sequence direction, division and multiplication, and LFO phase.

  Connectivity is extensive, with 3.5mm jacks for Eurorack integration including LFO output, VCO CV input, sequencer CV and gate outputs, individual waveform outputs, and clock I/O. Rear-panel MIDI jacks enable connection to external gear beyond the modular world. An onboard delay effect rounds out the feature set.
specs: |-
  - Polyphony: 1 voice
  - Oscillators: 1 VCO (CEM3340) with pulse/PWM, sawtooth, triangle/waveshaper, sub-oscillator
  - Filter: Low-pass with resonance (SSM2044)
  - LFO: 1 LFO (sine, rectangle, sawtooth, ramp, random)
  - Envelopes: ADSR for VCA and VCF
  - Effects: Onboard delay
  - Sequencer: 64-step with per-step automation, 64 presets
  - Keyboard: None (tabletop with note entry buttons)
  - Control: MIDI In/Out, CV/Gate, clock I/O
