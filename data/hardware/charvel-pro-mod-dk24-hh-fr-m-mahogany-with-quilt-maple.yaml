details: |-
  The Pro-Mod DK24 HH FR M Mahogany with Quilt Maple pairs a sleek Dinky-shaped mahogany body with a quilt maple top in a Dark Amber gloss finish, accented by satin gold hardware, a sculpted shredder's cut heel, and a scalloped lower back bout for unimpeded upper register access.

  The bolt-on maple neck features graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. A maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets and offset black dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics are built around a versatile HH configuration: a Seymour Duncan Full Shred SH-10B at the bridge and a Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch that delivers full and inner-coil voicings. A 500K EVH Bourns Low Friction volume pot and a no-load tone control round out the wiring.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, dome-style control knobs, and a white switch tip. The licensed Fender Stratocaster headstock, 4-bolt sculpted heel, and heel-mount truss rod adjustment wheel complete a thoroughly modern high-performance platform.
