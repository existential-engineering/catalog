details: |-
  Alex De Grassi is an American fingerstyle guitarist, composer and performer with an association with George Lowden and Lowden Guitars that spans decades.

  The Alex De Grassi Lowden Signature model is an F body shape with an extra deep cutaway, handcrafted with AAAA grade Quilted Maple back and sides and a selected AAAA Sitka Spruce soundboard. It features Honduran Rosewood body bindings and a 5-piece Figured Maple neck with a Walnut centre strip and Purpleheart splices.

  Of the instrument, De Grassi has said: "I love this guitar! I've loved the prototype from the moment I pulled it out of the case. It has great volume and projection, but can also be played softly and still maintain the excellent balance and clarity that makes this model so special."

  As an artist signature model, the guitar is not configurable. It is available in left- or right-handed versions, and every one is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Model: Alex De Grassi Signature
  - Body shape: F with extra deep cutaway
  - Back and sides: AAAA Quilted Maple
  - Soundboard: selected AAAA Sitka Spruce
  - Body bindings: Honduran Rosewood
  - Neck: 5-piece Figured Maple with Walnut centre strip and Purpleheart splices
  - Handedness: available right-handed or left-handed
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
