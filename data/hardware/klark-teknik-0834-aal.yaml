description: The 3RD DIMENSION BBD-320 is an analog multi-dimensional signal
  processor that recreates the classic chorus tones of the 1980s. Its sound is
  based on authentic Bucket Brigade Device technology with a pure analog signal
  path, and four buttons select the chorus character.
details: |-
  The chorus effect has been a studio mainstay since the 1980s, used by artists such as Brian Eno, Stevie Ray Vaughan and Peter Gabriel. The 3RD DIMENSION BBD-320 is an affordable analog multi-dimensional signal processor built to recreate those classic tones.

  The BBD-320's effects are based on authentic Bucket Brigade (BBD) technology, maintaining the character of the original 1980s circuit for rich chorus sounds on guitar, synth or bass. It is built with a pure analog signal path for signal integrity.

  Controls are deliberately simple, with no speed, tone or depth knobs. Four buttons set the character, from a subtle warble on button 1 up to a more intense chorus on button 4, and two buttons can be pressed at the same time to stack choruses for more nuanced effects. A precise 10-segment LED meter monitors the output level.

  The chorus can be switched on or off remotely by connecting a footswitch to the 1/4-inch input on the front of the unit. At the back are servo-balanced inputs and outputs on 1/4-inch TRS and gold plated XLR connectors, and the unit can be switched to either stereo or mono operation.
specs: |-
  - Analog Bucket Brigade Device (BBD) chorus circuit
  - Pure analog signal path
  - 4 chorus buttons, combinable to stack choruses
  - Servo-balanced inputs and outputs on 1/4-inch TRS and gold plated XLR connectors
  - Switchable stereo or mono operation
  - 10-segment LED output level meter
  - Front-panel 1/4-inch footswitch input for remote on and off
