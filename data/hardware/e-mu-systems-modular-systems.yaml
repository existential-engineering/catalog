description: >-
  The E-mu Modular Systems were custom-built analog modular synthesizers produced in limited quantities from 1973 to 1981,
  featuring drift-free oscillators and clean filter designs that competed with ARP and Moog modular instruments.
details: |-
  E-mu Systems produced just over 250 of these modular synthesizers between 1973 and 1981, building each one as a custom instrument for professional musicians and universities. These systems competed directly against the ARP 2500, ARP 2600, and Moog modular synthesizers, earning respect for their engineering quality and sonic precision.

  The modular architecture requires patch cord connections to route signals between modules, following the classic modular synthesis paradigm. A distinctive feature was the firm-wire patching system, which allowed frequently used signal routings to be semi-permanently connected at the rear panel. Inserting a front panel patch cord would automatically bypass the firm-wired connection, providing a convenient way to store favorite voicings while maintaining full flexibility.

  E-mu's oscillators were renowned for being virtually drift-free thanks to unique circuit designs, a significant advantage in an era when analog oscillator stability was a persistent challenge. Their filters were notably cleaner than those from Moog and ARP, though some users actually preferred the grittier character of competing designs. The systems featured bright aluminum panels with blue lines separating each module, giving them a distinctive visual identity.

  With fewer than 100 units believed to survive today, E-mu Modular Systems are exceptionally rare. Notable users include Vince Clarke, Herbie Hancock, Pat Gleeson, Hans Zimmer, Meat Beat Manifesto, Frank Zappa, and Roger Linn, reflecting the instrument's appeal across electronic, jazz, film scoring, and experimental music.
specs: |-
  - Polyphony: 1-2 voices (configuration dependent)
  - VCO modules: Sine, Triangle, Sawtooth, Square waveforms
  - Coarse/fine tuning, sync, pulse width control
  - VCC (Voltage Controlled Clock): Sawtooth, Pulse
  - Sample-and-Hold modules
  - 24dB low-pass filter (cutoff, Q, key track, resonance)
  - 24dB high-pass filter
  - Universal filter (high/band/low-pass and notch)
  - Ring modulator module
  - VCA with DADSR envelope
  - Quad inverter module
  - Dual transient generator
  - Noise generator
  - Envelope follower
  - Dual reverb module
  - 61-note CV/Gate controller keyboard with 4 control sliders
  - 2 CV/Gate (1V/octave)
  - No patch memory
  - Firm-wire rear panel patching with front panel override
