details: |-
  The Martin D-35 is a unique and trusted classic in the Standard Series, first introduced in the mid-1960s and played by countless music legends ever since. Its Dreadnought (D-14 Fret) body delivers a bold, projective sound with strong bass, clear trebles, and rich overtones suited to a wide range of playing styles.

  The instrument is built with a solid Sitka spruce top and solid East Indian rosewood back and sides, distinguished by the iconic three-piece back design and lighter, non-scalloped 1/4" bracing that give the D-35 its balanced yet powerful voice.

  The 2025 Standard Series refresh brings Sitka spruce GE top bracing for vintage-inspired tone and sustain, a reimagined GE Modified Low Oval neck with High-Performance Taper, a thinner fingerboard, and a refined bridge and heel for improved playability. The 25.4" scale length, 1 3/4" nut width, and 2 1/8" width at the 12th fret keep the feel familiar.

  Appointments include antique white binding, a bound ebony fingerboard with mother of pearl dot inlays, an ebony bridge with a compensated bone saddle and bone pins, and chrome enclosed gear tuners. The guitar is finished in gloss on the body with a satin neck and ships in a molded hardshell case.

  Like all Standard Series instruments, the D-35 is handcrafted in Nazareth, Pennsylvania and backed by Martin's limited lifetime warranty.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Solid Sitka Spruce
  - Back and Sides: Solid East Indian Rosewood (three-piece back)
  - Bracing Pattern: Forward-Shifted X-Brace, GE Non-Scalloped, 1/4"
  - Top Bracing Material: Sitka Spruce GE
  - Scale Length: 25.4"
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Neck Finish: Satin
  - Body Finish: Gloss
  - Fingerboard Material: Ebony
  - Nut Width: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Mother of Pearl Dots
  - Total Frets: 20 (joins body at 14th fret)
  - Bridge Material: Ebony
  - Saddle: Compensated Bone
  - Bridge Pins: Bone
  - Nut Material: Bone
  - Binding: Antique White
  - Tuning Machines: Chrome Enclosed Gear
  - Case: Molded Hardshell
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium
  - Electronics: None
