id: JVAnHkojLgj9CI4nvUCEX
name: ZLX G2 Powered Loudspeaker
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/zlx-g2-powered-loudspeaker/
description: The ZLX G2 is the next generation of EV's bestselling portable
  powered loudspeaker series, available in 8-inch (ZLX-8P-G2), 12-inch
  (ZLX-12P-G2), and 15-inch (ZLX-15P-G2) configurations. Each model pairs a 1000
  W Class D amplifier with a custom ferrite woofer and a 1.4-inch DECA2516
  titanium compression driver in a 90 x 60 degree waveguide, delivering up to
  129 dB peak SPL. A built-in Dynacord-derived digital mixer adds effects,
  automatic feedback suppression (AFS), a ducker, and parametric EQ, while
  Bluetooth wireless stereo streaming and the QuickSmart Mobile app provide
  remote control and audio playback. The polypropylene cabinet with
  powder-coated steel grille keeps the system portable and durable for live
  sound, DJ, and stage monitor applications.
details: >-
  Series includes ZLX-8P-G2 (8-inch), ZLX-12P-G2 (12-inch), and ZLX-15P-G2
  (15-inch) powered models


  1000 W Class D amplifier per cabinet


  1.4-inch DECA2516 titanium compression driver with ferrite magnet


  Custom ferrite LF drivers: WECA2088 (8-inch), WECA2128 (12-inch), WECA2158
  (15-inch)


  Maximum SPL up to 126 dB (8P), 127 dB (12P), 129 dB (15P) at 1 m


  Frequency response -3 dB: 58-20,000 Hz (8P), 54-18,500 Hz (12P), 48-18,000 Hz
  (15P)


  90 x 60 degree coverage pattern across all models, 1.40 kHz crossover


  Built-in Dynacord digital mixer with effects, AFS, ducker, and parametric EQ


  Bluetooth wireless stereo audio streaming


  QuickSmart Mobile app for remote control and monitoring


  Two XLR/TRS combo inputs plus a 1/4-inch TS Hi-Z instrument input


  Polypropylene cabinet with powder-coated steel grille


  Universal switching power supply, 100-240 V, 50/60 Hz


  Pole-mount socket and integrated handles for portable use
specs: >-
