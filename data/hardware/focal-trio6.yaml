url: https://www.focal.com/products/trio6
description: 3-way studio monitor with an 8" W cone subwoofer, 5" W cone
  midrange, 1" Beryllium inverted dome tweeter, and Focus mode for switching
  between 3-way, 2-way, and 1-way references.
specs: |-
  - 3-way monitor with Focus mode
  - Subwoofer: 8" W membrane
  - Woofer: 5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (3-way mode, ±3 dB): 35 Hz – 40 kHz
  - Frequency response (2-way Focus): 80 Hz – 20 kHz
  - Frequency response (1-way Focus): 100 Hz – 15 kHz
  - Maximum SPL (peak @ 1 m): 115 dB
  - Bass amplifier: 100 W class G
  - Midrange amplifier: 100 W class G
  - High frequency amplifier: 50 W class AB
  - Bass/midrange level (160 Hz): adjustable ±3 dB
  - Bass level (>250 Hz): adjustable ±3 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - High-pass filter: Full range, 45 Hz, 60 Hz, 90 Hz
  - Local supply: 100–120 V or 220–240 V
  - Dimensions (H × W × D): 53.7 × 29.2 × 36.9 cm (20.86 × 11.41 × 14.52 in)
  - Weight: 25 kg (55.12 lb)
