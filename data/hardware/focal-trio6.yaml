description: Trio6 is a professional monitoring loudspeaker offering flawless transparency, dynamics and sonic precision. Its dual Focus Mode enables Trio6 to form three monitors in one, for perfectly crafted, controlled mixes.
details: |-
  Trio6 is a professional monitoring loudspeaker offering flawless transparency, dynamics and sonic precision. Reliability and versatility are also its hallmarks, as evidenced by its dual Focus Mode, which enables Trio6 to form three monitors in one, for perfectly crafted, controlled mixes.

  Versatility and functionality: Trio6 includes a variable high-pass filter, a 160 Hz parametric filter to reduce console reflections and a switchable automatic standby mode. With its smooth speakers, full analogue filtering and performance-oriented design, this monitor is a versatile and reliable work tool.

  Focal technologies: Beryllium inverted-dome tweeter, "W" diaphragm for woofer and subwoofer, TMD suspension, large laminar air vent and IAL. The sound is remarkably neutral throughout the spectrum, with a precise midrange, impactful bass and excellent dynamics with very low distortion.

  Dual Focus Mode: the Focus Mode lets you switch from a 3-way to a 2-way monitor, offering a different speaker configuration at the touch of a pedal. Trio6 features a dual Focus Mode for extreme versatility: a 3-way monitor, a 2-way monitor (midrange and tweeter) and a 1-way full-range monitor (midrange only).

  Reinforced cabinetry: the ST6 cabinets are made of thick, sturdy MDF and feature internal reinforcements to provide damping and rigidity, while limiting vibration and therefore distortion.
specs: |-
  - Product type: 3-way monitor
  - Subwoofer: 8" W membrane
  - Woofer: 5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (+/- 3dB): 3-way mode 35 Hz - 40 kHz; 2-way Focus mode 80 Hz - 20 kHz; 1-way Focus mode 100 Hz - 15 kHz
  - Maximum SPL (peak @ 1m): 115 dB
  - High frequency amplifier: 50 W, class AB
  - Bass amplifier: 100 W, class G; midrange amplifier: 100 W, class G
  - Inputs: XLR symmetrical 10 kOhms
  - High-pass filter: full range, 45 Hz, 60 Hz, 90 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-3 dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, HPF, LF Shelv, LMF EQ, HF Shelv, Focus Mode
  - LEDs: power on, Focus mode, clipping/default/stand-by
  - Local supply: ~100-120 V T2.5AL/250 V; ~220-240 V T1.25AL/250 V
  - On/Off switch on the rear panel
  - TMD suspension, IAL, large laminar air vent
  - Height: 53.7 cm / 20.86 in
  - Width: 29.2 cm / 11.41 in
  - Depth: 36.9 cm / 14.52 in
  - Weight: 25 kg / 55.12 lb
