description: The Klipsch Reference R-50M Bookshelf speaker monitors feature
  next-generation horn-loaded technology designed to deliver big sound in
  any-sized space.
details: |-
  The R-50M features an updated 90° x 90° Tractrix horn design with increased outer horn dimensions, delivering more controlled directivity and greater power across a broader frequency range for enhanced clarity and dynamics.

  An exclusive 1" Linear Travel Suspension (LTS) aluminum tweeter with Kapton suspension minimizes distortion and provides high efficiency, ensuring detailed and accurate high-frequency reproduction.

  The 5.25" Spun-Copper Thermoformed Crystalline Polymer (TCP) woofer features steeper cone angling for a smoother frequency response and improved accuracy throughout the midrange and bass.

  The cabinet is constructed from MDF with hidden fasteners, an edge-to-edge horn design, low-profile magnetic grilles, and a scratch-resistant textured wood grain vinyl finish for a refined, durable aesthetic.
