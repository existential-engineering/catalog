description: >-
  The E-mu Proteus 2000 is a 128-voice rack-mount sound module that revitalized E-mu's
  iconic Proteus line, featuring 32MB of expandable ROM, Z-plane filters, and a
  comprehensive dual stereo effects engine across 32 MIDI channels.
details: |-
  The Proteus 2000 represents a complete reinvention of E-mu's beloved Proteus rack module series from the early 1990s. While its synthesis architecture maintains continuity with the original Proteus design, the 2000 packs in dramatically expanded features, sounds, and expandability for demanding professional use.

  The sound engine delivers 128-voice polyphony across 32 MIDI channels, powered by 32MB of "Composer" ROM expandable to 128MB through four internal expansion slots. E-mu's extensive library of optional soundsets covers everything from orchestral to electronic to world instruments. The 1,536 presets split between 1,024 ROM and 512 user-programmable slots provide an enormous range of starting points.

  The filtering section is a particular highlight, featuring 50 types of multi-mode resonant filters including the Z-plane filters inherited from E-mu's Morpheus and UltraProteus. These complex filter algorithms create evolving, animated timbres impossible with conventional filter designs. Each voice gets its own filter and two LFOs for modulation, enabling rich, detailed sound design.

  Processing is handled by a dual stereo effects engine with 29 reverb types, 15 delay types, 8 chorus types, 7 flange types, and 5 distortion types. Six individual polyphonic outputs and four real-time control knobs accessing 12 parameters round out a specification that made the Proteus 2000 one of the most versatile rack modules of its era, serving as the foundation for E-mu's entire family of genre-specific modules.
specs: |-
  - Polyphony: 128 voices
  - Sound ROM: 32MB "Composer" soundset (expandable to 128MB via 4 slots)
  - LFO: 2 per voice (256 total)
  - Filter: 50 types including Z-plane, multi-mode with resonance
  - Effects: 24-bit dual stereo processors (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - DAC: Four 16-bit DACs
  - Keyboard: None
  - Memory: 1,536 presets (1,024 ROM, 512 user)
  - Control: MIDI (32-part multitimbral)
  - Outputs: 6 individual polyphonic
releaseDate: "1999"
