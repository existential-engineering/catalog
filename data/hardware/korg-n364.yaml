description: >-
  A 64-voice polyphonic music workstation from 1996 built on Korg's AI2
  synthesis engine, featuring real-time pattern play and record capability along
  with a 16-track sequencer.
details: |-
  Korg introduced the N364 alongside its 76-key sibling, the N264, in 1996. Built on the proven Advanced Integrated System (AI2) synthesis engine, it delivers 64-voice polyphony with 8MB of sample ROM containing 936 programs and combinations, including 430 multisounds and 215 drum sounds.

  The N364 was the first Korg keyboard to feature real-time pattern play and record, allowing users to record and save musical phrases as patterns that could be triggered by assigned keys. This capability, combined with the 16-track sequencer supporting up to 32,000 events, made it well suited for creating complete songs without external equipment.

  The 61 semi-weighted keys provide velocity and touch sensitivity, while a joystick on the left side enables real-time control of parameters like pitch bend and VDF modulation. Two ADSR envelopes, three LFOs with triangle, pulse, saw, and random waveforms, and an arpeggiator with multiple modes offer extensive sound-shaping tools. Two digital multi-effects processors provide 47 effect types.

  Users generally praise the string and pad sounds while noting that the piano patches are less convincing. The operating system has a learning curve, but the self-contained sequencing workflow appeals to composers who prefer working without a DAW. Notable user Tuomas Holopainen of Nightwish employed the N364 in the band's early work.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Synthesis: AI2 (Advanced Integrated System)
  - Sample ROM: 8MB (430 multisounds, 215 drum sounds)
  - Programs: 936
  - LFO: 3 (triangle, pulse, saw, random)
  - Envelopes: 2 ADSR
  - Arpeggiator: Up, Down, Alt1, Alt2, Random
  - Sequencer: 16 tracks, 32,000 events, 10 songs
  - Patterns: 100 user patterns
  - Effects: 2 digital multi-effects, 47 types
  - Keyboard: 61 semi-weighted keys with velocity
  - Control: MIDI In/Out/Thru
