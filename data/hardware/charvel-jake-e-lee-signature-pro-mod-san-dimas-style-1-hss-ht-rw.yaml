description: The Jake E Lee Signature Pro-Mod San Dimas Style 1 HSS HT
  celebrates Jake E Lee's iconic Blue Burst guitar from the 1980s era, pairing
  vintage aesthetics with modern Charvel high-performance construction and a
  versatile HSS pickup configuration.
details: |-
  The Jake E Lee Signature Pro-Mod San Dimas Style 1 HSS HT pairs an alder body in a Blue Burst gloss finish with a bolt-on quartersawn maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges.

  A rosewood fingerboard with a 12" to 16" compound radius hosts 22 medium jumbo frets and white dot inlays, anchored by a 1.650" black plastic nut and a 25.5" scale length. A heel-mount truss rod adjustment wheel rounds out the neck.

  Electronics are built around an HSS configuration: a Seymour Duncan JB TB-4 humbucker at the bridge paired with DiMarzio SDS-1 DP111 single-coils in the middle and neck positions, routed through a 5-position blade switch with master volume and tone controls.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge, Charvel-branded die-cast tuning machines, and Stratocaster-style skirt control knobs, all in a black and gold hardware finish. The headstock is a licensed Fender Stratocaster shape.
