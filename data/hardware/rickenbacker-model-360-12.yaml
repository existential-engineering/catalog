name: Model 360/12
manufacturer: rickenbacker
primaryCategory: electric-guitar
url: https://www.rickenbacker.com/guitars/model-360-12/
description: Learn why the Model 360-12 is the standard in recording for over
  fifty years with its unique sound and design.
details: |-
  The world's most popular twelve string electric guitar boasts all of the
  deluxe features of its Model 360 cousin. A standard for recording for more
  than fifty years, its haunting, melodic chorus has continued to benefit from
  evolution.

  The slimmed and re-contoured neck now makes the 360/12 easier to play than
  ever, preserving the chiming jangle that defined the instrument while
  addressing the playability concerns of earlier generations.

  Built as a Deluxe semi-acoustic hollow body from maple with a maple and
  walnut set-in neck and rosewood fingerboard, the 360/12 features bound body
  construction and triangular fret markers consistent with the rest of the
  Deluxe 360 series.

  Two Hi-gain pickups deliver the characteristic articulate, shimmering twelve
  string voice heard on countless recordings since the 1960s. Standard mono
  and Rick-O-Sound stereo outputs allow the instrument's signal to be split
  into separate paths for expanded sonic possibilities.
specs: |-
