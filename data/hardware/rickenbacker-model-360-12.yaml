  - Maple body
  - Maple and walnut neck
  - Rosewood fingerboard
  - Triangle fret markers
  - Body binding: Yes
  - 21 frets
  - Scale length: 62.9 cm (24 3/4")
  - Neck width at nut: 41.4 mm (1.63")
  - Neck width at 12th fret: 49.05 mm (1.931")
  - Crown radius: 25.4 cm (10")
  - Overall length: 101 cm (39 3/4")
  - Overall width: 38.1 cm (15")
  - Overall depth: 38.1 mm (1 1/2")
  - Weight: 3.6 kg (8.0 lbs.)
  - Set-in neck
  - 2 Hi-gain pickups
  - 6-saddle bridge
  - 'R' tailpiece
  - Gotoh machine heads
  - Mono and stereo (Rick-O-Sound) output
