description: A modernized take on the classic San Dimas shred machine, pairing
  an alder body with quilt maple veneer and a caramelized maple neck. Seymour
  Duncan JB/'59 humbuckers, a Floyd Rose 1500 double-locking tremolo, and
  5-position coil-tap switching deliver versatile high-performance tones.
details: |-
  The Pro-Mod Plus San Dimas Style 1 HH FR CM pairs an alder San Dimas body with a quilt maple veneer top in a gloss Chlorine Burst finish. The bolt-on caramelized maple neck features graphite reinforcement and a hand-rubbed urethane finish, giving the instrument the silky feel and stability favored by fast players.

  The caramelized maple fingerboard carries a 12"-16" compound radius, 22 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, anchored by a Floyd Rose 1500 Series locking nut (1.6875" width) at a 25.5" scale length. The licensed Fender Stratocaster headstock completes the classic San Dimas profile.

  Electronics include a Seymour Duncan JB TB-4 humbucker in the bridge and a Seymour Duncan '59 SH-1N humbucker in the neck (parchment covers), wired through a 5-position blade switch that delivers inner- and outer-coil tap combinations, a Bourns low-friction volume pot, and a no-load tone control for additional sonic flexibility.

  Hardware is finished in chrome and includes a Floyd Rose 1500 Series double-locking tremolo with locking tremolo arm, Charvel-branded Gotoh die-cast tuning machines, dome-style control knobs, and standard strap buttons. The guitar ships with .009-.042 nickel-plated steel strings and a Charvel multi-fit gig bag.
