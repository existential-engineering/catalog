details: |-
  The Cali76 Bass Compressor is a studio-grade compressor pedal inspired by the world-famous Urei 1176 studio compressor, heard on many of the greatest studio recordings since the 1960s. It uses uncompromising all-analogue circuitry to make distinctive, ultra-fast FET compression tones available to the modern bassist.

  The latest in a long lineage of Cali76 compressors, the Cali76 Bass Compressor features a full set of studio-style controls, a Dry Blend knob for parallel compression, and an improved sidechain that matches the response of Origin Effects' sought-after "large format" Cali76, the pedal that put the company on the map in 2012.

  With a 10-LED gain reduction meter, a pedalboard-friendly enclosure, and massive headroom thanks to internally increased voltage, the Cali76 Bass Compressor marks the culmination of over a decade of experience making compressor pedals.

  Voltages are increased internally to 24V from a standard 9VDC supply, so the pedal stays crystal-clear anywhere in the signal chain and can handle line-level signals from keyboards and studio outboard gear, making it suitable for both pedalboard and home studio use.

  Housed in a compact, brushed stainless enclosure and built in the UK from premium components, the Cali76 Bass Compressor combines studio-grade compression tone with pedalboard versatility.
specs: |-
  - All-analogue signal path
  - Ultra-fast FET compression
  - 1176-inspired circuitry
  - Dedicated Attack, Release and Ratio controls
  - Dry Blend control for parallel compression
  - 10-LED bar graph gain reduction meter
  - Voltage increased internally to 24V for high headroom
  - Optimised for bass, compatible with line-level signals
  - Improved dynamic response matches large format Cali76
  - High-quality buffered bypass
  - Weight: 553 g (1.22 lb)
  - Dimensions: 124 x 64 x 58 mm (4.8 x 2.5 x 2.3 in), L x W x H, includes knobs and switches
  - Input Impedance: 1 M ohm
  - Output Impedance: 1 k ohm
  - Current Draw: 200 mA
  - Power Supply: 9V DC, 2.1mm centre-negative (mains adaptor only, no battery option)
