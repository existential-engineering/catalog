description: CXM 1978 is a reverb effects pedal from Chase Bliss. It allows you
  to explore the charm of late 70's imperfections or hifi and lofi reimaginings.
details: |-
  1978 was a big moment for reverb: the dawn of sprawl, the first time reverbs were capable of massive trails and infinite decay. CXM 1978 reaches back to that moment, letting players explore the charm of those late-70s imperfections alongside hifi and lofi reimaginings. The reverb is highly interactive and physical, built from a moving, evolving network of digital reflections, with each space having its own behavior and response, just like a true acoustic space.

  CXM 1978 ties decay to EQ rather than a simple decay knob, mirroring how natural acoustic reverb behaves. The BASS, MIDS, and TREBLE faders combine with a CROSS control that acts as a frequency splitter (0Hz-1700Hz), letting the player set independent decay times above and below the crossover point. Three reverb Types are available: Room, Hall, and Plate.

  The CLOCK button sets fidelity and the range of the PRE-DLY control: HIFI runs at 48kHz/32-bit with a low noise floor and 42ms max pre-delay, STANDARD emulates 1978-era hardware at 24kHz/16-bit with 168ms max pre-delay, and LOFI drops to a variable 48kHz-2.4kHz/16-bit for degraded digital textures with up to a 1.7 second max pre-delay. TANK MOD adds Low, Med, or High amounts of modulation to the reverb tank, and DIFFUSION shapes the smearing of the initial attack, with hidden behaviors at each setting.

  CXM 1978 is built around Chase Bliss's motorized Automatone faders, which move automatically to reflect preset changes and respond visually to expression, CV, and MIDI control. It stores 30 internal presets across three banks, accessible from the footswitches alone or via MIDI Program Change. It supports MIDI Control Change for every parameter, 0-5V CV and expression pedal control over the faders, and AUX expansion via a Meris Preset Switch for extra footswitch functions (preset recall, heel/toe recall, and reverb buffer manipulation).

  Developed in collaboration with Meris.
specs: |-
  - Reverb types: Room, Plate, Hall
  - Crossover decay: independent BASS/MIDS/TREBLE decay split by the CROSS control (0Hz-1700Hz)
  - Tank Mod: Low, Med, High modulation depth
  - Diffusion control with hidden sparse/regeneration modes
  - Clock/fidelity modes: HiFi (48kHz, 32-bit, 42ms max pre-delay), Standard (24kHz, 16-bit, 168ms max pre-delay), LoFi (48-2.4kHz variable, 16-bit, up to 1.7s max pre-delay)
  - 30 internal presets across 3 banks
  - MIDI Program Change and Control Change support (MIDI In and Thru, default channel 2)
  - CV control (0-5V) and expression pedal control over faders
  - AUX switch compatible (Meris Preset Switch, Preset and Performance modes)
  - Buffered bypass with analog dry thru
  - Switchable balanced or unbalanced stereo I/O
  - Motorized Automatone faders
  - Signal-to-noise ratio: -108 dB
  - Headroom: 9.5V peak-to-peak
  - Dimensions: 5.75" x 6.5" x 2.5"
  - Power: 9V center negative, ~500 mA
