description: A vintage-inspired stereo reverb pedal featuring room, hall, and
  plate algorithms with variable fidelity clocking, 32-bit AD/DA conversion, and
  internally boosted +/-15V rails for line level input.
details: |-
  1978 was a big moment for reverb. It was the dawn of sprawl, the first time reverbs were capable of massive trails and infinite decay. The CXM 1978 allows you to explore the charm of those late 70s imperfections, or hi-fi and lo-fi reimaginings.

  The reverb is highly interactive and physical, built from a moving, evolving network of digital reflections. Each space has its own behavior and response, just like true reverb. Three reverb types are available: Room, Hall, and Plate, each with distinct character.

  The variable fidelity Clock control lets you choose between HIFI mode (48kHz, 32-bit), Standard mode (24kHz, 16-bit emulating late-70s digital), and LOFI mode (variable 48-2.4kHz, 16-bit). The Cross control provides frequency-based crossover decay, allowing independent control over how high and low frequencies decay.

  The CXM 1978 features 32-bit AD/DA conversion, stereo balanced or unbalanced I/O, and internally boosted +/-15V rails for pristine line level input. It includes 30 internal presets, MIDI support for Program Change and Control Change messages, CV control, and expression pedal compatibility.

  The pedal is part of the Chase Bliss Automatone series, featuring motorized faders for precise and recallable control. It offers buffered bypass with analog dry-through for transparent signal when disengaged.
specs: |-
  - Reverb types: Room, Hall, Plate
  - Tank Mod: Low, Med, High
  - Clock modes: HIFI (48kHz, 32-bit), Standard (24kHz, 16-bit), LOFI (48-2.4kHz variable, 16-bit)
  - 32-bit AD/DA conversion
  - Stereo balanced or unbalanced I/O
  - Internally boosted +/-15V rails
  - Signal-to-Noise Ratio: -108 dB SNR
  - 30 internal presets
  - MIDI support (Program Change, Control Change)
  - CV and Expression control
  - AUX switch compatible
  - Buffered bypass with analog dry-through
  - Power: 9V Center Negative, ~500 mA
  - Dimensions: 5.75" x 6.5" x 2.5"
