description: CXM 1978 is a reverb effects pedal from Chase Bliss. It allows you to explore the charm of late 70's imperfections or our hifi and lofi reimaginings.
details: |-
  1978 was a big moment for reverb. It was the dawn of sprawl, the first time reverbs were capable of massive trails and infinite decay. The CXM 1978 reaches back to that moment, allowing you to explore the charm of those late 70's imperfections, or hifi and lofi reimaginings. The reverb is highly interactive and physical, built from a moving, evolving network of digital reflections, with each space having its own behavior and response, just like true reverb.

  The CXM 1978 takes a unique approach to decay, linking it to EQ just like natural acoustic reverb. The BASS, MIDS, and TREBLE faders combine with a CROSS control that acts as a frequency splitter, letting you set independent decay times for the low and high frequencies. Three reverb Types are available: Room, Hall, and Plate.

  The CLOCK button sets the fidelity and pre-delay range: HIFI mode runs at 48kHz/32-bit with a low noise floor, STANDARD mode emulates 1978's own hardware at 24kHz/16-bit, and LOFI mode drops to a variable 48kHz-2.4kHz/16-bit for degraded digital textures. TANK MOD adds LOW, MED, or HIGH amounts of modulation to the reverb tank, and DIFFUSION shapes the smearing of the initial attack.

  The CXM 1978 is built around Chase Bliss's motorized Automatone faders, which move automatically to reflect preset changes and respond visually to expression, CV, and MIDI control. It stores 30 internal presets across three banks, and supports MIDI Program Change and Control Change, CV, expression pedal control, and AUX expansion via a Meris Preset Switch for extra footswitch functions.

  Developed in collaboration with Meris.
specs: |-
  - Reverb types: Room, Plate, Hall
  - Crossover decay: independent BASS/MIDS decay split by the CROSS control
  - Tank Mod: Low, Med, High modulation depth
  - Diffusion control with hidden sparse mode
  - Clock/fidelity modes: HIFI (48kHz, 32-bit), Standard (24kHz, 16-bit), LOFI (48-2.4kHz variable, 16-bit)
  - Stereo I/O, switchable balanced or unbalanced
  - 30 internal presets across 3 banks
  - MIDI Program Change and Control Change support, MIDI In and Thru
  - CV control and expression pedal control
  - AUX switch compatible (Meris Preset Switch)
  - Buffered bypass with analog dry thru
  - Motorized Automatone faders
  - Power: 9V Center Negative, ~500 mA
