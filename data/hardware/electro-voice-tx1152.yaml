name: TX1152
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/tx1152/
description: 15-inch two-way passive loudspeaker from EV's Tour-X series, built
  for medium-throw live applications. Pairs an SMX2151 15-inch low-frequency
  driver with a DH3 1.25-inch (32 mm) titanium compression driver on a rotatable
  60 x 40 degree constant-directivity horn, delivering 133 dB maximum SPL from a
  plywood and MDF enclosure with EVCoat finish.
details: >-
  Part of EV's Tour-X portable loudspeaker family, the TX1152 is a passive
  full-range cabinet designed for medium-throw front-of-house, stage monitor,
  and small-format touring use where external amplification and processing are
  already in place.


  The rotatable 60 by 40 degree constant-directivity horn lets the cabinet be
  deployed horizontally or vertically without changing coverage geometry, while
  a 1.75 kHz crossover blends the SMX2151 15-inch woofer with the DH3 1.25-inch
  titanium compression driver for low-distortion output across the band.


  Versatile deployment options include a pole-mount socket for stand or
  subwoofer-top use and six M10 threaded suspension points for permanent or
  rigged installations. The cabinet is finished in EVCoat over plywood and MDF
  and protected by a 16 GA powdercoated steel grille.
specs: |-
  - Configuration: 2-way passive full-range
  - LF transducer: SMX2151 15 in (381 mm) woofer
  - HF transducer: DH3 1.25 in (32 mm) titanium compression driver
  - Horn: rotatable constant-directivity 60 x 40 degrees
  - Power handling (continuous / peak): 500 W / 2000 W
  - Frequency response (-3 dB): 65 Hz - 20 kHz
  - Frequency range (-10 dB): 45 Hz - 20 kHz
  - Maximum SPL: 133 dB
  - Axial sensitivity (1 W @ 1 m): 100 dB
  - Nominal impedance: 8 ohms
  - Minimum impedance: 6.2 ohms
  - Crossover frequency: 1.75 kHz
  - Horizontal coverage: 90 degrees
  - Vertical coverage: 50 degrees
  - Recommended high-pass filter: 45 Hz
  - Input connectors: 2 x Neutrik NL4 Speakon (parallel in/through)
  - Cabinet material: plywood and MDF with EVCoat finish
  - Grille: 16 GA steel with black powdercoat
  - Suspension: 6 x M10 threaded fly points
  - Pole mount: compatible (stand or subwoofer top)
  - Dimensions (H x W x D): 475 x 439 x 655 mm (18.7 x 17.3 x 25.8 in)
  - Net weight: 23.5 kg (51.9 lb)
  - Shipping weight: 27.0 kg (59.4 lb)
