details: |-
  The 312ce 12-Fret is a Grand Concert acoustic-electric from Taylor's 300 Series with an all-solid construction and 12-fret neck join. The 12-fret configuration shifts the bridge further into the lower bout, delivering a warmer, more balanced tone compared to standard 14-fret models.

  V-Class bracing provides enhanced sustain and intonation. The slot-head nickel tuners with ebony buttons and Gemstone fretboard inlays give it refined aesthetics, while the gloss top and satin back/sides finish adds depth and visual character.

  Expression System 2 electronics handle amplified performance. The guitar ships with a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Sapele (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Nut width: 1-3/4"
  - Tuners: Slot-head nickel with ebony buttons
  - Inlays: Faux Pearl Gemstone
  - Binding: Black
  - Pickguard: Firestripe
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
