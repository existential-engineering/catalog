description: >-
  The Roland V-Synth is a flagship 61-key synthesizer released in 2003 that combines
  analog modeling, PCM waveforms with user sampling, and external audio processing through
  Roland's VariPhrase and COSM technologies. It features innovative real-time performance
  controls including the TimeTrip Pad and twin D-Beam controllers, enabling expressive
  manipulation of sound parameters such as pitch, time, and formant characteristics.
details: |-
  Released in 2003, the V-Synth debuted Roland's groundbreaking combination of multiple oscillator technologies, user sampling, and COSM filtering. The instrument introduced the revolutionary TimeTrip function, allowing musicians to manipulate waveform timing without affecting pitch or formant characteristics, opening up entirely new sonic possibilities for performance and sound design.

  The sound engine employs dual oscillators offering three distinct synthesis approaches: analog modeling with 14 waveform types including SAW, SQUARE, SUPER-SAW, and FEEDBACK-OSC; PCM/VariPhrase with over 300 preset waveforms plus user sampling capability; and external audio input processing. VariPhrase technology permits independent control of pitch, time, and formant across sampled material. All three oscillator types support layering and modulation via FM, ring modulation, and oscillator hard sync.

  Users interact with the V-Synth via a large LCD touchscreen alongside hands-on controls including the TimeTrip Pad and twin D-Beam controllers. The velocity and aftertouch-sensitive 61-note keyboard provides expressive control, and a programmable arpeggiator modulates sound parameters for rhythmic and timbral variation. COSM processing offers 16 filter and effect types ranging from overdrive and amp simulation to dynamic TVF and TB-style filters.

  The V-Synth line expanded with the V-Synth XT rack-mount version in 2005, which retained the same synthesis engine and touchscreen but omitted the performance controllers. In 2007, the V-Synth GT added Vocal Designer technology with Articulative Phrase Synthesis for realistic acoustic instrument emulation, along with an enhanced color touchscreen and up to 28 voices of polyphony. Notable users include BT, Orbital, Ladytron, Richard Barbieri, and Nick Rhodes of Duran Duran.
specs: |-
  - Polyphony: Up to 24 voices (dependent on CPU load)
  - Multitimbral: 16 parts (12 with rhythm kit)
  - Oscillators: Dual oscillators with three types (Analog Modeling, PCM/VariPhrase, External Audio)
  - Analog Modeling Waveforms: 14 types (SAW, SQUARE, TRIANGLE, SINE, RAMP, JUNO, HQ-SAW, HQ-SQUARE, NOISE, LA-SAW, LA-SQUARE, SUPER-SAW, FEEDBACK-OSC, X-MOD-OSC)
  - PCM Waveforms: 300+ preset waveforms plus user sampling
  - COSM Processing: 16 types including OD/DS, AMP, SPEAKER, RESONATOR, TVF, TB-FILTER
  - Effects: 41 Multi-Effects sets, 8 Chorus sets, 10 Reverb sets, EQ
  - Sampling Frequency: 44.1 kHz internal; 96/48/44.1 kHz digital I/O
  - Wave Memory: 50 MB (32 MB factory presets)
  - Patch Memory: 512 patches
  - Storage: PC Card slot (Microdrive, SmartMedia, CompactFlash)
  - Keyboard: 61 keys with velocity and channel aftertouch
  - Controllers: TimeTrip Pad, twin D-Beam controllers, pitch bend, modulation
  - Connectivity: MIDI In/Out/Thru, USB, Analog Audio I/O, S/PDIF Digital I/O
  - Year Released: 2003
