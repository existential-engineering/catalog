description: Single Dynamic Driver Professional In-Ear Monitors.
details: |-
  The MP-120 houses a single large dynamic driver. This is a high-quality component chosen for its ability to supply plenty of bass without sacrificing high-frequency articulation and vocal detail.

  MP-120 Professional In-Ear Monitors feature specially-molded enclosures for an ergonomic fit providing hours of comfort and superior noise isolation. The over-ear design ensures an uninterrupted performance while the single precision-tuned dynamic driver provides clear and punchy sound. When you want to hear yourself on stage without all the noise that comes with it, MP-120 Professional In-Ear Monitors have got you covered.
specs: |-
  - Frequency Response: 20 Hz – 20 kHz
  - Impedance: 32 Ohms ±15%
  - Transducer Type: Single Dynamic
  - Sensitivity: 93dB±3dB@1mW at 1KHz
  - Up to 40dB of sound isolation
  - Ergonomically molded low-profile enclosure
  - Detachable MMCX connector
  - Three ear tip types (foam, silicone, double flange) in three sizes
  - Shielded, braided cable
