description: Utilizes a patented Double Eccentric Cam that increases the sensitivity of the footboard.
details: |-
  DW 9000 Series Hi-Hat Stands feature a patented Double Eccentric Cam to increase the sensitivity of the footboard in relation to cymbal movement, resulting in a unique, incredibly fast and responsive feel. Its Infinitely Adjustable Locking Spring Tension allows for precise adjustment to offset the weight of the top cymbal, creating a customized feel.

  The Lateral Cymbal Seat is a first in hi-hat design, allowing instant access for adjusting the bottom cymbal angle, a small detail that makes a big difference. The Folding Footboard stays attached to the base casting when secured in the folded position, and DW's high-tech Ball Bearing Hinge provides smooth, quick pedal action.

  The 9000 Series Hi-Hat Stands also come standard with a Locking Clutch, Plastic Tube Insulators and Swivel Legs, as well as upper rods in both 21″ and 15″ lengths.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
  - Double Eccentric Cam (U.S. Patent No. 5266733)
  - Infinitely Adjustable Locking Spring Tension
  - Lateral Cymbal Seat (U.S. Patent No. 6570075B1)
  - Ball Bearing Hinge (U.S. Patent No. 5431081)
  - Folding Footboard (U.S. Patent No. 5105706)
  - Locking Clutch, plastic tube insulators and swivel legs
  - Upper rods in both 21″ and 15″ lengths
  - 3-leg base
