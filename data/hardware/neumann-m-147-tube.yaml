description: The M 147 Tube brings back the classic sound of Neumann's famous
  tube microphones of the 1950s. The M 147 tube is a cardioid microphone using
  the same large diaphragm capsule as the legendary U 47 but combines it with an
  innovative tube circuit for lowest noise.
details: |-
  Cardioid pattern

  Same capsule design as the legendary U 47 and M 49 microphones

  Tube electronics with very low self-noise

  Same K47 capsule design as the legendary Neumann U 47

  Classic sound with unmatched presence

  Tube circuit with extremely low self-noise

  Transformerless output stage

  Comes with power supply
specs: |-
  - Acoustical Operating Principle: Pressure gradient transducer
  - Directional Pattern: Cardioid
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity: 20 mV/Pa at 1 kHz into 1 kohm
  - Rated Impedance: 50 ohms
  - Rated Load Impedance: 1 kohms
  - Equivalent Noise Level CCIR: 24 dB
  - Equivalent Noise Level A Weighted: 12 dB-A
  - Typical SPL K05: 114 dB
  - Typical SPL K5: 134 dB
  - Signal To Noise Ratio CCIR: 70 dB
  - Signal To Noise Ratio A Weighted: 82 dB
  - Maximum Output Voltage: 8 dBu
  - Dynamic Range Amplifier THD05: 102 dB
  - Dynamic Range Amplifier THD5: 122 dB
  - Power Supply: N 149 A
  - Matching Connector: Microphone: DIN 8 F, Power Supply: XLR 3 F
  - Weight: 460 g
  - Diameter: 57 mm
  - Length: 142 mm
