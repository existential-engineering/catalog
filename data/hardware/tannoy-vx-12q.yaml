url: https://www.tannoy.com/en/products/0312-anm
description: 12" PowerDual Full Range Loudspeaker with Q-Centric Waveguide for
  Portable and Installation Applications.
details: |-
  12" PowerDual Full Range Loudspeaker with Q-Centric Waveguide for Portable and Installation Applications. The VX 12Q is a new class of device that delivers high SPL, low distortion audio coverage in a complete high performance loudspeaker cabinet. It provides a high impact solution for medium-to-large scale sound reinforcement in high-SPL applications such as bars and clubs, as well as being well suited for midscale portable/live PA applications. Thanks to its twin driver design for extended low frequency reproduction and flexible mounting options, the VX 12Q is also ideally suited for use complimenting much larger systems, making it an excellent choice for both installed and portable applications. The VX 12Q can also be configured for bi-amp operation. The PowerDual driver ensures high power output with high sensitivity and exceptional efficiency. A proprietary Q-Centric waveguide provides precise 75° horizontal x 40° vertical dispersion. The rear panel carries industry-standard twist-locking speaker and barrier strip connectors for input and link connections. Optimized for use with Lab Gruppen amplifiers or Lake LM Series controllers.
specs: |-
  - frequencyResponse: 80 Hz – 25 kHz (-3 dB)
  - frequencyRange: 60 Hz – 30 kHz (-10 dB)
  - sensitivityPassiveFullRange: 97 dB (1W / 2.83V / 8 ohms)
  - sensitivityBiampLF: 98 dB
  - peakSPLBiampLF: 108 dB
  - dispersion: 75° H x 40° V
  - driver: 1 x 305 mm (12") PowerDual with Q-Centric waveguide
  - crossover: Passive 1.5 kHz (configurable for bi-amp)
  - directivityFactorQ: 13.0 (averaged 1 kHz to 8 kHz)
  - directivityIndexDI: 11.1 (averaged 1 kHz to 8 kHz)
  - powerHandlingPassiveFullRange: Average: 350 W / Programme: 700 W / Peak: 1,400 W
  - powerHandlingBiampLF: Average: 350 W / Programme: 700 W / Peak: 1,400 W
  - powerHandlingBiampHF: Average: 80 W / Programme: 160 W / Peak: 320 W
  - amplifierPowerPassive: 700 W @ 8 ohms
  - amplifierPowerBiampLF: 700 W @ 8 ohms
  - amplifierPowerBiampHF: 160 W @ 8 ohms
  - nominalImpedance: 8 ohms
  - enclosure: 36.07 litre, 15 mm (enclosure) and 18 mm (front) birch plywood, vented and internally braced
  - finish: Textured black or white paint (custom colours on request); powder coated perforated steel grille with Airnet cloth behind
  - connectors: 2 x twist-lock speaker connector and barrier strip
  - fittings: 8 x M10 flying inserts (portrait or landscape), 8 x M10 yoke bracket inserts, 2 x Integrip carrying handles, blanking plate for optional VTH pole mount, 4 x M6 inserts
  - dimensions: W: 370 mm (14.6") x H: 486 mm (19.1") x D: 360 mm (14.1")
  - netWeight: 21.0 kg (46.3 lbs)
  - shippedWeight: 23.0 kg (50.7 lbs)
