description: An analog stereo morphing oscillator combining a high-precision
  triangle-core VCO with a custom waveshaper for stereo processing. It offers
  extensive CV control, multiple FM modes, LFO/ULFO modes, and individual
  waveform outputs.
details: |-
  After more than three years of development, Eclipse, our new Analog Stereo Morphing Oscillator, is finally here! The idea behind Eclipse is to combine the raw character of vintage analog oscillators with modern features for crafting rich, complex, and expressive sounds. Eclipse's development started with a high-precision analog triangle oscillator that tracks accurately over 10 octaves, with all the I/O expected from a premium analog oscillator. While looking for ways to generate complex harmonics without relying on a classic wavefolder, we came across the VCS3's waveshaper. This unique feature of the EMS synth sparked the idea to design our own waveshaper from scratch, opening up a wide range of sonic possibilities and dynamic control to bring sound to life. During the design process, we discovered the waveshaper's unique potential for stereo processing, which led to a dedicated stereo section to spread and move waveforms across the stereo field while maintaining perfect balance at any setting. Eclipse offers full CV control across all parameters, with smart normalization enabling global modulation from a single source. With many special features like XFM, ULFO, Stereo Pulse Array Modulation, Stereo Pulsed Saw Modulation, RM/AM capabilities, Eclipse is much more than just a VCO. Black Noise Modular · ECLIPSE - Samples
