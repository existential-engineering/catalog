description: "Mackie 2404VLZ4 24-Channel 4-Bus Analog Effects Mixer with USB for
  small to medium venues, schools, houses of worship, and beyond."
details: |-
  VLZ4 ups the level of sonic quality at every level, featuring Mackie's flagship Onyx mic preamps and premium components from front to back. The result is the most rock solid, the most easy to use and, yes, the best sounding compact mixer ever created.

  24 CHANNELS OF CLASSIC MACKIE SOUND. The 2404VLZ4 delivers clear, noise-free, Mackie sound quality in a high channel count perfect for small to medium venues, schools, houses of worship, and beyond. Combining boutique-quality Onyx preamps with built-in effects, USB connectivity, and professional features, it is designed for demanding live sound applications.
specs: |-
  - 20 boutique-quality Onyx mic preamps
  - Ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Extended frequency response
  - Distortion under 0.0007% (20Hz – 50kHz)
  - Phantom power for condenser mics
  - Improved RF rejection perfect for broadcast applications
  - 20 high-headroom line inputs with dedicated inserts
  - 3-band EQ with sweepable midrange
  - 18 dB/oct 100Hz low-cut filter on mic input channels
  - Dedicated inline channel compression for critical inputs (ch. 17-20)
  - 4 subgroups with dedicated inline compressors
  - 6 aux sends with inserts, pre/post fader and internal/external FX send options
  - Dual 32-bit RMFX+™ processors with 24 "Gig Ready" reverbs, choruses and tap delay
  - Integrated 4x2 24-bit USB interface — stream subgroups or master L/R to PC/Mac for recording
  - Use favorite plug-ins live via auxes 5/6
  - PFL/AFL solo modes
  - Level, pan, solo and overload/mute LEDs on each channel
  - High-resolution 12-segment stereo meters
  - Convenient stereo return to mains for music playback
  - 60mm long-wearing log-taper faders
  - Sealed rotary controls resist dust and grime
  - "Built-Like-A-Tank" rugged steel chassis with powder-coat finish
  - High-visibility, high-contrast controls
  - Universal power supply for worldwide use
