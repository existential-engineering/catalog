  - filter
url: https://mackie.com/en/products/mixers/vlz4-series/2404VLZ4.html
prices:
  - amount: 1349.99
    currency: USD
description: Mackie 2404VLZ4 24-Channel 4-Bus Analog Effects Mixer with USB for
  live sound, broadcast, and recording.
details: |-
  When you need that clear, noise-free Mackie sound quality in a high channel count, look no further than the 2404VLZ4. Complete with built-in FX, USB output, and pro features for small to medium venues, schools, houses of worship and beyond.

  In pursuit of the ultimate do-it-all live sound mixer, Mackie packed the VLZ4 4-Bus with a full set of processors allowing you to travel rack free while still making professional sounding mixes. Two patented Running Man FX processors (RMFX+) provide 24 gig-ready reverbs, choruses and delays right in the board, and both FX processors feature a tap delay so delays may be synced with the song at the tap of a finger.

  The VLZ4 4-Bus has eight single-knob compressors. Four are located on the last four mic inputs so the most critical signals may be addressed, and there is a single-knob compressor on each of the four subgroups so grouped signals may be blended together.

  The 4x2 USB recording and playback function means up to four signals may be recorded simultaneously and a stereo mix returned to the mixer for playback.

  Channels 1-20 are mono channels, each with an XLR Onyx mic preamp input, a 1/4 inch line input and a dedicated channel insert. Channels 21/22 and 23/24 are stereo line pairs. The output section carries main outs on XLR and 1/4 inch with inserts, a mono main out on XLR and 1/4 inch with its own insert and level control, four group outs and inserts, six aux sends and inserts, stereo and mono monitor outs, a headphone jack, RCA tape in and out, an external talkback mic input and a 12V BNC lamp socket.
specs: |-
  - 20 boutique-quality Onyx mic preamps with ultra-wide 60dB gain range
  - 24 channels: 20 mono channels with dedicated inserts plus 2 stereo line channels
  - Dedicated inline channel compression for critical inputs (channels 17-20)
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20Hz to 50kHz)
  - Improved RF rejection perfect for broadcast applications
  - Phantom power for condenser mics
  - 3-band EQ with sweepable midrange on mono channels (80Hz low shelf, 100Hz to 8kHz sweepable mid, 12kHz high shelf)
  - 4-band EQ on stereo channels (80Hz, 400Hz, 2.5kHz, 12kHz)
  - 18 dB/oct 100Hz low-cut filter on mic input channels
  - Level, pan, solo and overload/mute LEDs on each channel
  - 4 subgroups featuring dedicated inline compressors
  - 6 aux sends with inserts, pre/post fader and internal/external FX send options
  - 2 stereo returns and 4 group outs with inserts
  - Dual 32-bit RMFX+ processors featuring 24 Gig Ready reverbs, choruses and tap delay
  - Integrated 4x2 24-bit USB interface, USB 1.1, stereo in / 4 channel out, 44.1 kHz / 48 kHz
  - PFL/AFL solo modes
  - 60mm long-wearing log-taper faders
  - High-resolution 12-segment stereo meters
  - Maximum levels: mic in +21 dBu, main mix XLR out +27 dBu, all other inputs and outputs +21 dBu
  - 100-120 VAC or 200-240 VAC, 50-60 Hz universal power supply
  - 12 VDC female BNC lamp socket
  - Power consumption 55 watts
  - Dimensions (H front / H rear x W x D): 1.8 / 6.0 x 29.4 x 19.1 in / 46.3 / 153 x 748 x 486 mm
  - Weight: 31.0 lb / 14.1 kg
