description: Companion to the VT-5M equalizer, the VT-9M Mastering Compressor
  pairs a classic all-tube Class-A audio path with modern pulse-width modulation
  (PWM) compression. The user interface is intuitive and easily recallable,
  using single stepped controls.
details: |-
  Companion to the equalizer, the VT-9M Mastering Compressor pairs the same classic all-tube Class-A audio path with modern pulse-width modulation (PWM) compression, featuring an intuitive and ergonomic, easily-recallable user interface using single stepped controls.
specs: |-
  - Fully stepped controls
  - 2 High Pass Filter frequencies on Sidechain
  - Threshold
  - Gain
  - Attack
  - Release
  - Shape
  - True hard-wire bypass
  - Input 600 ohm source (nominal) balanced or unbalanced
  - Input Load Impedance 32k ohms, transformer balanced bridging
  - Nominal Input Level +4 dBm
  - Maximum Input Level @ 20 cps +25 dBm
  - Gain unity to +15dB
  - Frequency Response ± 0.2 dB 20 cps to 20 kc ± 0.5 dB 11 cps to 28 kc -3 dB @ 0.5 cps & 65 kc
  - THD + Noise <0.05% 20 cps to 20 kc
  - Signal to Noise Ratio 78 dB minimum
  - Output low-Z, transformer balanced
  - Output source impedance 115 ohms
  - Maximum Output Level +22 dBm into bridging input balanced or unbalanced
  - Gain Reduction Range 0 to 20dB
  - Power Requirements 115 or 230 VAC 50/60Hz, 85 W
  - Dimensions 19" (48.5 cm) W 5.25" (13.5 cm) H 13" (23 cm) D
  - Weight 22 lbs (9.55 kg)
