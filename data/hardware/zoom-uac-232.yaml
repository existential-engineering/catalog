description: The UAC-232 USB Audio Converter is the first dedicated 32-bit float
  audio interface, designed for creators who demand more quality in their
  productions.
details: |-
  The UAC-232 USB Audio Converter is the first dedicated 32-bit float audio interface. Dual AD circuitry and 32-bit float technology capture clip-free, low-noise recordings without the need to set gain, whether sound levels fluctuate in the studio or on stage, and the unit records at up to 192 kHz.

  The preamps are the same clean, low-noise design used in Zoom's professional F-Series recorders, with an equivalent input noise figure of -127 dBu or less. Two XLR/TRS combo inputs take mic or line level with +48 V phantom power for condenser microphones, and a Guitar/Bass button switches an input to Hi-Z for recording guitar directly.

  The UAC-232 Mix Control software modifies I/O routing, activates loopback and controls input and monitoring levels. Music mode routes to a DAW while Streaming mode combines all inputs into a single signal for streaming software, and the Loopback function mixes the input audio with playback from the computer before sending it to the software, for adding background music to a stream or singing over an instrumental track. A Direct Monitor switch sends the input signal straight to headphones while the same signal is routed to the DAW or streaming software, and Mix Control adjusts the volume and pan of that direct monitor feed.

  Two balanced TRS main outputs with volume control feed studio monitors, and the headphone output delivers 100 mW + 100 mW into a 63 ohm load to drive demanding headphones. MIDI IN and OUT on 5-pin DIN connectors link external MIDI gear such as drum machines, synths and keyboards.

  The compact body measures 164 mm wide by 105.5 mm deep by 65 mm high and weighs 355 g, and it can be set up vertically, horizontally or mounted to a mic stand using the two included flat cable fasteners. Connection is over USB to PC and Mac with software such as Cubase, Pro Tools and OBS. iOS devices record and stream in 24-bit using apps such as GarageBand, YouTube and Instagram. Android is not supported. The unit is bus-powered with PC and Mac, and needs separate power when working with a Lightning-equipped iOS device.
specs: |-
  - Input channels: 2 mono MIC/LINE
  - Output channels: 1 stereo TRS, 1 stereo headphone
  - Inputs 1-2: XLR/TRS combo jacks (XLR 2 hot, TRS tip hot)
  - Input impedance: XLR 2.7 kohms, TRS 4 kohms or 1 Mohm with Hi-Z on
  - Maximum input level: XLR +6 dBu, TRS +24 dBu or +11.5 dBu with Hi-Z on
  - Phantom power: +48 V
  - Outputs: TRS phone jacks (balanced), maximum output level +18 dBu at 0 dBFS, output impedance 100 ohms
  - Headphones: standard stereo phone jack, 100 mW + 100 mW into a 63 ohm load, output impedance 12 ohms
  - MIDI: IN/OUT on 5-pin DIN connectors
  - USB: USB Type-C for the audio interface function (requires a cable that supports data transfer), USB bus power supported, plus a USB Type-C DC 5 V power supply input
  - Frequency response, inputs: 44.1 kHz 20 Hz to 20 kHz +0.1/-0.2 dB, 192 kHz 20 Hz to 80 kHz +0.1/-0.2 dB
  - Frequency response, outputs: 44.1 kHz 20 Hz to 20 kHz +0.0/-0.1 dB, 192 kHz 20 Hz to 80 kHz +0.0/-1.0 dB
  - Frequency response, headphones: 44.1 kHz 20 Hz to 20 kHz +0.0/-0.5 dB, 192 kHz 20 Hz to 80 kHz +0.0/-1.0 dB
  - Equivalent input noise: -127 dBu or less (IHF-A)
  - Audio interface: 2 channels recording, 2 channels playback
  - Sampling frequencies: 44.1, 48, 88.2, 96, 176.4 and 192 kHz
  - Bit depth: 32-bit float or 24-bit
  - Interface: USB 2.0, USB Audio Class 2.0
  - Power: ZOOM AD-17 AC adapter (DC 5 V/1 A), USB bus power supported
  - Rated current: 293 mA on USB or AC adapter at 5 V
  - Power consumption: 5 W maximum
  - Dimensions: 164 mm (W) x 105.5 mm (D) x 65 mm (H)
  - Weight (unit only): 355 g
  - Dual AD circuitry with 32-bit float recording technology
  - Zoom Mix Control software mixer with MUSIC and STREAMING modes and loopback
  - Direct Monitor switch for latency-free monitoring
  - Guitar/Bass button activates Hi-Z input for direct guitar recording
  - Vertical or horizontal use, with flat cable fasteners for mic stand mounting
  - Compatible with Windows, Mac and iOS (Android not supported)
  - Note: 0 dBu = 0.775 Vrms
