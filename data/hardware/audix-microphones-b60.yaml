details: |-
  The Performance Series bodypack boasts a contemporary and comfortable design. Rugged construction and ease of use make the B60 ideal for all users and applications. There is a convenient soft mute switch at the top of the housing which serves as an on-off switch when needed.

  The B60 bodypack features a high contrast LCD display with group, channel, and battery indicator. It is designed for use with all AUDIX lavalier, headworn, and instrument mics, and is also excellent for guitar and bass.
