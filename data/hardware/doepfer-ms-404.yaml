description: >-
  The Doepfer MS-404 is a monophonic analog synthesizer designed as a TB-303 emulator, offering a
  24dB/octave resonant filter, dual LFOs for VCO modulation, and full MIDI controllability in a
  compact rack-mount format.
details: |-
  The MS-404 was Doepfer's answer to the growing demand for affordable TB-303-style acid sounds in the mid-1990s. Built around a single VCO with sawtooth, pulse, PWM, and noise waveforms, it faithfully recreates the squelchy, resonant character of Roland's iconic bass synthesizer while adding capabilities the original never had.

  What sets the MS-404 apart from other 303 clones is its dual LFO section. Both LFOs can modulate the VCO, opening up a range of sounds well beyond the typical acid bassline. The triangle-wave LFOs cover an impressively wide range from 0.003Hz to 5kHz, enabling everything from subtle vibrato to aggressive FM-like timbres.

  The filter section features a classic 24dB/octave resonant lowpass design with its own independent LFO, delivering the characteristic squelch that made the 303 famous. Slide and accent effects are replicated through the glide control and MIDI velocity, respectively.

  Connectivity is comprehensive for a unit of this size, with CV/GATE interfacing for integration with modular systems alongside full MIDI implementation. All parameters respond to MIDI control changes, making it equally suited for studio sequencing and live performance. Notable users include Hardfloor and Josh Wink.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (sawtooth, pulse, PWM, noise)
  - LFO: Triangle wave (0.003Hz to 5kHz)
  - Filter: 24dB/oct resonant lowpass with independent LFO
  - VCA: ADSR envelope
  - Keyboard: None
  - Memory: None
  - Control: MIDI, CV/Gate
releaseDate: "1994"
