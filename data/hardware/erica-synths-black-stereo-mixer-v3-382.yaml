description: Compact stereo mixer.
details: |-
  The Black Stereo Mixer suits a setup with a lot of modules carrying stereo outputs, such as the Black Hole DSP, the Fusion Delay or MI Clouds. To save rack space, Erica Synths designed this compact mixer with some performance-oriented features.

  Four stereo inputs offer simultaneous volume adjustment on both channels, two of the inputs can merge their left and right channels, IN1 and IN2 take a selectable +6dB boost, and signal level LEDs show what is passing through to the left and right outputs.

  The Black Pre-fade Listen Expander is a satellite module to the Black Stereo Mixer and adds monitoring before the mixer level knob takes effect.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economize on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  Input signals are accepted up to 20Vptp, mixer gain is 1, and the module occupies 10HP at a depth of 25mm.
specs: |-
  - 4x stereo inputs with simultaneous volume adjustment on both channels
  - 2 inputs with L and R channel merge feature
  - Selectable +6dB boost for IN1 and IN2
  - L and R outputs
  - Signal level LEDs
  - Input signal up to 20Vptp
  - Mixer gain 1
  - Power consumption +25mA, -15mA
  - Module width 10HP
  - Module depth 25mm
