description: "Our largest three-way midfield design, the 1238A adapts to your
  acoustic space to deliver high-SPL reference precision."
details: |-
  The 1238A is the largest three-way midfield Smart Active Monitor in Genelec's main monitoring lineup, designed as a reference for studios that need high-SPL accuracy at longer listening distances. Its three-way driver array couples a 385 mm bass cone with a 125 mm midrange cone and a 25 mm metal-dome tweeter mounted in a Directivity Control Waveguide (DCW), delivering a frequency response of 35 Hz to 20 kHz within plus or minus 2.5 dB and a peak SPL of at least 124 dB at 1 m.

  Power is supplied by the outboard RAM-L amplifier module, combining 500 W of Class D for the bass, 250 W of Class D for the midrange, and 200 W of Class AB for the treble. Decoupling the amplifier from the cabinet keeps mechanical noise and heat away from the enclosure and allows flush-mount installations where the electronics live in a separate equipment rack. Protection circuitry guards against driver damage during overload conditions while still preserving headroom for transient material.

  Connectivity covers analog and digital signal paths. A balanced 10 kOhm XLR female input handles analog, while a pair of 110 Ohm AES/EBU XLR connectors provide a digital input and a thru/output for daisy-chaining across a monitor array. Two RJ45 GLM network ports carry the calibration and control bus, and the universal 100-240 VAC supply makes the monitor deployable worldwide without rewiring.

  As a SAM (Smart Active Monitoring) product, the 1238A integrates with the GLM software (used with the 9320A Reference Controller or GLM Calibration Kit, sold separately) to measure the listening environment, compensate for room-induced acoustic anomalies, and align level, delay, and routing across a calibrated monitoring system. This makes the model a fit for mastering, scoring stages, immersive mix rooms, broadcast control rooms, and post-production suites where neutral high-SPL reference is required.

  Intelligent Signal Sensing (ISS) brings standby draw down to no more than 0.5 W, while idle is no more than 25 W and full output is 750 W. The MDF reflex-port enclosure measures 810 x 480 x 420 mm and weighs 57 kg (125.7 lb). Each unit ships with a 1.8 m mains cable, a 5 m RJ45 cable, a front plate, two rack-mount ears for the RAM-L, and the operating manual. The product is covered by a 2-year warranty extendable to 5 years through free MyGenelec registration.
specs: |-
  - Three-way Smart Active Monitor (SAM)
  - Peak SPL >= 124 dB at 1 m
  - Short term maximum SPL >= 121 dB
  - Long term maximum SPL >= 116 dB
  - Frequency response: 35 Hz - 20 kHz (+/- 2.5 dB)
  - Low cutoff (-6 dB): 30 Hz
  - High cutoff (-6 dB): 22 kHz
  - Self-generated noise: <= 10 dB SPL (A-weighted) at 1 m
  - Bass driver: 385 mm cone
  - Midrange driver: 125 mm cone
  - Treble driver: 25 mm metal dome with DCW waveguide
  - Bass amplifier: 500 W Class D
  - Midrange amplifier: 250 W Class D
  - Treble amplifier: 200 W Class AB
  - Harmonic distortion (50-200 Hz): <= 1%
  - Harmonic distortion (>200 Hz): <= 0.5%
  - Group delay (Extended Phase Linearity OFF): 5.1 ms
  - Analog input: XLR female, 10 kOhm balanced
  - Digital input: AES/EBU XLR female, 110 Ohm
  - Digital output/thru: AES/EBU XLR male, 110 Ohm
  - GLM network: 2 x RJ45 (CAT5)
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Power consumption (ISS active): <= 0.5 W
  - Power consumption (idle): <= 25 W
  - Power consumption (full output): 750 W
  - Dimensions (H x W x D): 810 x 480 x 420 mm
  - Weight: 57 kg (125.7 lb)
  - Enclosure: MDF, reflex port
  - Outboard RAM-L amplifier module (rack-mountable)
  - Intelligent Signal Sensing (ISS) auto power management
  - GLM (Genelec Loudspeaker Manager) network calibration support
  - Includes mains cable (1.8 m), RJ45 cable (5 m), front plate, 2 rack-mount ears, operating manual
