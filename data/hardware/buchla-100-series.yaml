description: >-
  The Buchla 100 Series is a classic modular analog synthesizer system produced from
  approximately 1963 to the early 1970s, featuring voltage-controlled modules and
  innovative touch-plate keyboards for electronic music creation.
details: |-
  The Buchla 100 Series represents one of the first major synthesizer systems created by Don Buchla, a circuit designer who developed these instruments on America's west coast to facilitate electroacoustic music creation. The system was designed to eliminate the "painstaking job of tape splicing" involved in Musique Concrete production.

  The modular design typically consisted of a large wooden case accommodating up to 25 modules on a single power supply. A defining characteristic was the use of flat capacitance-sensitive touch-plates as keyboards, which were pressure-sensitive and individually tuneable, allowing for limitless micro-tuning possibilities.

  The system included voltage-controlled oscillators, filters, 8- and 16-step analog sequencers, and complex waveforms beyond basic sine, sawtooth, and square waves. Operation required extensive patching knowledge and multiple patch cords; oscillators frequently drifted out of tune.

  These extremely rare systems are now found primarily in institutions like The Audities Collection and scattered academic institutions across the United States.
specs: |-
  - 101 - Wooden case for 25 modules (24" wide x 24" deep x 31" high)
  - 106 - Two 3-channel mixers with separate and common outputs
  - 107 - Two voltage-controlled 5-channel mixers
  - 110 - Dual voltage-controlled gates
  - 111 - Dual ring modulator
  - 112 - 12 touch-controlled voltage sources (capacitive keyboard)
  - 113 - 20 touch-controlled voltage sources (four circles with five segments each)
  - 114 - 10 touch-controlled voltage sources (capacitive keyboard)
  - 115 - Power supply
  - 120 - Distributor/cross mixer (four inputs, five outputs)
  - 123 - Sequential voltage source (8-step sequencer)
  - 124 - Patchboard with 24 miniature audio jacks
  - 130 - Dual envelope generator
  - 132 - Wave-form synthesizer
  - 140 - Timing pulse generators
  - 144 - Dual square-wave generator
  - 146 - Sequential voltage source (16-step x 3-layer sequencer)
  - 148 - Harmonic generator
  - 150 - Frequency counter
  - 156 - Dual control voltage counter
  - 158 - Dual sine/sawtooth oscillators (VCOs)
  - 160 - White noise generator
  - 165 - Dual random voltage source
  - 170 - Dual microphone amplifier
  - 171 - Dual instrument pre-amplifier
  - 175 - Dual equalizer/line driver
  - 180 - Dual attack generator
  - 185 - Frequency shifter
  - 190 - Dual reverberator (two spring reverbs)
  - 191 - Sharp cut-off filter (24 dB/octave high/low-pass)
  - 192 - Dual low-pass filter
  - 194 - 12dB/octave bandpass filter
  - 195 - Octave formant filter
  - 196 - Phase shifter
