description: >-
  The Omega8 is an 8-voice true analog synthesizer featuring dual VCOs, sub-oscillators,
  and multi-filter architecture per voice, all in a 4U rack module. It offers
  multi-timbrality across 8 MIDI parts, 256 sound patches, and a choice of classic filter
  circuits including Moog, Oberheim, Roland 303, and ARP 2600 voicings. Notable users
  include Hans Zimmer, Outkast, Dr. Dre, and E.L.O.
details: |-
  The Omega8 is a premium 8-voice polyphonic analog synthesizer from Studio Electronics, built as a 4-space rack module. Each voice features two true analog VCOs with triangle, sawtooth, and variable-width square waveforms, plus a sub-oscillator. Oscillator sync and independent tuning provide a wide palette of tonal possibilities, while a white noise generator adds further sonic texture.

  The filter section is a standout feature, offering two analog VCFs per voice with 24dB lowpass (Moog-style) and 12dB lowpass (Oberheim-style) circuits, along with bandpass, highpass, and band reject modes. Optional Roland 303 and ARP 2600 filter circuits are also available, giving the Omega8 an exceptionally versatile tonal character that spans decades of classic analog synthesis.

  Modulation is handled by three LFOs with triangle, sawtooth, reverse sawtooth, square, noise, and random waveforms, capable of modulating oscillators, VCF, and VCA sections. LFO controls include range, delay, key trigger, phase, mono/poly mode, quantize, and MIDI sync. Three multi-stage envelope generators provide ADSR controls, with Envelopes 1 and 2 featuring additional delay, decay2, and breakpoint parameters for more complex amplitude and filter shaping.

  The Omega8 supports unison mode with 1, 2, 4, 6, or 8 voice stacking, linear and exponential glide with dedicated control and destination parameters, and 8-part multi-timbrality over MIDI. With 32 knobs, 35 switches, and a rotary encoder, nearly every parameter is accessible directly from the front panel. Memory stores 256 sound patches and 128 multi patches in RAM.
specs: |-
  - Polyphony: 8 voices (Unison mode: 1, 2, 4, 6, or 8 voices)
  - Oscillators: 2 analog VCOs + 1 sub-oscillator per voice
  - Waveforms: Triangle, sawtooth, variable-width square
  - Oscillator Features: Osc 2 to Osc 1 sync, white noise generator
  - LFOs: 3 (LFO3 fixed to voice panning)
  - LFO Waveforms: Triangle, sawtooth, reverse sawtooth, square, noise, random
  - LFO Controls: Range, delay, key trigger, phase, mode (mono/poly), quantize, MIDI sync
  - Filters: 2 analog VCFs per voice
  - Filter Types: 24dB lowpass (Moog-style), 12dB lowpass (Oberheim-style), bandpass, highpass, band reject
  - Optional Filters: Roland 303 and ARP 2600 circuits
  - Envelopes: 3 multi-stage (ADSR); Env 1 & 2 have additional delay, decay2, and breakpoint
  - Envelope Routing: Env 1 to filter freq, Env 2 to amp level, Env 3 assignable to 3 destinations
  - Memory: 256 sound patches, 128 multi patches (RAM)
  - Multitimbral: 8 parts via MIDI
  - Controls: 32 knobs, 35 switches, 1 rotary encoder
  - Format: 4U rack module
  - Keyboard: None
releaseDate: "2000"
