details: |-
  Incredibly powerful, Mackie DLM Series loudspeakers deliver premium sound in the most compact, professional portable loudspeaker series ever. Perfect for bands, venues and installs, the powerful, compact DLM series is the new shape of sound.

  The innovative ultra-compact DLM12S delivers the powerful, deep low end your audience demands. Delivering 2000 watts of chest-pounding power, the DLM12S also features a ton of amazing system processing perfect for your professional application.

  The precision crossover includes presets for Mackie systems with variable control for simple integration with any system. With the DLP Digital Processor and bright OLED screen, dialing in your subwoofer for any application is fast and easy.
specs: |-
  - 2000W power via ultra-efficient Class-D amplification
  - High-power 12" woofer, heat-treated with 3" voice coil
  - Ultra-low frequency extension to 35 Hz
  - Frequency Response: 35Hz-120Hz (-10dB)
  - DLP Digital Processor with bright OLED screen
  - Alignment delay up to 300ms
  - Three memory locations for venue settings
  - Smart Protect DSP for amp/driver protection
  - Polarity Invert switch
  - 15mm poplar cabinet with 20 gauge steel grille
  - Six total XLR connections for flexible I/O
  - Two line level inputs
  - Two full-range outputs for side fills
  - Two high-pass outputs for direct connection to DLM loudspeakers
  - Weight: 48 lb / 22 kg
