details: |-
  Delivering 2000 watts of chest-pounding power, the DLM12S also features a ton of amazing system processing perfect for your professional application. The precision crossover includes presets for your Mackie system plus variable control for simple system integration.

  Packing huge power and deep low end into the highest-output compact subwoofer on the market, the Mackie DLM12S 12 inch Powered Subwoofer delivers 2000 watts of power into any system.

  The DLM12S features an integrated Mackie DLP digital processor, offering one-touch control over the tools you demand for a professional sound system. A precision digital crossover optimizes any loudspeaker, including presets for Mackie full-range loudspeakers. There is also alignment delay for larger system deployment and Smart Protect technology.

  The rugged 15 mm poplar cabinet is compact with a durable, powder-coated grille and integrated pole cup. Pair it with a Mackie DLM series full-range loudspeaker for a compact sound system.
specs: |-
  - 2000W power via Class-D amplification (1000 watts rms, 2000 watts peak)
  - 12 in / 305 mm heat-treated woofer with 3 in / 76 mm voice coil
  - Frequency response 35 Hz, user-selectable 90 Hz - 135 Hz (-10 dB)
  - Max peak SPL 128 dB (calculated at 1 m)
  - User-selectable crossover point 60 Hz - 120 Hz
  - DLP digital processor with OLED screen: four preset crossover modes plus one variable mode
  - Six XLR connectors: two line inputs, two full-range outputs, two high-pass outputs
  - Input impedance 20 kOhm balanced, 10 kOhm unbalanced
  - Alignment delay 0-300 ms, three memory locations for venue recall
  - Volume range off to +10 dB
  - Smart Protect DSP with peak and RMS limiting and thermal protection
  - Universal power: 100-120 VAC or 220-240 VAC, 50-60 Hz, 250W, 3-pin IEC connector
  - 15 mm poplar cabinet, powder-coated 20 gauge steel grille, one handle on each side
  - Not designed to be pole-mounted or suspended, no rigging points
  - Dimensions 17.9 x 16.4 x 20.8 in / 455 x 417 x 529 mm (H x W x D)
  - Weight 48 lb / 21.7 kg
