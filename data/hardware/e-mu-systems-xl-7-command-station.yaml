description: >-
  The E-MU XL-7 Command Station is a desktop groovebox combining 128-voice sample-playback
  synthesis with a built-in MPC-style sequencer and 13 velocity-sensitive pads, tailored
  for electronica and dance music production.
details: |-
  The XL-7 takes the Xtreme Lead-1 sound engine and wraps it in a desktop production format with a full-featured sequencer. Built on the Proteus 2000 platform, it ships with 32 MB of X-Lead ROM sounds focused on electronica, techno, house, and dance genres, expandable to 128 MB through three additional ROM slots.

  The built-in sequencer is the standout feature, providing 16 tracks with MPC-style workflow. The 13 velocity and aftertouch sensitive pads support real-time recording, step input, and TR-style grid programming for drums. Patterns can span up to 32 bars with quantization and overdubbing at 384 PPQN resolution, holding up to 300,000 notes across 1,024 patterns and 512 songs.

  Thirty-two simultaneously available arpeggiators with 200 preset and 100 user patterns add rhythmic complexity. The synthesis engine delivers 128 voices of polyphony through 50 types of Z-plane filters and a 24-bit dual stereo effects processor covering reverb, delay, chorus, flange, and distortion.

  Connectivity includes six audio outputs, S/PDIF digital output, MIDI in/out/thru across 32 channels, USB for Standard MIDI File import and export, and a BNC 12V lamp socket for stage use.
specs: |-
  - Polyphony: 128 voices
  - Sound ROM: 32 MB X-Lead (expandable to 128 MB)
  - Filters: 50 types (6th and 12th-order Z-plane)
  - Effects: 24-bit dual stereo processor (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Sequencer: 16 tracks, 1,024 patterns (up to 32 bars), 512 songs, 300,000 notes, 384 PPQN
  - Arpeggiator: 32 simultaneous (200 preset, 100 user patterns)
  - Pads: 13 velocity and aftertouch sensitive
  - Presets: 512 ROM, 512 user
  - Outputs: 6 analog, S/PDIF digital
  - MIDI: In/Out/Thru (32 channels), USB
releaseDate: "2001"
