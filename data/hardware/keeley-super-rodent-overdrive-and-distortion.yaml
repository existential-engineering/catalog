details: |-
  The Super Rodent puts two different overdrive and distortion circuits in one enclosure, and the toggle switches cross their sections over to add two further hybrid voices, making it a 4-in-1 pedal. The signal path is entirely analog, and the player chooses which tone control and which clipping section the signal passes through. One voice follows a classic yellow Japanese super overdrive and the other a well-known distortion circuit, while the layout stays a compact three-knob pedal.

  Two tone control circuits are available. With the Tone switch down in the RT position the control simply rolls off high frequencies. With the switch up in the SD position an active low pass filter is engaged and more bass and treble frequencies are available.

  The Clipping switch selects between two diode clipping styles. The RT position uses hard diode clipping for an edgier, more aggressive tone, and the SD position uses soft diode clipping, closer to a softly overdriven tube amplifier.

  A JFET buffer handles switching. Holding the footswitch for roughly two seconds moves the pedal between buffered bypass, which keeps the signal strong while the effect is off, and true bypass, which passes the signal straight through. The LED flashes twice when true bypass is selected and three times when buffered bypass is. The pedal is designed and built by Keeley Electronics in Oklahoma City in a newly fabricated aluminum enclosure.
