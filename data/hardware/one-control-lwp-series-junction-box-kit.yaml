description: A DIY 2-in/2-out junction box kit for managing pedalboard input and
  output connections.
details: |-
  This is a kit that allows you to make your own 2in/2out junction box that can be installed on any pedal board and easily manage the input and output of your entire board. The mini-sized junction box is easy to use, and you can enhance the operability of various pedal boards and save space, from small boards with edges to large boards. It's easy to build and also perfect for first time effects builders. For production, you need solder, a soldering iron, and a screwdriver. Production time required: about 15 minutes

  ・ LWP Series Junction Box Kit Manual.pdf
