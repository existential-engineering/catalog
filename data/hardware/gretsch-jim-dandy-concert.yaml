details: |-
  Inspired by the historic 'Rex' line of instruments offered by mail-order catalog in the 1930s, '40s and '50s, Jim Dandy models embody the charm and spirit of those early Gretsch flat-top guitars with the superior playability and best-in-class tone that their namesake suggests.

  Featuring a comfortable and compact concert body shape and a modest 24.75" scale length, the Jim Dandy Concert strikes the perfect sweet-spot of versatile tone and approachable playability for a wide variety of musical settings.

  The X-braced body is crafted with select lightweight laminate tonewoods for an optimal balance of woody vintage tone and reliable durability, while the "C"-shape neck presents an inviting feel for hours of old-timey inspiration.
