description: Compact microphone for smartphones and DSLRs delivering
  professional sound in your pocket.
details: |-
  Unlike other compact mics out there, EM-93M is built with professional-grade components that deliver clearer, more defined sound that is crucial for mobile productions. With cables for both smartphones and DSLRs, you are ready to connect right out of the box, plus included mounting hardware makes setting up a snap. So, get the talent ready, build your sets, line up those interviews, or whatever your creativity has in store for you, because your audio is good to go.

  In a matter of a few seconds, you can upgrade the audio capture quality dramatically on your DSLR or smartphone. Not only is it that simple, it's also small enough to fit in the palm of your hand. When you know you sound good, you can feel free to create the content you want to make, worry-free. So grab an EM-93M and focus on being creative, not technical difficulties.
specs: |-
  - Premium compact condenser microphone
  - Great for mobile video production and live streaming
  - Included shockmount reduces handling noise
  - Furry windscreen dramatically reduces wind noise outdoors
  - Sponge foam windscreen is perfect for indoor/general use
  - Plug and play operation
  - DSLR and smartphone cables included
