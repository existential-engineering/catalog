description: >-
  The Korg DVP-1 is a rack-mount digital voice processor released in 1986, combining a
  vocoder, five-part harmonizer, pitch shifter, and internal synthesizer in a single unit.
  It delivers high-intelligibility vocoding with 64 memory patches and MIDI connectivity
  for integration with other gear. Notable users include Vangelis.
details: |-
  The DVP-1 is Korg's dedicated Digital Voice Processor, integrating a vocoder with its own internal waveforms, a five-part harmonizer, a pitch shifter, and an internal synth engine. The vocoder section delivers high intelligibility, making it well-suited for classic vocoder effects on vocals and other audio sources.

    The harmonizer provides up to five polyphonic voices, reduced to four when the built-in chorus effect is engaged. A unison mode is also available for thickening sounds. While the harmonizer does not sound super realistic, it has its own unique character that is valued in electronic music production.

    The unit offers 64 programmable memory patches for storing and recalling custom settings. MIDI IN, OUT, and THRU connections allow the DVP-1 to be controlled by external synthesizers, sequencers, and other MIDI devices.
specs: |-
  - Polyphony: 5 voices (4 with chorus enabled)
    - Modes: Vocoder, Internal wave, Harmonize, Pitch shift
    - Memory: 64 programs
    - Effects: 5-part harmonizer, pitch shifter, chorus
    - Control: MIDI IN/OUT/THRU
    - Form factor: Rack-mount
    - Keyboard: None
    - Arpeggiator/Sequencer: None
