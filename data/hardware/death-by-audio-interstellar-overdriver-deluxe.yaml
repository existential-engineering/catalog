details: |-
  DOUBLE INTERSTELLAR OVERDRIVER+++ { "@context" : "http://schema.org", "@type" : "Product", "name" : "INTERSTELLAR OVERDRIVER DELUXE", "image" : [ "https://cdn.shopify.com/s/files/1/2261/8655/products/Interstellar_Overdriver_Deluxe_Copper_Face_2048x.jpg?v=1555996119", "https://cdn.shopify.com/s/files/1/2261/8655/products/Interstellar_Overdriver_Deluxe_Copper_Face_400x400.jpg?v=1555996119", "https://cdn.shopify.com/s/files/1/2261/8655/products/IntOverDlxSide_400x400.jpg?v=1555996119", "https://cdn.shopify.com/s/files/1/2261/8655/products/Death-By-Audio-Interstellar-Overdriver-Deluxe-Diagonal_400x400.jpg?v=1555996119" ], "description" : "DOUBLE INTERSTELLAR OVERDRIVER+++ \n\n The Interstellar Overdriver Deluxe consists of two amazing, fully analog, Interstellar Overdriver pedals featuring additional, revamped options! Not only can you create unearthly overdrive sounds by routing the first channel into the second, but there are 5 additional options on the second channel to give you a huge range of overdrive / fuzz tones. A pleasant boost, a squealing lead, a chopped out glitch, a jet rocket lift-off; this is the pedal to blast your sound into the cosmos!", "url" : "https://deathbyaudio.com/products/interstellar-overdriver-deluxe", "brand" : { "@type" : "Brand", "name" : "Death By Audio", "logo" : "https://cdn.shopify.com/s/files/1/2261/8655/files/whiteoutlinetrans_410x.png?v=1515652188" }, "offers" : { "@type" : "Offer", "price" : "320.00" } } END OF LIFE. WE WILL NO LONGER PRODUCE THIS PEDAL SO GET IT WHILE YOU CAN. The Interstellar Overdriver Deluxe consists of two amazing, fully analog, Interstellar Overdriver pedals featuring additional, revamped options! Not only can you create unearthly overdrive and fuzz sounds by routing the first channel into the second, but there are 5 additional options on the second channel to give you a huge range of wild, filtered, modulated, and blasted-out overdrive/fuzz tones. A pleasant boost, a squealing lead, a chopped-out glitch, a jet rocket lift-off; this is the pedal to blast your sound into the cosmos! CONTROLS Master: Controls the volume of the circuit of the corresponding side - left MASTER controls the left side volume and right MASTER controls the right. Drive: Sets the amount of drive for the corresponding circuit. Rotary Selector: NOTE: Channel 1 is activated with the right side footswitch and adjacent controls, always remaining the Interstellar Overdriver circuit. Channel 2 on the left, however, can be altered with the rotary to become something completely new. B oth sets of controls will interact with one another to produce new, insane tones depending on which rotary position is selected - everything from piercing overdrive, to oscillations, and choppy trem. SPECS Dimensions: 5.71" x 4.89" x 2.54" (including hardware). Weight: 21 oz. Power: 9V (runs on standard 2.1mm negative center 9V adapter or included 9V battery). Current Draw: 2 mA.
specs: |-
  - 1: Thin Drive
  - 2: Normal Interstellar Overdriver
  - 3: Bass Overdriver
  - 4: Super Oscillating Fuzz
  - 5: Octave Fuzz
  - 6: Envelope Controlled Tremolo
