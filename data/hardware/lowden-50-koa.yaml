details: |-
  The Master grade 50 series Koa wood from Hawaii runs from golden colour hues to darker reddish and brown markings. Koa has a very distinctive look and for the 50 Series, it is selected for the best figure. Tonally it is ideal for someone who likes to throw a bit of jazz into the mix. Warm and full tones.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Koa back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 50 Series
  - Back and sides: Koa (Hawaiian)
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tonewood grade: Master Grade
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
