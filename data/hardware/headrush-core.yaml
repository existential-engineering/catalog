description: HeadRush Core is a professional guitar amp modeler and
  multi-effects processor with native Neural Amp Modeler support, direct
  TONE3000 access, amp cloning, impulse-response loading, vocal effects, and
  AutoTune. Its touchscreen workflow brings guitar, vocal, stage, studio,
  recording, and practice tools together in one powerful floorboard processor.
details: |-
  Core is a floorboard guitar amp modeler and multi-effects processor with a touchscreen workflow that covers guitar, vocal, stage, studio, recording and practice duties in one unit. Native Neural Amp Modeler support loads compatible NAM captures directly into a rig, and direct TONE3000 access through HeadRush Cloud makes it possible to discover, demo, download and play amp captures shared by other players, producers and artists, from boutique amps and rare rigs to studio signal chains.

  Two NAM A2 full captures run at the same time, through stereo doubling, switch doubling or two separate NAM blocks; switching the models to A2 lite allows four models in a single rig across two dedicated NAM blocks. Alongside those captures sit premium emulations of vintage, modern and boutique gear, factory presets built by professional sound designers and musicians, onboard effects, impulse responses and a full suite of vocal effects.

  Proprietary cloning technology expands the onboard amp and FX library using real gear. The HeadRush Amp Cloner captures the sound, dynamics and feel of amps, preamps, distortion pedals, overdrive pedals and fuzz pedals, guided by an on-screen wizard, and the captured tones can then be built into rigs. Access to ReValver and its growing library of SuperClones, which combine several amp clones into a single tone, is included.

  The Wi-Fi Remote Editor shapes sounds, manages setlists and refines performance setups wirelessly, and a built-in drum machine supports practice, rehearsal and song development. Vocal processing covers authentic Antares Auto-Tune plus pitch correction, harmonies, doubling, delay, reverb and distortion, in the same device used for guitar, bass and other instruments.

  The onboard libraries list 53 HeadRush amp models, 44 ReValver amp models, 15 HeadRush cab models, 10 HeadRush cab mic models and 67 ReValver cabs. Gig-ready I/O covers a combo input with phantom power, dual XLR and dual TRS outputs, a stereo FX loop with four-cable method support, amp control, MIDI in and out, and a USB audio interface for recording and re-amping, with Bluetooth audio streaming alongside.
specs: |-
  - 53 HeadRush amp models
  - 44 ReValver amp models
  - 15 HeadRush cab models
  - 10 HeadRush cab mic models
  - 67 ReValver cab models
  - Native Neural Amp Modeler support, 2 NAM A2 full captures at once or 4 A2 lite models across 2 NAM blocks
  - Direct TONE3000 access over Wi-Fi through HeadRush Cloud
  - HeadRush Amp Cloner with on-screen capture wizard
  - ReValver SuperClone playback
  - Antares Auto-Tune with pitch correction, harmonies, doubling, delay, reverb and distortion
  - Third-party impulse response loading and custom cabinet simulation
  - Touchscreen interface with drag-and-drop editing
  - Wi-Fi Remote Editor for wireless rig and setlist editing
  - Built-in drum machine
  - USB audio interface for recording and re-amping
  - Bluetooth audio streaming
  - Combo XLR plus 1/4-inch input with switchable 48V phantom power
  - Dual XLR outputs for mixers and PA systems
  - Dual TRS outputs with amp or line-level operation
  - Stereo FX loop with four-cable method support
  - Amp control output for compatible amplifier switching
  - MIDI input and output
  - Factory presets created by professional sound designers and musicians
