details: |-
  VCA IV: Quad OTA VCA - Assembled

  The VCA IV is a high-performance, four-channel voltage-controlled amplifier designed for precision signal shaping and mixing. This fully assembled module comes ready to install, offering a compact and powerful solution for managing audio levels in your Eurorack system. Key Features

  Versatile Quad & Stereo Operation

  The VCA IV is fundamentally designed as four individual VCAs, each equipped with its own signal input, CV input, and offset control. The offset knob allows for manual adjustment of the base amplification level before external CV is applied. Beyond standard quad operation, the module features internal normalizations that allow it to excel as two stereo pairs (VCA 1 & 2 and VCA 3 & 4):

  Voltage-Controlled Mixing

  All four channels are summed at the Mix Out, enabling the module to function as a compact voltage-controlled mixer. Design & Hardware

  The VCA IV follows the premium visual style of Guru Gara Synth factory designs, featuring a durable black PCB front panel with white and gold-plated copper artwork. Included in the Box:

  Technical Specifications
specs: |-
  - 4 Independent OTA-based VCAs: High-performance signal path optimized for audio and fast modulation.
  - Stereo-Ready Architecture: Intelligently normalled inputs and CV for seamless paired operation.
  - Built-in Summing Mixer: Dedicated Mix Out sums all four channels into a single signal path.
  - Switched Outputs: Patching into an individual VCA Out automatically removes that channel from the mix.
  - Plug-and-Play: Fully assembled, tested, and factory-calibrated for immediate use.
  - Premium Aesthetics: Black PCB front panel featuring signature white and gold-plated copper artwork.
  - Input Normalization: Input 1 is normalled to Input 2 (and 3 to 4) via a switched jack. Patching a mono signal into Input 1 automatically sends it to both VCAs in the pair.
  - CV Normalization: CV 1 is normalled to CV 2 (and 3 to 4). This allows a single envelope or LFO to control the dynamics of a stereo image with perfect synchronization.
  - Stereo Balancing: Even when using a single CV source, each channel retains an independent Offset knob, allowing you to fine-tune the center balance of your stereo field.
  - Signal Integrity: Because the internal stereo connections can add signals to the mix, simply turn the Offset pot all the way down for any unused channels to ensure a clean, bleed-free output.
  - Dynamic Sub-mixing: The switched jack architecture allows you to peel off individual channels for processing while the remaining signals stay in the main mix.
  - 1x Fully Assembled VCA IV Module
  - 1x 10-to-16 pin Ribbon Power Cable
  - 4x M3 Mounting Screws
  - Format: Eurorack
  - Width: 10HP
  - Depth: 25mm (Skiff Friendly)
  - Current Draw: - - - +12V: 35 mA
