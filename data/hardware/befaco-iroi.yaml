details: |-
  IROI is a compact, 18 HP stereo effects powerhouse from Befaco designed to turn any external signal into a deep, evolving soundscape. It is a focused derivation of Befaco's Oneiroi module, inheriting its sophisticated processing chain while adding a new mapping structure optimized for live performance and patch integration.

  The signal chain combines a stereo multimode filter (low-pass, high-pass, band-pass, and comb), a digital VCA, a 3-band resonator designed to add physical presence and harmonic depth, a 2-tap echo/delay, and an experimental reverb with macro controls for size, filtering, and direction. The filter and VCA act as a movable block that can be placed at any point in the signal chain.

  The Advanced Mapping System allows CV control and randomization of virtually all parameters. Holding the MAP button while turning any knob maps that parameter to an external CV or internal modulation source. Internal modulation sources include an LFO with seven selectable waveforms and an envelope follower that lets incoming audio modulate itself.

  The reverb section features a Spacetime control that transitions smoothly from short to long to inverted reverb, enabling blooming, hauntingly beautiful atmospheric textures. The delay section offers 2-tap echo suitable for rhythmic or textural processing, with external sync support for clock-locked tempo.

  A powerful randomizer with four different targets and undo/redo functionality allows instant sonic exploration. The module is available both fully assembled and as a DIY kit, and is designed and assembled in Barcelona.
