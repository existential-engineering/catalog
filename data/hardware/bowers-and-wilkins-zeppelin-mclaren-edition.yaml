details: |-
  Celebrating the long-standing award-winning relationship between Bowers & Wilkins and McLaren Automotive, the Zeppelin McLaren Edition fuses McLaren-inspired styling and high-performance wireless sound. Integration of McLaren Automotive cues is subtle but stylish, with a Galvanic Grey body and Papaya Orange stand and highlights, the latter inspired by the famous Papaya Orange which originated on founder Bruce McLaren's early racing cars.

  The Zeppelin McLaren Edition is a wireless smart speaker reimagined for the streaming age. Double Dome tweeters, FST midrange drive units and a powerful subwoofer combine for 24-bit high-resolution stereo sound.

  Enjoy your favourite music the way you want. The Zeppelin McLaren Edition can stream from Apple AirPlay 2, Amazon Music, Bluetooth aptX Adaptive and Spotify Connect. Deezer, Last.FM, Qobuz and TIDAL are available via the Bowers & Wilkins Music app.

  Zeppelin is a network connected, wireless active speaker primarily intended to be configured and controlled using the Bowers & Wilkins Music App, available for both iOS and Android devices. In addition to a mains power socket, the speaker has a USB-C connection for service. A wired Ethernet connection is possible only with an Ethernet-to-USB-C adaptor, which is not supplied. It has no mains power switch, runs a short start-up routine once connected to mains, and switches to a power saving mode after twenty minutes of inactivity.

  Manufactured under license from McLaren Automotive Limited. The McLaren name and logo are registered trademarks of McLaren.
specs: |-
  - Description: Wireless smart speaker
  - Drive units: HF 2x 25mm (1in) double dome tweeters, MF 2x 90mm (3.5in) FST midrange, LF 1x 150mm (6in) subwoofer
  - Amplifier power output: 240W
  - Frequency response: 35Hz to 24kHz
  - Technical features: Bowers & Wilkins Music App (with Deezer, Qobuz and TIDAL support), Apple AirPlay 2, Spotify Connect, Bluetooth In, Digital Signal Processing, Dynamic EQ
  - Bluetooth: 5.0
  - Bluetooth codecs: aptX Adaptive, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Connections: USB-C (service only)
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: Below 2 Watts (sleep)
  - Dimensions: Height 210mm (8.3in), Width 650mm (25.6in), Depth 194mm (7.6in)
  - Net weight: 6.5kg
  - Finishes: Galvanic Grey & Papaya Orange
  - Wired Ethernet is possible only via an Ethernet-to-USB-C adaptor, not supplied
