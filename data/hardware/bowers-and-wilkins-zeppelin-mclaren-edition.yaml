description: High-performance McLaren inspired wireless speaker. The Zeppelin McLaren Edition fuses McLaren-inspired styling with the high-performance wireless sound Bowers & Wilkins is renowned for.
details: |-
  Celebrating the long-standing, award-winning partnership between Bowers & Wilkins and McLaren Automotive, and the McLaren supercars and Ultimate Series in which Bowers & Wilkins has been integrated, the Zeppelin McLaren Edition wireless speaker fuses McLaren-inspired styling with the high-performance wireless sound Bowers & Wilkins is renowned for. Best-in-class sound meets iconic McLaren design.

  Integration of McLaren Automotive cues is subtle but stylish, with a Galvanic Grey body and Papaya Orange stand and highlights, the latter inspired by the famous Papaya Orange which originated on founder Bruce McLaren's early racing cars.

  The Zeppelin McLaren Edition is a wireless smart speaker reimagined for the streaming age. Double Dome tweeters, FST midrange drive units and a powerful subwoofer combine for 24-bit high-resolution stereo sound.

  The Zeppelin McLaren Edition can stream from Apple AirPlay 2, Amazon Music, Bluetooth aptX Adaptive and Spotify Connect. Deezer, Last.FM, Qobuz and TIDAL are available via the Bowers & Wilkins Music app.

  Manufactured under license from McLaren Automotive Limited. The McLaren name and logo are registered trademarks of McLaren.
specs: |-
  - Drive units: 2x 25mm (1") Double dome tweeters (HF), 2x 90mm (3 1/2") FST midrange (MF), 1x 150mm (6") subwoofer (LF)
  - Amplifier power output: 240W
  - Frequency response: 35Hz to 24kHz
  - Technical features: Bowers & Wilkins Music App (with Deezer, Qobuz and TIDAL support), Apple AirPlay 2, Spotify Connect, Bluetooth In, Digital Signal Processing, Dynamic EQ
  - Bluetooth: 5.0
  - Bluetooth codecs: aptX Adaptive, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Connections: USB-C (service only)
  - Input voltage: 100V - 240V, 50/60Hz
  - Power consumption: below 2 Watts (sleep)
  - Dimensions: 210mm (8.3 in) H x 650mm (25.6 in) W x 194mm (7.6 in) D
  - Net weight: 6.5kg
  - Finishes: Galvanic Grey & Papaya Orange
