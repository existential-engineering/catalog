description: VCO++ is a precision analog Eurorack oscillator built around the
  SSI2130 chip, offering true through-zero FM and PM, five waveform outputs, and
  dual 4-digit LED displays for note and frequency readout.
details: |-
  The VCO++ from Hampshire Electronics is a precision analog voltage-controlled oscillator built around the SSI2130 chip — delivering ultra-stable tracking, true through-zero FM and PM, and beautifully rich analog tone. Designed for both classic waveforms and deep frequency modulation, the VCO++ is a versatile sound source for any Eurorack system . With dual 4-digit LED displays showing note and frequency , it offers precise visual feedback rarely seen in an analog VCO — perfect for tuning, calibration, and live performance. Please note that due to issues sourcing some knobs, the frequency knob may be substituted for a different but similar knob. VCO++ Manual: Download VCO++ Manual PDF

  Key Features

  Controls & I/O

  Specifications

  The VCO++ combines the warmth of true analog synthesis with the precision and control modern Eurorack musicians expect — from subtle detuned stacks to full FM chaos, it's the heart of any serious modular voice.
specs: |-
  - Based on the SSI2130 VCO IC — known for musical, temperature-stable performance
  - Through-Zero FM and PM for complex, evolving tones
  - Dual 4-digit 7-segment displays for note and frequency readout
  - Five waveform outputs: sine, triangle, saw, square, and mix
  - Hard and soft sync inputs for phase-locked or harmonically rich modulation
  - External FM and PWM inputs with dedicated level controls
  - Mix CV input for dynamic waveform blending
  - Octave selector with precise tracking across the full range
  - Knobs: Octave, T-Z FM, T-Z PM, EX FM, PWM, MIX CV
  - Inputs: CV, EX FM, PWM, H-SYNC, S-SYNC, T-Z FM, T-Z PM, MIX CV
  - Outputs: Individual waveform outs plus mix out
  - Format: Eurorack module
  - Width: 20HP
  - Power: ±12V Eurorack standard
  - Core: SSI2130 analog VCO
  - Displays: Dual 4-digit 7-segment for note and frequency
  - Construction: Hand-assembled in England
