description: A passive stereo FX bypass module with two parallel bypass circuits
  for managing stereo effects or dual mono A/B switching.
details: |-
  Now with twice as much bypassing! The successor to the Micro FXBP is here, featuring two parallel bypass circuits to effectively manage stereo effects, or simultaneously control two mono inputs. Upgraded circuitry means the Stereo Bypass boasts significantly improved performance with regards to channel separation and crosstalk, while retaining the high quality mechanical switches and jacks from the previous model. Operation is easy. The Input jack is connected to the Send jack, from which you can send your signal anywhere you want, like an effect, before returning it to the Return jack. Pressing the switch will toggle the Output between the signal currently present at Input or Return, meaning you can use it to test a signal with or without stereo effects, or use it as an A/B utility for other signals, even modulation, rhythm and CV. So, what's it going to be then? Are you going to pull on your patch cables and plug things around to bypass and A/B, or will you be making the smart choice and reducing all that to a single press of a button?
specs: |-
  - Accepts both CV and audio signals
  - Perfect companion for stereo effects or as a dual A/B utility
  - Passive design: draws no power from your case
