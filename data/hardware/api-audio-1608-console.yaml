name: 1608 Console
manufacturer: api-audio
primaryCategory: console
categories:
  - mixer
  - discontinued
url: https://apiaudio.com/product/1608-console/
description: 16-channel recording console based on the vintage API 1604 with
  optional P-Mix motorized fader automation system. Adds modern features to the
  reliability and sound that API has been known for since its inception.
details: |-
  Building on API's heritage of high-quality recording consoles, the 1608 is based on the vintage API 1604. Standard fit includes 16 × 548B inputs with mic/line and direct output, 12 × 550A equalizers, 4 × 560 equalizers, 8 echo returns, complete center section, 16 manual faders, and 1 stereo fader.

  Available in 16, 32, or 48 channel configurations (console plus expanders). The optional P-Mix motorized fader automation system is self-contained requiring no external computer, with DAW control via Mackie HUI protocol, SD card file storage, unlimited mix restore points, and expandability in groups of 8 channels up to 48 channels. P-Mix can be factory-fitted or field-retrofitted.

  Center section provides 5.1 surround monitoring and analog metering.
specs: |-
  - 16 input channels with integrated mic preamp and equalizer
  - Accepts API 500 Series equalizer modules
  - 8 main buses, 8 auxiliary buses, 1 stereo bus
  - 8 echo returns with main and stereo bus assignment
  - Configurations: 16, 32, or 48 channels
  - Optional P-Mix motorized fader automation (DAW control via Mackie HUI)
  - P-Mix: SD card storage, unlimited mix restore points
  - P-Mix: expandable in groups of 8 channels up to 48
  - Main console power: 2.25A @ 120 VAC (270W)
  - Expander power: 1.75A @ 120 VAC (210W)
