description: The FS-EQ12-DI is a 12-band graphic EQ DI pedal for bass, giving
  detailed tone-shaping control that can feed an amp directly and DI to the
  desk. Twelve bands make it easy to build a characterful bass sound for stage
  or studio, while a one-click Shape function drops in the classic Ashdown
  voicing, footswitchable against your chosen EQ curve. The Ashdown VU meter and
  input level control help set the sweet spot for active or passive basses, and
  a professional-quality DI output with its own level control sends a clean
  signal to the PA or studio mixer. Built road-tough with a metal casing,
  premium switches, recessed knobs and kickguards, it uses genuine true-bypass
  switching, with an output level control to balance effect and bypass levels.
details: |-
  12 Band Graphic EQ DI Pedal. Looking for a new level of tone-shaping control that can feed your amp direct and DI to the desk? The 12 Band Graphic DI was the result of many requests for a killer bass graphic EQ pedal with the added flexibility of a pristine DI output. With 12 bands of sound shaping control it's easy to create a characterful bass sound for almost any musical application, on stage or in the studio. If you just want plug and play simplicity, the 'Shape' function gives no-fuss access to the classic Ashdown sound with one click. Using the footswitch you can select quickly between your chosen EQ curve and the Ashdown-shape. Whether you're using an active or passive bass, the Ashdown VU meter in combination with the Input level knob lets you easily find the sweet spot. A professional-quality DI output with its own level control lets you send your bass tone direct to the PA or studio mixer with a clean, clear signal. Built for the road with a metal casing, premium controls and switches, recessed knobs and kickguards to protect screens and VU meters. Ashdown Pedals feature genuine 'true bypass' switching for zero-colouration of your input signal when the pedal isn't in use. The Output level control lets you dial in the perfect balance between the effect and the true bypass level.
specs: |-
  - 12-band graphic EQ DI pedal for bass
  - One-click Shape function for classic Ashdown voicing
  - Footswitchable between chosen EQ curve and Shape
  - Ashdown VU meter with input level control
  - Professional-quality DI output with dedicated level control
  - Output level control
  - True-bypass switching
  - Road-tough metal casing with recessed knobs and kickguards
