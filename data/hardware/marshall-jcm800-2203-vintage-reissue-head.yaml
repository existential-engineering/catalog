description: Iconic 100W all-valve guitar amplifier head built in the UK. The
  JCM800 2203 helped define the sound of an era for rock and metal players, with
  a single-channel circuit, master volume, and a tonally transparent series
  effects loop in this latest incarnation. Skilfully crafted at Marshall's
  factory in Bletchley, England as part of the Vintage Reissue series.
details: |-
  - All-valve
  - Single channel simplicity
  - Master volume control
  - Series FX loop (tonally transparent)
  - Versatile EQ settings
  - Built in the UK factory in Bletchley, England
specs: |-
  - Model: JCM800 2203 Vintage Reissue Head
  - Range: Vintage Reissue
  - Output Wattage: 100W
  - Channels: 1
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 4 x EL34
  - Controls: Preamp Volume, Master Volume, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects Loop: Yes, 1 x serial switchable
  - Inputs: 2 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Product Height: 315 mm / 12.4"
  - Product Width: 740 mm / 29.1"
  - Product Depth: 210 mm / 8.3"
