description: Iconic 100W all-valve guitar amplifier head built in the UK. The JCM800 2203 helped define the sound of an era for rock and metal players, with a single-channel circuit, master volume, and a tonally transparent series effects loop in this latest incarnation. Skilfully crafted at Marshall's factory in Bletchley, England as part of the Vintage Reissue series.
details: |-
  The art of the JCM800 2203 Vintage Reissue Head is its simplicity. Used by artists around the world, this amp continues to be one of our greatest. Oozing rock status, you can effortlessly detect its distinctive 100W roar. Complete with a master volume and a series FX loop, the JCM800 allows you to control your sound. Designed and engineered in UK. Made in UK.

  The JCM800 is one of the few vintage reissues that is equipped with a master volume control. With this feature, you can achieve valve saturation at lower volume levels. This is particularly useful for valve amplifiers, as this distortion contributes to a warm and responsive tone. Combining all these elements makes for a more versatile and player-friendly amplifier, always ready for you to add in that extra power during your solo moments.

  This reissue sees the introduction of a series effects loop. You can add all the effects in between the pre-amp section and the power amp to give your effects that extra clarity. A favourite when cranking up the distortion on the amp.

  The highly versatile EQ settings mean that this amp can play a range of genres and not just the rock or heavy metal it is synonymous with. Whatever you decide to play, the JCM800 will keep up with you every step of the way.

  Since its launch, the JCM800 has been skilfully crafted at the Bletchley, England factory and it is still available today as part of the Vintage Reissue series. Originally built with one channel, no reverb and modified reservoir caps, the JCM800 became a flagship amp that boasted an aggressive sound. It went on to define the sound of the era, with many rock and metal bands making it their amp of choice. All the classic features that made the amp so popular have been left intact, combined with modern touches such as the tonally transparent series FX loop.
