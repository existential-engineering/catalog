url: https://www.tchelicon.com/en/products/0726-aao
description: Vocal effects stompbox that turns a single lead vocal into an
  eight-voice unison doubling effect. A Smart Sense mode can engage the effect
  automatically, and the pedal runs XLR in to XLR out with 48V phantom power and
  true bypass.
details: |-
  Critical Mass is a vocal stompbox built around a single doubling effect. One footswitch engages an eight-voice unison engine that layers a lead vocal into what sounds like a fully tracked group, with small timing and pitch variations applied across each voice so the result keeps a natural feel rather than a mechanical one.

  A Smart Sense mode lets the pedal engage itself on the sections of a song that call for a large sound and back off on quieter passages, so the decision can be set once and left alone. The effect can instead be assigned to the footswitch for manual control.

  Connectivity is a single XLR microphone input with 48V phantom power and a single XLR output, with true bypass when the effect is off. Power comes from a standard 9V DC supply, so the pedal shares a board power brick with other stompboxes.
specs: |-
  - Eight-voice unison doubling engine
  - Smart Sense automatic effect engagement
  - 48V phantom power on the XLR microphone input
  - True bypass
  - 9V DC power input
