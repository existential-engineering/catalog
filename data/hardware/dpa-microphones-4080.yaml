description: The 4080 Miniature Cardioid Microphone has excellent speech
  reproduction, is discreet, fits left and right buttoned shirts and comes with
  black and white filters.
details: |-
  While our miniature omnidirectional mics are ideal for situations where a broad pickup pattern is essential and off-axis noise is not a problem, in some challenging acoustic environments a directional microphone is the better choice.

  Now available with CORE+ and MicroLock.

  The 4080 Cardioid Lavalier captures the human voice with an unusually high degree of definition. This mic offers maximum side rejection and excellent sonic focus on the subject. It is designed for broadcast, conference and other live performances both in the studio and in the field.

  The mic is acoustically pre-equalized, offering a 4 dB presence boost, which matches the mic's chest placement perfectly. This makes the voice more distinguishable and improves speech intelligibility. Professionals will appreciate that it is lightweight and offers excellent speech reproduction.

  This cardioid condenser lavalier microphone is delivered with a pre-mounted black pop filter in a holder with an integrated shock mount, fixed on a clip. An additional white pop filter is also included. Because of the flexible and practical mounting solution, the mic can easily be turned in all directions so it fits both left- and right-buttoned shirts.

  Features: Excellent speech reproduction; Discreet, compact design; Fits both left and right buttoned shirts; Delivered with both black and white pop filters; Modular adapter system fits most professional wireless systems.
specs: |-
  - Directional pattern: Cardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB: 250 Hz - 17 kHz with typ. 4 dB soft boost at 4 - 6 kHz (-5 dB at 100 Hz)
  - Sensitivity, nominal, ±3 dB at 1 kHz: 20 mV/Pa; -34 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 23 dB(A) re. 20 µPa (max. 26 dB(A))
  - Distortion, THD < 0.5%: 127 dB SPL RMS, 130 dB SPL peak
  - Distortion, THD < 1%: 128 dB SPL RMS, 131 dB SPL peak
  - Dynamic range: Typ. 108 dB
  - Max. SPL, THD 10%: 134 dB SPL peak
  - Rated output impedance: 30 - 40 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001 XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD9001: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001 XLR Adapter
  - Connector: MicroLock
  - Weight: 15 g (0.5 oz) incl. Cable and MicroLock connector
  - Microphone diameter: 5.7 mm (0.22 in)
  - Microphone length: 30 mm (1.2 in)
  - Cable length: 1.2 m (3.9 ft)
  - Cable diameter: 1.6 mm (0.06 in)
  - Polarity: Positively increasing sound pressure produces positive going voltage on MicroLock pin
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black
