description: Flurry collects and connects a number
  of practical modular synthesis tools, focussed on clocks, noises, and
  randomness to create a module that is rife with opportunities for exploration
  and experimentation. Equally capable as a synthesis source, modulator, clock,
  or signal modifier; It is bound to find a way to bring new life and dimensions
  to your synth patches.
details: |-
  Most people consider noise to be "undesirable," and product developers expend great effort to design circuits that minimize noise. So why make a module designed specifically to create noise? Indeed, unwanted noise is undesirable. But not all noise is unwanted — the crack of a snare hit, the breathiness of a flute sound, an added sizzle to a resonant pad, all are within the sonic domain of noise.

  Functions include 16 digital noise types (each with 2 morph parameters, one with a modulation input), a clock and random pulse source with adjustable and modulatable rate, accurate pink and white noise sources, analog sample & hold and track & hold circuits with very low droop, analog slew with adjustable slew time and edge selection (rising edge, falling edge, or both), and an analog envelope follower.

  Noise makes a wonderful modulator: modulating a filter's cutoff frequency or an oscillator's pitch or pulse width produces raspy, buzzy, gritty timbres. Noise is also a key ingredient in sample & hold circuits, a technique used to generate stepped, random voltages by sampling an input signal's voltage on each clock pulse and holding it until the next pulse.

  A slew circuit lets you select not just the slew time but also whether it applies to rising voltages, falling voltages, or both. Flip a switch and that slew circuit becomes an envelope follower, enabling Flurry to generate envelopes from input signals (syncing to drum hits is a common use).
