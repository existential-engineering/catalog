details: |-
  Get classic '50s & '60s-inspired Gretsch sound and style with the all-new Electromatic Classic Hollow Body guitars.

  The G5422GLH features a laminated maple body with vintage-inspired perimeters and refined arches, as well as all-new trestle block bracing to help reduce unwanted feedback. The new design results in the sound having a faster attack with more focus, snap, and increased sustain, paired with all-new FT-5E Filter'Tron pickups delivering huge full-bodied punch, classic chime and enhanced presence.

  The neck offers a Classic "C"-shaped maple design topped with a 12"-radius laurel fingerboard. Additional features include master volume with treble bleed circuit, individual pickup volume controls, oversized bound F-holes, multi-ply body binding, and vintage-style open-back tuning machines.

  The guitar arrives in standout Snowcrest White with gold pickguard and gold hardware.
