description: Dante audio networking compliant 1U rackmount stereo rack monitor with built-in 10 W x 2 power amplifiers, balanced analog input and a 26-dot LED meter.
details: |-
  The RM-3DT is a rackmount monitor with built-in 10 W x 2 power amplifiers equipped with Dante audio networking, a feature developed by Audinate that enables the transmission of multiple uncompressed digital audio signals. Dante is a registered trademark of Audinate, Inc.

  It supports balanced analog input and Dante input, and uses a power-saving design with a digital amplifier and switching power supply.

  The 26-dot LED meter display is selectable from VU, VU+PEAK, VU+PEAK hold and PEAK+PEAK hold, and the display brightness can be adjusted in four levels.

  Either or both of the 2-channel digital signals extracted from the Dante network signal can be output.
specs: |-
  - Speaker unit: 110 x 40 mm cone type, magnetically shielded
  - Impedance: 8 ohm
  - Sound pressure level: 84 dB/W (1 m)
  - Frequency response: 200 Hz to 20 kHz
  - Power amplifier maximum output: 10 W x 2
  - Residual noise: -50 dBV or less (DIN AUDIO)
  - Distortion rate: 0.1% or less
  - Dante input: RJ45 connector, Dante format
  - Analog input: XLR-3-31 type, rated input level +4/0 dBu (balanced), input impedance 10 kohm min.
  - Analog THRU output: XLR-3-32 type
  - Phones: 6.3 mm stereo phone, applicable load impedance 16 ohm or more, maximum output 20 mW + 20 mW (32 ohm, 1 kHz)
  - Level meter: 26-dot LED x 2, reference level analog XLR +4/0 dBu, four brightness levels
  - External dimensions: 482 (W) x 44 (H) x 284 (D) mm (including protrusions)
  - Weight: approx. 3.5 kg
  - Power requirement: AC 100 V to 240 V, 50/60 Hz
  - Power consumption: 10 W
