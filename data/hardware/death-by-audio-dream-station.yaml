description: A compact stereo pedal combining reverb and delay effects with
  three filter settings for shaping tone, including ping-pong style stereo
  output.
details: |-
  The Dream Station is like two Death By Audio pedals in one! It’s an instant mood creator, blending DBA-style reverb and delay to plunge your signal into a vivid fantasy hallucination. Three filter settings let you radically shape the tone and character of the effects, opening up a myriad of soundscapes at your fingertips and exploding your sound into super-wide stereo. Need some stereo cables?
