description: Flagship planar magnetic headphones with a high-efficiency 15-ohm
  driver that can be driven directly by most devices.
details: |-
  LCD-4z combines Audeze's thinnest, most advanced driver film with their most powerful Double Fluxor magnetic array to deliver world-class precision and musicality from almost any device, without a dedicated headphone amplifier.

  The LCD-4z immediately envelops you in your favorite music, with voicing that is tuneful but detailed, precise yet entertaining. The subtle midrange warmth draws you in to the music while the powerful low end provides foundational groove.

  Features an advanced 106mm nano-scale driver — thinner than a red blood cell — paired with a double-Fluxor magnetic array. The 15-ohm impedance makes it compatible with most devices, including portable players and laptop outputs.

  Built with a cast-magnesium chassis, gold-accented panels, carbon fiber suspension headband, and ventilated leather headstrap. Broad, deep ear cushions cradle the head and ears in soft premium leather. Assembled in California. This is a legacy product and no longer available for sale.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Double Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Nano-Scale Uniforce
  - Transducer size: 106 mm
  - Maximum SPL: >130dB
  - Frequency response: 5Hz - 50kHz
  - THD: <0.1% @ 100 dB SPL
  - Sensitivity: 98 dB/1mW (at Drum Reference Point)
  - Impedance: 15 ohms
  - Min recommended power: >100mW
  - Recommended power level: >250mW
  - Cable: 2.5m Premium Braided 4-Pin XLR balanced with 1/4 inch adapter
  - Weight: 560g
