description: The JVM410C is a 100W all-valve 2x12" guitar combo hand-built in
  the UK. Across its four independent channels (Clean, Crunch, OD1 and OD2) each
  with three switchable modes (Green / Orange / Red), the JVM410 Combo offers
  twelve distinct sounds, each with more gain than the last. Every channel has
  its own dedicated gain, three-band EQ, volume and reverb controls, plus global
  presence, resonance and a master volume select for two switchable master
  volumes. The amp features a five-valve preamp (4 x ECC83 plus 1 x ECC83 phase
  splitter) driving a 4 x EL34 power section, dual effects loops (one
  series/parallel, one series), a switchable emulated XLR line out, MIDI In/Thru
  for channel and effect recall, and a fully assignable six-button footswitch.
  Speakers are a Celestion Heritage G12H (80W) paired with a Celestion Vintage
  (70W).
