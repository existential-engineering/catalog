description: The JVM410C is a 100W all-valve 2x12" guitar combo hand-built in the UK. Across its four independent channels (Clean, Crunch, OD1 and OD2) each with three switchable modes (Green / Orange / Red), the JVM410 Combo offers twelve distinct sounds, each with more gain than the last. Every channel has its own dedicated gain, three-band EQ, volume and reverb controls, plus global presence, resonance and a master volume select for two switchable master volumes. The amp features a five-valve preamp (4 x ECC83 plus 1 x ECC83 phase splitter) driving a 4 x EL34 power section, dual effects loops (one series/parallel, one series), a switchable emulated XLR line out, MIDI In/Thru for channel and effect recall, and a fully assignable six-button footswitch. Speakers are a Celestion Heritage G12H (80W) paired with a Celestion Vintage (70W).
details: |-
  With three modes on each of the four channels, the JVM410 Combo offers twelve distinct sounds, each with more gain than the last.

  Take your sound to the next level with two FX loops and master volumes, reverb and power amp tone-shaping. Take this amp from the stage to the studio, with silent recording available at the flick of a switch.

  Equipped with an individual master volume for each channel, this amp empowers you to create dynamic and explosive solo performances. Built-in reverb controls let you experiment with your sound and unleash solos that leave a lasting impression.

  The JVM410 Combo comes with recording features and a standby function tailored for silent recording. Connect your amplifier to a recording device using the line out and keep the standby switch off for smooth transitions between bedroom practice, studio recording and live performances.

  Designed and engineered in UK. Made in UK.
specs: |-
  - Built in Marshall's UK factory
  - All-valve
  - Celestion Heritage and Celestion Vintage speakers
  - Store your settings
  - Four channels, each with dedicated volume controls
  - Built-in digital reverb
  - Silent recording mode
  - Model: JVM410 Combo
  - Range: JVM
  - Channels: 4 (Multi)
  - Technology: Valve
  - Output wattage: 100W
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), Emulated Line Out (XLR), MIDI Thru
  - Inputs: 1 x 1/4" jack instrument input, MIDI In, Footswitch
  - Controls: Channel and mode select (button), gain (per channel), treble (per channel), middle (per channel), bass (per channel), volume (per channel), reverb (per channel), presence, resonance, master volume select, master volume (switchable for each channel)
  - Effects: Digital reverb
  - Effects loop: 2, 1 x series parallel, 1 x series
  - Speaker configuration: 2x12"
  - Speaker model: 1 x Celestion Heritage G12H (8Ω, 80w), 1 x Celestion Vintage (8Ω, 70w)
  - Unit impedance: 16Ω
  - Preamp valves: 4 x ECC83, 1 x ECC83 (phase splitters)
  - Power amp valves: 4 x EL34
  - Weight: 34.5 kg / 76 lb
  - Width: 690 mm / 27.2"
  - Height: 510 mm / 20.1"
  - Depth: 265 mm / 10.4"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-91016 footswitch included, detachable power cable included
