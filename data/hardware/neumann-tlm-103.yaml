details: |-
  A modern studio standard

  The TLM 103 is a transformerless cardioid condenser microphone with a large diaphragm capsule derived from the legendary U 87 A, offering pristine clear sound with a gentle presence boost above 5 kHz, extremely low self-noise, and high SPL handling.

  Highlights:
  - Capsule design derived from the legendary U 87 A
  - Consistent cardioid pattern
  - Broad presence boost for enhanced sound definition
  - Extremely low self-noise
  - Transformerless circuitry with high SPL capability

  Applications:
  - Vocals
  - Speech
  - Drums
  - Guitar amps
  - Piano
  - Classical spot mic (cello, double bass)
  - Project studio
  - Broadcast
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional  Pattern: Cardioid
  - Frequency  Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 k Hz into 1 kohm: 23 mV/Pa (-32.5 dBV ± 1 dB)
  - Rated  Impedance: 50 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level,  C C I R: 17.5 dB
  - Equivalent noise level,  A-weighted: 7 dB-A
  - Maximum  S P L for  T H D 0.5%: 138 dB
  - Signal-to-noise ratio,  C C I R (re. 94 d B  S P L): 76.5 dB
  - Signal-to-noise ratio,  A-weighted (re. 94 d B  S P L): 87 dB
  - Maximum output voltage: 13 dBu
  - Supply voltage ( P48,  I E C 61938): 48 V ± 4 V
  - Current consumption ( P48,  I E C 61938): 3 mA
  - Matching connector: XLR 3 F
  - Weight: approx. 450 g
  - Diameter: 60 mm
  - Length: 132 mm
