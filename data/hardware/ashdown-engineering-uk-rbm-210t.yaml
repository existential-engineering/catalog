details: |-
  The Ashdown UK-RBM-210T is a UK-built 2x10" bass cabinet created for players who prioritise speed, clarity, and definition in a compact, lightweight format. Rated at 300 watts at 8 ohms, it delivers the tight low-end response and immediate punch that 10" speakers are known for. At its core are two Sica NEO 10" drivers chosen for their fast response and balanced midrange, plus an adjustable high-frequency tweeter that shapes the top end from smooth and rounded to crisp and modern. Built from high-quality plywood and finished in Charcoal Tweed with a Silver Weave grille cloth and Ashdown's double-wing badge, it performs confidently as a standalone cab or as part of a modular setup.
