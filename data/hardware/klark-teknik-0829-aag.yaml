description: The CP8000EU is a wall-plate control panel that, used with the
  DM8000 Digital Audio Processor, provides control over volume and selection for
  up to 6 auxiliary inputs. Its illuminated soft-touch controls receive power
  directly from the DM8000 via CAT5/6 or any 5-conductor cable.
details: |-
  CP8000EU provides a remote control centre for a wide range of audio applications, allowing fast input selection from up to 6 auxiliary sources and adjustment of the selection's volume level. The volume control may be assigned to either the auxiliary input section or the main mix bus.

  The soft-touch illuminated controls do not require external power, as the operating voltage is supplied directly from the DM8000.

  Installation into most standard-depth enclosures takes just two screws beneath the front plate: remove the front panel, connect the cabling, fasten the main unit into the enclosure with the provided mounting screws, then replace the front panel. The compact, single gang format allows use with low voltage trim rings, and inexpensive CAT5/6 or any 5 conductor cable can provide connection for distances of up to 300 feet (100 m).

  A generous space beside each soft-touch button allows the name of the assigned audio source to be noted, either written directly onto the surface or applied as a sticky label.
specs: |-
  - Control over volume and selection for up to 6 auxiliary inputs
  - Volume control assignable to the auxiliary input section or the main mix bus
  - Illuminated soft-touch controls, no external power required
  - Operating voltage supplied by the DM8000 over CAT5/6 or any 5-conductor cable
  - Cable run up to 300 feet (100 m)
  - Single gang format, fits most standard-depth installation enclosures
  - Requires a DM8000 Digital Audio Processor
