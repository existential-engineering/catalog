details: |-
  The Super Chili Picoso is Catalinbread's first-ever effect, originally hand-made on a kitchen table in Washington and sold through Tone Factor. The Legacy Series reimagining adds a natural-sounding EQ control, a switch to run two units in series for extra boost and covert overdrive, and circuit refinements for improved dynamic range — while preserving the one-knob simplicity and sparkle of the original design.
