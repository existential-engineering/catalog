description: |-
  The Ci160QL is a rectangular in-ceiling/in-wall speaker featuring KEF's
  patented Uni-Q driver array. The tweeter is positioned at the acoustic
  center of the bass/midrange cone, functioning as a single point source for
  wide and even sound dispersion. Features an Ultra Thin Bezel (UTB) design
  for discreet installation.
specs: |-
  - Nominal Impedance: 8 Ohm
  - Sensitivity: 89dB (2.83V/1m)
  - Frequency Response: 38Hz–34kHz (±6dB, open-backed)
  - Crossover Frequency: 3.0kHz
  - Drive Units: 160mm (6.5") LF; 19mm (0.75") HF Uni-Q
  - Recommended Power: 10–125W
  - External Dimensions: 303 × 223 × 97.5mm
  - Cutout Dimensions: 274 × 194mm
  - Mounting Depth: 91mm
  - Weight: 2.05kg
