description: >
  Engineered for liftoff, AstroLab 37 redefines what a compact performance keyboard can be. Combining an unrivalled sound palette with intuitive controls and a seamless studio-to-stage experience, it empowers musicians to perform with confidence and limitless sonic freedom.
details: |-
  The astrolab 37 is a compact performance keyboard engineered for both studio and stage use, combining an extensive sound palette with intuitive controls and seamless studio-to-stage integration. Featuring a 37-note slim-key keybed with premium synth-action keys and aftertouch, it delivers expressive, responsive performance in a portable format. The instrument is purpose-built for live performance with rugged, road-ready construction and ultra-low latency, enabling musicians to power up, select sounds, shape them in real-time, and deliver pure musical expression with complete standalone capability.

  The astrolab 37 houses 11 distinct synthesis engines including virtual analog, samples, wavetable, fm, granular, physical modelling, vector synthesis, harmonic, phase distortion, vocoder, and karplus synthesis. With over 1,800 in-built sounds across 44+ instruments, the keyboard is expandable to more than 10,000 sounds through integration with analog lab, v collection, and pigments software. The instrument features two dedicated effects (delay and reverb) alongside two assignable effects, providing access to up to 12 insert effects for customizing performance setups with width, warmth, and movement.

  Control is streamlined through dedicated preset buttons for quick instrument switching, chord and scale modes, an arpeggiator with hold function, and four macro controls for editing essential sound parameters like brightness, timbre, time, and movement. The mod wheel, pitch wheel, and octave buttons enable real-time note bending, sound modulation, and keyboard transposition by semitones or full octaves. A 400-pixel color screen with navigation encoder provides easy browsing of sounds, preset switching, and real-time parameter feedback.

  Connectivity is comprehensive with MIDI I/o for controlling external gear and syncing to external setups, USB-c for DAW integration and firmware updates, and USB-a host port for external MIDI controllers or keyboards. The instrument includes balanced stereo outputs, a dedicated headphone output for monitoring, balanced mic/line mono input for vocoder use or external instrument processing, and pedal input for hands-free sustain control. Bluetooth audio input enables jamming and improvisation along with external music sources.

  The astrolab 37 includes analog lab pro for preset customization and library organization, and astrolab connect for wireless mobile control of playlists, presets, and sound management without cables. The software ecosystem enables seamless transitions between studio and stage workflows, allowing musicians to build custom sound libraries in the studio and manage them on the move. Exclusive offers are available for v collection and pigments expansion, providing access to vintage and modern instruments with full instrument control and in-depth sound design capabilities.
specs: |-
  - 37-note velocity-sensitive slim keyboard with aftertouch
  - 44+ instruments and 1,800+ presets
  - Expandable to 10,000+ sounds via analog lab, v collection, and pigments
  - 11 sound engines: virtual analog, samples, wavetable, fm, granular, physical modelling, vector synthesis, harmonic, phase distortion, vocoder, karplus synthesis
  - Built-in arpeggiator, chord and scale modes
  - 4 macro controls for sound editing
  - 2 dedicated fx (delay and reverb) plus 2 assignable fx (up to 12 insert fx total)
  - Color screen with navigation encoder
  - MIDI I/o connectivity
  - USB-c connection and USB-a host port
  - Balanced stereo output and balanced mic/line mono input
  - Headphone output
  - Pedal input for sustain control
  - Bluetooth audio input and Wifi for wireless control
  - Mod wheel, pitch wheel, and octave buttons
  - 10 preset buttons for quick sound access
  - Includes analog lab pro and astrolab connect software
  - Ultra-low latency performance
  - True bypass and standalone operation
  - Dimensions: 59 x 515 x 214 mm (2.32 x 20.28 x 8.43 in)
  - Weight: 1.95 kg (4.30 lb)
  - Polyphony: 48 voices for pianos/eps/organs, 8 voices for most synths
  - V collection 11 and pigments compatibility
