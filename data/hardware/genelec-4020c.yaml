description: "When space is at a premium, the 4020C is your compact, faithful
  friend. Designed for challenging commercial installations, the 4020C squeezes
  huge performance into a small package."
details: |-
  The Genelec 4020C is a compact two-way active installation loudspeaker built for commercial spaces where space is at a premium. Designed for restaurants, retail interiors, hospitality lounges, corporate AV systems, and other distributed-audio environments, the 4020C condenses Genelec's reference monitoring DNA into a small, discreet cabinet that can disappear into almost any interior while still delivering clean, intelligible, full-range sound.

  Acoustic performance is anchored by a 105 mm bass driver and a 19 mm metal-dome tweeter, each magnetically shielded and driven by its own 50 W Class D amplifier. The pair produces a frequency response of 62 Hz - 20 kHz (+/- 2.5 dB) and short-term maximum SPLs of 100 dB or more at one meter, with self-generated noise held below 5 dB SPL so the cabinet stays musical in quiet ambient rooms as well as louder commercial venues.

  The die-cast aluminum Minimum Diffraction Enclosure (MDE) and Directivity Control Waveguide (DCW) work together to deliver smooth, controlled dispersion and a wide, consistent listening area, which matters in installation contexts where audiences move through the coverage zone. A rear-panel set of room compensation DIP switches lets installers tune bass response, mid-range and treble tilt to compensate for wall and corner placement, soft furnishings, or reflective surfaces without external processing.

  The 4020C is designed for the realities of integration work. It accepts balanced analog audio over a Euroblock terminal block, supports auto-standby via Genelec's Intelligent Signal Sensing (ISS) circuitry to drop idle consumption to 0.5 W or less, and ships in a finish range that includes white, black, a paintable RAW version, and 120 custom RAL colours, allowing the cabinet to be matched to almost any interior brief. Multiple M6 threaded inserts support Genelec's wide ecosystem of brackets, stands, ceiling mounts, and truss hardware.

  Aesthetically and acoustically, the 4020C extends the Classic Series language into the commercial install market: small footprint, neutral tonal balance, low distortion, and quiet operation, with the installer-focused features (room compensation, ISS, broad mounting and colour options) needed to put it in the wild and walk away.
specs: |-
  - Frequency response (+/- 2.5 dB): 62 Hz - 20 kHz
  - Frequency response (-6 dB): 56 Hz - 25 kHz
  - Peak SPL: >=107 dB
  - Short-term max SPL: >=100 dB
  - Long-term max SPL: >=93 dB
  - Self-generated noise: <=5 dB SPL (A-weighted)
  - Harmonic distortion: 50-200 Hz <=3%; >200 Hz <=0.5%
  - Bass driver: 105 mm cone, magnetically shielded
  - Treble driver: 19 mm metal dome, magnetically shielded
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Crossover frequency: 3000 Hz
  - Analog input: 1x Euroblock, balanced, 10 kOhm
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Power consumption (ISS active): <=0.5 W
  - Power consumption (idle): <=3 W
  - Power consumption (full output): 60 W
  - Enclosure: die-cast aluminum with reflex port
  - Dimensions (H x W x D): 226 x 151 x 142 mm
  - Weight: 3.1 kg (6.8 lb)
  - Finish options: white, black, RAW (paintable), 120 custom RAL colours
