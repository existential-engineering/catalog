details: |-
  The NUVO N22 is a modern near-field active ribbon microphone designed for close miking of instruments. Its rugged lightweight design, extended top-end clarity, and reduced proximity effect make it versatile across a wide range of recording applications.

  The N22 naturally reduces proximity effect while also avoiding the room tone that can cause problems in smaller spaces or iso booths. Naturally rolling off the low-end before it hits the ribbon creates a much different sound than using electronic equalization to roll off the low-end in post.

  Unlike traditional ribbon mics, think of the N22's placement in terms of inches instead of feet. Near-field mics can be positioned at a distance, but they have a more balanced sound close to the sound source.

  The N22 not only handles the SPL levels of a high-gain amplifier and kick drum with ease, but it also translates all the gritty details of an instrument that musicians seek.

  From outdoor gigs at music festivals to indoor theaters, NUVO mics are the perfect companion for the live stage. With the NUVO Windscreen, never worry about the ribbon — even at windy gigs.
specs: |-
  - Active ribbon microphone with built-in active preamp
  - Near-field design optimized for close miking
  - Extended top-end clarity compared to traditional passive ribbons
  - Reduced proximity effect
  - Handles high SPL sources (high-gain amplifiers, kick drum)
  - Rugged lightweight construction
  - Suitable for live stage and studio use
