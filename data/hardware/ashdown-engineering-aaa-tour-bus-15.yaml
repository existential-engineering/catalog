description: A stripped-back budget bass combo, the AAA Tour Bus 15 pairs a 15W
  power amp with a rugged 8" driver. Simple volume, bass and treble controls
  make it easy to get a great practice tone. A headphone output allows silent
  practice and an MP3/CD input lets you jam along with your favourite tracks.
details: |-
  Ashdown AAA-series practice bass combo. 15W power amp driving a single 8" driver. Three-band EQ (Bass, Middle, Treble). Headphone output for silent practice and an MP3/CD line input for playing along to tracks. Power output: 15W. Speaker configuration: 1 x 8". Dimensions (H x W x D): 300 x 320 x 200 mm. Weight: 5 kg.
