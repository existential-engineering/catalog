details: |-
  Sporting a classic, all-analog, bucket-brigade design, ECHOBRAIN ANALOG DELAY is the ultimate and affordable choice for vintage effects aficionados. ECHOBRAIN ANALOG DELAY puts all the warm vintage echoes and gorgeous runaway delays you’ve been searching for, right at your feet in a rugged and compact stompbox. Just kick it in – and listen as the echo-angels sing!

  Echoes of the Past

  ECHOBRAIN is your ticket to the iconic delay tones of yesteryear, providing everything from the lush, organic repeats that transport your playing on a bed of brilliant ambience, to tight, funky slapbacks – and all points in between.

  Runaway Brigade

  The all-analog, bucket-brigade circuit inside ECHOBRAIN provides up to 300 ms of delay time. At lower time settings, your echoes will be crisp and punchy; but at longer settings, you’ll experience the natural high-end roll-off that is the hallmark of a great analog delay. And when you max out the repeats, you get a full dose of glorious self-oscillation – for mind-blowing runaway delay strings.
