description: This pedal shares patented features with the Machined Direct Drive Pedal, but with an extended footboard.
details: |-
  For drummers that require additional leverage and throw, the already long DW MFG footboard is offered in XF Extended Footboard models. A modified Contour Heel Plate allows a longer footboard without the need for a larger overall footprint.

  Industry-standard bass drum pedals have always been a DW mainstay. The Machined Direct Drive Pedal is no exception. Jam-packed with a slew of drummer-friendly features, the MDD2XF Pedal is the result of years of painstaking design and engineering. Machined from solid aluminum, this pedal offers players unprecedented feel and versatility, whether or not they currently play a direct drive pedal.

  The MDD2XF double pedal incorporates DW's patented Single Post Casting design. This allows you to place the auxiliary bass pedal closer to your hi-hat pedal, letting you move your foot more quickly and easily between them, or even play them simultaneously.

  Standard features include a newly-designed, solid aluminum, perforated footboard with a contoured heel plate, Interlocking Delta Hinge, Tri-Pivot Toe Clamp, a solid aluminum, direct drive cam with TBT (Threaded Bearing Technology) and pivot adjustment, VERT (Vertical Spring Adjustment), Control Beater with adjustable weight/impact, and more.

  A Lux Leather backpack case is included: a deluxe soft pedal bag that does double-duty as a drummer's travel backpack.
specs: |-
  - Extended Footboard (XF) with modified Contour Heel Plate
  - Solid Aluminum Direct Drive Cam
  - Single Post Casting design
  - V.E.R.T. Vertical Spring Adjustment
  - Tri-Pivot Toe Clamp (U.S. Patent No. 9240169)
  - Interlocking Delta Hinge
  - Optimized Fulcrum Geometry Linkage
  - Ultra-Precision Universal Assembly with bearings at each pivot
  - Lux Leather backpack case included
  - Finish: Polished Anodized Aluminum
