description: Fully programmable 4-track drum machine in a pedal format, with
  over 200 kits and 350 rhythms, and per-step control.
details: |-
  Step is the first fully programmable drum machine in pedal format. It is an instrument, a co-writer, an accompaniment at a live performance, or a bandmate in an empty studio. Designed with the flexibility to instantly start a unique song but with deep customization options to quickly create fresh beats.

  Step is a 4-track drum machine with a complete interface, letting you control all parameters for each of the 16 steps on the face of the pedal, with no computer editor needed. With over 2000 samples, from the sounds of classic analog machines to acoustic drums, and 350 rhythms and over 200 kits, it offers tons of combinations. You can also combine sounds from different kits to build your own sound pack.

  Customize over 15 parameters for each track's drum sound on a per-step basis, switching up hi-hat velocity, adding reverb to a final crash, or adding a chance for a drum roll. Create and play complete 16-part songs by quick-copying patterns, selecting new beats, or making your own, then assemble a playlist and go live.

  Use the FX stomp-switch to punch in customized effects from delays, reverbs, loopers, rearrangers and more, with over 50 effects across 8 categories. For live control, assign the expression pedal to parameters including tempo or volume. Step supports polymetric and polyrhythmic beats, generative drums, per-track swing, speed and length, step probability, and randomized note playback.

  Step keeps everything in sync using MIDI input and output, and its sequences are compatible with Play and Play+, so patterns can be created and exchanged between grooveboxes and the pedal in both directions.
specs: |-
  - 4 customizable drum tracks
  - 16 steps per pattern
  - Over 200 preset drum kits
  - 350 preset rhythms
  - Over 2000 samples
  - Over 15 per-step parameters per track
  - 16-pattern song mode
  - Over 50 effects across 8 categories via FX stomp-switch
  - Per-track swing, speed and length
  - Step probability and randomized note playback
  - Polymetric and polyrhythmic sequencing
  - Expression pedal input assignable to tempo or volume
  - MicroSD card storage
  - Compatible with Polyend Play and Play+ (bidirectional pattern exchange)
  - Power: 9-18 V DC / min. 500 mA (power adapter not included)
  - Height: 2.24 inches (5.7 cm) with knobs
  - Width: 7.09 inches (18.0 cm)
  - Depth: 4.72 inches (12.0 cm)
  - Weight: 2.05 pounds (0.930 kg)
