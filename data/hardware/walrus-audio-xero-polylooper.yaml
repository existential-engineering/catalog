description: The Xero Polylooper is a true bypass, dual-channel looping
  powerhouse with independent loop control on each channel, stereo panning,
  variable playback speed, reverse playback, three looping modes, and intuitive
  stomp gestures.
details: "*This item is out of stock - Check with your local dealer!* The Xero
  Polylooper is a true bypass, dual-channel looping powerhouse with independent
  loop control on each channel, stereo panning, variable playback speed, reverse
  playback, three looping modes, and intuitive stomp gestures. The Xero is your
  new partner for perpetually endless ways to create new song ideas, practice
  your licks, or build endless textures on stage. Two Loop Channels, Fully
  Independent Control Xero gives you two independent loop channels—each with its
  own: You can loop on each channel individually or stack them together to build
  complex, layered compositions—all in real time. Play Naturally. Control
  Effortlessly. The Xero's dual stomp switches keep loop control fast and
  intuitive: With built-in gestures, you stay in control without menu-diving or
  complex tap dances. Need even more control? Plug in an external dual-stomp
  switch to simultaneously take full command of both channels—perfect for live
  performers and loop-centric setups. Looping Modes Built for Any Workflow
  Switch between three flexible loop sync modes: Visual Feedback That Keeps You
  Locked In Each channel has its own multicolor LED system showing: Instantly
  know what's happening—no guesswork needed, even mid-performance. Speed FX &
  Direction Controls Want to flip your loop upside down or twist it in time?
  Activate Speed FX to unlock: Bypass That Listens The Xero features true relay
  bypass—when no loops are active, the pedal automatically disengages, keeping
  your tone completely untouched. Stereo. MIDI. USB. Ready to Integrate.
  Breakdown of Control Layout Channel 1 Channel 2 External Dual Stomp
  Compatibility • Breakout and expand stomp controls and add quicker access to
  secondary features with a TRS dual foot switch MIDI Integration Firmware
  Updates • Via USB-C using the Chrome browser on Mac or Windows • Visit
  walrusaudio.io to check for the latest firmware releases DEVELOPED WITH THE
  WALRUS MDSP MODULE FIND OUT MORE HERE"
specs: |-
  - Loop up to 3 minutes with near infinite stacking of loops
  - Unlimited overdubs
  - Volume and Pan controls
  - Playback speed (0.5x / 1x / 2x)
  - Reverse playback option
  - Tap the left stomp switch to record and playback loops
  - Hold the left stomp to undo
  - Tap the right stomp switch to stop loop playback
  - Hold the right stomp for speed FX
  - Double-press both switches to toggle channel control
  - Double-hold to trigger full stop or full erase
  - Sync Mode – Keeps all loops time-aligned to the first recorded loop
  - Unsynced Mode – Let each channel record loops of completely independent lengths
  - Poly Mode – Create polyrhythms using shared time divisions (3:4, 5:7, etc.) for interlocking textures (Supports MIDI clock for precision syncing)
  - Red, Green, and White for recording and playback controls
  - Cyan, Pink, Yellow, and Blue LEDs for different speed effects
  - Channel Control Status via dedicated red LEDs
  - Half / Normal / Double speed
  - Reverse playback - Each channel’s playback behavior can be manipulated independently, letting you remix on the fly.
  - FX activation syncs to loop start in Sync and Poly modes, ensuring accurate timing
  - 1/8” MIDI IN/THRU (Type A) for clock sync and remote control
  - USB-C for easy firmware updates via walrusaudio.io
  - Stereo in/out with full panning control on each channel
  - Compatible with Chrome on Mac or Windows for web-based updates
  - Pan 1: Stereo balance for loop playback
  - Vol 1: Channel output volume with +3dB of headroom
  - Speed: 0.5x / 1x / 2x playback speed (when Speed FX is active)
  - Direction: Forward or reverse loop playback
  - Pan 2: Independent stereo placement
  - Vol 2: Channel 2 volume with +3dB boost
  - Speed: 0.5x / 1x / 2x playback
  - Direction: Forward or reverse loop playback
  - Accepts 1/8” TRS MIDI IN (Type A)
  - Sends MIDI THRU to downstream devices
  - Supports full MIDI CC control for looping, playback, speed FX, and more
