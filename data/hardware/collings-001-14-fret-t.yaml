description: The 001 14-Fret T is a Traditional Series acoustic guitar that
  occupies a middle ground in size while offering a distinctive voice and
  character. This vintage-inspired instrument delivers a fundamental tonality
  and dry articulation with warmer high-end response. The ultra-thin lacquer
  finish and lightweight construction provide added nuance and responsiveness.
details: |-
  The 001 14-Fret T is part of the Collings Traditional Series, which focuses on vintage-inspired construction techniques and materials. The ultra-thin nitrocellulose lacquer finish and lightweight construction allow the wood to resonate more freely, providing added nuance and responsiveness.

  The instrument features a custom Traditional Series pre-war scalloped X-brace with abbreviated soundboard graft (tongue brace), a mortise and tenon hybrid neck joint, and a square peghead with ebony veneer and gold MOP Collings logo. The Traditional neck profile differs from the standard Modified V, offering a distinct feel and playability.
specs: |-
  - Top: Sitka spruce
  - Back & sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Fingerboard: Ebony with gold MOP short dots
  - Fingerboard radius: 14" - 26" compound
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cutthrough
  - Frets: Medium 18% nickel-silver
  - Tuners: Nickel Waverly
  - Body binding: Tortoise with custom wood purflings
  - Rosette: Custom wood rosette
  - Body finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
  - Scale length: 24 7/8"
  - Body width: 14 1/2"
  - Body length: 18 7/8"
  - Body depth: 4"
  - Total length: 39"
  - Nut width: 1 3/4"
  - Bracing: Custom Traditional Series pre-war scalloped X-brace
  - Neck profile: Traditional
  - Peghead: Square with ebony veneer
