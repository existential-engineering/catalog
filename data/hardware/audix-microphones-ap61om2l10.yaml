details: |-
  The AUDIX AP61 OM2 L10 is a Performance Series single-channel true diversity receiver and dual-transmitter bundle designed to deliver reliable long-range wireless audio for preachers, guest speakers, and announcers in houses of worship and live stage applications. It includes an R61 single-channel true diversity receiver, a B60 bodypack transmitter, an ADX10 cardioid condenser lavalier mic, and one H60 transmitter with an OM2 hypercardioid dynamic microphone capsule. With conveniences such as one-touch sync and auto scan, a high-contrast LCD, and 207 pre-coordinated frequencies, the bundle is easy to configure and efficient to operate. It ships with two antennas, two BNC antenna cables, an audio cable, four AA batteries, a power supply, and a rackmount kit.

  FREQUENCY RANGE
  A = 522 MHz – 554 MHz
  B = 554 MHz – 586 MHz
specs: |-
  - System: R61 single-channel true diversity receiver, dual-transmitter bundle
  - Transmitters: B60 bodypack with ADX10 cardioid condenser lavalier, and H60 with OM2 hypercardioid dynamic capsule
  - One-touch sync, auto scan, high-contrast LCD
  - 207 pre-coordinated frequencies
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - Ships with two antennas, two BNC antenna cables, audio cable, four AA batteries, power supply, rackmount kit
