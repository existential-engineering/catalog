details: |-
  The dbx PS6 is a power supply designed specifically to power PMC16 Personal Monitor Controllers. It can supply AC power for up to six separate PMC16 units simultaneously, making it ideal for touring monitor systems where multiple performers require personal monitor mixes.

  Each of the six 20-foot power cables connects to a PMC16 via a standard 12-volt DC center-negative connection. The road-worthy construction ensures reliable performance in live touring environments.

  The PS6 is designed to work exclusively with the PMC16 personal monitor controller and is an essential accessory for multi-performer monitor systems.
specs: |-
  - Power Cables Length: 20 feet each
  - Compatible Units: Up to 6 PMC16 units
  - Connection Type: 12-volt DC center-negative
