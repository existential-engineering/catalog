url: https://mackie.com/en/products/mixers/profxv3-series/ProFX16v3.html
description: 16-Channel Professional Analog Mixer with USB. Power your studio or
  live rig with award-winning Onyx preamps and a high-resolution GigFX engine.
details: |-
  Experience the best-in-class series of professional analog USB mixers with effects. The Mackie ProFX16v3 is a 16-channel mixer that brings next-level performance and versatility to recording studios and venues.

  Power your studio or live rig with award-winning Onyx preamps and a high-resolution GigFX engine. The Mackie ProFX16v3 gives you ultimate control, versatility and flexibility for multiple applications that range from studio recording to live sound reinforcement.

  With the included Waveform OEM software bundle, you'll have the ultimate plugin collection for fine-tuning your sound.
specs: |-
  - 16-channel USB mixer
  - 11 low-noise, high-headroom Onyx preamps (60dB gain)
  - 3-band EQ with On/Off hard bypass and variable mid frequency
  - Dual stereo USB return
  - Latency-free direct monitoring
  - High-resolution recording up to 192kHz via USB
  - 24 GigFX effects (reverbs, delays, choruses)
  - Built-in compression
  - Switchable Hi-Z inputs for guitars/bass
  - 100Hz low-cut filter and 48V phantom power
  - Aux/Monitor with per-channel send control
  - Dual stereo subgroup output bus
  - Headphone output with separate level and blend control
  - Dedicated control room output
  - Footswitch input for FX mute
  - Waveform OEM professional software bundle included
