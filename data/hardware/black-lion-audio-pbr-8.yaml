description: 8-slot 500-series rack with built-in fully balanced TT/Bantam patchbay
details: |-
  The PBR-8 is an 8-slot 500-series rack and power supply with a built-in fully balanced TT/Bantam patchbay on the front panel. OST (On-Slot Technology) provides individual power regulation per channel. The front-panel patchbay enables flexible signal routing without requiring modules in any fixed order, making it easy to experiment with signal chains, split signals via built-in Mults, and link modules across racks. Compact and portable, it is suited for studio and live performance use.
specs: |-
  - Format: 500-series, 8 slots
  - Power Supply: OST (On-Slot Technology) — individual regulation per channel
  - Power Per Slot: 400mA per rail (max)
  - Total Power: 1.6A per rail (1.8A non-continuous)
  - Patchbay Type: Fully balanced TT/Bantam (front panel)
