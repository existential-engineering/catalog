description: Convenient vintage-inspired 2x12" guitar speaker cabinet. The 1936V
  is loaded with two 12" Celestion G12 Vintage speakers for the warmer, more
  vintage-voiced character associated with classic Marshall stacks, and is wired
  for selectable mono or stereo operation via two 1/4" inputs. Power handling is
  140W in mono (8Ω) or 70W per side in stereo (16Ω per side). A compact
  straight-fronted alternative to Marshall's 4x12 cabinets, designed to pair
  with Marshall heads from across the range.
