description: A guitar combo amplifier for steel players, featuring a 15-inch
  speaker with chiming aluminum dome, 200 watts of power, and 9V pedal power.
details: |-
  From the day it was launched, the Steelaire simply took over the stage, immediately going on tour with Rascal Flatts, Dierks Bentley, Carrie Underwood, Brad Paisley, Darius Rucker, Randy Houser, Alan Jackson, and many more. The reason is simple, the tone we unleashed in our electric guitar products was also transformational for the steel guitar. The Steelaire combo is aimed at steel players who miss the sound of their old tube amps, but not their weight. Quilter headroom and dynamic response complement the creamy tone of the big 15" with its chiming aluminum dome. Thoughtful layout, a powerful control set, 9V pedal power, and steel-friendly features provide everything you need for massive power and glorious tone, while remaining light and nimble on stage or in the studio. Checkout our current Combo lineup here

  Specifications

  Power Output

  200 watts (400 Watts of internal headroom for maximum voltage swing)

  AC Power Req:

  100-240Vac, 50-60 Hz, 250W

  Input Connections
  INSTR-1: 1/4" mono, INSTR-2: 1/4" mono

  Speaker 1 Output:

  4 ohms, 200 W minimum rating

  Speaker 2 Output:

  4-8 ohms, 200 W minimum rating

  Dimensions:

  21" x 23" x 9" (53.4cm x 58.4cm x 22.9 cm)
