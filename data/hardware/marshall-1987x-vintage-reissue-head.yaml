description: 50W all-valve guitar amplifier head, hand built at Marshall's
  Bletchley, England factory. The 1987X is a reissue of the legendary 1970s 50W
  Plexi, lovingly crafted to replicate the tone and aesthetics of the original.
  Breaking up earlier than its 100W counterparts due to its lower wattage, the
  dual High Treble and Normal channels deliver a world of sonic character, from
  classic Marshall overdrive to glistening clean tones. Unlike the original
  1987, this two-channel reissue adds an FX loop for a modern twist.
details: |-
  This reissue plexi delivers the perfect balance of classic Marshall overdrive and glistening clean tones. Unlike the original 1987, this two-channel reissue features an additional FX loop giving it a modern twist. Designed and engineered in UK. Made in UK.

  The dual channels in the 1987X Vintage Reissue head provide an extended spectrum of tones and sounds. Each channel can be configured with distinct settings, and effortlessly transitioning between them is a smooth and simple process. This adaptability proves especially beneficial when exploring diverse genres of music.

  With the 1987X, your unique sound always shines through. Its built-in effects loop provides a seamless connection for your choice of pedals, opening the door to endless sonic possibilities.

  Made with precision in Marshall's Bletchley, England facility, the 1987X is a symbol of Marshall's belief in quality craftsmanship and timeless design. This amplifier resurrects the iconic tones of the 1970s, seamlessly transporting them into the modern day.
specs: |-
  - Model: 1987X Vintage Reissue Head
  - Range: vintage reissue
  - Channels: 2, bridgeable
  - Technology: valve
  - Output wattage: 50W
  - Outputs: 2 x 1/4-inch jack speaker outputs, selectable 16 ohm / 8 ohm / 4 ohm load
  - Inputs: 4 x 1/4-inch jack instrument inputs (high/low sensitivity)
  - Controls: Normal/Loudness II, High Treble/Loudness I, Treble, Middle, Bass, Presence
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 15.3 kg / 34 lb
  - Width: 660 mm / 26 inches
  - Height: 260 mm / 10.2 inches
  - Depth: 205 mm / 8.1 inches
  - Country of origin: designed and engineered in UK, made in UK
  - In the box: detachable power cable, speaker cable
  - Colour: Black
