description: A two-channel, balanced line/mic pad kit with selectable -10dB or
  -30dB attenuation, used to pad mic preamp output or run line-level signals
  into mic preamp inputs.
details: |-
  Get the most out of your mic preamps. Use your preamps as line-level saturation devices, or pad their output so you can drive them harder. The L2P is a two-channel, balanced line/mic pad with two attenuation options. The -10dB setting is perfect for padding the output of mic preamps so you can run them hot without clipping your converters. The -30dB setting is a "line-to-mic" pad that allows you to run tracks directly from your audio interface or mixer to the inputs of your preamps. Features:

  Specs

  Input Impedance
  8.1k/5.5k (line out / mic out)

  Output Impedance
  2.7k/150

  Attenuation
  10dB/30dB, selectable

  Noise Floor
  -113dBu/-115dBu (line out / mic out)

  Kit Contents:

  Docs
specs: |-
  - Selectable -10dB or -30dB pads
  - Two channels
  - Excellent matching between channels for stereo operation
  - Line-to-mic pad
  - Amphenol XLR jacks
  - Xicon 1% metal film resistors
  - Enclosure extruded from 6063 "architectural" aluminum
  - Anodized black finish
  - L2P Assembly Guide
  - L2P Schematic
  - L2P Attenuation amount mod
  - Getting Started With DIY
