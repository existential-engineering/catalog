  Icon Series Legacy Native plugins

  The TC1210, TC2290, TC8210 and DVR250 are premium effect plugins that will take your music and sound design to the next level. Adopted by thousands of musicians and audio engineers, our family of native plugins draws on forty years of designing the ultimate effect units and are guaranteed to take your music to the next level.

