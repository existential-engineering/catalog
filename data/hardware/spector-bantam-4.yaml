details: |-
  Spector's Bantam 4 adds a new dimension of tone to the Euro Series with it's short-scale, lightweight design. The Bantam features a carefully chambered, Alder body features a beautifully figured Quilted Maple Top, a bolt-on Maple neck with Indian Rosewood fingerboard, EMG electronics, and professional grade Spector hardware. Continuing a 40-year legacy of innovation and top-notch craftsmanship, Spector's new Bantam 4 is a short-scale powerhouse that packs a serious punch. With a 30" scale length and a carefully chambered body, the Bantam is light and extremely comfortable to play. The Bantam features the classic NS body style that is fully carved and contoured to the player's body using lightweight, chambered Alder and a gorgeous Quilted Maple top. The deep-inset bolt-on neck ensures the utmost resonance and projection, while providing an effortless playing experience with its perfectly carved neck profile and fast 22 fret Indian Rosewood fingerboard. The Bantam is loaded with two EMG 35DC pickups as well as an EMG BTS active EQ circuit, allowing for maximum versatility when paired with your favorite pedals and amp.
