description: Created with System of a Down's Shavo Odadjian, the hand-built
  UK-made SO-1200 delivers a staggering 1200 watts of bass power through dual
  600-watt sections for ultimate versatility.
details: |-
  The hand-built, UK-made SO-1200 is an artist signature bass head developed with Shavo Odadjian of System of a Down. It delivers 1200 watts through dual 600-watt sections, with a 9-band EQ, a 12AX7-driven Variable Valve Drive, a one-knob compressor and a sub-harmonic generator, spanning clean precision to crushing overdrive and deep lows. Pro connectivity includes dual Speakons, a DI out and an FX loop. All UK-built products are made to order with an approximate 20-day lead time.
specs: |-
  - Power output: 1200W (dual 600W sections)
  - 9-band EQ
  - 12AX7-driven Variable Valve Drive
  - One-knob compressor
  - Sub-harmonic generator
  - Dual Speakon outputs
  - DI output
  - FX loop
  - Hand-built in the UK, made to order
