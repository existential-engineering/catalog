description: A limited edition analog mastering equalizer produced in a run
  of 50 units, featuring a 100% analog signal path with digital control, a
  5-inch touchscreen, 399 presets, and stereo, dual-mono, and mid/side
  operation modes.
details: |-
  The Mastering Equalizer Millennium Edition is a special limited run of 50 units celebrating Bettermaker's milestone of producing 1000 units of the Mastering Equalizer. It features a 100% analog audio signal path with digitally controlled precision, combining mastering-grade analog processing with modern digital control innovation.

  The unit is operated via a 5-inch capacitive touchscreen with backlight and four encoders, supporting 399 presets with unique names, total recall, and A/B comparison. It operates in stereo, dual-mono, and mid/side modes, offering exceptional flexibility for mastering engineers.

  The filter complement includes a 12 or 24dB/oct high-pass filter (10Hz–240Hz; down to 6Hz with resonance), four stereo parametric filters with 15dB boost/cut and variable Q (0.2–7), a 12dB/oct low-pass filter (2–38kHz), and a stereo passive equalizer with extended hi-boost at 20kHz and 28kHz.

  Additional features include Frequency Search, Gain Lock, Note, Auto-Q, PEAK/RMS measurement, and an RTA analyzer. The unit communicates via USB as a HID device and integrates with DAWs through the Bettermaker Mastering Equalizer Plugin for full automation and parameter recall.

  The Millennium Edition distinguishes itself with an all-black front panel design and an upgraded switch-mode power supply for improved efficiency. The unit holds U.S. Patent No. 10,693,428 B2 for its system and method of analog device control.
specs: |-
  - 100% analog audio signal path
  - 5-inch capacitive touchscreen with backlight and four encoders
  - 399 presets with unique names, total recall, and A/B comparison
  - Stereo, dual-mono, and mid/side operation modes
  - High-pass filter: 12 or 24dB/oct, 10Hz–240Hz (6Hz with resonance)
  - Four stereo parametric filters: 15dB boost/cut, variable Q 0.2–7
  - Low-pass filter: 12dB/oct, 2–38kHz
  - Stereo passive equalizer with extended hi-boost at 20kHz and 28kHz
  - Frequency Search, Gain Lock, Note, Auto-Q functions
  - PEAK/RMS measurement and RTA analyzer
  - USB HID connectivity for MAC/PC with DAW plugin integration
  - Balanced stereo XLR input/output: 23dBu max, THD < 0.2%
  - Input impedance: 48kΩ differential
  - Output impedance: 50Ω + 50Ω electronically balanced
  - Frequency response: 20Hz–20kHz (±0.2dB)
  - Dynamic range: 102dB (+23dBu, 22kHz BW)
  - THD+N: 0.03% @ +4dBu; 0.06% @ +18dBu
  - CMRR: max 85dB @ 3kHz; min 52dB @ 20Hz
  - Crosstalk: min -100dB @ 30Hz; max -65dB @ 20kHz
  - Operating level: +4dBu
  - 2U rack enclosure, 230mm deep
  - Power: 115/230V switch, max 20W consumption
  - All-black front panel (Millennium Edition exclusive)
  - Upgraded switch-mode power supply (Millennium Edition exclusive)
  - Limited edition: 50 units only
  - U.S. Patent No. 10,693,428 B2
