details: |-
  The Custom Shop Monterey is the Monterey Rotary Fuzz Vibe in hand-finished artwork, offered in twelve different graphic designs. The design supplied is random and cannot be chosen, and each unit is hand made.

  The pedal itself is a workstation built around neo-vintage 1960s effects: a vintage voiced fuzz, a rotary speaker simulation, a vibe, harmonic and auto wah, octave up and octave down, and an expression input. Two channels can be configured for five different sounds. The right footswitch engages the fuzz channel, a classic two-transistor fuzz built around vintage Fairchild Semiconductor transistors, chosen as moderate gain devices that avoid the temperature sensitivity of germanium parts. On the modulation channel the Octave control adds an increasing octave up when turned clockwise from centre, an increasing octave down when turned counter-clockwise, and none at centre.

  The Les Rotary setting joins a lower drum and upper horn into one effect, simulating the cabinet with very short reverberated reflections for a doubling effect and a Doppler effect for a chorused sound; in this setting the Octave control sets horn volume rather than producing an octave, and with Rate off and the fuzz engaged, Depth and Octave give a speaker cabinet simulation. The Kool Vibe setting combines phasing and tremolo at key frequencies and models the pulsing of a photocell based effect. The Harmonic Wah section covers a cocked wah, an auto wah driven by pick attack, a harmonic wah centred on wah frequencies, and a conventional foot-controlled wah when an expression pedal is connected.

  An expression pedal on the EXP input controls the rate of the Les Rotary and Kool Vibe settings and the frequency in the Harmonic Wah setting. A DIP switch under the backplate swaps the order of the fuzz and modulation blocks. No expression pedal is included, and the pedal is not battery powered: it requires a standard 9V 100mA negative tip supply.
specs: |-
  - Twelve different hand-finished graphic designs, supplied at random
  - Two channels, configurable for five sounds
  - Two-transistor fuzz using vintage Fairchild Semiconductor transistors
  - Modulation side: Les Rotary speaker simulation, Kool Vibe, Harmonic Wah with auto wah and cocked wah
  - Octave control: octave up, octave down or no octave at centre, and horn volume in the rotary setting
  - Expression pedal input controls rate in the rotary and vibe settings, frequency in the wah setting
  - Internal DIP switch under the backplate swaps the fuzz and modulation order
  - Power: standard 9V 100mA negative tip supply, no battery operation
  - No expression pedal included
