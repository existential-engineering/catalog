description: The ND46 is a large-diaphragm dynamic instrument microphone with a
  supercardioid polar pattern, engineered for high-SPL on-stage instrument
  miking. Its locking pivoting head allows precise capsule placement on drums,
  guitar cabinets, and brass without repositioning the stand.
details: >-
  The ND46 is a robust, high-performance large-diaphragm dynamic microphone
  engineered for instrument miking applications. It delivers a lively and
  balanced sound character with excellent off-axis rejection thanks to its
  supercardioid polar pattern, providing strong isolation from nearby
  instruments on a crowded stage.


  A defining feature of the ND46 is its locking pivoting head, which lets the
  user angle the capsule independently of the body so the microphone can be
  positioned precisely on snare drums, toms, guitar cabinets, and brass
  instruments without repositioning the stand. The capsule is internally
  shock-mounted to reduce handling and stand-borne noise, and a humbucking coil
  rejects line hum from nearby lighting and power transformers.


  The rugged die-cast zinc body is protected by Electro-Voice's Memraflex
  grille, which resists dents and damage in heavy live-sound use. With a
  frequency response of 70 Hz to 18 kHz and a maximum SPL greater than 140 dB,
  the ND46 is well suited to loud sources where dynamic-microphone toughness is
  required.
