name: LOL
manufacturer: bastl-instruments
primaryCategory: utility
categories:
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/lol
description: LOL is a discontinued compact 2HP passive three-channel mute module
  for Eurorack with latching push buttons and LED indicators. Each of the three
  independent channels has an input jack, a latching mute button with LED, and
  an output jack. Inputs are normalized between channels, allowing use as a
  switched signal splitter.
details: |-
  2HP width, 24mm depth. Power: +12V <5mA (for LED indicators).
