  mid/side inputs and outputs.
details: |-
  DISCONTINUED

  DISENTANGLER (stylized as DIS ENTANGLER) is a 4hp mid-side encoder/decoder and stereo width processor module for Eurorack. At its simplest, DIS ENTANGLER is a compact solution for adjusting the width of a stereo signal - from a mono sum up to "double wide" (side content amplified) with the switch set to 2X. This makes it a great companion to WARP CORE or other stereo oscillators as well as a useful end-of chain mix utility for stereo voices, effects chains, and submixes. Going a level deeper, DIS ENTANGLER is also a versatile tool for creative processing of stereo signals or CV. For creative stereo audio processing, the MID and SIDE inputs and outputs allow patching out to other modules to affect either the center or edges of your stereo image with compression, ducking, filtering, or whatever else you can think of. And all the inputs and outputs are DC-coupled, enabling sum- and difference-based CV manipulation and recombination. Assembled Module and DIY Kit both include power ribbon cable and M3 mounting screws. PCB/Panel set does not include power ribbon cable or M3 mounting screws. VIDEOS
specs: |-
  - Mid/side processor with controls to attenuate/boost the SIDE decoder input level
  - Normalled routing and slider provide easy manual stereo-width adjustment of stereo voices and submixes
  - Fully analog design using high quality, low noise audio op amps
  - DC-coupled inputs and outputs for creative CV processing
  - Reverse power protection
