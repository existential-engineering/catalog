description: MicroBrute is a pure analog sonic powerhouse of a synth. Small in
  size but loaded with features.
details: |-
  No presets, no menus, nothing to get between you and the ability to sculpt your sound live. Not only does microbrute give you the means to create, perform and be completely original every time you power up, it does it with astounding sound quality. Give your modular a new lfo and envelope generator. Hook up to your DAW and make whole tracks. Hook up to your drumtracks, open your door, and play a whole gig.

  Sawtooth, pulse and triangle waves with unique modifiers. Ultra saw makes for huge sounds; metalizer adds complex harmonics to the triangle wave. Sub osc will rattle the house. Beefy filter with low pass, high pass and band pass modes. Resonance can be pushed into self-oscillation.

  Modulate the sound of the microbrute by connecting modulation sources and destinations. You can also use it to connect with external gear. With the microbrute's stackable patch cables, you get even more modulation possibilities! You get 8 sequences with up to 64 steps each to create multiple musical phrases.

  The microbrute uses 100% analog vcos. Although ours are very stable, you may sometimes need to tune your instrument. Connect your microbrute with your vintage analog gear. Process audio through microbrute; connect it to your favorite devices thanks to its audio input and output as well as MIDI input. Control microbrute from your DAW or use it as a master keyboard.
specs: |-
  - Monophonic synthesizer
  - 100% analog audio signal path
  - Steiner-parker 2-pole multimode filter (low pass, band pass, high pass)
  - Analog voltage controlled oscillator
  - Oscillator mixer (overtone, sawtooth, square, triangle, audio in)
  - Overtone sub oscillator/5th generator
  - Pulse width modulation
  - Ultrasaw generates fat sawtooth waveforms
  - Metalizer brings in extreme harmonics
  - Brute factor delivers saturation and rich harmonics
  - LFO with 3 waveforms (sine, sawtooth, square)
  - LFO can freerun or sync to arpeggiator
  - ADSR envelope generator
  - Keyboard tracking of the VCF cutoff
  - 25-note mini-key keyboard
  - Mod wheel (assignable to cutoff or LFO amount)
  - Pitch wheel (bend range selectable via software)
  - Octave selector from -3 to +2 octaves
  - External analog audio input
  - CV in jacks: pitch, filter, sub-harmonics, pulse width, metalizer, saw animator
  - CV out jacks: pitch, envelope, LFO
  - MIDI in with 5 pin din connector
  - 1/4 audio output and 1/8 headphone output
  - Full-functioned step sequencer: up to 64 steps per memory
  - Step divisions (via software)
  - Trigger modes (via software)
  - 8 sequences with up to 64 steps each
  - 12v dc 1a power supply
  - Size (mm): 60 x 325 x 221 mm
  - Size (in): 2.36 x 12.80 x 8.70 in
  - Weight (kg): 1.75 kg
  - Weight (lb): 3.86 lb
