details: |-
  Beatrix is a phaser, offering voltage control over notch frequencies, effect depth and feedback (resonance). It also offers an unusual offset control allowing the filter notches to be swept without sweeping the resonant frequency.

  Further options are provided by the phase switch, which disables the phasing sound and essentially turns the module into a resonant peak filter, and the sum switch, which inverts the filtered signal to give a different flavour of phasing.

  Beatrix will self-oscillate at high feedback if desired, though the front panel control is factory-trimmed to stop just short of self-oscillation.

  The module is 100% analogue, using discrete transistor OTAs.
specs: |-
  - 100% analogue signal path
  - Discrete transistor OTAs
  - Voltage control over notch frequency, depth and feedback
  - Offset control sweeps notches without sweeping the resonant frequency
  - Phase switch for resonant peak filter operation
  - Sum switch inverts the filtered signal
  - Feedback control factory-trimmed to stop just short of self-oscillation
