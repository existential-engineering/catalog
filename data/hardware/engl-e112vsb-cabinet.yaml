name: E112VSB
manufacturer: engl
primaryCategory: speaker
url: https://www.engl-amps.com/shop/cabinets/engl-e112vsb-cabinet/
description: Compact slanted-front 1 x 12 inch passive guitar speaker cabinet
  with a closed back, a Celestion Vintage 30 speaker, 60 W power handling and an
  8 ohm impedance, designed for low-power ENGL heads.
details: |-
  Sometimes your space is very limited, be it on stage, in the studio or in the trunk of your car. That doesn't mean your guitar sound needs to suffer, though, because the E112VSB delivers everything you need.

  It is designed especially for use with low power amp heads like the E606 Ironball, the E606SE Ironball Special Edition or the E633 Fireball 25. The cab and the aforementioned heads complement each other perfectly, in looks and sounds.

  The built-in Celestion Vintage 30 speaker offers punchy low frequencies and chimey, shimmering highs, while the solid housing, made of birch plywood, is built for eternity and 100% roadworthy.

  The slanted front and closed back are finished with a solid hand-welded metal grille, and a parallel input and thru jack allow the cabinet to be daisy chained to a second cabinet.
specs: |-
  - Slanted front
  - Closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand-welded metal grille
  - Speaker: 12 inch Celestion Vintage 30, made in UK
  - Power handling: 60 W
  - Impedance: 8 ohm
  - Passive cabinet, no mains connection
  - Dimensions: 47 x 58 x 30 cm
  - Weight: 21 kg
