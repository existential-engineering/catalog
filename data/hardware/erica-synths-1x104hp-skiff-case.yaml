details: |-
  The 1x104HP Aluminum Skiff Case with Lid is a full aluminium single row eurorack enclosure, 104HP wide and 57mm deep, built with aluminium rails of a design particular to Erica Synths.

  The case has an integrated Erica Synths PSU and ships with a 12V 3.34A 100 to 240VAC desktop supply, so the only external connection it needs is that supply's DC lead. Total current available to the installed modules is 2.5A.

  It comes with one distribution board carrying 30 connector sockets, which is what the installed modules take their power from, and with a lid for transport and storage.

  Outer dimensions are 520mm x 150mm x 150mm, with a case depth of 57mm.
specs: |-
  - 104HP single row eurorack enclosure
  - 57mm case depth
  - Full aluminium construction with aluminium rails
  - Integrated Erica Synths PSU, 2.5A total
  - 12V 3.34A 100 to 240VAC desktop PSU included
  - One distribution board with 30 connector sockets
  - Lid included
  - Dimensions 520mm x 150mm x 150mm
