description: >-
  The DK600 is an Italian programmable polysynth from the mid-1980s, also
  marketed as the Opera-6 in the UK. It features six voices with dual
  oscillators per voice (12 total DCOs), giving it a thicker sound than
  contemporary single-oscillator competitors like the Roland Juno-106 and Korg
  Poly-61. The instrument combines digitally controlled oscillators with analog
  filter circuitry and includes full MIDI implementation.
details: |-
  The DK600 represents Siel's unique Italian take on the mid-eighties programmable polysynth. Unlike the Roland Juno-106 and Korg Poly-61, which also emerged during this era as 6-voice instruments, the Siel distinguishes itself through superior sonic depth thanks to its dual oscillators per voice, creating 12 total oscillators for a thicker character.

  The instrument employs digitally controlled oscillators (DCOs), providing stable and in-tune performance while retaining analog warmth through its SSM filter circuitry. Programming prioritizes accessibility, with intuitively placed front panel controls enabling real-time manipulation without requiring deep menu diving.

  The EX600 expander module was released as a companion, featuring identical synthesis architecture but limited to external programming via DK600 transfer, MIDI sequencers, or editors. The keyboard version proved more practical due to its comprehensive control layout and velocity sensitivity across 61 keys.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCO per voice (12 total)
  - LFOs: 3
  - Filter: SSM analog with resonance and ADSR envelope
  - VCA: ADSR envelope
  - Keyboard: 61 keys, velocity-sensitive
  - Memory: 95 programs
  - Control: Full MIDI implementation
  - Date Produced: 1984-1985
