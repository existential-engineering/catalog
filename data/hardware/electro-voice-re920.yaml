description: Horn and instrument condenser microphone with TA4F connector,
  designed as a premium-grade solution for miking drums, brass, woodwinds, and
  stringed instruments through Electro-Voice and Telex bodypack transmitters.
details: >-
  The RE920TX is a small-format cardioid condenser instrument microphone built
  around a back-electret element and terminated with a TA4F mini-XLR connector
  for direct connection to Electro-Voice and Telex bodypack transmitters. The
  capsule is housed in a metal body with a non-reflecting black finish and ships
  with a custom clip mount that allows secure attachment to a range of acoustic
  and amplified instruments, making it well suited to drums, brass, woodwinds,
  and stringed instruments where a clip-on wireless solution is preferred.


  Electrically, the RE920TX presents a 1000 ohm low-impedance balanced output
  with an open-circuit sensitivity of 1.3 V and a maximum SPL of 148 dB at 1%
  THD, allowing it to handle high sound pressure sources such as brass bells and
  drum shells without overload. The microphone covers a frequency range of 80 Hz
  to 18 kHz (-3 dB) and is powered by 5 VDC supplied via the host bodypack
  transmitter. For wired applications, the same capsule can be used with the
  optional TXA XLR preamp adapter, which converts the TA4F output to a standard
  phantom-powered XLR line.
specs: |-
  - Type: Horn and instrument condenser microphone
  - Element: Back-electret condenser
  - Polar pattern: Cardioid
  - Frequency response (-3 dB): 80 Hz - 18,000 Hz
  - Maximum SPL (1% THD): 148 dB
  - Impedance: 1000 ohms, low-Z balanced
  - Open-circuit voltage: 1.3 V
  - Power requirement: 5 VDC (via optional bodypack transmitter)
  - Connector: TA4F (mini-XLR) for Electro-Voice and Telex bodypack transmitters
  - Height: 158 mm
  - Maximum diameter: 24 mm
  - Net weight: 0.54 lb (245 g)
  - Case material: Metal
  - Finish: Non-reflecting black
  - Included: Custom instrument clip
  - Optional: TXA XLR preamp adapter for wired use
