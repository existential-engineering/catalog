description: A discontinued buffer, booster, and signal enhancer pedal produced
  by JHS Pedals until early 2011.
details: |-
  If you find one on the used market snatch it up because it is a very useful unit that acts a buffer, booster and an enhancer. We stopped making the Mr Magic in early 2011 due to already having the Banana Boost and Mini Bomb Boost in our line and wanting to focus in on those pedals more to slim down clutter and confusion on what boost you should buy. One day we may release a V2 that never saw the light of day but until then no units are being produced. We see them sell on the used market for around $120 - $150 every now and then so good luck and may the magic be with you.
