description: >-
  A 30-preset monophonic analog synthesizer evolving the Pro-Soloist design with electronic
  touch-button preset selection and extensive aftertouch control routing.
details: |-
  The ARP Pro/DGX is an evolution of the Pro-Soloist, modernizing the earlier design with electronic touch-button switching for preset selection rather than the mechanical rocker switches of its predecessor. This change provided more responsive and reliable access to the instrument's 30 onboard presets.

  The preset library spans a diverse range of timbres including flute, bassoon, brass, fuzz guitar, and various other orchestral and synthetic textures. The 37-key keyboard features velocity-sensitive aftertouch that can simultaneously route to multiple parameters including volume, brilliance, vibrato, wow, growl, and bend effects, making it a highly expressive performance instrument.

  The Pro/DGX uses a revised filter architecture compared to the Pro-Soloist, with a single control labeled "Brilliance" for cutoff frequency adjustment. Some players consider this filter to sound different from the one in the original Pro-Soloist. Additional sliders provide control over volume, portamento time, and aftertouch sensitivity for further sound customization.

  Later production runs adopted ARP's signature orange-and-black cosmetic design. Notable users included Tangerine Dream and Keane, who employed the instrument for its distinctive lead tones and preset versatility.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: 1
  - Filter: 1 low-pass with brilliance control
  - Presets: 30
  - Keyboard: 37 keys with aftertouch
  - Aftertouch Routing: Volume, brilliance, vibrato, wow, growl, bend
  - Memory: Preset only (no user patches)
releaseDate: "1977"
releaseDateYearOnly: true
