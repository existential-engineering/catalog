details: |-
  The Friedman JEL 2x12 is a rear ported closed-back extension cabinet which uses tongue and groove Baltic Birch construction to deliver the bass, mid response and sound expected of a Friedman cab. The JEL 212 Cab features red tolex, white piping and black grille cloth, so it cosmetically matches the Friedman Signature Jake E Lee heads.

  At the heart of the cab is the Celestion G12M-65 Creamback, perhaps the definitive vintage Celestion ceramic magnet guitar speaker. Developed in the mid-sixties, it was quickly adopted by players like Hendrix, Beck and Page, who typified the louder and more aggressive blues-rock playing styles that came to characterize that era.

  The higher power handling of the G12M-65 produces that familiar woody tone, making the cab ideally suited when both vintage and modern tones are wanted. The increased power handling brings low-end grunt with it, complementing the warm and vocal mid-range, crunchy upper mids and sweet, refined highs.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, so every ounce of valuable tone is captured. This compact monster excels in the studio and is also a complement to a stage rig. The Friedman JEL-212 Cab is handcrafted in the U.S.A. and designed to withstand the rigors of the road.
specs: |-
  - 2 x Celestion G12M-65 12 in Creamback speakers
  - Nominal impedance: 8 ohms
  - Closed back, rear ported cabinet design
  - Tongue and groove Baltic Birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Cosmetics to match the Jake E Lee signature heads: red tolex, white piping, black grille cloth
  - Hand crafted in USA
  - Limited lifetime warranty
  - Dimensions: 12 in (D) x 30 in (W) x 20.75 in (H)
  - Weight: 58 lbs
