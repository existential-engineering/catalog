details: |-
  LIVEN Evoke is an Acoustronic synthesizer for ambient music. Featuring the Acoustronic Flux Oscillator, Grain FX, immersive reverbs, and a 4-track sequencer, it creates evolving textures, drones, and cinematic soundscapes.

  This product runs on 6 AA batteries or a LIVEN Series AC adapter. If you don't already have one, the "With PSU" option offers the best value.
