details: |-
  Experience the Manley MAHI, refined vacuum tube amplification. The Manley MAHI Monoblocks deliver full vacuum tube performance in a compact monoblock architecture optimized for high-efficiency loudspeakers. Utilizing EL84 pentodes in push-pull configuration with switchable Triode and Ultra-Linear modes, the MAHI provides exceptional transient response and dynamic articulation. Hand-assembled in California with premium components including German WBT binding posts, these monoblocks combine refined all-tube circuitry with versatile operating controls for precise system matching.

  Dual operating modes for distinct sonic presentation. The MAHI offers selectable Triode and Ultra-Linear topologies, each delivering characteristic performance attributes. Ultra-Linear mode provides 40 watts of output power with extended bandwidth and controlled damping for dynamic precision and fast transient tracking. Triode mode delivers 20 watts with enhanced midrange harmonic structure and dimensional imaging, ideal for intimate listening sessions and acoustic material. This operating flexibility enables precise tailoring of amplifier characteristics to musical content and personal preference.

  Enhanced power supply with adjustable feedback topology. The MAHI incorporates high-capacity reservoir capacitors providing 115 joules of energy storage for improved low-frequency extension and transient authority. A three-position negative feedback selector (Minimum, Standard, Maximum) offers continuously variable control over damping factor and harmonic character. Combined with the all-tube signal path, this architecture ensures exceptional dynamic range and musical engagement across extended listening sessions without listener fatigue.

  California craftsmanship with premium components throughout. Each MAHI monoblock is hand-assembled in California to Manley's exacting standards for professional audio equipment. From carefully selected EL84 output tubes to German-manufactured WBT binding posts, every component is chosen for superior sonic performance and long-term reliability. The MAHI represents precision vacuum tube engineering designed to deliver natural, uncolored musical reproduction for decades of dependable operation.
specs: |-
  - Compact monoblock design with exceptional musicality
  - Monoblock configuration ensuring complete channel isolation
  - Switchable Triode (20W) and Ultra-Linear (40W) operating modes
  - Variable negative feedback control for tonal customization
  - Hand-assembled in California with EL84 pentode output stage
  - Power Output: 20W (Triode), 40W (Ultra-Linear)
  - Tubes: 4 x EL84, 1 x 12BH7, 1 x 12AT7EH (per monoblock)
  - Negative Feedback: 3dB (MIN), 6dB (STD), 10dB (MAX)
  - Frequency Response: 20 Hz – 20 kHz (flat)
  - Input Impedance: 110 kOhm
  - Dimensions: 5″ H × 12″ W × 10″ D
  - German WBT binding posts
