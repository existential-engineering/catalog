details: |-
  The Supersonic Fuzz Gun is a completely unique take on a fuzz pedal made with the extremes of manipulation in mind. The controls interact with one another to create a huge array of gated and oscillating fuzz sounds. It can scream, it can blast, it can implode, it can doom, and it can gloom. Possible sounds vary from relatively straightforward distorted guitar to shards of total insanity. This pedal is well at home making its own howls, chirps, growls, and sputters.

  Bias biases the output transistor to change the overall sound structure. Density increases the Q range input into the fuzz while also adjusting the oscillation frequency in Osc. mode. Fuzz increases the intensity of the output. Filter sweeps the high frequencies of the output. Level controls the output volume of the effect. The Gate/Osc. toggle makes the fuzz tone more standard and gated in Gate mode, while in Oscillation mode the signal self-oscillates for noisemaking and bizarre fuzz tones.
