description: Eurorack pre-amp capable of bringing any type of audio signal to
  modular levels. Accommodates microphones (with +48V phantom power),
  instrument, and line signals with minimal distortion. Includes a trigger/gate
  extractor and an envelope follower with adjustable attack and decay.
details: |-
  The I4 Instrument Interface is a Eurorack pre-amp module designed to bring any type of audio signal up to modular levels. It accepts microphone, instrument, and line-level signals through a Neutrik combo input connector, making it a versatile front-end for a Eurorack system.

  The module includes a phantom power selector providing +48V for condenser microphones, as well as an input impedance selector to match different source types. Separate level controls for audio and envelope outputs allow precise signal management.

  An onboard envelope follower with adjustable attack and decay converts the amplitude of the incoming audio into a control voltage, suitable for driving VCAs, filters, or other modulation targets. A gate and trigger extractor with threshold control derives rhythmic gate and trigger signals from the audio input.

  The module is available both as a fully assembled unit and as a DIY kit. It is designed and assembled in Barcelona, Spain, featuring an aluminium heat-treated front panel.
