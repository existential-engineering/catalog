description: XXIV Anniversary Taiga Mod edition of the Octa Psi, with the fuzz
  circuit re-engineered through 20 component changes for a Russian fuzz voice,
  alongside the unchanged polyphonic octave and pitch shifter.
details: |-
  The XXIV Anniversary Taiga Mod is the maker's own modification of the Octa Psi, released a year after the original to mark its 24th anniversary. The fuzz circuit is reworked with 20 component changes aimed at the voice of a green Russian fuzz, giving thick mids, focused lows and more dynamic range, from saturated heaviness to a lighter overdriven tone. The pitch-shifting side is unchanged from the original Octa Psi. An XXIV anniversary insignia is printed on the jack side of the enclosure.

  The pedal puts a polyphonic pitch shifter, an octave generator and an analog transistor fuzz in one enclosure. The fuzz side is all analog, built on stacked gain stages leading to hard clipping, while the pitch side runs on digital processing.

  The pitch shifter is polyphonic with a range of plus or minus two octaves. Three modes, Up, Down and Dual, reach power chords, stacked fourths and diminished chords, a momentary mode suits dive bombs and multi-octave bends, and ramp speed is adjustable by holding Octave and turning Blend. Holding the Fuzz switch moves the octave and pitch section between latching and momentary.

  The fuzz has a three-way tone switch with Scoop, Punch and Psi settings. Holding both footswitches swaps the order of the fuzz and pitch sections, and double-tapping Blend switches the output between all wet and a wet/dry blend. The enclosure is angled aluminium, bypass is true or silent buffered at the player's choice, and the pedal is designed and manufactured in the USA.
specs: |-
  - Taiga Mod: fuzz circuit re-engineered with 20 component changes
  - XXIV anniversary insignia on the jack side of the enclosure
  - Pedal type: octave fuzz and pitch shifter
  - Effects: polyphonic pitch shifter, octave, fuzz, distortion
  - Analog fuzz circuit with digital DSP pitch processing
  - Polyphonic pitch shifter with a plus or minus two octave range
  - Three pitch modes: Up, Dual and Down
  - Momentary or latching octave and pitch, set by holding the Fuzz switch
  - Adjustable pitch ramp speed by holding Octave and turning Blend
  - Three-way fuzz tone switch: Scoop, Punch or Psi
  - Effect-order switching between fuzz and pitch by holding both footswitches
  - All-wet or wet/dry output, switched by double-tapping Blend
  - Inputs and outputs: TS 1/4 inch jacks
  - Bypass: true bypass or silent buffered bypass, user selectable
  - Power: 9 to 18V DC, 150 mA, high current supply sold separately, no battery
  - Dimensions: height 2.7 in, width 3.9 in, depth 5 in
  - Angled aluminium enclosure
  - Designed and manufactured in the USA
