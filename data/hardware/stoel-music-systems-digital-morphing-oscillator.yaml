details: |-
  The Stoel Music Systems Digital Morphing Oscillator is based on a popular digital oscillator designed by Emilie Gillet, who released it as an open-source project. We redesigned the front panel to match the look and feel of our other modules, developed a new circuit board layout, and installed the latest firmware. The software was released under the MIT license, and the original hardware design is cc-by-sa-3.0 by Emilie Gillet. Technical Specifications

