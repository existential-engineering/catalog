description: A Eurorack module providing two classic analog ring modulators with
  a switchable multiplication mode that lets the X inputs either modulate or
  multiply each other.
details: |-
  The Stoel Music Systems Dual Ring Modulator provides two classic analog ring modulators, which also feature a multiplication mode for added versatility. Depending on the front panel switch setting, the X and X inputs either modulate or multiply each other. Technical Specifications

  Width
  4 HP

  Depth
  21 mm

  Current Draw
  +12V: 8mA, -12V: 10mA, +5V: 0mA
specs: |-
  - Classic analog ring modulator
  - Features Analog Devices modulator chip
  - The module can switch between ring modulate and multiply
