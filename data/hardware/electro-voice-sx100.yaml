description: Compact 12-inch two-way passive loudspeaker for portable sound
  reinforcement, pairing a 12 in low-frequency driver with a 1.25 in DH3/2010A
  titanium compression driver on a 65 x 65 degree constant-directivity Varipath
  horn for 127 dB max SPL in a trapezoidal copolymer enclosure.
details: >-
  The SX100+ is Electro-Voice's compact 12-inch passive two-way loudspeaker,
  targeted at live sound, speech, DJ, AV, and institutional applications where
  portability and consistent coverage matter. It combines a 12 in (300 mm)
  low-frequency transducer with a 1.25 in DH3/2010A titanium compression driver
  mounted on a 65 degree by 65 degree constant-directivity Varipath horn,
  delivering 127 dB peak SPL with high speech intelligibility.


  Electro-Voice applies its Ring-Mode Decoupling (RMD) technology to reduce
  resonance artifacts in the passband. The trapezoidal enclosure is molded from
  copolymer and protected by a powder-coated steel grille, with an integral
  pole-mount socket and rigging points for permanent installation or stand
  mounting; the cabinet shape also supports use as a stage monitor.


  As a passive loudspeaker the SX100+ requires external amplification, with
  signal connected via Neutrik Speakon connectors on the rear panel. It is
  available in either black or white copolymer finishes.
specs: >-
  - Configuration: 2-way passive loudspeaker

  - LF transducer: 12 in (300 mm)

  - HF transducer: 1.25 in DH3/2010A titanium compression driver (1 in / 25 mm
  exit)

  - Horn: 65 degrees x 65 degrees constant-directivity Varipath

  - Frequency response (-10 dB): 60 Hz - 25 kHz

  - Axial sensitivity: 98 dB (1 W @ 1 m)

  - Maximum SPL: 127 dB

  - Power handling: 200 W continuous / 800 W peak

  - Nominal impedance: 8 ohms (5.6 ohms minimum)

  - Coverage pattern: 65 degrees H x 65 degrees V

  - Connectors: Neutrik Speakon

  - Enclosure: Trapezoidal copolymer

  - Grille: Powder-coated steel

  - Mounting: Integral pole-mount socket, rigging points, monitor-angle cabinet

  - Dimensions (H x W x D): 586 x 429 x 312 mm (23.1 x 16.9 x 12.3 in)

  - Net weight: 14.5 kg (32 lb)

  - Shipping weight: 15.9 kg (35 lb)

  - Finish options: Black or white
