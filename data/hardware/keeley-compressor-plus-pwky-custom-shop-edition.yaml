description: Custom Shop PWKY colorway of the Compressor Plus, an all-analogue
  compressor with expander and sustain, a Release switch for single coils or
  humbuckers, and Tone and Blend controls.
details: |-
  The Compressor Plus is the advancement of Keeley's two and four knob compressor line, offered here in the Custom Shop PWKY colorway. It adds a Release switch tuned for single coils or humbuckers, a Tone control that emphasises the harmonics most easily lost in compression, and a Blend control that retains the peaks of a performance along with the phasing of the guitar signal, keeping the frequency push and tone sweetening of the earlier compressors while handling a wider range of instruments.

  The pedal is a compressor with an expander and sustainer. As well as limiting peaks, it adds gain as notes fade out, producing sustain and bloom on held notes and bends. The Release switch eases the move between single coil and humbucker guitars: humbuckers carry more average energy, which can hold a compressor in compression longer and dull a run of notes, so a quicker release keeps attack and definition on each note.

  The Tone control is derived from the emphasis circuits used in analogue delays and other vintage effects to recover treble after the BBD line, reworked as a full tone control that adds back the highs lost in compression. The Blend control lets peaks and transients come through while sustain is added behind them, so the pedal suits subtle ambient washes and loop building as readily as funk or chicken picking, and it also works as an amp push.

  The circuit is fully analogue, true bypass, and built in the United States. It runs on 9V DC centre-negative at around 10mA, or on a battery. The design was named Reverb's best overall selling pedal of 2021.
