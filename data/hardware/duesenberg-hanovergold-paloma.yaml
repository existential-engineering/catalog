description: An exclusive, limited-edition run featuring a
  metal-particle-infused finish. This unique coating forms a delicate metallic
  layer on the instrument's surface that will age gracefully with use,
  developing a one-of-a-kind patina over time.
details: |-
  The Hanover Gold Paloma is one of three special editions in Duesenberg's limited "Hanover Gold" series, alongside the Starplayer TV and the Starplayer CBR. It is built to order and limited for 2026. The series finish is a distinctive gold paint infused with metal particles and hand-processed in multiple steps to achieve a naturally broken-in feel, with the entire back of the instrument in a high-quality matte black for contrast against the bright gold top. The specifications list the finish as PUR, Gold-Metal hand processed, and the headstock as Hanover Gold.

  Within the series the Paloma is the solidbody option, a single slab of alder that the page credits with instant response, attack, sustain and feedback resistance, against the semi-hollow Starplayer TV and the chambered mahogany Starplayer CBR. The body measures 46 x 34 cm (18" x 13.4") with sides 4.2 cm (1.7") deep, and carries a cream binding and a black pickguard.

  The neck is a set neck in one piece of maple with a Medium D shape, 42.5 mm (1.67") wide at the nut and 52 mm (2.05") at the 12th fret, with a depth of 21 mm (0.8") at the first fret and 24 mm (0.95") at the twelfth. Its Indian rosewood fingerboard has a 305 mm (12") radius, pearloid diamond inlays and 22 jumbo frets of 2.8 x 1.0 mm over a 648 mm (25.5") scale, with a steel dual-action truss rod. Duesenberg's Plek process levels the frets as the foundation for a multi-step fret polish and a hand-finished setup.

  The Paloma uses three pickups: a Duesenberg Alnico Blade Singlecoil at the neck, a Duesenberg Pearlito Singlecoil in the middle and a Duesenberg GrandVintage Humbucker at the bridge, wired to one volume, one tone and a 4-way rotary switch. Hardware comprises Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, a short-version Duesenberg Sapphire Deluxe Tremola vibrato and Duesenberg Standard strap pins that are Straplock compatible, in nickel, strung with Duesenberg Custom 010/050 strings (010-013-017-028-042-050). The Z-Tuners are made for a smooth, precise tuning feel and let the cut-off string end be hidden inside the tuner shaft.

  The instrument ships with the Duesenberg Custom Line Case as standard, a handcrafted case of classic shape and flightcase quality, along with a signed certificate of authenticity and all required allen keys. Duesenberg describes the Hanover Gold lacquer as intentionally reactive, responding to hand oils, playing contact and cleaning so that sheen, depth and patina change over time and no two examples age alike.
