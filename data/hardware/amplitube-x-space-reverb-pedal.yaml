details: >-
  Bring your perfect studio guitar sound onstage with the new amplitube x-space
  reverb pedal. This boutique pedal features 16 all-new reverb effects
  leveraging ik's latest amplitube technologies, accompanied by an exclusive
  virtual x-gear version of the exact same effects.


  Breakthrough software and hardware integration for guitarists.
  State-of-the-art dsp in a road-worthy anodized aluminum chassis. 16 different
  algorithms, 50 factory presets (300 storable presets). Iconic sounds to
  pristine, modern reverbs + spillover/trails function.


  Includes exclusive virtual x-space version for use in amplitube 5. USB port
  for preset management and use as a recording interface. Full MIDI
  implementation including control over amplitube 5. Designed and made in italy
  for a lifetime of playing and gigging.


  Amplitube x-space includes a matching virtual version for mac/pc and a copy of
  amplitube 5 se. Open any version of amplitube 5 and you'll find your virtual
  x-space pedal available as a stomp for use within the program. Adjust any of
  your pedal settings with the convenience of amplitube's award-winning workflow
  and save them as presets.


  The x-gear preset manager lets you move presets between x-gear pedals and
  amplitube and easily reorganize them on the hardware pedal. You can store up
  to 300 presets per pedal.
specs: |-
  - 16 reverb effects algorithms
  - 50 factory presets
  - 300 storable presets
  - State-of-the-art dsp
  - Anodized aluminum chassis
  - Spillover/trails function
  - USB port for preset management
  - USB recording interface capability
  - Full MIDI implementation
  - MIDI control over amplitube 5
  - Virtual x-space version for amplitube 5
  - Mac/pc compatibility
  - X-gear preset manager
