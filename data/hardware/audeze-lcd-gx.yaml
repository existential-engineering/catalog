details: |-
  The LCD-GX represents Audeze's advancement in gaming audio, merging the finest in sound quality with clear voice chat for the serious audiophile gamer by leveraging planar magnetic driver technology from their acclaimed LCD series.

  Features patented Fluxor magnets with ultra-thin Uniforce diaphragms. The 106mm drivers are approximately twice the size of competing gaming headphones, paired with an open-back design for a wider, more accurate soundstage. Construction is strictly analog with no digital processing.

  Handcrafted in California with a magnesium housing, open-cell foam ear pads, and suspension headband for extended comfort during marathon sessions. The lightweight 454g build makes it suitable for long gaming sessions.

  The detachable boom microphone is directional and noise-attenuating, with a flexible gooseneck arm for customized positioning and an integrated mute button on the cable. Two cables are included: a microphone cable with 1/8 inch TRRS connector and a braided LCD cable without microphone terminating in 1/4 inch TRS.
specs: |-
  - Style: Over-ear, open-back
  - Transducer Type: Planar Magnetic
  - Magnetic Structure: Single Fluxor magnet array
  - Phase Management: Non-Fazor
  - Magnet Type: Neodymium N50
  - Diaphragm Type: Ultra-thin Uniforce
  - Transducer Size: 106 mm
  - Maximum Power Handling: 5W RMS
  - Maximum SPL: >130dB
  - Frequency Response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 20 ohms
  - Sensitivity: 100 dB/1mW (at Drum Reference Point)
  - Minimum Power Requirement: >100mW
  - Recommended Power Level: >250mW
  - Weight: 454g
  - Cables: 8ft cable with mic (1/8 inch TRRS) and braided LCD cable without mic (1/4 inch TRS)
  - SKU: 100-GX-1020-01
