details: |-
  This Custom Shop 000-18 pairs sinker mahogany and Adirondack spruce with Authentic 1937 specs for rich, vintage-inspired tone—balanced and warm, right out of the case.

  Limited to 50 guitars, the instrument is built with Authentic 1937 construction details including a hide glue dovetail neck joint, forward shifted scalloped X bracing, and a 1930 style belly bridge with a glue-in long saddle.

  The 000-14 fret body shape, 24.9" scale length, and Authentic 1937 Barrel & Heel neck profile combine with a 1 3/4" nut width and Waverly nickel open-back tuners to deliver a feel and voice patterned after Martin's pre-war golden era. The guitar is finished in vintage gloss and ships in a ply hardshell case.

  Available only at Custom Shop Expert Dealers.
specs: |-
  - Body Size: 000-14 Fret
  - Top: Adirondack Spruce
  - Back & Sides: Sinker Mahogany
  - Neck: Genuine Mahogany
  - Neck Shape: 000-18 Authentic 1937 Barrel & Heel
  - Fingerboard: Ebony
  - Scale Length: 24.9"
  - Nut Width: 1 3/4"
  - Frets: 20 total (14th fret body join)
  - Bracing: Authentic 1937 Forward Shifted X Brace (Scalloped, 1/4")
  - Bridge: 1930 Style Belly, Ebony, Glue-in Long Saddle
  - Tuning Machines: Waverly Nickel Open Back
  - Construction: Dovetail Neck Joint - Hide Glue
  - Finish: Vintage Gloss
  - Case: Ply Hardshell
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze - Light
  - Electronics: None
  - Limited Edition: 50 guitars
