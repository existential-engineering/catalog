name: ETX-15P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/etx-15p/
description: The ETX-15P is a 15-inch two-way powered loudspeaker for
  professional portable and installed sound. A 2000 W Class D amplifier with
  integrated FIR-Drive DSP drives a 15-inch SMX2150 woofer and a DH3-B 1.25-inch
  titanium compression driver, producing up to 135 dB peak SPL with a 90 x 60
  degree coverage pattern. The 18 mm plywood enclosure with EVCoat finish
  includes eight M10 suspension points for flexible rigging, a 16 AWG steel
  grille, and balanced XLR/TRS combo inputs with an XLR link output.
details: |-
  2000 W Class D power amplifier with integrated FIR-Drive DSP

  SMX2150 15-inch (381 mm) LF woofer

  DH3-B 1.25-inch titanium HF compression driver

  Maximum SPL of 135 dB peak

  Frequency response 48 Hz - 20 kHz (-3 dB), 40 Hz - 20 kHz (-10 dB)

  Coverage pattern 90 x 60 degrees with 1.5 kHz crossover

  Eight M10 threaded suspension points for flexible rigging

  18 mm plywood enclosure with EVCoat finish

  16 AWG steel grille with powdercoat

  Two XLR/TRS combo inputs with XLR link output

  Universal switching power supply (100 - 240 V, 50 - 60 Hz)
