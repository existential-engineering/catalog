name: CDi 2|600
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-2-600
description: A 2-channel professional power amplifier delivering 600W per output
  channel with analog inputs. Part of Crown's CDi DriveCore series, designed for
  medium-sized installations such as cinema, houses of worship, bars, and
  lounges.
details: |-
  The CDi DriveCore Series is an evolution in amplification, providing an impressive mix of high-performance, rich feature set, and competitive cost. The CDi 2|600 uses technology derived from Crown's flagship DriveCore Install series and offers streamlined functionality suitable for cinema, houses of worship, bars, lounges, and similar medium-sized installations.

  DriveCore Technology eliminates hundreds of components, reducing variability and increasing reliability. The amplifier features high-level onboard DSP including input router, input delay (up to 1000ms), 8-band parametric EQ on both input and output, crossover, output delay (up to 100ms), and LevelMAX limiter. Network control and monitoring are available via HiQnet Audio Architect software over TCP/IP.

  Direct Drive 70/100Vrms output enables high-impedance applications without an external transformer. Pre-loaded JBL speaker tunings expedite installations, and a GPIO/AUX port handles preset recall, channel muting, fault monitoring, and power control.
specs: |-
  - 2 channels
  - 600W per channel @ 4Ω
  - Dual mode: 300W @ 2Ω, 600W @ 4Ω, 600W @ 8Ω, 300W @ 16Ω, 600W @ 70Vrms, 600W @ 100Vrms
  - Bridge mono: 600W @ 4Ω, 1200W @ 8Ω, 1200W @ 16Ω
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.5dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - Onboard DSP: 8-band parametric EQ, crossover, LevelMAX limiter
  - Input delay up to 1000ms, output delay up to 100ms
  - Network control via HiQnet Audio Architect (TCP/IP)
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - GPIO/AUX control port
  - Dimensions: 19" W × 3.5" H × 12.25" D (excluding 1.3" front panel protrusion)
  - Weight: 14.56 lbs (6.6 kg)
  - Power: IEC 320 inlet, 100–240V AC
  - BLU link: No
