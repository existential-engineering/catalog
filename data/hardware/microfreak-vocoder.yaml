prices:
  - amount: 460
    currency: USD
description: >
  A 16-band vocoder with accessible real-time voicing controls. A detachable
  gooseneck microphone. A slick new aesthetic. MicroFreak Vocoder Edition takes
  unhinged hybrid carnage and cranks it up a notch - sing to the tune of
  pandemonium and lose control.
details:
  - A 16-band vocoder with accessible real-time voicing controls. A detachable
    gooseneck microphone. A slick new aesthetic. Microfreak vocoder edition
    takes unhinged hybrid carnage and cranks it up a notch - sing to the tune of
    pandemonium and lose control.
  - Accurate replication of the human voice via 16 frequency bands, and an
    easy-to-use gooseneck microphone for comfortable, instant vocoding. Combine
    the vocoder mode with microfreak's wild features and manipulate your sound
    like never before. Sequence vocal melodies, modulate voice parameters with
    the lfo, and much more.
  - Process external instruments and sounds through the vocoder mode for unique
    formant textures - simply connect to the headphone input via 3.5mm trrs. A
    gooseneck design means quick position adjustment, with easy connection
    straight into the headphone socket. The fitting also allows you to connect
    headphones at the same time. The utility menu lets you set your preferred
    mic gain and noise gate settings.
  - We've created an entirely new mode to harness the vocoder's 16-band power.
    The vocoder engine features 3 waveforms - sawtooth, pulse width and noise -
    while the timbre and shape knobs adjust the 16 frequency bands to twist and
    transform your voice. 16 new presets give you instant access to android
    translations, crystalline harmonies and vibrant formant sequences galore.
  - Behind the revamped appearance and microphone attachment is the same lovable
    maniac that set the synth world spinning. Sparkling digital and wavetable
    oscillators collide with velvety analog filters. A unique poly-aftertouch
    pcb keyboard combines with a distinctly freaky arpeggiator & sequencer.
    Bathe your mix in sonic hysterics with the erratic mod matrix or the unique
    spice & dice randomizers.
specs:
