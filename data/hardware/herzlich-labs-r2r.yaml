description: The R2R is a passive 8-bit R2R ladder DAC that converts eight
  digital signals into one analog output, and can also be used as a weighted
  mixer or fixed attenuator.
details: |-
  An 8-bit DAC for all your 8-bit DAC needs! It's simple. 8 digital signals go in - one analog signal comes out. Why do you have 8 digital signals in your Eurorack system? 8 gate signals? 8 trigger signals? I don't know, okay, and listen, I'm not here to judge either. The R2R is a classic R2R ladder DAC, that does what a ladder DAC does: DAC ladderly. What more does it do, you ask? Well, why not use it as a weighted mixer, where the inputs are increasingly attenuated, or perhaps as a fixed setting attenuator? The R2R is not particularly concerned about what you use as input or output, so you can also just experiment and see in what wonderful direction this will take you (probably somewhere cool). Best of all? It's 3hp, so you can fill an odd-sized gap in your rack, with no regard for power draw.
specs: |-
  - Precision 8-bit ladder DAC
  - Input digital signals, receive an analog output
  - Use it as a mixer, attenuator or experimental apparatus
  - High grade component selection and all-analog architecture
  - Low-profile passive design fits anywhere and draws no power
