description: Erica Synths in cooperation with the Liquid Sky Artistcollective
  presents the new Dada Noise System II - a modular synth-lab which is dedicated
  to create all kind of abstract organic analog noise / ambient soundscapes /
  industrial noise / bad ass bass / spheric atmospheres / experimental unheard
  drones / sonic glitches and of course all kind of thrilling horror- and
  scifi-sounds for the professionals. Every single module of the system is
  already a sound source of its own, therefore the possibilities for sound-,
  noise- and atmo-experiments are endless.
details: |-
  The Dada Noise System II is Erica Synths' 2021 take and reflection on dada, made to render chaos, noise, randomness and insanity controllable and playable. In chaos it all started, in chaos it will end.

  The system comes with vertical side panels and an external PSU. The additional Quadraphonic Surround Panner (sold separately) makes it a tool for film postproduction, installation works, game sound design or quadraphonic performances.

  Dada was one of the most important art, film, design, music and performance movements of the last century. Over 100 years ago the dada multimedia artists were changing the world forever and still have impact on the scene today.

  The system is built from Fusion VCO2, Fusion VCF3 and Fusion Modulator alongside Black Stereo Delay, Black Joystick2, Black VC Clock, Black Modulator, Black Dual VCF, Black Quad VCA, Black Spring Reverb and Black Output, and it ships with 25 patch cables.

  Black Joystick2 is one of the main elements of the Dada Noise System II, allowing automations in sound and effects, positioning in the quadraphonic room, or functioning as an experimental sequencer and sound source.
