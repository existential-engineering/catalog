description: The ZSG-1 is an on-camera shotgun microphone designed for creators
  to elevate their audio. It is lightweight and highly directional, providing
  sound in a variety of content capture scenarios.
details: |-
  The ZSG-1 is a mono shotgun microphone built for on-camera use. It mounts to a camera hot shoe through the supplied shock mount and feeds the camera over a 3.5 mm cable, so the audio lands on the video file rather than needing a separate recorder and a sync pass afterwards.

  The capsule is a back electret condenser with a 14 mm diaphragm in a super-cardioid pattern. Off-axis rejection and a frequency response tailored for speech are what the interference tube buys: sources in front of the microphone come through while room and street noise arriving from the sides is attenuated, which suits dialogue capture and sound effects recording.

  The same 3.5 mm output works into a phone, so the microphone also serves mobile video where the handset's own microphones fall short of its camera. Used off the camera it mounts to a boom pole or a pistol grip and runs into a field recorder.

  Frequency range is 50 Hz to 20 kHz, sensitivity is -31 plus or minus 2 dBV/Pa, maximum sound pressure level is 118 dB SPL at 1 kHz with THD of 1 percent or less, equivalent input noise is below 24 dB SPL A-weighted, and the signal to noise ratio is 70 dB. Output impedance is 2.2 kilohms on a stereo mini connector.

  The microphone body is 22.6 mm in diameter and 177 mm long and weighs 40 g, which keeps a camera rig light and a gimbal in balance. There is no battery and no switch for one: power arrives as plug-in power at 2 to 5 V from the camera, phone or recorder on the other end of the cable. The box holds the microphone, an SMM-3 shock mount designed to cut handling noise and vibration, a WSM-3 windscreen and a 3.5 mm stereo mini cable.
