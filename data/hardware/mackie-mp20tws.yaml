description: True Wireless Dual-Driver Earbuds with Active Noise Cancelling.
details: |-
  Combining the latest true wireless stereo technology, a premium dual-driver design, and hybrid active noise cancelling, MP-20TWS earbuds deliver breathtaking sound and versatility on the go.

  With MP-20TWS, you can experience decades of acoustic design experience anywhere. Highs are crisp and articulate, mids are clear, and bass is massive without sounding muddy thanks to a hybrid dual driver design.

  With MIS Hybrid Active Noise Cancelling, you can be completely immersed in your music.
specs: |-
  - Hybrid dual driver design (Knowles balanced armature + custom dynamic drivers)
  - MIS Hybrid Active Noise Cancelling
  - Bluetooth 5.2
  - Three Knowles SiSonic mics per side
  - IPX4 waterproof rating
  - Capacitive touch controls
  - Siri and Google Assistant compatible
  - 13+ hours battery life
  - Wireless charging case (40+ additional hours)
  - USB-C fast charging
  - Three ear tip sizes included
