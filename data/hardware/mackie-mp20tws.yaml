description: Combining the latest true wireless stereo technology, a premium
  dual-driver design, and hybrid active noise cancelling, MP-20TWS earbuds
  deliver breathtaking sound and versatility on the go.
details: |-
  From massive stages to recording studios, Mackie creates gear for professionals that demand the best sound quality, and MP-20TWS applies that acoustic design experience to true wireless earbuds. Highs are crisp and articulate, mids are clear, and bass is massive without sounding muddy thanks to a hybrid dual driver design. With MIS Hybrid Active Noise Cancelling, you can be completely immersed in your music.

  Hybrid Dual Driver

  MP-20TWS delivers clarity, imaging, and faithful reproduction thanks to a custom dual driver design featuring a Knowles balanced armature driver for mids and highs combined with a dynamic driver for low frequencies. The leader in earphone driver design for decades, Knowles balanced armature drivers are among the best there is when it comes to sound quality, accuracy, and reliability.

  MIS Hybrid Active Noise Cancelling

  This proprietary noise cancelling features a wider response than typical designs. Targeting a wider frequency range makes it possible to block even more noise and rumble for a greater level of immersion in your music. Multiple onboard microphones and conforming silicone eartips ensure consistent performance and maximum noise reduction.

  Everyday Use

  Bluetooth 5.2 handles high-fidelity, low-latency streaming, capacitive touch controls sit on each earbud, and the earbuds carry an IPX4 waterproof rating. Battery life is 13+ hours, with the included wireless charging case adding 40+ more hours of playtime and USB-C fast charging.
specs: |-
  - Hybrid dual driver utilizes Knowles balanced armature and custom dynamic drivers
  - MIS Hybrid active noise cancelling
  - Bluetooth 5.2 for high-fidelity, low-latency streaming
  - Three Knowles SiSonic mics per side for optimal noise cancelling and call quality
  - IPX4 waterproof rating
  - Capacitive touch controls
  - Compatible with Siri, Google
  - 13+ hours of battery life
  - Included wireless charging case adds 40+ more hours of playtime
  - USB-C fast charging
  - Three different sizes of included ear tips
