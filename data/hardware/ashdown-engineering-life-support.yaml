description: The Life Support is a guitar compressor/sustainer pedal from
  Ashdown's Dr Green range. An Input control sets how much signal the pedal
  processes after the compression ratio is set, and a simple Output control sets
  the level sent on to the amp, ranging from a subtle evening-out of tone to
  highly squashed, everlasting sustain. It features true bypass switching in a
  custom-designed steel casing built to withstand repeated stomping.
details: |-
  Guitar compressor/sustainer pedal from the Ashdown Dr Green range. The Input control drives the amount of signal the pedal automatically processes after the ratio is set; a simple Output pot sets the level sent to the amp. Delivers anything from a subtle evening-out of tone to highly squashed, everlasting sustain. True bypass switching. Custom-designed steel casing built to stand up to repeated stomping.
specs: |-
  - Compressor / sustainer pedal
  - Input (signal drive) control
  - Ratio control
  - Output level control
  - True bypass switching
  - Custom steel casing
