url: https://www.engl-amps.com/shop/heads/engl-e633bo-fireball-25-blackout/
description: All-black edition of the 25-watt, two-channel all-tube Fireball
  guitar amplifier head, with a tube-buffered serial FX loop, noise gate and
  Powersoak.
details: |-
  The Fireball has long been a benchmark for high-gain guitar tone. ENGL Amplifiers introduces the Fireball Blackout Series, a striking new all-black edition of one of its most iconic amplifiers.

  Combining the Fireball sound with a bold new aesthetic, the Blackout Series delivers the tight low end, cutting mids, and articulate high-gain performance that have made the Fireball a favorite among guitarists worldwide.

  Hand-crafted in Germany and built to ENGL's standards, the Fireball Blackout Series is designed for players who demand both exceptional tone and unmistakable style.

  The amp carries two channels, clean and lead, with gain per channel, a three-band EQ, presence and master controls, plus rear-panel Powersoak and noise-gate threshold controls and a Mid Boost sound-shaping option.
specs: |-
  - Two channels: Clean, Lead
  - All Tube 25 W
  - Tube buffered serial FX Loop
  - Noise gate
  - Dual footswitch jack for ENGL Z4
  - Made in Germany
  - Controls: Gain (per channel), Bass, Middle, Treble, Lead Volume, Presence, Master
  - Rear controls: Powersoak (Full/Mid/Low Power, Speaker Off), Noise Gate threshold level
  - Sound shaping option: Mid Boost
  - Speaker outputs: 1 x 8-16 ohm or 2 x 16 ohm
  - Line output
  - Preamp tubes: 4 x ECC83 (12AX7)
  - Power amp tubes: 2 x 6L6
  - Output wattage: 25 W
  - Dimensions: 23 x 42 x 20 cm
  - Weight: 11 kg
