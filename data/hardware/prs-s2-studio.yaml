details: |-
  The PRS S2 Studio blends vintage inspiration with modern flexibility, delivering an impressive range of tones through its distinctive single-single-hum configuration. Featuring two proprietary PRS Narrowfield DD pickups in the bass and middle positions and a 58/15 LT humbucker in the treble position, the S2 Studio offers a dynamic palette of sounds—from punchy single-coil clarity to warm, vocal humbucker tones. The 5-way blade switch and push/pull tone control unlock a wide range of sonic possibilities, making this guitar an ideal choice for players who demand versatility without compromising character.

  Crafted with a maple top and mahogany back, the S2 Studio resonates with a balanced, articulate voice that responds beautifully to nuanced playing styles. Its 22-fret, 25” scale length Pattern Regular mahogany neck with a rosewood fretboard ensures a comfortable and confident playing experience, enhanced by PRS’s iconic bird inlays. Anchored by the PRS patented tremolo and S2 locking tuners, the S2 Studio delivers stability and precision whether you’re exploring subtle textures or pushing the limits on stage.

  With its adaptable sonic range and refined craftsmanship, the PRS S2 Studio offers a fresh take on classic tones, making it a standout choice for players who need one guitar to do it all.
