description: A wireless Bluetooth transceiver that connects to external
  piezo-operated triggers with adjustable sensitivity, allowing drummers and
  percussionists to send app, MIDI, and DAW commands.
details: |-
  Wireless controller for piezo-operated triggers - now with adjustable switch sensitivity! Featuring inputs for piezo-operated switches with adjustable sensitivity, the AirTurn TAP Transceiver is an excellent choice for drummers and percussionists. Use with your own triggers to integrate wireless technology into your kit. Product Weight: 2 oz (.056kg)

  Product Dimensions: 2.25x 2.75x.625 in (57x70 x16mm)

  Download PDF | Explore Apps for iPad, iPhone, Android, Mac & PC | Product Manual

  MIDI mode not compatible with Bluetooth Dongle devices. Wireless Page Turner for Drummers and Percussionists

  Turning pages has never been easier for drummers! The AirTurn TAP seamlessly blends into your kit or percussion setup for smooth page turning with the strike of a stick or tap of the finger! Depending on what app or software you choose, you can do more than turning pages. You can scroll lyrics and tabs, start and stop back tracks, start and stop a metronome and much more. The AirTurn TAP is the professional choice for taking control of your tablet or computer. Impact Trigger For DAW Control

  The perfect trigger for Digital Audio Workstation control. Using our free customization app, AirTurn Manager, assign your favorite hotkeys and keyboard shortcuts for easy recording and editing control. Arm tracks, play and pause, start and stop recording, toggle metronome, undo actions, mute tracks, and anything else your computer keyboard can do! The TAP is completely customizable for keystrokes, shortcuts, switching types, MIDI, and so much more! Bluetooth MIDI Trigger

  Trigger clips and samples, start and stop loops, change presets, toggle effects, and more! Assign any MIDI CC, Program Change, or Note to each switch with any value. Adjust a full range of settings: MIDI Commands and Notes, Auto-Repeat, Idle Time, Low Power or Fast Response Mode, Debounce, and Switch Types. Switches may be defined as Momentary, Latching, Pulse or Command.
specs: |-
  - Trigger backing tracks and effects
  - Start and stop metronomes
  - Send custom DAW and MIDI commands
  - Record video and take action photos
  - Turn pages, read music, scroll lyrics, tabs, and more!
  - Endless Apps: Hundreds of compatible apps for triggering backing tracks and effects, controlling metronomes, sending MIDI commands, cueing audio and lighting, capturing photo and video, turning pages, teleprompting, reading music, scrolling lyrics and tabs, plus so much more!
  - App Control: Seven built-in modes store switch commands that work with hundreds of apps including those supported with AirDirect.
  - Customize: Create commands for almost any app that responds to keystrokes, macros, mouse clicks, or MIDI with the free AirTurn Manager. Adjust features such as Auto-Repeat, Idle Time, Low Power or Fast Response Mode, and Debounce. Select switch types such as Momentary, Latching, Pulse, or Command.
  - Updates: AirTurn Manager supports Over-the-Air updates to firmware for the latest features.
  - Innovative: May be used with external piezo triggers, such as the Roland BT-1 for a fast and reliable response.
  - Versatile: Mounts to 1" diameter poles using a side mount clamp.
  - Portable: Lightweight and durable construction allows you to throw it in your gear bag and go.
  - Max Range: At 200+ feet, AirTurn leads the industry's operating range.
  - Max Battery Life: Rechargeable battery provides 200+ hours of play time with a single charge, displays status indicators, and automatically turns off when the host device is turned off.
  - Status Indicators: Bluetooth status LED. Low battery status LED.
  - Pairing Options: Choose open pairing for instant connections when switching between devices. Choose closed pairing to store a single connection and prevent unintended connection to other devices.
  - Multiple Devices: Connect up to eight AirTurn devices to use at the same time for more switch options.
  - Flexible Use: Can be attached or stashed just about anywhere.
  - Compatibility: Works with phones, tablets, and computers that have Bluetooth 4 or higher, and accepts nearly any momentary switch.
  - Warranty: Best-in-class 2-year warranty with product registration (includes battery).
