description: |-
  More than a high-performance loudspeaker, the LS50 Wireless II is an
  all-in-one speaker system that streams from any source via AirPlay 2,
  Google Cast and more, plus wired connections for TV, games console and
  turntable.
specs: |-
  - Uni-Q Driver Array with Metamaterial Absorption Technology (MAT)
  - 130mm aluminium LF cone
  - 25mm vented aluminium dome HF driver
  - LF amplifier: Class D, 280W
  - HF amplifier: Class AB, 100W
  - Max SPL: 108dB at 1m
  - Frequency response: 45 Hz – 28 kHz (±3dB @ 85dB/1m)
  - Dimensions per speaker (HWD): 305 × 200 × 311 mm (12 × 7.9 × 12.2 in.)
  - Weight per set: 20.1 kg (44.3 lbs)
  - AirPlay 2, Google Cast, Roon Ready, UPnP, Bluetooth 5.0
  - Spotify Connect, Tidal Connect, Amazon Music, Qobuz, Deezer
