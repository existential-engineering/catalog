description: >-
  The Siel Mono is an Italian analog monophonic synthesizer released in 1980 that combines
  preset and subtractive synthesis capabilities. It features a single DCO with a
  slider-based interface offering both ten orchestral presets and a free mode for basic
  waveform programming. Despite its simple architecture, the instrument is noted for its
  warm sonic character and ease of use.
details: |-
  The Siel Mono is a monophonic analog synthesizer produced by the Italian manufacturer Siel in 1980. It uses a simple row of sliders for adjusting all of its parameters, though the panel layout is unconventional compared to a traditional signal flow arrangement. Controls are distributed across the panel rather than organized sequentially, with the ADSR on the left and oscillators on the right. A signal flow diagram appears above the controls but does not align with their physical layout.

    The instrument operates in two modes. Preset mode offers ten orchestral sounds including Basso Tuba, Trombone, Trumpet, Flute, Piccolo, Sax, Clarinet, Violin, Bass, and Guitar. LEDs indicate which sections are editable for each preset. Free mode provides access to basic waveforms including sawtooth and square waves for more traditional subtractive synthesis programming.

    The Mono is pre-MIDI and lacks any CV/gate interfaces, which limits its integration with external sequencers or other gear. There is no user memory for storing custom patches. Despite these limitations, the synthesizer has a warm, distinctly Italian flavor that gives it a unique sonic character among monophonic instruments of its era.
specs: |-
  - Polyphony: Monophonic
    - Oscillators: 1 DCO with noise generator
    - Waveforms: Sawtooth, Square (in Free mode)
    - Filter: 1 VCF with Lowpass, Bandpass, and Highpass modes, ADSR envelope
    - Amplifier: 1 VCA with ADSR envelope
    - LFO: 1 sinusoidal, rate and depth control, assignable to DCO or VCF
    - Keyboard: 37 keys, no velocity sensitivity
    - Memory: 10 presets, no user storage
    - Control: No MIDI, no CV/gate
    - Year Produced: 1980
releaseDate: "1980"
