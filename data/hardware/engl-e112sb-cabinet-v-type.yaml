details: |-
  The E112SB with Celestion V-Type is a compact 1 x 12 inch cabinet built for guitarists who want portability without giving up tone. It builds on the established ENGL 1 x 12 platform and swaps in the Celestion V-Type speaker for a balanced sound that sits between classic warmth and modern clarity.

  The V-Type speaker covers a dynamic tonal range with smooth mids, an open top end and tight lows, which suits rock, blues and modern styles. The closed-back birch plywood construction is rugged and adds low-end response.

  Power handling is 70 watts at 8 Ohm, so the cabinet works as a standalone cab for a valve amplifier or as an extension for a combo. At around 13 kg it is light enough to move between rehearsal rooms, studios and stages.
specs: |-
  - 1 x 12 inch Celestion V-Type speaker
  - Power handling: 70 W
  - Impedance: 8 Ohm
  - Closed-back, rugged birch plywood construction
  - Passive cabinet, no mains power connection
  - Dimensions: 44 x 49 x 25 cm
  - Weight: 13 kg
