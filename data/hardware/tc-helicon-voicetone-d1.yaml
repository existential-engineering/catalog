url: https://www.tchelicon.com/en/products/0726-abj
description: Single-button vocal stompbox that adds two doubled voices to a lead
  vocal, with one knob setting the doubling from tight unison thickening to
  looser detuning. Patches between microphone and PA over XLR.
details: |-
  The VoiceTone D1 is a single-purpose vocal doubling pedal that adds a studio-style second voice to a lead vocal. One footswitch engages two tuned doubles with slight timing and pitch variation, so the result resembles a tracked overdub rather than a chorus effect.

  A single front-panel knob sets the doubling intensity, running from tight unison thickening to looser detuning. Adaptive Tone processing works alongside the doubles to keep the lead vocal clear and present when the doubling is at full depth.

  Connections are an XLR input and an XLR output, with 48V phantom power for condenser microphones and true bypass. The pedal runs from a standard 9V supply and is sized to sit at the front of a vocalist's pedalboard.
specs: |-
  - Single footswitch engages two vocal doubles
  - One knob sets doubling intensity, from tight unison thickening to looser detuning
  - Adaptive Tone processing on the lead vocal
  - 48V phantom power for condenser microphones
  - True bypass
  - Powered by a standard 9V DC supply
