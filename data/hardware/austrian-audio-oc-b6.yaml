details: |-
  The OC-B6 is the world's first purpose-built large-diaphragm condenser kick drum microphone, using the CKR6-B 1" condenser capsule. Its 220° swivel head enables flexible positioning — inside the shell, at the port, or outside — with an integrated stand thread that eliminates the need for microphone clips.

  Discrete electronics ensure fast transient response, handling maximum SPL of 170 dB without distortion. A 25 Hz subsonic filter reduces low-frequency rumble. No pre-EQ — just pure, uncolored kick drum tone.

  Handcrafted in Vienna, Austria.
specs: |-
  - Frequency Range: 18 Hz – 20 kHz
  - Maximum SPL: 170 dB
  - Sensitivity: 0.8 mV/Pa
  - Impedance: 108 Ω
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 2.2 mA)
  - Connector: XLR 3-pin
  - Capsule: CKR6-B (1" large-diaphragm condenser)
  - Swivel head rotation: 220°
  - Subsonic filter: 25 Hz
  - Dimensions: 92 × 82 × 57 mm
  - Weight: 280g
