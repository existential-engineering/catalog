details: |-
  Mercury7 is Meris's flagship reverb design, inspired by the 1982 Blade Runner film soundtrack. The 500 series format accommodates the highest quality signal path available in pro audio, and entirely custom algorithms take the unit to the apex of ambient exploration.

  Featuring precision balanced I/O, higher headroom, per channel discrete processing and best in class signal to noise, Mercury7 holds two handcrafted algorithmic reverbs: Ultraplate, an inspiring and lush plate reverb with a fast build, and Cathedra, a massive and ethereal algorithm with a slow build.

  The intra-tank pitch vector lets the decaying signal shift in pitch, from an octave down to an octave up, while high and low frequency damping and extensive modulation shape the character of each space, with a variable auto swell envelope for creating evolving textures.
specs: |-
  - Handcrafted Algorithmic Reverbs
  - Analog Mix and Dry Signal Path
  - Intra-Tank Pitch Regeneration
  - High and Low Frequency Damping
  - Extensive Modulation Capability
  - Variable Auto Swell Envelope
  - Premium analog signal path and 24-bit AD/DA with 32-bit floating point DSP
  - Stereo and Surround Linkable
  - Designed and Built in California, U.S.A.
  - -116 dB Signal to Noise Ratio (typical)
  - Burr-Brown precision balanced input and output drivers
  - 100% Analog bypass
