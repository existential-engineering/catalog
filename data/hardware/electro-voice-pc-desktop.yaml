description: The PC Desktop is a PolarChoice multi-pattern condenser microphone
  built into a free-standing tabletop unit with a dual-section gooseneck and a
  sturdy steel base. A switch on the capsule lets the operator select between
  omnidirectional, cardioid, supercardioid, and hypercardioid polar patterns to
  suit a range of conferencing, broadcast, or installed-sound conditions. A
  programmable mute switch with LED can be configured as push-on/off or
  push-to-mute, a switchable high-pass filter tames low-frequency rumble, and
  the dual back-electret condenser elements deliver smooth, uniform response in
  all patterns. Frequency response of 50 Hz - 20,000 Hz, balanced low-Z output
  via 3-pin XLR, and standard 12-52 VDC phantom power. Available in 12-inch and
  18-inch gooseneck lengths.
details: >-
  PolarChoice switchable polar patterns: omni, cardioid, supercardioid,
  hypercardioid


  Dual-section gooseneck on a sturdy steel base for free-standing tabletop use


  Available in 12-inch or 18-inch gooseneck configurations


  Programmable mute switch with LED (push on/off or push-to-mute)


  Switchable high-pass filter for low-frequency rolloff


  Smooth, uniform frequency response across all polar patterns


  Frequency response 50 Hz - 20,000 Hz (-3 dB)


  Dual back-electret condenser elements


  Balanced low-Z output via 3-pin XLR


  Requires 12 - 52 VDC phantom power


  Non-reflective camera-black finish on steel housing
