details: |-
  Perfectly suited to medium size control rooms and edit suites for all speech and music reproduction, the matt-grey finish Monitor 30.1 strikes an optimal balance between size and performance. They can be mounted on floor stands, hung from the ceiling or sat atop the control desk, they are unfussy about positioning.

  Sound on Sound magazine covers how the Monitor 30.1 is used in the making of Later with Jools Holland, and Harbeth's Monitor 30.1s are used at Fountain Studios, home to major TV series.
specs: |-
  - Technical features: 110mm Harbeth RADIAL2 bass/mid, 19mm ferrofluid-cooled tweeter
  - Frequency response: 50Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms, easy to drive
  - Sensitivity: 85dB/1W/1m
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W/channel
  - Power handling: 150W programme
  - Dimensions: 460 x 277 x 275 mm
  - Connectors: SpeakON pro 2-pole socket or binding posts
  - Weight: 11.5kg each, unpacked
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with tweeters (tweeter 320mm up from cabinet base)
  - Packing: single speaker per protective carton
  - Grille colour: professional matte grey
