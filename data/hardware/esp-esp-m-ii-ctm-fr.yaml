details: |-
  All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan.

  The ESP M-II CTM FR comes in this luxurious ESP exclusive Black Aqua C-Burst finish over its solid flamed maple top, with natural masked binding on the body and headstock. It's built with set-thru construction at 25.5" scale, allowing smooth, unfettered access to the highest frets, and pairing an Honduran mahogany body to a three-piece maple neck.

  Its ebony fingerboard features offset bar inlays, Luminlay side dots, a reverse matching-finish headstock, and 24 extra-jumbo stainless steel frets.

  Only the finest components are chosen for a guitar of this level of quality, and include black nickel hardware, ESP strap locks, Gotoh locking tuners, a Floyd Rose Original double-locking tremolo bridge, and a set of EMG 57-TW (bridge) and EMG 66-TW (neck) dual mode active pickups with brushed black chrome covers, delivering everything from balanced, creamy smooth tones to aggressive, in-your-face punch, with both pickups switchable to single-coil mode via push-pull control.

  Includes a deluxe ESP form fit case.
