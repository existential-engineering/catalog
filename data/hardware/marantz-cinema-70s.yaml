description: |-
  The Cinema 70s is a slimline 7.2 channel AV receiver powered by HEOS with Dolby Atmos, 50W per channel, 8K video support, and 6 HDMI inputs. Its highly compact slimline design makes it possible to install theaters in places where equipment cannot occupy large amounts of space, delivering refined surround sound performance in a compact chassis where traditional AV receivers won't fit.

  Built on Marantz's heritage, the unit is designed with timeless style and engineered for utmost performance as part of the CINEMA Series foundation. The receiver provides immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics with careful Sound Master tuning that emphasizes the Most Musical Sound in your home. It supports modern immersive audio formats and an all-new HD graphical user interface with integrated HEOS streaming capabilities for multi-room audio distribution.
details: |-
  CINEMA 70s features a highly compact slimline design, making it possible to install theaters in places where equipment cannot occupy large amounts of space. With support for modern immersive audio formats and an all-new HD graphical user interface, it delivers refined surround sound performance in a compact chassis where traditional AV receivers will not fit.

  At 4.3 inches high without its antennas, CINEMA 70s drives seven channels at 50 watts each while keeping the iconic Marantz porthole display and symmetrical front panel.

  Immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics are legendary hallmarks of Marantz sound, and the Marantz Sound Master tuned CINEMA 70s with careful parts selection.

  CINEMA 70s comes replete with the latest immersive audio formats, 8K video, room optimization and streaming. Six HDMI inputs, a 7.2-channel pre-out, phono (MM), coaxial and optical digital inputs and a Zone 2 pre-out cover the system.
specs: |-
  - 7 powered channels, 50 W per channel (8 ohm, 20 Hz - 20 kHz, 0.08% THD, 2ch driven)
  - 70 W per channel (6 ohm, 1 kHz, 0.7% THD, 2ch driven), 100 W (6 ohm, 1 kHz, 10% THD, 1ch driven)
  - 7.2-channel pre-out with two subwoofer outputs
  - Class A/B discrete power amplifier, assignable bi-amp drive
  - Seven speaker terminals, 4-16 ohm impedance
  - Six HDMI inputs (three 8K) and one HDMI output with ARC and eARC, HDCP 2.3
  - Dolby Atmos, Dolby Vision and DTS:X immersive audio and video formats
  - Audyssey MultEQ XT with Dynamic EQ and Dynamic Volume
  - HEOS built-in, AirPlay 2, Spotify Connect, Bluetooth with headphone retransmit
  - Zone 2 pre-out, DC trigger out, IR flasher in and Marantz Remote Bus
  - Slimline chassis 17.4 x 14.7 x 4.3 in. without antenna, weight 19.2 lbs.
  - Power consumption 250 W, standby 0.2 W
