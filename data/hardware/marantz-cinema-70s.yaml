id: N-mPXkCDAgFRHC70I-bbK
name: Cinema 70s
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/av-receivers/cinema-70s/300619.html
description: |-
  The Cinema 70s is a slimline 7.2 channel AV receiver powered by HEOS with Dolby Atmos, 50W per channel, 8K video support, and 6 HDMI inputs. Its highly compact slimline design makes it possible to install theaters in places where equipment cannot occupy large amounts of space, delivering refined surround sound performance in a compact chassis where traditional AV receivers won't fit.

  Built on Marantz's heritage, the unit is designed with timeless style and engineered for utmost performance as part of the CINEMA Series foundation. The receiver provides immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics with careful Sound Master tuning that emphasizes the Most Musical Sound in your home. It supports modern immersive audio formats and an all-new HD graphical user interface with integrated HEOS streaming capabilities for multi-room audio distribution.
details: |-
  The Cinema 70s is a slimline 7.2 channel AV receiver powered by HEOS with Dolby Atmos, 50W per channel, 8K video support, and 6 HDMI inputs. Its highly compact slimline design makes it possible to install theaters in places where equipment cannot occupy large amounts of space, delivering refined surround sound performance in a compact chassis where traditional AV receivers won't fit.

  Built on Marantz's heritage, the unit is designed with timeless style and engineered for utmost performance as part of the CINEMA Series foundation. The receiver provides immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics with careful Sound Master tuning that emphasizes the Most Musical Sound in your home. It supports modern immersive audio formats and an all-new HD graphical user interface with integrated HEOS streaming capabilities for multi-room audio distribution.
specs: |-
  - Number of powered channels: 7
  - Power output: 50W (8 ohm, 20Hz-20kHz, 0.08% THD, 2ch driven)
  - Power output: 70W (6 ohm, 1kHz, 0.7% THD, 2ch driven)
  - Power output: 100W (6 ohm, 1kHz, 10% THD, 1ch driven)
  - Discrete power amplifier with Class A/B topology
  - Assignable bi-amp drive
  - Max processing: 7.1 channels
  - DTS support: DTS HD Master, DTS:X, DTS Neural:X, DTS Virtual:X
  - Dolby support: Dolby TrueHD, Dolby Atmos, Dolby Atmos Height Virtualization, Dolby Atmos Music, Dolby Surround
  - HDMI inputs: 6 (3 support 8K)
  - HDMI outputs: 1
  - Max resolution: 8K/60Hz, 4K/120Hz
  - HDCP 2.3, ARC, eARC
  - Video dynamic range: HDR / HLG / Dolby Vision / HDR10+ / Dynamic HDR
  - ALLM, VRR, QFT, HDMI Pass-Through in Standby, CEC, Auto LipSync
  - Analog audio inputs: 3
  - Phono (MM) input: Yes
  - Subwoofer outputs: 2
  - Multichannel preamp outputs: 7.2
  - Speaker terminals: 7 (assignable Speaker A/B, assignable Multi-Room)
  - Optical digital input: 1
  - Coaxial digital input: 1
  - Multi-room analog output: 1
  - Multi-room digital output: 1
  - Room correction: Audyssey MultEQ with Dynamic EQ and Dynamic Volume
  - Variable cross over and optimized bass redirection
  - Lossy formats: MP3 / WMA / AAC
  - Lossless formats: FLAC HD 192/24 / WAV 192/24 / ALAC 192/24
  - DSD audio: 2.8 MHz / 5.6 MHz
  - Gapless playback: FLAC, WAV, ALAC, DSD
  - MDAX2 compressed audio enhancer
  - HEOS multi-room and streaming integrated
  - AirPlay 2, TuneIn internet radio, Spotify Connect, Pandora, SiriusXM
  - Amazon Music HD / Amazon Music / TIDAL / Deezer / iHeart Radio / Napster / SoundCloud / Mood Mix
  - Roon Ready
  - Ethernet, Wi-Fi, Bluetooth with re-transmit
  - Voice assistants: Alexa / Google Voice Assistant / Apple HomePod
  - Marantz AVR Remote App and HEOS app support
  - Multi-room zones: 2
  - IP Control, Web Control, App Control
  - IR Flasher In, Marantz Remote Bus, 1x DC Trigger output
  - HDMI diagnostics
  - OLED front display
  - 3 GUI languages, Setup Assistant, Smart Select
  - Firmware update via Network and USB
  - ECO mode, Auto Power Off, Sleep Timer, Pure Direct mode
  - Power consumption: 250W operating, 0.2W standby
  - AM/FM tuner
  - USB-A port (front) with USB audio support
  - Available color: Black
  - Dimensions (W x D x H): 17.4 in x 15.1 in x 4.3 in
  - Dimensions with vertical antenna: 17.4 in x 15.1 in x 7.0 in
  - Weight: 19.2 lbs
  - System remote: RC050SR
  - 5 year warranty
