description: >
  Designed for the live musician, AstroLab 88 puts impeccable performance sounds at your fingertips. With a premium hammer-action keybed and powerful software ecosystem, take your signature sounds to the stage and let nothing stand between you and your creative expression.
details: |-
  The astrolab 88 is an avant-garde stage keyboard designed for live musicians, combining a premium hammer-action keybed with a powerful software ecosystem. It features an 88-note fatar tp-40l keybed with piano-size keys and aftertouch, delivering exceptional feel and control for demanding performers. With 44 built-in instruments and 1,800 onboard presets, plus access to over 10,000 additional sounds through v collection and pigments, the astrolab 88 provides a comprehensive sonic palette for studio and stage use.

  The keyboard is powered by 11 distinct sound engines including virtual analog, samples, wavetable, fm, granular, physical modelling, vector synthesis, harmonic, phase distortion, vocoder, and karplus synthesis. It includes 2 dedicated effects (delay and reverb) plus 2 assignable effects, with up to 12 insert fx available for customization. The instrument optimizes polyphony for each engine: pianos, eps, and organs have 48 voices, while most synths have 8 voices, ensuring reliable performance across different sound types.

  The astrolab 88 features an intuitive navigation wheel with a vibrant display for easy sound browsing and preset management, 10 dedicated preset buttons for quick instrument access, and 4 macro controls for real-time parameter editing. The interface includes a mod wheel, pitch wheel, octave buttons, and 4 dedicated fx knobs. Additional performance tools include an arpeggiator, chord and scale modes, looper, hold function, and split keyboard capability for multi-timbral play.

  Connectivity options are extensive, including MIDI din I/o, USB-c for DAW integration and firmware updates, USB-a host for external MIDI input and keyboard control, Bluetooth audio input for playing along with external sources, and Wifi for wireless control via astrolab connect. The keyboard supports up to 4 pedal inputs for sustain, expression, and 2 customizable destinations, stereo audio input with microphone support for vocoder functionality, and both headphone and stereo/mono trs audio outputs.

  The astrolab 88 includes analog lab pro for sound management and organization, and astrolab connect for wireless remote control and library management. The keyboard is compatible with v collection 11 instruments and pigments, with ongoing support for future software updates. It measures 352 x 1316 x 127 mm and weighs 22.2 kg, featuring a road-ready metal chassis designed for touring musicians.
