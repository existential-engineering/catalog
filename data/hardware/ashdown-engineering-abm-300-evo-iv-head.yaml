description: The ABM 300 EVO IV is a 300W bass amp head carrying forward two
  decades of the ABM legacy, recognisable by its glowing VU meter. It combines
  class-leading preamp sophistication with the all-new 9-band EQ, a Variable
  Valve Drive Plus preamp running from clean to overdriven with footswitch
  control, Ashdown's One Knob Dynamic Compressor and a Sub-Harmonic Generator.
  Professional connections include a tuner output, transparent FX loop and line
  input, and it pairs with the optional FS-4 footswitch.
details: |-
  Ashdown ABM EVO IV bass head, the 300W member of a range that also includes 600W and 1200W versions. Recognisable ABM glowing VU meter. Class-leading preamp with a formidable 300W power stage. Variable Valve Drive Plus offers a wide range of tones from clean to overdriven, with footswitch control. All-new 9-band EQ for precision control. Ashdown One Knob Dynamic Compressor and Sub-Harmonic Generator. Professional connections: tuner output, transparent FX loop and line input. Footswitchable tonal shifts via the optional FS-4 footswitch. Note: direct purchases not available in the United States, sold through local dealers.
specs: |-
  - Power output: 300W
  - 9-band EQ
  - Variable Valve Drive Plus preamp
  - One Knob Dynamic Compressor
  - Sub-Harmonic Generator
  - Also available in 600W and 1200W head versions
