details: |-
  Engineered for vocalists with close mic technique performing on loud stages, the OMX-T microphone features a robust all metal construction , a dynamic capsule for accurate vocal capture and a unique identification ring.

  The OMX-T excels in clarity and consistency in the most challenging audio environments. It provides ultimate gain before feedback on concert level stages without sacrificing sound quality. This also translates in excellent isolation and resilience to "microphone cupping".

  OMX-T is part of the new generation of AUDIX's dynamic vocal microphones , featuring our proprietary VLM (very low mass) capsule technology and the new flat-top grille that intuitively guides towards correct positioning and technique.

  Designed and crafted in the USA.
