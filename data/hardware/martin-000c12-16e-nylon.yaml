description: Classic Martin craftsmanship in a nylon-string, 12-fret Auditorium
  with a cutaway. Features solid woods, smooth playability, and E1 electronics,
  designed for classical, Latin, and fingerstyle players.
details: |-
  The Martin 000C12-16E Nylon brings classic Martin craftsmanship to a nylon-string, 12-fret Auditorium body with a Venetian cutaway. Built with a solid spruce top and solid mahogany back and sides in a satin finish, the guitar delivers warm, balanced tone with the playability and aesthetic of a traditional classical guitar in a familiar Martin silhouette.

  A select hardwood neck with a low profile and standard taper joins the body at the 12th fret, with a 26.44-inch scale length and an ebony fingerboard. The classical drop-in ebony bridge, white Tusq saddle with an 18-inch radius, and bone nut provide a stable, articulate platform for nylon strings, while gold side-mount tuners on a slotted headstock with rosewood headplate complete the classical-style appointments.

  Martin's A-frame X-brace system with non-scalloped 1/4-inch spruce braces supports the spruce top, and the bold herringbone rosette with multi-stripe inlay and black binding give the instrument understated visual character. The guitar is Pleked at the factory so the frets are leveled for optimal playability across the full 20-fret range.

  Onboard Martin E1 electronics provide controls for volume, tone, and phase, along with a built-in chromatic tuner, making the 000C12-16E Nylon equally at home in the practice room or on stage. The guitar ships pre-strung with Classical Magnifico Premium Guitar Strings (hard tension) in a waterproof softshell case with backpack straps.
specs: |-
  - Body Size: 000-12 Fret Cutaway (Auditorium with Venetian cutaway)
  - Top: Solid Spruce, satin finish
  - Back & Sides: Solid Mahogany, satin finish
  - Bracing: A-frame X-brace, non-scalloped spruce, 1/4"
  - Rosette: Bold herringbone with multi-stripe inlay
  - Binding: Black
  - Neck: Select hardwood, low profile with standard taper
  - Scale Length: 26.44"
  - Total Frets: 20 (joins body at 12th fret)
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 7/8"
  - Fingerboard Width at 12th Fret: 2 5/16"
  - Bridge: Ebony, classical drop-in style
  - Bridge String Spacing: 2 5/16"
  - Saddle: White Tusq, 18" radius
  - Nut: Bone
  - Headstock: Slotted with rosewood headplate
  - Tuning Machines: Gold side-mount
  - Electronics: Martin E1 (volume, tone, phase, built-in chromatic tuner)
  - Strings: Classical Magnifico Premium (hard tension)
  - Case: Waterproof softshell with backpack straps
  - Pleked frets for optimal playability
  - Available in right- and left-handed configurations
