details: |-
  We have developed two high-performance pencil mics as part of our MicParts product line. The MicParts SDC is based on the Schoeps CMC5; it is transformerless, with very low noise, very low distortion, and fast/accurate transient response. The MicParts SDC-84 is based on the vintage Neumann KM84, which favors character over accuracy; transients are slightly controlled, by which we mean that moderate to high-SPL transients will be slightly compressed. Because many modern microphone buyers are not familiar with the vintage KM84, we need to distinguish that mic (which has not been in production for decades) from the modern Neumann KM-184, which could accurately be called the TLM-184, in that the transformer of the KM84 has been omitted. The KM-184 does not sound like the vintage KM-84; the circuit is different, and the voicing is much brighter. Modern KM-184s can be purchased for $900. Vintage KM-84i mics in good condition fetch as much as $2500. The MicParts SDC and SDC-84 are hand-built in our California workshop. We offer singles and matched pairs of both models. Applications

  The SDC-84 is magic on acoustic guitars and other stringed instruments. The transformerless SDC is very similar; its voicing is slightly more open, and it has greater dynamic range which gives it a slightly more punchy sound -- although this is a subtle effect. Matched pairs of both models work beautifully as drum overheads. Because SDCs generally have tighter pattern control (meaning, they maintain a Cardioid pattern over a wider frequency range than LDCs), these mics tend to sound less ambient than large-diaphragm mics, picking up less of the space around the instrument. If you are buying a mic for the snare drum, please see the MicParts Snare Mic . Accessories

  Single mics include a suspension mount, zipper pouch, and spare O-rings for the mount. Matched pairs omit the zipper pouch in favor of a robust flight case.
