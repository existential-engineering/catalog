details: |-
  Boards - Pedals - TonePrints

  What is Plethora X5? • Create a bunch of BOARDS • Populate them with any of the TC TonePrint PEDALS • Load each PEDAL with any TONEPRINT from our library or create your own As soon as you unbox Plethora you’ve got a whole bunch of tasty premade boards ready to go. No fuss. If you have a specific idea about what you need, take it one step further and choose which pedals go where on your board. Or go all-in and get your hands dirty with our proprietary TonePrint technology, letting you customize each pedal in-depth for a truly unique setup! You decide how far you want to go.

  Always Be Prepared

  Setting up a nice pedalboard takes time. Planning, measuring, figuring out combined current draw, and cutting Velcro, all before organizing cables and power cords in a way that doesn’t look like the aftermath of a minor apocalyptic event. Trust us – we’ve built a LOT of pedalboards! Well it doesn’t have to be that hard. Plethora X5 makes the entire board building experience much more intuitive and fun. With the ability to create and store up to 127 custom boards, tailored to your needs, you’ll never run out of tones.

  Any Color You Like
