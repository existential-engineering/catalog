description: A true-stereo chorus and pitch-vibrato modeled on the Roland CE-1,
  with two independent stereo modulation engines, a lossless chorus-to-vibrato
  mixer, tap-tempo, presets and full MIDI.
details: |-
  The Stereo Vintage Ensemble Professional (SVEP) is the culmination of a decade
  of refining Mr. Black's take on the legendary Roland CE-1 chorus. It recreates
  the CE-1's warm modulation and rich, dimensional movement, then expands it with
  modern performance features.

  In Normal mode it faithfully reproduces the delay times, voicing and modulation
  waveform of the original chorus. In place of the CE-1's fixed chorus/vibrato
  switch, a continuously variable lossless wet/dry mixer blends seamlessly from
  classic chorus to true pitch vibrato, covering the full palette from subtle
  shimmer to deep modulation.

  Stereo mode links the left and right modulation delay times in opposite
  directions, so as one channel shortens the other lengthens. Each side produces
  smooth pitch vibrato on its own, and heard together they interact into a
  swirling chorus that seems to move around the room, a living, breathing stereo
  field.

  Beyond the sound, the SVEP is the first Vintage Ensemble to add precision
  tap-tempo, instant preset recall, and full MIDI (Type-A) integration, covering
  control of all front-panel parameters, MIDI clock sync, tap-tempo over MIDI,
  remote bypass and mode switching, and eight additional MIDI presets. An
  expression-pedal input and external tap-tempo input round out the performance
  controls. Its added engines, mixer, MIDI and performance features make it a
  functionally distinct product from the earlier standard Stereo Vintage
  Ensemble it succeeds.

  It is true-stereo in and out, uses buffered bypass, and runs on 9VDC (2.1mm
  negative-center) at 74mA.
specs: |-
  - Authentic vintage chorus and pitch vibrato (Roland CE-1 voicing)
  - True-stereo input and output
  - Two fully independent stereo modulation engines with dedicated delay lines
  - Inverse stereo modulation architecture for immersive stereo movement
  - Normal and Stereo modes
  - Continuous chorus-to-vibrato blend via a lossless wet/dry mixer
  - Precision tap-tempo with real-time LED indicator
  - Instant preset recall
  - Expression-pedal input; external tap-tempo input
  - Full MIDI support (Type-A): clock sync, tap-tempo, all front-panel params, remote bypass/mode, 8 MIDI presets
  - Speed knob LFO: 0.24Hz - 8Hz; tap-tempo: 0.03Hz - 8Hz
  - Input impedance: 470kΩ per channel
  - Output impedance: 2kΩ per channel
  - Buffered bypass
  - 9VDC negative-center power (2.1mm), 74mA draw (100mA regulated recommended)
  - Dimensions: 3.725" x 4.75" x 2.10" (94.6mm x 120.6mm x 53.5mm)
  - Weight: 13.25oz (375g)
