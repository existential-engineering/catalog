description: The BTe Koa is a 3/4-scale acoustic-electric Baby Taylor built with
  all-Hawaiian-koa construction — solid koa top with layered koa back and sides
  — featuring ES-B electronics with built-in digital tuner.
details: |-
  The BTe Koa elevates Taylor's Baby Taylor 3/4-size platform with all-Hawaiian-koa construction — solid koa top paired with layered koa back and sides — delivering bright, clear, and distinctly vibrant tone in a compact, travel-friendly form.

  ES-B electronics with a built-in digital tuner provide stage- and studio-ready performance. The Maple neck with West African Crelicam Ebony fretboard and 22-3/4" scale length offers a smooth playing feel with reduced string tension.

  X bracing, varnish finish, Nubone nut, Micarta saddle, and die-cast chrome tuners. Ships with a soft gig bag.
specs: |-
  - - Body style: Baby Taylor (3/4 size)
  - Top: Hawaiian Koa (solid, varnish)
  - Back/sides: Koa (layered, varnish)
  - Bracing: X
  - Neck: Maple
  - Fretboard: West African Crelicam Ebony
  - Scale length: 22-3/4"
  - Inlays: 4mm dots (Italian Acrylic)
  - Tuners: Die-Cast Chrome
  - Electronics: ES-B with built-in digital tuner
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Soft gig bag included
