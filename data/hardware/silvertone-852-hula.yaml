details: |-
  Available Soon! The Silvertone 852 Hula Soprano Ukulele brings vintage charm and modern playability together in a beautifully reissued classic. Inspired by one of Silvertone's most beloved stencil-style designs, this soprano-sized ukulele captures the playful spirit and unmistakable character that musicians have loved since 1914. Silvertone's ukulele heritage began over a century ago in the iconic Sears catalog, where approachable, personality-filled instruments helped introduce generations of players to music. That tradition continues with the 852 Hula, carrying forward the brand's signature blend of nostalgic Americana and reliable craftsmanship. This soprano ukulele features a stunning mid-century–inspired island scene in vibrant teal stencil artwork. A graceful hula dancer, palm trees, and a moonlit shoreline stand out against the rich brown mahogany body, creating a design that feels authentically retro and instantly eye-catching. Built for today's players, the 852 Hula combines classic tonewoods with modern hardware. Its traditional mahogany body and neck paired with a smooth walnut fingerboard deliver warm projection and a sweet midrange voice. Upgraded geared tuners ensure stable, accurate tuning whether you're performing, recording, or simply playing at home. Perfect for collectors, longtime Silvertone fans, and first-time players alike, the 852 Hula Soprano Ukulele offers a joyful playing experience wrapped in timeless style. It's a celebration of over 100 years of musical heritage—ready to inspire a new generation of ukulele lovers.
specs: |-
