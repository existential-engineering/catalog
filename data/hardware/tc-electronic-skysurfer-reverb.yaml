details: |-
  Thanks to three awesome onboard, studio-grade reverb algorithms, the ultra-tasty SKYSURFER REVERB is the premium – yet affordable answer to your reverb dreams and prayers. With SKYSURFER REVERB: you can skim effortlessly across a deep-green, churning ocean; swim in a cavernous grotto; or soar through the ambient spray of the surf. Put simply, SKYSURFER REVERB is your one-way ticket to the perfect wave!

  It’s All About the Tone

  Unlike many of our competitors’ budget-friendly reverb pedals that often disrespect your tone, SKYSURFER REVERB is the perfect beach buddy. Designed around superb studio-quality algorithms, SKYSURFER REVERB provides all the lush, transparent reverb sounds you could ever dream of – without compromising your original tone. Finally, a reverb pedal that’ll do great things for both your wallet and your tone – SKYSURFER REVERB!

  Colors in Space

  SKYSURFER REVERB offers 3 easy flavors of reverbs sure to add the perfect amount of color and space to your playing. Spring provides all the drippy, splashy goodness of an old-school reverb tank, which is great for a full-on Dick Dale-style surf attack, while Room and Hall let you take your tone from earthy and organic – to interstellar spaceflight.
