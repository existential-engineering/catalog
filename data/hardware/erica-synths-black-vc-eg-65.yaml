description: Erica Synths Black Voltage Controlled Envelope Generator gives you
  the ultimate control over envelopes in your modular synth.
details: |-
  The Black VC EG is a looping linear and logarithmic ADSR envelope generator with CV control over each stage. Together with the Black VC EG Expander it becomes a genuinely advanced modulation source.

  The envelope is retriggerable, each stage takes its own CV with an attenuator on the CV level, the looping function turns the envelope into a cycling modulator, and the envelope shape can be switched between linear and logarithmic. The design is skiff-friendly.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  Envelope level runs from 0V to 10V, attack, decay and release times reach 12 seconds each, and CV sweeps fully across -5V to +5V. The panel is 10HP wide at a depth of 30mm, drawing 30mA from the +12V rail and 15mA from the -12V rail, rising to 40mA and 20mA with the expander fitted.
specs: |-
  - Retriggerable ADSR envelope generator
  - CV control over each stage
  - CV level attenuators
  - Looping function
  - Lin/log envelope shape selection
  - Skiff-friendly design
  - Envelope level 0 to 10V
  - Attack time 12 s
  - Decay time 12 s
  - Release time 12 s
  - CV level (full sweep) -5V to +5V
  - Panel width 10HP
  - Module depth 30mm
  - Power consumption 30mA@+12V, 15mA@-12V
  - Power consumption with Expander 40mA@+12V, 20mA@-12V
