description: >-
  The EDP Gnat is a compact single-oscillator monophonic synthesizer and a stripped-down
  sibling of the Wasp, featuring a digital oscillator with analog filter circuitry and the
  same touch-sensitive keyboard design.
details: |-
  The Gnat is a single-oscillator version of EDP's more well-known Wasp synthesizer, offering simpler but effective monophonic synthesis in a compact format. It combines one digital oscillator with analog filter and envelope circuitry, providing basic lowpass resonant filtering, attack and decay envelope controls, and an LFO that can modulate either pitch or the filter.

  Like the Wasp, the Gnat features a 25-key capacitive touch-sensitive keyboard with flat non-moving keys, along with EDP's proprietary digital control interface for linking to a Wasp or other EDP gear. A built-in speaker allows standalone use without external amplification.

  The Gnat was produced in three versions. The original model was followed by the Gnat Special in 1982 and the Gnat Deluxe, both featuring wood panels and cosmetic refinements. The Deluxe model upgraded to a standard 3-octave keyboard, addressing the playability limitations of the touch-sensitive keys. MIDI retrofits are available for all versions.

  Designed by Chris Huggett, who also created the Oxford Synthesizer Company's OSCar, the Gnat delivers simple but characterful analog bass, synth leads, and other monophonic sounds that belie its modest specifications.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 DCO (adjustable 2' to 32')
  - Waveforms: Ramp, square, enhance, noise (switchable)
  - LFO: 1 (sine, ramp, sawtooth, square, random)
  - Filter: 1 lowpass 12 dB/oct with resonance
  - Keyboard: 25 capacitive touch keys (37 standard keys on Deluxe)
  - Memory: None
  - Control: EDP proprietary digital socket, MIDI retrofits available
releaseDate: "1980"
