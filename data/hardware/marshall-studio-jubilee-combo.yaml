description: Compact 20W all-valve 1x12" combo reimagining of the iconic 1987
  Silver Jubilee, hand-soldered in Marshall's UK factory. The 2525C delivers the
  distinctive split-channel Jubilee voicing (Clean / Rhythm Clip / Lead) made
  famous by Slash and John Frusciante, with a Celestion G12M-25 speaker and
  switchable power reduction from 20W down to 5W for studio, stage, and home
  use. A series effects loop, DI output, and three speaker output impedances
  (16Ω / 8Ω / 4Ω) round out a small-format Jubilee built for any setting.
details: |-
  - 20W all-valve UK-built guitar combo with switchable power reduction to 5W
  - Reimagined version of the 1987 Silver Jubilee 2555 in a compact 1x12" combo format
  - Split-channel design with Clean, Rhythm Clip, and Lead modes via pull-pots
  - Pull-rhythm-clip on Input Gain adds gritty crunch to the rhythm channel
  - Pull-channel on Output Master switches between rhythm and lead channels
  - Series, switchable effects loop
  - DI output (1/4" jack) for direct recording or front-of-house feeds
  - Five 1/4" speaker outputs covering 16Ω / 8Ω / 4Ω loads
  - 1 x 12" Celestion G12M-25 speaker (16Ω, 25W)
  - Preamp: 2 x ECC83 + 1 x ECC83 phase splitter; power amp: 2 x EL34
  - Hand-soldered at Marshall's Bletchley, UK factory
specs: |-
  - Model: 2525C
  - Sku: 1007227
  - Range: Studio Jubilee
  - Output Wattage: 20W (with power reduction option, 5W)
  - Channels: 2 (Clean / Rhythm Clip / Lead via pull-pots)
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Controls: INPUT GAIN (PULL RHYTHM CLIP), LEAD MASTER, OUTPUT MASTER (PULL CHANNEL), TREBLE, MIDDLE, BASS, PRESENCE
  - Effects: None
  - Effects Loop: Yes, 1 x series switchable
  - Inputs: 1 x 1/4" instrument input jack, footswitch
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), DI (1/4" jack)
  - Speaker Configuration: 1x12"
  - Speaker Model: Celestion G12M-25 (16Ω, 25W)
  - Unit Impedance: 16Ω
  - Product Height: 475 mm / 18.7"
  - Product Width: 490 mm / 19.3"
  - Product Depth: 280 mm / 11"
  - Weight: 19 kg / 42 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
