description: Compact 20W all-valve 1x12" combo reimagining of the iconic 1987
  Silver Jubilee, hand-soldered in Marshall's UK factory. The 2525C delivers the
  distinctive split-channel Jubilee voicing (Clean / Rhythm Clip / Lead) made
  famous by Slash and John Frusciante, with a Celestion G12M-25 speaker and
  switchable power reduction from 20W down to 5W for studio, stage, and home
  use. A series effects loop, DI output, and three speaker output impedances
  (16Ω / 8Ω / 4Ω) round out a small-format Jubilee built for any setting.
details: |-
  Housed with a punchy 12 inch Celestion G12M speaker, the Studio Jubilee Combo delivers everything from sparkling cleans to gritty distortion. In addition to the 3-way EQ and presence control, there is the option to engage the pull rhythm clip function for extra crunch.

  The power to choose is yours. With a simple flip of a switch, you can select a power output of 5W or 20W. Perfect for seamlessly transitioning between the bedroom and the studio, to transform any location into your very own stage.

  Experience the versatile tones of the Silver Jubilee, in a smaller package. This amp became a quick favourite with guitar legends, such as Slash and John Frusciante, for its ferocious tone and split-channel design. Originally released in 1987 to mark 25 years of Marshall, you can now take the celebration with you, wherever you choose to play.

  The highly sought-after sound of the G12M Greenback speaker has remained constant over multiple decades. With its powerful midrange and tight high-end, the 25W model of this speaker produces powerful tones for chords as well as cutting leads. It is ideal for giving contemporary high gain amplifiers more punch and clarity.

  Expertly constructed at Marshall's Bletchley factory in England, the Studio Jubilee Combo embodies the spirit of Marshall inside and out. The Studio Series includes hand-soldering, making sure that each amp is created with the utmost care and precision and even has a similar circuit design to its bigger, older brothers, to give you that authentic Marshall sound. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: 2525C
  - Range: Studio
  - Channels: 2
  - Technology: Valve
  - Output wattage: 20W (with power reduction option, 5W)
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4" jack)
  - Inputs: 1 x 1/4" instrument input jack, footswitch
  - Controls: Input gain (pull rhythm clip), lead master, output master (pull channel), treble, middle, bass, presence
  - Effects: None
  - Effects loop: Yes, 1 x series switchable
  - Speaker configuration: 1x12"
  - Speaker model: Celestion G12M-25 (16 ohm, 25W)
  - Unit impedance: 16 ohm
  - Preamp valves: 2 x ECC83, 1 x ECC83
  - Power amp valves: 2 x EL34
  - Weight: 19 kg / 42 lb
  - Width: 490 mm / 19.3"
  - Height: 475 mm / 18.7"
  - Depth: 280 mm / 11"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - Box contents: PEDL-90003 footswitch included, detachable power cable included
  - Colour: Silver
