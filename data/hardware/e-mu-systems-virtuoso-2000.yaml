description: >-
  The E-mu Virtuoso 2000 is a 128-voice orchestral sound module packed with over 64 MB of
  sampled orchestral instruments, offering a full symphony's worth of strings, brass,
  woodwinds, and percussion in a single rack space. Built on the Proteus 2000 platform, it
  provides over 1,000 sounds across 32 MIDI channels with lightning-fast response. The
  unit is expandable to 128 MB via additional internal ROM slots.
details: |-
  The Virtuoso 2000 represents E-mu's dedicated orchestral offering, built on the proven Proteus 2000 platform. It ships with the complete "Orchestral Session" soundsets 1 and 2, encompassing a comprehensive range of orchestral instruments including violins, violas, celli, double basses, trumpets, French horns, trombones, tubas, flutes, oboes, clarinets, bassoons, harp, and a percussion battery of over 20 instruments.

  The module provides 128 voices of polyphony and includes over 120 orchestral MIDI riffs for quick arrangement work. A 24-bit dual stereo effects processor handles reverb and spatial processing, while 512 ROM and 512 user preset slots offer extensive sound management. Over 1,000 sounds are available out of the box.

  Expansion is supported via three internal slots that accept 32 MB ROM cards, bringing total sound memory up to 128 MB. Compatible expansion cards include Siedlaczek Orchestra, Pure Phatt, Beat Garden, Protozoa, Definitive B-3, and others. The unit can also play back Flash ROMs authored on E4 Ultra Samplers, bridging E-mu's sampler and module ecosystems.

  Connectivity includes six analog outputs and S/PDIF digital output, with twelve assignable real-time front panel controls for hands-on tweaking. MIDI supports 32 channels for complex orchestral arrangements across multiple parts.
specs: |-
  - Polyphony: 128 voices
  - Sound ROM: 64 MB "Orchestral Session" soundsets 1 and 2 (expandable to 128 MB)
  - Sounds: Over 1,000
  - Effects: 24-bit dual stereo effects processor
  - Presets: 512 ROM, 512 user
  - Outputs: 6 analog, S/PDIF digital
  - MIDI: 32 channels
  - Expansion: 3 additional 32 MB ROM slots
  - Arpeggiator: Over 120 orchestral MIDI riffs
  - Controls: 12 assignable real-time front panel knobs
  - Form Factor: Single rack space
