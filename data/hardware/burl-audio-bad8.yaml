description: "8-channel analog-to-digital converter daughter card for the B80
  and B16 Mothership modular chassis, employing all class-A, discrete transistor
  analog circuit path with BX1 transformer-coupled input and the latest A/D
  conversion technology."
details: |-
  The BAD8 is the 8-channel ADC daughter card for the Burl Audio B80 and B16 MOTHERSHIP chassis. It is the result of over 25 years of R&D A/D design experience and thousands of hours of listening tests.

  By using Burl Audio's renowned BX1 transformer input in an all-discrete, class-A circuit path, the BAD8 achieves the same musical, tactile qualities that have made the B2 Bomber ADC a studio standard. Now featuring BURL NextGen Analog circuits, the BAD8 includes Avid delay matching and upgraded filter select options.

  A single B80 chassis with 10 BAD8 daughter cards provides up to 80 channels of transformer-coupled ADC at all sample rates.
specs: |-
  - 8-channel ADC
  - 8-channel DB25 (Tascam style) connectivity
  - All class-A, NextGen Analog
  - Proprietary BX1 transformer
  - Avid delay matching
  - ADC filter select
  - 115 dB Dynamic Range
  - -96 dB THD+N, full scale output = +22 dBU
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - Frequency response at 96 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -0.3 dB @ 40 kHz
  - Frequency response at 192 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -1.5 dB @ 90 kHz
