details: |-
  The Martin D-17 is part of the Standard Series, pairing a solid mahogany top, back, and sides with a Dark Mahogany satin finish for a warm, woody tone with strong fundamentals and dynamic response.

  Built on the classic D-14 Fret Dreadnought platform, the D-17 features GE-scalloped forward-shifted spruce X-bracing for an open, resonant voice with pronounced low-end and clear projection.

  A Select Hardwood neck with the GE Modified Low Oval profile and High-Performance Taper delivers comfortable, fast playability across the 25.4" scale. The ebony fingerboard and ebony GE Modern Belly bridge with drop-in compensated bone saddle round out the appointments.

  Nickel open-gear tuners and a 1 3/4" nut width keep the vintage character intact, while the satin finish lets the instrument breathe and age naturally. The guitar ships strung with Martin Authentic Acoustic Lifespan 2.0 Medium strings and includes a hardshell case.
specs: |-
  - Body shape: D-14 Fret Dreadnought
  - Top: Solid Mahogany (Dark Mahogany satin finish)
  - Back and sides: Mahogany (Dark Mahogany satin finish)
  - Bracing: GE-scalloped forward-shifted spruce X-brace
  - Neck: Select Hardwood (Dark Mahogany satin finish)
  - Neck profile: GE Modified Low Oval with High-Performance Taper
  - Fingerboard: Ebony
  - Scale length: 25.4"
  - Nut width: 1 3/4"
  - Frets: 20 total (14-fret body)
  - Bridge: Ebony GE Modern Belly with drop-in saddle
  - Saddle: Compensated bone
  - Tuners: Nickel open gear
  - Strings: Martin Authentic Acoustic Lifespan 2.0 (Medium)
  - Case: Hardshell
  - Finish: Satin
