description: A custom shop wah pedal offering five selectable voices via a
  rotary switch, powered by a matched pair of BC109B transistors, with an
  adjustable input Level knob to drive the circuit cleanly or with overdrive.
details: |-
  The Fulltone Custom Shop SUPA-WAH, with its gorgeous Metallic-White finish, takes our legendary CLYDE Wah concept to the next level by offering two additional Modes, for a total of Five unique voices. Like having five totally different Wah pedals at your disposal, the modes are accessible via a large rotary switch located on the right side of the pedal! PHAT mode is the throatiest, most vocal Wah sound and my personal favorite. SUB is deep, grunty, and unbelievably expressive...works great on Bass, but certainly not just for Bass players! The SUPA-WAH is powered by a matched-pair of rare BC109B transistors (subject to availability) which were the same ones used in 1960s Vox Clyde McCoys. There's an adjustable input LEVEL Knob allowing the signal to hit the wah circuit cleanly (when turned down) or to overdrive it for grit and more overtones (when turned up). Here's a couple of satisfied owners:
  Wow! I received my CS Supa-Wah. I absolutely love it. The quality and care of the build, the options , the sound quality right down to the color! It's beautiful. Thanks! Mine was #58
  -Mark C

  I received my Custom Shop Supa-Wah a few days ago and just wanted to tell you how blown away I am by it. It's pretty much perfect. Like a lot of guitar nerds, I've been on a low-key hunt for the right wah for like a decade. The search is over. You did an amazing job with this one. - Jeff N
