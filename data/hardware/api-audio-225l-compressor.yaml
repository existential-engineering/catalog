id: W6JoPF_3savjuhXnMvAHV
name: 225L Compressor
manufacturer: api-audio
primaryCategory: compressor
categories:
  - dynamics
  - rack-mount
url: https://apiaudio.com/product/225l-compressor/
description: VCA-based compressor with auto-makeup gain for studio, live sound,
  and broadcast. Features selectable NEW (feed-forward) or OLD (feed-back)
  character, HARD or SOFT knee, and an LED gain-reduction meter. Built around
  API 2510 and 2520 op-amps with transformer output.
details: |-
  200 Series compressor module compatible with Legacy, Legacy Plus, and
  Vision Series Consoles, and the L200 Rack. Features continuously variable
  threshold, ratio, attack (1–25 ms), and release (0.3–3 s) via concentric
  knobs. Supports external LINK for stereo pairing and includes a side-chain
  input.
specs: |-
  - Format: 200 Series
  - Threshold: +10 to -20 dBu
  - Ratio: 1:1 to infinity (variable)
  - Attack: 1–25 ms (continuously variable)
  - Release: 0.3–3 s (continuously variable)
  - Knee: HARD or SOFT (selectable)
  - Character: NEW (feed-forward) or OLD (feed-back)
  - Auto makeup gain
  - Max output: +28 dBu (transformer)
  - Op-amps: API 2510, API 2520
  - Dimensions: 1.25" × 2.65" × 7" deep
  - Weight: 0.6 lb
