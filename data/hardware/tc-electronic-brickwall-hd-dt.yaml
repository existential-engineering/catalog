  BRICKWALL HD NATIVE / BRICKWALL HD-DT

  BRICKWALL HD is a brick wall limiter plug-in like no other. Designed for use in professional and home studio mastering scenarios, it sports both classic transparent limiting and modern loudness oriented workflow for outstanding and predictable results. With its optional desktop controller, BRICKWALL HD is a pioneering fusion of premium software and next-generation hardware assisted workflow.

  Icon Series Mastering Plugins

  BRICKWALL HD and MASTER X HD combines unparalleled transparent performance with an easy-to-use interface, and together form the ultimate master processing chain. Ideal for computer-based music production, these premium mastering plugins provide you with the tools to take your sonic ambitions to the next level.

