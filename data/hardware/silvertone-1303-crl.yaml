description: A reissue solid-body electric guitar with a thru-body bridge and
  lipstick single-coil pickups. It features a modern C-shape neck and
  dual-action truss rod for improved playability and sustain.
details: |-
  Add a Silvertone Gray Gigbag for just $35 with this guitar — discount applied at checkout. Timeless Twang

  Silvertone introduced one of the earliest solid body guitars in the fall of 1954. That early model evolved into the 1303 in 1958. The Reissue 1303/U2 has all the vibe and twang of the original with some significant upgrades. The thru-body bridge provides great attack and hefty tone while giving you all the modern adjustment options you want. We also paid special attention to the neck profile, improving it with a modern C-shape, as well as coupling it to the body with a newly engineered neck joint system for longer sustaining notes. Specs

  1303/U2 Electric Solid Body

  Hardware

  Neck

  Pickups and Controls

  ~features~

  Lipstick Single Coil Pickups

  The single-coil pickups of the 1303/U2 are wound to replicate the exact specifications as the originals. The "lipstick" case provides unmatched shielding for low noise and high signal. Upgraded Hardware

  The original 1303/U2 had less-that-modern bridge, tailpiece and tuners. The Reissue has a fully adjustable bridge for accurate intonation and smooth individual tuners. Improved Playability

  Neck shapes and fret jobs were inconsistent on the original 1303. The Reissue features a comfortable (and consistent) C-shaped neck with a precise and well-finished fret job. The neck also features a two-way truss rod for accurate and dependable adjustment.
