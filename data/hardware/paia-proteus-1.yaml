description: >-
  The PAiA Proteus 1 is an ultra-rare analog monophonic synthesizer sold as a DIY kit
  between 1978 and 1982, with only 70-80 units produced. It features dual CEM-based
  oscillators, a resonant lowpass filter, 16 user-programmable patch memory locations, and
  a 37-key keyboard. Its extensive rear-panel CV patchbay allows integration with external
  modular synthesizers and sequencers.
details: |-
  The Proteus 1 was manufactured by PAiA Electronics as a do-it-yourself kit synthesizer, originally retailing for $400-$500. It employed CEM (Curtis Electromusic) integrated circuits, the same chips found in Sequential Circuits' Pro-One and many other classic analog synthesizers of the late 1970s and early 1980s.

    A distinguishing feature of the Proteus 1 is its user-programmable patch memory system with 16 storage locations, a capability that was uncommon among monosynths of its era. The control panel includes indicator lights that display when physical knob positions match the stored internal patch parameters, making it easy to see and edit saved sounds.

    The back panel provides an extensive CV patchbay with control voltage inputs for pitch modulation, filter cutoff, resonance, envelope parameters, and preset advancement. This architecture allows users to integrate external modular synthesizers, analog sequencers, or MIDI-to-CV converters for expanded sonic possibilities. Due to its extremely limited production run of only 70-80 units, the Proteus 1 is considered one of the rarest vintage synthesizers in existence.
specs: |-
  - Polyphony: Monophonic
    - Oscillators: 2 VCOs with oscillator sync
    - Noise: Noise generator
    - Modulation: 1 LFO
    - Filter: 1 lowpass resonant filter
    - Envelopes: 1 ADSR envelope generator
    - Memory: 16 user-programmable patches
    - Keyboard: 37 keys
    - Control: CV/Gate architecture with rear-panel patchbay
    - Production: Approximately 70-80 units (1978-1982)
    - Format: DIY kit
