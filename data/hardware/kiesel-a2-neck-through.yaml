details: |-
  The A2, 2023's most popular Kiesel guitar, followed the original Aries in its bolt-on construction.

  To reach a wider range of tastes, the Neck-through Aries 2, or NA2, comes onto the scene in early 2024 as the sixth and newest addition to the Aries series.

  The NA2 changes critical features to distinguish it from its predecessor, such as the seamless neck heel, tonal and stability differentiation, and the other benefits accompanying the neck construction.
specs: |-
  - Construction: neck-through with sculpted neck heel
  - Scale length: 25.5" or 27" fixed, with multiscale options of 25.5" to 26.5", 25.5" to 27" and 26" to 27.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" or 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Body: alder
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Output jacks: a flush mount output jack and a rear Access output jack, both fitted as standard
  - Bridge options: Hipshot fixed bridge or Hipshot Solo Saddle bridge, .4125" (10.5mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: pointed inline headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Elixir Nanoweb 1046E
  - Neck width options from 1.69" to 2.42" wide at the nut
  - Body dimensions: 38.25" to 39.75" long, 1.65" thick, 12.6" to 12.7" wide depending on configuration
  - Weight: 7.25 to 7.75 lbs
  - Offered in several string counts and in standard or multiscale layouts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
