details: |-
  Mackie SRM212 V-Class sets a new industry standard for portable loudspeakers, bringing the best-in-class performance, clarity and technology you need when compromise isn't an option.

  Every song deserves to be heard the way it was intended. Upgrade to Mackie SRM V-Class, the high-performance loudspeaker that is as clear and articulate as a professional studio monitor.
specs: |-
  - 2000W Class-D Amplifier
  - 12" low-frequency driver
  - Premium polymer high-frequency driver (1.4")
  - Maximum SPL Peak: 135 dB
  - Frequency Response: 42 Hz - 20 kHz
  - Horizontal Coverage Angle: 90°
  - Vertical Coverage Angle: 60°
  - Height: 25.9 in / 658 mm
  - Width: 15.2 in / 386 mm
  - Depth: 14.2 in / 361 mm
  - Weight: 40.6 lb / 18.4 kg
  - Universal power supply (100-240 VAC) with Power Factor Correction
