details: |-
  Get classic '50s and '60s-inspired Gretsch sound and style with the all-new Electromatic Classic Hollow Body guitars. Crafted with essential Gretsch hollow-body sound, style and playability, these no-nonsense guitars are your next-step Gretsch.

  The G5422TG features laminated maple construction with trestle block bracing designed to reduce feedback and enhance attack, snap, and sustain. FT-5E Filter'Tron pickups deliver huge full-bodied punch, classic chime and enhanced presence, clarity and note definition.

  A Classic "C"-shaped maple neck with 12-inch-radius laurel fingerboard provides improved playability. The instrument includes master volume with treble bleed circuit, individual pickup controls, Bigsby B60 vibrato, and gold hardware throughout.
