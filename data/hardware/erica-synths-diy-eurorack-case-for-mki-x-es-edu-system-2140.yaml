description: Case for ed.edu x mki modules.
details: |-
  The mki x es.edu project walks a builder through assembling a complete, self-contained eurorack system. Anyone already working in eurorack will find the mki x es.edu modules a useful addition to an existing system, while a first-time modular builder also needs a reliable and safe power supply and an enclosure, which is what this case provides.

  The DIY eurorack PSU is built around a DC/DC converter that turns the +12VDC from a wall wart AC/DC adapter into the eurorack standard bipolar +-12V. Voltage inside the case therefore never exceeds 12V, so any area of the enclosure is safe to touch.

  To keep the cost of the case down, Erica Synths left out eurorack rails with threaded inserts or sliding nuts. In their place the enclosure carries pre-drilled, threaded holes that accommodate the modules of the mki x es.edu system in a specific order.

  The enclosure and PSU are designed specifically for the DIY modules of the mki x es.edu series and are not compatible with other eurorack modules. Overall dimensions are 428mm x 138mm x 57mm.
specs: |-
  - Dimensions: 428mm x 138mm x 57mm
  - DIY eurorack PSU based on a DC/DC converter
  - Turns +12VDC from a wall wart AC/DC adapter into eurorack standard +-12V
  - Pre-drilled, threaded holes in place of rails with threaded inserts or sliding nuts
  - Designed for mki x es.edu series DIY modules only, not compatible with other eurorack modules
