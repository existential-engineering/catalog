description: The SWAMP is a random CV and audio generator inspired by the famous
  Wiard Wogglebug module; it’s often the heart of self-generating patches and
  brings controllable randomness to your modular system.
details: |-
  The SWAMP is a random CV and audio generator taking its cue from the Wiard Wogglebug, the sort of module that ends up at the heart of a self-generating patch and brings controllable randomness to a modular system.

  Erica Synths introduced numerous modifications to the design. Potentiometer range was extended, an audio input was added that replaces the internal Tone oscillator when something is connected to it, and the expensive dual vactrol of the original was replaced.

  The sample and hold circuit is built around the AS1100CK2 sample and hold IC made in Riga. Audio waveform selection switches and CV output configuration jumpers were added alongside it, so the module can be tailored during and after the build.

  Three random audio frequency outputs and three random CV outputs leave the panel, the external audio input is routed to a ring modulator, and a clock input and output tie the module into the rest of the system. CV control over the internal clock pushes the randomness further.

  Audio output amplitude is 10Vptp and CV outputs run either 0 to 10V or -5V to +5V depending on the jumper configuration. The panel is 14HP wide and the module is 35mm deep with a skiff-friendly build.
specs: |-
  - Three random audio frequency outputs
  - External audio input routed to ring modulator
  - Three random CV outputs
  - Clock input and output to sync the module
  - CV control over internal clock
  - Skiff-friendly design
  - S&H circuit built around AS1100CK2
  - Audio output amplitude 10Vptp
  - CV output amplitude 0-10V or -5V to +5V
  - Panel width 14HP
  - Module depth 35mm
  - Power consumption 60mA (max)@+12V, 39mA@-12V
