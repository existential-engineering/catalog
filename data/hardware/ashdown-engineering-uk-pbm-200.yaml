description: UK-built, Ice Blue 200-watt micro bass head designed as the perfect
  Pocket Bass Magnifier. Lightweight and ultra-compact, it features a responsive
  3-band EQ, classic Pre-Shape, DI output, Headphone Out, and auto voltage for
  worldwide use. A clean, powerful, travel-friendly bass amp that delivers far
  beyond its size.
details: |-
  The Ashdown UK-PBM-200 "Ant" reimagines the compact bass amplification idea first introduced with the ANT, now rebuilt as a dedicated 200-watt micro head. Hand-assembled in the UK and finished in bold Ice Blue, it delivers impressive volume, clarity, and control in an exceptionally small format, compact enough to slip into a gig bag pocket. Tone control is handled by a responsive 3-band EQ, with the classic Pre-Shape switch applying a refined contour for mix-ready tone. A built-in DI output ensures reliable signal delivery for live and recording, while the Headphone Out makes it a compact practice solution. Auto-voltage operation adapts to international power supplies.
specs: |-
  - Power output @ 4 ohms: 196 watts RMS
  - Power output @ 8 ohms: 140 watts RMS
  - Mains input: 100-240V, 50/60Hz (auto-voltage)
  - 3-band EQ
  - Pre Shape switch
  - Hand-assembled in the UK
  - Dimensions (W x H x D): 210 x 62 x 118 mm
  - Weight: 1.5 kg
