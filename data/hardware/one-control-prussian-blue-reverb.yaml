description: A reverb pedal combining several classic reverb tones with a
  dynamic range five times broader than typical reverb pedals, using a 24-bit
  digital chip with an analog dry signal path. It features decay control and a
  Kill Dry switch for muting the dry signal.
details: |-
  Features Unlike other reverb pedals, that have a high octave and spring-like sound, the PRUSSIAN BLUE REVERB is a perfect combination of several classic reverb tones. With a dynamic range five times broader than your ordinary reverb pedal, a high-end natural sound is guaranteed. Specifications: Input impedance: 500 K Output impedance: 2K Drive voltage: 8 - 12 V Consumption current: 32mA S / N ratio: -96 dBm Size: 39 W x 100 D x 31 H mm (not including projections) 47 W x 100 D x 48 H mm (including projections) Weight: Approximately 160 g True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply Bjorn's Description The History A reverb effect simulates a mild reverberation that is created when a sound is reflected in space. Every sound the is emitted for any instrument instrument accompanies reverberation in space before reaching human ears. The PRUSSIAN BLUE REVERB creates an ideal and genuine reverberation. Acoustically, the most prestigious music venues are designed with the perfect reverberation in mind. Technologically, creators may use plates, springs and digital reverb in order to pursue the ideal reverberation. This reverb pedal is different from other effect pedals that cloned historical simulations and reverberation styles. I wanted to create a reverb effect that would be wanted by guitar and bass players. The Design What I didn't want to do was create an overbearing and powerful spring reverb or a reverb tone produced as a deluding effect at an higher octave. I wanted to pursue the ideal reverb tone but also wanted to highlight the instrument. The custom program is recorded on a 24-bit digital chip. Its dry signal is analog, which is not converted to digital. Ideal reverb tones for guitarists and bassists are neither spring, hall, nor room. I've created a mixture of all their strengths and brought them to the forefront. To put in more relative terms, it's closer to the hall tone than to spring but not as bright as hall reverb. See what I mean? By randomly modulating the decay time of reverb signals, it creates the effectsby which sounds spread in the space while remaining mono. This random modulation is programmed to imitate the string vibration property of guitars and basses. This is a property unique to the PRUSSIAN BLUE REVERB, different from the conventional reverb algorithm that creates layers of individually recorded reverberation. It is natural and solid but not too plain, and is most similar to "the" reverb tone players constantly seek. The Reverb The PRUSSIAN BLUE REVERB has the dynamic range that is five times larger than a general spring reverb. It is filtered to prevent it from having too much tremble or saturation. A broad dynamic range is essential to create an open spatial property. At the same time, decay control was added to prevent reverberation from interfering with rhythm. The decay control designed by BJF does not simply adjust the overall reverb length. The decay time can be set from 2ms to 2s. In simpler terms, choose between a soft reverberation or a long-lasting reverberation. This decay control combined with the natural reverb is similar to studio-grade reverb thanks to the technology present in this pedal. The PRUSSIAN BLUE REVERB's early reflection is set to be short. Thanks to the short duration between the guitar/bass attack to the reverb startup and the overwhelmingly natural reverb tone, unnatural reverb is simply not present in the final outputted sound. The PRUSSIAN BLUE REVERB allows you to mute a dry signal with the Kill Dry switch. While it is a common function among rackmount reverbs, it is also effective when it's connected to a parallel effects loop on some guitar amps and mixers. If you connect the PRUSSIAN BLUE REVERB with the Kill Dry on to the main signal chain, you can use it to create slow volume effects by setting the early reflection to short. It is important to note that it takes several seconds from the time the power is turned on until the digital chip inside is stabilized and starts running. The tone may become unstable during this period, so please maintain the bypass for several seconds after connecting an adapter. This pedal is designed for guitars and basses. It is not only suitable for electric guitars and basses but also for acoustic guitars and basses as well. PBR provides the best sound when it's connected after distortion effects and before tremolo effects. When developing reverb effects, I always put the guitarists' vision first, not mine. For this reason, I chose a balanced reverb tone and added more precise decay control that will not interfere with the rhythm. I was confident but when I actually heard the tone of the PRUSSIAN BLUE REVERB made, I was speechless. It's as though the sound travels in an unlimited space which gives you endless creative opportunities. ou can say that there is unlimited space expanding in this small pedal. - Bjorn Juhl

