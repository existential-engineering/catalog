url: https://www.dangerousmusic.com/product/convert-8
description: Whether you're tracking, mixing or mastering, the CONVERT-8 will
  deliver powerful low-end, articulate mids, and transcendent highs to every
  channel in your rig.
details: |-
  Whether you're tracking, mixing or mastering, the CONVERT-8 will deliver powerful low-end, articulate mids and transcendent highs to every channel in your analog rig. Patched into an analog summing unit like the 2-BUS+ or the D-BOX+ (or a favorite analog console), the CONVERT-8 empowers spacious, three-dimensional soundscapes. Compatible with today's digital signals including ADAT, ready for stereo, 2.1, 5.1 and Atmos.

  Dangerous has been building award-winning, standard-setting converters since 2002 when the Dangerous Monitor's onboard digital-to-analog converter swiftly became the industry reference. The CONVERT-8 was designed from the ground up, coupled to a Chris Muth designed analog circuit delivering the Dangerous signature sound.

  Digital guru Paul Messick rigorously refined the CONVERT's JetPLL ultra-low jitter clocking technology. Set the Word Clock output and put the CONVERT into Master mode from the front panel, and all digital gear in a studio can benefit from the CONVERT's Jitter Elimination Technology (JET) clock.
specs: |-
  - Signal to Noise Ratio (A-weighted, 20Hz-20kHz): < 114dB
  - Dynamic Range (A-weighted, 20Hz-20kHz): < 114dB
  - THD+N @ 1kHz, unweighted, +4dBu out: < 94.5dB (0.00188%)
  - Frequency Response @ 96kHz sample rate: DC-20kHz +0/-0.25dB
  - Jitter: 16ps (100Hz-40kHz), 18ps (100Hz-1MHz)
  - Crosstalk rejection: > 114dBu @ 1kHz
  - Automatic Sample Rate Detection with Auto mode
  - Instant Input Calibration at -14, -16, -18dBFS reference levels
  - On-the-fly switching between USB, AES/SPDIF, ADAT and Optical SPDIF inputs
  - 8-channel LED metering with 3-word-over clipping indicator
  - Word Clock output with Normal, External, and Master clock modes
  - JetPLL ultra-low jitter clocking technology (licensed from Sonopsis)
