name: HEDDphone TWO
manufacturer: hedd
primaryCategory: headphones
url: https://hedd.audio/products/heddphone-two
description: The HEDDphone TWO is an open-back over-ear headphone whose
  full-range Air Motion Transformer driver and adjustable strap system were
  refined over three years of R&D to be lighter, more comfortable, and more
  lifelike than the original HEDDphone.
details: |-
  The culmination of three years of relentless R&D based on user feedback, every aspect of the HEDDphone has been improved to deliver an audio experience unlike any other. The HEDDphone TWO uses ultra-light materials and features an upgraded strap system, letting you personalize height, width, curvature, and clamping pressure, making it more comfortable for prolonged use.

  The Air Motion Transformer has been refined to deliver more vivid, lifelike audio. Built around a full-range AMT with VVT technology and a Kapton polyimide diaphragm, the open-back design reproduces frequencies from 10 Hz to 40 kHz. At 550g it is significantly lighter than the original HEDDphone.

  Each unit ships with a 2.2m headphone cable terminated in 6.35mm and a 2.2m balanced cable terminated in 4.4mm, along with a 3-pin 6.35mm-to-3.5mm adapter and a 4-pin balanced 4.4mm-to-XLR adapter. Spare earpads and a travel case are included. An UNPLUGGED configuration is available without cables.
specs: |-
  - Design: Open-back over-ear headphone
  - Drivers: Air Motion Transformer with VVT technology and Kapton polyimide diaphragm
  - Frequency Range: 10 Hz - 40 kHz
  - Maximum SPL: 89 dB SPL at 1 mW
  - Impedance: 41 Ω flat
  - Power: Min. 200 mW, recommended ≥1000 mW
  - Inputs: 3.5mm jack
  - Cable: Kevlar-infused, braided
  - Pads: Faux leather ear pads and head cushion
  - Weight: 550g
