url: https://www.klipsch.com/products/miami-party-speaker
description: The Klipsch Miami is a portable party speaker featuring a
  horn-loaded compression tweeter, dual 5.25" woofers, and custom front ports
  for powerful, clear sound. It offers up to 18 hours of battery life, IPX4
  splash resistance, RGB lighting, and mic/instrument inputs for karaoke and
  live performance use.
details: |-
  The Klipsch Miami is built around Klipsch's proprietary horn-loaded compression tweeter paired with dual 5.25" woofers and custom front ports, delivering the brand's signature efficient, high-output sound in a portable form factor. The cabinet rides on durable trolley wheels with a built-in carry handle, and supports pole mounting for elevated placement.

  Power is supplied by an internal battery rated for up to 18 hours of playback with lights off, or up to 10 hours with the RGB lighting active. Five light show patterns are available and fully controllable via the Klipsch Connect Plus app for iOS and Android, which also provides EQ customization (bass, treble, echo), Ultra Bass mode for enhanced low-frequency output, and DJ-style controls.

  Party Link lets multiple Miami (and compatible Klipsch party speaker) units sync together wirelessly through the app. The speaker carries an IPX4 splash rating for outdoor and poolside use. Recognized as a Gear Patrol Best of CES 2025 product.
