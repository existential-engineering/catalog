details: |-
  The DP7X professional drum microphone pack builds on the proven success of the bestselling DP7 by replacing the D6 kick drum mic with the new D6X for exceptional tonal versatility, both onstage and in the studio.

  The D6X, AUDIX's next-generation kick drum microphone, anchors the potential of this drum mic pack with three selectable voicings — Deep (classic D6 sound), Balanced (increased mid and upper-mid frequencies), and Natural (linear response) — for expanded control and wider frequency latitude.

  Also included are two D2 dynamic drum microphones for rack toms, one D4 for floor tom, the i5 for snare, two ADX51 studio condenser microphones for overhead or hi-hat miking, four D-Vice rim mount clips for snare and tom microphones, plus three heavy-duty tension-fit microphone clips for the remaining microphones.

  Everything is conveniently packaged in a foam-lined protective case for protection, storage, and transport when the microphones are not in use.
specs: |-
  - Includes: 1x D6X (Deep/Balanced/Natural voicings), 2x D2, 1x D4, 1x i5 (dynamic), 2x ADX51 studio condenser
  - Included mounts: 4x D-Vice rim mounts, 3x tension-fit mic clips
  - Included case: Foam-lined protective case
