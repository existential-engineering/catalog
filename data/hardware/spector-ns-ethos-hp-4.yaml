details: |-
  For decades, Spector has been synonymous with streamlined, neck-thru bass instruments that have redefined the essence of modern bass tone. Now, we proudly introduce the NS Ethos HP basses, the high-performance additions to our beloved NS Ethos line, inspired by the timeless legacy of our classic 4- and 5-string basses. Rooted in the lineage of iconic Spectors played by renowned artists such as Sting, Jason Newsted, Rex Brown, and Alex Webster, HP basses propel us into the future of Spector design. These instruments boast 3-piece maple necks, with ebony fingerboards, that traverse the entire length of the instruments, joined by two sculpted alder wings. A combination of EMG DC pickups and Darkglass Tone Capsule preamps deliver the perfect fusion of power and clarity. With your choice of White Sparkle, Solid Black, Plum Crazy, and Gunmetal gloss finishes, these basses always look the part.
