description: Open-back, on-ear dynamic headphones from Grado's Classic Series
  featuring a tri-wood housing of Cocobolo, hemp, and maple. Built around
  Grado's 50mm X2 dynamic driver with a Signature Gold headband assembly and
  Signature Silver cable.
details: |-
  At the center of the RS1 is Grado's 50mm X2 dynamic driver utilizing a Mylar diaphragm, copper voice coil, and rare earth magnetic system. The tuning emphasizes expressive midrange detail and musical immediacy.

  The RS1 features a tri-wood housing constructed from Cocobolo, hemp, and maple. Each material contributes unique acoustic properties combining density, damping, and structural stability to create a layered and controlled presentation.

  The headband features engraved aluminum alloy gimbals, stainless steel height rods, and reinforced aluminum junction blocks designed to improve structural stability and durability while maintaining controlled rotation for proper alignment. A genuine leather headstrap with contrasting white stitching provides comfort, and an internal steel spring band allows users to adjust clamping pressure for a personalized fit.

  The RS1 ships standard with Grado L cushions reinforcing a focused and immediate presentation. Like all Grado cushions they also act as a tuning element allowing listeners to personalize their listening experience.

  The RS1 is supplied with Grado's Signature Silver cable offering reduced weight and improved flexibility.
specs: |-
