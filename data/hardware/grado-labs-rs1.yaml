  - Driver: 50mm X2 dynamic driver
  - Diaphragm: Mylar
  - Voice Coil: Copper
  - Magnetic System: Rare Earth
  - Ear Cushions: L Cushions
  - Cable: Signature Silver Cable
  - Source Connection: 3.5 mm (1/4 inch adapter included)
  - Headband: Signature Gold assembly with aluminum alloy gimbals and stainless steel rods
  - Headstrap: Genuine leather with white stitching
  - Housing: Tri-wood (Cocobolo, hemp, maple)
