description: >-
  The EMS Synthi Sequencer 256 is a pioneering standalone digital sequencer from 1971, featuring
  a 5-octave velocity-sensitive keyboard and the ability to record and overdub across three
  independent layers with CV/Gate output.
details: |-
  Originally called the Synthi Moog Sequencer, the Synthi Sequencer 256 debuted in 1971 as a
  standalone version of the digital sequencer found in the larger Synthi 100 system. It was
  considered the most advanced sequencer of its time, combining analog-to-digital and digital-
  to-analog converters for digital processing of control voltages.

  The musician-friendly interface set it apart from contemporary sequencers. Housed in a wooden
  enclosure with a full 5-octave velocity-sensitive keyboard, users created sequences simply by
  playing notes, capturing timing, pitch, and duration as performed. Velocity information could
  be recorded as two voltages per event for pitch and velocity data, with the second voltage
  usable for filter modulation or other parameter control.

  Three independent layers allowed sequencing multiple instruments simultaneously or controlling
  multiple parameters of a single instrument. Previously recorded layers played back during new
  recordings, enabling real-time overdubbing. A fourth specialized layer contained only pulse
  data for timing applications like creating loops or sending clock signals to external equipment.

  Editing capabilities were sophisticated for the era: sequences could be fast-forwarded, rewound,
  or stepped through individually, and specific notes could be isolated for deletion or
  modification without affecting surrounding events. The CV/Gate output included automatic offset
  adjustment for compatibility with synthesizers from Arp, Moog, Sequential, and other
  manufacturers.
specs: |-
  - Sequencer: 256 events, plays forwards and backwards
  - Data per Event: 2x 6-bit control voltages, 13-bit start/stop timing
  - Layers: 3 recording layers plus 1 clock pulse layer
  - Clock: Internal (0.1-200 Hz) or external
  - Keyboard: 5-octave velocity-sensitive
  - Memory: 256 events x 42 bits
  - Control: CV/Gate with automatic offset adjustment
