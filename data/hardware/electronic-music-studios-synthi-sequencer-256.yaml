description: >-
  The Synthi Sequencer 256 is a standalone digital sequencer released by Electronic Music
  Studios (EMS) in 1971, derived from the Synthi 100 synthesizer. It features
  analog-to-digital and digital-to-analog converters to process control voltages for
  operating analog synthesizers, housed in a wooden case with a full 5-octave
  velocity-sensitive keyboard.
details: |-
  Originally marketed as the Synthi Moog Sequencer, the Sequencer 256 represented a major advancement in sequencing technology during the early 1970s. At a time when synthesizers were often engineer-focused rather than musician-oriented, the Sequencer 256 offered an intuitive approach: performers could create sequences simply by playing notes on the keyboard, mirroring modern MIDI sequencing practices decades before digital MIDI became standard.

  The device could store up to 256 events, with each event capturing two 6-bit control voltages — one for pitch and one for velocity. This dual-voltage system enabled sophisticated control possibilities, allowing users to manipulate parameters beyond pitch, such as filter cutoff. An offset control automatically calibrated the output to work with various synthesizer brands including ARP, Moog, and Sequential, ensuring broad compatibility.

  A distinctive feature was its three-track architecture plus a fourth clock-only track, enabling real-time overdubbing and layering. Musicians could record a performance on one track, then add filter modulation on a second track and a backing part on a third, all executed in real-time. The sequencer offered robust editing capabilities — users could fast-forward, rewind, or step through sequences one note at a time, modifying individual notes without affecting surrounding data.
specs: |-
  - Polyphony: N/A
  - Oscillators: None
  - Filter: None
  - Envelope: None
  - Effects: None
  - Sequencer: Plays forwards and backwards; 2 x 6-bit control voltages per event; 13-bit start and stop times
  - Tracks: 3 layers plus clock pulse-only layer
  - Keyboard: 5-octave velocity-sensitive
  - Memory: 256 events x 42-bit
  - Control: CV/Gate
  - Internal Clock: 0.1-200 Hz with external clock option
releaseDate: "1971"
