description: Updated for 2026 with a killer new Black Satin finish, the LTD MT-I is the Signature Series guitar for Mick Thomson, the iconic guitarist of Slipknot. Features an MH-style body with arched top, inline reverse headstock, set-thru construction, Graph Tech TUSQ XL nut, Hipshot Grip-Lock locking tuners, all-brass Hipshot Hi-Mass hardtail bridge, blue Luminlay side markers, and a Fishman Fluence Mick Thomson Signature pickup with multi-voice selection. Includes deluxe ESP hardshell case.
details: |-
  Updated for 2026 with a killer new Black Satin finish, the LTD MT-I is the Signature Series guitar for Mick Thomson, the iconic guitarist of Slipknot. The MT-I is based on the MH-style body, with an arched top and an inline reverse headstock.

  This outstanding guitar features set-thru construction at 25.5" scale, pairing a mahogany body with white ash top to a three-piece maple neck with a flawless, smooth Macassar ebony fingerboard with compound radius and 24 medium-jumbo stainless steel frets.

  Based on Mick's precise requirements, the MT-I has a set of special, unique features not found on any other LTD guitar model, including a Graph Tech TUSQ XL nut, Hipshot Grip-Lock locking open gear tuners, an all-brass Hipshot Hi-Mass hardtail bridge, blue Luminlay side markers, and a Fishman Fluence Mick Thomson Signature pickup with a 3-way low profile toggle switch to select between Voice 1, Voice 1 with bass boost shift, and Voice 2, and a push/pull volume control to select Voice 3. Includes deluxe ESP hardshell case.

  Finish: Black Satin. Series: Signature Series Guitars (Mick Thomson). New for 2026.
specs: |-
  - Construction: Set-Thru
  - Scale: 25.5"
  - Body: Mahogany
  - Top: White Ash
  - Neck: 3Pc Maple
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 300-400mm Compound
  - Finish: Black Satin
  - Nut Width: 42mm
  - Nut Type: Graph Tech TUSQ XL
  - Neck Contour: Thin U
  - Frets/Type: 24 MJ Stainless Steel
  - Hardware Color: Black
  - Strap Button: Gotoh Locking
  - Tuners: Hipshot Grip-Lock Open
  - Bridge: Hipshot Ibby HM w/ String Thru
  - Bridge PU: Fishman Fluence Mick Thomson Signature (toggle for Voice 1, Voice 1 w/ bass shift, Voice 2; pull volume for Voice 3)
  - Electronics Layout: Volume (Push/Pull) / Toggle Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
  - Case: MH Guitar Form Fit Case (included)
