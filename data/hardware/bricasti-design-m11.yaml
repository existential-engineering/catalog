id: ZoZIuOVzCfeLKfSRQEGbC
name: M11 R2R D/A Converter
manufacturer: bricasti-design
primaryCategory: outboard
categories:
  - rack-mount
url: https://bricasti.com/en/consumer/m11.php
description: The Bricasti M11 is a resistor ladder (R2R) D/A converter
  concentrating ladder D/A technology from the flagship M21, featuring the MDx
  digital platform with native signal processing and a fully differential output
  design, supporting PCM up to 384kHz and DSD via USB.
specs: |-
  - D/A conversion: 20-bit ladder type (R2R)
  - Digital inputs AES/S/PDIF: 44.1kHz to 192kHz
  - Digital inputs USB: 44.1kHz to 384kHz PCM, DSD 64/128/256fs Native or DoP
  - Optional Ethernet network player: 44.1–384kHz PCM, DSD 64x/128x
  - Jitter: 8 psec @ 48kHz / 6 psec @ 96kHz
  - Output impedance: 40 ohm
  - Frequency response: 10Hz–20kHz +0dB / -0.2dB at 44.1kHz
  - Dynamic range: >120dB A-weighted
  - THD+N: 0.0020% @ 0dBFS / 1kHz
  - Output level: +8 to +22 dBm adjustable, or +13.5 dBm fixed
  - Dimensions: 17" x 12" x 2"
  - Weight: 15 lbs
  - Power: 28W (6W standby), 100/120/220/240 VAC, 50–60Hz
  - Handcrafted in Massachusetts, USA
