description: "True stereo reverb pedal featuring 16 all-new reverb effects
  leveraging IK Multimedia's latest AmpliTube technologies, with matching
  virtual version for AmpliTube 5."
details: |-
  The X-SPACE is a true stereo reverb pedal from the X-GEAR series, featuring 16 all-new reverb algorithms: Shimmer 1, Shimmer 2, Hall, Room, Chamber, Church, Plate, Spring, Swell, Gate, Reverse, Early-Ref, Extreme, Ethereal, Bloom, and Magnetic. It stores 50 factory presets with 300 total preset slots available.

  The pedal maintains a pure analog dry path for uncompromised tone, with selectable true bypass or soft bypass and full spillover support. X Mode enables expanded parameter control for deeper sound design. The control surface includes 3 knobs, 3 footswitches, and an 8-character 16-segment display. 5 cabinet impulse responses are included.

  Built in an anodized aluminum chassis with true stereo I/O, MIDI In/Out, expression pedal input, and USB connectivity for the X-GEAR Librarian. Includes a matching virtual X-SPACE plugin for AmpliTube 5 and AmpliTube 5 SE software.
specs: |-
  - Ultra-low noise 24-bit/192 kHz converters
  - Frequency response: 5 Hz - 24 kHz
  - Dynamic range: 112 dB
  - 16 reverb algorithms
  - 50 factory presets, 300 total storable
  - Selectable true or soft bypass
  - Pure analog dry path
  - True stereo inputs and outputs
  - 5 cabinet impulse responses
  - 8-character 16-segment LCD display
  - 3 footswitches
  - Anodized aluminum chassis
  - Dimensions: 175 x 145 x 58 mm (6.88" x 5.7" x 2.28")
  - Weight: 906 g (31.96 oz)
  - Power: 9V DC center-negative (PSU included)
