description: Paraphonic analog and semi-modular synthesizer with dual 3340 VCOs,
  a multi-mode 12 dB state variable filter, 2 ADSRs, BBD delay and an overdrive
  circuit in a Eurorack format. Default routings mean no patching is needed to
  play it, while a 32 in / 24 out jack matrix opens the signal path up for
  modular patching.
details: |-
  The 1970s and '80s spawned the first wave of portable analog synthesizers, and while quickly adopted by a bevy of renowned musical artists including Jan Hammer, Chick Corea, Rick Wakeman, Jean-Michel Jarre, Isao Tomita and Keith Emerson to name a few, they were somewhat temperamental and very expensive. An updated incarnation of its predecessors with all the original features and then some, the Neutron lets you conjure up virtually any monophonic sound imaginable with incredible finesse and ease. The pure analog signal path is based on authentic VCO, VCF, VCA and state variable filter designs in conjunction with a flexible, multi-wave LFO and classic Bucket Brigade Delay (BBD). Neutron's Paraphonic mode allows both 3340 analog oscillators to be independently controlled for an expanded palette of tonal options.

  Semi-Modular Design

  Designed around an intuitively-linear workflow, Neutron benefits greatly from its semi-modular design, which requires no patching for immediate performance. Just put your Neutron into self-oscillation, connect your favorite keyboard or computer via MIDI over DIN or USB, and start exploring the world of analog music synthesis right out-of-the-box.

  VCO Double Play

  Neutron's highly-flexible dual Voltage Controlled Oscillators (VCOs) provide an incredible range using 5 unique waveforms for sculpting the perfect sound. Oscillators 1 and 2 options include: Tone Mod; Square; Sawtooth; Triangular or Sine; which can be adjusted across an extremely-wide, 3-octave range (32', 16', 8').

  12 dB State Variable Filter and VCA

  The very heart of Neutron's sound is its highly-flexible 12 dB State Variable Filter, which lets you freely experiment with the cutoff Frequency (10 Hz - 15 kHz), Modulation and Envelope Depth to dial in the perfect sound. Neutron's Filter Mode switch provides 3 settings (high pass, band pass and low pass) for a broad range of tonal options. Additionally, support for filter Keytracking enables you to select the amount of filtering that is applied to the note being played. The VCA can even be overloaded via Neutron's Overdrive circuit to add spice and edge to your sounds, without saying goodbye to your precious low-end content.

  Runaway Brigade

  The all-analog, bucket-brigade circuit inside Neutron provides 25 - 640 ms of delay time. At lower time settings, your echoes will be crisp and punchy, but at longer settings, you'll experience the natural high-end roll-off that is the hallmark of a great analog delay. And when you max out the repeats, you get a full dose of self-oscillation, for runaway delay strings.

  Eurorack Ready

  Designed to handle the rigors of life on the road or in the studio, your Neutron can easily be transferred into a standard Eurorack 80HP case for integration into an existing system.
specs: |-
  - Paraphonic synthesizer with dual authentic 3340 analog oscillators
  - Pure analog signal path with VCO, VCF and VCA circuits
  - Oscillator waveform control blends between 5 shapes: tone mod, pulse, sawtooth, triangle, sine
  - Individual pulse width / tone mod control per oscillator
  - Oscillator range: 3 octaves (32', 16', 8')
  - Paraphonic mode allows both oscillators to be independently controlled
  - Self-oscillating, multi-mode 12 dB state variable VCF with dual output (e.g. LP+HP available on jacks)
  - Filter cutoff frequency range: 10 Hz - 15 kHz
  - Filter modes: high pass, band pass, low pass, with keytracking
  - 2 analog ADSR envelope generators for modulation of VCF and VCA
  - Multiple stage analog delay based on BBD (Bucket Brigade Delay) technology, 25 - 640 ms
  - Flexible LFO with five waveform shapes, MIDI clock sync and key sync
  - Noise generator
  - Overdrive circuit
  - Patchable audio-rate sample and hold with glide
  - Utility functions including attenuators, multiples, slew rate limiter and summers
  - 36 knobs and 7 switches
  - 32 in / 24 out jack matrix on TS 1/8 inch (3.5 mm) connections
  - Headphone output with dedicated level control
  - External audio input for processing external sound sources
  - MIDI I/O and Thru over USB / MIDI DIN
  - Semi-modular architecture with default routings requires no patching for immediate performance
  - Mountable in a standard 80 HP Eurorack case
  - Firmware updatable, current release 2.0.3, with a Neutron Companion Application for macOS and Windows (version 1.0.3)
