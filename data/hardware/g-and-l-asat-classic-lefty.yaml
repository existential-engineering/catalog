details: |-
  The G&L ASAT Classic is Leo's final word on the traditional single-cutaway bolt-on axe. Framed in a classic boxed-steel bridge, the single-coil Magnetic Field Design bridge pickup created by Leo Fender delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the single-coil MFD neck pickup opens a delectably rich tonal palette, from round clean jazz tones to thick, gritty blues. Put together, the two pickups reach a whole other level of heaven.

  The Tribute Series ASAT Classic is dripping with Leo mojo at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Sassafras
  - Neck wood: Hard-Rock Maple with Maple fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 9-1/2"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Available in: LEFT-HAND in 3-Tone Sunburst over Swamp Ash top on Poplar, 1-ply white pickguard, Maple fingerboard
