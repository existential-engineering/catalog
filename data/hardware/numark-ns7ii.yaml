url: https://www.numark.com/product/ns7ii
description: NS7II 4-Channel Motorized DJ Controller and Mixer with 7-inch
  motorized turntables, real vinyl and slipmats, capacitive touch knobs, and 16
  multi-color MPC pads from Akai Professional.
details: |-
  Four channels of mixing, real slip mats and vinyl, motorized turntables, and a full array of touch-activated knobs and filters and velocity-sensitive performance pads make the Numark NS7II 4-Channel Motorized DJ Controller a benchmark for performance DJ controllers.

  The NS7II features dual 7-inch motorized turntables with ultra-high-resolution MIDI (3600 ticks per rotation), genuine vinyl discs, and real felt slipmats. It includes 16 multi-color MPC pads from Akai Professional, capacitive touch-sensitive filter, EQ, and effects knobs, and a curve-adjustable CP-Pro crossfader. The 4-channel mixer integrates a 24-bit audio interface, dedicated iZotope effects controls, and Strip Search virtual needle-drop technology, all wrapped in all-metal construction.

  The NS7II ships with Serato DJ software (download) and includes a power cable, USB cable, two turntable platters, spindle wrench, spindle screw, Allen wrench, user guide, and safety & warranty manual.
specs: |-
  - 7-inch motorized turntables with ultra-high-resolution MIDI (3600 ticks per rotation)
  - 16 multi-color MPC pads from Akai Professional
  - Capacitive touch-sensitive filter, EQ, and effects knobs
  - Genuine vinyl discs and real felt slipmats
  - 4-channel mixer with 24-bit audio interface
  - Strip Search virtual needle-drop technology
  - Curve-adjustable CP-Pro crossfader
  - Dedicated iZotope effects controls
  - All-metal construction
  - Sample Rate: 44.1 kHz
  - Bit Depth: 24-bit
  - Dimensions: 30 x 15.9 x 4.2 inches (762 x 403 x 106.7 mm)
  - Weight: 33.7 lbs (15.3 kg)
  - Includes Serato DJ software (download)
