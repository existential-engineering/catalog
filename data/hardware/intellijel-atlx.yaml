description: Patching Heaven Adds 14 dedicated ouputs and a Ring Mod to the
  already powerful Atlantix module.
details: |-
  The Atlx expander provides 16 additional jacks to the Atlantix, including: dedicated waveform outputs for A and B oscillators, filter outputs, and a ring modulator. Atlx adds many new possibilities for self-patching, advanced routing and connections to other modules.

  Filter Outs: Lowpass, Highpass, Bandpass, Phazor.

  Ring Mod: X In, Y In, RING Out.

  Oscillators A/B Outs: Sine, Triangle, Saw, Square (w/ PWM on A), Sub Square (A only).
specs: |-
  - Width: 6HP
  - Depth: 22mm
  - Power: Passive
  - 16 additional jacks: 4 Filter Outs (Lowpass, Highpass, Bandpass, Phazor), 3 Ring Mod (X In, Y In, RING Out), 9 Oscillator A/B Outs (Sine, Triangle, Saw, Square, Sub Square on A only)
