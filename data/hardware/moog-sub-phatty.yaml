description: >-
  The Moog Sub Phatty is a compact monophonic analog synthesizer released by Moog in 2013
  as the successor to the Little Phatty. It was the first Moog synth to feature a
  multidrive circuit, giving it a reputation as their grittiest-sounding instrument while
  remaining one of their most affordable analog offerings.
details: |-
  The Sub Phatty succeeded the Little Phatty while incorporating design elements from the Moog Minitaur bass synthesizer. Its signal path features two voltage-controlled oscillators, a classic Moog ladder filter, a VCA, two envelope generators, and an LFO, delivering the rich analog sound Moog is known for. The inclusion of a multidrive circuit was a first for Moog and gives the Sub Phatty a distinctively aggressive tonal character.

  The front panel provides 31 knobs for hands-on control of all primary synthesis parameters, with no digital display. A Shift Mode unlocks access to 51 additional hidden parameters, dramatically expanding the sonic possibilities beyond the panel controls. The synth ships with 16 factory presets covering punchy leads and deep basses, and Moog later released free patch editor and librarian software for deeper sound management.

  Built with 25 full-size velocity-sensitive keys and standard pitch-bend and modulation wheels, the Sub Phatty is designed for both studio use and live performance. Its compact footprint makes it well-suited to space-limited setups without sacrificing the playability and build quality expected from Moog.
specs: |-
  - Polyphony: 1 voice (monophonic)
  - Oscillators: 2 VCOs plus sub oscillator
  - Waveforms: Sawtooth, square, pulse (variable width), triangle, white noise
  - Filter: Moog ladder filter with 6dB, 12dB (2-pole), 18dB, and 24dB (4-pole) slopes
  - Envelopes: 2 ADSR envelope generators
  - LFO: 1 with multiple waveforms
  - VCA: 1 with ADSR, freerun, looping, and triggered modes
  - Multidrive circuit
  - Memory: 16 preset patches
  - Keyboard: 25 full-size velocity-sensitive keys
  - Controls: 31 knobs, pitch bend and modulation wheels
  - Shift Mode: 51 additional hidden parameters
  - Connectivity: MIDI in/out, USB
  - Multitimbral: 1 part
