details: |-
  This listing is for the assembled module only, which requires a Eurorack case and power supply. The standalone version (module + enclosure) can be found here . An enclosure for the standalone option is available separately here . New version with DC power input (in addition to the Eurorack 10pin power connector). CBV001 is a circuit bent video enhancer meant to process Composite video. It generates effects ranging from soft color shifts to heavy distortion, with a CV input and attenuator allowing to control the contrast with an external control voltage. NTSC/PAL compatible. Assembled module, comes with a 16-to-10pin power cable. - 12HP
  - 30mA +12V
  - 0mA -12V
  - 0mA +5V
  - 25mm deep

