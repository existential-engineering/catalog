description: Custom Shop compressor and two-mode overdrive, with silicon or
  germanium drive voicings, clean blend and tone controls, switchable effect
  order and TRS inserts.
details: |-
  The Red Dirt Studio Deluxe places a Keeley compressor and a two-mode overdrive in a single enclosure. The overdrive side selects between a silicon diode mode and a double germanium diode mode, the germanium setting giving smoother gain, higher compression and more saturation for lead work. The compressor side adds a clean blend control, for mixing any amount of clean signal back in for chord work, and a tone control for brightening the highs.

  The order of the two halves can be switched. Compression ahead of the drive holds a consistent gain level and reduces static noise at idle, while compression after the drive gives a warmer, rounder tone with more sustain. Each half carries enough output level to boost and push an amplifier, and each has its own tone shaping controls.

  TRS insert jacks divide the pedal into two separately usable sections, so other effects such as phasers, wahs or further dirt boxes can be patched between the compressor and the drive. The same jacks let a pedal switcher control each side independently over TRS cables.
specs: |-
  - Two overdrive modes, silicon diodes or double germanium diodes
  - Compressor section with clean blend and tone controls
  - Switchable effect order between compressor and drive sections
  - TRS insert jacks for patching effects between the two sections
  - TRS connection for independent switching of each side from a pedal switcher
