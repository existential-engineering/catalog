description: The Klipsch RP-500C II is a center channel speaker from the
  Reference Premiere series, featuring dual 5.25" Cerametallic cone woofers, a
  1" titanium LTS vented tweeter, and a 90° x 90° silicone composite hybrid
  Tractrix horn for highly efficient, detailed high-frequency reproduction.
details: |-
  The RP-500C II is built around Klipsch's second-generation 90° x 90° silicone composite hybrid Tractrix horn, which increases horn size over the previous generation for a larger soundstage and enhanced directivity. The proprietary Tractrix geometry maximizes efficiency in transferring high-frequency waves toward the listening area, while the phase plug and compressed molded silicon face ensure smooth frequency response.

  The 1" Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for detailed performance. The vented tweeter housing further reduces standing waves and unwanted harmonics, resulting in enhanced clarity in high-frequency reproduction.

  Dual 5.25" Cerametallic cone woofers feature an all-new design with aluminum shorting (Faraday) rings to reduce distortion, increased power handling, and a new motor structure for improved transient response with greater speed and accuracy. The rear-firing Tractrix port allows for efficient, fast air transfer from the MDF cabinet, reducing port noise for punchier, cleaner bass.

  The cabinet uses furniture-grade materials with ebony or walnut vinyl finishes and satin-painted baffles with a scratch-resistant finish. A magnetically attached, removable grille and cork pad feet complete the design.
