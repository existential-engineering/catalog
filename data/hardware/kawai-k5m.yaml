description: >-
  A rack-mount digital additive synthesizer from 1987 that provides 126 individually controllable
  harmonics per voice, offering deep timbral complexity in a compact sound module format.
details: |-
  The Kawai K5m is the rack-mount version of the K5 keyboard, employing additive synthesis as its
  primary method of sound creation. Each voice features a Digital Harmonic Generator with up to 126
  individually adjustable harmonics, giving sound designers an extraordinary level of timbral control
  that few synthesizers of its era could match.

  Sound shaping extends well beyond basic harmonic manipulation. Each harmonic can be assigned an
  independent six-stage envelope, and the instrument includes both a Dynamic Digital Filter with
  analog-style parameters and an 11-band Digital Formant Filter for graphic EQ-style sculpting. The
  15-part multitimbral architecture supports sophisticated layering, splitting, and overlapping of
  sounds across four assignable audio outputs plus a stereo mix output.

  The K5m's primary challenge lies in its user interface, which makes deep programming particularly
  difficult without external editor software. The relationship between envelopes and harmonics can be
  opaque, and coaxing the best results from the instrument requires considerable patience and
  experimentation.

  Notable users include Jan Hammer on the K5m and Jean Michel Jarre on the keyboard version.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: Digital Harmonic Generator (126 harmonics)
  - LFO: 6 waveforms with speed, delay, trend
  - Filter: Dynamic Digital Filter with 6-stage envelope
  - Formant Filter: 11-band graphic EQ
  - VCA: Dynamic Digital Amplifier with independent 6-stage envelopes
  - Memory: 48 internal patches, 48 external patches, 48 multi-mode memories
  - Outputs: 4 assignable plus stereo mix
  - Control: MIDI In/Out/Thru
releaseDate: "1987"
