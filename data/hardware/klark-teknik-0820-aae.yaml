details: |-
  The DN71 is an auxiliary effects unit from Klark Teknik's late-1970s digital processing era, built as a companion to the DN70 digital time processor. The pair were usually deployed together to widen the creative palette of early digital signal processing in broadcast and studio work.

  It belongs to the same lineage that produced the DN780 reverb, the DN70 time processor and the DN700-series delay lines, the formative period in which Klark Teknik established itself as a digital outboard specialist. The unit is now a vintage instrument, current-specification documentation is limited, and surviving examples are typically maintained for historical or character-specific applications rather than utility processing.

  Typical use is vintage broadcast and studio work where the auxiliary effects palette of the late-1970s Klark Teknik range is the sonic reference being sought.
specs: |-
  - DN-series auxiliary effects unit
  - Rackmount chassis
  - Balanced analogue input and output
  - Companion to the DN70 digital time processor
  - Designed and built in the United Kingdom
