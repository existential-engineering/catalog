description: >-
  The ARP 2600 is a semi-modular monophonic analog synthesizer produced from 1971-1980
  that became one of the finest analog synthesizers ever made, offering both preset signal
  routing and customizable patch-cord flexibility.
details: |-
  ARP's 2600 was designed as a more compact, stable, and intuitive alternative to custom modular systems from competitors like Moog. Rather than requiring individual module selection and assembly, the 2600 featured a fixed selection of basic synthesis modules with internal pre-wiring and clearly labeled patch-points for modification.

  The synthesizer's architecture includes three oscillators, a 24 dB/octave filter, ADSR envelope generator, VCA, mixer section, envelope follower, ring modulator, noise generator, LFO with sample-and-hold, built-in spring reverb, and pre-amplifier with stereo speakers. This comprehensive analog signal path enabled truly expressive and musical sound design through creative patching or standard internal routing.

  Produced across four model generations, the 2600 underwent several revisions between 1971 and 1980 due to reliability concerns and legal disputes. Early models like the Blue Marvin and Gray Meanie featured superior-sounding but unreliable VCO chips, while later versions improved stability with different components but at the cost of sound quality. Approximately 3,000 units total were produced.

  The 2600 gained widespread adoption across diverse musical genres and artists including Orbital, Weather Report, Joy Division, Depeche Mode, and Nine Inch Nails. It was even employed at Skywalker Sound for creating R2D2's vocalizations, cementing its status as a landmark synthesizer that continues influencing modern hardware and software emulations.
specs: |-
  - Polyphony: Monophonic
  - 3 VCOs (variable waveforms)
  - 24 dB/octave lowpass filter, self-oscillating
  - ADSR and AR envelope generators
  - Patchable LFO with sample and hold
  - Ring modulator (AC or DC coupled)
  - White noise generator with variable coloration
  - Built-in spring reverb
  - Envelope follower
  - Remote keyboard with 49 keys
  - CV/GATE control
  - Stereo speaker output
  - Production: 1971–1980
