description: >-
  The Fugue is a rare dual-section synthesizer built for Sequential Circuits by
  Italian organ maker Siel, combining a polyphonic string section with a
  monophonic analog synth in a single keyboard instrument.
details: |-
  The Fugue occupies an unusual place in Sequential Circuits' history. Released during the early 1980s when Sequential was still a relatively small company, they lacked the resources to build a compact mono/poly synth in-house. They turned to Siel, an Italian organ manufacturer, to produce it. In Europe the same instrument was marketed as the Siel Cruise.

  What makes the Fugue distinctive is its dual-synth architecture. The polyphonic section provides 49 voices with preset timbres including Piano, Clavi, Cello, Violin, Brass, Organ, and Pipe Organ sounds that can be freely combined. The monophonic section offers 10 preset and 10 variable waveforms with full editing capabilities, a VCF with envelope control, and vibrato.

  The 49-key keyboard can be split in the middle, allowing performers to play chords on the poly string section with one hand while soloing with the mono synth section in the other. This made the Fugue a practical performance instrument despite its modest size. Portamento is available on the mono side for expressive lead playing.

  Being a product of its era and budget constraints, the Fugue lacks CV/Gate connectivity and patch memory, but its combination of polyphonic pads and monophonic leads in a single affordable package made it a charming and capable instrument for its time.
specs: |-
  - Polyphony: 49 voices (poly section), 1 voice (mono section)
  - 1 DCO (mono section)
  - LFO vibrato with rate and depth controls
  - Animator with speed control
  - VCF with cutoff and resonance (mono section)
  - Brass cutoff and resonance (poly section)
  - Portamento
  - 49-key splittable keyboard
  - Poly presets: Piano 1, Clavi, Piano 2, Cello, Violin, Percussion, Brass 1, Brass 2, Resonance, Swell, Organ 1, Organ 2, Pipe Organ
  - Volume and expression pedal inputs
  - No CV/Gate
