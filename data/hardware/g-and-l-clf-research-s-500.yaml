description: The CLF Research S•500 is a retro-futurist take on the S•500,
  imagining Leo Fender's late 1970s Magnetic Field Design pickup technology and
  Dual Fulcrum vibrato system on a model that could have predated the earliest
  G&L guitars of 1980. Its MFD single coils were substantially reworked for a
  softer, sparklier sound.
details: |-
  For decades, guitarists have turned to the G&L S•500 for a classic design with added versatility and a bold sound thanks to its MFD pickups, Passive-Treble-Bass tone circuit and expander switch. These enhancements give the S•500 levels of grit, energy and sophistication that other, similar guitars just can't reach.

  The CLF Research S•500 pauses to consider the history unfolding on Fender Avenue in the late 1970s. It's a sort of retro-futurist dream, imagining Leo Fender's late '70s Magnetic Field Design pickup technology and Dual Fulcrum vibrato system packaged on a model that could have predated the earliest G&L guitars produced in 1980. For the journey back in time, John R. McLaren has substantially modified the pickups from the current production S•500 spec, including the coil bobbin aperture, length of pole pieces, wire turns and more. John sought to create a softer, sparklier sound without losing the sense of smoothness and strength expected from an S•500.

  Dave McLaren's #Project1979s500 is the prototype for this model, with its development shared with followers of the CLF Research pages on Instagram and Facebook. Interaction with the fans inspired Dave to draw together functional and styling elements prepared at CLF Research in the late '70s and early '80s, including a 3-ply black pickguard and beautiful machined CLF knobs. Even the headstock is based on the original G&L design, modified to fit Kluson tuners and sporting a '70s-flavored "go faster" logo.

  The CLF Research S•500 has a look, sound, and vibe that takes us back to the golden age of Leo on Fender Avenue, home of what he considered his finest creations.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Okoume
  - Neck wood: Natural Satin Hard-Rock Maple with Rosewood or Maple fingerboard
  - Neck profile: G&L Modern Classic with 9.5" radius and 1 11/16" nut-width
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: Kluson Vintage
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), mini-toggle switch enabling additional pickup combinations of neck+bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
  - Available in: Tobacco Sunburst over Okoume, 3-ply black pickguard, Rosewood fingerboard
  - Available in: Mocha over Okoume, 3-ply black pickguard, Maple fingerboard
  - Available in: Cherryburst over Alder, 3-ply black pickguard, Maple fingerboard
  - Available in: Honeyburst over Swamp Ash, 3-ply parchment pickguard, Rosewood fingerboard
