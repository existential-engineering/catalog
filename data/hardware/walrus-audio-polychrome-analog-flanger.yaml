details: |-
  Like the Iguana that’s malleable to its environment, blending into its surroundings for harmonious balance or standing out with vibrant confidence, the Polychrome Flanger is a uniquely colorful tool for adding modulated textures to songs. The Polychrome is a true bypass, analog Flanger pulling in familiar layout controls from the Julia and Lillian. Dial in a wealth of colorful flange with the D-F-V (Dry, Flange, Vibrato) blend knob and the shape and voice switches. The Shape Switch lets you select from sine, triangle, or random LFO wave to modulate the delay line. The Voice Switch lets you select between two voices for the flanging effect. In the down position, the flanger is more traditional and full frequency. In the up position, you get a more complex and notched flange effect with less low end. Like the other members of the Walrus Audio modulation family, the Polychrome has a blend knob. The D-F-V (Dry, Flange, Vibrato) knob lets you blend the dry and delayed signal from full dry at minimum (no effect), to traditional flange at noon to full pitch vibrato at maximum. Don’t sleep on the vibrato sounds in the Polychrome. Set the D-F-V knob to maximum, feedback to a minimum, and the voice switch up for some unique pitch vibrato. Top-mounted input, output, and power jacks as well as soft switch relay bypassing make the Polychrome fit well on your board and ensure smooth operation for years to come.
