description: The Empress ZOIA is a modular effects and synthesis platform in
  stompbox form. Using 90+ modules including 20+ ready-made effects, it lets you
  build custom effects, synthesizers, MIDI controllers and virtual pedalboards,
  with 64 patch slots and a large community patch library.
details: |-
  The Empress ZOIA is essentially a modular synthesizer in pedal form. It lets you build your own custom effects, synthesizers, MIDI controllers and virtual pedalboards by patching together modules on a grid, all inside a rugged stompbox enclosure with three footswitches and an OLED display.

  It includes over 90 modules, more than 20 of them ready-made effects (reverbs, delays, modulation, distortion and more), plus oscillators, filters, envelopes, LFOs, sequencers and utilities. Up to 64 patches can be stored, and an included SD card holds patches, samples and firmware. A large community shares patches at patchstorage.com.

  Audio runs at 24-bit, 48kHz with 32-bit internal processing. Connectivity is extensive for a stompbox: 1/4" audio in and out, two 1/8" MIDI ports (with adapters included), and a 1/4" control port that accepts MIDI, an expression pedal, control voltage or an external switch. The power supply is not included.
specs: |-
  - 90+ modules including 20+ ready-made effects (reverbs, delays, modulation, distortion, and more)
  - Modular grid workflow: build custom effects, synths, MIDI controllers and virtual pedalboards
  - Up to 64 patches, included SD card for patches/samples/firmware
  - OLED display and three onboard stomp switches
  - 24-bit, 48kHz conversion with 32-bit internal processing
  - Input impedance >=1 MOhm, output impedance 100 Ohm
  - Frequency response 10Hz-23.4kHz (-3dB), THD 0.22%, dynamic range 105.5 dBA
  - Input headroom +0.5/+5.7/+10.8 dBu (0/6/12 dB pad), output headroom +16.2 dBu
  - Power: 9V DC, 2.1mm barrel centre-negative, 300 mA (supply not included)
  - Approx. 5.7"L x 3.75"W x 1.75"H (2.625" with controls), 1.5 lb
