description: A compact passive ribbon microphone sharing the Big Ribbon element
  and transformer of the classic RCA 44 series in a lighter three-pound package,
  with more manageable proximity effect and extended top-end response.
details: |-
  In 2000, AEA sought to design a more compact, lightweight and economic version of the hefty, eight-pound RCA 44BX. The result was the R84, which retains the best traits of the 44 series in a lower cost, three-pound package. The R84 and original RCA 44 share the same Big Ribbon element, transformer and other mechanical elements by design. By using modern design techniques and stronger, more compact magnets, the R84 retains the classic RCA ribbon sound.

  The R84 boasts improvements on the 44 design — including more manageable proximity effect, more extended top-end, vibration isolation and greater maneuverability on small stages and in small studios. The microphone's U-shaped yoke acts as a shock mount and enables the user to position the R84 at various angles, even on a straight mic stand.

  The R84's accentuated mid-range captures the unique qualities of many instruments with detailed elegance. Its remarkable low-end response is perfect for adding heft to the sound of drum kits or otherwise thin vocals. R84 series mics perform well on practically any voice or musical instrument, making them highly useful in recording and broadcast studios.

  Since the R84 is a passive ribbon microphone, a good preamp is critical for optimum performance. Preamp gain should be at least +60dB or higher and it should have a very high impedance. Preamps with above 5K ohm impedance are adequate for guitar amps; on quiet sources or for distance recording, an AEA ribbon preamp is highly recommended.
specs: |-
  - Transducer type: Passive ribbon
  - Polar pattern: Figure-8 (bidirectional)
  - Transformer: Custom Cinemag
  - Requires preamp with minimum +60dB gain and high input impedance (>5K ohm)
  - Weight: 1.8 lbs
  - Dimensions: 11.4 × 3.9 × 2.55 in
  - U-shaped yoke acts as shock mount
  - Handmade in Pasadena, CA, U.S.A.
