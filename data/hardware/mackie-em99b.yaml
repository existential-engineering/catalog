details: |-
  Designed and built for podcasting, live streaming, and dialogue recording, EM-99B provides amazing vocal clarity in a built-like-a-tank enclosure.

  Elevate your voice to the big leagues with the Mackie EM-99B Dynamic Broadcast Microphone. The highly sensitive cardioid capsule with a specially tuned frequency response captures just the right amount of detail and warmth. Get a little excited on stream? No worries thanks to a single-axis suspension that reduces vibration noise while included windscreen reduces pops and plosives. With an all-metal body, durable XLR connection, and robust mount, the Built-Like-a-Tank EM-99B is built to last. It even comes with a high-quality desktop stand, so you are ready to record right out of the box.
specs: |-
  - Cardioid dynamic broadcast microphone
  - Professional XLR connection
  - No power required
  - High sensitivity (-53dB)
  - Dialogue optimized frequency response (50Hz to 16kHz)
  - Single-axis suspension suppresses vibrations
  - Internal foam pop filter
  - Rugged, durable metal body
  - Foam windscreen included
  - Weighted desktop stand included
