details: |-
  The Chandler Limited Little Devil EQ is a discrete, transformer balanced 500 Series module combining designer Wade Goeke's original circuits with the sonic character of legendary recording studio favorites. It delivers a Chandler-ized British console sound in a compact 500 Series format.

  The Little Devil EQ features all-discrete circuits with custom transformers and an inductor-based EQ topology. It also incorporates a classic Baxandall tone control section. All units are handmade using through-hole components and hand-wiring, with no surface-mount parts.

  The EQ offers a treble shelf at 12 kHz (switchable, +/-18 dB), a bass shelf switchable between 50 Hz and 110 Hz (+/-18 dB), high and low mid bands each with HI and LO Q switching, plus a high-pass filter switchable at 47, 82, and 150 Hz. True bypass is included.

  Little Devil EQs have been upgraded for increased 500 Series compatibility, eliminating power conflicts with some third-party racks. Verified compatible with API, BAE, A-Designs, Purple Sweet 10, and Empirical Labs systems.

  Notable users include Clay Blair (The War on Drugs, Moby), Dan Auerbach (The Black Keys), Michael Wagener (Motley Crue, Metallica, Megadeth), Blues Saraceno, and Michael Beinhorn.
