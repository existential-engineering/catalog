details: |-
  Choose Bundle Options above to check out the bundle deals. A200 in solid wood. Delivery : 1-4 working days

  Made by our own carpenters, right here under our own roof. A200 is our most compact and versatile active speaker so far - with built-in amplification and DSP, WiSA wireless support, and a range of Mastertunings that let you adapt the sound to your setup and room - including a cardioid tuning that works exceptionally well close to walls and helps reduce many of the typical compromises that usually come with near-wall placement. They can be used as a traditional stereo setup, desktop speakers, center channels, rear channels, or paired with a subwoofer in a compact system. Need XLR cables? Our 4-meter XLR to RCA cable set is available here. Note: Only US, UK or EU power cord included for the speakers.
