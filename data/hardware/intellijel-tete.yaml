description: Intelligence for your Tetrapad. Tête expands our touch surface,
  Tetrapad. Capture your gestures, save them, play them back with the Tête's
  looper or step sequencer; modulate your physical input with external CV from
  your modular; and finally sync all of your motions with the internal or an
  external clock.
details: |-
  Tête is the expander for the Tetrapad. Tête takes control of Tetrapad's mode selection and operating functions, allowing Tetrapad to act as a control surface for controlling external modules and for interfacing with the advanced processing power within Tête. Tête + Tetrapad operates in one of three modes: Voltages, Notes, and Combo.

  In Voltages mode, up to 16 voltage storage locations (grid) hold 8 voltages each, recordable and played back in a looper style or as a clocked sequence (SH-101 style), with the X and Y CV inputs enabling Cartesian-style sequencing and variable slew for morphing/gliding between values.

  In Notes mode, sequences or loops can be created in chord, scale, or keyboard mode, with an isomorphic keyboard grid settable to 4, 12, or 16 notes, real-time performance looping, transposition and inversion via CV inputs, and per-step tie/rest/gate with adjustable gate size.

  In Combo mode, performances can be loop-recorded across any combination of fader, bipolar fader, crossfader, euclidean sequencer, toggle switches, voltage banks, or LFO functions, with the recorded motion continuous rather than sliced (Elektron-style parameter locking). The chosen function determines the signal type (CV, note, trigger, gate, etc.) sent from each of Tetrapad's eight independent outputs.

  Beyond the three modes, Tête supports step-recording of up to 256 steps, real-time looping (limited mainly by microSD card size), a Loopy performance mode, smart overdub with touch detection, dedicated transport controls, three user-assignable CV outputs, external voltage control via three user-assignable CV inputs (each with dedicated attenuversion), two user-assignable gate/trig inputs, a dedicated clock input with division/multiplication, a built-in screen, and 99 user-presets per mode. Requires the Tetrapad to function.
specs: |-
  - Width: 8HP
  - Depth: 39mm
  - Power: 120mA @ +12V, 6mA @ -12V
  - Three modes: Voltages, Notes, Combo
  - Step-recording (sequencing) up to 256 steps
  - Real-time recording (looping), limited by microSD card size
  - Three user-assignable CV outputs
  - Three user-assignable CV inputs with dedicated attenuversion
  - Two user-assignable gate/trig inputs
  - Dedicated clock input with division/multiplication
  - Built-in screen for visual feedback
  - 99 user-presets per mode (Combo, Notes, Voltages)
  - Requires Tetrapad to function
