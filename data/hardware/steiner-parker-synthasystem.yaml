details: |-
  The SynthaSystem was produced by Steiner-Parker from 1975 to 1979. It is a compact, expandable modular analog synthesizer system that didn't quite compete on the same level as the EML, Moog, ARP, and EMS systems of the same time period.

  As an analog processor and sound design machine, the SynthaSystem shines. It is particularly adept at creating sound effects including thunder, wind, surf, race cars, sirens, horns, explosions, jet airplanes, and tunnel-style sound processing. While it claims to simulate acoustic instruments like piano, organ, trumpet, and violin, most of these are fairly questionable.

  The SynthaSystem can process existing sounds via an external audio input for filtering capabilities, making it a versatile tool beyond simple synthesis. With up to 74 knobs and switches or more depending on configuration, it offers extensive hands-on control. Though uncommon on the used market, it can be an affordable alternative to similar vintage modular synthesizers.
specs: |-
  - Polyphony: Monophonic/Duophonic (dual control voltage outputs)
  - Oscillators: 3 VCOs plus White and Pink Noise generator
  - Effects: LFO, Dual Sample and Hold, Portamento, VC Phasor, Ring Modulator, Frequency Divider
  - Filter: One 2-pole resonant Low/Band/Highpass VCF
  - VCA: One VCA with three envelope generators
  - Envelope Generators: Two with Attack/Sustain/Decay, one with Attack/On-Time/Decay
  - Keyboard: 48 keys (optional controller)
  - Sequencer: 3 bank, 8-step sequencer
  - Memory: None
  - Control: CV/Gate/VC Filter-In via 6-pin plug
  - Production Years: 1975-1979
releaseDate: "1975"
