details: |-
  808 Bass Drum Eurorack Module

  This is a hand-built 808 Bass Drum module for your Eurorack modular synthesizer, designed based on the classic circuitry. We've updated the design by swapping the original Japanese transistors for BC series transistors and adding a pitch adjustment and a resistor for longer decay. A jumper on the bottom of the unit allows you to bypass this resistor if you prefer the original decay length. You can also adjust the tone, decay, and level to fine-tune your sound. The PCB front panel is silk-screened by hand , and the entire unit is assembled with high-quality components . The IC is socketed for easy replacement or upgrades

