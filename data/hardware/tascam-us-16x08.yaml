id: pmm0cPWBmH1x_iGMiEx77
name: US-16x08
manufacturer: tascam
primaryCategory: audio-interface
categories:
  - rack-mount
  - analog
  - midi
url: https://tascam.com/us/product/us-16x08
description: 16-in/8-out USB audio/MIDI interface with eight Ultra-HDDA discrete
  mic preamps (EIN −125dBu). Features +48V phantom on all mic inputs, 8 balanced
  TRS line outputs, onboard DSP with 4-band EQ and compression, 10 scene
  snapshots, standalone preamp mode, and iOS class-compliant operation. Supports
  96kHz/24-bit.
details: |-
  1U rack-compatible USB interface (59mm H, 445mm W). Ultra-HDDA discrete mic preamps: EIN −125dBu, gain 56dB, +48V phantom. Inputs 9–10: switchable instrument/line (45dB gain). Inputs 11–16: switchable −10dBV / +4dBu line. All 8 line outputs balanced TRS. Onboard DSP mixer: 4-band EQ, compressor, 10 scene snapshots. Standalone preamp mode (no computer needed). iOS class-compliant. USB Type-B, USB 2.0 Hi-Speed. MIDI DIN 5-pin IN/OUT. AC adapter included.
specs: |-
  - - Mic inputs 1–8: XLR balanced; EIN ≤−125dBu; gain 56dB; +48V phantom; 2.4kΩ
  - Instrument inputs 9–10: 1/4" TRS switchable; gain 45dB
  - Line inputs 11–16: 1/4" TRS; switchable −10dBV / +4dBu
  - Line outputs 1–8: 1/4" TRS balanced
  - Headphone: 1/4"
  - USB: Type-B, USB 2.0 Hi-Speed
  - MIDI: 5-pin DIN IN + OUT
  - Sample rates: 44.1/48/88.2/96kHz; 16/24-bit
  - THD ≤0.008%; S/N ≥100dB; freq response: 20Hz–20kHz ±0.3dB
  - Power: AC adapter 12W
  - Dimensions: 445(W) × 59(H) × 219(D) mm; weight: 2.8kg
