description: Dynamic supercardioid vocal microphone engineered for very loud
  stages. A large-diaphragm capsule and tight supercardioid pattern deliver
  significantly more gain before feedback than typical handheld vocal mics, with
  high SPL handling for screamers and high-output sources.
details: >-
  The Electro-Voice ND96 is a handheld dynamic vocal microphone in the ND
  series, designed for excellent acoustic control on very loud stages. Its
  structural and acoustical designs target maximum gain before feedback, making
  it well suited to high-volume rock, metal, and gospel vocalists working in
  close proximity to stage wedges and large PA systems.


  A large-diaphragm dynamic capsule provides a rich, detailed frequency
  response, while a vocal presence emphasis switch reduces low-mid frequencies
  for added clarity when needed. The capsule is shock-mounted to minimize
  handling noise, and a humbucking coil guards against hum from stage lighting
  and power supplies. Maximum SPL is greater than 140 dB, so the mic stays clean
  on even the loudest sources.


  The body is die-cast zinc finished in a black polyurethane paint, with a
  Memraflex grille that resists denting in real-world road use. At 170 mm tall,
  50.5 mm maximum diameter, and 0.323 kg, it has the weight and balance of a
  professional handheld stage microphone. Output is via a standard 3-pin XLR
  connector with a 350-ohm low-impedance balanced signal, compatible with any
  professional mixer or preamp. The mic is passive and requires no external
  power.
specs: |-
  - Element: Dynamic
  - Polar pattern: Supercardioid
  - Frequency response: 140 Hz - 15,000 Hz
  - Impedance (low-Z balanced): 350 ohms
  - Open circuit voltage: 3.3 mV/Pa
  - Maximum SPL: > 140 dB
  - Connector: 3-pin XLR
  - Form factor: Handheld
  - Wired/wireless: Wired
  - Power: Passive (no external power required)
  - Vocal presence emphasis switch: Yes
