url: https://aguilaramp.com/products/chorusaurus-bass-chorus-pedal
description: An all-analog bucket-brigade bass chorus pedal delivering warm,
  rich tone with lush, organic chorusing. Features an intuitive four-knob
  interface capable of producing effects ranging from subtle textures to extreme
  chorusing.
details: |-
  The Chorusaurus is an all-analog bass chorus pedal built around bucket-brigade
  device (BBD) technology, the same circuit topology used in the classic chorus
  effects of the 1970s and 80s. This approach produces the warm, organic
  modulation character that digital emulations often struggle to replicate.

  The pedal offers a four-knob control layout — RATIO, SPEED, INTENSITY, and
  WIDTH — giving players precise control over every dimension of the chorus
  effect. RATIO blends the dry and wet signals, SPEED adjusts the modulation
  rate, INTENSITY controls effect depth, and WIDTH shapes the overall chorusing
  character.

  The output section supports both mono and stereo operation. In mono mode a
  standard 1/4" cable is used; in stereo mode a TRS Y-cable splits into two
  TS jacks for a wide stereo spread. This flexibility makes the Chorusaurus
  suitable for both live pedalboard rigs and studio recording setups.

  The pedal runs on a standard 9V power supply (not included) and carries
  Aguilar's three-year limited warranty covering defects in materials and
  workmanship.
specs: |-
  - Technology: Analog Bucket-Brigade (BBD)
  - Controls: RATIO (dry/wet blend), SPEED (modulation rate),
    INTENSITY (effect depth), WIDTH (chorusing character)
  - Output: Mono (1/4" TS) or Stereo (TRS Y-cable to two TS jacks)
  - Power: 9V DC (not included)
