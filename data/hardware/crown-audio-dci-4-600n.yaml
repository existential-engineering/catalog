name: DCi 4|600N
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/dci-4-600n
description: A four-channel, 600W @ 4Ω networked installation power amplifier
  with BLU link digital audio transport, 70V/100V direct drive output, and EN
  54-16 compliance for life safety applications.
details: |-
  The DCi 4|600N is part of Crown's DriveCore Install Network Series, delivering 600W per channel at 4Ω across four channels for high-performance installed sound applications. Its proprietary DriveCore technology reduces internal component count, improving reliability and audio fidelity through efficient design.

  The amplifier supports both balanced analog inputs and BLU link digital audio inputs, with priority input routing for automatic source failover. Network monitoring and control is provided via the HiQnet protocol over TCP/IP, and programmable GPIO ports handle volume control, preset recall, and error reporting.

  Onboard DSP includes LevelMAX limiters, input/output EQ, crossover, delay, matrix mixer, and speaker line monitoring. The amplifier is EN 54-16 compliant (VACIE certified) for life safety applications and integrates with Audio Architect, Q-SYS, and AMX control systems.
specs: |-
  - 4 channels
  - 600W per channel @ 4Ω (Dual Mode)
  - Bridge Mono @ 4Ω: 1200W
  - Frequency Response: ±0.25dB (20Hz–20kHz)
  - THD: 0.35% @ full rated power
  - Damping Factor: >1000 (20Hz–100Hz)
  - Load Impedance (Stereo/Dual): 2Ω–16Ω; 70V/100V
  - Load Impedance (Bridge Mono): 4Ω–16Ω; 140V/200V
  - Onboard DSP: LevelMAX limiters, input/output EQ, crossover, delay, matrix mixer, speaker line monitoring
  - BLU link digital audio transport
  - HiQnet network monitoring and control (TCP/IP)
  - Programmable GPIO ports
  - EN 54-16 compliant (VACIE certified) for life safety applications
  - Cooling: Variable-speed forced air, front-to-back
  - Maximum Fan Noise: 45 dBA SPL @ 1M
  - AC Mains: 100V–240V ~ 50/60Hz
  - Power Connector: 15A IEC
  - Dimensions: 483mm W × 89mm H × 362mm D (19" × 3.5" × 14.25")
  - Weight: 9.12 kg (20.1 lbs)
