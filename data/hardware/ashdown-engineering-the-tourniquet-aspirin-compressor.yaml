description: The Tourniquet/Aspirin is a high quality compressor pedal designed
  for bass, providing a consistent and even tone and volume by compressing loud
  signals and boosting softer signals with no loss of low end.
details: |-
  From Dr Green comes The Tourniquet/Aspirin, a compressor pedal for bass that evens out tone and volume by compressing loud signals and boosting softer ones with no loss of low end. The Input control drives the amount of signal, the pedal then automatically processes compression once the Ratio is set, and a simple Output pot sets the level sent to the amp. It features true bypass switching and is housed in a custom steel casing built to be stomped on night after night.
specs: |-
  - Type: compressor pedal for bass
  - Controls: Ratio, Input, Output
  - Switching: true bypass
  - Housing: custom steel casing
