details: |-
  The NCHHEC bundles the AUDIX Novacore NCHH digital handheld transmitter with the NCEC Extended Cardioid Wireless Capsule — a complete, performance-ready wireless handheld for vocalists and presenters who need natural, balanced vocal clarity straight out of the box. The NCEC's extended cardioid pattern delivers consistent, even-sounding coverage with strong transient response, voiced from the same proprietary VLM capsule technology found in the AUDIX OMX series of stage microphones.

  The NCHH transmitter delivers AES-256 encrypted UHF digital transmission across a 48 MHz tuning range with less than 3 ms latency. One-touch IR sync pairs to any Novacore receiver in seconds. On-board controls provide access to variable input gain, low-cut filter, limiter, RF power level, and three selectable mute modes — all accessible via the front-panel LCD and the controls beneath the battery cover.

  The NCHHEC operates on 2× AA alkaline batteries or 1× NCLB rechargeable lithium-ion battery with 9+ hours of runtime, with USB-C charging built into the transmitter body. The NCEC capsule is interchangeable — swap to an NCTH Tight Hypercardioid at any time using the same "S" thread mount, with no tools required .
specs: |-
  - Type: UHF digital handheld transmitter with capsule
  - Capsule: NCEC extended cardioid (VLM), interchangeable "S" thread
  - Encryption: AES-256
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours
  - Charging: built-in USB-C
