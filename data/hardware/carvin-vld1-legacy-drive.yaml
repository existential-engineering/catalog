  - Create your own Legacy with the VLD1 Legacy DRIVE tube pedal. The VLD1's tube technology with simple, yet comprehensive and modern features delivers the sound of Steve Vai's Legacy amplifier in a preamp pedal. Incorporate the VLD1 in your rig as a preamp, a pedal or by going direct.
  - »Preamp Tubes: Two 12AX7 (dual stage) »Controls: MASTER, BYPASS » Drive channel: VOLUME, DRIVE, BASS, MID, TREBLE, PRESENCE, GAIN switch » Clean channel: VOLUME, BASS, MID, TREBLE, PRESENCE switch » Footswitches: BYPASS, GAIN, DRIVE/CLEAN » 1/4" Footswitch jack: Tip: Hi Gain, Ring: Drive/Clean » 1/4" Bypass jack: Tip: Bypass » Bypass type: Hardwire bypass, relay engaged » Phones/Cab Voiced Out: G3 speaker cabinet voicing, stereo or mono, low impedance capable » DC adapter (included): 12VDC/1A voltage regulated, 5.5mmOD/2.1mmID Center Positive »Size: H x W x D 3.825" x 8.875" x 8.375" (97mm x 225mm x 213mm) » Weight (without adapter): 3.4 lb. (1.55 kg) » Warranty: One Year, 90 days on tubes
  - -Steve Vai "I just got off stage after using the new pedal for half the show in Calgary. I went back to the amp for the other half just to compare. They are very very close, but my sound man likes the new pedal version better. This is going to make my life a lot easier. Thank you thank you thank you." -David Fullerton "Great Addition to Guitar Arsenal. Phenomenal!" Dan M, IATSE Local#2 My search for a pre-amp "drive" pedal may have finally come to an end. I have been playing the guitar for 45+ years, I haven't played out much since I was a younger man, but still play every day. I have long since rejected the idea that any guitar, amp, or pedal sounds better or worse than any other. I carry this idea into my very long career as a sound engineer, there is no "best" mic, "best line array", or "best mixing console". It's what you do with it that matters. When it comes to your guitar, the same thing applies, if your rig feels good to you, and serves your music, then that's it! Not that it isn't fun to keep exploring new things, but you are the only valid judge of the value and usefulness of your instrument. This leads me to my opinion of the Legacy Drive I recently acquired from Carvin, and why it is likely a good tool for others as well as me. This device has an enormous range of control. It can move quite smoothly through the domain of "Pre-amp/drive" pedals from a very clean boost to total high gain. Again the path through these is very smooth making it easy to slide your way through until you come to just the effect you want. In the clean end of the spectrum the pedal seems to open up the guitar, sort of as if it is taking all the load off of the pickups. The foot switch arrangement allows you to instantly bounce around through three gain levels, and bypass. Whatever type of front end sculpting you are looking for, you can achieve it with the VLD1.
