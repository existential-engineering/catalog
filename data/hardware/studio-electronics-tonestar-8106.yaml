description: >-
  The Tonestar 8106 is a Eurorack synthesizer module by Studio Electronics that combines
  circuit elements from the Roland Jupiter 6 and Juno 106 into a compact 32hp format.
  Designed by Tim Caswell, it features a hybrid VCO drawing from Arp, Oberheim, and Moog
  designs, paired with a unique Jupiter-to-Juno filter combining a 6dB/oct high-pass with
  a recreation of the Roland IR3109 chip. With 27 potentiometers and 21 patch points, it
  offers deep hands-on control and extensive CV integration.
details: |-
  The Tonestar 8106 shares its size and layout with Studio Electronics' earlier Tonestar 2600, but instead of reimagining the ARP 2600, this module draws inspiration from two classic Roland synthesizers. Circuit designer Tim Caswell created a distinctive Jupiter-to-Juno filter that combines a 6dB/oct high-pass filter with a recreation of the Roland IR3109 filter chip, bridging the sonic character of the Jupiter 6 and Juno 106.

  The VCO takes a hybrid approach, described as a combination of Arp, Oberheim, and Moog elements creating a greatest-hits oscillator design. This architecture provides stability and reliable tracking across a wide frequency range, with available waveforms including sawtooth, square, sub-oscillator, triangle, and white noise.

  Both LFO rate and ADSR amount receive voltage control, enabling MIDI dynamics and volume manipulation along with deeper modulation possibilities. The module features six switches, one fewer than the Tonestar 2600, trading resonance modulation for dedicated high-pass filter control.
specs: |-
  - Polyphony: 1 voice
  - Multitimbral: 1 part
  - Oscillators: 1 VCO
  - Waveforms: Sawtooth, Square, Sub Oscillator, Triangle, White Noise
  - Filter: 24dB/oct low-pass with resonance, 6dB/oct high-pass (Jupiter-to-Juno IR3109 recreation)
  - LFO: 1 with Square and Triangle waveforms
  - Envelopes: 2 VCA with ADSR
  - Control: CV In, CV Out, Gate In
  - Potentiometers: 27
  - Patch Points: 21
  - Module Size: 32hp Eurorack
