description: Expressive 20W all-valve guitar combo from Marshall's Origin
  series, pairing a single channel with a Tilt voicing control and Powerstem
  power-scaling that drops output from 20W to 3W or 0.5W for lower-volume use. A
  pull-boost Gain knob adds an extra layer of crunch, while a series effects
  loop and 2-way footswitch (gain boost + FX loop) round out the feature set. A
  10" Celestion VT-Junior speaker provides the punchy low-mid response and
  sparkling high end, and three 1/4" speaker outputs (16Ω / 8Ω) plus a DI output
  cover combo, external-cabinet, and recording rigs.
details: |-
  This 20W combo is designed to give you endless clean tones with the ability to switch between 20W, 3W and 0.5W with Powerstem technology.

  A 2-way footswitch allows you to control the gain boost and turn the FX loop on and off. With unmistakable styling and modern features, this amp generates rich, harmonic tones so that you can craft a sound to suit your style.

  Powerstem, Marshall's power reduction technology, enables you to choose between high or low power modes without any compromise in sound quality. Unlike traditional pentode/triode reduction methods, Powerstem works by reducing the voltage rails around the power amplifier, so power comes down without altering the sonic character.

  Use the tilt control to adjust your sound and blend seamlessly from a standard tone to a high treble setting. This feature is derived from the multi-input technology found in classic amplifiers like the 1959SLP and JTM45, condensed into a single, easily controlled knob.

  Like its larger V-Type counterpart, the Celestion VT-Junior speaker provides a harmonious and well-balanced sound. Its compact 10-inch size delivers a powerful low mid punch and a sparkling high end. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - All-valve
  - High, mid and low power with power reduction technology
  - 10" Celestion VT-Junior speaker
  - Tilt control to blend your sound
  - Gain boost
  - Model: Origin20C
  - Range: Origin
  - Channels: 1
  - Technology: Valve
  - Output wattage: high power 20W, mid power approx 3W and low power approx 0.5W
  - Outputs: speaker outputs 3 x 1/4" jack sockets (16 ohm load / 8 ohm load), DI (1/4" jack)
  - Inputs: 1 x 1/4" jack instrument input, footswitch
  - Controls: gain (pull boost), tilt, bass, middle, treble, master, presence, Powerstem power scaling
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Speaker configuration: 1x10"
  - Speaker model: Celestion VT-Junior (16 ohm, 50W)
  - Unit impedance: 16 ohm
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 13.9 kg / 31 lb
  - Width: 520 mm / 20.5"
  - Depth: 240 mm / 9.4"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90016 footswitch included, detachable power cable included
  - Colour: Black
