description: Expressive 20W all-valve guitar combo from Marshall's Origin
  series, pairing a single channel with a Tilt voicing control and Powerstem
  power-scaling that drops output from 20W to 3W or 0.5W for lower-volume use. A
  pull-boost Gain knob adds an extra layer of crunch, while a series effects
  loop and 2-way footswitch (gain boost + FX loop) round out the feature set. A
  10" Celestion VT-Junior speaker provides the punchy low-mid response and
  sparkling high end, and three 1/4" speaker outputs (16Ω / 8Ω) plus a DI output
  cover combo, external-cabinet, and recording rigs.
details: |-
  - 20W all-valve guitar combo with Powerstem power scaling down to 3W or 0.5W
  - Single channel with pull-boost Gain for added crunch
  - Tilt control for blending standard tone with a high-treble setting
  - Series effects loop (switchable)
  - 2-way footswitch controls gain boost and FX loop on/off
  - 10" Celestion VT-Junior speaker
  - Three 1/4" speaker outputs (16Ω / 8Ω)
  - DI output (1/4") for direct recording or routing
  - Preamp: 2 x ECC83 + 1 x ECC83 phase splitter; power amp: 2 x EL34
specs: |-
  - Model: Origin20C
  - Range: Origin
  - Output Wattage: 20W (with Powerstem power scaling, 3W or 0.5W)
  - Channels: 1
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Controls: Gain (pull boost), Tilt, Bass, Middle, Treble, Master, Presence, Powerstem power scaling
  - Effects: None
  - Effects Loop: Yes, 1 x series switchable
  - Inputs: 1 x 1/4" jack instrument input, footswitch
  - Outputs: Speaker outputs: 3 x 1/4" jack sockets (16Ω load / 8Ω load); DI (1/4" jack)
  - Speaker Configuration: 1x10"
  - Speaker Model: Celestion VT-Junior
  - Product Width: 520 mm / 20.5"
  - Product Depth: 240 mm / 9.4"
  - Weight: 13.9 kg / 31 lbs
  - Footswitch: 2-way footswitch (gain boost + FX loop on/off)
