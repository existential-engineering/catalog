  chassis.
details: |-
  The 168A is dbx's eight-channel dynamics processor, providing simultaneous compression, limiting, and gating across eight independent audio channels in a single rackmount unit. The unit was designed for multi-channel recording, live sound, and broadcast applications requiring comprehensive dynamics control without multiple single-channel units.

  Each channel features dbx's OverEasy® compression for transparent gain reduction with a soft-knee characteristic, along with PeakStop™ hard limiting for absolute peak protection. Individual channel controls allow independent adjustment to match different signal sources within the same session.

  An owner's manual (4.12MB) is available for download from the dbx product page. The large manual size suggests comprehensive documentation for all eight channels and their routing/coupling options.
