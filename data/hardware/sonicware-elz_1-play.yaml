description: ELZ_1 play is a portable wavetable synthesizer featuring original
  Waldorf wavetables, 18 distinctive synth engines, 48 effects, a 4-track
  looper, and a sequencer. A layer mode lets you stack engines to build complex,
  evolving sounds anywhere you go.
details: |-
  Pack, play, perform: wavetable power, to go. Wavetable and Layer Mode spark experimentation and transform sound beyond limits, featuring original Waldorf wavetables. Its creative arsenal offers 18 distinctive synth engines, 48 effects, a flexible 4-track looper, and a sequencer for limitless sound creation, so you can carry your creativity from spark to sound everywhere you go.

  The Launch Edition includes a free Waldorf Edition 2 LE coupon and a free case.
