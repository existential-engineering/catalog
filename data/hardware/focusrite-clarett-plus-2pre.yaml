name: Clarett+ 2Pre
manufacturer: focusrite
primaryCategory: audio-interface
url: "https://focusrite.com/products/clarett-plus-2pre"
prices:
  - amount: 599.99
    currency: USD
description: Clarett+ 2Pre is a pure-sounding 10-in / 4-out audio interface for
  the recording artist. Bring pure analogue sound to your music.
details: |-
  10-in / 4-out USB-C audio interface with two Clarett mic preamps switchable to line or Hi-Z JFET instrument inputs, four balanced outputs, and eight input channels over ADAT.

  All-analogue Air mode with impedance switching adds presence and clarity, recreating the legendary character of the ISA. Low-distortion 24-bit/192 kHz converters deliver up to 124dB dynamic range. Compatible with macOS, Windows and iPadOS.
specs: |-
  - 10-in / 4-out audio interface
  - Two Clarett mic preamps, switchable to line or Hi-Z JFET instrument
  - Four balanced line outputs
  - Eight input channels over ADAT
  - All-analogue Air mode with impedance switching
  - 24-bit / 192 kHz converters
  - Up to 124dB dynamic range (outputs)
  - 118dB dynamic range (mic inputs at min gain)
  - +57dB preamp gain range
  - Mic EIN: -129dBu
  - USB-C connectivity
  - Compatible with macOS, Windows and iPadOS
  - 3-year warranty
