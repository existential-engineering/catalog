description: >-
  The Kilobyte-2000 is Caroline Guitar Company's flagship lo-fi tap delay pedal,
  evolved from the original 2013 Kilobyte design, featuring an Invader repeater
  preamp with up to 5x gain on repeats, tap tempo, trails bypass, built-in
  modulation, a Havoc runaway hold, and a dedicated effects loop.
details: |-
  The Kilobyte-2000 is the evolved flagship form of Caroline Guitar Company's
  lo-fi delay pedal, first launched as the original Kilobyte in 2013. Where
  other designers used the PT-2399 chip to imitate analog delay or sought
  pristine digital clarity, Caroline amplified the chip's inherent character
  rather than disguising it.

  The Invader repeater preamp pushes gain on the repeats up to 5x harder than
  the original Kilobyte, while leaving the dry signal untouched and capable of
  staying clean when dialed back. A new Sharpness control lets the player set
  the gain range and voicing of the preamp.

  Tap tempo and trails bypass are on board, alongside a gorgeous but subtle
  built-in modulation. The beloved Havoc runaway hold with its voiced runaway
  effect returns, now with a dedicated Intensity control to set the strength of
  the runaway.

  A dedicated effects loop allows users to insert other effects solely on the
  KB2K repeats, or to achieve a 100% wet output for stereo and parallel
  processing rigs. The pedal is available in Standard and Black Sparkle
  colorways.
specs: |-
  - PT-2399-based lo-fi tap delay
  - Invader repeater preamp with up to 5x gain on repeats
  - Sharpness control for preamp gain range and voicing
  - Tap tempo
  - Trails bypass
  - Built-in subtle modulation
  - Havoc runaway hold with voiced runaway effect
  - Intensity control for Havoc runaway effect
  - Dedicated effects loop (parallel processing or 100% wet output)
  - Weight: 18 oz
  - Dimensions: 2 × 6 × 4 inches
