description: The Ferrofish VERTOpro 64 is an ADAT to Dante converter and router
  for larger systems. Eight optical ADAT inputs and eight outputs connect up to
  64 x 64 channels to a Dante network at 48 kHz, with a routing matrix that
  assigns signals in blocks of eight or channel by channel.
details: |-
  The Ferrofish VERTOpro 64 is an ADAT-to-Dante converter and router for larger professional audio systems. Eight optical ADAT inputs and eight outputs connect up to 64 x 64 channels to a Dante network at 48 kHz, and its routing matrix lets you assign signals in blocks of eight or channel by channel.

  The ADAT side runs up to 64 x 64 channels at 48 kHz, 32 x 32 at 96 kHz or 16 x 16 at 192 kHz. The Dante interface handles up to 64 x 64 channels at 48 kHz over two Gigabit Ethernet ports, which can run switched or redundant, with AES67 support.

  A 3-inch IPS colour display shows levels, routing, clock status and configuration, and an integrated 6.3 mm headphone output monitors digital signals. RemoteFish control runs from Windows or macOS over USB-MIDI or MIDI, and word clock input and output sit on BNC connectors.

  Two SFP slots allow dual MADI functionality to be added. A separate MADI licence and suitable Ferrofish SFP modules are required, and MADI is not included as standard.

  The compact half-width, 1U unit supports sample rates up to 192 kHz.
specs: |-
  - Eight optical ADAT inputs and eight optical ADAT outputs
  - Up to 64 x 64 ADAT channels at 48 kHz, 32 x 32 at 96 kHz or 16 x 16 at 192 kHz
  - Dante interface with up to 64 x 64 channels at 48 kHz
  - Two Gigabit Ethernet ports for switched or redundant network operation
  - AES67 support
  - 3-inch IPS colour display for levels, routing, clock status and configuration
  - Integrated 6.3 mm headphone output for monitoring digital signals
  - RemoteFish control from Windows or macOS via USB-MIDI or MIDI
  - Word clock input and output on BNC connectors
  - Two SFP slots for optional dual MADI, which needs a separate MADI licence and Ferrofish SFP modules
  - Routing matrix assigns signals in blocks of eight or channel by channel
  - Sample rates up to 192 kHz
  - Compact half-width 1U housing
  - Weight 1 kg
  - Dimensions 34 x 22 x 8 cm
