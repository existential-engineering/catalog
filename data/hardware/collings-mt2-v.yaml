name: MT2-V
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mt2-v/
description: The MT2-V features the same construction and appointments as the
  standard MT2 but with an oil-based alkyd resin varnish finish and an
  ivoroid-bound ebony pickguard. The varnish finish allows the tonewoods to
  breathe more freely, offering a different acoustic character than
  lacquer-finished models.
details: |-
  The MT2-V is an A-style mandolin with F-holes, featuring an Adirondack spruce top and Eastern flamed maple back, sides, and neck. It matches the MT2 in construction and appointments, with ivoroid binding, black/white top and side purfling on body, fingerboard, and peghead. The ebony fingerboard has MOP dot inlays, and the ebony bridge has an adjustable saddle. A rounded V neck profile, 13 7/8" scale length, and 1 1/8" nut width make for comfortable playability. Hardware includes nickel Gotoh tuners with ivoroid buttons and the Collings original tailpiece with engraved border. The defining difference from the MT2 is the high gloss alkyd resin varnish body finish. An ivoroid-bound ebony pickguard adds refinement. Ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Construction: A-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Ivoroid with b/w top and side purfling
  - Fingerboard Binding: Ivoroid with b/w side purfling
  - Peghead Binding: Ivoroid with b/w side purfling
  - Bracing: Tone bars
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo and flourish
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Pickguard: Ebony with ivoroid binding
  - Tailpiece: Original tailpiece with engraved border
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: High gloss alkyd resin varnish
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 26 3/8"
