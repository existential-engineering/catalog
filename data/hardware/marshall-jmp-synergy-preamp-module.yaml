description: All-tube Plexi preamp module built for the Synergy Amps modular
  preamp system. Recreates the iconic Marshall JMP 'Plexi' sound, from sparkling
  cleans to classic overdriven distortion, via a dual-channel design with
  independent 3-band EQ, master volume, and bright switches per channel.
  Selectable 60s/70s voicing switches dial in era-specific Plexi character,
  while an onboard phase inverter with 0-watt circuitry and mini transformer
  delivers the feel of a cranked amp at low volumes. Loaded with 12AX7 tubes and
  connected via 1/4" instrument cabling.
details: |-
  - Designed in collaboration with Synergy Amps
  - All-tube Plexi-voiced modular preamp
  - Dual-channel design with independent Volume 1 (Bright) and Volume 2 (Normal) inputs
  - Independent 3-band EQ on each channel
  - Master volume control
  - Bright switches for treble adjustment
  - Selectable 60s / 70s voicing switches
  - Loaded with 12AX7 tubes
  - Onboard phase inverter with 0-watt circuitry and mini transformer for cranked-amp feel at low volumes
  - Compatible with Synergy Amps modular chassis
