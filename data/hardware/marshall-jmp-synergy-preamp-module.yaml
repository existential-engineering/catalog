description: All-tube Plexi preamp module built for the Synergy Amps modular preamp system. Recreates the iconic Marshall JMP 'Plexi' sound, from sparkling cleans to classic overdriven distortion, via a dual-channel design with independent 3-band EQ, master volume, and bright switches per channel. Selectable 60s/70s voicing switches dial in era-specific Plexi character, while an onboard phase inverter with 0-watt circuitry and mini transformer delivers the feel of a cranked amp at low volumes. Loaded with 12AX7 tubes and connected via 1/4" instrument cabling.
details: |-
  Capture the legendary Marshall JMP Plexi tone with this dual-channel, all-tube Synergy module, loaded with 12AX7s, 60s/70s voicing, and 0-watt circuitry for the cranked amp experience at any volume.

  It faithfully recreates the iconic Marshall JMP Plexi sound, from sparkling cleans to classic, overdriven distortion, using genuine 12AX7 tubes.

  Two fully separate channels carry Volume 1 (Bright) and Volume 2 (Normal) inputs, each with independent three-band EQ and master volume, so rhythm and lead tones can be switched and blended the way the original Plexi's Bright and Normal inputs were. A bright switch on each volume control adjusts the high-end brightness and the bright cap without modifying the circuit.

  The 60s/70s voicing switch on each channel toggles between vintage 60s smooth, round tones and 70s tighter, more aggressive attack. A built-in phase inverter and mini transformer, Synergy's 0-Watt power amp section, create the dynamic response and harmonic richness of a cranked tube power amp at any volume.

  The module is designed to integrate with Synergy's easy-installation preamp docks and modular amp configurations. Designed and engineered in USA. Made in USA.
specs: |-
  - Dual-channel, all-tube preamp module (12AX7 tubes)
  - Controls per channel: Volume 1 (Bright), Volume 2 (Normal), Bass, Middle, Treble, Master
  - Independent bright switch per volume control
  - 60s / 70s era voicing switch per channel
  - Onboard phase inverter with 0-Watt power amp circuitry
  - Wired connectivity: 1/4-inch instrument cable
  - Compatible software: Synergy Editor Software when used with SYN20-IR
  - Installs into a Synergy preamp dock, which supplies power and all audio connections; the module itself carries no jacks or mains inlet
  - Dimensions: 38.1 x 177.8 x 139.7 mm / 1.5 x 7 x 5.5 in
  - Weight: 453.592 g / 16 oz
  - Water resistance: no
  - Colour: Black
  - In the box: preamp module, warranty card, quick start guide, legal and safety information
  - Country of origin: designed and engineered in USA, made in USA
