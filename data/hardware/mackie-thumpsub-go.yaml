description: You might think your battery-powered PA system sounds good on its
  own. But deep down, you know it's missing a little more oomph. You want that
  chest-thumping low end that shakes the dance floor.
details: |-
  ThumpSub GO is a battery-powered portable subwoofer that adds chest-thumping low end to a portable PA system. It combines two battery compartments for up to 12 hours of continuous bass, and since the sub works perfectly with a single battery it is also possible to charge a second battery elsewhere, then hot swap it out without the unit powering down.

  Carry the bass like a briefcase with the built-in ergonomic handle. Thanks to the low-profile design, you can lay ThumpSub GO flat and slide it out of sight under tables, stages and DJ stands, and it works equally well vertically, making it easy to fit into narrow spaces.

  ThumpSub GO is optimized to work seamlessly with the Thump GO battery-powered loudspeaker. It is also great for adding low-frequency extension to the Mackie ShowBox all-in-one performance rig, or any portable powered loudspeaker, with up to a 10 inch woofer size recommended.

  Connect portable loudspeakers for a complete mono, stereo or zone PA system. Connect to ThumpSub GO via Bluetooth to stream wirelessly through the whole system, including any connected loudspeakers, even if the speakers don't have Bluetooth. Mount a speaker above ThumpSub GO with the SPM400 speaker pole (sold separately) for a smaller footprint.
specs: |-
  - Two custom 8" low frequency drivers
  - 400W Class-D amplifier
  - Two hot-swappable battery compartments; up to 12 hours of battery life when using two batteries
  - One GB-200 battery included for 6 hours battery life; optional second battery sold separately
  - Easy to carry with built-in top handle
  - Horizontal or vertical orientation
  - Two combo XLR/TRS inputs
  - Two XLR outputs for connected speakers
  - Stereo and mono output modes
  - Bluetooth streaming
  - Optimized for Thump GO, works with any portable powered loudspeakers with up to a 10" woofer size
  - Threaded pole cup for SPM400 speaker pole (sold separately)
  - High pass and full range output modes
  - Phase inversion switch
  - Overload LED and protection
  - Front LED on / off switch
  - Two battery life status LEDs
  - Weight (with one battery): 41.7 lbs / 18.9 kg
  - Height: 21.9 in / 582 mm; Width: 9.8 in / 249 mm; Depth: 20.9 in / 531 mm
