id: fNvZW9wxAq1IIU-HRB559
name: AFA Vivisect Attenuverting Mixer Module DIY Kit
manufacturer: animal-factory-amplification
primaryCategory: modular
categories:
  - utility
  - noise
url: https://animalfactoryamps.com/products/diy-kit-vivisect-mixer-beginner-friendly
description: A beginner-friendly DIY kit for building the Vivisect Eurorack
  attenuverting mixer module, with all SMD components pre-soldered. It performs
  inversion, summing, offsetting and white noise generation on control voltage
  signals.
details: |-
  First time soldering? New to DIY and too scared of tiny components? Something that always turns off DIYers is when the thing you're building doesn't work out on the first try. This kit is the perfect introduction to absolute beginners. All SMD components are already on the board, making soldering and assembly a breeze. Vivisect is a simple and powerful essential for every rack. It allows you to perform a host of functions on control voltage signals.

  Each kit contains all parts needed to build a fully functional Vivisect module
specs: |-
  - invert - make a positive-going signal negative, and vice versa
  - sum - add different signals to create complex wave shapes (or increase the amplitude of the same signal)
  - multiple outputs from a single input
  - offset - add up to +/- 5V to a control voltage
  - white noise generator
  - One PCB with all SMD parts presoldered on it
  - 13x 3.5mm Mono Jacks
  - 5x Clear shaft, center-detent potentiometers
  - Shrouded header for Eurorack power
  - One DPDT switch and switch cap
  - High-quality, laser etched, anodized aluminium faceplate
  - Other optional materials: jumpers, headers and trimpots.
  - Eurorack power cable and Vivisect expansion cable
