url: https://www.mrblackpedals.com/products/analog-tremolo
description: A compact all-analog tremolo built around a high-performance VCA
  and a precision multi-waveform LFO, with an active master volume and a
  maximum-speed Robot Mode.
details: |-
  Tremolo, or amplitude modulation, is one of the oldest and most iconic guitar
  effects. Mr. Black set out to build an exceptional tremolo in a small
  footprint, which sounds simple but is difficult to achieve well.

  At its core the Analog Tremolo uses a high-performance VCA (voltage-controlled
  amplifier) for smooth, pure 100% analog modulation, driven by a precision
  multi-waveform LFO with a wide range of speeds. Because of this, the intensity
  ranges from 0%, where the pedal acts as a powerful clean boost with the
  Intense control fully counter-clockwise, up to a full -100dB chop.

  Three classic waveforms (triangle, square, sine) let you choose the right
  pulse and throb, selected by a button and shown in real time on the indicator
  LED. Robot Mode disables the Rate control and pushes the LFO to its maximum,
  and can be tamed or cranked with the Intense control.

  An active master volume output ensures very low output impedance for long
  cable runs and complex pedalboards. Rounded out by mechanical true-bypass and
  drawing only 17mA from standard 9V pedal power or an internal battery, it is a
  Jack Deville original design, 100% handmade in the USA.
specs: |-
  - 100% pure-analog signal path and modulation
  - Precision LFO with three waveforms: Triangle, Square, Sine
  - LFO speed range: 0.58Hz (~1.72s cycle) to 15.4Hz (~65mS cycle)
  - Robot Mode: LFO at physical maximum, Rate control disabled
  - Real-time LED waveform/rate indicator
  - Up to +14dB boost, very high input headroom
  - Input Impedance: ~470KOhm
  - Output Impedance: ~2KOhm
  - True-Bypass
  - Power: 9VDC, 2.1mm negative center-pin (>100mA regulated supply recommended) or internal 9V battery
  - Current draw: 17mA @ 9VDC
  - Dimensions: 2.65in x 4.45in x 1.85in (67.3mm x 113mm x 47mm)
  - Weight: 9.0oz (255g)
