description: Patching Heaven Adds 14 dedicated ouputs and a Ring Mod to the
  already powerful Atlantix module.
details: |-
  The Atlx 1U expander provides 16 additional jacks to the Atlantix, including: dedicated waveform outputs for A and B oscillators, filter outputs, and a ring modulator.

  Atlx 1U adds many new possibilities for self-patching, advanced routing, and connections to other modules.

  The Atlx 1U is identical to the functionality and features of the 3U version (Atlx).
