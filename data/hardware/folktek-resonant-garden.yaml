  and time-based effects.
details: |-
  The Resonant Garden is temporarily unavailable. They will be available for purchase again in late June. We apologize for the inconvenience. The Resonant Garden is an electronic-acoustic hybrid instrument designed to create anything from beats and oddities to dense sound scapes. The garden utilizes three Alter circuits each equipped with a mic pre-amp, and 4 sprout (stringed) panels for generating acoustics. By plucking, rubbing, tapping or even bowing, those micro-acoustic sounds become amplified and affected by the Alter in any number of ways. In essence, the garden is a large microphone designed to pick up vibrations. MONOLITHIC VS DISCRETE

  A Monolithic version of the Resonant garden consists of a single faceplate for the entire instrument. A Discrete version of the Resonant garden consists of 7 faceplates, three for each Alter module and four for the sprouts. The discrete version allows for individual sprout and Alter modules to be moved around or substituted with other modules. Keep in mind the power and audio distribution system is designed for the configuration shown here, but can easily be hand wired with standard cables (sold separately). The maximum depth for modules in the garden box is 33mm. EFFECTS

  There are two Alter 1 units and one Alter 2 unit. Each Alter 1 has seven DSP effects which are selected by touching the copper hexagon:

  1 - long delay (capable of near infinite feedback looping)
  2 - notated granular delay
  3 - plate reverb
  4 - shimmering reverb
  5 - distortion and multi-filter
  6 - pitch delay
  7 - stutter glitch

  Alter 2 has the following effects:

  1 - analog delay
  2 - reverb with infinite capture and lp + hp filters
  3 - choral reverb
  4 - palindrome reverse delay - backward/forward repeat
  5 - time stretch
  6 - pitch shift (notated semi-tones
  7 - time stretch glitch

  EXAMPLE SETTINGS DIAGRAMS (PDF)

  2-3-2 :: Shimmering Choir

  1-2-7 :: Infinite Looping Reverb w/ Glitch

  1-7-2 :: Bagpipe Free Jazz

  CONTROL

  On each of the Alter sections, the following is present:
  - Control for the gain of the mic pre-amp or any incoming audio. - Controls for Mix, X, Y and Sift as well as clock. - All effects have a variation of a filter which may change effect to effect. - X and Y control various rates. - Clock control adjusts the rate which controls the DSP which can drastically change the effect. In doing so it does slightly lower the quality of the output signal but the results are fantastic. This clock is not for synchronization. - Mix, X, Y and Sift all have CV control inputs. - Each control level or CV input is visualized on the control panel. ACOUSTICS

  Each garden panel is equipped with a contact mic. A contact mic is designed to pick up vibration. The mic pre-amp is specifically designed to deal with the frequencies of the contact mic by boosting certain frequencies and dulling others in order to optimize the sound quality. The mic pre-amp has a gain control so the level can be adjusted according to how you intend to play. ROUTING

  1/8" stereo inputs with separate level/gain control for right and left channels. These level controls can also act as mute as they can take the signal to 0. They can also add gain to a quiet signal. In its natural state, each Alter utilizes the garden panel acoustics and each Alter outputs its own signal. By plugging in to the left input of any Alter, the mic amp is bypassed. This means that the signal can be chained from one alter to another, utilizing the single final output. This chain of effects can result in an incredibly broad range of sound. - use all effects in parallel (3 sets of stereo output)
  - use two in series and one in parallel (2 sets of stereo output)
  - use all in series (single stereo output)
  - peak level indicator for clipping levels at the input

  DESIGN

  The box is constructed with Sapele African hardwood and a white birch bottom panel. It features anodized black aluminum rails for mounting the faceplates. Each sprout of strings is bolted in from the back and held in place with a backing panel under the main board. Each box has unique wood grain patterns. The wood grain shown in the images will appear different for each instrument we ship. INCLUDED

  - Power Supply: 12v positive tip AC Adapter (included) - US - 100-240V ~ 50/60Hz 0.6A
  - Printed manual
  - Four (4) black 6" (15cm) 3.5mm TS mono patch cables
  - Four (4) black 24" (60cm) 3.5mm TS mono patch cables

  PRODUCT MANUAL

  You can view and download the digital product manual here . DIMENSIONS

  - 76 HP Total Width, Sprouts: 7 HP, Alters: 16HP
  - Mounting Rails are 406.16mm long

  SHIPPING, FULFILLMENT & DELIVERY

  We are a small company and strive to fulfill orders as quickly as possible. During busy times, please allow up to several business days for order fulfillment. International Shipments (delivery address outside the U.S.) may be subject to import duties, value added taxes (VAT), and long customs clearance times. Tariff rates vary from country to country. Folktek does not collect VAT on behalf of the customer. Folktek is not responsible for payment of import taxes. Please check with your local customs agency for rates and more information. **Note: There may be tiny scratches or blemishes on the faceplates from the manufacturing process. Unfortunately, these scratches are unavoidable.
