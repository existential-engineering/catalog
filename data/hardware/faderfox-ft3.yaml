description: FT3 is the perfect all-in-one-solution if you want a
  four-deck-controller for Traktor Pro or Ableton Live. The device controls
  linefaders, crossfader, EQ's, filters, effects, loops, pitch, key, cues,
  transport and browser.
details: |-
  FT3 is the perfect all-in-one-solution if you want a four-deck-controller for Traktor Pro or Ableton Live. The device controls linefaders, crossfader, EQ's, filters, effects, loops, pitch, key, cues, transport and browser.

  It is a special controller for DJ software, optimised for Native Instruments Traktor Pro and Ableton Live, and setup files for Traktor Pro/Duo and Ableton Live are shipped with the controller. The USB interface is class compliant, so no driver is necessary.

  FT3 controls four decks/tracks by all important controls like faders, play, sync and select buttons. Four FX slots are available with pots, buttons, FX select and snapshot functions, about 250 commands are all freely reassignable, and the browser section has a dedicated encoder (clip-scroll in Ableton Live's session view).

  Four multifunctional encoders with 6 switchable groups cover deck, global and FX control, and four further multifunctional encoders handle EQ's, filters and FX assigns with a center-push-function for EQ's. There are 20 coloured buttons, all controls have a double function by holding down the shift button, and 25 LED's in different colors display various informations, including indication of play, sync, select and FX assign states by feedback data from computer software.

  The very compact design uses a black, plastic casing in desktop format measuring 180 x 105 x 70 mm and weighing 350 g, with a silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions, high-quality faders, pots and encoders from ALPS, and new rubber knobs for best tactile feeling.
specs: |-
  - Special controller for DJ software, optimised for Native Instruments Traktor Pro and Ableton Live
  - Setup files for Traktor Pro/Duo and Ableton Live shipped with the controller
  - USB interface, class compliant, no driver necessary
  - Controls four decks/tracks by all important controls like faders, play, sync and select buttons
  - 4 FX slots available with pots, buttons, FX select and snapshot functions
  - About 250 commands, all freely reassignable
  - Browser section with a dedicated encoder (clip-scroll in Ableton Live's session view)
  - 4 multifunctional encoders with 6 switchable groups for deck, global and FX control
  - 4 multifunctional encoders for EQ's, filters and FX assigns (center-push-function for EQ's)
  - 20 coloured buttons
  - All controls with double function by holding down the shift button
  - 25 LED's in different colors to display various informations
  - Indication of play, sync, select and FX assign states by feedback data from computer software
  - USB bus powered, consumption less than 500 mW / 100 mA
  - Very compact design in a black, plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - Requires a PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - Requires Native Instruments Traktor Pro/Duo (as of V.1.2.4) or Ableton Live (as of V.8.1.1), or software which allows user assignments of continuous parameters (CC) and note commands
