url: https://www.mrblackpedals.com/products/ambience
description: A delay pedal that layers two syncopated, independently modulated
  echoes drifting into a soft, beautiful reverb.
details: |-
  The Ambience begins as a delay pedal, then adds a second, syncopated echo tap
  and modulates them both independently. The two modulated echoes drift and blur
  into one another before settling into a soft, enveloping reverb.

  The result is a delicate, atmospheric wash that works well for ambient and
  textural playing, functioning as a standard delay while delivering additional
  sonic character through its internal architecture.

  The Ambience is a Jack Deville original design.
specs: |-
  - Delay pedal with a second syncopated echo tap
  - Both echoes independently modulated
  - Echoes settle into a soft reverb wash
