description: Dual-channel compressor/limiter/gate (discontinued legacy model).
details: |-
  The dbx 266 is a discontinued dual-channel compressor/limiter with integrated gate from dbx Professional Audio. Part of the 266-series dynamics processor family, it provided compression, limiting, and gating capabilities for professional audio applications in recording and live sound environments.

  This unit has been discontinued and superseded by the 266A and 266XL in the dbx lineup.
