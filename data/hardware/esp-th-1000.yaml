description: Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the LTD Deluxe TH-1000 takes a familiar shape and soups it up with the very best in contemporary components and build quality. Built with bolt-on construction at 25.5" scale, the TH-1000 is based on a swamp ash body that's adjoined to a thin U-shaped three-piece roasted maple neck with Macassar ebony fingerboard, offset dot inlays, 24 extra-jumbo stainless steel frets, and a matching-finish headstock. Components on the TH-1000 include black hardware, a black bone nut, LTD locking tuners, a Hipshot hardtail fixed bridge with string-thru-body, and a set of direct-mounted Seymour Duncan Mortal Coil 3-Voice Active Humbucker pickups.
details: |-
  Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the LTD Deluxe TH-1000 takes a familiar shape and soups it up with the very best in contemporary components and build quality. Built with bolt-on construction at 25.5” scale, the TH-1000 is based on a swamp ash body that’s adjoined to a thin U-shaped three-piece roasted maple neck with Macassar ebony fingerboard, offset dot inlays, 24 extra-jumbo stainless steel frets, and a matching-finish headstock. Components on the TH-1000 include black hardware, a black bone nut, LTD locking tuners, a Hipshot hardtail fixed bridge with string-thru-body, and a set of direct-mounted Seymour Duncan Mortal Coil 3-Voice Active Humbucker pickups. These outstanding ESP-exclusive pickups have push-pull controls to activate their multiple voices.
