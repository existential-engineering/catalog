description: Open-back premium headphones developed from the TH909, with a housing machined from solid black walnut and double-layered etched aluminum at the aperture. The in-house BioDyna diaphragm driver unit is assembled one by one at a factory in Japan.
details: |-
  This product is a premium headphone developed based on the TH909, Fostex's top-of-the-line open-type headphones. The housing is machined from solid black walnut, a high-grade wood, and equipped with a proprietary in-house made BioDyna diaphragm driver unit. The headphones are carefully assembled one by one at a factory in Japan. Because the housing is solid natural wood, the grain, bark, coloration and knots may vary from one product to another without affecting sound quality.

  The TH900 series driver unit boasts a magnetic flux density of 1.5 Tesla, and the TH808's original acoustic adjustment delivers delicate, high-resolution sound quality over a wide bandwidth. The diaphragm combines bio-cellulose fiber with other fibers under optimal conditions to achieve low specific gravity, high Young's modulus and high internal loss. The low distortion rate, the ultra-strong repulsive magnetic circuit of neodymium magnets, and the linearity of the free edge give responsiveness and dynamic range across the frequency range.

  The housing is carved from solid black walnut and features a unique design with an open aperture and a double arrangement of etched aluminum parts that change their impression depending on the light and angle. The carefully tuned aperture ratio and internal parts combine with the resonance of the walnut to reproduce a natural sound field that does not tire the listener.

  The TH808 comes with its own high-purity OFC unbalanced cable, free from impurities to enhance transmission performance. It uses detachable connector terminals with rhodium plating for hardness, abrasion resistance and corrosion resistance, and 7N grade cable for internal wiring. Balanced connection is supported with the XLR-terminal cable ET-H3.0N7BL, sold separately.

  The earpads are similar to those of the TH909, with low-resilience cushions that cover the rear of the ears to reduce sound leakage, and high-grade synthetic leather for a comfortable fit during prolonged use.
specs: |-
  - Type: Open-back dynamic
  - Driver: 50 mm neodymium magnet / BioDyna diaphragm
  - Impedance: 25 ohm
  - Sensitivity: 100 dB/mW
  - Maximum input: 1,800 mW
  - Frequency response: 5 to 45,000 Hz
  - Weight: Approx. 400 g (excluding cord)
  - Cable: 3 m Y-type OFC wire, detachable connector terminal 2-pin, rhodium-plated (C1011/JIS standard product)
  - Detachable terminal: 2-pin (rhodium-plated with gold-plated base)
  - Plug: 6.3 mm gold-plated stereo standard plug
  - Accessory: Leather style pouch
  - Internal wiring: 7N grade cable
  - Optional balanced cable: ET-H3.0N7BL (XLR)
  - Housing: Solid black walnut with double-layered etched aluminum aperture
  - Assembled in Japan
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
