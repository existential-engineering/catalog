description: Original open-back premium dynamic headphones from the TH Premium
  Series, developed based on the TH909. Features solid black walnut housings
  with etched aluminum accents, an in-house BioDyna diaphragm driver unit, and
  careful assembly at a Japanese factory.
details: |-
  Features:
  - Open-back dynamic headphones built around an in-house BioDyna diaphragm driver
  - Solid black walnut housings with etched aluminum accents
  - Magnetic flux density of 1.5 Tesla
  - Low-resilience cushioned ear pads
  - Detachable 2-pin cable with rhodium-plated, gold-plated base connector
  - High-purity OFC unbalanced cable included; supports balanced XLR connection (cable sold separately)
  - Carefully assembled at a Japanese factory

  Weight: Approx. 400 g (excluding cord)

  Accessories: Leather style pouch
