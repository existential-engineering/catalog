description: >-
  The CZ-3000 is a professional 61-key phase-distortion digital synthesizer from Casio
  with 16-voice polyphony. It expands the CZ series into the professional arena with a
  full 5-octave splittable keyboard, 8-stage envelopes, and 2 oscillators per voice for a
  thicker tone.
details: |-
  The CZ-3000 represents a significant step in Casio's synthesizer line, building upon the successful CZ-101 and CZ-1000 models. It expands the Casio CZ series further into the professional arena while maintaining the same sound character and programming methods. The CZ series utilizes phase-distortion digital synthesis that creates a unique sonic character compared to analog competitors.

  Casio's CZ series distinguished itself through accessibility and distinctive character. Their sound is similar to the Yamaha DX synths but is much easier to program. The CZ-3000 and CZ-5000 represent the pinnacle of Casio's synthesizer offerings, though the CZ-5000 distinguishes itself with expanded waveform memory. These instruments proved valuable for musicians seeking low-cost means of getting into vintage digital synth sounds.

  The synthesis approach provided creative possibilities beyond traditional synthesis. The CZ-3000 is not analog and has no filters, but many still find it useful where strange synth sounds are needed such as industrial and electro types of music.

  With 32 preset and 32 user-programmable patches, onboard chorus, and full MIDI control, the CZ-3000 offered a compelling package for its era. It remains a sought-after instrument for those exploring the distinctive timbres of phase-distortion synthesis.
specs: |-
  - Synthesis: Phase distortion
  - Polyphony: 16 voices
  - Oscillators: 2 per voice
  - Keyboard: 61 keys, 5 octaves, splittable
  - Envelopes: 8-stage
  - Presets: 32
  - User Patches: 32
  - Effects: Chorus
  - Filter: None
  - Control: MIDI
