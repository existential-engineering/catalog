description: >-
  The Korg 770 is a monophonic analog synthesizer released in 1976, featuring a ring
  modulator and the ability to process external audio signals. Known for its bass, string,
  and lead sounds, it was used by artists including Freddy Fresh, Simple Minds, and The
  Human League.
details: |-
  The Korg 770 represents an early entry in Korg's synthesizer lineup, arriving during the formative years of analog synthesis. As a monophonic instrument, it can only play one note at a time, making it suited for bass lines, leads, and melodic textures rather than chordal or harmonic parts.

  The synthesizer's character is defined in large part by its ring modulator, which enables the creation of metallic and atonal timbres. Beyond its core synthesis engine, the instrument can route external sound sources through its signal path, expanding its sonic palette beyond the internal oscillators. This made it a useful tool for experimental processing of other instruments or sound sources.

  The envelope generator features fast attack times, along with an auto-bend function and LFO re-triggering capability for dynamic modulation. The synthesis architecture is straightforward, typical of early 1970s design philosophy that emphasized hands-on control over complex parameter management. Notable users include Freddy Fresh, Simple Minds, and The Human League.
specs: |-
  - Polyphony: Monophonic (1 voice)
  - VCO-1: Scale options (64', 32', 16', 8', 4', 2'); triangle, square, sawtooth, pulse, PWM, and external signal input
  - VCO-2: Coarse/fine tuning; sawtooth, Ring 1 & 2, scale noise, pink noise, white noise
  - LFO: 2 (VCO Vibrato labeled as LFO2)
  - Filters: Two VCFs (High Pass and Low Pass, Traveler model)
  - VCA: Attack time, singing level, range selector, sustain and mode selectors, trigger mode control
  - Keyboard: 32 keys
  - Memory: None
  - Controls: VCF foot pedal, CV/Gate mod capability, mouth/breath controller support
