name: Spaghetti
manufacturer: bastl-instruments
primaryCategory: utility
categories:
  - mixer
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/spaghetti
description: Utility module combining a buffered multiple with an inverter and a
  unity mixer. One main signal input feeds an inverted output and two buffered
  multiple outputs (low offset ~0.015%), plus a unity gain mixer with two inputs
  and one output. A bipolar LED provides signal visualization from approximately
  2V.
details: 4HP, 35mm depth (skiff-friendly). +12V <15mA, -12V <35mA, +5V <35mA.
  16-pin power connector with PTC fuse and diode protection. Requires +5V bus.
  Bipolar LED visible from ~2V.
