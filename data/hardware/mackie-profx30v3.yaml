description: "30-channel professional analog USB mixer with effects, fully
  optimized for professional recording and live sound reinforcement. Features 25
  award-winning Onyx mic preamps and a versatile GigFX effects engine."
details: |-
  Experience the best-in-class series of professional analog USB mixers with effects. The Mackie ProFX30v3 is fully optimized for professional recording and live sound reinforcement. With 25 award-winning Onyx preamps and a versatile GigFX effects engine, it delivers studio-grade audio capture and live performance reinforcement in a single mixer.

  The Mackie ProFX30v3 features twenty-five award-winning Onyx mic preamps for capturing pristine audio in the studio or on stage. Each preamp offers up to 60dB of gain with low noise performance, ensuring transparent capture of microphones and line-level sources.

  The Mackie ProFX30v3 has a high-resolution effects engine to give your sound the perfect touch. The GigFX effects engine includes 24 built-in effects covering reverbs, delays, choruses and more, with a dedicated footswitch input for FX mute control during performances.

  Ensuring you get great sound is our top priority, which is why the Mackie ProFX30v3 is optimized for USB recording at sample rates up to 192 kHz. Dual stereo USB return paths and high-resolution conversion make it a capable interface for capturing multi-source sessions.

  Real-time monitoring is crucial for every recording application, and latency issues can make monitoring unbearable. The ProFX30v3 provides latency-free direct monitoring along with a dedicated control room output and headphone output with separate level and blend control.
specs: |-
  - 30-channel USB mixer with 25 low-noise Onyx preamps (60dB gain)
  - 3-band EQ with On/Off hard bypass and variable mid frequency
  - Dual stereo USB return
  - Latency-free direct monitoring
  - High-resolution recording up to 192kHz via USB
  - 24 included effects (reverbs, delays, choruses via GigFX)
  - Built-in compression
  - Switchable Hi-Z inputs for guitars/bass
  - 100Hz low-cut filter and 48V phantom power on all channels
  - Aux/Monitor with per-channel send control
  - Dual stereo subgroup output bus
  - Headphone output with separate level and blend control
  - Dedicated control room output
  - Footswitch input for FX mute
  - Waveform OEM professional software included
