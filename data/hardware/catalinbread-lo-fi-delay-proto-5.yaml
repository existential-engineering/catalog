description: A triple-tap delay with each tap running into its own carefully
  tuned filter circuit, followed by modulation and output summing. The Lo-Fi
  knob simultaneously increases the cutoff frequency of each filter and the
  amount of modulation, letting it function as a standard delay or create unique
  lo-fi textured effects. Based on recovered code from a prototype developed
  before the engineer joined Catalinbread, adapted for the current platform.
details: |-
  The Lo-Fi Delay Proto 5 uses a triple-tap delay architecture where each tap runs into its own independently tuned filter circuit before being summed at the output. The design is based on recovered code from a prototype developed before the engineer joined Catalinbread, adapted for the current hardware platform.

  The Lo-Fi knob is the centerpiece: turning it up simultaneously raises the cutoff frequency of each tap's filter and increases modulation depth, letting you go from a standard digital delay to heavily degraded, tape-style lo-fi textures. An internal volume trimmer adds saturation to the preamp for enhanced character.

  Limited Proto Club release.
