description: >-
  The upgraded version of E-mu's Vintage Keys rackmount module, doubling sample
  memory to 16MB ROM and expanding to 512 patches of sampled classic synthesizer
  sounds with 32-voice polyphony.
details: |-
  The Vintage Keys Plus expanded on the original Vintage Keys by doubling the sample memory to 16MB of ROM and increasing the patch count from 358 to 512. An upgrade kit was also available for original Vintage Keys owners wanting to reach Plus specifications.

  Like the original, the Plus model featured a lowpass VCF filter, ADSR envelopes, portamento, and chorus effects, with extensive real-time modulation options and full MIDI control across 16 parts.

  The Vintage Keys Plus found a dedicated following in the electronic and dance music scenes of the early-to-mid 1990s. Notable users included Hardfloor, The Prodigy, Fatboy Slim, Meat Beat Manifesto, Goldie, and Faithless. While it delivered a distinctly digital interpretation of analog sounds rather than exact replicas, that character became part of its appeal for producers working in genres where pristine accuracy mattered less than having usable vintage-flavored tones on tap.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 16 parts
  - Sound memory: 16MB ROM
  - Patches: 512
  - Filter: Lowpass VCF
  - Envelope: ADSR VCA
  - Effects: Chorus
  - LFO: Multiple modulation sources and destinations
  - Control: MIDI
  - Format: Rackmount (no keyboard)
