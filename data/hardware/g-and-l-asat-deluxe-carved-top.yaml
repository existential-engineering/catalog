details: |-
  The ASAT Deluxe Carved Top: one of the beefiest ASATs ever.

  One look and you know this ASAT is badass. It is fired up with twin chrome-covered Alnico humbuckers, designed by G&L's Paul Gagon, mounted in a bound, flame maple-topped nato body. This axe takes the iconic ASAT further into heavy territory while retaining the feel and playability that have made the ASAT a perennial favorite among players.

  The ASAT Deluxe Carved Top sports an easy-playing 1-5/8" nut-width neck, a classic C-shaped back and 12" fingerboard radius to make deep bends a breeze. Holding it down on the other end is a G&L Saddle Lock bridge designed by Leo Fender for comfort and singing sustain. The Gagon-designed pickups are split via a push/pull tone pot to offer everything from jangly single-coil tones to gritty blues to scorching leads.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L AS4250C in neck position, G&L AW4370C in bridge position; designed by Paul Gagon
  - Body wood: Nato with Flame Maple top and white binding
  - Neck wood: Hard-Rock Maple with satin finish and Rosewood fingerboard
  - Neck radius: 12"
  - Frets: 22 medium jumbo
  - Neck width at nut: 1 5/8"
  - Neck profile: classic C
  - Bridge: G&L Saddle Lock
  - Controls: 3-position pickup selector, volume, tone with push/pull coil tap
  - Finish: Bright Blueburst or Trans Black, bound body, black headstock
  - Available in: Trans Black over Flame Maple top on Nato, Rosewood fingerboard
  - Available in: Bright Blueburst over Flame Maple top on Nato, Rosewood fingerboard
