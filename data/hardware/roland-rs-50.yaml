description: >-
  The Roland RS-50 is a 2003 entry-level 61-key synthesizer designed for live performance,
  featuring 64-voice polyphony and 640 preset tones built on Roland's ROM-based sound
  engine. It emphasizes straightforward sound selection with refined essential sounds
  including piano, strings, brass, and organ, along with performance-oriented features
  like Direct Access buttons, D-Beam controller, and chord memory. The RS-50 includes a
  phrase/arpeggio library with over 200 templates, 47 multi-effects types, and supports
  patch editing through an included software editor for PC and Mac.
details: |-
  The RS-50 targets live keyboard players seeking straightforward sound selection without extensive parameter tweaking. Roland concentrated on refining essential live sounds including piano, strings, brass, and organ, marketing the instrument for its "CD-quality sounds" and performance-oriented workflow.

  The synthesizer supports patch editing through brightness, attack, decay, modulation, and effects adjustment. Users can layer two tones to create richer sounds. It features chord memory functionality, enabling single-key chord playback of registered voicings, and includes a phrase/arpeggio template library with over 200 selections.

  Performance controls include pitch bend and modulation wheels, as well as Roland's D-Beam controller technology. A rhythm guide metronome with preset patterns and variations is also included. The unit was designed for portability, weighing just over 12 pounds.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts (2 tones per part, split or layered)
  - Oscillators: 2 per part
  - Wave Memory: 32MB ROM
  - Filter: 12dB (2-pole), 24dB (4-pole), bandpass, comb, highpass, lowpass with resonance
  - LFO: 2 with sample and hold, saw up/down, square, triangle
  - Envelopes: 2 ADSR per part
  - Tones: 640 original presets
  - Patches: 384 original plus 256 General MIDI 2, 128 user
  - Effects: 47 multi-effects types, 8 reverb types, 8 chorus types
  - Arpeggiator: Over 200 phrase/arpeggio templates
  - Sequencer: 473 phrase patterns
  - Keyboard: 61 keys with velocity
  - Control: MIDI In/Out
