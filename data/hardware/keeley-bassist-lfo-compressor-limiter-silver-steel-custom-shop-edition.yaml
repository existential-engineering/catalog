details: |-
  This is the redesigned Bassist LFO compressor and limiter from the Keeley Custom Shop, in a limited edition sparkle colorway. It provides high-fidelity compression and limiting engineered for bass.

  The pedal is built around the THAT Corp 4320, using high performance voltage controlled amplifiers, an onboard true-RMS detector and high performance op-amps. VCA compression gives precise control, which suits bass guitar. Where Keeley's older compressors are based on the CA3080 or the LM13700 and suit single coil guitars, the Bassist handles active pre-amps and hot instrument line level signals. Bandwidth is over 20 kHz with low noise, so the design is presented as rack-mount quality in a pedal.

  Used as a limiting amplifier it protects speakers from clipping and distortion. The Threshold control sets the level at which peaks are caught, with a threshold indicator LED showing what is being limited, and the Compression control sets the ratio applied above threshold. Fully down gives no compression at 1:1, leaving the Gain control usable as a boost; fully up gives an above-threshold hard-knee limiter. Keeley suggests about 2:1 for soft compression, 4:1 as a starting point for bass, 5:1 or 6:1 for slap and funk playing and 10:1 for synth bass.

  Attack and release are governed by a single time constant parameter, as is usual for a feed forward compressor with a true-RMS detector, so both adapt to playing level and program content. Release times are generally around a hundred times longer than attack times.
