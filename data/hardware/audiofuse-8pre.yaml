name: AudioFuse 8Pre
manufacturer: arturia
primaryCategory: audio-interface
website: https://www.arturia.com/products/audio/audiofuse-8pre/overview
prices:
  - amount: 899
    currency: USD
description: >
  Giving you the best of both worlds, AudioFuse 8Pre gives you 8 premium quality preamps in a studio-friendly rack format. Use it as a standalone audio interface, or supply your main interface with 8 more channels of pristine analog audio.
details: |-
  The audiofuse 8pre is an 8-channel audio interface and adat expander that functions as both a standalone interface and an expansion solution for existing setups. It features 8 premium discretepro preamps in a studio-friendly rack format, delivering pristine analog audio with unrivalled quality at its price point. The device can be used independently with USB connectivity, expanded via adat to existing interfaces, or cascaded with another audiofuse 8pre to create a complete 16-channel analog I/o system.

  The 8pre delivers exceptional audio quality through its analog signal path with the highest quality components, super-low equivalent input noise (ein) for capturing subtle details, and huge input gain to drive even the most demanding low-output microphones. It features the best a/d converters available with 24-bit resolution at up to 96khz sampling rate, ensuring perfectly transparent ad/da conversion with a totally flat frequency response for complete transparency. Channels 1 and 2 include instrument inputs with easy-access xlr/trs combo connectors on both front and rear panels for automatic switching, plus analog balanced inserts for adding external line-level devices into the signal flow before digital conversion.

  The interface provides comprehensive monitoring options with independent headphone and speaker outputs, each with individual level control, supporting headphones up to 600 ohms. Eight individual analog line outputs allow routing to outboard gear or providing mixing options for live performances. Direct monitoring features an ultra-low latency internal mixer, while reliable USB-c connectivity ensures low-latency performance for demanding sessions. The Bluetooth receiver enables listening to and recording audio directly from phones or tablets into your DAW, making it suitable for bedroom production, mobile sound recording, or tracking live bands.

  The audiofuse 8pre supports flexible connectivity with double adat I/o ensuring 8 digital inputs and outputs channels up to 96khz sample rate, dedicated studio word clock I/o with switchable hiz termination, and both USB type-c and USB type-b cables provided. It can cascade 2 audiofuse 8pres together to create a complete 16 analog I/o system, even on operating systems like windows asio or ios that allow only one single audio USB device. The unit features a quick-access button for opening the audiofuse control center software, with long press enabling power up or shutdown.

  The audiofuse 8pre comes complete with the audiofuse creative suite, an ever-evolving selection of creative plugins including vintage studio tools, contemporary effects, and inspiring presets. Each unit includes a discretepro individual audio performance certificate, and the package contains the audiofuse 8pre unit, power supply, and two USB cables. The robust metal desktop chassis can be installed in either desktop or rack mount configuration, making it adaptable to various studio setups.
specs: |-
  - 8 channel audio interface
  - Adat expander
  - 8 discretepro microphone preamps
  - 2 instrument inputs (channels 1-2)
  - 8 independent analog line outputs
  - 2 analog balanced inserts (channels 1-2)
  - 16 inputs, 20 outputs channels
  - Speaker analog outputs on balanced trs jack
  - 1 stereo headphones output on 6.35mm and 3.5mm trs
  - Headphone output rated for up to 600 ohms
  - Direct monitoring with ultra-low latency internal mixer
  - 8 digital adat inputs/outputs up to 96khz
  - Word clock input/output/thru on bnc
  - 24-bit ad/da converters
  - Up to 96khz sampling rate
  - USB-c interface
  - USB 2.0 compatible
  - Fully independent mic/line circuits
  - Xlr/trs combo connectors on channels 1-2 (front and rear panel)
  - Automatic switching at insertion
  - Bluetooth receiver
  - Low-latency USB-c connectivity
  - Flat frequency response
  - Super-low equivalent input noise (ein)
  - High input gain for low-output microphones
  - Desktop or rack mount installation
  - Cascade 2 units via adat for 16 preamps
  - Windows asio compatible
  - Ios compatible
  - Discretepro individual audio performance certificate
  - Audiofuse creative suite included
  - Robust metal desktop chassis
