description: DRIP is an 8hp stereo multimode filter Eurorack module based on the
  Mutable Instruments Ripples V1 filter section, offering separate 12dB/oct,
  24dB/oct and bandpass outputs for each channel.
details: |-
  Mutable Instruments' Ripples filter sounds lovely, and then After Later Audio combined two in their Popple module. DRIP / Popple is an 8hp multimode stereo filter based on the Mutable Instruments Ripples V1 filter section. Features:

  References:

  https://afterlateraudio.com/products/popple-presale

  https://github.com/AfterLaterAudio/Eurorack/tree/master/Popple

  https://github.com/pichenettes/eurorack/tree/master/ripples/hardware_design
specs: |-
  - Stereo inputs.
  - Separate 12db/oct, 24db/oct, and bandpass outputs for both channels.
  - Attenuverters to dial in exactly how much modulation each channel receives.
  - FM inputs to modulate L & R separately.
  - Self oscillation at high resonances.
