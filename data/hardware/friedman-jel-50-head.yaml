description: The Jake E Lee signature 50-watt all-tube head, a hand-wired
  two-channel EL34 amplifier pairing a Plexi voice with Lee's own higher-gain
  channel.
details: |-
  Jake E Lee ranks high on the shortlist of influential guitarists who emerged as the heroes of a new generation in the early '80s. Best known for his burning guitar work and innovative songwriting, Lee contributed to two of Ozzy Osbourne's most revered albums, 1983's Bark at the Moon and 1986's Ultimate Sin. Jake E Lee and Dave Friedman combined their ears and talents to create the Friedman JEL-50, a signature amplifier that offers Lee's tones in a boutique hand-wired package.

  Through Ozzy, his post-Ozzy band Badlands and more recently his own group Red Dragon Cartel, Lee's playing has embraced the athleticism of the '80s while remaining firmly rooted in the hard rock fundamentals of the '70s, and his tonal choices provide the evolutionary glue between the sonics of those two great eras.

  In Lee's own words, "this amp puts the two specific tones I use to create my sound in one head: The sweetness and warmth of a classic Plexi and the more aggressive slant of the master volume amps of the '80s, all tweaked to my taste." The JEL channel carries gain, master and a three-way bright switch with a push-pull hi/lo gain switch, the Plexi channel its own gain, volume and three-way bright switch, and the two share the bass, middle and treble EQ.

  The JEL-50 was specifically designed to take pedals well, especially boosts, overdrives, phasers, flangers, tremolos and wahs. The ultra-transparent buffered, series effects loop takes time-based effects pedals and rack units equally well, and it is the same FX loop Friedman uses on all its amplifiers, including the BE-100. Rear-panel Thump and Presence knobs vary the low and high end response of the amp's power section.

  The head cabinet features red tolex, white piping and solid Baltic Birch construction, designed to cosmetically match the Jake E Lee 2x12 cab.
specs: |-
  - 50-watt all-tube head
  - Two channels
  - Handwired in the USA
  - Custom USA made transformers
  - 2 x EL34 power tubes
  - 3 x 12AX7 preamp tubes
  - JEL channel: gain, master, 3-way bright switch
  - JEL channel hi/lo push-pull gain switch
  - Plexi channel: gain, volume, 3-way bright switch
  - EQ of bass, middle and treble shared by channel 1 and channel 2
  - Ultra-transparent series effects loop
  - Thump knob (rear) varies the lower response of the amp's power section
  - Presence knob (rear) varies the high end content of the amp's power section
  - Single button foot switch for channel selection
  - 4, 8 and 16 ohm impedance jacks
  - Red tolex, white piping and solid Baltic Birch construction
  - Limited lifetime warranty
  - Dimensions: 8.75 in (D) x 24 in (W) x 10 in (H)
  - Weight: 33.5 lbs
