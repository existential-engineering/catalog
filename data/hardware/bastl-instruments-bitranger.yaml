details: |-
  The bitRanger is a handheld patchable analog logic computer designed by Peter Edwards (Casper Electronics) and produced by Bastl Instruments. It functions as both a portable standalone synthesizer and a studio instrument capable of sculpting sonic worlds ranging from data noise to melodic arpeggios.

  At its core, the bitRanger features an LFO clock oscillator and a VCO with HFO sync, along with four operational modes selectable via switches. The device includes Divider Bits and Adventure Bits sections, MUX 1 and MUX 2 input sections, and a BYTE CV (R2R DAC) section for bit-to-CV conversion.

  With 118 jumper cable patch points on its internal patchbay, the bitRanger offers extensive patching possibilities. It can be synchronized with drum machines and sequencers via its clock I/O, controlled via CV, and used as an algorithmic pattern generator. A stereophonic headphone output and built-in speaker with volume control allow for immediate monitoring.

  Powered by a 9V battery (minimum 20 hours) or a 9V DC center-positive supply. Optional expansion modules: SYNAPSIS (4×4 pushbutton matrix) and BITBOARD (breadboard add-on). Discontinued.
