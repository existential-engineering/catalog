details: |-
  SOUND DESTRUCTION DEVICE

  (Ultimate Distortion Tool)

  The Sound Destruction Device is a variable resistor distortion with a twin T-notch filter that distorts, glitches, clips, and filters sound into unearthly shapes. Five parameters allow for creating super thick fuzz, starved splatters, and sonic malformations. CV control takes the damage to another level. Warp, contort, and twist shapes to create your own distinctive tones. The Sound Destruction Device has no limits. It is the ultimate distortion tool! Designed and assembled in Seattle, Washington. 8hp, 18mm deep, 10ma current draw. Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
