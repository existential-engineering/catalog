  Charcoal Tweed and Silver Weave with the classic Ashdown double-wing badge,
  offers rich lows, smooth mids, and detailed highs. A versatile, road-ready cab
  for bassists seeking big sound without the bulk.
details: |-
  The Ashdown UK-RBM-115T is a UK-crafted bass cabinet designed to deliver the depth and weight that only a 15" speaker can provide. Rated at 300 watts at 8 ohms, it offers a powerful low-frequency foundation while remaining practical and portable. At its heart is a high-efficiency Sica NEO 15" driver with an adjustable high-frequency tweeter, allowing bassists to move from smooth, vintage warmth to a more open, hi-fi sound. Constructed from high-quality plywood, the tuned enclosure delivers tight, controlled bass and is finished in Charcoal Tweed with Silver Weave grille cloth and Ashdown's signature double-wing badge.
