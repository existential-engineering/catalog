details: |-
  The 3.7i

  The 3.7i is the first model in our floor-standing lineup to incorporate our famous ribbon tweeter along with quasi-ribbon bass and midrange drivers. As Jonathan Valin says "Maggie's three-way, true-ribbon /quasi-ribbon planar 3.7i successfully addresses three issues that have long plagued "true-ribbon" Maggies: the seamless integration of that ribbon; the retention of detail and dynamic range at relatively low volume levels; and the reduction of "Maggie grain." The solution of these problems combined with the famous virtues of true-ribbon Magnepans produces what is, in JV's opinion, a best buy....."

