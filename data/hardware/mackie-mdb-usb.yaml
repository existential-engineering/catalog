details: |-
  From acoustic guitars to laptops, always sound your best with MDB Series Direct Boxes. Available in four different models, the MDB Series will give you the peace of mind that your sound will faithfully get to your audience the way that you hear it on stage.

  With the bus-powered MDB-USB Stereo DI, the days of relying on your headphone jack to get audio from a computer into analog gear are over. Combining a high-resolution audio interface with a noise and distortion-free stereo DI, MDB-USB converts your digital audio into clean, balanced, stereo output.

  Featuring an output level control, headphone output, and mono sum for maximum versatility. Analog outputs are dual XLR with ground lift.

  The built-in USB interface streams audio from a computer and routes it to the outputs and headphones. It shows up automatically on PC and Mac with no driver required, and the power LED lights green once the computer is connected.

  The level knob adjusts the overall volume to the XLR outputs and headphones together. The mono switch sums the stereo signal to mono, and the ground lift switch separates chassis ground from signal ground at the balanced outputs.
specs: |-
  - High-resolution 24-bit / 96 kHz interface
  - Balanced, low-impedance XLR outputs with Ground Lift
  - Output level control with Mono switch
  - Headphone output for easy monitoring
  - Noise-free operation
  - Connect your computer directly via USB
  - USB bus powered, 90 mA; no separate power supply
  - Plug and play operation, no driver required
  - Built-Like-A-Tank construction
  - Input type: female Type-B USB; USB 2.0
  - Output type: 2x male XLR balanced, plus 1/8" stereo unbalanced phones
  - Output impedance 600 ohm balanced (XLR), 150 ohm balanced (1/8")
  - Sample rates set by computer: 44.1 / 48 / 88.2 / 96 kHz at 16 or 24 bits
  - Supports WDM, MME, CoreAudio, DirectSound and .WAV
  - Compatibility: Windows 7, 8, 10 and Mac OS
  - Frequency response 20 Hz to 20 kHz, +/-0.5 dB
  - Total harmonic distortion below 0.01%
  - Dynamic range 88 dB
  - Stereo channel separation below -78 dB
  - Dimensions 1.5 x 3.4 x 5.8 in / 38 x 86 x 147 mm
  - Weight 1.0 lb / 0.5 kg
