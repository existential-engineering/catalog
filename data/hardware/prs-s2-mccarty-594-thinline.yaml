details: |-
  The S2 McCarty 594 Thinline is an all-mahogany, thin-body guitar with a powerful voice. Whether you are looking for authentic humbucking tones or nuanced, sweet single-coil sounds, the S2 McCarty 594 Thinline can seamlessly master both sonic territories thanks to its Maryland, USA-made PRS 58/15 LT pickups and dual volume and push/pull tone controls.

  The S2 McCarty 594 Thinline is addictive to play, thanks in part to its all-mahogany body, versatile control layout, and bound 22-fret Pattern Thin neck. The distinctive, powerful voice is backed by modern construction, so it plays in tune, stays in tune, and is intonated the entire length of the neck. The zinc two-piece bridge with brass saddles and steel studs, bone nut, and Phase III tuners with unplated brass shafts anchor this guitar and stay true to the promise of the McCarty family.

  Designed to capture the heart of the McCarty family of instruments and stay true to the S2 Series spirit, the S2 McCarty 594 Thinline stands on its own as a gig-ready, roadworthy workhorse for the player who wants to cover a lot of musical ground.
