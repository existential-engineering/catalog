description: A three-mode delay pedal combining pitch-shifted fuzz delay,
  multi-delay filtering, and envelope-controlled filtering, with presets and
  expression control.
details: |-
  It's About Time. Get it here! This three-mode, space-time warping delay is like nothing you've heard before. From sub-octave echoes, multi-delay washes, and mind-bending pitch-shifted repeats, the TIME SHADOWS II offers a universe of ambient and explosive sounds ready at your fingertips, all with customizable presets, expression control, and many new features and upgrades to bring the TIME SHADOWS into the next frontier. Details Back once again, the Time Shadows II is here to bring you to new sonic frontiers, now with preset settings, Expression Control, and a formerly-secret third algorithm with even more extreme delay-bending sounds. Hear again the iconic pitch-shifted extreme delay sounds from the minds of our very own Oliver Ackermann and EarthQuaker Devices' Jamie Stillman and make your journey through the shadows of time. The EarthQuaker Devices side transforms whatever you play into the sound of a jazz space bazooka! It's a pitch morphed fuzz delay filter with so much attitude that you are actually intimidated. It takes the input signal, blows it out with power of digital distortion, blends it with a polyphonic sub octave, feeds it into a delay, then spits it out into a highly resonant envelope controlled lowpass filter. The Death By Audio side is a multi-delay filter remorphinator that goes from icy shimmers to cosmic space caves of bouncing repeats. The middle position is an energy beam that brings your earthly transmissions repetitively closer to the heavens while simultaneously diving deep into the hells. In addition to all this madness we also bring you a user assignable expression jack and 6 preset slots to save and recall your favorite settings! With these three unearthly delights, you should have everything you need to break brains and destroy monotony! Designed by our own leader Oliver Ackermann, the Cyberpunk edition brings the same sound in a rugged, white-on-black package with a far-future sci-fi style. Limited to 500 units! Each Time Shadows was lovingly built by druids with very soft hands in the tiny hobbit hole of Akron, Ohio. Controls MODE SWITCH Selects which sound setting you'll be using: EQD, DBA, or the secret "!¡" setting. Each will affect how the rest of the controls behave. TIME Controls the Delay Time. SPAN Controls the intensity of repletion. FILTER Arguably the most fun control on Time Shadows! On the EQD side this controls an envelope for the filter frequency and a gate for the cutoff to the input of the delay. On the DBA side this controls the filter Frequency as well as the shift point of a precisely phased delay line for pole zero interpolation. In the magic middle position, this controls the mix. SAVE/RECALL SWITCH Time Shadows has two operating modes which are indicated by the color of the Save/Recall switch. GREEN: Live Mode The pedal will operate exactly where the controls are set, and any changes will have no effect on the presets unless saved. The Save/Recall switch will stay static green. RED: Preset Mode Time Shadows will operate in a stored preset mode which is selected by the preset switch and the physical settings of the control will be ignored. The Save/Recall switch will stay static red. Time Shadows comes factory set to start up in Live Mode. Presets Time Shadows has six available preset slots for you to save and recall your favorite settings. The settings for each of the three controls, the mode switch and the expression jack assignment can be saved and recalled in any of the slots. Saving a Preset Turn the Preset rotary switch to the desired location you wish to save your preset. Dial in the settings you want to save. Remember; Expression pedal assignment and Modes can also be saved! Hold the Save/Recall switch down until the LED flashes between green and red and then release. Your preset is now saved! Recall a preset Select the desired preset you wish to use with the Preset selector switch, and do one of the two following actions: When the pedal is activated and the effect is in use, hold down the foot switch for at least 0.75 seconds, and it will switch from Live Mode to Preset Mode. You can switch between Live and Preset mode on the fly! Tap the lighted Save/Recall switch. The switch will turn from green to red, indicating you are now in preset mode. Tap again and the switch will turn from red to green indicating you are in live mode. Edit/Overwrite a preset Once in Preset Mode (the lighted Save/Recall switch will be red), make the desired changes to any of the controls in the selected preset. The Save/Recall switch will begin to flash red; indicating a change has been made to the stored preset. Any controls that are not changed will remain as previously saved. Hold the Save/Recall switch down until the LED flashes between green and red and then release. The save switch LED will return to static red and the previous preset has been overwritten. Helpful Preset tips Different EXP assignments can be saved in each preset! Presets can be stored and overwritten when Time Shadows is in Live or Preset Mode. To make changes to an existing preset, you must first be in Preset Mode before making the desired changes. There is no undo for preset saving, so make sure you are not overwriting your favorite sound, especially when you are saving presets from Live Mode! Expression Control Use any TRS expression pedal to take control over the Time, Span or Filter! Time Shadows ships with the EXP jack mapped to the Span control. ASSIGNING THE EXPRESSION CONTROL Insert the expression pedal TRS plug into the EXP jack. Place the expression pedal in the toe down position. Turn the knob on the Time Shadows that you wish to put under control of the expression pedal. It doesn’t matter how far or which direction you turn the control. Put the expression pedal in the heel down position. This control is now assigned to the EXP jack and can be used with an expression pedal! Helpful Expression assignment tips If you turn the knob that is assigned to the EXP jack while the expression pedal is plugged in, the knob will override the expression pedal setting. The expression pedal will reassume control the next time it is used. Different EXP assignments can be saved in each preset! You can also use Control Voltage with the EXP Jack! The CV range is 0 to 3.3v. Flexi-Switch This device features Flexi-Switch Technology! This relay-based, true bypass switching style allows you to simultaneously use momentary and latching-style switching. For standard latching operation: Tap the footswitch once to activate the effect and then tap again to bypass. For momentary operation: Hold the footswitch down for as long as you’d like to use the effect. Once you release the switch, it will return to being bypassed. Note that holding the bypass switch down while Time Shadows is activated will switch into the selected Preset Mode! Since the switching is relay-based, it requires power to pass signal. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 75 mA We recommend using a pedal-specific, transformer-isolated, wall-wart power supply or a power supply with multiple isolated-outputs. Pedals will make extra noise if there is ripple or unclean power. Switching-type power supplies, daisy chains and non-pedal specific power supplies do not always filter dirty power and may result in unwanted noise. DO NOT RUN AT HIGHER VOLTAGES! Expression Pedal Wiring Tip: Wiper Ring: +3.3 V Sleeve: Ground For Nerds Input Impedance: 500 KΩ Output Impedance: 100 Ω Sound Samples DBA Setting Time Voyage Waiting on Infinity Twisted Time Submarine Sweeps EQD Setting Sub Fuzz Fury Underground Doom Far-fetched Octave !¡ Setting Time Warp Falling Spider Creeping Up Sliding Down
