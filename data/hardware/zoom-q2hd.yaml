description: The Q2HD Handy Video Recorder combines the great audio you've come
  to expect from Zoom with high-definition video, all in one compact package.
  Its advanced video sensor and built-in MS microphone allow you to shoot
  lifelike movies with superb stereo sound and then stream your work online.
details: |-
  The Q2HD Handy Video Recorder combines high-definition video with Zoom audio in one compact package. Its advanced video sensor and built-in MS microphone shoot movies with stereo sound that can then be streamed online, and it can also serve as a web camera, a USB microphone or a standalone audio recorder, for live musical performances, auditions and rehearsals, or for journalism, education, sports and travel.

  Video goes to SD, SDHC and SDXC cards up to 64 GB in MPEG-4 AVC/H.264, with WVGA and HD formats up to 1080p at 30 fps and 720p at 60 fps, through a large-aperture lens with up to 4x digital zoom. Three imaging sense options (Auto, Concert, Night) cover different lighting, the 2 inch 320 x 240 colour LCD can be set vertical or landscape, and a mini HDMI output feeds an HDTV with NTSC or PAL selectable.

  The built-in condenser mid-side microphones capture stereo at an adjustable width from 30 to 150 degrees and handle up to 120 dB SPL, with manual or auto gain through a three-position Concert, Meeting and Solo mic gain switch and a low-cut filter for pops and rumble. Audio records in PCM up to 24-bit/96 kHz or AAC, and a built-in speaker plus a line and headphone output cover monitoring.

  Over USB the Q2HD streams in real time with adjustable video and audio synchronisation delay, works as a web camera and USB mic with a laptop or iPad, and acts as an SD card reader for video and audio editing software. Divide and Trim editing happen on the unit. Power comes from two AA batteries, USB bus power or the optional AD-17 adapter, running more than two hours in movie mode and four hours in audio mode.
specs: |-
  - Recording media: SD/SDHC/SDXC card (up to 64 GB)
  - Imaging device: 1/3.2-inch 5 megapixel CMOS sensor
  - Optics: fixed focus lens (1.23 m to infinity), F3.2
  - Video format: MPEG-4 AVC/H.264 (MOV)
  - Video resolution: HD1080p 30 fps, HD720p 60 fps, HD720p 30 fps, WVGA 60 fps, WVGA 30 fps
  - Audio format: PCM 16/24-bit at 44.1/48/96 kHz, AAC 64 to 320 kbps at 48 kHz
  - Audio functions: lo-cut filter, auto gain (Concert/Solo/Meeting)
  - Video functions: 4x digital zoom, scene select (Auto/Concert Lighting/Night)
  - Editing functions: divide, trim
  - Display: 2.0-inch full colour LCD (320 x 240 pixels)
  - Built-in mic: mid-side stereo (mono, 30, 60, 90, 120 or 150 degrees), maximum sound pressure level 120 dB SPL, input gain +1 to +39 dB
  - Built-in speaker: monaural, 400 mW 8 ohms
  - Output: PHONES/LINE OUT 1/8 inch stereo phone jack, HDMI out Type C mini
  - USB: mini-B (USB 2.0 High Speed), USB-VIDEO, USB-AUDIO
  - Power requirements: 2 x AA batteries (LR6 or Ni-MH)
  - Battery life: 2 hours (audio and video), 4 hours (audio only)
  - AC adapter: AD-17 (DC 5 V / 1 A, centre positive)
  - Dimensions: 51 (W) x 126.9 (D) x 35 (H) mm
  - Weight: 85.4 g without batteries
  - HandyShare software system requirements: USB 1.1/2.0 port, 1024 x 600 monitor resolution or more. Windows XP 32-bit SP2 or later, Windows Vista 32/64-bit SP1 or later, Windows 7 32/64-bit, Intel Pentium 4 1.4 GHz or AMD Athlon 64 or faster, 512 MB RAM. Mac OS X 10.4.6 or later, 10.5, 10.6, 10.7, Intel Core Duo 1.66 GHz or faster (Intel Mac only), 512 MB RAM
