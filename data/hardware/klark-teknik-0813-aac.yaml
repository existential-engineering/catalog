url: https://www.klarkteknik.com/en/products/0813-AAC
description: The AIR LINK DW 20T is a wireless stereo transmitter that works
  with DW 20R wireless receivers to bring audio streaming to an installed or
  portable sound system, aimed at hospitality and event spaces as well as retail
  and home audio. It has a maximum wireless range of 100 feet (30 m) and
  balanced XLR plus unbalanced 1/4" TRS inputs.
details: |-
  A high headroom design is used for the transmitter's audio path, with attention to both the design process and component selection.

  An external articulated antenna supports dependable transmission over a range of up to 100 feet (30 m). Multiple receivers can be deployed to provide targeted zone broadcasting, as long as each DW 20R is paired with only one DW 20T at a time, which allows unique content to be streamed concurrently across individual zones.

  The compact aluminium extrusion enclosure can be permanently installed via the included floor and wall mount brackets, or placed on a shelf on its rubber corner protectors. Connectivity is industry-standard XLR and 1/4" TRS input sockets.
specs: |-
  - Wireless stereo transmitter, paired with DW 20R receivers
  - Maximum wireless range: 100 feet (30 m)
  - Inputs: balanced XLR and unbalanced 1/4" TRS
  - External articulated antenna
  - One DW 20T pairs with a given DW 20R at a time
  - Aluminium extrusion enclosure with rubber corner protectors, floor and wall mount brackets included
