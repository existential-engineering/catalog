details: |-
  A PCB/panel set for the PMX3.2 mixer module - all you need to do is provide components and solder them in place. You will need:

  This set requires you to solder 3 (three) 0805 surface-mount resistors in place on the footprints R1, R2 and R3 - it's a lot easier than it appears, and there are multitudinous guides on the YouTubes on how to do it. All you need is a good quality soldering iron and a steady(ish) hand. I strongly recommend soldering the resistors in place first .... A strip of 10 10k resistors is supplied so you've got a few spares in case of mishaps.
specs: |-
  - a Dremel or similar tool to deburr the edges of the boards (if required)
  - 4x PJ301M-12 jacks (aka. ThonkIconn)
  - 3x 9mm Alpha (or equivalent) potentiometers - 100k linear recommended, but go with whatever works for you.
