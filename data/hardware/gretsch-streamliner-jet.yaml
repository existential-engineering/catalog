details: |-
  The Streamliner Jet is a no-nonsense tone machine loaded with exciting new features to deliver exceptional performance, easy playability and rock-solid tuning stability at an incredible value.

  Featuring HotWire humbuckers, a Fast 'C' neck profile, Pitch-Perfect head angle, and an adjustable wraparound bridge, the Streamliner Jet has everything you need to crank out massive riffs. The mahogany body with carved top sports aged white binding, and the Indian Laurel fingerboard carries 22 medium jumbo frets and pearloid Neo-Classic thumbnail inlays.
