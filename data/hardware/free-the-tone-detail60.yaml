description: The MOTION LOOP ML-1L is a short looper that performs short-term
  sampling and real-time effect processing such as pitch shift, delay and
  filter.
details: |-
  The MOTION LOOP is a short looper that performs short-term sampling together with real-time effect processing such as pitch shift, delay and filter. Its real-time processing lets the looper be handled like a musical instrument, and random processing of sampled waveforms can create accidental sounds.

  The main effects implemented in the unit are pitch shift (up or down to two octaves, with adjustable pitch-shift speed), delay with a subdivision function, high-pass and low-pass filtering, a fade curve effect that adjusts the attack of the sound, reverse, soft clipping, loop level (a volume increase or decrease for each repeat of the loop), slowdown (pitch change speed slowed along with lowering of pitch), and random, which divides the waveform randomly and rejoins the split pieces.

  Effect processing runs on a dedicated DSP. A combination of 32-bit fixed point high-speed arithmetic and 32-bit floating point high precision arithmetic is used to satisfy both sound quality and processing speed, and a waveform smoothing process prevents noise caused by discontinuities in spliced waveforms.

  A re-triggering function with per-preset sensitivity adjustment is provided, the knob and expression pedal assignments are configurable in each preset, and setting a BPM lets the loop be manipulated in sync with the beat of the performance. The unit stores 128 user presets alongside 35 factory presets.

  Free The Tone's HTS (Holistic Tonal Solution) circuit performs impedance conversion while drawing out the sound characteristics of the guitar or bass, which the maker describes as achieving both high sound quality and low noise, and which prevents deterioration of the instrument sound even when the effect is off.
specs: |-
  - 128 user presets, 35 factory presets
  - Input impedance: 1M Ohm
  - Output load impedance: min. 10k Ohm
  - Max. input level: +10 dBu
  - Terminals: 1 x 1/4 inch standard TRS phone jack (input), 3 x 1/4 inch standard TS phone jack (output, EXP/CV/FS), 9 VDC input jack (for AC adaptor), 3.5-mm stereo mini jack (MIDI IN)
  - Power supply: 9V DC center negative polarity, or 006P (9V) 6F22 alkaline battery
  - Current consumption: approx. 185 mA
  - Dimensions: 66 (W) x 125 (D) x 54 (H) mm including protrusions such as jacks
  - Weight: approx. 335 g
  - Recommended expression pedals: 10k to 25k Ohm types
