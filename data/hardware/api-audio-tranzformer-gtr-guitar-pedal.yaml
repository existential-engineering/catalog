name: TranZformer GTR
manufacturer: api-audio
primaryCategory: eq
categories:
  - pedal
  - preamp
url: https://apiaudio.com/product/tranzformer-gtr-guitar-pedal/
description: Guitar EQ/boost effects pedal with API's EQ circuit, three
  guitar-optimized frequency bands (200 Hz, 1500 Hz, 5 kHz), switchable Clean
  Boost or Overdrive, buffered bypass, output pad, and signature API output
  transformer. Operates on 9–18VDC.
details: "API EQ circuit in guitar pedal format. 3 bands: 200 Hz and 1500 Hz
  (peaking), 5 kHz (shelf or peak switchable). ±15 dB per band. Switchable Clean
  Boost or Overdrive. Buffered bypass at 0 dB. −20 dB switched output pad.
  Signature API output transformer. 9–18VDC power (higher voltage increases
  headroom)."
specs: |-
  - Input impedance: 1 MΩ
  - Output impedance: <1 kΩ
  - Input gain: 0–40 dB (variable)
  - Output pad: 0 / −20 dB (switched)
  - Max output: +15 dBu @ 9V / +22 dBu @ 18V
  - Frequency response: 20–20 kHz (±1 dB at center)
  - Tone bands: 200 Hz + 1500 Hz (peaking), 5 kHz (shelf/peak), ±15 dB
  - Power: 9–18VDC @ 100 mA
  - Dimensions: 4.6" × 3.8" × 3"
  - Weight: 1.5 lb
