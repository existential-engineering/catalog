description: Designed to be paired with any of our EVH 5150III® heads - from 100
  watts to our 15-watt lunchbox, the 5150III 4x12 straight-front speaker
  enclosure is the ultimate in power and performance. Available in a thick
  textured Black or Ivory covering with woven grille cloth and a silver EVH logo
  badge, the 4x12 cab features premium birch pine construction and is loaded
  with renowned sound from four 12" Celestion® G12 EVH 20W speakers. Removable
  EVH pop-out casters are also included, while a high-quality fitted cover is
  available as an EVH accessory.
