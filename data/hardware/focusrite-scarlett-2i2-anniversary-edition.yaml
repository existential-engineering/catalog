description: "The Scarlett 2i2 Anniversary Edition is a studio-quality 2-in,
  2-out interface, reimagined for the artist."
details: |-
  Limited-edition interface celebrating 40 years of Focusrite, featuring an ISA-blue chassis honoring the brand's heritage. Includes two ultra-low-noise mic preamps with 69dB of gain, Auto Gain and Clip Safe automation, two Air modes (Presence and Harmonic Drive), and loopback functionality.

  Ships in black-and-gold packaging with the historic 'ff' logo and heritage schematic artwork underneath. Bundled with exclusive plugins including Sonnox Voca, Softube Opto Compressor, and Acustica Audio Rust EQ, alongside the full Hitmaker Expansion bundle, Ableton Live Lite, Pro Tools Intro+, and Cubase LE.
specs: |-
  - 2 microphone inputs with 69dB gain
  - -127dBu EIN (A-weighted) mic preamp noise
  - 116dB mic input dynamic range
  - 2 instrument inputs, Hi-Z (1MΩ), 62dB gain
  - 2 balanced line outputs, 120dB dynamic range
  - 1 headphone output, 32mW @ 33Ω / 22mW @ 300Ω
  - 24-bit / 192kHz resolution
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - USB-C connectivity (USB 2.0, 900mA bus power)
  - Dimensions: 180mm W × 117mm D × 47.5mm H
  - Weight: 0.595 kg
  - Compatible with Windows (Intel/AMD/Arm64) and macOS
  - 4th Generation Scarlett
  - 3-year warranty
