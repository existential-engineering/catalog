description: Party Mix DJ Controller with Built In Light Show
details: |-
  Party Mix is a 2-channel DJ controller designed for all skill levels that connects directly to a laptop, enabling users to mix, blend and create just the right mood with professional DJ features, beat-synchronized light patterns, and included DJ software.

  The controller features a built-in light show with three LED arrays offering five light modes including color-controlled, beat-controlled, fixed-timing random, all-on, and off settings. Four cue points per deck with accessible pads handle effects, while auto loop functions provide 8, 4, 2, and 1-bar phrases.

  Instant effects and a sampler (4 samples per side) round out the performance features. EQ controls cover treble, bass, channel gain, and master gain, with manual and automatic beat sync available. Headphone preview lets users cue tracks before mixing them into the master output.

  Party Mix is bus-powered via USB and ships with Serato DJ Lite via a downloadable software card.
specs: |-
  - 2-channel DJ controller with plug-and-play setup
  - Built-in light show with three LED arrays and five light modes
  - Four cue points per deck with accessible pads for effects
  - Auto loop functions on 8, 4, 2, and 1-bar phrases
  - Instant effects and sampler (4 samples per side)
  - EQ controls: treble, bass, channel gain, and master gain
  - Manual and automatic beat sync
  - Headphone preview capability
  - USB bus-powered
  - Dimensions (W x D x H): 12.8" x 7.75" x 2.0"
  - Weight: 1.75 lbs
  - Includes Serato DJ Lite (via downloadable software card)
