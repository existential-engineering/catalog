description: |-
  Brimming with brawny tone, the EVH® 5150III® 50W 6L6 212 Combo is arena-sized sound in a Celestion® powered compact package for more convenient transport.

  Redesigned with versatile, all-new independent dual- concentric controls that allow for gain and volume level matching, this 50-watt tube combo amp boasts three channels for any playing style -  crisp cleans, raw crunch or searing leads.
details: Brimming with brawny tone, the EVH® 5150III® 50W 6L6 212 Combo is
  arena-sized sound in a Celestion® powered compact package for more convenient
  transport. Three channels deliver pristine cleans, overdrive/heavy gain, and
  liquid distortion. Features dual concentric controls for Channels 1-2 with
  shared EQ; Channel 3 has independent gain/volume/EQ. Global presence,
  resonance, and reverb controls included. Cabinet is birch with special
  internal baffling wrapped in Black or Ivory vinyl, powered by two 12"
  Celestion® EVH® G12H 30W Anniversary Series speakers.
specs: |-
  - Model Number: 2254010010
  - Series: EVH® 5150III® Combos
  - Color: Black
  - Amplifier Type: Tube
  - Width: 27.5" (70 cm)
  - Height: 25" (63.5 cm)
  - Depth: 12" (30.5 cm)
  - Weight: 86 lbs (39.01 kg)
  - Channels: Three (Clean, Crunch, Lead)
  - Wattage: 50 Watts (adjustable 50W down to 1W)
  - Voltage: 120V standard (also 100V, 110V, 220V, 230V, 240V)
  - Rectifier: Solid State
  - Preamp Tubes: 7 x JJ ECC83S (12AX7)
  - Power Tubes: 2 x JJ 6L6
  - Speakers: Two 12" Celestion® EVH® G12H 30W Anniversary Series
  - Speaker Wattage: 30W each
  - Channel 1 Controls: Independent Gain & Volume w/Shared Low, Mid, High
  - Channel 2 Controls: Independent Gain & Volume w/Shared Low, Mid, High
  - Channel 3 Controls: Independent Gain, Volume, Low, Mid, High
  - Front Panel Controls: Power Level, Reverb, Global Presence
  - Rear Panel Controls: Global Resonance
  - Knobs: Chicken-head style pointer knobs (white)
  - Cabinet Material: 7-Ply 3/4" Birch Maple
  - Amplifier Covering: Black Textured Vinyl
  - Grill: Woven front with large EVH logo, perforated back panel
  - Handles: Two spring-loaded side handles, one molded plastic top handle
  - Casters: Included (pop-out)
  - Speaker Jacks: Two 1/4" parallel (4, 8, or 16 ohms selectable)
  - Effects Loop: 1/4" Send/Return
  - Line Out: 1/4"
  - Headphone Jack: 1/4" Stereo (mutes power amp)
  - MIDI: Rear-panel input
  - Footswitch: 4-Button (included) - controls three channels and reverb
  - Recommended Cover: Optional P/N 0082061000
  - Warranty: EVH® Amplifiers Limited Warranty (2-Year)
