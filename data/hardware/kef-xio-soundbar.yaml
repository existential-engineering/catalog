description: |-
  A high-end Dolby Atmos 5.1.2 soundbar combining KEF's Music Integrity Engine
  with 820W instantaneous power and AirPlay, Google Cast, and major streaming
  service support. Features KEF's Uni-Q MX driver array for immersive spatial
  audio.
specs: |-
  - HF/MF Drivers: 6× Uni-Q MX 50mm + 2× full-range 50mm
  - LF Drivers: 4× P185 50×180mm with VECO
  - Amplifiers: 8× Class D (HF/MF) + 4× Class D (LF)
  - Amplifier Output: 820W instantaneous
  - Frequency Response: 34Hz–20kHz
  - Maximum SPL: 102dB at 1m
  - Multi-channel: Up to 5.1.2
  - Dimensions (H×W×D): 70×1210×165mm
  - Weight: 10.5 kg
  - Bluetooth: 5.3
  - Wi-Fi: 2.4/5/6GHz (802.11a/b/g/n/ac/ax)
  - Formats: Dolby Atmos, DTS:X, 360 Reality Audio, MPEG-H, FLAC, WAV, AIFF,
    ALAC, AAC, WMA, MP3
  - Streaming: AirPlay, Google Cast, UPnP, Spotify Connect, TIDAL, Amazon
    Music, Qobuz, Deezer
  - Standby power: <2.0W ECO
  - Power: 100–240VAC 50/60Hz
  - Colors: Silver Grey, Slate Black
