description: Instantly recognisable 4x12" angled-front guitar speaker cabinet, the vintage-voiced 'X' variant of the classic Marshall 1960 design. Loaded with four 12" Celestion G12M-25 Greenback speakers for a warmer, lower-power-handling response suited to overdrive and classic rock tones. Handles 100W through a single speaker input at a 16Ω cabinet impedance. Forms the top half of an angled full stack when paired with a matching 1960BX, and pairs naturally with 1959/1987/JCM-style heads.
details: |-
  Create smooth sounds with this 100W 4x12" cabinet. The four Celestion G12M-25 Greenbacks are voiced with a mid-range punch and beautifully detailed highs. With less headroom, the speakers gently break up the sound giving the overdrive more depth.

  This cabinet is also available as a straight base cab, allowing you to create your own Marshall stack.

  Built in the Marshall UK factory, it carries the chequered 70s grill cloth and offers classic rock 'n' roll tone.

  Designed and engineered in UK. Made in UK.
