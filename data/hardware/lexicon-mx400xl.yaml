description: 4-in/4-out Reverb/Effects Processor with USB 'Hardware Plug-In' Capability and XLR connectors. This product is discontinued.
details: |-
  Plug-in programming and recall with the power of Lexicon hardware. You want the rich, luscious sound that's defined studio reverb for three decades: a genuine Lexicon hardware processor. But you also want the flexibility of programming high-quality effects right inside your DAW program, without bogging down your CPU or resorting to expensive processing cards.

  Have it all with the MX400. All parameters of every reverb, delay and dynamic effect in this powerhouse quad processor are available inside any AU compatible DAW program. Just link your computer to the MX400 with a USB cable and control all automation and recall parameters exactly as you would with any software plug-in — while enjoying the sonic benefits only Lexicon hardware can provide.

  Along with the unique 'hardware plug-ins' for PC and Mac (32-bit only), the unit also includes MX-Edit Librarian software so you can store and recall custom programs or pull up your choice of 223 genuine Lexicon settings including 25 dedicated Surround Programs. At its heart, the MX400 is everything you would expect from the company that invented digital reverberation: seventeen Lexicon reverbs, delays and modulation effects plus dbx compression and de-essing, a generous LCD display and big knobs.

  Meet the most Lexicon power ever offered in a super-affordable 1RU effects processor. Perfect for band PAs, churches and clubs. The MX400's intuitive front panel keeps adjustments a bare minimum of knob tweaks away — for example, three individual, assignable parameter controls mean you don't have to page through menus to fine tune a reverb tail. Because you can use its built-in dbx compression and de-essing in tandem with reverb, the MX400 is the perfect tool for taming problem vocalists.
specs: |-
  - 4-in/4-out quad effects processor
  - XLR connectors
  - USB 'Hardware Plug-In' control from AU-compatible DAWs
  - Seventeen Lexicon reverbs, delays and modulation effects
  - Built-in dbx compression and de-essing
  - 223 genuine Lexicon settings including 25 dedicated Surround Programs
  - MX-Edit Librarian software for custom program storage and recall
  - Three assignable parameter controls on front panel
  - 1RU rack-mount form factor
  - LCD display
