id: SqhGTw_WWk8ZG3MYOdS_F
name: 535-LA Line Amplifier
manufacturer: api-audio
primaryCategory: preamp
categories:
  - rack-mount
url: https://apiaudio.com/product/535-la-line-amplifier/
description: 500-series line amplifier modeled after API's console 325 booster
  cards, using 2510/2520 discrete op-amps to amplify, attenuate, and add tonal
  character to line-level signals. Features continuously variable input trim,
  output ratio selector, 20 dB pad, calibrated level mode, and polarity switch.
details: |-
  500-series gain stage modeled after API's 325 console booster card.
  Continuously variable detented input level trim. Output ratio selector. 20 dB
  input pad. Calibrated level mode. Polarity switch. Clip LED indicator. API
  2510/2520 op-amps. All I/O via 500-series edge connector. Use cases: warming
  digital signals, adding tone to keyboard rigs, level control for devices
  without their own level controls.
specs: |-
  - Gain range: −∞ to +53 dB
  - Max input: +32 dBu balanced (with pad)
  - Max output: +32 dBu (1 kHz)
  - Input impedance: >20,000 Ω (~4,000 Ω with pad)
  - Output impedance: <75 Ω
  - Frequency response: −0, +0.2 dB (30 Hz–20 kHz)
  - THD+N: 0.006% @ +4 dBu
  - Noise floor: −85 dBu
