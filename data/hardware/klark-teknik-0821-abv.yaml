description: The DN3698 is the handheld remote controller for the DN3600
  programmable graphic equaliser system. It puts snapshot recall and EQ
  parameter control into a single ergonomic device that travels from rack to mix
  position.
details: |-
  The DN3698 communicates with the DN3600 master unit through the DN3603 docking station, delivering programme control wherever the engineer chooses to stand. Snapshot recall, parameter access and scene management are immediate, which matters when a cue is two seconds away.

  The DN3698 is engineered to survive a touring environment, with conservatively rated electronics and robust connector and cable assemblies. It is part of an integrated programmable-EQ system designed in Kidderminster.

  The controller is described as the part of the DN3600 system the engineer actually holds rather than a peripheral to it.
specs: |-
  - Handheld remote controller for the DN3600 programmable graphic equaliser system
  - Communicates with the DN3600 master through the DN3603 docking station
  - Snapshot recall, parameter access and scene management
  - Conservatively rated electronics with robust connector and cable assemblies
  - Powered by four rechargeable Ni-Cad D cells, or from the supplied external power supply unit, which also charges the batteries
