description: >-
  The Moog Etherwave Theremin is a modern analog theremin that produces sound without
  physical contact, using hand movements near two antennae to control pitch and volume.
  Originally designed by Bob Moog based on Leon Theremin's early 20th-century invention,
  it offers a five-octave pitch range with controls for waveform, brightness, and output
  level. Constructed from solid wood and mic-stand mountable, it has been used by artists
  including Fatboy Slim, Vangelis, Led Zeppelin, Jean-Michel Jarre, and Air.
details: |-
  The theremin is one of the earliest electronic instruments ever created, and Moog Music's Etherwave is the most widely recognized modern implementation. It operates on an oscillating circuit that generates pure sine wave tones, controlled entirely through the performer's hand proximity to two antennae.

  The instrument features two perpendicular antennae: a vertical rod that controls pitch and a horizontal loop that controls volume. By moving hands in the electromagnetic field surrounding these antennae, the performer affects the capacitance within the circuits, thereby changing the oscillator's pitch and the amplifier's volume. This touchless interface makes the theremin uniquely expressive and notoriously difficult to master.

  Moog offered both a signature series featuring Bob Moog's signature and a standard model. A DIY kit version was also available for builders who wanted to assemble their own instrument. Accessories included the Moog TB-15 Theremin Amplifier, a dedicated 15-watt combo amp with an 8-inch speaker and 3-band EQ, as well as instructional videos and a gig bag.
specs: |-
  - Monophonic
  - 1 VCO with 5-octave pitch range
  - Vertical antenna for pitch control
  - Horizontal loop antenna for volume control
  - Waveform control knob
  - Brightness control knob
  - Level control knob
  - Solid wood construction
  - Mic-stand mountable
