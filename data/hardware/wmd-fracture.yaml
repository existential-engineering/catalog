description: Fracture is a multi-particle percussion synthesizer that applies
  analog clap circuit concepts to granular synthesis using proprietary
  micro-samples of claps, snaps, and similar impulse sounds. Density, Decay, and
  Tail controls shape tone from tight drum-machine claps to full audience
  applause.
details: |-
  Multi-particle crowd percussion synthesizer

  Originally inspired by audience applause, hip-hop samples, and classic drum machines, Fracture is a multi-particle percussion synthesizer that applies concepts from classic analogue clap circuits to granular synthesis methods. It all starts from proprietary micro-samples we recorded specifically for this purpose and ends with an engine built to suit these samples. Unlike our other percussion module, Chimera, which uses impulse rich samples as it's tonal center, Fracture uses single impulse samples like claps, snaps, ping pong balls, opening a beer can, and many more. It then plays a group of similar samples back in a psuedo random order for unique hits. Density, Decay, and Tail affect tone and how "tight" your virtual clappers are to playing together. Our goal was to design a clap percussion module covering the range from classic drum machine claps all the way to full audience applause. We ended up with a module that covers a huge range of timbres beyond claps. We hope this engine provides you with the tools to intuitively create wild percussion sounds that bring your system to life in a new way.
