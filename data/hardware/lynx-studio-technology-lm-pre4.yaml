details: |-
  Lynx designed and built the LM-PRE4 as a microphone preamp to complement the capabilities of the Aurora(n). It not only adds the flexibility of four channels of mic, line and Hi-Z inputs, but also adds an additional four channels of A/D conversion. The LM-PRE4 is sonically matched for the Aurora(n), with the transparency, detail and flexibility expected of Lynx.

  Combined with the Aurora(n)'s built-in microSD recorder, the LM-PRE4 transforms the Aurora(n) into a stand-alone mobile recording device. With a total of 16 ins (8 preamp ins plus 8 line ins) and 8 line outs, the Aurora(n) PRE 1608 comes with two LM-PRE4s in either Thunderbolt or USB.

  The preamplifier is a transformerless, fully-differential current-feedback design offering up to 68.6dB of gain in 1dB increments, with a low-noise microphone input measuring -129dBu EIN. Noise and distortion are optimized at all gain settings, and each channel carries independent 48V phantom power, phase, high-pass filter and pad.

  A dedicated line-level signal path provides performance identical to the other AIO8E input channels, gold contact relays handle distortion-free signal routing, and the module integrates with the Aurora(n) mixing and routing engine.

  The LM-PRE4 module can be installed into any existing Aurora(n) -8, -16 and -24 (24 channel models without LM-DIG only) with an easy and free firmware update. The Aurora(n) can also be purchased with the LM-PRE4 pre-installed.
specs: |-
  - Four-channel microphone, line and Hi-Z input module for the Aurora(n)
  - On-board Aurora(n) A/D conversion directly coupled to the preamp output for four additional input channels
  - Transformerless, fully-differential current-feedback preamplifier architecture
  - Independent 48V phantom power, phase, high-pass filter and pad for each channel
  - Gold contact relays for distortion-free signal routing
  - Line input THD+N (1kHz, -1dBFS, 20kHz filter): -113dB (0.00022%)
  - Line input dynamic range (A-weighted, -60dBFS method): 119dB
  - Line input frequency response (deviation over 20-20kHz band, -1dBFS): +/-0.010dB max.
  - Line input crosstalk (adjacent channel, -1dBFS, 1kHz): -138dB max.
  - Line input common mode rejection (-1dBFS, 60Hz and 1kHz): 75dB min
  - Line input full-scale input level for A/D: 20dBu
  - Line input impedance: 200k ohm balanced, 100k ohm unbalanced
  - Line input gain settings: fixed
  - Line input connector: female XLR on Neutrik jack
  - Microphone input THD+N (1kHz, -1dBFS, 20kHz filter): -111dB (0.00028%) @ 21.6dB gain
  - Microphone input EIN (A-weighted): -129dBu @ 61.6dB gain
  - Microphone input dynamic range (A-weighted, -60dBFS method): 116dB @ 21.6dB gain
  - Microphone input frequency response (deviation over 20-20kHz band, -1dBFS): +0.01 / -0.08dB max. at all gain settings
  - Microphone input crosstalk (adjacent channel, -1dBFS, 1kHz): -127dB max. @ 41.6dB gain
  - Microphone input common mode rejection (-1dBFS, 60Hz and 1kHz): 75dB min. @ 61.6dB gain
  - Microphone input full-scale input level for A/D: 28.7dBu @ 5.6dB gain with pad
  - Microphone input impedance: 2.1k ohm
  - Microphone input gain settings: 5.6dB/13.6dB to 68.6dB in 1dB steps
  - Microphone input pad attenuation: 13.6dB
  - Microphone input high-pass filter: 80Hz, 12 dB/octave
  - Microphone input connector: female XLR on Neutrik jack
  - Hi-Z input THD+N (1kHz, -1dBFS, 20kHz filter): -109dB (0.00035%) @ 21.6dB gain
  - Hi-Z input EIN (A-weighted): -115dBu @ 21.6dB gain
  - Hi-Z input dynamic range (A-weighted, -60dBFS method): 114dB @ 21.6dB gain
  - Hi-Z input frequency response (deviation over 20-20kHz band, -1dBFS): +0.01 / -0.05dB max. at all gain settings
  - Hi-Z input crosstalk (adjacent channel, -1dBFS, 1kHz): -132dB @ 21.6dB gain
  - Hi-Z input full-scale input level for A/D: 14.9dBu @ 5.6dB gain
  - Hi-Z input impedance: 1M ohm unbalanced (TS), 2M ohm balanced (TRS)
  - Hi-Z input gain settings: 5.6dB/13.6dB to 68.6dB in 1dB steps
  - Hi-Z input connector: TRS on Neutrik jack
  - Installs into any existing Aurora(n) -8, -16 and -24 (24 channel models without LM-DIG only) with a free firmware update
  - Powered by the host Aurora(n) chassis the module is installed in, so it carries no power inlet of its own
  - MSRP: $1000
