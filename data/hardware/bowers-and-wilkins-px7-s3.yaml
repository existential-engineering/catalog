details: |-
  Px7 S3 is a closed-back wireless over-ear noise-cancelling headphone built around a pair of 40mm dynamic full-range bio-cellulose drive units. Bowers & Wilkins positions it as the High-Performance step in the current over-ear range, below the Reference-tier Px8 S2 and above the outgoing Px7 S2e, and says it uses advanced audio technology developed from nearly 60 years of engineering expertise to deliver focused, immersive listening.

  Noise cancellation is adaptive and user-selectable. Eight microphones in total, four per earcup, including one feedback and two feedforward mics on each side, feed the noise-cancelling system, and every one of those mics is also used for talk. Call handling runs through ADI Pure Voice, which Bowers & Wilkins describes as next-generation voice technology for crystal-clear call quality.

  Wireless is Bluetooth 5.3 with aptX Lossless and aptX Adaptive, alongside aptX HD, aptX Classic, AAC and SBC. The connection adjusts dynamically to optimise performance and reliability across music, film and gaming. Signal processing uses a high-performance DSP with a dedicated amplifier and DAC and supports a true 24-bit audio connection.

  The Bowers & Wilkins Music app integrates streaming services, sets the preferred type of noise cancellation, and exposes a new five-band customisable EQ alongside a TrueSound mode that bypasses tonal adjustment.

  The industrial design is all-new and ergonomically tested, with slimmer earcups and a refined headband for a sleeker silhouette and longer comfortable wear. Net weight is 300g without the carry case. The single physical port is a USB-C socket used for both charging and audio; the supplied 1.2m USB-C to 3.5mm stereo jack cable is how an analogue source is connected, so there is no dedicated 3.5mm jack on the headphone itself. Battery is rechargeable lithium-ion, rated at 30 hours of playback with 7 hours from a 15-minute charge. Five finishes are offered.
