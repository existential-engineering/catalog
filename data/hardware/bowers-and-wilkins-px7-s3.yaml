description: High-performance noise-cancelling wireless over-ear headphones with
  advanced audio technology, eight microphones for adaptive noise cancellation,
  and aptX Lossless support.
details: |-
  The Px7 S3 represents a refinement of the Bowers & Wilkins award-winning over-ear headphone line, delivering enhanced audio quality alongside an all-new ergonomic design featuring slimmer earcups and a refined headband for a sleeker silhouette and extended listening comfort.

  Built on nearly 60 years of Bowers & Wilkins engineering expertise, the Px7 S3 uses 2 x 40mm dynamic full-range bio cellulose drivers to deliver focused, immersive listening experiences. A 5-band customizable EQ and TrueSound mode let listeners shape the sound to taste.

  Advanced noise cancellation adapts to your surroundings, using eight precisely positioned microphones (four per earcup) for uninterrupted sound performance no matter where you are. The same microphone array, paired with the ADI Pure Voice algorithm, delivers crystal-clear call quality during conversations.

  Wireless performance is handled by Bluetooth 5.3 with support for aptX Lossless, aptX Adaptive, aptX HD, aptX Classic, AAC, and SBC. aptX Adaptive adjusts dynamically to optimise performance and connection reliability across music, movies, and gaming. For wired listening, true 24-bit audio is supported over USB-C.

  The rechargeable lithium-ion battery delivers up to 30 hours of playback, with a 15-minute quick charge providing 7 hours of listening. A carry case, a 1.2m USB-C to 3.5mm stereo jack cable, and a 1.2m USB-C to USB-C cable are included in the box.
specs: |-
  - Drive units: 2 x 40mm dynamic full-range bio cellulose drivers
  - Weight: 300g (without carry case)
  - Carry case dimensions: 177mm (W) x 60mm (D) x 234mm (H)
  - Bluetooth: 5.3
  - Supported codecs: aptX Lossless, aptX Adaptive, aptX HD, aptX Classic, AAC, SBC
  - Wired audio: True 24-bit audio via USB-C
  - EQ: 5-band customizable EQ + TrueSound mode
  - Microphones: 8 total (4 per earcup: 1 feedback + 2 feedforward, all used for calls)
  - Voice call technology: ADI Pure Voice algorithm
  - Battery life: 30 hours playback; 7 hours from a 15-minute charge
  - Battery type: Rechargeable lithium-ion
  - Ports: USB-C (charging and audio)
  - Included cables: 1.2m USB-C to 3.5mm stereo jack, 1.2m USB-C to USB-C
  - Carry case included
  - Available colors: Canvas White, Anthracite Black, Indigo Blue, Frost Blue, Vintage Maroon
