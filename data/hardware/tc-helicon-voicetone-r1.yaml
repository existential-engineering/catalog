url: https://www.tchelicon.com/en/products/0726-abn
description: "Single-button vocal reverb stompbox with three reverbs voiced for
  voice: Smooth, Club and Hall. A microphone connects directly to the pedal,
  which patches ahead of the PA over XLR."
details: |-
  The VoiceTone R1 places three TC-Helicon reverbs under a single footswitch for live vocal use. Smooth, Club and Hall are each voiced for the voice rather than for synths or guitar amplifiers, so they add a sense of space without smearing the words.

  A microphone connects straight into the pedal, which is patched ahead of the PA, so the amount of vocal reverb is set at the pedalboard rather than requested from the front-of-house engineer. Three large controls stay readable at a distance under stage lighting, and the chassis is built for stage use.

  Operation is by footswitch with true-bypass-style switching, in a footprint small enough to share a pedalboard with a tuner and a delay. Connections are an XLR input and an XLR output, with phantom power for condenser microphones and a DC power input.
specs: |-
  - Three vocal-voiced reverbs: Smooth, Club and Hall
  - Three front-panel control knobs
  - Single-footswitch operation with true-bypass-style switching
  - Phantom power for condenser microphones
  - Pedalboard-sized road chassis
