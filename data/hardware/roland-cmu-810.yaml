description: >-
  The Roland CMU-810 is a rare analog monosynth expander module sharing the same
  sound engine as the MC-202 and SH-101. It requires external CV/Gate control to
  operate and is capable of producing the classic Roland bass and lead sounds
  that have become staples of electronic music.
details: |-
  The CMU-810 is one of Roland's first expander-type modules, designed to provide the same guts and sounds as the MC-202 in a compact, keyboard-less format. Its layout mirrors the MC-202 and SH-101, with a bottom row of sliders and switches controlling the oscillators, a 24dB analog lowpass filter, and an ADSR VCA envelope section. The upper row houses LFO controls and a mixer section.

  External audio can be routed into the unit, though not through the filter, and up to two external sources can be mixed in alongside the internal oscillator. The CMU-810 generates true MC-202/SH-101 bass sounds which have become very popular in electronic music, making it a sought-after alternative for producers looking for that classic Roland analog character.

  Despite its rarity, the CMU-810 has historically been more affordable than its more common siblings like the SH-101 and MC-202. Notable users include Astral Projection. As a CV/Gate-controlled module with no built-in keyboard or sequencer, it is well suited for integration into modular and semi-modular setups.
specs: |-
  - Monophonic
  - Single VCO with simultaneous sawtooth and square/pulse-width waveforms
  - 1 Sub-Oscillator
  - 1 LFO
  - 24dB lowpass filter
  - ADSR envelope with linear or exponential modes
  - CV/Gate and CV-VCA external control
  - 2 external audio inputs for mixing
  - No built-in keyboard or memory
releaseDate: "1984"
