  that cuts through the mix when gain is added.
details: |-
  Friedman Classic pickups were designed to produce that well known vintage single coil chime with the ability to cut through the mix when gain is added. The Classic single coil pickups feature Alnico 3 magnets, which help achieve that vintage sound while maintaining a pronounced mid-range presence. The Friedman Classic pickups are a great option for any single coil guitar player looking for an inspired vintage modern tone.

  When Dave Friedman and Grover Jackson were designing the Friedman line of guitars, a lot of thought was put into every aspect of the build, especially the pickups. Inspired by both modern and vintage guitar tones, Dave wanted to make sure that the pickups used in all Friedman guitars delivered the exact tone he envisioned. With Dave's vision and Grover's unsurpassed skills, the Friedman Classic Pickup line was born.

  The Classic single coil is wax potted, custom voiced by Dave Friedman and hand built in the USA by Grover Jackson. Bridge, middle and neck positions are sold separately, each wound for its own place in the guitar, and covers are available in black or white.
specs: |-
  - DC resistance: 7.5k bridge, 7.3k RWRP middle, 7.2k neck
  - Alnico 3 magnets
  - 80/20 wax potted
  - Custom voiced by Dave Friedman
  - Made in the USA by Grover Jackson
  - Cover colour options: black, white
