description: An 8-track Eurorack trigger sequencer that records and plays back
  trigger patterns across eight individual outputs, with adjustable sequence
  length and record/jam/clear modes.
details: |-
  Features
specs: |-
  - Trigger Input Jack
  - Sequence Reset Input Jack
  - Eight (yes eight!) individual trigger output jacks
  - Mode Selector Switch: Record/Jam/Clear
  - Sequence Length Switch: 16/32/64 (yes, more than just 16 steps!)
  - Beautiful, satisfying, tantalizing Cherry MX Blue Mechanical Keyswitch Button Clicky Square
  - Super Satisfying Tactile 8-Position Output Selector Knob
  - Recorded sequences are quantized to the incoming triggers , one trigger input equates to the sequence advancing by one step
  - Premium
  - The button is white but you can swap it if you really want
  - Tasteful lines and circles
  - Electronics behind the panel
  - Fun to play!
  - I make more interesting music with it than I would otherwise because I feel like it brings me closer to playing an actual instrument, it's really cool
