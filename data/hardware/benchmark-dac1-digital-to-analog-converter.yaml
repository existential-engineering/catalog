description: The DAC1 is a reference-quality, 2-channel 192-kHz 24-bit audio
  digital-to-analog converter featuring Benchmark's proprietary UltraLock™
  clock-recovery system for jitter-immune conversion and an integrated HPA2™
  headphone amplifier.
details: |-
  The Benchmark DAC1 is a reference-quality, 2-channel 192-kHz 24-bit digital-to-analog converter designed for studio mastering rooms and critical listening environments. It features the proprietary UltraLock™ clock-recovery system, which completely isolates the conversion clock from the incoming digital signal's clock, rendering it immune to jitter-induced artifacts regardless of the source.

  The integrated HPA2™ headphone amplifier is a high-current design capable of driving two headphones simultaneously via dual front-panel 1/4" jacks, delivering less than 0.0003% THD+N under full load.

  Analog outputs include balanced XLR connectors equipped with exclusive low-impedance passive output attenuators, adjustable in 10 dB steps, and unbalanced RCA outputs. Output levels can be set to Variable mode or Calibrated mode via rear-panel switch.

  The DAC1 is housed in a half-width 1 RU chassis, allowing two units to be rack-mounted side-by-side. It has been discontinued and replaced by the DAC2 Series.
specs: |-
  - 2-channel, 24-bit, 192 kHz digital-to-analog conversion
  - UltraLock™ clock-recovery system — jitter-immune conversion clock
  - HPA2™ headphone amplifier: THD+N less than 0.0003% under full load
  - Dual front-panel 1/4" headphone jacks with simultaneous dual-headphone support
  - Balanced XLR analog outputs with low-impedance passive attenuators in 10 dB steps
  - Unbalanced RCA analog outputs
  - Variable or Calibrated output level selection via rear-panel switch
  - Half-width 1 RU chassis (two units mountable side-by-side)
  - International power supply supporting all voltages
  - AES/EBU digital input
