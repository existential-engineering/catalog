description: "An all-tube bass amplifier head that combines circuits from the
  original 1969 Blue Line SVT and mid-1970s Magnavox-era designs — the SVT for
  the 21st century, with modern enhancements and vintage aesthetics."
details: |-
  The Heritage 50th Anniversary SVT (HSVT-50th) is an all-tube bass amplifier head developed in response to feedback from longtime SVT enthusiasts. It blends circuits from the original 1969 Blue Line SVT with the mid-1970s Magnavox-era design across two preamp channels that can be jumpered for a combined sound.

  Channel One reproduces the 1969 Blue Line preamp circuit, while Channel Two captures the mid-70s Magnavox-era voicing. Both channels feed a tube power stage built around six Ampeg Super Valve 6550 power tubes delivering 300W RMS minimum continuous output into 2 ohms or 4 ohms.

  Modern updates over the vintage originals include a balanced XLR DI output, user biasing, Neutrik speakOn speaker outputs, spring-loaded side handles, and a whisper-quiet fan intended to extend tube life. The chassis carries period-correct blue line graphics and etched text.

  The amp is handmade in the U.S.A. from premium components and was awarded 2019 Best of Show and a 2021 TEC NAMM Award. Ampeg recommends pairing it with the Heritage HSVT-810AV cabinet.
specs: |-
  - Output power: 300W RMS minimum continuous @ <5% THD into 2 ohms or 4 ohms
  - Preamp tubes: 5 x 12AX7
  - Driver tubes: 1 x 12AX7, 2 x 12AU7
  - Power amp tubes: 6 x 6550 (Ampeg Super Valve)
  - Signal-to-noise ratio: 75 dB (20 Hz – 20 kHz)
  - Maximum gain: 78 dB @ 1 kHz; -3 dB @ 20 Hz & 15 kHz
  - Bass: ±12 dB @ 40 Hz
  - Midrange: ±10/-20 dB @ 220 Hz, 450 Hz, 800 Hz, 1.6 kHz, or 3 kHz
  - Treble: +15/-20 dB @ 4 kHz
  - Ultra Lo: +2 dB @ 40 Hz, -10 dB @ 500 Hz
  - Ultra Hi: +9 dB @ 8 kHz
  - Dual preamp channels (1969 Blue Line + mid-70s Magnavox), jumpable
  - Balanced XLR DI output
  - User biasing
  - Neutrik speakOn speaker outputs
  - Spring-loaded side handles
  - Whisper-quiet fan
  - Handmade in the U.S.A.
