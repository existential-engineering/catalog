details: |-
  Made in California, USA. The transformer is MANLEY IRON® and the design is inspired by the Sony C-37A.
specs: |-
  - Frequency Response: 10 Hz – 30 kHz
  - Max SPL: 150 dB
  - Noise: Typically -108 dBV (A-Weighted)
  - Distortion: <0.05% THD+N
  - Tube: 5670
  - Output Impedance: 30 Ohms
  - Sensitivity: 7 mV/Pa
  - Capsule: 5-micron gold-sputtered, 1" diameter (Josephson, C-37A-inspired)
  - Polar Patterns: Cardioid and Omnidirectional (mechanically switchable)
  - High Pass Filter: -3 dB @ 55 Hz, 6 dB/octave
  - Weight: 1.5 lbs (microphone); 2.35 lbs (PSU)
  - Power Consumption: 8 Watts
  - PSU Input: 90V-250VAC, 50Hz-60Hz
  - Output: Balanced XLR (Pin 2 Hot, Pin 3 Low)
