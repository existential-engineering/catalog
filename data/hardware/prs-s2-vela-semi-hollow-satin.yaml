details: |-
  The S2 Vela Semi-Hollow Satin is a vintage-inspired, offset guitar with loads of personality and tonal textures. The all-mahogany body brings warmth and an organic tone, while the semi-hollow construction and thin, satin nitro finish give the Vela resonance and bloom.

  The pickguard-loaded electronics feature a PRS DS-01 pickup in the treble pickup position, providing a bright, punky tone, while the PRS Narrowfield in the bass pickup position gives the Vela some noteworthy bite. The coil-tap on the tone control allows the treble pickup to split to single coils, providing even more tonal versatility.

  Anchoring this guitar is the PRS plate-style bridge with two saddles that were designed to compensate for intonation. This bridge harkens back to Paul’s early designs and traditional bass plate-style bridges but is top-loading for easy restringing. Like the bridge found on Paul’s Guitar and some Private Stock models, PRS’s plate-style bridge features brass saddles and a steel plate for maximum tonal sustain.
