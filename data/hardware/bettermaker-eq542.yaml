description: A 500-series stereo analog double parametric equalizer with
  high-pass and low-pass filters and full digital recall, offering 399 preset
  storage cells and USB connectivity for plugin control and automation.
details: |-
  The Bettermaker EQ542 is a 500-series stereo analog double parametric equalizer with high-pass and low-pass filters and digital recall functionality. It features a stereo parametric section with two parametric filters that can operate in combined/matched stereo or dual mono modes.

  The unit includes a 24 dB/octave high-pass filter and a 12 dB/oct low-pass filter with selectable frequencies, providing flexible tone-shaping options. It offers 399 preset storage cells for saving and recalling settings.

  USB connectivity allows plugin-style control with automation support. A free companion plugin controller is available for macOS and Windows in AU, VST, and RTAS formats (32 and 64-bit), enabling DAW integration and parameter automation. AAX support is listed as coming soon.

  The EQ542 uses steel screen isolators for digital/analog separation to ensure clean signal integrity. It is also available without a front panel as the EQ542 REMOTE variant for remote-controlled rack setups.

  The EQ542 is covered by U.S. Patent No. 10,693,428 B2 and is listed as a Legacy product on the Bettermaker website.
specs: |-
  - Frequency response: -0.5 dB @ 10 Hz, -3 dB @ 100 kHz
  - THD: 0.008% (1 kHz @ +12dBu)
  - Channels: 2
  - Weight: 0.5 kg
  - Input impedance: 20k Ohm balanced
  - Output impedance: 200 Ohm balanced
  - Max input/output: +24dBu balanced or +18dBu unbalanced
  - Clip detector
  - Preset capacity: 399
  - High-pass filter: 24 dB/octave
  - Low-pass filter: 12 dB/octave
  - Operation modes: Stereo or dual mono
  - USB connectivity for plugin control and automation
  - Companion plugin controller: AU, VST, RTAS (32 & 64-bit, macOS and Windows, AAX listed as coming soon)
  - Steel screen isolators for digital/analog separation
  - 500-series form factor
  - U.S. Patent No. 10,693,428 B2
