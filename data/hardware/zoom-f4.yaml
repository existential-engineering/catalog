description: The Zoom F4 propels your film's sound to a whole new level. With
  6-input/8-track recording, super-low-noise mic preamps, and time code with
  pinpoint accuracy, the F4 offers Hollywood sound at an indie budget.
details: |-
  With four XLR/TRS combo inputs, a 3.5mm stereo input, and a Zoom mic capsule input, the F4 can record up to six discrete tracks with an additional stereo mix track, all at resolutions up to 24-bit/192 kHz. The F4 is equipped with high-quality mic preamps whose audio specs include an extremely low noise floor (-127 dBu EIN) and high gain (up to 75 dB), with +4 dB line-level inputs.

  For precise audio/video syncing, the F4 utilizes a Temperature Compensated Crystal Oscillator (TCXO) that generates time code at 0.2 ppm accuracy, even when powered off. The F4 supports all standard drop frame and non-drop formats, and can jam sync to time code provided by external devices. Standard BNC connectors enable easy integration into any rig.

  Advanced Look-Ahead Hybrid Limiters add a 1 millisecond delay that enables the limiters to look ahead, anticipating clipping before it is recorded. Limiting can be applied to each of the 6 channels simultaneously at full resolution, with 10 dB of headroom and controls for setting threshold, attack, and release.

  An onboard mixer allows for flexible signal routing from all inputs to all outputs (pre- or post-fader) with user-adjustable level, pan, and input/output delay. The F4 also includes built-in high-pass filtering to reduce the sound of wind and other noise, plus phase inversion and Mid-Side decoding. Zoom AutoMix automatically adjusts the levels of a mix to help reduce ambient sound.

  A dual SD card recording feature lets you record simultaneously on two SD/SDHC/SDXC cards of up to 512 GB each, so recordings can be backed up or split: eight tracks on one card and a stereo mix on the other. A compact metal chassis makes the F4 both rugged and durable, and keeps its weight down to just 2.27 pounds without batteries.
specs: |-
  - 6-input/8-track multitrack field recorder
  - Records BWF-compatible WAV at 16-bit or 24-bit, any standard sample rate up to 192 kHz
  - MP3 recording at 128, 192 or 320 kbps, 44.1/48 kHz, ID3v1 tags
  - Mic input gain +10 to +75 dB, line input gain -10 to +55 dB
  - Equivalent input noise: -127 dBu or less (A-weighted, +75 dB input gain, 150 ohm input)
  - Phantom power: +24V/+48V, 10 mA maximum per channel
  - Maximum input level: +14 dBu mic, +24 dBu line (at 0 dBFS, limiter on)
  - Frequency response: 10 Hz to 80 kHz +0.5 dB/-1.5 dB at 192 kHz
  - A/D dynamic range 120 dB typical, D/A dynamic range 106 dB typical
  - Crosstalk: -90 dB or less between adjacent channels at 1 kHz
  - Time code precision 0.2 ppm, frame rates 23.976ND, 24ND, 25ND, 29.97ND, 29.97D, 30ND, 30D
  - Time code BNC input 0.2 to 5.0 Vpp, output 3.0 Vpp
  - Dual SD card slots: SD 16 MB to 2 GB, SDHC 4 to 32 GB, SDXC 64 to 512 GB
  - USB 2.0 High Speed audio interface: 44.1/48/96 kHz, 16/24-bit, 6-in/4-out
  - Stereo mix audio interface mode: 44.1/48 kHz, 16-bit, 2-in/2-out, iPad operation supported
  - Headphone output: 100 mW + 100 mW into a 32 ohm load
  - Display: 1.9 inch monochrome LCD with white backlight
  - Power: 8 AA batteries, Zoom AD-19 DC 12V 2A adapter via DC-HIROSE cable, or external DC 9 to 16 V on a HIROSE HR10A-7R-4S 4-pin connector
  - Battery life for 2-channel recording: 9.5 hours or more alkaline, 11.5 hours NiMH (2450 mAh), 17.5 hours lithium
  - Dimensions: 177.8 mm (W) x 141.1 mm (D) x 54.3 mm (H)
  - Weight: 1030 g (2.27 pounds), main unit only
