description: 2-channel Auteur mic/line/DI preamp with 2 Cinemag transformers
details: The Auteur mkIII is a 2-channel solid state microphone preamplifier
  featuring 2 Cinemag transformers. Born from years of preamplifier modification
  expertise, the Auteur mkIII delivers a fast, transparent modern front-end
  combined with a vintage-inspired output stage for a colorful, full-bodied
  Chicago-style sound. Both channels accept mic, line, and instrument (Hi-Z)
  signals via XLR inputs with a Hi-Z switch for direct instrument capture of
  guitar and bass. Features include 48V phantom power and -10dB pads per
  channel, with outputs on 1/4" TRS connectors. Ships in a half-rack chassis
  with removable rack ears for 1U rack mounting.
specs: |-
  - Preamp Type: Solid State
  - Number of Channels: 2
  - Transformers: 2 x Cinemag
  - Phantom Power: Yes (48V, switchable per channel)
  - Pads: -10dB
  - Analog Inputs: 2 x XLR (mic/line/Hi-Z)
  - Analog Outputs: 2 x 1/4" TRS
  - Frequency Response: 10Hz-30kHz
  - Form factor: Half-rack (1U with rack ears)
  - Power Source: 24V AC, 500mA power supply
  - Dimensions: 10" W x 4" H x 9" D
  - Weight: 3.1 lbs.
