description: Inside the Kingmaker Fuzz's compact enclosure live the sizzling
  tones of over 50 years of fuzz and overdrive technology.
details: |-
  The Kingmaker Fuzz packs over 50 years of fuzz and overdrive technology into a compact enclosure. It features three distinct fuzz engines selectable via center toggle: HEAVY (Big Muff-based), NORMAL (Fuzz Face-based), and OCTAVE (Octavia-based).

  It includes dual overdrive engines that can stack in series, run in parallel, or split signals to stereo outputs, giving a wide range of gain textures from vintage fuzz to modern overdrive.

  The pedal supports advanced signal routing including effects send and multi-signal mixing capabilities, plus an external effects loop.

  Kingmaker stores 6 effect presets (two banks of three) and offers Universal Bypass via high-quality signal relays (true bypass) or transparent buffers, with MIDI capability over USB.
specs: |-
  - Three fuzz engines: HEAVY (Big Muff), NORMAL (Fuzz Face), OCTAVE (Octavia)
  - Dual overdrive engines (series, parallel, or split to stereo)
  - Advanced signal routing: effects send, multi-signal mixing
  - External effects loop
  - Stereo I/O
  - Stores 6 presets (two banks of three)
  - Universal Bypass (true bypass relays or transparent buffers)
  - MIDI capability via USB
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
