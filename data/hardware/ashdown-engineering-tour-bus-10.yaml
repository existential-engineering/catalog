details: |-
  The Tour Bus 10 is Ashdown's smallest combo amp, packing essential features into a super-compact box with a 10-watt power amp and 6.5" speaker that delivers a surprisingly compelling volume for its size. Controls are kept simple with a volume and 2-band bass and treble EQ. A headphone socket allows for silent practice and a CD/MP3 input lets you play along with your favourite tracks. It is finished in heavy-duty buffalo Tolex with a distinctive vintage red grille.
specs: |-
  - Power output: 10 Watts
  - Speaker: 1 x 6.5"
  - EQ: 2-band (Bass, Treble)
  - Controls: Volume, Bass, Treble
  - Headphone output for silent practice
  - CD/MP3 input
  - Covering: heavy-duty buffalo Tolex, vintage red grille
