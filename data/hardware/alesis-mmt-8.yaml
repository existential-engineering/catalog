description: >-
  The Alesis MMT-8 is a pattern and song-based MIDI sequencer with 8 separate tracks, each
  capable of carrying 16 channels of MIDI information for a total of 128 tracks.
details: |-
  The Alesis MMT-8 is a standard MIDI sequencer that remains in use by professional electronic musicians due to its reliability and straightforward design. It features pattern and song-based sequencing across 8 tracks, with each track supporting 16 channels of MIDI data, effectively providing 128 tracks of sequencing capability.

  Tracks can be muted during playback, offering significant performance control for live situations and enabling musicians to create dynamic breakdowns and builds within their compositions. Patterns can be switched on the fly, making it ideal for live performance applications.

  With external click inputs and MIDI integration, the MMT-8 can synchronize with older drum machines and sequencing systems. While computer-based sequencing has become faster and more flexible for studio work, the MMT-8 remains a preferred tool for DJs and live electronic musicians seeking tactile control and reliable performance.
specs: |-
  - Eight tracks
  - 100 patterns
  - 100 songs
  - External cassette or MIDI SysEx memory
  - 16 multitimbral parts per track
  - MIDI and tape sync input control
  - Produced 1987-1988
