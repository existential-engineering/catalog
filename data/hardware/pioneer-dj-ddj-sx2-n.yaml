description: "The 4-channel DDJ-SX2 controller builds on the success of its
  predecessor but inherits two must-have features from the top-flight DDJ-SZ :
  Performance Pads with multi-coloured cue point LEDs and an on-jog cue
  countdown. Plus it’s Serato DJ DVS upgrade-ready and boasts improved jog wheel
  latency, making it the scratch DJ’s ultimate companion. The DDJ-SX2 gives you
  native manipulation of Serato Flip; a Serato DJ Expansion Pack that gives you
  the power to record and re-play hot cue sequences on the fly. A strictly
  limited run of 1000 DDJ-SX2-N controllers will be produced, each with a
  distinctive plaque featuring a unique serial number."
details: |-
  4-channel controller for Serato DJ Pro and dedicated buttons for Serato Flip. The 4-channel DDJ-SX2 controller builds on the success of its predecessor but inherits two must-have features from the top-flight DDJ-SZ : Performance Pads with multi-coloured cue point LEDs and an on-jog cue countdown. Plus it’s Serato DJ DVS upgrade-ready and boasts improved jog wheel latency, making it the scratch DJ’s ultimate companion. The DDJ-SX2 gives you native manipulation of Serato Flip; a Serato DJ Expansion Pack that gives you the power to record and re-play hot cue sequences on the fly. A strictly limited run of 1000 DDJ-SX2-N controllers will be produced, each with a distinctive plaque featuring a unique serial number.
