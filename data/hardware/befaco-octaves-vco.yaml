description: The Befaco Octaves VCO is a 12HP lo-fi additive oscillator that
  stacks six doubled-frequency square wave bands — F, 2F, 4F, 8F, 16F, and 32F —
  each with shared PWM control and individual Level CV. Outputs cascade between
  bands so the sum accumulates toward a final mix, or the chain can be broken to
  access independent submix outputs per frequency band.
details: |-
  The Octaves VCO is a unique additive oscillator concept from Befaco that builds its sound by stacking six octave-related square wave voices derived from a single core oscillator. The fundamental frequency (F) is generated by a core square wave oscillator, and each subsequent band doubles the frequency: 2F, 4F, 8F, 16F, and 32F — covering six octaves of harmonic content from a single V/OCT input.

  The core oscillator section features a V/OCT input for 1V/octave pitch tracking, a SYNC input for hard sync, a TUNE knob for pitch adjustment, a RANGE control, and an OCT selector for octave transposition. A global PWM control with its own CV input shapes the pulse width of all six oscillator bands simultaneously.

  Each of the six frequency bands has its own VCA with a LEVEL CV input, allowing individual volume modulation per harmonic band. This enables complex timbral shaping and dynamic amplitude control across the frequency stack. The cascaded summing architecture means each band's output feeds into the next, so tapping an output retrieves the sum of all bands up to that point.

  In 'full mix' mode only the final (32F) output is used to get all six frequency bands summed. In 'split' mode the cascade chain is broken to access multiple independent submix outputs, each carrying a different combination of frequency bands. This makes the module capable of producing rich additive textures, drone sounds, chiptune-style tones, and complex lo-fi harmonic stacks.

  Built in Barcelona with a heat-treated aluminum panel, the Octaves VCO is available both as a fully assembled module and as a DIY kit.
