description: Classic Passive Studio Monitor — a recreation of the iconic 'white
  cone' monitors developed in collaboration with platinum engineer Chris
  Lord-Alge, featuring the unforgiving mid-forward frequency response designed
  for professional mixing reference.
details: |-
  The CLA-10 Passive is a faithful recreation of the iconic 'white cone' studio
  monitors that have been a reference standard in professional studios for over
  45 years. Developed in collaboration with platinum mix engineer Chris
  Lord-Alge, these monitors deliver the unforgiving mid-forward frequency
  response that made the originals legendary for checking how a mix translates
  across any playback system.

  Avantone Pro engineered near-identical reproductions of both the LF and HF
  drivers as well as the classic crossover, staying true to the original
  specifications while meeting modern environmental standards. The AV10-MHF
  tweeter dome underwent rigorous engineering to arrive at the exact phenolic
  resin doping required to replicate the original's performance curve, while
  the AV10-MLF woofer features custom-tooled mechanical parts that faithfully
  mirror its predecessor.

  The cabinet is a sealed design using hybrid medium-density fiberboard with
  real wood veneer, matched to the original MDF and wood veneer. Extensive
  attention was paid to matching the original winding dimensions, values, and
  DC resistance of the inductors, and the most popular amplifier pairings of
  the original were profiled during development.

  A TPC (Tissue Paper Control) switch on the rear panel applies a 2 dB cut to
  the high-frequency driver, simulating the classic studio trick of covering
  the tweeter with a sheet of tissue paper to tame the high end during mixing
  sessions.

  As a passive monitor, the CLA-10 Passive requires an external power amplifier
  — Avantone Pro offers the CLA-100, CLA-200, and CLA-400 reference amplifiers
  specifically voiced to complement these speakers.
specs: |-
  - System Type: Passive, full-range two-way stereo pair
  - Frequency Response: 60 Hz–20,000 Hz
  - Power Capacity: Program – 60 W, Maximum – 120 W
  - Sensitivity: 90 dB SPL (1 W, 1 m on axis)
  - Nominal Impedance: 8 Ω
  - LF Driver: AV10-MLF 18 cm cone
  - HF Driver: AV10-MHF 3.5 cm soft dome
  - Cabinet: Sealed, hybrid MDF with real wood veneer
  - Cabinet Dimensions: 381.5 mm × 215 mm × 197.5 mm (15" × 8½" × 7¾")
  - Weight: 6.3 kg / 13.9 lbs (each)
  - TPC (Tissue Paper Control) Switch: 2 dB cut to HF driver
  - Input: Binding posts (bare wire AWG 18+, spade, banana plug)
