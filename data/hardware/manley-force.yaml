name: FORCE 4-Channel Tube Microphone Preamplifier
manufacturer: manley
primaryCategory: preamp
categories:
  - analog
  - rack-mount
  - outboard
url: https://www.manley.com/products/pro-audio/mic-preamps/force
prices:
  - amount: 2999
    currency: USD
description: Professional 4-channel vacuum tube mic preamp with high-voltage
  Class A topology and MANLEY IRON® transformers. Engineered for exceptional
  clarity.
details: |-
  The Manley FORCE delivers four channels of all-tube microphone gain, with a preamp topology derived from the award-winning Manley CORE channel strip. Each channel features a 12AX7WA dual triode and a custom hand-wound MANLEY IRON® input transformer, paired with a high-current WFDRIVE balanced output stage for low-impedance drive into long cable runs and downstream converters.

  Every channel offers selectable 40 dB or 50 dB of mic gain (with 60 dB available via internal jumper), a front-panel 1/4" Hi-Z instrument input for DI use, and high-voltage Class A operation throughout. The 2U chassis is hand-built in California.
specs: |-
  - 4 channels of all-tube microphone gain
  - High-voltage Class A topology
  - Custom hand-wound MANLEY IRON® input transformer per channel
  - Tubes: 4 × 12AX7WA dual triodes
  - Mic Gain: 40 dB or 50 dB (60 dB available via internal jumper)
  - Mic Input Impedance: 1250 Ω
  - Direct (Hi-Z) Input Impedance: 10 MΩ
  - Frequency Response: 20 Hz – 20 kHz, ±0.3 dB
  - Dynamic Range: 118 dB (low gain); 100 dB (high gain)
  - THD & Noise @ 1 kHz: 0.004% (low gain); 0.04% (high gain)
  - EIN: -129 dB (22 Hz–22 kHz, 150 Ω source)
  - Maximum Output: +35 dBu (100 kΩ load); +22 dBm (600 Ω load)
  - Output Headroom: 31 dB (ref. +4 dBu)
  - Hi-current WFDRIVE balanced outputs (50 Ω output impedance)
  - Dimensions: 19" × 3.5" × 7" (2U rack space)
  - Unit Weight: 8.6 lbs
  - Shipping Weight: 11.8 lbs
  - Power Consumption: 36 watts
  - Operating Voltage: 90 to 254 VAC, 50–60 Hz
  - Hand-built in California
