description: 4-channel Traktor controller with a built-in four-channel DJ mixer,
  12-knob FX Kommand Console, touch-sensitive platters with Strip Search, and a
  24-bit audio interface.
details: |-
  4TRAK is a four-deck controller for Native Instruments Traktor DJ software, pairing tactile control with a fully independent four-channel mixer that can be used with or without a computer. RCA inputs sit on each channel alongside four line-level inputs, two of which are switchable to phono and two switchable to mic, allowing turntables, CD players, microphones, and other sources to be mixed alongside software decks.

  The FX Kommand Console provides top-level access to effect and filter parameters across two FX decks (FX1 and FX2), each with three assignable effect controls and time-division controls for syncing effects to track BPM. Four detented filter knobs are dedicated to 4TRAK's four channels, allowing effects and filters to be layered and combined.

  Each platter offers 3600 ticks of resolution per rotation with automatically adjusting sensitivity and 14-bit MIDI for tight response. Bi-colored LEDs around each platter indicate deck assignment and playback status. Numark's Strip Search touch strip provides virtual-needle-drop track navigation with an illuminated LED position indicator. The chassis is solid metal and includes a built-in 24-bit audio interface with balanced XLR outputs.
specs: |-
  - Four decks of software control for Traktor
  - 12-knob FX Kommand Console for effects and filters
  - Built-in four-channel DJ mixer (usable with or without a computer)
  - Four line inputs, two turntable (phono) inputs, two microphone inputs
  - Touch-sensitive illuminated platters with 3600 ticks of resolution per rotation
  - Built-in 24-bit audio interface with balanced XLR outputs
  - Sample rate: 44.1 kHz; Bit depth: 24-bit
  - Strip Search touch strip with illuminated track-position indicator
  - Ultra-precise, low-latency high-speed 14-bit MIDI
  - Solid metal construction
  - Mouseless library navigation with view options
  - Balanced XLR outputs SNR > 99 dB (A-weighted); THD+N < 0.005%
  - Frequency response: 25 Hz - 20 kHz (+/- 2.5 dB)
  - Weight: 15.8 lbs. (7.17 kg)
  - Dimensions (W x D x H): 23.8" x 15" x 3.5" (605 mm x 381 mm x 89 mm)
