description: The 290 S distills the popular 290 model to its essence, featuring
  a single Lollar High-Wind Dogear P90 pickup in the bridge position. With one
  volume and one tone control, it offers a huge array of tones from rich and
  harmonically complex cleans to gritty and saturated rock. The single-cutaway
  solid mahogany body pairs with a C-shape mahogany neck and rosewood
  fingerboard for a classic, focused feel.
details: |-
  The Collings 290 S is a single-pickup offset solid body electric guitar built around a solid Honduran mahogany body and neck. It features a single Lollar P90 Overwound pickup at the bridge, wired with 50s-style wiring through CTS 500K potentiometers and Jupiter Vintage Yellow capacitors. The rosewood fingerboard has a 12" radius, medium 18% nickel-silver frets, ivoroid long dot inlays, and a 1 11/16" nut width. Hardware includes a Kluson ABR-1 bridge, Kluson stop tailpiece, and Gotoh tuners with Collings logo buttons. The peghead features an ebony veneer with mother-of-pearl logo inlay. The guitar ships with D'Addario NYXL1046 strings and a deluxe hardshell case. Custom options are available including alternate finishes, Bigsby vibrato, alternate pickups, and gold hardware.
specs: |-
  - Body: Solid Honduran mahogany
  - Neck: Honduran mahogany, C-shape profile
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: Ivoroid long dots (5mm non-tapered)
  - Pickup: Single Lollar P90 Overwound (bridge)
  - Controls: 1 volume, 1 tone (CTS 500K)
  - Capacitor: Jupiter Vintage Yellow
  - Wiring: 50s-style
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson stop tailpiece (nickel-plated zinc, steel studs)
  - Tuners: Nickel Gotoh with Collings logo
  - Peghead Veneer: Ebony with MOP logo
  - Pickguard: Black/Cream/Black
  - Finish: High gloss nitrocellulose lacquer
  - Body Width: 13 1/2"
  - Body Length: 17"
  - Body Depth: 1 5/8"
  - Total Length: 38 1/2"
  - Strings: D'Addario NYXL1046 (.010"-.046")
  - Case: Deluxe hardshell included
