description: A limited edition pedal combining versatile echo and reverb effects
  into a liquid, psychedelic ambient sound.
details: |-
  STAY TUNED FOR MORE LIMITED EDITION PEDALS! IN COLLABORATION WITH LEVITATION FESTIVAL . . . The PHOSPHENE SCREAM is a super psychedelic time trip machine for traveling through the 5th dimension. It combines an extremely versatile echo and a vast universe of reverb effects in a unique way to create a liquid space chamber of pure ecstasy. You feel reverberations. You feel echos. You lose your mind. CONTROLS Reverb: Fully counter-clockwise, the reverb is blended out. While turning up the knob it ranges from realistic hails to full on infinity caves. Feedback: Controls the number of repeats and intensity of the echo. Turn all the way up for almost endless repeats. Turn down for no echo at all. D-Time: Changes the time in between the repeats of the echo. Turn all the way down for metallic filter sounds. Space Toggle Switch: Left is deep thunderous bass. The middle position is full range. The right position is high frequency scream. NOTE: A small trimmer located on the inside of the pedal adjusts the output volume of the entire effect. SPECS Dimensions: 4.88" x 3.68" x 2.15" (including hardware) Weight: 13 oz. Power: 9V (runs on a standard 2.1 mm negative center 9V adapter or included 9V battery). Current Draw: 80 mA.
