description: Six-button external footswitch for TC-Helicon vocal processors with
  a TRS expansion jack, connected over a single TRS cable. Its six switches
  carry LED indicators and cover presets, harmony toggles, looper functions and
  effect parameters.
details: |-
  The Switch-6 is a six-button external footswitch built to expand the hands-free control of any TC-Helicon vocal processor with a TRS expansion jack. Six independent switches with LED indicators give direct, no-scroll access to frequently used presets, harmony toggles, looper functions and effect parameters.

  A heavy-duty metal housing, silent switches and a single TRS cable run to the host pedal suit it to players who have outgrown a single footswitch.
specs: |-
  - Six independent footswitches with LED indicators
  - Connects to a TC-Helicon vocal processor's TRS expansion jack over a single cable
  - Direct access to presets, harmony toggles, looper functions and effect parameters
  - Heavy-duty metal housing
  - Silent switches
  - Passive footswitch, no power supply required
