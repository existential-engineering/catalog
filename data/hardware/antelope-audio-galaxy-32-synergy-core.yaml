name: Galaxy 32 Synergy Core
manufacturer: antelope-audio
primaryCategory: audio-interface
categories:
  - rack-mount
  - monitor
  - digital
url: "https://en.antelopeaudio.com/products/galaxy-32-synergy-core/"
prices:
  - amount: 5995
    currency: EUR
description: "Galaxy 32 Synergy Core packs 32ch of analog I/O, Dante, HDX,
  Real-Time FX processing and Dolby Atmos-ready monitoring and speaker
  calibration in 1U."
details: |-
  Galaxy 32 Synergy Core expands the legacy of the Orion 32 series with Dante, HDX, Thunderbolt 3 connectivity and onboard Synergy Core real-time effects processing in a single 1U chassis aimed at professional recording studios and high-profile production and broadcasting facilities.

  Mastering-grade 64-bit Acoustically Focused Clocking (AFC) inherited from Antelope's high-end master clocks such as the Isochrone Trinity, with optional 10M atomic clock input for further jitter reduction.

  Virtual patch-bay with drag-and-drop routing in the Antelope Launcher control panel. All digital ports (Thunderbolt, Dante, HDX, MADI, ADAT, S/PDIF) can be used simultaneously, with up to 64 I/O channels at 192 kHz over Thunderbolt and HDX thanks to a unique FPGA configuration.

  Four onboard low-latency stereo mixers and direct monitoring path with imperceptible latency. Atmos-ready surround and immersive monitoring system compatible with over 23 audio formats from stereo to Dolby Atmos 9.1.6.

  Synergy Core processing supplies 32 virtual racks with up to 8 effects each (128 effects instances maximum) drawn from categories including Special Processing, Equalizers, Pedals/Delay/Modulation, Preamps & Channel Strips and Dynamics Processors. Expandable effects library available through the Antelope Software Store.

  Standalone operation via proprietary client/server system with customizable presets stored on the device.

  Compatible with the Antelope MRC physical hardware controller as an extension of the monitoring and routing system.
