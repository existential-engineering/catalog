description: >-
  The JBL 305P MkII is a powered 5" two-way studio monitor featuring JBL's
  patented Image Control Waveguide and next-generation transducers, delivering
  precise imaging, a wide sweet spot, and impressive dynamic range for project
  studio use.
details: |-
  The JBL 305P MkII is a compact powered two-way studio monitor built around JBL's patented Image Control Waveguide technology, originally developed for the flagship JBL M2 Master Reference Monitor. This waveguide ensures consistent, wide stereo imaging and a broad sweet spot across the listening environment.

  Driven by dual Class-D amplifiers totaling 82 watts (41W HF + 41W LF), the 305P MkII features a 5-inch (126mm) woofer and a 1-inch (25mm) woven-composite dome tweeter with a 4th-order acoustic Linkwitz-Riley crossover at 1725Hz. The next-generation JBL transducers are optimized for improved transient response and detail retrieval.

  The patented Slip Stream low-frequency port design minimizes port noise and turbulence, extending low-frequency response down to 43Hz (-10dB). The ported 15mm MDF enclosure measures 298×185×231mm and weighs 4.73kg, making it well-suited for desktop and small studio environments.

  Rear-panel controls include a Boundary EQ switch to compensate for room acoustics when the monitor is placed near walls or in corners, and an HF Trim switch offering -2dB, 0dB, or +2dB adjustments for high-frequency balance. Input sensitivity is switchable between +4dBu and -10dBV to accommodate professional and consumer-level sources.

  Each unit undergoes a 100-hour full-power reliability test before leaving the factory. The 305P MkII achieves a maximum continuous SPL of 94dB and a peak SPL of 108dB, with a frequency response of 49Hz–20kHz (±3dB) and a wide 120°×90° coverage angle.
specs: |-
  - Woofer: 5" (126mm)
  - Tweeter: 1" (25mm) woven-composite dome
  - Crossover frequency: 1725Hz, 4th-order acoustic Linkwitz-Riley
  - Power: 41W HF + 41W LF, Class-D (82W total)
  - Frequency response: 49Hz–20kHz (±3dB)
  - Frequency range: 43Hz–24kHz (-10dB)
  - Max continuous SPL: 94dB
  - Max peak SPL: 108dB
  - Signal-to-noise ratio: 75dBA (A-weighted)
  - Coverage angle: 120° × 90°
  - Enclosure: Ported, 15mm MDF
  - Dimensions (H×W×D): 298×185×231mm (11.75"×7.3"×9.9")
  - Weight: 4.73kg (10.43 lbs)
  - AC input: 100–240VAC (±10%), 50/60Hz
  - Patented Image Control Waveguide
  - Patented Slip Stream low-frequency port
  - Boundary EQ switch for room compensation
  - HF Trim switch: -2dB / 0dB / +2dB
  - Input sensitivity switch: +4dBu / -10dBV
