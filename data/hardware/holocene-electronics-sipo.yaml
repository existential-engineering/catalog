details: |-
  Serial In Parallel Out digital Shift register. SIPO is a 6hp Serial in parallel out shift reigster. Designed to transform gates and triggers into evolving patterns. By passing gate inputs through a series of logic stages, the Shift Register creates pseudo-random or repeatable rhythmic sequences—ideal for clocks, gates, and stepped voltages. What is a Shift Register? A shift register is a digital logic circuit that passes input data (typically high or low logic signals) through a chain of memory cells, shifting the data with each clock pulse. Each output stage reflects the state of a previous stage in time. QUICKGUIDE :)
