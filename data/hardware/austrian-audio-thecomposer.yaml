description: "Premium open-back reference headphones built in Vienna. The
  Composer features a 49mm Hi-X driver with a diamond-like carbon diaphragm,
  revealing depth, space, and micro-detail with stunning precision. Designed for
  critical listening, it delivers spacious yet precise high frequencies and
  faithful, swift bass impulses at remarkably low THD levels. Three detachable
  cables are included: a balanced 4-pin XLR (3m), a balanced 4.4mm Pentaconn
  (1.4m), and a 3.5mm jack (3m) with 6.3mm adapter. Made in Austria and winner
  of the EISA Award for High-End Headphones 2024–2025."
details: |-
  The Composer uses a proprietary banana jack connector on the headphone body, accepting three included detachable cables: a 3m balanced 4-pin XLR, a 1.4m balanced 4.4mm Pentaconn, and a 3m 3.5mm jack cable with 6.3mm adapter. The 49mm Hi-X driver employs a diamond-like carbon (DLC) diaphragm for extremely low THD below 0.1% at 1kHz. Open-back over-ear design, 5Hz–44kHz frequency range, 112 dB SPL/V sensitivity, 22Ω impedance. Awards: EISA High-End Headphones 2024–2025, VGP Gold Summer 2024, VGP 2025 and 2026.
specs: |-
  - Construction: Over-ear, open-back
  - Driver Size: 49mm
  - Diaphragm: Diamond-like carbon (DLC)
  - Frequency Range: 5 Hz – 44 kHz
  - Sensitivity: 112 dB SPL/V
  - THD (at 1 kHz): < 0.1%
  - Impedance: 22 Ω
  - Input Power: 160 mW
  - Weight (without cable): 385 g
  - Dimensions: 215 × 200 × 90 mm
  - Included Cables: Balanced 4-pin XLR 3m, Balanced 4.4mm Pentaconn 1.4m, 3.5mm jack 3m with 6.3mm adapter
