description: 300W active studio subwoofer with a 10" custom dual-magnet driver,
  sweepable 50–180Hz high-cut control, front-firing or downward-firing modes,
  and thru output with 80/100Hz low-cut for satellite monitors.
details: |-
  The CLA-Sub delivers controlled, accurate bass reproduction through a
  10-inch custom dual-ferrite dual-magnet driver paired with a 300-watt
  amplifier and a ported enclosure for extended low-end reach. The rigid paper
  cone substrate minimizes distortion while maintaining quick transient
  response.

  Two firing configurations are available: front-firing for the cleanest
  reproduction, and downward-firing which adds approximately +3 dB via room
  coupling. Built-in vibration-dampening feet eliminate the need for external
  isolation pads in either mode.

  A sweepable high-cut control ranging from 50 to 180 Hz allows precise
  crossover matching with satellite monitors. The thru output to studio
  monitors includes an 80 Hz or 100 Hz low-cut filter option. Additional
  controls include phase, gain, a power-saving standby mode that activates
  after 30 minutes of inactivity, and footswitch-togglable operation.
specs: |-
  - Amplifier Power: 300W
  - Driver: 10" custom dual-magnet (dual ferrite)
  - Enclosure Type: Ported
  - High-Cut Control: Sweepable 50–180Hz
  - Low-Cut Filter: 80Hz / 100Hz (switchable, on thru output)
  - Firing Modes: Front-firing / Downward-firing (+3dB room coupling)
  - Standby Mode: Auto after 30 minutes of inactivity
  - Footswitch: Supported
