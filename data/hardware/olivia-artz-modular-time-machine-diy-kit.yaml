description: A DIY through-hole kit to build the Time Machine, a tactile
  interface for mixing together 8 delay lines with an input signal, creating
  clocked rhythmic glitch effects, reverbs, and chaos.
details: |-
  Orders placed now for Time Machine will take a month to ship. We are awaiting the availability of additional Daisy Patch Submodules [in late-August]. This is a DIY kit to build your own Time Machine. It is an entirely through-hole kit with all the parts included. Build Instructions

  Time Machine is a tactile interface for mixing together 8 delay lines with an input signal. At least that was the plan. We made a prototype and got like 300% funded on kickstarter, so we got to work. As the DSP engine was refined a sonic character emerged that howls like guitar feedback while granulizing like the grey goo at the end of the universe . We leaned into this. The resulting module can create clocked rhythmic glitch effects, reverbs, chaos, and ego-death. Time Machine on ModularGrid

  Time Machine Manual

  Download Firmware v1.0.1
