name: EVOLVE 70
manufacturer: electro-voice
primaryCategory: speaker
categories:
  - subwoofer
url: https://products.electrovoice.com/na/en/evolve-70/
description: The EVOLVE 70 is a portable powered column array system for larger
  high-energy events, combining a 15-inch subwoofer enclosure with a detachable
  column of eight 4.7-inch neodymium drivers on an aluminum distance pole. The
  system delivers 2000 W total Class-D amplification (1000 W LF / 1000 W HF) and
  up to 133 dB peak SPL with 120 deg horizontal x 25 deg vertical coverage and
  advanced FIR processing for linear frequency response. The EVOLVE 3-2-1 design
  (three pieces, two clicks, one system) and integrated carrying case enable
  rapid deployment. The built-in 4-channel mixer offers two combo mic/line
  inputs, stereo line input, AES/EBU digital I/O, Bluetooth audio, and
  QuickSmart Link wireless control, with full configuration via the QuickSmart
  Mobile app. Available in black or white.
details: >-
  2000 W total Class-D amplification (1000 W LF + 1000 W HF)


  Eight 4.7 in (120 mm) neodymium column drivers


  15 in (380 mm) subwoofer with 3 in voice coil


  Maximum SPL of 133 dB peak


  Frequency response 40 Hz - 18 kHz (-3 dB); range 35 Hz - 20 kHz (-10 dB)


  Coverage pattern 120 deg horizontal x 25 deg vertical


  Advanced FIR processing for linear on-axis response


  Laminar-flow vent design for reduced subwoofer port noise


  EVOLVE 3-2-1 assembly: three pieces, two clicks, one system


  Built-in 4-channel mixer with mic/line, stereo line, AES/EBU and Bluetooth
  inputs


  QuickSmart Link wireless control and QuickSmart Mobile app integration


  Available in black or white; includes carrying case for array and pole
