details: |-
  Designed for use in local radio and other broadcast applications where ease of use must be married with an added level of functionality, the Soundcraft RM105 is a fully modular on-air console which provides a versatile and cost-efficient studio control package. The RM105’s frame can be specified to be 8, 12 or 20 channels wide. Mono, Stereo, Telco and Source Select input modules are available, in addition to a Master Module which is included as standard. The RM105 is readily available in four standard configurations, although custom configurations are available to special order. For product availability and pricing please contact your local dealer.
