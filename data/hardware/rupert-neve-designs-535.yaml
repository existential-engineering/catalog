description: "A 500 Series compressor module capturing the sonic character of
  Rupert Neve's original 2254 diode-bridge design with modern enhancements:
  advanced timing control, a lower noise floor, fully stepped controls, and
  built-in parallel processing via a BLEND control. Designed to deliver punchy,
  thick, and versatile compression suitable for vocals, guitars, bass, and
  drums."
details: |-
  The 535 brings Rupert Neve's classic 2254 diode-bridge compressor topology into the 500 Series format with modern refinements. Built around the same fundamental gain reduction circuit that defined the sound of countless records, the 535 delivers the punchy, harmonically rich compression that engineers have prized for decades — now with greater control and a lower noise floor.

  Six selectable ratios (1.5:1 through 8:1) and six timing presets — FAST, MF (Medium Fast), MED (Medium), MS (Medium Slow), SLOW, and AUTO — let engineers tailor compression character to any source. The AUTO setting introduces program-dependent release behavior, with a long secondary release that responds to sustained input levels.

  A 31-position stepped threshold control (-25 dB to +20 dB) and 31-position makeup gain provide precise, recallable settings. The dedicated BLEND control delivers parallel compression internally — mixing dry input with the compressed output in any ratio from 0 to 100% — without external routing.

  Additional features include a 150 Hz / 12 dB-per-octave side-chain high-pass filter for taming bass-heavy material, stereo LINK functionality across two adjacent modules, a true bypass switch for A/B comparison, and LED metering for both output level and gain reduction. Made in the USA.
specs: |-
  - Topology: Diode-bridge gain reduction
  - Ratios: 1.5:1, 2:1, 3:1, 4:1, 6:1, 8:1
  - Timing presets: FAST, MF, MED, MS, SLOW, AUTO
  - Threshold: 31-position stepped, -25 dBu to +20 dBu
  - Makeup gain: 31-position stepped
  - BLEND: 0-100% parallel processing
  - Side-chain HPF: 150 Hz, 12 dB/octave
  - LINK: stereo linking between two modules
  - Maximum input/output level: +23.5 dBu
  - Input impedance: 10 kOhm
  - Output impedance: 40 Ohm
  - THD+N: 0.001% @ 1 kHz, maximum output
  - Noise floor: -101 dBu (22 Hz - 22 kHz BW)
  - Frequency response: ±0.1 dB (10 Hz - 120 kHz)
  - Power: 100 mA @ ±16VDC
  - Format: 1x 500 Series Module
  - Dimensions: 1.5" W x 5.9" D x 5.25" H
  - Weight: 1.5 lbs (0.7 kg)
  - Made in the USA
