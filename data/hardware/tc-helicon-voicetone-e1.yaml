url: https://www.tchelicon.com/en/products/0726-abk
description: Single-button vocal delay stompbox with eight echo presets covering
  slap-back, stereo doubled delay, tape echo, modulated delay and ducking delay.
  The footswitch doubles as a tap tempo input.
details: |-
  The VoiceTone E1 is a single-stomp delay and echo pedal voiced specifically for the human voice. Eight presets cover classic vocal echo territory: slap-back, stereo doubled delay, tape echo, modulated long-feedback delay, and a ducking delay that steps back while the vocal is present and blooms in the gaps.

  The footswitch doubles as a tap-tempo input, so the delay time can be matched to the tempo of the song without a separate control. Adaptive Tone processing keeps the dry signal present so the echo sits behind the lead rather than obscuring it.

  Connections are an XLR input and an XLR output, with 48V phantom power for condenser microphones and true bypass. The pedal runs from a standard 9V supply.
specs: |-
  - Eight vocal echo presets: slap-back, stereo doubled delay, tape echo, modulated long-feedback delay and ducking delay
  - Footswitch doubles as a tap tempo input
  - Adaptive Tone processing on the dry signal
  - 48V phantom power for condenser microphones
  - True bypass
  - Powered by a standard 9V DC supply
