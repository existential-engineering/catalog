description: The Five Fifteen is a budget bass practice combo from Ashdown's All
  Access range, named in memory of John Entwistle. It combines a 100 watt power
  section with a single 15-inch Ashdown bass speaker and the acclaimed ABM EQ
  section for precision tone control, with an input level control ranging from
  super-clean to classic tube overdrive. It adds an MP3 input with mix level
  control and the classic Ashdown VU meter.
details: |-
  The Five Fifteen is part of the Ashdown All Access range, a budget bass practice amp named in memory of the late John Entwistle. It combines a 100 watt power section with a single 15-inch Ashdown bass speaker and the highly acclaimed ABM EQ section for precision tone control. The input level control allows tones ranging from super-clean to classic tube overdrive. It also features an MP3 input with mix level control and the classic Ashdown VU meter.
specs: |-
  - Power output: 100 watts
  - Speaker configuration: 1 x 15 inch Ashdown bass speaker
  - Frequency response: -3dB at 22Hz - 25kHz
  - High instrument input: 3.9M ohms, 150mV - 20mV p-p
  - Low instrument input: 10k ohms, 300mV - 40V p-p
  - EQ: Bass +/-15dB at 100Hz, Lo Mid +/-15dB at 220Hz, Middle +/-15dB at 660Hz, Hi Mid +/-15dB at 1.6kHz, Treble +/-15dB at 7kHz shelving
  - Distortion: less than 0.5% THD
  - MP3 input with mix level control
  - VU meter
  - Dimensions (H x W x D): 550 x 459 x 544 mm
  - Weight: 26 kg
