description: Traditional soundhole pickups are notoriously magnetic, amplifying
  the sound of the strings while losing the character of your guitar’s body. The
  patented M1 changed the rules.
details: |-
  Traditional soundhole pickups are notoriously magnetic, amplifying the sound of the strings while losing the character of your guitar’s body. The patented M1 changed the rules. While we were experimenting in R&D, we discovered that carefully suspending the lower coil allowed it to act as a body sensor. This additional resonance from the guitar top blended seamlessly with the magnetic sensor for a sound all its own. Unlocking a new dimension of body sensitivity bypassed the limits of traditional magnetic pickups. This created a breakthrough sound that caught the attention of elite industry players and soon made its way onto the stages of legends like David Gilmour and Tom Petty.
specs: |-
  - Magnetic soundhole pickup, mounts in the soundhole
  - Passive (no batteries or preamp required)
  - Patented floating lower coil acts as a body sensor
  - Adjustable pole pieces for string gauge
  - Hum-free, feedback-resistant construction
  - Built-in gold-plated 1/8" jack; includes 2' strapjack assembly and 10' cable
  - For steel-string and 12-string acoustic guitars
  - U.S. Patent 7,135,638; requires professional installation
