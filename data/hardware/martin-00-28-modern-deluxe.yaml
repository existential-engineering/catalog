details: |-
  The 00-28 Modern Deluxe delivers Golden Era tone and modern luxury in a comfortable Grand Concert size. A spruce VINTAGE TONE SYSTEM (VTS) top and Golden Era-style Adirondack spruce X-bracing replicate the warmth and clarity of a nearly century-old Martin.

  Natural protein glue and a lightweight carbon-fiber bridge plate enhance resonance, while exclusive Liquidmetal bridge pins reflect energy for added volume.

  EVO gold frets and a slightly asymmetrical neck ensure effortless playability, and European flamed-maple binding, Waverly gold open-gear tuners, and a 1933-style pearl logo offer refined elegance.
specs: |-
  - Body size: 00-14 Fret (Grand Concert)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back and sides: East Indian Rosewood
  - Bracing: GE-Scalloped X Brace, Adirondack Spruce with VTS, 1/4"
  - Bridge: Ebony, Modern Belly - Drop in Saddle
  - Bridge pins: Liquidmetal with Red Acrylic dots
  - Saddle: Compensated Bone, 16" radius
  - Rosette: Style 28 Multi-Stripe
  - Binding: European Flamed Maple
  - Pickguard: Tortoise Pattern
  - Neck shape: Vintage Deluxe with High-Performance Taper
  - Neck material: Genuine Mahogany, Dark Mahogany satin finish
  - Scale length: 24.9"
  - Total frets: 20, 14th fret neck joint
  - Fingerboard: Ebony
  - Fingerboard width at nut: 1 3/4"
  - Fingerboard width at 12th fret: 2 1/8"
  - String spacing: 2 5/32"
  - Inlay: Diamonds and Squares Long Pattern in Abalone
  - Side dots: Abalone
  - Headstock: Solid with Square Taper and Diamond, East Indian Rosewood, Stylized Script Inlay
  - Tuning machines: Gold Open Gear with Butterbean knobs
  - Nut: Bone
  - Construction: Dovetail Neck Joint
  - Pleked: Yes
  - Left-handed: Available
  - Electronics: None (factory options available)
  - Case: Ply Hardshell
