description: A guitar from the Forma Series with a spherical-inspired body
  design, made from lightweight Simarouba wood. It features a rosewood
  fretboard, 25-inch scale, 23.5 frets, an angled P90 neck pickup, and a
  humbucker bridge pickup, plus an included hardshell case.
details: |-
  DESCRIPTION

  'The shape of things to come...'

  Introducing the Forma Sferata by Rivolta Guitars. Initially launched as a limited run of 48 pieces, the Rivolta Sferata LTD was an evolution of Dennis Fano's 2012 retro-future inspired design; the Fano Psonicsphear, which incorporated spherical or circular elements within the instruments silhouette and pickguard design. The Rivolta Forma Sferata is made from ultra light weight, yet resonant Simarouba wood and features a Rosewood fretboard, 25" scale, 23 1/2 Medium Jumbo Frets (Yes, we said 23 1/2!), angled P90 in the neck, Humbucker in the bridge and a custom fitted vintage style hardshell case. FEATURES & SPECS
