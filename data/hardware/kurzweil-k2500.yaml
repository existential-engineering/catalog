description: >-
  The Kurzweil K2500 is a flagship V.A.S.T. workstation offering 48-voice polyphony, up to 28 MB
  of ROM samples, an optional 128 MB sampler, 32-track sequencer, and K.D.F.X. effects processing.
details: |-
  Released in 1996, the K2500 represented the evolution of Kurzweil's acclaimed K2000 platform into a true professional production powerhouse. The V.A.S.T. engine gained 60 DSP functions, and the base 8 MB of sample ROM could be expanded to 28 MB through optional sound ROM boards. The keyboard models offered either 76 semi-weighted keys or 88 fully weighted piano-action keys, both with velocity and aftertouch sensitivity.

  The K2500S and K2500XS models added state-of-the-art sampling with 64 MB of RAM standard, expandable to an unprecedented 128 MB. The sampler featured comprehensive DSP functions including time compression/expansion, pitch shifting, resampling, and beat-aligned sample pasting. Analog and digital I/O with AES/EBU support and the optional DMTi interface enabled direct data exchange with Alesis ADAT and Tascam DA-88 machines.

  The optional K.D.F.X. multi-effects processor delivered four stereo buses of studio-quality effects comparable to dedicated rack units. The 32-track sequencer supported pattern, linear, and step recording with advanced groove quantizing and up to 16 songs with 16 arrangement tracks. Eight real-time sliders and two ribbon controllers provided extensive hands-on control.

  At the top of the range, the K2500 Audio Elite System (AES) came fully expanded with every available option and a distinctive premium aesthetic, listing at $19,995. The K2500 was used by Pink Floyd, Nine Inch Nails, and ATB, among others.
specs: |-
  - Polyphony: 48 voices (24 stereo)
  - Oscillators: V.A.S.T. with 60 DSP functions, 8 MB ROM (expandable to 28 MB)
  - Sampler: Optional, up to 128 MB RAM
  - Sequencer: 32-track, 16 songs, 16 arrangement tracks
  - Effects: Optional K.D.F.X. with reverbs and multi-effects, digital I/O
  - Keyboard: 76 semi-weighted or 88 weighted keys with velocity and aftertouch
  - Memory: 238 ROM presets, 200 user RAM patches; dual SCSI ports
  - Control: MIDI (16 parts)
