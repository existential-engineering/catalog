description: >-
  The Kurzweil K2500 is a professional sampler-synthesizer-workstation built around
  Kurzweil's V.A.S.T. synthesis engine, offering 48-voice polyphony and optional 128 MB
  sampling. Available in 76-key semi-weighted and 88-key fully weighted configurations, it
  features a 32-track sequencer, optional K.D.F.X. multi-effects, and extensive real-time
  control via eight sliders and two ribbon controllers.
details: |-
  Released in 1996, the K2500 represented the evolution of Kurzweil's acclaimed K2000 platform into a true professional production powerhouse. The V.A.S.T. (Variable Architecture Synthesis Technology) engine provided 60 DSP functions capable of realistic acoustic instruments as well as a diverse range of analog synth sounds. The base 8 MB of sample ROM could be expanded to 28 MB through optional sound ROM boards, with 438 total presets (238 ROM, 200 RAM).

    The K2500S and K2500XS models added state-of-the-art sampling with up to 128 MB of RAM. The sampler featured comprehensive DSP functions including time compression/expansion, pitch shifting, resampling, and beat-aligned sample pasting via the Mix Beat function. Analog and digital I/O with AES/EBU support and the optional DMTi (Digital MultiTrack Interface) enabled direct data exchange with Alesis ADAT and Tascam DA-88 machines, supporting up to 8 digital channels simultaneously.

    The optional K.D.F.X. multi-effects processor delivered four stereo buses of studio-quality effects comparable to dedicated rack-mount units, with real-time MIDI control over all parameters. The 32-track sequencer supported pattern, linear, and step recording with advanced groove quantizing, event list editing, and up to 16 songs with 16 arrangement tracks. Eight real-time sliders and two ribbon controllers provided extensive hands-on sound shaping.

    At the top of the range, the K2500 Audio Elite System (AES) came fully expanded with every available option including two DMTi interfaces and a CD-ROM drive, listing at $19,995. The K2500 was used by Pink Floyd, Nine Inch Nails, and ATB, among others. Its successor, the K2600 series, was virtually identical but offered increased preset memory and a refreshed purple and black color scheme.
specs: |-
  - Polyphony: 48 voices (24 stereo)
    - Synthesis: V.A.S.T. with 60 DSP functions
    - Sample ROM: 8 MB expandable to 28 MB
    - Sampler RAM: Up to 128 MB (S-models)
    - Presets: 438 total (238 ROM, 200 RAM)
    - Sequencer: 32-track, 16 songs, 16 arrangement tracks
    - Recording modes: Pattern, linear, step with groove quantizing
    - Keyboard: 76 semi-weighted keys (K2500) or 88 weighted keys (K2500X)
    - Controllers: 8 real-time sliders, 2 ribbon controllers, pitch and mod wheels
    - Effects: Optional K.D.F.X. 4-stereo-bus multi-effects
    - Outputs: Stereo main + 8 individual outputs
    - Digital I/O: AES/EBU, optional S/PDIF, ADAT/TDIF via DMTi
    - Storage: Dual SCSI ports, flash ROM upgradeable via diskette
    - MIDI: Full MIDI with 16 parts
