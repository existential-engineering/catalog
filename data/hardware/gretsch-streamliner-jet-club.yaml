details: |-
  The Streamliner Jet Club is a no-nonsense tone machine loaded with exciting new features to deliver exceptional performance, easy playability and rock-solid tuning stability at an incredible value.

  The mahogany body features a belly contour and rounded heel for comfort, a Fast 'C' mahogany neck with Pitch-Perfect head angle keeps tuning stable, and a 12"-radius bound laurel fingerboard with 22 medium jumbo frets makes navigating the neck a breeze. Dual HotWire high-output ceramic humbuckers feed master volume and tone controls with a 3-way toggle.
