  used by Tom Scholz and Eric Johnson in a 9V battery-capable enclosure.
details: |-
  The "Legends Of Fuzz" series is a collection of the world's most historic, rare, and sought after circuits. In 1973, effects legend Craig Anderton and John Lang launched Seamoon Inc., releasing their flagship fuzz pedal the same year: the Fresh Fuzz. Initially, a faulty enclosure design caused these plastic Bakelite pedals to shatter when guitarists stomped on them, so Seamoon began recasing them in metal enclosures within a few months. Despite inaccurate reviews that the Fresh Fuzz was "thin sounding," it gained popularity and has been used extensively by artists like Tom Scholz (Boston) and guitar virtuoso Eric Johnson. The Berkeley is JHS's tribute to the rarer single op amp 741 version (Version 1).
