description: A dual-band fuzz pedal that splits the signal into high and low
  frequency bands via linked crossover filters, each independently fuzzed, with
  CV/expression control and stereo routing options.
details: |-
  Fuzz So Heavy, It Had to Be Split The Crossover Fuzz is a screaming, swirling filter-fuzz monster. It takes your signal, slices it into high and low frequencies, and then absolutely wrecks each band with Death By Audio’s signature fuzz. Like a crossover circuit on a rampage, it gives you independent control over each half of your sound (highs and lows), letting you shape, destroy, and reimagine your tone like never before. Limited Edition White Crossover Fuzz Available at Reverb! Details Want to blow through the mix on stage? Crank the Freq knob to sweep two analog resonant filters in tandem, carving out sonic space with surgical precision or dialing in chaotic, oscillating madness. Adjust the volume of your highs and lows separately for gritty tone sculpting or dial in your dream EQ. With its HIGH and LOW inputs and outputs, you can use the Crossover Fuzz like no other fuzz on the planet: split your signal to different amps, isolate frequencies for creative effect routing, or use it as a stereo panner that slings frequencies across the room. You can even control the filter sweep with CV or expression, and the LED display reacts in real time to show you exactly where your crossover sits. Bonus: it looks sick on a dark stage. This isn’t just a fuzz pedal. It’s a multi-dimensional fuzz engine. It’s Frankenstein’s monster, and it shreds. Key Features: Savage Dual-Band Fuzz - Splits your signal into highs and lows and demolishes them separately. All-Analog Signal Path - Classic DBA tone with zero compromise. Dual-Linked Filters - High-pass and low-pass filters with frequencies controlled in tandem. Independent Gain & Volume for Highs and Lows - Total control over each side of the spectrum. Deadly Resonant Filter - From subtle sweeps to screaming frequency spikes. Flexible I/O Routing - HIGH and LOW ins/outs can split, combine, or stay mono. Amp Splitting Made Easy - Send highs to your guitar amp, lows to a bass amp. Stereo Compatibility - Works with stereo setups for massive spatial tone sculpting. CV/Expression Input - Modulate the crossover point in real time. Reactive LED Display - Glows and shifts color based on your filter position. Tour-Grade Build Quality - Rugged enclosure ready to outlive your van. Controls FREQ Frequency of the low-pass and high-pass filters. The low-pass ranges from 30Hz to 7.6kHz and the high-pass ranges from 80Hz-17kHz. RES Resonance of the filters. Ranges from smooth, to hyper focused, to nasty oscillation. GAIN Amount of gain going into each filter. Ranges from clean, to overdrive, to towering fuzz. VOL Output level of each filter. FREQ EXP (Side Jack) Controls the filter frequency with an expression pedal or 0-5V external CV. Automate panning, filtering, stereo sweeps, and more. The FREQ knob will set the minimum frequency that your expression pedal or CV will go down to. Down = MAX RANGE. Tip - Out, Ring - 5V, Sleeve - GND. Light Switch (Internal) Changes the color set of the LEDS. “Sky Light”: Low-pass = Yellow, High-pass = Cyan “Cyber Light”: Low-pass = Red, High-pass = Blue Inputs and Outputs The CROSSOVER FUZZ features unique dual inputs and outputs, allowing for a wide range of pedalboard configurations, amp setups, and creative experimentation. Mono Plug into either INPUT H or INPUT L and the HIGHS MONO output. This combines both the low-pass and high-pass signals into a single summed output. Stereo to Mono Plug into INPUT H and INPUT L, then connect to the HIGHS MONO output. This sums both the low-pass and high-pass signals into a single output. Mono to Stereo Plug into either INPUT H or INPUT L and connect both the HIGHS and LOWS outputs. This splits your signal into stereo: the LOWS output carries the low-pass signal, while the HIGHS output carries the high-pass signal. Stereo When both inputs and outputs are used, INPUT L routes to the LOW output, and INPUT H routes to the HIGHS output for full stereo separation. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel. We recommend Death By Audio’s RAW POWER power supply for optimal performance. Current Draw: 120 mA Physical Details Dimensions: 5.73” x 5.2” x 2.37” (including hardware) Weight: 18.5 oz. Sound Samples Jaguar, Twin Reverb Highpass Sizzle Fuzzy Lows Wailing Solo Clean Sweep Destroyed Sweep Yamaha Bass, B15 Slow Wah Bassline Slow Transformation Stutter Bass (Controlled by DISTURBANCE) Big Filter Riff (Controlled by DISTURBANCE) Others Stereo Reverb Sweep (with ROOMS) Stereo Overdrive Verb (with ROOMS) Flanger Chug (with DISTURBANCE on HIGHS) Cocked Distortion Split (LOWS: INTERSTELLAR OVERDRIVER) (HIGHS: BASS WAR) Heavy Bass Split (LOWS to B15, HIGHS to Twin Reverb) Digital Manual
