description: Cascade is a passive expander for the Eddy mixer that provides
  access to individual VCA outputs for use as a triple stereo VCA, as well as
  access to feedback filter outputs and simultaneous clean, compressed, and
  distorted bus outputs.
details: |-
  If ordering on release (April 2026) please allow an extra week or two for delivery as only one person is doing all the packing and shipping. The Cascade is an expander for Eddy that allows access to the individual VCA outputs for use as a triple stereo VCA as well as access to the feedback filter outputs and simultaneous clean, compressed, and distorted bus outputs for additional mixing and processing options. It is passive and neither increases the current draw of Eddy or does anything without it. DOWNLOAD QUICKSTART

  Features
specs: |-
  - Individual outputs for each mix bus (Clean, compressed, and distorted)
  - Individual outputs for all three stereo VCA or feedback filter channels
  - 4HP expander to use as triple stereo VCA
  - 34mm depth (including cable)
  - current draw: N/A
