description: 8-channel full-range microphone and line preamplifier with AD
  converter, 85 dB gain range, AES/EBU and ADAT digital outputs, optional MADI
  I/O, and complete MIDI remote control.
details: |-
  The Micstasy is an 8-channel full-range microphone and line preamplifier with an integrated AD converter, housed in a 2U 19-inch rack chassis. It operates simultaneously in analog mode (Mic/Line In to Line Out) and digital mode (Mic/Line In to Digital Out), and is fully remote-controllable via MIDI.

  Each channel offers an 85 dB gain range, a balanced XLR mic/line input, a balanced TRS line/instrument input with selectable Hi-Z mode, and a balanced XLR line output. The AutoSet feature provides automatic gain reduction with multiple channel linking for safe handling of transient material.

  Digital outputs include four AES/EBU pairs on a single D-sub connector (8 channels up to 192 kHz) and two ADAT optical outputs (8 channels up to 96 kHz with SMUX and SMUX4 support). An optional I64 MADI Card adds 64-channel MADI I/O with coaxial and optical connectivity, plus serial cascading of up to 8 Micstasy units.

  RME's SteadyClock technology provides ultra-low jitter clocking with Intelligent Clock Control (ICC) for sample rate retention, while SyncCheck verifies external synchronization integrity. Additional features include M/S de-/encoding for digital output, 8 user presets, 13-LED per-channel level metering, and a hi-pass filter (Lo Cut) with 18 dB/octave slope.

  The internal 60W switching-mode universal power supply (100-240V AC) makes Micstasy suitable for studio, broadcast, and live applications worldwide.
specs: |-
  - 8 balanced XLR mic/line inputs with 85 dB gain range
  - 8 balanced TRS line/instrument inputs with selectable Hi-Z
  - 8 balanced XLR line outputs
  - 4 x AES/EBU output via D-sub (8 channels @ 192 kHz)
  - 2 x ADAT output (8 channels @ 96 kHz, SMUX and SMUX4)
  - Optional I64 MADI Card with coaxial and optical connectivity
  - Word Clock In/Out on BNC
  - MIDI In/Out for complete remote control
  - AutoSet automatic gain reduction with multiple channel linking
  - SteadyClock jitter reduction technology
  - SyncCheck synchronization verification
  - Intelligent Clock Control (ICC) for sample rate retention
  - M/S de-/encoding for digital output
  - 8 user preset storage slots
  - 13-LED per-channel level metering
  - Hi-pass filter (Lo Cut) with 18 dB/octave slope
  - Cascading capability for up to 8 devices via optional MADI card
  - Frequency response 20 Hz - 100 kHz (-0.1 dB)
  - EIN @ 50/60/70 dB Gain: 127.4 dBu
  - THD+N @ 30 dB Gain: < -100 dB (< 0.001%)
  - SNR @ +30 dBu: 115.2 dB RMS unweighted
  - AD Converter Latency: 12 samples (0.25 ms), 9 samples (0.09 ms), or 5 samples (0.026 ms) depending on speed
  - Sample frequencies: 44.1, 48, 88.2, 96, 176.4, 192 kHz; variable via external clock
  - Internal 60W switching-mode power supply, 100-240V AC
  - Dimensions: 483 x 88 x 200 mm (19-inch rack, 2U)
  - 2-year warranty
