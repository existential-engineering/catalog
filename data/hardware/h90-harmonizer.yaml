details: |-
  The H90 Harmonizer is a next-generation multi-effects pedal featuring 74 professional algorithms and hundreds of curated programs, designed to be the heart of a musician's rig. It combines advanced sound design capabilities with versatile performance features, offering both iconic effects and cutting-edge sonic manipulations.

  The pedal includes four new granular effects that create blooming reverse delays, rhythmic glitchy stutters, and morphing textures. It also features a groundbreaking harmonizer+ vocal effects suite with four studio-grade vocal algorithms: vocaltune, vocalshift, vocalshiftmidi, and quadravox+, derived from eventide's flagship h9000 processor.

  The h90 offers extensive performance controls with six programmable footswitches, a perform mode, and three push-button quick knobs. Users can map functions like tap tempo, preset bypass, and performance parameters such as reverb freeze and pitch flex. The comprehensive ui allows for detailed parameter control through a hi-res OLED display and five push knobs.

  The device provides flexible routing options, including the ability to use two algorithms simultaneously, route effects in series or parallel, and incorporate two mono inserts or one stereo insert anywhere in the signal chain. It supports dual-mode processing for two independent stereo signals and includes extensive connectivity options.

  The h90 control app enables remote programming, allowing users to manage programs, perform system updates, program MIDI mappings, and import/export user lists via Bluetooth or USB-c on computers and ipads.
