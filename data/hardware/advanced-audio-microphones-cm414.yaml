details: |-
  CM414

  The CM414 is a large dual-diaphragm, 3-pattern fet microphone based on the early AKG C414eb. The CM414 response is very smooth up to 8kHz, then rises to about 4dB at 15kHz, adding an "airy" quality to the sound. The CM414 has a more present sound than the later AKG C414/P48. Capsule:

  The Advanced Audio CM414 features a 34mm capsule with 6-micron-thick German mylar diaphragms. This capsule is very accurate and has a smooth frequency response that matches within 1.5 dB, the response of the capsules used in the AKG C12 and early C414eb microphones. This is the same capsule used in our popular CM12se tube microphone. Circuit:

  The CM414 uses a two-stage Class "A" fet circuit similar to the one found in the original C414. The fet is buffered by a discrete transistor then coupled into the output transformer, a strategy superior to the single-fet method used in the Neumann U87. This increases the overall headroom by 14db making it ideal for capturing drum, percussion & grand piano. The CM414 has a -10dB pad, a low-frequency roll-off switch, and 3-way pattern switch on the body.
specs: |-
  - 34mm dual back-plate with 6-micron German mylar skinned dual diaphragm
  - Class A discrete transformer coupled circuit
  - 3 selectable pick-up patterns,OMNI, CARD & Fig 8.
  - Standard 48V phantom power requirement
  - Frequency response: 20Hz to 20kHz +/–3dB
  - Noise: <12dB(A weight)
  - Impedance: <200 ohms (load impedance <1.2K)
  - Distortion: 0.5% @ 125dB (135dB with -10dB pad)
  - Maximum output > than +14dbu with less than .5% distortion
  - 75 hz low frequency roll-off switch
  - Heavy Duty shock mount
  - Aluminum road case
