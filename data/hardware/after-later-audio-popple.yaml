description: Popple is an 8HP multimode stereo filter Eurorack module based on
  the Mutable Instruments Ripples V1 filter section, offering two independent
  audio paths with shared resonance and cutoff controls. It can self-oscillate
  at high resonance to act as a dual sine wave oscillator.
details: |-
  Popple is an 8hp multimode stereo filter based on the Mutable Instruments Ripples V1 filter section. Popple maintains the buttery smoothness of Ripples filter while giving you two separate audio paths. The audio paths share a resonance, control, a frequency cutoff control, resonance CV input, and a v/oct cutoff CV input. Each channel then has it's own cutoff CV input with attenuverters (which are normalled to a 2.5V signal). Popple will also self-oscillate at high resonance settings, when coupled with the v/oct CV control, it can also act as a dual sine wave oscillator.
