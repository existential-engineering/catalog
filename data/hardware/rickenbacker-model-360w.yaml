name: Model 360W
manufacturer: rickenbacker
primaryCategory: electric-guitar
url: https://www.rickenbacker.com/guitars/model-360w/
description: Learn about the exquisite features of the Model 360W Guitar,
  including its hollow body design and stunning Maple fingerboard.
details: |-
  The W Series version of the guitar that broke all the styling rules of the
  1960's now boasts a solid natural look to accompany the full, rich and warm
  sounds distinctive to Rickenbackers. Subtly updated through the years, this
  Deluxe hollow body with its special contour around the entire body
  perimeter, is still perhaps the most comfortable guitar of all. The bound
  body and Maple fingerboard, inlayed with triangular pearloid markers,
  provide an exceptionally attractive appearance. Stereo output is standard.
specs: |-
  - Body Type: Semi-Acoustic
  - No. Frets: 21
  - Scale Length: 62.9 cm (24 3/4")
  - Neck Width at Nut: 41.4 mm (1.63")
  - Neck Width at 12th Fret: 49.05 mm (1.931")
  - Crown Radius: 25.4 cm (10")
  - Body Wood: Walnut
  - Neck Wood: Maple & Walnut
  - Fingerboard Wood: Maple
  - Weight: 3.6 kg (8.0 lbs.)
  - Overall Length: 101 cm (39 3/4")
  - Overall Width: 38.1 cm (15")
  - Overall Depth: 38.1 mm (1 1/2")
  - Neck Binding: Yes
  - Fret Marker Style: Triangle
  - Tailpiece: 'R'
  - Bridge: 6 Saddle
  - Neck Type: Set-in
  - No. of Pickups: 2
  - Type of Pickups: Hi-gain
  - Output Type: Mono and Stereo
  - Machine Heads: Gotoh
