description: The original Empress Tremolo is an analog-signal-path tremolo pedal
  with digitally controlled opto modulation, offering three waveforms, tap tempo
  with ratios, an exclusive two-speed mode, rhythm patterns and up to 6 dB of
  output gain. It has been discontinued and superseded by the Tremolo2.
details: |-
  The original Empress Tremolo is an analog-audio-path tremolo whose effect is controlled digitally via opto technology, giving a quiet result free from the LFO throb typical of tremolos. Three waveforms are available: an asymmetrical shape modeled after a '65 Fender Vibrolux, a square wave for harder sounds, and a triangle wave for a conventional tremolo.

  Tap tempo averages the last four taps and offers ratio selection (1:1, 1:2, 1:4), and an exclusive two-speed mode lets you switch between rates. Rhythm patterns go beyond standard tremolo, and an output gain stage delivers up to 6 dB of clean boost to offset the volume drop many tremolos introduce.

  It uses true bypass in a compact die-cast aluminum enclosure.
specs: |-
  - Analog audio path with digitally controlled opto tremolo
  - 3 waveforms: asymmetrical ('65 Fender Vibrolux model), square, triangle
  - Tap tempo (averages last four taps) with ratios 1:1, 1:2, 1:4
  - Exclusive two-speed mode for switching between rates
  - Rhythm patterns
  - Output gain stage up to 6 dB
  - True bypass
  - Noise -104 dB, THD 0.025%
  - Input impedance 475 kOhm, output impedance 250 Ohm, frequency response 6Hz-30kHz (-3dB)
  - Power: 9 V DC, 2.1mm barrel, 30 mA
  - Die-cast aluminum enclosure, approx. 4.5" x 3.5" x 1.5", 1 lb
