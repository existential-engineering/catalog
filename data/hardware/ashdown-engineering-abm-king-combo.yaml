id: CvB_8jhdt3YL_vdSTSON9
name: ABM King Combo
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-king-combo
description: Originally developed for bass legend Mark King, the King Combo
  combines the ABM 500 EVO II head (575W RMS) with eight 10 inch Ashdown
  BlueLine drivers in a precision-tuned plywood cabinet. It offers the full ABM
  preamp toolkit - footswitchable EQ, valve/solid-state blend, compressor, and
  sub-harmonic generator - plus a balanced DI, sub-bass output, tuner output, FX
  loop, and line input, all in a rugged birch-ply combo.
details: |-
  The ABM King Combo, developed for bass legend Mark King, pairs the ABM 500 EVO II head (575W RMS) with eight 10 inch Ashdown BlueLine drivers in a precision-tuned, high-grade birch ply cabinet with buffalo leather cloth covering and chromed metal corners. The ABM preamp offers three rotary tone controls (20dB cut/boost at 60Hz, 660Hz, 5kHz) plus two pairs of sliders (15dB at 180Hz, 340Hz, 1.3kHz, 2.6kHz), all footswitchable, along with a switchable passive/active input blending solid-state and dual-triode tube stages, a footswitchable compressor, and the Ashdown sub-harmonic generator. Connectivity includes a front-panel balanced DI (pre/post EQ), a sub-bass output, a tuner output (footswitchable mute), an FX loop, and a line input.
specs: |-
  - Power Output: 575W RMS (ABM 500 EVO II head)
  - Speaker Configuration: 8 x 10 Ashdown BlueLine drivers
  - Power Requirement: 115 - 230V
  - Minimum Impedance: 4 Ohm
  - Frequency Response: -3dB at 17Hz and 30kHz
  - High Instrument Input: 3.9M Ohms, 150mV - 20mV p-p
  - Low Instrument Input: 10K Ohms, 300mV - 40V p-p
  - Line Input: 22K Ohms, 0dBu nominal
  - Tuner Output: 22K Ohms, 0dBu nominal
  - DI Output: 600 Ohms balanced, 0dBu nominal
  - Sub Output: 1k Ohm, 0dBu nominal
  - Effects Send: 22k Ohm, 0dBu nominal
  - Effects Return: 22K Ohm, 0dBu nominal
  - EQ: Bass +/-15dB @ 45Hz, Middle +/-15dB @ 660Hz, Treble +/-15dB @ 7kHz shelving; Slider 1 +/-15dB @ 180Hz, Slider 2 +/-15dB @ 340Hz
  - Dimensions (H x W x D): 158 x 610 x 355 mm (head section)
  - Weight: 28 kg
