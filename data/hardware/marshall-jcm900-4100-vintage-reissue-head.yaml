description: This two-channel dual spring reverb 100W powerhouse will make you
  stand out on stage. A stylish reissue, the JCM900 4100 is the natural
  evolution of the JCM800 adding another channel, two reverb options and two
  gain features to give you that extra boost. An amp built to go on the road and
  be on the stage with a sound loud enough to fill stadiums. Originally released
  in January 1990, the JCM900 4100 boasted higher gain and lower noise coupled
  with the classic Marshall tone. Handcrafted in the Bletchley, England factory.
details: |-
  - All-valve
  - Two channels
  - Reverb options (dual spring reverb)
  - FX loop with level control
  - Power reduction from 100W to 50W at the flick of a switch
  - Handcrafted in Bletchley, England
specs: |-
  - Output Wattage: 100W with power reduction to 50W
  - Channels: 2
  - Technology: All-valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 4 x 5881
  - Effects: Spring reverb (dual)
  - Effects Loop: Yes, with level control
  - Controls: Channel A Gain, Channel B Lead Gain, Treble, Middle, Bass, Presence, Channel A (Volume, Reverb), Channel B (Volume, Reverb)
  - Inputs: 1 x 1/4" jack instrument input
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Product Height: 310 mm / 12.2"
  - Product Width: 740 mm / 29.1"
  - Product Depth: 210 mm / 8.3"
  - Weight: 18.8 kg / 41 lb
  - Color: Black and Gold
  - Box Contents: PEDL-91004 included; Detachable power cable included; Speaker cable included
  - Origin Country: United Kingdom (Bletchley, England)
