details: |-
  This two-channel dual spring reverb 100W powerhouse will make you stand out on stage. A stylish reissue, the JCM900 4100 is the natural evolution of the JCM800 adding another channel, two reverb options and two gain features to give you that extra boost. An amp built to go on the road and be on the stage with a sound loud enough to fill stadiums. Designed and engineered in UK. Made in UK.

  Tailor your power to suit your surroundings. The JCM900 is equipped with a simple switch to effortlessly choose between a 100W and 50W power output. Now you can play in the rehearsal room or the living room without any hassle.

  The JCM900's effects loop functions as a platform for pedals. With the JCM900, your distinctive sound will always shine through.

  Step out of your comfort zone with built-in reverb controls. Experiment with your sound and unleash breathtaking solos that will leave a lasting impression.

  Originally released in January 1990, the JCM900 4100 boasted higher gain and lower noise coupled with the classic Marshall tone. Today, the JCM900 is part of Marshall's Vintage Reissue series. Skilfully crafted at Marshall's factory in Bletchley, England, the JCM900 effortlessly channels the Marshall spirit and carries the classic Marshall touches. This all-valve amp is famous for its tone and roadworthiness, while still maintaining the original high gain and dual reverb functions.
specs: |-
  - Model: JCM900 4100 Vintage Reissue Head
  - Range: vintage reissue
  - Channels: 2
  - Technology: valve
  - Output wattage: 100W, switchable to 50W
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16 ohm / 8 ohm load (the quick start guide rules out loads below 8 ohm), plus a recording compensated line out and a direct line out
  - Inputs: 1 x 1/4" jack instrument input
  - Controls: Channel A Gain, Channel B Lead Gain, Treble, Middle, Bass, Presence, Channel A (Volume, Reverb), Channel B (Volume, Reverb)
  - Effects: spring reverb
  - Effects loop: yes, with level control
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 4 x 5881
  - Weight: 18.8 kg / 41 lb
  - Width: 740 mm / 29.1"
  - Height: 310 mm / 12.2"
  - Depth: 210 mm / 8.3"
  - Country of origin: Designed and engineered in UK. Made in UK.
  - In the box: PEDL-91004 footswitch, detachable power cable, speaker cable
  - Colour: Black and Gold
