description: The TRI AVATAR TA-2H is a chorus pedal with four signal paths,
  three chorus sounds (three phases) plus one dry signal, mixed in the analog
  domain.
details: |-
  The TRI AVATAR is a chorus pedal with four signal paths: three chorus sounds (three phases) and one dry signal. In stereo operation the first phase of chorus sound is assigned to the L side, the second phase to the L and R sides, and the third phase to the R side. In monaural operation all three phases are mixed together.

  Mixing three independent chorus sounds adds width and depth to the output. The maker states that problems common to chorus units, such as unintentional pitch changes, sound images with a blurred lower end and noise relating to sweep timing, were addressed by combining its analog and digital technologies.

  Three independent pitch-modulation signal paths and one dry signal path are mixed in the analog domain, and a widening effect characteristic of three-phase choruses is attained by shifting the phase 120 degrees in each modulation path. 24-bit AD/DA converters are used along with Free The Tone's own signal processing and algorithms.

  Compared with the earlier TA-1H, the number of presets rises from four to 128, of which presets 1 to 4 can be recalled on the unit itself and all 128 via a MIDI controller. The HI-CUT control is replaced by a TONE control that cuts bass when turned right and treble when turned left, and the Dry/Wet mix range widens from a 50 percent maximum to the full 0 to 100 percent. The TA-2H also uses the same AD/DA converter as the FLIGHT TIME digital delay.

  RATE or TONE can be controlled in real time from an expression pedal plugged into the EXT terminal. The HTS (Holistic Tonal Solution) circuit manages signals from input to output so that there is no change in sound character when the effect is switched on or off.
specs: |-
  - 128 presets, presets 1 to 4 recallable on the unit and all 128 via MIDI
  - Input impedance: min. 500k Ohm
  - Output load impedance: min. 10k Ohm
  - Maximum input level: +7 dBu
  - Controls: RATE, TONE, DEPTH L/C/R, DRY MIX, LEVEL
  - Terminals: 4 x standard 1/4 inch phone jack (IN, OUT/L (mono), OUT/R, EXT), DIN 5-P IN connector (MIDI IN), DC9V input jack (for connecting AC adapter)
  - Power supply: 9V DC center negative polarity
  - Current consumption: 150 mA
  - Dimensions: 120 x 102.3 x 58.5 mm including protuberances such as footswitches and jacks
  - Weight: approx. 380 g (0.84 lbs) excluding accessories
  - Three independent pitch-modulation paths with 120 degree phase shift per path
  - 24-bit AD/DA converters
