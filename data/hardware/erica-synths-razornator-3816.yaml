description: Five-voice chromatic stereo resonator
details: |-
  The Razornator is a stereo FX unit built on an algorithm developed by the Dutch company 112dB. It features five chromatically tuned resonating delay lines that can emulate the resonance of physical objects, from the bodies of instruments to rooms and structures.

  Chromatic tuning of the resonating delay lines makes the effect particularly musical, because the lines can be aligned in chord-like intervals, while the built-in envelope follower adds dynamics to the processed signal. Twelve parameters are available for detailed sound design, with save and recall for all of them, preset morphing, and MIDI control over every parameter.

  The signal path starts with an audio GAIN STAGE that boosts signals up to +24dB, which can effectively act as an analogue overdrive. The signal then passes through a lowpass FILTER with a RESONANCE control, and on into the five chromatically tuned DELAY-BASED RESONATORS, which can be tuned manually or driven by the ENVELOPE FOLLOWER.

  After the resonators the signal is summed and limited by the COMPRESSOR, mixed back with the dry signal, passed through the EQUALIZER and sent to a BALANCED OUTPUT stage. A configurable footswitch input and a sleek aluminium case to match the rest of the compact desktop line round the unit out for studio and live use.
specs: |-
  - 5 chromatically tuned resonating delay lines
  - Chromatic tuning
  - Built-in envelope follower
  - Save and recall for all 12 parameters
  - Preset morphing
  - Resonator tunings playable via MIDI
  - MIDI control over all parameters
  - Configurable footswitch input
  - True stereo signal path
  - Gain stage boosts signals up to +24dB
  - Lowpass filter with resonance control
  - Compressor, dry/wet mix and equalizer after the resonators
  - Balanced output stage
  - Premium aluminium enclosure
