id: RShCwHMYGNkx_Ky1cw-FZ
name: DM12
manufacturer: midas
primaryCategory: mixer
url: "https://www.midasconsoles.com/en/products/0601-AHB"
description: 12 Input Analogue Live and Studio Mixer with MIDAS Microphone
  Preamplifiers. Designed for live performance and studio recording, the DM12
  accommodates small bands, worship teams, and serves as a sub-mixer for larger
  setups. Features 8 mono channels with XLR mic inputs and 2 stereo channels
  (9/10 and 11/12), 3-band EQ with mid-sweep, 2 switchable pre/post-fader aux
  sends, +48V phantom power, and an internal switch-mode power supply.
details: |-
  The Midas DM12 is a 12-input analogue live and studio mixer featuring MIDAS microphone preamplifiers. It provides 8 mono channels with balanced XLR mic inputs and 1/4" TRS line inputs (each with insert points), plus 2 stereo channels accepting 1/4" TRS line-level signals. Each channel offers a 3-band EQ with sweepable mid (150 Hz–3.5 kHz), 2 switchable pre/post-fader aux sends, PFL, mute, and peak LED. The mixer includes balanced XLR main outputs, 1/4" TRS aux and monitor outputs, RCA 2-track in/out for recording playback, and a 1/4" stereo headphone output. +48V phantom power is available. Powered by an internal switch-mode supply (100–240 VAC, 50/60 Hz). Designed for small bands, worship teams, and sub-mixing in larger setups.
specs: |-
  - Input Channels: 12 (8 mono + 2 stereo)
  - Mono Channels: 8 with XLR mic inputs
  - Stereo Channels: 2 (channels 9/10 and 11/12)
  - Channel Faders: 10 x 60mm
  - Master Faders: 2 x 60mm
  - EQ: 3-band (treble, mid, bass) with mid-sweep (150 Hz–3.5 kHz)
  - Aux Sends: 2 switchable pre/post-fader
  - Mic Gain Range (mono): 10 to 60 dB
  - Line Gain Range (mono): -10 to +40 dB
  - Stereo Gain Range: -20 to +20 dB
  - Aux Control Range: 0 to +10 dB
  - Phantom Power: +48V
  - Power Supply: Internal switch-mode
  - Power: 100–240 VAC, 50/60 Hz
  - Height: 95 mm (3.7 in)
  - Width: 328 mm (12.9 in)
  - Depth: 370 mm (14.6 in)
  - Weight: 3.9 kg (8.6 lbs)
  - Metering: 2 x LED meter ladders
  - Per-Channel Features: PFL, Mute, Peak LED
