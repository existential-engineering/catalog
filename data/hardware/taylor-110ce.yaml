details: |-
  The 110ce is a Dreadnought acoustic-electric guitar featuring a torrefied solid spruce top with layered sapele back and sides, delivering big, bold sound for players of all styles and skill levels. With a Venetian cutaway for easy access to the fretboard's upper register and built-in ES2 electronics, players can look forward to an easy-playing, accommodating experience that's up to the task in virtually any musical application.

  Taylor's Dreadnought body shape captures the potent tone flatpickers and strummers love. The classic proportions produce strong projection and a full, balanced sound that works across a wide range of playing styles, from aggressive flatpicking to relaxed fingerstyle.

  Treated with a special roasting process, the torrefied spruce top delivers all the clarity, balance, and projection you'd expect from a traditional spruce top with an extra dash of warmth and played-in depth. Layered sapele back and sides provide an attractive, durable, and affordable tonal foundation.

  The Expression System 2 captures more of a guitar's dynamic properties using a breakthrough behind-the-saddle design. This pickup system allows for clean, authentic plugged-in tone that faithfully reproduces the acoustic character of the instrument.

  The Venetian cutaway features soft, round lines that allow easy access to upper frets while maintaining the aesthetic elegance of the Dreadnought silhouette.
specs: |-
  - - Body style: Dreadnought with Venetian Cutaway
  - Top: Torrefied Spruce (solid)
  - Back/sides: Sapele (layered)
  - Bracing: C-Class
  - Neck profile: Standard Carve
  - Scale length: 25-1/2"
  - Fretboard inlay: 4mm Dot Italian Acrylic
  - Electronics: Expression System 2 (ES2)
  - Finish: Varnish
  - Strings: D'Addario XS Coated Phosphor Bronze Medium (.013-.056)
