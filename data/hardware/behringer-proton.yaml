description: The PROTON is an analog paraphonic semi-modular synthesizer with
  two VCOs, two multi-mode VCFs and two VCAs, four envelopes and a multi-mode
  wave folder. Its semi-modular design needs no patching to play, and the main
  module can be transferred into a standard Eurorack case.
details: |-
  Designed around an intuitively linear workflow, PROTON benefits greatly from its semi-modular design, which requires no patching for immediate performance. Just put your PROTON into self-oscillation, connect your favorite keyboard or computer via MIDI over DIN or USB, and start exploring the world of analog music synthesis right out of the box.

  The PROTON's two self-oscillating, multi-mode VCFs can be configured in parallel or series, with linkable CVs for even more possibilities. Its two ASR envelopes, each with reverse, inverse, loop and bounce options, give control over the VCAs and wave folder, while two analog ADSR generators allow for unique sound performance by modulating the VCFs.

  The multi-mode wave folder adds rich harmonic content to the LFOs, and there are two flexible LFOs with five waveforms, MIDI clock sync, key sync, phase and depth controls. The noise generator takes waveform generation further, and external audio can be summed into one or both VCFs.

  The PROTON is designed to fit into a standard Eurorack case. Connect the power cables to the power supply and mount the module using the included screws, so the PROTON can be mixed with other synth modules.
specs: |-
  - Analog signal path based on authentic VCO, VCF and VCA designs
  - 2 VCOs with 5 waveforms (tone mod, pulse, sawtooth, triangle, sine), oscillator sync, pulse width modulation and individual sub-oscillators
  - Oscillator waveform control blends seamlessly between the 5 shapes
  - Paraphonic mode allows both oscillators to be independently controlled
  - 2 self-oscillating, multi-mode VCFs, configurable in parallel or series with linkable CVs
  - 2 VCAs
  - 2 ASR envelopes with reverse, inverse, loop and bounce options, controlling the VCAs and wave folder
  - 2 analog ADSR envelope generators for modulating the VCFs
  - Multi-mode wave folder
  - 2 LFOs with 5 waveforms, MIDI clock sync, key sync, phase and depth controls
  - Noise generator
  - External audio can be summed into one or both VCFs
  - External audio input with level control and soft clipping circuit
  - Utility functions: attenuverters, multiples, signal/CV mixer and summer
  - 64 patch points
  - 68 controls
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - Eurorack format: main module can be transferred to a standard Eurorack case and powered from the case power supply via the included power cables
