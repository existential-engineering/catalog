details: |-
  The world's greatest hollow body guitars just got even better. Designed for the working professional, our all-new Players Edition Hollow Body instruments feature authentic Gretsch sound and style while incorporating cutting-edge features for maximum power, comfort and versatility.

  One of the most desired guitars in history pairs classic standout aesthetics with deep, complex sound for professionals seeking distinction. New FT-67 Filter'Tron humbucking pickups capture authentic vintage Gretsch voicing with a more well-rounded tone for modern playing styles, while innovative ML bracing delivers substantial resonance from the 2.5"-deep laminated maple body.

  The control system offers infinite tonal variations through separate neck and bridge pickup volumes, a master volume with treble bleed, a no-load master tone, and a 3-position toggle. A String-Thru Bigsby B6GP tailpiece, Adjusto-Matic bridge on a pinned ebony base, Grover Imperial locking tuners and gold hardware complete the package, which ships in a G6242L Gretsch 17" deluxe hollow body hardshell case.
