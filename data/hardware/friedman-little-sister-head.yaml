description: The Little Sister is a 20-watt, EL84 powered, single channel head
  based on its 40-watt predecessor. It is voiced for the classic rock tones of
  British tube amps from the 1960s and 1970s.
details: |-
  Primarily designed as a classic rock style amp, the Little Sister offers a range of tones for players after a classic rock sound from the 1960s and 1970s. Huge tones are easy to dial in from this single channel amp, with powerful gain available on tap.

  The Little Sister is a 20-watt cathode biased head running two EL84 power tubes and three 12AX7 preamp tubes, with master volume and gain controls and a full EQ of bass, middle and treble.

  Custom switching adds an S-Switch that changes the gain structure and a B-Switch for bright or tight voicing. Professional features include the ultra-transparent series effects loop and 4, 8 and 16 ohm speaker jacks.

  The Little Sister features the finishing and solid construction expected from a Friedman amplifier. The hand crafted in the USA cabinetry uses tongue and groove Baltic Birch construction. Designed to take pedals, it works with boosts, overdrives, phasers, flangers, tremolos and wahs, while the series effects loop handles time-based effects pedals and rack units.
specs: |-
  - 20-watt cathode biased head
  - Single channel all-tube amplifier
  - 2 x EL84 power tubes
  - 3 x 12AX7 preamp tubes
  - Master volume and gain controls
  - Full EQ consisting of bass, middle and treble
  - S-Switch (gain structure)
  - B-Switch (bright/tight)
  - Ultra-transparent series effects loop
  - 4, 8 and 16 ohm speaker jacks
  - Custom made transformers and capacitors
  - Tongue and groove Baltic Birch cabinet
  - Dimensions: 8.5 inches (D) x 18 inches (W) x 8.25 inches (H)
  - Weight: 22 lbs
  - Assembled in Los Angeles, CA
  - Limited lifetime warranty
