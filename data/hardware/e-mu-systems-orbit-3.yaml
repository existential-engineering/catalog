description: >-
  The E-mu Orbit-3 is a 128-voice rack-mount dance sound module loaded with 64MB of
  electronic and techno-oriented samples, featuring E-mu's SuperBEATs groove generator and
  expandable Z-plane filter architecture. Designed by Rob Papen in collaboration with
  E-mu, it ships with the Beat Garden and Techno Synth Construction Yard ROMs as part of
  the Proteus 2000 family.
details: |-
  The Orbit-3 is the third generation of E-mu's dedicated dance music modules, dramatically expanding on the capabilities of the original 1996 Orbit. Where the first Orbit offered 8MB of sample ROM and 32 voices, the Orbit-3 ships with a fully loaded 64MB "Electronica" soundset and 128-voice polyphony, reflecting the increasing complexity of electronic music production at the turn of the millennium.

  At its core, the Orbit-3 shares the same synthesis architecture as E-mu's Proteus 2000 family, including the B-3, Mo'Phatt, and Xtreme Lead-1 modules. It provides 1,024 ROM presets and 512 user-programmable patches, with sounds specifically curated for techno, trance, house, and other electronic genres. Two expansion card slots allow further growth to 128MB of total sample memory.

  E-mu's SuperBEATs mode serves as a rhythmic groove generator for creating and performing with complex beat patterns, complemented by a pattern generator and arpeggiator for melodic and rhythmic variation. Twelve assignable real-time front panel controls provide hands-on sound shaping during performance.

  The sound engine features 50 types of 6th and 12th-order Z-plane filters for dramatic timbral sculpting, processed through a 24-bit dual stereo effects section with 29 reverb types, 15 delay types, 8 chorus types, 7 flange types, and 5 distortion types. Six analog outputs and S/PDIF digital output provide flexible studio routing across 32 MIDI channels.
specs: |-
  - Polyphony: 128 voices
  - Sound ROM: 64MB "Electronica" soundset (expandable to 128MB via 2 slots)
  - LFO: Yes, with MIDI control
  - Filter: 50 types of 6th and 12th-order Z-plane filters
  - Effects: 24-bit dual stereo processors (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Keyboard: None (rack-mount module)
  - Memory: 1,024 ROM presets, 512 user patches
  - Control: MIDI (32 channels)
  - Outputs: 6 analog, S/PDIF digital
