details: |-
  The Friedman Classic is an amalgamation of vintage and modern humbucker tones. Dave wanted to make sure the Classic humbucker had an open vintage inspired tone with a more modern twist, which is why all Friedman Classic humbucker pickups feature Alnico 5 magnets. The Friedman Classic humbucker delivers a punchy vintage inspired tone with a "Hard Rock" modern edge.

  When Dave Friedman and Grover Jackson were designing the Friedman line of guitars, a lot of thought was put into every aspect of the build, especially the pickups. Inspired by both modern and vintage guitar tones, Dave wanted to make sure that the pickups used in all Friedman guitars delivered the exact tone he envisioned. With Dave's vision and Grover's unsurpassed skills, the Friedman Classic Pickup line was born.

  The neck unit is wound to 7.7k, a little lighter than its bridge counterpart. It is four-conductor, so it can be wired for coil splitting, series or parallel operation as well as standard humbucking, and it is hand built in the USA by Grover Jackson in black, zebra or nickel.
specs: |-
  - DC resistance: 7.7k neck, 7.9k bridge
  - Alnico 5 magnets
  - 4 conductor lead wire
  - 80/20 wax potted
  - Custom voiced by Dave Friedman
  - Made in the USA by Grover Jackson
  - Cover colour options: black, zebra, nickel
