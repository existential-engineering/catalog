description: "High-end sound quality for critical listening - AMÁRI is a
  reference-grade AD/DA converter with 24-bit, 384 kHz conversion and signature
  Antelope clocking."
specs: |-
  - AD Conversion: 2x AK5778 chips, 24-bit/384 kHz, 128 dB dynamic range, 124 dB S/N, 112 dB S/(N+D)
  - DA Conversion: 8x CS43198 chips (4 per channel), 24-bit/384 kHz PCM, 138 dB dynamic range
  - Headphone DACs: Dual AK5578 architecture (one per channel), 128 dB dynamic range
  - Sample rates: 32, 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384 kHz
  - Clocking: 4th-generation 64-bit acoustically-focused oscillator technology
  - Headphone output impedance: adjustable -4.6 to 85.3 Ohm in 17 discrete steps
  - Headphone max output power: 1.4 W
  - Headphone outputs: 2x Combo XLR, max 20 dBu, individual volume controls, configurable for balanced pairs
  - Balanced XLR analog input max level: 24 dBu
  - Unbalanced RCA analog input max level: 8.2 dBu / 6 dBv
  - Balanced XLR analog output max level: 24 dBu
  - TRS analog output max level: 18 dBu
  - USB: 3.1 Gen 1 Type-B, up to 384 kHz, bi-directional
  - AES/EBU and S/PDIF: up to 192 kHz
  - TOSLINK: up to 96 kHz
  - Power: DC power inlet with wall-mounted power supply
  - Note: DSD over PCM playback currently unsupported
