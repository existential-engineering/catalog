description: A Textured Echo Deck for Chroma, Mister Focus, & DIYRE Colour. The
  Pulse is a compact echo processing module that recreates the sound of an Otari
  1/4" 2-track echo deck in miniaturized form. Features a saturable input stage,
  selectable insert or send effect configuration, and adjustable echo timing,
  repeats, and mix via trimpots. Combinable with the Pentode module for tube
  echo effects.
details: |-
  The Pulse Colour Module emulates analog tape echo characteristics using a PT2399 delay IC. Input saturation is toggleable via internal jumper, with the C-DRV knob on compatible hosts adjusting saturation intensity. The C-MIX knob blends delayed and dry signals. The frequency response is ear-tuned for optimal mix integration. Compatible with DIYRE Colour, Chroma, Chroma+, Silver Bullet mk2, and Mister Focus platforms. Ships fully assembled, calibrated, and tested.

specs: |-
  - Input saturation (selectable via jumper)
  - Circuit emulates our studio's echo 2-track deck
  - Ear-tuned frequency response
  - Adjustable Echo Time, Repeats, and Mix via internal trimpots
  - Uses PT2399 delay IC
  - Combine with Pentode for a tube echo
  - Compatible with DIYRE Colour
  - Analog plugin compatible with Chroma
  - C-DRV knob on Chroma controls amount of input saturation
  - C-MIX knob on Chroma controls level of delayed signal blended with dry signal
  - Chroma or DIYRE Colour Palette must be purchased separately.
  - Email support@louderthanliftoff.com with any questions
