description: The CTM-15 packs 15 watts of pure valve tone into a compact,
  studio-friendly bass amp head with a built-in load and headphone output for
  silent practice. Powered by a dual EL84 stage, it delivers everything from fat
  cleans to gritty overdrive, with an analogue VU meter for precise output
  monitoring. Its low wattage makes it easy to drive hard for red-blooded
  overdrive without shaking the foundations. With 4/8 ohm speaker outputs,
  rugged construction, and a five-year warranty, the CTM-15 proves big tone can
  come in small packages.
details: |-
  Compact all-valve bass amplifier head with a dual EL84 power stage. Built-in load and headphone output for silent practice, analogue VU meter, passive Bass/Middle/Treble tone stack, and a transformer-derived balanced DI output. Five-year warranty.
specs: |-
  - Power output: 15 watts
  - Power requirements: 240/230/115 volts, 50-60Hz
  - Speaker outputs: 4 and 8 ohms, or internal load (no speaker required), plus headphone out
  - DI output: transformer-derived balanced
  - DI impedance: <600 ohms
  - EQ: passive standard Bass, Middle, Treble tone stack
  - Preamp tube: 1 x ECC83
  - Output tubes: 2 x EL84
  - Dimensions (H x W x D): 150 x 240 x 180 mm
  - Weight: 5.34 kg
