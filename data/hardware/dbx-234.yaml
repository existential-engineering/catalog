name: "234"
manufacturer: dbx
primaryCategory: filter
capabilities:
  - filter
url: https://dbxpro.com/en/products/234
description: Stereo 2/3-Way, Mono 4-Way Crossover with Linkwitz-Riley
  24dB/octave filters and TRS balanced connectors.
details: |-
  The dbx 234 is a precision-engineered crossover featuring robust construction with internally mounted power supply and differentially balanced TRS connectors. Its dual-purpose design supports stereo 2-way/3-way or mono 4-way configurations via back-panel mode selection. The unit employs Linkwitz-Riley 24 dB/octave filters, the professional standard, with individual frequency range controls for each channel and optional ×10 multiplication switches for extended frequency coverage.

  Comprehensive control features include input gain adjustment, a 40 Hz high-pass filter, and individual level controls (±6 dB) on all band outputs. Phase reverse switches on each output enable flexible system configuration without requiring hardware reconfiguration. A mono summing option for the low-frequency subwoofer output optimizes amplifier efficiency.

  The unit delivers professional-grade performance with dynamic range exceeding 114 dB and signal-to-noise ratios above 92 dB across output bands. Its compact 19-inch rack format, 15 W power consumption, and 2-year warranty establish it as a reliable processor for portable and fixed installations.
specs: |-
  - Input Connectors: 1/4" TRS
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+21 dBu
  - CMRR: >40 dB, typically >50 dB at 1 kHz
  - Output Connectors: 1/4" TRS
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >114 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range (Stereo): 45–960 Hz or 450 Hz–9.6 kHz (×10)
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100–120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 4.0 lbs (1.8 kg)
