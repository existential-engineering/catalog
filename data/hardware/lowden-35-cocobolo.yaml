description: A Lowden 35 Series acoustic guitar with Cocobolo back and sides,
  delivering a bold, punchy response from one of the densest members of the
  Dalbergia rosewood family.
details: |-
  Cocobolo, a distinguished member of the Dalbergia family, boasts a density surpassing that of Indian Rosewood and features dramatic grain patterns with vibrant reds and oranges. Paired with any top wood, it delivers a bold, punchy response - making it a true connoisseur's choice.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Cocobolo back and sides can be paired with Sitka Spruce, Alpine Spruce, or Sinker Redwood soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Cocobolo
  - Soundboard options: Sitka Spruce, Alpine Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
