name: Formation Bar
manufacturer: bowers-and-wilkins
primaryCategory: speaker
url: https://www.bowerswilkins.com/en-us/product/sound-bars/formation-bar/150219.html
description: Elegant discreet sound bar. The power and definition to immerse you
  in your favorite movie soundtracks or bring your music to life, with the
  discreet good looks to fit into any home. Formation Bar will put you right at
  the heart of the action.
details: |-
  The Bowers & Wilkins Formation Bar is a discreet sound bar designed to deliver immersive audio for both movie soundtracks and music playback in the home. As part of the Formation wireless ecosystem, it pairs B&W's audio engineering with a slim, low-profile cabinet that fits unobtrusively beneath a television or on a shelf.

  Driving the bar are nine total transducers: three 25mm (1 in) double dome tweeters paired with six 65mm (2.6 in) woven glass fibre cone bass/midrange units. The array is powered by a digital amplifier with Dynamic EQ and tuned by onboard Digital Signal Processing (DSP) to maintain consistent tonal balance across a wide range of listening levels.

  Wireless connectivity covers the major streaming standards: Apple AirPlay 2, Spotify Connect, and Roon Ready are all supported, alongside Bluetooth 4.1 with aptX HD, AAC, and SBC codecs. Wired playback is handled through a Toslink optical digital input, while network access is provided by either RJ45 Ethernet or Wi-Fi. A USB port is present for service use only.

  Physically, the cabinet measures 1240mm wide, 109mm tall, and 107mm deep, with a net weight of 5.5kg. The unit accepts 100V-240V at 50/60Hz and draws less than 6 watts in sleep mode. Dolby Digital decoding is supported for TV audio, and the bar covers a stated frequency response of 40Hz to 28kHz.
specs: |-
  - High-frequency drivers: 3 x 25mm (1 in) double dome tweeters
  - Bass/midrange drivers: 6 x 65mm (2.6 in) woven glass fibre cone
  - Frequency response: 40Hz to 28kHz
  - Amplification: digital amplifier with Dynamic EQ
  - Digital Signal Processing (DSP)
  - Dolby Digital supported
  - Wireless: Apple AirPlay 2, Spotify Connect, Roon Ready
  - Bluetooth 4.1 (aptX HD, AAC, SBC)
  - Network: RJ45 Ethernet or Wi-Fi
  - Digital audio input: Toslink (optical)
  - USB: service only
  - Input voltage: 100V-240V, 50/60Hz
  - Sleep consumption: below 6 watts
  - Height: 109mm (4.3 in)
  - Width: 1240mm (48.8 in)
  - Depth: 107mm (4.2 in)
  - Net weight: 5.5kg (12.1 lb)
  - Finish: Black
