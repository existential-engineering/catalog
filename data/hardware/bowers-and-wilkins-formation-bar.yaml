  discreet good looks to fit into any home. Formation Bar will put you right at
  the heart of the action.
details: |-
  Formation Bar is the sound bar of the Bowers & Wilkins Formation wireless range, sold as an elegant discreet sound bar with the power and definition to immerse you in film soundtracks or bring music to life, in a cabinet discreet enough to fit into any home. The product is a Wireless Soundbar.

  Nine drive units sit behind the grille: three 25mm (1 in) double dome tweeters and six 65mm (2.6 in) woven glass fibre cone bass/midrange units, for a stated frequency response of 40Hz to 28kHz. The information sheet adds that the drivers are derived from the company's loudspeakers and positioned to create a wider soundstage, with a dedicated centre channel for dialogue, and gives the amplifier power output as 6 x 40W.

  The technical feature list is Apple AirPlay 2 technology, Spotify Connect, Roon Ready, Bluetooth In, Dolby Digital, Digital Signal Processing (DSP), a digital amplifier and Dynamic EQ. Bluetooth is v4.1 Class 2 with aptX HD, AAC and SBC codecs, and AirPlay 2 works with iPhone, iPad and iPod touch on iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) on tvOS 11.4 or later, and Mac or PC with iTunes 12.8 or later.

  Wired connections are short and are listed in full in the Connections row: a Toslink digital audio input, a network port given as RJ45 Ethernet or Wi-Fi, and a USB port marked service only. The unit runs on 100V to 240V at 50/60Hz and draws below 6 watts in sleep, which the information sheet attributes to the Formation mesh network's High Network Availability certification.

  The cabinet measures 109mm high, 1240mm wide and 107mm deep and weighs 5.5kg (12.1 lb). Black is the only cabinet finish offered. The product is archived.
specs: |-
  - Description: Wireless Soundbar
  - Drive units: 3 x 25mm (1 in) double dome tweeter, 6 x 65mm (2.6 in) woven glass fibre cone bass/midrange
  - Frequency response: 40Hz to 28kHz
  - Amplifier power output: 6 x 40W (information sheet)
  - Apple AirPlay 2 technology
  - Spotify Connect
  - Roon Ready
  - Bluetooth In
  - Dolby Digital
  - Digital Signal Processing (DSP)
  - Digital Amplifier
  - Dynamic EQ
  - Bluetooth v4.1, Class 2, with aptX HD, AAC and SBC codecs
  - Network: RJ45 Ethernet or Wi-Fi
  - Connections: digital audio in (Toslink), network (RJ45 Ethernet or WiFi), USB service only
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: below 6 Watts (sleep)
  - Dimensions: 109mm (4.3 in) height x 1240mm (48.8 in) width x 107mm (4.2 in) depth
  - Net weight: 5.5kg (12.1 lb)
  - Cabinet finishes: Black
