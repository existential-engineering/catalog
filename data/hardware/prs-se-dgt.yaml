details: |-
  “I didn’t just rubber stamp this. This guitar is something I have been very involved in and amreally proud of. The SE Series is lightyears ahead of anything I could get my hands on whenI started playing - it’s amazing how far the quality has come – and I am proud to be able tooffer this guitar to more people.” - David Grissom

  The PRS SE DGT (David Grissom Trem) brings David Grissom’s signature model to theSE Series for the first time. Based on the McCarty platform, the DGT model has been aconstant favorite since its introduction in 2007, thanks to Grissom’s deep knowledge ofvintage guitars and his painstaking attention to detail. Every feature on the SE DGT hasbeen considered from the neck shape to the fret choice and dressing, from the colors tothe pickups and electronics layout.

  The SE DGT features vintage-voiced humbuckers paired with individual volume controlsfor each pickup and a push/pull master tone control that taps the humbuckers for sweet,single-coil inspired sounds. This layout puts a lot of control and versatility on tap so youcan focus on playing and not the guitar. Additional appointments include a maple top,mahogany back, 22-fret, 25” scale length mahogany neck with rosewood fretboard, andbird or moon inlays (inlays are color dependent).
specs: |-
  - Body Construction: Solidbody
  - Top Wood: Maple
  - Veneer: Flame Maple
  - Back Wood: Mahogany
  - Top Carve: Shallow Violin
  - Number of Frets: 22
  - Neck Wood: Mahogany
  - Neck Construction: Multi-Ply
  - Truss Rod: PRS Double-Acting
  - Neck Shape: DGT
  - Fretboard Wood: Rosewood
  - Fretboard Inlay: Moons or Birds (finish dependent)
  - Bridge: PRS Patented Tremolo
  - Tuners: PRS Designed Tuners
  - Hardware Type: Nickel
  - Nut: PRS
  - Gig Bag: Controls
  - McCarty Tobacco Sunburst (bird inlays only): Gold Top (moon inlays only)
