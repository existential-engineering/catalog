description: A delay with a memory that stores everything you play in a
  60-second digital tape reel, letting you scan back through your history to
  revisit and reuse sounds from the past.
details: |-
  Habit functions as a musical sketchpad and compositional delay tool built around a 60-second digital tape reel that continuously records all incoming audio. Users can scan back through this history at any moment to play echoes from the past, either instead of or alongside present sounds. This architecture enables unconventional delay effects, loop generation, and the ability to capture entire compositions within the pedal itself.

  The pedal introduces a collecting workflow similar to a free-form sampler. Users can build loops by navigating memory and combining various moments, set overdub mode for long-form song creation, or use Feed mode to record live effects processing and knob changes.

  Two secondary echo modes allow simultaneous playback of past and present moments, creating multi-tap delay capabilities or intentional layering effects. The Scan control enables free navigation through memory or automated scanning through the recorded buffer.

  Habit features interconnected machinery for designing rhythms and patterns, with two banks of modifiers for shaping echoes. Additional features include internal modulation via ramping, two onboard presets, and full MIDI, CV, and expression control integration.
specs: |-
  - Delay time: up to 60 seconds
  - Mono input/output with analog dry thru
  - Buffered bypass
  - Power: 9VDC center negative, ~150mA
  - Tap tempo with external tap input
  - 2 onboard presets
  - Internal modulation (ramping)
  - MIDI control (PC, CC, Clock)
  - CV and expression control
