details: |-
  The Monument returns in a smaller form factor with new features, like assignable expression control and rate ramp up. Changes to the V2 are as follows: • Converted to smaller enclosure • Expanded capability of side jack: now supports external tempo or can function as expression control over Rate, Depth, Shape, or Tap Multiplier and is assignable on the fly. See manual for details. • Improved tremolo response across all rates. • Top mounted jacks. Inspired by the beautifully jagged, red-sand desert landscape of Monument Valley, the Monument Tremolo is both a harmonic, and standard tremolo that produces a rich, luscious, warm pulsating modulation capable of peaks and valleys as smooth or as jagged as the real ones that our dear mother nature created long ago. With different combinations of the rate, division and shape knobs and tap tempo, everything from traditional tremolo to inspiring unique waveforms will help you carve new paths that you won’t hear anywhere else. Harken back to vintage tones inspired by Fender Brownface amps in Harmonic mode. A low-pass and high-pass version of your guitar signal is modulated opposite of each other, or 180º out of phase (high and low frequencies rise and fall opposite of each other). The result is a warm, almost “chewy” tremolo. The Division knob can be set to quarter, triplet, eighth and sixteenth. Wave shapes can be controlled via the Shape knob. You can move between Sine, Square, Ramp, Lumps and Monument Mode (random). A special feature on the Monument is the bypass switch also has a momentary function. When the switch is in off position, press and hold to temporarily activate the effect to add a moment of texture. Releasing the switch turns the effect off. When the pedal is on, press and hold the bypass switch to ramp up the tremolo rate. Release the switch and the rate will ramp down to previously set tempo. Setting the depth knob at 0 and the volume knob above unity creates a clean boost.
