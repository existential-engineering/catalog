description: A modified ODL-1-CS that keeps the original sound and adds a
  CH.CONT channel control terminal, so the NORMAL and DRIVE channels can be
  switched from an external latch-type switch or an ARC series control terminal.
details: |-
  The ODL-1A-CS is a modified version of the ODL-1-CS that maintains its original sound while adding a channel control terminal, so a player can switch between the NORMAL and DRIVE channels with an external switch. Laser processing is applied to a die-cast case finished with hammertone paint, which creates a subtly different textured pattern on every unit and a finish that is both strong and durable.

  OVERDRIVELAND was born to be as lustrous and distinctive as the elusive DUMBLE amplifiers that are now hard to come by. Free The Tone's founder and designer, Yuki Hayashi, spent more than twenty years maintaining and repairing those amplifiers and owned several himself, and capturing their harmonics and their response to a player's hands in a pedal-sized overdrive is what started the development. The Normal channel uses no clipping diodes and no LEDs, because they made the intended harmonic components hard to achieve, and the Custom Shop build uses custom modules with different components from the standard version in order to respond more sensitively to input signals.

  The pedal is two sections. The Normal channel circuit holds the TONE circuit with its EQ ON/GLASS switch and the gain shaping of the ROCK/JAZZ switch. EQ ON activates the TONE circuit, while GLASS bypasses it for a glassy tone reminiscent of a Blackface Fender Vibroverb with the Bright switch engaged. ROCK raises gain while slightly reducing it in the low range so the amplifier's input stage is not overdriven by excessive low end; JAZZ lowers overall gain and brings out richness in the low frequencies. Selecting the Drive channel places the Drive circuit, with its HI-CUT filter and PUSH control, in front of the Normal channel, and NOR LEVEL and DRV LEVEL set each channel's volume independently.

  Connecting an ARC series control terminal or a latch-type footswitch to the CH.CONT terminal switches NORMAL and DRIVE without pressing the unit's own footswitch. While a plug is inserted into CH.CONT, channel switching from the unit's footswitch is disabled.

  The voltage supplied to the audio circuit is adjustable smoothly from DC10V to 19V, and changing it moves the clipping point for dramatic variations in the drive sound. The ODL-1A-CS cannot be operated on batteries because of its high current consumption, so it must be run from an AC adapter connected to the DC9V input terminal, with a stabilized DC9V output and centre-negative polarity. Current consumption is 120 mA at DC9V, but a large inrush current flows at power-on, so the adapter should be able to supply 200 mA or more.
specs: |-
  - Input impedance: 500 kOhm or higher
  - Output load impedance: 10 kOhm or higher
  - Controls: NOR LEVEL, DRV LEVEL, TONE, GAIN, PUSH, HI CUT, DRIVE, EQ ON/GLASS switch, ROCK/JAZZ switch, DC9V/VARIABLE switching switch, voltage adjustment trim
  - Connectors: 1/4-inch standard phone jacks (input, output, CH.CONT), DC9V input jack (AC adapter jack)
  - CH.CONT terminal accepts an ARC series control terminal or a latch-type footswitch for NORMAL/DRIVE channel switching; with a plug inserted, the unit's own footswitch no longer switches channels
  - Power supply: AC adapter only, stabilized DC9V with centre-negative polarity; battery operation is not possible
  - Current consumption: DC9V 120 mA (use an adapter able to supply 200 mA or more, because a large inrush current flows at power-on)
  - Internal boost supply continuously adjustable from DC10V to DC19V
  - Custom modules with different components from the standard version, for more sensitive response to input signals
  - Die-cast case finished with hammertone paint and laser-processed lettering
  - HTS (Holistic Tonal Solution) circuit, output in phase with the input
  - Size: 97D x 123W x 51H mm (including protrusions like footswitches and jacks)
  - Weight: approx. 420 g
  - Accessories: warranty card, website access card, safety precaution, 4x rubber feet
