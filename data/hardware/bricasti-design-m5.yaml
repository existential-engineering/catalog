id: OlkRQaX3Z7DFVZJUo5-S8
name: M5 Network Player
manufacturer: bricasti-design
primaryCategory: outboard
categories:
  - rack-mount
url: https://bricasti.com/en/consumer/m5.php
description: The Bricasti M5 is a dedicated network media renderer that connects
  via wired Ethernet to deliver lossless audio to digital-to-analog converters,
  supporting DLNA and Roon Ready protocols with PCM up to 192kHz and DSD.
specs: |-
  - Network streaming: DLNA, Roon Ready
  - PCM support: up to 192kHz
  - DSD support: native
  - Digital outputs: XLR AES/EBU, RCA S/PDIF, BNC S/PDIF, USB-A
  - Ethernet input for network connectivity
  - Trigger in/out via barrel connector
