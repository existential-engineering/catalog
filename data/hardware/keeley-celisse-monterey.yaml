description: Monterey Celisse Artist Series Edition Vintage Voiced Fuzz Octave
  Up/Down Rotary Vibe Harmonic Wah
details: |-
  The Monterey Celisse Artist Series Edition is an Artist Series finish on the Monterey workstation, with an illustration by Lia Sued C. reproduced with Keeley's UV printers over a deep purple sparkle powder coated enclosure and an Artist Series bottom print. A portion of Artist Series sales went to the associated artist, and this second run shipped in June 2021.

  The Monterey is a two-channel neo-vintage effects pedal that can be configured for five sounds. The right footswitch activates the fuzz channel, a two-transistor fuzz built around vintage Fairchild silicon transistors, chosen for moderate gain and for avoiding the temperature sensitivity of germanium devices. It is voiced to stay responsive and dynamic across pickup positions.

  The modulation channel covers three voices, each able to add an octave. An Octave control is centre-detented for no octave, clockwise for octave up and counter-clockwise for octave down. The Kool Vibe setting combines phasing and tremolo at key frequencies and simulates the pulsing of a photocell-based effect. The Les Rotary setting simulates a rotary cabinet, joining the lower drum and upper horn with short reverberated reflections and a Doppler-based chorused voice, and in that mode the Octave control sets horn volume rather than producing an octave.

  The Harmonic Wah section is a fixed or cocked wah with the Depth control off, an auto wah that follows pick attack as the Depth control is raised, and a harmonic wah past the centre position. With an expression pedal connected it becomes a conventional foot-controlled wah, and the expression input otherwise controls the rate of the Les Rotary and Kool Vibe settings or the frequencies of the Harmonic Wah. A DIP switch under the base plate reverses the order of the fuzz and modulation sections. The unit is hand built, is not battery powered and ships in one of twelve randomly assigned graphic designs on the standard model.
specs: |-
  - Two channels, configurable for five sounds
  - Fuzz channel built on vintage Fairchild silicon transistors
  - Modulation voices: Kool Vibe, Les Rotary cabinet simulation, Harmonic Wah
  - Octave control for octave up, octave down or no octave
  - Expression input controls rate, wah frequency or acts as a wah pedal
  - Internal DIP switch reverses fuzz and modulation order
  - Requires a 9V 100mA supply, negative tip, no battery option
  - Expression pedal not included
  - Hand built
  - Artist Series finish: deep purple sparkle powder coat, UV-printed art by Lia Sued C.
