description: Center-channel loudspeaker from Bowers & Wilkins' flagship 800
  Series Diamond range, designed to partner with the more compact 803 D4 or 804
  D4 in reference home theater systems. Combines a Diamond dome tweeter,
  Continuum cone FST midrange, and twin Aerofoil bass cones in a Matrix-braced
  cabinet.
details: |-
  The HTM82 D4 is the smaller of the two center-channel speakers in Bowers & Wilkins' 800 Series Diamond range, positioned as the dedicated center for theater systems built around the 803 D4 or 804 D4 floor-standers. It carries the same core driver and cabinet technologies as the rest of the 800 Series, scaled into a horizontal cabinet optimized for under- or above-screen placement.

  A 25mm Diamond dome tweeter is mounted in a Solid body Tweeter-on-Top housing, decoupling it from the main cabinet and extending high-frequency response cleanly to 35kHz. A 130mm Continuum cone FST midrange with Biomimetic Suspension handles the dialogue band, isolated mechanically from the bass enclosure for low coloration and tight imaging.

  Bass is produced by twin 165mm Aerofoil cone drivers with Anti-Resonance Plugs, loaded by a Flowport-tuned, Matrix-braced cabinet. Reverse Wrap cabinet construction is shared with the rest of the 800 Series D4 line, supporting the structural rigidity that the family is known for.

  Electrically the HTM82 D4 presents a nominal 8Ω load (minimum 3.0Ω) with 89dB sensitivity, and is rated for amplifiers between 50W and 200W into 8Ω. Frequency response is quoted as 45Hz-28kHz (±3dB) with usable extension from 33Hz to 35kHz.
specs: |-
  - Type: 3-way vented-box center-channel loudspeaker
  - Tweeter: 1x 25mm (1 in) Diamond dome, Solid body Tweeter-on-Top
  - Midrange: 1x 130mm (5 in) Continuum cone FST with Biomimetic Suspension
  - Bass: 2x 165mm (6.5 in) Aerofoil cone with Anti-Resonance Plugs
  - Frequency range: 33Hz - 35kHz
  - Frequency response: 45Hz - 28kHz (±3dB)
  - Sensitivity: 89dB (on-axis at 2.83V at 1m)
  - Harmonic distortion: <1% (100Hz-20kHz), <0.3% (100Hz-20kHz)
  - Nominal impedance: 8Ω (minimum 3.0Ω)
  - Recommended amplifier power: 50W - 200W into 8Ω
  - Maximum recommended cable impedance: 0.1Ω
  - Cabinet bracing: Matrix internal bracing
  - Bass loading: Flowport
  - Cabinet construction: Reverse Wrap
  - Finishes: Gloss Black, White
  - Grille options: Black or grey
  - Height: 289mm (11.4 in)
  - Width: 715mm (28.1 in)
  - Depth: 369mm (14.5 in)
  - Net weight: 25.15kg (55.4 lbs)
