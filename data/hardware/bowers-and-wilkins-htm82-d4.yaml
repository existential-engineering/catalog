  more compact midrange drive unit is ideally sized to match those of its
  siblings.
details: |-
  The HTM82 D4 is the more compact of the two 800 Series Diamond center-channel loudspeakers, intended for theater systems built around the 803 D4 or 804 D4. It is a 3-way vented-box passive design driven from an external amplifier, with a recommended amplifier power of 50W to 200W into 8 ohms and no mains connection of its own.

  Bowers & Wilkins presents it as the most compact center-channel speaker in the range while sharing the design DNA of its larger siblings, including the Reverse Wrap cabinet and Matrix bracing. The company says the combination of the two makes for a quieter, more acoustically efficient and better-sounding speaker.

  Instead of a conventional loudspeaker box, the Reverse Wrap cabinet is made from a continuous curved section of wood with the drive units mounted at the heart of the curvature. The stiffer, more inert structure is described as resisting mechanical resonances better and improving dispersion of sound.

  The midrange uses three Bowers & Wilkins technologies together: the Continuum cone, Biomimetic Suspension and midrange decoupling, the last of which minimises interference from the operation of the bass drivers. The Continuum cone was introduced in 2015 and is credited with exceptionally low noise and resolution free of coloration or masking.

  The cabinet measures 289mm (11.4in) high, 715mm (28.1in) wide and 369mm (14.5in) deep, and weighs 25.15kg (55.4lb). Cabinet finishes are Gloss Black and White with Black or Grey grilles. A stand is not included; the manual recommends the FS-HTM D4 adjustable center speaker stand, which allows 4 or 8 degrees of tilt.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond tweeter, Solid body Tweeter-on-Top, Continuum cone FST, Matrix, Anti-Resonance plug, Biomimetic Suspension, Aerofoil cone bass units, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 130mm (5in) Continuum cone FST midrange, 2x 165mm (6.5in) Aerofoil cone bass units
  - Frequency range: 33Hz to 35kHz
  - Frequency response: 45Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 89dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 100Hz to 20kHz, less than 0.4% 100Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 200W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Speaker terminals: two pairs at the back of the speaker for bi-wiring, link wires supplied for single-wire connection
  - Terminal cable acceptance: 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm (5/32in) diameter
  - Dimensions: Height 289mm (11.4in), Width 715mm (28.1in), Depth 369mm (14.5in)
  - Net weight: 25.15kg (55.4lb)
  - Cabinet finishes: Gloss Black, White
  - Grille finishes: Black, Grey
  - In the carton: 1 midrange grille, 2 bass grilles, 2 terminal link wires, 4 self-adhesive plastic pads, 2 two-part foam plugs, 1 cleaning cloth
