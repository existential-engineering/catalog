name: G Five Active Speaker
manufacturer: genelec
primaryCategory: speaker
url: https://www.genelec.com/g-five
description: "The largest model in the G Series, the flagship G Five has both
  the power and physical dimensions to produce pure, uncoloured audio at higher
  listening levels and in larger spaces."
details: |-
  The G Five is the flagship of Genelec's G Series of active home audio speakers, designed to bring the company's professional monitoring DNA into music, movie, TV and gaming listening environments. As the largest model in the line, it pairs generous output capability with a physical footprint sized for medium to larger rooms, while preserving the neutral, uncoloured tonal character that defines the Genelec sound.

  Acoustically, the G Five is a two-way active design built around a 205 mm bass cone and a 25 mm metal-dome tweeter, each driven by its own dedicated internal amplifier (150 W Class AB for the bass driver and 120 W Class AB for the treble driver) through an active crossover. Frequency response is specified as 38 Hz to 20 kHz within plus or minus 2.5 dB, with low and high -6 dB cutoffs at 32 Hz and 25 kHz respectively, and short-term and long-term maximum SPL ratings of at least 110 dB and 101 dB.

  The cabinet draws on Genelec's professional monitor technologies: a Minimum Diffraction Enclosure (MDE) reduces edge diffraction, an integrated Directivity Control Waveguide (DCW) shapes the radiation pattern for consistent off-axis response, and a reflex port extends low-frequency reach. The included Iso-Pod stand decouples the speaker from its supporting surface and provides tilt adjustment, while versatile mounting options accommodate stands, walls and ceilings.

  Room-adaptation switches on the rear panel let the user tailor low-frequency behaviour for placement against walls, in corners or on stands, so the G Five can be balanced to its acoustic environment without external processing. Intelligent Signal Sensing (ISS) automatically drops the speaker into a low-power standby state when no audio has been present for a period and wakes it instantly when signal returns, supporting energy regulations and reducing idle consumption.

  Connectivity is intentionally simple and analog: the G Five accepts a balanced XLR input and an unbalanced RCA input, both at 10 kOhm, allowing direct connection to a wide variety of sources from preamps and AV receivers to consumer playback gear. Protection circuitry guards the drivers and amplifiers under demanding use. The speaker is offered in two cabinet finishes: G5AWM (White) and G5AMM (Black).
specs: |-
  - Configuration: Active 2-way speaker
  - Frequency response: 38 Hz - 20 kHz (+/- 2.5 dB)
  - Low cutoff (-6 dB): 32 Hz
  - High cutoff (-6 dB): 25 kHz
  - Short term max SPL: >=110 dB
  - Long term max SPL: >=101 dB
  - Harmonic distortion: <=2% (50-100 Hz), <=0.5% (>100 Hz)
  - Bass driver: 205 mm cone
  - Treble driver: 25 mm metal dome
  - Bass amplifier: 150 W Class AB
  - Treble amplifier: 120 W Class AB
  - Analog input (XLR): 10 kOhm, balanced
  - Analog input (RCA): 10 kOhm, unbalanced
  - Height: 433 mm (452 mm with Iso-Pod)
  - Width: 286 mm
  - Depth: 278 mm
  - Weight: 14.4 kg (31.7 lb)
  - Package contents: 1x G Five speaker, 1x mains cable (1.8 m), 1x operating manual, 1x IsoPod kit
