description: >-
  The Casio HZ-600 is a bitimbral hybrid synthesizer from 1987 featuring Casio's Spectrum Dynamic
  synthesis with 32 time-evolving digital waveforms, dual analog voltage-controlled filters, and
  8-voice polyphony across a 61-key keyboard.
details: |-
  Released in 1987, the HZ-600 was the first instrument in Casio's Spectrum Dynamic synthesizer
  line, preceding the home keyboard variants HT-3000 and HT-700 as well as the preset-only
  MT-600. Its Spectrum Dynamic engine generates 32 digital waveforms that evolve over time,
  processed through genuine analog voltage-controlled lowpass filters for a hybrid character that
  bridges digital precision with analog warmth.

  The bitimbral architecture allows two independent layers, each with its own 4-pole lowpass VCF
  with ADSR envelope and a DCA with ADSR shaping. The upper section offers 20 preset and 20
  user-editable tones with 32 waveforms, while the lower section provides 10 preset and 10 user
  tones with 16 waveforms. An optional RA-100 memory card expands storage to 120 upper and 60
  lower tones. One LFO with five available waveforms handles modulation duties.

  Programming is handled via two switches (Parameter/Value) and an Alpha-Dial wheel, with all
  parameters displayed on the front panel for easy visual reference. The 61-key keyboard lacks
  velocity and aftertouch sensitivity, and the pitch bend wheel offers adjustable range of 2, 3,
  or 5 semitones. Three chorus presets and transposition capability round out the feature set.
  MIDI In/Out/Thru connectivity is included, though the implementation is basic.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: Bitimbral (2 parts)
  - Synthesis: Spectrum Dynamic (digital waveforms + analog filters)
  - Oscillators: 1 digital per voice
  - Waveforms: 32 (upper section) / 16 (lower section)
  - Filter: 2 VCF (4-pole lowpass, ADSR envelope)
  - LFO: 1 with 5 waveforms
  - VCA: 1 DCA with ADSR
  - Effects: Chorus (3 modes)
  - Memory: 20 preset + 20 user upper / 10 preset + 10 user lower (expandable via RA-100 card)
  - Keyboard: 61 keys, no velocity or aftertouch
  - Controls: 2 wheels (pitch bend, modulation), 2 volume sliders, Alpha-Dial
  - Pitch bend range: 2, 3, or 5 semitones
  - Transposition: +6/-5 semitones
  - Outputs: Stereo main, headphone
  - Inputs: Volume pedal, sustain pedal
  - MIDI: In/Out/Thru
  - Power: DC 9V adapter or 6 D-size batteries
