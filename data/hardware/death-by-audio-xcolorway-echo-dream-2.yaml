description: A modulating delay pedal with fuzz and chorus-like modulation of
  the delayed signal, used for everything from subtle echoes to heavily
  distorted feedback textures.
details: |-
  LUSH MODULATING ECHO A powerful, ethereal, and nuanced delay pedal with otherworldly controls. Push the feedback for vast worlds of colorful sound. Introduce a bit of warble with the modulator for ghastly chorus tones, or a ton of it to absolutely warp the delayed signal. Once your delay is thoroughly contorted, turn up the fuzz and pulverize it into repeating, shattered pieces. This is the preferred echo for recording engineers and touring pros around the world because, simply put, it just sounds that good. From delicate, beautiful sounds to yawning voids of fuzz and feedback, the Echo Dream 2 is ready to transform anything you throw at it. Controls Master Controls MASTER Controls the output volume of the effect. FUZZ Sets the amount of gain, from clean to fuzzed-out bliss. This gain is after the echo and will make both the clean and the echoes distorted when cranked up. DELAY Sets the volume of the delayed signal. Echo Controls D TIME Controls the delay time (numbers shown in milliseconds) between 20 ms and 1 second. Long delay times can create flutter, noise, and distortion. FBACK Controls the feedback of the delays, from slapback to wild runaway oscillation. DRY TOGGLE UP Allows the dry signal through DOWN Kills the dry signal (only the repeats will be heard) Modulation Controls SPEED Controls how fast the modulating oscillator runs. DEPTH Sets how for the modulator will swing the delay time. At high intervals, the pitch of the repeats will shift very far! SHAPE TOGGLE UP Smoother, sine-like modulator waveform DOWN Sharp, square-shaped modulator waveform Specifications Power Details Power Supply: 9V, 12V, or 18V VDC supply with 2.1mm negative center barrel (many non-9V supplies will vary their polarities so double check!) Current Draw: 40 mA Physical Details Dimensions: 5.87" x 4.72" x 2.35" (including hardware) Weight: 21 oz. Sound Samples Strat Bending Echoes Chorus-y Delay Bending Chaos Drunken Stumble Puzzled Twitch Twisted Plucks Torn Asunder Evil Twin Jazz Bass Thumping Chorus Memories Delay Bendy Fuzz Unholy Descent Just Fuzz! All Over Echo Riff Synth Lo-Fi Plucks Plunk Wiggle Big Bends Huge Vibrato
