description: Volume pedal built around Free The Tone's Full-Rotation Belt-Drive
  system, which uses a gear and belt rather than a string to drive the variable
  resistor and links pedal travel directly to volume change. The DVL-1H is the
  high impedance model, for use after a high impedance device such as a passive
  pickup, a fuzz pedal or a vintage effects unit.
details: |-
  An ideal volume pedal needs sound quality and durability, and it also needs a volume change that is smooth and musical. The Full-Rotation Belt-Drive system in the DVL-1 series was developed by identifying the problems in conventional volume pedals that stand in the way of that.

  Where the usual mechanism turns a variable resistor with a string, Free The Tone's system uses a gear and belt to drive the resistor linearly, so pedal travel is linked directly to volume change. The result is smooth rotation on an optimised volume curve, and the belt is reinforced with wires so it resists elongation or breakage from heavy use and age.

  Passive volume pedals commonly have a second problem: pressing the pedal fully toe-down does not take the variable resistor all the way to its clockwise end, because part of the rotation range is unusable, so the signal level can drop when the pedal is inserted even after device impedances are matched. The Full-Rotation Belt-Drive system is designed so the resistor rotates fully from minimum to maximum and that loss does not occur.

  Carefully selected high quality parts sit in the signal path to keep the tonal impact minimal. The pedal section of the enclosure is a 5 mm thick aluminium plate and the body is an aluminium and steel compound chassis, robust enough to resist deformation over long use. The series took more than two years to develop.

  Two impedance models are offered. The DVL-1H is the high impedance unit, to be placed after a high impedance source such as a guitar or bass with passive pickups, a fuzz pedal or a vintage effects unit. The DVL-1L is the low impedance unit, for use after a low impedance source such as an instrument with active pickups, a wireless receiver or an effects unit. The hole in the side panel is an adjustment point used during manufacturing and nothing should be inserted into it.
specs: |-
  - Variable resistor: DVL-1H 500 kohm (DVL-1L 50 kohm)
  - Terminals: 3 x standard 1/4-inch phone jacks (input, output, tuner out)
  - Passive design, the specifications list no power input and no battery
  - Full-Rotation Belt-Drive system, variable resistor driven by belt and gear
  - Full variable resistor travel, no unusable rotation range
  - Belt reinforced with metal wires against loosening and breakage
  - Pedal section 5 mm thick aluminium plate, body an aluminium and steel compound chassis
  - Dimensions: 90 (W) x 246 (D) x 60 (H) mm (excluding rubber foot height)
  - Weight: 1.15 kg
  - Accessories: rubber feet, warranty card, Web Access Card
  - Patent pending
