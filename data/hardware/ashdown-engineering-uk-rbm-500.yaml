description: UK-built, Ice Blue lightweight 500-watt bass head crafted for
  players who want punchy performance in a highly portable format. Equipped with
  Sub-Harmonic Generator, smooth Compression, expressive Valve-Emulated
  Overdrive, an FX Loop, and both DI and Ashdown's Analogue Cab Sim DI outputs,
  it delivers refined tone-shaping options for stage, studio, and silent
  practice through its dedicated Headphone Out.
details: |-
  The Ashdown UK-RBM-500 (Rootmaster Bass Magnifier) channels the essence of the Rootmaster philosophy into a UK-built amplifier finished in striking Ice Blue. Inspired by the RM-500-EVO III, this lightweight 500-watt head delivers confident, articulate bass tone in a compact, portable format. Its Sub-Harmonic Generator introduces a rich octave-below layer that adds depth and authority, the onboard Compressor provides smooth dynamic control, and Ashdown's valve-emulated Overdrive circuit ranges from gentle warmth to assertive growl. An FX Loop integrates external pedals, while both a standard DI output and an Analogue Cab Sim DI serve recording and front-of-house use. A dedicated Headphone Out doubles the amp as a silent practice solution.
specs: |-
  - Power output: 500 Watts
  - Power requirements: 115-230 Volts
  - Impedance: minimum 4 Ohms
  - Speaker outputs: 2 x Neutrik Speakon/Jack outputs
  - Frequency response: -3dB @ 17Hz and 30kHz
  - Signal to noise: better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 340Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Distortion: less than 0.5% THD
  - H x W x D: 89 x 311 x 235 mm
  - Net weight: 2.5 kg
