details: |-
  Explosive power. A kiloton is a unit of explosive power equivalent to 1,000 tons of TNT.

  What happens when you pack Leo Fender's potent Magnetic Field Design bass humbucker into the sleek shape of his SB•2? The G&L Kiloton 5: explosive power that is easy to handle.

  Kiloton 5's silhouette is the most comfortable bass body ever created by Leo. It is compact and pure, with every curve and contour perfectly executed. And it carries more firepower than ever, with Leo's G&L Magnetic Field Design humbucker placed right in the sweet spot he specified back when the sign over the door still read CLF Research.

  The Fullerton Deluxe Kiloton 5's single MFD humbucker fires without the aid of a preamp, while a 3-position series, split and parallel toggle harnesses the coils' power. Simple volume and tone controls are devastatingly effective, revealing a wide range of textures Leo's MFD humbucker is famous for. What is more, Kiloton 5 is armed with a 6-bolt neck and Leo Fender-designed Saddle-Lock bridge to transfer all the energy right into the body end-grain for an incredibly resonant instrument.

  Made in Leo Fender's historic G&L facility on Fender Avenue in Fullerton, California, the Kiloton 5 is available with a wide range of custom options including body and neck woods, body and neck finishes, neck profiles and pickguard materials.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickup: Leo Fender-designed G&L MFD humbucker
  - Electronics: 3-way series/split/parallel mini toggle, volume, tone
  - Body wood: Swamp Ash
  - Neck wood: Natural Satin Hard-Rock Maple with Maple fingerboard
  - Neck profile: G&L 1.750" nut width Modern C5 with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Includes: G&L Deluxe Gig Bag
  - Available in: Blueburst over Swamp Ash, 3-ply pearl pickguard, Maple fingerboard
