description: >-
  The Voyetra 8 is an 8-voice polyphonic analog synthesizer produced by Octave Plateau
  from 1983 to 1986. It features an unconventional two-piece design consisting of a
  61-note velocity- and aftertouch-sensitive remote keyboard (VPK-5) and a separate
  synthesis module. Notable users included New Order, Depeche Mode, Eurythmics, and
  producer Trevor Horn.
details: |-
  The Voyetra 8 represents an innovative departure from conventional synthesizer design, splitting the instrument into two separate components: the VPK-5 remote keyboard and the main synthesis module. This architecture allowed for flexible studio and stage setups, with the keyboard able to be positioned independently from the sound engine.

  The synthesizer prioritizes hands-on interaction with dedicated front-panel controls for essential parameters like cutoff frequency, attack time, LFO rate, and detuning. Deeper programming and modulation routing are handled through a computer-style interface, giving experienced users access to a sophisticated sound design environment. Each of the eight voices features two VCOs with sawtooth, sine, square, and pulse width waveforms, routed through a 24 dB/octave resonant low-pass filter.

  Though the Voyetra 8 never achieved widespread commercial success, it earned a devoted following among professional musicians who valued its distinctive sonic character. Its combination of a ring modulator, dual flexible LFOs, and a built-in 1700-note sequencer made it a powerful tool for creating complex, evolving sounds.
specs: |-
  - 8-voice polyphony
  - 2 VCOs per voice (sawtooth, sine, square, pulse width)
  - 2 flexible routable LFOs
  - 24 dB/octave low-pass resonant filter with ADSR envelope
  - 2 ADSR VCA envelopes
  - Ring modulator
  - 1700-note sequencer
  - Basic arpeggiator
  - 100 patch storage locations
  - 61-note remote keyboard (VPK-5) with velocity and aftertouch
  - V-bus control (MIDI available on later models via XLR connectors)
