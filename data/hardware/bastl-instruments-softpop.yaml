description: A semi-modular, fully analog light and sound synthesizer built
  around a strongly feedbacked system of dual triangle-core oscillators, a
  state-variable filter, and sample and hold. Six faders control the
  cross-modulation network, and a 25-point patchbay with three external jacks
  enables deep signal-path reconfiguration. Expressions range from chaotic pops
  and alien drones to heavy subtractive basslines.
details: |-
  The softPop is a playfully organic semi-modular synthesizer built around a feedbacked analog core. Two wide-range triangle-core VCOs (VCO 0 and VCO 1) are routed through a state-variable VCF capable of bandpass, lowpass, and highpass modes with infinite resonance. A track-and-hold circuit introduces stepped, sample-and-hold-style modulations, and a looping pattern generator stores two patterns (P1 and P2) for autonomous sequencing.

  Six faders govern the cross-modulation relationships between the VCOs and VCF, giving the player immediate tactile control over the feedback network. VCO 0 includes a quantizer for auto-tuning to musical scales. VCO 1 offers variable waveshape via modulation routing.

  The 25-point mini patchbay is the heart of the instrument, allowing extensive reconfiguration of the internal signal flow. Three external jacks (A, B, C) bridge the patchbay to the outside world for sending and receiving signals. An external audio input with adjustable gain feeds into an envelope follower, enabling audio-rate modulation and synchronization from external sources.

  A built-in speaker allows standalone use. The rear panel houses a secret modification chamber for DIY hardware exploration. Enclosure is anodized aluminum. Optional wooden handle backplate available. Power: 4× AA batteries, Micro USB, or external 7–9 VDC adapter.
