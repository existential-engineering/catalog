description: The Vintage Overdrive is a 100% analog overdrive and boost with
  smooth attack, singing sustain and gentle compression, built on an all-new
  circuit that offers more gain and output than the classic it is inspired by.
details: |-
  With its smooth, round attack, sweet singing sustain and gentle compression,
  the Vintage Overdrive delivers all the screaming overdrive players know and
  love, expanding on the classic with an all-new, unique circuit that offers more
  gain and output than the original.

  These are premium builds using exclusively high-quality, low-noise components
  and mechanical true-bypass switching, for exceptional tone, drive and loads of
  available output. A genuine TI 4558 opamp and a classic 3-knob layout keep the
  feel familiar.

  Housed in a CNC-milled genuine Hammond Manufacturing enclosure and handmade in
  Portland, Oregon, these pedals are built to last, with an easy-to-see LED
  indicator behind a diffusion lens. A Jack Deville original design, sold with
  all-sales-final terms.
specs: |-
  - Sweet, creamy 100%-analog overdrive and boost
  - Classic 3-knob layout
  - Loads of output on tap
  - Genuine TI 4558 opamp
  - CNC-milled genuine Hammond enclosure
  - EZ-2-C LED indicator with diffusion lens
  - Made in U.S.A.
  - Input Impedance: ~470KΩ
  - Output Impedance: <25KΩ
  - True-Bypass
  - Compact footprint (2.4" x 4.5" x 1.8")
  - 9VDC 2.1mm negative center-pin power (>100mA regulated supply recommended) or internal 9V battery (not included)
  - ~5mA Current Draw @ 9VDC
