description: 'The URLA combines a CMOS fuzz with a synth-based dual resonant filter, an aggressive and experimental pedal named after the Italian verb meaning "scream".'
details: |-
  The URLA, named after the Italian verb meaning "scream" in the second person imperative, is a powerful and innovative effects pedal that combines two distinct effects in one unit. This aggressive and experimental device features a CMOS fuzz followed by a synth-based dual resonant filter, offering musicians a unique and versatile tool for sonic exploration.

  Unlike traditional transistor-based fuzz circuits, the CMOS fuzz in the URLA operates on digital logic, producing a square wave output regardless of input. This results in an overdriven, brutal, and glitchy sound with a distinctive gated quality.

  The second stage of the URLA is a faithful replica of the analog filter section from the legendary Korg MS-20 synthesizer. This dual filter consists of a high-pass and low-pass filter connected in series, each with its own controls.

  To fully unlock the URLA's potential, an expression pedal input is provided. This feature allows real-time control of either the high-pass or low-pass filter cutoff, depending on the position of the EXP toggle switch. The expression input is designed to work with any standard expression pedal.
specs: |-
  - VOLUME (fuzz): adjusts the output level of the fuzz effect
  - BLEND: mixes the fuzz sound with the original signal, from almost completely dry to 100% wet, via an analog jFET blend
  - VOLUME (filter): sets the output level of the dual filter section
  - CUTOFF: sets the frequency at which the high-pass and low-pass filters begin to attenuate, from 0Hz to 15kHz
  - PEAK: adjusts the resonance of each filter
  - EXP toggle switch assigns the expression input to high-pass or low-pass cutoff
  - Switching system: true bypass managed by soft switch and programmed relay
  - Power: 9V center negative
  - Current draw: 100mA minimum
