details: |-
  The Chandler Limited Little Devil Pre Amp is a discrete, transformer balanced 500 Series module that combines Wade Goeke's designs with recording studio favorites of the past. The Class A gain stage sounds like no other design we've done — it's big, yet open and full of life.

  Just about any parameter of the sound is changeable including the ability to change both the Feedback and Bias of the amplifier. The Feedback control increases harmonics thousands of times over the range of the control. The nature of clipping and distortion also changes and ranges from soft Class A clipping to super soft gushy tube type. The sounds range from a very colored and 'overbiased' tone to a gently colored and 'in your face' tone.

  Other features of the Little Devil Pre include High and Low input impedance; transformer balanced line in for using the Devil as a color box on mixes or tracks; low cut; bright switch and more. This unit has no power-up issues with lunchboxes and rack systems.

  All Chandler 500 Series units have been tested and proven to have no power issues in the following racks: API 500V 10-slot with L200 PSU; API 500-6B Lunchbox; API 500-6B HC 'new version' Lunchbox; BAE 11-slot with power one supply; BAE 6-slot portable with power one supply; BAE 6-slot with Avedis designed supply; A-Designs 2-slot; Purple Sweet 10; and Empirical Labs 2-slot.

  The Little Devil Pre Amp has been used on notable recordings including Avett Brothers' Grammy-nominated album 'The Carpenter' and sessions by engineers such as Ryan Hewitt (Red Hot Chili Peppers, The Lumineers, Blink-182) and Michael Wagener. It pairs naturally with the Little Devil EQ and Little Devil Compressor for a complete 500 Series channel strip.
