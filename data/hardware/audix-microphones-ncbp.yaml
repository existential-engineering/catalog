details: |-
  The AUDIX Novacore NCB P is a compact, professional-grade UHF digital bodypack transmitter designed for clergy, performers, presenters, broadcast talent, and anyone requiring discreet hands-free wireless operation. Its ABS and aluminum construction houses a TA3M (3-pin mini) mic input compatible with AUDIX lavalier and headset microphones — including the ADX10, L5, L5O, HT5, HT7B3P, and HT7BG3P — as well as any third-party mic terminated with a TA3F connector (Pin 2 hot).

  AES-256 encrypted digital transmission is synchronized to the receiver via one -touch IR sync. All controls — power button, mute button, and SET/MODE buttons — are located on the exterior of the unit for easy access. A dedicated 3.5 mm TRS remote mute input accepts a latching or momentary external switch (not included) for hardwired mute control, making the NCB P well suited for podium installations and theatrical applications where the operator controls muting from front-of-house.

  The NCB P operates on 2× AA alkaline batteries or 1× NCLB rechargeable lithium-ion battery with 9+ hours of runtime. A built-in USB-C port supports direct cable charging, and the optional NCC2 charging station enables managed multi-unit charging for venues with high weekly usage. Sold as body only; a bundle with AUDIX ADX10 lavalier microphone is available as NCB P +ADX10.
specs: |-
  - Type: UHF digital bodypack transmitter
  - Mic input: TA3M (3-pin mini), TA3F-terminated mics, Pin 2 hot
  - Remote mute input: 3.5 mm TRS (latching or momentary switch)
  - Encryption: AES-256
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours
  - Charging: built-in USB-C
