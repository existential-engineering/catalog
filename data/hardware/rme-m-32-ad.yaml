description: RME's M-32 AD is a 32-channel high-end AD converter, easy to
  operate yet having a comprehensive feature set. The unit combines excellent
  analog circuit design with the latest converter chips and RME's superior
  SteadyClock, resulting in a state-of-the-art AD conversion - 32 times. The
  unique set of features includes analog limiters, three hardware reference
  levels up to +24 dBu, MADI and ADAT I/O up to 192 kHz, 6.3 mm TRS and D-sub
  inputs, remote control via MIDI, and operation across a wide range of mains
  voltages, all packed into a 2U enclosure. An extraordinary limiter, conceived
  and optimised for professional studio, stage, and broadcast applications,
  offers essential operational safety with its capability to limit an input's
  overload of up to 17 dB without audible distortion (max. input level + 30
  dBu).
details: |-
  32-channel AD converter, fully symmetrical design, 116 dBA

  19" enclosure with only 2 units height

  1 x MADI I/O, 32 channels @ 96 kHz, 16 channels @ 192 kHz

  4 x ADAT Out, 16 channels @ 96 kHz, 8 channels @ 192 kHz

  Automatic Delay Compensation: no user operation necessary when stacking units

  Analog limiter can be activated

  32 LED level meters with 5 LEDs each

  32 LEDs to display the Limiter state per channel

  SteadyClock(TM) - pristine sound quality independently from the quality of the external clock signal

  SyncCheck(TM) - unique technology to check clock synchronization

  All settings are stored permanently

  Fully remote controllable via MIDI and MIDI over MADI

  The M-32 AD offers an outstanding AD conversion to MADI and ADAT formats in a compact 19" unit with only 2U height. The balanced analog inputs based on RME's reference design from the ADI-8 QS guarantee excellent S/N and THD specs across a wide analog level range.

  Three different hardware reference levels are available. Using up-to-date converter technology, the device works up to 192 kHz and reaches a real-world signal-to-noise ratio of 116 dBA on all channels.

  M-32 AD and M-16 AD have optical and coaxial MADI inputs. In case of failure of an input signal, the source is switched immediately if a valid signal is present on the other input.

  The four ADAT outputs provide simple connectivity with other studio equipment. A combination with RME's HDSPe RayDAT allows the transfer of 32 channels into a Mac or PC with regular optical Toslink cables. The converter's ADAT input only serves as an optional source for external synchronization.

  All settings are retained when the unit is powered off.
specs: |-
  - Input AD: 1/4" TRS jack and 25 pin D-sub, servo balanced, completely symmetrical audio path
  - Output AD: 4 x ADAT optical, 1 x MADI optical/coaxial
  - Dynamic Range AD: 113 dB RMS unweighted, 116 dBA
  - THD AD: < -110 dB (< 0.00032 %)
  - THD+N AD: < -104 dB (< 0.00063 %)
  - Crosstalk AD: > 130 dB
  - Input level for 0 dBFS: +24 dBu, +19 dBu, +13 dBu
  - Frequency response AD, -0.1 dB: 10 Hz - 23.2 kHz (sf 48 kHz)
  - Frequency response AD, -0.5 dB: < 5 Hz - 45 kHz (sf 96 kHz)
  - Frequency response AD, -1 dB: < 5 Hz - 80 kHz (sf 192 kHz)
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz, variable (Sync/WC)
  - Jitter: Typical < 1 ns for internal, Word Clock, ADAT and MADI input
  - Jitter sensitivity: all PLLs operate error-free even at 100 ns
  - Jitter suppression: > 30 dB (2.4 kHz)
  - Power supply: Internal switching mode PS, 100V - 240V AC, 60 Watt
  - Dimensions: (WxHxD) 483 x 88 x 200 mm
  - Analog limiter: capable of limiting input overload of up to 17 dB without audible distortion (max. input level + 30 dBu)
  - Form factor: 19" 2U rack-mount enclosure
