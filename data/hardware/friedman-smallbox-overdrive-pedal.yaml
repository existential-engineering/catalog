description: An overdrive pedal that carries the control set and voice of
  Friedman's Smallbox amplifier, from vintage plexi grit to high gain, with a
  side-mounted gain structure switch.
details: |-
  Dave Friedman's Smallbox all-tube amplifier is well known for being one of the most flexible and touch-responsive amplifiers on the market. The Smallbox overdrive pedal offers the same tonal versatility, sensitivity and harmonically rich overdrive in a compact pedal format.

  The pedal packs the same intuitive control set as the amplifier, with bass, mid, treble, presence, volume and gain, so a player can dial in a shade of rock from vintage plexi goodness to high gain madness. Whether the goal is a high-output cleaner tone for pushing an amp hard or a thick gritty drive that sits well in a classic or modern rock band, a sweep of the gain control gets there.

  A two-position side-mounted gain structure switch reins the gain in further and simulates the plexi channel of the Smallbox amplifier. Rolling the gain knob back and flipping that switch to lower gain mode takes the pedal from screaming high gain to a dirty boost, and the circuit responds to guitar controls and picking nuance in the way the amp does.

  The Smallbox overdrive delivers tube-like tone in a small pedal format and can be run into a clean amp or used to push an already overdriven one. It has true bypass switching, takes 9 to 18V DC with no battery option, and is assembled in the USA.
specs: |-
  - Smallbox amp tone in a compact pedal format
  - Ideal for use with both clean and overdriven amps
  - Responds to guitar controls and picking nuance exactly like the amp
  - Controls for bass, mid, treble, presence, volume and gain are intuitive for quick dial in
  - 2 position side-mounted gain structure switch for low-focused gain or high gain
  - True bypass switching
  - Can be powered between 9-18V DC (no battery)
  - Assembled in the USA
  - Dimensions: 2.5 in (W) x 4.75 in (L) x 2.5 in (H)
  - Weight: 1 lbs
