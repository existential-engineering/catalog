id: GfJ42l3gL-hRI8Mm1yFrn
name: BO-32DE
manufacturer: tascam
primaryCategory: utility
categories:
  - rack-mount
url: https://tascam.com/us/product/bo-32de
description: 1U rackmount breakout adapter that converts 32 channels of balanced
  Euroblock connections on the front panel to four AES59-2012 compliant D-Sub
  25-pin female connectors on the rear. Designed for professional installation
  environments bridging front-panel connectors to rear-panel outputs for use
  with CD players, digital audio players, zone mixers, and audio-over-IP
  converters. Features compact 50.8mm depth and reversible/removable rackmount
  ears for flexible tabletop or rack deployment.
details: |-
  Fully passive 1U rackmount Euroblock-to-D-Sub breakout adapter. 16 front-panel Euroblock connectors (3.81mm pitch, 2 channels each = 32 channels total) hardwired to 4 rear-panel D-Sub 25-pin female connectors (AES59-2012, 8 channels each). No active electronics; requires no power. Compact 50.8mm depth. Removable and reversible rackmount ears for tabletop or rack deployment. Includes 32 Euroblock plugs with cable management tabs, cable band kit, and rackmount screw kit.
specs: |-
  - - Front: 16× Euroblock balanced (3.81mm pitch), 32 channels total (2 ch per connector)
  - Rear: 4× D-Sub 25-pin female (AES59-2012, 8 channels each)
  - Dimensions: 482.6(W) x 44.1(H) x 50.8(D) mm; weight: 0.9 kg
  - Form factor: 1U rackmount; passive (no power required)
  - Included: 32× Euroblock plugs, cable band kit, rackmount screw kit
