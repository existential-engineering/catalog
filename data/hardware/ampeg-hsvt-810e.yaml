details: |-
  Designed and assembled in the U.S.A., the Ampeg Heritage SVT-810E delivers the legendary Ampeg "fridge" cabinet tone in a premium package.

  Fully stocked with eight custom-made 10" U.S. Eminence drivers, sealed for maximum punch, and overbuilt for ultimate reliability.

  The Heritage SVT-810E gives you classic Ampeg performance, unsurpassed quality, and uncompromising Ampeg tone.
specs: |-
  - 8 U.S.-made custom 10" Eminence drivers
  - Stereo/mono inputs
  - Rugged 15mm poplar ply enclosure
  - Premium Heritage black sparkle grille cloth, soft Tolex and trim
  - Perfect match for Heritage SVT-CL
  - 137 lb / 62 kg
  - Designed and assembled in the U.S.A.
