releaseDate: "2012"
description: "32-channel analog summing mixer featuring all-discrete class-A
  circuitry, a switchable BX5 output transformer, GAIN BOOST function, and
  audiophile 0.1% stepped attenuators. Updated with BURL NextGen Analog
  circuitry and BOPA14 op-amps."
details: |-
  The B32 Vancouver, a 32-channel mix bus, uses BURL AUDIO's renowned all-discrete analog, class-A circuitry. The B32 Mix Bus employs both the transparency of the B26 ORCA, plus the switchable tonality of the proprietary BURL AUDIO BX5 output transformer.

  In addition to the BX5, the B32 Vancouver introduces GAIN BOOST. Adding GAIN BOOST to the BX5 will give your mixes that glue you have been seeking ever since retiring your 2-track analog recorder. With 32 input channels and switchable tonality, the B32 Vancouver will allow your mixes to thrive in depth, warmth and clarity.

  Now with BURL NextGen Analog circuitry, the B32 Vancouver features the BOPA14 op-amps, delivering tighter bass and higher definition throughout the audio spectrum. Instruments and mixes have a more 3D sound, with wider stereo image and even more depth while preserving the original shape and harmonic balance of the source.
specs: |-
  - Discrete, class-A signal path
  - 8 mono inputs, 24 stereo inputs (32 input channels total)
  - Audiophile 0.1% stepped attenuators
  - Switchable BX5 output transformer
  - Summing amp GAIN BOOST
  - Dual stereo outputs
  - BURL NextGen Analog circuit with BOPA14 op-amps
