description: >-
  One of the primary reasons Ludwig is 'The Most Famous Name On Drums' is the
  legendary Black Beauty, constructed from a single seamless brass sheet to
  produce a warm, round metallic tone that is often imitated, but never
  duplicated.
details: |-
  An Industry Standard Since 1911. The Ludwig Black Beauty snare drum is built from a single seamless brass sheet using a hydroformed manufacturing process, then finished in black nickel plating. Limited annual production reflects the unique manufacturing process behind this iconic instrument.

  Available in 5x14" and 6.5x14" sizes (and an 8x14" model), with smooth or hammered shell options, and a choice of imperial lugs, tube lugs, or brass tube lugs with die-cast hoops.
specs: |-
  - 1.2mm seamless brass shell
  - Black nickel plated finish
  - Hydroformed manufacturing process
  - 2.3mm steel triple flanged hoops
  - P88AC throw off
  - P35P butt plate
  - 10 lugs
  - Ludwig Weather Master medium coated batter head
  - Ludwig Weather Master clear snare-side head
  - Available sizes: 5x14", 6.5x14", 8x14"
  - LB416 — 5x14" smooth shell, imperial lugs
  - LB416T — 5x14" smooth shell, tube lugs
  - LB416K — 5x14" hammered shell, imperial lugs
  - LB416KT — 5x14" hammered shell, tube lugs
  - LB416BT — 5x14" brass tube lugs, die-cast hoops
  - LB417 — 6.5x14" smooth shell, imperial lugs
  - LB417T — 6.5x14" smooth shell, tube lugs
  - LB417K — 6.5x14" hammered shell, imperial lugs
  - LB417KT — 6.5x14" hammered shell, tube lugs
  - LB417BT — 6.5x14" brass tube lugs, die-cast hoops
  - LB408 — 8x14" smooth shell, imperial lugs
