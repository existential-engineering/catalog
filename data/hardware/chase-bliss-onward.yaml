description: Onward is a sampler effects pedal by Chase Bliss controlled by your
  playing. It moves when you do, capturing the sounds you make to create rich
  musical landscapes.
details: |-
  Onward is a sampler controlled by your playing. It moves when you do, capturing the sounds you make to create rich musical landscapes. You will find responsive accompaniment, synthetic reimaginings, and a whole heap of glitching dreamscapes. It has two sides, one freeze for soft, smooth sounds, and one glitch for angular, repeating sounds. Combine them into one moving mega-effect, or split them apart for waves of depth and dimension.

  Onward is with you. It moves when you do and uses your own playing to surround you with layered accompaniment. If you go wild, it will too, mellow down a bit and Onward will follow suit. Simply plug in and start doing what you do.

  Use Onward's clump of built-in effects to add texture, harmony, and motion to your samples, an overdriven sub-octave perhaps, or maybe a low-resolution chorus. A synth-inspired Shape section controls the way it moves, for everything from slow swells to infinite plains to tight bursts of sound, while the Error section breaks up the routine with three different flavors of malfunction, messing with timing, playback, and condition to make the glitches feel more natural.

  The key to Onward's depth is the way its two channels interact. Use them together as one mega-effect, including interactive elements like sidechaining and dynamic ducking, or choose from a variety of unique ways to split them apart to create more complex effects, like a small orchestra moving in and out of harmony. Onward features advanced connectivity and customization options including MIDI, CV and Expression control, presets, and internal modulation of any or all its knobs.
specs: |-
  - Stereo I/O (mono/stereo via TS or TRS cable, MISO dip switch for mono-in/stereo-out)
  - Presets (2 Internal, 122 via MIDI)
  - Internal modulation (ramping)
  - MIDI (PC, CC, Clock Sync)
  - CV control (0-5V range)
  - Expression control
  - Tap Tempo
  - Trails
  - Analog dry thru
  - True / buffered bypass
  - Two channels: Freeze (sustaining) and Glitch (repeating)
  - Built-in effects: Octave, Texture, Animate (Vibrato/Chorus)
  - Shape section: Sustain and Fade (Slow/User/Fast)
  - Error section: Timing, Condition, and Playback error types with blend
  - Hidden options: MISO, Spread, Latch, Sidechain, Duck, Reverse, 1/2 Speed, Manual
  - 9V DC Center Negative, ~200 mA power draw
