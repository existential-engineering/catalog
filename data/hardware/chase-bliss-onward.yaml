description: Living landscapes. Onward is a sampler controlled by your playing.
  It moves when you do, capturing the sounds you make to create rich musical
  landscapes.
details: |-
  Onward is a dynamic sampler that responds to your playing. It captures the sounds you make and creates rich, layered musical landscapes around you. With two distinct sides — freeze for soft, smooth sounds and glitch for angular, repeating textures — it offers a wide palette of sonic possibilities.

  The pedal can combine both channels into one moving mega-effect with interactive elements like sidechaining and dynamic ducking, or split them apart for waves of depth and dimension. It moves when you do, using your own playing to surround you with layered accompaniment.

  Onward includes a collection of built-in effects to add texture, harmony, and motion to your samples, along with a synth-inspired Shape section that controls the way it moves — allowing you to swell, burst, and sustain. An Error section provides three different flavors of malfunction for creative glitching.

  Advanced connectivity and customization options include MIDI (PC, CC, Clock Sync), CV and Expression control, presets (2 internal, 122 via MIDI), internal modulation with ramping, tap tempo, and trails. The pedal features analog dry-through and true/buffered bypass options.
specs: |-
  - Stereo audio I/O
  - Analog dry-through signal path
  - True bypass and buffered bypass modes
  - 2 internal presets, 122 accessible via MIDI
  - Internal modulation with ramping
  - MIDI control: Program Change, Control Change, Clock Sync
  - CV control input
  - Expression pedal input
  - Tap tempo
  - Trails mode
  - Two channels: Freeze (smooth) and Glitch (angular)
  - Built-in effects for texture, harmony, and motion
  - Synth-inspired Shape section (swell, burst, sustain)
  - Error section with three glitch flavors
  - 9V DC center-negative power, ~200 mA draw
