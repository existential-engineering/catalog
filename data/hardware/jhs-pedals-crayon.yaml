description: A simplified little-brother to the Colour Box, delivering vintage
  studio preamp tones from gritty overdrive to gated fuzz with an active Tilt
  EQ, Hi-Pass filter toggle, and instrument/XLR inputs for guitar, bass, or
  microphone.
details: |-
  The JHS Pedals Colour Box began with a simple idea: create a pedal that sounds like plugging directly into a vintage preamp and cranking it. The Colour Box became much more, so JHS decided to pare it down and give guitar players and bass players a simplified version that delivers the distinct compressed overdrive and fuzz sounds heard on classic recordings. The Crayon has all the color and characteristics of a vintage studio preamp when cranked.

  Controls: Master volume controls the overall output volume. Pre-Vol acts as a gain control from gritty preamp drive to over-the-top gated fuzz. Tilt is an active EQ where noon is flat; clockwise boosts highs and cuts bass; counterclockwise boosts bass and cuts highs — allowing tailoring for any rig on bass or guitar. Hi-Pass toggle cuts low end with a flick of the switch for the ability to cut through the mix or get lo-fi sounds. A dip switch on the right side selects either 200Hz or 750Hz cut for the Hi-Pass.
