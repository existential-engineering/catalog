  half the size of the standard pedal.
details: |-
  The Compressor Mini is Keeley's most intuitive compressor, presented here as a Custom Shop edition. It uses an intuitive two knob control layout and is designed to make compression simple to set, in an enclosure half the size of the full pedal.

  It uses what Keeley calls Manhattan-style compression, automatically delivering a blend of dynamic and compressed signal so the subtlety and dynamics of the playing are retained. A new transient release time is set to suit both single coils and humbuckers, and an automatic tone recovery circuit keeps the highs clear even at high compression settings.

  The pedal also carries a built-in pre-amp, intended to push other pedals and amplifiers harder, and it is switched true bypass. It runs on 9 volts at a 10mA current draw and is designed and built in the USA. The design won Premier Guitar's Premier Gear award.
