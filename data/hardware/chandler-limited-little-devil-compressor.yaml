details: |-
  The Chandler Limited Little Devil Compressor is a discrete, transformer balanced 500 Series module that combines Wade Goeke's designs with recording studio favorites of the past.

  The Little Devil Compressor combines elements of the LTD-2 and Germanium Compressor, as well as 2264 and 33609 units, into an all new compressor for a 500 format. Discrete transformer sound and handmade quality are the hallmarks of the Devil Comp.

  Revolutionary controls like wet/dry, sidechain filter, and curve selection make the unit extremely flexible. A Germ/Zener curve switch, switchable sidechain filter (Out, 30, 60, 90, 150, 300 Hz), wet/dry mix, true bypass, and switchable ratio make this a highly versatile compressor.

  All Little Devil units have been upgraded to eliminate the power conflict experienced with some 3rd party racks and lunchboxes. The upgrade has been tested in numerous racks including API 500V, API 500-6B Lunchbox, BAE, A-Designs, Purple Sweet 10, and Empirical Labs systems.
