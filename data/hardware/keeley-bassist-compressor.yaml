details: |-
  The Bassist Compressor provides high-fidelity compression and limiting intended to keep the detail of a bass guitar's tone intact.

  It is built around the THAT Corporation 4320, using voltage controlled amplifiers, an on-board true-RMS detector and high performance op-amps. VCA compressors give precise control, which suits bass guitar. Where Keeley's earlier compressors were based on the CA3080 or LM13700 and suit single coil guitars, the Bassist handles active preamps and hot instrument line-level signals, has a bandwidth of over 20 kHz and very low noise, giving rack-mount quality in a stompbox.

  Used as a limiting amplifier it protects speakers from clipping and distortion. The Threshold control sets the level at which peaks are acted on, with a threshold indicator LED showing when the signal crosses it, and the Compression control sets the ratio applied above threshold. Fully down it gives no compression, 1:1, so the Gain control acts as a boost, and fully up it gives a hard-knee limiter above threshold. A soft setting is around 2:1, 4:1 is a useful starting point for bass, 5:1 or 6:1 suits slap and funk playing, and 10:1 suits synth bass.

  Attack and release are governed by a single time constant parameter, as is usual for feed-forward compressors using a true-RMS detector, so both adapt to the playing level and program content, with attack times roughly a hundred times faster than release times. The page gives 125 dB per second as the target rate.
