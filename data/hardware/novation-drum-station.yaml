description: >-
  The Novation Drum Station is the first true TR-808 and TR-909 clone, employing analog sound
  modeling to digitally synthesize models of the original waveforms with full MIDI implementation
  and tweakable real-time controls.
details: |-
  Unlike other clones which use only samples, the Drum Station employs analog sound modeling with digitally synthesized models of the original waveforms which can be shaped just like analog. This makes it the perfect source for believable, tweakable 808 and 909 drums.

  The unit features modern functions such as full MIDI implementation and control of all parameters, distortion, front-cut edits, note-off programming, programmable drum kits with 40 memory locations, and general MIDI drum mapping. Individual drum sounds offer adjustable tone, attack, decay, and distortion parameters.

  A DIN Sync output allows syncing with a TB-303, 909, or 808, and multiple assignable individual outputs provide flexibility for studio use. The Drum Station has been used by Orbital, Laurent Garnier, and Hardfloor.
specs: |-
  - Polyphony: 5 voices
  - Oscillators: Digital analog sound modeling of TR-808 and TR-909 drum sounds
  - Real-Time Controls: Level, Tune, Attack, Decay, Tone, Snap
  - Outputs: Main stereo and 6 assignable individual
  - Effects: Distortion effect for each drum sound
  - Memory: 20 factory and 15 user programs
  - Control: MIDI, DIN Sync Trigger Output
releaseDate: "1996"
releaseDateYearOnly: true
