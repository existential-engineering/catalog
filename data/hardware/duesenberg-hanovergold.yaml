description: An exclusive, limited-edition run featuring a
  metal-particle-infused finish. This unique coating forms a delicate metallic
  layer on the instrument's surface that will age gracefully with use,
  developing a one-of-a-kind patina over time.
details: |-
  Hanover Gold Limited is a limited series, built to order in 2026 only, that applies one finish to three of Duesenberg's established models: the semi-hollow Starplayer TV, the chambered Starplayer CBR and the solid alder Paloma. Each carries a gold paint finish infused with metal particles and hand-processed to a naturally broken-in feel, with the entire back of the instrument finished in matte black for contrast against the gold top and headstock. The lacquer is deliberately reactive, responding to hand oils, playing contact and cleaning, so sheen, depth and patina shift over time and no two examples age alike.

  The Starplayer TV specification is a semi-hollow body with a sustain block, bent sides and an f-hole, measuring 46 x 34 cm (18.11" x 13.38") with 4.5 cm (1.8") sides. The top is laminated spruce, flamed maple on the Tobacco Burst finish, with laminated flamed maple back and sides, a transparent black back-printed Plexi pickguard, and a PUR gold-metal hand-processed finish.

  The set neck is one-piece maple with an Indian rosewood fingerboard at a 305 mm / 12" radius, cream dot inlays, 22 jumbo frets (2.8 x 1.0 mm), a medium D profile, a 648 mm / 25.5" scale length and a steel dual-action truss rod. Duesenberg's Plek process levels the frets, which the maker treats as the foundation for its multi-step fret polishing and hand-finished setup.

  Electronics pair a Duesenberg Domino P90 at the neck with a Duesenberg GrandVintage Humbucker at the bridge, wired to one volume, one tone and a three-way pickup selector. Hardware is nickel finished and includes Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and a Duesenberg Sapphire Deluxe Tremola vibrato system, with Duesenberg Standard, Straplock-compatible strap pins. The Z-Tuners are designed for a smooth, precise feel and allow the cut-off string end to be hidden inside the tuner shaft.

  The instrument ships with the handcrafted Duesenberg Custom Line Case as standard, a signed Certificate of Authenticity and all the allen keys required for setup.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated spruce, Flamed Maple on "Tobacco Burst" Finish
  - Back, sides: Laminated flamed maple
  - Dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Height (sides): 4.5 cm / 1.8"
  - Pickguard: Transparent Black back printed Plexi
  - Finish: PUR, Gold-Metal hand processed
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Sapphire Deluxe Tremola
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Case: Custom Line Case (included)
  - Authenticity: Signed Certificate of Authenticity
  - Tools: All required allen keys (included)
