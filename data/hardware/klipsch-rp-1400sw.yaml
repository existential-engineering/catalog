url: https://www.klipsch.com/products/rp-1400sw-subwoofer
description: The RP-1400SW is a 14" front-firing powered subwoofer from
  Klipsch's Reference Premiere series, featuring a Cerametallic woofer driven by
  a 500W RMS Class D amplifier with analog preamp stage. It delivers bass
  extension down to 16Hz via a bass reflex cabinet with a proprietary Aerofoil
  front slot port.
details: |-
  Striking the optimal balance between amplifier power, driver capability, and cabinet volume, the RP-1400SW achieves maximum low frequency extension with great output, accuracy, and speed.

  The newly designed Cerametallic woofer is exceptionally light and extremely rigid, providing remarkable low frequency response with minimal cone breakup and distortion for higher, cleaner output using less amplifier power.

  The built-in high efficiency Class D amplifier features an analog preamp design, which maintains the original signal path for cleaner, true-to-source reproduction. The proprietary internal geometry with a new Aerofoil slot port design minimizes port noise for clean undistorted low frequencies, with front-firing placement for flexibility.

  Low Pass Crossover and Variable Phase control allows you to tune the subwoofer to your speakers and room. Both the RCA and wireless inputs can be utilized simultaneously, giving you the ability to use a single subwoofer with multiple systems in the same room.
