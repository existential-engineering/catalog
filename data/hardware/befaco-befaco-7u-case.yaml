id: LTB_9kwUqRaaA2LHCQy03
name: Befaco 7U Case
manufacturer: befaco
primaryCategory: modular
url: https://www.befaco.org/befaco_7u_case/
description: The ultimate Eurorack case. At home, stage or into the studio, the
  Befaco 7U Case brings your system to the next level.
details: |-
  The Befaco 7U Case is a compact, portable Eurorack enclosure designed for home studio, stage, and professional use. It features a high-quality unibody black anodised aluminum frame that balances rigidity with portability.

  The case houses two 3U rows and one 1U row (Intellijel format), each at 104HP, giving a total of 36 module slots. The internal depth is 53mm on the power side and 70mm on the remaining area, accommodating most Eurorack modules.

  Power is delivered by a Trolley Bus system sourced from an included 135W 2.5mm barrel connector power brick. Rails provide up to 5000mA on the +12V rail, 2500mA on -12V, and 4000mA on the +5V rail.

  Connectivity includes six balanced/unbalanced 6.3mm jack I/Os, MIDI DIN In/Out/Thru, USB Device Type B, and USB-A charging ports. This makes the case a self-contained hub for interfacing with external audio gear and computers.

  A PET-G clear cover is included for module protection during transport. The case is VESA 100 mount compatible and includes a Kensington Lock slot. Available in assembled and DIY kit versions.
