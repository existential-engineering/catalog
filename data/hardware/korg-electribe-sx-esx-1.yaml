description: >-
  A 16-part sampler and pattern sequencer from 2003 with vacuum tube circuitry,
  phrase slicing, time stretching, and three simultaneous stereo effects
  processors.
details: |-
  The Korg ElecTribe SX represents a major evolution of the ElecTribe line, upgrading to a sturdy
  metal chassis and adding vacuum tube circuitry for analog warmth alongside expanded sampling and
  sequencing capabilities. Released in 2003, it was designed as a self-contained dance music
  production platform with 16 multitimbral parts covering synth, drum, stretch, slice, and audio
  input types.

  The sampling engine provides 285 seconds of recording at 44.1kHz with capacity for 384 custom
  samples. Phrase slicing divides samples at rhythmic peaks for groove manipulation, while Stretch
  Parts adjust sample tempo independently of pitch. SmartMedia card support enables WAV and AIFF
  import and export, making sample management practical for studio workflows. Two vacuum tubes in
  Korg's Valve Force Circuitry add analog character to the output stage.

  Three simultaneous stereo effects processors each offer 16 effect types with a chain function for
  serial processing. Four filter types on synth parts cover low-pass, high-pass, band-pass, and
  band-pass-plus modes. The sequencer holds 256 patterns with up to 128 steps per part, and Motion
  Sequencing records real-time parameter automation with 24 sequences per pattern.

  Up to 64 songs can combine patterns with muting and knob movement data, supporting full
  arrangement creation. Auto BPM detection and tap tempo make live integration straightforward, while
  16 velocity-sensitive pads provide an intuitive performance interface.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 16 parts (2 synth, 9 drum, 1 accent, 2 stretch, 1 slice, 1 audio in)
  - Sampling: 285 seconds at 44.1 kHz, 384 user samples
  - Tubes: 2 vacuum tubes (Valve Force Circuitry)
  - Effects: 3 stereo processors, 16 types each, chainable
  - Filter: Low-pass, high-pass, band-pass, band-pass plus
  - Sequencer: 256 patterns, up to 128 steps per part
  - Motion Sequences: 24 per pattern
  - Songs: 64 (up to 20,000 events)
  - Storage: SmartMedia card (4-128 MB)
  - Pads: 16 velocity-sensitive
  - Control: MIDI In/Out/Thru
releaseDate: "2003"
releaseDateYearOnly: true
