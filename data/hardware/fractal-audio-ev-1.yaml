details: |-
  The EV Series combines a high-quality expression pedal and an analog volume pedal in one unit. The expression pedal jack is designed to work with all Fractal Audio Systems products and with many third-party devices. Unlike most expression pedals it has a true linear response, with planetary gearing and a long, smooth throw.

  The 100K pot and planetary gearing create a truly linear response, so the position of the pedal corresponds intuitively and comfortably to sound changes with no need for finicky footwork. The long travel makes artistic control easier, whether the pedal is adjusting levels, mix, effect parameters, or several of those at once.

  Each EV pedal also works as a 500K high-impedance analog volume pedal, with separate IN and OUT jacks connected to an audio-taper pot. It is intended for use with passive pickups and is designed never to cause tone suck.

  Both sizes share a sturdy cast metal housing and a comfortable non-slip rubber tread.

  The EV-1 is the full-sized pedal in the series, measuring 11.4 inches in length and weighing 3.7 lbs. It is comfortable to use and feels familiar compared with most classic volume pedals, and its smooth long travel provides a high degree of expressive control. The compact EV-2 is sold alongside it for players who need a smaller footprint.
specs: |-
  - True linear expression response from planetary gearing and a long, smooth throw
  - 100K pot on the expression side
  - 500K high-impedance audio-taper pot on the analog volume side
  - Separate IN and OUT jacks for volume operation
  - Suited to passive pickups and designed never to cause tone suck
  - Sturdy cast metal housing
  - Comfortable non-slip rubber tread
  - Full-sized chassis measuring 11.4 inches in length
  - Weight: 3.7 lbs
  - Works with all Fractal Audio Systems products and many third-party devices
  - Passive operation: the page lists no power connection, adapter or battery
