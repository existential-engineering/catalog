details: |-
  Horn loading maximizes efficiency and increases detail while focusing high frequencies towards the listening area. Proprietary Tractrix geometry provides the most efficient transfer of high frequency waves into the listening area. The second generation increases horn size for a larger soundstage and enhanced directivity via a 90° x 90° silicone composite hybrid Tractrix horn.

  The exclusive Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for enhanced, detailed performance. The vented tweeter housing reduces standing waves that create unwanted harmonics, resulting in enhanced detail and clarity in high frequency reproduction.

  Cerametallic woofers are exceptionally rigid and lightweight for minimal distortion and maximum efficiency. New aluminum shorting rings reduce distortion and increase power handling, and the new motor structure improves transient response with more control, speed, and accuracy.

  Dual input terminals support bi-wiring / bi-amping capability. Cast aluminum feet provide a more modern look with less resonance than MDF or ABS plastic, decoupling the speaker from the floor for faster, tighter low frequencies.

  The RP-8060FA II features a high-performance 6.5" 2-way up-firing Dolby Atmos speaker integrated in the top for an encompassing, immersive experience.
