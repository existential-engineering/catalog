details: |-
  The PRS S2 Special Semi-Hollow offers a versatile tonal platform that balances warmth, clarity, and resonance, thanks to its semi-hollow construction and innovative pickup configuration. Featuring a pair of 58/15 LT humbuckers in the bass and treble positions and a PRS Narrowfield in the middle, this guitar delivers a wide spectrum of tones—from articulate single-coil sparkle to full, vintage-inspired humbucking warmth. A 5-way blade switch and two mini-toggles allow players to tap the humbuckers, creating twelve distinct pickup combinations and ensuring endless sonic exploration. The semi-hollow body with carved maple top and mahogany back adds a natural airiness and depth to the guitar’s tone while enhancing sustain. The 22-fret, 25” scale length Pattern Regular mahogany neck with a rosewood fretboard and PRS bird inlays provides a smooth, effortless playing experience. Equipped with PRS’s patented tremolo and Phase III locking tuners, the S2 Special Semi-Hollow maintains tuning stability and delivers expressive performance across a range of musical styles. With its exceptional tonal versatility and semi-hollow resonance, the PRS S2 Special Semi-Hollow is a dynamic instrument that encourages players to push creative boundaries while maintaining a refined, sophisticated voice.
