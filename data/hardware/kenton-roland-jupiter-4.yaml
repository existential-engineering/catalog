description: MIDI retrofit kit for the Roland Jupiter-4. It adds MIDI In and
  Thru sockets and lets the synthesiser be played from a MIDI keyboard or
  sequencer, with control of notes, pitchbend, modulation, filter cutoff, volume
  and sustain.
details: |-
  This retrofit kit adds MIDI control to the Roland Jupiter-4. Any MIDI channel can be selected, and the kit responds to notes in the range 36 to 96 with transposition available, pitchbend whose range follows the setting on the synthesiser, mod wheel, low pass filter cutoff, volume and sustain. The arpeggio clock can be synchronised to MIDI clock.

  By default pitchbend is driven by pitchbend messages, the mod wheel by CC#1 and also by aftertouch, filter cutoff by CC#16, volume by CC#7 and sustain by CC#64. Any controller, aftertouch or velocity can be remapped to control other parameters, so velocity could be set to drive volume instead.

  Added hardware consists of MIDI In and Thru sockets plus a push button for programming the MIDI setup. This retrofit does not transmit MIDI, so no MIDI Out socket is fitted. Setups are held in non-volatile EEPROM memory.

  The kit comprises a circuit board that fits in the base of the Jupiter-4, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions covering the default settings, and step by step fitting instructions with diagrams. Fitting is a job for an experienced synthesiser engineer rather than the end user.
specs: |-
  - Incoming MIDI on any selectable channel
  - Note range MIDI 36 to 96, transposition available
  - Pitchbend range follows the bend setting on the synthesiser
  - Mod wheel on CC#1, also driven by aftertouch, by default
  - Low pass filter cutoff on CC#16 by default
  - Volume on CC#7 and sustain on CC#64 by default
  - Any controller, aftertouch or velocity can be remapped to other parameters
  - Arpeggio clock synchronisable to MIDI clock
  - Setups stored in non-volatile EEPROM memory
  - Powered from inside the host Jupiter-4, so the kit has no power connector of its own
