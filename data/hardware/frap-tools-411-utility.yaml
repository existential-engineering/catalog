description: The 411 is a quadruple linear VCA, mixer and multiple for audio and
  CV, with semi-normalled signal and CV inputs and -6 dB attenuation switches.
  An All output mixes all four sections while an Unpatched output carries only
  the sections whose local output is unused.
details: |-
  The 411 is a quadruple linear VCA, mixer and multiple for audio and CV. It consists of four linear VCAs with semi-normalled signal inputs and CV inputs, -6 dB attenuation switches, a mixed output and an unpatched output.

  The four VCAs are DC coupled, which suits them to modulating control voltages as readily as audio signals. They are also designed to stay open when nothing is patched to the inputs, so a channel passes signal without a control voltage present.

  The signal inputs and the CV inputs both use cascaded semi-normalled connections, so every signal patched to an input also feeds the following ones. That allows a wide set of source and modulation combinations from a small number of cables: four signals can be processed independently, one signal can be modulated by four CVs and sent to four destinations, up to four signals can be mixed and modulated by the same CV, or two audio signals can be mixed and modulated by a modulated CV.

  Two sum outputs work the same way as on the 321 module. The All output mixes the four sections, while the Unpatched output carries only those sections whose local output is not going anywhere, so patching a section's local output removes it from the Unpatched sum.

  A -6 dB switch per channel halves the CV input, which lets the module work with both 0 V to 5 V and 0 V to 10 V control voltages without rescaling the source.
specs: |-
  - Four DC-coupled linear VCAs for audio signals and control voltages
  - Cascaded semi-normalled signal inputs and CV inputs, so a patched signal also feeds the following channels
  - All output mixing the four sections, plus an Unpatched output carrying only the sections whose local output is unused
  - -6 dB switch per channel, halving the CV input so the module works with both 0 V to 5 V and 0 V to 10 V control voltages
  - VCAs stay open when nothing is patched to the inputs
  - Usable for processing four signals independently, modulating one signal with four CVs to four destinations, or mixing up to four signals under one CV
  - Bus-powered from the Eurorack case power bus, with no power jack of its own
