description: >-
  Edge takes the guesswork out of getting started. This 8-piece electronic drum
  kit includes everything from throne to headphones so new players can start
  drumming the day it arrives. With responsive mesh pads, onboard sounds, and
  USB-MIDI, Edge combines simplicity and playability in one compact, reliable
  setup. Built to inspire confidence and creativity, Edge is where every drummer
  begins. This kit features 250 sounds, 25 preset kits, onboard metronome, 1/8"
  mini audio input for audio devices, and USB MIDI output for use with virtual
  instruments.
