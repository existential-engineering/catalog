description: An active far-field bidirectional ribbon microphone with
  phantom-powered JFET electronics, capturing the full sonic character of a room
  from distances of 12 inches to 20 feet with a natural, honest tonality ideal
  for orchestras, drum kits, and ensembles.
details: |-
  The AEA NUVO N8 is an active far-field ribbon microphone and the mono counterpart to the AEA R88 stereo ribbon mic. It shares the same minimalist design philosophy and honest sound as the R88, but features active electronics and a custom transformer that provide extra output and more preamp flexibility than traditional passive ribbon mics. A special preamp is not required since the N8 uses active circuitry, and a pair of N8s with the NUVO stereo kit can emulate the R88 in Blumlein or near-coincident stereo configurations.

  The N8 is a far-field ribbon mic designed to be positioned at an ideal distance of 12 inches or farther from the source of sound. From as far away as 20 feet, the N8 retains the low end frequencies of the sources it captures, and its open, natural tonality makes it perfect to record entire orchestras or the full low end of a drum kit from overhead.

  The proximity effect of the N8 is present when recording a source from closer than 12 inches, which can be used to accentuate the low-end of a vocal or string instrument. The N8 can handle 141+ dB SPL at 1 kHz. The native bidirectional figure-of-8 polar pattern provides up to 90 dB rejection at right angles to the front/back axis.

  Compact, lightweight, and low-profile, the NUVO N8 is built for both studio and live performance use. Artists who have used N8s on the road include Bonnie Raitt, Alicia Keys, Aerosmith, Mitski, Alabama Shakes, War On Drugs, Brandi Carlile, and many more.

  The N8 features a pure aluminum corrugated ribbon element measuring 1.8 µm thick, 0.185 in wide, and 2.35 in long. It is handmade in Pasadena, California, USA and operates on P48 phantom power.
specs: |-
  - Operating Principle: Pressure gradient transducer
  - Directional Pattern: Bidirectional (figure-of-8)
  - Frequency Range: <20 Hz to >20 kHz
  - Maximum SPL: 141 dB SPL at 1 kHz
  - Sensitivity: 8.3 mV/Pa (at 1 kHz, no load)
  - Output Impedance: 92 Ω broadband
  - Recommended Load Impedance: 1.0 kΩ or greater
  - Phantom Power: P48, 7 mA
  - Polar rejection: Up to 90 dB at right angles
  - Ribbon Thickness: 1.8 µm
  - Ribbon Width: 0.185 in (4.7 mm)
  - Ribbon Length: 2.35 in (59.7 mm)
  - Height: 8.83 in (32.4 cm)
  - Width: 1.62 in (11.7 cm)
  - Weight: 12 oz (335 g)
  - Connector: XLR-3M
  - Handmade in Pasadena, CA, USA
