description: The D-18 Modern Deluxe blends vintage tone with modern enhancements
  like a VTS top, carbon fiber bridgeplate, and comfort-focused neck.
details: |-
  The D-18 Modern Deluxe reimagines a Martin icon by combining cutting-edge craftsmanship with heritage design. Built on the iconic Dreadnought body, it delivers bold lows, articulate highs, and exceptional headroom for players who demand a versatile flatpicking and strumming voice.

  A Spruce Vintage Tone System (VTS) top is paired with Golden Era-style Adirondack spruce X-bracing, natural protein glue, and a lightweight carbon-fiber bridge plate to maximize resonance and sustain. Exclusive Liquidmetal bridge pins are designed to enhance projection by up to 3 decibels.

  The neck features a Vintage Deluxe shape with High-Performance Taper, EVO gold frets, and a slightly asymmetrical profile for smooth, precise play. Genuine mahogany back and sides give the instrument its classic D-18 warmth and woody midrange.

  Appointments include Old Style 18 abalone fingerboard inlays and rosette, East Indian rosewood binding and headplate, a tortoise-pattern pickguard, and Waverly gold open-gear tuners with butterbean knobs. A 1933-style pearl script logo finishes the headstock.

  The guitar ships pre-strung with Authentic Acoustic Lifespan 2.0 phosphor bronze medium strings and includes a ply hardshell case with brass/nickel hardware.
specs: |-
  - Body size: D-14 Fret (Dreadnought)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back & Sides: Genuine Mahogany
  - Bracing: Forward-Shifted X-Brace (GE-Scalloped), Adirondack Spruce with VTS
  - Bridge plate: Carbon fiber
  - Neck: Genuine Mahogany
  - Neck shape: Vintage Deluxe
  - Neck taper: High-Performance Taper
  - Neck finish: Satin
  - Scale length: 25.4"
  - Frets: 20 total, joins body at 14th fret
  - Fingerboard: Ebony
  - Fingerboard width at nut: 1 3/4"
  - Fingerboard width at 12th fret: 2 1/8"
  - Inlays: Old Style 18 abalone
  - Nut: Bone
  - Saddle: Compensated bone, 16" radius
  - Bridge: Ebony, Modern Belly style with drop-in saddle
  - Bridge pins: Liquidmetal with red acrylic dots
  - Tuners: Waverly gold open-gear with butterbean knobs
  - Binding: East Indian Rosewood
  - Headplate: East Indian Rosewood with 1933-style pearl script logo
  - Rosette: Old Style 18 Multi-Stripe
  - Pickguard: Tortoise pattern
  - Top finish: Gloss, clear
  - Back/sides finish: Gloss, dark mahogany
  - Construction: Dovetail neck joint
  - Plek setup
  - Strings: Authentic Acoustic Lifespan 2.0, Phosphor Bronze, Medium
  - Case: Ply hardshell
  - Electronics: None standard (optional LR Baggs Anthem, Fishman Gold Plus Natural, or Fishman Infinity Matrix)
