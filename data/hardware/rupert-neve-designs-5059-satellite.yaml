description: The 5059 Satellite is a 16x2+2 analog summing mixer that combines
  custom transformers and class-A circuitry in a compact 2U chassis. Each of its
  16 channels offers continuously variable level (-∞ to +10 dB), 3 dB-law pan,
  an individually switchable insert point, and a Stereo 2 send for parallel stem
  mixing. Master Silk Red and Silk Blue modes with continuously variable Texture
  controls let engineers dial in harmonic content and transformer saturation
  across the entire mix.
details: |-
  The 5059 Satellite is designed to provide the ultimate out-of-the-box analog summing experience for engineers working primarily in the digital domain. Sixteen input channels feed two independent stereo mix buses, allowing simultaneous main mixes and stems, parallel processing chains, or integration with additional summing units such as the 5060 Centerpiece.

  Every channel features a continuously variable level control, a 3 dB pan-law panpot, and an insert switch that routes the signal out to outboard processing and back through dedicated return inputs on the rear panel. The insert sends are always active, making the 5059 equally useful as a 16-channel transformer-coupled splitter or routing matrix.

  The master section adds Rupert Neve's signature Silk circuitry: Silk Red emphasizes harmonic content in the upper-midrange and highs, while Silk Blue focuses on low-mid weight and warmth. A continuously variable Texture control sweeps the intensity of either mode, giving fine control over harmonic saturation across the entire mix bus.

  Housed in a 2U rack chassis with a universal 100-240 VAC internal power supply, the 5059 Satellite is built around custom-wound input and output transformers and class-A topologies throughout the signal path.
specs: |-
  - Channels: 16 inputs summed to 2 stereo buses (Stereo 1 + Stereo 2)
  - Channel controls: continuously variable level (-∞ to +10 dB), 3 dB-law pan, insert engage, Stereo 2 send
  - Master section: Silk Red / Silk Blue modes with continuously variable Texture
  - Frequency response: ±0.1 dB, 20 Hz - 20 kHz; -3 dB @ 3.5 Hz and 185 kHz
  - THD @ 1 kHz, +20 dBu: better than 0.003%
  - Noise (IEC A-weighted): bus -106 dBV; channel at unity -103 dBV
  - Signal-to-noise: 119 dB A-weighted at +20 dBu; 103 dB at +4 dBu
  - Maximum output: +26 dBu (summing buses), +24.5 dBu (single channel)
  - Crosstalk Bus 1 to Bus 2: -90 dB @ 1 kHz, -70 dB @ 10 kHz
  - Power: 100-240 VAC, 50/60 Hz, 45 W
  - Dimensions: 19" W x 9.25" D x 3.5" H (2U)
  - Weight: 14.5 lbs (6.6 kg)
