id: FU0VUo5UbTlYK7WRM0cNQ
name: Fusion
manufacturer: folktek
primaryCategory: mixer
categories:
  - modular
  - utility
url: https://folktek.com/products/fusion
description: Fusion is a Eurorack mixer module that functions as a four-channel
  VCA and can also seamlessly crossfade between two to four audio signals using
  a single control or CV.
details: |-
  Fusion is a mixer that acts as any four channel VCA but it also allows one to seamlessly fade 2-4 audio signals on a single control and even do it with CV. Touch-based selector allows the selection of 2, 3 or 4 inputs to be fused with the fusion control and sent to a single "mix" output. Touch-based selector over direction determines whether the fader/ moves clockwise or counter-clockwise in accordance with an incoming voltage signal. Applying sequenced voltage to fusion allows one to jump between incoming signals - basically creating a triggerable 4 track. Fusion a straight forward, clean mixer with 4 inputs with controls over input level (with audio and peak indication lights), 4 independent outputs with cv control, single output with level control (and audio and peak indication lights, mix output for the fused signal. CONTROL

  - 4x independent Input levels with audio and peak indication
  - 4x independent Output levels with cv
  - touch-based direction switch
  - touch-based fusion selection (2-4)
  - fusion control with cv
  - output level control
  - light indication for all modes and controls

  INS AND OUTS

  - 4x input
  - 4x output
  - 4x output cv control
  - sum out with audio and peak indication
  - mix out for fusion mix
  - cv over fusion

  SPECS

  - includes mounting hardware and power connection in a beautiful Folktek box. + 12v = xma
  -12v = xma
  +5v = xma
  width = 16HP
  1" depth (skiff friendly)
