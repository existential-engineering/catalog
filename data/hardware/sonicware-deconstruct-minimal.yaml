details: |-
  deconstruct MINIMAL is a compact 11-track groovebox built for hypnotic minimal techno and house grooves, bringing drums, bass, and sampling together in a fast, intuitive workflow. Designed for fluid idea generation and live performance, it delivers deep groove creation without slowing your creative flow.

  Add-Ons: If you need DIN MIDI connectivity and Micro Knobs for improved visibility and control, choose the "+ Add-Ons" option, which for a limited time gets you the Complete Pack.
