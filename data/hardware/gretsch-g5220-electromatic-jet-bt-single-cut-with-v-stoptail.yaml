details: |-
  Sophisticated and sensible, Electromatic Jet BT models are the perfect real, pure and powerful Gretsch instruments. They're your next-step Gretsch - bold, dynamic and articulate, and crafted with essential Gretsch sound, style and playability.

  The all-new G5220 Electromatic Jet BT Single-Cut with V-Stoptail delivers Broad'Tron might with classic Jet clarity. At the heart of each Electromatic Jet BT is a chambered mahogany body with maple top that produces a rich, present mid-range that accentuates big lows and shimmering highs.

  All-new Black Top Broad'Tron pickups at the neck and bridge deliver powerful, articulate tones. Versatile controls include individual pickup volumes, master volume with treble bleed, master tone and a 3-position toggle for a wide palette of usable sounds.
