details: |-
  We designed the Align Chorus for players who don’t like Chorus, to complement your acoustic tone rather than overwhelm it. With the effect in side-chain, the Chorus adds fullness behind your guitar without any signal degradation. Our unique Size control blends two chorus voicings that interact with one another as you turn the knob, essentially like adding more instruments behind you, and the Tone control shapes only the affected signal, enabling a perfect balance between your instrument and the effect.
specs: |-
  - Chorus control blends the chorus signal with the unaffected signal
  - Size control blends between two interacting chorus voicings
  - Tone control shapes only the affected signal
  - Volume level control
  - Engage footswitch for affected signal or true bypass
  - Side-chain effect design to preserve the dry signal
  - Powered by 9V battery or 9V DC supply
  - U.S. Patent D918,293
