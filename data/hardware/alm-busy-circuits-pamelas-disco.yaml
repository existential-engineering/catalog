description: >-
  Pamela's Disco syncs Eurorack modular gear to the master tempo of a PRO
  DJ-LINK™ network, converting DJ deck clock information to standard modular
  signals including DIN Sync style outputs, beat triggers, and bar triggers.
details: |-
  Pamela's Disco is a compact 4HP Eurorack module that bridges the world of DJ equipment and modular synthesis. By connecting to a PRO DJ-LINK™ network via Ethernet, it receives the master tempo from Pioneer DJ decks and converts it into clock signals usable by any Eurorack module.

  The module outputs standard DIN Sync style analog clock signals (x24 and Run) as well as dedicated Beat and Bar trigger outputs, giving multiple sync reference points for driving sequencers, clock dividers, and other modular gear.

  LED indicators display connection status, sync status, and tempo. A Resync button provides manual, latched beat-synced control over the outputted clock.

  Compatible with Pioneer XDJ-700, XDJ-1000MK2, CDJ-2000, CDJ-3000, and CDJ-3000x decks.
specs: |-
  - 4HP width, 32mm depth
  - +12V: 90mA, -12V: 0mA
  - Ethernet input for PRO DJ-LINK™ network
  - DIN Sync style x24 clock output
  - DIN Sync style Run clock output
  - Beat trigger output
  - Bar trigger output
  - Manual Resync button with latched beat-sync
  - Reverse power protection
