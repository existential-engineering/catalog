description: Straight-fronted 2x12" guitar speaker cabinet loaded with two Celestion Seventy 80 speakers, handling 160W at 8 ohm through a single input, designed to pair with any Marshall head.
details: |-
  These straight 2x12s are great quality and value for money. What is not to love?

  They work nicely as an extension cabinet for a combo or as a match for most Marshall heads. Two powerful Celestion Seventy-80 speakers are installed in them, delivering a tight low-end and a punchy mid-range.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack. The straight base cabinet handles 160W at an 8 ohm unit impedance through a single input.

  Designed and engineered in UK. Made in Vietnam.
