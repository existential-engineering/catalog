description: Compact hanging-style cardioid condenser microphone for choral,
  instrumental, vocal group and live theater installations, with a built-in
  preamp and 25-foot braided shielded cable.
details: >-
  The Electro-Voice RE90H is a compact hanging-style condenser microphone
  designed for permanent install applications such as choral and instrumental
  ensembles, vocal groups and live theater. A controlled cardioid polar response
  allows distant sound pickup while maintaining strong resistance to feedback,
  making the microphone well suited to suspended placement above performers.


  The capsule is a back-electret condenser element housed in a small steel body
  — 37 mm tall and 13 mm in maximum diameter — finished in non-reflective black
  to blend into stage and venue environments. A white-finish variant is
  available as the RE90HW. Net weight is 0.157 kg, keeping the suspended mass
  low enough for inconspicuous hanging installations.


  Electro-Voice integrates a preamp into the cable assembly along with a 25-foot
  braided, shielded low-noise cable, so the microphone reaches a stage box or
  wall plate without additional inline accessories. Output is a balanced
  low-impedance signal at 200 ohms on a 3-pin XLR connector, with an open
  circuit voltage of 27 mV. Powering is via standard 9–52 VDC phantom power,
  allowing the mic to run from any modern console or stage box phantom supply.


  Frequency response is specified at 75 Hz – 15,000 Hz (-3 dB), a range tailored
  to vocal and acoustic ensemble sources rather than full-range program
  material.
specs: |-
  - Mic type: Hanging
  - Element: Condenser (back-electret)
  - Polar pattern: Cardioid
  - Frequency response (-3 dB): 75 Hz - 15,000 Hz
  - Impedance (low-Z balanced): 200 ohms
  - Open circuit voltage: 27 mV
  - Power requirement: 9 - 52 VDC
  - Connector: 3-pin XLR
  - Cable: 25-foot braided, shielded, low-noise (built-in preamp)
  - Wired/wireless: Wired
  - Height: 37 mm
  - Maximum diameter: 13 mm
  - Net weight: 0.157 kg
  - Case material: Steel
  - Finish: Non-reflective black (RE90H) or white (RE90HW)
  - Family: RE Series Installation
