name: VX 12
manufacturer: tannoy
primaryCategory: speaker
url: https://www.tannoy.com/en/products/0312-ani
description: The VX 12 Dual Concentric Full Range Loudspeaker boasts an
  exceptional performance-to-size ratio.
details: |-
  The VX 12 Dual Concentric Full Range Loudspeaker boasts an exceptional performance-to-size ratio. VX 12 provides a compact, yet punchy and sonically articulate solution for small-scale performance sound reinforcement, as well as more demanding background music and high-intelligibility speech applications where clarity and natural vocal reproduction are paramount. Thanks to its twin driver design and flexible mounting options, the VX 12 is also ideally suited for use complimenting much larger systems, making it an excellent choice for both installed and portable applications.
specs: |-
  - Frequency Response: 70 Hz – 25 kHz ±3 dB / 55 Hz – 38 kHz -10 dB
  - Nominal Dispersion: 90° conical @ -6 dB point
  - Directivity Factor (Q): 9.6
  - Directivity Index (DI): 9.8
  - Sensitivity: 97 dB (1 W @ 1 m)
  - Maximum SPL (Passive): 120 dB continuous, 126 dB peak
  - Impedance (Passive): 8 Ω
  - Power Handling: 200 Watts continuous, 800 Watts peak
  - Crossover Type: Passive with HF protection
  - Components: 1 x 12" (305 mm) constant directivity Dual Concentric
  - Connectors: 2 x Industry-standard 4-pole twist-lock speaker connectors, 1 x barrier strip terminals
  - Connector Wiring (Passive): Pins 1+ / 1- Input, Pins 2+ / 2- Link
  - Dimensions (H x W x D): 487 x 371 x 361 mm (19.2 x 14.6 x 14.2")
  - Net Weight: 16.5 kg (36.3 lbs)
  - Construction: 15 mm (5/8") enclosure / 18 mm (3/4") front, plywood, vented and internally braced
  - Finish: Semi matt black paint (white optional)
  - Grille: Powder coated perforated steel
  - Flying Hardware: M10 x 8 flying inserts (portrait or landscape mounting), M10 x 8 yoke bracket inserts, 2 x Integrip carrying handles, Blanking plate for optional VTH pole mount, Compatible with industry standard brackets, M6 x 4 inserts
