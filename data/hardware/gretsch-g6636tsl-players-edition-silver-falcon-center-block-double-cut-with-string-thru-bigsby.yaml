details: |-
  Gretsch Players Edition features are designed to instill complete confidence in the instrument - ultimate stability and maximum comfort from tailpiece to tuners.

  The G6636TSL Players Edition Silver Falcon Center Block Double-Cut with String-Thru Bigsby is an innovative new version of the venerable Falcon, with a slightly smaller 16" double-cutaway body and a chambered spruce center block that enhances body resonance.

  Built to perform, this Falcon rocks dual High Sensitive Filter'Tron pickups for authentic Gretsch power and articulation that can be fine-tuned with comprehensive control layout featuring a master volume with treble bleed circuit.
