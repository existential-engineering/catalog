details: |-
  The Microtubes 500 V2 is a 500W bass amplifier head equipped with an all-analog solid-state preamplifier and a custom Class D power module. It gives access to the signature Dual Microtubes engine, combining the B3K and Vintage drive circuits.

  A cabinet simulation offers three selectable impulse responses, and a USB connector lets users load their own IRs. Tone shaping comes from a studio-grade 6-band graphic EQ paired with an intelligent compressor.

  Connectivity is expanded with an aux input, a headphone output, and a DI output, making the amp equally at home on stage or for silent practice and recording.
specs: |-
  - 500W bass amplifier head with signature Darkglass distortion engines
  - All-analog solid-state preamp with custom Class D power module
  - Dual Microtubes engine: B3K and Vintage drive circuits
  - Cab sim with 3 selectable impulse responses
  - Studio-grade 6-band graphic EQ and intelligent compressor
  - Aux in, headphone output, and DI output
  - USB connector to load user impulse responses
