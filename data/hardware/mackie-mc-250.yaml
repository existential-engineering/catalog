details: |-
  The MC-250 represents a significant upgrade in clarity and accuracy, featuring a studio-quality 50mm driver that delivers clear, distortion-free sound. The headphones combine an ergonomic headband design with extra-soft ear pads engineered for extended comfort during mixing sessions, critical listening, or personal audio enjoyment.

  The device employs precision-tuned enclosure technology to achieve deep bass response, smooth midrange frequencies, and excellent detail reproduction. Its reference-quality 50mm transducers provide high-headroom monitoring suitable for professional studio environments.

  A collapsible fold-up design enables portable storage and travel convenience. The package includes a 9.8-foot detachable high-quality straight cable with locking bayonet connector, gold-plated 1/4" adapter, and protective carry bag.
specs: |-
  - Transducer Size: 50mm
  - Frequency Response: 10Hz – 20kHz
  - Impedance: 38 Ohms
  - Sensitivity: 100 dB
  - Weight: 265g (9.35 oz)
  - Cable: 9.8 ft. detachable with locking bayonet connector
  - Closed-back design
  - Collapsible fold-up design
  - Includes gold-plated 1/4" adapter and carry bag
