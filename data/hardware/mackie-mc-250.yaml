details: |-
  Made for the Studio

  MC-250 headphones offer a big step up in clarity and accuracy. They feature an upgraded studio quality 50mm driver for clear, distortion-free sound, an ergonomic headband, and extra-soft ear pads for hours of listening comfort, suited to mixing, critical listening, and personal listening.

  High-Performance Monitoring Headphones

  High-headroom, reference-quality 50mm transducers provide an accurate reproduction of your mix and your music, and the precision-tuned enclosure delivers deep bass, smooth midrange and detail.

  Professional Design

  The soft padded adjustable headband and conforming ear pads provide an ergonomic fit for hours of comfort while ensuring optimal low-end and sound isolation. The rugged design is built to last and meet the demands of professionals in the studio or on location.

  Take Them Anywhere

  A collapsible fold-up design allows for easy storage and compact portability when traveling. A 9.8 ft detachable straight cable with locking bayonet connector, a gold-plated 1/4-inch adapter and a carry bag are included.
