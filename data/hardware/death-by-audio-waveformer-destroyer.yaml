url: https://deathbyaudio.com/products/xcolorway-waveformer-destroyer
description: A distortion pedal offering hundreds of customizable fuzz,
  overdrive, and distortion tones via four footswitches and eight internal DIP
  switches.
details: |-
  BONE CRUSHING DISTORTION Hundreds of possible distortion sounds at your fingertips, customizable via four selectable foot switches and eight internal DIP switches. Set it and forget it, then dig back in when you want to change things up again. This gives you a ton of fuzz, overdrive, and distortion sounds you will become addicted to. Perfect for the road where you don't want to lose your carefully found settings, the Waveformer is capable of almost any sound you can dream of, and several hundred that most wouldn't dare to. Details Are your pedals covered in gaff tape because you’re sick and tired of stage divers messing up your settings? Or maybe you’re the stage diver? Either way, the Waveformer Destroyer lets you set-it-and-forget-it forever (until you change your mind) so your crushing distortion tone is perfect at every gig you play. Instantly flip between hundreds of possible distortion sounds (customizable via four footswitches and eight internal DIP switches) for industrial-grade buzzsaw treble grind, mid-scooped high-gain thrashin’, warm low-gain overdrive, garage-y transistor fuzz, or any one of the twisted and distorted sounds within. When you’re ready to change it up, pop off the backplate and start flipping switches to modify the circuit–no soldering experience required. Controls EXTERNAL ENGAGE Pulverize your sound with massive crunch and sustain. Turns on the Waveformer Destroyer. True bypass. BOOST A hyper booster/blaster/alterer. TONE An advanced equalizer filter, so you only hear what you want to hear. BLAST The insanity switch. Blast your sound beyond the outer reaches of what is considered normal (or sane) with gated fuzzes or gained-up electric rock and roll blowouts. MASTER Controls the output volume of the effect. INTERNAL OVERLOAD 1 (Engage) OVERLOAD 2 (Engage) THIN / Full (Boost) TRASH / SMOOTH (Boost) DEEP / WIDE (Filter) NORM / SHIFT (Filter) BREAK / SAW (Blast) CRUSH / BLAST (Blast) Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 6 mA Physical Details Dimensions: 5.87" x 4.72" x 2.26" (including hardware) Weight: 20 oz.
specs: |-
  - Clipping Diodes on or off
  - High or low gain
  - Treble or full range
  - Limiting harmonic boost or bass boost
  - Mild mid scoop or extreme mid scoop
  - Center mid scoop or shifted scoop
  - CLipping diodes off or on
  - Mis-biased gain or normal bias gain
