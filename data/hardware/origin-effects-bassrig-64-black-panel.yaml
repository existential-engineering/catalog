details: |-
  The BASSRIG '64 Black Panel is, quite simply, a complete vintage bass amp in a pedal. Based on Fender's Showman and Bassman amplifiers, Origin Effects used all-analogue circuitry to recreate a complete valve amp-style signal path, along with an all-analogue cabinet simulator, giving the drive, grit and articulation of these classic amps in one small box.

  Back in the days before modern bass amps, achieving high stage volumes with bass guitar was a challenge that required powerful, clean amps. Fender's high-powered amps, designed with guitar and bass in mind, graced countless stages and studios throughout the 1960s. The Showman, with its 2x15 cabinets, and the later Bassman models were used by artists including Sir Paul McCartney, Crazy Horse's Billy Talbot, and Berry Oakley of The Allman Brothers.

  With XLR and 1/4" outputs, the BASSRIG '64 Black Panel fits seamlessly into any signal chain, no matter how simple or complex, and its powerful Amp Out EQ tailors the sound to work with any amp, meaning you never have to compromise your clean tone.

  Housed in a hand-polished, brushed stainless steel enclosure and furnished with aluminium controls, Neutrik jack sockets and a heavy-duty footswitch, the BASSRIG '64 Black Panel is equally at home on the road and in the studio.
specs: |-
  - Complete valve amp-style signal path with dedicated class-A preamp and push-pull output stage, based on the Fender Showman and Bassman
  - Balanced DI output with analogue cabinet simulator based on an early '60s Fender 2x15 bass cabinet
  - Reactive design simulates interaction between amp and speaker for realistic feel and authentic sound
  - Full range of Fender bass tones from clean to overdriven
  - Powerful tone-shaping Amp Out EQ
  - Blend control lets you mix your drive sound in parallel with your clean signal
  - Tour-grade, all-metal construction
  - High-impedance, buffered bypass with silent switching
  - Designed and built in England
  - Dimensions: 146 x 93 x 65 mm (5.74 x 3.6 x 2.5 in.)
  - Weight: 846 g (1.86 lb)
  - Input Impedance: 1 M ohm
  - Output Impedance: 500 ohm
  - Current Draw: 150 mA
  - Power Supply: 9V DC, 2.1mm centre-negative barrel connector (mains adaptor only, no battery option)
