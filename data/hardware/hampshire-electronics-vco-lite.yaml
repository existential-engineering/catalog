description: VCO Lite is a compact analog Eurorack oscillator built around the
  SSI2131 chip, providing sine, triangle, saw and pulse waveforms with PWM,
  exponential/linear FM, and hard/soft sync.
details: |-
  The VCO Lite from Hampshire Electronics is a compact, high-performance analog oscillator built around the legendary SSI2131 chip. Delivering smooth, musical waveforms and rock-solid tracking, the VCO Lite provides the essential power of a precision VCO in a streamlined Eurorack format. Designed for reliability and immediacy, this module combines a warm analog tone with simple, intuitive controls — perfect as a standalone sound source, an FM pair partner, or part of a complex modular voice. Hand-assembled in England , the VCO Lite offers all the classic features you expect from a professional analog oscillator — without unnecessary complexity. Please note that due to issues sourcing some knobs, the coarse tune / octave knob may be substituted for a different but similar knob. VCOLite Manual: Download VCOLite Manual PDF

  Key Features

  Controls & Patch Points

  Specifications

  The VCO Lite distills the essentials of analog synthesis into a reliable, great-sounding oscillator — perfect for any Eurorack setup, from minimalist voices to complex polyphonic systems.
specs: |-
  - Based on the SSI2131 precision VCO IC — stable, musical, and temperature-compensated
  - Classic waveforms: sine, triangle, saw, and pulse
  - PWM control with manual and CV modulation
  - Exponential and linear FM inputs for wide-ranging modulation options
  - Hard and soft sync for harmonic or phase-locked sounds
  - Octave selector and fine-tune knob for quick pitch adjustments
  - Compact design for efficient rack space use
  - Knobs: Octave, Tune, PW, PWM, FM
  - Inputs: CV, PWM, LIN FM, FM, H-SYNC, S-SYNC
  - Outputs: Triangle, Saw, Pulse
  - Format: Eurorack module
  - Width: 14HP
  - Power: ±12V Eurorack standard
  - Core: SSI2131 analog VCO
  - Tracking: 1V/Oct, temperature-compensated
  - Construction: Hand-assembled in England
