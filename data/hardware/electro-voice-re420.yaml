details: >-
  The Electro-Voice RE420 is a premium-grade, high-performance condenser
  cardioid vocal microphone designed to capture vocal performances with
  exceptional detail. Its sonic character combines a warm and clear low end, a
  natural and present midrange, and an open, crisp and detailed high end, making
  it suitable for both live stage use and studio applications.


  A self-biased condenser element drives the RE420's response from 50 Hz to 20
  kHz, with a sensitivity of 5.6 mV/Pa (-45 dBV/Pa) and a maximum SPL of 149 dB
  (1% THD), giving the mic plenty of headroom for loud vocal sources. Self noise
  is rated at 22 dB SPL (A-weighted), yielding a 127 dB dynamic range and a
  signal-to-noise ratio of 72 dB.


  The cardioid polar pattern provides excellent acoustic isolation and off-axis
  rejection, helping the mic stay stable against stage monitors and reject
  bleed. Practical refinements include a multi-stage pop filter with two foam
  layers separated by an air gap to minimize plosives and breath blasts, a
  selectable high-pass filter (flat or -150 Hz) for taming proximity-induced low
  end, and an internal vibration-absorbing shock mount to reduce handling noise.


  The RE420 is built around a zinc die cast body with a steel wire cloth grille,
  finished in black polyurethane paint. It measures 7.6 in (193 mm) in length
  with a 1.95 in maximum diameter and a 0.96 in shank, and weighs 11.5 oz (326
  g). Output is via a balanced 3-pin XLR connector at 200 ohms, requiring 48 VDC
  phantom power.
specs: |-
  - Element: Self-biased condenser
  - Polar pattern: Cardioid
  - Frequency response: 50 Hz - 20 kHz
  - Sensitivity (open circuit): 5.6 mV/Pa (-45 dBV/Pa)
  - Maximum SPL: 149 dB SPL (1% THD)
  - Self noise: 22 dB SPL (A-weighted)
  - Dynamic range: 127 dB
  - Signal-to-noise ratio: 72 dB
  - Output impedance: 200 ohms
  - Power requirements: 48 VDC phantom power
  - Connector: 3-pin XLR
  - High-pass filter: Selectable flat or -150 Hz
  - Length: 7.6 in (193 mm)
  - Maximum diameter: 1.95 in
  - Shank diameter: 0.96 in
  - Net weight: 11.5 oz (326 g)
  - Materials: Zinc die cast body, steel wire cloth grille
  - Finish: Black polyurethane paint
