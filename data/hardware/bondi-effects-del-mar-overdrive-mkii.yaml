description: The Del Mar mk2 is an overdrive/boost pedal that blends a
  Klon-style clean character with a Tubescreamer-style clipping stage. It offers
  clean boost, overdrive, or a blend, with an internal voltage boost to 24V and
  an active tonestack.
details: |-
  Back and better than ever! The Del Mar mk2 combines the much-lauded Del Mar sound with the refinements that a further decade of engineering experience brings. These refinements include:

  The Del Mar was conceived in an effort to add a Tubescreamer-style clipping stage to the Klon Centaur. I've always loved the clean half of the Centaur, but my favourite clipping stage has always been the articulate and detailed response of the Tubescreamer. My engineering sensibilities at the time were perhaps somewhat naive, and my attempts to incorporate aspects of the Klon, Tubescreamer and Bluesbreaker actually resulted in something that is not exactly like any of them. In retrospect, I think that engineering things in the "wrong" way resulted in an inadvertently unique result, which at this stage and with the benefit of hindsight, is something I've come to be very proud of. Features:

  Tech Specs:

  Shipping Information

  User Manual

  Download the User Manual - PDF

  View this post on Instagram

  A post shared by Will Bennett - Gear Demos (@williamjohnbennettiii)
specs: |-
  - Our cleanest, most robust power supply ever
  - The lowest noise floor of any pedal in our line
  - Significantly reduced noise (22dB improvement to the SNR compared to the Del Mar Overdrive mk1)
  - Quiet true-bypass switching
  - R obust power input protection
  - Clean Boost, Overdrive, or a blend of the two
  - Dynamic and natural, responsive to your pick attack or volume knob
  - Internally boosted to 24 volts - just plug in your normal 9V power supply and we take care of the rest
  - Toggle switch, controlling the amount of headroom and character of the drive (the lower position gives an aspect of "Bluesbreaker" style clipping)
  - Powerful active tonestack, capable of 15dB of boost or cut
  - Soft touch true-bypass switching
  - Input Impedance 500kOhms @ 1kHz
  - Output Impedance <10kOhms @ 1kHz (passive volume control)
  - Dimensions: 126.5mm*66.0mm*55.5mm
  - Power Requirements: 9V DC 100mA
  - Australia: Ships via Australia Post within 1-3 business days
  - USA: Ships from US warehouse via USPS Priority Mail within 1-5 business days (no international fees)
  - International: Ships from Sydney via DHL Express
  - Note: Some products are stocked exclusively at our Sydney lab but can be shipped to the USA. For these items, international shipping rates will apply.
