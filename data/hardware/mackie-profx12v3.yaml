description: Designed for musicians and creators who want high-resolution audio,
  The Mackie ProFX12v3 is an analog USB mixer with effects and award-winning
  Onyx mic preamps.
details: |-
  Experience the best-in-class series of professional analog USB mixers with effects. The Mackie ProFX12v3 is a 12-channel mixer that gives recording artists, live performers and content creators a new level of studio-quality performance.

  Legendary sound is within reach, whether you're recording a podcast or performing at a coffee shop. The Mackie ProFX12v3 features seven award-winning Onyx preamps and a versatile GigFX effects engine, allowing you to get colorful high-resolution recordings with sample rates up to 192 kHz.

  Channels 1 and 2 are XLR and 1/4 inch combo inputs with Hi-Z switches, channels 3 and 4 add separate XLR mic and 1/4 inch line jacks, all four mono channels carry single-knob compression and a 1/4 inch insert. Channels 5/6, 7/8 and 9/10 are hybrid stereo channels pairing an XLR mic input with left/mono and right 1/4 inch line inputs, and channel 11/12 takes the 1/8 inch stereo input or the USB 3-4 return.

  The GigFX engine offers 24 presets covering rooms, halls, plates and a spring reverb, choruses, a doubler, echo and ping-pong delays, flange, auto-wah and an overdrive/distortion, with an FX send jack and a footswitch input for FX mute.

  A 2x4 24-bit / 192 kHz USB interface records to Mac or PC and returns two independent stereo streams. Outputs include main mix on XLR and 1/4 inch, stereo control room outputs, a stereo sub 1-2 output bus, a mon send and a headphone jack. Power comes through a 3-pin IEC line cord and a universal 100-240 VAC supply.
specs: |-
  - 12-channel USB mixer with seven low-noise, high-headroom Onyx preamps providing 60 dB of gain
  - 3-band EQ with On/Off hard bypass switch on all channels (80 Hz low, 2.5 kHz mid, 12 kHz high, +/-15 dB)
  - 100 Hz low-cut filter at 18 dB/octave and 48V phantom power on all mic channels
  - Single-knob compression on channels 1-4
  - Switchable Hi-Z inputs on channels 1 and 2 for guitars, bass and other instruments
  - Four 1/4 inch channel inserts on channels 1-4
  - 24 GigFX effects presets: Bright Room, Warm Lounge, Small Stage, Warm Theater, Warm Hall, Concert Hall, Cathedral, Small Plate, Large Plate, Chorus 1, Chorus 2, Delay + Reverb, Doubler, Echo, Delay 1, Delay 2, Delay 3, Ping-Pong Delay, Overdrive/Distortion, Spring Reverb, Early Reflections, Auto-Wah, Flange and Slapback Reverb
  - 24-bit / 192 kHz 2x4 USB recording interface (1 stereo input, 2 stereo outputs)
  - Dual stereo USB return with latency-free direct monitoring and a blend control
  - Aux/mon send with dedicated per-channel send control
  - Stereo sub 1-2 output bus with per-channel assignment
  - Dedicated stereo control room outputs and headphone output with separate level and blend control
  - Footswitch input for FX mute
  - Break switch mutes all channels to the main, control room and phones outputs
  - Two columns of 12-segment main meters
  - Equivalent input noise -126 dBu, all inputs +22 dBu maximum, main mix XLR +28 dBu
  - Universal 100-240 VAC power supply via 3-pin IEC line cord, 30 watts
  - Rack-mountable using the optional ProFX12v3 rack ear kit
  - Dimensions 13.0 x 14.8 x 4.0 in / 330 x 376 x 102 mm, weight 7.9 lb / 3.6 kg
