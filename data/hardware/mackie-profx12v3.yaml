description: "Mackie ProFX12v3 12-channel professional analog mixer with USB,
  featuring seven Onyx mic preamps, the GigFX effects engine, and 192 kHz USB
  recording."
details: |-
  Legendary sound is within reach, whether you're recording a podcast or performing at a coffee shop. The Mackie ProFX12v3 features seven award-winning Onyx preamps and a versatile GigFX effects engine, allowing you to get colorful high-resolution recordings with sample rates up to 192 kHz.

  Record podcasts, stream gameplay or produce the next hit—all with ultra-clean, transparent audio. Our award-winning Onyx Mic Preamps deliver analog warmth so you sound great, no matter what you do.

  The Mackie ProFX12v3 has a high-resolution effects engine to give your sound the perfect touch, whether you need to add a bit of reverb to a guitar track or give your podcast a creative edge.

  Waveform OEM is a multi award-winning workstation, featuring powerful and creative tools to inspire the modern musician.
specs: |-
  - 12-channel USB mixer with seven low-noise Onyx preamps (60dB gain)
  - 3-band EQ with On/Off hard bypass switch
  - Dual stereo USB return
  - Latency-free direct monitoring
  - High-resolution recording up to 192 kHz via USB (2x4)
  - 24 included effects (reverbs, delays, choruses) via GigFX engine
  - Built-in compression
  - Switchable Hi-Z inputs for guitars/bass
  - 100Hz low-cut filter and 48V phantom power
  - Aux/Monitor with per-channel send control
  - Stereo subgroup output bus with per-channel assignment
  - Headphone output with separate level and blend control
  - Footswitch input for FX mute
  - Waveform OEM professional software bundle included
