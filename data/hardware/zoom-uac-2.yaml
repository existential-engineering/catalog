description: USB 3.0 SuperSpeed audio converter for Mac and PC, a bus-powered
  2-in/2-out interface that adds two channels of 24-bit/192 kHz audio to any USB
  2.0 or 3.0-equipped Windows or Mac computer, or an iPad.
details: |-
  The UAC-2 is a bus-powered 2-in/2-out SuperSpeed USB 3.0 audio converter in a compact metal housing, adding two channels of 24-bit/192 kHz audio to any USB 2.0 or USB 3.0-equipped Windows or Mac computer. A Class Compliant Mode switch lets it run from an iPad, which needs the optional AD-14 power adapter and an Apple Camera Connection Kit or Lightning to USB Camera Adapter.

  Two front-panel combo XLR/TRS inputs take microphones, line-level signals from keyboards and players, and, with the Hi-Z switches engaged, a passive electric guitar or bass plugged in directly. Each input has its own gain control and clip LED, the mic preamps offer up to +60 dB of gain, and a phantom power switch applies +48V. Two balanced TRS output jacks on the rear feed amplifiers or self-powered speakers, and an independent 1/4-inch stereo headphone jack with its own volume control handles private monitoring. A large Output knob sets the overall level and a three-way Direct Monitoring switch gives zero-latency monitoring of the input in mono or stereo.

  The rear-panel USB 3.0 connector carries audio to and from the computer and powers the unit, so no batteries or external supply are required. MIDI In and Out on 5-pin DIN connectors synchronise electronic keyboards, controllers, drum machines, and synthesizer or sampler modules.

  The SuperSpeed USB 3.0 transfer protocol is ten times faster than USB 2.0 and six times faster than FireWire 800, giving a 2.2 ms roundtrip at 96 kHz and 32 samples and a data stream unaffected by computer jitter, so no external master clock source is needed. USB 3.0 also carries 900 mA against USB 2.0's 500 mA, which is what allows the higher-end preamps and converters inside.

  Conversion uses a Burr Brown PCM4202 analog-to-digital converter and an AKM AK4396 digital-to-analog converter with 4x upsampling in both directions, so a session at 44.1 kHz or 48 kHz is processed at 176.4 kHz or 192 kHz. A Loopback function blends the connected mics, instruments and line-level sources with audio playing back on the computer and routes the mix to streaming software. The free UAC-2 MixEfx application for Mac and Windows sets the mix parameters and adds reverb and echo effects, a low cut filter, phase reverse and per-input auto gain, with three memory slots for quick recall.
specs: |-
  - 2-in/2-out SuperSpeed USB 3.0 audio interface, 2 recording and 2 playback channels
  - Sampling frequencies: 192 / 176.4 / 96 / 88.2 / 48 / 44.1 kHz, 24-bit
  - Inputs 1/2: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain 0 to 60 dB in 1 dB steps
  - Inputs 1/2: input impedance 5 kOhm, or 1 MOhm with Hi-Z on. Max input level +12 dBu at 0 dBFS
  - Phantom power: +48V
  - L/R output: 1/4-inch TRS jacks (balanced), max output level +14 dBu at 0 dBFS, output impedance 100 Ohm
  - Phones output: 1/4-inch stereo phone jack, 20 mW + 20 mW into 32 Ohm, max output level +8 dBu, output impedance 33 Ohm
  - Dynamic range: A/D 118 dB typical (IHF-A), D/A 120 dB typical (IHF-A)
  - Frequency characteristics: -1.0 dB, 20 Hz to 60 kHz at 192 kHz. 20 Hz to 40 kHz at 96 kHz. 20 Hz to 20 kHz at 44.1 kHz
  - Measured conversion noise (EIN): -125 dBu (IHF-A) at 60 dB gain, 150 Ohm input
  - MIDI in/out: 5-pin DIN jacks
  - Converters: Burr Brown PCM4202 A/D and AKM AK4396 D/A, with 4x upsampling in both directions
  - USB 3.0 roundtrip latency: 2.2 ms at 96 kHz / 32 samples
  - Interface: USB 3.0, power source USB 3.0 bus power or AD-14 AC adapter (DC 5V 1A)
  - Power consumption: 5 W maximum
  - Dimensions: 113.9 mm (D) x 176.0 mm (W) x 46.2 mm (H), weight 750 g
  - Windows system requirements: Windows 8 to 11 (32/64-bit), Intel Core i3 or faster, USB 3.0 or USB 2.0 with an Intel chipset host controller
  - Mac system requirements: macOS 10.14 to 26, Intel Core i3 or faster, USB 3.0 or USB 2.0
  - iPhone/iPad system requirements: iOS 7.1 to 26, with the optional AD-14 adapter and an Apple Camera Connection Kit or Lightning to USB Camera Adapter
  - Included: operation manual, USB 3.0 cable (1m), Cubase LE download and startup guide. Optional Zoom AD-14 AC adapter (DC 5V 1A)
