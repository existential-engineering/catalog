details: |-
  The JBL 308P MkII is a powered 8" two-way studio monitor that brings professional-grade monitoring to project studios and home studios alike. Leveraging patented technologies derived from the JBL 7 Series and M2 Master Reference Monitors, it delivers outstanding performance and an enjoyable mix experience at an accessible price.

  At the heart of the 308P MkII is the patented Image Control Waveguide, originally developed for JBL's flagship M2 Master Reference Monitor. This innovation ensures an acoustically seamless transition between the low- and high-frequency transducers and provides an immersive soundstage with precise imaging, offering a broad sweet spot and neutral frequency response.

  The monitor is bi-amplified with dual custom Class-D amplifiers delivering 56W to each driver for a total of 112 watts. The 8" LF driver pairs with a 25mm (1") soft dome tweeter, crossed over at 1800Hz using a 4th-order Linkwitz-Riley filter, producing a frequency response of 45Hz–20kHz (±3dB) and a maximum peak SPL of 112dB.

  Connectivity is flexible, featuring balanced XLR and 1/4" TRS inputs with a switchable +4dBu / -10dBV input sensitivity. The Boundary EQ control provides three LF shelf settings to compensate for room placement, while the HF Trim switch allows adjustment to room acoustics.

  The 308P MkII won Best Studio Monitors at the 34th NAMM TEC Awards and accepts universal AC input voltage of 100–240VAC for global use.
specs: |-
  - LF Driver: 203mm (8")
  - HF Driver: 25mm (1") soft dome
  - Crossover: 1800Hz, 4th order acoustic Linkwitz-Riley
  - LF Amplifier Power: 56W, Class-D
  - HF Amplifier Power: 56W, Class-D
  - Total Amplifier Power: 112W
  - Frequency Response (±3dB): 45Hz – 20kHz
  - Frequency Range (-10dB): 37Hz – 24kHz
  - Max Continuous SPL: 102dB
  - Max Peak SPL: 112dB
  - Signal to Noise Ratio: 75dBA (A-Weighted)
  - Coverage Angle: 120° x 90°
  - HF Trim Control: -2dB, 0dB, +2dB
  - Boundary EQ: LF Shelf @ 50Hz: -3dB, -1.5dB, 0dB
  - Input Sensitivity Switch: +4dBu / -10dBV
  - AC Input Voltage: 100–240VAC (±10%), 50/60Hz
  - Enclosure: Ported, 15mm MDF, Matte black PVC
  - Dimensions (H×W×D): 419 × 254 × 308mm (16.5" × 10" × 12.1")
  - Net Weight: 8.1 kg (17.87 lbs)
