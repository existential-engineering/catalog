description: The Canvas Volume Pedal is designed to give players unprecedented
  control, reliability, and flexibility from a volume pedal.
details: |-
  The Canvas Volume Pedal is designed to give players unprecedented control, reliability, and flexibility from a volume pedal. Built around a precision position sensor and high-quality VCAs (Voltage Controlled Amplifiers), Canvas Volume delivers a premium, all-analog signal path without the mechanical compromises of traditional designs. Shape the feel and response of Canvas Volume to fit your playing style with customizable features, including multiple tapers modeled from existing volume pedals, minimum-on volume, maximum gain, and lag. No strings. No pots. No gears. Nothing to wear out, get scratchy, or fail mid-set. With contactless position sensing and a robust metal chassis, Canvas Volume is designed for players who demand consistency night after night. It’s a modern volume pedal built to solve old problems without sacrificing tone or feel. Housed in a rugged steel and aluminum chassis that balances durability with pedalboard-friendly weight, Canvas Volume is engineered for years of consistent performance on stage, in the studio, and everywhere in between. Fully Analog Signal Path, Digitally Controlled Precision Canvas Volume uses a precision position sensor to track pedal movement and translate it into smooth, musical volume changes via high-quality analog VCAs. The result is the feel and tone players expect from a classic volume pedal, paired with modern consistency and control. Flexible Signal Routing Designed to integrate seamlessly into virtually any rig, Canvas Volume supports multiple signal flows: Whether you’re running a simple mono setup, a stereo board, or need dual outputs from a single input, Canvas Volume adapts easily to your workflow. Deep Customization Under the Heel The control interface is discreetly tucked under the heel of the pedal, keeping your settings safe while remaining easy to access. Two buttons and LED indicators give you control over four powerful parameters: Taper The taper defines how your volume changes across the pedal’s sweep - and it’s the key to dialing in the perfect feel. Canvas Volume includes our own custom-designed taper plus seven carefully modeled tapers from classic, real-world volume pedals. Taper 1 is custom-designed specifically for the Canvas Volume, aiming to provide an ultra-smooth response for guitar players. Tapers 2-6 provide more traditional audio tapers modeled after popular volume pedals. Tapers 7 and 8 feature models from pedals with a more linear response favored by pedal steel players: Minimum On Sets how much signal passes through when the pedal is fully heel-down. At its lowest setting, Canvas Volume provides extreme attenuation (about -90dB). Raising this value allows some signal to remain at heel-down, perfect for volume swells that never fully disappear or for faster response at the start of the sweep. Gain Controls the maximum output level at toe-down. Unity gain (0dB) sits at the default setting, with additional headroom available in 3dB increments, up to +9dB, making Canvas Volume equally capable as a clean volume boost. Lag Lag introduces a delay between pedal movement and volume response, smoothing out transitions and enhancing swells. From immediate, fast response to a dramatic 2-second lag, this parameter lets you fine-tune the pedal’s feel to your playing style. Note: Lag works alongside whichever taper you’ve chosen and will respond to that taper’s curve. For example, a linear taper curve will have an equal amount of lag going from toe down to heel down positions. Lag following a non-linear curve will swell into a toe-down position quicker than going into a heel-down position. Utility Menu & Advanced Functions Canvas Volume includes a built-in Utility Menu for deeper system control: These tools ensure your pedal stays dialed in, accurate, and ready for long-term use.
specs: |-
  - Mono In / Mono Out with Dedicated Tuner Out
  - Stereo In / Stereo Out
  - Mono In / Dual Mono Out
  - Taper One (Canvas Taper)
  - Taper Two (Lehle model)
  - Taper Three (Boss model)
  - Taper Four (Dunlop model)
  - Taper Five (Ernie Ball VP Jr model)
  - Taper Six (Hotone model)
  - Taper Seven (Hilton model)
  - Taper Eight (Goodrich model)
  - Factory Reset – Restore all settings to factory defaults
  - Calibration – Easily recalibrate pedal travel for precise operation
  - Mono Mode Selection – Choose between tuner output or dual mono output when running mono
  - DFU Mode – For firmware updates (only when directed by Walrus Audio support)
