description: The Waldorf STVC is a string synthesizer with an integrated
  vocoder, featuring an oscillator bank with octave dividers, a complex mixer,
  equalizer, and ensemble effects. It combines vintage string machine character
  with modern synthesis capabilities and vocal processing through a 16-voice
  solo synthesizer section.
details: |-
  The STVC's string section employs an oscillator bank using octave dividers followed by a sophisticated mixer. Users can adjust settings for Violin, Viola, Brass, Cello, Choir, and Organ voices through a single registration knob, enabling quick tonal adjustments reminiscent of classic 1970s string machines while maintaining modern flexibility.

  The integrated vocoder replaces the equalizer with a filter bank that models the vocal tract, accepting speech input. Its fully polyphonic design allows creation of intelligible speech or singing effects, with formant modification capabilities producing hoarse, creaky, or whispered vocal characteristics through adjustable string oscillator jitter.

  A distinctive Freeze feature captures short speech fragments, allowing repetition and manipulation via key presses. Playback speed, direction, and formants remain adjustable post-capture. The Tweak function enables modulation of parameters like solo cutoff frequency or Chorus LFO rate through fixed values or offsets, functioning similarly to a modulation matrix.

  Effects include Phaser, high-quality adjustable Reverb, and ANimate for registration modulation, all operating simultaneously. The hardware features a full metal case, 49-key velocity and aftertouch-sensitive keyboard, a 128x64 pixel OLED display, and an included 44cm gooseneck microphone.
specs: |-
  - 8-voice polyphony for strings, 16-voice for solo section
  - 49 non-weighted keys with aftertouch and velocity sensitivity
  - Octave divider-based oscillator bank
  - 126 programmable patches across three banks
  - 1 LFO, 1 VCA
  - Effects: Animate, Phaser, Reverb
  - MIDI In/Out
  - 128x64 pixel OLED display
  - Full metal case construction
  - Approximately 7.5 kg
  - Includes 44cm gooseneck microphone
