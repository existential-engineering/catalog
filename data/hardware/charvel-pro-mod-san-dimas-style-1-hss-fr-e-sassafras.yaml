description: An ideal instrument for dazzling high-speed playing, the Pro-Mod
  San Dimas Style 1 HSS FR E Sassafras delivers scorching sound, stunning style
  and grin-inducing playing feel. Part of the Pro-Mod series, it pairs a
  sassafras San Dimas Style 1 body with HSS Seymour Duncan electronics and a
  Floyd Rose 1000 Series double-locking tremolo system.
details: |-
  The Pro-Mod San Dimas Style 1 HSS FR E Sassafras pairs a sassafras San Dimas Style 1 body in a Satin Black finish with black hardware. The bolt-on maple neck features graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics feature an HSS configuration: a Seymour Duncan JB TB-4 humbucker in the bridge, a Seymour Duncan Custom Flat Strat SSL-6 single-coil in the middle, and a Seymour Duncan Custom Flat Strat SSL-6 RWRP single-coil in the neck. Controls include a volume knob and a no-load tone control, with a 5-position blade switch offering full bridge, bridge inner coil and middle, bridge outer coil and neck, middle and neck, and full neck pickup positions.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with brass tremolo block and locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, knurled flat-top control knobs, and a black switch tip. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build.
