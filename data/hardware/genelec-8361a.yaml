url: https://www.genelec.com/8361a
description: "The flagship of The Ones range, the 8361A offers the most advanced
  acoustic performance of any studio monitor on the planet."
details: |-
  The 8361A is the flagship of Genelec's "The Ones" range of coaxial point-source studio monitors, housed in a die-cast aluminium Minimum Diffraction Enclosure with a reflex port. It combines dual 263 × 137 mm obround bass cones with a coaxial mid/treble assembly using a 130 mm midrange and a 25 mm metal-dome tweeter, all radiating from a single acoustic axis for highly stable imaging and an exceptionally wide, even listening window.

  Each driver section is powered by its own Class D amplifier — 700 W for the bass, 150 W for the midrange, and 150 W for the treble — with active crossovers at 320 Hz (bass/mid) and 2800 Hz (mid/treble). The system delivers a peak SPL of at least 124 dB and reproduces 30 Hz to 43 kHz (-6 dB), giving it the headroom and bandwidth expected of a full-range main monitor in a compact freestanding cabinet.

  As a Smart Active Monitoring (SAM) product, the 8361A is compatible with Genelec Loudspeaker Manager (GLM) software for automatic room calibration across stereo, surround, and immersive setups. It received a Sound On Sound "Highly Commended" award in the Studio Monitor category in 2022.
specs: |-
  - Frequency Response: 36 Hz - 20 kHz (±1.5 dB); -6 dB: 30 Hz - 43 kHz
  - Peak SPL: ≥124 dB
  - Short Term Max SPL: ≥118 dB
  - Long Term Max SPL: ≥109 dB
  - Self Generated Noise: ≤5 dB SPL (A-weighted)
  - Harmonic Distortion: 50-100 Hz ≤3%; >100 Hz ≤0.5%
  - Crossover Frequencies: 320 Hz (Bass/Mid), 2800 Hz (Mid/Treble)
  - Bass Amplifier: 700 W Class D
  - Midrange Amplifier: 150 W Class D
  - Treble Amplifier: 150 W Class D
  - Bass Driver: Dual 263 × 137 mm obround cones
  - Midrange Driver: 130 mm coaxial
  - Treble Driver: 25 mm coaxial metal dome
  - Mains Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption ISS Active: ≤1.5 W
  - Power Consumption Full Output: 600 W
  - Weight: 31.9 kg (70.3 lb)
  - Dimensions: 593 × 357 × 347 mm (H × W × D) with Iso-Pod
