description: The ZDM-1 is a large-diaphragm supercardioid dynamic microphone for voice work, specified for a 50 to 18,000 Hz frequency response, a 135 dB maximum SPL, an internal shock mount against handling noise and a humbucking coil against electromagnetic interference. It ships with a windscreen, a pivoting stand mount and a threaded European stand adapter.
details: |-
  The ZDM-1 is a large-diaphragm dynamic microphone aimed at voice work, pitched by Zoom at podcasting and music alike. It is specified for a frequency response of 50 to 18,000 Hz with a sensitivity of -54 dBV/Pa (2.0 mV), a 200 ohm output impedance and a 200 ohm minimum load, giving tight bass with a smooth high end.

  The polar pattern is supercardioid, so pickup is tightest on axis and lowest at 120 to 135 degrees off it, which rejects sound arriving from the sides and raises gain before feedback. The manual pairs that with placement guidance: keep the capsule as close to the source as practical, and follow a 1:3 rule between microphones, so if a source sits one unit from its own microphone it should be at least three units from any other.

  Maximum SPL is 135 dB, roughly between a jackhammer and a jet engine, so loud sources can be close-miked without clipping. Two forms of isolation are built in: a shock-absorbing mechanism suspends the capsule against handling noise, stage noise and ambient vibration, and a humbucking coil rejects electromagnetic interference from power lines, monitors, phones and similar sources.

  The body and grille are all metal, and the capsule terminates in a male XLR connector, so the microphone needs a preamp with no phantom power. Overall dimensions are 150 mm long by 54 mm in diameter at 0.4 kg, and the box adds a custom ZDM-1 windscreen, a pivoting mic stand mount and a threaded European stand adapter.
specs: |-
  - Type: dynamic, large-diaphragm
  - Polar pattern: supercardioid, highest sensitivity on axis and lowest at 120 to 135 degrees
  - Frequency response: 50 to 18,000 Hz
  - Sensitivity: -54 dBV/Pa (2.0 mV)
  - Output impedance: 200 ohm, minimum load impedance: 200 ohm
  - Maximum SPL: 135 dB
  - Connector: XLR-M
  - Passive dynamic capsule, so no phantom power or battery is required
  - Internal shock mount isolates the capsule from handling noise and mechanical and environmental vibration
  - Humbucking coil reduces electromagnetic interference from power lines, monitors and phones
  - All-metal body and grille
  - Dimensions: 150 mm (5.9 in) long x 54 mm (2.13 in) diameter
  - Weight: 0.4 kg (0.89 lbs)
  - Supplied: custom ZDM-1 windscreen, pivoting mic stand mount, threaded European mic stand adapter
