details: |-
  Bluetooth MIDI Pads turns your iOS and ipados devices in a wireless MIDI pads
  controller. Play your favourites iOS, ipados and desktop Bluetooth le MIDI
  DAWs and instruments from your iphone and ipad.

  Push connect button and in the opened view turn on the switch button. This
  will make your device discoverable by your Bluetooth MIDI host, connect it
  from it and you will can play your MIDI host from b.m.p.

  If your MIDI host don't support Bluetooth MIDI there are some free apps on the
  market that creates virtual Bluetooth MIDI ports.
specs: |-
  - 16 pads matrix
  - Selectable octave
  - Bluetooth low energy MIDI
  - Wireless MIDI controller
  - iOS and ipados compatible
