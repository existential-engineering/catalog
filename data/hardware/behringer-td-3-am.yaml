description: Analog bass line synthesizer built as a homage to the Roland
  TB-303, with a pure analog signal path and authentic VCO, VCF and VCA designs.
  It adds a 16-step sequencer with 250 user patterns, an onboard distortion
  circuit and 16-voice Poly Chain.
details: |-
  Only produced from 1981 to 1984, the Roland TB-303 was a tremendous commercial flop as a replacement for the bass guitar, however it soon found its place as one of the most-loved synthesizers for what became known as Electronic Dance Music (EDM). A faithful homage to the iconic synthesizer that spawned house music, plus an all-new Distortion circuit, the TD-3-AM lets you conjure up virtually any sound with incredible finesse and ease. With its pure analog signal path, 16-step Sequencer and authentic VCO, VCF and VCA filters, the TD-3-AM is sure to become one of your favorite synthesizers.

  Great care has been taken in engineering the TD-3-AM, including the true to the original VCO, VCF and VCA designs and pure analog circuitry with matched transistors. This highly-focused attention to detail is what gives TD-3-AM its ultra-flexible sound shaping capability, which covers everything from super-fat bass and lead tones to stunning effects, all the way out to the otherworldly sounds of your imagination.

  The very heart of TD-3-AM's sound is its versatile 24 dB/octave filter, which lets you freely experiment with the low-pass Cutoff frequency and Resonance settings to dial in the perfect sound. TD-3-AM's authentic Voltage Controlled Oscillator (VCO) with transistor wave-shaping circuitry is ultra-easy to use and provides your choice of reverse-sawtooth or pulse waveforms for the ultimate in sound creation.

  The onboard sequencer with 7 tracks allows you to program up to 16 steps of notes and rests and save them as a Pattern. You can record, save and recall up to 250 patterns, all of which can be stored in the 4 Groups. Your sequences can be played either in Keyboard mode, where you create and store the pattern, or Step mode which allows you to interact while composing a pattern.

  Distortion sits at the last stage in the all-analog signal path: flipping the Distortion On/Off switch and dialling in the amount of Drive adds extra power to a performance. While it is a monophonic instrument (one note at a time), TD-3-AM's 16-note Poly Chain function lets you combine multiple synthesizers for up to 16-voice polyphony. TD-3-AM has 11 controls and 28 switches for direct, real-time access to all important parameters, and its multi-I/O patchbay connects external devices.
specs: |-
  - Pure analog signal path based on the original VCO, VCF and VCA designs, with matched transistors
  - Voltage Controlled Oscillator with transistor wave-shaping, reverse-sawtooth or pulse (square) waveform
  - 4-pole 24 dB/octave low-pass resonant filter with cutoff, resonance, envelope, decay and accent controls
  - 16-step sequencer, 7 tracks, 250 user patterns per track, 4 pattern groups, Keyboard and Step modes
  - Arpeggiator with a wide range of patterns
  - Analog distortion circuit modelled after the DS-1, with Drive control and On/Off switch
  - Monophonic voice, with 16-note Poly Chain for up to 16-voice polyphony across chained units
  - 11 controls and 28 switches
  - MIDI and USB implementation with MIDI channel and Voice Priority selection
  - Multi-I/O patchbay for connecting external devices
  - Editable from the SynthTribe app (Windows and macOS, version 3.2.4)
