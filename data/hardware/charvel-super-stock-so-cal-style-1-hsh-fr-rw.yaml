description: Part of the Charvel Super Stock series, the Super-Stock So-Cal
  Style 1 HSH FR RW is a road-worn high-performance electric guitar. Crafted
  from alder, the distressed white body shows plenty of character with scrapes,
  dings, and worn finish that let you know this axe has been around the block a
  few times. A fast Speed Neck profile with rolled fingerboard edges, a 12"-16"
  compound radius rosewood fingerboard, an HSH DiMarzio pickup configuration,
  and a Floyd Rose 1000 Series double-locking tremolo combine for tuning
  stability and tonal versatility.
details: |-
  The Super-Stock So-Cal Style 1 HSH FR RW pairs an alder So-Cal body with a distressed nitrocellulose lacquer finish in Aged Arctic, accented by a tortoiseshell pickguard and aged white dot inlays. The bolt-on maple neck features graphite reinforcement, a distressed urethane finish, and a Speed Neck profile with rolled fingerboard edges. A rosewood fingerboard with a 12"-16" compound radius hosts 22 jumbo frets, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a trio of DiMarzio pickups in cream: a Super Distortion humbucker at the bridge, a Dark Matter 2 single-coil in the middle, and a PAF Pro humbucker at the neck, routed through a 5-position blade switch with master volume and master tone controls.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo, Charvel-branded die-cast tuning machines, gold Speed Knob control knobs, a cream switch tip, and a chrome hardware finish. The licensed Fender Stratocaster headstock, Charvel neck plate, and heel-mount truss rod adjustment thumbwheel complete the build. Includes a Charvel Multi-Fit Gig Bag.
