description: >-
  The E-mu Vintage Pro is a 128-voice rack-mount sound module loaded with 32MB of classic keyboard
  samples spanning three decades of iconic synthesizers, electric pianos, and organs from ARP to
  Yamaha.
details: |-
  The Vintage Pro is E-mu's tribute to the golden age of keyboard instruments, packing samples of over 30 classic keyboards into a single rack-space module. The 32MB "Classic Keyboards" ROM soundset draws from an extraordinary roster including Hammond B-3, Wurlitzer EP, Fender Rhodes, Hohner Clavinet, Farfisa, Mellotron, and iconic synthesizers from Moog, Sequential Circuits Prophet, Oberheim OBX, Roland Jupiter and Juno, ARP, and Yamaha DX7, alongside classic drum machines like the 808 and 909.

  Built on the Proteus 2000 platform, the Vintage Pro delivers 128-voice polyphony across 32 MIDI channels with over 100 synthesis parameters per preset. The 1,536 presets split between 1,024 ROM and 512 user-programmable slots cover faithful recreations of the source instruments as well as creative hybrid patches. Internal ROM expansion slots allow growth to 128MB with additional soundset cards.

  The sound engine features E-mu's expressive multi-mode resonant filters including 50 Z-plane filter types, 17 LFO waveform types including triangle, sawtooth, and random shapes, and dual stereo effects processing with 29 reverb types, 15 delay types, 8 chorus types, 7 flange types, and 5 distortion types. Four 16-bit DACs per voice handle audio conversion.

  Four real-time controls provide immediate access to sound parameters, while two sets of extra outputs and S/PDIF digital output offer flexible studio routing. Optional expansion cards ranging from orchestral to electronic genres extend the module's versatility well beyond its vintage keyboard focus.
specs: |-
  - Polyphony: 128 voices
  - Sound ROM: 32MB "Classic Keyboards" soundset (expandable to 128MB)
  - LFO: 17 types (triangle, sawtooth, random, etc.)
  - Filter: 50 types including Z-plane, highpass, lowpass, bandpass with resonance
  - Effects: 24-bit dual stereo processors (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - DAC: Four 16-bit DACs per voice
  - Keyboard: None
  - Memory: 1,536 presets (1,024 ROM, 512 user)
  - Control: MIDI (32-part multitimbral)
  - Outputs: Multiple analog, S/PDIF digital
