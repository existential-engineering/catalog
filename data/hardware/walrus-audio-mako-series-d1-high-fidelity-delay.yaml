details: |-
  The D1 is a powerful multi-function delay with five studio-grade, high-fidelity, custom-tuned programs. Create inspiring echoes from Digital, Modulated, Vintage, Dual Delay, and Reverse. Each can be tuned and tweaked with modulation, tone, age, and tap/clock subdivisions. The attack knob adds another dynamic to each program, opening up a new world for creating soundscapes. The D1 boasts stereo in and out, midi control, adjustable stereo width, and onboard presets. A workhorse of a delay that is just as ready for the road as it is the studio. The D1 has been updated for 2022 with the following upgrades: • Added stereo width control giving the D1 two different widening types – Panning and Haas Stereo Effect. • Revised the Reverse program for a stronger effect. • Revised the Vintage program to emulate a tape delay. • Added USB functionality for firmware updates via walrusaudio.io. Programs Each program can be fully customized to your taste and playing style with the Tweak knob. Digital - clean and crystal-clear delay. Mod - unique modulation LFOs applied to random repeats. Vintage – analog tape delay-inspired tones. Dual - two delays in parallel, each with different time divisions. Reverse - reads the delay memory backward. Presets The D1 can save up to nine onboard presets, and up to 128 are accessible via midi. Attack The Attack knob will soften the attack of the echoes. Bypass and Tempo Modes The D1 has three different bypass modes. True Bypass, DSP+True Bypass (trails), and DSP Bypass. Momentary Functions: Press and hold the tap switch to ramp up the repeats of the delay.
specs: |-
  - Five delay programs: Digital, Mod, Vintage, Dual, Reverse
  - Stereo in and out with adjustable stereo width (Panning and Haas)
  - MIDI control; up to nine onboard presets, 128 via MIDI
  - USB for firmware updates via walrusaudio.io
  - Attack control, three bypass modes (True Bypass, DSP+True Bypass trails, DSP Bypass)
  - In the quarter note position, the D1 offers 1/4 note and 1/4 triplet repeats.
  - In the eighth note position, the D1 offers 1/8 note and 1/4 triplet repeats.
  - In the dotted eighth note position, the D1 offers 1/4 note and.1/8 repeats.
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
