description: Signature dual effect pedal pairing a tube tape echo simulation
  with a multi-stage phaser, each effect running on its own dedicated processor.
details: |-
  The Jimi Hazel Echo Phase is a signature dual effect pedal developed with guitarist Jimi Hazel. It carries dedicated processors for each effect, which gave Keeley independent control over the sound of each side rather than sharing one processor between them.

  The echo side is a tape echo simulation, with the EP-3 and the Fulltone Tube Tape Echo used as reference points. The design recreates the distortions of the machines, the high and low pass filtering of both the tape heads and the feedback circuit as well as the output, and the natural modulation of tape. The echo becomes more mid-range focused as it repeats, which keeps successive echoes distinct.

  The phaser side takes the Small Stone as its starting point. Where that circuit is a four stage phaser, this one also offers two and six stage operation. A Range control sets the depth of the phasing in the manner of a blend control, and a Feedback control recycles the audio for a more dramatic, vowel-like effect.

  The enclosure artwork was created by Oklahoma artist Rick Sinnett. Keeley donated five dollars per pedal to Autism Speaks and a matching five dollars per pedal to the Autistic Self Advocacy Network.
