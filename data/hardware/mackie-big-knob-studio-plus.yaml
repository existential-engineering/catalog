description: Enjoy the high-resolution Onyx recording and playback solution that
  the Mackie Big Knob Studio monitor controller and interface has to offer and
  improve your studio.
details: |-
  The Mackie Big Knob Studio+ is the centerpiece in project studios, live broadcast setups, pro studios and more. With easy input and monitor switching, award-winning Onyx mic preamps, high-resolution USB recording and playback, and a dedicated amp-driven output for additional headphones, this Big Knob goes to eleven.

  When you are looking to level up your recording studio, reach for the Mackie Big Knob Studio+. With a built-in 192kHz / 24-bit recording interface, dual Mackie Onyx preamps and flexible talkback options, the Big Knob Studio+ is an all-in-one desktop interface and monitor control solution.

  The rear panel carries a locking-barrel connector fed by an external universal 100 to 240 VAC power supply, a USB 2.0 audio port, dual Onyx Wide-Z combo preamp inputs on XLR and 1/4 inch, 1/4 inch line-level source inputs, 1/4 inch 2-track outputs with a +4 dB / -10 dB level switch, and 1/4 inch monitor outputs. The front panel adds an 1/8 inch stereo line input and two 1/4 inch headphone jacks.

  The Studio+ adds a second pair of 1/4 inch source inputs, a third pair of monitor outputs, L/R aux mix / cue inputs that act as USB channels 3/4, an external talkback mic XLR input with an internal/external switch, a 1/4 inch footswitch jack for talkback, and a dedicated amp-driven studio / phones amp output pair for a headphone distribution system.
specs: |-
  - Professional source and monitor selection: 4 sources and 3 monitor pairs
  - Classic Big Knob volume control
  - Independent trim on all sources and monitor outs
  - Mono, mute and dim functions
  - Flexible 2x4 USB recording interface
  - Two boutique-quality Onyx mic preamps including phantom power for condenser microphones
  - High-resolution 192kHz / 24-bit recording and playback
  - Cue mix allows controlled blending of direct inputs with other signals for zero-latency recording
  - Flexible source connections including convenient front panel 1/8 inch input for your smartphone
  - Dual headphone outs with independent level control and both USB and Aux source options
  - Flexible talkback options including external mic input and footswitch control
  - Dedicated amp-driven studio output perfect for headphone distribution system
  - 16-segment high-resolution input source metering
  - USB format: USB 2.0, 24-bit, 192 kHz
  - Maximum levels before clipping: all inputs +22 dBu, all outputs +22 dBu
  - Universal external power supply: 100 to 240 V~, 50/60 Hz, 0.75 A
  - Dimensions: 3.2 x 11.9 x 6.8 in / 81 x 302 x 173 mm
  - Weight: 4.6 lb / 2.1 kg
  - Compatible with all major DAWs on both Mac and Windows
  - Includes Waveform OEM recording software
