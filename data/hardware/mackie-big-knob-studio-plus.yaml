url: https://mackie.com/en/products/studio-monitoring/big-knob-series/big_knob_studio_plus.html
description: "With easy input and monitor switching, award-winning Onyx mic
  preamps, high-resolution USB recording and playback, and a dedicated
  amp-driven output for additional headphones, this Big Knob goes to eleven."
details: |-
  The Big Knob Studio+ serves as a centerpiece for project studios, live broadcast setups, and professional studios. It combines a built-in 192kHz / 24-bit USB recording interface with dual Onyx boutique-quality mic preamps and flexible talkback options.

  The device offers professional source and monitor selection with four input sources and three monitor pairs, complemented by a classic Big Knob volume control. It features independent trim on all sources and monitor outputs, plus mono, mute, and dim functions for confident reference monitoring.

  The 2x4 USB recording interface includes phantom power for condenser microphones and zero-latency monitoring via a cue mix capability. Dual headphone outputs provide independent level control with USB and auxiliary source options, while a dedicated amp-driven studio output supports headphone distribution systems.

  Flexible source connections include a convenient front-panel 1/8" smartphone input, and 16-segment high-resolution input metering provides accurate visual feedback. The Big Knob Studio+ ships with Waveform OEM recording software and the DAW Essentials plug-in collection.
specs: |-
  - 4 source / 3 monitor pair selection
  - 2x4 USB recording interface
  - 192kHz / 24-bit resolution
  - Dual Onyx boutique-quality mic preamps
  - Phantom power for condenser microphones
  - Mono, mute, and dim functions
  - Independent trim on sources and outputs
  - Dual headphone outs with independent level control
  - Flexible talkback with external mic input and footswitch control
  - 16-segment high-resolution input metering
  - Front panel 1/8" smartphone input
  - Includes Waveform OEM recording software and DAW Essentials plug-in collection
