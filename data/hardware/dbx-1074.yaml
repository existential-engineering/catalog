url: https://dbxpro.com/en/products/1074
description: A discontinued 4-channel noise gate with independent threshold,
  depth, and release controls per channel, built on dbx V2 VCA technology.
details: |-
  The 1074 QuadGate offers four independent channels of gating, each with threshold, depth, and release controls. It features an internal filter that can be independently activated per channel, enabling frequency-selective gating control. The unit is built on the legendary dbx V2 VCA architecture with balanced XLR inputs/outputs and 1/4" side-chain inputs.

  The 1074 is recommended for applications including gating dry percussive sounds like snare and kick drums, controlling sounds with longer decay times such as cymbals and pianos, eliminating hum or buzz from instruments and recordings, and removing headphone leakage into microphones. Its precision noise gating capabilities make it suitable for portable, touring, and studio environments.

  Key features include true RMS level detection, stereo coupling mode, and switchable +4dBu or -10dBv operation per channel. The differentially balanced gold-plated connectors ensure professional-grade signal integrity across all four independent channels.
specs: |-
  - Four independent channels of gating
  - Independent key filtering per channel
  - Independent Threshold and Release controls
  - Differentially balanced gold-plated XLR and 1/4" inputs and outputs
  - True RMS level detection
  - Stereo Coupling mode
  - Switchable +4dBu or -10dBv operation per channel
  - Input Impedance: Balanced >50kOhm, unbalanced >25kOhm
  - Max Input: >+22 dBu balanced or unbalanced
  - CMRR: >55 dB typical at 1 kHz
  - Output Impedance: Balanced 60 Ohm, unbalanced 30 Ohm
  - Max Output: >+22 dBm balanced, >+20 dBm unbalanced
  - Bandwidth: 20 Hz to 20 kHz, +0/-0.5 dB
  - Frequency Response: 0.35 Hz to 200 kHz, +0/-3 dB
  - Noise: <-96 dBu, unweighted
  - Dynamic Range: >115 dB, unweighted
  - THD+Noise: 0.008% typical at +4 dBu
  - Interchannel Crosstalk: <-80dB, 20 Hz to 20 kHz
  - Power Consumption: 30 Watts
  - Operating Voltage: 100-120 VAC or 200-240 VAC, 50-60 Hz
  - Unit Weight: 6.9 lbs
  - Shipping Weight: 9.3 lbs
