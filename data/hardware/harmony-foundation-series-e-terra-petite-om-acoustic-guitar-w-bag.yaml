details: |-
  The Harmony Foundation Series is one for the wanderers whose inspiration travels with them, a steadfast companion to weave tales out of every path taken on the journey. The Terra Petite OM is robust and resistant to warping, with a laminated spruce top paired with sapele sides and back to which provide tonal warmth and sustain. The lightweight okoume neck provides tuning stability and is comfortable to play, allowing you to focus on the music with confidence. Solid spruce X-bracing offers greater sound projection and tonal depth, so your playing sounds just as great in a cosy room as it does on a stage. The Terra Petite OM is pre-strung with D'Addario EXP16 coated strings for lasting bright tones. Equipped with a custom Harmony under-saddle pickup, it seamlessly transforms the instrument's rich acoustic tones into plug-and-play capabilities, making it ideal for live performances and amplified sessions. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
