description: The RFX-2000 is a sophisticated digital reverb and multi-effect processor.
details: |-
  The RFX-2000 comes with a full complement of 48 preset effects (8 effects x 6 banks). The reverb effects alone allow 121 different settings.

  Up to 100 patches (effect settings) can be stored in the internal memory. Calling up any patch is quick and easy.

  The RFX-2000 is supplied with software that lets you manage and edit patches on a computer. Versions for Windows 95/98 and Macintosh are included. Besides patch editing and management, the software also provides access to eight additional effects including a 31-band graphic equalizer and a 20-tap delay effect.

  The S/PDIF output (with optical and coaxial connectors) allows connection to consumer equipment with digital input (digital multitrack recorder, MD recorder, DAT recorder or similar), keeping the signal in the digital domain.

  The dedicated microphone jack on the front panel allows vocal effects to be created without making connections at the rear, and is used to control the VOCODER effect. Time-based parameters such as delay time can be entered directly using the tap input feature, so the delay time can be matched to the tempo of a song. Functions such as patch switching, real-time parameter control and storing of patch data on external equipment can be performed via a MIDI link.
specs: |-
  - 616 preset programs (8 effects x 7 banks x 11 characters) plus 100 program memories, 716 programs total
  - Sampling frequency: 44.1 kHz
  - A/D converter: 20 bit, 64 times oversampling
  - D/A converter: 20 bit, 128 times oversampling
  - DSP: Zoom original ZFX-2 with 24-bit signal processing
  - Rear inputs L/MONO and R: standard monaural phone jacks, input impedance 10 kilohms (mono) or 20 kilohms (stereo), reference input level -10 dBm to +4 dBm
  - Microphone input: standard monaural phone jack, input impedance 20 kilohms, reference input level -56 dBm
  - Outputs L and R: standard monaural phone jacks, output impedance 500 ohms, reference output level -10 dBm to +4 dBm
  - Digital audio interface: S/PDIF coaxial output and optical output
  - Control connectors: MIDI IN, MIDI OUT, MIDI THRU, BYPASS (FS01)
  - Power requirements: AD-0008 AC adapter, 12 V AC
  - Dimensions: 482 (W) x 44 (H) x 115 (D) mm
  - Weight: 1.5 kg
  - Effect banks: REVERB, DELAY, EFFECTS, SFX, RE-MIX, MIXDOWN, plus a computer-only EXTRA bank
  - Tap input for time-based parameters such as delay time and modulation rate
  - MIDI control of patch switching, real-time parameters and patch data dumps
