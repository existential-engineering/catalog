details: |-
  DIRTY MURALS

  (Reverb and Delay)

  Dirty Murals delivers complex delay and reverb with powerful controls for each, in a small 125B enclosure. Two distinct delay and reverb styles create a variety of rich, lush, ambient, textured sounds. The first mode offers a modulated "oil can" style delay with shorter, vintage style repeats, paired with a small room reverb. The second mode delivers a long, high-fidelity, analog-style delay with a large hall reverb. The reverb level can be dialed to taste or completely removed in either mode, allowing it to function as a traditional delay pedal. The reverb can be boosted while keeping the mix low, generating the effect of a reverb with an adjustable pre-delay. The Dirty Murals will quickly become an essential part of your sound. It is your go-to delay and reverb solution in a small size that will free up space on your pedalboard by combining the perfect delay and reverb in one device. Designed and assembled in Seattle, Washington. O perates on a standard 9Vdc Boss-style power supply (not included). Enclosure size: 4.77" x 2.6" x 1.39"

  Dirty Murals manual

  Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
