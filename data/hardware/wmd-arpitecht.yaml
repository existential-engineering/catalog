details: |-
  Voltage Controlled Melodic Inspiration

  Simply put, Arpitecht is a voltage controlled Quantizer and rhythmic arpeggio generator. As on e of our most musical modules to date, Arpitecht is designed to be an inspiring tool for the modular musician. With Arpitecht, you can create intricate melodies that span 8 octaves, imply chord changes, instant acid basslines, evolving generative sequences, and, using the Triad expander, polyphonic chord generation. Arpitecht features 16 scales, each with a unique set of "note masks" offering hundreds of note combinations with the ability to dial in via knobs on the front panel or CV. 32 rhythm patterns and 32 slide patterns all with CV control let you feed a static clock into it and get unique, evolving patterns of gates and note changes. Triad expander module allows you to create uniquely voiced chords in the same key underneath your arpeggios.
