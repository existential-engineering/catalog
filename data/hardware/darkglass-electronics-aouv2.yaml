url: https://www.darkglass.com/products/aouv2
description: The Alpha·Omega Ultra is a versatile bass preamplifier pedal with
  dual parallel distortion circuits, a 6-band graphic EQ, XLR DI with cab sim,
  headphone output, aux input, and USB IR loading for home, stage, and studio.
details: |-
  The Alpha·Omega Ultra is a versatile bass preamplifier pedal designed for home, stage, and studio use. It features two distinct distortion circuits, Alpha and Omega, wired in parallel, offering contrasting tonal characteristics: Alpha delivers punchy, tight tones with definition, while Omega provides brutal, raw saturation. A six-band active graphic equalizer with high and low shelving lets players shape their tone flexibly.

  The unit stands out through its extensive connectivity and practical features. It includes both a balanced XLR direct output with switchable cabinet simulation and a 1/4-inch output for amplifier connection, plus a dedicated headphone amplifier with IR cab sim. An Aux In jack enables practicing with backing tracks from a phone or laptop. Additional controls include Bite and Growl toggle switches for high and low frequency saturation, a Master volume control, a Blend knob, and a dedicated footswitch to engage the distortion engine independently.

  Connectivity includes a 1/4-inch input and output, XLR DI, 3.5 mm headphone and aux jacks, and a Micro USB-B port for loading impulse responses and controlling settings via the Darkglass Suite. It runs on a regulated 9V DC center-negative supply (130 mA draw).
specs: |-
  - Six-band graphic equalizer with high and low shelf
  - XLR output with switchable cab sim
  - Headphone output with IR cab sim
  - Dedicated footswitch to engage the distortion engine independently
  - Master volume to control the overall unit level
  - Bite and Growl toggle switches to control high and low frequency saturation
  - Blend knob to mix clean and processed signals
  - Aux In jack to practice with backing tracks
  - Micro USB-B for IR loading and settings via Darkglass Suite
  - Requires regulated 9V DC center-negative supply (130 mA)
