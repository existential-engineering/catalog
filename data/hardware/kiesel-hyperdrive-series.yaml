details: |-
  The Hyperdrive jumped onto the scene as the first of its kind from Kiesel. The model implements a neck-through design for comfort, offers a left-handed or multiscale option, and allows for an optional body-edge bevel delete.

  One of the most notorious downsides of X-style instruments is neck dive. To combat this, the Hyperdrive has a removable 1.3 lb counterweight located in the rear of the guitar that slides in and out.
specs: |-
  - Configurations: H6 and H7 model codes appear in the gallery, in fixed (H), tremolo (X) and Floyd-equipped (C) forms, plus a multiscale HM6
  - Construction: neck-through
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in, 1.71 in, 1.90 in or 1.92 in at nut depending on configuration
  - Fingerboard: ebony with 14 in or 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale lengths: 25.5 in, or 25.5 in to 26.5 in and 25.5 in to 27 in multiscale
  - Headstock: 3 x 3 pointed
  - Bridge: Hipshot fixed or Hipshot Solo Saddle, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume control, 3-way pickup selector
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Body dimensions: 41.75 in long, 1.65 in thick, 14.125 in wide, or 42.1 in long, 1.65 in thick, 14.25 in wide
  - Weight: 9.3 lbs to 9.5 lbs
  - Strings: Elixir Nanoweb 1046E
  - Removable 1.3 lb rear counterweight
