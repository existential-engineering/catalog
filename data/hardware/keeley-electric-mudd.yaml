details: |-
  The Electric Mudd is a thick, splattering octave fuzz in the tradition of the super fuzz pedals of the 1960s. To that voice it adds an Edge control, which brings out octave-up overtones through a hard clipping stage using germanium diodes for a scratchy top end.

  The circuit is built around six vintage 1960s Fairchild 2N3565 transistors, which have not been manufactured for years. Their low gain and higher capacitance relative to modern parts is given as the reason the gain stays smooth and warm where modern transistors would sound harsh. At the heart of the pedal is a differential pair transistor configuration.

  The controls are Volume, Fuzz and Tone alongside the Edge control. With Edge fully down the pedal gives a more classic super fuzz voice; as Edge is raised the tone control is typically pulled back to rebalance, and the pedal adds compression and octave overtones. Each unit is hand built in Edmond, Oklahoma.
