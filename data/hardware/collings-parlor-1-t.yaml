description: The Parlor 1 T is a Traditional Series 12-fret acoustic guitar
  inspired by late 19th century early steel string guitar designs. Built with a
  Sitka spruce top and Honduran mahogany back, sides, and neck, it delivers
  exceptional tonal balance and responsiveness in a compact, portable body. A
  pre-war scalloped X-brace pattern and high-gloss nitrocellulose lacquer finish
  reflect its vintage-inspired construction, complemented by Waverly engraved
  bronze tuners with ebony buttons.
details: |-
  The Parlor 1 T belongs to the Collings Traditional Series, a line of instruments built to evoke pre-war acoustic guitar construction and voicing. The parlor body shape — 12 1/4" wide and 18 5/16" long — makes it one of the most compact steel-string formats available, well suited for fingerstyle playing, home recording, and intimate performance settings. The 12-fret neck join and 24 7/16" scale length contribute to a looser string feel and warm, balanced tone. Construction highlights include a custom Traditional Series pre-war scalloped X-brace pattern, tortoise body binding with custom wood purflings, and a 1-style walnut backstrip. The ebony fingerboard features a compound 14"-26" radius and gold MOP short-dot inlays. A modified V neck profile and 1 3/4" bone nut cater to players who prefer a vintage hand feel.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Construction: Traditional Series Build and Voicing
  - Scale Length: 24 7/16"
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, drop-in
  - Neck Profile: Modified V
  - Fingerboard: Ebony with gold MOP short dots
  - Fingerboard Radius: 14" - 26" compound
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Tuners: Waverly Engraved Bronze 3-on-a-plate with ebony buttons
  - Body Binding: Tortoise with custom wood purflings
  - Backstrip: 1-style (Walnut)
  - Brace Pattern: Custom Traditional Series pre-war scalloped X-brace
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 12 1/4"
  - Body Length: 18 5/16"
  - Body Depth: 4"
  - Total Length: 37 1/4"
  - Strings: D'Addario EJ-26 (.011" - .052")
