description: The Custom Shop OVERDRIVELAND, in a laser-engraved solid die-cast
  case, with custom drive modules that respond more sensitively to input signals
  and an internal boost supply adjustable from DC10V to 19V.
details: |-
  OVERDRIVELAND was born to be as lustrous and distinctive as the elusive DUMBLE amplifiers that are now hard to come by, so that players can express their own personalities through it. The ODL-1-CS is the Custom Shop build: the unit features a solid die-cast case with laser engraving, and each one carries a unique, rugged surface finish. Free The Tone's founder and designer, Yuki Hayashi, spent over twenty years maintaining and repairing DUMBLE amplifiers and owned several himself, and capturing their harmonics and their response to a player's hands in a pedal-sized overdrive is what started the development.

  For the fundamental circuit, the Normal channel, no clipping diodes and no LEDs are used, because they made the intended harmonic components hard to achieve. Raising GAIN brings in gradual distortion, and even below the twelve o'clock position the clean sound carries rich harmonic content. A dedicated drive circuit module responds finely to the signal from the guitar, and for the Custom Shop version custom modules are used with different components from the standard version in order to respond more sensitively to input signals.

  The pedal is two sections. The Normal channel circuit holds the TONE circuit with its EQ ON/GLASS switch and the gain shaping of the ROCK/JAZZ switch. EQ ON activates the TONE circuit, while GLASS bypasses it for a glassy tone reminiscent of a Blackface Fender Vibroverb with the Bright switch engaged. ROCK raises gain while slightly reducing it in the low range so the amplifier's input stage is not overdriven by excessive low end; JAZZ lowers overall gain and brings out richness in the low frequencies.

  Selecting the Drive channel adds the Drive circuit in front of the Normal channel, so the order from the input is drive circuit, Normal channel circuit, output circuit. The Drive circuit carries a HI-CUT filter for high-frequency character, and the PUSH control sets how much signal it sends into the Normal channel input, which is what controls perceived volume. NOR LEVEL and DRV LEVEL set each channel's volume independently.

  On this version the voltage supplied to the audio circuit can be adjusted smoothly from DC10V to 19V with a trim control, and changing it moves the clipping point for dramatic variations in the drive sound. The pedal can also run from a 9 V battery, in which case the power switch should be set to the DC9V side, because the internal boost circuit consumes more power and would deplete a battery more quickly on the VARI setting. Whatever the setting, a DC9V adapter is the one to connect, and because a large inrush current flows at power-on, Free The Tone recommends a supply able to deliver 200 mA or more.
specs: |-
  - Input impedance: 500 kOhm or higher
  - Output load impedance: 10 kOhm or higher
  - Controls: NOR LEVEL, DRV LEVEL, TONE, GAIN, PUSH, HI CUT, DRIVE, EQ ON/GLASS switch, ROCK/JAZZ switch, DC9V/VARIABLE switching switch, voltage adjustment trim
  - Connectors: 1/4-inch standard phone jacks (input, output), DC9V input jack (AC adapter jack)
  - Power supply: 9V DC centre negative polarity, or a 006P (9V) 6F22 alkaline battery (about 3 hours of continuous use; a manganese battery is not recommended because of its short life)
  - Current consumption: DC9V 95 mA (use a power supply able to deliver 200 mA or more, because a significant inrush current flows at power-on)
  - Internal boost supply continuously adjustable from DC10V to DC19V on the VARI setting
  - Custom modules with different components from the standard version, for more sensitive response to input signals
  - Solid die-cast case with laser engraving and a unique surface finish on each unit
  - HTS (Holistic Tonal Solution) circuit, output in phase with the input
  - Size: 97D x 120W x 51H mm (including protrusions like footswitches and jacks)
  - Weight: approx. 420 g (excluding battery)
  - Accessories: warranty card, website access card, safety precaution, 4x rubber feet
