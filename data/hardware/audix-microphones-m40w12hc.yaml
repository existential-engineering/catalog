details: |-
  The M40 is a miniaturized condenser microphone with a fully integrated preamp designed with very high sensitivity for distance miking. The primary applications for the ceiling-mounted M40 include Video and Teleconferencing (VTC), distance learning, hospital rooms, surveillance, and ambient room miking.

  The M40 ceiling microphone has complete immunity from RF interference caused by cell phones and GSM devices. This model is equipped with a hypercardioid capsule for tighter pickup and greater isolation.

  The M40 installed ceiling microphone is easy to install requiring only that a 5/8 inch hole be drilled in the ceiling with no additional tools required. The cable assembly is equipped with a terminal block connector. For installations where a plenum-rated cable is to be used, a UL-rated metal plenum junction box is available.

  Designed, machined, assembled, and tested by AUDIX in the USA.

  Note: The M40 Series comes in a variety of model options.
specs: |-
  - Polar pattern: Hypercardioid
  - Transducer type: condenser with integrated preamp
  - RF immunity to cell phone and GSM interference
  - Output termination: terminal block connector
  - Install: 5/8 inch ceiling hole
