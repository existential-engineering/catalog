details: |-
  Gretsch's time-honored 'Broadkaster' name now adorns the flagship guitars of its center block lineup, crafted for full-spectrum sound at high volume with powerful new pickups and a chambered spruce center block that enhances body resonance for more organic tone and comfortably lighter weight.

  Built to perform, the G6609TG Players Edition Broadkaster Center Block Double-Cut features a double-cutaway body in handsome Cadillac Green and Vintage White finishes, both with gleaming gold hardware. These models feature the all-new U.S.-made Full'Tron pickups that deliver full-spectrum sonic range with distinctive snarl, in addition to classic Gretsch chime, balance and brilliance.
