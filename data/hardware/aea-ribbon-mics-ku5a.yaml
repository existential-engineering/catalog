description: An active supercardioid ribbon microphone with JFET electronics and
  48V phantom power, delivering a tightly focused directional pattern that
  rejects monitor bleed and room reflections while retaining classic ribbon
  warmth for studio and live use.
details: |-
  The supercardioid KU5A breaks new ground in ribbon technology with its acutely focused directionality that rejects bleed from other instruments, room reflections, and loud ambience in the studio and on stage. As a near-field ribbon designed for close range recording, the KU5A delivers the low-end heft and pronounced midrange one expects of AEA ribbons, with moderate, manageable proximity effect.

  The KU5A's supercardioid polar pattern captures pure, direct sound while rejecting room tone from behind the mic. This prevents excessive monitor and audience bleed when tracking musicians live in one room or on stage. The KU5A's end-address directionality and tight supercardioid pattern allow for effortless positioning on snare, toms, and other instruments.

  The active KU5A features JFET electronics with a custom transformer shared with the A440, R84A, and NUVO ribbon mics, providing greater output, less audible noise, and stable impedance across different preamps. It operates with standard 48-volt phantom power.

  The KU5A has an integrated electronic high-pass filter engaged with an external pushbutton switch, rolling off low-end with a 6dB/octave shelf at 283 Hz for optimal close-range performance. The mic can handle 141+ dB SPL at 1kHz.

  Touring bands rely on the durability and low-profile of the KU5A for sound reinforcement at live shows. Its integrated windscreen protection and active electronics allow for flexibility with virtually any mixing board or audio interface.
specs: |-
  - Operating Principle: Pressure gradient transducer
  - Directional Pattern: Supercardioid
  - Frequency Range: <20 Hz to >20 kHz
  - Maximum SPL: 135 dB SPL at 1 kHz
  - Sensitivity: -43dBv at 1 kHz (no load)
  - Output Impedance: 92 Ω broadband
  - Load Impedance: 1.0 kΩ or greater
  - Phantom Power: 48V, 7mA
  - Switchable High-Pass Filter: 6dB/Octave at 283 Hz
  - Off Axis Response at 180°: -12dB
  - Angle of Maximum Rejection: 135°
  - Ribbon Thickness: 1.8 µm
  - Ribbon Width: 0.055 in (0.14 cm)
  - Ribbon Length: 1.175 in (2.9 cm)
  - Height: 8 in (20.3 cm)
  - Width: 3 in (7.6 cm)
  - Weight: 2 lb 9.8 oz (1.19 kg)
  - Electronics: Active JFET with custom transformer
  - Matte black finish
  - Made in the U.S.A.
