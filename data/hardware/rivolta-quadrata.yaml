details: |-
  DESCRIPTION

  'The shape of things to come...'

  Introducing the Forma Quadrata by Rivolta Guitars. The Rivolta Forma Quadrata was designed by Dennis Fano to incorporate squared and angular elements into the body and headstock silhouette. The large, yet comfortable & ergonomic body shape offers exceptional sustain and is sure to turn heads on the stage! The Rivolta Forma Quadrata is made from ultra light weight, yet resonant Simarouba wood and features a Rosewood fretboard, 25" scale, 23 1/2 Medium Jumbo Frets (Yes, we said 23 1/2!), angled P90 in the neck, Humbucker in the bridge and a custom fitted vintage style hardshell case. FEATURES & SPECS
specs: |-
  - Body Wood - (Lightweight) Simarouba
  - Neck Wood - (Lightweight) Simarouba
  - Fretboard Wood - Dark Indian Rosewood
  - Inlays - Pearloid/MOTO Dots
  - Side Dots - Pearloid/MOTO
  - Scale - 25"
  - Nut Width - 1.687"
  - Neck Width @ 12th Fret - 2.080"
  - Neck Carve Shape - Chunky C+
  - Neck Depth @ 1st Fret - .850"
  - Neck Depth @ 12th Fret - .990"
  - Fretboard Radius - 12"
  - Frets - 23 1/2 x Medium Jumbo
  - Pickups - Neck- P90 Soapbar (6.75k)/ Bridge - Humbucker (8.75k)
  - Wiring - Vol, Tone & 3-Way Toggle
  - Hardware - Gold on Miele Amber and Black, Nickel on Red
  - Bridge - Tunematic / Stoptail
  - Tuners - Wilkinson vintage style with Nickel buttons
  - Knobs - Black Bell
  - Nut Material - Bone
  - Pickguard/Truss cover - 5-Ply Black
  - Strings - 10-46
  - Body Finish - Gloss
  - Headstock Finish - Gloss Black
  - Neck Finish - Gloss
  - Overall Length - 44"
  - Body Length - 22 1/2"
  - Body Width @ Lower Bout - 15"
  - Body Width @ Upper Bout - 10"
  - Body Depth - 1 11/16"
  - Overall Depth - 2 15/32"
  - Average Weight: 8.5 lbs
  - Fitted Hardshell Case INCLUDED
