url: https://www.crownaudio.com/en-US/products/xti-6002
description: Two-channel, 2100W @ 4Ω power amplifier from Crown's XTi 2 Series.
  Top of the XTi line with Peakx Plus limiters, enhanced subharmonic synth, and
  HiQnet System Architect control via USB.
details:
  - The XTi 6002 sits at the top of Crown's XTi 2 Series, positioned by the
    manufacturer as one of the most powerful and innovative amplifiers on the
    market today. It is engineered to deliver the goods night after night
    without breaking a sweat, with an emphasis on unmatched performance and
    value.
  - Peakx Plus Limiters provide system protection and performance control, while
    the Enhanced Subharmonic Synth section enables system-specific low-frequency
    tuning. The unit features three user-defined fan modes (normal, early, full
    speed) and integrated monitoring of AC line voltage and power-supply
    temperature.
  - Cast-aluminum handles support durability and portability, and a secure
    locking power-cord clip prevents accidental disconnection. The rear-panel
    USB port connects the amplifier to Crown's HiQnet System Architect / Band
    Manager software for DSP, presets, and monitoring.
specs: |-
  - 2 channels
  - Rated Power Output (per channel): 3000W @ 2Ω, 2100W @ 4Ω, 1200W @ 8Ω
  - Input Sensitivity: 1.4V
  - Signal-to-Noise Ratio: 103 dB A-weighted (8Ω @ 1 kHz)
  - THD: <0.5%
  - Frequency Response: +0/-1 dB (1W, 20 Hz – 20 kHz)
  - Crosstalk: >70 dB (20 Hz – 1 kHz)
  - Peakx Plus Limiters
  - Enhanced Subharmonic Synth
  - Three user-defined fan modes (normal, early, full speed)
  - Dimensions: 19" W × 3.5" H × 16.2" D
  - Weight: 24 lbs (10.9 kg)
  - Shipping Weight: 30 lbs (13.6 kg)
  - IEC Power Connector: 20A
