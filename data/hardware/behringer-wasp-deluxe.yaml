description: An ultra-affordable homage to the quirky 1978 Wasp, the WASP DELUXE
  is a monophonic hybrid synthesizer pairing dual digital oscillators with a
  pure analog signal path based on authentic VCF and VCA designs and a flexible
  6-shape LFO including noise and S&H. Its main module can be transferred into a
  standard Eurorack case, and a 16-note Poly Chain function combines multiple
  units for up to 16-voice polyphony.
details: |-
  Great care has been taken in designing the WASP DELUXE including the true to the original "Wasp Deluxe" circuitry. This is what gives it its ultra-flexible sound shaping capability, which covers everything from super-fat bass and lead tones, stunning effects and all the way out to the otherworldly sounds of your imagination.

  The inspired synthesizer tracks laid down in the 1970s and '80s are etched in the annals of progressive rock, wave and synth-pop music forever, making them truly classic in every sense of the word. WASP DELUXE's pure analog signal path based on authentic VCF and VCA designs lets you recreate all of that magic, or design incredibly fat and original sounds that will make you a legend in your own right.

  Each of the two oscillators comes with three variable waveforms: sawtooth, square wave and an enhanced mode which adds punch and some clarity to the oscillator's tone. Both oscillators can be adjusted across a wide 5-octave range (32', 16', 8', 4' and 2'). Oscillator 1's wave shape can be adjusted via the Width knob, while oscillator 2 has a pitch control that can be adjusted against oscillator 1's pitch to create some really sweet modulation effects. These can be mixed and blended together with an external audio signal to get a truly unique sound.

  The Control Oscillator section features a flexible LFO with six waveform shapes such as a sine wave, rising sawtooth, falling sawtooth, square wave, noise and random, which can be further manipulated with the Frequency and Pitch knobs. A noise generator dramatically expands waveform generation and can be mixed in to create additional percussion sounds. The WASP DELUXE also comes with a switchable, multi-mode VCF with Lo, Hi, Band and Notch filter options as well as Freq and Q settings for playing with the filter cutoff and width.

  The WASP DELUXE has two analog Envelope Generators for modulating the VCA and VCF. The VCA Envelope section contains an Attack, Decay, Sustain Level/Repeat knob as well as a hold switch that can be used to sustain a note indefinitely, while the Control Envelope features Attack, Decay and Delay/Repeat knobs. While it is a monophonic instrument, the 16-note Poly Chain function lets you combine multiple synthesizers for up to 16-voice polyphony.
specs: |-
  - Hybrid synthesizer with dual digital oscillator design and a pure analog signal path based on authentic VCF and VCA designs
  - 3 variable oscillator shapes per oscillator: sawtooth, square wave and enhanced mode
  - Oscillator range: 5 octaves (32', 16', 8', 4', 2')
  - Multi-mode VCF with Lo, Hi, Band and Notch modes, plus Freq and Q controls
  - LFO with 6 waveform shapes: sine, rising sawtooth, falling sawtooth, square, noise and random, with Frequency and Pitch modulation control
  - 2 analog Envelope Generators (VCA envelope with Attack, Decay, Sustain Level/Repeat and hold switch; Control envelope with Attack, Decay and Delay/Repeat)
  - Noise generator
  - Monophonic, with 16-note Poly Chain for up to 16-voice polyphony across multiple units
  - External audio input for processing external sound sources
  - 29 controls
  - Main module can be transferred into a standard Eurorack case
  - USB/MIDI implementation with MIDI channel and Voice Priority selection
