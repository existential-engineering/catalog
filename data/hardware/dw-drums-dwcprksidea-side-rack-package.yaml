description: This DW Side Rack includes stainless steel tubing, built-memory locks, and more.
details: |-
  This DW Rack System is a heavy-duty solution to expand your existing setup and expedite hardware setup and teardown for live performance. This rack features 1.5″ stainless steel tubing for long-term durability, soft-grip rubber feet with integrated spikes for stability, and tube-mounted Cymbal Boom Arms for cymbal placement.

  The rack also features DW-branded built-in memory locks and a level to help you find your ideal positioning on the first go. Furthermore, built-in hi-torque wingnuts ensure the rack stays taut in play.

  The package includes two 36″ straight 1.5″ bars, one leg assembly, two perpendicular rack clamps, two 1.5″ V-clamps, six 1.5″ memory locks and one hi-torque drum key.

  A retractable spur with thumb adjustments enhances rack stability with any type of flooring, the redesigned Tri-Clamp keeps mounts tight during play, and heavy-duty coated wing nuts let you apply more torque without discomfort to your hands.
specs: |-
  - Heavy-duty stainless steel tubing
  - Soft-grip rubber feet w/ integrated spikes
  - DW-branded memory locks
  - Hi-torque wingnuts
  - 2x 36″ Straight 1.5″ Bar
  - 1x Leg Assembly
  - 2x Perpendicular Rack Clamp
  - 2x 1.5″ V-Clamps
  - 6x 1.5″ Memory Locks
  - 1x Hi Torque Drum Key
