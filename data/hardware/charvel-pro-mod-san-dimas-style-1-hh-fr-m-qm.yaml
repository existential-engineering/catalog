description: |-
  The Pro-Mod San Dimas Style 1 HH FR M QM is built for dazzling high-speed playing, pairing scorching sound and grin-inducing feel with the unmistakable San Dimas Style 1 silhouette. The alder body wears a figured quilt maple top finished in gloss Chlorine Burst for striking visual depth.

  A bolt-on maple neck with graphite reinforcement is shaped to a Speed Neck profile with rolled fingerboard edges and finished in hand-rubbed satin urethane for a fast, broken-in feel. The maple fingerboard carries a 12"-to-16" compound radius, 22 jumbo frets, and black dot inlays over a 25.5" scale, with a heel-mount truss rod adjustment wheel for quick setup.

  Electronics are voiced for high-output versatility: a Seymour Duncan JB TB-4 humbucker at the bridge and a Seymour Duncan '59 SH-1N humbucker at the neck, routed through a 3-position blade switch with a push/pull coil-split volume and a no-load tone control. A recessed Floyd Rose 1000 Series double-locking tremolo, Floyd Rose 1000 Series locking nut, and Charvel-branded die-cast tuners round out the chrome hardware.
details: |-
  Speed Neck profile with rolled fingerboard edges and hand-rubbed satin urethane finish. Graphite-reinforced bolt-on maple neck with 4-bolt serialized neck plate. Heel-mount truss rod adjustment wheel. Floyd Rose 1000 Series locking nut paired with a recessed Floyd Rose 1000 Series double-locking tremolo. Licensed Fender Stratocaster headstock. Knurled flat-top control knobs. Push/pull coil-split volume and no-load tone control.
