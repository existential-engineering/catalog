name: SRT215
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/srt-series/SRT215.html
description: "Sometimes soundcheck is the first song. Mackie SRT215 Professional
  Powered Loudspeakers help you dial in great sound in a hurry with time-saving
  features like the built-in SRT Mix Control 4-channel digital mixer with
  Bluetooth and Advanced Impulse DSP tuning for consistent, accurate and
  reliable sound at every gig."
details: |-
  The Mackie SRT215 Professional Powered Bluetooth Loudspeaker is built for bands, DJs, singer/songwriters and venues who need clear, powerful sound with minimal setup time.

  With an industry-leading 1600W Class-D amplifier, custom transducers, and the SymX Horn, the SRT215 delivers unmatched clarity and accuracy. Advanced Impulse DSP tuning ensures consistent, reliable sound across every venue.

  The built-in SRT Mix Control 4-channel digital mixer with Bluetooth provides flexible input handling, while the SRT Connect app offers complete wireless control from iOS and Android devices. Two SRT speakers can be wirelessly linked for music streaming and unified control.

  Plus, its transparent system protection defends against power surges and loud pops because everybody forgets a mute button now and then. A dual-angle pole mount and angled cabinet design allow use as either a main loudspeaker or a floor monitor wedge.
specs: |-
  - Power Output: 1600W Class-D
  - LF Driver: 15"
  - HF Driver: 1.4"
  - Frequency Response: 42Hz - 20kHz
  - Max SPL: 133 dB
  - Horn Coverage: 90 degrees horizontal x 60 degrees vertical
  - Weight: 37.1 lb / 16.8 kg
  - Dimensions: 28.8 x 17.6 x 15.4 in / 732 x 447 x 391 mm
  - Built-in SRT Mix Control 4-channel digital mixer with Bluetooth
  - Advanced Impulse DSP tuning
  - Custom SymX Horn design
  - Transparent system limiting and protection
  - SRT Connect app control (iOS/Android)
  - Wireless linking up to 100 meters between two SRT speakers
  - Dual-angle pole mount plus floor monitor configuration
  - M10 flypoints for professional installation
