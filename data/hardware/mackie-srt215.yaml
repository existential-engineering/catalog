description: Sometimes soundcheck is the first song. Mackie SRT215 Professional
  Powered Loudspeakers help you dial in great sound in a hurry with time-saving
  features like the built-in SRT Mix Control 4-channel digital mixer with
  Bluetooth and Advanced Impulse DSP tuning for consistent, accurate and
  reliable sound at every gig.
details: |-
  With Mackie SRT215 powered speakers, you can be amplified and ready to rock within minutes. Time-saving features like the SRT Mix Control built-in 4-channel digital mixer with Bluetooth and Advanced Impulse DSP tuning help you get your SRT215 loudspeakers dialed in for clear, consistent sound at any venue. And with transparent system protection, your system will keep the party going all night.

  Advanced Impulse DSP is Mackie's FIR-based acoustic tuning. The goal is to remove the anomalies that loudspeakers and horns contribute to a signal, from honkiness or squelch to mushy low end, effectively making the drivers invisible and output nothing but clean sound. It works by measuring the negative frequency response and time-domain impacts that each transducer and horn introduces, on axis as well as off, and reversing those anomalies before the signal hits the speaker.

  The custom Sym-X horn was designed to bring out the best from the HF transducer while maintaining the flattest possible response at the crossover point. The design allows the compression driver to operate at near maximum efficiency, and the transition between LF and HF is a symmetrical, flat response that contributes to a smooth midrange.

  Rather than lowering overall output, the processor-controlled system monitoring analyses the audio signal, identifies problem areas and dynamically applies multi-band compression to those specific frequencies. Input limiting keeps a hot source signal in check.

  With the SRT Connect app for iOS and Android, levels, EQ, meters and configuration are available for up to two speakers simultaneously, and memory presets can be saved. When two SRT loudspeakers are linked, the whole system is controlled in one view. Music can also be streamed directly from any Bluetooth enabled device.
specs: |-
  - Frequency response: 42Hz – 20kHz
  - Max SPL: 133 dB
  - LF driver: 15"
  - HF driver: 1.4"
  - 1600W Class-D amplifier with transparent system limiting and protection
  - Advanced Impulse DSP proprietary acoustic tuning
  - Custom Sym-X horn
  - Coverage: 90 degrees horizontal x 60 degrees vertical
  - SRT Mix Control built-in 4-channel digital mixer with Bluetooth
  - Dual independent channels supporting mic, line and instrument signals
  - Dedicated 1/8-inch stereo aux channel
  - High-contrast full colour display with single-knob access to mixer and processing
  - Application and venue specific voicing modes
  - Alignment delay up to 100 feet
  - Save and recall up to 10 user presets
  - System lock with 4-digit passcode
  - Front LED on, off and signal-present modes
  - SRT Connect app control for iOS and Android
  - Wireless speaker linking with up to 100 metres of range between linked speakers
  - Stereo or dual-zone linking modes
  - Dual-angled cabinet for use as a floor monitor
  - Dual-angle pole mount with 7-degree downward tilt option
  - M10 flypoints for professional installation
  - Universal Power Supply (100-240VAC) with Power Factor Correction
  - Weight: 37.1 lb / 16.8 kg
  - Dimensions: 28.8 x 17.6 x 15.4 in / 732 x 447 x 391 mm
