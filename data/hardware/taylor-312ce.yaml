description: Crafted at the intersection of solid-wood tone and workhorse
  utility, the 312ce generates a clear, punchy midrange response with a warm,
  woody character from sapele back and sides paired with a Sitka spruce top.
details: |-
  The 312ce is part of Taylor's 300 Series, featuring all-solid wood construction with a Sitka spruce top and sapele back and sides. The Grand Concert body provides a compact, comfortable frame with a Venetian cutaway for upper-fret access.

  Taylor's patented V-Class bracing replaces traditional X-bracing to deliver greater volume, longer sustain, and improved intonation. The West African Crelicam Ebony fretboard and bridge add clarity and articulation, while the Neo-Tropical Mahogany neck provides a comfortable Standard Carve profile.

  Amplified performance is handled by the Expression System 2, a behind-saddle pickup design that captures the guitar's natural acoustic voice. The 312ce includes a deluxe brown hardshell case and Gemstone fretboard inlays.
specs: |-
  - - Body shape: Grand Concert
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Sapele (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Nut width: 1-3/4"
  - Inlays: Gemstone
  - Binding: Black
  - Pickguard: Firestripe
  - Electronics: Expression System 2 (ES2)
  - Tuners: Taylor Nickel
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
