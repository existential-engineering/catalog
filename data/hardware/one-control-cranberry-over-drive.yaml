description: An overdrive pedal derived from the Strawberry Red Overdrive, tuned
  for clean to light distortion with moderate compression and fast response.
details: |-
  Features The CRANBERRY OVERDRIVE inherits the characteristics of the original STRAWBERRY-RED overdrive however, a low cut trim pot has been installed. Although both pedals can achieve the same level of boost, the Cranberry is perfect for clean/light distortion effect. With moderate compression and fast response, this pedal promises a superb lead boost for any genre of music. Specifications Input Impedance: 330K Output impedance: 25K Drive voltage: 9 V Current consumption: 4 mA S / N ratio: -86 dB Size: 39 W x 100 D x 31 H mm (not including projections) 　　 47 W x 100 D x 48 H mm (including projections) Weight: Approximately 160 g True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply Bjorn's Description It is safe to say that the Strawberry Overdrive hsa been and continues to be one of the best selling BJF Series FX pedals. For this reason, I decided to expand on this models success with two other models; The Cranberry and Lingonberry. The Cranberry is a lower gain version of the Strawberry Red Overdrive. In addition to having optimized control over lower gain sounds, the filtering has been altered to allow a flatter sound with more lows and highs. The player can adjust 3 characteristics: Volume: Output volume Treble: Allows to change the tone from 'soft' to 'slightly biting' Drive: Sets the gain and distortion of the circuit. Low: Trimmer switch that sets the low-end frequency response - Bjorn Juhl

