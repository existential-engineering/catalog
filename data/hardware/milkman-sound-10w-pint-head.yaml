details: |-
  Low power with more power

  ABOUT

  The Pint is designed to add a little bit more power to the low power Half Pint circuit. A custom Mercury Magnetics output transformer allows for parallel single ended 6V6 output. The Pint delivers 10 clean watts and 18 snarling overdriven watts when the amp is pushed all the way. Like its little brother, reverb and tremolo and Class A single ended breakup is the name of the game. How about touch sensitivity and feel? The 5Y3 rectifier coupled with true class A design make the Pint the most touch sensitive Milkman amplifier to date. A pair of 6V6 running in a single ended design piles on scoop after scoop of creamy even order harmonics.

  The front end is similar to the Half Pint, with extended headroom, lush spring reverb, and deep output modulating tremolo. The amplifier is hand wired onto a turret board with bespoke Soursound transformers and Jupiter capacitors standard. WATTAGE

  10W Class A

  EFFECTS

  Tube tremolo and spring reverb
  Includes handwired original design detachable footswitch and 15' cable

  Demo

  10W Pint Demo by James Deprato

  James meets the Pint. SOUNDS

  Listen

  Reviews

  Matt Lemay

  New York City

  www.mattlemaysongs.com

  Joel Hamilton was not kidding; this is the best-sounding amp I've ever met. I had been on the fence about whether I needed an amp with reverb and tremolo, but now I couldn't imagine using an amp without them. This is a game changer for me, thanks for doing such incredible work. Richard Lawton

  Terre Haute, IN

  You created a Very Good Thing! I can't imagine using any other amp ever...it crunches at low volume, the reverb and tremolo are transcendent, it can be used at home, for recording, comfortably at small venues, mic'd at larger venues, and it is so kind to my back when I carry it.
