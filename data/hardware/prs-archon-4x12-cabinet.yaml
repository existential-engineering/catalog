details: |-
  The PRS Archon 4x12 speaker cabinet features a closed-back design, delivering power, punch, and tight low end. Featuring the Celestion V-Type speaker, this cabinet excels in delivering a balanced tonal range, seamlessly transitioning from the Archon’s pristine clean channel to classic crunch and more modern gain. Wrapped in durable black vinyl and adorned with a British-style black knitted weave grill cloth and the PRS Signature logo, the Archon cabinet boasts a sleek and powerful aesthetic. Its robust construction ensures reliability, making it a trusted companion for musicians on the road.
