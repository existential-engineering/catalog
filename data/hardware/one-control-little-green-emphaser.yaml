details: |-
  Features
  The LITTLE GREEN EMPHASER is a dynamic boost pedal which allows the player to put emphasis on a specific frequency range. It can also be used as a pre-driver/booster for all distortion, fuzz and overdrive effects. When used with a bass, the true crispness of this pedals designs stands out. Specifications
  Input impedance: 500K
  Output impedance: 25K
  Drive voltage: 9V
  Current consumption: 2mA
  S/N ratio: -80dB
  Size: 39Wx100Dx31H mm (excluding protruding parts)
  47Wx100Dx48H mm (including protruding parts)
  Weight: Approx. 160 grams
  True-Bypass Switching
  High Quality Aluminum Enclosure
  Power: 9V Battery or Standard DC Power Supply

  Bjorn's Description
  The LITTLE GREEN EMPHASER is primarily meant to be used as a pre-driver however it also distorts slightly. It works both as a light dirt booster by itself but can also pre-drive distortion effects, overdrives and fuzzes. Typically, the LITTLE GREEN EMPHASER works best at the beginning of your signal chain. The design of a pre-driver for distortion is made with a combination of a booster and a treble booster in which both are optimized for the lowest possible noise. These were put on a panorama pot in order for them to be blended to your personal liking. Specifically for single coil pickups, you'll notice more of a treble boost, rather than straight boost. In turn, this keeps hum levels low and also adds some body to your tone. With humbucker pickups, the Blend knob was tuned to allow crispness and body. The Blend knob balances or blends the straight booster and the treble booster which allows the player to put emphasis on a specific register to further project his/her tone. Additionally, you'll notice a small amount of distortion with humbucker pickups, especially on transients. The LITTLE GREEN EMPHASER can be an asset with many of the British style amplifiers. With Fender amps, this pedal can also be used to correct the phase of the Reverb and Normal channel. And finally, this pedal can also be used on electric basses to create a crisper sound. - Bjorn Juhl

