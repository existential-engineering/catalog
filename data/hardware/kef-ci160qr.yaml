description: |-
  The Ci160QR is an in-ceiling ultra-thin bezel loudspeaker featuring KEF's
  patented Uni-Q driver technology. The tweeter is positioned at the acoustic
  center of the woofer, allowing both to function as a single point source
  that disperses sound widely and evenly throughout the room.
specs: |-
  - LF Driver: 160mm (6.5") Uni-Q
  - HF Driver: 19mm (0.75") aluminum dome with tangerine waveguide
  - Nominal Impedance: 8 Ohm
  - Sensitivity: 89dB (2.83V/1m)
  - Frequency Response: 38Hz–34kHz (±6dB, open-backed)
  - Crossover Frequency: 3.0kHz
  - Recommended Power: 10–125W
  - Diameter: 234.6mm
  - Cutout Diameter: 196mm
  - Depth: 98mm
  - Weight: 2.05kg
