description: An authentic analog reproduction of the 1970s ARP/Eminent Solina MK
  II string ensemble, using an original 13-tone generator with octave
  divide-down technology for 49-voice polyphony. Violin, viola, trumpet, horn,
  cello and contrabass voices feed a multi-stage Bucket Brigade chorus ensemble
  and a Small Stone style phase shifter, in a module that fits a standard
  Eurorack case.
details: |-
  Bringing a classic synthesizer back to life is always a massive undertaking. The SOLINA STRING ENSEMBLE is one such classic, authentically reproducing this iconic '70s analog synthesizer for modern musicians.

  Faithful to the original: the Behringer SOLINA STRING ENSEMBLE features violin, viola, trumpet, horn, cello and contrabass instruments as well as controls for tuning, crescendo, bass and volume just like the original revision B. It achieves its iconic multi-orchestral sounds through divide-down technology albeit in a more compact enclosure you can easily integrate into your setup.

  Modulation: a multi-stage Bucket Brigade chorus closely replicates the original modulation sound, joined by a faithfully recreated Small Stone phaser with its own dedicated rate control.

  Made for your setup: comprehensive MIDI implementation, MIDI channel and voice priority selection, and modulation outputs are there so the SOLINA STRING ENSEMBLE drops into an existing rig quickly and easily.

  Eurorack ready: the SOLINA STRING ENSEMBLE is designed to fit into a standard Eurorack case. Connect the power cables to the power supply and mount the module using the included screws, and other synth modules can be combined with it.
specs: |-
  - Authentic reproduction of original ARP/Eminent Solina MK II circuitry
  - Original 13-tone generator with octave divide-down technology, 49-voice polyphony
  - String section voices: violin, viola, trumpet, horn, cello, contrabass
  - Controls for tuning, crescendo, bass and volume, matching the original revision B
  - Chorus ensemble effect built from multi-stage Bucket Brigade Devices (BBDs)
  - Phase shifter modeled after the Small Stone, with dedicated rate control and separate Color switch
  - 16 controls for direct real-time access to all important parameters
  - Chorus Ensemble and Phase Shifter have input/output connectors for independent use
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - Modulation outputs
  - Eurorack format: main module can be transferred to a standard Eurorack case; power cables and mounting screws included
