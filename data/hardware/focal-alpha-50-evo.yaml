url: https://www.focal.com/products/alpha-50-evo
description: Active 2-way nearfield studio monitor with a 5" Slatefiber woofer
  and 1" aluminum inverted dome tweeter, designed for mixing in compact rooms.
details: |-
  Alpha 50 Evo is the ideal loudspeaker for proximity control. Thanks to its technologies, including a 13 cm Slatefiber woofer, it offers plenty of dynamics and mix detail, a highly neutral tonal balance that remains identical at both low and high volumes, and excellent sound coherence, whatever the listening environment. Its compact design and multiple functions make it a versatile piece of equipment.
specs: |-
  - 2-way active studio monitor
  - Woofer: 5" Slatefiber membrane
  - Tweeter: 1" Aluminum inverted dome
  - Frequency response (±3 dB): 45 Hz – 22 kHz
  - Maximum SPL (peak @ 1 m): 101 dB
  - Mid-range and low frequency amplifier: 35 W, class D
  - High frequency amplifier: 25 W, class D
  - Inputs: TRS (symmetrical 10 kΩ), XLR (symmetrical 10 kΩ), RCA (asymmetrical 10 kΩ)
  - Bass level (>250 Hz): adjustable ±6 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - Auto standby; LF/HF shelving controls
  - Local supply: 100–240 V (T2AL fuse/250 V)
  - Dimensions (H × W × D): 31 × 22.8 × 23.9 cm (12.2 × 9 × 9.41 in)
  - Weight: 5.95 kg (13.1 lb)
