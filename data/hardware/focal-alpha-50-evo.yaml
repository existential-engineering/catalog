description: Alpha 50 Evo is the ideal loudspeaker for proximity control. Thanks to its technologies, including a 13 cm Slatefiber woofer, it offers plenty of dynamics and mix detail, a highly neutral tonal balance that remains identical at both low and high volumes, and excellent sound coherence, whatever the listening environment.
details: |-
  Alpha 50 Evo is the ideal loudspeaker for proximity control. Thanks to its technologies, including a 13 cm Slatefiber woofer, it offers plenty of dynamics and mix detail, a highly neutral tonal balance that remains identical at both low and high volumes, and excellent sound coherence, whatever the listening environment. Its compact design and multiple functions make it a versatile piece of equipment.

  Versatility: like Alpha 65 and Alpha 80, Alpha 50 Evo boasts a host of features, including TRS, XLR and RCA inputs, a disengageable automatic standby mode, wall and ceiling mounting inserts.

  High noise levels: its two amplifiers offer high current capacity, for total control of signal dynamics. This also enables high sound levels to be achieved, without distortion.

  Modern design: its bass-reflex design, rounded contours and robust side panels make Alpha Evo a modern piece of equipment for perfect acoustical integration in any workplace.

  Manufactured by Focal, the inverted dome tweeter has been a signature since 1981. Here the engineers chose aluminium, which increases the rigidity of the dome and reduces distortion, and a waveguide was developed to perfect the spatialization of the sound. Exclusive to Focal and made in France, the Slatefiber cone is made of recycled carbon fibers and thermoplastic polymer.
specs: |-
  - Product type: 2-way monitor
  - Woofer: 5" Slatefiber membrane
  - Tweeter: 1" aluminium inverted dome
  - Frequency response (+/- 3dB): 45 Hz - 22 kHz
  - Maximum SPL (peak @ 1m): 101 dB
  - High frequency amplifier: 25 W, class D
  - Mid-range and low frequency amplifier: 35 W, class D
  - Inputs: TRS symmetrical 10 kOhms, XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, LF Shelv, HF Shelv
  - Power On LED
  - Local supply: 100 - 240V (T2AL fuse/250V)
  - On/Off switch on the rear panel
  - Height: 31 cm / 12.2 in
  - Width: 22.8 cm / 9 in
  - Depth: 23.9 cm / 9.41 in
  - Weight: 5.95 kg / 13.1 lb
