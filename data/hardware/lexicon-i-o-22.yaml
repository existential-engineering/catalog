description: 2x2 USB 2.0 Desktop Recording Studio with dbx 60V high-voltage mic
  preamps and bundled Pantheon II reverb plug-in.
details: |-
  The Lexicon I-O 22 is a compact 2x2 USB 2.0 desktop recording interface designed for DAW-based production. It captures audio at up to 24-bit / 96kHz resolution and includes newly designed dbx 60V high-voltage, ultra-low-noise mic preamps along with performance-driven A/D and D/A converters for clean signal capture.

  The front panel offers two locking combi-jack mic/line inputs with switchable +48V phantom power, plus a dedicated side-panel hi-Z instrument input for guitars and basses. Monitoring is handled via two balanced 1/4-inch TRS line outputs and a 1/4-inch headphone output with its own volume control. MIDI In and Out round out the I/O for working with external controllers and synths.

  The interface ships with the Pantheon II VST/AU reverb plug-in, which delivers six legendary Lexicon reverbs (Hall, Plate, Chamber, Room, Tremolo, and Ambience). A bundle of third-party software is also included for getting started: Cubase LE, EzDrummer Lite, and XILS3 SE.

  The I-O 22 is compatible with Pro Tools 10-12 and any major DAW on macOS and Windows. Lexicon has since discontinued the product; legacy drivers remain available on the support page.
specs: |-
  - 2 in / 2 out USB 2.0 audio interface
  - 24-bit / 44.1-96 kHz resolution
  - Two dbx 60V high-voltage ultra-low-noise mic preamps
  - Two locking combi-jack mic/line inputs with +48V phantom power
  - Side-panel hi-Z instrument input
  - Two balanced 1/4-inch TRS line outputs
  - 1/4-inch headphone output with dedicated volume control
  - MIDI In and Out
  - Bundled Pantheon II VST/AU reverb plug-in (6 Lexicon reverbs)
  - Bundled Cubase LE, EzDrummer Lite, XILS3 SE software
