details: |-
  The Darkglass Tone Capsule (B2M2) is an onboard active preamp module installed inside an electric bass guitar to expand its sonic range. It is a preamp system, not a pickup: it shapes the signal from the bass's existing pickups.

  Instead of a typical bass/mid/treble EQ, the Tone Capsule offers bass/mid/high-mid tone shaping, each with a +/-12dB range. The bass control is centered at 70Hz for low-end power, the mid control at 500Hz for midrange growl and punch, and the high-mid control at 2.8kHz to enhance presence and articulation without adding noise or unwanted highs. It is distinctive in having no treble control.

  Electrically, it has a 500kOhm input impedance and 1kOhm output impedance, draws about 2.4mA, and runs on 9V to 18V (single or dual batteries). It ships with 50 KB potentiometers and a roughly 10cm connecting cable. The module measures 42mm x 25mm x 12.5mm to fit inside a bass control cavity.
specs: |-
  - Onboard active bass preamp system (installs inside the bass)
  - Bass control: +/-12dB centered at 70Hz
  - Mid control: +/-12dB centered at 500Hz
  - High-mid control: +/-12dB centered at 2.8kHz
  - No treble control by design
  - Input impedance: 500kOhm; output impedance: 1kOhm
  - Current consumption: ~2.4mA; 9V to 18V operation
  - 50 KB potentiometers included; ~10cm cable
  - Dimensions: 42mm x 25mm x 12.5mm
