description: "The Hot Fuzz is a dual-section guitar pedal: the left side
  provides a high-frequency boost stage and the right side delivers an English
  1970s-style fuzz circuit. Both sections operate independently or in series,
  each with its own true bypass footswitch."
details: |-
  The Hot Fuzz is a handbuilt, all solid-state guitar pedal featuring four bipolar, low-noise transistors and a noise figure of less than 2 dB across the audio band. Its dual-section design lets players use either circuit independently or chain them together for combined high-frequency distortion effects.

  The left section is a single-stage high-frequency boost reaching up to 5 kHz, while the right section is a triple-stage fuzz circuit modeled on English 1970s-era fuzz boxes. The fuzz side includes dedicated Juice, Bass, and Treble controls for broad tonal shaping. Both sections feature individual gain controls and true bypass switching.

  Power is supplied by a single 9V battery, with an optional external supply supported via a 2.5mm barrel jack (center negative). Maximum current draw is under 6 mA. The unit is handbuilt in the USA.
specs: |-
  - Dimensions: 2.5"H × 6"L × 3.5"W
  - Power: Single 9V battery; optional external via 2.5mm barrel jack (center negative)
  - Maximum Current Draw: <6 mA
  - Output: 0 to 3.5 Vrms (40 mV input reference, all controls full)
  - Transistors: 4 bipolar, low-noise
  - Noise Figure: <2 dB across audio band
  - Fuzz Stages: Triple-stage
  - High-Frequency Boost: Single stage, up to 5 kHz
  - True Bypass: Independent footswitch per section
