name: Model 2400
manufacturer: tascam
primaryCategory: mixer
categories:
  - analog
  - digital
  - midi
url: https://tascam.com/us/product/model_2400
description: 24-track flagship analog recording console and live mixer with
  24-in/22-out USB audio interface. Features 16 Ultra HDDA mic preamps on
  channels 1–12 and 13/15/17/19, 1-knob compressors and 3-band parametric EQ on
  channels 1–12, 5 aux sends, 4 stereo sub groups, 16 onboard effects, a 4-band
  digital master EQ, 24-track SD card recording, MIDI DIN IN/OUT, and HUI/MCU
  DAW transport control. Bluetooth audio input on channels 21/22.
details: |-
  Flagship 24-channel analog console with integrated multitrack recorder and USB interface. CH1–12: Ultra HDDA preamps (gain 0–50dB, +48V phantom), 1-knob compressors with bypass, 3-band EQ (sweepable mid 100Hz–8kHz), 100Hz low-cut, insert points, 100mm faders. CH13/15/17/19: XLR mic inputs (rear panel, separate from TRS line jacks). CH14/16/18/20 and CH21–22: TRS line inputs. CH1–2: dedicated front-panel instrument inputs (1MΩ Hi-Z). Talkback XLR on top surface. Master section: 4-band digital EQ, parametric compressor (threshold −32 to 0dB, ratio 1:1 to ∞, attack 2–200ms, release 10–1000ms), 16 editable effects. 8 sub group TRS outputs, 5 aux sends, control room L/R. Bluetooth audio input (SBC/AAC) routes to CH21/22. Settings Panel companion app with meter bridge (Windows/macOS). Compatible with RC-1F footswitch.
specs: |-
  - - Mic inputs: CH1–12 XLR/TRS combo (top strip); CH13/15/17/19 XLR rear; gain 0–50dB; +48V phantom; max +10dBu; EIN −127dBu
  - Line inputs: CH1–22 TRS balanced; max +22dBu (CH1–12), +16dBu (CH13–20); 22kΩ
  - Inst inputs: CH1–2 TS 1MΩ
  - Inserts: CH1–12 TRS; send max +18dBu 100Ω; return max +18dBu 10kΩ
  - Main out: XLR balanced +22dBu max 100Ω; Sub 1–8: TRS +16dBu; Aux 1–5: TRS +16dBu; CR L/R: TRS
  - Headphones: 2× 1/4"; 80mW+80mW @ 32Ω
  - USB: Type-B, 2.0+, Audio Class 2.0; 24-in/22-out; 44.1/48kHz 24-bit
  - MIDI: 5-pin DIN IN/OUT + USB MIDI; HUI/MCU DAW control
  - Recording: WAV (BWF), 16/24-bit, 44.1/48kHz, 24 tracks; SDXC up to 512GB
  - Bluetooth: SBC/AAC (built-in, routes to CH21/22)
  - Power: AC 100–240V 50/60Hz 65W
  - Dimensions: 680.5(W) × 132.5(H) × 568.0(D) mm; weight: 14.0kg
