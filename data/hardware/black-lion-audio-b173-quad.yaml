description: 4-channel British-style mic/DI preamp with Cinemag transformers
details: The B173 Quad puts four channels of Neve 1073-inspired tone in a single
  2U rack, delivering muscular lows, assertive mids, and glossy highs via
  Cinemag transformers on both input and output stages. It delivers 70dB of gain
  with a low noise floor — ideal for low-output ribbon mics. Front-panel Hi-Z DI
  inputs on channels 1 and 2 handle guitars, keyboards, and synthesizers with
  harmonically rich saturation. Stepped input gain and variable output
  attenuation allow precise control over transformer saturation.
specs: |-
  - Preamp Type: Solid State
  - Number of Channels: 4
  - Transformers: Cinemag (input and output)
  - Phantom Power: Yes (+48V)
  - Polarity Switch: Yes (channels 1-2)
  - Gain: 70dB
  - Analog Inputs: 4 x XLR (mic), 2 x 1/4" Hi-Z DI (front, channels 1-2)
  - Analog Outputs: 4 x XLR + 4 x TRS 1/4" (parallel per channel)
  - Form factor: 2U rackmount
  - Power Source: 5-pin AC adapter (included)
