description: The Halcyon Blue Overdrive is a low-to-mid gain drive pedal
  equipped with proprietary Adaptive Circuitry. Inspired by the early '90s
  Marshall Bluesbreaker pedal, its soft-clipping circuit and broad midrange
  emphasis deliver the thick, articulate tones that made the Bluesbreaker
  famous.
details: |-
  The Halcyon Blue Overdrive's party trick is its ADAPT switch. This allows the pedal's boosted midrange to gradually fade away as the pedal cleans up, giving classic Bluesbreaker tone with the guitar cranked but revealing the full spectrum of clean tone as the volume knob is rolled back.

  The MOD setting on the VOICE switch is Origin's own take on the modded Bluesbreaker concept, adding a different diode clipping characteristic, more gain and a warmer frequency response, suited to single coil pickups or rich humbucker lead tones.

  This classic soft-clipping circuit retains some dry, unaffected signal as clipping occurs; the DRY control lets you tweak the level of this dry signal for more shades of overdrive. Designed and built in the UK.
