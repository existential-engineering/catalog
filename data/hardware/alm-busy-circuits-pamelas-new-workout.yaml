description: >-
  Pamela's NEW Workout is a compact programmable clocked modulation source for
  Eurorack systems, featuring 8 independently editable outputs synchronized to a
  BPM-based master clock. Each output can generate a variety of CV waveforms —
  gates, triangle, sine, envelopes, and random — with clock divisors,
  multipliers, Euclidean rhythms, and scale quantization.
details: |-
  Pamela's NEW Workout (ALM017) is ALM Busy Circuits' renowned compact clock and modulation hub for Eurorack modular synthesizers. At just 8HP, it packs eight independently programmable outputs that can run as gates, LFOs, envelopes, or random CV sources — all tempo-locked to a master BPM clock ranging from 10 to 300 BPM. Each output supports a wide range of clock divisors and multipliers from /512 to ×48, including non-integer values, enabling complex polyrhythmic structures from a single source.

  Each output is individually configurable with waveform shape (gate, triangle, sine, envelope, random), phase offset, probability/gate length, Euclidean rhythm patterns, and scale quantization. Two CV inputs allow external modulation of output parameters with configurable offset and attenuation, and the module accepts external clock sync from 1 to 48 PPQN. Logic operations (AND, OR, XOR) can combine multiple outputs for further rhythmic complexity.

  The module features an OLED display for clear parameter editing and stores up to 200 preset banks. Optional expander modules (PEXP-1/PEXP-2) add additional outputs and CV inputs. USB connectivity supports firmware upgrades.

  Pamela's NEW Workout has been discontinued and superseded by the Pamela's PRO Workout (ALM034), though it remains a widely used and deeply capable module prized for its feature density in 8HP.
specs: |-
  - Format: Eurorack
  - Width: 8HP
  - Depth: 32mm
  - Power: +12V 50mA / -12V 5mA
  - Outputs: 8 CV/gate outputs
  - CV Inputs: 2 (with offset and attenuation)
  - Clock Input: 1 (external sync, 1–48 PPQN)
  - Clock Range: 10–300 BPM internal
  - Clock Divisors/Multipliers: /512 to ×48 (including non-integer)
  - Waveforms: Gate, triangle, sine, envelope, random
  - Rhythmic Features: Euclidean patterns, random step-skip, logic (AND/OR/XOR)
  - Scale Quantization: Yes
  - Preset Storage: 200 banks
  - Display: OLED
  - Firmware: Upgradeable via USB
  - Status: Discontinued (succeeded by ALM034 Pamela's PRO Workout)
