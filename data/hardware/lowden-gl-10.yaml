details: |-
  Introduced in 2018, the Lowden GL-10 is the culmination of more than four decades of guitar-making expertise. Its striking single-cut design merges the unmistakable Lowden voice with carefully sculpted contours, delivering exceptional comfort, sustain, and tonal richness. The single-cut profile brings together instantly recognisable Lowden traits and finely shaped body lines, enhanced by unique design details precisely engineered to achieve its distinctive sustain and tonal balance. George Lowden explains: 'When I began designing the GL-10 in 2018, my aim was to create a guitar that felt perfectly balanced, with a very natural sustain driven by body shape and weight distribution. The softened contours and arched top enhance both comfort and weight control. A solid-brass, through-body string anchor embedded deep within the guitar along with a separate rear anchor, both play a key role in delivering its natural sustain.' All Lowden electric guitars are fitted with Lollar pickups which are available in one of three configurations: Imperial Humbuckers, P-90s or Eldorado Split Coil. All GL-10 models are available with a chambered body for weight relief (GL-10CH); dimensions, spec and options are the same across both GL-10 and GL-10CH ranges. See also the GL-J semi-hollow electric.
specs: |-
  - Two-piece African Mahogany body with centre-joined top
  - Three-piece American Mahogany neck with two-piece Rosewood splice
  - Ebony fingerboard with Maple or Mahogany purfling
  - Mother of Pearl side fingerboard markers
  - 630mm (24.8") scale length
  - 305mm (12") fingerboard radius
  - Width at nut - 43.5mm (1.71")
  - Width at 16th fret - 54.5mm (2.14")
  - Neck depth at 1st fret - 22.4mm (0.88")
  - Neck carve - standard GL 'C' profile
  - Lollar pickups (Imperial Humbuckers, P-90s or Eldorado Split Coil)
