details: |-
  The Drive For a Cure is a limited-edition overdrive made by Keeley Electronics with Peter Gusmano's Guitar for a Cure, with a donation of 30 US dollars per pedal going to Project ALS. The run was 50 units, each numbered and signed.

  The pedal introduced a symmetry switch to the Keeley range. The Gain switch sets the shape and symmetry of the clipped signal: to one side the clipping is symmetrical, giving slightly more overdrive at a slightly lower output level, and to the other it is asymmetrical and more tube-like, with slightly less gain and more output volume.

  The tone control was also reworked relative to the usual Keeley design so that it removes less high frequency, giving the pedal a brighter and more lively voice.
