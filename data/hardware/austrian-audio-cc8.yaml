description: The CC8 is a small-diaphragm cardioid true condenser microphone
  featuring a handcrafted OCC7 capsule inspired by the legendary CK1 design.
  Made in Vienna, it delivers a natural and open sound with smooth mids and open
  highs, low self-noise, and match-paired precision (±0.5 dB sensitivity
  tolerance at 1 kHz). Suited for acoustic instruments, strings, woodwinds,
  brass, percussion, drums, and vocals.
details: |-
  The CC8 small-diaphragm cardioid condenser uses the handcrafted OCC7 capsule inspired by the legendary CK1 design. Transformerless output circuit for clean, transparent audio. Match-paired to ±0.5 dB sensitivity tolerance at 1 kHz for accurate stereo recording.

  Features switchable low-cut filters at 60 Hz and 120 Hz (2nd order), and switchable -10 dB and -20 dB pad. High SPL handling up to 146 dB (156 dB with pad).

  Handcrafted in Vienna, Austria.
specs: |-
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity: 15 mV/Pa
  - Equivalent Noise Level: 16 dB SPL (A)
  - Maximum SPL: 146 dB SPL (156 dB SPL with pad)
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 3 mA)
  - Connector: XLR 3-pin
  - Dimensions: 140 × 23 × 23 mm
  - Weight: 140g
  - Polar Pattern: Cardioid
  - Low-cut filter: 60 Hz (2nd order), 120 Hz (2nd order) switchable
  - Pad: -10 dB, -20 dB switchable
  - Capsule: OCC7 (inspired by CK1)
  - Output: Transformerless
  - Match-paired: ±0.5 dB sensitivity tolerance at 1 kHz
