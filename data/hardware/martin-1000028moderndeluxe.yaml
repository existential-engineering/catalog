description: The 000-28 Modern Deluxe blends vintage Martin tone with advanced
  features like a VTS top, carbon fiber bridgeplate, and premium appointments.
  It's a refined Auditorium model crafted for bold tone, beauty, and innovation.
details: |-
  The 000-28 Modern Deluxe blends Martin's heritage craftsmanship with modern precision. A spruce VINTAGE TONE SYSTEM (VTS) top and Golden Era-style Adirondack spruce X-bracing reproduce the resonant, open tone of a nearly century-old Martin.

  Natural protein glue and a lightweight carbon-fiber bridge plate enhance clarity and sustain, while exclusive Liquidmetal bridge pins return energy for added volume. EVO gold frets and a slightly asymmetrical neck provide smooth playability across the fingerboard.

  European flamed-maple binding, Waverly gold open-gear tuners, and a 1933-style pearl logo lend refined beauty. The 000 body offers balanced tone with focused mids, crisp highs, and a responsive dynamic range, perfect for both recording and performance.

  It's classic Martin tone elevated with modern comfort and sophisticated design.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Spruce with VTS, Gloss finish
  - Top Inlay: Bold Herringbone
  - Binding: European Flamed Maple
  - Bridge: Ebony, Modern Belly with drop-in saddle
  - Bridge Pins: Liquidmetal with red acrylic dots
  - Saddle: Compensated bone, 16" radius
  - Rosette: Style 28 Multi-Stripe
  - Pickguard: Tortoise pattern
  - Back/Sides: East Indian Rosewood, Gloss finish
  - Back Purfling: Zig-Zag Authentic
  - Bracing Pattern: X-Brace, GE-scalloped
  - Brace Material: Adirondack Spruce with VTS, 1/4" size
  - Construction: Dovetail neck joint
  - Neck Material: Genuine mahogany, dark mahogany color
  - Neck Shape: Vintage Deluxe
  - Neck Taper: High-Performance Taper
  - Neck Finish: Satin
  - Scale Length: 24.9"
  - Frets: 20 total, joins body at 14th fret
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: Diamonds and squares long pattern, abalone
  - Side Dots: Abalone
  - Headstock: Solid with square taper and diamond
  - Headplate: East Indian Rosewood
  - Logo: Stylized script inlay, 1933-style pearl
  - Tuning Machines: Waverly gold open-gear
  - Nut: Bone
  - Fret Material: EVO gold
  - Electronics: None (optional: LR Baggs Anthem, Fishman Gold Plus Natural, Fishman Infinity Matrix)
  - Case: Ply hardshell with brass/nickel plated hardware
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
  - Left-Handed: Available
  - Pleking: Yes
  - Warranty: Limited Lifetime Warranty
