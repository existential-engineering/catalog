description: A reissue of Danelectro's 1959 'Deluxe' semi-hollow electric
  guitar. Features Vintage 50's Lipstick pickups, adjustable bridge, front and
  back binding, pointer knobs, and Gotoh vintage 15:1 tuners.
details: |-
  Open the pearly gates! Danelectro launched this in 1959, naming it the 'Deluxe'. A huge understatement!

  This hot reissue features our Vintage 50's Lipstick Pickups, adjustable bridge, front and back binding, pointer knobs, and Gotoh vintage 15:1 tuners.
specs: |-
  - Walnut or Flame Maple, Maple on Front and Back of Body
  - Binding Front and Back of Body
  - Double cutaway Shorthorn shape
  - Semi-hollow body with center block
  - Composite/solidwood construction
  - Walnut top and back
  - Scale length: 25"
  - Fretboard radius: 14"
  - Neck Shape: C
  - Nut: 1.65" Bone nut
  - Neck Joint: Bolt-on
  - Neck Wood: Maple with double acting trussrod
  - Fretboard: Pau Ferro
  - Number of frets: 21
  - U3 intonatable saddled bridge
  - Tuner: 3 on a side Gotoh Headmachine
  - Hardware: Chrome
  - 2 Vintage single Lipstick bridge and neck pickup
  - 2 stacked Volume and Tone pots
  - 3-way pickup switch
  - Available colors: Walnut, Maple, Cream
