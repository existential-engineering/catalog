description: >-
  Powered 10" studio subwoofer featuring a custom down-firing driver, 200W Class
  D amplifier, and JBL's patented Slip Stream port for deep bass extension to 27
  Hz, with an XLF mode that emulates club-style bass tuning.
details: |-
  The JBL LSR310S is a 200-watt powered studio subwoofer designed for integration with JBL's 3 Series MkII studio monitor lineup and other professional monitoring systems. Its custom 10" high-excursion, down-firing driver extends bass response to 27 Hz, with a maximum peak SPL of 113 dB, making it suitable for critical listening environments where accurate low-frequency reproduction is essential.

  The signature Slip Stream port uses a double-flared shape that is precisely calculated to optimize low-frequency extension while minimizing port noise and turbulence at high drive levels. This technology, adapted from JBL's high-end reference monitors, allows the subwoofer to maintain accurate and clean bass output well below typical studio monitor capabilities.

  The XLF (Extended Low Frequency) setting provides a specially engineered tuning mode that emulates the ample bass response characteristic of dance club speaker systems. This allows producers and mixers working in electronic music genres to better evaluate how their mixes translate to club environments directly from the studio.

  Three crossover frequency settings (80 Hz, XLF, and External) give users flexibility in how the subwoofer integrates with satellite monitors. The External setting allows the crossover to be handled by an external device or DAW. A selectable input sensitivity switch (-10 dBV / +4 dBu) ensures compatibility with both consumer and professional signal levels.

  The enclosure is constructed from 18mm MDF with a down-firing driver orientation that uses the floor as part of the acoustic loading. All connections are balanced XLR and TRS 1/4", supporting stereo pass-through to satellite monitors.
specs: |-
  - LF Driver: 250mm (10") high-excursion, down-firing
  - Low frequency extension: 27 Hz
  - Maximum peak SPL: 113 dB
  - Amplifier power: 200W Class D
  - Input sensitivity switch: -10 dBV / +4 dBu selectable
  - Crossover settings: 80 Hz, XLF, External
  - Enclosure material: 18mm (3/4") MDF
  - Dimensions (H×W×D): 448 × 381 × 398 mm (17.65 × 15 × 15.65")
  - Weight: 15.6 kg (34.3 lbs)
  - AC voltage: 100–240 VAC ±10%, 50/60 Hz
  - JBL Slip Stream double-flared port technology
  - XLF Extended Low Frequency mode for club-style bass tuning
