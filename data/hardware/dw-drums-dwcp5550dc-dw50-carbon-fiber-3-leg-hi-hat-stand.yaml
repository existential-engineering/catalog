details: |-
  The limited-edition DW 50th Anniversary Carbon Fiber 3-Leg Hi-Hat Stand incorporates a DW50 signature logo on a carbon fiber footboard and heel plate.

  Designed to match the DW50 carbon fiber single and double pedals, this chain-driven stand is also equipped with a Delta Ball Bearing and a lateral cymbal seat adjustment to adjust the angle of the bottom cymbal.

  The stand delivers the speed, precision, and durability expected from 5000 Series hardware, at a reduced weight.
