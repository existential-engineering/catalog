name: TH818
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th818/
description: Open-back premium headphones that carry the essence of the flagship
  TH910 and TH919 into a solid acacia wood housing, with a matte anodized
  aluminum lattice at the opening. Every component apart from the housing is
  identical to the flagship models.
details: |-
  The TH810 and TH818 were developed to bring the musicality born from the resolution and sound quality of the flagship TH910 and TH919 headphones to a wider audience. To capture the essence of the flagship sound without a lacquer finish, solid acacia wood was selected from a variety of premium timbers, making this the new standard model in the premium headphone lineup. All components except the housing are identical to the TH910 and TH919.

  The open-back TH818 features a matte anodized aluminum housing with a geometric lattice motif at the opening. Its precise two-layer structure, created through laser-cut mesh processing, and meticulous adjustment of the opening ratio and internal components reproduce a natural soundstage with high resolution that is easy on the ears. Because the housing is solid natural wood, each piece may vary in grain, texture, color and knots, which has no effect on sound quality.

  The Biodynamic Driver has undergone a significant evolution. A newly developed edge improves amplitude stability, enabling a tight, well-defined bass response without excessive bloating. Suppressing unwanted resonance eliminates muddiness caused by extraneous noise, resulting in a natural and smooth midrange.

  Magnesium alloy is used for mechanical components such as the housing base plate and hangers, resulting in a 20% weight reduction compared to aluminum. Rubber gaskets in the rotating mechanisms minimize unwanted vibration. The head pads and headband are made from natural sheepskin.

  The newly designed ear pads feature a contoured surface that rests against the face, with memory foam in a two-layer structure and silk protein-based synthetic leather offering three times the durability of conventional materials. The internal wiring and included unbalanced cable use 7N (99.99999%) grade high-purity OFC cable, and the optional 4.4 mm balanced cable ET-TH4.4BL2Y or XLR balanced cable ET-TH-XLR2Y can be used.
specs: |-
  - Model: Open-dynamic type
  - Driver: 50 mm neodymium magnet / Biodynamic diaphragm
  - Impedance: 25 ohm
  - Sensitivity: 100 dB/mW
  - Maximum input: 1,800 mW
  - Frequency response: 12.5 to 45,000 Hz
  - Weight: Approx. 385 g (excluding cable)
  - Housing: Solid acacia wood with matte anodized aluminum laser-cut mesh opening
  - Cable: 2 x 3.5 mm (2-pin) mini plugs (L, R) to 6.3 mm gold-plated stereo plug, 7N (99.99999%) grade high-purity OFC, 2 m x 1
  - Accessories: Faux leather pouch, safety precautions, quick start guide
  - Optional balanced cables: 4.4 mm ET-TH4.4BL2Y, XLR ET-TH-XLR2Y
  - Magnesium alloy mechanical parts, natural sheepskin head pads and headband
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
