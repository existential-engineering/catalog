description: Open-back dynamic premium headphones in the TH Premium Series,
  inheriting the flagship sound quality of the TH910/TH919. Features solid
  acacia wood housing with natural grain variation, a newly developed 50mm
  Biodynamic driver for enhanced bass clarity and smooth midrange, lightweight
  magnesium alloy mechanical components, contoured ear pads with silk
  protein-based synthetic leather, and natural sheepskin head pads. Ships with a
  2m 7N high-purity OFC unbalanced Y-cable.
details: |-
  Features:
  - Open-back dynamic design inheriting flagship TH910/TH919 sound quality
  - Solid acacia wood housing with natural grain variation
  - Newly developed 50mm Biodynamic driver for enhanced bass clarity and smooth midrange
  - Lightweight magnesium alloy mechanical components (20% weight reduction)
  - Contoured ear pads with silk protein-based synthetic leather (3x durability)
  - Natural sheepskin head pads and headband
  - Proprietary 7N high-purity OFC cable included

  Weight: Approx. 385 g (excluding cable)

  Accessories: Faux leather pouch, safety precautions documentation, quick start guide, 2 m unbalanced 2-pole 3.5 mm Y-cable
