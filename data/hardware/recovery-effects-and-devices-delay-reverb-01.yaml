details: |-
  DELAY REVERB 01

  (Limited Edition Pocket Sized Effect)

  Introducing DELAY REVERB 01 - a compact, stereo delay and reverb unit that operates at line level. This versatile unit has 1 second of delay time and a large hall reverb, allowing you to effortlessly enhance the depth and dimension of your monosynth, Rhodes, Prophet, or any other audio source. Like the Instrument 01 that morphed into The Mystic desktop synth, the DELAY REVERB 01 may eventually become part of a bigger device down the road, but we couldn't resist offering it as a stand-alone effect. DELAY REVERB 01 is a convenient, powerful, lightweight, travel-size device that doesn't take up too much space. You can easily tuck it into a suitcase, desk drawer, or even your pocket so you always have a great-sounding reverb and delay at your fingertips! Delay and Reverb 01 is powered by a standard 9vdc negative tip power supply ( sold separately ). -Stereo use requires 3.5mm TRS cables. -Mono use requires 3.5mm mono cables. Visit our Instagram account for more demos
