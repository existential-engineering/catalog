details: |-
  The 012-28 Modern Deluxe brings Martin's historic tone to a refined twelve-fret 0-size design. A spruce VINTAGE TONE SYSTEM (VTS) top and Golden Era-style Adirondack spruce X-bracing emulate the warmth and presence of a nearly century-old Martin.

  The concert-sized 0-12 fret body delivers focused, articulate tone with the intimate response that small-body Martins are known for. Paired with East Indian Rosewood back and sides, the instrument balances clarity in the highs with rich, resonant lows.

  Premium appointments include an ebony fingerboard and bridge, gold side-mount Waverly-style tuners, and Liquidmetal bridge pins. The Vintage Deluxe neck shape with High-Performance Taper offers a comfortable, fast-playing feel that complements the guitar's vintage-inspired aesthetic.

  Designed for fingerstyle players and traditionalists, the 012-28 Modern Deluxe ships with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings and a ply hardshell case.
specs: |-
  - Body Size: 0-12 Fret (Concert)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back & Sides: East Indian Rosewood
  - Scale Length: 24.9"
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 13/16"
  - Neck Shape: Vintage Deluxe
  - Neck Taper: High-Performance Taper
  - Bracing: X Brace, GE-Scalloped, Adirondack Spruce
  - Tuners: Gold Side Mount (Waverly style)
  - Bridge Material: Ebony with Liquidmetal pins
  - Frets: 20 total (12-fret neck joint)
  - Case: Ply Hardshell Case
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
