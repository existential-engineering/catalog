description: Unleash the power of dynamics. From the legendary rack unit to the
  500 series module, experience transparent and versatile audio processing.
details: |-
  With exceptional precision and versatile features, the elysia mpressor empowers you to sculpt your mix with surgical accuracy, from gentle shaping to powerful compression. Achieve a perfectly balanced sonic landscape that elevates every element of your music.

  Unleash your creativity with mpressor's innovative features like the "Anti-Log" release, or the Gain Reduction Limiter. Craft unique and expressive sounds that stand out from the crowd, adding that elusive touch of magic to your tracks.

  Compact yet mighty, designed for the 500 Series format, the mpressor|500 packs the same audio quality as its larger counterpart, but in a conveniently portable size. This means you can have the legendary elysia sound at your fingertips, even in the most space-limited setups.

  Trusted by top producers and engineers worldwide, the mpressor is your secret weapon for achieving professional-grade mixes. Its transparent and musical compression ensures your mixes maintain clarity and punch, adapting seamlessly to any genre or style.

  Enjoy an intuitive interface and user-friendly controls, streamlining your workflow to keep you focused on your creativity. Built with top-tier components, the mpressor is reliable and ready to handle your most critical projects.
specs: |-
  - Auto Fast mode shortens the attack time automatically on fast and loud signal impulses
  - Anti Log release inverts the logarithmic release curve for creative compression
  - THD Boost raises or lowers saturation intensity via the gain control, with the sidechain detector running in parallel so the amount of compression is unaffected
  - Gain Reduction Limiter in the control path caps the maximum amount of gain reduction
  - Negative ratios bend the characteristic curve back down past the threshold
  - Analog dynamic gain reduction meter: LED based with brightness modulation for intermediate values
  - Pure feed forward compressor design
  - Frequency response (500 Series Module): <10 Hz to 390 kHz (-3,0 dB)
  - THD+N @ +0 dBu, 20 Hz to 22 kHz (500 Series Module): 0,04 %, and 0,24 % with THD Boost
  - THD+N @ +10 dBu, 20 Hz to 22 kHz (500 Series Module): 0,19 %, and 2,20 % with THD Boost
  - Noise floor, 20 Hz to 20 kHz A-weighted (500 Series Module): -79 dBu, and -78 dBu with THD Boost
  - Dynamic range, 20 Hz to 22 kHz (500 Series Module): 99 dB
  - Maximum input level (500 Series Module): +21 dBu
  - Maximum output level (500 Series Module): +22 dBu
  - Input impedance: 10 kOhm
  - Output impedance: 68 Ohm
  - Power consumption (500 Series Module): 70 mA
  - Potentiometers: 41 steps
