name: I-Tech 4x3500HD
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/i-tech-4x3500hd
description: A four-channel, 4000W @ 4Ω high-powered tour sound amplifier with
  four inputs, fully routable configurations, BSS OMNIDRIVEHD DSP, and
  AES3/CobraNet/VDrive digital connectivity.
details: |-
  The I-Tech 4x3500HD is the industry's first high-powered tour sound amplifier with four inputs and four outputs in fully routable configurations. Built on 6th-generation Class-I (BCA) output circuitry, the amplifier delivers 4000W per channel at 4Ω while maintaining excellent efficiency and audio fidelity.

  Audio inputs include four analog XLR inputs with adjustable sensitivity (1.28Vrms to 8Vrms in 0.1dB increments), plus AES3 digital, VDrive, and CobraNet digital inputs. Outputs are available with either Speakon connectors (4x3500HDS variant) or binding posts (4x3500HDB variant), and network connectivity includes Ethernet, CobraNet, and HiQnet compatibility.

  Onboard DSP is provided by BSS OMNIDRIVEHD, including the LevelMAX limiter suite and linear-phase FIR filters with JBL V5 loudspeaker tuning support. A color LCD display, front-panel USB connector, and Sweep Load Monitoring (SLM) round out the comprehensive feature set.
specs: |-
  - 4 channels (4 inputs, 4 outputs)
  - 4000W @ 4Ω per channel
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Signal-to-Noise Ratio: ≥108dB
  - Frequency Response: ±0.25dB
  - Damping Factor: >5000
  - Common Mode Rejection: >80dB typical
  - Crosstalk: >80dB
  - Intermodulation Distortion: 0.06%
  - Sensitivity: Adjustable 1.28Vrms to 8Vrms (0.1dB increments)
  - Inputs: Analog XLR, AES3, VDrive, CobraNet
  - BSS OMNIDRIVEHD DSP processing
  - LevelMAX Limiter Suite
  - Linear-phase FIR filters with JBL V5 loudspeaker tuning
  - 6th-generation Class-I (BCA) output circuitry
  - Color LCD display with diagnostics
  - Front panel USB connector
  - Sweep Load Monitoring (SLM)
  - Ethernet backbone connectivity, CobraNet, HiQnet compatibility
  - AC Mains: 100–240VAC, 50/60Hz (±15%)
  - Power Connector: 32A PowerCON
  - Dimensions: 89mm H × 483mm W × 431mm D (3.5" × 19" × 16.9")
  - Weight: 13.2 kg (29 lbs)
