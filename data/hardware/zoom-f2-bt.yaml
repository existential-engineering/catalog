description: The F2-BT is the Bluetooth version of the F2 compact field recorder, supplied with the LMF-2 omnidirectional lavalier microphone and recording 32-bit float mono WAV at 44.1 or 48 kHz with no gain to set. Built-in Bluetooth adds wireless transport control, battery and output-volume control from the free Zoom F2 Control app, and timecode received from a Bluetooth sync device.
details: |-
  The F2-BT is the Bluetooth version of the F2 Field Recorder, aimed at podcasters, videographers, bloggers and journalists who need a recorder they can set and forget. The hardware is otherwise the F2: 32-bit float recording with no gain to set, because a dual AD conversion system captures the loudest and the quietest signals without clipping, so the workflow is to plug in the lav and hit record.

  Built-in Bluetooth Ver 4.2 is what sets this model apart. With the free Zoom F2 Control app the F2-BT can wirelessly start and stop recordings, display battery levels, adjust output volume, control lo-cut and more. The F2-BT can also be paired with a Bluetooth timecode synchronization device to receive and write timecode to recorded files.

  Recording formats are 44.1 kHz/32-bit float or 48 kHz/32-bit float mono WAV, written to microSD, microSDHC and microSDXC cards up to 1 TB. The HOLD switch stops a running recording from being ended by accident, and screw-lock connectors keep the lavalier plugged in.

  The included LMF-2 omnidirectional lavalier microphone has a low-profile design, captures high-quality audio, and includes a windscreen and lapel mic clip. Two AAA batteries give about 14 hours of recording on the F2-BT, an hour less than the 15 hours the non-Bluetooth F2 manages.

  The F2 Editor for PC and Mac adjusts settings, formats SD cards and more. Connect the F2-BT with a USB cable and launch the editor. The same USB connection transfers files to a computer.
specs: |-
  - Built-in Bluetooth Ver 4.2, for the Zoom F2 Control app and for pairing with a Bluetooth timecode synchronization device to receive and write timecode
  - 32-bit float recording with no input gain setting (dual AD conversion system)
  - WAV: 44.1 kHz/32-bit float or 48 kHz/32-bit float, mono, BWF format supported
  - Mic input: 3.5 mm stereo mini with screw lock, supports plug-in power (2.5 V)
  - Mic input impedance 2 kilohms or more, maximum input level -5.5 dBu
  - Headphone/line output: 3.5 mm stereo mini with screw lock, 20 mW + 20 mW into a 32 ohm load
  - Storage: microSD, microSDHC and microSDXC cards, Class 4 or higher, up to 1 TB
  - USB Type-C, USB 2.0 High Speed for mass storage and PC app operation
  - Power: 2 AAA batteries (alkaline, lithium or rechargeable NiMH) or Zoom AD-17 DC 5 V/1 A AC adapter
  - Recording time with two AAA batteries: up to 14 hours on the F2-BT
  - Continuous recording with lavalier mic at 48 kHz/32-bit float: about 14 hours alkaline, about 10 hours NiMH (750 mAh), about 18 hours lithium
  - Dimensions: 57.5 mm (W) x 46.4 mm (H) x 22.4 mm (D)
  - Weight: 32 g, main unit only
  - Included LMF-2 lavalier microphone: omnidirectional, -32 dB/Pa at 1 kHz, 115 dB SPL maximum, 160 cm cable, 3.5 mm stereo mini with screw lock
