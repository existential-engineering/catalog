details: |-
  The Black Hole BH2 is a premium 1" cardioid condenser microphone built on JZ's Golden Drop Technology capsule and a Class A discrete amplifier circuit, with advanced shock-mount technology to isolate the capsule from handling and stand-borne vibration.

  It ships with a standard shock mount and thumb screw.
