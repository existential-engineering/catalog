details: |-
  The Météore (pronounced may-tay-or) is Caroline Guitar Company's take on
  reverb, inspired by the ultra-modern line 14 of the Paris Métro. The sleek
  platforms of glass, steel, and tile add all kinds of cool sonic artifacts to
  the space, which informed the pedal's sonic character.

  The pedal keeps your original signal path analog and pure, while giving you
  overdrive and regeneration controls to expand from classic spring reverb sounds
  to something much larger and more atmospheric.

  Handcrafted at Caroline Guitar Company's small batch distortery in Columbia,
  South Carolina. Available in Standard and Anniversary Silver colorways.
specs: |-
  - Analog signal path
  - Overdrive control
  - Regeneration control
  - Spring reverb-inspired character
  - Weight: 20 oz
  - Dimensions: 6 × 4 × 3 in
