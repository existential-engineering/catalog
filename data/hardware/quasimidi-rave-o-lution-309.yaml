description: >-
  The Quasimidi Rave-O-Lution 309 is a standalone groove production workstation built specifically for electronic dance music, featuring a five-part multitimbral engine with dedicated kick, snare, hi-hat, percussion, and bass synth sections. Its real-time tweakability and pattern-based sequencer made it a favorite among DJs and live techno performers.
details: |-
  Released in 1996, the Rave-O-Lution 309 arrived at the peak of the hardware groovebox era and quickly became a staple in the techno and electronic music community. Unlike general-purpose workstations, it was purpose-built for dance music production, with its five-part architecture reflecting the core elements of a typical electronic track.

  The sequencer offers 100 preset motifs and 100 user-programmable motifs, with patterns that can extend up to 64 bars and be chained into 16 songs. Real-time parameter tweaks can be recorded directly into sequences, making it a powerful tool for live performance where evolving, hands-on manipulation of sounds was essential.

  Three optional expansion modules extended the 309's capabilities further: an audio expansion for additional inputs and outputs, a drum expansion adding new samples and MIDI-synced LFOs, and a synth expansion providing a second bass and lead synthesizer voice. Notable users include Apollo 440, Nine Inch Nails, and KMFDM, all of whom incorporated the 309 into their live setups or studio work.
specs: |-
  - Polyphony: 17 voices
  - Multitimbral: 5 parts (kick, snare, hi-hat, percussion, bass synth)
  - Memory: 64 kicks, 64 snares, 64 hi-hats, 128 bass/lead patches, 10 percussion sets
  - Sequencer: 100 preset motifs, 100 user motifs, 100 patterns (up to 64 bars)
  - Songs: 16
  - Interface: 12 pattern-pad keys
  - Control: MIDI
  - Expansions: Audio, Drum, and Synth expansion modules available
