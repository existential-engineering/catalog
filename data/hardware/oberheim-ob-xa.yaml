description: >-
  The OB-Xa is a massive analog polyphonic synthesizer from Oberheim, available in four,
  six, or eight voice configurations with a classic, thick Oberheim sound. It features two
  VCOs per voice, switchable 2-pole/4-pole filters using Curtis CEM3320 chips, and up to
  120 patch memories. A staple of 1980s music, it was used by artists including Van Halen,
  Prince, Depeche Mode, and Jean Michel Jarre.
details: |-
  The OB-Xa succeeded the OB-X and was offered in four, six, or eight voice polyphonic configurations. Early models provided 32 patches minimum across four banks of eight, while many units supported up to 120 patch memories. A key advancement over the OB-X was the integration of Curtis CEM3320 chips, which improved manufacturing efficiency and tuning stability.

  The predecessor OB-X featured a discrete SEM-based 12dB/octave lowpass filter known for its creamy Oberheim character. The OB-Xa switched to CEM3320 Curtis filter chips and introduced switchable filter modes: 12dB/octave (2-pole) or 24dB/octave (4-pole), yielding a more aggressive and versatile sonic character compared to its predecessor.

  Keyboard splitting allows the OB-Xa to function as two independent 4-voice synthesizers with separate patches. Layer mode plays two patches simultaneously across all voices. Additional sound-shaping tools include portamento, unison, sample and hold, chord memory, and three LFOs.

  The OB-Xa became a classic analog workhorse of the 1980s, delivering thick analog pads, punchy bass lines, and cyclic analog effects. It was embraced by artists such as Depeche Mode, Van Halen, Gary Numan, Jean Michel Jarre, New Order, Prince, and Queen.
specs: |-
  - Polyphony: 4, 6, or 8 voices
  - Oscillators: 2 VCOs per voice (pulse and sawtooth waveforms)
  - Filter: CEM3320 4-pole filter with ADSR envelope, switchable 12dB/octave or 24dB/octave
  - VCA: ADSR envelope generator
  - LFOs: 3
  - Features: Portamento, sample & hold, chord memory, unison mode
  - Keyboard: 61 keys with split and layer modes
  - Memory: 32 to 120 patches depending on configuration
  - MIDI: None (available via aftermarket modification)
releaseDate: "1981"
