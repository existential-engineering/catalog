description: Handheld omnidirectional dynamic interview microphone with an
  extended 9.5-inch handle for broadcast ENG and field reporting. The Dyna-Damp
  'mic in-a-mic' internal shock mount keeps handling noise extremely low while a
  four-stage pop filter tames wind and breath blasts in the field.
details: >-
  The Electro-Voice RE50L is a long-handle variant of the classic RE50B handheld
  interview microphone, designed for electronic news gathering, sideline
  reporting, and field interviews where the reporter needs extra reach to keep
  the mic in front of a subject (or off camera) while staying comfortably out of
  the shot. The 9.5-inch aluminum body is finished in semi-gloss black to keep
  it visually unobtrusive on camera.


  A dynamic element with an omnidirectional polar pattern captures both reporter
  and subject evenly without requiring careful aim, and the Dyna-Damp internal
  'mic in-a-mic' shock mount system isolates the capsule from the handle so grip
  movement and clothing brushes do not translate into thumps in the signal. A
  four-stage internal pop filter suppresses wind noise and plosive 'p-pops' for
  clean speech outdoors and in moving vehicles.


  The RE50L is built for broadcast field abuse, designed to withstand high
  humidity, temperature extremes, and corrosive salt air. Output is via a
  standard 3-pin XLR connector on the bottom of the handle, with a low-impedance
  balanced signal at 150 ohms suitable for any professional mixer, camera input,
  or field recorder. The microphone is passive and requires no phantom power.
specs: >-
  - Element: Dynamic

  - Polar pattern: Omnidirectional

  - Frequency response: 80 Hz - 13,000 Hz (-3 dB)

  - Impedance (low-Z balanced): 150 ohms

  - Open circuit voltage: 1.8 mV/Pa

  - Connector: 3-pin XLR

  - Power requirement: Passive

  - Form factor: Handheld (long handle)

  - Wired/wireless: Wired

  - Height: 242 mm (9.5 in)

  - Maximum diameter: 49 mm

  - Net weight: 0.306 lbs

  - Case material: Aluminum

  - Finish: Semi-gloss black

  - Internal shock mount: Dyna-Damp 'mic in-a-mic'

  - Pop filter: Four-stage internal

  - Environmental: Withstands high humidity, temperature extremes, and corrosive
  salt air
