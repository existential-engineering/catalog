details: |-
  The dbx IEM is a personal monitor distribution and amplification system designed for in-ear monitor applications. It provides individual monitor mixes for performers using in-ear monitors in live and studio environments.

  The unit is suitable for portable, tour, and studio applications, enabling performers to receive customized monitor mixes via in-ear monitors.

  Note: This product is discontinued.
