id: xYykOTBMmd2rBCv8GV98X
name: Auteur 8DAT
manufacturer: black-lion-audio
primaryCategory: preamp
categories:
  - rack-mount
  - audio-interface
url: https://blacklionaudio.com/en/products/auteur-8dat
description: 8-channel Auteur mic/line/DI preamp with inserts, word clock, ADAT,
  and 8 Cinemag transformers
details: |-
  The Auteur 8DAT is an 8-channel mic/line/DI preamplifier in a 2U rack with 8 Cinemag output transformers. Combining a fast, transparent IC-based front-end with a colorful Cinemag output stage, it blends American-style snap with British-style saturation. Each channel has independent +48V phantom power, polarity reverse, and -10dB pad. Front-panel 1/4" TRS Hi-Z DI inputs are available on every channel. Line outputs via XLR and DB25. ADAT optical output sends all 8 channels to an existing audio interface. Eight DB25 inserts allow hardware processor integration with A/B switching from the front panel, doubling as mults for parallel or M-S processing. BNC word clock I/O for sync. Macro-MMC clock technology derived from BLA's dedicated clock line. Supports up to 192kHz/24-bit.
specs: |-
  - Channels: 8
  - Transformers: 8 x Cinemag (output)
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Bit depth: 24-bit
  - Digital reference level: +16 dBu = 0 dBFS
  - Mic input gain: +10 to +66 dB
  - Phantom Power: +48V (independent per channel)
  - Frequency response: 20Hz-20kHz ±0.1 dB
  - THD+N: 0.003%
  - Noise floor: -90 dBu
  - Max mic input level: +19 dBu
  - Max output level: +29 dBu
  - Line voltages: ±21V, 1.52A
  - Form factor: 2U rackmount
  - Dimensions: 19" W x 3.4" H x 9" D
  - Weight: 13 lbs.
