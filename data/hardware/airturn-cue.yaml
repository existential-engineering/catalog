details: |-
  Wearable, precise, and performance-ready Bluetooth page turner. Wearable Bluetooth Control for Musicians

  AirTurn Cue is a wrist-mounted Bluetooth controller designed for musicians who need seamless page turns without distraction. With a soft-touch button and low-profile design, Cue lets you advance your digital sheet music with a simple finger press—no foot taps, no awkward gestures. Whether you're performing, conducting, or accompanying, Cue keeps your hands in position and your focus on the music. Built for the Stage

  Sweat-resistant, impact-tested, and built to last, Cue is ready for the demands of live performance. Its sealed housing and durable strap make it ideal for long rehearsals, high-pressure gigs, and everyday practice. Precision Control in Motion

  Cue gives you tactile control you can trust. Whether you're mid-phrase or mid-performance, the responsive buttons deliver clear feedback for confident page turns. Compatible with leading sheet music apps, Cue keeps your flow uninterrupted. Lightweight and Low-Profile

  Cue is compact and unobtrusive, designed to blend into your setup without drawing attention. Whether strapped to your wrist or mounted to a stand, it offers quick access without interfering with your posture, technique, or performance. Built for comfort and clarity, it's there when you need it—and invisible when you don't. Featuring a compact, low-profile design, AirTurn Cue delivers precise fingertip control in a wearable, performance-ready housing. With a soft-touch button and durable construction, it's built for musicians who need reliable page turns in any setting—from rehearsal rooms to concert halls. Lightweight and comfortable to wear, Cue is the ideal solution for navigating digital sheet music without breaking focus.
specs: |-
  - Control your sheet music app—without breaking posture
  - Tap to turn pages from your wrist
  - Stay focused during rehearsals, lessons, and live shows
  - Wrist-Mounted Design: Straps securely to your wrist or instrument stand for intuitive, in-performance access.
  - Durable Yet Discreet: Tough polymer casing resists wear and tear while maintaining a sleek, low-profile silhouette.
  - Stage-Ready Build: Sweat-resistant, impact-tested, and designed to perform under pressure.
  - Extended Battery Life: Enjoy up to 200+ hours of use on a single charge. Rechargeable battery includes status indicators and auto shutoff when your device powers down.
  - Tactile Button: Soft, responsive button with LED backlighting for confident presses—even in low lighting.
  - Built-In App Detection: Automatically adjusts controls for popular media apps.
  - Magnetic Charging: Recharge with a snap-on USB magnetic cable—easy to connect even mid-gig.
  - Long Battery Life: Lasts for multiple days of rehearsals, performances, and practice sessions.
  - Bluetooth 5 Wireless: Strong, low-latency connection with over 200 feet of range for reliable control in large spaces or stages.
  - Broad App Compatibility: Works with hundreds of music and performance apps across iOS and Android.
  - Best-in-Class Warranty: Enjoy peace of mind with a 2-year warranty, which includes coverage for the battery when you register your product.
