details: >-
  Apollo MIDI over Bluetooth free by secret base design is a mobile audio app
  and a software application for macos and ios. It functions as a standalone
  application.


  Apollo MIDI over Bluetooth now has a free trial version for ios -- connection
  times are limited to five minutes; you can test the app, and see if it meets
  your needs. The os x version of apollo is free.


  You can send MIDI between a pair of ios devices, or between ios and mac. We
  think you'll be impressed at how fast and responsive the connections are.


  Ipad 3+, ipad mini, iphone 4+ or newer, ipod touch 5th gen. The app requires
  Bluetooth le.
specs: |-
  - Bluetooth le
