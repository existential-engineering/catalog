description: The LoMenzo HyperDrive is a unique bass distortion pedal created in
  collaboration with hard rock bass legend James LoMenzo (Black Label Society,
  Megadeth, David Lee Roth). Rather than distorting the whole signal, the drive
  section selects a band of mid frequencies and applies distortion only to
  those, leaving the top and bottom end untouched while the mids can be tuned
  from a mild growl to full-on distortion. A tunable distortion frequency range
  and a dry/wet mix control let players balance the effect against the original
  signal, and an Ashdown VU meter paired with the input level knob helps dial in
  the sweet spot for active or passive basses.
details: |-
  Bass distortion pedal created with James LoMenzo. A band of mid-range frequencies is selected and distortion applied only to those, keeping the top and bottom end clean while the powerful mids sweep from mild growl to full distortion. The distortion frequency range is tunable to suit the bass and playing style, and a mix control blends the dry signal back in. An Ashdown VU meter and input level knob set the optimum level for active or passive instruments. Built with metal casing, premium controls and switches, recessed knobs and kickguards protecting the screens and VU meters. Features genuine true bypass switching for zero colouration when disengaged, with an output level control to balance the effect against the true-bypass level.
specs: |-
  - Bass distortion / overdrive pedal
  - Mid-band frequency-selective distortion (top and bottom end left clean)
  - Tunable distortion frequency range
  - Dry/wet mix control
  - Ashdown VU meter with input level control
  - Output level control
  - True bypass switching
  - Metal casing with recessed knobs and kickguards
