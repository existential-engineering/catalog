description: >-
  Korg's popular hybrid synthesizer pairing DWGS digital waveforms with analog filters, offering
  8-voice polyphony, a built-in digital delay, and a 61-key velocity-sensitive keyboard.
details: |-
  The Korg DW-8000 built on the foundation of its predecessor, the DW-6000, and quickly became the more sought-after of the two. Its hybrid architecture combines Korg's DWGS (Digital Waveform Generator System) oscillators with warm analog filters, capturing the best of both digital clarity and analog character.

  Each of its 8 voices features two DWGS oscillators drawing from 16 sampled digital waveforms including sawtooth, square, and sine waves. The analog low-pass resonant filter is a highlight, shaped by a six-stage ADBSSR envelope that provides more nuanced control than the typical four-stage ADSR. A matching six-stage envelope on the VCA adds further expressive depth.

  The 61-key keyboard responds to both velocity and aftertouch, making it a genuinely playable instrument. A 64-note arpeggiator adds rhythmic motion, while the onboard digital delay offers up to 512ms of delay time along with phasing and flanging effects, reducing the need for external processing.

  The DW-8000 was produced from 1985 to 1987 and remains a favorite among synth enthusiasts for its lush pads, crisp digital timbres, and the unmistakable warmth of its analog filter stage. A rackmount version, the EX-8000, was also available.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 DWGS per voice; 16 sampled digital waveforms
  - LFO: Yes
  - Filter: Analog low-pass resonant with ADBSSR envelope
  - VCA: ADBSSR envelope
  - Keyboard: 61 keys (velocity and aftertouch)
  - Arpeggiator: 64-note
  - Effects: Digital delay (up to 512ms, with phasing and flanging)
  - Control: MIDI
releaseDate: "1985"
