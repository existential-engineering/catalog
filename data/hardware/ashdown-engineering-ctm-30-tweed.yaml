description: The CTM-30 Tweed delivers 30 watts of all-valve tone in a tweed
  finish, aimed at recording sessions and smaller gigs. It offers a balanced DI
  output, a front-mounted FX loop, and passive Bass, Middle and Treble EQ with
  Bass Shift, Mid Shift and Bright switching for expanded tonal shaping.
details: |-
  The CTM-30 Tweed is a 30 watt all-valve bass amplifier head in a tweed finish, aimed at recording sessions and smaller gigs. It combines classic valve warmth with flexible tone shaping, including Bass Shift, Mid Shift and Bright switching, a balanced DI output and a front-mounted FX loop. The power stage uses four EL84 tubes with an ECC83 and an ECC82 in the preamp, with a frequency response of 30Hz to 16kHz and a minimum speaker load of 4 ohms.
specs: |-
  - Power output: 30 watts (all-valve)
  - Power tubes: 4 x EL84
  - Preamp tubes: 1 x ECC83, 1 x ECC82
  - Frequency response: 30Hz - 16kHz
  - High instrument input: 450mV
  - Low instrument input: 150mV
  - Speaker outputs: 4 ohm and 8 ohm jack sockets (minimum load 4 ohm)
  - DI output: line level
  - FX loop: valve-driven send, valve-recovered return
  - EQ: passive Bass, Middle, Treble with Bass Shift, Mid Shift, Bright switch
  - Dimensions (H x W x D): 383 x 570 x 351 mm
  - Net weight: 12 kg
