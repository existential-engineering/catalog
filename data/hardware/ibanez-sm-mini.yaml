description: Made in Japan Super Metal mini-pedal preserving the five-knob
  layout of the original SM9 — Edge, Punch, Drive, Attack, and Level — for lush
  distortion and harmonics in a pedalboard-friendly housing.
details: |-
  Part of the MINI pedal family, the Made in Japan SMMINI Super Metal still preserves the five-knob control layout of its bigger brother, the SM9.

  The pedal features 100% analog circuitry delivering amazingly lush distortion and harmonics in a compact, space-saving design. True bypass switching keeps the signal path direct and clean when the pedal is disengaged.
specs: |-
  - Controls: Edge, Punch, Drive, Attack, Level
  - True Bypass switching
  - Required Current: 23mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - 100% analog circuitry
  - Made in Japan
