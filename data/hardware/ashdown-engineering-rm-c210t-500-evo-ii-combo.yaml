description: Experience the Ashdown Rootmaster RM C210-500-T EVO II, the
  ultimate solution for bassists in search of Ashdown's renowned tone, power,
  and reliability without the heavy bulk of high-power amplifiers.
details: |-
  Weighing in at a mere 18KG, this combo amp packs a punch with 500 watts of power, thanks to its two 10" Whiteline Ashdown drivers. It includes an onboard headphone preamp for silent practice sessions, both passive and active input jacks, a 5-band EQ, an onboard compressor, and Ashdown's signature VU meter. The drive control offers rich valve-emulated overdrive, while the sub-harmonic controls add depth to your tone. It is footswitch-compatible, and the rear panel carries a balanced DI out, Line In, and FX Loop. A mute switch allows silent tuning and instrument changes, and the matt anodized alloy front panel enhances visibility under stage lighting.
specs: |-
  - Power output: 500W
  - Speakers: 2 x 10" Whiteline Ashdown drivers
  - Weight: 18kg
  - 5-band EQ
  - Onboard compressor
  - Valve-emulated drive
  - Sub-harmonic controls
  - Balanced DI output
  - FX loop
  - Headphone preamp out
