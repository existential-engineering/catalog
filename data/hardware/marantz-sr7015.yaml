id: ctgwzbUj9RxMiyStLREYB
name: SR7015
manufacturer: marantz
primaryCategory: amplifier
categories:
  - discontinued
capabilities:
  - equalization
  - crossover
  - spatialization
  - harmonic-enhancement
url: https://www.marantz.com/en-us/product/archive-av-receivers/sr7015/300013.html
prices:
  - amount: 1999
    currency: USD
description: Featuring 3D audio, HEOS®, 8K/60Hz pass-through, and voice control.
details: |-
  Featuring 3D audio, Powered by HEOS, 8K/60Hz pass-through, and voice control.

  SR7015 processes up to 11.2 channels and supports Dolby Atmos, DTS:X, Auro 3D and IMAX Enhanced, with an MPEG-H update path.

  Eight HDMI inputs, one of them on the front panel, and three HDMI outputs carry 8K/60 and 4K/120 video with HDCP 2.3, ALLM, QMS, QFT and VRR support.

  Audyssey MultEQ XT32 room correction with Dynamic EQ, Dynamic Volume and LFC is included, alongside a variable crossover, bass sync and optimized bass redirection.

  Three multi-room zones are supported, with two analog multi-room outputs, zone video and HDMI output, and IP, RS232, web and app control.
specs: |-
  - 11.2 channel processing
  - 9 amplifier channels
  - HDMI inputs back / front: 7 / 1
  - HDMI outputs main / zone: 2 / 1
  - HDMI 8K, 4K, CEC and eARC
  - 8K/60 and 4K/120 maximum resolution
  - HDCP 2.3
  - HDMI ALLM, QMS, QFT and VRR
  - Dolby Vision, HDR10+, Dynamic HDR and HLG
  - HDMI to HDMI scaling up to 8K 60/50
  - pass-through in standby
  - Analogue in: 6 rear plus 1 front
  - phono (MM) in
  - 7.1 multichannel input
  - Digital in: 2 optical, 2 coaxial
  - component in / out: 3 / 1
  - composite in / out: 3 plus 1 front / 2
  - Multichannel pre out 11.2
  - subwoofer out 2 (independent)
  - Number of speaker terminals: 11
  - gold plated screw terminals
  - assignable bi-amp drive
  - Multi-room out: 2 analog
  - multi-room zones: 3
  - multi-room video out: video and HDMI
  - Auro 3D
  - Dolby TrueHD and Dolby Atmos
  - DTS-HD Master and DTS:X
  - DTS Virtual:X
  - IMAX Enhanced
  - MPEG-H (update)
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - variable crossover
  - bass sync
  - Compressed Audio Enhancer MDAX2
  - clock jitter reducer
  - HDAM
  - Pure Direct
  - HEOS multi-room and streaming
  - AirPlay 2
  - Bluetooth with headphone transmission
  - Wi-Fi
  - Ethernet
  - IP, RS232, web and app control
  - IR flasher in
  - Marantz Remote Bus
  - 2 DC trigger outputs
  - Power consumption: 710 W
  - standby: 0.2 W
  - network control on: 3.7 W
  - Dimensions without antenna (W x D x H): 440 x 401 x 185 mm
  - weight: 14.2 kg
  - Available colors: Black, Silver-Gold
  - metal front panel
