description: The Friedman ASC-12 is a 12 inch two-way active stage monitor
  voiced for guitar amp modelers and profilers such as the Fractal Audio Axe-Fx,
  Kemper Profiler and Line 6 HD Series. A 500 watt bi-amped Class G power
  section drives a Celestion woofer and compression driver in a traditional
  guitar cabinet enclosure.
details: |-
  The Friedman ASC-12 powered monitor was designed and voiced for use with today's guitar amp modelers and profilers including Fractal Audio Axe-Fx, Kemper Profiler, Line 6 HD Series, Synergy and others. The ASC-12 delivers rich authentic tones, letting players get the most out of these systems in live use and playback applications.

  The ASC-12 features a Celestion 12 inch loudspeaker with a 2.5 inch edge wound voice coil and a premium Celestion high frequency compression driver. At the heart of the ASC-12 is a robust 500 W bi-amp Class G amplifier that is anything but digital. This proprietary amplifier design delivers rich, full tone and a wide frequency response, making it suited to backline, stage monitoring or even main PA duty.

  500 watts of clean, analog power sit behind a familiar and elegant design, so the ASC-12 pushes the tone of a favourite modeler through the air while blending seamlessly with the rest of the rig. It is built for those who prefer the look of a traditional guitar speaker cab.

  The ASC-12 was designed to operate on the floor as a stage monitor or to be pole mounted on a 1.5 inch diameter speaker stand.

  The Friedman ASC-12 powered loudspeaker was designed using advanced acoustic and audio techniques with premium components, comprehensive protection circuitry, and robust construction to provide years of consistent, reliable performance.
specs: |-
  - 12 inch two-way active stage monitor for use with modelers and profilers
  - Bi-amp power module with high efficiency Class G low frequency amplification, high current output stage and custom signal processing
  - Power output LF 270 W rms Class G, HF 80 W rms Class AB+B
  - Maximum total burst power 500 W
  - Low frequency transducer: Celestion 12 inch speaker with 2.5 inch edge wound voice coil
  - High frequency transducer: Celestion PETP film compression driver with 1.75 inch voice coil
  - Heat vented low frequency driver
  - Frequency range 50 Hz to 20 kHz
  - Frequency response 58 Hz to 18 kHz
  - High frequency dispersion 75 degree conical
  - Maximum peak SPL 129 dB
  - Input impedance 20 kohm balanced, 10 kohm unbalanced
  - Input sensitivity 775 mV (0 dBu)
  - Electronic crossover 4th order
  - Switchable low cut filter, 3rd order Butterworth at 100 Hz
  - Controls: level knob, low-cut filter switch, ground lift switch, power switch
  - Line level output for linking multiple speakers
  - Protection: clip and limit, thermal, short circuit, overheat mute
  - Convection cooling
  - Power consumption 1.7 A at 115 Vac, 0.85 A at 230 Vac, 150 VA
  - Connectors: balanced female XLR input, balanced male XLR link output
  - Enclosure: black Warnex painted, Baltic birch plywood construction
  - Hardware: strap handle, rubber feet and rubber strips
  - Floor stage monitor use or pole mount on a 1.5 inch diameter speaker stand
  - Dimensions 533.4 mm x 666.75 mm x 285.75 mm
  - Weight 59 lbs
  - Made in USA using premium worldwide components
