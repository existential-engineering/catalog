name: Volt 4 Max USB Audio Interface
manufacturer: universal-audio
primaryCategory: audio-interface
capabilities:
  - saturation
  - compression
  - auto-gain
url: https://www.uaudio.com/products/volt-4-max
prices:
  - amount: 499
    currency: USD
description: Twelve-in, six-out desktop USB audio interface with Max compression
  and main or alt speaker switching.
details: |-
  Volt 4 Max is a desktop USB audio interface with twelve inputs and six outputs. Two Tone Shaping preamps give 60 dB of gain across the Warmth, Focus and Shine harmonic character modes.

  Max Processing provides onboard realtime compression with six musical presets for vocals, guitars and bass, modelled on classics such as the LA-2A and the 1176, and pairing the Tone and Max stages yields over eighteen character combinations.

  Two mic and line combo inputs join two front-panel Hi-Z instrument inputs and two further line inputs for external gear. Speaker switching selects between main and alt monitor pairs. An ADAT or S/PDIF optical input, MIDI In and Out, an onboard USB hub, a built-in talkback microphone and two headphone outputs sharing one cue mix complete the unit.
specs: |-
  - 12-in / 6-out desktop USB audio interface
  - 32-bit / 192 kHz conversion
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Two Tone Shaping preamps, 60 dB available gain each
  - Warmth, Focus and Shine harmonic character modes
  - Max Processing realtime compression with six presets
  - Speaker switching between main and alt monitor pairs
  - ADAT or S/PDIF optical input, 8 channels at 44.1 and 48 kHz
  - MIDI In and Out on 1/8-inch TRS, MIDI Type A
  - Built-in talkback microphone
  - Two headphone outputs sharing one cue mix
  - Full-colour Smart Display with gain-reduction metering
  - Auto-Gain and Clip Protection
  - USB hub port supplying 5VDC at 0.5A maximum
  - External USB power input requiring 5VDC at 1.5A minimum, 3A supplied
