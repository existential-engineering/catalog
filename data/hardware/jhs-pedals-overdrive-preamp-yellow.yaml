description: A faithful recreation of the rare V1 DOD Overdrive/Preamp 250 in a
  limited yellow colorway, featuring Level and Gain controls plus a slider
  switch to toggle between two early clipping arrangements.
details: |-
  We're finally blowing out the last of the 2022 PCB overstock remnant in a yellow colorway!

  From 2022: In 2019 I stumbled across a pedal that didn't exist. It was a DOD Overdrive / Preamp that predated the "Gray Box" 250 pedals that everyone had assumed were the first version ever made. The pedal was encased in a large gray folded metal enclosure that resembled Electro-Harmonix more than DOD, and it was conspicuously lacking the "250" model number. The sticker on the pedal's backplate said "DOD Electronics Company" and listed the home address of founder David Oreste Di Francesco, as well as a number: 75. According to my interview with David himself a year later, I had found the 75th DOD pedal ever made and one of the first ten DOD Overdrive / Preamps (250) ever sold.

  The JHS Overdrive Preamp is a faithful replication of this unobtainable V1 of DOD's most loved pedal. The Level control adjusts the overall output of the circuit. The Gain control adjusts the amount of gain inside the overdrive circuit. A slider switch offers two different clipping arrangements from two early big-box units.
