description: >-
  The Roland JV-1000 is a 76-key music workstation that combines the sound engine from the
  JV-80 synthesizer with the MC-50mkII sequencer in a single integrated unit. Released in
  1993, it features 28-voice polyphony expandable to 56 voices, FXM synthesis, and a
  complex front panel with eight control sliders for real-time parameter manipulation. The
  JV-1000 supports expansion via VE-GS1 boards and PCM cards, making it a versatile
  platform for composition and live performance.
details: |-
  The Roland JV-1000 merges sequencing and synthesis into one powerful workstation. It is essentially a combination of the Roland MC-50mkII sequencer and a sound module derived from the JV-80, with additional waveforms added to expand its sonic palette.

  The instrument operates in four distinct modes: Patch mode for playing a single tone across the keyboard, Performance mode for layering up to eight patches together, Rhythm mode for accessing five built-in rhythm sections, and V-EXP mode for utilizing connected expansion modules.

  The front panel features a complex yet intuitive layout with eight control sliders. Five of these sliders manage level and presence for the internal sound source and optional expansion boards, while additional sliders serve as MIDI controller assignments and modulation controls. The built-in sequencer provides eight tracks plus a dedicated rhythm track with tempo control and a floppy disk drive for storage.

  Expansion possibilities include the VE-GS1 board, which enhances the available waveforms and increases polyphony from 28 to 56 voices. PCM and data cards provide additional sound libraries, allowing users to continuously expand the instrument's capabilities.
specs: |-
  - Polyphony: 28 voices (expandable to 56 via VE-GS1 board)
  - Keyboard: 76 semi-weighted keys with aftertouch
  - Synthesis: FXM Synthesis
  - Oscillators: 4 per patch
  - Multitimbral: 8 patches per Performance
  - Filter: TVF (digital)
  - Waveforms: 152 (expandable with VE-GS1 board)
  - Memory: 320 patches, 40 performances, 7 rhythm kits
  - LFO: 2 digital LFOs
  - Envelopes: 2 digital envelopes
  - Effects: 3 chorus types, 8 reverb types
  - Sequencer: 8 tracks + rhythm track + tempo control
  - Storage: 3.5-inch floppy disk drive
  - Controls: 8-slider edit palette, 1 assignable MIDI slider, pitch bender, modulation wheel, 2 pedal inputs
  - MIDI: 2 separate output pairs (keyboard and sequencer)
releaseDate: "1993"
