url: https://bastl-instruments.com/eurorack/modules/citadel-wave-bard
description: An experimental 16HP stereo sample player Eurorack module
  reimagining the Kastle 2 Wave Bard. Stores 89 seconds mono / 44 seconds stereo
  at 44kHz/16-bit with 8 samples per bank and up to 32 banks via web editor.
  Features user samples via web loader, pitch control (±2 octaves, quantized
  scales), built-in LFO, tempo generator with tap tempo, user-programmable
  rhythm patterns, resonant filter, stereo delay/chorus, TRS MIDI, and USB-C.
  Reversible panel (Wave Bard / FX Wizard).
details: |-
  The Citadel Wave Bard is an experimental stereo sample player designed for live performance and modular exploration. It stores up to 8 samples per bank (adjustable 3–32 via web editor), with 6 factory banks and up to 32 via the editor. Total storage: 89 seconds mono / 44 seconds stereo at 44kHz/16-bit. User samples uploaded via the Wave Bard Sample Loader web app.

  Pitch control spans ±2 octaves with selectable quantized scales and user-defined scales via the web app. FREE In accepts continuous pitch CV; NOTE In receives quantized pitch CV.

  The built-in LFO outputs triangle and pulse waveforms and syncs to internal clock or external triggers. A tempo generator with tap tempo and user-programmable rhythm patterns — via the web editor — drives pattern CV and gate outputs, enabling sequencer use within a larger modular setup.

  Effects include stereo delay, chorus/flanger, and a resonant filter switchable between lowpass and highpass. Stereo DC-coupled inputs process external audio through the effects engine. Reversible panel: Wave Bard / FX Wizard. MIDI via TRS and USB-C. Open-source firmware on GitHub.
