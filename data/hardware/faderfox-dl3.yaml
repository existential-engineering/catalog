description: Faderfox DL3 is a special controller for Traktor Pro, aimed at FX
  and loop control. The device controls effects, loops, key, cues, transport,
  filters and browser.
details: |-
  DL3 is a compact MIDI controller built as an expansion for DJ software, optimised for Native Instruments Traktor Pro. It is presented as a solution for FX and loop control, and the device controls effects, loops, key, cues, transport, filters and the browser.

  Four FX slots are available, with access to two FX slots simultaneously through 8 pots and 10 buttons, and four presets per FX slot store FX types and FX modes (advanced or chained). Two large loop sections each carry 11 LEDs to show the current loop length alongside 5 buttons, and a browser section adds an encoder and two load buttons with additional tree navigation.

  The unit offers about 250 commands, all freely reassignable, and controls up to four decks with easy switching between decks A-C and B-D on the fly. All 37 coloured buttons carry a double function when the shift button is held down, and 43 LEDs in different colours display various information, including FX, play, sync, loop and filter states fed back from the computer software.

  Connection is over a class-compliant USB interface that needs no driver, and the controller is USB bus powered with a consumption of less than 500 mW / 100 mA. The casing is a compact black plastic desktop format measuring 180 x 105 x 70 mm at 350 g, with a silver aluminium front plate carrying an anodised, abrasion-resistant coating and inscriptions.

  Faders, pots and encoders are high-quality ALPS parts with rubber knobs for tactile feel. Setup files for Traktor Pro and Duo ship with the controller, and the page states the product is discontinued and sold out.
specs: |-
  - Special controller for DJ software (optimised for Native Instruments Traktor Pro)
  - Setup files for Traktor Pro/Duo shipped with the controller
  - USB interface, class compliant, no driver necessary
  - Controls up to four decks, easy switching between deck A-C and B-D on the fly
  - 4 FX slots available, access to 2 FX slots simultaneously by 8 pots and 10 buttons
  - 4 presets per FX slot to store FX types and FX modes (advanced/chained)
  - About 250 commands, all freely reassignable
  - 2 large loop sections with 11 LEDs each to show current loop lengths and 5 buttons
  - Browser section with encoder and 2 load buttons (with additional tree navigation)
  - 37 coloured buttons
  - All controls with double function by holding down the shift button
  - 43 LEDs in different colours to display various information
  - Indication of FX, play, sync, loop and filter states by feedback data from computer software
  - USB bus powering, consumption less than 500 mW / 100 mA
  - Very compact design in a black plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - Silver aluminium front plate with an anodised coating (abrasion resistant) and inscriptions
  - High-quality faders, pots and encoders from ALPS
  - Rubber knobs for best tactile feeling
  - System requirements: PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - System requirements: Native Instruments Traktor Pro/Duo (as of version 1.2.4) or software which allows user assignments of continuous parameters (CC) and note commands
