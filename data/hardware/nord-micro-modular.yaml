description: >-
  A compact desktop virtual modular synthesizer from Clavia that uses companion
  PC software for visual patch design, offering deep synthesis capabilities in a
  minimal four-knob hardware interface.
details: |-
  Released in 1999, the Nord Micro Modular brought the power of modular synthesis to a
  remarkably small and affordable package. As a streamlined version of the full-sized Nord
  Modular, it pairs a tiny hardware unit with computer-based editing software that provides a
  virtual patching environment where users can connect oscillators, filters, envelopes, and
  effects modules in nearly any configuration imaginable.

  The hardware itself features just four assignable knobs, but the depth lies in the software
  editor. The synthesis engine provides six VSM oscillators with triangle, sawtooth, and pulse
  waveforms alongside FM sine waves and noise sources. Eight LFOs, four random pattern
  generators, and over 16,000 patterns offer extensive modulation possibilities. The filter
  section is particularly rich, including parametric and shelving EQ, multimode filters at 12
  or 24 dB per octave, a 14-band filter bank, a vocal filter, and a ring modulator.

  With up to four voices of polyphony and 99 patch memory locations, the Micro Modular trades
  some of the full Nord Modular's DSP headroom for portability and price accessibility. The
  software editor runs on modest hardware requirements of the era, supporting Windows 95/98
  PCs and Power Macintosh systems.

  The Micro Modular found a devoted following among experimental electronic artists including
  Autechre, Speedy J, Kid606, and Somatic Responses, who prized its ability to create unusual
  timbres and unconventional signal routings that conventional synthesizers could not achieve.
specs: |-
  - Polyphony: Up to 4 voices
  - Oscillators: 6 VSM (triangle, sawtooth, pulse), FM sine, noise
  - LFOs: 8 LFOs, 4 random pattern generators, 16,000+ patterns
  - Filters: Multimode 12/24 dB/oct, 14-band filter bank, vocal filter, ring modulator
  - Envelopes: ADSR, AD, attack-hold-decay
  - Memory: 99 patches
  - Keyboard: None
  - Control: MIDI, PC editor software
