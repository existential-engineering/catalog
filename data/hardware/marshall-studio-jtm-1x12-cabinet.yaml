description: Compact 1x12" passive guitar speaker cabinet built to partner the
  Studio JTM head and combo range. Loaded with a single Celestion G12M-65
  Creamback, the ST112 handles 65W at 16Ω and delivers the warm, smooth tones of
  the original JTM45 sound — the very first amp Jim Marshall built — in a
  smaller, more manageable enclosure suited to studio and stage use alike.
details: |-
  - Compact 1x12" cabinet for the Studio JTM range
  - Single Celestion G12M-65 Creamback speaker
  - 65W power handling
  - 16Ω speaker output impedance
  - Single 1/4" jack speaker input
  - Pairs with the Studio JTM head and combo for the original JTM45 sound
