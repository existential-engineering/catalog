description: Compact 1x12" passive guitar speaker cabinet built to partner the Studio JTM head and combo range. Loaded with a single Celestion G12M-65 Creamback, the ST112 handles 65W at 16Ω and delivers the warm, smooth tones of the original JTM45 sound — the very first amp Jim Marshall built — in a smaller, more manageable enclosure suited to studio and stage use alike.
details: |-
  The Studio JTM 1x12 Cabinet brings the iconic tone that sprung Marshall to the forefront of rock 'n' roll in the 60s to today. This 1x12" cab has been designed to be paired with the ST20H to create a small but perfectly formed vintage rig, or used as an extension cab for the ST20C.

  The smaller scale of the ST112 gives players the power of the authentic Marshall tone in a more compact design. With Creamback Celestion speakers, this cab offers that definitive vintage tone.

  Built in Marshall's UK factory and inspired by the JTM45, it is compact and portable while handling 65W into a 16 ohm load.

  Designed and engineered in UK. Made in UK.
