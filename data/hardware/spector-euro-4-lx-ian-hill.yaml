details: |-
  Ian Hill has been holding down the low-end for the legendary Judas Priest for 50 years. To celebrate 50 years of uncompromising metal anthems, Ian's signature bass now features updated specifications. His name is synonymous with classic heavy metal and his signature Spector is carefully crafted to provide his legendary tone to all bassists. The Euro4 Ian Hill is reminiscent of an 80's era Spector with solid Maple body wings, a 3-piece maple neck, Rosewood fingerboard with a custom Judas Priest 50th anniversary inlay, premium electronics and gold hardware. The neck profile on the Euro4 Ian Hill has been carefully tapered to Ian's specifications, resulting in a slimmer shape that's sleek and comfortable. When it comes to reproducing the countless classic tones in the Judas Priest catalog, Ian relies on a single EMG P pickups and a proprietary Spector TonePump active tone circuit. Together, this electronics package delivers enough power and versatility to cut through any mix. The Euro4 Ian Hill is the perfect choice for die-hard fans of Judas Priest, or bassists looking for an instrument that will provide both classic and cutting tones.
