description: There are very few guitars out there that are as famous as Eddie
  Van Halen's favorite 6-string sidekick, lovingly known as "Frankenstein." This
  guitar was Eddie's attempt to combine the sound of a classic single-cut solid
  body guitar with the physical attributes and tremolo bar functionality of a
  Fender Stratocaster. The EVH Frankenstein "Frankie" Series is a civilian
  variant of Eddie Van Halen's iconic red, black, and white Frankenstrat guitar
  - complete with a worn-in relic'd finish.
