id: 6sEBwcdGpEOl5qDgVHsba
name: Little Giant 1000
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/little-giant-1000
description: The Little Giant 1000 is an ultra-compact bass amp head that fits
  in the front pocket of a gig bag yet punches well above its 3.5 kg / 7.7 lb
  weight. It packs switchable active/passive instrument inputs, a 7-band
  semi-parametric EQ, Deep and Shape switches, an EQ in/out switch and an input
  level meter, plus a pre/post switchable balanced DI, FX send and return, line
  in/out and a pair of combination Speakon/Jack speaker outputs, delivering 1000
  watts into 4 Ohms.
details: |-
  Ultra-compact 1000-watt bass head with an internal power supply, measuring just 8.27" x 2.6" x 12.2" and weighing 3.5 kg / 7.7 lbs. Switchable active/passive instrument inputs (high input 10k Ohm, 300 mV to 20 V p-p; low input 1M Ohm, 150 mV to 10 V p-p). 7-band semi-parametric EQ for precise tone shaping: Bass +/-15 dB @ 100 Hz, Lo Mid +/-15 dB 180 Hz to 1.6 kHz (Q = 1 octave), Hi Mid +/-15 dB 750 Hz to 7.5 kHz. Deep and Shape switches, EQ in/out switch, input level control and meter, output level control and power switch. Rear panel: pre/post switchable balanced DI output (600 Ohm balanced, -20 dBu nominal), FX send and return, line input (10k Ohm, 0 dBu nominal) and line output (1k Ohm, 0 dBu nominal), plus a pair of combination Speakon/Jack speaker outputs. Power output 2 x 500W RMS into 4 Ohms. Frequency response -3 dB @ 25 Hz and 25 kHz. Signal to noise greater than 80 dB (EQ flat). Distortion less than 0.5% THD. Dimensions 210 x 66 x 310 mm (H x W x D).
specs: |-
  - Power output: 1000W (2 x 500W RMS into 4 Ohms)
  - Speaker configuration reference: 1 x 12 (head)
  - Switchable active/passive high and low instrument inputs
  - 7-band semi-parametric EQ (Bass, Lo Mid, Hi Mid) +/-15 dB
  - Deep and Shape switches, EQ in/out switch
  - Input level control and meter, output level control
  - Pre/post switchable balanced DI output (600 Ohm, -20 dBu nominal)
  - FX send and return
  - Line input (10k Ohm, 0 dBu nominal) and line output (1k Ohm, 0 dBu nominal)
  - 2 x combination Speakon/Jack speaker outputs
  - Frequency response: -3 dB @ 25 Hz and 25 kHz
  - Signal to noise: greater than 80 dB (EQ flat)
  - Distortion: less than 0.5% THD
  - Dimensions: 210 x 66 x 310 mm (H x W x D)
  - Weight: 3.5 kg / 7.7 lbs
