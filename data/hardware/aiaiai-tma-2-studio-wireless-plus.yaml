description: Ultra-low latency, uncompressed wireless studio headphones.
  Enhanced comfort for long sessions and a clear, detailed sound representation.
  W+ Link delivers consistent 16ms latency with uncompressed audio. No longer in
  production.
details: |-
  Closed-back, over-ear, modular wireless studio headphones built on the TMA-2 platform.

  Configuration: H10 wireless headband (W+ Link), X01 W+ Link transmitter (battery-powered with mini-jack line in and USB-C), S05 speaker units (40mm bio-cellulose diaphragm), E08 over-ear Alcantara memory foam earpads, C02 coiled 1.5m thermoplastic cable extending to 3.2m with 1/4 to 1/8 screw-on adapter, A01 protective pouch.

  W+ Link uses dual antennas with larger bandwidth than Bluetooth for uncompressed, dropout-free audio at a consistent 16ms latency. Also supports Bluetooth mode with 80+ hours of playback, or wired use via the detachable cable.
specs: |-
  - Wireless technology: W+ Link (proprietary low-latency)
  - W+ Link latency: 16 ms
  - W+ Link audio quality: 1500 kbps uncompressed, CD quality (44.1 kHz, 16-bit)
  - Bluetooth playback time: 80+ hours
  - Bluetooth profile: A2DP
  - Driver diameter: 40 mm
  - Diaphragm: Bio-cellulose
  - Earpads: Alcantara memory foam (E08)
  - Weight: 283 g
  - Transmitter input: Mini-jack line in, USB-C
  - Cable: C02 coiled 1.5m (extends to 3.2m)
