description: An all-tube direct box featuring a 6N1P tube, custom Cinemag output
  transformer, and a circuit topology inspired by the Ampeg B-15 bass amplifier,
  delivering warmth and harmonic character to direct signals.
details: |-
  The REDDI All-Tube Direct Box is an all-tube DI unit built around a 6N1P
  dual-triode tube operating at high voltage, inspired by the circuit topology
  of the Ampeg B-15 tube bass amplifier. It is designed to impart warmth and
  harmonic character to direct signals rather than act as a transparent
  pass-through.

  The unit features a custom Cinemag output transformer for balanced XLR output,
  providing up to +22dBu of maximum output level and a wide frequency response
  of 20Hz to 60kHz. Input impedance is 1M ohm, making it suitable for
  high-impedance instrument pickups including piezo-equipped upright basses.

  A front-panel 0–16dB level control allows the output gain to be dialed in,
  while rear-panel controls include a power toggle and a ground lift switch
  to eliminate hum caused by ground loops. A blue LED indicates power status
  on the front panel.

  Handmade in the USA, the REDDI is housed in a bright red steel chassis and
  ships with a 1-year full warranty. It accepts universal mains voltage
  (100/120/230VAC) via an IEC connector.

  Notable users include Stanley Clarke, Pino Palladino, Tony Levin, and
  Chris Wolstenholme.
specs: |-
  - Frequency Response: 20Hz–60kHz
  - Input Impedance: 1M ohm
  - Output Impedance: 600 ohm
  - Gain Range: 0–16dB
  - Maximum Output Level: +22dBu
  - Noise (EIN): -126dB
  - THD Distortion: <0.08% @ 1kHz
  - Tube Type: 6N1P dual-triode
  - Power: 100/120/230VAC, 42W (IEC connector)
  - Dimensions: 3.5" W × 3.5" H × 14.5" D
  - Weight: 10 lb
  - Made in USA
  - 1-year full warranty
