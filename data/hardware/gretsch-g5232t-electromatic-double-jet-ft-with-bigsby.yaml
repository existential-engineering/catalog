details: |-
  The all-new G5232T Electromatic Double Jet FT with Bigsby captures essential Jet power and fidelity at a great price.

  Classic Jet tone begins with a chambered mahogany body with arched maple top that produces full lows and mids with a well-defined, yet smooth high end.

  Black Top Filter'Tron pickups amplify and accentuate the Electromatic Double Jet FT's chambered body to produce a wide, balanced and transparent tone.

  The combination of individual pickup volume controls, master tone and master volume with treble bleed circuit provides intuitive global control.
