description: >-
  The Waldorf X-Pole is a standalone stereo analog filter and amplifier module
  in a rack-mounted format. It features dual self-oscillating 12/24dB per octave
  lowpass filters with ADSR envelopes, an LFO with multiple waveforms, and an
  input-stage overdrive circuit. Fully programmable with 99 patch memories and
  comprehensive MIDI control, it is designed for shaping sounds and creating
  filter effects in both studio and live settings.
details: |-
  The X-Pole represents Waldorf's commitment to analog signal processing in a compact, rack-mounted format. As a dedicated filter processor, it excels at shaping sounds and creating filter effects on drum loops, pads, and any audio source. The self-oscillating filter design allows for both subtle sound sculpting and dramatic filtering effects.

  The unit includes comprehensive modulation capabilities with an LFO offering sine, triangle, sawtooth, square, and sample-and-hold waveforms. Two VCA ADSR envelope generators provide independent control over each channel's amplitude and filter dynamics. An input-stage overdrive circuit adds warmth and authentic analog character to processed signals.

  The stereo architecture enables processing either stereo material or two separate mono signals simultaneously. Full MIDI implementation gives real-time control of all parameters, making the X-Pole well suited for both studio production and live performance. The inclusion of 99 patch memories sets it apart from competing analog filter units of its era.
specs: |-
  - Stereo (or dual mono) operation
  - Analog 12dB/24dB per octave lowpass filter with resonance (self-oscillating)
  - 2 ADSR envelope generators (VCA)
  - 1 LFO with sine, triangle, sawtooth, square, and sample-and-hold waveforms
  - Input-stage overdrive circuit
  - 99 patch memories
  - Full MIDI implementation for real-time parameter control
