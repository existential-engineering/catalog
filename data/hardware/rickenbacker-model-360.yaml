name: Model 360
manufacturer: rickenbacker
primaryCategory: electric-guitar
url: https://www.rickenbacker.com/guitars/model-360/
description: Explore the Model 360 guitar, known for its stunning design and
  unmatched comfort in the world of hollow body guitars.
details: |-
  This guitar broke all the rules of traditional styling when it appeared amid
  the 'British' sound of the 1960's. Subtly updated through the years, this
  Deluxe hollow body with its special contour around the entire body
  perimeter, is still perhaps the most comfortable guitar of all.

  The bound body and Rosewood fingerboard, inlayed with triangular pearloid
  markers, provide an exceptionally attractive appearance. Stereo output is
  standard, allowing the Model 360 to be split into separate signal paths via
  Rickenbacker's signature Rick-O-Sound feature.

  A Deluxe semi-acoustic hollow body crafted from maple with a maple and
  walnut neck and rosewood fingerboard. Two Hi-gain pickups deliver the
  chiming, articulate voice that defined the jangle of 1960s British Invasion
  records and continues to influence pop and rock players today.
specs: |-
  - Semi-acoustic hollow body construction
  - Maple body
  - Maple and walnut neck
  - Rosewood fingerboard
  - Triangular pearloid fret markers
  - Bound body
  - 21 frets
  - Scale length: 62.9 cm (24 3/4")
  - Neck width at nut: 41.4 mm (1.63")
  - Crown radius: 25.4 cm (10")
  - Overall length: 101 cm (39 3/4")
  - Overall width: 38.1 cm (15")
  - Overall depth: 38.1 mm (1 1/2")
  - Weight: 3.6 kg (8.0 lbs.)
  - 2 Hi-gain pickups
  - 6-saddle bridge
  - 'R' tailpiece
  - Gotoh machine heads
  - Mono and stereo (Rick-O-Sound) output
