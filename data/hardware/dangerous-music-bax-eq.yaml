description: Stereo Mastering and Mix Bus Shelving Equalizer with Stepped Controls
details: |-
  The Dangerous BAX EQ is the first professional, stand-alone EQ to leverage the classic Baxandall bass and treble tone-control curves originally designed by Peter Baxandall. Designed by Chris Muth, it has become an essential tool among mixing, mastering, and tracking engineers, many of whom leave it patched into their signal path full time.

  At its core are gently sweeping treble and bass EQ shelves that provide subtle yet profound, musical control over wide sections of the frequency spectrum rather than surgical, narrow-band correction. The broad curves extend far below and above the range of human hearing, delivering a distinctively sweet, open treble and a powerful, three-dimensional low end.

  Built from the same ultra-high-grade components used throughout Dangerous Music's line, the BAX EQ's shelves maintain phase coherence, allowing powerful tonal changes without substantially altering the original sonic characteristics of the source.

  Beyond the shelf controls, phase-coherent high-pass and low-pass filters expand its versatility: the low end can be cut below 12 Hz to remove infrasonic rumble and DC offset, while the high end can cut ultrasonics that can translate as harshness in some A/D converters.

  Suited to a mastering rig, a full mix, or any tracking chain, the BAX EQ incorporates Dangerous Music's sophisticated circuit design, uncompromising component quality, and elegant, straightforward operation.
specs: |-
  - Frequency Response: ±0.1dB (10Hz-20kHz); ±0.2dB (1Hz-80kHz)
  - Maximum Level: >+28dBu
  - Noise Floor: <-92dBu (band-limited 22Hz-22kHz)
  - THD+N: <0.002%
  - IMD: <0.003%
  - Crosstalk Rejection: >105dB
  - Input Impedance: 25K Ohms
  - Output Impedance: 50 Ohms
