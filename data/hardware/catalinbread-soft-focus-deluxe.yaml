description: The Soft Focus Deluxe is an all-in-one shoegaze multi-effects pedal
  based on the legendary Yamaha FX500 patch 40, featuring six programs with
  reverb, modulation, delay, and pitch shifting. It includes a footswitchable
  op-amp distortion circuit that can run in series or parallel with the Soft
  Focus engine, and a multi-function TAP/EXP jack for expression control or tap
  tempo. The Deluxe adds back the delay line missing from the original model,
  delivering adjustable echo with pulsating reverb swells.
details: |-
  The Soft Focus Deluxe features six programs: (1) Standard Soft Focus, (2) Long Reverb Tails, (3) Deep Modulation Warble, (4) Shimmer Soft Focus, (5) Pitch Delay with Strong Shimmer, (6) Expression Pedal Input Control. Footswitchable op-amp distortion circuit runs in series or parallel with the Soft Focus engine via toggle switch.

  Controls: PRGM (program selector), MIX, MOD, VERB, DLY, TIME, DST LVL. The TAP/EXP jack accepts the CB Tap companion footswitch (sold separately) via TRS for tap tempo, or an expression pedal for parameter control in Program 6. Buffered bypass with trails. No battery operation supported.
specs: |-
  - Six programs
  - Footswitchable distortion circuit, selectable in series or in parallel with the Soft Focus patch
  - Multi-function jack for expression control or tap tempo
