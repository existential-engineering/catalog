description: >-
  The updated rack-mount version of Alesis's QuadraSynth with expanded 20MB
  sample ROM, delivering 64-voice polyphony and 16-part multitimbral capability
  with QuadraVerb-based effects processing.
details: |-
  The Alesis S4 Plus arrived in 1995 as an update to the original S4, expanding the sample ROM from 16MB to 20MB (expandable to 28MB) while retaining the same 64-voice polyphony and 16-part multitimbral architecture. The additional ROM added more sounds to an already generous palette.

  The synthesis engine employs digital additive and subtractive sample playback, drawing on a broad library of acoustic and electronic sounds spread across 128 preset and 128 user programs. A mix mode allows layering and splitting across 100 preset and 100 user configurations, all addressable over 16 MIDI channels for full multitimbral operation.

  Four onboard effects based on the respected QuadraVerb 2 processor provide reverbs, delays, modulation, and other treatments without the need for external gear. The ADAT optical digital interface integrates smoothly with Alesis's own multitrack recording ecosystem, while a PCMCIA card slot enables convenient patch and sample storage.
specs: |-
  - Polyphony: 64 voices
  - Sound source: 48kHz linear PCM samples
  - ROM: 20MB (expandable to 28MB)
  - Multitimbral: 16 parts
  - Effects: 4 onboard (QuadraVerb 2 based)
  - Memory: 128 preset / 128 user programs; 100 preset / 100 user mixes
  - Outputs: 4 audio outputs, ADAT optical digital interface
  - Expansion: PCMCIA card slot
  - Control: MIDI IN/OUT/THRU (16 channels)
