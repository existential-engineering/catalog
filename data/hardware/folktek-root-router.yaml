id: MNemrrqMZNjsHC4K86CLt
name: Root - Router
manufacturer: folktek
primaryCategory: routing
categories:
  - modular
url: https://folktek.com/products/root
description: A Eurorack utility module that takes a single audio or CV input,
  applies attenuation, and routes the signal to any or all of four selectable
  outputs.
details: |-
  Root, like our other utility modules is deceptively simple. It will become integral to your patch instantly and you'll probably consider that it would be handy to have two of them. It takes a single audio or CV input, adds attenuation, and routes to any or all of four outputs. The clickless, zero-loss outputs are selectable with the touch pad and the light indicates where the root signal is going. There are several distinct and incredibly useful reasons for this module. If you have a single audio source which you'd like to route to any of 4 effects or paths, or split a signal to 2 stereo effect inputs, your single audio source can easily be routed as you like at the push of a button rather than plugging and unplugging. Attenuation is good for this because you can essentially fade your root sound instead of suddenly dropping it prior to selecting a new routing. Or route CV/gate/trigger and turn your parts on and off to add/subtract control from your composition. Using in conjunction with Quiet is highly recommended. TOUCH PADS, INPUTS/OUTPUTS

  Four hexagonal touch-based buttons

  - Accepts any single incoming CV, gate, trigger, audio source. - Light indicates signal is passing to selected output when lit, muted when dark. SPECS

  +12V: 45mA -12V: 25mA +5V: 0mA
  6HP width
  25mm depth
  View on Modular Grid: https://www.modulargrid.net/e/folktek-root-copper
