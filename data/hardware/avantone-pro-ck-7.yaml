description: Large-capsule FET condenser microphone with 34mm 6-micron capsule,
  transformer-coupled circuit, three-way polar pattern selector (cardioid, omni,
  figure-8), 80Hz high-pass filter, and -10dB pad — all-metal construction with
  no plastic components.
details: |-
  The CK-7+ features a 34mm, 6-micron capsule paired with Avantone's
  transformer-coupled FET circuit. It delivers full low-end response, rich
  midrange, and well-defined smooth highs. The unit includes a solid brass
  milled hull and woven steel-grill construction with no plastic components.

  The CK-7+ offers a three-way polar pattern selector (Cardioid,
  Omnidirectional, Figure 8), an 80Hz high-pass filter (6dB/octave), and a
  -10dB attenuation pad. It features a retro-style design with a Metallic
  Cabernet Red body and Polished Nickel trim, and ships with a custom 16-point
  shock mount for vibration isolation, housed in a wooden box inside a metal
  carrying case.
specs: |-
  - Type: True Condenser (transformer coupled)
  - Capsule: 34mm, 6-micron
  - Polar Patterns: Cardioid, Omnidirectional, Figure 8
  - Frequency Response: 20–20,000 Hz ±3dB
  - Output Impedance: ≤250 Ohms
  - Sensitivity: -38 dB
  - S/N Ratio: 77dB re 1Pa
  - Maximum SPL: 139dB (0.5% THD)
  - Equivalent Noise Level: <16 dB (A-Weighted)
  - Output Connector: Male XLR 3-pin
  - Power: 48V Phantom, 5mA
  - Dimensions: 187mm × 51mm
  - Weight: 0.65 kg
