description: >-
  Synthesizers.com Portable Systems are USA-made classic-styled custom analog modular
  synthesizers designed for portability and road use. Available in QSP22 (22-space) and
  QSP44 (44-space) cabinet configurations, they use the same form factor as Moog modulars
  with an upgraded power supply. The systems feature stable oscillators, ladder and state
  variable filters, a 14-bank fixed filter bank, and 24-step analog sequencers that can be
  daisy-chained.
details: |-
  Synthesizers.com specializes in modern analog modular synthesizers designed for portability and road-worthiness. Their Portable Systems use the same form factor as Moog modulars but feature an upgraded power supply and modern reliability. The design philosophy emphasizes hyper-modularity, where any module can be placed anywhere without rewiring.

  The QSP22 provides a 22-space road-worthy cabinet with essential synthesis modules, while the QSP44 expands to 44 spaces for more complex configurations. Both systems include stable oscillators tracking across multiple octaves, a 24dB ladder filter, a state variable filter, and a 14-bank fixed filter bank.

  Modules feature reversible attenuators and mixers designed to minimize patch cable clutter and improve intuitive patching. The 24-step analog sequencers can be daisy-chained for extended sequences. A Q104 MIDI Interface provides connectivity with MIDI IN, Gate Out, Trigger Out, Pitch Out, and Velocity Out.

  Additional configurations are available in Studio (QSS) and Rack (QSR) formats. An optional 5-octave monophonic/duophonic studio keyboard with velocity sensitivity is also available.
specs: |-
  - Q106 Analog Oscillators (3 in QSP22, 6 in QSP44) with Sine, Triangle, Saw, Ramp, and Pulse waveforms
  - Q110 Noise Source with White, Pink, and Low Frequency noise
  - Q107 State Variable Filter (12dB/oct Low/Band/High Pass, 6dB/oct Notch)
  - Q127 Fixed Filter Bank (14-band)
  - Q116 Ring Modulator
  - Q108 Amplifier and Q109 Envelope Generator (ADSR)
  - Q119 24-step analog sequencer (daisy-chainable)
  - Q104 MIDI Interface (MIDI IN, Gate Out, Trigger Out, Pitch Out, Velocity Out)
  - Q117 Sample and Hold
  - Optional 5-octave monophonic/duophonic studio keyboard with velocity
  - Portable road-worthy cabinet format
releaseDate: "2000"
