name: DRM212
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/drm-powered-series/DRM212.html
description: "12-inch powered loudspeaker combines powerful amplification and
  proprietary technology to provide impeccable sound for clubs, cafes, houses of
  worship and more."
details: |-
  The Mackie DRM212 represents everything we've learned across decades of designing loudspeakers for venues, clubs, mobile DJs, and more. From karaoke night to sunday service, the DRM212 comes equipped with all the power, reliability, and versatility needed for modern high-demand applications. With custom high-output transducers, Advanced Impulse™ DSP and high-efficiency amplification, you'll always get the cleanest sound possible—no matter where the stage is. The DRM Series is available in multiple point source configurations, line array, plus a companion powered subwoofer.

  Advanced Impulse™ DSP removes acoustic anomalies through FIR filtering across entire dispersion zones and frequency ranges.

  DRM Control Dashboard™ features big, bright full-color display with single-knob control for setup and adjustments.
specs: |-
  - Power: 1600W Class-D amplifier
  - LF Driver: 12" High-excursion woofer
  - HF Driver: 1.4" Titanium diaphragm compression driver
  - Inputs: Dual XLR/TRS
  - Aux Inputs: Stereo 1/8"
  - Outputs: XLR Direct Out per channel + Mix Out
  - Frequency Response: 45Hz - 20 kHz
  - Max SPL: 134 dB
  - Weight: 42.0 lb / 19 kg
  - Cabinet: 15mm plywood construction
