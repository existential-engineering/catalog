description: >-
  The Casio XW-P1 is a 61-key performance synthesizer that combines virtual analog
  synthesis with sample-based digital sound sources. It features Casio's Hybrid Processing
  Sound Source, a step sequencer, arpeggiator, and real-time performance controls designed
  for live musicians.
details: |-
  Casio introduced the XW-P1 alongside the XW-G1 groove synthesizer in 2012 as part of their return to the professional synthesizer market. The instrument was specifically engineered for performing musicians who needed portable, gig-ready functionality without sacrificing sonic depth.

  The XW-P1 incorporates Casio's proprietary Hybrid Processing Sound Source, which blends virtual analog monophonic leads and basses with traditional sample-based sounds. This combination allows players to access authentic electric pianos, drawbar organs, drums, and orchestral textures alongside modern synthesis capabilities.

  Performance-oriented features include a nine-track step sequencer with eight patterns per sequence, dedicated percussion controls, rotary speaker effects, and live transposition capability. The synth supports HexLayer tones — complex layered sounds built from up to six components — enabling sophisticated splits, velocity switching, and layering possibilities directly from the hardware.

  The XW-P1's competitive pricing relative to its feature set, combined with battery operation capability, made it an accessible choice for touring musicians and session players seeking integrated composition and performance tools.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 6 VCOs
  - Waveforms: Additive, ROM
  - Keyboard: 61 non-weighted keys
  - Controllers: 4 real-time knobs, pitch bend wheel, modulation wheel, 9 sliders
  - Filter: 6dB, 12dB, 18dB slope, band pass, high pass, low pass with resonance
  - LFO: 2 LFOs with noise, saw, sine, square, triangle waveforms
  - Envelopes: 4 VCA with ADSR
  - Sequencer: 8-track with phrase measure and note quantize
  - Arpeggiator: Yes, with overdub
  - MIDI: In/Out/Thru
  - USB: Class-compliant
