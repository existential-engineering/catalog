description: "The Mackie DRM315 Professional 3-Way Powered Loudspeaker features
  2300W of class-leading power, Advanced Impulse DSP for unmatched clarity, and
  the DRM Control Dashboard with full-color display for easy control. Great for
  both mobile and permanent install applications."
details: |-
  The Mackie DRM315 Professional 3-Way Powered Loudspeaker features 2300W of class-leading power, Advanced Impulse DSP for unmatched clarity, and the DRM Control Dashboard with full-color display for easy control. Great for both mobile and permanent install applications.

  The DRM315 delivers enhanced vocal clarity and separation thanks to its powerful 3-way design. Match it with the thunderous DRM18S subwoofer for incredible fidelity and clarity across the full frequency spectrum. The DRM315 is perfect for mobile DJs, bands, clubs, houses of worship, production/install, and more that require some serious punch and versatility.
specs: |-
  - 2300W Class-D amplifier
  - Universal power supply (100-240 VAC) with Power Factor Correction
  - Advanced Impulse DSP module with FIR Filtering
  - DRM Control Dashboard with full-color display
  - 3-Band Parametric EQ
  - Venue Specific Voicing Modes (Live, Club, Speech)
  - Variable Crossover
  - Alignment Delay
  - Up to 6 user presets
  - Dual independent inputs (XLR/TRS mic/line/instrument)
  - Dedicated 1/8" stereo aux input
  - 15mm plywood construction
  - Rotatable waveguide assembly
  - 1.4" Titanium diaphragm compression driver
  - 6.5" Midrange transducer
  - 15" High-excursion woofer
  - 12xM10 flypoints
  - Frequency Response: 35Hz - 20 kHz
  - Max SPL: 137 dB
  - Weight: 67.7 lb / 30.72 kg
