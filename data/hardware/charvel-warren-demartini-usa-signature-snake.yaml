description: Legendary lead guitarist Warren DeMartini led glam metal sensation
  Ratt to the top of the charts in the 1980s, co-writing several of the band's
  biggest hits that earned multiple platinum albums. Praised for his technique
  and unique playing style that incorporates heavy vibrato, DeMartini garnered a
  reputation as one of the greatest guitarists in the industry. Charvel proudly
  honors the esteemed musician with the Warren DeMartini USA Signature Snake, a
  ferocious tone machine wrapped in DeMartini's signature sultry snakeskin
  finish.
details: |-
  The Warren DeMartini USA Signature Snake is built around a San Dimas Style 1 alder body finished in satin with DeMartini's signature Snakeskin Graphic finish.

  The bolt-on quartersawn maple neck uses a 4-bolt standard joint with a hand-rubbed satin urethane finish and is shaped to a Speed Neck profile with rolled fingerboard edges. The 25.5" scale maple fingerboard has a 12" to 16" compound radius, 22 jumbo frets, black dot position inlays, a Floyd Rose locking nut, and a 1.6875" nut width.

  Electronics include a Seymour Duncan Custom Warren DeMartini RTM humbucker at the bridge and a Seymour Duncan Quarter Pound Flat SSL-4 single-coil at the neck in an HS configuration, controlled by a single volume knob and a 3-position toggle switch.

  Hardware includes a Floyd Rose Original double-locking 2-point tremolo, Gotoh die-cast tuning machines, NOS Charvel brass strap buttons, and a black hardware finish throughout. The guitar is strung with nickel plated steel strings (.009-.042) and ships in a Charvel hardshell case, with an optional gig bag available.
