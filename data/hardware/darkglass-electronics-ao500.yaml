id: Q9BYZQ3T1JJdqfS0M0KIO
name: Alpha·Omega 500
manufacturer: darkglass-electronics
primaryCategory: bass-amplifier
url: https://www.darkglass.com/products/ao500
description: The Alpha·Omega 500 is a 500-watt bass amplifier head combining
  Darkglass' signature Alpha and Omega distortion engines with a studio-grade
  VCA compressor, 6-band graphic EQ, cabinet simulation, and USB IR loading.
details: |-
  The Alpha·Omega 500 is a professional 500-watt bass amplifier head combining Darkglass Electronics' signature distortion technology with modern studio-grade processing. It features dual distortion engines, Alpha and Omega, offering everything from mild overdrive to aggressive high-gain tones, alongside a studio-grade VCA compressor and an ultra-quiet 6-band graphic equalizer for comprehensive tone shaping.

  Cabinet simulation technology includes three selectable impulse response slots feeding both the headphone and XLR DI outputs, while USB connectivity lets users load custom impulse responses via the Darkglass Suite software.

  Connectivity is extensive: a 1/4-inch instrument input, a speakON combo speaker output, a balanced XLR DI with ground lift, a headphone output, an aux input, a 1/4-inch effects loop (send and return), a footswitch jack, and a USB Type-B connector. It runs on a universal 100-230 V, 50-60 Hz IEC supply.
specs: |-
  - 500 W amplifier with the signature Darkglass Alpha and Omega distortion engines
  - Cab sim with 3 selectable impulse responses
  - Studio-grade 6-band graphic EQ and intelligent VCA compressor
  - Expanded connectivity with aux in, headphone output, and DI output
  - 1/4-inch effects loop (send and return)
  - USB connector to load user impulse responses via Darkglass Suite
  - Universal power: 100-230 V, 50-60 Hz
