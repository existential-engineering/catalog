description: The JADE is a linear-phase active near/midfield reference monitor
  engineered alongside Andy Munro for the mastering and mixing community. The
  cabinet houses a time-aligned two-way system with both drivers physically
  offset on the baffle to bring their acoustic centres into phase, giving a flat
  impulse response.
details: |-
  An 8-inch Neoflex woofer in a reflex-loaded cabinet handles low frequencies down to 55 Hz, while a 1.25-inch soft-dome HF driver covers the top end out to 17 kHz with minimal coloration. Each driver is powered by its own dedicated 100 W MOS-FET amplifier with full protection circuitry, eliminating the impedance interaction and crossover insertion loss of passive designs.

  A balanced XLR input feeds an analogue crossover and trim network with HF and LF shelving EQ for room compensation. Driver-protection circuits intervene before damage, preserving the unit during sustained reference-level monitoring.

  Engineers reached for the JADE in mastering suites, mixing rooms and broadcast control rooms where translation across playback systems is the deciding criterion. Its linear-phase response and low coloration made it a trusted second reference alongside larger soffit-mounted main monitors.
specs: |-
  - Two-way time-aligned active design with linear-phase configuration
  - 8-inch Neoflex woofer, reflex-loaded
  - 1.25-inch soft-dome HF driver
  - 2 x 100 W MOS-FET amplification with comprehensive protection
  - Frequency response essentially flat 55 Hz to 17 kHz
  - Balanced XLR input
  - HF and LF shelving EQ for room trim
  - Designed and built in the United Kingdom
