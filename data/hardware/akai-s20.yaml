description: >-
  A stereo phrase sampler with expandable memory, built-in sequencer, and floppy disk
  drive for sample interchange, targeted at DJs and home studios.
details: |-
  Akai's S20 Stereo Phrase Sampler presents a tabletop version of the S01 with major improvements including stereo input/output and expanded memory capacity up to 17 MB. The standard 1 MB configuration enables sampling between 7 to 56 seconds, while upgrading to 17 MB extends capability from 131 seconds in stereo 32kHz mode to 1048 seconds in mono 8kHz mode.

  The S20 is engineered as a budget-friendly desktop phrase sampler designed for DJs and home project studios, delivering excellent value. An onboard 3.5 inch high density floppy disk drive facilitates sample interchange with higher-end Akai samplers or enables loading onto computers for further editing.

  Notable limitations include the complete absence of onboard effects and a rather basic built-in sequencer. The unit utilizes RCA jacks instead of 1/4 inch stereo plugs, which may appeal to some users while frustrating others. Paired with an external sequencer and outboard effects or filter, the S20 functions as a capable, economical sampler.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 16 bit, 32 kHz, 16 kHz, 8 kHz. 4th order delta/sigma 64 times oversampling
  - Memory: 1MB memory (STEREO, MONO), expandable to 5MB or 17MB by 72-pin SIMM
  - LFO: None
  - VCF: None
  - VCA: level and release are controllable
  - Effects: None
  - Sequencer: 4 tracks, 30,000 notes
  - Keyboard: 16 pads
  - Control: MIDI (16-channels, 2x IN, 1x OUT, 1x THRU)
  - Date Produced: 1997
releaseDate: "1997"
releaseDateYearOnly: true
