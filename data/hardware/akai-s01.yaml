description: >-
  A 2-space rack unit MIDI digital sampler released by Akai in 1993, offering 8-voice
  polyphony and expandable sample memory for entry-level sampling or as a companion to
  larger Akai samplers.
details: |-
  Released in 1993, the Akai S01 is a 2-space rack unit offering 8 voices of polyphony and 1 MB of sample memory, expandable to 2 MB with the optional EXM01 expansion, providing roughly 15 to 30 seconds of sample time. Sampling specs are 16-bit at 32 kHz (not CD-quality), and the sampler only records samples in mono.

    The eight trigger buttons on the front panel correspond to each of the 8 samples that can be loaded, and can be used to trigger them directly. Sample editing includes truncate, transpose, loop, and reverse functions. A built-in 3.5-inch floppy disk drive allows storing samples or loading from libraries, though the unit has no SCSI interface.

    The S01 features two MIDI inputs which can be switched via a front panel switch, one mono sample input, one mono output and one headphone output at the front panel, and one mono output at the back. Playback and sampling can also be controlled with an additional footswitch. It was positioned as an excellent entry-level sampler or a useful addition to setups already featuring the S-1000, S-1100, or MPC2000.
specs: |-
  - Polyphony: 8 voices
    - Sampler: 16-bit, 32 kHz linear
    - Memory: 1 MB (15.6 seconds), expandable to 2 MB with EXM01 (32.25 seconds)
    - VCA: Level and release controllable
    - Control: MIDI 16-channel (2x IN, 1x OUT, 1x THRU)
    - Built-in 3.5-inch floppy disk drive
    - Eight front-panel trigger buttons
    - Sample editing: truncate, transpose, loop, reverse
    - Mono sampling and playback
    - Footswitch input for playback/sampling control
