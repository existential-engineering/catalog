details: |-
  The Compressor Plus is Keeley's advancement of its two and four knob compressor line. It adds a Release switch tuned for single coils or humbuckers, a Tone control that emphasises the harmonics most easily lost in compression, and a Blend control that retains the peaks of a performance along with the phasing of the guitar signal. The result keeps the frequency push and tone sweetening of the earlier compressors while handling a wider range of instruments.

  The pedal is a compressor with an expander and sustainer. As well as limiting the peaks of a performance, it adds gain as notes fade out, producing sustain and bloom on held notes and bends. The Release switch eases the move between single coil and humbucker guitars: humbuckers carry more average energy, which can hold a compressor in compression longer and dull a run of notes, so a quicker release keeps attack and definition on each note.

  The Tone control is derived from the emphasis circuits used in analogue delays and other vintage effects to recover treble after the BBD line, reworked here as a full tone control that adds back the highs lost in the compression process. The Blend control lets peaks and transients come through while sustain is added behind them, so the pedal suits subtle ambient washes and loop building as readily as funk or chicken picking, and it also works as an amp push.

  This Custom Shop limited edition offers the Compressor Plus in a set of limited finishes, with the storefront listing eight variations. The pedal is built in the United States.
