description: The 1959 Overdrive Pedal delivers the authentic Marshall experience, distilling the classic Plexi tones synonymous with crunchy overdrive into a compact stompbox. Inspired by the iconic 1959 Super Lead amplifier, it replicates the dynamic range and tonal character of the original through tactile rotary knobs that mirror the amp's controls, an illuminated footswitch, and the unmistakable black and gold Marshall finish.
details: |-
  Bring authentic Marshall tone wherever you go without the strain of heavy equipment. Whether you're on stage, at home, or playing a local gig, experience the legendary 1959 amp tone with ultimate convenience. Designed and engineered in UK. Made in Vietnam.

  The 1959 Pedal delivers an authentic Marshall experience with classic Plexi tones synonymous with crunchy overdrive. It faithfully captures the dynamic range, clarity, and rich tonal character that defined the vintage roar of the original 1959.

  Staying true to the classic Marshall look, the 1959 Pedal features distinctive Marshall design elements with its black and gold finish. Offering unparalleled versatility and sonic excellence, this pedal ensures every detail resonates with Marshall's legendary quality and heritage.

  Feel in total control over your sound while performing thanks to the 1959 Pedal's tactile rotary knobs and the illuminated foot pedal. Each rotary control knob mirrors the intuitive functionality of its amp counterpart, putting legendary tone within easy reach.

  The pedal carries the Premier Guitar Premier Gear award, which celebrates standout instruments, pedals and gear that excel in tone, innovation, and craftsmanship.
