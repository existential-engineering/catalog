description: >-
  The Quasimidi PolyMorph is a virtually analog desktop synthesizer and
  sequencer released in 1999 as the successor to the RaveOLution 309. It
  features four independent synth and drum sound modules with three oscillators
  per voice, dual resonant filters, and a 16-step sequencer with real-time
  performance controls. Notable users include Orbital, Jean-Michel Jarre, and
  The Prodigy.
details: |-
  The PolyMorph was designed as a full-featured performance synthesizer targeting the electronic dance music market. Building on the foundation of the RaveOLution 309, it expanded the synthesis engine significantly with three oscillators per voice offering 128 waveforms including sine, saw, square, pulse width modulation, and triangle, plus 30 sampled waves, a noise source, and external audio input.

  Each voice features individual ADSR envelopes and two resonant filters, a 12dB high-pass and a switchable 12/24dB low-pass, providing extensive per-voice sound sculpting. Three LFOs per voice with sine, triangle, saw, square, and sample-and-hold waveforms add deep modulation possibilities.

  The integrated 16-step sequencer supports 8 variations across 4 parts, enabling real-time muting, note modification, and part manipulation during live performance. Two effects processors per part offer distortion, 2-band EQ, delay, chorus, and flange effects. Memory stores 128 patches and 64 performances. The desktop form factor with its hands-on control surface made it popular for both studio production and live electronic music sets.
specs: |-
  - Polyphony: 8-16 voices
  - Oscillators: 3 per voice with 128 waveforms plus 30 sampled waves
  - Waveforms: Sine, saw, square, PWM, triangle, noise, external audio input
  - LFO: 3 per voice (sine, triangle, saw, square, sample/hold)
  - Filter: 2 resonant filters per voice (12dB high-pass, 12/24dB low-pass)
  - Envelopes: Individual ADSR per oscillator
  - Effects: 2 per part (distortion, 2-band EQ, delay, chorus, flange)
  - Sequencer: 16-step, 8 variations, 4 parts
  - Memory: 128 patches, 64 performances
  - Control: MIDI (4 parts)
