description: >-
  Boss Bow Tie is an 8-way bidirectional voltage-controlled switch that routes
  signals between inputs and outputs under CV control, operating as either one
  input to up to eight outputs or up to eight inputs to a single output. A
  normalised gate input enables and disables switching for rhythmic routing
  effects.
details: |-
  Boss Bow Tie is a bidirectional 8-way voltage-controlled switch designed primarily for CV signal routing in Eurorack systems. A single control voltage, shaped by an onboard attenuverter and offset control, selects which of the eight I/O sockets is active at any moment, enabling precise, repeatable routing of signals to different destinations or sources across a patch.

  The module operates in two logical modes determined by patching: one input distributed to any of eight outputs, or any of eight inputs collapsed to a single output. Because the switching is bidirectional, the same physical jacks serve either role. A normalised gate input can enable and disable the switch, creating rhythmic signal routing effects when driven by a sequencer or clock.

  Boss Bow Tie operates at speeds up to audio rates, though switching audio signals may introduce audible clicks; it excels in CV applications such as sequenced patch routing, sequential switch duties, and control-voltage multiplexing. The module is discontinued and has been succeeded by the Boss Bow Two (ALM027). It is 6HP wide and skiff-friendly at 32mm depth.
specs: |-
  - Size: 6HP
  - Depth: 32mm
  - Power: +12V 50mA / -12V 50mA
  - Switch type: 8-way bidirectional voltage-controlled
  - I/O jacks: 8 × bidirectional signal I/O
  - Control: CV input with attenuverter and offset
  - Gate input: normalised (enables/disables switch)
  - Switching speed: up to audio rates
  - Primary use: CV routing (audio possible with audible clicks)
  - Status: Discontinued — succeeded by Boss Bow Two (ALM027)
  - Manufactured in England
