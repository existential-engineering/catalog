details: |-
  DW's cable hi-hat systems have long been known as the most smooth and responsive in the industry. A higher quality cable yields a better remote hat, and the latest detachable linkage and sturdy, low profile housing take this hi-tech hi-hat further (U.S. Patent No. 5267500).

  The standard 9000 Series model comes with an 8-foot cable, with 2, 4, 6 and 10-foot cables sold separately. The cymbal stand is sold separately.

  The 9502LB comes complete with MG-1 and MG-2 Mega Clamp mounting hardware, the 505 Drop-Lock Clutch and a nylon hardware bag for protection and convenient storage.

  A high-tech ball bearing hinge provides smooth, quick action, and the uni-body folding footboard stays attached to the base casting when secured in the folded position.
specs: |-
  - Remote cable hi-hat with detachable linkage and low profile housing
  - Ships with an 8-foot cable (2, 4, 6 and 10-foot cables sold separately)
  - Includes MG-1 and MG-2 Mega Clamp mounting hardware
  - Includes the 505 Drop-Lock Clutch
  - Includes a hardware bag
  - Ball bearing hinge
  - Uni-body folding footboard
  - U.S. Patent No. 5267500
  - Cymbal stand sold separately
