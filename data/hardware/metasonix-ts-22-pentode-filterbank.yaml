description: >-
  The Metasonix TS-22 Pentode FilterBank is a rack-mount analog filter processor
  utilizing four independent vacuum-tube bandpass filters that can be swept
  across a four-octave range. Each filter features adjustable resonance capable
  of self-oscillation, and a built-in pentode VCA provides dynamic amplitude
  control with external CV compatibility.
details: |-
  The TS-22 represents Metasonix's approach to analog signal processing through tube-based filtration. The device employs vacuum tubes as its core filtering elements, contributing to a distinctive sonic character that is analog, clean, and sometimes unpredictable. This unpredictability stems from the organic nature of tube circuitry, where component aging and thermal characteristics introduce subtle variations over time.

  The filter architecture allows users to manipulate four different frequency bands independently. Each bandpass filter covers a one-octave range within a larger four-octave span starting at 50 Hz, enabling both surgical and dramatic equalization depending on user intent. The resonance controls push each filter toward self-oscillation, transforming them into tone generators when fully engaged.

  The included pentode VCA provides dynamic control over the filtered signal's amplitude. Users can integrate external CV sources from other analog synthesizers, making the TS-22 compatible with modular synthesis environments. A viewing window reveals the glowing tubes during operation, adding visual feedback to the sonic experience.
specs: |-
  - Polyphony: Mono input/output
  - Filter type: Four vacuum-tube bandpass filters with resonance
  - Filter frequency range: 50 Hz to approximately 25.6 kHz
  - Individual filter range: One-octave tuning range per filter
  - VCA: Built-in vacuum-tube pentode voltage-controlled amplifier
  - Control interface: CV inputs for filter sweep and VCA modulation
  - Form factor: Rack-mount
