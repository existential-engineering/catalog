description: The D-28 Authentic 1937 combines vintage specs, VTS-aged Adirondack
  spruce, and lush Guatemalan rosewood for rich pre-war tone.
details: |-
  The D-28 Authentic 1937 is part of Martin's Authentic Series, faithfully recreating the iconic pre-war Dreadnought design with historically accurate detailing modeled after 1930s and 1940s D-28s.

  Built entirely with hide glue and constructed by hand, the guitar features a VTS (Vintage Tone System) Adirondack spruce top, which is thermally aged to deliver the warm, broken-in tone of a vintage instrument from day one. Lush Guatemalan rosewood back and sides provide rich, balanced overtones with strong bass response.

  Forward-shifted, hand-scalloped 5/16" Adirondack spruce X-bracing supports the top while allowing it to vibrate freely, producing the bold projection and complex harmonics that defined the pre-war Dreadnought sound. The Authentic 1937 neck shape with standard taper, ebony fingerboard, and dovetail neck joint round out the period-correct construction.

  Waverly nickel open-back tuners, an Authentic Belly ebony bridge with long saddle, and a Vintage Gloss finish complete the historically faithful appointments. The guitar ships pre-strung with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium strings in a ply hardshell case with brass and nickel hardware.
specs: |-
  - Body size: Authentic D-14 Fret (Dreadnought)
  - Top: Adirondack Spruce with VTS (Vintage Tone System)
  - Back & Sides: Guatemalan Rosewood
  - Neck: Authentic 1937 mahogany with Standard Taper
  - Scale Length: 25.4"
  - Fingerboard: Ebony, 1 3/4" width at nut, 2 1/4" at 12th fret
  - Bracing: Forward-shifted hand-scalloped X-brace, 5/16" Adirondack spruce
  - Bridge: Ebony, Authentic Belly with long saddle
  - Tuners: Waverly Nickel Open Back
  - Finish: Vintage Gloss
  - Frets: 20 total; joins body at 14th fret
  - Construction: Dovetail neck joint, hide glue throughout
  - Electronics: None
  - Case: Ply Hardshell with brass/nickel hardware
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium (pre-strung)
