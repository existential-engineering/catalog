description: '10" 2000W High-Performance Powered Loudspeaker. Sets a new
  industry standard for portable loudspeakers, delivering best-in-class
  performance, clarity and technology powered by an advanced 2000W Class-D
  amplifier platform.'
details: |-
  Mackie SRM210 V-Class sets a new industry standard for portable loudspeakers, bringing the best-in-class performance, clarity and technology you need when compromise isn't an option. Built on the most advanced amplifier platform ever developed, this 2000W Class-D amp outperforms competing portable loudspeakers with the highest SPL in its class while delivering stability, fidelity and reliability.

  Custom transducers feature large magnets, robust motors and specially designed voice coils with a polymer high-frequency driver. The custom Sym-X horn brings out the very best from the high-frequency transducer while maintaining the flattest response at the crossover point.

  Advanced Impulse DSP removes signal anomalies from "honkiness" to "mushy" low end for clean sound. Intelligent Bass Management technology maintains tonal balance at very high SPL, keeping bass tight and punchy for EDM and pop music.

  The built-in SRM Mix Control 4-channel digital mixer handles multiple sources with professional tools, including channel levels and EQ adjustment, application and venue-specific voicing modes, variable crossover point, alignment delay up to 100 ms, and the ability to save and recall up to 10 user presets. SRM Connect App control with Bluetooth streaming and linking adds wireless flexibility. The dual-angled cabinet design allows use as a PA speaker or floor monitor.
specs: |-
  - 2000W Class-D Amplifier
  - Universal power supply (100-240 VAC) with Power Factor Correction
  - 10" low-frequency driver
  - Premium polymer high-frequency driver
  - Custom Sym-X Horn
  - Advanced Impulse DSP with precision crossover and transducer time-alignment
  - Transparent System Protection with multi-band compression
  - Intelligent Bass Management
  - SRM Mix Control 4-channel digital mixer
  - Dual independent channels (XLR/TRS combo inputs)
  - Dedicated 1/8" stereo aux channel
  - Direct outputs on channels 1 and 2 plus mix output
  - High-contrast full color display
  - Application and venue-specific voicing modes
  - Variable crossover point
  - Alignment delay (up to 100 ms)
  - Save and recall up to 10 user presets
  - System lock with 4-digit passcode
  - SRM Connect App control
  - Bluetooth streaming and linking
  - Dual-angled cabinet design (PA speaker or floor monitor)
  - Pole mount capability
  - M10 fly points for overhead installation
  - Maximum SPL Peak: 131 dB
  - Frequency Response: 45 Hz – 20 kHz
  - Horizontal Coverage Angle: 90°
  - Vertical Coverage Angle: 60°
  - Height: 23.0 in / 584 mm
  - Width: 15.1 in / 384 mm
  - Depth: 12.9 in / 328 mm
  - Weight: 30.9 lb / 14.0 kg
