hp: 6
url: https://www.ericasynths.lv/midi-to-trigger-module-75/
description: Erica Synths MIDI to Trigger module lets you control your drum
  modules and trigger events on your modular from any MIDI sequencer!
details: |-
  The Erica Synths MIDI to Trigger module takes a MIDI sequencer and uses it to trigger events on a modular synthesizer, whether that means drum modules such as the hexinverter.net Mutant Drums range or Tiptop Audio classical drum modules, or envelope generators driving VCAs. It converts any MIDI note into one of eight 10ms trigger signals.

  Usability was the design priority, so programming the module takes seconds. It works with any MIDI sequencer and controller, which means there is no need to change controller settings: the module is reprogrammed instead.

  Assignment of MIDI notes to triggers is quick, the MIDI channel is configurable, LEDs indicate which triggers are active, and a MIDI clock output can be switched on. The power input carries diode protection against a reversed supply.

  The trigger signal level is +5V and there are eight trigger outputs. The module is 6HP wide and 25mm deep, and draws 15mA on the +12V rail and nothing on the -12V rail.
specs: |-
  - Converts MIDI notes into Trigger signals
  - 8 Trigger outputs
  - Trigger signal level +5V
  - 10ms trigger length
  - LED indication of active Triggers
  - Easy assignment of MIDI notes to triggers
  - Configurable MIDI channel
  - Switchable MIDI clock output
  - Diode protection on reversed power supply
  - Power consumption 15mA@+12V, 0mA@-12V
  - Module width 6HP
  - Module depth 25mm
