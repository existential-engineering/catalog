details: |-
  The Stage Natural Amber guitar features the Córdoba Stage body, which was specifically designed with live performers in mind. Its 38mm (1 1/2") deep body is constructed of solid mahogany, strategically chambered to reduce weight and increase resonance, and capped with a solid spruce top. A soft body cutaway provides increased comfort and easy access to higher frets. The Stage Natural Amber guitar’s unique Fusion neck is slightly thinner and narrower than conventional nylon-string guitar necks, offering a playing experience closer to that of a steel-string guitar.

  The Stage Natural Amber showcases Córdoba’s Exotic Top design: an ultra-thin premium flamed maple veneer applied to a solid spruce top, providing the ideal balance of tone and beauty—and in this case with an eye-catching Natural Amber top finish. The guitar’s solid mahogany body combined with a solid spruce top produces a clear and focused yet warm tone, including rich lows enhanced by fanned top bracing. The combination also results in exceptional responsiveness to playing dynamics across a broad range.

  The Stage Natural Amber features the Stage Pickup System co-developed with Fishman. It pairs an under-saddle transducer with internal body sensors, a combination that produces a warm, clear, authentic nylon-string tone with exceptional balance and also eliminates the “quack” typically associated with piezo pickups. A professional-quality preamp with easily accessible Volume, EQ, and Body Blend controls provides even more precise tone shaping, which can come in handy when adjusting to differing venues.
