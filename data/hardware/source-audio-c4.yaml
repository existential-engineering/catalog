description: C4 Synth unites all the sound creation tools of a classic Eurorack
  modular synthesizer and packages them in a compact and easy-to-use effects
  pedal for guitar or bass.
details: |-
  C4 Synth unites the sound creation tools of a classic Eurorack modular synthesizer in a compact effects pedal for guitar or bass. It offers 4 independent voices that can be mixed together, each with customizable oscillator wave shapes, pitch shifters, and harmonizers.

  The synth engine includes 3 oscillators (sine, square, saw), 11 envelope followers, 25 filter effects, and 14 LFO wave shapes, plus programmable sequencers running two simultaneous patterns.

  C4 provides supreme pitch tracking with minimal latency, and stores 128 presets (6 accessible via the pedal switch, 128 via MIDI). It supports stereo I/O, expression input, and Universal Bypass.

  The pedal integrates deeply with Neuro 3 software (Mac/Windows/iOS/Android) for editing and preset sharing, and connects via Mini USB for software and MIDI.
specs: |-
  - 4 independent voices, mixable
  - 3 oscillators: sine, square, saw
  - 11 envelope followers, 25 filter effects, 14 LFO wave shapes
  - Programmable sequencers (two simultaneous patterns)
  - Pitch shifters and harmonizers per voice
  - Supreme tracking with minimal latency
  - 128 presets (6 via pedal switch, 128 via MIDI)
  - Stereo I/O and expression input
  - Universal Bypass
  - Neuro 3 software integration
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
