description: >-
  The Encore Electronics Knobby is a programmable 8-knob MIDI controller designed to add hands-on control to knobless synthesizers and virtual instruments, with software-based configuration and non-volatile memory.
details: |-
  The Knobby is a dedicated MIDI controller built to solve a common problem of its era: bringing tactile, real-time control to synthesizers and software instruments that lack physical knobs. Its eight knobs with scribble strips can be assigned to up to 120 functions across 15 banks, selected via four group buttons on the front panel.

  Configuration is handled through dedicated software that allows assignment of MIDI controllers, registered and non-registered parameters, and system exclusive messages up to 55 bytes in length. This makes the Knobby capable of controlling difficult-to-program instruments like the Roland Alpha Juno series and MKS rack units, as well as more conventional gear like the Juno-106 and JP-8000. The software includes drag-and-drop knob definition, a library manager, simulated LED indicators, and instrument channel remapping.

  The Knobby shipped with pre-configured setups for many popular instruments and also works with virtual synthesizers including ReBirth, Reaktor, and Reason. All settings are stored in non-volatile EEPROM memory, eliminating the need for batteries. Tweaks made via the controller can be recorded directly into a sequencer for automation. Software was available for Windows 95/98/NT and Macintosh with OMS 2.0 or later.
specs: |-
  - Knobs: 8 with scribble strips
  - Banks: 15 groups of 8 knobs (120 programmable controls)
  - MIDI: Programmable controllers, NRPN, sysex (up to 55 bytes)
  - Memory: Non-volatile EEPROM (no batteries required)
  - Software: Windows 95/98/NT, Macintosh (OMS 2.0+)
  - Control: MIDI
releaseDate: "2000"
