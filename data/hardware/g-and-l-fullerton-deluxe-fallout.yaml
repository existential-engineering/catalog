description: The Fullerton Deluxe Fallout is a modern take on the 1983 G&L SC-2,
  sharing that guitar's body shape and an easy-playing medium-C neck with a 9.5"
  radius and medium-jumbo frets. It pairs a G&L Alnico P-90 neck pickup with a
  meaty G&L AW4370 bridge humbucker.
details: |-
  What would an '83 G&L SC-2 be if Leo Fender recreated it for today's scene? The crew at G&L think it would be a lot like the Fallout. After all, when inspiration comes from original G&L SC guitars modded by the likes of Devo's Mark and Bob Mothersbaugh and Band Of Susans' Robert Poss, there are lots of cues to follow.

  The SC-2 was born as a cool looking, comfortable and light axe that could be thrashed mercilessly and not miss a beat. Fallout keeps those qualities in the mix but branches out to cover today's sophisticated textures and tones.

  The Fullerton Deluxe Fallout shares the original Leo Fender-designed SC-2 body shape, comfortable, sustain-rich G&L Dual-Fulcrum vibrato and easy-playing medium-C-shape neck with a 9.5" radius and medium-jumbo frets.

  From dirty riffs to jangly hooks, Fallout delivers with a great pairing of a G&L Alnico P-90 neck pickup and a meaty G&L AW4370 bridge humbucker.

  The look transcends the SC-2's simplicity with a sweeping pickguard that complements the body shape perfectly. Balancing out the aesthetics is a sleeker interpretation of the '80s-era G&L headstock shape designed exclusively for the Fallout.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L P-90 in neck position, G&L AW4370 Zebra humbucker in bridge position
  - Body wood: Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Slim C with 12" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Controls: 3-position pickup selector, volume, tone with push/pull coil tap
  - Includes: G&L Deluxe Gig Bag
  - Available in: Sunset Coral over Alder, 3-ply parchment pickguard, Maple fingerboard
  - Available in: 3-Tone Sunburst over Alder, 3-ply tortoise pickguard, Rosewood fingerboard
  - Available in: Alpine White over Alder, 3-ply pearl pickguard, Maple fingerboard
