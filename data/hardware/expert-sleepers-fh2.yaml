  USB MIDI device.
details: |-
  The FH-2 'factotum' is an 8HP Eurorack module that combines MIDI to CV conversion, including polyphonic and MPE operation, with clock generation and synchronisation, LFO generation including tempo-synced LFOs, arpeggiators, Euclidean pattern generators, sequencers, CV to MIDI conversion and preset storage. Because a constant voltage can be stored for each output, it can also serve as a dedicated preset recall module.

  The module is simultaneously a USB MIDI host, a USB MIDI device, and it supports traditional 5-pin DIN or TRS MIDI and the Select Bus. Drum triggers are supported, including triggers with velocity or accents, and automatic VCO calibration similar to that in Silent Way is available.

  The FH-2 has 8 high precision CV outputs, expandable to 64 with the FHX-8CV Expander. Up to 64 additional gate, trigger and clock outputs can be added with the FHX-8GT Gate Expander, for a possible total of 128 outputs.

  With a MIDI keyboard it offers up to 16 note polyphonic conversion, with optional pitch, gate and velocity CVs per note, keyboard splits and arpeggiation. With an MPE controller, up to 16 simultaneous touches are converted with full position, pressure and glide per touch. With a MIDI controller it provides up to 64 outputs, direct control of CVs from faders, flexible syncable LFOs and triggers from pads. With a groovebox it gives multiple clock outs at different divisions and run/stop triggers, and the groovebox, the FH-2 or another module can be the clock master.

  The module can be configured entirely from its own interface, a rotary encoder with push button, a second push button and a 0.91 inch OLED display, and a web based configuration tool communicates with it directly over MIDI SysEx. As a clock generator it can act as the clocking centre of a modular system, generating syncable LFOs, with no USB connection at all.
specs: |-
  - Panel width: 8HP
  - Module depth: 48mm
  - Current draw: 118mA on the +12V rail, 48mA on the -12V rail, plus the power requirement of any attached USB device
  - Outputs: 8
  - Digital-to-analogue conversion: 14 bit
  - Voltage range: software selectable between +/-5V and 0-10V
  - Inputs: 2 CV inputs
  - USB host: Type A connector, class compliant USB MIDI host, class compliant USB HID host (for mice, gamepads etc.), supports USB hubs
  - USB device: Type C connector, class compliant USB MIDI device (plug and play with macOS, Windows, Linux and iOS)
  - Expansion: header for connecting FHX-8CV or FHX-8GT expanders
  - Expansion: header for 5-pin DIN or TRS MIDI via a compatible breakout
  - An FH-1 may also be used as an expander, over USB
  - Compatible with the Select Bus (Rev 2 hardware, from April 2025)
  - Controls: 1 rotary encoder with push button, 1 push button
  - 0.91 inch OLED display
