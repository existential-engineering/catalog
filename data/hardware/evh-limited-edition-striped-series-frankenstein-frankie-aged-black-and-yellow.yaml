details: |-
  The EVH Limited Edition Frankie Aged Black and Yellow Striped guitar captures the raw spirit and legendary tone that defined a generation of rock music. This meticulously crafted tribute to Eddie Van Halen's most famous instrument delivers authentic EVH performance with the unmistakable visual impact of the Frankie's iconic striped finish.

  Sporting Eddie's black and yellow paint job and an aged look, the all-new Frankie features a basswood Stratocaster®-style body paired to a graphite-reinforced quartersawn maple neck. An oiled finish on the back of the neck allows for hours of playing comfort, while the 12"-16" compound radius maple fingerboard with 22 jumbo frets was designed for fast and furious playing styles.

  Routed for an HSS pickup configuration just like Eddie's original, Frankie features an EVH Wolfgang® humbucking bridge pickup with a red phenolic bobbin EVH Strat® neck pickup (selectable via push/push volume knob) and a dummy five-way blade housed in the middle position.

  A sturdy and dependable EVH-branded Floyd Rose® locking trem and Floyd Rose locking nut work in tandem for precise tuning even with extreme changes in pitch, while the EVH D-Tuna® retunes to drop-D and back with strict accuracy at the flick of a finger.

  Other unique features include a black skirted Strat-style single push/push volume control knob (labeled "tone"), custom black pickguard, distressed black hardware, oversized strap buttons and EVH neck plate.
