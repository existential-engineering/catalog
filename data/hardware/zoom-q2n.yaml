description: The Zoom Q2n gives you a fast and easy way to create HD videos with
  high-impact audio. The built-in X/Y microphones capture sound with beautiful
  stereo imaging.
details: |-
  The Zoom Q2n gives musicians a fast and easy way to create HD videos with high-impact audio. The built-in X/Y microphones capture sound with stereo imaging, and the 160 degree wide-angle lens works across lighting conditions, whether filming at home, in a rehearsal space or at a club.

  Video is recorded in MOV format at up to 1080p, with bitrates up to 24 Mbps and frame rates of 1080p/30fps, 1080p/24fps, 720p/30fps and 720p/24fps. Five field of view steps and 10 Scene options cover different lighting environments, with an Auto setting that adjusts automatically to the scene, and an HDMI video output connects the unit to an HDTV, selectable between NTSC and PAL.

  The built-in X/Y stereo microphones handle sound levels up to 120 dB SPL, and the Q2n can also be used as a standalone audio recorder saving WAV files up to 24-bit/96 kHz. An analog-style level control with onscreen metering, a two-color status LED on the lens, an Auto Gain function and a low-cut filter handle the audio side, and a stereo external input with plug-in power takes other devices.

  A USB interface handles live streaming and data transfer, with webcam and USB mic functions (including direct monitoring) for computers and iOS devices, where an Apple Camera Connection Kit or Lightning to USB Camera Adapter is required. The unit is compatible with USTREAM Producer, Flash Live Media Encoder, Skype and other streaming applications.

  Recording goes to micro SD, SDHC and SDXC cards up to 128 GB. Two AA batteries give about two hours of recording at 720p/30fps (about three hours with Ni-MH cells), a ZOOM AD-17 AC adapter is available separately, and there is a built-in standard tripod mount.
specs: |-
  - Recording media: micro SD, SDHC and SDXC cards, class 10 or higher, up to 128 GB
  - Image sensor: 1/3-inch 3-megapixel CMOS sensor
  - Lens: F2.0, 160 degree field of view, fixed focus (36 cm to infinity), focal distance approximately 16.6 mm (35 mm equivalent)
  - Video format: MPEG-4 AVC/H.264 (MOV), bitrates up to 24 Mbps
  - Video resolutions and frame rates: HD 1080p/30fps, HD 1080p/24fps, HD 720p/30fps, HD 720p/24fps
  - Audio formats: WAV at 24-bit/96 kHz, 24-bit/48 kHz and 16-bit/44.1 kHz
  - Audio functions: Lo-Cut filter (off, 80 Hz, 120 Hz or 160 Hz) and Auto Gain
  - Image functions: five FOV steps (x0.75, x0.85, x1.00, x1.30, x1.50). Scene selection Auto, Outdoor, Sunset, Night, Concert Light, Concert Lo-Lit, Concert Hall, Jazz Club, Dance Club, Rehearsal Studio and Garage
  - Power Save and Auto Power Off: off, 1, 3 or 5 minutes
  - Display: 1.77 inch full-color LCD, 160 x 128
  - Mic input: 120 degree X/Y stereo, maximum sound pressure input 120 dB SPL, input gain -inf to +39 dB
  - External input: stereo mini jack, input gain -inf to +39 dB, input impedance 2 kohm or more, supports plug-in power
  - Outputs: combined line/headphones stereo mini jack, and micro Type D HDMI connector
  - Built-in speaker: 400 mW 8 ohm mono speaker
  - USB as mass storage: class USB 2.0 High Speed, supported with iOS devices, USB bus power supported
  - USB as audio interface: class USB 1.0 Full Speed, 44.1 kHz sampling rate, 16-bit, supported with iOS devices
  - USB as webcam: WVGA/720p video size, 48 kHz/16-bit audio
  - Power: 2 AA batteries. ZOOM AD-17 AC adapter sold separately, DC 5 V/1 A
  - Battery operation time: about 2 hours or more recording 720p/30fps video with alkaline batteries, about 3 hours or more with Ni-MH batteries
  - External dimensions (maximum, main unit): 1.8 inch depth x 2.5 inch width x 3.3 inch height, weight 0.2 lb
  - Included accessories: user guide, AA batteries
  - Built-in standard tripod mount
