description: The Booster Shot is a guitar boost pedal from Ashdown's Dr. Green
  range, conceived and designed in the UK. It lets the player add both high-end
  boost and full signal boost, ideal for screaming leads that cut through or for
  driving the front end of an amplifier from clean/light break-up into a raunchy
  overdrive while maintaining the character of the guitar and amplifier being
  used. The pedal features true bypass switching and is housed in a
  custom-designed steel casing built to withstand repeated stage use.
details: |-
