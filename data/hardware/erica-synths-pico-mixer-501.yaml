description: Mix audio and CV signals!
details: |-
  Pico Mixer is a simple 3 channel DC coupled mixer intended to mix audio signals and CV signals in order to obtain complex modulations. Because the signal path is DC coupled, slow control voltages pass through as readily as audio does.

  With a single channel in use it also serves as a CV and audio attenuator, so the module doubles as a level control. Mixer gain is unity and the inputs carry diode protection against overvoltage.

  The module is 3HP wide and 35mm deep and draws only +4mA and -4mA from the bus, which makes it cheap to add to a full case.
specs: |-
  - 3 inputs
  - DC coupled
  - Mixer gain 1
  - Diode protection against overvoltage
  - Power consumption +4mA, -4mA
  - Module width 3HP
  - Module depth 35mm
