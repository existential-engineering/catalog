description: >-
  A compact single-oscillator monophonic analog synthesizer from Octave
  Electronics with a sub-octave generator, producing quick and dirty bass, lead,
  and percussive sounds.
details: |-
  The Kitten is a stripped-down version of Octave Electronics' Cat synthesizer, distilling analog synthesis to its essentials with a single VCO, sub-octave oscillator, and white noise generator. Its simple and intuitive layout makes it immediately accessible for players seeking straightforward monophonic sounds without menu diving or complex programming.

  Despite its modest specification, the Kitten delivers a satisfying range of tones spanning techno blips, synth effects, rumbling bass lines, and analog percussive hits. The VCF and ADSR-equipped VCA provide enough shaping control to coax expressive sounds from the single oscillator, while the LFO offers sine and square waveforms routable to either the VCA or VCF for vibrato and filter modulation effects.

  CV/Gate and audio inputs allow the Kitten to connect with other analog synthesizers for expanded sonic possibilities. The complete absence of MIDI and patch memory keeps it firmly in vintage territory, and surviving units have become somewhat scarce on the secondary market. The Chemical Brothers are among the notable artists who have put the Kitten to use.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO + sub-octave oscillator + white noise generator
  - LFO: 1 (sine and square, modulates VCA or VCF)
  - Filter: 1 VCF
  - Envelope: 1 VCA with ADSR
  - Keyboard: 37 keys
  - Memory: None
  - Control: CV/Gate
releaseDate: "1981"
