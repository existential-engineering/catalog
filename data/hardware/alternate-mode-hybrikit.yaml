details: |-
  Combined with the DITI, the HybriKIT is the next generation of the legendary DrumKAT from Alternate Mode. This MIDI percussion controller allows the user to stack up to 8 notes on the same pad, and create chords and melody lines in one simple step with melodic modes. The operating system is powerful, full featured and intuitive. The DITI offers the most advanced software with the greatest power of expression and programmability for the needs of the professional or casual user. The HybriKIT features true FSR technology. Perfect supplement to your acoustic drum kit! The HybriKIT plugs into a DITI MIDI Controller. All of the programming for the HybriKIT are preset on the DITI. Kits have also been created for the GIGKAT for turn key performance. The HybriKIT/DITI works with ANY MIDI Sound Source. The DITI can also be connected directly into a computer (MAC or PC) simply by using a MIDI to USB Cable. The HybriKIT is thinner than the original DrumKAT Turbo, and weighs only five pounds! The metal chassis contains a built-in bracket for easy mounting. Dimensions are 17 3/8" x 12" x 3"

  The HybriKIT ships with a 15-pin to 1/4" connector cable that plugs into the DITI. Unit dimensions: 5 lbs, 17.5 x 12 x 3

  The HybriKIT REQUIRES a DITI Trigger Interface for power and to communicate by MIDI with your favorite synth or DAW! Total DITI Inputs: 6 (of 12)
