details: |-
  The EVH® 5150® Iconic® Series satisfies the needs of gigging and recording guitarists craving that powerful EVH tube tone, but at a more affordable price. Evolving from the revered EVH 5150III® amplifiers, the Iconic Series delivers the searing sound and growling gain that Eddie Van Halen made famous throughout his groundbreaking career.

  Designed by renowned amp engineer, James Brown, the 5150® Iconic® Series 80W Head is powered by four EL34 power tubes and voiced by a complex, multi-stage hybrid preamp section anchored by a duet of ECC83 tubes providing all the fire power the modern guitarist needs in a simple to use format.

  This head features two channels with an extra voicing on each for even more versatility. The Green channel boasts an overdrive button to run from lush clean tones to increased gain, while the Red channel's burn button adds fiery crunch that's ideal for blistering leads.

  Each channel houses its own gain and volume controls, allowing for level-matching the volume when switching between the clean and high gain channels. The channel two noise gate's quick attack suppresses any hiss while ensuring all staccato riffing is articulate and crisp, not choked and choppy. The Boost control allows you to add another 10Db of foot-switchable volume to your tone - perfect for ensuring your solos cut through the mix. The control panel also includes shared EQ (Low, Mid and High), global resonance and presence knobs to adjust the low- and high-end aspects of your tone, and a global reverb control to add the perfect amount of bounce and decay for any room.

  Other features include a two-button footswitch, effects loop, dual parallel speaker output jacks, ¼ power switch to reduce wattage - allowing you to crank the amp and still preserve tone but without destroying your neighbor's solitude, and a speaker-emulated DI XLR with power amp mute for accurate all-tube EVH tone for recording direct or using through any PA system.

  Sporting sophisticated and distinctive EVH style, the 5150 Iconic Series 80-watt head is wrapped in Black textured vinyl with a brushed gold anodized aluminum front panel and black steel grille featuring gold and black 5150 and EVH logo badges. This head is finished off with vintage-style chicken-head knobs, red LED jewel indicator and molded black plastic top handle.
