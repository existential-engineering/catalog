description: Flagship over-ear noise-cancelling wireless headphones from Bowers
  & Wilkins featuring 40mm carbon dynamic drivers, true 24-bit audio via DSP,
  advanced active noise cancellation, and up to 30 hours of battery life. Built
  with Nappa leather and die-cast aluminium.
details: |-
  The Px8 S2 is Bowers & Wilkins' statement flagship headphone, described by the brand as 'a statement of headphone excellence' with 'every core element reimagined to deliver no-holds-barred performance.' The model promises the company's best sound quality, maximum comfort, and an elevated feature-rich listening experience.

  At the heart of the Px8 S2 are two 40mm dynamic full-range carbon drivers, fed by a true 24-bit audio signal path via DSP. A customisable 5-band EQ sits alongside the TrueSound mode for reference-grade tuning, while support for aptX Lossless, aptX Adaptive, aptX HD, aptX Classic, AAC and SBC over Bluetooth 5.3 covers virtually every modern streaming source.

  Battery endurance reaches 30 hours of playback, and a 15-minute quick charge delivers 7 hours of listening. Active noise cancellation is handled by an eight-microphone array (four per earcup), with call clarity managed by ADI Pure Voice. Multipoint connectivity, Apple MFi support and Google Fast Pair round out the wireless feature set.

  Premium materials define the industrial design: soft Nappa leather wraps the earcups and headband, while solid die-cast aluminium provides the structural arms. The headphone weighs 0.31 kg and ships with a carry case sized 177 × 60 × 234 mm, a 1.2 m USB-C to 3.5 mm audio cable, and a 1.2 m USB-C to USB-C cable.

  Available in Warm Stone, Onyx Black, Midnight Blue, and Pearl Blue, the Px8 S2 has been recognised with the iF Design Award (2026), TechRadar Headphones of the Year (2025), T3 Platinum Award (2025), and Tom's Guide Editor's Choice (2025).
