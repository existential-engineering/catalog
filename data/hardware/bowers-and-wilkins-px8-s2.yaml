details: |-
  Px8 S2 is the current flagship of the Bowers & Wilkins over-ear range, sold as over-ear noise-cancelling headphones and described as a statement of headphone excellence with every core element reimagined. Bowers & Wilkins positions it above the original Px8, saying that compared to that model the Px8 S2 delivers the company's best sound quality ever from a sleeker headphone silhouette.

  The Px8 S2 pairs a 24-bit DSP with custom-designed 40mm Carbon Cone drive units, and the specifications expand that into a high-performance DSP with a dedicated amplifier and DAC, a true 24-bit audio connection, and two 40mm dynamic full-range carbon drivers. The manual repeats the same technical feature list.

  Noise cancellation and call quality come from eight microphones in total, four per earcup, with the ADI Pure Voice algorithm handling voice calls. The manual's Real World Listening section describes Active Noise Cancellation, an Ambient Pass-Through mode that lets in external sound, and enhanced wear sensors in both earpieces that pause playback when either earpiece is lifted from the ear and resume it when replaced.

  Wireless streaming is Bluetooth 5.3 with aptX Lossless, with aptX Adaptive, aptX HD, aptX Classic, AAC and SBC also supported, plus multipoint connectivity, Apple MFi Made For iPhone support and Google Fast Pair. The Bowers & Wilkins Music app handles setup and adjusts Active Noise Cancellation, Ambient Pass-Through and EQ, and there is a new five-band EQ alongside a TrueSound mode for tailoring the tone.

  The battery is a rechargeable lithium ion pack rated at 30 hours of playback, with 7 hours from a 15-minute charge and up to 2 hours for a full charge, and the headphones can be used while charging. There is one physical socket, a USB-C port on the left earpiece, used for charging and for USB audio; analogue sources are reached through the supplied USB-C to 3.5 mm stereo jack cable. The headphone weighs 0.31 kg, ships with a carry case measuring 177mm (w) x 60mm (d) x 234mm (h), and is offered in four finishes.
