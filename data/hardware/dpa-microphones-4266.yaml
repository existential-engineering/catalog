  system.
details: |-
  The 4266 Omnidirectional Microphone combines the legendary sound of the 4066 Omnidirectional Capsule with a lightweight and flexible single earset system. This condenser mic is easy and fast to adjust and it offers clean and transparent sound quality with lots of headroom. The capsule itself is the same type as the 4066.

  Now available with CORE+ & MicroLock(R). CORE+ takes your miniature mic to the next level, neutralizing distortion across the entire dynamic range. MicroLock - A dependable, secure locking microphone connector with limitless flexibility and reassuring reliability.

  Like all the microphones in the range, the 4266 Omnidirectional Headset Microphone offers accurate, natural voice intelligibility and very high SPL capabilities. Users can both speak and sing into the mic with no hint of distortion.

  The headset sits securely around the head and are ideal for active performance situations where the person wearing the headset won't feel the presence of the microphone. It is ergonomically designed to fit comfortably and easily. This mic adjusts to fit any ear size and head shape while at the same time it mounts securely and is hardly visible. By rotating the boom and the ear hook, the microphone can be easily used on either the left or the right ear. The connector splits the cable from the microphone boom allowing you to swap broken cables and/or wireless connectors quickly.

  Three boom lengths are available to accommodate different applications and head sizes: 40 mm (1.6 in), 90 mm (3.5 in) and 110 mm (4.3 in). The 110 mm (4.3 in) is the standard choice for most users.

  This microphone is also available as a one-sided earset.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB: Soft boost grid: 40 Hz - 20 kHz, 3 dB soft boost at 8 - 20 kHz. High boost grid: 40 Hz - 20 kHz, 10 dB boost at 12 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 6 mV/Pa; -44 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 26 dB(A) re. 20 µPa (max. 28 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 38 dB (max. 40 dB)
  - Distortion, THD < 0.5%: 133 dB SPL RMS, 136 dB SPL peak
  - Distortion, THD < 1%: 136 dB SPL RMS, 139 dB SPL peak
  - Dynamic range: Typ. 111 dB
  - Max. SPL, THD 10%: 144 dB SPL peak
  - Rated output impedance: From MicroDot: 30 - 40 Ω. From DAD9001-BC: 100 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001-BC XLR Adapter
  - Output balance principle: Signal balanced with DAD6001-BC XLR Adapter
  - Common mode rejection ratio (CMRR): > 60 dB from 50 Hz to 15 kHz with DAD6001-BC XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD6001-BC: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9001-BC XLR Adapter
  - Connector: MicroLock, TA4F Mini-XLR, 3-pin LEMO, Mini-Jack
  - Weight: Single Ear: 10 g (0.35 oz)
  - Microphone diameter: 5.4 mm (0.21 in)
  - Microphone length: 12.7 mm (0.5 in)
  - Cable length: 1.25 m (4.1 ft)
  - Cable diameter: 1.6 mm (0.06 in)
  - Polarity: Positively increasing sound pressure produces positive-going voltage at MicroLock pin (and pin 2 on DAD9001-BC XLR adapter)
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black, Beige, Brown, White
  - Features: Pristine audio quality; Lightweight and flexible; Easy mounting to the left or right; Minimal visual impact; Resistant to humidity; Flexible adapter system fits most professional wireless systems
