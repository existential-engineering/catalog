id: -hXBHIuCCWIjmV7xtLA0j
name: RNDI-8
manufacturer: rupert-neve-designs
primaryCategory: di-box
categories:
  - outboard
  - rack-mount
url: https://rupertneve.com/products/rndi-8
description: Eight channels of the superb-sounding RNDI in one rack space,
  designed for high-end stage rigs, studios, and synth enthusiasts. Combines
  custom-wound output transformers and Class-A discrete FET input stages to
  deliver clarity and harmonic depth across instrument-level sources.
details: |-
  The RNDI-8 packs eight independent active transformer-coupled DI channels into a single 1U rackmount chassis, bringing the celebrated tone of the single-channel RNDI to stage rigs, studios, and synth setups that need a lot of DI in a small footprint.

  Each channel features a custom-wound output transformer and class-A discrete FET input stage. Front-panel jacks include eight 1/4-inch unbalanced Hi-Z instrument inputs and eight 1/4-inch parallel THRU outputs that pass the input on to an amplifier, speaker, or another DI without coloration.

  Per-channel ground-lift switches, -10 dB pad switches (lowering input impedance to 200 kOhm and extending headroom to +30.5 dBu for hot signals such as keyboards and electronic drums), and phantom power status LEDs sit on the front panel. Rear-panel jacks include eight transformer-coupled balanced XLR outputs with Pin 1 Isolate switches.

  Powered entirely by +48V phantom power (4.5 mA per channel) from downstream preamps or stage boxes — no separate power cable required. Rugged powder-coated steel chassis with reversible rack ears for stage or studio use.
specs: |-
  - Noise: better than -110 dBV (22 Hz - 22 kHz, unweighted)
  - Frequency Response: ±0.25 dB from 28 Hz - 60 kHz; ±1 dB from 14 Hz - 90 kHz
  - THD+N @ 1 kHz, +20 dBu input: 0.25% typical (2nd/3rd harmonic)
  - Maximum Input Level: +20.5 dBu standard; +30.5 dBu with -10 dB pad engaged
  - Maximum Output Level: +11.5 dBu typical
  - Input Impedance: 2.2 MOhm (instrument); 200 kOhm (pad engaged)
  - Output Impedance: <40 Ohm
  - Power: +48 VDC phantom, 4.5 mA per channel
  - Dimensions: 19"W x 6"D x 1.75"H (1RU)
  - Weight: 7 lbs
