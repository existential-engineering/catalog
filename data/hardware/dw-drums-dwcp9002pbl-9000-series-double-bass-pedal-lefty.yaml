details: |-
  The DW 9000 Series Double Bass Drum Pedal (Lefty) is engineered for drummers who demand a smooth, powerful and highly adjustable playing experience. Every major component in the 9000 drivetrain is designed to reduce friction, improve stability and give players greater control over how the pedal responds underfoot.

  At the heart of the 9000 is DW's Floating Rotor design, which adds bearings directly into the cam assembly to help the drivetrain move through the path of least resistance. The EZ Infinite Adjustable Cam lets players continuously adjust the pedal from a linear Turbo-style response to the increased acceleration of an Accelerator-style cam, or anywhere in between.

  The Delta II Ball Bearing Hinge uses dual ball bearings and an interlocking component design to create a precise, low-friction connection between the footboard and heel plate. At the bass drum, the Tri-Pivot Toe Clamp uses three independently moving contact points to adapt to different hoop shapes, thicknesses and bass drum angles.

  In addition, the 9002 auxiliary pedal incorporates our patented Single Post Casting design. This allows you to place the auxiliary bass pedal closer to your hi-hat pedal, letting you move your foot more quickly and easily between them, or even play them simultaneously.

  The DW Two-Way bass drum beaters feature a felt side for warm and focused sound, and a high-impact plastic side recommended for more attack. A DW Deluxe Double Pedal Bag is also included for convenient and protected transport.
specs: |-
  - Infinite cam adjustment for personalized feel
  - Single Post Casting Design (U.S. Patent No. 5396826) for closer position to other pedals
  - Delta II Ball Bearing Hinge (U.S. Patent No. 5431081) for precise, low-friction movement
  - Tri-Pivot Toe Clamp (U.S. Patent No. 8330032) adapts securely to bass drum hoops
  - DW 2-Way Beaters and Pedal bag included
