name: Luminal Booster Ultra
manufacturer: darkglass-electronics
primaryCategory: preamp
categories:
  - di-box
url: https://www.darkglass.com/products/lbu
description: The Luminal Booster Ultra is a clean bass preamp and DI pedal that
  blends the Harmonic Booster with a versatile multiband compressor for a
  pristine, controlled signal. It adds a cab-sim DI output with up to 7 custom
  impulse responses, a 6-band EQ, and a headphone output.
details: |-
  The Luminal Booster Ultra is a clean bass preamp and DI pedal, the next evolution in clean bass tone. It seamlessly blends the lavish tone of the Harmonic Booster with a versatile multiband compressor, delivering a pristine, controlled signal with gain-reduction metering.

  A cab-sim-enabled DI output can load up to 7 custom impulse responses over USB-C, so the balanced XLR feed to a PA or console carries a cabinet-emulated tone. A 6-band EQ (Bass, four mid bands, treble) provides deep tone shaping, with most bands at +/-13dB and mid gain at +/-20dB. Boost range is +/-20dB, master volume +/-12dB, and an adjustable low-pass filter sweeps from 150Hz to 20kHz.

  Connectivity covers a 1/4-inch instrument input, a 3.5mm stereo aux input for backing tracks, a 1/4-inch main output, a balanced XLR direct output, and a 3.5mm headphone output. USB-C handles impulse-response loading and settings.

  The pedal measures 125mm x 96mm x 57mm, weighs 430g, and runs on a 9V DC center-negative supply drawing 400mA.
specs: |-
  - Clean bass preamp / DI pedal
  - Blends the Harmonic Booster with a multiband compressor
  - Cab-sim-enabled DI output with up to 7 custom impulse responses
  - 6-band EQ (Bass, 4 mids, treble; ~+/-13dB, mid gain +/-20dB)
  - Boost range +/-20dB; master volume +/-12dB
  - Adjustable low-pass filter: 150Hz to 20kHz
  - Gain reduction meter
  - 3.5mm aux input and headphone output
  - USB-C for impulse-response loading and settings
  - Dimensions: 125mm W x 96mm L x 57mm H, 430g
  - Power: 9V DC, center-negative, 400mA
