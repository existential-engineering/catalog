description: This reference stereo integrated amplifier is the product of
  expertise developed over decades of research, testing, and critical listening
  for the best possible reproduction of music.
details: |-
  This reference stereo integrated amplifier is the product of expertise developed over decades of research, testing, and critical listening for the best possible reproduction of music.

  PM-10 uses full balanced circuitry architecture with double mono power amp construction, delivering 200 W per channel into 8 ohms and 400 W into 4 ohms with a damping factor of 500.

  The phono stage uses Marantz Musical Premium phono EQ and supports both moving magnet and moving coil cartridges, with nickel-plated CD and phono terminals and gold-plated cinch connectors elsewhere.

  A copper-plated chassis, separate aluminium extrusion heat sinks, a 5 mm aluminium top plate and a double layer bottom plate keep the signal path quiet, while a linear drive power supply feeds the pre-amplifier stage.

  Bi-amp and multichannel operation are supported, along with Power Amp Direct In, a Floating Control Bus for multi-unit systems, and D-Bus remote linking.
specs: |-
  - 2 channels, current feedback topology, full balanced circuitry architecture
  - Double mono power amp construction
  - Power output: 200 W (8 ohm RMS) / 400 W (4 ohm RMS)
  - Frequency response: 5 Hz to 50 kHz
  - THD 0.01%
  - damping factor 500
  - Phono EQ: Marantz Musical Premium
  - phono input MM and MC
  - Input sensitivity MM: 2.6 mV / 47 kohm
  - MC: 280
  - Input sensitivity high level: 400 mV / 20 kohm
  - balanced high level: 800 mV / 40 kohm
  - S/N ratio high level: 111 dB (2 V input / rated output)
  - Input sensitivity Power Amp Direct In: 1.5 V / 20 kohm
  - S/N ratio: 113 dB
  - 7 audio inputs, 2 of them balanced
  - 1 audio output
  - Power Amp Direct In
  - No digital inputs and no network or streaming functions
  - Speaker terminals: Marantz SPKT-100+, 4 terminals
  - bi-amp and multichannel option
  - HDAM version SA3
  - SMPS power supply
  - copper-plated chassis
  - D-Bus and Floating Control Bus (3.5 mm mono jack x 2)
  - Low noise LCD display
  - input buffer amp on all inputs
  - Available colors: Gold, Black
  - metal front panel
  - Power consumption: 270 W
  - standby: 0.3 W
  - detachable power cable
  - Remote control: RC004PMSA
  - Dimensions (W x D x H): 440 x 453 x 168 mm
  - weight: 21.5 kg
