description: The Pro-Mod Plus Dinky DK24 HH 2PT E QM features a sleek Dinky body
  constructed from basswood with a quilt maple top, delivering premium
  performance and modern features for the progressive guitarist.
details: |-
  The Pro-Mod Plus Dinky DK24 HH 2PT E QM pairs a Dinky-shaped basswood body with a quilt maple top in a gloss Chlorine Burst finish, mated to a bolt-on caramelized maple neck with graphite reinforcement, a natural satin back finish, and a Speed Neck profile with rolled fingerboard edges. A sculpted shredder's cut heel and scalloped lower back bout open up unrestricted upper-fret access.

  An ebony fingerboard with a 12" to 16" compound radius hosts 24 jumbo stainless steel frets, 4mm pearloid dot inlays, and Luminlay side dots for low-light visibility, all anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around a versatile HH configuration: a direct-mount Seymour Duncan Full Shred TB-10 at the bridge and a direct-mount Seymour Duncan Alnico Pro II APH-1N at the neck, routed through a 5-position blade switch and a 2-position mini toggle for series/parallel switching. A 500K EVH Bourns Low Friction volume pot and no-load tone control round out the wiring.

  Hardware includes a Wilkinson WVS130-2P tremolo with locking saddles and Wilkinson tremolo arm, Charvel-branded die-cast locking tuning machines in chrome, speed knobs, and a Fender standard string guide. The licensed Fender Stratocaster headstock and heel-mount truss rod adjustment wheel complete the platform. Ships with a Charvel Deluxe Gig Bag.
