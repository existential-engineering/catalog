description: The P8S8 is a Eurorack controller module for the DROID system with
  eight illuminated sliders and eight 3-way toggle switches, usable as a
  modulation sequencer or ADSR controller.
details: |-
  The P8S8 controller is for those who love those little sliders. The sliders behave like regular pots, so we named the module P8S8 (the "S" stands for the switches). The P8S8 has eight Alpha sliders with a range of 20 mm. As a speciality the sliders contain LEDs. Their brightness can be controlled and used for any purpose. As long as you don't use the LED registers, the brightness of the LEDs reflect the current slider positions. At the bottom the P8S8 has eight 3-way toggle switches. As always in the DROID universe, it can be patched as whatever comes to mind, but looking at this module, it's almost imposing to be used as modulation sequencer or ADSR controller. Shipping includes a short ribbon cable for connecting the controller to the master or to the previous controller. If you want to place the controller further away from the master, you can purchaser longer ribbon cables here in the shop. Current Draw: 20 mA +12V | 0 mA -12V | 0 mA 5V

  Width: 8 HP
  Depth: 25 mm

  Link to the P8S8 Controller on ModularGrid
