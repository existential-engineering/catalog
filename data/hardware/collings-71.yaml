description: The 71 is an offset solid body electric guitar built around a solid
  ash body with mortise and tenon set-neck construction and a hard maple
  slab-sawn neck. It features dual Lollar T-style pickups, a Rutters bridge with
  brass saddles, and a 3-way blade wiring scheme with a series/parallel tone
  knob function for enhanced harmonic character. Finished in antiqued
  nitrocellulose lacquer and available in multiple colors, the 71 delivers
  assertive sonic clarity and responsiveness with meticulous Collings
  craftsmanship.
details: |-
  The Collings 71 is an offset solid body electric guitar with a bold, grounded character rooted in thoughtful engineering and meticulous construction. The body is solid ash with a mortise and tenon neck joint. The neck is hard maple, slab-sawn, with a soft V profile (approximately 0.840" at the 1st fret and 0.921" at the 9th fret); a C-shape neck is optionally available. The rosewood fingerboard has 5mm non-tapered pearl dots, a 10" radius, narrow-tall 18% nickel-silver frets, a 25½" scale length, and a 1 11/16" nut width. Overall dimensions are 13¼" width × 17 7/16" length × 1 11/16" depth, with a 40" total length.

  Electronics include Lollar T-style pickups (Throbak or Ellis T-style available as alternatives), 250K pots with Jupiter Vintage Yellow capacitors, Davies Radio knobs, and 3-way blade switching with a series/parallel tone knob function. The Rutters bridge uses brass saddles. Hardware includes Kluson Supreme tuners, an ebony peghead veneer with a MOP Collings logo, and a Collings 6-in-line headstock. Strings are D'Addario EXL110 (.010"-.046"). The guitar ships with a mint multi-ply pickguard (black/cream/black for Butterscotch Blonde) and a deluxe hardshell case. Finish is antiqued nitrocellulose lacquer in colors including Butterscotch Blonde, Fiesta Red, Jet Black, Olympic White, Sonic Blue, and Watson Green. Options include left-handed configuration, hand-poured pickguard/truss rod cover sets, Bakelite pickguard (Butterscotch Blonde only), and an Aged Finish & Hardware Package.
