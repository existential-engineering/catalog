details: |-
  A Custom Shop finish of the Roto Sonic, part of the 20 for 20 series of 20 colorways carrying a 20 for 20 insignia, each run limited to 20 units. This one is finished in a Root Beer Sparkle powder coat with vintage aluminium knobs.

  The Roto Sonic is a three-mode pedal built around rotary speaker effects, with Les' Rotary Speaker, Vibro-S and U-Vibe modes. The Doppler voicings are modelled on vintage rotating speaker cabinet designs and run on Keeley's own DSP, aimed at organ-style swirl with the detail of the original cabinets rather than a generic phaser sweep.

  Rate and Depth set the speed and intensity of the effect, and a Blend control mixes clean tone back in so the signal keeps its place in a mix. The pedal is true bypass, runs on 9 V DC at 70 mA with no battery option, and is designed and made in the USA.
