description: The Pentatone Equalizer — a standalone 5-band EQ pedal derived from
  the Pentatone Preamp, with continuously variable Q on each band and a
  wide-headroom ±9V supply suited to guitars, basses, and keyboards.
details: |-
  The Pentatone Equalizer is a standalone version of the 5-band equalizer section in the Ibanez Pentatone Preamp. Adding a continuously variable Q control on each band, which allows for a wider variety of sound creation, enables even more detailed sound creation. Furthermore, the ±9V power supply circuitry provides a wide headroom.

  The PTEQ suits not only electric guitars but also higher-level output signal equipment such as electric bass guitars and keyboards. A Master LEVEL control adjusts the overall signal from -∞dB to +6dB, and true bypass keeps the signal clean when the pedal is disengaged.
specs: |-
  - Controls: 5-band frequencies, 5-band levels, 5-band Q controls, Master Level
  - True bypass
  - I/O: INPUT, OUTPUT
  - Size: 100(W) x 123(D) x 63(H) mm / 3.9 x 4.8 x 2.5 inches
  - Weight: 690g / 1.5 lb (including battery)
  - Required Current: 125mA@9V
  - Power Supply: One 9V battery (006P) or external AC adapter
  - ±9V power supply circuit for wide headroom
