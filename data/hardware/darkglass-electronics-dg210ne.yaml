description: "Louder, lighter, and powerful. The Darkglass cabinet line offers
  everything the modern musician expects: flexibility, tone, power handling, and
  portability."
details: |-
  The Darkglass 210 Bass Cabinet is a 2x10 passive speaker cabinet built around custom-designed Eminence neodymium speakers rated at 8 Ohm and 500 Watts RMS. Its lightweight Paulownia construction with a Baltic Birch front baffle keeps it portable while handling substantial power. The distinctive Darkglass look is finished in carbon-fiber Tolex. Two Speakon-1/4" combo jacks handle both the input from the amplifier and a link output to a second cabinet.
specs: |-
  - 2x10 cabinet with custom design Eminence Neodymium Speaker
  - 8 Ohm and 500 Watts RMS
  - Paulownia with Baltic Birch Front Baffle
  - Distinctive Darkglass look with carbon-fiber Tolex
  - Two Speakon-1/4" combo input and output jacks
