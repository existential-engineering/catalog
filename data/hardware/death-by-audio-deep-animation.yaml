description: An envelope filter pedal that sweeps its filter in response to
  playing dynamics or an external trigger, with selectable frequency ranges and
  overdrive.
details: |-
  ENVELOPE FILTER WITH SERIOUS ATTITUDE END OF LIFE. WE WILL NO LONGER PRODUCE THIS PEDAL SO GET IT WHILE YOU CAN :( This mangled, filter-sweeping, abruptly overdriving pedal is designed to respond to your playing. It syncs its wave-thumping movement with the force at which you play. It multiplies dynamics into a hyper-exaggerated frenzy. It adds just the right amount of movement to punch through the mix and it reacts to an external trigger of your choosing to follow your tempo. Six selectable frequency ranges mean you're always gonna have just the right quack and oomph for whatever's plugged in! Controls Sensitivity Determines the point at which the filter engages and the frequency range of the filter shift in relation to the input amplitude Intensity Simultaneously blends in the resonance, amount, and grit of the filter Vol Controls the output volume of the effect Up / Down Controls the polarity of the filter decay once triggered. UP sweeps the frequency from higher frequencies to lower ones and DOWN, the opposite Bypass True bypass the effect Jacks Input Plug an instrument in to this jack Trig Plug another instrument in to this jack and use it to trigger the filter sweep Out Connect this to the amplifier Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 18 mA Physical Details Dimensions: 5.92" x 4.72" x 2.34" (including hardware) Weight: 21 oz.
