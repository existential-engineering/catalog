description: The Sinkhole combines a harmonically-rich reverb with a deep
  four-voice chorus featuring feedback control and high-cut filtering. The
  reverb can achieve near-infinite sustain at extreme settings, evoking warm
  synthesizer pads reminiscent of vintage analog-digital hybrids. Includes a
  full wet-dry blend and warm preamp circuit.
details: |-
  The Sinkhole features five controls: FDBCK (dual-function knob adjusting feedback and chorus depth simultaneously), MIX (wet-dry blend), MOD (chorus modulation rate), VERB (reverb decay time, with maximum approaching near-infinite sustain), and VOL (onboard preamp gain, usable as clean boost).

  Bypass mode is selectable via internal switch (accessible by removing the backplate) between True Bypass and Buffered Bypass; ships in buffered mode. Power accepts 9-18V DC center-negative, minimum 100mA. Backed by a 3-year warranty.
