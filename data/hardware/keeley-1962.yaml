details: |-
  The Keeley 1962 is an amp in a box British overdrive, aimed at the tones of the British made black and gold amplifiers: powerful, crunchy and classic. It takes a bluesbreaker-style voicing and wraps a Keeley Katana circuit around both sides of it, giving a heavy, cutting overdrive.

  Layering gain is the method behind the tone. The Katana booster circuit is split in half, and both JFETs are used in the manner of valves in a British amp, so the pedal produces pre-amp and output tube distortion characteristics in sequence. The result is a deep, rich tone with smoothness and sustain.

  The unit is built from precision components, with the surface mount JFET transistors placed and soldered by hand and a very low noise op-amp selected for the circuit. It is not a tube screamer style pedal, and Keeley suggests pairing it with the Red Dirt as a dual overdrive system, using the 1962 for heavy tones and clicking in the Red Dirt for mid-focused saturation.
