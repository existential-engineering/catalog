description: A Eurorack utility module that mixes three signals, sums three
  signals, and inverts two channels of CV or audio.
details: |-
  Meet Mixel: A eurorack modular synth that can mix 3 inputs, sum 3 inputs, and invert 2 channels! A handy addition to any skiff! Combine and buffer 3 signals (CV or audio) in the MIX section with dedicated level knobs (fade from 0 (muted) to 2x boost) and an output signal attenuator. Featuring LEDs which show the polarity of the signal (blue for positive, red for negative, and purple for audio rate). Sum up to 3 signals in the SUM section to make some cool audio or CV signals. Invert any signal using the INVERT section, with two separate invert channels! TECHNICAL SPECS:
  - Module Size: 3U X 6HP X 25 mm Deep. - Current Draw: 15mA@ 12V, 15mA@ -12V. WHAT'S IN THE BOX?
