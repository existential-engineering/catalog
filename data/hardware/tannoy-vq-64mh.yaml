details: |-
  The VQ 64MH is a 2-way dual concentric mid-high large-format loudspeaker for high-performance installation applications. Modular design allows creation of seamless arrays. Incorporates Dual Concentric behind a single horn with PSW (Point Source Waveguide) for coherent single-point source dispersion. Configurable for Single-Amp or Bi-Amp with Lake LM26/44 DSP or Lab Gruppen PLM+/D series. Ideal for large sports arenas and stadia.
specs: |-
  - frequencyResponse: 400 Hz - 23 kHz (-3 dB)
  - frequencyRange: 350 Hz - 27 kHz (-10 dB)
  - dispersion: 60 x 40 degrees (-6 dB)
  - directivityFactorQ: 21.3
  - directivityIndexDI: 13.3 dB
  - maximumSPL: 138 dB averaged, 144 dB peak
  - powerHandlingMF: 200 W continuous, 400 W peak (@ 8 Ω)
  - powerHandlingHF: 90 W continuous, 180 W peak (@ 8 Ω)
  - nominalImpedance: MF: 8 Ω, HF: 8 Ω
  - dimensions: 510 x 694 x 515 mm
  - weight: 45.5 kg
