description: The Bricasti M32 is a flagship monoblock power amplifier delivering
  250W into 8 ohms and 500W into 4 ohms with a fully differential, bipolar
  topology. Designed for balanced integration with Bricasti's differential DAC
  lineup. Handcrafted in Massachusetts, USA.
specs: |-
  - Power output: 250W into 8Ω, 500W into 4Ω, 1000W into 2Ω (current limited)
  - THD+N: <0.005% (20Hz–20kHz, full rated power, 8Ω, 4Ω, and 2Ω)
  - Frequency response: 10Hz–150kHz, ±0.5dB
  - Signal-to-noise ratio: >95dB at full rated power
  - Topology: fully differential, bipolar
  - Balanced input impedance: 200kΩ
  - Unbalanced input impedance: 100kΩ
  - Mains voltage: 100, 120, 220, 230, 240 VAC at 50–60Hz (factory-set)
  - Power consumption: 60W standby, 2W idle
  - Weight: 120 lbs (shipping: 140 lbs)
  - Finish: anodized aluminum
  - Monoblock configuration
  - Handcrafted in Massachusetts, USA
