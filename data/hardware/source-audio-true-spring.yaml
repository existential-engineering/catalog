details: |-
  Turn on the vintage charm of spring reverb and tremolo. The True Spring captures every nuance and idiosyncrasy from the industry's most iconic guitar amps and outboard gear in a single pedal.

  The pedal offers three distinct spring reverb effects (Short Spring, Long Spring, Tank Spring) and three tremolo options (Opto Tremolo, Harmonic Tremolo, Bias Tremolo). It features two operational modes: Standard Mode for basic stomp-box use, and Preset Mode allowing storage of up to 6 user presets including effect selections and knob positions.

  The True Spring supports stereo and mono configurations with multiple routing options (stereo-to-stereo, mono-to-mono, mono-to-stereo), plus an External Loop Mode. Universal Bypass offers a true bypass relay or transparent buffer selection.

  Control and connectivity include USB-MIDI (Mini USB), a control input for expression pedal connection (TRS tip hot, or via Neuro Hub), MIDI PC and CC message support, and MIDI Clock synchronization. Neuro 3 software integration is available for Mac/Windows and iOS/Android.
specs: |-
  - Three spring reverb effects: Short Spring, Long Spring, Tank Spring
  - Three tremolo effects: Opto Tremolo, Harmonic Tremolo, Bias Tremolo
  - Standard Mode and Preset Mode (up to 6 user presets)
  - Stereo and mono routing: stereo-to-stereo, mono-to-mono, mono-to-stereo
  - External Loop Mode
  - Universal Bypass: true bypass relay or transparent buffer
  - USB-MIDI connectivity (Mini USB)
  - MIDI PC and CC message support, MIDI Clock synchronization
  - Neuro 3 software integration (Mac/Windows, iOS/Android)
  - Housing: brushed anodized aluminum
  - Weight: 0.625 lb
  - Dimensions: 4.6 in. x 2.75 in. x 2.2 in.
  - Power consumption: 165 mA
  - 2-year warranty
