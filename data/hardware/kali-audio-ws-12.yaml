details: |-
  Kali's first subwoofer was a 12-inch monster made to go into demanding studio environments and even some smaller live sound applications.

  The maker's Legacy Products page lists it under "WS-12 (Original Version)" with an At a Glance block: first manufactured January 2020, last manufactured March 2023, US price $799 each.

  The same page names its replacement, the WS-12 V2, and describes what that later model adds: a pole cup for mounting top boxes, new crossover options based on user feedback, and substantially reduced noise on the high-passed outputs. Those are statements about the successor, so this original unit is the version without them.

  Kali's 2nd Wave page explains how to tell the generations apart: the third through ninth digits of the serial number give the date of manufacture in MMDDYY format, and all WS-12s made before November 1, 2023 are 1st Wave while all made after that date are 2nd Wave. That page also records that the WS-12 is the one exception to Kali's rule against mixing generations, since components are swappable between the V1 and V2 units.
specs: |-
  - - First manufactured: January 2020
  - - Last manufactured: March 2023
  - - US price: $799 each
  - - 12-inch driver
  - - Generation can be read from the serial number, whose 3rd to 9th digits are the manufacture date in MMDDYY format
  - - Components are swappable between the V1 and V2 WS-12, the only Kali product for which that holds
  - - The maker's Legacy Products page publishes no connector, amplifier or frequency-response figures for this original version
