description: >-
  The Kawai K11 is a General MIDI compatible ROMpler from 1993 featuring 32-voice polyphony, dual
  oscillators, and a 61-key velocity and pressure sensitive keyboard often used as a master
  controller.
details: |-
  Released in 1993, the Kawai K11 is the keyboard version of the Kawai GMega tabletop module, sharing the same hardware and sounds. It is often seen as Kawai's update to the K4, incorporating the General MIDI standard that was established in 1991. The K11 is more simplified than the K4, with fewer effects, sources, and modulation options, but adds dedicated drum processing.

  The K11 features 32-voice polyphony with 32-part multitimbrality, dual oscillators, and seven drum kits. It offers dual high or low pass digital filters with dedicated four-stage amplitude and filter envelopes. The sound engine does well with piano sounds in particular, though it does not match the sonic quality of many competing synthesizers of the era. The excessive reverb applied to drum kits is a notable weakness.

  The 61-key keyboard is pressure sensitive with velocity response and feels sturdy despite being unweighted, making it a popular choice as a master keyboard. The front panel includes a pitch bend wheel, modulation wheel, and increment dial, along with a backlit 16-character, 2-line LCD display. MIDI connectivity is generous with two MIDI INs and two MIDI OUTs, though MIDI Thru is absent.

  The K11 offers Performance mode for live playing and Compose mode for studio work. Memory stores 128 GM, 128 preset, and 128 user programs along with 32 GM, 32 preset, and 32 user multitimbral setups. The rear panel includes a serial interface for direct connection to Macintosh computers.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 32 parts
  - Oscillators: 2
  - Waveforms: Saw, Square, Triangle, Random
  - LFO: 1 with Saw Up, Square, Triangle, Random
  - Filter: Dual high/low pass digital filters
  - Envelopes: 4-stage amp and filter envelopes
  - Effects: Reverb
  - Keyboard: 61 keys (velocity and pressure sensitive)
  - Memory: 128 GM / 128 preset / 128 user programs; 32 GM / 32 preset / 32 user multitimbral; 7 drum kits
  - Control: 2x MIDI In, 2x MIDI Out
