details: |-
  Wearable, waterproof, and ultra-durable Bluetooth media controller. Wearable Bluetooth Control for Active Lifestyles

  The AirTurn MAV is a rugged, Bluetooth-enabled media controller designed for movement. With five tactile buttons and a compact, strap-on design, it offers direct control over your apps—whether you're hiking, biking, paddling, or snowboarding. No need to dig out your phone; just press a button to stay in control. Built to Withstand the Elements

  Waterproof, dustproof, and impact-resistant, the MAV is built to handle outdoor conditions. Its sealed housing and durable construction make it ideal for adventures in any weather—rain, snow, mud, or dust. Direct Button Control in Motion

  The MAV gives you physical control you can count on. Whether you're wearing gloves or in motion, the soft-touch buttons deliver clear tactile feedback for confident presses. Use it to control music, media, or camera functions—wherever your adventure takes you. Lightweight and Low-Profile

  Weighing just a few ounces, the MAV stays out of the way while staying ready for action. Mount it to your wrist, bike, pack, or gear with the included strap for comfortable access without adding bulk.The MAV gives you physical control you can count on. Whether you're wearing gloves or in motion, the soft-touch buttons deliver clear tactile feedback for confident presses. Use it to control music, media, or camera functions—wherever your adventure takes you. Featuring a compact, low-profile design, the AirTurn MAV delivers direct tactile control in a wearable, waterproof housing. With five soft-touch buttons and durable construction, it's built for active use in rugged environments—from rugged trails to open water. Lightweight and comfortable to wear, the MAV is an ideal solution for controlling apps and media while on the move.
specs: |-
  - Control music, media, camera, and apps—without reaching for your phone
  - Navigate playlists, skip tracks, start/stop recording
  - Take photos or video remotely
  - Wearable Design: Straps securely to your arm, wrist, gear, or handlebars for on-the-move access.
  - Rugged Yet Lightweight: Tough polymer casing resists damage while keeping weight to a minimum.
  - Weatherproof Build: Water, dust, and shock resistant.
  - Extended Battery Life: Enjoy up to 200+ hours of playtime on a single charge. The rechargeable battery includes status indicators and automatically powers off when the host device is turned off.
  - Tactile Buttons: Five soft, pressable buttons with LED backlighting for use in any lighting condition.
  - Built-In App Detection: Automatically adjusts controls for popular media apps.
  - Magnetic Charging: Recharge with a snap-on USB magnetic cable—easy even when wet or gloved.
  - Long Battery Life: Lasts for multiple days on a single charge.
  - Bluetooth 5 Wireless: Strong, low-latency connection with over 200 feet of range.
  - Broad App Compatibility: Works with hundreds of apps across iOS and Android.
  - Best-in-Class Warranty: Enjoy peace of mind with a 2-year warranty, which includes coverage for the battery when you register your product.
