description: "SLAM!® combines Class A tube mic preamps with dual limiters: ELOP®
  opto and FET"
details: |-
  Mic Input Impedance: 2000Ω (Lundahl transformer)
  Di Input Impedance: selectable 100kΩ or 10MΩ
  Transformer Coupling: MANLEY IRON® line input and output
specs: |-
  - Frequency Response: 5 Hz – 60 kHz
  - Thd Noise: < 0.05% @ 1 kHz
  - Dynamic Range: 115 dB
  - Max Output: +32 dBm (+30 dBm into 1kΩ load)
  - Output Impedance: 200Ω
  - Mic Preamp Gain: 60 dB max
  - Di Gain: 43 dB max
  - Limiter Gain: 20 dB max
  - Fet Attack: ~100 microseconds
  - Fet Release: 10 ms to 2 seconds
  - Fet Ratio: >20:1
  - Elop Attack: ~10 ms for 6 dB GR
  - Elop Release: 2.5 seconds
  - Elop Ratio: 10:1
  - Tubes: 2 × 12AT7A (input), 2 × 12BH7/6414W (output)
  - Phantom Power: 48V (selectable)
  - Phase Reverse: Yes
  - Power Consumption: 57.6W (0.480A @ 120V; 0.240A @ 240V)
  - Dimensions: 19" × 3.5" × 12" (2U)
  - Shipping Weight: 25 lbs
  - Mains Frequency: 50–60 Hz
