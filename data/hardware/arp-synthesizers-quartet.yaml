description: >-
  The ARP Quartet is a 4-part orchestral synthesizer that is identical to the
  Italian-made Siel Orchestra, rebranded and sold by ARP with four distinct tone
  color families.
details: |-
  The ARP Quartet features four orchestral sections: Brass, Strings, Organ, and Piano. These tone color families can be played individually or with two sections simultaneously. Each section is individually tweakable, with selected presets illuminating LEDs to indicate which sliders and buttons can modify the current section.

  The Brass section generates Trumpet and Trombone sounds with independent attack and sustain controls. The String section produces Cello and Violin sounds, also with independent attack and sustain controls. The Organ section is 2-voice polyphonic and includes a Celeste sound option. The Piano section offers two variations: traditional and Honky Tonk.

  While the synthesizer itself is very limited with no external control, no pitch or modulation wheel, and few edit parameters, it produces excellent analog sounds. The instrument has been employed by notable artists including 808 State and Massive Attack for their signature string textures.
specs: |-
  - Polyphony: 49 notes
  - Oscillators: Brass, Strings, Organ, and Piano
  - LFO: One variable speed LFO with Sine wave shape
  - Filter: Four-pole resonant 24dB lowpass filter
  - VCA: Attack and Sustain for Brass and String sections
  - Keyboard: 49 keys
  - Memory: None
  - Control: None
  - Date Produced: 1979-1980
releaseDate: "1979"
