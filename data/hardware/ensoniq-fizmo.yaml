description: >-
  The Fizmo is a 48-voice synthesizer built around Ensoniq's second-generation Transwave
  technology, producing evolving, organic sounds through wavetable-based timbral
  modulation. With dedicated knobs for every parameter, a built-in arpeggiator, and a
  24-bit effects section including a vocoder, it remains a unique instrument for
  electronic sound design.
details: |-
  The Fizmo uses Transwave synthesis, which relies on wavetables containing layered variations in
  harmonic structure so that timbres evolve naturally from one end to the other. This allows sounds
  to shift over time or respond dynamically to velocity, mod wheel, aftertouch, and other control
  sources, giving the instrument a distinctly animated character.

  Each of the four presets offers two oscillators, for a total of eight simultaneous oscillators,
  each with its own LFO and noise generator. Up to four presets can be stacked into a single sound
  and mapped across the keyboard, enabling highly complex layered patches. The 4 MB wave ROM
  provides 58 waveforms as raw material.

  The resonant lowpass and bandpass four-pole filters shape the sound further, with additional
  non-resonant multi-mode filter configurations available. The 24-bit VLSI effects processor offers
  41 algorithms including reverb, chorus, flanger, delay, distortion, auto-wah, and a vocoder that
  can also process external audio.

  The 118-preset arpeggiator is easily editable and syncable to external MIDI clock, while 26
  real-time control knobs make live sound manipulation straightforward. All knob movements can be
  recorded to an external sequencer via MIDI. A rack-mount version, the Fizmo Rack, was also
  produced with an expanded patch set.
specs: |-
  - Polyphony: 48 voices
  - Oscillators: 4 MB 16-bit wave ROM with Transwaves, 58 waveforms, 2 oscillators per preset (8 total)
  - LFO: 8 LFOs with 7 waveform choices, syncable to arpeggiator or MIDI clock
  - Filter: Resonant LP and BP 4-pole; non-resonant 2LP+2HP, 3LP+1HP, 2LP+2LP configurations
  - Effects: 41 24-bit VLSI algorithms (reverb, chorus, flanger, delay, distortion, vocoder, auto-wah)
  - Keyboard: 61 semi-weighted keys with velocity and channel pressure, 4 programmable zones
  - Memory: 128 ROM sounds, up to 128 RAM, 64 presets
  - Control: MIDI (up to 4 polyphonic channels)
releaseDate: "1998"
