details: |-
  DPK2015 is an out-of-the-box miking solution that takes a minute to install and ensures that the true voice of the piano shines. By bundling components and specifying a workflow, this kit is a turnkey stereo solution for piano miking. The DPK2015 is designed for versatile mounting: inside or outside the piano, lid open or closed.
