description: The Double Cat 12-String is the 12-string configuration of
  Duesenberg's chambered Double Cat, made from solid alder with large sound
  chambers and a flat maple top carrying a Cat Eye styled f-hole, and fitted
  with the maker's Domino P90 and GrandVintage pickup combination.
details: |-
  The Double Cat 12-String is the twelve-string configuration of Duesenberg's chambered Double Cat, listed on the page as the special model DDC-12. The body is solid American alder with large sound chambers routed into it, which Duesenberg describes as a construction that sits tonally between a solid and a semi-hollow body while reducing weight. It takes a laminated maple top with a Cat Eye styled f-hole, cream binding with three-layer purfling, a cream pickguard and a PUR lacquer finish, and measures 47 x 34 cm with sides 4.5 cm high. The maker credits the combination of a chambered alder body, flat top and one-piece maple neck for the model's particular voice. Its stated finish is Vintage Burst.

  The neck is a set one-piece maple neck in a medium D shape, and it is the main point of difference from the six-string: it is wider at 45 mm / 1.77" at the nut and 54 mm / 2.13" at the twelfth fret, and thicker at 22 mm / 0.87" at the first fret and 24.5 mm / 0.96" at the twelfth. The fingerboard is Indian rosewood at a 305 mm / 12 inch radius with cream dot inlays and 22 jumbo frets, over a steel dual-action trussrod, with a 648 mm / 25.5 inch scale length and a black headstock. Every instrument is Plek processed for level, buzz-free frets, then finished by hand and set up by a luthier, who signs the inside of the instrument.

  The pickup set is the same pairing used across the model, a Duesenberg Domino P90 single coil at the neck and a classically wound GrandVintage humbucker at the bridge, with one volume, one tone and a heavy duty three-way selector. The middle position uses a special wiring that filters certain low-end frequencies out of the humbucker signal, which Duesenberg describes as an open and versatile addition to the tonal range. German silver is used for the pickup baseplate and cover, on the grounds that it is the one material that does not affect the frequencies the pickup transmits, and the coil is wound slowly with insulated wire from an old German copper wire factory to imitate hand winding.

  Hardware differs from the six-string in two places. In place of the Diamond Deluxe Tremola vibrato the twelve-string takes an aluminum stop tailpiece, behind the same Duesenberg Steel Saddle Bridge, and its tuners carry knurled buttons. Duesenberg states that both configurations use its Z-Tuners, which are made for a smooth, precise tuning feel and let the cut-off end of each string be hidden inside the tuner shaft. Hardware is nickel finished, strap pins are Duesenberg Standard and Straplock compatible, and the instrument is strung with the Duesenberg Custom 12-String set.

  A Duesenberg Custom Line Bag is included, with high impact internal padding, a black plush lining, external storage pockets, an adjustable neck pillow and shoulder straps that tuck away so the bag can be carried like a case. A Duesenberg Custom Line Case for Double Cat is available separately, and all required allen keys are included.
