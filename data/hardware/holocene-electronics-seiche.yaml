details: |-
  What is Seiche?(pronounced say-sh)

  Seiche is a 16HP "Complex Filter" combining traditional analog filtering with nonlinear wave shaping. Each of the two channels offers:

  QUICKGUIDE :)
specs: |-
  - OTA Based 2-pole State Variable Filter (Switchable between Lowpass, Bandpass, Highpass)
  - Integrated Wavefolder
  - Normalization for FM or AM between channels switchable using a toggle switch.
  - Ping input for natural ringing percussive tones. Think of it as a dual voice core, filter sculptor, waveshaping distortion module, and character rich Lowpass gate all in one.
