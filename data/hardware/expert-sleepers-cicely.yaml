description: Cicely is an octave fuzz effect for the modular environment,
  inspired by the Octavia guitar pedal, with the effect placed under CV control
  and an envelope follower included as a bonus.
details: |-
  Cicely is an octave fuzz effect, inspired by the Octavia guitar pedal created by Roger Mayer and most notably used by Jimi Hendrix. Cicely adapts the concept for the modular environment, adds some extra features, and puts the effect under CV control.

  The effect is essentially one of adding an octave on top of the input note, though this only really applies to pure input tones. For more complex tones the sound is changed in all sorts of other ways.

  That octave is combined with the possibility of overdriving the sound for even more edge, while the unique Centre control adds asymmetrical clipping.

  As a bonus feature, Cicely also includes an envelope follower. The module is 100% analogue.
specs: |-
  - 100% analogue signal path
  - Octave fuzz effect under CV control
  - Centre control adds asymmetrical clipping
  - Overdrive stage
  - Envelope follower included
