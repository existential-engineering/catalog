details: |-
  The Chandler Limited LTD-1 is a hand wired and handmade 10-series equalizer and pre amp using parts and build techniques from the original manufacture of the modules. Grounding, wiring techniques, original transformers, transistors, and inductors have been used to attribute to the special sound in each LTD-1.

  In addition to the classic 10-series sound, modern functions were added and the EQ section was expanded giving a much larger palette to choose from. Features include high impedance direct in, 48v phantom power switching, output fader, EQ in/out switching, phase reverse, balanced mic in, balanced line in, overbuilt power supply to ensure maximum headroom, and nine additional EQ points beyond the original 10-series design.

  The unit is a mono, discrete transistor solid-state design. Gain on the mic input ranges from -20 to +80 dB in 5 dB steps, while the line input provides +10 to -20 dB in 5 dB steps. A switched output control operates in 5 dB steps, and a switchable hi-pass filter covers Off, 50, 80, 160, and 300 Hz positions at 18 dB per octave. Output impedance is switchable between 200 and 600 ohms, and the unit supports stereo linking via a standard 1/4-inch jack.

  All LTD-1 units require and function on the PSU-1, a Chandler Limited external power supply sold separately, which has an internal switch for setting voltage to 120V or 220V. Early LTD-1 units used a Neutrik-style input receptacle for the DI connection; current models feature a standard 1/4-inch input jack with no effect on sound. The product was discontinued as of January 2019.
