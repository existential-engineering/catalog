details: |-
  Featured worldwide in popular music of all styles, the ukulele has experienced a phenomenal resurgence in recent years. At the request of Gretsch fans, Gretsch reintroduced a selection of classic uke best sellers offering unparalleled tone and quality at sensational low prices.

  The G9100 Soprano features mahogany construction (top, back, sides and neck) with a 13.5" scale, ovangkol fingerboard (16 frets, 12 to body), bone nut and saddle, open-back geared tuners, and Aquila Nylgut strings. The open-pore semi-gloss finish provides an organic look and vibe. Includes a fitted gig bag.
