description: "The 1234AC is a smart main studio monitor for use in demanding
  film and post production work, where perf screen or hi-res LED displays are
  employed."
details: |-
  The 1234AC is a smart main studio monitor engineered for demanding film and post-production environments where perforated screens or high-resolution LED displays are employed. Designed for mixing stages and large control rooms, the monitor's directivity and SPL capability align with typical commercial cinema screen channels while delivering superior professional monitoring performance.

  The directivity design and precise on/off-axis imaging enable accurate mixing decisions even outside the narrow sweet spot characteristic of conventional studio monitors. The unit supports both horizontal and vertical orientation, allowing the low-frequency directivity to be tailored to specific room conditions and placement scenarios.

  Integration with GLM calibration software enables comprehensive room optimization, compensating for detrimental acoustic influences, perforated screen effects, and delay characteristics. The 1234AC integrates seamlessly within complete monitoring systems, combining with other Genelec smart monitors and subwoofers to deliver truly optimized reference monitoring with material that translates reliably across environments.

  The amplifier section delivers a total of 2500 W of Class D power, with 2 x 750 W driving the dual 12-inch bass cones, 400 W for the 5-inch midrange, and 250 W for the 1-inch metal dome tweeter. Key Genelec technologies including the Directivity Control Waveguide (DCW), Intelligent Signal Sensing (ISS) for power efficiency, active crossovers, and driver protection circuitry are all integrated into the package.

  The 1234AC ships as a system bundle including the monitor, an individually calibrated RAM-XL amplifier unit, mains cable, RJ45 control cables, and 4-pole Speakon cables. The product is covered by a 2-year standard warranty extendable to 5 years upon registration with MyGenelec.
specs: |-
  - Short Term Max SPL: 125 dB
  - Peak SPL: 130 dB
  - Long Term Max SPL: 120 dB
  - Frequency Response: 34 Hz - 20 kHz (±2 dB); -6 dB: 29 Hz - 21 kHz
  - Frequency Response Accuracy: ±2 dB (34 Hz - 20 kHz)
  - Self Generated Noise: ≤0 dB SPL (A-weighted at 2m on-axis)
  - Harmonic Distortion: 50-200 Hz: ≤3%; >200 Hz: ≤0.5%
  - Group Delay: 5.2 ms (Extended Phase Linearity OFF)
  - Height: 489 mm
  - Width: 1210 mm
  - Depth: 412 mm
  - Weight: 79.5 kg (175.3 lb)
  - Enclosure Material: MDF
  - Enclosure Type: Reflex port
  - Bass Drivers: 2 × 305 mm (12") cone
  - Midrange Driver: 125 mm (5") cone
  - Treble Driver: 25 mm (1") metal dome
  - Bass Amplifier Power: 2 × 750 W Class D
  - Midrange Amplifier Power: 400 W Class D
  - Treble Amplifier Power: 250 W Class D
  - Total Amplifier Power: 2500 W (full output)
  - Mains Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption (ISS): ≤6 W
  - Power Consumption (Idle): ≤40 W
  - Bass/Mid Crossover: 420 Hz
  - Mid/Treble Crossover: 3168 Hz
  - Analog Input: 1 × XLR female, balanced, 10 kOhm
  - Digital Input AES: 1 × XLR female, 110 Ohm
  - Digital Output AES: 1 × XLR male, 110 Ohm
  - Control Network: 2 × RJ45 (CAT5) GLM connectors
  - Technologies: SAM, DCW, ISS, Active Crossovers, Active Amplification, Driver Protection Circuitry
  - Warranty: 2-year standard + 3-year extended (upon MyGenelec registration)
