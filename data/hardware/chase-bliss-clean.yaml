description: Clean, the Creative Compressor by Chase Bliss, developed slowly and through a variety of experiments, Clean explores the wild side of compression and brings the interactivity of distortion circuits to a clean signal.
details: |-
  Clean began its life as a question: can clean be as fun as dirty? Developed slowly and through a variety of experiments, it brings the joyful, exploratory energy of distortion circuits to compression, rewarding playing dynamics and creating a more interactive, lively version of your instrument that moves and shifts as you play.

  Clean is a studio-grade compressor you can turn on its head and push beyond the expected. It was built to bring the touch sensitivity of an overdrive and the unwieldy response of a fuzz to a clean performer, offering tube-like sag, a dynamic EQ that responds to your playing, physical modeling for organic instability, and two softer swell modes.

  As an instrument enhancer, Clean creates a more lively and interactive version of your instrument while keeping its core character intact. As a parallel-punch compressor, the Dry blend and sidechain input make it bass- and drum-friendly, syncing in time or adding bite with Dusty mode. As an end-of-chain glue, true stereo I/O gives independent response on each channel for a polished, animated stereo mix in mixing or live performance.

  Each stereo channel houses both a compressor and a limiter for two stages of natural, musical compression. Adaptive attack and release adjust to your playing, a sidechain input syncs with external instruments, emphasis filters give cassette-style noise reduction, and a noise gate removes hum and unwanted noise.

  Clean is extremely flexible via dip switches: the limiter can become an overdrive, the compression can become modulation, or the input can gate between notes, all customizable at once. It supports MIDI (Program Change, CC), CV control, and Expression control, with 2 internal presets plus 122 via MIDI, and internal modulation (ramping) of any or all knobs.
specs: |-
  - 100% analog signal path
  - True stereo I/O
  - Two stages of compression per channel (compressor + limiter)
  - Adaptive attack and release
  - Sidechain input for external syncing
  - Dusty mode for bite and grit
  - Emphasis filters for cassette-style noise reduction
  - Noise gate for removing hum
  - Dynamic EQ responsive to playing dynamics
  - Physical modeling for organic instability
  - Two swell modes (Dynamic Swell and Manual)
  - MISO dip switch (mono in to stereo out)
  - SPREAD dip switch (stereo image widening)
  - 2 internal presets, 122 via MIDI
  - Internal modulation (ramping)
  - MIDI control (Program Change, CC)
  - CV control (0-5V)
  - Expression control input
  - Momentary or latching bypass
  - True bypass
  - 9V DC center negative power, ~300mA
