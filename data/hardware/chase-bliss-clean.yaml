description: Clean is Chase Bliss Audio's Creative Compressor, an all-analog,
  true-stereo pedal built to bring the interactive, exploratory energy of
  distortion circuits to compression. It uses two stages of 100% analog
  compression along with physical modeling, a dynamic EQ, and emphasis
  filtering.
details: |-
  Clean started as a question: can clean be as fun as dirty? Distortion circuits are always bursting with character and interesting details that react to the way you play, so Chase Bliss set out to find whether that same touch-sensitive, exploratory energy could exist in a compressor. The result is a "creative compressor" where playing dynamics are rewarded, creating a more interactive and lively version of the input instrument that moves and shifts as you play, with everything from tube-like sag to drifting equalization to softening swells.

  Clean is an original, VCA-based circuit that is not modeled on any existing compressor. It runs an all-analog signal path with two-stage compression, true stereo processing, physical modeling that adds the organic fluctuations of a wobbling spring, feedforward blending, an adaptive envelope follower, a dynamic EQ, cassette-style emphasis filtering for noise reduction, a noise gate, external sidechain input, and a dry blend control.

  The pedal is designed to work in three broad roles: as an always-on instrument enhancer that keeps the core character of the input while adding life and interactivity, as a parallel-punch compressor for drums and bass with sidechain pumping and a "Dusty" overdrive mode built from an intentionally overdriven limiter, and as an end-of-chain glue compressor for polishing and animating a full mix in true stereo.

  Sixteen dip switches (two banks of eight, labeled CONTROL and CUSTOMIZE) unlock deeper behaviors: MISO turns a mono input into a stereo output, SPREAD engages independent stereo motion for the EQ, compressor, and swells, LATCH changes the footswitches from momentary to latching, SIDECHAIN routes the compressor's detection to the external sidechain jack, NOISE GATE mutes the input when not playing, MOTION modulates the amount of compression being applied, SWELL AUX changes the AUX footswitch to a manual swell trigger, and DUSTY transforms the limiter into a crumbly overdrive. A separate CONTROL bank of switches assigns any combination of knobs to ramping (a one-time movement on power-up) or bouncing (continuous modulation), and the same knobs can also be driven externally over CV or expression.
specs: |-
  - 100% analog, VCA-based, true stereo signal path
  - Two stages of analog compression per channel (compressor and limiter)
  - Physical modeling for tube-like sag and organic instability
  - Dynamic EQ that responds to playing dynamics
  - Cassette-style emphasis/de-emphasis noise reduction filtering
  - Adaptive envelope follower (attack/release adapts to playing dynamics)
  - Feedforward blending and adjustable dry blend
  - External sidechain input for syncing compression to another audio source
  - Noise gate to remove hum introduced by compression
  - "Dusty" mode turns the limiter into a distinct crumbly overdrive
  - Two swell modes: Dynamic Swell and Manual Swell, with adjustable swell in/out speed
  - Internal modulation (ramping and bouncing) of any combination of knobs
  - 16 dip switches (2 banks of 8) for customization and control routing
  - 2 internal presets, 122 more via MIDI
  - MIDI (Program Change, Control Change) via Chase Bliss MIDIbox and the EXP/CV jack
  - CV and expression control (CV range 0-5V)
  - Momentary or latching bypass and AUX footswitches
  - True bypass
  - Mono or stereo in/out, with MISO for mono-in-stereo-out operation
  - Power: 9V DC center negative, ~300mA
