description: A studio-grade creative compressor with two stages of compression,
  100% analog signal path, and true stereo I/O that goes beyond compression into
  tube-like sag, dynamic EQ, physical modeling, and swell modes.
details: |-
  Clean is a creative compressor from Chase Bliss that began with the question: can clean be as fun as dirty? It brings the exploratory energy of distortion to the clean performer, offering a studio-grade compressor that you can turn on its head and shape with your playing.

  At its core, Clean features two stages of compression per channel — a compressor and a limiter — with a 100% analog signal path and true stereo I/O. It goes beyond traditional compression into tube-like sag, with adaptive attack and release that adjust to your playing dynamics.

  The pedal includes a dynamic EQ that responds to your playing, emphasis filters for cassette-style noise reduction, and physical modeling to introduce organic instability. Two swell modes allow exploration of softer, more ambient textures.

  Clean excels in multiple roles: as an instrument enhancer that creates a more lively and interactive version of your instrument while keeping its core character intact, as a parallel punch compressor with dry blend for bass and drum-friendly compression, and as an end-of-chain glue using true stereo I/O for mixing and live performance.

  The pedal offers deep control with 2 internal presets and 122 via MIDI, internal modulation (ramping), CV control support, expression input, and independently modulatable knobs. It features momentary or latching bypass modes and a noise gate for removing unwanted hum.
specs: |-
  - 100% analog signal path
  - True stereo I/O
  - Two stages of compression per channel (compressor + limiter)
  - Adaptive attack and release
  - Sidechain input for external syncing
  - Emphasis filters for cassette-style noise reduction
  - Noise gate
  - Dynamic EQ responsive to playing dynamics
  - Physical modeling for organic instability
  - Two swell modes
  - 2 internal presets, 122 via MIDI
  - Internal modulation (ramping)
  - MIDI control (Program Change, CC)
  - CV control support
  - Expression control input
  - Momentary or latching bypass modes
  - True bypass
  - 9V DC center negative power
  - ~300mA current draw
