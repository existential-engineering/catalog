description: Ultra-Compact 12in / 8out Digital Mixer. CQ-12T is the smallest
  mixer in the CQ range and is ideal for home recording and streaming, band
  rehearsals, small gigs, and speech applications.
details: |-
  CQ takes Allen & Heath's renowned processing and effects, adds assistive mixing tools, and packages it all up into the smallest and most affordable digital mixer series in the range.

  Every input channel on CQ can be switched between two modes. Quick Channels offer instrument and application specific processing with the ability to dial in a full channel of processing via a single knob. Switch to Complete Channels for advanced, in-depth tweaking of parameters.

  CQ's Gain Assistant quickly and accurately sets the optimal gain level for one or multiple input channels and continues to monitor levels during the performance to prevent peaks or surprises.

  CQ's Feedback Assistant automatically detects and eliminates problem frequencies using up to 16 filters per output.

  Pristine 96kHz audio is partnered with studio-grade onboard processing and an optimised suite of FX. CQ introduces a new suite of high-quality, user-friendly reverb, delay and modulation algorithms with instrument-specific presets. Selected units feature FX Assist, automatically shaping effects and dynamically responding to the input signal.

  4 DCAs (each controlling level of any combination of inputs, outputs, and FX) and 4 Mute Groups make handling multiple channels simultaneously simple.

  CQ-12T gives all the tactile control needed via a 7" touchscreen with associated rotary control, plus 3 Custom SoftKeys for commonly used functions. Connect a router or access point and the free CQ MixPad app gives full control of the mix from anywhere in the venue.

  Connectivity includes 10 mic/line inputs split across 5 XLRs and 5 XLR/TRS combi sockets, plus a stereo input via a pair of 1/4" jacks. Outputs include a pair of main mix outputs on XLR plus 6 TRS jack outputs for monitor mixes.

  Integrated Automatic Mic Mixer (AMM) instantly reduces background noise and improves clarity for speech applications. AMM is available on all input channels, making it perfect for conferences, podcasts, debates and small-scale theatre productions.
