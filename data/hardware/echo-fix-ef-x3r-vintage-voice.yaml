description: A rackmounted analog tape echo built on the EF-X3R platform,
  featuring wow and flutter controls, an analog spring reverb, analog BBD
  chorus, and live tape looping via Record/Erase Off controls.
details: |-
  PRE-SALE LIMITED NUMBERS (Introductory PRE-SALE Price) - Ships 8 weeks from purchase date. USA CUSTOMERS - Echo Fix covers the Tariff and custom charges via our express courier. This checkout price is an all inclusive price for USA customers. Introducing the Echo Fix EF-X3R Vintage Voice. Built on the EF-X3R platform, the Vintage Voice delivers the warmth and character of classic tape echo machines with hands-on control over every imperfection. Controls to introduce Wow and Flutter via sample-and-hold modulation bring organic movement to your repeats, and allows for true automatic tape chorus and flanging effects. An analog spring reverb section adds genuine vintage depth and space. An extended motor speed range allows for slower delay times and introduces the lo-fi textures of aging tape. The Record/Erase Off controls unlock a live tape looping mode - disable the Erase head to hold your loop, then switch off the Record head and layer your performance on top. For players who want the real thing, and then some. All this functionality is housed in a steel 3RU sliding rackmount drawer. Key EF-X3R Vintage Voice Features

  100% Analog
  Now with an Analog BBD Chorus & Analog Spring Reverb, the EF-X3R boasts a 100% analog signal path. Individual Playback Head Outputs for stereo effect from mono source
  Individual outputs for each playback head offer flexibility never seen before in a tape echo, with the ability to achieve a classic Stereo Ping-Pong delay effect from a mono source by panning each playback head externally via a mixer or DAW. Unmatched Reliability
  On top of this, we've implemented a new auto tape stop circuit to extend tape life. Same Team, Same Peace of Mind
  For over 15 years, we've been keeping tape echos alive. Now that we make our own, our standards are higher than ever. Rest assured that your machine will be the most capable, reliable tape echo on the market, supported by a team with some of the best customer service in the industry. It's Alive
  If you've been in a room with one of our units, you'll know what we mean by this. Used as an effect, they simply make everything sound better. But turn up the echo volume, dial in some feedback and watch as our unit self-oscillates into life and becomes an instrument more than an effect. The EF-X3R will change the way you make music. EF-X3VV Features

  Head Mode Settings

  Mode 1 - Head 1

  Mode 2 - Head 2

  Mode 3 - Head 3

  Mode 4 - Head 1 + 2

  Mode 5 - Head 2 + 3

  Mode 6 - Head 1 + 3

  Mode 7 - Head 1 + 2 + 3

  Sound On Sound is another head that can be switched on over the top of all the head mode settings or you can use the SOS head independently. Tape Speed - 3 IPS to 15 IPS

  Delay Time - 56ms to 1755ms

  Weight: 12Kgs

  Please Note: These items are shipped from Australia and Import duties / fees are the responsibility of the buyer. Make sure that you are familiar with your country's customs, taxes and importing laws.
specs: |-
  - Vintage-Voiced Echo Repeats capturing the warmth and character of classic tape echos utilizing new tape heads and different voicing compared to the standard EF-X3R.
  - Wow & Flutter Controls using sample-and-hold random modulation, breathing life and unpredictability into your signal for that authentic, living-tape feel. The new LFO Mod adds RATE and DEPTH controls to control the speed and intensity of the modulation. The SHAPE knob blends seamlessly between a SINE waveform and a SAMPLE AND HOLD waveform. This allows you to dial in the exact amount of entropy to your echo repeats.
  - Real Tape Based Chorus Effects can be achieved by using the LFO modulation at fast motor speed settings.
  - New Analog Spring Reverb section voiced after beloved vintage units, adding lush, organic depth that only real springs can deliver. Dial it up and you're deep in dub territory.
  - Extended Motor Speed Range for longer delay times and gloriously lo-fi repeats.
  - Record/Erase Off Controls unlock a live tape looping mode. Disable the Erase head to hold your recorded loop, then switch off the Record head and layer your performance on top.
  - Fast Head Mode Switching improved for creative rhythmic switching of head modes.
  - LFO Output via ring of CV motor control jack.
  - New Spec Vintage Voiced Tape Heads
  - Available in Vintage Voice Blue or Gold Front Panel
  - Direct playback head outputs allowing for external panning for stereo ping pong delays from a mono source
  - Analog BBD Chorus with rate and depth controls
  - Analog Spring Reverb
  - Independent SOS switching for longer delay time (1.75 seconds)
  - Direct WET output at rear for Reverb/Chorus
  - Balanced Input and Output at rear
  - Auto tape stop when no audio signal present to extend tape and motor life (There is a switch at the rear to disable this feature).
  - CV Control for Motor Speed and Feedback level (0-5v) via compatible Expression Pedals and Synthesizers
  - Bass and Treble Controls (Echo Signal)
  - Vintage Guitar/Line FET Preamp (Front Panel)
  - High/Low Output level switch (Front Panel Output)
  - Four echo playback heads (including SOS head)
  - Motor ON/OFF Switch for tape slow down effect
  - Mute the reverb, echo and chorus signal via remote foot switches
  - Comes with a worldwide-compatible, 100 - 240v power supply (no step-down or other transformers required)
  - 2 Years Warranty for all purchases with peace of mind that this is made by a company that has been operating for over 15 years specialising in tape echo repair and spare parts
  - Durable 3RU Sliding Rackmount Drawer
  - High quality scratch resistant front panel
  - 2 Tape loops supplied with each unit
