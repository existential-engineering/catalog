description: Joe Duplantier is a founding member, songwriter, and producer of
  French heavy metal icons Gojira. The LTD Signature Series JD-I is his first
  Signature guitar from ESP. A uniquely modified take on the offset XJ shape,
  the JD-I is built with bolt-on construction at 25.5" scale. It makes use of a
  mahogany body joined to a thin U-shaped three-piece roasted maple neck with
  Macassar ebony fingerboard, pearloid block inlays, and 22 extra-jumbo
  stainless steel frets. Components on the JD-I include black hardware, LTD
  locking tuners, a Hipshot Tone-a-Matic bridge and tailpiece, a Graphtech TUSQ
  nut, and Joe's signature DiMarzio JD Fortitude passive humbucking pickup.
  Includes deluxe ESP hardshell case.
