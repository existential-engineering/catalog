details: |-
  The third Urei mixer in the 1601 series from Soundcraft, the 1601E, boasts all the same pro features as the 1601 but also includes a comprehensive built-in digital effects section with serious sonic capabilities. With a powerful bpm analysis engine the 1601E automatically synchronizes the effects to the source music so it is simply a case of choosing your effect and flicking a fader to get professional results. There are manual parameter controls as well for more complicated effect adjustment and of course the Urei/ Soundcraft professional sound quality is second to none!
