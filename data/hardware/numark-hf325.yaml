description: HF325 On-Ear DJ Headphones from Numark — a compact, noise-isolating
  closed-back design with a 40 mm driver and rotating earcup for single-ear
  cueing.
details: |-
  Hard working DJs require headphones for airtight performances. A quality set of headphones can be the difference between a good show and a great one. The HF325 packs an incredible amount of sound quality into a compact, noise isolating design that won't hog all of the space in your gig bag.

  Starting with recording studio grade sound quality, the HF325 reveals the critical detail in your mix. The on-ear, noise isolating earcups reduce ambient noise to a minimum, making them ideal for use in loud club environments. The immediate, up-front sound signature is like a microscope for your ears. Vocals are intimate, bass is tight and punchy, and the subtle nuances in tracks are exposed with smooth, rich detail.

  The rotating earcup makes single-ear monitoring a cinch. No more pinching a stiff set of cans between your shoulder and cheek just to get a peek at the main mix and cue mix. The HF325 keeps your hands on the mix, not the headphones. A big upgrade from bundled and all-purpose headphones, it provides the features you need to perform at your best.
specs: |-
  - Studio-grade acoustics with stunning detail for DJ use
  - On-ear cups provide exceptional noise isolation and portability
  - Exceptional handling power for use with pro-grade mixers and controllers
  - Rotating earcup provides hands-free, single-ear monitoring
  - 40 mm driver delivers deep, defined bass for beatmatching
  - 20 Hz – 20 kHz frequency response
  - Immediate, up-front sound signature
  - Aggressive isolation for use in noisy environments
  - Leatherette earcups for a cushy, custom fit
  - 32 ohm impedance works well with low-output devices
  - 4 ft (1.2 m) cable with 1/8-inch (3.5 mm) stereo plug
  - 1/8-inch to 1/4-inch (6.3 mm) adapter included
  - Includes: HF325 headphones, 4-foot cable, 1/8-inch to 1/4-inch adapter
