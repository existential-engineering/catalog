description: Marc Okubo's signature model, known as "Bae", takes his favourite
  features of the DC series into a contemporary instrument. A standard raw tone
  coat with solid colours such as hot pink, jet black and Kiesel Racing Green
  gives the guitar its look.
specs: |-
  - Construction: neck-through
  - Body: swamp ash
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in or 1.90 in at nut depending on configuration
  - Fingerboard: ebony with 14 in radius
  - Frets: 24 stainless steel jumbo, .110 in wide x .055 in tall
  - Scale length: 25.5 in
  - Headstock: reverse pointed inline with swamp ash overlay, painted to match body
  - Bridge: Hipshot/Kiesel tremolo, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: direct-mount Kiesel Polarity active humbucker, with neck pickup delete
  - Electronics: master volume control with push/pull voicing; active electronics run on an internal battery rather than an external power jack
  - Output jack: available flush mount or rear access
  - Inlays: no top inlays, black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Finish: standard raw tone coat, offered in solid colours including hot pink, jet black and Kiesel Racing Green
  - Body dimensions: 39.5 in or 40.15 in long, 1.68 in thick, 12.75 in wide
  - Weight: 7 lbs to 7.25 lbs
  - Strings: Elixir Nanoweb 1046E
  - Truss rod cover: Marc Okubo signature
