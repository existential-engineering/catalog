description: >-
  The Roland S-770 is a professional 16-bit digital sampler released in 1989 as the flagship of
  Roland's S-7XX sampling line. It features 24-voice polyphony, 20-bit internal processing, and
  sampling rates up to 48 kHz, delivering an exceptionally warm and present sound character. The
  S-770 distinguished itself from the entry-level S-750 with an internal 40 MB SCSI drive and
  S/PDIF digital outputs.
details: |-
  The S-7XX series represented Roland's premium sampling platform in the early 1990s. The S-770 shipped with 2 MB of sample memory expandable to 18 MB, a floppy disk drive, an external SCSI bus, a large built-in text and graphics LCD display, stereo inputs and outputs, six assignable analog outputs, and connections for a mouse and external video monitor for enhanced control.

  Audio quality was exceptional for its era. The ADC converters combined with 20-bit internal processing gave the S-770 an incredibly warm, smooth, and present sound character not found in many mainstream samplers. The resonant digital filter is multimode with low-pass, high-pass, and band-pass modes, using the same algorithm as the Roland D-series and JD-series synthesizers.

  The S-770 offered extensive sample looping, cutting, pasting, and editing capabilities along with non-real-time effects including pitch shift and time stretch. A patch could contain up to 8 layered or split samples with 16-part multitimbrality, making it a highly versatile studio tool. The operating system required study but proved very powerful once mastered.
specs: |-
  - Bit Depth: 16-bit
  - Sample Rate: 22 kHz to 48 kHz
  - Internal Processing: 20-bit
  - Polyphony: 24 voices
  - Multitimbrality: 16 parts
  - Sample Memory: 2 MB (expandable to 18 MB)
  - Storage: Internal 40 MB SCSI drive, external floppy drive
  - Filter: Resonant multimode TVF (low-pass, high-pass, band-pass) with 5-segment envelope
  - Amplifier: TVA with 5-segment envelope
  - LFO: 1 LFO with multiple waveforms
  - Outputs: Stereo main output, 6 assignable analog outputs, S/PDIF digital output
  - Inputs: Stereo sampler inputs
  - Control: MIDI, external CGA/composite video monitor, mouse, optional RC-100 remote
  - Display: Built-in text/graphics LCD
  - Patches: 128 patches, 64 multi patches
