description: Charvel's flagship USA Select Series taps straight into
  original-era Charvel DNA for sleek, ferocious models with 'old-school
  throwback' specs our high-performance players have been clamoring for, such as
  '80s-style body perimeters, finely shaped neck profiles, fast compound radius
  fingerboards with rolled edges, non-recessed Floyd Rose bridges, and more.
details: |-
  The USA Select San Dimas Style 2 HH FR pairs an alder San Dimas Style 2 body with '80s-style body perimeters and a Pitch Black satin lacquer finish. The bolt-on quartersawn maple neck features a hand-rubbed satin urethane finish and a Speed Neck profile with rolled fingerboard edges. A maple fingerboard with black dot inlays sits on a 12"-16" compound radius and hosts 22 jumbo frets, anchored by a Floyd Rose Original locking nut (1.6875" width) on a 25.5" scale length.

  Electronics center on a DiMarzio Super Distortion DP100 humbucker at the bridge and a DiMarzio PAF Pro DP151 humbucker at the neck (both black), wired to a 5-position blade pickup switch with a single master volume control. Switch positions cover bridge full humbucker, bridge inner coil, both inner coils, neck outer coil, and neck full humbucker.

  Hardware includes a non-recessed Floyd Rose Original double-locking 2-point tremolo with a 37mm block and Floyd Rose Original tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, dome-style control knobs, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock and one-way vintage-style bullet truss rod (adjustment at the nut) round out the build. Ships with a Charvel hardshell case (p/n 009-0915-000); optional gig bag available (p/n 299-1414-006).
