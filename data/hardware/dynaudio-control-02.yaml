description: Dynaudio Control 02 builds on everything Control 01 offers with one
  crucial addition — eight analogue outputs for direct connection to LYD, BM
  series, or other studio monitors with analogue inputs.
details: |-
  Dynaudio Control 02 builds on everything Control 01 offers – with one crucial addition: eight analogue outputs for direct connection to LYD, BM series, or other studio monitors with analogue inputs.

  Like Control 01, it's a full-featured DSP unit supporting Dante, Thunderbolt, AES3 and MADI connectivity. And thanks to its stellar expansion options, it can integrate seamlessly into any studio, from stereo mixing to immersive Dolby Atmos configurations.

  Control 02 gives you all the tools to monitor, route, and fine-tune your audio in one compact and expandable unit – designed for workflows that need analogue flexibility without compromise.

  Connect a Control Link for tactile running of your studio system, and you have a complete solution for the most demanding professional scenarios.
specs: |-
  - Chassis: 19", 1 RU
  - Depth: 32 cm / 12.6"
  - Width: 43.5 cm / 17.2"
  - Weight: 2.8 kg / 6.5 lbs
  - Networking: 2x RJ45, 1000BASE-T, Dante, AES67
  - Thunderbolt: 2x Thunderbolt 3, 2x15 Watts PD
  - ADAT: Toslink 2x In, 2x Out (16 channels total, configurable as S/PDIF)
  - AES3: DB25, 8CH AES3 (16 Audio Channels)
  - Word Clock: 2x BNC (WC In/Out)
  - MADI: 2x BNC (MADI In/Out)
  - Headphone: 2x TRS (Front), 18-600 Ohm
  - Expansion: DAD Expansion Modules, 1 available slot
  - Power: C13, 90-260 VAC (Max 120W)
  - Power consumption (Digital section): 15W
  - Power consumption (DAD I/O Options max): 30W
  - Power consumption (Thunderbolt power max): 2x15W
  - Power consumption (Mains): 120 VA max
  - Input voltage: 90-260 VAC; 100-240 VAC Nominal, 47-63 Hz
  - Mains fuse: 1 A, T1AH/250V (mounted in IEC connector)
  - Safety compliance: IEC 62368-1:2020+A11 2020
