details: |-
  Digital turntable

  Pioneer's CDJ-1000 revolutionises the way to play with CD's, just like vinyl you can stop the digital sound with your fingers and cue up in exactly the same way. Even bending the sound or scratching with no sound latency is possible. Never before has digital so successfully reproduced the sounds,feel and creativity of analogue.
  Thorough research and close communication with professional DJ's has provided Pioneer with the impetus and challenge to develop the first ever digital deck to feature such integrally analogue features in a purely digital environment.

  The CDJ-1000 is changing the face of Djing - stimulating and inspiring the DJ to be more creative behind the decks, providing you with more funky features to play,use and experiment with. No longer do you need to spend years learning the 'Cut and Paste'DJ techniques nor gain experience
