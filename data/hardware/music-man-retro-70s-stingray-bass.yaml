description: >-
  The Retro '70s StingRay bass honors Music Man's American craftsmanship of the
  1970s with vintage-inspired features: a 21-fret 3-bolt maple neck with
  micro-tilt adjustment, bullet truss rod, strings-through-the-body bridge with
  adjustable mute pads, and an alnico-loaded humbucking pickup. Available in
  black, white, vintage sunburst, and heritage natural finishes.
details: |-
  The Retro '70s StingRay is a faithful reproduction of the original 1970s StingRay specifications, capturing the look, sound, and feel of Music Man's flagship 4-string bass as it shipped from San Luis Obispo decades ago.

  The ash body wears a high gloss polyester finish in one of four period-correct colors: Vintage Sunburst, Black, White, or Heritage Natural. The maple neck and fingerboard carry a slight yellow tint, attached to the body via a 3-bolt neckplate with Schaller Music Man micro-tilt adjustment and a bullet truss rod accessible at the headstock.

  A single Music Man vintage-style humbucking pickup with long alnico 5 magnets is paired with a 2-EQ hand-soldered preamp using ceramic disc capacitors, delivering the punchy midrange the original was known for. Controls are volume, treble, and bass.

  Hardware includes the pre-EB geometry Music Man chrome-plated steel bridge plate with vintage stainless steel saddles and string-through-body loading, plus Schaller bass tuning machines.
specs: |-
  - Body wood: Ash
  - Body finish: High gloss polyester
  - Neck wood: Maple
  - Fingerboard: Maple
  - Fret markers: Black dot
  - Neck finish: High gloss polyester (slight yellow tint)
  - Neck width: 1-11/16" at nut, 2-1/2" at last fret
  - Frets: 21 nickel silver
  - Scale length: 34"
  - Neck radius: 7.5"
  - Neck attachment: 3-bolt neckplate with micro-tilt adjustment
  - Pickups: Vintage-style alnico humbucking with long alnico 5 magnets
  - Electronics: 2-EQ hand-soldered preamp with ceramic disc capacitors
  - Controls: Volume, treble, bass
  - Bridge: Pre-EB geometry Music Man chrome-plated steel plate with vintage stainless steel saddles
  - Tuning machines: Schaller bass
  - Colors: Vintage Sunburst, Black, White, Heritage Natural
  - Strings: 45w-65w-80w-100w (Super Slinky Bass #2834)
