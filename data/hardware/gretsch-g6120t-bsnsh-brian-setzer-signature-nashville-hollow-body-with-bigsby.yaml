details: |-
  By spearheading the rockabilly revival with the Stray Cats and jump-starting Big Band Swing with the Brian Setzer Orchestra, Brian Setzer has created a remarkable and lasting legacy.

  Gretsch is thrilled to be a part of Setzer's pivotal legacy with the G6120T-BSNSH Brian Setzer Signature Nashville Hollow Body with Bigsby, a truly rocking instrument.

  The single-cutaway hollow body in stunning Black Lacquer is equipped with an arched maple top with 1959 trestle bracing and oversized F-holes. Period-correct control locations include a three-position pickup toggle switch, dual volumes, master volume and 3-position tone switch.

  The G6120T-BSNSH duly impresses with period-correct gold pickguard shape, size and bracket, white body and neck binding, Pearloid Neo-Classic thumbnail inlays on the ebony fingerboard, and a Bigsby B6C tailpiece paired with a pinned Adjusto-Matic bridge.
