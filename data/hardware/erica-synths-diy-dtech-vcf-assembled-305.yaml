details: |-
  The Dtech VCF is a skiff format filter whose sound circuit uses the original Russian K140UD12 integrated circuits found in the Polivoks VCF. Its character runs from deep, bassy sounds to screams more extreme than the resonant Polivoks tone it descends from.

  Control is unusually deep for a voltage controlled filter. Alongside the expected cutoff and resonance there is a resonance CV input, adjustment of the filter curve and the resonance slope, and a CV assign function that is particular to this design.

  The filter offers low pass and band pass modes. In low pass the slope runs at roughly 12dB per octave at the maximum slope setting and roughly 6dB per octave at the minimum. The band pass mode is 6dB per octave, and the slope control varies the bandwidth by moving the lower end of the band.

  All inputs are buffered with diode protection, the power input is protected against reversed supply voltage, and the module tracks at 1V per octave. It was designed by Edward Dtech with the PCB laid out by Girts at Erica Synths, and it fits 14HP with a depth of 45mm.
specs: |-
  - Filter Mode LP/BP
  - LPF approx 12dB/oct at max slope setting, approx 6dB/oct at min slope setting
  - BPF 6dB/oct, slope varies bandwidth (BPF lower end frequency)
  - Input signal level 10V ptp
  - CV signal level 10V ptp
  - Power supply eurorack standard +-12V
  - Power consumption 62mA (+12V), 56mA (-12V)
  - Module width 14HP
  - Module depth 45mm
  - Buffered inputs with diode protection
  - Protection on reversed power supply voltage
  - 1V/oct response
