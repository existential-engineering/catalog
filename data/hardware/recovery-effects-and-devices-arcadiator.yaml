description: An experimental lo-fi synth, octave, and fuzz hybrid pedal built
  around an ATtiny85 microcontroller, producing unstable, glitch-heavy digital
  textures.
details: |-
  An early small-run experimental build from the Recovery Effects archive (1 of 4), dating back roughly a decade. Serial #4083. Built around an ATtiny85 microcontroller, this pedal operates as a lo-fi synth, octave, and fuzz hybrid. It is loosely inspired by devices like the Arcadiator, producing unstable, glitch-heavy digital textures that sit between fractured octave fuzz and synth voice. Features:

  A distinctive one-off piece for circuit-bent enthusiasts and players drawn to unpredictable, character-rich instruments.
specs: |-
  - Left footswitch cycles through 5 octave-based modes
  - Unique power-up behavior with a short, video game–style startup sequence
  - Gritty, aliasing-heavy tones with unstable digital character
