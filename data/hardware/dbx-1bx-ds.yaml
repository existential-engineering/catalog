details: |-
  The 1BX DS extends the 1BX Dynamic Range Expander by adding a dynamic bass synthesis section, designed to restore the bass frequencies that are often rolled off or compressed during FM broadcasting and tape duplication. The DS suffix indicates the addition of this bass enhancement circuit.

  The dynamic range expansion section uses dbx's proven technology to increase the contrast between loud and soft program passages, reversing the compression applied during source material creation or transmission. The adjustable expansion ratio and threshold allow the user to tune the effect to different source material.

  The bass synthesis circuit analyzes incoming bass frequencies and synthesizes additional harmonic content below and around the fundamental, restoring perceived low-frequency weight without simply boosting the bass EQ. This dual approach made the 1BX DS popular for improving the playback quality of FM radio, cassette, and other dynamically limited sources.
