details: |-
  The D6X is a dynamic instrument microphone that builds on the historic legacy of the D6 microphone, our highly praised design for stage, studio, and broadcast applications.

  Lightweight, compact, and easy to position, the D6X cardioid microphone is an excellent choice for miking instruments requiring extended low frequency reproduction such as kick drums, large toms, and bass cabinets.

  D6X introduces an easy to operate switch that unlocks three different sound profiles :
  The bottom position (Deep) retains 100% of the classic D6 sonic performance: that's the familiar starting point for a deep, cut-through-the-mix sound.

  The center position (Balanced) delivers a more balanced version of the D6 sound, providing more mids and upper mids thus lending itself to slightly more traditional kick sounds without losing the overall D6 sonic impact.

  The top position (Natural) changes the mic response towards a more linear behaviour, bringing even more midrange and slightly changing the hi-end roll-off. This position lends itself to micking different sound sources like percussion, guitar cabs and a wide variety of instruments.

  All off this is made possible by our proprietary dynamic VLM (Very Low Mass) capsule technology combined with durable and compact construction and a transformerless, low impedance design for interference-free performance.

  Designed and Crafted in the USA.
specs: |-
  - Polar pattern: Cardioid
  - Transducer type: Dynamic (VLM diaphragm)
  - Selectable voicing switch: Deep / Balanced / Natural
  - Output: Balanced, low impedance, transformerless
