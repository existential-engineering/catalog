details: |-
  2-channel DJ mixer with Beat FX.

  With features and design inherited from the DJM-900NXS2 , this 2-channel mixer is ideal to partner with any of our multiplayers or turntables. The Magvel fader combined with smooth EQ and channel fader curves give an assured feel to mixing. Sound Colour FX and Beat FX with parameter control open up new creative possibilities. And thanks to the 64-bit digital signal processer you’ll enjoy warm, high-quality audio from both analogue and digital sound sources. The DJM-450 is compatible with rekordbox , so you can DJ with tracks stored on your PC/Mac when using turntables and our control vinyl (available separately).

  Professional layout. Mixing on the DJM-450 feels instinctive thanks to the layout design, which inherits traits from the DJM-900NXS2 professional mixer.

  Smoother mixing. The EQ lets you balance the high, mid and low frequencies on every channel. Choose your preferred EQ level or use the isolator to totally eliminate each EQ band for the perfect mix.

  Robust faders. Our robust Magvel Faders ensure smooth control over long-term use. Two metal shafts support the fader knobs, while the contact-free magnetic system is designed to endure millions of performances.

  Professional FX. Engage 8 different types of Beat FX – Delay, Echo, Spiral, Reverb, Trans, Flanger, Pitch and Roll – in sync with the bpm. Or trigger 4 studio-quality Sound Colour FX – Dub Echo, Sweep, Noise and Filter – and use the parameter control knob to add more creativity to your mixes.

  Performance features. Unlock rekordbox performance features by simply connecting the unit to your PC/Mac. And, if you subscribe to the Creative plan, use Cloud Library Sync for seamless library management across multiple devices, and easily make custom versions of tracks in Edit mode.

  DVS control. Make full use of rekordbox's low-latency DVS control for intuitive, smooth scratching. Find out more .
