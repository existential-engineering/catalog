description: A classic-sounding analog fuzz pedal offering smooth, rich sustain
  with strong note definition. A tighter low end makes it well suited to full
  chords as well as sustained single notes.
details: |-
  The Empress Fuzz is an all-analog fuzz that delivers lots of gain with smooth, rich sustain and great note definition. Its low end stays tight rather than floppy, so it holds up on full chords and works well on bass as well as guitar. Medium gain settings offer a heavy chunk without losing control.

  A two-band EQ (high shelf and low shelf) lets you tweak the voicing, and a dedicated output control sets the level. The pedal is true bypass, so it does not colour your signal when disengaged, and it packs all of this into a compact die-cast aluminum enclosure.
specs: |-
  - Controls: Gain, Output, high-shelf EQ, low-shelf EQ
  - All-analog signal path (no digital)
  - True bypass
  - Input impedance: 300k
  - Output impedance: 50k
  - Frequency response (-3dB): 20Hz - 20kHz
  - Power: 9V DC (negative tip), 2.1mm barrel connector
  - Power consumption: ~30mA
  - Enclosure: die-cast aluminum
  - Dimensions: 4.5" L x 2.5" W x 1.5" H (enclosure), 2" H including controls
  - Weight: 0.5 lbs
