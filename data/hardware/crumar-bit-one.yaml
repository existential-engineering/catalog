description: >-
  The Crumar Bit One is a 6-voice programmable polyphonic analog synthesizer with digital
  control, produced from 1984 to 1986. It features a 61-note velocity-sensitive keyboard,
  two DCOs per voice, and dual/split keyboard modes for versatile performance.
details: |-
  The Crumar Bit One was produced between 1984 and 1986 as part of Crumar's Bit series of digitally controlled analog synthesizers. It offered a competitive feature set for its era, with six voices of polyphony, two digitally controlled oscillators per voice, and a resonant filter with dedicated ADSR envelope per voice.

    The Bit One distinguished itself with a 61-note velocity-sensitive keyboard and 63 user-programmable patch memories, placing it alongside competitors like the Roland Juno-106 in the mid-1980s polyphonic synthesizer market. Its dual and split keyboard modes added performance flexibility uncommon at its price point.

    The synthesizer was equipped with MIDI control, reflecting the rapid adoption of the MIDI standard in the mid-1980s. Each voice featured two LFOs with triangle, ramp, and square waveforms, providing extensive modulation possibilities.

    Notable users of the Bit One include electronic acts such as 808 State and Cirrus, cementing its place in the history of electronic and techno music production.
specs: |-
  - Polyphony: 6 voices
    - Oscillators: 2 DCOs per voice (triangle, sawtooth, pulse, noise)
    - Filter: 1 resonant VCF with ADSR envelope per voice
    - Amplifier: 1 VCA with ADSR envelope per voice
    - LFOs: 2 per voice (triangle, ramp, square)
    - Keyboard: 61 keys, velocity-sensitive
    - Memory: 63 user patches
    - Control: MIDI
    - Date Produced: 1984-1986
releaseDate: "1984"
