description: Erica Synths Black Joystick Controller is a manual command center
  for your modular setup, it also generates several sets of CVs and alters
  incoming CV signal. The joystick doesn't have a spring.
details: |-
  The Black Joystick Controller is a manual command centre for a modular setup. It generates several sets of control voltages from one stick and also alters an incoming CV signal, so it works as a performance surface and as a processor at the same time.

  Four unipolar outputs running 0 to 10V follow the four compass directions of the stick (E, W, N and S), while two bipolar outputs running -5V to +5V carry the X and Y axes and two further outputs carry those axes inverted. Two CV inputs accept external voltages between -10V and +10V.

  A dead zone at the joystick centre, with a setting for 0V CV output, keeps the resting position quiet rather than drifting. The joystick itself has no spring, so it stays wherever it is left.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. The panel is 12HP wide at a depth of 30mm, the skiff friendly design suits shallow cases, and power draw is 25mA on each of the +12V and -12V rails.
specs: |-
  - Four unipolar 0-10V CV outputs
  - Two bipolar -5V - +5V CV outputs
  - Two inverted -5V - +5V CV outputs
  - Two CV inputs
  - "Dead zone" in the joystick centre, with setting for 0V CV output
  - Skiff friendly design
  - E, W, N, S CV level 0...10V
  - X-Y CV level -5V...+5V
  - CV IN level -10V - +10V
  - Panel width 12HP
  - Module depth 30mm
  - Power consumption 25mA@+12V, 25mA@-12V
