details: |-
  The BASSRIG Fifteen is an all-analogue amp recreation, based on the legendary Ampeg B-15 Portaflex amplifier. Introduced in the early 1960s, the B-15 was the first dedicated bass combo amp and is still highly sought after today, with its low output power and unique cab making it the perfect choice for the studio. While its signature warm clean tones and subtle overdrive are synonymous with the sound of '60s soul records, it's at home in any genre that calls for a vintage bass tone. The BASSRIG Fifteen recreates the sound, feel and character of this timeless bass rig.

  Familiar, responsive controls let you dial in instantly recognisable retro studio tones, while the BLEND control adds in clean signal for low-end clarity and extra articulation. An all-analogue cabinet simulation from the DI OUT make the BASSRIG Fifteen the perfect direct recording tool or direct-to-PA preamp, and the powerful AMP OUT EQ tailors the voicing of the pedal to suit any backline amp.

  Authenticity is paramount when designing our Amp Recreation pedals, so we started the process by acquiring a real, vintage Ampeg B-15. We subjected this coveted amp to a rigorous set of tests and measurements, then recreated its entire signal path in miniature using carefully designed solid-state circuitry. This includes the preamp, phase inverter, power amp and reactive load, all simulated inside the BASSRIG Fifteen. This adds up to an all-analogue preamp pedal that not only sounds just like the world's favourite studio bass amp, but has that all-important playing feel too!

  Vintage bass tones are still relevant today but modern rigs are very different, so the BASSRIG Fifteen gives you all the warmth and character of the B-15's 1x15 cab from the cabinet-simulated DI OUT. This super-accurate analogue filter gives you a studio or stage-ready DI tone that will fit right into any mix. Flexible switching on the DI OUT lets the BASSRIG Fifteen double up as a clean DI, a cab sim for other preamps, or an unfiltered preamp ready to pair with your favourite IR loader.

  For players hooking the BASSRIG Fifteen up to an amp, the AMP OUT EQ offers a comprehensive set of controls aimed at matching the pedal's tone to the voicing of their amp and cab. Built with premium quality components and a rugged stainless steel enclosure, the BASSRIG Fifteen brings B-15 goodness to any studio, stage or stadium.
specs: |-
  - All-analogue signal path recreation of the Ampeg B-15 amplifier
  - Simulated push-pull power amp with reactive load
  - All-analogue 1x15" cabinet simulator and DI output
  - Extensive AMP OUT EQ controls for compatibility with any rig
  - BLEND knob to mix in clean signal
  - High-quality buffered bypass
  - Premium components throughout
  - Designed and built in England
  - Weight: 846g (1.86 lb) unboxed / 930g (33oz) boxed
  - Dimensions: 146 x 93 x 65mm (L x W x H) unboxed / 160 x 116 x 95mm boxed
  - Input impedance: 1M ohm
  - AMP OUT impedance: 500 ohm
  - DI OUT impedance: 1k ohm
  - Current draw: 200mA
  - Power supply: 9V DC, 2.1mm centre-negative barrel connector (mains adaptor only, no battery option)
