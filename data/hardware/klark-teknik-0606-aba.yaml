description: DN9652 provides a multichannel interface between two third party
  digital audio networks and point-to-point interfaces. The two interfaces
  operate in separate clock domains connected by a bidirectional asynchronous
  sample rate converter, allowing up to 64 bidirectional channels to pass
  between two independently clocked domains that can run at different sample
  rates.
details: |-
  Currently supporting MADI and Audinate Dante via the Klark Teknik KT-MADI and KT-DANTE64 network modules, DN9652 can support new and emerging protocols via its industry-standard expansion slot, which is compatible with the Cirrus CM-1 format.

  The multichannel bidirectional asynchronous sample rate converter allows the two third party domains to function independently, and features a bypass facility so that one third party network domain can be directly clocked from the other where the networks need to be synchronised. When the domains operate independently, a clock failure or loss of synchronisation in one domain will not necessarily affect the other. A user-configurable bidirectional output clock inhibit feature stops the output clock if the incoming clock synchronisation fails, so that a failure can be recognised and switchover to a redundant network initiated.

  DN9652 supports 24 bit audio at 48 kHz and 96 kHz independently in both third party network domains. Word clock input and output connections plus a black burst horizontal video sync input are provided on BNC connectors, the latter supporting PAL, SECAM and NTSC in standard definition and 720P, 1080P and 1080i in high definition. The word clock output can be derived from either third party network clock domain or from the word clock input. A precision AES Grade 1 reference temperature-compensated oscillator with 1 ppm stability can serve as the reference clock for digital audio systems.

  An on-board web server allows platform-independent configuration from a web browser, covering network module and DN9652 settings including third party network domain sample rate, clock synchronisation options, ASRC bypass and the bidirectional output clock inhibit. Status LEDs on the front panel indicate network synchronisation for both domains, Ethernet control port activity and the ASRC and clock inhibit states, and an alphanumeric LCD display allows individual units to be labelled.

  The rugged steel 1U rackmount enclosure is designed for the rigours of live concert touring, with industry-standard BNC connectors for reliable clock connections, and the universal switch-mode power supply is auto-voltage sensing for worldwide use.
specs: |-
  - Up to 64 bidirectional channels between two independently clocked domains
  - 24 bit audio at 48 kHz or 96 kHz in both third party network domains
  - Bidirectional asynchronous sample rate converter with bypass
  - User-configurable bidirectional output clock inhibit
  - Industry-standard expansion slot compatible with the Cirrus CM-1 format
  - Supports MADI and Audinate Dante via the KT-MADI and KT-DANTE64 network modules
  - Word clock input and output on BNC
  - Black burst horizontal video sync input on BNC, supporting PAL, SECAM, NTSC, 720P, 1080P and 1080i
  - AES Grade 1 reference temperature-compensated clock oscillator with 1 ppm stability
  - On-board web server for platform-independent configuration
  - Alphanumeric LCD display for unit labelling
  - 1 U rugged steel rackmount enclosure
  - Auto-ranging universal switch-mode power supply
