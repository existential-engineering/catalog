description: 500-Series FET Limiting Amplifier
details: The Bluey 500 is a 500-series FET limiting amplifier based on Chris
  Lord-Alge's legendary heavily-modified 1176 Blue Stripe compressor. Black Lion
  Audio worked directly with CLA to reverse-engineer years of mods and component
  replacements to recreate the original's sound. Fits in two 500-series slots.
  Features custom Cinemag transformers, recreated console insert path, active
  wet/dry mix for parallel compression, and stereo link via RCA. Built with
  vintage-inspired PCB layout, 1% resistors, polyester capacitors, and a linear
  power supply. Hand-tested and QC'd in the USA.
specs: |-
  - Type: FET Limiter (500-series, 2 slots)
  - Number of Channels: 1
  - Transformers: Custom Cinemag
  - Ratio: 4:1, 8:1, 12:1, 20:1
  - Attack: Continuously variable 20µS to 800µS
  - Release: Continuously variable 50mS to 1200mS
  - Controls: Attack, Release, Mix, Input, Output
  - Stereo link: RCA
  - Power: ±15V from 500-series rack
  - Made in USA
