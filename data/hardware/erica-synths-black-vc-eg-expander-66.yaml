url: https://www.ericasynths.lv/black-vc-eg-expander-66/
description: Erica Syths Black VC EG Expander takes the Black VC EG to the next
  level – it outputs gates or CVs for each active stage of the envelope so you
  can design some really advanced patches. Inverted and bipolar envelope outputs
  are also available.
details: |-
  The Black VC EG Expander takes the Black VC EG further, outputting gates or CVs for each active stage of the envelope so that genuinely advanced patches can be designed. Inverted and bipolar envelope outputs are available alongside them.

  Four simultaneous logic or CV outputs cover the envelope stages, the bipolar envelope output spans -5V to +5V, and a duplicated envelope output joins the inverted one on a 5HP panel.

  This expander module can be connected only to the Black VC EG. It will not work as a standalone eurorack module.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black Series, putting design and usability first, with big knobs assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.
specs: |-
  - 4 simultaneous logic or CV outputs for each envelope stage
  - Bipolar envelope output (-5V to +5V)
  - Inverted envelope output
  - Duplicated envelope output
  - 5HP panel width
  - Connects only to the Black VC EG, not standalone
