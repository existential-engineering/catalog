description: >-
  The Korg M500 Micro-Preset is a monophonic preset synthesizer from the late 1970s housed
  in a compact wooden cabinet. It features six preset sounds including voice, synth,
  brass, string, and wood tones, with a unique 'traveller' control that combines filter
  and resonance for squelchy, acid-style bass textures. Despite being marketed as an
  entry-level instrument, it has found fans among notable electronic artists for its
  quirky character and raw sound reminiscent of the Korg MS-10.
details: |-
  The M500 Micro-Preset represents a curious late-1970s design philosophy from Korg, combining preset convenience with a compact wooden enclosure. The instrument was specifically aimed at the beginner market, offering an accessible entry point into synthesis without deep sound design capabilities. Its six presets cover voice, synth1, synth2, brass, string, and wood tones, though the wood and brass presets are widely considered to be of limited practical use.

  Once past its unassuming outward appearance, the M500 reveals a noise box that sounds remarkably similar to the MS-10 at times. The standout feature is its 'traveller' control, a sort of filter and resonance control rolled into one, which offers interesting squelchy acid-style bass run effects. Combined with rudimentary decay and release envelope controls plus vibrato with depth and speed parameters, the M500 is capable of surprisingly expressive bass textures.

  Notable artists who have used the M500 Micro-Preset include Add N To (X), The Human League, OMD, Jean Michel Jarre, Pop Will Eat Itself, and Brian Eno.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: Single oscillator
  - Presets: 6 (voice, synth1, synth2, brass, string, wood)
  - Filter: Traveller control (filter/resonance hybrid)
  - Envelope: Decay and release controls
  - Modulation: Vibrato with depth and speed controls
  - Keyboard: 32 keys
  - Memory: None
  - MIDI: None
  - Housing: Wooden cabinet construction
  - Date Produced: 1977-1980
