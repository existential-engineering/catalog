description: An ideal instrument for dazzling high-speed playing, the Pro-Mod
  San Dimas Style 1 HSS HT E Sassafras delivers scorching sound, stunning style
  and grin-inducing playing feel and performance. This HSS hardtail variant
  pairs a lightweight sassafras body with a satin black finish and Seymour
  Duncan electronics.
details: |-
  The Pro-Mod San Dimas Style 1 HSS HT E Sassafras pairs a sassafras San Dimas Style 1 body with a Satin Black finish. The bolt-on maple neck features graphite reinforcement rods, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays, anchored by a black plastic nut (1.6875" width) and a 25.5" scale length.

  Electronics center on an HSS pickup configuration: a Seymour Duncan JB TB-4 humbucker in the bridge position, a Seymour Duncan Custom Flat Strat SSL-6 single-coil in the middle, and a Seymour Duncan Custom Flat Strat SSL-6 RWRP single-coil in the neck position. Controls include a volume knob and a no-load tone control, routed through a 5-position blade switch with a side-mounted output jack.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge with a brass tremolo block, Charvel-branded die-cast locking tuning machines, knurled flat-top control knobs, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock and heel-mount truss rod adjustment wheel round out the build.
