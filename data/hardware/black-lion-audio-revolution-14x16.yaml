description: 14-in / 16-out USB-C audio interface and word clock with ADAT,
  Auteur preamps, and headphone mixer
details: |-
  The Revolution 14x16 is a class-compliant, 14-in / 16-out USB-C audio interface that delivers sterling Black Lion Audio audio quality, supreme clocking, and a robust suite of monitoring features. It is expandable via ADAT for additional I/O, boasts superior connectivity for external processors, and includes two channels of Black Lion Audio-designed Auteur preamps. The unique Mix Edit feature lets you create a custom headphone mix for its three crystal-clear headphone amps.

  Channels 1 and 2 feature Black Lion Audio's Auteur preamps, transformer-coupled with Cinemag transformers. At lower gain levels, they deliver the fast attack of American-style preamps; at higher gains, they provide the warmth and color of classic British preamps. Channels 1 and 2 can be accessed from either the front or rear of the unit.

  The Revolution 14x16 includes four mic/instrument preamps with four switchable insert/returns for connection to external hardware processors. The Return connections double as line inputs for keyboards, synths, and other line-level devices. A secondary set of user-definable analog outputs let you route two analog signals wherever needed, with S/PDIF and ADAT rounding out the digital connectivity.

  Patented Macro-MMC clocking was developed from Black Lion Audio's experience creating dedicated word clocks and modifying embedded clocks in other recording interfaces. Anything connected via the BNC word clock connections benefits from maximum sync and ultra-low jitter, minimizing phase distortions. The unit also accepts external clock input.
specs: |-
  - 14 inputs / 16 outputs
  - USB-C class-compliant connectivity
  - Channels 1 & 2: Auteur preamps (transformer-coupled, Cinemag transformers)
  - Channels 1 & 2 Mic Preamp — Input Impedance: 6.1kΩ, SNR: 111.263dB, Dynamic Range: 106.998dB, THD+N: 0.0023653%
  - Channels 3 & 4 Revolution Preamps — Input Impedance: 2.08kΩ, SNR: 107.975dB, Dynamic Range: 111.010dB, THD+N: 0.0010273%
  - Line Inputs — Input Impedance: 20kΩ, Maximum Input: +16.2dBu, Dynamic Range: 111.412dB
  - Main Line Outputs — Output Impedance: 47Ω, Max Output: +16dBu, Dynamic Range: 109.225dB
  - Headphone Outputs — Output Impedance: 20Ω, Maximum Signal Output: 2.652Vrms
  - Three independent headphone amplifiers with Mix Edit
  - 4 switchable insert/return connections for external hardware processors
  - ADAT expandable: 8-in / 8-out via ADAT
  - S/PDIF digital I/O
  - BNC word clock input and output (Macro-MMC clocking)
  - Eight-stage metering switchable between input, output, or insert levels
  - PG-i filtering technology and full-circuit power decoupling
  - Patented Macro-MMC clocking technology
  - Standalone mic preamp operation (no computer required)
  - 1U rack-mount form factor
