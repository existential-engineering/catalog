description: Erica Pico LPG is our take on classical Don Buchla LPG designs. We
  use vactrols in the circuit for that signature sound, and we added some more
  features, like configurable resonance and built-in decay envelope.
details: |-
  Pico LPG is Erica Synths' take on the classical Don Buchla low pass gate designs. Vactrols are used in the circuit for that signature sound, with further features added on top.

  Resonance is configurable and a decay envelope is built in, so a single trigger produces the plucked response the design is known for without a separate envelope generator. VCA and VCF modes are both available, which is what makes it a low pass gate rather than only a filter.

  The module is 3HP wide and 35mm deep. It accepts audio up to 10Vptp without clipping, takes CV from -10V to +10V, and offers a maximum decay time of 350ms, with input protection against overvoltage and protection against a reversed PSU connection.
specs: |-
  - Classical LPG sound
  - VCA and VCF modes
  - Configurable resonance
  - Built-in Decay envelope
  - Input protection against overvoltage
  - Protection against reverse PSU connection
  - Audio input level (without clipping) 10Vptp
  - CV level -10V to +10V
  - Max decay time 350ms
  - Power consumption +12mA, -13mA
  - Module width 3HP
  - Module depth 35mm
