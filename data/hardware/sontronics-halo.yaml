details: |-
  Reproduce the sound of your guitar amp with perfect precision and depth. Designed by a guitarist for guitarists, the Sontronics HALO dynamic mic has been developed specifically for use on guitar amplifiers. Thanks to HALO's retro-inspired look, this is not only the best-sounding but also the best-looking mic you can put in front of your guitar cab! With its tight supercardioid pickup, HALO has excellent side rejection and will capture all the depth, presence and detail of your setup sound without the need for additional EQ'ing. Whether you're in the studio, out on tour or recording at home, your performance will sit perfectly in the mix. FEATURES

  Key Features

  IDEAL FOR

  The HALO is perfect for:

  TECH SPECS

  Technical Specifications

  Frequency Response

  WATCH
specs: |-
  - Dynamic Microphone : Designed specifically for miking guitar amplifiers, capturing rich, detailed tones with ease.
  - Unique Retro Design : Features a distinctive circular body, inspired by vintage microphones, combining visual appeal with modern performance.
  - Tailored Frequency Response : Optimised to capture the harmonic detail and warmth of guitar amps, delivering a balanced and natural sound.
  - Supercardioid Polar Pattern : Provides focused sound capture, isolating the amp's output and minimising background noise.
  - High-SPL Capability : Handles the loud volumes produced by guitar amplifiers without distortion, making it ideal for both studio and live use.
  - Rugged Construction : Built to withstand the rigours of live performances ensuring long-term durability.
  - Easy Positioning : Compact design allows for precise placement in front of the amplifier, ensuring the best possible sound capture.
  - Versatile Application : Ideal for electric guitar, bass amps, and other amplified instruments, providing flexibility in different recording and live scenarios.
  - Preferred by Guitarists : Trusted by musicians and engineers for its ability to faithfully reproduce the true sound of your guitar setup, both in the studio and on stage.
  - Guitar Amps
  - Harmonica
  - Snare Drum
