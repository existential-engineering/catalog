details: |-
  The miracle of volume! When you play chunk rhythm, finger-style, bottleneck or anything else, the all-mahogany deluxe-appointed G9241 Alligator Biscuit Roundneck resonator guitar projects its distinctively swampy tones all the way to the back door of any dance hall.

  The guitar features the all-new Gretsch Ampli-Sonic diaphragm (resonator cone). Hand-spun in Eastern Europe from nearly 99-percent pure aluminum, the Ampli-Sonic diaphragm yields an impressive quality and volume of tone. Equipped with a Fishman Nashville Series Resophonic Pickup for amplified performance.
