details: |-
  ELECTRIC PEDAL V2

  (Transparent Drive / Compression)

  Gorgeous and transparent drive/compression. This pedal does it all from a slight boost/compression to a nice, warm, and light overdrive. Perfect for a first-stage overdrive or boost pedal. Switchable transistors allow you to move back and forth between modern and vintage tones, using a BC547 and oil-can style BC108. Although it includes a bypass switch, you will never use it! Designed and assembled in Seattle, Washington. Operates on a standard 9Vdc Boss-style power supply (not included), but can also run at 18vdc for additional headroom. Enclosure size: 4.77" x 2.6" x 1.39"

  Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
