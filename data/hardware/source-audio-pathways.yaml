details: |-
  Pathways brings tremolo and reverb together in one compact pedal designed to feel great the moment you plug in. From spring reverb twang and classic amp tremolo to wider, more spacious textures, Pathways delivers sounds players reach for again and again - organic, musical, and easy to dial in.

  The pedal features seven reverb engines (Spring, Tank, Plate, Hall, Room, Slap, Echo) and three tremolo engines (Optical, Bias, Harmonic), inspired by classic equipment.

  Designed for immediate usability with direct front-panel controls, Pathways also offers advanced editing and preset management through a Neuro 3 software connection over USB-C, with 128 preset locations.

  Pathways supports flexible routing: mono in to mono out, mono in to stereo out, stereo in to stereo out, and stereo in to mono out. It housed in brushed anodized aluminum and carries a 2 year warranty.
specs: |-
  - Seven reverb engines: Spring, Tank, Plate, Hall, Room, Slap, Echo
  - Three tremolo engines: Optical, Bias, Harmonic
  - 128 preset locations
  - Neuro 3 software editing via USB-C
  - 3.5 mm TRS MIDI In and Thru (Type A)
  - Stereo input and stereo output capable
  - Power consumption: 200 mA (1.8 watts)
  - Dimensions: 4.6 in. x 2.75 in. x 2.2 in.
  - Weight: 1 lb.
  - Housing: brushed anodized aluminum
  - 2 year warranty
