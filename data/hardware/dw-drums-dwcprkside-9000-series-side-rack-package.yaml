description: This versatile and heavy-duty package will let you create an array of custom configurations.
details: |-
  This versatile and heavy-duty Side Rack Package will let you create an array of custom configurations. Designed specifically for use with DW Rack Systems, it is the ultimate way to personalize your kit.

  The package is built around two DWCPRKB36S 36″ straight bars and one DWCPRKB24S 24″ straight bar, joined by three DWSMRKC15K 1.5″ clamps with drum key screw and two DWSMRKC15V 1.5″ V rack clamps.

  Six DWSMRKML15 1″ hinged memory locks return the rack to the same positions at every setup, and two DWSMRKFEET rubber feet steady it on the floor. A DWSMRKDRKY hi-torque drum key is included.
specs: |-
  - Two DWCPRKB36S 36″ Straight Bars and one DWCPRKB24S 24″ Straight Bar
  - Three DWSMRKC15K 1.5″ Clamps with Drum Key Screw
  - Two DWSMRKC15V 1.5″ V Rack Clamps and six DWSMRKML15 1″ Hinged Memory Locks
  - Two DWSMRKFEET Rubber Feet
  - DWSMRKDRKY Hi-Torque Drum Key
  - Finish: Chrome
