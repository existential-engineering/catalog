url: https://www.dangerousmusic.com/product/sum-minus
description: The secret weapon is analog sum and difference processing and the
  Dangerous Music S&M delivers its power to any engineer looking for an edge.
details: |-
  For years engineers have wondered what secret process allowed certain big-name mastering houses to deliver better, louder, and more refined sounding tracks. The secret weapon is analog sum and difference processing: the Sum-Minus separates any stereo track into a center and side matrix, giving previously unattainable control over the entire stereo field.

  By inserting an EQ, compressor, limiter, or de-esser into the Sum and Minus send/return loops, engineers can independently process the center and side signals. Mastering engineers can save seemingly unsalvageable tracks by altering vocal levels or fixing overly wide or narrow stereo fields.

  The front panel has two controls: an Engage switch that toggles between normal stereo mode (bypassing the matrix circuitry) and Sum-Minus mode, and a stepped Width control with precise 1/2dB steps to the difference channel, ranging from -3 to +3.

  Assembled by hand with a 100% analog signal path, the Sum-Minus (S&M) is built for mixing and mastering engineers who need repeatable, surgical control over stereo width and imaging.
specs: |-
  - Nominal operating level: +4dBu
  - THD+Noise: 0.003%
  - IMD (60Hz, 4kHz, 4:1): 0.004%
  - Maximum level: +22dBu
  - Dynamic range: >114dB
  - Sum/Minus channel separation: >78dB
  - Minus channel level accuracy: 0.02dB
  - 100% analog signal path
  - Insert loop (Sum & Minus send/return) for analog outboard processing
  - Stepped Width control, -3 to +3 in 1/2dB steps
  - Engage switch toggles Stereo (bypass) / Sum-Minus matrix mode
