url: https://www.mrblackpedals.com/products/supermoon-eclipse
description: The SuperMoon Eclipse is a true-stereo reverb that combines both
  the SuperMoon and SuperMoon Chrome voicings in one pedal, selectable via a
  mode button, with expression control and preset save/recall.
details: |-
  Two immense celestial bodies collide and coalesce into a surreal, ethereal
  sonic miracle. The SuperMoon Eclipse expands the SuperMoon Modulated
  Reverberator into a breathtaking true-stereo format and includes both the
  SuperMoon and SuperMoon Chrome voicings, selectable on the fly via the mode
  button.

  The true-stereo audio path runs two fully independent, complementary channels,
  each carrying the pedal's proprietary Sway modulation and reverb trails of up
  to 30 seconds. The Chrome side adds a lossless, 100% wet-capable wet/dry mix.

  Any or all of the control knobs can be assigned to an expression pedal simply
  by connecting a standard expression pedal and turning the desired control all
  the way up. A preset is stored with the Save button and toggled with the Preset
  switch, and the pedal offers trails on bypass.

  Housed in a compact 3.7 by 4.7 inch enclosure and proudly made in the U.S.A.,
  the Eclipse is the flagship stereo statement of the SuperMoon line.
specs: |-
  - Stunning, lush, modulated stereo reverb
  - True-stereo audio path with two fully independent complementary channels
  - Standard and Chrome modes selectable via mode button
  - Dynamic, proprietary Sway modulation
  - Full, lossless wet/dry mix control on Chrome side (100% wet capable)
  - Up to >30 seconds of fluid reverb trails
  - Expression control input assignable to any and all controls on the fly
  - Preset save/recall
  - Trails on bypass
  - Daisy Chain Friendly
  - Input Impedance: ~500KΩ (each channel)
  - Output Impedance: ~2KΩ (each channel)
  - Frequency Response: ~15.6Hz – ~22KHz
  - Buffered-Bypass (trails)
  - Compact design (3.7" x 4.7")
  - 9VDC 2.1mm negative center-pin power (not included)
  - Current Draw: <70mA
