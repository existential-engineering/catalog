description: >-
  The Little Brother is an expansion module for ARP monophonic and polyphonic
  synthesizers, featuring its own VCO oscillator and LFO for sound enhancement
  and modulation effects.
details: |-
  The Little Brother serves as an expansion module compatible with any ARP-System monophonic or polyphonic synthesizer. It includes a built-in VCO oscillator and LFO to enhance existing synthesizer capabilities.

  Users can employ the Little Brother to double up monophonic models like the Axxe or substantially fatten the sound of polyphonic units such as the Odyssey, 2500, or 2600. The onboard LFO introduces fresh and creative modulation possibilities to these synthesizers.

  Multiple Little Brothers can be stacked together to greatly expand or enhance synthesizer functionality in a modular-like fashion. The module uses ARP's System Interface for integration while also providing CV, gate, and trigger inputs along with an LFO output for flexible connectivity.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: One LFO with speed, depth and delay
  - VCA: Master volume
  - Keyboard: None
  - Arpeggiator/Sequencer: None
  - Memory: None
  - Control: ARP's system interface
  - Date Produced: 1975-77
releaseDate: "1975"
