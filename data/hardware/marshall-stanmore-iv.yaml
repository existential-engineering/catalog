description: Bluetooth home speaker with spacious, room-to-room sound.
details: |-
  Deepen your connection to the songs you love with Stanmore IV. Its upgraded tweeters and redesigned bass port create a better, wider soundstage that spreads sound further across your space. Featuring built-in Auracast technology, this speaker can be part of a multi-speaker listening set-up. Its classic, timeless Marshall look is inspired by the heritage amp design.

  Wide soundstage: upgraded tweeters and waveguides help Stanmore IV's sound cover a larger space more evenly, so music feels more spacious and each instrument more distinctive. A redesigned bass port delivers deeper and cleaner bass, and makes it easier to place the speaker against a wall without affecting audio performance. Dynamic loudness refines the high and low frequencies for a balanced performance at all volumes.

  Multi-speaker connectivity: with built-in Auracast technology and the Heddon music streaming hub, Stanmore IV can be part of a multi-speaker listening set-up, playing in sync from room to room. A long press on the M-button joins a broadcast, and the customisable M-button otherwise recalls an assigned EQ preference or activates Spotify Tap.

  Analogue inputs: bring other audio devices into the set-up with the AUX input and a 3.5 mm stereo jack lead, or add a record player through the RCA input (a preamp is required). Heritage amp-inspired tactile controls handle bass, treble, volume and playback on the brass top panel, and the Marshall app adds placement compensation, sound settings and EQ presets.

  Product longevity: knobs, feet and grille are available as spare parts and authorised repair services are offered. The MDF cabinet is made from FSC 100 percent certified material (FSC C225755). Designed and engineered in Sweden. Made in Thailand.
specs: |-
  - Driver type: Dynamic
  - Frequency range: 36 to 38,000 Hz
  - Drivers: one 5 inch woofer, two 0.75 inch tweeters with waveguides
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 97 dB SPL at 1 m
  - Cabinet principle: Bass-reflex
  - One 60 Watt Class D amplifier for the woofer
  - Two 25 Watt Class D amplifiers for the tweeters
  - Wireless connectivity: Bluetooth 5.3, Auracast
  - Bluetooth range: 10 m / 32.8 ft
  - Codecs: SBC, AAC (MPEG-2), LDAC, LC3
  - Bluetooth multipoint connectivity: Yes
  - Wired connectivity: AUX 3.5 mm and RCA
  - Top panel controls: bass, treble, volume, power switch, media jog, M-button, source button
  - Microphone system: No
  - Mains input voltage: 100 to 240 V
  - Weight: 3.99 kg / 8.79 lb
  - Width: 350 mm / 13.78"
  - Height: 203 mm / 7.99"
  - Depth: 185 mm / 7.28"
  - Repairability: knobs, feet and grille available as spare parts, authorised repair service offered
  - Cabinet contains FSC 100 percent certified wood (FSC C225755)
  - Box contents: Stanmore IV speaker, mains lead, quick start guide, legal and safety information
  - Compatible app: Marshall app
