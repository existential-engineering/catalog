url: https://bastl-instruments.com/eurorack/modules/knit-rider
description: "Six-voice trigger/gate sequencer for Eurorack with a hierarchical
  step editing architecture: 4 bars per pattern, 16 steps per bar, 4 sub-steps
  per step — 256 steps per pattern total, with 64 patterns available. Each voice
  is independently configurable as trigger or gate mode. Features real-time step
  editing with bar navigation, tap-based sequence recording with quantization,
  individual voice muting, a jump function for step repetition, active step
  control for per-voice step counts, copy/paste/clear, and undo. Accepts
  external clock input with selectable ratio and supports tap tempo. MicroSD
  card storage is rear-accessible."
details: "16 HP width, 35mm depth (skiff-friendly). Power draw: <35mA at +12V.
  10-pin power connector with PTC fuse and diode protection. MicroSD card slot
  on rear panel for pattern storage. 64 patterns total. Each of the 6 voices
  outputs 5V logic level and is individually configurable as trigger or gate
  mode."
