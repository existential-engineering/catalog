description: The Lehle Parallel SW II is a compact and versatile line mixer
  designed to meet the highest tonal standards. It mixes the signals from
  effects units into the original signal, either before an amp or inserted into
  its effects loop, with separately adjustable send and return levels.
details: |-
  The Lehle Parallel SW II is a compact and versatile line mixer designed to meet the highest tonal standards. It mixes the signals from effects units into the original signal, either before an amp or inserted into its effects loop. Send and return levels are adjusted separately, and the mix controller finely balances the effects signal against the original signal. All connections are realised in stereo, so stereo effects pedals can be placed into the signal path.

  Thanks to the discrete Class A input stages with JFET technology, the inputs handle high-impedance signals from electric guitars, basses or acoustic instruments as well as low-impedance signals from keyboards and active electric guitars and basses, with a broad output range extending from 20 to 100,000 Hz. Mono and stereo signals can be combined, so an effects pedal with a mono input and a stereo output integrates into the signal path without limitations.

  The great dynamic range makes it possible to blend rack-mount studio effects units at low-impedance line level into the guitar signal path, or to insert effects pedals at a matched level into an amp's effects loop. To exploit the dynamics of tube amplifiers to the full, the input voltage is rectified from the power supply socket, then filtered, stabilized and transformed to 30 V.

  The Lehle switch works with a microcontroller and an intelligent true-bypass relay circuit with active pop suppression, allowing the Parallel SW II to switch faster than mechanical switches, noise-free and without wear. The easy-action mushroom-shaped button is mounted in the cover, so foot pressure is transmitted indirectly via a spring and the electronics board is not exposed to mechanical loads.

  The pedal has three operating modes, making the switch work as either a latching or a momentary switch, the latter allowing short or rhythmic stutter effects. The third mode combines the first two: a short hit is latching, a long hit is momentary.
specs: |-
  - True-Bypass parallel effects looper and stereo mixer
  - Discrete Class A input stages with JFET technology
  - 122 dB dynamic range thanks to 30 V technology
  - Latching, Momentary or Mixed Mode operation
  - Mono and stereo functionality, including mono-in to stereo-out pedals
  - Active pop suppression circuit
  - Output range extending from 20 to 100,000 Hz
  - Separately adjustable send and return levels plus a mix controller
  - Gold-plated relays and slide switches, rated for 2 million switching operations
  - Input voltage rectified, filtered, stabilized and transformed to 30 V
