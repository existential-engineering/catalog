description: The BassOmeter is a tuner pedal developed specifically for bass, in
  response to requests from Ashdown's artists and gigging bassists, delivering
  pitch-perfect tuning in a gig-ready package. A high-visibility display stays
  clear in bright sun or dark stages, while the unmistakable Ashdown VU provides
  super-accurate analogue tuning alongside the LED note display. It uses genuine
  true-bypass switching for zero coloration when disengaged, and is built
  road-tough with a metal casing, premium switches, recessed knobs and
  kickguards. Tuning precision is +/-1 cent across A0 (27.5Hz) to C8 (4186Hz).
  It runs on a 9V adaptor (not included).
details: |-
  If the bottom end isn't in tune, it's going to be a bad night all round. Developed in response to requests for a tuner specifically designed for bass, the BassOmeter incorporates the features most requested by the Ashdown family of artists and gigging bass players, delivering pitch-perfect tuning in a gig-ready package. High Visibility Display: whether it's a festival in the summer sun or a dark stage with overhead spots, the BassOmeter display is clear and easy to read. Tune with a VU: while the LED display shows the tuning note, the Ashdown VU provides super-accurate analogue tuning. Ashdown Pedals feature genuine 'true bypass' switching for zero-colouration of your input signal when the pedal isn't in use. Built for the road with a metal casing, premium controls and switches, recessed knobs and kickguards to protect screens and VU meters.
specs: |-
  - Bass tuner pedal
  - Precision +/-1 cent
  - Frequency range A0 (27.5Hz) to C8 (4186Hz)
  - Residual noise -85dB
  - Indicators: Calib, Note
  - Connectors: INPUT, OUTPUT, DC adaptor jack
  - True-bypass switching
  - High-visibility LED note display with Ashdown VU meter
  - Power: DC 9V adaptor (not included), max current draw 80mA
  - Dimensions (W x D x H) 120 x 95 x 56 mm
  - Weight 420 g
