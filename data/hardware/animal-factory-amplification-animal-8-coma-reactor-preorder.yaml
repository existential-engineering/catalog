url: https://animalfactoryamps.com/products/animal-8-coma-reactor-preorder
description: A Eurorack textural delay module built around the PT2399 chip that
  also functions as a filter and noise/oscillator generator. It offers CV
  control over delay time, frequency and resonance, plus a send/return path for
  external processing.
details: |-
  Last units left! Inspired by gritty delays on cheap mixers. the Coma Reactor boasts the crunchy sounds of the PT2399 chip, but adds a number of useful routing possibilities that allow you to fracture time and (mind)space. Independent volume controls allow you to blend in clean, delayed and affected sounds as you see fit. The delay time can be CV controlled for slight tape-echo warbles to some truly seasick pitch shifting. You can use the Send/Return path to process your delay signal through another effects unit, or leave it disconnected to rasp it on a truly nasty bandpass filter. Using the Frequency (CV controllable) and Resonance knobs, torture out a sine wave for some truly twisted soundscaping. Feed that back into the input to get evicted. Lastly, this completely delirious module is also capable of generating noises and oscillating with no input attached, making it a useful soundtrack generator for the end of the world. The 2022 Coma Reactor includes a breakout header for future integration with upcoming AFA expander modules.
specs: |-
  - Classic Coma Reactor sound… with more nasty on tap
  - More textural control with BPF frequency and Q knobs
  - Crank up the resonance to make the filter an oscillator.
  - Generate crazy sounds with no input attached
  - Send and Return path to process delay signal separately
  - Future-ready expansion header on the back of the module
