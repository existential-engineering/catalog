name: Waver
manufacturer: bastl-instruments
primaryCategory: distortion
categories:
  - mixer
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/waver
description: Fully analog wave folding mixer and signal disruptor. Features a
  3-input mixer with dedicated faders, 2 bipolar VCAs with attenuverting CV
  control, a wavefolding processor, square shaper, pulse width modulator, and
  signal clipper with feedback capability. All inputs and the mix output are DC
  coupled, making it suitable for both audio and CV processing.
details: |-
  3-input mixer with dedicated faders; 2 bipolar VCAs with attenuverting CV control; wavefolding processor; square shaper; pulse width modulator; signal clipper with feedback. All I/O is DC coupled. PTC fuse and diode protected 10-pin Eurorack power connector.
