website: https://www.hologramelectronics.com/pages/infinite-jets
description: A multi-voice synth and glitch pedal that resynthesizes individual notes/chords into new sounds using two independent sampling channels. Features 10 unique presets with lfo, envelope shaping, analog drive, and expression controls.
details:
  - 'The infinite jets is a multi-voice synth pedal that resynthesizes individual notes and chords using two independent sampling channels. It offers four distinct effect styles: blur, synth, glitch, and swell, allowing musicians to create ambient textures, infinite sustain, and unique sonic manipulations.'
  - The pedal provides multiple triggering modes including mono (one channel at a time), poly (both channels can sustain simultaneously), and manual (independent channel triggering via footswitches). Each effect style offers unique sound transformation capabilities, from creating hazy atmospheric textures to generating synthesizer-like sounds and glitchy audio fragments.
  - 'The dimension control is a versatile feature that changes parameters differently for each effect type: controlling space and feedback in blur mode, filter cutoff in synth mode, sample length in glitch a, and sample selection in glitch b. Users can automate this control through envelope generators, lfo, or by recording knob movements.'
  - Advanced sound-shaping capabilities include octave variations, dynamic processing, and the ability to create complex textural effects. The swell presets allow for dramatic volume effects, tremolo, and unique sustained sounds, while the glitch modes enable real-time audio remixing and pattern evolution.
  - The pedal features professional-grade technical design, including an analog dry path, true bypass switching via an electromechanical relay, and an expression pedal input that can be mapped to multiple controls, ensuring high-quality sound preservation and extensive performance flexibility.
specs:
  - Two independent sampling channels
  - 4 effect styles (blur, synth, glitch, swell)
  - 10 unique presets
  - 2 user save slots
  - Envelope shape control
  - Dimension control
  - Internal lfo
  - Internal envelope generators
  - Digitally-controlled analog drive
  - Tone control
  - Dry mix control
  - Analog dry path
  - Expression pedal input
  - True bypass switching
  - Mono/poly/manual trigger modes
  - +1 octave, -1 octave, +/- 1 octave variations
  - Footswitch triggering
