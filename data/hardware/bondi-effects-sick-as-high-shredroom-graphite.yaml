description: A high-gain edition of the Sick As Overdrive with narrowed gain
  sweep for extra usability and a narrowed mid-range focus for a more
  articulate, aggressive distortion tone.
details: |-
  With help from Earthling Designs , we pushed the gain of this High Shredroom Edition of the Sick As Overdrive almost past sensibility. The sweep of the gain control has been narrowed for usability meaning it does not go completely clean anymore, but that's not really what this pedal is for. The mid-range focus has been narrowed to open up the top and bottom end, making it more articulate and aggressive. Shipping Information

  Download the User Manual - PDF

  We make these pedals to be played, and believe the culture of flipping to be bad for the community and personally insulting. For this reason we are limiting purchases to 1 per customer. We encourage anyone to report flippers and if we catch you flipping you will be permanently banned from our store. No soup for you!
specs: |-
  - All day distortion
  - Dynamic and natural, responsive to your pick attack or volume knob.
  - Internally boosted to 18 volts for maximum headroom and clarity.
  - Toggle switch controls the amount of headroom and character of the drive.
  - Powerful active tonestack, capable of 15dB of boost or cut
  - Soft touch true-bypass switching
  - Current Consumption ~65mA
  - Australia: Ships via Australia Post within 1-3 business days
  - USA: Ships from US warehouse via USPS Priority Mail within 1-5 business days (no international fees)
  - International: Ships from Sydney via DHL Express
  - Note: Some products are stocked exclusively at our Sydney lab but can be shipped to the USA. For these items, international shipping rates will apply.
