details: |-
  The Seven X Five Hundred is a one channel compressor/limiter. It's a FET (field effect transistor) design that incorporates new and exclusive features such as a High Pass Sidechain Filter and a Mix knob for blending dry and wet signal (parallel compression).

  The 7X-500 is Lindell Audio's take on the classic 1176 sound. It can be smooth or it can be a rock'n'roll monster when using ratio 100:1 (all in).
specs: |-
  - FET Style Compressor
  - Variable Mix Control For Precise Parallel Compression
  - 3 Step Switched Attack Times
  - 3 Step Switched Release Times
  - 3 Step Switched High Pass Sidechain Filter. Off, 100Hz, 300Hz
  - 3 Step Switched Ratio 4:1, 12:1, 100:1 (all in)
  - True Hardware Bypass
  - Transformer Balanced Output
  - 20-LED Gain Reduction Meter
