details: |-
  The Ashdown UK-RBM-112T is a UK-built 1x12" bass cabinet created for players who demand full, authoritative tone from a compact and lightweight enclosure. Rated at 300 watts at 8 ohms, it blends modern efficiency with Ashdown's classic tonal philosophy. At its core is a high-quality Sica NEO 12" speaker with an adjustable high-frequency tweeter, allowing players to fine-tune their high end from warm and smooth to crisp and detailed. Constructed from premium plywood, the enclosure balances strength with portability and is finished in Charcoal Tweed with Silver Weave grille cloth and Ashdown's signature double-wing badge.
