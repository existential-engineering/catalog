id: LG4NvlCPX-5EfoG4DeOzH
name: BIGMINI
manufacturer: ibanez
primaryCategory: pedal
categories:
  - tuner
url: https://www.ibanez.com/usa/products/detail/bigmini_01.html
description: Compact chromatic tuner pedal with two display modes (needle and
  strobe), covering A0 to C8 — wide enough for 5-string bass low B. Features
  adjustable calibration, flat-tune mode, and true bypass.
details: |-
  The BIGMINI is a compact chromatic tuner pedal that features two different modes: needle and strobe. It covers a tuning range from A0 (27.5 Hz) to C8 (4186 Hz), enabling detection of the low B on 5-string bass guitars.

  The BIGMINI includes adjustable calibration between 435Hz-445Hz, flat mode functionality for drop tunings, true bypass switching for a clean signal path, and a bright LED display suited for stage performance.
specs: |-
  - Tuning Range: A0 (27.50Hz) - C8 (4186Hz)
  - Calibration: A4 = 435-445 Hz
  - Drop tune: Flat 4 semitones
  - Two tuning modes (needle and strobe)
  - True bypass switching
  - Bright LED display
  - Required Current: 14mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - Input on right side; output on left side
