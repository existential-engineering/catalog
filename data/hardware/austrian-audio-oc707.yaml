description: The OC707 is a handcrafted true condenser vocal microphone designed
  to deliver studio-quality sound on stage and in the studio. Featuring the
  proprietary OCC7 small-diaphragm cardioid capsule, the OC707 captures raw
  detail and rich presence with zero hype.
details: |-
  The OC707 is a handcrafted true condenser vocal microphone using the OCC7 small-diaphragm cardioid capsule. Open Acoustics design for natural, resonance-free sound with excellent rear and off-axis rejection to minimize feedback on stage.

  Linear frequency response and high SPL handling (150 dB) for demanding live performance. Switchable 120 Hz (2nd order) low-cut filter. Ideal for jazz, classical, and bluegrass vocal applications.

  Lightweight industrial ceramic housing. Handcrafted in Vienna.
specs: |-
  - Directional Pattern: Cardioid
  - Frequency Range: 35 Hz – 20 kHz
  - Sensitivity: 10 mV/Pa
  - Equivalent Noise Level: 19 dB SPL (A)
  - Maximum SPL: 150 dB SPL
  - Low-cut filter: 120 Hz (2nd order)
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 2.2 mA)
  - Connector: XLR 3-pin
  - Capsule: OCC7
  - Dimensions: 194 × 53 × 53 mm
  - Weight: 340g
