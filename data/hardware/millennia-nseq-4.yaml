description: The NSEQ-4 is a two-channel fully parametric equalizer with an
  all-discrete J-FET solid state signal path, offering four EQ bands from 20 Hz
  to 20 kHz with a Q range of 0.4 to 4.0. Its input stage is an all-discrete
  true differential Class-A buffer and amplifier with selectable balanced or
  unbalanced input.
details: |-
  The NSEQ-4 is a two-channel parametric equalizer whose signal path is entirely discrete J-FET solid state. Millennia describes its input stage as the first all-discrete, true differential Class-A input buffer and amplifier, with balanced or unbalanced input selected by switch, and the minimalist Dove Topology places only one active stage in the audio path.

  Relative to the NSEQ-2 the unit carries a third generation FSA-03 all-discrete EQ amplifier, an improved output stage and an upgraded power supply, and the same EQ stage is used in the Library of Congress archiving path. True hard-wire bypass engages when the EQ is not selected.

  Four EQ bands cover 20 Hz to 20 kHz center frequency with a Q of 0.4 to 4.0. The low and high ranges are switched between fixed centers and selectable for peak or shelf response, the two mid bands sweep with a 10X range switch, and boost and cut reach 20 dB across 21 detented steps. Noise with all EQ stages in and controls flat is rated at -106 dBu.

  The chassis uses ultra-premium parts throughout, including gold relays, connectors and switches plus OFC audio wiring, and is hand-built in Northern California. An NSEQ-2 can be converted to an NSEQ-4.
specs: |-
  - "Q" Range: Q = 0.4 to 4.0 adjustable on middle ranges, Q = 1.0 fixed on low and high ranges
  - Maximum Output Level: > +28 dBu
  - Maximum Input Level (EQ Flat): +28 dBu
  - Maximum Input Level (EQ Full Boost): +17 dBu
  - Frequency Response: +0 / -3 dB, sub 2 Hz to beyond 300 kHz
  - Frequency Response, Stereo Deviation: +/- 0.5 dB (with Mastering Option)
  - Noise (All EQ Stages In, Controls Flat): -106 dBu
  - Maximum Boost (21 Step Detented): +20 dB (+10 dB with range switch in)
  - Maximum Cut (21 Step Detented): -20 dB (-10 dB with range switch in)
  - Low Range Switch Centers (Peak/Shelf Selectable): 20, 34, 56, 100, 180, 270 Hz
  - Low Mid Sweep: 20 Hz to 220 Hz or 200 Hz to 2.2 kHz, 10X range switch selectable
  - Hi Mid Sweep: 250 Hz to 2.5 kHz or 2.5 kHz to 25 kHz, 10X range switch selectable
  - High Range Switch Centers (Peak/Shelf Selectable): 4.8 k, 5.8 k, 8.0 k, 10 k, 16 k, 21 k
  - THD + Noise (20 Hz to 30 kHz, All EQ Bands Switched In): < 0.009%, typ < 0.003%
  - Common Mode Rejection Ratio (10 Hz to 20 kHz, 100 mV C.M.): > 60 dB, typ > 80 dB
  - Slew Rate (+27 dBu Out): > 50 volts per microsecond
  - Main Hard-wire Bypass Switch For Each Channel: Yes
  - Peak/Shelf Selection On High and Low Range: Yes
  - Hard-wire Bypass Switching On Individual EQ Bands: Yes
  - Input Impedance: 25 kilohms
  - Minimum Output Load Impedance: 50 ohms
  - Recommended Load: > 500 ohms
  - Output Impedance: 5 ohms
  - EQ Amplifiers: Pure Class-A discrete J-FETs
