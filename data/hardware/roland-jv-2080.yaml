description: >-
  The Roland JV-2080 is a 64-voice multitimbral rack sound module with an 8 MB sample ROM, eight expansion board slots, and five onboard effects processors. It became one of the most widely used studio modules of the late 1990s thanks to its versatile sound library spanning acoustic instruments, orchestral textures, and electronic timbres.
details: |-
  Released in 1997, the JV-2080 represented the pinnacle of Roland's JV-series sound modules. With 64-voice polyphony and 16-part multitimbral operation, it could serve as the sole sound source for an entire production, handling everything from drum kits and bass lines to lush pads and realistic acoustic instruments.

  The eight SR-JV80 expansion board slots were a major selling point, allowing users to dramatically expand the 8 MB base ROM with specialized sound libraries covering vintage synths, orchestral instruments, world sounds, techno textures, and more. This modular approach meant the JV-2080 could be tailored to virtually any genre or production style.

  The synthesis engine provides a multimode TVF filter with lowpass, bandpass, highpass, and peak modes, along with dual LFOs offering a wide range of waveforms including chaos and random shapes. Five simultaneous effects processors handle reverb, delay, chorus, flanging, and panning, providing polished results without external processing. The combination of a massive preset library, deep editability, and generous expansion options made it a studio workhorse for producers like Todd Terry, Mike Oldfield, ATB, and LTJ Bukem.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Sample ROM: 8 MB (expandable via 8 SR-JV80 expansion board slots)
  - Filter: TVF multimode (lowpass, bandpass, highpass, peak) with cutoff, resonance, key follow
  - LFO: 2 per voice (sine, saw, square, triangle, trapezoid, sample & hold, random, chaos)
  - Envelopes: TVA ADSR with key follow
  - Effects: 5 processors (reverb, delay, chorus, flange, panning)
  - Memory: 128 user patches, 640 presets, 2 user rhythm kits, 10 preset rhythm kits, 32 user performances, 64 preset performances
  - Keyboard: None (rack module)
  - Control: MIDI (16 channels)
