description: The ADAM T7V is a two-way studio monitor designed for vertical use
  in a nearfield application and perfectly suited for use in small control
  rooms.
details: |-
  The ADAM Audio T7V is a two-way active studio monitor designed for vertical use in a nearfield application. It pairs a 7" polypropylene woofer with a U-ART (Accelerated Ribbon Tweeter) handcrafted from the same family as ADAM's flagship S Series, delivering detailed high-frequency response up to 25 kHz and bass extension down to 39 Hz.

  The U-ART tweeter is mounted in an HPS (High-frequency Propagation System) waveguide derived from the S Series, producing a wide and even dispersion pattern that broadens the usable sweet spot in small control rooms. Its 4:1 velocity transform ratio drives a low-mass 0.17 g diaphragm for precise transient response.

  Each cabinet is bi-amplified with a 50 W RMS PWM amplifier on the woofer and a 20 W RMS PWM amplifier on the tweeter, yielding a maximum SPL of at least 110 dB per pair at 1 m. A rear-firing bass reflex port and sturdy metal backplate house the balanced XLR and unbalanced RCA inputs.

  Backplate controls include adjustable input sensitivity (-10 to +4 dB) and two shelving EQs: a high shelf above 5 kHz and a low shelf below 300 Hz, each switchable between -2, 0, and +2 dB. The crossover is set at 2.6 kHz, with THD held to 0.5% above 80 Hz.

  Intended for music production, video post-production, and broadcast work in small rooms, the T7V brings ADAM's tweeter and waveguide design philosophy into an affordable nearfield package. Each monitor weighs 7.1 kg (15.7 lb) and measures 347 x 210 x 293 mm (H x W x D).
specs: |-
  - 2-way active nearfield studio monitor (vertical orientation)
  - 7" polypropylene woofer with 1" voice coil
  - U-ART tweeter, 1.9" (4 sq in / 2420 sq mm), 0.17 g diaphragm, 4:1 velocity transform ratio
  - HPS (High-frequency Propagation System) waveguide derived from S Series
  - Frequency response: 39 Hz - 25 kHz (-6 dB)
  - Crossover frequency: 2.6 kHz
  - THD (>80 Hz): 0.5%
  - Maximum SPL per pair at 1 m: >=110 dB
  - Woofer amplifier: 50 W RMS, PWM
  - Tweeter amplifier: 20 W RMS, PWM
  - Total RMS amplifier power: 70 W
  - Maximum power consumption: 132 W
  - Inputs: balanced XLR and unbalanced RCA
  - Input impedance: 10 kOhm (XLR), 20 kOhm (RCA)
  - Input sensitivity: -10 to +4 dB
  - High shelf EQ (>5 kHz): -2 dB / 0 dB / +2 dB
  - Low shelf EQ (<300 Hz): -2 dB / 0 dB / +2 dB
  - Rear-firing bass reflex port
  - Metal backplate
  - Dimensions (H x W x D): 347 x 210 x 293 mm (13.7 x 8.3 x 11.5 in)
  - Weight: 7.1 kg (15.7 lb)
  - Warranty: 5 years (2 years standard + 3 years optional with registration)
