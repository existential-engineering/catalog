description: The ADAM T7V is a two-way studio monitor designed for vertical use in a nearfield application and perfectly suited for use in small control rooms.
details: |-
  The T7V is a two-way studio monitor designed for vertical use in a nearfield application. It features a 7" woofer that provides bass extension down to 39 Hz, while the U-ART tweeter's diaphragm provides pristine and extended high-frequency response up to 25 kHz, virtually unheard of in monitors in this price range.

  The U-ART tweeter is fitted to a precision waveguide with the same dispersion-control attributes as the High Frequency Propagation (HPS) waveguide used in ADAM Audio's flagship S Series studio monitors. The waveguide's highly uniform dispersion of high frequencies provides an incredibly wide sweet spot that frees you from being glued to a rigid mix position while working.

  On the rear side of the T7V's beveled cabinet, a rear-firing bass reflex port joins a sturdy metal backplate that's home to the analog input connections. The U-ART tweeter is powered by a 20 W Class-D amp, while a 50 W Class-D amp serves the woofer. These powerhouses yield a maximum of 110 dB SPL per pair.

  A rear XLR connector and an RCA jack accept balanced nominal input levels of +4 dBu and unbalanced nominal input levels of -10 dBV, with an associated two-way switch selecting which connector the input signal is taken from. The T-Series monitors adjust automatically to AC mains voltages from 100 to 240 V at 50/60 Hz.

  The wide frequency response, high dynamic range, excellent transient response, wide sweet spot and small footprint make the T7V suited for use in small control rooms for music production, video post-production and broadcast production.
specs: |-
  - Two-way active nearfield studio monitor, designed for vertical use
  - Frequency response: 39 Hz to 25 kHz (-6 dB)
  - Crossover frequency: 2.6 kHz
  - Max. SPL per pair at 1 m: greater than or equal to 110 dB
  - THD > 80 Hz: 0.5 %
  - Woofer: 7" basket diameter, 1" voice coil, polypropylene cone
  - Woofer amplifier: PWM, 50 W RMS
  - Tweeter: U-ART, HPS waveguide, 1.9" (48 mm) equivalent diaphragm diameter
  - Tweeter diaphragm area: 4 inch² (2420 mm²), diaphragm weight 0.17 g
  - Tweeter velocity transform ratio: 4 to 1
  - Tweeter amplifier: PWM, 20 W RMS
  - Analog audio input connectors: XLR / RCA
  - Input impedance: 10 kOhm / 20 kOhm
  - Input sensitivity: -10 to +4 dB
  - Gain control
  - High shelf EQ > 5 kHz: -2 dB, 0 dB, +2 dB
  - Low shelf EQ < 300 Hz: -2 dB, 0 dB, +2 dB
  - Rear control panel
  - AC mains input: 100 to 240 VAC, 50/60 Hz
  - Max. power consumption: 132 W
  - Dimensions (H x W x D): 13.7" x 8.3" x 11.5" (347 mm x 210 mm x 293 mm)
  - Weight: 15.7 lbs (7.1 kg)
  - Delivery contents: power cord, Quick Start Guide
  - Warranty: 5 years (2 years standard plus 3 years optional with registration)
