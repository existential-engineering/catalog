description: UK-built, ultra-compact 500-watt bass head finished in striking Ice
  Blue. Lightweight and powerful, it features a versatile 5-band EQ, classic
  Pre-Shape tone contour, FX Loop, DI Output, and auto-voltage operation for
  worldwide gigging. A clean, punchy, no-nonsense amp built for players who want
  reliability and great tone in the smallest possible format.
details: |-
  The Ashdown UK-OBM-500 is the latest step forward in the OriginAL EVO lineage, hand-built in the UK and finished in striking Ice Blue. Delivering 500 watts of clean, dependable power, this compact head is designed for bassists who want a no-nonsense amplifier that performs confidently in any setting while remaining exceptionally lightweight and portable. Tone shaping is handled by a responsive 5-band EQ, with the familiar Pre-Shape switch providing a refined contour that enhances low-end punch, clarity, and presence. A clean DI output serves front-of-house and recording applications, while the FX Loop allows seamless integration of external pedals and processors. Auto-voltage operation enables safe and consistent use worldwide.
specs: |-
  - Power output: 500 Watts
  - Power requirements: 115-230 Volts
  - Impedance: minimum 4 Ohms
  - Speaker outputs: 2 x jack outputs
  - Frequency response: -3dB @ 22Hz and 25kHz
  - Signal to noise: better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Distortion: less than 0.5% THD
  - H x W x D: 89 x 220 x 209 mm
  - Net weight: 1.8 kg
