details: |-
  Erica Synths Black System III is a self-contained and performance oriented eurorack system, built from a well-considered collection of the best sounding and most versatile Black Series modules. It is aimed at experienced musicians and at eurorack enthusiasts looking for a source of inspiration.

  The system comes in an Erica Synths 2x104HP aluminium travel case with lid, with a universal PSU included, together with 30 patch cables of different length.

  The module complement covers oscillators (Black Wavetable VCO and two Black VCO2), filtering (Black Multimode VCF, Black LPG), envelopes and level control (Black EG2, two Black Quad VCA2, since you can not have too many VCAs), modulation and control (Black Modulator V2, Black Joystick 2, Black CV Tools, Black Sequencer), routing and output (Black Mixer/Splitter V2, Black Output V2) and effects (Black Stereo Delay, Black Hole DSP 2).

  Erica Synths Black Series modules are recognized for their build quality, which makes this instrument a lasting investment. Specifications and appearance are subject to change without notice for improvement.
