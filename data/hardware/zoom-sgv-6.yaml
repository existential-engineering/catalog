description: The SGV-6 is a highly directional shotgun vocal microphone that uses three mic elements with special processing for super cardioid pickup, isolating a single voice from other instruments on stage and from ambient noise. It is the companion microphone for the V6 and V3 vocal processors, which modulate and harmonise more accurately from an instrument-free voice signal.
details: |-
  The SGV-6 is a highly directional shotgun vocal microphone built to isolate a single voice on a loud stage. It suppresses sounds from other instruments and ambient noise that would otherwise leak into a traditional microphone's signal.

  Rather than one capsule, the SGV-6 uses three microphone elements with special processing so that only the voice in front of it is picked up, giving a super cardioid directionality.

  That isolation is what makes it the companion microphone for Zoom's vocal processors. With a clean, instrument-free voice signal, the V6 and V3 can modulate and harmonise the voice with far more accuracy than they could from a bleeding stage mic.

  Each of the three mic units has a sensitivity of -46 dB/Pa at 1 kHz, and the microphone accepts a maximum sound pressure input of 140 dB SPL, so it tolerates a singer working close in to the grille.
specs: |-
  - Directionality: super cardioid (3 directional mic units)
  - Sensitivity: -46 dB/Pa at 1 kHz (each mic unit)
  - Maximum sound pressure input: 140 dB SPL
  - Three microphone elements with special processing for voice isolation
  - Designed as the companion vocal microphone for the Zoom V6 and V3 vocal processors
