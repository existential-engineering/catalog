description: A fuzz module based on the classic Fuzz Face circuit with silicon
  transistors, adapted with a lower filter cut-off to be useful on sources
  beyond guitar. It is compatible with the Colour format.
details: |-
  Let's talk about Fuzz . It is here to ruin your guitars, cheapen your bass, and forgive your drums. You don't need it, you crave it. It's bad for you. No one who loves you would offer you fuzz. And yet we make it, and we love you, and we just added it to your cart. You're welcome. The FF1 is based on the original Fuzz Face circuit, with silicon transistors like any modern Fuzz Face interpretation. Not just for guitars anymore, the FF1 breaks from the pedal design by lowering the filter cut-off to be more useful on a variety of sources. At lower settings it can be quite polite, but it's capable of that gritty, fuzzy destruction we all know and love. FEATURES

  Samples

  Resources
specs: |-
  - On-board regulators for operating at actual 9v pedal voltage
  - The classic silicon fuzz sound
  - Compatible with the Colour format
  - Full, step-by-step assembly instructions and support
  - FF1 Assembly Guide
  - FF1 Schematic (PDF)
