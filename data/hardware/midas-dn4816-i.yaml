name: DN4816-I
manufacturer: midas
primaryCategory: audio-interface
categories:
  - rack-mount
url: "https://www.midasconsoles.com/en/products/0606-ADC"
description: The DN4816-I is a 16-channel analogue line input I/O box for the
  Midas StageConnect ecosystem. It provides 16 balanced line level combo inputs
  for connecting wireless receivers or other external audio players to monitor
  or FOH consoles. Devices can be daisy-chained over a single XLR cable for
  multi-channel audio transmission, with automatic channel negotiation across
  the StageConnect ecosystem supporting 32 channels of audio at 24-bit/48kHz
  with below 0.05 ms of latency.
details: |-
  The DN4816-I is the perfect solution for connecting additional line inputs to your monitor or FOH console. It provides 16 analogue inputs to connect wireless receivers or other external audio players, presented on 16 balanced line level combo input connectors. The DN4816-I is part of the Midas StageConnect ecosystem, which uses a single XLR cable for multi-channel audio transmission. Devices can be daisy-chained with automatic channel negotiation, supporting up to 32 channels of audio at 24-bit/48 kHz with below 0.05 ms of latency. Power is provided either via DC or via StageConnect (18W available via StageConnect). A 110 Ohm DMX-Cable is required for optimal StageConnect performance.
specs: |-
  - Analogue Inputs: 16 balanced line level combo inputs
  - Ecosystem: StageConnect (32 channels total)
  - Bit Depth: 24-bit
  - Sample Rate: 48 kHz
  - Latency: below 0.05 ms
  - Power: DC or via StageConnect (18W available via StageConnect)
  - Cable: 110 Ohm DMX-Cable required for StageConnect
  - Daisy-Chain: Single XLR cable with automatic channel negotiation
