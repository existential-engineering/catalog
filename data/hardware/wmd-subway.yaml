description: An 8 input, 1 output scanning crossfader Eurorack module for both
  audio and control voltage signals, allowing smooth fades between multiple
  inputs via knob or external CV.
details: |-
  Introducing Subway, an 8 input, 1 output scanning crossfader in 6 HP. Transit for your signals! 8 inputs and correlating on/off switches let you decide how many signals are a part of the line. Then, smoothly fade from one signal to the next using the knob or an external CV source. Subway is compatible with both audio and control voltage so it can be used for creating morphing waveshapes out of wavetables, complex modulation from multiple CV sources, as a simple waveshape selector for oscillators with multiple outs, and lots more. Find new sonic territories by combining multiple sounds and cycling through them at audio rate. Meticulously route CV to create preset destinations throughout a set. The journey is yours, let Subway take you there. CONTROLS

  Scan Knob - Master control over which input is going into the output. Knob becomes offset when CV is applied to Scan CV input. Enable Switches - Control which input is active. Off LED means the input is removed from the output selection. Dim LED means the input is active, but not yet selected. Bright LED means the input is currently being sent to the output. Curves: Subway has three different curves if you hold buttons 1-3 on startup and then release. Button 1 sets linear, Button 2 sets exponential, and Button 3 sets equal power.
