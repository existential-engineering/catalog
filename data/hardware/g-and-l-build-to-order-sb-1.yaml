details: |-
  When Leo Fender launched the G&L SB•1 bass in 1982, he packed his latest innovations in pickup and bridge design into a straightforward, hard-working bass. At that time the SB•1 had an MFD single coil pickup and no pickguard, which was a departure from the classic single-pickup passive bass. By 1985, however, the SB•1 had taken the form it has today, with an MFD split-coil humbucking pickup and pickguard. In some way, the SB•1 set the stage for several G&L models to come: Leo took a classic design and applied his core improvements, in this case the MFD pickup and Saddle Lock bridge.

  The 2024 SB•1 starts with a familiar shape, though subtle modifications to its sculpting make it more sleek and balanced. Strapped on, it immediately feels at home and more comfortable than expected. The 1 5/8" nut-width, C-shaped neck falls immediately to hand, with a comfortable 9 1/2" radius and 21 Jescar 57110 medium-jumbo nickel-silver frets ready to deliver silky playability.

  Once the SB•1 has nestled into the player's comfort zone, it shows just how far Leo evolved the time honored simplicity of a single split-coil pickup. The Magnetic Field Design interpretation of the split-coil was created by Leo to give more gusto without losing detail and finesse. The SB•1 also features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  The bottom line: the SB•1 brings the magic of Leo's own reinterpretation of a classic design, delivering the tone and feel expected in a "Latter Day Leo" instrument.

  Made in Leo Fender's historic G&L facility on Fender Avenue in Fullerton, California.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
