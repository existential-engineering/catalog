description: Stereo 2-Way/Mono 3-Way Crossover with Linkwitz-Riley 24dB/octave
  filters, independent output gain controls, and TRS balanced connectors.
details: |-
  The dbx 223 is a professional-grade dual channel crossover designed to enhance speaker performance in PA systems. It utilizes precision filters to separate audio signals and direct specific frequencies to individual loudspeaker drivers, allowing amplifiers to focus power on usable signals while reducing distortion.

  The unit features Linkwitz-Riley 24dB per octave filters, independent output gain controls, output phase inversion, a 40 Hz low cut filter, and optional mono summing of low frequency outputs. A mode switch enables stereo 2-way or mono 3-way operation.

  Built with professional-grade components including solid click controls and high-quality 1/4" TRS connectors, the 223 delivers CSA NRTL/C approval and CE compliance, backed by a 2-year parts and labor warranty.
specs: |-
  - Input Connectors: 1/4" TRS
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+21 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >50 dB at 1 kHz
  - Output Connectors: 1/4" TRS
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >114 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range: 45–960 Hz or 450 Hz–9.6 kHz (×10)
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100/120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 3.7 lbs (1.7 kg)
