details: |-
  The VSX 12.2BP is a compact dual 12" 3,200-Watt passive band pass subwoofer ideally suited for a broad range of speech and music sound reinforcement applications in both fixed, portable, and touring audio systems. Features twin 12" low frequency drivers with extended low frequency response to well below 40 Hz, a low distortion dual port band pass enclosure for maximum efficiency, integral M10 rigging points, optional VTH pole mount blanking plate, Integrip handles, internally braced plywood construction with a rugged powder-coated perforated steel mesh grille, and industry-standard twist-locking speaker and barrier strip connectors.
specs: |-
  - powerHandling: {'continuous': '800 W', 'peak': '3,200 W'}
  - drivers: Twin 12" low frequency drivers
  - enclosureType: Dual port band pass
  - frequencyResponse: below 40 Hz (extended low frequency)
  - rigging: Integral M10 rigging points
  - mounting: Blanking plate for optional VTH pole mount
  - cabinet: Internally braced plywood
  - finish: Hard wearing semi-matte black paint
  - grille: Rugged powder-coated perforated steel mesh with reticulated foam backing
