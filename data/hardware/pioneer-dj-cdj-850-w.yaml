details: |-
  DJ multi player with disc drive

  The CDJ-850 builds on the DNA of its predecessor, the CDJ-800MK2 and adds some serious enhancements. With its full-sized jog wheels, large screen and pro-DJ features, it feels and functions like a CDJ-900NXS or CDJ-2000NXS – without the top-flight price tag. The CDJ-850 is rekordbox-ready or you can use the USB-HID interface to control the DJ software of your choice.
