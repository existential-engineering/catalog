details: |-
  The DW 3000 Series Hardware has been completely redesigned from the ground up. This versatile, medium-weight snare stand with double-braced legs is well-suited for any playing situation. Lightweight enough for a Bop kit, but sturdy enough for any Rock gig, it's loaded with a host of player-friendly features including Glide Tilter basket adjustment, Reso Pocket crutch tips and more.

  Toothless Tilter: give your snare angles and infinite adjustment options. Glide Tilter basket adjustment lets you dial in the exact snare basket angle for your grip and style of play.

  Scaled-Down Footprint: fits into any setup, while maintaining player ergonomics. Hinged memory locks set up your stand at the right height, every time.

  The 3000 Series is engineered for drummers of all levels, with sturdy double-braced hardware providing stability and durability during intense performances, smooth memory locks for seamless adjustment, and a sleek design that complements any drum kit.
