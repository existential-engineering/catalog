id: VUVgTZHXU_eO6CIjzB6wW
name: TYPE 05 MK2
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-05-mk2
description: A compact 2-way DSP-enabled active studio monitor that fits small
  spaces while delivering high clarity, the TYPE 05 MK2 is ideal for home
  studios, broadcast and video-editing suites, and ceiling-level Atmos duties.
details: |-
  The TYPE 05 MK2 combines a 5-inch honeycomb woofer with a hand-built HEDD Air Motion Transformer tweeter, delivering exceptional clarity and control across the entire frequency range in a footprint small enough for confined rooms. It offers better resolution than most industry standards while bringing professional monitoring into home studios and editing suites.

  At the heart of the MK2 range is a custom high-resolution 96 kHz / 32-bit AD/DA converter paired with a high-end 32-bit SHARC processor. This DSP architecture drives the HEDD Lineariser zero-phase filter for an expanded stereo image and spatial depth, along with desktop and shelving filters, GDC, and LFE modes that let the monitor adapt to its acoustic environment through the free HEDD CTRL software.

  A standout feature is the Closed or Ported (CoP) functionality, which uses a removable POM plug to switch between a sealed cabinet for bass precision and detailed transients and a ported cabinet for increased low-frequency extension. The monitor also works with HEDD BASS 08 subwoofers for complete linear-phase satellite-subwoofer configurations.

  Assembled in Berlin from premium components, each unit is individually tested before shipment and is well suited as a ceiling-level element in smaller Atmos installations.
specs: |-
  - Configuration: 2-way active nearfield monitor
  - Woofer: 5" honeycomb (1.5" voice coil)
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequency: 2,500 Hz
  - Frequency response: 45 Hz - 40 kHz (LFE mode: 38 Hz - 40 kHz)
  - Maximum SPL: 112 dB per pair at 1 m
  - Amplification: 2 x 100 W ICEpower Class D (85-264 V)
  - DSP: 96 kHz / 32-bit AD/DA converter with 32-bit SHARC processor
  - Features: HEDD Lineariser, CoP, GDC, LFE, desktop and shelf filters
  - Dimensions: 308 x 180 x 245 mm
  - Weight: 6.4 kg per unit
