  effect-order switching, all-wet or wet/dry output and momentary or latching
  pitch.
details: |-
  The Octa Psi Transfigurating Fuzz puts a polyphonic pitch shifter, an octave generator and an analog transistor fuzz in one pedal. The fuzz side is all analog, built on stacked gain stages leading to hard clipping, while the pitch side runs on digital processing.

  The pitch shifter is polyphonic with a range of plus or minus two octaves and covers nearly every harmonic interval. Three modes, Up, Down and Dual, reach power chords, stacked fourths and diminished chords, and a momentary mode suits dive bombs and multi-octave bends. Ramp speed is adjustable by holding Octave and turning Blend, which behaves like an onboard expression pedal. Holding the Fuzz switch moves the octave and pitch section between latching and momentary.

  The fuzz has a three-way tone switch with Scoop, Punch and Psi settings that set the bass response. Holding both footswitches swaps the order of the fuzz and pitch sections instantly, and double-tapping the Blend control switches the output between all wet and a wet/dry blend.

  The pedal is housed in an angled aluminium enclosure, offers true bypass or silent buffered bypass as the player prefers, and is designed and manufactured in the USA. It won FretBuzz Gear of the Year 2024.
specs: |-
  - Pedal type: octave fuzz and pitch shifter
  - Effects: polyphonic pitch shifter, octave, fuzz, distortion
  - Analog fuzz circuit with digital DSP pitch processing
  - Polyphonic pitch shifter with a plus or minus two octave range
  - Three pitch modes: Up, Dual and Down
  - Momentary or latching octave and pitch, set by holding the Fuzz switch
  - Adjustable pitch ramp speed by holding Octave and turning Blend
  - Three-way fuzz tone switch: Scoop, Punch or Psi
  - Effect-order switching between fuzz and pitch by holding both footswitches
  - All-wet or wet/dry output, switched by double-tapping Blend
  - Inputs and outputs: TS 1/4 inch jacks
  - Bypass: true bypass or silent buffered bypass, user selectable
  - Power: 9 to 18V DC, 150 mA, high current supply sold separately, no battery
  - Dimensions: height 2.7 in, width 3.9 in, depth 5 in
  - Angled aluminium enclosure
  - Designed and manufactured in the USA
