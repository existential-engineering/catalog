description: The GoAux 3 is a portable nearfield monitor pair pairing a 3-inch
  glass aramid woofer with a 1-inch soft textile dome tweeter in a 60 W RMS
  bi-amplified two-way design. It takes RCA, 1/8-inch aux and Bluetooth inputs
  and ships with adjustable stands and a carrying bag.
details: |-
  The KRK GoAux 3 portable nearfield monitors are designed to provide KRK sound quality in a mobile-friendly size. The pair comes with a nylon carrying bag that holds both monitors, the included monitor stands and any extra cables, and the stands are adjustable for monitoring position and angle.

  The GoAux 3 monitors pair a 3-inch glass aramid woofer with a 1-inch soft textile dome tweeter in a 60 W RMS (total system power) bi-amplified two-way design. The rear-ported ABS cabinets supply bass extension for a portable speaker. With the power amps located in one speaker's housing and the second speaker powered through an included speaker-level connection from the first, the pair only needs a single AC outlet for operation.

  Built-in LF and HF EQ let you adjust the monitors' response to the room and personal preference. Along with the 1/8-inch aux and RCA stereo inputs, Bluetooth lets you connect wirelessly to a smartphone, computer or other Bluetooth-capable audio device. For silent monitoring, the front panel 1/8-inch stereo headphone output automatically mutes the speakers.
specs: |-
  - System inputs: Bluetooth, RCA, 1/8-inch aux
  - System outputs: 1/8-inch stereo headphone jack with auto speaker mute
  - Bluetooth: version 5.0 and older compatibility
  - Low-frequency transducer: 3-inch woven glass aramid
  - High-frequency transducer: 1-inch soft textile dome
  - Crossover frequency: 2.5 kHz
  - Power output: bi-amplified Class D, 60 W RMS total system power, 22 W RMS for each woofer, 8 W RMS for each tweeter
  - Maximum continuous SPL: 95.5 dB SPL
  - System peak SPL: 99 dB SPL
  - Maximum system SPL, momentary peak: 105 dB SPL
  - Frequency response (-3 dB): 65 Hz to 20 kHz
  - Frequency range (-10 dB): 60 Hz to 22 kHz
  - Signal to noise ratio: 95 dB (A-weighted) at rated output level
  - Coverage (horizontal x vertical): 120 degrees x 60 degrees
  - AC input voltage: 100 to 240 V, 50/60 Hz
  - AC power consumption: 5.57 W idle, 60 W max, 0.475 W standby
  - Enclosure type: rear ported
  - Enclosure material: ABS, black textured finish
  - Dimensions (H x W x D): 6.8 in x 4.37 in x 4.72 in (172 mm x 111 mm x 120 mm)
  - Weight: 6.94 lb (3.15 kg) including both speakers, stands, carrying bag and accessories
