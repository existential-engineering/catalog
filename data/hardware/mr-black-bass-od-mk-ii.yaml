url: https://www.mrblackpedals.com/products/bass-od-mk-ii
description: An overdrive and preamp built for bass, with a two-band active EQ
  tuned for bass guitar and a natural, touch-sensitive grind.
details: |-
  The Bass OD is built to be the best overdrive and preamp for bass. Its
  two-band active EQ is specifically tuned for bass guitar, delivering natural,
  touch-sensitive grind and responding well to both active and passive
  instruments.

  An internal split-rail power supply gives it generous headroom, clarity, and
  feel. The Mk. II revision adds increased transient response and a faster feel,
  wrapped in a high-gloss chrome powder-coat with Mr. Black's proprietary Deep
  Black finish.

  The Bass OD Mk. II is a Jack Deville original design, built to order with a one
  to five business day build time.
specs: |-
  - Overdrive and preamp voiced for bass guitar
  - Two-band active EQ tuned for bass
  - Touch-sensitive response with active and passive instruments
  - Internal split-rail power supply for high headroom
  - Mk. II: increased transient response and faster feel
  - High-gloss chrome powder-coat with Deep Black finish
