description: The dbx DJDI is a 2-channel passive direct box designed
  specifically for DJ and line-level sources, converting unbalanced signals to
  balanced XLR outputs across a wide range of signal levels. A continuously
  variable input attenuator, transformer isolation, and ground lift switch
  ensure clean, interference-free output.
details: |-
  The dbx DJDI is a dual-channel passive direct box purpose-built for DJ applications, accommodating a wide range of signal levels from DJ mixers, media players, and consumer sources. Its passive circuit design requires no power, delivering clean, quiet, and uncolored operation reliably in any situation.

  Each channel accepts unbalanced 1/4" TS input (RF filtered) and provides a transformer-isolated, balanced XLR output. A continuously variable input attenuator on each channel allows precise level matching regardless of source. A ground lift switch helps eliminate hum caused by ground loops in complex DJ setups.

  The passive design and transformer isolation ensure the DJDI performs reliably across studio, tour, and portable applications, making it an essential tool for live DJ setups, broadcast, and broadcast-quality recording.
specs: |-
  - Circuit: Passive
  - Input Channels: 2
  - Input Connectors: 1/4" TS (Tip Hot, Sleeve Ground)
  - Input Type: Unbalanced, RF filtered
  - Input Impedance: 50 kΩ
  - Output Channels: 2
  - Output Connectors: Male XLR, Balanced (Pin 2 hot)
  - Output Impedance: 600 Ω
  - Noise Level: -104 dBu (22 Hz–22 kHz, input shorted)
  - THD+N (10 Hz–22 kHz): 0.23% typical @ +4 dBu, 1 kHz
  - Insertion Loss: 21 dB typical
