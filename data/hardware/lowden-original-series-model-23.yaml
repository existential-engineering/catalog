details: |-
  The Lowden Original Series 23 model is celebrated for its sweet, warm, and clear tones, offering a deep resonance and complex sound that feels like a mellower take on the 22. In the 'O' jumbo size, it delivers rich, resonant tones with surprising lightness, making it a joy to play. For those seeking a punchier and more focused sound, the 'F' mid-sized version provides excellent clarity and projection. The 'S' small-bodied version, George Lowden's first steel-string design, features AAA walnut back and sides paired with a cedar top, producing a warm, loud, and well-balanced tone. The soundbox geometry is fine-tuned to enhance bass while maintaining the naturally strong treble, resulting in a beautifully balanced instrument for nuanced playing. The Original Series carries signature Lowden appointments including a seven-piece wood rosette and five-piece neck, rosewood headstock facing and ebony fingerboard. Custom options are available including cutaway, Fan Fret and neck profile choices.
specs: |-
  - Walnut back and sides
  - Red Cedar top
  - AAA-grade tonewoods
  - Seven-piece wood rosette
  - Five-piece neck
  - Rosewood headstock facing
  - Ebony fingerboard
  - Available in O, F, S and WL body shapes
  - Hardshell case included
