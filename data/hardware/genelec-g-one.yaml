description: "Our most compact Home Audio loudspeaker, the G One combines huge
  performance with beautiful aesthetics. Ideal for smaller spaces, it's perfect
  for computer sound, music playback or home theatre."
details: |-
  The G One is Genelec's most compact Home Audio active loudspeaker, designed to bring true reference-grade sound into smaller living spaces such as desks, bookshelves, and home theatre setups. Housed in an eco-friendly recycled die-cast aluminium Minimum Diffraction Enclosure (MDE), it pairs a 76 mm bass driver with a 19 mm metal-dome tweeter, each driven by its own 25 W Class D amplifier and crossed over at 3 kHz. The rear-ported reflex design squeezes extended low-frequency response from a cabinet that stands just 195 mm tall with its supplied Iso-Pod stand.

  Despite its small footprint, the G One delivers a frequency response of 67 Hz - 25 kHz (-6 dB) and short-term peak levels of 96 dB SPL at one metre. The integrated Directivity Control Waveguide (DCW) produces a wide, even dispersion pattern that keeps the imaging stable across typical living-room listening positions, while the active design eliminates the need for an external power amplifier and the cable runs it would require.

  Room-tuning controls on the rear panel - bass tilt, treble tilt, and bass roll-off DIP switches - let the listener compensate for placement against walls, shelves, or in corners without external processing. A single unbalanced RCA input accepts a line-level signal from a TV, streamer, turntable preamp, computer DAC, or AV receiver, and the supplied rubber Iso-Pod stand decouples the cabinet from the surface and tilts the tweeter toward the listener.

  Genelec's Intelligent Signal Sensing (ISS) circuitry drops idle power consumption below 0.5 W when no signal is present, and the recycled-aluminium enclosure is finished without paints or solvents, keeping the long-term environmental impact in line with Genelec's broader sustainability practices. Versatile threaded mounting points support a wide range of wall, ceiling, and stand accessories for both home and light commercial installations.

  Offered in matte black, white, and a raw recycled-aluminium finish, the G One is positioned as a beautiful, low-profile speaker for music playback, computer audio, and stereo or surround home cinema where a larger monitor would be impractical but uncompromised sound is still required.
specs: |-
  - Frequency response: 67 Hz - 25 kHz (-6 dB)
  - Frequency response: 74 Hz - 20 kHz (±2.5 dB)
  - Short term max SPL: 96 dB
  - Long term max SPL: ≥91 dB
  - Self-generated noise: ≤5 dB SPL
  - Harmonic distortion 70-400 Hz: ≤3%
  - Harmonic distortion >400 Hz: ≤0.5%
  - Crossover frequency: 3000 Hz
  - Bass driver: 76 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 25 W Class D
  - Treble amplifier: 25 W Class D
  - Enclosure: Die-cast aluminium, reflex port
  - Signal input: 1 x RCA female, 7 kOhm
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤5 W
  - Power consumption (full output): 30 W
  - Height: 195 mm (with Iso-Pod)
  - Height: 181 mm (without Iso-Pod)
  - Width: 121 mm
  - Depth: 115 mm
  - Weight: 1.7 kg (3.7 lb)
