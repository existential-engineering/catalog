description: A tribute to the classic MS-20 filter, combining a 2-pole low pass
  and 1-pole high pass filter with a crossfader for complex filtering. It
  features non-linear feedback and can self-oscillate as a sound source.
details: |-
  SALLEN KEY is our tribute of the legendary MS-20 filter. We've tried our best to honor this unique and iconic filter. It's composed of a 2 Poles Low Pass and a 1 Pole High Pass. Unlike the original we add a crossader allowing you to blend the Low Pass and High Pass filters to create complex filtering. What make this filter special it is non linear feedback path. This design avoid the filter to clipping when self-oscillating, but also give it is unique color. We've choose to integrate LED's instead of diodes. It not only slighlty change the color of the resonance but also give nice feeback information about the drive of the resonance path. Since SALLEN KEY can self-oscillate it can be use as sound source. Tracking is accurate across 6 octaves.
