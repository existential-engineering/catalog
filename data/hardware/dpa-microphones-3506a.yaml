details: |-
  DPA's wide and versatile pencil mic series is legendary in the high-end recording and film production industry. Delivering clean, accurate sound, the mics in this series are used by professionals, who understand sound and insist on only using the best.

  We have collected our award-winning recording microphones in specialized stereo kits that contain the mics and accessories you need to capture fantastic sound no matter what your need. All kits are matched within either ±0.5 dB or ±1 dB depending on the kit you choose.

  This is a complete stereo kit with two carefully factory-matched phantom powered 4006A Omnidirectional Condenser Microphones. The kit includes mics, windscreens, boom, holders, clips, and much more.

  Even though the standard tolerances on our recording mics are already extremely low, a stereo match is even closer. These specially selected 4006A Omnidirectional Microphones are matched within ±0.5 dB on both frequency response and sensitivity.

  For reference stereo recording, there is no better choice than a 4006A Omnidirectional Microphone. These omnidirectional condenser microphones are linear and true in character. They come as a hand-matched pair that offers the truest capture of stereo sound available.

  The 4006 Omnidirectional Microphone Capsule offers total transparency in any recording situation. It picks up incredible detail and depth of sound. The definition of its high-frequency characteristics across a wide range of instruments is impressive. It offers natural sound, high sensitivity, low noise-floor and linear frequency response from 10 to 20 kHz (±2 dB).

  The 4006A Omnidirectional Microphone is a flexible solution. Engineers, broadcasters and musicians alike can achieve clean, natural and precise sound reproduction. This mic is ideal for A-B stereo pairs for symphonic concert hall recordings. It also excels on vocals, for close-miking all types of instruments and as an outdoor interview microphone.

  A selection of accessories is available, including acoustic pressure equalizers, a nose cone and interchangeable protection grids. These accessories can acoustically transform the mic. By changing grids, it is possible to gain several unique frequency responses and directional characteristics from the mic. Furthermore, these accessories will not produce any phase shift, noise or distortion that would otherwise be introduced by an electrical filter.
specs: |-
  - Kit contents: 2× factory-matched 4006A Omnidirectional Microphones plus windscreens, boom, holders, clips and more
  - Matching tolerance (frequency response and sensitivity): ±0.5 dB
  - Phase deviation for kit: < 5°
  - Per-mic directional pattern: Omnidirectional
  - Per-mic principle of operation: Pressure
  - Per-mic cartridge type: Pre-polarized condenser
  - Per-mic frequency response: 10 Hz - 20 kHz
  - Per-mic effective frequency range ±2 dB: 10 Hz - 20 kHz
  - Per-mic sensitivity, nominal, ±2 dB at 250 Hz: 36 mV/Pa; -28.9 dB re. 1 V/Pa
  - Per-mic equivalent noise level, A-weighted: Typ. 15 dB(A) re. 20 µPa (max. 17 dB(A))
  - Per-mic equivalent noise level, ITU-R BS.468-4: Typ. 27 dB (max. 29 dB)
  - Per-mic distortion, THD < 1%: 133 dB SPL RMS, 136 dB SPL peak
  - Per-mic dynamic range: Typ. 121 dB
  - Per-mic max. SPL, THD 10%: 146 dB SPL peak
  - Per-mic switchable attenuator: 0 dB / -20 dB
  - Per-mic rated output impedance: 200 Ω
  - Per-mic cable drive capability: 100 m (328 ft)
  - Per-mic output balance principle: Impedance balancing with Active Drive
  - Per-mic common mode rejection ratio (CMRR): > 60 dB
  - Per-mic power supply: P48 (Phantom Power)
  - Per-mic current consumption: 2.8 mA
  - Per-mic connector: XLR-3M (Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase)
  - Per-mic weight: 163 g (5.7 oz)
  - Per-mic microphone diameter: 16 - 19 mm (0.6 - 0.75 in)
  - Per-mic capsule diameter: 16 mm (0.6 in)
  - Per-mic microphone length: 170 mm (6.7 in)
  - Per-mic maximum output voltage, RMS: 8.0 V
  - Per-mic polarity: +V at pin 2 for positive sound pressure
  - Per-mic temperature range: -40°C to 45°C (-40°F to 113°F)
  - Per-mic relative humidity (RH): Up to 90%
  - Color: Matte black
