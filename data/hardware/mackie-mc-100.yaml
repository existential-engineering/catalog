  - Impedance: 32 Ohms
  - Transducer size: 40 mm
  - Sensitivity: 95 dB
  - Cable length: 3 m / 10 ft (Approx)
  - Weight: 233g / 8.22 oz
  - Type: Closed-Back
  - Driver Size: 40mm
