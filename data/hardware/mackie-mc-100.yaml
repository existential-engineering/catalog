details: |-
  MONITORING ON A WHOLE NEW LEVEL

  Tracking in the studio, mixing on your laptop, or even holding a boom on a set, having accurate, sturdy headphones is essential. Building on the Mackie studio monitor legacy, MC-100 headphones offer the clarity and accuracy Mackie is known for in a professional design. They feature large custom drivers for clear, distortion-free sound with an ergonomic headband and ear pads for hours of listening comfort in the studio or on the go.

  High-Performance Studio Headphones

  Custom high-performance drivers deliver a balanced sound signature in headphones that reveal every detail.

  Professional Design

  A soft padded adjustable headband and conforming ear pads give an ergonomic fit that offers hours of comfort while ensuring optimal low-end and sound isolation. The rugged design is built to last and meet the demands of professionals in the studio or on location.

  Use Them Everywhere

  Suited to studio monitoring, content creation, field recording, personal listening, and beyond. A 1/4-inch adapter is included.
