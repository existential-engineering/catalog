details: |-
  Whether you're referencing your mix in the studio or capturing sound on set, MC-100 Professional Headphones deliver accuracy and reliability for all of your projects.

  Tracking in the studio, mixing on your laptop, or even holding a boom on a set – having accurate, sturdy headphones is essential. Building on our studio monitor legacy, MC-100 headphones offer the clarity and accuracy Mackie is known for in a professional design. It features large custom drivers for clear, distortion-free sound with an ergonomic headband and ear pads for hours of listening comfort in the studio or on the go.
specs: |-
