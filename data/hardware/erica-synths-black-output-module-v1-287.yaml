description: Erica Synths Black Output Module is high quality output mixer and
  stereo panner with balanced outputs and a headphone amplifier for monitoring
  your modular masterpieces.
details: |-
  The Black Output Module is a high quality output mixer and stereo panner with balanced outputs and a headphone amplifier, for monitoring a modular system without leaving the rack.

  All three inputs are separately buffered, and stereo potentiometers of the kind found in high quality studio mixers handle the panning. IN3 adds a CV controlled autopan function, driven from a pan CV input that accepts -10V to +10V.

  On the panel are 6.3mm jacks for the balanced outputs and for the headphone out, which has its own dedicated preamp rated at 100mW. Separate volume controls cover the master output and the headphones, so monitoring level is independent of what leaves the module.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Diode protection guards against a reversed power supply.

  Input signal level runs between -10V and +10V. The panel is 14HP wide at a depth of 30mm, and power draw is 65mA on the positive rail against 45mA on the negative one.
specs: |-
  - 3 separately buffered inputs
  - Balanced outputs on 6.3mm jacks
  - High quality headphone preamp
  - Separate volume controls for master out and headphones
  - Stereo potentiometers for pan control
  - CV controllable pan for IN 3
  - Diode protection on reversed power supply
  - Input signal level -10V - +10V
  - Pan CV input signal level -10V - +10V
  - Phone amp out power 100mW
  - Power consumption +65mA, -45mA
  - Module width 14HP
  - Module depth 30mm
