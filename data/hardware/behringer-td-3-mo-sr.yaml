url: https://www.behringer.com/en/products/0718-ace
description: A modded-out analog bass line synthesizer with a pure analog signal
  path, sawtooth and square VCO, 4-pole low-pass resonant filter and a 16-step
  sequencer. The modded version adds a MIDI-controllable filter, variable slide
  time, sweep and accent switching, a sub-harmonics oscillator and an extensive
  CV and Gate patchbay.
details: |-
  Sometime after the release of the original TB-303, creative users realized that there was more to squeeze out of an already amazing bass machine, to produce sounds that were unique to themselves. As word started spreading about third-party mods adding more functions and many more ways to shape sounds, synth-heads around the world wanted to get their hands on a modded TB-303. The TD-3-MO-SR is an affordable and faithful homage to that iconic synthesizer, capable of creating fiery basslines and much more, with a pure analog signal path, a 16-step sequencer and authentic VCO, VCF and VCA designs.

  Great care has been taken in engineering the TD-3-MO-SR, including the true to the original VCO, VCF and VCA designs and pure analog circuitry with matched transistors. This attention to detail is what gives the TD-3-MO-SR its flexible sound shaping capability, covering a wide spectrum for super-funky bass lines and pounding rhythms. Its default signal routing means no patch cables are required to start making sounds, and the layout taps into the sounds of 1980s and 90s wave, EDM and synth-pop tracks.

  The TD-3-MO-SR includes a sawtooth and square waveform Voltage Controlled Oscillator (VCO) that can be tuned, shaped and even overdriven. The 4-pole low-pass resonant filter has controls for cutoff, resonance, envelope, decay and accent that can be adjusted to add tension and spice. Tapping the Sub Oscillator button gives an extra octave, more low end and a deeper sound.

  Because it is a modded out version of the original TD-3, there is a plethora of new features: a MIDI C/C controllable filter, variable slide time control, a three-mode Sweep Speed switch, an Accent Sweep switch, a Soft Attack control and more.

  The onboard sequencer with 7 tracks allows programming up to 16 steps of notes and rests and saving them as a Pattern, with up to 250 patterns recorded, saved and recalled across 4 Groups. Sequences play either in Keyboard mode, where the pattern is created and stored, or Step mode, which allows interaction while composing. The onboard Arpeggiator features wide patterns for a large array of sound effects. While the instrument is monophonic, its 16-note Poly Chain function combines multiple synthesizers for up to 16-voice polyphony, and 15 controls and 33 switches give real-time access to the important parameters alongside a multi-I/O patchbay for connecting external devices.
specs: |-
  - Modded Out Bass Line synthesizer featuring the most legendary modifications
  - Pure analog signal path based on VCO, VCF and VCA designs
  - Sawtooth and square waveform VCO with transistor wave-shaping circuitry
  - 4-pole low-pass resonant filter with cutoff, resonance, envelope, decay and accent controls
  - 16-step sequencer with 7 tracks, each with 250 user patterns, stored in 4 groups
  - Onboard arpeggiator
  - Filter frequency fully controllable via MIDI C/C
  - Sub-harmonics oscillator with switchable output level
  - Analog slide circuitry with external slide control
  - Slide Time control allows for variable slide time (up to 6 times longer)
  - Sweep Speed switch features 3 accent speed modes (slow, norm, fast)
  - Accent Sweep switch features 3 sweep combinations with high resonance mode
  - Filter FM control modulates frequency of the filter from the audio output of the VCA
  - Muffler circuitry features post VCA distortion with full bass response
  - Dedicated Accent push button to manually activate the accent
  - Soft Attack control for wide range of attack times for non-accented notes
  - Normal control for wide range of decay time for non-accented notes
  - Accent control for wide range of decay time for accented notes
  - Filter Tracking control for filter frequency tracking of the current note
  - Overdrive control
  - CV and Gate inputs and outputs
  - 16-voice Poly Chain allows combining multiple synthesizers for up to 16-voice polyphony
  - Premium quality VRs featuring high resolution and metal shafts
  - 15 controls and 33 switches
  - MIDI and USB implementation with MIDI channel and Voice Priority selection
  - Monophonic (one note at a time)
