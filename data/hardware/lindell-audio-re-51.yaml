details: |-
  The RE-51 is a preamp and EQ module for the 500-series built around the acclaimed OPA1731 vintage opamp.

  Usual perks such as polarity reverse and phantom power are easily switchable, but with recording workflow convenience in mind Lindell have also included stepped pots for the rotary controls, to ensure ease of recall between different vocalists or sessions.
specs: |-
  - Analogue VU meter
  - Transformer balanced output
  - Switched rotary controls
  - 48V phantom power
  - Switchable polarity
  - Hi-Z direct inject input
  - 80Hz switchable HPF
  - Goldplated PCB internals
  - Powered by vintage OPA1731 opamp
  - Compatible with 500 series racks
