description: Designed for the discerning bassist, the Tone Hammer 500 is a
  lightweight yet powerful 500-watt Class D bass amplifier inspired by the
  soulful warmth of tube amplifiers. Its harmonically rich preamp offers a
  round, full-bodied character with a 3-band EQ, fully sweepable midrange, and
  Aguilar's proprietary AGS Drive circuit for tube-like grit and punch.
details: |-
  The Tone Hammer 500 is Aguilar's flagship lightweight bass amplifier, delivering
  500 watts of Class D power inspired by the soulful warmth of classic tube
  designs. Its solid-state preamp is voiced for a warm, harmonically rich character
  that gives every note round, full-bodied depth while remaining highly portable
  at just 4.2 lbs.

  At the heart of the Tone Hammer 500 is a 3-band EQ with bass, treble, and a
  fully sweepable midrange control that spans 180 Hz to 1 kHz, giving bassists
  precise tonal shaping across the frequency spectrum. The Drive control adds
  distortion and tube-like grit via Aguilar's proprietary AGS (Adaptive Gain
  Shaping) circuit, letting players dial in everything from clean warmth to
  aggressive grind.

  Connectivity is comprehensive and stage-ready: a single 1/4" input accommodates
  both active and passive basses, while dual XLR balanced outputs with pre/post EQ
  switching and a ground lift switch make front-of-house integration seamless.

  The amplifier features a universal mains power supply (SMPS) for worldwide
  compatibility, and two whisper-quiet fans with thermal speed control ensure
  reliable performance even during extended high-power use. A series effects loop
  adds 6 dB of additional gain for outboard processing, and a tuner output, aux
  in, and headphone out round out the feature set for practice and performance
  flexibility.
specs: |-
  - Power Output: 500 watts
  - Preamp Section: Solid State
  - Power Section: Class D
  - Power Supply: Switching mode power supply (SMPS), universal mains
  - Bass EQ: +/- 17 dB @ 40 Hz
  - Mid Level EQ: +/- 16 dB
  - Mid Frequency: Fully sweepable 180 Hz – 1 kHz
  - Treble EQ: +/- 14 dB @ 4 kHz
  - Drive: Aguilar AGS (Adaptive Gain Shaping) circuit
  - Effects Loop: Series operation, adds 6 dB of additional gain
  - XLR Output: Pre/post EQ switchable with ground lift
  - Cooling: Dual whisper fans with thermal speed control
  - Dimensions: 10.75" x 8.5" x 3" (W x D x H)
  - Weight: 4.2 lbs (1.9 kg)
