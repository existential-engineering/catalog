description: >
  A limited-edition analog drum machine that fuses a timeless look with a beefy, Brute-powered sound. With per-voice color controls, built-in analog distortion, and polyrhythmic sequencing - craft raw, punchy rhythms with ease.
details: |-
  The drumbrute impact 1984 is a 10-voice analog drum machine that merges in-your-face analog percussion with a polyrhythmic 64-step sequencer in a compact, beat-making package. It features 10 pure analog sounds including kick, two snares, hi and low toms, cowbell, cymbal, closed and open hats, and an fm synth sound. The machine delivers high-impact drum sounds designed to stand out with a strong overall kit sound that provides punch and power for any performance or production setup.

  The drum machine features a specially voiced output distortion circuit that adds rich analog warmth and can be bypassed when not needed, along with unique color control that can be activated per instrument or per step for additional tonal shaping. Users can add overdrive to the kick, make snares snap and crack, and excite the hats, toms, and fm sound. The polyrhythm feature allows changing pattern length per instrument, while the looper adds glitchy beat-repeats and the roller provides per-instrument drum fills for creating evolving grooves.

  Performance is handled through 8 responsive pads for finger-drumming live or recording in real-time, with the ability to switch banks while playing, quickly mute or solo channels, and watch pads light up with every triggered sound. Users can create patterns using step and accent buttons or record them in real-time from the pads, with swing control available per instrument or globally to add groove. The machine adapts to both crisp, quantized hits and unquantized jamming styles, with randomness features to generate beat variations from subtle hits to full sonic assaults.

  Song mode allows chaining up to 16 saved patterns to create full songs perfect for live sets, while the 64 patterns with up to 64 steps each provide extensive sequencing possibilities. Advanced I/o connectivity includes multi-out, MIDI, and sync options, allowing users to route hats and snares through external effects, jam with modular systems, or chain multiple drum machines together. The machine syncs to external MIDI, vintage sequencers, modular synths, and daws via MIDI, clock, or USB with support for 1pps, 2ppq, din24, and din48 sync options.

  A 3.5mm headphone output with metronome override enables monitoring, and four additional outputs allow sending kick, snares, hi hats, or fm sound separately for post-processing. When individual outputs are routed, they are removed from the main mix, providing massive creative control over the final drum sound. The compact design measures 13.5 x 9.6 x 2.2 inches and weighs 4 lbs, making it suitable for both studio and live performance environments.
