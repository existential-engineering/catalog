description: The OM1 JL is a Julian Lage signature acoustic guitar developed
  through collaboration between guitarist Julian Lage and Collings founder Bill
  Collings. Its custom neck is modeled after Lage's cherished 1939 Martin
  000-18, digitized for precision replication. Built to Traditional Series
  specs, it features a custom satin nitrocellulose lacquer finish and a script
  peghead logo hand-cut by Bill Collings roughly 30 years ago.
details: |-
  The OM1 JL emerged from conversations between Julian Lage and Bill Collings beginning in 2014, continuing until Collings' passing in July 2017. The instrument is rooted in the Traditional Series build and voicing philosophy, emphasizing vintage construction and tone. The neck profile is a custom JL carve derived from the asymmetrical, worn-in feel of Lage's personal 1939 Martin 000-18. The body uses a Sitka spruce top with Honduran mahogany back, sides, and neck, finished in custom satin nitrocellulose lacquer to achieve vintage openness of tone. The brace pattern is a custom Traditional Series pre-war scalloped X-brace with an abbreviated soundboard graft (tongue brace). An ebony belly-style bridge, ebony fingerboard with gold MOP short dots, and relic nickel Waverly tuners with vintage oval buttons complete the appointments.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Construction: Traditional Series Build and Voicing
  - Neck: Honduran mahogany
  - Neck Profile: Custom JL carve
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Scale Length: 25 1/2"
  - Fingerboard: Ebony with gold MOP short dots
  - Fingerboard Radius: 14" - 26" compound
  - Frets: Medium 18% nickel-silver
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Body Binding: Tortoise with custom wood purflings
  - Peghead Profile: Square
  - Peghead Veneer: Ebony with gold MOP Collings script logo
  - Tuners: Relic nickel Waverly with vintage oval buttons (16:1 ratio)
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Brace Material: Sitka spruce
  - Brace Pattern: Custom Traditional Series pre-war scalloped X-brace (abbreviated soundboard graft / tongue brace)
  - Rosette: Custom wood rosette
  - Backstrip: 1-style (walnut)
  - Pickguard: Tortoise
  - Body Finish: Custom satin nitrocellulose lacquer
  - Neck Finish: Custom satin nitrocellulose lacquer
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4 1/8"
  - Total Length: 39 1/2"
  - Strings: D'Addario NB1253 (.012" - .053")
