details: |-
  The Phase 24 is a simple phaser that delivers both two-stage and four-stage phasing for classic sounds. It aims at shimmering, subtle and watery tones, and part of its character comes from carefully matched FETs, so that the phase sounds round off evenly and the stages work together for a full, lush tone.

  A 2/4 stage selector chooses between a classic four-stage phaser and the less common two-stage voicing, which gives a very subtle shimmer usable at any time. A Depth control acts as a blend, taking the pedal from dry with no phasing through to full-depth phasing, so the effect can be set as a slight wave of ambiance rather than an obvious effect on the signal.
