description: The CODE50 is a 50-watt digital modelling combo amplifier that
  pairs Marshall's classic and modern amp tones with full-featured connectivity
  for modern players. Built around Marshall's MST (Marshall-Softube Tube
  modelling) preamps, power amps, and speaker cabinets, it offers 100 editable
  presets, 24 onboard digital effects, and a range of microphone emulations for
  direct recording. Bluetooth lets players stream music from an iOS or Android
  device and control the amp through the Marshall Gateway app, while a USB port
  enables direct connection to a computer for recording and patch editing. A
  community Code Presets platform (codepresets.marshall.com) lets users share
  and download user-created sounds.
details: |-
  Jump straight in and explore the 100 presets that the fully digital CODE50 has to offer. With 50W of power it's portable enough for you to practise at home or perform in larger spaces.

  Showcasing a comprehensive array of 24 effects and a versatile collection of 100 editable presets, the CODE50 unveils a range of sonic potential. This expansive selection enables you to explore and shape your sound, providing an unmatched level of control and customisation.

  Take advantage of the user-friendly Code Presets platform to effortlessly upload and download from a global repository of user presets. This cutting-edge feature grants you access to an extensive library of tones crafted by musicians across the globe. By contributing and exploring, this community enhances the creative possibilities of your CODE50, creating a collaborative environment that helps build your musical experience.

  Connect via Bluetooth to control CODE50 and stream music from your iOS or Android device using the Gateway app. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Digital 50W combo, CODE range
  - 1 x 12 inch custom speaker (4 ohm, 50W), unit impedance 4 ohm
  - 100 built-in editable presets
  - 24 different built-in effects, 5 usable simultaneously
  - Controls: bass, middle, treble, gain, volume, pre-FX, amplifier models, modulation effects, delay effects, reverb effects, power amplifier models, speaker cabinets
  - Additional controls available via the Marshall Gateway app for iOS and Android devices
  - Bluetooth control and audio streaming from the Gateway app
  - No extension cabinet outputs
  - No effects loop
  - Inputs: 1 x instrument jack, 1 x Aux In (3.5 mm jack)
  - Outputs: 1 x 3.5 mm jack headphone out
  - Dimensions: 530 mm (20.9 in) wide, 440 mm (17.3 in) high, 280 mm (11 in) deep
  - Weight: 13 kg / 29 lb
  - Detachable power cable included
