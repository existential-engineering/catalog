description: The CODE50 is a 50-watt digital modelling combo amplifier that
  pairs Marshall's classic and modern amp tones with full-featured connectivity
  for modern players. Built around Marshall's MST (Marshall-Softube Tube
  modelling) preamps, power amps, and speaker cabinets, it offers 100 editable
  presets, 24 onboard digital effects, and a range of microphone emulations for
  direct recording. Bluetooth lets players stream music from an iOS or Android
  device and control the amp through the Marshall Gateway app, while a USB port
  enables direct connection to a computer for recording and patch editing. A
  community Code Presets platform (codepresets.marshall.com) lets users share
  and download user-created sounds.
