details: |-
  The JBL M2 Master Reference Monitor is a free-standing, 2-way floor-standing or soffit-mountable reference system engineered to serve the most demanding music, cinema, and broadcast production environments. Leveraging a new generation of JBL high-output, ultra-low distortion transducers, the M2 delivers an in-room frequency response of 20 Hz to 40 kHz (±3 dB) and a peak SPL of 123 dB at 1 meter — setting a new standard for dynamic range accuracy in professional monitoring.

  At the heart of the M2's high-frequency performance is the D2430K Dual Diaphragm Dual Voice Coil Compression Driver. This innovative design employs two diaphragms and two voice coils working in tandem to extend HF reproduction, smooth response, and dramatically reduce distortion and power compression compared to conventional compression drivers, resulting in increased dynamic headroom that faithfully reproduces transients at any listening level.

  Low-frequency duties are handled by the 2216Nd 15-inch Differential Drive woofer, which uses dual neodymium magnets and dual voice coils for extraordinary low-frequency extension with minimal distortion. The woofer crosses over at 800 Hz. A JBL-patented Slipstream port design eliminates port-turbulence noise, housed in a rigid 1-inch MDF enclosure extensively braced against resonance.

  The M2 incorporates JBL's Image Control Waveguide, which manages the HF driver dispersion pattern to maintain consistent, smooth off-axis response at 120° × 100° coverage. Combined with JBL's LSR Linear Spatial Reference design philosophy, the M2 translates with exceptional accuracy across a wide variety of listening positions and room environments.

  The M2 is a passive monitor requiring an external power amplifier; JBL recommends the Crown iTech 5000HD (one per speaker). The enclosure is finished in satin black lacquer with a removable ABS grille covered in black UL-compliant fabric, suitable for both permanent studio installations and transportable setups.
specs: |-
  - System Format: 2-Way, Floor Standing or Soffit Mountable
  - HF Driver: D2430K Dual Diaphragm Dual Voice Coil Compression Driver
  - LF Driver: 2216Nd 15 in (381 mm) Differential Drive Woofer
  - Crossover Frequency: 800 Hz
  - Frequency Response: 20 Hz – 40 kHz (±3 dB)
  - Coverage Angle: 120° H × 100° V
  - Sensitivity: 92 dB
  - Continuous SPL @ 1m: 117 dB
  - Peak SPL @ 1m: 123 dB
  - Recommended Amplifier: Crown iTech 5000HD (per speaker)
  - Amplifier Power Rating: 1,200 W into 8 ohms
  - Input Connectors: Spring Terminals
  - Enclosure Material: 25 mm (1 in) MDF
  - Finish: Satin Black Lacquer
  - Dimensions (H×W×D): 1256 × 508 × 355.6 mm (49.5 × 20 × 14 in)
  - Weight: 58.5 kg (129 lb) each
