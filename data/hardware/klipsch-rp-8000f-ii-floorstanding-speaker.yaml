description: The Klipsch RP-8000F II floorstanding speaker delivers incredible
  cinematic sound and adding Dolby Atmos is an easy upgrade.
details: |-
  The RP-8000F II features a 90° x 90° silicon composite hybrid Tractrix horn that maximizes efficiency and increases detail while focusing high frequencies towards the listening area. The proprietary Tractrix geometry provides the most efficient transfer of high frequency waves, and the phase plug and compressed molded silicon face ensure smooth frequency response.

  The exclusive Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for enhanced, detailed performance. The vented tweeter housing reduces standing waves that create unwanted harmonics, resulting in enhanced detail and clarity in high frequency reproduction.

  All-new Cerametallic woofers are exceptionally rigid and lightweight for minimal distortion and maximum efficiency. New aluminum shorting rings reduce distortion and increase power handling, while the new motor structure improves transient response with more control, speed, and accuracy.

  The advanced cabinet design includes additional bracing and a divided cabinet to minimize resonance and vibration. Cast aluminum feet provide a modern look with less resonance than MDF or ABS plastic, mechanically decoupling the speaker from the floor for faster, tighter low frequencies.

  Bi-wiring/bi-amping capability is provided via dual aluminum binding posts, and refined Atmos connections with simple hidden wiring allow easy Dolby Atmos elevation speaker upgrades.
