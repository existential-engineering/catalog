description: Socket upgrade kit that adds a KADI port to the Roland TR-606, so
  its individual sounds can be played from MIDI through a Kenton converter
  fitted with a KADI port.
details: |-
  This socket upgrade adds a KADI port to the Roland TR-606, enabling the drum machine's individual sounds to be played from the KADI port output of a Kenton device fitted with one. The compatible devices are the Pro-KADI MkII, the Pro-4, and the Pro-2000 when it carries the optional KADI port.

  All of the TR-606 sounds can be played individually, with or without accent, which is determined by a pre-set velocity level.

  While the KADI port is connected to a KADI device the sounds can only be played from MIDI. Unplugging the KADI cable, or switching the KADI device off, returns the TR-606 to normal operation.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the 15 pin high density D socket. A KADI cable is not included, since one is supplied with the Pro-KADI and with the optional KADI add-on port for the Pro-2000, though not with the Pro-4.

  This is a KADI socket upgrade rather than a full MIDI retrofit, and no retrofit kit is produced for the TR-606. Installation is a job for an experienced synthesiser engineer rather than the end user.
specs: |-
  - Adds one KADI port on a 15 pin high density D socket
  - All TR-606 sounds playable individually
  - Accent level determined by a pre-set velocity threshold
  - Compatible with the Pro-KADI MkII, the Pro-4 and a Pro-2000 fitted with the optional KADI port
  - KADI cable not included
  - TR-606 reverts to normal operation when the KADI cable is unplugged
  - Powered from inside the host TR-606, so the kit has no power connector of its own
