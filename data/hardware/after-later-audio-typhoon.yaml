description: A granular texture synthesizer module combining the features of
  Storm with the sliders and layout of Monsoon, running the SuperParasites
  firmware for granular clouds, pitch shifting, looping delay, spectral
  processing, reverb, resonator, beat repeat, and spectral clouds modes.
details: |-
  This is where Storm and Monsoon meet to create the latest improvements on the original Clouds design. With Typhoon you get all of the features of Storm combined with sliders and layout of Monsoon in 16hp. Typhoon runs the SuperParasites firmware, so no more having to swap between Parasites and Kammerl firmware options.
specs: |-
  - Dedicated blend controls for Feedback, Panning, Mix, and Reverb (similar to Monsoon)
  - All eight modes from Parasites and Kammerl
  - Stereo VCAs
  - Input/output mutes
  - Exponential and linear pitch controls
  - Universal CV routing and random CV signals
  - The original manual gives a great intro to the basics
  - The Microcell manual has a good overview of the additional controls (it uses the same firmware)
  - Hardware: cc-by-sa 3.0 – E. Gillet / Mutable Instruments ( GitHub )
  - Software: MIT License – E. Gillet / Mutable Instruments – ( GitHub )
  - Derivative Panel, PCB & Schematic provided by Jakplugg under creative commons CC-BY-SA-3.0 license
  - Software: - SuperParasites – MIT License – Patrick Dowling – ( GitHub )
  - Which is based on: - Parasites – MIT License – Matthias Puech – ( GitHub )
  - Beat Repeat – MIT License – Julius Kammerl – ( GitHub )
