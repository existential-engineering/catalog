details: |-
  The latest evolution of the popular Dellinger7 series is based around a new and inspired confluence of tone woods. The newly constructed bipartite body composition now features a select Walnut top section with an Australian Blackwood foundation. This distinctive combination provides an engaging, sustain rich tone with exceptional clarity in the mid to high frequency range. It implements a well defined, clear and articulate note separation that is essential for a phonically extended 7 stringed instrument. The inclusion of Jescar stainless steel jumbo frets further enhances the discernible clarity. The new Dellinger7-WB-FX also features the unique Caparison designed high mass 'Fixed Bridge7' which effortlessly deals with a variance of string gauges and extreme tunings while maintaining stability and sonic reinforcement. This stability is further enhanced by the use of Gotoh MG-T locking tuners and a Graph Tech Black TUSQ nut. Caparison made high output PH7-bm and PH7-nm humbucking pickups adds a unique and complimentary tonal colouration to the Dellinger7-WB-FX, providing a whole gamut of timbres from an ultra aggressive growl to the sweetest bell-like harmonic cleans. A range that is further enhanced by a push-pull master tone pot, which simultaneously splits the coils in both the bridge and neck pickups, providing that classic single coil crisp glassy twang. The 5 piece Maple-Walnut neck is smooth, fast, comfortable, plays like a dream and comes with a choice of Maple or Ebony fingerboards. The Dellinger7-WB-FX is available in Natural, Trans Charcoal Black or Trans White colours, each designed to show of the beautiful contours and grain texture of each instrument that emphasises the beautiful simplicity of this effortlessly complex instrument.
