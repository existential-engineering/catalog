description: Enhance your next set with Thump212XT, the next evolution of our
  full-featured Thump Series powered loudspeakers. Packed with more time-saving
  features than ever, tons of power, and an all-new cabinet, Thump212XT is the
  ultimate loudspeaker for DJs, bands, and clubs that need pro sound without the
  insane price tag.
details: |-
  Thump212XT is the enhanced member of the 2022 Thump Series, pairing a 1400W ultra-efficient Class-D amplifier with a 12 inch high-performance woofer and a 1 inch compression driver in an all-new cabinet. Frequency response is 47 Hz to 23 kHz with a maximum SPL of 128 dB.

  Bluetooth connectivity handles music streaming, speaker linking and control. Two ThumpXT loudspeakers can be linked for stereo or dual-zone playback, and the Thump Connect 2 app adjusts system EQ, voicing modes, channel levels and application-specific presets from a phone.

  Four application-specific voicing modes optimise the speaker at the push of a button: Music for pre-recorded playback, Live for general sound reinforcement, Club for extra low-end punch, and Monitor for floor-wedge use. A separate Outdoor mode re-voices the cabinet for open-air venues.

  A built-in Feedback Eliminator suppresses squeals and runaway rumble, and Music Ducking automatically reduces the level of channel 2 whenever channel 1 receives signal, so announcements cut through without manual level changes.

  The rear panel carries a mixer with an XLR/TRS combo input that accepts mic or line on channel 1, an XLR/TRS line input plus a stereo 1/8 inch input on channel 2, and a Thru output carrying both channels. The cabinet has a standard pole mount, a monitor wedge angle and M10 flypoints for permanent install, and weighs 29.3 lb / 13.3 kg.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - 12 inch high-performance woofer
  - 1 inch compression driver
  - Frequency response: 47 Hz - 23 kHz
  - Max SPL: 128 dB
  - Horizontal coverage 90 degrees, vertical coverage 60 degrees
  - Electronic crossover frequency: 2.1 kHz
  - 4 application-specific voicing modes: Music, Live, Club, Monitor
  - Outdoor mode optimizes voicing for open air venues
  - Bluetooth connectivity for streaming, speaker linking and control
  - Link 2 ThumpXT loudspeakers in stereo or dual-zone configuration
  - Thump Connect 2 app for wireless control
  - Built-in Feedback Eliminator
  - Music Ducking reduces the level of Ch.2 when Ch.1 receives signal
  - Front LED On/Off switch
  - Universal power supply (100-240VAC), 3-pin IEC inlet
  - Standard pole mount, monitor wedge angle, M10 flypoints
  - Weight: 29.3 lb / 13.3 kg
  - Dimensions (HxWxD): 24.2 x 14.1 x 14 in / 615 x 358 x 356 mm
