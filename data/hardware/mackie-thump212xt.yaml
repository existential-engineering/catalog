name: Thump212XT
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/thump-series-2022/Thump212XT.html
description: "Tired of your PA system not cutting it? We get it, and Thump212XT
  is here to make life easier for you."
details: |-
  With wireless control from your phone, its incredibly easy to dial in the sound just right. Application-specific voicing modes, indoor/outdoor modes, and more make it simple to optimize the loudspeaker to wheverer you put them. What about power? Well with 1400W of muscle, Thump212XT will keep the music going all night without a sweat. From DJs to bands to clubs and practice spaces, the lightweight Thump212XT is ready to enhance your performance.

  What better to control your ThumpXT than the device you already carry with you everywhere? Easily stream music directly to the speaker and enjoy the wireless freedom to dance around while playing DJ.

  Link a pair of ThumpXT speakers together via Bluetooth to stream music to both in either Stereo or Dual Zone mode plus control them both via the Thump Connect 2 app.

  You've got music playing nice and loud but, it's time for another announcement. Sure, you could mess with your levels every time, but who's got time for that. Simply press the Music Ducking button, and channel 2 will automatically turn down whenever you speak into the mic on channel 1.

  Ever get a little too up close and personal with the microphone only to hear a loud, ear-destroying squeal? That's commonly known as feedback. With built-in Feedback Eliminator, you can control acoustic feedback issues.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Built-Like-A-Tank to conquer every gig while lightweight for easy loading
  - Frequency response: 47 Hz – 23kHz
  - Max SPL: 128 dB
  - 12" high-performance woofer
  - 1" compression driver
  - 4 Application-specific voicing modes (Music, Live, Club, Monitor)
  - Outdoor mode optimizes voicing for open air venues
  - Bluetooth connectivity for streaming, speaker linking, and control
  - Download the Thump Connect 2 app for complete wireless control
  - Link 2 ThumpXT loudspeakers for a powerful, wireless, music playback system in both stereo and dual-zone configuration
  - Flexible I/O: Ch.1 features an XLR/TRS input that accepts mic or line signals; Ch.2 features an XLR/TRS line input plus stereo 1/8" input
  - Thru output contains audio from both input channels
  - Built-in Feedback Eliminator reduces squeals and out of control rumble
  - Music Ducking mode automatically reduces the level of Ch.2 when Ch.1 receives signal
  - Front LED On/Off switch
  - Universal Power Supply (100-240VAC)
  - Standard pole mount
  - M10 flypoints for permanent install
  - Monitor wedge provides optimal angle for use as a floor monitor
  - Weight: 29.3 lb / 13.3 kg
  - Dimensions: 24.2 x 14.1 x 14 in / 615 x 358 x 356 mm (HxWxD)
