name: AP15mk2
manufacturer: fostex
primaryCategory: power-amp
url: https://www.fostex.jp/en/products/ap15mk2/
description: A compact-sized personal amplifier that improves on its highly popular predecessor model, adding even higher sound quality and an auto-standby function. Delivers 15W + 15W via a digital amplifier with reduced distortion and residual noise, and includes an auto-standby function compliant with the European EcoDesign Directive (power consumption reduces to 0.5W or less in standby). Standby delay is configurable (1 or 12 minutes) via dipswitch.
details: |-
  The AP15mk2 is a compact personal amplifier equipped with a 15W+15W digital amplifier. Based on its highly acclaimed predecessor, the AP15mk2 has undergone significant changes, from the devices it incorporates to the layout of each component, to improve distortion and residual noise performance, resulting in an even clearer, higher quality sound.

  The auto standby function conforms to the European EcoDesign Directive for environmentally deployable design. When the input to the unit remains at no signal or near signal level, it automatically switches to standby mode and reduces power consumption to 0.5W or less.

  This function can be turned ON/OFF and the time until the standby mode is activated can be set to either 1 minute or 12 minutes using the dipswitch on the bottom of the unit, depending on the operating environment and the intended use of the unit.

  Two inputs are provided, a stereo mini-jack and a pair of RCA jacks. Stereo mini-jacks have priority for input, and simultaneous input with RCA pin jacks is not allowed.

  Only a passive speaker unit or speaker system without an amplifier may be connected to the outputs, at an impedance of 4 to 8 ohms directly to one output. This product is intended for private use by individuals.
specs: |-
  - Maximum output: 15 W + 15 W
  - Applicable load impedance: 4 ohm to 8 ohm
  - Frequency response: 20 Hz to 20 kHz
  - Total Harmonic Distortion: 0.05% (10 W output, 4 ohm load, 1 kHz)
  - S/N Ratio: 90 dB or more
  - Input terminal: Stereo mini-jack (1 channel), RCA (1 channel), input sensitivity 300 mV
  - Stereo mini-jack has input priority; simultaneous input with RCA is not possible
  - Power: DC 15 V (dedicated AC adapter included)
  - Power consumption: 45 W (max), 0.5 W or less (standby)
  - Auto-standby switchable ON/OFF with 1 minute or 12 minute delay via bottom dipswitch
  - External dimensions: 110 mm (W) x 30 mm (H) x 75 mm (D) including maximum protrusion
  - Mass of main unit: approx. 250 g
  - Accessories: AC adapter x 1, speaker cable (1.5m) x 2, stereo mini cable (0.8m) x 1, stereo RCA cable (1.5m) x 1
  - Complies with the European RoHS Directive
