description: An optional footswitch for the Plus Pedal II that engages its WET,
  LATCH and HIDE operating modes, with a 1/4-inch mono dry output for routing
  the dry signal to another amp or a tuner.
details: |-
  The optional Plus Pedal II Footswitch engages the Plus Pedal II's three operating modes, while its DRY OUT jack allows the dry signal to be routed to another amp or a tuner.

  Three operating modes. WET removes the dry signal from the main output for pure sustained layers. LATCH keeps the pedal continuously active without holding the brass pedal down. HIDE momentarily and gradually removes the dry signal while the brass pedal is pressed.

  The footswitch can be an integral part of the Plus Pedal II, providing an intuitive and even foot-free experience during performance.

  Compatibility: the Plus Footswitch I is not compatible with the Plus Pedal II, and the Plus Pedal I is not compatible with the Plus Footswitch II.
specs: |-
  - Engages the WET, LATCH and HIDE operating modes on the fly
  - Mutes and unmutes the dry sound at any moment, before, after or inside sustaining notes
  - Status LED
  - Routes the dry signal to another amp
  - Plus TRS cable included
  - Input: 1/4-inch TRS in from the Plus Pedal II
  - Output: 1/4-inch mono dry out
  - Dimensions: 58 x 66 x 46 mm (2.28 x 2.60 x 1.81 in) WLH
  - Weight: 217 g (0.5 lbs)
  - Not compatible with the Plus Pedal I
