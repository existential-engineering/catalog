details: |-
  Introducing the ProCast Mio, USB studio condenser microphone from Miktek. The Mio is a high quality, large diaphragm, side-address condenser microphone featuring a high quality analog to digital converter and USB output. "Plug and play" technology allows direct connection into a Windows or Macintosh computer's USB port providing simple operation with amazingly professional results. The Mio also incorporates a built-in 1/8th inch headphone output to monitor computer playback. What sets the Mio apart is that it's not only a digital USB microphone but also incorporates a standard 3 pin XLR output. This provides the user the flexibility to record direct with USB or through an external audio interface. The discrete analog XLR output can be used simultaneously with the USB output allowing the microphone to be used for recording and sound reinforcement at the same time. The ProCast Mio is perfect for podcasting or recording vocals, guitar, and other instruments. The ProCast Mio is one microphone that offers two solutions and boasts the Miktek sound quality professionals demand and value which everyone can appreciate. Specifications

  • Super cardioid pickup pattern
  • 19mm fixed charge capsule
  • 3.5mm headphone output
  • Mini USB and standard 3 pin XLR outputs
  • Phantom or USB bus power
  • Includes mic clip, tripod desk stand, and 3m USB cable

