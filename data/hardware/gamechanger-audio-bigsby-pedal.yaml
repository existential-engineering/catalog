description: Polyphonic pitch-shifter pedal that reproduces the string-bending
  and vibrato of a BIGSBY tremolo arm, played from a spring-loaded rocking
  foot-pedal with up to 12 semitones of bend in either direction and a DETUNE
  control that emulates the tuning instability of mechanical tremolo hardware.
details: |-
  The BIGSBY Pedal is a polyphonic pitch shifter pedal that reproduces the string bending and vibrato effects produced by the BIGSBY tremolo arm and other traditional tremolo systems.

  Powered by a SHARC audio processor, it runs a hybrid algorithm developed by Gamechanger Audio to achieve smooth polyphonic real-time pitch-shifting at low intervals. The algorithm was tweaked to preserve the natural timbre and sound of electric and acoustic string instruments, including baritone and bass guitars, guitars, mandolins and banjos.

  The spring-loaded foot-pedal design makes it possible to incorporate pitch-shifting into a performance in new ways. The pedal is always on, and the only thing needed to activate it is to step on the foot-pedal. The algorithm keeps transitions between the DRY and WET (pitched) signals as smooth as possible, so pitch-bends can be folded into complex picking patterns as well as lead and melodic lines. That opens up strumming patterns, bend combinations and lap-steel and slide-inspired licks that cannot be achieved with traditional tremolo systems.

  Another key component of the pedal's sound is the DETUNE parameter, an algorithm designed to emulate the imperfections and dissonant properties of traditional mechanical string-bending hardware. The vibrato effects it produces are close to those of a conventional tremolo arm.

  The pedal combines the tremolo arm pitch-bend emulation with a set of features and modes that take it beyond a simple pitch bend. Gamechanger Audio received the go-ahead from Fender and Bigsby to build it in 2019.
specs: |-
  - Polyphonic pitch shifting and a reproduction of the BIGSBY tremolo arm string-bending and vibrato effects
  - A spring-loaded rocking foot-pedal for upwards and downwards pitch-bending movements
  - High-quality buffered bypass and seamless transitions into and out of bypass
  - Multi-function LED-lit knobs, where LED color and intensity indicate the selected parameters and values
  - AUTO mode: an LFO controls the pitch-bend rate and the foot-pedal controls the pitch bend depth
  - Up to 12 semitone pitch-shifts in both directions. The pitch-bend range can be set separately for both directions
  - Foot-pedal and a pitch-shift direction invert switch on the back panel
  - BLEND control for mixing in the DRY signal to achieve harmonizer or dynamic chorus sounds
  - DETUNE control for emulating the tuning instability of hardware tremolo systems
  - Full MIDI CC and PC control over all parameters, preset recalling and clock syncing. A 3.5 mm TRS to 5 pin DIN MIDI adapter is included
  - 10 user preset slots accessible via MIDI PC
  - Expression output gives the spring-loaded foot pedal control over other audio gear, either in conjunction with or separately from pitch-shifting, with adjustable expression depth and center position offset controls
  - External footswitch input makes it possible to use the pedal in latching mode for typical pitch-shifter, octave, detune and chorus functionalities. The pedal is compatible with both momentary and toggle type footswitches with a TS 1/4 inch jack
  - KNOB LOCK option to prevent accidental parameter adjustment during performances
  - Powered by a standard 9V DC center negative power supply with at least 250 mA. Power supply is not included
