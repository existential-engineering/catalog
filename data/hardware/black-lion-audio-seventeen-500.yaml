description: Modernized 500-series FET limiting amplifier
details: Black Lion Audio's modernized take on the classic '76 compressor,
  featuring a redesigned IC-based front end that delivers incredible detail and
  nuance not normally possible with a '76-style comp. The Seventeen 500 combines
  a clean, punchy modern sound under light compression with vintage character
  when pushed hard. It includes a custom-designed Black Lion output transformer,
  proprietary power decoupling for low noise, high-grade Nichicon capacitors, a
  frequency-adjustable sidechain high-pass filter, a wet/dry mix knob for
  parallel compression, stereo link function, and an all-buttons-in mode.
specs: |-
  - Attack: 20µS to 800µS (continuously variable)
  - Release: 50mS to 1200mS (continuously variable)
  - Ratio: 4:1, 8:1, 12:1, 20:1 (pushbutton selected, combinable)
  - Sidechain HPF: OFF, 100Hz, 200Hz
  - Voltage: ±16V
  - Format: 500-series, 2 slots
  - Dimensions: 3" W x 5.25" H x 9" D
  - Weight: 3.25 lbs
