description: >-
  An ambitious computer-controlled analog synthesizer commissioned by former Tangerine Dream
  member Peter Baumann in 1979, representing E-mu's attempt at a flagship polyphonic
  instrument. Only one unit was ever built.
details: |-
  The E-mu Audity stands as one of the most fascinating unrealized visions in synthesizer
  history. Commissioned in 1979 by Peter Baumann, who had recently departed Tangerine Dream,
  the instrument was conceived as a state-of-the-art computer-based analog synthesizer that
  would push beyond the capabilities of competitors like the Sequential Circuits Prophet-5.

  Featuring 16-voice polyphony driven by SSM oscillator and filter chips, the Audity was
  designed with a 61-key keyboard and multi-patch storage capabilities. Each voice included
  two SSM-based oscillators with multiple waveforms, a noise source, and a sophisticated
  filter section combining high-pass and low-pass SSM filter chips with a separate resonant
  filter. Dedicated envelope generators controlled the VCO, VCF, and VCA stages independently.

  The project's extraordinary production cost of approximately $70,000 made commercial
  manufacturing entirely impractical. E-mu ultimately abandoned the Audity design and pivoted
  toward sampler technology, a decision that led directly to the groundbreaking Emulator I.
  However, concepts from the Audity's architecture later resurfaced in E-mu's Proteus series
  and eventually the Audity 2000 sound module.

  The sole existing unit resides at the CANTOS Music Foundation in Calgary, Alberta, Canada.
  Remarkably, the instrument was never fully completed and has reportedly never functioned
  as intended, making it a museum piece rather than a working instrument.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: 2 SSM chips per voice with multi-waveforms
  - Noise: 1 noise source per voice
  - Filter: SSM high-pass, low-pass, and separate resonant filter per voice
  - Envelopes: Dedicated VCO, VCF, and VCA envelope generators
  - LFO: Yes
  - Memory: Multi-patch storage
  - Keyboard: 61 keys
releaseDate: "1979"
