description: >-
  The Waldorf Quantum is a flagship hybrid synthesizer released in 2018 that combines
  digital and analog synthesis capabilities. It features three versatile stereo
  oscillators with five synthesis algorithms each, including wavetable, granular sampling,
  and resonator modeling. The 61-key instrument offers comprehensive sound design tools
  with dual analog filters, six LFOs, and a responsive touchscreen interface.
details: |-
  The Quantum's sound engine centers on three stereo digital oscillators, each capable of five distinct synthesis modes. These include Waldorf-style wavetables with SD card loading support, traditional synthesizer waveforms, granular sampling, resonator modeling, and additional specialized algorithms. This multi-mode approach enables sound designers to transition seamlessly between classic analog emulation and cutting-edge digital synthesis techniques.

  The instrument prioritizes both sonic capability and user interface design. A crystal-clear, responsive touchscreen facilitates parameter editing, while the front panel layout remains intuitive for hands-on sound creation. The keyboard features a high-quality FATAR TP8S keybed with 61 keys, complemented by dual analog filters and a digital filter section for comprehensive tone shaping.

  Waldorf invested considerable effort into the Quantum's physical presentation. The synthesizer features a sophisticated grey metal chassis with silver aluminum trim and wooden side panels. The control layout divides functionality into distinct sections for LFO, oscillator, display, filter, envelope, effects, and output areas.

  The rear panel provides comprehensive connectivity including headphone output, main and auxiliary outputs, audio inputs for sampling, pedal inputs, USB connections, SD card slot for wavetable and sample loading, and full MIDI I/O capabilities.
specs: |-
  - 8-voice polyphony
  - 8-part multitimbral
  - 3 stereo digital oscillators with 5 synthesis modes each
  - Wavetable, waveform, granular, resonator, and particle synthesis
  - Dual analog filters plus digital filter
  - Filter modes: low pass, high pass, band pass, notch, comb (12dB and 24dB slopes)
  - 6 independent LFOs
  - Arpeggiator with 7 algorithms
  - 61-key FATAR TP8S keybed
  - 4 GB internal flash storage
  - SD card slot for wavetable and sample loading
  - Touchscreen display
  - MIDI In/Out/Thru
  - Headphone output, main and auxiliary outputs
  - Audio inputs, pedal inputs, USB
