description: The Galileo 4K is the next chapter in the Galileo's history, keeping
  the Rangemaster-Vox pipeline intact while expanding the previous version's
  single Tone control into a two-band Baxandall EQ.
details: |-
  The Galileo 4K is the next chapter in the Galileo's history. It keeps the Rangemaster-Vox pipeline intact but expands the last version's equalization section into a two-band Baxandall EQ to surprising effect. The previous iteration of this circuit featured a solitary EQ control called "Tone" that acts as a treble control while fixing the low end. Swapping that arrangement for a standard AC30-style tone stack sounded far beyond a simple tweak. Now with the additional tonal flexibility, you can dial in a far greater variety of Vox-like tones that really bloom when pushed by an iconic treble booster circuit. All that same Galileo punch and bite you've come to expect remains untouched, adding a little flexibility to what was once a rather rigid circuit.
specs: |-
  - Two-band Baxandall EQ replacing the previous version's single Tone control
  - Controls: Treble, Volume, Bass, Gain
  - Treble control boosts from around 2kHz upward, cutting to -20dB at minimum
  - Bass control boosts from around 100Hz downward, cutting about -24dB at 200Hz at minimum
  - Accepts a 9-18V DC center-negative power supply supplying over 5mA
