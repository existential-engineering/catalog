details: |-
  Bearing Edge: The shape of the edge is one of the most important factors which affect drum sound. Because the drumheads provide the important source of vibration, the shape of the contact point of the head and shell determines and defines the sound. This is why TAMA has worked so extensively on achieving the most functional shape for the drum head and edge. Picture shows a sectional view of the drum's bearing edge. As shown in Part A, the angle of the top edge is set 2.5mm inside from the outer surface of the shell. The edge is cut to a round collar so as to follow the natural shape of the drumhead (B). This design, which creates a better fit between the drumhead and bearing edge, maximizes the resonance of drum.This bearing edge shape is part of our TAMA tradition and is crucial in providing TAMA's unique drum sound.

  Shells (Walnut/Birch): 6mm, 4ply Birch + 2 inner ply American Black Walnut The hybrid shell exhibits the focused attack of birch paired with the firm and warm of Walnut. This sound is not only punchy, but sweet and mellow. When you beat the drums once, excellent tone is surround you. The Walnut/Birch hybrid shell will make your drum life state of the art.

  Die-Cast Hoops: Made of die-cast zinc, TAMA's die-cast hoops deliver an incredibly sharp, solid rim shot that cannot be found in any other hoop.
