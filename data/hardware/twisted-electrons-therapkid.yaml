description: >-
  The Twisted Electrons TherapKid is a duophonic desktop synthesizer inspired by the Commodore 64's
  SID chip, combining the best tonal characteristics of both the 6581 and 8580 chip generations.
details: |-
  Released in 2019, the TherapKid builds on the legacy of Twisted Electrons' earlier TherapSid synthesizer. Where the TherapSid focused on emulating the Commodore 64's Sound Interface Device, the TherapKid takes a broader approach by blending the gritty character of the original 6581 chip with the stronger filter resonance of the later 8580.

  The architecture provides two voices with four oscillators each, capable of operating in duophonic mode for two simultaneous notes or mono mode with oscillator detuning for thicker timbres. Waveform options include pulse with variable width, both sawtooth directions, sine, square, triangle, and white noise.

  Under the hood, a 96MHz 32-bit processor drives a 16-bit DAC with oversampling and filtering. The synth includes a multi-mode arpeggiator, ring modulator, and dual LFOs with 48 possible modulation routing connections. Fifty presets come loaded in RAM alongside a random preset generator for sonic exploration.

  Housed in a powder-coated steel case, the TherapKid can run from USB power or batteries, making it a rugged and portable option for chiptune enthusiasts and experimental sound designers alike.
specs: |-
  - Polyphony: 2 voices (duophonic)
  - Multitimbral: 2 parts
  - Oscillators: 4 VCOs per voice
  - Waveforms: Pulse Variable, Saw Down, Saw Up, Sine, Square, Triangle, White Noise
  - VCA: 1 with ADSR envelope
  - LFOs: 2 with 48 modulation connections
  - Ring Modulator: Yes
  - Arpeggiator: Multi-mode
  - Memory: 50 patches (RAM)
  - Processor: 96MHz 32-bit
  - DAC: 16-bit with oversampling and filtering
  - Connections: MIDI In, USB
  - Power: USB or battery
releaseDate: "2019"
