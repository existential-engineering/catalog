description: >-
  The Teisco SX-400 is a four-voice analog synthesizer produced between 1981 and
  1982, comparable to the Roland Juno 6 but with superior expression controls.
  It features dual LFOs, a self-oscillating resonant filter, built-in ensemble
  chorus, and a 49-key keyboard with aftertouch. The SX-400 offers 8 factory
  presets and 8 user-programmable memory locations with CV/Gate connectivity.
details: |-
  The SX-400 distinguishes itself through advanced expression capabilities. Its aftertouch and handwheel can simultaneously trigger vibrato, cutoff frequency, and pitch modulation with adjustable speed and sensitivity, giving performers a level of real-time control uncommon in synthesizers of its era.

  The oscillator section provides sawtooth, pulse, and triangle waveforms across four octave ranges (16', 8', 4', 2'), along with sub-oscillator and noise oscillator options. Voices can be configured flexibly: four oscillators in mono mode, two in dual mode, or one in quad mode, allowing the player to trade polyphony for richer timbres.

  The filter is a 24 dB/octave resonant design capable of self-oscillation, with LFO and envelope generator modulation plus a reverse mode. Combined with the ensemble chorus effect and portamento, the SX-400 is well suited for lush pads, techno, and acid-style sound design.
specs: |-
  - Polyphony: 4 voices
  - Oscillators: 4 (configurable as 4 mono, 2 dual, or 1 quad)
  - Waveforms: Sawtooth, pulse, triangle
  - Octave ranges: 16', 8', 4', 2'
  - Sub-oscillator and noise oscillator
  - LFOs: 2 (one with frequency/delay/waveform; one simple sine)
  - Filter: 24 dB/octave resonant, self-oscillating with reverse mode
  - VCA: ADSR envelope with LFO modulation
  - Effects: Ensemble chorus, portamento
  - Keyboard: 49 keys with aftertouch
  - Memory: 8 factory presets, 8 user presets
  - Control: CV/Gate
  - Production years: 1981-1982
