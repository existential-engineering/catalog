description: The Billy Strings Wombtone analog phaser effects pedal from Chase
  Bliss collects multiple styles of phasing in one place, using a rich,
  all-analog signal path. You can now control the phasing directly with your
  playing, for responsive, fluid, and tightly-synced movement.
details: |-
  The Billy Strings Wombtone collects multiple styles of phasing in one place, using a rich, all-analog signal path. You can now control the phasing directly with your playing, for responsive and tightly-synced movement.

  Described as an Analog EnveloPhaser, this is Chase Bliss's first and only signature pedal, made in collaboration with Billy Strings. Billy began collecting original Wombtone units, and Chase Bliss partnered with him to revive and improve the design.

  Key improvements over the original Wombtone include envelope control functionality, a new slow mode, increased headroom, and an improved input stage using Burr Brown op-amps. The pedal features envelope control responsive to playing dynamics, internal modulation with ramping, and tap tempo with subdivisions.

  The Billy Strings Wombtone offers 2 internal presets and 122 presets via MIDI, with momentary or latching bypass and a 100% analog signal path with true bypass. It was a limited release of 3,000 pedals and has since been discontinued.
specs: |-
  - 100% analog signal path
  - True bypass
  - Envelope control responsive to playing dynamics
  - Internal modulation (ramping)
  - Tap tempo with subdivisions
  - Momentary or latching bypass
  - 2 internal presets
  - 122 presets via MIDI
  - MIDI control (PC and CC)
  - CV control
  - Expression control
  - External tap input
  - Dip switches for configuration
  - Improved input stage using Burr Brown op-amps
  - New slow mode
  - Increased headroom
  - 9V DC center negative power, ~200 mA draw
  - Limited release of 3,000 pedals
  - Mono I/O
