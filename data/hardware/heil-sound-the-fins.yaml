details: |-
  Product Overview

  The Fin by Heil Sound is a show-stopping live performance and broadcast dynamic microphone that blends iconic 1950s classic car grille styling with high-performance modern audio engineering. Engineered for vocalists, podcasters, streamers, and broadcasters who demand an extraordinary visual camera presence alongside professional studio audio quality, The Fin features a sleek chrome housing accented by internal LED lamps that glow dramatically when supplied with standard +48V phantom power.

  Underneath its retro aesthetic, The Fin incorporates a large dynamic element that delivers a wide 50 Hz to 18 kHz frequency response with a rich, natural low end and smooth high-frequency detail. Its cardioid polar pattern yields -30 dB of rear noise rejection at 180° off-axis, isolating the performer's voice from loud stage monitors, instrument bleed, and ambient room noise. With an extreme sound pressure handling capacity of 142 dB SPL, The Fin performs brilliantly on live vocal stages, video productions, high-profile broadcast studios, and major Hollywood movie productions including the Hunger Games franchise.

  The audio element inside The Fin is a passive dynamic cartridge and works completely without power. Standard +48V phantom power is required only to illuminate the internal decorative LED lights inside the body, and the internal wiring routes that voltage to the LED circuitry while isolating the dynamic element from DC voltage.

  The Fin features a built-in integrated mounting base threaded for standard 5/8″-27 microphone stands and boom arms, allowing easy positioning without needing a separate clip.
specs: |-
  - Iconic 1950s Retro Styling: Show-stopping chrome grille design inspired by classic automotive fins, delivering incredible visual impact for live stages, music videos, and video streams.
  - Internal Phantom-Powered LED Illumination: Four internal LED lamps light up the internal windscreen when supplied with standard +48V phantom power (note: audio element remains 100% dynamic and passive).
  - Large-Diaphragm Dynamic Element: Delivers a full-range 50 Hz to 18 kHz frequency response with natural vocal warmth, clear speech articulation, and smooth high-end extension.
  - High SPL Handling (142 dB Max SPL): Effortlessly handles high acoustic volume levels without clipping, distortion, or capsule overload.
  - Cardioid Polar Pattern (-30 dB Rear Rejection): Rejects unwanted off-axis stage noise, monitor bleed, and ambient room acoustics at 180° for maximum gain-before-feedback.
  - Internal Shock Mount & Dual-Mesh Windscreen: Integrated internal capsule isolation minimizes mechanical handling vibration and stand noise, while dual windscreen mesh protects against breath plosives.
  - Padded Aluminum Flight Case Included: Comes complete with a heavy-duty aluminum carrying case and custom foam insert for safe transport and storage.
  - Element Type: Dynamic.
  - Frequency Response: 50 Hz to 18 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -30 dB.
  - Impedance: 600 ohms balanced.
  - Output Level (@ 1 kHz): -55 dB.
  - Max SPL: 142 dB.
  - LED Power Requirement: +48V phantom power (drives internal LEDs only).
  - Output Connection: 3-pin XLR.
  - Weight: 24.9 oz (705.9 g).
  - Included Accessories: Padded aluminum carrying case.
