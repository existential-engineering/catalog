description: Complete 3-input, 6-output loudspeaker management system with
  improved AutoEQ and AFS algorithms, Ethernet control via mobile devices, and
  32-bit floating point processing.
details: |-
  The DriveRack VENU360 is a 3-input, 6-output loudspeaker management processor that provides all necessary processing between mixer and amplifiers to optimize and protect loudspeakers in installed and touring sound systems. It features improved AutoEQ and AFS (Advanced Feedback Suppression) algorithms for automatic speaker optimization.

  Ethernet control is supported via Android, iOS, Mac, and Windows platforms, enabling remote system configuration and monitoring. Updated setup wizards streamline system configuration for a wide range of loudspeaker configurations from major manufacturers.

  The unit features 24-bit A/D and D/A conversion with dbx Type IV Conversion System, 32-bit floating point internal processing, and operates at 48 or 96 kHz sample rates. Three inputs include two that are selectable between analog and AES digital. Up to 1000 ms of alignment delay is available per output channel.

  Output processing includes parametric EQ, crossover, limiting, and alignment delay per channel. The system delivers 114 dB dynamic range A-weighted and 110 dB unweighted.
specs: |-
  - Input Connectors: (3) female XLRs (2 selectable analog/AES digital), (1) female XLR RTA mic input
  - Output Connectors: (6) male XLR line outputs
  - Input Impedance: >30 kΩ, balanced line to line
  - Max Input Level: >+28 dBu, balanced, ≤1% THD
  - Output Impedance: 120 Ω, balanced line to line
  - Max Output Level: +22 dBu, balanced, ≤1% THD
  - A/D Converter: 24-bit with dbx Type IV Conversion System
  - A/D Dynamic Range: 117 dB A-weighted, 114 dB unweighted, 22 kHz BW
  - D/A Converter: 24-bit
  - D/A Dynamic Range: 116 dB A-weighted, 113 dB unweighted, 22 kHz BW
  - Internal Processing: 32-bit floating point
  - Sample Rates: 48/96 kHz (32-192 kHz using sample rate conversion)
  - System Dynamic Range: 114 dB A-weighted; 110 dB unweighted
  - THD+Noise: 0.0025% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, +0 / -0.5 dB
  - Latency (Analog): 2.57 ms (48 kHz), 2.28 ms (96 kHz)
  - Latency (Digital): 2.31 ms (48 kHz), 2.15 ms (96 kHz)
  - Alignment Delay: Up to 1000 ms per output channel
  - Operating Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption: 18 W
  - Weight: 5.48 lbs (2.49 kg)
  - Dimensions: 1.75" H x 8.0" D x 19" W
