details: |-
  The Austrian Audio OC818 is a large-diaphragm condenser microphone handcrafted in Vienna, Austria, built around the proprietary CKR12 ceramic capsule. It supports multiple polar patterns including cardioid, omnidirectional, figure-8, and hypercardioid, selectable on the microphone body. Its dual-output design — a standard XLR 3-pin main connector and a Mini XLR 5-pin secondary connector — enables simultaneous capture of both capsule membranes for post-production polar pattern manipulation.

  The OC818 features switchable low-cut filters at 40 Hz, 80 Hz, and 160 Hz, and a switchable pad offering -10 dB or -20 dB attenuation. With a maximum SPL of 148 dB (158 dB with pad) and a self-noise of just 9 dB SPL (A), it handles everything from delicate acoustic instruments to loud sources with ease.

  The microphone integrates with Austrian Audio's free PolarDesigner plugin, allowing users to morph polar patterns in post-production using data captured via the dual outputs. The optional OCR8 Bluetooth dongle enables real-time wireless control of polar patterns, pads, and filters via the PolarPilot smartphone app — a first for an analog professional microphone.

  Additional software tools include StereoCreator for stereo recording techniques in post-production, and AmbiCreator for Ambisonic soundscape creation. The OC818 has earned numerous industry awards including Sound on Sound Gear of the Year 2019, and comes with up to 5 years warranty when registered.
specs: |-
  - Frequency Range: 20 Hz – 20 kHz
  - Sensitivity: 13 mV/Pa
  - Equivalent Noise Level: 9 dB SPL (A)
  - Maximum SPL: 148 dB SPL (158 dB SPL with pad)
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 4mA, typical 2.1mA)
  - Main Connector: XLR 3-pin
  - Secondary Connector: Mini XLR 5-pin
  - Dimensions: 157 × 63 × 36 mm
  - Weight: 360g
  - Polar Patterns: Cardioid, Omnidirectional, Figure-8, Hypercardioid, and customizable presets
  - Low-cut filter: 40 Hz, 80 Hz, 160 Hz switchable
  - Pad: -10 dB, -20 dB switchable
  - Handcrafted in Vienna, Austria
  - Compatible with PolarDesigner, StereoCreator, AmbiCreator plugins
  - Optional wireless control via OCR8 Bluetooth dongle
