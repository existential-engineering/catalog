description: The SMS1 is a 2-way passive studio monitor/loudspeaker combining
  enjoyable voicing, great imaging, powerful dynamics, and solid bass response.
  It uses an acoustic suspension design for improved linearity over ported
  alternatives, and features precision-matched crossover components.
details: |-
  The SMS1 is a 2-way passive loudspeaker designed by Benchmark Media Systems for critical listening and studio monitoring applications. It employs a 170 mm custom copolymer low-frequency driver paired with a 25 mm soft dome tweeter, crossed over at 3 kHz. The acoustic suspension (sealed box) design was chosen over ported construction to deliver more linear bass response and improved transient accuracy.

  The crossover network is built to exceptional precision standards, using custom air-core inductors, Clarity Cap film capacitors, and non-inductive resistors — all matched to tight tolerances. A switch-selectable bi-amp mode is available via the NL4 SpeakON connector, allowing separate amplification of the high- and low-frequency drivers for added flexibility.

  The cabinet features removable side panels available in black or solid mahogany, with stainless mesh grills made from microphone-grade material. Every unit is designed, assembled, and tested in the USA. Recommended stand height is 36 inches floor-to-base for optimal listening position.

  With a nominal impedance of 6 ohms and 85 dB sensitivity (2.83V/1m), the SMS1 is intended for use with amplifiers in the 30–200 watt range. It pairs well with Benchmark's own AHB2 power amplifier.

  Benchmark has since discontinued the SMS1; units are no longer available for purchase.
specs: |-
  - Type: 2-way passive monitor with bi-amp capability
  - Woofer: 170 mm custom copolymer low-frequency driver
  - Tweeter: 25 mm soft dome high-frequency driver
  - Crossover frequency: 3 kHz
  - Crossover components: custom air-core inductors, Clarity Cap film capacitors, non-inductive resistors, precision-matched
  - Impedance: 6 ohms
  - Sensitivity: 85 dB (2.83V, 1m)
  - Frequency response: 44 Hz – 22 kHz
  - Recommended amplifier power: 30–200 watts
  - Enclosure type: acoustic suspension (sealed)
  - Input connectors: SpeakON NL4 4-pole twist-lock; two fully-insulated binding posts
  - Bi-amp mode: switch-selectable via NL4 connector
  - Dimensions (W × H × D): 10.75" × 13.5" × 9.87" (270 × 345 × 250 mm)
  - Recommended stand height: 36" (914 mm) floor-to-base
  - Weight per unit: 23 lbs (10.4 kg) with grill
  - Shipping weight (pair): 52 lbs (23.6 kg)
  - Finish options: black side panels (standard); solid mahogany side panels
  - Grill: stainless mesh (microphone-grade material)
  - Designed, assembled, and tested in USA
