description: In the early 1980s, there weren’t many options for acoustic
  guitarists to amplify their instruments.
details: |-
  In the early 1980s, there weren’t many options for acoustic guitarists to amplify their instruments. Most players would either put a mic in front of the guitar, which typically came along with feedback issues, use one of the horrid acoustic pickups available then, or mount one of the few soundhole magnetic pickups to fit in the soundhole and get a more “electric” sound. The LB6 was designed by master luthier and Baggs founder Lloyd Baggs to give players a more rich and rewarding sound from the guitar, while still minimizing feedback on stage without harming the acoustic sound of the guitar. The LB6 steadily gained popularity with players for its exceptional string-to-string separation, punchy attack, warmth, and solid feedback resistance. Decades later, the LB6 remains a top choice for all types of guitarists around the world.
specs: |-
  - Saddle-replacement pickup (one-piece pickup and saddle)
  - Passive (no preamp or power required)
  - Six sensors with inverted phase on two sensors for feedback cancellation
  - Strong output can plug directly into most amps and effects
  - Shapeable saddle material for intonation adjustment
  - Variants: LB6 (steel-string), LB12 (12-string), LB6X (nylon-string)
  - Requires professional installation
