description: >-
  The Crumar Stratus is a rare polyphonic analog synthesizer from 1982 that combines two
  instruments in one: a six-voice synthesizer and an organ synth with four drawbars, each
  with independent master volume controls. It represents a streamlined version of Crumar's
  Trilogy model, utilizing CEM chip technology common to premium synthesizers of the era.
details: |-
  Introduced in 1982, the Stratus represents a streamlined version of Crumar's Trilogy model. The instrument exemplifies Crumar's transition from its origins as an organ builder to becoming a synthesizer manufacturer. This dual-instrument design allowed musicians to access both traditional organ sounds and modern analog synthesis capabilities in a single compact package.

    The Stratus features an organ section with four horizontal drawbars controlling volumes across four octave ranges (2', 4', 8', and 16'), drawing on Crumar's heritage in organ design. The synthesizer section employs CEM chip technology, the same architecture found in competing instruments like the Jupiter, Prophet, and Oberheim OB-series synthesizers.

    The instrument's rarity in the marketplace has contributed to its status as a sought-after vintage piece. Its unique combination of organ and synthesizer in one platform distinguishes it from more conventional analog polyphonic synthesizers of the period.

    Originally shipped with paper preset template overlays featuring cutouts for all control knobs and markings indicating proper settings to recreate specific sounds, these served as a practical solution predating digital patch memory systems.
specs: |-
  - Keyboard: 49 keys, no velocity sensitivity or aftertouch
    - Polyphony: 6 voices
    - Oscillators: 2 DCOs per voice (sawtooth, square, or mix)
    - Oscillator features: Separate tuning, sync, mono/unison mode, alternate waveform mode
    - Organ section: 4 drawbars (2', 4', 8', 16' octave ranges)
    - Filters: 6 VCFs (one per voice) with cutoff, resonance, envelope amount
    - Amplifiers: 6 VCAs (one per voice)
    - LFO: Triangle/square wave with FM, VCF wah, VCA tremolo
    - Envelope: ADSR
    - Effects: Oscillator glide (portamento) with four direction modes
    - Controller: Joystick (pitch bend, VCF/VCA modulation)
    - Outputs: Independent organ and synthesizer outputs
    - Pedal inputs: Filter, sustain, LFO sync
    - Interface: TM Interface for Steiner Master's Touch wind controller
    - Patch memory: None (paper preset overlays included)
    - Chip technology: CEM
