description: Delay unit with analog filter and overdrive.
details: |-
  Inspired by a trip to Berlin's trailblazing music hardware trade show Superbooth, Coldcut's Matt Black and longtime friend Dr Walker, of the Liquid Sky artist collective and Air Liquide, envisaged the exciting possibilities of a custom hardware effects unit. The result is the Zen Delay, the first-ever hardware effects unit produced in collaboration with an electronic music label.

  Bringing together the best of the digital and analogue worlds, the Zen Delay is a BPM-synced stereo delay line, combining extreme feedback ranges for dub and experimental lo-fi effects with a multi-mode 24 dB synth filter and valve overdrive.

  Created and manufactured by Erica Synths, the unit is housed in a metal case with Erica Synths' signature bakelite knobs and a valve circuit for extra analogue warmth. While sonically versatile, it is incredibly easy to use, since each function has a physical knob to play with rather than a menu to scroll through on a tiny screen.

  Crafted in close collaboration with DJs and producers, the Zen Delay was developed with both live and studio use in mind and suits many different performance situations, musical styles and instruments. While most delay devices are designed as stomp boxes for guitarists, it is equally powerful in the hands of electronic music producers, artists and DJs, adding a warm and powerful sonic character to drum machines, loops, vocals, synths, samples or any other source. Even full tracks or a live stereo mix can be enhanced by the combination of analogue and digital circuitry.

  Connections are a stereo input on two standard jacks, a stereo output on two standard jacks, a CV input on a standard jack and a MIDI input on a standard MIDI socket. Delay times run from 1 to 5000ms, or from 1/8 to 8x of the clock or tap rate in beat mode.
specs: |-
  - Controls: delay time, feedback, delay mod (5 presets), tap button, dry/wet, bypass switch, filter cutoff, resonance, drive, input level, filter mode
  - Multi-mode 24 dB synth filter
  - Valve overdrive
  - Delay times 1-5000ms with 1/8...x8 of clock/tap rate in beat mode
  - Inputs Stereo In: 2x standard jack
  - MIDI In: standard MIDI socket
  - CV In: standard jack
  - Outputs Stereo Out: 2 x standard jack
  - Power 12v (power supply for worldwide use is included)
  - In/Out levels 3.2v peak to peak
  - DAC 114 dB dynamic range, -100dB THD+N
  - ADC 108 dB dynamic range, -98 dB THD+N
  - Dimensions 21 x 15 x 5 cm
  - Weight 870g
