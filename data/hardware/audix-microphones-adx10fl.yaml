details: |-
  The ADX10FL is characterized by a uniformly controlled cardioid polar pattern, helping to isolate the area or section being miked from other instruments or vocals on stage. With a smooth and accurate frequency range of 50 Hz – 18 kHz, the ADX10FL is lightweight, low profile, and will provide natural sound with an exceptional transient response.

  The ADX10FL cardioid condenser microphone works with the AUDIX wireless systems specifically for use with a flute, includes a clip that attaches to the headjoint of a flute, an 8' cable terminating to a miniXLRf connector.

  Manufactured to high standards and tight tolerances, the ADX10FL miniaturized condenser flute microphone features a modular threaded capsule, machined brass body with a matte black finish, high-quality shielded microphone cable, and a variety of optional accessories.

  Designed, assembled, and tested by AUDIX in the USA.
specs: |-
  - Polar pattern: Cardioid
  - Frequency response: 50 Hz - 18 kHz
  - Cable: 8' attached, mini-XLRf (TA3F) connector
  - Machined brass body, matte black finish
