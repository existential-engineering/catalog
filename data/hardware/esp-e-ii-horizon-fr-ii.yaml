description: "ESP E-II instruments, formerly known as “ESP Standard Series,” are
  made in Japan at the ESP factory by highly skilled builders. The ESP E-II
  Horizon FR-II in Gun Metallic Black finish looks every bit as tough and
  uncompromising as it sounds. This guitar is built with set-thru construction
  at 25.5” scale, giving you a smooth, unobstructed pathway to the highest
  frets. Its features include a mahogany body with maple cap, a three-piece thin
  U-shaped maple neck, and an ebony fingerboard with 24 extra-jumbo stainless
  steel frets. Components on the ESP E-II Horizon FR-II include black hardware,
  a Floyd Rose Original double-locking tremolo bridge, ESP strap locks, Gotoh
  locking tuners, and a set of outstanding and aggressive active pickups: the
  famous EMG 81 in the bridge, and an EMG 89R (splittable with reversed
  single-coil positioning) in the neck, both with brushed black chrome covers.
  Includes ESP form-fit case."
