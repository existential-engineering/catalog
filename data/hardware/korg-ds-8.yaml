description: >-
  Korg's 4-operator FM synthesizer from 1987, offering 8-voice polyphony with
  analog-style controls and built-in digital effects as a more accessible
  alternative to the Yamaha DX7.
details: |-
  The DS-8 was Korg's entry into the competitive FM synthesis market of the late 1980s, going up against the Roland D-50 and Yamaha DX7. It uses a 4-operator FM architecture with 8 voices of polyphony and 8-part multitimbrality, sharing the same YM2151/YM2164 OPM chipset found in several Yamaha instruments including the FB-01 and CX5M.

  Where the DS-8 distinguishes itself is in its user interface. Rather than the menu-diving approach common to FM synthesizers of the era, Korg provided analog-style envelope and LFO controls along with a performance section featuring three real-time sliders and a joystick for modulation and pitch bending. This made the DS-8 considerably more approachable for musicians accustomed to analog workflow.

  The built-in digital effects processor offers delay, chorus, flange, and double effects. The 61-key keyboard includes both velocity sensitivity and aftertouch, and the unit provides 100 user memory slots plus 10 multi patches with an external card slot for additional storage. The DS-8 excels at percussive timbres and unusual textural effects characteristic of FM synthesis.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 (4 FM operators per voice)
  - LFO: 1 (saw, triangle, square, sample & hold)
  - Filter: None
  - VCA: 4 DCA (1 per operator)
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 100 user patches, 10 multi patches, external card slot
  - Effects: 1 unit (delay, chorus, flange, double)
  - Control: MIDI (8 parts)
releaseDate: "1987"
