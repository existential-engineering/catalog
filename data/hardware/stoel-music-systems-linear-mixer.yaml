description: A Eurorack mixer with four inputs and one output, each input using
  a linear tapered level control best suited to mixing control voltages.
details: |-
  The Stoel Music Systems Linear Mixer provides four inputs and one output, each with a linear tapered level control knob. Linear controls are best suited to mixing control voltages. The Linear Mixer can be used to mix audio, but the response of the knobs will be somewhat different. The only difference between the linear mixer and log mixer is the response pattern of the knobs. Technical Specifications

  Width
  6 HP

  Depth
  21 mm

  Current Draw
  +12V: 4mA, -12V: 4mA, +5V: 0mA
specs: |-
  - Four inputs and one output
  - Each control is linear tapered
  - Used best for mixing CV sources
  - The only difference between the linear mixer and log mixer is the response pattern of the knobs
