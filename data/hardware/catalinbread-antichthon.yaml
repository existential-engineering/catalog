details: |-
  The Antichthon is an experimental tone-generating pedal from Catalinbread that blends fuzz and tremolo in an unconventional way. Its name references ancient Greek cosmology and modern multiverse theory, reflecting its aim to take players to alternate sonic universes.

  The Gravity control disrupts the grounding of the first stage, introducing harmonic complexity and unpredictability. At its minimum setting behavior remains relatively conventional, but as it increases the pedal becomes increasingly wild and experimental.

  The Space control is a bias knob that affects the "leanness" of the fuzz circuit, while the Time control governs the low-frequency processing. Together these controls allow for a wide range of fuzz and tremolo textures that defy traditional classification.

  This limited edition gold colorway is a final run of only 75 units of the now-retired Antichthon model. The pedal supports 9-18 volt negative tip DC power supplies.
