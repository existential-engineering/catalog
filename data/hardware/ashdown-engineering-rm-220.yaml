name: RM 220
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/rm-220
description: The Rootmaster RM220 is a compact, reliable bass head built for
  hard-working players on a budget. A classic 220W solid-state engine drives an
  ultra-low-noise instrument input with matching Input Level control, five-band
  rotary EQ, a Shape switch for instant classic Ashdown tone, a one-knob
  compressor, footswitchable tube-emulated overdrive, and a footswitchable
  Sub-Harmonic Generator. Rear-panel connections include an FX loop send and
  return, a DI output for PA or recording, a line input for backing tracks, and
  a combined Jack/Speakon speaker output rated to a minimum 4-ohm load.
details: |-
  220W solid-state bass amplifier head from the Rootmaster range, aimed at working bass players. Signal starts at an ultra-low-noise instrument input with an Input Level control to match the output of the bass, feeding five-band rotary tone controls and a Shape switch that dials in a classic Ashdown ABM tone setting. A simple one-knob compressor adds warmth and body, while a footswitchable tube-emulated overdrive ranges from warm grind to distortion, and a footswitchable Sub-Harmonic Generator adds a sub-octave for extra depth. The rear panel carries FX send and return sockets, a DI output for direct injection to a PA mixer or recording console, and a Line Input (with front-panel level control) for playing along with backing tracks. A combined Jack/Speakon socket with a minimum 4-ohm load partners with the Rootmaster cabinet range.
specs: |-
  - Power output: 220 watts
  - Power requirement: 115 - 230V
  - Speaker outputs: 2 x jack sockets
  - Frequency response: -3dB at 17Hz - 30kHz
  - High instrument input: impedance 3.9M Ohms, input range 150mV - 20mV p-p
  - Low instrument input: impedance 10k Ohms, input range 300mV - 40V p-p
  - Line input: impedance 10k Ohms, input range 300mV - 40V p-p
  - Tuner output: impedance 22k Ohms, level 0dBu nominal
  - DI output: 600 Ohms balanced, level -20dBu nominal
  - Minimum impedance: 4 Ohms
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving, plus Deep switch
  - Effects send: impedance 22k Ohms, level 0dBu nominal
  - Effects return: impedance 22k Ohms, level 0dBu nominal
  - Distortion: less than 0.5% THD
  - Signal to noise: better than 80dB (EQ flat)
  - One-knob compressor
  - Footswitchable tube-emulated overdrive
  - Footswitchable Sub-Harmonic Generator
  - Dimensions (H x W x D): 78 x 313 x 225 mm
  - Weight: 7.5kg
