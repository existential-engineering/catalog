details: |-
  CM49LE

  Accurate reproduction of the original M49 microphone. With a 9 pattern switch located on the power supply. Vintage capture with modern components

  Mic features:

  34mm K47 type capsule response. Traditional triode tube circuit typical of the M49C. We have substituted the soldered in tube for a 7 pin socketed 5654w/6J1. An output transformer with the same footprint and turns ratio as the original BV11a used in the M49C.
specs: |-
  - Pattern Selector: 9-pattern from power supply
  - Circuit type: Single stage class "A" tube, transformer coupled
  - Capsule: centre fed K47 single back-plate dual diaphragm
  - Capsule Polarization: 56V and rear diaphragm 0V in passive-cardioid
  - Tube type: 7-pin socketed military grade selected military 5654w/6J1 pentode strapped as a triode
  - Transformer: Full size BV11a dual bobbin footprint with 10:1 ratio.
  - Distortion: <.5%@20Hz/+10dBu and <0.05%@50Hz/+10dBu
  - Max SPL: 138dB
  - Frequency response: 25Hz-20kHz + or - 3db
  - Equivalent Noise Level: <14dB (A- weighted) selected tube
  - S/N Ratio: >86dB (Ref. 1Pa A-weighted)
  - Sensitivity: -32dBu
  - Output impedance <200 ohm (load impedance <1.2K)
  - Output connector: Male XLR, 7-pin gold plated
  - Switchable 120v-220v power supply
  - 15' Gold plated 7 pin cable
  - Heavy Duty shock-mount that easily and tightly clips on to the mic
  - Sturdy travel case
