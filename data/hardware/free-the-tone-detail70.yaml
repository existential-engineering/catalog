description: A Custom Shop limited production of the SILKY COMP SC-1, a
  compressor pedal whose special soldering process gives it a natural, glossy
  silky smooth sound, with an ATTACK control that reaches limiter territory at
  its highest setting.
details: |-
  As its name suggests, the SILKY COMP SC-1 was known for a silky smooth sound and for its playability, and it went out of production in 2018. The SILKY name then passed to SILKY GROOVE and the compressor was reborn with a sound matched to modern music, but many players asked for the original back, since its compressor sound cannot be replicated by any other pedal. In answer, a limited production of the SILKY COMP SC-1 is released through the Free The Tone Custom Shop.

  SILKY COMP achieved a special, natural and glossy silky smooth sound that revolutionized the concept of compressor pedals, through a unique soldering method used during printed circuit board assembly. It produces a flowing, natural connection between notes in arpeggios and a sharp groove in cutting. The ATTACK control allows a wide range of sound-making, and turned fully clockwise it lets the pedal work as a limiter.

  Effect on and off switching uses a special true bypass method in which the signal passes through only one circuit of the switch when the pedal is bypassed.

  Development began with the goal of a compressor that could produce sharpness and groove in clean cutting. Creating groove with a compressor needs a musically superior attack speed and release time, and the design was referenced against recording equipment such as the NEVE 33609, with attention to how the guitar sounds different depending on the release time setting. It is a subtle area, but release time is a crucial element in a band sound, and trial and error eventually found a satisfactory point.

  For sound quality the aim was the smooth, glossy tone the name promises. Solder and parts were changed in many ways without a satisfying result until a special board manufacturing method was discovered; the details are proprietary and the process is time consuming, which limits production volume, but it cannot be omitted. The SC-1-CS is finished with an appearance designed for musicians: the die-cast case is unpainted, the characters and other markings are printed on labels and attached by hand individually, and each unit carries a handwritten signature by the developer, Yukihiro Hayashi, inside the back cover.
specs: |-
  - Input impedance: 330 kOhm
  - Output load impedance: min. 200 kOhm
  - Controls: SUSTAIN, ATTACK, LEVEL
  - ATTACK turned fully clockwise allows use as a limiter
  - Special true-bypass method in which the signal goes through only one line when the switch is in Bypass mode
  - Terminals: 2x 1/4-inch phone jack (for input and output), 1x DC9V input jack (for AC adapter)
  - Power supply: 9-volt battery (PP3/006P) or AC adapter
  - Current consumption: approx. 4 mA
  - Dimensions: 115D x 72W x 50H mm (incl. protuberances such as footswitches, jacks, etc.)
  - Weight: approx. 215 g (excl. battery)
  - Unpainted die-cast case with hand-applied label markings and a handwritten developer signature inside the back cover
  - Accessories: warranty card, manual, 4x rubber feet
