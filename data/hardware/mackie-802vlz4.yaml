description: Mackie 802VLZ4 8-Channel Ultra-Compact Analog Mixer.
details: |-
  Meet the desk-friendly 802VLZ4. Equipped with the perfect combination of pro features and channel count while keeping the size small enough for any desk, the 802VLZ4 is suited to home recording, broadcast, content creation and more.

  The 8-channel 802VLZ4 features the proven performance of Mackie's flagship Onyx mic preamps in a desk-friendly, ultra-compact design. From every input to every output it is built for high headroom and low noise.

  Channels 1 and 2 are mono channels with XLR mic inputs, 1/4 inch line inputs, channel inserts and an instrument switch. Channel 3 also carries an XLR mic input, and channels 3-4, 5-6 and 7-8 are fully balanced stereo line pairs.

  The output section carries main outs on both 1/4 inch TRS and XLR jacks with a level switch on the XLR pair, an ALT 3-4 stereo bus output, stereo control room outputs, a balanced aux send, a stereo return pair, RCA tape in and out, and a 1/4 inch headphone jack.

  A control room and phones source matrix chooses between the main mix, the ALT 3-4 stereo bus, soloed channels and the tape input. Power comes from an external AC adapter.
specs: |-
  - 3 boutique-quality Onyx mic preamps with ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20Hz to 50kHz)
  - Improved RF rejection perfect for broadcast applications
  - Phantom power for condenser mics
  - 8 high-headroom line inputs
  - Selectable instrument inputs on first two channels, no DI box needed
  - 3-band EQ (80Hz, 2.5kHz, 12kHz)
  - 18 dB/oct 100Hz low-cut filter on mic input channels
  - Aux send, level, pan and PFL solo on each channel
  - Stereo return for connecting FX processor or other stereo source
  - ALT 3/4 stereo bus for added routing flexibility
  - Control room / phones source matrix
  - High-resolution 12-segment stereo meters
  - Maximum levels: mic in +21 dBu, tape in +22 dBu, main mix XLR out +28 dBu
  - Power consumption 13 watts
  - External supply input 100-240V~ 50/60Hz, output 12.0 VDC 2000 mA
  - Dimensions (H x W x D): 1.8 x 8.9 x 10.7 in / 47 x 227 x 273 mm
  - Weight: 4.5 lb / 2.0 kg without power supply, 5.5 lb / 2.5 kg with
