id: _h-tM4LdM7noJXo_X2gCR
name: MZ-223
manufacturer: tascam
primaryCategory: mixer
categories:
  - rack-mount
url: https://tascam.com/us/product/mz-223
description: 5-channel rackmount multizone mixer designed for small-format
  installation applications, enabling versatile multi-zone audio routing,
  mixing, and segregation of several audio sources simultaneously. Suited for
  moderate-sized hotels, restaurants, meeting rooms, and schools. Features three
  independent zone outputs, five input channels with RCA stereo pairs, two
  front-panel mic XLR combo inputs, talkover function, 3-band EQ per output, and
  stereo LED level meters per output.
details: |-
  5-channel rackmount multizone mixer. 2U form factor. Three independent output zones each with XLR balanced (mono) and RCA stereo unbalanced connectors. Five input channels, each with an RCA stereo pair (10 RCA jacks total). Two front-panel XLR/TRS combo mic inputs with talkover function. Independent 3-band EQ per output and per microphone input. Stereo LED level meters per output. External power supply (PS-M1524 AC adapter included).
specs: |-
  - - Frequency response: 20Hz–20kHz
  - Distortion: 0.03% or less; S/N ratio: 80dB; Crosstalk: 65dB
  - MIC input impedance: 33kΩ; Line input impedance: 22kΩ
  - Main output impedance: 200Ω
  - Headphone output: 50mW+50mW at 32Ω
  - Dimensions: 482(W) x 88(H) x 93.2(D) mm; Weight: 2.5 kg
  - Power consumption: 35W; Power supply: AC 100–240V 50/60Hz via TASCAM PS-M1524 adapter
