details: |-
  Developed in close collaboration with Tom S. Englund, the Dellinger Prominence-TSE is built to deliver exceptional articulation, versatility, and character — from crushing riffs and soaring leads to rich, expressive cleans. Its MB3 construction combines a maple centre with Australian Blackwood wings, producing a balanced, highly defined voice with tight lows, focused mids, and cutting highs. At its core is the custom PH-R-TSE bridge pickup, engineered to retain the aggressive output and dark character of the original PH-R while adding enhanced low-mid punch and a tighter bass response, particularly in drop C tuning. A 5-piece walnut/maple neck and ebony fingerboard provide outstanding stability and playability, while luminlay side markers ensure visibility on any stage. An intuitive 3-way on-on-on selector offers quick, intuitive access to a versatile range of tones. Signature details include striking red stripe and Roman numeral inlays, a matching red-bobbin bridge pickup, Tom ' s engraved rear control panel signature, and a Charcoal Grey Black Burst finish with a metallic silver Caparison logo — combining understated elegance with unmistakable stage presence. " This is my dream guitar - Every detail has been obsessively refined until it felt exactly right — from the rich, resonant Australian blackwood body to the custom pickups we developed in-house. We left nothing to chance. The goal was simple: extract the absolute best in tone, sustain, dynamics, and playability possible from the instrument. "I wanted Caparison ' s legendary build quality and precision, fused with everything I ' ve learned across 35 years of recording in the studio and tearing it up onstage. The result is a guitar that doesn ' t just meet expectations — it elevates them. "This instrument brings out the very best in you as a player … but it also demands your best in return. It inspires. It calls to you. It pushes you to play with more feel, more fire, and more intention. Every time I pick it up, I feel driven to create, to push further, to chase that next great sound." - Tom S. Englund
