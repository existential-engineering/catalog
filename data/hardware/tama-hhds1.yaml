description: The HHDS1 Dyna-Sync Hi-Hat Stand features the same length footboard
  and dual linkage connection as the Dyna-Sync bass drum pedal, providing
  unparalleled feel with extreme accuracy. The newly developed Spring Damper
  aides in reducing the contact noise commonly caused by the abrupt release of
  the footboard.
details: |-
  6-Way Tension Adjustment: Six different levels of tension can be achieved quickly by using the six easily visible settings.

  Quick-Set Hi-Hat Clutch (US.PAT.NO.9812101): With just one touch, the Quick-Set Clutch can be attached or removed - simply push the button on the side of the clutch. The clutch also allows the top hi-hat cymbal to float more freely, maximizing the natural resonance of the cymbals.

  Non-Loosening Tension Rod: Specially shaped plastic and metal nuts fit together perfectly to keep the cymbal rod from loosening while playing.

  Tilt System: Not only do Tilt equipped stands offer more flexible set-ups, they also offer more expressive hi-hat work because you can tilt the hi-hat cymbal. Dyna-Sync hi-hat stands can be tilted quickly and easily by loosening just one T-Bolt.

  Duo-Spike: It's called a stand because it's not supposed to "walk"-and our Duo-Spike makes sure your Iron Cobra hi-hat stands in one place. You can easily switch from rubber to metal by using a standard drum key.

  Spare-The-Rods Tension Rod Protector: No more tension rods getting bent out of shape during transport! With Spare-The-Rod, you can save your tension rod the rigors of the road by packing it in the specially designed upper section pipe. It's a small, but very significant TAMA hardware innovation. Insert the tension rod into the upper tube. Hold the tension rod in place with the hi-hat clutch. Done. The upper tube covers the tension rod.
