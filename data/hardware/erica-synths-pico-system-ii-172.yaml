description: Erica Synths Pico System II is the world’s smallest modular synthesizer.
details: |-
  Pico System II is a complete desktop modular synthesizer built from Erica Synths Pico modules, described by the maker as the world's smallest modular synthesizer.

  In functionality it matches the Pico System I, but several additions to the Pico Series prompted a revision. The system gained the Pico Voice as a sound source for greater timbral diversity, and the Pico Modulator, which replaces the separate Pico EG and Pico VCA. That freed 3HP, filled with a second Pico A MIX for more direct control of the sound sources in live performance.

  The module complement is the SEQ 16 step sequencer with 16 pattern memory, the VCO with 32 custom waves in two banks and an LFO mode, the VOICE with eight sound generation algorithms, the Polivoks inspired VCF1 lowpass and bandpass filter, TRIGG as a four trigger pattern generator and master clock, two DRUMS modules playing 64 samples with three CV controllable parameters, MULTI2 for buffered audio, CV and clock splitting, RND for LFO and random events, MOD for linear and logarithmic ASR envelopes with a linear VCA, two three input MIX modules, the DSP stereo effects processor with eight custom effects, and the OUTPUT module with its headphone amplifier.

  Web based apps extend two of those modules. The TRIGG pattern designer uploads user patterns, and the DRUMS app, together with the included Pico Programmer, uploads user sound samples.

  The unit measures 240mm by 140mm by 80mm, draws 500mA from a universal 110 to 240VAC to 12VDC adapter, and weighs 1,35kg without the PSU or 1,85kg with the PSU and patch cables. In the box are the external PSU, the Pico Drum Programmer, a wrench key and 20 patch cables.
