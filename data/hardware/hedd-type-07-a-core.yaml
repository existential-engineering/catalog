name: TYPE 07 A-CORE
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-07-a-core
description: 'A 2-way active monitor with a pure analog signal path, the TYPE 07
  A-CORE pairs HEDD''s AMT tweeter with a 7" honeycomb woofer for clear mids and
  highs and deep, natural bass in small to medium rooms.'
details: |-
  The TYPE 07 A-CORE delivers professional-grade monitoring through a pure analog signal path, eliminating converters and software dependencies for low-latency operation. It is well suited to recording situations, home studios, and compact spatial-audio configurations. A 7-inch custom honeycomb compound woofer and a handcrafted Air Motion Transformer tweeter achieve exceptionally clear midrange and high-frequency reproduction alongside deep, natural bass.

  The monitor features a tuned analog filter board with continuously adjustable high and low shelving EQ (±6 dB), allowing users to adapt the response to their room acoustics and personal preference. Its plug-and-play design eliminates complex setup, and a physical front-panel standby switch provides simple operational control.

  Construction emphasizes premium component quality and durability, with assembly completed in Berlin using heavy-duty MDF finished in black satin. The speaker is mounting-ready for Atmos installations and carries a 5-year warranty upon registration plus a 30-day satisfaction guarantee.
specs: |-
  - Configuration: 2-way active nearfield monitor, pure analog signal path
  - Woofer: 7" custom honeycomb compound
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequency: 2,200 Hz
  - Frequency response: 38 Hz - 50 kHz
  - Maximum SPL: 116 dB per pair at 1 m
  - Amplification: 2 x 100 W ICEpower Class D
  - Shelving EQ: hi/low, ±6 dB continuous
  - Cabinet: heavy-duty MDF, black satin finish
  - Dimensions: 370 x 220 x 300 mm
  - Weight: 9.7 kg per unit
