description: The Darkglass NSG is a Noise Gate Spot Series effects pedal, a
  response to extraneous noise in a bass rig. An adjustable threshold control
  filters out sounds below a set level so only the desired audio signal is
  heard.
details: |-
  The Darkglass NSG is a compact Spot Series noise gate pedal built to eliminate extraneous noise from a bass rig. Its adjustable threshold control filters out sounds below a certain level, allowing only the desired audio signal to pass through.

  The threshold is set with a push-knob that also toggles between two modes. Soft mode (blue LED) applies gentler gain reduction over a range of -65 dBV to -30 dBV, while Hard mode (red LED) applies more aggressive gate action over -45 dBV to +5 dBV.

  The pedal has a 1 MOhm input impedance and 100 kOhm output impedance. It draws about 60mA and must be powered from a regulated 9V DC adapter with a center-negative plug; unregulated supplies or higher voltages can degrade noise performance and damage the unit.
specs: |-
  - Bass noise gate pedal (Spot Series)
  - Adjustable threshold with push-knob mode toggle
  - Soft mode (blue LED): -65 dBV to -30 dBV gain reduction
  - Hard mode (red LED): -45 dBV to +5 dBV, more aggressive
  - Input impedance: 1 MOhm; output impedance: 100 kOhm
  - Dimensions: 50mm W x 36.5mm L x 100mm H, 205g
  - Power: regulated 9V DC, center-negative, ~60mA
