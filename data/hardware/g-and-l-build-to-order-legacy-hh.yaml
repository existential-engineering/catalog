details: |-
  The G&L Legacy HH is an excellent choice for players who need a twin-humbucker bolt-on guitar in their arsenal. This Legacy nails the target with a G&L AS4255 in the neck position and AW4470 at the bridge. These guitars major in rock and minor in blues, and with the mini-toggle coil split, plenty of convincing single coil tones are on tap to expand the potential of this versatile axe.

  The Legacy HH brings all of the Legacy features, starting with Leo's PTB (Passive Treble and Bass) system which functions on all three pickups for dramatically more variety than the vintage setup. The Legacy HH also features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm. The Legacy HH's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Neck - AS4255; Bridge - AW4470
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 3-position pickup selector, mini-toggle coil split for both pickups, volume, treble, bass (PTB system)
  - Includes: G&L Deluxe Gig Bag
