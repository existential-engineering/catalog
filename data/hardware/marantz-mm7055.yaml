description: The MM7055 is a refined amplifier with ample power for the most
  demanding home theater setups and delivers exceptional musical clarity.
details: |-
  The MM7055 is a refined amplifier with ample power for the most demanding home theater setups and delivers exceptional musical clarity. Marantz sound experts meticulously designed this unit to deliver precise power and accurate musicality, with five channels of Class A/B amplification rated at 140 watts each.

  In practical terms, the MM7055 is ideal for a 5.1 home theater system, whether based on a moderately powered receiver or a surround sound processor. A massive power supply includes a multiple-secondary EI-core transformer and over 65,000 µF of custom-designed energy storage capacity.

  Physically, the MM7055's output stages mount on an extruded aluminum thermal tunnel for efficient heat dissipation, and the amplifier uses Marantz current feedback topology with fully discrete amplification throughout.

  Balanced inputs and single-ended RCA inputs are both supported, and either type of input can be chosen for each channel individually for easy and flexible connectivity. Audiophile grade, gold-plated four-way binding post speaker terminals insure tight connections to the chosen speaker wire.
specs: |-
  - Number of channels: 5
  - Power output: 140W (20Hz-20kHz, 0.08%)
  - S/N ratio: 105dB
  - Frequency response (analog in): 8Hz-100kHz (+/- 3dB)
  - Current feedback topology: Yes
  - Discrete amplification: Yes
  - Power transformer: large capacity EI
  - Main amplifier in: balanced and unbalanced, 5ch (exclusive use by a selector switch)
  - Speaker systems: 6-8 ohms, gold-plated four-way binding posts
  - DC triggers: 1 in / 1 out
  - D-Bus Remote (RC-5) in / out: 1 / 1
  - Flasher in / IR receiver in / emitter out: 1 / 0 / 0
  - External control: No
  - Networking: No
  - Headphone out: No
  - Display off: blue LED illumination off mode available
  - Front panel: aluminum / glass-reinforced resin
  - Color: Black
  - Power consumption: 660W (standby 0.2W)
  - Dimensions (W x H x D): 17-3/8 x 7-3/16 x 15-1/8 in
  - Weight: 34.6 lbs
  - 3 year warranty
