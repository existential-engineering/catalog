name: iRig Stream Pro
manufacturer: ik-multimedia
primaryCategory: audio-interface
website: https://www.ikmultimedia.com/products/irigstreampro
prices:
  - amount: 199.99
    currency: USD
description: "iRig Stream Pro is a 24-bit, 96 kHz audio interface for iPhone,
  iPad, Android and Mac/PC. It offers an XLR mic preamp, stereo RCA, TRRS and
  device inputs (loopback) - plus advanced routing, convenient controls and
  total portability."
details: |-
  Features: 24-bit, 96 kHz audio interface, XLR/TRS combo input with +48V phantom power, Hi-Z instrument input via 1/4" jack, Stereo RCA line inputs, 3.5mm TRRS headset/mic input, Device loopback input, 2 headphone/line outputs, Stereo or 4-channel multichannel routing, Loopback+ processing feature, Direct monitoring with mute button, Front-panel LED level indicators, Powered by USB bus or 2x AA batteries, Compatible with iPhone, iPad, Android, Mac, PC, Includes Lightning, USB-C, and USB-A cables

  Included Software: iRig Recorder 3 LE (iOS/iPad/Android)

  Package Contents: iRig Stream Pro interface, Lightning to mini-DIN cable (60cm), USB-C to mini-DIN cable (60cm), USB-A to mini-DIN cable (60cm), 2x 1.5V AA batteries, Velcro strip
specs: |-
  - 24-bit A/D, 24-bit D/A conversion
  - Sample rates: 44.1 kHz, 48 kHz, 88.2 kHz, 96 kHz
  - 2-in/2-out or 4-in/2-out audio interface
  - Line input: 2x RCA (unbalanced), nominal -10 dBV, 10 dB headroom
  - Line input impedance: 16.5 kOhms
  - Line input frequency response: 20 Hz - 20 kHz (-1.5 dB)
  - Microphone input: balanced XLR, impedance approx. 2 kOhms
  - Microphone gain range: 40 dB
  - Microphone frequency response: 20 Hz - 20 kHz (-1 dB at min gain, -3 dB at max gain)
  - Phantom power: +48V (+/- 4V)
  - Instrument input: 1/4" TS Hi-Z, impedance 1 MOhm
  - Instrument gain range: 28 dB
  - Instrument frequency response: 20 Hz - 20 kHz (-1 dB at min gain, -3 dB at max gain)
  - Headset output: 1/8" TRRS (CTIA wiring)
  - Dimensions: 123 x 67 x 40 mm (4.84" x 2.63" x 1.57")
  - Weight: 146 g
  - Power: USB bus powered or 2x AA batteries
