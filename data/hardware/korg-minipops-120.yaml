description: >-
  The Minipops 120 is a fully analog preset drum machine from 1976, featuring six drum
  sounds and 16 rhythm patterns. It was the last and most advanced entry in Korg's Mini
  Pops line before the more capable KR-55 replaced it. Two case variants were produced,
  one in wood and another in tolex.
details: |-
  The Minipops 120 arrived in 1976 as the flagship of Korg's Mini Pops drum machine range. It offered six analog drum voices with 16 preset rhythm patterns, making it one of the more capable rhythm units of its era. Korg produced two case variations — one in wood and another covered in tolex.

  The front panel provides a power switch doubling as volume control, a balance knob, and a fade out/in button that gradually decreases volume over either six or twelve seconds. A central tempo knob controls the playback speed, while the lower section houses rhythm selector buttons that can be combined to mix multiple patterns simultaneously.

  The rear panel includes outputs for guitar amplifier and hi-fi connections, along with jacks for start/stop, fade out/in, and manual footswitch control. Despite having no user-programmable patterns or patch memory, the 120 delivers a characteristically rough analog charm that distinguishes it from Korg's later, more polished drum machines.

  As a collector's piece, the Minipops 120 holds nostalgic appeal, though its age makes repairs increasingly difficult. It represents an important step in Korg's evolution toward more sophisticated rhythm instruments.
specs: |-
  - Type: Fully analog drum machine
  - Polyphony: 6 voices
  - Multitimbral: 6 parts
  - Patterns: 16 preset patterns, 1 user pattern (non-saveable)
  - Controls: Power/volume switch, balance knob, tempo dial, fade in/out button with dual timing (6s/12s), rhythm selector buttons, rhythm adjustment knobs
  - Outputs: Guitar amplifier output, hi-fi output
  - External control: Start/stop footswitch jack, fade out/in footswitch jack, manual jack
  - Case options: Wood case or tolex covering
