description: >-
  The Triadex Muse is an algorithmic sequencer-synthesizer from the early 1970s, designed by MIT artificial intelligence researchers Marvin Minsky and Edward Fredkin. Its eight slider switches drive digital logic circuits capable of generating over 14 trillion unique melodic sequences.
details: |-
  Created in 1972, the Triadex Muse occupies a unique place in electronic music history as one of the earliest instruments to apply concepts from artificial intelligence to music composition. Its designers, Marvin Minsky and Edward Fredkin, were prominent figures in the MIT AI community, and the Muse reflects their interest in emergent complexity arising from simple rule-based systems.

  Rather than using a traditional keyboard, the Muse employs eight 40-position slider switches to control digital logic circuits and algorithms. Four sliders determine note intervals while the remaining four shape the overall thematic character. The resulting sequences can be extraordinarily long, potentially taking years to cycle back to their starting point, making the instrument a fascinating tool for generative composition.

  The sound engine itself is straightforward: a single VCO producing a square wave, with controls for tempo, pitch, fine pitch, and rest. A bar-graph lamp display provides visual feedback of the sequence state. Multiple Muse units can be daisy-chained together via proprietary connections for more complex performances, though the instrument lacks any standard CV/Gate or MIDI connectivity.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO, square wave
  - Interface: 8 slider switches (40 positions each)
  - Sequences: Over 14 trillion possible combinations
  - LFO: 1 LFO with tempo control
  - Filter: None
  - Envelope: None
  - Controls: Tempo, pitch, fine pitch, rest
  - Memory: None
  - Connectivity: Proprietary In/Out for daisy-chaining
