description: >-
  One of Roland's flagship 1990s workstations, combining 64-voice polyphony, a
  76-key semi-weighted keyboard, 16MB of expandable PCM sounds, and a
  full-featured onboard sequencer.
details: |-
  Released in 1996, the Roland XP-80 sat at the top of Roland's XP workstation lineup, sharing its sound engine with the JV-1080, JV-2080, XP-60, and XP-50 while adding a premium 76-key semi-weighted keyboard for a more realistic playing experience. A large 320x80 pixel backlit display made navigation and editing considerably more comfortable than the smaller screens found on competing workstations.

  The sound architecture delivered 64 voices of polyphony through four oscillators per voice, drawing from 16MB of PCM ROM that could be expanded to 80MB via SR-JV80 expansion boards. Available expansion sets covered orchestral, techno, vintage synth, world instruments, and bass/drum categories, making the XP-80 adaptable to virtually any musical genre. The resonant four-pole filter offered highpass, lowpass, bandpass, and peak modes with 12dB/octave slope.

  The onboard sequencer stored up to 60,000 notes across 100 patterns, providing a self-contained composition environment. Three effects processors delivered 40 multi-effects types plus dedicated reverb, chorus, delay, ring modulation, and distortion. Memory held 512 preset and 128 user patches, 64 preset and 32 user performances, plus 8 preset and 2 user drum kits.

  The XP-80 found a remarkably wide audience, used in contexts ranging from concert halls to electronic music events. Its combination of professional-grade sounds, playable keyboard, and comprehensive sequencing made it one of the definitive workstations of the mid-1990s.
specs: |-
  - Polyphony: 64 voices
  - Oscillators: 4 per voice (digital PCM subtractive)
  - Sound ROM: 16MB (expandable to 80MB via SR-JV80 boards)
  - Keyboard: 76 semi-weighted keys with velocity and aftertouch
  - Filter: Resonant 4-pole, 12dB/octave (HP, LP, BP, peak)
  - Sequencer: 60,000 notes, 100 patterns
  - Effects: 3 processors (40 MFX types, reverb, chorus, delay, ring mod, distortion)
  - Memory: 512 preset / 128 user patches; 64 preset / 32 user performances; 8 preset / 2 user drum kits
  - Control: MIDI (16 parts)
  - Display: 320x80 pixel backlit LCD
