  6-channel installation grade digital mixer.

  The DJM-1000 is a 19 inch rack-mountable installation-grade mixer that breaks exhilarating new ground in digital audio. Delivering superior digital sound with a 96 kHz/24-bit sampling rate and 96 kHz/32-bit processing, the DJM-1000’s digital input-output terminals allow compatibility with other Pioneer CDJ and DVJ decks. Straightforward connection to effectors and samplers enable the professional DJ to put more variety in his performance. Other indications of this mixer’s huge potential include a capacity to digitise analogue input without deterioration of sound quality. The unit has a robust chassis to minimize unnecessary vibrations. In combination with the R-core Power transformer , the DJM-1000 delivers a powerful and ultra-clear sound. The DJM-1000 is a true titan among mixers. Its fusion of first-class digital audio and vast connectivity options make it a must-have for all professionals.
specs: |-
  - 6-channel installation grade digital mixer
