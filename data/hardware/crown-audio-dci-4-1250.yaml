description: Four-channel, 1250W @ 4Ω Analog Power Amplifier with 70V/100V
  constant voltage capability. Part of the DriveCore Install series for
  professional installation applications.
details: |-
  The DCi 4|1250 belongs to the DriveCore Install Analog series — high-performance installation amplifiers engineered with proprietary DriveCore technology. The 4-channel configuration delivers 1250W per channel into 4Ω in a compact 2RU rack chassis.

  Direct drive constant voltage outputs (70V/100V rms) eliminate the need for step-up transformers, and channel-independent Hi-Z/Low-Z selection provides flexible speaker configuration per channel. Channel pairs are bridgeable even in 100V rms mode for additional system design flexibility.

  A remote on/off interface eases integration with control systems, continuously variable forced-air cooling keeps the unit quiet under load, and an advanced Power Factor Correction (PFC) universal power supply ensures efficient operation worldwide.
specs: |-
  - Output Channels: 4
  - Output Power (4Ω, Dual Mode): 1250W
  - Output Power (Bridge Mono, 4Ω–16Ω): 2500W
  - Frequency Response (8Ω, 20Hz–20kHz): ±0.25dB
  - Total Harmonic Distortion (full rated power): 0.35%
  - Damping Factor (20Hz–100Hz): >1500
  - Load Impedance (Stereo): 2Ω–16Ω; 70/100Vrms
  - Load Impedance (Bridge Mono): 4Ω–16Ω; 140/200Vrms
  - Cooling: Continuously variable forced air
  - Max Fan Noise: 47 dBA @ 1M
  - AC Mains: 100V–240V ~ 50/60Hz (±10%)
  - Power Connector: 20A IEC
  - Dimensions: 483 × 89 × 432 mm (19″ × 3.5″ × 17″)
  - Weight: 13.60 kg (30 lbs)
