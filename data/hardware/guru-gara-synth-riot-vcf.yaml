specs: |-
  - The Riot VCF is an aggressively resonant low-pass filter designed to inject thick, creamy low-end and screaming resonance into your Eurorack system without overcomplicating your workflow. Inspired by the classic MS20 architecture and built around a punchy OTA (Operational Transconductance Amplifier) core, this Eurorack module delivers immediate sonic impact, allowing you to focus on crafting powerful sounds quickly and intuitively.
  - While its resonance is anything but tame – crank it up and experience a wild, untamed feedback that feels like a full-blown riot in your modular – the Riot VCF's straightforward design ensures you spend less time tweaking endless parameters and more time making music. Its focused functionality allows you to dial in powerful filtered tones and intense resonance with ease, simplifying your patching and freeing up your creative energy.
  - Don't let its ferocious nature fool you – the Riot VCF is surprisingly affordable, making potent sound design accessible to all Eurorack enthusiasts who value impactful results without unnecessary complexity.
  - Adding to its unique character, the Riot VCF features a striking front panel crafted with PCB art. This visually distinct module will not only simplify your sonic palette but also add a touch of industrial beauty to your rack.
  - The Riot VCF is ready to integrate into your system right out of the box and includes the necessary screws and a ribbon power cable, allowing you to immediately experience the power of focused simplicity.
