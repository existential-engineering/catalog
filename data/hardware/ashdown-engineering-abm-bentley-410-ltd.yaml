details: |-
  The ABM Bentley 410 LTD is a limited-edition 4x10 inch bass cabinet made for Ashdown's 5th anniversary to partner the ABM 500 EVO 5th anniversary head. It is covered in black suede-effect material with a grille design reminiscent of the famous Bentley car. Rated at 600 watts into 8 Ohms, it is loaded with four 10 inch Ashdown BlueLine drivers and an HF horn in a precision-tuned plywood cabinet. Ashdown BlueLine speakers are developed for a balance of power, transparency, and deep controlled low end without sacrificing mid-band attack or high-end brightness.
specs: |-
  - Power Handling: 600 Watts
  - Impedance: 8 Ohm
  - Speaker Configuration: 4 x 10 Ashdown BlueLine drivers plus HF horn
  - Finish: black suede-effect material, Bentley-style grille
  - Dimensions (H x W x D): 790 x 720 x 530 mm
  - Weight: 36 kg
