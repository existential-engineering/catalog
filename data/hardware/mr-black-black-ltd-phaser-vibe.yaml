description: A four-stage phase-shifter inspired by the vintage Univibe,
  sweeping from classic phaser tones through watery Univibe-style chorusing to
  true pitch-vibrato. A Jack Deville limited run of 83 pieces.
details: |-
  For years Mr. Black received requests to tackle the fickle sound of the old-time
  Univibe, and the Black LTD. Phaser Vibe is the result of a highly unconventional
  approach to that goal. The original Univibe was at its core a four-stage
  phase-shifter meant to simulate a rotary speaker, and while it never really
  sounded like a Leslie, it earned a lasting reputation of its own.

  The Phaser Vibe keeps the original Intensity control but adds tricks of its own.
  In place of the old Volume knob it simply balances output levels, and the
  original Chorus/Vibrato switch is replaced by a full 300 degrees of rotation
  offering countless shades of phase-shifting, Univibe-style chorusing, and, at
  the top of its travel, true pitch-vibrato executed the same way the original did.
  A mechanical true-bypass footswitch fully removes the circuit from the chain, and
  the range of available speeds has been drastically increased.

  At its heart the Phaser Vibe is a four-stage phase-shifter, but clever, unusual
  shift points break away from typical phaser sounds. Rather than keeping all
  phase-shift corners equal, it varies the relative phase of the LFOs driving each
  stage, producing the characteristic watery throb of a Univibe while retaining
  good fidelity and top-end content. That overlap begins around 3 o'clock on the
  Intensity control and increases to maximum.

  With both the Intensity and Chorus|Vibrato controls near noon you get familiar
  vintage phaser tones, and as the Chorus|Vibrato control is raised, pitch-vibrato
  begins to dominate (higher Speed settings are recommended for vibrato tones). The
  Speed control runs from slow and sweeping counter-clockwise to fast and wiggly
  clockwise. Jack Deville original design, limited run of 83 pieces.
specs: |-
  - Four-stage phase-shifter with Univibe-inspired shift points
  - Controls: Intensity, Chorus|Vibrato (300-degree rotation), Speed
  - Sweeps from phaser through Univibe chorusing to true pitch-vibrato
  - Mechanical true-bypass footswitch
  - Limited run of 83 pieces
  - Jack Deville original design
