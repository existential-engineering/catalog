description: A semi-hollow electric guitar with a carved mahogany top and back
  delivering warm, well-rounded tone. It features custom gold foil humbuckers
  and a Goldo LT1 tremolo for expressive vibrato with tuning stability.
details: |-
  Inspired by the original Harmony H72 of the '60s, the Comet is the first semi-hollow electric in the Harmony lineup. The tremolo version brings expressive vibrato to the same double-cutaway platform. A carved mahogany top and back deliver a warm, well-rounded, acoustic-leaning tone. A center block helps minimize feedback at higher gain, while the long-tenon set neck enhances sustain through extended phrases. Custom Gold Foil humbuckers cover everything from clean rhythm work to driven leads, with a push/pull master volume that engages out-of-phase tones for a brighter, more hollow voice when needed. The Goldo LT1 tremolo adds smooth, musical flutter while maintaining tuning stability through both subtle nuance and expressive playing, ideal for surf, rockabilly, indie, blues, and any style built on movement. A six-in-line headstock preserves the iconic H72 silhouette, while premium hardware throughout ensures the Comet is ready for the road.
