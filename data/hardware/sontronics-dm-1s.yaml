details: |-
  Capture incredible detail from drums with this condenser microphone for snare. The Sontronics DM-1S is your passport to drum sound perfection, guaranteeing incredible and unmatchable results from your snare, whether you're in the studio, at home or on the road. It will capture all the unmistakable characteristics of your drums, from the crack of the initial hit and the sizzle of your snare. DM-1S also sounds superb on other percussion instruments such as cajón, djembe, bongos, tabla, congas and more. The DM-1S features a -10dB pad switch, making it capable of withstanding an impressive 135dB SPL, enough to cope with even the most heavy of hitters! FEATURES

  Key Features

  IDEAL FOR

  The DM-1S is perfect for:

  TECH SPECS

  Technical Specifications

  Frequency Response

  WHAT'S INCLUDED

  What's in the Box?
specs: |-
  - Small-diaphragm condenser: Specifically designed for capturing the punch and clarity of snare drums with precision.
  - Cardioid Polar Pattern: Offers focused sound capture, isolating the snare drum from other kit elements and reducing bleed from nearby instruments.
  - Tailored Frequency Response: Optimised to bring out the crisp attack and detailed tone of the snare, ensuring it cuts through the mix.
  - High-SPL Capability: Handles high sound pressure levels without distortion, making it perfect for loud snare hits in both live and studio environments.
  - Durable Construction: Built to withstand the rigours of frequent use and aggressive playing, ensuring long-lasting reliability.
  - Low-Profile Design: Compact size makes it easy to position on the snare drum, even in tight setups, without interfering with the drummer's performance.
  - Versatile Mounting: Designed for flexible mounting options, making it suitable for different snare drum setups and angles.
  - Excellent Transient Response: Captures the fast, sharp transients of the snare drum, preserving its dynamic and lively sound.
  - Trusted by Professionals: Preferred by drummers and engineers for its ability to deliver a powerful, consistent snare drum sound in any setting.
