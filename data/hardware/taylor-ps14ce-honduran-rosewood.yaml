description: The PS14ce is a Grand Auditorium acoustic-electric from Taylor's
  Presentation Series, featuring a Sinker Redwood top with Honduran Rosewood
  back and sides, V-Class bracing, and ES2 electronics with California Vine
  inlays and a radius armrest.
details: |-
  The PS14ce Honduran Rosewood is part of Taylor's Presentation Series — the brand's top tier of production guitars — built around a Grand Auditorium body with a Venetian cutaway. The Sinker Redwood top pairs with four-piece Honduran Rosewood back and sides in a Simmons wedge configuration, delivering warm, complex tone rooted in rare tonewoods.

  Patented V-Class bracing underpins the top, yielding enhanced sustain, intonation, and volume compared to traditional X-bracing. The Expression System 2 (ES2) behind-the-saddle pickup captures the guitar's natural acoustic voice for stage performance.

  Presentation Series appointments include West African Crelicam Ebony fretboard, bridge, and binding; California Vine inlay across fretboard and peghead; ebony bridge pins with green abalone dots; and a radius-style armrest for extended-play comfort. Gotoh 510 tuners and a Rosewood pickguard complete the build.

  The guitar ships with a deluxe hardshell case. Gloss finish on top, back, and sides; satin on neck. Scale length 25-1/2".
specs: |-
  - - Body Shape: Grand Auditorium with Venetian Cutaway
  - Top: Sinker Redwood (gloss)
  - Back & Sides: Honduran Rosewood, 4-piece Simmons wedge (gloss)
  - Bracing: V-Class
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Binding: West African Crelicam Ebony
  - Fretboard Inlay: California Vine
  - Armrest: Radius-style
  - Pickguard: Rosewood
  - Scale Length: 25-1/2"
  - Nut: Tusq
  - Saddle: Micarta
  - Bridge Pins: West African Ebony with Green Abalone Dots
  - Tuners: Gotoh 510
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Deluxe hardshell case included
