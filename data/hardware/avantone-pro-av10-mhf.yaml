details: |-
  The AV10 MHF is a replacement high-frequency tweeter driver engineered as a
  direct drop-in replacement for the discontinued Yamaha NS-10M studio monitor
  and Avantone's own CLA-10 and CLA-10A speakers.

  Reverse-engineered to match the original frequency response and voicing, the
  AV10 MHF is physically and dimensionally identical to the originals,
  requiring no cabinet modifications for installation. Updated materials ensure
  environmental compliance while preserving the sound characteristics that made
  the NS-10M a studio standard.
