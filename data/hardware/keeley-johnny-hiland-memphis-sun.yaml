details: |-
  The Johnny Hiland Memphis Sun is a limited signature run of the Memphis Sun, cosmetically redesigned by Johnny Hiland in vintage sea foam green with a white and gold racing theme. Hiland uses the pedal for Danny Gatton and rockabilly tones, combining small room reverb and slapback echo with a double-tracked harmony.

  The Memphis Sun is a lo-fi reverb, echo and double-tracker, the second studio-themed pedal in the Keeley line after the Keeley 30ms ADT. A toggle selects between three effect presets: SLAPBACK 600 for long echoes, SUN MODE for automatic track doubling and short slapback, and ROOM for the studio reverb simulation. Both the echo and Sun modes also carry the one-knob room reverb.

  In SLAPBACK 600 the delay time reaches 666ms. Filtering is done in stages, heavily filtering the response at 1 kHz, compressing, then filtering again at 1 kHz, with second and third order harmonics added to simulate tape response and equipment distortion. Regen gives up to around three repeats and Reverb sets the room reverb.

  SUN MODE provides automatic double tracking in mono, with the Time control running from 0 to 180ms so that low settings double-track and higher settings move into slapback. Regen there sets both the rate and depth of the tape modulation and can be turned off. In ROOM the reverb simulates a small 33 by 18 foot tiled room, with Time acting as 0 to 150ms of pre-delay, Regen as an active tone filter and Reverb as the depth control.
