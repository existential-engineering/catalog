description: The AG 500 is a 500-watt Class D bass amp head designed for
  bassists seeking a pristine, hi-fi sound that is both articulate and
  responsive. It delivers transparent tone that allows the natural voice of your
  bass to shine clearly with high clarity, dynamic range, and fast transient
  response.
details: |-
  The AG 500 is a 500-watt Class D bass amplifier head built around a solid-state
  preamp designed to deliver pristine, hi-fi tone. Its transparent character allows
  the natural voice of your bass to come through clearly, making it well-suited for
  players who prefer an articulate and responsive foundation rather than a colored
  or warm sound.

  The AG 500 features a 4-band parametric EQ with Bass (±17 dB @ 40 Hz), Low Mid
  (±15 dB @ 300 Hz), High Mid (±14 dB @ 800 Hz), and Treble (±14 dB @ 4 kHz)
  controls. It also includes Deep and Bright broadband boost switches for quick
  tonal shaping without adjusting individual EQ bands.

  For recording and live applications, the AG 500 offers dual XLR DI outputs that
  are switchable between pre and post EQ, giving engineers and performers flexible
  signal routing. A ground lift switch is included on the XLR output to eliminate
  hum from ground loops.

  The amp includes Aguilar Cabinet Suite software with IR loading capability,
  allowing players to use cabinet emulation for direct recording or silent stage
  performance. An effects loop (series, +6 dB gain) and tuner output round out
  the signal chain options.

  The AG 500 is compact and lightweight at 4.2 lbs and 3 inches tall, making it
  highly portable. It features dual variable-speed whisper fans for cooling and a
  universal mains voltage power supply, supporting a 2.67 ohm minimum speaker load.
specs: |-
  - Power Output: 500 watts
  - Preamp: Solid State
  - Power Section: Class D
  - Bass Control: ±17 dB @ 40 Hz
  - Deep Boost: +6 dB below 250 Hz
  - Low Mid: ±15 dB @ 300 Hz
  - High Mid: ±14 dB @ 800 Hz
  - Treble: ±14 dB @ 4 kHz
  - Bright Boost: +6 dB above 3 kHz (shelving)
  - Input Pad: -10 dB
  - Input: One 1/4-inch jack (active/passive compatible)
  - Speaker Output: One Neutrik Speakon
  - Dual XLR outputs (pre/post EQ selectable)
  - Effects Loop: Series; adds 6 dB gain
  - Aux input
  - Headphone output with mix control
  - Tuner output
  - Ground lift switch on XLR output
  - Cooling: Two variable-speed whisper fans
  - Universal mains voltage power supply
  - Minimum speaker load: 2.67 ohms
  - Dimensions: 10.75" × 8.5" × 3" (W×D×H)
  - Weight: 4.2 lbs (1.9 kg)
  - Cabinet emulation via Aguilar Cabinet Suite with IR loading
