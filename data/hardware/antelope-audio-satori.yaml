details: |-
  Introducing the second generation of Satori, an improved version of Antelope Audio's TEC Award-winning monitoring controller. Maintaining its legacy of digitally controlled true analog monitoring and summing, the new Satori Gen 2 brings further advancements, making it an even more essential tool for modern studios.

  Satori Gen 2 provides a neutral signal path, effortlessly switching and routing between sources while maintaining the clarity of analog sound. With Antelope Audio's expertise in designing pristine analog circuits and optimizing power supply technology, Satori Gen 2 achieves mastering-grade transparency, making it perfect for both professional and project studios.

  A fully reworked attenuator now offers 0.25 dB precision, allowing you to achieve exact stereo accuracy and balanced L/R channels even at lower listening levels. This fine-tuned passive signal path preserves audio signal integrity and ensures all the subtle nuances of the sound are fully realized, reducing popping or zippering artifacts when adjusting volume to practically zero.

  Satori Gen 2 features a fully analog 4-channel summing mixer with available volume, solo, mute and pan controls for each input. The analog summing functionality allows engineers working in-the-box to experience a natural blend of instruments and dynamics, akin to mixing on a classic analog console, while maintaining the punch, headroom, and natural sound that engineers love.

  Satori is bundled with a bus-powered remote control – R4S. The remote is specially designed for Satori, completely replicating the front panel functionality. It provides engineers with ease and ergonomics, controlling Satori directly from the mix position, allowing quick control of all sources and monitors, as well as talkback.
