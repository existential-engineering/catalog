description: Powerful and portable speaker in Vintage Black, complete with
  Dynamic Loudness and 360 degree True Stereophonic sound.
details: |-
  Emberton III's rugged design means you can throw it in the back seat of your car, take it on a cross-country ride, or hit the beach, completely stress free. While you're busy living life to the fullest, you'll also experience absolute 360 degree sound. Designed and engineered in Sweden. Made in China.

  Marshall signature sound: Emberton III features more bass than its predecessor. Dynamic Loudness adjusts the tonal balance as you change the volume. Discover a rich, full sound that'll never let you down.

  True Stereophonic: available exclusively on Marshall products, True Stereophonic is a unique form of multi-directional sound. This is absolute 360 degree sound, where the music finds you.

  32+ hours of portable playtime: that's more than a full day of listening on a single charge. When you do run out of battery, just plug in your speaker and return to full charge in 2 hours. An IP67 dust and waterproof rating means you can submerge Emberton III in 1 m (3 ft) of water for up to 30 minutes.

  Built-in microphone and Bluetooth LE Audio-ready: Emberton III comes with a built-in microphone, making hands-free talking simpler and clearer, and is built to be Bluetooth LE Audio-ready, opening up audio sharing with Auracast. Marshall also offers authorised repair services and spare parts for Emberton III through its website.
specs: |-
  - Marshall signature sound: perfectly balanced audio at every volume
  - True Stereophonic (360 degree sound): superior spatial and binaural sound
  - 32+ hours of portable playtime on a single charge
  - Dust and waterproof: IP67 rating, submersible for up to 30 minutes at 1 m (3 ft)
  - Built-in microphone for hands-free talking
  - Bluetooth LE Audio-ready
  - Driver type: dynamic
  - Frequency range: 65 to 20,000 Hz
  - Drivers: 2" 10 W full range, 2 passive radiators
  - Stereo/mono: stereo
  - Maximum sound pressure level: 90 dB SPL at 1 m
  - Cabinet principle: sealed with passive radiator
  - Power amplifiers: 2 x 38 W Class D amplifier
  - Wireless connectivity: Bluetooth 5.3 LE
  - Bluetooth range: up to 100 m in free field
  - Bluetooth multipoint connectivity: yes
  - Top panel controls: multi-directional control jog, on/off button, Bluetooth pairing button, battery indication
  - Weight: 0.67 kg / 1.5 lb
  - Width: 160 mm / 6.3"
  - Height: 68 mm / 2.7"
  - Depth: 76.9 mm / 3"
  - Water resistance: IP67
  - Battery: 32+ hours play time, 2 hours charging time, 20 minutes charge gives 6 hours of playtime
  - Country of origin: designed and engineered in Sweden, made in China
  - Compatible app: Marshall Bluetooth app (iOS and Android)
  - Box contents: Emberton III speaker, USB-C charging cable, user manual and legal and safety information, strap (included with Emberton III in Brown only)
