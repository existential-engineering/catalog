description: alpha compressor is a modern classic and has been a powerful tool
  for professional dynamic editing since its release in 2008.
details: |-
  alpha compressor is a true stereo analog mastering compressor built on fully discrete Class-A circuitry. It offers control over audio dynamics for individual tracks as well as for a final mix, and was designed with mastering engineers in mind: stereo imaging, transient shaping and detailed dynamic control, with an integrated M/S matrix and a Mix knob for parallel compression.

  The Feed Forward and Feedback function switches the feed of the sidechain either behind (feedback) or in front (feed forward) of the compressor section, which has a strong effect on the character of the compression. Feedback mode is smooth and even and goes up to a moderate ratio of 1:2.5, while feed forward mode provides much higher values that also allow limiter settings and even negative ratios. An Auto Fast mode shortens the chosen attack time automatically on fast and loud signal impulses.

  Gain reduction is handled by elysia's fully discrete and temperature compensated Passive Current Attenuator (PCA), whose core consists of sixteen discrete transistors held at a defined temperature. The PCA works purely passive and only reduces incoming signals, with a downstream amplifier stage converting the current back into voltage and a separate stage adding make up gain. The T16 Heater keeps up to 16 discrete transistors in a massive copper ring at a constant temperature to reduce thermal fluctuation, so the unit benefits from a warm-up time.

  Tone shaping comes from an audio filter of the Niveau (Tilt EQ) type, which changes the proportions between high and low frequencies around a selectable center frequency, boosting treble up to +3 dB while attenuating bass by up to -5 dB, or the reverse. A sidechain filter allows frequency-dependent shaping of the compression process, acting as a 6 dB high pass or 6 dB low pass on the detection circuit, and the integrated M/S matrix encodes and decodes mid and side so stereo width can be influenced and specific parts of a mix addressed.

  A Soft Clip limiter based on discrete transistors catches short, transient-like signals, rounding peaks in the manner of an analog tape machine rather than cutting them off, which protects A/D converters from clipping. The unit is housed in a custom 19 inch enclosure with matched conductive plastic potentiometers at 21 steps for precise recall, and each unit is built to order and tested at elysia's headquarters in Germany. Rear-panel XLR inputs and outputs serve the left and right channel, and a mains module combines the line cord connector, on/off switch, fuse holder with 230/115 VAC voltage selector and a line filter.
specs: |-
  - Mastering compressor with stereo and M/S operation
  - Class-A technology with discrete circuit designs
  - Switchable feed forward or feedback sidechain feed
  - Feedback mode up to a ratio of 1:2.5, feed forward allowing limiter settings and negative ratios
  - Auto Fast mode shortens attack time on fast, loud impulses
  - Parallel compression built in with mix blend function
  - Sidechain filter with blend function (6 dB high pass or low pass)
  - Tilt equalizer (Niveau Filter) for tone control, up to +3 dB treble boost and -5 dB bass cut
  - Integrated M/S encoder and decoder matrix
  - Soft Clip limiter to prevent A/D converters from clipping
  - Passive Current Attenuator (PCA) with sixteen discrete, temperature compensated transistors
  - T16 Heater holding up to 16 discrete transistors at a constant temperature
  - Matched conductive plastic potentiometers with 21 steps for precise recall
  - Built-in brightness control for the blue and white front-panel LEDs
  - Frequency response: <10 Hz - 200 kHz (-0.5 dB)
  - THD+N @ +15 dBu, 20 Hz - 22 kHz: 0.0039 % stereo direct, 0.009 % stereo compressed, 0.014 % M/S direct, 0.034 % M/S compressed
  - Noise floor, 20 Hz - 20 kHz (A-weighted): -95.8 dBu stereo direct, -89.3 dBu stereo compressed, -95.6 dBu M/S direct, -92.3 dBu M/S compressed
  - Dynamic range, 20 Hz - 22 kHz: 122 dB stereo mode, 118 dB M/S mode
  - Maximum input level: +28 dBu stereo mode, +23 dBu M/S mode
  - Maximum output level: +27 dBu stereo mode, +28 dBu M/S mode
  - Impedance: 10 kOhm input, 68 Ohm output
  - Dimensions (W x H x D, incl. knobs): 483 mm x 133 mm x 405 mm (19" x 5.3" x 16")
  - Weight: 16 kg (35 lbs)
  - Power consumption: 85 Watts
  - Mains module with line cord connector, on/off switch and fuse holder with 230/115 VAC voltage selector
