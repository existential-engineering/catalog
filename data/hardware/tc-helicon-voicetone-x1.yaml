description: Single-button vocal stompbox for megaphone, overdrive and
  distortion effects, with Style and Tone controls and three effect families
  under one switch.
details: |-
  The VoiceTone X1 provides the dirty side of a vocal sound: megaphone, distortion and overdrive, each voiced around the way a voice behaves under gain rather than ported from a guitar pedal. It runs inline with the microphone, so no front-of-house console work or plugin is needed.

  Three classic effect families sit under one switch, with Style and Tone knobs that can be adjusted between songs. The range runs from a clean megaphone tone suited to a radio-like passage, through an analogue-style overdrive, to heavier distortion.

  Connections are an XLR input and an XLR output, with phantom power for condenser microphones and a DC power input. True-bypass-style routing takes the pedal out of the signal path when the clean voice is wanted.
specs: |-
  - Three effect families: megaphone, overdrive and distortion
  - Style and Tone control knobs
  - Single-footswitch operation with true-bypass-style routing
  - Phantom power for condenser microphones
