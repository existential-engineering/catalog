description: These robust stands are made from heavy gauge tubing with oversized tube joints to minimize wobble.
details: |-
  Drum mounting hardware has to do two things really well: firmly hold up the drums and put them precisely where you want them. The 9000 Series tom stands are made from heavy gauge tubing with oversized tube joints to minimize wobble.

  Armed with a ball-and-socket adjustment for easy positioning, they offer virtually limitless options. Stands include 1/2″ diameter tom arms to work with DW TB12 brackets and an auxiliary clamp for mounting cymbals or other percussion accessories.

  Single tom and double tom versions, plus the 9934 and 9999 tom/cymbal models, are also available.
specs: |-
  - Heavy duty double tom stand
  - Heavy gauge tubing with oversized tube joints
  - Ball-and-socket adjustment
  - 1/2″ diameter tom arms for DW TB12 brackets
  - Auxiliary clamp for cymbals or percussion accessories
  - Hinged memory locks for easy setup
  - Plastic tube insulators to avoid rattling
