description: The SC305 is an active 3-way nearfield studio monitor from EVE
  Audio, pairing two 5" SilverCone woofers with the AMT RS3 tweeter and three 50
  W PWM amplifiers in a compact cabinet. It is designed for stereo and surround
  work and suits use as a center channel.
details: |-
  The SC305 was designed to be equally comfortable and precise in a stereo or a surround setup, and it works as a center channel. The nearfield monitor combines the power of three different amplifiers to deliver efficient, dynamic and low noise sound reproduction. EVE Audio develops its three-way systems for critical and detailed listening while still delivering power and deep bass.

  The three-way layout distributes the frequencies between the individual components to raise the efficiency of the system. In the SC305 one of the woofers delivers sound only up to 350 Hz, working as a kind of bass woofer, while the other covers a fuller range up to the 3000 Hz crossover frequency as a bass-midrange driver. Less effective physical work per woofer means less mechanical inertia and more efficient sound transmission.

  Both woofers use the proprietary 5" SilverCone also found in the smaller SC205, with the maker's low distortion copper cap magnet system. Because two of these woofers are used simultaneously, the frequency response reaches down to 50 Hz. The SC305 also uses the proprietary AMT RS3 tweeter, whose larger front plate and larger internal magnet drive the Air Motion Transformer with greater efficiency.

  Three 50 W PWM power amplifiers drive the system, for 150 W of output power per speaker. The DSP section assists in choosing the left and right hand speaker, so the pair stays symmetrical without having to be moved around, and a DIP switch on the rear of the speaker can temporarily lock the room adaptation settings. As with every other EVE Audio speaker, both balanced XLR inputs and unbalanced RCA inputs are provided.

  Room adaptation filters and volume are set from the front SMART-knob, a rotary encoder with an LED ring that displays the selected value, and the high-resolution DSP is fed by a high-quality A/D converter. The high-shelf, desk and low-shelf filters adjust in 0.5 dB increments, the LED ring brightness is adjustable, and settings can be locked so they are not changed by accident.
specs: |-
  - Frequency range: 50 Hz - 21 kHz
  - Woofer size: 5"
  - Max. SPL: 108 dB
  - Configuration: active 3-way nearfield studio monitor
  - Frequency range measured at -3 dB at 1 m distance
  - Sound pressure level: 108 dB max. SPL per pair
  - Output power: 150 W per speaker
  - Tweeter: AMT RS3
  - Output power tweeter: 50 W
  - Mid-driver: 5"
  - Output power mid-driver: 50 W
  - Woofer: 5"
  - Output power woofer: 50 W
  - Passive radiator: 5" diameter
  - Cross-over frequency: 350 & 3000 Hz
  - Protection limiter: Yes
  - Volume range: minus infinity to +6 dB
  - High-shelf filter: -5 dB to +3 dB above 3 kHz
  - Desk filter cut: -5 dB to 0 dB at 160 Hz
  - Desk filter boost: 0 dB to +3 dB at 80 Hz
  - Low-shelf filter: -5 dB to +3 dB below 300 Hz
  - Phase inversion: 0 degrees / 180 degrees
  - Input impedance: 10 kOhm
  - Power consumption: less than 1 W standby, 110 VA maximum
  - Dimensions: 425 x 180 x 250 mm (16.7 x 7.1 x 9.8 inches, WxHxD)
  - Weight: 8.5 kg (18.7 lb)
