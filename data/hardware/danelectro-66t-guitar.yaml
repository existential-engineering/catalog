details: |-
  Our 66 is killing it on stages and in studios across the globe. Now we add the Wilkinson tremolo and voila... the 66T. A toneful combination of large single coil and Lipstick Humbucker pair. Pull on the tone knob to coil tap the humbucker. One guitar you will cherish forever!

  The '66T pairs a reversed double cutaway offset horn shape with a semi-hollow alder body and center block, giving it a resonant voice with the feedback resistance of a solid body. A bolt-on maple neck with rosewood fretboard, 24.5" scale length, 14" radius and C profile keeps the feel familiar to vintage Danelectro players.

  Electronics are anchored by a dual humbucking Lipstick bridge pickup paired with a vintage style large housing single coil neck pickup, routed through a master volume, master tone (push-pull to split the bridge humbucker), and a 3-way pickup switch for a wide palette of tones.

  A Wilkinson vibrato bridge handles tremolo duties, while a graphite nut, nickel hardware and 3-on-a-side tuners round out the spec sheet. Available in 3-Tone Sunburst, Black, Blue Burst and Orange finishes.
specs: |-
  - Reversed double cutaway offset horn shape
  - Semi-hollow body with center block
  - Alder wood construction
  - Scale length: 24.5"
  - Fretboard radius: 14"
  - Neck shape: C
  - Nut: 1.65" (graphite nut)
  - Neck joint: Bolt-on
  - Neck wood: Maple with double acting truss rod
  - Fretboard: Rosewood
  - Number of frets: 22
  - Wilkinson vibrato bridge
  - Tuners: 3 on a side
  - Hardware: Nickel
  - 1 dual humbucking Lipstick bridge pickup
  - 1 vintage style large housing single coil neck pickup
  - 1 master volume
  - 1 master tone (with push-pull switch to split bridge pickup)
  - 3-way pickup switch
  - Finishes: 3-Tone Sunburst, Black, Blue Burst, Orange
