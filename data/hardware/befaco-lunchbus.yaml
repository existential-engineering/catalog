description: The LunchBus is an ultra-compact Eurorack power distribution bus
  board with an integrated power supply from Befaco. At only 23mm tall, it is
  designed to fit efficiently inside shallow Eurorack cases while delivering
  regulated +12V, −12V, and +5V power to modules via ribbon cable headers.
details: |-
  The LunchBus is Befaco's ultra-compact bus board solution for Eurorack modular synthesizer cases. It measures just 260mm × 100mm × 23mm, making it one of the smallest powered bus boards available, ideal for shallow skiffs and compact case builds.

  The board features horizontal ribbon cable connectors that sit flat against the bus board rather than protruding perpendicular to it. This orientation dramatically reduces the vertical space required inside a case, freeing up more depth for modules.

  The power input connector is a 2.5mm barrel jack, and the board accepts a wide input voltage range of 9–18V DC (a 45W adapter is recommended). The board delivers +12V at 0.80A, −12V at 0.80A, and +5V at 350mA to connected Eurorack modules.

  A front-accessible on/off button is strategically positioned for ease of use and to simplify the case assembly process. Both the power connector and button placement were designed specifically to make wiring the board inside a case as straightforward as possible.

  The LunchBus is designed and assembled in Barcelona by the Befaco team. It is available both as a fully assembled unit and as a DIY kit, consistent with Befaco's tradition of supporting the DIY modular synthesis community.
