url: https://mackie.com/en/products/in-ear-monitors/mp-series-in-ear-monitors/MP_360.html
description: Triple Balanced Armature Professional In-Ear Monitors with a 3-way
  crossover configuration and Knowles balanced armature drivers.
details: |-
  Breathtaking imaging, separation, and full-spectrum clarity, MP-360 Triple Balanced Armature IEMs with a 3-way crossover configuration must be experienced to truly comprehend what they are capable of. With drivers from Knowles, you can perform with confidence knowing that what's inside your IEMs are the best in the industry. Great for vocalists that need to hear themselves and their mix as faithfully as possible and makes listening to your favorite music a brand new experience.
specs: |-
  - Frequency Response: 20 Hz – 20 kHz
  - Impedance: 15Ω±15%
  - Transducer Type: Triple Balanced Armature
  - Sensitivity: 117dB±3dB@1mW at 1KHz
  - Sound Isolation: Up to 40dB
  - Driver Configuration: 3-way crossover with Knowles balanced armature drivers
  - Ergonomically molded low-profile enclosure
  - Clear enclosure design for streamlined appearance
  - Custom triple balanced armature drivers
  - Precision 3-way crossover
  - Shielded, braided cable with detachable MMCX connector
  - 4 ear tip types in 3 sizes (foam, silicone, wide-bore silicone, triple flange)
  - Includes hard molded case, gold-plated 1/8" to 1/4" adapter, additional braided cable with in-line remote, cleaning tool and cloth
