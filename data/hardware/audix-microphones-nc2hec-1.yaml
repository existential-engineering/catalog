details: |-
  The NC2HEC is a complete dual-channel Novacore digital wireless system for vocalists and presenters — everything needed to go from box to stage in a single purchase. It pairs the NCR2 Dual-Channel Digital Receiver with 2 x NCHH Digital Handheld Transmitters and 2x NCEC Extended Cardioid Wireless Capsule, delivering the natural vocal clarity and transient response AUDIX microphones are known for on a professional AES-256 encrypted UHF digital wireless platform.

  The NCEC extended cardioid capsule provides balanced, even-sounding vocal coverage across a wide dynamic range — ideal for lead vocalists, worship leaders, and presenters who move during performance. The NCHH transmitter and NCR2 receiver are pre-matched on the Novacore RF platform and pair via one-touch IR sync.

  The system operates across a 48 MHz UHF tuning range with less than 3 ms latency and 9+ hours of transmitter battery life on 2× AA alkaline or 1× NCLB rechargeable lithium-ion. USB-C charging is built into the NCHH transmitter body. The NCEC capsule is interchangeable — upgrade or swap to an NCTH Tight Hypercardioid at any time using the same "S" thread mount with no tools required. The system is fully expandable within the Novacore ecosystem by adding channels, transmitters, or receivers as needs grow.
specs: |-
  - Wireless platform: Novacore UHF digital
  - RF tuning range: 48 MHz (494-542 MHz)
  - Latency: <3 ms
  - Encryption: AES-256
  - Channels: Dual (NCR2 receiver + 2x NCHH handheld transmitters)
  - Transmitter battery life: 9+ hours (2x AA alkaline or 1x NCLB Li-ion)
  - Transmitter charging: USB-C
  - Capsule: NCEC Extended Cardioid (interchangeable S-thread)
