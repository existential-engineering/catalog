description: Compact super-cardioid shotgun microphone for videographers,
  vloggers, and field recording. Built around a back electret condenser element
  with a frequency response of 30Hz–20kHz, max SPL of 132dB, and a built-in
  160Hz low-cut filter. Powered exclusively via 48V phantom power through a
  3-pin XLR male connector.
details: |-
  Super-cardioid back electret condenser shotgun mic. Sensitivity −40dB ±3dB (0dB=1V/Pa @ 1kHz), output impedance 200Ω ±30%, max SPL 132dB (≤1% THD), S/N 74dB. Freq response 30Hz–20kHz. Built-in 3dB/octave low-cut filter at 160Hz. Requires 48V phantom power. 3-pin XLR male connector at base. Body: 23mm × 153mm, 53g. Includes windscreen, shock-mounted shoe clip, and soft case.
specs: |-
  - - Type: Back electret condenser; super-cardioid
  - Sensitivity: −40dB ±3dB (0dB=1V/Pa @ 1kHz)
  - Output impedance: 200Ω ±30%
  - Max SPL: 132dB (≤1% THD)
  - S/N: 74dB
  - Low-cut: 3dB/oct @ 160Hz
  - Freq response: 30Hz–20kHz
  - Power: 48V phantom
  - Connector: 3-pin XLR male
  - Dimensions: 23mm × 153mm; weight: 53g
