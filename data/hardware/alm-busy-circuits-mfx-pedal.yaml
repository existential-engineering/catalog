description: >-
  The ‘MFX Pedal’ brings all the effects and functionality of our popular
  Eurorack MFX module to both guitars and synths in standalone form with 18
  different fully featured effects programs and additional MIDI, Knob and
  Expression pedal control, tap tempo, an optional analogue gain stage and true
  relay (or DSP) based bypass. Inspired by our favourite classic hardware
  effects processors, the MFX incorporates DSP effect technologies from the dawn
  of digital effects in the 70s to the present day.
