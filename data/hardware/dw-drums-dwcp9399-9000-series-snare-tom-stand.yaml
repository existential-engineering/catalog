description: Our first snare basket stand designed specifically to hold rack toms.
details: |-
  The 9399 is DW's first snare basket stand designed specifically to hold rack toms. Each crutch tip includes an integrated Neoprene isolator for optimal resonance.

  The stand also offers a patented removable, offset basket for easy positioning and quick snare changes. The larger footprint is courtesy of a Mega-Tripod base that gives the 9399 the largest footprint of any DW snare stand.

  The result is a heavy-duty, road-worthy stand that gently supports rack toms and snare drums from 10-16″ in diameter.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
  - Snare/tom stand with integrated neoprene isolators
  - Mega-Tripod base for unsurpassed stability
  - Large reset handle and TechLock for easy and secure angle adjustments
  - Patented removable, offset basket
  - Holds rack toms and snare drums from 10-16″ in diameter
