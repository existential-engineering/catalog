description: For those seeking a powerful, straightforward summing mixer, or
  those who wish to expand the number of channels in their current analog
  summing rigs, meet the 2-BUS LT.
details: |-
  For those seeking a powerful, straightforward summing mixer, or those who wish to expand the number of channels in their current analog summing rigs, meet the 2-BUS LT. Built with the same award-winning active summing electronics that have made our head designer Chris Muth legendary, the 2-BUS LT strips away non-essentials in order to bring the world's best analog sound within reach of anyone. You get sixteen channels of pristine analog summing, dual stereo outputs to feed both your monitoring chain and your mix path, and an expansion port to link any of our summing mixers together for even more channels.

  Unlike passive summing boxes that require huge amounts of make-up gain to restore the lost audio, or line mixers with volume and pan pot controls masquerading as summing mixers, the active electronics in the 2-BUS LT result in what Dangerous users describe as a huge soundstage, holographic sound, and audible three-dimensionality. Panning is wide and precise, reverbs spacious and deep, bass powerful and engaging, treble and mids articulate and interesting.

  Many analog processors have been modeled in the digital realm, but analog summing remains impossible to emulate digitally. By summing individual tracks or subgroups of tracks with the 2-BUS LT's analog circuits, you get crystal clear sonic imaging and a wide-open soundstage, no matter how high your track count.

  When you buy analog equipment, you're making an investment that will hold its value for decades. Analog technology is time-tested and won't require an expensive upgrade, become incompatible with your computer or DAW, or start crashing.
specs: |-
  - Frequency Response: 1 Hz-100 kHz within 0.2 dB
  - Total Harmonic Distortion: 0.003% in audio band
  - Intermodulation Distortion: 0.004% IMD60 4:1
  - Crosstalk @ 1 kHz: -97 dB
  - Noise floor: -82 dBu total energy in audio band
  - Max level: +26 dBu
  - Nominal operating level: +4 dBu
  - Input impedance: 12 kohm balanced
  - Output impedance: 50 ohms balanced (600 ohm drive capable)
  - Power consumption: 25 watts
  - Hand built in the USA
  - Active analog summing circuits by designer Chris Muth
  - 16 channels of analog summing
  - Dual stereo outputs (Main Out + Mon Out)
  - Expansion port for linking multiple summing units
  - Compact, single rack space
