description: The F8n is an 8-channel, 10-track field audio recorder and mixer in an aluminium chassis, with eight locking XLR/TRS combo inputs, +24/+48 V phantom power and Advanced Look-Ahead Hybrid Limiters on every channel. It records BWF-compliant WAV at up to 192 kHz to two SD card slots and carries timecode in and out on BNC.
details: |-
  The F8n is an 8-channel, 10-track field audio recorder and mixer in an aluminium chassis weighing about two pounds without batteries. It records BWF-compliant WAV at 16 or 24 bits and sample rates up to 192 kHz, including 47.952 kHz and 48.048 kHz for HD video pull-up and pull-down work, as well as MP3 at 128, 192 or 320 kbps.

  Eight discrete inputs use locking Neutrik XLR/TRS combo connectors and take microphones, wireless packs or line-level devices, with +24/+48 V phantom power and mic or line level selectable on both the XLR and the TRS side. Any input can also serve as a camera return. The preamps reach 75 dB of gain with equivalent input noise of -127 dBu or less, and each channel has its own gain knob, six-segment LED meter and PFL/solo switch. A proprietary 10-pin MIC IN connector takes Zoom's interchangeable mic capsules and disables inputs 1 and 2 while in use, and a built-in slate mic with a front-panel switch records comments or sends a variable-frequency tone.

  Advanced Look-Ahead Hybrid Limiters add a one-millisecond delay so the limiter anticipates clipping before it is recorded, running on all eight channels at once at full resolution with 10 to 20 dB of headroom. Other processing covers high-pass filtering for wind noise, phase inversion, mid-side decoding, input delay of up to 30 ms per channel, output delay of up to 10 frames per output, and all-input to all-output routing. Zoom AutoMix adjusts mix levels automatically to pull down ambient sound, and a dual-channel mode doubles inputs 1 to 4 onto tracks 5 to 8 as independently trimmed safety tracks.

  Outputs are two balanced Main Outs on TA3 mini-XLR jacks, a two-channel Sub Out on a single unbalanced 1/8-inch stereo mini-jack for a camera feed, and a 1/4-inch headphone jack rated 100 mW per side with front-panel volume. Headphone signals can be routed to either side pre or post fader, switched to mono, and given alert tones for low battery or recording errors. Timecode input and output sit on BNC connectors driven by a temperature-compensated crystal oscillator accurate to 0.2 ppm on or off, with drop-frame and non-drop formats and Jam Sync.

  Two SD/SDHC/SDXC slots of up to 1 TB each can record at the same time for redundancy, and the unit can write to card and computer over USB simultaneously. USB modes cover an 8-in/4-out multitrack interface at up to 96 kHz and 24 bits, a 10-in/4-out interface-with-recording mode, and a driverless 2-in/2-out stereo mix mode, which is also the mode iOS devices use. Power comes from eight AA batteries, the included AD-19 12 V AC adapter or an external 9-18 V DC pack on a 4-pin Hirose connector, and the unit can switch sources at a user-defined voltage. Ambisonics mode adds A-to-B decoding, gain and setting linking, and a dedicated metering screen, and the F8 Control app for iOS and Android gives remote mixing, transport, metering and metadata entry over Bluetooth LE.
specs: |-
  - 8-channel/10-track field audio recorder and mixer, aluminium chassis, 2.2 lb (1000 g) main unit only
  - Inputs 1-8: XLR/TRS combo jacks (XLR 2 hot, TRS tip hot) with mic/line selectable per input
  - Mic input: gain +10 to +75 dB, impedance 2 kohm, maximum level +14 dBu at 0 dBFS with limiter on
  - Line input: gain -10 to +55 dB, impedance 2.6 kohm, maximum level +24 dBu at 0 dBFS with limiter on
  - Phantom power +24/+48 V at 10 mA maximum per channel
  - Equivalent input noise -127 dBu or less (A-weighted, +75 dB gain, 150 ohm input)
  - Frequency characteristics 10 Hz to 80 kHz, +0.5 dB/-1 dB at 192 kHz
  - A/D dynamic range 120 dB typ., D/A dynamic range 106 dB typ. (-60 dBFS, A-weighted)
  - Crosstalk -90 dB or less between adjacent channels at 1 kHz
  - MIC IN: Zoom mic capsule input, use disables inputs 1 and 2. Built-in slate mic assignable to any track
  - Main Out 1/2: TA-3 balanced, output impedance 150 ohm or less, reference -10 dBV normal or +4 dBu line, maximum +10 dBV normal or +24 dBu line
  - Sub Out 1/2: 3.5 mm stereo mini unbalanced, output impedance 100 ohm or less, reference -10 dBV normal or -40 dBV mic
  - Headphone: 1/4-inch unbalanced stereo, output impedance 15 ohm or less, 100 mW + 100 mW into 32 ohm
  - Advanced Look-Ahead Hybrid Limiters on all 8 channels, 1 ms look-ahead, 10 to 20 dB headroom
  - High-pass filter, phase invert, mid-side decoder, input delay up to 30 ms per channel, output delay up to 10 frames per output
  - Zoom AutoMix, dual-channel safety-track recording, pre-record of up to 6 seconds
  - Ambisonics mode with A-to-B decoding, gain and settings linking, dedicated metering screen
  - Recording media: dual SD card slots, SD 16 MB to 2 GB, SDHC 4 GB to 32 GB, SDXC 64 GB to 1 TB
  - WAV formats 44.1/47.952/48/48.048/88.2/96/192 kHz at 16 or 24 bit, mono/stereo/2-10 ch poly, BWF and iXML
  - Maximum simultaneous recording tracks 10 (8 inputs plus stereo mix), 8 at 192 kHz. MP3 at 128/192/320 kbps up to 2 tracks
  - Recording time on a 32 GB card: 30:51:00 at 48 kHz/24-bit stereo WAV, 7:42:00 at 192 kHz
  - Timecode on BNC, precision +/-0.2 ppm, input 0.2 to 5.0 Vpp into 4.6 kohm, output 3.3 Vpp from 50 ohm or less
  - Timecode frame rates 23.976ND, 24ND, 25ND, 29.97ND, 29.97D, 30ND, 30D with Jam Sync
  - USB 2.0: mass storage, multitrack interface 8-in/4-out at 44.1/48/88.2/96 kHz 16/24-bit, stereo mix 2-in/2-out at 44.1/48 kHz 16-bit driverless, interface with recording 10-in/4-out at 44.1/48 kHz
  - iOS audio interface operation supported in stereo mode only
  - Power: 8 AA batteries, AD-19 DC 12 V/2 A centre-positive adapter, or external 9-18 V DC via HIROSE HR10A-7R-4S 4-pin connector, with user-defined switchover voltage
  - Battery life: 6 h or more alkaline / 8.5 h NiMH / 12 h lithium at 2 channels 48 kHz 16-bit, 3.5 / 6 / 8 h at 8 channels 48 kHz 24-bit
  - Power consumption 15 W
  - Display: 2.4 inch full-color LCD, 320 x 240, with monochromatic mode and dedicated PFL display
  - Dimensions 178.2 mm (W) x 140.3 mm (D) x 54.3 mm (H)
