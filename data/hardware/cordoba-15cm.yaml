details: |-
  Córdoba's best-selling ukulele, the 15CM, was specially designed to offer players a stylish, easy-to-play, and high-quality instrument at an affordable price. Built with Mahogany top, back, and sides construction, the 15CM provides a rich, clear, and balanced tone. Aesthetic features such as an Abalone rosette and cream binding on both the body and fingerboard set this concert-sized ukulele apart from other models in its class. Additional features include a sleek satin finish, silver tuners with pearl buttons, and premium Aquila strings. Also available in Edge Burst finish with electronics (15CM-E) and in soprano (15SM) and tenor (15TM) sizes.
