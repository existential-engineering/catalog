details: |-
  The Meris Preset Switch is the easiest way to save and access up to 4 different sounds on Ottobit Jr, Mercury7, Polymoon, Enzo or Hedra pedals.

  Up to 4 presets can be accessed with instantaneous preset switching over a single TRS cable, included, and multiple pedals can be controlled with a simple Y cable, not included. The unit requires no external power and is designed to be placed aesthetically in front of two Meris pedals.

  A PCB socket for a mini Arduino supports DIY MIDI projects, not included, for the more adventurous tinkerers.
specs: |-
  - Easily access up to 4 presets with instantaneous preset switching
  - Compatible with Ottobit Jr, Mercury7, Polymoon, Enzo and Hedra pedals
  - No external power required
  - Connect with a single TRS cable (included)
  - Control multiple pedals with a simple Y cable (not included)
  - Designed to be aesthetically placed in front of 2 Meris pedals
  - PCB socket for mini Arduino DIY MIDI projects (not included)
  - Dimensions 8.5" wide, 2.25" deep, 2" tall
  - Weight 10 ounces
  - Includes 1 Flat 11" TRS cable
