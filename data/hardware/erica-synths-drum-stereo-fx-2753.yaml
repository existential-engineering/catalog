description: The STEREO FX module brings hi-fi stereo effects into the Erica
  Synths Drum Series. Based on our new DSP engine, the module provides a wide
  range of custom delay and reverb effects. CV control over various parameters
  and the ability to save up to 10 presets will make this module an integral
  part of any performance rack.
details: |-
  The Drum Stereo FX module brings hi-fi stereo effects into the Erica Synths Drum series. It runs on a DSP engine that was new to the range at launch and carries three delay and three reverb effects, all stereo.

  The effects were developed in collaboration with 112dB, the Dutch company behind a number of well regarded VST instruments, which is where the algorithms come from rather than from Erica Synths' own DSP work.

  Delay time runs from 3ms to 3s and follows either tap or clock synchronization, with divisions and multiplications of the synced time available in sync mode. CV control covers delay time, feedback and preset selection.

  Ten preset patches can be stored and recalled, which is what makes the module practical in a performance rack where there is no time to dial in a setting. Audio input level is -5V to +5V and CV level spans -5V to +5V across the full sweep.

  The module is 10HP wide and 35mm deep, drawing 123mA from the positive rail and 40mA from the negative rail.
specs: |-
  - Hi-Fi stereo FX module
  - 3 delay and 3 reverb effects
  - Tap and clock synchronization of delay time
  - Delay time divisions and multiplications in sync mode
  - 10 preset patches
  - CV control over delay time, feedback and preset selection
  - Developed in collaboration with 112dB
  - Audio input level -5V to +5V
  - Delay time 3ms to 3s
  - CV level (full span) -5V to +5V
  - Module width 10HP
  - Module depth 35mm
  - Power consumption +123mA, -40mA
