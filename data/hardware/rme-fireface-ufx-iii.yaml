url: https://rme-audio.de/fireface-ufx-3.html
description: 188-Channel, 24-Bit/192 kHz high-end USB 3 audio interface. The
  Fireface UFX III is the center of any multitrack studio, handling up to 94
  channels I/O with ease. Its unprecedented flexibility, compatibility, the
  inclusion of DURec (Direct USB Recording) and RME's famous low latency
  hardware and driver designs guarantee flawless operation in any mode and
  application. Packed with professional features, including SteadyClock FS, MADI
  I/O (64 channels), a powerful DSP, USB 3.0 (full 94 channel I/O Class
  Compliant ready), TotalMix FX, Direct USB Recording, and support for the
  Advanced Remote Control USB (available separately).
details: |-
  The Fireface UFX III is the center of any multitrack studio, handling up to 94 channels I/O with ease. Its unprecedented flexibility, compatibility, the inclusion of DURec (Direct USB Recording) and RME's famous low latency hardware and driver designs guarantee flawless operation in any mode and application.

  Packed with professional features, including SteadyClock FS, MADI I/O (64 channels), a powerful DSP, USB 3.0 (full 94 channel I/O Class Compliant ready), TotalMix FX, Direct USB Recording, and support for the Advanced Remote Control USB (available separately).
specs: |-
  - 188-Channel, 24-Bit/192 kHz high-end USB 3 Audio Interface
  - Up to 94 channels I/O simultaneously
  - 12 x Analog I/O total
  - 8 x Line In (rear, 6.3 mm TRS, electronically balanced)
  - 4 x XLR/TRS Mic/Inst/Line combo inputs (front)
  - 6 x Line Out (rear, 6.3 mm TRS, servo-balanced)
  - 2 x Monitor Out (XLR, balanced)
  - 2 x Headphone Output (6.3 mm TRS stereo jack, unbalanced)
  - AD Line In 1-8 SNR @ LoGain: 116 dB (AES17), 118 dBA
  - AD Line In 1-8 SNR @ +4 dBu: 115 dB (AES17), 117 dBA
  - AD Line In 1-8 Frequency response @ 44.1 kHz (-0.1 dB): 8.9 Hz – 20.4 kHz
  - AD Line In 1-8 Frequency response @ 96 kHz (-0.5 dB): 4.3 Hz – 45.2 kHz
  - AD Line In 1-8 Frequency response @ 192 kHz (-1 dB): 3 Hz – 89 kHz
  - AD Line In 1-8 THD @ -1 dBFS: < -120 dB (< 0.0001%)
  - AD Line In 1-8 THD+N @ -1 dBFS: < -110 dB (< 0.00032%)
  - AD Line In 1-8 Channel separation: > 110 dB
  - AD Line In 1-8 Maximum input level: +19 dBu
  - AD Line In 1-8 Input impedance @ 1 kHz: 10 kOhm unbalanced, 10.6 kOhm balanced
  - AD Line In 1-8 Input sensitivity switchable: Lo Gain and +4 dBu
  - AD Line In 1-8 Input level for 0 dBFS @ Lo Gain: +19 dBu
  - AD Line In 1-8 Input level for 0 dBFS @ +4 dBu: +13 dBu
  - AD Line In 1-8 Variable digital gain: 0 to +12 dB
  - AD Line In 1-8 Minimum level for 0 dBFS: +1 dBu, -1.2 dBV
  - Microphone In 9-12 Input: XLR, electronically balanced
  - Microphone In 9-12 Input impedance @ 1 kHz: 3.4 kOhm
  - Microphone In 9-12 SNR @ 0 dB Gain: 117 dB (AES17), 119.5 dBA
  - Microphone In 9-12 THD+N @ -1 dBFS, Gain 20 dB: < -110 dB (< 0.00032%)
  - Microphone In 9-12 Frequency response @ 44.1 kHz (-0.1 dB): 10.7 Hz – 20.3 kHz
  - Microphone In 9-12 Frequency response @ 96 kHz (-0.5 dB): 5.1 Hz – 45.0 kHz
  - Microphone In 9-12 Frequency response @ 192 kHz (-1 dB): 3.5 Hz – 88 kHz
  - Microphone In 9-12 EIN @ 60 dB Gain, 150 Ohm, A-Weighted: -129.8 dBu
  - Microphone In 9-12 Gain range: 75 dB
  - Microphone In 9-12 Maximum input level, Gain 0 dB: +18 dBu
  - Microphone In 9-12 Maximum input level, Gain 75 dB: -57 dBu
  - Microphone In 9-12 CLIP LED: 0 dBFS
  - Microphone In 9-12 SIG LED: -60 dBFS
  - Instrument In 9-12 Input: 6.3 mm TS jack, unbalanced
  - Instrument In 9-12 Input impedance @ 1 kHz: 1 MOhm
  - Instrument In 9-12 SNR: 116 dB (AES17), 118.5 dBA
  - Instrument In 9-12 Frequency response @ 44.1 kHz (-0.5 dB): 2.4 Hz – 20.0 kHz
  - Instrument In 9-12 Frequency response @ 96 kHz (-1 dB): 1.6 Hz – 28 kHz
  - Instrument In 9-12 Frequency response @ 192 kHz (-3 dB): 0.8 Hz – 54 kHz
  - Instrument In 9-12 THD+N @ -1 dBFS, Gain 20 dB: < -107 dB (< 0.00045%)
  - Instrument In 9-12 Gain range: 42 dB
  - Instrument In 9-12 Maximum input level, Gain 8 dB: +21 dBu
  - Instrument In 9-12 Maximum input level, Gain 50 dB: -21 dBu
  - DA Line Out 3-8 SNR @ HiGain: 116.5 dB (AES17), 118.5 dBA
  - DA Line Out 3-8 SNR @ +4 dBu: 116 dB (AES17), 118 dBA
  - DA Line Out 3-8 SNR @ -10 dBV: 107 dB (AES17), 109 dBA
  - DA Line Out 3-8 Frequency response @ 44.1 kHz (-0.1 dB): 0 Hz – 20.2 kHz
  - DA Line Out 3-8 Frequency response @ 96 kHz (-0.5 dB): 0 Hz – 44.6 kHz
  - DA Line Out 3-8 Frequency response @ 192 kHz (-1 dB): 0 Hz – 77.5 kHz
  - DA Line Out 3-8 THD+N: < -110 dB (< 0.00032%)
  - DA Line Out 3-8 Channel separation: > 110 dB
  - DA Line Out 3-8 Output level switchable: Hi Gain, +4 dBu, -10 dBV
  - DA Line Out 3-8 Output level at 0 dBFS @ Hi Gain: +19 dBu
  - DA Line Out 3-8 Output level at 0 dBFS @ +4 dBu: +13 dBu
  - DA Line Out 3-8 Output level at 0 dBFS @ -10 dBV: +2 dBV (+4.2 dBu)
  - DA Line Out 3-8 Output impedance: 75 Ohm
  - Stereo Monitor Output XLR (1-2) Output: XLR, balanced
  - Stereo Monitor Output XLR (1-2) Output level switchable: 24 dBu, Hi Gain, +4 dBu, -10 dBV
  - Stereo Monitor Output XLR (1-2) Output level at 0 dBFS @ 24 dBu: +24 dBu
  - Stereo Monitor Output XLR (1-2) Output level at 0 dBFS @ Hi Gain: +19 dBu
  - Stereo Monitor Output XLR (1-2) Output level at 0 dBFS @ +4 dBu: +13 dBu
  - Stereo Monitor Output XLR (1-2) Output level at 0 dBFS @ -10 dBV: +2 dBV (+4.2 dBu)
  - Stereo Monitor Output XLR (1-2) Output impedance: 150 Ohm
  - Phones Output (9-12) Output: 2 x 6.3 mm TRS stereo jack, unbalanced
  - Phones Output (9-12) Maximum output level at 0 dBFS, High: +19 dBu
  - Phones Output (9-12) Maximum output level at 0 dBFS, Low: +2 dBV
  - Phones Output (9-12) Max power per channel @ 32 Ohm load, 0.02% THD: 200 mW (2.5 Vrms, +10 dBu)
  - Phones Output (9-12) SNR @ High: 116.5 dB (AES17), 118.5 dBA
  - Phones Output (9-12) SNR @ Low: 115 dB (AES17), 117 dBA
  - Phones Output (9-12) Output impedance: 2 Ohm
  - MIDI: 2 x MIDI I/O via 5-pin DIN jacks
  - MIDI: Galvanically isolated by optocoupled input
  - MIDI: Hi-speed mode: Jitter and response time typically below 1 ms
  - MIDI: Separate 128 byte FIFOs for input and output
  - MIDI: 2 x MIDI I/O via MADI (invisible transmission via User bit of channel 56 up to 48 kHz, channel 28 up to 96 kHz)
  - Clocks: Internal, ADAT, AES, SPDIF, word clock
  - Jitter suppression: > 50 dB (> 1 Hz)
  - Effective clock jitter influence on AD and DA conversion: near zero
  - PLL ensures zero dropout, even at more than 100 ns jitter
  - Digital Bitclock PLL for trouble-free varispeed ADAT operation
  - Supported sample rates: 28 kHz up to 200 kHz
  - MADI Input Optical: FDDI duplex SC connector (62.5/125 and 50/125 compatible)
  - MADI Input Coaxial: via BNC (Word Clock input), 75 Ohm
  - MADI Input High-sensitivity input stage (< 0.2 Vpp)
  - MADI Input accepts 56 channel and 64 channel mode, plus 96k Frame
  - MADI Input Standard: up to 64 channels 24 bit 48 kHz
  - MADI Input S/MUX: up to 32 channels 24 bit 96 kHz
  - MADI Input S/MUX4: up to 16 channels 24 bit 192 kHz
  - MADI Input Lock range: 25 kHz – 54 kHz
  - MADI Input Jitter suppression: > 50 dB (> 1 Hz)
  - AES/EBU Input: 1 x XLR, transformer-balanced, galvanically isolated, according to AES3-1992
  - AES/EBU Input High-sensitivity input stage (< 0.3 Vpp)
  - AES/EBU Input SPDIF compatible (IEC 60958)
  - AES/EBU Input Accepts Consumer and Professional format
  - AES/EBU Input Lock range: 27 kHz – 200 kHz
  - AES/EBU Input Jitter suppression: > 50 dB (> 1 Hz)
  - ADAT Optical Input: 2 x TOSLINK, format according to Alesis specification
  - ADAT Optical Input Standard: 2 x 8 channels 24 bit, up to 48 kHz
  - ADAT Optical Input Double Speed (S/MUX): 2 x 4 channels 24 bit 96 kHz
  - ADAT Optical Input Quad Speed (S/MUX4): 2 x 2 channels 24 bit 192 kHz
  - ADAT Bitclock PLL ensures perfect synchronisation even in varispeed operation
  - ADAT Lock range: 31.5 kHz – 50 kHz
  - ADAT Jitter suppression: > 50 dB (> 1 Hz)
  - SPDIF Optical Input (ADAT 2): 2 x optical, according to IEC 60958
  - SPDIF Optical Input accepts Consumer and Professional format
  - SPDIF Optical Input Lock range: 27 kHz – 200 kHz
  - SPDIF Optical Input Jitter suppression: > 50 dB (> 1 Hz)
  - Word Clock Input: BNC
  - Word Clock Input internal termination 75 Ohm switchable
  - Word Clock Input automatic Double/Quad Speed detection and internal conversion to Single Speed
  - Word Clock Input SteadyClock guarantees super low jitter synchronization even in varispeed operation
  - Word Clock Input not affected by DC-offsets within the network
  - Word Clock Input Signal Adaptation Circuit: signal refresh through auto-center and hysteresis
  - Word Clock Input overvoltage protection
  - Word Clock Input level range: 1.0 Vpp – 5.6 Vpp
  - Word Clock Input Lock Range: 27 kHz – 200 kHz
  - Word Clock Input Jitter suppression: > 50 dB (> 1 Hz)
  - MADI Output Optical: FDDI duplex SC connector (62.5/125 and 50/125 compatible)
  - MADI Output Coaxial: via BNC (Word Clock output), 75 Ohm
  - MADI Output Standard: up to 64 channels 24 bit 48 kHz
  - MADI Output S/MUX: up to 32 channels 24 bit 96 kHz
  - MADI Output S/MUX4: up to 16 channels 24 bit 192 kHz
  - MADI Output Lock range: 25 kHz – 54 kHz
  - MADI Output Jitter suppression: > 50 dB (> 1 Hz)
  - AES/EBU Output: XLR, transformer-balanced, galvanically isolated, according to AES3-1992
  - AES/EBU Output level Professional: 4.5 Vpp
  - AES/EBU Output level Consumer: 2.6 Vpp
  - AES/EBU Output Format Professional according to AES3-1992 Amendment 4
  - AES/EBU Output Format Consumer (SPDIF) according to IEC 60958
  - AES/EBU Output Single Wire mode, sample rate 28 kHz up to 200 kHz
  - ADAT Output: 2 x TOSLINK, format according to Alesis specification
  - ADAT Output Standard: 2 x 8 channels 24 bit, up to 48 kHz
  - ADAT Output Double Speed (S/MUX): 2 x 4 channels 24 bit 96 kHz
  - ADAT Output Quad Speed (S/MUX4): 2 x 2 channels 24 bit 192 kHz
  - SPDIF Optical Output (ADAT 2): 2 x optical, according to IEC 60958
  - SPDIF Optical Output accepts Consumer and Professional format
  - SPDIF Optical Output Lock range: 27 kHz – 200 kHz
  - SPDIF Optical Output Jitter suppression: > 50 dB (> 1 Hz)
  - Word Clock Output: BNC
  - Word Clock Output Max. output voltage: 5 Vpp
  - Word Clock Output voltage @ 75 Ohm termination: 4.0 Vpp
  - Word Clock Output impedance: 10 Ohm
  - Word Clock Output Frequency range: 27 kHz – 200 kHz
  - Power supply: Internal switching PSU, 100 - 240 V AC, 36 Watts
  - Idle power consumption: 19 Watts
  - Typical power consumption: 22-25 Watts
  - Dimensions with rack ears (WxHxD): 483 x 44 x 210 mm (19" x 1.73" x 8.5")
  - Dimensions without rack ears (WxHxD): 440 x 44 x 210 mm (17.3" x 1.73" x 8.3")
  - Total depth: 240 mm (9.4")
  - Weight: 3 kg (6.6 lbs)
  - Temperature range: +5° to +50° Celsius (41° F to 122°F)
  - Relative humidity: < 75%, non condensing
  - SteadyClock FS
  - MADI I/O (64 channels)
  - Powerful onboard DSP
  - USB 3.0 (full 94 channel I/O Class Compliant ready)
  - TotalMix FX
  - Direct USB Recording (DURec)
  - Advanced Remote Control USB support (available separately)
  - DC-coupled outputs
  - AutoSet
