description: This passive 15in subwoofer pushes Custom Theater's low-frequency
  performance to new limits. Like all the bass drivers in the range, it features
  a rigid composite sandwich cone to deliver sound with lifelike clarity.
details: |-
  The CT8 SW is the subwoofer of the CT800 Series, a closed-box design built around a single 380mm (15in) Carbon Aerofoil bass cone in a Matrix cabinet. The information sheet calls it integral to the system's no-compromise approach to bass management.

  Unlike the majority of subwoofers, the CT8 SW does not contain its own power amplifier and is used in a different manner than is usual: it is driven from a separately sourced amplifier channel by way of the rack-mount CT8 XO active bass management controller, which the product page's own subtitle refers to as an external rack-mount amplifier arrangement.

  Rather than being assigned only to the LFE channel, a CT8 SW may be added to each of the main channels as desired, extending the frequency response well below 20Hz. The minimum recommended configuration assigns one subwoofer to each of the front left and right channels, and up to two subwoofers may be added to each main channel where higher sound levels are required.

  Custom Theater speakers are specifically designed to be built into the fabric of the listening room or into custom furniture as part of a fully designed theatre concept, and are supplied without grilles because custom installs normally hide built-in speakers behind acoustically transparent cloth.
specs: |-
  - Description: Closed-box subwoofer system
  - Technical features: Carbon Aerofoil bass cone, Matrix cabinet, active bass crossover
  - Drive units: 1x ø380mm (15in) Carbon Aerofoil bass cone
  - Frequency range: -6dB at 13Hz to 750Hz, -3dB at 18Hz to 500Hz
  - Frequency response: 18Hz to 35Hz ±3dB on reference axis
  - Dispersion (within 2dB of reference response): horizontal over 90° arc, vertical over 90° arc
  - Sensitivity (2.83V, 1m): 93dB
  - Harmonic distortion: <1% 30Hz to 500Hz
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <0.5% 45Hz to 300Hz
  - Nominal impedance: 8Ω (minimum 4Ω)
  - Crossover frequency: 40Hz
  - Recommended amplifier power: 500W to 1,000W into 8Ω on unclipped programme
  - Max. recommended cable impedance: 0.1Ω
  - Dimensions: Height 475mm (18.7in), Width 475mm (18.7in), Depth 475mm (18.7in)
  - Net weight: 35kg (77lb)
  - Finishes: Cabinet Black painted
  - Passive: contains no power amplifier, driven from a separately sourced amplifier channel
