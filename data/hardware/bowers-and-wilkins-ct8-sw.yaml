description: This passive 15in subwoofer pushes Custom Theater's low-frequency
  performance to new limits. Like all the bass drivers in the range, it features
  a rigid composite sandwich cone to deliver sound with lifelike clarity.
details: |-
  CT8 SW is the subwoofer of the Bowers & Wilkins CT800 Custom Theater range, a closed-box design built around a single 380mm (15in) Carbon Aerofoil sandwich cone bass driver. The rigid composite sandwich construction is shared with the other bass drivers in the range, and the sealed cabinet reaches -6dB at 13Hz.

  Unlike most subwoofers on the market, the CT8 SW contains no power amplifier of its own. It is driven from an external power amplifier channel, fed from the CT8 XO active bass management controller, so a CT8 LR, CT8 CC or CT8 DS that has a CT8 SW assigned to it needs three channels of amplification rather than two. The recommended range is 500W to 1,000W into 8 ohms on unclipped programme.

  The intended use is also unusual. Rather than sitting on the LFE channel alone, a CT8 SW may be added to each of the main channels to extend that channel's response well below 20Hz and preserve the directional information that low frequencies still carry. The minimum recommended configuration assigns one subwoofer to each of the front left and right channels, and up to two subwoofers may be added to each main channel where higher levels or a larger room demand it. Adding more subwoofers to one channel requires an adjustment of that channel's CT8 XO subwoofer output level to restore the tonal balance.

  Custom Theater speakers are designed to be built into the fabric of the listening room or into custom furniture, and are supplied without grilles, since installers normally conceal them behind acoustically transparent cloth. The CT8 DS surround is the only model in the range that ships with one.

  As with the rest of the range, performance settles over the first period of use: allow about a week for temperature effects and roughly 15 hours of average use for the suspension and damping materials. Speaker cable impedance should be held below 0.1 ohm across the run, and the manual warns that a CT800 system can produce very high sound pressure levels, so exposure should stay inside recommended equivalent sound level limits.
specs: |-
  - Description: closed-box subwoofer
  - Drive units: 1x ø380mm (15in) Carbon Aerofoil bass cone
  - Frequency range: -6dB at 13Hz to 750Hz, -3dB at 18Hz to 500Hz
  - Frequency response: 18Hz to 35Hz +/-3dB on reference axis
  - Dispersion: within 2dB of reference response, horizontal over 90 degree arc, vertical over 90 degree arc
  - Sensitivity: 93dB spl (2.83V, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) under 1% 30Hz to 500Hz, under 0.5% 45Hz to 300Hz
  - Nominal impedance: 8 ohms (minimum 4 ohms)
  - Crossover frequency: 40Hz
  - Recommended amplifier power: 500W to 1000W into 8 ohms on unclipped programme
  - Maximum recommended cable impedance: 0.1 ohms
  - Passive: no on-board power amplifier and no mains connection, driven from an external power amplifier channel fed by the CT8 XO
  - Dimensions: height 475mm (18.7in) without spike feet, width 475mm (18.7in), depth 475mm (18.7in)
  - Weight: 35kg (77lb)
  - Supplied without a grille, for installation behind acoustically transparent cloth
  - Up to two CT8 SW may be assigned to each main channel of a CT800 system
  - Finish: Black
