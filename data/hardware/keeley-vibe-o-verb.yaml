description: Three-mode ambient reverb pedal that modulates the reverb itself,
  with harmonic tremolo, vibrato and phaser voicings.
details: |-
  The Vibe-O-Verb is a three-mode reverb pedal that applies classic modulation effects to the reverb signal rather than to the dry guitar tone. The result is a set of ambient spaces described as simulating changing reflective surfaces and accelerating reference points, intended for textures that conventional reverbs do not produce.

  The delay times inside the reverb engine are set from the Fibonacci series, a deliberate design choice intended to give the reverb lengths a musical relationship to one another in the way that the golden ratio has been used in composition.

  Harmonic Reverb mode applies a harmonic tremolo, in the manner of a vintage brownface amplifier or Keeley's own DynaTrem, to the reverb, producing choppy waves across the reverb tail. Vibrato Reverb mode bends the pitch of the reverberation, ranging from a mild chorus to wider, more pronounced movement. Phaser mode places a moving notch filter in the reverb space, giving the impression of a reflecting surface changing material as the sweep cycles.

  The product page also links an external reference article on the Fibonacci sequence and ends with a link to the instruction sheet.
