description: The Chroma X is a 10-channel, 3RU tracking and mixing processor
  designed for hybrid studios. It combines microphone preamp and line-level
  processor functionality with Twin Tone-Amp architecture and one Colour Module
  analog plugin slot per channel for customizable signal processing.
details: |-
  The Chroma X features selectable 'A' (American) or 'N' (British) inspired MOJO Amps per channel, each switchable between Mic and Mix/Line mode. Mic gain ranges from +8 to +34 dB standard, or +34 to +60 dB in high gain mode. Mix/Line/Instrument gain ranges from 0 to +26 dB standard, or +26 to +52 dB in high gain mode. Each channel includes 48V phantom power, polarity reverse, a signal present indicator, and a bi-directional meter. Tone shaping is via Baxandall EQ with selectable Low Frequency (Subsonic 30 Hz or Bass 60 Hz) and High Frequency (Presence or Air, +3 dB and +4 dB respectively) boost options, plus an optional Vintage filter for softening high-frequency response. Each of the 10 channels accepts one Colour Format analog plugin module with C-Drive (-6 to +18 dB) and C-Mix crossfade blend control. Input impedance is optimized for ribbon and dynamic microphones. Audio path uses custom American-made transformers, ROGUE FIVE discrete op amps (2520 footprint), Nichicon HE and Panasonic FR capacitors, Wima polypropylene film capacitors, 0.5% thin-film resistors, and audiophile-grade class A biased op amps. High-temperature Tg 170 PCB material; RoHS compliant. Built and assembled in Silicon Valley, California. Requires the Purple Audio Sweet Ten LTL Edition Rack for power.
specs: |-
  - Mic or Mix/Line mode
  - 48V phantom power
  - Polarity reverse
  - Mix/Line/Instrument Gain: 0 to +26 dB, +26 to +52 dB (High Gain mode)
  - Mic Gain: +8 to +34 dB, +34 to +60 dB (High Gain mode)
  - Optimized input impedance to reveal full potential of ribbon and dynamic mics
  - Colour Drive: -6 to +18 dB
  - Colour Mix: crossfade blend of processed and dry signal
  - LF (+3 dB): Pultec-inspired Subsonic (30 Hz) and Bass (60 Hz) frequencies
  - HF (+4 dB): Presence and Air frequencies
  - Vintage: softens high frequency response to emulate vintage British consoles
  - LTL Edition Sweet Ten Rack provides exceptional low noise, regulated power in robustly shielded enclosure
  - XLR inputs
  - XLR & 1/4" TRS outputs
  - 3RU
  - ROGUE FIVE discrete op amps designed by Louder Than Liftoff, conforming to standard 2520 footprint
  - Nichicon HE and Panasonic FR electrolytic capacitors
  - Thin film 0.5% resistors
  - Audiophile grade op amps, class A biased
  - CIT and Alps pushbutton switches
  - Chroma Sound Clips - Listen to Chroma compared to other API and Neve style preamps
  - Also check out the Silver Bullet sound clips since Chroma is derived from the same architecture.
  - Drum tracking mothership with selectable A or N modes
  - Live sound / touring 10-channel mic/line amp
  - Multi-Bus / Stem Mojo processor – put on hardware inserts of DAW mixer to add analog coloration and signal processing to tracks and busses
  - Summing box channel enhancement – insert in front of each channel of a summing box to create a more console-like signal path with user-controlled analog coloration on each channel
  - 10-channel Colour module host – add compression, EQ, distortion, saturation, etc.
