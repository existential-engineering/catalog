description: PM Channels MKII adds four stereo channels to the Performance Mixer
  MKII or functions as a standalone four-channel mixer, with submixing outputs
  for Mix, Aux1, and Aux2 and field-replaceable channel strips.
details: |-
  Need More Inputs? Add four channels at a time to your Performance Mixer MKII setup, or you can use the Channels MKII as a standalone four channel mixer. The expansion is simple -- identical channels, just more of them. Four at a time, up to four Channels units, for 24 total stereo channels. A simple 16 pin 2mm pitch expansion cable is provided and is the only connection necessary. Units can be daisy-chained easily resulting in a clean setup. Submixing Reimagined

  Additionally, the outputs on Channels MKII still work when connected to the PM MKII. So you get a submix of AUX1, AUX2, and MIX available for whatever you may want to do, drum submixing, FX routing, etc. And more importantly, those submixes on Channels MKII can be removed from the main summing on the PM MKII. Allowing MIX, AUX1, AUX2 to be independantly isolated to just the outputs on Channels, or also sent to the main mix on the PM MKII. These routings can be saved/recalled with Group Recall. The routing status is indicated on the three LEDs below the patchbay. Not Just an Expansion -- Standalone Operation

  As a standalone unit, you get three stereo outputs, MIX, AUX1, AUX2. The buttons are soft mutes. It's a robust four channel setup. The RETURNS module can be used with Channels to add 3x stereo returns to the MIX bus. FYI -- You can not connect CHANNELS MKIIs together without a PM MKII. The summing, buttons, and control brain is in the master section of the PM MKII and the connection won't do anything. Recording Outputs:

  Pre and Post fade headers are available on the rear for connection to the DB25 MKII. Each Chanels MKII will fill 1/2 of a DB25 with the Pre or Post connections. The Mix, Aux1, and Aux2 are also available on a header.
