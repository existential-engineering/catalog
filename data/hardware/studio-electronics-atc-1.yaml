description: >-
  The Analog Tone Chameleon is a monophonic rack synthesizer that uses swappable filter cartridges
  to emulate classic synth circuits from Moog, Roland, ARP, and Oberheim.
details: |-
  The Studio Electronics ATC-1, or Analog Tone Chameleon, takes a novel approach to analog synthesis by making its filter stage interchangeable. Plug-in cartridges recreate the filter characteristics of the Minimoog, Roland TB-303, ARP 2600, and Oberheim SEM, giving a single rack unit access to some of the most coveted tonal signatures in synthesizer history.

  At its foundation are two VCOs offering triangle, sawtooth, and variable-width square waveforms with oscillator sync and a white noise generator. Two LFOs provide extensive modulation with triangle, sawtooth, reverse sawtooth, square, noise, random, and sample-and-hold shapes. Three independent ADSR envelopes handle the VCA, VCF, and a dedicated modulation bus.

  The ATC-1 stores 512 patches and supports both MIDI and CV/Gate control, bridging vintage and modern studio workflows. An external audio input allows processing of outside sound sources through whichever filter cartridge is installed, expanding its role beyond pure synthesis.

  While the industrial rack-mount aesthetics may lack visual charm, the sonic flexibility is hard to argue with. Artists like Fatboy Slim have turned to the ATC-1 for its ability to convincingly channel multiple classic analog voices from a single unit.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (triangle, sawtooth, variable-width square); oscillator sync; white noise generator
  - LFOs: 2 (triangle, sawtooth, reverse sawtooth, square, noise, random, sample & hold)
  - Filter: Interchangeable cartridge VCF (Moog, SEM, 303, 2600); external audio input
  - Envelopes: 3 ADSR (VCA, VCF, modulation)
  - Memory: 512 patches
  - Control: MIDI, CV/Gate
releaseDate: "1997"
