description: The K24ce is a Grand Auditorium acoustic-electric guitar built
  entirely from solid Hawaiian koa with a Venetian cutaway and Taylor's
  Expression System 2 electronics, pairing V-Class bracing with a 25-1/2" scale
  length for balanced volume, sustain, and intonation.
details: |-
  The K24ce is Taylor's all-koa Grand Auditorium, combining a solid Hawaiian koa top with solid Hawaiian koa back and sides for a warm, complex tone with glassy highs and rich sustain. The Venetian cutaway grants easy access to the upper frets, making it equally suited to fingerpicking and lead playing.

  Taylor's V-Class bracing system replaces the traditional X-brace pattern to improve both volume and sustain simultaneously while significantly enhancing intonation across the fretboard. The result is a guitar that resonates more freely and stays in tune with itself up the neck.

  Built-in Expression System 2 (ES2) electronics provide a natural, acoustic sound when plugged in. The behind-the-saddle pickup placement captures the full resonance of the body, and the three-way controls (Volume, Bass, Treble) offer straightforward tone shaping on stage.

  The neck is crafted from Tropical Mahogany with a West African Crelicam Ebony fretboard and Spring Vine inlay. Rock Maple body binding and Gotoh tuners complete the package. Ships with a deluxe hardshell case.
specs: |-
  - - Body Shape: Grand Auditorium
  - Cutaway: Venetian
  - Top: Solid Hawaiian Koa (gloss)
  - Back & Sides: Solid Hawaiian Koa (gloss)
  - Bracing: V-Class
  - Neck: Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Fretboard Inlay: Spring Vine
  - Bridge: West African Crelicam Ebony
  - Bridge Pins: West African Crelicam Ebony
  - Scale Length: 25-1/2"
  - Nut: Black Graphite
  - Saddle: Micarta
  - Body Binding: Rock Maple
  - Tuners: Gotoh
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Deluxe hardshell case included
