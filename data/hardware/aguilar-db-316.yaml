description: A midrange EQ pedal based on the preamp of the Tone Hammer Series,
  designed to perfect your midrange tone. Ideal for basses with two-band preamps
  and passive instruments where nailing the midrange is key. Features a
  sweepable midrange frequency control and functions as either a permanent tone
  shaper or a quick-switch alternative tone setting.
details: |-
  Heavy duty steel micro-sized chassis suitable for pedalboard use.

  Midrange frequency control is sweepable from 180 Hz to 1 kHz with ±17 dB
  boost/cut, targeting the exact midrange frequencies most basses lack. Operates
  as either a permanent tone shaper (always on) or an alternative tone switch
  (engage when needed).

  Backed by Aguilar's three-year limited warranty.
specs: |-
  - Mid Frequency Range: 180 Hz – 1 kHz (sweepable)
  - Level: ±17 dB
  - Power: 9V DC (not included)
  - Input: One 1/4-inch jack
  - Output: One 1/4-inch jack
