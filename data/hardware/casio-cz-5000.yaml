description: >-
  The Casio CZ-5000 is the flagship of Casio's CZ line, a 16-voice phase distortion synthesizer
  with a 61-key split keyboard, an 8-track sequencer, and the same accessible yet powerful
  synthesis engine found across the CZ series.
details: |-
  Released in 1985, the CZ-5000 represented the pinnacle of Casio's synthesizer lineup. It built
  upon the foundation established by the CZ-101 and CZ-1000, retaining the same phase distortion
  synthesis method and programming approach while adding professional features like a full-size
  61-key split keyboard and an integrated 8-track sequencer.

  Phase distortion synthesis, Casio's alternative to Yamaha's FM approach, proved far more
  intuitive to program while still capable of complex digital timbres. Each voice uses two
  oscillators with 8-stage envelopes for both pitch and timbre shaping, producing thick and
  evolving tones without traditional analog filters. The 16-voice polyphony was generous for
  its era, and the keyboard split functionality allowed for layered or divided performances.

  The built-in sequencer could store up to 3,400 steps in real-time mode or 6,400 steps in
  step-time mode across 8 tracks, though it lacked quantization. Memory provides 32 preset and
  32 user-programmable patches. Notable users include The Orb and Jean-Michel Jarre, and the
  instrument found particular favor in industrial and electro music production where its bright,
  digital character was an asset.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: 2 per voice (phase distortion synthesis)
  - Filter: None (timbral shaping via phase distortion)
  - Envelopes: 8-stage envelopes for pitch and timbre
  - Effects: Chorus
  - Memory: 32 preset / 32 user patches
  - Sequencer: 8-track; 3,400 steps (real-time) / 6,400 steps (step-time), no quantize
  - Keyboard: 61 keys with split capability
  - Connectivity: MIDI
  - Date produced: 1985
