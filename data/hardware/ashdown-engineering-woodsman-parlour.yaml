url: https://ashdownmusic.com/products/woodsman-parlour
description: Woodsman Parlour 25W acoustic combo. The Woodsman builds on a long
  legacy of acoustic amp design to deliver class-leading standards of vocal and
  instrument performance, combining a traditional wooden cabinet with modern
  features for live performance and recording.
details: |-
  Designed for the new wave of acoustic performers, the Woodsman family combines traditional, beautiful wooden cabinets with modern features for live performance and recording. With inputs for microphones and acoustic guitar, the amps are ideal for duos or solo singer/guitar players, delivering pure, clear acoustic tone. Each model features a custom-designed 8" Ashdown driver; the Parlour and Classic also feature a horn for increased full-range sound. The 25W Parlour features a Mic Channel with independent volume control, a guitar channel with volume, bass, mid and treble controls, studio-quality digital reverb, and a master volume. All models include an Aux In jack for connecting an MP3 player.
specs: |-
  - Power output: 25W
  - Speaker configuration: 1 x 8"
  - Frequency response: -3dB @ 28Hz and 28kHz
  - High Instrument Input: Impedance 10k Ohms, input range 300mV - 20V p-p
  - Low Instrument Input: Impedance 3.9M Ohms, input range 300mV - 20V p-p
  - Line Input: 10k Ohms, Level 0dBu
  - Line Output: 4.7k Ohms, Level 0dBu
  - Signal to noise: greater than 80dB (EQ flat)
  - EQ: +/-15dB @ 100Hz and 10kHz
  - Effects send: 10k Ohms, Level 0dBu
  - Distortion: less than 0.8% THD
  - H x W x D: 254 x 302 x 175 mm (H: +15mm for feet)
  - Weight: 5.51 kg
