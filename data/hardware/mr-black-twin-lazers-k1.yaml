description: The Twin Lazers K1 is a dual, true-stereo phase-shifter with two
  independent 4- or 6-stage phasers that can run in stereo or be chained for up
  to 12 stages, plus tap-tempo, presets and expression control.
details: |-
  The Twin Lazers is Mr. Black's take on the long-standing king of dual
  phase-shifters, delivering true-stereo phase shifting at its finest. The K1
  revision adds brighter LEDs, soft-touch footswitches and a tap-tempo footswitch
  for 2026.

  Inside are two fully independent phase-shifters, 4-stage per phaser in Green
  mode and 6-stage per phaser in Red mode. They can run independently in stereo
  or be chained together with a standard patch cable to stack the stages into
  series-mono 8-stage or extra-syrupy 12-stage phasing. Oscillator rate is shown
  on a pulsing LED and sweeps from a crawling 0.2 Hz up to 5 Hz.

  The Shift control sets a phase lag of 0 to 180 degrees between the two
  oscillators; at 90 degrees in a stereo rig the swirl seems to rotate around the
  listener with no discernible direction. Run in series, the Shift control opens
  up an entirely different set of phase textures, and a full Mix control ranges
  from light swirl to thick, ooey-gooey phase modulation.

  A preset is saved with the Save button and recalled by holding the
  Tap-Tempo/Preset footswitch, and an expression pedal can be assigned to any or
  all controls on the fly. Tap-tempo extends the oscillator out to a 30-second
  cycle and resets to the start of the cycle on the second tap for precise
  timing. Housed in a tough matte-black powder-coated, daisy-chain-friendly
  enclosure (3.75" W x 4.72" L x 2" H, 16 oz), it draws just 73 mA peak.
specs: |-
  - Dual, true-stereo phase-shifter
  - Two fully independent 4-stage (Green) or 6-stage (Red) phasers
  - Chainable to 8-stage series-mono or 12-stage phasing via patch cable
  - Oscillator rate 0.2Hz - 5Hz with pulsing LED indicator
  - Shift control: 0° - 180° phase lag between oscillators
  - Full Mix control (light swirl to full phase modulation)
  - Preset save/recall
  - Tap-tempo (extends cycle to 30 seconds, resets on second tap)
  - Expression control assignable to any or all controls on the fly
  - Brighter LEDs, soft-touch footswitches, tap-tempo footswitch (2026 K1 update)
  - Dimensions: 3.75"W x 4.72"L x 2"H
  - Weight: 16oz
  - 9VDC 2.1mm negative center-pin power (daisy-chain friendly)
  - 73mA peak current draw
