description: The Klipsch RP-1600SW is a 16" front-firing powered subwoofer from
  the Reference Premiere series, featuring a Cerametallic woofer driven by an
  800W RMS / 1600W peak Class D amplifier with analog preamp stage. It delivers
  14.5Hz–175Hz bass via a bass reflex cabinet with a proprietary Aerofoil front
  slot port.
details: |-
  The RP-1600SW is Klipsch's flagship Reference Premiere subwoofer, built around a 16-inch Ultra Long Throw Cerametallic woofer redesigned from the ground up. The Cerametallic cone combines the lightweight properties of aluminum with the rigidity of ceramic for high-efficiency, low-distortion bass reproduction.

  Power comes from a high-efficiency Class D amplifier rated at 800W RMS and 1600W peak, featuring an analog preamp design that preserves the original signal path for cleaner, true-to-source sound.

  The front-firing bass reflex enclosure uses Klipsch's proprietary Aerofoil slot port, which uses a tapered, flared geometry to minimize port turbulence and eliminate chuffing noise at high output levels. Front-firing placement allows the subwoofer to be positioned anywhere in the room without corner or wall reinforcement dependency.

  The rear panel provides dual RCA/LFE line inputs and speaker-level inputs for flexible integration with any AV receiver or stereo amplifier. A WA-2 Wireless Subwoofer Kit port (sold separately) enables wire-free placement. Ships with a 5-year limited warranty.
