description: Clarett+ 4Pre is a versatile and sonically true 18-in/8-out audio
  interface for the complete creator.
details: |-
  Clarett+ 4Pre is the compact, flexible interface designed to bring pure analogue sound to all your instruments. The four Clarett preamps have been meticulously engineered to bring authentic large-format studio sound to any recording space.

  All-analogue Air mode, with impedance switching, recreates the legendary effect of Focusrite's ISA mic pres, adding clarity and presence to any recording. Two high-impedance JFET instrument inputs preserve your guitar's true character and feel just like an amp.

  Independent A-D and D-A converters offer ultra-low distortion and up to 124dB dynamic range. Four balanced outputs are hum-free for pristine monitoring, mixing and mastering with studio monitors. Eight input channels of ADAT allow 4Pre to expand for any recording session.
specs: |-
  - 18-in / 8-out USB-C audio interface
  - Sample rate up to 24-bit / 192 kHz
  - Four Clarett+ mic preamps with All-analogue Air mode and impedance switching
  - Two Hi-Z JFET instrument inputs
  - Four fixed line inputs
  - Four balanced line outputs
  - Two independent headphone outputs
  - Eight input channels of ADAT optical expansion
  - MIDI In and Out
  - Mic input dynamic range: 118 dB
  - Line output dynamic range: 124 dB
  - Mic/instrument gain range: +57 dB
  - Compatible with Windows (Intel, AMD, Arm64) and macOS (Apple Silicon, Intel)
  - 3-year warranty
