description: >-
  A professional 64-voice rack-mount sampler from 1999 using DOS FAT32 disk
  format and WAV files natively, with expandable polyphony to 128 voices and up
  to 256MB of RAM.
details: |-
  The Akai S5000 represents the next generation of Akai's professional sampling platform, arriving in 1999 with a modern approach to file handling. By adopting DOS FAT32 disk format and WAV files as the native sample format, it enables direct playback of standard PC audio files without conversion, making integration of internet-sourced and computer-created samples seamless.

  The sampling engine operates with 18-bit A-D converters using 64x oversampling and 5th-order delta-sigma conversion. Stereo WAV files are handled as single unified samples rather than separate left and right channels, simplifying editing and program creation. Samples can be recorded into RAM or directly to hard disk, with transparent playback from either location enabling long-form sample playback without memory constraints.

  Sound shaping is handled by APM (Assignable Program Modulation), offering 26 resonant filter types in 4-pole and 2-pole configurations across low-pass, band-pass, and high-pass modes. Flexible envelope generators and LFOs provide further modulation. Up to 128 multi-programs can be loaded simultaneously, with a QuickLoad function for rapid program-to-parts assignment. An optional SampleVerb II 4-channel multi-effects processor adds reverb and other processing.

  The rack-mount unit features a large 320x240 LCD graphic display, eight analog outputs expandable to 16, stereo digital I/O, two SCSI ports, and full backward compatibility with Akai S1000 and S3000 series sound libraries. Notable users include Underworld, Nick Rhodes, Max Graham, and ATB.
specs: |-
  - Polyphony: 64 voices (expandable to 128)
  - A-D Conversion: 18-bit, 64x oversampling
  - Sample Format: WAV (FAT32 native)
  - RAM: Up to 256MB (standard SIMMs)
  - Filters: 26 resonant types (4-pole/2-pole LP, BP, HP)
  - Effects: 3-band digital EQ; optional SampleVerb II
  - Display: 320 x 240 LCD
  - Outputs: 8 analog (expandable to 16) + stereo master
  - Digital I/O: Stereo (optional ADAT)
  - Storage: 2 SCSI ports, 3.5" floppy
  - Compatibility: Akai S1000/S3000 libraries
  - Control: MIDI
  - Form Factor: Rack-mount
