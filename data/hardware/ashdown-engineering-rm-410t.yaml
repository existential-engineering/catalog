details: |-
  Rootmaster 4 x 10" bass speaker cabinet rated at 450W (8 ohms), bringing the classic 4x10" sound to the front with added top-end definition from four custom Ashdown 10" drivers and an HF tweeter. The sealed enclosure creates an infinite baffle for smoother low-end response and faster attack. Solid construction is paired with hard-wearing vinyl coverings, protective corners, tough grille cloths, and vibration-reducing rubber feet. Supplied with caster plates (casters available separately).
specs: |-
  - Power output: 450 watts
  - Speaker configuration: 4 x 10" with HF tweeter
  - Frequency response: 60Hz - 20kHz
  - Impedance: 8 Ohms
  - SPL: 98dB 1W @ 1m
  - Sealed enclosure (infinite baffle)
  - Supplied with caster plates (casters available separately)
  - Dimensions (H x W x D): 603 x 603 x 335 mm
  - Weight: 36kg
