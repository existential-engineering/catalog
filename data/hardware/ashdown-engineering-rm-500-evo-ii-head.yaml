description: Now in its second evolution, the RM-500 EVO 500-watt power section
  maintains a deep low end, defined mids and transient highs into a 4-ohm load.
  Ashdown Rootmaster heads are the perfect choice for working bassists looking
  for power and features without the weight.
details: |-
  The 500-watt power section of the RM500 EVO has been developed to maintain a deep low end, defined mids and transient highs, delivering its output into a 4-ohm load. The Rootmaster EVO preamp includes passive and active input jack sockets for high and low output instruments, setting a clear signal path to the input control so you can fine-tune your level with the trademark Ashdown VU meter. From there you reach the tone features: a Shape button, 5-band EQ and onboard compressor. The drive control delivers a valve-emulated overdrive, and the sub-harmonic controls add fatness, both foot-switchable via an FS-2 footswitch (sold separately). EVO heads also feature an upgraded power section and a mute button that turns the VU meter from orange to cool blue between sets.
specs: |-
  - Power Output: 500 Watts
  - Minimum Load: 4 Ohms
  - Instrument Input: passive and active jack sockets, with VU meter
  - EQ: 5-band, plus Shape button
  - Onboard compressor
  - Valve-emulated overdrive (drive control)
  - Sub-harmonic controls
  - Mute button
  - FS-2 footswitch compatible (sold separately)
