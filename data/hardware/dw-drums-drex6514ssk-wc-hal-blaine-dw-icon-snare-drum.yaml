details: |-
  Hal Blaine

  Part of Phil's Spector's infamous Wrecking Crew, he moved to California ins 1943 to play Jazz and Big Band, but it was Rock and Roll session that would cement him as one of the foremost studio drummers of all time. Some of his most notable recordings were with luminaries such as Elvis, Sinatra, The Beach Boys, Neil Diamond and Simon and Garfunkel. He received a Grammy Lifetime Achievement Award in 2018.
