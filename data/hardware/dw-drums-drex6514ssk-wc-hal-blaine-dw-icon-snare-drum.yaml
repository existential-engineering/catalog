description: The Wrecking Crew DW ICON Snare was created to pay homage to legendary DW artist, Hal Blaine.
details: |-
  This DW Collector's Series ICON Series Snare was created to honor celebrated drummer Hal Blaine, whose discography boasts credits with artists including Elvis Presley, Frank Sinatra, The Beach Boys, Simon & Garfunkel, and more. As a member of the legendary session musician collective The Wrecking Crew, Hal played on an astonishing 150 top-10 hits.

  This snare drum features an 11-ply VLT (Vertical Low Timbre) shell made from 100% North American Hard Rock Maple for punchy attack and classic warm tone. The exterior Maple veneer features Hal's signature and a Wrecking Crew logo designed from laser-cut wood inlays of a select series of exotic woods.

  This limited 6.5x14″ snare offers the highest quality of hardware that DW offers. This includes DW's famed MAG throw-off, three-position butt plate, True-Tone Snare Wires, True-Hoops, and DW Heads by Remo U.S.A.

  Includes a heavy-duty DW snare bag and certificate of authenticity signed by John Good.
specs: |-
  - 11-ply North American maple VLT shell
  - Laser-cut inlays of Hal Blaine's signature and the Wrecking Crew logo
  - MAG throw-off
  - 3-position butt plate
  - True-Hoops
  - True-Tone snare wires
  - DW Heads by Remo U.S.A.
  - Size: 6.5x14
