  - Neck Wood: Mahogany
  - Neck Shape: Wide Fat
  - String Spacing: 2 7/32”
  - Fretboard Wood: Ebony
  - Fretboard Inlay: Birds
  - Strength/Truss Rod: PRS Double Action Truss Rod
  - Neck Depth At The Nut: 7/8”
  - Nut: Bone
  - Bridge Wood: Ebony
  - Tuners: PRS-Designed
  - Acoustic Saddle: Bone
  - Acoustic Strings: .012-.053
  - Included Accessories: Gig Bag
  - Pickup: PRS-Voiced Fishman Presys VT with Soundhole-Mounted Volume and Tone Controls
