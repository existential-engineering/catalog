details: |-
  At Fulltone USA Custom Shop, we're proud to bring back a true classic. This is an exact, part-for-part recreation of one of the most valuable and sought-after guitar pedals ever made. While it's not the first time we've built it, this will be the final batch for the foreseeable future. With production coming to a stop after this run, each unit represents a closing chapter in one of the most iconic circuits in boutique pedal history. Built on the original hand-wired board design, the v1.4 spec is the version that put the OCD on the map. After months of carefully sourcing the proper components, every detail has been faithfully replicated, from the hand-selected parts to the original circuit layout. The result is the unmistakable OCD tone: dynamic, amp-like drive with massive touch response, refined with fuller bass, a more open top end, and less mid-hump. No shortcuts, no updates for convenience—just the real deal, brought back to life exactly as it was. Only 500 units are available. No restock is planned, and production has already paused. Once these are gone, they're gone. Whether you're a professional musician or a tone enthusiast, this pedal belongs in your collection. Don't miss your chance to own a piece of musical history and discover why it has remained a favorite among guitarists for decades. Secure your piece of tone history.
