description: A limited black-finish edition of the compact Double Tracker, a
  real-time double-tracking pedal that adds a second, slightly detuned and
  delayed voice.
details: |-
  Double tracking is a recording technique pioneered in the 1950s: record a track
  twice and overlay the two nearly identical takes to enhance depth, character,
  and tonality. The Double Tracker recreates that effect in real time, delivering
  the full, rich intensity that once required studio tricks.

  Offering 3ms to 122ms of latency and the ability to detune the second track by
  up to plus or minus half a semitone, it creates a natural, organic double of
  your guitar and seamlessly folds that second voice into your signal. Three
  controls dial in the intensity, latency, and variance of the doubled track. The
  effect is almost like chorus and almost like slap-back, yet is neither: it is
  double tracking.

  Powered by an internal 9V battery or standard 9VDC pedal power, drawing
  approximately 59mA at 9VDC. The Black LTD. Double Tracker is a Jack Deville
  original design, produced as a limited run of 69 pieces for Mr. Black Friday
  2024.
specs: |-
  - Real-time double tracking (single/mono voice)
  - Latency: 3mS - 122mS
  - Detune up to +/- 1/2 semitone
  - Three controls: intensity, latency, variance
  - Power: internal 9V battery (not included) or 9VDC pedal power
  - Current draw: ~59mA @ 9VDC
  - Limited run of 69 pieces
