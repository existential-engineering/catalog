  - Quick charging: 15 minutes gives 1 hour of playtime
  - Charging time: 1.5 hours to recharge earbuds, 1.5 hours to recharge case
  - Weight: 4.31 g / 0.15 oz
  - Water resistance: IPX5 in earbuds, IPX4 in case
  - Colorways: Black
  - Foldable design: no
