description: The Motif II A.N.C. in-ear earbuds feature advanced active noise
  cancellation and Bluetooth LE Audio, delivering superior audio quality for
  music lovers.
details: |-
  Motif II A.N.C. delivers 30 hours of total playtime with active noise cancelling technology, block out those crowded train rides and rowdy streets to dive into your music without distraction. For a quick conversation, switch over to transparency mode and let the outside in. Motif II A.N.C. comes ready for Bluetooth LE Audio. This future-proof technology will ensure the best possible connection, so you'll never miss a beat.

  Marshall signature sound: carefully engineered to give clear, balanced sound no matter how loud it is turned up, from 6 mm dynamic drivers in a true wireless in-ear package.

  ANC and Transparency mode: improved active noise cancelling locks you into the sounds of your choice, and transparency mode lets the outside back in for a quick conversation. The Marshall Bluetooth app controls the ANC, activates Transparency mode, adjusts personal EQ settings and manages software updates.

  30 hours of wireless playtime: 6 hours from the earbuds alone with ANC and up to 30 hours in total with the charging case, ten more than the previous generation. Wireless charging makes it easier to charge and go, LED lights display the case battery level, and quick charge gives an extra hour of playtime from 15 minutes.

  Iconic and rugged design: the earbuds carry the Marshall M logo, an IPX5 rating and the durability needed for the road, with touch response controls that handle music, calls, volume, ANC, Transparency mode and Spotify Tap. Designed and engineered in Sweden. Made in China.
