details: |-
  The Dank Side is the 2021 Custom Shop colorway of the Dark Side workstation, in a matte green enclosure with purple knobs and a black and purple graphic. The run was limited to 50 pieces. The pedal itself is the Dark Side: a hybrid of fuzz, delay and modulation in one enclosure.

  The fuzz side is a big-fuzz style distortion based on a 1977 op-amp circuit, reworked to pick up the character of earlier transistor fuzzes and set at a lower gain to suit the period. It is described as a more transparent take on that circuit, holding sustain while keeping the character of either single coil or humbucking pickups.

  The delay and modulation side is selectable between a multi-head tape delay and four modulation voices. The delay offers twelve syncopated settings with the rhythmic quality of spinning-drum tape machines, filtered for the feel of the originals, with expression pedal control over the number of repeats and the option of running into feedback oscillation. The modulation section covers flanger, rotary speaker cabinet, U-Vibe and phaser, with blending between the flanger and the rotary cabinet and between the opto-coupler U-Vibe and the phaser.

  A port for a TRS expression pedal sits on the pedal for adjusting settings while playing, and a push-button switch changes the order of the fuzz and the delay and modulation sections; earlier units carried a TRS insert in place of that switch. At the centre is a hand-built board carrying the analogue fuzz alongside a 24-bit DSP engine, with the whole unit hand assembled and soldered.
