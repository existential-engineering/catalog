description: The CCM664 is a ceiling speaker distinguished by its adjustable
  tilt offset 25mm (1in) soft dome tweeter. It brings both a smoother and more
  detailed high frequency performance to a package that also includes a woven
  glass fibre 150mm (6in) bass/midrange driver and three-position EQ switch for
  a better off-axis response.
details: |-
  CCM664 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Performance Series, pairing a 150mm (6in) woven glass fibre cone bass/midrange driver with a 25mm (1in) Nautilus tube loaded aluminium dome tweeter mounted offset on the baffle. It is a passive design with no amplifier and no mains connection, driven from an external amplifier over ordinary speaker cable.

  The tweeter is adjustable: its housing tilts so the high frequency axis can be aimed at the listening area rather than straight down, with tilt indicators at 15 and 30 degrees marked as dots on the tweeter body. A three-position equalisation switch on the baffle is set to match the number of tilt dots, holding the off-axis balance correct at whichever angle the installer chooses. Bowers & Wilkins positions this combination as giving both smoother and more detailed high frequency performance than a fixed, downward-firing tweeter.

  The speaker is a three-part assembly: a baffle carrying the drive units and crossover, a mounting frame with an integrated bezel, and a magnetically secured grille. Speaker cable lands on side-mounted red and black spring terminals on the frame, and the baffle connects automatically through a mating connector as it is pushed into the frame and locked with three push-lock fasteners. Four QuickDog spring clamps hold the frame flush against the ceiling, and the frame must be oriented so the red arrow on its flange points at the listening area.

  Installation is into conventional stud and sheetrock ceilings. A 202mm (8in) round aperture is required and at least 140mm (5.51in) of clear depth behind the plasterboard, and the carton includes a cut-out template and a paint mask so the flange and grille can be painted in conventional domestic paint without contaminating the terminals or the grille magnets. Pre-mount kits and back boxes are offered for new-build projects, and an optional square grille is available in place of the round bezel.

  Bowers & Wilkins positions CCM6 Series speakers for background audio, conventional stereo pairs (3m to 5m apart and a similar distance in front of the listening area) and as channels in multi-channel systems, advising against corner placement in all three cases. The drive units create a stray magnetic field, so magnetically sensitive items such as CRT screens and magnetic cards should be kept at least 0.5m (20in) away; LCD, OLED and plasma screens are unaffected.
specs: |-
  - Drive units: 1x 25mm (1in) Nautilus tube loaded aluminium dome tweeter, 1x 150mm (6in) black glassfibre cone bass/midrange driver
  - Frequency range (-6dB): 45Hz to 35kHz
  - Recommended amplifier power: 25W to 130W
  - Sensitivity SPL: 87dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 240mm (9.5in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Two-way passive in-ceiling speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Connection: one pair of red and black spring terminals on the side of the mounting frame
  - Tilting offset tweeter with 15 and 30 degree tilt indicators
  - Three-position equalisation switch on the baffle, matched to the tweeter tilt setting
  - Required ceiling aperture: 202mm (8in) diameter
  - Required clear depth behind sheetrock: 140mm (5.51in)
  - Construction: baffle (drive units and crossover), mounting frame with integrated bezel, magnetically secured grille
  - Mounting: 4x QuickDog spring clamps; baffle held by three push-lock fasteners
  - Supplied in carton: speaker assembly, cut-out template, paint mask, document pack
  - Flange and grille may be painted with conventional domestic paint using the supplied paint mask
  - Optional square grille available (bezel must be removed)
  - Pre-mount kits and back boxes available for new-build installations
  - Stray magnetic field: keep magnetically sensitive items at least 0.5m (20in) away; LCD, OLED and plasma screens unaffected
  - Finish: White
  - RoHS and WEEE compliant
