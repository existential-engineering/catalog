details: |-
  The CCM664 is a ceiling speaker distinguished by its adjustable tilt offset 25mm (1in) soft dome tweeter. It brings both a smoother and more detailed high frequency performance to a package that also includes a woven glass fibre 150mm (6in) bass/midrange driver and a three-position EQ switch for a better off-axis response.

  CCM664 is a classically simple and cost effective route to high quality ceiling mount sound, and is simple and quick to install.

  The speaker is listed as a Performance two-way in-ceiling speaker in the Performance Series, in a White finish.

  CCM6 Series ceiling speakers install into a cut ceiling aperture using the supplied cut-out template. Speaker cable connects to the spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then lifted into the aperture and held by four QuickDogs spring clamps. The baffle carrying the drivers and crossover fits into the frame on three push-lock fasteners, and the grille is held magnetically.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) soft dome tweeter
  - Drive units: 1x ø150mm (6in) black glassfibre cone bass/midrange driver
  - Frequency range (-6dB): 45Hz to 35kHz
  - Recommended amplifier power: 25 to 130W
  - Sensitivity SPL (2.83V, 1m): 87dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - Adjustable tilt offset tweeter and three-position EQ switch
  - Red and black spring terminals on the side of the frame
  - Finish: White
