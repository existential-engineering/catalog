description: The dbx db12 is a phantom-powered active direct injection box
  featuring a custom mu-metal-shielded transformer, gold-plated Neutrik XLR
  output, and a 3-way pad switch for handling instrument through speaker-level
  signals. A green LED phantom power indicator confirms active operation.
details: |-
  The dbx db12 is dbx's premium active direct injection box, combining bullet-proof construction with extraordinary audio performance. Like the passive db10, it uses custom mu-metal-shielded transformers and high-quality Neutrik connectors, but adds +48V phantom power operation and a green LED power indicator for added reliability and confidence on stage.

  The db12 accepts instrument, line, and speaker-level signals via its Hi-Z 1/4" input jack, with a parallel thru jack for simultaneous amp connection. A 3-way pad switch (0/20/40 dB) accommodates a wide range of signal levels. A flat/high-cut filter switch, output polarity invert switch, and ground lift switch provide additional flexibility.

  The active circuit design and transformer isolation deliver premium noise performance, while the stackable chassis with rubber feet and premium chrome toggle switches make the db12 a durable, professional-grade workhorse for studio, touring, and portable applications.
specs: |-
  - Input Connectors: 1/4" jack (unbalanced, RF filtered)
  - Output Connectors: XLR male balanced; parallel 1/4" thru jack
  - Input Impedance: 150 kΩ typical
  - Output Impedance: 150 kΩ typical
  - Max Input Level (0 dB pad): +20 dBu
  - Max Input Level (20 dB pad): +40 dBu
  - Max Input Level (40 dB pad): +60 dBu
  - Max Output Level: 0 dBu
  - Frequency Response: 20 Hz – 20 kHz, ±2.5 dB
  - Noise: <-105 dB unweighted, 22 kHz BW
  - THD (20 Hz–20 kHz): <0.01%
  - THD (1 kHz): <0.005%
  - Power: +48V phantom power
  - Dimensions: 5.82" L × 5.44" W × 2.20" H (148 × 138 × 56 mm)
  - Weight: 1.4 lbs (0.65 kg)
  - Warranty: 4 years
