description: >-
  The Crumar Trilogy is a six-voice analog hybrid keyboard produced from 1981 to 1985 that
  combines three distinct sections — synthesizer, strings, and organ — into a single
  instrument. Each section features individual outputs, allowing musicians to separate
  sounds for external processing or mixing.
details: |-
  The Trilogy derives its name from its three integrated functional sections that work both independently and in combination. Each section features individual outputs, allowing musicians to separate the sounds for external processing or mixing. This design represented an ambitious attempt to consolidate multiple instrument types into one keyboard.

  The synthesizer section provides the core sound-shaping capabilities with dual voltage-controlled oscillators offering sawtooth and square waveforms. Players could switch between waveforms during performance by pressing and releasing keys. A low-frequency oscillator with triangle and square options, plus a simple ramp generator, expanded modulation possibilities for dynamic sound creation.

  The string and organ sections offer minimal user control. The organ component allows octave range selection, while the string section includes only a basic Attack-Release envelope generator. The instrument included seven preset sounds in its internal memory, though users could not create custom patches despite the onboard storage capability.

  Crumar later released a simplified variant called the Stratus, which removed the string section and memory functionality. Though the Trilogy gained some recognition as one of Crumar's more notable instruments and maintains collector interest due to rarity, build quality issues and maintenance concerns can be a factor with used examples.
specs: |-
  - Polyphony: 6 voices
  - Multitimbral: 3 parts
  - Oscillators: 4 VCOs
  - Waveforms: Pulse, Saw Up, White Noise
  - Filter: 24dB Slope (2-pole and 4-pole), Low Pass with Resonance
  - LFO: 1 (Saw Up and Square waveforms)
  - Envelopes: 2 VCA with ADSR
  - Keyboard: 49 keys (non-weighted, plastic)
  - Memory: 8 patches (RAM)
  - Factory Presets: 7
releaseDate: "1981"
