description: >-
  A single-voice analog percussion synthesizer module from 2010 that uses two coupled T-bridge
  oscillators to create realistic membrane drum and snare sounds.
details: |-
  The JoMoX M.Brane 11 is a specialized analog percussion synthesizer released in 2010, focused
  entirely on producing membrane-style drum sounds including snares and various percussion tones.
  Rather than relying on samples, it uses two T-bridge oscillators that couple together to replicate
  the acoustic behavior of vibrating drum membranes, yielding organic and responsive analog
  percussion tones.

  Eight adjustable parameters provide direct control over decay time, membrane pitch, damping,
  coupling between oscillators, noise intensity, and low-pass filtering. The coupling parameter is
  particularly important, as it determines how the two oscillators interact to produce the
  characteristic membrane-like timbral complexity that sets the M.Brane 11 apart from simpler analog
  drum voices.

  The module ships with 110 factory sounds and supports 110 user patches in RAM, all fully
  controllable via MIDI. Two LFOs with sawtooth, square, and triangle waveforms add movement to the
  percussion sounds. A trigger input accepts audio signals or drum pad hits for activation, making
  the M.Brane 11 easy to integrate into both electronic and hybrid acoustic-electronic setups.

  Connectivity is straightforward with MIDI In/Out, a trigger audio input, mono output, and 9V DC
  power, keeping the desktop form factor compact and studio-friendly.
specs: |-
  - Polyphony: 1 voice
  - Oscillators: 2 T-bridge oscillators with coupling
  - LFO: 2 (sawtooth up/down, square, triangle)
  - Parameters: 8 (decay, pitch, damping, coupling, noise, filter)
  - Memory: 110 patches RAM, 110 patches ROM
  - Trigger: Audio input for external triggering
  - Output: Mono audio
  - Control: MIDI In/Out
  - Power: 9V DC
releaseDate: "2010"
releaseDateYearOnly: true
