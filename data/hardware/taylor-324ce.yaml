details: |-
  The 324ce is a Grand Auditorium acoustic-electric with Venetian cutaway, constructed entirely from solid Neo-Tropical Mahogany for the top, back, sides, and neck. This all-mahogany build produces a warm, bold midrange character with vintage tonality suited to both recording and live performance. The satin finish with Shaded Edgeburst treatment gives the instrument a refined, understated look.

  Taylor's patented V-Class bracing improves volume, sustain, and intonation simultaneously. The West African Crelicam Ebony fretboard and bridge add tonal density, while the Firestripe pickguard lends a classic aesthetic.

  Expression System 2 behind-the-saddle electronics capture the guitar's natural acoustic character transparently for amplified performance. The guitar ships with a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Neo-Tropical Mahogany (solid, satin)
  - Back/sides: Neo-Tropical Mahogany (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Inlays: Gemstone
  - Scale length: 25-1/2"
  - Nut width: 1-3/4"
  - Tuners: Taylor Nickel
  - Binding: Black
  - Pickguard: Firestripe
  - Electronics: Expression System 2 (ES2)
  - Finish: Shaded Edgeburst (top), satin (back/sides)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
