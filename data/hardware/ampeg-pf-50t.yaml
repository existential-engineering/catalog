description: "The 50-watt PF-50T traces its origins back to the legendary B-15
  flip-top amp, revered for its glorious all-tube, low-wattage studio and stage
  sounds. Features include a versatile EQ section, a transformer-balanced DI
  circuit, and a user-adjustable Bias control for adjusting the power
  amplifier's response to playing dynamics."
details: |-
  All-tube design that traces its origins back to the legendary B-15 flip-top amp, revered for its glorious all-tube, low-wattage studio and stage sounds.

  Versatile 3-Band EQ section with a 5-position Mid control and Ultra Hi/Lo boosts gives players broad tonal range from classic B-15 warmth to modern aggression.

  Tube-driven, transformer-balanced DI circuit with XLR connector for direct connection to consoles and recording interfaces.

  User-adjustable Bias control for tailoring the power amplifier's response to playing dynamics. Does not need to be connected to a speaker to operate.
specs: |-
  - 50 Watts power output
  - All-tube design
  - 3-Band EQ with 5-position Mid control
  - Ultra Hi and Ultra Lo boosts
  - Tube-driven, transformer-balanced XLR DI
  - User-adjustable Bias control
  - Weight: 19.4 lb / 8.8 kg
