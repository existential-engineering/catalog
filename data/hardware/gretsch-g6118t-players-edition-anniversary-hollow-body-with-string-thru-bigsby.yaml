details: |-
  The world's greatest hollow body guitars just got even better. Designed for the working professional, our all-new Players Edition Hollow Body instruments preserve the authentic Gretsch sound and style while incorporating cutting-edge features for maximum power, comfort and versatility.

  At the intersection of innovation and tribute, you'll find the G6118T Players Edition Anniversary Hollow Body with String-Thru Bigsby — a guitar that honors its inspirational past while remaining firmly rooted in the future of music.

  The all-new FT-67 Filter'Tron humbucking pickups were designed to capture authentic vintage Gretsch voicing but with a more well-rounded tone for modern playing styles.

  A finely tuned modern music machine, this guitar features the vintage Anniversary appointments Gretsch fans desire — from its two-tone finishes to nickel hardware including Gotoh locking tuning machines.
