description: Offers drummers heavy-gauge tubing, double-braced legs, and more.
details: |-
  DW's 5000 Series Boom Cymbal Stands offer drummers heavy-gauge tubing, double-braced legs and more, in a road-worthy package. DW boom arms collapse into their stands, telescope-style, to easily convert to a straight stand.

  Sturdy, double-braced tripod legs and heavier gauge tubing offer plenty of support for larger cymbals, and plastic tube insulators kill the rattle in recording situations.

  The Toothless Tilter and hinged memory locks allow you to quickly and firmly set the stand heights and angles, so your cymbals stay where you put them.
specs: |-
  - Recessible boom arm, convertible to a straight stand
  - Adjustable cymbal seat
  - Attached felt washers on cymbal seat and wing nut
  - Toothless Tilter with TechLock
  - Plastic tube insulators
  - Double-braced tripod legs, heavy-gauge tubing
