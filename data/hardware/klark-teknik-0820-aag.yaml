description: "The DN701 extends the DN700 architecture with substantially
  greater delay memory: one input feeds three independently adjustable outputs,
  each adjustable from zero to 1.73 seconds in 26.5 microsecond steps. It shares
  the DN700's signal-path topology, with FDNR seven-pole elliptical filters and
  a differential voltage- and current-balanced input."
details: |-
  The DN701 extends the DN700 architecture with substantially greater delay memory. One input feeds three independently adjustable outputs, with delay time on each adjustable from zero to 1.73 seconds in 26.5 microsecond steps, and the signal-path topology is shared with the DN700, preserving the noise and distortion figures that made the series a broadcast standard of its period.

  The 1.73 second per-output range supports applications well beyond simple speaker time alignment, including programme delay for broadcast censorship, large-venue back-delay-tower work and creative slapback effects on tracking dates. The 26.5 microsecond resolution keeps positional artefact below audibility for all practical use.

  The audio input is differential, voltage- and current-balanced, achieving symmetry better than -50 dB from 20 Hz to 10 kHz. Seven-pole elliptical input and output filters use FDNR (Frequency Dependent Negative Resistance) circuitry for optimum noise and distortion, and dynamic range is better than 85 dB unweighted and better than 90 dB A-weighted at any delay setting. Memory settings are retained for a minimum of one year without power.

  Typical applications are broadcast programme delay, large-venue PA delay-tower alignment and vintage studio production. The DN701 is the extended-range sibling of the DN700 and shares its sonic signature.
specs: |-
  - One input and three independently adjustable outputs
  - Delay range 0 to 1.73 seconds per output, in 26.5 microsecond steps
  - Seven-pole elliptical input and output filters using FDNR circuitry
  - Differential electronically balanced input, voltage- and current-balanced
  - Input symmetry better than -50 dB from 20 Hz to 10 kHz
  - Dynamic range: better than 85 dB unweighted, better than 90 dB A-weighted at any delay setting
  - Memory retention: one year minimum without power
  - 1U rackmount
