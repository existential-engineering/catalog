details: |-
  The latest incarnation of Caparison's fixed bridge Horus model is the Horus-WB-FX. In efforts to further refine the Horus FX, Caparison have developed the new WB body construction, featuring a walnut top and Australian blackwood back for a thick yet punching tone that doesn't get lost in the mix, which is beautifully complemented by a specifically designed set of Caparison pickups that will deliver the monstruous rock tones that people cherish in this model, yet will provide you with equally convincing rich and dynamic tones in more subdued settings when high gain isn't a part of the sonic palette. Further upgrades include the revised high mass Caparison fixed bridge, which offers both clear and rich note attack with excellent sustain and a huge range of adjustment for standard all the way to very low tunings, and Jescar jumbo stainless steel frets, which further augment the clarity while possessing superior durability even under the most demanding circumstances. While performance is of paramount importance, aesthetics are not forgotten and the new Horus-WB-FX also features a fully bound neck as seen on its floating bridge brethren, Caparison's renowned clock inlays on your choice of an ebony or maple fretboard and 3 stunning new finishes, all which showcase the walnut top's grain as subtly or ostensibly as you may desire: transparent white, transparent charcoal black and natural.
