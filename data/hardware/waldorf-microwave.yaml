description: >-
  The Waldorf Microwave is a digital/analog hybrid rack synthesizer released in 1989 that
  processes digitally sampled wavetables through analog VCA envelope and filter sections.
  Built on PPG Wave technology, it delivers a classic and warm yet highly complex sound in
  a compact two-unit rack format. Its hybrid architecture and classic Curtis analog
  filters have made it a sought-after instrument for electronic music producers.
details: |-
  Following PPG's decline in the late 1980s, the company's technology and personnel merged with Waldorf, and the Microwave emerged as their first collaborative product. It directly builds upon PPG Wave architecture, employing the same wavetables from the PPG Wave 2.3, enabling it to produce tonal characteristics associated with seminal acts like Tangerine Dream.

  The instrument functions as a hybrid system where digitally sampled wavetables are processed through analog VCA envelope and VCF filter sections. With minimal onboard controls and a single parameter knob, comprehensive sound design typically requires external editor hardware or software.

  Operating system upgrades via EPROM chips expanded capabilities significantly. Later versions introduced additional wavetables, custom waveform creation, speech synthesis functionality, and various improvements, with the final OS version 2.0 released in 1994.

  Several years after its release, Waldorf introduced the fully analog Wave synthesizer for the high-end market, while the more accessible Microwave II arrived in 1997 as a fully digital DSP-driven alternative that lacked the warmth and character of the original.
specs: |-
  - Polyphony: 8 voices, 8-part multitimbral
  - Oscillators: 64 ROM wavetables and waveform samples
  - Filter: Analog Curtis CEM 24 dB/octave lowpass filter
  - Envelopes: 4 VCA envelopes
  - Memory: 64 internal patches plus 64 via external memory card
  - Control: MIDI
  - Format: Two-unit rack mount
  - Effects: None
  - Arpeggiator/Sequencer: None
  - Keyboard: None (rack module)
releaseDate: "1989"
