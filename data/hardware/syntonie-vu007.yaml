description: VU007 is a Eurorack module that encodes 1V RGB video into SD
  Component video, using a 14pin sync cable for composite sync and blanking.
  Sold as a DIY PCB set.
details: |-
  1V RGB to SD Component Encoder. Uses 14pin sync cable for composite sync and blanking. PCB set and DIY kit comes with pre-soldered ADA4851-4. Input : 0-1V RGB, 499 ohms, jack

  Output : 0-700mV YpbPr, 75 ohms, RCA

  PCB Set: includes Main/Control/Clip/Power/Panel PCBs and pre-soldered ADA4851-4. - 4 HP
  - 53mA +12V
  - 44 mA -12V
  - 0 mA +5V
  - 65mm deep

  Documentation
