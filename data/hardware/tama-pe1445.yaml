description: The drum set is a jazz instrument — but you can play any style of
  music on it. The "Jazz Bass" was, in fact, played on more hit pop tunes than
  you can count; the "Jazz Snare" may enjoy equally legendary status one day.
details: |-
  Inside Sticker: On each signature snare drum, a special sticker bearing the artist’s signature is placed on the inside of every shell. The artist signs each sticker by hand, one by one, adding a personal touch that makes each signature snare drum especially unique.

  Super Sensitive Hi-Carbon Snare Wire (MS20RL14C): In order to provide a more crisp and sensitive sound, we redesigned our Snare Wires using new materials, customizing the shape of the plate, and changing the wire coils' winding pattern. As a result, the new "Super Sensitive Hi-Carbon Snare Wire” fits more closely to the snare side head, providing greater sensitivity and brighter, crisper sound.

  “Linear-Drive” Strainer (US. PAT.NO.8017846): The "Linear-Drive" strainer is designed for greater control of the lever adjustment arm and more precise control of the strainer's deployment motion. The strainer movement works in a true linear motion. Even if the strainer is engaged rapidly, you will not hear the typical "slap" of the snare wires hitting the bottom drumhead. To prevent the snare wires from loosening, this strainer also has a ratchet system on its tension adjustment mechanism. Single click adjustments offer a vertical pull of 0.083mm in wire motion, which allows for ultra-sensitive micro adjustments.

  2.3mm Sound Arc Hoop (8 Hole): This inward curved 2.3mm steel hoop enhances the natural tone of the snare drum, and offers sensitivity, precise tuning, and control.

  Shell Material: 6mm, 4ply Spruce + 2 inner ply Maple w/ Sound Focus Ring only for batter side (Same configuration : 6mm, 4ply Spruce + 2 inner ply Maple)
