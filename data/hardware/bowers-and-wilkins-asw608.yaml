description: The ASW608 8-in subwoofer is the most compact of the 600 Series
  subwoofers and offers big sound in smaller spaces.
details: |-
  ASW608 is the most compact subwoofer in the Bowers & Wilkins ASW Series, presented as the answer to big sound in smaller spaces. It is an active closed-box subwoofer system, so the cabinet is sealed and the amplification is built in.

  A single 200mm (8in) paper and Aramid fibre long-throw cone does the work. Bowers & Wilkins says the 8-in driver is designed for fast, tight and dramatic bass even in very small rooms, and that under the skin sits a powerful amplifier that lets the subwoofer hit hard with music and movies. The shared ASW information sheet quantifies that amplifier as a 200W ICEpower Class D design.

  Setup is done on the amplifier panel rather than in software. The controls are input level for line in, input level for speaker in, a low-pass filter frequency control that applies to the line input only, a low-pass filter bypass, a bass extension setting, a bass roll-off alignment, an auto sense on and standby mode, and a phase switch. Bass extension runs from -6dB at 23Hz in position A to -6dB at 36Hz in position C.

  Connections are conventional hi-fi subwoofer fare. There is a stereo line in on RCA phono, a speaker in on binding posts and a 12v trigger on a 3.5mm jack, with an input impedance of 33kOhm and a signal to noise ratio better than 90dB. Being an active subwoofer it also draws mains power, rated at 40W in use and 0.5W in standby.

  The cabinet is 260mm (10.2in) high without feet or spikes and 260mm (10.2in) wide, 305mm (11.99in) deep without grilles and 330mm (13in) deep including grilles and controls, and the unit weighs 8.85kg (19.5lb). Two cabinet finishes are offered, Black and White, with a Black or Grey grille; the store sells them as Matte Black and Matte White.
specs: |-
  - Description: active closed-box subwoofer system
  - Drive units: 1 x 200mm (8in) paper / Aramid fibre cone long-throw
  - Frequency response: +/-3dB 32Hz to 40 / 140Hz adjustable (EQ at A)
  - Frequency range: -6dB at 23Hz and 25 / 140Hz adjustable (EQ at A)
  - Bass extension: -6dB at 23Hz (position A), -6dB at 28Hz (position B), -6dB at 36Hz (position C)
  - Amplifier: 200W ICEpower Class D
  - Technical features: volume level (line in), volume level (speaker in), low-pass filter frequency (line in only), low-pass filter bypass, bass extension, bass roll-off alignment, auto sense on / standby, phase switch
  - Low-pass filter: active 4th-order, variable cut-off frequency
  - Inputs: stereo line in (RCA Phono), speaker in (binding post), 12v trigger (3.5mm jack)
  - Power consumption: 40W / 0.5W standby
  - Input impedance: 33kOhm
  - Signal / noise: >90dB
  - Dimensions: height 260mm (10.2in) not including feet or spikes, 272mm (10.7in) including feet, 288mm (11.3in) including spikes; width 260mm (10.2in); depth 305mm (11.99in) not including grilles, 330mm (13in) including grilles and controls
  - Net weight: 8.85kg (19.5lb)
  - Cabinet finishes: Black, White
  - Grille finishes: Black, Grey
