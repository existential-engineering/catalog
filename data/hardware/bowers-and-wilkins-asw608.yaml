description: The most compact of the Bowers & Wilkins ASW Series subwoofers. An
  active closed-box design with a single 200mm (8") paper/Aramid fiber
  long-throw drive unit, engineered to deliver fast, tight bass for smaller
  rooms.
details: |-
  The ASW608 is the smallest model in the Bowers & Wilkins ASW Series of powered subwoofers. It uses a single 200mm (8") paper/Aramid fiber long-throw drive unit in a sealed (closed-box) cabinet, an alignment chosen to produce tight, well-controlled low-frequency output suited to smaller rooms.

  Amplification is integrated into the cabinet, and the active design includes a built-in low-pass filter with adjustable crossover frequency, a bypass option for line-level input, adjustable bass extension, and bass roll-off alignment controls. A phase switch and auto-sense standby behaviour are also provided, allowing the subwoofer to be tuned to the rest of a system and to power down when not in use.

  Connectivity covers both home theater and two-channel use cases. Stereo line-level inputs are provided via RCA phono connectors, speaker-level input via binding posts (with its own volume control), and a 3.5mm 12V trigger input allows the subwoofer to be powered up automatically by a connected amplifier or processor.

  The cabinet is offered in Black and White finishes with a choice of Black or Grey grille. Net weight is 8.85kg (19.5 lbs), and the enclosure measures 260mm wide by 260mm tall (without feet) by 305mm deep (without grilles), making it well suited to discreet placement in compact listening environments.
specs: |-
  - Drive unit: 1x 200mm (8") paper/Aramid fiber cone long-throw
  - System type: Active closed-box subwoofer
  - Input impedance: 33 kΩ
  - Signal/Noise ratio: >90 dB
  - Power consumption: 40W (0.5W standby)
  - Controls: line-in volume, speaker-in volume, low-pass filter frequency, low-pass filter bypass (line in), bass extension, bass roll-off alignment, auto sense on/standby, phase switch
  - Inputs: Stereo line in (RCA phono), Speaker in (binding posts), 12V trigger (3.5mm jack)
  - Height: 260mm (10.2") without feet/spikes; 272mm (10.7") with feet; 288mm (11.3") with spikes
  - Width: 260mm (10.2")
  - Depth: 305mm (11.99") without grilles; 330mm (13") with grilles
  - Net weight: 8.85kg (19.5 lbs)
  - Cabinet finishes: Black, White
  - Grille finishes: Black, Grey
