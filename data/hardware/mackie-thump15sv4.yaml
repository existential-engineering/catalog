url: https://mackie.com/en/products/loudspeakers/thumpv4-series/thump15sv4.html
description: 15" Professional Powered Subwoofer combining a 1400W Class-D active
  subwoofer amplifier with a 15" high-performance woofer for 132 dB maximum SPL
  and 34 Hz low-frequency performance.
details: |-
  Craving some extra oomph for your PA system? You need a subwoofer. Thump15Sv4 shakes the floorboards with massive bass that gets people on their feet, for moments that leave a lasting impression.

  Thump15Sv4 combines our 1400W Class-D active subwoofer amplifier with a 15" high-performance woofer, for massive 132 dB maximum SPL and 34 Hz low frequency performance.

  This 15 inch subwoofer is the perfect match for Thumpv4 loudspeakers (or any PA speakers) with selectable high pass modes, plus a 'variable' mode for setting the crossover yourself.
specs: |-
  - 1400W Class-D amplifier
  - 15" high-performance woofer
  - 132 dB maximum SPL
  - 34 Hz low frequency performance
  - Four high-pass modes with 1.4 ms alignment delay
  - Phase invert switch
  - Stereo or mono summing capability
  - Variable level control (Muted to +6 dB)
  - Defeatable front LED
  - M20 thread for speaker pole
  - Built-in handles
  - Height: 18.5 in / 470 mm
  - Width: 22.1 in / 561 mm
  - Depth: 23.0 in / 584 mm
  - Weight: 57.4 lb / 26.0 kg
