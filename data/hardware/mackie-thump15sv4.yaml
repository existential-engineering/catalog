description: Mackie Thump15Sv4 15" Professional Powered Subwoofer feat. 132 dB
  SPL and 34 Hz Low Frequency
details: |-
  Thump15Sv4 combines a 1400W Class-D active subwoofer amplifier with a 15 inch high-performance woofer for a 132 dB maximum SPL and a 34 Hz low frequency response.

  Four selectable high-pass modes tailor the crossover to the loudspeakers above it: Thump 12 for Thump12v4 (140 Hz), Thump 15 for Thump15v4 (110 Hz), Thump GO for the battery-powered Thump GO (150 Hz), and Variable for setting the crossover manually to match any loudspeakers. Every mode includes 1.4 ms of alignment delay.

  Connections are stereo XLR inputs from a DJ controller, mixer or other source, stereo XLR high-pass outputs feeding the loudspeakers, and stereo XLR full-range outputs that chain the full, unaltered signal to the next subwoofer.

  Essential subwoofer controls include a phase invert switch, a defeatable front LED, stereo or mono summing for single or dual subwoofer deployment, and a variable level control from muted to +6 dB.

  The cabinet is rugged but light enough to load, with built-in handles and an M20 thread for the SPM400 speaker pole, and weighs 57.4 lb / 26.0 kg. Thumpv4 subwoofers are designed to sit on the floor or stage and are not designed to be pole-mounted or suspended.
specs: |-
  - 1400W Class-D amplifier for 132 dB maximum SPL
  - 15 inch high-performance woofer for 34 Hz low frequency
  - Frequency response (-3 dB): 34 Hz - 160 Hz
  - Frequency response (-10 dB): 29 Hz - 160 Hz
  - High-pass modes: Thump 12 (140 Hz), Thump 15 (110 Hz), Thump GO (150 Hz), Variable
  - All high-pass modes include 1.4 ms alignment delay
  - Stereo XLR inputs
  - Stereo XLR high-pass outputs
  - Stereo XLR full-range outputs
  - Phase invert switch
  - Defeatable front LED
  - Stereo or mono summing for single or dual subwoofer deployment
  - Variable level control (muted to +6 dB)
  - Peak and RMS limiting, power supply and amplifier thermal protection
  - Detachable line cord: 100-240V~, 50-60 Hz, 400W
  - AC connector: 3-pin IEC 250 VAC, 10 A male
  - Built-in handles, M20 thread for SPM400 speaker pole
  - Height 18.5 in / 470 mm, Width 22.1 in / 561 mm, Depth 23.0 in / 584 mm
  - Weight: 57.4 lb / 26.0 kg
