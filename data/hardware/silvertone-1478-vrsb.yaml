details: |-
  Reset the Offset

  The Silvertone 1478 VRSB returns with modern performance upgrades while preserving the iconic style that made it a favorite since its 1964 debut. Known for its red sunburst finish, offset contours, bound fingerboard, and signature vibrato, the 1478 remains a classic for players and collectors alike. Now re-engineered for today's guitarist, the 1478RSB features a comfortable modern C-shape neck with a 24 ¾" scale length, replacing the original oversized profile. Custom Silvertone Silver Foil pickups—housed in mini-humbucker casings—deliver improved clarity, balance, and dynamic response. A Tune-o-matic–style bridge with roller saddles provides smooth vibrato use and rock-solid tuning stability. Vibrato tailpiece for expressive pitch control. Designed for fast playability and long sessions on stage or in the studio. Premium Construction

  Enhanced Vintage Tone

  Inspired by early DeArmond pickups, the new noiseless Silver Foils deliver chimey highs, warm mids, and articulate response—sitting between overwound single-coils and traditional humbuckers. They shine with clean tones, overdrive, and modern digital rigs. Specs

