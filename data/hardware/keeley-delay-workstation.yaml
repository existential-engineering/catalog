description: Dual high-end DSP delay and reverb pedal with tap tempo, carrying
  two banks of eight effects.
details: |-
  The Delay Workstation is a dual DSP delay and reverb pedal that gathers Keeley's delay and reverb patches into a compact enclosure. Two banks of eight effects can be combined, so vintage slapback and multi-head tape echoes can be paired with spring or plate reverbs, or warm analog delays run into chamber and hall spaces.

  The delay bank covers slapback with reverb, tape delay with tone control, a multi-head echo with three-head control, analog delay with dynamic modulation, digital delay with inverse dynamic modulation, a subdivided delay offering dotted eighth, eighth, triplet and sixteenth values, a ducking delay with a compression ratio control, and a pitch-shifting delay with octave up and down control.

  The reverb bank holds spring with tension control, chamber with filter control, hall with tone control, plate with tone control, shimmer with octave up control, and a flanged reverb with vibrato or random modulation. Two delays also sit in the reverb bank, which allows ping-pong and other rhythmic patterns. A Morph control applies twists such as spring tension, shimmer and random flanging to the reverb patches.

  Tap tempo is on board on the delay side, and the reverb side accepts external expression control.
