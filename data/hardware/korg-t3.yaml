description: >-
  The Korg T3 is a 61-key digital workstation from 1989 that expanded on the
  M1 with doubled sample memory, improved acoustic sounds, a built-in floppy
  drive, and a 50,000-event sequencer.
details: |-
  Released shortly after the groundbreaking M1, the Korg T3 was often described as an "M1 on steroids." It doubled the PCM sample memory to 4 MB, resulting in noticeably improved acoustic instrument samples and overall sound quality that addressed some of the M1's limitations.

  The synthesis architecture pairs two digital oscillators with a non-resonant low-pass filter, two LFOs, and three ADSR envelope generators. With 16-voice polyphony across 8 multitimbral parts, the T3 could handle complex layered arrangements. Storage expanded significantly with 200 programs and 100 combinations available in memory.

  A built-in 3.5-inch floppy drive was a welcome addition, allowing convenient backup and transfer of patches and sequences. The onboard sequencer offered 50,000 events of capacity across 20 songs and 200 patterns, making the T3 a legitimate self-contained production tool.

  Dual multi-effects processors with 33 effect types provided studio-quality processing without external gear. The 61-key keyboard with aftertouch, velocity, and breath control support made the T3 an expressive performance instrument. MIDI connectivity included separate A and B outputs plus a thru port for flexible routing in larger setups.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 8 parts
  - Oscillators: 2 digital with 4 MB PCM ROM
  - Filter: 1 non-resonant low-pass VDF
  - LFOs: 2
  - Envelopes: 3 ADSR
  - Keyboard: 61 keys with aftertouch and velocity
  - Memory: 200 programs, 100 combinations
  - Sequencer: 50,000 events, 20 songs, 200 patterns
  - Effects: 2 multi-effects processors, 33 effects
  - Storage: 3.5" floppy drive
  - MIDI: In/Out A/Out B/Thru
