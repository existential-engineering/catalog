description: >-
  The Korg T3 is a 61-key digital workstation synthesizer released in 1989,
  widely regarded as an "M1 on steroids" due to doubled PCM sample memory and
  expanded storage. It combines sampling, synthesis, and an 8-track sequencer
  with dual multi-effects processors into a self-contained music production
  instrument. Notable users include Jean Michel Jarre, who featured it on his
  album Waiting for Cousteau.
details: |-
  Released shortly after the groundbreaking M1, the Korg T3 was often described as an "M1 on steroids." It doubled the PCM sample memory to 4 MB, resulting in noticeably improved acoustic instrument samples and overall sound quality that addressed some of the M1's limitations. Despite these enhancements, a high price point and marketing challenges limited its commercial impact.

  The synthesis architecture pairs two digital oscillators with a non-resonant low-pass filter, two LFOs, and three ADSR envelope generators. With 16-voice polyphony across 8 multitimbral parts, the T3 could handle complex layered arrangements. Storage expanded significantly with 200 programs and 100 combinations available in memory.

  A built-in 3.5-inch floppy drive was a welcome addition for the era, allowing convenient backup and transfer of patches and sequences. The onboard 8-track sequencer offered 50,000 events of capacity across 20 songs and 200 patterns, making the T3 a legitimate self-contained production tool.

  Dual multi-effects processors with 33 effect algorithms provided studio-quality processing without external gear. The 61-key keyboard with aftertouch, velocity sensitivity, and breath control support made the T3 an expressive performance instrument. MIDI connectivity included separate A and B outputs plus a thru port for flexible routing in larger setups. The backlit 64x240 character LCD display improved usability over its predecessor. The release of the more affordable Korg 01/W workstation later overshadowed the T3's significance in the market.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 8 parts
  - Oscillators: 2 digital with 4 MB PCM ROM
  - Filter: 1 non-resonant low-pass VDF
  - LFOs: 2
  - Envelopes: 3 ADSR
  - Keyboard: 61 non-weighted keys with aftertouch, velocity, and breath control
  - Display: 64x240 character backlit LCD
  - Memory: 200 programs, 100 combinations
  - Sequencer: 8-track, 50,000 events, 20 songs, 200 patterns
  - Effects: 2 multi-effects processors, 33 algorithms
  - Storage: 3.5" DS/HD floppy drive
  - MIDI: In / Out A / Out B / Thru
