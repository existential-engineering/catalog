url: https://bastl-instruments.com/eurorack/modules/knit-rider-exp
description: Expander module that adds clock OUT and reset IN/OUT connections to
  the Knit Rider sequencer. The clock output pulses each time a step on the Knit
  Rider changes (1 step equals 4 substeps). The reset socket functions as an
  output in master mode and an input in slave mode. Also includes a 3-way
  passive multiple with clock inverter (inversion threshold at 2.5V). Powered by
  the Knit Rider module via ribbon cable.
details: "2HP Eurorack expander for the Knit Rider sequencer. Powered by the
  Knit Rider module via ribbon cable; combined current draw +12V: <40 mA. Clock
  inverter inversion threshold at 2.5V."
