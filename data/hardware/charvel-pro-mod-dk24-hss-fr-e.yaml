details: |-
  The Pro-Mod DK24 HSS FR E pairs a Dinky-shaped alder body in a gloss Infinity Blue finish with a bolt-on maple neck featuring graphite reinforcement and a hand-rubbed satin urethane finish. The Speed Neck profile includes rolled fingerboard edges for a broken-in feel, while a sculpted shredder's cut heel and scalloped lower back bout open up unimpeded upper-fret access.

  An ebony fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets with offset white dot inlays, anchored by a 25.5" scale length and a 1.6875" Floyd Rose 1000 Series locking nut.

  Electronics are built around a versatile HSS configuration: a Seymour Duncan Full Shred TB-10 at the bridge paired with Seymour Duncan Flat Strat SSL-6 (middle) and SSL-6 RWRP (neck) single-coils, routed through a 5-position blade switch. A 500K EVH Bourns Low Friction volume pot and a no-load tone control round out the wiring.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with locking nut and tremolo arm for rock-solid tuning stability under heavy whammy abuse, along with Charvel-branded die-cast tuning machines and a black hardware finish. A heel-mount truss rod adjustment wheel completes a modern, performance-focused platform.
