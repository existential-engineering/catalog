description: >-
  An 8-voice expandable digital synthesizer from Radikal Technologies featuring three oscillators
  per voice with continuously variable waveforms, dual filters, four effects buses, a built-in
  accelerometer for motion-controlled sound design, and a 61-key keyboard.
details: |-
  Released in 2011, the Radikal Technologies Accelerator represented an ambitious approach to digital synthesis with a focus on real-time performance control. Its three DSP oscillators per voice offered continuously variable waveforms that could morph smoothly between sine, triangle, sawtooth, and square shapes using Time Linearity Modulation (TLM), a technique that provided organic timbral transitions not possible with simple waveform switching.

  The synthesis architecture was deep, with each voice featuring dual filters configurable as 12 or 24 dB low-pass, high-pass, band-pass, or notch types, plus a unique string filter for resonant body modeling. Six assignable envelope generators and four LFOs per part fed into an extensive modulation matrix, giving sound designers fine-grained control over every aspect of the sound. Phase modulation, ring modulation, and oscillator sync expanded the timbral range further.

  Performance features set the Accelerator apart from typical digital workstations. An internal accelerometer allowed physical movement of the instrument to modulate sound parameters in real time, adding a genuinely novel dimension to live performance. The 32-step sequencer per part and programmable arpeggiator provided rhythmic and melodic generation, while four effects buses offered distortion, modulated delay, phasing, Leslie simulation, chorus, and reverb processing.

  Starting at 8 voices expandable to 32, and 2-part multitimbral expandable to 8, the Accelerator could grow with a musician's needs. Its 500 sound memories, 300 performance memories, and 100 performance chain memories provided ample storage, while a sound selection panel with random generation function encouraged exploration. The 61-key velocity and aftertouch sensitive keyboard completed the package as a serious performance instrument.
specs: |-
  - Polyphony: 8 voices (expandable to 32)
  - Multitimbral: 2 parts (expandable to 8)
  - Oscillators: 3 DSP per voice (variable waveforms with TLM)
  - Waveforms: Continuously variable sine/triangle/saw/square, noise
  - Filters: 2 per voice (12/24 dB LP, HP, BP, notch) plus string filter
  - LFOs: 4 per part
  - Envelopes: 6 assignable per voice
  - Sequencer: 32-step per part
  - Arpeggiator: Up, down, random
  - Effects: 4 buses (distortion, mod delay, phaser, Leslie, chorus, reverb)
  - Memory: 500 sounds, 300 performances, 100 performance chains
  - Keyboard: 61 keys with velocity and aftertouch
  - Control: MIDI In/Out/Thru, USB MIDI
  - Special: Internal accelerometer for motion control
