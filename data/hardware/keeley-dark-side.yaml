description: "- Truly Inspiring Fuzz - Multi Head Tape Delay - Rotary/Flanger U-Vibe/Phaser"
details: |-
  The Dark Side is a workstation pedal built from three sections: fuzz, delay and modulation. The fuzz side is an op-amp big fuzz voicing modelled on a 1977 circuit, gained down to suit that period, and is described as a more transparent take on the big fuzz that keeps the character of either single coil or humbucker pickups while sustaining.

  The delay and modulation side can be switched between a multi-head tape delay effect and a bank of four modulation voices. The delay offers 12 syncopated settings with the tonal character of spinning drum tape machines, filtered for the warmth of those machines, and the number of repeats can be driven from an expression pedal, including into self-oscillating feedback.

  The modulation section holds a flanger, a rotary speaker cabinet, a U-Vibe and a four-stage phaser. The flanger and the rotary cabinet can be blended against each other, as can the opto-coupler based U-Vibe and the phaser, so settings in between the four voices are available.

  An expression pedal port accepts a TRS style expression pedal for adjustments on the fly. Current units carry a push-button switch that changes the order of the fuzz and modulation sections; earlier units instead exposed a TRS insert for patching another pedal between the fuzz and the delay and modulation side. At the core is a hand-built board carrying the analog fuzz and a 24-bit DSP engine, hand assembled and soldered.
specs: |-
  - Three sections: analog fuzz, multi-head tape delay, four-voice modulation
  - Modulation voices: flanger, rotary speaker cabinet, U-Vibe, four-stage phaser
  - 12 syncopated delay settings
  - 24-bit DSP engine alongside the analog fuzz circuit
  - Expression pedal port, requires a TRS style expression pedal
  - Push-button effect-order switch on current units, TRS insert on earlier units
  - Hand assembled and soldered
