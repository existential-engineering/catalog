description: >-
  The Oberheim OB-12 is a 12-voice hybrid synthesizer released in 2000, designed
  to emulate the classic analog Oberheim filter sounds using physical modeling
  synthesis. It features extensive hands-on controls with 22 knobs, 24 sliders,
  and 33 buttons, a ribbon controller, built-in effects, motion recorder, and
  oscillator morphing capabilities.
details: |-
  The OB-12 marked Oberheim's return with their first analog-emulation professional synthesizer. This 12-voice instrument was designed to recreate and emulate the classic sounds and tone of original Oberheim analog filters using 4-part physical modeling synthesis. The traditional layout with extensive real-time controls including 22 knobs, 24 sliders, and 33 buttons provides fast hands-on access to most parameters, complemented by a ribbon controller, pitch bend, and modulation wheel.

  Beyond analog emulation, the OB-12 incorporates a sophisticated set of features. A high-quality LCD display visually renders parameter changes in real time. The sound engine includes two oscillators per voice with noise and ring modulator, offering sawtooth, triangle, and square waveforms with WaveMix and FM capabilities. Two multimode filters provide lowpass, highpass, bandpass, and flat modes in serial or parallel configurations with up to 24dB/octave slopes.

  Additional features include a 5-band graphic and parametric EQ, ADSR envelopes with delay time and double decay, a Motion Recorder for animated sound design, and manual or auto oscillator morphing for evolving effects. Phrase recorders and arpeggiators with independent tempo controls and MIDI sync are built in. The effects section provides reverbs, delays, chorus, and multiple overdrive algorithms. Outputs include digital S/PDIF and analog connections alongside full MIDI implementation.
specs: |-
  - Polyphony: 12 voices with dynamic allocation and user voice reserve
  - Oscillators: 2 per voice with noise and ring modulator (sawtooth, triangle, square, WaveMix, FM)
  - LFO: Sawtooth, triangle, square, sample & hold, noise
  - Filter: 2 multimode filters (lowpass, highpass, bandpass, flat) with serial/parallel routing, up to 24dB/octave
  - Effects: Overdrive, chorus, delay, reverb
  - EQ: 5-band graphic and parametric
  - Keyboard: 49 keys with velocity and aftertouch
  - Memory: 256 user programs, 256 user timbres
  - Features: Motion recorder, oscillator morphing, phrase recorder, arpeggiator
  - Outputs: Analog and digital S/PDIF
  - Control: MIDI In/Out/Thru
