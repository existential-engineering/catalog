description: >-
  The Roland MKS-30 is the rack-mount module version of the JX-3P, featuring
  six-voice analog polyphony with two DCOs per voice, velocity response, and
  expanded patch memory over its keyboard counterpart.
details: |-
  Released in 1983, the MKS-30 (also known as the Planet-S) translates the JX-3P's analog sound
  engine into a convenient rack-mount format with several enhancements. Like its keyboard sibling,
  it offers six-voice polyphony with two digitally controlled oscillators per voice, but adds
  velocity sensitivity and doubles the memory to 64 internal and 64 cartridge patches.

  The synthesis architecture follows straightforward analog conventions with filter cutoff,
  resonance, envelope amount, and key follow parameters shaping the tone through the low-pass
  filter. A single ADSR envelope generator controls the VCA, while an LFO adds modulation
  possibilities. The sound character is quintessentially Roland, warm and musical with the
  characteristic DCO stability that defined the company's early 1980s instruments.

  Programming can be handled via the optional PG-200 programmer, the same accessory used with the
  JX-3P, which provides hands-on knob control of all synthesis parameters. Without the programmer,
  editing is limited to the unit's basic front-panel controls, making the PG-200 a near-essential
  companion for serious sound design.

  Despite sharing its core sound engine with the more popular JX-3P, the MKS-30 never achieved the
  same level of recognition, keeping it relatively affordable on the vintage market. Its compact
  rack format and solid analog sound make it a practical choice for adding classic Roland character
  to a modern setup.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice
  - Filter: Low-pass with cutoff, resonance, envelope amount, key follow
  - Envelope: 1 ADSR (VCA)
  - LFO: Yes
  - Memory: 64 internal, 64 cartridge patches
  - Format: Rack-mount module
  - MIDI: Yes
  - Compatible with PG-200 programmer
