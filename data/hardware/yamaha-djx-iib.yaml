description: >-
  The Yamaha DJX-IIb is a desktop groove machine built for dance music production, featuring AWM
  synthesis, an 8-bit sampler, a massive pattern library, and DJ-oriented controls including a
  scratch pad and fader.
details: |-
  The DJX-IIb is the tabletop module variant of Yamaha's DJX-II groove keyboard, released around
  2000 and aimed squarely at DJs and dance music enthusiasts. It strips away the keyboard in favor
  of a compact desktop form factor optimized for hands-on groove creation, adding a scratch pad and
  fader for real-time pattern manipulation.

  At its core, the DJX-IIb uses Yamaha's AWM synthesis engine with 202 sounds spanning 180
  instrument voices and 23 drum kits. The built-in pattern player generates roughly 700
  dance-oriented patterns from 70 presets with 10 variations each, while the 8-bit sampler at 22kHz
  offers six sample pads with approximately six seconds of total recording time. A performance
  recorder captures live knob tweaks and pattern changes for later playback.

  The effects section is surprisingly deep for a consumer-oriented unit, with 10 Live Effector
  presets covering distortion, ring modulation, flanging, and lo-fi processing, plus dedicated
  reverb, chorus, and a 3-band isolator EQ. An audio BPM counter allows syncing to external vinyl
  or CD sources, and tap tempo keeps everything locked to the groove.
specs: |-
  - Polyphony: 32 voices
  - Sound Engine: AWM with 202 sounds (180 voices, 23 drum kits)
  - Sampler: 8-bit, 22kHz, 6 pads, 128KB memory (~6 seconds)
  - Patterns: 70 presets x 10 variations (700 total), 5 user x 10 variations (50 total)
  - Effects: 10 Live Effector presets, 11 reverbs, 7 chorus, 3-band isolator EQ
  - Filter: Dynamic digital filter with resonance and cutoff
  - Performance Recorder: 6 pads, 18KB memory (~2500 events)
  - Activator Kits: 52 presets
  - MIDI: Clock In/Out, Remote Control, Tone Generator, Bulk Send/Receive
