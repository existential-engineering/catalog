details: |-
  The 2025 Fullerton Deluxe ASAT Classic bundles some of the most time-honored option combinations from the G&L Option Order menu. Butterscotch Blonde features a swamp ash body coated in transparent finish to showcase its beauty, while Jet Black, 3-Tone Sunburst, and Matcha Green feature an alder body for rounder tones, all with rear contour. All four finishes are paired with a pickguard that sets off the color just right, and that elegance continues up the neck with the G&L Natural Satin finish.

  The G&L ASAT Classic is Leo's final word on the traditional single-cutaway bolt-on axe. Framed in a classic boxed-steel bridge, the single-coil Magnetic Field Design bridge pickup created by Leo Fender delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. The single-coil MFD neck pickup brings a delectably rich tonal palette, from round clean jazz tones to thick, gritty blues, and the two together reach another level again.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
