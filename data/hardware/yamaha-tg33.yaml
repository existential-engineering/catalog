description: >-
  The TG33 is a rack-mount sound module combining Yamaha's FM synthesis with
  12-bit AWM ROM sampling for vector synthesis. It serves as the keyless
  counterpart to the SY22, offering 32-voice polyphony and 16-part
  multitimbrality. Its joystick-based vector control allows dynamic blending of
  FM and sample-based waveforms for expressive sound design.
details: |-
  The TG33 employs a hybrid synthesis approach that merges digital FM operators with low-resolution sampled waveforms. Though its preset sounds can be somewhat thin on their own, the instrument gains considerable depth through its vector joystick controller, which allows users to manipulate and blend the 12-bit samples alongside 256 FM vector voices.

  This sound module provides 16-part multitimbrality, enabling layering of multiple sounds simultaneously. The integrated drum kit and digital effects expand its sonic palette beyond traditional synthesis. With 32-note polyphony and MIDI responsiveness including velocity and aftertouch support, the TG33 accommodates complex musical arrangements.

  Compared to vector synthesizers like the Korg Wavestation and Sequential Circuits Prophet VS, the TG33 delivers comparable tonal range and dynamic character. Its combination of motion-capable synthesis and character-rich sound production makes it suitable for creating distinctive audio that stands apart from standard digital instruments of its era.
specs: |-
  - Polyphony: 32 voices
  - Oscillators: 2 Digital FM operators + 2 AWM (12-bit ROM samples)
  - LFO: AM, PM, Saw Up, Saw Down, Triangle, Square, Sample & Hold
  - Filter: None
  - Effects: 16 Digital Reverbs and Delays
  - Keyboard: None (rack module)
  - Memory: 128 preset, 64 user
  - Control: MIDI (Velocity and Aftertouch response)
releaseDate: "1990"
