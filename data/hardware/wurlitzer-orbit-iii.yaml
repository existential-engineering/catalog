description: >-
  The Orbit III is a monophonic synthesizer that functioned as a third manual on
  Wurlitzer home organs starting in 1971. It provides basic synthesis
  capabilities including an envelope, filter, and LFO, integrated into various
  organ models.
details: |-
  The Orbit III represents an unusual but common addition to Wurlitzer's home organ lineup. Introduced in 1971, it appeared as a mini-keyboard manual on multiple organ models including the 4037, 4373, 4573, and 555. The synthesizer offers fundamental sound-shaping tools: a basic envelope with attack and sustain controls, a filter termed "wah-wah" for its characteristic effect, and an LFO labeled "modulator" with adjustable rate and depth parameters.

  The instrument includes toggle switches to enable or disable each synthesis function independently. A "second touch" feature provides crude aftertouch capability, assignable to either the LFO or slide function. The keyboard comprises 25 mini-keys with organ-style timbre buttons controlling the sound's character and range.

  These organs typically featured rotating speaker cabinets, either the Wurlitzer Spectratone in early models or Leslie speakers from 1974 onward in the model 555, alongside standard home organ components like drum patterns and a cassette recorder. Originally deployed in churches and schools, these instruments remain accessible today at minimal cost due to their substantial weight.
specs: |-
  - Monophonic
  - 1 VCO
  - Envelope with attack and sustain controls
  - LFO (modulator) with rate and deviation controls
  - Wah-wah filter
  - 25 mini-keys
  - 10 presets (Reed, Brass, String, Banjo, Harpsichord, Electro Piano, Vibes, Xylophone, Piano)
  - Push-button function selection
