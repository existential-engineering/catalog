description: Percall is a 12HP percussive envelope and VCA module that shapes
  four audio sources into percussive hits using four voltage-controlled
  amplifiers with dedicated decay envelopes. Each channel features a
  CV-controllable decay time and per-channel volume, with a normalized mix
  output for building percussion submixes. A global Strength input adds dynamic
  control across all channels simultaneously, and choke controls link channel
  pairs for realistic hi-hat behavior.
details: |-
  Percall is a four-channel percussive envelope and VCA module designed to bring drum-machine-style shaping to Eurorack modular systems. Each of the four channels combines a voltage-controlled amplifier with a dedicated decay envelope, allowing any audio source to be transformed into a tight, punchy percussive hit. The decay time on each channel is voltage-controllable, giving external sequencers or LFOs real-time influence over the articulation of each hit.

  Normalization makes common percussion setups easy: audio input 1 is normalled to input 2, and audio input 3 is normalled to input 4. A single oscillator or noise source can feed two channels simultaneously without patching, enabling configurations like a single source serving both open and closed hi-hat voices differentiated only by decay time.

  Choke controls bind channel pairs (1–2 and 3–4), so triggering one channel cuts off the other — directly replicating the behavior of a closed hi-hat choking an open hi-hat. This fundamental drumming characteristic works without external logic modules.

  A global Strength input scales the response across all four channels at once, adding dynamic expression to the full mix. Individual envelope outputs on each channel allow the internal decay envelopes to be used as modulation sources elsewhere in the patch. A normalized mix output sums all four channels into a single percussion submix, ready to feed directly into a mixer or effects chain.

  Manufactured in Barcelona by Befaco with an aluminum heat-treated front panel. Available as a fully built module or a DIY kit.
