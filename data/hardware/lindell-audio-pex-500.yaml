details: |-
  The PEX 500 is a one channel transformer coupled Passive Pultec Equalizer. It's an all discrete design based upon the great 990 amplifier.

  The Equalizer is a take on the classic Pultec design. It has 15dB of high frequency boost and a punchy low end. The PEX-500 fits in all 500 series compatible power supplies.
specs: |-
  - Transformer coupled balanced inputs and balanced outputs
  - Passive Pultec equalizer, inductor based
  - 990 discrete gain make-up amplifier
  - 3 step switched EQ low frequency boost 30Hz, 60Hz, 100Hz +/-10%
  - 3 step switched EQ high frequency boost 6kHz, 10kHz, 16kHz +/-10%
  - 3 step switched EQ high frequency attenuation 10kHz, 15kHz, 20kHz +/-10%
  - Pin compatible with 990 and 2520 type op-amps
  - True hardwire EQ bypass
