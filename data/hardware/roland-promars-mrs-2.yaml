description: >-
  Roland's microprocessor-controlled monophonic analog synthesizer featuring
  dual VCOs, patch memory, and a resonant lowpass filter, designed as the mono
  companion to the Jupiter-4.
details: |-
  The ProMars Compuphonic holds a notable place in synthesizer history as one of the earliest analog synthesizers to feature microprocessor control, using an Intel 8048 processor to manage patch memory storage and recall. This made it one of the few instruments of its era where players could save and instantly recall their sound settings.

  With two VCOs capable of detuning against each other, the ProMars delivers a thicker monophonic sound than the polyphonic Jupiter-4, which was limited to a single oscillator per voice. The signal path includes a resonant lowpass filter with its own inverted ADSR envelope, a separate highpass filter, and a noise generator. Ten preset sounds covering bass, string, clavinet, piano, voice, brass, and synth timbres complement ten user-programmable patches and eight performance memories.

  The 37-key keyboard with pitch and mod wheels sits in a chassis accented by wooden end caps that give it a classic vintage aesthetic. CV/Gate connectivity allows integration with other analog equipment of the period. Notable users include Vangelis, Spandau Ballet, Add N To (X), Jethro Tull, and Depeche Mode.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs
  - LFO: 1 (sine, square, ramp up, ramp down)
  - Filter: Highpass, lowpass resonant with inverted ADSR
  - VCA: ADSR envelope generator
  - Keyboard: 37 keys
  - Memory: 10 presets, 10 user patches, 8 performances
  - Control: CV/Gate
releaseDate: "1979"
