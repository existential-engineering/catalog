description: The PM6007 delivers a realistic listening experience and Marantz
  rich and spacious signature sound. With cutting-edge technologies, it is an
  ideal choice for those ready to elevate their 2-channel Hi-Fi system.
details: |-
  The PM6007 delivers a realistic listening experience and Marantz rich and spacious signature sound. With cutting-edge technologies, it is an ideal choice for those ready to elevate their 2-channel Hi-Fi system.

  A slimline Class A/B integrated amplifier with current feedback topology, the PM6007 delivers 45 W per channel into 8 ohms and 60 W into 4 ohms with a damping factor of 100.

  An onboard DAC accepts two optical and one coaxial digital input at up to 192 kHz / 24-bit, with Marantz Musical Digital Filtering applied to the converted signal.

  A moving magnet phono stage, Source Direct mode, gold-plated cinch terminals, HDAM SA3 and SA2 modules and a toroidal transformer round out the analogue side.

  Speaker A and B terminal pairs support bi-wiring, and a subwoofer pre-out allows the system to be extended with a powered subwoofer.
specs: |-
  - 2 channels, Class A/B, current feedback topology
  - Power output: 45 W (8 ohm RMS) / 60 W (4 ohm RMS)
  - Frequency response: 10 Hz to 70 kHz
  - THD 0.08%
  - damping factor 100
  - Digital inputs: 2 optical, 1 coaxial
  - sample rate up to 192 kHz / 24-bit
  - Marantz Musical Digital Filtering
  - Phono EQ: standard
  - phono input MM
  - Input sensitivity MM: 2.2 mV / 47 kohm
  - S/N ratio MM: 83 dB
  - Input sensitivity high level: 200 mV / 20 kohm
  - S/N ratio: 102 dB (2 V input)
  - 5 audio inputs
  - 1 audio output
  - subwoofer pre-out
  - Speaker terminals: metal (gold) screw, 4 terminals, Speaker A / B
  - HDAM version SA3, SA2
  - toroidal power transformer
  - Source Direct
  - Balance, bass and treble controls
  - Available colors: Black, Silver-Gold
  - metal front panel
  - Power consumption: 155 W
  - standby: 0.3 W
  - detachable power cable
  - Remote control: RC004MCD
  - Dimensions (W x D x H): 17.3 x 14.5 x 4.1 in
  - weight: 16.7 lbs
