details: |-
  Condor HiFi is an analog tone shaping pedal that combines a parametric midrange EQ, resonant low-pass filter, and overdrive into a single 100% analog signal path.

  The HiFi revision features upgraded internals with a 30V internal voltage boost and OPA1662 op-amp for improved headroom and clarity.

  The pedal offers true or buffered bypass, 2 internal presets plus 122 via MIDI, internal modulation via ramping, and DIP switches for further customization.

  MIDI, expression, and CV control provide deep parameter control over all functions.
specs: |-
  - 100% analog signal path
  - Parametric midrange EQ
  - Resonant low-pass filter
  - Overdrive section
  - 30V internal voltage boost
  - OPA1662 op-amp
  - True or buffered bypass
  - 2 internal presets, 122 via MIDI
  - Internal modulation (ramping)
  - MIDI, CV, Expression control
  - DIP switches for customization
  - Mono I/O
  - Power: 9V DC Center Negative, ~200mA
