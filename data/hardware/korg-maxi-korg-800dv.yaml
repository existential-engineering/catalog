description: >-
  The Maxi-Korg 800DV is a duophonic/monophonic analog synthesizer released by Korg in
  1975. It features dual oscillators that can operate as two independent voices or be
  stacked into a single powerful monophonic voice, with dual voltage-controlled filters
  and ring modulation for expressive sound design.
details: |-
  The Maxi-Korg 800DV is essentially two separate MiniKorgs housed inside one keyboard with shared controls for both voices. Its architecture allows performers to use two independent monophonic voices for duophonic operation, or stack both voices together for a thicker monophonic sound with the ability to delay one voice before triggering for added expressiveness.

    The 800DV achieved notable professional recognition and has been used by artists including Kitaro, Vangelis, and Soft Cell. Its sound character delivers strong bass and aggressive lead tones that rivaled contemporary competitors of the era.

    The instrument lacks MIDI connectivity, memory storage, and standard CV input, though it can be modified to accept Hz/V control signals used by Yamaha and other manufacturers. The triggering mechanism for duophonic operation can be challenging for some users, which has led many performers to favor stacking both voices for monophonic use.
specs: |-
  - Polyphony: Duophonic (2 voices) or Monophonic
    - Oscillators: 2 VCOs per voice with selectable scales (64', 32', 16', 8', 4', 2')
    - Waveforms: Triangle, square, sawtooth, pulse, PWM
    - Sub-oscillators: 2
    - Filters: 4 VCFs with high-pass and low-pass modes
    - Modulation: 2 LFOs (PWM and Vibrato)
    - Envelopes: 2 envelope generators with Attack Time, Singing Level, Range/Mode selectors
    - Keyboard: 44 keys
    - Memory: None
    - Control: No MIDI, no standard CV input (Hz/V modification possible)
