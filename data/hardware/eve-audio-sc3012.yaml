description: The SC3012 is EVE Audio's flagship active 3-way main monitor, built
  around a 12" SilverCone woofer, a 5" SilverCone midrange driver and the AMT
  RS6 tweeter, each driven by its own PWM amplifier. It is intended for large
  recording and mastering studios, film and television facilities, cinema
  applications and wall installations.
details: |-
  The SC3012 is an active 3-way main studio monitor made for large recording and mastering studios, film and television facilities, cinema applications and wall installations. The system uses a powerful amplifier array with one amplifier per driver. All drivers, in particular the proprietary AMT RS6 tweeter, are designed for high sound pressure levels, extremely low distortion and optimized directivity. An ultra-stiff wood front panel and a special internal construction reduce resonance, which EVE Audio credits for the even directivity, well-defined mids, clean high frequencies and tight low frequency response.

  A double-coated 12" metal cone woofer with low resonance covers the frequency range down to 25 Hz (-3 dB), and its long excursion driver reproduces the lowest frequencies at an exceptionally low harmonic distortion level. A specially developed 5" midrange unit with a glass fiber coated Rohacel sandwich cone handles midrange reproduction. Both the 12" SilverCone woofer and the 5" SilverCone midrange driver use the maker's copper cap magnet system, which has very low distortion.

  The RS6 Air Motion Transformer is exclusive to the SC3012 and the smaller SC3010. It is 2.5 times larger than the RS1, RS2 and RS3 Air Motion Transformers and couples the mid and high frequencies with great precision. The crossover frequency drops to 1800 Hz, which EVE Audio states gives uniform directivity and a very well-defined mid to high frequency range.

  Each driver is powered by its own specified PWM amplifier. The tweeter and midrange each have a 250 W amplifier, while the woofer is amplified by an 800 W PWM module via a bridge, and all drivers are protected by a limiter detection circuit. The stated maximum output level is 118 dB (SPL at 1 m). As with every other EVE Audio monitor, both balanced XLR inputs and unbalanced RCA inputs are provided.

  The SC3012 was also developed for wall installations, and for that use the filter control can be set to "inwall". A set of high-density foam is included to seal the rear-facing bass ports. The silver panel that houses the midrange driver and the AMT RS6 tweeter can be rotated 90 degrees, so the monitor can be positioned either horizontally or vertically. Room adaptation filters and volume are set from the front SMART-knob, a rotary encoder with an LED ring, and the settings can be locked to prevent accidental changes.
specs: |-
  - Frequency range: 25 Hz - 21 kHz
  - Woofer size: 12"
  - Max. SPL: 130 dB
  - Configuration: active 3-way main studio monitor
  - Frequency range measured at -3 dB at 1 m distance
  - Sound pressure level: 130 dB max. SPL per pair
  - Max. output level: 118 dB (SPL at 1 m)
  - Output power: 1300 W per speaker
  - Tweeter: AMT RS6
  - Output power tweeter: 250 W
  - Mid-driver: 5"
  - Output power mid-driver: 250 W
  - Woofer: 12"
  - Output power woofer: 800 W
  - Passive radiator: 12" diameter
  - Cross-over frequency: 220 & 1800 Hz
  - Protection limiter: Yes
  - Volume range: minus infinity to +6 dB
  - High-shelf filter: -5 dB to +3 dB above 3 kHz
  - Mid EQ: -3 dB to +3 dB at 1 kHz
  - Desk filter cut: -5 dB to 0 dB at 160 Hz
  - Desk filter boost: 0 dB to +3 dB at 80 Hz
  - Low-shelf filter: -5 dB to +3 dB below 300 Hz
  - Input level dip switch: +7 dBu / +22 dBu
  - Phase inversion: 0 degrees / 180 degrees
  - Input impedance: 10 kOhm
  - Power consumption: less than 1 W standby, 1000 VA maximum
  - Dimensions: 435 x 650 x 490 mm (17.1 x 25.6 x 19.3 inches, WxHxD)
  - Weight: 44 kg (97 lb)
