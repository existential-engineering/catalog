description: The definitive Harbeth loudspeaker, a 3-way vented mid-sized
  stand-mounted monitor built around the Harbeth-made 200mm RADIAL2 bass/mid
  driver. The system sound is large, powerful and transparent with an
  astonishing freshness.
details: |-
  Presented as the ultimate British domestic monitor, the definitive Harbeth loudspeaker delivers the ultimate high-end audio experience.

  The SHL5plus XD gets the very best from the Harbeth-made 200mm RADIAL2 bass/mid driver. The system sound is large, powerful and transparent with an astonishing freshness.

  A 3-way vented design, it adds a 25mm ferrofluid-cooled tweeter and a 20mm dome SuperTweeter above the bass/mid unit, reaching 40Hz to 20kHz within +/-3dB free-space.

  The cabinets are handmade and feature veneers that vary in colour, shade and grain structure. Not all finishes are available in all countries.
specs: |-
  - Technical features: 3-way vented, 200mm Harbeth RADIAL2 bass/mid, 25mm ferrofluid-cooled tweeter, 20mm dome SuperTweeter
  - Frequency response: 40Hz to 20kHz, +/-3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms, easy to drive
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W per channel
  - Power handling: 150W programme
  - Dimensions: 635 x 322 x 300 mm (+12mm for grille and binding posts)
  - Connectors: two 4mm Harbeth branded binding posts
  - Weight: 15.8kg each (without packing)
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with the tweeters (tweeter 475mm up from cabinet base)
  - Packing: single speaker per protective carton
  - Grille colour: black
  - Finishes: oak, walnut, cherry, rosewood, black ash, silver willow
