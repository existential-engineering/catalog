url: https://www.marantz.com/en-us/product/av-processors-pre-amplifiers/av-10/300584.html
description: Reference 15.4 channel home theater pre-amplifier/processor powered
  by HEOS with Dolby Atmos. Features Marantz HDAM discrete circuitry, fully
  balanced outputs, 8K HDMI support, and advanced immersive audio processing for
  reference-level home theater systems. Crafted in Shirakawa, Japan.
details: |-
  The AV 10 represents the highest measure of performance and capability for reference-level home theater systems. Built upon decades of Marantz heritage and engineered in Shirakawa, Japan, this pre-amplifier/processor emphasizes both aesthetic refinement and technical performance.

  The device incorporates Marantz's proprietary HDAM (Hyper Dynamic Amplifier Module) discrete circuitry throughout, delivering immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics. Its extensive 15.4-channel processing architecture supports contemporary immersive audio formats including Dolby Atmos, DTS:X Pro, Auro 3D, MPEG-H, 360 Reality Audio, and IMAX Enhanced.

  Connectivity infrastructure emphasizes professional-grade audio integration, featuring 17.4 channels of fully balanced XLR outputs alongside standard RCA multichannel preouts. The device includes four independent subwoofer outputs with variable crossover capabilities. HDMI 2.1 support enables 8K/60Hz and 4K/120Hz pass-through with full HDR ecosystem compatibility.

  The integrated HEOS ecosystem provides multi-room audio streaming across major platforms including AirPlay 2, Spotify Connect, Amazon Music HD, TIDAL, and Roon Ready. Audyssey MultEQ XT32 room correction and Dirac Live upgradability allow acoustic optimization for diverse installation environments. Control integration encompasses IP, RS-232, web, and mobile app protocols.
specs: |-
  - 15.4 processing channels
  - 7 HDMI inputs (all 8K capable)
  - 3 HDMI outputs (1 with eARC)
  - Supports Dolby Atmos, DTS:X Pro, DTS-HD Master, Auro 3D, MPEG-H, 360 Reality Audio, IMAX Enhanced
  - Audyssey MultEQ XT32 room correction (Dirac Live upgradable)
  - HDAM discrete amplification with Current Feedback Topology
  - Pure Direct mode
  - HEOS built-in multi-room streaming
  - AirPlay 2, Spotify Connect, Amazon Music HD, TIDAL, Roon Ready
  - Ethernet, Wi-Fi, Bluetooth connectivity
  - 100W typical power consumption; 0.2W standby
  - Dimensions: 17.4 in W x 19.8 in D x 7.4 in H
  - Weight: 37.0 lbs
  - 5-year warranty
  - Crafted in Shirakawa, Japan
