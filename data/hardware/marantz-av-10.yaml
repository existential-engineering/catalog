description: AV 10 represents the highest measure of performance and capability
  for reference-level home theater systems. Marantz Sound Masters meticulously
  tuned AV 10 for amazing performance with careful parts selection to create the
  most memorable home theater experiences possible.
details: |-
  AV 10 represents the highest measure of performance and capability for reference-level home theater systems. Featuring Marantz HDAM discrete circuitry and advanced processing for up to 15.4 channels with fully balanced outputs for every channel, it enables large-scale immersive installations with exceptional precision, control, and integration flexibility.

  Processing covers Dolby Atmos with height virtualization and Dolby Atmos Music, DTS:X and DTS:X Pro with 15-channel DTS Neural:X, Auro 3D, 360 Reality Audio, MPEG-H and IMAX Enhanced.

  Seven 8K HDMI inputs and three HDMI outputs support HDCP 2.3, 8K/60Hz and 4K/120Hz pass-through up to 40 Gbps, enhanced ARC, Dolby Vision, HDR10+, Dynamic HDR and HLG, with 1080p/4K to 8K scaling and GUI overlay.

  Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC is fitted, with Dirac Live available as an upgrade, alongside a variable crossover, optimized bass redirection and bass sync.

  A copper plated chassis, toroidal power transformer, current feedback topology, HDAM modules, Pure Direct mode, gold plated RCA terminals and a clock jitter reducer serve the analogue output stages. Crafted in Shirakawa, Japan.
specs: |-
  - 15.4 maximum processing (preamp) channels
  - Multichannel pre out: 17.4 RCA and 17.4 XLR
  - subwoofer out: 4 (independent)
  - HDMI inputs back / front: 7 / 0
  - HDMI outputs main / zone: 2 / 1
  - HDMI in / out: 7 / 3
  - 8K/60Hz and 4K/120Hz pass-through in / out: 7 / 2 (up to 40 Gbps)
  - HDCP 2.3
  - HDMI 2.0: 3D, 4K, CEC and ARC
  - enhanced ARC
  - HDMI pass-through in standby
  - HDR, HLG, Dolby Vision, HDR10+ and Dynamic HDR
  - ALLM, VRR and QFT
  - HDMI to HDMI scaling 1080p/4K to 8K with GUI overlay
  - auto lip sync
  - Analogue in: 5 (one of them XLR)
  - phono (MM) in
  - digital in: 2 optical, 2 coaxial
  - Multi-room out: 2 analog
  - multi-room zones: 3
  - zone HDMI output from HDMI source
  - Speaker A/B, bi-amp drive and multi-room speaker terminals are all assignable pre-outs
  - Dolby TrueHD, Dolby Atmos, Dolby Atmos Height Virtualization and Dolby Atmos Music
  - DTS-HD Master, DTS:X, DTS:X Pro, DTS Neural:X (15 channel) and DTS Virtual:X
  - Auro 3D, 360 Reality Audio, MPEG-H, IMAX Enhanced, multichannel stereo
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - Dirac Live upgradable
  - Compressed Audio Enhancer MDAX2
  - clock jitter reducer
  - Pure Direct
  - HDAM
  - Copper plated chassis
  - toroidal power transformer
  - current feedback topology
  - HEOS multi-room and streaming
  - AirPlay 2
  - Bluetooth with headphone re-transmit
  - Wi-Fi
  - Ethernet
  - Lossless formats FLAC HD 192/24, WAV 192/24, ALAC 192/24
  - DSD 2.8 / 5.6 MHz
  - gapless playback
  - IP, RS232, web and app control
  - IR flasher in
  - Marantz Remote Bus
  - 2 DC trigger outputs
  - Front display: 2 line FLD plus port hole OLED
  - modern HD GUI
  - 3 GUI languages
  - System remote control: RC047SR
  - Power consumption: 100 W
  - standby: 0.2 W
  - network standby less than 2.0 W
  - Dimensions without antenna (W x D x H): 17.4 x 19.0 x 7.4 in
  - weight: 37.0 lbs
  - In the box: main unit, remote control, batteries, AM/FM antennas, wire labels, quick start guide, Audyssey microphone, card board microphone stand, 2 external detachable antennas, AC cord
