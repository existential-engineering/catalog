details: |-
  The all-new G6228TG Players Edition Jet BT with Bigsby and Gold Hardware gives you powerful overdrive and shimmering cleans at the stomp of a switch.

  Features chambered mahogany bodies with maple tops producing strong, balanced mid-range with smooth attack and extended bandwidth that is remarkably wide and harmonically rich.

  Equipped with all-new Broad'Tron BT65 pickups designed by Tim Shaw, delivering powerful mids, extended lows and an exceptionally clear, yet smooth high end.

  Players Edition includes comfort upgrades: lowered neck set, full-access rolled cutaway, tapered heel, no-load master tone pot with Squeezebox capacitor, and master volume with treble bleed circuit.
