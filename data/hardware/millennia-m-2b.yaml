description: The M-2b is a two channel vacuum tube microphone preamplifier in a
  1U rack chassis, built on a high speed transformerless pure Class A 350 volt
  triode design. Its differential topology needs no attenuator pads and it
  offers more than 35 dBu of output headroom with high resolution gain control.
details: |-
  The M-2b is a two channel tube microphone preamplifier using a high speed transformerless pure Class A 350 volt triode gain stage. The differential topology means no attenuator pads are required, maximum input level is +20 dBu and output headroom runs past +35 dBu. Gain spans 14 dB to 50 dB across three ranges with continuous trim through precision potentiometers.

  Microphone powering covers +48 V dc phantom and a separate non-phantom supply of up to +130 V dc for DPA and B&K microphones. Frequency response reaches 4 Hz to 130 kHz and stereo phase deviation stays under 1 degree, with interchannel crosstalk better than 70 dB.

  The chassis is 16 gauge cold-rolled steel with a 3/8 inch thick radius extruded aluminum face plate in a mirror-gloss anodized finish, hand machined aluminum knobs and illuminated push buttons. Gold audio connectors, tube sockets and relays are used throughout, audio wiring is Mogami Neglex OFC, power wiring is silver Teflon, and the toroid power supply sits on its own internal sub-chassis. Mains voltage is selectable between 100-120 V ac and 200-240 V ac.

  Millennia lists the M-2b under Legacy, so it is no longer a current production model.
specs: |-
  - Minimum Gain: 14 dB
  - Maximum Gain (3 ranges with continuous trim): 50 dB
  - Frequency Response (+0 / -3 dB): 4 Hz to 130 kHz
  - Noise (50 dBu gain, 10 Hz to 30 kHz, 150 ohm source): -116 dB EIN
  - Total Harmonic Distortion + Noise (30 dB gain, 10 Hz to 20 kHz bandwidth, 0 dBu out): < .02%
  - Intermodulation Distortion (50 Hz and 7 kHz, 35 dB gain, +27 dBu out): < .0009%
  - Phase Response (35 dB gain, 20 Hz to 20 kHz, +26 dBu out): < 10 degrees deviation
  - Phase Response, Stereo Deviation (35 dB gain, 20 Hz to 40 kHz, +27 dBu out): < 1 degree
  - Common Mode Rejection Ratio (30 dB gain, 1 kHz, 100 mV C.M.): > 60 dB
  - Slew Rate (35 dB gain, +27 dBu out): > 20 Volts per microsecond
  - Maximum Input Level (20 Hz to 40 kHz, 14 dB gain): +20 dBu, no attenuator pads required
  - Maximum Output Level (20 Hz to 40 kHz, 10 kilohm minimum load): > +35 dBu
  - Interchannel Crosstalk (30 dB gain, 1 kHz, 0 dBu both outputs): < 70 dB
  - Phantom Input Impedance: 3.800 ohms
  - Output Impedance: 120 ohms
  - DPA (B&K) Mic Powering: +130 V dc max, non-phantom
  - Phantom Powering: +48 V dc, +/- 2 V dc
  - Power Consumption: 50 watts maximum
  - Power Requirements: Selectable 100-120 or 200-240 V ac, 50/60 Hz
  - Dimensions: 19 in W x 3.5 in H x 12 in D
  - Shipping Weight: 26 lbs
