description: The Dangerous D-BOX+ is an award-winning controller and summing
  mixer that provides the superior sound and versatile control of an analog
  mixer, all in just one rack space, with Bluetooth connectivity and remote app
  control.
details: |-
  The Dangerous D-BOX+ is a ground-up redesign of the award-winning controller and summing mixer that provided countless studios the superior sound and versatile control of an analog mixing console, all in just one rack space. The newly designed 8-channel summing mixer and D-A stereo converters provide Dangerous Music's bold and clear sound, while added features like USB audio, Bluetooth connectivity and an app for remote control unleash a forward-looking feature set.

  The D-BOX+ offers 8 channels of analog summing with 5 monitorable input sources: stereo analog, summing, Bluetooth, USB, and digital AES/SPDIF. Two independently assignable headphone amplifiers drive four jacks (two front, two rear), and built-in talkback is also available remotely via Bluetooth. Three speaker outputs can be configured as two monitor pairs plus a subwoofer, with individual trims, and a dedicated stereo line output follows either the headphone or control room source selection.
specs: |-
  - 8-channel analog summing mixer in 1 rack space (1U)
  - 5 monitorable input sources: analog stereo, summing, USB, AES/SPDIF, Bluetooth
  - 3 independently/additively selectable speaker outputs (2 pairs + subwoofer option) with individual trims
  - 2 independently assignable headphone amplifiers, 4 jacks total (2 front, 2 rear)
  - Built-in talkback microphone, also available remotely via Bluetooth
  - Free remote control app (macOS, Windows, iOS, Android) over Bluetooth
  - Summing section: frequency response flat within 0.1dB (10Hz-50kHz), THD+N 0.0019% @ +4dBu
  - USB & AES DACs (measured at 96kHz): frequency response flat within 0.5dB (10Hz-30kHz)
  - Headphone amps: 4-ohm minimum load, 3W/channel
