description: A large-diaphragm condenser microphone with a spring suspended
  retro-inspired design. Warm and smooth midrange for medium-to-long distance
  applications, ideal for single-micing small acoustic ensembles.
details: |-
  Myrtle is a large-diaphragm condenser microphone with spring-suspended retro styling, intended for live vocal performance use or for single-micing small acoustic ensembles.

  Myrtle has the most classic vintage styling of any Ear Trumpet Labs microphone, with a design pedigree straight from the 1930s. Her sound, however, is a product of modern acoustic design that works in current stage environments. She takes the warm, detailed sound and feedback rejection of Edwina and adds a low end tuned for accurately capturing acoustic instruments from any distance. Her sweet spot extends from 6 inches out, and she has the low noise and natural clarity to work in the studio as well.

  Ear Trumpet Labs suggests her for single-miking soloists or small acoustic ensembles, including acoustic instruments and multiple vocalists, on stage or in studio.

  For the same sound in a smaller body, Ear Trumpet Labs points to Delphina. For a crisper tone with a bit more presence in the same applications, it suggests Louise or Josephine, and for a similar tone in a design tailored to closer micing, Edwina.
specs: |-
  - Hand-made microphone with unique appearance
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -41.9 dB (8 mV/Pa)
  - Power requirement: +24V to +48V phantom power
