  - Impedance: 8 Ohms nominal
  - Sensitivity @ 1m (2.83v): 99 dB
  - Magnet type: ceramic
  - Connectors: Neutrik SpeakOn
  - Width: 603 mm
  - Height: 452 mm
  - Depth: 340 mm
  - Weight: 25 kg
  - Compatible with ABM and Rootmaster amp heads
  - Made in the UK, built to order
