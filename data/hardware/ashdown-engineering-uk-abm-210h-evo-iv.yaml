details: |-
  The UK-ABM-210H-EVO IV is a handcrafted UK 2x10" bass cabinet voiced to respond dynamically to your technique, whether you play with a pick, fingers or slap. Twin 10" CIARE ceramic drivers deliver punchy lows and articulate mids without overwhelming the mix, with 500W AES handling, 8 Ohm impedance and 99dB sensitivity for confident yet controlled projection. Its compact 340mm depth suits tight stages, and it can be used standalone or paired with a 1x15" or 4x10" across the Ashdown ABM and Rootmaster series via Neutrik SpeakOn connectors.
specs: |-
