details: |-
  This is a very efficient and cost-effective wireless microphone system with the flexibility of a handheld mic. The OM2 has slight bass proximity, a tailored mid-range, and a full-bodied sound. Ideally optimized for small to mid-size PA systems, the OM2 is a workhorse microphone known for its excellent isolation on stage, outstanding feedback rejection, and ability to handle high sound pressure levels without distortion.
