details: |-
  Bo Diddley rocked fans with his sterling chops, electrifying showmanship and outrageous guitars for more than 50 years. The G6138 is a faithful reproduction of the famous rectangular guitar Gretsch built especially for him in 1958.

  Its features include a striking semi-hollow body, three-piece rock maple neck, ebony fingerboard with pearl dot inlays, 1957-style headstock, dual High Sensitive Filter'Tron humbucking pickups, Adjusto-Matic bridge, G-cutout tailpiece, gold hardware and special Bo Diddley signature truss rod cover.
