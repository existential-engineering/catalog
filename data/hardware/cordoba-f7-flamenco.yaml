details: |-
  The F7 is our entry-level flamenco model featuring the traditional combination of a solid European Spruce top paired with Cypress back and sides. It's a perfect fit for both beginner and intermediate flamenco players. Incredibly lightweight, the F7 is built in the Spanish tradition with a slightly thinner body depth than a classical guitar. Additionally, its flat neck angle gives this guitar low action and a bright, snappy tone characteristic of flamenco guitars. A clear flamenco-style tap plate comes installed on the top for an added layer of protection and like all Córdoba guitars, the F7 includes a two-way truss rod inside the neck for action adjustment and long-term stability.
