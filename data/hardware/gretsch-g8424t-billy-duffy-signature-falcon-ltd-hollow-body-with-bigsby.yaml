details: |-
  Emerging from England's early 80's post-punk scene, legendary band The Cult debuted in 1984. Featuring the incendiary riffs of guitarist Billy Duffy, the band blended elements of psychedelia, goth, and hard rock, to create the hard-hitting sound that would become their signature.

  2024 celebrates The Cult's 40th Anniversary, a milestone dubbed '8424' with '84' denoting their debut year and '24' marking their 40th Anniversary. Nearly half a century on, the band is stronger than ever, bringing their electrifying live shows to ever-growing legions of fans worldwide.

  To commemorate this incredible milestone, Gretsch is proud to partner with Billy to release the Limited Edition G8424TG Billy Duffy Signature Falcon. Inspired by Billy's original 'Sanctuary' Falcon, the G8424TG features a Vintage White nitrocellulose lacquer finish with gold sparkle binding and gold hardware, Billy's custom-wound Black Top Filter'Tron pickups, and a commemorative '8424' metal truss rod cover.
