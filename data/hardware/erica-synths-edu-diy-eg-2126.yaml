description: ASR envelope with looping.
details: |-
  Many iconic sounds, like the squelchy acid bass line, the snappy techno kick drum and the swelling dream pop pad, would not be possible without envelope generators. This module in the mki x es.edu line is a slightly optimized ADSR envelope generator, optimized because it has only 3 controls.

  With sustain on, it outputs an ASR (attack, sustain, release) envelope. When sustain is set to a minimum it becomes an AD (attack, decay) envelope generator that ignores gate length, with Release and Decay controlled by the same knob. A looping function and an inverted output make the module more versatile in complex patches.

  The full EDU DIY system is designed around 2 EG modules, so anyone aiming to build the whole system will need 2 kits.

  Erica Synths and Moritz Klein developed the mki x es.EDU series of educational DIY kits with one specific goal in mind: to teach people with little to no prior experience how to design analog synthesizer circuits from scratch. What is in the box is not simply meant to be soldered together and then disappear in a rack: the kit takes the builder through the circuit design process step by step, explaining every choice that was made and how it affects the finished module.

  Nine kits in total build a fully-featured modular monosynth: a sequencer, a VCO, a wavefolder, a noise and S&H module, a mixer, a VCF, an envelope generator, a dual VCA, and an output stereo mixer with a headphone amplifier. An affordable eurorack case with a DIY PSU rounds the system out. Each kit comes with an extensive user manual of 40 plus pages, downloadable separately, that digs into the electronics behind the circuit as well as the fundamental principles of sound synthesis.
