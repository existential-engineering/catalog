description: >-
  Scale sonic angles dense and jagged, glide over plains vast and fluid or sink
  into mists of dissonance. Model:Cycles is a six-track FM-based groovebox that
  brings exploring into the heart of sound sculpting.
details: |-
  The Model:Cycles is a six-track FM-based groovebox with six unique synthesis machines in a lightweight, portable package. Each track features its own LFO and velocity modulation, with a 64-step sequencer supporting parameter locks, micro timing, trig conditions, and individual track length and time scale.

  Built-in delay and reverb effects are available across all tracks. The unit stores 96 projects with 96 patterns each and over 60,000 presets. Six velocity-sensitive pads enable expressive performance and real-time recording.

  Class-compliant USB audio enables direct recording to a computer. The compact unit measures 270 x 180 x 39 mm and weighs just 0.80 kg, powered by a 5V DC supply.
specs: |-
  - 6-track FM-based groovebox
  - 6 unique synthesis machines
  - 64-step sequencer per track
  - Parameter locks, micro timing, trig conditions
  - Individual track length and time scale
  - 1 LFO per track, velocity modulation
  - Delay and reverb effects
  - 96 projects, 96 patterns per project
  - 6 velocity-sensitive pads
  - Class-compliant USB 2.0 Hi-Speed audio
  - 48 kHz, 24-bit D/A converters
  - 128 x 64 pixel LCD display
  - 270 x 180 x 39 mm, 0.80 kg
