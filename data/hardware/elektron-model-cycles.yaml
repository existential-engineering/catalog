description: Scale sonic angles dense and jagged, glide over plains vast and fluid or sink into mists of dissonance. Model:Cycles is a six-track FM-based groovebox that brings exploring into the heart of sound sculpting.
details: |-
  Scale angles dense and jagged, glide over plains vast and fluid or sink into mists of dissonance. To model is to shape the formless. Model:Cycles is a six-track FM-based groovebox that brings exploring into the heart of sound sculpting. With six unique machines in one lightweight unit, you can effortlessly mold rhythm and melody across the digital spectrum using instant, tactile controls.

  The six machines of the digital FM engine cover both percussive and melodic synths, allowing you to make full, varied compositions. The four core synth controls put the tools of sound sculpting right in front of you, altering the behavior of each machine differently and letting you push them to the limit.

  Dedicated knobs let you twist each machine far and wide with wild, unexpected results waiting to be discovered. Use control all to heave a parameter to the extreme and back again across every track. Elektron's powerful sequencer gives you the freedom to record every move live or program the sounds and parameters of your composition one step at a time.

  The full-featured step sequencer lets you control both structure and sound. Press a step and tweak any parameter onto it for ultra-fast and detailed sequencing. Real-time record every twist and turn you make, or build your composition one step at a time. Add controlled randomness and logic with the trig conditions.

  Whether you use it as a versatile live instrument or groovebox on the go, exploration has rarely felt so convenient and unimpeded. Model:Cycles is ready for magic music-making straight out of the box, with factory content from Skinnerbox, Richard Devine, Animistic Beliefs, (d) glitched, and Blush Response. Easily connect to other class-compliant devices such as phones, tablets or computers for instant MIDI and audio over USB.
specs: |-
  - 6 FM-based machines
  - 1 assignable LFO per track
  - 1 assignable velocity modulation per track
  - 6 audio tracks, all of which may be used as MIDI tracks as well
  - Elektron sequencer with up to 64 steps
  - Unique length and scale settings per track
  - Parameter locks, micro timing, trig conditions, assignable retrig
  - Real-time or grid recording of notes and parameters
  - 96 projects, 96 patterns per project
  - Delay and reverb send FX
  - 6 velocity-sensitive pads
  - 1 x 1/4" stereo headphone jack
  - 2 x 1/4" impedance balanced audio out jacks
  - 1 x Hi-Speed USB 2.0 Micro B port
  - 1 x 3.5 mm standard audio minijack (TRS) for MIDI In
  - 1 x 3.5 mm standard audio minijack (TRS) for MIDI Out/Thru
  - 128 x 64 pixel LCD screen
  - 48 kHz, 24-bit D/A converters
  - Power inlet: center positive 3.5 x 1.35 mm barrel jack, 5 V DC, 1 A
  - Up to 60 000 presets
  - Class-compliant USB audio
  - W270 x D180 x H39 mm (10.7" x 7.1" x 1.6") including knobs and feet
  - Weight: approximately 0.80 kg (1.8 lbs)
  - 3 year Elektron warranty
