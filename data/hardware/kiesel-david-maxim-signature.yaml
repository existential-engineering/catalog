  sound hole. It is standardized with a 5A flame maple top, the latest Vantium
  pickup, and Maxim's signature inlay.
details: |-
  Inspired by the SCB, the Dana features a revamped bevel on both body edges and bolt-on construction alongside a chambered body and decorative sound hole.

  The model is standardized with a 5A flame maple top, the latest Vantium pickup, and Maxim's signature inlay, though features such as wood type and colors are customizable to the player's taste set within Maxim's preferences. Additional features include a standard rear access jack and no rear backplate.

  The body is chambered alder with a decorative sound hole, a 5A flamed maple top and white back and sides, finished in blue denim with clear gloss, under a painted 2x4 headstock with a flamed maple overlay.

  The neck is tung-oiled 3-piece maple with one walnut stripe, a 2-way adjustable truss rod and dual carbon-fiber rods, cut to a thinner profile, with a 14 inch flamed maple fingerboard, 24 stainless steel jumbo frets and an ivory TUSQ nut.

  Electronics are master volume and tone controls with white pearl inlays, a 3-way pickup selector and a mini switch for coil-split, feeding a Kiesel Beryllium neck pickup and a Kiesel Vantium bridge humbucker, both with brushed chrome covers, over a Kiesel/Hipshot tremolo system.
specs: |-
  - Model name Dana, inspired by the Kiesel SCB with a revamped bevel on both body edges
  - Offered in more than one string count, with two sets of body dimensions, neck widths and weights listed
  - Construction: bolt-on with radiused neck heel
  - Body: chambered alder with decorative sound hole
  - Top wood: 5A flamed maple
  - Rear finish: white back and sides, no rear backplate
  - Finish: blue denim with clear gloss
  - Neck: tung-oiled 3-piece maple with 1 walnut stripe, 2-way adjustable truss rod and dual carbon-fiber rods, thinner neck profile
  - Fingerboard: 14 inch flamed maple
  - Frets: 24 stainless steel jumbo, .110 inch wide x .055 inch tall
  - Nut: ivory TUSQ
  - Scale length: 25.5 inch
  - Neck pickup: Kiesel Beryllium with brushed chrome cover
  - Bridge pickup: Kiesel Vantium humbucker with brushed chrome cover
  - Electronics: master volume and tone controls with white pearl inlays, 3-way pickup selector, mini switch for coil-split
  - Output jack: standard rear access jack
  - Bridge: Kiesel/Hipshot tremolo system, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: painted 2x4 headstock with flamed maple overlay
  - Inlays: white acrylic David Maxim signature inlays with standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: white
  - Hardware: chrome
  - Neck width: 1.69 inch or 1.90 inch wide at the nut, 0.78 to 0.82 inch thick at the 1st fret, 0.88 to 0.90 inch thick at the 12th fret
  - Body dimensions: 38.25 inch long, 1.65 inch thick, 12.5 inch wide, or 38.5 inch long, 1.65 inch thick, 12.75 inch wide
  - Weight: 7.6 lbs or 7.8 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
  - Wood type and colours are customizable within the artist's stated preferences
