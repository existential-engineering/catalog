description: "The JHS Pedals 3 Series Ring Modulator covers everything from
  subtle modulation to full metallic chaos in two distinct modes: Earworm
  (inspired by the Way Huge Ringworm with auxiliary LFO) and Green Lantern
  (inspired by the Green Ringer circuit with octave blending)."
details: |-
  The 3 Series Ring Modulator covers it all, from subtle, invisible modulation to full metallic chaos, with two distinct modes. The Blend knob mixes the ring modulation against your dry signal. The Frequency knob controls the speed of the ring modulator's oscillator.

  The Mode toggle selects between two algorithms. Down is Earworm mode, inspired by the now discontinued Way Huge Ringworm. The Tweak knob introduces an auxiliary LFO that adds wobble and movement to the modulation.

  Up is Green Lantern mode, inspired by the Green Ringer circuit, a wave rectifier that produces a natural-sounding octave effect alongside the ring modulation. In this mode, Tweak blends the octave effect from off to 100%.
