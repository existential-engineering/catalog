description: This pedal shares patented features with the Machined Chain Drive Pedal, but with an extended footboard.
details: |-
  For drummers that require additional leverage and throw, the already long DW MFG footboard is offered in XF Extended Footboard models. A modified Contour Heel Plate allows a longer footboard without the need for a larger overall footprint.

  The MCD Machined Chain Drive Pedal is a boutique pedal that shares many of the patented features, industrial design and build-quality of its Direct Drive cousin. The most striking difference is an Adjustable, Sprocket-Less Cam that incorporates a gear shift-style lever. The lever allows players to quickly shift between the most popular chain-drive cam settings, and is easily accessible when mounted to a bass drum.

  Other notable features include a racing-style, all-aluminum, perforated footboard with matching, contoured heel plate, Tri-Pivot Swivel Toe-Clamp, V.E.R.T. Vertical Spring Adjustment, Control Weight/Impact Beater and more.

  The Shift Adjustable Cam adjusts between Accelerator and Turbo cam geometry, or anywhere in between. VERT Vertical Tension Adjustment lets players vertically tweak spring tension with the turn of a single Allen screw, and the Direct-to-Cam Spring Rocker tracks every pedal stroke through a threaded bearing connection.

  A DW MFG Lux Leather pedal bag is included: a soft faux leather bag with reinforced zippers, stitching, handle, and embroidered DW MFG logo, with an accessory pocket for extra beaters, drum keys, and other necessities.
specs: |-
  - Extended Footboard (XF) with modified Contour Heel Plate
  - Adjustable, Sprocket-Less Cam with Gear Shift-Style Lever
  - V.E.R.T. Vertical Spring Adjustment
  - Tri-Pivot Swivel Toe Clamp (U.S. Patent No. 9240169)
  - Interlocking Delta Hinge (U.S. Patent No. 9472174)
  - Control Weight/Impact Adjustable Beater (Patents: US 8633367B2, DE 102011005640)
