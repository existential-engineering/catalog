description: "64x64 all-in-one Thunderbolt 2 and Pro Tools HD audio interface
  featuring eight digitally-controlled mic preamps with Air mode, dual
  mini-DigiLink ports for direct Pro Tools | HD connection, Dante network audio
  expansion, ADAT and S/PDIF digital I/O, and up to 192 kHz / 24-bit operation."
details: |-
  The Red 8Pre is Focusrite's flagship 64-in/64-out Thunderbolt 2 and Pro Tools HD audio interface from the Red range. Eight digitally-controlled mic preamps deliver -129 dB EIN with 63 dB of gain in 1 dB steps and include an Air mode that emulates the classic ISA transformer-coupled circuit.

  Two front-panel high-headroom instrument inputs (2.3 MΩ) sit alongside the mic channels, all controlled via LCD displays. The rear panel carries DB-25 (AES59) connectors for line I/O, two Mini DigiLink ports for direct connection to Pro Tools | HD systems (up to 64 channels), dual Thunderbolt 2 for daisy-chaining, and two Ethernet ports for 32x32 Dante network audio expansion.

  Digital I/O includes 16x16 ADAT over twin TOSLINK pairs plus stereo S/PDIF on both coaxial and optical. Host Mode switching allows rapid transition between a Pro Tools | HD rig and any Thunderbolt-connected DAW without recabling.
specs: |-
  - 64 in / 64 out total channel count
  - 8 digitally-controlled mic preamps with Air mode
  - Mic preamp gain: 0-63 dB in 1 dB steps
  - Mic preamp EIN: -129 dB
  - 2 high-headroom instrument inputs (2.3 MΩ)
  - Line output dynamic range: 121 dB A-weighted
  - Headphone output supports 32 Ω to 600 Ω headphones
  - Sample rates: 44.1 / 48 / 88.2 / 96 / 176.4 / 192 kHz at 24-bit
  - Round-trip latency: 1.67 ms
  - Dual Thunderbolt 2 ports (daisy-chain capable)
  - Dual Mini DigiLink for Pro Tools | HD
  - Dual Ethernet for Dante (32 in / 32 out)
  - 16x16 ADAT (twin TOSLINK pairs)
  - Stereo S/PDIF on coaxial and optical
  - Word Clock I/O
  - Includes Hitmaker Expansion plug-in bundle
  - 3-year warranty
