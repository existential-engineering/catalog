url: https://rme-audio.de/hdspe-madi.html
description: 128-channel 192 kHz PCI Express MADI interface card based on RME's
  award-winning HDSP MADI design, providing 64 channels of coaxial and 64
  channels of optical MADI I/O with SteadyClock, TotalMix FX, and an analog
  stereo monitoring output.
details: |-
  The RME HDSPe MADI is a 128-channel PCI Express internal audio interface card derived from the award-winning HDSP MADI design, providing 64 channels each of coaxial (BNC) and optical MADI I/O on a single 1-lane PCIe endpoint. It is positioned as a professional studio and live tool for mixing, mastering, and multi-channel recording, with full TotalMix FX integration and an analog stereo monitoring output for direct headphone or line use.

  All sample rates from 44.1 kHz up to 192 kHz are supported, with channel counts of 64 at 48 kHz, 32 at 96 kHz, and 16 at 192 kHz in 24-bit format. Both 56- and 64-channel MADI modes are supported along with double-wire (96k frame) operation for 96 kHz, and cable runs over 100 m are supported on both coaxial and optical formats. SteadyClock extracts a low-jitter master clock from MADI for sub-1 ns internal and input jitter, and the card's PLL accepts inputs with up to 100 ns of jitter without dropouts.

  Clocking is handled automatically by RME's intelligent master/slave logic, with selectable sync sources of MADI coaxial, MADI optical, word clock, and internal. The galvanically isolated word clock I/O operates on both single- and double-speed signals, with a signal-adaptation circuit on the input (functional from 1.2 Vpp, switchable termination) and a short-circuit-proof 4 Vpp / 75 Ohm driver stage on the output. Varipitch can follow either an input signal or external word clock.

  The breakout cable adds two independent MIDI I/Os on four 5-pin DIN jacks, plus a virtual MIDI port for embedding MIDI data directly inside the MADI stream. A dedicated 24-bit/96 kHz stereo Phones/Line output (116 dB dynamic range, ADI-8 QS converter technology) provides analog monitoring without an external converter, and ARC USB remote control is supported. Up to three HDSPe MADI cards can be installed in a single workstation for 192 inputs and 192 outputs, and the card can also be used as a MADI optical patchbay/router, coaxial-to-optical converter, redistributor, or software-controlled mixer.

  Software-side, TotalMix FX provides a full 64x64 hardware mixer scalable up to an 8192-channel routing matrix with per-channel phase, internal loopback, and +6 dB output gain. DIGICheck is included for measurement and analysis, and the card carries the standard RME advantages of real-time setting changes, automatic master/slave clocking, and improvements over the legacy HDSP MADI including support for higher sample rates than 96 kHz, additional TotalMix features, direct Time Code Option (HDSP TCO) support, and lower latencies.
specs: |-
  - 128-channel 192 kHz PCI Express MADI interface card
  - 1-Lane PCI Express Endpoint device (revision 1.1)
  - PCIe line speed: 2.5 Gbps
  - Packet-based full-duplex communication, up to 500 MB/s transfer rate
  - All settings changeable in real-time
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz, variable
  - MADI sample rate range: 32 kHz - 96 kHz
  - Word clock range: 27 kHz - 200 kHz
  - Jitter: < 1 ns (internal and all inputs)
  - PLL operates even at 100 ns jitter without problems
  - Channels: 64 @ 48 kHz (24-bit), 32 @ 96 kHz, 16 @ 192 kHz
  - Automatic/intelligent master/slave clock control
  - SteadyClock jitter extraction from MADI signal
  - Sync sources: MADI coaxial, MADI optical, word clock, internal
  - Varipitch by input signal or word clock
  - 1 x MADI optical I/O (cable length > 100 m)
  - 1 x MADI coaxial I/O on BNC (cable length > 100 m)
  - Support for 56- and 64-channel MADI modes
  - Double/single wire (96k frame) support at 96 kHz
  - 1 x Word Clock I/O on BNC, galvanically isolated via transformer
  - Word clock input: signal adaptation circuit (functional from 1.2 Vpp), switchable termination
  - Word clock output: low-impedance driver stage, 4 Vpp into 75 Ohms, short-circuit-proof
  - Operates on single and double speed word clock signals automatically
  - 2 x MIDI I/O on four 5-pin DIN jacks (via breakout cable), independent in/out
  - Virtual MIDI port for direct MADI transmission
  - 1 x stereo Phones/Line output, 24-bit/96 kHz
  - Phones/Line dynamic range: 116 dB
  - Phones/Line based on ADI-8 QS low-latency converter technology
  - ARC USB remote control support
  - TotalMix FX: full 64x64 hardware mixer, up to 8192-channel routing
  - TotalMix features: phase per channel, internal loopback per channel, +6 dB gain on hardware outputs
  - DIGICheck measurement software included
  - Up to three HDSPe MADI cards simultaneously: 192 inputs / 192 outputs
