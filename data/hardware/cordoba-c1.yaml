details: |-
  The C1 is a high-quality and full-size nylon string guitar designed to provide aspiring young musicians with a comfortable first guitar that's easy to learn on and play. Offered in full or 3/4 sizes, the C1 features a Spruce top with Mahogany back and sides, a wood-inlaid mosaic rosette, and a high gloss polyurethane finish. Like all Cordoba instruments, the C1 features premium Savarez strings and an adjustable truss rod for lifetime neck stability. Comes with a standard Cordoba gig bag.
