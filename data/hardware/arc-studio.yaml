details: >-
  Arc studio combines a standalone correction processor, new arc 4 measurement
  software and a room analysis microphone. For the first time in the recording
  industry, an affordable hardware processor can be used as a correction and
  calibration system for any type of studio be it home, project or professional
  without the limitations of a software-only system.


  Arc 4's all-new algorithm analyzes and corrects these issues in minutes. Your
  music snaps into focus, with more controlled low-end, tighter transients and
  pinpoint stereo imaging. Plug the mic into your interface and you'll be guided
  through measuring acoustical spots within your listening position. Ik's
  award-winning arc technology uses this 3d snapshot to identify and completely
  correct all the problematic issues degrading your monitors' performance.


  Arc studio features a 120 db(a) analog input to analog output dynamic range,
  0.5 hz to 40 khz frequency response and ultra-stable clocking for vanishing
  low jitter, offering total sonic transparency and a level of accuracy you only
  find in mastering-grade audio converters. And it connects to your studio and
  monitors via balanced xlrs with power-safe relay-based hard bypass so when
  bypassed you're protected from sudden power-related pops.


  Arc 4 stores the correction profile and loads it into the arc studio
  processor, sitting invisibly between your interface and monitors to apply to
  all incoming signals. The standalone processor corrects studio monitors in any
  studio, including hardware- and console-based setups.


  For DAW-based studios, arc studio frees you from the hassle of inserting
  plug-ins on the master bus of your work and preserves zero-latency monitoring
  setups, plus it allows you to listen to your preferred streaming service with
  acoustically corrected monitoring without messing around with system drivers.
  You can create a profile for every configuration, listening position or even
  monitor pair.
