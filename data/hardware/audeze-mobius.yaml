description: Mobius is a planar magnetic gaming headset with Waves NX 3D audio
  technology, head tracking, and immersive surround sound over USB.
details: |-
  Mobius is powered by Audeze Planar Magnetic drivers, internationally acclaimed for their superior sound quality. Experience a level of depth and realism in your game audio that no other video game headphones can even hope to match.

  We've partnered with Waves, the world-leading developer of audio DSP technologies and Technical GRAMMY Award recipient, to fuse their groundbreaking NX technology into Mobius. Able to process 5.1 and 7.1 Surround Sound audio over USB cable, with Head Tracking and Room Emulation, Mobius is the first headset ever created to provide a truly believable and fully immersive Surround Sound listening experience.
specs: |-
  - Style: Over-ear, closed-circumaural
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 100 mm
  - Maximum SPL: >120dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% (1 kHz, 1mW)
  - Weight: 350g (including battery)
  - Battery type: Lithium-polymer
  - Wireless Connection: Bluetooth (SBC, AAC, LDAC)
  - Wired Connection: USB-C, USB-A, 3.5mm analog audio
  - SKU: 200-MB-1118-01
