description: Fitted with dual Split/King pickups, a design that allows for both
  real Humbucker and real Singlecoil tones, and a third Pearlito Singlecoil, the
  Paloma Custom leaves nothing to be desired.
details: |-
  The Paloma Custom is a special edition of the Paloma, equipped throughout with Duesenberg hardware and pickups. The body is a contoured solid body made from alder, a tone-wood Duesenberg describes as known for its bright voice and versatility, and the solid-body construction is intended to give instant response, attack and sustain along with feedback resistance. It measures 46 x 34 cm (18" x 13.4") with sides 4.2 cm (1.7") high, carries multi-layer cream binding and a black custom pickguard, and is finished in black PUR lacquer.

  The neck is a set-in, one-piece maple neck in a Medium D shape, 42.5 mm (1.67") at the nut and 52 mm (2.05") at the 12th fret, with a steel dual-action trussrod and a black headstock. The Indian rosewood fingerboard has a 305 mm (12") radius, 22 jumbo frets (2.8 x 1.0 mm) and a 648 mm (25.5") scale, and carries the Duesenberg Wings inlays exclusive to this model. A Plek processed fretboard levels the frets as the basis for the fret polishing and setup work Duesenberg carries out by hand.

  Electronics are a custom three pickup layout: a Duesenberg SplitKing at the bridge and at the neck with a Duesenberg Pearlito singlecoil in the middle. The Split/King is not a split humbucker but houses a full-size singlecoil that can be extended to a complete humbucker by a separate fine-tuned coil, so each one can be switched between real singlecoil and real humbucker modes. Controls are one volume, one tone, a 5-way blade switch and two mode switches for the Split/King pickups, mounted on the lower brushed aluminium pickguard, over custom SplitKing wiring.

  Hardware is gold finished throughout and includes Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and the Duesenberg Diamond Deluxe Tremola vibrato in its short version. Strings are Duesenberg Custom 010/050 (010-013-017-028-042-050).

  The instrument ships with a Duesenberg Custom Line Case as standard, described as flightcase quality, classically shaped and handcrafted, and all required allen keys are included.
