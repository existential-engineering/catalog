description: The TLC Bass Compressor delivers studio-quality compression for
  bass players using Aguilar's proprietary Trans Linear Control (TLC) circuit,
  enabling unprecedented levels of performance usually found only in expensive
  studio compressors. Features a Full Spectrum Tilt EQ, ultra-low distortion,
  and flexible dynamics control for recording and live use.
details: |-
  Proprietary Trans Linear Control (TLC) circuit delivers studio-quality
  compression with ultra-low distortion (<0.2%).

  Full Spectrum Tilt EQ for clean sound shaping. Wide range of adjustable
  parameters: Threshold (-30 to -10 dBu), Slope (2:1 to infinity), Attack
  (10ms to 100ms), and Level (-infinity to -3 dBu). Suitable for both
  recording studio work and demanding live performance environments.

  Backed by Aguilar's three-year limited warranty to the original owner.
specs: |-
  - Threshold: -30 to -10 dBu (variable)
  - Slope: 2:1 to infinity (variable)
  - Attack: 10ms to 100ms (variable)
  - Level: -infinity to -3 dBu (variable)
  - Distortion: <0.2%
  - Power: 9V DC (not included)
