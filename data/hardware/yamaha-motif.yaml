description: >-
  The Yamaha Motif is a music workstation released in 2001 that combines synthesizer,
  sampler, and sequencer capabilities with extensive sound libraries. It uses Yamaha's
  AWM2 sample-playback tone generator and features the innovative Megavoice technology for
  realistic acoustic instrument expression. Available in 61, 76, and 88-key
  configurations, the Motif became a staple for studio production and live performance.
details: |-
  The Motif employs Yamaha's AWM2 tone generator technology, which utilizes high-quality sample playback rather than analog synthesis. A defining characteristic is Yamaha's Megavoice technology, which adds realism to acoustic sounds through dynamic expression features including hammer-ons, ghost notes, slides, and fret noises that respond to playing dynamics and aftertouch.

  The integrated 16-track sequencer supports 110,000 notes and includes features for real-time recording and MIDI data import/export. The workstation provides extensive effects processing including reverb, chorus, flanger, phaser, distortion, and overdrive, along with a 4-pole resonant filter and an arpeggiator with 256 preset patterns. It is also compatible with Yamaha's Modular Synthesis Plug-In boards for expanded sound design.

  The Motif series evolved through multiple generations: the original Motif (2001), Motif ES (2003) with enhanced 128-voice polyphony, the lighter Motif MO (2005), and the Motif XS (2007) featuring a full-color LCD display and an expanded 355MB waveform library.
specs: |-
  - 62-note polyphony (original); 128 voices (ES, XS); 64 voices (MO)
  - AWM2 tone generator
  - Waveform ROM: 84MB (original), 175MB (ES/MO), 355MB (XS)
  - 61, 76, and 88-key models; 88-key with weighted hammer-action
  - 4MB sampler expandable to 64MB; 20-bit stereo
  - 4-pole resonant multi-mode filter with 21 types
  - 16-track sequencer; 64 songs; 1024 patterns; 480 ppqn
  - Effects: reverb, chorus, insertion effects, 5-band master EQ
  - Arpeggiator with 256 preset patterns
  - 16-part multitimbral
  - MIDI In/Out/Thru
  - A/D audio inputs
  - mLAN compatibility (ES/XS models)
  - Modular Synthesis Plug-In board expansion slots
