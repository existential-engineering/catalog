description: A modern optical disc player for playback of 1970s-era Optigan and
  Orchestron sound discs, offering speed changes, modulation, transposition,
  reversing, and scratching via MIDI control and physical touch.
details: |-
  The PANOPTIGON's modern transport and audio electronics provide improved playback of several 1970-era optical disc formats, but that is only the beginning! Using a MIDI controller and direct physical touch, dramatic speed changes, modulation, transposition, reversing, and scratching, combined with modern effects, expand the possibilities of loop-based sampling, while CompuDrive provides accurate pitch control when required. Each optical disc contains up to 60 sound tracks. The original Optigan and Orchestron program discs came in many popular styles, some with rhythm tracks and special effects, and our proprietary mastering system allows us to release unissued discs from master tapes preserved by Optigan guru Pea Hicks. In addition, we have created many new discs, which go further in exploring and exploiting the cyclical nature of the playback loop, resulting in loop libraries with endlessly entertaining combinations. 3-Disc Starter Pack is included which includes the Vocal Choir , Singing Rhythm , and Oscillations discs. NO SUBSTITUTIONS
specs: |-
  - Specifications Maximum Polyphony 60 Voices Power Power Supply PS-24 (24 V DC, 3A) Dimensions W x D x H 17.6" x 16.75" x 5.25" (44.7 cm x 42.5 cm x 13.3 cm) Weight 13.4 lbs (6.08 kg) without cover 15.1 lbs (6.85 kg) with cover Connectors MIDI IN, THRU Headphones 3.5mm Audio Output LEFT - MONO SUM, RIGHT - TRS Stereo Output Impedance 1kOhm SYNC IN 3.5mm SYNC OUT 3.5mm Included Accessories Dust Cover PS24 Power Supply AC Cord Disc Starter Pack Vocal Choir, Singing Rhythm & Oscillations Owner's Manual
  - Resources - The manual contains detailed info for setup and technical specs.
