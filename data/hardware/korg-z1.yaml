description: >-
  The Korg Z1 is a 12-voice physical modeling synthesizer built on the same MOSS engine as
  the Prophecy, housed in a full-sized 61-key workstation-style body with deep real-time
  control. It offers thirteen oscillator types spanning standard analog modeling,
  resonance, comb filter, and physical modeling algorithms, delivering an unusually broad
  sonic palette. Dual resonant filters, four LFOs, a polyphonic arpeggiator, and a
  touch-sensitive XY pad make it a powerful instrument for both sound design and live
  performance.
details: |-
  Released in 1997, the Z1 brought Korg's MOSS (Multi-Oscillator Synthesis System) physical modeling technology into a polyphonic format for the first time. With thirteen oscillator types spanning standard analog modeling, resonance, comb filter, and physical modeling algorithms, the Z1 offered an unusually broad sonic palette for its era. Two resonant filters, four LFOs with eighteen waveforms each, and two dedicated effects processors gave programmers deep control over sound design.

  The front panel featured dedicated knobs for the two resonant filters along with a touch-sensitive XY pad, making real-time performance tweaking intuitive and expressive. Polyphony could be expanded from twelve to eighteen voices with an optional board, and the synth supported six-part multitimbral operation over MIDI.

  One of the Z1's standout features was its fully polyphonic arpeggiator, which included five preset patterns and fifteen user-programmable patterns. The arpeggiator's sophistication was widely praised, though the lack of an onboard sequencer was a notable omission.

  The factory presets were widely considered underwhelming and did not showcase the instrument's true capabilities. Dedicated sound designers found the Z1 capable of everything from convincing analog emulations to otherworldly textures impossible on traditional subtractive synths.

  The Z1 found favor with artists including KMFDM, Gary Numan, LTJ Bukem, and Orbital, who valued its unique combination of physical modeling depth and hands-on control in a performance-ready package.
specs: |-
  - Polyphony: 12 voices (expandable to 18)
  - Oscillators: 2 oscillators per voice (13 types), 1 sub-oscillator, noise generator
  - LFOs: 4 LFOs with 18 waveforms each
  - Filter: Resonant low-pass, high-pass, and dual band-pass
  - Effects: 2 effect units with 15 effects including reverb, parametric EQ, chorus, phaser, flanger, rotating speaker, overdrive, auto-wah, talkbox, decimator, compressor
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 256 patches, 32 multis
  - Arpeggiator: 5 presets, 15 user-programmable patterns
  - Control: MIDI (6-part multitimbral)
