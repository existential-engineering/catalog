description: >-
  The Vermona DAF-1 is a stereo analog filter unit featuring two individual
  high/lowpass 24dB/oct filters on each channel. It provides four operational
  modes (Band, Notch, Parallel, and Serial) for flexible signal processing in
  electronic music production and live performance. The Serial mode routes the
  signal through both filter stages for a steep 48dB/oct slope.
details: |-
  The Vermona Dual Analog Filter DAF-1 features a dual-channel architecture that allows independent control over each filter's frequency cutoff and resonance parameters. In Band mode, filter 1 operates as a highpass while filter 2 acts as a lowpass. In Notch mode the configuration is reversed, with filter 1 as lowpass and filter 2 as highpass. Both Parallel and Serial modes employ lowpass configurations, with Serial mode delivering a 48dB/oct slope by routing the signal sequentially through both stages.

  An onboard LFO provides modulation of cutoff frequencies independently per channel. The unit accepts control voltage input via dedicated jacks, functioning as either an envelope follower or accepting external control voltages and expression pedals. It uses TRS mono/stereo input and output jacks for flexible routing.

  Users can patch the left channel output into the right channel input to achieve cascaded filtering with a 96dB/oct slope for mono sources, making the DAF-1 a versatile and affordable analog filtering solution for studio and live use.
specs: |-
  - Four 24dB/octave lowpass/highpass filters
  - Stereo operation with 2 filters per channel
  - Four modes: Band, Notch, Parallel, Serial
  - Frequency cutoff and resonance controls per filter
  - Onboard LFO for cutoff modulation
  - TRS mono/stereo input and output jacks
  - CV input jack for external control voltage or expression pedal
  - Serial mode achieves 48dB/oct slope
