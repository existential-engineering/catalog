description: 100W pedal power amplifier with drive pedals, an advanced effects
  processor, CabRig speaker simulation and USB-C audio — an amp + FX in a
  compact pedal.
details: |-
  AMPED 2 is a 100 Watt pedal power amplifier with drive pedals in the front end, and an advanced effects processor, capable of delivering the tone and feel of traditional valve amps. You can use it in the front end of a traditional amp, power a cabinet at 100 Watts or go direct, ensuring you can take your sound with you anywhere. Power reduction down to 1W and USB-C connectivity means it's equally at home in the studio or the stage.

  The power amplifier's unique, high-headroom design does not compromise on output even at 16 Ohms. Get maximum power and optimum tone with any cabinet set-up at 8 or 16 Ohms. Blackstar's patented Response control offers distinctly different and authentic power valve responses — EL84, EL34 and 6L6 — each setting delivering the response, dynamics, sag and break-up characteristics of the selected valve power amp.

  Fine-tune your cabinet, mic, and room simulations with Blackstar's CabRig technology and output via XLR or stereo jack. Alternatively, connect via USB-C for low-latency 4-channel audio straight into a DAW without the need for an interface. Choose from USA, UK and Classic Amp voicings to dial in your perfect tone.

  Four studio-quality, fully configurable, built-in effects pedals — Drive (Boost / Drive / Fuzz), Modulation (CH/FL, Tremolo, Phaser), Delay (Linear, Analogue, Shimmer) and Reverb (Room, Spring, Plate) — provide unparalleled versatility. Holding the Reverb or Delay footswitch activates a 'Freeze' effect; holding the Modulation footswitch activates an 'Emphasis' effect. Deep editing is available via Blackstar's Architect software.

  Designed for life on the road and on the pedalboard: universal voltage (100V–240V ~ 50/60Hz), an effects loop, 2× 9V DC outputs and MIDI control for easy integration into your rig, plus an on-board chromatic tuner for tuning on the fly during live performances.
specs: |-
  - Power: 100W
  - Type: Digital with Class D Power Amp
  - Voicings: USA, UK, Classic
  - EQ: Bass, Middle, Treble
  - Power Reduction: 100W, 20W, 1W
  - Response: EL84, EL34, 6L6
  - Drive: Drive, Type (Boost, Drive, Fuzz), Tone, Level
  - Modulation: Time, Type (CH/FL, Tremolo, Phaser), Depth, Level
  - Delay: Time, Type (Linear, Analogue, Shimmer), Feedback, Level
  - Reverb: Time, Type (Room, Spring, Plate), Level (more settings via Architect)
  - USB Audio: Yes (4 channel)
  - XLR CabRig Output: Yes
  - Effects Loop: Yes (series or parallel selectable in Architect)
  - MIDI Control: Yes
  - Speaker Outputs: 8 Ohm, 16 Ohm
  - 9V DC Outputs: 2 (maximum combined current 500mA)
  - Voltage: 100V to 240V ~ 50/60Hz
  - Weight: 1.96kg
  - Dimensions: 288 x 80 x 149 (mm)
  - On-board chromatic tuner
  - CabRig IR-based speaker, mic and room simulation
  - Compatible with Blackstar Architect deep-editing software
