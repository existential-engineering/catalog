url: https://collingsguitars.com/mandolins/mt/
description: The MT is a handcrafted A-style mandolin offering professional
  level tone and playability in a simple and understated appointment package. It
  features a carved Engelmann spruce top and seasoned figured maple back, sides,
  and neck. An ultra-thin, all-nitrocellulose lacquer finish and
  individually-graduated tonewoods provide ringing sustain, a wide dynamic
  range, and impressive responsiveness.
details: |-
  The MT is Collings' entry point into professional mandolin building, delivering the same meticulous craftsmanship found across their entire instrument line. The A-style body uses a carved Engelmann spruce top paired with Eastern flamed maple back, sides, and neck. The ebony fingerboard features mother-of-pearl dot inlays and a compound radius (5 1/2" to 11 5/8") for comfortable playability across the neck. An ebony bridge with adjustable saddle allows precise intonation setup, and Nickel Gotoh tuners with black buttons provide reliable tuning stability. The satin nitrocellulose lacquer finish keeps the instrument lightweight and acoustically responsive. The MT ships with a D'Addario EJ74 string set and a deluxe hardshell case. Custom options are available including alternative tonewoods (Italian spruce, birdseye maple), sunburst and solid color finishes, gloss top, wide nut, left-handed configuration, and Waverly tuners.
specs: |-
  - Construction: A-style
  - Top: Engelmann spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Tortoise (top)
  - Bridge: Ebony w/ Adjustable Saddle
  - Fingerboard: Ebony w/ MOP dots
  - Nut: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully Adjustable
  - Peghead Veneer: Ebony w/ MOP Collings logo
  - Tuners: Nickel Gotoh w/ black buttons
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: Satin nitrocellulose lacquer
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell case
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 26 3/8"
