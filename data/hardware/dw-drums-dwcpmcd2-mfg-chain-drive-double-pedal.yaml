description: This boutique pedal shares many of the patented features and the build-quality of its Direct Drive cousin.
details: |-
  Building on the success of the MDD Machine Direct Drive Pedal, the MCD Machined Chain Drive Pedal is a boutique pedal that shares many of the patented features, industrial design and build-quality of its Direct Drive cousin. The most striking difference is an Adjustable, Sprocket-Less Cam that incorporates a gear shift-style lever. The lever allows players to quickly shift between the most popular chain-drive cam settings, and is easily accessible when mounted to a bass drum.

  The MCD2 double pedal incorporates DW's patented Single Post Casting design. This allows you to place the auxiliary bass pedal closer to your hi-hat pedal, letting you move your foot more quickly and easily between them, or even play them simultaneously.

  Other notable features include a racing-style, all-aluminum, perforated footboard with matching, contoured heel plate, Tri-Pivot Swivel Toe-Clamp, V.E.R.T. Vertical Spring Adjustment, Control Weight/Impact Beater and more.

  The Tri-Pivot Swivel Toe Clamp is a patented design that securely anchors to any bass drum counter hoop, and bearings at each pivot make the Ultra-Precision Universal Assembly the most responsive DW universal assembly available today.

  A Lux Leather backpack case is included: a deluxe soft pedal bag that does double-duty as a drummer's travel backpack.
specs: |-
  - Adjustable, Sprocket-Less Cam with Gear Shift-Style Lever
  - Single Post Casting design
  - V.E.R.T. Vertical Spring Adjustment
  - Tri-Pivot Swivel Toe Clamp (U.S. Patent No. 9240169)
  - Interlocking Delta Hinge (U.S. Patent No. 9472174)
  - Control Weight/Impact Adjustable Beater (Patents: US 8633367B2, DE 102011005640)
  - Ultra-Precision Universal Assembly with bearings at each pivot
  - Lux Leather backpack case included
