details: |-
  Doug Wimbish Euro 4 Signature Model – Experience Doug's iconic 1987 NS-2. In 2024, Spector unveiled the Doug Wimbish USA Signature Series which celebrated the impact and legacy of Doug's iconic Spector instruments. Now, Spector is proud to introduce the newly refined Doug Wimbush Euro 4 Signature Model with specifications taken directly from Doug's 1987 NS-2. This model has been carefully specified to match the unique properties of Doug's instrument, including a slim neck carve, narrow nut width, distinct pickup locations, and custom-wound EMG pickups, voiced alongside Doug's originals. The Doug Wimbish Euro 4 Signature Model will be available in two distinct colors: Amber Stain and Black Stain – both with a high gloss finish. Additional specifications include maple body wings with genuine figured maple tops, rosewood fingerboard with mother of pearl crown inlays, gold Spector hardware, and Spector's recently developed Legacy Preamp which offers the classic, 1980s inspired 2-band EQ. This special instrument will feature a nitrocellulose finish that has been carefully aged by hand in our European workshop for the perfect broken-in feel.
specs: |-
