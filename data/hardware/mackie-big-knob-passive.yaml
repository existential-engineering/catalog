details: |-
  Take control of your desktop. Put workflow-enhancing functionality at your fingertips with the Mackie Big Knob Passive monitor controller. This simple and affordable passive level control offers easy 2x2 input and monitor switching plus industry-leading Mackie sound and build quality, making it a must-have piece of gear for any recording studio.

  The Mackie Big Knob has been the go-to monitor controller for studios the world over for well over a decade. And with the Big Knob Passive, you get the purest audio path possible with zero active electronics in the signal path plus incredibly simple and easy source and monitor switching. A trio of buttons for Mute, Mono and Dim provide essential, quick control. Best of all, the Mackie Big Knob Passive is built-like-a-tank, so studios, streamers and engineers can count on solid performance for years to come.
specs: |-
  - Ultra-simple 2x2 monitor controller
  - Choose between 2 sources and 2 monitor pairs
  - Classic Big Knob volume control
  - Mono, mute and dim functions
  - Maximum transparency in a monitor switcher
  - Sturdy "Built-Like-A-Tank" metal chassis
