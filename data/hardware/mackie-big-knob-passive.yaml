description: Improve your studio with a Mackie Big Knob Passive, a passive
  studio monitor controller. Use this for easy source and monitor switching
  without worrying about power.
details: |-
  The Mackie Big Knob has been the go-to monitor controller for studios the world over for well over a decade. And with the Big Knob Passive, you get the purest audio path possible with zero active electronics in the signal path plus incredibly simple and easy source and monitor switching.

  A trio of buttons for Mute, Mono and Dim provide essential, quick control. Best of all, the Mackie Big Knob Passive is built-like-a-tank, so studios, streamers and engineers can count on solid performance for years to come.

  The rear panel is where to connect various sources feeding IN to the Big Knob Passive. These signals are then routed through the Big Knob Passive and released through the monitor OUT jacks. The source and monitor input and output connectors accept balanced or unbalanced signals.

  The Source Input B 1/4 inch and 1/8 inch line-level connections may be connected simultaneously. If both inputs are connected simultaneously, the 1/8 inch stereo line input takes priority over the 1/4 inch connection.
specs: |-
  - Ultra-simple 2x2 monitor controller
  - Choose between 2 sources and 2 monitor pairs
  - Classic Big Knob volume control
  - Mono, mute and dim functions
  - Passive audio path with no power supply needed
  - Maximum transparency possible in a monitor switcher
  - Sturdy Built-Like-A-Tank metal chassis
  - Maximum levels before clipping: 1/4 inch outputs +15 dBu
  - Input type: female 1/4 inch balanced / unbalanced, female 1/8 inch unbalanced
  - Output type: female 1/4 inch balanced / unbalanced
