description: The KT-30FX packs 30 watts of tube-inspired warmth into a versatile
  guitar practice amp with more headroom and flexibility. It combines Clean and
  Overdrive channels with a 16-way digital effects unit, a single 10" speaker, a
  line input for jamming, and a headphone output for silent practice, delivering
  consistent Killer Tone at home, in rehearsal, or wherever you play.
details: |-
  Compact 30-watt solid-state guitar practice amp with a built-in 16-way digital effects unit (reverbs, delays, modulations and more). Two channels: Clean and Overdrive, voiced for tube-inspired warmth. Single 10" speaker. Line input for jamming along to tracks/devices. Headphone output for silent practice. Designed for practice and rehearsal.
specs: |-
  - Power output: 30 watts (solid-state)
  - Channels: 2 (Clean & Overdrive)
  - 16-way digital effects unit (reverbs, delays, modulations)
  - Speaker: 1 x 10"
  - Line input for jamming with external devices/tracks
  - Headphone output for silent practice
