description: Two-channel preamp pedal modelled on the ENGL Fireball amplifier,
  with a Midboost switch, noise gate, USB-C loadable impulse responses and a
  headphone output.
details: |-
  ENGL, known for its high-performance amplifiers, introduces the EP635 Fireball IR Pedal, a 2-channel preamp pedal designed to deliver the Fireball tone in a compact and feature-rich format.

  The EP635 Fireball IR Pedal brings the power and precision of the ENGL Fireball amplifier into a pedalboard-friendly enclosure, offering flexibility and tonal control for guitarists of all styles. The pedal is equipped with digital features alongside its analog voicing.

  Two independent channels can be switched easily, with each channel's knob settings saved independently, allowing transitions between tones. The integrated Midboost switch adds extra punch for cutting through a mix, and an advanced noise gate keeps articulate clarity even at high-gain settings.

  Impulse responses are user-loadable over USB-C with the included software, bringing cab simulations to the pedalboard, and a dedicated headphone output allows silent practice. The rugged chassis carries controls for Volume, Gain, Bass, Middle, Treble, and Presence.
specs: |-
  - Two independent channels with per-channel knob settings saved
  - Preamp voicing modelled on the ENGL Fireball amplifier
  - Built-in Midboost function
  - Advanced noise gate
  - IR (impulse response) loading via USB-C using the included software
  - Controls: Volume, Gain, Bass, Middle, Treble, Presence
  - Input: 1/4 inch (6.35 mm) jack
  - Outputs: 1/4 inch (6.35 mm) jack, headphone 1/8 inch (3.5 mm) jack, USB-C
  - Power: 9 V DC / 300 mA, centre negative, power supply sold separately
  - Dimensions: 6.5 x 11.8 x 5.5 cm
  - Weight: 0.32 kg
