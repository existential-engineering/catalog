id: SWslLSSdvknmb6054YCXf
name: SS-R250N
manufacturer: tascam
primaryCategory: rack-mount
categories:
  - digital
url: https://tascam.com/us/product/ss-r250n
description: 2-channel SD/USB recorder and player with built-in network
  connectivity designed for permanent installation applications. Supports
  high-resolution audio up to 24-bit/96kHz via WAV or MP3 formats, with dual SD
  card slots for mirror or relay recording. Network features include FTP client
  functionality, smartphone app control, SNTP time-based event scheduling, and
  an Event List automation system for unattended operation.
details: |-
  1U rackmount 2-channel solid-state recorder and player for professional installation environments. Records and plays WAV at up to 24-bit/96kHz or MP3 at up to 320kbps to SD cards (up to 128GB) or USB flash drives. Dual SD card slots support mirror recording for redundancy or relay recording for extended continuous capture. Network connectivity (100BASE-TX Ethernet) enables FTP-based file transfer, SNTP time sync, and remote control via iOS/Android apps. Event List scheduler for fully unattended timed operation. Ducking function automatically lowers playback volume when input signal is detected for paging applications. Balanced XLR inputs support +48V phantom power.
specs: |-
  - - Form factor: 1U rackmount; dimensions: 482.6(W) x 45(H) x 300.5(D) mm; weight: 2.9 kg
  - Power: AC 100–240V 50/60Hz, 20W; operating temperature: 5–35°C
  - Frequency response: 20Hz–20kHz ±0.5dB; THD: 0.002% or less
  - S/N ratio: 106dB or more; Dynamic range: 106dB or more; Crosstalk: 100dB or more
  - Recording formats: WAV 16/24-bit at 44.1k/48k/96kHz; MP3 at 44.1k/48kHz
  - Media: SD/SDHC/SDXC up to 128GB; USB flash up to 128GB
  - Analog inputs: balanced XLR pair, unbalanced RCA pair
  - Analog outputs: balanced XLR pair, unbalanced RCA pair
  - Digital I/O: AES/EBU (XLR) in/out, S/PDIF (RCA) in/out
  - Headphone: 1/4-inch stereo jack
  - Network: RJ-45 100BASE-TX Ethernet
  - Control: RS-232C D-sub 9-pin, parallel D-sub 25-pin, 2.5mm remote jack
