description: >-
  The Korg DW-6000 is Korg's first digitally controlled analog synth hybrid, released in
  1985. It combines twelve digital oscillators using eight DWGS sampled waveforms with
  analog resonant filtering to deliver fat basses, warm pulsing strings, and hard nasal
  leads across six voices of polyphony.
details: |-
  The DW-6000 represents an innovative bridge between digital and analog synthesis technologies. The instrument combines twelve digital oscillators (two per voice) with eight simple-to-complex DWGS waveforms, one of which is de-tunable with programmable intervals. Its architecture includes separate VCF and VCA sections, each with ADBSSR envelope generators, allowing real-time parameter manipulation through a single programmable slider.

  The synthesizer offers flexible voicing options: six-voice polyphony in two modes or one monophonic mode with all six voices stacked for enhanced tonal richness. Users can program and store 64 custom patches, making it highly adaptable to various sonic applications.

  The reliance on sampled waveforms presents some limitations — the sound does not process well through distortion, and certain waveforms may struggle to blend naturally when used as pads in a mix. Despite these constraints, the DW-6000 remains an exceptional and underrated bass and lead machine with some nice pad sounds. It was succeeded by the DW-8000, which expanded capabilities to eight-note polyphony, sixteen waveforms, velocity sensitivity, programmable aftertouch, auto-bend, arpeggiator, and digital delay.
specs: |-
  - 6-voice polyphony with two polyphonic modes and one stacked monophonic mode
  - 12 DCOs total, 2 per voice with 8 DWGS sampled waveforms
  - Analog low-pass resonant filter
  - ADBSSR 6-parameter envelope generators for VCF and VCA
  - LFO
  - 61-key keyboard without velocity or aftertouch
  - 64 user-programmable patch memory
  - MIDI compatible
  - Real-time parameter adjustment via single programmable slider
