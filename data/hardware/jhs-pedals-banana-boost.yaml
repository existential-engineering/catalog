description: A versatile two-knob boost pedal that spans treble booster to
  full-range clean boost via its Range control, capable of driving amps into
  natural breakup or pushing dirt pedals into rich harmonic saturation.
details: |-
  The Banana Boost features just two controls — Volume and Range — yet delivers a wide tonal palette. Paired with any tube amp, it's one of the most versatile tone-shaping tools available. The Range knob transitions from Rangemaster/treble booster tones in the left 50% to full-range LPB-1-style power boost tones in the right 50%. Placed after dirt boxes it projects the signal above the mix; placed before them it drives rich harmonic saturation. An internal trim pot is set at the factory to a specific voltage and should not be adjusted. Some early versions have no icon and mini green knobs.
