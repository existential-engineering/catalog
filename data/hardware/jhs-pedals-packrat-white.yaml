details: |-
  NOW AVAILABLE IN WHITE COLORWAY!

  The PackRat is the ultimate tribute to 40+ years of RAT evolution. The PackRat uses a digital runway system to direct 261 components through 40 individual switches. When you choose one of the nine legendary modes, you are playing fully analog circuits that perfectly replicate that mode down to the aging components.

  Modes:
  1. OG v1 (79-83) - First RAT ever made, Fringe Logo
  2. White Face v3 (84-86) - Holy grail small box with reverse Filter taper
  3. Turbo v5 (89) - LED clipping, first sloped enclosure
  4. BRAT v6 (97) - Input buffer, soft clipping added
  5. Dirty v7 (04) - Germanium diodes, maximum saturation
  6. LA (86) - Ibanez LA Metal, rails clipping
  7. Landgraff MO'D (99) - Boutique hand-built RAT cousin
  8. Caroline (10) - Caroline Wave Cannon circuit
  9. JHS Mode - JHS PackRat mod
