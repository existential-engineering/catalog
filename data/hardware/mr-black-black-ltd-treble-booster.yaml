description: A classic germanium treble booster hand-built with an NPN germanium
  transistor. The vintage rock-and-roll boost circuit in an all-black Black LTD.
  finish.
details: |-
  The Black LTD. Treble Booster is Mr. Black's take on the classic germanium treble
  booster, the circuit widely credited with the sound of early rock and roll. It is
  a simple, direct boost voiced to brighten and drive an amplifier's front end.

  Each unit is hand-built in Portland, Oregon around an NPN germanium transistor,
  in an all-black Black LTD. finish.

  The pedal uses true-bypass switching and runs on 9VDC negative-center-pin power,
  with a standard 1/4-inch instrument input and output. This run has sold out, but
  no notice states the product is permanently discontinued.
specs: |-
  - Germanium treble booster (NPN germanium transistor)
  - Hand-built in Portland, OR
  - True-bypass
  - 9VDC negative center-pin power
  - All-black finish
