description: Compact, affordable, and loaded with features, the PodTrak P4 makes
  it easy to capture professional quality audio wherever you are recording your
  podcasts.
details: |-
  The PodTrak P4 is a compact four-input podcast recorder. Its four XLR mic inputs use Zoom's preamps and provide up to 70 dB of gain, so demanding microphones can be used directly, and +48 V phantom power is available on all four. Each input has its own gain knob and mute button, and every source can be recorded to its own track.

  Four independent headphone outputs each have a dedicated volume control, so everyone at the table can monitor separately. Remote guests join over a TRRS cable from a phone, over USB from conferencing software running on a computer, or wirelessly with the optional BTA-2 Bluetooth adapter. The built-in mix-minus function removes echo and feedback from the call automatically.

  Four assignable sound pads trigger music, ads, jingles and pre-recorded interviews on the spot, using 11 pre-recorded presets or audio loaded by the user.

  Recording is 44.1 kHz 16-bit WAV, straight to SD, SDHC or SDXC cards of up to 1 TB. Over USB-C the P4 works as a 2-in/2-out audio interface for recording to a computer, Android device or iOS device, with a class-compliant mode, and it can live-stream a podcast the same way.

  The P4 runs for up to 3 hours on two AA batteries, or from a USB power supply or USB battery for longer sessions. It measures 112 mm wide by 155 mm deep by 47 mm high and weighs 290 g.
specs: |-
  - 4 mono/stereo input channels, 1 output channel (headphone x 4)
  - MIC connectors: XLR jacks (2: HOT), up to 70 dB of gain
  - Phantom power: +48 V on all XLR inputs
  - Smartphone connection jack: TRRS mini jack (4 contacts, TIP: L, RING1: R, RING2: GND, SLEEVE: MIC)
  - Headphones: 3.5 mm stereo mini x 4, each with a dedicated volume control
  - USB: USB Type-C, audio interface and mass storage functions, USB bus power supported
  - DC 5 V: separate USB Type-C port for power supply
  - Audio interface: 44.1 kHz, 16-bit, 2 in / 2 out, class-compliant mode for iOS
  - Recording format: WAV 44.1 kHz, 16-bit, mono or stereo
  - Recording media: SDHC cards 4 GB to 32 GB and SDXC cards 64 GB to 1 TB, class 10 or higher
  - Four assignable sound pads with 11 preset sounds, user audio can be loaded
  - Mix-minus prevents echo and feedback from call audio
  - Audio interface system requirements: Windows 10 version 1703 or later / 11, macOS 10.13 to 26, iOS 12 to 26 (Apple Lightning-to-USB Camera Adapter required), Android OS 7 to 10
  - Power: 2 AA batteries (alkaline, NiMH or lithium, NiMH recommended) or ZOOM AD-17 AC adapter, DC 5 V / 1 A, USB bus power supported
  - Battery life recording 44.1 kHz/16-bit/4ch to SD with phantom power off and 63 Ohm headphones: about 3 hours alkaline, about 3.5 hours NiMH 1900 mAh, about 8 hours lithium
  - External dimensions: 112 mm (W) x 155 mm (D) x 47 mm (H)
  - Weight (unit only): 290 g
  - Supplied with a quick start guide
