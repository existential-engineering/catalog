details: |-
  The MJ Series DK24 HSH 2PT W Mahogany with Flame Maple harkens back to the late 1980s when Charvel guitars were manufactured exclusively in Japan. Attentively crafted in Japan, this Dinky-shaped instrument pairs a resonant mahogany body with a striking flame maple top finished in Caribbean Burst, accented by masked-off natural binding for understated visual flair.

  A bolt-on wenge neck with graphite reinforcement carries a hand-rubbed oil finish on the back for a smooth, broken-in feel. The Speed Neck profile, sculpted shredder's cut heel and scalloped lower back bout work together to deliver effortless upper-fret access and fast lead playing. A heel-mount truss rod adjustment wheel allows quick neck relief tweaks without removing the neck.

  The 12"-16" compound radius wenge fingerboard is fitted with 24 jumbo stainless steel frets and a Graph Tech TUSQ XL nut measuring 1.6875" wide, supporting precise rhythm work and expressive bends across the full range.

  Electronics are anchored by a versatile HSH pickup configuration: a Seymour Duncan Full Shred TB-10 humbucker at the bridge, a Custom Flat Strat SSL-6 single-coil in the middle and an Alnico II Pro APH-1N humbucker at the neck. A 5-position blade switch with volume and tone controls covers a wide tonal spectrum from sparkly single-coil chime to thick humbucker grind.

  Hardware includes a Gotoh Custom 510 tremolo bridge, Charvel-branded die-cast locking tuners and chrome finish appointments. Dunlop dual-locking strap buttons and an included Charvel Multi-Fit hardshell gig bag round out a road-ready package built for serious players.
