name: AT-16
manufacturer: collings
primaryCategory: acoustic-guitar
categories:
  - guitar
url: https://collingsguitars.com/archtops/at-16/
description: Built in limited quantities, this 16" archtop is designed to
  function as an acoustic instrument. Drawing inspiration from 1920s American
  f-hole archtops, it delivers a warm and balanced response with clarity and
  projection. The guitar features understated appointments and gracefully-shaded
  finishing.
details: |-
  The AT-16 is a fully-hollow archtop guitar with fully-carved premium figured maple back and sides, a fully-carved solid spruce top, and an ebony fingerboard with mother-of-pearl graduated dot inlays. It features a nickel trapeze-style tailpiece, an adjustable ebony bridge, premium Waverly tuners, and a high-gloss nitrocellulose lacquer finish. The neck joint is an archtop mortise and tenon. Grained ivoroid binding is used throughout the body, fingerboard, and peghead. The pickguard is ebony with grained ivoroid binding.
specs: |-
  - Construction: Fully-hollow X-braced
  - Body: Fully-carved premium figured maple
  - Top: Fully-carved solid spruce
  - Neck: Premium figured maple
  - Body/Fingerboard/Peghead Binding: Grained ivoroid
  - Bridge: Adjustable ebony
  - Tailpiece: Nickel trapeze-style
  - Fingerboard: Ebony with MOP graduated dots
  - Soundhole: F-holes
  - Nut Width: 1 11/16"
  - Scale Length: 25 1/2"
  - Neck Joint: Archtop mortise and tenon
  - Frets: Medium 18% nickel-silver
  - Peghead Veneer: Ebony with MOP logo
  - Peghead Profile: Haircut
  - Tuners: Premium Waverly tuners
  - Fingerboard Radius: 14" - 26" compound
  - Finish: High-gloss nitrocellulose lacquer
  - Pickguard: Ebony with grained ivoroid binding
  - Truss Rod Cover: Ebony
  - Strings: D'Addario EJ-17 (.013" - .056")
  - Case: Deluxe hardshell
  - Body Width: 16"
  - Body Length: 20 1/2"
  - Body Depth: 2 7/8"
  - Total Length: 41 1/8"
