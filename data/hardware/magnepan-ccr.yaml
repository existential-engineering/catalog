details: |-
  Reference Center Channel Speaker

  The Magneplanar CCR was designed as a companion center channel speaker for the MG 20.7 (or MG 3.7i). The same or similar technology of the 20.7 was used for the CCR with a true ribbon tweeter and quasi ribbon midrange. For many of our "Maggie" customers who are considering adding home theater to their music system, we hear that home theater is not their highest priority. If that describes you, is the CCR the best choice for you as a 3.7i or 20.7 owner? If you think it is not, keep in mind that the home theater is not their highest priority. If that describes you, is the CCR the best choice for you as a 3.7i or 20.7 owner? If you think it is not, keep in mind that the center channel speaker "makes or breaks" a home theater system. For those who want the best in home theater performance, the CCR is the logical choice. However, we won't attempt to fool you. The CCR is no 20.7. If the state-of-the-art for sound reproduction could be had with a "small" speaker like the CCR, what is the need for the radiating area of a 3.7i or 20.7? The CCR has curved true ribbon of the same design as the 20.7 or 3.7i. The curved quasi ribbon midrange is a similar design to the midrange of the 20.7 with 213 square inches of radiating area. Because home theater places greater demands on the center channel speaker, the CCR was designed for higher efficiency. All speaker companies must deal with the same issues for home theater. The space and height available for the center channel speaker is dictated by the video. For a speaker designer, it is the equivalent of "tying one arm behind their back." The center channel speaker does approximately 60-70% of the "heavy lifting". It is ironic that the most important speaker for home theater has major design constraints. Most ribbon and electrostatic speaker companies employ a dynamic midbass coupler to cover the range between the subwoofer and the ribbon or electrostatic driver. In our opinion, that is an unacceptable compromise for the most important speaker in the home theater system. Magnepan employs the front left/right speakers or the CC Speaker Stand or DWM Bass Panels to achieve full range Maggie sound for the center channel (See the CCR manual). Magneplanar CC Speaker Stand

  The Magneplanar CC Speaker Stand is both a speaker stand and a midbass/bass speaker to augment the low frequencies for Magneplanar center channel speakers in a free-standing installation. (Shown below with the CCR). Dynamic woofers, especially subwoofers, can not blend with the "speed" of the Magneplanar center channel quasi-ribbon midrange drivers. The woofer section of the CC Speaker Stand uses the same DiPlanar technology as the Magneplanar 20.7 bass driver. The thin-film, planar-magnetic driver in the CC Speaker Stand has flat frequency response to 5 kHz . An internal crossover has a high pass filter for the Magneplanar center channel speaker. When coupled with a Magneplanar center channel speaker, the combination creates a full-range Magneplanar in the middle for home theater or multi-channel music.
