description: A matched pair of small diaphragm pencil condensers for the studio
  and the stage, from drum overheads to acoustic guitar.
details: |-
  The ZPC-1 is a matched pair of small diaphragm pencil condenser microphones, sold as one SKU of two identical bodies. The pair is matched at both 1 kHz and 100 Hz, so the two channels track each other without the user having to audition and select a pair.

  Each microphone uses a back electret condenser capsule with a 16 mm diaphragm in a fixed cardioid pattern. Frequency range runs 40 Hz to 20 kHz, sensitivity is 38 plus or minus 2 dBV/Pa, maximum sound pressure level is 134 dB SPL at 1 kHz with THD of 1 percent or less, and equivalent input noise is below 12 dB SPL A-weighted against a signal to noise ratio of 82 dB.

  The intended uses are stereo capture in configurations the pair supports directly: an X/Y arrangement for a tight stereo image, or a spaced A/B arrangement for a wider one. Drum overheads and acoustic guitar are the named applications, alongside general instrument recording.

  Each body is solid metal, 20 mm in diameter and 127 mm long, weighing 109 g. Output is on an XLR-3 connector at the base with an output impedance of 200 ohms, and each microphone draws +48 V phantom power at 3.5 mA from the preamp, mixer or recorder it is plugged into. Zoom positions the pair for field use with its own recorders, naming the F3 as an example.

  The pair ships with the accessories needed to rig it: two foam windscreens with rubber-ringed openings, two high-impact plastic mic clips that fit 5/8 inch or 3/8 inch stands or a stereo bar, two 5/8 inch to 3/8 inch screw adapters, and two lint-free carrying pouches.
specs: |-
  - Type: back electret condenser
  - Polar pattern: cardioid
  - Diaphragm: 16 mm diameter
  - Frequency range: 40 Hz to 20 kHz
  - Sensitivity: 38 +/- 2 dBV/Pa
  - Maximum sound pressure level: 134 dB SPL (THD 1 percent or less, 1 kHz)
  - EIN level: below 12 dB SPL (A-weighted)
  - Signal to noise ratio: 82 dB
  - Output impedance: 200 ohms
  - Connector: XLR-3
  - Power supply: +48 V phantom power, 3.5 mA
  - Dimensions: 20 mm diameter x 127 mm
  - Weight: 109 g each, two microphones
  - Sold as a matched pair, matched at 1 kHz and at 100 Hz
  - Suited to X/Y and spaced A/B stereo configurations
  - Solid metal body
  - In the box: 2 x ZPC-1 microphone, 2 x foam windscreen, 2 x 5/8 inch to 3/8 inch screw adapter, 2 x mic clip, 2 x carrying pouch
