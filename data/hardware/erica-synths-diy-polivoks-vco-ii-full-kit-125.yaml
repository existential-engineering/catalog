hp: 12
url: https://www.ericasynths.lv/diy-polivoks-vco-ii-full-kit-125/
description: The core of the VCO is borrowed from the famous Russian synth
  Polivoks VCO and in exponential converter we use the original matched
  transistor IC that was used in Polivoks.
details: |-
  The core of this oscillator is taken from the Polivoks VCO, and the exponential converter uses the original matched transistor IC fitted to that synthesizer. Kits were supplied with one KR198NT1A for that role.

  The schematic was significantly updated for the second version. Plus and minus 10V regulators were introduced for greater stability of operation, and signal amplitudes were adjusted to match the requirements of contemporary modular synths, with all output signals made available simultaneously.

  CV inputs were redesigned to accept positive CV signals, a PWM circuit was added with manual and voltage controlled pulse width, and a synchronization input was introduced so the oscillator can be synced to other oscillators.

  Triangle, saw and pulse waves are on separate outputs, there is an exponential FM input with an attenuator, and an octave switch covers five octaves. Tracking is rated as good across eight octaves, with an octave range of C0 to C8 and a 10Vptp audio output amplitude.

  The panel is 12HP wide and the module is 35mm deep with a skiff-friendly build, drawing 34mA from the positive rail and 36mA from the negative rail.
specs: |-
  - Triangle, saw and pulse wave outputs available simultaneously
  - Manually adjustable and CV controlled pulse width
  - Great tracking across 8 octaves
  - Exponential FM input with attenuator
  - Synchronization input
  - Octave switch, 5 octaves
  - Skiff-friendly design
  - Plus and minus 10V regulators for stability
  - Audio output amplitude 10Vptp
  - Octave range C0 to C8
  - Kits supplied with 1x KR198NT1A
  - Panel width 12HP
  - Module depth 35mm
  - Power consumption 34mA@+12V, 36mA@-12V
