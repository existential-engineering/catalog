name: DN504
manufacturer: klark-teknik
primaryCategory: compressor
categories:
  - limiter
  - dynamics
  - rack-mount
  - outboard
capabilities:
  - compression
  - limiting
url: https://www.klarkteknik.com/en/products/0817-AAX
description: The DN504 packs four independent channels of compression and
  limiting into a single rack unit, for engineers who need consistent dynamics
  processing across multiple sources without the rack space or cost of four mono
  units. It implements the same automatic attack and release circuit that gave
  the DN500 its near-transparent character, scaled to four-channel operation.
details: |-
  Each channel offers compression threshold from -30 dB to +20 dB and ratio from 1:1 to 50:1, and at the 50:1 setting the channel operates as a fast-acting peak limiter. The automatic attack and release circuitry handles programme material with minimal audible artefact.

  Frequency response is 20 Hz to 20 kHz ±0.5 dB, dynamic range is greater than 115 dB unweighted and maximum output level is +21 dBu.

  Inputs and outputs are on 3-pin XLR, with an external side-chain input on balanced 1/4" TRS per channel for frequency-conscious work. The unit occupies a single rack unit and weighs 8.8 lb.

  Applications named on the page are multi-channel drum compression in live FOH, four-way speaker-system protection in installations and broadcast multi-source loudness control, with the 50:1 limiter mode acting as a safety net on power amplifier inputs in permanent installs.
specs: |-
  - Four-channel compressor and limiter, 1U rackmount
  - Compression threshold: -30 dB to +20 dB
  - Ratio: 1:1 to 50:1, with 50:1 acting as a fast peak limiter
  - Frequency response: 20 Hz to 20 kHz ±0.5 dB
  - Dynamic range: greater than 115 dB unweighted
  - Maximum output level: +21 dBu
  - Automatic attack and release circuit
  - Inputs and outputs on 3-pin XLR
  - External side-chain input on balanced 1/4" TRS per channel
  - Weight: 8.8 lb
