description: >-
  The ARP Axxe is a budget-friendly monophonic analog synthesizer featuring a single
  oscillator, offering the distinctive angular ARP sound in a simplified, more affordable
  format compared to the Odyssey.
details: |-
  The Axxe represents a stripped-down version of ARP's popular Odyssey synthesizer, designed to be more accessible to musicians with budget constraints. With just one voltage-controlled oscillator compared to the Odyssey's two, the Axxe produces a thinner sound character while maintaining the uniquely angular and powerful tonal qualities associated with ARP synthesizers.

  Produced between 1975 and 1981, the Axxe underwent design modifications during its production run. Early models featured a black and gold design similar to the Odyssey II, while later production models adopted a black and orange color scheme with PPC pitch bend buttons. The instrument came well-equipped with documentation including a 155-page textbook, overlay sheets, interface charts, and a collection of 50 factory patches.

  The synthesizer found favor among professional musicians across various genres. Notable users include 808 State, Herbie Hancock, Howard Leese of Heart, and members of the BBC Radiophonic Workshop. Despite its simplicity, the Axxe proved capable of generating everything from quick analog bass lines to lead sounds and special effects, making it valuable in both professional and amateur settings.

  The Axxe lacks memory storage capabilities and relies on CV/Gate control for external modulation. Its straightforward architecture and limited feature set made it an ideal entry point for musicians new to vintage analog synthesis, while experienced synthesizer players appreciated its immediacy and sonic character for specific creative applications.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: One LFO with sine modulation to VCF or PW, sine or square modulation to OSC pitch
  - Filter: Model 4075 4-pole Low Pass Filter with resonance, cutoff, and key tracking
  - VCA: One ADSR envelope with modulation to PW, VCF cutoff, or VCA (plus sample & hold of pitch or VCF)
  - Keyboard: 37 keys
  - Arpeggiator/Sequencer: None
  - Control: CV/Gate
  - Production Years: 1975-1981
