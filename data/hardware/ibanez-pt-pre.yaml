description: The Pentatone Preamp — a floor-format preamp with pre-boost,
  distortion plus two-band EQ, noise gate, 5-band parametric EQ, and post-boost,
  plus a bright switch and dual footswitches for bypass and post-boost control.
details: |-
  Extraordinary tone shaping control, dynamic arrays of distortion and exceptional amounts of EQ are all laid out at your feet. The Pentatone Preamp integrates five tone-shaping sections: pre boost, distortion with two-band EQ, noise gate, 5-band parametric EQ, and post boost.

  A bright switch adds treble enhancement when needed, and two integrated footswitches handle bypass and post-boost engagement on the fly. Each section can be switched in or out independently, making the PTPRE viable as both a complete preamp and as a flexible source of any one of its building blocks.
specs: |-
  - Controls: Pre boost, gain, bass, treble, level, 5-band parametric EQ frequencies/levels, post boost, noise gate
  - Switches: Pre boost on/off, bright on/off, 5-band parametric EQ on/off, noise gate on/off, bypass footswitch, post boost footswitch
  - I/O: Input, remote, output
  - Size: 146(W) x 128(D) x 59(H) mm / 5.8 x 5.0 x 2.3 inches
  - Weight: 1.0kg / 2.2 lb
  - Required Current: 110mA@9V
  - Power Supply: One 9V battery or external AC adapter
