description: An analog chorus and vibrato pedal built around a 1024-stage
  bucket-brigade chip, originally conceived to simulate the effect of a warped
  vinyl record. Features true pitch modulation with an all-analog signal path.
details: |-
  Originally conceived to simulate the effect of a warped vinyl record, this only scratches the surface of what Warped Vinyl HiFi can do. This 'true pitch' modulation features an all-analog signal path that can be dialed-in to create a limitless palette of timeless movement.

  HiFi has several improvements over previous versions of Warped Vinyl, including a lag knob for lush chorus tones, reduced noise, and opportunities for more transparent and brighter sounds.

  Warped Vinyl creates its hypnotic vibrato by replicating your dry signal on a 1024-stage bucket-brigade chip and modulating its delay time. This analog 'true pitch' modulation means your wet signal takes on all that BBD warmth and grit along the way.

  Advanced connectivity and customization options include MIDI, CV and Expression control, presets, and internal modulation of any or all its knobs.
specs: |-
  - All-analog signal path
  - 1024-stage bucket-brigade chip
  - True pitch modulation
  - Lag knob for chorus tones
  - Mono I/O
  - 2 Presets
  - Internal modulation (Ramping)
  - MIDI (PC, CC, Clock)
  - CV control
  - Expression control
  - External tap
  - Tap tempo with subdivisions
  - Momentary or latching bypass
  - True bypass
  - Power: 9V Center Negative, ~100mA
