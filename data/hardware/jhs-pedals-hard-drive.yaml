description: A modern high-gain distortion pedal with cascaded gain stages, hard
  limiting circuit, class AB amplifier section, and a 3-band Baxandall EQ with
  sweepable midrange, designed to cover the best post-grunge distortion tones of
  the 1990s and 2000s.
details: |-
  The JHS Hard Drive is an original modern distortion pedal developed over eight years, featuring cascaded gain stages and a hard limiting circuit followed by a class AB amplifier section driving a sweepable midrange EQ and Baxandall bass/treble controls. It is the final design work of JHS head engineer Cliff Smith, who passed away in 2021. Controls: Volume (overall output level), Mid Freq (sweepable midrange frequency selector), Drive (distortion amount), Bass (cut/boost, noon is flat), Middle (scoop/boost, noon is flat, frequency set by Mid Freq), Treble (cut/boost, noon is flat). Silent soft-touch switching with buffered bypass.
