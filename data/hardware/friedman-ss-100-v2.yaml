description: The second generation of Friedman's Steve Stevens signature head, a
  hand-wired 100 watt all-tube three channel amplifier in a redesigned
  blacked-out Baltic Birch shell.
details: |-
  Dave Friedman's first signature amplifier, the SS-100, was created in 2011 to the exacting tonal demands of guitarist Steve Stevens. After nearly a decade together, Steve and Dave agreed it was time for an update.

  The hand-crafted in the USA SS-100v2 features a fully redesigned, blacked out Baltic Birch head shell, built to withstand the rigors of the road.

  On the front panel are three channels: a clean channel with an independent tone stack, plus a dirty channel and a boosted channel that share a tone stack, allowing a plethora of voicings to be dialled in. That shared stack carries bass, middle and treble with a fat switch for the SS and SS+ channels, and each channel has its own master volume and gain control. Channel switching and boosts are accessed from the front panel or from the footswitch jack on the rear panel, which is also where the ultra-transparent series effects loop sits.

  By far the highlight of this amplifier is its sound. From the shimmering cleans to the high gain monster tone that put Steve Stevens on the map, the SS-100v2 stands in a class of its own. A 4, 8 and 16 ohm impedance selector switch and custom USA made transformers complete it, a two button footswitch with LEDs is included, and it carries a limited lifetime warranty.
specs: |-
  - 100 watt all-tube head
  - Three channels, clean plus dirty and boosted
  - Hand-wired in the USA
  - 4 x EL-34 power tubes
  - 5 x 12AX7 preamp tubes
  - Master volume and gain controls per channel
  - Clean channel with an independent tone stack
  - Shared EQ consisting of bass, middle, treble and fat switch for the SS and SS+ channels
  - Ultra transparent series FX loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - 2 button footswitch with LEDs included
  - Blacked out Baltic Birch head shell
  - Limited lifetime warranty
