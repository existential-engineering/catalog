details: |-
  The Miktek PM10 super cardioid, dynamic microphone features a custom designed, neodymium capsule element offering extremely clear and articulate sound reproduction. The PM10's frequency response is full and robust and has been contoured to snare and tom-toms. Plus, the capsule's unique labyrinth design provides ultimate rear rejection and maximum gain before feedback, so your snare and toms cut though the PA. The PM10 is an excellent choice for conga, timbale, hand-drums and other percussion as well. Specifications

  Type
  Dynamic, Neodymium Element

  Frequency Response
  50Hz-16kHz

  Polar Pattern
  Super Cardioid

  Maximum SPL
  150dB

  Sensitivity
  -54dBV/Pa

  Output Impedance
  300 Ohms

  Finish
  Silver with black appointments

  Construction
  Steel grille and die cast body

  Connector
  3-pin XLR

  Net Weight
  0.65lbs

  Dimensions
  5.48"x1.63"x1.63"

  Accessories
  Protective Case and LRM100 Mic Clip

  Downloads

  Manual
