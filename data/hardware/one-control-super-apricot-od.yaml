details: |-
  Features One Control SUPER APRICOT OD is AIAB (Amplifier-in-a-Box) is designed to capture the tone of mid 60's Supro tube amps. In the 1940's, a new American amp manufacturer with roots in resonator guitars was in the early days of its now legendary history, electrifying blues stages on Chicago's south side. By the 1960's, the brand - Supro - was building an array of guitars and amps that would eventually become legendary, and was the third largest amplifier manufacturer in the US. In addition to Chicago bluesmen, Supro could count legendary guitarists such as Jimi Henrdix and Jimmy Page as its fans. The Supro sound is undoubtedly at the core of the early rock 'n' roll sound. SUPER APRICOT OD is designed to produce the rustic, raw, gnarly tones of a classic Supro tube amp, with surprising amount of dynamic control. As you play, you'll be amazed at the Super Apricot's depth. The tone is saturated, without feeling overly compressed. Super Apricot can even evoke the massive tone made famous by the 1964 Thunderbolt 15" bass amp, which, much like another American-made amp originally designed for bass, attained legendary status only after a guitar was plugged in to it. Bjorn Juhl is the designer of the SUPER APRICOT OD, as well as the Honey Bee OD, another pedal known to be inspired by early Supro tones. SUPER APRICOT OD is more of a "slightly after" amp sound than Honey Bee OD. Though they share a point of inspiration, the circuits are entirely unique. SUPER APRICOT OD is designed as an "Amp in a Box", while Honey Bee OD is a true overdrive effect. You can easily control the gain with DRIVE control and use the guitar's volume control and picking intensity to clean up the tone. However, there is a feeling of saturation somewhere in that clean tone; it becomes more of a "hot clean". You can also strongly distort the tone by increasing the DRIVE and picking strongly. However, the distortion still maintains a resolution more like a clean tone. Specifications Input impedance: 280 K Output impedance: 10K Drive voltage: 9 V Consumption current: 2.5 mA S / N ratio: -87 dB Size: 39 W x 100 D x 31 H mm (not including knobs) 　　 47 W x 100 D x 48 H mm (including knobs) Weight: Approximately 160 g True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply Bjorn's Description: SUPER APRICOT OD (SAOD) is a dynamic Amp-In-A-Box that creates a medium gain that evokes the dawn of rock and roll. Since the gain can be controlled by the trembling of the string, it will be possible to always turn on and use it. From rhythm to lead, it is also effective as a preamp to use as a basis for guitar tones. You could easily create an entire solo album with one SAOD. Even putting a buffer in front does not affect the sound; you can combine it with other pedals. I hope you enjoy the dynamics of the SUPER APRICOT OD - Bjorn Juhl

