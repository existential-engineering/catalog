details: |-
  One of the most frequent questions we receive from our users is, “How do I make sure that I supply my TC effect pedal with the correct amount of power?” Questions surrounding Voltage and Milliamps are probably some of the most important, since too little can lead to noise, hum and unwanted tone degradation, while too much or the wrong kind of power can seriously damage your equipment. With our new POWERPLUG power supplies we’ve taken all the guesswork out of the equation for you, so you can be sure that your TC Electronic stompbox is only supplied with the correct amount of TC approved power every single time! So why spend time worrying about voltage? You got songs to write, gigs to play and solos to shred! POWERPLUG comes in 9 and 12 volt versions. The 12 volt PSU is a perfect replacement supply for Nova pedals but also lets you power pedals from our sister company TC Helicon.
