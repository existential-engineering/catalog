details: |-
  Unearth the Walrus Audio Silt Harmonic Fuzz, a collaborative creation with tube expert Jim Hagerman. Wielding an internal pre-amp tube, the Silt is a two-in-one fuzz that creates massively rich fuzz tones perfect for chords and rhythmic parts or with the press of a switch, adds uniquely harmonic overtones to the signal before hitting the tube. Crafted specifically for those seeking a harmonically rich fuzz experience, the Silt boasts an analog circuit with the distinctive warmth of a 12AU7 tube as its drive section, letting you explore a unique and wild sonic landscape. Main Features: 12AU7 Tube Drive The Silt's 12AU7 tube section drives the warm, bone-rattling fuzz. We unearthed this sonic fossil to encase your sound in an amber warmth, while still providing the grit, growl, and harmonically complex textures that only a tube-driven fuzz can provide. Harmonic Mode Harmonic Mode acts as a frequency doubler before the drive section of the pedal. This produces crispy, octave-like sounds, lending a unique edge to your lead tones. Try this with your guitar tone knob rolled off. Contour Control for Precision Tone Sculpting Refine your fuzz tones with the precision of the Contour control to achieve a wide spectrum of timbres. Toggle between highpass, flat, and lowpass curves in the pre-tube EQ stage, like uncovering layers of sonic strata. Especially helpful when switching between different styles of pickups. Whether you're chasing searing leads or wooley rhythm, the Silt adapts to your style with roaring precision. Designed for Operation at 9v-12v for Plenty of Gain Supercharge your fuzz experience by operating the Silt anywhere between 9v and 12v. Running the pedal at 12v will give you an extra gain boost, letting you push the primal boundaries of fuzz to deliver the searing tones you've been searching for. True Bypass Circuit Maintain the integrity of your original tone with the relay bypass circuit. When disengaged, the Silt ensures your signal remains pure, allowing your guitar's natural voice to shine through undisturbed.
