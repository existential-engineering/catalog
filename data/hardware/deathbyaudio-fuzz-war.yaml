description: Eviscerate your sound with Death By Audio's legendary Fuzz War
  pedal, handcrafted for intense distortion, pushing the classic fuzz sound with
  improved dynamics and superior signal integrity.
details: |-
  If love is a battlefield, then the Fuzz War is your ticket to victorious sustaining fuzz tone. When there's nothing between you and the audience except an amp, the Fuzz War, and your axe, crank the Fuzz control all the way up and blow 'em away with the raunchiest fuzz tone in modern history. Or dial back the Fuzz for kinder, gentler overdrives and boosts but without volume limits!

  The Fuzz War's specially designed active multi-curve Tone control lets you change the timbre from a deep sludge-bass rumble to screamin' top-end lead tones that slice through the mix, with a whole bunch of useful sounds in-between. When the Fuzz is turned all the way down, the Tone control acts as a frequency shifter, useful for parked-wah and sick filtered effects. And it wouldn't be a Death By Audio fuzz pedal without enough output to make even the highest headroom amp beg for reinforcements, which is why there's a handy Volume control to adjust the output level.

  Volume controls the output volume of the effect. Fuzz controls the gain of the fuzz circuit: at its lowest setting the pedal acts as a tone shifter, and as the knob is turned up it sweeps from a booster to an overdrive to a thick distortion to a full-on blown-out war of fuzz. Tone is a specially designed multi-curve shaping filter that changes the timbre from super deep bass sludge to screaming highs.
