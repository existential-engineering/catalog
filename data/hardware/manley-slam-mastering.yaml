description: "SLAM!® Mastering with dual limiters: ELOP® opto and FET"
details: |-
  Summary: The analog authority for loud and punchy masters. The Manley SLAM! Mastering Edition takes control of your dynamics and loudness with two distinct and simultaneous limiters — the musical ELOP® opto limiter and the fast FET 'brick-wall' limiter — giving a versatile tool to shape sound for mastering.
  Transformer Coupling: MANLEY IRON® transformer-coupled output
  Version: Mastering Edition variant of the SLAM! platform — line-only (no mic preamp / DI section) with high-headroom design optimized for digital conversion.
specs: |-
  - Frequency Response: 5 Hz – 60 kHz
  - Thd Noise: < 0.05% @ 1 kHz
  - Dynamic Range: 115 dB
  - Max Output: +32 dBm (+30 dBm into 1kΩ load)
  - Input Impedance Xlr: 2 kΩ (balanced XLR)
  - Input Impedance Unbal: 10 kΩ (unbalanced 1/4")
  - Output Impedance: 200Ω
  - Fet Attack: ~100 microseconds
  - Fet Release: 10 ms to 2 seconds
  - Fet Ratio: >20:1
  - Elop Attack: ~10 ms for 6 dB GR
  - Elop Release: 2.5 seconds
  - Elop Ratio: 10:1
  - Tubes: 2 × 12AT7A, 2 × 6414W
  - Power Consumption: 57.6W (0.480A @ 120V; 0.240A @ 240V)
  - Dimensions: 19" × 12" × 3.5" (2U)
  - Shipping Weight: 25 lbs
  - Mains Frequency: 50–60 Hz
