description: Inside the L.A. Lady Overdrive's compact housing live the
  archetypal tones of over 50 years of overdrive and fuzz technology.
details: |-
  The L.A. Lady Overdrive packs the archetypal tones of over 50 years of overdrive and fuzz technology into a compact housing. It features three selectable overdrive engines accessed via center toggle: TUBE (based on a Marshall preamp), CRUNCH (warmer tube drive), and SMOOTH (transparent mid-boost).

  Users can stack two different drive engines in series, run them in parallel, or split signals to stereo outputs. Advanced signal routing enables effects send, multi-signal mixing, or mono signal splitting.

  The pedal stores up to 6 different overdrives across two banks of three slots and is compatible with expression pedals via the Neuro Hub.

  It supports MIDI (PC and CC messages) and connects via Mini USB for Neuro software editing.
specs: |-
  - Three overdrive engines: TUBE (Marshall), CRUNCH, SMOOTH (mid-boost)
  - Stack engines in series, parallel, or split to stereo outputs
  - Advanced signal routing: effects send, multi-signal mixing, mono split
  - Stereo I/O with external effects loop
  - Stores up to 6 overdrives (two banks of three)
  - MIDI capability (PC and CC messages)
  - Expression pedal compatible via Neuro Hub
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
