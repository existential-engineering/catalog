description: With the immense sonic potential of granular synthesis, Multigrain
  can transform your audio samples and live input into everything from ethereal
  ambient drones to sputtering, alien machine techno, and virtually everything
  else in between. With ample assignable modulation inputs and real-time,
  performance-focused controls, the only limit is your imagination.
details: |-
  Multigrain is an eight-channel stereo morphing granular sampler and live audio processor. Layer grains and sequence from the eight available Sounds—each one loaded from your microSD sample library, or recorded directly on the module. Each of the eight Sound Buttons plays grains generated from its own sample or the live input; its own pair of Scenes—two completely different sets of granular parameters; a dedicated Morphing Fader and CV allow you to smoothly morph between these two Scenes. Dedicated Select, Next and Gate CV inputs allow you to sequence the playback of all eight Sounds.

  Assignable X/Y/Z CV as well as an internal Random S&H generator, can be applied to any and all granular parameters at once. Assignable A/B Outputs let you modulate other modules in time with Multigrain.

  Projects and Presets allow you to save, load, and organize different sets of samples and settings. 48kHz 24-bit Stereo I/O and 32-bit floating point internal processing for Hi-Fi output.

  The granular engine has a full set of controls to shape your grains. You can apply two panel settings per Sound—Scenes A and B—then morph between them using the Morph fader or automate it with the dedicated Morph CV/Attenuverter.

  Multigrain supports up to 48 Projects, each with 48 Presets, so you can store multiple configurations and sample sets for instant recall.
specs: |-
  - Width: 20HP
  - Depth: 29mm
  - Current Draw: 130mA @ +12V, 13mA @ -12V, 0mA @ +5V
  - 48kHz 24-bit Stereo I/O, 32-bit floating point internal processing
  - Supported sample format: 48kHz 16-bit Stereo WAV, 32-second maximum
  - 32GB microSD card included (front-panel accessible)
  - Up to 48 Projects, each supporting up to 48 Presets
  - 13 dedicated granular parameters (10 knob functions, 3 behavior toggles)
  - 32-second always-listening recording buffer
