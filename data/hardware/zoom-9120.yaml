description: ZOOM-quality reverbs and modulation effects in a flexible studio processor.
details: |-
  The 9120 Advanced Sound Environment Processor is a 1U 19-inch rack stereo effect unit built around reverb. Of its 22 basic effects, eight are reverbs: Hall 1 and 2, Room 1 and 2, Plate 1 and 2, a gated reverb and an early reflection program, with Chorus and Pitch Shift also available routed into reverb as two-stage multi effects.

  The rest of the library covers modulation, delay and pitch. Chorus and Sweep Flanger handle modulation. Mono Echo, Ping Pong Delay, Stereo 2ch Delay, Stereo X Feedback Delay and Hold Delay handle time, with a delay time calculator utility built in. Pitch programs run from an independent left and right Stereo Pitch shift through pedal-controlled pitch bend to a MIDI harmonized pitch shift with its own user scale. An SFX group adds a karaoke effect that removes the vocal from a stereo music track, with the key adjustable five semitones either way, and a surround simulation.

  Operation is deliberately shallow. An effect selector dial picks the basic effect directly, three Data Entry controls edit up to three parameters at once, and the parameter count per effect is kept low. A Compare key switches between the edited and stored values, an OUTPUT BALANCE dial sets direct against effect globally, and 99 programmable memories hold the results. A TRIGGER key and a front-panel CONTROL IN jack give tap and footswitch control over the delay and gate reverb, which can also be triggered from the input signal itself or from a MIDI control change or note on.

  Conversion is 16-bit stereo with 64-times oversampling on the way in, giving a 90 dB dynamic range and a frequency response of 20 Hz to 14.5 kHz through the effect and 20 Hz to 20 kHz on the direct path. Rear connections are stereo 1/4-inch inputs and outputs, each pair switchable between -20 and +4 dBm, plus MIDI in and out and a DC input for the supplied AD-0002 9 V adapter. MIDI covers program change by an assignable table, real-time parameter control, master effect level and effect mute, and patch storage to another device or a second 9120. The chassis measures 440 x 272 x 44 mm and weighs 2.5 kg.
specs: |-
  - 1U 19-inch rack stereo digital effect processor, 22 basic effects, 99 programmable memories
  - Frequency response 20 Hz to 14.5 kHz through the effect, 20 Hz to 20 kHz direct
  - Dynamic range 90 dB
  - A/D conversion 16-bit stereo with 64 times oversampling, D/A conversion 16-bit stereo
  - Input: 2 channels on 1/4-inch jacks, gain switchable -20 / +4 dBm (L/MONO alone makes the signal mono automatically)
  - Output: 2 channels on 1/4-inch jacks, gain switchable -20 / +4 dBm
  - Effects: Hall 1, Hall 2, Room 1, Room 2, Plate 1, Plate 2, Gate, E/R, Chorus, Chorus to Reverb, Mono Echo, Ping Pong Delay, Stereo 2ch Delay, Stereo X Feedback Delay, Stereo Pitch, Pitch to Reverb, Karaoke, Surround, Sweep Flanger, Pedal to Pitch, MIDI to HPS, Hold Delay
  - Gate reverb trigger source selectable: L+R input signal, R input signal, TRIGGER key or CONTROL IN footswitch, MIDI control change above 64, or MIDI note on
  - Pitch programs shift -12 to +12 semitones chromatic and -50 to +50 cents fine, independently per channel on Stereo Pitch
  - Karaoke effect removes the vocal from a stereo music track and shifts its key up to five semitones either way
  - Built-in delay time calculator utility
  - Three Data Entry controls edit up to three parameters at a time. Compare key switches between edited and stored values
  - OUTPUT BALANCE dial sets direct against effect level globally across all effects
  - Control: MIDI IN / OUT and CONTROL IN (footswitch or foot pedal)
  - MIDI: program change through an assignable table mapping programs 0-127 to memories 1-99, real-time effect control by pitch bend, control change and NRPN, master effect level, effect mute, and system exclusive patch transfer
  - Power: DC 9 V 1 A from the included AD-0002 AC adapter
  - Dimensions 440 (W) x 272 (D) x 44 (H) mm, EIA 19-inch rack 1 unit
  - Weight 2.5 kg (5.55 lb)
