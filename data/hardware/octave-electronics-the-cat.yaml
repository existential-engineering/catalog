description: >-
  The Octave Cat is a dual-oscillator analog synthesizer produced from 1976 to 1981,
  offering monophonic and duophonic operation. Known for its similarity to the ARP
  Odyssey, which led to a lawsuit from ARP in the late 1970s, the Cat became an affordable
  alternative that found favor with artists like Devo, OMD, and the Chemical Brothers.
details: |-
  The Cat was released by Octave during the golden era of analog synthesizers, competing alongside the Minimoog and ARP Odyssey. Its design drew heavily from the Odyssey's architecture, which ultimately prompted ARP to file a lawsuit against Octave in the late 1970s for cloning their designs.

  The original Cat was a purely monophonic instrument. A later revision, the Cat SRM, introduced duophonic capability, allowing two-note polyphony by dedicating each VCO to a separate voice. In mono mode, the two oscillators can be stacked for rich bass and lead sounds, while poly mode splits them into independent voices at the cost of timbral complexity. The SRM version also added a two-note sample-and-hold feature for each voice.

  The Cat has been used by a diverse range of artists including The Dust Brothers, Chemical Brothers, Devo, Rod Argent, David Bedford, Orchestral Manoeuvres in the Dark, and Mixmaster Morris.
specs: |-
  - Polyphony: Monophonic / Duophonic (SRM version)
  - Oscillators: 2 VCOs (2 sawtooth, 2 square wave, 1 triangle) plus 2 sub-oscillators
  - LFO: 1 with sample-and-hold
  - Filter: 1
  - VCA: 1
  - Envelopes: 2 (AR and ADSR)
  - Keyboard: 37 keys
  - Memory: None
  - Control: CV/Gate
  - Production period: 1976-1981
releaseDate: "1976"
releaseDateYearOnly: true
