description: The NSEQ-HF is an API 500-series module that concentrates the NSEQ
  parametric equalizer on its high-frequency band, with six selectable centers
  from 4.8 kHz to 21 kHz and peak or shelf response. It uses the same
  all-discrete Class A J-FET circuitry as the NSEQ-4, with selectable balanced
  or unbalanced input and a transformerless signal path.
details: |-
  The NSEQ-HF is a 500-series rack module that takes the top end of the discrete JFET Class A NSEQ parametric equalizer and offers it on its own. The NSEQ topology is the one used in the STT-1 Origin Twin Topology channel strip and in the LOC phono archiving system, and it is applied here in mastering, post-production, live sound, mixing and tracking work.

  Circuitry is identical to that of the NSEQ-4: the FSA-03 Class A all-discrete J-FET amplifier and the DSA-01 Class A all-discrete J-FET true-differential line receiver. Both amplifiers use hand-matched Toshiba 2SJ74 and 2SK170 discrete J-FETs with no signal path ICs, the input is switchable between balanced and unbalanced, and the signal path is transformerless.

  The high-frequency band offers centers at 4.8 k, 5.8 k, 8.0 k, 10 k, 16 k and 21 k, selectable for peak or shelf. The shelving slope is 6 dB per octave, and with the LED off the band peaks at a fixed Q of 1.0. Cut and boost reach plus or minus 18 dB across 21 detented steps, or plus or minus 9 dB with the range switch engaged, and true hard-wire bypass engages when the EQ is not selected.

  Noise is rated at -106 dBu and the module uses ultra-premium parts including a gold mil-spec Grayhill rotary frequency-select switch. It is hand-built in Northern California.
specs: |-
  - Filter Shape: Shelving at 6 dB per octave, peaking with a fixed "Q" of 1.0 when the LED is off
  - Maximum Output Level: +21 dBu
  - Maximum Input Level (EQ Flat): +20 dBu balanced, +14 dBu unbalanced
  - Maximum Input Level (EQ Full Boost): +17 dBu
  - Frequency Response: +0 / -3 dB, sub 2 Hz to beyond 300 kHz
  - Maximum Cut/Boost (21 Step Detented): +/- 18 dB (+/- 9 dB with range switch in)
  - Frequency Centers (Peak/Shelf Selectable): 4.8 k, 5.8 k, 8.0 k, 10 k, 16 k, 21 k
  - THD + Noise (20 Hz to 30 kHz, All EQ Bands Switched In): < 0.009%, typ < 0.003%
  - Common Mode Rejection Ratio (10 Hz to 20 kHz, 100 mV C.M.): > 60 dB, typ > 80 dB
  - Slew Rate (+21 dBu Out): > 50 volts per microsecond
  - Hard-wire Bypass Switch: Yes
  - Input Impedance: 25 kilohms
  - Minimum Output Load Impedance: 50 ohms
  - Recommended Load: > 500 ohms
  - Output Impedance: 5 ohms
  - EQ Amplifiers: Pure Class-A discrete J-FETs
  - Power: +210 mA consumption with all LEDs on
