description: The dbx 166 is a discontinued dual-channel compressor/limiter
  featuring dbx's OverEasy® compression and a PeakStop™ hard limiter in a 1U
  rackmount format. It was designed for studio and live sound use, offering
  smooth gain control with minimal audible artifacts.
details: |-
  The dbx 166 established the foundation for dbx's mid-range compressor/limiter line, combining OverEasy® compression technology with a hard-limiting PeakStop™ circuit in a compact 1U rackmount chassis. The unit processes two channels independently or linked for stereo operation.

  OverEasy® compression provides a soft-knee characteristic that transitions smoothly from no compression below the threshold to full ratio above it, resulting in more transparent, natural-sounding gain reduction. The PeakStop™ limiter acts as an absolute ceiling, protecting downstream equipment and recording media.

  The 166 was widely used in broadcast, studio, and live sound applications, and represented an accessible entry point into professional dynamics processing with reliable dbx circuitry.
