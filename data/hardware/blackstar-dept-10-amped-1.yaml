description: 100W guitar amp housed in a compact pedal, transforming any
  pedalboard, modeller, or multi-effector into a performance-ready amp with
  CabRig speaker simulation and USB-C audio.
details: |-
  The Dept. 10 AMPED 1 is a powerful 100 Watt guitar amp housed in a compact pedal. Transform any pedalboard, modeller, or multi-effector into a performance-ready amp and take your sound anywhere.

  The power amplifier features a unique high-headroom design, delivering full output even at 16 Ohms. Enjoy maximum power and optimal tone with any cabinet setup at 8 or 16 Ohms. Blackstar's patented Response control provides authentic power valve responses and true guitar amp dynamics.

  CabRig offers top-tier IR-based DSP speaker simulation with hundreds of cabinet, mic, and room settings. Save three presets direct to the AMPED for quick access. The USB-C port sends 4 channels (clean/dry, preamp out, stereo emulated out) to your DAW for easy, authentic tone in your recordings.

  The Response control delivers five distinctly different authentic power valve responses — KT88, 6L6, EL34, 6V6, EL84. Each setting delivers the response, dynamics, sag and break-up characteristics of the selected valve power amp. The Linear response offers transparent power amplification, used in combination with the Flat voice when pairing your AMPED 1 with an external amp modeller.

  The Power Reduction switch lets you choose between 100 Watts, 20 Watts, or 1 Watt, ensuring the perfect balance of power and response for any setting, from studio to stage. AMPED 1 is universal voltage, operating seamlessly anywhere in the world from 100V to 240V ~ 50/60Hz, and easily integrates into your pedalboard or rig with an effects loop, two 9V DC outputs, and MIDI control.
specs: |-
  - Power: 100W
  - Type: Digital with Class D Power Amp
  - Voice: USA, UK, Flat
  - EQ: Bass, Middle, Treble
  - Power Reduction: 100W, 20W, 1W
  - Response: KT88, 6L6, EL34, 6V6, EL84, Linear
  - Reverb: Yes (more settings via Architect)
  - Reverb Freeze: Yes
  - USB Audio: Yes (4 channel)
  - XLR CabRig Output: Yes
  - Effects Loop: Yes (series or parallel selectable in Architect)
  - Footswitchable Preset: Yes
  - MIDI Control: Yes
  - Speaker Outputs: 8 Ohm, 16 Ohm
  - 9V DC Outputs: 2 (maximum combined current 500mA)
  - Voltage: 100V to 240V ~ 50/60Hz
  - Weight: 1.57kg
  - Dimensions: 200 x 81 x 149 (mm)
  - CabRig IR-based speaker, mic and room simulation
  - Compatible with Blackstar Architect deep-editing software
