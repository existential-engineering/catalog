details: |-
  The Angel Vivaldi Signature Pro-Mod DK24-6 Nova is a 6-string signature electric guitar built in collaboration with virtuoso instrumentalist Angel Vivaldi. It pairs a modified Dinky basswood body with a scalloped lower back bout for improved upper-fret access and ergonomics, finished in spectacular Lucerne Aqua Firemist with a color-matched reverse licensed Fender Stratocaster headstock.

  The bolt-on caramelized maple neck features graphite reinforcement and a satin finish for fast, comfortable playability. A 12"-16" compound radius caramelized maple fingerboard with 24 jumbo frets and cascading black dot inlays provides smooth bends in the upper register while remaining chord-friendly at the nut.

  Tonewise, the DK24-6 Nova is loaded with a DiMarzio The Tone Zone DP155 in the bridge and a DiMarzio Air Norton DP193 in the neck - a versatile combination capable of articulate clean tones, harmonically rich leads, and tight, aggressive rhythm sounds suited to Vivaldi's modern progressive style.

  Hardware is anchored by a Gotoh Custom 510 tremolo and Charvel-branded die-cast locking tuners in gold finish, with a Graph Tech TUSQ XL nut and nickel-plated steel strings (.009-.042) rounding out the package.
specs: |-
  - Body: Modified Dinky basswood with scalloped lower back bout
  - Neck: Bolt-on caramelized maple with graphite reinforcement, satin finish
  - Fingerboard: Caramelized maple, 12"-16" compound radius, cascading black dot inlays
  - Scale Length: 25.5" (648 mm)
  - Frets: 24 jumbo
  - Bridge pickup: DiMarzio The Tone Zone DP155
  - Neck pickup: DiMarzio Air Norton DP193
  - Bridge: Gotoh Custom 510 Tremolo
  - Tuners: Charvel-branded die-cast locking
  - Hardware finish: Gold
  - Nut: Graph Tech TUSQ XL (1.6875")
  - Body finish: Satin
  - Color: Lucerne Aqua Firemist
  - Strings: Nickel-plated steel (.009-.042)
  - Model Number: 2972411516
